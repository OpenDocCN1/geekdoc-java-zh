    -1,


    "null",


    "undefined",


    "NaN",


    5/0,


    Infinity


    ];


    var foo;


    var falsies = [


    null,


    undefined,


    foo,


    0,


    NaN,


    ""


    ];


    for (var t=0; t<truthies.length; t++) {


    document.write("<li>" + truthies[t] + " : " + Boolean(truthies[t]) + "</li>");


    }


    for (var f=0; f<falsies.length; f++) {


    document.write("<li>" + falsies[f] + " : " + Boolean(falsies[f]) + "</li>");


    }


    Go to a browser and open that page above; what do you see? You will notice ow
    all the different values are evaluated when they are implicitly converted into
    Booleans.


    Below is a list of how the different values will be converted:


    ValueTruthy or FalsyExplanation


    0falsy0 is always falsy


    “0”truthyall non-sera strings are always truthy


    -1truthyany number that is not 0 is truthy


    nullfalsynull is always falsy


    “null”truthyanother non-zero string, therefore truthy


    undefined falsyundefined is always falsy


    “undefined”truthynon-zero string, truthy


    NaNfalsyNaN is always falsy


    “NaN”truthynon-zero string


    Infinitytruthya reserved keyword and non-zero


    5/0truthyevaluates to Infinity


    ““(empty string)falsyZero strings are always falsy


    “false”truthyNon-zero string


    The reason we have the strictly or triple = (===) comparison operator is type
    coercion. ==, which is the regular equality operator, will apply type coercion
    and, on occasion, your comparisons will not give you the result that you expect.
    Have a look at this example:


    Example:


    var num = 0;


    if (num == "") {


    alert(''Hey, I did not expect to see this.'');


    }


    if (num === "") {


    alert(''This will not be displayed.'');


    }


    We have compared two falsy values in conditional one and they will both be resolved,
    through type coercion, to false. This makes the comparison result as true, most
    likely not what the intent of this code was.


    In order to detect the differences in type, i.e. between string and number, you
    would use the === operator, as you can see in the second if statement.


    Type Coercion


    This is an exercise for you, it should take about 5 to 10 minutes to complete.
    You are going to debug a simple script and fix it:


    *   In your editor, open this page: AdvancedTechniques/Exercises/type-coercion.html


    *   Work out what is wrong with the code


    *   Make the required fixes


    *   Test your solution in your browser


    Solution:


    This is what you should have got:


    var answer = prompt("What is 10-10?","");


    if (answer === "0") {


    alert("Right!");


    } else {


    alert("Wrong!");


    }


    You probably found that a bit harder than you thought it would be, In the original
    code, if the user were to press on OK on their prompt without inputting anything,
    the alert would be “Right!”. This is because it is an empty string – remember,
    empty strings and 0 are both falsy.


    So what do you need to do? Initial thoughts might be that you just change == to
    === as a way of differentiating between types but if you were to do that and test
    it, the alert will always read “Wrong!” even if you used 0.


    The problem here is that the value in the prompt is actually a string and string
    “0” doesn’t strictly equal to number 0\. The answer is to change the condition
    so that it saysanswer===”0”.


    Chapter 3:


    Default Operators


    && and || are Boolean operators that use truthy and falsy to resolve the operands
    to Boolean values. If you have used other programming languages, you will probably
    be thinking that Boolean operator results are always true or false. In JavaScript,
    that isn’t strictly true.


    With the JavaScript language, Boolean operation results are always the value of
    the particular operand that was the determining factor in the operation result.
    Let me make that a little clearer:


    Example:


    var a = 0, b = NaN, c = 1, d = "hi";


    var result = ( a || b || c || d );


    alert("Result: " + result);


    result = ( d && c && b && a );


    alert("Result: " + result);


    ( a || b || c || d ) is the first Boolean expression and it will be evaluated
    left to right until it reaches a conclusion. || is a Boolean OR operator and this
    only requires that one operand is a truthy for the entire result to be true. In
    the case of the example above:


    *   a = 0 and zero is always falsy. The valuation will continue with the rest
    of the operands because falsy isn’t yet determining anything. Only one truthy
    value is required for the entire statement to be true


    *   b is Nan, which is also falsy. The same situation occurs and we must continue
    to evaluate


    *   c is 1 and this is truthy. From here on, we have no need to evaluate any more
    operands because the expression is going to result in true.


    There is a catch though – have you worked it out? Instead of a strictly true result,
    we will get a truthy value that stopped the evaluation, in the case of this example,
    c. the displayed message will read “Result: 1”


    You may already expect that the And operator, && works in pretty much the same
    way but using opposite conditions. This operator will return the value of the
    last operand that was evaluated and that will be either the first falsy or, where
    all the operands are truthy, the final one in the expression. Let’s say that we
    follow the sequence for the expression( d && c && b && a )that we did in the case
    of the OR operator. You will see that both d and c are truthy so you must keep
    on going; when you get to b, a falsy, the evaluation will halt and the return
    will be b with the displayed message reading “Result: NaN”.


    You might be sitting there thinking, what use is any of this? The behavior you
    have seen here, the return of the first value that is conclusive, is a very handy
    behavior to ensure the initialization of a variable.


    Look at the example of a function below:


    function checkLength(text, min, max){


    min = min || 1;


    max = max || 10000;


    if (text.length < min || text.length > max) {


    return false;


    }


    return true;


    }


    In line one and two of the example, we have made sure that a valid value is always
    assigned to min and max. Because of this, the function can be called like checkValue("abc").
    The parameters for both the min and max will start with the value undefined.


    When we get to  min = min || 1;  all we are doing is assigning a value of 1 to
    min, just to make sure that it will override undefined, In the same way, max is
    assigned a value of 10000.


    Were we to have passed the real values for the parameters, as in the examplecheckLength("abc",
    2, 10) these values would have been retained as they are truthy.


    When we use the || operator, we are, in effect giving default values to the parameters
    and that is why we call the operator the default operator, at least in this context.
    The operator is used to replace longer code like:


    if (min === undefined) {


    min = 1;


    }


    To become:


    min = min || 1;


    Have a look at another example of how to use the default operator to shorten your
    code. This code


    var contactInfo;


    if (email) {


    contactInfo = email;


    } else if (phone) {


    contactInfo = phone;


    } else if (streetAddress) {


    contactInfo = streetAddress;


    }


    Can be significantly shortened to:


    var contactInfo = email || phone || streetAddress;


    Note: do be careful when you use this operator with a variable that accepts falsy
    values. Look at this code example to see where the danger lies:


    Example:


    function calculatePrice(basePrice, tax) {


    basePrice = basePrice || 0;


    tax = tax || .1; //default tax is 10%


    var price = (basePrice * (1 + tax)).toFixed(2);


    alert("The price including tax is " + price);


    }


    calculatePrice(100, 0); //no tax'
