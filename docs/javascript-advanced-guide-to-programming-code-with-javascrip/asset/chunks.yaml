    \ [];\n\nif (!reProperName.test(firstName)) {\nerrors[errors.length] = \"You must\
    \ enter a valid first name.\";\n}\nif (!reInitial.test(midInitial)) {\nerrors[errors.length]\
    \ = \"You must enter a one-letter middle initial.\";\n}\nif (!reProperName.test(lastName))\
    \ {\nerrors[errors.length] = \"You must enter a valid last name.\";\n}\nif (!reProperName.test(city))\
    \ {\nerrors[errors.length] = \"You must enter a valid city.\";\n}\nif (!reState.test(state))\
    \ {\nerrors[errors.length] = \"You must enter a valid state.\";\n}\nif (!rePostalUS.test(zipCode))\
    \ {\nerrors[errors.length] = \"You must enter a valid zip code.\";\n}\nif (!reUsername.test(userName))\
    \ {\nerrors[errors.length] = \"You must enter a valid username.\";\n}\n}\n</script>\n\
    </head>\n```\n\n## Challenge Solution:\n\n`RegularExpressions/Solutions/FormValidation-challenge.js`\n\
    \n```javascript\n//Regular Expressions\nvar rePostalUS = /^\\d{5}(\\-\\d{4})?$/;\n\
    var rePostalCA = /^[A-Z]\\d[A-Z] \\d[A-Z]\\d$/;\nvar rePostalUK = /^[A-Z]{2}[0-9]{1,2}\
    \ ?[0-9]{1}[A-Z]{2}$/;\n```\n\n## Challenge Solution:\n\n```html\n<!DOCTYPE HTML>\n\
    <html>\n<head>\n<meta charset=\"UTF-8\">\n<title>Registration Form</title>\n<script\
    \ type=\"text/javascript\" src=\"FormValidation-challenge.js\"></script>\n<script\
    \ type=\"text/javascript\">\nfunction validate(form){\nif (!rePostalUS.test(zipCode)\n\
    && !rePostalCA.test(zipCode)\n&& !rePostalUK.test(zipCode))\n{\nerrors[errors.length]\
    \ = \"You must enter a valid postal code.\";\n}\nreturn true;\n}\n</script>\n\
    </head>\n```\n\n# Chapter 13: Cleaning Up Form Entries\n\nSometimes it is nice\
    \ to clean user entries as soon as they are input and we can do this by using\
    \ a combination of the `replace()` method of string objects and regular expressions.\n\
    \n### The `replace()` Method Revisited\n\nWe already looked at this method and\
    \ how to use it to replace a regular expression match with a string but we can\
    \ also use it together with backreferences and replace a pattern that has been\
    \ matched with a new string. The following example shows this:\n\n```html\n<!DOCTYPE\
    \ HTML>\n<html>\n<head>\n<meta charset=\"UTF-8\">\n<title>ssn</title>\n<script\
    \ type=\"text/javascript\">\nvar reSSN = /^(\\d{3})(\\d{2})(\\d{4})$/;\nfunction\
    \ cleanSsn(ssn){\nif (reSSN.test(ssn)) {\nvar ssn = ssn.replace(reSSN, \"$1-$2-$3\"\
    );\nreturn ssn;\n} else {\nalert(\"INVALID SSN\");\nreturn ssn;\n}\n}\n</script>\n\
    </head>\n<body>\n<form onsubmit=\"return false;\">\n<input type=\"text\" name=\"\
    ssn\" size=\"20\">\n<input type=\"button\" value=\"Clean SSN\"\nonclick=\"this.form.ssn.value\
    \ = cleanSsn(this.form.ssn.value);\">\n</form>\n</body>\n</html>\n```\n\nWe use\
    \ the `replace()` method to clean a social security number that is entered by\
    \ the user. The regular expression `reSSN` has three capture groups: `(\\d{3})`,\
    \ `(\\d{2})`, and `(\\d{4})`. These can be referenced as `$1`, `$2`, and `$3`,\
    \ respectively in the replacement string.\n\n- Open `RegularExpressions/Exercises/PhoneCleaner.html`\
    \ in your editor.\n- This exercise should take you about 15 minutes.\n\n## Challenge\n\
    \nSometimes you find a phone number is a combination of numbers and letters and\
    \ some of these have extra characters. Your challenge is to add in a function\
    \ named `convertPhone()` that will:\n- Strip out every character that is not a\
    \ letter or number\n- Convert every letter to a number as the following list:\n\
    \  - ABC -> 2\n  - DEF -> 3\n  - GHI -> 4\n  - JKL -> 5\n  - MNO -> 6\n  - PQRS\
    \ -> 7\n  - TUV -> 8\n  - WXYZ -> 9\n- It must also pass the initial number to\
    \ the `convertPhone()` function and return the result.\n\nTest out your solution\
    \ in your browser.\n\n```html\n<!DOCTYPE HTML>\n<html>\n<head>\n<meta charset=\"\
    UTF-8\">\n<title>Phone Checker</title>\n<script type=\"text/javascript\">\nfunction\
    \ convertPhone(phone){\nvar convertedPhone;\nconvertedPhone = phone.replace(/[^A-Za-z\\\
    d]/g, \"\");\nconvertedPhone = convertedPhone.replace(/[ABC]/gi, \"2\");\nconvertedPhone\
    \ = convertedPhone.replace(/[DEF]/gi, \"3\");\nconvertedPhone = convertedPhone.replace(/[GHI]/gi,\
    \ \"4\");\nconvertedPhone = convertedPhone.replace(/[JKL]/gi, \"5\");\nconvertedPhone\
    \ = convertedPhone.replace(/[MNO]/gi, \"6\");\nconvertedPhone = convertedPhone.replace(/[PQRS]/gi,\
    \ \"7\");\nconvertedPhone = convertedPhone.replace(/[TUV]/gi, \"8\");\nconvertedPhone\
    \ = convertedPhone.replace(/[WXYZ]/gi, \"9\");\nreturn convertedPhone;\n}\n}\n\
    </script>\n</head>\n```\n"
