    # Introduction


    I want to thank you and congratulate you for owning my book, “JavaScript: Advanced
    Guide to Programming Code with JavaScript”.


    This book contains a whole set of proven steps and strategies to help you learn
    more advanced JavaScript code. I must stress the word “Advanced” here – this book
    is not for you if you have not learnt the basics of JavaScript; it is aimed at
    those with prior knowledge and experience who want to further their knowledge
    and become better JavaScript programmers.


    You can go a long way in JavaScript just by using the basics but if you want to
    make the most of the power that JavaScript has to offer you need to learn a few
    more advanced concepts and techniques. These are designed to help you write code
    that is more expressive and can be reused. These are patterns that define a few
    features that you might not find in other computer programming languages and that
    is what makes this such a unique and powerful language.


    If this is your first computer programming language, you will more than likely
    find some of the patterns a little on the strange side but, with the explanations
    and the examples I have included, as well as me exercises for you to do (With
    the answers!), you will soon become familiar with it. You will find some of the
    chapters in this book are quite short while others are somewhat longer. I have
    tried to keep everything as concise as possible to make it easier for you to take
    it all in. You won’t find any long introductions in each chapter either; you should
    be at a level now where I can jump straight in and explain as I go along!


    Thank you again for reading my book; I truly hope that you find it useful and
    I wish you luck as you work your way through these advanced JavaScript techniques.


    # Chapter 1:


    Optional Function Arguments


    When a function is declared in JavaScript, the function expects would usually
    have an argument list in it:


    Example:


    CODE:


    function sumValues(val1, val2, val3) {


    return val1 + val2 + val3;


    }


    Unfortunately, this won’t guarantee that your function is going to be called,
    every time, with three arguments. It is OK for the function to be passed with
    less or more than three:


    Example:


    var result1 = sumValues(3, 5, 6, 2, 7);


    var result2 = sumValues(12, 20);


    Both of these calls are going to result in some very surprising results from the
    perspective of the caller.


    In the first example, as we are only expecting three arguments, 2 and 7, which
    are the extra values, are going to be ignored. This isn’t good because the value
    that is returned won’t be what was expected by the calling code.


    The second example really isn’t any better; in fact, it’s worse. In this example,
    we only passed two arguments so what happened to val3? The value of val3 will
    be undefined and the result of this is the sum of NaN which really isn’t what
    we wanted so we need to fix this so that this type of situation can be avoided
    in the future:


    Example:


    function sumValues(val1, val2, val3) {


    if (val1 === undefined) {


    val1 = 0;


    }


    if (val2 === undefined) {


    val2 = 0;


    }


    if (val3 === undefined) {


    val3 = 0;


    }


    return val1 + val2 + val3;


    }


    var result1 = sumValues(3, 5, 6, 2, 7);


    var result2 = sumValues(12, 20);


    alert(result1);


    alert(result2);


    If you were to run that again now, you would see that the second function call
    now no longer results in NaN. Instead, we get the result of 32, most likely what
    was expected by the calling code.


    Now we have a function that will add three numbers but there is still something
    missing; it isn’t quite right or very useful. At some time, you are going to want
    to add more numbers and you really don’t want to have to update your code each
    time so it will accept additional parameters. Fortunately, JavaScript has the
    answer.


    Each function, when it is called, will have a variable that is called arguments.
    This variable is an array containing every argument that has been passed to the
    function. So, let’s go back to that example; when you call sumValues for the first
    time, the array will have [3, 5, 6, 2, 7] and the second time it will have [12,
    20].


    What we mean by this is that the passed parameters can be ignored and we can concentrate
    on dealing with the arguments array only. An update to the function would look
    like this:


    Example:


    function sumValues() {


    var sum = 0;


    for (var i = 0; i < arguments.length; i++) {


    sum += arguments[i];


    }


    return sum;


    }


    var result1 = sumValues(3, 5, 6, 2, 7);


    var result2 = sumValues(12, 20);


    alert(result1);


    alert(result2);


    Did you spot that we removed the parameter list? Now the values come straight
    from the array and, when the example is run again, the returned values are right
    and are exactly what the calling code expected.


    What we have now is a full function that will accept any number of parameters
    that you throw at it and it will always return the value as the sum of all arguments.


    # Chapter 2:


    Truthy and Falsy


    As you already know, JavaScript contains a Boolean data type. This data type only
    has two values – true or false. Boolean expressions, for example, a == b, will
    also evaluate to Boolean values but that isn’t all you need to know.'
