  trans: "\n\n```javascript\nconvertedPhone = convertedPhone.replace(/[MNO]/gi, \"\
    6\");\nconvertedPhone = convertedPhone.replace(/[PQRS]/gi, \"7\");\nconvertedPhone\
    \ = convertedPhone.replace(/[TUV]/gi, \"8\");\nconvertedPhone = convertedPhone.replace(/[WXYZ]/gi,\
    \ \"9\");\n\nreturn cleanPhone(convertedPhone.substr(0, 10));\n}\n</script>\n\
    </head>\n<body>\n<form onsubmit=\"return false;\">\n<input type=\"text\" name=\"\
    Phone\" size=\"20\">\n<input type=\"button\" value=\"Convert Phone\" onclick=\"\
    this.form.Phone.value = convertPhone(this.form.Phone.value);\">\n</form>\n</body>\n\
    </html>\n```\n\n# 附录章节：使用 AJAX\n\nAJAX 代表异步 JavaScript 和 XML（Asynchronous JavaScript\
    \ and XML），它是一组技术，例如 `DOM`、`JavaScript`、`HTML`、`XML` 和 `CSS`，这些技术都是相互关联的。AJAX\
    \ 允许你在无需重新加载网页的情况下异步发送和接收数据，这使得速度极快。\n\nAJAX 还允许你只向 Web 服务器发送最重要的信息，而不是整个页面，因此只有有价值的数据会被路由到客户端。这使得你构建和使用的任何应用程序都快得多且更具交互性。AJAX\
    \ 被应用于大量的 Web 应用程序，包括 Facebook、`Gmail`、`Google Maps`、`Twitter` 以及其他数不尽的应用。\n\n\
    ## AJAX 是如何工作的？\n\n当你使用传统的 `JavaScript` 代码并想要从服务器文件或数据库中获取某些信息，或者如果你想向服务器发送某些信息时，你需要创建一个\
    \ `HTML` 表单，并使用 `POST` 或 `GET` 向数据发送或接收数据。终端用户需要点击写有 `SUBMIT` 的按钮来发送或获取答案；然后他们必须等待服务器响应，随后会加载一个带有结果的新页面。\n\
    \n每当用户提交输入时，服务器都会返回一个新页面，正因如此，某些 Web 应用程序运行非常缓慢，而且并不总是对用户友好。当你使用 AJAX 时，`JavaScript`\
    \ 将通过 JavaScript 对象 `XMLHttpRequest` 直接与服务器通信。\n\n通过使用 `HTTP` 请求，网页可以在无需重新加载页面的请求并接收\
    \ Web 服务器的响应。用户留在同一个页面，不会察觉到脚本在发送页面请求或向服务器发送数据，因为这些都在后台运行。\n\n用户将发送一个请求，该请求将执行一个操作。对该操作的响应将显示在一个通过\
    \ `ID` 识别的层中，而无需页面经过完全重加载。这是一个页面 ID 的示例：\n\n```html\n<div id=\"ajaxResponse\"\
    ></div>\n```\n\n接下来，我们将简要查看如何创建 `XMLHttpRequest` 对象并从服务器获取响应：\n\n### 步骤 1：创建对象\
    \ `XMLHttpRequest`。\n\n不同的浏览器将使用不同的方法来创建此对象；Internet Explorer 使用 `ActiveXObject`，而其他某些浏览器使用\
    \ `XMLHttpRequest`，这当然是 `JavaScript` 中的内置对象。\n\n为了创建对象并处理所有不同的浏览器，我们将使用一种称为“捕获与尝试”（catch\
    \ and try）的语句。\n\n```javascript\nfunction ajaxFunction()\n{\n  var xmlHttp;\n\
    \  try\n  {\n    // Firefox, Opera 8.0+, Safari\n    xmlHttp = new XMLHttpRequest();\n\
    \  }\n  catch (e)\n  {\n    // Internet Explorer\n    try\n    {\n      xmlHttp\
    \ = new ActiveXObject(\"Msxml2.XMLHTTP\");\n    }\n    catch (e)\n    {\n    \
    \  try\n      {\n        xmlHttp = new ActiveXObject(\"Microsoft.XMLHTTP\");\n\
    \      }\n      catch (e)\n      {\n        alert(\"您的浏览器不支持 AJAX!\");\n     \
    \   return false;\n      }\n    }\n  }\n}\n```\n\n### 步骤 2：向服务器发送请求\n\n要向服务器发送请求，我们将使用\
    \ `open()` 和 `send()` 方法。\n\n第一个方法接受三个参数——第一个用于定义发送 `GET` 或 `POST` 请求时使用的方法，第二个指定服务器端脚本的\
    \ `URL`，第三个指定请求必须被异步处理。第二个方法用于将请求发送到服务器。\n\n```javascript\nxmlHttp.open(\"GET\"\
    , \"time.asp\", true);\nxmlHttp.send(null);\n```\n\n### 步骤 3：编写服务器端脚本\n\n`responseText`\
    \ 将存储从服务器返回的任何数据，我们想要返回当前时间。为了此，我们将使用 `time.asp`，代码看起来如下：\n\n```asp\n<%\nresponse.expires=-1\n\
    response.write(time)\n%>\n```\n\n### 步骤 4：处理响应\n\n下一步是处理任何返回的响应并将其显示给终端用户：\n\n\
    ```javascript\nxmlHttp.onreadystatechange = function()\n{\n  if(xmlHttp.readyState\
    \ == 4)\n  {\n    document.myForm.time.value = xmlHttp.responseText;\n  }\n}\n\
    xmlHttp.open(\"GET\", \"time.asp\", true);\nxmlHttp.send(null);\n```\n\n### 步骤\
    \ 5：完成代码\n\n最后一步是确定我们何时执行 AJAX 函数。每当用户在用户名文本框中输入内容时，它将在后台运行，整个代码看起来如下：\n\n```html\n\
    <html>\n<body>\n<script type=\"text/javascript\">\nfunction ajaxFunction()\n{\n\
    \  var xmlHttp;\n  try\n  {\n    // Firefox, Opera 8.0+, Safari\n    xmlHttp =\
    \ new XMLHttpRequest();\n  }\n  catch (e)\n  {\n    // Internet Explorer\n   \
    \ try\n    {\n      xmlHttp = new ActiveXObject(\"Msxml2.XMLHTTP\");\n    }\n\
    \    catch (e)\n    {\n      try\n      {\n        xmlHttp = new ActiveXObject(\"\
    Microsoft.XMLHTTP\");\n      }\n      catch (e)\n      {\n        alert(\"您的浏览器不支持\
    \ AJAX!\");\n        return false;\n      }\n    }\n  }\n  \n  xmlHttp.onreadystatechange\
    \ = function()\n  {\n    if(xmlHttp.readyState == 4)\n    {\n      document.myForm.time.value\
    \ = xmlHttp.responseText;\n    }\n  }\n  xmlHttp.open(\"GET\", \"time.asp\", true);\n\
    \  xmlHttp.send(null);\n}\n</script>\n<form name=\"myForm\">\n  姓名: <input type=\"\
    text\" name=\"username\" onkeyup=\"ajaxFunction();\"/>\n  时间: <input type=\"text\"\
    \ name=\"time\" />\n</form>\n</body>\n</html>\n```\n\n## 总结\n\n这是对 AJAX 如何工作以及它能做什么简单介绍。互联网上有大量信息供你进一步研究，但请确保你先熟悉了\
    \ `JavaScript`。\n\n再次感谢阅读本书！\n\n希望这本书能够帮助你理解并掌握 `JavaScript` 的一些高级技巧，并希望你发现练习很有用——它们设计用于测试你的知识并帮助你更快学习。\n\
    \n下一步是实践。无论你已经读了多少或学了多少，如果你不练习，很快就会忘记。计算机编程的本质是事物会经常变化。\n\n最后，如果这本书带给你任何价值并在任何方面对你有帮助，我想请你帮个忙，如果你愿意在\
    \ Amazon 上为这本书留一个评价吗？我将不胜感激！\n\n感谢你并祝你好运！\n\n查看我的其他书籍：\n\n在下方你可以找到我写的其他在 Amazon\
    \ 和 Kindle 上同样流行的 Java 书籍。只需点击下面的链接即可查看。\n\n或者，你可以访问我在 Amazon 上的作者页面来查看我的其他作品。\n\
    \n[JavaScript: Tips and Tricks to Programming Code with JavaScript](http://a.co/iiFdxVR)\n\
    \n[JavaScript: Beginner's Guide to Programming Code with JavaScript](http://a.co/fjoFfof)\n\
    \n注意：如果由于某种原因链接无效，你只需在 Amazon 网站上搜索这些标题来找到它们。\n\n《JavaScript: Best Practices to\
    \ Programming Code with JavaScript》预览\n\nJavaScript 最佳实践\n\n针对初学者\n\n"
- fmt: "\nOf course, it would be next to impossible to cover every trick to help you\
    \ learn the best practices for JavaScript. Instead, we want to focus on the main\
    \ attributes you will come across as you learn to code. In the chapter to follow,\
    \ we will provide you with some of the simpler best practices to get you on the\
    \ right path. Remember that there is always more information to learn about coding.\n\
    \nThis is just an excellent start!\n\n- DO NOT declare Boolean Objects, Strings,\
    \ or Numbers\n- DO Initialize Any Variables\n- DO NOT use `newObject()`\n- DO\
    \ use Parameter Defaults\n- DO NOT use Automatic Type Conversions\n- DO use `\"\
    Timer\"` to Optimize Code\n- DO NOT Pass String to `\"SetTimeOut\"` or `\"SetInterval\"\
    `\n- DO use `\"For in\"` Statements\n- DO NOT use `\"With\"` Statements\n\n##\
    \ 1. DO NOT declare Boolean Objects, Strings, or Numbers\n\nWhile you are coding,\
    \ it is very important that you treat your Booleans, strings, and numbers as primitive\
    \ values. You will not want to see these as objects. If you define any of these\
    \ codes as objects, it could produce bad side effects and will just slow down\
    \ the speed of your execution.\n\nHere is a quick example:\n\n```\nvar x= \"Joe\"\
    ;\nvar y= new String (\"Joe\");\n(x ===y)\n```\n\n- As you can see, this will\
    \ be false due to the fact that `x` is a string while `y` is an object. It will\
    \ throw an error, and this is something you can avoid!\n\n## 2. DO Initialize\
    \ Any Variables\n\nWhether you are learning code, or are just looking to fix your\
    \ skills, it is great practice to initialize your variables as you declare them.\
    \ When you do this, it will help avoid undefined values, it will provide you with\
    \ a single place to do this, and it will help give you a cleaner code.\n\n## 3.\
    \ DO NOT use `newObject()`\n\nWhile this is something we touched on a bit earlier,\
    \ it is important to remember. Here is a quick cheat sheet to help you remember\
    \ which code to use compared to its similar code. By being organized, you can\
    \ keep your code clean.\n\n- DO USE: `{}` DO NOT USE: `new Object()`\n- DO USE\
    \ `0` DO NOT USE: `new Number()`\n- DO USE: `\" \"` DO NOT USE: `new String()`\n\
    - DO USE `false` DO NOT USE: `new Boolean()`\n- DO USE `function () {}` DO NOT\
    \ USE: `new Function()`\n- DO USE `/()/` DO NOT USE: `new RegExp()`\n- DO USE\
    \ `[]` DO NOT USE: `new Array()`\n\n## 4. DO use Parameter Defaults\n\nWe invite\
    \ you to ask a moment to ask yourself, what do I remember about functions? What\
    \ do you call it when your function is missing an argument? That's right! The\
    \ value of that missing argument will be called `undefined`. If you weren't already\
    \ aware, these `undefined` values can and will break your code. To break this\
    \ habit, try your best to assign values to your arguments automatically.\n\nHere\
    \ is an example:\n\n```\nfunction myFunction (x, y) {\n  if ( x === undefined)\
    \ {\n    x= 1;\n  }\n}\n```\n\n## 5. DO NOT use Automatic Type Conversions\n\n\
    While you are coding, you will want to be aware of the numbers that could be converted\
    \ to `NaN` or strings. If you need a refresher, `NaN` stands for Not a Number.\
    \ This is something that can happen automatically due to the fact that JavaScript\
    \ is typed loosely. The variables in your code can change the data type as well\
    \ as contain a few different types of data.\n\nHere is a quick example:\n\n```\n\
    var x = \"Hey\";\n```\n\n- In this case, `x` is a string but if you were to continue;\
    \ `x= 4;`\n- Then, this changes your `x` to a number. You can see where this could\
    \ cause errors in your code.\n\nYou also should be aware that your JavaScript\
    \ will convert numbers into strings if you are doing mathematical problems. If\
    \ you type it the wrong way, it will give you an answer, but it may not be the\
    \ one you wanted. Here is a quick example:\n\n- In this example, `typeof x` will\
    \ be a number\n```\nvar x = 5+ 7; // x.valueOf() will be 12\n```\n\n- In this\
    \ next example, the `typeof x` will be a string\n```\nvar x = 5+ \"7\"; // x.valueOf()\
    \ will be 57\n```\n\nIn a different case, you could try to use your function to\
    \ subtract one string from another string. In this case, it will return as `NaN`.\n\
    \nUse this example:\n\n```\n\"Goodbye\" – \"Love\" // This will return as NaN\n\
    ```\n\n## 6. DO use `\"Timer\"` to Optimize Code\n\nThis practice is super simple.\
    \ Are there ever times that you need a quick way to determine exactly how long\
    \ your operation will take? Luckily, Firebug has a `\"timer\"` feature that will\
    \ log the results for you! Sometimes it helps to have some tricks on the side\
    \ to help your coding along.\n\nHere is the code for that:\n\n```\nfunction TimeTracker\
    \ () {\n  console.time (\"MyTimer\");\n  for (x=4000; x > 0; x--) {}\n  console.timeEnd\
    \ (\"MyTimer\");\n}\n```\n\n## 7. DO NOT Pass String to `\"SetTimeOut\"` or `\"\
    SetInterval\"`\n\nRemember when we told you not to use the `\"eval` function?\
    \ This code will function the same way. This is why we suggest never passing the\
    \ string to `SetTimeOut` or `SetInterval`. Unfortunately, this code is super inefficient.\n\
    \nInstead of this code:\n\n```javascript\nsetInterval (\n  \"document.getElementById('container').innerHTML\
    \ _+= 'The New Number: ' + I\" , 2000\n);\n```\n\nUse this one:\n\n```javascript\n\
    setInterval(someFunction, 2000);\n```\n\n## 8. DO use `\"For in\"` Statements\n\
    \nSometimes when you loop items in an object, you may have noticed that at the\
    \ same time, you retrieve the method functions as well. If you do not want this\
    \ to happen, there is a way you can wrap your code as an `if` statement. This\
    \ way, it will filter your information.\n\nHere is an example:\n\n```javascript\n\
    for (key in object) {\n  if(object.hasOwnProperty(key)) {\n    //do something\n\
    \  }\n}\n```\n\n## 9. DO NOT use `\"With\"` Statements\n\nNow, this coding tip\
    \ is up for debate. On the one hand, `\"with\"` statements truly sound like a\
    \ good idea to use. In retrospect, a `\"with\"` statement should be able to be\
    \ used as a shorthand to access any objects that could be deeply nested in your\
    \ code.\n\nHere is an example:\n\n```javascript\nwith (person.woman.bodyparts)\
    \ {\n  hand = true;\n  foot= true;\n}\n```\n\n- As we noted, you would use these\
    \ statements instead:\n```javascript\nperson.woman.bodyparts.hand= true;\nperson.woman.bodyparts.foot=\
    \ true;\n```\n\nAfter some tests, it was found that these codes behaved badly,\
    \ especially when setting up new members. Instead of using `\"with\"` you can\
    \ use `var` and get the proper results.\n\n### About the Author\n\nCharlie Masterson\
    \ is a computer programmer and instructor who have developed several applications\
    \ and computer programs.\n\nAs a computer science student, he got interested in\
    \ programming early but got frustrated learning the highly complex subject matter.\n\
    \nCharlie wanted a teaching method that he could easily learn from and develop\
    \ his programming skills. He soon discovered a teaching series that made him learn\
    \ faster and better. Applying the same approach, Charlie successfully learned\
    \ different programming languages and is now teaching the subject matter through\
    \ writing books.\n\nWith the books that he writes on computer programming, he\
    \ hopes to provide great value and help readers interested to learn computer-related\
    \ topics.\n"
