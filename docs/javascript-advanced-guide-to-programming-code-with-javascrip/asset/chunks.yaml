    \ `if (1) {alert('Hi')}`，`1` 将被解释为 `true`，这意味着 `alert` 将出现。值 `1` 被称为真值（truthy），而值\
    \ `0` 是假值（falsy）。\n\n当我们在在布布尔值的上下文中中使用它时，你可以使用任何 JavaScript 表达式：\n\n### 示例\n\n\
    ```javascript\nvar truthies = [\n  \"false\",\n  \"0\",\n  -1,\n  \"null\",\n\
    \  \"undefined\",\n  \"NaN\",\n  5/0,\n  Infinity\n];\n\nvar foo;\nvar falsies\
    \ = [\n  null,\n  undefined,\n  foo,\n  0,\n  NaN,\n  \"\"\n];\n\nfor (var t=0;\
    \ t<truthies.length; t++) {\n  document.write(\"<li>\" + truthies[t] + \" : \"\
    \ + Boolean(truthies[t]) + \"</li>\");\n}\n\nfor (var f=0; f<falsies.length; f++)\
    \ {\n  document.write(\"<li>\" + falsies[f] + \" : \" + Boolean(falsies[f]) +\
    \ \"</li>\");\n}\n```\n\n打开浏览器并打开上面的页面；你看到了什么？你会注意到所有不同的值在隐式转换为布尔值时是如何被求值的。\n\n\
    以下是不同值的转换列表：\n\n| 值 | 真值或假值 | 解释 |\n| :--- | :--- | :--- |\n| `0` | 假值 | `0` 总是假值\
    \ |\n| `“0\"` | 真值 | 所有非空字符串始终是真值 |\n| `-1` | 真值 | 任何不是 `0` 的数字都是真值 |\n| `null`\
    \ | 假值 | `null` 总是假值 |\n| `“null\"` | 真值 | 另一个非零字符串，因此是真值 |\n| `undefined` | 假值\
    \ | `undefined` 总是假值 |\n| `“undefined\"` | 真值 | 非零字符串，真值 |\n| `NaN` | 假值 | `NaN`\
    \ 总是假值 |\n| `“NaN\"` | 真值 | 非零字符串 |\n| `Infinity` | 真值 | 预留关键字且非零 |\n| `5/0` |\
    \ 真值 | 结果为 `Infinity` |\n| `\"\"` (空字符串) | 假值 | 空字符串始终是假值 |\n| `“false\"` | 真值\
    \ | 非零字符串 |\n\n我们之所以拥有严格相等或三等 `=` (`(===)`) 比较运算符是因为类型转换。`==` 是普通的相等运算符，它会应用类型转换，在某些情况下，你的比较可能不会得到预期的结果。看这个例子：\n\
    \n### 示例\n\n```javascript\nvar num = 0;\n\nif (num == \"\") {\n  alert('Hey, I\
    \ did not expect to see this.');\n}\n\nif (num === \"\") {\n  alert('This will\
    \ not be displayed.');\n}\n```\n\n我们在第一个条件语句中比较了两个假值，它们都会通过类型转换解析为 `false`。这导致比较结果为\
    \ `true`，这很可能不是这段代码的意图。\n\n为了检测类型差异（即字符串和数字之间的差异），你会使用 `===` 运算符，正如你在第二个 `if`\
    \ 语句中看到的那。\n\n## 类型转换\n\n这是一个练习，完成它大约需要 5 到 10 分钟。你将调试一个简单的脚本并修复它：\n\n*   在你的编辑器中，打开此页面：`AdvancedTechniques/Exercises/type-coercion.html`\n\
    *   找出代码中的错误\n*   进行必要的修复\n*   在浏览器中测试你的解决方案\n\n### 答案：\n\n这是你应该得到的结果：\n\n```javascript\n\
    var answer = prompt(\"What is 10-10?\",\"\");\n\nif (answer === \"0\") {\n  alert(\"\
    Right!\");\n} else {\n  alert(\"Wrong!\");\n}\n```\n\n你可能发现这比你想象的要难。在原始代码中，如果用户在提示框中不输入任何内容直接点击\
    \ OK，alert 将显示“Right!”这是因为这是一个空字符串——记住，空字符串和 `0` 都是假值。\n\n所以你需要做什么？最初的想法可能只是将\
    \ `==` 改为 `===` 来区分类型，但如果你这样做并进行测试，即使使用了 `0`，alert 也会一直显示“Wrong!”。这里的问题在于提示框中的值实际上是字符串，而字符串\
    \ “0”并不严格等于数字 `0`。答案是更改条件，使其变为 `answer===\"0\"`。\n\n## 第 3 章：默认运算符\n\n`&&` 和 `||`\
    \ 是布尔运算符，它们利用真值和假值将操作数解析为布尔值。如果你用过其他编程语言，你可能会认为布尔运算符的结果始终为 true 或 false。在 JavaScript\
    \ 中，这并不完全正确。\n\n在 JavaScript 语言中，布尔操作的结果始终是决定操作结果的那个特定操作数的值。让我解释得更清楚一点：\n\n###\
