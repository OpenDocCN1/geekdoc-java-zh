    # Chapter 12:


    Regular Expressions – Form Validation


    When you use regular expressions, you can create some incredibly powerful functions
    that are for form validation. Have a look at this example:


    Example:


    RegularExpressions/Demos/Login.html


    <!DOCTYPE HTML>


    <html>


    <head>


    <meta charset="UTF-8">


    <title>Login</title>


    <script type="text/javascript">


    var reEmail = /^(\w+[\-\.])*\w+@(\w+\.)+[A-Za-z]+$/;


    var rePassword = /^[A-Za-z\d]{6,8}$/;


    function validate(form){


    var email = form.Email.value;


    var password = form.Password.value;


    var errors = [];


    if (!reEmail.test(email)) {


    errors[errors.length] = "You must enter a valid email address.";


    }


    if (!rePassword.test(password)) {


    errors[errors.length] = "You must enter a valid password.";


    }


    if (errors.length > 0) {


    reportErrors(errors);


    return false;


    }


    return true;


    }


    function reportErrors(errors){


    var msg = "There were some problems...\n";


    for (var i = 0; i<errors.length; i++) {


    var numError = i + 1;


    msg += "\n" + numError + ". " + errors[i];


    }


    alert(msg);


    }


    </script>


    </head>


    <body>


    <h1>Login Form</h1>


    <form method="post" action="Process.html" onsubmit="return validate(this);">


    Email: <input type="text" name="Email" size="25"><br/>


    Password: <input type="password" name="Password" size="10"><br/>


    *Password must be between 6 and 10 characters and


    can only contain letters and digits.<br/>


    <input type="submit" value="Submit">


    <input type="reset" value="Reset Form">


    </p>


    </form>


    </body>


    </html>


    The code example start with the definition of a regular expression for an email
    address and one for a password as well so let’s look at each one in turn:


    var reEmail = /^(\w+\.)*\w+@(\w+\.)+[A-Za-z]+$/;


    *   The caret (^) indicates that we should start at the beginning and this stops
    a user from inputting any invalid characters at the start of the email address.


    *   The pattern (\w+[\-\.])* indicates an allowance for a sequence of characters
    (word) that are followed by a dash or a dot. * is used as an indicator that the
    pattern may be repeated 0 times or more and successful patters will include: "ndunn.",
    "ndunn-", "nat.s.", and "nat-s-".


    *   The pattern \w+ will allow for a minimum of one word character


    *   @ will allow for one @ symbol.


    *   The pattern (\w+\.)+ will allow for a sequence of characters (word) that are
    followed by a dot. + is indicative of the pattern being repeated at least once
    or more and this is the domain name minus the last bit, for example, .com


    *   The pattern [A-Za-z]+ will allow for at least one letter and is indicative
    of the last bit, for example, .com


    *   The dollar sign ($) indicates that you should end here. This stops a user
    from inputting invalid characters at the end of their email address


    var rePassword = /^[A-Za-z\d]{6,8}$/;


    *   Same as above. The starting caret stops a user from inputting invalid characters
    at the start of the password


    *   The pattern [A-Za-z\d]{6,8} will allow for a sequence of digits and letter
    that is 6 to 8 characters’ long


    *   Same as above, the dollar sign at the end stops a user from inputting an invalid
    character at the end of a password


    Advanced Form Validation


    This exercise should take you in the region of 25 to 40 minutes.


