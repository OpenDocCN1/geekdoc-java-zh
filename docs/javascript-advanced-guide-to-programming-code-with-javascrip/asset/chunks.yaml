    for (key in object) {


    if(object. hasOwnProperty(key)) {


    //…do something…


        }


    }


    9.DO NOT use "With" Statements


    Now, this coding tip is up for debate. On the one hand, "with" statements truly
    sound like a good idea to use. In retrospect, a "with" statement should be able
    to be used as a shorthand to access any objects that could be deeply nested in
    your code.


    Here is an example:


    with (person.woman.bodyparts) {


    hand = true;


    foot= true;


    }


    •As we noted, you would use these statements instead:


    person.woman.bodyparts.hand= true;


    person.woman.bodyparts.foot= true;


    After some tests, it was found that these codes behaved badly, especially when
    setting up new members. Instead of using "with" you can use "var" and get the
    proper results.


    [Click here to check out the rest of ''JavaScript: Best Practices'' on Amazon.](http://a.co/d75md5p)


    About the Author


    Charlie Masterson is a computer programmer and instructor who have developed several
    applications and computer programs.


    As a computer science student, he got interested in programming early but got
    frustrated learning the highly complex subject matter.


    Charlie wanted a teaching method that he could easily learn from and develop his
    programming skills. He soon discovered a teaching series that made him learn faster
    and better.


    Applying the same approach, Charlie successfully learned different programming
    languages and is now teaching the subject matter through writing books.


    With the books that he writes on computer programming, he hopes to provide great
    value and help readers interested to learn computer-related topics.'
