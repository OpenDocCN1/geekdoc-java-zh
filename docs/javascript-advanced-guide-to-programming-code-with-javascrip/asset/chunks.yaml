    \n### 法律声明：\n本书受版权保护。本书仅供个人使用。未经作者同意，您不能修改、分发、出售、使用、引用或转述本书的任何部分或内容。\n\n### 免责声明：\n\
    请注意，本文档包含的信息仅供教育和娱乐目的。我们已尽一切提供准确、最新、可靠且完整的信息。不提供任何形式的明示或暗示保证。读者承认作者并未在提供法律、财务、医疗或专业建议。在尝试尝试书中概述的任何技术之前，请咨询执业专业人士。\n\
    \n通过阅读本文，读者同意在任何情况下，作者对因使用本文包含的信息而导致的任何直接或间接的损失（包括但不限于错误、遗漏或不准确）不负责。\n\n# 引言\n\
    \n我想感谢你的阅读，并祝贺你拥有了我的书籍《JavaScript 编程代码高级指南》。\n\n本书包含了一系列经过验证的步骤和策略，帮助你学习更高级的 JavaScript\
    \ 代码。我必须强调“高级”这个词——如果你还没有学习 JavaScript 的基础，那么这本书并不适合你；它针对那些具有已有知识和经验、希望进一步深知识并成为更好的\
    \ JavaScript 程序员的人士。\n\n仅使用基础知识就能在 JavaScript 中走得很远，但如果你想充分利用 JavaScript 提供的力量，你就需要学习更多高级的概念和技术。这些技术旨在帮助你编写更具表现力且可重用的代码。这些模式定义了一些可能在其他计算机编程语言中找不到的特性，而这正是它成为一种独特且强大的语言的原因。\n\
    \n如果这是你的第一门计算机编程语言，你可能会发现某些模式有点奇怪，但通过我包含的解释、示例以及供你做的练习（附带答案！），你很快就会熟悉它们。你会发现书中的某些章节非常短，而另一些则较长。我尽量保持所有内容的简洁，以便于你吸收。你不会在每个章节中发现任何冗长的介绍；你现在的水平已经让我可以直接进入主题并边解释边介绍了！\n\
    \n再次感谢阅读我的书；我真心希望你发现它很有用，并祝你在学习这些高级 JavaScript 技术过程中好运。\n\n# 第 1 章：可选函数参数\n\n\
    在 JavaScript 中声明函数时，该函数通常会包含一个参数列表：\n\n示例：\n\n代码：\n\n```javascript\nfunction sumValues(val1,\
    \ val2, val3) {\n  return val1 + val2 + val3;\n}\n```\n\n遗憾的是，这不能保证你的函数每次被调用时都有三个参数。函数在传递时带有较少或较多的参数是可以接受的。\n\
    \n示例：\n\n```javascript\nfunction sumValues(val1, val2, val3) {\n  if (val1 ===\
    \ undefined) {\n    val1 = 0;\n  }\n  if (val2 === undefined) {\n    val2 = 0;\n\
    \  }\n  if (val3 === undefined) {\n    val3 = 0;\n  }\n  return val1 + val2 +\
    \ val3;\n}\n```\n\n如果你调用 `sumValues(1, 2, 3)`，结果是 `6`。如果你调用 `sumValues(1, 2)`，结果是\
    \ `3`。如果你调用 `sumValues(1)`，结果是 `1`。如果你调用 `sumValues()`，结果是 `0`。\n\n然而，在 JavaScript\
    \ 中处理此问题有一个更好的方法。每个函数都有一个名为 `arguments` 的本地变量，它是一个包含所有传递给函数的参数的数组。\n\n示例：\n\n\
    ```javascript\nfunction sumValues() {\n  var sum = 0;\n  for (var i = 0; i < arguments.length;\
    \ i++) {\n    sum += arguments[i];\n  }\n  return sum;\n}\n\nvar result1 = sumValues(3,\
    \ 2, 1); // 6\nvar result2 = sumValues(10, 5); // 15\n\nalert(result1);\nalert(result2);\n\
    ```\n\n2 章：真值与假值\n\n如你所知，JavaScript 包含布尔数据类型。该数据类型只有两个值——true 或 false。布尔表达式，例如\
    \ `a == b`，也会求值为布尔值，但这些并不是你需要的全部。\n\n"
- fmt: "\nWhen you use a non-Boolean expression in a Boolean context, for example,\
    \ an `if` condition, those expressions will implicitly convert to Booleans, in\
    \ a process called type coercion. For example, if you have the expression `if\
    \ (1) {alert('Hi')}`, `1` would be interpreted as `true`, meaning that the `alert`\
    \ will appear. Value `1` is known as truthy while value `0` is falsy.\n\nWhen\
    \ we use that in a context that is expecting a Boolean value, you can use any\
    \ JavaScript expression:\n\n### Example\n\n```javascript\nvar truthies = [\n \
    \ \"false\",\n  \"0\",\n  -1,\n  \"null\",\n  \"undefined\",\n  \"NaN\",\n  5/0,\n\
    \  Infinity\n];\n\nvar foo;\nvar falsies = [\n  null,\n  undefined,\n  foo,\n\
    \  0,\n  NaN,\n  \"\"\n];\n\nfor (var t=0; t<truthies.length; t++) {\n  document.write(\"\
    <li>\" + truthies[t] + \" : \" + Boolean(truthies[t]) + \"</li>\");\n}\n\nfor\
    \ (var f=0; f<falsies.length; f++) {\n  document.write(\"<li>\" + falsies[f] +\
    \ \" : \" + Boolean(falsies[f]) + \"</li>\");\n}\n```\n\nGo to a browser and open\
    \ that page above; what do you see? You will notice how all the different values\
    \ are evaluated when they are implicitly converted into Booleans.\n\nBelow is\
    \ a list of how the different values will be converted:\n\n| Value | Truthy or\
    \ Falsy | Explanation |\n| :--- | :--- | :--- |\n| `0` | falsy | `0` is always\
    \ falsy |\n| `“0\"` | truthy | all non-empty strings are always truthy |\n| `-1`\
    \ | truthy | any number that is not `0` is truthy |\n| `null` | falsy | `null`\
    \ is always falsy |\n| `“null\"` | truthy | another non-zero string, therefore\
    \ truthy |\n| `undefined` | falsy | `undefined` is always falsy |\n| `“undefined\"\
    ` | truthy | non-zero string, truthy |\n| `NaN` | falsy | `NaN` is always falsy\
    \ |\n| `“NaN\"` | truthy | non-zero string |\n| `Infinity` | truthy | a reserved\
    \ keyword and non-zero |\n| `5/0` | truthy | evaluates to `Infinity` |\n| `\"\"\
    ` (empty string) | falsy | Empty strings are always falsy |\n| `“false\"` | truthy\
    \ | Non-zero string |\n\nThe reason we have the strictly or triple `=` (`(===)`)\
    \ comparison operator is type coercion. `==`, which is the regular equality operator,\
    \ will apply type coercion and, on occasion, your comparisons will not give you\
    \ the result that you expect. Have a look at this example:\n\n### Example\n\n\
    ```javascript\nvar num = 0;\n\nif (num == \"\") {\n  alert('Hey, I did not expect\
    \ to see this.');\n}\n\nif (num === \"\") {\n  alert('This will not be displayed.');\n\
    }\n```\n\nWe have compared two falsy values in conditional one and they will both\
    \ be resolved, through type coercion, to `false`. This makes the comparison result\
    \ as `true`, most likely not what the intent of this code was.\n\nIn order to\
    \ detect the differences in type, i.e. between string and number, you would use\
    \ the `===` operator, as you can see in the second `if` statement.\n\n## Type\
    \ Coercion\n\nThis is an exercise for you, it should take about 5 to 10 minutes\
    \ to complete. You are going to debug a simple script and fix it:\n\n*   In your\
    \ editor, open this page: `AdvancedTechniques/Exercises/type-coercion.html`\n\
    *   Work out what is wrong with the code\n*   Make the required fixes\n*   Test\
    \ your solution in your browser\n\n### Solution:\n\nThis is what you should have\
    \ got:\n\n```javascript\nvar answer = prompt(\"What is 10-10?\",\"\");\n\nif (answer\
    \ === \"0\") {\n  alert(\"Right!\");\n} else {\n  alert(\"Wrong!\");\n}\n```\n\
    \nYou probably found that a bit harder than you thought it would be, In the original\
    \ code, if the user were to press on OK on their prompt without inputting anything,\
    \ the alert would be “Right!”. This is because it is an empty string – remember,\
    \ empty strings and `0` are both falsy.\n\nSo what do you need to do? Initial\
    \ thoughts might be that you just change `==` to `===` as a way of differentiating\
    \ between types but if you were to do that and test it, the alert will always\
    \ read “Wrong!” even if you used `0`.\n\nThe problem here is that the value in\
    \ the prompt is actually a string and string “0” doesn’t strictly equal to number\
    \ `0`. The answer is to change the condition so that it says `answer===\"0\"`.\n\
    \n## Chapter 3: Default Operators\n\n`&&` and `||` are Boolean operators that\
    \ use truthy and falsy to resolve the operands to Boolean values. If you have\
    \ used other programming languages, you will probably be thinking that Boolean\
    \ operator results are always true or false. In JavaScript, that isn’t strictly\
    \ true.\n\nWith the JavaScript language, Boolean operation results are always\
    \ the value of the particular operand that was the determining factor in the operation\
    \ result. Let me make that a little clearer:\n\n### Example\n\n```javascript\n\
