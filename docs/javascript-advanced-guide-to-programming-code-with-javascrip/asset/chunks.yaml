    convertedPhone = phone.replace(/[^A-Za-z\\d]/g, \"\");\nconvertedPhone = convertedPhone.replace(/[ABC]/gi,\
    \ \"2\");\nconvertedPhone = convertedPhone.replace(/[DEF]/gi, \"3\");\nconvertedPhone\
    \ = convertedPhone.replace(/[GHI]/gi, \"4\");\nconvertedPhone = convertedPhone.replace(/[JKL]/gi,\
    \ \"5\");\nconvertedPhone = convertedPhone.replace(/[MNO]/gi, \"6\");\nconvertedPhone\
    \ = convertedPhone.replace(/[PQRS]/gi, \"7\");\nconvertedPhone = convertedPhone.replace(/[TUV]/gi,\
    \ \"8\");\nconvertedPhone = convertedPhone.replace(/[WXYZ]/gi, \"9\");\nreturn\
    \ convertedPhone;\n}\n}\n</script>\n</head>\n```\n\n"
