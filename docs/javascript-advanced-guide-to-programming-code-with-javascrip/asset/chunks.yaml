  trans: "\n\n# 正则表达式\n\n*   如果正则表达式的开头有一个插入符号（`^`），它表示正在搜索的字符串必须以此模式开头；\n*   你可以在“food”中找到模式\
    \ `^food`，但在“barfood”中找不到；\n*   如果正则表达式的末尾有一个美元符号（（`$` 符号），它表示正在搜索的字符串必须以此模式结尾；\n\
    *   你可以在“curfoo”中找到模式 `foo$`，但在“food”中找不到；\n\n## 出现次数 (`?` + `*` `{}` `{}`)\n\n\
    这些符号会影响其前一个字符（或者如果你使用括号，则是一组字符）出现的次数：`?`、`*`、`+`、`{}`。\n\n*   问号（`?`）表示前面的字符在模式中必须出现\
    \ 0 次或 1 次；\n*   你可以在“fod”和“food”中找到模式 `foo?`，但在“faod”中找不到；\n*   加号（`+`）表示前面的字符在模式中至少出现\
    \ 1 次；\n*   你可以在“food”、“fod”和“foood”中找到模式 `fo+`，但在“fd”中找不到；\n*   星号（`*`）表示前面的字符在模式中至少出现\
    \ 0 次；\n*   你可以在“fd”、“food”和“fod”中找到模式 `fo*d`；\n*   花括号（`{}`）带有单个参数 `{n}` 表示前面的字符在模式中必须恰好出现\
    \ `n` 次；\n*   你可以在“foood”中找到模式 `fo{3}d`，但在“fooood”或“food”中找不到；\n*   带有两个参数的花括号\
    \ `{n1, n2}` 表示前一个字符在模式中出现的次数在 `n1` 到 `n2` 之间；\n*   你可以在“fooood”、“foood”和“food”中找到模式\
    \ `fo{2,4}`，但在“foooood”中找不到；\n*   带有一个参数且第二个参数为空的花括号 `{n}` 表示前一个字符在模式中至少出现 `n`\
    \ 次；\n*   你可以在“foooood”和“food”中找到模式 `fo{2}`，但在“fod”中找不到。\n\n## 常用字符 (`.` `\\d`\
    \ `\\D` `\\w` `\\W` `\\s` `\\S`)\n\n*   点（`.`）代表换行符以外的任何字符；\n*   你可以在“foad”、“food”、“fo*f”和“fo9d”中找到模式\
    \ `fo.d`；\n*   反斜杠-d（`\\d`）代表任何数字，等于 `[0-9]`；\n*   你可以在“fo1d”、“fo0d”、“fo4d”中找到模式\
    \ `fo\\dd`，但在“fodd”或“food”中找不到；\n*   反斜杠-D（`\\D`）代表数字以外的任何字符，等于 `[⁰-9]`；\n*  \
    \ 你可以在“foad”和“food”中找到模式 `fo\\D`，但在“fo4d”中找不到；\n*   反斜杠-w（`\\w`）代表任何单词字符，如数字、字母和下划线（`_`）；\n\
    *   你可以在“fo_d”、“food”和“fo4d”中找到模式 `fo\\w`，但在“fo*d”中找不到；\n*   反斜杠-W（`\\W`）代表任何非单词的字符；\n\
    *   你可以在“fo&d”、“fo*d)”和“fo.d”中找到模式 `fo\\Wd`，但在“fo d”中找不到；\n*   反斜杠-s（`\\s`）代表任何空白字符，如制表符、空格、换行符等；\n\
    *   你可以在“fo d”中找到模式 `fo\\sd`，但在“food”中找不到；\n*   反斜杠-S（`\\S`）代表除空白以外的任何字符；\n* \
    \  你可以在“food”、“fo*d”和“fo4d”中找到模式 `fo\\Sd`，但在“fo d”中找不到。\n\n## 分组 (`[]`)\n\n我们使用方括号（`[]`）将选项组合在一起：\n\
    \n*   你可以在“fed”和“fad”中找到模式 `f[aeiou]`，但在“food”、“faed”或“fd”中找不到。\n*   模式 `[aeiou]`\
    \ 将匹配“a”、“e”、“i”、“o”或“u”。\n*   你可以在“faed”和“feod”中找到模式 `f[aeiou]{2}d`，但在“fod”、“fed”或“fd”中找不到。\n\
    *   你可以在“Webucator, Inc.”中找到模式 `[A-Za-z]+`，但在“13078”中找不到。\n*   模式 `[A-Za-z]` 将匹配任何字母，无论大小写；\n\
    *   模式 `[A-Z]` 将匹配任何大写字母；\n*   模式 `[a-z]` 将匹配任何小写字母。\n\n## 否定 (`^`)\n\n当插入符号（`^`）在方括号内且位于开头时，它表示否定：\n\
    \n*   你可以在“food”和“fd”中找到模式 `[^aeiou]`。\n\n## 子模式 (`()`)\n\n我们使用括号 `()` 来捕获子模式：\n\
    \n*   你可以在“food”和“fod”中找到模式 `(oo)?`。\n\n## 备选项 (`|`)\n\n我们使用管道符（`|`）作为创建备的方式：\n\
    \n*   你可以在“foo”和“bar”中找到模式 `foo|bar`。\n\n## 转义字符 (`\\`)\n\n我们使用反斜杠（`\\`）来转义字符：\n\
    \n*   你可以在“food.”中找到模式 `\\.`，但在“foo”中找不到。\n\n# 第 12 章：正则表达式 – 表单验证\n\n当你使用正则表达式时，可以创建一些强大的验证函数。来看这个例子：\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"UTF-8\">\n<title>登录</title>\n\
    <script>\nfunction validate(form) {\n    var email = form.Email.value;\n    var\
    \ password = form.Password.value;\n    var errors = [];\n\n    var reEmail = /^(\\\
    w+\\.)*\\w+@(\\w+\\.)+[A-Za-z]+$/;\n    var rePassword = /^[A-Za-z\\d]{6,8}$/;\n\
    \n    if (!reEmail.test(email)) {\n        errors.push(\"请输入有效的电子邮件地址。\");\n \
    \   }\n    if (!rePassword.test(password)) {\n        errors.push(\"密码必须在 6 到\
    \ 8 位之间，且只能包含字母和数字。\");\n    }\n\n    if (errors.length > 0) {\n        var msg\
    \ = \"存在一些问题：\\n\";\n        for (var i = 0; i < errors.length; i++) {\n     \
    \       msg += \"\\n\" + (i + 1) + \". \" + errors[i];\n        }\n        alert(msg);\n\
    \        return false;\n    }\n    return true;\n}\n</script>\n</head>\n<body>\n\
    <h1>登录表单</h1>\n<form method=\"post\" action=\"Process.html\" onsubmit=\"return\
    \ validate(this);\">\n邮箱：<input type=\"text\" name=\"Email\" size=\"25\"><br/>\n\
    密码：<input type=\"password\" name=\"Password\" size=\"10\"><br/>\n<input type=\"\
    submit\" value=\"提交\">\n<input type=\"reset\" value=\"重置表单\">\n</form>\n</body>\n\
    </html>\n```\n\n"
