    response.write(time)


    %>


     Step 4: Consuming the Response


    The next step is to consume whatever response comes back and then display it to
    the end user:


    xmlHttp.onreadystatechange=function()


    {


    if(xmlHttp.readyState==4)


    {


    document.myForm.time.value=xmlHttp.responseText;


    }


    }


    xmlHttp.open(“GET”,”time.asp”,true);


    xmlHttp.send(null);


    }


     Step 5: Completing the Code


    The final step is to determine when we should execute the AJAX function. This
    is going to run in the background whenever a user inputs something into a text
    field for the username and the entire code would look like this:


    <html>


    <body>


    <script type=”text/javascript”>


    function ajaxFunction()


    {


    var xmlHttp;


    try


    {


    // Firefox, Opera 8.0+, Safari


    xmlHttp=new XMLHttpRequest();


    }


    catch (e)


    {


    // Internet Explorer


    try


    {


    xmlHttp=new ActiveXObject(“Msxml2.XMLHTTP”);


    }


    catch (e)


    {


    try


    {


    xmlHttp=new ActiveXObject(“Microsoft.XMLHTTP”);


    }


    catch (e)


    {


    alert(“Your browser does not support AJAX!”);


    return false;


    }


    }


    }


    xmlHttp.onreadystatechange=function()


    {


    if(xmlHttp.readyState==4)


    {


    document.myForm.time.value=xmlHttp.responseText;


    }


    }


    xmlHttp.open(“GET”,”time.asp”,true);


    xmlHttp.send(null);


    }


    </script>


    <form name=”myForm”>


    Name: <input type=”text”


    onkeyup=”ajaxFunction();” name=”username” />


    Time: <input type=”text” name=”time” />


    </form>


    </body>


    </html>


    That is a basic look at how AJAX works and what it can do. There is plenty of
    information available on the internet for you to research this further but do
    ensure you are familiar with advanced JavaScript first.


    Conclusion


    Thank you again for reading this book!


    I hope this book was able to help you to understand and grasp some of the more
    advanced techniques in JavaScript and I hope that you found the exercises useful
    – they are designed to test your knowledge and also to help you learn much quicker.
    It is always better to learn from practical examples, especially with computer
    program languages, rather than just reading and trying to take it in.


    The next step is to practice. It doesn’t matter how much you have read or how
    much you have learned to date; if you don’t practice you will soon lose it. The
    nature of computer programming is that things change on a regular basis. Keep
    up your learning otherwise you will have to go back to basics!


    Finally, if this book has given you value and helped you in any way, then I’d
