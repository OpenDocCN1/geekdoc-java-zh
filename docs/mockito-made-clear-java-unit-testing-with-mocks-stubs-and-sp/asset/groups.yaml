    \ . . 73\n\n# Foreword to Mockito Made Clear\n\nYour ability to write automated\
    \ tests to verify the behavior of code is an essential skill for sustainable agile\
    \ development. Writing tests is easy when the unit of code has no dependencies.\
    \ It gets hard when the code under test is coupled to other prices of code or\
    \ services. As a first step to deal with the dependencies, we should decouple,\
    \ move dependencies away, or even remove them. A good design keeps the dependencies\
    \ low and the code as loosely as possible.\n\nOnce we distill the dependencies\
    \ to the bare minimum, we have to ultimately contend with them to write effective\
    \ tests. That's where this book comes in—kudos for picking it up.\n\nYou need\
    \ two things to be able to write tests for code with dependencies. First you need\
    \ an awesome library to easily create test doubles—the stubs, mocks, and spies—so\
    \ you can focus on the design instead of fighting dependencies. For Java and most\
    \ languages on the JVM, Mockito has become a clear winner over the years. Second,\
    \ along with knowing good ways to write tests, you need to know how to use the\
    \ library really well.\n\nJust like you'd want a library that has been tried and\
    \ tested, one that's around for a while, you'll want to learn from someone who\
    \ has a lot of experience teaching, especially the very topic you're interested\
    \ in learning. You've not only found a book for the topic that you'll benefit\
    \ learning but also a wonderful instructor who's one of the most capable to write\
    \ on this topic. Sit back, relax, get your favorite drink, fire up your IDEs,\
    \ and let Ken lead you into this journey of creating tests to deal with dependencies.\n\
    \nDr. Venkat Subramanian, award-winning author and founder, Agile Developer, Inc.\n"
