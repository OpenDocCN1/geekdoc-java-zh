    ));\n```\n\n现在一切正常。缺少参数匹配器编译器不会识别错误。代码在运行实际测试时才会失败。这是一个很容易修复的问题。\n\n除了基础的 `ArgumentMatchers`，Mockito\
    \ 还包含了另一个类名为 `AdditionalMatchers`，它包含了如 `and`, `not` 等组合值的方法，以及比较关系 `lt`, `le`,\
    \ `geq` 以及各种形式的数组相等性检查。详情见 `AdditionalMatchers` 的 JavaDocs。\n\n现在来看 `ArgumentMatchers`\
    \ 中的最后一类方法——允许你创建自定义匹配器的方法。\n\n# 创建自定义 Argument Matchers\n\n要创建自己的匹配器，`ArgumentMatchers`\
    \ 类有一个名为 `argThat` 的方法，它接受一个 `ArgumentMatcher`（单数）作为参数。`ArgumentMatcher` 是一个包含单个抽象方法的接口，签名如下：\n\
    \n```\nboolean matches(T argument)\n```\n\n该方法在参数符合你实现的条件时返回 `true`，否则返回 `false`。\n\
    \n在 Java 8 添加 lambda 表达式之前的黑暗时代，实现你自己的匹配器并不困难，但非常冗长。文档给出的示例并不具有启发（添加了注释）：\n\n\
    ```java\nListCustomMatcher.java\n```\n\n```java\n// 实现 ArgumentMatcher 接口的自定义匹配器\n\
    class ListOfTwoElements implements ArgumentMatcher<List> {\n    public boolean\
    \ matches(List list) {\n        return list.size() == 2;\n    }\n\n    public\
    \ String toString() {\n        // 在验证错误中打印\n        return \"[list of 2 elements]\"\
    ;\n    }\n}\n\n// 创建 mock\n```\n\n"
