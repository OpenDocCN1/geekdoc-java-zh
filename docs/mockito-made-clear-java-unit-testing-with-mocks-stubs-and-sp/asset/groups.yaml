    \ intuitive. Instead of using thenReturn, use the thenAnswer method, which takes\
    \ its argument as an implementation of the Answer<T> interface.\n\nOngoingStubbing<T>\
    \ thenAnswer(Answer<T>) answer\n\nThe Answer interface has a single method called\
    \ answer:\n\n```\nT answer(InvocationMock invocation) throws Throwable\n```\n\n\
    This code doesn't look terribly at first glance, but the key is the InvocationMock\
    \ argument. Here are the methods in class:\n\n```\npublic interface InvocationMock\
    \ extends Serializable {\n    Object getMock();\n    Method getMethod();\n   \
    \ Object[] getArguments();\n    T getArgument(int index); // return the argument\
    \ at a given index\n    T getArgument(int index, Class<T> clazz);\n    Object\
