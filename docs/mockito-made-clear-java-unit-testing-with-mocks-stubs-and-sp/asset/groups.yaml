    Most of the static methods in the ArgumentMatchers class are intuitive, though
    there are over forty of them, they fall into a handful of categories:


    +   * Methods that match instance of primitive types: anyByte, anyShort, anyInt,
    anyLong, anyFloat, anyDouble, anyChar, and anyBoolean. These methods work exactly
    the way you expect.

    * Methods that match collections, like anyCollection, anyList, anySet, and anyMap.
    These methods match any non-null collection of the specified type.

    * Methods that work on strings, like anyString, startsWith, endsWith, and the
    two overloads of matches, one that takes a regular expression as a string and
    the other a Pattern.

    * General-purpose matchers for nulls, which is isNull and isNotNull (and its companion,
    notNull, which is just an alias), and nullable(Class), which matches either null
    or a given type.

    * For types, the matcher isClass(Class) matches any argument that is assignable
    to a of of the class.. That leads any((), matches any instance of the specified
    type, excluding nulls, and the ultimate matcher, any, which matches anything,
    including nulls and varargs.


    The class includes one set of overloaded matchers called eq, which may seem puzzling.
    In the next section, we will look at these methods and the reason they exist,
    uncovering an easy trap to fall into when verifying mocks.


