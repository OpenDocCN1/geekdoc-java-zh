    \ method for the requested ID does not exist in the database:\n\n```java\nPersonServiceTest.java\n\
    @Test\npublic void findByIdThatDoesNotExist() {\n```\n\n```java\nwhen(repository.findById(anyInt())\n\
    \    .thenReturn(Optional.empty());\nList<Person> personList = service.findByIds(999);\n\
    assertTrue(personList.isEmpty());\nverify(repository).findById(anyInt());\n}\n\
    ```\n\nThe anyInt method was used when setting the expectations and when verifying\
    \ them. The method anyInt is a static method in the ArgumentMatchers class, which,\
    \ like many of the methods you use in Mockito on a regular basis, the method is\
    \ static, so you might expect, you'll use a static import to access it. That's\
    \ why the syntax used in tests is simply anyInt() rather than ArgumentMatchers.anyInt().\n\
    \n# Where Is the Static Import of ArgumentMatchers?\n\n> The ArgumentMatchers\
    \ class contains a wide range of useful static methods that return argument matchers.\
    \ Each of the returned values implements the ArgumentMatcher interface. Generally,\
    \ you'll find it easier to use static methods before implementing your own custom\
    \ matchers.\n\nIf you look at tests, however, you'll notice the only static import\
    \ statement for the Mockito class itself. It turns out that the Mockito class\
    \ extends ArgumentMatchers (plural) class, so the static import of Mockito covers\
    \ both. It's an unusual usage of inheritance, but it makes writing the tests simpler.\n\
    \nHere's a snippet of the ArgumentMatchers methods in the JavaDocs:\n\n![](img/8c17bd3ac8631e54c044c56d594fa853_47_0.png)\n\
    \nreport erratum - discuss\n\nMost of the static methods in the ArgumentMatchers\
    \ class are intuitive, though there are over forty of them, they fall into a handful\
    \ of categories:\n\n- * Methods that match instance of primitive types: anyByte,\
    \ anyShort, anyInt, anyLong, anyFloat, anyDouble, anyChar, and anyBoolean. These\
    \ methods work exactly the way you expect.\n- *Methods that match collections,\
    \ like anyCollection, anyList, anySet, and anyMap. These methods match any non-null\
    \ collection of the specified type.\n- *Methods that work on strings, like anyString,\
    \ startsWith, endsWith, and the two overloads of matches, one that takes a regular\
    \ expression as a string and the other a Pattern.\n- *General-purpose matchers\
    \ for nulls, which is isNull and isNotNull (and its companion, notNull, which\
    \ is just an alias), and nullable(Class), which matches either null or a given\
    \ type.\n- * For types, the matcher isClass(Class) matches any argument that is\
    \ assignable to a of of the class.. That leads any((), matches any instance of\
    \ the specified type, excluding nulls, and the ultimate matcher, any, which matches\
    \ anything, including nulls and varargs.\n\nThe class includes one set of overloaded\
    \ matchers called eq, which may seem puzzling. In the next section, we will look\
    \ at these methods and the reason they exist, uncovering an easy trap to fall\
    \ into when verifying mocks.\n\n# Using the eq Matchers\n\nThe ArgumentMatchers\
    \ class has one category of methods you might not expect: a series of eq methods,\
    \ overloaded for all primitive types, as well as eq(T), which matches any instance\
    \ of class T. Why would you need those methods? To avoid a subtle trap.\n\nIf\
    \ you're stubbing a method that matches more than one argument and you use an\
    \ argument matcher for one of the arguments, you have to use argument matchers\
    \ for all of them.\n\nThe docs are very clear about this requirement and include\
    \ the following example. Say you want to verify that someMethod is called on a\
    \ mock, and someMethod takes three arguments: an integer, a string, and another\
    \ string. If you know what the last string to be, you might think you can just\
    \ provide it, as in the following (Note: this example does not work):\n\n```java\n\
    verify(mock).someMethod(anyInt(), anyString(), \"third argument\");\n```\n\nThis\
    \ call will fail because the first two arguments use matchers, but the last doesn't.\
    \ That's where the eq matchers come in. If you use eq, you can simply rewrite\
    \ the call as:\n\n```java\nverify(mock).someMethod(anyInt(), anyString(), eq(\"\
    third argument\"));\n```\n\nNow everything works. Missing an argument matcher\
    \ is an easy trap to fall into because the compiler doesn't identify it as an\
    \ error. The code won't fail until you run the actual test. It's an easy fix.\n\
    \nGoing beyond the basic ArgumentMatchers, Mockito includes another class, called\
    \ AdditionalMatchers, which includes methods like and, and not, for combining\
    \ values, as well as a comparison relationships, lt, leg, geq, and various forms\
    \ of array equality checks. See the JavaDocs for AdditionalMatchers for details.\n\
    \nNow let's look at the last category of methods in ArgumentMatchers—methods that\
    \ allow you to create custom matchers.\n\n# Creating Custom Argument Matchers\n\
    \nTo create your own matcher, the ArgumentMatchers class has a method called argThat,\
    \ which takes an ArgumentMatcher (singular) as an argument. ArgumentMatcher is\
    \ an interface containing a single abstract method, with this signature:\n\n```\n\
    boolean matches(T argument)\n```\n\nThis method should return true if the argument\
    \ matches whatever condition you implement, and false otherwise.\n\nIn the dark\
    \ days before lambda expressions were added in Java 8, implementing your own matcher\
    \ wasn't exactly difficult, but it was verbose. The example given in the documentation\
    \ is hardly inspiring (comments added):\n\n```java\nListCustomMatcher.java\n```\n\
    \n```java\n// custom matcher that implements the ArgumentMatcher interface\nclass\
    \ ListOfTwoElements implements ArgumentMatcher<List> {\n    public boolean matches(List\
    \ list) {\n        return list.size() == 2;\n    }\n\n    public String toString()\
    \ {\n        //printed in verification errors\n        return \"[list of 2 elements]\"\
    ;\n    }\n}\n\n// create the mock\n```\n"
