    # Acknowledgments


    This book took much longer to write than I expected. Although I could say that
    about every book I''ve worked on, the real reason this book took so long is that
    I kept discovering interesting capabilities in the Mockito framework I either
    had not known or had understood. Even though I''d been using Mockito for years,
    both in practical work and in training classes, I had no idea there was so much
    to it. That''s the best part of writing a book—digging into the parts of the code
    you''d not normally encountered, and Mockito turns out to have parts like that
    in abundance.


    I definitely want to thank the Mockito team for building and maintaining such
    a powerful tool. Let me specifically mention Rafael Winterhalter, who made extensive
    recommendations on a beta version of the book that improved the final product
    immeasurably. I need to thank the other reviewers who submitted comments as well,
    including David Chelminsky, Bauke Scholtz, Ludovico Fischer, Marcin Grzeszczak,
    Marcin Zajajkowski, and Daniel Hinojosa. I''m very grateful for your contributions
    and support.


    Venkat Subramanian also reviewed the book, and I appreciate that, but I want to
    especially thank him for writing the Foreword. I''m always glad to have him involved
    in any project, and we had several "spirited" discussions about Mockito, both
    in terms of how to use it and how to write about it. I try not to tell him too
    often this because I don''t want to feed his ego too much, but it''s an honor
    to consider him as a friend as well as a colleague.


    I''ve been training classes and making presentations involving Mockito on both
    the O''Reilly Learning Platform and the No Fluff, Just Stuff conference tour,
    and I''m grateful to both for the opportunity. There''s no better way to find
    the gaps in your knowledge than to present information to a group of intelligent
    professionals, and I learned a lot about Mockito and testing in general that way.
    I also want to thank my editor, Margaret Eldridge, for providing just the right
    combination of feedback, criticism, and support needed to keep the project moving,
    even as other professional commitments interfered. In fact, the entire team at
    Pragmatic Programmers has been a pleasure to work with, and I highly recommend
    them to anyone who is thinking about writing a technical book.


    Finally, and most especially, I''d like to thank my wife, Virginia, and my son,
    Xander, for their patience with me as I navigated my way through yet another writing
    project. I promise to take a break after this one, and this time I really mean
    it.


    Ken Kousen


    ken.kousen@kousenit.com


    January, 2023


    # Preface


    This book is about the Mockito testing framework, but it''s not an exhaustive
    reference. No books these days try to do that. For any library, the online documentation
    beats printed books every time because it keeps up with new versions of the software
    and can be adjusted to show new features and bug fixes. Where books become valuable
    is a front end to the online docs, that they help you understand what you''re
    getting into and what to expect when you get there. Books are curated content.
    They try to show you what''s important and why.


    For Mockito, a book like this is especially important, because the online documentation
    contains significant gaps. The docs were written by developers who understand
    tools like Mockito that generate mocks, stubs, and spies and help you use them.
    That''s good, in the fact docs focus exactly how to make the framework do you
    want. The downside is that you need to understand the problems that Mockito solves
    ahead of time, and unless you''ve already had experience with similar tools, those
    concepts are probably not obvious.


    This book is intended to fill that gap. It''s about the concepts behind Mockito
    more than showing the details of how to use it. Those details are included, of
    course, for a set of representative examples, but the goal is understanding rather
    than the specific details of the syntax. The online docs are good for syntax (the
    classes and methods in the API) and to a lesser extent, semantics (how to use
    the tool to do what you want), but they don''t explain why Mockito is useful in
    the first place or how it can make your job easier.


    This is exactly what the Pragmatic Answers series is all about. Answers books
    topics that are too big for a simple blog post probably not enough to warrant
    a 300-page book. Books in this series are short and sweet. The goal is to get
    you up and running with the tool in a way that you could devour in a weekend if
    necessary. The end result is to get you started and help you understand the goals,
    the strategies, and the basic tactics of framework. Then you can find any specific
    details in the online resources and know how to apply them.


    Hopefully you will find this book a helpful addition to your library and it''ll
    help you write more productive tests in your Java systems, to be sure your code
    is doing what you want.


    One note about software versions: the current version of Mockito at the time of
    this writing is 4.0.0. You may be using a version from the 2 line or the 3 line.
    That''s fine, because these are the only differences:


    - Mockito 3 is just Mockito 2 with a required Java version of 1.8 or above.

    - Mockito 4 is just Mockito 3 with deprecated items removed.

    - Mockito 5 (soon to be released) is just Mockito 4 with the inline mock maker
    included in the core.


    In other words, all the code in this book is written for Mockito 4 but should
    work on any Mockito version 2.* or above. The Java version will be 11 even though
    the current LTS (Long Term Support) version is 17, not many users in the community
    have moved to that version. All code in the book will work on all Java versions
    from 1.8 through 19.


    The tests are all based on the JUnit testing framework.¹ Appendix 1, Running Mockito
    Tests, on page 71, discusses how to set up a project to include Mockito with both
    JUnit 4 and JUnit 5, using either the Gradle or Maven build tools, and then how
    to run the associated tests.


    Now it''s time to start looking at the types of problems Mockito is designed to
    solve.


    > ¹ https://junit.org/


    # CHAPTER 1


    # Build a Testing Foundation


    Why do we need a tool like Mockito, and how does it makes our lives as developers
    easier?


    Like many developers, I was a career changer. I came from engineering, where I
    spent my time with a lot of math and a lot of (shudder) Fortran. Eventually I
    switched to software, adopted Java in its early years, and retrained for IT. One
    unexpected benefit of this transition was the next time I visited my parents,
    my father told me something in the house was broken, and I was able to reply,
    "Sorry, that''s a hardware problem."


    I feel that way most hardware, and to be honest, about most software too. If the
    code works, I''m happy. If it doesn''t, then I have to narrow down where it''s
    failing. Since everything is interconnected, it can be challenging to isolate
    a particular component to verify it''s working correctly.


    Mockito is a tool that helps you isolate particular components of software. You
    use Mockito to replace dependencies of the components you''re testing so that
    methods in each dependency return known outputs for inputs. That way, if an error
    occurs when testing the component, you know where and why.


    One challenge with using Mockito is that it rests on a foundation of testing principles
    that you need to know how to use the tool correctly. In this chapter we''ll use
    an interesting example to illustrate those foundations so that we can focus on
    how to make Mockito do what you want it to.


    If you''re the kind of person who likes definitions, you can read about the differences
    between mocks, stubs, and spies in Mockito Terminology (Mocks Aren''t Stubs),
    on page 15. Otherwise, we''ll jump right into a project that we need to test is
    simple but sufficiently complex that we''s working correctly. The tests will give
    you confidence that the code is doing its job.

