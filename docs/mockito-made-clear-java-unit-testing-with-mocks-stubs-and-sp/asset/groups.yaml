  - "[PAGE 70]\n\n```\npeople.remove(person);\n}\n// ... other methods from PersonRepository\
    \ ...\n}\n```\n\nTo avoid anyone accidentally removing the synchronized block,\
    \ the save and delete methods were marked final. Say you want to test the PersonService\
    \ with a mock repository, but instead of doing what we've done so far, which is\
    \ to mock the PersonRepository interface itself, you decide to mock the in-memory\
    \ implementation class. Normally that wouldn't be a problem, but what about the\
    \ two final methods?\n\nIf you configure the mock-maker using the steps above,\
    \ nothing changes. The resulting test looks like this:\n\n```\nPersonServiceTest.java\n\
    @Test\nvoid testMockFinalMethod() {\n    // Can mock a class containing final\
    \ methods\n    PersonRepository personRepo = mock(InMemoryPersonRepository.class);\n\
    \    // Set the expectations on (final) save method in the mock\n    when(personRepo.save(any(Person.class)))\n\
    \        .thenAnswer(invocation -> invocation.getArgument(0));\n    // Inject\
    \ the mock\n    PersonService personService = new PersonService(personRepo);\n\
    \    // Test the service\n    List<Integer> ids = personService.savePeople(people.toArray(Person[]::new));\n\
    \    assert(ids).containsExactly(1, 2, 3, 14, 5);\\n    // Verify the save method\
    \ in the mock was invoked five times\n    verify(personRepo, times(5)).save(any(Person.class));\n\
    }\n```\n\nThe test shows that you can mock the class, set expectations on the\
    \ final method (save in this example), and verify that the mocked method was marked\
    \ the proper number of times. You could also mock classes marked the same way.\n\
    \nAdmittedly, there's nothing gained by mocking the class in this case rather\
    \ than simply mocking the associated interface, but in many situations you'll\
    \ have only the class rather than an interface. Assuming you own the class (meaning\
    \ you can modify it), alternative is to extract an interface from the class and\
    \ mock that, if that possibility isn't available, you can mock the class directly."
