    \ 28 页的*Mocking Methods That Return void* 中，我们讨论了如何 mock 不返回的方法，但没有讨论如何测试不返回的方法。这是\
    \ Mockito 轻松解决的难题之一。在本章中，我们将应对 Mockito 可以帮助你解决各种问题：\n\n- 测试返回 void的方法。\n- 捕获 mock\
    \ 方法的实际参数。\n- 使用自定义答案根据调用参数返回返回值。\n- 监视（Spy）真实对象。\n\n我们还将查看 Mockito 如何支持行为驱动开发（BDD）概念¹。然后我们将测试\
    \ void 方法。之后，我们将看到如何捕获 mock 对象上的方法被调用时所使用的实际参数。我们将看到如何让 mock 根据其输入参数返回一个。最后，我们将监视真实对象。\n\
    \n> ¹ https://en.wikipedia.org/wiki/Behavior-driven_development\n\n我应该提到，我把自己缺乏扑克脸看作是一个特性而非缺陷。由于我知道我无法隐藏牌的好坏，所以我我不怎么赌博，即使我玩了的时候，筹码也非常小。尽管如此，如果偶尔能进行一次诈唬也是挺好的。\n\
    \n## 在 Mockito 和 BDDMockito 之间做出选择\n\nMockito 包含两个功能完全相同的独立 API。通常这被认为一种“代码气味”，但两者都有其原因，而且你在实践中会遇到这两种\
