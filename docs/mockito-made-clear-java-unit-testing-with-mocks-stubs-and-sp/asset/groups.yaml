    \ In each case the class is the same. The only difference is how you're using\
    \ it in the test.\n\nWriting your own stubs causes problems:\n\n- If the interface\
    \ you are trying to stub has many methods in it, and you plan to call only one\
    \ or two, you still have to implement all the methods rather than just the ones\
    \ you care about.\n- If you're going to write the stub, you're going to have to\
    \ maintain it as well, so if the required methods change, you'll have to update\
    \ the stub classes.\n- If a class you plan doesn't implement a convenient interface,\
    \ you'll have to create a subclass instead. That may work, but what if the class\
    \ is marked final and can't be extended at all?\n- What if the methods you need\
    \ to stub are static? You can't override static methods.\n- How do you keep track\
    \ that the stubbed methods are invoked the right number of times, in the right\
    \ order, with the right parameters?\n\nThese problems are where Mockito helps.\
    \ Mockito generates mocks and stubs for you. Mockito can generate classes that\
