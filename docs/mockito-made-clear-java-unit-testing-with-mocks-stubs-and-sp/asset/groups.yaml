  - '[PAGE 54]


    that the expected methods were called the right number of times in the right order.


    The Mockito class extends the ArgumentMatchers class, which contains a large number
    of factory methods, like anyint(), to provide most of the argument matchers we
    need. It also includes the method argThat, which takes a custom ArgumentMatcher
    that we can provide as a lambda expression.


    Along the way we identified two potential issues that you need to keep in mind.
    One is that if you use an argument matcher for one argument of a mocked method,
    you need to use matchers for all of them—thus the eq methods that involves primitives,
    you should use their associated methods, like intThat or longThat, instead of
    argThat, to avoid nullability problems associated with unboxing.


    Finally, we looked at the inOrder method, which allows you to verify that mocked
    methods were called in the proper order, even across different mocked dependencies.
    So our mocks now satisfy the full protocol: the mocked methods not only return
    the proper values, as stubs would, but also can check that the methods are called
    the proper number of times, in the expected order.


    You can do a lot with Mockito using just the capabilities we''ve covered so far.
    In the next chapter, however, we''ll move beyond the basics and talk about mocking
    methods that return void, capturing the arguments used when mocked methods are
    called, and using spies to verify the protocol of legacy methods.'
- md: "\n## CHAPTER 4\n\n## Solve Problems with Mockito\n\nI've always preferred chess\
    \ to poker, partly because I have a terrible poker face. It's hard for me to keep\
    \ my emotions out of my expressions, while that's a good idea in chess, it's vital\
    \ in poker, where the other players are constantly trying to judge whether you\
    \ have a good hand or not and adjusting their bets accordingly. Ideally, when\
    \ the other players look at me, I should be returning nothing to make the game\
    \ difficult for them.\n\nNothingness can also cause difficulties when testing.\
    \ In Java, all too often developers write methods that return nothing. Those methods\
    \ are hard to test, because after all, nothing is coming back. Sometimes you also\
    \ have to mock a method that returns nothing, telling it to throw an exception\
    \ for certain inputs. In *Mocking Methods That Return void*, on page 28, we discussed\
    \ how to mock return nothing but not how to test methods that return nothing.\
    \ That's one of the hard problems that Mockito solves easily. In this chapter,\
    \ we'll tackle a variety of problems that Mockito can help you:\n\n- Testing methods\
    \ that return void.\n- Capturing the actual arguments of mocked methods.\n- Using\
    \ custom answers to return values based on invoked arguments.\n- Spying on real\
    \ objects.\n\nWe'll also look at how Mockito supports the concept of Behavior\
    \ Driven Development (BDD).¹ Then we'll look at testing void methods. After that,\
    \ we'll see how to capture the actual arguments used when a method on a mock is\
    \ invoked. We'll see how to make the mock return a value based on its input argument.\
    \ Finally, we'll spy on real objects.\n\n> ¹ https://en.wikipedia.org/wiki/Behavior-driven_development\n\
    \nI should mention that I view my lack of a poker face to be more of a feature\
    \ than a bug. Since I know I can't hide how good or bad my hand is, I don't gamble\
    \ much, and when I do, it's for very small stakes. Still, it would be nice to\
    \ be able to bluff once in a while.\n\n## Deciding Between Mockito and BDDMockito\n\
    \nMockito contains two separate APIs with identical functionality. Normally that's\
    \ considered a “code smell”, but there's a reason for both, and you'll encounter\
    \ both APIs in practice.\n\nSo far when using Mockito, we've started with static\
    \ methods from the Mockito class. You'll find a completely parallel set of methods\
    \ in a subclass of Mockito called `org.mockito.BDDMockito`. The developers added\
    \ the BDDMockito class to support BDD.\n\nWe've been using methods like the when/thenReturn\
    \ pair to set expectations and the verify method to check methods on stubs were\
    \ called. The BDDMockito has a different API to accomplish the same tasks. BDD\
    \ emphasizes writing tests using given, when, and then to represent the setup\
    \ of the test, invoking it immediately: You can probably see the problem immediately:\
    \ Mockito class already has a method called when that's not designed to fit the\
    \ BDD model.\n\nSince the developers of Mockito wanted to support the BDD approach,\
    \ they added the BDDMockito class. In that class, setting the expectations begins\
    \ with the method called given, by variations on when to set the return value.\
    \ This is the signature of the given method in BDDMockito:\n\n```java\npublic\
    \ static <?> BDDDMStubbing<T> given(T methodCall)\n```\n\nIn the regular Mockito\
    \ class, the method is followed in a chain by of thenReturn, thenThrow, or other\
    \ methods. In BDDMockito, the given method is followed by willReturn, willThrow,\
    \ or in the same pattern.\n\nFor example, here is a test of the getMaxId of the\
    \ PersonService, which requires us to mock the findAll method of the PersonRepository:\n\
    \n```java\nPersonServiceTest.java\n@Test\npublic void findMaxId() {\n    when(repository.findAll()).thenReturn(people);\n\
    \    assertThat(service.getHighestId()).isEqualTo(14);\n    verify(repository.findAll());\n\
    }\n```\n\nIf this is written using the corresponding methods in the BDMockito\
    \ class, the test looks like this:\n\n```java\nPersonService.java\n@Test\npublic\
    \ void findMaxIdBDD() {\n    given(repository.findAll()).willReturn(people);\n\
    \    assertThat(service.getTestId()).isEqualTo(14);\n    then(repository).should().findAll();\n\
    }\n```\n\nSetting the expectation simply replaces when given and willReturn with\
    \ willReturn. The verification step is slightly more complicated, because in addition\
    \ to replacing with then, BDMockito requires you to add a should method call before\
    \ specifying the method that was invoked.\n\nWhy is the should method required?\
    \ The verify method from Mockito is overloaded to specify the multiplicity:\n\n\
    ```java\nverify(repository, times(1)).findAll()\n```\n\nCalling the findAll method\
    \ only once is the default, so you can leave it out, as the test. The then method\
    \ in BDMockito doesn't have an overloaded version, however. To specify the multiplicity,\
    \ you put the argument inside should:\n`then(repository).should(times(1)).findAll();`\n\
    \nIt seems odd to be forced to include even when the multiplicity is exactly 1\
    \ (the default), but it does read better to a native English speaker.\n\nThe rest\
    \ of the BDMockito class is simple search-and-replace variations on the Mockito\
    \ methods. You can also use argument matching, including lambda expressions as\
    \ custom matchers, in the usual way.\n\nFor methods that return value (discussed\
    \ in Testing void Using Interactions, on page 46). Mockito requires you to start\
    \ with one of the do methods, like doReturn or doThrow. In BDMockito, the similar\
    \ methods begin with given, as in willReturn or willThrow, as shown in the example\
    \ below:\n\n```java\n//given\nwillThrow(new RuntimeException(\"boo\")).given(mock).foo();\n\
    \n//when\nResult result = systemUnderTest.perform();\n\n//then\nassertEquals(failure,\
    \ result);\n```\n\nNote the usage of \"given/when/then\" comments: the given section\
    \ is for setting the expectations, the when section invokes the method out of\
    \ test, and the then section checks the return value from the test method. Which\
    \ verification is done in this example.\n\nWhich API you decide to use, BDD or\
    \ traditional, is purely a matter of style. Be aware that you'll encounter both\
    \ in practice.\n\nNext up, let's look at testing (as opposed to mocking) methods\
    \ that return void, which provides a nice demonstration of why mocks can be so\
    \ helpful.\n\n## Testing void Methods Using Interactions\n\nAs developers adopt\
    \ a more test-driven style, they learn to avoid writing methods that return nothing.\
    \ It's hard to test methods that return void. It's hard to test methods that return\
    \ void. After all, nothing is coming back, how do you know it worked? Mockito\
    \ can help by letting you check interactions between the class you're testing\
    \ and its mocked dependencies. Let's introduce a new example involving a popular\
    \ architecture these days: a publisher/subscriber system where the publisher sends\
    \ signals to subscribers. (As an aside, this example was adapted from a similar\
    \ one used in Spock.)\n\nHere's a simple Publisher class:\n\n```java\nPublisher.java\n\
    package com.kousen.pubsub;\nimport java.util.ArrayList;\nimport java.util.List;\n\
    \n// Adapted from a similar example in Spock\npublic class Publisher {\n    private\
    \ final List<Subscriber> subscribers = new ArrayList<>();\n\n    public void addSubscriber(Subscriber\
    \ sub) {\n        subscribers.add(sub);\n    }\n\n    // Want to test this method\n\
    \    public void send(String message) {\n        for (Subscriber sub : subscribers)\
    \ {\n            try {\n                sub.receive(message);\n            } catch\
    \ (Exception ignored) {\n                // evil, but what can you do?\n     \
    \       }\n        }\n    }\n}\n```\n\nA Publisher maintains a list of Subscriber\
    \ instances. When the send method is called on the Publisher, it calls the receive\
    \ method on each subscriber, with a string argument. The challenge will be to\
    \ test the send method, which returns nothing. Note also that invoking sending\
    \ doesn't change anything in the publisher, whose only attribute is the list of\
    \ subscribers. To make matters worse, if any of the subscribers throws an exception,\
    \ the publisher catches and ignores it. which is guaranteed to come up on a code\
    \ review but won't help us. The motivation is that if one or more of the subscribers\
    \ throws an exception, we still want the publisher to reach the rest of them.\
    \ Still, it would no doubt be better to log those exceptions somewhere, but that\
    \ might give us something for test, and we're trying to see what to do when nothing\
    \ is available.\n\nThe Subscriber will simply be an interface:\n\n```java\nSubscriber.java\n\
    package com.kousen.pubsub;\npublic interface Subscriber {\n  void receive(String\
    \ message);\n}\n```\n\nThe receive method returns void as well.\n\nHow to test\
    \ the send method in the Publisher? Since the job of the send method is to invoke\
    \ a method on each subscriber, you can use Mock to mock the subscribers and verify\
    \ that each of them had their receive method called with the proper argument.\n\
    \nTo do this, we'll create an instance of Publisher and add two mock subscribers\
    \ to it. In the annotation approach (using @Mock and @InjectMocks) isn't helpful,\
    \ because the publisher doesn't have a constructor or setter method for adding\
    \ subscribers, and its only attribute is a collection of them. This is a case\
    \ where the simple mock method works instead of the annotations, even though that\
    \ means we'll have to instantiate the classes and inject the dependencies ourselves.\n\
    \nHere's the start of the PublisherTest class:\n"
  mdcn: "\n\n## 第 4 章\n\n## 使用 Mockito 解决问题\n\n我一直倾向于下象棋而不是扑克，部分原因是我有非常糟糕的扑克脸。我很难在表情中隐藏自己的情绪，虽然这在下棋中是件好事，但在扑克中至关重要，因为其他玩家会不断试图判断你的牌好不坏，并据此调整下注。理想情况下，当其他玩家看向我时，我应该没有任何反应，从而增加他们玩游戏的难度。\n\
