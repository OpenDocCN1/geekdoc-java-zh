    我记得很久以前，报纸（孩子们，问问你们父母吧）里面有漫画。有一天，我读到一张《片野家族》的漫画，查理·布朗正试图教他的妹妹萨莉 数数。他给她看一张港口的照片并问她：“你看到了多少艘船？”\n\
    \n她回答：“所有的。”\n\n她会成为一名出色的软件工程师。她的答案虽然没用，但能通过所有基础单元测试。\n\n在本章中，我们将查看 `ArgumentMatchers`（复数）类中的许多方法，这些是静态工厂方法，用于产生实现\
    \ `ArgumentMatcher`（单数）接口的对象。我们还将如何使用 lambda 表达式实现我们自己的匹配器。\n\n# 使用现有的 Argument\
