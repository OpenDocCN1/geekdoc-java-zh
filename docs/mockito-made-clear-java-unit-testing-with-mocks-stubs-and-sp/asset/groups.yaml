    \ `should` 内部：\n`then(repository).should(times(1)).findAll();`\n\n即使在倍数恰好为 1（默认值）时强制包含\
    \ `when` 似乎很奇怪，但对英语母语者来说读起来更顺畅。\n\nBDDMock 类的其余部分是 Mockito 方法的简单替换变体。你也可以以通常的方式使用参数匹配，包括将\
