    \nUse an Answer if you need the output of mocked methods to be based on your input\
    \ arguments.\n\n# Spying to Verify Interactions\n\nFinally, let's talk about spies.\
    \ A spy is an object that wraps an actual dependent instance, which allows you\
    \ to track the interactions between the class test and the spies. A spy sits in\
    \ the class you are testing and its dependencies. This gives you two capabilities:\n\
    \n- 1. You can intercept method calls to the dependencies for later verification.\n\
    - 2. You can mock some methods in the dependencies rather than all of them. This\
    \ is called a partial mock.\n\nWe'll start with a PersonService that uses an actual\
    \ implementation of the PersonRepository interface, called InMemoryPersonRepository.\
    \ The in-memory version internally uses a (synchronized) ArrayList to store the\
