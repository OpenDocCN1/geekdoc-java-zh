- md: "\n## Mocking Constructors\n\n1. The Mocked instance is created in a try-with-resources\
    \ block.\n2. The expectations on the static method use a lambda expression and\
    \ then-Answer call because the mocked reply is based on the input argument.\n\
    3. You can call the getBios method in class under test and check the number of\
    \ results.\n4. Optionally, you can verify that the static method was called the\
    \ right number of times. This version takes a MockStatic.Verification argument,\
    \ where single abstract method apply, takes no arguments and returns void. This\
    \ can call to verify therefore uses a compatible expression lambda, followed by\
    \ the required multiplicity.\n\nThe test works, but it's a bit involved due to\
    \ the additional complexity. You can follow this model whenever you need to mock\
    \ static methods.\n\n## Intics Not Mocked\n\n> Be careful with mocking library\
    \ methods. In addition to violating the principle “Don’t mock what you don’t own,”\
    \ some static methods are “intrinsified” by the JVM, meaning they have their own\
    \ low-level implementations for efficiency. For example, if you try to mock Math.max,\
    \ your version is likely to be ignored because the intrinsic implementation replaces\
    \ the method call.\n\n## Mocking Constructors\n\nSo far, we've been lucky because\
    \ every time we wanted to mock a dependency of a class under test, we had an easy\
    \ way to insert the mock into the class. Most of the time, we've used constructors\
    \ for this purpose, like when we injected a mock of the PersonRepository into\
    \ the PersonService to test the service.\n\nOf course, this wasn't luck at all;\
    \ the applications were designed with constructors like that in mind. But what\
    \ if they weren? What if we had a class that instantiated a dependency as a local\
    \ variable? How would we mock that?\n\nBack in Chapter 1, Build a Testing Foundation,\
    \ on page 1, we looked at a class called HelloMockito, which had two dependencies:\
    \ a PersonRepository and a TranslationService. Here's a reminder:\n\n```\nHelloMockitoRevised.java\n\
    public class HelloMockito {\n    private String greeting = \"Hello, %s, from Mockito!\"\
    ;\n\n    // Dependencies\n    private final PersonRepository personRepository;\n\
    \    private final TranslationService translationService;\n\n    // Constructor\
    \ to inject the dependencies\n```\n\n```\npublic HelloMockito(PersonRepository\
    \ personRepository,\n    TranslationService translationService) {\n    this.personRepository\
    \ = personRepository;\n    this.translationService = translationService;\n}\n\
    ```\n\n```\n// Method we want to test\npublic String get(int id, String sourceLang,\
    \ String targetLang) {\n    Optional<Person> person = personRepository.findById(id);\n\
    \    String name = person.map(Person::getFirst).orElse(\"World\");\n    return\
    \ translationService.translate(\n        String.format(greeting, name), sourceLang,\
    \ targetLang);\n}\n```\n\nWhat, instead of substituting the TranslationService\
    \ implementation from outside, we included a constructor for HelloMockito that\
    \ instantiated the service directly?\n\n```\npublic HelloMockito(PersonRepository\
    \ personRepository)\n    this(personRepository, new DefaultTranslationService());\n\
    ```\n\nThe DefaultTranslationService is a class that implements the TranslationService\
    \ interface. It can be simple or complicated, as needed. For example, a trivial\
    \ implementation could be the following:\n\n```\npublic class DefaultTranslationService\
    \ implements TranslationService {\n    public String translate(String text,\n\
    \        String sourceLanguage,\n        String targetLanguage) {\n        return\
    \ text;\n    }\n}\n```\n\nThis returns the message without modification.\n\nSince\
    \ version 3.5, Mockito has had the ability to mock final. As with mocking static,\
    \ you need to use the mockito-inline dependency to take advantage of it, and you\
    \ should wrap the mocked object inside a try-with-resources block. So could write\
    \ a test for HelloMockito that uses the default translation service this way:\n\
    \n```\n@Test\nvoid greetWithMockedConstructor() {\n    // Mock for repo (needed\
    \ for HelloMockito constructor)\n    PersonRepository mockRepo = mock(PersonRepository.class);\n\
    \    when(mockRepo.findById(anyInt()))\n        .thenReturn(Optional.of(\n   \
    \         new Person(\"Grace\", \"Hopper\", LocalDate.now())));\n```\n\n```\n\
    // Mock for translator (instantiated inside HelloMockito)\ntry (MockedConstruction<DefaultTranslationService>\
    \ ignored =\n    mockConstruction(DefaultTranslationService.class,\n        (mock,\
    \ context) -> {\n            when(mock.translate(\n                anyString(),\
    \ anyString(), anyString())\n            ).thenAnswer(invocation -> invocation.getArgument(0)\
    \ +\n                \" (translated)\"));\n        })) {\n```\n\n```\n// Instantiate\
    \ HelloMockito with mocked repo and\n// locally instantiated translator\nHelloMockito\
    \ hello = new HelloMockito(mockRepo);\nString greeting = hello.greet(1, \"en\"\
    , \"en\");\nassert(greeting).isEqualTo(\n    \"Hello, from Mockito! (translated)\"\
    );\n}\n```\n\nLet's go to test the several methods one by one. Remember, the big\
    \ picture is to test the HelloMockito class. We first need to look up an individual\
    \ in the PersonRepository, so test uses the mock with the when/then construct\
    \ to add Grace Hopper as person with id of 1.\n\nThen comes the part. In a try-with-resources\
    \ block, the static mockConstruction of Method is invoked and has this signature:\n\
    \n```\npublic static <T> MockConstruction<T> mockConstruction(Class<T> class,\
    \ MockedConstruction.Initializer<T> mockInitializer)\n```\n\nThe first argument\
    \ is class we're mocking, which is DefaultTranslationService. The second argument\
    \ is an instance of the MockInitializer<T> interface, which is a functional interface\
    \ (meaning it contains only a single, abstract method). Since it's a functional\
    \ interface, we can implement it using a lambda expression. The single abstract\
    \ method has this signature:\n\n```\nvoid prepare(T mock, MockedConstruction.Context\
    \ context)\n```\n\nThe good news is we don't care about the details. We simply\
    \ add a lambda of two arguments that uses the Mockito API to arrange what we want,\
    \ which is in the following test:\n\n```\n(mock, context) -> when(mock.translate(anyString(),\
    \ anyString(), anyString()))\n.thenAnswer(invocation -> invocation.getArgument(0)\
    \ + \" (translated)\")\n```\n\nIn other words, we're specifying that if we call\
    \ the translate on the method with three instances of anyString, it should reply\
    \ with the first string argument followed by \"(translated)\", just to let us\
    \ know something.\n\nThen, in the block, we instantiate the HelloMockito class\
    \ using single-argument constructor, which in turn instantiates the DefaultTranslationService.\
    \ We then call the greet method and check that the mocked constructor in DefaultTranslationService\
    \ did what we told it to. When we exit the block, Java will automatically invoke\
    \ the close method on MockedConstruction instance because it extends AutoCloseable.\n\
    \nIt's also odd that in our block, we're not using the MockedConstruction reference\
    \ directly, which is we called the variable ignored. We had to assign the result\
    \ of the mockConstruction method in order to use try-with-resources; but remember,\
    \ we're not the ones actually instantiating the DefaultTranslationService, the\
    \ HelloMockito class.\n\nThe process feels involved, but it does the job, which\
    \ is to mock the instantiation of a class as a local variable. We're basically\
    \ intercepting the process and providing our own implementation.\n\nOne quirk\
    \ is that we might have preferred to mock the construction of TranslationService,\
    \ because that's an interface, and the argument to mockConstruction has to be\
    \ a non-abstract Java class. That's why we mocked the DefaultTranslationService.\n\
    \nAny instantiation of TranslationService inside the try block will return the\
    \ mocked instance, and any instantiation before or after the try block will give\
    \ us the original.\n\nBy the way, in this case a simplification is available.\
    \ Instead of using mockWithAnswer method, which takes a class and a default Answer.\
    \ So we could reduce our implementation:\n\n```\nHelloMockitoMockedConstructorTest.java\n\
    @Test\nvoid greetMockedConstructorWithAnswer() {\n    // mock the PersonRepository\
    \ as before ...\n    try (MockedConstruction<DefaultTranslationService> mockConstructionWithAnswer(DefaultTranslationService.class,\n\
    \            invocation -> invocation.getArgument(0) + \n                \"(translated)\"\
    )) {\n\n        Hello hello = new HelloMockito(mockRepo);\n        String greeting\
    \ = hello.greet(1, \"en\", \"en\");\n        assert(greeting).isEqualTo(\"Hello,\
    \ Grace, from Mockito! (translated)\");\n    }\n}\n```\n"
  mdcn: "\n\n## 模拟构造函数\n\n1. `Mocked` 实例是在 `try-with-resources` 块中创建的。\n2. 对静态方法的期望使用了\
    \ Lambda 表达式和 `then-Answer` 调用，因为模拟的回复是基于输入参数的。\n3. 你可以调用被测试类中的 `getBios` 方法并检查结果的数量。\n\
    4. 可选地，你可以验证静态方法被调用的次数是否正确。此版本接受一个 `MockStatic.Verification` 参数，其中单抽象方法 `apply`\
    \ 不接受任何参数并返回 `void`。因此，调用 `verify` 时使用兼容的表达式 Lambda 表达式，后跟所需的倍数。\n\n该测试可以正常工作，但由于额外的复杂性，它显得有些复杂。每当你需要模拟静态方法时，都可以遵循这个模型。\n\
    \n## 未被模拟的内置方法 (Intics)\n\n> 模拟库方法时要小心。除了违反“不要模拟你不拥有的东西”的原则外，某些静态方法被 JVM “内化（intrinsified）”了，这意味着为了效率考虑，它们有自己的低级实现。例如，如果你尝试模拟\
    \ `Math.max`，你的版本可能会被忽略，因为内建实现替换了方法调用。\n\n## 模拟构造函数\n\n到目前为止，我们很幸运，因为每当我们想要模拟被测试类的依赖项时，我们都有简单的方法将模拟对象插入到类中。大多数时候，我们使用构造函数来实现此目的，例如当我们将\
    \ `PersonRepository` 的模拟对象注入到 `PersonService` 中测试该服务时。\n\n当然，这完全不是运气；这些应用程序在设计时就考虑了这种构造函数。但如果它们不是这样呢？如果我们有一个类将依赖项实例化为局部变量会呢？我们该如何模拟它呢？\n\
    \n在第 1 节“构建测试基础”的第 1 页，我们查看过一个名为 `HelloMockito` 的类，它有两个依赖项：`PersonRepository`\
    \ 和 `TranslationService`。这里回顾一下：\n\n```\nHelloMockitoRevised.java\npublic class\
    \ HelloMockito {\n    private String greeting = \"Hello, %s, from Mockito!\";\n\
    \n    // 依赖项\n    private final PersonRepository personRepository;\n    private\
    \ final TranslationService translationService;\n\n    // 用于注入依赖的构造函数\n```\n\n\
    ```java\npublic HelloMockito(PersonRepository personRepository,\n    TranslationService\
    \ translationService) {\n    this.personRepository = personRepository;\n    this.translationService\
    \ = translationService;\n}\n```\n\n```java\n// 我们想要测试的方法\npublic String get(int\
    \ id, String sourceLang, String targetLang) {\n    Optional<Person> person = personRepository.findById(id);\n\
    \    String name = person.map(Person::getFirst).orElse(\"World\");\n    return\
    \ translationService.translate(\n        String.format(greeting, name), sourceLang,\
    \ targetLang);\n}\n```\n\n如果我们不是从外部替换 `TranslationService` 的实现，而是为 `HelloMockito`\
    \ 包含一个直接实例化服务的构造函数，会怎样？\n\n```java\npublic HelloMockito(PersonRepository personRepository)\n\
    \    this(personRepository, new DefaultTranslationService());\n```\n\n`DefaultTranslationService`\
    \ 是一个实现 `TranslationService` 接口的类。它可以根据需要变得简单或复杂。例如，一个简单微不足道的实现如下：\n\n```java\n\
    public class DefaultTranslationService implements TranslationService {\n    public\
    \ String translate(String text,\n        String sourceLanguage,\n        String\
    \ targetLanguage) {\n        return text;\n    }\n}\n```\n\n这在不作修改的情况下返回消息。\n\n\
    从 3.5 版本开始，Mockito 已经有了模拟 `final` 类的能力。与模拟静态方法一样，你需要使用 `mockito-inline` 依赖来利用这一特性，并且你应该将模拟的对象封装在\
    \ `try-with-resources` 块中。因此，你可以这样这样为 `HelloMockito` 编写一个使用默认翻译服务的测试：\n\n```java\n\
    @Test\nvoid greetWithMockedConstructor() {\n    // 仓库的 mock（HelloMockito 构造函数需要）\n\
    \    PersonRepository mockRepo = mock(PersonRepository.class);\n    when(mockRepo.findById(anyInt()))\n\
    \        .thenReturn(Optional.of(\n            new Person(\"Grace\", \"Hopper\"\
    , LocalDate.now())));\n```\n\n```java\n// 翻译器的 mock（在 HelloMockito 内部实例化）\ntry\
    \ (MockedConstruction<DefaultTranslationService> ignored = mockConstruction(DefaultTranslationService.class,\
    \ (mock, context) -> {\n    when(mock.translate(anyString(), anyString(), anyString()))\n\
    \        .thenAnswer(invocation -> invocation.getArgument(0) + \"(translated)\"\
    );\n})) {\n    HelloMockito hello = new HelloMockito(mockRepo);\n    String greeting\
    \ = hello.get(1, \"en\", \"en\");\n    assert(greeting).isEqualTo(\"Hello, Grace,\
    \ from Mockito! (translated)\");\n}\n```\n\n"
