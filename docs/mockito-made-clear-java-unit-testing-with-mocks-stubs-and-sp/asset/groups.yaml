    \ spy 一样，当你想要验证依赖项的方法以正确的顺序被调用了正确的次数，但你仍然想使用依赖本身的真实实例时，它们是有用的。\n\n接下来我们将考虑另一个争议性观点——什么时候应该避免使用\
    \ Mockito？\n\n## 决定何时不使用 Mockito\n\n你可能已经很好掌握了 Mockito 有用的情况。但什么时候使用 Mockito 不是一个好主意呢？让我们探讨这个问题。\n\
    \n如果你查看该案例的 GitHub 仓库，你会发现针对 `AstroGateway` 中 `AstroResponse-getResponse` 方法的测试：\n\
    \n```java\nAstroGatewayTest.java\n@Test\nvoid testDeserializeToRecords() {\n \
    \ AstroResponse result = gateway.getResponse();\n  result.getPeople().forEach(System.out::println);\n\
    \  assertAll(\n    () -> assertTrue(result.getNumber() >= 0),\n    () -> assertEquals(result.getPeople().size(),\
    \ result.getNumber())\n  );\n}\n```\n\n该测试实例化了类并调用了 `getResponse` 方法。检查数据以确认 `AstroResponse`\
    \ 记录的数量是非负的（不可能有负数量的宇航员），并且人员集合的大小与数量匹配。\n\n该实现使用了外部库来完成它的工作：\n\n- 一个用于调用 RESTful\
    \ 服务的 HTTP 客户端。\n- 一个 JSON 解析器将响应转换为 Java records。\n\n因此，该测试可以认为是一个集成测试。这没关系，但这意味着如果这些功能中的任何一个出现问题，测试将会失败。网络可能会中断，或者解析器可能不理解如何处理\
    \ records，或者任何一个库都存在 bug。如果测试通过，说明没问题；但如果没有通过，问题出在哪里？\n\n隔离潜在问题的一种方法是转换为单元测试。想法是同时\
    \ mock 网络库和解析库，以便 `AstroGateway` 作为一个孤立对象进行评估。这个计划很快就会遇到问题。首先，没有明显的方法将 mock 注入到\
    \ `AstroGateway` 类中。它并没有允许你通过 setter 方法、构造函数参数或任何其他方式替换网络或 JSON 库。你如何获取 mock `HttpClient`\
    \ 和 `HttpRequest` 类，你又如何创建一个提供正确行为的 mock `HttpResponse`？\n\n另一个问题——如果库发生了变化怎么办？测试可能仍然有效，因为库被\
    \ mock 了，但一旦你将其投入实践，测试就会因为库内部的新变化而突然崩溃。\n\n最后，通过 mock 库，如果库本身很复杂，单个 mock 可能导致一系列\
    \ mock。例如，你确实需要 mock `HttpClient` 和 `HttpRequest` 的静态方法吗？它们链上的其他方法怎么办？结果将导致测试过于具体且案例非常复杂。\n\
    \n由于这些原因，Mockito 团队的建议是：\n不要 mock\n\n这意味着，对于我们的 `AstroGateway`，集成测试是适当的。mock 所有内容是一种反模式。在评估\
    \ `AstroGateway` 时，请坚持使用集成测试。\n"
