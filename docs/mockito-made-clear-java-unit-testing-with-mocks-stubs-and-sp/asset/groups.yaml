    \ situation is when you're mocking a method and you want the output to be based\
    \ on the input in some way. You can use custom answers, implemented as lambda\
    \ expressions, to handle that.\n\nFinally, we introduced spies, which watch interactions\
    \ between the class under test and its dependences. Spies are controversial when\
    \ used as partial mocks, but they're perfect as a way of monitoring interactions.\n\
    \nIn the next chapter, we'll look at some recent additions to Mockito, like the\
