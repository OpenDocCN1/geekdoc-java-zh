    \    List<Person> findAll();\n\n    long count();\n\n    void delete(Person person);\n\
    }\n```\n\nIn a three-layered architecture typical of modern Java systems, you\
    \ start with a presentation layer of controllers and views, then access a service\
    \ layer that contains business logic and transaction boundaries, and finally go\
    \ through a persistence layer to retrieve data from the database. The PersonRepository\
    \ is part of that last layer, whose job is to convert rows into Java classes and\
    \ back again.\n\nThe class to test is called PersonService and uses a PersonRepository\
    \ as an attribute:\n\n```\nPersonServiceAbbreviated.java\npublic class PersonService\
    \ {\n    private final PersonRepository repository;\n    public PersonService(PersonRepository\
    \ repository) {\n        this.repository = repository;\n    }\n    // methods\
    \ to be tested...\n```\n\nTo act as a data source, we use a Java List<Person>\
    \ as an attribute of the PersonServiceTest:\n\n```\nPersonServiceTest.java\nprivate\
    \ final List<Person> people = Arrays.asList(\n    new Person(1, \"Grace\", \"\
    Hopper\", LocalDate.of(1906, Month.DECEMBER, 9)),\n    new Person(2, \"Ada\",\
    \ \"Lovelace\", LocalDate.of(1815, Month.DECEMBER, 10)),\n    new Person(3, \"\
    Adelle\", \"Goldberg\", LocalDate.of(1945, Month.JULY, 7)),\n    new Person(14,\
    \ \"Anita\", \"Borg\", LocalDate.of(1949, Month.JANUARY, 17)),\n    new Person(5,\
    \ \"Barbara\", \"Liskov\", LocalDate.of(1939, Month.NOVEMBER, 7));\n```\n\nWe'll\
    \ start by adding a method to the service to retrieve all the names of the people\
