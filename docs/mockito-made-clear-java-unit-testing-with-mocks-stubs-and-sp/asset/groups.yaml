    The ArgumentMatchers class has one category of methods you might not expect: a
    series of eq methods, overloaded for all primitive types, as well as eq(T), which
    matches any instance of class T. Why would you need those methods? To avoid a
    subtle trap.


    If you''re stubbing a method that matches more than one argument and you use an
    argument matcher for one of the arguments, you have to use argument matchers for
