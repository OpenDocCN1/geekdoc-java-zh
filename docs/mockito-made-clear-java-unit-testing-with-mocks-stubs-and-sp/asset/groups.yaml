    # 前言


    这本书是关于 Mockito 测试框架的，但它并不是一份详尽的参考书。现在没有书会尝试做到这一点。对于任何库，在线文档总是优于纸质书，因为它可以跟软件的新版本同步，并调整以显示新功能和错误修复。书籍的价值在于它们是在线文档的前端，帮助你理解自己正在进入什么领域，以及到达那里后期待什么。书籍是经过策选的内容。它们试图向你展示什么是重要的以及为什么。


    对于 Mockito 来说，这样本书尤为重要，因为在线文档存在明显的空白。文档是由开发者编写的，他们理解像 Mockito 生成模拟（mocks）、存桩（stubs）和间谍（spies）的工具并帮助你使用它们。这很好，因为文档专注于如何让框架按照你的意愿运行。缺点是，你需要预先理解
    Mockito 解决的问题，除非你已经有了类似工具的经验，否则这些概念可能并不显而易见。


    这本书旨在填补这一空白。它更多是关于 Mockito 背后的概念，而不是展示如何使用的具体细节。当然，为了提供具有代表性的示例，书中包含了这些细节，但目标是理解，而不是语法的具体细节。在线文档对于语法（API
    中的类和方法）很有用，在较小程度上，对于语义（如何使用工具实现你的目标）也很有用，但它们没有解释为什么 Mockito 起初是有用的，或者它如何能让你的工作变得更容易。


    这正是《Pragmatic Answers》（实战解答）系列的核心所在。该系列回答了那些简单的博客文章无法涵盖、但可能不足以写成300页书籍的话题。该系列书籍短小精悍。目标是让你上手该工具，以便在必要时可以在周末内快速掌握。最终结果是让你开始并帮助你理解框架的目标、策略和基本战术。然后你可以在在线资源中找到任何特定细节，并知道如何应用它们。


    希望你会发现这本书是你书架上有益的补充，它将确保帮助你在 Java 系统中编写更高效的测试，确保你的代码运行如你所愿。


    关于软件版本的一个说明：本书编写时 Mockito 的当前版本是 4.0.0。你可能正在使用 2.x 或 3.x 版本。这没关系，因为这些是唯一的区别：


    - Mockito 3 只是 Mockito 2，要求的 Java 版本为 1.8 或以上。

    - Mockito 4 只是 Mockito 3，删除了废弃的项目。

    - Mockito 5（即将发布）只是 Mockito 4，在核心中包含了内联 mock maker。


    换句话说，书中所有的代码都是为 Mockito 4 编写的，但应该可以在任何 Mockito 2.* 或以上版本运行。尽管当前的 LTS（长期支持）版本是
    17，但 Java 版本将是 11，因为社区还没有许多用户迁移到该版本。书中的所有代码适用于从 1.8 到 19 的所有 Java 版本。


    测试全部基于 JUnit 测试框架¹。第71页的附录1“运行 Mockito 测试”讨论了如何使用 Gradle 或 Maven 构建工具配置包含包含 JUnit
    4 和 JUnit 5 的 Mockito 项目，以及如何运行相关测试。


    现在，是时候开始研究 Mockito 设计解决的问题类型了。


    > ¹ https://junit.org/


    # 第1章


    # 构建测试基础


    为什么我们需要像 Mockito 这样的工具，它又是让我们的开发工作变得更轻松的？


    像许多开发者一样，我曾是一个职业转换者。我来自工程工程领域，在那里我的大部分时间都在处理数学和（瑟抖）Fortran。最终我转向了软件，在 Java 早期就开始使用它并接受了重新培训。这次转型的一个意外收获是，下一次我去父母家里时，我父亲告诉我家里某个东西坏了，我能够回答：“抱歉，那是硬件问题。”


    我对大多数硬件都有这种感觉，诚实地说，对大多数软件也是如此。如果代码运行，我很开心；如果不运行，我就需要缩小范围寻找问题。


    Mockito 是一个帮助隔离软件组件的工具。你使用 Mockito 替换测试组件的依赖，以便每个依赖根据输入返回已知输出。这样，当测试组件时发生错误时，你知道在哪里以及为什么。


    使用 Mockito 的挑战在于，它建立在测试原则的基础上，你需要了解这些原则才能正确使用该工具。在本章中，我们将使用一个有趣的示例来说明这些基础，以便我们专注于如何让
    Mockito 执行你想要的操作。


    '
