    \ we write the test for the getLastNames method.\n\n```\nPersonServiceTest.java\n\
    @Test\nvoid getLastNamesUsingMockMethod() {\n    // create a stub for mockRepo\
    \ = new PersonService(mockRepo);\n    PersonRepository mockRepo = mock();\n  \
