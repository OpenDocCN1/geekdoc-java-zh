    \        people.get(1),\n        people.get(2),\n        people.get(3),\n    \
    \    people.get(4));\n\n    // test the service (which uses the mock)\n    assertEquals(List.of(1,\
    \ 2, 3, 14, 15),\n        service.savePeople(people.toArray(Person[]::new)));\n\
    ```"
