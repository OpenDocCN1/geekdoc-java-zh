    , \"Liskov\", \"Lovelace\");\n// Verify the service called findAll on the mockRepo\
    \ exactly\nverify(mockRepo).findAll();\n```\n\nAs the tests, to invoke the method\
    \ to be tested you need an instance of PersonService, and to instantiate that\
