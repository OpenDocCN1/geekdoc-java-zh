    \ Mockito.\n\n# Creating Mocks and Stubs\n\nBefore we use Mockito, note that we\
    \ could write our own stub implementation, called, for example, InMemoryRepository.\
    \ Here's an abbreviated version of that class (the complete version can be found\
    \ in the GitHub repository):\n\n```\nInMemoryRepository.java\npublic class InMemoryRepository\
    \ implements PersonRepository {\n  private final List<Person> people = =\n   \
    \ Collections.synchronizedList(new ArrayList<>());\n\n  @Override\n  public final\
