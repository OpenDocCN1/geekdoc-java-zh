    \n为了完整起见，让我们添加 spy（间谍对象）的定义。\n\n### spy\n\nSpy 是一个封装了实际依赖对象的对象，允许你通过被测试类跟踪对该对象的调用。Spy\
    \ 与 mock（模拟对象）类似，它会记录哪些方法被调用了，但 spy 会在实际的底层对象上调用这些方法，而不是在 stub 上调用。\n\n简而言之，这就是我们在整本书中中使用\
    \ mock、stub 和 spy 术语的方式。\n\n# 为什么不自己写 Stubs？\n\n在像我们的示例这样的简单情况下，你可以很容易地自己创建所需的\
    \ stub，将一个实例注入到被测试类中，并继续下去。GateGateway 就是一个 stub。stub 在给定已知输入的情况下提供已知输出。如果你还想验证服务恰好在网关上调用了一次\
    \ `getResponse`，那么你的同一个对象就会被视为一个 mock。在每种情况下，类都是相同的。唯一的区别在于你在测试中它的它的方式。\n\n自己写\
    \ stub 会引起很多问题：\n\n- 如果你尝试打桩的接口包含很多方法，而你计划只调用其中一两个，你仍然必须实现所有方法，而不仅仅是你关心的那些。\n\
    - 如果你要写这个 stub，你就得要维护它，所以如果所需的方法发生变化，你就必须更新 stub 类。\n- 如果你计划的类没有实现方便的接口，你将不得不创建一个子类。这可能行得通，但如果该类被标记为\
    \ `final` 且完全无法扩展怎么办？\n- 如果你需要打桩的方法是静态的（static）的怎么办？你无法重写静态方法。\n- 你如何跟踪被桩的方法是否以正确的次数、正确的顺序、正确的参数被正确调用？\n\
    \n这些问题正是 Mockito 派上用场的地方。Mockito 为你生成 mocks 和 stubs。Mockito 可以生成实现接口的类。它可以重写类（甚至在有一点帮助的情况下，重写\
    \ `final` 类）。你甚至有能力对桩静态方法。Mockito 会实现接口中的所有方法，使其返回默认值，然后你就可以对它们进行重写。\n\n*报告勘误\
    \ • 16*\n\n现在我们已经看到了集成测试和一个使用我们自己的被桩对象的测试，我们准备好使用 Mockito 来自动化这个过程了。在处理完 Mockito\
