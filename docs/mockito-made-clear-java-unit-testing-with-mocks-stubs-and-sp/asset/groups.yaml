    into practice the test suddenly breaks due to new internal changes inside the
    libraries.


    Finally, with mocking the libraries, a single mock might lead to an entire series
    of mocks if the library itself is complicated. For example, you do need to mock
    the staticnewBuilder methods on HttpClient and HttpRequest? What about the other
    methods chained to them? The result would lead to overly specified tests and very
    complicated cases.


    For all these reasons, the recommendation³ of the Mockito team is this:

    Don''t mock


    That means, for our AstroGateway, an integration test is appropriate. Mocking
    everything is an anti-pattern. When evaluating the AstroService, mocking the AstroGateway
    makes sense. When testing the AstroGateway, stick with an integration test.


    # WireMock


    > The general principle in this section—do not mock classes you don’t is solid.
    So, if your specific use case is to replace a network call with a fake one that
    returns given values, the WireMock⁴ project is a good choice for this purpose.


    # Wrapping Up


    In this chapter, we covered a few of the capabilities of Mockito, namely, how
    to mock final classes and methods and static methods. We looked at the @MockBean
    annotation provided by the Spring Framework that creates a mock and replaces any
    existing instance in the application context.


    Finally, we used our Astro project to uncover reasons for the recommendation from
    the Mockito team to not mock types you don''t.


    Hopefully you now feel ready to use Mockito as it was intended—to make your unit
    tests more robust, reliable, and helpful.


