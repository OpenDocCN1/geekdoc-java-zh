    Consultant, Programmer, Speaker, and Trainer


    Since Mockito''s inception in 2007, the library has gained so many features that
    only few developers keep a full overview. This book summarizes them both neatly
    and briefly. If you are using Mockito, novice or experienced user, this book is
    for you!


    +   - Rafael Winterhalter

    Software Consultant


