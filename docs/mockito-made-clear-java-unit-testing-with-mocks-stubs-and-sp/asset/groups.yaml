    \ Framework\n\nEarlier in Injecting the Mocks into the Class Under Test, on page\
    \ 24, we talked about when using the @InjectMocks annotation. Mockito will do\
    \ its best to plug the mocks into the class under test. The documentation warns\
    \ you, however, that Mockito is not a true dependency injection framework.\n\n\
    As turns out, almost all Java developers regularly work with a true dependency\
    \ injection framework, called the Spring Framework. Spring supported Mockito from\
    \ the beginning, and whenever you create a Spring app, Spring includes the Mockito\
    \ library. Since a full discussion of the Spring Framework is well beyond the\
    \ scope of this book, we'll assume you are familiar with it and are reading this\
    \ section because Spring apps already include Mockito as a test dependency and\
    \ you want to use them together.\n\nThe Spring Boot project provides an annotation\
    \ @MockBean that does two things:\n\n1. It creates a mock object for you, replacing\
    \ the Mockito annotation @Mock.\n2. It replaces any instance of the mocked class\
    \ currently in the ApplicationContext with your mock so that it's available for\
    \ autowiring.\n\nSo in Spring, rather than using @Mock and @InjectMocks, you use\
    \ @MockBean and rely on Spring to instantiate the mocked beans and autowire them\
    \ into your class under test.\n\nSay you have a standard Spring app that involves\
    \ a RESTful web service. It includes a service class, to do business logic and\
    \ mark transaction boundaries, and one or more repository classes that convert\
    \ objects to database tables and back again. The goal is to test the logic in\
    \ the service class without needing a real database, so to need to mock the repositories\
    \ and inject them into the service. That's where the @MockBean annotation comes\
    \ in.\n\nReturning once again to our PersonService that depends on a PersonRepository,\
    \ if this was part of a Spring app, the repository would likely be autowired into\
    \ the service:\n\n```java\nPersonServiceSpring.java\n@Service // Can only autowire\
    \ into a managed bean\npublic class PersonService {\n    private final PersonRepository\
    \ repository;\n\n    @Autowired // Not required if one constructor, but doesn't\
    \ hurt\n    public PersonService(PersonRepository repository) {\n        this.repository\
    \ = repository;\n    }\n\n    // ... methods that use the repository ...\n}\n\
    ```\n\nWhen writing a test for the PersonService outside of Spring, we used @Mock\
    \ on the repository and @InjectMock on the service. That won't work with Spring’s\
    \ autowiring, however. Instead, you use the @MockBean annotation to make the repository\
    \ you want.\n\n```java\nPersonServiceSpringTest.java\n@SpringBootTest\nclass PersonServiceTest\
    \ {\n    @MockBean // Instantiate mock and put into the application context\n\
    \    private PersonRepository repository;\n\n    @Test\n    public void findMaxId()\
    \ {\n        // Set expectations on mock\n        when(repository.findAll()).thenReturn(people);\n\
    \n        // Test service method\n        assertEquals(14, service.getHighestId().intValue());\n\
    \n        // Verify call on mock\n        verify(repository).findAll();\n    }\n\
    }\n```\n\nThe @MockBean annotation on the PersonRepository not only creates a\
    \ mock object, it replaces any existing PersonRepository in the application context\
    \ with the mock. That makes it available for autowiring, and Spring does the rest.\n\
    \nSpring also has a similar annotation called @SpyBean. That annotation wraps\
    \ a Mockito spy around an existing instance of the field. As with spies, they\
    \ are useful when you want to verify that methods on the dependencies got the\
    \ right number of times in the right order, but you still want to use real instances\
    \ of the dependencies themselves.\n\nNext we'll consider another controversial\
    \ notion—when you should avoid using Mockito at all?\n\n## Deciding When Not to\
    \ Use Mockito\n\nYou likely have a good grasp of cases for which Mockito is useful.\
    \ But when is it not the best idea to use Mockito? Let's explore that question.\n\
    \nIf you look in the case's GitHub repository, you'll find a test for the AstroResponse-getResponse\
    \ method in the AstroGateway:\n\n```java\nAstroGatewayTest.java\n@Test\nvoid testDeserializeToRecords()\
    \ {\n  AstroResponse result = gateway.getResponse();\n  result.getPeople().forEach(System.out::println);\n\
    \  assertAll(\n    () -> assertTrue(result.getNumber() >= 0),\n    () -> assertEquals(result.getPeople().size(),\
    \ result.getNumber())\n  );\n}\n```\n\nThe test instantiates the class and invokes\
    \ the getResponse method. The data is checked to confirm the number of the AstroResponse\
    \ record is non-negative (there can't be a negative number of astronauts) and\
    \ that the size of the people collection matches number.\n\nThe implementation\
    \ uses external libraries to do its job:\n\n- An HTTP client to call the RESTful\
    \ web service.\n- A JSON parser to convert the response into Java records.\n\n\
    Consequently, the test is arguably an integration test. That's fine, but it means\
    \ that if something goes wrong with either of those features, the test will fail.\
    \ The network could go down, or the parser might not understand how to work with\
    \ records, or there could be bugs in either library. If the test passes, you're\
    \ good, but if not, where is the problem?\n\nOne way to isolate potential problems\
    \ is to convert to a unit test. The idea would be to mock both the networking\
    \ library and the parsing library so that the AstroGateway be evaluated as a solitary\
    \ object. This plan runs into problems very quickly. For one, there is no obvious\
    \ way to get mocks into the AstroGateway class. It's not designed to allow you\
    \ to substitute other networking or JSON libraries into it, via setter methods\
    \ or constructor arguments or anything else. How are you to get a mock HttpClient\
    \ and HttpRequest the class, and how do you create a mock HttpResponse that will\
    \ provide the right behavior?\n\nAnother problem—what happens if the libraries\
    \ change? The tests may still work, because the libraries are mocked, but as soon\
    \ as you put everything into practice the test suddenly breaks due to new internal\
    \ changes inside the libraries.\n\nFinally, with mocking the libraries, a single\
    \ mock might lead to an entire series of mocks if the library itself is complicated.\
    \ For example, you do need to mock the staticnewBuilder methods on HttpClient\
    \ and HttpRequest? What about the other methods chained to them? The result would\
    \ lead to overly specified tests and very complicated cases.\n\nFor all these\
    \ reasons, the recommendation³ of the Mockito team is this:\nDon't mock\n\nThat\
    \ means, for our AstroGateway, an integration test is appropriate. Mocking everything\
    \ is an anti-pattern. When evaluating the AstroGateway, stick with an integration\
    \ test.\n\n## WireMock\n\n> The general principle in this section—do not mock\
    \ classes you’t—is solid. So, if your specific use case is to replace a network\
    \ call with a fake one that returns given values, the WireMock⁴ project is a good\
    \ choice for this purpose.\n\n## Wrapping Up\n\nIn this chapter, we covered a\
    \ few of the capabilities of Mockito, namely, how to mock final classes and methods\
    \ and static methods. We looked at the @MockBean annotation provided by the Spring\
    \ Framework that creates a mock and replaces any existing instance in the application\
    \ context.\n\nFinally, we used our Astro project to uncover reasons for the recommendation\
    \ from the Mockito team to not mock types you't.\n\nHopefully you now feel ready\
