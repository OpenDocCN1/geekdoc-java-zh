    ### spy\n\nA spy is an object that wraps the actual dependent object, allows you\
    \ to track calls to that object by the class under test. A spy is similar to a\
    \ mock, in it records which methods were called, but a spy invokes those methods\
    \ on the actual underlying object instead of on stub.\n\nIn a nutshell, that's\
    \ how we'll using the terms mock, stub, and spy throughout this book.\n\n# Why\
    \ Not Write Your Own Stubs?\n\nIn simple cases like our example, it's easy to\
