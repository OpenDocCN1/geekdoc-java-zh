    \ You've successfully used Mockito to mock the Gateway, and that concludes round\
    \ of the Mockito API game.\n\nreport erratum • discuss\n\n# Wrapping Up\n\nYou\
    \ can create your mocks manually and insert them into your class under test or\
    \ you can use Mockito's annotation support to inject them automatically. Mockito\
    \ doesn't provide a full injection framework, like Spring or Guice, but it makes\
    \ a good faith effort to plug in your mocks via either constructor injection,\
    \ setter injection, or even field injection.\n\nYou now have the mechanisms for\
    \ telling your mocks (stubs, in this case) what to return when methods are called.\
    \ Chained methods made the process much simpler, and you can use multiple arguments\
    \ to respond to each invocation with different results. You also now know about\
    \ the special handling required to mock methods that return void.\n\nIn the next\
    \ chapter, we'll talk about generalizing the arguments to mocked methods so you\
    \ don't have to give explicit values every time. Mockito has a class that contains\
    \ factory methods for that purpose—we'll also use Java lambdas to implement custom\
    \ argument matchers.\n\n# Use Built-in and Custom Matchers\n\nI remember long\
    \ ago, when newspapers (kids, ask your parents) had comics in them. One day I\
    \ read a Peanuts comic where Charlie Brown was trying to teach his younger sister\
    \ Sally to count. He showed her a picture of a harbor and asked her, “How many\
    \ ships do you see?”\n\nShe replied, \"All of them.\"\n\nShe would have made an\
    \ excellent software developer. Her answer, while useless, would have passed all\
    \ the basic unit tests.\n\nIn this chapter, we will look at the many methods in\
    \ the ArgumentMatchers (plural) class, which are static factory methods to produce\
    \ objects that implement the ArgumentMatcher (singular) interface. We will also\
    \ see how to implement our own matcher using lambda expressions.\n\n# Using the\
    \ Existing Argument Matchers\n\nThe ProjectService class from Chapter 2, Work\
    \ with the Mockito API, on page 19, contains a method called findById(int)...\
    \ That method in turn calls the findById(int) method on the PersonRepository,\
