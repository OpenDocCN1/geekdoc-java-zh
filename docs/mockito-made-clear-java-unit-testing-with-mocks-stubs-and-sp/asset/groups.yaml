    \ . . . . . . . . . . . . . 73\n\n[/content]\n\n[content]\n\n# 《深度解析 Mockito》序言\n\
    \n编写自动化测试以验证代码的能力是敏捷开发的一项基本技能。当代码单元没有依赖时，编写测试非常容易。当待测试代码与其他代码或服务耦合时，情况就会变得困难。作为处理依赖的第一步，我们应该解耦、移动依赖，甚至移除它们。良好的设计会尽可能保持低依赖。\n\
    \n一旦我们将依赖精简到最低，我们最终必须与它们周旋以编写有效的测试。这就是本书的用武之地。\n\n要为带有依赖的代码编写测试，你需要一个强大的库来轻松创建测试双（（Stub、Mock\
    \ 和 Spy），这样你就可以专注于设计而不是与依赖作斗。对于 Java 和大多数 JVM 语言，Mockito 多多年来已成为明显的获胜者。其次，除了需要良好的测试方法外，你还需要学会如何完美使用这个库。\n\
    \n就像你会想要一个经过测试和验证、存在已久的库一样，你也会希望向一位拥有丰富教学经验的人学习，特别是针对你感兴趣的主题。你不仅找到了一本对你学习有益的书籍，还找到了一位在该领域最出色的导师之一。坐好，放松，喝上你喜欢的饮料，让\
    \ Ken 带领你进入处理依赖测试的旅程。\n\nVenkat Subramanian 博士，屡获奖作者，Agile Developer, Inc. 创始人。\n\
    \n"
