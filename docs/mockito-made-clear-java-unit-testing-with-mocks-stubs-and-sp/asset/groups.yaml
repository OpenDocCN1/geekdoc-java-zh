    \ 方法是 `ArgumentMatchers` 类中的一个静态方法，就像你经常在 Mockito 中使用的许多方法一样，该方法是静态的，所以你可能预期使用静态导入来访问它。这就是为什么测试中使用的语法简单为\
    \ `anyInt()` 而不是 `ArgumentMatchers.anyInt()`。\n\n# ArgumentMatchers 的静态导入在哪里？\n\
    \n> `ArgumentMatchers` 类包含了大量实用的静态方法，返回参数匹配器。每个返回的值都实现了 `ArgumentMatcher` 接口。通常情况下，你会发现在实现你自己的自定义匹配器之前，使用静态方法更简单。\n\
    \n然而，如果你查看测试，你会发现只有针对 Mockito 类本身的一个静态导入语句。事实证明 `Mockito` 类继承了 `ArgumentMatchers`（复数）类，因此\
    \ `Mockito` 的静态导入涵盖了两者。这是一种不寻继承用法，但它让编写测试变得更简单。\n\n这里是 JavaDocs 中 `ArgumentMatchers`\
    \ 方法的片段：\n\n![](img/8c17bd3ac8631e54c044c56d594fa853_47_0.png)\n\n报告错误 - 讨论\n\n\
    `ArgumentMatchers` 类中的大多数静态方法都是直观的，尽管有四十多个，但它们属于几类：\n\n- * 匹配原始类型实例的方法：`anyByte`,\
    \ `anyShort`, `anyInt`, `anyLong`, `anyFloat`, `anyDouble`, `anyChar` 和 `anyBoolean`。这些方法的工作方式完全如你预期那样。\n\
    - * 匹配集合的方法，如 `anyCollection`, `anyList`, `anySet` 和 `anyMap`。这些方法匹配指定类型的非空集合。\n\
    - * 适用于字符串的方法，如 `anyString`, `startsWith`, `endsWith` 以及 `matches` 的两个重载，一个接受字符串形式的正则表达式，另一个接受\
    \ `Pattern`。\n- 用于空值的通用匹配器，即 `isNull` 和 `isNotNull`（以及它的伙伴 `notNull`，它只是一个别名），以及\
    \ `nullable(Class)`，它匹配 null 或给定的类型。\n- 对于类型，匹配器 `isClass(Class)` 匹配任何可以赋值给该类实例的参数。这导致了\
    \ `any()` 匹配该类的任何实例。\n\n`ArgumentMatchers` 类包含一组 `eq` 匹配器，这些方法可能令人困惑。在下一节中，我们将查看这些方法以及它们在验证\
    \ mocks 时容易掉入的陷阱。\n\n# 使用 eq Matchers\n\n`ArgumentMatchers` 类有一类你可能没想到的方法：`eq`，它对所有原始类型都有重载，以及\
    \ `eq(T)`，它匹配 `T` 的任何实例。当你 stubbing 一个具有多个参数的方法并对其中一个参数使用匹配器时，你必须对所有参数使用匹配器。文档对这一点非常明确并包含了以下示例。假设你想验证对\
    \ mock 调用了 `someMethod`，且 `someMethod` 有三个参数：一个整数，一个字符串以及另一个字符串。如果你知道最后一个字符串是什么，你可能认为可以直接提供它，如下（注意：这个示例无效）：\n\
    \n```java\nverify(mock).someMethod(anyInt(), anyString(), \"third argument\");\n\
    ```\n\n这个调用将失败，因为两个参数使用了匹配器，而最后一个没有。这就是 `eq` 匹配器的用处。如果你使用 `eq`，你可以简单地将调用重写为：\n\
