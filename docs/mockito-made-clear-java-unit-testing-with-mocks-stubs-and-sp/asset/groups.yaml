    \ BDD 模型。\n\n由于 Mockito 的开发者想要支持 BDD 方案，他们添加了 BDMockito 类。在该类中，设置期望从名为 `given`\
    \ 的方法开始，通过 `when` 的变体来设置返回值。这是 BDMockito 中 `given` 方法的签名：\n\n```java\npublic static\
    \ <?> BDDDMStubbing<T> given(T methodCall)\n```\n\n在普通的 Mockito 类中，该方法后面链跟的是 `thenReturn`、`thenThrow`\
    \ 或其他方法。在 BDMMockito 中，`given` 方法后面是 `willReturn`、`willThrow` 或相同的模式。\n\n例如，这里是对\
    \ PersonService 的 `getMaxId` 的测试，它要求我们 mock PersonRepository 的 `findAll` 方法：\n\
    \n```java\nPersonServiceTest.java\n@Test\npublic void findMaxId() {\n    when(repository.findAll()).thenReturn(people);\n\
    \    assertThat(service.getHighestId()).isEqualTo(14);\n    verify(repository.findAll());\n\
    }\n```\n\n如果使用 BDMockito 类中对应的方法编写，测试看起来如下：\n\n```java\nPersonService.java\n@Test\n\
    public void findMaxIdBDD() {\n    given(repository.findAll()).willReturn(people);\n\
    \    assertThat(service.getTestId()).isEqualTo(14);\n    then(repository).should().findAll();\n\
    }\n```\n\n设置期望只是将 `when` 替换为 `given`，将 `thenReturn` 替换为 `willReturn`。验证步骤稍微复杂一点，因为除了替换为\
    \ `then` 之外，BDDMock 要求你在指定被调用的方法之前添加一个 `should` 方法调用。\n\n为什么需要 `should` 方法？Mockito\
