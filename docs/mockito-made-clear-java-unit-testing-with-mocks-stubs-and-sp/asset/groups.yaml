    \ as well.\n\nWe use the inOrder method to verify that mocked methods were called\
    \ in the proper order, even across different mocked dependencies. Here's the signature\
    \ of inOrder:\n\n```java\npublic static InOrder inOrder(Object... mocks)\n```\n\
    \nThe inOrder method takes a vararg of mocks, and then you can verify that they\
    \ were called in the specified order. For example:\n\n```java\nInOrder inOrder\
