    \ instead it creates a copy of it.\" So if you call regular (that is, unstubbed)\
    \ methods on the spy but not on the real instance, you won't see their effects.\n\
    \nPartial mocks are therefore much trouble than they're worth. The Mockito documentation\
    \ discusses a couple of situations where they can be helpful, but the Mockito\
    \ discourages their use in general.\n\n# Partial Mocks for Subsections\n\n> Normally\
    \ you don't want to use partial mocks because their state is not maintained between\
    \ the mocked methods and the non- mocked methods. One place where partial mocks\
    \ can be useful, therefore, is when the mocked methods do not interact with the\
    \ others.\n\n> For example, if part of your system involves authentication or\
    \ authorization, you can use a partial mock to make sure those methods either\
