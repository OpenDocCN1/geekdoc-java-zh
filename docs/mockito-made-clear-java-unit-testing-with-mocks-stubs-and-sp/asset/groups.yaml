    \ only interacts with the security system through the mocked methods, it should\
    \ work properly.\n\n![](img/8c17bd3ac8631e54c044c56d594fa853_66_0.png)\n\n# Wrapping\
    \ Up\n\nWe covered a lot of ground in this chapter. First, we discussed the methods\
