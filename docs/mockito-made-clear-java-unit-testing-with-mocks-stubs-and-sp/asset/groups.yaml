    # Foreword to Mockito Made Clear


    Your ability to write automated tests to verify the behavior of code is an essential
    skill for sustainable agile development. Writing tests is easy when the unit of
    code has no dependencies. It gets hard when the code under test is coupled to
    other prices of code or services. As a first step to deal with the dependencies,
    we should decouple, move dependencies away, or even remove them where possible.
    A good design keeps the dependencies low and the code as loosely coupled as possible.


    Once we distill the dependencies to the bare minimum, we have to ultimately contend
    with them to write effective tests. That''s where this books comes in—kudos for
    picking it up.


    You need two things to be able to write tests for code with dependencies. First
    you need an awesome library to easily create test doubles—the stubs, mocks, and
    spies—so you can focus on the design instead of fighting the dependen-cies. For
    Java and most languages on the JVM, Mockito has become a clear winner over the
    years. Second, along with knowing good ways to write tests, you need to know how
    to use the library really well.


    Just like you''d want a library that has been tried and tested, one that''s around
    for a while, you''ll want to learn from someone who has a lot of exper-rience
    teaching, especially the very topic you''re interested in learning. You''ve not
