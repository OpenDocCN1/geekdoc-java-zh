    # Working with the Spring Framework


    Earlier in Injecting the Mocks into the Class Under Test, on page 24, we talked
    about when using the @InjectMocks annotation. Mockito will do its best to plug
    the mocks into the class under test. The documentation warns you, however, that
    Mockito is not a true dependency injection framework.


    As turns out, almost all Java developers regularly work with a true dependency
    injection framework, called the Spring Framework. Spring supported Mockito from
    the beginning, and whenever you create a Spring app, Spring includes the Mockito
    library. Since a full discussion of the Spring Framework is well beyond the scope
    of this book, we''ll assume you are familiar with it and are reading this section
    because Spring apps already include Mockito as a test dependency and you want
    to use them together.


    The Spring Boot project provides an annotation @MockBean that does two things:


    +   1 It creates a mock object for you, replacing the Mockito annotation @Mock.

    2 It replaces any instance of the mocked class currently in the ApplicationContext
    with your mock so that it''s available for autowiring.


    So in Spring, rather than using @Mock and @InjectMocks, you use @MockBean and
    rely on Spring to instantiate the mocked beans and autowire them into your class
    under test.


    Say you have a standard Spring app that involves a RESTful web service. It includes
    a service class, to do business logic and mark transaction boundaries, and one
    or more repository classes that convert objects to database tables and back again.
    The goal is to test the logic in the service class without needing a real database,
    so to need to mock the repositories and inject them into the service. That''s
    where the @MockBean annotation comes in.


    Returning once again to our PersonService that depends on a PersonRepository,
    if this was part of a Spring app, the repository would likely be autowired into
    the service:'
