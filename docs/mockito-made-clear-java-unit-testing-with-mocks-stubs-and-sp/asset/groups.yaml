- md: "\n# Chapter 2. Work with the Mockito API\n\nNow let's use the Mockito API instead.\
    \ The first step is to create a mock repository. Mockito has two ways of doing\
    \ that: using the static mock method on the Mockito class or the static annotations.\
    \ We'll take each in turn.\n\nFirst, we'll use the Mockito.mock(Class) method\
    \ to create a stub.\n\n## Using the mock Method\n\nThe mock method in the Mockito\
    \ class has the following signature:\n\n```\npublic static <T> T mock(Class<T>\
    \ classMock)\n```\n\nYou tell Mockito which class or interface to mock, and Mockito\
    \ returns the mock object. Here's the line of code to do that in our test:\n\n\
    ```\nPersonRepository mockRepo = mock(PersonRepository.class);\n```\n\nThat's\
    \ enough. Mockito will generate a class that implements this interface, where\
    \ all the methods will return their default values. If you need more, the following\
    \ test demonstrates the implementations:\n\n```\nUserServiceTest\n@Test\nvoid\
    \ defaultImplementations() {\n    PersonRepository mockRepo = mock(PersonRepository.class);\n\
    \    assertAll(\n        ()-> assertNull(mockRepo.save(any(Person.class))),\n\
    \        ()-> assertTrue(mockRepo.findById(anyInt()).isEmpty()),\n        ()->\
    \ assertTrue(mockRepo.findAll().isEmpty()),\n        ()-> assertEquals(0, mockRepo.count())\n\
    \    );\n}\n```\n\n> Smart Nulls\n>Mockito does better than null returns for mock\
    \ reference types. For example, if the return type of a method is a list, Mockito\
    \ will return an empty list. Most of the time you don't need to be concerned with\
    \ this, but it's good to know that Mockito is trying to be helpful.\n\n![](img/8c17bd3ac8631e54c044c56d594fa853_35_0.png)\n\
    \nThe static methods any(Class) and anyInt come from the ArgumentMatchers class,\
    \ which we'll cover in detail in Chapter 3, Use Built-in and Custom Matchers,\
    \ on page 33. Here, they simply represent invoking a method with an instance of\
    \ the Person class or any integer.\n\nThe mock returns a null for the save method,\
    \ the two finders, and 0 for count. The delete method already returns void, so\
    \ the mock doesn't change and therefore doesn't need to be tested.\n\nReturning\
    \ to our mock, for our test of the getLastName method on the service to pass,\
    \ we need to change the default behavior of the findAll method in the PersonRepository.\
    \ One way to do that is to use the combination of the static when method along\
    \ the chained thenReturn method. We need to tell the mock when the service invokes\
    \ the findAll method, it should return our prepared list of people:\n\n```\nwhen(mockRepo.findAll()).thenReturn(people);\n\
    ```\n\nWe don't need to set the expectations on any other methods in the interface.\
    \ That's one of the big advantages of using Mockito.\n\nNow we can run our test,\
    \ and it should pass. The last line of the test is a verification step:\n\n```\n\
    verify(mockRepo.findAll());\n```\n\nThis step is optional but does check that\
    \ the protocol was followed—meaning that our class invoked the findAll method\
    \ on the mock exactly.\n\nHopefully, you'll find the process intuitive. It does\
    \ two steps that can get tedious, because they'll appear in every test we write:\n\
    \n- 1. We need to create the mock every time, and\n- 2. We need to inject the\
    \ mock into the class under every time.\n\nWhile doing so manually, as shown,\
    \ is fine, Mockito provides a simpler alternative using annotations.\n\n## Using\
    \ Annotations to Create the Mocks\n\nMockito provides two annotations for mocks:\
    \ @Mock and @InjectMocks. You add the @Mock annotation to any dependencies in\
    \ your class that you want Mockito to mock, and add @InjectMocks to the class\
    \ under test; no changes are needed for the class test. The combination of one\
    \ or more attributes with @Mock and a single @InjectMocks on the class test tells\
    \ Mockito to create the necessary mocks and do its best to inject them into the\
    \ class test.\n\nAn example shows how to use the @Mock and @InjectMocks annotations\
    \ on the attributes of the PersonServiceTest:\n\n```\nPersonServiceTest.java\n\
    @ExtendWith(MockitoExtension.class)\npublic class PersonServiceTest {\n  @Mock\n\
    \  private PersonRepository repository;\n\n  @InjectMocks\n  private PersonService\
    \ service;\n```\n\nWe have only one dependency, so we need only a single @Mock\
    \ annotation on the attribute. That attribute will be instantiated, the expectations\
    \ on it will be set, and then it will be injected in the class test, annotated\
    \ with @InjectMocks.\n\nWhenever you use annotations, you need to tell Mockito\
    \ to process them. JUnit 5 uses the Mockito JUnit 5 Extension, which is the argument\
    \ to the @ExtendWith annotation on the test class. This extension initializes\
    \ the mocks, and, as a side note, \"handles strict stubbing.\" That means in your\
    \ tests you can only mock methods that your method actually calls.\n\nYou no longer\
    \ have to instantiate the PersonService inside the test. Mockito does all that\
    \ for you. You still have to set the expectations on the mock list, and you can\
    \ verify the methods at the end if you want, but also the creation of the mock\
    \ and its injection into the class test is automated for.\n\n```\nPersonServiceTest.java\n\
    @Test\npublic void getLastNames_usingAnnotations() {\n  when(repository.findAll()).thenReturn(people);\n\
    \  assertThat(service.getLastNames())\n    .contains(\"Barg\",\"Goldberg\", \"\
    Hopper\", \"Liskov\", \"Lovelace\");\n  verify(repository).findAll();\n}\n```\n\
    \nThis test uses the repository and service attributes rather than local variables\
    \ of those types.\n\nThe process of instantiating the classes and wiring them\
    \ together automatically is powerful but has some restrictions, which we'll talk\
    \ about next.\n\n## Injecting the Mocks into the Class Under Test\n\nOne benefit\
    \ of the annotation approach is that Mockito tries to inject the mocks into the\
    \ class test for you. How does it do, exactly? Have a look at the details in the\
    \ JavaDocs for the @InjectMocks annotation,¹ which says Mockito attempts the following\
    \ sequence of steps:\n\n- 1. Calls the largest constructor on the test class if\
    \ it takes the right types of arguments.\n- 2. Calls setter methods of the proper\
    \ type (and the proper name if there is more than one for a given type).\n- 3.\
    \ Sets the fields directly.\n\n¹ https://javadoc.io/doc/org.mockito/mockito-core/latest/org/mockito/InjectMocks.html\n\
    \nSuffice to say Mockito will make a good effort to plug the mocks into the class\
    \ under test, as the docs say, \"Mockito is not a dependency injection framework;\
    \ don't expect this shorthand to inject a complex graph of objects, be it mocks/spies\
    \ or real objects\"\n\nDespite the claim, Mockito will try to do the work for\
    \ you is a strong argument in favor of the annotation approach.\n\nThis talk of\
    \ injection may remind you of the Spring framework, which truly is a dependency\
    \ injection framework. Spring not only includes the Mockito library as a testing\
    \ dependency, it also provides its own annotation, called @InjectBean, to help\
    \ Mockito. We'll look at Spring and Mockito in Working with the Spring Framework,\
    \ on page 67.\n\nRegardless of whether you use the method or the annotation approach\
    \ to create the mocks, the next step is to set expectations on them. The tests\
    \ so far demonstrated, but in its simplest case. Let's look at the process in\
    \ more detail.\n\n## Setting Expectations\n\nThe Mockito-based example that mocked\
    \ the PersonRepository dependency of PersonService used the methods when and thenReturn\
    \ to set the expectations on the findAll method. Here's the signature for when:\n\
    \n```\npublic static <T> OngoingStubbing<T> when(T methodCall)\n```\n\nThe argument\
    \ to is the declaration of an invocation of the method you want to call on the\
    \ stub. The return type connects to the various methods, like thenReturn, thenThrow,\
    \ thenAnswer, which are normally chained to the output. There are a couple of\
    \ overloads of the thenReturn method:\n\n```\nOngoingStubbing<T> thenReturn(T\
    \ value)\nOngoingStubbing<T> thenReturn(T value, T... values)\n```\n\nFor example,\
    \ another method to the PersonService called findById, which takes a var list\
    \ of ids and returns a List<Person>:\n\n```\nPersonService.java\npublic List<Person>\
    \ findByIds(int... ids) {\n  return Arrays.stream(ids)\n```\n\n² https://spring.io\n"
  mdcn: "\n\n# 第 2 章. 使用 Mockito API\n\n现在让我们改用 Mockito API。第一步是创建一个 mock 存储库（repository）。Mockito\
    \ 提供了两种实现方式：使用 Mockito 类上的静态 mock 方法，或者使用静态注解。我们将轮一介绍。\n\n首先，我们将使用 `Mockito.mock(Class)`\
    \ 方法来创建一个存根（stub）。\n\n## 使用 mock 方法\n\nMockito 类中的 `mock` 方法具有以下方法签名：\n\n```\n\
    public static <T> T mock(Class<T> classMock)\n```\n\n你告诉 Mockito 要 mock 哪个类或接口，Mockito\
    \ 会返回对应的 mock 对象。以下是在我们的测试中实现该操作的代码行：\n\n```\nPersonRepository mockRepo = mock(PersonRepository.class);\n\
    ```\n\n这就足够了。Mockito 将生成一个实现该接口的类，其中所有方法都将返回它们的默认值。如果你需要更多，下面的测试演示了这些实现：\n\n```\n\
    UserServiceTest\n@Test\nvoid defaultImplementations() {\n    PersonRepository\
    \ mockRepo = mock(PersonRepository.class);\n    assertAll(\n        ()-> assertNull(mockRepo.save(any(Person.class))),\n\
    \        ()-> assertTrue(mockRepo.findById(anyInt()).isEmpty()),\n        ()->\
    \ assertTrue(mockRepo.findAll().isEmpty()),\n        ()-> assertEquals(0, mockRepo.count())\n\
    \    );\n}\n```\n\n> 智能空值\n> 对于 mock 引用类型，Mockito 的表现比返回 null 更好。例如，如果方法的返回类型是列表，Mockito\
    \ 将返回一个空列表。大多数情况下，你不需要担心这个，但知道 Mockito 正在尝试提供帮助是件好事。\n\n![](img/8c17bd3ac8631e54c044c56d594fa853_35_0.png)\n\
    \n静态方法 `any(Class)` 和 `anyInt` 源自 `ArgumentMatchers` 类，我们将在第 33 页的“使用内置和自定义匹配器”章节中详细介绍。在这里，它们仅代表使用一个\
    \ `Person` 类的实例或任何整数来调用方法。\n\nmock 为 `save` 方法返回 `null`，两个查找方法返回 `null`，`count`\
    \ 返回 0。由于 `delete` 方法已经返回 `void`，所以 mock 不发生变化，因此不需要测试。\n\n回到我们的 mock，为了让对 service\
    \ 中 `getLastName` 方法的测试通过，我们需要更改 `PersonRepository` 中 `findAll` 方法的默认行为。实现此目标的一种方法是使用静态\
    \ `when` 方法链式调用 `thenReturn` 方法。我们需要告诉 mock，当 service 调用 `findAll` 方法时，它应该返回我们准备好的人员列表：\n\
    \n```\nwhen(mockRepo.findAll()).thenReturn(people);\n```\n\n我们不需要对接口中的任何其他方法设置期望（expectation）。这是使用\
    \ Mockito 的巨大优势之一。\n\n现在我们可以运行测试了，它应该会通过。测试的最后行是一个验证步骤：\n\n```\nverify(mockRepo.findAll());\n\
    ```\n\n这一步是可选的，但它检查了是否遵循了协议——这意味着我们的类准确地调用了 mock 上的 `findAll` 方法。\n\n希望你会发现这个过程很直观。它包含了两个可能会变得繁琐的步骤，因为它们出现在我们编写的每个测试中：\n\
    \n- 1. 我们每次都需要创建 mock，并且\n- 2. 我们每次都需要将 mock 注入到被测试类中。\n\n虽然像显示所示手动这样做是可以的，但 Mockito\
    \ 提供了一个使用注解的更简单的替代方案。\n\n## 使用注解创建 Mock\n\nMockito 为 mock 提供了两个注解：`@Mock` 和 `@InjectMocks`。你向类中任何想要让\
    \ Mockito mock 的依赖项添加 `@Mock` 注解，并在被测试的类上添加 `@InjectMocks`；测试类本身不需要任何更改。带有 `@Mock`\
    \ 的一个或多个属性与测试类上的单个 `@InjectMocks` 结合，会告诉 Mockito 创建必要的 mock，并尽力将它们注入到测试类中。\n\n\
    示例展示了如何在 `PersonServiceTest` 的属性上使用 `@Mock` 和 `@InjectMocks` 注解：\n\n```\nPersonServiceTest.java\n\
    @ExtendWith(MockitoExtension.class)\npublic class PersonServiceTest {\n  @Mock\n\
    \  private PersonRepository repository;\n\n  @InjectMocks\n  private PersonService\
    \ service;\n```\n\n我们只有一个依赖项，所以只需要在属性上使用单个 `@Mock` 注解。该属性将被实例化，对其设置期望，然后它将被注入到标记了\
    \ `@InjectMocks` 的测试类中。\n\n每当你使用注解时，都需要告诉 Mockito 处理它们。JUnit 5 使用了 `Mockito JUnit\
    \ 5 Extension`，它是测试类上 `@ExtendWith` 注解的参数。该扩展会初始化 mock，顺带提一句，它“处理严格存根（strict stubbing）”。这意味着在测试中，你只能\
    \ mock 你的实际调用的方法。\n\n你不再需要在测试内部实例化 `PersonService` 了。Mockito 会为你完成所有工作。你仍然需要对\
    \ mock 列表设置期望，并可以在最后根据需要验证方法，但 mock 的创建及其向测试类的中的注入已是自动化的。\n\n```\nPersonServiceTest.java\n\
    @Test\npublic void getLastNames_usingAnnotations() {\n  when(repository.findAll()).thenReturn(people);\n\
    \  assertThat(service.getLastNames())\n    .contains(\"Barg\",\"Goldberg\", \"\
    Hopper\", \"Liskov\", \"Lovelace\");\n  verify(repository).findAll();\n}\n```\n\
    \n此测试使用了 repository 和 service 属性，而不是这些类型的局部变量。\n\n自动实例化类并将它们接线在一起的过程非常强大，但也有一些限制，我们将在下文中讨论。\n\
    \n## 将 Mock 注入到被测试类中\n\n注解方法的好处之一是，Mockito 尝试为你将 mock 注入到测试类中。它具体是如何做到的？查看 `@InjectMocks`\
    \ 注解的 JavaDoc 细节，¹，其中提到 Mockito 尝试执行以下步骤：\n\n- 1. 如果测试类的构造函数接收正确类型的参数，则调用最大的构造函数。\n\
    - 2. 调用正确类型的 setter 方法（如果对于给定类型有多个方法，则调用名称正确的方法）。\n- 3. 直接设置字段。\n\n¹ https://javadoc.io/doc/org.mockito/mockito-core/latest/org/mockito/InjectMocks.html\n\
    \n足以说明 Mockito 会尽力将 mock 插件到被测试类中，正如文档所说，“Mockito 不是一个依赖注入框架；不要期望这种简写可以注入复杂的对象图，无论是\
    \ mock/spies 还是真实对象”\n\n尽管有此声称，Mockito 仍会尝试为你完成这些工作，这是支持使用注解方法的有力论点。\n\n这种关于注入的讨论可能会让你联想到\
    \ Spring 框架，它是一个真正的依赖注入框架。Spring 不仅包含 Mockito 库作为测试依赖，还提供了自己的名为 `@InjectBean`\
    \ 的注解来帮助 Mockito。我们将在第 67 页的“使用 Spring 框架”中查看 Spring 和 Mockito。\n\n无论你使用方法还是注解方法来创建\
    \ mock，下一步都是对它们设置期望。到目前为止的测试演示了最简单的情况。让我们详细地查看该过程。\n\n## 设置期望\n\n基于 Mockito 的示例\
    \ mock 了 `PersonService` 的依赖 `PersonRepository` 使用 `when` 和 `thenReturn` 方法为 `findAll`\
    \ 方法设置期望。以下是 `when` 的签名：\n\n```\npublic static <T> OngoingStubbing<T> when(T methodCall)\n\
    ```\n\n参数是你想要在存根上调用的方法声明。返回类型连接到各种方法，如 `thenReturn`、`thenThrow`、`thenAnswer`，这些通常是链式的。`thenReturn`\
    \ 方法有两个重载：\n\n```\nOngoingStubbing<T> thenReturn(T value)\nOngoingStubbing<T>\
    \ thenReturn(T value, T... values)\n```\n\n例如，`PersonService` 的另一个方法 `findByIds`\
    \ 接收一个变长参数 ids 列表并返回 `List<Person>`：\n\n```\nPersonService.java\npublic List<Person>\
    \ findByIds(int... ids) {\n  return Arrays.stream(ids)\n```\n\n² https://spring.io\n\
    \n"
