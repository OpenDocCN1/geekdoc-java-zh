  md: "# Chapter 3. Built-in and Custom Matchers • 36\n\nargument matcher, you have\
    \ to use argument matchers for all the arguments. Using eq, you can simply rewrite\
    \ the call as:\n\n```\nverify(mock).someMethod(anyInt(), anyString()), eq(\"third\
    \ argument\");\n```\n\nNow everything works. Missing an argument matcher is an\
    \ easy trap to fall into because the compiler doesn't identify it as an error.\
    \ The code won't fail until you run the actual test. It's an easy fix.\n\nGoing\
    \ beyond the basic ArgumentMatchers, Mockito includes another class, called AdditionalMatchers,\
    \ which includes methods like and, and not, for combining values, as well as a\
    \ comparison relationships, like lt, leg, geq, and various forms of array equality\
    \ checks. See the JavaDocs for AdditionalMatchers for details.\n\nNow let's look\
    \ at the last category of methods in ArgumentMatchers—methods that allow you to\
    \ create custom matchers.\n\n# Creating Custom Argument Matchers\n\nTo create\
    \ your own matcher, the ArgumentMatchers class has a method called argThat, which\
    \ takes an ArgumentMatcher (singular) as an argument. ArgumentMatcher is an interface\
    \ containing a single abstract method, with this signature:\n\n```\nboolean matches(T\
    \ argument)\n```\n\nThis method should return true if the argument matches whatever\
    \ condition you implement, and false otherwise.\n\nIn the dark days before lambda\
    \ expressions were added in Java 8, implementing your own matcher wasn't exactly\
    \ difficult, but it was verbose. The example given in the documentation is hardly\
    \ inspiring (comments added):\n\n```\nListCustomMatcher.java\n```\n\n```\n// custom\
    \ matcher that implements the ArgumentMatcher interface\nclass ListOfTwoElements\
    \ implements ArgumentMatcher<List> {\n    public boolean matches(List list) {\n\
    \        return list.size() == 2;\n    }\n\n    public String toString() {\n \
