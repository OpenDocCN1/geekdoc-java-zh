  md: "# Mock finals in Mockito 5\n\nIn this section, we discuss the additional configuration\
    \ needed to mock final methods and classes. The ability to mock final members\
    \ was added in Mockito 2.1.0 and simplified later. Mockito 5, however, integrates\
    \ this capability into Mockito core. When used with Java 17, Mockito 5 uses the\
    \ inline capability by default and the old-style mock-maker is no longer supported\
    \ or needed.\n\nBy default, nothing. Without additional configuration, Mockito\
    \ can't mock final methods or final classes. You can change this behavior in one\
    \ of two ways:\n\n+   1. Add a directory to your project called mockito-extensions\
    \ (usually under src/main/resources or src/test/resources). Add a file to directory\
    \ called org.mockito.plugins.MockMaker and, inside that file, add the single line\
    \ mock-maker-inline. Seriously.\n2. As a simpler alternative, in your Gradle or\
    \ Maven build file, replace the artifact \"mockito-core\" with \"mockito-inline\"\
    .\n\nThe second option is certainly easier, though both options do the same thing.\n\
    \nTo show how this works, recall the InMemoryRepository class discussed in Creating\
    \ Mocks and Stubs, on page 21. Because that class used a shared, in-memory database,\
    \ the underlying data structure had to be protected from multi-threading issues.\
    \ Meant the save and delete methods needed to be synchronized, as shown in the\
    \ class:\n\n```\nInMemoryRepository.java\nimport java.util.ArrayList;\nimport\
    \ java.util.Collections;\nimport java.util.List;\nimport java.util.Optional;\n\
    \npublic class InMemoryRepository implements PersonRepository {\n    private final\
    \ List<Person> people =\n        Collections.synchronizedList(new ArrayList<Person>());\n\
    \n    @Override\n    public final Person save(Person person) {\n        synchronized\
    \ (people) {\n            people.add(person);\n        }\n        return person;\n\
    \    }\n\n    @Override\n    public final void delete(Person person) {\n     \
    \   synchronized (people) {\n```"
