  md: '# Preface


    This book is about the Mockito testing framework, but it''s not an exhaustive
    reference. No books these days try to do that. For any library, the online documentation
    beats printed books every time because it keeps up with new versions of the software
    and can be adjusted to show new features and bug fixes. Where books become valuable
    is a front end to the online docs, that they help you understand what you''re
    getting into and what to expect when you get there. Books are curated content.
    They try to show you what''s important and why.


    For Mockito, a book like this is especially important, because the online documentation
    contains significant gaps. The docs were written by developers who understand
    tools like Mockito that generate mocks, stubs, and spies and help you use them.
    That''s good, in the fact docs focus exactly how to make the framework do you
    want. The downside is that you need to understand the problems that Mockito solves
    ahead of time, and unless you''ve already had experience with similar tools, those
    concepts are probably not obvious.


    This book is intended to fill that gap. It''s about the concepts behind Mockito
    more than showing the details of how to use it. Those details are included, of
    course, for a set of representative examples, but the goal is understanding rather
    than the specific details of the syntax. The online docs are good for syntax (the
    classes and methods in the API) and to a lesser extent, semantics (how to use
    the tool to do what you want), but they don''t explain why Mockito is useful in
    the first place or how it can make your job easier.


    This is exactly what the Pragmatic Answers series is all about. Answers books
    topics that are too big for a simple blog post probably not enough to warrant
    a 300-page book. Books in this series are short and sweet. The goal is to get
    you up and running with the tool in a way that you could devour in a weekend if
    necessary. The end result is to get you started and help you understand the goals,
    the strategies, and the basic tactics of'
