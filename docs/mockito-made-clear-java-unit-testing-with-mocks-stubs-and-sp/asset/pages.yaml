  md: '# Acknowledgments


    This book took much longer to write than I expected. Although I could say that
    about every book I''ve worked on, the real reason this book took so long is that
    I kept discovering interesting capabilities in the Mockito framework I either
    had not known or had understood. Even though I''d been using Mockito for years,
    both in practical work and in training classes, I had no idea there was so much
    to it. That''s the best part of writing a book—digging into the parts of the code
    you''d not normally encountered, and Mockito turns out to have parts like that
    in abundance.


    I definitely want to thank the Mockito team for building and maintaining such
    a powerful tool. Let me specifically mention Rafael Winterhalter, who made extensive
    recommendations on a beta version of the book that improved the final product
    immeasurably. I need to thank the other reviewers who submitted comments as well,
    including David Chelminsky, Bauke Scholtz, Ludovico Fischer, Marcin Grzeszczak,
    Marcin Zajajkowski, and Daniel Hinojosa. I''m very grateful for your contributions
    and support.


    Venkat Subramanian also reviewed the book, and I appreciate that, but I want to
    especially thank him for writing the Foreword. I''m always glad to have him involved
    in any project, and we had several "spirited" discussions about Mockito, both
    in terms of how to use it and how to write about it. I try not to tell him too
    often this because I don''t want to feed his ego too much, but it''s an honor
    to consider him as a friend as well as a colleague.


    I''ve been training classes and making presentations involving Mockito on both
    the O''Reilly Learning Platform and the No Fluff, Just Stuff conference tour,
    and I''m grateful to both for the opportunity. There''s no better way to find
    the gaps in your knowledge than to present information to a group of intelligent
