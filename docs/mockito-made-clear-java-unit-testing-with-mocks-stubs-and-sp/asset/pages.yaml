  md: "# Mocking Static Methods\n\nUntil Java 8, you couldn't have static methods\
    \ in interfaces at all. As for classes, static methods are associated with the\
    \ class as a whole, rather than an instance, and they can't be overridden. So\
    \ what does it even mean to mock a static method?\n\nIt’s easy to imagine a system\
    \ that has a dependency on a static method. For example, consider a class, called\
    \ BioService, which takes a vararg list of strings in the constructor and grabs\
    \ a summary of its associated pages at Wikipedia. Wikipedia maintains a MediaWiki\
    \ Action API, which you can use to access Wikipedia programmatically.\n\n(All\
    \ the URLs end with php, which tells you how Wikipedia is implemented.)\n\nThe\
    \ book’s GitHub repository contains a package called com.kousenit.wikipedia that\
    \ uses this API. The BioService class is very simple:\n\n```\nBioService java\n\
    package com.kousenit.wikipedia;\nimport java.util.Arrays;\nimport java.util.List;\n\
    import java.util.stream.Collectors;\npublic class BioService {\n    private final\
    \ List<String> pageNames;\n    public BioService(String... pageNames) {\n    \
    \    this.pageNames = Arrays.stream(pageNames)\n            .collect(Collectors.toList());\n\
    \    }\n    public List<String> getBios() {\n        return pageNames.stream()\n\
    \            .map(WikiUtil::getWikipediaExtract)\n            .collect(Collectors.toList());\n\
    \    }\n}\n```\n\nIn this case, the dependency is on a class called WikiUtil,\
    \ which has a static method called WikipediaExtract. That method takes a string\
    \ name and returns the page with the name as a string.\n\nFor the BioService,\
    \ you give the constructor a list of names, and the getBios method gets the Wikipedia\
    \ “extract” for each one. The WikiUtil class is fairly complicated because it\
    \ has to formulate the HTTP request from many parameters and parse the results.\n\
    \n+   2. https://www.mediawikiwiki.org/wiki/API:Main_page"
