  md: '# Wrapping Up


    You can create your mocks manually and insert them into your class under test
    or you can use Mockito''s annotation support to inject them automatically. Mockito
    doesn''t provide a full injection framework, like Spring or Guice, but it makes
    a good faith effort to plug in your mocks via either constructor injection, setter
    injection, or even field injection.


    You now have the mechanisms for telling your mocks (stubs, in this case) what
    to return when methods are called. Chained methods made the process much simpler,
    and you can use multiple arguments to respond to each invocation with different
    results. You also now know about the special handling required to mock methods
    that return void.


    In the next chapter, we''ll talk about generalizing the arguments to mocked methods
    so you don''t have to give explicit values every time. Mockito has a class that
    contains factory methods for that purpose—we''ll also use Java lambdas to implement
    custom argument matchers.'
