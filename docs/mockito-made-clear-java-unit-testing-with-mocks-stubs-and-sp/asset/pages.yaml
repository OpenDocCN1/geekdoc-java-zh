    \ maker will be wrapped into the core and become the default.\n\nIf all you plan\
    \ to use in Mockito is the static mock method to create your mocks, this dependency\
    \ is all you need. If, however, you plan to use annotations like @Mock and @InjectMocks,\
    \ you need an additional dependency if you use JUnit 5, as shown in the next section.\n\
    \n# JUnit 5\n\nJUnit 5 uses extension classes to add capabilities to JUnit. This\
    \ is the dependency in Maven:\n\n```\n<dependency>\n  <groupId>org.mockito</groupId>\n\
    \  <artifactId>mockito-junit-jupiter</artifactId>\n  <version>4.8.1</version>\n\
    \  <scope>test</scope>\n</dependency>\n```\n\nAnd for Gradle it's:\n\n```\ntestImplementation\
    \ 'org.mockito:mockito-junit-jupiter:4.8.1'\n```\n\nAgain, add parentheses and\
    \ double-quotes if you're using the Kotlin DSL for Gradle. In either case, you\
    \ can now add the following to the test class:\n\n```\n@ExtendWith(MockitoExtension.class)\n\
    ```\n\nThe extension will work with your annotations to use Mockito for the tests.\n\
    \nRemember, if you plan to use JUnit 5 with Gradle, you must add the following\
    \ to your build file:\n\n```\ntasks.named('test') {\n  useJUnitPlatform()\n}\n\
    ```\n\nThe syntax shown only executes the JUnitPlatform method if you run a test\
    \ task. To make that, you can replace that line with simply test.\n\nIf you plan\
    \ to use both JUnit 5 and JUnit 4 tests in the same project, be sure to include\
    \ the vintage engine with your JUnit dependencies:\n\n```\n<dependency>\n  <groupId>org.junit.vintage</groupId>\n\
    \  <artifactId>junit-vintage-engine</artifactId>\n  <version>5.9.1</version>\n\
    \  <scope>test</scope>\n</dependency>\n```"
