    \ @InjectMocks.\n\nWhenever you use annotations, you need to tell Mockito to process\
    \ them. JUnit 5 uses the Mockito JUnit 5 Extension, which is the argument to the\
    \ @ExtendWith annotation on the test class. This extension initializes the mocks,\
    \ and, as a side note, \"handles strict stubbing.\" That means in your tests you\
    \ can only mock methods that your method actually calls.\n\nYou no longer have\
    \ to instantiate the PersonService inside the test. Mockito does all that for\
    \ you. You still have to set the expectations on the mock list, and you can verify\
    \ the methods at the end if you want, but also the creation of the mock and its\
