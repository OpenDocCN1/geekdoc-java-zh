  md: '# CHAPTER 4


    # Solve Problems with Mockito


    I''ve always preferred chess to poker, partly because I have a terrible poker
    face. It''s hard for me to keep my emotions out of my expressions, while that''s
    a good idea in chess, it''s vital in poker, where the other players are constantly
    trying to judge whether you have a good hand or not and adjusting their bets accordingly.
    Ideally, when the other players look at me, I should be returning nothing to make
    the game difficult for them.


    Nothingness can also cause difficulties when testing. In Java, all too often developers
    write methods that return nothing. Those methods are hard to test, because after
    all, nothing is coming back. Sometimes you also have to mock a method that returns
    nothing, telling it to throw an exception for certain inputs. In Mocking Methods
    That Return void, on page 28, we discussed how to mock return nothing but not
    how to test methods that return nothing. That''s one of the hard problems that
    Mockito solves easily. In this chapter, we''ll tackle a variety of problems that
    Mockito can help you:


    +   - Testing methods that return void.

    - Capturing the actual arguments of mocked methods.

    - Using custom answers to return values based on invoked arguments.

    - Spying on real objects.


    We''ll also look at how Mockito supports the concept of Behavior Driven Development
    (BDD).¹ Then we''ll look at testing void methods. After that, we''ll see how to
    capture the actual arguments used when a method on a mock is invoked. We''ll see
    how to make the mock return a value based on its input argument. Finally, we''ll
    spy on real objects.


    > ¹ https://en.wikipedia.org/wiki/Behavior-driven_development'
