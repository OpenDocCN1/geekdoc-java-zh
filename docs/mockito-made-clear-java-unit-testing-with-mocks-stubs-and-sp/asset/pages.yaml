  md: '# Wrapping Up


    We covered a lot of ground in this chapter. First, we discussed the methods in
    the BDDMockito class, which are mostly a “global search-and-replace” on the analogous
    methods in the Mockito class. Then we talked about how to set expectations on
    dependency methods that return void, which is easy enough but take some getting
    used to.


    We also looked at two special situations. Sometimes when a method under test calls
    a mocked method, you want to know exactly what arguments were supplied. Mockito
    provides an argument *captor* for that purpose. The other situation is when you''re
    mocking a method and you want the output to be based on the input in some way.
    You can use custom answers, implemented as lambda expressions, to handle that.


    Finally, we introduced spies, which watch interactions between the class under
    test and its dependences. Spies are controversial when used as partial mocks,
    but they''re perfect as a way of monitoring interactions.


    In the next chapter, we''ll look at some recent additions to Mockito, like the
    ability to mock final methods and classes or static methods. We''ll also see how
    the Spring Framework supports Mockito and consider when *not* to mock objects.'
