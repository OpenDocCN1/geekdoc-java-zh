  md: 'Now everything works. That list of methods based on the primitive types is
    the last category of methods in the ArgumentMatchers class.


    # Custom Matchers for Primitives


    > When using a custom matcher that is based on primitive types, use the methods
    designed for that purpose: byteThat, shortThat, intThat, longThat, floatThat,
    doubleThat, instead of argThat. That approach will avoid potential pointer exceptions
    due to boxing.


    ![](img/8c17bd3ac8631e54c044c56d594fa853_52_0.png)


    We''ve covered all the important methods in the ArgumentMatchers class, including
    how to implement your own custom matcher. We can now verify that methods are called
    with the proper arguments. But to verify the protocol, we also want to check that
    the methods on the mocked objects are called in the proper order. Fortunately,
    Mockito makes that as easy as well, you''ll see next.


    # Verifying the Order of Methods Called


    One last check we can make is to verify that a particular method on one stub was
    invoked before another method on a different stub. We''ll need an additional class
    in Mockito to do that, called org.mockito.Order, and we''ll create an instance
    of it using another static method from the Mockito class, also called inOrder(but
    with a lowercase first letter).


    Here''s the signature of the inOrder method:


    ```

    public static In inOrder(Object... mocks)

    ```


    The inOrder method takes a vararg list of mocks, so you create the mocks first.
    It''s interesting that you can check that different methods were called on different
    mocks in the order specified. If the object we''re testing multiple dependencies
    and we mock them, we can verify that methods are called in the proper order even
    across different mock objects.


    The example in code makes this clear:


    ```

    inOrder = inOrder(firstMock, secondMock);

    inOrder.verify(firstMock).add("was called first");

    inOrder.verify(secondMock).add("was called second")

    ```


    This code checks that the add method was called on the first mock with the string
    argument "was called first", and then the add method was called on the second
    mock with argument "was called second". You have to explicitly list the calls
    in order, but they work.'
