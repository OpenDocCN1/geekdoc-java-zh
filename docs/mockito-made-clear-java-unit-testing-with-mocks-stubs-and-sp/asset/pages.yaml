  md: '# Chapter 1. Build a Testing Foundation • 16


    stubbed methods are called by the class under the right number of times, with
    the correct parameters, in the right order.


    For completeness let''s add the definition of a spy.


    spy


    A spy is an object that wraps the actual dependent object, allows you to track
    calls to that object by the class under test. A spy is similar to a mock, in it
    records which methods were called, but a spy invokes those methods on the actual
    underlying object instead of on stub.


    In a nutshell, that''s how we''ll using the terms mock, stub, and spy throughout
    this book.


    # Why Not Write Your Own Stubs?


    In simple cases like our example, it''s easy to create the needed stub yourself,
    plug an instance into the class under test, and go from there. The GateGateway
    is a stub. Stubs provide known outputs given known inputs. If you also want to
    verify that the service calls getResponse on the gateway exactly once, your same
    object would then be considered a mock. In each case the class is the same. The
    only difference is how you''re using it in the test.


    Writing your own stubs causes problems:


    +   - If the interface you are trying to stub has many methods in it, and you
    plan to call only one or two, you still have to implement all the methods rather
    than just the ones you care about.

    - If you''re going to write the stub, you''re going to have to maintain it as
    well, so if the required methods change, you''ll have to update the stub classes.

    - If a class you plan doesn''t implement a convenient interface, you''ll have
    to create a subclass instead. That may work, but what if the class is marked final
    and can''t be extended at all?

    - What if the methods you need to stub are static? You can''t override static
    methods.

    - How do you keep track that the stubbed methods are invoked the right number
    of times, in the right order, with the right parameters?


    These problems are where Mockito helps. Mockito generates mocks and stubs for
    you. Mockito can generate classes that implement an interface. It can override
    classes (even, with a bit of help, final classes). You even have the capability
    to stub static methods. Mockito will implement all the methods in an interface
    so that they return default values, which you can then override.


