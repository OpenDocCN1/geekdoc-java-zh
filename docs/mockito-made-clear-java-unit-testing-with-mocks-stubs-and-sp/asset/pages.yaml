  md: '# Chapter 5. Use Mockito in Special Cases


    You can mock classes and even enums in the standard library the same way, though
    be careful. First, try to avoid mocking code you don''t own (see Deciding When,
    on page 69). Also, optimizations in the library may take advantage of final methods
    by inlining the associated code, so the mocked methods may never be called.


    A couple of additional restrictions apply as well. Let''s mock a String, for example.
    We get the following error message:


    ```

    org.mockito.exceptions.base.MockitoException: Cannot mock/spy class java.lang.String
    Mockito cannot mock/spy because : Cannot mock wrapper types. String.class or Class.class

    ```


    The message couldn''t be clearer. Don''t try to mock String, Class, or any of
    the wrapper classes (Byte, Short, Character, Integer, Long, Float, or Boolean).

    The Mockito API includes an annotation called @DoNotMock which you can add to
    your classes if you want to prevent Mockito from mocking them.


    Speaking of final, in this book we''ve been dealing with Java, which allows you
    to override any method or extend any class as long as it isn''t marked final.
    The default in Kotlin, however, is the opposite—you can''t override anything unless''s
    marked open. Kotlin is the recommended language for Android development, so how
    do Android developers handle mocking? As it turns out, Mockito has a subproject
    designed for that.


    # Mockito with Android


    One of the challenges of testing Android applications is that while regular unit
    tests run on the local machine, any instrumented test and and requires either
    an actual device or an emulator to run. As discussed on the Android developer
    website, if you can mock classes from the Android library, you can improve the
    performance of your tests considerably.


    While normally you don''t want to mock classes you don''t own, the Mockito Android
    library was specifically designed to help you perform unit tests on Android applications
    without requiring emulators or external devices. Android testing is a topic beyond
    the scope of this book, but be aware that Mockito knows about it and is able to
    help. See the online resources for details.


    The same inline mock that Mockito uses for final methods also be used to mock
    static methods, which we cover next.


    +   1. https://developer.android.com/training/testing/local-tests#mockable-library'
