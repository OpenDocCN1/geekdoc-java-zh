  md: "In the PersonRepository, the delete method returns void. Say we were testing\
    \ failure modes and we decided that if the PersonService calls delete with a null\
    \ argument (which hopefully never happen), the repository should throw a RuntimeException.\n\
    \nThe way we normally set an expectation like that would be to write\n(Note: this\
    \ does not compile):\n\n```\nwhen(repository.delete(null)).thenThrow(RuntimeException.class);\n\
    ```\n\nThis code doesn't work, with the error message \"no instance(s) of type\
    \ variable(s) T exist so that void conforms to T\". That's a rather confusing\
    \ message, but fortunately there is a simple fix. Whenever we need to mock a method\
    \ that returns void, use one of the methods first:\n\n```\ndoThrow(RuntimeException.class).when(repository).delete(null);\n\
    ```\n\nAs an example, here's the test for deleteAll, using a List<Person> that\
    \ contains only a null:\n\n```\nPersonService.java\n@Test\npublic void deleteAllWithNulls()\
    \ {\n    // Set up findAll to return a list containing nulls of type Person\n\
    \    when(repository.findAll()).thenReturn(Arrays.asList((Person) null));\n\n\
    \    // This won't compile:\n    // when(repository.delete(null)).thenThrow(RuntimeException.class);\n\
    \    // But this will:\n    assertThrows(RuntimeException.class, () -> service.deleteAll());\n\
    \nverify(repository).delete(null);\n}\n```\n\nSometimes using the do methods feels\
    \ like you're writing the expression backward, but you get used to it. For record,\
    \ here is the complete list of do methods:\n\n+   * doReturn\n* doThrow\n* doAnswer\n\
    * doNothing\n* doCallRealMethod\n\nYou can use these anywhere, but most people\
    \ use them only for methods that return void."
