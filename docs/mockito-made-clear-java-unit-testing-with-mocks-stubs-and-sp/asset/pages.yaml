  md: "What you and can't check the expected behavior: verify that the service invokes\
    \ the save method on the repository the expected number of times. You can, however,\
    \ wrap the repository in a spy and use that to keep count:\n\nPersonServiceTest.java\n\
    \n```\n@Test\nvoid spyOnRepository() {\n    // Spy on the in-memory repository\n\
    \    PersonRepository personRepo = spy(new InMemoryRepository());\n    PersonService\
    \ personService = new PersonService(personRepo);\n\n    personService.savePeople(people.toArray(Person::new));\n\
    \    assertThat(repo.findAll()).isEqualTo(people);\n\n    // Verify the method\
    \ calls on the spy\n    verify(personRepo, times(people.size())).save(any(Person.class));\n\
    }\n```\n\nThat's useful, and a good reason to use spies.\n\nSpies also have the\
    \ capability to mock some methods rather than all of them. But that's risky because\
    \ the internal state of the real object can become inconsistent. For example,\
    \ if you mock the save method but not the count method in PersonRepository, the\
    \ internal count won't increment when you save a new Person. Even worse, the documentation\
    \ points out that Mockito \"does not delegate calls to the passed real instance,\
    \ instead it creates a copy of it.\" So if you call regular (that is, unstubbed)\
    \ methods on the spy but not on the real instance, you won't see their effects.\n\
    \nPartial mocks are therefore much trouble than they're worth. The Mockito documentation\
    \ discusses a couple of situations where they can be helpful, but the Mockito\
    \ discourages their use in general.\n\n# Partial Mocks for Subsections\n\n> Normally\
    \ you don't want to use partial mocks because their state is not maintained between\
    \ the mocked methods and the non- mocked methods. One place where partial mocks\
    \ can be useful, therefore, is when the mocked methods do not interact with the\
    \ others.\n\n> For example, if part of your system involves authentication or\
    \ authorization, you can use a partial mock to make sure those methods either\
    \ confirm or deny a user has been processed. As long as the rest of the system\
    \ only interacts with the security system through the mocked methods, it should\
    \ work properly.\n\n![](img/8c17bd3ac8631e54c044c56d594fa853_66_0.png)"
