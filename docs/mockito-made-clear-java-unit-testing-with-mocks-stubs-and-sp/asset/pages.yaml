  md: "# Setting Outputs Based on Inputs with Custom Answers\n\nArgument captures\
    \ allow you to find out exactly what arguments were supplied to a mocked method,\
    \ even when that argument is created as a local variable in the implementation.\n\
    \n# Setting Outputs Based on Inputs with Custom Answers\n\nMockito is a mature\
    \ library, so it probably provides everything you want to do. But sometimes capabilities\
    \ aren't obvious, either from the API or from the documentation. One such capability\
    \ involves using the Answer interface. Custom answers allow you to tell Mockito\
    \ that the output of a mocked method should be based in some way upon its inputs.\n\
    \nHere's a simple example. In the PersonService interface, say there's a savePeople\
    \ method that takes a vararg list of Person instances as arguments and returns\
    \ a list of their generated primary keys. It implements this by passing each Person\
    \ to the corresponding save method in PersonRepository:\n\n```\nPersonService.java\n\
    public List<Integer> savePeople(Person... person) {\n    return Arrays.stream(person)\n\
    \        .map(repository::save) // generates ids\n        .map(Person::getId)\n\
    \        .collect(Collectors.toList());\n}\n```\n\nThe PersonService therefore\
    \ depends on the PersonRepository to do its job. If you want to test the savePeople\
    \ method in PersonService, you need to mock the save(Person) method in PersonRepository:\n\
    \n```\npublic interface PersonRepository {\n    // ... other methods ...\n   \
    \ Person save(Person person);\n}\n```\n\nHere's one attempt to write a test for\
    \ savePeople:\n\n```\nPersonServiceTest.java\n@Test\npublic void saveAllPeople()\
    \ {\n    when(repository.save(any(Person.class)))\n        .thenReturn(people.get(0),\n\
    \        people.get(1),\n        people.get(2),\n        people.get(3),\n    \
    \    people.get(4));\n\n    // test the service (which uses the mock)\n    assertEquals(List.of(1,\
    \ 2, 3, 14, 15),\n        service.savePeople(people.toArray(Person[]::new)));\n\
    ```"
