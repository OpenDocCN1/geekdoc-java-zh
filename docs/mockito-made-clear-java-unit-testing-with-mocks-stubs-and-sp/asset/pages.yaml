  md: '# Use Mockito in Special Cases


    I spent several years teaching introductory Java courses to developers coming
    from procedural languages, and I found certain concepts particularly confusing
    for students. One is the concept of a static method, because the English word
    static has nothing to do with class-level methods that can be invoked without
    an object. The English word static is similar to Java''s keyword final, meaning
    a method or class that can''t be overridden.


    While Mockito has always had the ability to let you mock classes, mocking final
    classes and methods or mocking static methods requires special care. We''ll look
    at both in this chapter.


    Another special situation we''ll explore is how the Spring Framework—one of the
    most popular Java frameworks in the open source world—supports Mockito. Specifically,
    Spring Boot introduced an annotation called @Bean, which combines mocking a class
    with Spring''s excellent dependency injection capabilities.


    Finally, the Mockito team is careful to point out that not every class should
    be mocked. We''ll review their strong recommendations about when not to use Mockito.


    # Mocking Final Classes and Methods


    When you mock an interface, Mockito generates an implementation of that interface—not
    terribly surprising. But Mockito can mock classes too, which requires extending
    the class and overriding some or all of its methods.


    What happens, though, when you ask Mockito to mock a method or a class marked
    final? Final methods can''t be overridden, and final classes can''t be extended,
    at least without some help via reflection. What does Mockito do?'
