    \ much, and when I do, it's for very small stakes. Still, it would be nice to\
    \ be able to bluff once in a while.\n\n# Deciding Between Mockito and BDDMockito\n\
    \nMockito contains two separate APIs with identical functionality. Normally that's\
    \ considered a “code smell”, but there's a reason for both, and you'll encounter\
    \ both APIs in practice.\n\nSo far when using Mockito, we've started with static\
    \ methods from the Mockito class. You'll find a completely parallel set of methods\
    \ in a subclass of Mockito called org.mockito.BDDMockito. The developers added\
    \ the BDDMockito class to support BDD.\n\nWe've been using methods like the when/thenReturn\
    \ pair to set expectations and the verify method to check methods on stubs were\
    \ called. The BDDMockito has a different API to accomplish the same tasks. BDD\
    \ emphasizes writing tests using given, when, and then to represents the setup\
    \ of the test, invoking it immediately: You can probably see the problem immediately:\
    \ Mockito class already has a method called when that's not designed to fit the\
    \ BDD model.\n\nSince the developers of Mockito wanted to support the BDD approach,\
    \ they added the BDDMockito class. In that class, setting the expectations begins\
    \ with the method called given, by variations on when to set the return value.\
    \ This is the signature of the given method in BDDMockito:\n\n```\npublic static\
    \ <?> BDDMyongingStubbing<T> given(T methodCall)\n```\n\nIn the regular Mockito\
    \ class, the method is followed in a chain by of thenReturn, thenThrow, or other\
    \ methods. In BDDMockito, the given method is followed by willReturn, willThrow,\
    \ or in the same pattern.\n\nFor example, here is a test of the getMaxId of the\
    \ PersonService, which requires us to mock the findAll method of the PersonRepository:\n\
    \n```\nPersonServiceTest.java\n@Test\npublic void findMaxId() {\n    when(repository.findAll()).thenReturn(people);\n\
    \    assertThat(service.getHighestId()).isEqualTo(14);\n    verify(repository.findAll());\n\
    }\n```"
