  md: "# Deciding Between Mockito and BDMockito • 45\n\nIf this is written using the\
    \ corresponding methods in the BDMockito class, the\ntest looks like this:\n\n\
    ```\nPersonService.java\n@Test\npublic void findMaxIdBDD() {\n    given(repository.findAll()).willReturn(people);\n\
    \    assertThat(service.getTestId()).isEqualTo(14);\n    then(repository).should().findAll();\n\
    }\n```\n\nSetting the expectation simply replaces when given and willReturn with\
    \ will-\nReturn. The verification step is slightly more complicated, because in\
    \ addition\nfor replacing with then, BDMockito requires you to add a should method\
    \ call\nbefore specifying the method that was invoked.\n\nWhy is the should method\
    \ required? The verify method from Mockito is overloaded\nto specify the multiplicity:\n\
    \n```\nverify(repository, times(1)).findAll()\n```\n\nCalling the findAll method\
    \ only once is the default, so you can leave it out,\nas the test. The then method\
    \ in BDMockito doesn't have an overloaded version,\nhover. To specify the multiplicity,\
    \ you put the argument inside should:\nthen(repository).should(times(1)).findAll();\n\
    \nIt seems odd to be forced to include even when the multiplicity is\nexactly\
    \ 1 (the default), but it does read better to a native English speaker.\n\nThe\
    \ rest of the BDMockito class is simple search-and-replace variations on the\n\
