    \ Simply provide a lambda expression that takes a single argument of the type\
    \ and returns a Boolean. You can eliminate the class in the example and write\
    \ the following to the expectation:\n\n```\nverify(mock).addAll(argThat(list ->\
    \ list.size() == 2));\n```\n\nEasy breezy, lemon squeeze. By removing the friction\
    \ of implementing your own class and instantiating it when setting the expectations\
    \ and when verifying them, the whole process becomes much easier.\n\nA working\
    \ example using lambdas to implement custom matchers is shown in Testing void\
