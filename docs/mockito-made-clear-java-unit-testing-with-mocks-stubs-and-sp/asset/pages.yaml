  md: "# Using Mocks and Stubs in the Astro Project\n\nIn Counting Astronauts by Spaceship,\
    \ on page 8, we introduced a project that processed the number of astronauts in\
    \ space and returned how many aboard spacecraft. The examples there showed an\
    \ integration test for the AstroService class and how to create a unit test using\
    \ our own FakeGateway. Now we can use Mockito to mock the Gateway<T> interface.\n\
    \nAs a reminder, AstroService retrieves the data from a Gateway<T>, reproduced\
    \ here:\n\n```\nGateway.java\npublic interface Gateway<T> {\n    T getResponse();\n\
    }\n```\n\nThe class that implements this interface is called AstroGateway, and\
    \ returns an AstroResponse that could be null. If we're going to isolate the AstroService,\
    \ we need to ask Mockito to return either that AstroResponse or throw a RuntimeException\
    \ if it's null.\n\nLet's use JUnit 5 along with the Mockito annotations. The test\
    \ class for AstroService now starts with this:\n\n```\nAstroServiceTest.java\n\
    @ExtendWith(MockitoExtension.class)\nclass AstroServiceTest {\n\n    @Mock\n \
    \   private Gateway<AstroResponse> gateway;\n    @InjectMocks\n    private AstroService\
    \ service;\n```\n\nWe'll rely on Mockito to create the mock of the gateway and\
    \ inject it into the service because we've provided a constructor to the AstroService\
    \ class that takes a Gateway as an argument.\n\nOne test then looks like this:\n\
    \n```\nAstroServiceTest.java\n@Test\nvoid testAstroData_usingInjectedMockGateway()\
    \ {\n    // Mock Gateway created and injected into AstroService using\n    //\
    \ @Mock and @InjectMock annotations\n    //\n    // Set the expectations on the\
    \ mock\n    when(gateway.getResponse())\n        .thenReturn(mockAstroResponse);\n\
    \n    // Call the method under test\n```"
