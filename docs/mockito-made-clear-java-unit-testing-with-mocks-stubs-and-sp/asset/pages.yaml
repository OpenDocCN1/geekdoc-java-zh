  md: "# Chapter 5. Use Mockito in Special Cases • 68\n\n```\nPersonServiceSpring.java\n\
    @Service // Can only autowire into a managed bean\npublic class PersonService\
    \ {\n    private final PersonRepository repository;\n\n    @Autowired // Not required\
    \ if one constructor, but doesn't hurt\n    public PersonService(PersonRepository\
    \ repository) {\n        this.repository = repository;\n    }\n\n    // ... methods\
    \ that use the repository ...n}\n```\n\nWhen writing a test for the PersonService\
    \ outside of Spring, we used @Mock on the repository and @InjectMock on the service.\
    \ That won't work with Spring’s autowiring, however. Instead, you use the @MockBean\
    \ annotation to make the repository you want.\n\n```\nPersonServiceSpringTest.java\n\
    @SpringBootTest\nclass PersonServiceTest {\n    @MockBean // Instantiate mock\
    \ and put into the application context\n    private PersonRepository repository;\n\
    \n    @Test\n    public void findMaxId() {\n        // Set expectations on mock\n\
    \        when(repository.findAll()).thenReturn(people);\n\n        // Test service\
    \ method\n        assertEquals(14, service.getHighestId().intValue());\n\n   \
    \     // Verify call on mock\n        verify(repository).findAll();\n}\n```\n\n\
    The @MockBean annotation on the PersonRepository not only creates a mock object,\
    \ it replaces any existing PersonRepository in the application context with the\
    \ mock. That makes it available for autowiring, and Spring does the rest.\n\n\
    Spring also has a similar annotation called @SpyBean. That annotation wraps a\
    \ Mockito spy around an existing instance of the field. As with spies, they are\
    \ useful when you want to verify that methods on the dependencies got the right\
    \ number of times in the right order, but you still want to use real instances\
    \ of the dependencies themselves.\n\nNext we'll consider another controversial\
    \ notion—when you should avoid using Mockito at all?"
