    # Unit Tests Versus Integration Tests


    The concept of a unit originally meant a conceptual part of software that can
    work independently. The idea was a developer could work on unit and confirm it
    worked with tests that ignored the rest of the system. Later, you could bring
    different units back together. The tests that confirmed the entire system were
    called integration tests. The distinction between unit and integration tests was
    about testing code in isolation, as opposed to testing code brought together.


    Over time, with object-oriented systems, unit tests grew to mean testing a single
    class in isolation, while integration tests checked a class connected with other
    classes. That definition is arguably more fine-grained than the original concepts.
    Since virtually all classes depend on something themselves, you can argue that
    all tests are actually integration tests.


    If you''re interested in reading more, Martin Fowler''s blog post talks about
    meaning and use of the terms unit and integration testing.


    In our integration test, we took a practical approach. The purpose of testing
    is to isolate problems. If we had a failing integration test, we''d use unit tests
    to isolate the failure to either the gateway or the service.


