  md: "# Using Argument Matchers for Primitive Types\n\nInvoking the findById method\
    \ on PersonRepository returns an Optional whenever the requested ID was greater\
    \ than 14. That was expressed using a custom matcher implemented using a lambda\
    \ expression:\n\n```\nwhen(repository.findById(argThat(id -> id > 14))\n    .thenReturn(Optional.empty()));\n\
    ```\n\nThat code looks simple enough, the lambda expression is correct. Unfortunately,\
    \ when you return from the test, you get a NullPointerException.\n\nWhy would\
    \ the return value from the argThat be null? Even weirder, if you look at the\
    \ JavaDocs for the argThat method, even though the signature claims it returns\
    \ T (the class), the docs say it's supposed to return null, again, why is this\
    \ a problem?\n\nThe answer lies in this warning for argThat:\n\n> NullPointerException\
    \ auto-boxing caveat. In cases when matching primitive types you must use relevant\
    \ int(That), float(That), etc. This method you will avoid NullPointerException\
    \ during auto-boxing. But how Java works doesn't have a clean way of detecting\
    \ this scenario and protecting the user from this. Hopefully, the Java describes\
    \ the problem and solution well. If you have an idea how to fix the problem, let\
    \ us know the mailing list or the issue tracker.\n\nIn other words, the problem\
    \ is related to unboxing wrapper classes into primitive types, and the doc claims\
    \ this isn't easily fixable. There is, however, an easy fix: instead of calling\
    \ the argThat method, call one of its primitive variants: byteThat, shortThat,\
    \ charThat, intThat, longThat, floatThat, doubleThat, and booleanThat.\n\nSo the\
    \ right way to add the custom matcher in this case is to use intThat:\n\n```\n\
    PersonService.java\n@Test\npublic void findByIdThatDoesNotExistNotExist_intThat()\
    \ {\n    // Custom matcher as lambda argument to intThat:\n    repository.findById(intThat(id\
    \ -> id > 14))\n        .thenReturn(Optional.empty());\n    List<Person> personList\
    \ = service.findByIds(15, 42, 78, 999);\n    assertTrue(personList.isEmpty());\n\
    }\\verify(repository, times(4)).findById(anyInt());\n```\n\n+   2. https://www.javadoc.io/doc/org.mockito/mockito-core/2.7.13/org/mockito/hamcrest/MockitoHamcrest.html"
