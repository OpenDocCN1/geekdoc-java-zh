  md: 'The first argument is the mocked object. The second argument is an interface
    that you rarely need to implement because it''s already generated by the many
    factory methods. Those are static methods in the Mockito class, listed here:


    +   * times(int)

    * never(int)

    * atLeastOnce(int)

    * atLeast(int)

    * atMostOnce(int)

    * atMost(int)


    The default, naturally enough, is times(1), so if you call verify with just one
    argument, the check is that the mocked method was invoked exactly once.


    Note that if you wrote your own mocks, you wouldn''t be able to do this. Java
    doesn''t provide an easy way to keep track of how many times methods were called.
    By doing so, Mockito allows you to verify the protocol, which is the interaction
    between class test and its dependencies.


    # No Further Interactions


    Use the never method to verify that a particular method is never invoked. More
    generally, Mockito has a method called verifyNoMoreInteractions(mock), which checks
    that no methods other than the ones explicitly stated were invoked at.


    That method sounds powerful, the JavaDocs contains a caution: A warning of word:
    Some users who did a lot of classic, expect-run-verify mocking to use verifyNoMoreInteractions()
    very often, in every test method. verifyNoMoreInteractions is not recommended
    to use in every test method. verifyNoMoreInteractions() is a handy assertion for
    the interaction testing toolkit. Use it only when it''s relevant (for example,
    regression testing of legacy code). Abusing it leads to over-specified, less maintainable
    tests.


    ![](img/8c17bd3ac8631e54c044c56d594fa853_41_0.png)


    The when/thenReturn/thenThrow/thenAnswer pattern works well, but you can''t use
    it in methods that return void (that is, nothing); these require special handling.
    Fortunately, while the recommended syntax looks different, using it is as easy.


    # Mocking Methods That Return void


    You need to know one quirk of the Mockito syntax. When you try to set expectations
    on a method that returns void, you can''t use the when/then syntax.'
