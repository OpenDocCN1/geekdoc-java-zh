  md: "# APPENDIX 1\n\n# # Running Mockito Tests\n\nThis appendix describes the steps\
    \ needed to run JUnit tests with Mockito. We'll cover both JUnit 5 and the older\
    \ JUnit 4. The steps used for JUnit 4 will also work for JUnit 3, though the tests\
    \ themselves use a different API. Here we assume you're using either Maven or\
    \ Gradle build tool. Steps for running with other tools like Ant or Bazel can\
    \ be found in the JUnit documentation.\n\n# ## Steps Common to All JUnit Versions\n\
    \nThe Maven coordinates for Mockito are the same, whether you're using Gradle\
    \ or Maven as a build tool. Following is the *core* dependency for Mockito in\
    \ a Maven pom.xml file:\n\n```\n<dependency>\n  <groupId>org.mockito</groupId>\n\
    \  <artifactId>mockito-core</artifactId>\n  <version>4.8.1</version>\n  <scope>test</scope>\n\
    </dependency>\n```\n\nAnd for Gradle, here's the short version, using Groovy DSL:\n\
    \n```\ntestImplementation 'org.mockito:mockito-core:4.8.1'\n```\n\nThe only difference\
    \ is that the Kotlin DSL is you use double quotes instead of single quotes for\
    \ the dependency, and the dependency needs to be wrapped in parentheses:\n\n```\n\
    testImplementation(\"org.mockito:mockito-core:4.8.1\")\n```\n\nIf you plan to\
    \ mock final methods or classes, constructors, or static methods, you need the\
    \ *inline mock maker* dependency, which simply replaces mockito-core with mockito-inline.\
    \ The rest is the same. Though Mockito 5 has not been yet"
