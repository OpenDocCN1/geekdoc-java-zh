    # Mockito Test Process


    Formally, the process we''re using consists of:


    +   1. Creating stubs to stand for the dependencies.

    2. Setting expectations on the stubs to do what you want.

    3. Injecting the stubs into the class you''re planning to test.

    4. Testing the methods in the class under test by invoking its methods, in turn
    call methods work as expected.

    5. Checking the methods work as expected.

    6. Verifying the methods on the dependencies got invoked the right number of times,
    in the right order.


    You can use these steps every time you want to use Mockito (honestly, any similar
    tool) for replacing dependencies in the class under test, thereby writing true
    unit tests.


    The rest of this book is about how to use Mockito to implement these steps. To
    begin, let''s consider a program that uses a RESTful web service to download and
    transform JSON data into Java objects and post-processes those to answer interesting
    questions. The problem involves astronauts in space. I chose this project because
    (1) it''s reasonably small, and (2) astronauts in space are, by definition, cool.


