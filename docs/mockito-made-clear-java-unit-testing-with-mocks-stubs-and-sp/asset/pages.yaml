  md: "```\n// verify the interaction between the service and the mock\nverify(repository,\
    \ times(people.size())).save(any(Person.class));\nverify(repository, never()).delete(any(Person.class));\n\
    \n```\n\nThis example sets up a list of Person ahead of time. The expectation\
    \ on the save method that the first time it's called, it should return the first\
    \ element of that collection, the second time it returns the second person, and\
    \ so on. The thenReturn method explicitly lists each return value, one by one.\
    \ When calling savePeople, the array method converts the list into an array, which\
    \ matches the vararg argument.\n\nThe thing is, there should be a way to set the\
    \ expectations on save without stating return value one by one. After all, we\
    \ want for the method to return its argument. We can't just say that?\n\nIn fact,\
    \ that's easy to do, the syntax isn't necessarily intuitive. Instead of using\
    \ thenReturn, use the thenAnswer method, which takes its argument as an implementation\
    \ of the Answer<T> interface.\n\nOngoingStubbing<T> thenAnswer(Answer<T>) answer\n\
    \nThe Answer interface has a single method called answer:\n\n```\nT answer(InvocationMock\
    \ invocation) throws Throwable\n```\n\nThis code doesn't look terribly at first\
    \ glance, but the key is the InvocationMock argument. Here are the methods in\
    \ class:\n\n```\npublic interface InvocationMock extends Serializable {\n    Object\
    \ getMock();\n    Method getMethod();\n    Object[] getArguments();\n    T getArgument(int\
    \ index); // return the argument at a given index\n    T getArgument(int index,\
    \ Class<T> clazz);\n    Object callRealMethod() throws Throwable;\n}\n```\n\n\
    The method we want is the fourth one: the overload of getArgument that takes an\
    \ integer index. That allows you to rewrite the expectations line:\n\n```\n.when(repository.save(any(Person.class)))\n\
    .thenAnswer(invocation -> invocation.getArgument(0));\n```\n\nWhen save is invoked\
    \ with any Person, reply with its first argument. That's all that's necessary.\
    \ The only problem (if there is one) is that the names of methods don't necessarily\
    \ tell you what they do, you can tell a mocked method to return an output based\
    \ entirely on its input arguments."
