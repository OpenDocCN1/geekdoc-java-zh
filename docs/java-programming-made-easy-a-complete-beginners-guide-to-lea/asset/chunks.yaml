- fmt: "\nIn this project, we will build an `Animal` Class Hierarchy that demonstrates\
    \ the concepts of inheritance, polymorphism, and method overriding in action.\
    \ We'll create a series of classes representing different animals, each of which\
    \ will have a common behavior, such as making a sound, but each animal will have\
    \ its own specific implementation of this behavior.\n\nBy the end of this project,\
    \ you will have a solid understanding of how to design class hierarchies and apply\
    \ OOP principles effectively.\n\n### Step 1: Creating the Animal Superclass\n\n\
    First, we'll start by defining a base class, `Animal`. This will be the common\
    \ ancestor for all specific animal types. The base class will have a general method\
    \ `makeSound()`, which will be overridden by each subclass to provide specific\
    \ animal sounds.\n\n```java\n// Base class: Animal\npublic class Animal {\n  \
    \  // The makeSound method in the Animal class is defined, but it doesn't do anything\
    \ specific.\n    public void makeSound() {\n        System.out.println(\"This\
    \ animal makes a sound\");\n    }\n}\n```\n\nIn the `Animal` class:\n- We have\
    \ defined a simple method `makeSound()`.\n- This method doesn't do anything specific\
    \ but serves as a placeholder for the subclasses to override with their specific\
    \ implementations.\n\n### Step 2: Creating Subclasses (Dog, Cat, Bird)\n\nNow,\
    \ let's create some specific animal subclasses: `Dog`, `Cat`, and `Bird`. These\
    \ classes will inherit from the `Animal` class and override the `makeSound()`\
    \ method to provide animal-specific sounds.\n\n```java\n// Subclass: Dog\npublic\
    \ class Dog extends Animal {\n    @Override\n    public void makeSound() {\n \
    \       System.out.println(\"The dog barks\");\n    }\n}\n\n// Subclass: Cat\n\
    public class Cat extends Animal {\n    @Override\n    public void makeSound()\
    \ {\n        System.out.println(\"The cat meows\");\n    }\n}\n\n// Subclass:\
    \ Bird\npublic class Bird extends Animal {\n    @Override\n    public void makeSound()\
    \ {\n        System.out.println(\"The bird chirps\");\n    }\n}\n```\n\nIn the\
    \ subclasses:\n- We override the `makeSound()` method to provide the specific\
    \ sound for each animal.\n- The `@Override` annotation indicates that we are overriding\
    \ the method defined in the `Animal` class.\n\n### Step 3: Testing the Animal\
    \ Hierarchy\n\nNext, we’ll write a test class to create instances of the `Dog`,\
    \ `Cat`, and `Bird` classes. We'll demonstrate runtime polymorphism here, where\
    \ we’ll use the base class reference (`Animal`) to refer to objects of the subclasses.\
    \ Even though the reference is of type `Animal`, the correct `makeSound()` method\
    \ will be called based on the actual object type (i.e., `Dog`, `Cat`, or `Bird`).\n\
    \n```java\npublic class Main {\n    public static void main(String[] args) {\n\
    \        // Create Animal references to Dog, Cat, and Bird objects\n        Animal\
    \ myDog = new Dog();  // Dog object, referred to by Animal reference\n       \
    \ Animal myCat = new Cat();  // Cat object, referred to by Animal reference\n\
    \        Animal myBird = new Bird(); // Bird object, referred to by Animal reference\n\
    \n        // Calling the makeSound method on each object\n        myDog.makeSound();\
    \  // Output: The dog barks\n        myCat.makeSound();  // Output: The cat meows\n\
    \        myBird.makeSound(); // Output: The bird chirps\n    }\n}\n```\n\n####\
    \ Explanation:\n1. In the `Main` class, we create `Animal` references (`myDog`,\
    \ `myCat`, and `myBird`) that point to objects of type `Dog`, `Cat`, and `Bird`,\
    \ respectively.\n2. When we call the `makeSound()` method on each reference, polymorphism\
    \ ensures that the correct method is called at runtime.\n   - For `myDog`, the\
    \ `makeSound()` method from the `Dog` class is executed.\n   - For `myCat`, the\
    \ `makeSound()` method from the `Cat` class is executed.\n   - For `myBird`, the\
    \ `makeSound()` method from the `Bird` class is executed.\n\nThis is an example\
    \ of runtime polymorphism because the method that gets executed is determined\
    \ based on the object type, not the reference type.\n\n### Step 4: Adding Additional\
    \ Features to the Animal Class\n\nTo make this hierarchy even more interesting,\
    \ let's add some more attributes and methods to our `Animal` class, such as `name`\
    \ and `age`. We'll also add getters and setters for these attributes, which will\
    \ allow us to customize and retrieve information about each animal.\n\nHere’s\
    \ the updated `Animal` class with additional features:\n\n```java\n// Base class:\
    \ Animal\npublic class Animal {\n    // Instance variables for name and age\n\
    \    private String name;\n    private int age;\n\n    // Constructor to initialize\
    \ the name and age of the animal\n    public Animal(String name, int age) {\n\
    \        this.name = name;\n        this.age = age;\n    }\n\n    // Getter for\
    \ the name\n    public String getName() {\n        return name;\n    }\n\n   \
    \ // Setter for the name\n    public void setName(String name) {\n        this.name\
    \ = name;\n    }\n\n    // Getter for the age\n    public int getAge() {\n   \
    \     return age;\n    }\n\n    // Setter for the age\n    public void setAge(int\
    \ age) {\n        this.age = age;\n    }\n\n    // Method to display animal info\n\
    \    public void displayInfo() {\n        System.out.println(\"Name: \" + name\
    \ + \", Age: \" + age);\n    }\n\n    // The makeSound method in the Animal class\n\
    \    public void makeSound() {\n        System.out.println(\"This animal makes\
    \ a sound\");\n    }\n}\n```\n\nIn this updated `Animal` class:\n- We have added\
    \ instance variables: `name` and `age`.\n- We have provided getter and setter\
    \ methods for both attributes.\n- We also added a `displayInfo()` method to print\
    \ the name and age.\n\nLet’s also update the subclasses to use these:\n\n```java\n\
    // Subclass: Dog\npublic class Dog extends Animal {\n    public Dog(String name,\
    \ int age) {\n        super(name, age);\n    }\n    @Override\n    public void\
    \ makeSound() {\n        System.out.println(\"The dog barks\");\n    }\n}\n\n\
    // Subclass: Cat\npublic class Cat extends Animal {\n    public Cat(String name,\
    \ int age) {\n        super(name, age);\n    }\n    @Override\n    public void\
    \ makeSound() {\n        System.out.println(\"The cat meows\");\n    }\n}\n\n\
    // Subclass: Bird\npublic class Bird extends Animal {\n    public Bird(String\
    \ name, int age) {\n        super(name, age);\n    }\n    @Override\n    public\
    \ void makeSound() {\n        System.out.println(\"The bird chirps\");\n    }\n\
    }\n```\n\nFinally, let’s update the `Main` class to use the new:\n\n```java\n\
    public class Main {\n    public static void main(String[] args) {\n        //\
    \ Create Animal references to Dog, Cat, and Bird objects with name and age\n \
    \       Animal myDog = new Dog(\"Buddy\", 5);\n        Animal myCat = new Cat(\"\
    Whiskers\", 3);\n        Animal myBird = new Bird(\"Tweety\", 2);\n\n        //\
    \ Display information about each animal\n        myDog.displayInfo(); // Output:\
    \ Name: Buddy, Age: 5\n        myCat.displayInfo(); // Output: Name: Whiskers,\
    \ Age: 3\n        myBird.displayInfo(); // Output: Name: Tweety, Age: 2\n\n  \
    \      // Calling the makeSound method on each object\n        myDog.makeSound();\
