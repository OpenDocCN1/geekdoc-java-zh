    ### 3\. Inheritance: Building on Existing Code


    Inheritance is a mechanism that allows one class to inherit the properties and
    behaviors of another class. In Java, this allows you to create a new class (child
    class) based on an existing class (parent class). Inheritance promotes code reusability
    and enables a hierarchical class structure.


    #### Example of Inheritance:


    java


    class Animal {


    public void eat() {


    System.out.println("This animal is eating.");


    }


    }


    class Dog extends Animal {


    public void bark() {


    System.out.println("The dog barks.");


    }


    }


    public class Main {


    public static void main(String[] args) {


    Dog myDog = new Dog();


    myDog.eat();  // Inherited method


    myDog.bark(); // Dog''s own method


    }


    }


    In this example:


    ●       Dog is a subclass of  Animal and inherits the  eat() method from  Animal.


    ●       The  Dog class also defines its own method,  bark(), which is specific
    to the dog class.


    Inheritance allows us to build upon existing classes without having to rewrite
    code, making our programs more maintainable and extensible.


    * * *


    ### 4\. Polymorphism: One Interface, Many Implementations


    Polymorphism means "many shapes" and allows you to use a single method or object
    to represent different types. This is most commonly seen in two forms in Java:
    method overriding and method overloading.


    ● Method Overriding allows a subclass to provide its own specific implementation
    of a method that is already defined in the superclass.


    ● Method Overloading allows a class to define multiple methods with the same name
    but with different parameters.


    #### Example of Polymorphism through Method Overriding:


    java


    class Animal {


    public void sound() {


    System.out.println("Some generic animal sound");


    }


    }


    class Dog extends Animal {


    @Override


    public void sound() {


    System.out.println("Woof! Woof!");


    }


    }


    public class Main {


    public static void main(String[] args) {


    Animal myAnimal = new Animal();


    Animal myDog = new Dog();


    myAnimal.sound();  // Outputs: Some generic animal sound


    myDog.sound();     // Outputs: Woof! Woof!


    }


    }


    Here:


    ●       sound() is overridden in the  Dog class to provide a specific implementation.


    ● At runtime, Java determines the correct version of the  sound() method to call
    based on the object’s actual type, not its reference type. This is known as runtime
    polymorphism.


    * * *


    ### Why OOP is Important in Java


    Java is designed to be an object-oriented language, and embracing OOP allows you
    to:


    ●       Build software that is modular and easier to maintain.


    ●       Encourage reusability of code, reducing duplication.


    ●       Increase flexibility by allowing you to write code that can work with
    objects of different types.


    ●       Improve scalability and organization, making large projects more manageable.


    By mastering OOP, you will be equipped to write cleaner, more efficient code and
    be better prepared to handle complex software design challenges.


    * * *


    ## 5.2 Classes and Objects


    In the world of Object-Oriented Programming (OOP), classes and objects are the
    core building blocks. If you''re just starting out with OOP, understanding how
    these two work together is essential. In this chapter, we''ll dive into what classes
    and objects are, how to create them, and how they interact in Java.


    * * *


    ### What is a Class?


    A class is essentially a blueprint or template for creating objects. It defines
    the attributes (variables) and behaviors (methods) that the objects created from
    it will have. Think of a class as a plan that outlines what an object will look
    like and how it will act.


    In Java, classes are defined using the  class keyword, and they can contain:


    ●       Fields: These are variables that hold data related to the object.


    ●       Methods: These are functions that define the actions or behaviors that
    the object can perform.


    ●       Constructors: Special methods used to initialize objects when they are
    created.


    #### Example of a Simple Class


    java


    public class Car {


    // Fields (attributes)


    String model;


    int year;


    String color;


    // Method (behavior)


    public void startEngine() {


    System.out.println("The " + color + " " + model + " is starting.");


    }


    // Another method (behavior)


    public void stopEngine() {


    System.out.println("The " + color + " " + model + " is stopping.");


    }


    }


    In the  Car class:


    ●       Attributes:  model,  year, and  color represent the characteristics of
    a car.


    ●       Methods:  startEngine() and  stopEngine() define the actions a car can
    perform.


    * * *


    ### What is an Object?


    An object is an instance of a class. When you create an object, you''re essentially
    creating a specific instance of that class with its own unique set of data. If
    a class is the blueprint, an object is the actual house built from that blueprint.


    To create an object in Java, you use the  new keyword, followed by the class constructor.
    A constructor is a special method used to initialize the object''s fields.


    #### Example of Creating an Object


    java


