    Number is greater than 5\");\n\n}\n\n●        \n\nLoops: Java supports three types\
    \ of loops:  for,  while, and  do-while.\n\njava\n\nfor (int i = 0; i < 5; i++)\
    \ {\n\nSystem.out.println(i);\n\n}\n\n●        \n\n#### Example Code: Using Java\
    \ Keywords\n\nLet's tie everything together with an example that uses several\
    \ Java keywords and demonstrates basic syntax:\n\njava\n\npublic class BankAccount\
    \ {\n\n// Instance variables\n\nprivate String accountHolder;\n\nprivate double\
