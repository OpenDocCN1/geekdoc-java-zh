  trans: "\n\n你可以在文件操作中使用相对路径和绝对路径。\n\n- 相对路径：`\"example.txt\"` 指向项目根目录下的文件。\n- 绝对路径：`\"\
    /Users/yourname/Documents/example.txt\"` 是指向特定文件的完整路径。\n\n```java\nFileWriter\
    \ writer = new FileWriter(\"/Users/jane/Documents/log.txt\", true);\n```\n\n务必处理特定平台的路径分隔符（Windows\
    \ 使用 `\\`，macOS/Linux 使用 `/`），或使用 `File` 类来构建可移植的路径。\n\n## 最佳实践\n\n- 始终使用 `close()`\
    \ 或 try-with-resources 关闭文件流，以避免内存泄漏。\n- 捕获 `IOException` 等异常，以优雅地处理文件访问问题。\n\
    - 对于大文件，优先使用 `BufferedWriter` 或 `BufferedReader`（将在下一节介绍）。\n- 开发期间使用相对路径以获得更好的可移植性。\n\
    \n## 第 9.2 节 BufferedReader 和 Scanner\n\n在 Java 中处理文本文件或用户输入时，性能和灵活性是关键。虽然 `FileReader`\
    \ 和 `FileWriter` 适用于简单用例，但在读取大文件或逐行处理数据时，它们的效率可能较低。这就是 `BufferedReader` 和 `Scanner`\
    \ 大显身手的地方。\n\n在本章，我们将探索这两个类，解释何时使用每一个，并向你展示可以在自己的应用程序中使用的示例。\n\n### 为什么使用 BufferedReader\
    \ 和 Scanner？\n\n`BufferedReader` 和 `Scanner` 都用于读取文本，但它们的作用略不同：\n\n- `BufferedReader`\
    \ 设计用于快速读取文本文件，特别是在读取大块文本或文本行时。\n- `Scanner` 当你需要解析输入或从文件/用户输入中读取格式化数据时，它更加灵活且强大。\n\
    \n让我们详细查看这两个类。\n\n### 使用 BufferedReader 读取文件\n\n`BufferedReader` 类从字符输入流中读取文本，并缓存字符，以便高效地读取行或字符。它包装了\
    \ `FileReader` 等其他读取器。\n\n#### 示例：逐行读取文件\n\n```java\nimport java.io.BufferedReader;\n\
    import java.io.FileReader;\nimport java.io.IOException;\n\npublic class BufferedReaderExample\
    \ {\n    public static void main(String[] args) {\n        try {\n           \
    \ // 使用 FileReader 打开文件，并用 BufferedReader 包装\n            BufferedReader reader\
    \ = new BufferedReader(new FileReader(\"example.txt\"));\n            String line;\n\
    \            // 读取每行，直到文件结束\n            while ((line = reader.readLine()) !=\
    \ null) {\n                System.out.println(line);\n            }\n        \
    \    // 关闭读取器以释放系统资源\n            reader.close();\n        } catch (IOException\
    \ e) {\n            System.out.println(\"读取时发生错误：\" + e.getMessage());\n     \
    \   }\n    }\n}\n```\n\n解释：\n\n- `readLine()` 每次读取一行，在换行符处停止。\n- 缓冲方法意味着更少的直接磁盘访问操作，从而提高了性能。\n\
    \n#### BufferedReader 的优势\n\n- 对于大文件处理效率高。\n- 可以使用 `readLine()` 读取整行。\n- API 简单且性能良好。\n\
    \n### 使用 Scanner 读取输入\n\n`Scanner` 类是 `java.util` 包的一部分，非常适合解析数据，无论数据来自文件还是键盘。你可以逐行、逐单词甚至逐数字地扫描输入。\n\
    \n#### 示例：读取用户输入\n\n```java\nimport java.util.Scanner;\n\npublic class ScannerUserInputExample\
    \ {\n    public static void main(String[] args) {\n        Scanner scanner = new\
    \ Scanner(System.in); // 从标准输入读取\n        System.out.print(\"输入你的名字： \");\n  \
    \      String name = scanner.nextLine(); // 读取整行\n        System.out.print(\"\
    输入你的年龄： \");\n        int age = scanner.nextInt(); // 读取一个整数\n        System.out.println(\"\
    欢迎，\" + name + \"。你今年 \" + age + \" 岁。\");\n        scanner.close();\n    }\n\
    }\n```\n\n解释：\n\n- `nextLine()`：读取整行。\n- `nextInt()`, `nextDouble()` 等：读取特定类型。\n\
    - `System.in`: 标准输入流（控制台）。\n\n#### 示例：使用 Scanner 读取文件\n\n```java\nimport java.io.File;\n\
    import java.io.FileNotFoundException;\nimport java.util.Scanner;\n\npublic class\
    \ ScannerFileExample {\n    public static void main(String[] args) {\n       \
    \ try {\n            File file = new File(\"example.txt\");\n            Scanner\
    \ scanner = new Scanner(file);\n            // 读取并打印每一行\n            while (scanner.hasNextLine())\
    \ {\n                String line = scanner.nextLine();\n                System.out.println(line);\n\
    \            }\n            scanner.close();\n        } catch (FileNotFoundException\
    \ e) {\n            System.out.println(\"未找到文件：\" + e.getMessage());\n       \
    \ }\n    }\n}\n```\n\n解释：\n\n- `Scanner` 类从 `File` 读取。\n- `hasNextLine()` 检查是否有更多数据。\n\
    \n### BufferedReader 与 Scanner 的对比\n\n| 特性 | BufferedReader | Scanner |\n| :---\
    \ | :--- | :--- |\n| 性能 | 读取大文件时更快 | 较慢，未缓冲 |\n| 逐行读取 | 是 (`readLine()`) | 是 (`nextLine()`)\
    \ |\n| 标记解析 | 否 | 是 (`nextInt()`, `nextDouble()`) |\n| 输入源 | 仅限读取器 | 键盘、文件等 |\n\
    | 理想用例 | 高效文件读取 | 用户输入 |\n\n#### 何时使用何种工具\n\n- 当你想从文件快速逐行读取内容时，使用 `BufferedReader`。\n\
    - 当你需要解析不同的数据时，使用 `Scanner`。\n\n### 处理字符编码\n\n除非指定，否则 `BufferedReader` 和 `Scanner`\
    \ 都使用平台的默认编码。对于 UTF-8 编码的文件，使用 `InputStreamReader` 包装读取器：\n\n```java\nBufferedReader\
    \ reader = new BufferedReader(\n    new InputStreamReader(new FileInputStream(\"\
    example.txt\"), \"UTF-8\"));\n```\n这确保了跨平台的行为。\n\n## 第 9.3 节 FileWriter 和 BufferedWriter\n\
    \n向文件写入文本是许多应用程序的核心，无论是记录数据、保存用户设置还是导出报告。在 Java 中，`FileWriter` 和 `BufferedWriter`\
    \ 是可靠输出文本的首选类。在本章中，我们将深入探讨它们，比较性能，并演示示例。\n\n### FileWriter：基础\n\n`FileWriter`\
    \ 是用于写入文件的字符流类。它直接写入文件，当你只需要写入几行文本时非常方便。\n\n#### 语法\n\n```java\nFileWriter writer\
    \ = new FileWriter(\"output.txt\");\n```\n\n如果文件不存在，它将创建一个名为 `output.txt` 文件。如果存在，内容将被覆盖，除非你告诉\
    \ Java 追加。\n\n#### 示例：使用 FileWriter 写入文本\n\n```java\nimport java.io.FileWriter;\n\
    import java.io.IOException;\n\npublic class FileWriterExample {\n    public static\
    \ void main(String[] args) {\n        try {\n            // 创建写入 \"output.txt\"\
    \ 的 FileWriter 实例\n            FileWriter writer = new FileWriter(\"output.txt\"\
    );\n            // 向文件写入文本\n            writer.write(\"Hello, world!\\n\");\n\
    \            writer.write(\"这是的一行。\\n\");\n            // 关闭写入器以刷新并释放资源\n    \
    \        writer.close();\n            System.out.println(\"数据写入成功.\");\n     \
    \   } catch (IOException e) {\n            System.out.println(\"发生错误：\" + e.getMessage());\n\
    \        }\n    }\n}\n```\n\n要点：\n\n- `write()` 向文件写入字符或字符串。\n- 始终关闭写入器以确保数据正确保存。\n\
    - 如果你想追加文件而不是覆盖它，请使用构造函数 `new FileWriter(\"output.txt\", true)`。\n\n### BufferedWriter：带缓冲写入\n\
    \n`BufferedWriter` 在 `FileWriter` 之上缓冲区，通过将字符收集到缓冲区中一次性写入，减少了 I/O 操作的次数。这提高了性能，特别是在写入大量文本时。\n\
    \n#### 语法\n\n```java\nBufferedWriter writer = new BufferedWriter(new FileWriter(\"\
    output.txt\"));\n```\n\n"
