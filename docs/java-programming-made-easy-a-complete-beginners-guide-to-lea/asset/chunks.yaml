    \    // Calling printMessage() method\n        printMessage();  // Output: This\
    \ is a message!\n    }\n}\n```\n\n解释：\n- 方法 `printMessage()` 声明为 `void`，意味着它不返回任何值。\n\
    - 该方法简单地向控制台打印消息。\n- 在 `main()` 方法中，我们调用了 `printMessage()`，它的输出为：\n\n```csharp\n\
    This is a message!\n```\n\n***\n\n### 多返回值类型：使用重载方法\n\n有时，你可能想创建一个执行相同任务但处理不同类型输入的方法。Java\
    \ 允许你重载方法，这意味着你可以定义多个具有相同名称但参数列表不同的方法（即不同的参数数量或类型）。返回类型不是方法签名的一部分，因此重载必须依赖于参数。\n\
    \n#### 示例：方法重载\n\n让我们重载一个方法来计算形状的面积，可以是矩形或正方形。\n\n```java\npublic class ShapeArea\
