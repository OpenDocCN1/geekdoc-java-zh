    \ while | Defines a  while loop that continues as long as a condition is true.\
    \ | while (x > 0) { ... } |\n\n* * *\n\n#### Java Syntax Basics\n\nNow that we've\
    \ covered the keywords, let's take a look at some basic syntax rules that you'll\
    \ encounter when writing Java code. Here’s a quick rundown:\n\nClasses and Methods:\
    \ Every Java application must have at least one class, and within that class,\
    \ you typically define methods to perform actions.\n\njava\n\npublic class MyFirstClass\
    \ {\n\npublic static void main(String[] args) {\n\nSystem.out.println(\"Hello,\
