    import java.util.Scanner;\n```\n\n### 第 2 ：创建 Scanner 对象\n\n```java\nScanner scanner\
    \ = new Scanner(System.in);\n```\n\n### 第 3 ：读取用户输入\n\n让我们来看基础示例，获取用户的姓名和年龄：\n\
    \n```java\nimport java.util.Scanner;\npublic class InputExample {\n    public\
