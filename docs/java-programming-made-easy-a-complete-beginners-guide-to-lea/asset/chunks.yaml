    # Chapter 6: Encapsulation, Inheritance, and Polymorphism


    In this chapter, we’ll explore three fundamental concepts in object-oriented programming
    (OOP): encapsulation, inheritance, and polymorphism. These principles help us
    build well-structured, maintainable, and flexible software systems. By the end
    of this chapter, you''ll understand how to use access modifiers, create class
    hierarchies through inheritance, and leverage polymorphism to write dynamic and
    efficient code.


    * * *


    ## 6.1 Access Modifiers and Getters/Setters


    In object-oriented programming, one of the key principles is encapsulation. Encapsulation
    helps ensure that the internal state of an object is protected from unintended
    interference and misuse. Access modifiers and the use of getters and setters play
    a crucial role in implementing encapsulation.


    #### Access Modifiers


    Access modifiers are keywords in Java that set the visibility of class members
    (fields, methods, constructors). By carefully choosing the right access modifier
    for each class member, we can control how other parts of the program interact
    with those members.


    There are four access modifiers in Java:


    1.  public: The member is accessible from any other class.


    2.  private: The member is accessible only within the class where it is defined.


    3.  protected: The member is accessible within the same package or by subclasses.


    4.  default (no modifier): The member is accessible only within the same package.


    #### Why Use Access Modifiers?


    Access modifiers help achieve the goal of encapsulation by controlling how fields
    and methods are accessed:


    ● private ensures that fields are hidden from external classes and can only be
    accessed or modified through methods within the class.


    ● public exposes fields and methods for general access, which can be useful when
    certain functionality needs to be shared across classes or packages.


    ●       protected and default provide intermediate levels of access.


    #### Example: Using Access Modifiers


    Let’s start with an example where we have a  Person class that uses different
    access modifiers for its fields.


    java


    public class Person {


    // Private fields - cannot be accessed directly from outside the class


    private String name;


    private int age;


    // Constructor to initialize the Person object


    public Person(String name, int age) {


    this.name = name;


    this.age = age;


    }


    // Public getter for the name


    public String getName() {


    return name;


    }


    // Public setter for the name


    public void setName(String name) {


    this.name = name;


    }


    // Public getter for the age


    public int getAge() {


    return age;


    }


    // Public setter for the age


    public void setAge(int age) {


    if (age >= 0) {


    this.age = age;


    } else {


    System.out.println("Age cannot be negative.");


    }


    }


    // Public method to display the person''s information


    public void displayInfo() {


    System.out.println("Name: " + name + ", Age: " + age);


    }


    }


    #### Explanation of the Code:


    1.  Private Fields:


    ○ The  name and  age fields are marked as  private, meaning they cannot be accessed
    directly from outside the class.


    ○ This ensures the internal state of the  Person class is protected and prevents
    any unwanted external modifications.


    2.  Public Getter and Setter Methods:


    ○ The getter methods (getName() and  getAge()) are  public, which allows external
    classes to retrieve the values of  name and  age without directly accessing the
    fields.


    ○ The setter methods (setName() and  setAge()) allow external classes to modify
    these fields, but with some control. For example, the  setAge() method ensures
    that the age cannot be set to a negative value, which is a simple form of validation.


    3.  Display Method:


    ○ The  displayInfo() method is a  public method that displays the values of  name
    and  age. It allows other classes to print the state of a  Person object in a
    controlled manner.


    #### Why Use Getters and Setters?


    Using getters and setters serves several important purposes:


    ● Encapsulation: By making fields  private and providing access through public
    methods, we can control how those fields are accessed and modified. This ensures
    that changes to the internal state of the object are always done in a controlled
    and predictable way.


    ● Validation: Setters allow you to add validation logic. In our example, the  setAge()
    method prevents setting a negative value for  age. Without setters, any code could
    directly modify the fields, bypassing any validation rules.


    ● Flexibility: If the internal implementation of the class changes, such as if
    we switch from storing the  age as an  int to a  Date object, the getter and setter
    methods provide a layer of abstraction. External code that uses the  Person class
    doesn''t need to know about the internal implementation; it just calls the getter
    and setter methods.


    #### Example: Using Getters and Setters in Action


    Let''s use the  Person class to create an object and interact with its data using
    the getter and setter methods.


    java


    public class Main {


    public static void main(String[] args) {


    // Create a new Person object


    Person person = new Person("John", 25);


    // Display the initial information


    person.displayInfo();  // Outputs: Name: John, Age: 25


    // Change the person''s name and age using setters


    person.setName("Jane");


    person.setAge(30);


    // Display the updated information


    person.displayInfo();  // Outputs: Name: Jane, Age: 30


    // Attempt to set a negative age


    person.setAge(-5);  // Outputs: Age cannot be negative.


    }


    }


    #### Explanation of the Main Class:


    1.  Creating a  Person Object:


    ○ A new  Person object is created using the constructor, initializing the  name
    to "John" and  age to 25.


    2.  Displaying Information:


    ○ We call the  displayInfo() method to print the  name and  age values.


    3.  Changing Information Using Setters:


    ○ The  setName() and  setAge() methods are used to update the  name and  age fields.
    These changes are applied through the setter methods, ensuring that any necessary
    validation (like the check for negative age) is performed.


    4.  Validation in Action:


    ○ When we attempt to set a negative age, the setter method prevents it and prints
    a message, "Age cannot be negative."


    * * *


    #### Best Practices for Using Access Modifiers and Getters/Setters


    1.  Prefer  private for Fields: Always mark class fields as  private to prevent
    external access and ensure encapsulation. This ensures that the internal state
    of the class cannot be modified directly by other classes, which could introduce
    bugs or inconsistencies.


    2.  Use  public Getters and Setters: Provide getter and setter methods to allow
    controlled access to the fields. These methods allow you to perform checks, transformations,
    or additional logic when getting or setting values.


    3.  Keep Setters Simple: Setters should ideally only be used for validation or
    simple transformations. If a method involves complex logic, it may be better placed
    in a different method rather than the setter.


    4.  Avoid Excessive Getters/Setters: If a field doesn''t need to be accessed or
    modified outside the class, don''t create getters and setters for it. This reduces
    unnecessary exposure and keeps the class design cleaner and more maintainable.


    * * *


