    ## Chapter 9.2 BufferedReader and Scanner


    When working with text files or user input in Java, performance and flexibility
    are key. While  FileReader and  FileWriter are great for simple use cases, they
    can be inefficient when reading large files or processing line-by-line data. This
    is where  BufferedReader and  Scanner come in.


    In this chapter, we''ll explore both classes, explain when to use each, and show
    you practical examples you can use in your own applications.


    * * *


    ### Why BufferedReader and Scanner?


    Both  BufferedReader and  Scanner are used to read text, but they serve slightly
    different purposes:


    ● BufferedReader is designed for fast reading of text files, especially when reading
    large blocks or lines of text.


    ● Scanner is more flexible and powerful when you need to parse input or read formatted
    data from a file or user input.


    Let’s look at both in detail.


    * * *


    ### Reading Files with BufferedReader


    The  BufferedReader class reads text from a character-input stream and buffers
    the characters to enable efficient reading of lines or characters. It wraps around
    other readers like  FileReader.


    #### Example: Reading a File Line-by-Line


    java


    import java.io.BufferedReader;


    import java.io.FileReader;


    import java.io.IOException;


    public class BufferedReaderExample {


    public static void main(String[] args) {


    try {


    // Open file using FileReader, wrap with BufferedReader


    BufferedReader reader = new BufferedReader(new FileReader("example.txt"));


    String line;


    // Read each line until end of file


    while ((line = reader.readLine()) != null) {


    System.out.println(line);


    }


    // Close reader to release system resources


    reader.close();


    } catch (IOException e) {


    System.out.println("An error occurred while reading: " + e.getMessage());


    }


    }


    }


    Explanation:


    ●       readLine() reads one line at a time, stopping at newline characters.


    ●       The buffered approach means fewer direct disk access operations, which
    improves performance.


    #### Advantages of BufferedReader


    ●       Efficient for large files.


    ●       Can read entire lines with  readLine().


    ●       Simple API with good performance.


    * * *


    ### Reading Input with Scanner


    The  Scanner class is part of the  java.util package and is ideal for parsing
    data, whether from files or the keyboard. You can scan input line by line, word
    by word, or even number by number.


    #### Example: Reading User Input


    java


    import java.util.Scanner;


    public class ScannerUserInputExample {


    public static void main(String[] args) {


    Scanner scanner = new Scanner(System.in); // Read from standard input


    System.out.print("Enter your name: ");


    String name = scanner.nextLine(); // Reads a full line


    System.out.print("Enter your age: ");


    int age = scanner.nextInt(); // Reads an integer


    System.out.println("Welcome, " + name + ". You are " + age + " years old.");


    scanner.close();


    }


    }


    Explanation:


    ●       nextLine(): Reads entire lines.


    ●       nextInt(),  nextDouble(), etc.: Read specific types.


    ●       System.in: Standard input stream (console).


    #### Example: Reading from a File Using Scanner


    java


    import java.io.File;


    import java.io.FileNotFoundException;


    import java.util.Scanner;


    public class ScannerFileExample {


    public static void main(String[] args) {


    try {


    File file = new File("example.txt");


    Scanner scanner = new Scanner(file);


    // Read and print each line


    while (scanner.hasNextLine()) {


    String line = scanner.nextLine();


    System.out.println(line);


    }


    scanner.close();


    } catch (FileNotFoundException e) {


    System.out.println("File not found: " + e.getMessage());


    }


    }


    }


    Explanation:


    ●       The  Scanner class reads from a  File object.


    ●       hasNextLine() checks if there’s more data to read.


    * * *


    ### Comparing BufferedReader vs Scanner


    | Feature | BufferedReader | Scanner |


    | Performance | Faster for large files | Slower, not buffered |


    | Line-by-line Reading | Yes (readLine()) | Yes (nextLine()) |


    | Token Parsing | No | Yes (nextInt(),  nextDouble()) |


    | Input Source | Readers only | Keyboard, files, strings, etc. |


    | Ideal Use Case | Efficient file reading | User input or parsing formatted data
    |


    #### When to Use What


    ●       Use BufferedReader when you want fast and efficient line-by-line reading
    from a file.


    ●       Use Scanner when you need to parse different data types from input (especially
    numbers and tokens).


    * * *


    ### Handling Character Encoding


    Both  BufferedReader and  Scanner use the platform''s default encoding unless
    specified. For reading UTF-8 encoded files, wrap the reader using  InputStreamReader.


    java


    BufferedReader reader = new BufferedReader(


    new InputStreamReader(new FileInputStream("example.txt"), "UTF-8")


    );


    This ensures consistent behavior across different platforms and avoids unexpected
    character corruption when dealing with international text.


    * * *


    ## Chapter 9.3 FileWriter and BufferedWriter


    Writing text to files is a core part of many applications, whether you''re logging
    data, saving user preferences, or exporting reports. In Java,  FileWriter and  BufferedWriter
    are the go-to classes for outputting text efficiently and reliably. In this chapter,
    we’ll dive into both, compare their performance, and walk through practical examples
    that illustrate their use.


    * * *


    ### FileWriter: The Basics


    FileWriter is a character stream class used to write characters to files. It writes
    directly to the file and is easy to use when you just want to write a few lines
    of text.


    #### Syntax:


    java


    FileWriter writer = new FileWriter("output.txt");


    This creates a file called  output.txt if it doesn''t already exist. If it exists,
    the contents will be overwritten unless you tell Java to append.


    #### Example: Writing Text Using FileWriter


    java


    import java.io.FileWriter;


    import java.io.IOException;


    public class FileWriterExample {


    public static void main(String[] args) {


    try {


    // Create a FileWriter instance for writing to "output.txt"


    FileWriter writer = new FileWriter("output.txt");


    // Write text to the file


    writer.write("Hello, world!\n");


    writer.write("This is a new line.\n");


    // Close the writer to flush and release resources


    writer.close();


    System.out.println("Data written successfully.");


    } catch (IOException e) {


    System.out.println("An error occurred: " + e.getMessage());


    }


    }


    }


    Key Points:


    ●       write() writes characters or strings to the file.


    ●       Always close the writer to ensure the data is properly saved.


    ● If you want to append to a file instead of overwriting it, use the constructor  new
    FileWriter("output.txt", true).


    * * *


    ### BufferedWriter: Writing with a Buffer


    BufferedWriter provides a buffer around the  FileWriter, reducing the number of
    I/O operations by collecting characters into a buffer before writing them all
    at once. This results in better performance, especially when writing large amounts
    of text.


    #### Syntax:


    java


    BufferedWriter writer = new BufferedWriter(new FileWriter("output.txt"));


    #### Example: Writing Using BufferedWriter


    java


    import java.io.BufferedWriter;


    import java.io.FileWriter;


