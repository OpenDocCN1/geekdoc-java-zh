    \n# 第 6 章：封装、继承与多态\n\n在本章中，我们将探索面向对象编程（OOP）中的三个核心概念：封装、继承和多态。这些原则帮助我们构建结构良好、易于维护且灵活的软件系统。在本章结束时，你将理解如何使用访问修符、通过继承创建类层次级，并利用多态来编写动态且高效的代码。\n\
    \n***\n\n## 6.1 访问修符与 Getter/Setter\n\n在面向对象编程中，核心原则之一是封装。封装有助于确保对象的内部状态不受意外的干扰和误用。访问修符以及\
    \ getter 和 setter 的使用在实现封装方面起着至关重要的作用。\n\n### 访问修符\n\n访问修符是 Java 中用于设置类成员（字段、方法、构造函数）可见性的关键字。通过为每个类成员仔细地选择正确的访问修符，我们可以控制程序的其他部分如何与这些成员交互。\n\
    \nJava 中有四种访问修符：\n\n1. `public`：成员可以从任何其他类访问。\n2. `private`：成员仅在定义它的类内部可访问。\n\
    3. `protected`：成员可以在同一个包内或通过子类进行访问。\n4. `default`（无修饰符）：成员仅在同一个包内可访问。\n\n### 为什么要使用访问修符？\n\
    \n访问修符通过控制字段和方法的访问方式，帮助实现封装的目标：\n\n- `private` 确保字段对外部类隐藏，并且只能通过类内部的方法进行访问或修改。\n\
    - `public` 暴露字段和方法以供常规访问，这在某些功能需要在类或包之间共享时非常有用。\n- `protected` 和 `default` 提供了中间级别的访问权限。\n\
    \n### 示例：使用访问修符\n\n让我们从一个示例开始，我们有一个 `Person` 类，它对其字段使用了不同的访问修符。\n\n```java\npublic\
    \ class Person {\n    // 私有字段 - 不能从类外部直接访问\n    private String name;\n    private\
    \ int age;\n\n    // 初始化 Person 对象的构造函数\n    public Person(String name, int age)\
    \ {\n        this.name = name;\n        this.age = age;\n    }\n\n    // 获取名称的\
    \ public getter\n    public String getName() {\n        return name;\n    }\n\n\
    \    // 设置名称的 public setter\n    public void setName(String name) {\n        this.name\
    \ = name;\n    }\n\n    // 获取年龄的 public getter\n    public int getAge() {\n  \
    \      return age;\n    }\n\n    // 设置年龄的 public setter\n    public void setAge(int\
    \ age) {\n        if (age >= 0) {\n            this.age = age;\n        } else\
    \ {\n            System.out.println(\"Age cannot be negative.\");\n        }\n\
    \    }\n\n    // 显示人员信息的 public 方法\n    public void displayInfo() {\n        System.out.println(\"\
    Name: \" + name + \", Age: \" + age);\n    }\n}\n```\n\n#### 代码解释：\n\n1. **私有字段**：\n\
    \   - `name` 和 `age` 字段被标记为 `private`，这意味着它们不能从类外部直接访问。\n   - 这确保了 `Person` 类的内部状态受到保护，并防止了任何意外的外部修改。\n\
    2. **公共 Getter 和 Setter 方法**：\n   - getter 方法 `getName()` 和 `getAge()` 是 `public`\
    \ 的，允许外部类在不直接访问字段的情况下检索 `name` 和 `age` 的值。\n   - setter 方法 `setName()` 和 `setAge()`\
    \ 允许外部类修改这些字段，但带有一些控制。例如，`setAge()` 方法确保年龄不能被设置为负值，这是一种简单形式的验证。\n3. **显示方法**：\n\
    \   - `displayInfo()` 方法是一个 `public` 方法，用于显示 `name` 和 `age` 的值。它允许其他类以受控的方式打印\
    \ `Person` 对象的状态。\n\n### 为什么要使用 Getter 和 Setter？\n\n使用 getter 和 setter 有以下几个重要目的：\n\
    \n- **封装**：通过将字段设为 `private` 并通过公共方法提供访问，我们可以控制这些字段如何被访问和修改。这确保了对象内部状态的变化始终以受控且可预测的方式进行。\n\
    - **验证**：setter 允许你添加验证逻辑。在我们的示例中，`setAge()` 方法防止将年龄设置为负值。如果没有 setter，任何代码都可以直接修改字段，绕过任何验证规则。\n\
    - **灵活性**：如果类的内部实现发生变化（例如，我们将 `age` 的存储从 `int` 切换到 `Date` 对象），getter 和 setter\
    \ 方法提供了一层抽象。使用 `Person` 类的外部代码不需要知道内部实现；它们只需要调用 getter 和 setter 方法即可。\n\n### 示例：在操作中使用\
    \ Getter 和 Setter\n\n让我们使用 `Person` 类创建一个对象，并使用 getter 和 setter 方法与其数据交互。\n\n\
    ```java\npublic class Main {\n    public static void main(String[] args) {\n \
    \       // 创建一个新的 Person 对象\n        Person person = new Person(\"John\", 25);\n\
    \        // 显示初始信息\n        person.displayInfo(); // 输出: Name: John, Age: 25\n\
    \n        // 使用 setter 修改人员的姓名和年龄\n        person.setName(\"Jane\");\n       \
    \ person.setAge(30);\n        // 显示更新信息\n        person.displayInfo(); // 输出:\
    \ Name: Jane, Age: 30\n\n        // 尝试设置负年龄\n        person.setAge(-5); // 输出:\
    \ Age cannot be negative.\n    }\n}\n```\n\n#### 主类的解释：\n\n1. **创建 Person 对象**：\n\
    \   - 使用构造函数创建了一个新的 `Person` 对象，将 `name` 初始化为 \"John\"，`age` 初始化为 25。\n2. **显示信息**：\n\
    \   - 我们调用 `displayInfo()` 来打印 `name` 和 `age`。\n3. **使用 Setter 修改信息**：\n   - 使用\
    \ `setName()` 和 `setAge()` 方法修改 `name` 和 `age` 字段。这些更改通过 setter 方法进行，确保执行了任何必要的验证（如对年龄的检查）。\n\
    4. **验证演示**：\n   - 当我们尝试设置负年龄时，setter 方法阻止了该操作并打印了消息 \"Age cannot be negative.\"\
    \n\n***\n\n#### 使用访问修符和 Getter/Setter 的最佳实践\n\n1. **字段优先使用 `private`**：始终将类字段标记为\
    \ `private` 以防止外部访问并确保封装。这确保类的内部状态不会被其他类直接修改，从而引入错误或不一致。\n2. **使用 `public` Getter\
    \ 和 Setter**：提供 getter 和 setter 方法以允许对字段进行受控访问。这些方法允许你在获取或设置值时执行检查、转换。\n3. **保持\
    \ Setter 简单**：setter 应该只用于验证或简单的转换。如果一个方法涉及复杂的逻辑，可能更好地放在其他方法而不是 setter。\n4. **避免过度使用\
    \ Getter/Setter**：如果一个字段不需要在类外部访问或修改，就不要为它创建 getter 和 setter。这减少了不必要的暴露并使类设计更加简洁、易于维护。\n\
    \n***\n\n## 6.2 继承与 `super`\n\n"
- fmt: "\nInheritance is one of the fundamental concepts of object-oriented programming\
    \ (OOP). It allows you to create new classes that are based on existing classes,\
    \ promoting code reuse and establishing a natural hierarchy between classes. By\
    \ extending a class, the subclass (child class) inherits fields and methods from\
    \ the parent class, allowing you to build upon existing functionality and extend\
    \ it.\n\nIn this chapter, we’ll explore how inheritance works in Java, the role\
    \ of the `super` keyword, and how you can use both to create more efficient and\
    \ modular code.\n\n***\n\n### What is Inheritance?\n\nInheritance allows a class\
    \ (the child class) to inherit properties and methods from another class (the\
    \ parent class). The child class can:\n\n- Use methods and fields from the parent\
    \ class.\n- Override parent methods to provide specific behavior for the child\
    \ class.\n- Add its own fields and methods.\n\nIn Java, a class can inherit from\
    \ another class using the `extends` keyword.\n\n#### Why Use Inheritance?\n\n\
    - **Code Reusability**: By inheriting from a parent class, you avoid duplicating\
    \ code. This is particularly useful when you have multiple classes that share\
    \ similar functionality but require slight modifications.\n- **Maintainability**:\
    \ When you need to make changes to shared functionality, you can modify it in\
    \ the parent class, and the changes will automatically propagate to all child\
    \ classes.\n- **Polymorphism**: Inheritance enables polymorphism, which allows\
    \ you to treat objects of different classes as if they were objects of a common\
    \ superclass.\n\n***\n\n### Basic Inheritance Example\n\nLet’s start with a simple\
    \ example to demonstrate how inheritance works. We’ll create a parent class called\
    \ `Animal` and a child class called `Dog`.\n\n```java\n// Parent class\nclass\
    \ Animal {\n    // Fields\n    private String name;\n\n    // Constructor\n  \
    \  public Animal(String name) {\n        this.name = name;\n    }\n\n    // Method\n\
    \    public void speak() {\n        System.out.println(name + \" makes a sound.\"\
    );\n    }\n\n    // Getter for the name\n    public String getName() {\n     \
    \   return name;\n    }\n}\n\n// Child class\nclass Dog extends Animal {\n   \
    \ // Constructor\n    public Dog(String name) {\n        // Calling the parent\
    \ class constructor\n        super(name);\n    }\n\n    // Overriding the speak\
    \ method\n    @Override\n    public void speak() {\n        System.out.println(getName()\
    \ + \" barks.\");\n    }\n}\n\npublic class Main {\n    public static void main(String[]\
    \ args) {\n        // Creating an object of Dog\n        Dog dog = new Dog(\"\
    Buddy\");\n        // Calling the speak method\n        dog.speak();  // Outputs:\
    \ Buddy barks.\n    }\n}\n```\n\n#### Explanation of the Code:\n\n1. The `Animal`\
    \ class:\n   - The `Animal` class has a private field `name` and a constructor\
    \ to initialize it. The `speak()` method simply prints a message indicating the\
    \ animal makes a sound.\n2. The `Dog` class:\n   - The `Dog` class extends the\
    \ `Animal` class, which means it inherits the `name` field and the `speak()` method.\n\
    \   - In the `Dog` constructor, we use the `super(name)` call to invoke the constructor\
    \ of the `Animal` class. This ensures that the `name` field is properly initialized.\n\
    \   - The `Dog` class overrides the `speak()` method to provide a more specific\
    \ implementation for dogs, making it print \"barks\" instead of the generic \"\
    makes a sound.\"\n3. In the `Main` class:\n   - We create a `Dog` object and call\
    \ its `speak()` method. Since the `Dog` class overrides the `speak()` method,\
    \ it prints \"Buddy barks.\"\n\n***\n\n### The `super` Keyword\n\nThe `super`\
    \ keyword is used to refer to the parent class. It has two main uses in Java:\n\
    \n1. Calling a parent class constructor:\n   - The `super()` call allows you to\
    \ invoke the constructor of the parent class. This is particularly useful when\
    \ the parent class does not have a default constructor or when you want to initialize\
    \ the parent class with specific values.\n2. Accessing parent class methods and\
    \ fields:\n   - If the child class overrides a method, you can still access the\
    \ parent class’s version of that method using `super.methodName()`. Similarly,\
    \ you can access parent class fields using `super.fieldName`.\n\n#### Example:\
    \ Using `super` to Call Parent Methods\n\nLet’s modify our previous example to\
    \ demonstrate the use of `super` to call the parent class method:\n\n```java\n\
    // Parent class\nclass Animal {\n    private String name;\n    public Animal(String\
    \ name) {\n        this.name = name;\n    }\n    public void speak() {\n     \
    \   System.out.println(name + \" makes a sound.\");\n    }\n    public void eat()\
    \ {\n        System.out.println(name + \" eats food.\");\n    }\n    public String\
    \ getName() {\n        return name;\n    }\n}\n\n// Child class\nclass Dog extends\
    \ Animal {\n    public Dog(String name) {\n        super(name); // Calling the\
    \ parent class constructor\n    }\n\n    // Overriding the speak method\n    @Override\n\
    \    public void speak() {\n        System.out.println(getName() + \" barks.\"\
    );\n    }\n\n    // Calling the parent class eat method using super\n    public\
    \ void eat() {\n        super.eat();  // Calling the parent class's eat method\n\
    \        System.out.println(getName() + \" eats dog food.\");\n    }\n}\n\npublic\
    \ class Main {\n    public static void main(String[] args) {\n        Dog dog\
    \ = new Dog(\"Buddy\");\n        // Calling the overridden speak method\n    \
    \    dog.speak();  // Outputs: Buddy barks.\n        // Calling the eat method\
    \ from the Dog class\n        dog.eat();\n    }\n}\n```\n\n#### Explanation of\
    \ the Code:\n\n1. The `Dog` class:\n   - The `speak()` method is overridden.\n\
    \   - The `eat()` method calls `super.eat()`, which executes the parent class's\
    \ `eat` method before adding the dog-specific logic.\n2. In the `Main` class:\n\
    \   - We call `speak()` and `eat()` on the `Dog` object, resulting in the overridden\
    \ behavior and the parent-call behavior.\n\n***\n\n### Method Overriding\n\nMethod\
    \ overriding occurs when a subclass provides a specific implementation of a method\
    \ that is already defined in its parent. In the example above, we overrode the\
    \ `speak()` method in the `Dog` class.\n\nHere’s a quick reminder of the rules\
    \ for overriding:\n\n1. The method signature (name, return type, and parameters)\
    \ must be the same in both the parent and child classes.\n2. The overridden method\
    \ in the child class should not have a more restrictive access modifier than the\
    \ method in the parent class.\n3. The `@Override` annotation is optional but highly\
    \ recommended. It helps ensure that you’re actually overriding a method from the\
    \ parent class and not just defining a new method.\n\n#### Example: Overriding\
    \ vs. Overloading\n\nTo clarify the difference between overriding and overloading,\
    \ consider the following example:\n\n```java\n// Parent class\nclass Animal {\n\
    \    public void sound() {\n        System.out.println(\"Animal makes a sound\"\
    );\n    }\n    // Method Overloading: Same method name, different parameters\n\
    \    public void sound(String type) {\n        System.out.println(\"Animal makes\
    \ a \" + type + \" sound\");\n    }\n}\n\n// Child class\nclass Dog extends Animal\
    \ {\n    @Override\n    public void sound() {\n        System.out.println(\"Dog\
    \ barks\");\n    }\n}\n\npublic class Main {\n    public static void main(String[]\
    \ args) {\n        Animal animal = new Animal();\n        animal.sound(); // Outputs:\
    \ Animal makes a sound\n        animal.sound(\"loud\");  // Outputs: Animal makes\
    \ a loud sound\n\n        Dog dog = new Dog();\n        dog.sound();  // Outputs:\
    \ Dog barks\n    }\n}\n```\n\nIn this example:\n\n- **Method Overriding**: The\
    \ `Dog` class overrides the `sound()` method from the `Animal` class.\n- **Method\
    \ Overloading**: The `Animal` class has two `sound()` methods—one without parameters\
    \ and one that takes a `String` parameter.\n"
  raw: 'Inheritance is one of the fundamental concepts of object-oriented programming
    (OOP). It allows you to create new classes that are based on existing classes,
    promoting code reuse and establishing a natural hierarchy between classes. By
    extending a class, the subclass (child class) inherits fields and methods from
    the parent class, allowing you to build upon existing functionality and extend
    it.


    In this chapter, we’ll explore how inheritance works in Java, the role of the  super
    keyword, and how you can use both to create more efficient and modular code.


    * * *


    ### What is Inheritance?


    Inheritance allows a class (the child class) to inherit properties and methods
    from another class (the parent class). The child class can:


    ●       Use methods and fields from the parent class.


    ●       Override parent methods to provide specific behavior for the child class.


    ●       Add its own fields and methods.


    In Java, a class can inherit from another class using the  extends keyword.


    #### Why Use Inheritance?


    ● Code Reusability: By inheriting from a parent class, you avoid duplicating code.
    This is particularly useful when you have multiple classes that share similar
    functionality but require slight modifications.


    ● Maintainability: When you need to make changes to shared functionality, you
    can modify it in the parent class, and the changes will automatically propagate
    to all child classes.


    ● Polymorphism: Inheritance enables polymorphism, which allows you to treat objects
    of different classes as if they were objects of a common superclass.


    * * *


    ### Basic Inheritance Example


    Let’s start with a simple example to demonstrate how inheritance works. We’ll
    create a parent class called  Animal and a child class called  Dog.


    java


    // Parent class


    class Animal {


    // Fields


    private String name;


    // Constructor


    public Animal(String name) {


    this.name = name;


    }


    // Method


    public void speak() {


    System.out.println(name + " makes a sound.");


    }


    // Getter for the name


    public String getName() {


    return name;


    }


    }


    // Child class


    class Dog extends Animal {


    // Constructor


    public Dog(String name) {


    // Calling the parent class constructor


    super(name);


    }


    // Overriding the speak method


    @Override


    public void speak() {


    System.out.println(getName() + " barks.");


    }


    }


    public class Main {


    public static void main(String[] args) {


    // Creating an object of Dog


    Dog dog = new Dog("Buddy");


    // Calling the speak method


    dog.speak();  // Outputs: Buddy barks.


    }


    }


    #### Explanation of the Code:


    1.  The  Animal class:


    ○ The  Animal class has a private field  name and a constructor to initialize
    it. The  speak() method simply prints a message indicating the animal makes a
    sound.


    2.  The  Dog class:


    ○ The  Dog class extends the  Animal class, which means it inherits the  name
    field and the  speak() method.


    ○ In the  Dog constructor, we use the  super(name) call to invoke the constructor
    of the  Animal class. This ensures that the  name field is properly initialized.


    ○ The  Dog class overrides the  speak() method to provide a more specific implementation
    for dogs, making it print "barks" instead of the generic "makes a sound."


    3.  In the  Main class:


    ○ We create a  Dog object and call its  speak() method. Since the  Dog class overrides
    the  speak() method, it prints "Buddy barks."


    * * *


    ### The  super Keyword


    The  super keyword is used to refer to the parent class. It has two main uses
    in Java:


    1.  Calling a parent class constructor:


    ○ The  super() call allows you to invoke the constructor of the parent class.
    This is particularly useful when the parent class does not have a default constructor
    or when you want to initialize the parent class with specific values.


    2.  Accessing parent class methods and fields:


    ○ If the child class overrides a method, you can still access the parent class’s
    version of that method using  super.methodName(). Similarly, you can access parent
    class fields using  super.fieldName.


    #### Example: Using  super to Call Parent Methods


    Let’s modify our previous example to demonstrate the use of  super to call the
    parent class method:


    java


    // Parent class


    class Animal {


    private String name;


    public Animal(String name) {


    this.name = name;


    }


    public void speak() {


    System.out.println(name + " makes a sound.");


    }


    public void eat() {


    System.out.println(name + " eats food.");


    }


    public String getName() {


    return name;


    }


    }


    // Child class


    class Dog extends Animal {


    public Dog(String name) {


    super(name); // Calling the parent class constructor


    }


    // Overriding the speak method


    @Override


    public void speak() {


    System.out.println(getName() + " barks.");


    }


    // Calling the parent class eat method using super


    public void eat() {


    super.eat();  // Calling the parent class''s eat method


    System.out.println(getName() + " eats dog food.");


    }


    }


    public class Main {


    public static void main(String[] args) {


    Dog dog = new Dog("Buddy");


    // Calling the overridden speak method


    dog.speak();  // Outputs: Buddy barks.


    // Calling the eat method from the Dog class


    dog.eat();  // Outputs: Buddy eats food. Buddy eats dog food.


    }


    }


    #### Explanation of the Code:


    1.  In the  Dog class:


    ○ The  speak() method is overridden, as before.


    ○ The  eat() method in the  Dog class calls the  eat() method from the parent  Animal
    class using  super.eat(). This ensures that the parent’s version of the method
    is executed first, followed by additional behavior specific to the  Dog class
    (printing "eats dog food").


    2.  In the  Main class:


    ○ We call both the  speak() and  eat() methods on a  Dog object. The  speak()
    method prints "Buddy barks," and the  eat() method prints both the parent and
    the child class messages: "Buddy eats food" followed by "Buddy eats dog food."


    * * *


    ### Method Overriding


    Method overriding occurs when a subclass provides a specific implementation of
    a method that is already defined in its parent class. In the example above, we
    overrode the  speak() method in the  Dog class to change its behavior.


    Here’s a quick reminder of the rules for overriding:


    1.  The method signature (name, return type, and parameters) must be the same
    in both the parent and child classes.


    2.  The overridden method in the child class should not have a more restrictive
    access modifier than the method in the parent class.


    3.  The  @Override annotation is optional but highly recommended. It helps ensure
    that you’re actually overriding a method from the parent class and not just defining
    a new method.


    #### Example: Overriding vs. Overloading


    To clarify the difference between overriding and overloading, consider the following
    example:


    java


    // Parent class


    class Animal {


    public void sound() {


    System.out.println("Animal makes a sound");


    }


    // Method Overloading: Same method name, different parameters


    public void sound(String type) {


    System.out.println("Animal makes a " + type + " sound");


    }


    }


    // Child class


    class Dog extends Animal {


    @Override


    public void sound() {


    System.out.println("Dog barks");


    }


    }


    public class Main {


    public static void main(String[] args) {


    Animal animal = new Animal();


    animal.sound();  // Outputs: Animal makes a sound


    animal.sound("loud");  // Outputs: Animal makes a loud sound


    Dog dog = new Dog();


    dog.sound();  // Outputs: Dog barks


    }


    }


    In this example:


    ●       Method Overriding: The  Dog class overrides the  sound() method from the  Animal
    class.


    ● Method Overloading: The  Animal class has two  sound() methods—one without parameters
    and one that takes a  String parameter.


    * * *


    ## 6.3 Method Overriding


    In object-oriented programming (OOP), method overriding allows a subclass to provide
    a specific implementation of a method that is already defined in its superclass.
    This feature enables the subclass to modify or completely replace the behavior
    of an inherited method to suit its specific needs.'
