    # Chapter 5: Object-Oriented Programming in Java


    In this chapter, we’ll dive into the world of Object-Oriented Programming (OOP)
    in Java. OOP is a programming paradigm that organizes software design around data,
    or objects, rather than functions and logic. It’s the foundation of Java and is
    used to build flexible, reusable, and maintainable code. We’ll explore the main
    concepts of OOP and walk you through practical examples to make it all clear.


    * * *


    ## 5.1 Introduction to OOP (Object-Oriented Programming)


    Object-Oriented Programming (OOP) is one of the most popular programming paradigms
    in use today, and it’s a core concept in Java. In this section, we will explore
    the foundational principles of OOP, how they apply to Java programming, and why
    understanding them is key to becoming a proficient Java developer.


    At its core, OOP is all about modeling real-world entities and their interactions.
    It allows you to organize software around objects, which are instances of classes.
    These objects encapsulate both data (attributes) and behavior (methods). OOP encourages
    modular design, making it easier to maintain, extend, and debug code.


    * * *


    ### Key Principles of OOP


    OOP is based on four fundamental principles:


    1.  Encapsulation


    2.  Abstraction


    3.  Inheritance


    4.  Polymorphism


    Each of these principles plays a critical role in Java programming, helping you
    structure and organize your code in a more intuitive way. Let''s break each one
    down to get a better understanding of how it works.


    * * *


    ### 1\. Encapsulation: Hiding the Internal Details


    Encapsulation is about bundling data (attributes) and the methods that operate
    on the data into a single unit, typically a class. The primary goal of encapsulation
    is to protect the data from direct access and modification, ensuring that it can
    only be manipulated through well-defined methods. This helps ensure that the object''s
    state remains valid and consistent.


    In Java, encapsulation is typically implemented by using private fields and providing
    public getter and setter methods to access and modify them.


    #### Example of Encapsulation:


    java


    public class Person {


    // Private fields, encapsulating the data


    private String name;


    private int age;


    // Public getter method for ''name''


    public String getName() {


    return name;


    }


    // Public setter method for ''name''


    public void setName(String name) {


    this.name = name;


    }


    // Public getter method for ''age''


    public int getAge() {


    return age;


    }


    // Public setter method for ''age''


    public void setAge(int age) {


    if (age >= 0) {  // Validation inside the setter method


    this.age = age;


    } else {


    System.out.println("Age cannot be negative!");


    }


    }


    }


    In this example:


    ● The fields  name and  age are private, meaning they cannot be directly accessed
    outside of the  Person class.


    ● We provide getter and setter methods to access and modify the values of these
    fields. The setter for  age includes validation to ensure the age is non-negative,
    showing how encapsulation helps safeguard the integrity of the object.


    * * *


