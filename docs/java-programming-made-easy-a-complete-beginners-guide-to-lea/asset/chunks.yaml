    ### Method Parameters: Passing Data to Methods


    Parameters are like placeholders for values that you want to pass into a method.
    When you call a method, you provide arguments that match the parameters defined
    in the method signature. This allows the method to use those arguments in its
    execution.


    #### Declaring Method Parameters


    You declare method parameters by listing them inside the parentheses of the method
    signature. Each parameter consists of a data type and a variable name.


    Here’s an example of a method with parameters:


    java


    public class Rectangle {


    // Method to calculate the area of a rectangle


    public static int calculateArea(int length, int width) {


    return length * width;  // Returns the product of length and width


    }


    public static void main(String[] args) {


    // Calling the calculateArea() method with arguments 5 and 10


    int area = calculateArea(5, 10);


    System.out.println("The area of the rectangle is: " + area);  // Output: 50


    }


    }


    Explanation:


    ●       The method  calculateArea() takes two parameters:  length and  width,
    both of type  int.


    ● Inside the method, we use the parameters to calculate the area of the rectangle
    by multiplying  length and  width.


    ● When calling the method, we pass the values  5 and  10 as arguments, and the
    result (50) is printed to the console.


