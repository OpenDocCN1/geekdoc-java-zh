    \ These fundamentals are the backbone of your journey into Java programming. By\
    \ the end, you’ll create your own basic calculator using what you’ve learned.\n\
    \n## 2.1 Variables and Data Types\n\nEvery Java program deals with data — numbers,\
    \ text, boolean logic, and more. To work with this data, you need a way to store\
    \ it in memory. That’s where variables come in. In this section, we’ll break down\
    \ what variables are, how they’re used, and the various data types Java provides.\n\
    \n## What is a Variable?\n\nA variable is simply a named storage location in your\
    \ computer’s memory that holds a value. You give it a name, assign a value to\
    \ it, and then refer to it by that name throughout your code.\n\n### Variable\
    \ Declaration Syntax\n\n```java\ndataType variableName = value;\n```\n\n### Example:\n\
    \n```java\nint age = 30;\nString name = \"Alice\";\ndouble temperature = 22.5;\n\
    ```\n\nIn the above example:\n- `int` declares an integer variable `age` with\
    \ value `30`.\n- `String` declares a text variable `name` with value `\"Alice\"\
    `.\n- `double` declares a decimal number `temperature` with value `22.5`.\n\n\
    ## Java’s Data Types\n\nJava has two broad categories of data types:\n\n### 1.\
    \ Primitive Types\n\nThese are the most basic data types and are not objects.\n\
    \n| Type | Size (bits) | Description | Example |\n| :--- | :--- | :--- | :---\
    \ |\n| byte | 8 | Very small integers (-128 to 127) | `byte b = 100;` |\n| short\
    \ | 16 | Small integers | `short s = 30000;` |\n| int | 32 | Standard integers\
    \ | `int x = 200;` |\n| long | 64 | Large integers | `long l = 123456789L;` |\n\
    | float | 32 | Decimal numbers (less precision) | `float f = 5.5f;` |\n| double\
    \ | 64 | Decimal numbers (high precision) | `double d = 10.99;` |\n| char | 16\
    \ | A single character | `char c = 'A';` |\n| boolean | 1 | True or false | `boolean\
    \ active = true;` |\n\n### 2. Reference Types\n\nThese include objects and arrays.\
    \ For now, the most commonly used reference type is `String`.\n\n```java\nString\
    \ greeting = \"Welcome to Java!\";\n```\n\n### Type Conversion (Casting)\n\nJava\
    \ is statically typed, meaning every variable must have a declared type. Sometimes,\
    \ you need to convert one type to another.\n\n### Implicit Conversion (Widening)\n\
    \nHappens automatically when converting to a larger type.\n\n```java\nint x =\
    \ 10;\ndouble y = x; // Automatically converts int to double\n```\n\n### Explicit\
    \ Conversion (Narrowing)\n\nRequires casting when going to a smaller type.\n\n\
    ```java\ndouble a = 5.75;\nint b = (int) a; // Manually casts double to int (b\
    \ becomes 5)\n```\n\n## Final Variables (Constants)\n\nUse the `final` keyword\
    \ to declare a variable whose value should not change.\n\n```java\nfinal double\
    \ PI = 3.14159;\n```\n\nTrying to reassign `PI` later will cause a compilation\
    \ error.\n\n## Naming Conventions\n\nFollowing Java naming conventions helps improve\
    \ readability:\n- Use `camelCase` for variables: `userAge`, `maxSpeed`.\n- Variable\
    \ names should be meaningful: `totalPrice` is better than `tp`.\n- Avoid starting\
    \ names with numbers or using reserved keywords (like `class`, `int`, `static`).\n\
    \n## Practical Examples\n\nLet’s write a short Java program demonstrating all\
    \ types:\n\n```java\npublic class DataTypes {\n    public static void main(String[]\
    \ args) {\n        int age = 25;\n        double salary = 45;\n        char grade\
    \ = 'B';\n        boolean isEm = true;\n        String name = \"Sophia\";\n\n\
    \        System.out.println(\"Age: \" + age);\n        System.out.println(\"Salary:\
    \ \" + salary);\n        System.out.println(\"Grade: \" + grade);\n        System.out.println(\"\
    Employed: \" + isEm);\n        System.out.println(\"Name: \" + name);\n\n    \
    \    // Example casting\n        double height = 5.9;\n        int heightInt =\
    \ (int) height;\n        System.out.println(\"Height: \" + heightInt);\n    }\n\
    }\n```\n\n### Common Pitfalls to Avoid\n\n- **Mismatch between file name and class\
    \ name**: If your class is named `Main`, your file must be named `Main.java`.\n\
    - **Missing semicolon**: Each statement in Java must end with a semicolon `;`.\n\
    - **Incorrect capitalization**: Java is case-sensitive. `System` must be capitalized.\
    \ `system.out.println` will result in a compilation error.\n- **Integer division**:\
    \ When both operands are integers, division gives an integer result. Use `double`\
    \ for precise division.\n\n## 2.2 Operators and Expressions\n\nIn Java, operators\
    \ are symbols that perform operations on variables.\n\nTypes of Operators:\n1.\
    \ Arithmetic Operators\n2. Assignment Operators\n3. Comparison (Relational) Operators\n\
    4. Logical Operators\n5. Unary Operators\n6. Bitwise Operators\n7. Ternary Operator\n\
    \n### 1. Arithmetic Operators\n\nUsed to perform mathematical operations.\n\n\
    | Operator | Description | Example |\n| :--- | :--- | :--- |\n| + | Addition |\
    \ `a + b` |\n| - | Subtraction | `a - b` |\n| * | Multiplication | `a * b` |\n\
    | / | Division | `a / b` |\n| % | Modulus (remainder) | `a % b` |\n\nExample:\n\
    ```java\nint a = 10, b = 3;\nSystem.out.println(a + b); // 13\nSystem.out.println(a\
    \ - b); // 7\nSystem.out.println(a * b); // 30\nSystem.out.println(a / b); //\
    \ 3 (integer division)\nSystem.out.println(a % b); // 1\n```\n\n### 2. Assignment\
    \ Operators\n\nUsed to assign values to variables.\n\n| Operator | Example | Meaning\
    \ |\n| :--- | :--- | :--- |\n| = | `x = 5` | Assign 5 to x |\n| += | `x += 2`\
    \ | `x = x + 2` |\n| -= | `x -= 3` | `x = x - 3` |\n| *= | `x *= 4` | `x = x *\
    \ 4` |\n| /= | `x /= 2` | `x = x / 2` |\n| %= | `x %= 2` | `x = x % 2` |\n\nExample:\n\
    ```java\nint x = 10;\nx += 5; // x becomes 15\nx *= 2; // x becomes 30\nSystem.out.println(\"\
    Final value of x: \" + x);\n```\n\n### 3. Comparison (Relational) Operators\n\n\
    Used to compare two values. They return `true` or `false`.\n\n| Operator | Description\
    \ | Example |\n| :--- | :--- | :--- |\n| == | Equal to | `a == b` |\n| != | Not\
    \ equal to | `a != b` |\n| > | Greater than | `a > b` |\n| < | Less than | `a\
    \ < b` |\n| >= | Greater than or equal | `a >= b` |\n| <= | Less than or equal\
    \ | `a <= b` |\n\nExample:\n```java\nint age = 18;\nSystem.out.println(age >=\
    \ 18); // true\nSystem.out.println(age != 21); // true\n```\n\n### 4. Logical\
    \ Operators\n\nUsed to combine multiple boolean expressions.\n\n| Operator | Description\
    \ | Example |\n| :--- | :--- | :--- |\n| && | Logical AND (both true) | `a > 10\
    \ && a < 20` |\n| \\|\\| | Logical OR | | | |\n| ! | Logical NOT (negation) |\
    \ `!(a == 10)` |\n\nExample:\n```java\nboolean hasID = true;\nboolean isAdult\
    \ = false;\n\nif (hasID && isAdult) {\n    // code\n}\n```\n"
