    Please choose an option: 3


    Enter withdrawal amount: 200


    Successfully withdrew $200.0


    * * *


    Step 5: Improvements and Next Steps


    This basic ATM system works well for learning purposes, but there are several
    improvements you could consider for a real-world application:


    1.  Password Protection: You could add a login system to authenticate users before
    allowing them to access their accounts.


    2.  Transaction History: Implement a feature to track each deposit or withdrawal,
