- fmt: "\nConstructor chaining refers to the practice of calling one constructor from\
    \ another within the same class. This is typically done using the `this()` keyword.\
    \ Constructor chaining is useful when you want to reuse code in a class while\
    \ providing multiple ways to initialize an object.\n\n### Example: Constructor\
    \ Chaining\n\n```java\npublic class Car {\n    // Instance variables\n    String\
    \ model;\n    int year;\n    String color;\n\n    // Constructor 1: Initializes\
    \ all fields\n    public Car(String model, int year, String color) {\n       \
    \ this.model = model;\n        this.year = year;\n        this.color = color;\n\
    \    }\n\n    // Constructor 2: Calls Constructor 1 with default values\n    public\
    \ Car(String model) {\n        this(model, 2022, \"Black\");  // Calls Constructor\
    \ 1\n    }\n\n    // Method to display car information\n    public void displayInfo()\
    \ {\n        System.out.println(\"Car Model: \" + model);\n        System.out.println(\"\
    Car Year: \" + year);\n        System.out.println(\"Car Color: \" + color);\n\
    \    }\n}\n\npublic class Main {\n    public static void main(String[] args) {\n\
    \        // Using Constructor 1\n        Car myCar = new Car(\"Tesla\", 2023,\
    \ \"Red\");\n        myCar.displayInfo();\n\n        // Using Constructor 2 (constructor\
    \ chaining)\n        Car defaultCar = new Car(\"Honda\");\n        defaultCar.displayInfo();\n\
    \    }\n}\n```\n\nIn the above example, the second constructor `Car(String model)`\
    \ calls the first constructor `Car(String model, int year, String color)` by using\
    \ `this(model, 2022, \"Black\");`. This is a neat way to avoid code duplication\
    \ while providing flexibility in object initialization.\n\n***\n\n## 5.4 Instance\
    \ vs Static\n\nIn Java, understanding the difference between instance and static\
    \ is key to writing efficient, maintainable, and well-structured code. These two\
    \ concepts deal with how variables and methods are accessed and managed within\
    \ a class, and they determine whether the members belong to an instance of the\
    \ class or to the class itself. Let’s dive into both, looking at when and why\
    \ to use each type.\n\n***\n\n### Instance Members\n\nInstance variables and instance\
    \ methods are tied to a specific instance (or object) of a class. Every time a\
    \ new object of a class is created, a fresh copy of these members is created.\n\
    \n- Instance variables are unique to each object.\n- Instance methods are tied\
    \ to the individual object, meaning they can access and modify the instance variables\
    \ of that particular object.\n\nIn short, instance members are those that are\
    \ specific to an object, and each object has its own copy of these members.\n\n\
    ### Example: Instance Variables and Methods\n\n```java\npublic class Car {\n \
    \   // Instance variables\n    String model;\n    int year;\n\n    // Constructor\
    \ to initialize instance variables\n    public Car(String model, int year) {\n\
    \        this.model = model;\n        this.year = year;\n    }\n\n    // Instance\
    \ method\n    public void displayInfo() {\n        System.out.println(\"Car Model:\
    \ \" + model);\n        System.out.println(\"Car Year: \" + year);\n    }\n\n\
    \    public static void main(String[] args) {\n        // Creating instances of\
    \ the Car class\n        Car car1 = new Car(\"Tesla\", 2023);\n        Car car2\
    \ = new Car(\"Ford\", 2022);\n\n        // Calling instance methods on each object\n\
    \        car1.displayInfo();\n        car2.displayInfo();\n    }\n}\n```\n\nIn\
    \ this example:\n- The `Car` class has instance variables `model` and `year`.\
    \ These are unique to each `Car` object.\n- Each car object (`car1`, `car2`) can\
    \ have its own `model` and `year`.\n- The `displayInfo()` method is an instance\
    \ method. It accesses the instance variables of the specific object calling it,\
    \ and it works on the individual instance's data.\n\n***\n\n### Static Members\n\
    \nStatic members belong to the class rather than to any specific instance. When\
    \ a member is declared as `static`, it means there is only one copy of that member\
    \ shared across all instances of the class. Static variables and methods can be\
    \ accessed without creating an instance of the class.\n\n- Static variables are\
    \ shared across all objects of the class.\n- Static methods can be called without\
    \ creating an object, but they can only directly access other static members (both\
    \ variables and methods).\n\nStatic members are particularly useful when you need\
    \ to share data or methods across all instances of a class, or when you want to\
    \ perform operations that don’t depend on the state of a specific object.\n\n\
    ### Example: Static Variables and Methods\n\n```java\npublic class Car {\n   \
    \ // Instance variables\n    String model;\n    int year;\n\n    // Static variable\
    \ shared across all instances\n    static int carCount = 0;\n\n    // Constructor\
    \ to initialize instance variables and increment carCount\n    public Car(String\
    \ model, int year) {\n        this.model = model;\n        this.year = year;\n\
    \        carCount++; // Increment the static variable\n    }\n\n    // Instance\
    \ method\n    public void displayInfo() {\n        System.out.println(\"Car Model:\
    \ \" + model);\n        System.out.println(\"Car Year: \" + year);\n    }\n\n\
    \    // Static method\n    public static void displayCarCount() {\n        System.out.println(\"\
    Total number of cars: \" + carCount);\n    }\n\n    public static void main(String[]\
    \ args) {\n        // Creating instances of the Car class\n        Car car1 =\
    \ new Car(\"Tesla\", 2023);\n        Car car2 = new Car(\"Ford\", 2022);\n\n \
    \       // Calling instance methods\n        car1.displayInfo();\n        car2.displayInfo();\n\
    \n        // Calling static method\n        Car.displayCarCount();\n    }\n}\n\
