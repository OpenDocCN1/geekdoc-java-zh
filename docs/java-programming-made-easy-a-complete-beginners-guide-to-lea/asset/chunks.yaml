    ## 3.2 Loops (for, while, do-while)


    Loops are powerful tools in Java that let you execute a block of code multiple
    times. Whether you''re processing user input, iterating through a list, or generating
    patterns, loops allow you to write clean and efficient code without repetition.


    In this section, we’ll explore the three most commonly used types of loops in
    Java:  for,  while, and  do-while.


    * * *


    ### The  for Loop


    The  for loop is ideal when you know beforehand how many times you want to iterate.


    Syntax:


    java


    for (initialization; condition; update) {


    // code to execute


    }


    Example: Print numbers from 1 to 5


    java


    public class ForLoopExample {


    public static void main(String[] args) {


    for (int i = 1; i <= 5; i++) {


    System.out.println("Number: " + i);


    }


    }


    }


    Explanation:


    ●       int i = 1 initializes the loop variable.


    ●       i <= 5 is the condition that keeps the loop running.


    ●       i++ increments the variable after each iteration.


    This loop runs five times and prints numbers from 1 to 5.


    * * *


    ### The  while Loop


    Use a  while loop when the number of iterations isn’t known ahead of time, but
    depends on a condition.


    Syntax:


    java


    while (condition) {


    // code to execute


    }


    Example: Print numbers from 1 to 5


    java


    public class WhileLoopExample {


    public static void main(String[] args) {


    int i = 1;


    while (i <= 5) {


    System.out.println("Number: " + i);


    i++;


    }


    }


    }


    Explanation:


    ●       The condition  i <= 5 is checked before each iteration.


    ●       If the condition is true, the block runs.


    ●       Be careful to update the loop variable; otherwise, you might end up in
    an infinite loop.


    * * *


    ### The  do-while Loop


    This loop is similar to  while, but it guarantees at least one execution of the
    block before checking the condition.


    Syntax:


    java


    do {


    // code to execute


    } while (condition);


    Example: Print numbers from 1 to 5


    java


    public class DoWhileLoopExample {


    public static void main(String[] args) {


    int i = 1;


    do {


    System.out.println("Number: " + i);


    i++;


    } while (i <= 5);


    }


    }


    Explanation:


    ●       Even if the condition is false initially, the loop body executes once.


    ● Useful when you need to ensure something is run at least once (e.g., displaying
    a menu before taking input).


    * * *


    ### Comparing the Loops


    | Loop Type | Condition Check | Use Case |


    | for | Before loop | Fixed number of iterations |


    | while | Before loop | Condition-based, unknown count |


    | do-while | After loop | At least one execution guaranteed |


    * * *


    ### Practical Example: Sum of First N Natural Numbers


    java


    import java.util.Scanner;


    public class SumUsingLoops {


    public static void main(String[] args) {


    Scanner scanner = new Scanner(System.in);


    System.out.print("Enter a number: ");


    int n = scanner.nextInt();


    int sum = 0;


    // Using a for loop


    for (int i = 1; i <= n; i++) {


    sum += i; // Adds i to sum


    }


    System.out.println("Sum of first " + n + " natural numbers is: " + sum);


    }


    }


    Explanation:


    ●       We use a  for loop because we know the exact range.


    ●       We keep adding each number from 1 to  n to  sum.


    * * *


    ### Modern Use Case: Iterating Through Arrays


    The enhanced  for-each loop is used to iterate through arrays or collections.


    java


    public class ForEachExample {


    public static void main(String[] args) {


    int[] numbers = {10, 20, 30, 40, 50};


    for (int num : numbers) {


    System.out.println("Element: " + num);


    }


    }


    }


    Explanation:


    ●       No need to manage indices manually.


    ●       It reads better and reduces the chances of errors.


    * * *


    ### Tips for Writing Better Loops


    ●       Always make sure your loop has a clear exit condition.


    ●       Avoid infinite loops unless you''re intentionally waiting (e.g., a server
    listening for requests).


    ●       Use  break to exit early and  continue to skip an iteration if needed.


    ●       Keep your loop logic simple and readable.


    * * *


    ## 3.3 Nested Loops and Loop Control


    When you''re working with multi-dimensional data or creating patterns, you often
    need one loop inside another. This is called nested looping, and it’s a fundamental
    concept for tackling more complex problems.


    Additionally, Java provides loop control statements like  break and  continue
    to give you more control over the flow of your loops. Used wisely, these can help
    you write clearer and more efficient code.


    * * *


    ### Nested Loops


    A nested loop is a loop inside another loop. This structure is especially useful
    when you''re working with grids, matrices, or generating repeated patterns.


    Basic Syntax:


    java


    for (int i = 1; i <= 3; i++) {


    for (int j = 1; j <= 2; j++) {


