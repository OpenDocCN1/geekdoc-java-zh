    # Chapter 9: File Handling


    Working with files is an essential part of many Java applications. Whether you''re
    saving user preferences, logging information, or storing data for later use, file
    I/O operations provide a practical way to persist data. In this chapter, you''ll
    learn how to read from and write to text files using various classes from the  java.io
    and  java.util packages. By the end, you’ll also build a fully functional To-Do
    List App that saves tasks to a file.


    * * *


    ## Chapter 9.1 Reading and Writing Text Files


    Working with files is a fundamental skill for any Java developer. Whether you''re
    storing configuration data, logging activity, or processing user-generated content,
    file I/O (input/output) operations give your applications the power to persist
    and retrieve data efficiently. In this section, we’ll explore the core classes
    for handling text files:  FileReader and  FileWriter.


    This chapter keeps things simple and practical, focusing on the most common operations
    you''ll perform in real-world Java applications.


    * * *


    ### Introduction to FileReader and FileWriter


    Java provides the  java.io package to handle file input and output. Two commonly
    used classes for handling text files are:


    ●       FileReader: Reads character data from a text file.


    ●       FileWriter: Writes character data to a text file.


    These classes are suitable for handling plain text files where encoding and line
    formatting are simple.


    * * *


    ### Writing to a Text File Using FileWriter


    The  FileWriter class allows you to write character data to a file. If the file
    does not exist, it will be created automatically. If it does exist, it will be
    overwritten by default unless explicitly set to append.


    #### Example: Writing Lines to a File


    java


    import java.io.FileWriter;


    import java.io.IOException;


    public class FileWriterExample {


    public static void main(String[] args) {


    try {


    // Create a FileWriter instance


    FileWriter writer = new FileWriter("example.txt");


    // Write lines to the file


    writer.write("Hello from Java FileWriter.\n");


    writer.write("This is the second line.\n");


    // Always close the writer to release resources


    writer.close();


    System.out.println("Data has been written successfully.");


    } catch (IOException e) {


    System.out.println("An error occurred while writing to the file: " + e.getMessage());


    }


    }


    }


    Explanation:


    ●       new FileWriter("example.txt"): Creates or overwrites the file  example.txt.


    ●       write(...): Writes strings to the file.


    ●       \n: Adds a newline character.


    ●       close(): Flushes the buffer and releases system resources.


    * * *


    ### Reading from a Text File Using FileReader


    Once you''ve written data to a file, you’ll likely want to read it back. That’s
    where  FileReader comes in.


    #### Example: Reading Characters from a File


    java


    import java.io.FileReader;


    import java.io.IOException;


    public class FileReaderExample {


    public static void main(String[] args) {


    try {


    // Create FileReader for reading the file


    FileReader reader = new FileReader("example.txt");


    int character;


    // Read one character at a time until the end of the file


    while ((character = reader.read()) != -1) {


    System.out.print((char) character); // Cast int to char to display


    }


    reader.close();


    } catch (IOException e) {


    System.out.println("An error occurred while reading from the file: " + e.getMessage());


    }


    }


    }


    Explanation:


    ● The  read() method returns an  int value of the character read, or  -1 if the
    end of the file is reached.


    ●       Casting to  (char) displays the actual character.


    ● Reading is done one character at a time, which is fine for small files but inefficient
    for large ones (we’ll optimize this later with  BufferedReader).


    * * *


    ### Appending to a File


    If you want to add content to an existing file without overwriting it, you can
    pass a second argument  true to the  FileWriter constructor.


    #### Example: Appending Data


    java


    import java.io.FileWriter;


    import java.io.IOException;


    public class AppendExample {


    public static void main(String[] args) {


    try {


    // ''true'' enables append mode


    FileWriter writer = new FileWriter("example.txt", true);


    writer.write("Appended line.\n");


    writer.close();


    System.out.println("Data has been appended to the file.");


    } catch (IOException e) {


    System.out.println("An error occurred while appending to the file: " + e.getMessage());


    }


    }


    }


