    | Go to Definition / Declaration | `Ctrl + B` or `Ctrl + Click` | `Cmd + B` or
    `Cmd + Click` |

    | Find Usages | `Alt + F7` | `Option + F7` |

    | Navigate Back | `Ctrl + Alt + Left` | `Cmd + Option + Left` |

    | Navigate Forward | `Ctrl + Alt + Right` | `Cmd + Option + Right` |

    | Recent Files | `Ctrl + E` | `Cmd + E` |


    ### Editing and Refactoring


    | Action | Shortcut (Windows/Linux) | Shortcut (macOS) |

    | :--- | :--- | :--- |

    | Auto-Complete | `Ctrl + Space` | `Ctrl + Space` |

    | Smart Completion | `Ctrl + Shift + Space` | `Cmd + Shift + Space` |

    | Surround With | `Ctrl + Alt + T` | `Cmd + Option + T` |

    | Rename Symbol | `Shift + F6` | `Shift + Fn + F6` |

    | Extract Method / Variable | `Ctrl + Alt + M / V` | `Cmd + Option + M / V` |

    | Reformat Code | `Ctrl + Alt + L` | `Cmd + Option + L` |

    | Optimize Imports | `Ctrl + Alt + O` | `Ctrl + Option + O` |

    | Comment/Uncomment Line | `Ctrl + /` | `Cmd + /` |


    ### Debugging


    | Action | Shortcut (Windows/Linux) | Shortcut (macOS) |

    | :--- | :--- | :--- |

    | Toggle Breakpoint | `Ctrl + F8` | `Cmd + F8` |

    | Step Over | `F8` | `F8` |

    | Step Into | `F7` | `F7` |

    | Step Out | `Shift + F8` | `Shift + F8` |

    | Resume Program | `F9` | `Cmd + Option + R` |

    | Evaluate Expression | `Alt + F8` | `Option + F8` |


    When debugging complex Java code, combining `Evaluate Expression` and `Step Into`
    can help you understand tricky logic and flow without guessing what''s going on
    under the hood.


    ***


    ## 2. Eclipse


    Eclipse is another popular Java IDE with a vast user base, especially in enterprise
    environments. It offers strong support for plugin development and a robust feature
    set.


    ### Navigation and Editing


    | Action | Shortcut (Windows/Linux) | Shortcut (macOS) |

    | :--- | :--- | :--- |

    | Open Type/File | `Ctrl + Shift + T / R` | `Cmd + Shift + T / R` |

    | Go to Declaration | `F3` | `F3` |

    | Open Declaration in New Window | `Ctrl + F3` | `Cmd + F3` |

    | Show Outline | `Ctrl + O` | `Cmd + O` |


    ### Editing and Refactoring


    | Action | Shortcut (Windows/Linux) | Shortcut (macOS) |

    | :--- | :--- | :--- |

    | Content Assist | `Ctrl + Space` | `Ctrl + Space` |

    | Rename | `Alt + Shift + R` | `Cmd + Shift + R` |

    | Extract Method | `Alt + Shift + M` | `Cmd + Shift + M` |

    | Format Code | `Ctrl + Shift + F` | `Cmd + Shift + F` |

    | Organize Imports | `Ctrl + Shift + O` | `Cmd + Shift + O` |

    | Comment/Uncomment | `Ctrl + /` | `Cmd + /` |


    ### Debugging


    | Action | Shortcut (Windows/Linux) | Shortcut (macOS) |

    | :--- | :--- | :--- |

    | Toggle Breakpoint | `Ctrl + Shift + B` | `Cmd + Shift + B` |

    | Step Over | `F6` | `F6` |

    | Step Into | `F5` | `F5` |

    | Step Out | `F7` | `F7` |

    | Resume | `F8` | `F8` |


    Practical Example: While debugging, use `Step Into(F5)` to go deeper into method
    calls and understand how control flows between your objects, especially helpful
    in recursive logic or when tracing exceptions.


    ***


    ## 3. Visual Studio Code (with Java Extensions)


    VS Code has become increasingly popular due to its lightweight nature and extensive
    extension support. With the Java Extension Pack from Microsoft, you can have a
    complete Java development environment.


    ### Navigation and Editing


    | Action | Shortcut (Windows/Linux) | Shortcut (macOS) |

    | :--- | :--- | :--- |

    | Quick Open File | `Ctrl + P` | `Cmd + P` |

    | Go to Definition | `F12` | `F12` |

    | Peek Definition | `Alt + F12` | `Option + F12` |

    | Show All Symbols | `Ctrl + T` | `Cmd + T` |


    ### Editing and Refactoring


    | Action | Shortcut (Windows/Linux) | Shortcut (macOS) |

    | :--- | :--- | :--- |

    | Auto Complete | `Ctrl + Space` | `Ctrl + Space` |

    | Rename Symbol | `F2` | `F2` |

    | Format Document | `Shift + Alt + F` | `Shift + Option + F` |

    | Comment Line | `Ctrl + /` | `Cmd + /` |


    ### Debugging


    | Action | Shortcut (Windows/Linux) | Shortcut (macOS) |

    | :--- | :--- | :--- |

    | Toggle Breakpoint | `F9` | `F9` |

    | Start Debugging | `F5` | `F5` |

    | Step Over | `F10` | `F10` |

    | Step Into | `F11` | `F11` |

    | Step Out | `Shift + F11` | `Shift + F11` |


    Helpful Tip: With VS Code, combine shortcuts with the Command Palette(`Ctrl +
    Shift + P / Cmd + Shift + P`) to quickly access features like installing extensions
    or changing Java runtime settings.


    ***


    ## Bonus Tip: Customizing Your Shortcuts


    Most modern IDEs allow you to modify and customize shortcuts according to your
    workflow:


    - IntelliJ IDEA: `Settings > Keymap`

    - Eclipse: `Window > Preferences`

    - VS Code: `File > Keyboard Shortcuts` or `Ctrl + K Ctrl + S`


