  trans: "\n\n# 关键点：catch 块的顺序非常重要——从更具体的异常开始，向更通用的异常。如果你在捕获特定类型之前捕获了 `Exception`，则特定的\
    \ catch 块将永远不会到达。\n\n***\n\n### 在一个 catch 中使用多个异常 (Java 7+)\n\nJava 7 引入了使用 `|`\
    \ 符号在单个 `catch` 块中捕获多个异常的方法。\n\n#### 示例 3：多捕获块\n\n```java\npublic class MultiCatch\
    \ {\n    public static void main(String[] args) {\n        try {\n           \
    \ String text = null;\n            System.out.println(text.length()); // Throws\
    \ NullPointerException\n        } catch (NullPointerException | ArithmeticException\
    \ e) {\n            System.out.println(\"Caught an exception: \" + e.getClass().getSimpleName());\n\
    \        }\n    }\n}\n```\n\n这可以保持代码整洁，并在当多个异常需要相同的处理逻辑时避免代码重复。\n\n***\n\n###\
    \ 最佳实践\n\n1.  **只捕获你能够处理的内容**\n    除非绝对必要，否则不要使用通用的 `catch (Exception e)`。它可能会隐藏真实问题并增加调试难度。\n\
    \n2.  **避免静默失败**\n    永远不要编写空的 catch 块。始终要记录或做出有意义的响应。\n    ```java\n    // Bad\
    \ practice\n    catch (IOException e) {\n        // 什么都不做\n    }\n    ```\n\n\
    3.  **使用有意义的错误信息**\n    提供用户友好且信息丰富的反馈。\n\n4.  **不要过度使用 try-catch**\n    只对可能失败的代码进行封装——而不是不必要地封装整个方法。\n\
    \n***\n\n### 真实场景：安全的输入解析\n\ntry-catch 的一个常见用是将字符串输入转换为数字。这在处理用户输入时经常出现。\n\n```java\n\
    import java.util.Scanner;\n\npublic class InputParsing {\n    public static void\
    \ main(String[] args) {\n        Scanner scanner = new Scanner(System.in);\n \
    \       System.out.print(\"Enter a number: \");\n        String input = scanner.nextLine();\n\
    \        try {\n            int number = Integer.parseInt(input); // Risky: could\
    \ throw NumberFormatException\n            System.out.println(\"You entered: \"\
    \ + number);\n        } catch (NumberFormatException e) {\n            System.out.println(\"\
    Invalid number format. Please enter digits only.\");\n        }\n        scanner.close();\n\
    \    }\n}\n```\n\n***\n\n## 8.2 Finally, Throw 和自定义异常\n\n现在你已经了解了 `try-catch`\
    \ 块是如何工作的，现在是时候理解三个关键组件来完成 Java 异常处理系统的蓝图了：`finally`、`throw` 和自定义异常类。这些允许你构建更清晰、更健壮的应用程序，以有意识且一致的方式处理错误。\n\
    \n让我们逐一分析它们，展示如何以及何时使用它们，并介绍你可以在实际开发中应用的实用示例。\n\n***\n\n### `finally` 块\n\n`finally`\
    \ 块用于无论是否抛出或捕获到异常都执行代码。它最适用于清理操作，如关闭文件、释放资源或断开数据库连接。\n\n#### 语法\n\n```java\ntry\
    \ {\n    // 危险代码\n} catch (ExceptionType e) {\n    // 异常处理\n} finally {\n    //\
    \ 始终运行的清理代码\n}\n```\n\n#### 示例：使用 `finally` 关闭文件\n\n```java\nimport java.io.BufferedReader;\n\
    import java.io.FileReader;\nimport java.io.IOException;\n\npublic class FinallyExample\
    \ {\n    public static void main(String[] args) {\n        BufferedReader reader\
    \ = null;\n        try {\n            reader = new BufferedReader(new FileReader(\"\
    example.txt\"));\n            String line = reader.readLine();\n            System.out.println(\"\
    First line: \" + line);\n        } catch (IOException e) {\n            System.out.println(\"\
    Error reading file: \" + e.getMessage());\n        } finally {\n            try\
    \ {\n                if (reader != null) {\n                    reader.close();\
    \ // 始终尝试关闭\n                    System.out.println(\"File closed.\");\n     \
    \           }\n            } catch (IOException e) {\n                System.out.println(\"\
    Failed to close file: \" + e.getMessage());\n            }\n        }\n    }\n\
    }\n```\n\n其重要性：即使在读取文件时发生异常，`finally` 块也能确保文件流被正确关闭。\n\n***\n\n### `throw` 语句\n\
    \n`throw` 关键字允许你手动触发异常。当你检测到 Java 默认不认为是异常的错误条件时，这种方法非常有用。\n\n#### 语法\n\n```java\n\
    throw new ExceptionType(\"Custom error message\");\n```\n\n#### 示例：手动抛出异常\n\n\
    ```java\npublic class ThrowExample {\n    public static void main(String[] args)\
    \ {\n        int age = -5;\n        try {\n            if (age < 0) {\n      \
    \          throw new IllegalArgumentException(\"Age cannot be negative.\");\n\
    \            }\n            System.out.println(\"Age is: \" + age);\n        }\
    \ catch (IllegalArgumentException e) {\n            System.out.println(\"Exception:\
    \ \" + e.getMessage());\n        }\n    }\n}\n```\n\n何时使用：在验证输入或强制执行需要自定义逻辑业务规则时使用\
    \ `throw`。\n\n***\n\n### 创建自定义异常\n\n内置异常如 `NullPointerException` 或 `IOException`\
    \ 涵盖了广泛的错误。但有时，你需要一个更具领域特定的异常——这就是自定义异常大显用场。\n\n#### 如何创建自定义异常\n\nJava 中的自定义异常是通过扩展\
    \ `Exception` 类（用于检查异常）或 `RuntimeException`（用于非检查异常）来创建的。\n\n#### 示例：定义自定义异常\n\
    \n```java\n// 定义一个自定义异常\nclass InvalidScoreException extends Exception {\n   \
    \ public InvalidScoreException(String message) {\n        super(message);\n  \
    \  }\n}\n\n// 在类中使用它\npublic class CustomExceptionExample {\n    public static\
    \ void validateScore(int score) throws InvalidScoreException {\n        if (score\
    \ < 0 || score > 100) {\n            throw new InvalidScoreException(\"Score must\
    \ be between 0 and 100.\");\n        }\n        System.out.println(\"Score is\
    \ valid: \" + score);\n    }\n\n    public static void main(String[] args) {\n\
    \        try {\n            validateScore(150);\n        } catch (InvalidScoreException\
    \ e) {\n            System.out.println(\"Validation failed: \" + e.getMessage());\n\
    \        }\n    }\n}\n```\n\n解释：\n- 我们定义了一个扩展 `Exception` 的类 `InvalidScoreException`。\n\
    - 当分数超出范围时我们抛出它。\n- 在 `main` 方法中，我们像处理其他任何异常一样捕获它。\n\n***\n\n### 检查异常 vs 非检查异常\n\
    \n在创建自定义异常时，理解检查异常和非检查异常是有帮助的：\n\n| 类型 | 自 | 是否在方法签名中声明 |\n| :--- | :--- | :---\
    \ |\n| 检查 (Checked) | Exception | 是 |\n| 非检查 (Unchecked) | RuntimeException |\
    \ 否 |\n\n对于程序可以恢复的条件使用检查异常。对于程序员错误使用非检查异常。\n\n***\n\n### 最佳实践\n\n1.  **在 `finally`\
    \ 中关闭资源或使用 try-with-resources**\n    Java 支持 try-with-resources，比手动使用 `finally`\
    \ 更简洁。\n2.  **抛出特定异常**\n    避免抛出通用的 `Exception`。始终使用最具体的类型。\n3.  **不要过度使用自定义异常**\n\
    \    当内置异常无法提供意义上下文时使用它们。\n4.  **包含帮助信息**\n    抛出时始终传递清晰的消息。\n\n***\n\n## 动手项目：安全读取器应用\n\
    \n在这个动手项目中，我们将构建一个安全读取器应用，它可以读取文件内容并优雅地处理潜在异常。目标是实践本章中的概念——try-catch 块、`finally`、`throw`\
    \ 和自定义异常——同时构建一个功能齐全且重用的文件读取工具。\n\n此应用将教你如何：\n- 妥善处理常见的 I/O 异常。\n- 使用 `finally`\
    \ 确保资源释放。\n- 创建并使用自定义异常管理特定错误情况。\n- 实现清晰且用户友好的报告结构。\n\n让我们开始吧。\n\n### 项目概述\n\n\
    我们的应用将：\n\n1. 提示用户输入文件路径。\n2. 尝试逐行读取文件。\n3. 处理异常：\n    - 文件找不到\n    - 文件为空\n \
    \   - 路径无效\n4. 如果文件为空，使用自定义异常。\n5. 始终使用 `finally` 块关闭文件读取器。\n\n***\n\n###get 1：创建自定义异常\n\
    \n我们将定义一个名为 `EmptyFileException` 的自定义异常，用于文件存在但无数据的情况。\n\n"
- fmt: "\n```java\n// EmptyFileException.java\n\npublic class EmptyFileException extends\
    \ Exception {\n    public EmptyFileException(String message) {\n        super(message);\n\
    \    }\n}\n```\n\n* *\n\n### Step 2: SafeFileReader Utility Class\n\nNow let’s\
    \ implement a utility class that encapsulates the file reading logic.\n\n```java\n\
    // SafeFileReader.java\n\nimport java.io.BufferedReader;\nimport java.io.FileReader;\n\
    import java.io.IOException;\nimport java.io.File;\n\npublic class SafeFileReader\
    \ {\n    public static void readFile(String filePath) throws EmptyFileException\
    \ {\n        BufferedReader reader = null;\n        try {\n            File file\
    \ = new File(filePath);\n            if (!file.exists()) {\n                throw\
    \ new IOException(\"File does not exist.\");\n            }\n            reader\
    \ = new BufferedReader(new FileReader(file));\n            StringBuilder content\
    \ = new StringBuilder();\n            String line;\n            // Read file content\
    \ line by line\n            while ((line = reader.readLine()) != null) {\n   \
    \             content.append(line).append(\"\\n\");\n            }\n         \
    \   // Check for empty file\n            if (content.toString().trim().isEmpty())\
    \ {\n                throw new EmptyFileException(\"The file is empty.\");\n \
    \           }\n            System.out.println(\"\\n--- File Content ---\");\n\
    \            System.out.println(content);\n        } catch (IOException e) {\n\
    \            System.out.println(\"I/O Error: \" + e.getMessage());\n        }\
    \ finally {\n            // Ensure the file is always closed\n            try\
    \ {\n                if (reader != null) {\n                    reader.close();\n\
    \                    System.out.println(\"File closed successfully.\");\n    \
    \            }\n            } catch (IOException e) {\n                System.out.println(\"\
    Failed to close file: \" + e.getMessage());\n            }\n        }\n    }\n\
    }\n```\n\n* *\n\n### Step 3: Main Program with User Input\n\nWe’ll now create\
    \ the `Main` class that interacts with the user and invokes the file reader.\n\
    \n```java\n// Main.java\n\nimport java.util.Scanner;\n\npublic class Main {\n\
    \    public static void main(String[] args) {\n        Scanner scanner = new Scanner(System.in);\n\
    \        System.out.print(\"Enter the path to the file you want to read: \");\n\
    \        String filePath = scanner.nextLine();\n        try {\n            SafeFileReader.readFile(filePath);\n\
    \        } catch (EmptyFileException e) {\n            System.out.println(\"Custom\
    \ Exception: \" + e.getMessage());\n        }\n    }\n}\n```\n\n* *\n\n### Sample\
    \ Run\n\n```pgsql\nEnter the path to the file you want to read: data/info.txt\n\
    --- File Content ---\nJava is a versatile programming language.\nIt is widely\
    \ used in enterprise and mobile applications.\nFile closed successfully.\n```\n\
    \nOr, if the file is empty:\n\n```pgsql\nEnter the path to the file you want to\
    \ read: empty.txt\nCustom Exception: The file is empty.\nFile closed successfully.\n\
    ```\n\nOr, if the file does not exist:\n\n```mathematica\nEnter the path to the\
    \ file you want to read: missing.txt\nI/O Error: File does not exist.\n```\n\n\
    * *\n\n### Key Takeaways\n\n- The `try-catch` block lets us handle both checked\
    \ and unchecked exceptions during file operations.\n- The `finally` block ensures\
    \ that resources are released, preventing memory leaks and file locks.\n- Throwing\
    \ custom exceptions makes error reporting more descriptive and relevant to the\
    \ domain logic.\n- Separating logic into a utility class (`SafeFileReader`) keeps\
    \ the code clean, modular, and reusable.\n\n* *\n\n### Challenge for You\n\nTry\
    \ extending the app to:\n\n- Count and display the number of lines in the file.\n\
    - Handle different file types (e.g., `.csv`, `.txt`) with format-specific messages.\n\
    - Log errors to a separate error log file instead of just printing to the console.\n\
    \nThese exercises will reinforce the ideas in this chapter and make you more confident\
    \ handling real-world exceptions in Java.\n\nIn the next chapter, we’ll explore\
    \ Java’s object-oriented features more deeply as we move into Classes and Objects.\n\
    \n* *\n\n# Chapter 9: File Handling\n\nWorking with files is an essential part\
    \ of many Java applications. Whether you're saving user preferences, logging information,\
    \ or storing data for later use, file I/O operations provide a practical way to\
    \ persist data. In this chapter, you'll learn how to read from and write to text\
    \ files using various classes from the `java.io` and `java.util` packages. By\
    \ the end, you’ll also build a fully functional To-Do List App that saves tasks\
    \ to a file.\n\n* *\n\n## Chapter 9.1 Reading and Writing Text Files\n\nWorking\
    \ with files is a fundamental skill for any Java developer. Whether you're storing\
    \ configuration data, logging activity, or processing user-generated content,\
    \ file I/O (input/output) operations give your applications the power to persist\
    \ and retrieve data efficiently. In this section, we’ll explore the core classes\
    \ for handling text files: `FileReader` and `FileWriter`.\n\nThis chapter keeps\
    \ things simple and practical, focusing on the most common operations you'll perform\
    \ in real-world Java applications.\n\n* *\n\n### Introduction to FileReader and\
    \ FileWriter\n\nJava provides the `java.io` package to handle file input and output.\
    \ Two commonly used classes for handling text files are:\n\n- `FileReader`: Reads\
    \ character data from a file.\n- `FileWriter`: Writes character data to a file.\n\
    \nThese classes are suitable for handling text files.\n\n* *\n\n### Writing to\
    \ a File Using FileWriter\n\nThe `FileWriter` class allows you to write character\
    \ data to a file. If the file does not exist, it will be created. If it does exist,\
    \ it will be overwritten unless explicitly set to append.\n\n#### Example: Writing\
    \ Lines to a File\n\n```java\nimport java.io.FileWriter;\nimport java.io.IOException;\n\
    \npublic class FileWriterExample {\n    public static void main(String[] args)\
    \ {\n        try {\n            // Create a FileWriter\n            FileWriter\
    \ writer = new FileWriter(\"example.txt\");\n            // Write lines to the\
    \ file\n            writer.write(\"Hello from Java.\\n\");\n            writer.write(\"\
    This is the second line.\\n\");\n            // Always close the writer to release\
    \ resources\n            writer.close();\n            System.out.println(\"Data\
    \ has been written.\");\n        } catch (IOException e) {\n            System.out.println(\"\
    An error occurred writing to the file: \" + e.getMessage());\n        }\n    }\n\
    }\n```\n\nExplanation:\n\n- `new FileWriter(\"example.txt\")`: Creates or overwrites\
    \ the file.\n- `write(...)`: Writes strings to the file.\n- `\\n`: Adds a newline\
    \ character.\n- `close()`: Flushes the buffer and releases system resources.\n\
    \n* *\n\n### Reading from a Text File Using FileReader\n\nOnce you've written\
    \ data to a file, you’ll likely want to read it back. That’s where `FileReader`\
    \ comes in.\n\n#### Example: Reading Characters from a File\n\n```java\nimport\
    \ java.io.FileReader;\nimport java.io.IOException;\n\npublic class FileReaderExample\
    \ {\n    public static void main(String[] args) {\n        try {\n           \
    \ // Create FileReader for reading the file\n            FileReader reader = new\
    \ FileReader(\"example.txt\");\n            int character;\n            // Read\
    \ one character at a time until the end of the file\n            while ((character\
    \ = reader.read()) != -1) {\n                System.out.print((char) character);\
    \ // Cast int to char to display\n            }\n            reader.close();\n\
    \        } catch (IOException e) {\n            System.out.println(\"An error\
    \ occurred reading from the file: \" + e.getMessage());\n        }\n    }\n}\n\
    ```\n\nExplanation:\n\n- The `read()` method returns an `int` value of the character\
    \ read, or `-1` if the end of the file is reached.\n- Casting to `(char)` displays\
    \ the actual character.\n- Reading is done one character at a time, which is fine\
    \ for small files but inefficient for large ones (we’ll optimize this later with\
    \ `BufferedReader`).\n\n* *\n\n### Appending to a File\n\nIf you want to add content\
    \ to an existing file without overwriting it, you can pass a second argument `true`\
    \ to the `FileWriter` constructor.\n\n#### Example: Appending Data\n\n```java\n\
    import java.io.FileWriter;\nimport java.io.IOException;\n\npublic class AppendExample\
    \ {\n    public static void main(String[] args) {\n        try {\n           \
    \ // 'true' enables append mode\n            FileWriter writer = new FileWriter(\"\
