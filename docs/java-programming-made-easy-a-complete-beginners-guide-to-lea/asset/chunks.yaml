  trans: "\n\n# 常见错误及避免方法\n\n- **文件名与类名不匹配**：如果你的类命名为 `Main`，那么你的文件必须命名为 `Main.java`。\n\
    - **缺少分号**：Java 中的每条语句必须以分号 `;` 结尾。\n- **大小写错误**：Java 对大小写敏感。`System` 必须大写。`system.out.println`\
    \ 将导致编译错误。\n\n## 扩展程序：添加第二行\n\n你可以修改程序来打印多行：\n\n```java\npublic class Main {\n\
    \    public static void main(String[] args) {\n        System.out.println(\"Hello,\
    \ World!\");\n        System.out.println(\"Welcome to Java Programming.\");\n\
    \    }\n}\n```\n\n输出：\n\n```css\nHello, World!\nWelcome to Java Programming.\n\
    ```\n\n这展示了如何逐行构建程序以添加更多功能。\n\n## 从第一天开始良好实践\n\n- **使用有意义的类名**：在实际应用中，使用反映用途的名称，如\
    \ `InvoiceManager` 或 `StudentPortal`。\n- **保持代码整洁可读**：缩进、一致的空格和注释有助于让你的代码更容易理解。\n\
    - **始终测试你的代码**：在编写完小部分后运行程序，以及早发现错误。\n\n# 第 2 章：Java 基础\n\n在本章中，我们将涵盖任何 Java 程序的要素组成部分：变量、数据类型、运算符、输入/输出和编码风格。这些基础是你\
    \ Java 编程之旅的基石。在结束时，你将使用所学知识创建一个自己的基础计算器。\n\n## 2.1 变量和数据类型\n\n每个 Java 程序都会处理数据——数字、文本、布尔逻辑等。为了处理这些数据，你需要一种将它们存储在内存中的方法。这就是变量用用。在本节中，我们将介绍变量是什么、如何使用以及\
    \ Java 提供的各种数据类型。\n\n## 什么是变量？\n\n变量仅仅是计算机内存中一个命名的存储位置，用于存放值。你给它起一个名字，分配一个值，然后在代码中通过该名称引用它。\n\
    \n### 变量声明语法\n\n```java\ndataType variableName = value;\n```\n\n### 示例：\n\n```java\n\
    int age = 30;\nString name = \"Alice\";\ndouble temperature = 22.5;\n```\n\n在上面的示例中：\n\
    - `int` 声明了一个整数变量 `age`，值为 `30`。\n- `String` 声明了一个文本变量 `name`，值为 `\"Alice\"`。\n\
    - `double` 声明了一个小数数字 `temperature`，值为 `22.5`。\n\n## Java 的数据类型\n\nJava 有两大类数据类型：\n\
    \n### 1. 基本数据类型\n\n这些是最基础的数据类型，且不是对象。\n\n| 类型 | 大小 (位) | 说明 | 示例 |\n| :--- | :---\
    \ | :--- | :--- |\n| byte | 8 | 非常小的整数 (-128 到 127) | `byte b = 100;` |\n| short\
    \ | 16 | 小整数 | `short s = 30000;` |\n| int | 32 | 标准整数 | `int x = 200;` |\n| long\
    \ | 64 | 大整数 | `long l = 123456789L;` |\n| float | 32 | 小数（精度较低） | `float f =\
    \ 5.5f;` |\n| double | 64 | 小数（高精度） | `double d = 10.99;` |\n| char | 16 | 单个字符\
    \ | `char c = 'A';` |\n| boolean | 1 | 真或假 | `boolean active = true;` |\n\n###\
    \ 2. 引用类型\n\n这些包括对象和数组。目前最常用的引用类型是 `String`。\n\n```java\nString greeting = \"\
    Welcome to Java!\";\n```\n\n### 类型转换（强制类型转换）\n\nJava 是静态类型，这意味着每个变量必须有一个声明的类型。有时，你需要将一种类型转换为另一种。\n\
    \n### 隐式转换（宽化）\n\n在转换为更大的类型时自动发生。\n\n```java\nint x = 10;\ndouble y = x; // 将\
    \ int 转换为 double\n```\n\n### 显式转换（窄化）\n\n在转换为较小类型时需要强制转换。\n\n```java\ndouble a\
    \ = 5.75;\nint b = (int) a; // 手动将 double 转换为 int (b 变为 5)\n```\n\n## 最终变量（常量）\n\
    \n使用 `final` 关键字声明一个值不应改变变量。\n\n```java\nfinal double PI = 3.14159;\n```\n\n稍后重新赋值\
    \ `PI` 将导致编译错误。\n\n## 命名规范\n\n遵循 Java 命名规范有助于提高可读性：\n- 变量使用驼峰法 (`camelCase`)：`userAge`,\
    \ `maxSpeed`。\n- 变量名应该有意义：`totalPrice` 比 `tp` 好。\n- 避免以数字开头或使用保留关键字（如 `class`,\
    \ `int`, `static`）。\n\n## 实际示例\n\n让我们写一个短的 Java 程序来演示所有类型：\n\n```java\npublic\
    \ class DataTypes {\n    public static void main(String[] args) {\n        int\
    \ age = 25;\n        double salary = 45;\n        char grade = 'B';\n        boolean\
    \ isEm = true;\n        String name = \"Sophia\";\n\n        System.out.println(\"\
    Age: \" + age);\n        System.out.println(\"Salary: \" + salary);\n        System.out.println(\"\
