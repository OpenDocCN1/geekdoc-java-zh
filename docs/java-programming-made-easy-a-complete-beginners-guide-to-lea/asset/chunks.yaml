  raw: 'The final chapter challenges you to bring everything together into a complete
    console-based Java application. We’ll guide you step-by-step through building
    a simple library management system or an ATM simulation. You’ll learn how to structure
    code across multiple classes, handle user input, manage files, and think like
    a developer.


    * * *


    ## Chapter 1: Getting Started with Java


    ## 1.1 What is Java?


    Java is a high-level, object-oriented, and platform-independent programming language
    developed by Sun Microsystems in 1995 (now owned by Oracle). It’s widely used
    for building desktop applications, web applications, mobile apps (especially Android),
    and enterprise systems.


    One of Java’s most powerful features is its “write once, run anywhere” philosophy.
    Java code is compiled into bytecode, which runs on the Java Virtual Machine (JVM).
    This means you can write a Java program on one operating system (like Windows)
    and run it on another (like macOS or Linux) without any changes.


    Key Characteristics of Java:


    ●       Object-Oriented: Java uses objects and classes to structure code logically.


    ●       Platform-Independent: The JVM abstracts away the underlying operating
    system.


    ●       Strongly Typed: You must declare variable types explicitly.


    ●       Rich Standard Library: Java comes with a vast set of built-in APIs.


    ●       Widely Adopted: Used in industries ranging from finance and telecom to
    gaming and embedded systems.


    In essence, Java is mature, robust, and battle-tested. It’s still among the top
    languages used worldwide, thanks to its combination of performance, safety, and
    broad applicability.


    * * *


    ## 1.2 Why Learn Java Today?


    Java continues to be one of the most relevant and in-demand programming languages,
    even after decades of use. Here’s why it remains a great language to learn:


    1\. Career Opportunities


    Java is heavily used in enterprise applications, banking systems, Android development,
    and large-scale backend systems. Many Fortune 500 companies rely on Java for their
    core infrastructure.


    2\. Strong Community and Ecosystem


    With millions of developers worldwide, Java has a large support community, open-source
    tools, and rich documentation—making it easier for beginners to find help and
    resources.


    3\. Android Development


    Java (along with Kotlin) is one of the primary languages used for Android app
    development. If you''re interested in building mobile apps, Java is still highly
    relevant.


    4\. Foundation for Other Languages


    Learning Java helps build a solid foundation in programming principles like object-oriented
    design, type safety, and structured error handling. This makes it easier to learn
    other languages later on (like Kotlin, Scala, or C#).


    5\. Enterprise-Grade Performance


    Java is fast, reliable, and scalable. That’s why it’s the default choice for building
    large-scale web services, backend APIs, and high-volume transactional systems.


    Recent Data Snapshot (2025):


    ● Java is consistently ranked in the top 3 of the TIOBE Index and Stack Overflow
    Developer Surveys.


    ●       Over 8 million developers actively use Java.


    ●       Companies like Google, Amazon, Netflix, and IBM use Java extensively.


    * * *


    ## 1.3 Installing Java and IntelliJ IDEA (or VS Code)


    Before we write any code, let’s set up your development environment. You’ll need
    two tools:


    ●       The Java Development Kit (JDK)


    ●       An IDE (Integrated Development Environment) like IntelliJ IDEA or Visual
    Studio Code


    Step 1: Install Java JDK


    Download the latest Java SE Development Kit from the official Oracle or OpenJDK
    site.


    Option A: Oracle JDK (recommended for beginners)


    ●       Website: [](https://www.oracle.com/java/technologies/javase-downloads.html)[https://www.oracle.com/java/technologies/javase-downloads.html](https://www.oracle.com/java/technologies/javase-downloads.html)
     


    Option B: OpenJDK


    ●       Website: [](https://jdk.java.net/)[https://jdk.java.net](https://jdk.java.net/)
     


    Choose the version appropriate for your operating system (Windows, macOS, Linux),
    download the installer, and follow the setup instructions.


    After installation, verify the installation:


    java -version


    Expected Output (as of 2025):


    java version "21.0.2" 2025-01-16 LTS


    Java(TM) SE Runtime Environment (build 21.0.2+13-LTS)


    Java HotSpot(TM) 64-Bit Server VM (build 21.0.2+13-LTS, mixed mode)


    Step 2: Install IntelliJ IDEA (Recommended IDE)


    IntelliJ IDEA by JetBrains is a feature-rich IDE tailored for Java development.


    1.  Download from: [](https://www.jetbrains.com/idea/download)[https://www.jetbrains.com/idea/download](https://www.jetbrains.com/idea/download)
    [](https://www.jetbrains.com/idea/download)   


    2.  Choose Community Edition (free) or Ultimate Edition (paid).


    3.  Install and launch the IDE.


    4.  On first launch, create a new Java project and configure the JDK (IDE will
    usually detect it automatically).


    Alternative: VS Code


    If you prefer lightweight tools:


    1.  Download VS Code: [](https://code.visualstudio.com/)[https://code.visualstudio.com](https://code.visualstudio.com/)
    [](https://code.visualstudio.com/)   


    2.  Install the Extension Pack for Java from Microsoft.


    3.  Configure the Java JDK under settings.


    4.  Install optional extensions like Code Runner or Debugger for Java.


    * * *


    ## 1.4 Writing Your First Java Program


    Now that you have Java and your development environment installed, it’s time to
    write your very first Java program. This is a foundational step in your journey,
    so we’ll keep it simple, walk through every line, and make sure you understand
    the basic structure of a Java application.


    We’ll use a classic starting point—printing a message to the screen. It may seem
    simple, but it introduces you to essential elements: classes, the main method,
    statements, and syntax.


    * * *


    Step-by-Step: Creating a Java Program in IntelliJ IDEA


    1.  Open IntelliJ IDEA.


    2.  Select New Project.


    3.  Choose Java as the project type.


    4.  Set the Project SDK to Java 21 (or whichever version you installed).


    5.  Name your project:  FirstJavaApp.


    6.  Click Finish.


    Now, inside the  src directory:


    1.  Right-click  src → New → Java Class.


    2.  Name the class:  Main.


    IntelliJ will create a new file:  Main.java.


    * * *


    Your First Java Program: Hello World


    Let’s write your first complete and working Java program:


    java


    // File: Main.java


    // This defines a public class named ''Main''


    public class Main {


    // The main method is the entry point of any Java program


    public static void main(String[] args) {


    // Print a message to the console


    System.out.println("Hello, World!");


    }


    }


    * * *


    Code Breakdown and Explanation


    ● public class Main


    This line declares a class named  Main. In Java, every application must have at
    least one class, and the file name must match the class name (i.e.,  Main.java
    contains  Main).


    ●       public static void main(String[] args)


    This is the main method, where the program starts executing.


    ○   public: Accessible from anywhere.


    ○ static: Belongs to the class, not to an object (you don’t need to create an
    object to run it).


    ○   void: This method returns nothing.


    ○ String[] args: This parameter allows your program to accept command-line arguments
    (you won’t need it now, but it’s a standard requirement).


    ●       System.out.println("Hello, World!");


    This is a statement that prints text to the console.


    ○   System is a built-in Java class.


    ○ out is a static field (an instance of  PrintStream).


    ○ println() is a method that outputs the string followed by a newline.


    * * *


    Compiling and Running the Program


    If you''re using IntelliJ IDEA:


    1.  Click the green play button next to the  main method or at the top right.


    2.  You’ll see the output in the console window below:


    Hello, World!


    If you''re using the terminal:


    bash


    javac Main.java   // Compiles the file


    java Main         // Runs the compiled program


    Note: Make sure you''re inside the directory where  Main.java is located.


    * * *'
