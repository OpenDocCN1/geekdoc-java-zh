  raw: 'Constructor chaining refers to the practice of calling one constructor from
    another within the same class. This is typically done using the  this() keyword.
    Constructor chaining is useful when you want to reuse code in a class while providing
    multiple ways to initialize an object.


    #### Example: Constructor Chaining


    java


    public class Car {


    // Instance variables


    String model;


    int year;


    String color;


    // Constructor 1: Initializes all fields


    public Car(String model, int year, String color) {


    this.model = model;


    this.year = year;


    this.color = color;


    }


    // Constructor 2: Calls Constructor 1 with default values


    public Car(String model) {


    this(model, 2022, "Black");  // Calls Constructor 1


    }


    // Method to display car information


    public void displayInfo() {


    System.out.println("Car Model: " + model);


    System.out.println("Car Year: " + year);


    System.out.println("Car Color: " + color);


    }


    }


    public class Main {


    public static void main(String[] args) {


    // Using Constructor 1


    Car myCar = new Car("Tesla", 2023, "Red");


    myCar.displayInfo();


    // Using Constructor 2 (constructor chaining)


    Car defaultCar = new Car("Honda");


    defaultCar.displayInfo();


    }


    }


    In the above example, the second constructor (Car(String model)) calls the first
    constructor (Car(String model, int year, String color)) by using  this(model,
    2022, "Black");. This is a neat way to avoid code duplication while providing
    flexibility in object initialization.


    * * *


    ## 5.4 Instance vs Static


    In Java, understanding the difference between instance and static is key to writing
    efficient, maintainable, and well-structured code. These two concepts deal with
    how variables and methods are accessed and managed within a class, and they determine
    whether the members belong to an instance of the class or to the class itself.
    Let’s dive into both, looking at when and why to use each type.


    * * *


    ### Instance Members


    Instance variables and instance methods are tied to a specific instance (or object)
    of a class. Every time a new object of a class is created, a fresh copy of these
    members is created.


    ●       Instance variables are unique to each object.


    ● Instance methods are tied to the individual object, meaning they can access
    and modify the instance variables of that particular object.


    In short, instance members are those that are specific to an object, and each
    object has its own copy of these members.


    #### Example: Instance Variables and Methods


    java


    public class Car {


    // Instance variables


    String model;


    int year;


    // Constructor to initialize instance variables


    public Car(String model, int year) {


    this.model = model;


    this.year = year;


    }


    // Instance method


    public void displayInfo() {


    System.out.println("Car Model: " + model);


    System.out.println("Car Year: " + year);


    }


    public static void main(String[] args) {


    // Creating instances of the Car class


    Car car1 = new Car("Tesla", 2023);


    Car car2 = new Car("Ford", 2022);


    // Calling instance methods on each object


    car1.displayInfo();


    car2.displayInfo();


    }


    }


    In this example:


    ●       The  Car class has instance variables model and  year. These are unique
    to each  Car object.


    ●       Each car object (car1,  car2) can have its own  model and  year.


    ● The  displayInfo() method is an instance method. It accesses the instance variables
    of the specific object calling it, and it works on the individual instance''s
    data.


    * * *


    ### Static Members


    Static members belong to the class rather than to any specific instance. When
    a member is declared as  static, it means there is only one copy of that member
    shared across all instances of the class. Static variables and methods can be
    accessed without creating an instance of the class.


    ●       Static variables are shared across all objects of the class.


    ● Static methods can be called without creating an object, but they can only directly
    access other static members (both variables and methods).


    Static members are particularly useful when you need to share data or methods
    across all instances of a class, or when you want to perform operations that don’t
    depend on the state of a specific object.


    #### Example: Static Variables and Methods


    java


    public class Car {


    // Instance variables


    String model;


    int year;


    // Static variable shared across all instances


    static int carCount = 0;


    // Constructor to initialize instance variables and increment carCount


    public Car(String model, int year) {


    this.model = model;


    this.year = year;


    carCount++; // Increment the static variable


    }


    // Instance method


    public void displayInfo() {


    System.out.println("Car Model: " + model);


    System.out.println("Car Year: " + year);


    }


    // Static method


    public static void displayCarCount() {


    System.out.println("Total number of cars: " + carCount);


    }


    public static void main(String[] args) {


    // Creating instances of the Car class


    Car car1 = new Car("Tesla", 2023);


    Car car2 = new Car("Ford", 2022);


    // Calling instance methods


    car1.displayInfo();


    car2.displayInfo();


    // Calling static method


    Car.displayCarCount();  // Notice no object is required to call static method


    }


    }


    In this example:


    ● carCount is a static variable that keeps track of the total number of  Car objects
    created. It is shared across all instances of  Car, so no matter how many  Car
    objects are created, there is always only one copy of this variable.


    ● displayCarCount() is a static method that prints the total number of cars. Notice
    that we can call  displayCarCount() directly from the class (Car.displayCarCount()),
    without needing to create an instance of  Car.


    ● Static variables and methods are commonly used for things like counters, configuration
    values, or utility methods that don’t depend on the instance''s state.


    * * *


    ### When to Use Instance vs Static


    Deciding whether to use instance or static members depends on the design and behavior
    of your class.


    ● Use instance variables and methods when the data or behavior is specific to
    each object. For example, if you have a class representing  Car, each car will
    likely have its own  model,  year, and other attributes that vary from car to
    car.


    ● Use static variables and methods when you need shared data or functionality
    that does not depend on the state of any specific object. For example, a  counter
    variable that tracks how many  Car objects have been created should be static,
    as this is a class-wide property, not a property of any single car.


    * * *


    ### Key Differences Between Instance and Static Members


    | Feature | Instance Members | Static Members |


    | Association | Belong to a specific object instance. | Belong to the class itself,
    shared across all instances. |


    | Access | Accessed through an object (instance). | Accessed through the class
    itself or via an object. |


    | Memory | Each object has its own copy of instance members. | Only one copy of
    static members exists, shared across all instances. |


    | Usage | For object-specific properties and behaviors. | For properties and behaviors
    that are shared across all objects. |


    | Keyword | Declared without the  static keyword. | Declared with the  static
    keyword. |


    * * *


    ### Combining Instance and Static


    Sometimes, you may need to combine instance and static members to solve a problem
    effectively. For instance, you might have an instance variable that stores individual
    object data and a static variable that tracks the total number of objects created.


    Here’s an example of how both can be combined effectively:


    java


    public class BankAccount {


    // Instance variables


    String accountHolder;


    double balance;


    // Static variable to track the total number of accounts


    static int totalAccounts = 0;


    // Constructor


    public BankAccount(String accountHolder, double balance) {


    this.accountHolder = accountHolder;


    this.balance = balance;


    totalAccounts++;  // Increment static variable when a new account is created


    }


    // Instance method to display account details


