  raw: 'In this section, we will walk through the process of building a simple console-based
    Java application. By the end of this chapter, you''ll have a functional system
    and understand the core concepts necessary to build more complex Java applications.
    For this example, we’ll be creating a Mini ATM System, but you can easily adapt
    the structure to a Library Management System or any other simple console-based
    application. This exercise will consolidate your understanding of Java’s core
    features such as object-oriented programming (OOP), input/output (I/O) operations,
    and basic control flow.


    ### Objectives


    In this project, we will:


    ●       Create a basic ATM simulation where users can check their balance, deposit
    money, and withdraw money.


    ●       Use object-oriented programming principles to organize the system.


    ●       Implement basic error handling for common ATM-related issues.


    ●       Provide a simple user interface in the console to interact with the system.


    ### Step 1: Setup and Basic Structure


    Let’s first create a class called  ATMSystem.java to house the main logic of our
    ATM system. We''ll also create a  BankAccount.java class to represent a bank account.
    This class will store account details like the balance, account holder''s name,
    and transaction methods (deposit and withdrawal).


    java


    import java.util.Scanner;


    public class ATMSystem {


    public static void main(String[] args) {


    // Create an instance of BankAccount with a sample balance


    BankAccount account = new BankAccount("John Doe", 1000.00);


    // Call the method to start the ATM system


    startATM(account);


    }


    private static void startATM(BankAccount account) {


    Scanner scanner = new Scanner(System.in);


    boolean exit = false;


    while (!exit) {


    System.out.println("\nATM Main Menu:");


    System.out.println("1\. Check Balance");


    System.out.println("2\. Deposit Money");


    System.out.println("3\. Withdraw Money");


    System.out.println("4\. Exit");


    System.out.print("Please choose an option: ");


    String choice = scanner.nextLine();


    switch (choice) {


    case "1":


    System.out.println("Balance: $" + account.getBalance());


    break;


    case "2":


    depositMoney(account, scanner);


    break;


    case "3":


    withdrawMoney(account, scanner);


    break;


    case "4":


    System.out.println("Thank you for using the ATM. Goodbye!");


    exit = true;


    break;


    default:


    System.out.println("Invalid option. Please try again.");


    }


    }


    scanner.close();


    }


    private static void depositMoney(BankAccount account, Scanner scanner) {


    System.out.print("Enter deposit amount: ");


    double amount = Double.parseDouble(scanner.nextLine());


    if (amount <= 0) {


    System.out.println("Deposit amount must be greater than zero.");


    } else {


    account.deposit(amount);


    System.out.println("Successfully deposited $" + amount);


    }


    }


    private static void withdrawMoney(BankAccount account, Scanner scanner) {


    System.out.print("Enter withdrawal amount: ");


    double amount = Double.parseDouble(scanner.nextLine());


    if (amount <= 0) {


    System.out.println("Withdrawal amount must be greater than zero.");


    } else if (amount > account.getBalance()) {


    System.out.println("Insufficient funds for this withdrawal.");


    } else {


    account.withdraw(amount);


    System.out.println("Successfully withdrew $" + amount);


    }


    }


    }


    * * *


    ### Step 2: The BankAccount Class


    The  BankAccount class is a simple class that stores details like account holder''s
    name and balance. It will also include methods to deposit and withdraw money,
    as well as a getter for the balance.


    java


    public class BankAccount {


    private String accountHolderName;


    private double balance;


    // Constructor to initialize account with a holder name and initial balance


    public BankAccount(String accountHolderName, double balance) {


    this.accountHolderName = accountHolderName;


    this.balance = balance;


    }


    // Getter for the balance


    public double getBalance() {


    return balance;


    }


    // Deposit method


    public void deposit(double amount) {


    balance += amount;


    }


    // Withdrawal method


    public void withdraw(double amount) {


    if (amount <= balance) {


    balance -= amount;


    } else {


    System.out.println("Error: Not enough funds.");


    }


    }


    }


    * * *


    Step 3: Understanding the Flow


    Here’s a breakdown of the application flow:


    1.  ATMSystem Class:


    ○ The  ATMSystem class contains the  main method where the program starts. It
    creates an instance of  BankAccount with an initial balance and passes it to the  startATM
    method to initiate the user interface.


    ○ The  startATM method displays a simple menu and lets the user choose an action
    (Check Balance, Deposit Money, Withdraw Money, or Exit). Based on the user’s choice,
    the appropriate method is called.


    2.  BankAccount Class:


    ○ The  BankAccount class represents the account. It has fields for the account
    holder’s name and balance.


    ○ The  deposit method increases the balance by the deposit amount, and the  withdraw
    method decreases the balance, ensuring there are sufficient funds before proceeding.


    3.  Deposit and Withdrawal:


    ○ For both deposit and withdrawal, the methods ensure that the entered amount
    is valid (greater than zero). If it’s invalid, a message is displayed.


    ○ If the withdrawal amount exceeds the current balance, the system will show an
    error message.


    ### Step 4: Testing the ATM System


    After running the  ATMSystem class, you should be able to interact with the ATM
    system via the console. The options you can try include:


    ●       Checking your balance.


    ●       Depositing money into your account.


    ●       Withdrawing money from your account.


    ●       Exiting the system.


    Here’s an example of what the user interaction could look like:


