    ## A Java Keywords and Syntax Cheat Sheet


    Java is a language rich with syntax rules and reserved keywords that help define
    the structure and behavior of your code. If you''re just getting started with
    Java, understanding the keywords is a crucial step. They form the backbone of
    the language and are the building blocks for creating Java applications. In this
    chapter, we''ll cover Java''s essential keywords and provide a concise syntax
    guide with practical examples to help you understand how to use them effectively.


    #### Java Keywords


    Java has 53 reserved keywords, each serving a specific purpose in the language.
    These keywords cannot be used as variable names, method names, or class names.
    Let’s break down these keywords into manageable sections and explore each one
    with examples to make their usage clear.


    | Keyword | Description | Example |


    | abstract | Declares an abstract class or method. Abstract classes cannot be
    instantiated directly and are used as a blueprint for other classes. | abstract
    class Animal { abstract void sound(); } |


    | assert | Used for debugging. It tests an expression and throws an exception
    if the expression is false. | assert x > 0 : "x is negative"; |


    | boolean | Defines a boolean data type that can hold true or false values. |
    boolean isActive = true; |


    | break | Exits from a loop or switch statement. | if (x > 10) break; |


    | byte | Defines an 8-bit signed integer data type. | byte b = 100; |


    | case | Defines a branch in a  switch statement. | switch (day) { case 1: System.out.println("Monday");
    } |'
