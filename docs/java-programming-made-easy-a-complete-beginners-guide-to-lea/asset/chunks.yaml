    # Chapter 8: Exception Handling


    Every programmer encounters errors—it''s part of the development journey. Some
    errors, like typos, are caught at compile-time, but others—such as dividing by
    zero or trying to open a file that doesn''t exist—happen at runtime. These runtime
    errors are known as exceptions.


    Java provides a powerful and structured way to deal with such exceptions so your
    program doesn’t crash unexpectedly. In this chapter, we’ll explore exception handling
    in Java using  try-catch,  finally,  throw, and custom exceptions. We’ll also
    end the chapter with a practical Safe File Reader App to see these concepts in
    action.


    * * *


    ## 8.1 Try-Catch Blocks


    Errors are part of software development, but that doesn’t mean your program has
    to crash when something unexpected happens. Java provides a robust exception handling
    mechanism, and the most foundational tool for this is the  try-catch block.


    This section will walk you through how  try-catch works, when to use it, and how
    to structure your code to handle errors gracefully. We''ll also discuss best practices
    and explore practical examples that show how to avoid common pitfalls.


    * * *


    ### What Is a Try-Catch Block?


    A  try-catch block allows you to wrap risky code—code that might throw an exception—and
    catch specific exceptions so that your application can respond appropriately rather
    than terminate unexpectedly.


    #### Basic Structure


    java


    try {


    // Code that might throw an exception


    } catch (ExceptionType e) {


    // Code to handle the exception


    }


    When the code inside the  try block throws an exception, Java immediately jumps
    to the  catch block, skipping any remaining lines inside  try.


    * * *


    ### Why Use Try-Catch?


    ●       To prevent your program from crashing due to unexpected errors.


    ●       To handle different types of errors specifically and meaningfully.


    ●       To allow your application to recover or provide user-friendly feedback.


    * * *


    ### Example 1: Handling ArithmeticException


    java


    public class BasicTryCatch {


    public static void main(String[] args) {


    int a = 10;


    int b = 0;


    try {


    // Risky operation


    int result = a / b;


    System.out.println("Result: " + result);


    } catch (ArithmeticException e) {


    // Handle division by zero


    System.out.println("Error: Cannot divide by zero.");


    }


    System.out.println("Program continues running.");


    }


    }


    #### Explanation:


    ●       a / b throws an  ArithmeticException since dividing by zero is illegal.


    ●       The catch block catches that specific exception and prints a helpful message.


    ●       The program does not terminate and continues executing after the catch
    block.


    * * *


    ### Catching Specific Exceptions


    You can catch specific exceptions to handle different error types appropriately.


    #### Example 2: Catching Multiple Exception Types


    java


    public class MultipleCatchExample {


    public static void main(String[] args) {


    String input = null;


    try {


    // May throw NullPointerException


    int length = input.length();


    // May throw ArithmeticException


    int result = 10 / 0;


    } catch (NullPointerException e) {


    System.out.println("Null value encountered. Please initialize the variable.");


    } catch (ArithmeticException e) {


    System.out.println("Arithmetic error occurred. Cannot divide by zero.");


    }


    }


