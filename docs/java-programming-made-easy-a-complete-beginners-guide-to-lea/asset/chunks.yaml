    ## 4.3 Method Overloading


    Method overloading is one of the most useful features in Java. It allows you to
    create multiple methods with the same name but different parameter lists. This
    is particularly helpful when you want to perform similar operations with varying
    inputs, making your code more flexible and readable.


    In this chapter, we will explore how method overloading works, how to implement
    it, and why it’s a powerful tool for developers. We''ll also dive into practical
    examples to make sure you fully understand how to leverage this feature in your
    own code.


    * * *


    ### What is Method Overloading?


    Method overloading occurs when you define multiple methods with the same name
    in the same class, but each method differs in the number or type of parameters
    it accepts. While the method name stays the same, Java differentiates between
    the methods based on the parameters passed to them. The return type, however,
    doesn''t help in differentiating overloaded methods — only the method signature,
    which includes the number, type, and order of parameters, matters.


    #### Why Use Method Overloading?


    1.  Improved Readability: Overloading keeps your code clean and readable, avoiding
    the need to come up with unique method names for similar tasks.


    2.  Code Reusability: You can reuse the same method name for related tasks, instead
    of creating separate methods for each task.


    3.  Flexibility: Overloading gives you the flexibility to handle different data
    types or numbers of arguments within a single method.


    * * *


    ### How to Overload a Method


    In Java, you can overload a method by changing the number of parameters, their
    types, or both. The key point to remember is that the parameter list must be different
    (in number, type, or order) for each overloaded version of the method.


    Here’s a basic example to demonstrate method overloading:


    java


    public class OverloadedMethods {


    // Method to add two integers


    public static int add(int num1, int num2) {


    return num1 + num2;


    }


    // Overloaded method to add three integers


    public static int add(int num1, int num2, int num3) {


    return num1 + num2 + num3;


    }


    // Overloaded method to add two doubles


    public static double add(double num1, double num2) {


    return num1 + num2;


    }


    public static void main(String[] args) {


    // Calling the overloaded methods


    int sum1 = add(3, 4);             // Calls the method with two int parameters


    int sum2 = add(1, 2, 3);          // Calls the method with three int parameters


    double sum3 = add(2.5, 3.5);      // Calls the method with two double parameters


    System.out.println("Sum of two integers: " + sum1);  // Output: 7


    System.out.println("Sum of three integers: " + sum2);  // Output: 6


    System.out.println("Sum of two doubles: " + sum3);  // Output: 6.0


    }


    }


