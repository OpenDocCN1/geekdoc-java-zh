    \ entry point of any Java program.\n- `System.out.println(\"Hello, Java!\")` prints\
    \ text to the console.\n\nYou can compile and run this using:\n\n```bash\njavac\
    \ HelloWorld.java\njava HelloWorld\n```\n\nIf you're using IntelliJ IDEA or VS\
    \ Code, just run the file using the built-in options after setting up the SDK.\n\
    \n### 3. Do the Hands-On Projects\n\nEach chapter ends with a project that ties\
    \ together what you’ve learned. These projects are carefully chosen to be simple\
    \ but practical, like building a calculator, a number guessing game, or a student\
    \ record system. These are not just academic exercises—they reflect the kind of\
    \ logic and structure you'll need for real-world applications.\n\n### 4. Use the\
