    \            System.out.println(\"Number: \" + i);\n        }\n    }\n}\n```\n\
    \n解释：\n\n- `int i = 1` 初始化循环变量。\n- `i <= 5` 是保持循环运行的条件。\n- `i++` 在每次迭代后增加变量。\n\
