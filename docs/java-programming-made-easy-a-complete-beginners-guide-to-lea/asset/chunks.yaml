    ● Mismatch between file name and class name: If your class is named  Main, your
    file must be named  Main.java.


    ●       Missing semicolon: Each statement in Java must end with a semicolon  ;.


    ●       Incorrect capitalization: Java is case-sensitive.  System must be capitalized.  system.out.println
    will result in a compilation error.


    * * *


    Expanding the Program: Adding a Second Line


    You can modify the program to print multiple lines:


    java


    public class Main {


    public static void main(String[] args) {


    System.out.println("Hello, World!");


    System.out.println("Welcome to Java Programming.");


    }


    }


    Output:


    css


    Hello, World!


    Welcome to Java Programming.


    This demonstrates how you can build your program line by line to add more functionality.


    * * *


    Good Practices from Day One


    ● Use meaningful class names: In real applications, use names that reflect the
    purpose, like  InvoiceManager or  StudentPortal.


    ● Keep code clean and readable: Indentation, consistent spacing, and comments
    help make your code easier to understand.


    ● Always test your code: Run your program after writing small parts of it to catch
    errors early.


    * * *


    # Chapter 2: Java Basics


    In this chapter, we’ll cover the essential building blocks of any Java program:
    variables, data types, operators, input/output, and coding style. These fundamentals
    are the backbone of your journey into Java programming. By the end, you’ll create
    your own basic calculator using what you’ve learned.


    * * *


    ## 2.1 Variables and Data Types


    Every Java program deals with data — numbers, text, boolean logic, and more. To
    work with this data, you need a way to store it in memory. That’s where variables
    come in. In this section, we’ll break down what variables are, how they’re used,
    and the various data types Java provides.


    * * *


    ## What is a Variable?


    A variable is simply a named storage location in your computer’s memory that holds
    a value. You give it a name, assign a value to it, and then refer to it by that
    name throughout your code.


    ### Variable Declaration Syntax


    java


    dataType variableName = value;


    ### Example:


    java


    int age = 30;


    String name = "Alice";


    double temperature = 22.5;


    In the above example:


    ●       int declares an integer variable  age with value  30.


    ●       String declares a text variable  name with value  "Alice".


    ●       double declares a decimal number  temperature with value  22.5.


    * * *


    ## Java’s Data Types


    Java has two broad categories of data types:


    ### 1\. Primitive Types


    These are the most basic data types and are not objects.


    | Type | Size (bits) | Description | Example |


    | byte | 8 | Very small integers (-128 to 127) | byte b = 100; |


    | short | 16 | Small integers | short s = 30000; |


    | int | 32 | Standard integers | int x = 200; |


    | long | 64 | Large integers | long l = 123456789L; |


    | float | 32 | Decimal numbers (less precision) | float f = 5.5f; |


    | double | 64 | Decimal numbers (high precision) | double d = 10.99; |


    | char | 16 | A single character | char c = ''A''; |


    | boolean | 1 | True or false | boolean active = true; |


    ### 2\. Reference Types


    These include objects and arrays. For now, the most commonly used reference type
    is  String.


    java


    String greeting = "Welcome to Java!";


    * * *


    ### Type Conversion (Casting)


    Java is statically typed, meaning every variable must have a declared type. Sometimes,
    you need to convert one type to another.


    ### Implicit Conversion (Widening)


    Happens automatically when converting to a larger type.


    java


    int x = 10;


    double y = x;  // Automatically converts int to double


    ### Explicit Conversion (Narrowing)


    Requires casting when going to a smaller type.


    java


    double a = 5.75;


    int b = (int) a;  // Manually casts double to int (b becomes 5)


    * * *


    ## Final Variables (Constants)


    Use the  final keyword to declare a variable whose value should not change.


    java


    final double PI = 3.14159;


    Trying to reassign  PI later will cause a compilation error.


    * * *


    ## Naming Conventions


    Following Java naming conventions helps improve readability:


    ●       Use camelCase for variables:  userAge,  maxSpeed.


    ●       Variable names should be meaningful:  totalPrice is better than  tp.


    ●       Avoid starting names with numbers or using reserved keywords (like  class,  int,  static).


    * * *


    ## Practical Examples


    Let’s write a short Java program demonstrating all basic types and how they behave:


    java


    public class DataTypesDemo {


    public static void main(String[] args) {


    int age = 25;


    double salary = 45600.75;


    char grade = ''B'';


    boolean isEmployed = true;


    String name = "Sophia";


    System.out.println("Name: " + name);


    System.out.println("Age: " + age);


    System.out.println("Salary: $" + salary);


    System.out.println("Grade: " + grade);


    System.out.println("Employed: " + isEmployed);


    // Demonstrating casting


    double height = 5.9;


    int heightInInt = (int) height;


    System.out.println("Height as int: " + heightInInt); // Outputs 5


    }


    }


    ### Explanation:


    ●       We declared variables of various types.


    ●       Printed them using  System.out.println().


    ●       Performed type casting from  double to  int.


    * * *


    ## Common Pitfalls to Avoid


    ●       Uninitialized variables: Java will not compile if you try to use a variable
    before initializing it.


    ●       Case sensitivity:  Name and  name are different.


    ●       Data loss: Casting from  double to  int loses decimal precision.


    * * *


    ## 2.2 Operators and Expressions


    In Java, operators are special symbols that perform operations on variables and
    values. When you combine variables, literals, and operators, you form expressions.
    Mastering operators and expressions is essential to building any logic in your
    programs.


    * * *


    ## Types of Operators in Java


    Java provides several types of operators:


    1.  Arithmetic Operators


    2.  Assignment Operators


    3.  Comparison (Relational) Operators


    4.  Logical Operators


    5.  Unary Operators


    6.  Bitwise Operators


    7.  Ternary Operator


    We’ll explore each with clear examples.


    * * *


    ### 1\. Arithmetic Operators


    Used to perform basic mathematical operations.


    | Operator | Description | Example |


    | + | Addition | a + b |


    | - | Subtraction | a - b |


    | * | Multiplication | a * b |


    | / | Division | a / b |


    | % | Modulus (remainder) | a % b |


    Example:


    java


    public class ArithmeticExample {


    public static void main(String[] args) {


    int a = 10, b = 3;


    System.out.println("a + b = " + (a + b)); // 13


    System.out.println("a - b = " + (a - b)); // 7


    System.out.println("a * b = " + (a * b)); // 30


    System.out.println("a / b = " + (a / b)); // 3 (integer division)


    System.out.println("a % b = " + (a % b)); // 1


    }


    }


    Note: When both operands are integers, division gives an integer result. Use  double
    for precise division.


    * * *


    ### 2\. Assignment Operators


    Used to assign values to variables.


    | Operator | Example | Meaning |


    | = | x = 5 | Assign 5 to x |


    | += | x += 2 | x = x + 2 |


    | -= | x -= 3 | x = x - 3 |


    | *= | x *= 4 | x = x * 4 |


    | /= | x /= 2 | x = x / 2 |


    | %= | x %= 2 | x = x % 2 |


    Example:


    java


    int x = 10;


    x += 5;  // x becomes 15


    x *= 2;  // x becomes 30


    System.out.println("Final value of x: " + x);


    * * *


    ### 3\. Comparison (Relational) Operators


    Used to compare two values. They return  true or  false.


    | Operator | Description | Example |


    | == | Equal to | a == b |


    | != | Not equal to | a != b |


    | > | Greater than | a > b |


    | < | Less than | a < b |


    | >= | Greater than or equal | a >= b |


    | <= | Less than or equal | a <= b |


    Example:


    java


    int age = 18;


    System.out.println(age >= 18); // true


    System.out.println(age != 21); // true


    * * *


    ### 4\. Logical Operators


    Used to combine multiple boolean expressions.


    | Operator | Description | Example |


    | && | Logical AND (both true) | a > 10 && a < 20 |


    | ` |  | ` |


    | ! | Logical NOT (negation) | !(a == 10) |


    Example:


    java


    boolean hasID = true;


    boolean isAdult = false;


    if (hasID && isAdult) {'
