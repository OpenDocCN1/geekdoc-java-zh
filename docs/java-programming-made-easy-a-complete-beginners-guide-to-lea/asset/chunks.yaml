    ), \"UTF-8\")\n            );\n            writer.write(\"Writing UTF-8 encoded\
    \ text.\");\n            writer.newLine();\n            writer.close();\n    \
    \        System.out.println(\"UTF-8 file written.\");\n        } catch (IOException\
    \ e) {\n            System.out.println(\"Error: \" + e.getMessage());\n      \
    \  }\n    }\n}\n```\n\n* * *\n\n## Hands-On Project: To-Do List App (Save to File)\n\
    \nThis hands-on project brings together everything we've learned about file handling.\
    \ We'll create a simple console-based To-Do List application that allows users\
    \ to add tasks, view all tasks, delete tasks, and save their list to a file. It's\
    \ practical, beginner-friendly, and lays the groundwork for more advanced apps\
    \ in the future.\n\n* * *\n\n### Objectives\n\nBy the end of this project, you’ll\
    \ understand how to:\n\n- Use `BufferedReader` and `Scanner` for user input.\n\
    - Use `FileWriter` and `BufferedWriter` to write tasks to a file.\n- Read saved\
    \ tasks from a file on startup.\n- Perform basic operations like add, delete,\
    \ and view tasks.\n\n* * *\n\n### Project Structure\n\nWe’ll build a single `ToDoApp.java`\
    \ file for simplicity.\n\nTasks will be saved to `tasks.txt` in the current directory.\n\
    \n* * *\n\n### Step 1: Setup and Imports\n\nStart by importing the necessary classes.\n\
    \n```java\nimport java.io.*;\nimport java.util.ArrayList;\nimport java.util.List;\n\
    import java.util.Scanner;\n```\n\n* * *\n\n### Step 2: Class and Main Method\n\
    \nWe'll define the main class and initialize necessary variables.\n\n```java\n\
    public class ToDoApp {\n    private static final String FILE_NAME = \"tasks.txt\"\
    ;\n    private static List<String> tasks = new ArrayList<>();\n\n    public static\
    \ void main(String[] args) {\n        loadTasks(); // Load tasks from file when\
    \ program starts\n        runApp();    // Start user interaction\n        saveTasks();\
    \ // Save tasks to file before exiting\n    }\n}\n```\n\n* * *\n\n### Step 3:\
    \ Load Tasks from File\n\nWe want to load tasks previously saved in `tasks.txt`.\n\
    \n```java\nprivate static void loadTasks() {\n    try (BufferedReader reader =\
    \ new BufferedReader(new FileReader(FILE_NAME))) {\n        String task;\n   \
    \     while ((task = reader.readLine()) != null) {\n            tasks.add(task);\n\
    \        }\n    } catch (IOException e) {\n        // File might not exist on\
    \ first run; no problem\n        System.out.println(\"No existing task file found.\
    \ Starting fresh.\");\n    }\n}\n```\n\n* * *\n\n### Step 4: Save Tasks to File\n\
    \n```java\nprivate static void saveTasks() {\n    try (BufferedWriter writer =\
