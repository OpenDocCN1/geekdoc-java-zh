    Car myCar = new Car();


    // Setting values for the object''s fields


    myCar.model = "Toyota";


    myCar.year = 2022;


    myCar.color = "red";


    // Calling methods on the object


    myCar.startEngine();


    myCar.stopEngine();


    }


    }


    In the  Main class:


    ●       The  myCar object is an instance of the  Car class.


    ●       We set the  model,  year, and  color fields of the  myCar object to specific
    values.


    ●       We then call the  startEngine() and  stopEngine() methods on the  myCar
    object to invoke behaviors.


    * * *


    ### Instance Variables vs. Local Variables


    In Java, variables can be classified into two main types:


    ● Instance Variables: These are variables defined inside a class but outside any
    methods. They represent the attributes of an object and each object has its own
    copy of these variables.


    ● Local Variables: These are variables defined inside methods, constructors, or
    blocks. They are only accessible within the method or block they are declared
    in.


    In our  Car class example, the variables  model,  year, and  color are instance
    variables because they are declared inside the class but outside any method. If
    you define a variable inside a method, like a loop or a function, that variable
    is a local variable and only accessible within that method.


    * * *


