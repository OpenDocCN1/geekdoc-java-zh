    ## Hands-On Project: Bank Account Class


    In this hands-on project, we will build a simple Bank Account class in Java. This
    class will manage bank accounts, allowing us to perform operations like depositing
    and withdrawing money, checking account balances, and displaying account details.
    We will utilize instance variables for account-specific information and static
    variables to track global statistics, such as the total number of accounts created.
    This project will give you a practical understanding of how to apply object-oriented
    programming concepts like classes, objects, instance variables, methods, and static
    members.


    Let''s dive right in and build the  BankAccount class step by step.


    * * *


    ### Step 1: Defining the BankAccount Class


    We''ll start by defining a class  BankAccount that will contain instance variables
    for the account holder''s name, balance, and a static variable to track the total
    number of accounts. We''ll also provide methods for depositing, withdrawing, and
    displaying account information.


    java


    public class BankAccount {


    // Instance variables for account details


    private String accountHolder;


    private double balance;


    // Static variable to track the total number of bank accounts


    static int totalAccounts = 0;


    // Constructor to initialize the account with an account holder and an initial
    balance


    public BankAccount(String accountHolder, double initialBalance) {


    this.accountHolder = accountHolder;


    this.balance = initialBalance;


    totalAccounts++;  // Increment the static variable each time a new account is
    created


    }


    // Method to deposit money into the account


    public void deposit(double amount) {


    if (amount > 0) {


    balance += amount;


    System.out.println("Deposited $" + amount + " into " + accountHolder + "''s account.");


    } else {


    System.out.println("Deposit amount must be positive.");


    }


    }


    // Method to withdraw money from the account


    public void withdraw(double amount) {


    if (amount > 0 && amount <= balance) {


    balance -= amount;


    System.out.println("Withdrew $" + amount + " from " + accountHolder + "''s account.");


    } else {


    System.out.println("Invalid withdrawal amount or insufficient funds.");


    }


    }


    // Method to display account information


    public void displayAccountInfo() {


    System.out.println("Account Holder: " + accountHolder);


    System.out.println("Balance: $" + balance);


    }


    // Static method to display the total number of accounts


    public static void displayTotalAccounts() {


    System.out.println("Total Accounts Created: " + totalAccounts);


    }


    }


    #### Explanation of the Code:


    ●       Instance Variables:


    ○ accountHolder: A string representing the name of the account holder.


    ○ balance: A double to store the account''s current balance.


    ●       Static Variable:


    ○ totalAccounts: A static variable to track the total number of bank accounts
    created. This variable is shared by all instances of the  BankAccount class.


    ●       Constructor:


    ○ The constructor takes two arguments,  accountHolder and  initialBalance, and
    initializes the instance variables. It also increments the  totalAccounts static
    variable each time a new account is created.


    ●       Deposit Method:


    ○ This method allows money to be deposited into the account. It checks if the
    amount is positive before adding it to the balance.


    ●       Withdraw Method:


    ○ This method allows money to be withdrawn from the account. It checks if the
    withdrawal amount is positive and if there are sufficient funds.


    ●       Display Method:


    ○ The  displayAccountInfo() method prints the account holder''s name and the current
    balance of the account.


    ●       Static Method:


    ○ The static method  displayTotalAccounts() prints the total number of accounts
    created, which is shared across all instances of the class.


    * * *


    ### Step 2: Testing the BankAccount Class


    Next, let’s create a few instances of the  BankAccount class and perform some
    operations on them, such as depositing money, withdrawing funds, and displaying
    account details.


