  trans: "\n方法重写在多态中起着重要作用，我们将在后面的章节中介绍这一内容。通过重写方法，你可以在子类中创建更特化的行为，同时仍使用父类中定义的相同方法签名。这确保了程序能够按预期运行，无论该对象属于哪个子类。\n\
    \n让我们深入研究方法重写，探索它的工作原理并查看一些实际示例。\n\n### 什么是方法重写？\n\n方法重写发生在子类为其父类中已经声明的方法提供新的实现时。子类中的这个新方法实现会“覆盖”父类中的实现。\n\
    \n关于方法重写，这里有几个需要记住的键要点：\n\n- **相同的方法签名**：子类中的方法名称、返回类型和参数必须与父类中的方法相同。\n- **`@Override`\
    \ 注解**：虽然是可选的，但强烈建议使用 `@Override` 注解。这有助于编译器检查你是否真的在重写一个方法，并确保方法签名没有错误。\n- **访问修饰符**：被重写方法的访问修饰符不能比父类方法更严格。例如，如果父类方法是\
    \ `public`，则重写的方法也必须是 `public`，不能是 `private`。\n\n### 方法重写的示例\n\n让我们考虑一个简单的示例来说说明方法重写在实践中是如何工作的。\n\
    \n```java\n// 父类\nclass Animal {\n    // 父类中的方法\n    public void sound() {\n \
    \       System.out.println(\"Animal makes a sound\");\n    }\n}\n\n// 子类\nclass\
    \ Dog extends Animal {\n    // 方法重写：在子类中提供特定的实现\n    @Override\n    public void\
    \ sound() {\n        System.out.println(\"Dog barks\");\n    }\n}\n\npublic class\
    \ Main {\n    public static void main(String[] args) {\n        // 创建 Animal 和\
    \ Dog 对象\n        Animal animal = new Animal();\n        Dog dog = new Dog();\n\
    \        // 对两个对象调用 sound 方法\n        animal.sound();  // 输出: Animal makes a sound\n\
    \        dog.sound();      // 输出: Dog barks\n    }\n}\n```\n\n#### 代码解释：\n\n1.\
    \ `Animal` 类：\n   - `Animal` 类中的 `sound()` 方法打印一条通用消息：“Animal makes a sound.”\n\
    2. `Dog` 类：\n   - `Dog` 类继承了 `Animal` 并重写了 `sound()` 方法。这次，它打印“Dog barks”，而不是父类的通用消息。\n\
    3. 在 `Main` 类中：\n   - 我们同时创建了 `Animal` 和 `Dog` 的对象。当我们对 `Animal` 对象调用 `sound()`\
    \ 方法时，它打印来自 `Animal` 类的消息。然而，当我们对 `Dog` 对象调用 `sound()` 方法时，它打印来自 `Dog` 类的重写后的消息。\n\
    \n### `@Override` 注解\n\n虽然不是强制，但使用 `@Override` 注解有几个益处：\n\n- 如果方法签名错误，它可以帮助编译器捕获错误，确保你正在正确地重写父类中的方法。\n\
    - 它通过明确标出该方法旨在重写父类方法，从而提高了代码的可读性。\n\n让我们来看一个方法签名错误且 `@Override` 注解帮助我们捕获错误的示例：\n\
    \n```java\nclass Animal {\n    public void sound() {\n        System.out.println(\"\
    Animal makes a sound\");\n    }\n}\n\nclass Dog extends Animal {\n    // 错误的方法签名：它应该与父类的方法签名匹配\n\
    \    @Override\n    public void makeSound() { // 这是一个错误：方法名应该是 \"sound\"\n   \
    \     System.out.println(\"Dog barks\");\n    }\n}\n\npublic class Main {\n  \
    \  public static void main(String[] args) {\n        Dog dog = new Dog();\n  \
    \      dog.sound();  // 由于由于 Dog 类中方法名错误，这将导致编译时错误\n    }\n}\n```\n\n在这种情况下，`@Override`\
    \ 注解导致了编译时错误，因为 `makeSound()` 方法与父类中 `sound()` 方法的签名不匹配。如果没有注解，代码将通过编译，但你会遇到意外之外的运行时行为。\n\
    \n### 为什么要使用方法重写？\n\n在面向对象的设计中，你应该使用方法重写有几个原因：\n\n1. **多态**：重写开启了多态，允许你使用父类引用来指向子类对象。当你想要在统一处理不同对象的同时仍保持它们各自的行为时，这至关重要。\n\
    \n   让我们来看一个多态运行的示例：\n\n```java\nclass Animal {\n    public void sound() {\n \
    \       System.out.println(\"Animal makes a sound\");\n    }\n}\n\nclass Dog extends\
    \ Animal {\n    @Override\n    public void sound() {\n        System.out.println(\"\
    Dog barks\");\n    }\n}\n\nclass Cat extends Animal {\n    @Override\n    public\
    \ void sound() {\n        System.out.println(\"Cat meows\");\n    }\n}\n\npublic\
    \ class Main {\n    public static void main(String[] args) {\n        Animal myDog\
    \ = new Dog();\n        Animal myCat = new Cat();\n        myDog.sound(); // 输出:\
    \ Dog barks\n        myCat.sound(); // 输出: Cat meows\n    }\n}\n```\n\n在这个在这个示例中：\n\
    - 我们创建了 `Animal` 类型的引用，但赋值给了 `Dog` 和 `Cat` 对象。\n- 调用了 `sound()` 方法。由于使用了重写，每个对象都会调用它们自己的\
    \ `sound()` 方法。\n- 这展示了多态允许我们通过共同接口（Animal）处理对象，同时执行它们特定的行为。\n\n2. **行为的定制**：方法重写允许子类根据需要定制继承方法的行为。这样，你可以在父类中保留通用功能，只在需要时重写方法。\n\
    \n### 方法重写的规则\n\n在 Java 中重写方法时，有以下几个重要的规则：\n\n1. **相同的方法签名**：子类中的方法名称、返回类型和参数必须与父类中的方法相同。\n\
    2. **访问修饰符**：被重写方法的访问修饰符不能比父类方法更严格。例如，如果父类方法是 `public`，则重写的方法也必须是 `public`。但是访问修饰符可以更宽松，例如从\
    \ `protected` 到 `public`，或从 `default` 到 `protected`。\n3. **返回类型**：重写方法的返回类型必须与父方法的返回类型相同或为子类型（这被称为协变返回）。\n\
    4. **异常处理**：重写方法抛出的检查异常不能大于父方法。\n\n### 方法重写与 final 方法\n\n在 Java 中，如果一个方法被声明为 `final`，则它不能被重写。`final`\
    \ 关键字通常用于防止子类修改行为，以确保方法的功能在子类中保持不变。\n\n```java\nclass Animal {\n    public final\
    \ void sound() {\n        System.out.println(\"Animal makes a sound\");\n    }\n\
    }\n\nclass Dog extends Animal {\n    // 这将导致编译错误\n    @Override\n    public void\
    \ sound() {\n        System.out.println(\"Dog barks\");\n    }\n}\n```\n\n在这种情况下，`Animal`\
    \ 类中的 `sound()` 方法被标记为 `final`，意味着它不能在 `Dog` 类中被重写。\n\n"
- fmt: '

    In this chapter, we will break down polymorphism into its components, explore
    how it works in Java, and see how it can be applied in real-world scenarios. We’ll
    also look at two main types of polymorphism: compile-time polymorphism (also known
    as method overloading) and runtime polymorphism (achieved through method overriding).


    ### What is Polymorphism?


    The word "polymorphism" comes from Greek, meaning "many forms." In the context
    of OOP, it allows one method or function to work with different types of objects.
    The main idea is to define a method or operation that can behave differently depending
    on the type of object that is being used.


    There are two main types of polymorphism in Java:


    1.  Compile-time Polymorphism (Method Overloading): This occurs when two or more
    methods in the same class have the same name but differ in the number or types
    of parameters. The method that gets executed is determined at compile time based
    on the method signature.


    2.  Runtime Polymorphism (Method Overriding): This occurs when a subclass provides
    a specific implementation of a method that is already defined in its superclass.
    The method that gets executed is determined at runtime based on the type of the
    object being referred to, not the type of the reference variable.


    ### Compile-time Polymorphism (Method Overloading)


    Compile-time polymorphism, also known as method overloading, occurs when a class
    has multiple methods with the same name but different parameter lists. The method
    to be called is resolved at compile time by the Java compiler.


    Let’s look at an example of method overloading:


    ```java

    class Calculator {


    // Method to add two integers


    public int add(int a, int b) {


    return a + b;

    }


    // Overloaded method to add three integers


    public int add(int a, int b, int c) {


    return a + b + c;

    }


    // Overloaded method to add two doubles


    public double add(double a, double b) {

    return a + b;

    }


    }


    public class Main {


    public static void main(String[] args) {

    Calculator calc = new Calculator();

    System.out.println(calc.add(2, 3));      // Calls the add(int, int) method

    System.out.println(calc.add(2, 3, 4));      // Calls the add(int, int, int) method

    System.out.println(calc.add(2.5, 3.5));      // Calls the add(double, double)
    method

    }


    }

    ```


    #### Explanation:


    1.  The `Calculator` class defines three methods with the same name, `add()`,
    but they have different parameter types and/or numbers of parameters.

    2.  In the `Main` class, we create an instance of `Calculator` and call the `add()`
    method with different sets of parameters.

    3.  The Java compiler resolves the correct method to call at compile time based
    on the method signature (i.e., number and type of parameters).


    This is an example of compile-time polymorphism because the method to be executed
    is determined at the time of compilation.


    ### Runtime Polymorphism (Method Overriding)


    Runtime polymorphism, or method overriding, allows subclasses to provide their
    own implementation of a method that is already defined in the superclass. This
    is achieved using the `@Override` annotation.


    The decision about which version of the method to execute is made at runtime based
    on the object type, not the reference type. This enables different behaviors for
    the same method name, depending on the object that the method is being invoked
    on.


    Let’s see how runtime polymorphism works:


    ```java

    class Animal {


    // Method in the parent class


    public void sound() {

    System.out.println("Animal makes a sound");

    }


    }


    class Dog extends Animal {


    // Method overriding: Providing specific implementation in the child class


    @Override

    public void sound() {

    System.out.println("Dog barks");

    }

    }


    class Cat extends Animal {


    // Method overriding: Providing specific implementation in the child class


    @Override

    public void sound() {

    System.out.println("Cat meows");

    }

    }


    public class Main {


    public static void main(String[] args) {

    Animal myAnimal = new Animal();  // Parent class reference

    Animal myDog = new Dog();      // Child class reference

    Animal myCat = new Cat();      // Child class reference

    myAnimal.sound();  // Outputs: Animal makes a sound

    myDog.sound();  // Outputs: Dog barks

    myCat.sound();  // Outputs: Cat meows

    }


    }

    ```


    #### Explanation:


    1.  The `Animal` class defines a `sound()` method.

    2.  The `Dog` and `Cat` classes override the `sound()` method to provide their
    own specific implementations.

    3.  In the `Main` class, we create `Animal`, `Dog`, and `Cat` objects. Even though
    the reference variables are of type `Animal`, the Java runtime determines which
    `sound()` method to invoke based on the actual object type (i.e., `Dog` or `Cat`).

    4.  This is runtime polymorphism because the method to be executed is decided
    at runtime.


    #### Key Insight:


    Polymorphism is particularly useful when you want to treat different objects uniformly
    but still maintain their individual behaviors. In the example above, we can call
    the `sound()` method on any object.


    ### Why Use Polymorphism?


    Polymorphism offers several advantages in object-oriented programming:


    1.  Flexibility: Polymorphism allows objects of different classes to be treated
    as objects of a common superclass, making the code more flexible and extensible.

    2.  Reusability: Polymorphism helps reduce code duplication. By using polymorphism,
    you can write more generic code that works with any object in a hierarchy.

    3.  Maintainability: By decoupling code that interacts with specific classes and
    making it work with general classes, polymorphism improves maintainability. Changes
    to a subclass’s behavior (through method overriding) don’t require changes to
    the rest of the codebase.


    ### Polymorphism in Action


    To illustrate the power of polymorphism in real-world scenarios, consider a software
    system that processes different types of financial transactions: deposits, withdrawals,
    and transfers. Each transaction type can be treated as a subclass of a common
    superclass. Polymorphism would allow the system to handle each type uniformly,
    while still invoking specific behaviors for each.


    Here’s a basic example:


    ```java

    abstract class Transaction {


    abstract void process();  // Abstract method that will be overridden

    }


    class Deposit extends Transaction {


    @Override

    void process() {

    System.out.println("Processing deposit");

    }

    }


    class Withdrawal extends Transaction {


    @Override

    void process() {

    System.out.println("Processing withdrawal");

    }

    }


    class Transfer extends Transaction {


    @Override

    void process() {

    System.out.println("Processing transfer");

    }

    }


    public class Main {


    public static void main(String[] args) {


    Transaction[] transactions = {


    new Deposit(),

    new Withdrawal(),

    new Transfer()


    };


    // Polymorphism in action: each transaction is processed based on its type

    for (Transaction transaction : transactions) {


    transaction.process();  // The correct process() method is called for each subclass

    }


    }


    }

    ```


    #### Explanation:


    1.  The `Transaction` class is abstract and contains an abstract `process()` method.

    2.  The `Deposit`, `Withdrawal`, and `Transfer` classes extend `Transaction` and
    provide their own implementation of `process()`.

    3.  In the `Main` class, we create an array of `Transaction` objects and loop
    through them, calling the `process()` method on each. Despite using a common reference
    type (`Transaction`), each transaction type invokes its own specific implementation.

