    # Chapter 5: Object-Oriented Programming in Java\n\nIn this chapter, we’ll dive\
    \ into the world of Object-Oriented Programming (OOP) in Java. OOP is a programming\
    \ paradigm that organizes software design around data, or objects, rather than\
    \ functions and logic. It’s the foundation of Java and is used to build flexible,\
    \ reusable, and maintainable code. We’ll explore the main concepts of OOP and\
    \ walk you through practical examples to make it all clear.\n\n***\n\n## 5.1 Introduction\
    \ to OOP (Object-Oriented Programming)\n\nObject-Oriented Programming (OOP) is\
    \ one of the most popular programming paradigms today. In this section, we will\
    \ explore the foundational principles of OOP, how they apply to Java, and why\
    \ understanding them is key to becoming a proficient Java developer. At its core,\
    \ OOP is all about modeling real-world entities and their interactions. It allows\
    \ you to organize software around objects, which are instances of classes.\n\n\
    ### Key Principles of OOP\n\nOOP is based on four principles:\n\n1. Encapsulation\n\
