    int result = (a + b) * 2;


    System.out.println("Result: " + result); // Outputs 30


    * * *


    ## Operator Precedence and Associativity


    Java evaluates expressions based on operator precedence and associativity.


    ●       *,  /, and  % have higher precedence than  + and  -.


