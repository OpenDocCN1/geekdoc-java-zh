    ○ We also create a  Random object to generate a random number between 1 and 100.


    ○ The  secretNumber is generated using  random.nextInt(100) + 1 to ensure the
    number is between 1 and 100, inclusive.


    3.  Guessing Loop:


    ○ The game runs in a  while loop that continues until the guess is correct.


    ○ Inside the loop, we prompt the user for a guess, compare it to the secret number,
