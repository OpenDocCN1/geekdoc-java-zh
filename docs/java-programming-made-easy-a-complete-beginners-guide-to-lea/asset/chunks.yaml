  trans: "\n继承是面向对象编程（OOP）的基础概念之一。它允许你基于现有类创建新类，从而促进代码复用并在类之间之间建立天然的层级结构。通过扩展一个类，子类（子类）会从父类继承字段和方法，使你能够在现有功能的基础上进行构建和扩展。\n\
    \n在本章中，我们将探索 Java 中继承是如何运作的、`super` 关键字的作用，以及你如何结合使用这两者来创建更高效、模块化的代码。\n\n***\n\
    \n### 什么是继承？\n\n继承允许一个类（子类）从另一个类（父类）继承属性和方法。子类可以：\n\n- 使用父类的方法和字段。\n- 重写父类方法以为子类提供特定的行为。\n\
    - 添加自己的字段和方法。\n\n在 Java 中，一个类可以使用 `extends` 关键字继承另一个类。\n\n#### 为什么要使用继承？\n\n-\
    \ **代码复用性**：通过继承父类，你避免了代码的重复。当你有多个具有相似功能但需要细微修改的类时，这一点尤为有用。\n- **可维护性**：当你需要对共享功能进行更改时，可以在父类中进行修改，更改将自动传播到所有子类。\n\
    - **多态性**：继承实现了多态，允许你将不同类的对象视为同一个公共父类的对象。\n\n***\n\n### 基础继承示例\n\n让我们从一个简单的示例开始，演示继承是如何运作的。我们将创建一个名为\
    \ `Animal` 的父类和一个名为 `Dog` 的子类。\n\n```java\n// 父类\nclass Animal {\n    // 字段\n\
    \    private String name;\n\n    // 构造函数\n    public Animal(String name) {\n \
    \       this.name = name;\n    }\n\n    // 方法\n    public void speak() {\n   \
    \     System.out.println(name + \" makes a sound.\");\n    }\n\n    // 获取名称的 getter\n\
    \    public String getName() {\n        return name;\n    }\n}\n\n// 子类\nclass\
    \ Dog extends Animal {\n    // 构造函数\n    public Dog(String name) {\n        //\
    \ 调用父类构造函数\n        super(name);\n    }\n\n    // 重写 speak 方法\n    @Override\n\
    \    public void speak() {\n        System.out.println(getName() + \" barks.\"\
    );\n    }\n}\n\npublic class Main {\n    public static void main(String[] args)\
    \ {\n        // 创建 Dog 的对象\n        Dog dog = new Dog(\"Buddy\");\n        //\
    \ 调用 speak 方法\n        dog.speak();  // 输出: Buddy barks.\n    }\n}\n```\n\n####\
    \ 代码解释：\n\n1. `Animal` 类：\n   - `Animal` 类拥有一个私有字段 `name` 和一个用于初始化它的构造函数。`speak()`\
    \ 方法简单地打印一条表示动物正在发出声音的消息。\n2. `Dog` 类：\n   - `Dog` 类继承了 `Animal` 类，这意味着它继承了 `name`\
    \ 字段和 `speak()` 方法。\n   - 在 `Dog` 构造函数中，我们使用 `super(name)` 调用来调用 `Animal` 构造函数。这确保了\
    \ `name` 字段被正确初始化。\n   - `Dog` 类重写了 `speak()` 方法，为狗提供了更具体的实现，使其打印“barks”而不是通泛的“makes\
    \ a sound”。\n3. 在 `Main` 类中：\n   - 我们创建了一个 `Dog` 对象并调用它的 `speak()` 方法。由于 `Dog`\
    \ 类重写了 `speak()` 方法，它会打印“Buddy barks.”。\n\n***\n\n### `super` 关键字\n\n`super` 关键字用于引用父类。它在\
    \ Java 中有两个主要用途：\n\n1. 调用父类构造函数：\n   - `super()` 调用允许你调用父类的构造函数。当父类没有默认构造函数，或者当你想用特定值初始化父类时，这一点尤为有用。\n\
    2. 访问父类方法和字段：\n   - 如果子类重写了某个方法，你仍然可以使用 `super.methodName()` 访问父类的该方法版本。同样，你可以使用\
    \ `super.fieldName` 访问父类字段。\n\n#### 示例：使用 `super` 调用父类方法\n\n让我们修改之前的示例，演示如何使用\
    \ `super` 调用父类方法：\n\n```java\n// 父类\nclass Animal {\n    private String name;\n\
    \    public Animal(String name) {\n        this.name = name;\n    }\n    public\
    \ void speak() {\n        System.out.println(name + \" makes a sound.\");\n  \
    \  }\n    public void eat() {\n        System.out.println(name + \" eats food.\"\
    );\n    }\n    public String getName() {\n        return name;\n    }\n}\n\n//\
    \ 子类\nclass Dog extends Animal {\n    public Dog(String name) {\n        super(name);\
    \ // 调用父类构造函数\n    }\n\n    // 重写 speak 方法\n    @Override\n    public void speak()\
    \ {\n        System.out.println(getName() + \" barks.\");\n    }\n\n    // 使用\
    \ super 调用父类 eat 方法\n    public void eat() {\n        super.eat();  // 调用父类的 eat\
    \ 方法\n        System.out.println(getName() + \" eats dog food.\");\n    }\n}\n\
    \npublic class Main {\n    public static void main(String[] args) {\n        Dog\
    \ dog = new Dog(\"Buddy\");\n        // 调用重写的 speak 方法\n        dog.speak(); \
    \ // 输出: Buddy barks.\n        // 调用父类的 eat 方法\n        dog.eat();\n    }\n}\n\
    ```\n\n#### 代码解释：\n\n1. `Dog` 类：\n   - `speak()` 方法被重写了。\n   - `eat()` 方法调用 `super.eat()`，执行父类的\
    \ `eat` 方法并添加狗特有的逻辑。\n2. 在 `Main` 类中：\n   - 我们对 `Dog` 对象调用 `speak()` 和 `eat()`，结果是重写行为和父类行为。\n\
    \n***\n\n### 方法重写 (Overriding)\n\n方法重写发生在子类对其父类中已定义的方法提供特定实现时。在上面的示例中，我们重写了 `Dog`\
    \ 类中的 `speak()` 方法。\n\n这里是重写的规则回顾：\n\n1. 方法签名（名称、返回类型和参数）在父子类中必须相同。\n2. 子类中重写方法的访问修饰符不能比父类中的方法严格。\n\
    3. `@Override` 注解是可选的但强烈建议使用。它可以帮助确保你确实重写了父类的方法而不是定义了一个新方法。\n\n#### 示例：重写 vs 重载\n\
    \n为了澄清重写和重载的区别，请考虑以下示例：\n\n```java\n// 父类\nclass Animal {\n    public void sound()\
    \ {\n        System.out.println(\"Animal makes a sound\");\n    }\n    // 方法重载：相同名称，不同参数\n\
    \    public void sound(String type) {\n        System.out.println(\"Animal makes\
    \ a \" + type + \" sound\");\n    }\n}\n\n// 子类\nclass Dog extends Animal {\n\
    \    @Override\n    public void sound() {\n        System.out.println(\"Dog barks\"\
    );\n    }\n}\n\npublic class Main {\n    public static void main(String[] args)\
    \ {\n        Animal animal = new Animal();\n        animal.sound(); // 输出: Animal\
    \ makes a sound\n        animal.sound(\"loud\");  // 输出: Animal makes a loud sound\n\
    \n        Dog dog = new Dog();\n        dog.sound();  // 输出: Dog barks\n    }\n\
    }\n```\n\n在这个示例中：\n\n- **方法重写**：`Dog` 类重写了 `Animal` 类的 `sound()` 方法。\n- **方法重载**：`Animal`\
    \ 类有两个 `sound()` 方法——一个没有参数，另一个接受一个 `String` 参数。\n\n"
- fmt: "\nMethod overriding plays a significant role in polymorphism, which we will\
    \ cover in later chapters. By overriding methods, you can create more specialized\
    \ behaviors in subclasses while still using the same method signature defined\
    \ in the superclass. This ensures that the program behaves as expected, regardless\
    \ of which subclass the object belongs to.\n\nLet’s dive into method overriding,\
    \ explore how it works, and look at some practical examples.\n\n### What is Method\
    \ Overriding?\n\nMethod overriding happens when a subclass provides a new implementation\
    \ for a method that is already declared in its parent class. This new method implementation\
    \ in the subclass \"overrides\" the one in the parent class.\n\nHere are the key\
    \ points to remember about method overriding:\n\n- **Same Method Signature**:\
    \ The method in the subclass must have the same name, return type, and parameters\
    \ as the method in the parent class.\n- **The `@Override` Annotation**: Although\
    \ optional, it is highly recommended to use the `@Override` annotation. This helps\
    \ the compiler check if you’re actually overriding a method and ensures there\
    \ are no mistakes in the method signature.\n- **Access Modifiers**: The overridden\
    \ method cannot have a more restrictive access modifier than the parent class\
    \ method. For example, if the parent method is `public`, the overridden method\
    \ must also be `public`, not `private`.\n\n### Example of Method Overriding\n\n\
    Let's consider a simple example to illustrate how method overriding works in practice.\n\
    \n```java\n// Parent class\nclass Animal {\n    // Method in the parent class\n\
    \    public void sound() {\n        System.out.println(\"Animal makes a sound\"\
    );\n    }\n}\n\n// Child class\nclass Dog extends Animal {\n    // Method overriding:\
    \ Providing specific implementation in the child class\n    @Override\n    public\
    \ void sound() {\n        System.out.println(\"Dog barks\");\n    }\n}\n\npublic\
    \ class Main {\n    public static void main(String[] args) {\n        // Creating\
    \ objects of Animal and Dog\n        Animal animal = new Animal();\n        Dog\
    \ dog = new Dog();\n        // Calling sound method on both objects\n        animal.sound();\
    \  // Outputs: Animal makes a sound\n        dog.sound();      // Outputs: Dog\
    \ barks\n    }\n}\n```\n\n#### Explanation of the Code:\n\n1. The `Animal` class:\n\
    \   - The `sound()` method in the `Animal` class prints a generic message: \"\
    Animal makes a sound.\"\n2. The `Dog` class:\n   - The `Dog` class extends `Animal`\
    \ and overrides the `sound()` method. This time, it prints \"Dog barks\" instead\
    \ of the generic message from the parent class.\n3. In the `Main` class:\n   -\
    \ We create objects of both `Animal` and `Dog`. When we call the `sound()` method\
    \ on the `Animal` object, it prints the message from the `Animal` class. However,\
    \ when we call the `sound()` method on the `Dog` object, it prints the overridden\
    \ message from the `Dog` class.\n\n### The `@Override` Annotation\n\nAlthough\
    \ not required, using the `@Override` annotation provides several benefits:\n\n\
    - It helps the compiler catch errors if the method signature is incorrect, ensuring\
    \ that you are correctly overriding a method from the parent class.\n- It improves\
    \ code readability by clearly signaling that the method is meant to override a\
    \ parent class method.\n\nLet’s look at an example where the method signature\
    \ is incorrect, and the `@Override` annotation helps us catch the mistake:\n\n\
    ```java\nclass Animal {\n    public void sound() {\n        System.out.println(\"\
    Animal makes a sound\");\n    }\n}\n\nclass Dog extends Animal {\n    // Incorrect\
    \ method signature: It should match the parent class method signature\n    @Override\n\
    \    public void makeSound() { // This is an error: method name should be \"sound\"\
    \n        System.out.println(\"Dog barks\");\n    }\n}\n\npublic class Main {\n\
    \    public static void main(String[] args) {\n        Dog dog = new Dog();\n\
    \        dog.sound();  // This will cause a compile-time error due to the incorrect\
    \ method name in the Dog class\n    }\n}\n```\n\nIn this case, the `@Override`\
    \ annotation causes a compile-time error because the method `makeSound()` doesn’t\
    \ match the signature of the `sound()` method in the parent class. Without the\
    \ annotation, the code would compile, but you would encounter an unexpected runtime\
    \ behavior.\n\n### Why Use Method Overriding?\n\nThere are several reasons why\
    \ you should use method overriding in object-oriented design:\n\n1. **Polymorphism**:\
    \ Overriding enables polymorphism, which allows you to use a parent class reference\
    \ to refer to objects of child classes. This is crucial when you want to treat\
    \ different objects uniformly while still maintaining their individual behaviors.\n\
    \n   Let’s look at an example of polymorphism in action:\n\n```java\nclass Animal\
    \ {\n    public void sound() {\n        System.out.println(\"Animal makes a sound\"\
    );\n    }\n}\n\nclass Dog extends Animal {\n    @Override\n    public void sound()\
    \ {\n        System.out.println(\"Dog barks\");\n    }\n}\n\nclass Cat extends\
    \ Animal {\n    @Override\n    public void sound() {\n        System.out.println(\"\
    Cat meows\");\n    }\n}\n\npublic class Main {\n    public static void main(String[]\
    \ args) {\n        Animal myDog = new Dog();\n        Animal myCat = new Cat();\n\
    \        myDog.sound();  // Outputs: Dog barks\n        myCat.sound();  // Outputs:\
    \ Cat meows\n    }\n}\n```\n\nIn this example:\n- We created references of type\
    \ `Animal`, but assigned them to `Dog` and `Cat` objects.\n- The `sound()` method\
    \ is called on both objects. Because we used method overriding, each object calls\
    \ its own version of the `sound()` method.\n- This demonstrates how polymorphism\
    \ allows us to handle different types through a common interface (Animal), while\
    \ still executing their specific behaviors.\n\n2. **Customization of Behavior**:\
    \ Method overriding allows subclasses to customize the behavior of inherited methods\
    \ to fit their needs. This way, you can keep the common functionality in the parent\
    \ class, and only override methods when necessary.\n\n### Rules of Method Overriding\n\
    \nHere are a few important rules to remember when overriding methods Java:\n\n\
    1. **Same Method Signature**: The method in the subclass must have the same name,\
    \ return type, and parameters as the method in the parent class.\n2. **Access\
    \ Modifiers**: The overridden method in the subclass cannot have a more restrictive\
    \ access modifier than the parent class method. For example, if the parent method\
    \ is `public`, the overridden method must also be `public`. However, the access\
    \ modifier can be more permissive, e.g., `protected` to `public`, or `default`\
    \ to `protected`.\n3. **Return Type**: The return type of the overriding method\
    \ must be the same as or a subtype of the return type of the parent method (this\
    \ is called covariant return type).\n4. **Exception Handling**: The overriding\
    \ method cannot throw checked exceptions that are broader than those thrown by\
    \ the parent method.\n\n### Method Overriding and Final Methods\n\nIn Java, if\
    \ a method is declared as `final`, it cannot be overridden. The `final` keyword\
    \ is often used to prevent subclass behavior modification when you want to ensure\
    \ that the method’s functionality remains unchanged across subclasses.\n\n```java\n\
    class Animal {\n    public final void sound() {\n        System.out.println(\"\
    Animal makes a sound\");\n    }\n}\n\nclass Dog extends Animal {\n    // This\
    \ will result in a compile-time error\n    @Override\n    public void sound()\
    \ {\n        System.out.println(\"Dog barks\");\n    }\n}\n```\n\nIn this case,\
    \ the `sound()` method in the `Animal` class is marked `final`, meaning it cannot\
    \ be overridden in the `Dog` class.\n"
