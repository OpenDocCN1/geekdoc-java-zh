    \n现在你准备好了环境，是时候编写你的第一个程序了。\n\n### 逐步步骤：在 IntelliJ IDEA 中创建项目\n\n1. 打开 IntelliJ\
    \ IDEA。\n2. New Project（新建项目）。\n3. 选择 Java 类型。\n4. 设置 SDK 为 `21`。\n5. 为你的项目命名为\
    \ `FirstApp`。\n6. 点击 Finish（完成）。\n\n现在，在 `src` 目录下：\n1. 右键点击 New → Java Class。\n\
    2. 将类命名为 `Main`。\n\n### 你的 Java 程序：Hello World\n\n让我们编写第一个完整可运行的程序：\n\n```java\n\
    // 文件：Main.java\n// 定义了一个名为 Main 的类\npublic class Main {\n    // main 方法是程序的入口\n\
    \    public static void main(String[] args) {\n        // 在控制台打印消息\n        System.out.println(\"\
    Hello, World!\");\n    }\n}\n```\n\n### 解析与解释\n\n- `public class Main`：此行声明了一个名为\
    \ `Main` 的类。在 Java 中，每个应用程序至少有一个类，且文件名必须与类相同（例如 `Main.java`）。\n- `public static\
    \ void main(String[] args)`：这是 main 方法，程序由此开始。\n    - `public`：公开可见。\n    - `static`：属于类而不是对象（你不需要创建对象即可运行它）。\n\
    \    - `void`：该方法没有返回值。\n    - `String[] args`：此参数允许程序接收命令行参数（你现在不需要，但它是标准要求）。\n\
    - `System.out.println(\"Hello, World!\");`：这是一个向控制台打印文本的语句。\n    - `System` 是一个内置\
    \ Java 类。\n    - `out` 是一个静态字段（`PrintStream` 的实例）。\n    - `println()` 是一个输出字符串并换跟换行的的方法。\n\
    \n### 编译并运行程序\n\n如果你使用 IntelliJ IDEA：\n1. 点击 `main` 方法旁边或右上角的绿色播放按钮。\n2. 你将在下方的控制台中看到输出：`Hello,\
    \ World!`\n\n如果你使用终端：\n\n```bash\njavac Main.java // 编译文件\njava Main       //\
    \ 运行编译后的程序\n```\n"
- fmt: "\n# Common Mistakes and How to Avoid Them\n\n- **Mismatch between file name\
    \ and class name**: If your class is named `Main`, your file must be named `Main.java`.\n\
    - **Missing semicolon**: Each statement in Java must end with a semicolon `;`.\n\
    - **Incorrect capitalization**: Java is case-sensitive. `System` must be capitalized.\
    \ `system.out.println` will result in a compilation error.\n\n## Expanding the\
    \ Program: Adding a Second Line\n\nYou can modify the program to print multiple\
    \ lines:\n\n```java\npublic class Main {\n    public static void main(String[]\
    \ args) {\n        System.out.println(\"Hello, World!\");\n        System.out.println(\"\
    Welcome to Java Programming.\");\n    }\n}\n```\n\nOutput:\n\n```css\nHello, World!\n\
    Welcome to Java Programming.\n```\n\nThis demonstrates how you can build your\
    \ program line by line to add more functionality.\n\n## Good Practices from Day\
    \ One\n\n- **Use meaningful class names**: In real applications, use names that\
    \ reflect the purpose, like `InvoiceManager` or `StudentPortal`.\n- **Keep code\
    \ clean and readable**: Indentation, consistent spacing, and comments help make\
    \ your code easier to understand.\n- **Always test your code**: Run your program\
    \ after writing small parts of it to catch errors early.\n\n# Chapter 2: Java\
    \ Basics\n\nIn this chapter, we’ll cover the essential building blocks of any\
