    ## 4.1 Creating and Calling Methods


    Methods are one of the core building blocks of any Java program. They allow you
    to organize your code, making it modular, reusable, and easy to maintain. In this
    section, we will explore how to create methods, call them, and understand the
    basic concepts behind them. You''ll get to know the syntax, structure, and how
    to use methods effectively.


    * * *


    ### What is a Method?


    In Java, a method is a block of code that performs a specific task. You can think
    of a method as a function in other programming languages, designed to handle a
    particular operation, such as printing a message, performing a calculation, or
    even interacting with user input.


    ### Creating a Method


    A method consists of three primary components:


    1.  Return Type: Specifies the type of value the method will return. If the method
    does not return any value, we use  void.


    2.  Method Name: The name of the method, which is used to call it.


    3.  Method Parameters: The values you pass to the method when you call it. Parameters
    are optional; a method can have none, one, or multiple parameters.


    Here''s the general structure of a method:


    java


    returnType methodName(parameters) {


    // Code to execute


    }


    #### Example: Simple Method to Print a Message


    Let’s create a simple method that prints a greeting message to the console.


    java


    public class HelloWorld {


    // Method to print a greeting message


    public static void greet() {


    System.out.println("Hello, welcome to learning Java!");


    }


    public static void main(String[] args) {


    // Calling the greet() method


    greet();  // This will call the greet() method and print the message


    }


    }


    Explanation:


    ●       The method  greet() has a return type of  void, meaning it does not return
    any value.


    ●       The method is called inside the  main() method, which is the entry point
    of the program.


    ●       When we run this code, it outputs:


    css


    Hello, welcome to learning Java!


    ### Calling a Method


    Once you have defined a method, you can call it from anywhere within your class,
    provided it’s in scope. To call a method, you use its name, followed by parentheses  ().


    There are two primary types of method calls:


    1.  Static Method Call: When you call a method that is defined with the  static
    keyword.


    2.  Instance Method Call: When you call a method that belongs to an instance of
    a class (i.e., a method that is not static).


    #### Example: Calling a Method


    Consider the following method that adds two integers and returns the sum:


    java


    public class Calculator {


    // Method to add two numbers and return the result


    public static int add(int num1, int num2) {


    return num1 + num2;


    }


    public static void main(String[] args) {


    // Calling the add() method and storing the result in a variable


    int result = add(10, 5);


    System.out.println("The sum is: " + result);  // Output: 15


    }


    }


    Explanation:


    ●       We define a method called  add() that takes two  int parameters:  num1
    and  num2.


    ●       It returns their sum, which is of type  int.


    ●       In the  main() method, we call  add(10, 5) and store the result in the  result
    variable.


    ●       The output printed is:


    python


    The sum is: 15


    * * *


    ### Returning a Value from a Method


    Methods can return values that can be used elsewhere in your program. To do this,
    you specify the return type in the method signature, and use the  return keyword
    to return a value.


    In the previous example, the method  add() returns the sum of two numbers. The
    type of the returned value must match the return type specified in the method
    declaration (in this case,  int).


    If a method does not need to return a value, you use  void as the return type,
    which means the method performs some action but doesn''t return anything.


    * * *


    ### Method Parameters


    Method parameters allow you to pass data into a method so it can work with that
    data. Parameters are declared within the parentheses  () of the method definition.


    #### Example: Using Parameters in a Method


    Let’s create a method that accepts parameters for the first name and last name
    of a person and then prints a personalized greeting.


    java


    public class PersonalizedGreeting {


    // Method to print a personalized greeting


    public static void greet(String firstName, String lastName) {


    System.out.println("Hello, " + firstName + " " + lastName + "!");


    }


    public static void main(String[] args) {


    // Calling the greet() method with arguments


    greet("John", "Doe");  // This will print: "Hello, John Doe!"


    }


    }


    Explanation:


    ●       The method  greet() takes two parameters:  firstName and  lastName, both
    of type  String.


    ●       When calling the method, we pass the values  "John" and  "Doe" as arguments.


    ●       The output of this code will be:


    Hello, John Doe!


    * * *


    ### Method Signature


    The method signature consists of the method''s name and its parameter list. It
    is used by Java to identify a method uniquely. The return type is not part of
    the method signature.


    For example:


    ●       public static int add(int num1, int num2) is a method signature where:


    ○   add is the method name.


    ○ (int num1, int num2) is the parameter list.


    Java does not allow two methods in the same class to have the same method signature,
    even if the return type is different. This is why method overloading (which we
    will discuss later) requires that the parameter lists differ in number or type,
    not just return type.


