- fmt: "\nYou can use both relative and absolute paths in your file operations.\n\n\
    - Relative path: `\"example.txt\"` refers to a file in the project's root directory.\n\
    - Absolute path: `\"/Users/yourname/Documents/example.txt\"` is the full path\
    \ to a specific file.\n\n```java\nFileWriter writer = new FileWriter(\"/Users/jane/Documents/log.txt\"\
    , true);\n```\n\nBe sure to handle platform-specific path separators (`\\` for\
    \ Windows, `/` for macOS/Linux) or use the `File` class to build paths portably.\n\
    \n## Best Practices\n\n- Always close file streams using `close()` or try-with-resources\
    \ to avoid memory leaks.\n- Catch exceptions like `IOException` to handle file\
    \ access issues gracefully.\n- Prefer `BufferedWriter` or `BufferedReader` for\
    \ large files (covered in the next section).\n- Use relative paths during development\
    \ for better portability.\n\n## Chapter 9.2 BufferedReader and Scanner\n\nWhen\
    \ working with text files or user input in Java, performance and flexibility are\
    \ key. While `FileReader` and `FileWriter` are great for simple use cases, they\
    \ can be inefficient when reading large files or processing line-by-line data.\
    \ This is where `BufferedReader` and `Scanner` come in.\n\nIn this chapter, we'll\
    \ explore both classes, explain when to use each, and show you practical examples\
    \ you can use in your own applications.\n\n### Why BufferedReader and Scanner?\n\
    \nBoth `BufferedReader` and `Scanner` are used to read text, but they serve slightly\
    \ different purposes:\n\n- `BufferedReader` is designed for fast reading of text\
    \ files, especially when reading large blocks or lines of text.\n- `Scanner` is\
    \ more flexible and powerful when you need to parse input or read formatted data\
    \ from a file or user input.\n\nLet’s look at both in detail.\n\n### Reading Files\
    \ with BufferedReader\n\nThe `BufferedReader` class reads text from a character-input\
    \ stream and buffers the characters to enable efficient reading of lines or characters.\
    \ It wraps around other readers like `FileReader`.\n\n#### Example: Reading a\
    \ File Line-by-Line\n\n```java\nimport java.io.BufferedReader;\nimport java.io.FileReader;\n\
    import java.io.IOException;\n\npublic class BufferedReaderExample {\n    public\
    \ static void main(String[] args) {\n        try {\n            // Open file using\
    \ FileReader, wrap with BufferedReader\n            BufferedReader reader = new\
    \ BufferedReader(new FileReader(\"example.txt\"));\n            String line;\n\
    \            // Read each line until end of file\n            while ((line = reader.readLine())\
    \ != null) {\n                System.out.println(line);\n            }\n     \
    \       // Close reader to release system resources\n            reader.close();\n\
    \        } catch (IOException e) {\n            System.out.println(\"An error\
    \ occurred while reading: \" + e.getMessage());\n        }\n    }\n}\n```\n\n\
    Explanation:\n\n- `readLine()` reads one line at a time, stopping at newline characters.\n\
    - The buffered approach means fewer direct disk access operations, which improves\
    \ performance.\n\n#### Advantages of BufferedReader\n\n- Efficient for large files.\n\
    - Can read entire lines with `readLine()`.\n- Simple API with good performance.\n\
    \n### Reading Input with Scanner\n\nThe `Scanner` class is part of the `java.util`\
    \ package and is ideal for parsing data, whether from files or the keyboard. You\
    \ can scan input line by line, word by word, or even number by number.\n\n####\
    \ Example: Reading User Input\n\n```java\nimport java.util.Scanner;\n\npublic\
    \ class ScannerUserInputExample {\n    public static void main(String[] args)\
    \ {\n        Scanner scanner = new Scanner(System.in); // Read from standard input\n\
    \        System.out.print(\"Enter your name: \");\n        String name = scanner.nextLine();\
    \ // Reads a full line\n        System.out.print(\"Enter your age: \");\n    \
    \    int age = scanner.nextInt(); // Reads an integer\n        System.out.println(\"\
    Welcome, \" + name + \". You are \" + age + \" years old.\");\n        scanner.close();\n\
    \    }\n}\n```\n\nExplanation:\n\n- `nextLine()`: Reads entire lines.\n- `nextInt()`,\
    \ `nextDouble()`, etc.: Read specific types.\n- `System.in`: Standard input stream\
    \ (console).\n\n#### Example: Reading from a File Using Scanner\n\n```java\nimport\
    \ java.io.File;\nimport java.io.FileNotFoundException;\nimport java.util.Scanner;\n\
    \npublic class ScannerFileExample {\n    public static void main(String[] args)\
    \ {\n        try {\n            File file = new File(\"example.txt\");\n     \
    \       Scanner scanner = new Scanner(file);\n            // Read and print each\
    \ line\n            while (scanner.hasNextLine()) {\n                String line\
    \ = scanner.nextLine();\n                System.out.println(line);\n         \
    \   }\n            scanner.close();\n        } catch (FileNotFoundException e)\
    \ {\n            System.out.println(\"File not found: \" + e.getMessage());\n\
    \        }\n    }\n}\n```\n\nExplanation:\n\n- The `Scanner` class reads from\
    \ a `File`.\n- `hasNextLine()` checks for more data.\n\n### Comparing BufferedReader\
    \ vs Scanner\n\n| Feature | BufferedReader | Scanner |\n| :--- | :--- | :--- |\n\
    | Performance | Faster for large files | Slower, not buffered |\n| Line-by-line\
    \ Reading | Yes (`readLine()`) | Yes (`nextLine()`) |\n| Token Parsing | No |\
    \ Yes (`nextInt()`, `nextDouble()`) |\n| Input Source | Readers only | Keyboard,\
    \ files, etc. |\n| Ideal Use Case | Efficient file reading | User input |\n\n\
    #### When to Use What\n\n- Use `BufferedReader` when you want fast line-by-line\
    \ reading from file.\n- Use `Scanner` when you need to parse different data.\n\
    \n### Handling Character Encoding\n\nBoth `BufferedReader` and `Scanner` use the\
    \ platform's default encoding unless specified. For UTF-8 encoded files, wrap\
    \ the reader using `InputStreamReader`.\n\n```java\nBufferedReader reader = new\
    \ BufferedReader(\n    new InputStreamReader(new FileInputStream(\"example.txt\"\
    ), \"UTF-8\")\n);\n```\nThis ensures consistent behavior across platforms.\n\n\
    ## Chapter 9.3 FileWriter and BufferedWriter\n\nWriting text to files is a core\
    \ part of many applications, whether you're logging data, saving user preferences,\
    \ or exporting reports. In Java, `FileWriter` and `BufferedWriter` are the go-to\
    \ classes for outputting text efficiently and reliably. In this chapter, we’ll\
    \ dive into both, compare their performance, and walk through examples.\n\n###\
    \ FileWriter: The Basics\n\n`FileWriter` is a character stream class used to write\
    \ to files. It writes directly to the file and is easy to use when you just want\
    \ to write a few lines of text.\n\n#### Syntax\n\n```java\nFileWriter writer =\
    \ new FileWriter(\"output.txt\");\n```\n\nThis creates a file called `output.txt`\
