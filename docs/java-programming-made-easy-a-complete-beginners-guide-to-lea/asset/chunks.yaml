    parameter list.


    ○ The first version accepts two  int parameters.


    ○ The second version accepts three  int parameters.


    ○ The third version accepts two  double parameters.


    ● When calling  add(), Java will choose the correct version based on the number
    and types of the arguments passed.


    * * *


    ### Rules for Overloading Methods


    While method overloading is powerful, there are a few important rules to keep
    in mind:


    Different Number of Parameters: You can overload a method by changing the number
    of parameters in the method signature.


    java


    public static int multiply(int a, int b) {


    return a * b;


    }


    public static int multiply(int a, int b, int c) {


    return a * b * c;


    }


    Different Type of Parameters: You can overload a method by changing the type of
    parameters.


    java


    public static double add(double a, double b) {


    return a + b;


    }


    public static int add(int a, int b) {


    return a + b;


    }


    Same Number and Type of Parameters, Different Order: Overloading can also occur
    when the parameter types are the same but in a different order.


    java


    public static void printDetails(String name, int age) {


    System.out.println("Name: " + name + ", Age: " + age);


    }


    public static void printDetails(int age, String name) {


    System.out.println("Age: " + age + ", Name: " + name);


    }


    * * *


    ### Overloading with Different Return Types


    While you might expect that Java would allow you to overload methods based on
    return type, that’s actually not possible. The return type does not differentiate
    overloaded methods. The methods must differ in their parameter list for overloading
    to work.


    This example will not compile:


    java


    public static int add(int num1, int num2) {


    return num1 + num2;


    }


    public static double add(int num1, int num2) {  // Error: The method signature
    is the same!


    return num1 + num2;


    }


    Even though the return type is different (int vs  double), both methods still
    have the same parameter list (int num1, int num2), so this will result in a compile-time
    error.


    * * *


    ### Practical Example: Method Overloading in Action


    Let’s look at a more practical example where method overloading can come in handy.
    Suppose we are developing a program that calculates the perimeter of different
    shapes: a rectangle, a square, and a circle. We can use method overloading to
    define separate methods for calculating the perimeter of each shape.


    java


    public class ShapePerimeter {


    // Method to calculate the perimeter of a rectangle


    public static int perimeter(int length, int width) {


    return 2 * (length + width);


    }


    // Overloaded method to calculate the perimeter of a square


    public static int perimeter(int side) {


    return 4 * side;


    }


    // Overloaded method to calculate the perimeter of a circle


    public static double perimeter(double radius) {


    return 2 * Math.PI * radius;


    }


    public static void main(String[] args) {


    // Calculate the perimeter of different shapes


    int rectanglePerimeter = perimeter(5, 10); // Rectangle: 2 * (5 + 10)


    int squarePerimeter = perimeter(4);        // Square: 4 * 4


    double circlePerimeter = perimeter(7.5);   // Circle: 2 * π * 7.5


    System.out.println("Rectangle Perimeter: " + rectanglePerimeter);  // Output:
    30


    System.out.println("Square Perimeter: " + squarePerimeter);        // Output:
    16


    System.out.println("Circle Perimeter: " + circlePerimeter);        // Output:
    47.12388980384689


    }


    }


    Explanation:


    ●       We defined three overloaded methods, all named  perimeter(), to handle
    the perimeter calculation for different shapes:


    ○ A rectangle, which takes two  int values (length and  width).


    ○ A square, which takes a single  int value (side).


    ○ A circle, which takes a  double value (radius).


    ● Depending on the type and number of arguments, Java automatically calls the
    correct version of the method.


    * * *


    ## Hands-On Project: Unit Converter App


    In this chapter, we’ll apply everything we’ve learned so far to create a practical
    application: a Unit Converter. This simple app will allow users to convert between
    different units of measurement, such as length, weight, and temperature. By the
    end of this project, you’ll have a deeper understanding of how to use methods,
    loops, conditionals, and user input in Java.


    * * *


    ### What Will the App Do?


    The Unit Converter app will allow the user to:


    ●       Convert distances (e.g., kilometers to miles).


    ●       Convert weights (e.g., kilograms to pounds).


    ●       Convert temperatures (e.g., Celsius to Fahrenheit).


    We’ll focus on a console-based version of the app, but the structure can be extended
    into a GUI-based app in the future.


    * * *


