    \  public static void main(String[] args) {\n        BankAccount myAccount = new\
    \ BankAccount(\"Alice\", 1000.0);\n        myAccount.deposit(500.0);\n       \
    \ myAccount.withdraw(200.0);\n        myAccount.display();\n    }\n}\n```\n\n\
    ---\n\n这份备查表在您刚开始学习或需要快速回顾 Java 基础元素时是一份很棒的。随着经验的增加，这些关键字和语法模式将成为本能，但随手可用非常有帮助。继续构建和测试小程序以强化这些概念。\n\
    \n## B. 推荐的 IDE 快捷键\n\n当你花更多时间编写 Java 代码时，你会很快发现开发环境可以加快你的速度，也可以拖慢你的速度。提高效率的最有效方法之一是掌握\
    \ IDE 的快捷键。无论你使用的是 IntelliJ IDEA、Eclipse 还是 Visual Studio Code (VS Code)，掌握正确的快捷键都能帮助更快地编写整洁的代码、更高效地调试并轻松地导航项目。\n\
