    \          this.age = age;\n        } else {\n            System.out.println(\"\
    Age cannot be negative.\");\n        }\n    }\n\n    // Public method to display\
    \ the person's information\n    public void displayInfo() {\n        System.out.println(\"\
    Name: \" + name + \", Age: \" + age);\n    }\n}\n```\n\n#### Explanation of the\
    \ Code:\n\n1. **Private Fields**:\n   - The `name` and `age` fields are marked\
    \ as `private`, meaning they cannot be accessed directly from outside the class.\n\
    \   - This ensures the internal state of the `Person` class is protected and prevents\
    \ any unwanted external modifications.\n2. **Public Getter and Setter Methods**:\n\
    \   - The getter methods `getName()` and `getAge()` are `public`, which allows\
    \ external classes to retrieve the values of `name` and `age` without directly\
    \ accessing the fields.\n   - The setter methods `setName()` and `setAge()` allow\
    \ external classes to modify these fields, but with some control. For example,\
    \ the `setAge()` method ensures that the age cannot be set to a negative value,\
    \ which is a simple form of validation.\n3. **Display Method**:\n   - The `displayInfo()`\
    \ method is a `public` method that displays the values of `name` and `age`. It\
    \ allows other classes to print the state of a `Person` object in a controlled\
    \ manner.\n\n### Why Use Getters and Setters?\n\nUsing getters and setters serves\
    \ several important purposes:\n\n- **Encapsulation**: By making fields `private`\
    \ and providing access through public methods, we can control how those fields\
    \ are accessed and modified. This ensures that changes to the internal state of\
    \ the object are always done in a controlled and predictable way.\n- **Validation**:\
    \ Setters allow you to add validation logic. In our example, the `setAge()` method\
    \ prevents setting a negative value for `age`. Without setters, any code could\
    \ directly modify the fields, bypassing any validation rules.\n- **Flexibility**:\
    \ If the internal implementation of the class changes, such as if we switch from\
    \ storing the `age` as an `int` to a `Date` object, the getter and setter methods\
    \ provide a layer of abstraction. External code that uses the `Person` class doesn't\
    \ need to know about the internal implementation; it just calls the getter and\
    \ setter methods.\n\n### Example: Using Getters and Setters in Action\n\nLet's\
    \ use the `Person` class to create an object and interact with its data using\
    \ the getter and setter methods.\n\n```java\npublic class Main {\n    public static\
    \ void main(String[] args) {\n        // Create a new Person object\n        Person\
    \ person = new Person(\"John\", 25);\n        // Display the initial information\n\
    \        person.displayInfo(); // Output: Name: John, Age: 25\n\n        // Change\
    \ the person's name and age using setters\n        person.setName(\"Jane\");\n\
    \        person.setAge(30);\n        // Display the updated information\n    \
    \    person.displayInfo(); // Output: Name: Jane, Age: 30\n\n        // Attempt\
    \ to set a negative age\n        person.setAge(-5); // Output: Age cannot be negative.\n\
    \    }\n}\n```\n\n#### Explanation of the Main Class:\n\n1. **Creating a Person\
    \ Object**:\n   - A new `Person` object is created using the constructor, initializing\
    \ `name` to \"John\" and `age` to 25.\n2. **Displaying Information**:\n   - We\
    \ call `displayInfo()` to print the `name` and `age`.\n3. **Changing Information\
    \ Using Setters**:\n   - The `setName()` and `setAge()` methods are used to update\
    \ the `name` and `age` fields. These changes are applied through the setter methods,\
    \ ensuring that any necessary validation (like the check for negative age) is\
    \ performed.\n4. **Validation in Action**:\n   - When we attempt to set a negative\
    \ age, the setter method prevents it and prints a message \"Age cannot be negative.\"\
    \n\n***\n\n#### Best Practices for Using Access Modifiers and Getters/Setters\n\
    \n1. **Prefer `private` for Fields**: Always mark class fields as `private` to\
    \ prevent external access and ensure encapsulation. This ensures that the internal\
    \ state of the class cannot be modified directly by other classes, which could\
    \ introduce bugs or inconsistencies.\n2. **Use `public` Getters and Setters**:\
    \ Provide getter and setter methods to allow controlled access to the fields.\
    \ These methods allow you to perform checks, transformations, or additional logic\
    \ when getting or setting values.\n3. **Keep Setters Simple**: Setters should\
    \ ideally only be used for validation or simple transformations. If a method involves\
    \ complex logic, it may be better placed in a different method rather than the\
    \ setter.\n4. **Avoid Excessive Getters/Setters**: If a field doesn't need to\
    \ be accessed or modified outside the class, don't create getters and setters\
    \ for it. This reduces unnecessary exposure and keeps the class design cleaner\
    \ and more maintainable.\n\n***\n\n## 6.2 Inheritance and `super`\n"
