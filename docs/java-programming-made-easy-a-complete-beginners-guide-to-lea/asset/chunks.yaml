    \n* *\n\n# 第 1 章：Java 入门\n\n## 1.1 什么是 Java？\n\nJava 是一种高级、面向对象且平台无关的编程语言，由 Sun\
    \ Microsystems 公司于 1995 年开发（现归 Oracle 骨文所有）。它被广泛用于构建桌面应用程序、Web 应用程序、移动应用（尤其是 Android）以及企业系统。\n\
    \nJava 最强大的特性之一是其“编写一次，随运行”的哲学。Java 代码被编译成字节码，并在 Java 虚拟机（`JVM`）上运行。这意味着你可以在一个操作系统（如\
    \ Windows）上编写 Java 程序，并在无需任何更改的情况下在另一个操作系统（如 macOS 或 Linux）上运行。\n\n### Java 的主要特性：\n\
    \n- **面向对象**：Java 使用对象和类来逻辑化组织代码。\n- **平台无关**：`JVM` 抽象了底层的操作系统。\n- **强类型**：你必须显式声明变量类型。\n\
    - **丰富的标准库**：Java 自带了一系列内置 API。\n- **被广泛采用**：用于从金融、电信到游戏和嵌入式系统的各个行业。\n\n从本质上说，Java\
    \ 是成熟、健且经过实检验的。得益于性能、安全性和广泛适用性的结合，它仍然是全球最流行的语言之一。\n\n* *\n\n## 1.2 为什么今天学习学习 Java？\n\
    \n即使在使用了几十年后，Java 仍然是最相关且需求量最大的编程语言之一。以下是它仍然是一门优秀学习语言的原因：\n\n1. **职业机会**：Java\
    \ 广泛用于企业应用、银行系统、Android 开发和大规模后端系统。许多世界 500 强公司依赖 Java 构建其核心基础设施。\n2. **强大的社区和生态系统**：全球有数百万开发者，Java\
    \ 拥有庞大的支持社区、开源工具和丰富的文档——这让初学者更容易找到帮助和资源。\n3. **Android 开发**：Java（以及 Kotlin）是 Android\
    \ 应用开发的主要语言之一。如果你对构建移动应用感兴趣，Java 仍然具有很高的相关性。\n4. **其他语言的基础**：学习 Java 有助于为在面向对象设计、类型安全和结构化错误处理等编程原则方面建立坚实的基础。这使得以后学习其他语言（如\
    \ Kotlin、Scala 或 C#）变得更容易。\n5. **企业级性能**：Java 快速、可靠且可扩展。这就是为什么它是构建大规模 Web 服务、后端\
    \ API 和高并发交易系统的默认选择。\n\n### 近期数据快照 (2025)：\n\n- Java 始终在 TIOBE 指数和 Stack Overflow\
    \ 开发者调查中位列前三。\n- 有超过 800 万开发者活跃使用 Java。\n- Google、Amazon、Netflix 和 IBM 等公司广泛使用\
    \ Java。\n\n* *\n\n## 1.3 安装 Java 和 IntelliJ IDEA（或 VS Code）\n\n在我们编写任何代码之前，让我们设置你的开发环境。你需要两个工具：\n\
