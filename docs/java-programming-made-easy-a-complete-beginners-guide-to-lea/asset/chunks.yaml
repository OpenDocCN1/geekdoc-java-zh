    解释：\n- 方法 `calculateAverage()` 接收三个参数。\n- 它返回三个数字的平均值。\n\n```csharp\nThe average\
    \ is: 20.0\n```\n"
- fmt: "\n- The `add()` method is overloaded three times, each with a different parameter\
    \ list.\n- The first version accepts two `int` parameters.\n- The second version\
    \ accepts three `int` parameters.\n- The third version accepts two `double` parameters.\n\
    - When calling `add()`, Java will choose the correct version based on the number\
    \ and types of the arguments passed.\n\n## Rules for Overloading Methods\n\nWhile\
    \ method overloading is powerful, there are a few important rules to keep in mind:\n\
    \n### Different Number of Parameters\nYou can overload a method by changing the\
    \ number of parameters in the method signature.\n\n```java\npublic static int\
    \ multiply(int a, int b) {\n    return a * b;\n}\n\npublic static int multiply(int\
    \ a, int b, int c) {\n    return a * b * c;\n}\n```\n\n### Different Type of Parameters\n\
    You can overload a method by changing the type of parameters.\n\n```java\npublic\
    \ static double add(double a, double b) {\n    return a + b;\n}\n\npublic static\
    \ int add(int a, int b) {\n    return a + b;\n}\n```\n\n### Same Number and Type\
    \ of Parameters, Different Order\nOverloading can also occur when the parameter\
    \ types are the same but in a different order.\n\n```java\npublic static void\
    \ printDetails(String name, int age) {\n    System.out.println(\"Name: \" + name\
    \ + \", Age: \" + age);\n}\n\npublic static void printDetails(int age, String\
    \ name) {\n    System.out.println(\"Age: \" + age + \", Name: \" + name);\n}\n\
    ```\n\n## Overloading with Different Return Types\n\nWhile you might expect that\
    \ Java would allow you to overload methods based on return type, that’s actually\
    \ not possible. The return type does not differentiate overloaded methods. The\
    \ methods must differ in their parameter list for overloading to work.\n\nThis\
    \ example will not compile:\n\n```java\npublic static int add(int num1, int num2)\
    \ {\n    return num1 + num2;\n}\n\npublic static double add(int num1, int num2)\
    \ { // Error: The method signature is the same!\n    return num1 + num2;\n}\n\
    ```\n\nEven though the return type is different (`int` vs `double`), both methods\
    \ still have the same parameter list (`int num1`, `int num2`), so this will result\
    \ in a compile-time error.\n\n## Practical Example: Method Overloading in Action\n\
    \nLet’s look at a more practical example where method overloading can come in\
    \ handy. Suppose we are developing a program that calculates the perimeter of\
    \ different shapes: a rectangle, a square, and a circle. We can use method overloading\
    \ to define separate methods for calculating the perimeter of each shape.\n\n\
    ```java\npublic class ShapePerimeter {\n    // Method to calculate the perimeter\
    \ of a rectangle\n    public static int perimeter(int length, int width) {\n \
    \       return 2 * (length + width);\n    }\n\n    // Overloaded method to calculate\
    \ the perimeter of a square\n    public static int perimeter(int side) {\n   \
    \     return 4 * side;\n    }\n\n    // Overloaded method to calculate the perimeter\
    \ of a circle\n    public static double perimeter(double radius) {\n        return\
    \ 2 * Math.PI * radius;\n    }\n\n    public static void main(String[] args) {\n\
    \        // Calculate the perimeter of different shapes\n        int rectanglePerimeter\
    \ = perimeter(5, 10); // Rectangle: 2 * (5 + 10)\n        int squarePerimeter\
    \ = perimeter(4);        // Square: 4 * 4\n        double circlePerimeter = perimeter(7.5);\
    \    // Circle: 2 * π * 7.5\n\n        System.out.println(\"Rectangle Perimeter:\
    \ \" + rectanglePerimeter);  // Output: 30\n        System.out.println(\"Square\
    \ Perimeter: \" + squarePerimeter);      // Output: 16\n        System.out.println(\"\
    Circle Perimeter: \" + circlePerimeter);      // Output: 47.12388980384689\n \
    \   }\n}\n```\n\n**Explanation:**\n- We defined three overloaded methods, all\
    \ named `perimeter()`, to handle the perimeter calculation for different shapes:\n\
    \    - A rectangle, which takes two `int` values (`length` and `width`).\n   \
    \ - A square, which takes a single `int` value (`side`).\n    - A circle, which\
    \ takes a `double` value (`radius`).\n- Depending on the type and number of arguments,\
    \ Java automatically calls the correct version of the method.\n\n## Hands-On Project:\
    \ Unit Converter App\n\nIn this chapter, we’ll apply everything we’ve learned\
    \ so far to create a practical application: a Unit Converter. This simple app\
    \ will allow users to convert between different units of measurement, such as\
    \ length, weight, and temperature. By the end of this project, you’ll have a deeper\
    \ understanding of how to use methods, loops, conditionals, and user input in\
    \ Java.\n\n### What Will the App Do?\n\nThe Unit Converter app will allow the\
    \ user to:\n- Convert distances (e.g., kilometers to miles).\n- Convert weights\
    \ (e.g., kilograms to pounds).\n- Convert temperatures (e.g., Celsius to Fahrenheit).\n\
    \nWe’ll focus on a console-based app, but the structure can be extended into a\
    \ GUI-based app.\n\n### Setting Up the Project\n\nBefore we begin, make sure you\
    \ have Java set up and ready.\n\n### Step 1: Create a Method for Each Conversion\n\
    \nNow let’s start by defining methods for the conversions the app will perform.\
    \ Each method will take a number as input and return the converted value.\n\n\
    ```java\npublic class UnitConverter {\n    // Method to convert kilometers to\
    \ miles\n    public static double kmToMiles(double kilometers) {\n        return\
    \ kilometers * 0.621371;\n    }\n\n    // Method to convert kilograms to pounds\n\
    \    public static double kgToPounds(double kilograms) {\n        return kilograms\
    \ * 2.20462;\n    }\n\n    // Method to convert Celsius to Fahrenheit\n    public\
    \ static double celsiusToFahrenheit(double celsius) {\n        return (celsius\
    \ * 9/5) + 32;\n    }\n\n    // Main method to run the program\n    public static\
    \ void main(String[] args) {\n        // Sample conversions\n        System.out.println(\"\
    10 kilometers is equal to \" + kmToMiles(10) + \" miles.\");\n        System.out.println(\"\
    50 kilograms is equal to \" + kgToPounds(50) + \" pounds.\");\n        System.out.println(\"\
    25 Celsius is equal to \" + celsiusToFahrenheit(25) + \" Fahrenheit.\");\n   \
    \ }\n}\n```\n\n**Explanation:**\n- `kmToMiles`: Converts kilometers to miles using\
    \ the formula `kilometers * 0.621371`.\n- `kgToPounds`: Converts kilograms to\
    \ pounds using the formula `kilograms * 2.20462`.\n- `celsiusToFahrenheit`: Converts\
    \ Celsius to Fahrenheit using the formula `celsius * 9/5 + 32`.\n\n### Step 2:\
    \ Enhancing the App with User Input\n\nNow that we have our conversion methods,\
    \ we need to allow the user to input the values they want to convert. We’ll use\
    \ the `Scanner` class to capture input from the user.\n\n```java\nimport java.util.Scanner;\n\
    \npublic class UnitConverter {\n    // Method to convert kilometers to miles\n\
    \    public static double kmToMiles(double kilometers) {\n        return kilometers\
    \ * 0.621371;\n    }\n\n    // Method to convert kilograms to pounds\n    public\
    \ static double kgToPounds(double kilograms) {\n        return kilograms * 2.20462;\n\
    \    }\n\n    // Method to convert Celsius to Fahrenheit\n    public static double\
    \ celsiusToFahrenheit(double celsius) {\n        return (celsius * 9/5) + 32;\n\
    \    }\n\n    // Main method to run the program\n    public static void main(String[]\
    \ args) {\n        // Create a scanner object for user input\n        Scanner\
