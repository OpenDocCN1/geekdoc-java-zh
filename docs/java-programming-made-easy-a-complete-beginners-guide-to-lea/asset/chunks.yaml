    * * *


    ## Coding Style: Writing Beautiful Java Code


    Comments help explain code, but your coding style determines how readable that
    code is in the first place.


    Java has a widely accepted coding style. Let’s walk through some essentials:


    * * *


    ### 1\. Use Meaningful Names


    Your variable, method, and class names should make sense at a glance.


    java


    // BAD


    int x = 10;


    String y = "John";


    // GOOD


    int maxAttempts = 10;


    String customerName = "John";


    * * *


    ### 2\. Use Camel Case and Pascal Case


    Use camelCase for variables and methods:


    java


    int userAge;


    void calculateTotal() {}


    Use PascalCase for class names:


    java


    public class BankAccount {}


    * * *


    ### 3\. Indentation and Braces


    Use 4 spaces for indentation. Always use curly braces  {} even for single-line
    blocks.


    java


    // BAD: No braces


    if (age >= 18)


    System.out.println("Adult");


    // GOOD: Consistent braces


    if (age >= 18) {


    System.out.println("Adult");


    }


    * * *


    4\. Keep Lines Short


    Aim for 80–100 characters per line. If your line gets too long, consider breaking
    it up.


    * * *


    5\. Organize Code Logically


    Group related variables and methods together. Add blank lines between logically
    separate sections.


    java


    public class User {


    private String name;


    private int age;


    public void login() {


    // login logic


    }


    public void logout() {


    // logout logic


    }


    }


    * * *


    ### 6\. Comment Block Examples with Code


    Here’s a working example that ties it all together — code, comments, style, and
    logic:


    java


    import java.util.Scanner;


    /**


    * This class demonstrates a basic user login simulation


    * using good commenting and coding style.


    */


    public class LoginApp {


    public static void main(String[] args) {


    Scanner scanner = new Scanner(System.in);


    // Prompt for username


    System.out.print("Enter your username: ");


    String username = scanner.nextLine();


    // Prompt for password


    System.out.print("Enter your password: ");


    String password = scanner.nextLine();


    // Check credentials (for demo purposes only, not secure)


    if (isAuthenticated(username, password)) {


    System.out.println("Login successful!");


    } else {


    System.out.println("Invalid username or password.");


    }


    scanner.close();


    }


    /**


    * Checks if the provided username and password are valid.


    * This is a mock check for demonstration.


    * @param user the username


    * @param pass the password


    * @return true if credentials match; false otherwise


    */


    public static boolean isAuthenticated(String user, String pass) {


    return user.equals("admin") && pass.equals("1234");


    }


    }


    * * *


    ## Hands-On Project: Simple Calculator


    Now that you''ve learned about variables, data types, operators, input/output,
    and coding style, it''s time to bring everything together with a small but meaningful
    project: a Simple Calculator.


    This calculator will allow users to perform basic arithmetic operations — addition,
    subtraction, multiplication, and division — using a clean console-based interface.


    * * *


    ## Project Overview


    ●       Objective: Build a simple console-based calculator in Java.


    ●       Skills Covered: Variables, data types, input/output, conditionals, operators,
    and method usage.


    ●       Tools Needed: IntelliJ IDEA, VS Code, or any Java IDE/editor, and Java
    17 or later installed.


    * * *


    ## Step 1: Set Up the Project


    Create a new Java file named  SimpleCalculator.java in your project directory.


    bash


    SimpleCalculator/


    ├── SimpleCalculator.java


    Open this file in your IDE or editor.


    * * *


    ## Step 2: Writing the Code


    Below is the complete, well-commented code. We’ll break it down step-by-step afterward.


    ### Java: SimpleCalculator.java


    java


    import java.util.Scanner;


    /**


    * SimpleCalculator


    * A console-based calculator that performs basic arithmetic operations.


    */


    public class SimpleCalculator {


    public static void main(String[] args) {


    Scanner scanner = new Scanner(System.in);


    // Display a welcome message


    System.out.println("Welcome to the Simple Calculator");


    // Prompt the user to enter two numbers


    System.out.print("Enter the first number: ");


    double num1 = scanner.nextDouble();


    System.out.print("Enter the second number: ");


    double num2 = scanner.nextDouble();


    // Prompt the user to choose an operation


    System.out.println("Choose an operation (+, -, *, /): ");


    char operator = scanner.next().charAt(0);


    double result = 0.0;


    boolean validOperation = true;


    // Use switch to perform the selected operation


    switch (operator) {


    case ''+'':


    result = num1 + num2;


    break;


    case ''-'':


    result = num1 - num2;


    break;


    case ''*'':


    result = num1 * num2;


    break;


    case ''/'':


    if (num2 != 0) {


    result = num1 / num2;


    } else {


    System.out.println("Error: Cannot divide by zero.");


    validOperation = false;


    }


    break;


    default:


    System.out.println("Error: Invalid operator.");


    validOperation = false;


    break;


    }


    // Display the result if the operation was valid


    if (validOperation) {


    System.out.println("Result: " + result);


    }


    scanner.close();


    }


    }


    * * *


    ## Step 3: Understanding the Code


    ### Importing Scanner


    We use  Scanner from  java.util to read user input.


    java


    import java.util.Scanner;


    ### Reading Numbers


    We read two  double values so the calculator can handle decimals.


    java


    double num1 = scanner.nextDouble();


    double num2 = scanner.nextDouble();


    ### Selecting an Operation


    We use a  char to capture the operator entered by the user.


    java


    char operator = scanner.next().charAt(0);


    ### Switch Statement


    A  switch is used to handle different cases (+,  -,  *,  /), which keeps the code
    neat and readable.


    java


    switch (operator) {


    case ''+'': result = num1 + num2;


    ### Division Check


    Before performing division, we ensure the second number isn''t zero to avoid a
    runtime error.


    java


    if (num2 != 0) {


    result = num1 / num2;


    } else {


    System.out.println("Error: Cannot divide by zero.");


    }


    * * *


    ## Step 4: Sample Output


    sql


    Welcome to the Simple Calculator


    Enter the first number: 10


    Enter the second number: 5


    Choose an operation (+, -, *, /): *


    Result: 50.0


    * * *


    ## Bonus Tips for Practice


    ●       Add support for repeating calculations using a loop.


    ●       Allow the user to perform multiple operations in one session.


    ●       Extend the calculator with more functions: modulus (%), square root, or
    power.


    ●       Handle input errors using exception handling (try-catch).


    * * *


    ## What You’ve Learned


    ●       How to gather user input using  Scanner


    ●       Applying arithmetic operators in real code


    ●       Using  switch-case logic for branching


    ●       Checking conditions before division


    ●       Writing clean and maintainable code with comments


    # Chapter 3: Control Flow


    Controlling how your program makes decisions and repeats actions is essential
    to writing functional applications. Java provides several control flow tools to
    help you handle logic and repetition effectively.


    * * *


    ## 3.1 Conditional Statements (if, else, switch)


    One of the most essential aspects of programming is decision-making. In Java,
    conditional statements allow your code to choose between different paths based
    on certain conditions. This is critical for writing logic that adapts to inputs,
    user choices, or changing variables.


    Let’s dive into how you can make decisions in Java using  if,  else, and  switch.


    * * *


    ### The  if Statement


    The  if statement checks whether a condition is true. If it is, the block of code
    inside the  if is executed.


    Syntax:


    java


    if (condition) {


    // code to execute if condition is true


    }


    Example:


    java


    int temperature = 30;


    if (temperature > 25) {


    System.out.println("It''s a hot day.");


    }


    Explanation:


    ●       The condition  temperature > 25 is checked.


    ●       Since 30 is greater than 25, the message is printed.


    * * *


    ### The  if-else Statement


    When you want to handle both true and false conditions, use  if-else.


