    - 第 7 章：数组与集合\n    - 7.1 一维数组\n    - 7.2 多维数组\n    - 7.3 ArrayList 与 LinkedList\n\
    \    - 实战项目：学生记录系统\n- 第 8 章：异常处理\n    - 8.1 Try-Catch 块\n    - 8.2 Finally, Throw\
    \ 与自定义异常\n    - 实战项目：安全文件读取应用\n- 第 9 章：文件处理\n    - 9.1 读写文本文件\n    - 9.2 BufferedReader\
    \ 与 Scanner\n    - 9.3 FileWriter 与 BufferedWriter\n    - 实战项目：待办事项应用（保存到文件)\n\
    - 第 10 章：终项目\n    - 10.1 构建一个简单的控制台 Java 应用（例如：图书管理系统或微型 ATM）\n    - 10.2 完整源码深度解析\n\
    \    - 10.3 如何构建大型 Java 程序\n- 附录\n    - A. Java 语法速查表\n    - B. 常用 IDE 快捷键\n \
    \   - C. 学习资源\n\n# 序言\n\n无论你是刚开始学习的学者，还是从其他领域转过来的开发者，本书都是为你量身定制的。我们将从基础开始，循序渐进地带你掌握\
    \ Java。Java 仍然是当今最广泛使用的编程语言之一，从 Android 开发到企业级系统，它无处不在。本书通过将理论与实战项目相结合，帮助你深入理解\
    \ Java。\n\n***\n\n## 你将学到\n\n在本书结束，你将能够：\n- 使用 IntelliJ IDEA 或 VS Code 设置开发环境。\n\
    - 编写简洁高效的代码。\n- 理解 Java 语法、变量和数据类型。\n- 掌握方法。\n- 理解类、对象、继承与多态。\n- 处理数组和集合。\n- 高效处理输入输出。\n\
    - 使用异常处理编写健壮的程序。\n- 构建实际项目。\n\n***\n\n## 如何使用本书\n\n本书的结构旨在循序渐进地教授 Java。\n\n###\
    \ 1. 按照顺序阅读章节\n\n每一章都建立在前章的基础上。早期介绍的概念（如变量和循环）会在后续章节中使用。如果你已有经验，可以跳读，但对于新手，建议按顺序学习。\n\
    \n### 2. 手打示例\n\n阅读代码很有用，但自己输入可以建立肌肉记忆并发现可能忽略的细节。本书中的每个示例都是完整的。这里是第 1 章的一个示例：\n\
    \n```java\n// HelloWorld.java\npublic class HelloWorld {\n    public static void\
    \ main(String[] args) {\n        // 在控制台打印一条问候语\n        System.out.println(\"\
    Hello, Java!\");\n    }\n}\n```\n\n解释：\n- `public class HelloWorld` 定义了一个名为 `HelloWorld`\
    \ 的类。\n- `public static void main(String[] args)` 是任何 Java 程序的入口。\n- `System.out.println(\"\
    Hello, Java!\")` 将文本打印到控制台。\n\n你可以使用以下编译并运行它：\n\n```bash\njavac HelloWorld.java\n\
    java HelloWorld\n```\n\n如果你使用的是 IntelliJ IDEA 或 VS Code，在设置好 SDK 后，直接使用内置选项运行文件即可。\n\
    \n### 3. 完成实战项目\n\n每一章结束时都有一个项目，将你所学的知识结合起来。这些项目经过精心挑选，简单且实用，例如构建计算器、数字猜谜游戏或学生记录系统。这些不仅仅是学术练习——它们反映了现实世界应用所需的逻辑和结构。\n\
    \n### 4. 使用附录和速查表\n\n在书的最后，你将找到一些快速参考资料，例如：\n- Java 语法速查表\n- IDE 快捷键\n- 额外的学习资源\n\
    \n当你自己独立编码并需要快速回顾时，这些资料非常有帮助。\n\n"
- fmt: "\nThe final chapter challenges you to bring everything together into a complete\
    \ console-based Java application. We’ll guide you step-by-step through building\
    \ a simple library management system or an ATM simulation. You’ll learn how to\
    \ structure code across multiple classes, handle user input, manage files, and\
    \ think like a developer.\n\n* *\n\n# Chapter 1: Getting Started with Java\n\n\
    ## 1.1 What is Java?\n\nJava is a high-level, object-oriented, and platform-independent\
    \ programming language developed by Sun Microsystems in 1995 (now owned by Oracle).\
    \ It’s widely used for building desktop applications, web applications, mobile\
    \ apps (especially Android), and enterprise systems.\n\nOne of Java’s most powerful\
    \ features is its “write once, run anywhere” philosophy. Java code is compiled\
    \ into bytecode, which runs on the Java Virtual Machine (`JVM`). This means you\
    \ can write a Java program on one operating system (like Windows) and run it on\
    \ another (like macOS or Linux) without any changes.\n\n### Key Characteristics\
    \ of Java:\n\n- **Object-Oriented**: Java uses objects and classes to structure\
    \ code logically.\n- **Platform-Independent**: The `JVM` abstracts away the underlying\
    \ operating system.\n- **Strongly Typed**: You must declare variable types explicitly.\n\
    - **Rich Standard Library**: Java comes with a vast set of built-in APIs.\n- **Widely\
    \ Adopted**: Used in industries ranging from finance and telecom to gaming and\
    \ embedded systems.\n\nIn essence, Java is mature, robust, and battle-tested.\
    \ It’s still among the top languages used worldwide, thanks to its combination\
    \ of performance, safety, and broad applicability.\n\n* *\n\n## 1.2 Why Learn\
    \ Java Today?\n\nJava continues to be one of the most relevant and in-demand programming\
    \ languages, even after decades of use. Here’s why it remains a great language\
    \ to learn:\n\n1. **Career Opportunities**: Java is heavily used in enterprise\
    \ applications, banking systems, Android development, and large-scale backend\
    \ systems. Many Fortune 500 companies rely on Java for their core infrastructure.\n\
    2. **Strong Community and Ecosystem**: With millions of developers worldwide,\
    \ Java has a large support community, open-source tools, and rich documentation—making\
    \ it easier for beginners to find help and resources.\n3. **Android Development**:\
