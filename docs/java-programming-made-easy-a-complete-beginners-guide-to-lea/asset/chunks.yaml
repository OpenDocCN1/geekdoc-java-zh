    ## Hands-On Project: Number Guessing Game


    Now that we''ve covered the basics of control flow, loops, and conditionals, it''s
    time to put all these concepts into practice. In this project, we will build a
    Number Guessing Game. This is a fun and interactive way to apply loops, conditionals,
    and random number generation.


    * * *


    ### Objective


    In this project, the computer will randomly choose a number between 1 and 100\.
    The user will then try to guess the number, with the program providing feedback
    whether the guess is too high, too low, or correct. The game will continue until
    the user guesses the correct number.


    * * *


    ### Step 1: Setup


    We will start by importing the necessary libraries and defining the basic structure
    of the game.


    java


    import java.util.Scanner; // For user input


    import java.util.Random;  // For random number generation


    public class NumberGuessingGame {


    public static void main(String[] args) {


    // Create a new scanner object for user input


    Scanner scanner = new Scanner(System.in);       


    // Create a random object to generate the secret number


    Random random = new Random();


    // Generate a random number between 1 and 100


    int secretNumber = random.nextInt(100) + 1;


    int guess = 0;  // This will hold the user''s guess


    int numberOfTries = 0;  // Track the number of attempts


    System.out.println("Welcome to the Number Guessing Game!");


    System.out.println("I have chosen a number between 1 and 100.");


    System.out.println("Try to guess it!");


    // Start the guessing loop


    while (guess != secretNumber) {


    System.out.print("Enter your guess: ");


    guess = scanner.nextInt();  // Read the user''s guess


    numberOfTries++;  // Increment the number of attempts           


    // Provide feedback


    if (guess < secretNumber) {


    System.out.println("Too low! Try again.");


    } else if (guess > secretNumber) {


    System.out.println("Too high! Try again.");


    } else {


    System.out.println("Congratulations! You''ve guessed the number.");


    System.out.println("It took you " + numberOfTries + " tries.");


    }


    }


    // Close the scanner object to avoid memory leak


    scanner.close();


    }


    }


    * * *


