    \n***\n\n## 3.2 循环 (for, while, do-while)\n\n循环是 Java 中强大的工具，允许你多次执行一段代码块。无论是处理用户输入、遍历列表还是生成模式，循环都能允许你编写简洁、高效且无重复的代码。\n\
    \n在本节中，我们将探索 Java 中三种常见的循环类型：`for`、`while` 和 `do-while`。\n\n***\n\n### for 循环\n\
    \n`for` 循环在你预先知道想要迭代的次数时是最理想。\n\n语法：\n\n```java\nfor (初始化; 条件; 更新) {\n    // 要执行的代码\n\
