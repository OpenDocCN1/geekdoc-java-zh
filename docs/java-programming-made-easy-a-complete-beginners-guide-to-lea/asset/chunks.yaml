  raw: 'In Java, an array is a container that holds a fixed number of values of a
    single type. It is one of the most fundamental data structures in programming
    and is particularly useful for storing multiple values under a single variable
    name. When we talk about a one-dimensional array, we''re simply referring to a
    list of values that are stored in a single row.


    In this section, we will learn how to declare, initialize, and manipulate one-dimensional
    arrays in Java, along with some practical examples to demonstrate their use.


    * * *


    #### Declaring an Array


    Before using an array, you need to declare it. In Java, arrays are objects, and
    their type is denoted by specifying the type of the elements they hold, followed
    by square brackets  [].


    Here’s the basic syntax for declaring an array:


    java


    // Syntax: type[] arrayName;


    int[] numbers;


    In the example above, we declare an array named  numbers that will hold integer
    values. However, at this point, the array is only declared, and memory has not
    been allocated for it yet. Let’s move on to initializing it.


    * * *


    #### Initializing an Array


    Once an array is declared, we need to allocate memory for it and initialize it
    with values. In Java, arrays can be initialized in a couple of ways:


    1.  Using the  new keyword:


    java


    // Allocating memory for 5 elements


    int[] numbers = new int[5];


    In this case, the array  numbers can store five integers, and the array elements
    are automatically initialized to their default value (0 for  int,  null for objects).


    2.  Initializing with predefined values:


    If you already know the values you want in the array, you can initialize the array
    in one go:


    java


    int[] numbers = {1, 2, 3, 4, 5};


    This way, the array  numbers is initialized with the values  1,  2,  3,  4, and  5.


    * * *


    #### Accessing Array Elements


    Array elements are accessed using an index. In Java, array indices start from
    0, meaning the first element is at index 0, the second element at index 1, and
    so on. To access an element, you use the array name followed by the index in square
    brackets.


    Here’s an example:


    java


    public class ArrayExample {


    public static void main(String[] args) {


    int[] numbers = {1, 2, 3, 4, 5};


    // Accessing elements by index


    System.out.println("First element: " + numbers[0]);  // Output: 1


    System.out.println("Second element: " + numbers[1]); // Output: 2


    System.out.println("Last element: " + numbers[4]);   // Output: 5


    }


    }


    In this example:


    ●       numbers[0] accesses the first element (1),


    ●       numbers[1] accesses the second element (2),


    ●       and  numbers[4] accesses the last element (5).


    #### Modifying Array Elements


    Arrays in Java are mutable, meaning you can modify their elements after they have
    been initialized. You simply refer to the element by its index and assign a new
    value.


    java


    public class ModifyArray {


    public static void main(String[] args) {


    int[] numbers = {10, 20, 30, 40, 50};


    // Modifying the third element (index 2)


    numbers[2] = 100;  // Changing 30 to 100


    // Displaying modified array


    System.out.println("Modified element at index 2: " + numbers[2]);  // Output:
    100


    }


    }


    In this code, the third element (originally  30) is changed to  100. When we access  numbers[2],
    we see the updated value (100).


    * * *


    #### Iterating Over an Array


    Often, you need to perform an operation on each element of an array. You can loop
    through the array using a  for loop. Here’s how to do it:


    java


    public class ArrayLoop {


    public static void main(String[] args) {


    int[] numbers = {1, 2, 3, 4, 5};


    // Looping through the array


    for (int i = 0; i < numbers.length; i++) {


    System.out.println("Element at index " + i + ": " + numbers[i]);


    }


    }


    }


    In this example:


    ●       numbers.length gives the length of the array (in this case, 5).


    ●       The loop runs from  i = 0 to  i = 4, printing each element.


    The output will be:


    perl


    Element at index 0: 1


    Element at index 1: 2


    Element at index 2: 3


    Element at index 3: 4


    Element at index 4: 5


    Using a  for loop allows us to process every element in the array efficiently.


    * * *


    #### Enhanced For-Loop (for-each loop)


    Java also provides an enhanced  for loop, known as the for-each loop, which makes
    iterating over arrays more concise. Here’s an example:


    java


    public class EnhancedForLoop {


    public static void main(String[] args) {


    int[] numbers = {1, 2, 3, 4, 5};


    // Using the enhanced for-loop to iterate over the array


    for (int number : numbers) {


    System.out.println("Element: " + number);


    }


    }


    }


    In this version,  int number : numbers iterates over each element of the  numbers
    array, assigning each element to the variable  number in turn. This is a simpler
    and more readable way to loop through arrays, especially when you don’t need the
    index of the elements.


    * * *


    #### Array Length


    In Java, arrays have a property called  length, which gives you the number of
    elements in the array. This is useful when you want to ensure you''re not going
    out of bounds when accessing or iterating through an array.


    For example:


    java


    public class ArrayLength {


    public static void main(String[] args) {


    int[] numbers = {1, 2, 3, 4, 5};


    // Getting the length of the array


    System.out.println("Array length: " + numbers.length);  // Output: 5


    }


    }


    The  length property is not a method, so you access it directly (no parentheses).


    * * *


    #### Common Pitfalls with Arrays


    While arrays are incredibly useful, there are a few common mistakes that beginners
    often make when working with them. It’s important to be aware of these so you
    don’t run into issues:


    Array Index Out of Bounds: Since arrays are zero-indexed, trying to access an
    element outside the valid index range (e.g.,  numbers[5] in an array of length
    5) will throw an  ArrayIndexOutOfBoundsException.


    Example:


    java


    int[] numbers = {1, 2, 3};


    System.out.println(numbers[3]);  // This will throw an exception!


    1.  To avoid this, always ensure your index is within the array bounds (0 <= index
    < array.length).


    2.  Fixed Size: Once an array is created with a specific size, you cannot change
    its size. If you need to add or remove elements dynamically, you should consider
    using a collection like  ArrayList.


    * * *


    ## 7.2 Multidimensional Arrays


    In Java, arrays are incredibly powerful, but what if you need to store data in
    a more complex structure? Enter multidimensional arrays. A multidimensional array
    is essentially an array of arrays. Instead of just a single line of elements,
    you get a grid-like structure, perfect for representing things like tables, matrices,
    or more complex data arrangements.


    In this section, we’ll dive into the world of multidimensional arrays, learn how
    to declare and initialize them, and look at how to access and manipulate the data
    stored in them. We’ll focus on two-dimensional arrays (think of a table with rows
    and columns) but will touch on higher-dimensional arrays as well.


    * * *


    #### Declaring a Multidimensional Array


    The syntax for declaring a multidimensional array in Java is similar to declaring
    a one-dimensional array, but you add an additional set of square brackets for
    each dimension.


    For a two-dimensional array, for example, we use the following syntax:


    java


    // Syntax: type[][] arrayName;


    int[][] matrix;


    Here,  matrix is declared as a two-dimensional array of integers. Let’s now move
    on to initializing this array.


    * * *


    #### Initializing a Multidimensional Array


    Just like with one-dimensional arrays, multidimensional arrays need to be initialized.
    You can initialize a two-dimensional array in a few different ways.


    1.  Using the  new keyword:


    java


    // Creating a 2D array with 3 rows and 4 columns


    int[][] matrix = new int[3][4];


    In this case,  matrix is a 2D array with 3 rows and 4 columns. All elements are
    initially set to  0 (the default value for integers in Java).


    2.  Using predefined values:


    If you already know the values you want to store, you can initialize the array
    directly with values.


