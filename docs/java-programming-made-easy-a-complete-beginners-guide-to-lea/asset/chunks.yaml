    \ that always runs\n\n}\n\n#### Example: File Closure with  finally\n\njava\n\n\
    import java.io.BufferedReader;\n\nimport java.io.FileReader;\n\nimport java.io.IOException;\n\
    \npublic class FinallyExample {\n\npublic static void main(String[] args) {\n\n\
    BufferedReader reader = null;\n\ntry {\n\nreader = new BufferedReader(new FileReader(\"\
    example.txt\"));\n\nString line = reader.readLine();\n\nSystem.out.println(\"\
    First line: \" + line);\n\n} catch (IOException e) {\n\nSystem.out.println(\"\
    Error reading file: \" + e.getMessage());\n\n} finally {\n\ntry {\n\nif (reader\
    \ != null) {\n\nreader.close(); // Always attempt to close\n\nSystem.out.println(\"\
    File closed.\");\n\n}\n\n} catch (IOException e) {\n\nSystem.out.println(\"Failed\
    \ to close file: \" + e.getMessage());\n\n}\n\n}\n\n}\n\n}\n\nWhy it matters:\
    \ Even if an exception occurs while reading the file, the  finally block ensures\
    \ the file stream is closed properly.\n\n* * *\n\n### The  throw Statement\n\n\
    The  throw keyword lets you manually trigger an exception. This is useful when\
    \ you detect an error condition that Java doesn’t consider an exception by default.\n\
    \n#### Syntax\n\njava\n\nthrow new ExceptionType(\"Custom error message\");\n\n\
    #### Example: Manually Throwing an Exception\n\njava\n\npublic class ThrowExample\
    \ {\n\npublic static void main(String[] args) {\n\nint age = -5;\n\ntry {\n\n\
    if (age < 0) {\n\nthrow new IllegalArgumentException(\"Age cannot be negative.\"\
    );\n\n}\n\nSystem.out.println(\"Age is: \" + age);\n\n} catch (IllegalArgumentException\
    \ e) {\n\nSystem.out.println(\"Exception: \" + e.getMessage());\n\n}\n\n}\n\n\
    }\n\nWhen to use: Use  throw when validating inputs or enforcing business rules\
    \ that require custom logic.\n\n* * *\n\n### Creating Custom Exceptions\n\nBuilt-in\
    \ exceptions like  NullPointerException or  IOException cover a wide range of\
    \ errors. But sometimes, you need an exception that’s more domain-specific—that’s\
    \ where custom exceptions come in.\n\n#### How to Create a Custom Exception\n\n\
    Custom exceptions in Java are created by extending the  Exception class (for checked\
    \ exceptions) or  RuntimeException (for unchecked exceptions).\n\n#### Example:\
    \ Defining a Custom Exception\n\njava\n\n// Define a custom exception\n\nclass\
    \ InvalidScoreException extends Exception {\n\npublic InvalidScoreException(String\
    \ message) {\n\nsuper(message);\n\n}\n\n}\n\n// Use it in a class\n\npublic class\
    \ CustomExceptionExample {\n\npublic static void validateScore(int score) throws\
    \ InvalidScoreException {\n\nif (score < 0 || score > 100) {\n\nthrow new InvalidScoreException(\"\
    Score must be between 0 and 100.\");\n\n}\n\nSystem.out.println(\"Score is valid:\
    \ \" + score);\n\n}\n\npublic static void main(String[] args) {\n\ntry {\n\nvalidateScore(150);\n\
    \n} catch (InvalidScoreException e) {\n\nSystem.out.println(\"Validation failed:\
    \ \" + e.getMessage());\n\n}\n\n}\n\n}\n\nExplanation:\n\n●       We define a\
    \ class  InvalidScoreException that extends  Exception.\n\n●       We throw this\
    \ exception when the score is out of range.\n\n●       In the  main method, we\
    \ catch and handle the exception like any other.\n\n* * *\n\n### Checked vs Unchecked\
    \ Exceptions\n\nWhen creating custom exceptions, it helps to understand the difference\
    \ between checked and unchecked exceptions:\n\n| Type | Inherits From | Must be\
    \ declared in method signature? |\n\n| Checked | Exception | Yes |\n\n| Unchecked\
    \ | RuntimeException | No |\n\nUse checked exceptions for conditions your program\
    \ should recover from. Use unchecked exceptions for programmer errors like null\
    \ pointers or index out of bounds.\n\n* * *\n\n### Best Practices\n\n1.  Close\
    \ resources in  finally or use try-with-resources\n\n○ Java 7+ supports  try-with-resources\
    \ which is often cleaner than manually using  finally.\n\n2.  Throw specific exceptions\n\
    \n○ Avoid throwing generic  Exception. Always use or define the most specific\
    \ type.\n\n3.  Don’t overuse custom exceptions\n\n○ Use them when they add meaningful\
    \ context that built-in exceptions can’t.\n\n4.  Include helpful messages\n\n\
    ○ Always pass clear messages when throwing exceptions to aid debugging.\n\n* *\
    \ *\n\n## Hands-On Project: Safe File Reader App\n\nIn this hands-on project,\
    \ we’ll build a Safe File Reader App that reads the contents of a file and handles\
    \ potential exceptions gracefully. The goal is to put into practice the concepts\
    \ from this chapter—try-catch blocks,  finally,  throw, and custom exceptions—while\
    \ building a functional and reusable file reader utility.\n\nThis app will teach\
    \ you how to:\n\n●       Handle common I/O exceptions properly.\n\n●       Use\
    \  finally to ensure resources are released.\n\n●       Create and use custom\
    \ exceptions to manage specific error cases.\n\n●       Implement a clean and\
    \ user-friendly structure for error reporting.\n\nLet’s get started.\n\n* * *\n\
    \n### Project Overview\n\nOur app will:\n\n1.  Prompt the user for a file path.\n\
    \n2.  Attempt to read the file line by line.\n\n3.  Handle exceptions such as:\n\
    \n○   File not found\n\n○   Empty file\n\n○   Invalid file path\n\n4.  Use a custom\
    \ exception if the file is empty.\n\n5.  Always close the file reader using a\
    \  finally block.\n\n* * *\n\n### Step 1: Create a Custom Exception\n\nWe'll define\
    \ a custom exception called  EmptyFileException for scenarios where the file exists\
    \ but contains no data."
