- fmt: "\n# Key Point: The order of catch blocks matters—start with more specific\
    \ exceptions and work toward more general ones. If you catch `Exception` before\
    \ a specific type, the specific catch block will never be reached.\n\n***\n\n\
    ### Using Multiple Exceptions in One Catch (Java 7+)\n\nJava 7 introduced a way\
    \ to catch multiple exceptions in a single `catch` block using the `|` symbol.\n\
    \n#### Example 3: Multi-Catch Block\n\n```java\npublic class MultiCatch {\n  \
    \  public static void main(String[] args) {\n        try {\n            String\
    \ text = null;\n            System.out.println(text.length()); // Throws NullPointerException\n\
    \        } catch (NullPointerException | ArithmeticException e) {\n          \
    \  System.out.println(\"Caught an exception: \" + e.getClass().getSimpleName());\n\
    \        }\n    }\n}\n```\n\nThis keeps your code clean and avoids duplication\
    \ when multiple exceptions require the same handling logic.\n\n***\n\n### Best\
    \ Practices\n\n1.  **Catch only what you can handle**\n    Don’t use a generic\
    \ `catch (Exception e)` unless absolutely necessary. It can hide real issues and\
    \ make debugging harder.\n\n2.  **Avoid silent failures**\n    Never write an\
    \ empty catch block. Always log or respond meaningfully.\n    ```java\n    //\
    \ Bad practice\n    catch (IOException e) {\n        // Do nothing\n    }\n  \
    \  ```\n\n3.  **Use meaningful error messages**\n    Provide user-friendly and\
    \ informative feedback.\n\n4.  **Don’t overuse try-catch**\n    Wrap only the\
    \ code that might fail—not the entire method unnecessarily.\n\n***\n\n### Realistic\
    \ Scenario: Safe Input Parsing\n\nA common case where try-catch is used is when\
    \ converting a string input into a number. This often comes up when dealing with\
    \ user input.\n\n```java\nimport java.util.Scanner;\n\npublic class InputParsing\
    \ {\n    public static void main(String[] args) {\n        Scanner scanner = new\
    \ Scanner(System.in);\n        System.out.print(\"Enter a number: \");\n     \
    \   String input = scanner.nextLine();\n        try {\n            int number\
    \ = Integer.parseInt(input); // Risky: could throw NumberFormatException\n   \
    \         System.out.println(\"You entered: \" + number);\n        } catch (NumberFormatException\
    \ e) {\n            System.out.println(\"Invalid number format. Please enter digits\
    \ only.\");\n        }\n        scanner.close();\n    }\n}\n```\n\n***\n\n## 8.2\
    \ Finally, Throw, and Custom Exceptions\n\nNow that you've seen how `try-catch`\
    \ blocks work, it’s time to complete the picture of Java’s exception handling\
    \ system by understanding three key components: `finally`, `throw`, and custom\
    \ exception classes. These allow you to build cleaner, more robust applications\
    \ that handle errors intentionally and consistently.\n\nLet’s break each one down,\
    \ show how and when to use them, and walk through practical examples you can apply\
    \ in real-world development.\n\n***\n\n### The `finally` Block\n\nThe `finally`\
    \ block is used to execute code regardless of whether an exception was thrown\
    \ or caught. It's most useful for cleanup operations like closing files, releasing\
    \ resources, or disconnecting from a database.\n\n#### Syntax\n\n```java\ntry\
    \ {\n    // Risky code\n} catch (ExceptionType e) {\n    // Exception handling\n\
    } finally {\n    // Cleanup code that always runs\n}\n```\n\n#### Example: File\
    \ Closure with `finally`\n\n```java\nimport java.io.BufferedReader;\nimport java.io.FileReader;\n\
    import java.io.IOException;\n\npublic class FinallyExample {\n    public static\
    \ void main(String[] args) {\n        BufferedReader reader = null;\n        try\
    \ {\n            reader = new BufferedReader(new FileReader(\"example.txt\"));\n\
    \            String line = reader.readLine();\n            System.out.println(\"\
    First line: \" + line);\n        } catch (IOException e) {\n            System.out.println(\"\
    Error reading file: \" + e.getMessage());\n        } finally {\n            try\
    \ {\n                if (reader != null) {\n                    reader.close();\
    \ // Always attempt to close\n                    System.out.println(\"File closed.\"\
    );\n                }\n            } catch (IOException e) {\n               \
    \ System.out.println(\"Failed to close file: \" + e.getMessage());\n         \
    \   }\n        }\n    }\n}\n```\n\nWhy it matters: Even if an exception occurs\
    \ while reading the file, the `finally` block ensures the file stream is closed\
    \ properly.\n\n***\n\n### The `throw` Statement\n\nThe `throw` keyword lets you\
    \ manually trigger an exception. This is useful when you detect an error condition\
    \ that Java doesn’t consider an exception by default.\n\n#### Syntax\n\n```java\n\
    throw new ExceptionType(\"Custom error message\");\n```\n\n#### Example: Manually\
    \ Throwing an Exception\n\n```java\npublic class ThrowExample {\n    public static\
    \ void main(String[] args) {\n        int age = -5;\n        try {\n         \
    \   if (age < 0) {\n                throw new IllegalArgumentException(\"Age cannot\
    \ be negative.\");\n            }\n            System.out.println(\"Age is: \"\
    \ + age);\n        } catch (IllegalArgumentException e) {\n            System.out.println(\"\
    Exception: \" + e.getMessage());\n        }\n    }\n}\n```\n\nWhen to use: Use\
    \ `throw` when validating inputs or enforcing business rules that require custom\
    \ logic.\n\n***\n\n### Creating Custom Exceptions\n\nBuilt-in exceptions like\
    \ `NullPointerException` or `IOException` cover a wide range of errors. But sometimes,\
    \ you need an exception that’s more domain-specific—that’s where custom exceptions\
    \ come in.\n\n#### How to Create a Custom Exception\n\nCustom exceptions in Java\
    \ are created by extending the `Exception` class (for checked exceptions) or `RuntimeException`\
    \ (for unchecked exceptions).\n\n#### Example: Defining a Custom Exception\n\n\
    ```java\n// Define a custom exception\nclass InvalidScoreException extends Exception\
    \ {\n    public InvalidScoreException(String message) {\n        super(message);\n\
    \    }\n}\n\n// Use it in a class\npublic class CustomExceptionExample {\n   \
    \ public static void validateScore(int score) throws InvalidScoreException {\n\
    \        if (score < 0 || score > 100) {\n            throw new InvalidScoreException(\"\
    Score must be between 0 and 100.\");\n        }\n        System.out.println(\"\
    Score is valid: \" + score);\n    }\n\n    public static void main(String[] args)\
    \ {\n        try {\n            validateScore(150);\n        } catch (InvalidScoreException\
    \ e) {\n            System.out.println(\"Validation failed: \" + e.getMessage());\n\
    \        }\n    }\n}\n```\n\nExplanation:\n- We define a class `InvalidScoreException`\
    \ that extends `Exception`.\n- We throw this when the score is out of range.\n\
    - In the `main` method, we catch it like any other.\n\n***\n\n### Checked vs Unchecked\
    \ Exceptions\n\nWhen creating custom exceptions, it helps to understand the difference\
    \ between checked and unchecked exceptions:\n\n| Type | Inherits From | Must be\
    \ declared in method signature |\n| :--- | :--- | :--- |\n| Checked | Exception\
    \ | Yes |\n| Unchecked | RuntimeException | No |\n\nUse checked exceptions for\
    \ conditions your program should recover from. Use unchecked exceptions for programmer\
    \ errors.\n\n***\n\n### Best Practices\n\n1.  **Close resources in `finally` or\
    \ use try-with-resources**\n    Java 7+ supports try-with-resources which is often\
    \ cleaner than manually using `finally`.\n2.  **Throw specific exceptions**\n\
    \    Avoid throwing generic `Exception`. Always use the most specific type.\n\
    3.  **Don’t overuse custom exceptions**\n    Use them when they add meaningful\
    \ context that built-in exceptions can’t.\n4.  **Include helpful messages**\n\
    \    Always pass clear messages when throwing.\n\n***\n\n## Hands-On Project:\
    \ Safe Reader App\n\nIn this hands-on project, we’ll build a Safe Reader App that\
    \ reads the contents of a file and handles potential exceptions gracefully. The\
    \ goal is to put into practice the concepts from this chapter—try-catch blocks,\
    \ `finally`, `throw`, and custom exceptions—while building a functional and reusable\
    \ file reader utility.\n\nThis app will teach you how to:\n- Handle common I/O\
    \ exceptions properly.\n- Use `finally` to ensure resources are released.\n- Create\
    \ and use custom exceptions to manage specific error cases.\n- Implement a clean\
    \ and user-friendly structure for error reporting.\n\nLet’s get started.\n\n###\
    \ Project Overview\n\nOur app will:\n\n1.  Prompt the user for a file path.\n\
    2.  Attempt to read the file line by line.\n3.  Handle exceptions such as:\n \
    \   - File not found\n    - Empty file\n    - Invalid file path\n4.  Use a custom\
    \ exception if the file is empty.\n5.  Always close the file reader using a `finally`\
    \ block.\n\n***\n\n### Step 1: Create a Custom Exception\n\nWe'll define a custom\
    \ exception called `EmptyFileException` for scenarios where the file exists but\
    \ contains no data.\n"
