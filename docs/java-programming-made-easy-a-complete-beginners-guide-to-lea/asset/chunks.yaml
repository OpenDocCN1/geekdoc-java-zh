    \ 6.1 Access Modifiers and Getters/Setters\n\nIn object-oriented programming,\
    \ one of the key principles is encapsulation. Encapsulation helps ensure that\
    \ the internal state of an object is protected from unintended interference and\
    \ misuse. Access modifiers and the use of getters and setters play a crucial role\
    \ in implementing encapsulation.\n\n### Access Modifiers\n\nAccess modifiers are\
    \ keywords in Java that set the visibility of class members (fields, methods,\
    \ constructors). By carefully choosing the right access modifier for each class\
    \ member, we can control how other parts of the program interact with those members.\n\
    \nThere are four access modifiers in Java:\n\n1. `public`: The member is accessible\
    \ from any other class.\n2. `private`: The member is accessible only within the\
    \ class where it is defined.\n3. `protected`: The member is accessible within\
    \ the same package or by subclasses.\n4. `default` (no modifier): The member is\
    \ accessible only within the same package.\n\n### Why Use Access Modifiers?\n\n\
    Access modifiers help achieve the goal of encapsulation by controlling how fields\
    \ and methods are accessed:\n\n- `private` ensures that fields are hidden from\
    \ external classes and can only be accessed or modified through methods within\
    \ the class.\n- `public` exposes fields and methods for general access, which\
    \ can be useful when certain functionality needs to be shared across classes or\
    \ packages.\n- `protected` and `default` provide intermediate levels of access.\n\
    \n### Example: Using Access Modifiers\n\nLet’s start with an example where we\
    \ have a `Person` class that uses different access modifiers for its fields.\n\
    \n```java\npublic class Person {\n    // Private fields - cannot be accessed directly\
    \ from outside the class\n    private String name;\n    private int age;\n\n \
    \   // Constructor to initialize the Person object\n    public Person(String name,\
