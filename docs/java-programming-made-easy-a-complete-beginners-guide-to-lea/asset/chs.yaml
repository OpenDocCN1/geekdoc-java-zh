  \n# 第 5 章：Java 面向面向的编程\n\n在本章中，我们将深入探索 Java 的面向对象编程 (OOP) 世界。OOP 是一种编程范式，它围绕数据或对象来组织软件设计，而不是围绕函数和逻辑。它是\
  \ Java 的基础，用于构建灵活、可重用且易维护的代码。我们将探索 OOP 的核心概念，并带你了解。\n\n## 5.1 OOP 简介（面向对象编程）\n\n\
  面向对象编程 (OOP) 是目前最流行的编程范式之一。其核心在于对现实世界的实体及其交互进行建模。在本节中，我们将探讨 OOP 的基础原理、如何应用于 Java\
  \ 以及理解它们对于成为熟练 Java 开发人员的关键。OOP 基于四个原则：\n\n1. 封装\n2. 抽象\n3. 继承\n4. 多态\n\n每个原则在 Java\
  \ 编程中都起着至关重要的作用，帮助你构建、组织、扩展和调试代码。\n\n### 封装：隐藏内部细节\n\n封装是将数据（属性）和操作数据的方法封装在一个单元中，通常是一个类。封装的主要目标是保护数据免受直接访问和修改，确保只能通过定义的方法进行操作。这有助于确保对象的状态有效且一致。\n\
  \n在 Java 中，封装通常通过使用 `private` 字段并提供访问和修改它们的公共 `getter` 和 `setter` 方法来实现。\n\n####\
  \ 封装示例：\n\n```java\npublic class Person {\n    // 私有字段，封装数据\n    private String\
  \ name;\n    private int age;\n\n    // name 的公 getter 方法\n    public String getName()\
  \ {\n        return name;\n    }\n\n    // name 的公 setter 方法\n    public void setName(String\
  \ name) {\n        this.name = name;\n    }\n\n    // age 的公 getter 方法\n    public\
  \ int getAge() {\n        return age;\n    }\n\n    // age 的公 setter 方法\n    public\
  \ void setAge(int age) {\n        if (age >= 0) { // setter 方法内的验证\n           \
  \ this.age = age;\n        } else {\n            System.out.println(\"年龄不能为负数!\"\
  );\n        }\n    }\n}\n```\n\n在这个示例中：\n\n● `name` 和 `age` 字段是 `private` 的，这意味着它们在\
  \ `Person` 类之外无法直接访问。\n● 我们提供了 getter 和 setter 方法来访问和修改这些字段的值。`age` 的 setter 验证以确保年龄非负，展示了封装如何保护对象的完整性。\n\
  \n***\n\n### 2. 抽象：隐藏复杂性\n\n抽象是指隐藏对象复杂实现细节并只暴露基本特征的概念。抽象并不关注“如何”工作，而是允许你思考对象“做什么”。\n\
  \n在 Java 中，抽象通常通过使用 `abstract` 类和接口（interfaces）来实现。\n\n#### 使用抽象类的抽象示例：\n\n```java\n\
  abstract class Animal {\n    // 抽象方法（没有正体）\n}\n```\n\n\n\n\n\n```java\npublic abstract\
  \ void sound();\n\n// 带有实现的普通方法\n\npublic void sleep() {\n    System.out.println(\"\
  This animal is sleeping.\");\n}\n\n}\n\nclass Dog extends Animal {\n    // 实现 Animal\
  \ 中的抽象方法\n    public void sound() {\n        System.out.println(\"Woof!\");\n  \
  \  }\n}\n\nclass Cat extends Animal {\n    // 实现 Animal 中的抽象方法\n    public void\
  \ sound() {\n        System.out.println(\"Meow!\");\n    }\n}\n```\n\n在这里：\n\n-\
  \ `Animal` 是一个抽象类，包含一个抽象方法 `sound()`，该方法必须由任何子类（如 `Dog` 或 `Cat`）实现。\n- `sleep()`\
  \ 方法是一个带有方法体的普通方法，这说明了抽象可以同时包含抽象方法和非抽象方法。\n\n通过关注 `sound()` 方法并忽略内部细节，我们可以轻松地扩展功能，而无需更改现有代码——这就是抽象的力量。\n\
  \n***\n\n### 3. 继承：在现有代码的基础上构建\n\n继承是一种允许一个类继承另一个类的属性和行为的机制。在 Java 中，这允许你基于现有的类（父类）创建一个新类（子类）。继承促进了代码的重用，并实现了层次化的类结构。\n\
  \n#### 继承示例：\n\n```java\nclass Animal {\n    public void eat() {\n        System.out.println(\"\
  This animal is eating.\");\n    }\n}\n\nclass Dog extends Animal {\n    public void\
  \ bark() {\n        System.out.println(\"The dog barks.\");\n    }\n}\n\npublic\
  \ class Main {\n    public static void main(String[] args) {\n        Dog myDog\
  \ = new Dog();\n        myDog.eat();  // 继承的方法\n        myDog.bark(); // Dog 自己的方法\n\
  \    }\n}\n```\n\n在这个示例中：\n\n- `Dog` 是 `Animal` 的子类，继承了 `Animal` 的 `eat()` 方法。\n\
  - `Dog` 类还定义了自己的方法 `bark()`，该方法是类 类特有的。\n\n继承允许我们在现有类的基础上进行构建而无需重写代码，使我们的程序更具可维护性和扩展性。\n\
  \n***\n\n### 4. 多态：一个接口，多种实现\n\n多态意味着“多种形状”，允许你使用单个方法或对象来表示不同的类型。这在 Java 中最常见有两种形式：方法重写和方法重载。\n\
  \n- **方法重写** 允许子类为其父类中已定义的方法提供自己的特定实现。\n- **方法重载** 允许类定义多个同名但参数不同的方法。\n\n#### 通过方法重写实现多态的示例：\n\
  \n```java\nclass Animal {\n    public void sound() {\n        System.out.println(\"\
  Some generic animal sound\");\n    }\n}\n\nclass Dog extends Animal {\n    @Override\n\
  \    public void sound() {\n        System.out.println(\"Woof! Woof!\");\n    }\n\
  }\n\npublic class Main {\n    public static void main(String[] args) {\n       \
  \ Animal myAnimal = new Animal();\n        Animal myDog = new Dog();\n        myAnimal.sound();\
  \  // 输出：Some generic animal sound\n        myDog.sound();      // 输出：Woof! Woof!\n\
  \    }\n}\n```\n\n在这里：\n\n- `sound()` 在 `Dog` 类中被重写以提供特定的实现。\n- 在运行时，Java 根据对象的实际类型\
  \ own 其引用类型来确定要调用的 `sound()` 方法的版本。这被称为运行时多态。\n\n***\n\n### 为什么 OOP 在 Java 中很重要\n\
  \nJava 被设计为一种面向对象的语言，采用 OOP 允许你：\n\n- 构建模块化且易于维护的软件。\n- 鼓励代码重用，减少重复。\n- 通过允许编写可以与不同类型的对象工作的代码来增加灵活性。\n\
  - 提高可扩展性和组织性，使大型项目更容易管理。\n\n通过掌握 OOP，你将能够编写更整洁、更高效的代码，并更好地准备好应对复杂的软件设计挑战。\n\n***\n\
  \n## 5.2 类和对象\n\n在面向对象编程 (OOP) 世界中，类和对象是核心构建块。如果你刚刚开始学习 OOP，理解这两者是如何协同工作的是至关重要的。在本章中，我们将深入探讨类和对象是什么、如何创建它们，以及它们在\
  \ Java 中如何相互作用。\n\n***\n\n### 什么是类？\n\n类本质上是创建对象的蓝图或模板。它定义了从它创建的实例将拥有的属性（变量）和行为（方法）。将类想象成一个概述对象看起来像什么样以及如何运行的计划。\n\
  \n在 Java 中，类使用 `class` 关键字定义，它们可以包含：\n\n- **字段**：这些是持有对象相关数据的变量。\n- **方法**：这些是定义对象可以执行的操作或行为的函数。\n\
  - **构造函数**：创建对象时初始化对象的特殊方法。\n\n#### 简单类的示例\n\n```java\npublic class Car {\n    //\
  \ 字段（属性）\n    String model;\n    int year;\n    String color;\n\n    // 方法（行为）\n\
  \    public void startEngine() {\n        System.out.println(\"The \" + color +\
  \ \" is starting.\");\n    }\n\n    // 另一个方法（行为）\n    public void stopEngine() {\n\
  \        System.out.println(\"The \" + color + \" is stopping.\");\n    }\n}\n```\n\
  \n在 `Car` 类中：\n\n- 属性：`model`、`year` 和 `color`。\n- 方法：`startEngine()` 和 `stopEngine()`。\n\
  \n***\n\n### 什么是对象？\n\n对象是类的实例。如果类是蓝图，对象就是具体的实体。在 Java 中，创建对象时使用 `new` 关键字，后面紧跟构造函数的调用。\n\
  \n#### 创建对象的示例\n\n```java\npublic class Main {\n    public static void main(String[]\
  \ args) {\n        // 创建 Car 类对象\n        Car myCar = new Car();\n\n        // 设置对象的字段\n\
  \        myCar.model = \"Toyota\";\n        myCar.year = 2022;\n        myCar.color\
  \ = \"red\";\n\n        // 调用对象的方法\n        myCar.startEngine();\n        myCar.stopEngine();\n\
  \    }\n}\n```\n\n在 `Main` 类中：\n\n- `myCar` 对象是 `Car` 类的实例。\n- 我们设置了对象的 `model`、`year`\
  \ 和 `color`。\n\n***\n\n### 实例变量与局部变量\n\n在 Java 中，变量可以分为两大类：\n\n- **实例变量**：这些是定义在类内部但在任何方法之外的变量。它们代表对象的属性，每个对象都有这些变量的副本。\n\
  - **局部变量**：这些是定义在方法、构造函数或块内部的变量。它们仅在声明的方法或块内可访问。\n\n在我们的 `Car` 类示例中，`model`、`year`\
  \ 和 `color` 是实例变量，因为它们定义在类内部但在方法之外。如果你在方法内部（例如循环或函数中）定义变量，该变量就是局部变量，且仅在该方法有效。\n\n\
  ***\n\n### 使用构造函数创建对象\n\n构造函数是在从类创建对象时自动调用的特殊方法。它用于初始化对象的属性。如果你没有显式定义构造函数，Java 会提供一个默认构造函数。\n\
  \n在上面的 `Car` 类示例中，我们没有提供构造函数，因此 Java 使用默认构造函数。然而，你可以定义自定义构造函数以更灵活的方式初始化对象。\n\n####\
  \ 构造函数的示例\n\n```java\npublic class Car {\n    // 实例变量\n    String model;\n    int\
  \ year;\n    String color;\n\n    // 初始化对象的构造函数\n    public Car(String model, int\
  \ year, String color) {\n        this.model = model;\n        this.year = year;\n\
  \        this.color = color;\n    }\n}\n```\n\n\n\n\n\n```java\npublic class Car\
  \ {\n    this.model = model;  // 'this' 指向当前对象的实例变量\n    this.year = year;\n   \
  \ this.color = color;\n    }\n\n    // 启动引擎的方法\n    public void startEngine() {\n\
  \        System.out.println(\"The \" + color + \" \" + model + \" is starting.\"\
  );\n    }\n}\n\npublic class Main {\n    public static void main(String[] args)\
  \ {\n        // 使用构造函数创建对象\n        Car myCar = new Car(\"Toyota\", 2022, \"red\"\
  );\n        // 在对象上调用方法\n        myCar.startEngine();\n    }\n}\n```\n\n在 `Car`\
  \ 类的这个版本中：\n\n● 我们添加了一个构造函数 `public Car(String model, int year, String color)`，它接收参数来初始化\
  \ `model`、`year` 和 `color` 字段。\n● `this` 关键字用于引用当前对象的实例变量，将它们与构造函数中的参数区分开来。\n\n\
  现在当我们创建 `myCar` 对象时，直接将值传递给构造函数，从而初始化对象的字段。\n\n***\n\n### `this` 关键字\n\n你可能已经注意到在上面的构造函数示例中使用了\
  \ `this` 关键字。Java 中的 `this` 关键字是对类当前实例的引用。它通常用于构造函数和方法内部，以区分实例变量与具有相同名的局部变量或方法参数。\n\
  \n● 在构造函数中，`this.model = model;` 意味着实例变量 `model`（与对象关联的那个）被赋值为参数 `model`（传递给构造函数的）的值。\n\
  如果没有 `this`，将无法确定你是指代实例变量还是构造函数参数。\n\n***\n\n### 访问对象数据\n\n一旦你创建了对象，就可以使用点运算符 (`.`)\
  \ 访问它的属性（字段）并调用它的方法。这允许你与对象的状态进行交互并对其进行操作。\n\n例如：\n\n```java\npublic class Main\
  \ {\n    public static void main(String[] args) {\n        // 创建一个 Car 类的新对象\n \
  \       Car myCar = new Car(\"Honda\", 2023, \"blue\");\n        // 访问对象字段\n   \
  \     System.out.println(\"Car model: \" + myCar.model);\n        System.out.println(\"\
  Car year: \" + myCar.year);\n        System.out.println(\"Car color: \" + myCar.color);\n\
  \        // 调用方法\n        myCar.startEngine();\n    }\n}\n```\n\n在这里：\n\n● 我们直接访问了\
  \ `myCar` 对象的 `model`、`year` 和 `color` 字段。\n● 我们还调用了对象上的 `startEngine()` 方法。\n\n\
  ***\n\n## 5.3 构造函数与 `this` 关键字\n\n在面向对象编程中，构造函数起着至关重要的作用。它们是特殊方法，在创建类的新实例时自动调用。构造函数对于用初始值初始化对象并确保对象从有效状态开始至关重要。在本章中，我们将深入\
  \ Java 构造函数的工作原理、如何有效地使用它们，以及 `this` 关键字如何帮助你管理类中变量的作用域。\n\n***\n\n### 什么是构造函数？\n\
  \n构造函数是用于在创建对象时初始化对象的特殊方法。构造函数的名称与类名相同，且不返回任何类型（即使是 `void`）。如果你没有在类中显式定义构造函数，Java\
  \ 会提供一个默认构造函数，它不执行任何初始化（仅创建对象）。\n\n当你想要设置对象的初始状态时（例如在对象创建时立即给其字段赋值），构造函数会特别有用。\n\
  \n### 示例：基础构造函数\n\n```java\npublic class Car {\n    // 实例变量（属性）\n    String model;\n\
  \    int year;\n    String color;\n\n    // 初始化 Car 对象的构造函数\n    public Car(String\
  \ model, int year, String color) {\n        this.model = model;  // 'this' 指向实例变量\n\
  \        this.year = year;\n        this.color = color;\n    }\n\n    // 显示汽车信息的方法\n\
  \    public void displayInfo() {\n        System.out.println(\"Car Model: \" + model);\n\
  \        System.out.println(\"Car Year: \" + year);\n        System.out.println(\"\
  Car Color: \" + color);\n    }\n}\n\npublic class Main {\n    public static void\
  \ main(String[] args) {\n        // 使用构造函数创建 Car 类对象\n        Car myCar = new Car(\"\
  Tesla\", 2023, \"Red\");\n        // 调用方法显示信息\n        myCar.displayInfo();\n  \
  \  }\n}\n```\n\n在上面的示例中：\n\n● `Car` 类有一个构造函数 `public Car(String model, int year,\
  \ String color)`，它接收参数来初始化 `model`、`year` 和 `color` 字段。\n● 当使用 `new Car(\"Tesla\"\
  , 2023, \"Red\")` 创建 `myCar` 对象时，构造函数使用提供的值初始化对象。\n● `displayInfo()` 方法用于显示汽车的详情。\n\
  \n***\n\n### 构造函数重载\n\nJava 构造函数重载，这意味着可以在同一个类中拥有多个不同参数列表的构造函数。每个构造函数执行相同的初始化对象任务，但可以接受不同类型或数量的参数。\n\
  \n#### 示例：构造函数重载\n\n```java\npublic class Car {\n    // 实例变量\n    String model;\n\
  \    int year;\n    String color;\n\n    // 构造函数 1：初始化 model, year 和 color\n   \
  \ public Car(String model, int year, String color) {\n        this.model = model;\n\
  \        this.year = year;\n        this.color = color;\n    }\n\n    // 构造函数 2：初始化\
  \ model，设置 year 和 color 的默认值\n    public Car(String model) {\n        this.model\
  \ = model;\n        this.year = 2022;    // 默认年份\n        this.color = \"Black\"\
  ; // 默认颜色\n    }\n\n    // 显示信息的方法\n    public void displayInfo() {\n        System.out.println(\"\
  Car Model: \" + model);\n        System.out.println(\"Car Year: \" + year);\n  \
  \      System.out.println(\"Car Color: \" + color);\n    }\n}\n\npublic class Main\
  \ {\n    public static void main(String[] args) {\n        // 使用构造函数 1\n       \
  \ Car myCar = new Car(\"Tesla\", 2023, \"Red\");\n        myCar.displayInfo();\n\
  \n        // 使用构造函数 2（重载的构造函数）\n        Car defaultCar = new Car(\"Honda\");\n \
  \       defaultCar.displayInfo();\n    }\n}\n```\n\n在这里，我们添加了另一个仅接收 `model` 参数的构造函数，为\
  \ `year` 和 `color` 设置了默认值。当你希望为对象的创建提供灵活性时，这是一个非常有用的功能。\n\n***\n\n### 构造函数中的 `this`\
  \ 关键字\n\nJava 中的 `this` 关键字指向当前对象实例。在构造函数需要区分实例变量（字段）和方法参数时（特别是当它们同相同时），它特别有用。\n\
  \n如果没有 `this`，Java 会混淆局部参数和类字段。使用 `this` 可以明确表示你指代的是对象字段。\n\n#### 示例：`this` 关键字\n\
  \n```java\npublic class Car {\n    // 实例变量（属性）\n    String model;\n    int year;\n\
  \    String color;\n\n    // 使用 'this' 区分字段和参数的构造函数\n    public Car(String model,\
  \ int year, String color) {\n        this.model = model;\n        this.year = year;\n\
  \        this.color = color;\n    }\n\n    // 显示信息的方法\n    public void displayInfo()\
  \ {\n        System.out.println(\"Car Model: \" + model);\n        System.out.println(\"\
  Car Year: \" + year);\n        System.out.println(\"Car Color: \" + color);\n  \
  \  }\n}\n```\n\n\n\n\n\n构造函数链（Constructor chaining）是指在同一个类中从一个构造函数调用另一个构造函数。这通常通过使用\
  \ `this()`关键字来实现。当你想要重用类代码的同时提供多种初始化对象的方式时，构造函数链非常有用。\n\n### 示例：构造函数链\n\n```java\n\
  public class Car {\n    // 实例变量\n    String model;\n    int year;\n    String color;\n\
  \n    // 构造函数 1: 初始化所有字段\n    public Car(String model, int year, String color) {\n\
  \        this.model = model;\n        this.year = year;\n        this.color = color;\n\
  \    }\n\n    // 构造函数 2: 使用默认值调用构造函数 1\n    public Car(String model) {\n       \
  \ this(model, 2022, \"Black\");  // 调用构造函数 1\n    }\n\n    // 显示汽车信息的方法\n    public\
  \ void displayInfo() {\n        System.out.println(\"Car Model: \" + model);\n \
  \       System.out.println(\"Car Year: \" + year);\n        System.out.println(\"\
  Car Color: \" + color);\n    }\n}\n\npublic class Main {\n    public static void\
  \ main(String[] args) {\n        // 使用构造函数 1\n        Car myCar = new Car(\"Tesla\"\
  , 2023, \"Red\");\n        myCar.displayInfo();\n\n        // 使用构造函数 2（构造函数链）\n\
  \        Car defaultCar = new Car(\"Honda\");\n        defaultCar.displayInfo();\n\
  \    }\n}\n```\n\n在上面的示例中，第二个构造函数 `Car(String model)` 通过 `this(model, 2022, \"Black\"\
  );` 调用了第一个构造函数 `Car(String model, int year, String color)`。这是一种在避免代码重复的同时，为对象初始化提供灵活性的整洁方法。\n\
  \n***\n\n## 5.4 实例 vs 静态\n\n在 Java 中，理解实例（instance）和静态（static）的区别是编写高效、可维护且结构良好的代码的关键。这两个概念涉及变量和方法在类内部如何访问和管理，它们决定了成员属于类的实例还是属于类本身。让我们深入探讨这两种类型，看看何时以及为什么要使用每种类型。\n\
  \n***\n\n### 实例成员\n\n实例变量和实例方法与类的特定实例（或对象）绑定。每当创建一个类的新对象时，都会创建这些这些成员的全新副本。\n\n-\
  \ 实例变量是每个对象所独有的。\n- 实例方法绑定到单个对象，这意味着它们可以访问并修改该特定对象的实例变量。\n\n简而言之，实例成员是那些特定于对象的成员，每个对象都拥有这些成员的自己的副本。\n\
  \n### 示例：实例变量和方法\n\n```java\npublic class Car {\n    // 实例变量\n    String model;\n\
  \    int year;\n\n    // 初始化实例变量的构造函数\n    public Car(String model, int year) {\n\
  \        this.model = model;\n        this.year = year;\n    }\n\n    // 实例方法\n\
  \    public void displayInfo() {\n        System.out.println(\"Car Model: \" + model);\n\
  \        System.out.println(\"Car Year: \" + year);\n    }\n\n    public static\
  \ void main(String[] args) {\n        // 创建 Car 类的实例\n        Car car1 = new Car(\"\
  Tesla\", 2023);\n        Car car2 = new Car(\"Ford\", 2022);\n\n        // 对每个对象调用实例方法\n\
  \        car1.displayInfo();\n        car2.displayInfo();\n    }\n}\n```\n\n在此示例中：\n\
  - `Car` 类拥有实例变量 `model` 和 `year`。这些是每个 `Car` 对象独有的。\n- 每个汽车对象（`car1`, `car2`）都可以有自己的\
  \ `model` 和 `year`。\n- `displayInfo()` 方法是一个实例方法。它访问调用它的特定对象的实例变量，并作用于单个实例的数据。\n\
  \n***\n\n### 静态成员\n\n静态成员属于类而不是属于任何特定实例。当成员被声明为 `static` 时，意味着该成员只有一份副本，供类的所有实例共享。可以在不创建类实例的情况下访问静态变量和方法。\n\
  \n- 静态变量在类的所有对象之间共享的。\n- 静态方法可以在不创建对象的情况下调用，但它们只能直接访问其他静态成员（包括变量和方法）。\n\n当你需要在类的所有实例之间共享数据或方法，或者当你想要执行不依赖特定对象状态的操作时，静态成员会特别有用。\n\
  \n### 示例：静态变量和方法\n\n```java\npublic class Car {\n    // 实例变量\n    String model;\n\
  \    int year;\n\n    // 在所有实例共享的静态变量\n    static int carCount = 0;\n\n    // 初始化实例变量并增加\
  \ carCount 的构造函数\n    public Car(String model, int year) {\n        this.model =\
  \ model;\n        this.year = year;\n        carCount++; // 增加静态变量\n    }\n\n  \
  \  // 实例方法\n    public void displayInfo() {\n        System.out.println(\"Car Model:\
  \ \" + model);\n        System.out.println(\"Car Year: \" + year);\n    }\n\n  \
  \  // 静态方法\n    public static void displayCarCount() {\n        System.out.println(\"\
  Total number of cars: \" + carCount);\n    }\n\n    public static void main(String[]\
  \ args) {\n        // 创建 Car 类的实例\n        Car car1 = new Car(\"Tesla\", 2023);\n\
  \        Car car2 = new Car(\"Ford\", 2022);\n\n        // 调用实例方法\n        car1.displayInfo();\n\
  \        car2.displayInfo();\n\n        // 调用静态方法\n        Car.displayCarCount();\n\
  \    }\n}\n```\n\n在此示例中：\n- `carCount` 是所有实例共享的静态变量。\n- `displayCarCount()` 是一个可以在不创建实例的情况下的静态方法。\n\
  - `car1.displayInfo()` 和 `car2.displayInfo()` 是实例方法。\n- `Car.displayCarCount()`\
  \ 使用类名调用。\n\n***\n\n### 何时使用实例 静态\n\n使用实例还是静态取决于类的设计和行为。\n\n- 当数据或行为特定于对象时，使用实例变量和方法。例如，如果你有一个\
  \ `Car` 类，每辆汽车可能有自己的 `model`、`year` 以及其他随汽车变化的属性。\n- 当你需要共享不依赖于实例的数据或功能时，使用静态变量和方法。例如，跟踪创建了多少\
  \ `Car` 对象的计数应该是静态的，因为这是类属性，而不是单个汽车的属性。\n\n***\n\n### 实例与静态成员的主要区别\n\n| 特性 | 实例成员\
  \ | 静态成员 |\n| :--- | :--- | :--- |\n| 归属 | 属于特定的对象实例。 | 属于类本身，供所有实例共享。 |\n| 访问方式\
  \ | 通过对象访问。 | 通过类本身或通过对象访问。 |\n| 内存 | 每个对象都有属于自己的实例成员副本。 | 只有一份静态成员副本，所有实例共享。 |\n\
  | 用途 | 适用于特定对象的属性和行为。 | 适用于所有对象共享的属性和行为。 |\n| 关键字 | 不使用 `static` 关键字声明。 | 使用 `static`\
  \ 关键字声明。 |\n\n\n\n\n\n```java\nSystem.out.println(\"Account Holder: \" + accountHolder);\n\
  System.out.println(\"Balance: $\" + balance);\n\n}\n\n// Static method to display\
  \ the total number of accounts\n\npublic static void displayTotalAccounts() {\n\
  \    System.out.println(\"Total Accounts: \" + totalAccounts);\n}\n\npublic static\
  \ void main(String[] args) {\n    // Creating two BankAccount objects\n    BankAccount\
  \ account1 = new BankAccount(\"Alice\", 1500.00);\n    BankAccount account2 = new\
  \ BankAccount(\"Bob\", 3000.00);\n    // Displaying individual account information\n\
  \    account1.displayAccountInfo();\n    account2.displayAccountInfo();\n    //\
  \ Displaying the total number of accounts\n    BankAccount.displayTotalAccounts();\
  \  // Static method called via class name\n}\n\n}\n```\n\n在这个示例中：\n\n- `accountHolder`\
  \ 和 `balance` 是实例变量，因为它们每个账户都是唯一的。\n- `totalAccounts` 是一个静态变量，因为它跟踪了创建的账户总数，并且在所有\
  \ `BankAccount` 对象之间共享。\n- `displayTotalAccounts()` 方法是静态的，允许你直接在类上调用它，而无需创建实例。\n\
  \n***\n\n## 动手项目：银行账户类\n\n在本次动手项目中，我们将使用 Java 构建一个简单的银行账户类。该类将管理银行账户，允许我们执行如存款、取款、检查账户余额和显示账户详情等操作。我们将利用实例变量处理特定账户的信息，并利用静态变量跟踪全局统计数据（例如创建的账户总数）。此项目将让你实践地理解如何应用面向对象的编程概念，如类、对象、实例变量、方法和静态成员。\n\
  \n让我们立即开始，逐步构建 `BankAccount` 类。\n\n***\n\n### 第 1 步：定义 BankAccount 类\n\n我们将开始定义一个\
  \ `BankAccount` 类，它将包含用于账户持有人姓名、余额的实例变量，以及一个跟踪账户总数的静态变量。我们还提供了用于存款、取款和显示账户信息的方法。\n\
  \n```java\npublic class BankAccount {\n    // 账户详情的实例变量\n    private String accountHolder;\n\
  \    private double balance;\n    // 用于跟踪银行账户总数的静态变量\n    static int totalAccounts\
  \ = 0;\n\n    // 构造函数，初始化账户持有者和初始余额\n    public BankAccount(String accountHolder,\
  \ double initialBalance) {\n        this.accountHolder = accountHolder;\n      \
  \  this.balance = initialBalance;\n        totalAccounts++;  // 每当创建一个新账户时增加静态变量的值\n\
  \    }\n\n    // 向账户存款的方法\n    public void deposit(double amount) {\n        if\
  \ (amount > 0) {\n            balance += amount;\n            System.out.println(\"\
  Deposited $\" + amount + \" into \" + accountHolder + \"'s account.\");\n      \
  \  } else {\n            System.out.println(\"存款金额必须为正数。\");\n        }\n    }\n\
  \n    // 从账户取款的方法\n    public void withdraw(double amount) {\n        if (amount\
  \ > 0 && amount <= balance) {\n            balance -= amount;\n            System.out.println(\"\
  Withdrew $\" + amount + \" from \" + accountHolder + \"s account.\");\n        }\
  \ else {\n            System.out.println(\"取款金额无效或资金不足。\");\n        }\n    }\n\n\
  \    // 显示账户信息的方法\n    public void displayAccountInfo() {\n        System.out.println(\"\
  Account Holder: \" + accountHolder);\n        System.out.println(\"Balance: $\"\
  \ + balance);\n    }\n\n    // 显示账户总数的静态方法\n    public static void displayTotalAccounts()\
  \ {\n        System.out.println(\"Total Accounts Created: \" + totalAccounts);\n\
  \    }\n}\n```\n\n#### 代码解释：\n\n- **实例变量**：\n    - `accountHolder`: 一个表示账户持有人姓名的字符串。\n\
  \    - `balance`: 一个用于存储账户当前余额的 double 类型。\n- **静态变量**：\n    - `totalAccounts`:\
  \ 一个跟踪已创建的银行账户总数的静态变量。该变量被 `BankAccount` 类的所有实例共享。\n- **构造函数**：\n    - 构造函数接收两个参数\
  \ `accountHolder` 和 `initialBalance`，并初始化实例变量。每当创建一个新账户时，它还会增加 `totalAccounts` 静态变量的值。\n\
  - **存款方法 (deposit)**：\n    - 该方法允许向账户存款。在将金额添加到余额之前，它会检查该金额是否为正数。\n- **取款方法 (withdraw)**：\n\
  \    - 该方法允许从账户中取款。它会检查取款金额是否为正数以及是否有足够的资金。\n- **显示方法 (display method)**：\n    -\
