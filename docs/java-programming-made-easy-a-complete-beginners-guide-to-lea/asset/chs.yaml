  - **Main 方法**: 在 `main` 方法中，我们创建了 `BankAccount` 类的实例，用账户持有人姓名和初始余额对其初始化。该对象被传递给\
  \ `startATM` 方法以开始 ATM 交互。\n- **startATM 方法**: 该方法包含 ATM 系统的主循环。循环一直运行，直到用户决定退出。用户将看到一个简单的菜单，可以在以下选项之间进行选择：\n\
  \  - 检查余额\n  - 存款\n  - 取款\n  - 退出系统。根据用户的选择，将触发相应的操作（检查余额、存款、取款或退出）。\n- **depositMoney\
  \ 方法**: 该方法允许用户向其账户存款。它读取存款金额并检查其是否有效（大于 0）。如果有效，它将使用 `BankAccount` 类的 `deposit`\
  \ 方法将存款添加到账户余额中。\n- **withdrawMoney 方法**: 该方法用于取款。它会检查输入的取款金额是否有效（大于 0）以及用户是否有足够的余额。如果满足这两个条件，它将使用\
  \ `BankAccount` 类的 `withdraw` 方法进行取款。\n\n***\n\n### BankAccount.java\n\n```java\n\
  public class BankAccount {\n  private String accountHolderName;\n  private double\
  \ balance;\n\n  // Constructor to initialize account with a holder name and initial\
  \ balance\n  public BankAccount(String accountHolderName, double balance) {\n  \
  \  this.accountHolderName = accountHolderName;\n    this.balance = balance;\n  }\n\
  \n  // Getter for the balance\n  public double getBalance() {\n    return balance;\n\
  \  }\n\n  // Deposit method\n  public void deposit(double amount) {\n    balance\
  \ += amount;  // Increase balance by deposit amount\n  }\n\n  // Withdrawal method\n\
  \  public void withdraw(double amount) {\n    if (amount <= balance) {  // Ensure\
  \ there are sufficient funds\n      balance -= amount;  // Deduct the withdrawal\
  \ amount from the balance\n    } else {\n      System.out.println(\"Error: Not enough\
  \ funds.\");\n    }\n  }\n}\n```\n\n### BankAccount 类说明\n\n- **类字段**: `BankAccount`\
  \ 类有两个主要字段：\n  - `accountHolderName`: 用于存储账户持有人姓名的字符串。\n  - `balance`: 用于存储账户当前余额的双精度类型。\n\
  - **构造函数**: 构造函数用账户持有人姓名和初始余额初始化账户。这些值是在 `ATMSystem` 类中创建 `BankAccount` 对象时传递的。\n\
  - **余额 Getter**: `getBalance()` 方法简单地返回账户的当前余额。\n- **存款方法**: `deposit()` 方法将指定的金额添加到余额中。每当用户在\
  \ ATM 系统中存款时，都会调用此方法。\n- **取款方法**: `withdraw()` 方法检查取款金额是否小于或等于当前余额。如果资金充足，它将从余额中扣除指定的金额。否则，它会打印错误信息。\n\
  \n***\n\n### 代码流程总结\n\n- **模块化结构**: ATM 系统被分为两个主要类：`ATMSystem` 和 `BankAccount`。这种模块化方法有助于保持应用程序的条理，并使大型系统更易管理。\n\
  - **用户交互**: `ATMSystem` 处理检查余额、存款和取款的用户交互。使用 `Scanner` 进行输入。\n- **面向对象设计**: 我们在项目中使用面向对象的原则。`BankAccount`\
  \ 类封装了所有与账户的功能。`ATMSystem` 侧重于用户界面。\n- **控制流**: 程序利用基础控制结构（如 `while` 和 `if-else`）来处理各种情况，例如资金不足。\n\
  - **错误处理**: 实现了简单的错误处理以防止无效操作，例如取款超过余额。\n\n\n\n\n\n例如，在一个图书馆管理系统中，你可能会有以下模块：\n\n\
  - 用户身份验证：处理用户登录、注册和角色管理。\n- 物品库存管理：管理图书馆中的书籍、杂志和其他物品。\n- 图书借阅：管理书籍的借和和还流程。\n- 通知：处理电子邮件通知和告警。\n\
  \n每个模块可以由多个类、接口和其他资源组成，这些资源共同工作以执行特定任务。\n\n通过将程序划分为易于管理的模块，你可以更容易独立地开发和维护每个部分。这种模块化还允许更好的测试和调试，因为你可以将问题隔离在特定的模块中。\n\
  \n### 3. 使用类和接口来抽象功能\n\n在面向对象的设计中，类是功能的主要单元。但为了创建更灵活、更具扩展的代码，你应该利用接口和抽象类。这些设计模式允许你的代码更具模块化且解耦，从而更容易扩展和维护。\n\
  \n#### 接口\n\n接口定义了类“应该做什么”的契约，而不是“如何做”。这允许相同功能的不同实现共存并易地进行切换。\n\n```java\npublic\
  \ interface PaymentMethod {\n    void processPayment(double amount);\n}\n\npublic\
  \ class CreditCardPayment implements PaymentMethod {\n    @Override\n    public\
  \ void processPayment(double amount) {\n        System.out.println(\"Processing\
  \ credit card payment of \" + amount);\n    }\n}\n\npublic class PayPalPayment implements\
  \ PaymentMethod {\n    @Override\n    public void processPayment(double amount)\
  \ {\n        System.out.println(\"Processing PayPal payment of \" + amount);\n \
  \   }\n}\n```\n\n在这里，`PaymentMethod` 接口定义了处理支付的契约。我们随后有两个实现：`CreditCardPayment`\
  \ 和 `PayPalPayment`。这种方法允许你在未来轻松地扩展系统以支持更多支付方式，而无需修改现有代码。\n\n#### 抽象类\n\n抽象类允许你定义供多个子类共享的共同行为，同时允许每个子类实现其某些方法的特定版本。\n\
  \n```java\npublic abstract class Animal {\n    public abstract void makeSound();\n\
  \    public void sleep() {\n        System.out.println(\"This animal is sleeping\"\
  );\n    }\n}\n\npublic class Dog extends Animal {\n    @Override\n    public void\
  \ makeSound() {\n        System.out.println(\"Woof!\");\n    }\n}\n```\n\n在这个示例中，`Animal`\
  \ 是一个抽象类，包含一个必须由子类实现的 `makeSound` 方法。`sleep` 方法是一个被所有子类继承的共享行为。\n\n### 4. 使用数据访问对象\
  \ (DAO) 处理数据\n\n在较大的 Java 应用程序中，特别是与数据库交互的程序，将数据访问逻辑分离到单独的层是一个良好实践。数据访问对象 (DAO)\
  \ 是一种用于抽象和封装与数据源所有交互的模式，无论它是数据库、文件系统的任何其他数据存储库。\n\n假设你正在构建一个需要与数据库交互以获取用户详情的应用程序。你可以创建一个\
  \ `UserDAO` 类来处理数据库交互：\n\n```java\npublic class UserDAO {\n    public User getUserById(int\
  \ id) {\n        // Code to fetch user from database using the provided id\n   \
  \ }\n    public void saveUser(User user) {\n        // Code to save user to the\
  \ database\n    }\n}\n```\n\n这样，你的业务逻辑就不需要关心数据存储和检索的细节。`DAO` 类隔离了所有的数据库操作，使你的代码更易维护和测试。\n\
  \n### 5. 异常处理\n\n随着程序的增长，妥善处理错误变得越来越重要。Java 提供了丰富的异常处理机制，你应该使用它来优雅地捕获和处理错误。\n\n\
  良好的实践是为特定的应用程序错误定义自定义异常。例如，在 ATM 系统中，你可能有一个针对余额不足的异常：\n\n```java\npublic class InsufficientFundsException\
  \ extends Exception {\n    public InsufficientFundsException(String message) {\n\
  \        super(message);\n    }\n}\n```\n\n在你的业务逻辑中，当用户尝试提取超过其拥有的金额时，你可以抛出此异常：\n\
  \n```java\npublic void withdraw(double amount) throws InsufficientFundsException\
  \ {\n    if (amount > balance) {\n        throw new InsufficientFundsException(\"\
  Insufficient funds for this withdrawal.\");\n    }\n    balance -= amount;\n}\n\
  ```\n\n这种自定义异常有助于保持清晰度，并允许你的程序以一致的方式响应错误。\n\n### 6. 遵循单一职责原则 (SRP)\n\n软件设计中最重要的原则之一是单一职责原则\
  \ (SRP)。该原则规定每个类应该只有一个责任或工作。通过遵循 SRP，你的类将变得更小、更集中且更容易维护。\n\n例如，假设你有一个同时处理用户数据和身份验证的\
  \ `User` 类。这违反了 SRP，因为该类有两个职责。相反，你应该创建单独类，例如用于数据的 `User` 和处理身份验证的 `Authenticator`。\n\
  \n```java\npublic class User {\n    private String name;\n    private String email;\n\
  \    // Getter and Setter methods\n}\n\npublic class Authenticator {\n    public\
  \ boolean authenticate(User user, String password) {\n        // Code to authenticate\
  \ the user\n        return true;\n    }\n}\n```\n\n通过拆分职责，你的类将变得更具维护性且更容易测试。\n\n\
  ### 7. 组织你的目录结构\n\n对于大型 Java 项目，正确组织目录结构至关重要。一个典型的目录结构可能如下：\n\n```bash\n/src\n \
  \ /com\n    /mycompany\n      /ecommerce\n        /products\n          Product.java\n\
  \        /orders\n          Order.java\n      /users\n        User.java\n      /payment\n\
  \        PaymentMethod.java\n        CreditCardPayment.java\n        PayPalPayment.java\n\
  \      /utils\n        Logger.java\n        Validator.java\n/lib\n  external-library.jar\n\
  ```\n\n- `/src`：包含源代码。\n- `/lib`：包含第三方库。\n- `/resources`：包含配置文件、图像或数据库脚本等非代码文件。\n\
  \n通过保持良好的组织，可以在应用程序增长时更容易找到并更新特定部分。\n\n* *\n\n# 附录\n\n* *\n\n## Java 关键字与语法表\n\n\
  Java 是一种拥有丰富语法规则的语言，规则有助于定义代码的结构和行为。如果你开始学习 Java，理解关键字是至关重要的一步。它们是语言的骨干，也是构建 Java\
  \ 应用程序的基础。在本章中，我们将涵盖 Java 的核心关键字并提供带有实用示例的简洁语法指南，帮助你有效地使用它们。\n\n#### Java 关键字\n\n\
  Java 有 53 个保留关键字，每个关键字都有特定的用途。这些关键字不能作为变量名、方法名或类名。我们将这些关键字分为易于管理的部分，并对每个进行示例说明其用法。\n\
  \n| 关键字 | 说明 | 示例 |\n| :--- | :--- | :--- |\n| `abstract` | 声明抽象类或方法。抽象类不能直接实例化，作为其他类的蓝图。\
  \ | `abstract class Animal { abstract void sound(); }` |\n| `assert` | 用于调试。它测试表达式，如果假则抛出异常。\
  \ | `assert x > 0 : \"x is negative\";` |\n| `boolean` | 定义布尔数据类型，可以存储真或假值。 | `boolean\
  \ isActive = true;` |\n| `break` | 退出循环或 `switch` 语句。 | `if (x > 10) break;` |\n\
  | `byte` | 定义一个 8 位符号整数数据类型。 | `byte b = 100;` |\n| `case` | 定义 `switch` 语句中的一个分支。\
  \ | `switch (day) { case 1: System.out.println(\"Monday\"); }` |\n\n\n\n\n\n| 关键字\
  \ | 描述 | 示例 |\n| :--- | :--- | :--- |\n| `catch` | 捕获由 `try` 块抛出的异常。 | `try { ...\
  \ } catch (Exception e) { ... }` |\n| `char` | 定义字符数据类型。 | `char letter = 'A';`\
  \ |\n| `class` | 声明一个类。 | `class Car { String model; }` |\n| `const` | 留供未来使用，在\
  \ Java 中未使用。 | `(Not used in Java)` |\n| `continue` | 跳过循环的当前迭代并进入下一次。 | `if (x\
  \ < 0) continue;` |\n| `default` | 指定 `switch` 语句中的默认情况。 | `switch (day) { default:\
  \ System.out.println(\"Unknown day\"); }` |\n| `do` | 定义 `do-while` 循环的开始。 | `do\
  \ { System.out.println(\"Running...\"); } while (x < 10);` |\n| `double` | 定义双精度浮点数。\
  \ | `double pi = 3.14159;` |\n| `else` | 当 `if` 条件为假时执行的代码块。 | `if (x > 10) { ...\
  \ } else { ... }` |\n| `enum` | 定义一个持有常量的特殊类类型。 | `enum Day { MONDAY, TUESDAY, WEDNESDAY\
  \ }` |\n| `extends` | 表示一个类继承自父类。 | `class Dog extends Animal {}` |\n| `final` |\
  \ 用于定义常量、防止方法重写或防止继承。 | `final int MAX_SIZE = 100;` |\n| `finally` | 定义在 `try` 块之后始终执行的代码块，无论是否抛出异常。\
  \ | `finally { System.out.println(\"Done!\"); }` |\n| `float` | 定义单精度浮点数。 | `float\
  \ temperature = 36.6f;` |\n| `for` | 定义一个用于执行的 `for` 循环。 | `for (int i = 0; i <\
  \ 5; i++) { System.out.println(i); }` |\n| `goto` | 留供未来使用，在 Java 中未使用。 | `(Not\
  \ used in Java)` |\n| `if` | 定义一个条件代码块。 | `if (x > 0) { System.out.println(\"Positive\"\
  ); }` |\n| `implements` | 声明一个类实现某个接口。 | `class Dog implements AnimalBehavior {}`\
  \ |\n| `import` | 导入类或整个包供当前文件使用。 | `import java.util.Scanner;` |\n| `instanceof`\
  \ | 测试对象是否是特定类或接口的实例。 | `if (obj instanceof String) { ... }` |\n| `int` | 定义一个 32\
  \ 位整数数据类型。 | `int score = 100;` |\n| `interface` | 定义一个接口，可以被类实现。 | `interface Animal\
  \ { void sound(); }` |\n| `long` | 定义一个 64 位整数数据类型。 | `long distance = 1234567890L;`\
  \ |\n| `native` | 指定方法由原生代码（通常是 C 或 C++）实现。 | `public native void print();` |\n\
  | `new` | 创建新对象。 | `Person p = new Person();` |\n| `null` | 代表空值，意味着没有引用。 | `String\
  \ str = null;` |\n| `package` | 定义一个包或命名空间，用于组织类。 | `package com.example;` |\n|\
  \ `private` | 指定字段或方法仅在类内部可见。 | `private int age;` |\n| `protected` | 指定字段或方法在同一包内或子类中可见。\
  \ | `protected void display() {}` |\n| `public` | 指定字段或方法在任何地方均可见。 | `public void\
  \ print() {}` |\n| `return` | 从方法返回值。 | `return x + y;` |\n| `short` | 定义 16 位整数数据类型。\
  \ | `short number = 3200;` |\n| `static` | 表示字段或方法属于类而不是实例。 | `static int counter\
  \ = 0;` |\n| `super` | 指向当前对象的父类。 | `super.print();` |\n| `switch` | 根据条件执行不同的代码部分。\
  \ | `switch (day) { case 1: ... }` |\n| `synchronized` | 定义线程安全的代码块。 | `synchronized(this)\
  \ { ... }` |\n| `this` | 指向方法或构造函数中的当前对象。 | `this.name = name;` |\n| `throw` | 显式抛出异常。\
  \ | `throw new Exception(\"Error!\");` |\n| `throws` | 声明可能抛出的异常。 | `public void\
  \ myMethod() throws IOException {}` |\n| `transient` | 将字段排除在序列化之外。 | `private transient\
  \ int temp;` |\n| `try` | 定义可能抛异常的代码块。 | `try { ... } catch (Exception e) { ...\
  \ }` |\n| `void` | 指定方法不返回任何值。 | `public void display() {}` |\n| `volatile` | 指定字段可能会被多个线程修改。\
  \ | `private volatile boolean flag;` |\n| `while` | 定义条件真就持续的 `while` 循环。 | `while\
  \ (x > 0) { ... }` |\n\n***\n\n## Java 语法基础\n\n在涵盖了关键字之后，让我们来看您在编写 Java 代码时会遇到的一些基础语法规则。以下是快速概览：\n\
  \n### 类和方法\n每个 Java 应用程序至少有一个类，在类内部您通常定义方法来执行操作。\n\n```java\npublic class MyFirstClass\
  \ {\n    public static void main(String[] args) {\n        System.out.println(\"\
  Hello, Java!\");\n    }\n}\n```\n\n### 变量声明\n变量必须声明类型。\n\n```java\nint number =\
  \ 10;\nString name = \"John\";\nboolean isActive = true;\n```\n\n### 流程结构\nJava\
  \ 包含了 `if`、`for` 和 `switch` 等用于条件和迭代操作的结构。\n\n```java\nif (number > 5) {\n    System.out.println(\"\
  Number is greater than 5\");\n}\n```\n\n### 循环\nJava 支持三种循环：`for`、`while` 和 `do-while`。\n\
  \n```java\nfor (int i = 0; i < 5; i++) {\n    System.out.println(i);\n}\n```\n\n\
  #### 代码示例：使用 Java 关键字\n让我们通过一个使用了多个关键字的示例将一切整合起来：\n\n```java\npublic class BankAccount\
  \ {\n    // 实例变量\n    private String accountHolder;\n    private double balance;\n\
  \n    // 构造函数\n    public BankAccount(String accountHolder, double balance) {\n\
  \        this.accountHolder = accountHolder;\n        this.balance = balance;\n\
  \    }\n\n    // 存款方法\n    public void deposit(double amount) {\n        if (amount\
  \ > 0) {\n            balance += amount;\n            System.out.println(\"Deposited:\
  \ \" + amount);\n        } else {\n            System.out.println(\"Invalid deposit\
  \ amount.\");\n        }\n    }\n\n    // 取款方法\n    public void withdraw(double\
  \ amount) {\n        if (amount <= balance && amount > 0) {\n            balance\
  \ -= amount;\n            System.out.println(\"Withdrew: \" + amount);\n       \
  \ } else {\n            System.out.println(\"Insufficient balance or invalid amount.\"\
  );\n        }\n    }\n\n    // 显示账户信息的方法\n    public void display() {\n        System.out.println(\"\
  Account Holder: \" + accountHolder);\n        System.out.println(\"Balance: $\"\
  \ + balance);\n    }\n\n    // 运行的主方法\n    public static void main(String[] args)\
  \ {\n        BankAccount myAccount = new BankAccount(\"Alice\", 1000.0);\n     \
  \   myAccount.deposit(500.0);\n        myAccount.withdraw(200.0);\n        myAccount.display();\n\
  \    }\n}\n```\n\n---\n\n这份备查表在您刚开始学习或需要快速回顾 Java 基础元素时是一份很棒的。随着经验的增加，这些关键字和语法模式将成为本能，但随手可用非常有帮助。继续构建和测试小程序以强化这些概念。\n\
