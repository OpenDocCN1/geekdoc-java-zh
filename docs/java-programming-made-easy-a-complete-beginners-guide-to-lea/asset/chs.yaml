  Successfully withdrew $\" + amount);\n        }\n    }\n}\n```\n\n### 第 2 步：BankAccount\
  \ 类\n\n`BankAccount` 类是一个存储持卡人姓名和余额等信息的简单类。它还将包含存款和取款的方法，以及获取余额的 getter 方法。\n\n\
  ```java\npublic class BankAccount {\n    private String accountHolderName;\n   \
  \ private double balance;\n\n    // 构造函数，用持卡人姓名和初始余额初始化账户\n    public BankAccount(String\
  \ accountHolderName, double balance) {\n        this.accountHolderName = accountHolderName;\n\
  \        this.balance = balance;\n    }\n\n    // 余额 getter\n    public double getBalance()\
  \ {\n        return balance;\n    }\n\n    // 存款方法\n    public void deposit(double\
  \ amount) {\n        balance += amount;\n    }\n\n    // 取款方法\n    public void withdraw(double\
  \ amount) {\n        if (amount <= balance) {\n            balance -= amount;\n\
  \        } else {\n            System.out.println(\"Error: Not enough funds.\");\n\
  \        }\n    }\n}\n```\n\n### 第 3 步：理解流程\n\n以下是应用程序流程的分解：\n\n1.  **ATMSystem\
  \ 类**:\n    * `ATMSystem` 类包含 `main` 方法，程序从这里启动。它创建了一个带有初始余额的 `BankAccount` 实例，并将其传递给\
  \ `startATM` 方法以启动用户界面。\n    * `startATM` 方法显示简单的菜单并允许用户选择操作（查询余额、存款、取款或退出）。根据用户的选择，调用相应的方法。\n\
  2.  **BankAccount 类**:\n    * `BankAccount` 类表示账户。它拥有持卡人姓名和余额的字段。\n    * `deposit`\
  \ 方法根据存款金额增加余额，`withdraw` 方法减少余额，并确保资金充足。\n3.  **存款与取款**:\n    * 对于存款和取款，方法会确保输入的金额有效。如果金额为零或负数，将显示错误。\n\
  \    * 如果取款金额超过余额，系统会提示。\n\n### 第 4 步：测试系统\n\n运行 `ATMSystem` 后，你应该能够通过控制台与系统进行交互。选项包括：\n\
  \n* 查询你的余额。\n* 向账户存款。\n* 从你的账户取款。\n* 退出系统。\n\n以下是交互的一个示例：\n\n```\nATM Main Menu:\n\
  1. Check Balance\n2. Deposit Money\n3. Withdraw Money\n4. Exit\nPlease choose an\
