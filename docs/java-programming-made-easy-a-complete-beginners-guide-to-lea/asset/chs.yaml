  \n# 第 4 章：方法与模块化编程\n\n在本章中，我们将探索 Java 中方法（methods）的概念。方法是以模块化方式组织程序的最强大的工具之一。设计良好的方法可以让你的代码更具可读性、可用性和可维护性。我们将涵盖创建和调用方法的基础、理解参数和返回类型，以及如何使用方法重载（method\
  \ overloading）来让你的代码更加灵活。\n\n## 4.1 创建和调用方法\n\n方法是任何 Java 程序的构建区块之一。它们允许你组织代码，使其具有模块化、可重用且易于维护的特点。在本节中，我们将探索如何创建方法、调用方法并理解其背后的基本概念。你将熟悉语法、结构以及如何有效地使用方法。\n\
  \n### 什么是方法？\n\n在 Java 中，方法是执行特定任务的 own 代码块。你可以将方法想象成其他编程语言中的函数，旨在处理特定的操作，例如打印消息、执行计算，甚至与用户输入进行交互。\n\
  \n### 创建方法\n\n方法由三个主要部分组成：\n\n1. 返回类型（Return Type）：指定方法将返回的值的类型。如果方法不返回任何值，我们使用\
  \ `void`。\n2. 方法名（Method Name）：方法的名称，用于调用它。\n3. 方法参数（Method Parameters）：当你调用方法时传递给方法的值。参数是可选的；方法可以有零个、一个或多个参数。\n\
  \n以下是方法的通用结构：\n\n```java\nreturnType methodName(parameters) {\n    // 要执行的代码\n}\n\
  ```\n\n#### 示例：打印消息的简单方法\n\n让我们创建一个简单的方法，向控制台打印问候消息。\n\n```java\npublic class HelloWorld\
  \ {\n    // 打印问候消息的方法\n    public static void greet() {\n        System.out.println(\"\
  Hello, welcome to learning Java!\");\n    }\n\n    public static void main(String[]\
  \ args) {\n        // 调用 greet() 方法\n        greet();  // 这将调用 greet() 方法并打印消息\n\
  }\n}\n```\n\n解释：\n\n* 方法 `greet()` 的返回类型为 `void`，意味着它不返回任何值。\n* 该方法在 `main()` 方法内部被调用，它是程序的入口点。\n\
  * 当我们运行这段代码时，输出为：\n\n```css\nHello, welcome to learning Java!\n```\n\n### 调用方法\n\
  \n一旦你定义了方法，你就可以在类的任何地方调用它，只要它在作用域内。要调用方法，你使用它的名称，后跟括号 `()`。\n\n方法调用主要有两种类型：\n\n\
  1. 静态方法方法调用（Static Method Call）：当你调用一个用 `static` 关键字定义的方法时。\n2. 实例方法调用（Instance\
  \ Method Call）：当你调用属于类实例的方法时（即非静态方法）。\n\n#### 示例：调用方法\n\n考虑以下方法，它相加两个整数并返回总和：\n\n\
  ```java\npublic class Calculator {\n    // 将两个数字相加并返回结果的方法\n    public static int\
  \ add(int num1, int num2) {\n        return num1 + num2;\n    }\n\n    public static\
  \ void main(String[] args) {\n        // 调用 add() 方法并将结果存储在变量中\n        int result\
  \ = add(10, 5);\n        System.out.println(\"The sum is: \" + result);  // 输出:\
  \ 15\n    }\n}\n```\n\n解释：\n\n* 我们定义了一个名为 `add()` 的方法，它接受两个 `int` 参数：`num1` 和 `num2`。\n\
  * 它返回它们的和，其类型为 `int`。\n* 在 `main()` 方法中，我们调用 `add(10, 5)`并将结果存储在 `result` 变量中。\n\
  * 打印输出为：\n\n```python\nThe sum is: 15\n```\n\n### 从方法返回值\n\n方法可以返回可以在程序其他地方使用的值。要实现这一点，你需要在方法签名中指定返回类型，并使用\
  \ `return` 关键字返回一个值。\n\n在以前的示例中，`add()` 方法返回两个数字的和。返回值的类型必须与方法声明中指定的返回类型匹配（在本例中为\
  \ `int`）。\n\n如果方法不需要返回值，你使用 `void` 作为返回类型，这意味着方法执行了某些操作但不返回任何内容。\n\n#### 方法参数\n\n\
  方法参数允许你将数据传递到方法以便它可以处理这些数据。参数定义在方法定义的括号 `()` 内部。\n\n#### 示例：在方法中使用参数\n\n让我们创建一个接受人的名和姓的参数并打印问候的方法。\n\
  \n```java\npublic class PersonalizedGreeting {\n    // 打印问候的方法\n    public static\
  \ void greet(String firstName, String lastName) {\n        System.out.println(\"\
  Hello, \" + firstName + \" \" + lastName + \"!\");\n    }\n\n    public static void\
  \ main(String[] args) {\n        // 带参数调用 greet() 方法\n        greet(\"John\", \"\
  Doe\");\n    }\n}\n```\n\n解释：\n\n* 方法 `greet()` 拥有两个参数：`firstName` 和 `lastName`，类型均为\
  \ `String`。\n* 调用方法时，我们传递了 `\"John\"` 和 `\"Doe\"` 作为参数。\n* 输出将是：\n\n```\nHello,\
  \ John Doe!\n```\n\n 方法签名（Method Signature）\n\n方法签名由方法的名称及其参数列表组成。Java 使用它来标识方法。返回类型不属于方法签名。\n\
  \n例如：\n\n`public static int add(int num1, int num2)` 是一个方法签名，其中：\n\n* `add` 是方法名。\n\
  * `(int num1, int num2)` 是参数列表。\n\nJava 不允许同一个类中有两个签名相同的方法，即使返回类型不同。\n\n## 4.2 方法参数与返回类型\n\
  \n在 Java 中，方法是代码的构建区块，允许你将功能分组为重用的单元。在本节中，我们将探索方法参数和返回类型在创建灵活且可维护的方法中的作用。我们还将查看它们如何允许方法处理数据、接受输入并产生输出。\n\
  \n### 方法参数：向方法传递数据\n\n参数是你想传递到方法的占位符。当你调用方法时，提供的参数必须与方法签名中定义的参数匹配。这允许方法在执行中使用这些参数。\n\
  \n#### 方法参数\n\n你通过在方法签名的括号内列出参数来声明方法。每个参数由一个数据类型和一个变量名组成。\n\n示例：\n\n```java\npublic\
  \ class Rectangle {\n    // 计算矩形面积的方法\n    public static int calculateArea(int length,\
  \ int width) {\n        return length * width;  // 返回长度和宽的乘积\n    }\n\n### public\
  \ static void main(String[] args) {\n        // 带参数 5 和 10 调用 calculateArea() 方法\n\
  \        int area = calculateArea(5, 10);\n        System.out.println(\"The area\
  \ of the rectangle is: \" + area);  // 输出: 50\n    }\n}\n```\n\n\n\n\n当你调用一个方法时，你传递的是实际值（称为参数），这些值与方法定义中的参数相对应。参数的顺序和数据类型必须与方法签名匹配。\n\
  \n```java\npublic class Sum {\n    // Method to add two numbers\n    public static\
  \ int add(int num1, int num2) {\n        return num1 + num2;  // Returns the sum\
  \ of num1 and num2\n    }\n\n    public static void main(String[] args) {\n    \
  \    // Calling add() with two integers\n        int result = add(3, 4);\n     \
  \   System.out.println(\"Sum: \" + result);  // Output: 7\n    }\n}\n```\n\n解释：\n\
  - 我们定义了一个方法 `add()`，它接收两个类型为 `int` 的型参数。\n- 在方法内部，我们计算了 `num1` 和 `num2` 的和，然后返回结果。\n\
  - 在调用方法时传递了参数 `3` 和 `4`，并打印了结果：`7`。\n\n***\n\n### 返回类型：从方法返回数据\n\n方法可以返回一个值，允许你将数据传回给调用代码。返回类型定义了方法将返回什么类型的值。如果方法不需要返回任何值，则使用\
  \ `void` 返回类型。\n\n#### 使用返回类型\n\n让我们定义一个向调用者返回结果的方法。在这种情况下，我们将计算一个数字的平方。\n\n```java\n\
  public class SquareCalculator {\n    // Method to calculate the square of a number\n\
  \    public static int square(int number) {\n        return number * number;  //\
  \ Returns the square of the number\n    }\n\n    public static void main(String[]\
  \ args) {\n        // Calling square() with an argument of 5\n        int result\
  \ = square(5);\n        System.out.println(\"The square of 5 is: \" + result); \
  \ // Output: 25\n    }\n}\n```\n\n解释：\n- 方法 `square()` 的返回类型为 `int`，这意味着它返回一个整数。\n\
  - 在方法内部，将数字与其相乘，并将结果返回给调用者。\n- 当我们调用 `square(5)` 时，打印了结果 `25`。\n\n#### void 方法：无返回值\n\
  \n并不是所有方法都需要返回值。对于这些方法，你使用 `void` 返回类型。带有 `void` 的执行操作（例如打印消息或更新值），但不向调用者返回任何内容。\n\
  \n```java\npublic class MessagePrinter {\n    // Method to print a message\n   \
  \ public static void printMessage() {\n        System.out.println(\"This is a message!\"\
  );\n    }\n\n    public static void main(String[] args) {\n        // Calling printMessage()\
  \ method\n        printMessage();  // Output: This is a message!\n    }\n}\n```\n\
  \n解释：\n- 方法 `printMessage()` 声明为 `void`，意味着它不返回任何值。\n- 该方法简单地向控制台打印消息。\n- 在 `main()`\
  \ 方法中，我们调用了 `printMessage()`，它的输出为：\n\n```csharp\nThis is a message!\n```\n\n***\n\
  \n### 多返回值类型：使用重载方法\n\n有时，你可能想创建一个执行相同任务但处理不同类型输入的方法。Java 允许你重载方法，这意味着你可以定义多个具有相同名称但参数列表不同的方法（即不同的参数数量或类型）。返回类型不是方法签名的一部分，因此重载必须依赖于参数。\n\
  \n#### 示例：方法重载\n\n让我们重载一个方法来计算形状的面积，可以是矩形或正方形。\n\n```java\npublic class ShapeArea\
  \ {\n    // Method to calculate the area of a rectangle\n    public static int calculateArea(int\
  \ length, int width) {\n        return length * width;\n    }\n\n    // Overloaded\
  \ method to calculate the area of a square\n    public static int calculateArea(int\
  \ side) {\n        return side * side;\n    }\n\n    public static void main(String[]\
  \ args) {\n        // Calling the overloaded methods\n        int rectangleArea\
  \ = calculateArea(5, 10);\n        int squareArea = calculateArea(4);\n        System.out.println(\"\
  Rectangle area: \" + rectangleArea);  // Output: 50\n        System.out.println(\"\
  Square area: \" + squareArea);      // Output: 16\n    }\n}\n```\n\n解释：\n- 方法 `calculateArea()`\
  \ 被重载了：一个版本接受矩形的长度和宽两个参数，而另一个版本接受正方形边的单个参数。\n- 当我们调用 `calculateArea(5, 10)` 时，它计算矩形的面积；当我们调用\
  \ `calculateArea(4)` 时，它计算正方形的面积。\n\n***\n\n### 传递多个参数\n\n方法还可以接收多个参数，使其能够处理更复杂的操作。这里是一个接收三个参数并返回这三个数字平均值的方法示例。\n\
  \n```java\npublic class AverageCalculator {\n    // Method to calculate the average\
  \ of three numbers\n    public static double calculateAverage(int num1, int num2,\
  \ int num3) {\n        return (num1 + num2 + num3) / 3.0;\n    }\n\n    public static\
  \ void main(String[] args) {\n        // Calling calculateAverage() with three arguments\n\
  \        double average = calculateAverage(10, 20, 30);\n        System.out.println(\"\
  The average is: \" + average);\n    }\n}\n```\n\n解释：\n- 方法 `calculateAverage()`\
  \ 接收三个参数。\n- 它返回三个数字的平均值。\n\n```csharp\nThe average is: 20.0\n```\n\n\n\n\n-   `add()`\
  \ 方法被重载了三次，每个版本都具有不同的参数列表。\n- 第一个版本接受两个 `int` 参数。\n- 第二个版本接受三个 `int` 参数。\n- 第三个版本接受两个\
  \ `double` 参数。\n- 当调用 `add()` 时，Java 将根据传入的参数数量和类型选择正确的版本。\n\n## 方法重载的规则\n\n虽然方法重载非常强大，但有几条重要的规则需要记住：\n\
  \n### 不同的参数数量\n你可以通过更改方法签名中参数的数量来重载方法。\n\n```java\npublic static int multiply(int\
  \ a, int b) {\n    return a * b;\n}\n\npublic static int multiply(int a, int b,\
  \ int c) {\n    return a * b * c;\n}\n```\n\n### 不同的参数类型\n你可以通过更改参数的类型来重载方法。\n\n\
  ```java\npublic static double add(double a, double b) {\n    return a + b;\n}\n\n\
  public static int add(int a, int b) {\n    return a + b;\n}\n```\n\n### 相同的数量和类型，不同的顺序\n\
  当参数类型相同但顺序不同时，也可以发生重载。\n\n```java\npublic static void printDetails(String name,\
  \ int age) {\n    System.out.println(\"Name: \" + name + \", Age: \" + age);\n}\n\
  \npublic static void printDetails(int age, String name) {\n    System.out.println(\"\
  Age: \" + age + \", Name: \" + name);\n}\n```\n\n## 使用不同返回类型的重载\n\n你可能认为 Java 允许你根据返回类型来重载方法，但实际上这是不可能的。返回类型不能区分重载方法。方法必须在参数列表上不同才能实现重载。\n\
  \n以下示例代码无法编译：\n\n```java\npublic static int add(int num1, int num2) {\n    return\
  \ num1 + num2;\n}\n\npublic static double add(int num1, int num2) { // ：方法签名相同！\n\
  \    return num1 + num2;\n}\n```\n\n尽管返回类型不同（`int` 与 `double`），但两个方法仍然具有相同的参数列表（`int\
  \ num1`, `int num2`），因此会导致编译时错误。\n\n## 实际示例：方法重载的运用\n\n让我们来看一个方法重载可以派上用场的更实际示例。假设我们正在开发一个计算不同形状周长的程序：矩形、正方形和圆。我们可以使用方法重载来为每个形状的周长定义独立的方法。\n\
  \n```java\npublic class ShapePerimeter {\n    // 计算矩形周长的方法\n    public static int\
  \ perimeter(int length, int width) {\n        return 2 * (length + width);\n   \
  \ }\n\n    // 计算正方形周长的重载方法\n    public static int perimeter(int side) {\n      \
  \  return 4 * side;\n    }\n\n    // 计算圆的周长的重载方法\n    public static double perimeter(double\
  \ radius) {\n        return 2 * Math.PI * radius;\n    }\n\n    public static void\
  \ main(String[] args) {\n        // 计算不同形状的周长\n        int rectanglePerimeter =\
  \ perimeter(5, 10); // 矩形：2 * (5 + 10)\n        int squarePerimeter = perimeter(4);\
  \        // 正方形：4 * 4\n        double circlePerimeter = perimeter(7.5);    // 圆：2\
  \ * π * 7.5\n\n        System.out.println(\"Rectangle Perimeter: \" + rectanglePerimeter);\
  \  // 输出：30\n        System.out.println(\"Square Perimeter: \" + squarePerimeter);\
  \      // 输出：16\n        System.out.println(\"Circle Perimeter: \" + circlePerimeter);\
  \      // 输出：47.12388980384689\n    }\n}\n```\n\n**解释：**\n- 我们定义了三个重载方法，它们的名称都命名为\
  \ `perimeter()`，用于处理不同形状的周长计算：\n    - 矩形，接受两个 `int` 值（`length` 和 `width`）。\n   \
  \ - 正方形，接受一个 `int` 值（`side`）。\n    - 圆，接受一个 `double` 值（`radius`）。\n- 根据参数的类型和数量，Java\
  \ 会自动调用方法的正确版本。\n\n## 动手实践项目：单位转换器应用\n\n在本章中，我们将运用目前学到的所有知识创建一个实用的应用程序：单位转换器。这个简单的应用将允许用户在不同的测量单位之间进行转换，例如长度、重量和温度。完成此项目后，你将对如何在\
  \ Java 中使用方法、循环、条件判断和用户输入有更深入的。\n\n### 应用将实现什么？\n\n单位转换器应用将允许用户：\n- 转换距离（例如，公里到英里）。\n\
  - 转换重量（例如，公斤到磅）。\n- 转换温度（例如，摄氏度到华氏度）。\n\n我们将专注于一个基于控制台的应用，但其结构可以扩展为基于 GUI 的应用。\n\
  \n### 准备项目\n\n在开始之前，请确保你已经安装并准备好了 Java。\n\n### 第一步：为每种转换创建一个方法\n\n现在让我们从定义应用将执行的转换方法开始。每个方法将接受一个数字作为输入并返回转换后的值。\n\
  \n```java\npublic class UnitConverter {\n    // 将公里转换为英里的方法\n    public static double\
