  重玩功能示例：\n```java\nSystem.out.print(\"你想再玩一次吗？(y/n) \");\nString playAgain = scanner.next();\n\
  if (playAgain.equalsIgnoreCase(\"y\")) {\n    // 重新启动游戏的逻辑\n}\n```\n\n\n\n\n\n```java\n\
