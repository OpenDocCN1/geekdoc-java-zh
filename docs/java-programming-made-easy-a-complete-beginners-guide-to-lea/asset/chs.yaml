  \            guess = scanner.nextInt();\n            attempts++;\n\n           \
  \ if (guess < secretNumber) {\n                System.out.println(\"太小了！再试一次.\"\
  );\n            } else if (guess > secretNumber) {\n                System.out.println(\"\
  太大了！再试一次.\");\n            } else {\n                System.out.println(\"恭喜！你用了\
  \ \" + attempts + \" 次猜中了。\");\n            }\n        }\n        scanner.close();\n\
  \    }\n}\n```\n\n### 第三步：增强体验\n你可以通过添加更多功能来进一步改进游戏，例如：\n\n**输入验证**：目前程序假设用户总是输入有效的整数。如果用户输入了字符串或其他意外内容怎么办？添加输入验证会让游戏更健壮。\n\
