  例如，假设你输入了以下内容：\n\n`java FPAdder 1 1e2 3.0 4.754`\n\n程序将显示 `108.75`。根据你的区域设置，小数点可能是逗号而不是句号。\n\
  \n## 答案\n\n你可以在 `http://docs.oracle.com/javase/tutorial/java/data/QandE/numbers-answers.html`\
  \ 找到这些问题和练习的答案。\n\n## 字符\n\n大多数情况下，如果你使用单个字符值，将使用基本数据类型 `char`。这是一个示例：\n\n点击此处查看代码图片\n\
  \n```java\nchar ch = 'a';\n\n// 大写希腊字母 omega 字符的 Unicode 编码\nchar uniChar = '\\\
  u039A';\n\n// 一个字符数组\nchar[] charArray = { 'a', 'b', 'c', 'd', 'e' };\n```\n\n但是，有时你需要将\
  \ `char` 作为对象使用（例如，在期望对象的方法的参数中）。Java 编程语言提供了一个包装类，为了此目的将 `char` “包装”在一个 `Character`\
  \ 对象中。`Character` 类型的对象包含一个单一字段，其类型为 `char`。该 `Character` 类还提供了许多实用的类方法（即静态方法）来操作字符。\n\
  \n你可以使用 `Character` 构造函数创建一个 `Character` 对象：\n\n```java\nCharacter ch = new Character('a');\n\
  ```\n\n在某些情况下，Java 编译器也会为你创建一个 `Character` 对象。例如，如果你将一个基本类型 `char` 传递给一个期望对象的方法，编译器会自动为你将\
  \ `char` 转换为 `Character`。如前所述，此特征称为自动装箱（autoboxing）——如果转换反过来则称为自动拆箱（unboxing）。\n\
  \n> **注意**\n> `Character` 类是不可变的，因此一旦创建，`Character` 对象就无法更改。\n\n表 8.9 列出了 `Character`\
  \ 类中一些最常用的方法，但并非详尽。要查看该类中所有方法的完整列表（超过 50 个），请参考 `java.lang.Character` API 规范。\n\n\
  表 8.9. Character 类中的实用方法\n\n![Image](img/00064.jpeg)\n\n### 转义序列\n\n由反斜杠 (`\\`)\
  \ 前导的字符是转义序列，对编译器具有特殊含义。表 8.10 展示了 Java 转义序列。\n\n表 8.10. 转义序列\n\n![Image](img/00065.jpeg)\n\
  \n当在打印语句遇到转义序列时，编译器会进行相应的解释。例如，如果你想在引号内放置引号，必须对内部的引号使用转义序列 `\\\"`。考虑以下句子：\n\nShe\
  \ said \"Hello!\" to me.\n\n为了打印这个句子，你应该写成：\n\n```java\nSystem.out.println(\"She\
  \ said \\\"Hello!\\\" to me.\");\n```\n\n## 字符串\n\n字符串在 Java 编程中被广泛使用，它是字符序列。在 Java\
  \ 编程语言中，字符串是对象。Java 平台提供了 `String` 类来创建和操作字符串。\n\n### 创建字符串\n\n创建字符串最直接的方法是编写：\n\
  \n```java\nString greeting = \"Hello world!\";\n```\n\n在这种情况下，`\"Hello world!\"\
  ` 是字符串字面量——双引号中的一系列字符。每当编译器遇到字符串字面量时，它都会创建一个该值的 `String` 对象。\n\n与其他任何对象一样，你可以通过使用\
  \ `new` 关键字和构造函数创建 `String` 对象。`String` 类有多个构造函数允许使用不同的来源提供字符串的初始值，例如字符数组：\n\n点击此处查看代码图片\n\
  \n```java\nchar[] helloArray = { 'h', 'e', 'l', 'l', 'o' };\nString helloString\
  \ = new String(helloArray);\nSystem.out.println(helloString);\n```\n\n> **注意**\n\
  > String 类是不可变的。String 类提供了许多看似修改字符串的方法，稍后将讨论。由于字符串是不可变的，这些方法实际上是创建并返回一个包含结果的新字符串。\n\
  \n### 字符串长度\n\n用于获取对象信息的方法被称为访问方法。你可以与字符串一起使用的访问方法是 `length()` 方法，它返回字符串中包含的字符数量。考虑以下两行代码：\n\
  \n```java\nString palindrome = \"Dot saw I Tod\";\nint len = palindrome.length();\n\
  ```\n\n当执行这些行时，`len` 等于 17。回文是一个是对称的单词或句子——在忽略大小写和标点符号的情况下，正读反读都是样的。这里有一个短但（如我们将看到的）效率下的反转回文字符串程序。它调用了\
  \ `String` 方法 `charAt(i)`，该方法返回字符串中的第 i 个字符，从 0 开始计数：\n\n点击此处查看代码图片\n\n```java\n\
  public class StringDemo {\n    public static void main(String[] args) {\n      \
  \  String palindrome = \"Dot saw I Tod\";\n        int len = palindrome.length();\n\
  \        char[] tempCharArray = new char[len];\n        char[] charArray = new char[len];\n\
  \        // 将原始字符串放入字符数组\n        for (int i = 0; i < len; i++) {\n            tempCharArray[i]\
  \ = palindrome.charAt(i);\n        }\n        // 反转字符数组\n        for (int j = 0;\
  \ j < len; j++) {\n            charArray[j] = tempCharArray[len - 1 - j];\n    \
  \    }\n        String reversePalindrome = new String(charArray);\n    }\n}\n```\n\
  \n\n\n\n```java\nnew String(charArray);\n\nSystem.out.println(reversePalindrome);\n\
  \n}\n\n}\n```\n\n运行程序会产生此输出：\n\n```\ndoT saw I was toD\n```\n\n为了实现字符串反转，程序必须将字符串转换为字符数组（第一个\
  \ `for` 循环），将数组反转为第二个数组（第二个 `for` 循环），然后转换回字符串。`String` 类包含一个名为 `getChars()` 的方法，可以将字符串或字符串部分转换为字符数组，因此我们可以用以下代码替换程序中的第一个\
  \ `for` 循环：\n\n```java\npalindrome.getChars(0, len, tempCharArray, 0);\n```\n\n\
  ### 字符串的拼接\n\n`String` 类包含一个用于拼接两个字符串的方法：\n\n```java\nstring1.concat(string2);\n\
  ```\n\n该方法返回一个新字符串，该字符串在 `string1` 的末尾添加了 `string2`。你也可以对字符串字面量使用 `concat()` 方法：\n\
  \n```java\n\"My name is \".concat(\"Rumplestiltskin\");\n```\n\n然而，字符串更常用使用 `+`\
  \ 运算符进行拼接：\n\n```java\n\"Hello,\" + \" world\" + \"!\"\n```\n\n结果如下：\n\n```\n\"\
  Hello, world!\"\n```\n\n`+` 运算符被广泛用于 `print` 语句。考虑以下示例：\n\n```java\nString string1\
  \ = \"saw I was \";\n\nSystem.out.println(\"Dot \" + string1 + \"Tod\");\n```\n\n\
  这产生了以下结果：\n\n```\nDot saw I was Tod\n```\n\n这种拼接可以是任何对象的混合。对于每个不是 `String` 的对象，都会调用其\
  \ `toString()` 方法将其转换为 `String`。\n\n注意\n\nJava 编程语言不允许字符串字面量在源文件中跨行显示，因此你必须在多行字符串的每行末尾使用\
  \ `+` 拼接运算符。这是一个示例：\n\n```java\nString quote =\n    \"Now is the time for all good\
  \ \" +\n    \"men to come to the aid of their country.\";\n```\n\n在 `print` 语句中使用\
  \ `+` 拼接运算符将字符串跨行断开是非常常见的做法。\n\n### 创建格式化字符串\n\n你已经见过使用 `printf()` 和 `format()`\
  \ 方法打印带有格式化数字的输出。`String` 类有一个等价的类方法 `format()`，它返回一个 `String` 对象而不是 `PrintStream`\
  \ 对象。\n\n使用 `String` 的静态 `format()` 方法允许你创建一个可以重复的格式化字符串，而不是一次性的打印语句。考虑以下示例：\n\n\
  ```java\nSystem.out.printf(\"The value of the float \" +\n                  \"variable\
  \ is %f, while \" +\n                  \"the value of the \" +\n               \
  \   \"integer variable is %d, \" +\n                  \"and the string is %s\",\n\
  \                  floatVar, intVar, stringVar);\n```\n\n与此相比，你可以写如下代码：\n\n```java\n\
  String fs;\n\nfs = String.format(\"The value of the float \" +\n               \
  \     \"variable is %f, while \" +\n                    \"the value of the \" +\n\
  \                    \"integer variable is %d, \" +\n                    \" and\
  \ the string is %s\",\n                    floatVar, intVar, stringVar);\n\nSystem.out.println(fs);\n\
  ```\n\n### 数字与字符串之间的转换\n\n#### 将字符串转换为数字\n\n通常，程序最后会得到位于字符串中的数值型数据——用户输入的值。包装原始类型的\
  \ `Number` 子类（`Byte`, `Integer`, `Double`, `Float`, `Long`, `Short`）都提供了一个名为 `valueOf`\
  \ 的方法，可以将字符串转换为该类型的对象。以下示例 `valueOfDemo` 从命令行获取两个字符串，将转换为数字，并对这些值进行算术运算：\n\n```java\n\
  public class ValueOfDemo {\n    public static void main(String[] args) {\n     \
  \   // 此程序需要两个\n        // 命令行参数\n        if (args.length == 2) {\n            //\
  \ 将字符串转换为数字\n            float a = (Float.valueOf(args[0])).floatValue();\n    \
  \        float b = (Float.valueOf(args[1])).floatValue();\n            // 进行一些算术运算\n\
  \            System.out.println(\"a + b = \" + (a + b));\n            System.out.println(\"\
  a - b = \" + (a - b));\n            System.out.println(\"a * b = \" + (a * b));\n\
  \            System.out.println(\"a / b = \" + (a / b));\n            System.out.println(\"\
  a % b = \" + (a % b));\n        } else {\n            System.out.println(\"This\
  \ program \" + \"requires two command-line arguments.\");\n        }\n    }\n}\n\
  ```\n\n当你使用 `4.5` 和 `87.2` 作为命令行参数时，程序的输出如下：\n\n```\na + b = 91.7\na - b = -82.7\n\
  a * b = 392.4\na / b = 0.0516055\na % b = 4.5\n```\n\n注意\n\n每个包装原始数值类型的 `Number`\
  \ 子类也提供了一个 `parseXXXX()` 方法（例如 `parseFloat()`），可以用于将字符串转换为数字。由于返回的是原始类型而不是对象，`parseFloat()`\
  \ 比 `valueOf()` 方法更直接。\n\n#### 将数字转换为字符串\n\n有时你需要将数字转换为字符串，因为你需要以字符串的形式对值进行操作。有几种简单的方法可以将数字转换为字符串：\n\
  \n- 将 `i` 与空字符串拼接；转换会自动处理。\n```java\nString s1 = \"\" + i;\n```\n- 使用 `valueOf`\
  \ 方法。\n```java\nString s2 = String.valueOf(i);\n```\n- 每个 `Number` 子类都包含一个类方法 `toString()`，它将将其原始类型转换为字符串。这是一个示例：\n\
  ```java\nString s3 = Integer.toString(i);\nString s4 = Double.toString(d);\n```\n\
  \n`ToStringDemo` 示例使用 `toString` 方法将数字转换为字符串。随后程序使用一些字符串方法计算小数点前后的数字：\n\n```java\n\
  public class ToStringDemo {\n    public static void main(String[] args) {\n    \
  \    double d = 858.48;\n        String s = Double.toString(d);\n        int dot\
  \ = s.indexOf('.');\n        System.out.println(dot + \" digits before decimal point.\"\
  );\n        System.out.println((s.length() - dot - 1) + \" digits after decimal\
  \ point.\");\n    }\n}\n```\n\n该程序的输出如下：\n\n```\n3 digits before decimal point.\n\
  2 digits after decimal point.\n```\n\n### 操作字符串中的字符\n\n##### 通过索引获取字符和子字符串\n\n你可以通过调用\
  \ `charAt()` 访问方法获取字符串中特定索引处的字符。第一个字符的索引是字母 O，而最后一个字符的索引是 `length()-1`。例如，以下代码获取了字符串中索引为\
  \ 9 处的字符：\n\n```java\nString anotherPalindrome = \"Niagara. O roar again!\";\nchar\
  \ aChar = anotherPalindrome.charAt(9);\n```\n\n\n\n\n索引从 0 开始，因此索引 9 的字符是字母 O，如图\
  \ 8.2 所示。如果你想从字符串中获取多个连续的字符，可以使用 `substring` 方法。`substring` 方法有两个版本，如表 8.11 所示。\n\
  \n![Image](img/00066.jpeg)\n图 8.2. 索引 9 处的字符\n\n表 8.11. String 类中的 substring 方法\n\
  \n![Image](img/00067.jpeg)\n\n回到“Niagara”回文，以下代码获取了从索引 11 开始到但不包含索引 15 的子字符串，即单词“roar”（如见图\
  \ 8.3]）：\n\n点击此处查看代码图像\n\n```java\nString anotherPalindrome = \"Niagara. O roar\
  \ again!\";\nString roar = anotherPalindrome.substring(11, 15);\n```\n\n![Image](img/00068.jpeg)\n\
  图 8.3. 从索引 11 到 15 的子字符串\n\n#### 处理字符串的其他方法\n\n表 8.12 展示了其他几个处理字符串的 `String` 类方法。\n\
  \n表 8.12. String 类中处理字符串的其他方法\n\n![Image](img/00069.jpeg)\n\n### 在字符串中搜索字符和子字符串\n\
  \n这里是其他用于在字符串内查找字符或子字符串的 `String` 方法。`String` 类提供了访问器方法，用于返回特定字符或子字符串在字符串中的位置：`indexOf()`\
  \ 和 `lastIndexOf()`。`indexOf()` 方法从字符串开始处向前搜索，而 `lastIndexOf()` 方法从字符串末尾向后搜索。如果未找到字符或子字符串，`indexOf()`\
  \ 和 `lastIndexOf()` 将返回 `–1`。\n\n`String` 类还提供了一个搜索方法 `contains`，如果字符串包含特定的字符序列，则返回\
  \ `true`。当你只需要知道字符串是否包含某个字符序列而不需要确切位置时，请使用此方法。表 8.13 描述了各种字符串搜索方法。\n\n表 8.13. String\
  \ 类中的搜索方法\n\n![Image](img/00070.jpeg)\n\n> 注意：`CharSequence` 是一个由 `String` 类实现的接口。因此，你可以将字符串作为\
  \ `contains()` 方法的参数。\n\n### 在字符串中替换字符和子字符串\n\n`String` 类中用于向字符串中插入字符或子字符串的方法非常少。通常情况下，这些方法并不是必需的：你可以通过将已从字符串中移除的子字符串与想要插入的子字符串进行拼接，创建一个新字符串。然而，`String`\
  \ 类确实有四个方法用于替换已找到的字符或子字符串，如表 8.14 所示。\n\n表 8.14. String 类中处理字符串的方法\n\n![Image](img/00071.jpeg)\n\
  \n#### 示例\n\n以下类 `Filename` 说明了如何使用 `lastIndexOf()` 和 `substring()` 来分离文件名的不同部分：\n\
  \n> 注意：以下 `Filename` 类中的方法没有进行任何错误检查，并假设其参数包含完整的目录路径和带有扩展名的文件名。如果这些方法是生产环境代码，它们将验证参数是否构造得正确。\n\
  \n点击此处查看代码图像\n\n```java\npublic class Filename {\n    private String fullPath;\n\
  \    private char pathSeparator, extensionSeparator;\n\n    public Filename(String\
  \ str, char sep, char ext) {\n        fullPath = str;\n        pathSeparator = sep;\n\
  \        extensionSeparator = ext;\n    }\n\n    public String extension() {\n \
  \       int dot = fullPath.lastIndexOf(extensionSeparator);\n        return fullPath.substring(dot\
  \ + 1);\n    }\n\n    // 获取不带扩展名的文件名\n    public String filename() {\n        int\
  \ dot = fullPath.lastIndexOf(extensionSeparator);\n        int sep = fullPath.lastIndexOf(pathSeparator);\n\
  \        return fullPath.substring(sep + 1, dot);\n    }\n\n    public String path()\
  \ {\n        int sep = fullPath.lastIndexOf(pathSeparator);\n        return fullPath.substring(0,\
  \ sep);\n    }\n}\n```\n\n这是一个程序 `FilenameDemo`，它构造了一个 `Filename` 对象并调用了它的所有方法：\n\
  \n点击此处查看代码图像\n\n```java\npublic class FilenameDemo {\n    public static void main(String[]\
  \ args) {\n        final String FPATH = \"/home/user/index.html\";\n        Filename\
  \ myHomePage = new Filename(FPATH, '/');\n        System.out.println(\"Extension\
  \ = \" + myHomePage.extension());\n        System.out.println(\"Filename = \" +\
  \ myHomePage.filename());\n        System.out.println(\"Path = \" + myHomePage.path());\n\
  \    }\n}\n```\n\n以下是程序的输出：\n```\nExtension = html\nFilename = index\nPath = /home/user\n\
  ```\n\n如图 8.4 所示，我们的 `extension` 方法使用 `lastIndexOf` 定位文件名中 `.` 的最后出现位置。然后 `substring`\
  \ 使用 `lastIndexOf` 的返回值提取文件扩展名——即从点到字符串结束的子字符串。这段代码假设文件名包含点；如果文件名没有点，`lastIndexOf`\
  \ 返回 `–1`，`substring` 方法将抛出 `StringIndexOutOfBounds` 异常。\n\n![Image](img/00072.jpeg)\n\
  图 8.4. 分离名的不同部分\n\n#### StringBuilder 类\n\n`StringBuilder` 对象类似于 `String` 对象，区别在于它们是可以修改的。在内部，这些对象被视为包含字符序列的可变数组。在任何时刻，都可以通过调用方法更改序列的长度和内容。\n\
  \n\n\n除非 `StringBuilder` 在性能更优或代码更简洁方面具有优势，否则应始终使用 `String`。（请参阅本节末尾的示例程序。）例如，如果你需要拼接大量的字符串，向\
  \ `StringBuilder` 对象中追加内容会更高效。\n\n## 长度与容量\n\n`StringBuilder` 类和 `String` 类一样，有一个\
  \ `length()` 方法，用于返回构建器中字符序列的长度。与字符串不同，每个 `StringBuilder` 都有一个 `capacity`（容量）——已分配的字符空间数。通过\
  \ `capacity()` 方法的的始终大于或等于长度（通常大于），并且会根据需要自动扩展以适应向 `StringBuilder` 中添加的内容。例如，以下代码将产生一个长度为\
  \ 9、容量为 16 的 `StringBuilder`（图 8.5）：\n\n点击此处查看代码图像\n\n```java\n// creates empty\
  \ builder, capacity 16\nStringBuilder sb = new StringBuilder();\n\n// adds 9 character\
  \ string at beginning\nsb.append(\"Greetings\");\n```\n\n![Image](img/00075.jpeg)\n\
  \n图 8.5. 创建一个 StringBuilder\n\n表 8.16. StringBuilder 构造器\n\n![Image](img/00076.jpeg)\n\
  \n`StringBuilder` 类有一些与长度和容量相关的方法，而 `String` 类并不具备（表 8.17）。许多操作（例如 `append()`、`insert()`\
  \ 或 `setLength()`）可以增加 `StringBuilder` 中字符序列的长度，导致结果 `length()` 大于当前的 `capacity()`。当发生时，容量会自动增加。\n\
  \n表 8.17. 长度与容量方法\n\n![Image](img/00077.jpeg)\n\n## StringBuilder 操作\n\n`StringBuilder`\
  \ 中 `String` 不具备的主要操作是 `append()` 和 `insert()` 方法，这些方法经过重载，可以接受任何类型的数据。每个方法都会将其参数转换为字符串，然后将该字符串的字符追加或插入到\
  \ `StringBuilder` 的字符序列中。`append` 方法始终将这些字符添加到现有字符序列的末尾，而 `insert` 方法则将字符添加到指定位置。表\
  \ 8.18 显示了 `StringBuilder` 类的一些方法。\n\n表 8.18. 各种 StringBuilder 方法\n\n![Image](img/00078.jpeg)![Image](img/00079.jpeg)\n\
  \n***\n\n注意\n\n你可以先通过 `StringBuilder` 类的 `toString()` 方法将 `StringBuilder` 对象转换为字符串，从而在构建对象上使用任何\
  \ `String` 方法。然后使用 `StringBuilder(String str)` 构造器将字符串转换回 `StringBuilder`。\n\n***\n\
  \n## 示例\n\n在“字符串”节中列出的 `StringDemo` 程序是一个示例，如果使用 `StringBuilder` 代替 `String`，该程序将会高效。`StringDemo`\
  \ 反转了一个回文。这里再次是它的代码列表：\n\n点击此处查看代码图像\n\n```java\npublic class StringDemo {\n   \
  \ public static void main(String[] args) {\n        String palindrome = \"Dot saw\
  \ I was Tod\";\n        int len = palindrome.length();\n        char[] tempCharArray\
  \ = new char[len];\n        char[] charArray = new char[len];\n        // put original\
