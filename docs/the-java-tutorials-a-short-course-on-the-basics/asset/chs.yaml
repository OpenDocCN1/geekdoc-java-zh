  \ 和 Susan Shepard 为我们的 `JDK 7` 工作提供了细致且彻底的文字编辑。\n\n感谢我们团队的支持：Bhavesh Patel、Devika\
  \ Gollapudi 和 Santhosh La。\n\n最后但同样重要的是，感谢我们管理层的支持：Alan Sommerer，他带我们经历了收购及以后；Barbara\
  \ Ramsey；Sophia Mikulinsky 以及最近晋升为团队经理的 Sowmya Kannan。\n\n### 关于作者\n\n**Sharon Biocca\
  \ Zakhour** 是 Oracle 公司的高级技术作家，曾任职于 Sun Microsystems。她贡献 Java SE 平台文档已十多年，包括《The\
