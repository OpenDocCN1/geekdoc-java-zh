  \ 找到这些问题和练习的答案。\n\n# 6. 泛型 (Generics)\n\n* *\n\n章节目录\n\n- 为什么要使用泛型？\n- 泛型类型\n- 泛型方法\n\
  - 边界类型参数\n- 泛型、继承与子类型\n- 类型推断\n- 通配符\n- 类型擦除\n- 泛型的限制\n- 问题与练习：泛型\n\n* *\n\n在任何非复杂的软件项目中，bug\
  \ 都是生活常态。细致的规划、编程和测试有助于减少它们的泛滥性，但无论在何处、何时，它们总会找到渗透进你代码中的方法。随着新功能的引入以及你代码库规模和复杂性的增长，这一点变得尤为明显。\n\
  \n幸运的是，某些 bug 比其他更更容易检测。例如，编译时 bug 可以很早被发现；你可以使用编译器的错误信息来找出问题所在并立即修复。然而，运行时 bug\
  \ 可能棘手得多；它们并不总是立即出现，而当它们出现时，可能是在程序中距离实际问题原因很远的地方。泛型在 Java SE 中引入。（注：此处原文断断）\n\n\
  ### 为什么要使用泛型？\n\n在任何非复杂的软件项目中，bug 都是生活常态。细致的规划、编程和测试有助于减少它们的泛滥性，但无论在何处、何时，它们总会找到渗透进你代码中的方法。随着新功能的引入以及你代码库规模和复杂性的增长，这一点变得尤为明显。\n\
  \n幸运的是，某些 bug 比其他更更容易检测。例如，编译时 bug 可以很早被发现；你可以使用编译器的错误信息来找出问题所在并立即修复。然而，运行时 bug\
  \ 可能棘手得多；它们并不总是立即出现，而当它们出现时，可能是在程序中距离实际问题原因很远的地方。泛型在 Java SE 中引入。\n\n### 泛型类型\n\n\
  *泛型类型*（generic type）是对类型进行参数化的泛型类或接口。\n\n#### 一个简单的盒子\n\n首先检查一个操作任何类型的非泛型 `Box`\
  \ 类。它只需要两个方法：`set`（将一个对象添加到盒子中）以及 `get`（将其取出来）：\n\n```java\npublic class Box {\n\
  \    private Object object;\n    public void set(Object object) { this.object =\
  \ object; }\n    public Object get() { return object; }\n}\n```\n\n由于它的方法接受或返回 `Object`，你可以自由地传递任何想要的内容，只要它不是基本类型即可。在编译时，没有方法可以验证该类是如何使用的。代码的一个部分可能向盒子中放入一个\
  \ `Integer` 并期望从中取出 `Integer`，而代码的另一部分可能会错误地传递一个 `String`，导致运行时错误。\n\n#### Box 类的泛型版本\n\
  \n要将 `Box` 类更新为使用泛型，你通过将代码 `public class Box` 更改为 `public class Box<T>` 来创建一个*泛型类型声明*。这引入了类型变量\
  \ `T`，它可以用于类内部任何地方。\n\n```java\n/**\n * Box 类的泛型版本。\n * @param <T> 被包装的值的类型\n */\n\
  public class Box<T> {\n    // T 代表 \"Type\"\n    private T t;\n    public void set(T\
  \ t) { this.t = t; }\n    public T get() { return t; }\n}\n```\n\n正如你所见，所有的 `Object`\
  \ 出现处都被 `T` 取代了。类型变量可以是你指定的任何非基本类型：任何类类型、接口类型、数组类型，甚至是另一个类型变量。这种技术同样应用于创建泛型接口。\n\
  \n#### 类型参数命名规范\n\n\n\n\n\n按照惯例，类型参数名称使用单个大写字母。这与你已经熟悉的变量命名规范形成鲜明对比，且理由理由：如果没有这种约定，很难区分类型变量和普通的类或接口名称。\n\
  \n最常用的类型参数名称如下：\n\n• `E`—Element（元素，Java 集合框架广泛使用）\n• `K`—Key（键）\n• `N`—Number（数字）\n\
  • `T`—Type（类型）\n• `V`—Value（值）\n• `S`, `U`, `V` 等——第二、第三和第四类型\n\n你将在 Java SE 应用程序接口（API）以及本书的其他部分中使用这些名称。\n\
  \n### 调用和实例化泛型类型\n\n要在代码中引用泛型 `Box` 类，必须执行*泛型类型调用*，将 `T` 替换为某些具体的值，例如 `Integer`：\n\
  \n```java\nBox<Integer> integerBox;\n```\n\n你可以将泛型类型调用比作普通的方法调用，但不是向方法传递参数，而是向 `Box`\
  \ 类本身传递一个*类型参数*（在本例中为 `Integer`）。\n\n**注意**\n\n许多开发者经常混用*类型参数*（type parameter）和*类型参数*（type\
  \ argument）这两个术语，但它们并不相同。在代码中，提供类型参数是为了创建参数类型。因此，`Foo<T>` 中的 `T` 是类型参数，而 `Foo<String>\
  \ f` 中的 `String` 是类型参数。本章在使用这些术语时遵循这一定义。\n\n与任何变量声明一样，这段代码并没有实际上创建一个新的 `Box` 对象。它只是声明\
  \ `integerBox` 将持有指向“一个 `Integer 的 Box`”的引用，这就是 `Box<Integer>` 的读取方式。\n\n泛型类型的调用通常被称为*参数类型*（parameterized\
  \ type）。要实例化该类，请像通常一样使用 `new` 关键字，但在类名和括号之间放置 `<Integer>`：\n\n```java\nBox<Integer>\
  \ integerBox = new Box<Integer>();\n```\n\n### 菱形\n\n在 Java SE 7 及更高版本中，只要编译器能够从上下确定或推断出类型参数，就可以空类型参数（`<>`）替换调用泛型类构造函数所需的类型参数。这对角括号（`<>`）非正式地称为*菱形*（the\
  \ diamond）。例如，你可以使用以下语句创建 `Box<Integer>` 的实例：\n\n```java\nBox<Integer> integerBox\
  \ = new Box<>();\n```\n\n关于菱形符号和类型推断的更多信息，请参见本章后面的“类型推断”部分。\n\n#### 多类型参数\n\n如前所述，泛型类可以有多个类型参数。一个示例是泛型\
  \ `OrderedPair` 类，它实现了泛型 `Pair` 接口：\n\n点击此处查看代码图片\n\n```java\npublic interface Pair<K,\
  \ V> {\n    public K getKey();\n    public V getValue();\n}\n\npublic class OrderedPair<K,\
  \ V> implements Pair<K, V> {\n    private K key;\n    private V value;\n    public\
  \ OrderedPair(K key, V value) {\n        this.key = key;\n        this.value = value;\n\
  \    }\n    public K getKey() { return key; }\n    public V getValue() { return\
  \ value; }\n}\n```\n\n以下语句创建了 `OrderedPair` 类的两次实例化：\n\n点击此处查看代码图片\n\n```java\n\
  Pair<String, Integer> p1 = new OrderedPair<String, Integer>(\"Even\", 8);\nPair<String,\
  \ String> p2 = new OrderedPair<String, String>(\"hello\", \"world\");\n```\n\n代码\
  \ `new OrderedPair<String, Integer>` 将 `K` 实例化为 `String`，将 `V` 实例化为 `Integer`。因此，`OrderedPair`\
  \ 构造函数的参数类型分别为 `String` 和 `Integer`。由于自动装箱（autoboxing），向该类传递 `String` 和 `int` 是有效的。\n\
  \n如前所述，因为 Java 编译器可以从声明 `OrderedPair<String, Integer>` 中推断出 `K` 和 `V` 类型，这些语句可以使用菱形符号缩短：\n\
  \n点击此处查看代码图片\n\n```java\nOrderedPair<String, Integer> p1 = new OrderedPair<>(\"\
  Even\", 8);\nOrderedPair<String, String> p2 = new OrderedPair<>(\"hello\", \"world\"\
  );\n```\n\n创建泛型接口时，遵循与创建泛型类相同的约定。\n\n### 参数类型\n\n你也可以用参数类型（例如 `List<String>`）替换类型参数（例如\
  \ `K` 或 `V`）。这里有一个示例，使用了 `OrderedPair<V, K>`：\n\n点击此处查看代码图片\n\n```java\nOrderedPair<V,\
  \ K>\n```\n\n### 原始类型\n\n*原始类型*（raw type）是不带任何类型参数的泛型类或接口名称。以下是泛型 `Box` 的示例：\n\n\
  点击此处查看代码图片\n\n```java\nclass Box<T> {\n    public void set(T t) { }\n}\n```\n\n\
  要创建一个参数类型，你需要提供类型参数：\n\n```java\nBox<Integer> intBox = new Box<>();\n```\n\n然而，如果你省略了类型参数，就会得到原始类型：\n\
  \n```java\nBox rawBox = new Box();\n```\n\n原始类型绕过了泛型检查，将错误捕获推迟到运行时。因此，你应该避免使用原始类型。\n\
  \n### 未检查错误消息\n\n如前所述，当将旧代码与泛型代码混合时，你可能会遇到类似下面的警告信息：\n\n点击此处查看代码图片\n\n```text\n\
  Note: Example.java uses unchecked or unsafe operations.\nNote: Recompile with -Xlint:unchecked\
  \ for details.\n```\n\n当在使用在原始类型上的旧版 API 时发生这种情况，如下例所示：\n\n点击此处查看代码图片\n\n```java\n\
  public class WarningDemo {\n    public static void main(String[] args){\n      \
  \  Box<Integer> bi;\n        bi = createBox();\n    }\n    static Box createBox(){\n\
  \        return new Box();\n    }\n}\n```\n\n*unchecked*（未检查）一词意味着编译器没有足够的类型信息来执行确保类型安全所需的所有类型检查。默认情况下，未检查警告是禁用的，尽管编译器给出了提示。要查看所有未检查警告，请使用\
  \ `-Xlint:unchecked` 重新编译。\n\n使用 `-Xlint:unchecked` 重新编译之前的示例会显示以下额外信息：\n\n```text\n\
  WarningDemo.java:4: warning: [unchecked] unchecked conversion\nfound: Box\nrequired:\
  \ Box<java.lang.Integer>\n    bi = createBox();\n               ^\n```\n\n\n\n\n\
  \n# 1 警告\n\n要完全禁用未检查的警告，请使用 `-Xlint:-unchecked` 标志。`@SuppressWarnings(\"unchecked\"\
  )` 注解可以抑制未检查的警告。如果你熟悉 `@SuppressWarnings` 语法，请参见第 4 章 中的“注解”。\n\n## 泛型方法\n\n泛型方法是引入自己的类型参数的方法。这与声明泛型类型类似，但类型参数的作用范围仅限于其定义的方法。允许静态和非静态泛型方法，也允许泛型类构造函数。\n\
  \n泛型方法的语法包括一个位于角括号内的类型参数，它出现在方法的返回类型之前。对于静态泛型方法，类型参数部分必须出现在方法的返回类型之前。\n\n`Util`\
  \ 类包含一个泛型方法 `compare`，它用于比较两个 `Pair` 对象：\n\n点击此处查看代码图像\n\n```java\npublic class\
  \ Util {\n    // 泛型静态方法\n    public static <K, V> boolean compare(Pair<K, V> p1,\
  \ Pair<K, V> p2) {\n        return p1.getKey().equals(p2.getKey()) &&\n        \
  \       p1.getValue().equals(p2.getValue());\n    }\n}\n\npublic class Pair<K, V>\
  \ {\n    private K key;\n    private V value;\n    // 泛型构造函数\n    public Pair(K\
  \ key, V value) {\n        this.key = key;\n        this.value = value;\n    }\n\
  \    // 泛型方法\n    public void setKey(K key) { this.key = key; }\n    public void\
  \ setValue(V value) { this.value = value; }\n    public K getKey()   { return key;\
  \ }\n    public V getValue() { return value; }\n}\n```\n\n调用此方法的完整语法如下：\n\n点击此处查看代码图像\n\
  \n```java\nPair<Integer, String> p1 = new Pair<>(1, \"apple\");\nPair<Integer, String>\
  \ p2 = new Pair<>(2, \"pear\");\nboolean same = Util.<Integer, String>compare(p1,\
  \ p2);\n```\n\n类型已显式提供，如**加粗**所示。通常情况下，可以省略它，编译器将推导出所需的类型：\n\n点击此处查看代码图像\n\n```java\n\
  Pair<Integer, String> p1 = new Pair<>(1, \"apple\");\nPair<Integer, String> p2 =\
  \ new Pair<>(2, \"pear\");\nboolean same = Util.compare(p1, p2);\n```\n\n这种特性被称为类型推断，允许你像调用普通方法一样调用泛型方法，而无需在角括号之间指定类型。该主题在稍后的“类型推断”中会有进一步讨论。\n\
  \n## 边界类型参数\n\n有时，你可能希望限制在参数化类型作为类型参数使用的类型。例如，一个操作数字的方法可能只想接受 `Number` 或其子类的实例。这正是边界类型参数的用途。\n\
  \n要声明边界类型参数，请列出类型参数的名称，随后是 `extends` 关键字，最后是它的上界（在本例中是 `Number`）。注意，在此语境下，`extends`\
  \ 被广义地使用，表示继承（如类）或实现（如接口）：\n\n点击此处查看代码图像\n\n```java\npublic class Box<T> {\n   \
  \ private T t;\n    public void set(T t) {\n        this.t = t;\n    }\n    public\
  \ T get() {\n        return t;\n    }\n    public <U extends Number> void inspect(U\
  \ u){\n        System.out.println(\"T: \" + t.getClass().getName());\n        System.out.println(\"\
  U: \" + u.getClass().getName());\n    }\n    public static void main(String[] args)\
  \ {\n        Box<Integer> integerBox = new Box<Integer>();\n        integerBox.set(new\
  \ Integer(10));\n        integerBox.inspect(\"some text\"); // 错误\n    }\n}\n```\n\
  \n如果我们修改泛型方法以包含这个边界类型，现在编译将会失败，因为我们对 `inspect` 的调用包含一个 `String`：\n\n点击此处查看代码图像\n\
  \n```\nBox.java:21: <U>inspect(U) in Box<java.lang.Integer> cannot be applied to\
  \ (java.lang.String)\n^\nerror\n```\n\n除了限制你实例化泛型类型时使用的类型外，边界类型参数还允许你调用边界定义的方法：\n\
  \n点击此处查看代码图像\n\n```java\npublic class NaturalNumber<T extends Integer> {\n    private\
  \ T n;\n    public NaturalNumber(T n) { this.n = n; }\n    public boolean isEven()\
  \ {\n        return n.intValue() % 2 == 0;\n    }\n}\n```\n\n`isEven` 方法通过 `n` 调用了\
  \ `Integer` 类中的 `intValue` 方法。\n\n### 多重边界\n\n上一个示例说明了单个边界的用法，但类型参数可以有多个边界：`A &\
  \ B & C`。如果第一个边界是类，则它必须是类：\n\n点击此处查看代码图像\n\n```java\nclass A { /* ... */ }\ninterface\
  \ B { /* ... */ }\ninterface C { /* ... */ }\n```\n\n如果是接口，将得到编译错误：\n\n点击此处查看代码图像\n\
  \n```java\nclass D extends B & C { // 错误\n```\n\n### 泛型方法与边界类型参数\n\n边界类型参数是调用边界中定义的方法的关键。考虑以下方法，它计算\
  \ `T[]` 中大于指定元素 `elem` 的数量：\n\n点击此处查看代码图像\n\n```java\npublic static <T> int count(T[]\
  \ anArray, T elem) {\n    int count = 0;\n    for (T e : anArray) {\n        if\
  \ (e > elem) // 错误\n            count++;\n    }\n    return count;\n}\n```\n\n`>`\
  \ 运算符对于基本类型，如 `short`、`int`、`double`、`long`、`float`、`byte` 和 `char` 是有效的，但它不能比较对象。要解决这个问题，使用边界为\
  \ `Comparable<T>` 的接口：\n\n```java\npublic interface Comparable<T> {\n    public\
  \ int compareTo(T o);\n}\n```\n\n结果如下：\n\n点击此处查看代码图像\n\n```java\npublic static <T\
  \ extends Comparable<T>> int count(T[] anArray, T elem) {\n    int count = 0;\n\
  \    for (T e : anArray) {\n        if (e.compareTo(elem) > 0)\n            count++;\n\
  \    }\n    return count;\n}\n```\n\n 泛型、继承与子类型\n\n众周知，只要类型兼容，就可以将一种对象赋值给另一种类型。例如，你可以将\
  \ `Integer` 赋值给 `Object`，因为 `Object` 是 `Integer` 的父类型之一：\n\n点击此处查看代码图像\n\n```java\n\
  Object someObject = new Object();\nInteger someInteger = new Integer(10);\nsomeObject\
  \ = someInteger; // OK\n```\n\n在面向对象的术语中，这种关系被称为*是*关系。因为 `Integer` *是* `Object`\
  \ 的一种，所以赋值是允许的。但 `Integer` 也是 `Number` 的一种，因此以下代码也是有效的：\n\n点击此处查看代码图像\n\n```java\n\
  public void someMethod(Number n) { /* ... */ }\nsomeMethod(new Integer(10)); //\
  \ OK\nsomeMethod(new Double(10.1)); // OK\n```\n\n泛型也是如此。你可以执行泛型类型调用，传递 `Number`\
  \ 作为其类型参数，如果参数与 `Number` ，则后续的 `add` 调用都是允许的：\n\n点击此处查看代码图像\n\n```java\nBox<Number>\
  \ box = new Box<Number>();\nbox.add(new Integer(10)); // OK\nbox.add(new Double(10.1));\
  \ // OK\n```\n\n现在考虑以下方法：\n\n```java\npublic void boxTest(Box<Number> n) { /* ...\
  \ */ }\n```\n\n\n\n\n\n它接受什么类型的参数？通过查看它的签名，你可以看到它接受类型为 `Box<Number>` 的单个参数。但这意味着什么？你是否可以如预期的那样传递\
  \ `Box<Integer>` 或 `Box<Double>`？答案是**否**的，因为正如图 6.1 所示，`Box<Integer>` 和 `Box<Double>`\
  \ 并不是 `Box<Number>` 的子类型。这是在使用泛型进行编程时一个常见的误解，是一个重要的学习概念。\n\n![Image](img/00048.jpeg)\n\
  \n图 6.1。即使 Integer 是 Number 的子类型，`Box<Integer>` 也不是 `Box<Number>` 的子类型\n\n***\n\n\
  ### Note\n\n给定两个具体类型 `A` 和 `B`（例如 `Number` 和 `Integer`），无论 `A` 和 `B` 是否相关，`MyClass`\
  \ 与 `MyClass<B>` 之间都没有关系。`MyClass` 和 `MyClass<B>` 的共同父类是 `Object`。\n\n有关当类型参数相关时如何在两个泛型类之间创建类似于子类型的关系的信息，请参见本章稍后的“通配符与子类型”部分。\n\
  \n***\n\n### 泛型类与子类型\n\n你可以通过扩展或实现一个泛型类或接口来使其成为子类型。一个类或接口的类型参数与另一个类的类型参数之间的关系由 `extends`\
  \ 和 `implements` 子句决定。\n\n以 `Collections` 类为例，如图 6.2 所示，`ArrayList<E> implements\
  \ List<E>`，且 `List<E> extends Collection<E>`。因此 `ArrayList<String>` 是 `List<String>`\
  \ 的子类型，而 `List<String>` 是 `Collection<String>` 的子类型。只要你不改变类型参数，类型之间的子类型关系就会保留。\n\
  \n![Image](img/00049.jpeg)\n\n图 6.2。示例 Collections 层次结构\n\n现在假设我们想定义自己的列表接口 `PayloadList`（图\
  \ 6.3），它将每个元素与一个泛型类型 `P` 的可选值关联。其声明可能如下：\n\n![Image](img/00050.jpeg)\n\n图 6.3。示例\
  \ PayloadList 层次结构\n\n点击此处查看代码图片\n\n```\ninterface PayloadList<E,P> extends List<E>\
  \ {\n  void setPayload(int index, P val);\n  . . .\n}\n```\n\n以下 `PayloadList` 的参数化是\
  \ `List<String>` 的子类型：\n\n• `PayloadList<String,String>`\n• `PayloadList<String,Integer>`\n\
  • `PayloadList<String,Exception>`\n\n### 类型推断\n\n*类型推断*是 Java 编译器通过查看每次方法调用及其相应的声明，来确定使调用有效的类型参数（或参数）的能力。推断算法确定参数的类型，如果可用，还会确定结果被赋值或返回的类型。最后，推断算法尝试找到一个适用于所有参数的*最具体*类型。\n\
  \n为了说明最后一点，在下面的示例中，推断确定传递给 `pick` 方法的第二个参数类型为 `Serializable`：\n\n点击此处查看代码图片\n\n\
  ```\nstatic <T> T pick(T a1, T a2) { return a2; }\nSerializable s = pick(\"d\",\
  \ new ArrayList<String>());\n```\n\n#### 类型推断与泛型方法\n\n之前对泛型方法的讨论介绍了类型推断，它让你能够像调用普通方法一样调用泛型方法，而不需要在角括号之间指定类型。考虑下面的示例\
  \ `BoxDemo`，它需要 `Box` 类：\n\n点击此处查看代码图片\n\n```\npublic class BoxDemo {\n  public\
  \ static <U> void addBox(U u,\n      java.util.List<Box<U>> boxes) {\n      Box<U>\
  \ box = new Box<>();\n      box.set(u);\n      boxes.add(box);\n  }\n  public static\
  \ <U> void outputBoxes(java.util.List<Box<U>> boxes) {\n    int counter = 0;\n \
  \   for (Box<U> box: boxes) {\n      U boxContents = box.get();\n      System.out.println(\"\
  Box #\" + counter + \" contains [\" +\n              boxContents.toString() + \"\
  ]\");\n      counter++;\n    }\n  }\n  public static void main(String[] args) {\n\
  \    // ... 正文中描述的逻辑 ...\n  }\n}\n```\n（注：提供的文本包含对 `BoxDemo` 逻辑的重复描述；已将核心逻辑合并到代码块中以保持清晰。）\n\
  \n\n\n\nJava SE 7 之前的版本的编译器能够推断泛型构造函数的实际类型参数，类似于泛型方法。然而，在 Java SE 7 及之后的编译器中，如果你使用钻石符号（`<>`），它可以推断出被实例化泛型类的实际类型参数。考虑以下示例：\n\
  \n```java\nMyClass<Integer> myObject = new MyClass<>(\"\");\n```\n\n在这个示例中，编译器为泛型类\
  \ `MyClass<X>` 的形式类型参数 `X` 推断出类型 `Integer`。它为该泛型类构造函数的形式类型参数 `T` 推断出类型 `String`。\n\
  \n**注意**\n需要注意的是，推断算法仅使用调用参数以及可能的、易见的预期返回类型来推断类型。推断算法不会使用程序后续部分的结果。\n\n## 通配符\n\n\
  在泛型代码中，问号（`?`）被称为“通配符”（wildcard），代表一个未知类型。通配符可以用于多种情况：作为参数、字段或局部变量的类型，有时也可以作为返回类型（尽管更具体的类型是更好的编程习惯）。通配符永远不会作为泛型方法调用、泛型类实例创建或父类型的类型参数。\n\
  \n接下来的章节将详细讨论通配符，包括上界通配符、下界通配符和通配符捕获。\n\n### 上界通配符\n\n你可以使用上界通配符来放宽变量的限制。例如，假设你想写一个可以处理\
  \ `List<Integer>`、`List<Double>` 和 `List<Number>` 的方法；你可以通过使用上界通配符来实现这一点。\n\n要声明上界通配符，使用通配符字符（`?`），后跟跟\
  \ `extends` 关键字，然后是它的“上界”（upper bound）。请注意，在此语境下，`extends` 是广义的，指的是 `extends`（如类）或\
  \ `implements`（如接口）。\n\n要编写一个处理 `Number` 及其子类型（如 `Integer`、`Double` 和 `Float`）列表的方法，你需要指定\
  \ `List<? extends Number>`。`List<Number>` 比 `List<? extends Number>` 更具限制性，因为前者只匹配类型为\
  \ `Number` 的列表，而后者匹配类型为 `Number` 或其任何子类的列表。\n\n考虑以下 `process` 方法：\n\n```java\npublic\
  \ static void process(List<? extends Foo> list) { /* . . . */ }\n```\n\n上界通配符 `<?\
  \ extends Foo>`（其中 `Foo` 是任意类型）匹配 `Foo` 以及 `Foo` 的任何子类型。`process` 方法可以以 `Foo` 类型访问列表元素：\n\
  \n```java\npublic static void process(List<? extends Foo> list) {\n    for (Foo\
  \ elem : list) {\n        // . . .\n    }\n}\n```\n\n在 `foreach` 子句中，`elem` 变量遍历列表中的每个元素。现在可以在\
  \ `Foo` 类中定义的任何方法都可以用在 `elem` 上。\n\n`sumOfList` 方法返回列表中所有数字之和：\n\n```java\npublic\
  \ static double sumOfList(List<? extends Number> list) {\n    double s = 0.0;\n\
  \    for (Number n : list)\n        s += n.doubleValue();\n    return s;\n}\n```\n\
  \n以下代码使用 `Integer` 对象列表，打印 `sum = 7.0`：\n\n```java\nList<Integer> li = Arrays.asList(1,\
  \ 2, 3);\nSystem.out.println(\"sum = \" + sumOfList(li));\n```\n\n`Double` 值列表可以使用相同的\
  \ `sumOfList` 方法。以下代码打印 `sum = 7.0`：\n\n```java\nList<Double> ld = Arrays.asList(1.2,\
  \ 2.3, 3.5);\nSystem.out.println(\"sum = \" + sumOfList(ld));\n```\n\n### 无界通配符\n\
  \n无界通配符类型使用通配符字符（`?`）指定——例如 `List<?>`。这被称为“未知类型列表”。有两种场景非常有方法：\n\n- 如果你编写一个可以使用\
  \ `Object` 类提供的功能实现的方法，它是很有用的。\n- 当代码使用泛型类中不依赖类型参数的方法时（例如 `List.size` 或 `List.clear`），它是很有用的。事实上，`Class<?>`\
  \ 经常被使用，因为 `Class<T>` 中的大部分方法都不依赖于 `T`。\n\n考虑以下方法 `printList`：\n\n```java\npublic\
  \ static void printList(List<Object> list) {\n    for (Object elem : list) {\n \
  \       // ...\n    }\n}\n```\n\n### 下界通配符\n\n`上界通配符` 章节显示了上界通配符将未知类型限制为特定类型或其子类型，并使用\
  \ `extends` 关键字表示。类似地，下界通配符将未知类型限制为特定类型或其父类型。下界通配符使用通配符字符（`?`），后跟 `super` 关键字，然后是它的“下界”（lower\
  \ bound）：`<? super A>`。\n\n**注意**\n你可以为通配符指定上界或下界，但不能两者都指定。\n\n\n\n\n\n如前文在“泛型、继承与子类型”中所述，泛型类或接口之间并非因为它们的类型之间存在关系就具有关联。然而，你可以使用通配符在泛型类或接口之间建立关系。\n\
  \n考虑以下两个普通（非泛型）类：\n\n```java\nclass A { /* . . . */ }\nclass B extends A { /* .\
  \ . . */ }\n```\n\n对于这些类，编写以下代码是合理的：\n\n```java\nB b = new B();\nA a = b;\n```\n\
  \n这个示例表明，普通类的继承遵循子类型规则：如果类 `B` 继承 `A`，则类 `B` 是类 `A` 的子类型。该规则不适用于泛型类型：\n\n点击此处查看代码图像\n\
  \n```java\nList<B> lb = new ArrayList<>();\nList la = lb; // 编译错误\n```\n\n鉴于 `Integer`\
  \ 是 `Number` 的子类型，那么 `List<Integer>` 和 `List<Number>` 之间是什么关系？虽然 `Integer` 是 `Number`\
  \ 的子类型，但 `List<Integer>` 并不是 `List<Number>` 的子类型，实际上，这两个类型是不相关的。`List<Number>` 和\
  \ `List<Integer>` 的共同父类是 `List<?>`（图 6.4）。\n\n![Image](img/00051.jpeg)\n\n图 6.4\
  \ 共同父类是 List<?>\n\n为了在这些类之间建立关系，以便代码可以通过 `List<Integer>` 的元素访问 `Number` 的方法，可以使用上界通配符：\n\
  \n点击此处查看代码图像\n\n```java\nList<? extends Integer> intList = new ArrayList<>();\n\
  // OK. List<? extends Integer> 是 List<? extends Number> 的子类型\nList<? extends Number>\
  \ numList = intList;\n```\n\n由于 `Integer` 是 `Number` 的子类型，且 `numList` 是 `Number`\
  \ 对象的列表，现在 `intList`（一个 `Integer` 对象的列表）和 `numList` 之间存在关系。图 6.5 显示了使用使用上界和下界通配符声明的几个\
  \ `List` 类之间的关系。\n\n![Image](img/00052.jpeg)\n\n图 6.5 多个泛型列表类声明的层次结构\n\n本章后后的“通配符使用指南”部分关于使用上界和下界通配符的影响提供了更多信息。\n\
  \n#### 通配符捕获与辅助方法\n\n在某些情况下，编译器会推断通配符的类型。例如，一个列表可以定义为 `List<?>`，但在评估表达式时，编译器会从代码中推断出一个特定类型。这种场景被称为`通配符捕获\
  \ (wildcard capture)`。大多数情况下，你不需要担心通配符捕获，除非看到包含 `capture of` 短语的错误信息。\n\n`WildcardError`\
  \ 示例在编译时产生捕获错误：\n\n```java\nimport java.util.List;\n\npublic class WildcardError\
  \ {\n    void foo(List<?> i) {\n        i.set(0, i.get(0));\n    }\n}\n```\n\n在此示例中，编译器将输入参数\
  \ `i` 处理为 `Object` 类型。当 `foo` 方法调用 `List.set(int, E)`^(2) 时，编译器无法确认要插入对象的类型。由于 `Integer`\
  \ 是 `Number` 的子类型，且 `numList` 是 `Number` 对象的列表，现在 `intList`（一个 `Integer` 对象的列表）和\
  \ `numList` 之间存在关系。这种类型错误通常意味着编译器认为你正在将错误的类型赋值给列表。`WildcardError` 示例在通过 `javac`\
  \ 编译时会产生以下错误：\n\n点击此处查看代码图像\n\n```\nWildcardError.java:6: 错误：方法中的 set 无法应用到给定类型;\n\
  \    i.set(0, i.get(0));\n      ^\n    需要: int,CAP#1\n    找到: int,Number\n    原因:\
  \ 实际参数 Number 无法转换为 CAP#1\n    调用转换\n    where E 是一个类型变量:\n      E 在接口 List 中声明为\
  \ Object\n    where CAP#1 是一个新的类型变量:\n      CAP#1 捕获自 ?\n```\n\n在此示例中，代码正尝试执行不安全的操作，那么如何解决类型错误呢？你可以通过编写一个辅助方法来修复它，该辅助方法捕获了通配符。在这种情况下，如\
  \ `WildcardFixed` 所示：\n\n点击此处查看代码图像\n\n```java\npublic class WildcardFixed {\n \
  \   void foo(List<?> i) {\n        fooHelper(i);\n    }\n    // 通过辅助方法使得通配符可以被捕获\n\
  \    private <T> void fooHelper(List<T> l) {\n        l.set(0, l.get(0));\n    }\n\
  }\n```\n\n由于有了辅助方法，编译器推断出 `T` 是 `CAP#1`，现在编译成功。按照惯例，辅助方法通常命名为 `originalNameHelper`。现在考虑一个更复杂的示例\
  \ `WildcardErrorBad`：\n\n点击此处查看代码图像\n\n```java\nimport java.util.List;\npublic class\
  \ WildcardError {\n    void swapFirst(List<? extends Number> l1, List<? extends\
  \ Number> l2) {\n        Number temp = l1.get(0);\n        l2.set(0, temp);\n  \
  \  }\n}\n```\n\n在此示例中，代码正尝试执行不安全的操作。例如，考虑以下对 `swapFirst` 方法的调用：\n\n点击此处查看代码图像\n\n\
  ```java\nList<Integer> li = Arrays.asList(1, 2, 3);\nList<Double> ld = Arrays.asList(10.1,\
  \ 20.2, 30.3);\nswapFirst(li, ld);\n```\n\n虽然 `List<Integer>` 和 `List<Double>` 都符合\
  \ `List<? extends Number>` 的标准，但将来自 `Integer` 列表的项尝试放入 `Double` 列表显然是错误的。使用 Oracle\
  \ 的 `javac` 编译器编译代码会产生以下错误：\n\n```\nWildcardErrorBad.java:7: 错误：接口 List 中的 set 方法无法应用到给定类型;\n\
  \    l2.set(0, temp);\n      ^\n    需要: int,CAP#1\n    找到: int,Number\n    原因: 实际参数\
  \ Number 无法转换为 CAP#1\n    通过方法调用转换\n    where E 是一个类型变量:\n      E 在接口 List 中声明为\
  \ Object\n    where CAP#1 是一个新的类型变量:\n      CAP#1 捕获自 ?\n\nWildcardErrorBad.java:10:\
  \ 错误：接口 List 中的 set 方法无法应用到给定类型;\n    l1.set(0, temp);\n      ^\n    需要: int,CAP#2\n\
  \    找到: int,Number\n    原因: 实际参数 Number 无法转换为 CAP#2\n    通过方法调用转换\n    where E\
  \ 是一个类型变量:\n      E 在接口 List 中声明为 Object\n    where CAP#2 是一个新的类型变量:\n      CAP#2\
  \ 捕获自 ?\n```\n\n没有辅助方法可以解决此问题，因为这段代码从根本上是错误的。\n\n\n\n\n\n在学习泛型编程时，最令人困惑方面之一是确定何时使用上界通配符（upper-bounded\
  \ wildcard），何时使用下界通配符（lower-bounded wildcard）。本节为设计代码提供了一些可以遵循的指南。\n\n为了方便讨论，将变量视为承担两种功能之一是有帮助的：\n\
  \n*   `in` 变量为代码提供数据。想象一个带有两个参数的拷贝方法：`copy(src, dest)`。`src` 参数提供要复制的数据，因此它是 `in`\
  \ 参数。\n*   `out` 变量持有数据以供其他地方使用。在拷贝的示例 `copy(src, dest)` 中，`dest` 参数 `` 接收数据，因此它是\
  \ `out` 参数。\n\n当然，某些变量既用于输入也用于输出，正如后文讨论的那样。在决定是否使用通配符以及使用什么种类型的通配符时，你可以使用 `in` 和\
  \ `out` 原则。以下列表提供了你应该遵循的指南：\n\n*   使用 `extends` 关键字使用上界通配符定义不可变变量。\n*   使用 `super`\
  \ 关键字使用下界通配符定义 `out` 变量。\n*   在 `in` 变量可以通过 `Object` 类中定义的方法访问的情况下，使用无界通配符。\n* \
  \  在代码需要同时作为 `in` 变量和 `out` 变量访问变量的情况下，不要使用通配符。\n\n这些指南不适用于方法的返回类型。应该避免将通配符作为返回类型，因为这迫使使用该代码的程序员处理通配符。\n\
  \n由 `List<? extends . . . >` 定义的列表可以非正式地认为是只读的，但并不是严格的保证。假设你有以下两个类：\n\n点击此处查看代码图片\n\
  \n```java\nclass NaturalNumber {\n    private int i;\n    public NaturalNumber(int\
  \ i) { this.i = i; }\n    // . . .\n}\n\nclass EvenNumber extends NaturalNumber\
  \ {\n    public EvenNumber(int i) { super(i); }\n    // . . .\n}\n```\n\n考虑以下代码：\n\
  \n点击此处查看代码图片\n\n```java\nList<EvenNumber> le = new ArrayList<>();\nList<? extends\
  \ NaturalNumber> ln = le;\nln.add(new NaturalNumber(35));  // 编译错误\n```\n\n由于 `List<EvenNumber>`\
  \ 是 `List<? extends NaturalNumber>` 的子类型，因此你可以将 `le` 赋值给 `ln`。但你不能使用 `ln` 向偶数列表添加一个自然数。对列表执行以下操作是可能的：\n\
  \n*   你可以添加 `null`。\n*   你可以调用 `clear`。\n*   你可以获取迭代器并调用 `remove`。\n*   你可以捕获通配符并写入从列表中读取的元素。\n\
  \n你可以看到，由 `List<? extends NaturalNumber>` 定义的列表在严格意义上并不是只读的，但你可能会这样认为它，因为你无法在列表中存储新元素或更改现有的元素。\n\
  \n### 类型擦除 (Type Erasure)\n\n泛型引入 Java 语言是为了在编译时提供更严格的类型检查，并支持泛型编程。为了实现泛型，Java 编译器应用类型擦除来实现以下目标：\n\
  \n*   将泛型类型中的所有类型参数替换为它们的边界；如果类型参数是无界的，则替换为 `Object`。因此，生成的字节码只包含普通的类、接口和方法。\n*\
  \   在必要时插入类型转换以以保持类型安全。\n*   生成桥接方法（bridge methods）以保留扩展泛型中的多态性。\n\n类型擦除确保不会为参数化类型创建新类；因此，泛型不会产生运行时开销。\n\
  \n### 泛型类型的擦除 (Erasure of Generic Types)\n\n在类型擦除过程中，Java 编译器会擦除所有类型参数，如果类型参数有边界，则将其替换为第一个边界；如果类型参数是无界的，则将其替换为\
  \ `Object`。\n\n考虑以下表示单链表节点的泛型类：\n\n点击此处查看代码图片\n\n```java\npublic class Node<T> {\n\
  \    private T data;\n    private Node<T> next;\n    public Node(T data, Node<T>\
  \ next) {\n        this.data = data;\n        this.next = next;\n    }\n    public\
  \ T getData() { return data; }\n    // . . .\n}\n```\n\n由于类型参数 `T` 是无界的，Java 编译器将其替换为\
  \ `Object`：\n\n点击此处查看代码图片\n\n```java\npublic class Node {\n    private Object data;\n\
  \    private Node next;\n    public Node(Object data, Node next) {\n        this.data\
  \ = data;\n        this.next = next;\n    }\n    public Object getData() { return\
  \ data; }\n    // . . .\n}\n```\n\n在下面的示例中，泛型 `Node` 类使用了有边界类型参数：\n\n点击此处查看代码图片\n\
  \n```java\npublic class Node<T extends Comparable<T>> {\n    private T data;\n \
  \   private Node<T> next;\n    public Node(T data, Node<T> next) {\n        this.data\
  \ = data;\n        this.next = next;\n    }\n    public T getData() { return data;\
  \ }\n    // . . .\n}\n```\n\nJava 编译器将有边界类型参数 `T` 替换为第一个边界 `Comparable`：\n\n点击此处查看代码图片\n\
  \n```java\npublic class Node {\n    private Comparable data;\n    private Node next;\n\
  \    public Node(Comparable data, Node next) {\n        this.data = data;\n    \
  \    this.next = next;\n    }\n    public Comparable getData() { return data; }\n\
  \    // . . .\n}\n```\n\n### 泛型方法的擦除 (Erasure of Generic Methods)\n\nJava 还会擦除泛型方法中的类型参数。考虑以下泛型方法：\n\
  \n点击此处查看代码图片\n\n```java\npublic static <T> int count(T[] anArray, T elem) {\n  \
  \  int cnt = 0;\n    for (T e : anArray) {\n        if (e.equals(elem))\n      \
  \      ++cnt;\n    }\n    return cnt;\n}\n```\n\n由于 `T` 是无界的，Java 编译器将其替换为 `Object`：\n\
  \n点击此处查看代码图片\n\n```java\npublic static int count(Object[] anArray, Object elem)\
  \ {\n    int cnt = 0;\n    for (Object e : anArray) {\n        if (e.equals(elem))\n\
  \            ++cnt;\n    }\n    return cnt;\n}\n```\n\n如果 `T` 有边界，Java 编译器将其替换为第一个边界：\n\
  \n点击此处查看代码图片\n\n```java\npublic static <T extends Comparable> int count(Comparable[]\
  \ anArray, Comparable elem) {\n    int cnt = 0;\n    for (Comparable e : anArray)\
  \ {\n        if (e.equals(elem))\n            ++cnt;\n    }\n    return cnt;\n}\n\
  ```\n\n### 桥接方法 (Bridge Methods)\n\n有时类型擦除会导致你意料之外的情况。下面的示例展示了这种情况是如何发生的。该示例展示了编译器在类型擦除过程中有时创建一个合成方法，称为桥接方法。\n\
  \n考虑以下两个类：\n\n点击此处查看代码图片\n\n```java\npublic class Node<T> {\n    private T data;\n\
  \    public Node(T data) { this.data = data; }\n    public void setData(T data)\
  \ {\n        System.out.println(\"Node.setData\");\n        this.data = data;\n\
  \    }\n}\n\npublic class MyNode extends Node<Integer> {\n    public MyNode(Integer\
  \ data) { super(data); }\n    public void setData(Integer data) {\n        System.out.println(\"\
  MyNode.setData\");\n        super.setData(data);\n    }\n}\n```\n\n现在，考虑以下代码：\n\n\
  点击此处查看代码图片\n\n```java\nMyNode mn = new MyNode(5);\nNode n = mn;  // 原始类型 - 编译器抛出警告\n\
  n.setData(\"Hello\");  // 会抛出 ClassCastException。\nInteger x = mn.data;\n```\n\n\
  在类型擦除后，代码将变为如下：\n\n点击此处查看代码图片\n\n```java\nMyNode mn = new MyNode(5);\nNode n = (MyNode)mn;\
  \  // 原始类型 - 编译器抛出警告\nn.setData(\"Hello\");\n```\n\n为了保持多态性，编译器会在 `Node` 类中生成一个桥接方法：\n\
  \n```java\npublic void setData(Object data) {\n    setData((T)data);\n}\n```\n\n\
  \n\n\n\n`Integer x = (String)mn.data;` // 会导致抛出 `CastException`。\n\n以下是代码执行时的过程：\n\
  \n* `n.setData(\"Hello\");` 导致在 `MyNode` 类的对象上执行 `setData(Object)` 方法。（`MyNode`\
  \ 类从 `Node` 继承了 `setData(Object)`。）\n* 在 `setData(Object)` 的体中，由 `n` 引用用的对象的 `data`\
  \ 字段被赋值为一个 `String`。\n* 通过 `mn` 访问的同一个对象的 `data` 字段可以被访问，并且被预期为整数（因为 `mn` 是一个 `MyNode`，它是一个\
  \ `Node<Integer>`）。\n* 尝试将 `String` 赋值给 `Integer` 会导致 Java 编译器在赋值处插入的强制转换产生 `ClassCastException`。\n\
  \n### 桥接方法 (Bridge Methods)\n\n在编译扩展参数化类或实现参数化接口的类或接口时，编译器可能需要创建一个“桥接方法”的合成方法作为类型擦除过程的一部分。你通常不需要担心桥接方法，但如果堆栈跟踪中出现它，你可能会感到困惑。\n\
  \n类型擦除后，`Node` 和 `MyNode` 类如下：\n\n点击此处查看代码图片\n\n```java\npublic class Node {\n \
  \   private Object data;\n    public Node(Object data) { this.data = data; }\n \
  \   public void setData(Object data) {\n        System.out.println(\"Node.setData\"\
  );\n        this.data = data;\n    }\n}\n\npublic class MyNode extends Node {\n\
  \    public MyNode(Integer data) { super(data); }\n    public void setData(Integer\
  \ data) {\n        System.out.println(Integer data);\n        super.setData(data);\n\
  \    }\n}\n```\n\n类型擦除后，方法签名不再匹配。`Node` 方法变成了 `setData(Object)`，而 `MyNode` 方法变成了\
  \ `setData(Integer)`。因此，`MyNodesetData` 方法没有重写 `NodesetData` 方法。\n\n为了解决这个问题并在类型擦除后保留泛型的多态性，Java\
  \ 编译器会生成一个桥接方法以确保子类型工作按预期进行。对于 `MyNode` 类，编译器为 `setData` 生成了以下桥接方法：\n\n点击此处查看代码图片\n\
  \n```java\nclass MyNode extends Node {\n    // 编译器生成的桥接方法\n    public void setData(Object\
  \ data) {\n        setData((Integer) data);\n    }\n    public void setData(Integer\
  \ data) {\n        System.out.println(\"MyNode.setData\");\n        super.setData(data);\n\
  \    }\n    // . . .\n}\n```\n\n如你所示，桥接方法与类型擦除后 `Node` 类的 `setData` 方法具有相同的方法签名，它委托给了原始的\
  \ `setData` 方法。\n\n### 非可具体化类型 (Nonreifiable Types)\n\n类型擦除 章节讨论了编译器移除与类型参数和类型参数相关的过程。类型擦除与变长参数（也称为\
  \ `varargs`）以及变长形式参数包含非可具体化类型的方法有关后果。关于变长参数方法的更多信息，请参阅第 4 章“向方法或构造函数传递信息”。\n\n####\
  \ 非可具体化类型的定义\n\n`可具体化类型`（reifiable type）是指运行时类型信息完全类型。这包括原始类型、非泛型类型、原始类型以及无界通配符的调用。\n\
  \n`非可具体化类型`是在编译时通过类型擦除移除了信息的类型——未定义为无界通配符的泛型调用。非可具体化类型在运行时并不具备所有信息。非可具体化类型的示例有 `List<String>`\
  \ 和 `List<Number>`；Java 虚拟机 (Java VM) 在运行时无法区分这些类型。正如本章稍后的章节“泛型的限制”所示，在某些情况下无法使用非可具体化类型（例如在\
  \ `instanceof` 表达式中或作为数组的元素）。\n\n### 堆污染 (Heap Pollution)\n\n当参数化类型的变量引用一个并非该参数化类型的对象时，就会发生`堆污染`。如果程序执行了某些操作导致编译时产生未检查警告，就会出现这种情况。如果……则会生成`未检查警告`。\n\
  \n### 带有非可具体化类型的变长参数方法的潜在漏洞\n\n包含变长参数的泛型方法可能会导致污染。考虑以下 `ArrayBuilder` 类：\n\n点击此处查看代码图片\n\
  \n```java\npublic class ArrayBuilder {\n    public static <T> void addToList(List<T>\
  \ listArg, T... elements) {\n        for (T x : elements) {\n            listArg.add(x);\n\
  \        }\n    }\n    public static void faultyMethod(List<String> l) {\n     \
  \   Object[] objectArray = l;\n        String s = (String) objectArray[0];\n   \
  \ }\n}\n```\n\n以下示例 `HeapPollution` 使用了 `ArrayBuilder`：\n\n点击此处查看代码图片\n\n```java\n\
  public class HeapPollution {\n    public static void main(String[] args) {\n   \
  \     List<String> stringListA = new ArrayList<>();\n        List<String> stringListB\
  \ = new ArrayList<>();\n        ArrayBuilder.addToList(stringListA, \"Seven\", \"\
  Eight\", \"Nine\");\n        ArrayBuilder.addToList(stringListB, \"Ten\", \"Eleven\"\
  , \"Twelve\");\n        List<List<String>> listOfStringLists = new ArrayList<List<String>>();\n\
  \        ArrayBuilder.addToList(listOfStringLists, stringListA, stringListB);\n\
  \        ArrayBuilder.faultyMethod(Arrays.asList(\"Hello!\"));\n    }\n}\n```\n\n\
  \n\n\n因此，如语句所示，当你将任意类型的 `List` 对象赋值给 `objectArray` 数组的任何数组组件时，编译器不会发出警告或错误：\n\n\
  ```\nobjectArray[0] = Arrays.asList(42);\n```\n\n`objectArray` 数组的第一个数组组件被赋值了一个包含一个\
  \ `Integer` 类型对象的 `List` 对象。\n\n假设你通过以下语句调用了 `ArrayBuilder.faultyArray`：\n\n```\n\
  ArrayBuilder.faultyMethod(Arrays.asList(\"Hello!\"), Arrays.asList(\"World!\"));\n\
  ```\n\n在运行时，Java VM 在以下语句处抛出了 `ClassCastException`：\n\n```java\n// 在此处抛出 ClassCastException\n\
  String s = l[0].get(0);\n```\n\n变量 `l` 的第一个数组组件中存储的对象类型为 `List<Integer>`，但该语句期望的是一个\
  \ `List<String>` 类型的对象。\n\n### 防止非可重化形式参数的变长方法产生警告\n\n如果你声明了一个具有泛型类型参数的变长（varargs）方法，并且确保方法体不会因为对变长形式参数的处理不当而抛出\
  \ `ClassCastException` 或类似的异常，你可以通过在静态和非构造方法声明上添加以下注解，来防止编译器为这些类型的变长方法生成警告：\n\n\
  ```java\n@SafeVarargs\n```\n\n`@SafeVarargs` 注解是方法契约的文档部分；该注解断言方法的实现不会不当地处理变长形式参数。\n\
  \n虽然也可以在方法声明中添加以下内容来抑制此类警告，但这种方法并不那么理想：\n\n```java\n@SuppressWarnings({\"unchecked\"\
  , \"varargs\"})\n```\n\n然而，这种方法无法抑制从方法调用处生成的警告。如果你不熟悉 `@SuppressWarnings` 语法，请参阅第\
  \ 4 章，“注解](#part0008.html_ch04lev1sec6)”。\n\n### 泛型的限制\n\n要有效使用 Java 泛型，你必须考虑以下限制。\n\
  \n#### 不能使用基本类型类型实例化泛型类型\n\n考虑以下泛化类型：\n\n点击此处查看代码图像\n\n```java\nclass Pair<K, V>\
  \ {\n    private K key;\n    private V value;\n    public Pair(K key, V value) {\n\
  \        this.key = key;\n        this.value = value;\n    }\n    // . . .\n}\n\
  ```\n\n在创建 `Pair` 对象时，你不能用基本类型代替类型参数 `K` 或 `V`：\n\n```java\nPair<int, char> p =\
  \ new Pair<>(8, 'a');  // 编译错误\n```\n\n你只能用非基本类型代替类型参数 `K` 和 `V`：\n\n```java\nPair<Integer,\
  \ Character> p = new Pair<>(8, 'a');\n```\n\n注意，Java 编译器会将 `8` 装箱为 `Integer.valueOf(8)`，并将\
  \ `'a'` 装箱为 `Character('a')`：\n\n```java\nPair<Integer, Character> p = new Pair<>(Integer.valueOf(8),\
  \ new Character('a'));\n```\n\n关于自动装箱的更多信息，请参阅第 8 章。\n\n#### 不能创建类型参数的实例\n\n你不能创建类型参数的实例。例如，以下代码会导致编译错误：\n\
  \n点击此处查看代码图像\n\n```java\npublic static <E> void append(List<E> list) {\n    E elem\
  \ = new E();  // 编译错误\n    list.add(elem);\n}\n```\n\n作为变通方法，你可以通过反射创建类型参数的对象：\n\
  \n点击此处查看代码图像\n\n```java\npublic static <E> void append(List<E> list, Class<E> cls)\
  \ throws Exception {\n    E elem = cls.newInstance();  // OK\n    list.add(elem);\n\
  }\n```\n\n你可以按照如下方式调用 `append` 方法：\n\n点击此处查看代码图像\n\n```java\nList<String> ls = new\
  \ ArrayList<>();\nappend(ls, String.class);\n```\n\n#### 不能声明类型为类型参数的静态字段\n\n类的静态字段是类级变量，由该类的所有非静态对象共享。因此，不允许类型为类型参数的静态字段。考虑以下类：\n\
  \n点击此处查看代码图像\n\n```java\npublic class MobileDevice<T> {\n    private static T os;\n\
  \    // . . .\n}\n```\n\n如果允许类型为类型参数的静态字段，那么以下代码将产生义：\n\n点击此处查看代码图像\n\n```java\n\
  MobileDevice<Smartphone> phone = new MobileDevice<>();\nMobileDevice<Pager> pager\
  \ = new MobileDevice<>();\nMobileDevice<TabletPC> pc = new MobileDevice<>();\n```\n\
  \n由于 `os` 被 `phone`、`pager` 和 `pc` 共享，它的类型是什么？它不能同时是 `Smartphone`、`Pager` 和 `TabletPC`。\n\
  \n#### 不能对泛化类型使用强制转换或 instanceof\n\n由于 Java 会擦除类型参数，你无法在运行时验证类型：\n\n点击此处查看代码图像\n\
  \n```java\npublic static <E> void rtti(List<E> list) {\n    if (list instanceof\
  \ ArrayList) { // 编译错误\n    }\n}\n```\n\n你能做的是使用无界通配符：\n\n点击此处查看代码图像\n\n```java\n\
  public static void rtti(List<?> list) {\n    if (list instanceof ArrayList<?>) {\
  \ // OK\n    }\n}\n```\n\n然而，在某些情况下，编译器知道某个类型是有效的并允许强制转换：\n\n点击此处查看代码图像\n\n```java\n\
  List<Integer> li = new ArrayList<>();\nList<Number> l = (List<Number>) li; // OK\n\
  ```\n\n#### 不能创建泛化类型的数组\n\n你不能创建泛化类型的数组。例如，以下代码无法编译：\n\n```java\nList<Integer>[]\
  \ arrayOfLists = new List<Integer>[2]; // 编译错误\n```\n\n以下说明了当向数组插入不同类型时发生的情况：\n\n\
  点击此处查看代码图像\n\n```java\nObject[] strings = new String[2];\nstrings[0] = \"hi\"; //\
  \ OK\nstrings[1] = 100; // 抛出 ArrayStoreException\n```\n\n如果你对泛型列表尝试相同操作，就会出现问题：\n\
  \n点击此处查看代码图像\n\n```java\nObject[] stringLists = new List<String>[];\nstringLists[0]\
  \ = new ArrayList<String>(); // OK\nstringLists[1] = new ArrayList<Integer>(); //\
  \ 无法检测\n```\n\n#### 不能创建、捕获或抛出泛化类型的对象\n\n泛型类不能直接或间接地地继承 `Throwable` 类。例如，以下类无法编译：\n\
  \n点击此处查看代码图像\n\n```java\n// 间接继承 Throwable\nclass MathException<T> extends Exception\
  \ { } // 编译错误\n\n// 直接继承 Throwable\nclass QueueFullException<T> extends Throwable\
  \ { } // 编译错误\n```\n\n方法不能捕获类型参数的实例：\n\n\n\n\n\n点击此处查看代码图片\n\n```java\npublic static\
  \ <T extends Exception, J> void execute(List<J> jobs) {\n    try {\n        for\
  \ (J job : jobs)\n            // . . .\n    } catch (T e) {   // 编译错误\n        //\
  \ . . .\n    }\n}\n```\n\n但是，你可以在 `throws` 子句中使用类型参数：\n\n点击此处查看代码图片\n\n```java\n\
  class Parser<T extends Exception> {\n    public void parse(File file) throws T {\
  \     // 正确\n        // . . .\n    }\n}\n```\n\n## 不能重载形式参数类型在类型擦除后变为相同原始类型的方法的方法\n\
  \n一个类不能拥有两个在类型擦除后具有相同签的重载方法：\n\n点击此处查看代码图片\n\n```java\npublic class Example {\n\
  \    public void print(Set<String> strSet) { }\n    public void print(Set<Integer>\
  \ intSet) { }\n}\n```\n\n这些重载方法将共享相同的 `classfile` 表示，这将导致编译时错误。\n\n## 问题与练习：泛型\n\
  \n### 问\n\n**1.** 下述类可以通过编译吗？如果不可以，为什么？\n\n点击此处查看代码图片\n\n```java\npublic final class\
  \ Algorithm {\n    public static T max(T x, T y) {\n        return x > y ? x : y;\n\
  \    }\n}\n```\n\n**2.** 如果编译器在编译时擦除了所有类型参数，为什么你还要使用泛型？\n\n**3.** 下述类在类型擦除后转换成了什么？\n\
  \n点击此处查看代码图片\n\n```java\npublic class Pair<K, V> {\n    public Pair(K key, V value)\
  \ {\n        this.key = key;\n        this.value = value;\n    }\n    public K getKey();\
  \ { return key; }\n    public V getValue(); { return value; }\n    public void setKey(K\
  \ key)     { this.key = key; }\n    public void setValue(V value) { this.value =\
  \ value; }\n    private K key;\n    private V value;\n}\n```\n\n**4.** 下述方法在类型擦除后转换成了什么？\n\
  \n点击此处查看代码图片\n\n```java\npublic static <T extends Comparable<T>>\n    int findFirstGreaterThan(T[]\
  \ at, T elem) {\n    // . . .\n}\n```\n\n**5.** 下述方法可以通过编译吗？如果不可以，为什么？\n\n点击此处查看代码图片\n\
  \n```java\npublic static void print(List<? extends Number> list) {\n    for (Number\
  \ n : list)\n        System.out.print(n + \" \");\n    System.out.println();\n}\n\
  ```\n\n**6.** 下述类可以通过编译吗？如果不可以，为什么？\n\n点击此处查看代码图片\n\n```java\npublic class Singleton<T>\
  \ {\n    public static T getInstance() {\n        if (instance == null)\n      \
  \      instance = new Singleton<T>();\n        return instance;\n    }\n    private\
  \ static T instance = null;\n}\n```\n\n**7.** 检查以下类：\n\n点击此处查看代码图片\n\n```java\n\
  class Shape { /* . . . */ }\nclass Circle extends Shape { /* . . . */ }\nclass Rectangle\
  \ extends Shape { /* . . . */ }\nclass Node<T> { /* . . . */ }\n```\n\n下述代码可以通过编译吗？如果不可以，为什么？\n\
  \n点击此处查看代码图片\n\n```java\nNode<Circle> nc = new Node<>();\nNode<Shape>  ns = nc;\n\
  ```\n\n**8.** 考虑这个类：\n\n点击此处查看代码图片\n\n```java\nclass Node<T> implements Comparable<T>\
  \ {\n    public int compareTo(T obj) { /* . . . */ }\n    // . . .\n}\n```\n\n下述代码可以通过编译吗？如果不可以，为什么？\n\
  \n点击此处查看代码图片\n\n```java\nNode<String> node = new Node<>();\nComparable<String> comp\
  \ = node;\n```\n\n## 练习\n\n**1.** 写一个泛型方法，统计集合中具有特定属性（例如奇数、质数、回文数）的元素数量。\n\n**2.**\
