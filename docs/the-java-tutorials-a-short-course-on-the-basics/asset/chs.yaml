  \ `super` 关键字来调用父类的构造函数。回顾 `Bicycle` 示例，`MountainBike` 是 `Bicycle` 的子类。这里是 `MountainBike`（子类）的构造函数，它调用了父类的构造函数并添加了自己的初始化代码：\n\
  \n点击此处查看代码\n\n```java\npublic MountainBike(int startHeight,\n                  \
  \  int startCadence,\n                    int startSpeed,\n                    int\
  \ startGear) {\n    super(startCadence, startSpeed, startGear);\n    seatHeight\
  \ = startHeight;\n}\n```\n\n调用父类构造函数必须是子类构造函数的第一行。调用父类构造函数的语法如下：\n\n```\nsuper();\n\
  ```\n\n这里是另一种形式：\n\n```\nsuper(parameter list);\n```\n\n在 `super()` 中，调用的是父类的无参数构造函数。在\
  \ `super(parameter list)` 中，调用的是具有匹配参数列表的父类构造函数。\n\n### Note\n\n如果构造函数没有显式地调用父类构造函数，Java\
  \ 编译器会自动插入对父类无参数构造函数的调用。如果父类没有无参数构造函数，你将得到编译错误。`Object` 确实有这样一个构造函数，因此如果 `Object`\
  \ 是唯一的父类，就没有问题。\n\n如果子类构造函数显式或隐式地调用了其父类的构造函数，你可能会认为会调用整个构造函数链，一直追溯到 `Object` 的构造函数。事实上，确实如此。这被称为*构造函数链*，当类继承链很长时你需要注意到这一点。\n\
  \n### Object 作为父类\n\n在 `java.lang` 包中，`Object` 类位于类层次树的顶部。每个类直接或或继承自 `Object` 类。你使用的或编写的每个类都继承\
  \ `Object` 的实例方法。你不需要使用这些方法中的任何一个，但如果你选择使用，可能需要用特定类的代码来重写它们。以下是本节讨论的从 `Object` 继承的方法：\n\
  \n- `protected Object clone() throws CloneNotSupportedException`—创建并返回此对象的副本\n-\
  \ `public boolean equals(Object obj)`—指示另一个对象是否“等于”此对象\n- `protected void finalize()\
  \ throws Throwable`—当垃圾回收器决定不再有该对象的引用时，在对象上调用此方法\n- `public final Class getClass()`—返回对象的运行时类\n\
  - `public int hashCode()`—返回对象的哈希码值\n- `public String toString()`—返回对象的字符串表示\n\n\
  `Object` 的 `notify`、`notifyAll` 和 `wait` 方法在同步程序中独立运行线程的活动方面都起着作用，将在后面的章节中详细讨论。这共有五个方法：\n\
  \n- `public final void notify()`\n- `public final void notifyAll()`\n- `public final\
  \ void wait()`\n- `public final void wait(long timeout)`\n- `public final void wait(long\
  \ timeout, int nanos)`\n\n### Note\n\n这些方法中的许多方法有一些微妙的方面，特别是 `clone` 方法。\n\n###\
  \ The clone() Method\n\n如果一个类或其某个父类实现了 `Cloneable` 接口，你就可以使用 `clone()` 方法从现有对象创建一个副本。使用以下代码创建克隆：\n\
  \n```\naCloneableObject.clone();\n```\n\n`Object` 对此方法的实现会检查调用 `clone()` 的对象是否实现了\
  \ `Cloneable` 接口。如果对象没有实现，该方法将抛出 `CloneNotSupportedException` 异常。异常处理将在第 9 章中介绍。目前，如果你打算编写一个\
  \ `clone()` 方法来重写 `Object` 中的方法，你需要将其声明如下：\n\n```java\nprotected Object clone()\
  \ throws CloneNotSupportedException\n```\n\n这里是另一种形式：\n\n```java\npublic Object\
  \ clone() throws CloneNotSupportedException\n```\n\n如果调用 `clone()` 的对象实现了 `Cloneable`\
  \ 接口，`Object` 的 `clone()` 方法会创建一个与原始对象相同类的对象，并将新成员变量初始化为与原始对象的成员变量相同的值。使你的类可克隆的最简单方法是在类声明中添加\
  \ `implements Cloneable`。然后你的对象就可以调用 `clone()` 方法了。\n\n对于某些类，`Object` `clone()`\
  \ 方法的默认行为运行良好。但是，如果对象包含指向外部对象的引用（例如 `ObjExternal`），你可能需要重写 `clone()` 来实现这一点。\n\n\
  ### The equals() Method\n\n`Object` 提供的 `equals()` 方法使用标识运算符 (`==`) 来判断对象是否相等。对于基本类型，这会得到正确的结果。对于对象，则不然。要测试对象在等效性（包含相同信息）上相等，你必须重写\
  \ `equals()` 方法。这是一个重写了 `equals()` 的 `Book` 类示例：\n\n点击此处查看代码\n\n```java\npublic\
  \ class Book {\n    ...\n    public boolean equals(Object obj) {\n        if (obj\
  \ instanceof Book)\n            return ISBN.equals((Book)obj.getISBN());\n     \
  \   else\n            return false;\n    }\n}\n```\n\n考虑这段测试两个 `Book` 实例是否相等的代码：\n\
  \n点击此处查看代码\n\n```java\n// Swing Tutorial, 5th edition\nBook firstBook = new Book(\"\
  0132761696\");\nBook secondBook = new Book(\"0132761696\");\n\nif (firstBook.equals(secondBook))\
  \ {\n    System.out.println(\"objects are equal\");\n} else {\n    System.out.println(\"\
  objects are not equal\");\n}\n```\n\n即使 `firstBook` 和 `secondBook` 引用两个不同的对象，此程序也会显示\
  \ `objects are equal`。它们被认为是相等的是因为比较的对象包含相同的 ISBN 编号。如果标识运算符对于你的类不适用，你应该始终重写 `equals()`\
  \ 方法。\n\n### Note\n\n如果你重写了 `equals()`，你也必须重写 `hashCode()`。\n\n### The finalize()\
  \ Method\n\n`Object` 类提供了一个回调方法 `finalize()`，当对象变成垃圾时，可能会在对象上调用该方法。`Object` 对 `finalize()`\
  \ 的实现什么都不做——你可以重写 `finalize()` 来执行清理工作，包括释放资源。\n\n系统可能会自动调用 `finalize()` 方法，但不确定它何时调用以及是否会被调用。因此，你不应该依赖此方法来为你完成清理工作。\n\
  \n\n\n\n\n你不能重写 `getClass`。`getClass()` 方法返回一个 `Class` 对象，该对象包含你可以使用的方法来获取有关该类的信息，例如它的名称（`getSimpleName()`）、父类（`getSuperclass()`）以及它实现的接口（`getInterfaces()`）。例如，以下方法可以获取并显示对象的类名：\n\
  \n点击此处查看代码图片\n\n```java\nvoid printClassName(Object obj) {\n    System.out.println(\"\
  The object's\" + \" class is \" +\n        obj.getClass().getSimpleName());\n}\n\
  ```\n\n位于 `java.lang` 包中的 `Class` 类拥有大量方法（超过五十个）。例如，你可以测试该类是否为注解（`isAnnotation()`）、接口（`isInterface()`）或枚举（`isEnum()`）。你可以查看字段（`getFields()`）或方法（`getMethods()`）等。\n\
  \n## hashCode() 方法\n\n`hashCode()` 返回的值是对象的哈希码（hash code），它是对象以十六进制形式表示的内存地址。根据定义，如果两个对象相等，它们的哈希码也必须相等。如果你重写了\
  \ `equals()` 方法，你就改变了两个对象相等的方式，此时 `Object` 对 `hashCode()` 的实现不再有效。因此，如果你重写了 `equals()`\
  \ 方法，必须也重写 `hashCode()` 方法。\n\n## toString() 方法\n\n你应该始终考虑在你的类中重写 `toString()` 方法。`Object`\
  \ 的 `toString()` 方法返回对象的 `String` 表示，这对于调试非常有用。对象的字符串表示完全取决于对象本身，这就是为什么你需要在类中重写\
  \ `toString()` 的原因。\n\n你可以将 `toString()` 配合 `System.out.println()` 来显示对象的文本表示，例如\
  \ `Book` 实例：\n\n```java\nSystem.out.println(firstBook.toString());\n```\n\n对于一个经过正确重写的\
  \ `toString()` 方法，这将打印出有用的信息，如下所示：\n\nISBN: 0132761696; The Swing Tutorial; A Guide\
  \ to Constructing GUIs, 5th Edition\n\n## 编写 final 类和方法\n\n你可以将类的一些或全部方法声明为 `final`。方法声明中使用\
  \ `final` 关键字用于指示该方法不能被子类重写。`Object` 类就是这样做的——它的许多方法都是 `final` 的。\n\n如果一个方法的实现不应该被改变并且对对象的一致状态至关重要，你可能希望将该方法设置为\
  \ `final`。例如，你可能希望将 `ChessAlgorithm` 类中的 `getFirstPlayer` 方法设为 `final`：\n\n点击此处查看代码图片\n\
  \n```java\nclass ChessAlgorithm {\n    enum ChessPlayer { WHITE, BLACK }\n    .\
  \ . .\n    final ChessPlayer getFirstPlayer() {\n        return ChessPlayer.WHITE;\n\
  \    }\n    . . .\n}\n```\n\n从构造函数调用的方法通常应该声明为 `final`。如果构造函数调用了非 final 方法，子类可能会重新定义该方法，产生意外或不利的结果。\n\
  \n注意，你还可以将整个类声明为 `final`。声明为 `final` 的类不能被子类。这非常有用，例如在创建一个像 `String` 类这样的不可变类时。\n\
  \n## 抽象方法和类\n\n`abstract class`（抽象类）是声明为 `abstract` 的类——它可能包含也可能不包含抽象方法。抽象类不能实例化，但可以被子类。\n\
  \n`abstract method`（抽象方法）是声明时没有实现的方法（即没有大括号并在后跟分号）。这是一个示例：\n\n```java\nabstract\
  \ void moveTo(double deltaX, double deltaY);\n```\n\n如果一个类包含了抽象方法，则该类本身必须声明为 `abstract`：\n\
  \n点击此处查看代码图片\n\n```java\npublic abstract class GraphicObject {\n    // 声明字段\n  \
  \  // 声明非抽象方法\n    abstract void draw();\n}\n```\n\n当抽象类被子类化时，子类通常会为其父类中的所有抽象方法提供实现。然而，如果没有提供，则子类也必须被声明为\
  \ `abstract`。\n\n> **注意**\n> `interface`（接口）中的所有方法都是*隐式*的抽象方法，因此接口方法不使用 `abstract`\
  \ 修饰符。（可以使用——只是没有必要。）\n\n## 抽象类与接口\n\n与接口不同，抽象类可以包含不是 `static` 且 `final` 的字段，并且可以包含已实现的方法。此类抽象类与接口类似，但它们提供了部分实现，留给子类去完成实现。如果一个抽象类*仅*包含抽象方法声明，则应该被声明为接口。\n\
  \n类可以从类层次结构中的任何地方实现多个接口，无论它们之间是否存在任何关系。例如，考虑 `Comparable` 或 `Cloneable`。\n\n相比之下，抽象类最常见的子类化形式是为了共享实现片段。一个抽象类会被具有许多共同点（抽象类的已实现部分）但也有某些差异（抽象方法）的相似类所子类化。\n\
  \n## 抽象类示例\n\n在一个面向对象的绘图应用程序中，你可以绘制圆、矩形、线段、贝塞尔曲线以及许多其他图形对象。这些对象都具有某些状态（例如位置、朝向、线条颜色、填充颜色）并且某些行为（例如位置、填充颜色、移动）对于所有图形对象都是通用的。而另一些行为（例如缩放、绘制）需要不同的实现。这正是抽象父类的完美场景。图\
  \ 5.2)\n\n![Image](img/00047.jpeg)\n\n图 5.2 矩形、线、Bezier 和圆继承自 GraphicObject\n\n\
  首先声明一个抽象类 `GraphicObject` 来提供所有子类共享的成员变量和方法，例如当前的位置和 `moveTo` 方法。`GraphicObject`\
  \ 还声明了抽象方法，例如 `draw` 或 `resize`，这些方法需要由子类实现但必须以不同的方式实现。`GraphicObject` 类看起来如下：\n\
  \n点击此处查看代码图片\n\n```java\nabstract class GraphicObject {\n    int x, y;\n    . .\
  \ .\n    void moveTo(int newX, int newY) {\n        . . .\n    }\n    abstract void\
  \ draw();\n    abstract void resize();\n}\n```\n\n`GraphicObject` 的非抽象子类（如 `Circle`\
  \ 和 `Rectangle`）必须为 `draw` 和 `resize` 方法提供实现：\n\n点击此处查看代码图片\n\n```java\nclass Circle\
  \ extends GraphicObject {\n    void draw() {\n        . . .\n    }\n    void resize()\
  \ {\n        . . .\n    }\n}\n\nclass Rectangle extends GraphicObject {\n    void\
  \ draw() {\n        . . .\n    }\n    void resize() {\n        . . .\n    }\n}\n\
  ```\n\n## 当抽象类实现接口时\n\n在上一节中，我们提到实现接口的类必须实现*所有*接口方法。然而，可以定义一个没有实现所有方法的类，前提是该类被声明为\
  \ `abstract`。这是一个示例：\n\n点击此处查看代码图片\n\n```java\nabstract class X implements Y {\n\
  \    // 实现了 Y 中除一个之外的方法\n}\n\nclass XX extends X {\n    // 实现 Y 中剩余的方法\n}\n```\n\
  \n\n\n\n在这种情况下，类 `X` 必须是 `abstract`（抽象的），因为它没有完全实现 `Y`，但类 `XX` 实际上实现了 `Y`。\n\n###\
  \ 类成员\n\n抽象类可以拥有 `static` 字段和 `static` 方法。你可以像使用任何其他类一样，通过类引用使用这些静态成员（例如，`AbstractClass.staticMethod()`）。\n\
  \n### 继承总结\n\n除 `Object` 类外，一个类恰有一个直接父类。一个类从它所有的父类中继承字段和方法，无论是直接继承还是间接继承。子类可以重写它所继承的方法，也可以隐藏它继承的字段或方法。（请注意，正如前文提到的，隐藏字段通常是一种糟糕的编程习惯。）[表\
  \ 5.1 显示了声明一个与父类中方法相同签名的方法的影响。\n\n`Object` 类是类层级结构的顶端。所有类都是该类的后代，并继承了它的方法。从 `Object`\
  \ 继承的有用方法包括 `toString()`、`equals()`、`clone()` 和 `getClass()`。\n\n你可以通过在类声明中使用 `final`\
  \ 关键字来防止类被子类化。同样，你可以通过将方法声明为 `final` 方法来防止其被子类重写。\n\n抽象类只能被子类化；不能被实例化。抽象类可以包含抽象方法——即已声明但未实现的方法。子类则为这些抽象方法提供实现。\n\
