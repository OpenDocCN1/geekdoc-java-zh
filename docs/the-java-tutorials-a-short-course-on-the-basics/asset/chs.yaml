  ## 7. 包 (Packages)\n\n### 目录\n\n- 创建包\n- 包命名\n- 使用包成员\n- 管理源和文件\n- 问题与练习：创建和使用包\n\
  \n本章解释了如何将类封装成包、如何使用它们以及如何安排源文件以避免命名冲突。\n\n定义 定义\n\n*包*（package）是相关类型的分组，提供了访问控制和命名空间管理。注意*类型*（types）指的是类、枚举和注解类型。\n\
  \n假设你有一组类型，如圆、矩形、线和点。出于以下原因，你应该将它们封装成一个包：\n\n- 你和其它程序员可以很容易地判断它们是相关的。\n- 你和其它程序员知道在哪里找到图形相关的函数。\n\
  - 你的类型名称不会与其他包中的类型名称冲突，因为包创建了命名空间。\n- 你可以允许包内的类型不受限制地相互访问，同时限制包外部类型的的访问。\n\n###\
  \ 创建包\n\n要创建一个包，你需要为包选择一个名称（命名规范将在下一节讨论，包命名）。然后，在包含你想包含在包中的类型（类、接口、枚举和注解类型）的*每个源文件*顶部写上带有该名称的\
  \ `package` 语句。\n\n`package` 语句必须是源文件的第一行。每个源文件中只能有一个 `package` 语句，并且它适用于文件中的所有类型。\n\
  \n\n\n\n\n你可以将非公共类型与公共类型包含在同一个文件中，但强烈不建议这样做，除非这些非公共类型较小且与公共类型紧密相关。无论如何，只有公共类型可以从包外部访问。所有的顶层非公共类型都将`包私有`（package\
  \ private）。\n\n***\n\n如果你将上一节列出的图形接口和类放在一个名为 `graphics` 的包中，你需要六个源文件：\n\n```java\n\
  //in Draggable.java file\npackage graphics;\n\npublic interface Draggable {\n  \
  \  . . .\n}\n```\n\n```java\n//in Graphic.java file\npackage graphics;\n\npublic\
  \ abstract class Graphic {\n    . . .\n}\n```\n\n```java\n//in Circle.java file\n\
  package graphics;\n\npublic class Circle extends Graphic\n    implements Draggable\
  \ {\n    . . .\n}\n```\n\n```java\n//in Rectangle.java file\npackage graphics;\n\
  \npublic class Rectangle extends Graphic\n    implements Draggable {\n    . . .\n\
  }\n```\n\n```java\n//in Point.java file\npackage graphics;\n\npublic class Point\
  \ extends Graphic\n    implements Draggable {\n    . . .\n}\n```\n\n```java\n//in\
  \ Line.java file\npackage graphics;\n\npublic class Line extends Graphic\n    implements\
  \ Draggable {\n    . . .\n}\n```\n\n如果你不使用 `package` 语句，你的类型将位于一个未命名的包中。通常来说，未命名包仅用于小型或临时应用程序，或者当你正处于开发过程初期时。否则，类和接口应该属于命名的包。\n\
  \n### 为包命名\n\n随着全球范围内的程序员使用 Java 编程语言编写类和接口，可能会有许多程序员为不同的类型使用相同的名称。事实上，上一个示例恰恰就是这样：当\
  \ `java.awt` 包中已经存在一个 `Rectangle` 类时，它又定义了一个 `Rectangle` 类。尽管如此，只要这两个类位于不同的包中，编译器允许它们具有相同的名称。每个\
  \ `Rectangle` 类的全限定名包含了包名。也就是说，`graphics` 包中 `Rectangle` 类的全限定名是 `graphics.Rectangle`，而\
  \ `java.awt` 包中 `Rectangle` 类的全限定名是 `java.awt.Rectangle`。\n\n这种方式运行良好，除非两个独立的程序员为他们的包使用了相同的名称。什么防止了这种问题？约定。\n\
  \n### 命名规范\n\n包名全全小写字母，以避免与类或接口的名称冲突。公司使用反转的互联网域名作为包名的开头（例如，对于由 `example.com` 的程序员创建的名为\
  \ `mypackage` 的包，使用 `com.example.mypackage`）。\n\n公司内部发生的名称冲突需要通过公司内部的约定来处理，或许通过在公司名后包含地区或项目名称（例如，`com.example.region.mypackage`）。Java\
  \ 语言本身的包以 `java.` 或 `javax.` 开头。\n\n在某些情况下，互联网域名可能不是一个有效的包名。这可能发生在：域名名包含连字符或其他特殊字符、包名以数字或其他在\
  \ Java 名称开头不被允许的字符开头，或者包名包含了 Java 预留关键字（如 `int`）。在这种情况下，建议的约定是添加一个下划线（表 7.1）。\n\n\
  表 7.1. 包名的合法化\n\n![Image](img/00053.jpeg)\n\n### 使用包成员\n\n构成包的类型被称为`包成员`（package\
  \ members）。要从包外部使用 `public` 包成员，你必须执行以下操作之一：\n\n* 通过其全限定名引用该成员。\n* 导入该包成员。\n* 导入成员所在的整个包。\n\
  \n正如随后的章节所解释，每种方法适用于不同的情况。\n\n### 通过全限定名引用包成员\n\n到目前为止，书中的大多数示例都是通过简单名引用类型，例如 `Rectangle`\
  \ 和 `StackOfInts`。如果你正在编写的代码与该成员位于同一个包中，或者该成员已经被导入，你就可以使用成员的简单名。\n\n然而，如果你尝试使用来自另一个包的成员，且该包未被导入，则必须使用该成员的全限定名，其中包含了包名。以下是上一个示例中在\
  \ `graphics` 包中定义的 `Rectangle` 类的全限定名：\n\n`graphics.Rectangle`\n\n你可以使用这个全限定名来创建\
  \ `graphics.Rectangle` 的实例：\n\n```java\ngraphics.Rectangle myRect = new graphics.Rectangle();\n\
  ```\n\n全限定名对于低频率的使用是完全可以。然而，当一个名称被重复使用时，反复输入该名称会变得繁琐，代码也会变得难以阅读。作为替代，你可以 `import`\
  \ 该成员或其包，然后使用它的简单名。\n\n### 导入包成员\n\n要将特定成员导入到当前文件，请在文件开头、任何类型定义之前、但在 `package` 语句之后（如果有的话）放置一个\
  \ `import` 语句。以下是如何从上一节创建的 `graphics` 包中导入 `Rectangle` 类：\n\n```java\nimport graphics.Rectangle;\n\
  ```\n\n现在你可以通过简单名引用 `Rectangle` 类了：\n\n```java\nRectangle myRectangle = new Rectangle();\n\
  ```\n\n如果你只使用 `graphics` 包中的少数几个成员，这种方法效果很好。但如果你使用了一个包中的许多类型，就应该导入整个包。\n\n### 导入整个包\n\
  \n要导入特定包中的所有类型，请使用 `import` 语句配合通配符 `*`：\n\n```java\nimport graphics.*;\n```\n\n\
  现在你可以通过简单名引用 `graphics` 包中的任何类或接口：\n\n```java\nCircle myCircle = new Circle();\n\
  Rectangle myRectangle = new Rectangle();\n```\n\n`import` 语句中的星号仅用于指定包内的所有类，如所示。它不能用于匹配包的子集。例如，以下代码无法匹配\
  \ `graphics` 包中所有以 `A` 开头的类：\n\n```java\n//无效\nimport graphics.A*;\n```\n\n相反，这会导致编译错误。通过\
  \ `import` 语句，你通常导入单个包成员或整个包。为了方便，Java 编译器为每个源文件自动导入两个包：(1) `java.lang` 包和 (2) 当前包。\n\
  \n***\n\n注意\n\n另一种不常见的 `import` 形式允许你导入类的类的嵌套类。例如，如果 `graphics.Rectangle` 类包含了有用的嵌套类，如\
  \ `Rectangle.DoubleWide` 和 `Rectangle.Square`，你可以通过以下*两个*语句导入 `Rectangle` 及其嵌套类：\n\
  \n```java\nimport graphics.Rectangle;\nimport graphics.Rectangle.*;\n```\n\n请注意，第二个导入语句*不会*导入\
  \ `Rectangle`。\n\n另一种不常见的 `import` 形式——`static import` 语句将在在本章后面讨论。\n\n***\n\n####\
  \ 包的表观层次结构\n\n起初，包似乎是层次化的，但事实并非如此。例如，Java 应用程序接口（API）包含了 `java.awt` 包、`java.awt.color`\
  \ 包、`java.awt.font` 包以及许多其他以 `java.awt` 开头的包。然而，`java.awt.color` 包、`java.awt.font`\
  \ 包以及其他 `java.awt.xxxx` 包*并不包含*在 `java.awt` 包中。前缀 `java.awt`（Java 抽象窗口工具包）用于许多相关的包，以使这种关系显而易见，但它并不是表示包含关系。\n\
  \n\n\n\n导入 `java.awt.*` 会导入 `java.awt` 包中的所有类型，但它不会导入 `java.awt.color`、`java.awt.font`\
  \ 或任何其他 `java.awt` 包。如果你计划同时使用 `java.awt.color` 以及 `java.awt` 中的类和其他类型，那么你必须同时导入这两个包及其包含的所有文件：\n\
  \n```java\nimport java.awt.*;\nimport java.awt.color.*;\n```\n\n#### 命名冲突\n如果一个包中的成员与另一个包中的成员同名，且两个包都已导入，那么你必须通过每个成员的完全限定名来引用它们。例如，`graphics`\
  \ 包定义了一个名为 `Rectangle` 的类。`java.awt` 包也包含一个 `Rectangle` 类。如果 `graphics` 和 `java.awt`\
  \ 都已导入，下面的代码将是歧义的：\n\n```java\nRectangle rect;\n```\n\n在这种情况下，你必须使用成员的全限定名来准确指明你想要哪一个\
  \ `Rectangle` 类。这里有一个示例：\n\n```java\ngraphics.Rectangle rect;\n```\n\n#### 静态导入语句\n\
  在某些情况下，你需要频繁访问一个或两个类中的静态 final 字段（常量）和静态方法。反复为这些类加上名前缀会导致代码混乱。`static import` 语句提供了一种导入你需要的常量和静态方法的方法，这样你就不需要加上类名名前缀。\n\
  \n`java.lang.Math` 类定义了 `PI` 常量和许多静态方法，包括计算正弦、余弦、正切、平方根、最大值、最小值、指数等许多方法。这里有一个示例：\n\
  \n点击此处查看代码图片\n\n```java\npublic static final double PI = 3.141592653589793;\n\n\
  public static double cos(double a)\n{\n    . . .\n}\n```\n\n通常，为了从另一个类使用这些对象，你需要加上类名前缀，如下所示：\n\
  \n```java\ndouble r = Math.cos(Math.PI * theta);\n```\n\n你可以使用静态导入语句来导入 `java.lang.Math`\
  \ 的静态成员，这样就不需要加上类名 `Math` 前缀了。`Math` 的静态成员可以单独导入：\n\n```java\nimport static java.lang.Math.PI;\n\
  ```\n\n它们也可以作为一个组导入：\n\n```java\nimport static java.lang.Math.*;\n```\n\n一旦导入了这些成员，就可以在不加限定的情况下使用。例如，这里是前面代码段的修订版本：\n\
  \n```java\ndouble r = cos(PI * theta);\n```\n\n你可以编写自己的类，其中包含你频繁使用的常量和静态方法，然后使用静态导入语句。这里有一个示例：\n\
  \n```java\nimport static mypackage.MyConstants.*;\n```\n\n***\n\n**注意**\n要谨慎地使用静态导入。过度使用静态导入会导致代码难以阅读和维护，因为代码的阅读者不知道哪个类定义了特定的静态对象。使用得当，静态导入通过消除类名的重复来提高代码的可读性。\n\
  \n***\n\n#### 管理源文件和类文件\nJava 平台的许多实现依赖于分级文件系统来管理源文件和类文件，尽管 Java 语言规范并没有要求这样做。策略如下：\n\
  \n将类、接口、枚举或注解类型的源代码放在一个文本文件中，其文件名为该类型的简单名，扩展名为 `.java`。这里有一个示例：\n\n```java\n//in\
  \ the Rectangle.java file\npackage graphics;\n\npublic class Rectangle {\n    .\
  \ . .\n}\n```\n\n然后，将源文件放在一个名称反映该类型所属包名称的目录中：\n\n`. . . . .\\graphics\\Rectangle.java`\n\
  \n包成员的完全限定名（`graphics.Rectangle`）和文件的路径（`graphics\\Rectangle.java`）是平行的，假设使用 Microsoft\
  \ Windows 文件名分隔符反斜杠。（对于 Unix，请使用正斜杠。）\n\n请记住，按照惯例，公司使用其反转的互联网域名作为包名。因此，互联网域名为 `example.com`\
  \ 的公司，其所有包名都会以 `com.example` 开头。包名中的每个组件都对应一个子目录。所以，如果这家公司有一个包含 `Rectangle.java`\
  \ 源文件的 `com.example.graphics` 包，它将包含在系列子目录中，如下所示：\n\n`. . . . \\com\\example\\graphics\\\
  Rectangle.java`\n\n当你编译一个源文件时，编译器会为其中定义的每个类型创建一个不同的输出文件。输出文件的基本名是类型的名称，扩展名为 `.class`。这里有一个源文件示例：\n\
  \n```java\n//in the Rectangle.java file\npackage com.example.graphics;\n\npublic\
  \ class Rectangle {\n    . . .\n}\n\nclass Helper{\n    . . .\n}\n```\n\n该源文件的编译文件将位于如下：\n\
  \n点击此处查看代码图片\n\n`<path to parent directory of output files>\\com\\example\\graphics\\\
  Rectangle.class`\n\n`<path to parent directory of output files>\\com\\example\\\
  graphics\\Helper.class`\n\n与 `.java` 源文件一样，编译后的 `.class` 文件应该位于一系列反映包名称的目录中。然而，`.class`\
  \ 文件的路径不需要与 `.java` 源文件的路径相同。你可以分别安排源文件目录和类目录：\n\n点击此处查看代码图片\n\n`<path_one>\\sources\\\
  com\\example\\graphics.java`\n\n`<path_two>\\classes\\com\\example\\graphics.class`\n\
  \n通过这种方式，你需要设置 `CLASSPATH`，以便编译器和 Java VM 能够找到程序使用的所有类型。指向 `classes` 目录的完整路径称为类路径：`<path_two>\\\
  classes`。这是通过 `CLASSPATH` 变量设置的。编译器和 Java VM 在此处查找 `.class 文件`：`com.example`\n\n\
  类路径可能包含多个路径，用分号（Windows）或冒号（Unix）分隔。默认情况下，编译器和 Java VM 会搜索当前目录和包含 Java 平台类的 JAR\
  \ 文件，因此这些目录会自动在你的类路径中。\n\n#### 设置 CLASPATH 变量\n要显示当前的 `CLASSPATH` 变量，请在 Windows\
  \ 和 Unix 使用这些命令：\n\nWindows: `set CLASSPATH`\n\nUnix: `% echo $CLASSPATH`\n\n要删除\
  \ `CLASSPATH` 变量当前的内容，请使用这些命令：\n\n点击此处查看代码图片\n\nWindows: `set CLASSPATH=`\n\nUnix:\
  \ `% unset CLASSPATH; export CLASSPATH`\n\n要设置 `CLASSPATH` 变量，请使用这些命令（例如）：\n\n点击此处查看代码图片\n\
  \nWindows: `set CLASSPATH=C:\\users\\george\\java\\classes`\n\nUnix: `% CLASSPATH=/home/george/java/classes;\
  \ export CLASSPATH`\n\n#### 包总结\n要为类型创建包，需要在包含该类型（类、接口、枚举或注解类型）的源文件中放置 `package`\
  \ 语句。\n\n要使用不同包中的公共类型，你有三个选择：(1) 使用类型的完全限定名，(2) 导入类型，或 (3) 导入该类型所属的整个包。\n\n包的源文件和类文件的路径反映包名。\n\
  \n你可能需要设置 `CLASSPATH`，以便编译器和 Java VM 能够找到程序类型的 `.class` 文件。\n\n### 问题与练习题：创建和使用包\n\
  \n## 问题\n\n\n\n假设你已经写了一些类。后来，你决定将它们拆分为三个包，如表 7.2 所示。此外，假设这些类目前位于默认包中（即它们没有 `package`\
  \ 语句）。\n\n### 1. 包的声明\n1. 为了将每个类放在正确的包中，你需要在每个源文件中添加哪一行代码？\n\n### 2. 目录结构\n2. 为了符合目录结构，你需要在开发目录（development）中创建一些子目录，并将源代码放在正确的子目录中。你必须创建哪些子目录？每个源文件放在哪个子目录中？\n\
  \n### 3. 编译变更\n3. 你认为你是否需要对源代码进行任何其他更改以使其正确编译？如果是，需要哪些更改？\n\n#### 表 7.2. 目标包\n\n\
  ![Image](img/00054.jpeg)\n\n#### 练习题\n\n下载此处列出的源代码：\n\n• `Client.java`^(1)\n• `Server.java`^(2)\n\
  • `Utilities.java`^(3)\n\n1. 使用刚刚下载的源文件实现你在问题 1 到 3 中提出的更改。\n\n2. 编译修改后的源文件。*提示：*\
  \ 如果你是从命令行调用编译器（而不是使用构建器），请从你创建的包含 `mygame` 目录的目录调用编译器。\n\n## 答案\n\n你可以在 [`http://docs.oracle.com/javase/tutorial/java/package/QandE/packages-answers.html`](http://docs.oracle.com/javase/tutorial/java/package/QandE/packages-answers.html)\
  \ 找到这些问题和练习题的答案。\n\n## 8. 数字和字符串\n\n* * *\n\n章节内容\n\n- 数字\n- 字符\n- 字符串\n\n* * *\n\
  \n本章首先讨论了 `Number` 类（位于 `java.lang` 包中）及其子类。特别是第一节讨论了在什么情况下你会使用这些类的实例化，而不是原始数据类型。此外，本节还讨论了在处理数字时可能需要使用的其他类，例如格式化或使用数学函数来补充语言内置的运算符。最后，本节讨论了自动装箱（autoboxing）和自动拆箱（unboxing），这些编译器特性可以简化你的代码。\n\
  \n第二节讨论了字符，第三节讨论了字符串。字符串在 Java 编程中被广泛使用，它是字符序列。在 Java 编程语言中，字符串是对象。本节介绍了如何使用 `String`\
  \ 类创建和操作字符串。它还比较了 `String` 和 `StringBuilder` 类。章节 throughout 问题和练习旨在测试你的知识。\n\n\
  ### 数字\n\n本节首先讨论了 `java.lang` 包中的 `Number`^(1) 类、其子类，以及在什么情况下你会使用这些类的实例化而不是原始数字类型。本节还介绍了\
  \ `PrintStream`^(2) 和 `DecimalFormat`^(3) 类，它们提供了写入格式化数值输出的方法。最后，讨论了 `java.lang`\
  \ 中的 `Math`^(4) 类。它包含了数学函数，可以补充语言内置的运算符。该类拥有三角函数、指数函数等方法。\n\n#### 数字类\n\n在处理数字时，大多数情况下你在代码中使用原始类型。以下是一个示例：\n\
  \n```java\nint i = 500;\nfloat gpa = 3.65f;\nbyte mask = 0xff;\n```\n\n然而，有理由使用对象代替原始类型，Java\
  \ 平台为每个原始数据类型提供了包装类（wrapper classes）。这些类将原始类型“包装”在一个对象中。通常，编译器会完成包装工作——如果你在需要对象的地方使用原始类型，编译器就会将该原始类型包装在它的包装类中为你处理。同样地，如果你在需要原始类型的地方使用数字对象，编译器会为你拆箱该对象。更多信息，请参阅本章节后面的“自动装箱和拆箱”节。\n\
  \n* * *\n\n> 注意\n> 此处未讨论 `Number` 的另外四个子类。`BigDecimal` 和 `BigInteger` 用于高精度计算。`AtomicInteger`\
  \ 和 `AtomicLong` 用于多线程应用程序。\n\n* * *\n\n所有的数字包装类都是抽象类 `Number` 的子类（图 8.1）。你可能使用\
  \ `Number` 对象而不是原始类型的原因有三个：\n\n1. 作为期望接收对象的方法的参数（通常在操作数字集合时使用）\n2. 使用类定义的常量，例如 `MIN_VALUE`\
  \ 和 `MAX_VALUE`，这些常量提供了数据类型的上界和下界\n3. 使用类方法在字符串与数值之间进行转换以及进制转换（十进制、十六进制、二进制）\n\n\
  ![Image](img/00055.jpeg)\n图 8.1 Number 的子类表 8.1 列出了所有子类实现的实例方法。\n\n#### 格式化数字输出\n\
  \n之前你看到了使用 `print` 和 `println` 方法向标准输出（System.out）打印字符串。由于所有数字都可以转换为字符串（将在本章后面所示），你可以使用这些方法打印字符串和数字的混合。然而，Java\
  \ 编程语言还有其他方法，可以在包含数字时对打印输出进行更多的控制。\n\n##### printf 和 format 方法\n\n`java.io` 包包含一个\
  \ `PrintStream` 类，它有两个格式化方法可以替换 `print` 和 `println`。这两个方法 `format` 和 `printf` 是等价的。你熟悉的\
  \ `System.out` 恰好是一个 `PrintStream` 对象，因此你可以在 `System.out` 上调用 `PrintStream` 方法。因此你可以在代码中任何可以使用\
  \ `print` 或 `println` 的地方使用 `format` 或 `printf`。这里有一个示例：\n\n```java\nSystem.out.format(.\
  \ . . . .);\n```\n\n这两个 `java.io.PrintStream`^(5) 方法的语法相同：\n\n```java\npublic PrintStream\
  \ format(String format, Object . . . args)\n```\n\n这里，`format` 是一个指定如何格式化第二个参数 `args`\
  \ 中对象的字符串，而 `args` 是要使用该格式打印的变量列表。一个简单的示例如下：点击查看代码图像\n\n```java\nSystem.out.format(\"\
  The value of \" + \"the float variable is \" +\n\"%f, while the value of the \"\
  \ + \"integer variable is %d, \" +\n\"and the string is %s\", floatVar, intVar,\
  \ stringVar);\n```\n\n第一个参数 `format` 是一个格式字符串，指定第二个参数 `args` 中的对象如何进行格式化。格式字符串包含普通文本以及*格式占位符*（format\
  \ specifiers），它们是格式化 `Object . . . args` 参数的特殊字符。（`Object . . . args` 这种表示被称为可变参数\
  \ *varargs，这意味着参数的数量是可以变化的。）\n\n\n\n\n格式说明符以百分号 `%` 开始并以 `converter*` 结束。转换器是一个字符，表示要格式化的参数类型。在百分号和转换器之间，你可以包含可选的标志（flags）和说明符（specifiers）。有很多转换器、标志和说明符，它们的文档都记录在\
  \ `java.util.Formatter` 中。\n\n这是一个基础示例：\n\n```\nint i = 461012;\nSystem.out.format(\"\
  The value of i is: %d%n\", i);\n```\n\n`%d` 指定单个变量为十进制整数。`%n` 是与平台相关的换行符。输出如下：\n\
  \nThe value of i is: 461012\n\n`printf` 和 `format` 方法是重载的。每个方法都有一个具有以下语法的版本：\n\n\
  ```java\npublic PrintStream format(Locale l, String format, Object . . . args)\n\
  ```\n\n例如，若要在法语系统（使用逗号代替小数点）中打印数字，你可以使用以下代码：\n\n```java\nSystem.out.format(Locale.FRANCE,\n\
  \    \"The value of the float \" + \"variable is %f, while the \" +\n    \"value\
  \ of the integer variable \" + \"is %d, and the string is %s%n\",\n    floatVar,\
  \ intVar, stringVar);\n```\n\n### 示例\n\n以下程序 `TestFormat.java` 展示了使用 `format` 方法可以实现的一些格式化操作。（注意：表\
  \ 8.3 列出了此示例程序中使用的一些转换器和标志。）输出显示在嵌入注释的双双引号内：\n\n```java\nimport java.util.Calendar;\n\
  import java.util.Locale;\n\npublic class TestFormat {\n    public static void main(String[]\
  \ args) {\n        long n = 461012;\n        System.out.format(\"%d%n\", n);   \
  \   //  --> \"461012\"\n        System.out.format(\"%08d%n\", n);   //  --> \"00461012\"\
  \n        System.out.format(\"%+8d%n\", n);   //  --> \" +461012\"\n        System.out.format(\"\
  %,8d%n\", n);    //  --> \" 461,012\"\n        System.out.format(\"%+,8d%n%n\",\
  \ n); //  --> \"+461,012\"\n        double pi = Math.PI;\n        System.out.format(\"\
