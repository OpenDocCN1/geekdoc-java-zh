  \ 第 10 节：线程\n### 第 11 节：并发\n### 第 12 节：本地化\n\n## 前言\n\n自 2010 年初 Oracle 收购 Sun 公司以来，Java\
  \ 语言经历了一个令人兴奋的时代。正如本书所示，Java 正在不断进化。除了涵盖新功能外，之前的章节也经过重写，以包含新的信息，例如 `try`-with-resources`\
  \ 语句、在一个处理程序中捕获多种类型异常、对二进制字面量的支持以及使代码更整洁的菱形语法。\n\n书中的信息通常被称为“核心教程”，对于大多数初级和中级程序员来说至关重要。在掌握了这些内容后，你可以在网站上探索\
  \ Java 平台的其他文档。如果你对开发复杂的富网络应用（RIA）感兴趣，请查看 JavaFX，这是一个全新的顶级 Java 图形界面（GUI）工具包。从 Java\
  \ SE 7 更新 5 开始，你在下载 JDK 时会自动获得 JavaFX 软件开发包（SDK）。欲了解更多，请访问以下 URL 的 Java 文档：\n\n\
  `http://docs.oracle.com/javafx`\n\n所有内容都经过了 Oracle 工程人员的彻底审查，以确保信息的准确性和实时性。本书基于\
  \ Oracle 网站托管的在线教程：\n\n`http://docs.oracle.com/javase/tutorial`\n\n一如既往，我们的目标是编写一本易于阅读、实用的程序员指南，帮助你学习如何利用\
  \ Java 提供的丰富环境构建应用程序、applet 和组件。去编程吧！\n\n### 谁应该读这本书？\n\n\n\n\n\n本书旨在面向初学者和经验丰富的程序员。\n\
  \n- `新程序员` 可以从头到尾读这本书中获益最多，其中包含了第 1 章中关于编译和运行你的第一个程序的逐步说明，以及“快速上手”。\n- `熟悉过程化语言的程序员`（如\
  \ `C` 语言）可能想从关于面向对象概念和 Java 编程语言特性的材料开始学习。\n- `经验丰富的程序员`可能想直接进入更高级的话题，例如泛型、并发或部署。\n\
  \n本书包含了满足各种经验水平程序员学习需求的信息。\n\n### 如何使用本书\n\n本书的设计使你既可以一气呵读，也可以在不同主题之间跳跃阅读。信息按逻辑顺序呈现，并尽可能地避免了后向引用。\n\
  \n本教程中的示例是针对 `JDK 7` 版本编译的。*你需要下载此版本（或更高版本）才能编译和运行大多数示例。*\n\n书中引用的某些材料可以在网上找到（例如：可下载的示例、问题和练习的解答、`JDK\
  \ 7` 指南以及 API 规范）。你会看到如下脚注：\n\n`7/docs/api/java/lang/Class.html`\n\n以及\n\n`tutorial/java/generics/examples/BoxDemo.java`\n\
