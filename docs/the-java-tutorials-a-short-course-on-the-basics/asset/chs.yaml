  \ `Object` 有），编译器将拒绝该程序。\n\n## 使用对象\n\n一旦创建了对象，你可能想用它做一些事情。你可能需要使用其中一个字段的值、更改其中一个字段，或调用其中一个方法来执行操作。\n\
  \n### 引用对象的字段\n\n对象字段通过它们的名称访问。你必须使用无歧义的名称。你可以在字段内的字段使用简单名称。（注意：原文在此部分包含了一些重复/乱码的句子，已清理以保持访问字段的核心含义）。\n\
  \n例如，访问字段：\n```java\nSystem.out.println(\"Width of rectOne: \" + rectOne.width);\n\
  ```\n\n### 调用对象的方法\n\n你也应该使用对象引用来调用对象的方法。你在对象引用后面附加方法的简单名称，中间通过一个点运算符 (`.`)。你还应该在括号中为方法提供任何参数：\n\
  \n```java\nobjectReference.methodName(argumentList);\n```\n\n如果方法不需要任何参数，请使用空括号：\n\
  \n```java\nobjectReference.methodName();\n```\n\n`Rectangle` 类有两个方法：用于计算矩形面积的 `getArea()`\
  \ 和用于更改矩形原点的 `move()`。以下是调用这两个方法的 `CreateObjectDemo` 代码：\n\n点击此处查看代码图像\n\n```java\n\
  System.out.println(\"Area of rectOne: \" + rectOne.getArea());\n\n// . . .\n\nrectTwo.move(40,\
  \ 72);\n```\n\n\n\n\n与实例字段一样，`objectReference` 必须是一个指向对象的引用。你可以使用变量名，也可以使用任何返回对象引用的表达式。`new`\
  \ 操作符返回一个对象引用，因此你可以使用 `new` 返回的值来调用新对象的方法：\n\n```\nnew Rectangle(100, 50).getArea()\n\
  ```\n\n表达式 `new Rectangle(100, 50)` 返回一个指向 `Rectangle` 对象的引用。所示，你可以使用点操作符（`dot`\
  \ notation）来调用新 `Rectangle` 的 `getArea()` 方法，以计算新矩形的面积。\n\n某些方法（例如 `getArea()`）会返回一个值。对于返回值的方法，你可以在表达式中使用方法调用。你可以将返回值赋值给变量，并用它来做决策或控制循环。这段代码将\
  \ `getArea()` 返回的值赋值给变量 `areaOfRectangle`：\n\n```java\nint areaOfRectangle = new\
  \ Rectangle(100, 50).getArea();\n```\n\n请记住，在特定对象上调用方法等同于向该对象发送消息。在这种情况下，调用 `getArea()`\
  \ 的对象是构造函数返回的矩形。\n\n### 垃圾回收器\n\n某些面向对象的语言要求你跟踪所创建的所有对象，并在它们不再需要时显式地销毁它们。显式管理内存是枯燥且容易出错的。Java\
  \ 平台允许你创建任意数量的对象（当然，受限于你系统的处理能力），而你不需要担心销毁它们。Java 运行时环境在确定对象不再被使用时会删除它们。这个过程被称为\
  \ `垃圾回收`（`garbage collection`）。\n\n当对一个对象不再有任何引用时，该对象就符合垃圾回收条件。变量中持有的引用通常在变量超出范围时被丢弃。你也可以通过将变量设置为特殊值\
  \ `null` 来显式地丢弃对象引用。请记住，一个程序可以对同一个对象有多个引用；在对象的所有引用都被丢弃之前，该对象才可以被垃圾回收。\n\nJava 运行时环境有一个垃圾回收器，它会定期释放不再被引用的对象所使用的内存。垃圾回收器在确定时机合适时会自动执行其工作。\n\
  \n### 关于类的更多内容\n\n本节涵盖了依赖对象引用和点操作符（`dot`）的类的更多方面。\n\n#### 从方法返回值\n\n当方法完成其内部的所有语句、到达\
  \ `return` 语句或抛出异常（后文将讨论）时（以先发生者为准），方法会返回到调用它的代码。你在方法声明中声明方法的返回类型。在方法体内部，你使用 `return`\
  \ 语句返回结果。\n\n任何声明为 `void` 的方法都不返回结果。它不需要包含 `return` 语句，但也可以包含。在这种情况下，可以使用 `return`\
  \ 语句来跳出控制流块并退出方法。它的用法如如下所示：\n\n```java\nreturn;\n```\n\n如果你尝试从一个声明为 `void` 的方法返回结果，将得到编译器错误。任何未声明为\
  \ `void` 的方法必须包含一个带有相应返回值的 `return` 语句：\n\n```java\nreturn returnValue;\n```\n\n\
  返回值的类型必须与方法声明的返回类型匹配。例如，你不能从一个声明返回 `boolean` 的方法返回整数（`int`）值。\n\n之前讨论的 `Rectangle`\
  \ 类中的 `getArea()` 方法返回一个整数：\n\n点击此处查看代码图像\n\n```java\n// 一个计算矩形面积的方法\npublic int\
  \ getArea() {\n    return width * height;\n}\n```\n\n该方法返回从表达式 `width * height`\
  \ 得到的整数。\n\n`getArea` 方法返回一个原始类型。方法也可以返回一个引用类型。例如，在一个操作 `Bicycle` 对象的程序中，我们可能会有这样一个方法：\n\
  \n点击此处查看代码图像\n\n```java\npublic Bicycle seeWhosFastest(Bicycle myBike, Bicycle yourBike,\
  \ Environment env) {\n    Bicycle fastest;\n    // 代码用于计算哪辆自行车\n    // 更快，给定每辆自行车的齿轮\n\
  \    // 和踏频，以及给定\n    // 环境（地形和风力）\n    return fastest;\n}\n```\n\n#### 返回类或接口\n\
  \n如果这一节让你感到困惑，请跳过它并在读完第 5 章 后回来。\n\n当方法使用类名作为其返回类型时（如 `whosFastest` 所示），返回对象的类型的类必须是返回类型的子类或完全相同的类。假设你有一个类层级结构，其中\
  \ `ImaginaryNumber` 是 `java.lang.Number` 的子类，而 `java.lang.Number` 又是 `Object` 的子类，如图\
  \ 4.4](#part0008.html_ch04) 所示。\n\n![图 4.4](img/0039.jpeg)\n\n现在假设你有一个声明为返回 `Number`\
  \ 的方法：\n\n点击此处查看代码图像\n\n```java\npublic Number getNumber() {\n    // . .\n}\n```\n\
  \n`getArea` 方法返回一个原始类型。方法也可以返回引用类型。\n\n#### this 关键字\n\n在实例方法或构造函数中，`this` 是当前对象的引用——即被调用的对象。\n\
  \n##### 在字段中使用 this\n\n使用 `this` 的常见原因是字段被参数遮蔽了。例如，`Point` 类如下：\n\n```java\nclass\
  \ Point {\n    int x = 0;\n    int y = 0;\n    // 构造函数\n    Point(int a, int b)\
  \ {\n        x = a;\n        y = b;\n    }\n}\n```\n\n然而，它可以写成：\n\n```java\nclass\
  \ Point {\n    int x = 0;\n    int y = 0;\n    // 构造函数\n    Point(int x, int y)\
  \ {\n        this.x = x;\n        this.y = y;\n    }\n}\n```\n\n构造函数的每个参数都遮蔽了对象的一个字段；在构造函数内部\
  \ `x` 是构造函数参数的局部副本。为了引用 `Point` 字段 `x`，构造函数必须使用 `this.x`。\n\n##### 在构造函数中使用 this\n\
  \n从构造函数，你还可以使用 `this` 关键字调用同一类的另一个构造函数。这样做被称为 `显式构造函数调用`。这是一个另一个 `Rectangle` 类，其实现与本章对象节中的不同：\n\
  \n点击此处查看代码图像\n\n```java\nclass Rectangle {\n    private int x, y;\n    private int\
  \ width, height;\n\n    public Rectangle() {\n        this(0, 0, 0, 0);\n    }\n\
  \n    public Rectangle(int width, int height) {\n        this(0, 0, width, height);\n\
  \    }\n\n    public Rectangle(int x, int y, int width, int height) {\n        this.x\
  \ = x;\n        this.y = y;\n        this.width = width;\n        this.height =\
  \ height;\n    }\n}\n```\n\n\n\n该类包含一组构造函数。每个构造函数都会初始化矩形的部分或全部成员变量。构造函数为任何未通过参数提供初始值的成员变量提供默认值。例如，无参数构造函数会调用带有四个零值的四参数构造函数，而双参数构造函数会调用带有两个零值的四参数构造函数。与之前一样，编译器根据参数的数量和类型来决定调用哪个构造函数。如果存在，则对另一个构造函数的调用必须是构造函数的第一行。\n\
  \n## 控制类成员的访问权限\n\n访问级别修饰符决定了其他类是否可以使用特定的字段或调用特定的方法。访问控制有两个级别：\n\n- 在顶层级别。`public`\
  \ 或包私有（无显式修饰符）\n- 在成员级别。`public`、`private`、`protected` 或包私有（无显式修饰符）\n\n可以使用 `public`\
  \ 修饰符声明一个类，在这种情况下，该类对所有地方的所有类都是可见的。如果一个类没有修饰符（默认值，也称为 `package-private`），则它仅在自己的包内可见。（`Packages`\
  \ 是相关类的命名组——你将在第 7 章中学习它们。）\n\n在成员级别，你也可以使用 `public` 修饰符或不使用修饰符（`package-private`），这两个修饰符含义与在顶层类中相同。对于成员，有两个额外的访问修饰符：`private`\
  \ 和 `protected`。`private` 修饰符指定成员只能在自己的类中被访问。`protected` 修饰符指定成员只能在自己的包内被访问（与 `package-private`\
  \ 相同），还可以被另一个包中的子类访问。\n\n表 4.1 显示了每个修饰符允许的成员访问权限。第一数据列表示类本身是否具有访问访问级别定义的成员。正如你所看到的，类总是可以访问自己的成员。第二列表示与类在相同包中的类（无论其父类如何）是否具有访问该成员。第三列表示在该包之外声明的类的子类是否具有访问该成员。第四列表示所有类是否具有访问权限。\n\
  \n表 4.1 访问级别\n\n![Image](img/00040.jpeg)\n\n访问级别通过两个方面影响你。首先，当你使用来自其他来源的类（例如 Java\
  \ 平台中的类），访问级别决定了你的类可以使用这些类的哪些成员。其次，当你编写一个类时，你需要决定类中的每个成员变量和每个方法应该具有什么访问级别。\n\n让我们来看一组类，看看访问级别如何影响可见性。图\
  \ 4.5 显示了示例中的四个类以及它们之间的关系。表 4.2 显示了对于可以应用于 alpha 类的每个修饰符，其成员在何处可见的。\n\n![Image](img/00041.jpeg)\n\
  \n图 4.5 用于说明访问级别的示例中的类和包\n\n表 4.2 可见性\n\n![Image](img/00042.jpeg)\n\n***\n\n注意\n\
  \n如果其他程序员使用你的类，你希望确保不会因误用产生错误。访问级别可以帮助你做到这一点：\n\n- 对于特定成员，使用合理的最限制性访问级别。除非有充分理由，否则使用\
  \ `private`。\n- 避免使用 `public` 字段，常量除外；`public` 字段往往会将你与特定的实现绑定，并限制你更改代码的灵活性。\n\n\
  ***\n\n## 理解实例成员和类成员\n\n在本节中，我们将讨论使用 `static` 关键字创建属于类而不是类实例的字段和方法。\n\n### 类变量\n\
  \n从同一个类蓝图创建多个对象时，它们各拥有自己独特的 `instance variables` 副本。在 `Bicycle` 类中，实例变量是 `cadence`、`gear`\
  \ 和 `speed`。每个 `Bicycle` 对象都拥有这些变量的独立值，存储在不同的内存位置。\n\n有时你希望拥有一个所有对象共有的变量。这是通过 `static`\
  \ 修饰符实现的。在声明中带有 `static` 修饰符的字段被称为 `static fields` 或 `class variables`。它们与类相关，而不是与任何对象相关。类的每个实例共享一个类变量，它位于内存中的一个固定位置。任何对象都可以更改类变量的值，但也可以在创建类实例的情况下操作类变量。\n\
  \n例如，假设你想创建多个 `Bicycle` 对象并为每个对象分配一个序列号，从第一个对象开始。这个 ID 数字对每个对象都是唯一的，因此是一个实例变量。同时，你需要一个字段来跟踪创建了多少个\
  \ `Bicycle` 对象，以便知道给下一个对象分配哪个 ID。这样的字段与任何单个对象无关，而与整个类相关。为此，你需要一个类变量 `numberOfBicycles`，如下：\n\
  \n点击此处查看代码图像\n\n```java\npublic class Bicycle{\n\n    private int cadence;\n   \
  \ private int gear;\n    private int speed;\n    private int id;\n    static int\
  \ numberOfBicycles = 0;\n\n    // ...\n}\n```\n\n### 类方法\n\nJava 编程语言支持静态方法以及静态变量。在声明中带有\
  \ `static` 修饰符的静态方法应该通过类名调用，而无需创建类的实例：\n\n`ClassName.methodName(args)`\n\n***\n\n\
  注意\n\n你也可以通过对象引用引用静态方法：\n\n`instanceName.methodName(args)`\n\n然而，这种做法是不被鼓励的，因为不清楚这些是类方法。\n\
  \n***\n\n静态方法的一个常见用途是访问静态字段。例如，我们可以为 `Bicycle` 类添加一个静态方法来访问 `numberOfBicycles` 静态字段：\n\
  \n点击此处查看代码图像\n\n```java\npublic static int getNumberOfBicycles() {\n    return numberOfBicycles;\n\
  }\n```\n\n并不是所有实例与类变量及方法的组合都是允许的：\n\n- 实例方法可以直接访问实例变量和实例方法。\n- 实例方法可以直接访问类变量和类方法。\n\
  \n\n\n\n- 类方法可以直接访问类变量变量和类方法。\n- 类方法*不能*直接访问实例变量或实例方法——它们必须使用对象引用。此外，类方法不能使用 `this`\
  \ 关键字，因为没有供 `this` 指向的实例。\n\n### 常量\n\n`static` 修饰符结合 `final` 修饰符也用于定义常量。`final`\
  \ 修饰符表示该字段的值不能改变。\n\n例如，下面的变量声明定义了一个名为 `PI` 的常量，其值是圆周率的近似值（圆周与直径的比值）：\n\n```java\n\
  static final double PI = 3.141592653589793;\n```\n\n以这种方式定义的常量无法被重新赋值，如果你的程序尝试这样做，将得到编译时错误。按照惯例，常量值的名称使用大写字母。如果名称由多个单词组成，则用下划线（`_`）分隔。\n\
  \n***\n\n注意\n\n如果基本类型或字符串被定义为常量，且该值在编译时已知，编译器会将代码中所有的常量名替换为它的值。这被称为*编译时常量*。如果外部世界的常量值发生了变化（例如，如果规定圆周率实际上应该是\
  \ 3.975），你需要重新编译任何使用该常量的类以获取当前值。\n\n***\n\n### Bicycle 类\n\n在完成本节中的所有修改后，`Bicycle`\
  \ 类现在如下：\n\n点击此处查看代码图像\n\n```java\npublic class Bicycle{\n    private int cadence;\n\
  \    private int gear;\n    private int speed;\n    private int id;\n    private\
  \ static int numberOfBicycles = 0;\n    public Bicycle(int startCadence,\n     \
  \              int startSpeed,\n                   int startGear){\n        gear\
  \ = startGear;\n        cadence = startCadence;\n        speed = startSpeed;\n \
  \       id = ++numberOfBicycles;\n    }\n\n    public int getID() {\n        return\
  \ id;\n    }\n\n    public static int getNumberOfBicycles() {\n        return numberOfBicycles;\n\
  \    }\n\n    public int getCadence(){\n        return cadence;\n    }\n\n    public\
  \ void setCadence(int newValue){\n        cadence = newValue;\n    }\n\n    public\
  \ int getGear(){\n        return gear;\n    }\n\n    public void setGear(int newValue){\n\
  \        gear = newValue;\n    }\n\n    public int getSpeed(){\n        return speed;\n\
  \    }\n\n    public void applyBrake(int decrement){\n        speed -= decrement;\n\
  \    }\n\n    public void speedUp(int increment){\n        speed += increment;\n\
  \    }\n}\n```\n\n### 字段初始化\n\n正如你所看到的，你通常可以在字段的声明中为其提供初始值：\n\n```java\npublic class\
  \ BedAndBreakfast {\n    // 初始化为 10\n    public static int capacity = 10;\n    //\
  \ 初始化为 false\n    private boolean full = false;\n}\n```\n\n当初始化值可用且初始化可以写在一行时，这种方法效果很好。然而，这种初始化形式由于其简单性具有局限性。如果初始化需要某些逻辑（例如错误处理或填充复杂数组的\
  \ `for` 循环），简单的赋值是不够的。实例变量可以在构造函数中初始化，在构造函数可以使用错误处理或其他逻辑。\n\n### 静态块\n\n*静态块*是用花括号括的代码块，并在其前面带有\
  \ `static` 关键字。这里有一个示例：点击此处查看代码图像\n\n```java\nstatic {\n    // 这里可以放置任何代码\n}\n```\n\
  \n一个类可以有任意数量的静态块，它们出现在类体的任何地方。运行时系统保证它们按照出现的顺序进行初始化。使用构造函数的替代方案是：点击此处查看代码图像\n\n\
  ```java\nclass Whatever {\n    // 这里可以放置任何代码\n}\n```\n\n### 初始化实例成员\n\n通常，你会使用构造函数来初始化一个实例。使用构造函数有两种替代方案：初始化块和字段声明。\n\
  \n```java\n{\n    // 这里可以放置任何代码\n}\n```\n\n该方法将在子类中讨论。这是一个示例：点击此处查看代码图像\n\n```java\n\
  class Whatever {\n    // 这里可以放置任何代码\n}\n```\n\n### 创建和使用类的总结\n\n类声明为类命名，并在花括号之间包含类体。类名之前可以有修饰符。类体包含该类的字段、方法和构造函数。类使用字段来包含状态信息，使用方法来实现行为。用于初始化类的新实例的构造函数使用类名，并且看起来像没有返回类型的方法。\n\
  \n你以相同的方式控制类和成员的访问：在它们的声明中使用如 `public` 等访问修饰符。你通过在成员声明中使用 `static` 关键字来指定类变量或类方法。未声明为\
  \ `static` 的成员隐地是实例成员。类变量由类的所有实例共享，可以通过类名以及实例引用进行访问。类的实例拥有每个实例变量的副本，必须通过实例引用进行访问。\n\
  \n你通过使用 `new` 操作符和构造函数从类创建对象。`new` 操作符返回所创建对象的引用。你可以将该引用赋值给变量或直接使用。\n\n声明所在类外部可访问的实例变量和方法可以使用限定名来引用。实例变量的限定名格式如下：`objectReference.variableName`。方法的限定名格式如下：`objectReference.methodName(argumentList)`。或者，方法的限定名也可以像这样：`objectReference.methodName()`。\n\
  \n垃圾回收器会自动清理未使用的对象。如果程序不再持有该对象的引用，则该对象就是未使用的。你可以通过将持有引用的变量设置为 `null` 来显式丢弃引用。\n\n\
