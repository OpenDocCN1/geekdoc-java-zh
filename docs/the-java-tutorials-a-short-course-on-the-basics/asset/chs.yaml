  \ 答案\n\n你可以在以下地址找到这些问题和练习的答案：[`http://docs.oracle.com/javase/tutorial/java/javaOO/QandE/objects-answers.html`](http://docs.oracle.com/javase/tutorial/java/javaOO/QandE/objects-answers.html)。\n\
  \n## 嵌套类\n\nJava 语言允许你在另一个类内部定义一个类。这样的类被称为嵌套类，此处所示：\n\n```java\nclass OuterClass\
  \ {\n    ...\n    class NestedClass {\n        ...\n    }\n}\n```\n\n### 定义\n\n\
  嵌套类分为两类：静态和非静态。声明为 `static` 的嵌套类简单地称为静态嵌套类。非静态嵌套类被称为内部类（inner classes）。\n\n```java\n\
  class OuterClass {\n    ...\n    static class StaticNestedClass {\n        ...\n\
  \    }\n    class InnerClass {\n        ...\n    }\n}\n```\n\n嵌套类是其外层类的成员。非静态嵌套类（内部类）可以访问外层类的其他成员，即使它们被声明为\
  \ `private`。静态嵌套类无法访问外层类的其他成员。作为 `OuterClass` 的成员，嵌套类可以声明为 `private`、`public`、`protected`\
  \ 或包私有（package private）。（记住，外层类只能声明为 `public` 或包私有。）\n\n### 为什么要使用嵌套类？\n\n使用嵌套类有几个极具说服力的理由，包括：\n\
  \n- **类的逻辑分组。** 如果一个类仅对另一个类有用，那么将其嵌入到该类中并将它们放在一起是符合逻辑的。嵌套此类“助手类”可以使它们的包结构更加精简。\n\
  - **增强封装性。** 考虑两个两个顶层类 A 和 B，其中 B 需要访问 A 的成员，而这些成员通常情况下会被声明为 `private`。通过将类 B 隐藏在类\
  \ A 内部，A 的成员可以声明为 `private` 且 B 能够访问。\n- **提高代码的可读性和可维护性。** 将小类嵌套在类内部可以使代码更加集中。\n\
  \n### 静态嵌套类\n\n与方法和变量一样，静态嵌套类与其外层类相关。而且像静态方法一样，静态嵌套类无法直接引用外层类的实例变量或方法。\n\n***\n\n\
  ### 注意\n\n静态嵌套类通过外层类名访问：\n\n`OuterClass.StaticNestedClass`\n\n为了方便使用，例如，要创建一个静态嵌套类的对象，使用以下语法：\n\
  \n点击此处查看代码图像\n\n```java\nOuterClass.StaticNestedClass nestedObject =\n    new OuterClass.StaticNestedClass();\n\
  ```\n\n### 内部类\n\n与方法和变量一样，内部类与其实例相关，并可以直接访问该实例的字段。此外，由于内部类与实例相关，它本身不能定义任何静态成员。\n\
  \n内部类的实例存在于外层类的实例内部。考虑以下类：\n\n```java\nclass OuterClass {\n    ...\n    class InnerClass\
  \ {\n        ...\n    }\n}\n```\n\n`InnerClass` 的实例只能存在于 `OuterClass` 的实例内部，并且可以直接访问其方法和字段。\n\
  \n要实例化内部类，必须先实例化外层类。然后在外层对象内部创建内部对象，语法如下：\n\n```java\nOuterClass.InnerClass innerObject\
  \ = outerObject.new InnerClass();\n```\n\n此外，还有两种特殊的内部类：局部类和匿名类（也称为匿名内部类）。它们都将在下一节简要讨论。\n\
  \n***\n\n### 注意\n\n如果你想了解更多关于 Java 编程语言中不同类型类的分类信息（这很难用简洁、清晰且准确的方式描述），请参考 Joseph\
  \ Darcy 博客上的“Nested, Inner, Member and Top-Level Classes”。^(1)\n\n***\n\n### 内部类示例\n\
  \n为了看到内部类的用法，让我们先考虑数组。在下面的示例中，我们将创建一个数组，用整数值填充它，然后按升序仅输出偶数索引的值。给出的 `DataStructure`\
  \ 类包含以下内容：\n\n- `DataStructure` 外层类包含将整数添加到数组以及打印数组偶数索引值的方法。\n\n\n\n\n\n- `InnerEvenIterator`\
  \ 内部类类似于标准的 Java 迭代器。迭代器用于遍历数据结构，通常具有用于测试是否为最后一个元素、获取当前元素以及移动到下一个元素的方法。\n- `main`\
  \ 方法实例化了一个 `DataStructure` 对象 (`ds`)，并使用它为 `arrayOfInts` 数组填充整数值（0, 1, 2, 3 等）。然后，它调用了\
  \ `printEven` 方法打印出 `arrayOfInts` 中偶数索引的值。\n\n点击此处查看代码图片\n\n```java\npublic class\
  \ DataStructure {\n    // 创建一个数组\n    private final static int SIZE = 15;\n    private\
  \ int[] arrayOfInts = new int[SIZE];\n\n    public DataStructure() {\n        //\
  \ 用升序的整数值填充数组\n        for (int i = 0; i < SIZE; i++) {\n            arrayOfInts[i]\
  \ = i;\n        }\n    }\n\n    public void printEven() {\n        // 打印数组偶数索引的值\n\
  \        InnerEvenIterator iterator = this.new InnerEvenIterator();\n        while\
  \ (iterator.hasNext()) {\n            System.out.println(iterator.getNext() + \"\
  \ \");\n        }\n    }\n\n    // 内部类实现迭代器模式\n    private class InnerEvenIterator\
  \ {\n        // 从开始开始遍历数组\n        private int next = 0;\n\n        public boolean\
  \ hasNext() {\n            // 检查当前元素是否是数组中的最后一个\n            return (next <= SIZE\
  \ - 1);\n        }\n\n        public int getNext() {\n            // 记录数组偶数索引的值\n\
  \            int retValue = arrayOfInts[next];\n            // 获取下一个偶数元素\n     \
  \       next += 2;\n            return retValue;\n        }\n    }\n\n    public\
  \ static void main(String s[]) {\n        // 用整数值填充数组并只打印\n        // 偶数索引的值\n \
  \       DataStructure ds = new DataStructure();\n        ds.printEven();\n    }\n\
  }\n```\n\n输出结果如下：\n0 2 4 6 8 10 12 14\n\n注意，`InnerEvenIterator` 类直接引用了 `DataStructure`\
  \ 对象的实例变量 `arrayOfInts`。\n\n内部类可以用于实现示例所示的辅助类。如果你计划处理用户界面事件，将需要知道如何使用内部类，因为事件处理机制大量使用了它们。\n\
  \n### 局部内部类和匿名内部类\n\n还有两种类型的内部类。你可以在方法体内声明一个内部类，这种类被称为局部内部类。你也可以在方法体内声明一个没有命名的内部类。这些类被称为匿名内部类。你在高级\
  \ Java 编程中会遇到此类类。\n\n### 修饰符\n\n你可以对内部类使用与外部类其他成员相同的修饰符。例如，你可以使用访问修饰符——`private`、`public`\
  \ 和 `protected` 来限制对内部类的访问，就像对待其他类成员时一样。\n\n### 嵌套类总结\n\n在另一个类内部定义的类被称为嵌套类。和其他类的其他成员一样，嵌套类可以声明为静态的（static）也可以不是静态。非静态嵌套类被称为内部类。内部类的实例只能存在于其所属类的实例中，并且即使所属类的成员被声明为\
  \ `private`，内部类也可以访问它们。表 4.3 显示了嵌套类的类型。\n\n#### 表 4.3. 嵌套类的类型\n\n![图片](img/00044.jpeg)\n\
  \n### 问题与练习：嵌套类\n\n## 问题\n\n**1.** 程序 `Problem.java`^(2) 无法编译。你需要做什么才能使其编译？为什么？\n\
  \n**2.** 使用 `Box`^(3) 类（位于 `javax.swing` 包中）的 Java API 文档来帮助回答以下问题：\n**a.** `Box`\
  \ 定义了什么静态类？\n**b.** `Box` 定义了什么内部类？\n**c.** `Box` 的内部类的父类是什么？\n**d.** `Box` 的哪些嵌套类可以从任何类中使用？\n\
  **e.** 你如何创建 `Box` 的 `Filler` 类的实例？\n\n## 练习\n\n**1.** 获取文件 `Class1.java`^(4)。编译并运行\
  \ `Class1`。输出是什么？\n\n## 答案\n\n你可以在 [`http://docs.oracle.com/javase/tutorial/javaOO/QE/nested-answers`](http://docs.oracle.com/javase/tutorial/javaOO/QE/nested-answers)\
  \ 找到这些问题和练习的答案。\n\n### 枚举类型\n\n枚举类型是由一组固定常量组成的类型。常见的例子包括方向（`NORTH`、`SOUTH`、`EAST`、`WEST`）和星期。因为它们是常量，枚举类型字段的名称全大写。在\
  \ Java 语言中，你通过 `enum` 关键字定义枚举类型。例如，你可以如下指定一个 `days` 枚举类型：\n\n点击此处查看代码图片\n\n```java\n\
  public enum Day {\n    SUNDAY, MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY\n\
  }\n```\n\n每当你需要表示一组固定常量时，都应该使用枚举。这包括自然类型（如我们太阳系中的行星）以及在编译时已知所有值的数据集（例如菜单上的选项、命令行标志）。以下代码展示了如何使用之前定义的\
  \ `Day` 枚举：\n\n点击此处查看代码图片\n\n```java\npublic class EnumTest {\n    Day day;\n\n\
  \    public EnumTest(Day day) {\n        this.day = day;\n    }\n\n    public void\
  \ tellItItIs() {\n        switch (day) {\n            case MONDAY:\n           \
  \     System.out.println(\"Mondays are bad.\");\n                break;\n      \
  \      case FRIDAY:\n                System.out.println(\"Fridays are better.\"\
  );\n                break;\n            case SATURDAY: \n            case SUNDAY:\n\
  \                System.out.println(\"Weekends are best.\");\n                break;\n\
  \            default:\n                System.out.println(\"Midweek days are so-so.\"\
  );\n                break;\n        }\n    }\n\n    public static void main(String[]\
  \ args) {\n        EnumTest firstDay = new EnumTest(Day.MONDAY);\n        firstDay.tellItItIs();\n\
  \        EnumTest thirdDay = new EnumTest(Day.WEDNESDAY);\n        thirdDay.tellItItIs();\n\
  \        EnumTest fifthDay = new EnumTest(Day.FRIDAY);\n        fifthDay.tellItItIs();\n\
  \        EnumTest sixthDay = new EnumTest(Day.SATURDAY);\n        sixthDay.tellItItIs();\n\
  \        EnumTest seventhDay = new EnumTest(Day.SUNDAY);\n        seventhDay.tellItItIs();\n\
  \    }\n}\n```\n\n输出结果如下：\nMondays are bad.\nMidweek days are so-so.\nFridays are\
  \ better.\nWeekends are best.\nWeekends are best.\n\n注意\n\n*所有* 枚举隐式地继承 `java.lang.Enum`。由于\
  \ Java 不支持多重继承，枚举不能继承其他任何类。\n\n\n\n\n\n在接下来的示例中，`Planet` 是一个表示太阳系中行星的枚举类型。它们通过常量质量和半径属性进行定义。每个枚举常量在声明时都带有质量和半径参数的值。这些值在常量创建时被传递给构造函数。Java\
  \ 要求必须在定义任何字段或方法之前定义常量。此外，当存在字段和方法时，枚举常量的列表必须以分号结束。\n\n### 注意\n枚举类型的构造函数必须是包级私有的（package-private）或私有的（private）。它会自动创建在枚举体头部定义的常量。你不能自己调用枚举构造函数。\n\
  \n除了属性和构造函数外，`Planet` 还拥有方法，允许你获取物体在每个行星上的表面重力和重量。这是一个示例程序，它接收你在地球上的重量（任何单位），并计算并打印你在所有行星上的重量（相同单位）：\n\
  \n点击查看代码图像\n\n```java\npublic enum Planet {\n    MERCURY (3.303e+23, 2.4397e6),\n\
  \    VENUS   (4.869e+24, 6.0518e6),\n    EARTH   (5.976e+24, 6.37814e6),\n    MARS\
  \    (6.421e+23, 3.3972e6),\n    JUPITER (1.9e+27,   7.1492e7),\n    SATURN  (5.688e+26,\
  \ 6.0268e7),\n    URANUS  (8.686e+25, 2.5559e7),\n    NEPTUNE (1.024e+26, 2.4746e7);\n\
  \n    private final double mass;   // in kilograms\n    private final double radius;\
  \ // in meters\n\n    Planet(double mass, double radius) {\n        this.mass =\
  \ mass;\n        this.radius = radius;\n    }\n\n    private double mass() { return\
  \ mass; }\n    private double radius() { return radius; }\n\n    // universal gravitational\
  \ constant  (m3 kg-1 s-2)\n    public static final double G = 6.67300E-11;\n\n \
  \   double surfaceGravity() {\n        return G * mass / (radius * radius);\n  \
  \  }\n\n    double surfaceWeight(double otherMass) {\n        return otherMass *\
  \ surfaceGravity();\n    }\n\n    public static void main(String[] args) {\n   \
  \     if (args.length != 1) {\n            System.err.println(\"Usage: java Planet\
  \ <earth_weight>\");\n            System.exit(-1);\n        }\n        double earthWeight\
  \ = Double.parseDouble(args[0]);\n        double mass = earthWeight/EARTH.surfaceGravity();\n\
  \        for (Planet p : Planet.values())\n            System.out.printf(\"Your\
  \ weight on %s is %f%n\",\n                              p, p.surfaceWeight(mass));\n\
  \    }\n}\n```\n\n如果你在命令行中带参数 175 运行 `Planet.class`，你将得到以下输出：\n\n`$ java Planet\
  \ 175`\n\n`Your weight on MERCURY is 66.107583`\n`Your weight on VENUS is 158.374842`\n\
  `Your weight on EARTH is 175.000000`\n`Your weight on MARS is 66.279007`\n`Your\
  \ weight on JUPITER is 442.847567`\n`Your weight on SATURN is 186.552719`\n`Your\
  \ weight on URANUS is 158.397260`\n`Your weight on NEPTUNE is 199.20743`\n\n####\
  \ 枚举类型\n\n## 问题\n1. 正确或错误：一个枚举类型可以是 `java.lang.String` 的子类。\n\n##### 练习题\n1. 重写“问题：类”章节中练习的\
  \ `Card` 类，使其使用枚举类型来表示牌牌的点数和花色。\n2. 以同样的方式重写 `Deck` 类。\n\n## 答案\n你可以在这里找到这些问题的答案，也可以在\
