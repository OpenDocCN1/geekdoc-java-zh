  \ 曾是 Oracle 公司和 Sun Microsystems 的高级技术作家。她目前是 Java SE 文档团队经理，在 Java 平台、基于 Java 的中间件和\
  \ Web 应用的设计、开发和文档方面拥有十五以上的经验。\n\n**Raymond Gallardo** 是 Oracle 公司的技术作家。他之前的经历包括大学讲师、IBM\
  \ 技术作家和自行车快递员。他在多伦多大学获得了计算机科学和英语学士学位，在纽约市立学院获得了创意写作硕士学位。\n\n# 1. 快速上手\n\n* *\n\n\
  章节内容\n\n- Java 技术的现象\n- “Hello World!”应用程序\n- 深入研究“Hello World!”应用程序\n- 常见问题（及解决方案）\n\
  - 问题与练习：快速上手\n\n* * *\n\n本章提供了你开始学习 Java 编程语言所需的所有知识。第一节提供了 Java 技术的整体概述。它讨论了 Java\
  \ 编程语言和平台，对这项技术可以做什么以及它将如何让你的生活变得更容易提供了广泛概述。第二节提供了“Hello World!”应用程序的信息。这种实操方法描述了在创建一个简单的“Hello\
  \ World!”应用程序时需要下载、安装和输入什么。它为 NetBeans 集成开发环境（`NetBeans IDE`）、Microsoft Windows、Solaris\
  \ 和 Linux 提供了单独说明。第三节讨论了“Hello World!”应用程序，详细描述了代码的每个部分。它涵盖了源代码注释、`HelloWorldApp`\
  \ 类以及 `main` 方法。第四节介绍了常见问题。如果在编译或运行时遇到问题，请阅读此节。章节以问题和练习结束。\n\n### Java 技术现象\n\n\
  关于 Java 技术的讨论无处不在，但它到底是什么？本节解释了 Java 技术既是一种编程语言，也是一个平台，并概述了这项技术能为你做什么。\n\n#### Java\
  \ 编程语言\n\nJava 编程语言是一种高级语言，可以用以下词汇来描述：\n\n- 简单\n- 面向对象\n- 分布式\n- 多线程\n- 动态\n- 与架构无关\n\
  - 可移植\n- 高性能\n- 健壮\n- 安全\n\n上述每个词在 James Gosling 和 Henry McGilton 写的白皮书《Java Language\
  \ Environment》中都有解释。1)\n\n在 Java 编程语言中，所有的源代码首先写在以 `.java` 结尾的文本文件中。这些源文件由 `javac`\
  \ 编译器编译成 `.class` 文件。`.class` 文件不包含你的处理器的原生代码，而是包含*字节码*——Java 虚拟机（`Java VM`）的机器语言。2))，`java`\
  \ 启动工具通过 Java 虚拟机实例运行你的应用程序。\n\n由于 Java 虚拟机适用于许多操作系统，相同的 `.class` 文件可以在 Microsoft\
  \ Windows、Solaris、Linux 或 Mac OS X 上运行。某些虚拟机（如 Java HotSpot 虚拟机）会在运行时执行额外的步骤以提升应用程序的性能。[3)\
  \ 这包括寻找性能瓶颈和重新编译（为原生代码）频繁使用的代码段。\n\n#### Java 平台\n\n*平台*是程序运行的硬件或软件环境。我们已经提到了一些流行的平台，如\
  \ Microsoft Windows、Linux、Solaris 和 Mac。大多数平台可以描述为操作系统和底层硬件的结合。Java 平台与其他许多其他平台不同在于，它是一个运行在其他硬件平台之上的软件平台。\n\
  \n\n\n\nJava 平台包含两个组件：\n\n- Java 虚拟机（JVM）\n- Java 应用程序编程接口（API）\n\n你已经了解了 Java 虚拟机；它是\
  \ Java 平台的基础，并被移植到各种基于的平台上。\n\n图 1.1. 软件开发流程概述\n\n图 1.2. 通过 Java 虚拟机，同一个应用程序可以在多个平台上运行\n\
  \nAPI 是一个由现成软件组件组成的集合，提供了许多实用的功能。它被分组为相关类和接口的库；这些库被称为 `packages`（包）。下一节“Java 技术能做什么？”重点介绍了\
  \ API 提供的一些功能。作为一个与平台无关的环境，Java 平台的运行速度可能比原生代码慢一些。然而，编译器和虚拟机技术的进步正在使性能接近原生代码，且不会威胁到可移植性。\n\
  \n## Java 技术能做什么？\n\n通用高级的 Java 编程语言是一种强大的软件平台。每个 Java 平台的完整实现都为你提供了以下特性：\n\n- **开发工具。**\
  \ 开发工具为你提供了编译、运行、监控、调试和记录应用程序所需的所有工具。作为一名新开发者，你将使用的主要工具是 `javac` 编译器、`java` 启动器和\
  \ `javadoc` 文档工具。\n- **API。** API 提供了 Java 编程语言的核心功能。它提供了大量现成的类，可供你的应用程序直接使用。它涵盖了从基础对象到网络和安全，再到\
  \ XML 生成和数据库访问等各个领域。核心 API 非常大；要了解其内容，请参阅 Java 平台标准版（Java SE）7 文档.（4）\n- **部署技术。**\
  \ Java SE 开发工具包（JDK）软件提供了标准机制，例如 Java Web Start 软件和 Java 插件软件，用于将你的应用程序部署给最终用户。\n\
  - **用户界面工具包。** JavaFX、Swing 和 Java 2D 工具包使得创建复杂的图形用户界面（GUI）成为可能。\n- **集成库。** 集成库如\
  \ Java 交互数据语言（IDL）API、Java 数据库连接（JDBC）API、Java 命名和目录接口（JNDI）API、Java 远程方法调用（RMI）以及基于\
  \ Internet Inter-ORB 协议技术的 Java RMI-IIOP 技术，实现了数据库访问和对远程对象的操作。\n\n## Java 技术将如何改变我的生活？\n\
  \n如果你学习 Java 编程语言，我们无法保证名声、财富甚至一份工作。尽管如此，它可能会让你的程序更好，并且比其他语言更省力。我们相信 Java 技术将帮助你完成以下工作：\n\
  \n图 1.3. API 和 Java 将程序与底层硬件隔离\n\n- **快速上手。** 虽然 Java 语言是一种强大的面向对象语言，但它很容易学习，特别是对于已经熟悉\
  \ C 或 C++ 的程序员来说。\n- **代码更少。** 程序指标（类数量、方法数量等）的比较表明，用 Java 语言编写的程序可以比用 C++ 编写相同程序小四倍。\n\
  - **编写更好的代码。** Java 语言鼓励良好的编码实践，自动垃圾回收有助于你避免内存泄漏。它的面向对象特性、JavaBeans 组件架构以及广泛且易于扩展的\
  \ API 让你重用现有的经过测试的代码，从而帮助你减少 Bug。\n- **更快速开发程序。** Java 语言比 C++ 简单，因此用它编写程序时，你的开发速度可以快一倍。你的程序也需要的代码更少。\n\
  - **避免平台依赖。** 通过避免使用其他语言编写的库，你可以保持程序的可移植性。\n- **一次编写，到处运行。** 因为用 Java 语言编写的应用程序被编译成与无关的字节码，它们在任何\
  \ Java 平台上都能一致运行。\n- **更容易发布软件。** 通过 Java Web Start 软件，用户只需点击鼠标即可启动你的应用程序。启动时的自动版本检查确保用户始终使用的是软件最新版本。如果有更新，Java\
  \ Web Start 软件会自动更新其安装。\n\n## “Hello World!”应用程序\n\n本节提供了编译和运行简单的“Hello World!”应用程序的详细说明。它提供了关于如何开始使用\
  \ NetBeans IDE 信息，这是一种集成开发环境，极大地简化了软件开发过程。NetBeans IDE 运行在所有流行的平台上；对于不使用 IDE 的启动，提供了针对特定平台的说明。首先，我们为\
  \ NetBeans IDE 用户提供说明。NetBeans IDE 运行在 Java 平台上，这意味着你可以在任何提供 JDK 7 的操作系统上使用它。我们建议尽可能使用\
  \ NetBeans IDE 而不是命令行。\n\n接下来，我们为 Microsoft Windows 用户提供了命令行指令。我们也为 Solaris 和 Linux\
  \ 用户提供了这些命令行指令。最后，我们列出了一些常见问题（及其解决方案）；如果你在编译或运行应用程序时遇到问题，请参阅本节末。\n\n### 用于 NetBeans\
  \ IDE 的“Hello World!”\n\n时候编写你的第一个应用程序了！这些详细说明是为 NetBeans IDE 用户提供的。如前所述，NetBeans\
  \ IDE 运行在 Java 平台上；你可以在任何提供 JDK 7 的操作系统上使用它。\n\n#### 清单\n\n要编写你的第一个程序，你需要：\n\n1.\
  \ **Java SE 开发工具包（本示例选择了 JDK 7）。** 要获取所有平台的此工具包，请参阅 Java SE 下载索引.（5）\n2. **NetBeans\
  \ IDE。** 要获取所有平台的此工具包，请参阅 NetBeans IDE 下载索引。（6）\n\n### 创建你的第一个应用程序\n\n你的第一个应用程序\
  \ `HelloWorldApp` 将简单地显示问候语“Hello World!”创建此程序，请执行以下操作：\n\n1. **创建一个 IDE 项目。** 当你创建一个\
  \ IDE 项目时，你创建了一个构建和运行应用程序的环境。使用 IDE 项目可以消除通常与命令行开发相关的配置问题。你可以通过选择 IDE 内的单个菜单项来构建或运行你的应用程序。\n\
  2. **在生成的源文件中添加代码。** 源文件包含用 Java 编程语言编写的代码，你和其他程序员都能理解。作为创建 IDE 项目的一部分，系统会自动生成一个骨架源文件。然后你修改源文件以添加“Hello\
  \ World!”消息。\n3. **将源文件编译为 .class 文件。** IDE 调用 Java 编程语言编译器 `(javac)`，它将你的源文件翻译成\
  \ Java 虚拟机可以理解的指令。文件中的指令被称为字节码。\n4. **运行程序。** IDE 调用 Java 应用程序启动工具 `(java)`，它使用\
  \ Java 虚拟机运行你的应用程序。\n\n1. 启动 NetBeans IDE。\n\n\n\n\n\n- 在 Microsoft Windows 系统上，使用**开始**菜单中的\
