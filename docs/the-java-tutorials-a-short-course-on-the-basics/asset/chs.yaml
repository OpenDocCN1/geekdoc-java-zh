  ### 注解\n注解提供了关于程序但并非程序本身的数据。它们对所注解代码的操作没有直接影响。注解有多种用途，包括：\n\n* 编译器的信息。编译器可以使用注解来检测错误或抑制警告。\n\
  * 编译时和部署时处理。软件工具可以处理注解信息以生成代码、XML 文件等等。\n* 运行时处理。某些注解可以在运行时进行检查。\n\n注解可以应用于程序中类、字段和其他元素的声明。注解首先出现（按照惯例，独占一行），并可能包含带有命名或未命名命值的\
  \ `elements`（元素）：\n\n```java\n@Author(\n    name = \"Benjamin Franklin\",\n    date\
  \ = \"3/27/2003\"\n)\nclass MyClass { }\n```\n\n这是另一个示例：\n\n```java\n@SuppressWarnings(value\
  \ = \"unchecked\")\nvoid myMethod() { }\n```\n\n如果只有一个名为 `value` 的元素，则可以省略名称：\n\n\
  ```java\n@SuppressWarnings(\"unchecked\")\nvoid myMethod() { }\n```\n\n此外，如果注解没有元素，则可以省略括号：\n\
  \n```java\n@Override\nvoid myMethod() { }\n```\n\n#### 文档\n许多注解取代了本应是代码中的注释。假设一个软件小组传统上在每个类的体部用注释提供重要信息：\n\
  \n点击查看代码图像\n\n```java\npublic class Generation3List extends Generation2List {\n\
  \    // Author: John Doe\n    // Date: 3/17/2002\n    // Current revision: 6\n \
  \   // Last modified: 4/12/2004\n    // By: Jane Doe\n    // Reviewers: Alice, Bill,\
  \ Cindy\n    // class goes here\n}\n```\n\n要使用注解添加这些相同的元数据，你必须先定义注解类型。执行此操作的语法如下：\n\
  \n点击查看代码图像\n\n```java\n@interface Classreamble {\n    String author();\n    String\
  \ date();\n    int currentRevision() default 1;\n    String lastModified() default\
  \ \"N/A\";\n    String lastModifiedBy() default \"N/A\";\n    // 注意数组用法\n    String[]\
  \ reviewers();\n}\n```\n\n注解类型定义看起来很像接口，`interface` 关键字前面有一个 `@` 符号（如“AT”）。注解类型实际上是接口的一种，将在第\
  \ 5 章中介绍。\n\n注解体包含声明，看起来非常像方法。注意这些方法可以定义默认值。\n\n一旦定义了注解类型，你就可以使用该注解并填充值，如下：\n\n\
  点击查看代码图像\n\n```java\n@Classreamble (\n    author = \"John Doe\",\n    date = \"\
  3/17/2002\",\n    currentRevision = 6,\n    lastModified = \"4/12/2004\",\n    lastModifiedBy\
  \ = \"Jane Doe\",\n    // 注意数组表示\n    reviewers = {\"Alice\", \"Bob\", \"Cindy\"\
  }\n)\npublic class Generation3List extends Generation2List {\n    // 类代码在此\n}\n\
  ```\n\n### 注意\n要让 `@Classreamble` 中的信息出现在 Javadoc 生成的文档中，你必须对 `@Classreamble` 定义本身也注解\
  \ `@Documented` 注解：\n\n```java\n// 此以使用 @Documented\nimport java.lang.annotation.*;\n\
  \n@Documented\n@interface Classreamble {\n    // 注解元素定义\n}\n```\n\n#### 编译器使用的注解\n\
  有三种语言规范本身预定义的注解类型：`@Deprecated`、`@Override` 和 `@SuppressWarnings`。\n\n`@Deprecated`^(5)\
  \ 注解表示被标记的元素已过时。当程序使用带有 `@Deprecated` 注解的方法、类或字段时，编译器会生成警告。当元素过时时，还应该使用 Javadoc\
  \ `@deprecated` 标签进行记录，如下所示。在 Javadoc 注释和注解中使用 @ 符号并非巧合——它们在概念上是相关的。此外，注意 Javadoc\
  \ 标签以小写 *d* 开头，而注解以大写 *D* 开头：\n\n```java\n// Javadoc 注释如下\n/**\n * @deprecated\n\
  \ * 解释为什么\n * 它过时了\n */\n@Deprecated\nstatic void deprecatedMethod() { }\n}\n```\n\
  \n\n\n\n\n`@Override` 注解告知编译器该元素旨在重写父类中声明的元素。（重写方法将在[第 5 章]中讨论。）\n\n```java\n//\
  \ mark method as a superclass method\n// that has been overridden\n@Override\nint\
  \ overriddenMethod() { }\n```\n\n虽然重写方法时并不强制使用此注解，但它可以帮助防止错误。如果标记了 `@Override` 的方法未能正确重写其任一父类中的方法，编译器将生成错误。\n\
  \n`@SuppressWarnings` 注解告诉编译器抑制它原本会生成的特定警告。在下面的示例中，使用了一个已弃（deprecated）的方法，这通常会导致编译器生成警告。在这种情况下，该注解抑制了警告：\n\
  \n```java\n// use a deprecated method and tell\n// compiler not to generate a warning\n\
  @SuppressWarnings(\"deprecation\")\nvoid useDeprecatedMethod() {\n    // deprecation\
  \ warning\n    // - suppressed\n    objectOne.deprecatedMethod();\n}\n```\n\n每个编译器警告都属于一个类别。Java\
  \ 语言规范列出了两个警告类别：`deprecation`（弃用）和 `unchecked`（未检查）。当与泛型出现之前编写的遗留代码进行交互时，可能会发生未检查警告（[第\
  \ 6 章]）。要抑制多个类别的警告，可以使用以下语法：\n\n```java\n@SuppressWarnings({\"unchecked\", \"deprecation\"\
  })\n```\n\n## 注解处理\n\n注解的高级用法包括编写注解处理器，该处理器可以读取 Java 程序并根据注解采取行动。例如，注解处理器可以生成辅助源代码，让程序员无需创建始终遵循预测模式的样板代码。为了方便这项工作，Java\
  \ SE 开发包（JDK）5.0 版本包含了一个名为 `apt` 的注解处理工具。从 JDK 6 版本开始，`apt` 的功能成为 Java 编译器的标准部分。\n\
  \n要在运行时提供注解信息，注解类型本身必须标记为 `@Retention(RetentionPolicy.RUNTIME)`，如下：\n\n```java\n\
  import java.lang.annotation.*;\n\n@Retention(RetentionPolicy.RUNTIME)\n@interface\
  \ AnnotationForRuntime {\n    // Elements that give information\n    // for runtime\
  \ processing\n}\n```\n\n## 问题与练习题：注解\n\n## 问题\n\n**1.** 下面接口哪里出了问题？\n\n```java\n\
  public interface House {\n    @Deprecated\n    void open();\n    void openFrontDoor();\n\
  \    void openBackDoor();\n}\n```\n\n**2.** 考虑问题 1 所示的 `House` 接口实现：\n\n```java\n\
  public class MyHouse implements House {\n    public void open() {}\n    public void\
  \ openFrontDoor() {}\n    public void openBackDoor() {}\n}\n```\n\n如果你编译此程序，编译器会抱怨\
  \ `open` 已被弃用（在接口中）。你可以做什么来消除该警告？\n\n## 练习\n\n**1.** 为增强请求定义一个注解类型，包含元素 `id`、`synopsis`、`engineer`\
  \ 和 `date`。指定 `engineer` 的默认值为 `unassigned`，`date` 的默认值为 `unknown`。\n\n## 答案\n\n\
  你可以在此处找到这些问题和练习题的答案：[`http://docs.oracle.com/javase/tutorial/java/javaOO/QandE/annotations-answers.html`](http://docs.oracle.com/javase/tutorial/java/javaOO/QandE/annotations-answers.html)。\n\
  \n## 5. 接口与继承\n\n章节内容\n- 接口\n\n你之前已经在[第 4 章]中看到了实现接口的示例。你可以在本章的第一节阅读更多关于接口的内容：它们的用途、你为什么可能编写接口以及如何编写接口。本章的第二节描述了从一个类派生另一个类的方法——即子类如何从父类继承字段和方法。你将学习所有类都派生自\
  \ `Object` 类，并学习如何修改子类从父类继承的方法。本节涵盖了类似接口的抽象类。每个节结束都有问题和练习题，以测试你的理解。\n\n### 接口\n\n\
  在软件工程中，许多情况下，不同的程序员小组同意一个“合同”来规定它们的软件如何相互作用是非常关重要的。每个小组都应该能够在不了解另一组代码实现的情况下编写自己的代码。通常来说，`interfaces`\
  \ 就是这种合同。\n\n例如，想象一个未来的社会，计算机控制的机器人汽车在没有人类操作员的情况下在街道上运输乘客。汽车制造商编写运行汽车的软件（当然是 Java）——停止、启动、加速。另一组电子引导制作接收交通状况并使用这些信息驱动汽车的系统。制造商必须发布一个接口，详细说明可以调用哪些方法。两组都不需要知道软件是如何实现的；事实上，只要遵守接口，每一组都保留随时修改它的权利。\n\
  \n#### Java 中的接口\n\n在 Java 语言中，`interface` 是一种引用类型，类似于类，可以包含常量、方法签名和嵌套类型。它们没有方法体。接口不能被实例化——它们只能由类实现或由接口扩展。扩展将在稍后讨论。\n\
  \n定义接口类似于创建一个新类：\n\n```java\npublic interface OperateCar {\n    // constant declarations,\
  \ if any\n    // method signatures\n    // enum with values\n    int turn(Direction\
  \ direction, double radius, double startSpeed, double endSpeed);\n    int changeLanes(Direction\
  \ direction, double startSpeed, double endSpeed);\n    int signalTurn(Direction\
  \ direction, boolean signalOn);\n    int getRadarFront(double distanceToCar, double\
  \ speedOfCar);\n    int getRadarRear(double distanceToCar, double speedOfCar);\n\
  \    // ... ...\n    // more method signatures\n}\n```\n\n请注意，方法签名没有大括号，并以分号结束。\n\
  \n要使用接口，你需要编写一个 `implements` 该接口的类。当可实例化的类实现接口时，它为接口中声明的每个方法提供方法体。这是一个示例：\n\n```java\n\
  public class OperateBMW760i implements OperateCar {\n    // the OperateCar method\
  \ signatures, with implementation\n    // for example:\n    int signalTurn(Direction\
  \ direction, boolean signalOn) {\n        // 处开启 BMW 左转转向指示灯的代码\n        // 处关闭\
  \ BMW 左转转向指示灯的代码\n        // 处开启 BMW 右转转向指示灯的代码\n        // 处关闭 BMW 右转转向指示灯的代码\n\
  \    }\n    // 其他成员，根据需要——例如，对接口客户端不可\n    // 见的的辅助类\n}\n```\n\n\n\n\n在这个机器人汽车的示例中，由汽车制造商来实现该接口。当然，雪佛兰的实现将与丰田的大不相同，但两家制造商都将遵循相同的接口。导航制造商作为接口的客户端，将构建系统，利用汽车位置的\
  \ GPS 数据、数字地图和交通数据来驱动汽车。在此过程中，导航系统将调用接口方法：`turn`、`change lanes`、`brake`、`accelerate`\
  \ 等。\n\n### 接口作为 API\n机器人汽车的示例展示了接口如何被用作行业标准的应用程序编程接口（API）。API 在商业软件产品中也很常见。通常，一家公司会出售一个软件软件包，其中包含了另一家公司希望在自己的软件产品中使用的复杂方法。例如，一组数字图像处理方法包被出售给制造终端用户图形程序的公司。图像处理公司编写其类来实现一个接口，并将其向客户公开。然后，图形公司就使用接口中定义的签名和返回类型来调用图像处理方法。虽然图像处理公司的\
  \ API 是公开的（面向其客户），但其对 API 的实现被视为严密保护的秘密——事实上，只要该公司继续实现客户所信赖的原始原始接口，它就可以在以后修改该实现。\n\
  \n### 接口与多继承\n接口在 Java 编程语言中还有另一个非常重要的作用。接口不是类层次的一部分，尽管它们与类结合工作。Java 编程语言不允许多重继承，但提供了一种替代方案。（继承将在本章稍后讨论。）\n\
  \n在 Java 中，一个类只能继承一个类，但它可以实现多个接口。因此，对象可以拥有多种类型：它们所属类的类型，以及它们所实现的所有接口的类型。这意味着，如果一个变量被声明为接口类型，则它的值可以引用从任何实现该接口的类中实例化的任何对象。这将在本章的“使用接口作为类型”节中讨论。\n\
  \n### 定义接口\n接口声明由修饰符、`interface` 关键字、接口名称、用逗号分隔的父接口列表（如果有）以及接口体组成。这是一个示例：\n\n```\n\
  public interface GroupedInterface extends Interface1, Interface2, Interface3 {\n\
  \    // 常量声明\n    // 自然对数的底\n    double E = 2.718282;\n\n    // 方法签名\n    void doSomething\
  \ (int i, double x);\n    int doSomethingElse(String s);\n}\n```\n\n`public` 访问修饰符表示接口可以被任何包中的任何类使用。如果你不指定接口为\
  \ `public`，则你的接口仅对定义在接口相同包中的类可见。\n\n接口可以扩展其他接口，就像类可以扩展或子类另一个类一样。然而，类只能扩展另一个类，而接口可以扩展任意数量的接口。接口声明包含了它所扩展的所有接口的逗号分隔列表。\n\
  \n#### 接口体\n接口体包含了接口中包含的所有方法的声明。接口内部的方法声明后面跟着一个分号，但没有大括号，因为接口不为其内部声明的方法提供实现。接口中声明的所有方法都是隐式为\
  \ `public` 的，因此可以省略 `public` 修饰符。\n\n接口除了方法声明外，还可以包含常量声明。接口中定义的所有常量值都是隐式 `public`、`static`\
  \ 和 `final` 的。再次，这些修饰符可以省略。\n\n### 实现接口\n要声明一个实现接口的类，请在类声明中包含 `implements` 子句。你的类可以实现多个接口，因此\
  \ `implements` 关键字后面跟着一个用逗号分隔的类实现的接口列表。按照惯例，如果存在 `extends` 子句，则 `implements` 子句在其之后。\n\
  \n#### 示例接口：Relatable\n考虑一个定义了如何比较对象大小的接口：\n\n```\npublic interface Relatable {\n\
  \    // this (调用 isLargerThan 的对象)\n    // 和 other 必须是\n    // 同一个类的实例，返回 1, 0,\
  \ -1\n    // 如果 this 大于 // 大于\n    // 等于，或小于于 other\n    public int isLargerThan(Relatable\
  \ other);\n}\n```\n\n如果你想能够比较相似对象的大小，无论它们是什么，实例化它们的类都应该实现 `Relatable`。\n\n只要有某种方法可以比较从该类中实例化的对象的相对“大小”，任何类都可以实现\
  \ `Relatable`。对于字符串，可以是字符数；对于书本，可以是页数；对于学生，可以是体重；以此此类推。对于平面几何对象，面积是一个很好的选择（请参阅后文的\
  \ `RectanglePlus` 类），而对于三维几何对象，体积是可行的。所有此类类都可以实现 `isLargerThan()` 方法。如果你知道一个类实现了\
  \ `Relatable`，你就可以比较大小。\n\n```\nclass RectanglePlus implements Relatable {\n   \
  \ public int width = 0;\n    public int height = 0;\n    public Point origin;\n\n\
  \    public RectanglePlus() {\n        origin = new Point(0, 0);\n    }\n\n    public\
  \ RectanglePlus(Point p) {\n        origin = p;\n    }\n\n    public RectanglePlus(int\
  \ w, int h) {\n        origin = new Point(0, 0);\n        width = w;\n        height\
  \ = h;\n    }\n\n    public void move(int x, int y) {\n        origin.x = x;\n \
  \       origin.y = y;\n    }\n\n    public int getArea() {\n        return width\
  \ * height;\n    }\n\n    public int isLargerThan(Relatable other) {\n        RectanglePlus\
  \ otherRect = (RectanglePlus)other;\n        if (this.getArea() < otherRect.getArea())\
  \ {\n            return -1;\n        } else if (this.getArea() > otherRect.getArea())\
  \ {\n            return 1;\n        } else {\n            return 0;\n        }\n\
  \    }\n}\n```\n\n因为 `RectanglePlus` 实现了 `Relatable`，所以任意 `RectanglePlus` 对象的大小是可以比较的。\n\
  \n***\n\n注意\n\n在 `Relatable` 接口中定义的 `isLargerThan` 方法接收一个 `Relatable` 类型的对象。加粗的代码行将\
  \ `other` 强制转换为 `RectanglePlus` 实例。类型转换告诉编译器该对象的真实类型。在 `other` 实例上直接调用 `getArea`（`other.getArea()`）将编译失败，因为编译器并不理解\
  \ `other` 实际上是 `RectanglePlus` 的实例。\n\n\n\n\n当你定义一个新的接口（interface）时，你是在定义一个新的的引用数据类型。你可以在任何可以使用其他数据类型名称的地方使用接口名称。如果你定义了一个类型为接口的引用变量，赋值给它的任何对象*必须*是实现该接口的类的实例。\n\
  \n例如，这里有一个用于在一对对象中寻找最大对象的方法，适用于*任何*实现了 `Relatable` 接口的类所实例化的对象：\n\n点击此处查看代码图片\n\n\
  ```java\npublic Object findLargest(Object object1, Object object2) {\n    Relatable\
  \ obj1 = (Relatable)object1;\n    Relatable obj2 = (Relatable)object2;\n    if ((obj1).isLargerThan(obj2)\
  \ > 0)\n        return object1;\n    else\n        return object2;\n}\n```\n\n由于\
  \ `object1` 已经强制转换为 `Relatable` 类型，它现在可以调用 `isLargerThan` 方法了。\n\n如果你特意在许多类中实现 `Relatable`，那么只要两个对象属于同一个类，从这些*任何*类中实例化的对象都可以使用\
  \ `findLargest()` 方法进行比较。同样，它们都可以使用以下方法进行比较：\n\n点击此处查看代码图片\n\n```java\npublic Object\
  \ findSmallest(Object object1, Object object2) {\n    Relatable obj1 = (Relatable)object1;\n\
  \    Relatable obj2 = (Relatable)object2;\n    if ((obj1).isLargerThan(obj2) < 0)\n\
  \        return object1;\n    else\n        return object2;\n}\n\npublic boolean\
  \ isEqual(Object object1, Object object2) {\n    Relatable obj1 = (Relatable)object1;\n\
  \    Relatable obj2 = (Relatable)object2;\n    if ((obj1).isLargerThan(obj2) ==\
  \ 0)\n        return true;\n    else\n        return false;\n}\n```\n\n这些方法适用于任何“可比较”的对象，无论它们的类继承关系如何。当它们实现\
  \ `Relatable` 时，它们既可以是它们自身所属的类（或父类）类型，也可以是 `Relatable` 类型。这使得它们具有多重继承的一些优势，即它们可以同时拥有来自父类和接口的行为。\n\
  \n## 重写接口\n\n考虑你开发的一个名为 `DoIt` 的接口：\n\n点击此处查看代码图片\n\n```java\npublic interface DoIt\
  \ {\n    void doSomething(int i, double x);\n    int doSomethingElse(String s);\n\
  }\n```\n\n假设在以后某个时候，你想为 `DoIt` 添加第三个方法，按如下方式更改接口：\n\n点击此处查看代码图片\n\n```java\npublic\
  \ interface DoIt {\n    void doSomething(int i, double x);\n    int doSomethingElse(String\
  \ s);\n    boolean didItWork(int i, double x, String s);\n}\n```\n\n如果你进行了此更改，所有实现旧\
  \ `DoIt` 接口的类都会报错，因为它们不再实现了该接口。依赖此接口的程序员会强烈抗议。\n\n尝试预测你的接口的所有用途，并从一开始就对其进行完整规范。考虑到这通常是不可能的，你可能需要在稍后创建更多接口。例如，你可以创建一个扩展\
  \ `DoIt` 的 `DoItPlus` 接口：\n\n点击此处查看代码图片\n\n```java\npublic interface DoItPlus extends\
  \ DoIt {\n    boolean didItWork(int i, double x, String s);\n}\n```\n\n现在，你代码的用户可以选择继续使用旧接口或升级到新接口。\n\
  \n## 接口总结\n\n接口定义了两个对象之间的通信协议。接口声明包含一组方法的签名，但没有实现体，并且还可能包含常量定义。实现接口的类必须实现接口中声明的所有方法。接口名称可以在任何可以使用类型的地方使用。\n\
  \n## 思考与练习：接口\n\n### 思考\n\n**1.** 实现 `java.lang.CharSequence` 接口的类需要实现哪些方法？\n\n\
  **2.** 下面的接口哪里有问题？\n\n点击此处查看代码图片\n\n```java\npublic interface SomethingIsWrong {\n\
  \    void aMethod(int aValue){\n        System.out.println(\"Hi Mom\");\n    }\n\
  }\n```\n\n**3.** 修复第 2 题中的接口。\n\n**4.** 下面的接口有效吗？\n\n```java\npublic interface Marker\
  \ {\n```\n\n## 练习\n\n**1.** 写一个实现 `lang` 包中 `CharSequence` 的类。\n\n**2.** 假设你有一个服务器定期通知其客户端当前的日期和时间。编写一个简单的\
  \ `main` 方法进行测试。\n\n## 答案\n\n你可以在 `http://docs.oracle.com/javase/tutorial/IandE/interfaces.html`\
  \ 找到这些问题和练习的答案。\n\n### 继承\n\n你已经多次看到*继承*（inheritance）。在 Java 语言中，类可以被*派生*（derived）。\n\
  \n### 定义\n\n派自另一个类的类被称为*子类*（subclass，也称为*派生类*、*子类*）。派生自出的类被称为*父类*（superclass，也称为*基类*、*父类*）。除了没有父类的\
  \ `Object`，每个类只有一个直接父类。\n\n继承的概念简单而强大：当你想要创建一个新类，并且已经有一个类包含了其中的部分代码时，你可以从该类派生出你的新类。这样做，你可以重用现有类的字段和方法，而无需编写（以及调试！）它们。\n\
  \n子类继承父类的所有*成员*（字段、方法、内部类）。构造方法不是成员，因此不会被继承，但可以在子类中调用父类的构造方法。\n\n#### Java 平台层次结构\n\
  \n`Object` 类（见文 _ch5fn1）定义在 `lang` 包中，定义并实现了所有类的公共行为——包括你写的类。在 Java 平台上，许多类直接派自\
  \ `Object`，其他类派生自这些类，依此类推，形成了一个类层次结构（见图 5.1](#part0009.html_ch5fig01)).在层次结构的顶端，`Object`\
  \ 是所有类中最通用的。位于底部的类提供了更具体的行为。\n\n![Image](img/00045.jpeg)\n\n图 5.1 Java 平台上所有的类都是\
  \ Object 的后代\n\n#### 继承示例\n\n这是第 4 章](#part0008.html_ch04)中介绍的 `Bicycle` 类的可能实现示例代码：\n\
  \n点击此处查看代码图片\n\n```java\npublic class Bicycle {\n    // Bicycle 类有\n    // 三个字段\n\
  \    public int cadence;\n    public int gear;\n    public int speed;\n\n    //\
  \ Bicycle 类有\n    // 一个构造方法\n    public Bicycle(int startCadence, int startSpeed,\
  \ int startGear) {\n        gear = startGear;\n        cadence = startCadence;\n\
  \        speed = startSpeed;\n    }\n\n    // Bicycle 类有\n    // 四个方法\n    public\
  \ void setCadence(int newValue) {\n        cadence = newValue;\n    }\n}\n```\n\n\
  \n\n\n```java\npublic void setGear(int newValue) {\n    gear = newValue;\n}\npublic\
  \ void applyBrake(int decrement) {\n    speed -= decrement;\n}\npublic void speedUp(int\
  \ increment) {\n    speed += increment;\n}\n}\n```\n\n一个作为 `Bicycle` 子类的 `MountainBike`\
  \ 类的声明可能如下：\n\n点击此处查看代码图片\n\n```java\npublic class MountainBike extends Bicycle\
  \ {\n    // MountainBike 子类增加了\n    // 一个字段\n    public int seatHeight;\n    //\
  \ MountainBike 子类有一个\n    // 构造函数\n    public MountainBike(int startHeight,\n  \
  \                      int startCadence,\n                        int startSpeed,\n\
  \                        int startGear) {\n        super(startCadence, startSpeed,\
  \ startGear);\n        seatHeight = startHeight;\n    }\n\n    // MountainBike 子类增加了\n\
  \    // 一个方法\n    public void setHeight(int newValue) {\n        seatHeight = newValue;\n\
  \    }\n}\n```\n\n`MountainBike` 继承了 `Bicycle` 的所有字段和方法，并添加了字段 `seatHeight` 以及一个设置它的方法。除了构造函数之外，这就像是你完全从零写了一个全新的\
  \ `MountainBike` 类，包含四个字段和五个方法。然而，你并不需要完成所有工作。如果 `Bicycle` 类中的方法非常复杂并且花费了大量时间调试，那么这样做将特别有价值。\n\
  \n### 你可以在子类中做什么\n\n无论子类位于哪个包，它都会继承其父类所有的 `public` 和 `protected` 成员。如果子类与其父类在同一个包中，它还会继承父类的\
  \ `package-private`（包级私有）成员。你可以直接使用这些继承来的成员，也可以替换它们、隐藏它们或用新成员来补充它们：\n\n- 你可以直接使用继承的字段，就像使用任何其他字段一样。\n\
  - 你可以在子类中声明一个与父类中同名的字段，从而将其“隐藏（hiding）”（不建议这样做）。\n- 你可以在子类中声明父类中不存在的新字段。\n- 你可以直接按原样使用继承的方法。\n\
  - 你可以在子类中写一个与父类中方法具有相同签名的 `instance` 方法，从而对其进行“重写（overriding）”。\n- 你可以在子类中写一个与父类中方法具有相同签名的\
  \ `static` 方法，从而将其“隐藏（hiding）”。\n- 你可以在子类中声明父类中不存在的新方法。\n- 你可以写一个子类构造函数来调用父类的构造函数，可以是隐式的，也可以通过使用\
  \ `super` 关键字。\n\n本章的后续章节将扩展介绍这些主题。\n\n#### 父类中的私有成员\n\n子类不继承父类的 `private` 成员。然而，如果父类具有公共或受保护的方法来访问其私有字段，那么这些方法也可以被子类使用。\n\
  \n嵌套类可以访问其外部类所有的私有成员——包括字段和方法。因此，子类继承的公共或受保护嵌套类可以间接访问父类的所有私有成员。\n\n### 对象类型转换\n\n\
  我们已经看到，给定对象的数据类型是其实例化所属类的类型。这里有一个示例：\n\n```java\nMountainBike myBike = new MountainBike();\n\
  ```\n\n在这种情况下，`myBike` 的类型是 `MountainBike`。`MountainBike` 继承自 `Bicycle` 和 `Object`。因此，一个\
  \ `MountainBike` 既是一个 `Bicycle` 也是一个 `Object`，可以在任何需要 `Bicycle` 或 `Object` 对象的地方使用它。反之则未必：一个\
  \ `Bicycle` 可能是一个 `MountainBike`，但并不一定。同样，一个 `Object` 可能是一个 `Bicycle` 或 `MountainBike`，但也不一定是。\n\
  \n`类型转换（Casting）` 显示了在继承和实现允许的对象之间，用一种类型的对象代替另一种类型。这里有一个示例：\n\n```java\nObject obj\
  \ = new MountainBike();\n```\n\n在这种情况下，`obj` 既是一个 `Object` 也是一个 `MountainBike`（直到\
  \ `obj` 被赋值另一个不是 `MountainBike` 的对象）。这被称为`隐式转换（implicit casting）`。\n\n另一方面，我们可以写如下代码：\n\
  \n```java\nMountainBike myBike = obj;\n```\n\n在这里我们将得到一个编译错误，因为编译器不知道 `obj` 是一个\
  \ `MountainBike`。然而，我们可以通过 `显式转换（explicit casting）` 告诉编译器，我们承诺给 `obj` 赋值一个 `MountainBike`：\n\
  \n```java\nMountainBike myBike = (MountainBike)obj;\n```\n\n这种转换插入了一个运行时检查，在给 `obj`\
  \ 赋值 `MountainBike` 时，这样编译器就可以安全地假设 `obj` 是一个 `MountainBike`。如果运行时 `obj` 不是 `MountainBike`，则会抛出异常。\n\
  \n***\n\n**注意**\n\n你可以使用 `instanceof` 运算符进行逻辑测试以确定特定对象的类型。这可以防止不当的类型转换。这里有一个示例：\n\
  \n```java\nif (obj instanceof MountainBike) {\n    MountainBike myBike = (MountainBike)obj;\n\
  }\n```\n\n### 重写与隐藏方法\n\n#### 实例方法\n\n子类中与父类实例方法具有相同签名（名称以及参数类型）和返回类型的 `instance`\
  \ 方法对父类方法进行`重写（overrides）`。子类的重写能力允许类继承一个行为“足够”的父类，然后根据需要对其进行修改。重写方法还可以返回返回类型的子类型。这被称为`协变返回类型（covariant\
  \ return type）`。\n\n在重写方法时，你可能想使用 `@Override` 注解，它指示编译器你打算重写父类中的方法。如果由于某种原因编译器检测到该方法不存在，它将生成错误。有关\
  \ `@Override` 的更多信息，请参阅第 4 章。\n\n#### 类方法\n\n如果子类定义了一个与父类类方法具有相同签名的类方法，则子类方法会对父类方法进行`隐藏（hides）`。隐藏与重写的区别具有重要的影响。被调用的方法版本取决于是从父类还是子类调用的。\n\
  \n```java\npublic class Animal {\n    public static void testClassMethod() {\n \
  \       System.out.println(\"The class method in Animal.\");\n    }\n    public\
  \ void testInstanceMethod() {\n        System.out.println(\"The instance method\
  \ in Animal.\");\n    }\n}\n```\n\n第二个类是 `Animal` 的子类——`Cat`：\n\n```java\npublic\
  \ class Cat extends Animal {\n    public static void testClassMethod() {\n     \
  \   System.out.println(\"The class method in Cat.\");\n    }\n    public void testInstanceMethod()\
  \ {\n        System.out.println(\"The instance method in Cat.\");\n    }\n    public\
  \ static void main(String[] args) {\n        Cat myCat = new Cat();\n        Animal\
  \ myAnimal = myCat;\n        Animal.testClassMethod();\n        myAnimal.testInstanceMethod();\n\
  \    }\n}\n```\n\n\n\n\n\n`Cat` 类重写了 `Animal` 中的实例方法，并隐藏了 `Animal` 中的类方法。该类中的 `main`\
  \ 方法创建了一个 `Cat` 实例，并在类上调用了 `testClassMethod()` 在实例上调用了 `testInstanceMethod()`。此程序的输出如下：\n\
  \nAnimal 中的类方法。\n\nCat 中的实例方法。\n\n正如所承诺的，被调用的隐藏方法版本是父类中的，而被调用的重写方法版本是子类中的。\n\n###\
  \ 修饰符\n\n重写方法的访问修饰符可以允许比被重写方法更多的访问权限（但不能更少）。例如，父类中的一个 `protected` 实例方法在子类中可以变为 `public`，但不能变为\
  \ `private`。如果你尝试将父类中的实例方法更改为子类中的类方法（反之亦然），将得到编译时错误。\n\n### 总结\n\n表 5.1 总结了当你定义一个与父类方法签名相同的方法时发生的情况。\n\
