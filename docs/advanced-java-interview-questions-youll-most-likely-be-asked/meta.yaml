    \n# 124: 你如何带 URL 中的参数调用 Servlet？\n\n答案：我们可以通过表单带参数调用 Servlet，例如 http://localhost:8080/servlet?param1=servlet1&param2=servlet2\n\
    \n此页面故意留白\n\n# Collections（集合）\n\n# 125: ArrayList 和 LinkedList 都实现了 `get(int)`\
