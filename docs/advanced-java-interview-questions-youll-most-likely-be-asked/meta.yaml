    \n# 高级 JAVA 面试题\n你最可能被问到的问题\n\n# 第二版\n\n© 2014, Vibrant Publishers, USA. 版权所有。未经出版者事先许可，不得以任何形式或通过任何手段复制或发行出版出版，或存储在数据库或检索系统中。\n\
