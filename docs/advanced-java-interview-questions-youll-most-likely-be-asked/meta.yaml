    ## 30: CORBA 2.0 提供了哪些操作调用技术？\n\n答案：\n\nCORBA 2.0 提供的三种操作调用技术是：\n\n- a) 同步 (Synchronous)\n\
    - b) 延迟同步 (Deferred Synchronous)\n- c) 单向 (One-way)\n\n## 31: 什么是同步操作调用技术？\n\n\
    答案：\n\n在同步操作技术中，客户端调用一个操作。然后它会挂起以等待响应。\n\n## 32: 什么是延迟同步操作调用技术？\n\n答案：\n\n在延迟同步操作调用技术中，客户端调用一个操作后继续处理。稍后客户端可以轮询或阻塞等待响应。\n\
    \n## 33: 什么是单向操作调用技术？\n\n答案：\n\n在单向操作调用技术中，客户端调用一个操作且不等待也不期望任何响应。ORB（对象请求代理）保证请求的交付。\n\
    \n## 34: 分布式对象提供的服务是如何定义的？\n\n答案：\n\n接口定义语言（IDL）定义了特定分布式对象提供的服务。\n\n## 35: 哪个\
    \ CORBA 服务定义了对象的复制、移动、创建和删除？\n\n答案：\n\n对象周期服务（Object life cycle service）定义了它们。\n\
    \n## 36: 写出解耦分布式对象之间通信的 CORBA 服务名称。\n\n答案：\n\n事件服务（Events service）解耦了分布式对象之间的通信。\n\
    \n## 37: 对象接口代表了它是或将如何实现吗？\n\n答案：\n\n不。对象接口仅指示支持的操作。\n\n## 38: 说 IDL 提供了对象的实现正确吗？\n\
    \n答案：\n\n不。IDL 提供了使用对象的代码与实现对象的代码之间的约。实际实是在编程语言中完成的。\n示例：Java, C++\n\n## 39: 写出\
    \ OMG 已对语言绑定进行标准化的编程语言。\n\n答案：\n\nC, C++, Java, Ada, COBOL, Smalltalk, Objective\
    \ C 和 Lisp 编程语言。\n\n## 40: 写出 IDL 的基本数据类型。\n\n答案：\n\nIDL 的基本数据类型有 long, short,\
    \ string, float...\n\n## 41: 你想在 IDL 中使用构造数据类型。你有哪些选择？\n\n答案：\n\nstruct（结构体）、union（联合体）、enum（枚举）、sequence（序列）\n\
    \n## 42: 使用哪个编译器来编译 IDL 声明？\n\n答案：\n\nIDL 编译器\n\n## 43: 客户端使用什么向 CORBA 对象发出请求？\n\
    \n答案：\n\n客户端使用对象引用（object reference）来向 CORBA 对象发出请求。\n\n## 44: IDL 结构 'module'\
    \ 对应 Java 的哪种结构？\n\n答案：\npackage 结构。\n\n## 45: IDL 结构 'operation' 对应 Java 的哪种结构？\n\
    \n答案：\nmethod 结构。\n\n## 46: 哪些基本机制可以获取对象引用？\n\n答案：\n\n可以通过作为参数传递、作为结果返回或将字符串转换为对象引用来获取对象引用。这些都由\
    \ ORB 支持。\n\n# 线程 (Threading)\n\n## 47: 在 Java 中创建线程的两种方式？\n\n答案：\n\n我们可以扩展 `Thread`\
    \ 类并重写 `public void run()` 方法，或者调用接受 `Runnable` 参数的 `Thread` 构造函数。\n\n## 48: 如果对同一个线程对象多次调用\
    \ `start()` 会发生什么？\n\n答案：\n\n将抛出一个 `RuntimeException`。\n\n## 49: 可以同一个 Runnable\
    \ 对象作为目标创建多个 Thread 对象吗？\n\n答案：\n\n不可以。这是非法的。\n\n## 50: 线程对象何时变成执行线程？\n\n答案：\n\
    \n在调用 Thread 的 `start()` 时，它变成一个执行线程。\n\n## 51: 线程何时被认为是存活的？\n\n答案：\n\n在调用 Thread\
    \ 的 `start()` 时。\n\n## 52: 启动一个新线程。它将进入哪种状态？\n\n答案：\n\n它进入 Runnable 状态。\n\n##\
    \ 53: 线程何时进入死亡（dead）状态？\n\n答案：\n\n一旦其 `run` 方法完成。\n\n## 54: 你有一台单处理器机器。同时可以有多少个线程处于运行状态？\n\
    \n答案：\n\n只能有一个线程处于运行状态。\n\n## 55: 线程启动的顺序决定了它们的运行顺序吗？\n\n答案：\n\n不。是由线程调度器调度线程的。\n\
    \n## 56: 线程会公平地轮替执行吗？\n\n答案：\n\n这取决于特定的 JVM。\n\n## 57: 如何保证线程无论底层如何轮替执行？\n\n答案：\n\
    \n你需要使用 `sleep()` 方法来防止线程饥饿。\n\n## 58: 你在线程上调用了 `sleep()` 方法以延迟一段时间。睡眠结束后它会立即开始运行吗？\n\
    \n答案：\n\n没有这种保证。它进入 Runnable 状态。\n\n## 59: 什么是线程优先级？如何定义它？\n\n答案：\n\n线程优先级是告诉操作系统给每个线程分配多少资源的方法。优先级可以通过\
    \ `Thread.setPriority(int)` 设置。线程优先级的范围从 1 到 10，10 是最高的。\n\n## 60: 线程的默认优先级是多少？\n\
    \n答案：\n\n线程获得与其创建它的线程相同的优先级。\n\n## 61: `join()` 方法的目的是什么？\n\n答案：\n\n如果 ThreadA\
    \ 想等待 ThreadB 完成，它会调用 ThreadB 的 `join()` 方法，即 ThreadA 在 ThreadB 完成工作后才能开始工作。\n\
    \n## 62: 你有一个包含某些关键代码的方法，你希望防止多个线程同时执行它。你可以做什么来保护它？\n\n答案：\n\n该方法可以使用 `synchronized`\
    \ 关键字标记为同步方法。\n\n## 63: 睡眠的线程会释放它所有的锁吗？\n\n答案：\n\n不。睡眠线程的锁对其他线程仍然可用。\n\n## 64:\
    \ 如何同步一个代码块（即不是整个方法）？\n\n答案：\n\n为了同步一段代码，我们必须指定一个参数，即要进行同步锁的对象。\n\n## 65: `wait`\
    \ 方法的作用是什么？\n\n答案：\n\n`wait()` 方法将线程放入等待池。该线程在通过 `notify()` 方法通知之前一直保持等待。\n\n\
    ## 66: `notify()` 方法可以指定通知哪一个等待线程吗？\n\n答案：\n\n不可以。`notify()` 方法只向一个线程发送信号。\n\n"
