    \ 快？\n\n答案：当在列表开头或中间频繁插入和删除操作时，`LinkedList` 更快。\n\n# 128: 你如何向列表添加元素？\n\n答案：你可以使用\
    \ `add()` 方法向列表添加元素。\n\n# 129: Hashtable 的容量（capacity）是多少？\n\n答案：容量是指 `Hashtable`\
    \ 在调整大小之前可以容纳的元素数量。\n\n# 130: Hashtable 的默认负载因子（load factor）是多少？\n\n答案：`Hashtable`\
    \ 的默认负载因子是 .75。\n\n# 131: 如果使用 Hashtable() 创建，初始容量是多少？\n\n答案：默认情况下，`Hashtable`\
    \ 的初始容量为 11。\n\n# 132: Hashtable 和 HashMap 有什么区别？\n\n答案：`Hashtable` 和 `HashMap`\
    \ 的主要区别是：\n- `Hashtable` 是同步的，而 `HashMap` 不同步\n- `Hashtable` 不允许 null，而 `HashMap`\
    \ 允许 null\n\n# 133: 如果 key 不在 HashMap 中存在会发生什么？\n\n答案：如果 map 不包含该 key 的映射，则返回\
    \ `null`。以下方法用于确保 key 于 map 中：\nboolean containsKey(Object key)\n\n# 134: 你如何获取此\
    \ map 中映射的集合视图（collection view）？\n\n答案：调用 `entrySet()` 返回一个 `Set`。集合中的每个元素都是一个\
    \ `Map.Entry`。集合中的所有更改都会反映在 `HashMap` 中，反之亦然。\n\n# 135: Map 是一个 Collection 吗？\n\
    \n答案：不是。`Map` 接口没有扩展 `Collection` 接口，它不是 `Collection`。\n\n# 136: 如果尝试在 Map 中添加重复的\
    \ key 会发生什么？\n\n答案：对应的值将被覆盖，旧值将丢失。\n\n# 137: 如果需要在 Map 中插入、删除和定位元素，你会使用哪种 Map\
    \ 实现？\n\n答案：`HashMap` 为在 Map 中插入、删除和定位元素提供了最佳替代方案。\n\n# 138: 在什么情况下你会优选 TreeMap\
    \ 而不是 HashMap？\n\n答案：如果需要按排序顺序遍历键，那么 `TreeMap` 是更好的替代方案。\n\n# 139: 如何调优 HashMap\
    \ 和 TreeMap？\n\n答案：对于 `HashMap`，你需要使用适当初始容量和负载因子来创建 HashMap 以获得更好的性能。`TreeMap`\
    \ 没有调优选项。\n\n# 140: 你想使用 Collection 类创建一个单元素集合。你如何用一行代码实现？\n\n答案：\nSet set = Collections.singleton(\"\
    Test Msg\");\n\n"
