    a String argument constructor. Which constructor of the super class will get called
    during de-serialization?


    Answer:

    No-argument constructor will get called. It should be accessible to

    the Serializable subclass class.


    # 24: Consider the following scenario:

    You have a Serializable class without serialVersionUID defined.

    You serialize it. You add a new instance variable in your

    Serializable class and de-serialize its already serialized instance.

    What will happen?


    Answer:

    Since serialVersionUID was not defined in the Serializable class,

    JVM will generate that. Once you add or remove instance

    variables in the Serializable class, the value of serialVersionUID

    will change. In the given scenario, java.io.InvalidClassException

    will be thrown.'
