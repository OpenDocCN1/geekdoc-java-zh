- md: "\n## 232: Can we overload static method in java?\n\nAnswer:\n\n- a) Yes. Static\
    \ method can be overloaded but cannot be overridden\n- b) If static method is\
    \ overridden, it won't give any compilation error. However value will not change.\
    \ For instance if you are changing the value of a variable while overriding static\
    \ method, value will not change. Variable's value of Super class will remain the\
    \ same\n\n## 233: Describe the method that provides the interface for database\
    \ in Java.\n\nAnswer:\n\nJDBC(Java Database Connectivity) provides database connection\
    \ by defining classes and interface. Used for communication between the java application\
    \ and database. PL/SQL and SQL can be executed by JDBC and provide access for\
    \ RDBMS by embedding the/SQL queries in java code.\n\n## 234: Describe how database\
    \ connection is achieved using JDBC.\n\nAnswer:\n\n![](img/ef4083452e95fd67e347ab43f958792b_70_0.png)\n\
    \n## 235: Describe the way to load jdbc driver.\n\nAnswer:\n\nJdbc driver is loaded\
    \ by jdbc library. This will be done by calling the function “Class.forName” with\
    \ driver class name as argument. An instance of the driver class will be created\
    \ once the driver is loaded.\n\nExample:\n\n```java\ntry{\n    Class.forName(\"\
    // Driver name\");\n}\n```\n\n## 236: How will you establish a JDBC connection?\n\
    \nAnswer:\n\nWe can establish a JDBC connection using ‘getConnection’ function\
    \ in the driverclass. It takes three arguments(jdbcurl, user_name, password) to\
    \ connect the database and returns the connection object. The connection object\
    \ contains information about database, table and fields.\n\nExample:\n\n```java\n\
    Connection my_dbconn=DriverManager.getConnection(my_url,\"user_name1\", \"my_pwd\"\
    );\n```\n\n## 237: How will you execute the ‘SQL’ queries?\n\nAnswer:\n\nUsing\
    \ ‘createStatement’ function we can execute SQL queries. Once the connection is\
    \ established to the database using ‘connection_object’, the ‘statement’ object\
    \ is instantiated from the connection object using ‘createStatement’ function.\n\
    \nExample:\n\n```java\nConnection my_conn=DriverManager.getConnection(my_url,\"\
    shobi\", \"shobi\");\nStatement my_stmtobj = my_conn.createStatement();\n```\n\
    \n## 238: What are the types of statements available in the statement object?\n\
    \nAnswer:\n\n- a) **Statement**: Simple sql queries that are executed without\
    \ parameters\n- b) **Callable**: Executes a call to the function that is stored\
    \ in the database\n- c) **Prepared**: Precompiled sql queries are executed with/without\
    \ parameters\n\n## 239: How will you execute the precompiled queries?\n\nAnswer:\n\
    \n- a) Using ‘prepared statement’ in the statement object\n- b) Precompiled queries\
    \ can be executed with/without parameter using this statement\n- c) Syntax:\n\
    \  `PreparedStatement my_preprdstmt1(String my_sql1);`\n- d) Returns the object\
    \ of the prepared statement and that are the precompiled sql queries\n\n## 240:\
    \ How will you call a function in the database?\n\nAnswer:\n\n- a) Using the ‘callable\
    \ statement’ in the statement object\n- b) Returns the object for the ‘callablesatement’\
    \ and it is the SQL statement calling the procedure in database\n- c) Syntax:\n\
    \  `CallableStatement my_calblstmt1(String my_sql2)`\n\n## 241: What are the methods\
    \ provided by the statement interface to interact with database?\n\nAnswer:\n\n\
    - a) **execute**: for sql queries in String object\n- b) **executeQuery**: for\
    \ ‘select’ statement\n- c) **executeUpdate**: for creation or modification of\
    \ tables\n\n## 242: What is the purpose of ResultSet?\n\nAnswer:\n\nWhen the Statements\
    \ are executed, the contents of the table are accessed using ResultSet. It retrieves\
    \ the data in sequential order and points to the data of the current row.\n\n\
    ## 243: What is ResultSetMetaData?\n\nAnswer:\n\n- a) An interface made from the\
    \ connection object\n- b) Contains the details(properties, types, etc) of the\
    \ column in resultset\n\n## 244: Can you declare arraylist as below where generic\
    \ datatype will differ left and right side?\n\nAnswer:\n\n`List<Employee1> myFruitList1\
    \ = new ArrayList<String>();`\nNo. Compile error will occur. Both should be of\
    \ same type.\n\n## 245: How would you know httpsession is removed (when time out)?\n\
    \nAnswer:\n\nThe class which needs to be stored in session objects should implement\
    \ HttpSessionBindingListener interface (javax.servlet.http package) and override\
    \ valueUnbound() and valueBound() methods. If the session is timed out or removed,\
    \ the servlet container will invoke the valueUnbound() method on the class object.\
    \ If this class is stored into session for the next user valueBound() method will\
    \ be invoked.\nHttpSessionBindingListener interfaced is used to track the session\
    \ events on the particular object.\n\n```java\npublic void valueBound(HttpSessionBindingEventboundEvent)\
    \ {}\npublic void valueUnbound(HttpSessionBindingEventunboundEvent) {}\n```\n\n\
    ## 246: How would you set and delete a cookie from the Servlet?\n\nAnswer:\n\n\
    Create a cookie and add it in response object. To delete it, set the cookie age\
    \ as zero using setMaxAge() method and add it in response object.\n\n- a) To add\
    \ a cookie:\n  `Cookie cookie = new Cookie(\"username\", \"abc\");`\n  `response.addCookie(cookie);`\n\
    - b) To delete a cookie:\n  `cookie.setMaxAge(0);`\n  `response.addCookie(cookie);`\n\
    \n## 247: How would you delete a cookie from the Servlet?\n\nAnswer:\n\nTo delete\
    \ a cookie, set the cookie age as zero using setMaxAge() method and add it in\
    \ response object.\n\n## 248: What is Meta refresh?\n\nAnswer:\n\n`<META HTTP-EQUIV=\"\
    refresh\" content=\"seconds;url=URL\">` is used to refresh the page or redirect\
    \ to another page after a specified number of seconds.\n\n## 249: What is Meta\
    \ refresh?\n\nAnswer:\n\nMeta refresh is an HTML tag used to refresh the current\
    \ page or redirect to a different URL after a certain amount of time.\n\n## 250:\
    \ How would you achieve Meta refresh?\n\nAnswer:\n\nUsing `<META HTTP-EQUIV=\"\
    refresh\" content=\"5\">` in the HTML head to refresh the page every 5 seconds.\n"
  mdcn: "\n\n## 232: 我们在 Java 中可以重载静态方法吗？\n\n答案：\n\n- a) 可以。静态方法可以重载，但不能被重写\n- b)\
    \ 如果重写了静态方法，不会产生任何编译错误。然而值不会改变。例如，如果你在重写静态方法时更改变量的值，值不会改变。父类的变量值将保持不变。\n\n## 233:\
    \ 描述 Java 中提供数据库接口的方法。\n\n答案：\n\nJDBC（Java Database Connectivity）通过定义类和接口来提供数据库连接。用于\
    \ Java 应用程序与数据库之间的通信。JDBC 可以执行 PL/SQL 和 SQL，并通过在 Java 代码中嵌入 SQL 查询来访问关系型数据库管理系统（RDBMS）。\n\
    \n## 234: 描述如何使用 JDBC 实现数据库连接。\n\n答案：\n\n![](img/ef4083452e95fd67e347ab43f958792b_70_0.png)\n\
    \n## 235: 描述加载 JDBC 驱动的方法。\n\n答案：\n\nJDBC 驱动程序由 JDBC 库加载。这是通过调用函数 `Class.forName`\
    \ 并将驱动类名作为参数来实现的。一旦驱动程序加载，就会创建一个驱动类的实例。\n\n示例：\n\n```java\ntry{\n    Class.forName(\"\
    // Driver name\");\n}\n```\n\n## 236: 你如何建立 JDBC 连接？\n\n答案：\n\n我们可以使用驱动类中的 `getConnection`\
    \ 函数来建立 JDBC 连接。它接受三个参数（jdbcurl, user_name, password）来连接数据库并返回连接对象。连接对象包含有关数据库、表和字段的信息。\n\
    \n示例：\n\n```java\nConnection my_dbconn=DriverManager.getConnection(my_url,\"user_name1\"\
    , \"my_pwd\");\n```\n\n## 237: 你如何执行‘SQL’ 查询？\n\n答案：\n\n使用 `createStatement` 函数可以执行\
    \ SQL 查询。一旦使用 `connection_object` 建立了数据库连接，就可以使用 `createStatement` 函数从连接对象实例化\
    \ `statement` 对象。\n\n示例：\n\n```java\nConnection my_conn=DriverManager.getConnection(my_url,\"\
    shobi\", \"shobi\");\nStatement my_stmtobj = my_conn.createStatement();\n```\n\
    \n## 238: statement 对象中可用哪些类型的 statement？\n\n答案：\n\n- a) **Statement**: 执行不带参数的简单\
    \ SQL 查询\n- b) **Callable**: 执行存储在数据库中的函数调用\n- c) **Prepared**: 执行带参数或不带参数的预编译\
    \ SQL 查询\n\n## 239: 你如何执行预编译的查询？\n\n答案：\n\n- a) 使用 statement 对象中的 `prepared statement`\n\
    - b) 使用此 statement 可以带参数或不带参数执行预编译查询\n- c) 语法：\n  `PreparedStatement my_preprdstmt1(String\
    \ my_sql1);`\n- d) 返回预编译语句的对象，这些就是预编译的 SQL 查询\n\n## 240: 你如何调用数据库中的函数？\n\n答案：\n\
    \n- a) 使用 statement 对象中的 `callable statement`\n- b) 返回 `callablesatement` 对象，它是调用数据库中过程的\
    \ SQL 语句\n- c) 语法：\n  `CallableStatement my_calblstmt1(String my_sql2)`\n\n##\
    \ 241: statement 接口提供了哪些与数据库交互的方法？\n\n答案：\n\n- a) **execute**: 用于 String 对象中的\
    \ SQL 查询\n- b) **executeQuery**: 用于 ‘select’ 语句\n- c) **executeUpdate**: 用于创建或修改表\n\
    \n## 242: ResultSet 的作用是什么？\n\n答案：\n\n当执行 Statements 时，使用 `ResultSet` 访问表的内容。它按顺序检索数据并指向当前行的数据。\n\
    \n## 243: 什么是 ResultSetMetaData？\n\n答案：\n\n- a) 从连接对象创建的接口\n- b) 包含结果集中列的详细信息（属性、类型等）\n\
    \n## 244: 你可以像下面这样声明 arraylist 但泛型数据类型左右不一致吗？\n\n答案：\n\n`List<Employee1> myFruitList1\
    \ = new ArrayList<String>();`\n不可以。会发生编译错误。\n\n## 245: 你如何知道 httpsession 被移除（超时时）？\n\
    \n答案：\n\n需要存储在 session 对象中的类应该实现 `HttpSessionBindingListener` 接口（javax.servlet.http\
    \ 包），并重写 `valueUnbound()` 和 `valueBound()` 方法。如果会 超时或移除，Servlet 容器将调用类对象上的 `valueUnbound()`\
    \ 方法。如果此类存储在 session 中供下一个用户使用，则将调用 `valueBound()` 方法。\n`HttpSessionBindingListener`\
    \ 接口用于跟踪特定对象上的会 事件。\n\n```java\npublic void valueBound(HttpSessionBindingEventboundEvent)\
    \ {}\npublic void valueUnbound(HttpSessionBindingEventunboundEvent) {}\n```\n\n\
    ## 246: 你如何从 Servlet 中设置和删除 cookie？\n\n答案：\n\n创建一个 cookie 并将其添加到响应对象中。要删除它，使用\
    \ `setMaxAge()` 方法将 cookie 时代设置为零并将其添加到响应对象中。\n\n- a) 添加 cookie：\n  `Cookie cookie\
    \ = new Cookie(\"username\", \"abc\");`\n  `response.addCookie(cookie);`\n- b)\
    \ 删除 cookie：\n  `cookie.setMaxAge(0);`\n  `response.addCookie(cookie);`\n\n##\
    \ 247: 你如何从 Servlet 中删除 cookie？\n\n答案：\n\n要删除 cookie，使用 `setMaxAge()` 方法将 cookie\
    \ 时代设置为零并添加到响应对象中。\n\n## 248: 什么是 Meta refresh？\n\n答案：\n\n`<META HTTP-EQUIV=\"\
    refresh\" content=\"seconds;url=URL\">` 用于在指定的秒数后刷新页面或跳转到另一个页面。\n\n## 249: 什么是\
    \ Meta refresh？\n\n答案：\n\nMeta refresh 是一个 HTML 标签，用于在一定时间后刷新当前页面或跳转到不同的 URL。\n\
    \n## 250: 你如何实现 Meta refresh？\n\n答案：\n\n在 HTML head 中使用 `<META HTTP-EQUIV=\"refresh\"\
    \ content=\"5\">` 每隔 5 秒刷新一次页面。\n\n"
