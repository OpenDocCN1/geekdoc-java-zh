    setting?


    Answer:


    While these three adjectives probably already appear somewhere on your resume,
    do not be afraid to use them again in order to highlight your best qualities.
    This is a chance for you to sell yourself to the interviewer, and to point out
    traits you possess that other candidates do not. Use the most specific and accurate
    words you can think of, and elaborate shortly on how you embody each.


    ## 20: What are the three best adjectives to describe you in your personal life?


    Answer:


    Ideally, the three adjectives that describe you in your personal life should be
    similar to the adjectives that describe you in your professional life. Employers
    appreciate consistency, and while they may be understanding of you having an alternate
    personality outside of the office, it is best if you employ similar principles
    in your actions both on and off the clock.


    ## 21: What type of worker are you?


    Answer:


    This is an opportunity for you to highlight some of your greatest assets. Characterize
    some of your talents such as dedicated, self-motivated, detail-oriented, passionate,
    hard-working, analytical, or customer service focused. Stay away from your weaker
    qualities here, and remain on the target of all the wonderful things you can bring
    to the company.


    ## 22: Tell me about your happiest day at work.


    Answer:


    Your happiest day at work should include one of your greatest professional successes,
    and how it made you feel. Stay focused on what you accomplished, and be sure to
    elaborate on how rewarding or satisfying the achievement was for you.


    ## 23: Tell me about your worst day at work.


    Answer:


    It may have been the worst day ever because of all the the mistakes you made,
    or because you''d just had a huge argument with your best friend, but make sure
    to keep this answer professionally focused. Try to use an example in which something
    uncontrollable happened in the workplace (such as an important member of a team
    quit unexpectedly, which ruined your team''s meeting with a client), and focus
    on the frustration of not being in control of the situation. Keep this answer
    brief, and be sure to end with a reflection on what you learned from the day.


    ## 24: What are you passionate about?


    Answer:


    Keep this answer professionally-focused where possible, but it may also be appropriate
    to discuss personal issues you are passionate about as well (such as the environment
    or volunteering at a soup kitchen). Stick to issues that are non-controversial,
    and allow your passion to shine through as you explain what inspires you about
    the topic and how you stay actively engaged in it. Additionally, if you choose
    a personal passion, make sure it is one that does not detract from your availability
    to work or to be productive.


    ## 25: What is the piece of criticism you receive most often?


    Answer:


    An honest, candid answer to this question can greatly impress an interviewer (when,
    of course, it is coupled with an explanation of what you''re doing to improve),
    but make sure the criticism is something minimal or unrelated to your career.


    ## 26: What type of work environment do you succeed the most in?


    Answer:


    Be sure to research the company and the specific position before heading into
    the interview. Tailor your response to fit the job you''d be working in, and explain
    why you enjoy that type of environment over others. However, it''s also extremely
    important to be adaptable, remain flexible to other environments as well.


    ## 27: Are you an emotional person?


    Answer:


    It is best to focus on your positive emotions – passion, happiness, motivations
    – and to stay away from other extreme emotions that may cause you to appear unbalanced.
    While you want to display your excitement for the job, be sure to remain level-headed
    and cool at all times, so that the interviewer knows you are not the type of person
    who lets emotions take you over and get in the way of your work.


    ## 28: How do you make decisions?


    Answer:


    This is a great opportunity for you to wow your interviewer with your decisiveness,
    confidence, and organizational skills. Make sure that you outline a process for
    decision-making, and that you stress the importance of weighing your options,
    as well as in trusting the intuition. If you answer this question skillfully with
    ease, your interviewer will trust in your capability as a worker.


    ## 29: What are the most difficult decisions for you to make?


    Answer:


    Explain your relationship to decision-making, and a general synopsis of the process
    you take in making choices. If there is a particular type of decision that you
    often struggle with, such as those that involve other people, make sure to explain
    why that type of decision is tough for you, and how you are currently engaged
    in improving your skills.


    ## 30: When making a tough decision, how do you gather information?


    Answer:


    If you are making a tough choice, it is best to gather information from as many
    sources as possible. Lead the interviewer through your process of taking information
    from people in different areas, starting first with advice from experts in your
    field, feedback from coworkers or other clients, and by looking analytically at
    your own past experiences.


    ## 31: Tell me about a decision you made that did not turn out well.


    Answer:


    Honesty and transparency are great values that your interviewer appreciate – outline
    the choice you made, why you made it, the results of your poor decision – and
    finally (and most importantly!) what you learned from the decision. Give the interviewer
    reason to trust that you would not make a decision like that in the future.


    ## 32: Are you able to make decisions quickly?


    Answer:


    You may be able to make decisions quickly, but be sure to communicate your skill
    in making sound, thorough decisions as well. Discuss the importance of making
    a decision quickly, and how you you do so, as well as the necessity for each decision
    to first be well-informed.


    ## 33: What is customer service?


    Answer:


    Customer service can be many things – and the most important consideration in
    this question is that you have a creative answer. Demonstrate your ability to
    think outside the box by offering a confident answer that goes past a basic definition,
    and that shows you have truly considered your own individual view of what it means
    to take care of your customers. The thoughtful consideration you hold for customers
    will speak for itself.


    ## 34: Tell me about a time when you went out of your way for a customer.


    Answer:


    It is important that you offer an example of a time you truly went out of your
    way – be careful not to confuse something that felt like a big effort on your
    part, with something your employer would expect you to do anyway. Offer an example
    of the customer''s problems, what you did to solve it, and the way the customer
    responded after you took care of the situation.


    ## 35: How do you gain confidence from customers?


    Answer:


    This is a very open-ended question that allows you to show your customer service
    skills to the interviewer. There are many possible answers, and it is best to
    choose something that you have had great experience with, such as “by handling
    situations with transparency,” or “offering rewards,” or “focusing on great communication.”
    Offer specific examples of successes you have had.


    ## 36: Tell me about a time when a customer was upset or agitated – how did you
    handle the situation?


    Answer:


    Similarly to handling a dispute with another employee, the most important part
    to answering this question is to set up the scenario, offer a step-by-step guide
    to your particular conflict resolution style, and end by describing the way the
    conflict was resolved. Be sure that in answering questions about your own conflict
    resolution style, that you emphasize the importance of open communication and
    understanding from both parties, as well as a willingness to reach a compromise
    or other solution.


    ## 37: When can you make an exception for a customer?


    Answer:


    Exceptions for customers can generally be made in accordance with company policy
    or when directed by a supervisor. Display an understanding of the types of situations
    in which an exception should be considered, such as when a customer has endured
    a particular hardship, had a complication with an order, or at a request.

