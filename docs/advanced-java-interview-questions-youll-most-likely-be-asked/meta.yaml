  md: '# # Object Serialization'
  merge: -1
  pgno: 8
- img_proc: true
  md: '# 1: How can the Java objects exist beyond the lifetime of the virtual machine?


    Answer:


    Object serialization allows Java objects to live beyond the lifetime of JVM.


    # 2: I wish to serialize a collection. Is it a must to have all its members Serializable?


    Answer:


    Yes. All members of a collection or an array must be Serializable in order to
    Serialize it.


    # 3: How to exclude certain variables from object’s serialized state?


    Answer:


    To exclude variables from the process of serialization, they should be marked
    as transient.


    Example: Transient private String variable;


    # 4: Is it true to saying that object serialization class and instance variables
    that are not marked as transient are also serialized?


    Answer:


    No. Static variables belonging to the class are not saved as the part of serialized
    object. Also the transient class variables will not be part of serialized object.


    # 5: What will happen if I try to serialize an object of a class that implements
    Serializable interface, but also includes a non-Serializable object?


    Answer:


    java.io.NotSerializableException will be thrown at runtime.


    # 6: Once de de-serialization is done, what values will transient variables get?


    Answer:'
  merge: -1
  pgno: 9
- img_proc: true
  md: 'Advanced Java Interview Questions You''ll Most Likely Be Asked


    Transient variables get default values after de-serialization.


    # 7: You are making a class Serializable by implementing Serializable interface.
    Which methods are to be implemented?

    None.


    # 8: Consider the following scenario:

    public class ClassA extends ClassB implements Serializable{

    ClassA extends from ClassB.

    ClassA implements Serializable.

    ClassA instance is serialized.

    ClassA instance is de-serialized.

    What values will the variables of ClassB get?

    Answer:


    ClassB''s constructor will run and the variables will get the values assigned
    during the construction of the object.


    # 9: What is the purpose of using serialVersionUID?

    Answer:

    serialVersionUID provides versioning system for every Serializable class. During
    de-serialization process, serialVersionUID means of checking whether data read
    from the input stream is compatible with the current class definition.


    # 10: serialVersionUID is a static field declared in a Serializable class. Is
    it also serialized?

    Answer:

    serialVersionUID is a static field that is also serialized along with the other
    data. During de-serialization, the de-serialized serialVersionUID has to match
    to the serialVersionUID declared in the class definition.


    # 11: What happens if serialVersionUID of de-serialized object does not match
    to the one declared in the class definition?'
  merge: -1
  pgno: 10
- img_proc: true
  md: 'Answer:

    java.io.InvalidClassException is thrown.


