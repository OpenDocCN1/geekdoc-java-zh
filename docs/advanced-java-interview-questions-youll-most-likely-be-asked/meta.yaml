    \n## Table of Contents\n\n| Topic | Page |\n| :--- | :--- |\n| 1 Object Serialization\
    \ | 7 |\n| 2 Generics | 13 |\n| 3 CORBA | 17 |\n| 4 Threading | 21 |\n| 5 Servlet\
    \ | 27 |\n| 6 Collections | 39 |\n| 7 Design Patterns | 51 |\n| 8 Data Structures\
    \ | 55 |\n| 9 HR Questions | 77 |\n| INDEX | 92 |\n\nThis page is intentionally\
    \ left blank\n\n## Advanced Java\nInterview Questions\n\nReview these typical\
    \ interview questions and think about how you would answer them. Read the answers\
    \ listed; you will find best possible answers along with strategies and suggestions.\n\
    \nThis page is intentionally left blank\n\n## Object Serialization\n\n# 1: How\
    \ can the Java objects exist beyond the lifetime of the virtual machine?\n\nAnswer:\n\
    \nObject serialization allows Java objects to live beyond the lifetime of JVM.\n\
    \n# 2: I wish to serialize a collection. Is it a must to have all its members\
    \ Serializable?\n\nAnswer:\n\nYes. All members of a collection or an array must\
    \ be Serializable in order to Serialize it.\n\n# 3: How to exclude certain variables\
    \ from object’s serialized state?\n\nAnswer:\n\nTo exclude variables from the\
    \ process of serialization, they should be marked as transient.\n\nExample: `trans\
    \ private String variable;`\n\n# 4: Is it true to saying that object serialization\
    \ class and instance variables that are not marked as transient are also serialized?\n\
    \nAnswer:\n\nNo. Static variables belonging to the class are not saved as the\
    \ part of serialized object. Also the transient class variables will not be part\
    \ of serialized object.\n\n# 5: What will happen if I try to serialize an object\
    \ of a class that implements Serializable interface, but also includes a non-Serializable\
    \ object?\n\nAnswer:\n\n`java.io.NotSerializableException` will be thrown at runtime.\n\
    \n# 6: Once de-serialization is done, what values will transient variables get?\n\
    \nAdvanced Java Interview Questions You'll Most Likely Be Asked\n\nTransient variables\
    \ get default values after de-serialization.\n\n# 7: You are making a class Serializable\
    \ by implementing Serializable interface. Which methods are to be implemented?\n\
    \nNone.\n\n# 8: Consider the following scenario:\n```java\npublic class ClassA\
    \ extends ClassB implements Serializable{\n    ClassA extends from ClassB.\n \
    \   ClassA implements Serializable.\n    ClassA instance is serialized.\n    ClassA\
    \ instance is de-serialized.\n}\n```\nWhat values will the variables of ClassB\
    \ get?\n\nAnswer:\n\nClassB's constructor will run and the variables will get\
    \ the values assigned during the construction of the object.\n\n# 9: What is the\
    \ purpose of using serialVersionUID?\n\nAnswer:\n\nserialVersionUID provides versioning\
    \ system for every Serializable class. During de-serialization process, serialVersionUID\
    \ means of checking whether data read from the input stream is compatible with\
    \ the current class definition.\n\n# 10: serialVersionUID is a static field declared\
    \ in a Serializable class. Is it also serialized?\n\nAnswer:\n\nserialVersionUID\
    \ is a static field that is also serialized along with the other data. During\
    \ de-serialization, the de-serialized serialVersionUID has to match to the serialVersionUID\
    \ declared in the class definition.\n\n# 11: What happens if serialVersionUID\
    \ of de-serialized object does not match to the one declared in the class definition?\n\
    \nAnswer:\n\n`java.io.InvalidClassException` is thrown.\n\n# 12: Consider that\
    \ you have a Serializable class without serialVersionUID. How compiler will handle\
    \ this?\n\nAnswer:\n\nJava compiler adds serialVersionUID automatically and its\
    \ value is based on the fields declared in the class.\n\n# 13: What methods are\
    \ there in Serializable interface?\n\nAnswer:\n\nSerializable interface is a marker\
    \ interface and has no methods. It simply tells the object serialization tools\
    \ that the class is Serializable\n\n# 14: In which scenarios serialization should\
    \ be used?\n\nAnswer:\n\nObjects are serialized when sending over the network.\n\
    \n# 15: What can be the cause of NotSerializableException during object serialization?\n\
    \nAnswer:\n\nIf a class is to be serialized, it has to implement Serializable\
    \ interface. It is also important that all the objects included in that class\
    \ are also Serializable. NotSerializableException is thrown if any of the included\
    \ objects is not Serializable.\n\n# 16: Which methods can be overridden to change\
    \ default serialization behavior in order to control complex object serialization\
    \ process?\n\nAnswer:\n\n`writeObject()` and `readObject()` can be implemented\
    \ to control complex object serialization process. By doing so, we can provide\
    \ additional information to serialize and de-serialize objects.\n\n# 17: Which\
    \ interface is to be implemented if we want to have complete control over your\
    \ class's serialization process?\n\nAdvanced Java Interview Questions You'll Most\
    \ Likely Be Asked\n\nAnswer: `java.io.Externalizable` interface is to be implemented.\n\
    \n# 18: Name the methods that are to be overridden when Externalizable is implemented.\n\
    \nAnswer:\n\n`readExternal` and `writeExternal` are to be overridden when Externalizable\
    \ is implemented.\n\n# 19: Consider the following scenario:\n```java\npublic class\
    \ Parent implements Serializable\npublic class Child extends Parent\n```\nIs Child\
    \ class Serializable?\n\nAnswer:\n\nChild class inherits serialization from its\
    \ object hierarchy and it is Serializable.\n\n# 20: Is it correct to say that\
    \ when an object is de-serialized, its constructor is called?\n\nAnswer:\n\nDe-serialization\
    \ means restoring the serialized object and not reconstructing it. The constructor\
    \ is not called in the de-serialization process.\n\n# 21: I have a class called\
    \ Student that is Serializable. It has an instance variable of type String 'name'.\
    \ Since 'name' is not of primitive type, should we expect serialization failure?\n\
    ```java\npublic class Student implements Serializable{\n    private String name;\n\
    }\n```\n\nAnswer: `java.lang.String` itself is Serializable, therefore Student\
    \ class can be serialized.\n\n# 22: Are all primitive wrapper classes Serializable?\n\
    \nAnswer:\n\nYes. All primitive wrapper classes implement Serializable interface.\n\
    \n# 23: Assume you have a Serializable class where its super class does not implement\
    \ Serializable interface. The super class defines a no-argument constructor and\
    \ a String argument constructor. Which constructor of the super class will get\
    \ called during de-serialization?\n\nAnswer:\n\nNo-argument constructor will get\
    \ called. It should be accessible to the Serializable subclass class.\n\n# 24:\
    \ Consider the following scenario:\nYou have a Serializable class without serialVersionUID\
    \ defined. You serialize it. You add a new instance variable in your Serializable\
    \ class and de-serialize its already serialized instance. What will happen?\n\n\
    Answer:\n\nSince serialVersionUID was not defined in the Serializable class, JVM\
    \ will generate that. Once you add or remove instance variables in the Serializable\
    \ class, the value of serialVersionUID will change. In the given scenario, `java.io.InvalidClassException`\
    \ will be thrown.\n"
