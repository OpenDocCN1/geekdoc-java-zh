    Answer:

    You need to use sleep() method in order to prevent thread starvation.


    # ### 58: You invoked sleep() method on your thread to delay its exception for
    some time. Will it start running as soon as the sleep period is over?


    Answer:

    There is no such guarantee. The thread will sleep for at least the time specified
    in the argument to the sleep() method (interruption is an exception to that) but
    there is no guarantee that it will come to running state as soon as it gets awakened.


    # ### 59: What is thread priority and how can you define it?


    Answer:

