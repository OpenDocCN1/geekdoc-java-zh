    # 94: How do you get the current Servlet path i.e. its location on

    file system?


    Answer:

    Servlet''s file system location can be found using the following:

    request.getRealPath(request.getServletPath());


    # 95: When does init() method gets called?


    Answer:'
  - '[PAGE 33]


    init() method is called when the Servlet is loaded. It is called once\per Servlet
    instance.


    # 96: How to make init() method thread safe?


    Answer:

    Since init() is called once per Servlet instance, we do not need to

    worry about thread safety.


    # 97: How can you call a Servlet from another Servlet?


    Answer:

    There are various ways of doing so. For instance: you can use a

    RequestDispatcher, send a redirect, etc.


    # 98: Give an example to show how RequestDispatcher can be

    used to forward a request from one Servlet to another.


    ```

    Answer:

    RequestDispatcher rd =

    request.getRequestDispatcher("http://test.com/ServletB");

    String myAttribute = "Test Attribute";

    request.setAttribute("att1", myAttribute);

    rd.forward(request, response);

    ```


    # 99: What is the difference between request.getParameter() and

    request.getAttribute() where request is an instance of

    javax.servlet.http.HttpServletRequest?


    Answer:

    request.getParameter() is used to get the value posted by a form.

    request.getAttribute() is used only on the server side. You can add

    an attribute to the request and forward that request to another


    # 100: How can you access client''s directory structure from a

    Servlet?


    Answer:'
  - '[PAGE 34]


    This is not possible due to security reasons.


    # 101: What are Generic Servlets?


    Answer:

    Generic Servlets are protocol independent Servlets.


    # 102: What is the difference between Generic and HttpServlet?


    Answer:

    HttpServlet is type of Generic Servlet. It provides Http specific functionality
    as Generic Servlet is protocol independent.


    # 103: Is HttpServlet a concrete class?


    Answer:

    No. It is an Abstract class that extends GenericServlet.


    # 104: Since HttpServlet is an Abstract class, which methods it must override?


    Answer:

    HttpServlet must override at least one of the following method: doGet(), doPost(),
    doDelete(), init(), destroy(), getServletInfo()


    # 105: Who controls the life cycle of a Servlet?


    Answer:

    Servlet container is responsible for controlling the life cycle of a Servlet.


    # 106: When a request is mapped to a Servlet, what does the container do?


    Answer:

    Assuming that the Servlet instance does not exist, the container loads the Servlet
    class, creates its instance, initializes the servlet by calling the init() method.
    Once that is done, service method is called and request and response objects are
    passed to it.'
