    ## HR Questions


    Review these typical interview questions and think about how you would answer
    them. Read the answers listed; you will find best possible answers along with
    strategies and suggestions.


    ## 1: What has been your biggest success?


    Answer:


    Your biggest success should be something that was especially meaningful to you,
    and that you can talk about passionately – your interviewer will be able to see
    this. Always have an answer prepared for this question, and be sure to explain
    how you achieved success, as well as what you learned from the experience.


    ## 2: What motivates you?


    Answer:


    It is best to focus on a key aspect of your work that you can target as a “driving
    force” behind your everyday work. Whether it is customer service, making a difference,
    or the chance to further your skills and gain experience, it is important that
    the interviewer can see the passion you hold for your career and the dedication
    you have to the position.


    ## 3: What do you do when you lose motivation?


    Answer:


    The best candidates will answer that they rarely lose motivation, because they
    already employ strategies to keep themselves inspired, and because they remain
    dedicated to their objectives. Additionally, you may impress the interviewer by
    explaining how you are motivated by achieving goals and advancing, so small successes
    are always a great way to regain momentum.


    ## 4: What do you like to do in your free time?


    Answer:


    What you answer answer is not nearly as important as what you do not answer –
    your interviewer does not want to hear that you like to drink, party, or revel
    in the nightlife. Instead, choose a few activities to focus on that are greater
    signs of stability and maturity, and that will not detract from your ability to
    show up to work and be productive, such as reading, cooking, or photography. This
    is also a great opportunity to show your interviewer that you are a well-rounded,
    interesting, and dynamic personality that they would be happy to hire.


    ## 5: What sets you apart from other workers?


    Answer:


    The question is a great opportunity to highlight the specific skill sets and passion
    you bring to the company that no one else can. If you cannot outline exactly what
    sets you apart from other workers, how will the interviewer see it? Be prepared
    with a thorough outline of what you will bring to the table, in order to help
    the company achieve its goals.


    ## 6: Why are you the best candidate for position?


    Answer:


    Have a brief response prepared in advance for this question, as this is another
    common theme in interviews (variations of the question include: “Why should I
    hire you, above Candidate B?” and “What can you bring to our company that Candidate
    B cannot?”). Make sure that your statement does not sound rehearsed, and highlight
    your most unique qualities that show the interviewer why he or she hire you above
    all the other candidates. Include specific details about your experience and special
    projects or recognition you have received that set you apart, and show your greatest
    passion, commitment, and enthusiasm for the position.


    ## 7: What does it take to be successful?


    Answer:


    Hard work, passion, motivation, and a dedication to learning – these are all potential
    answers to the ambiguous concept of success. It does not matter so much which
    of these values choose as the primary means to success, or if you choose a combination
    of them. It is, however, absolutely key that whichever value you choose, you must
    clearly display in your attitude, experience, and goals.


    ## 8: What would be the biggest challenge in this position for you?


    Answer:


    Keep this answer positive, and remain focused on the opportunities for growth
    and learning that the position can provide. Be sure that no matter what the challenge
    is, it is obvious that you''re ready and enthusiastic to tackle it, and that you
    have a full awareness of what it will take to get the job done.


    ## 9: Would you describe yourself as an introvert or an extrovert?


    Answer:


    There are beneficial qualities to each of these, and your answer may depend on
    what type of work you are involved in. However, a successful leader may be an
    introvert or extrovert, and similarly, solid team members may also be either.
    The important aspect of this question is to have the level of self-awareness required
    to accurately describe yourself.


    ## 10: What are some positive character traits that you don''t possess?


    Answer:


    If an interviewer asks you a tough question about your weaknesses, or lack of
    positive traits, it is best to keep your answer light-hearted and simple—for instance,
    express your great confidence in your own abilities, followed by a (rather humble)
    admittance that you could occasionally do to be more humble.


    ## 11: What is the greatest lesson you''ve ever learned?


    Answer:


    While this is a very broad question, the interviewer will be more interested in
    hearing what kind of emphasis you place on your value. Your greatest lesson may
    tie in with something a mentor, parent, or professor once told you, or you may
    have gleaned it from a book written by a leading expert in your field. Regardless
    of what the lesson is, it is most important that you can offer an example of how
    you have incorporated it.


    ## Advanced Interview Questions You''ll Likely Be Asked


    ## 12: Have you ever been in a situation where one of your strengths became a
    weakness?


    Answer:


    It is important to identify a weakness that can actually be a strength in an alternate
    setting. However, you want to make sure that it is relatively minor and has not
    negatively impacted your work.


    ## 13: Who has been the most influential person in your life?


    Answer:


    Give a specific example of a person who has influenced you greatly. It is great
    if your influence relates to your professional life, but this particular question
    opens up the possibility to discuss personal life as well.


    ## 14: Do you consider yourself to be a “detailed” or “big picture” type of person?


    Answer:


    Both of these are great qualities, and it is best if you can incorporate each
    into your answer. Choose one as your primary type and relate it to experience.
    Then, explain how the other type fits into your work as well.


    ## 15: What is your greatest fear?


    Answer:


    Disclosing your greatest fear openly and without embarrassment is a great way
    to show your confidence to an employer. Choose a fear that you are clearly working
    to combat, such as a fear of failure that would seem impossible for someone such
    as yourself, with clear goals and actions outlined.


    ## 16: What sort of challenges do you enjoy?


    Answer:


    The challenges you enjoy should demonstrate some sort of initiative or growth
    potential on your part, and should also be in line with your career objectives.
    Employers will evaluate consistency here, as they analyze critically how the challenges
    you look forward to are related to your goals.


    ## 17: Tell me about a time you were embarrassed. How did you handle it?


    Answer:


    No one wants to bring up times they were embarrassed in a job interview, and it
    is probably best to avoid an anecdote here. However, do not shy away from offering
    a brief synopsis, followed by a display of your ability to laugh it off. Show
    the interviewer that it was not an event that impacted you significantly.


    ## 18: What is your greatest weakness?


    Answer:


    This is another of the most popular questions asked in job interviews, so you
    should be prepared with an answer already. Try to come up with a weakness that
    can actually be a strength in an alternate setting – such as, “I am very detail-oriented
    and like to ensure that things are done correctly, so I sometimes have difficulty
    in delegating tasks to others.” However, do not try to mask obvious weaknesses
    – if you have little practical experience in the field, mention that you are looking
    forward to great opportunities to further your knowledge.


