    ## 38: What would you do in a situation where you were needed by both a customer
    and your boss?


    **Answer:**


    While both your customer and your boss have different needs of you and are very
    important to your success as a worker, it is always best to try to attend to your
    customer first – however, the key is explaining to your boss why you are needed
    urgently by the customer, and then to assure your boss that you will attend to
    his or her needs as soon as possible (unless it''s absolutely an urgent matter).


    ## 39: What is the most important aspect of customer service?


    **Answer:**


    While many people would simply state that customer satisfaction is the most important
    aspect of customer service, it is important to be able to elaborate on other important
    techniques in customer service situations. Explain why customer service is such
    a key part of business, and be sure to expand on the aspect that you deem to be
    the most important in a way that is reasoned and well-thought out.


    ## 40: Is it best to create low or high expectations for a customer?


    **Answer:**


    You may answer this question either way (after, of course, determining that the
    company does not have a clear opinion on the matter). However, no matter which
    you answer the question, you must display a thorough thought process, and very
    clear reasoning for the option you choose. Offer pros and cons of each, and include
    the ultimate point that tips the scale in favor of your chosen answer.


    ## 41: Why would your skills be a good match with X objective of our company?


    **Answer:**


    If you have researched the company before the interview, answering this question
    should be no problem. Determine several of the company''s main objectives, and
    explain how how specific skills that you have are conducive to them. Also, think
    about ways that your experience and skills can translate to helping the company
    expand upon these objectives, and to reach further goals. If your old company
    had a similar objective, give a specific example of how you helped the company
    to meet it.


    ## 42: What do you think this job entails?


    **Answer:**


    Make sure you have researched the position well before heading into the interview.
    Read any and all job descriptions you can find (at best, directly from the employer''s
    website or job posting), and make note of key duties, responsibilities, and experience
    required. Few things are less impressive to an interviewer than a candidate who
    has no idea what sort of job they are actually being interviewed for.


    ## 43: Is there anything else about the job or company you''d like to know?


    **Answer:**


    If you have learned about the company beforehand, this is a great opportunity
    to show that you have put in the effort to study before the interview. Ask questions
    about the company''s mission in relation to current industry trends, and engage
    the interviewer in interesting, relevant conversation. Additionally, clear up
    anything you need to know about the specific position before leaving – so that
    if the interviewer calls with an offer, you''ll be prepared to answer.


    ## 44: Are you the best candidate for this position?


    **Answer:**


    Yes! Offer specific details about what makes you qualified for this position,
    and be sure to discuss (and show) your unbridled passion and enthusiasm for the
    new opportunity, the job, and the company.


    ## 45: How did you prepare for this interview?


    **Answer:**


    The key part of this question is to make sure that you have prepared! Be sure
    that you have researched the company, their objectives, and their services prior
    to the interview, and know as much about the specific position as you possibly
    can. It is also helpful to learn about the company’s history and key players in
    the current organization.


    ## 46: If you were hired here, what would you do on your first day?


    **Answer:**


    While many people will answer this question in a boring fashion, going through
    the first day procedures, this question is actually a great chance for you to
    show the interviewer why you will make a great hire. In addition to things like
    going through training or orientation, emphasize how much you would enjoy meeting
    your supervisors and coworkers, or how would you spend a lot of the day asking
    questions and taking in all of your new surroundings.


    ## 47: Have you viewed our company''s website?


    **Answer:**


    Clearly, you should have viewed the company’s website and done some preliminary
    research on them before coming to the interview. If for some reason you did not,
    say that that you did, as the interviewer may reveal you by asking a specific
    question about it. If you looked up at the company’s website, this is an appropriate
    time to bring up something you saw there that was of particular interest to you,
    or a value that you especially supported.


    ## 48: How does X experience on your resume relate to this position?


    **Answer:**


    Many applicants will have some bit of experience on their resume that does not
    clearly translate to the specific job in question. However, be prepared to be
    asked about this type of seemingly-irrelevant experience, and have a response
    prepared that takes into account similar skill sets or training that the two may
    share.


    ## Advanced Java Interview Questions You''ll Most Likely Be Asked


    ## 49: Why do you want this position?


    **Answer:**


    Keep this answer focused positively on aspects of this specific job that will
    allow you to further your skills, offer offer new experience, or that will be
    an opportunity for you to do something that you particularly enjoy. Do not tell
    the interviewer that you have been looking for a job for a long time, or that
    the pay is very appealing, or you will appear unmotivated and opportunistic.


    ## 50: How is your background relevant to this position?


    **Answer:**


    Ideally, this should be obvious from your resume. However, in instances where
    your experience is more loosely-related to the position, make sure that you have
    researched the job well before the interview. That way, you can intelligently
    relate the skills that you have to the new position. Your background should be
    described as “preparation” and “learning,” an opportunity for “growth and development.”


    ## 51: How do you feel about X mission of your company?


    **Answer:**


    It is important to have researched the company prior to the interview – and if
    you have done so, this question will not catch you off guard. The best answer
    is one that is simple, to the point, and shows knowledge of the mission. Offer
    a few short statements as to why you believe in it, and note that you would be
    interested in the chance.


