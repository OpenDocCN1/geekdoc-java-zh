  md: '# Preface


    In this cheatsheet we are going to talk about design patterns in software development.
    We will focus on what they are, how they can benefit us, but more importantly
    where and when to use them.


    Structural patterns deal with object composition, creating relationships between
    objects to form larger structures.


    Behavioral patterns focus on communication between objects, what goes on between
    objects and how they operate together.


    Design patterns can speed up the development process by providing tested, proven
    design patterns. Effective software design requires considering issues that may
    become visible until later in the implementation. Reusing design patterns helps
    to prevent subtle issues that can cause major problems and improve readability
    for coders and architects familiar with the patterns.


    # 2. Creational patterns


    # 2.1. Singleton


    The Singleton design pattern is used to ensure that a class has only one instance,
    and to provide a global access point to that instance.


    | Singleton |

    | - static sc |

    | + static getInstance() |


    Figure 1. Singleton UML.


    +   - One advantage of the Singleton design pattern is that it ensures that there
    is only one instance of a class, which can be useful for classes that manage resources
    such as database connections or network sockets.

    - It also provides a global access point to the instance, which can make it easier
    to use the instance in different parts of the code.


    # 1. Introduction


    Design patterns are reusable solutions to common software design problems. They
    provide a way to describe and document software architectures, as well as a common
    vocabulary for developers to communicate about software design.


    There are several types of design patterns, including creational, structural,
    and behavioral patterns.


    Creational patterns deal with object creation mechanisms, trying to create objects
    in a manner suitable to the situation.


    # 2.2. Factory


    Provides a way to create objects without specifying the exact class of object
    that will be created. A method that creates objects of a specific type. The method
    takes the type of object to be created as an


    Often, people only understand how to apply certain design techniques to certain
    problems. These techniques are difficult to apply to a broader range of problems.
    Design patterns provide general solutions, documented in a format that doesn''t
    require specifics tied to a particular problem.'
