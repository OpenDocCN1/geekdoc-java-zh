    # 2.4. Builder


    Allows for the creation of complex objects in a step-by-step manner. It separates
    the construction of an object from its representation, allowing for different
    representations to be created.


    +   * One advantage of using the Factory design pattern is that it allows the
    creation of objects to be centralized in a single location, which can make the
    code more modular and easier to maintain.


    +   * It also allows the implementation of object creation to be changed easily,
    which can make the design more flexible and extensible.


    +   * Allows objects to be created without specifying their exact class, which
    can make the code more generic and reusable.


    ![](img/d6a5dc163996c263d43b0b54748187e0_2_0.png)


    Figure 4. Builder UML.


    +   * Object creation algorithms should be decoupled from the system.


    +   * Multiple representations of creation algorithms are required.


    +   * The addition of new functionality without changing the core class is necessary.


    # 2.3. Abstract Factory


    Provides an interface for creating families of related or dependent objects without
    specifying their concrete classes.


    | interface | Client |

    | --- | --- |

    | AbstractFactory | Product |

    | ConcreteFactoryA | ProductA |

    | ConcreteFactoryB | ProductB |


    Figure 3. class_diagram_1


    +   * A system should be independent of how its products are created, composed,
    and represented.


    +   * A system should be configured with one of the multiple families of products.


    +   * A family of related product objects is designed to be used together, and
    you need to enforce this constraint.


    # 2.5. Prototype


    Allows for the creation of new objects by copying existing objects, rather than
    creating new objects from scratch.


