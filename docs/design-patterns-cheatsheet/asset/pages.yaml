  md: '# 4.6. Strategy


    Allows an object to change its behavior or strategy at runtime by switching to
    a different strategy object.


    ![](img/d6a5dc163996c263d43b0b54748187e0_6_0.png)


    +   - It provides a central point of communication, known as the mediator, which
    acts as an intermediary between the objects.


    +   - Useful in cases where there are a large number of objects that need to communicate
    with each other, as it reduces the complexity of the system by separating the
    communication logic from the objects themselves.


    # 4.5. Observer


    ![](img/d6a5dc163996c263d43b0b54748187e0_6_1.png)


    Allows an object (the subject) to notify a set of objects (the observers) when
    its state changes. The observer pattern is also known as the publish-subscribe
    pattern.


    +   - The only difference between many related classes is their behavior.


    +   - Multiple versions or variations of an algorithm are required.


    +   - Algorithms access or utilize data that calling code shouldn''t be exposed
    to.


    +   - The behavior of a class should be defined at runtime.


    +   - Conditional statements are complex and hard to maintain.


    # 4.7. Template Method


    Defines the steps of an algorithm and allows subclasses to override certain steps,
    while still preserving the overall structure of the algorithm.


    ![](img/d6a5dc163996c263d43b0b54748187e0_6_2.png)


    +   - Useful when you want to ensure that various objects are kept in sync with
    each other, or when you want to be able to reuse subjects and observers independently
    of each other.'
