    # 3. Structural patterns


    # 3.1. Adapter


    Allows two incompatible interfaces to work together by wrapping an adapter class
    around one of the interfaces. This adapter class converts the interface of the
    adapted class into the interface that the client is expecting.


    +   - Abstractions and implementations should not be bound at compile time.


    +   - Abstractions and implementations should be independently extensible.


    +   - Changes in the implementation of abstraction should have no impact on clients.


    +   - Implementation details should be hidden from the client.


    # 3.3. Composite


    Allows objects to be treated as a single unit. It is used to compose objects into
    tree structures, and to create complex objects from simpler ones.


    ![](img/d6a5dc163996c263d43b0b54748187e0_3_1.png)


    +   - Adapters can not only convert data into various formats but can also help
    objects with different interfaces


    +   - Possible to create a two-way adapter that can convert the calls in both
    directions.


    ![](img/d6a5dc163996c263d43b0b54748187e0_3_2.png)


    +   - Hierarchical representations of objects are needed.


    +   - Objects and compositions of objects should be treated uniformly.


