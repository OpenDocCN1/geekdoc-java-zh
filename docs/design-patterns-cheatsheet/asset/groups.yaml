    \ benefit us, but more importantly where and when to use them.\n\nStructural patterns\
    \ deal with object composition, creating relationships between objects to form\
    \ larger structures.\n\nBehavioral patterns focus on communication between objects,\
    \ what goes on between objects and how they operate together.\n\nDesign patterns\
    \ can speed up the development process by providing tested, proven design patterns.\
    \ Effective software design requires considering issues that may become visible\
    \ until later in the implementation. Reusing design patterns helps to prevent\
    \ subtle issues that can cause major problems and improve readability for coders\
    \ and architects familiar with the patterns.\n\n# 1. Introduction\n\nDesign patterns\
    \ are reusable solutions to common software design problems. They provide a way\
    \ to describe and document software architectures, as well as a common vocabulary\
    \ for developers to communicate about software design.\n\nThere are several types\
    \ of design patterns, including creational, structural, and behavioral patterns.\n\
    \nCreational patterns deal with object creation mechanisms, trying to create objects\
    \ in a manner suitable to the situation.\n\n# 2. Creational patterns\n\n## 2.1.\
    \ Singleton\n\nThe Singleton design pattern is used to ensure that a class has\
    \ only one instance, and to provide a global access point to that instance.\n\n\
    | Singleton |\n| :--- |\n| - static sc |\n| + static getInstance() |\n\nFigure\
    \ 1. Singleton UML.\n\n- One advantage of the Singleton design pattern is that\
    \ it ensures that there is only one instance of a class, which can be useful for\
    \ classes that manage resources such as database connections or network sockets.\n\
    - It also provides a global access point to the instance, which can make it easier\
    \ to use the instance in different parts of the code.\n\n## 2.2. Factory\n\nProvides\
    \ a way to create objects without specifying the exact class of object that will\
    \ be created. A method that creates objects of a specific type. The method takes\
    \ the type of object to be created as an argument and returns a new object of\
    \ that type.\n\nOften, people only understand how to apply certain design techniques\
    \ to certain problems. These techniques are difficult to apply to a broader range\
    \ of problems. Design patterns provide general solutions, documented in a format\
    \ that doesn't require specifics tied to a particular problem.\n\n| interface\
    \ | Creator |\n| :--- | :--- |\n| Product | operator() / factoryMethod() |\n|\
    \ ConcreteProduct | ConcreteCreator factoryMethod() |\n\nFigure 2. Factory UML.\n\
    \n- Useful when you want to create objects that are compatible with a certain\
    \ framework or workflow, but you don't want to specify the concrete classes of\
    \ the objects at runtime.\n\n## 2.4. Builder\n\nAllows for the creation of complex\
    \ objects in a step-by-step manner. It separates the construction of an object\
    \ from its representation, allowing for different representations to be created.\n\
    \n- One advantage of using the Factory design pattern is that it allows the creation\
    \ of objects to be centralized in a single location, which can make the code more\
    \ modular and easier to maintain.\n- It also allows the implementation of object\
    \ creation to be changed easily, which can make the design more flexible and extensible.\n\
    - Allows objects to be created without specifying their exact class, which can\
    \ make the code more generic and reusable.\n\n![](img/d6a5dc163996c263d43b0b54748187e0_2_0.png)\n\
    \nFigure 4. Builder UML.\n\n- Object creation algorithms should be decoupled from\
    \ the system.\n- Multiple representations of creation algorithms are required.\n\
    - The addition of new functionality without changing the core class is necessary.\n\
    \n## 2.3. Abstract Factory\n\nProvides an interface for creating families of related\
    \ or dependent objects without specifying their concrete classes.\n\n| interface\
    \ | Client |\n| :--- | :--- |\n| AbstractFactory | Product |\n| ConcreteFactoryA\
    \ | ProductA |\n| ConcreteFactoryB | ProductB |\n\nFigure 3. class_diagram_1\n\
    \n- A system should be independent of how its products are created, composed,\
    \ and represented.\n- A system should be configured with one of the multiple families\
    \ of products.\n- A family of related product objects is designed to be used together,\
    \ and you need to enforce this constraint.\n\n## 2.5. Prototype\n\nAllows for\
    \ the creation of new objects by copying existing objects, rather than creating\
    \ new objects from scratch.\n\n| Client | interface |\n| :--- | :--- |\n| | Prototype\
    \ |\n| | clone() |\n| ConcretePrototype1 | clone() |\n| ConcretePrototype2 | clone()\
    \ |\n\nFigure 5. Prototype UML.\n\n- Useful when creating complex objects independently\
    \ when the cost of creating a new object is high.\n- A class will not know what\
    \ classes it will be required to create.\n- Subclasses may specify what objects\
