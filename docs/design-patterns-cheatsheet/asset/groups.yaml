  mdcn: "\n\n# 设计模式\n\n# 目录\n\n- 前言 ... 1\n- 1. 引言 ... 1\n- 2. 创建型模式 ... 1\n- 2.1.\
    \ 单例模式 ... 1\n- 2.2. 工厂模式 ... 1\n- 2.3. 抽象工厂模式 ... 2\n- 2.4. 构建器模式 ... 2\n- 2.5.\
    \ 原型模式 ... 2\n- 3. 结构模式 ... 3\n- 3.1. 适配器模式 ... 3\n- 3.2. 桥接模式 ... 3\n- 3.3. 组合模式\
    \ ... 3\n- 3.4. 装饰器模式 ... 4\n- 3.5. Fac面模式 ... 4\n- 3.6. 重量模式 ... 4\n- 3.7. 代理模式\
    \ ... 4\n- 4. 行为模式 ... 5\n- 4.1. 责任链模式 ... 5\n- 4.2. 命令模式 ... 5\n- 4.3. 迭代器模式\
    \ ... 5\n- 4.4. 中介者模式 ... 5\n- 4.5. 观察者模式 ... 6\n- 4.6. 策略模式 ... 6\n- 4.7. 模板方法\
    \ ... 6\n\n# 前言\n\n在这个快速查表中，我们将讨论软件开发中的设计模式。我们将关注它们是什么、它们如何为我们带来收益，但更重要的是在何处何时使用它们。\n\
    \n结构模式处理对象组合，通过创建对象之间的关系来形成更大的结构。\n\n行为模式关注对象之间的通信，即对象之间发生了什么以及它们如何共同工作。\n\n设计模式通过提供经过测试、证明有效的设计模式来加速开发过程。有效的软件设计需要考虑可能在实现后期才会显现的问题。重用设计模式有助于防止导致重大问题的细微问题，并提高熟悉这些模式的编码人员和架构师的代码可读性。\n\
    \n# 1. 引言\n\n设计模式是解决常见软件设计问题的重用解决方案。它们提供了一种描述和记录软件架构的方法，并为开发者交流软件设计提供了一套通用词汇。\n\
    \n设计模式有几种类型，包括创建型、结构型和行为型模式。\n\n创建型模式处理对象的创建机制，试图以适合情况的方式创建对象。\n\n# 2. 创建型模式\n\
    \n## 2.1. 单例模式\n\n单例设计模式用于确保一个类只有一个实例，并为该实例提供全局访问点。\n\n| 单例 |\n| :--- |\n| - static\
    \ sc |\n| + static getInstance() |\n\n图 1. 单例 UML。\n\n- 单例设计模式的一个优点是它确保了类只有一个实例，这对于管理如数据库连接或网络套接字等资源的类非常有用。\n\
    - 它还为实例提供了一个全局访问点，使得在代码的不同部分更容易使用该实例。\n\n## 2.2. 工厂模式\n\n提供了一种创建对象的方法，而不指定将创建的对象的精确类。创建特定类型对象的方法。该方法将要创建的对象类型作为参数，并返回该类型的新对象。\n\
    \n通常，人们只理解如何将某些设计技术应用于某些问题。这些技术很难应用于更广泛的问题中。设计模式提供了通用的解决方案，其记录格式不依赖于特定问题的具体细节。\n\
    \n| 接口 | 创建者 |\n| :--- | :--- |\n| 产品 | operator() / factoryMethod() |\n| 具体产品\
    \ | 具体创建者 factoryMethod() |\n\n图 2. 工厂 UML。\n\n- 当你想创建与某些框架或工作流兼容的对象，但又不想在运行时指定对象的具体类时，非常有用。\n\
    \n## 2.4. 构建器模式\n\n允许以分步的方式创建复杂对象。它将对象的构建与它的表示分离，允许创建不同的表示形式。\n\n- 使用工厂设计模式的优点是它允许将对象的创建集中在单个位置，这使得代码更模块化且更容易维护。\n\
    - 它还允许轻松地更改对象创建的实现，使设计更具活性和扩展性。\n- 允许在不指定对象精确类的情况下创建对象，这使得代码更具通用性和可用性。\n\n![](img/d6a5dc163996c263d43b0b54748187e0_2_0.png)\n\
    \n图 4. 构建器 UML。\n\n- 对象创建算法应与系统解耦。\n- 需要多种创建算法的表示形式。\n- 有必要在不改变核心类的情况下添加新功能。\n\
    \n## 2.3. 抽象工厂模式\n\n为创建一组相关或依赖的对象族提供接口，而不指定它们的具体类。\n\n| 接口 | 客户端 |\n| :--- | :---\
    \ |\n| 抽象工厂 | 产品 |\n| 具体工厂A | 产品A |\n| 具体工厂B | 产品B |\n\n图 3. class_diagram_1\n\
    \n- 系统不应依赖于其产品是如何创建、组合和表示的。\n- 系统应该配置为多个产品族之一。\n- 一组相关的对象对象被设计为一起使用，你需要强制执行这一约束。\n\
    \n## 2.5. 原型模式\n\n允许通过复制现有对象来创建新对象，而不是从头创建新对象。\n\n| 客户端 | 接口 |\n| :--- | :---\
    \ |\n| | 原型 |\n| | clone() |\n| 具体原型1 | clone() |\n| 具体原型2 | clone() |\n\n图 5.\
    \ 原型 UML。\n\n- 当创建新对象的成本很高且需要独立创建复杂对象时，非常有用。\n- 类将不知道它需要创建哪些类。\n- 子类可以指定应该创建哪些对象。\n\
    - 父类希望将创建推迟给子类。\n\n![](img/d6a5dc163996c263d43b0b54748187e0_3_0.png)\n\n# Java\
    \ Code Geeks 快速查表 设计模式\n\n# 3. 结构模式\n\n## 3.1. 适配器模式\n\n通过在一个接口周围封装一个适配器类，允许两个不兼容的接口协同工作。该适配器类将被适配类的接口转换为客户端所期望的接口。\n\
    \n- 抽象和实现不应在编译时绑定。\n- 抽象和实现应该是可独立扩展的。\n- 抽象实现中的更改不应影响客户端。\n- 实现细节应该对客户端隐藏。\n\n\
    ## 3.2. 桥接模式\n\n允许抽象和实现分离，以便两者可以独立变化。\n\n## 3.3. 组合模式\n\n允许将对象被视为单个单元。它用于将对象组合成树形结构，并从简单的对象创建复杂对象。\n\
    \n![](img/d6a5dc163996c263d43b0b54748187e0_3_1.png)\n\n- 适配器不仅可以将数据转换为各种格式，还可以帮助具有不同接口的对象。\n\
    - 可能创建一个可以双向转换调用的双向适配器。\n\n![](img/d6a5dc163996c263d43b0b54748187e0_3_2.png)\n\
    \n- 需要对对象的分层次表示。\n- 对象的及其组合应该被统一对待。\n\n## 3.4. 装饰器模式\n\n允许在不改变现有对象结构的情况下动态添加新行为。系统的维护和修改。\n\
    \n## 3.6. 重量模式\n\n旨在通过在对象之间共享公共数据来最小化内存使用。这是通过创建一个共享对象来实现，而不是每个对象都拥有数据的实例。\n\n\
    ![](img/d6a5dc163996c263d43b0b54748187e0_4_0.png)\n\n- 它可以用于为类添加新功能，或封装现有类以添加额外功能。\n\
    \n![](img/d6a5dc163996c263d43b0b54748187e0_4_1.png)\n\n## 3.5. Fac面模式\n\n为复杂系统提供简化的接口。\n\
    \n- 我们可以减少应用程序的内存占用并提高其性能。\n- 仔细考虑内存节省收益与实现该模式带来的复杂性之间的权衡。\n\n![](img/d6a5dc163996c263d43b0b54748187e0_4_2.png)\n\
    \n## 3.7. 代理模式\n\n在客户端和真实主体之间提供中间对象。\n\n代理模式可以用于：\n\n```\ninterface {\n  request();\n\
    }\n```\n\n- 当系统有大量互连的类或客户端需要访问系统的有限功能时，非常有用。\n- 它解耦了客户端与复杂的子系统，并允许更容易\n\n![](img/d6a5dc163996c263d43b0b54748187e0_4_3.png)\n\
    \n"
