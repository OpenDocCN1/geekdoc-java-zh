    \n![](img/d6a5dc163996c263d43b0b54748187e0_3_0.png)\n\n# Java Code Geeks CHEATSHEETS\
    \ DESIGN PATTERNS\n\n# 3. Structural patterns\n\n## 3.1. Adapter\n\nAllows two\
    \ incompatible interfaces to work together by wrapping an adapter class around\
    \ one of the interfaces. This adapter class converts the interface of the adapted\
