    \n## 3.5. Facade\n\nProvides a simplified interface to a complex system.\n\n-\
    \ We can reduce the memory footprint of our application and improve its performance.\n\
    - Carefully consider the trade-off between the benefits of memory savings and\
    \ the added complexity of implementing the pattern.\n\n![](img/d6a5dc163996c263d43b0b54748187e0_4_2.png)\n\
