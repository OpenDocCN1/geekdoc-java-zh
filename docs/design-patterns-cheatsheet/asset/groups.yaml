- md: '

    - Provide a placeholder for a potentially expensive or resource-intensive object.
    The proxy can be used to create the real object only when it is needed, rather
    than creating upfront.

    - Control access to the real subject. The proxy can be used to enforce access
    restrictions or implement authentication and authorization checks.

    - Add additional functionality to the real subject. The proxy can be used to intercept
    requests to the real subject and perform additional tasks before or after forwarding
    the request.


    ## 4.2. Command


    Allows for the encapsulation of a request as object, which can then be passed
    to a receiver to be executed.


    ![](img/d6a5dc163996c263d43b0b54748187e0_5_0.png)


    - Allows for the separation of the sender and receiver of a request.

    - Ability to queue or log requests, and to support undo/redo functionality.


    ## 4. Behavioral patterns


    ### 4.1. Chain of Responsibility


    Allows an object to send a request to a chain of objects in order to handle the
    request.


    ![](img/d6a5dc163996c263d43b0b54748187e0_5_1.png)


    ### 4.3. Iterator


    Allows clients to access elements of an aggregate object sequentially without
    exposing the object''s underlying representation.


    ![](img/d6a5dc163996c263d43b0b54748187e0_5_2.png)


    - Allows clients to traverse a collection of objects in a consistent, uniform
    manner, regardless of the specific implementation of the collection.

    - Useful for situations where multiple objects may be able to handle a request,
    and the specific object that should handle the request is not known in advance.

    - Allows for the easy addition or removal of objects from the chain without disrupting
    the overall functionality.


    ### 4.4. Mediator


    Allows multiple objects to communicate with each other without knowing the details
    of their implementation.


    ### 4.6. Strategy


    Allows an object to change its behavior or strategy at runtime by switching to
    a different strategy object.


    ![](img/d6a5dc163996c263d43b0b54748187e0_6_0.png)


    - It provides a central point of communication, known as the mediator, which acts
    as an intermediary between the objects.

    - Useful in cases where there are a large number of objects that need to communicate
    with each other, as it reduces the complexity of the system by separating the
    communication logic from the objects themselves.


    ### 4.5. Observer


    ![](img/d6a5dc163996c263d43b0b54748187e0_6_1.png)


    Allows an object (the subject) to notify a set of objects (the observers) when
    its state changes. The observer pattern is also known as the publish-subscribe
    pattern.


    - The only difference between many related classes is their behavior.

    - Multiple versions or variations of an algorithm are required.

    - Algorithms access or utilize data that calling code shouldn''t be exposed to.

    - The behavior of a class should be defined at runtime.

    - Conditional statements are complex and hard to maintain.


    ### 4.7. Template Method


    Defines the steps of an algorithm and allows subclasses to override certain steps,
    while still preserving the overall structure of the algorithm.


    ![](img/d6a5dc163996c263d43b0b54748187e0_6_2.png)


    - Useful when you want to ensure that various objects are kept in sync with each
    other, or when you want to be able to reuse subjects and observers independently
    of each other.


    # DESIGN PATTERNS


    ![](img/d6a5dc163996c263d43b0b54748187e0_7_0.png)


    Figure 19. Template Method UML.


    - A single abstract implementation of an algorithm is needed.

    - Common behavior among subclasses should be localized to a common class.

    - Parent classes should be able to uniformly invoke behavior in their subclasses.

    - Most, or all subclasses need to implement the behavior.


