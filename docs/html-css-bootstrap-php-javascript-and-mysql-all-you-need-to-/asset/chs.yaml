  \ Html 表格。通过点击播放箭头，我们可以在 App 内置的 Web 模拟器上查看结果。\n\n![](img/ebook_image_205181_e51be7aa6ae518ec.jpg)\n\
  \n## 什么是数据库以及它们有什么用\n\n什么是数据库？每当我们想要存储需要进行操作的数据时，我们一定会有一个数据库。数据库就像是容器，里面盛装了我们想要存储的数据。数据库不仅用于网页，还用于用各种编程语言（visual\
  \ basic、C、python、java、javascript 等）创建的各种应用程序。\n\n数据库分为关系型和非关系型。在大多数情况下，使用的是关系型数据库，正如你从术语中理解的那样，它是基于关系的，特别是通过表与表之间的一对一、一对多、多对多关系连接的型表。\n\
  \n现有的关系类型：\n\n\n表通过键（可以是主键或外键）连接在一起。\n\n我提醒你，主键必须是唯一的，并且标识我们所考虑的实体的实例。\n\n我提醒你，一个表的主键可以成为另一个表的外键，第一个表与该表存在关系。\n\
  \n要创建一个数据库，我们首先从包含我们需要所有数据的单表开始，稍后我们将删除各种表中重复的字段，这些字段在数据库中不应重复，因为它们可以通过简单的数据库查询检索到。\n\
  \n具有关系表（通过主键和外键链接）的关系型数据库的一个例子可以是员工工资或产品仓库，以及其他通过某些被标识为“键”的字段连接在一起的数据结构。例如，员工主数据表可以通过员工代码链接到工资单表，或者产品表可以链接到发票表和客户表等。\n\
  \n在本项目中，数据库将仅用于在我们网站上插入我们选择的图片以及在主页插入新闻，因此它们将由只有主键的非关系表组成。特别是我们将会有三个表：一个用于图片和包含在主页（`index.php`）中的新闻文本，一个用于服装，一个用于登录。在图片表中，我们将只有主键作为自动\
  \ ID，并将 `n` 作为插入的图片数量；而在新闻表中，我们将同时拥有带有变量 `n` 的图片及其相关的文本。在最后一个登录表中，我们有用户名和加密后的密码。\n\
  \n## 使用 phpMyAdmin 创建和管理数据库\n\n可以使用各种软件创建数据库，包括 Office Application Access 或其他各种软件。可以在数据库上插入、选择、修改和删除数据。查询关系型数据库的语言是\
  \ `SQL`。\n\n为了管理数据库，我们可以从网上下载 `MySql` 或下载包含 `MySql` 的包，例如用于网页的 `WAMP` 或 `XAMPP`，我们稍后会详细解释。现在我们指定这两个应用程序都包含了\
  \ `phpMyAdmin`。\n\n在我们的情况下，它们将用于使我们的示例网站变为动态，根据与用户的交互更改数据，在这方面，我们将使用 `phpMyAdmin`。\n\
  \n*我提醒你，数据库也可以用于 WordPress。*\n\n## 数据库管理\n\n在这项工作中，我们不必解决所有关于数据库疑问的结，但我们打算对该主题进行简要介绍，这对于示例示例非常有用。\n\
  \n要管理数据库，我们必须使用 `MySql` 语言。查询是向数据库提出的请求，带有子句。\n\n通过 `SELECT` 子句，你选择数据库中选定表的记录：\n\
  \n```\nquery = \"SELECT * FROM data WHERE id = 1\";\n```\n\n在这种情况下，我们将选择所有列，因为我们输入了\
  \ `*`。\n\n`DELETE` 子句删除选定的记录：\n\n```\nquery = \"DELETE FROM data_news WHERE id2\
  \ = '$ i'\";\n```\n\n`UPDATE` 子句用我们想要插入的数据更新记录：\n\n```\nquery = \"UPDATE data_news\
  \ set id2 = '$ o' WHERE id = $ id\";\n```\n\n所有这些子句都将包含在数据库的管理中。\n\n## 客户端语言和服务端语言\n\
  \n编写网页时，你需要同时使用服务器端和客户端语言。如果程序员没有预见到对连接到服务器自身数据库的请求，那么客户端语言就足够了，因此在网站（`html` 和 `javascript`）的情况下是如此。另一方面，如果网站提供了对服务器端数据库的访问，因此网络上的所有客户端都可以访问，那么它必须用服务端语言（如\
  \ `PHP`）编写。例如使用 CMS 创建动态网站或通过选择在线产品创建电子商务网站。\n\n## PHP\n\n`Php` 是一种诞生于 1994 年的服务端编程语言，用于创建动态网页。它随着\
  \ WordPress 管理的用 `PHP` 创建的 CMS 遍布全球。`PHP` 解释器免费分发。\n\n`Php` 是最著名的服务端语言，用于与外部服务器通信。\n\
  \n`php` 代码可以直接插入 HTML，也可以单独保存为 `.php` 扩展名，但始终标识为：\n\n```\n```\n\n`.php` 文件必须包含在\
  \ HTML 页面中：\n\n```\ninclude (\"view-home\");\n```\n\n## JavaScript\n\nJavaScript\
  \ 是一种用于事件页的客户端编程语言。通过 JavaScript 用户可以与网站交互并将网站变为动态。JavaScript 的示例是用户选择的键。一个带有语言的翻译器可能是\
  \ JavaScript 程序。\n\nJavaScript 从上到下读取，因此它必须插入代码的特定部分。它是解释型代码的一种，与编译代码不同，编译器将编程语言翻译成机器语言。\n\
  \n尽管 JavaScript 成为客户端语言已有多年，但现在有了 NodeJS 将 JavaScript 转换为服务端语言。这无疑将是本书的话题。\n\nJavaScript\
  \ 代码可以嵌入 HTML 网页中，也可以插入单独的 js 文件并仅从 HTML 页面调用。\n\n它可以插入页面的 body 中：\n\n```html\n\
  <script type=\"text/javascript\" src=\"js/search.js\"></script>\n```\n\n它可以插入页面的特定部分，例如在\
  \ bootstrap 中：\n\n```html\n<! - Javascript ->\n<script src=\"js/jquery-1.1.1.min.js\"\
  ></script>\n<script src=\"bootstrap/js/bootstrap.min.js\"></script>\n<script src=\"\
  js/bootstrap-hover-dropdown.min.js\"></script>\n<script src=\"js/wow.min.js\"></script>\n\
  <script src=\"js/retina-1.1.0.min.js\"></script>\n<script src=\"js/jquery.magnific-popup.min.js\"\
  ></script>\n<script src=\"flexslider/jquery.flexslider-min.js\"></script>\n<script\
  \ src=\"js/jflickrfeed.min.js\"></script>\n<script src=\"js/masonry.pkgd.min.js\"\
  ></script>\n<script src=\"http://maps.google.com/maps/api/js?sensor=true\"></script>\n\
  <script src=\"js/jquery.ui.map.min.js\"></script>\n<script src=\"js/scripts.js\"\
  ></script>\n```\n\n我提醒你，为了被识别为 JavaScript 代码，你必须插入 `<script> </script>` 标签\n\n\n\
  \n\n\n# 创建项目\n\n我们的示例网站涉及一家拥有三家门店的服装店，用于在其中插入各个商店展示的系列照片。该示例并非电子商务网站，仅需展示系列集合的照片。\n\
  \n我们在本示例中的目标将是通过 `phpMysql`、`php` 和 `javascript` 实现通过加密密码访问，直接从网站中插入图像。\n\n首先，我们需要确定网站必须由多少个页面组成，以及这些页面应该是哪些（首页、关于我们、服务或产品以及联系我们）。我们也可以决定创建一个单页滚动页面（单页网站）或多个拆分页面。考虑到如今用户在社交网络上不断滚动的习惯，也许创建一个“单页”网站会更好。如果之后我们想引导用户执行特定操作，我们将创建一个着陆页（landing\
  \ page），这些页面例如是为特定营销活动导向的页面。\n\n在我们的示例中，我们决定创建四个主页面，并可以通过主菜单直接访问，同时增加两个针对两个系列（男装和女装）的页面，以及三个通过主导航栏子菜单访问的商店页面。\n\
  \n在此阶段，我们既可以写出各个页面必须具备的主要特征，又可以在纸上画出页面本身的图形设计。你还可以创建页面图形的视觉模型（模板），以理解在项目中需要修改的内容。\n\
  \n## 使用记事本\n\n我们已经提到，所有用于 Web 的 html、`javascript` 和 `php` 文件都可以用简单的记事本轻松地编写，重要的是用特定的扩展名（`.html`、`.php`\
  \ 等）保存文件。显然，在这种情况下，我们必须非常熟悉我们想要使用的语言，否则文件将无法运行。为了解决这个问题，我们可以使用记事本，与简单的记事本不同，它会在我们编写该语言的单词时提供建议，以避免代码编写错误。\n\
  \n![](img/ebook_image_205181_21fede7b73179a10.jpg)![](img/ebook_image_205181_1199a514666053f.jpg)\n\
  \n## 创建页面\n\n在项目的这一阶段，我们可以选择独立使用 html 创建页面，或使用互联网上的各种资源，例如已经创建的 Bootstrap，我们需要根据自己的需求对其进行修改。\n\
  \n我们之前已经解释了创建一个符合当今市场特定需求（如动态和响应式网站）的 `CSS` 所需的困难和时间。这就是为什么在旨在教学、特别是创建一个用于插入图像的动态菜单的工作中，我们决定使用互联网上已经免费提供的资源。\n\
  \n正如我们稍后在页面创建的第一阶段将看到的，我们将用 html 代码编写所有主页面，并随着工作的进行，我们将意识到在 `javascript` 和 `php`\
  \ 语言方面深入哪些用处，然后将某些页面保存为 `php`，因为它们包含 `php` 代码。\n\n## 修改页面布局\n\n在创建主页面之后，我们致力于将页面适应我们想要创建的网站的需求。在此阶段，我们必须理解网站将要做，它将如何与用户交互，以及我们想要输入并给用户的信息，通过在静态显示的内容与用户动态选择的内容之间进行筛选。\n\
  \n在此阶段，我们明确了网站将要做，它将如何与用户交互，以及我们想要输入并给用户的信息，通过在静态显示的内容与用户动态选择的内容之间进行筛选。\n\n\n\n\n\
  \n![](img/ebook_image_205181_e6fc015ae0d97639.jpg)![](img/ebook_image_205181_d710df81cc9a3197.jpg)![](img/ebook_image_205181_d0e811503d70f5eb.jpg)![](img/ebook_image_205181_28ba7a45f6e23cf7.jpg)![](img/ebook_image_205181_245db4447a20391b.jpg)![](img/ebook_image_205181_cb2996b096641c14.jpg)\n\
  \n要进入 WAMP 菜单，请点击 `wamp` 文件夹中的 `wampmanager.exe` 或者点击桌面上的 `W` 图标。\n\n![](img/ebook_image_205181_e4a69be38f5d9de1.jpg)![](img/ebook_image_205181_a9659a5396d9b1e2.jpg)![](img/ebook_image_205181_fa0fae3622b1f6d7.jpg)![](img/ebook_image_205181_6eddc5c3a9e4d5ba.jpg)![](img/ebook_image_205181_63132a94f90e5d1e.jpg)\n\
  \n我提醒你，也可以通过复制 `wamp` 文件夹下 `www` 文件夹中的 `wordpress` 文件夹来配合 WAMP 使用 WordPress。在 `phpMyAdmin`\
  \ 中创建数据库后，直接进行安装，我们将在 WordPress 配置中插入该数据库。\n\n## phpMyAdmin 和 MySQL\n\n使用数据库并不简单。首先，我们必须选择直接在\
  \ Web 上创建站点，还是在本地 Web 模拟器上进行测试然后迁移到 Web。然而，即使我们决定在 PC 上测试站点，我们仍然需要在购买或免费获取的托管主机上创建相同的数据库。每个带有网站链接的托管主机都将包含如\
  \ `phpMyAdmin` 这样的数据库管理软件。\n\n我提醒你，数据库数据将重新输入到与网站地址关联的软件中，而 `php` 中的页面和各种文件可以直接从托管主机上传。\n\
  \n我们项目的数据库结构如下：\n\n* 数据表 (Data table);\n* 新闻数据表 (Data_news table);\n* 登录表 (Login\
  \ table)。\n\n第一表包含用于上传系列图片和轮播图的数据。第二表包含上传新闻的有用数据，第三表包含登录的有用数据（用户名和密码）。\n\n![](img/ebook_image_205181_59b631724902e444.jpg)![](img/ebook_image_205181_d8953d8ad807b49b.jpg)![](img/ebook_image_205181_63fc81fe253650a4.jpg)\n\
  \n在字段中：\n\n* `n` 将保存女装系列的图片数量；\n* `n2` 将是男装系列的图片数量；\n* `N3` 将是首页、shop 1、shop 2 和\
  \ shop 3 页面的轮播图数量。\n\n![](img/ebook_image_205181_301fd016309dbeb6.jpg)\n\n在此表中，我们将有一个新闻字段，包含所有插入我们网站首页的新闻，我们可以删除和修改它们，也可以通过控制面板插入新新闻。\n\
  \n![](img/ebook_image_205181_a84c7d362c6d3ae2.jpg)\n\n我提醒你，为了更高的安全，我们以 `SHA1` 代码的形式输入了密码。\n\
  \n特别是，我们访问网站对密码进行加密和解密：\n\n`https://www.online-toolz.com/tools/sha1-generator.php`\n\
  \n我们选择了 `SHA1` 代码并将此代码复制到数据库中。随后，建议将原始密码保存在数据文件中，你在访问数据库时会需要它。\n\n我提醒你，访问登录时你将输入原始用户名和密码，我们的\
  \ `php` 代码将对其进行加密，并与数据库中输入的 `SHA1` 代码进行比对。\n## 登录以及插入图片和新闻的菜单\n\n我们将从网站页面顶部的登录页访问控制面板，该页面通过小人图标和“Login（登录）”字样识别。\n\
