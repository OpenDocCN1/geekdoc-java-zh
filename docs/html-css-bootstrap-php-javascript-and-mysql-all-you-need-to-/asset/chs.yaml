  结论 214\n\n# 引言\n\n本书旨在引导那些想要独立创建网站的人进入域名和网络编程的世界。作者将本作品视为一项纯教学性的研究，适用于所有想要学习客户端和服务器端编程的人。\n\
  \n首先，我们将解释网络上存在的各种域名，随后我们将解释 `CSS` 和 `HTML`，然后进入 `PHP` 编程（服务器端）和 `JavaScript`（客户端），以及通过\
  \ `phpMyAdmin` 创建数据库。\n\n所有内容都将通过一个示例网站来解释，该网站使用了免费的 Bootstrap 以简化操作，并编写了一个连接数据库的登录控制面板，以便直接从网上上传图片到数据库中。显然，在进入了数据库和编程的世界后，你可以将这些知识应用于网站的任何需求。\n\
  \n本书的目的并不是创建如今可以通过 `WordPress` 或或其他软件轻松完成的简单网页，而是为了纯粹的教育目的创建一个动态网站。总而言之，这项工作对于从零开始接触的人非常有帮助。\n\
  \n\n\n\n当我们想要将网页发布到网上时，我们必须请求托管（网络空间），这源于英文单词“to host”，意为“托管”。通常，我们选择的服务商会同时提供域名和免费或付费的托管服务。这取决于服务商所提供的条件。\n\
  \n在本书稍后解释的示例中，我们选择了来自 `Altervista` 的带有免费三级域名的托管服务。\n\n显然，如果你是一个程序员并正在向客户出售网站，你将无法使用三级域名，而是将使用带有付费托管的二级域名，并在创建网站后将其转交给公司，或者由你每年进行管理。这将取决于与客户签订的合同。\n\
  \n与与编程相关的一切方面一样，选择付费托管还是免费托管取决于你想要达到的最终结果。付费托管提供额外的服务以及与域名关联的各种电子邮件地址，此外，由于仅由公司或个人名称组成，它在\
  \ `Google search` 中搜索会变得更加方便。\n\n# 如何使用 WordPress 在不了解语言的情况下创建页面\nWordPress 仍然是一个极佳的选择，并且允许我们插入\
  \ `php` 代码。在这种情况下，我可以进入主题编辑器界面，并进入名为 `function.php` 的主题函数文件。这并不推荐，因为当主题更新时，所有的额外代码将会丢失。\n\
  \n相反，有一个可以插入 `php` 代码的插件，称为 `Code Snippets`。在安装并激活后，我将在主菜单中找到 `Snippets`，并可以使用一些现有文件或创建新文件。\n\
  \n# 如何使用 HTML 和 CSS 创建页面\n\n当我们用 `html` 编写网站时，我们的电脑（`CLIENT`）会与另一台名为 `SERVER` 的计算机通信，该计算机向\
  \ `Client` 提供响应。\n\n![](img/ebook_image_205181_703517eb8fd7628f.png)\n\n客户端向服务器发送请求，服务器通过解释\
  \ `html` 语言并查看网站来响应。\n\n创建网页，你可以使用简单的文本编辑器、记事本，或者更高级的 `Notepad`，后者还可以高亮指令中的编写错误。\n\
  \n![](img/ebook_image_205181_21fede7b73179a10.jpg)\n\n`HTML` 代表网站的结构，而 `CSS` 可以被视为网站的衣着（图形界面）。\n\
  \n`HTML` 是一种标记语言，而不是编程语言。事实上，浏览器翻译代码并允许我们查看网页。\n\n标签（tags）对于赋予页面结构至关重要，随后这些会被浏览器翻译。\n\
  \n元素或标签示例：\n\n```\n<h1> Page title </h1>\n<h2> Paragraph title </h2>\n<p> Page title\
  \ </p>\n```\n\n![](img/ebook_image_205181_1b8270989c4394fa.jpg)\n\n如果我们将这段代码复制到记稿纸并以\
  \ `html` 扩展名保存，我们将看到原始网站出现。\n\n![](img/ebook_image_205181_005417cdbf31f424.jpg)\n\
  \n然后我们以 `html` 扩展名保存文件。将其命名为 `index.html`，因为这是浏览器识别为我们网站主页的名字。\n\n![](img/ebook_image_205181_8c7cbb94d3e8819f.jpg)\n\
  \n如果双击桌面上的该文件，它将在浏览器中显示：\n\n![](img/ebook_image_205181_99b9ec547b485235.jpg)\n\n\
  你可以看到浏览器识别了标签并按照我们的意格式化了文本。这是浏览器读取 `html` 页面的简单示例。\n\n浏览器随后将标签翻译成网页的元素。\n\n在 Chrome\
  \ 中，如果我们输入：\n\n`Ctrl + u` 将显示任何网页的 `html` 代码。\n\n**Index.html:**\n\n```html\n<!\
  \ DOCTYPE html>\n<html\n<head>\n<title> Sample Web Designer | Welcome </title>\n\
  </head>\n<body>\n<header>\n<h1> Web Design Example</h1>\n</header>\n<nav>\n<ul>\n\
  <li class = \"current\"> <a href=\"index.html\"> Home </a> </li>\n<li> <a href=\"\
  about.html\"> About </a> </li>\n<li> <a href=\"services.html\"> Services </a> </li>\n\
  </ul>\n</nav>\n<p> Body of the site </p>\n<footer>\n</body>\n</html>\n```\n\n\n\n\
  \n```html\n<html>\n<head>\n<link rel = \"stylesheet\" href \"./style.css\">\n<title>\
  \ 示例网页设计师 | 欢迎 </title>\n</head>\n<body>\n<header>\n<h1> 网页设计示例 </h1>\n</header>\n\
  <nav>\n<ul>\n<<li> <a href=\"index.html\"> 首页 </a></li>\n<li class = \"current\"\
  > <a href=\"contacts.html\"> 联系方式 </a></li>\n</ul>\n</nav>\n<p> 您可以通过以下方式 找到我们：xxxxxx\
  \ n. xxx <br> 我们的电话是 xxxx </p>\n<footer>\n<p> 示例网页设计者，版权所有 & copy; 2022 </p>\n</footer>\n\
  </body>\n</html>\n```\n\n![](img/ebook_image_205181_23ae2bbba0bca2ae.jpg)\n\n我们插入到文件夹中的所有\
  \ html 页面都将具有与 `style.css` 样式表中插入相同的格式。\n\n另一种选择是使用在线上提供的其他资源来创建或编辑 CSS 样式表。\n\n\
  你可以用于此的一些在线工具，例如：\n\n- [https://www.toptal.com/developers/css3maker/]\n- [https://css3generator.com/]\n\
  - [https://webcode.tools/generators/css/background-color]\n- [https://css-generator.netlify.app/]\n\
  \n显然，除了 css 样式表之外，我们必须创建 html 文件来编写网站的内容。\n\n在这方面，我们还可以使用 Amaya 软件，通过它我们可以同时创建 css\
  \ 和 html 文件。\n\n- [https://amaya.it.uptodown.com/windows]\n\n![](img/ebook_image_205181_08c4e1c55fecdbc3.jpg)![](img/ebook_image_205181_4f5d2bac56a8b324.jpg)![](img/ebook_image_205181_965928ff86cd8cc9.jpg)![](img/ebook_image_205181_5c87daeaa91fd4b2.jpg)\n\
  \n现在，创建一个可以在任何设备上运行并具有各种链接和页面的响应式网站可能非常复杂且耗费时间，因此从网上下载已经准备好的模型（如 bootstraps）或直接从网上下载完整网站的示例是非常用的，可以根据需要进行修改，并始终遵守用户可用的许可。\n\
  \n![](img/ebook_image_205181_2776e40399723c87.jpg)![](img/ebook_image_205181_6e67c777397dbb20.jpg)![](img/ebook_image_205181_8e8d88ad3e0b684e.jpg)\n\
  \n## 动态与静态网站\n\n静态网站是过去几年中代表互联网大部分网站的站点。今天情况正在发生剧烈变化，静态网站的数量越来越少。\n\n静态网站最容易创建，并提供一个在程序员通过代码进行更改之前保持不变的网站。动态网站更加复杂，要求在网站页面内进行客户端和服务器类型的分级编程。动态网站允许用户通过对底层数据库进行查询，并通过代码中存在的脚本与网站本身进行交互。\n\
  \n动态网站的示例包括：\n\n- 具有实时产品选择的电子商务\n- 社交\n\n这些网站通过与用户的交互来实现持续更新。\n\n## 响应式与 Bootstrap\
  \ 网站\n\n响应式意味着反应，在 IT 术语中意味着自适应。当一个网站可以在所有类型的设备上查看而不检测到任何显示问题，完美通过自动调整大小并以最佳方式排列其每个部分时，它就被识别为响应式的。\n\
  \n在过去，由于设备类型不多，网站只能为 PC 制作，我们根本没有考虑过响应式网站，但现在它已成为创建网站的基本要求。\n\n首先，我们可以说使一个网站完全响应式是一项困难的工作。我们可以说，如果在样式表中使用百分比而不是像素，并在页面的\
  \ html 代码中插入：\n\n```html\n<meta name = \"viewport\" content = \"width = device-width,\
  \ initial-scale = 1\">\n```\n\n这将页面适配到设备的表面，但重要的是在样式表中以百分比进行考虑。\n\n然而，考虑到制作响应式网站的固有困难，如果你不想浪费时间且不是\
  \ CSS 和 html 专家，最好使用互联网上的资源（正如我们在本书中所做的那样），以便我们专注于编程。资源可以是 Bootstrap 和 Wordpress。\n\
