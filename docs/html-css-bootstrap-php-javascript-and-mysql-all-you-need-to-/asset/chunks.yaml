    ## What are databases and what are they for


    What are databases? Whenever we want to store data on which we have to operate,
    we will surely have a database. Databases or databases are like containers that
    contain the data we want to store. The databases are used not only for the web
    but also for various kinds of applications created in various programming languages
    (visual basic, C, python, java, javascript, etc.).


    Databases are divided into relational and non-relational. In most cases, relational
    databases are used, which as you can also understand from the term are based on
    relationships and in particular on relational tables connected through one-to-one,
    one to all, all to all relationships between the tables themselves.


    Types of existing relationships:


    ![](images/ebook_image_205181_f2cc5449993836ce.jpg)


    The tables are linked together through the keys which can be primary or secondary.


    I remind you that the primary key must be unique and identify the individual instances
    of the entity we are considering.


    I remind you that the primary key of a table can become the foreign key of another
    table with which the first has a relationship.


    To create a database, first we start from the single tables that contain all the
    data we need and at a later time we will remove the duplicate fields in the various
    tables that must not be repeated in the Database because they can be retrieved
    through a simple database query.


    An example of a relational database with relational tables, linked by primary
    keys and foreign keys, can be the salary of employees or the warehouse of products,
    and others in which there are data linked together by some fields identified as
    keys. For example, the employee master data table can be linked to the payslip
    table through the employee code or the Products table can be linked to the Invoices
    table and the Customers table and so on.


    In this project the Databases will only be used to insert the images we have chosen
    on our site and to insert the News on the homepage, so they will be composed of
    non-relational tables with only primary keys. In particular we will have three
    tables: one for the images and the text of the News included in the homepage (`index.php`),
    one for the clothing collections and one for the login. In the image tables we
    will have only the primary key as the automatic ID and `n` as the number of images
    to insert, while in the News table we will have both the images with the variable
    `n` and the text relating to them. In the last login table we have the username
    and the encrypted password.


    ## Create and manage databases with phpMyAdmin


    Databases can be created with various software including Office Application Access
    or other software of various kinds. Data can be inserted, selected, modified and
    deleted on the database. The language for querying relational databases is `SQL`.


    To manage the databases we could download `MySql` from the web or download the
    packages that also include `MySql`, as for the web `WAMP` or `XAMPP` which we
    will explain better later. For now we specify that these two applications contain
    `phpMyAdmin`.


    In our case they will be used to make our example site dynamic, varying the data
    based on the interactions with the user and in this regard we will use `phpMyAdmin`.


    *I remind you that the Databases can also be used with WordPress.*


    ## Database Management


    In this work we do not have to solve all the knots concerning the doubts on the
    databases, but we intend to give a smattering of the subject which is extremely
    useful for the purposes of the applied example.


    To manage the databases we must use the `MySql` language. Queries are requests
    made to the database that work with clauses.


    With the `SELECT` clause you select the records of the selected table of the Database:


    ```

    query = "SELECT * FROM data WHERE id = 1";

    ```


    In this case we will select all the columns because we have entered `*`.


    The `DELETE` clause deletes the selected records:


    ```

    query = "DELETE FROM data_news WHERE id2 = ''$ i''";

    ```


    The `UPDATE` clause updates the records with the data we want to insert:


    ```

    query = "UPDATE data_news set id2 = ''$ o'' WHERE id = $ id";

    ```


    All these clauses will be included in the management of our database.


    ## Client-side and server-side languages


    When writing web pages you need to use both server-side and client-side languages.
    If the programmer does not foresee requests to the server connected to databases
    located on the server itself, then the client-side languages will suffice, therefore
    in the case of websites (`html` and `javascript`). If, on the other hand, the
    site provides access to a server-side database and therefore accessible to all
    clients on the network, then it must be written in a server-side language such
    as `PHP`. An example is the creation of dynamic sites with CMS or e-commerce sites
    with the choice of online products.


    ## PHP


