    # 站点发布


    在获取完整的数据库和内存空间托管后发布站点时，我们将复制 WAMP `www` 文件夹的文件，在托管中创建数据库，并稍后将更改数据库的一些连接文件。


    事实上，当我们不修改从 WAMP 文件夹复制的文件并在托管上发布站点时，它肯定无法工作，在这种情况下请不要担心，因为随着时间的推移，某些代码会过时并无法运行，你还需要根据在托管本身中创建数据库时选择的密码和数据库名称来配置数据库，使用之前描述的操作步骤。


