    # Introduction


    This book aims to initiate those who want to independently create a website, to
    the world of domains and programming linked to the web. The author conceived this
    work as a scientific work intended for educational and study use for all those
    who approach the study of client-side and server-side programming.


    In the first place the difference between the various domains existing on the
    network will be explained and at a later time we will try to explain the `CSS`
    and `HTML` and then enter the `PHP` programming (server side) and `JavaScript`
    (client side) with the creation of databases via `phpMyAdmin`.


    All this will be explained through an example website created specifically using
    a free Bootstrap for simplicity and basic convenience and programming a control
    panel with login connected to the site via database for inserting images directly
    from the web by uploading them to the database created with connected `phpMyAdmin`
    to the site. Obviously, after entering the world of databases and programming,
    you can apply this knowledge to any other need by the site.


    The aim of this study is not to create simple web pages that today can be done
    easily with `WordPress` or other easy-to-use software, but for purely educational
    purposes to make a dynamic site. In summary, this work can be useful for those
    who want to approach the programming from the beginning.


    # GENERAL PART


    ## Difference between sites and blogs


    The blog is updated daily, or weekly not new news which the blogger has decided
    to talk about in the blog built ad hoc (cooking blog, programming, etc.). The
    site can only be updated when company information changes or in the case of a
    portfolio or e-commerce site.


    # What are domains and hosting


    A domain is required to make a website public. The domain is made available by
    a provider and can be free or paid. Usually the top-level domains are those that
    identify a territory, while those that interest users are those of the second,
    third and fourth level.


    The second level domains are those that we will usually find for a fee and identify
    the user (for example `www.user.com`). The second and third level ones are mostly
    available for free on the web (eg we can have `www.altervista.user.com`). The
    second, third and fourth level domains can also be connected to your site (eg
    we can have `blog.user.com`).

