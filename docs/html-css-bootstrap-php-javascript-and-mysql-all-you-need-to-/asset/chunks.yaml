    they are published.


    For this purpose we can use free software packages available on the internet such
    as WAMP or XAMPP. We can see these software as local web simulators.


    XAMPP stands for cross-platform (multiplatform), apache, MySql and php and perl.
    Let''s say that between XAMPP and WAMP there is not much difference. Apache is
    a local web server for testing the website project without going to the web. MySql
    is used to create and manage databases. To open MySql we need to install php.


    We may not even use XAMPP or WAMP, but in this case we will not be able to interact
    with the databases and see the functioning of programs written in PHP and Javascript
    locally.


    It follows that if we have not provided any type of interaction with the user
    on our site, we can easily view the pages with the chosen browser without downloading
    any type of simulator such as WAMP by simply clicking on the html pages.


    XAMPP is cross-platform and also supports PERL, while WAMP only supports MySQL,
    PHP and Apache and only works on Windows.


    ***I remind you that WAMP is the Windows stack, but that there is also LAMP for
    Linux and the version for MAC which is called MAMP.***


    # What is WAMP and how it works


    In this work to test our example site we decided to use WAMP as a Windows stack.
    WAMP is the acronym that derives from Windows, Apache, Mysql and PHP. The software
    package is called WampServer and is free.


    # Download and install WAMP


    After searching the internet for WAMP, the package will be installed. There are
    various sites from which you can download WAMP for free.


    At the end of the installation, the wamp folder will appear in the C: folder of
    our computer.


    Wamp will also install other software useful in programming such as Notepad.


    # Use WAMP


    After installing the WAMP software we will have the following folder in C:


    ![](images/ebook_image_205181_6175e09d1dc215a6.jpg)


    To enter the simulator we have to click wampmanager.exe, while if we want to create
    a site or transfer the folders of a site already created in WAMP, click on the
    www folder and import the site files we need.'
