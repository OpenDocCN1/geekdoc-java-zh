    # Other files present in the site folder


    The file `pclzip.lib.php` can be downloaded from the internet and is used to zip
    and unzip files:


    [https://github.com/chamilo/pclzip/blob/master/pclzip.lib.php](https://github.com/chamilo/pclzip/blob/master/pclzip.lib.php)


    Remember to download this file and insert it in the site folder otherwise you
    will not be able to upload the zipped images from the site menu.


    If you can''t download it you can copy it from the internet and paste it on notepad
    and save the file with the name `pclzip.lib.php`, if you don''t know where to
    put your hands, never change the names of the files because they are linked to
    other files.


    The js files written in javascript actually in this project were downloaded with
    bootstrap or free from internet for image scrolling like `prettyPhoto`. In this
    book we did not want to deepen the javascript language which will be the subject
    of a future book.


    I remind you that `prettyPhoto` also exists as a WordPress plugin.


    The js files present in the JS folder are:


    ![](images/ebook_image_205181_6994a3c6324732b0.jpg)


    **I remind you that in your site you can incorporate all the codes that you will
    find on the internet respecting the relative licenses if they exist, but always
    paying attention to the general functioning of the site and to the slowdown in
    load that too many programs bring.**


    # Change the style of the site


    In this case, if we are at the beginning of the project, we can directly change
    the whole site by downloading a bootstrap or creating it from scratch, as seen
    previously, otherwise if we are already at the end of the work, we can only change
    the CSS style sheet manually with Notepad or by copying the style folder from
    another Bootstrap or from another site and modifying it with Nicepage or with
    a mobile application such as `TrebEdit` or `Html Creator` and many others present
    on the various stores as previously indicated.


    The original page is the one below:


    ![](images/ebook_image_205181_90ea14796411ed44.jpg)


    Here is an example of changing the entire Bootstrap style folder, after finishing
    the site:


    ![](images/ebook_image_205181_d40a63f6f98d9e60.jpg)


    Obviously, after having changed the style sheet, it would be better to open the
    sheet itself with Notepad and check it carefully, keeping in mind the result you
    want to obtain.


    **Small warning for non-experts is to always save the previous work in a backup
    folder before making any changes.**


    # See the site on WAMP


    To view the site created on WAMP you must first click on `wampmanager.exe` to
    activate `WAMP_` then enter the menu at the bottom left of WAMP and click on `localhost`.![](images/ebook_image_205181_6eddc5c3a9e4d5ba.jpg)![](images/ebook_image_205181_7ef619f1277aacf5.jpg)![](images/ebook_image_205181_c6ad06d7b4976fc1.jpg)


    Now, if we click on the folder we are interested in, we will probably have an
    error like the:


    ![](images/ebook_image_205181_c7e844a8502c)


    In this case, we have to type `127.0.0.1` in the address of the browser and we
    can view our site. In fact, `127.0.0.1` in the `www` folder of WAMP will therefore
    work.


    `http://127.0.0.1/negozio/abbigliamento/uonna-calzature/27/11/aggiorna/` (Wait,
