    The Legislative Decree `196/2003`, called "Code regarding the protection of personal
    data", brings together in a single context the Law `675/1996` and the other legislative
    decrees, regulations and ethical codes have happened in recent years in terms
    of the processing of personal data.


    Legislative Decree `196/2003` dictates a series of prescriptions aimed at ensuring
    that the processing of personal data is carried out in compliance with the rights,
    fundamental freedoms and dignity of individuals, with particular reference to
    confidentiality and personal identity. Likewise, the Decree guarantees the rights
    of legal persons and of any other body or association.


    Safeguarding the confidentiality of the personal data of our interlocutors is
    our primary commitment.


    This information is provided pursuant to art. 13 of Legislative Decree `196/2003`
    regarding the data provided by all those who interact with web services accessible
    electronically starting from the address `http://www.STORE1.it`


    1. The information is provided only for the `NEGOZIO 1 SRL` site and not for other
    websites that may be consulted by the user via links.


    2. Your personal data are processed by `NEGOZIO 1 SRL` and used for the purposes
    and in the manner indicated by specific information contained or displayed on
    the pages of the site for particular services or requests.


    3. The provision of your personal data is optional, but failure to provide it
    has the consequence of not allowing the undersigned to provide the requested services.


    4. Your personal data may also be disclosed to companies controlled and connected
    to `NEGOZIO 1 SRL` for the purposes highlighted from time to time in the specific
    information. The data will in no case be disclosed.


    5. Your personal data are processed with automated tools for the time strictly
    necessary to achieve the purposes for which they were collected.


    6. Your personal data are processed in compliance with the security measures imposed
    by Legislative Decree `196/2003` in order to prevent data loss, illicit or unauthorized
    use, or unauthorized access.


    7. We inform you that, in relation to your personal data, you are entitled to
    the rights referred to in Article 7 of the aforementioned Legislative Decree and,
    in particular, the right to access your personal data, to request its correction,
    the updating and cancellation, if incomplete, erroneous or collected in violation
    of the law, as well as to oppose their treatment for legitimate reasons.


    8. The data controller is `NEGOZIO 1 SRL`.


    9. To exercise the above rights or for further information on the subject, please
    contact us at the following email address: `STORE 1@gmail.com`


    This approach allows you to change the classic view of the contract for the benefit
