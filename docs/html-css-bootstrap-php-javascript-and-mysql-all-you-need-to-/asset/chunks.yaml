    space), from the English “to host” which means “to host”. Often the provider we
    choose will give us both the domain and the free or paid hosting. This depends
    on the conditions offered by the provider.


    In the example that we will explain later in this book, we have chosen a hosting
    with a free third level domain from Altervista.


    Obviously, if you are a programmer and you are selling a site to a customer, you
    will not be able to use a third level domain, but you will use a second level
    domain with paid hosting that you will transfer to the company after creating
    the site or that you will manage annually. This will depend on the contract drawn
    up with the customer.


    As in everything related to programming, the choice of paid or free hosting depends
    on the final result you want to achieve. Paid hosting has additional services
    and various e-mail addresses associated with the domain, furthermore being composed
    only of the name of the company or of the person it could be facilitated in the
    Google search.


    # How to create pages without knowing languages ​​with WordPress


    Wordpress is an open source software that allows you to dynamically create and
    update your blog or site. Through a very intuitive CMS (Content Management System)
    it allows you to add textual content, videos and images without working on the
    code directly on the pages of our site. It also offers the possibility if you
    know the basics of html language, to modify it directly from the source code.
    Obviously this platform offers many possibilities to use widgets and templates
    to be able to have, at the end of the creation work, a personalized blog, but
    not as much as it would allow us to make a personalized creation with html, php,
    javascript and mysql code where we can create our own. site from scratch with
    no pre-made themes. To customize the site more based on a theme, I can add a CSS
    to the


    Wordpress is still an excellent choice and also allows us to insert php code.
    In this case I can go to the theme editor aspect and enter the theme functions
    a file called function.php. This is not very recommendable as all additional code
    will be lost when the theme is updated.


    Instead, there is a plug-in to insert the php code which is called "Code Snippets".
    After installation and activation, I will find Snippets on the main menu and I
    will be able to use some existing files or create new ones.


    # How to create pages using HTML and CSS


    When we write a site in html, our PC (CLIENT) communicates with another computer
    called SERVER which provides a response to the Client.


    ![](images/ebook_image_205181_703517eb8fd7628f.png)


    The client makes a request to the Server which responds by interpreting the html
    language and viewing the site.


    To create web pages you can use a simple wordpad or notepad or the more advanced
    Notepad which also highlights the writing errors of the instructions.


    ![](images/ebook_image_205181_21fede7b73179a10.jpg)


    HTML represents the structure of the site, while CSS can be considered the dress
    (the graphics) of the site.


    HTML is a markup language and not a programming language. In fact, the browser
    translates the code and allows us to view the web page.


    The tags are essential to give a structure to the page which will then be translated
    by the browser.


    Example of element or tag:


    <h1> Page title </h1>


    <h2> Paragraph title </h2>


    <p> Page title </p>


    ![](images/ebook_image_205181_1b8270989c4394fa.jpg)


    If we copy this code on a note sheet and save it with an html extension, we will
    see that our raw site will appear.


    ![](images/ebook_image_205181_005417cdbf31f424.jpg)


    We then save the file with the html extension. We will call it index.html because
    it is the name that the browser will recognize as the main page of our site.


    ![](images/ebook_image_205181_8c7cbb94d3e8819f.jpg)


    If we double click on the desktop file it will display on the browser:


    ![](images/ebook_image_205181_99b9ec547b485235.jpg)


    You see that the browser recognizes the tags and formats our text as we wanted.
    This is a simple example of how the browser reads html pages.


    The browser then translates the tags into elements of the web page.


    From chrome if we type:


    Ctrl + u will display the html code of any web page.


