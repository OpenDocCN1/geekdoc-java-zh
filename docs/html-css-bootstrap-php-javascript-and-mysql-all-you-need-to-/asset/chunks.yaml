    # Conclusions


    In this work we wanted to explain the basics for creating a dynamic website with
    an example based on three clothing stores belonging to the same company. We applied
    and modified a bootstrap according to our needs and used clent-side and server-side
    programming.


    To complete the topic we have explained what databases are and how phpMyadmin
    works.


    We also learned to use WAMP to view the result of our site locally and we figured
    out how to bring the site created back to hosting.


    You are now ready to experiment with creating your own dynamic site yourself.'
