    # 10: 你认识任何在我们公司工作的人吗？

    # 11: 你期望的薪资是多少？

    # 12: 你是一个具有团队精神的人吗？

    # 13: 如果被录用，你预计在我们公司工作多久？

    # 14: 你曾经不得不解雇过任何人吗？你对此有什么感受？

    # 15: 你的工作哲学是什么？

    # 16: 如果你现在有足够的钱退休，你会退休吗？

    # 17: 你曾经被要求离开过某个职位吗？

    # 18: 请解释你将如何成为这个组织的财富。

    # 19: 为什么我们要雇用你？

    # 20: 告诉关于你提过的某个建议。

    # 21: 同事中哪些事让你感到反感？

    # 22: 你最大的优势是什么？

    # 23: 谈谈你的理想工作，或者你会在工作中寻找什么？

    # 24: 你为什么认为自己能够胜任这份工作？

    # 25: 你觉得这个职位最吸引你的地方是什么？（最不吸引你的地方呢？）

    # 26: 你拒绝和什么样的人合作？

    # 27: 对你来说，金钱还是工作更重要？

    # 28: 你之前的上级会认为你最强点是什么？

    # 29: 谈谈你与上级发生过的一个问题。

    # 30: 工作中有什么事让你感到失望的？

    # 31: 谈谈你的压力下工作能力。

    # 32: 你的技能与这份工作还是另一份工作更契合？

    # 33: 是什么激励你在工作中尽最大的努力？

    # 34: 你愿意加班吗？上夜吗？周末加班吗？

    # 35: 你如何判断自己在这份工作中取得了成功？

    # 36: 如果需要，你愿意搬迁吗？

    # 37: 你愿意将组织的利益放在个人利益之上吗？

    # 38: 描述你的管理风格。

    # 39: 你从工作中的错误中学了什么？

    # 40: 你有任何盲点吗？

    # 41: 如果你要为这份工作招聘一个人，你会寻找什么样的？

    # 42: 你认为你对这个职位来说资历过了吗？

    # 43: 你打算如何补偿你经验的不足？

    # 44: 你对上司有什么品质的要求？

    # 45: 谈谈你曾帮助解决他人之间争议的经历。

    # 46: 在负责项目的团队中，你更倾向于担任什么职位？

    # 47: 描述你的工作职业道德。

    # 48: 你在职业生涯中最大的遗憾是什么？

    # 49: 谈谈你在工作中经历的最有趣的时光。

    # 50: 你能为我们做什么？（你能为我们做哪些别人做不到的事？）

