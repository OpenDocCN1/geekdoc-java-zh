    # 面试问题与解答


    面试中最常被问的问题。你需要在脑中准备一个简短的陈述。将回答控制在一两分钟内。不要漫无乱语。注意不要听起来像是背诵的。除非另有说明，否则将内容限制在工作相关事项。谈论你做过的事情以及与应聘职位相关的经历。从最久远的事情开始说，一直回到现在（如果你在简历顶部有个人简介或陈声明，请以此为起点）。


    ## 2: 你为什么离开上一份工作？**

    **回答：**

    无论情况如何，都要保持积极。永远不要提到管理上的重大问题，也永远不要说主管、同事或组织的坏话。如果你这样做了，只会让自己显得很糟糕。保持微笑，并谈论离开的积极原因，例如获得机会、做某些特别事情的机会或其他前瞻性的原因。


    ## 3: 你在这个领域有什么经验？

    **回答：**

    谈论与你申请的职位相关的具体细节。如果你没有相关经验，请尽可能靠拢。


    ## 4: 你认为自己成功了吗？

    **回答：**

    你应该始终回答“是”，并简要解释原因。一个很好的解释是你已经设定了目标，已经实现了一些，并且正按计划实现其他目标。


    ## 5: 同事们是怎么评价你的？

    **回答：**

    准备一两句来自同事的评价。具体的陈述或转述都可以。Clarke 公司的同事比尔·史密总是说我是是他见过的最勤奋的人。这句话的力量应该像比尔本人在面试中说出来一样有说服力。


    ## 6: 你对这个组织了解多少？

    **回答：**

    这个问题是你在面试前需要对该组织进行研究的原因之一。研究公司的产品、规模、声誉、形象、目标、问题、管理风格、技能、历史和哲学。做到了解并表现出兴趣。了解他们过去在哪里，未来将走向哪里。目前的问题是什么？主要参与者是谁？


    ## 7: 在过去一年里你为提高知识做了哪些努力？

    **回答：**

    尝试包含与工作相关的改进活动。可以提到各种类型的活动作为积极的自我提升。准备几个好的例子以备提及。


    ## 8: 你在申请其他工作吗？

    **回答：**

    要诚实，但不要在这个问题上花费太多时间。将重点放在这份工作以及你能为这个组织做什么上。其他任何事情都是分心。


    ## 9: 你为什么想在这个组织工作？

    **回答：**

    这可能需要一些思考，并且显然基于你对该组织的研究。诚意在这里极其重要，而且很容易被察觉。将其与你的长期目标联系起来。永远不要谈论你想要的；先谈谈他们的需求。你想成为一家充满活力、不断发展的的公司的一部分。你可以为公司的特定目标做出明确的贡献。


    ## 10: 你认识在我们这里工作的人吗？

    **回答：**

    注意关于亲属在组织内工作的规定。尽管他们问及的是朋友而非亲属，这也会影响你的回答。只有当某个朋友评价很高时，才谨慎提到。


    ## 11: 你需要什么样的薪水？

    **回答：**

    一个陷阱问题！如果你先回答，可能会输掉这局糟糕的小游戏。所以，不要回答它。相反，说类似的话：“这是一个很难的问题。你能告诉我这个职位的薪资范围吗？”在大多数情况下，面试官会措手不及地告诉你范围。如果没有，就说这取决于工作的细节。然后给出一个宽泛。


    ## 12: 你有团队协作精神吗？

    **回答：**

    你当然有团队协作精神。确保准备好例子。展示你经常为了团队利益而非为了个人利益而表现的具体细节，是你团队态度的良好证明。不要吹嘘；只需用实事求是的语气说出来。这是一个关键点。


    ## 13: 如果被录用，你预计在我们这里工作多久？

    **回答：**

    在这里提供细节并不好。像这样的话比较有效：


    我希望能做很长时间。或者，只要我们都觉得我工作得很好。


    ## 14: 你曾经不得不解雇过任何人吗？你对此感觉如何？

    **回答：**

    这很严肃。不要轻视它，也不要任何方式表现出你喜欢开除人。同时，在认为这样做正确的时候你会这样做。当组织与造成有害局面的个人发生冲突时，你会保护组织。记住，解雇不等同于裁员或缩减人员。


    ## 15: 你的工作哲学是什么？

    **回答：**

    面试官在这里并不是在寻找长篇或华丽的论文。你是否强烈认为工作会被完成？是的。这是这里最有效的回答类型。保持简短且积极，展示对组织的益处。


    ## 16: 如果你现在有足够的钱退休，你会退休吗？

    **回答：**

    如果你愿意，就回答“是”。但由于你还需要工作，这是你偏好的工作类型。如果不是真心话，不要说“是”。


    ## 17: 你曾经被要求离开过某个职位吗？

    **回答：**

    如果你没有，就说“没有”。如果有，要诚实、简短，并避免对涉及的人员或组织说负面的话。


    ## 18: 请解释你将如何成为这个组织的财富。

    **回答：**

    你应该对这个问题充满期待。它给了你一个机会突出突出与所讨论职位相关的最佳优势。对这种关系做些提前思考。


    ## 19: 为什么我们应该聘用你？

    **回答：**

    指出你的优势如何满足组织的需求。还要提到你的知识、经验、能力和技能。永远不要提到其他候选人来进行比较。


    ## 20: 告诉我也你提过的一个建议。

    **回答：**

    准备一个好的例子。确保使用一个被采纳并被证明成功的建议。与所申请的工作类型相关的将是加分项。


    ## 21: 同事中什么事让你烦恼？

    **回答：**

    这是一个陷阱问题。努力思考，但要想不出任何让你烦恼的事情。一个看起来你和大家相处融洽的简短陈述非常好。


    ## 22: 你最大的优势是什么？

    **回答：**

    多个答案都可以，只需保持积极。几个好的例子：你的优先级排序能力、你的问题解决能力、你的压力工作能力、你的专注能力、你的专业知识、你的领导力、你积极的态度


    ## 23: 告诉我你的理想工作是什么，或者你在工作中寻找什么？

    **回答：**

    避开具体的职位。你赢不了。如果你说正在竞争的职位就是理想工作，会损害信誉。如果你说另一个职位才是理想工作，会种下你对这个职位不满的怀疑。最好的是泛泛地说，例如：我热爱工作、喜欢同事、可以做出贡献并且迫不及待开始的工作。


    ## 24: 你为什么认为自己在这个工作中会表现出色？

    **回答：**

    给出几个理由，包括技能、经验和兴趣。


    ## 25: 你觉得这个职位最吸引你的地方是（最不吸引你的地方）？

    **回答：**

    a) 列出一些吸引因素，例如该职位提供的责任以及与具有创新创造声誉的经验团队合作的机会。


    b) 说你需要更多信息和时间才能对任何不吸引方面做出判断。


    ## 26: 你拒绝和什么样的人合作？

    **回答：**

    不要太琐碎。只有对组织不忠诚、暴力或违法行为才会让你产生反对。微小的反对会给你贴上牢怨者的标签。


    ## 27: 对你来说，钱还是工作更重要？

    **回答：**

    钱总是重要的，但工作最重要。没有更好的答案了。


    ## 28: 你的之前的主管会认为你最强的点是什么？

    **回答：**


