    # Interview Questions and Answers


    The most often asked question in interviews. You need to have a short statement
    prepared in your mind. Keep your answer to one or two minutes. Don’t ramble. Be
    careful that it does not sound rehearsed. Limit it to work-related items unless
    instructed otherwise. Talk about things you have done and jobs you have held that
    relate to the position you are interviewing for. Start with the item farthest
    back and work up to the present (If you have a profile or personal statement(s)
    at the top of your CV use this as your starting point).


    ## 2: Why did you leave your last job?

    **Answer:**

    Stay positive regardless of the circumstances. Never refer to a major problem
    with management and never speak ill of supervisors, co-workers or the organization.
    If you do, you will be the one looking bad. Keep smiling and talk about leaving
    for a positive reason such as an opportunity, a chance to do something special
    or other forward- looking reasons.


    ## 3: What experience do you have in this field?

    **Answer:**

    Speak about specifics that relate to the position you are applying for. If you
    do not have specific experience, get as close as you can.


    ## 4: Do you consider yourself successful?

    **Answer:**

    You should always answer yes and briefly explain why. A good explanation is that
    you have set goals, and you have met some and are on track to achieve the others.


    ## 5: What do co-workers say about you?

    **Answer:**

    Be prepared with a quote or two from co-workers. Either a specific statement or
    a paraphrase will work. Bill Smith, a co-worker at Clarke Company, always said
    I was the hardest worker’s he had ever known. It should be as powerful as Bill
    having said it at the interview herself.


    ## 6: What do you know about this organization?

    **Answer:**

    This question is one reason to do some research on the organization before the
    interview. Research the company’s products, size, reputation, Image, goals, problems,
    management style, skills, History and philosophy. Be informed and interested.
    Find out where they have been and where they are going. What are the current issues
    and who are the major players?


    ## 7: What have you done to improve your knowledge in the last year?

    **Answer:**

    Try to include improvement activities that relate to the job. A wide variety of
    activities can be mentioned as positive self-improvement. Have some good ones
    handy to mention.


    ## 8: Are you applying for other jobs?

    **Answer:**

    Be honest but do not spend a lot of time in this area. Keep the focus on this
    job and what you can do for this organization. Anything else is a distraction.


    ## 9: Why do you want to work for this organization?

    **Answer:**

    This may take some thought and certainly, should be based on the research you
    have done on the organization. Sincerity is extremely important here and will
    easily be sensed. Relate it to your long-term career goals. Never talk about what
    you want; first talk about their Needs. You want to be part of an exciting forward-moving
    company. You can make a definite contribution to specific company goals.


    ## 10: Do you know anyone who works for us?

    **Answer:**

    Be aware of the policy on relatives working for the organization. This can affect
    your answer even though they asked about friends not relatives. Be careful to
    mention a friend only if they are well thought of.


    ## 11: What kind of salary do you need?

    **Answer:**

    A loaded question! A nasty little game that you will probably lose if you answer
    first. So, do not answer it. Instead, say something like, that’s a tough question.
    Can you tell me the range for this position? In most cases, the interviewer, taken
    off guard, will tell you. If not, say that it can depend on the details of the
    job. Then give a wide range.


    ## 12: Are you a team player?

    **Answer:**

    You are, of course, a team player. Be sure to have examples ready. Specifics that
    show you often perform for the good of the team rather than for yourself is good
    evidence of your team attitude. Do not brag; just say it in a matter-of-fact tone.
    This is a key point.


    ## 13: How long would you expect to work for us if hired?

    **Answer:**

    Specifics here are not good. Something like this should work:


    I''d like it to be a long time. Or As long as we both feel I''m doing a good job.


    ## 14: Have you ever had to fire anyone? How did you feel about that?

    **Answer:**

    This is serious. Do not make light of it or in any way seem like you like to fire
    people. At the same time, you will do it when it is the right thing to do. When
    it comes to the organization versus the individual who has created a harmful situation,
    you will protect the organization. Remember firing is not the same as layoff or
    reduction in force.


    ## 15: What is your philosophy towards work?

    **Answer:**

    The interviewer is not looking for a long or flowery dissertation here. Do you
    have strong feelings that the job gets done? Yes. That''s the type of answer that
    works best here. Keep it short and positive, showing a benefit to the organization.


    ## 16: If you had enough money to retire right now, would you?

    **Answer:**

    Answer yes if you would. But since you need to work, this is the type of work
    you prefer. Do not say yes if you do not mean it.


    ## 17: Have you ever been asked to leave a position?

    **Answer:**

    If you have not, say no. If you have, be honest, brief and avoid saying negative
    things about the people or organization involved.


    ## 18: Explain how you would be an asset to this organization.

    **Answer:**

    You should be anxious for this question. It gives you a chance to highlight your
    best points as they relate to the position being discussed. Give a little advance
    thought to this relationship.


    ## 19: Why should we hire you?

    **Answer:**

    Point out how your assets meet what the organization needs. Also mention about
    your knowledge, experience, abilities, and skills. Never mention any other candidates
    to make a comparison.


    ## 20: Tell me about a suggestion you have made.

    **Answer:**

    Have a good one ready. Be sure and use a suggestion that was accepted and was
    then considered successful. One related to the type of work applied for is a real
    plus.


    ## 21: What irritates you about co-workers?

    **Answer:**

    This is a trap question. Think real hard but fail to come up with anything that
    irritates you. A short statement that you seem to get along with folks is great.


    ## 22: What is your greatest strength?

    **Answer:**

    Numerous answers are good, just stay positive. A few good examples: Your ability
    to prioritize, Your problem-solving skills, Your ability to work under pressure,
    Your ability to focus on projects, Your professional expertise, Your leadership
    skills, Your positive attitude


    ## 23: Tell me about your dream job or what are you looking for in a job?

    **Answer:**

    Stay away from a specific job. You cannot win. If you say the job you are contending
    for is it, you strain credibility. If you say another job is it, you plant the
    suspicion that you will be dissatisfied with this position. The best is to stay
    genetic and say something like: A job where I love the work, like the people,
    can contribute and can''t wait to get to.


    ## 24: Why do you think you would do well at this job?

    **Answer:**

    Give several reasons and include skills, experience and interest.


    ## 25: What do you find the most attractive about this position (Least attractive)?

    **Answer:**

    a) List a couple of attractive factors such as the responsibility the post offers
    and the opportunity to work with experienced teams that have a reputation for
    innovation and creativity.


    b) Say you’d need more information and time before being able to make a judgment
    on any unattractive aspects.


    ## 26: What kind of person would you refuse to work with?

    **Answer:**

    Do not be trivial. It would take disloyalty to the organization, violence or lawbreaking
    to get you to object. Minor objections will label you as a whiner.


    ## 27: What is more important to you: the money or the work?

    **Answer:**

    Money is always important, but the work is the most important. There is no better
    answer.


    ## 28: What would your previous supervisor say your strongest point is?

    **Answer:**

