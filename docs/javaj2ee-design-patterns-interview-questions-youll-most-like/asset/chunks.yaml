    19: What does the getStepCount() Method do in Design Patterns?


    Answer:


    This Method is used as an operation in the ProcessComponent class to count the
    number of steps needed in a process flow; it has to count each step only once
    and to not enter an infinite loop when a process contains a cycle.


    20: What is the danger of Modeling Composites in Design Patterns?


    Answer:


    Because Modeling Composites usually leads to recursive definition of Methods on
    composite nodes, a danger exists of writing code that may produce an infinite
    loop.


    21: What is an Abstraction in Design Patterns?


    Answer:


    Abstraction represents a class that relies on a set of purely abstract operations,
    where several implementations of the set of abstractions are possible.


    22: How can we create a Bridge in Design Patterns?


    Answer:


    A Bridge can be created by moving the set of abstract operations to an interface
    so that an abstraction will depend on an implementation of the interface; its
    intent is mainly to decouple an abstraction from the implement-tations of its
    abstract operations.


    23: What is a Driver in Design Patterns?


    Answer:


    A Driver is an instance of the adapter Pattern and it’s an object that operates
    on a computer system or an external device according to a well specified interface.


    24: Why is UML used for Design Patterns?


    Answer:


    UML is an application modeling specification from OMG that simplifies the complex
    software engineering process.


    25: How many diagrams does UML offer for classification in Design Patterns?


    Answer:


    UML offers 12 diagrams that represent an application’s requirements analysis and
    solution design.


    26: How many structure diagrams does UML provide?


    Answer:


    UML provides 4 structure diagrams that are used to represent a static structure
    of an application. They are:


    a. Class,


    b. Object,


    c. Component and


    d. Deployment Diagrams.


    27: How many Behavior Diagrams does UML provide?


    Answer:


    UML provides 5 Behavior Diagrams used to represent the dynamic behavioral aspects
    of an application. They are:


    a. Use case,


    b. Sequence,


    c. Activity,


    d. Collaboration and


    e. Statechart.


    28: How many Model Management diagrams does UML provide?


    Answer:


    UML provide 3 Management Diagrams which can be used to represent how different
    application modules are organized and managed. They are:


    a. Packages,


    b. Subsystems and


    c. Models diagrams.


    29: What are Class Diagrams?


    Answer:


    Class Diagrams are used to describe a static structure of any given system, where
    the structure and behavior of classes and their association with other classes
    are depicted inside of a class diagram.


    30: What is an Inner Class?


    Answer:


    An Inner Class is a class that is simply defined inside another class with the
    concept of an inner class existing in object oriented languages like Java, C++and
    C#.


    31: What is the Generalization Method used for in Design Patterns?


    Answer:


    Generalization is mainly used to depict the Object Oriented Concept of Inheritance
    when there is a base class with common behavior and each of its derived classes
    contains specific details.


    32: What is an Interface in Design Patterns?


    Answer:


    An Interface is used to specify the externally visible operations of a class and
    not the actual implementations of those operations; it also most of the times
    specifies only a part of the behavior of an actual implementer class.


    33: What is Realization in Design Patterns?


    Answer:


    Realization is used to show the relationship between an interface and a class
    that provides the actual implementation and it can be drawn in two ways depending
    on how the interface is depicted.


    34: What is Dependency in Design Patterns?


    Answer:


    Dependency is used to show the relationship between a source and a target component
    when there is a dependency between relations between the two.


    35: What is Multiplicity in Design Patterns?


    Answer:


    Multiplicity is used to indicate the number of instances of one class linked to
    one instance of the other class, with


    different values used to indicate the Multiplicity.


    36: What is a Message in Design Patterns?


    Answer:


    A Message simply puts communication between two objects with the horizontal line
    indicating a message that can be labeled with the name of the operation along
    with its argument values.


    37: Why are Private Methods used for in Design Patterns?


    Answer:


    Private Methods are used to provide means of designing class behaviors so that
    external objects are not permitted to access the behavior that is meant only for
    an internal use.


    *****


    [Methods and Objects](#tmp_f353b6c4930e82b6df695a2b6a8bbd14_uEhiwq.ch.fixed.fc.tidied.stylehacked.xfixed_split_003.html_TOC)


    38: Why is Accessor Method used in Design Patterns?


    Answer:


    Accessor Methods provide means of accessing an object’s state using specific Methods
    by discouraging different client objects from directly accessing the attributes
    of an object.


    39: What is an Immutable Object used for in Design Patterns?


    Answer:


    An Immutable Object is mainly used to ensure that the state of an object cannot
    be changed and that the concurrent access to a data object by several client objects
    does not result in race conditions.


    40: What does the Monitor Function do in Design Patterns?


    Answer:


    The Monitor Function is a way of designing an application object so that it does
    not produce unpredictable results when more than one thread tries to access the
    object at the same time.


    41: What is a Singleton in Design Patterns?


    Answer:


    A Singleton represents the way of finding the responsible object needed for a
    particular responsibility on which other objects rely such as coordinating work
    or modulation of the overall state of a system


    42: What does the getFactory() Method do?


    Answer:


    The getFactory() Method is used to ensure that if a second thread begins to lazy
    initialize the singleton after another thread has begun the same initialization,
    the second thread will wait to obtain the class lock object’s monitor.


    43: What is the use of the Observer Pattern?


    Answer:


    The Observer Pattern is used to define a one-to-many dependency between objects.
    For example, when one object results in a state change, then all the dependents
    are notified and also automatically updated.


    44: What does MVC stand for and what does it refer to?


    Answer:


    MVC stands for Model/View/Controller and it refers to separating an interesting
    object, which is the model, from GUI elements that are portraying it, which are
    the view and the controller.


    45: What is a Layer in Design Patterns?


    Answer:


    A Layer is a group of classes that have similar response-bilities and are most
    of the times collected in a single unified Java package; higher layers depend
    only on classes in equal or lower layers.


    46: How can a class observe a subclass in Design Patterns?


    Answer:


    A Class can be maintained by providing the class that the developer chooses with
    an observable object and have the class forward key Methods call it.


    47: What does the PropertyChangeSupport class do?


    Answer:


    This class is similar to the Observer class but it is also part of the java.beans
    package. It is used to allow interested observers to register for notification
    of changes in the property of labels and other GUI components.


