    106: What are the characteristics of a Proxy Object?


    Answer:


    A Proxy Object is an intermediary between a client object and the target object.
    It receives calls from a client object and forwards them to the target object.


    107: What is the difference between Proxy and Decorator?


    Answer:


    The Proxy client object cannot access the target object directly. The Decorator
    client object does have the ability to access the target object directly (if needed).


    A Proxy object provides access control to the target object; the Decorator object
    does not control access to the target object.


    108: What about the functionality added to an object by Proxy and Decorator object?


    Answer:


    A Proxy object does not add any additional functionality, but the Decorator adds
    additional functionality to an object.


    109: What does a Remote Proxy do?


    Answer:


    The Remote Proxy is used to provide access to an object located in a different
    address space.


    110: What does a Virtual Proxy do?


    Answer:


    A Virtual Proxy is used to provide the required function-ality to allow the on-demand
    creation of a memory intensive object (unless required).


    111: What does a Cache Proxy/Server Proxy do?


    Answer:


    These two kinds are used to provide the functionality required to store the results
    of most frequently used target operations. The Proxy Objects stores these results
    in some kind of repository. When a Client Object requests the same operation,
    the proxy returns the operation results from the storage area without actually
    accessing the target object.


