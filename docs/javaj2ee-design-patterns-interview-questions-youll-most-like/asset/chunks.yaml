    \ 29: 请告诉我你与上级发生过的矛盾。\n\n**回答：**\n\n最大的陷阱！这是为了测试你是否会背后中伤老板。如果你中招了并讲述了与前任老板的问题，你很可能在现场就失去机会。保持积极的态度，并对与上级的任何麻烦产生“选择性记忆”。\n\
    \n### 30: 工作中有什么让你感到失望的吗？\n\n**回答：**\n\n不要表现得琐碎或负面。安全的回答范围很少，但包括：\n\n- 挑战性不足。你因为裁员被解雇；公司没有获得某项合同，而该合同本可以给你更多的责任。\n\
    \n### 31: 请告诉我你在压力下工作的能力。\n\n**回答：**\n\n你可以说你在某些类型的压力下表现出色。举一个与申请的职位类型相关的例子。\n\
    \n### 32: 你的技能与这份工作还是其他工作更契合？\n\n**回答：**\n\n可能是这一个！不要助长对方认为你可能比这份工作更想要其他职位的怀疑。\n\
    \n### 33: 是什么激励你在工作中尽全力？\n\n**回答：**\n\n这是一个只有你才能回答的个人特质，但很好的例子有：挑战、成就感和认可。\n\n\
    ### 34: 你愿意加班吗？晚班吗？周末吗？\n\n**回答：**\n\n这取决于你。要完全诚实。\n\n### 35: 你如何知道自己在这份工作中取得了成功？\n\
    \n**回答：**\n\n几种方法是很好的衡量标准：\n\n- 你给自己设定了高标准并达到了它们。你的成果是成功的。你的老板告诉你你很成功，并且做得非常好。\n\
    \n### 36: 如果需要，你愿意搬迁吗？\n\n**回答：**\n\n如果你认为有可能会出现这个问题，在面试之前你应该先和家人谈清楚。不要为了得到工作就说是，如果真实答案是否定的。这会在你职业生涯后期产生很多问题。在这个阶段要保持诚实，这将为你免除未来的苦恼。\n\
    \n### 37: 你愿意将组织的利益放在你个人利益之上吗？\n\n**回答：**\n\n这是一个关于忠诚和奉献的直接问题。不要担心深层的伦理和哲学含义。直接说是即可。\n\
    \n### 38: 描述你的管理风格。\n\n**回答：**\n\n尽量避免使用标签。一些常见的标签，如进步型、销售型或共识型，根据你听哪位管理专家的意见，可能有多种含义或描述。情境化风格是安全的，因为它表示你会根据情况进行管理，而不是一刀切的方法。\n\
    \n### 39: 你从工作中的错误中学学会了什么？\n\n**回答：**\n\n在这里你必须编些什么，否则会损害信誉。让错误变得微小的、意图良好的，并带有积极的教训。例如，在某个项目中工作得比同事超前太多，导致协调出现问题。\n\
    \n### 40: 你有任何盲点吗？\n\n**回答：**\n\n陷阱题！如果你知道自己的盲点，那它们就不再是盲点了。在这里不要透露任何个人关注的领域。让他们自己去发现你的缺点。不要主动把题目交给他们。\n\
    \n### 41: 如果你要为这份工作招聘某人，你会寻找什么？\n\n**回答：**\n\n小心提到职位所需的特质以及你具备的特质。\n\n### 42:\
    \ 你认为你对这个职位来说资历吗？\n\n**回答：**\n\n无论你的资历如何，说明你非常适合你面试的这个职位。\n\n### 43: 你打算如何弥补经验的不足？\n\
    \n**回答：**\n\n首先，如果你有面试官不知道的经验，提出来；然后指出（如果是事实的话）你是一个勤奋且学习能力强的人。\n\n### 44: 你希望老板具备什么样的特质？\n\
    \n**回答：**\n\n回答要通用且积极。安全的特质包括知识渊博、幽默感、公平、对下属忠诚以及拥有高标准。所有的老板都认为自己具备这些特质。\n\n###\
    \ 45: 告诉我你曾帮助解决他人纠纷的经历。\n\n**回答：**\n\n选一个具体的事件。专注于你的解决问题技巧，而不是你解决的纠纷本身。\n\n###\
    \ 46: 在负责项目的团队中，你倾向于什么职位？\n\n**回答：**\n\n诚实。如果你在不同的角色中都感到自在，请指出这一点。\n\n### 47:\
    \ 描述你的工作伦理。\n\n**回答：**\n\n强调对组织的益处。诸如决心完成工作、努力工作但热爱你的工作都是很好的回答。\n\n### 48: 你职业生涯上最大的遗憾是什么？\n\
    \n**回答：**\n\n确保你提到的某件事是你无法控制的。表现出接受的态度，且没有负面情绪。\n\n### 49: 告诉我你在工作中过的最开心的时刻。\n\
    \n**回答：**\n\n谈谈为组织完成某项任务而带来的快乐。\n\n### 50: 你能为我们做什么？（你能为你做哪些别人做不到的事？）\n\na) 描述过去为前任雇主工作时的成功经验。\n\
    b) 谈谈你的新视角以及你能为公司带来的相关经验。\nc) 突出你提供创造性、可行解决方案的记录。\n\n### 51: 你对我有什么想问的吗？\n\n**回答：**\n\
    \n始终要准备一些问题。准备那些能让你成为组织资产的问题是好的。我多久能开始发挥作用？我能协助哪些类型的项目？\n\n最后，祝你好运！\n\n***\n\n\
    ## 索引\n\n## Java/JEE 设计模式\n\n 设计模式导言\n\n### 1: 什么是设计模式？\n\n### 2: 什么是类接口？\n\n\
    ### 3: 什么是类实现？\n\n### 4: 什么是构造 (Construct)？\n\n### 5: 什么是存根 (Stub)？\n\n### 6:\
    \ 什么是常量 (Constant)？\n\n### 7: 设计模式的目的是？\n\n### 8: 什么是适配器 (Adapter)？\n\n### 9:\
    \ 什么是度量维度？\n\n### 10: `times()` 有什么作用？\n\n### 11: 什么是抽象类 (Abstract class)?\n\n\
    ### 12: JDK 代表什么？\n\n### 13: `JTable` 有什么作用？\n\n### 14: 什么是外观 (Façade)？\n\n###\
    \ 15: 什么是演示 (Demo)？\n\n### 16: 什么是组合模式 (Composite)？\n\n### 17: 组合模式的目的是？\n\n###\
    \ 18: 什么是有向图？\n\n### 19: `stepCount()` 有什么作用？\n\n### 20: 组合模式的风险是什么？\n\n### 21:\
    \ 什么是抽象 (Abstraction)？\n\n### 22: 如何创建桥接 (Bridge)？\n\n### 23: 什么是驱动程序 (Driver)？\n\
    \n### 24: 为什么要用 UML 设计模式？\n\n### 25: UML 有多少种分类图？\n\n### 26: UML 有多少种结构图？\n\n\
    ### 27: UML 有多少种行为图？\n\n### 28: UML 有多少种模型图？\n\n### 29: 什么是类图？\n\n### 30: 什么是内部类\
    \ (Inner Class)？\n\n### 31: 泛化方法在设计模式中有什么用？\n\n### 32: 设计模式中的接口 (Interface) 是什么？\n\
    \n### 33: 设计模式中的实现 (Realization) 是什么？\n\n### 34: 设计模式中的依赖（Dependency）是什么？\n\n\
    ### 35: 多重性是什么？\n\n### 36: 设计模式中的消息 (Message) 是什么？\n\n### 37: 私有方法在设计模式中有什么用？\n\
    \n## 方法与对象\n\n### 38: 访问方法 (Accessor Method) 在设计模式中有什么用？\n\n### 39: 不变对象 (Immutable\
    \ Object) 在设计模式中有什么用？\n\n### 40: 监器函数 (Monitor Function) 在设计模式中作用什么？\n\n### 41:\
    \ 单例模式 (Singleton) 是什么？\n\n### 42: `getFactory()` 有什么作用？\n\n### 43: 观察者模式 (Observer\
    \ Pattern) 的用途是？\n\n### 44: MVC 代表什么？它指代什么？\n\n### 45: 设计模式中的层 (Layer) 是什么？\n\n\
    ### 46: 类在设计模式中如何观察子类？\n\n### 47: `PropertyChangeSupport` 类的作用是什么？\n\n## 模式与对象\n\
    \n### 48: 中介者模式 (Mediator Pattern) 有什么作用？\n\n"
