    The `Term Signature` applies when discussing the rules that govern how Java matches
    a call to a `Method` in the receiving object.


    ### 82: What does a Method Declaration in Java include?

    Answer:

    A `Method Declaration` in Java includes the header and the body, with the body
    being a series of instructions that are called in action by invoking the `Method`’s
    signature and the header including the `Method` return type and the modifiers.


    ### 83: What does the Sorting Method do?

    Answer:

    The `Sorting Method` has different algorithms used, but most of the times the
    developer can choose only one to sort various collections of objects.


    ### 84: What is a Hook Method?

    Answer:

    A `Hook` is a `Method` call that the developer places in his code to give other
    developers a way and a chance to insert code at a specific spot in a procedure.


    ### 85: What is a Template Method?

    Answer:

    The `Template Method` functions as a contract between developers, where a developer
    may supply an algorithm and another developer may supply a certain step of an
    algorithm.


    ### 86: What is a State of an object?

    Answer:

    The `State` of an object is a combination of the current values of the object’s
    attributes; it is usually a prominent aspect of the object’s behavior.


    ### 87: How can Transition between States be handled?

    Answer:

    `Transition between States` can be handled by having the developer allow for the
    states to retain a context reference that contains a set of states.


    ### 88: What does the State Pattern do?

    Answer:

    The `State Pattern` is sued for code simplification by distributing an operation
    across a collection of classes that represent an object’s various states.


    ### 89: What is a Strategy?

    Answer:

    A `Strategy` is a plan or approach, similar to an algorithm that pursues an output
    given a set of inputs.


    ### 90: What is the use of a Strategy Pattern?

    Answer:

    A `Strategy Pattern` is used to encapsulate alternative strategies in different
    classes that in turn implement a common operation; this results in a clean and
    simple code.


    ***


    ### 91: What does the Command Pattern do?

    Answer:

    The `Command Pattern` is used to establish the signature of a `Method`, most of
    the time with the `execute()` or `perform()` Methods; it also allows for defining
    different implement-tations of an interface.


    ### 92: What does an Interpreter Pattern do?

    Answer:

    An `Interpreter Pattern` is used to distribute an operation across a collection
    of classes, just like the state and strategy patterns would.


    ### 93: What is the use of an interpreter object?

    Answer:

    An `Interpreter Object` is used to run the execution of a collection of rules,
    allowing the developer to build expression evaluators and command languages.


    ### 94: What does a Parser Object do?

    Answer:

    A `Parser` is an `Object` used to recognize text and take apart its structure
    according to a set of rules into a form suitable for further processing.


    ### 95: What is an Extension in Design Patterns?

    Answer:

    An `Extension` represents the addition of a class, an interface and/or `Method`
    to an already existing code base; the main way to extend code is to write a new
    class or extend a certain class through delegation.


    ### 96: When does Extension through Delegation occur?

    Answer:

    This process takes place when a class has `Methods` that forward calls to identical
    operations that are supplied by another object; this process makes available the
    behavior of the forwarded class on the class that the developer wishes to extend.


    ### 97: What is the purpose of a Decorator Pattern?

    Answer:

    A `Decorator Pattern` is used to allow the developer to compose an object’s behavior
    dynamically by combining polymorphism with delegation, which results in the extension
    of an object’s behavior.


    ### 98: What is a Stream in Design Patterns?

    Answer:

    A `Stream` is a serial collection of bytes of characters like those that appear
    in a document; in Java each stream object most of the time contains another stream
    object to which it forwards its operations.


    ### 99: What does the next() Method do in Design Patterns?

    Answer:

    The `next()` Method is used to check if a certain value is loaded and then checks
    if it has reported the interior node of the composite that is traversed.


    ### 100: How is Iteration achieved in a Multi Thread Application?

    Answer:

    This can be achieved by synchronization of the monitor on a mute object, the developer
    can then block all access while iterating or block access for a short period of
    time to make a clone of the collection.


    ### 101: What is Façade Pattern used for?

    Answer:

    The `Façade Pattern` deals with a subsystem of classes. A subsystem of classes
    consists of a set of classes that work in conjunction with each other for the
    purpose of providing a set of related features (functionality).


    ### 102: What is the meaning of a subsystem in real world applications?

    Answer:

    In real world applications, a subsystem could comprise of a large number of classes.
    Clients of a subsystem may need to interact with a number of subsystems classes
    for their needs. This kind of direct interaction of clients with subsystems classes
    leads to a high degree of coupling between the client’s objects and the system.
    Whenever a subsystem class undergoes a change, such as change in its interface,
    all of its dependent client classes may get affected.


    ### 103: Main advantage of the Façade Pattern?

    Answer:

    The `Façade Pattern` provides a higher level, simplified interface for a subsystem
    resulting in reduced complexity and dependency. This in turn makes the subsystem
    usage easier and more manageable.


    ### 104: What provides the Façade Pattern?

    Answer:

    The `Façade Pattern` provides a simplified interface for a subsystem to be used
    by clients. With a Façade object in place, clients interact with the Façade object
    instead. The Façade object takes up the responsibility of interacting with subsystem
    classes.


    ### 105: What should you know when applying the Façade Pattern?

    Answer:

    A Façade should not be designed to provide any additional functionality. Also
    one should never return subsystem components from Façade Methods.


    ***


    ### 106: What are the characteristics of a Proxy Object?

    Answer:

    A `Proxy Object` is an intermediary between a client object and the target object.
    It receives calls from a client object and forwards them to the target object.


    ### 107: What is the difference between Proxy and Decorator?

    Answer:

    The Proxy client object cannot access the target object directly. The Decorator
    client object does have the ability to access the target object directly (if needed).


    A Proxy object provides access control to the target object; the `Decorator` object
    does not control access to the target object.


    ### 108: What about the functionality added to an object by Proxy and Decorator
    object?

    Answer:

    A Proxy object does not add any additional functionality, but the `Decorator`
    adds additional functionality to an object.


    ### 109: What does a Remote Proxy do?

    Answer:

    The `Remote Proxy` is used to provide access to an object located in a different
    address space.


    ### 110: What does a Virtual Proxy do?

    Answer:

    A `Virtual Proxy` is used to provide the required function-ality to allow the
    on-demand creation of a memory intensive object (unless required).


    ### 111: What does a Cache Proxy/Server Proxy do?

    Answer:

    These two kinds are used to provide the functionality required to store the results
    of most frequently used target operations. The Proxy Objects stores these results
    in some kind of repository. When a Client Object requests the same operation,
    the proxy returns the operation results from the storage area without actually
    accessing the target object.


