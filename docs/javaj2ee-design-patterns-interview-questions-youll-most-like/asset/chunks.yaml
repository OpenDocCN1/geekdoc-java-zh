    ### 175: 将算法转换为单个方法的第二步是什么？


    答案：

    第二步是拥有的一个 `template` 类，该类可以作为一组非抽象的 `Methods` 来实现算法中不变的部分。


    ### 176: 将算法转换为单个方法的第三步是什么？


    答案：

    第三步是拥有一组步步骤，这些步骤可以被设计为具有默认实现的非抽象 `Methods`，其中 `Template` 类的 `Subclasses` 可以重写这些
    `Methods` 以提供具体的实现。


    ### 177: 请举几个创建型模式（Creational Patterns）的示例以及它们的作用。


    答案：

    创建型模式的一些示例包括：


    a. `Abstract Factory`（抽象工厂：创建多个族类的实例）；

    b. `Builder`（构建器：将对象的构建过程与其表示分离）；

    c. `Prototype`（原型模式：一个待复制或克隆的完全初始实例）；

    d. `Singleton`（单例模式：只能存在一个实例的类）；

    e. `Factory Method`（工厂方法：创建一个用于复制或克隆的实例）


    ### 178: 请举几个结构型模式（Structural Patterns）的示例以及它们的作用。


    答案：

    结构型模式的一些示例包括：


    a. `Adapter`（适配器：匹配不同类的接口）；

    b. `Composite`（组合器：具有简单对象和组合对象组成的树形结构）；

    c. `Decorator`（装饰器：动态地给对象添加职责）；

    d. `Proxy`（代理：代表另一个对象的对象）；

    e. `Bridge`（桥接：将对象的抽象与其实现分离开）。


    ### 179: 请举几个行为型模式（Behavioral Patterns）的示例以及它们如何使用。


    答案：

    最常见的行为型模式有：


    a. `Iterator`（迭代器：允许顺序访问集合中的元素）；

    b. `Chain of Responsibilities`（责任链：一种在对象链之间传递请求的方式）；

    c. `Observer`（观察者模式：将命令请求封装成一个对象）；

    d. `Mediator`（中者模式：定义类与类之间简化的通信）。


    ### 180: 如何编写线程安全的单例？


    答案：

    编写线程安全的单例的方法非常简单。它必须被声明为一个 `Boolean` 变量（用于保持类实例化的状态），一个 `Object` 类对象，以及一个初始值为
    `null` 的同类变量。


    ### 181: 什么是反设计模式（Anti-Design Pattern）？


    答案：

    `Anti-Design Pattern` 是对常见软件问题设计的解决方案，起初看起来是有益的，但结果产生的坏处大于了优点。


    ### 182: 临界区模式（Critical Section Pattern）的作用是什么？


    答案：

    该模式是 `Monitor` 的更严格的形式，用于在类级别锁定代码，以防止多个线程即使在同一类的两个不同实例上执行被锁定的代码。


    ### 183: 一致锁顺序模式（Consistent Lock Order Pattern）的目的是什么？


    答案：

    该模式用于识别并记录一个定义良好的对象锁定顺序，在应用程序设计过程中始终一致遵循该顺序，以消除死锁的可能性。


    ### 184: 守卫挂起模式（Guarded Suspension Pattern）的作用是什么？


    答案：

    该模式建议设计一种 `Method`，使其挂起执行，直到对象处于使所需的先决条件为真的状态。


    ### 185: 读写锁模式（Read Write Lock Pattern）的作用是什么？


    答案：

    该模式允许同时进行读操作，同时防止对应用程序资源的值进行同步更新，以提高应用程序的响应能力。


    ### 186: 外外观模式（Façade Pattern）的使用是如何合理的？


    答案：

    每当抽象的实现类与客户端之间的依赖变得复杂足以解耦子系统时，`Façade Pattern` 的使用就是合理的。


    ### 187: 临界区（Critical Section）是指什么？


    答案：

    `Critical Section` 是一段代码，在任何给定时间内必须不惜代价仅由一个线程执行，才能产生预期的结果。


    ### 188: 读锁（Read Lock）规则是什么？


    答案：

    只有在当前没有发布 `Write Lock` 且没有线程在等待 `Write Lock` 时，才会发布 `Read Lock` 规则。


    ### 189: 写锁（Write Lock）的规则是什么？


    答案：

    `Write Lock` 规则规定，如果当前没有线程对该对象发布锁，则应该发布写锁。


    ### 190: 原型模式中深拷贝和浅拷贝的区别是什么？


    答案：

    在 `Shallow Copy`（浅拷贝）中，只克隆对象本身，其中包含任何对象都不会被克隆。使用 `Shallow Copy` 时，指针将在副本和原始对象之间共享。


    在 `Deep Copy`（深拷贝）的情况下，父对象及其包含的对象一起被克隆。在 `Deep Copy` 中，新对象是独立的，因为它引用了自己的变量，而该变量是原始变量的拷贝。


    ### 191: ReadWriteLock 提供了多少方法？


    答案：

    `ReadWriteLock` 提供两个 `Methods`，它们是：


    a. `getReadLock` 和

    b. `getWriteLock`，


    这些方法可以被客户端对象用于获取某个对象的读锁和写锁。


    ### 192: 什么是 Done 方法？


    答案：

    当持有读写锁的客户端对象可以通过调用 `Done Method` 来释放锁时，就会产生 `Done Method`。


    ### 193: 如何记录设计模式？


    答案：记录设计模式的最佳方法是给出模式名称、描述问题以及目标和约束、列出参与的类、对象及其结构、说明模式在上下文中的应用以及协作职责。


    ### 194: DAO 设计模式的作用是什么？


    答案：

    `DAO Design Pattern` 抽象了底层的数据访问结构，并提供了一个通过少量更改访问数据的接口。


    ### 195: CVS 代表什么？


    答案：

    `CVS` 代表 `Concurrent Versions`（并发版本系统）。它是一个服务器系统，可以跟踪一组文件的所有工作和更改，并允许在空间或时间上分离的开发者进行协作。


    ### 196: Java 中哪些常用的模式？


    答案：

    Java 中常用的设计模式有：


    a. `Model-view-controller`（模型-视图控制器）、

    b. `Prototype`（原型模式）、

    c. `Iterator`（迭代器）、

    d. `Proxy`（代理模式）、

    e. `Abstract Factory`（抽象工厂）以及

    f. `Observer`（观察者模式）。


    ### 197: 定义一个接口让子类（或辅助类）决定实例化哪个类。


    答案：

    这用于 EJB 创建模型。`EJBHome` 定义了创建 `EJBObject` 实现的接口。它们实际上是由生成的容器类创建的。参见 `InitialContextFactory`
    接口，它根据属性表返回 `InitialContext`。


    ### 198: Enterprise JavaBeans 使用哪些模式？


    答案：

    Sun 在设计 Enterprise JavaBeans 时使用的模式有：


    a. `Factory Method`、

    b. `Singleton`、

    c. `Abstract Factory`、

    d. `Builder`、

    e. `Adapter`、

    f. `Proxy` 以及

    g. `Memento`。


