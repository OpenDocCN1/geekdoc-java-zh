    `Mediator Pattern`（中者模式）用于定义一个对象，通过封装一组对象之间的交互方式，防止对象之间进行显式的相互引用，同时也允许开发者独立地改变它们的交互方式。


    ## 49. 代理模式（Proxy Pattern）的作用是什么？

    答案：`Proxy Pattern`（代理模式）用于建立一个占位对象来管理对目标对象的访问。


    ## 50. 什么是代理对象（Proxy Object）？

    答案：`Proxy Object`（代理对象）是一个用于隔离客户端与目标对象状态变化的对象，例如当加载图像会导致明显的持续时间时。


    ## 51. 责任链模式（Chain of Responsibility Pattern）的作用是什么？

    答案：`Chain of Responsibility Pattern`（责任链模式）主要用于通过赋予多个对象处理请求的机会，来避免请求发送者与其接收者之间的耦合。


    ## 52. 责任链中发生了什么？

    答案：在`Chain of Responsibility`（责任链）中，一个对象模型承担了寻找哪个对象可以并且满足客户端请求的任务；这种直接的方法超越了 `Java`
    内置的两种查找机制：

    a. `Method` 查找和

    b. `exception handling`（异常处理）。


    ## 53. 在设计模式中抛出异常（Exception）会发生什么？

    答案：当抛出 `Exception` 时，`Java Interpreter` 会回溯调用栈，寻找从 `try/catch` 语句封装的块中调用的 `Method`。如果该
    `try/catch` 语句没有捕获抛出的类型 `Exception`，`Java Interpreter` 将继续查找。这可以一直传播到 `main()`
    `Method`。如果异常在在那里没有被处理，`Java Interpreter` 将打印错误信息和堆栈跟踪，然后退出。


    ## 54. 设计模式中的方法查找（Method Lookup）的作用是什么？

    答案：`Method Lookup`（方法查找）被用作算法，在客户端调用对象的 `Method` 时决定使用哪个 `Method` 的定义。


    ## 55. 设计模式中的重量级模式（Flyweight Pattern）用于什么？

    答案：`Flyweight Pattern`（重量级模式）用于处理共享，依赖于对象能够负责多个客户端的能力，在这种情况下，普通对象不需要过度担心共享责任。


    ## 56. 如何识别重量级（Flyweight）？

    答案：这可以通过让类拥有一个除构造函数以外的返回必须共享对象的 `Method` 来。


    ## 57. Java 中最常见的不可变对象（Immutable objects）有哪些？

    答案：`Java` 中最常见的 `Immutable` 对象是 `string` 类的实例，一旦字符串创建，开发者或客户端都无法更改其字符。


    ## 58. 什么是构造方法（Constructor Methods）？

    答案：`Constructor Methods` 与任何其他 `Methods` 相似，但 `Java` 有不同的规则专门规定构造方法的使用，特别是那些具有相互工作特殊能力的方法构造方法。


    ## 59. 什么是 Java 构造方法？

    答案：`Java Constructor Methods`（Java 构造方法）是受许多语义和语法规则约束的特殊 `Methods` 使用这些规则是因为它们与
    `Java` 中的其他对象不同。


    ## 60. Java 中的超类（Superclasses）是什么？

    答案：当一个类没有声明构造方法且 `Java` 必须默认提供一个时，就会产生 `Superclasses`；如果构造函数的第一个语句不是对另一个构造的特定调用，那么
    `Java` 会插入对 `super()` `Method` 的调用。


    ## 61. 如何在 Java 中避免对 super() 方法的调用？

    答案：这可以通过显式地调用超类构造方法，或者通过调用 `this()` `Method` 调用当前类的构造方法来实现。


    ## 62. 面向构造的模式（Construction Oriented Patterns）用于什么？

    答案：`Construction Oriented Patterns`（面向构造的模式）是允许客户端通过调用类构造函数之外的不同手段构建新对象的设计。


    ## 63. 设计模式中的建造者模式（Builder Pattern）用于什么？

    答案：`Builder Pattern`（建造者模式）用于将对象的构建逻辑移到实例化类之外；这样做是为了减小具有许多 `Methods` 的类的大小，或者允许对目标对象进行逐步构建。


    ## 64. 工厂方法模式（Factory Method Pattern）用于什么？

    答案：`Factory Method Pattern`（工厂方法模式）用于让类开发者定义创建对象的接口，同时保留对实例化哪个类的控制权。


    ## 65. 如何在设计模式中识别工厂方法（Factory Method）正在工作？

    答案：为了查看 `Factory Method` 是否工作，开发者必须检查该操作是否创建了一个新对象，然后返回一个接口类型，并且该类型被多个类实现。


    ## 66. 迭代器模式（Iterator Pattern）的作用是什么？

    答案：`Iterator Pattern`（迭代器模式）主要用于提供一种顺序访问集合元素的方法。


    ## 67. iterator() 方法用于什么？

    答案：`iterator()` `Methods` 主要是 `factory Method` 模式的一部分，用于创建一个返回集合元素序列的对象。


    ## 68. 设计模式中的并行层次结构（Parallel Hierarchy）是什么？

    答案：`Parallel Hierarchy`（并行层次结构）是一对类层次结构，其中一个层次结构中的类在另一个层次结构中都有一个对应的类。


    ## 69. 抽象工厂模式（Abstract Factory Pattern）用于什么？

    答案：`Abstract Factory Pattern`（抽象工厂模式）大多数时候用于提供一组相关或依赖对象的创建。


    ## 70. 原型模式（Prototype Pattern）用于什么？

    答案：`Prototype Pattern`（原型模式）用于允许客户端通过复制对象来创建新对象，这种复制通常包含原始对象的部分。


    ## 71. 设计模式中的备备（Memento）是什么？

    答案：`Memento`（备备）是一个保存对象状态并提供对象状态恢复的小仓库。


    ## 72. 在设计模式中如何创建 Memento？

    答案：`Memento` 可以通过使用另一个对象、字符串或文件来创建，这对存储与重建对象之间的预期持续有影响。


    ## 73. 什么是持久化存储（Persistent Storage）？

    答案：`Persistent Storage`（持久化存储）用于实现 `Memento Pattern` 的意图，它是开发者实现的撤销功能的自然扩展。


    ## 74. 对象序列化（Object Serialization）的作用是什么？

    答案：`Object Serialization`（对象序列化）用于为 `Memento` 提供跨多个会话的简单方法；例如在特定的周内。


    ## 75. java.io 包的作用是什么？

    答案：`java.io` 包用于在自序列以来发生变化时提供对象反序列化的支持。


    ## 76. 如何实现对象的持久化存储（Persistent Storage）？

    答案：对象的 `Persistent Storage` 可以通过编写其文本描述以及将对象数据保存为 `XML` 文件，甚至使用设计者选择的专有语言来实现。


    ## 77. UML 中操作（Operation）和方法（Method）的区别是什么？

    答案：区别在于 `Operation` 是可以从类实例请求的服务规范，而 `Method` 是类的实现。


    ## 78. 什么是算法（Algorithm）？

    答案：`Algorithm`（算法）是接受输入并产生输出的指令序列；它主要与 `Method` 相似，但算法在面向对象的程序中执行需要多个 `Method`。


    ## 79. 什么是多态（Polymorphism）？

    答案：`Polymorphism`（多态）是一个原则，即 `Method` 调用取决于要调用的操作，同时也取决于调用接收者的类。


    ## 80. Term Operation 什么时候适用？

    答案：`Term Operation` 适用于讨论不同类中的 `Methods` 大多数时候具有相同接口的想法；它始终指的是服务的规范。


    ## 81. Term Signature 什么时候适用？


