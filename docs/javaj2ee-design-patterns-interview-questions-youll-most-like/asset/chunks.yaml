    `Term Signature` 适用于讨论 Java 如何匹配对接收对象中 `Method` 的调用规则。


    ### 82: Java 中的方法声明（Method Declaration）包含什么？

    答案：

    Java 中的 `Method Declaration` 包含头部和体，其中体是一系列通过调用 `Method` 签名来执行的指令，而头部包含 `Method`
    的返回类型和修饰符。


    ### 83: 排序方法（Sorting Method）的作用是什么？

    答案：

    `Sorting Method` 使用不同的算法，但大多数情况下开发者只能选择其中一种来对各种对象集合进行排序。


    ### 84: 什么是钩子方法（Hook Method）？

    答案：

    `Hook` 是开发者放置在代码中的 `Method` 调用，为其他开发者提供在程序特定位置插入代码的方法和机会。


    ### 85: 什么是模板方法（Template Method）？

    答案：

    `Template Method` 充当开发者之间的合同，一个开发者可以提供算法，而另一个开发者可以提供算法的某个步骤。


    ### 86: 对象的状态（State）是什么？

    答案：

    对象的 `State` 是对象属性当前值的组合；它是对象行为的一个显著方面。


    ### 87: 如何处理状态之间的转换（Transition between States）？

    答案：

    `Transition between States` 可以通过让允许允许保留一个包含一组状态的上下文引用来处理。


    ### 88: 状态模式（State Pattern）的作用是什么？

    答案：

    `State Pattern` 通过将操作分布到表示对象各种状态的类集合中来实现代码简化。


    ### 89: 什么是策略（Strategy）？

    答案：

    `Strategy` 是一种计划或方法，类似于在给定一组输入的情况下追求输出的算法。


    ### 90: 策略模式（Strategy Pattern）的用途是什么？

    答案：

    `Strategy Pattern` 用于在不同的类中封装替代策略，这些策略又实现了共同的操作；这导致了整洁且简单的代码。


    ***


    ### 91: 命令模式（Command Pattern）的作用是什么？

    答案：

    `Command Pattern` 用于建立 `Method` 的签名，大多数情况下使用 `execute()` 或 `perform()` 方法；它还允许定义接口的不同实现。


    ### 92: 解释器模式（Interpreter Pattern）的作用是什么？

    答案：

    `Interpreter Pattern` 用于将操作分布到类集合中，就像状态模式和策略模式一样。


    ### 93: 解释器对象（interpreter object）的用途是什么？

    答案：

    `Interpreter Object` 用于运行一组规则的执行，允许开发者构建表达式评估器和命令语言。


    ### 94: 解析器对象（Parser Object）的作用是什么？

    答案：

    `Parser` 是一种用于识别文本的 `Object`，并根据一组规则将其结构拆解为适合进一步处理的格式。


    ### 94-95: 设计模式中的扩展（Extension）是指什么？

    答案：

    `Extension` 代表向已有的代码库添加类、接口和/或 `Method`；扩展代码的主要方法是编写新类或通过委托扩展某个类。


    ### 96: 什么时候会通过委托进行扩展（Extension through Delegation）？

    答案：

    当一个类拥有 `Methods` 并将调用转发到另一个对象提供的相同操作时，就会发生这一过程；该过程使得转发类的行为在开发者想要扩展的类上可用。


    ### 97: 装饰器模式（Decorator Pattern）的目的是什么？

    答案：

    `Decorator Pattern` 用于允许开发者通过将多态与委托结合来动态组合对象的行为，从而扩展对象的行为。


    ### 98: 设计模式中的流（Stream）是什么？

    答案：

    `Stream` 是字节或字符的序列集合，例如出现在文档中的内容；在 Java 中，每个流对象大多数时候包含另一个流对象，它将其操作转发给该对象。


    ### 99: 设计模式中的 `next()` 方法的作用是什么？

    答案：

    `next()` 方法用于检查某个值是否加载，然后检查它是否报告了所遍历的复合结构的内部节点。


    ### 100: 多线程应用程序中如何实现迭代（Iteration）？

    答案：

    这可以通过对互斥对象（mute object）进行监器同步来实现，开发者可以在迭代期间阻塞所有访问，或者短时间内阻塞访问以创建集合的副本。


    ### 101: 门面模式（Façade Pattern）用于什么？

    答案：

    `Façade Pattern` 处理类子系统。类子系统由一组共同工作的类组成，目的是提供一组相关联的功能（功能性）。


    ### 102: 现实世界应用中子子系统（subsystem）的意义是什么？

    答案：

    在现实世界应用中，子系统可能包含大量类。子系统的客户端可能需要其需要与多个子系统类进行交互。这种客户端与子系统类之间的直接交互导致了客户端对象与系统之间的高度耦合。每当子系统类发生变化时（例如接口更改），所有依赖于它的客户端类都可能受到影响。


    ### 103: 门面模式（Façade Pattern）的主要优势是什么？

    答案：

    `Façade Pattern` 为子系统提供了一个更高层次、更简单的接口，减少了复杂性和依赖性。这反过来使得子系统的使用变得更容易、更容易管理。


    ### 104: 门面模式（Façade Pattern）提供了什么？

    答案：

    `Façade Pattern` 为客户端使用的子系统提供了简化接口。有了 Facade 对象，客户端转而与 Facade 对象交互。Facade 对象承担了与子系统类交互的责任。


    ### 105: 应用门面模式（Façade Pattern）时应该知道什么？

    答案：

    Facade 不应设计为提供任何额外功能。此外，永远不应该从 Facade 方法返回子系统组件。


    ***


    ### 106: 代理对象（Proxy Object）的特征是什么？

    答案：

    `Proxy Object` 是客户端对象和目标对象之间的中介。它接收来自客户端对象的调用并将其转发给目标对象。


    ### 107: 代理（Proxy）和装饰器（Decorator）的区别是什么？

    答案：

    代理客户端对象无法直接访问目标对象。装饰器客户端对象具有直接访问目标对象的能力（如果需要）。


    代理对象为目标对象提供访问控制；`Decorator` 对象不控制对目标对象的访问。


    ### 108: 代理对象和装饰器对象为对象添加的功能有如何？

    答案：

    代理对象不添加任何额外功能，但 `Decorator` 为对象添加了额外功能。


    ### 109: 远程代理（Remote Proxy）的作用是什么？

    答案：

    `Remote Proxy` 用于访问位于不同地址空间的对象。


    ### 110: 虚拟代理（Virtual Proxy）的作用是什么？

    答案：

    `Virtual Proxy` 用于提供所需的功能，以允许按需创建内存密集型对象（除非需要）。


    ### 111: 缓存代理/服务器代理（Cache Proxy/Server Proxy）的作用是什么？

    答案：

    这两种代理用于提供所需的功能，以存储最常用的目标操作的结果。代理对象将这些结果存储在某种存储区域中。当客户端对象请求相同的操作时，代理从存储区域返回操作结果，而无需实际访问目标对象。


    ### 112: 防火墙代理（Firewall Proxy）的作用是什么？

