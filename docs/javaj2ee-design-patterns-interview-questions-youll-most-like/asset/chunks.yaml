- fmt: '

    The `Mediator Pattern` is used to define an object that encapsulates how a set
    of objects interact by keeping the objects from referring to one another in an
    explicit manner, also allowing the developer to vary their interaction independently.


    ## 49. What does a Proxy Pattern do?

    Answer: A `Proxy Pattern` is used to establish a placeholder object that manages
    access to a target object.


    ## 50. What is a Proxy Object?

    Answer: A `Proxy Object` is an object that can be used to isolate clients from
    shifts in a state of a desired object, like when loading an image results in discernible
    duration.


    ## 51. What is the use of a Chain of Responsibility Pattern?

    Answer: The `Chain of Responsibility Pattern` is used mainly to avoid coupling
    the sender of a request to its receiver by giving more than one object a chance
    to handle the request.


    ## 52. What happens in the Chain of Responsibility?

    Answer: In `Chain of Responsibility`, an object model takes on the tasks of finding
    which object can and will satisfy a client’s request; this direct approach goes
    beyond the two lookup mechanisms that are built into `Java`:

    a. The `Method` lookup and

    b. The `exception handling`.


    ## 53. What happens when an Exception is thrown in Design Patterns?

    Answer: When an `Exception` is thrown, the `Java Interpreter` looks back up the
    call stack to find a `Method` called from a block that is enclosed in the `try/catch`
    statement. If this `try/catch` statement does not catch an `Exception` of the
    type thrown, the `Java Interpreter` keeps looking. This can propagate up to the
    `main()` `Method`. If the `Exception` is not handled there, the `Java Interpreter`
    prints out an error message and stack trace and then exits.


    ## 54. What does the Method Lookup do in Design Patterns?

    Answer: The `Method Lookup` is used as an algorithm for deciding definition of
    a `Method` to use when a client calls an object’s `Method`.


    ## 55. What is the Flyweight Pattern used for in Design Patterns?

    Answer: The `Flyweight Pattern` is used for addressing sharing, relying on an
    object’s ability to be responsible to more than a single client, where an ordinary
    object does not have to worry too much about shared responsibility.


    ## 56. How can Flyweight be recognized?

    Answer: This can be achieved by having a class with a `Method` other than a constructor
    that returns the object that has to be shared.


    ## 57. Which are the most common Immutable objects in Java?

    Answer: The most common `Immutable` objects in `Java` are the instances of the
    `string` class, where once a string is created; neither the developer nor the
    client can change its characters.


    ## 58. What are Constructor Methods?

    Answer: `Constructor Methods` resemble any other `Methods`, but `Java` has different
    rules that specifically govern the use of constructors and especially those that
    have special abilities to work with one another.


    ## 59. What are Java Constructor Methods?

    Answer: The `Java Constructor Methods` are special `Methods` which are governed
    by a number of semantic and syntactic rules. These rules are used because they
    are different from other objects in `Java`.


    ## 60. What are Superclasses in Java?

    Answer: `Superclasses` are developed when a class has no declared constructor
    and `Java` has to supply one by default; if the first statement in a constructor
    is not a specific invocation of another construction, then `Java` inserts a call
    to the `super()` `Method`.


    ## 61. How can a call to the super() Method be avoided in Java?

    Answer: This can be achieved by invoking in an explicit manner a superclass constructor
    or by invoking another constructor of the current class with a call to `this()`
    `Method`.


    ## 62. What are Construction Oriented Patterns used for?

    Answer: `Construction Oriented Patterns` are designs which allow a client to construct
    new objects through different means other than calling a class constructor.


    ## 63. What is the Builder Pattern used for in Design Patterns?

    Answer: The `Builder Pattern` is used to move the construction logic for an object
    outside the class to instantiate; this is done to either reduce the size of the
    class that has many `Methods` or to allow step by step construction of a target
    object.


    ## 64. What is the Factory Method Pattern used for?

    Answer: The `Factory Method Pattern` is used to let a class developer define the
    interface for creating an object while retaining control of which class to instantiate.


    ## 65. How can the Factory Method be recognized as working in Design Patterns?

    Answer: To see if the `Factory Method` is working the developer has to check if
    the operation creates a new object, then returns the type that is an interface
    and that it is implemented by several classes.


    ## 66. What does the Iterator Pattern do?

    Answer: The `Iterator Pattern` is used mainly to provide a way to access the elements
    of collection sequentially.


    ## 67. What are the iterator() Methods used for?

    Answer: The `iterator()` `Methods` are mainly a part of the `factory Method` patterns
    and are used for creating an object that returns a sequence of the elements of
    a collection.


    ## 68. What is a Parallel Hierarchy in Design Patterns?

    Answer: A `Parallel Hierarchy` is a pair of class hierarchies where classes in
    one hierarchy have a corresponding class in the other hierarchy.


    ## 69. What is the Abstract Factory Pattern used for?

    Answer: The `Abstract Factory Pattern` is used, most of the time, to provide for
    the creation of the family of related, or dependent, objects.


    ## 70. What is the Prototype Pattern used for?

    Answer: The `Prototype Pattern` is used for allowing a client to create new object
    by copying an example with the major difference between calling a constructor
    and copying an object being that a copy typically includes some of the original
    object.


    ## 71. What is a Memento in Design Patterns?

    Answer: A `Memento` is a small repository that saves an object’s state and that
    also provides storage and restoration of an object’s state.


    ## 72. How is a Memento created in Design Patterns?

    Answer: A `Memento` can be created by using another object, a string or a file,
    with the anticipated duration between the storage and the reconstruction of an
    object having an effect on the strategy that can be used in its design.


    ## 73. What is Persistent Storage?

    Answer: `Persistent Storage` is used to fulfill the intent of the `Memento Pattern`
    and it is a natural extension to the undo functionality that the developer implements
    in his program.


    ## 74. What does Object Serialization do?

    Answer: `Object Serialization` is used to provide a simple means for a `Memento`
    to persist across multiple sessions that occur; for an example in a particular
    week.


    ## 75. What does the java.io package do?

    Answer: The `java.io` package is used to provide support for an object deserialization
    when its class has changed since the serialization was written.


    ## 76. How can Persistent Storage of an object be achieved?

    Answer: `Persistent Storage` of an object can be achieved by writing a textual
    description of it and by saving an object’s data as an `XML` file or even in a
    proprietary language chosen by the designer.


    ## 77. What is the difference between an Operation and a Method as specified by
    the UML?

    Answer: The difference is that an `Operation` is a specification of a service
    that can be requested from an instance of a class and a `Method` is an implementation
    of a class.


    ## 78. What is an Algorithm?

    Answer: An `Algorithm` is a sequence of instructions that accept inputs and produces
    output; it is mainly similar to a `Method`, but an algorithm requires more than
    one `Method` to execute in an object oriented program.


    ## 79. What is Polymorphism?

    Answer: `Polymorphism` is the principle that `Method` invocation depends on both
    the operation that is to be invoked and also the class of the invocation receiver.


    ## 80. When does the Term Operation apply?

    Answer: The `Term Operation` applies when discussing the idea that `Methods` in
    different classes most of the time have the same interface; it always refers to
    the specification of a service.


    ## 81. When does the Term Signature apply?

