    # Java / J2EE 设计模式

    回顾这些典型的面试题，并思考你将如何回答它们。阅读列出的答案；你将找到最佳答案以及相关的策略和建议。


    ## 目录

    1. 设计模式简介` 方法的作用是什么？

    回答：`times()` 方法是一个标准度量，是单位的一部分，它负责实例化任何反映给定单位维度的 `Measure` 类。


    ### 11: 在设计模式中何时使用抽象类（Abstract Class）？

    回答：当 `Java interface` 不可用时使用 `Abstract Class`，可以通过让对象适配器使用委托作为 `Method` 而不是子类化来部署。


    ### 12: JDK 代表什么？

    回答：`JDK` 代表 Java 开发包（Java Development Kit）。它用于提供一个 `Abstract Class`，为大多数特定领域的
    `Methods` 提供默认实现。


    ### 13: 设计模式中的 `JTable` 类的作用是什么？

    回答：`JTable` 类用于处理显示表格的每一个方面，但它无法预知开发者想要展示的数据；它是使用 `Adapter` 的主要 setter 方法。


    ### 14: 设计模式中的外观模式（Facade）是指什么？

    回答：`Facadeade` 是一个功能层级位于工具包和完整应用程序之间的类，从而为包中甚至子系统中的类提供原生用法。它主要用于提供一个易于使用的接口，如果它被部署为一种模式的话。


    ### 15: 设计模式中的演示（Demo）是指什么？

    回答：`Demo` 是一个提供与 `Facade` 相同价值的示例，展示了类或子系统的用法。它主要是一个独立的、不可重用的应用程序，展示了应用子系统的方法。


    ### 16: 设计模式中的组合（Composite）是指什么？

    回答：`Composite` 是一个对象组，其中对象包含其他对象，例如一个对象可能代表组，另一个对象可能代表单个项目。


    ### 17: 组合模式（Composite Pattern）的目的是什么？

    回答：`Composite Pattern` 用于客户端以统一的方式处理单个对象和对象组合，方法是为组和项目定义共同类型，并将组建模为包含特定类型对象的集合。


    ### 18: 设计模式中的有向图（Directed Graphs）是什么？

