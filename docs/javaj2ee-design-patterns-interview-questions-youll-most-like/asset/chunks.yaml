    有向图（Directed Graph）是一个具有方向的对象引用，而“树”这一术语用于无向图。要使一个有向图被视为树，它必须有一个没有被引用的根节点，并且到所有其他节点都必须有一条边。


    ***


    ## 方法与类


    ### 19: 设计模式中的 `getStepCount()` 方法是做什么的？

    答案：

    该 `Method` 被用作 `ProcessComponent` 类中的一种操作，用于计算流程流中所需的步数；它必须确保每个步骤只计数一次，并且在流程包含循环时不会进入无限循环。


    ### 20: 设计模式中对复合对象建模（Modeling Composites）的危险是什么？

    答案：

    因为对复合对象建模通常会导致复合节点上 `Methods` 的递归定义，因此存在编写出可能产生无限循环代码的危险。


    ### 21: 设计模式中的抽象（Abstraction）是什么？

    答案：

    抽象代表一个依赖于一组纯抽象操作的 `class`，其中该组抽象操作可能存在多种实现方式。


    ### 22: 我们如何在设计模式中创建桥接（Bridge）？

    答案：

    可以通过将抽象操作组移动到 `interface` 来创建 `Bridge`，使得抽象依赖于该 `interface` 的实现；其主要意图是将抽象与其抽象操作的实现进行解耦。


    ### 23: 设计模式中的驱动器（Driver）是什么？

    答案：

    `Driver` 是 `adapter` 模式的实例，它是一个根据良好定义的接口在计算机系统或外部设备上运行的对象。


    ### 24: 为什么在设计模式中使用 UML？

    答案：

    `UML` 是由 OMG 提供的一种应用建模规范，用于简化复杂的软件工程过程。


    ### 25: 在设计模式分类中，U 提供了多少种图？

    答案：

    `UML` 提供了 12 种图，表示应用程序的需求分析和解决方案设计。


    ### 26: UML 提供多少种结构图（Structure Diagrams）？

    答案：

    `UML` 提供 4 种结构图，用于表示应用程序的静态结构。它们是：

    a. `Class`（类图），

    b. `Object`（对象图），

    c. `Component`（组件图）和

    d. `Deployment`（部署图）。


    ### 27: UML 提供多少种行为图（Behavior Diagrams）？

    答案：

    `UML` 提供 5 种行为图，用于表示应用程序的动态行为方面。它们是：

    a. `Use case`（用例图），

    b. `Sequence`（序列图），

    c. `Activity`（活动图），

    d. `Collaboration`（协作图）和

    e. `Statechart`（状态图）。


    ### 28: UML 提供多少种模型图（Model Management diagrams）？

    答案：

    `UML` 提供 3 种管理图，可以表示不同的应用程序模块是如何组织和管理的。它们是：

    a. `Packages`（包图），

    b. `Subsystems`（子系统图）和

    c. `Models`（模型图）。


    ### 29: 什么是类图（Class Diagrams）？

    答案：

    `Class Diagrams` 用于描述任何给定系统的静态结构，其中类的结构、行为以及与其他类的关联都描绘在类图中。


    ### 30: 什么是内部类（Inner Class）？

    答案：

    `Inner Class` 是定义在另一个 `class` 内部的 `class`，内部类的概念存在于 `Java`、`C++` 和 `C#` 等面向对象语言。


    ### 31: 设计模式中的泛化（Generalization）方法是做什么的？

    答案：

    泛化主要用于描述面向对象的继承概念，即当存在一个具有共同行为的基类且其每个派生类包含特定细节时。


    ### 32: 设计模式中的接口（Interface）是什么？

    答案：

    `Interface` 用于指定 `class` 外部可见的操作，而不是这些操作的实际实现；它在大多数情况下也仅指定实际实现类 `class` 的部分行为。


    ### 33: 设计模式中的实现（Realization）是什么？

    答案：

    Realization 用于显示 `interface` 与提供实际实现的 `class` 之间的关系，根据 `interface` 的描绘方式不同，它可以用两种画法。


    ### 34: 设计模式中的依赖（Dependency）是什么？

    答案：

    当两个组件之间的关系存在依赖时，`Dependency` 用于显示源组件和目标组件之间的关系。


    ### 35: 设计模式中的多重性（Multiplicity）是什么？

    答案：

    Multiplicity 用于指示与另一个 `class` 实例链接的 `class` 实例数量，使用不同的值来表示多重性。


    ### 36: 设计模式中的消息（Message）是什么？

    答案：

    `Message` 简单地表示两个对象之间的通信，水平线表示消息，消息可以用操作名称及其参数值进行标记。


    ### 37: 设计模式中使用私有方法（Private Methods）是为了什么？

    答案：

    `Private Methods` 用于提供设计类行为的方法，使得外部对象无法访问仅供内部使用的行为。


    ***


    ## 方法与对象


    ### 38: 为什么在设计模式中使用访问器方法（Accessor Method）？

    答案：

    `Accessor Methods` 提供了通过特定 `Methods` 访问对象状态的方法，通过阻碍不同的客户端对象直接访问对象的属性。


    ### 39: 设计模式中的不可变对象（Immutable Object）是做什么的？

    答案：

    `Immutable Object` 主要用于确保对象的状态不能被更改，并确保多个客户端对象对数据对象的并发访问不会产生竞态条件。


    ### 40: 设计模式中的监器函数（Monitor Function）是做什么的？

    答案：

    `Monitor Function` 是一种设计对象的方法，以确保多个线程尝试同时访问对象时不会产生不可预测的结果。


    ### 41: 设计模式中的单例（Singleton）是什么？

    答案：

    `Singleton` 代表寻找特定职责所需对象的方法，其他对象依赖它来协调工作或调节整体状态。


    ### 42: `getFactory()` 方法是做什么的？

    答案：

    `getFactory()` 方法用于确保如果第二个线程在另一个线程开始延迟初始化单例时，第二个线程将等待获取类锁对象的监器。


    ### 43: 观察者模式（Observer Pattern）的用途是什么？

    答案：

    `Observer Pattern` 用于定义对象之间的一对多的依赖关系。例如，当一个对象发生状态变化时，所有依赖者都会通知并自动更新。


    ### 44: MVC 代表什么？它指的是什么？

    答案：

    `MVC` 代表 `Model/View/Controller`（模型/视图/控制器），它指的是感兴趣的对象（模型）与展示它的 GUI 元素（视图和控制器）分离。


    ### 45: 设计模式中的层（Layer）是什么？

    答案：

    `Layer` 是具有相似响应的类组，大多数时候收集在一个统一的 Java 包中；高层仅依赖于等层或低层的类。


    ### 46: 设计模式中类如何观察其子类？

    答案：

    通过为开发者选择的类提供一个可观察对象并让该类转发关键方法来维护该 `Class`。


    ### 47: PropertyChangeSupport 类是做什么的？

    答案：

    该类与 `Observer` 类相似，但它是 `java.beans` 包的一部分。它用于允许感兴趣的观察者注册对标签和其他 GUI 组件属性更改的通知。


    ### 48: 中介者模式（Mediator Pattern）是做什么的？

