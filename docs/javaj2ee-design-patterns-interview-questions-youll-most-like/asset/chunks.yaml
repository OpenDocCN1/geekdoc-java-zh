    Answer:


    Be honest. If you are comfortable in different roles, point that out.


    47: Describe your work ethic.


    Answer:


    Emphasize benefits to the organization. Things like, determination to get the
    job done and work hard but enjoy your work are good.


    48: What has been your biggest professional disappointment?


    Answer:


    Be sure that you refer to something that was beyond your control. Show acceptance
    and no negative feelings.


    49: Tell me about the most fun you have had on the job.


    Answer:


    Talk about having fun by accomplishing something for the organization.


    50: What would you do for us? (What can you do for us that someone else can’t?)


    a) Relate past experiences that represent success in Working for your previous
    employer.


    b) Talk about your fresh perspective and the relevant experience you can bring
    to the company.


    c) Highlight your track record of providing creative, Workable solutions.


    51: Do you have any questions for me?


    Answer:


    Always have some questions prepared. Questions prepared where you will be an asset
    to the organization are good. How soon will I be able to be productive? What type
    of projects will I be able to assist on?


