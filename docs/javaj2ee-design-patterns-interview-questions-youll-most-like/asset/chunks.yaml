    The primary use of a Firewall Proxy is to protect target objects from the bad
    clients. A Firewall Proxy can also be used to provide the functionality required
    to prevent clients from accessing harmful targets.


    ### 113: What does Protection Proxy do?


    Answer:

    The `Protection Proxy` is used to provide the functionality required for allowing
    different clients to access the target object at different levels. A set of permissions
    is defined at the time of creation of the proxy. Subsequently, those permissions
    are used to restrict access to specific parts of the proxy (in turn of the target
    object). A `Client Object` is not allowed to access a particular `Method` if it
    does not have a specific right to execute the `Method`.


    ### 114: What does Synchronization Proxy do?


    Answer:

    The `Synchronization Proxy` is used to provide the required functionality to allow
    safe concurrent access to a target object by different client objects.


    ### 115: What does Smart Reference Proxy do?


    Answer:

    The `Smart Reference Proxy` is used to prevent the accidental disposal/deletion
    of the target object when there are clients currently with references to it. To
    accomplish this, the proxy keeps a count of the number of references to the target
    object. The proxy deletes the target object if and when there are no references
    to it.


    ### 116: What does Counting Proxy do?


    Answer:

    The `Counting Proxy` is used to provide some kind of audit mechanism before executing
    a `Method` on the target object.


    ### 117: What is the difference between Proxy and Façade?


    Answer:

    A `Proxy Object` represents a single object and the `Façade` represents subsystems
    of objects. The `Proxy Object` provides access control to the single target object.
    The `Façade Object` provides a simplified higher level interface to a subsystem
    of components.


    ### 118: What about the Client Object Access to the target?


    Answer:

    In the case of `Proxy`, the `Client Object` cannot access the target object directly,
    but for the `Façade`, the `Client Object` does have the ability to access the
    subsystem objects directly, if needed.


    ### 119: What is the difference between Proxy and Chain of Responsibility?


    Answer:

    A `Proxy Object` contains a single object, and the `Chain` can contain many objects.
    Client requests are first received by the `Proxy Object`, but are never processed
    directly by the `Proxy Object`. In the case of `Chain of Responsibility`, client
    requests are forwarded to the next object in the chain only if the current receiver
    cannot process the request.


    ### 120: What happens with the response to the request in the case of these two
    patterns?


    Answer:

    In the case of `Proxy Pattern`, the response to the request is guaranteed, provided
    the communication between the client and the server locations is working.


    In the case of `Chain of Responsibility`, the response is not guaranteed. It means
    that the request may end up reaching the end of the chain and still might not
    be processed.


    ### 121: What does the concept of Remote Method Invocation mean in Java?


    Answer:

    In Java, the concept of `Remote Method Invocation` (`RMI`) is a way to program
    distributed code. It makes extensive use of `Remote Proxy Pattern`.


    ### 122: What does the RMI do?


    Answer:

    The `Remote Method Invocation` enables a client object to access remote objects
    and invoke `Methods` on them as if they are local objects.


    ### 123: What are the RMI Components?


    Answer:

    The following components working together provide the stated RMI functionality:

    a. `Remote Interface`,

    b. `Remote Object`,

    c. `RMI Registry`,

    d. `Client`,

    e. `RMIC` - Java RMI Stub Compiler.


    ### 124: What represents the Remote Interface?


    Answer:

    A `Remote Object` must implement a `Remote Interface` (one that extends `java.rmi.Remote`).
    A `Remote Interface` declares the `Methods` in the `Remote Object` that can be
    accessed by its clients. In the other words, the `Remote Interface` can be seen
    as the client''s view of the `Remote Object`.


    ### 125: What are the requirements to provide a Remote Interface?


    Answer:

    The requirements are to extend the `java.rmi.Remote` interface and all the `Methods`
    in the remote interface must be declared to throw `java.rmi.RemoteException` exception.


    ### 126: What is the responsibility of Remote Object?


    Answer:

    A `Remote Object` is responsible for implementing the `Methods` declared in the
    associated `Remote Interface`.


    ### 127: What are the requirements to provide a Remote Object?


    Answer:

    It must provide implementation for a `Remote Interface`, it must extend `java.rmi.server.UnicastRemoteObject`.
    Also it must have a constructor with no arguments and it must be associated with
    a server. The server creates an instance of the remote object by invoking its
    zero argument constructors.


    ### 128: What is RMI Registry?


    Answer:

    The `RMI Registry` provides the storage area for holding different remote objects.
    A remote object needs to be stored in the `RMI registry` along with a name reference
    to it for a client object to be able to access it. Only one object can be stored
    with a given name reference.


    ### 129: What represents the Client for RMI?


    Answer:

    The `Client` is an application object attempting to use the `Remote Object`. It
    must be aware of the interface implemented by the remote object. It can search
    for a `Remote Object` using a name reference in the `RMI Registry`. Once the remote
    object reference is found, it can invoke `Methods` on this object reference.


    ### 130: What represents the RMIC: Java RMI Stub Compiler?


    Answer:

    Once a remote object is compiled successfully, `RMIC` Stub Compiler can be used
    to generate `Stub` and `Skeleton` class files for the remote object. `Stub` and
    `Skeleton` classes are generated from the compiled remote object class. These
    `Stub` and `Skeleton` classes make it possible for a client object to access the
    remote object in a seamless manner.


    ### 131: What is the RMI Communication Mechanism?


    Answer:

    Normally, a client object cannot directly access a remote object. In order to
    make this possible, the `RMIC` generates `Stub` of the remote object and the remote
    interface needs to be copied to the client computer.


    ### 132: How does the RMI Communication Mechanism work?


    Answer:

    The `Stub` acts as a `Remote Proxy` for the remote object and it is responsible
    for forwarding `Method` invocations on the remote object to the server where the
    remote object implementation resides. Whenever a client references the remote
    object, the reference is made to a local `Stub`. The `Stub` forwards this call
    to the remote server. On the server the `RMIC` generates `skeleton` receives this
    call. The skeleton is a server side object and it does not need to be copied to
    the client computer.


    ### 133: What is the responsibility of the Skeleton?


    Answer:

    The `Skeleton` is responsible for dispatching calls to the actual remote object
    implementation. Once the remote object executes the `Method`, results are send
    back to the client in the reverse direction.


    ### 134: What is the connection between RMI and Proxy Pattern?


    Answer:

    The `Stub` class is acting as a `remote proxy` for the remote object and this
    makes possible for a client to treat a remote object as if it is available locally.
    Thus, any application that uses `RMI` contains an implicit implementation of the
    `Proxy` pattern.


    ### 135: What is a Virtual Proxy?


    Answer:

    A `Virtual Proxy Pattern` is a memory saving technique that recommends postponing
    an object creation until it is truly needed.


    ### 136: What is the advantage of using a Virtual Proxy?


    Answer:

    The advantage of using a `Virtual Proxy` is that the application has a faster
    start up time because it is not required to create and load all of the application
    objects.


    ### 137: What is the disadvantage of using a Virtual Proxy?


    Answer:

    The disadvantage of using a `Virtual Proxy` is that the object that is accessed
    has to be checked to make sure that it is not null after the object is created.


    ### 138: What happens when one applys a Virtual Proxy Pattern?


