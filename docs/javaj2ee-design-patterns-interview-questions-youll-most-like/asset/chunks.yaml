    ## Introduction to Design Patterns

    ### 1: What are Design Patterns?

    Answer: Design Patterns are patterns, in an extent a way to pursue and intent,
    that use classes and their `Methods` in oriented languages. In simple words, a
    Design Pattern is a general reusable solution to a commonly occurring problem.
    A Design Pattern is not a finished design that can be transformed into code. It
    is a description or template for how to solve a problem that can be used in many
    situations.


    ### 2: What is a Class Interface in Design Patterns?

    Answer: A `Class Interface` represents the collection of `Methods` and fields
    of a class that allow objects of other classes to access.


    ### 3: What is a Class Implementation in Design Patterns?

    Answer: A `Class Implementation` is designed to be the code that lies within its
    own code, with instructions on how an object is to fulfill a commitment.


    ### 4: What is the Java Interface Construct?

    Answer: The `Java Interface Construct` is a tool, powerful in its own right, used
    for adaptation of class interfaces and for applying patterns to collection of
    classes.


    ### 5: What is a Stub in Design Patterns?

    Answer: A `Stub` is a class used to implement the interface with `Methods` that
    do absolutely nothing; developers use this as a way to override `Methods` that
    are important to their own applications.


    ### 6: What is a Constant in Design Patterns?

    Answer: A `Constant` is a field that is `static` and `final` and it is defined
    by interfaces and classes that are cooperating with each other when it comes to
    the process of defining it.


    ### 7: What is the purpose of Design Patterns?

    Answer: Design Patterns are used mainly for solving problems that occur in a context,
    with interface oriented patterns addressing the context in which developers need
    to define or redefine access to the `Methods` of a class or group of classes.


    ### 8: What is an Adapter in Design Patterns?

    Answer: An `Adapter` is used for implementing expected interfaces, by having the
    developer provide the interface that a client needs, using the services of a class
    with a different interface.


    ### 9: What are measures and dimensions in Design Patterns?

    Answer:

    a. `Measures` are a combination of magnitude and dimension,

    b. `Dimensions` are an aggregation of a measure’s length, mass and time exponents.


    ### 10: What does the times() Method do in Design Patterns?

    Answer: The `times()` Method is a standard measure, part of a unit, that instantiates
    whichever class of `Measure` reflects the dimension of any given unit.


    ### 11: When is Abstract Class used in Design Patterns?

    Answer: An `Abstract Class` is used when a `Java interface` is unusable and it
    can be deployed by having an object adapter that uses delegation as a `Method`
    rather than subclassing.


    ### 12: What does JDK stand?

    Answer: `JDK` stands for Java Development Kit. It is used to supply an `Abstract
    Class` that provides default implementation to most of the domain specific `Methods`.


    ### 13: What does the JTable class do in Design Patterns?

    Answer: The `JTable` class is used to handle almost every aspect of displaying
    a table, but cannot know in advance what data the developer wishes to present;
    it is a main setter for the use of the `Adapter`.


    ### 14: What is a Façade in Design Patterns?

    Answer: A `Façade` is a class with a level of functionality that lies between
    a toolkit and a complete application, thus offering a vanilla usage of the classes
    in a package or even in a subsystem. It is mainly used to provide an interface
    that makes a subsystem easy to use, if it is deployed as a pattern.


    ### 15: What is a Demo in Design Patterns?

    Answer: A `Demo` is an example that provides the same value as a `Façade` and
    shows the use of a class or a subsystem. It is mainly a stand alone, non-reusable
    application that shows on way to apply a subsystem.


    ### 16: What is a Composite in Design Patterns?

    Answer: A `Composite` is a group of objects in which objects may contain other
    objects, such as one object may represent groups and another object may represent
    an individual item.


    ### 17: What is the purpose of a Composite Pattern?

    Answer: A `Composite Pattern` is used to let clients treat individual objects
    and compositions of objects in a tight, uniform way, by defining a common type
    for groups and items and by modeling groups as containing a collection of objects
    of a certain type.


