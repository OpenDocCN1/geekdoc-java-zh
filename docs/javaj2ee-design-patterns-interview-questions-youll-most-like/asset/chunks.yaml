    防火墙代理（Firewall Proxy）的主要用途是保护目标对象免受恶意客户端的影响。防火墙代理也可以提供防止客户端访问有害目标的功能。


    ### 113: 保护代理（Protection Proxy）的作用是什么？


    答案：

    `Protection Proxy` 用于提供允许不同客户端以不同级别访问目标对象的功能。在创建代理时会定义一组权限。随后，这些权限被用于限制对代理特定部分（反之目标对象）的访问。如果
    `Client Object` 没有执行特定 `Method` 的特定权限，则不允许其访问该 `Method`。


    ### 114: 同步代理（Synchronization Proxy）的作用是什么？


    答案：

    `Synchronization Proxy` 用于提供所需的功能，以允许不同的客户端对象安全地并发访问目标对象。


    ### 115: 智能引用代理（Smart Reference Proxy）的作用是什么？


    答案：

    `Smart Reference Proxy` 用于在当前仍有客户端持有目标对象引用时，防止目标对象被意外释放/删除。为了实现这一点，代理会维护目标对象的引用计数。当目标对象没有引用时，代理会删除该目标对象。


    ### 116: 计数代理（Counting Proxy）的作用是什么？


    答案：

    `Counting Proxy` 用于在对目标对象执行 `Method` 之前提供某种审计机制。


    ### 117: 代理（Proxy）和外观模式（Façade）有什么区别？


    答案：

    `Proxy Object` 代表单个对象，而 `Façade` 代表对象的子系统。`Proxy Object` 为单个目标对象提供访问控制。`Façade
    Object` 为组件子系统提供了一个简化的高层接口。


    ### 118: 客户端对象访问目标的情况如何？


    答案：

    在 `Proxy` 的情况下，`Client Object` 无法直接访问目标对象；但对于 `Façade`，如果需要，`Client Object` 具有直接访问子系统对象的。。


    ### 119: 代理（Proxy）和责任链（Chain of Responsibility）有什么区别？


    答案：

    `Proxy Object` 包含单个对象，而 `Chain` 可以包含多个对象。客户端请求首先由 `Proxy Object` 接收，但绝不会由 `Proxy
    Object` 直接处理。在 `Chain of Responsibility` 的情况下，只有当当前接收者无法处理请求时，客户端请求才会转发到链中的下一个对象。


    ### 120: 在这两种模式下，请求的响应是如何处理的？


    答案：

    在 `Proxy Pattern` 的情况下，只要客户端与服务器位置之间的通信正常，对请求的响应是有保证的。


    在 `Chain of Responsibility` 的情况下，响应是不保证的。这意味着请求可能会到达链的末端但仍然可能无法被处理。


    ### 121: Java 中远程方法调用（Remote Method Invocation）的概念意味着什么？


    答案：

    在 Java 中，`Remote Method Invocation`（`RMI`）是一种编写分布式代码的方法。它大量使用了 `Remote Proxy Pattern`。


    ### 122: RMI 的作用是什么？


    答案：

    `Remote Method Invocation` 允许客户端对象访问远程对象并在其上调用 `Methods`，就好像它们是本地对象一样。


    ### 123: RMI 的组件有哪些？


    答案：

    以下组件共同工作提供了所述的 RMI 功能：

    a. `Remote Interface`（远程接口），

    b. `Remote Object`（远程对象），

    c. `RMI Registry`（RMI 注册表），

    d. `Client`（客户端），

    e. `RMIC` - Java RMI  Stub 编译器。


    ### 124: 远程接口（Remote Interface）代表什么？


    答案：

    `Remote Object` 必须实现 `Remote Interface`（扩展 `java.rmi.Remote` 的接口）。`Remote Interface`
    声明了 `Remote Object` 中可以被客户端访问的 `Methods`。换句话说，`Remote Interface` 可以视为客户端对 `Remote
    Object` 的视图。


    ### 125: 提供远程接口（Remote Interface）的要求是什么？


    答案：

    要求是扩展 `java.rmi.Remote` 接口，并且远程接口中所有的 `Methods` 必须声明为抛出 `java.rmi.RemoteException`
    异常。


    ### 126: 远程对象（Remote Object）的责任是什么？


    答案：

    `Remote Object` 实现实现关联 `Remote Interface` 中声明的 `Methods`。


    ### 127: 提供远程对象（Remote Object）的要求是什么？


    答案：

    必须为 `Remote Interface` 提供实现，必须扩展 `java.rmi.server.UnicastRemoteObject`。此外，它必须有一个无参数构造函数，并且必须与服务器关联。服务器通过调用其零参数构造函数来创建远程对象的实例。


    ### 128: 什么是 RMI 注册表（RMI Registry）？


    答案：

    `RMI Registry` 提供存储不同远程对象的区域。远程对象需要存储在 `RMI registry` 中并带有一个名称引用，以便客户端对象能够访问它。给定的名称引用只能存储一个对象。


    ### 129: 对于 RMI，客户端（Client）代表什么？


    答案：

    `Client` 是一个尝试使用 `Remote Object` 的应用对象。它必须感知远程对象实现的接口。它可以使用 `RMI Registry` 中的名称引用来查找
    `Remote Object`。一旦找到了远程对象引用，它就可以在该对象引用上调用 `Methods`。


    ### 130: RMIC：Java RMI Stub 编译器代表什么？


    答案：

    一旦成功编译了远程对象，可以使用 `RMIC` Stub 编译器为远程对象生成 `Stub` 和 `Skeleton` 类文件。`Stub` 和 `Skeleton`
    类是根据编译后的远程对象类生成的。这些 `Stub` 和 `Skeleton` 类使得客户端对象能够以无缝的方式访问远程对象。


    ### 131: 什么是 RMI 通信机制？


    答案：

    通常情况下，客户端对象无法直接访问远程对象。为了实现这一点，`RMIC` 生成远程对象的 `Stub`，并且远程接口需要被复制到客户端计算机上。


    ### 132: RMI 通信机制是如何工作的？


    答案：

    `Stub` 充当远程对象的 `Remote Proxy`（远程代理），它负责将远程对象上的 `Method` 调用转发到远程对象实现所在的服务器上。每当客户端引用远程对象时，该引用都会指向本地的
    `Stub`。`Stub` 将此调用转发到远程服务器。在服务器上，`RMIC` 生成的 `skeleton`（骨架）接收此调用。`skeleton` 是一个服务器端对象，不需要复制到客户端计算机上。


    ### 133: 骨架（Skeleton）的责任是什么？


    答案：

    `Skeleton` 负责将调用调度给实际远程对象实现。一旦远程对象执行了 `Method`，结果将反向发送回客户端。


    ### 134: RMI 与代理模式（Proxy Pattern）之间有什么联系？


    答案：

    `Stub` 类充当远程对象的 `remote proxy`，这使得客户端可以像处理本地对象一样处理远程对象。因此，任何使用 `RMI` 的应用程序都包含隐式的
    `Proxy` 模式实现。


    ### 135: 什么是虚拟代理（Virtual Proxy）？


    答案：

    `Virtual Proxy Pattern`是一种节省内存的技术，建议在真正需要时创建对象。


    ### 136: 使用虚拟代理（Virtual Proxy）的优点是什么？


    答案：

    使用 `Virtual Proxy` 的优点是应用程序启动速度更快，因为不需要创建和加载所有的应用对象。


    ### 137: 使用虚拟代理（Virtual Proxy）的缺点是什么？


    答案：

    使用 `Virtual Proxy` 的缺点是在访问对象后必须检查该对象是否为空。


