    # 设计模式问题


    - 代理模式（Proxy Pattern）的作用是什么？

    - 什么是代理对象（Proxy Object）？

    - 责任链模式（Chain of Responsibility Pattern）有什么用？

    - 责任链中发生了什么？

    - 在设计模式中抛出异常（Exception）会发生什么？

    - 设计模式中的方法查找（Method Lookup）的作用是什么？

    - 享重量模式（Flyweight Pattern）在设计模式中用于？

    - 如何识别享重量模式？

    - Java 中常见的不可变对象（Immutable objects）有哪些？

    - 什么是构造方法？

    - 什么是 Java 构造方法？

    - Java 中的超类（Superclasses）是什么？

    - 在 Java 中避免调用 `super()` 方法？

    - 构建导型模式（Construction Oriented Patterns）有什么用？

    - 建造者模式（Builder Pattern）在设计模式中用于？

    - 工厂方法模式（Factory Method Pattern）有什么用？

    - 如何判断设计模式中的工厂方法是否正常工作？

    - 迭代器模式（Iterator Pattern）的作用是什么？

    - `iterator()` 方法有什么用？

    - 设计模式中的并行层次结构（Parallel Hierarchy）是什么？

    - 抽象工厂模式（Abstract Factory Pattern）有什么用？

    - 原型模式（Prototype Pattern）有什么用？

    - 设计模式中的备忘录（Memento）是什么？

    - 在设计模式中如何创建备忘录？

    - 什么是持久化存储（Persistent Storage）？

    - 对象序列化（Object Serialization）的作用是什么？

    - `java.io` 包的作用是什么？

    - 如何实现对象的持久化存储？

    - UML 规范的操作（Operation）和方法（Method）有什么区别？

    - 什么是算法（Algorithm）？

    - 什么是多态（Polymorphism）？

    - 什么时候适用终止操作（Term Operation）？

    - 什么时候适用终止签名（Term Signature）？

    - Java 方法声明（Method Declaration）包含什么？

    - 排序方法（Sorting Method）的作用是什么？

    - 什么是钩方法（Hook Method）？

    - 什么是模板方法（Template Method）？

    - 对象的状态（State）是什么？

    - 如何处理状态之间的转换（Transition between States）？

    - 状态模式（State Pattern）的作用是什么？

    - 什么是策略（Strategy）？

    - 策略模式（Strategy Pattern）的用途是什么？


    ## 命令

    - 命令模式（Command Pattern）的作用是什么？

    - 解释器模式（Interpreter Pattern）的作用是什么？

    - 解释器对象（interpreter object）有什么用？

    - 解析器对象（Parser Object）的作用是什么？

    - 设计模式中的扩展（Extension）是什么？

    - 什么时候通过委托（Delegation）发生扩展？

