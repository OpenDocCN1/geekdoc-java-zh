    ### 175: Which is the second step converting an algorithm into individual Methods?


    Answer:

    The second step is one that has a `template` class that can implement invariant
    parts of the algorithm as a set of non abstract `Methods`.


    ### 176: Which is the third step converting an algorithm into individual Methods?


    Answer:

    The third step is having a set of steps that can be designed as non abstract `Methods`
    with the default implementation, where the `Subclasses` of the `Template` class
    can override these `Methods` to provide specific implementations.


    ### 177: Give some examples of Creational Patterns and what do they do?


    Answer:

    Some examples of Creational Patterns are:


    a. `Abstract Factory` (creates an instance of several families of classes);

    b. `Builder` (separates object construction from its representation);

    c. `Prototype` (it is a fully initialized instance to be copied or cloned);

    d. `Singleton` (it is a class in which only a single instance can exist);

    e. `Factory Method` (creates an instance to be copied or cloned)


    ### 178: Give some examples of Structural Patterns and what do they do?


    Answer:

    Some examples of Structural Patterns are:


    a. `Adapter` (it matches the interfaces of different classes);

    b. `Composite` (it has a tree structure of simple and composite objects);

    c. `Decorator` (it adds responsibilities to objects dynamically);

    d. `Proxy` (an object representing another object);

    e. `Bridge` (it separates an object abstraction from its implementation).


    ### 179: Give some examples of Behavioral Patterns and how they are used


    Answer:

    Some of the most common Behavioral Patterns are:


    a. `Iterator` (it allows sequentially access to the elements of a collection);

    b. `Chain of Responsibilities` (it is a way of passing a request between a chain
    of objects);

    c. `Observer` (it encapsulates a command request as an object);

    d. `Mediator` (defines a simplified communication between classes).


    ### 180: How is a Thread-Safe Singleton written?


    Answer:

    The best way to write a Thread-Safe Singleton is easy. It must be declared a `Boolean`
    variable which will keep the status of the instantiation of the class, an `Object`
    class object and a variable of the same class which has the initial value as null.


    ### 181: What is an Anti-Design Pattern?


    Answer:

    An `Anti-Design Pattern` is a solution to the common software problem design that
    at first appeared to be beneficial, but the result had bad consequences that outweighed
    the advantages.


    ### 182: What does a Critical Section Pattern do?


    Answer:

    This Pattern is a stricter form of `Monitor` and it is used to lock the code at
    the class level as to keep multiple threads from executing the locked code even
    on two different instances of the same class.


    ### 183: What is the purpose of the Consistent Lock Order Pattern?


    Answer:

    This Pattern is used to recommend the identifying and documenting of a well defined
    order of locking objects to be followed consistently during the design of an application
    to eliminate the possibility of a deadlock.


    ### 184: What does a Guarded Suspension Pattern do?


    Answer:

    This Pattern recommends a `Method` to be designed to suspend its execution until
    the object is in a state that makes a required precondition true.


    ### 185: What does a Read Write Lock Pattern do?


    Answer:

    This Pattern recommends allowing simultaneous read operations while preventing
    simultaneous updates to the values of an application resource in order to improve
    the application''s responsiveness.


    ### 186: How is the usage of the Façade Pattern justified?


    Answer:

    A `Façade Pattern` is justified each time the dependencies between the implementation
    classes of an abstraction and the clients become complex enough to decouple the
    subsystem.


    ### 187: What does a Critical Section do?


    Answer:

    A `Critical Section` is a segment of code that has to be executed at all costs
    by only one thread at any given time to be able to produce the expected results.


    ### 188: What does the Read Lock rule do?


    Answer:

    The `Read Lock` rule is issued only if there is no `Write Lock` currently issued
    and there are no thread(s) waiting for the `Write Lock`.


    ### 189: What is the rule of the Write Lock?


    Answer:

    The rule of the `Write Lock` states that it should be issued if no thread(s) has
    currently issued lock on the object.


    ### 190: What is the difference between Deep and Shallow Copy in Prototype Pattern?


    Answer:

    In `Shallow Copy` only the object is cloned, any objects containing in that object
    is not cloned. Using a `Shallow Copy`, pointers will continue to be shared between
    the copy and the original.


    In case of a `Deep Copy`, the parent objects are cloned along with their containing
    objects. In `Deep Copy`, the new object is independent because it refers to its
    own variable which is a copy of the original variable.


    ### 191: How many Methods does ReadWriteLock offer?


    Answer:

    `ReadWriteLock` offers two `Methods` and they are:


    a. `getReadLock` and

    b. `getWriteLock`,


    These can be used by client objects to get read and write locks on an object.


    ### 192: What is the Done Method?


    Answer:

    The `Done Method` arises when a client object that holds a read-write lock can
    release the lock by invoking the `Done Method`.


    ### 193: How is a Design Pattern documented?


    Answer:

    The best way of documenting Design Patterns is to give the name of the pattern,
    to describe the problem and the goals and the constraints that may occur in the
    context where it is used, to enumerate the participating classes, objects and
    their structure in the design pattern, also their collaboration and responsibilities.
    Also it is good to identify the uses in the real systems and its efficiency.


    ### 194: What does the DAO Design Pattern do?


    Answer:

    The `DAO Design Pattern` abstracts the low level data accessing constructs of
    DB specific and provides an interface allowing access data by doing a very small
    change.


    ### 195: What does CVS stand for?


    Answer:

    `CVS` stands for `Concurrent Versions System`. It is a server system where all
    files can be placed (with regards to a particular project) in `Repository`. Version
    control keeps track of all work and all changes in a set of files, and allows
    several developers (potentially widely separated in space and/or time) to collaborate.


    ### 196: Which are the most commonly Patterns in Java?


    Answer:

    The most used Design Patterns in Java are:


    a. `Model-view-controller`,

    b. `Prototype`,

    c. `Iterator`,

    d. `Proxy`,

    e. `Abstract Factory` and

    f. `Observer`.


    ### 197: Define an interface for creating classes, let a subclass (or a helper
    class) decide which class to instantiate.


    Answer:

    This is used in EJB creation model. `EJBHome` defines an interface for creating
    the `EJBObject` implementations. They are actually created by a generated container
    class. See `InitialContextFactory` interface that returns an `InitialContext`
    based on properties hash table.


    ### 198: What patterns were used in designing the Enterprise JavaBeans?


    Answer:

    The Pattern that were used by Sun in designing the Enterprise JavaBeans are:


    a. `Factory Method`,

    b. `Singleton`,

    c. `Abstract Factory`,

    d. `Builder`,

    e. `Adapter`,

    f. `Proxy` and

    g. `Memento`


    ### 199: What is the relation between Design Patterns?


    Answer:

    Generally, some Patterns fit together, other Patterns may lead to another Patterns.
    Also some Patterns are similar and all of them are used to solve a problem efficiently.


    ### 200: What does a Reactor Pattern represent?


    Answer:

    The `Reactor Pattern` is a Pattern that can be used in a synchronous manner. It
    is an Architectural Pattern that allows DE-multiplexing of event driven applications
    and dispatch service requests that are delivered by one or multiple application
    clients to an application.


