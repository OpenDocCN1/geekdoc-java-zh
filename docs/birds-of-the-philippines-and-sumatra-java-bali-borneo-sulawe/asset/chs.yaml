  \ Marie 遭受的可能比大多数人都多。\n\n## 关于作者\n\n野生动物艺术家 Norman Arlott 曾为近 100 本书画过插，他的作品经常出现在杂志上。他曾为牙梅加、巴哈马、塞舌尔、英属维尔京群岛、甘比亚、马拉维和圣诞岛等国家设计特殊的鸟类邮票。他他还带领过前往东非鸟类考察之旅。\n\
