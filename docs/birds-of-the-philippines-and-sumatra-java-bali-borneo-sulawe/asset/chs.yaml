  \ 和较长的高调的 `pseeeu`。栖息地：森林边缘、红树林、次生林。分布：居住在婆罗洲。\n\n\n\n\n## 2 橙胸太阳鸟\n*Cinnyris buettikoferi*\
  \ 11cm 野外记录：通常单只或成对在森林的中层和上层觅食。鸣声：长而甜美、高亢且清脆的鸣唱声，以及一种 `wee-chew wee-chew wee-chew\
  \ wee-chew-wee`；飞行时发出尖锐高音的 `chee` 或 `sip`。栖息地：次生林、森林边缘、耕地和灌木丛。分布：特产于小巽达群岛的巽木岛。\n\
  \n## 3 火焰太阳鸟\n*Cinnyris solaris* 11cm 野外记录：喜欢花树上觅食，有单只、成对或成小群。鸣声：由 3–4 声高亢、断续的音阶升降音符组成。栖息地：次生林、森林边缘、林地、种植园、`Eucalyptus`\
  \ 森林、灌木丛和花园。分布：特产于小巽达群岛。\n\n## 4 栗颈太阳鸟\n*Aethopyga guimarasensis* 9–10cm 野外记录：曾被视为火焰太阳鸟的一个亚种；推测行为相似。鸣声：推测与火焰太阳鸟相似。栖息地：森林、森林边缘和次生林。分布：特产于菲律宾西部。\n\
  \n## 5 火红太阳鸟\n*Aethopyga flagrans* 9–10cm 野外记录：单只、成对或在物种混群中觅食。鸣声：一种重复的、短促的、高亢且上扬的\
  \ `tsweet`。栖息地：森林、森林边缘和次生林。分布：特产于菲律宾北部。\n\n## 6 优雅太阳鸟\n*Aethopyga duyvenbodei* 12cm\
  \ 野外记录：从叶子和蜘蛛网上捕食昆虫；出现在物种混群中、小群中、成对或单只。鸣声：短促的类昆虫般的颤音，以及高亢的急促音符颤音；叫声包括高亢、沙哑的 `treek`\
  \ 或 `tseeek`，以及 `tit` 或 `tit-tit-tit-tit`。栖息地：残留森林斑块附近的混合种植园、次生林、竹林、树蕨和灌木丛。分布：特产于桑基黑岛。\n\
  \n## 7 美丽太阳鸟\n*Aethopyga shelleyi* 10–11cm 野外记录：取食花蜜、昆虫和幼虫，成对、单只或作为物种混群的一员。鸣声：持续几秒的起伏式\
  \ `zuep-ziip`。栖息地：森林、森林边缘和有花树的耕地。分布：特产于菲律宾西部。\n\n## 8 俊太阳鸟\n*Aethopyga bella* 9cm\
  \ 野外记录：取食昆虫、幼虫和花蜜，单只、成对或在物种混杂觅食群中。鸣声：快速的 `sit-sit-sit-sit-tee-tee-tee` 和较低调的 `tsit-tsit-tit-it`。栖息地：森林、森林边缘、丛丛和耕地。分布：特产于菲律宾。\n\
  \n![image](img/page351.jpg)\n\n169 太阳鸟\n\n## 1 金属翼太阳鸟\n*Aethopyga pulcherrima* 9–10cm\
  \ 野外记录：单只、小群或在物种混群中觅食。鸣声：缓慢、间距较大的音符，随后是颤音，接着是一系列更缓慢、间距拉大的音符。叫声包括重复的 `squeak` 和重复的高音\
  \ `zeeeep`；还会发出尖锐的 `see` 或 `see-see-tsik tsik`，可能转变为上扬的颤音。栖息地：森林、森林边缘、次生林和香蕉种植园。分布：特产于菲律宾中部和南部。\n\
  \n## 2 吕宋太阳鸟\n*Aethopyga jefferyi* 9–10cm 野外记录：曾被视为前一种物种的亚种；推测行为相似。鸣声：推测与金属翼太阳鸟相似。栖息地：森林、森林边缘、次生林和种植园。分布：特产于菲律宾北部。\n\
  \n## 3 荷洛太阳鸟\n*Aethopyga decorosa* 9–10cm 野外记录：曾被视为金属翼太阳鸟的亚种；推测行为相似。鸣声：推测与金属翼太阳鸟相似。栖息地：森林、森林边缘和种植园。分布：特产于菲律宾中部的荷洛岛。\n\
  \n## 4 白颊太阳鸟\n*Aethopyga eximia* 13cm 野外记录：喜欢在底层和中层的花树和藤本植物中活动。单只、成对或成小群可见。鸣声：清晰、精准的\
  \ `tee-tee-tee-leet` 或类似音。栖息地：森林、森林边缘、空地和林线以上的高山灌木丛。分布：特产于爪哇。\n\n## 5 绯红太阳鸟\n*Aethopyga\
  \ siparaja* 10–11cm 野外记录：在树木和灌木的花中觅食，单只、成对或偶尔成小群。鸣声：响亮的啾啾颤音；叫声包括 `zit-zit` 和柔和的\
  \ `siesiep-siepsiep`。栖息地：森林、次生林、耕地、灌木丛和花园。分布：于苏门答腊、爪哇。\n\n## 6 华丽太阳鸟\n*Aethopyga\
  \ magnifica* 15cm 野外记录：单只、成对或成小群遇到；喜欢花树。曾被视为火焰太阳鸟的亚种。鸣声：带有金属感的 `zit` 叫。栖息地：森林、次生林、耕地。分布：特产于菲律宾西部。\n\
  \n## 7 爪哇太阳鸟\n*Aethopyga mystacalis* 12cm 野外记录：在森林上层觅食，特别是敧花。鸣声：柔和、悦耳的 `tseep-tzeep\
  \ cheet-cheet`。栖息地：低地森林、次生林。分布：特产于爪哇。\n\n## 8 德敏克太阳鸟\n*Aethopyga temminckii* 10cm\
  \ 野外记录：主要在树冠层觅食。单只或成对出现，偶尔发现于小群中。鸣声：上扬的、金属感的 `twip twip twip twit twit…`，短暂停后重复；还会发出快速、连续、咔哒声般的\
  \ `twit twit twit…` 或 `whit whit whit…`，偶尔变为清晰的口哨声 `whirp`。栖息地：低地、山地森林。分布：留于苏门答腊和婆日洲。\n\
  \n![image](img/page353.jpg)\n\n170 太阳鸟；食虫鸟\n\n## 1 灰冠太阳鸟\n*Aethopyga primigenia*\
  \ 10–11cm 野外记录：单只、成对或在物种混群中觅食；喜欢香蕉植物的花。*A. p. diuatae* 出于希龙贡-希龙贡山。鸣声：重复的高音 `pink-pink-pink`，音调平，有时变为\
  \ `see-see-see…`；还有 `seck-seck`，重复多达六次。栖息地：亚山地和山地森林及森林边缘。分布：特产于棉兰老岛。\n\n## 2 阿太阳鸟\n\
  *Aethopyga boltoni* 12cm 野外记录：活跃且吵闹。单只、成对或在物种混群中觅食，尤其是花树和灌木中。鸣声：上扬的、金属感的 `twip twip\
  \ twip twit twit…`，短暂停后重复；还会发出快速、连续、咔哒声般的 `twit twit twit…` 或 `whit whit whit…`，偶尔变为清晰的口哨声\
  \ `whirp`。栖息地：山地森林。分布：特产于棉兰老岛。\n\n## 3 莉娜太阳鸟\n*Aethopyga linaraborae* 10–11cm 野外记录：在森林的中层和上层觅食，单只、成对或在物种混群中。鸣声：一系列高亢、吱吱的、啾啾的音符，带有重复序列。叫声包括高音\
  \ `suweet suweet suweet`、上扬的 `su-weet` 或 `tsoo-eet` 以及金属感的 `tip-tip-tip-tip…`。栖息地：山地云林。分布：特产于棉兰老东部。\n\
  \n## 4 紫颈太阳鸟\n*Hypogramma hypogrammicum* 14–15cm 野外记录：主要在林下层觅食，经常抖动并扇开尾巴。很快可能会证明该物种是食蛛虫鸟？鸣声：高亢而有力的\
  \ `sweet sweet sweet sweet`；叫声包括尖锐的 `schewp`、`tsit-tsit`、`tchu` 或 `chip`。栖息地：阔叶常绿森林、淡水沼泽森林和次生林。分布：留于苏门答腊和婆日洲。\n\
  \n\n\n\n\n### 5 小食蜜鸟\n*Arachnothera longirostra* 13–16cm 野外记录：活跃且静不住的、动作敏捷的觅食者，主要活动在较低层；被香蕉花吸引。鸣声：单调的、金属般的\
  \ `which-which`；叫声包括粗厉的 `cheep`、`chee-chee-chee` 和响亮的 `sheep`，可重复达 25 次。栖息地：阔叶常绿林、森林边缘、次生林、耕地和园林。分布：栖息于苏门答腊、爪哇、巴厘岛和婆罗洲。\n\
  \n### 6 橙冠食蜜鸟\n*Arachnothera flammifera* 13–16cm 野外记录：曾被认为与小食蜜鸟为同种；行为推测相似。鸣声：推测与前物种相似。栖息地：森林、森林边缘、次生林和香蕉园。分布：菲律宾东部和南部特有。\n\
  \n### 7 浅色食蜜鸟\n*Arachnothera dilutior* 13–16cm 野外记录：行为和习性推测与小食蜜鸟一致，曾被认为与其为同种。鸣声：推测与小食蜜鸟相似。栖息地：森林、森林边缘、次生林和耕地。分布：菲律宾西部巴拉湾岛特有。\n\
  \n### 8 厚喙食蜜鸟\n*Arachnothera crassirostris* 16–17cm 野外记录：从树冠层到林下层觅食，单只或成对活动；取食小型无脊椎动物和花蜜。鸣声：生硬、鼻音的\
  \ `chit-chit` 或 `chissie-chissie`，还有 `tch-tch` 和 `chek-chek-chek` 或类似音。栖息地：森林、森林边缘、次生林、香蕉园和园林。分布：栖息于苏门答腊和婆罗洲。\n\
  \n![image](img/page355.jpg)\n\n## 171 食蜜鸟类\n\n### 1 长嘴食蜜鸟\n*Arachnothera robusta*\
  \ 21–22cm 野外记录：主要在树冠层觅食。独居且具有攻击性。经常在高处鸣唱。鸣声：逐渐上扬的 `choi choi choi choi`……；叫声包括粗厉的\
  \ `chuu-luut chuut-luut`以及飞行时高音的 `chit-chit-chit-chit`。栖息地：森林、次生林和种植园。分布：栖息于苏门答腊、爪哇和婆罗洲。\n\
  \n### 2 眼眼镜食蜜鸟\n*Arachnothera flavigaster* 21–22cm 野外记录：取食小型无脊椎动物、花蜜和小果实。在中层和上层觅食，单只或偶尔成对活动；果树上可能出现小群体。鸣声：高音的\
  \ `chit-chit` 和爆发性的 `tak`、`cha-tak`、`cha-ta-tak` 或变体。栖息地：开阔森林、次生林、次生灌丛、种植园和园林。分布：栖息于苏门答腊、爪哇和婆罗洲。\n\
  \n### 3 黄耳食蜜鸟\n*Arachnothera chrysogenys* 17–18cm 野外记录：动作敏捷。主要在树冠层觅食，在树皮和断枝中寻找无脊椎动物；也取食花蜜。成对、单只或偶尔成小群出现。鸣声：粗糙的\
  \ `chit` 和飞行时高音的 `twit-twit-twit-twee-ee`。栖息地：阔叶常绿林、森林边缘和次生林。分布：栖息于苏门答腊、爪哇和婆罗洲。\n\
  \n### 4 裸脸食蜜鸟\n*Arachnothera clarae* 17cm 野外记录：吵闹且显眼，单只或成对可见。喜好在芭蕉间觅食。鸣声：响亮、沙哑、重复的\
  \ `serp-rp-rp-rp-rp-rp-rp`、类似昆虫的 `seee`、低沉的咯咯声 `crrr`、快速的 `trrrik` 以及各种快速的颤音。栖息地：森林、森林边缘、空地和灌丛。分布：菲律宾特有。\n\
  \n### 5 灰胸食蜜鸟\n*Arachnothera modesta* 17–18cm 野外记录：活跃。在森林所有层级觅食，主要在低中层；成对或单只出现。鸣声：连续的\
  \ `tee-chu`，第一个音调上扬，第二个音调下降。栖息地：阔叶常绿林、次生林、耕地和园林。分布：栖息于苏门答腊和婆罗洲。\n\n### 6 斑纹胸食蜜鸟\n\
  *Arachnothera affinis* 21cm 野外记录：在森林较高层觅食，单只或偶尔成对活动。鸣声：`chee-wee-dee--weet`…… `tee-ree\
  \ chee chee-chur`，以及尖锐、响亮且刺耳的叫声。栖息地：低山森林、森林边缘和种植园周围。分布：爪哇和巴厘岛特有。\n\n### 7 婆罗洲食蜜鸟\n\
  *Arachnothera everetti* 21cm 野外记录：取食香蕉和姜（`Zingiber officinale`）的花蜜以及小型无脊椎动物。单只或成对出现。曾被视为前一种物种的亚种。鸣声：推测与前物种相似。栖息地：平原、低山和亚山地森林。分布：婆罗洲特有。\n\
  \n### 8 白头食蜜鸟\n*Arachnothera juliae* 16–18cm 野外记录：通常出现在树干上。在树顶觅食。鸣声：金属般的 `swee-swee`、粗厉的\
  \ `chink`；以及飞行时高音的啾啾声。栖息地：山地森林。分布：婆罗洲特有。\n\n![image](img/page57.jpg)\n\n## 172 食蜜\n\
  \n### 1 橄榄背食蜜\n*Prionochilus olivaceus* 9cm 野外记录：在林下层觅食，特别是有花期。经常加入混种群。鸣声：重复的、响亮的\
  \ `peeit`、高音的 `tsweet-tsweet` 和粗厉的 `peons`。栖息地：森林、次生林。分布：菲律宾特有。\n\n### 2 黄胸食蜜\n\
  *Prionochilus maculatus* 10cm 野外记录：在中层和上层觅食，单只或偶尔成对活动。鸣声：高音的 `tswik`、沙哑的 `peweet`。栖息地：平原、沼泽林、次生林、森林边缘。分布：栖息于苏门答腊和婆罗洲。\n\
  \n### 3 红胸食蜜\n*Prionochilus percussus* 10cm 野外记录：在中低层觅食。鸣声：`see-sik` 和快速的 `weg`。栖息地：原生林、次生林、森林边缘。分布：栖息于苏门答腊、爪哇和婆罗洲。\n\
  \n### 4 巴拉湾食蜜\n*Prionochilus plateni* 9cm 野外记录：在所有层级觅食，单只或偶尔成小群活动。鸣声：重复的、高音的、金属般的\
  \ `seep-seep`。栖息地：森林、次生林、灌丛和园林。分布：菲律宾西部特有。\n\n### 5 黄臀食蜜\n*Prionochilus xanthopygius*\
  \ 9cm 野外记录：在所有层级觅食；喜好果树和花树。鸣声：包括 `tsee-oo`、`ship-ship`、`ship-ship-ship` 或 `tsik-tsik`。栖息地：龙脑林、泥炭泽、石楠林和次生林、森林边缘、空地和种植园。分布：婆罗洲特有。\n\
  \n### 6 朱胸食蜜\n*Prionochilus thoracicus* 9cm 在所有层级觅食；有时爬树干，像鴴。鸣声：金属感的点击声啾鸣、极高音的类昆虫声\
  \ `seek` 和粗厉的 `chink`。栖息地：森林、森林边缘、次生林和海岸带植被。分布：栖息于苏门答腊和婆罗洲。\n\n### 7 金臀食蜜\n*Dicaeum\
  \ annae* 9–10cm 野外记录：喜好落蕊的花蜜、果实花粉；单只、成对或成小群出现。鸣声：重复的、细的、平调的 `see-see-see-see seeee\
  \ seeee seeee`。栖息地：落叶林、半常绿林和次生林、林地耕地。分布：小松群岛特有。\n\n\n\n\n\n# 8 厚嘴花雀 *Dicaeum agile*\
  \ 9–11cm\n生态习性：好动，习惯性地左右摇动尾巴；被开花或结果的树木和灌木吸引，尤其是寄生着花的植物。鸣声：发出 6–8 声音调不同的哨音，混合着干脆的颤鸣；叫声包括尖锐的\
  \ `chik-chik-chik-chik` 和 `titititiiili`。栖息地：森林和次生林。分布：栖于苏门答腊、爪哇、婆婆罗和小巽达群岛。\n\n\
  # 9 条纹花雀 *Dicaeum aeruginosum* 10–11cm\n生态习性：在树冠层觅食，主要在结果和开花的树木上，单只或成单物种或混合物种群活动。尾巴左右摇。曾被认为是前一种物种的亚种。鸣声：未记录。栖息地：森林、森林边缘和次生林。分布：菲律宾特有。\n\
  \n# 10 眼眼镜花雀 *Dicaeum* sp. nov 9–10cm\n生态习性：记录到在寄生花间觅食。新物种（2009 年发现）。鸣声：一系列高音、起伏的\
  \ `see see see` 哨音。栖息地：森林。分布：婆婆罗东北部特有。\n\n![image](img/page359.jpg)\n\n## 173 花雀类\n\
  \n# 1 褐背花雀 *Dicaeum everetti* 10cm\n生态习性：在所有高度层觅食，取食蜘蛛、昆虫和花朵，可能也吃花蜜和果实。鸣声：尖锐的金属感\
  \ `chip-chip`。栖息地：沿海 kerangas 砂林、次生林和森林边缘。分布：栖于婆婆罗。\n\n# 2 须嘴花雀 *Dicaeum proprium*\
  \ 9cm\n生态习性：在树冠层觅食，在开花和结果的树木上，单只或成群活动。鸣声：各种沙哑的、响脆的类昆虫音；偶尔发出如 `zaach-zee-peew` 的哨音；以及高频的嗡嗡声，有时会变成“歌声”。栖息地：森林、次生林。分布：菲律宾民兰特有。\n\
  \n# 3 黄腹花雀 *Dicaeum chrysorrheum* 9–10cm\n生态习性：在所有高度层活跃觅食，被寄生花和小无花果吸引。臀部为黄色。鸣声：包括\
  \ `zeet`、重复的 `chip-a-chip`、`zit-zit-zit` 和各种柔和的吱声。栖息地：阔叶常绿、半常绿和落叶林、次生林和花园。分布：栖于苏门答腊、爪哇、巴厘岛和婆婆罗。\n\
  \n# 4 黄侧花雀 *Dicaeum aureolimbatum* 8–9cm\n生态习性：成对、单只或成小群在开花或结果的树木上觅食。`laterale`\
  \ (4b) 见于桑岛。鸣声：包括 `s-uit`、5–6 声断续的 `tuk` 和尖锐清晰的 `zit-zit-zit`。栖息地：原生林和高大次生林、林地、灌木丛。分布：苏里腊锡特有。\n\
  \n# 5 绿冠花雀 *Dicaeum nigrilore* 9–10cm\n生态习性：喜欢开花和结果的树木以及寄生花。`diuatae` (5b) 见于民兰老东北部。鸣声：高音、沙哑\
  \ `zuti-zuti-zuti`……重复达 15 次、高音的 `tseep-tseep` 以及快速、起伏的高音颤鸣。栖息地：山地和山上森林。分布：民兰老南部特有。\n\
  \n# 6 焰冠花雀 *Dicaeum anthonyi* 9–10cm\n生态习性：在所有高度层觅食，尤其是开花和结果的树木。单只、成对或混合物种群活动。`kampalili`\
  \ (6b) 见于民兰老北部和南部。鸣声：高音、尖锐的 `srrreep`。栖息地：苔藓森林和森林边缘。分布：菲律宾北部特有。\n\n# 7 双色花雀 *Dicaeum\
  \ bicolor* 9cm\n生态习性：在树冠层觅食，单只、成对、小群或混合物种群活动。喜欢开花和结果的树木。鸣声：`swip-swip`……变成快速的颤鸣并变低变慢。栖息地：森林、森林边缘和次生林。分布：菲律宾特有。\n\
  \n# 8 宿务花雀 *Dicaeum quadricolor* 9cm\n生态习性：被开花的寄生花、树木和藤蔓以及结果树木吸引。鸣声：`seep-seep-seep\
  \ tik tik tik`、一系列 `tsip-tsip` 或 `trik-trik` 偶尔变为颤鸣、高音类昆虫 `see-ip` 和 `sit-sit-sit`。栖息地：开阔林和密林。分布：宿务岛特有。\n\
  \n# 9 红喙花雀 *Dicaeum australe* 10cm\n生态习性：主要在树冠层觅食，尤其是结果树木和寄生花。成小群、成对或单只活动。鸣声：高音类昆虫\
  \ `suit`、`tik-tik` 变为颤鸣。栖息地：森林、森林边缘、次生林、椰子林。分布：菲律宾特有。\n\n# 10 黑带花雀 *Dicaeum haematictum*\
  \ 10cm\n生态习性：在开花和结果的树木上觅食，通常在较高层；单只、成对或成群活动。鸣声：`chimp chimp`、`seet-seet` 随后是短颤鸣。栖息地：森林、森林边缘、次生林、园林。分布：菲律宾特有。\n\
  \n![image](img/page61.jpg)\n\n## 174 花雀类\n\n# 1 朱领花雀 *Dicaeum retrocinctum* 10cm\n\
  生态习性：喜欢寄生花和开花树木，通常在较高层；单只、成对或成群活动。鸣声：连续的 `tipk-tipk-tipk-tipk` 或 `zeet zeet`。栖息地：闭冠林、森林边缘、园林。分布：菲律宾特有。\n\
  \n# 2 橙腹花雀 *Dicaeum trigonigma* 9cm\n生态习性：主要在树顶觅食，尤其是花朵或果实上。`xanthopygium` (2b)\
  \ 见于菲律宾北部；`cinereulare` (2c) 见于菲律宾部和南部；`dorsale` (2d) 见于菲律宾西部。鸣声：一系列上升的快速上滑音；叫声包括一个\
  \ `swit` 或 `swit-szee`、拉长的 `zeeeee`、一系列喘息声和啾鸣、`zit-zit-zit`、`chik-chik-chik` 和高音的\
  \ `zeeeep-zeeeep`。栖息地：森林空地和边缘、次生林和花园。分布：栖于苏门答腊、爪哇、巴厘岛和婆婆罗。\n\n# 3 嗡嗡花雀 *Dicaeum\
  \ hypoleucum* 8–9cm\n生态习性：在所有高度层觅食，取食果实、花蜜和花粉。单只、成对、成小群或作为混合物种群的一部分。`obscurum` (3b)\
  \ 见于吕宋中部、南部以及卡塔杜安岛。鸣声：高音、嗡嗡的 `bzeeeppp`，单只或连续发出，偶尔随后是颤鸣的 `cheenjet`；还发出金属感的 `chimp\
  \ chimp` 并变为颤鸣。栖息地：森林、森林边缘、园林和灌木丛。分布：菲律宾特有。\n\n# 4 平纹花雀 *Dicaeum minullum* 7–9cm\n\
  生态习性：在所有高度层活跃且敏捷的觅食者，被寄生花的朵和果实吸引。鸣声：高音颤鸣；叫声包括啾鸣、尖锐的 `chek`、滴答的 `chrik` 和 `tik-tik-tik`。栖息地：阔叶常绿、半常绿和落叶林以及次生林。分布：栖于苏门答腊、爪哇、巴厘岛和婆婆罗。\n\
  \n\n\n\n\n# 5 极小花蜜雀 `Dicaeum pygmaeum` 8cm\n野外记录：在高层林下或冠层中在花穗形寄生植物间觅食；单只、小群或在混物种群中出现。`D.\
  \ p. davao` (5b) 分布于菲律宾南部；`D. p. palawanorum` (5c) 见于菲律宾西部。声音：响亮、尖锐且间距不规则 `tip tip`……，几乎连续重复；还有高音的\
  \ `schenk-schenk`……以及 `zip-zip`…… `zip-zip`…… `zip-zip`。栖息：森林、森林边缘和次生林。分布：菲律宾特有。\n\
  \n# 6 绯冠花蜜雀 `Dicaeum nehrkorni` 8–9cm\n野外记录：主要在冠层中的果实树上觅食，单只或成对，并作为混物种觅食群的一部分。声音：尖锐的\
  \ `zit-zit`、重复且响亮的 `tit` 以及高音的、类昆虫的颤鸣。栖息：丘陵和山地森林及森林边缘。分布：苏拉威锡特有。\n\n# 7 焰胸花蜜雀 `Dicaeum\
  \ erythrothorax` 9cm\n野外记录：成小群结或单只出现，在冠层中的果实树上觅食。声音：重复的 `tcheep tcheep tcheep`。栖息：低地森林和河流地区的灌木丛。分布：马鲁鹿群岛的布鲁岛特有。\n\
  \n# 8 哈马黑腊花蜜雀 `Dicaeum schistaceiceps` 9cm\n野外记录：曾被视为前一种物种的亚种；习性和行为被认为相似。声音：预计与前一种物种相似。栖息：原生林、退化林、开阔林和次生林、河流森林边缘、灌木丛和有树的耕地。分布：北马鲁古群岛特有。\n\
  \n# 9 灰腹花蜜雀 `Dicaeum vulneratum` 8–9cm\n野外记录：从低矮灌木丛到树顶觅食，单只、成对或作为混物种群的成员。声音：生硬、断续的\
  \ `tst`；歌曲由高音、金属感的双音节或三音节笔记组成。栖息：丘陵和沿海森林、森林边缘、种植园边缘和老园林。分布：南马鲁古群岛特有。\n\n![image](img/page363.jpg)\n\
  \n## 175 花蜜雀类\n\n## 1 黑额花蜜雀 `Dicaeum igniferum` 9cm\n野外记录：单只、成对、小群或作为混物种群的一部分出现。喜好开花树。声音：快速重复的高音\
  \ `see-saw`；歌曲由一系列非常快速的、下降的短促、纤细、干燥的音符组成。栖息：半落叶林、退化林或次生林、沿海季风灌木林、林木稀疏的耕地空地。分布：小巽达斯群岛特有。\n\
  \n## 2 蓝颊花蜜雀（红胸花蜜雀）`Dicaeum maugei` 8–10cm\n野外记录：单只或成对觅食；经常在寄生植物周围和果实树可见。声音：高音的\
  \ `tsit` 和高音的 2–3 音哨声。栖息：原生林、次生林和退化林、林地、种植园、林木茂密的耕地和竹林。分布：苏拉威锡南部岛屿和小巽达斯群岛特有。\n\n\
  ## 3 火胸花蜜雀 `Dicaeum ignipectus` 7–9cm\n野外记录：觅食活跃、敏捷；被寄生植物吸引。`D. i. beccarii` (3b)分布于苏门答腊。声音：高音的\
  \ `titty-titty-titty` 或类似音；叫声包括金属感的 `chip` 和颤鸣。栖息：山地森林和森林边缘。分布：苏门答腊和菲律宾。\n\n## 4\
  \ 黑侧花蜜雀 `Dicaeum monticolum` 8cm\n野外记录：在低层觅食，有时访问冠层；特别喜欢寄生植物的果实。声音：尖锐、穿透、金属感的 `zit`、重复的\
  \ `tit`、快速的滴答声和 `tsweet-tsweet`。栖息：丘陵龙眼、山地和石楠森林以及灌木丛。分布：婆罗洲特有。\n\n## 5 灰侧花蜜雀 `Dicaeum\
  \ celebicum` 8–10cm 野外记录：喜好冠层中的寄生植物；单只或成对觅食。`D. c. talautense` (5b) 分布于塔劳德岛；`D.\
  \ c. sulaense` (5c) 见于班盖岛和苏拉岛。声音：叫声包括纤细的上扬 `seeei`、重复的 `tjjit`、干燥的 `trri-tri`、高音的\
  \ `tsip` 以及飞行中尖锐的 `chip chip chip`……。栖息：原生林和高大次生林、森林边缘、林木稀疏的耕地和花园。分布：苏拉威锡以及班盖岛和苏拉岛特有。\n\
  \n## 6 血胸花蜜雀 `Dicaeum sanguinolentum` 8–10cm 野外记录：喜好冠层中的寄生植物；单只或成对觅食。`D. s. wilhelmae`\
  \ (6b) 分布于松巴岛；`D. s. hanieli` (6c) 见于提汶岛。声音：歌曲包括高音的点击声和响脆的颤鸣。栖息：山地森林和森林边缘。分布：留于苏门答腊、爪哇、巴厘岛和小巽达斯群岛。\n\
  \n## 7 寄生植物鸟 `Dicaeum hirundinace` 9cm\n野外记录：特别喜欢寄生植物；从低处到冠层觅食。通常成对或单只；偶尔加入混物种群。声音：干燥的\
  \ `tick` 音和嘶嘶的叫声。栖息：森林、森林边缘、红树林和村树。分布：东小巽达斯群岛。\n\n## 8 绯背花蜜雀 `Dicaeum cruentatum`\
  \ 9cm\n野外记录：在所有层级觅食，常在寄生植物中。声音：上升和下降的 `see-sip-see-sip` 和响亮的 `chipi-chipi-chipi\
  \ dzee-dzee-dzee`；栖息：开阔森林、森林边缘、次生林、红树林公园。分布：留于苏门答腊和婆罗洲。\n\n## 9 绯首花蜜雀 `Dicaeum trochileum`\
  \ 8–9cm\n野外记录：单只或成对觅食，特别是在冠层的寄生植物周围。声音：歌曲包含甜美、高音上升和下降的双音；叫声包括短促的高音 `zit-zit` 和颤鸣的\
  \ `seeeeep`…… `seeeeep`。栖息：林地、红树林、耕地、开阔灌丛区。分布：留于苏门答腊、爪哇、婆罗洲和兰莫卡。\n\n![image](img/page365.jpg)\n\
  \n## 176 雀形类\n\n### 鹦雀雀\n\n## 1 肉桂色伊本 15cm\n记录：活跃，在叶片和树枝上取昆虫。是混物觅食群的常见成员。声音：柔和的哨声\
  \ `chuuu`、`pee chuuu` 或 `pee chuuu chuuu`，通常由一群鸟发出。栖息：亚山地和山地苔藓森林及森林边缘。分布：菲律宾南部米兰老岛特有。\n\
  \n## 2 红腹雀（红云雀或草莓雀）10cm `Amandava amandava`\n记录：在地面或草穗上觅食，常成群；冬季群体更大，可能包含其他物种。声音：微弱的鸣声，以甜美的啾鸣音；叫声包括纤细的\
  \ `teei` 或 `tsi` 以及各种啾啾和吱吱声。栖息：沼泽草地、耕地、水边的芦苇和高草、次生林、灌木丛和花园。分布：留于爪哇、巴厘岛和小巽达斯群岛；引入婆罗洲和菲律宾。\n\
  \n## 3 斑胸雀 10cm `Taeniopygia guttata`\n野外记录：群性强，通常成多达 100 只的大群活动。在地面、草穗或植物中进食。\n\
  \n声音：歌曲由鼻音的叫声笔记穿插着嘈杂的颤鸣；叫声包括尖锐的 `tya`、`teea` 或 `tcheea`。栖息：稀疏树木的干旱草地或灌丛、林木稀疏的耕地和季风森林边缘。经常靠近水源。分布：留于小巽达斯群岛。\n\
  \n\n\n\n\n# 4 棕胸绿嘴鹦雀\n*Erythrura hyperythra* 10–11cm\n野外记要：在地上觅食种子和小型果实；通常成小群活动。鸣声：一系列柔和的音符，随后是四个如铃声般的音符；叫声包括飞行中的高音嘶嘶声\
  \ `tzit-tzit` 接触鸣。栖息地：原生林、竹林、森林边缘及相邻草原。分布范围：留栖于爪哇岛、婆罗洲、菲律宾北部、苏拉答锡和西小巽达群岛。\n\n# 5\
  \ 针尾鹦嘴雀\n*Erythrura prasina* 15cm\n野外记要：独居或成对觅食；也成小群活动，特别是在竹子结籽时。`E. p. coelica`\
  \ (5b) 于婆罗洲和菲律宾西部；黄色形态罕见。鸣声：一系列急促的叮哒声或啾鸣音符；叫声包括尖锐的 `teger-teter-terge`、高音的 `tseet-tseet`\
  \ 以及飞行中尖锐 `tzit-tzit zzit`。栖息地：竹丛、稻田、森林边缘和次生林。分布范围：留栖于苏门腊岛、爪哇岛、婆罗洲和菲律宾西部。\n\n# 6\
  \ 绿脸鹦嘴雀\n*Erythrura viridifacies* 12–13cm\n野外记要：成对、独居或小群觅食，在丰富的食物源处偶尔会有 100 多只聚集。鸣声：叫声包括\
  \ `tseet-tseet` 或 `tisi-tsit`；歌声由柔和的 `deedeedeedee`… 组成，随后是叽的 `day day day`，并以粗耳的\
  \ `grey-grey-grey-ray-day-lay-grey` 结束。栖息地：山地森林、森林边缘、竹林、草原和森林附近的灌木丛。分布范围：菲律宾特有种。\n\
  \n# 7 三色鹦嘴雀\n*Erythrura tricolor* 10cm\n野外记要：在地上、低矮灌木丛、竹林和树上觅食，独居、成对、小群或偶尔成大群。鸣声：尖锐而高频的颤音；叫声包括柔和的\
  \ `ti-ti-ti-ti`… `ti-ti-ti` 以及纤细、高音、嘶嘶的升调。栖息地：季风林、森林边缘和开阔地、林地、次生林、丛林、竹林和耕作区。分布范围：小巽达群岛特有种。\n\
  \n# 8 蓝脸鹦嘴雀\n*Erythrura trichroa* 12cm\n野外记要：独居、成对或小群觅食，范围从地面到冠层。偶尔加入混种觅食群。鸣声：叫声包括纤细而高音的\
  \ `tsit-tsit`、`ti-tu ti-tu-tu` 或 `t-t-t-t`。栖息地：山地森林、丘林和雨林、森林边缘、竹林、灌木丛和密集的次生林。分布范围：留栖于苏拉答锡和马鲁古群岛。\n\
  \n# 9 红耳鹦嘴雀\n*Erythrura coloria* 10–11cm\n野外记要：在地上、低矮植物中觅食，偶尔到达森林冠层，通常独居或成对。鸣声：叫声包括尖锐重复的\
  \ `tik`、尖锐的 `prrrt` 和颤音的 `tik-tik-tik-tik`。栖息地：山地森林、森林边缘、次生林、灌木、丛林、茂密的底层和高草。分布范围：菲律宾特有种。\n\
  \n![image](img/page367.jpg)\n\n## 177 ��雀\n\n### 1 白腹草��雀\n*Lonchura striata* 11–12cm\n\
  野外记要：取食小型种子。群居性——通常成小群遇到，繁殖季节后有更大的群。鸣声：一系列起伏的、啾啾的音符；叫声包括哀伤的 `peep` 和啾啾的 `tr-tr-tr`、`prrrit`\
  \ 或 `brrt`。栖息地：森林开阔地、次生林、灌木丛和草地。分布范围：留栖于苏门腊岛。\n\n### 2 爪哇��雀\n*Lonchura leucogastroides*\
  \ 10–11cm\n野外记要：在地上或低矮植物中觅食，通常成小群。鸣声：叫声包括短促的 `tit`、`p-tit`、`peteet` 或 `chirrup`。栖息地：耕区、红树林边缘、森林边缘草原、林地和花园。分布范围：留栖于苏门腊东部、爪哇、巴厘和小巽达群岛西部的兰莫岛。\n\
  \n### 3 褐��雀\n*Lonchura fuscans* 11cm\n野外记要：非常害羞且隐蔽，在地上和低矮植物中觅食。鸣声：叫声包括尖锐的 `pee\
  \ pee`、纤细的 `chirrup` 以及飞行中低沉的 `teck teck`。栖息地：稻田、草原、草地河岸、森林边缘、次生灌木、耕区和花园。分布范围：婆罗洲特有种。\n\
  \n### 4 黑脸��雀\n*Lonchura molucca* 10–11cm\n野外记要：取食草头种子和地上的种子；通常成对、独居或成小群出现。鸣声：短促的\
  \ `tri` 或 `t’sip`，或嗡嗡的 `tissip`；歌声包含连续喘息的 `peep`。栖息地：稻田。\n\n### 5 鳞纹胸��雀\n*Lonchura\
  \ punctulata* 10–12cm\n野外记要：成小群或大群觅食，在地上。鸣声：高音的叽叽 `weeeee`；叫声包括 `pseet`。栖息地：开阔草原、稻田。\n\
  \n### 6 白头��雀\n*Lonchura maja* 11cm\n野外记要：取食地上的小型种子或草头种子，通常成对或小群。鸣声：由一系列叮哒声组成，随后是长的\
  \ `weeeee heeheeheeheehee`；叫声包括柔和的 `preet` 或 `prit`。栖息地：开阔草原、沼泽、芦苇丛、稻田、耕区和村庄花园。分布范围：留栖于苏门腊、爪哇和巴厘。\n\
  \n### 8 白冠��雀\n*Lonchura ferruginosa* 11–12cm\n野外记要：取食草头种子，特别是水稻；常成大群出现。鸣声：由非常安静的叮哒声和喘息音符组成，随后是长的\
  \ `wheeee`；叫声带有哨音的 `veet`。栖息地：草原、稻田和湿地植物区。\n\n\n\n\n\n# 4 爪雀（爪哇雀）\n*Lonchura oryzivora*\
  \ 15cm 野外记录：以种子茎为食，或在地面觅食，成对或成小群活动。幼鸟通常呈棕褐色，脸部呈粉肉色，头部有深色冠羽。鸣声：铃铛般的颤鸣声和咔哒声，以长拉的哨声结束；叫声为\
  \ `tup` 或 `tack`。栖息地：草地、耕地和园林。分布：特产于爪哇和巴厘岛；已引入苏门答腊、婆罗洲、菲律宾、苏拉威锡和小巽达群岛。\n\n# 5 提汶爪雀\n\
  *Lonchura fuscata* 12cm 野外记录：成对或成小群觅食，主要在地面；经常栖息在树桩、电线杆和树上。鸣声：上升的 `chip chip chip\
  \ chip chipchipchipchipchip`；叫声包括 `tchik`、`tchuk` 和 `wheeee`。栖息地：退化的季风林和散有灌木与树木的草地。分布：特产于东巽达群岛。\n\
  \n# 6 树雀（欧亚树雀）\n*Passer montanus* 13–14cm 野外记录：通常成对出现，繁殖季节后有较大的群体；在地面、树木和灌木丛中觅食。鸣声：歌声由一系列叫声穿插着\
  \ `tsooit`、`tsveet` 或 `tswee-ip` 鸣声组成；叫声包括高频的 `chip`、尖锐的 `tet` 和干燥的 `tet-tet-tet`\
  \ 飞行叫声。栖息地：居住区周围，包括城镇和城市，以及林木稀疏地区和耕地。分布：该地区常见的留鸟。\n\n# 7 斑纹织雀\n*Ploceus manyar*\
  \ 14cm 野外记录：群居性，成群觅食和栖息；在散落的群落中繁殖。鸣声：高音哨声的颤鸣，以喘息般的音调结束；叫声包括雄性在展示羽毛时发出的 `re tre`\
  \ `cherrer cherrer` 以及飞行中的 `chirt-chirt`。栖息地：芦苇丛、芦苇沼泽、高草和季节性淹水地区。分布：留于爪哇。\n\n# 8\
  \ 亚洲金织雀\n*Ploceus hypoxanthus* 15cm 野外记录：群居性，在小群落中繁殖。鸣声：叽叽声，以长长的沙沙声结束；叫声为粗粗的 `chit`\
  \ 鸣声。栖息地：沼泽、稻田和淹水草地。分布：留于苏门答腊和西爪哇。\n\n# 9 爪哇织雀\n*Ploceus philippinus* 15cm 野外记录：群居性；成群栖息和觅食，通常与其他织雀在一起，并加入混物种群。鸣声：叽吱声，随后是喘息的哨声、嗡嗡声，最后是一些啾鸣；叫声为粗粗的\
  \ `chit`。栖息地：通常为靠近水的开阔地区，包括草地、散有树木的灌木丛、稻田、耕地和次生林。分布：留于苏门答腊、爪哇和巴厘岛；已引入婆罗洲。\n\n![image](img/page371.jpg)\n\
  \n## 1 金雀\n*Fringilla montifringilla* 15cm 野外记录：飞行时显示白色腰。非繁殖期雄性与雌性相似，但头部颜色深。在地面觅食，通常成群活动。鸣声：叫声包括鼻性的\
  \ `tsweek` 或 `zweee`，以及飞行叫声 `chuk-chuk`。栖息地：开阔森林和耕地。分布：菲律宾的过客鸟。\n\n## 2 山地金丝雀\n\
  *Chrysocorythus estherae* 12cm 野外记录：胆小且隐蔽，大部分时间静静地坐在低矮灌木丛或地面上，通常独居或成小群活动。`C`. `e`.\
  \ `mindanensis` (2b) 出现在菲律宾南部的民兰老岛；`C`. `e`. `renatae` (2c) 发现于苏拉威锡；橙色个体罕见。鸣声：叫声包括沉闷的金属质叽叽声；飞行时发出短促的叮当声。栖息地：高山和亚高山草地，以及散有灌木或矮丛的杜鹃植物草甸；在民兰老岛出现于山区雨林或矮矮杜鹃林。分布：留于苏门答腊、爪哇、菲律宾南部和西苏拉威锡。\n\
  \n## 3 贯雀（欧亚贯雀）\n*Spinus spinus* 12cm 野外记录：灵巧的觅食者，主要在树上活动；通常成小群遇到。鸣声：叫声包括哀伤的 `dlu-ee`、干燥的\
  \ `tet` 或 `tet-tet`，以及飞行中的 `twilit`、`tirrillili` 或 `titteree`。栖息地：开阔森林、森林边缘和次生林。分布：菲律宾的过客鸟。\n\
  \n## 4 叉嘴雀（红叉嘴雀）\n*Loxia curvirostra* 14cm 野外记录：群居性，通常成小群活动；动作敏捷，经常倒挂着从松果中提取种子。经常在小水池饮水。雄性羽色多变，某些鸟类仅染有红色。鸣声：快速的\
  \ `twit-twit-twit-twit` 和响亮的 `chirp`、`chi-chirp` 或 `chip-churp`。栖息地：松林。分布：留于菲律宾北部。\n\
  \n## 5 白颊红噪雀\n*Pyrrhula leucogenis* 15–17cm 野外记录：喧闹且引人注目；成对或成小群出现，繁殖季节后有更大的群体。鸣声：叫声包括响亮的\
  \ `peep-chup-chup` 和粗粗的 `chup`。栖息地：山地森林。\n\n## 6 黑头红噪雀\n*Pyrrhula leucogenis* 16cm\
  \ 野外记录：喧闹且显眼；成对或成小群出现。鸣声：叫声包括粗粗的 `chit` 和飞行时的 `chup`。栖息地：林地。\n\n## 7 林雀\n\n## 8\
