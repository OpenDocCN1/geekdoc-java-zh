- "# 菲律宾鸟类：苏门答腊、爪哇、巴厘、婆罗洲、苏拉威西、小巽达群岛和马鲁鲁克群岛（科林斯野外指南）\n\n\n\n![](img/cover.png)\n\n\
  # 献言\n\n我很荣幸将这本书献给 Isla, Ella 和 Jacob。\n\n\n![image](img/page008.jpg)\n\n# 引言\n\n\
  本书的格式遵循我的《古北区、西印度群岛、北美和格陵兰岛、印度和东南亚》系列丛书。\n\n尽管我的首要任务是制作一份“插图清单”（空间不允许我制作一份“全方位”的野外指南），但希望在这些页面中，我为寻找新鸟类时的关注点提供了有帮助的提示，并对已看到的鸟类进行了提醒。\n\
  \n书中的大部分文本基于我在前往新区域实地考察前记录的笔记。希望这些文字结合插图，能够帮助识别在大巽达腊群岛、菲律宾和华莱西亚（Wallacea）遇到的大多数鸟类。显然，对于一些较棘手的物种，可能需要参考更深入的著作（参见“进阶阅读”）。\n\
  \n我只希望通过这项工作，能够增加期待或记忆的乐趣，或许为这一广阔地区的鸟类增添一些额外的知识。\n\n# 涵盖的区域与物种\n\n本书涵盖了大巽达腊群岛、菲律宾和华莱西亚地区（*参见*地图）。虽然苏门答腊、爪哇西、巴厘岛和婆罗洲统称为大巽达腊群岛，但由于其规模巨大，我们决定单独称呼每一个岛屿。因为拥有许多小岛，菲律宾和华莱西亚采用了较为通泛的称呼，尽管华莱西亚已划分为苏拉威锡、小巽达腊群岛和马鲁古群岛（Maluku）。这看起来可能“不公平”，但在认为重要的情况下，会提到这些地区的个体岛或群岛。书中还包含了印度洋圣诞岛的特有种。\n\
  \n## 图谱\n\n图中使用的缩写和符号为：\n\n![image](img/male.jpg) = 雄性，![image](img/female.jpg)\
  \ = 雌性，`br` = 繁殖，`n` = 非繁殖。\n\n## 命名法\n\n主要遵循了国际鸟类学联盟（IOC）使用的命名法。在空间允许的情况下，恢复了一些不会引起太大困扰的旧名称。在正文中，我使用了大多数野外鸟友使用的英文名称。许多物种有当地名称，已在括号内。\n\
  \n## 鉴定\n\n插图应该是你识别鸟类所需的所有，但对于某些较棘手的物种，还需要“野外笔记”、“鸣声”和“分布”部分中的更多信息。\n\n### 野外笔记：由于需要保持文字极简，此部分很少提到从插图中显而易见的特征，例如，翅斑、喙形等。\n\
  \n### 鸣声：可能是鸟类出现的第一个信号。描述以*斜体*表示。在很难用文字准确重现鸟鸣或叫声时，此部分值得研究以获得感性的认识。\n\n### 栖息地：提到的主要栖息地偏好是物种繁殖的栖息地；如果合适，包含了冬季栖息地。\n\
  \n### 分布：主要是概括性的，因此应结合地图阅读。\n\n## 分布图\n\n许多物种提供了分布图，但迷候鸟、罕见鸟、文中已充分覆盖分布的物种、近期引入的物种以及大部分时间在海上或仅出现在离岸岛的物种除外。地图应作为物种在一年不同季节出现地点的大略指南。红色\
  \ ![image](img/red.jpg) 区域表示该物种夏季在繁殖地可能出现的地方；蓝色 ![image](img/blue.jpg) 显示其冬季非繁殖季节出现的地方；紫色\
  \ ![image](img/purple.jpg) 区域是该物种常年居住的地方。\n\n![image](img/page010.jpg)\n\n# 鸟类地理\n\
  \n![image](img/page011.jpg)\n\n# 区域地图\n\n![image](img/page012.jpg)![image](img/page015.jpg)\n\
  \n# 1 鎹鸵\n\n**1 南鎹鸵** *Casuarius casuarius* 130–170cm 野外笔记 幼鸟为褐色，裸露区域较暗，冠部较小。成鸟肉垂物和冠部的长度变化很大，且雌性的裸皮颜色更亮。害羞，通常独居。其踪迹通常通过橙色或紫色的粪便显露。鸣声：各种咕咕声、隆隆声、咆哮声和空洞的轰鸣声。栖息地\
  \ 低地森林和丘地森林。分布：居住在南马鲁古群岛的塞拉姆岛。\n\n![image](img/page017.jpg)\n\n# 2 鹤��; 丛林��鸡\n\n\
  \n\n\n\n### 1 雄尾鹤\n*Macrocephalon maleo* 55cm\n野外记录：通常成对出现，在地面上觅食；栖息或受惊时会利用树枝。鸣声：一种鼻腔的、震动的哀叫声，雌鸟通常以双音节的\
  \ `kuk-kuk` 回应。栖息地：低地和丘陵森林。在沙质森林地区或沙滩上进行集体繁殖。分布：苏拉威锡岛特有。\n\n### 2 马鲁古丛秧鸡（马鲁古苔雉）\n\
  *Eulipoa wallacei* 30cm\n野外记录：避开繁殖区；在地面觅食，通常为单只或成对。鸣声：一种低沉、颤抖的 `waaaaw`。栖息地：丘陵和山区森林。在沙滩上或沿海灌木丛的空地上集体繁殖。分布：居住在马鲁古群岛，从哈马黑拉岛南到布鲁岛和塞拉姆岛。\n\
  \n### 3 菲律宾丛秧鸡（菲律宾苔雉）\n*Megapodius cumingii* 32–38cm\n野外记录：行踪隐秘，通常在地面觅食时发现，单只或小群活动。通常仅在受惊时飞行。鸣声：长长的、哀的、拉长的尖叫声，据说像防空警报。在繁殖地发出类似鸡的咯咯声以及各种\
  \ `keeeee` 或 `kayooo` 声调。栖息地：沿海灌木丛、丘陵和山区森林。分布：居住在婆罗洲、菲律宾和苏拉威锡岛。\n\n### 4 苏拉丛秧鸡（苏拉苔雉）\n\
  *Megapodius bernsteinii* 35cm\n野外记录：在地面觅食，有单只、成对或小群活动。受惊时会短距离飞行。鸣声：与一种哀伤、沙哑的双音节哀叫声对唱，并伴有第二只鸟发出的更长的鼻腔笑声加入其中。栖息地：原生林到沿海灌木丛。分布：班盖盖岛和苏拉岛特有。\n\
  \n### 5 塔尼姆巴丛秧鸡（塔尼姆巴苔雉）\n*Megapodius tenimberensis* 35cm\n野外记录：胆小，通常单只或成对出现。多为听闻少见。鸣声：一种响亮的、上扬的\
  \ `kee-yu`，随后是一系列较短的、高频的 `keyu` 声调；第二只鸟加入一系列上升的 `kwou` 声调，以从几秒到几分钟不等的间隔重复。。栖息地：原生林、次生林和半常绿林。分布：东小巽达腊群岛的塔尼姆巴群岛特有。\n\
  \n### 6 灰暗丛秧鸡（灰暗色苔雉）\n*Megapodius freycinet* 35cm\n野外记录：相当常见。成对在地面觅食，发出持续的咯咯声。亚种\
  \ `M.` `f.` ``forsteni` (6b) 有时被视为独立物种，出现在南马鲁古群岛。鸣声：对唱，第一只鸟发出笑声般的、上升后下降的 `kejowowowowowowowowowowow`，第二只鸟以两个上升的\
  \ `keyou` 声调加入。栖息地：各种森林，包括原生林、高次生林和沼泽；也包括红树林、沼地种植园。分布：居住在马鲁古群岛。\n\n### 7 橙脚丛秧鸡\n\
  *Megapodius reinwardt* 35cm\n野外记录：在地面觅食，通常单只或成对；通过鸣声最易定位。受骚扰时，通常奔跑，但如果受惊则会飞到树枝上躲藏。鸣声：对唱，以一系列优美的音声调开始，随后是长长的、下降的、高频的、断续的\
  \ `krrr-uk-uk-uk-uk-krrr`。栖息地：多地，从低山森林到沿海灌木丛和红树林。分布：居住在小巽达群岛和东南部马鲁古群岛。\n\n![image](img/page019.jpg)\n\
  \n# 3 鸻鸭类\n\n## 1 小秧�\n*Tachybaptus ruficollis* 25cm\n野外记录：通常成对或小群出现。飞行时显示出白色二级羽。颜色较深的亚种\
  \ `T.` `r.` `tricolor` 出现在爪哇、苏拉威锡岛和小巽达腊群岛，有时被视为独立物种。鸣声：高频的哨鸣颤音和各种啾鸣。栖息地：有植被的湖泊、池塘和河流，以及沿海河口。分布：居住在爪哇、菲律宾、苏拉威锡岛和小巽达腊群岛。\n\
  \n## 2 澳洲小秧�（澳洲鸻）\n*Tachybaptus novaehollandiae* 23–27cm\n野外记录：通常成对或小群出现。飞行时，初级羽和二级羽上有大量白色。鸣声：一系列快速的颤鸣。栖息地：淡水湖泊、池塘和沼泽。分布：居住在爪哇、塔劳德岛和桑基黑岛。\n\
  \n### 3 大冠斑鸻\n*Podiceps cristatus* 46–51cm\n野外记录：飞行时显示出白色二级羽和白色前翅。鸣声：犬吠般的 `rah-rah-rah`\
  \ 以及各种咯咯声和低吼声。栖息地：湖泊、河流和避风的海域。分布：稀有的过候客。\n\n### 4 黑颈鸻\n*Podiceps nigricollis* 28–34cm\n\
  野外记录：额头较陡。飞行时显示出白色二级羽。鸣声：哨声般的 `poo-eeet` 和充满活力的颤音。栖息地：湖泊。分布：稀有过候客。\n\n### 5 小凤鸭\n\
  *Dendrocygna javanica* 38–42cm\n野外记录：通常成小群出现。经常栖息在树上。特征为黄色眼环。鸣声：飞行时发出细长的 `whi-whee`。栖息地：淡水水池。\n\
  \n### 6 游水鸭\n*Dendrocygna arcuata* 40–45cm\n野外记录：群性强，常成大群。特征为白色尾部。鸣声：高频啾鸣，以及通常在飞行时发出的高频哨声。栖息地：淡水沼泽、湖泊。\n\
  \n### 7 斑点鸭\n*Dendrocygna guttata* 43cm\n野外记录：通常成小群发现；经常上树。鸣声：粗的哨声 `whu-whei`。栖息地：小湖泊、沼泽、河口红树林。分布：居住在菲律宾、苏拉威锡岛和马鲁古群岛。\n\
  \n### 8 普通鸭（鸭）\n*Tadorna tadorna* 58–67cm\n野外记录：极易辨认。飞行时黑白相间。鸣声：雄鸟发出细长的哨声 `sliss-sliss`；雌鸟发出快速的鼻\
  \ `gag-ag-ag-ak`。栖息地：内陆湿地和沿海平滩。\n\n### 9 罗杰鸭\n*Tadorna radjah* 48cm\n野外记录：通常成对或小群出现；经常在泥岸或树枝上休息。从上方飞行时显示出巨大的白色前翅；下方为白色黑色初级羽。鸣声：飞行时，雄鸟发出响亮的上扬哨声，雌鸟发出粗糙的摩擦声或咕噜声。栖息地：湖泊、池塘、河流、小溪和沿海平滩。\n\
  \n### 10 红鸭\n*Tadorna ferruginea* 61–67cm\n野外记录：飞行时上下均显示出大量白色前翅。鸣声：鸣叫般的 `aakh`，以及重复的喇号般的\
  \ `pok-pok-pok-pok`。栖息地：大河和湖泊。\n\n### 11 白翅鸭\n*Asarcornis scutulata* 66–81cm\n野外记录：胆小且主要是夜性。飞行时显示出大量白色前翅。雌鸟与雄鸟相似但颜色暗。鸣声：通常保持沉默；飞行时可能发出哀的鸣叫，以鼻腔哨声结束。栖息地：沼泽森林和附近的湿地。\n\
  \n# 4 鸭类\n\n### 1 棉小鹅\n*Nettapus coromandelianus* 30–37cm\n野外记录：通常成对或小群可见。飞行时，雄鸟初级羽和二级羽基部有很多白色；雌鸟翅膀主要为深色。低空飞行，扇动频率浅。鸣声：雄鸟发出尖锐的咯咯声\
  \ `car-car-carawak`；雌鸟发出微弱的嘎嘎声。栖息地：有挺水植物的淡水湖泊和池塘。\n\n\n\n\n\n### 2 绿翅凤鸭\n*Nettapus\
  \ pulchellus* 32–36cm\n野外记录：通常成对或成小群出现，在浮叶植物间游动时容易被忽视。飞行时，显示出大面积的白色次级羽。鸣声：飞行时，发出尖锐的哨声般的\
  \ `tii-whit` 或 `whit`。栖息地：淡水湖泊、沼泽和河流，尤其是有浮生或沉水植物的地方。分布：苏答腊岛、南摩卢克群岛和小巽群岛的漂候或非繁殖访客。\n\
  \n### 3 绿鸭\n*Anas strepera* 46–55cm\n野外记录：通常成小群发现。飞行时，雄雌翅膀上均有明显的白色次级羽斑块。鸣声：雄性发出尖锐的\
  \ `ahrk` 和低沉的哨声；雌发出机械的嘎鸭声。栖息地：淡水湖泊和沼泽、沿海潟湖和河口。分布：稀见漂候。\n\n### 4 凤头鸭（欧亚凤头鸭）\n*Anas\
  \ penelope* 45–50cm\n野外记录：经常离开水面觅食。飞行时，雄性上翅上有大面积白色斑块，翅翅为灰色。鸣声：雄性发出清晰的哨声 `wheeooo`，雌性发出低吼的\
  \ `krr`。栖息地：湿草地、沼泽、湖泊、河流和沿海海域。分布：菲律宾的冬季访客；婆罗腊岛和苏答腊岛的漂候。\n\n### 5 绿鸭\n*Anas platyrhynchos*\
  \ 50–65cm\n野外记录：非繁殖期雄性与雌性相似，但喙呈暗黄色。鸣声：雄性发出沙哑的 `kreep`，雌性发出 `quack-quack-quack`。栖息地：湖泊、池塘、河流和河口。分布：在婆罗腊岛记录过的冬季漂候。\n\
  \n### 6 斑嘴鸭（印度斑嘴鸭或西斑嘴鸭）\n*Anas poecilorhyncha* 58–63cm\n野外记录：飞行时，上翅显示出独特的白色三级羽。鸣声：叫声与绿鸭非常相似。栖息地：植被茂密的湖泊、池塘和沼泽。分布：在菲律宾记录过的漂候。\n\
  \n### 7 菲律宾鸭\n*Anas luzonica* 48–58cm\n野外记录：通常成对或成小群出现；有时能看到 100–200 只的大群。鸣声：与绿鸭相似，但听起来更粗。。栖息地：湖泊、河流、沼泽和潮汐溪。分布：菲律宾的留鸟。\n\
  \n### 8 太平洋黑鸭\n*Anas superciliosa* 47–60cm\n野外记录：通常成对或成小群遇到。飞行时，显示出大面积的白色翅覆羽。鸣声：与绿鸭相似，但更沙哑。栖息地：各种湿地，包括湖泊、池塘、沼泽和河口。分布：苏门答腊、爪哇、苏答腊岛和小巽群岛的留鸟；婆罗腊岛的漂候。\n\
  \n### 9 琵嘴鸭（北或欧欧琵嘴鸭）\n*Anas clypeata* 44–52cm\n野外记录：通常成对或成小群出现。由于喙大，飞行时往往显得“头重脚轻”。雄性上翅显示淡蓝色的前翼和绿色翼斑，被一条白色翼带隔开，雌性翅膀颜色较暗。鸣声：通常保持沉默。栖息地：开放的淡水区域，较少出现在沿海潟湖和河口。分布：菲律宾和婆罗腊岛的冬季访客。\n\
  \n![image](img/page023.jpg)\n\n# 5 类鸭类\n\n### 1 巽达绿鸭\n*Anas gibberifrons* 42cm\n\
  野外记录：通常成对或成小群看到。雄性额头有明显的“隆起”。飞行时，上翅显示出白色中翼斑。鸣声：雄性发出清晰的 `pip`，雌性发出狂野的笑般的咯咯声。栖息地：小湖泊、沼泽、森林溪流、肥沃田地、泥滩和红树林。分布：爪哇、苏门答腊、巴厘岛、婆罗腊南部、苏答腊岛、苏拉和小巽群岛的留鸟。\n\
  \n### 2 灰绿鸭\n*Anas gracilis* 42cm\n野外记录：通常成对或成小群出现。与巽达绿鸭非常相似，但褐色较少；没有额头“隆起”。鸣声：雄性发出闷哨，雌性发出一系列快速、粗鲁的笑声嘎鸭声。栖息地：湖泊、沼泽、河流、潟湖和浅沿海海域。分布：南摩卢克群岛和小巽群岛不常见的访客。\n\
  \n### 3 凤尾鸭（北凤尾鸭）\n*Anas acuta* 51–56cm（雄性尾长 61–66cm）\n野外记录：群居性，可能与普通鸭混在一起。长脖和长尾使其飞行时看起来非常修长。鸣声：通常沉默，但雄性可能发出柔和的\
  \ `proop-proop`；雌性发出一系列软弱的嘎鸭声。栖息地：湖泊、沼泽、沿海潟湖和河口。分布：苏门答腊、爪哇、婆罗腊和菲律宾的冬季访客。\n\n###\
  \ 4 绿鸭（欧亚或普通绿鸭）\n*Anas crecca* 34–38cm\n野外记录：通常成对或成小群看到。飞行迅速，有许多扭转。鸣声：雄性发出柔和、高频的\
  \ `preep-preep`；雌性通常沉默，尽管受惊时可能发出鼻性的嘎鸭声。栖息地：湖泊、池塘、沼泽和河口。分布：从婆罗腊岛记录的冬季漂候。\n\n### 5\
  \ 菱鸭\n*Anas querquedula* 37–41cm\n野外记录：群居性，常与其他物种混群。通常停留在植被中在在中觅食。鸣声：通常沉默，但雄性可能发出\
  \ `kerek`，雌性发出鼻性的嘎鸭声。栖息地：淡水湖泊。\n\n### 6 菱鸭（普通或欧亚菱鸭）\n*Ayya ferina* 42–49cm\n野外记录：通常群居性。飞行时呈浅灰色。鸣声：通常沉默。栖息地：大型开放湖泊，较少出现在内陆湖泊。分布：菲律宾的冬季访客。\n\
  \n### 7 贝鸭（贝鸭或西伯利亚白眼鸭）\n*Aythya baeri* 41–46cm\n野外记录：通常成对或成小群。飞行时，雄雌初级和次级羽均有白色横带。鸣声：通常沉默。栖息地：湖泊、沼泽。分布：菲律宾的漂候。\n\
  \n### 8 硬头鸭\n*Aythya australis* 42–59cm\n野外记录：通常成小群或大群出现。雄雌初级和次级羽均有白色横带。鸣声：通常沉默。栖息地：沼泽和植被丰富的湖泊；冬季偏好沿海潟湖。分布：苏答腊岛和小巽群岛的稀有记录。\n\
  \n### 9 苔鸭\n*Aythya fuligula* 40–47cm\n野外记录：通常群居性。飞行时，雄雌初级和次级羽均有明显的白色横带。鸣声：通常沉默，但在受惊起飞时可能发出低吼。栖息地：湖泊、河流和避风沿海海域。分布：婆罗腊岛和菲律宾的冬季访客。\n\
  \n### 10 海鸭（大海鸭）\n*Aythya marila* 40–51cm\n野外记录：通常群居性。飞行时，初级和次级羽上有白色翼带，雄性前翼为浅灰色。鸣声：通常沉默。栖息地：沿海海域，较少出现在内陆湖泊。分布：菲律宾记录的稀见漂候。\n\
  \n# 6 类雉类\n\n### 1 灰胸雉\n*Arborophila orientalis* 28cm\n野外记录：较少；推测成小群在落叶中觅食。鸣声：一系列单声哨声，后是双声啾啾哨声，声音逐渐变大。栖息地：原生山地森林的下层。分布：爪哇西部和中部的特有。\n\
  \n### 2 苏门答腊雉\n*Arborophila sumatrana* 28cm\n野外记录：较少；推测行为与前述物种相似。鸣声：与前述物种非常相似。栖息地：阔叶山麓和山林的茂密植被。分布：苏门答腊中部和南部特有。\n\
  \n### 3 卷雉\n*Arborophila rolli* 28cm\n野外记录：直到最近才被认为是前述物种的亚种；推测行为相似。鸣声：与灰胸雉相似。栖息地：茂密的森林下层。分布：苏门答腊北部特有。\n\
  \n\n\n\n\n# 4 爪哇腊雉（栗斑腹雉）\n*Arborophila javanica* 28cm\n野外要记：记录较少；推测与其他雉类一样，在落叶层中觅食。\n\
  鸣声：一系列传得很很远的双重鸣声，音量和节奏逐渐加快。\n栖息地：丘陵和山地森林。\n分布：爪哇腊岛特有。\n\n# 5 婆罗洲山雉（红胸雉）\n*Arborophila\
  \ hyperythra* 27cm\n野外要记：在灌木丛、森林小径和河河流平滩上成群觅食。深色下巴的亚种 `A*.`h*.`erythrophrys` (5b)\
  \ 出于婆罗洲东北部的山区地区。\n鸣声：重复的、响亮的 `chii`，音量和节奏逐渐加快，并有低沉的双音回应。\n栖息地：灌木丛，包括次生林和原生丘陵及山地森林林层中的竹林。\n\
  分布：婆罗洲岛特有。\n\n# 6 红嘴雉\n*Arborophila rubrirostris* 29cm\n野外要记：成小群出现，在多苔藓的山谷和茂密的林下层中觅食。\n\
  鸣声：响亮的哨声般的 `keow`，音调和音量逐渐升高。\n栖息地：中、低海拔山地森林。\n分布：苏门答腊岛北部和西部特有。\n\n# 7 栗颈雉\n*Arborophila\
  \ charltonii* 26–32cm\n野外要记：在次生灌木丛和森林边缘成小群觅食。\n鸣声：哨声般的 `pi pi pi`，由带有哨声的 `u` 音 `pi-u\
  \ pi-u` 回答；还会发出短促、流动的鸣叫。\n栖息地：低地森林和灌木丛。\n分布：栖于苏门答腊北部和婆罗洲北部。\n\n# 8 火褐雉\n*Caloperdix\
  \ oculeus* 23–27cm\n野外要记：在森林地面觅食，有独居、成对或有时成较大群的情况。\n鸣声：上升的 `pi-pi-pi-pipipipipipi`，重复\
  \ 8–9 次，随后是类似金属碰撞的 `dit-duit dit-duit`；雌鸟以许多快速、升高的哨音作为回应。\n栖息地：次生灌木丛、常绿林和半常绿森林。\n\
  分布：栖于苏门答腊岛和婆罗洲岛。\n\n# 9 红头雉\n*Haematortyx sanguiniceps* 25cm\n野外要记：在森林地面觅食，经常在森林小径偶遇。\n\
  鸣声：粗哑、高调的 `KRO-krang`，重复多次；还会发出粗鲁的咯咯声。\n栖息地：低海拔山地森林、石楠林以及生长在山谷底部沙质土壤上的贫瘠森林。\n分布：栖于婆罗洲岛。\n\
  \n# 10 凤冠雉\n*Rollulus rouloul* 25cm\n野外要记：通常成对出现，在森林地面的落叶层中觅食。\n鸣声：长串哀伤的 `si-ul`\
  \ 哨声，第二个音音调较高，通常在清晨或傍晚。\n栖息地：通常为低地和丘陵森林，也有记录出现在邻近的棕榈林。\n分布：栖于苏门答腊岛和婆罗洲岛。\n\n![image](img/page027.jpg)\n\
  \n# 7 凤鸡类；雉类；丛鸡；雉类\n\n### 1 中国斑腹凤鸡\n*Francolinus pintadeanus* 31–34cm\n野外要记：在地面觅食。非常警觉，尽管经常从开阔的栖息处发出鸣叫。\n\
  鸣声：粗哑、金属感的 `kak-kak-kuich ka-ka` 或 `wi-ta-tak-takaa`，通常在长时间停顿后重复。\n栖息地：混有树木和灌木的草地。\n\
  分布：引入菲律宾，目前可能已灭绝。\n\n### 2 达里安雉（蒙古雉或胡须雉）\n*Perdix dauurica* 28–30cm\n野外要记：通常成小群出现，在地面觅食。\n\
  鸣声：各种吱吱的鸣声。\n栖息地：混有树木和灌木的草地。\n分布：引入菲律宾，目前可能已灭绝。\n\n### 3 黑环雉\n*Melanoperdix niger*\
  \ 24–27cm\n野外要记：害羞，通常以成对形式在森林地面觅食，几乎没有其他记录。\n鸣声：低沉、吱吱的接触性鸣声；也可能发出清脆的双音哨声。\n栖息地：低地原生森林和泥炭沼泽森林。\n\
  分布：栖于苏门答腊岛和婆罗洲岛。\n\n### 4 长嘴雉\n*Rhizothera longirostris* 30–35cm\n野外要记：在地面觅食，受惊时会飞到树枝休息，否则记录极少。\n\
  鸣声：二重唱式的、如铃声般的 `ti-ooah-whee`，长时间重复。\n栖息地：低地原生森林。\n分布：栖于苏门答腊岛和婆罗洲岛。\n\n### 5 霍瑟雉（杜立特雉）\n\
  *Rhizothera dulitensis* 30–35cm\n野外要记：记录极少，推测行为与长嘴雉相似。\n鸣声：未有记录。\n栖息地：山地森林。\n分布：婆罗洲东北部特有。\n\
  \n### 6 红原丛鸡\n*Gallus gallus* 雄性 65–78cm，雌性 41–46cm\n野外要记：通常为独居或成对出现，偶尔成家族群出现。\n\
  鸣声：白尾亚种 `L*.`i`.`rufa` (1b) 出于苏门答腊（除东南外）；像公鸡一样带有更尖锐的哨声。\n栖息地：森林、茂密灌木丛。\n分布：栖于苏门答腊、婆罗洲和爪哇群。\n\
  \n### 7 绿丛鸡\n*Gallus varius* 雄性 65–75cm，雌性 42–46cm\n野外要记：通常独居或成小群出现，在清晨或傍晚出现在开阔区域。\n\
  鸣声：雄鸟发出三音节的 `cha-aw` 伴随着缓慢的 `wok-wok`；雌鸟发出快速的 `cack` 或 `wok`。\n栖息地：林地、林缘或农田。\n分布：栖于爪哇、巴厘岛和小群岛。\n\
  \n### 8 萨尔瓦达雉\n*Lophura inornata* 46–55cm\n野外要记：稀有，记录极少，可能成对出现。\n鸣声：雄鸟在繁殖季节发出咯咯声。\n\
  栖息地：植被茂密的山地。\n分布：苏门答腊西部特有。\n\n### 9 霍格华雉（阿奇赫雉）\n*Lophura hoogerwer* 40–50cm\n野外要记：行为推测类似于萨尔瓦达雉，通常被认为是同物种。\n\
  鸣声：未知，可能类似于萨尔瓦达。\n栖息地：山地森林。\n分布：苏门答腊北部特有。\n\n![image](img/page29.jpg)\n\n# 8 雉类；雉鸡\n\
  \n### 1 冠凤尾\n*Lophura ignita* 雄性 65–70cm，雌性 56–57cm\n野外要记：非常警觉，通常成小群出现。白尾亚种 `L*.`i`.`macartneyi`\
  \ (1c) 出于苏门答腊东。\n鸣声：雄鸟发出低沉的 `woonk-k`，伴随着振翅声。受惊时发出尖锐的 `chuken`。\n栖息地：低地森林。\n分布：栖于苏门答腊。\n\
  \n### 2 无冠凤尾\n*Lophura eryththalma* 雄性 47–50cm，雌性 42–44cm\n野外要记：警觉，成小群在森林地面觅食，推测为一雄多雌。亚种\
  \ `L*.`e`.`pyronota` (2b) 出于婆罗洲。\n鸣声：喉部震动的 `purr` 和重复的 `tak-takuru` 或 `tooktar`。受惊时发出响亮的\
  \ `kak`。求偶时会振翅。\n栖息地：原生低地森林。\n分布：栖于苏门答腊和婆罗洲。\n\n### 3 伯华雉\n*Lophura bulweri* 雄性\
  \ 77–80cm，雌性 55cm\n野外要记：被认为成对或小家族出现。在壮观的展示中，雄鸟会极伸肉垂并张开尾羽。\n鸣声：繁殖季节发出尖锐的穿透力叫声。其他鸣声包括金属感的\
  \ `kook kook` 和独特的 `bek-kia`。\n栖息地：原生丘陵和亚山地森林。\n分布：婆罗洲特有。\n\n### 4 铜尾锦尾雉（苏门答腊锦尾雉）\n\
  *Polyplectron chalcurum* 雄性 56cm，雌性 40cm\n野外要记：非常害羞且警觉，推测成对形式在森林地面觅食。\n鸣声：雄鸟发出粗哑、响亮且传远的\
  \ `karau-karau-karau`。\n栖息地：山地森林。\n分布：苏门答腊西部特有。\n\n### 5 婆罗洲锦尾雉\n*Polyplectron schleiermacheri*\
  \ 雄性 50cm，雌性 36cm\n野外要记：记录极少，在森林地面安静觅食；展示时会张开翅膀。\n鸣声：忧郁的 `hor-hor` 或 `wu-wurh`。接触鸣声是响亮的\
  \ `cack cack`。\n栖息地：原生低地雨林。\n分布：婆罗洲特有。\n\n\n\n\n\n### 6 爪罗湾蓝尾雉\n*Polyplectron napoleonis*\
  \ 雄性 50cm，雌性 40cm。野外记事：行踪隐秘。记录中雄性单只觅食，雌性成小群觅食，最好通过鸣声或整洁的展示性“挖掘痕”来定位。鸣叫声：粗哑、尖锐的 *auukk*、*kratt*\
  \ 和 *ka-reeeetch*，还有双音的、秋千般的 *krotchh-kritchh*，听起来像木头敲击金属管。栖息地：森林覆盖的山坡。分布范围：菲律宾爪罗湾岛特有。\n\
  \n### 7 大蓝斑雉\n*Argusianus argus* 雄性 160–200cm，雌性 72–76cm。野外记事：警觉，即使受到轻微扰动也会进入灌木丛。在早晨和傍晚觅食，一天其余大部分时间在树上休息。最好通过鸣声或展示性“挖掘痕”来定位。鸣叫声：独特的、重复的\
  \ *kwoow-wow* 和一段节奏性的 *wow*，不断重复且音调逐渐升高，给人一种兴奋感高涨的感觉，然后突然停止。栖息地：丘陵和低地森林。分布范围：栖息于苏门答腊和婆罗洲。\n\
  \n### 8 绿尾雀\n*Pavo muticus* 雄性 180–300cm，雌性 100–110cm。野外记事：极易辨认。胆小且隐秘。在栖息地鸣叫时最容易发现。倾向于在水源附近觅食。鸣叫声：重复的、号角般的\
  \ *ki-wao* 或 *yee-ow*。受惊时，会发出重复的 *tak tak ker-r-r-r oo oo ker-r-r-oo*。雌性发出响亮的 *AOW-aa\
  \ AOW-aa*。栖息地：森林边缘和草原树木林。分布范围：栖息于爪哇岛。\n\n![image](img/page031.jpg)\n\n# 9 鹌类；斑鹌\n\
  \n#### 1 日本鹌（亚洲迁鹌）\n*Coturnix japonica* 17–19cm。野外记事：害羞且躲闪。非繁殖羽期，红褐色的脸部常被浅色羽毛遮盖。鸣叫声：急促的\
  \ *chrr-chuerrk-churr*，受惊时发出波动的 *tree-tree*。栖息地：起伏的草原、农田、山地丘陵和森林空地。分布范围：冬季候客，在菲律宾有记录。\n\
  \n#### 2 褐斑鹌\n*Coturnix ypsilophora* 19cm。野外记事：通常以 3–11 只鸟的小群形式出现，通常行踪诡秘，但偶尔有记录在清晨或傍晚沿路边觅食。*C*.\
  \ *y*. *pallidor*（主图）分布于小巽达群岛的松巴岛和萨武岛；栗色亚种 *C*. *y*. *raaltenii* (2b) 分布于小巽达群岛东部到西部。鸣叫声：*C*.\
  \ *y*. *raaltenii* 亚种发出 *er-errrrrrhh*，拉长的部分带有上扬。受惊的 *C*. *y*. *pallidior* 亚种发出响亮的\
  \ *trrriup trrriup*。栖息地：茂密的草原、潮湿地区、稀疏灌丛和过度生长的花园。分布范围：栖息于小巽达群岛。\n\n#### 3 大鹌（蓝胸鹌）\n\
  *Excalfactoria chinensis* 12–15cm。野外记事：害羞隐秘，最常在奔跑或浴尘时观察。通常成对或小群出现，在茂密的草丛中像鼠一样穿梭，停下觅食后再继续奔跑。鸣叫声：哨般的\
  \ *ti-yu ti-yu ti-yu ti-yu ti-yu or ti-ti-yu*。受惊时发出微弱的 *tir-tir-tir* 或一组尖锐的啾声。栖息地：灌木丛和沼泽草原、耕地和灌木丛生的植被。分布范围：栖息于苏门答腊、爪哇、婆罗洲、菲律宾和华拉开西亚。\n\
  \n#### 4 小斑鹌（普通斑鹌或小斑鹌）\n*Turnix sylvaticus* 15–16cm。野外记事：隐秘；通常采取蹲伏觅食姿态，但在穿过开阔地时可以非常直立。鸣叫声：低沉、嗡嗡的\
  \ *hoooo hoooo hoooo*，还有各种沙沙声、低音调鸣声。栖息地：草原、灌丛和耕地边缘的草地。分布范围：栖息于爪哇、巴厘岛和菲律宾。\n\n####\
  \ 5 红背斑鹌\n*Turnix maculosus* 12–16cm。野外记事：行为和习惯与小斑鹌相似。鸣叫声：深沉、传远、低沉的 *oom oom oom…*。栖息地：密草、草本灌丛和耕地。分布范围：遍布各处，在华拉开西亚呈斑状分布。\n\
  \n#### 6 斑斑鹌\n*Turnix ocellatus* 17–18cm。野外记事：害羞隐秘。在地面觅食，经常在森林土径上可见；若受扰，倾向于消失在掩体中，但也有记录在观察者旁无所谓地觅食。鸣叫声：据说雌性发出低沉的轰鸣，其他较少为人。栖息地：非常多样，包括灌丛、干旱峡谷、森林边缘和花园。分布范围：菲律宾特有。\n\
  \n#### 7 斑纹斑鹌\n*Turnix suscitator* 15–17cm。野外记事：单只或成对出现；经常沿土路或公路上觅食。受惊时会陡升飞起并进入掩体。鸣叫声：深沉的\
  \ *groo groo*，随后是持续几秒的 *krrrr*。栖息地：草原、灌丛、森林边缘和次生林。分布范围：栖息于苏门答腊、爪哇、巴厘、菲律宾、苏拉威西和小巽达群岛。\n\
  \n#### 8 沃塞斯特斑鹌\n*Turnix worcesteri* 12–14cm。野外记事：较少为人，推测行为与菲律宾斑鹌相似。鸣叫声：响亮的、断续的\
  \ *kikikikikikikiki*。栖息地：高海拔地区。分布范围：菲律宾特有。\n\n#### 9 松巴斑鹌\n*Turnix everetti* 14cm。野外记事：成对觅食，行为可能与其它斑鹌相似。鸣叫声：未有记录。栖息地：灌木草原。分布范围：松巴岛特有。\n\
  \n![image](img/page031.jpg)\n\n# 10 蜜鹃；斑斑鹌；啄雀\n\n#### 1 马来亚蜜鹃\n*Indicator archipelicus*\
  \ 16–18cm。野外记事：经常静止不动，通常在蜂巢中可见。鸣叫声：鸣声，随后是上升的沙沙声。栖息地：低地原生森林。分布范围：栖息于苏门答腊和婆罗洲。\n\n\
  #### 2 斑点斑鹌\n*Picumnus innominatus* 10cm。野外记事：敏捷的觅食者，也会在空中出击捕食昆虫。通过持续的啄木发现踪迹。鸣叫声：高调的\
  \ *ti-ti-ti-ti* 和吱吱的 *sik*；带有持续的 *brr-r-r*。栖息地：原生森林。分布范围：栖息于北婆罗洲和苏门答腊。\n\n#### 3\
  \ 红颊斑鹌\n*Sasia abnormis* 8–10cm。野外记事：活跃的觅食者，单只或小群出现。鸣叫声：高调的 *kik-ik-ik-ik*；以及尖锐的\
  \ *tic* 或 *tsit*。栖息地：原生森林；在婆罗洲喜爱密集的植被。分布范围：栖息于苏门答腊和爪哇。\n\n#### 4 苏拉威西小啄雀\n*Yungipicus\
  \ temminckii* 13cm。野外记事：单只或成对出现；从中层到冠层觅食。鸣叫声：略微下降的鼻音鸣声。栖息地：原生森林和高次生林、森林边缘和红木种植园。分布范围：苏拉威西特有。\n\
  \n#### 5 菲律宾小啄雀\n*Yungipicus maculatus* 14cm。野外记事：单只或成对出现；经常加入混合物觅食群。鸣叫声：响亮的、断续的、略微下降的鸣声。栖息地：原生和次生森林、云林、森林边缘和红木种植园。分布范围：菲律宾特有。\n\
  \n#### 6 苏禄小啄雀\n*Yungipicus ramsayi* 14cm。野外记事：行为推测与菲律宾小啄雀相似，后者常被视为同种。鸣叫声：响亮的、断续的\
  \ *kikikikikikikiki*。栖息地：森林和红树林。分布范围：苏禄群岛特有。\n\n#### 7 巽小啄雀\n*Yungipicus moluccensis*\
  \ 14–15cm。野外记事：在树木上层觅食；有时是混合物觅食群的成员。鸣叫声：高调的鸣声或旋转的 *trrrrr-i-i*。栖息地：各种林地，包括红树林、原生和次生森林、海岸森林和沿海花园。分布范围：栖息于苏门答腊、爪哇、婆罗洲和小巽达群岛西部。\n\
  \n\n\n\n\n## 8 灰冠小啄木\n`Yungipicus canicapillus` 14–16cm 野外记录：动作敏捷，经常在树木和灌木丛顶端倒挂。鸣声：一种沙哑的\
  \ `tit-erh-r-r-r-r-h` 声，通常以 `kik` 或 `pit` 开始；还会发出尖锐的 `kweek-kweek-kweeek`。栖息地：山和低地森林。分布：留栖于苏门答腊和婆罗洲。\n\
  \n## 9 斑胸啄木\n`Dendrocopos analis` 18–19cm 野外记录：通常单只出现、成对或成小群出现，在树干和树枝上觅食。鸣声：清脆的\
  \ `tuk-tuk` 声和颤音般的 `tirri-tierrier-tierrierie`。习性：开阔森林、次生林、种植园和花园。分布：留栖于苏门答腊、爪哇和巴厘岛。\n\
  \n## 10 棕颈啄木\n`Meiglyptes tukki` 21cm 野外记录：通常单只出现在中下层，也是混种觅食群的常客。经常在低矮的树桩和倒木上觅食。鸣声：高频的颤音\
  \ `kirr-r-r` 和高音调的 `ti-ti-ti-ti-ti`。栖息地：原生和次生低地森林。分布：留栖于苏门答腊和婆罗洲。\n\n## 11 棕臀啄木\n\
  `Meiglyptes tristis` 17–18cm 野外记录：活跃的觅食者，通常成对或作为混种觅食群成员出现。`M`. `t`. `grammithorax`\
  \ (11b) 出于苏门答腊和婆罗洲。鸣声：柔和的沙哑 `drrrrr…`，还有 `pit` 或 `pit-pit`。栖息地：低地和丘陵森林，以及开阔海岸森林。分布：留栖于苏门答腊、爪哇和婆罗洲。\n\
  \n## 12 灰棕啄木\n`Hemicircus concretus` 13–14cm 野外记录：在树冠觅食，在树枝和叶簇间快速移动；通过叫声最好定位。`H`.\
  \ `c`. `sordidus` (12b) 出于苏门答腊和婆罗洲。鸣声：高音且拉长的 `kiyow` 或 `kee-yew`，以及震动的 `chitter`。栖息地：原生和次生低地及丘陵森林，以及种植园和偶尔花园。分布：留栖于苏门答腊、爪哇和婆罗洲。\n\
  \n![image](img/page035.jpg)\n\n## 11 啄木类\n\n### 1 红腹啄木\n`Micropternus brachyurus`\
  \ 25cm 野外记录：通常成对或小家庭群出现，挖掘蚁巢或白蚁巢；觅食范围从地面到树冠。鸣声：高音且鼻音的 `kenk kenk kenk` 或 `kweep-kweep-kweep`。据说其咚木声听起来像熄火的摩托车。栖息地：原生和次生森林、森林边缘、种植园和花园。分布：留栖于苏门答腊、爪哇和婆罗洲。\n\
  \n### 2 白腹啄木\n`Dryocopus javensis` 40–48cm 野外记录：通常单只、成对或成小群出现。喧闹。在所有高度层觅食。鸣声：笑声般的\
  \ `kek-kek-kek-kek-kek…` 或 `kiau-kiau-kiau-kiau…`；还会发出尖锐的 `kiyow`、`kyah` 或 `keer`。咚木声响亮且愈快。栖息地：原生及偶尔的次生低地和丘陵森林，亦记录于红林。分布：留栖于苏门答腊、爪哇（稀见）、巴厘岛（稀见）、婆罗洲和菲律宾。\n\
  \n### 3 斑纹啄木\n`Chrysophlegma miniaceum` 25–27cm 野外记录：不显眼，通常看到单只或成对出现在各高度的大树干上觅食。鸣声：尖叫的\
  \ `kwee` 或 `kwee kwee kwee`，还有哀伤且下降的 `peew`。栖息地：从海岸森林到山地森林。分布：留栖于苏门答腊、爪哇（稀见）和婆罗洲。\n\
  \n### 4 斑喉啄木\n`Chrysophlegma mentale` 26–30cm 野外记录：通常看到单只或成对从林下层下层到高层觅食。有时加入混种觅食群。鸣声：长的一系列\
  \ `wi` 音调；叫声包括 `kyick` 和 `kiyee… kiyee… kiyee`。栖息地：低地、丘陵和山区的原生森林。分布：留栖于苏门答腊、西爪哇和婆罗洲。\n\
  \n### 5 大黄颈啄木\n`Chrysophlegma flavinucha` 33–34cm 野外记录：通常看到成小松散的群体在树干和树枝上觅食；也在地面翻找寻找蚂蚁、白蚁和幼虫。鸣声：叫声包括长长的、加速的\
  \ `kwee-kwee-kwee-kwee-kwee-kwee-kwee-kwee-kwi-kwi-kwi-kwi-wi-wi-wi-wik`、响亮而哀怨的\
  \ `pee-u… pee-u` 以及金属质的 `chenk`。受骚扰时，发出笑声般的 `kwek-kwek-kwek-kwek…`。栖息地：中低山地森林、松林和次生林。\n\
  \n### 6 红翼啄木\n`Picus puniceus` 24–28cm 野外记录：通常单只或成对出现，有时加入混种觅食群。鸣声：单声的 `kik` 和单调的\
  \ `di-di-di-di-di`。栖息地：开阔森林。分布：留栖于苏门答腊。\n\n### 7 小黄颈啄木\n`Picus chlorophus` 25–28cm\
  \ 野外记录：通常成对出现；经常到地面。鸣声：长长的 `kwee-kwee-kwee-kwee-kwee-kwee-kwee-kwee-kwi-kwi-kwi-kwi-wi-wi-wi-wik`，以及类似的\
  \ `ui`。栖息地：中低山地森林。分布：留栖于苏门答腊。\n\n### 8 纹纹啄木\n`Picus vittatus` 30–33cm 野外记录：在地面觅食蚂蚁。飞行时显示黄黄色臀部。鸣声：清晰的哨声\
  \ `pew-pew` 以及单声的 `keep`。栖息地：原生和次生森林。分布：留栖于苏门答腊。\n\n### 9 灰头啄木\n`Picus canus` 26cm\
  \ 野外记录：在地面觅食蚂蚁和幼虫。飞行时显示亮红色臀部。鸣声：快速的 `pew`。栖息地：山地森林。分布：留栖于苏门答腊。\n\n![image](img/page037.jpg)\n\
  \n## 12 啄木类\n\n### 1 橄榄背啄木\n`Dinopium raffii` 28cm 野外记录：从林下层下层到高层觅食。通常成对出现。鸣声：慢的\
  \ `chak-chak-chak-chak`，还有类似但更快的叫声，以及单声的 `chak`。栖息地：山陵地区的原生森林。分布：留栖于苏门答腊和婆罗洲。\n\n\
  ### 2 普通火斑啄\n`Dinopium javanense` 28–30cm 野外记录：成对出现在所有高度，但偏好低部。鸣声：长长的颤音 `ka-di-di-di-di-di`、`kow`\
  \ 或 `kow kow` 以及飞行时的 `kowp-owp-owp-owp`。栖息地：开阔次生林、红林和花园。分布：留栖于苏门答腊、爪哇和婆罗洲。\n\n###\
  \ 3 斑喉火斑啄\n`Dinopium everetti` 28–30cm 野外记录：行为可能与普通火斑啄相似，直到最近才被认为是同物种。鸣声：可能与普通火斑啄相似。栖息地：开阔林地。分布：特产于菲律宾（拉望及临近岛屿）。\n\
  \n### 4 大火斑啄\n`Chrysocolaptes guttacristatus` 33cm 野外记录：倾向于大树，从树干下部以冲刺和螺旋状向上移动。经常作为混种觅食群的一部分出现。鸣声：单声\
  \ `kik` 和单调的 `di-di-di-di-di`。栖息地：海岸森林、开阔森林和森林边缘。分布：留栖于西中苏门答腊、爪哇和婆罗洲。\n\n### 5 棕斑火\n\
  `Chrysocolaptes lucidus` 28–34cm 野外记录：最近从大火斑啄分类；行为和习性假设相似。鸣声：假设与大火斑啄相似。栖息地：原生和次生森林及森林空地。分布：特产于菲律宾（民兰岛和巴实兰岛）。\n\
  \n\n\n\n\n## 6 吕宋岛火��尾\n*Chrysocolaptes haematribon* 28–34cm 野外笔记：近期从大火��尾中分出来；其行为和习性被认为相似。鸣声：预计与大火��尾相似。栖息地：原生林和次生林，也有高树木的种植园。分布：特产于菲律宾北部北部。\n\
  \n## 7 黄脸火��尾\n*Chrysocolaptes xanthocephalus* 28–30cm 野外笔记：近期从大火��尾中分出来；其行为和习性被认为相似。鸣声：预计与大火��尾相似。栖息地：低森林和种植园。分布：特产于菲律宾中部。\n\
  \n## 8 红头火��尾\n*Chrysocolaptes erythrocephalus* 28–34cm 野外笔记：近期从大火��尾中分出来；其行为和习性被认为相似。鸣声：预计与大火��尾相似。栖息地：原生林、次生林、种植园和林缘地。分布：特产于菲律宾西部。\n\
  \n## 9 爪哇火��尾\n*Chrysocolaptes strictus* 28–32cm 野外笔记：近期从大火��尾中分出来；其行为和习性被认为相似。鸣声：预计与大火��尾相似。栖息地：原生林、次生林、沿海林和种植园。分布：居住于苏门答腊和巴厘岛。\n\
  \n![image](img/page039.jpg)\n\n## 13 啄鸟\n\n### 1 栗褐啄鸟\n*Blythipicus rubiginosus*\
  \ 23cm 野外笔记：通常在低处觅食，位于树干基部、倒木或地面上。经常作为混种觅食群的一部分。鸣声：一种颤动的、高频的 `kik-kik-kik-kik-kik-kik-kik…`，在结尾处变慢；还有下降的\
  \ `chai-chai-chai-chai` 或 `keek-eek-eek-eek-eek-eek`，以及 `pit`、`pyick`、`kyak` 和 `kik-ik`。栖息地：原生林、次生林，也有种植园。分布：居住于苏门答腊和婆罗洲。\n\
  \n### 2 橙背啄鸟\n*Reinwardtipicus validus* 30cm 野外笔记：通常成对或小群结出现，在腐烂木头、死树桩、主干和树枝上觅食。通常通过响亮的啄木声和敲击声暴露行。鸣声：快速的、颤音的\
  \ `ki-i-i-i-i-i-ik`；此外记录还有吱吱的 `kit kit kit kit kit-it`、`kee-wheet`、`wheet wheet\
  \ wheet wheet wheow` 以及咯咯声的 `cha-cha-cha`。栖息地：从海岸到山山的森林。分布：居住于苏门答腊、爪哇岛和婆罗洲。\n\n\
  ### 3 烟灰啄鸟\n*Mulleripicus funebris* 34–35cm 野外笔记：通常单独或成对在高树的上层觅食。`M.` `f.` `fuliginosus`\
  \ (3b) 出现在菲律宾南部。鸣声：一种颤音的 `chil-lel-lel-lel-lel-lel…`，经常重复。栖息地：各种类型的森林，包括次生林、山地栎和松林，以及种植园附近的林缘。分布：特产于菲律宾。\n\
  \n### 4 灰啄鸟\n*Mulleripicus fulvus* 39–40cm 野外笔记：通常成对、成群或单独出现。在树干和粗壮树枝上觅食；也注意到在地面或腐烂树桩上觅食。`M.`\
  \ `f.` `wallacei` (4b) 位于苏里腊岛南部。鸣声：记录有多种叫声，包括快速、微弱、等调的 `kikikikikiki…`、笑声般的 `hew-hew-hew-hew-hew-hew`\
  \ 和柔和的 `twee twee twee`。栖息地：原生林和次生林，偶尔有树木的耕区、椰子林和红树林。分布：特产于苏里腊岛。\n\n### 5 大灰头啄鸟\n\
  *Mulleripicus pulverulentus* 45–51cm 野外笔记：通常成对或小小吵闹群体出现，以松散的跟随方式在另一棵树或一片林地之间穿梭。主要在高树中觅食，在树干和大树枝上寻找蚂蚁和幼虫。鸣声：哀鸣般的\
  \ `woi-kwoi-kwoi-kwoi`，通常在飞行时发出；还发出柔和的 `whu-ick` 和一声响亮的 `dwot`，据说声音介于山羊叫和狗叫之间。栖息地：低地原生林、次生林、空地边缘以及偶尔的种植园。分布：居住于苏门答腊、爪哇岛、婆罗洲和菲律宾。\n\
  \n![image](img/page041.jpg)\n\n## 14 凤嘴鸟\n\n### 1 火冠兜嘴鸟\n*Psilopogon pyrolophus*\
  \ 29cm 野外笔记：成对或小群在高树的冠层觅食，在尝试够果实时动作很灵敏。鸣声：类似蝉的 `dddzza-ddzza` 并增加到 `zz-zz-zz-zz`；还发出哨音音符和吱吱声。栖息地：原生林、次生林、林缘和林地。分布：居住于苏门答腊。\n\
  \n### 2 纹兜嘴鸟\n*Psilopogon lineatus* 25–30cm 野外笔记：颜色较深。通常单独或成群可见。鸣声：单调的 `kotur`，有时由快速的颤音引导。栖息地：开阔森林。分布：居住于爪哇岛。\n\
  \n### 3 棕喉兜嘴鸟\n*Psilopogon corvinus* 26cm 野外笔记：主要在冠层觅食，偶尔会进入密林。鸣声：响亮的 `hoo-too-too`\
  \ 或 `boo-too-ta-ta-ta-`，后面跟着快速颤音。栖息地：湿润的山地森林。分布：特产于爪哇岛西部。\n\n### 4 金须兜嘴鸟\n*Psilopogon\
  \ chrysopogon* 30cm 野外笔记：经常在冠层出现；喜好结果果树。鸣声：响亮的、快速的 `too-tuk too-tuk too-tuk…`。栖息地：山林。分布：居住于苏门答腊和婆罗洲。\n\
  \n### 5 红冠兜嘴鸟\n*Psilopogon rafflesii* 25–27cm 野外笔记：在森林冠层觅食，取果和昆虫。鸣声：短促的 `took` 或\
  \ `took-took`，重复 10–20 秒。栖息地：低地森林。分布：居住于苏门答腊和婆罗洲。\n\n### 6 红喉兜嘴鸟\n*Psilopogon mystacanos*\
  \ 23cm 野外笔记：主要在冠层觅食，偶尔会进入密林。鸣声：缓慢、不均匀的深音系列，`chok… chok-chok… chok… chok-chok…`，还有\
  \ `pooh pooh lentogok lentogok`。叫声比其他兜嘴鸟慢且犹豫。\n\n### 7 黑带兜嘴鸟\n*Psilopogon javensis*\
  \ 26cm 野外笔记：通常在较开阔或林木稀疏的区域遇到。鸣声：多样，包括重复的 `tooloong-tumpook`、加速的 `too-took too-took…`\
  \ 以及单一的 `tyaap` 或 `tap`。栖息地：山林。\n\n### 8 黑兜嘴鸟\n*Psilopogon oorti* 21–24cm 野外笔记：冠层和亚冠层的活跃觅食者。鸣声：响亮的、喉部的\
  \ `too-took-trrrrk`，大约每秒重复一次，开头或结尾带有柔和的 `ta`。栖息地：山地和亚山地森林。分布：居住于苏门答腊。\n\n## 15 兜嘴鸟\n\
  \n### 1 山兜嘴鸟\n*Psilopogon monticola* 20cm 野外笔记：在所有高度觅食，经常作为混种觅食群的一部分。鸣声：快速的 `tuk\
  \ tuk tuk tuk`，每 20 声左右偶尔出现一次 `tu-ruk`。栖息地：低山地森林和山林、林缘、果园和花园。分布：特产于婆罗洲。\n\n### 2\
  \ 黄冠兜嘴鸟\n*Psilopogon henricii* 21–23cm 野外笔记：大部分时间在树冠层觅食，吃无花果和其他果实。鸣声：短促的颤音 `trrok`\
  \ 之后是响亮的 `tok-tok-tok-tok`，持续 10–20 秒。栖息地：低地和亚山地森林。分布：居住于苏门答腊和婆罗洲。\n\n\n\n\n\n##\
  \ 3 火焰脸兜嘴鸟\n*Psilopogon armillaris* 20cm 野外记录：常见，通常在果树上作为多物种混合觅食群的一部分出现。鸣声：单调、重复的\
  \ `trrk trrk trrk trrrk` 或一系列短促的颤鸣声，`t-t-t-rrrt`，无止地重复。栖息地：原生低地森林和丘陵森林，也包括种植园和园林中的果树。分布范围：爪哇答岛和巴厘岛特有。\n\
  \n## 4 金颈兜嘴鸟\n*Psilopogon pulcherrimus* 20cm 野外记录：在中中层和林冠层觅食。鸣声：多变，包括重复的、空空的 `took-took-tarrroo`k，还有滚动的\
  \ `trrr-trrr-trrrrrr` 以及一系列短促的 `twaak twaak twaak…` 鸣声。栖息地：山地森林。分布范围：婆罗洲岛特有。\n\n\
  ## 5 黄耳兜嘴鸟\n*Psilopogon australis* 16–17cm 野外记录：通常成对或小群出现，在果树上会有更大的群体。曾被认为与蓝耳兜嘴鸟为同种。鸣声：快速、无止重复的响哒声，也有重复的尖锐颤鸣。栖息地：原生森林、次生森林和种植园。分布范围：留于爪哇和巴厘岛。\n\
  \n## 6 蓝耳兜嘴鸟\n*Psilopogon duvaucelii* 17cm 野外记录：成对或小群出现，在果树上有更大的群体。鸣声：无止重复的 `tk-trrt\
  \ tk-trrt`、`koo-turr koo-trr` 或 `too-rook too-rook`；还有哨般的 `teeow-teeow…`。栖息地：原生和次生森林以及耕区。分布范围：留于苏门答腊和婆罗洲。\n\
  \n## 7 婆罗洲兜嘴鸟\n*Psilopogon eximius* 15cm 野外记录：通常在果树的林冠层觅食。鸣声：一系列快速的 `tiuk` 鸣声，还有快速的颤鸣。栖息地：山地森林。分布范围：婆罗洲岛特有。\n\
  \n## 8 蜂鸟掘兜嘴鸟\n*Psilopogon haemacephalus* 17cm 野外记录：通常成对或小群出现，果树上会有较大的群体。在菲律宾，曾记录到在死树顶部的裸露栖息处鸣叫。`P`.\
  \ `h`. `cebuensis` (8b) 见于菲律宾中部；`P`. `i`. `roseus` (8c) 于爪哇和巴厘岛。鸣声：单调的、金属般的 `tuk\
  \ tuk tuk tuk tuk tuk tuk…`。栖息地：开阔低地森林和森林边缘。分布范围：留于苏门答腊、爪哇、巴厘岛和菲律宾。\n\n## 9 棕兜嘴鸟\n\
  *Caloramphus fuliginosus* 17cm 野外记录：经常成群，在树干和树枝上觅食；不断鸣叫。`C`. `f`. `tertius` (9b)\
  \ 见于婆罗洲北部。鸣声：高音调、哨般的吱声。栖息地：原生和次生森林。分布范围：整个婆罗洲岛特有。\n\n## 10 烟灰兜嘴鸟\n*Caloramphus hayii*\
  \ 17–20cm 野外记录：经常在小群中发现，从林下层到林冠层觅食，特别是在果树上；觅食动作往往敏捷，像山雀一样。近期从棕兜嘴鸟中分化出来。鸣声：一系列嘶声的\
  \ `pseeee` 鸣声，还会发出纤细的 `pseeoo`。栖息地：低地和沼泽森林。分布范围：留于苏门答腊。\n\n![image](img/page045.jpg)\n\
  \n## 16 犀嘴鸟\n\n### 1 东方白嘴犀嘴\n*Anthracoceros albirostris* 55–60cm 野外记录：主要为树栖，但会降到地面捡食，通常成小群活动，尽管繁殖季节后可能会出现更大的群。飞行时，羽毛末端呈白色。显然，白尾亚种并不固定。鸣声：各种尖叫和咯咯声。栖息地：低地森林。分布范围：留于苏门答腊、爪哇和婆罗洲。\n\
  \n### 2 亚洲黑犀嘴\n*Anthracoceros malayan* 76cm 野外记录：通常成对或小群出现。鸣声：粗哑、刺耳。栖息地：原生和次生森林。分布范围：留于苏门答腊。\n\
  \n### 3 帕拉湾犀嘴\n*Anthracoceros marchei* 55cm 野外记录：通常成群结队。鸣声：响亮的号角声。栖息地：红树林。分布范围：巴拉湾岛特有。\n\
  \n### 4 苏苏禄犀嘴\n*Anthracoceros montani* 50cm 野外记录：通常以多达十五只鸟的群体出现。鸣声：响亮，结尾带有结巴音。栖息地：原生森林。分布范围：乔霍洛岛和塔威岛特有。\n\
  \n### 5 犀角犀嘴\n*Buceros rhinoceros* 91–120cm 野外记录：通常成对或小群出现。鸣声：响亮、深沉。栖息地：原生和次生森林。分布范围：留于苏门答腊、爪哇和婆罗洲。\n\
  \n### 6 远犀嘴\n*Buceros bicornis* 95–105cm 野外记录：通常成对或小群出现。鸣声：响亮、有回声的。栖息地：低地到亚山地地区。分布范围：留于苏门答腊。\n\
  \n![image](img/page047)\n\n## 17 犀嘴鸟\n\n### 1 栗犀嘴\n*Buceros hydrocorax* 60–65cm\
  \ 野外记录：经常飞越山谷或沿山坡飞行。鸣声：响亮、深沉。栖息地：原生森林和高大林。分布范围：菲律宾特有。\n\n### 2 盔犀犀嘴\n*Rhinoplax\
  \ vigil* 110–120cm 野外记录：通常独居或成对出现。鸣声：一系列响亮的声。栖息地：高大低地和丘陵森林。分布范围：留于苏门答腊和婆罗洲。\n\n\
  ### 3 冠冠犀嘴\n*Anorrhinus galeritus* 65–70cm 野外记录：通常以 5–15 只鸟成群。鸣声：响亮、兴奋。栖息地：森林，从低地到丘陵。分布范围：留于苏门答腊和婆罗洲。\n\
  \n### 4 吕宋犀嘴\n*Penelopides manillae* 45cm 野外记录：以多达十五只鸟的小群出现。鸣声：重复的鼻音。栖息地：原生常绿低地森林、河岸森林，甚至是草地中的单棵果树。分布范围：菲律宾北部特有。\n\
  \n\n\n\n\n# 5 爪民腊兜犀\n*Penelopides affinis* 45cm 野外札记：在森林的中、下层觅食，通常以小群形式活动。*P*. *a*.\
  \ *basilanicus* (5b) 出于巴西兰岛（菲律宾西南）。鸣声：与之前的物种相似。栖息地：原生常绿林，包括林空地和边缘，以及次生林。分布：特产于菲律宾南部。\n\
  \n# 6 萨马尔岛兜犀\n*Penelopides samarensis* 45cm 野外札记：通常成对或成小群出现。雌性与爪民腊兜犀雌性相似。该物种通常被认为是爪民腊兜犀的一个亚。鸣声：与吕宋兜犀相似。栖息地：湿润的低地森林。分布：特产于菲律宾东部。\n\
  \n# 7 维萨亚兜犀\n*Penelopides panini* 45cm 野外札记：在树冠下方和森林边缘觅食。鸣声：重复的、低沉的鼻音 `ta-ric` 或\
  \ `ta-ric-tic`。栖息地：原生常绿林、次生林和孤立的果树。分布：特产于菲律宾北部。\n\n# 8 民罗岛兜犀\n*Penelopides mindorensis*\
  \ 45cm 野外札记：通常成对或最多 20 只鸟的群群出现。鸣声：与维萨亚兜犀相似。栖息地：原生常绿林、次生林、森林边缘和孤立的果树。分布：特产于菲律宾南部。\n\
  \n# 9 白冠兜犀\n*Berenicornis comatus* 75–85cm 野外札记：小群体在下层茂密且错综的植被中或地面上觅食；花费大量时间在树皮碎片中挖掘寻找食物。鸣声：深沉的\
  \ `hoo hu-hu-hu-hu-hu-hu` 或 `kuk kuk kuk kuk kuk`，通常会逐渐减弱。栖息地：密集的植被，低地和山地森林附近的河流。分布：留栖于苏门答腊和婆罗罗岛。\n\
  \n![image](img/page049.jpg)\n\n## 18 兜犀\n\n## 1 苏拉威西兜犀\n*Rhabdotorrhinus exarhatus*\
  \ 45cm 野外札记：通常以嘈杂、活跃的成对或小群出现，在树冠中层觅食。鸣声：一系列快速、粗犷的嘶鸣和鸣叫声。栖息地：原生低地和山地森林、高大次生林、沼泽林和森林边缘。分布：特产于苏拉威锡。\n\
  \n## 2 皱兜犀\n*Rhabdotorrhinus corrugatus* 75cm 野外札记：通常成对或成小群可见，在树冠层觅食。鸣声：尖锐的犬吠 `kak\
  \ kak-kak`，还有回响的 `wakowwakowkow` 或 `rowwrow`。栖息地：低地和沼泽森林。分布：留栖于苏门答腊和婆罗罗岛。\n\n##\
  \ 3 红头兜犀（瓦尔登兜犀）\n*Rhabdotorrhinus waldeni* 60–65cm 野外札记：通常成小群出现，在树冠层觅食；经常看到在森林上空或跨越山谷。鸣声：响亮、断续的鼻音\
  \ `au-au-au-auk`。栖息地：从海岸到山丘的森林，也位于林空地的大树中。分布：特产于菲律宾中部。\n\n## 4 曲兜犀\n*Rhabdotorrhinus\
  \ leucocephalus* 60–65cm 野外札记：通常以嘈杂、显眼的小群形式可见，在高树的树冠层觅食。鸣声：响亮、鼻音的 `auk`，单音发出或作为一系列音节。栖息地：原生低地森林。分布：特产于菲律宾。\n\
  \n## 5 隆鼻兜犀\n*Rhyticeros cassidix* 70–80cm 野外札记：单只、成对或成群可见；某些非繁殖期的群体规模很大，多达 50 只左右。在森林树冠层觅食，通常与其他食实物种混群。鸣声：深沉、上扬的鸣叫\
  \ `wha wha wha wha` 或类似声音。栖息地：原生低地、山地、山区、沼泽和高大次生林，也包括耕区内的林分。分布：特产于苏拉威锡。\n\n## 6\
  \ 纹兜犀\n*Rhyticeros undulatus* 75–85cm 野外札记：通常成对或小群出现，在食物充足处或集体栖息地形成更大的群体。主要在树冠层觅食，尽管也会到地面捡落果或捕食动物猎物。鸣声：非常响亮、气促的\
  \ `kuk-KWEHK`。栖息地：低地、山地和泥炭沼泽森林。分布：留栖于苏门答腊、爪哇和婆罗罗岛。\n\n## 7 巴兜犀\n*Rhyticeros everetti*\
  \ 55cm 野外札记：单只、成对或小群遇到，在栖息地数量多得多。主要在果树的树冠层觅食。鸣声：短促的 `erm-err` 和 `kokokokokokokoko`。栖息地：原生林块、次生林和带有果树的开放公园地。分布：特产于小巽丹群岛西部（松巴岛）。\n\
  \n## 8 斑颊兜犀\n*Rhyticeros subruficollis* 65–70cm 野外札记：通常成对发现，偶尔成小群出现。主要在树顶层觅食，尽管也会到地面收集落果或捕获小动物。鸣声：响亮的\
  \ `keh-keh-keh`。栖息地：原生森林。分布：特产于苏门答腊。\n\n## 9 纸皮兜犀（布莱斯兜犀）\n*Rhyticeros plicatus*\
  \ 65–85cm 野外札记：单只、成对或成群发现，在树冠层觅食。鸣声：各种咕噜声和鸣声。栖息地：低地沼泽森林。分布：留栖于摩鹿加群岛。\n\n![image](img/page51.jpg)\n\
  \n## 19 蜂鸟\n\n## 1 爪哇西蜂鸟\n*Apalharpes reinwardii* 34cm 野外札记：在阴凉处静静停留，然后飞去捕食昆虫；也吃果实。鸣声：穿透力的\
  \ `chierr chierr`。栖息地：山区森林。分布：特产于爪哇岛。\n\n## 2 苏门答腊蜂鸟\n*Apalharpes mackoti* 30cm\
  \ 野外札记：习性与爪哇蜂鸟相似，曾被认为是同种。鸣声：高音的哨声 `wiwi wheeer-lu`，每几秒重复一次。栖息地：山区雨林。分布：特产于苏门答腊。\n\
  \n## 3 红脑后蜂鸟\n*Harpactes kasumba* 31–35cm 野外札记：长时间静止，典型的蜂鸟行为；偏好中层到上层。鸣声：低沉、粗犷的 `kau\
  \ kau kau kau`；雌性发出沙沙声。栖息地：原生低地和山地森林。分布：...\n\n## 4 迪德蜂鸟\n*Harpactes diardii* 32–35cm\
  \ 野外札记：非常低调，通常出现在中层；长时间静止。鸣声：下降的 `kau kau kau ku`。栖息地：低地、山地、泥炭沼泽和石石楠森林。分布：留栖于苏门答腊和婆罗罗岛。\n\
  \n## 5 菲律宾蜂鸟\n*Harpactes ardens* 30cm 野外札记：栖息在阴凉处。出击捕捉昆虫或从附近的树上采摘果实。鸣声：柔和的 `nuu\
  \ nu nu nu nu nuu`，起初加速然后逐渐下降并减慢。栖息地：林下或原生和次生林。分布：特产于菲律宾。\n\n## 6 白额蜂鸟\n*Harpactes\
  \ whiteheadi* 29–31cm 野外札记：栖息在林下较高的树枝上。鸣声：一系列粗犷、音调均匀的音节，被记录为 `wark wark wark wark`\
  \ 或 `poop poop poop poop poop`；还有柔和的滚动声 `rrrr`，有时后跟着响亮的 `kekekeke` 并音调下降。栖息地：山上阴暗潮湿的斑块。分布：特产于北婆罗罗岛。\n\
  \n## 7 肉桂臀蜂鸟\n*Harpactes orrhophaeus* 25cm 野外札记：非常害羞；出没于下中层。被记录为混物种觅食群的一员。鸣声：微弱、下降的\
  \ `ta-aup ta-aup ta-aup`，还有爆发性的 `purr`。栖息地：原生山地和亚山地森林。分布：留栖于苏门答腊和婆罗罗岛。\n\n\n\n\n\
  ## 8 红臀蜂鸟\n*Harpactes duvaucelii* 23–26cm 野外笔记：经常出现在森林下层到中层，偶尔出现在森林边缘。通常是混种觅食群的一员。鸣声：一种快速、加速且逐渐下降的\
  \ `yau-yau-yau-yau-yau…`。受惊时，发出低沉的振翅声 `kir-r-r-r`。栖息地：原生林和伐木林。分布：栖于苏门答腊和婆罗洲。\n\n\
  ## 9 橙胸蜂鸟\n*Harpactes oreskios* 25–26cm 野外笔记：经常出现在中层到上层。记录追随混种觅食群。*H*. *o*. *dulitensis*\
  \ (9b) 出生于婆罗洲。鸣声：低沉、快速的 `tu tu tau-tau-tau`。栖息地：低地、丘陵和亚山地森林。分布：栖于苏门答腊、爪哇和婆罗洲。\n\n\
  ## 10 红头蜂鸟\n*Harpactes erythrocephalus* 31–35cm 野外笔记：行踪低调，长时间停在中层到上层静止不动。鸣声：柔和、下降的\
  \ `tyaup tyaup tyaup tyaup tyaup`；受惊时，发出嘎吱的 `tewirr` 鸣声。栖息地：丘陵森林。分布：栖于苏门答腊。\n\n\
  ![image](img/page053.jpg)\n\n20 绿��类；蜂鸟；戴凤头\n\n## 1 紫翅绿��类\n*Coracias temminckii*\
  \ 30–34cm 野外笔记：通常以单只或成对出现；经常栖息在开阔地的裸树枝、电线或灌木丛顶端。鸣声：各种刺耳的 `krawk` 声调，交替出现或随后是上扬的、摩擦般的\
  \ `tjorraa`。栖息地：森林边缘、沼泽林、次生林、开阔灌木林、林木稀疏的耕地和草原。分布：苏拉威西岛特有。\n\n## 2 蜂鸟（东方蜂鸟，红嘴蜂或宽嘴绿��类）\n\
  *Eurystomus orientalis* 25–28cm 野外笔记：经常栖息在高死树的顶端树枝上，从那里敏捷地俯冲捕食飞行昆虫。飞行时，初翅基部有一块巨大的浅蓝色斑块。鸣声：快速的\
  \ `krak-kak-kak-kak-kak` 和沙哑的 `chak`。栖息地：低地森林、森林边缘、空地和林木稀疏的耕地。分布：整个该地区的留鸟和冬季候客。\n\
  \n## 3 紫绿��类（蓝蜂蜂鸟或蓝色绿��类）\n*Eurystomus azureus* 27–35cm 野外笔记：罕见，通常两只或三只成群栖息在高树顶端；觅食行为与蜂鸟相似。鸣声：以连续系列发出的刺耳、摩擦声叫声。栖息地：原生丘陵森林、森林边缘，偶尔出现在相邻的椰子林和花园。分布：北摩卢加群岛特有。\n\
  \n## 4 紫胡须蜂鸟\n*Meropogon forsteni* 25–26cm 野外笔记：通常单只、成对或小群结。。栖息在开阔地的暴露树枝上、中层和上冠层，在捕捉飞行昆虫后进行空中俯冲。鸣声：低沉、高频的\
  \ `szit`、`peet` 或 `sip-sip`。栖息地：空地边缘以及原生林或高次生林的空隙。分布：苏拉威西岛特有。\n\n## 5 红胡须蜂鸟\n*Nyctyornis\
  \ amictus* 27–31cm 野外笔记：经常出现在林冠下层。静静坐着，部分隐藏，然后进行短距离飞行出击捕捉有翅昆虫。鸣声：响亮、沙哑的 `chachachacha…\
  \ quo-qua-qua-qua` 或下降的 `kak kak-ka-ka-ka-ka`；还记录到深沉的 `kwow` 或 `kwok`。栖息地：原生林和老次生林。分布：栖于苏门答腊和婆罗洲。\n\
  \n## 6 蓝喉蜂鸟\n*Merops viridis* 22–24cm 野外笔记：群居繁殖，常出现在沿海沙地地区。从树顶或电力线俯捕昆虫。*M*. *v*.\
  \ *americanus* (6b) 出生于菲律宾。鸣声：短促颤音的 `brk brk`。飞行时，发出响亮的 `prrrp prrrp prrrp` 或 `kerik-kerik-kerik`。栖息地：森林附近的开阔地和空地，通常靠近海岸。分布：栖于苏门答腊、爪哇、婆罗洲和菲律宾。\n\
  \n## 7 虹蜂鸟\n*Merops ornatus* 19–21cm 野外笔记：通常成对或小群活动。幼鸟缺乏黑色喉圈和长长的尾羽。鸣声：滚动的类似 `prrrp\
  \ prrrp`、`preee` 或 `drrrt`；受惊时，发出 `dip-dip` 或 `clip-lip-lip-lip`。栖息地：草地、森林空地、灌木丛、森林边缘和河边的树木。分布：华莱士地区的冬季或非繁殖期访客；为巴厘岛和婆罗洲的漂留。\n\
  \n## 8 蓝尾蜂鸟\n*Merops philippinus* 23–26cm 野外笔记：群居性；从暴露的栖息处俯捕昆虫。鸣声：滚动的 `dirir` 或颤音的\
  \ `brk`。栖息地：开阔地、灌木丛。分布：栖于菲律宾、苏拉威西和巽松群岛。\n\n## 9 栗头蜂鸟\n*Merops leschenaulti* 18–20cm\
  \ 野外笔记：经常出现在林冠下层。静静坐着，部分隐藏，然后进行短距离飞行出击。鸣声：快速的 `rak-kak-kak-kak` 和沙哑的 `chak`。栖息地：低地森林。分布：栖于苏门答腊（此处此处应为婆罗洲）。\n\
  \n## 10 戴凤（欧亚或普通戴凤）\n*Upupa epops* 26–32cm 野外笔记：极易辨认，即使在飞行中也是如此，冠展开。鸣声：低沉的 `hoop-hoop-hoop`\
  \ 或 `up-up-up-up`。栖息地：有树木的开阔地、公园和花园。分布：苏门答腊、婆罗洲和菲律宾的漂留。\n\n![image](img/page05.jpg)\n\
  \n## 21 紫颊翠鸟（紫翠鸟）\n*Cittura cyanotis* 28cm 野外笔记：通常单只栖息在低处。鸟类通常栖息在较高的冠层。鸣声：一系列上扬的哨声，还会发出像幼犬般的\
  \ `yap-yap`。栖息地：原生林和高次生林、果园。分布：桑黑西岛和西亚乌岛。\n\n## 2 翠鸟（普通或河翠鸟）\n*Alcedo atthis* 16–17cm\
  \ 野外笔记：第一眼往往是沿河流低空飞行的蓝色闪影。鸣声：穿透力强的高频 `tseee` 或 `tseee ti-tee ti-tee`。栖息地：开阔地区的河流、溪和池塘。分布：华莱士地区的留鸟和冬季候客。\n\
  \n## 3 蓝耳翠鸟\n*Alcedo meninting* 17cm 野外笔记：倾向于在水方的阴影栖息处捕鱼。鸣声：高频、尖锐的 `seet`，还有细细、尖锐的接触鸣声。栖息地：密林中的溪流和小池。分布：栖于苏门答腊、爪哇、婆罗洲、菲律宾、苏拉威西和巽松群岛。\n\
  \n## 4 蓝带翠鸟\n*Alcedo euryzona* 17cm 野外笔记：在森林溪流附近的低栖息处捕猎；活跃，不断移动栖位。鸣声：高频的 `cheep`，通常在飞行时发出。栖息地：低地、丘陵和亚山地森林的溪流和小河。分布：栖于苏门答腊、爪哇和婆罗洲。\n\
  \n## 5 蓝翠鸟\n*Alcedo coerulescens* 13cm 野外笔记：通常单只或成对出现；在水边的低栖息处捕鱼。鸣声：高频、穿透力强的 `tieh\
  \ tieh`。栖息地：低地水域，包括溪、运河、鱼塘、沼泽、红树林和潮汐口。分布：栖于苏门答腊南部、爪哇、巴厘岛和西巽松群岛。\n\n\n\n\n\n# 6 蓝绿翠鸟\n\
  *Ceyx azureus* 16–17cm 野外记录：通常单独活动；栖息在水面上方的低矮树枝上，俯水捕鱼。鸣声：重复的、锐利的 `tzeep` 或 `peeee`。栖息地：林木茂密的溪流和河口。分布范围：留于北马鹿琉亚群岛和东小巽他群岛。\n\
  \n# 7 蓝带普通翠鸟\n*Ceyx cyanopectus* 14cm 野外记录：栖息在树枝或岩石上，俯水捕鱼。`C`. `c`. `nigrirostris`\
  \ (7b) 见于菲律宾西部。鸣声：纤细、高亢的单音。栖息地：森林茂密的溪流和河流，也有棕榈林沼泽和红树林。分布范围：菲律宾特有。\n\n# 8 南银色普通翠鸟\n\
  *Ceyx agentatus* 15cm 野外记录：栖息在溪边的低矮树枝或岩石上，俯水捕鱼。鸣声：高亢的 `wheeet`。栖息地：森林溪流、河流和池塘。分布范围：菲律宾南部特有。\n\
  \n# 9 北银色普通翠鸟\n*Ceyx flumenicola* 14cm 野外记录：近期从前一物种分化出来；推测习性相似。鸣声：与前一物种无差异。栖息地：森林溪流、河流和池塘。分布范围：菲律宾中南部特有。\n\
  \n# 10 小普通翠鸟\n*Ceyx pusillus* 11cm 野外记录：从低处栖息捕鱼。鸣声：高亢、重复的 `tsee` 或 `tzweeip`。栖息地：主要为红树林，也有森林溪流和沼泽森林。分布范围：留于北马鹿琉亚群岛和南马鹿琉亚群岛的凯屿。\n\
  \n![image](img/page057.jpg)\n\n## 22 翠鸟\n\n# 1 马鹿琉亚矮翠鸟\n*Ceyx lepidus* 14cm 野外记录：通常独居；利用低处栖息点作为观察哨寻找昆虫等。此种及后续三种常被认为是同物种。鸣声：尖锐、喘息的\
  \ `tzeeip`。栖息地：原生和次生林。分布范围：除布鲁岛外的马鹿琉亚群岛特有。\n\n# 2 苏拉矮翠鸟\n*Ceyx wallacii* 14cm 野外记录：习性推测与前者相似。鸣声：未知。栖息地：森林地区。分布范围：苏拉群岛特有。\n\
  \n# 3 布鲁矮翠鸟\n*Ceyx cajeli* 14cm 野外记录：习性推测类似于马鹿琉亚矮翠鸟。鸣声：未知。栖息地：森林地区。分布范围：南马鹿琉亚群岛（布鲁岛）特有。\n\
  \n# 4 双色矮翠鸟\n*Ceyx margarethae* 14cm 野外记录：变异大；存在深色和浅色体型，图中描绘的是浅色体型。习性推测类似于马鹿琉亚矮翠鸟。鸣声：`pe-teeeet\
  \ pe-teeeet`。栖息地：原生和次生林。分布范围：菲律宾中部和南部特有。\n\n# 5 东方矮翠鸟\n*Ceyx erithaca* 14cm 野外记录：栖息在植被或岩石低处。鸣声：高亢的\
  \ `tsriet-tsriet` 或柔和的 `tjie-tjie-tjlie`。栖息地：森林中阴暗的溪流或池塘，偶尔见于红树林。分布范围：模式种见于苏门答腊、爪哇腊和巴厘；栗型见于苏门答腊、爪哇腊、婆罗洲、菲律宾西部和西小巽他群岛。\n\
  \n# 6 菲律宾矮翠鸟\n*Ceyx melanurus* 12–13cm 野外记录：独居；栖息在低处。`C`. `m`. `mindanensis` (6b)\
  \ 见于菲律宾南部。鸣声：高亢的 `zeeeep`。栖息地：茂密的低地原生林和次生林。分布范围：菲律宾特有。\n\n# 7 苏拉威锡矮翠鸟\n*Ceyx fallax*\
  \ 12cm 野外记录：利用低处栖息点捕捉昆虫或两栖类猎物。鸣声：高亢的 `seeee`。栖息地：遮良好的低地森林。分布范围：苏拉威锡特有。\n\n# 8 鱼嘴翠鸟\n\
  *Pelargopsis capensis* 35cm 野外记录：很好地躲在水边的树枝上。`P`. `c`. `gigantea` (8b) 见于菲律宾南部；小巽他群岛亚种头部和耳部颜色较褐。鸣声：包括\
  \ `ke-ke-ke-ke`、`kak kak ka k` 和悦听的 `peer`… `peer`… `peer`。栖息地：林区阴暗水域和红树林。分布范围：留于苏门答腊、爪哇腊、婆罗洲、菲律宾和西小巽他群岛。\n\
  \n# 9 黑嘴翠鸟（大嘴翠鸟）\n*Pelargopsis melanorhyncha* 35–37cm 野外记录：栖息在部分遮蔽的树枝上，单独或成对。`P`.\
  \ `m`. `dichrorhyncha` (9b) 见于班盖群岛。鸣声：响亮的 `kak`、`kak-ka` 或 `ke-kak`。栖息地：海岸森林。10\
  \ 褐褐翠鸟\n*Halcyon coranda* 25cm 野外记录：单独或成对出现。分布范围：南部群岛特有。\n\n# 11 白胸翠鸟\n*Halcyon\
  \ smyrensis* 27–28cm 野外记录：上部呈浅蓝色。鸣声：婉转的 `gularis`。栖息地：海岸森林。分布范围：苏门答腊、爪哇腊、婆罗洲。\n\n\
  # 12 黑冠翠鸟\n*Halcyon pileata* 28cm 野外记录：初羽上有白色斑块。鸣声：清脆的 `kilikiki`。栖息地：开阔地区。分布范围：苏门答腊、爪哇腊、菲律宾。\n\
  \n# 13 爪哇翠鸟\n*Halcyon cyanovris* 27cm 野外记录：栖息在树顶。鸣声：响亮的尖叫，响亮的 `tjie-rie-rie`。栖息地：耕作区。分布范围：爪哇腊。\n\
  \n![image](img/page059.jpg)\n\n## 23 翠鸟\n\n# 1 额翠鸟\n*Todiramphus winchelli* 25cm\
  \ 野外记录：闻多于见；通常栖息在冠层。鸣声：响亮、粗糙上升的 `chup-chup-chep-chep-chep`，还有更快的 `chup-chup-chup-chu-chu-chu`。栖息地：未破坏的森林。分布范围：菲律宾特有。\n\
  \n# 2 黑白翠鸟\n*Todiramphus diops* 19–21cm 野外记录：栖息在开阔地的树枝上。鸣声：婉转的 `tu-tu-tu-k`。栖息地：次生林。分布范围：北马鹿琉亚群岛特有。\n\
  \n# 3 蓝翠鸟\n*Todiramphus lazuli* 22cm 野外记录：栖息在阴影中的树枝间。鸣声：快速、响亮、高亢的 `ke-ke-ke-ke-ke-ke`。栖息地：部分开发的森林。分布范围：南马鹿琉亚群岛特有。\n\
  \n# 4 森林翠鸟\n*Todiramphus macleayii* 20cm 野外记录：显著地栖息在裸枝上。鸣声：粗糙、尖锐的 `scissor-weeya\
  \ scissor-weeya`。栖息地：开阔林、森林边缘、草原。分布范围：东南华莱西地区的非繁殖季节访客。\n\n# 5 暗翠鸟\n*Todiramphus\
  \ funebris* 30cm 野外记录：树栖性，栖息不起眼。鸣声：缓慢的 `ki… ki… ki…`。栖息地：开阔耕作低地。分布范围：北马鹿琉亚群岛特有。\n\
  \n\n\n\n\n# 6 绿喉翠鸟（红领翠鸟或白领翠鸟）\n*Todiramphus chloris* 23–25cm\n**野外记录：** 外观显著、大胆且喧闹，尤其在清晨。\n\
  **鸣声：** 刺耳的 `krerk-krerk-krerk-krerk`，通常以 `jew-jaw` 声调结尾；还会发出尖锐的 `kick kyew kick\
  \ kyew…`。\n**栖息地：** 开阔林地、沿海林、耕作地、公园和花园。\n**分布：** 栖息于苏门答腊、爪哇、巴厘岛、婆罗洲、菲律宾、苏拉威西和小巽群岛。\n\
  \n# 7 塔劳乌翠鸟\n*Todiramphus enigma* 21cm\n**野外记录：** 经常栖息在河流附近。\n**鸣声：** 重复的 `kekee-kekee-kekee-kekee-kekee`。\n\
  **栖息地：** 森林和森林边缘。\n**分布：** 北苏拉威西特有。\n\n# 8 海滨翠鸟\n*Todiramphus saurophagus* 26–30cm\n\
  **野外记录：** 通常看到栖息在海边边缘的裸枝、岩石、柱子甚至漂流木上。偶尔在俯冲捕鱼或螃蟹前进行悬停。\n**鸣声：** 响亮而深沉的 `kill kill`、`kee-kee-kee`\
  \ 或 `kiokiokiokio`。\n**栖息地：** 红树林和沿海林。\n**分布：** 栖息于马鲁古群岛。\n\n# 9 圣翠鸟\n*Todiramphus\
  \ sanctus* 18–23cm\n**野外记录：** 通常成对出现，栖息在暴露的栖木上。大部分猎物取自地面，尽管也会俯冲捕鱼。\n**鸣声：** 快速、高调的\
  \ `kik-kik-kik-kik`；还会发出沙哑的 `schssk schssk`。\n**栖息地：** 红树林、开阔地区和耕作地。\n**分布：** 华莱西群岛、苏门答腊、爪哇和婆罗洲的非繁殖期访客。\n\
  \n# 10 斑带翠鸟\n*Todiramphus australasia* 21cm\n**野外记录：** 通常成对或单独栖息在林的中上层。`T`. `a`.\
  \ `dammerianus` (10b) 出于小巽群岛东部。\n**鸣声：** 快速的下降颤音，以及一系列微弱、喘息的 `ch-w’hee` 声和单声的吠叫。\n\
  **栖息地：** 原始林和高大次生林、森林边缘、季风林和开阔森林，也包括耕作地或村庄的阴凉树木。\n**分布：** 小巽群岛特有。\n\n![image](img/page061.jpg)\n\
  \n## 24 翠鸟\n\n# 1 斑纹翠鸟\n*Lacedo pulchella* 21–25cm\n**野外记录：** 经常静止不动很久。在森林栖木上捕食昆虫，有时在树冠层巡视。`L`.\
  \ `p`. `melanops` (1b) 出于婆罗洲。\n**鸣声：** 一声长哨声 `wheeeoo`，随后是多达十五声短促的 `chi-wiu` 哨并逐渐消失；还会发出尖锐的\
  \ `wiak` 或 `wiak wiak`。\n**栖息地：** 丘陵和亚山区森林。\n**分布：** 栖息于苏门答腊、爪哇和婆罗洲。\n\n# 2 白臀部翠鸟（闪光翠鸟）\n\
  *Caridonax fulgidus* 30cm\n**野外记录：** 通常低调地栖息在低矮树枝上，俯冲至森林地面捕获猎物。通常单独、成对或偶尔成小群出现。\n\
  **鸣声：** 一连串快速、刺耳的音调 `kuff-kuff-kuff`，还有一长串幼犬般的吠叫。\n**栖息地：** 原始林和高大湿润次生林、季风林、树木稀疏的耕作地和带高树的灌丛。\n\
  **分布：** 小巽群岛特有。\n\n# 3 红领翠鸟\n*Actenoides concretus* 24–25cm\n**野外记录：** 栖息在下层，保持不动，除了缓慢摇动的尾巴和警觉的头部动作。\n\
  **鸣声：** 升扬的哨声 `kwee-i`，每秒重复一次，持续十秒。\n**栖息地：** 平原和丘陵森林。\n**分布：** 栖息于苏门答腊和婆罗洲。\n\n\
  # 4 斑点翠鸟\n*Actenoides lindsayi* 25cm\n**野外记录：** 静静地栖息在下层的阴暗处，通常为单只或成对。\n**鸣声：**\
  \ 主鸣之前有一声响亮、悦的哨声 `ptuuooo`，主鸣是断续、上升的 `tu-tu-tu-tu-tu`，随后是下降的 `tuuu tuu-a tuu-a tuu-a`；受惊时会发出沙哑的咯咯。\n\
  **栖息地：** 平原和丘陵森林。\n**分布：** 菲律宾特有。\n\n# 5 蓝冠翠鸟（霍布隆翠鸟）\n*Actenoides hombroni* 28cm\n\
  **野外记录：** 栖息在森林下层的阴暗处，单只或成对。\n**鸣声：** 鸣声包括响亮、重复的 `ki-aw` 或 `te-u`，以及类似啄木鸟的 `kaaa-a-a-a`；主鸣类似于其他翠鸟。\n\
  **栖息地：** 森林下层。\n**分布：** 特有。\n\n# 6 绿背翠鸟\n*Actenoides monachus* 31cm\n**野外记录：** 安静的鸟，通常栖息在下层，从树干上寻找猎物。`T`.\
  \ `m`. `capucinus` (6b) 出于巽群岛。\n**鸣声：** 幽灵般的、忧郁的上升下降调；还有短促的 `huuw`。\n**栖息地：** 原始林。\n\
  **分布：** 巽群岛特有。\n\n# 7 鳞纹胸翠鸟（摄政翠鸟）\n*Actenoides princeps* 24cm\n**野外记录：** 通常独居。栖息在下层。`A`.\
  \ `p`. `erythros` (7c) 出于巽群岛。\n**鸣声：** 一连串柔和、忧郁的哨声。\n**栖息地：** 原始林。\n**分布：** 苏拉威西特有。\n\
  \n# 8 普通天堂翠鸟\n*Tanysiptera galatea* 33cm\n**野外记录：** 动作缓慢的树冠层觅食者。`T`. `g`. `margareth`\
  \ (8b) 出于巴丹岛。\n**鸣声：** 柔和、忧郁的颤音；还会发出沙哑的咯咯。\n**栖息地：** 原始林。\n**分布：** 马鲁古群岛特有（凯群岛）。\n\
  \n![image](img/page63.jpg)\n\n## 25 杜鹃\n\n# 1 宽嘴杜鹃\n*Scythrops novaeliae* 58–65cm\n\
  **野外记录：** 通常单只或成群出现。出没于树冠层。\n**鸣声：** 响亮、拉长的上升尖叫，还有短促的 `huuw`。尖锐、加速的 `phew phew phewphewphewphew`\
  \ 然后下降。\n**栖息地：** 森林边缘、季风林。\n**分布：** 华莱西当地留留；马鲁古群岛非繁殖期访客。\n\n# 2 栗翅杜鹃\n*Clamator\
  \ coromandus* 41–47cm\n**野外记录：** 通常隐藏在树冠层，但经常在植物中觅食。\n**鸣声：** 金属感的哨声 `thu-thu thu-thu\
  \ thu-thu`，还有刺耳的 `chee-kek` 或 `crititit`。\n**栖息地：** 森林空地、灌丛林、红树林。\n**分布：** 苏门答腊、爪哇、婆罗洲和菲律宾的冬季访客。\n\
  \n# 3 菲律宾灰喉杜鹃\n*Surniculus velutinus* 24–25cm\n**野外记录：** 隐秘。树栖性。在叶丛中寻找时动作缓慢。\n**鸣声：**\
  \ 上升的 `wu wu waa waa wee` 或 `wi wi wi…`。\n**栖息地：** 平原森林和森林边缘。\n**分布：** 菲律宾特有。\n\n\
  # 4 方尾灰喉杜鹃\n*Surniculus lugubris* 24–25cm\n**野外记录：** 行为与前物种相似。\n**鸣声：** 响亮、清晰、柔和的哨声，向上。\n\
  **栖息地：** 原始林、森林边缘和次生灌丛。\n**分布：** 栖息于苏门答腊、爪哇、巴厘岛、婆罗洲和菲律宾宾西部。\n\n# 5 叉尾灰喉杜鹃\n*Surniculus\
  \ dicruroides* 24–25cm\n**野外记录：** 动作缓慢的树冠层树栖觅食者；在裸露的树梢鸣叫。\n**鸣声：** 上升的 `pip-pip-pip-pip-pip-pip`；还会发出尖锐、加速的\
  \ `phew phew phewphewphewphew` 然后下降。\n**栖息地：** 阔叶常绿林和落叶林、次生林、种植园偶尔出现在红树林。\n**分布：**\
  \ 罕见，记录于婆罗洲。\n\n\n\n\n\n# 6 摩鹿加门杜鹃\n*Surniculus musschenbroeki* 24cm\n野外记记：通常通过鸣声辨别存在；通常单只或成对出现，在树冠上层层觅食。常被认为与方尾杜鹃为同物种。鸣声：一种上升的、哨般的`ki\
  \ ki ki ki ki ki ki ki`，重复出现，有时会变得嘶哑而狂乱。栖息地：原生林、高大次生林和森林边缘。分布：留于苏拉威锡岛和北马鲁古群岛。\n\n\
  ![image](img/page065.jpg)\n\n## 26 杜鹃\n\n### 1 斑须杜鹃\n*Hierococcyx vagans* 28–30cm\n\
  野外记记：在树冠层觅食。通过鸣声最易确定其位置。鸣声：响亮而单调的`peu-peu`，还有一组上升的柔和音符，加速到狂热的高潮后突然结束。栖息地：低地和丘山森林，以及森林边缘。分布：留于苏门答腊和婆罗洲；爪哇岛的漂留。\n\
  \n### 2 大杜鹃\n*Hierococcyx sparverioides* 38–40cm\n野外记记：行踪隐秘，在叶中低调地觅食；通过鸣声最易确定其位置。鸣声：尖锐的`pi-pee-ha…\
  \ pi-pee-ha`，随后进入狂乱的高潮。栖息地：多样，从灌丛丛到山区森林。分布：爪哇、婆罗洲、菲律宾和苏拉威锡的非繁殖访客。\n\n### 3 深色杜鹃\n\
  *Hierococcyx bocki* 31cm\n野外记记：曾被认为是前一种物种的种；假设其行为和习惯相似。鸣声：双音节的哨声`pee-ha pee-ha`或`pi-phu\
  \ pi-phu`。栖息地：丘山和山区森林。分布：留于苏门答腊和婆罗洲。\n\n### 4 马来亚杜鹃\n*Hierococcyx fugax* 28–30cm\n\
  野外记记：树栖；躲避，通常在较低处，鸣叫时向高处移动。鸣声：尖锐而促的`gee-whizz`…`gee-whizz`…，通常随后是快速的`ti-tu-tu`音符，加速到尖锐的高潮，并以较慢的`tu-tu-tu`结束。栖息地：森林、次生林、灌丛和种植园。分布：留于苏门答腊和婆罗洲。\n\
  \n### 5 栗腹杜鹃\n*Hierococcyx hyperythrus* 28–30cm\n野外记记：躲避，通常在灌木丛或林下低处觅食。鸣声：尖叫的`joo-ichi\
  \ joo-ichi`。栖息地：林地和灌木丛。分布：婆罗洲、菲律宾、苏拉威锡和南马鲁古的非繁殖访客。\n\n### 6 霍格森杜鹃\n*Hierococcyx\
  \ nisicolor* 28–30cm\n野外记记：树栖，在林下躲避并觅食。鸣声：类似于马来亚杜鹃，但结尾有快速的`trrrrr-titititititrrrtrrr`。栖息地：山区森林。分布：苏门答腊、爪哇和婆罗洲的非繁殖访客。\n\
  \n### 7 菲律宾杜鹃\n*Hierococcyx pectoralis* 29cm\n野外记记：害羞，通常单只或成对出现；在所有高度层层觅食。鸣声：一种`wheet\
  \ wheet wheet wheet tu`，重复九或十次，声音越来越大、越来越快，并以狂乱结束。栖息地：从低地到山山的森林和次生林。分布：菲律宾特有。\n\n\
  ### 8 浅色杜鹃\n*Cacomantis pallidus* 31–32cm\n野外记记：经常在开阔处栖息；通常独居，尽管在澳大利亚有小群聚集的记录。鸣声：八音节的上升且加速的哨声；雌性发出嘶哑的哨声。栖息地：开阔林地、空地和有树的开阔地区。分布：北马鲁古和小巽达群岛的非繁殖访客。\n\
  \n### 9 斑纹湾杜鹃\n*Cacomantis sonneratii* 24cm\n野外记记：听得多见得少，尽管经常从暴露的栖木上鸣叫。鸣声：尖锐的`pi-pi-pew-pew`或`smoke-yer-pepper`。栖息地：开阔森林、次生林、灌木丛和耕区。分布：留于苏门答腊、爪哇和婆罗洲。\n\
  \n![image](img/page067.jpg)\n\n## 27 杜鹃\n\n### 1 哀杜鹃\n*Cacomantis merulinus* 23cm\n\
  野外记记：主要是树栖；在树顶叶丛中穿梭的觅食者，有时为了捕飞昆虫而俯冲，或降到地面捡拾猎物。鸣声：重复的`tay… ta… teee…`，还有一组下降、加速、颤音般的`pwee\
  \ pwee pwee pee-pee-pee-pee-pee-pee`。栖息地：开阔林地、次生林和耕区。分布：留于苏门答腊、爪哇、婆罗洲、菲律宾和苏拉威锡。\n\
  \n### 2 丛杜鹃\n*Cacomantis variolosus* 23cm\n野外记记：行踪隐秘，听多见少。`C`.`v`。`infaustus` (2b)\
  \ 发现于北马鲁古和东马鲁古。鸣声：一组 4–10 声重复的哨声，`weep weep weep`。栖息地：森林。分布：苏拉岛。\n\n### 3 锈腹杜鹃\n\
  *Cacomantis sepultis* 21–25cm (注：原文学名与标题似乎有出入，此处按内容翻译)\n(注：Rusty breasted cuckoo，原文应为\
  \ Rusty breasted Cuckoo，锈腹杜鹃)\n野外记记：在树木和灌木丛中觅食。有时被认为与丛杜鹃为同物种。鸣声：一种忧郁的`whi whi whi\
  \ whi`，还有一组加速的`whi-wibu`。栖息地：森林。分布：苏拉岛、小巽达群岛和马鲁古群岛（留于此处）。\n\n### 4 摩鹿加门杜鹃\n*Cacomantis\
  \ aeruginosus* 24cm\n野外记记：通常独居，其存在通过鸣声辨别。鸣声：一组快速重复的哨声，在结尾稍慢，`hoop hoop hoop`。栖息地：山区森林。分布：北马鲁古特有。\n\
  \n### 5 苏拉威锡杜鹃\n*Cuculus crassstris* 38cm\n野外记记：害羞，在树干附近的叶区栖息；单只或成对出现。鸣声：远传的、柔和的`ho-hoo`或`hoo-oo`还有一组`ko\
  \ ku`，最后一个音符几乎听不见。栖息地：原生林、高大次生林和森林边缘。分布：苏拉威锡特有。\n\n### 6 印度杜鹃\n*Cuculus micropterus*\
  \ 33cm\n野外记记：行踪隐秘，主要在树冠层觅食。腹部有宽纹。有些鸟背部看起来更黄。鸣声：响亮、持续的哨声，通常记录为`one-more-bottle`；雌性发出咕咕声。栖息地：低地和丘山森林。分布：苏门答腊、爪哇、婆罗洲、菲律宾；北马鲁古岛的漂留。\n\
  \n### 7 东方杜鹃\n*Cuculus optatus* 30–33cm\n野外记记：在树冠层觅食。缺乏深色末端羽。鸣声：低沉的`hoop hoop hoop`，还有一组粗哑的`gaak-gaak\
  \ ga-ak-ak-ak`；雌性发出咕声。栖息地：低地森林和森林边缘。分布：婆罗洲的非繁殖访客。\n\n### 8 喜马拉雅杜鹃\n*Cuculus saturatus*\
  \ 30–32cm\n野外记记：行踪隐秘，在树冠层觅食。腹部染有褐色。鸣声：`hoop hoop-hoop`或`tun-tadun`。栖息地：低地到亚山森林。分布：苏门答腊、爪哇、婆罗洲、菲律宾的冬季访客。\n\
  \n### 9 巽达腊小杜鹃\n*Cuculus lepidus* 26–29cm\n野外记记：行踪隐秘，通过鸣声最易确定位置。主要在树冠层觅食。曾被认为与外观相似但更大的喜马拉雅杜鹃为同物种。鸣声：响亮的`kuk\
  \ hoo hoo hoo`，还有柔和的`pu-pu`；雌性发出咕咕声。栖息地：原生丘山森林。分布：留于苏门答腊、爪哇、婆罗洲和小巽达群岛。\n\n\n\n\n\
  \n# 1 小铜绿杜鹃\n*Chrysococcyx minutillus* 15–16cm\n野外记录：行为低调，倾向于在茂密的叶丛中觅食。“黑背铜杜鹃”*C.*\
  \ *m.* *rufomerus* (1b) 分布于小巽登群岛；“斑铜杜鹃”*C.* *m.* *crassirostris* (1c) 发现于马鲁古群。\n\
  鸣声：下降的 `rhew rhew rhew rhew` 或 `teu teu teu teu teu…`，有时包含向上升的尖锐声 `wireg-reeg-reeg`；还会发出高亢而长颤鸣声。\n\
  栖息地：海岸灌木丛、红树林、次生林、森林边缘、公园和花园。\n分布：留于苏门答腊、爪哇、婆罗、菲律宾、苏拉威锡、马鲁古群和小巽登群岛。\n\n# 2 霍斯菲德铜杜鹃\n\
  *Chrysococcyx basalis* 16cm\n野外记录：从地面到树冠各层级觅食。有时以小群形式出现。\n鸣声：下降的、高亢的哨声 `peeer` 或\
  \ `tseeeuw`，不断重复。\n栖息地：海岸灌木丛、海岸及近岸林地。\n分布：爪哇、巴厘岛、苏拉威锡和小巽登群岛的非繁殖访客；苏门答腊和婆罗的迷留鸟。\n\
  \n# 3 亚洲绿翠杜鹃（东方绿杜鹃）\n*Chrysococcyx maculatus* 18cm\n野外记录：喜爱树冠的树枝和叶片；活跃的觅食者，经常进行俯冲捕捉飞行中的昆虫。\n\
  鸣声：响亮的下降声 `kee-kee-kee`；飞行时还会发出 `chweek` 声。\n栖息地：低地森林和次生林。\n分布：苏门答腊的冬客。\n\n# 4 闪光铜杜鹃\n\
  *Chrysococcyx lucidus* 17cm\n野外记录：通常独居。从低矮灌木到树顶都是低调的觅食者。\n鸣声：通常保持沉默；可能会发出一个上扬调的\
  \ `fleei`，快速重复并通常以下降的 `pee-eerr` 结束。\n栖息地：林地、林缘、灌木状次生林和村庄花园。\n分布：小巽登群岛的非繁殖访客。\n\n\
  # 5 紫翅绿杜鹃\n*Chrysococcyx xanthorhynchus* 17cm\n野外记录：行踪神秘，在叶丛中爬行寻找猎物；鸣叫时常栖在高树顶端。\n\
  鸣声：响亮、尖锐且重复的 `tee-wit`，常在飞行时发出；还有下降的颤音 `seer-se-seer seeseeseesee`。\n栖息地：低地和山地森林、森林边缘、次生林、红树林和种植园。\n\
  分布：留于苏门答腊、爪哇、婆罗和菲律宾。\n\n# 6 黑耳杜鹃\n*Chrysococcyx osculans* 20cm\n野外记录：在灌木植物中低处觅食；通常独居。\n\
  鸣声：安静、长长的、下降的、哀的 `piiieeer`；还有欢快的 `peeowee` 或 `cheeowee`。\n栖息地：开阔林地和开阔灌木地。\n分布：马鲁古群岛和小巽登群岛的冬客。\n\
  \n![image](img/page071.jpg)\n\n# 29 蜜喉鸟类\n\n## 1 绿嘴蜜喉鸟\n*Phaenicophaeus tristis*\
  \ 38cm\n野外记录：行踪隐秘。在茂密的丛林中觅食；在弱弱地从一个丛林飞到另一个丛林时最易被发现。\n鸣声：柔和、鼻音的 `oh-oh-oh-oh` 和类似青蛙的\
  \ `ko ko ko ko ko`；受惊扰时发出奇特的咯咯声。\n栖息地：山地至亚山森林。\n分布：留于苏门答腊。\n\n## 2 黑腹蜜喉鸟\n*Phaenicophaeus\
  \ diardi* 38cm\n野外记录：在茂密的下层植被和藤本中觅食。有时以小群形式出现。\n鸣声：粗哑的 `gwuap`、急促的 `gwagaup` 和响亮的\
  \ `pauk`。\n栖息地：低地和山地森林、沼泽森林和次生林。\n分布：留于苏门答腊和婆罗。\n\n## 3 栗腹蜜喉鸟\n*Phaenicophaeus sumatranus*\
  \ 40–41cm\n野外记录：行踪神秘，在树木和丛林中穿行。\n鸣声：低沉的 `tok tok…`，还有细而高亢的啾啾声。\n栖息地：原生低地森林和次生林、森林边缘和灌丛。\n\
  分布：留于苏门答腊和婆罗。\n\n## 4 栗胸蜜喉鸟\n*Phaenicophaeus curvirostris* 42–49cm\n野外记录：常静止地坐在树冠上；移动时像松鼠一样摇动尾巴。经常是混群觅食的一员。\n\
  鸣声：低沉的咯咯声 `kuk kuk kuk` 和更快的 `kok-kok-kok…`；激动时会发出类似猫的 `miaou`。\n栖息地：原生和次生森林，从低地到山地，也包括种植园。\n\
  分布：留于苏门答腊、爪哇、巴厘岛、婆罗和菲律宾西部。\n\n## 5 拉夫莱尔蜜喉鸟\n*Rhinortha chloropea* 32–35cm\n野外记录：在藤本植物中稳缓慢移动。常成小群聚集。\n\
  鸣声：下降的鸣声 `seeah` 和粗糙的吱吱声。\n栖息地：次生林。\n分布：留于苏门答腊。\n\n## 6 红嘴蜜喉鸟\n*Zanomus javanicus*\
  \ 42cm\n野外记录：在茂密的植被中隐行。\n鸣声：类似青蛙的 `uc…` 和响亮的 `pop-pop`。\n栖息地：原生林和次生林。\n分布：留于苏门答腊、爪哇和婆罗。\n\
  \n## 7 黄嘴蜜喉鸟\n*Dasylophus cumingi* 51–53cm\n野外记录：通常单只或成对出现，在树冠的茂密叶丛中觅食。\n鸣声：鼻音颤音加速并逐渐消失；还有喉音的\
  \ `chuk-chuk`。\n栖息地：低地和亚山森林。\n分布：苏拉威锡特有。\n\n## 8 鳞羽蜜喉鸟\n*Dasylophus kid* 40–41cm\n\
  野外记录：通常单只或成小群出现，在茂密的叶丛中。\n鸣声：爆发性的高音声 `whizz-kid`。\n栖息地：原生林和次生林。\n分布：菲律宾北部特有。\n\n\
  ## 9 红冠蜜喉鸟\n*Dasylophus supercilosus* 41–42cm\n野外记录：在茂密森林中缓慢移动。\n鸣声：金属质的 `chuk-chuk`。\n\
  栖息地：次生林和森林边缘。\n分布：菲律宾北部特有。\n\n![image](img/page073.jpg)\n\n# 30 杜鹃类\n\n## 1 黑兜杜鹃\n\
  *Centropus steerii* 46cm\n野外记录：行踪神秘，多听少见；在茂密的叶丛和藤蔓植物中隐行。\n鸣声：响亮的 `hoooot hoot-hoot-hoot-hoot…`，下降后变弱。\n\
  栖息地：低地原生森林。\n分布：吕民岛（NC）特有。\n\n## 2 菲律宾杜鹃\n*Centropus viridis* 41–43cm\n野外记录：在茂密的植被中穿行，但常栖息在灌木和高草上。\n\
  鸣声：多种鸣声，包括快速的 `coo-coo-coo-coo…` 或 `boop-boop-boop-boop…`，以及独特的 `chi-gook`、`chi-gook-gook`\
  \ 或 `chi-go-go gook`。\n栖息地：草场、耕地、次生林和丛林。\n2 布：菲律宾特有。\n\n## 3 爪哇杜鹃（小巽登杜鹃）\n*Centropus\
  \ nigrorufus* 46cm\n野外记录：典型的杜鹃隐行习性。\n鸣声：未有描述，但认为与大杜鹃相似。\n栖息地：海岸湿地、丛林、沼泽、红树林和红树林附近的高草地。\n\
  分布：爪哇特有。\n\n## 4 大杜鹃\n*Centropus sinensis* 48cm\n野外记录：在植被中隐行；寻找猎物时，常尾部保持水平行走。幼鸟下部有细白色条纹，上部深棕色条纹，黑色尾巴细白色条纹，头部为褐黑色。\n\
  鸣声：深沉 `hoop-hoop-hoop-hoop-hoop-hoop`，下降后上升。\n栖息地：次生林、森林边缘、芦苇河岸、红树林和耕区。\n分布：留于苏门答腊和婆罗。\n\
  \n\n\n\n\n## 5 小普通犀\n*Centropus bengalensis* 31–33cm\n野外记录：典型的犀类躲避习性。鸣声：深沉的*whoop\
  \ whoop whoop whoop kurook kurook kurook*……，速度加快且音调降低。\n栖息地：沼泽、草地、灌木丛和森林边缘。\n分布：全地区留鸟，除东南摩卢拉加群岛外。\n\
  \n## 6 黑脸大犀\n*Centropus melanops* 42–48cm\n野外记录：在中层和上层冠层的密叶中躲藏，通常独居或成对出现。\n鸣声：响亮的*woooop\
  \ woooop woooop*，还有一段下降的*boop boop boop boop*。\n栖息地：低地森林和森林边缘。\n分布：菲律宾南部和东南部特有。\n\
  \n## 7 湾兜大犀\n*Centropus celebensis* 44–50cm\n野外记录：通常成对或小群群活动，在从林下层到下冠层的密植被中躲藏。\n\
  鸣声：加速的、深沉的*hoo hoo hoo hoo hoo hoo hoo hoo hoo hoo*，起始音高后下降，最后两三个音节时减慢又上升；还会发出长连串上扬的*woop*声。\n\
  栖息地：原生林和高大的的次生低地森林及山地森林、森林边缘和密集的林下层。\n分布：苏拉威锡岛特有。\n\n## 8 栗色大犀\n*Centropus unirufus*\
  \ 38–42cm\n野外记录：通常以多达 12 只左右的小嘈闹群体出现。在密集的灌木丛林下层中觅食，特别青睐竹丛。\n鸣声：清脆的*squip whip*或*squip\
  \ whip whip whip*，通常由穿过树木的群群发出。\n栖息地：有浓密林下层和竹林的低地及山地森林。\n分布：菲律宾北部特有。\n\n![image](img/page075.jpg)\n\
  \n31 犀类；地鹃类；澳洲鹃\n\n## 1 巨大犀\n*Centropus goliath* 62–70cm\n野外记录：通常成对或小群群活动，在林下层到中层之间爬行，有时在更高处。\n\
  鸣声：持续的一系列深沉*ooom*声；受惊时，发出粗哑的、喉音般的*kcau*或*kcau-kuc*。\n栖息地：原生林、森林边缘和密集的林下层。\n分布：北摩卢拉加群岛特有。\n\
  \n## 2 雉大犀\n*Centropus phasianinus* 53–80cm\n野外记录：通常成对或独居。通过在植被中爬行觅食，或通过行走或奔跑捕捕猎物。\n\
  鸣声：长长的、下降后上升的响亮空灵音系列；还有一系列响亮、刺耳的嘶嘶声。\n栖息地：沼泽草地、次生季风森林和边缘草地。\n分布：东小巽达群岛（帝汶岛）留鸟。\n\
  \n## 3 凯大犀\n*Centropus spilopterus* 53–62cm\n野外记录：通常被认为是*C. phasianus*的一个亚种。通常独居或成对。在次生耕地和叶片稀少的树木上经常可见。\n\
  鸣声：传播距离很远的系列短促、上升后下降的*bop*声。\n栖息地：林木稀疏的耕地、森林边缘、残留林斑块和灌木丛。\n分布：南摩卢拉加群岛（凯岛）特有。\n\n\
  ## 4 短趾大犀\n*Centropus rectunguis* 37cm\n野外记录：害羞且躲避，独居。。花时间在地面上觅食猎物。\n鸣声：连续四五个共鸣的、轰鸣音，*buup\
  \ buup buup buup*，在结尾处下降，每几秒重复一次。\n栖息地：低地原生林、河边灌木丛和海岸灌木丛。\n分布：苏门答腊和婆罗洲留鸟。\n\n##\
  \ 5 婆罗洲地鹃\n*Carpococcyx radiceus* 60cm\n野外记录：在地面觅食，经常跟随兵蚁群、猪或熊捕捕被扰扰的幼虫和蠕虫。\n鸣声：传播很远的*whoo-hooh\
  \ whoo-hooh whoo-hooh*。\n栖息地：冲积林和沼泽森林，以及未受干扰的低地河流森林。\n分布：婆罗洲特有。\n\n## 6 苏门腊地鹃\n\
  *Carpococcyx viridis* 55cm\n野外记录：记载较少，已知是害羞的地面觅食者且非常罕见。\n鸣声：咳嗽般的*heh heh heh*和响亮的*tock-tor*。\n\
  栖息地：丘陵地区的森林。\n分布：苏门答腊特有。\n\n## 7 亚洲鹃\n*Eudynamys scolopaceus* 40–43cm\n野外记录：低调，通常待在密叶中；活动迹象通常是看到鸟在树木间飞行。\n\
  鸣声：尖锐的*ko-el ko-el ko-el*，在突然结束前规模和音调增加；还有一段下降的、泡泡般的*wreep-wreep-wreep-wreep-wreepwreepwreep*。\n\
  栖息地：稀疏林地、灌木丛、耕地和公园。\n分布：苏门答腊、爪哇、摩卢拉加留鸟。\n\n## 8 黑嘴鹃\n*Eudynamys melanorhynchus*\
  \ 36–44cm\n野外记录：独居、成对或小群群活动，多听少见。出没于中层和冠层。\n鸣声：咳嗽般的*heh heh heh*和响亮的*tock-tor*。\n\
  栖息地：低地和山地森林。\n分布：摩卢拉加群岛特有。\n\n## 9 太平洋鹃\n*Eudynamys orientalis* 39–47cm\n野外记录：行为与亚洲鹃相似。\n\
  鸣声：长长的、下降后上升的响亮音；还有一系列响亮、刺耳的嘶嘶声。\n分布：东小巽达群岛留鸟；南摩卢拉加群岛客鸟。\n\n![image](img/page077.jpg)\n\
  \n## 32 鹦嘴喙\n\n### 1 兜鹦嘴喙\n*Probosciger aterrimus* 55–60cm\n野外记录：通常独居或成对。在树上觅食，有时在地面。\n\
  鸣声：持续的一系列深沉*ooom*声。\n栖息地：低地和森林。\n分布：南摩卢拉加群岛（凯岛）。\n\n### 2 黄冠鹦嘴喙\n*Cacatua sulpurea*\
  \ 33cm\n野外记录：显眼；独居、成对或小群群活动，栖息时成大群。主要在下冠层觅食，或在捕食作物时在地面。\n鸣声：粗鲁的叫声和各种哨声、吱啾声。\n栖息地：原生林和高大的次生低地及山地森林。\n\
  分布：苏拉威锡和巽达群岛留鸟。\n\n### 3 硫冠鹦嘴喙\n*Cacatua galerita* 45–55cm\n野外记录：显眼；独居、成对或小嘈闹群群活动。在树上觅食。\n\
  鸣声：响亮的、粗鲁的叫声。\n栖息地：季风森林、开阔林地和林木稀疏的耕地。\n分布：引入自南摩卢拉加群岛。\n\n### 4 鲑肉冠\n*Cacatua moluccensis*\
  \ 46–52cm\n野外记录：通常独居、成对或小群群活动。除飞往栖息地时外不显眼。\n鸣声：粗鲁的叫声和鼻性的断续叽叽喳。\n栖息地：原生林和高大的次生低地及山地森林。\n\
  分布：南摩卢拉加群岛特有。\n\n### 5 白鹦嘴喙\n*Cacatua alba* 46cm\n野外记录：嘈闹且显眼；独居、成对、小群群活动或在傍晚成大群活动。出没于冠层。\n\
  鸣声：短促、鼻性的、高音的叫声。\n栖息地：原生林和高大的次生低地及山地森林、森林边缘和残留林。\n分布：北摩卢拉加群岛特有。\n\n\n\n\n\n# 6 菲律宾凤头鹦鹉（红尾葵鹦鹉）\n\
  *Cacatua haematuropygia* 30cm\n\n**野外记录：** 通常单只、成对或成多达 30 只的群出现。非繁殖期群体具有游牧性；经常袭击农作物。是菲律宾唯一的全白色陆地鸟。\n\
  \n**鸣声：** 多种刺耳的叫声，当群体一起鸣叫时声音可能非常大。\n\n**栖息地：** 低地、河岸和红树林、森林边缘以及相邻的开阔地。\n\n**分布范围：**\
  \ 菲律宾特有。\n\n# 7 坦敏巴葵鹦鹉\n*Cacatua goffiniana* 31–32cm\n\n**野外记录：** 常成大群出现。经常栖息在高树顶秃的树枝上。当头冠竖起时，会露出粉色的羽毛基部。\n\
  \n**鸣声：** 多种响亮、刺耳的尖叫。\n\n**栖息地：** 原生和高大的次生低地森林、森林边缘、林隙；也包括邻森林的农田。\n\n**分布范围：** 东小巽达群岛特有。\n\
  \n![image](img/page079.jpg)\n\n## 33 鹦鹉类\n\n## 1 红蓝葵鹦鹉\n*Eos histrio* 31cm\n\n**野外记录：**\
  \ 通常成对或小群活动，在群集栖息地会有更大的群体。*E*. *h*. *challengeri* (1b) 产于米安加斯岛（Miangas Island）。\n\
  \n**鸣声：** 短促、刺耳、叽叽喳的尖叫。\n\n**栖息地：** 原生低地和山地森林；也是椰子种植园。\n\n**分布范围：** 苏拉威西以北岛屿特有。\n\
  \n## 2 蓝颈葵鹦鹉\n*Eos squamata* 23–27cm\n\n**野外记录：** 成对或小群活动，在花期或果期树上觅食时会有较大的群体。*E*.\
  \ *s*. *obiensis* (2b) 产于奥比岛（Obi）和比萨岛（Bisa）。\n\n**鸣声：** 响亮、尖锐、刺耳且快速重复的尖叫。\n\n**栖息地：**\
  \ 原生和高大的次生低地及山地森林、森林边缘、灌木次生林、红树林和椰子种植园。\n\n**分布范围：** 留于北摩卢加群岛。\n\n## 3 红葵鹦鹉\n*Eos\
  \ bornea* 30cm\n\n**野外记录：** 通常成对或小群出现，偶尔发现大得多的群体。在花期或果期树上觅食。非常吵闹。\n\n**鸣声：** 尖叫声和更具律感的、铃般的音符。\n\
  \n**栖息地：** 原生和高大的次生低地及山地森林、红树林、椰子种植园以及人类居住区周围。\n\n**分布范围：** 南摩卢加群岛特有。\n\n## 4 蓝纹葵鹦鹉\n\
  *Eos reticulata* 31cm\n\n**野外记录：** 常出没于花树，通常成对或小群活动。\n\n**鸣声：** 拉长的鼻音尖叫或尖叫声；还发出类似八鸟的叽叽喳声和哨声。\n\
  \n**栖息地：** 原生和次生低地森林、开阔森林、红树林、林地作物和椰子种植园。\n\n**分布范围：** 东小巽达群岛特有。\n\n## 5 蓝耳葵鹦鹉\n\
  *Eos semilarvata* 24cm\n\n**野外记录：** 单只、成对或小群出现；访问花树和灌木觅食。\n\n**鸣声：** 响亮的尖叫。\n\n\
  **栖息地：** 原生山地森林和高山石楠丛。\n\n**分布范围：** 南摩卢加群岛（塞腊岛）特有。\n\n## 6 社交葵鹦鹉\n*Lorius garrulus*\
  \ 30cm\n\n**野外记录：** 通常成对出现，在在花树上觅食时偶尔成较大群体。*L*. *g*. *flavopalliatus* (6b) 产于巴坎岛（Bacan）、奥比岛（Obi）、奥比拉图岛（Obilatu）、卡西鲁塔岛（Kasiruta）和曼迪奥利岛（Mandioli）。\n\
  \n**鸣声：** 响亮、鼻音的双音节号角声；飞行时发出响亮、刺耳、颤抖的嘶声。\n\n**栖息地：** 原生和高大的次生低地及山地森林、森林边缘；偶尔访问椰子林。\n\
  \n**分布范围：** 北摩卢加群岛特有。\n\n## 7 紫颈葵鹦鹉\n*Lorius domicella* 28cm\n\n**野外记录：** 通常单只或成对出现，以敏捷的动作觅食以提取各种种子。\n\
  \n**鸣声：** 仅记录过具有优美的鸣叫声。\n\n**栖息地：** 山坡森林。\n\n**分布范围：** 南摩卢加群岛特有。\n\n## 8 红颊鹦鹉\n\
  *Geoffroyus geoffroyi* 21–30cm\n\n**野外记录：** 常出没于林冠，小群、成对或单只。经常显眼地栖息在裸露的树枝上。*G*.\
  \ *g*. *cyanicollis* (8b) 产于北摩卢加群岛；*G*. *g*. *keyensis* (8c) 产于南摩卢加群岛（凯岛）。\n\n**鸣声：**\
  \ 短促重复的 *kee* 声。\n\n**栖息地：** 原生和高大的次生森林、季风森林和林地、森林边缘、海岸林地、红树林、灌木丛和公园。\n\n**分布范围：**\
  \ 留于摩卢加群岛和小巽达群岛。\n\n## 9 蓝臀鹦鹉\n*Psittinus cyanurus* 18–19cm\n\n**野外记录：** 通常看到成对或小群在树上部觅食，或在森林林冠上方飞行。*P*.\
  \ *c*. *abbotti* (9b) 产于苏门答腊西北部外的岛屿。\n\n**鸣声：** 尖锐的号声和哨声。\n\n**栖息地：** 低地森林、沼泽森林红树林。\n\
  \n**分布范围：** 留于苏门答腊和婆罗洲。\n\n![image](img/page081.jpg)\n\n## 34 鹦鹉类\n\n## 1 月形鹦鹉\n\
  *Bolbopsittacus lunulatus* 16–17cm\n\n**野外记录：** 单只或成对出现。\n\n**鸣声：** 高音的哨声。\n\n**栖息地：**\
  \ 森林边缘、次生林和果树园。\n\n**分布范围：** 菲律宾宾。\n\n## 2 饰纹葵鹦鹉\n*Trichoglossus ornatus* 23–25cm\n\
  \n**野外记录：** 通常成对或小群活动，在花树上。\n\n**鸣声：** 短促的尖叫声。\n\n**栖息地：** 原生森林和次生森林。\n\n**分布范围：**\
  \ 苏拉威西特有。\n\n## 3 橄绿头葵鹦鹉\n*Trichoglossus euteles* 25cm\n\n**野外记录：** 小群活动，在花树上。\n\
  \n**鸣声：** 快速的嗡嗡声、拉长的哨声和尖锐的尖叫。\n\n**栖息地：** 稀树。\n\n**分布范围：** 中小巽达群岛特有。\n\n## 4 柠檬色葵鹦鹉（黄绿葵鹦鹉）\n\
  *Trichoglossus flavidis* 21cm\n\n**野外记录：** 成对或小群活动。*T*. *f*. *meyeri* (4b) 产于苏拉威西。\n\
  \n**鸣声：** 包括高音尖叫、叽叽喳声和细长的哨声。\n\n**栖息地：** 山地森林。\n\n**分布范围：** 苏拉群岛。\n\n## 5 椰子葵鹦鹉\n\
  *Trichoglossus haematodus* 25–30cm\n\n**野外记录：** 通常成对、群体或大群，特别是在花树上。这种和以下四种鸟被认为是彩虹鹦鹉\
  \ *T.uccanus* 的亚种。\n\n**鸣声：** 飞行时重复的刺耳尖叫，栖息时发出尖锐的鸣声。\n\n**栖息地：** 大多数低地和山地林地、椰子和其他种植园，以及郊区。\n\
  \n**分布范围：** 留于南摩卢加群岛。\n\n## 6 日落葵鹦鹉\n*Trichoglossus forsteni* 25–30cm\n\n**野外记录：**\
  \ 见同椰子葵鹦鹉。*T*. *f*. *djamanus* (6b) 产于贾皮岛（Jampea）。\n\n**鸣声：** 与椰子葵鹦鹉相同。\n\n**栖息地：**\
  \ 大多数山地林地。\n\n**分布范围：** 巴厘岛、西小巽达（龙莫比和松巴瓦）以及弗罗斯海的岛屿（贾皮和卡拉奥托）。\n\n## 7 叶葵鹦鹉（弗罗斯葵鹦鹉）\n\
  *Trichoglossus weberi* 25cm\n\n**野外记录：** 见同椰子葵鹦鹉。\n\n**栖息地：** 雨林和木麻林。\n\n**分布范围：**\
  \ 小巽达群岛（弗罗斯岛）。\n\n## 8 红领葵鹦鹉\n*Trichoglossus rubritorquis* 26cm\n\n**野外记录：** 见同椰子葵鹦鹉。\n\
  \n**鸣声：** 与椰子葵鹦鹉相同。\n\n**栖息地：** 认为与椰子葵鹦鹉相似。\n\n**分布范围：** 留于东小巽达群岛。\n\n## 9 金盏花葵鹦鹉\n\
  *Trichoglossus capistratus* 26cm\n\n**野外记录：** 见同椰子葵鹦鹉。\n\n**鸣声：** 与椰子葵鹦鹉相同。\n\n\
  **栖息地：** 原生和次生森林、干旱林地和种植园。\n\n**分布范围：** 中小巽达群岛特有。\n\n## 10 棉兰脑葵鹦鹉\n*Trichoglossus\
  \ johnstoniae* 18cm\n\n**野外记录：** 通常成对或吵闹的群出现；经常看到群体在树木间飞行。\n\n**鸣声：** 叫声包括尖锐的 *chick*、*chick-it*\
  \ 或 *twick-it*。\n\n**栖息地：** 山地森林和森林边缘。\n\n**分布范围：** 菲律宾南部特有。\n\n\n\n\n\n# 11 虹嘴琉鹦鹉\n\
  *Psitteuteles iris* 20cm\n野外记录：通常以小群形式出现，偶尔成大群。经常出没于开花树上。声音：各种尖锐的尖叫声和哨声。栖息地：原生林和高大的次生季风林、低地森林、山地和亚山森林。分布：特产于东巽达群岛。\n\
  \n# 12 蓝脸琉鹦鹉\n*Charmosyna toxopei* 16cm\n野外记录：通常成小群活动。声音：尖锐的 `ti`… `ti… ti`… `ti`…\
  \ `ti-ti-ti`。栖息地：原生林和次生林。分布：特产于南马鹿群岛（布鲁岛）。\n\n# 13 红颊琉鹦鹉\n*Charmosyna placentis*\
  \ 16–19cm\n野外记录：经常出现在树冠上层，在开花树上觅食，通常成对或成小群活动。声音：干涩的 `tst` 声和尖锐的 `skeesk` 声。栖息地：低地森林、森林边缘、沿海树木和种植园。分布：留于马鹿群岛。\n\
  \n![image](img/page083.jpg)\n\n## 35 鹦鹉\n\n### 1 山地凤尾鹦\n*Prioniturus montanus* 30cm\n\
  野外记录：单只、成对或成小群出现；穿过或飞越森林时非常嘈吵。幼鸟缺少扇羽（尾羽）。声音：叫声包括咯哈状的 `kak-kak-kak-kak ak ak ak`…、响亮而刺耳的音调，以及类似生锈门摇动的声音。栖息地：中海拔森林。分布：特产于菲律宾北部。\n\
  \n### 2 民兰瑶凤尾鹦\n*Prioniturus waterstradti* 27cm\n野外记录：曾被视为山地凤尾鹦的一个亚种；推测行为相似。幼鸟缺少扇羽。声音：推测与前一物种相似。栖息地：密的山林、山脊森林和矮矮的苔藓森林。分布：特产于菲律宾南部。\n\
  \n### 3 蓝头凤尾鹦\n*Prioniturus platenae* 27cm\n野外记录：单只、成对或成小群出现，在树冠层觅食。很嘈吵，尤其是飞行时。幼鸟缺少扇羽。声音：与山地凤尾鹦相似。栖息地：低地森林、灌木丛和红树林。分布：特产于菲律宾西部。\n\
  \n### 4 绿凤尾鹦\n*Prioniturus luconensis* 29cm\n野外记录：在树冠和林下层觅食，通常成对或成小群；傍晚时非常活跃。幼鸟缺少扇羽。声音：叫声包括粗哑的\
  \ `aaaak`、类似马的嘶鸣声、响亮的 `liiinng` 声以及 `yuur-witt`，后一个音节急剧上升。栖息地：低地森林、森林边缘和附近的耕作区。分布：特产于菲律宾北部。\n\
  \n### 5 蓝冠凤尾鹦\n*Prioniturus discurus* 27cm\n野外记录：以嘈闹的小群或成对形式出现。幼鸟缺少扇羽。声音：各种尖叫、吱吱声和刺耳音调。栖息地：原生林和次生林、红树林、果园和香蕉种植园。分布：特产于菲律宾。\n\
  \n### 6 民德罗凤尾鹦\n*Prioniturus mindorensis* 27cm\n野外记录：近期从前一物种分裂出来；推测习相似。幼鸟缺少扇羽。声音：推测与前一物种相似。栖息地：湿润森林，主要分布在低地。分布：特产于菲律宾南部民罗岛。\n\
  \n### 7 布鲁凤尾鹦\n*Prioniturus mada* 32cm\n野外记录：在森林树冠上觅食，通常成小群。幼鸟缺少扇羽。声音：重复的悦耳哨声、音乐般的\
  \ `si-quie`、快速重复的 `kwii kwii kwii` 和低音的 `squr-squr`。栖息地：原生低地、山地和山地森林。分布：特产于南马鹿群岛。\n\
  \n### 8 金冠凤尾鹦\n*Prioniturus platurus* 28cm\n野外记录：经常看到成小群或大群嘈闹地在树冠上方飞行；否则非常隐秘且难以发现。幼鸟缺少扇羽。*P.*\
  \ *p.* *sinerubris* (8b) 出于苏拉群岛（塔利亚布岛）。声音：叫声包括粗哑、鼻音的 `kaaa`、`krrrik` 或 `krrrri`，以及重复的鼻音\
  \ `quelie`。栖息地：原生林和高大的次生低地及山地森林、红树林和疏林化的耕作区。分布：特产于苏里威锡岛和苏拉群岛。\n\n### 9 黄胸凤尾鹦\n*Prioniturus\
  \ flavicans* 37cm\n野外记录：通常单只、成对或成小群出现；由于在高大树冠的茂密叶丛中觅食，通常安静且不起眼。经常加入混种觅食群。幼鸟缺少扇羽。声音：叫声包括音调交替的长尖叫声、一系列三个重复的鼻音犬吠式尖叫，以及音调较高的鼻音鸣声或约谷声。栖息地：原生低地和山地森林。分布：特产于苏里威锡岛。\n\
  \n### 10 蓝翼凤尾鹦\n*Prioniturus verticalis* 30cm\n野外记录：飞行时很嘈吵；行为与其他凤尾鹦相似。幼鸟缺少扇羽。声音：粗哑的\
  \ `aaaaak` 和吱吱的 `lee-aaaak`。栖息地：原生低地森林、森林边缘。\n\n![image](img/page85.jpg)\n\n## 36\
  \ 鹦鹉\n\n### 1 大嘴鹦\n*Tanygnathus megalchos* 33–43cm\n野外记录：单只、成对及偶尔成群出现；游荡，偶尔在岛屿间飞行。在果树树冠层觅食；有时栖息在露出的树枝上。*T.*\
  \ *m.* *subaffinis* (1b) 出于东巽达群岛。声音：粗哑、哨般的 `ke-rarr`、一系列重复的鼻音，通常在飞行时发出。栖息地：原生和次生低地及山地森林、森林边缘。\n\
  \n### 2 蓝颈鹦\n*Tanygnathus lucionensis* 31cm\n野外记录：单只、成对或成小群出现；取食果实。*T.* *l.* *talautensis*\
  \ (2b) 出于塔劳德岛。声音：尖锐的尖叫和粗哑的 `awwwk-awwwk`。栖息地：森林、森林边缘、耕作区内的残留森林、椰子林。分布：留于菲律宾及菲律宾群。\n\
  \n### 3 黑颊鹦\n*Tanygnathus gramineus* 40cm\n野外记录：通常单只出现，多听少见，记录较少。雌性有粉灰色喙。声音：与大嘴鹦相似，但更拉长且音调更高。栖息地：山地森林。分布：特产于南马鹿群岛（布鲁岛）。\n\
  \n### 4 蓝背鹦\n*Tanygnathus sumatranus* 32cm\n野外记录：在树冠层单只、成对或成小群觅食；经常低飞，距离地面仅几米。*T.*\
  \ *s.* *everetti* (4b) 出于菲律宾南部和中部。声音：粗哑的咯咯声 `nyak nyak`… 一声 `nyak` 随后是高音调尖叫、颤抖或约谷式的尖叫，以及响亮尖锐的\
  \ `kei`。栖息地：森林和森林边缘、沼泽森林、高大的次生林、残留林块和椰子种植园。分布：留于菲律宾、苏里威锡岛以及桑给、塔劳德岛。\n\n### 5 棱面鹦鹦\n\
  *Eclectus roratus* 35–42cm\n野外记录：嘈吵且显眼；通常单只、成对及偶尔成小群在树冠层觅食。有时栖息在部分露出的树枝上。*E.* *r.*\
  \ *reideli* (5b) 出于东巽达群岛；并分布于北马鹿群岛。声音：一系列响亮、沙哑、快速重复的尖叫，通常在飞行时发出；栖息时还会发出出的响亮的金属感吱吱声。栖息地：原生林和高大的次生低地及山地森林、红树林和种植园。分布：留于马鹿群岛和东巽达群岛。\n\
  \n\n\n\n\n# 6 摩卢加六冠鹦鹉\n*Alisterus amboinensis* 35cm 野外记录：更多见于飞行中；从林中层到树冠层觅食。*A*.\
  \ *a*. *hypophonius* (6b) 产于北摩卢加群岛（哈尔马黑拉岛）。鸣声：一系列高调、响亮、上扬的哨声；飞行时发出干涩的 `chack chack`\
  \ 声。栖息地：原生和次生低地森林及丘陵森林；偶尔出现在花园。分布：栖息于苏门答腊岛（班盖岛）、苏拉群岛和摩卢加群岛。\n\n# 7 橄榄肩鹦鹉\n*Aprosmictus\
  \ jonquillaceus* 35cm 野外记录：单只、成对或偶尔成小群出现，更多见于飞越森林空地；主要从林中层到树冠层觅食。鸣声：短促、刺耳、如摩擦摩擦的叫声。栖息地：原生森林和高大的次生季风森林、稀树草原林、耕地和灌木丛的次生林。分布：栖息于苏门答腊岛（班盖岛）、苏拉群岛和摩卢加群岛。\n\
  \n# 8 红胸长鹦鹉（红胸草鹦鹉）\n*Psittacula alexandri* 33–38cm 野外记录：通常以小族群出现，在食物充足时会有更大的群体。鸣声：短促、带鼻音的\
  \ `kaihk` 声，通常会重复。栖息地：开阔森林、林丛和耕地。分布：栖息于苏门答腊岛（西梅鲁岛、班达岛和尼亚斯岛）、爪哇岛、巴厘岛和婆罗洲岛。\n\n# 9\
  \ 长尾鹦鹉\n*Psittacula longicauda* 40–48cm 野外记录：通常发现于小群，在食物丰富的来源处会有较大的聚集。鸣声：高调的 `pee-yo\
  \ pee-yo pee-yo` 声和鼻性的、颤抖的 `graak graak graak` 声。栖息地：开阔的低地和沿海森林、森林沼泽、次生森林和种植园。分布：栖息于苏门答腊岛和婆罗洲岛。\n\
  \n![image](img/page087.jpg)\n\n## [37 鹦鹉类]\n\n### 1 黄冠小凤鹦鹉\n*Micropsitta keiensis*\
  \ 9cm 野外记录：成对或小族群出现。在树干和粗枝上觅食。鸣声：一系列短促、微弱、高调的音符。栖息地：所有类型的林地地区。分布：栖息于南摩卢加群岛（凯岛）。\n\
  \n### 2 红胸小凤鹦鹉\n*Micropsitta bruijnii* 8–9cm 野外记录：频繁出没于树木上层；敏捷的觅食者，单只、成对或小族群可见。鸣声：纤细、高调的\
  \ `tsee-tsee` 声。栖息地：原生和受干扰的丘陵及山地森林；偶尔出现在低地森林。分布：栖息于南摩卢加群岛（布鲁岛和塞拉姆岛）。\n\n### 3 蓝冠凤头鹦\n\
  *Loriculus galgulus* 12–14cm 野外记录：通常成对或小族群遇到。鸣声：尖锐的 `tsi`、`tsrri` 或 `tsi-tsi-tsi`\
  \ 声。栖息地：低地森林；偶尔出现在山地森林和种植园。分布：栖息于苏门答腊岛、婆罗洲岛，可能还有西爪哇岛。\n\n### 4 菲律凤头鹦\n*Loriculus\
  \ philippensis* 14cm 野外记录：单只、成对出现，并在觅食处成较大群体；喜好花果树。*L*. *p*. *apicalis* (4b) 发现于菲律宾南部；*L*.\
  \ *p*. *chrysonotus* (4c) 产于宿务岛；*L*. *p*. *bonapartei* (4c) 产于苏禄群岛；*L*. *p*. *regulus*\
  \ (4e) 发现于菲律宾中部。鸣声：尖锐的啾鸣。栖息地：所有类型的森林、林斑和花园。分布：菲律宾特有。\n\n### 5 苏拉凤头鹦\n*Loriculus\
  \ sclateri* 14cm 野外记录：有时被认为与摩卢加凤头鹦为同物种；推测行为相似。鸣声：争议认为与摩卢加凤头鹦相似。栖息地：原生和次生森林，以及部分开垦的相邻区域。分布：苏拉群岛特有。\n\
  \n### 6 桑基黑凤头鹦\n*Loriculus catamene* 12cm 野外记录：通常成对或小群群被发现；喜好开花的椰子树。鸣声：干涩、断续的、高调的双音节哨声，和一个上扬的\
  \ `sh-ui` 声。栖息地：残存的林斑、椰子和混合树木作物种植园。分布：桑基黑岛特有（位于苏门答腊岛北部）。\n\n### 7 卡米圭因凤头鹦\n*Loriculus\
  \ camiguinensis* 14cm 野外记录：在树冠层觅食。取食野生香蕉的种子、果实、浆果和花朵。被一些权威认为是菲律宾凤头鹦的一个亚种。鸣声：高调的\
  \ `tziit-tziit-tziit` 声。栖息地：高地森林。分布：菲律宾南部特有（卡米圭因岛）。\n\n### 8 苏拉威锡凤头鹦（大凤头鹦）\n*Loriculus\
  \ stigmatus* 15cm 野外记录：通常单只、成对或小族群出现；在开花或结果的树上觅食时数量较多。鸣声：高调的 `tsu-tsee` 声。栖息地：原生和次生森林。分布：苏拉群岛特有。\n\
  \n### 9 摩卢加凤头鹦\n*Loriculus amabilis* 11cm 野外记录：在树冠层觅食；单只、成对或小族群。鸣声：快速、微弱、高调的嗡嗡声。栖息地：原生森林。分布：摩卢加群岛。\n\
  \n### 10 黄喉鹦\n*Loriculus pusillus* 10cm 野外记录：从低地到山地。鸣声：尖锐、响亮的 `sree-ee` 声。栖息地：雨林。分布：爪哇岛特有。\n\
  \n### 11 华士凤头鹦\n*Loriculus flosculus* 12cm 野外记录：喜好果树。通常成对或小族群。飞行时发出尖叫的 `strrt strrt`\
  \ 声。栖息地：原生丘陵森林。分布：小巽他群岛（弗莱斯岛）。\n\n### 12 小凤头鹦\n*Loriculus exilis* 10–11cm 野外记录：在树冠层觅食，取花蜜。鸣声：短促、干涩的\
  \ `pssst` 声。栖息地：原生低地森林。分布：苏拉威锡岛特有。\n\n![image](img/page89.jpg)\n\n## [38 雨燕类]\n\n\
  ### 1 瀑布燕\n*Hydrochous gigas* 16cm 野外记录：群居性，常与其他燕类在一起。鸣声：尖锐的 `wicker` 声。栖息地：带有瀑布的山地森林。分布：苏门答腊岛和婆罗洲岛。\n\
  \n### 2 绿光燕（白腹燕）\n*Collocalia esculenta* 10cm 野外记录：群居性。具有倾斜和滑翔飞行，间插着类似蝙蝠的扇翅。*C*.\
  \ *e*. *marginata* (2b) 发现于菲律宾西部和北部；*C*. *e*. *spilura* (2c) 产于北摩卢加。目前正在将绿光燕划分为多个新物种。鸣声：尖锐的啾鸣。栖息地：开阔和森林地区。分布：在该地区分布，除爪哇岛、巴厘岛和西巽他群岛（兰巴岛）外。\n\
  \n### 3 洞燕（林燕）\n*Collocalia linchi* 10cm 野外记录：低空飞行，常成散散的小群。鸣声：高调的 `cheer-cheer`\
  \ 声。栖息地：森林和开阔地区，从海平面到山地。分布：栖息于婆罗洲、苏门答腊、爪哇岛、巴厘岛和西巽他群岛（兰巴岛）。\n\n### 4 婆罗洲燕\n*Collocalia\
  \ dodgei* 9–10cm 野外记录：通常被认为是洞燕的一个亚种；行为推测相似。栖息地：山区。分布：北婆罗洲特有。\n\n### 5 矮燕\n*Collocalia\
  \ troglodytes* 9cm 野外记录：以小群觅食，分布在森林、空地和内陆水域上方。鸣声：短促、喉部发出的 `chirp` 声。栖息地：低地森林和内陆水域。分布：菲律宾特有。\n\
  \n\n\n\n\n# 6 菲律宾雨燕\n*Aerodramus mearnsi* 10–11cm\n野外札记：在森林上方和开阔地觅食。鸣声：一系列节奏性的 `wi-ch-chew`\
  \ 鸣声。栖息地：附近有洞穴的山地地森林。分布范围：菲律宾特有。\n\n# 7 哈尔马黑拉雨燕\n*Aerodramus infuscatus* 10cm\n\
  野外札记：通常以 10–30 只鸟的群群觅食，经常与其他雨燕一同在一起。鸣声：一系列长长的、有节奏的 `wee-chi-chi` 鸣声。栖息地：遍布森林、受干扰地区和开阔地区。分布范围：北马鹿留贡群岛特有。\n\
  \n# 8 苏拉威锡雨燕\n*Aerodramus sororum* 10cm\n野外札记：行为被认为与前一种物种相似，某些权威认为其与其为同物种。鸣声：可能与前一种物种相似。栖息地：可能与前一种物种相似。分布范围：苏拉威锡特有。\n\
  \n# 9 塞兰雨燕\n*Aerodramus ceramensis* 10cm\n野外札记：被某些权威认为是哈尔马海拉雨燕的一个亚种；行为被认为相似。鸣声：可能与哈尔马海拉雨燕相似。栖息地：可能与哈尔马海拉雨燕相似。分布范围：南马鹿留贡群岛特有。\n\
  \n# 10 火山雨燕\n*Aerodramus vulcanorum* 14cm\n野外札记：出现在最高山开阔的山峰和脊线周围，快速飞行的集群。鸣声：尖锐的\
  \ `teeree-teeree-teeree`。栖息地：山脉和火山边缘。分布范围：西爪哇特有。\n\n![image](img/page091.jpg)\n\n\
  ## 39 雨燕类\n\n### 1 白腹雨燕\n*Aerodramus whiteheadi* 14cm\n野外札记：记录较少；特征是头部宽。鸣声：未有记录。栖息地：森林山地地区。分布范围：菲律宾特有。\n\
  \n### 2 苔巢雨燕\n*Aerodramus salangana* 12cm\n野外札记：在森林上方，有时在森林内部觅食。鸣声：尖锐的啾啾声、唧声和流水般的鸣声。栖息地：附近有洞穴的原始林。分布范围：居住苏答腊、爪哇和婆罗洲；在菲律宾为客鸟。\n\
  \n### 3 普通雨燕\n*Aerodramus vanikorens** 13cm\n野外札记：群居性，通常成小大小群，经常与其他雨燕物种在一起。鸣声：`zoo-zu-chee-chee`\
  \ 声和尖锐的颤鸣声。栖息地：多样，包括森林、草地、池塘和红树林，均附近有洞穴。分布范围：居住苏拉威锡、马鹿留贡群岛和东小巽群岛。\n\n### 4 线纹雨燕\n\
  *Aerodramus amelis* 13cm\n野外札记：被某些权威认为是普通雨燕的一个亚种；行为被认为相似。鸣声：可能与普通雨燕相似。栖息地：类似于普通雨燕。分布范围：菲律宾特有。\n\
  \n### 5 黑巢雨燕\n*Aerodramus maximus* 13cm\n野外札记：群居性，经常与其他雨燕在一起。在晨昏时分最活跃。鸣声：尖锐的唧唧唧声和流水般的鸣叫。栖息地：从低地到高地的一系列栖息地，包括繁殖地附近的茂密森林。分布范围：居住苏答腊、爪哇和婆罗洲。\n\
  \n### 6 种巢雨燕\n*Aerodramus fuciphagus* 12cm\n野外札记：群居性，经常与其他雨燕和燕子在一起。鸣声：响亮的、金属感的 `zwing`\
  \ 声。栖息地：开阔地区、离岸岛屿、森林和红树林。分布范围：居住苏答腊、爪哇、婆罗洲、小巽群岛和弗罗里斯海岛屿。\n\n### 7 杰尔曼雨燕\n*Aerodramus\
  \ germani* 11–12cm\n野外札记：群居性，经常与其他雨燕和燕子一同飞行。鸣声：各种 `chip` 声，其他与前一种物种相似。栖息地：开阔地区、岛屿、海岸和森林上方。分布范围：居住婆罗洲和菲律宾。\n\
  \n### 8 亚洲金腹雨\n*Cypsiurus balasiensis* 13cm\n野外札记：体型纤细。经常成小群快速飞行时可见；飞行时翅膀扇动间穿插着短距离滑翔。鸣声：颤音的\
  \ `te-he-he-he-he` 或 `tititee`。栖息地：开阔乡村、耕地和城市地区，通常附近有棕树。分布范围：居住苏答腊、爪哇、巴厘、婆罗洲、菲律宾和苏拉威锡。\n\
  \n### 9 叉尾（太平洋燕）\n*Apus pacificus* 17–18cm\n野外札记：在森林和山顶、海岸和城市地区觅食。下方边缘颜色浅，特别是在腹部和尾覆羽上。鸣声：高音的\
  \ `skree-ee-ee`。栖息地：森林地区以及开阔和城市地区。分布范围：该地区的冬季访客或途中候鸟；可能居住在菲律宾北部。\n\n### 10 远山燕\n\
  *Apus nipalensis* 15cm\n野外札记：具有像蝙蝠一样的扇翅飞行，并结合短距离滑翔。通常成群在建筑檐下、桥下或崖壁筑巢。鸣声：尖锐的鸣叫。\n\
  \n![image](img/page93.jpg)\n\n## 40 燕类\n\n### 1 菲律宾凤尾燕（菲律宾雨燕）\n*Mearns picina* 14cm\n\
  野外札记：通常单只或成小群可见，在森林上空觅食。鸣声：未记录。栖息地：森林地区。分布范围：菲律宾特有。\n\n### 2 银灰凤尾燕\n*Rhaphidura\
  \ leucopyialis* 11cm\n野外札记：飞行轻盈且无常。通常单只或成小群可见。鸣声：高音的 `tirrr-tirrr` 和快速的叽喳声。栖息地：原生和次生林；通常水水。分布范围：居住苏答腊、爪哇和婆罗洲。\n\
  \n### 3 白喉雨燕（尾燕）\n*Hirundapus caudacutus* 21–22cm\n野外札记：飞行快速有力。经常与其他燕物种一起迁徙。鸣声：柔和的\
  \ `trp-trp-trp`。栖息地：森林和开阔地区。分布范围：爪哇和婆罗洲的迁徙鸟。\n\n### 4 银背雨燕\n*Hirundapus cochinchens*\
  \ 20–22cm\n野外札记：通常在森林上成群遇到。鸣声：缓慢的颤音、尖锐的 `cirrwiet cirrwiet` 和纤细的 `chiek`。栖息地：从低地到山脉的森林地区，尤其是水边。分布范围：苏答腊和爪哇的冬季访客。\n\
  \n### 5 棕背雨燕\n*Hirundapus giganteus* 23–25cm\n野外札记：典型的强力飞行，翅膀在头顶经过时发出呼声。通常在森林、草地或沼泽上方捕昆虫。在池塘或河流边通过飞行啄水喝。鸣声：缓慢的颤音、尖锐的\
  \ `cirrwiet` 和纤细的 `chiek`。栖息地：森林和开阔地区。分布范围：居住苏答腊、爪哇、巴厘、婆罗洲和菲律宾西部。\n\n### 6 紫腹雨燕\n\
  *Hirundapus celebensis* 25cm\n野外札记：飞行极快，近距离听到时翅膀会产生喷气机般的“嗖”声。鸣声：未记录。栖息地：低地和丘陵的森林、开阔乡村和城市地区。分布范围：居住菲律宾和北苏拉威锡。\n\
  \n\n\n\n\n# 8 须眉雨燕\n*Hemiprocne mystacea* 28–31cm\n野外记录：通常成对或松散的小群出现，黄昏时分可能形成较大的群体。栖在开阔的树枝上，捕捉飞行昆虫后进行空中俯袭，通常在暮色中较活跃。\n\
  鸣声：叫声包括短促而响亮的 `skip` 声和嗡嗡的 `krerr` 声；飞行时，发出高调且下滑的 `kiiee` 声。\n栖息地：有树的开阔地区、森林边缘、河流区域、红树林和沿海林。\n\
  分布：栖息于马鲁鹿群岛，凯岛除外。\n\n# 9 络须雨燕\n*Hemiprocne comata* 15–17cm\n野外记录：花大量时间栖息在暴露的树枝上，通过短距离飞行捕捉昆虫。从下方观察其飞行时，可见翅下呈深色，边缘为白色。\n\
  鸣声：记录形式多样，如高调的 `she-she-she-she-shoo-shee`、尖锐的 `peoop` 或 `peeoop peoop-poo` 以及 `cheer-ter\
  \ cheer-ter`；还会发出哀怨的 `chew` 声。\n栖息地：森林边缘和林间空。\n分布：栖息于苏门答腊、婆罗洲和菲律宾，巴拉湾岛除外。\n\n![image](img/page095.jpg)\n\
  \n# 41 猫鹰\n## 1 米纳哈萨面雕鸮\n*Tyto inexspectata* 30cm\n野外记录：通常单只或成对出现，极少被观察到。\n鸣声：记录与苏拉威西面雕鸮相似，但声音较弱且浅。\n\
  栖息地：原生林和受轻微干扰的丘陵及低山森林。\n分布：苏拉威西特有。\n\n## 2 塔利亚亚布面雕鸮\n*Tyto nigrobrunnea* 32cm\n\
  野外记录：通常被认为是米纳哈萨面雕鸮的一个亚种；假设其行为相似。\n鸣声：仅有嘶声的记录。\n栖息地：雨带林和选择性采伐的低地森林。\n分布：苏拉群岛塔利亚亚布特有。\n\
  \n## 3 苏拉威西面雕鸮\n*Tyto rosenbergii* 43–46cm\n野外记录：白天罕见。通常在空地、耕地和森林边缘觅食。\n鸣声：一种沙哑、干燥、近乎嘶声的尖叫。\n\
  栖息地：林木稀疏的耕地、开阔地带的枯树、草原、森林边缘、种植园和郊区。\n分布：苏拉威西特有。\n\n## 4 小面雕鸮（马鲁鹿面雕鸮）\n*Tyto sororcula*\
  \ 29–31cm\n野外记录：记载较少。`T`. `s`. `cayelii` (4b) 出于布鲁岛；`T`. `s`. `almae` (4c) 位于塞拉姆岛。一些权威认为该物种是澳洲面雕鸮\
  \ `T. novaehollandiae` 的亚种。\n鸣声：未有记录。\n栖息地：雨林、原生林和成熟季风林。\n分布：栖息于南马鲁鹿群岛和东小巽达群岛。\n\
  \n## 5 谷鸮\n*Tyto alba* 33–35cm\n野外记录：通常为夜行性，但在白天可见其觅食；近贴地面觅食，飞行时呈波动状，在俯冲攻击前会有多次悬停。一些权威将该物种分为两种：东方谷鸮和西方谷鸮，但看起来更像是一个。\n\
  鸣声：尖锐、沙哑的 `shrrree`；还有各种咯咯声、打鼾声和嘶声。\n栖息地：耕地、开阔地区、邻近草原或沼地的残林、红树林和郊区。\n分布：栖息于苏门答腊、爪哇岛、婆罗洲（引入）、小巽达群岛和弗罗斯海岛屿。\n\
  \n## 6 东方草草鸮\n*Tyto longimbris* 32–38cm\n野外记录：晨昏性和夜行性。经常滑翔。\n鸣声：与谷鸮相似。\n栖息地：草原。\n\
  分布：栖息于婆罗洲、菲律宾和小巽达群岛。\n\n## 7 东方海嘴猫鸮\n*Phodilus badius* 29cm\n野外记录：夜行性。经常栖息在森林地面附近的幼树上；也在树冠下觅食，在垂直树干间穿梭时飞行很快。\n\
  鸣声：一系列带有向上调的诡异哨声，声音升高后逐渐消失。\n栖息地：主要是低地和丘陵森林，偶尔出现在山林。\n分布：栖息于苏门答腊、爪哇岛、巴厘岛，可能还有菲律宾。\n\
  \n## 8 短耳鸮\n*Asio flammeus* 37cm\n野外记录：通常在白天活跃。\n鸣声：通常安静，但可能会发出吠叫声。\n栖息地：有稀疏灌木的开阔地区、灌木丛丘陵和沼泽。\n\
  分布：婆罗洲和菲律宾的冬季客。\n\n![image](img/page097.jpg)\n\n# 42 亚洲各种\n## 1 巨型亚洲\n*Otus gurneyi*\
  \ 30cm\n野外记录：通常在林下层高处觅食。白天栖息在……中。\n鸣声：响亮的 `wokkk` 或 `waookk`，或粗哑的 `owwwk`。\n栖息地：从低地到山区的森林和森林边缘；也记录于草原中的小树丛中。\n\
  分布：菲律宾南部特有。\n\n## 2 林贾亚尼亚洲\n*Otus jolandae* 22cm\n野外记录：假设与其他亚洲各种相似，白天躲在遮护处休息；从傍晚开始整个夜都在鸣叫。\n\
  鸣声：单一、清脆的哨声。\n栖息地：较开阔地区的森林斑块。\n分布：西巽达群岛的林巴阡岛特有。\n\n## 3 白额亚洲\n*Otus sagittatus*\
  \ 25–28cm\n野外记录：夜行性。记载信息较少。\n鸣声：空洞的、哨声 `hooo`。\n栖息地：低地森林。\n分布：可能栖息于苏门答腊。\n\n## 4\
  \ 褐额亚洲\n*Otus rufescens* 20cm\n野外记录：在林下层低处觅食，其他时间较少。\n鸣声：逐渐消失的空洞 `hoooo`。\n栖息地：低地森林。\n\
  分布：栖息于苏门答腊、爪哇岛和婆罗洲。\n\n## 5 山地亚洲\n*Otus spilocephalus* 17–21cm\n野外记录：夜行性。在树冠下觅食，据报道位置较低。白天栖息在树洞中。`O`.\
  \ `s`. `luciae` (主图）位于婆罗洲；`O`. `s`. `vandewateri` (5b) 出于苏门答腊。\n鸣声：柔和的、传播远的 `plew\
  \ plew`。\n栖息地：湿润的山林。\n分布：栖息于苏门答腊和婆罗洲。\n\n## 6 西美鲁韦亚洲\n*Otus umbra* 18cm\n野外记录：研究较少，记载有限。\n\
  鸣声：两个连续的音节，后跟一个较高的、上扬的 `pook-pook-pupook`；雌性发出长鸣。\n栖息地：残林斑块、森林边缘和丁香种植园。\n分布：苏门答腊西部西美鲁韦岛特有。\n\
  \n## 7 爪哇亚洲\n*Otus angelinae* 20cm\n野外记录：行踪神秘；记载有限。\n鸣声：包括柔和的 `wook-wook`、嘶声 `tch-tschsch`\
  \ 和报警声 `poo-poo`。\n栖息地：山林。\n分布：西爪哇特有。\n\n## 8 曼塔塔尼亚洲\n*Otus mantananensis* 18cm\n\
  野外记录：在林缘和空地觅食。\n鸣声：类似鹅的鸣声，随后是三个粗鲁、低调的粗鲁音。\n栖息地：低地和山麓森林、林地和种植园。\n分布：栖息于婆罗洲西北部的曼塔塔尼岛和巴拉湾南方的岛屿。\n\
  \n## 9 桑基海亚洲\n*Otus collari* 19–20cm\n野外记录：记载较少。\n鸣声：高调、下滑的、笛般的哨声，`kleeeeer`。\n\
  栖息地：森林、混合种植园、次生林和有树木的农业区。\n分布：苏拉威西北部桑基海群岛特有。\n\n## 10 恩加诺亚洲\n*Otus enganensis* 20cm\n\
  野外记录：记载较少。\n鸣声：粗鲁的声，记录与马鲁鹿亚洲（图 43）相似。\n栖息地：记录较少，假设为树木地区和森林边缘。\n分布：苏门答腊西南部的恩加诺岛特有。\n\
  \n![image](img/page099.jpg)\n\n\n\n\n\n# 1 吕宋角头鸮\n`Otus longicornis` 18cm 野外笔记：可能相当亲人；通常栖息在林下。声音：响亮且传播距离远的\
  \ `whoo-hooo whoo-hooo`。栖息地：山麓和山地苔藓森林、混松林和雨林。分布：菲律宾北部吕宋岛特有。\n\n# 2 望民罗角头鸮\n`Otus\
  \ mindorensis` 17cm 野外笔记：在合适的栖息地相当常见。白天栖息在树洞或茂密的叶丛中。声音：柔和的 `po-wo` 或 `wo-wo`。栖息地：山地森林。分布：菲律宾北部望民罗岛特有。\n\
  \n# 3 民兰老爪角头鸮\n`Otus mirus` 19–20cm 野外笔记：记录信息较少，似乎很稀有。声音：传播距离远的口哨声 `paww piaww`。栖息地：中海拔山区和山地森林。分布：菲律宾南部特有。\n\
  \n# 4 琉球角头鸮（优雅角头鸮）\n`Otus elegans` 20cm 野外笔记：夜行性。沿森林边缘捕猎。声音：多样，据报道为重复的、沙哑的类似咳嗽的\
  \ `uhu`、`kuru` 或 `u-kuruk`，或柔和的 `poo-pup` 或 `pooo poo-pup`。栖息地：密常绿林。分布：留于菲律宾北部（巴丹岛、萨巴当岛和卡拉延岛）。\n\
  \n# 5 东方角头鸮\n`Otus sunia` 18cm 野外笔记：夜行性。在栖息点或飞行中捕猎，通常沿森林边缘。声音：类似蟾蜍的 `wuk-tuk-tah`、`wut-chu-chraaii`\
  \ 或类似声音。栖息地：阔叶常绿林、混落叶林、森林边缘、空地，有时在花园。分布：苏门答腊的候鸟或冬季访客。\n\n# 6 苏拉威锡角头鸮\n`Otus manadensis`\
  \ 21cm 野外笔记：通常单只或成对出现，通常躲在茂密的叶丛中。声音：清晰、哀伤且带有上扬调的哨声。栖息地：原生及高大的次生平原和丘陵森林、森林边缘、疏林耕地、灌木丛和残留林块。分布：苏拉威锡岛特有。\n\
  \n# 7 苏拉角头鸮\n`Otus sulaensis` 20cm 野外笔记：记录信息较少；被认为捕食昆虫和其他无脊椎动物以及小型脊椎动物。声音：一系列快速、共鸣的鸣声或长长的振翅声。栖息地：原生林和受干扰的次生林。分布：苏拉群岛特有。\n\
  \n# 8 西亚乌角头鸮\n`Otus siaoensis` 19cm 野外笔记：记录信息较少。仅通过 1866 年采集的单一物种为人知。声音：未记录。栖息地：森林。分布：苏拉威锡北部的西亚乌岛特有。\n\
  \n# 9 摩鹿加角头鸮\n`Otus magicus` 21cm 野外笔记：通常单只或成对栖息在高树上；以无脊椎动物和小型脊椎动物为食。`O`. `m`. `albiventris`\
  \ (9b) 出于小巽达群岛。声音：粗哑的类乌鸦鸣声。栖息地：原生林、沿海沼泽林和次生林。分布：留于摩鹿加群岛以及西部和中部巽达群岛。\n\n# 10 弗洛斯角头鸮\n\
  `Otus alfredi` 19–21cm 野外笔记：记录信息较少。仅通过极少数标本为人知。声音：未记录。栖息地：推出现在山地森林。分布：小巽达群岛的弗洛斯岛特有。\n\
  \n![image](img/page101.jpg)\n\n44 种角头鸮；小鸮\n\n# 1 拉贾爪角头鸮\n`Otus brookii` 23cm 野外笔记：记录信息较少。可能很稀有。主要以昆虫为食。声音：单调、爆发性的\
  \ `whaooo`。栖息地：山地雨林。分布：留于苏门答腊岛和婆罗洲。\n\n# 2 巽达角头鸮\n`Otus lempiji` 20cm 野外笔记：在栖息点捕猎，俯冲捕食昆虫，偶尔捕食小鸟。声音：柔和的上扬\
  \ `wooup`。栖息地：次生林、森林边缘、种植园、稀疏的开阔地区、公园和森林良好的花园。分布：留于苏门答腊、爪哇、巴厘和婆罗洲。\n\n# 3 门塔韦角头鸮\n\
  `Otus mentawi` 20cm 野外笔记：偶尔栖息在暴露的树枝上。声音：一系列 `po-po` 鸣声，随后是下降的单音 `po` 鸣声。栖息地：平原森林和次生林。分布：苏门答腊西部外岛屿特有。\n\
  \n# 4 吕望湾角头鸮\n`Otus fuliginosus` 20cm 野外笔记：留在密密的林下层，非常接近地面。声音：深沉、粗哑的低吼 `krarr-kruarr`、`wach\
  \ grarhrhrh` 或 `wach waaarwwwhhh`。栖息地：森林、次生林以及平原混合种植的树。分布：菲律宾吕望湾特有。\n\n# 5 菲律宾角头鸮\n\
  `Otus megalotis` 23–28cm 野外笔记：通常在森林林下层单只或成对出现。声音：粗哑的 `oiik oiik oiik`。栖息地：森林。分布：菲律宾特有。\n\
  \n# 6 埃弗特角头鸮\n`Otus everetti` 22–23cm 野外笔记：单只或成对出现；推测捕食……。声音：响亮的 `wkuach`。栖息地：湿润平地森林。分布：#\
  \ 7 尼格罗斯角头鸮\n`Otus nigrorum` 20cm 野外笔记：记录信息较少；推测与上述物种相似。声音：快速的 `quick`。栖息地：森林。分布：菲律宾特有。\n\
  \n# 8 华莱士角头鸮\n`Otus silvicola` 23–25cm 野外笔记：通常单只或成对出现；栖息在高处。声音：粗鲁的 `whumph` 和稳定的\
  \ `row`。栖息地：原生林和次生林。分布：巽达岛。\n\n# 9 领�\n`Glaucidium brodiei` 16–17cm 野外笔记：晨昏性和昼性。大胆的猎手，捕食体型鸟类。头部有眼睛状斑纹。声音：柔和的\
  \ `hoo-hoo`。栖息地：阔叶常绿林。分布：留于苏门答腊# 10 爪哇�\n`Glaucidium castanopter` 24cm 野外笔记：夜行，但有时白天活跃。从栖息点扑击猎物，包括老鼠和小鸟。声音：快速的、音调下降且音量增大。栖息地：原生林和次生林。分布：爪哇岛特有。\n\
  \n![image](img/page103.jpg)\n\n45 种鸮；雕鸮\n\n# 1 宽纹雕鸮\n`Bubo sumatranus` 40–46cm 野外笔记：夜行性和晨昏。在栖息点捕猎，俯冲捕食小型哺乳动物和昆虫。在地上时跳跃。声音：响亮的\
  \ `whooa-who whooa-who`，还有颤抖的 `gag`。栖息地：平地和丘陵森林。分布：留于苏门答腊、爪哇和婆罗洲。\n\n# 2 菲律宾雕\n\
  `Bubo philippensis` 50–51cm 野外笔记：记录信息较少。报道白天在树上栖息；推测捕食小型哺乳动物或鸟类。`B`. `p`. `mindanensis`\
  \ (2b) 出于菲律宾南部。声音：深沉共鸣的 `hoo-hoo-hoo`。栖息地：森林和森林边缘，靠近水边。分布：菲律宾特有。\n\n# 3 棕鱼�\n`Ketupa\
  \ ketupu` 38–44cm 野外笔记：从栖息点俯冲或通过行走进入浅水用爪子捕鱼。声音：响亮、单调的 `kootookookootook`、响亮的 `pof\
  \ pof pof`、有律感的 `to-whee to-whee`，以及各种嘶声、鸣声和尖叫。栖息地：原生林边的沿海森林和丘陵稻田。分布：留于苏门答腊、爪哇和婆罗洲。\n\
  \n# 4 斑木鸮\n`Strix seloputo` 45–47cm 野外笔记：在栖息点捕猎，主要捕食小型啮齿类、小鸟和昆虫。`S`. `s`. `wiepkeni`\
  \ (4b) 位于菲律宾西部。声音：深沉的 `who`，通常以滚动的 `huhuhuwhuwhu` 开始；还有共鸣、上扬的 `hoop-hoong` 和深沉的低吼。栖息地：平地森林、红树林和人类居住附近的树群。分布：留于苏门答腊、爪哇和菲律宾西部。\n\
  \n\n\n\n\n# 5 棕色林头鹰\n*Strix leptogrammica* 47–53cm\n野外记录：夜行性。胆小，白天休息在密密的枝叶丛中。*S*.\
  \ *l*. *niasensis* (5b) 分布于苏门答腊岛岸的尼亚岛。\n鸣声：低沉、空洞的 `tok tu-hoo tok-tu-hoo`；还有诡异的尖叫和咯咯。\n\
  栖息地：所有类型的森林，从海岸到山地。\n分布：栖息于苏门答腊、爪哇腊和婆罗洲。\n\n# 6 吠猫鹰\n*Ninox connivens* 40–45cm\n\
  野外记录：通常单只或成对出现。白天栖息在中层和林冠层的叶中。在开阔的栖木上捕猎和鸣叫。\n鸣声：雄性发出的一对类似狗的吠叫声，`wuff-wuff`；雌性发出调较高的\
  \ `wok-wok`。\n栖息地：林地、灌丛和森林边缘，通常靠近水流和沼泽。\n分布：栖息于北摩鹿加群岛。\n\n# 7 桑巴布鸮\n*Ninox rudolfi*\
  \ 35–40cm\n野外记录：单只或成对出现，有时成小群散布。偶尔在白天期间被观察到。\n鸣声：一系列单调的、类似咳嗽的鸣声，连续发出。\n栖息地：原生林和高大次林、森林边缘和残存森林斑块。\n\
  分布：特产于西小巽群岛的桑巴岛。\n\n![image](img/page105.jpg)\n\n# 46 角鹰\n\n## 1 托吉安角鹰（托吉安布鸮）\n\
  *Ninox burhani* 25cm\n野外记录：通常成对出现，但也有单只和三只一组的记录。夜行性；栖息在茂密的枝叶中。\n鸣声：粗哑、低沉的 `kok-ko-ro-ok`，通常会重复，偶尔由单声的咯声先导。\n\
  栖息地：受干扰和退化的低地森林。\n分布：特产于苏拉威锡岛外的托吉安群。\n\n# 2 南布鸮\n*Ninox boobook* 27cm\n野外记录：单只或成对出现。白天栖息在茂密的枝叶中。*N.*\
  \ *b.* *fusca*（主插图）分布于提汶尔岛；*N*. *b*. *ocellata* (2b) 发现于小巽群岛的萨武岛。\n鸣声：简单的 `bru-bruk`。\n\
  栖息地：原生林和高大次生低地森林、季风山林和季风林地。\n分布：栖息于东小巽群岛和南摩鹿加群岛的凯岛。\n\n# 3 棕角鹰\n*Ninox scutulata*\
  \ 32–33cm\n野外记录：晨昏性和夜行性。有记录像夜鹰一样捕猎飞行昆虫，有时成群。倾向于长时间内经常出没同一栖木。\n鸣声：萦绕的 `whu-up`、`pung-ok`、`oo-uk`\
  \ 或 `coo-oo`。\n栖息地：开阔森林、森林边缘、林地和林木作物。\n分布：栖息于苏门答腊、西爪哇、婆罗洲和菲律宾；并为华莱士群岛的冬客。\n\n# 4\
  \ 巧克力布鸮\n*Ninox randi* 27–33cm\n野外记录：曾被认为是棕角鹰的亚种；行为和习性预计相似。\n鸣声：一系列低沉的 `whoop` 鸣声。\n\
  栖息地：原生低地雨林、次生森林和红树林。\n分布：除巴拉湾外特产于菲律宾。\n\n# 5 吕宋角鹰（菲律宾角鹰）\n*Ninox philippensis* 20cm\n\
  野外记录：白天栖息在森林较暗的部分。捕食昆虫和啮齿类。\n鸣声：一系列 `cuk` 鸣声，间杂着较软的 `boo` 或 `boo-boo` 鸣声，从安静开始，加速并变大。\n\
  栖息地：原生和次生雨林，以及残存森林斑块。\n分布：特产于菲律宾北部和中部。\n\n# 6 苏尔甲角鹰\n*Ninox reyi* 19–20cm\n野外记录：曾被认为是吕宋角鹰的亚种；行为预计相似。\n\
  鸣声：短促的、空的木质敲击声，从低低的 `clucks` 开始，声音变大且变高，然后减慢并降调，随后再次变大且变高。\n栖息地：亚热带或热带湿润低地森林，也有山地森林。\n\
  分布：特产于菲律宾的苏禄群岛。\n\n# 7 民兰老角鹰\n*Ninox spilocephala* 18cm\n野外记录：近期从吕宋角鹰中分出来；行为预计相似。主要食物可能是昆虫。\n\
  鸣声：长串低沉、柔和、类似鸽子的双音调。\n栖息地：原生低地雨林和次生森林。\n分布：特产于菲律宾南部。\n\n# 8 民多罗角鹰\n*Ninox mindorensis*\
  \ 20cm\n野外记录：近期从吕宋角鹰中分出来；推测为夜行，栖息在茂密的掩体中。\n鸣声：一系列高音哨声，通常以高频的啁开始。\n栖息地：原生和次生森林、残存森林斑块和开阔林地。\n\
  分布：特产于菲律宾部的民多罗岛。\n\n# 9 罗布安角鹰\n*Ninox spilonotus* 26cm\n野外记录：曾被认为是吕宋角鹰的亚种；行为预计相似。\n\
  鸣声：一系列短促、沙哑的哨声，音调下降，从缓慢开始然后变为三音调。\n栖息地：原生林和高大次林。\n分布：特产于菲律宾中部的西布延岛和塔布拉斯岛。\n\n# 10\
  \ 宿务角鹰\n*Ninox rumseyi* 25cm\n野外记录：近期从吕宋角鹰中分出来；习性预计相似。捕食老鼠。\n鸣声：粗哑、哀伤的鸣声和沙哑的尖啸。\n\
  栖息地：森林。\n分布：特产于菲律宾的宿务岛。\n\n![image](img/page107.jpg)\n\n# 47 角鹰\n\n## 1 坎米圭因角鹰\n\
  *Ninox leventisi* 25cm\n野外记录：曾被认为是吕宋角鹰的亚种（图 46）；行为预计相似。\n鸣声：与短促、低沉的短句合唱，伴有快速的吠声。\n\
  栖息地：森林。\n分布：特产于菲律宾的坎米圭因岛。\n\n## 2 赭腹角鹰\n*Ninox ochracea* 29cm\n野外记录：通常单只或成对出现；记录于水平分枝上。\n\
  鸣声：一系列响亮的 `kau` 鸣声，结尾减慢，随后发展为 `wooo wooo wu wu`。\n栖息地：原生和高大次生低地及山地森林；记录于河岸森林。\n\
  分布：特产于苏拉威锡。\n\n## 3 朱布鸮\n*Ninox ios* 22cm\n野外记录：夜行性。据报道利用开阔的分枝进行短距离俯冲捕虫。\n鸣声：硬性的\
  \ `w-ruck`。\n栖息地：中海拔森林。\n分布：特产于苏拉威锡。\n\n## 4 汉图角鹰（塞拉姆布鸮）\n*Ninox squamipila* 27–39cm\n\
  野外记录：栖息在中层和下冠层，通常在开阔的树枝或树头上。白天栖息在密密的枝叶中。*N.* *s.* *hantu* (4b) 分布于南摩鹿加的布鲁岛。\n鸣声：传播很远的、柔和的\
  \ `wooo wooo wu wu`。\n栖息地：原生和高大次生森林，低地和山的采伐林及边缘。\n分布：特产于南摩鹿加的塞拉姆岛和布鲁岛。\n\n## 5 哈马黑拉布鸮\n\
  *Ninox hypogramma* 27–39cm\n野外记录：曾被认为是汉图角鹰的一个亚种；行为预计相似。\n鸣声：粗哑的双音短句，音调均匀且传播远。\n\
  栖息地：热带低地雨林和高大次生森林。\n分布：特产于北摩鹿加的哈马黑拉和巴干岛。\n\n## 6 塔尼巴布鸮\n*Ninox forbesi* 30cm\n野外记录：曾认为是汉图角鹰的一个亚种；习性预计相似。\n\
  鸣声：`ku-kuk ku-kuk ku-kuk`。\n栖息地：原生和高大次生低地及山地森林。\n分布：特产于东小巽群岛的塔尼巴群岛。\n\n# 7 圣诞岛角鹰（圣诞岛布鸮）\n\
  *Ninox natalis*\n\n\n\n\n\n26–29cm 野外记录：白天躲在树木冠层中层密密的灌木丛或浓茂的叶丛中。捕食昆虫、小鸟和老鼠。鸣叫：简单的\
  \ `bru-bruk` 声，重复多次；还有低沉的吠叫声 `ow-ow-ow`。栖息地：热带雨林、季风林和灌木丛。分布范围：圣诞岛特有。\n\n### 8 斑点雕头鹰（斑点猫头鹰）\n\
  *Ninox punctulata* 27cm 野外记录：通常单只或成对出现。据报道，会在森林的小溪旁觅食。鸣叫：长的一系列 `toi toi toi toi`\
  \ 或 `wher wher wher wher` 鸣声，音调升高并加速，最后以较低音调的 `toi` 结束；据报道还有 `toi-toi-toi-seeeet`。栖息地：原生低地森林和山地森林、森林边缘和高次生林；偶尔出现在人类居住地附近的耕地。分布范围：苏拉威西岛特有。\n\
  \n### 9 小巽木雕头鹰\n*Ninox sumbaensis* 23cm 野外记录：记录信息较少；推测与其他雕头鹰相似。鸣叫：低沉的、长笛般的 `duu`\
  \ 或 `puu`。栖息地：原生森林残迹，以及受干扰的原始森林和次生林。分布范围：西小巽达群岛的巽木岛特有。\n\n![image](img/page109.jpg)\n\
  \n## 48 凤嘴鸟\n\n### 1 大凤嘴\n*Batrachostomus auritus* 40–43cm 野外记录：夜行性。白天静止留在树冠中。从栖处出捕昆虫。鸣叫：颤抖的\
  \ `prrrrooh prrrrooh prrrrooh`……栖息地：低地森林。分布范围：栖于苏门答腊和婆罗洲。\n\n### 2 杜利凤嘴\n*Batrachostomus\
  \ harterti* 34–37cm 野外记录：记录信息较少；推测为夜行性，行为与前一种物种相似。鸣叫：重复的、响亮的号角般的 `whooooooaaah`。栖息地：亚山森林。分布范围：婆罗洲特有。\n\
  \n### 3 菲律宾凤嘴\n*Batrachostomus septimus* 23cm 野外记录：夜行性；听见多于看见。典型的凤嘴鸟习性：直立栖息，像一根断枝，通过在空中出击捕捕飞行昆虫，或从叶子上啄食昆虫或其他无脊椎动物。鸣叫：粗哑的咆哮声\
  \ `kaaoo`、`kaaww`、`paaww` 或 `pa-paaww`。栖息地：森林和森林边缘。分布范围：菲律宾特有。\n\n### 4 古德凤嘴\n*Batrachostomus\
  \ stellatus* 21–25cm 野外记录：夜行性。白天期间静止不动；其他记录较少。鸣叫：雄性发出奇异而微弱的 `woah-weeo`，有时只是 `weeo`；雌性发出咆哮般的、快速且高频的吠叫声。栖息地：原生低地和山地森林。分布范围：栖于苏门答腊和婆罗洲。\n\
  \n### 5 短尾凤嘴\n*Batrachostomus poliolophus* 20–22cm 野外记录：记录较少；推测行为与菲律宾凤嘴相似。鸣叫：未记录。栖息地：亚山原生森林和混合松林。分布范围：苏门答腊特有。\n\
  \n### 6 婆罗洲凤嘴\n*Batrachostomus mixtus* 20–22cm 野外记录：曾被认为是短尾凤嘴的一个亚种；推测行为与菲律宾凤嘴相似。鸣叫：纯净的、哨声\
  \ `pwau` 或 `weeow`，每 2–3 秒重复一次。栖息地：亚山和山地森林。分布范围：婆罗洲特有。\n\n### 7 布莱特凤嘴\n*Batrachostomus\
  \ affinis* 19–24cm 野外记录：白天直立坐着，鸟喙指向天空，通常靠近地面。觅食行为可能与其他较小的凤嘴鸟非常相似。鸣叫：雄性发出哀的哨声，雌性发出疯狂的笑声。栖息地：密集的低地雨林。分布范围：栖于苏门答腊和婆罗洲。\n\
  \n![image](img/page111.jpg)\n\n## 49 凤嘴鸟；夜脚莺\n\n### 1 爪哇凤嘴\n*Batrachostomus javensis*\
  \ 19–25cm 野外记录：典型的凤嘴鸟。白天休息时直立坐着，喙指向天空，通常离地面不远。推测通过出击捕获无脊椎猎物。鸣叫：沙哑的 `gwaa` 声，音调下降；还有各种吠叫、颤鸣和哨声。栖息地：湿润的低地和山地森林。分布范围：爪哇特有。\n\
  \n### 2 菲律宾凤嘴\n*Batrachostomus chaseni* 21–22cm 野外记录：夜行性。记录较少；推测行为与其他较小的凤嘴鸟非常相似。鸣叫：哀伤的、哨声般的\
  \ `pheuuuuuuuuuuu`，还有粗哑、哀伤的咆哮声 `kawwrreerr`。栖息地：森林和次生林，包括密集的藤蔓和竹林。分布范围：西菲律宾特有。\n\
  \n### 3 巽达答凤嘴\n*Batrachostomus cornutus* 23–28cm 野外记录：羽色变化很大。报道白天休息在树枝上。栖息地：次生林。分布范围：爪哇特有。\n\
  \n### 4 马鲁古猫猫脚莺\n*Aegotheles crinrons* 29cm 野外记录：单只、成对或成小群出现。飞行时显示外飞羽上的白色斑块。鸣叫：微弱的升调声，受惊时发出各种尖叫、咯咯声和猫般的嚎叫。栖息地：原生森林和次生林。分布范围：马鲁古群岛特有。\n\
  \n### 5 鬼夜脚莺（海因里希夜脚莺）\n*Eurostopodus diabolicus* 26cm 野外记录：在空中觅食。鸣叫：气动的颤鸣 `plip-plop`。栖息地：原生山林。分布范围：苏拉威西特有。\n\
  \n### 6 斑点夜脚莺\n*Eurostopodus argus* 30cm 野外记录：白天在地面栖息。在开阔地带飞行。鸣叫：一系列快速上升的 `whaw`\
  \ 声，随后是气动的咕噜声。栖息地：稀树草原。分布范围：东小巽达群岛的冬客。\n\n### 7 马来大耳夜脚莺\n*Lyncornis temminckii*\
  \ 25–28cm 野外记录：在开阔地带飞行觅食。鸣叫：重复的 `tut-wee-ow`。栖息地：低地原生和次生林、次生植被。苏门答腊和婆罗洲常见。\n\n###\
  \ 8 大耳夜脚莺\n*Lyncornis macrotis* 40cm 野外记录：在黄昏时分森林上方觅食。鸣叫：哀鸣的 `pee-wheoo wheeoo wheeoo`，飞行和栖息时均会发出。栖息地：森林和森林边缘。分布范围：栖于苏门答腊西北部的西梅留岛、菲律宾、苏拉威西和苏拉岛。\n\
  \n![image](img/page13.jpg)\n\n## 50 夜脚莺\n\n### 1 灰夜脚莺\n*Caprimulgus jotaka* 28–32cm\
  \ 野外记录：晨昏性且夜行性。飞行轻盈敏捷。鸣叫：快速的 `tuk tuk tuk tuk`……栖息地：低地的开阔地区。分布范围：苏门答腊、爪哇、巴厘岛、婆罗洲、菲律宾和北马鲁古的冬客。\n\
  \n### 2 长尾夜脚莺\n*Caprimulgus macrurus* 33cm 野外记录：晨昏性和夜行性。通过从栖处或地面出击捕捕昆虫。鸣叫：共鸣的 `tok\
  \ tok tok`……栖息地：开阔的森林边缘、森林空地、次生植被和耕地。分布范围：栖于苏门答腊、爪哇、巴厘岛、婆罗洲、菲律宾、小巽达群岛和马鲁古群岛。\n\n\
  \n\n\n\n### 3 梅斯夜鹰\n*Caprimulgus meesi* 25–29cm\n野外记录：晨昏性和夜行性。从暴露的树枝或可能从地面进行觅食飞行。在暴露的树枝和地面上鸣叫。曾被认为与大尾夜鹰为同种。飞行时，雄性外侧飞羽和尾部角有白色斑；雌性斑块为肉褐色。鸣声：高调的\
  \ `piok-piok` 或 `weelp-weelp`。栖息地：带有稀疏小树的茂密灌丛和森林边缘。分布：留于巽松群岛的福莱。\n\n### 4 菲律宾夜鹰\n\
  *Caprimulgus manillensis* 23–25cm\n野外记录：在黄昏和夜间觅食，从地面或暴露的栖木起飞捕捕飞行昆虫。飞行时，外侧飞羽和尾部角有白色斑。鸣声：粗哑的、砰击般的\
  \ `chuck chur`，重复出现，有时持续几分钟。栖息地：原生林和次生林、松林、次生林、灌丛和竹林。分布：留于菲律宾，除巴望外。\n\n### 5 苏拉威西夜鹰\n\
  *Caprimulgus celebensis* 26cm\n野外记录：晨昏性和夜行性。在小片草地上方捕食昆虫，单只或成对。据报道会在沿海灌丛边缘的露松和其他树上唱歌。飞行时，外侧飞羽和尾部角有白色斑。鸣声：一系列快速、加速的\
  \ `chuck` 音符，最后一个音符较软并逐渐消失。栖息地：干燥的沿海灌丛和红树林边缘；在苏拉，也出现在低地森林的伐木场旁。分布：苏门腊岛和苏拉群岛特。\n\n\
  ### 6 稀瓦纳夜鹰\n*Caprimulgus affinis* 23cm\n野外记录：晨昏性和夜行性。飞行时，雄性飞羽上有白色斑，尾部两侧为白色。鸣声：重复的\
  \ `chweep`。栖息地：干燥的开阔沿海林地、开阔林、耕地、旱河床和人类居住区附近。分布：留于苏门腊、爪哇、婆罗洲、菲律宾、苏拉威西和小巽松群岛。\n\n\
  ### 7 拿破仑夜鹰\n*Caprimulgus concretus* 20cm\n野外记录：晨昏性和夜行性。从栖木上起飞捕捕飞行中的昆虫；经常经常沿河流觅食。鸣声：低沉、哀伤的双重音节\
  \ `waouuuu`。栖息地：原生低地森林，通常靠近河流。分布：留于苏门腊和婆罗洲。\n\n### 8 萨尔瓦多里夜鹰\n*Caprimulgus pulchellus*\
  \ 24cm\n野外记录：晨昏性和夜行性。在森林空地和悬崖附近觅食；飞行缓慢，伴有扇动的翅膀和频繁的滑翔。也会从栖木上进行短距离冲刺捕虫。飞行时，雄性外侧飞羽和尾部角有白色斑；雌性斑块为肉褐色。鸣声：五个不规则模式的\
  \ `tock` 音。栖息地：山地和亚山地森林，通常在悬崖或崖壁上；偶尔出现在小沼泽地区。分布：留于苏门腊和爪哇。\n\n![image](img/page115.jpg)\n\
  \n## 51 鸽子；斑鸠类\n\n### 1 珠颈鸽（野家鸽）\n*Columba livia* 31–34cm\n野外记录：许多城镇和村庄的常见“害虫”。羽色变化很大。鸣声：哀鸣般的\
  \ `gootr-goo gootr-goo`。栖息地：城镇和城市。分布：留于婆罗洲和华拉西地区。\n\n### 2 银灰鸽\n*Columba argentina*\
  \ 34–38cm\n野外记录：稀有。经常与斑腹澳洲蜜鸽（图 62）伴在一起；注意银灰鸽尾下羽的黑色末端在所有羽毛上是平的，而非常相似的斑腹澳洲蜜鸽黑色末端一直延伸中心羽毛。鸣声：未记录。栖息地：红树林、林地和椰子林。分布：留于苏门腊外的岛屿和婆罗洲西南部。\n\
  \n### 3 金属光鸽\n*Columba vitiensis* 37–41cm\n野外记录：在树冠和地面取食掉落的果实，通常成小群活动。`C. v. halmaheira`（主图）发现于摩鹿加群岛、班盖和苏拉群岛。`C.\
  \ v. metallica` (3b) 于小巽松群岛；`C. v. griseogularis` (3c) 于菲律宾和东婆罗洲外的岛屿。鸣声：深沉的 `wuuuu\
  \ woooo`。栖息地：从低地到山的各种森林。分布：留于菲律宾、班盖和苏拉群岛、摩鹿加群岛、小巽松群岛和东婆罗洲外的岛屿。\n\n### 4 红领鸠（红领斑鸠）\n\
  *Streptopelia tranquebarica* 31–33cm\n野外记录：主要在地面觅食。飞行时，尾部显示白色两侧和灰白色角。鸣声：深沉的 `cru-u-u-u-u`\
  \ 或 `groo-gurr-goo`。栖息地：开阔地区、林丛、次生林、灌丛和园林。分布：留于菲律宾和苏拉威西。\n\n### 5 巽他领鸠（岛领鸠）\n*Streptopelia\
  \ bitorquata* 31cm\n野外记录：通常单只或成对出现；在地面觅食，在树上或电线上休息。曾被认为与菲律宾领鸠为同种。鸣声：重复的、喉音沉般的咕噜声。栖息地：红树林、开阔林地。分布：留于爪哇、巴厘和小巽松群岛。\n\
  \n### 6 菲律宾领鸠\n*Streptopelia dusum* 30–33cm\n野外记录：通常成对出现。某些权威认为是前者的亚种。鸣声：忧伤的 `tuk-mm`\
  \ 或沙哑的 `cook-mm`。栖息地：森林和灌丛。分布：留于菲律宾；婆罗洲的客。\n\n### 7 斑颈鸠（项环鸠）\n*Spilopelia chinensis*\
  \ 30cm\n野外记录：主要在地面觅食；在树上栖息。飞行时，尾部角为白色。鸣声：优律的 `coo-roo-roo`。栖息地：耕区、开阔森林。分布：遍布当地。\n\
  \n### 8 白耳鸠\n*Phapitreron leucotis* 23cm\n野外记录：单只或成对出现；主要在树上觅食但也也会地面。通过鸣声定位。`P.\
  \ nigrorum` (8b) 见于中部菲律宾。鸣声：加速并逐渐下降的 `hoot-hoot`。栖息地：茂密林地、农田边缘。分布：菲律宾特有。\n\n###\
  \ 9 紫晶褐鸠\n*Phapitreron amethystinus* 26–27cm\n野外记录：成对单出现，在中林层或树冠觅食。`P. maculipectus`\
  \ (9b) 见于尼格拉斯岛。鸣声：柔和、深沉、空灵。栖息地：从低地到山的原生林和次生林。分布：菲律宾特有。\n\n### 10 塔塔威褐鸠\n*Phapitreron\
  \ cinereiceps* 26–27cm\n野外记录：在中林层或树冠中活动，单只或成对。鸣声：深沉、共鸣的 `toot-toot-toot-toot`，随后加速并减弱。栖息地：低地森林。分布：菲律宾特有，位于苏禄群岛的塔塔威岛。\n\
  \n### 11 民兰奥褐鸠\n*Phapitreron brunneiceps* 26–27cm\n野外记录：在中林层或树冠中活动。鸣声：短促、快速。栖息地：从中海拔到山区的森林。分布：南部菲律宾特有。\n\
  \n![image](img/page117.jpg)\n\n## 52 脑鸠类\n\n### 1 纹鸠\n*Macropygia unchall* 37–41cm\n\
  野外记录：通常成对或成小群出现。灵巧地在树枝间攀行觅食小果；在地面时尾部略微抬起。鸣声：浑厚。栖息地：山地森林，偶尔出现在园林和椰子园。分布：留于苏门腊、爪哇、巴厘和西部小巽松群岛。\n\
  \n\n\n\n\n## 2 安姆博纳斑鸠（瘦嘴斑鸠）\n*Macropygia amboinensis* 35–37cm 野外记录：通常成对或成小群出现。取食小型果实、种子和坚果，觅食范围从灌木丛直到树冠层；偶尔在地上觅食或取食砂石。鸣声：`whoop-whoop`。栖息地：雨林、雨林再生林、林地和灌木丛。分布：留于南苏马卢克群岛。\n\
  \n## 3 苏丹斑鸠\n*Macropygia doreya* 33–37cm 野外记录：单只、成对或成群出现。通常栖息在裸露的树枝和枯树上。曾被视为前一种物种的亚种。`M`.\
  \ `d`. `albicapilla` (3b) 分于苏拉里腊及周边岛屿。鸣声：未记录命名种；`M`. `d`. `albicapilla` 发出升调的 `kuoow`\
  \ 和一系列上扬的音符，`uwoop uwoop uwoop uwoop`…。栖息地：原生林和高次生林、森林边缘、沼泽林和林木稀疏的耕地；偶尔出现在林木稀疏的灌木丛。分布：留于苏拉威腊和北苏马卢克。\n\
  \n## 4 红斑鸠\n*Macropygia emiliana* 30–37cm 野外记录：在中层到树冠层觅食，通常单只或成对。鸣声：一系列下滑的、哀的 `whu`\
  \ 音。栖息地：原生低地森林和山地森林、高次生林和开阔森林地区。分布：留于爪哇岛、巴厘岛和西小松群岛。\n\n## 5 恩加诺斑鸠\n*Macropygia cinnamomea*\
  \ 30–32cm 野外记录：曾被视为红斑鸠的亚种；习性推测相似。鸣声：响亮的 `poh wa wao`。栖息地：原生低地林和次生林以及开阔森林地区。分布：特产于苏马答腊岛西南外的恩加诺岛。\n\
  \n## 6 巴鲁斯斑鸠\n*Macropygia modiglianii* 30–37cm 野外记录：曾被视为红斑鸠的亚种；习性推测相似。鸣声：未报道。栖息地：原生林和高次生林以及开阔森林地区。分布：留于西苏马答腊岛以外的岛屿（除恩加诺岛外）。\n\
  \n## 7 帝墨汶斑鸠（颈纹斑鸠）\n*Macropygia magna* 44cm 野外记录：除非鸣叫，否则通常不显眼。通常单只、成对或成小群出现；在中层和下层树冠层觅食。鸣声：一组三个间距较远的音符：一个长长的升调音符，随后是两个较短的音符。栖息地：原生和高次次生的季风林、森林边缘和次生灌木丛。分布：特产于东小松群岛。\n\
  \n![image](img/page119.jpg)\n\n## 53 斑鸠类\n\n### 1 塔尼巴斑鸠\n*Macropygia timorlaoensis*\
  \ 38–43cm 野外记录：单只、成对或成小群出现，在中层和下层树冠层觅食。曾被视为帝墨汶斑鸠的亚种（图 52）。鸣声：略微沙哑、柔和的 `koowuck-whuuuu`，重复出现，有时单调。栖息地：季风林、再生林和森林边缘。分布：特产于东小松群岛的塔尼巴群岛。\n\
  \n### 2 弗罗里斯海斑鸠\n*Macropygia macassariensis* 38–43cm 野外记录：曾被视为帝墨汶斑鸠的亚种（图 52）；习性推测与前一种物种相似。鸣声：未报道。栖息地：季风林、再生林和森林边缘。分布：留于苏拉威腊西部、苏拉威腊以南岛屿和东小松群岛。\n\
  \n### 3 菲律宾斑鸠\n*Macropygia tenuirostris* 36–41cm 野外记录：通常成对或成小群出现。在树上寻找果实、种子和坚果时是动作敏捷者。鸣声：独特的\
  \ `boo boo boo-wow`，通常持续几分钟。栖息地：森林、再生林和森林空地。分布：留于菲律宾和婆罗洲岛。\n\n### 4 小斑鸠\n*Macropygia\
  \ ruficeps* 30cm 野外记录：通常成对或成小群出现。在地上和树上觅食，通常在中层或下层树冠层。`M`. `r`. `nana` (4b) 见于婆罗洲。鸣声：柔和、单调的\
  \ `wup-wup-wup-wup-wup`…，还有快速重复的 `croo-wuck croo-wuck croo-wuck`。栖息地：亚山森林。分布：留于苏马答腊、爪哇岛、巴厘岛、小松群岛和婆罗洲。\n\
  \n### 5 大斑鸠\n*Reinwardtoena reinwardti* 48–53cm 野外记录：通常单只发现，但可见成对或成小群。在树上觅食，有时在地上。鸣声：响亮、清晰的\
  \ `wh wuk-wu wuk-wu`。栖息地：原生林和次生林。\n\n### 6 白面斑鸠\n*Turacoena manadensis* 36cm 野外记录：通常成对或成小群出现。在中层觅食。鸣声：喉音般的\
  \ `tik-koo`。栖息地：山谷林。分布：留于苏拉威腊北部。\n\n### 7 苏拉西斑鸠\n*Turacoena sula* 36cm 野外记录：曾被视为白面斑鸠的亚种；习性推测相似。鸣声：未记录。栖息地：山谷林。分布：特产于苏拉西群岛。\n\
  \n### 8 黑斑鸠\n*Turacoena modesta* 38–39cm 野外记录：单只、成对或成小群出现。在地上觅食。鸣声：一系列升调的 `ho-wuk`\
  \ 音，由缓慢开始并加速。栖息地：原生林和高季风林。分布：特产于邦盖岛。\n\n![image](img/page121.jpg)\n\n## 54 鸽类\n\n\
  ### 1 太平洋绿鸽\n*Chalcophaps longirostris timorens* 23–28cm 野外记录：单只、成对或成小群出现。在地上觅食，栖于树上。鸣声：低沉哀鸣般的\
  \ `coo coo`，从安静开始逐渐升高；还会发出鼻音 `hoo-hoo`。栖息地：森林、森林边缘。分布：留于帝墨汶北部。\n\n### 2 绿鸽（普通绿鸽）\n\
  *Chalcophaps indica* 23–27cm 野外记录：单只、成对或成小群出现。在地上觅食、森林小径。鸣声：柔和、拉长的 `tuk-hoop`、`hoo-hoo`。栖息地：阔叶林、半常林和混合落叶林。分布：留于该地区，小松群岛外。\n\
  \n### 3 史蒂芬斑绿鸽\n*Chalcophaps stephani* 24–25cm 野外记录：在地上取食落果和种子；单只、成对、在丰富的觅食点或成小群出现。鸣声：柔和的\
  \ `tuu` 随后是一系列短音符，`du-du-duu-duu-duu-duu`…。栖息地：原生低地林和山地森林。分布：留于苏拉威腊、苏拉群岛。\n\n###\
  \ 4 斑纹鸽\n*Geopelia striata* 21–22cm 野外记录：主要在地上觅食，通常成对或成小群。鸣声：高音、柔和的颤音，随后是一系列快速的\
  \ `coo` 音。栖息地：有灌木的开阔地区、耕地、公园和花园。分布：留于苏马答腊、爪哇岛、巴厘岛、婆罗洲和南部。\n\n### 5 环纹鸽\n*Geopelia\
  \ maugeus* 21–24cm 野外记录：单只、成对或成小群出现。在地上觅食。鸣声：包括下滑的、咕噜般的 `prrrrr`、假声和单调的 `ooo-loo`。栖息地：林木稀疏的开阔地区、开阔的灌木丛季风林、红树林边缘、带有稀疏树木的草地。分布：特产于东南苏马卢克和小松群岛。\n\
  \n\n\n\n\n## 6 吕宋血心鸽\n`Gallicolumba luzonica` 25–26cm 野外记录：在森林地面以及森林小径和路旁觅食。鸣声：柔和的`aa-oooot`，在结尾处升高。栖息地：森林和次生林，从低地到中海拔山区。分布：菲律宾北部特有。\n\
  \n## 7 民德罗血心鸽\n`Gallicolumba platenae` 25–26cm 野外记录：在地上觅食。报道较少。鸣声：未记录，怀疑与内格罗斯血心鸽相似。栖息地：地面干燥、灌木丛密的低地森林。分布：菲律宾民德罗岛特有。\n\
  \n## 8 民兰望答腊血心鸽\n`Gallicolumba crinigera` 26–27cm 野外记录：在森林地面觅食。`G`. `p`. `laytensis`\
  \ (8b) 出于菲律宾中部。鸣声：柔和的`co-co-oooot`，还有一种`a-ooooo`。栖息地：原生林和次生林。分布：菲律宾南部特有。\n\n## 9\
  \ 内格罗斯血心鸽\n`Gallicolumba keayi` 25–26cm 野外记录：记录较少，推测与该属其他物种相似。鸣声：20–25 声像咕泡一样的音节。栖息地：原生林和次生林。分布：菲律宾中西部特有。\n\
  \n## 10 苏苏禄血心鸽\n`Gallicolumba menagei` 28cm 野外记录：在森林地面觅食。鸣声：未记录。栖息地：原生林和次生林。分布：苏苏禄群岛的塔威塔威岛特有。\n\
  \n## 11 苏拉威锡地鸽\n`Gallicolumba tristigmala` 32–33cm 野外记录：在地上觅食，单独或成对出现。胆子较小，受扰时倾向于奔跑。`G`.\
  \ `t`. `auripectus` (11b) 出于苏拉威西西部和南部。鸣声：类似于戴嘴鸟（图 20），但更柔和。栖息地：原生低地森林、丘陵和山区森林。分布：苏拉威锡特有。\n\
  \n## 12 韦塔地鸽\n`Alopecoenas hoedtii` 25cm 野外记录：显然是独居的，几乎没有其他报道。鸣声：未记录。栖息地：低地和丘陵季风森林及林地。分布：小巽达群岛东部特有。\n\
  \n![image](img/page123.jpg)\n\n55 绿鸽\n\n## 1 肉桂头绿鸽\n`Treron fulvicollis` 25–27cm\
  \ 野外记录：据报道主要在小型果实树上觅食。`T`. `f`. `baramensis` (1b) 出于婆罗洲。鸣声：一种多变的哨声，由约 14 声的`coo`音节组成。栖息地：海岸森林、红树林、沼泽森林和开阔灌木丛。分布：栖于苏门答腊和婆罗洲。\n\
  \n## 2 小绿鸽\n`Treron olax` 21–27cm 野外记录：树栖性，从中层到树冠层觅食，通常成多达八只鸟成群。鸣声：高音的`wiiiiii-iiu-iiu-iiu-iiu-iiui-iiuwu`，短间隔重复。栖息地：海岸、原生林、次生林和亚山地森林。分布：栖于苏门答腊、爪哇答和婆罗洲。\n\
  \n## 3 粉颈绿鸽\n`Treron vernans` 26–32cm 野外记录：从中层到树冠层觅食，通常成小群活动，在食物丰富的地点会有较大的群落。鸣声：觅食群会发出沙哑、刺耳的`krrak\
  \ krrak`……栖息地：森林和森林边缘、种植园、竹林和红树林。分布：栖于苏门答腊、爪哇答、巴厘、婆罗洲、菲律宾、苏拉威锡、小巽达群岛西部和北摩卢喀群岛。\n\
  \n## 4 橙胸绿鸽\n`Treron bicinctus` 29cm 野外记录：成小群觅食果实和浆果，在果树丰富的地点会有较大的群。鸣声：调制过的、柔和的哨声，随后是咕咕声，还有一种咯咯声和咯咯的叫声。栖息地：小型果树和灌木。分布：栖于爪哇答和巴厘岛。\n\
  \n## 5 布鲁岛绿鸽\n`Treron aromaticus` 28cm 野外记录：单独、成对或成小群出现。曾被认为是斯里兰卡绿鸽`T. pompadora`的一个亚种。鸣声：未描述。栖息地：森林、森林边缘和高大的次生林。分布：南摩卢喀群岛布鲁岛特有。\n\
  \n## 6 菲律宾绿鸽\n`Treron axillaris` 28cm 野外记录：单独、成对或成小群出现。最初被认为是斯里兰卡绿鸽`T. pompadora`的一个亚种。鸣声：哀伤的`coo`和一系列柔和的哨声。栖息地：原生林和次生常绿林及森林斑块。分布：菲律宾特有。\n\
  \n## 7 厚喙绿鸽\n`Treron curvirostra` 24–31cm 野外记录：树栖性。觅食果实和浆果，通常成小群，在食物丰富的地点会有较大的群。鸣声：低沉的喉音哨声；还有一种沙哑的`goo-goo`。栖息地：各种森林，包括阔叶常绿林、半常绿林和落叶林；\
  \ \n\n## 8 灰颊绿鸽\n`Treron griseuda` 25cm 野外记录：通常成小群，在食物丰富的地点会有较大的群。通常保持安静。鸣声：一系列美妙的哨声，还有一种奇怪的咕噜声`whereu`。栖息地：低地森林斑块。分布：栖于苏门答腊和婆罗洲。\n\
  \n![image](img/page125.jpg)\n\n56 绿鸽\n\n## 1 弗洛雷斯绿鸽\n`Treron floris` 29cm 野外记录：胆小且通常不明显。通常成小群出现在果实树上。鸣声：通常保持静默。栖息地：原生林和次生林斑块、海岸森林、疏林地。分布：小巽达群岛西部特有。\n\
  \n## 2 桑巴绿鸽\n`Treron teysmannii` 29cm 野外记录：单独、成对或成小群发现。通常安静。主要在果实树上觅食。鸣声：包括`awop-awop-a-rup`、柔和的`korrr`和`whereu`。栖息地：原生和高大的次生林；也会访问公园草原。分布：小巽达群岛桑巴岛特有。\n\
  \n## 3 帝汶绿鸽\n`Treron psittaceus` 32cm 野外记录：通常成小群，或成对出现；胆小且不明显。在果实树上觅食。鸣声：一系列下降的起伏音节，还有复杂的中等高音咕泡声和咕噜声。栖息地：原生和高大的低地季风森林。分布。\n\
  \n## 4 大绿鸽\n`Treron capellei` 35–36cm 野外记录：成多达十二只鸟的小群在果实树上觅食。鸣声：一种多变的、深沉的、鼻音的`oo-oo-aah\
  \ oo-oo-aah aa-aa-aah`和`oooOOah oo-aah`……栖息地：原生低地森林和森林斑块。分布：栖于苏门答腊、爪哇答和婆罗洲。\n\n\
  ## 5 苏门答腊绿鸽\n`Treron oxyurus` 34cm 野外记录：通常成游牧群出现，但从不远离森林。鸣声：响亮的`oo-oowao-oowau`或类似声音。栖息地：茂密的丘陵和山区森林。分布：苏门答腊和爪哇西部特有。\n\
  \n## 6 楔尾绿鸽（歌唱绿鸽）\n`Treron sphenurus` 30–33cm 野外记录：果实树上的灵巧觅食者；单独、成对或成小群出现。鸣声：一系列音乐性的哨声或笛声音节，还有一种奇怪的咕噜声。栖息地：橡树月桂林和山地荒原森林。分布：栖于苏门答腊和爪哇答。\n\
  \n## 7 绿鸽\n`Treron formosae` 35cm 野外记录：在树冠层觅食小型果实。鸣声：声`po-po-peh`。栖息地：森林和森林斑块。分布：栖于菲律宾北部岛屿。\n\
  \n\n\n\n\n# 8 尼钴巴尔鸽（羽颈鸽、白尾鸽或秃鹫鸽） *Caloenas nicobarica* 40cm\n\n生态习性：通常在黎晨或黄昏觅食，主要在地面上取食落果。雌性上体部呈褐色，肉疣较小，项羽较短。声音：通常保持沉默，尽管有记录其发出短促而柔和的咕咕声和猪哼声，后者通常发生在争斗期间。栖息地：森林岛屿、沿海森林、灌木丛和红树林。分布范围：留于整个该地区，特别是在小型森林岛屿上。\n\
  \n![image](img/page127.jpg)\n\n## 57 果鸽属\n\n### 1 黑背果鸽（带纹果鸽） *Ptilinopus cinctus*\
  \ 30–32cm\n\n生态习性：通常单只出现，或成对出现，偶尔成小群活动。主要出没于中层林冠和下层冠层。`P`. `c`. `ottonis` (1b) 于东小巽门群岛的达马、尼拉和巴巴尔；`P`.\
  \ `c`. `albocinctus` (1c) 于西小巽门群岛的兰莫、松汶哇和弗罗勒斯。声音：一系列音调均匀、闷的 *whoo* 声；`P`. `c`. `albocinctus`\
  \ 发出一系列双音节的 *wh-oo* 声。栖息地：原生林和高大次生低地森林、丘陵和山地森林、木麻树林和沿海森林。分布范围：留于巴厘岛和小巽门群岛。\n\n###\
  \ 2 粉头果鸽 *Ptilinopus porphyreus* 29cm\n\n生态习性：通常单只或成对遇到。害羞且不显眼。声音：柔和的 *hoo*。栖息地：橡树-月桂森林和山地石楠林。分布范围：苏门答腊、爪哇和巴厘岛特有。\n\
  \n### 3 红颈果鸽 *Ptilinopus dohertyi* 33cm\n\n生态习性：通常安静且不显眼，尽管有时会栖息在高树顶的开阔处，特别是沿石灰岩山脊。频繁出没于中层直到冠层；经常在外层叶片中缓慢而有条理地觅食，单只或成对。声音：柔和而深沉的\
  \ *woo-oo*。栖息地：剩余的原生林和高大次生森林，包括石灰岩峡谷近乎垂直壁上的森林。分布范围：西小巽门群岛的松巴岛特有。\n\n### 4 火胸果鸽 *Ptilinopus\
  \ marchei* 34–38cm\n\n生态习性：通常出没于森林冠层。非常害羞；通常在被发现前就会伴随着响亮的拍翅翅声飞走。声音：深沉的 *hooot* 或\
  \ *hooot hooot*。栖息地：山地苔藓林。分布范围：菲律宾北部特有。\n\n### 5 黄胸果鸽 *Ptilinopus occipitalis* 29–30cm\n\
  \n生态习性：频繁出没于中层和上层冠层，单只或成小群；在果树上可能出现较大的群落。声音：深沉、共鸣的 *hhooott* 或 *hoorrrr hoorrrr*。栖息地：低地和中海拔原生林。分布范围：菲律宾特有。\n\
  \n### 6 红耳果鸽 *Ptilinopus fischeri* 34cm\n\n生态习性：通常单只或成对见到，偶尔成小群。安静且不显眼。以中层和下层冠层的小果实为食。`P`.\
  \ `f`. `centralis` (6b) 于苏里答腊中部和东南部；`P`. `f`. `meridionalis` (6c) 见于苏里答腊南部。声音：柔和、上升的类蛙声\
  \ *oowup*。栖息地：原生丘陵和山地森林。分布范围：苏里答腊岛特有。\n\n### 7 奶油腹果鸽 *Ptilinopus merrilli* 32cm\n\
  \n生态习性：害羞。在冠层中觅食，有时在下层林层觅食。`P`. `m`. `faustinoi` (7b) 见于吕岛北部。声音：柔和、断续的 *crruuoop*，开头下降结尾上升，以脉冲序列重复；还还会发出柔和的咕噜声\
  \ *rrrrrr*，持续几分钟。栖息地：原生林和经过选择性采伐的森林。分布范围：菲律宾北部特有。\n\n![image](img/page129.jpg)\n\
  \n## 58 果鸽属\n\n### 1 爪望莲果鸽（红头果鸽） *Ptilinopus jambu* 22–28cm\n\n生态习性：通常在树上觅食，尽管有记录其在地面上取食落果。声音：柔和、重复的\
  \ *hooo*，尽管通常保持沉默。栖息地：红树林、沿海森林和开阔林地。分布范围：留于苏门答腊岛、爪爪哇岛和婆罗洲岛。\n\n### 2 黑颏果鸽（黑喉果鸽）\
  \ *Ptilinopus leclancheri* 26–28cm\n\n生态习性：在果树上觅食。幼鸟与雌性相似，但缺少胸带。声音：间距良好的 *whoo -\
  \ whoo - whoo*……，还有深沉、空洞的 *rooooooo* 和长长的 *whohooo*。栖息地：低地和次生林块。分布范围：留于菲律宾。\n\n\
  ### 3 班盖果鸽（红颏果鸽） *Ptilinopus subularis* 33–36cm\n\n生态习性：通常单只、成对或成小群出现。与下一种物种为同种。声音：一系列\
  \ *whoop* 声。栖息地：原生森林。分布范围：班盖群岛特有。\n\n### 4 欧伯霍尔瑟果鸽 *Ptilinopus epius* 33–36cm\n\n\
  生态习性：在树上觅食。曾被认为是前一种物种的亚种。声音：一系列 *whoop* 声。栖息地：密密的原生森林。分布范围：苏里答腊东部特有。\n\n### 5 苏拉果鸽\
  \ *Ptilinopus mangoliensis* 33–36cm\n\n生态习性：通常在大果树的冠层觅食。曾被认为是前一种物种的。声音：一系列 *whoop*\
  \ 声。栖息地：密密的原生森林。分布范围：苏拉群岛特有。\n\n### 6 绯胸果鸽 *Ptilinopus bernsteinii* 28cm\n\n生态习性：通常单只或成对见到。声音：响亮、加速的\
  \ *hoo* 声。栖息地：原生林和次生森林，以及残存林。分布范围：马马鲁库群岛北部特有。\n\n### 7 华莱士果鸽 *Ptilinopus walacii*\
  \ 26cm\n\n生态习性：经常 3–5 只或更多组成。害羞且不显眼。声音：通常保持沉默。栖息地：开阔次生林和灌木丛。分布范围：塔尼巴岛及周边地区。\n\n\
  ### 8 华丽鸽 *Ptilinopus superbus* 23–24cm\n\n生态习性：不显眼，通常单只或与其他食果鸽成对出现。`P`. `s`. `temminckii`\
  \ (8b) 见于苏里答腊。声音：缓慢的 *coo*。栖息地：原生林和高大次生低地、丘陵和低山地森林。分布范围：留于苏里答腊和马鲁库群岛。\n\n![image](img/page131.jpg)\n\
  \n## 59 果鸽属\n\n### 1 蓝帽果鸽 *Ptilinopus monacha* 18cm\n\n生态习性：单只、成对，有时成小群。通常安静。声音：缓慢、单调的\
  \ *who-oo*。栖息地：灌木状沿海森林、高大次生林和森林边缘。分布范围：马鲁库群岛北部特有。\n\n### 2 绯冠果鸽 *Ptilinopus regina*\
  \ 21–23cm\n\n生态习性：不显眼，最好通过其叫声定位。单只、成对或多达十五只的小群。声音：响亮的系列 *hoo* 声。栖息地：森林、季风林和灌木丛、沿海和河岸森林及红树林。分布范围：留于马鲁库群岛南部和小巽门群岛。\n\
  \n\n\n\n\n### 3 白项喉果鸽\n*Ptilinopus rivoli* 23–24cm\n**野外记要：** 通常单只出现、成对出现，偶尔成小群出现。经常在果实树木的中层和冠层中与其他果鸽类物种群在一起。\n\
  **鸣声：** 一系列先上升后下降的`hoo` 声。\n**栖息地：** 原生森林和高大的次生沿海、低地、丘陵和山地森林。\n**分布：** 留居于摩卢甲群岛。\n\
  \n### 4 栗胸果鸽\n*Ptilinopus viridis* 20–21cm\n**野外记要：** 经常出没于冠层。显眼地停在高处、暴露的树枝上，尤其是在清晨和傍晚。通常单只出现或成对出现。\n\
  **鸣声：** 一声哀伤的`a-huh-hoo wo wo wo wo wo wo wo wo wo wo wo`，结尾处逐渐减弱。\n**栖息地：** 原生森林和高大的次生沿海、低地和丘陵森林，森林边缘，林木稀耕地和小型沿海岛屿。\n\
  **分布：** 留居于南摩卢甲群岛。\n\n### 5 灰头果鸽\n*Ptilinopus hyogastrus* 23–24cm\n**野外记要：** 单只出现、成对出现，有时成\
  \ 20 只或更多的群落，尤其在果实树上。经常停在暴露的树顶树枝或空中电线上，特别是在清晨和傍晚。\n**鸣声：** 一声柔和、略带哀伤的重复`who-huu`。\n\
  **栖息地：** 森林边缘、次生林、有稀疏树木的草地、林木稀耕地红树林；偶尔出现在人类居住区附近。\n**分布：** 北摩卢甲群岛特有种。\n\n### 6 肉疣质果鸽\n\
  *Ptilinopus granulifrons* 20–24cm\n**野外记要：** 通常两三成群地在果实树的冠层中觅食，经常与其他食果物种在一起。\n**鸣声：**\
  \ 未有记录。\n**栖息地：** 原生和次生低地及丘陵森林，森林边缘，选择性采伐森林，林木稀耕地和沿海灌丛。\n**分布：** 北摩卢甲群岛的欧比岛特有种。\n\
  \n### 7 黑颈果鸽\n*Ptilinopus melanospilus* 21–27cm\n**野外记要：** 单只、成对或成小群发现；有 20–100\
  \ 只大群记录，通常出现在果实树上或栖息点。经常与其他食果鸟类混群。\n**鸣声：** `hoo hoo`，每几秒重复一次，通常持续几分钟。\n**栖息地：**\
  \ 原生、选择性采伐和高大的次生森林，森林边缘，开阔林，林木稀耕地，灌丛和城市地区。\n**分布：** 留居于爪哇、巴厘、小巽达群岛、菲律宾南部和西部、苏拉答锡、苏拉群岛以及北摩卢甲群岛的多伊岛，也分布苏答腊和婆罗洲附近的许多较小岛屿。\n\
  \n### 8 尼格罗斯果鸽\n*Ptilinopus arcanus* 16–17cm\n**野外记要：** 仅从一只雌性标本已知。习性推定与其他果鸽相似。可能已经灭绝。\n\
  **鸣声：** 未有记录。\n**栖息地：** 海拔 1,200 米的森林。\n**分布：** 菲律宾尼格罗斯岛特有种。\n\n![image](img/page133.jpg)\n\
  \n### 1 粉腹绿凤鸽\n*Ducula poliocephala* 42cm\n**野外记要：** 通常单只、成对或成小群在冠层中觅食。与其他绿凤鸽共同栖息。\n\
  **鸣声：** 一声深沉、洪鸣般的`booouuum booouuum`。\n**栖息地：** 原生森林、未受扰扰的次生林和森林边缘。\n**分布：** 菲律宾特有种。\n\
  \n### 2 白腹绿凤鸽\n*Ducula forsteni* 43–52cm\n**野外记要：** 单只、成对出现，偶尔成大群，尤其在果实树上。通常声音活跃且显眼，经常停在冠层上方的暴露树枝上。在冠层下方或中层觅食。\n\
  **鸣声：** 一声非常深沉、传播很远的`uu-uum`。\n**栖息地：** 原生丘地和山地森林。\n**分布：** 苏拉答锡和苏拉群岛特有种。\n\n###\
  \ 3 民德罗绿凤鸽\n*Ducula mindorensis* 47cm\n**野外记要：** 通常单只或成对出现，偶尔成小群；在林下层和冠层觅食。\n**鸣声：**\
  \ 一声深沉、共鸣的双音节调。\n**栖息地：** 山地森林，偶尔出现在低地森林。\n**分布：** 菲律宾民德罗岛特有种。\n\n### 4 灰头绿凤鸽\n\
  *Ducula radiata* 36–39cm\n**野外记要：** 胆小。单只或多达 20 只的群群出现。偶尔在果实树上与其他鸽子混群。在中层和下冠层觅食。\n\
  **鸣声：** 一声低沉的`huh`。\n**栖息地：** 原生丘地和山地森林，森林边缘，偶尔出现在低地森林。\n**分布：** 苏拉答锡特有种。\n\n###\
  \ 5 斑腹绿凤鸽（灰颈绿凤鸽）\n*Ducula carola* 33–36cm\n**野外记要：** 通常以小群或大群出现，有时与绿凤鸽群在一起。分布于低地的绿凤鸽。`mindanensis`\
  \ 分布于棉兰岛。\n**鸣声：** 一声深沉、结尾加速的`hu hu hu-hu-hu`。\n**栖息地：** 低地。\n**分布：** 菲律宾。\n\n###\
  \ 6 绿凤鸽\n*Ducula aenea* 40–47cm\n**野外记要：** 通常成对或成小群。在清晨，经常停在顶部的枯枝上，然后扩散觅食。在冠层中觅食。\n\
  **鸣声：** 一系列中等音调的`hoo` 声。\n**栖息地：** ...`paulina` 分布于苏拉答锡、托吉安、班盖以及苏拉群岛。\n**\n\n###\
  \ 7 镜纹绿凤鸽\n*Ducula persillata* 41cm\n**野外记要：** 单只、成对或成小群出现。通常活跃且显眼，尤其在清晨和傍晚，鸟倾向于停在开阔处。\n\
  **鸣声：** 一系列急促的低音。\n**栖息地：** 原生沿海、低地森林，森林边缘，高大的次生森林，林木稀耕地和红树林。\n**分布：** 来自布鲁的摩卢甲群岛。\n\
  \n### 8 塞拉绿凤鸽\n*Ducula neglecta* 43cm\n**野外记要：** 曾被视为前一种物种的亚种；习性和行为推定相似。\n**鸣声：**\
  \ 一声深沉、滚动的`wooo`。\n**栖息地：** 原生和选择性采伐森林。\n**分布：** 南摩卢甲群岛的塞拉以及附近的波诺、安汶和斯帕鲁亚群岛。\n\n\
  ![image](img/page135.jpg)\n\n### 1 蓝尾绿凤鸽（优雅或黄眼绿凤鸽）\n*Ducula concinna* 45cm\n**野外记要：**\
  \ 通常以多达 40 只的群出现，尽管也会单只或成对。在中层和冠层觅食。具有游走性，记录在岛屿间飞行寻找食物。\n**鸣声：** 一声粗鲁的`urrauw`，间杂着响亮的、拉长的上扬摩擦声。\n\
  **栖息地：** 原生和次生森林，森林边缘和林木稀耕地。\n**分布：** 留居于摩卢甲群岛的小岛屿。\n\n### 2 香料绿凤鸽\n*Ducula myristicivora*\
  \ 41–43cm\n**野外记要：** 清晨和傍晚停在高处、暴露的树枝上，通常单只、成对，偶尔成小群。\n**鸣声：** 一声粗糙、传播远、短促且上扬的双音摩擦声；还有一声短促粗糙的`koor`。\n\
  **栖息地：** 原生和高大的次生低地森林及红树林。\n**分布：** 可能留居于北摩卢甲群岛的威迪岛。\n\n### 3 圣诞绿凤鸽\n*Ducula whartoni*\
  \ 42–45cm\n**野外记要：** 主要在冠层觅食，有时在果实树上成较大群出现。\n**鸣声：** 一系列模糊的咕咕声调，`rroow`…`rroow`…`rroow`；；据报道还有一种深沉的洪鸣声。\n\
  **栖息地：** 内陆原生和次生雨林，在树木结果实时也出现在滨海森林。\n**分布：** 圣诞岛特有种。\n\n\n\n\n\n# 4 粉红蜜鸽 `Ducula\
  \ rosacea` 44cm\n野外记录：单只、成对或多达 20 只鸟的群群出现。经常出没于林冠层，通常与其他蜜鸽聚集在一起。鸣声：深沉、闷响、拉长的 `hoo-ooo`，也有记录为\
  \ `hoo hoo hoo-oo hoo-oo hoo-oo`。栖息地：原生林、经过选择性采伐的森林、高次生海岸林、平原和山地森林、森林边缘、灌木林、林木稀疏的耕地和小离岸岛屿。分布：留于爪哇海和弗罗里斯海岛屿、小巽他群岛，以及当地的马鲁古群岛。\n\
  \n# 5 灰蜜鸽 `Ducula pickeringii` 40cm\n野外记录：通常单只或成对可见。可能会在岛屿间穿梭寻找食物。`D`. `p`. `langhornei`\
  \ (5b) 产于中苏禄群岛。鸣声：深沉、粗哑的 `o-oow` 或 `oot aaooooh`。栖息地：原生林和高次生海岸林、平原森林、退化的季风林和林木稀疏的耕地。分布：留于苏拉腊北部的小岛屿、苏禄群岛和婆罗洲东北部外的岛屿。\n\
  \n# 6 肉桂腹蜜鸽 `Ducula basilica` 41–42cm\n野外记录：通过响亮的鸣声发现踪。单只、成对或小群通常出现在中层和下冠层；也有记录栖息在高大的突出树木上，俯瞰周围森林。`D`.\
  \ `b`. `obiensis` (6b) 产于北马鲁古的奥比岛。鸣声：不慌促、深沉的喉音，开始前是一声短促、沙哑的 `oo` 或 `whoo`。栖息地：原生平原和山地森林、受干扰的森林和林木稀疏的耕地。分布：北马鲁古特有。\n\
  \n# 7 山地蜜鸽 `Ducula badia` 43–51cm\n野外记录：通常成对或小群出现。鸣声：咔哒声或咯咯声，随后是深沉、共鸣、响亮的双音或三音，`whroom\
  \ whroom` 或 `whroom whroom whroom`。栖息地：山林，但也会访问平原的果树和红树林。分布：留于苏门腊、西爪哇和婆罗洲。\n\n#\
  \ 8 黑背蜜鸽 `Ducula lacernulata` 35–45cm\n野外记录：通常在森林冠层以小群遇到；偶尔单只或成对发现。`D`. `l`. `willami`\
  \ (8b) 产于东爪哇和巴厘；`D`. `l`. `sasakensis` (8c) 产于西巽他群岛。鸣声：一系列闷响的短促 `whu` 声。栖息地：山丘和山地森林、有树的耕地，以及弗罗里斯的木松林。分布：留于爪哇、巴厘和西巽他群岛。\n\
  \n![images/page137.jpg)\n\n## 1 帝汶蜜鸽 `Ducula cineracea` 39–45cm\n野外记录：在冠层茂密的叶丛中觅食，单只、成对或小群。鸣声：一系列快速、深沉、闷响、共鸣的\
  \ `hu` 声，产生颤抖的声音；也有记录为深沉的 `hoo hoo` 鸣声。栖息地：山林，偏好季风林地区。分布：东巽他群岛的帝汶岛和韦塔尔岛特有。\n\n##\
  \ 2 斑胸蜜鸽 `Ducula bicolor` 35–42cm\n野外记录：通常成群或小群出现。通常栖息在小岛和礁石上，访问较大岛屿的海岸地区觅食。鸣声：多样，叫声包括深沉的咕噜声、笑般的\
  \ `hu-hu-hu`、`cru-croo`、深沉的 `wuum wuum` 和 `whoo whoo whoo hoo hoo`。栖息地：海岸森林、红树林和种植园。分布：留于苏门腊、爪哇、巴厘外的岛屿、婆罗洲外的岛屿、菲律宾南西群岛、苏拉腊外的岛屿、马鲁古，以及东巽他群岛的科莫多岛和塔宁巴岛。\n\
  \n## 3 银尖蜜鸽 `Ducula luctuosa` 37–38cm\n野外记录：群居；通常成小群聚集，尽管记录过非常大的群，特别是在黄昏前。鸣声：叫声包括低吼的\
  \ `coo-cooo`、低沉的 `wh-hoo`、一声响亮的、上扬的 `whooo` 和平滑的 `woooo`。栖息地：森林边缘、开阔林地、林木稀疏的耕地和红树林。分布：苏拉锡岛和苏拉群岛特有。\n\
  \n## 4 灰鸠 `Cryptophaps poecilorrhoa` 46cm\n野外记录：通常单只出现，偶尔成对。喜爱未受干扰森林的亚冠层。鸣声：未记录。栖息地：原生山丘和山地森林。分布：苏拉锡特有。\n\
  \n## 5 婆布亚山鸠 `Gymnophaps albertisii` 33–36cm\n野外记录：在冠层觅食，单只、成对或成群；报道信息较少。鸣声：安静、低调、上扬的\
  \ `wooooooo m`；还有柔和的、抱怨的哨声。栖息地：山林。分布：留于北马鲁古的巴加肯岛。\n\n## 6 布鲁鲁山鸠 `Gymnophaps mada`\
  \ 33–36cm\n野外记录：信息较少。单只、成对或成群出现。鸣声：安静、低调、上扬的 `wooooooo`；还有柔和的、抱怨的哨声。栖息地：山林，偶尔访问平原。分布：布鲁鲁岛特有。\n\
  \n## 7 塞拉姆山鸠 `Gymnophaps stalkeri` 33–39cm\n野外记录：曾被认为是前一种物种的亚种。鸣声：未记录。栖息地：山丘和山林。分布：塞拉姆岛特有。\n\
  \n## 8 白冠鸽 `Goura cristata` 66–75cm\n野外记录：极易识别。在地面觅食，单只或成群；栖息在树上。鸣声：非常低沉的 `oom`。栖息地：平原森林。分布：留于塞拉姆岛。\n\
  \n![images/page139.jpg)\n\n# 秧��；秧鸡类\n\n### 1 红颈秧�� `Rallina tricolor` 23–30cm\n\
  野外记录：在森林地面、浅溪或浅水池觅食，单只或成对。鸣声：重复的、下降的 `nark-nak` 或 `kare-are-kare`，还有单调的 `tock tock\
  \ tock`。栖息地：原生和高次生雨林、季风林。分布：南马鲁古和东巽他群岛。\n\n### 2 红脚秧�� `Rallina fasciata` 23–25cm\n\
  野外记录：单只或成对出现。隐行；可能是夜性的。鸣声：响亮的 `gogogok`、鼻音的 `pek pek`、`girrr` 和缓慢的下降颤音。栖息地：芦苇沼泽和湿地、水道，以及森林或次生地的湿润地区。分布：留于苏门腊、爪哇、婆罗洲和菲律宾。\n\
  \n### 3 灰脚秧�� `Rallina eurizonoides` 27cm\n野外记录：害，主要在清晨或黄昏活跃；如果受惊，可能会飞去栖在树枝上。鸣声：持续的\
  \ `kek-kek-kek-kek` 或 `ow-ow-ow-ow`。栖息地：具有密集下层的森林、森林溪、灌木丛和长草。分布：留于苏拉锡、苏拉群岛和菲律宾；冬季迁至苏门腊和西爪哇。\n\
  \n### 4 帝汶秧�� `Gallirallus calayanensis` 30cm\n野外记录：在地面觅食，单只或小群；受干扰时倾向于逃跑。鸣声：一系列沙哑、断续的\
  \ `ngeck` 声。栖息地：珊瑚石石灰岩上的原生和次生森林。分布：菲律宾北卡拉延岛特有。\n\n### 5 斑带秧�� `Gallirallus philippensis`\
  \ 30cm\n野外记录：通常单只见到，偶尔成小散群；在水边、小径或路边觅食。鸣声：驴叫般的 `coo-aw-ooo-aw-ooo-aw-ooo-aw`、吱吱的\
  \ `swit-swit` 和尖锐的 `krek-krek-krek`。栖息地：沼泽干燥的部分、草地、甘蔗田、荒草地和开放山丘。分布：留于婆罗洲、菲律宾，广泛分布于瓦莱西群岛。\n\
  \n\n\n\n\n## 6 黑带环秧\n*Gallirallus torquatus* 33–35cm 习性记录：非常害羞。通常单独出现、成对出现，或偶尔成小群活动。经常在少有人使用的道路旁觅食。`G.\
  \ t. sulcirostris` (6b) 分布于班盖岛和苏拉岛。声音：响亮、不和谐的、刺耳的鸣声和尖叫，通常持续几秒。栖息地：原生森林和高地次生低地森林边缘的茂盛草地、红树林、混合灌木丛和耕地。分布：菲律宾、苏苏里锡岛及附近的班盖岛和苏拉岛。\n\
  \n## 7 灰胸环秧\n*Gallirallus stiatus* 29cm 习性记录：躲避；通常在茂密的植被中觅食，尽管经常有报道在开阔地区觅食，尤其是在黎明或黄昏。声音：尖锐的\
  \ `terrik` 声，可能连成“歌声”；还有嘈杂的 `ka-ka-ka`。栖息地：沼泽、芦苇丛、稻田、红树林以及沿溪流和溪边的茂盛草丛和灌木丛。分布：苏门答腊、爪哇、巴厘、婆罗洲、菲律宾和苏里锡岛；小巽群岛的客鸟。\n\
  \n## 8 印度水秧（棕颊环秧）\n*Rallus indicus* 23–28cm 习性记录：隐秘，但在未受干扰时会在开阔地区觅食。声音：长而清脆的哨音般的\
  \ `kyu` 声，还有重复的金属感、模糊的 `shrink shrink` 声。栖息地：沼泽。分布：婆罗洲岛的客鸟。\n\n## 9 棕带环秧\n*Lewinia\
  \ mirifica* 21–22cm 习性记录：记录较少；习性推测与刘文环秧相似。声音：未记录。栖息地：山地森林和混合草类与灌木的松林。分布：菲律宾吕宋岛的特有种。\n\
  \n## 10 刘文环秧\n*Lewinia pectoralis* 23–27cm 习性记录：隐秘且警觉，主要在黄昏、黎明和阴天时活动。极难惊起，受干扰时利用茂密植被中的跑道逃生。声音：响亮、重复的\
  \ `grr-eek grr-eek`，还有响亮的、金属感的 `jik-jik-jik-jik`……栖息地：茂盛的再生植被、密草和灌木丛，通常靠近水边。分布：小巽群岛弗勒斯岛。\n\
  \n![image](img/page141.jpg)\n\n64 秧类\n\n## 1 鼾声秧\n*Aramidopsis plateni* 29cm 习性记录：在茂密的遮蔽物中觅食，单独、成对或小家庭群体；据报道在山林溪流中寻找螃。声音：安静的打鼾声，由短促的喘息后接长长的\
  \ `ee-orrrr`；还会发出短促、深沉的叹息 `hmmmm`。栖息地：原生和高地次生低地森林、山地森林，以及森林边缘茂密的湿润次生植被。分布：苏里锡岛特有种。\n\
  \n## 2 蓝脸秧\n*Gymnocrex rosenbergii* 30cm 习性记录：行踪诡秘。单独出现，偶尔成对。喜好森林内的湿润地区。声音：发出安静的咯咯声。栖息地：原生和高地次生低地及山地森林、密集的次生森林斑块和灌木丛的废弃稻田。分布：苏里锡岛特有种。\n\
  \n## 3 裸眼秧\n*Gymnocrex plumbeiventris* 30–33cm 习性记录：通常独居且隐秘。在森林地面来回奔寻找食物，不断发出咕噜声。声音：连续的咕噜声\
  \ `uw uw uw uw`……；还会发出响亮的、吞咽般的 `wow-wow-wow-wow`。栖息地：原生和高地次生低地森林。分布：北摩卢加群岛。\n\n\
  ## 4 塔劳德秧\n*Gymnocrex talaudensis* 33–35cm 习性记录：记录较少，据说极其害羞。声音：十五个或更多快速、高调的 `peet-peet-peet`\
  \ 声。栖息地：低地森林边缘的湿草和茂盛植被丛。分布：苏里锡岛东北部的塔劳德岛特有种。\n\n## 5 浅褐秧\n*Amaurornis isabellina*\
  \ 35–40cm 习性记录：通常害羞，尽管经常在茂密植被内及近期开垦区域边缘相当公开地觅食。声音：各种尖锐、略微脉冲的尖叫声和啾喳声，通常由几只鸟共同发出。栖息地：茂密茂盛的草地、荒废耕地、森林边缘混合草类和高草的矮灌木丛。分布：苏里锡岛特有种。\n\
  \n## 6 原斑秧\n*Amaurornis olivacea* 30cm 习性记录：通常单独见到，但在合适的栖息地中可能成群出现。听见多于看见。声音：沙哑的、咆哮的\
  \ `kaawww keerrr`。栖息地：干燥草地、灌木丛、森林种植园和伐木区。分布：菲律宾特有种。\n\n## 7 浅腹秧（红尾秧）\n*Amaurornis\
  \ moluccana* 30cm 习性记录：害羞且隐秘。通常待在茂密的遮蔽物中；在溪流中行走或游泳，通常保持在阴处。曾被认为与前述物为同种。声音：一系列尖叫或类猫的哀鸣，声音逐渐减小。栖息地：密草和灌木丛、沼泽、溪流。分布：桑希岛和塔劳德岛。\n\
  \n## 8 塔劳德秧\n*Amaurornis magnistris* 30–31cm 习性记录：害羞但好奇。在茂密的遮蔽物中觅食，尽管经常在轻微干扰下奔跑。声音：一系列类蛙或低沉的吠声。栖息地：森林、茂盛植被、沼泽斑块和荒废耕地。分布：卡拉凯隆岛特有种。\n\
  \n## 9 白胸秧（白胸水秧）\n*Amaurornis phoenicurus* 28–33cm 习性记录：特征明显。经常在开阔地区见到，并在灌丛中攀爬。`A.\
  \ p. leucomanus` (9b) 分布于苏里锡、摩卢加和小巽群岛。声音：各种响亮的咕噜声和咯咯声。栖息地：各种湿地。\n\n## 10 鼓秧（隐形秧）\n\
  *Habroptila wallacii* 35cm 习性记录：通常独居。偶尔见到穿过开阔地区。声音：据报道发出低沉的鼓声 `wak wak wak`，同时用翅膀发出\
  \ `tuk tuk` 声。栖息地：森林、密集的沼泽丛（`Metylon sagu` 沼泽）、沼泽边缘。分布：哈马黑拉岛特有种。\n\n![image](img/page143.jpg)\n\
  \n## 65 秧类；水秧；泽秧；水秧；脚秧](#contents.xhtml_rch65)\n\n## 1 林秧\n*Porzana pusilla* 17–19cm\
  \ 习性记录：在黎明或黄昏在近处或密闭物中觅食。声音：干枯的类蛙撞击声。栖息地：沼泽、稻田，以及湖泊和池塘周围。分布：可能居住在苏门答腊、婆罗洲、苏里锡、摩卢加的拉姆和弗勒斯；迁入菲律宾和爪哇。\n\
  \n## 2 红胸秧\n*Porzana fusca* 21–23cm 习性记录：隐秘，尽管经常在芦苇边缘见到。声音：粗哑的 `tewk` 声，通常会加快并随后是下调的鸣声。栖息地：沼泽、稻田、沿溪流、干燥灌木丛和林径。分布：苏门答腊、爪哇和巴厘，可能分布于婆罗洲、菲律宾、苏里锡和小巽群岛西部。\n\
  \n## 3 带腹秧\n*Porzana paykullii* 20–22cm 习性记录：隐秘。很少见到，经常听见。声音：短促的鸣声，像木制撞击声。栖息地：开阔内陆沼泽、湿草地、潮湿林和稻田。分布：迁入苏门答腊、爪哇和婆罗洲；苏里锡岛的客鸟。\n\
  \n## 4 无斑秧\n*Porzana tabuensis* 15–18cm 习性记录：隐秘。在深度遮蔽中觅食；目击通常是鸟从一个遮蔽处冲向另一个。在植被中和树枝上攀爬。声音：响亮的、像缝纫机一样的\
  \ `purr`，以及响亮的 `pit` 声，通常夹杂着粗粗、鼻音的 `harr`。栖息地：湿草地、沼泽。分布：居住在菲律宾北部和摩卢加的帝汶岛。\n\n\n\n\
  \n\n# 5 白额秧��\n*Porzana cinerea* 19–22cm\n野外记录：在黎晨和黄昏觅食，稍有扰动便躲藏。多听其鸣声。\n鸣声：响亮、鼻性的、密集的\
  \ *chika* 声，重复 10–12 次；还有重复的鼻性 *hee* 声。\n栖息地：湿地草地、沼泽、稻田和溪流旁茂密的植被。\n分布：在该地区范围内留鸟。\n\
  \n# 6 水鸡\n*Gallicrex cinerea* 42–43cm\n野外记录：主要是晨昏性活动，行踪躲避的；善于游泳。\n鸣声：一连串的 *kok*\
  \ 声，随后是一系列空洞的 *utumb* 声，最后以一短短的 *kluk* 声结束。\n栖息地：沼泽、湿泽地、稻田和红树林。\n分布：在菲律宾留鸟；在苏门答腊和婆罗洲为留鸟和冬季候客；是苏拉西和西巽达群岛的冬季候客。\n\
  \n# 7 紫水鸡\n*Porphyrio porphyrio* 45–50cm\n野外记录：在开阔地容易觅食，通常靠近隐蔽处。在浮植物上行走，在芦苇和灌丛间攀爬。`P.\
  \ p. indicus`（主图）发现于苏门答腊、爪哇岛、婆罗洲、苏拉西和菲律宾南部；`P. p. pulverulentus` (7b) 见于菲律宾。描绘的两种形式通常被视为完整物种。\n\
  鸣声：一系列哀伤、鼻性的沙沙声，以渐强音结束；还有低沉的 *chuk-chuk* 声和号角般的 *toot* 声。\n栖息地：密集的芦苇丛以及湖泊、池塘和河流边缘的植被。\n\
  分布：在该地区范围内留鸟。\n\n# 8 黑水鸡（普通黑水鸡）\n*Gallinula chloropus* 32–35cm\n野外记录：通常停留在隐蔽处边缘，尽管经常在开阔地行走。善于游泳。\n\
  鸣声：泡泡般的 *krrrrk* 或 *kurr-ik*；受惊时，发出 *kik-kik-kik* 声。\n栖息地：周围有挺生植物的沼泽、湖泊和水道。\n分布：在该地区为留鸟和迁鸟，马鲁古群岛除外。\n\
  \n# 9 黑秧鸡\n*Gallinula tenebrosa* 30cm\n野外记录：在开阔地觅食，并在水生植物中游泳。\n鸣声：各种尖叫声、鸣叫声，还有鼻性的\
  \ *kerk* 声。\n栖息地：有水生植物的湖泊、池塘和沼泽。\n分布：在华拉西群岛留鸟，可能在东南婆罗洲南部留鸟。\n\n# 10 斑骨（欧亚斑骨或普通斑骨）\n\
  *Fulica atra* 36–38cm\n野外记录：通常看到在游泳，尽管经常在水边岸觅食。\n鸣声：各种金属感的鸣声。\n栖息地：植被边缘的开阔水域。\n\
  分布：婆罗洲、爪哇岛、巴厘岛、菲律宾、西巽达群岛和南马鲁古群岛的稀有冬季候客或漂鸟。\n\n# 11 面鹤\n*Heliopais personatus* 43–55cm\n\
  野外记录：行踪隐秘，通常在悬空植被下方游泳。\n鸣声：高音、泡泡般的、咕噜般的 *quack* 声。\n栖息地：阴的丛林河流和茂密的红树林沼泽。\n分布：苏门答腊的冬季候客或漂鸟；爪哇岛和婆罗洲的漂鸟。\n\
  \n![image](img/page145.jpg)\n\n## 66 鸴类\n\n# 1 凤头鸴（北方凤头鸴、等）\n*Vanellus vanellus*\
  \ 28–31cm\n野外记录：通常成对或成群出现。从上方俯飞时，看起来是黑色，有白色下尾臀和白色尖初级羽。\n鸣声：哀伤的 *pee-wit* 或 *wee-ip*\
  \ 声。\n栖息地：草地、湖岸和边缘以及河口。\n分布：婆罗洲西北部的漂鸟。\n\n# 2 爪哇凤鸴（爪或爪哇肉冠凤鸴）\n*Vanellus macropterus*\
  \ 28cm\n野外记录：记录极少。1940 年后未有报道；可能已灭绝。\n鸣声：未记录。\n栖息地：淡水池塘附近的开阔地区、农田和河三角口。\n分布：爪哇岛特有。\n\
  \n# 3 斑扇鸴\n*Vanellus miles* 33–37cm\n野外记录：喧闹且引眼，通常在小群中遇到。飞行时，显示白色的上尾覆和尾基部。\n鸣声：刺耳的、断续的\
  \ *keer-ki-ki-ki-ki* 或 *krik-krik-krik* 声，尖锐的 *kek* 声和模糊的、下降的 *kreerk-kreerk* 声。\n\
  栖息地：水边的草地，以及湖泊和沼泽边缘。\n分布：偶尔造访南马鲁古群岛、东巽达群岛和圣诞岛。\n\n# 4 红肉冠凤鸴（红冠凤鸴）\n*Vanellus indicus*\
  \ 32–35cm\n野外记录：成对或小族群出现。从上方俯飞时，翅膀呈深色，次级覆羽上有白色条纹；臀部、上尾覆和尾基为白色；尾部主要为黑色带白尖。\n鸣声：尖锐的\
  \ *did-he-do-it* 或 *kree-dee-der* 声；受惊时，发出尖锐声。\n栖息地：开阔地区、农田、湖泊边缘。\n分布：苏门答腊的冬季候客。\n\
  \n# 5 灰头凤鸴\n*Vanellus cinereus* 34–37cm\n野外记录：通常成群出现。非繁殖期鸟喉部为白色。从上方俯飞时，显示白色翼缘；尾部黑色。\n\
  鸣声：哀伤的 *chee-it* 声；受扰时，发出沙哑声。\n栖息地：湿泽地、稻田和湖泊边缘。\n分布：婆罗洲和苏拉西的漂鸟。\n\n# 6 太平洋金鸴（亚洲或东方金鸴）\n\
  *Pluvialis fulva* 23–26cm\n野外记录：单只、成对或成群出现。\n鸣声：快速的 *chu-wit* 和拉长的 *klu-ee*。\n栖息地：沿海湖、泥滩、湖泊边缘和草地。\n\
  分布：在该范围内冬季候客。\n\n# 7 灰鸴（黑腹鸴）\n*Pluvialis squatarola* 27–30cm\n野外记录：单只、成对或小群出现。从上方俯飞时，显示白色臀部。非繁殖期下翅明显斑块。\n\
  鸣声：忧郁的 *tlee-oo-ee* 声（在沙滩上）。\n栖息地：主要是沿海泥滩和沙滩。\n分布：在该范围内冬季候客。\n\n![image](img/page147.jpg)\n\
  \n## 67 鸴类\n\n# 1 环鸴（普通环鸴）\n*Charadrius hiaticula* 18–20cm\n野外记录：通常单只或成对。飞行时，上翅显示明显的条纹。\n\
  鸣声：柔和上升的 *too-lee*；受惊时，发出轻柔的 *too-weep*。\n栖息地：海岸岸边、湖泊和河流。\n分布：婆罗洲和西巽达群岛的冬季漂鸟。\n\n\
  # 2 长嘴鸴\n*Charadrius placidus* 19–21cm\n野外记录：通常单只或松散群落。飞行时，上翅显示不明显的条纹。\n鸣声：的 *pewee*，还有悦耳的\
  \ *tudulu*。\n栖息地：湖泊和河流边缘、沼泽、沿海池塘和稻田。\n分布：婆罗洲和巴厘岛的漂鸟。\n\n# 3 小环鸴\n*Charadrius dubius*\
  \ 14–17cm\n野外记录：通常单只或小群。黄色眼环。飞行时，上翅显示不明显的条纹。\n鸣声：下降的 *pee-oo* 声；受惊时，发出 *pip-pip-pip*\
  \ 声。\n栖息地：湖泊和河流边缘、沼泽、泥滩和河口。\n分布：菲律宾留鸟；在该范围内冬季候客。\n\n# 4 亚亚鸴\n*Charadrius alexandrinus*\
  \ 15–17cm\n野外记录：经常与其他小鸴混群，其较快的动作可能脱颖。飞行时，上翅显示白色条纹。\n鸣声：柔和、清晰的 *pit* 或 *pit-pit-pit*；受惊时，发出响亮的\
  \ *prrr*、*too-eet* 或 *pweep*。\n栖息地：海岸沙滩、潟湖、盐湖和湖泊。\n分布：访问苏门答腊、爪哇岛、巴厘岛、婆罗洲和菲律宾部的冬季候客。\n\
  \n# 5 白面鸴\n*Charadrius dealbatus* 16–17cm\n野外记录：某些权威认为是前述物种的亚种；行为预计相似。\n鸣声：通常沉默，否则与前述物种无已知差异。\n\
  栖息地：沙地、泥滩、盐湖和围垦地。\n分布：苏门答腊、菲律宾和苏拉西的冬季候客；婆罗洲的漂鸟。\n\n\n\n\n[content]\n## 6 红冠鸻\n*Charadrius\
  \ ruficapillus* 14–16cm\n野外札记：单独出现、成对或成小群出现。活跃且亲人。曾被认为是凤环鸻的一个亚种。鸣声：快速而尖锐的颤音；其他鸣声与凤环鸻相似。栖息地：沿海及近岸的沙质和贝壳滩、咸水和盐水泥滩及沙滩。分布：小巽他尔群岛的偶然冬客，可能也出现在爪哇爪岛。\n\
  \n## 7 马来鸻\n*Charadrius peronii* 14–16cm\n野外札记：通常成对或小群出现。飞行时，上翅显示出明显的白色翼斑，尤其在级飞羽基部。鸣声：柔和的\
  \ `whit` 或 `twik`。栖息地：未受干扰的沙滩、珊瑚滩和贝壳滩，以及邻近的泥滩。分布：在苏门答腊、巴厘岛、婆罗洲、菲律宾、苏拉威西和小巽他尔群岛留留。\n\
  \n## 8 爪哇鸻\n*Charadrius javanicus* 15cm\n野外札记：曾被认为是凤环鸻的一个亚种；行为和习性认为相似。鸣声：柔和、上升的\
  \ `kweek kweek`。栖息地：沿海低地。分布：在爪哇岛、巴厘岛和小巽他尔群岛的巽望岛留留。\n\n## 9 小沙鸻\n*Charadrius mongolus*\
  \ 19–21cm\n野外札记：群居性，常成大群，也与其他鸻混群。飞行时，上翅显示白色翼斑。`C. m. atrifrons` (9b) 出于苏门答腊。鸣声：短促的\
  \ `drrit` 和尖锐的 `chitik` 或 `chiktik`。栖息地：主要是沿海泥滩和沙滩。分布：整个地区的冬客或候鸟。\n\n## 10 东方鸻\n\
  *Charadrius veredus* 22–25cm\n野外札记：单独或成小群出现；飞行强健有力，常伴有不规则的转向。鸣声：颤鸣和短促的哨声 `klink`；飞行时，发出尖锐的口哨声\
  \ `chip-chip-chip`。栖息地：干旱草原、湿地附近的干旱区域以及沿海泥滩和沙滩。分布：整个地区的冬客或候鸟。\n\n## 11 大沙鸻\n*Charadrius\
  \ leschenaultii* 22–25cm\n野外札记：群居性。飞行时，上翅显示明显的白色翼斑。鸣声：柔和的 `trrri`，还有悦耳的 `pipruirr`。栖息地：主要是沿海湿地。分布：整个地区的冬客或候鸟。\n\
  \n![image](img/page149.jpg)\n\n# 68 木嘴鹬；游隼类\n\n## 1 木嘴鹬（欧亚木嘴鹬）\n*Scolopax rusticola*\
  \ 33–35cm\n野外札记：通常在受惊起飞时遇到，随后它在树林间之字形飞行然后消失在视野中。鸣声：通常安静，但可能发出 `schaap` 或 `schaap\
  \ schaap`。栖息地：有觅食湿地的森林和种植园。分布：婆罗洲的游离，可能出现在菲律宾。\n\n## 2 爪哇木嘴鹬（暗木嘴鹬）\n*Scolopax saturata*\
  \ 30cm\n野外札记：夜行性。黎晨或黄昏时进行晨鸣展示飞行，通常在森林空地上。鸣声：鼻音的 `queet` 和快速、尖叫的 `quo-quo-quo-quo`，两者都在展示飞行期间发出，后者在栖息时也会发出。栖息地：潮湿的山地森林，具有中等至密的植被。分布：在苏门答腊和爪哇留留。\n\
  \n## 3 苏拉威西木嘴鹬\n*Scolopax celebensis* 30–35cm\n野外札记：躲避危险，据报道黄昏时在树冠上方进行短途飞行；几乎没有其他记录信息。鸣声：未记录。栖息地：茂密的山地森林，特别是林冠下方有开阔地的地方；也在竹林中。分布：苏拉威西特有。\n\
  \n## 4 摩马鹿加木嘴鹬（奥比木嘴鹬）\n*Scolopax rochussenii* 32–40cm\n野外札记：行踪诡秘；在黄昏晨鸣展示飞行时最好看到，此时它扇浅拍翅膀在树冠、水道或沼泽上方进行环绕或线性飞行。鸣声：展示飞行期间发出爆发性的颤音。栖息地：低地、山地和轻微干扰的森林，靠近河流或溪流。分布：北马鹿加群岛奥比岛和巴干岛特有。\n\
  \n## 5 布基德农木嘴鹬\n*Scolopax bukidnonensis* 33cm\n野外札记：通常独居且夜行性。黎晨或黄昏时在森林空地上进行宽大的椭圆形展示飞行。鸣声：展示飞行期间，发出金属感的、断续的咔哒声\
  \ `pip-pip-pip-pip-pip`，鸣声之间有低吼声 `gro-a gro-a`。栖息地：中海拔和山地森林，尤其是苔藓森林。分布：菲律宾特有。\n\n\
  ## 6 斯温氏鹬（中国鹬）\n*Gallinago megala* 27–29cm\n野外札记：休息时，初级羽伸过三级羽。飞行时，脚趾略微超过尾部，翅下有均匀的条纹。鸣声：受惊时偶尔发出粗鲁的\
  \ `scaap`。栖息地：沼泽、水浸草地。\n\n## 7 尖尾鹬（针状尾鹬）\n*Gallinago stenura* 25–27cm\n野外札记：休息时，三级羽重叠尾部。飞行时，脚趾略微超过尾部，尾部看起来短。鸣声：受惊时发出低音的\
  \ `scaap`。栖息地：沼泽、稻草地。分布：小巽他尔群岛冬客。\n\n## 8 游鹬（普通鹬）\n*Gallinago gallinago* 25–27cm\n\
  野外札记：通常靠近掩护物。受惊时以快速、之字形、高飞的方式。飞行时，次羽显示白色边缘。鸣声：受惊时发出粗糙的 `scaap`。栖息地：各种湿地、沼泽地和沼泽。\n\
  \n## 9 鹬\n*Lymnocryptes minimus* 17–19cm\n野外札记：谨慎，倾向于在踩到时等待；以不规则的动作离开。鸣声：干扰时可能发出微弱的\
  \ `gah`。栖息地：沼泽、水浸陆和草地区域。分布：菲律宾和婆罗洲冬客。\n\n# 69 沙鹬；鹬鹬；岩鹬\n\n## 1 长嘴沙鹬\n*Limnodus scolopaceus*\
  \ 27–30cm\n野外札记：通常群居，成小群出现。飞行时，背部显示一个白色椭圆斑，飞行羽边缘为白色，尾部有明显的黑白条纹。鸣声：尖锐的 `kik` 或 `kik`，通常重复。栖息地：各种湿地，包括内陆和沿岸。分布：巴厘岛和婆罗洲游离。\n\
  \n## 2 亚洲沙鹬（亚洲鹬或长嘴沙鹬）\n*Limnodus semipalatus* 33–36cm\n野外札记：经常与鹬类在一起。飞行时，背部显示白色，带灰色条纹和斑纹；尾部为白色带灰色条纹。鸣声：尖叫的\
  \ `chep-chep` 或 `chowp`，还有柔和的类人的 `kiawow`。栖息地：沿海湿地。分布：苏门答腊、爪哇和婆罗洲冬客；菲律宾候鸟；苏拉威西和小巽他尔群岛游离。\n\
  \n## 3 黑尾鹬\n*Limosa limosa* 40–44cm\n野外札记：群居性，常与黑尾沙和其他涉水鸟在一起。飞行时，上翅显示明显的白色翼斑，白色臀部和黑色尾部。鸣声：`kek`、`tuk`\
  \ 或 `kip`，通常重复。栖息地：泥滩、沿海池塘、沼泽和湖岸。分布：整个地区的冬客或候鸟。\n\n## 4 黑尾鹬\n*Limosa lapponica*\
  \ 37–41cm\n野外札记：群居性，常与黑尾鹬和其他涉水鸟在一起。飞行时，显示从臀部到背中部的白色；尾部黑白条纹。鸣声：吠叫的 `kak-kak` 和 `kirric`\
  \ 或类似。栖息地：河口、泥质或沙质岸以及沿海池塘。分布：整个地区的冬客。\n[/content]\n[/content] (Wait, 我在最后的排版中出现了重复，这里我修正了)\n\
  \n抱歉，上面的输出出现了格式错误。以下是为您修正后的最终：\n\n[content]\n## 6 红冠鸻\n*Charadrius ruficapillus*\
  \ 14–16cm\n野外札记：单独出现、成对或成小群出现。活跃且亲人。曾被认为是凤环鸻的一个亚种。鸣声：快速而尖锐的颤音；其他鸣声与凤环鸻相似。栖息地：沿海及近岸的沙质和贝壳滩、咸水和盐水泥滩及沙滩。分布：小巽他尔群岛的偶然冬客，可能也出现在爪哇爪岛。\n\
  \n## 7 马来鸻\n*Charadrius peronii* 14–16cm\n野外札记：通常成对或小群出现。飞行时，上翅显示出明显的白色翼斑，尤其在级飞羽基部。鸣声：柔和的\
  \ `whit` 或 `twik`。栖息地：未受干扰的沙滩、珊瑚滩和贝壳滩，以及邻近的泥滩。分布：在苏门答腊、巴厘岛、婆罗洲、菲律宾、苏拉威西和小巽他尔群岛留留。\n\
  \n## 8 爪哇鸻\n*Charadrius javanicus* 15cm\n野外札记：曾被认为是凤环鸻的一个亚种；行为和习性认为相似。鸣声：柔和、上升的\
  \ `kweek kweek`。栖息地：沿海低地。分布：在爪哇岛、巴厘岛和小巽他尔群岛的巽望岛留留。\n\n## 9 小沙鸻\n*Charadrius mongolus*\
  \ 19–21cm\n野外札记：群居性，常成大群，也与其他鸻混群。飞行时，上翅显示白色翼斑。`C. m. atrifrons` (9b) 出于苏门答腊。鸣声：短促的\
  \ `drrit` 和尖锐的 `chitik` 或 `chiktik`。栖息地：主要是沿海泥滩和沙滩。分布：整个地区的冬客或候鸟。\n\n## 10 东方鸻\n\
  *Charadrius veredus* 22–25cm\n野外札记：单独或成小群出现；飞行强健有力，常伴有不规则的转向。鸣声：颤鸣和短促的哨声 `klink`；飞行时，发出尖锐的口哨声\
  \ `chip-chip-chip`。栖息地：干旱草原、湿地附近的干旱区域以及沿海泥滩和沙滩。分布：整个地区的冬客或候鸟。\n\n## 11 大沙鸻\n*Charadrius\
  \ leschenaultii* 22–25cm\n野外札记：群居性。飞行时，上翅显示明显的白色翼斑。鸣声：柔和的 `trrri`，还有悦耳的 `pipruirr`。栖息地：主要是沿海湿地。分布：整个地区的冬客或候鸟。\n\
  \n![image](img/page149.jpg)\n\n# 68 木嘴鹬；游隼类\n\n## 1 木嘴鹬（欧亚木嘴鹬）\n*Scolopax rusticola*\
  \ 33–35cm\n野外札记：通常在受惊起飞时遇到，随后它在树林间之字形飞行然后消失在视野中。鸣声：通常安静，但可能发出 `schaap` 或 `schaap\
  \ schaap`。栖息地：有觅食湿地的森林和种植园。分布：婆罗洲的游离，可能出现在菲律宾。\n\n## 2 爪哇木嘴鹬（暗木嘴鹬）\n*Scolopax saturata*\
  \ 30cm\n野外札记：夜行性。黎晨或黄昏时进行晨鸣展示飞行，通常在森林空地上。鸣声：鼻音的 `queet` 和快速、尖叫的 `quo-quo-quo-quo`，两者都在展示飞行期间发出，后者在栖息时也会发出。栖息地：潮湿的山地森林，具有中等至密的植被。分布：在苏门答腊和爪哇留留。\n\
  \n## 3 苏拉威西木嘴鹬\n*Scolopax celebensis* 30–35cm\n野外札记：躲避危险，据报道黄昏时在树冠上方进行短途飞行；几乎没有其他记录信息。鸣声：未记录。栖息地：茂密的山地森林，特别是林冠下方有开阔地的地方；也在竹林中。分布：苏拉威西特有。\n\
  \n## 4 摩马鹿加木嘴鹬（奥比木嘴鹬）\n*Scolopax rochussenii* 32–40cm\n野外札记：行踪诡秘；在黄昏晨鸣展示飞行时最好看到，此时它扇浅拍翅膀在树冠、水道或沼泽上方进行环绕或线性飞行。鸣声：展示飞行期间发出爆发性的颤音。栖息地：低地、山地和轻微干扰的森林，靠近河流或溪流。分布：北马鹿加群岛奥比岛和巴干岛特有。\n\
  \n## 5 布基德农木嘴鹬\n*Scolopax bukidnonensis* 33cm\n野外札记：通常独居且夜行性。黎晨或黄昏时在森林空地上进行宽大的椭圆形展示飞行。鸣声：展示飞行期间，发出金属感的、断续的咔哒声\
  \ `pip-pip-pip-pip-pip`，鸣声之间有低吼声 `gro-a gro-a`。栖息地：中海拔和山地森林，尤其是苔藓森林。分布：菲律宾特有。\n\n\
  ## 6 斯温氏鹬（中国鹬）\n*Gallinago megala* 27–29cm\n野外札记：休息时，初级羽伸过三级羽。飞行时，脚趾略微超过尾部，翅下有均匀的条纹。鸣声：受惊时偶尔发出粗鲁的\
  \ `scaap`。栖息地：沼泽、水浸草地。\n\n## 7 尖尾鹬（针状尾鹬）\n*Gallinago stenura* 25–27cm\n野外札记：休息时，三级羽重叠尾部。飞行时，脚趾略微超过尾部，尾部看起来短。鸣声：受惊时发出低音的\
  \ `scaap`。栖息地：沼泽、稻草地。分布：小巽他尔群岛冬客。\n\n## 8 游鹬（普通鹬）\n*Gallinago gallinago* 25–27cm\n\
  野外札记：通常靠近掩护物。受惊时以快速、之字形、高飞的方式。飞行时，次羽显示白色边缘。鸣声：受惊时发出粗糙的 `scaap`。栖息地：各种湿地、沼泽地和沼泽。分布：婆罗洲冬客。\n\
  \n## 9 鹬\n*Lymnocryptes minimus* 17–19cm\n野外札记：谨慎，倾向于在踩到时等待；以不规则的动作离开。鸣声：干扰时可能发出微弱的\
  \ `gah`。栖息地：沼泽、水浸陆和草地区域。分布：菲律宾和婆罗洲冬客。\n\n# 69 沙鹬；鹬鹬；岩鹬\n\n## 1 长嘴沙鹬\n*Limnodus scolopaceus*\
  \ 27–30cm\n野外札记：通常群居，成小群出现。飞行时，背部显示一个白色椭圆斑，飞行羽边缘为白色，尾部有明显的黑白条纹。鸣声：尖锐的 `kik` 或 `kik`，通常重复。栖息地：各种湿地，包括内陆和沿岸。分布：巴厘岛和婆罗洲游离。\n\
  \n## 2 亚洲沙鹬（亚洲鹬或长嘴沙鹬）\n*Limnodus semipalatus* 33–36cm\n野外札记：经常与鹬类在一起。飞行时，背部显示白色，带灰色条纹和斑纹；尾部为白色带灰色条纹。鸣声：尖叫的\
  \ `chep-chep` 或 `chowp`，还有柔和的类人的 `kiawow`。栖息地：沿海湿地。分布：苏门答腊、爪哇和婆罗洲冬客；菲律宾候鸟；苏拉威西和小巽他尔群岛游离。\n\
  \n## 3 黑尾鹬\n*Limosa limosa* 40–44cm\n野外札记：群居性，常与黑尾沙和其他涉水鸟在一起。飞行时，上翅显示明显的白色翼斑，白色臀部和黑色尾部。鸣声：`kek`、`tuk`\
  \ 或 `kip`，通常重复。栖息地：泥滩、沿海池塘、沼泽和湖岸。分布：整个地区的冬客或候鸟。\n\n## 4 黑尾鹬\n*Limosa lapponica*\
  \ 37–41cm\n野外札记：群居性，常与黑尾鹬和其他涉水鸟在一起。飞行时，显示从臀部到背中部的白色；尾部黑白条纹。鸣声：吠叫的 `kak-kak` 和 `kirric`\
  \ 或类似。栖息地：河口、泥质或沙质岸以及沿海池塘。分布：整个地区的冬客。\n\n\n\n\n### 5 小大嘴鹬（小\U0001FAFB）\n*Numenius\
  \ minutus* 29–32cm. 观鸟特征：通常成群出现。缺乏白色尾羽。飞行时，翅下覆羽为浅褐色并伴有黑色条纹。鸣声：飞行时，发出口哨般的`te-te-te`\
  \ 或较粗的`tchew-tchew-tchew`；受惊扰时，发出短促的`kweek-ek`。栖息地：短草地、裸露土地和淡水水边。分布：迁徙至爪哇、波罗洲、菲律宾和瓦莱腊地区。\n\
  \n### 6 潮嘴鹬\n*Numenius phaeopus* 40–46cm. 观鸟特征：通常发现于小群中。模式型在飞行时显示白色尾羽；`N`.`p`.`variegatus`（未画）具有白色尾羽，带有深浅不一的深褐色条纹，有时与背部其他部分的对比不明显。两个种族均广泛分布，后者更为常见。鸣声：咯咯的、平调的`tetti-tetti-tetti-tet`、`bibibibibibibi`\
  \ 或类似的声音。栖息地：海岸湿地及附近的草地、沼泽、红树树林和沿大河流。分布：全地区的冬客。\n\n### 7 大嘴鹬（欧亚、西方或普通大嘴鹬）\n*Numenius\
  \ arquata* 50–60cm. 观鸟特征：通常成小群出现。飞行时，显示白色尾羽和下背部。雌鸟略大且喙较长。鸣声：传播较远的`cour-lee` 和低沉的`whaup`；受惊扰时，发出结结的`tutututu`\
  \ 或`tyuyuyuyu`。栖息地：泥滩、沙滩、湖岸、淹水草地和干旱草地。分布：冬客或迁徙至苏门腊、爪哇、巴厘、波罗洲、菲律宾、小巽他群岛和摩卢加群岛。\n\n\
  ### 8 刺刺大嘴鹬\n*Numenius tahitiensis* 40–44cm. 观鸟特征：通常单只、成对或成小群出现。飞行时，显示亮肉桂色的尾羽。鸣声：波纹般的`whe-whe-whe-whe`、响亮的`whee-wheeoo`\
  \ 和口哨般的`chi-u-it`。栖息地：海岸地区和远离岸岸的干旱地区。分布：菲律宾的偶然离奇鸟。\n\n### 9 东方大嘴鹬（远东或澳洲大嘴鹬）\n*Numenius\
  \ madagascariensis* 60–66cm. 观鸟特征：胆子较小；可能与大嘴鹬群群混。。注意飞行时没有白色尾羽。雌鸟更大且喙更长。鸣声：传播较远的`cour-lee`，音调比大嘴鹬更平；受惊扰时，发出尖锐的`ker-ker-ee-ker-ee`。栖息地：海岸泥滩、海滩和河口。分布：全地区的冬客或迁徙者。\n\
  \n![image](img/page153.jpg)\n\n## 70 鹬类\n\n#### 1 灰尾沙鹬（波利尼西亚、西伯利亚或灰背沙鹬、灰背鹬类）\n*Tringa\
  \ brevipes* 24–27cm. 观鸟特征：通常单只或散乱成群。行走时尾部抖动。飞行时，石灰色的翅下羽与白色腹部形成对比。鸣声：飞行时，发出上扬的`tu-whip`；受惊扰时，发出\
  \ `klee`、`klee-klee` 或`weet-weet`。栖息地：潮间泥滩、海滩、岩石岸、礁石以及偶尔出现在内陆湖泊。分布：前往爪哇、巴厘、波罗洲和瓦莱腊的冬客。\n\
  \n#### 2 斑足赤鹬（褐足赤鹬）\n*Tringa erythropus* 29–32cm. 观鸟特征：换羽鸟的非繁殖羽毛带有黑色斑点。飞行时，背部中心显示白色椭圆形。经常没过腹部行走。鸣声：飞行时，发出独特的`chu-it`；受惊扰时，发出短促的`chip`。栖息地：河口上游、海岸潟湖、沼泽。在苏门腊罕见。\n\
  \n#### 3 绿足鹬（普通或大绿足）\n*Tringa nebularia* 30–35cm. 观鸟特征：通常单只可见，但有时在栖息地成大群。飞行时，显示白色尾羽和背部；脚略长于尾部。鸣声：响亮的`chew-chew-chew`；受惊扰时，发出`kiu-kiu`。栖息地：各种海岸和内陆湿地。分布至苏门腊。\n\
  \n#### 4 赤鹬（普通赤鹬）\n*Tringa totanus* 27–29cm. 观鸟特征：警觉性高；稍有骚扰便会大声飞起，通常是涉水鸟群中第一个起飞的。飞行时，显示白色椭圆形背部，以及醒目的二级飞羽和内初羽。鸣声：哨一般的`teu-hu\
  \ teu-hu` 或类似声；受惊扰时，发出响亮的`tli-tli-tli`。栖息地：各种海岸和内陆水域。分布：全地区的冬客。\n\n#### 5 斑绿足鹬（诺德曼绿足鹬）\n\
  *Tringa guttifer* 30–35cm. 观鸟特征：警觉。飞行时，显示白色尾羽和浅灰色尾部；腿不伸出。鸣声：尖锐的`keyew` 和粗哑的`gwark`。栖息地：海岸湿地。分布：迁徙至苏门腊、波罗洲。\n\
  \n#### 6 **黄脚鹬**\n*Tringa flavipes* 23–25cm. 观鸟特征：活跃的觅食者，飞行时显示正方形尾部；脚部长出尾部。鸣声：平平调的`tew-tew`。栖息地：主要是海岸湿地。分布：苏门腊的冬客。\n\
  \n#### 7 **普通沙鹬**\n*Tringa ochropus* 21–24cm. 观鸟特征：通常单只可见。警觉，容易受惊。飞行时，显示白色尾羽和尾部的黑白横纹。鸣声：音乐般的`liet-liet`；受惊扰时，发出尖锐的`wit-wit`。栖息地：湖泊、池塘和河流。分布：苏门腊的冬客。\n\
  \n#### 8 **游滨鹬**\n*Tringa stagnatilis* 22–25cm. 观鸟特征：通常单只或散群出现。飞行时看起来像小绿足鹬，但脚部长出尾部。鸣声：哀伤的`keeuw`\
  \ 或`kyu-kyu`；惊起时发出响亮的`yip`。栖息地：沼泽、湖泊。分布：苏门腊、爪哇、巴厘、波罗洲、菲律宾和瓦莱腊。\n\n#### 9 **林鹬**\n\
  *Tringa glareola* 19–21cm. 观鸟特征：通常成群发现。飞行时，显示白色尾羽和带有窄黑纹的尾巴。鸣声：高频的`chiff-iff-iff`；受惊扰时，发出`chip`\
  \ 或`chip-chip-chip`。栖息地：湖泊、池塘和沼泽。分布：全地区的冬客。\n\n![image](img/page155.jpg)\n\n## 71\
  \ 鹬类；鸻类\n\n#### 1 大滨（大滨或东方滨、大沙鹬）\n*Calidris tenuirostris* 26–28cm. 观鸟特征：通常成群，常与其他涉水鸟混群。飞行时，翅上显示窄白色带；尾羽为白色，稀疏深斑，看起来是白色；尾巴深灰色。鸣声：低沉的`nyut-nyut`，还有粗哑的`chuker-chuker-chuker`\
  \ 和柔和的`prrt`。栖息地：主要是沙质或泥质海岸。分布：全地区的稀有迁徙者或冬客。\n\n#### 2 滨（滨或小滨）\n*Calidris canutus*\
  \ 23–25cm. 观鸟特征：通常成小群。飞行时，翅上显示窄白色带；尾羽为白色，带有纤细的黑色横纹，看起来是灰色。鸣声：柔和、鼻音的`knut`、`wutt`\
  \ 或`whet`；受惊时发出`kikkiik`。栖息地：沙质或泥质海岸。分布：迁徙至苏门腊、爪哇、波罗洲、菲律宾和瓦莱腊。\n\n#### 3 白鸻\n*Calidris\
  \ alba* 20–21cm. 观鸟特征：通常成小群在水边觅食。典型是快速奔跑，间插着快速低头觅食。非繁殖羽下，翅上显示深色前缘和宽白色翅带。鸣声：飞行时，发出`twick`\
  \ 或 `kip`，通常重复并形成快速的颤音。栖息地：沙质或泥质海岸。分布：全地区的迁徙者和冬客。\n\n#### 4 小比例鸻\n*Calidris minuta*\
  \ 12–14cm. 观鸟特征：具有快速的“环绕跑步”觅食动作，与更常见的红颈鸻相似。幼鸟时期，背部显示出明显的浅色“肩纹”。鸣声：短促的`stit-tit`。栖息地：淡水和咸水湿地。分布：波罗洲和菲律宾的离奇鸟。\n\
  \n\n\n\n\n# 5 红颈��� (红颈沙鹬���)\n*Calidris ruficollis* 13–16cm 野外记录：以连续啄食和“跑来跑去”的动作觅食。非繁殖期和幼鸟与小足���非常相似，尽管臀部看起来更细长，喙稍钝且更短。声音：粗糙的\
  \ `chit`、`kreep`、`creek` 或 `chritt`。栖息地：咸水和淡水湿地。分布：整个地区的越冬鸟。\n\n# 6 密氏纹沙鹬���\n*Calidris\
  \ temminckii* 13–15cm 野外记录：觅食动作缓慢而审慎，通常在水边植丛中进行。受惊时，以高高的、迂折的飞行逃离。休息时，侧面白色的尾部伸出翅尖之外。腿呈绿黄色。声音：快速的\
  \ `tiririririr` 或颤音般的 `trirr`。栖息地：沼泽、湖泊和池塘边缘、稻田、盐田和河口。分布：婆罗尼的越冬鸟；菲律宾的离岸鸟。\n\n# 7\
  \ 长趾����\n*Calidris subminuta* 13–16cm 野外记录：经常在水边植丛中觅食。受惊时，通常直立并伸长脖子；如果被惊扰，则以无力、扇动的翅膀频率进行高空飞行逃离。幼鸟背部有明显的白色“肩带”。声音：柔和的\
  \ `prrt`、`chrrup` 或 `chulip`，以及尖锐的 `tik-tik-tik`。栖息地：沼泽、湖和池塘边缘以及河口。分布：该地区的越冬鸟。\n\
  \n# 8 尖尾沙鹬���\n*Calidris acuminata* 17–21cm 野外记录：通常以小群形式出现，经常与其他涉水鸟混在一起。声音：柔和的 `wheep`、`pleep`\
  \ 或 `trrt`，还有啾啾的 `prrt-wheep wheep`。栖息地：淡水和沿海湿地。分布：整个地区的迁徙鸟。\n\n# 9 黑沙��� (红背沙鹬���)\n\
  *Calidris alpina* 16–17cm 野外记录：行走速度快，间杂着短跑，剧烈地探测和啄食。飞行时，显示白色翼斑，臀部和上尾覆羽侧面为白色。声音：沙哑的\
  \ `kreeeep` 和低低的 `beep`。栖息地：沿海泥滩、海滨、沼泽、湖边和岸边。分布：菲律宾的离岸鸟，可能还出现在爪哇、婆罗尼和瓦拉腊群岛。\n\n\
  # 10 斑腹������\n*Calidris ferruginea* 18–23cm 野外记录：经常涉水，在浅水处常没过腹部。飞行时，上翅显示一条白色翼斑，下臀部和上尾覆羽为白色。声音：波纹般的\
  \ `chirrup`。栖息地：沿海泥滩、潟湖、盐沼和河口；内陆湿地较少见。分布：整个地区的越冬鸟和迁徙鸟。\n\n![image](img/page157.jpg)\n\
  \n## 72 沙鹬；凤卵���；����；������\n\n# 1 宽嘴������\n*Calidris falcinellus* 16–18cm 野外记录：经常在沙鹬���群中觅食。在非繁殖羽色下，上翅显示深色的小级覆羽和前缘，以及一条白色翼斑。声音：嗡嗡声的\
  \ `chrrreet` 或 `trreet`。栖息地：沿海溪流、潟湖和泥滩。分布：该地区的迁徙鸟或越冬鸟。\n\n# 2 凤沙���\n*Calidris pugnax*\
  \ 26–32cm 野外记录：换羽的鸟具有非繁殖型的羽色，胸部散布着深色斑点。鲜艳的繁殖羽色在越冬区很少见。雌性被称为 Reeves（白沙鸡）。声音：通常保持沉默；迁徙群可能会发出尖锐的\
  \ `hoo-ee`。栖息地：湖泊、池塘和河流边缘、沼泽、湿草地和沿海泥滩。分布：该地区的越冬鸟或迁徙鸟，随处并不常见。\n\n# 3 亚斑沙����\n*Xenus\
  \ cinereus* 22–25cm 野外记录：通常单只或以小而零散的群落出现。通常以活跃、敏捷的方式觅食。飞行时，上翅显示宽的白色后缘。声音：飞行时，发出波纹般的\
  \ `du-du-du-du-du` 或柔和的 `chu-du-du`。栖息地：主要是沿海湿地。分布：该地区的迁徙鸟和越冬鸟。\n\n# 4 普通沙鹬������\n\
  *Actitis hypoleucos* 19–21cm 野外记录：行走时尾部上下抖动。飞行时通常高度较低，翅膀动作僵硬且快速扇动。上翅显示一条白纹。声音：飞行时发出哨声般的\
  \ `tswee-wee-w`；受惊时发出 `sweet-eet`。栖息地：各种淡水和咸水湿地。分布：该地区的越冬鸟。\n\n# 5 ������� (褐�����)\n\
  *Arenaria interpres* 21–26cm 野外记录：通常通过翻动小石头、贝壳或海藻来寻找小型无脊椎动物。飞行时，显示醒目的黑白花纹。声音：快速、断续的\
  \ `trik-tuk-tuk-tuk`、`tuk-e-tuk` 或 `chit-uk`；受惊时发出尖锐的 `chick-ik`、`kuu`。\n\n# 6 红颈������\
  \ (北极������)\n*Phalaropus lobatus* 18–19cm 野外记录：主要在水游觅食，通常成小群。飞行时，上翅显示一条白色翼斑。声音：飞行时发出短促的\
  \ `twick`、`clip` 或 `ch`。（此处此处）栖息地：海域，有时出现在内陆。分布：该地区的迁徙鸟。\n\n# 7 灰������ (红������)\n\
  *Phalaropus fulicarius* 21–22cm 野外记录：主要在水游觅食。喙短。飞行时显示一条白色翼斑。声音：飞行时发出尖锐的 `pic`。栖息地：通常为海洋性，有时出现在内陆。分布：婆罗尼的离岸鸟。\n\
  \n# 8 漆斑������ (大斑���)\n*Rostratula benghensis* 23–28cm 野外记录：主要是晨昏性或夜行性，白天在阴凉处休息。通常单只、成对或成小群出现。声音：沙哑的鸣叫\
  \ `wee-loo`；受惊时发出微弱的 `quip`、`peep` 或上升的 `quip-ip-ip`。栖息地：沼泽、湿泽。分布：苏门答腊、婆罗尼。\n\n\
  # 9 澳洲沙���\n*Stiltia isabella* 24cm 野外记录：通常单只或小群出现。在地面觅食或在空中捕昆虫。飞行时，显示异常长的翅膀、白色臀部和短方形尾。翅下为黑色。声音：尖锐的\
  \ `hoo-wee-too` 或 `hoo-wee`。栖息地：开阔草地。\n\n# 10 东方沙���\n*Glareola maldivarum* 23–26cm\
  \ 野外记录：通常群居。飞行时，显示白色条纹臀部和分叉尾。翅下为栗褐色。声音：尖锐的 `kyik`、`chik-chik` 或 `chet`，还有上升的 `trooeet`\
  \ 和 `ter-ack`。栖息地：裸露平地、干涸稻田、沼泽、湖岸和河岸。分布：婆罗尼和菲律宾的留鸟；其他地区的迁徙鸟。\n\n![image](img/page159.jpg)\n\
  \n## 73 ������；���；���；����\n\n# 1 滨海������ (滨海石����)\n*Esacus magnirostris* 53–57cm\
  \ 野外记录：主要是晨昏性或夜行性，白天在阴凉处休息。通常单只、成对或成小群出现。声音：沙哑的鸣叫 `wee-loo`；受惊时发出微弱的 `quip`、`peep`\
  \ 或上升的 `quip-ip-ip`。栖息地：沿海海岸，通常在红树林附近。分布：整个地区的留鸟。\n\n# 2 ������� (欧亚������)\n*Haematopus\
  \ ostralegus* 40–46cm 野外记录：通常以小群出现。飞行时，上翅所有飞羽上显示一条宽白斑，臀部和上尾覆羽为白色，尾部主要为黑色。声音：尖锐的\
  \ `kleep` 或 `kle-eap`，以及低低的 `weep`。栖息地：泥滩和岩石海岸；也会在内陆的短草区觅食。分布：婆罗尼和离岸岛的离岸鸟。\n\n\n\
  \n\n\n### 3 斑脚嘴��\n*Haematopus longirostris* 42–50cm\n野外记录：单独、成对或成小群出现。外形显眼且嘈嘈，但很警觉。飞行时，显示出黑色级羽和主要是白色的次羽、白色尾部和上尾覆，以及尾巴主要为黑色。鸣声：短促的\
  \ `kleep` 声。栖息地：偏好偏远的沙滩和泥涂滩。分布：留居在南摩鹿娄加群岛和东小巽达群岛。\n\n### 4 黑翅脚��\n*Himantopus himantopus*\
  \ 35–40cm\n野外记录：通常成小群出现。幼鸟的冠部和后颈花纹从白色到石板灰色不等。鸣声：尖锐的 `kek`、高音的 `kikikikik` 和尖叫般的\
  \ `kee-ack`。栖息地：各种湿地，包括盐沼、盐池、湖泊和沼泽。分布：迁徙至北婆罗洲和菲律宾中部。\n\n### 5 斑足脚��（黑颈脚��）\n*Himantopus\
  \ leucocephalus* 35–40cm\n野外记录：通常被视为黑翅脚��的一个种；行为和习性相似。鸣声：与黑翅脚��相似，但更柔和且鼻音。栖息地：与黑翅脚��相似。分布：留居在爪哇、巴厘岛、菲律宾和华莱腊地区；迁徙至苏门答腊和婆罗洲；曾在婆罗洲繁殖过。\n\
  \n### 6 凤嘴��（斑凤嘴��）\n*Recurvirostra avosetta* 42–45cm\n野外记录：通常群群性。善于游泳，能像水鸭一样倒头浮水觅食。鸣声：悦耳的\
  \ `kluit-kluit-kluit`；受惊时，发出粗厉的 `kloo-eet`。栖息地：主要是浅水盐湖或半咸水湖、潟湖、盐池和河口。分布：婆罗洲和菲律宾西部巴拉湾岛的游候鸟。\n\
  \n### 7 铜翅凤脚�\n*Metopidius indicus* 28–31cm\n野外记录：通过在浮植物上行走或在浅水中涉水觅食。幼鸟上部为褐色，下部为白色，颈部和胸部有粉色晕，栗色冠部和白色白色眉纹。鸣声：粗鲁的咕噜声；受惊时，发出嘶哑、短促的\
  \ `seek-seek-seek`。栖息地：具有浮植物和出生植物的湖泊和池塘。分布：留居在苏门答腊和爪哇。\n\n### 8 梳冠凤脚�\n*Irediparra\
  \ gallinacea* 23cm\n野外记录：通常单独或成对出现。在浮植物上行走自容。幼鸟与成鸟相似，但缺少胸部的黑色条纹和头部肉垂。鸣声：飞行时发出细细的啾叫声，以及鼻性的报警声。栖息地：具有丰富浮植物和出生植物的淡水湖、池塘和沼泽。分布：留居在婆罗洲东部和菲律宾南部民兰老岛，并在华莱腊地区广泛分布但呈斑状。\n\
  \n### 9 凤尾凤脚�（水秧�）\n*Hydrophasianus chirurgus* 31–58cm\n野外记录：通常群群性。通过在浮植物上行走，以及在浅水中游泳或涉水觅食。飞行时，显示出明显的白色翅膀。鸣声：传远的鸣叫声\
  \ `me-e-ou` 或 `me-onp`；群鸟发出鼻性的 `tewn` 声。栖息地：植被良好的湖泊、池塘和沼泽；迁徙期间也经常出现在河流和红树林。分布：留居在菲律宾；苏门答腊和爪哇的冬客；巴厘岛和婆罗洲的游候鸟，可能还有华莱腊地区。\n\
  \n![image](img/page161.jpg)\n\n## 74 贼鸥；鸥类\n\n### 1 极地贼鸥（寄生水�）\n*Stercorarius parasiticus*\
  \ 41–46cm\n野外记录：技巧性地追逐并骚扰海鸟，试图让它们吐出食物。飞行时，级羽基部显示白色闪光。鸣声：通常保持沉默。栖息地：远洋。分布：可能是该地区海域的常规冬客。\n\
  \n### 2 贼角贼鸥（黑背水��）\n*Stercorarius pomarinus* 46–51cm\n野外记录：“较小”贼鸥中体型最大的。海鸟的攻击性追踪者，为了偷取食物，甚至杀死追逐的对象。飞行时，级羽基部显示白色闪光。鸣声：通常保持沉默。栖息地：沿岸海域。分布：迁徙至该地区海域。\n\
  \n### 3 南极贼鸥（棕贼鸥或麦科马克贼鸥）\n*Stercorarius antarcticus* 61–66cm\n野外记录：飞行时，级羽基部显示白色闪光。存在多种变型，颜色从浅到深不等。鸣声：通常保持沉默。栖息地：远洋。分布：该地区海域的冬季游候鸟。\n\
  \n### 4 长尾贼鸥（长尾水鹱）\n*Stercorarius longicaudus* 48–53cm\n野外记录：飞行时，级羽基部没有或极少白色。比其他贼鸥不那么疯狂；在进行骚扰时，倾向于攻击海鸥。鸣声：通常保持沉默。栖息地：沿岸海域。分布：爪哇、巴厘岛、婆罗洲和小巽达群岛外海域的冬季迁徙或游候鸟。\n\
  \n### 5 黑尾鸥\n*Larus fuscus* 44–47cm\n野外记录：飞行时，上翅显示为灰色，边缘为白色，下翼显示颜色较深的外级羽。鸣声：哀伤的鸣叫声。栖息地：远洋。分布：婆罗洲的游候鸟。\n\
  \n### 6 灰背鸥\n*Larus schistaceus* 55–67cm\n野外记录：飞行时，上翅外级羽边缘为白色，级羽尖端为黑色。鸣声：低沉的 `klook-klook`\
  \ 声。栖息地：沿岸地区。分布：菲律宾的游候鸟。\n\n### 7 维加鸥\n*Larus vegae* 57–64cm\n野外记录：飞行时，上翅外级羽尖端为黑色，外级羽上有白色斑点。鸣声：大笑般的\
  \ `keeah-keeah-keah-kau-kau` 和嘈杂的 `kreeak`。栖息地：沿岸。\n\n### 8 弗兰克林鸥\n*Leucophaeus\
  \ pipix* 32–38cm\n野外记录：飞行时，尾部为灰色，上翅边缘为白色，外级羽尖端较宽。鸣声：柔和的 `kruk` 声和尖锐的 `guk`。栖息地：潟湖、沙洲、湖泊。分布：菲律宾的游候鸟。\n\
  \n### 9 棕头鸥\n*Chrocephalus brunnicus* 41–45cm\n野外记录：上翅外级羽为白色带有宽黑色尖端，外级羽上有末端斑点。鸣声：粗鲁的\
  \ `gek` 或 `grarhh`，哀鸣的 `ko-yek-ko-yek` 和嘈杂的 `kreeak`。栖息地：沿岸海域、湖泊和大河。\n\n### 10 桑德斯鸥\n\
  *Chrocephalus saundersi* 29–32cm\n野外记录：动作轻盈，飞行像海鸥。内级羽形成黑色楔形，是下翼的特征；上翅灰色，白色级羽带黑色。鸣声：尖锐的\
  \ `eek eek`。栖息地：沿岸地区。分布：菲律宾的游候鸟。\n\n### 11 黑头鸥\n*Chrocephalus ridundus* 37–43cm\n\
  野外记录：飞行时，上翅为浅灰色，外级羽为白色带黑。鸣声：高音的 `karr` 或 `krreearr`，以及尖锐的 `kek-kek`。栖息地：沿岸、湖泊、河流以及各种内陆草地。分布：婆罗洲、菲律宾、苏拉腊岛和北摩鹿娄加群岛的冬客。\n\
  \n### 12 沙宾鸥\n*Xema sabini* 27–33cm\n野外记录：独特的三色上翅图案：灰色覆羽、黑色外级羽和覆羽，以及白色内级羽和次羽。尾部叉形。鸣声：刺耳的\
  \ `krrr`。栖息地：主要是远洋。分布：苏门答腊海岸的游候鸟。\n\n![image](img/page163.jpg)\n\n## 75 燕鸥\n\n###\
  \ 1 亚海鸥\n*Hydroprogne caspia* 47–54cm\n野外记录：主要通过悬停后俯冲捕鱼，也会从水面啄取食物；有时会骚扰其他燕鸥和鸥类获取食物。飞行时，上翅外级羽为灰色且尖端较深，下翼显示深色外级羽；尾部浅叉形。鸣声：大声而沙哑的\
  \ `kraah`、`krah-krah` 或 `kree-ahk`。栖息地：沿海域、泥涂滩、内陆湖泊、河流和沼泽。分布：苏门答腊、婆罗洲、菲律宾的吕宋岛以及小巽达群岛的帝汶岛的游候鸟。\n\
  \n\n\n\n\n## 2 白腹燕鸥\n*Gelochelidon nilotica* 33–43cm\n野外记录：通过空中捕食昆虫或俯冲从水面或地面取食食物。飞行姿态像海鸥。\n\
  鸣声：鼻性的 `kay-did`、`kay-tih-did`、`gur-WICK`、`ger-erk` 或 `kay-vek`；受惊时发出金属般的 `kak-kak`\
  \ 和 `kvay-kvay` 声。\n栖息地：海岸、盐碱沼、咸水和淡水湖泊、池塘和河流。\n分布：该地区的冬季候客。\n\n## 3 小燕鸥\n*Sternula\
  \ albifrons* 22–28cm\n野外记录：非常活跃的觅食者，通过俯冲捕食食物，俯冲前会有长时间的悬停。尾部深叉。\n鸣声：快速的 `kirrikikki\
  \ kirrikiki`、尖锐的 `kik-kik` 和沙哑的 `zr-e-e-e-p`。\n栖息地：海岸、湖泊和河流上的沙洲和碎石滩。\n分布：苏门答腊、爪哇、婆罗洲、菲律宾和苏的腊岛留鸟；其他地区为冬季候客。\n\
  \n## 4 长燕\n*Thalasseus bengalensis* 36–41cm\n野外记录：主要通过悬停后俯冲捕食。上翅外初飞羽的内缘膜形成一个不明显的银色楔形；下翅初飞羽末端呈暗褐色。臀部和尾部为浅灰色，尾部深叉。\n\
  鸣声：粗哑的 `krrik-krrik` 或 `kerrick`。\n栖息地：沿海水。\n分布：苏门答腊、爪哇、巴厘、婆罗洲和华拉腊的冬季候客。\n\n## 5\
  \ 中国白燕鸥\n*Thalasseus bernsteini* 42cm\n野外记录：上翅外初飞羽的外缘膜呈黑色；下翅为白色。尾部深叉，尾流羽比其他冠状燕鸥更长。\n\
  鸣声：粗哑、高亢的叫声。\n栖息地：沿海水。\n分布：婆罗洲、菲律宾和北摩卢卡群岛的稀有访客或漂鸟。\n\n## 6 大白燕（疾燕）\n*Thalasseus\
  \ bergii* 43–53cm\n野外记录：主要通过俯冲捕食，也会从水面啄取。下翅外初飞羽末端呈深灰色；臀部和尾部与上体同色；尾部深叉。\n鸣声：刺耳的 `krrik`\
  \ 或 `kee-rit`，还有高亢的 `kree-kree`。\n栖息地：沿海水。\n分布：该地区的留鸟和冬季候客；在苏门答腊、苏的腊、小松群岛和摩卢卡群外的岛屿繁殖。\n\
  \n## 7 黑颈燕\n*Sterna sumatrana* 34–35cm\n野外记录：主要通过俯冲捕食，也通过低飞掠水从水面啄取食物。最外初飞羽的外缘膜呈黑色；尾部深叉，有长外尾羽。\n\
  鸣声：尖锐的 `tsii-chee-chi-chip` 和兴奋或受惊时发出的 `chit-chit-chit-er`。\n栖息地：岩石岛、海岸海湾和潟湖。\n\
  分布：留鸟和冬季候客；在苏门答腊、爪哇、巴厘、婆罗洲和菲律宾外的岛屿，以及华拉腊繁殖。\n\n## 8 红腹燕\n*Sterna dougallii* 33–38cm\n\
  野外记录：主要通过俯冲捕食，通常比普通燕鸥的起点更高；也会从水面啄取食物。尾部深叉，有非常长的尾羽。\n鸣声：沙哑的 `kraak` 或 `raaach`，还有短促的\
  \ `cher-vik`。\n栖息地：离岸岛屿和沿海水。\n分布：苏门答腊、爪哇、菲律宾和摩卢卡群岛的留鸟。\n\n## 9 普通燕鸥\n*Sterna hirundo*\
  \ 32–39cm\n野外记录：主要通过俯冲捕食，也从水面啄取食物。从下方飞行时，内初飞羽呈半透明状。尾部深叉，尾羽长。`S.longipennis` 是该地区的常见亚种；苏门答腊和婆罗洲附近可能出现红嘴个体。\n\
  鸣声：快速的 `kye-kye-kirri-kirri`；受惊时发出尖锐的 `kree-ear` 或 `reree-eer` 和尖锐的 `kik`。\n栖息地：海岸和内陆大型水域。\n\
  分布：该地区的冬季候客。\n\n![image](img/page165.jpg)\n\n## 灰背燕（眼镜燕鸥）\n*Onychoprion lunatus*\
  \ 38cm\n野外记录：主要通过俯冲捕食。下翅初飞羽和次飞羽呈灰褐色。尾为灰色，边缘白色且深叉，有长尾羽。\n鸣声：高亢的尖叫声，比烟燕不粗犷。\n栖息地：离岸和远洋海域。\n\
  分布：摩卢卡群岛的稀有访客。\n\n## 阿留申燕\n*Onychoprion aleuticus* 32–34cm\n野外记录：通过俯冲从水面获取食物。下翅为白色，次飞羽边缘有深色缘，外初飞羽呈暗褐色；臀部和尾部为白色，后者深叉。\n\
  鸣声：柔和的类似水鸟的 `twee-ee-ee`。\n栖息地：海岸和远洋海域。\n分布：婆罗洲的漂鸟。\n\n## 眉纹燕\n*Onychoprion anaetus*\
  \ 34–36cm\n野外记录：飞行歇性极强。下翅为白色，次飞羽边缘有深色缘，外初飞羽呈暗褐色；臀部和尾部为白色，后者深叉。主要通过俯冲捕食，和俯冲从水面啄取食物。\n\
  鸣声：一种叫声。\n栖息地：沿海域；在苏门答腊外的小岛屿栖息。\n\n## 烟燕（宽嘴燕鸥）\n*Onychoprion fuscatus* 36–45cm\n\
  野外记录：主要通过俯冲从水面啄取食物。下翅为白色，初飞羽末端呈暗色，次飞羽亦然。臀部和尾部呈黑色，后者深叉，有长尾羽。\n鸣声：独特的 `wacki-wah`\
  \ 或 `wide-wack`；也会发出短促的 `kraark`。\n栖息地：主要在远洋，繁殖季节很少上陆。\n分布：该地区的留鸟。\n\n## 白燕（黑翼燕）\n\
  *Chlidonias leucopterus* 23–27cm\n野外记录：觅食飞行歇性强，经常俯冲从水面啄取食物。下翅覆羽为黑色，臀部为白色，尾为浅灰色且浅叉；非繁殖羽下翅有黑色线条或斑块。\n\
  鸣声：粗哑的 `kreek`、沙哑的 `kesch re`。\n栖息地：植被覆盖的湖泊、沼泽、稻田、池塘和大河流。\n分布：该地区的冬季候客。\n\n## 须纹燕\n\
  *Chlidonias hybrida* 23–29cm\n野外记录：觅食飞行歇性强，经常俯冲从水面啄取食物；也可俯冲捕食。非繁殖羽臀部为灰色，尾部浅叉。\n\
  鸣声：沙哑的 `cherk` 或 `kek-kek`。\n栖息地：有植被的湖泊、沼泽、稻田、海岸池塘和泥涂滩。\n分布：该地区的冬季候客。\n\n## 白燕（仙燕鸥）\n\
  *Gygis alba* 25–30cm\n野外记录：俯冲捕获小鱼。尾分叉。幼鸟为白色，背部、颈部和耳部羽有灰褐色斑点，外初飞羽外缘为深灰色。\n鸣声：喉音的\
  \ `heech heech`。\n栖息地：远洋海域。\n分布：苏门答腊、西小松群岛和北摩卢卡群岛附近的漂鸟。\n\n## 棕燕鸥（普通燕鸥）\n*Anous\
  \ stolidus* 38–45cm\n野外记录：主要通过悬停和俯冲从水面取食食物。下翅覆羽比飞行羽略浅。尾部呈楔形，换羽期间可能看起来是叉的。\n鸣声：类似鸦叫的\
  \ `kwok-kwok`、`karruuk` 或 `krao`。\n栖息地：远洋；在小岛屿、岛、沙洲和礁石上繁殖。\n分布：该地区海域留鸟。在菲律宾附近的沙洲和礁石以及班达海孤立岛屿（特别是\
  \ Gunungapi 和 Manuk）繁殖。\n\n## 黑燕（白顶燕）\n*Anous minutus* 35–39cm\n野外记录：取食行为与棕燕鸥相似。下翅覆羽为褐色黑色与飞行羽相接。尾部呈楔形，换羽期间可能看起来是叉的。\n\
  鸣声：独特的 `tik-tikoree`。\n栖息地：离开繁殖地的远洋海域。\n分布：在苏门答腊东岸和苏禄海礁石繁殖；流于爪哇、巴厘、婆罗洲和华拉腊。\n\n\n\
  \n\n\n# 77 鹉；普通雕；蜜蜂雕；蝠鹰；秃鹫\n\n## 1 鹉\n*Pandion haliaetus* 55–63cm 野外笔记：以鱼为食；悬停，然后俯冲并用爪子从水面正下方捕获猎物。留居亚种\
  \ *P.* *h.* *cristatus*（图中未显示）体略小，脸部通常较白，尽管面部花纹多且通常无法与模式亚种区分；它有时被视为一个独立的物种。鸣声：警戒时，发出沙哑而尖锐的\
  \ *kew-kew-kew-kew*。栖息地：湖泊、河流、海岸潟湖和河口。分布：留居于爪哇腊、巴厘岛、苏拉腊岛、小巽群岛和马鹿群岛；在该地区越冬。\n\n##\
  \ 2 杰丹氏普通雕\n*Aviceda jerdoni* 41–48cm 野外笔记：害羞。晨昏性。在栖木上捕猎，进行短距离俯冲捕捕猎物，通常是昆虫、蜥蜴或蛙类。*A.\
  \ j. celebensis* (2b) 出于苏拉腊岛和苏拉群岛。鸣声：哀的 *pee-ow*；在展示时，发出兴奋的猫叫般的 *kip-kip-kip* 或\
  \ *kikiya kikiya*。栖息地：分布：留居于苏答腊、婆罗洲、菲律宾、苏拉腊岛和苏拉群岛。\n\n## 3 太平洋普通雕\n*Aviceda subcristata*\
  \ 35–46cm 野外笔记：通常单只或成对出现，有时成群。经常显眼地停在树顶。从叶丛中叼取昆虫和蜥蜴。*A. s. reinwardtii* (3b) 出于苏马鹿群岛的波亚岛、塞拉姆岛、安汶岛和哈鲁岛。鸣声：清脆高亢的\
  \ *whee-chu*，兴奋时经常重复且发得更快速。栖息地：原生森林和高大的次生低地及丘陵森林、森林边缘和林木稀疏的耕地。分布：留居于小巽群岛和马鹿群岛。\n\
  \n## 4 黑普通雕\n*Aviceda leuphotes* 30–35cm 野外笔记：飞行时像乌鸦，间杂着平翅滑翔。经常在叶丛前方或悬挂在叶丛上捕获猎物。鸣声：柔和、颤抖的尖叫或哨声\
  \ *tcheeoua*。栖息地：有空地和溪流的森林丘陵。分布：苏答腊冬客，罕见于爪哇。\n\n## 5 凤头雕（东方蜜雕）\n*Pernis ptilorhynchus*\
  \ 52–68cm 野外笔记：羽色变化很大，尤其是腹部。经常看到在森林上方盘旋，以深沉而稳定的翅击穿插滑翔。*P.* *p.* *philippensis* (5b)\
  \ 出于菲律宾。鸣声：高音的 *wee-wey-uho* 或 *weehey-weehey*，以及尖锐的哨声 *wheyeeee*。栖息地：森林低地和丘陵。分布：留居于菲律宾；留居于苏答腊、爪哇和婆罗洲并为其冬客；苏拉腊岛冬客。\n\
  \n## 6 斑纹蜜雕\n*Pernis celebensis* 50–58cm 野外笔记：通常单只、成对或偶尔成群出现；经常在森林、部分开垦的山脊和山谷上方高盘旋。鸣声：尖锐的\
  \ *whit-weee-oooo* 或 *weee-oooo*。栖息地：森林、森林边缘和部分开垦区。分布：苏拉腊岛特有。\n\n## 7 斯氏雕（菲律宾蜜雕）\n\
  *Pernis steيري* 51–57cm 野外笔记：隐秘，倾向于“躲”在茂密的叶丛中，尽管经常在森林上方高盘旋。曾被视为前一种物种的亚种。鸣声：大声尖叫或响亮的鸣声。栖息地：低地至亚山山区森林和森林边缘。分布：菲律宾特有。\n\
  \n## 8 蝠鹰\n*Macheiramphus alcinus* 41–51cm 野外笔记：晨昏性。在蝙蝠离开或返回洞穴时捕食它们。飞行速度快，翅击浅而僵硬。幼鸟下方呈白色，带有各种变化的黑色斑点。鸣声：高声、吠叫般的\
  \ *kwik-kwik-kwik-kwik*。栖息地：森林附近的开阔地、蝙蝠洞及人类居住区周围。分布：留居于苏答腊、婆罗洲和苏拉腊岛。\n\n## 9 白背秃鹫\n\
  *Gyps bengalensis* 75–85cm 野外笔记：从上方飞行时，成年鸟显示出明显的白色臀部。翅膀呈浅“V”型盘旋。鸣声：离开繁殖地时通常保持安静。栖息地：开阔乡村。分布：候鸟；婆罗洲西北有未确认的历史记录。由于数量急剧崩溃，近期在该地区不太可能看到？\n\
  \n```\n![image](img/page169.jpg)\n```\n\n# 78 鹰\n\n## 1 白腹海雕\n*Haliaeetus leucogaster*\
  \ 66–71cm 野外笔记：从水中抓鱼，偶尔也取食腐肉。幼鸟上方通常为棕色，下方为淡肉桂色；尾部白色带带黑色亚端带。鸣声：大声、号角般的 *kank kank\
  \ kank kank*。\n\n## 2 小雕\n*Haliaeetus humilis* 53–68cm 野外笔记：俯冲捕鱼。经常停在裸露枝上。鸣声：哀的、像海鸥。\n\
  \n## 3 灰头鹰\n*Haliaeetus ichthetus* 69–74cm 野外笔记：俯冲捕鱼。幼鸟头部和腹部颜色较浅。\n\n## 4 伯内利鹰\n\
  *Aquila fasciata* 65–72cm 野外笔记：成对出现。\n\n## 5 戈尔尼鹰\n*Aquila gurneyi* 74–85cm 野外笔记：通常单只出现。\n\
  \n## 6 跗足鹰\n*Hieraaetus pennatus* 50–57cm 野外笔记：面对面飞行时，显示白色的“大灯”。\n\n## 7 矮腹鹰\n*Hieraaetus\
  \ weiskei* 38–48cm 野外笔记：通常单只出现。\n\n## 8 栗腹鹰\n*Lophotchis kienerii* 53–61cm 野外笔记：在森林冠层上方高盘旋。\n\
  \n\n\n\n\n# 9 菲律宾雕\n*Pithecophaga jefferyi* 90–100cm\n野外记录：通常单只或成对出现。经常在森林上方盘旋，搜寻小型至中型动物。\n\
  鸣声：响亮而哀伤的哨声，*waaaauu waaaauu waaaauu* 或 *waa-leee-ahhh*。\n栖息地：森林、伐木森林和森林边缘，从低地到山地。\n\
  分布范围：菲律宾特有。\n\n# 10 黑头雕\n*Ictinaetus malaiensis* 69–81cm\n野外记录：经常看到在森林树冠上方低空滑翔，翅膀呈浅“V”字型，寻找鸟蛋和雏鸟。\n\
  鸣声：哀伤的*kleeee-kee* 或 *hee-lee-leeuw*。\n栖息地：低地、丘陵和山地森林。\n分布范围：栖息于苏答腊、爪爪哇、婆罗洲、苏拉威锡和中摩卢加群岛。\n\
  \n![image](img/page171.jpg)\n\n## 79 鸢类；鹰雕\n\n### 1 黑��鸢（黑翅鸢）\n*Elanus caeruleus*\
  \ 31–35cm\n野外记录：搜寻猎物时经常悬停。飞行时，上翅的覆羽上有一块大黑色斑块。\n鸣声：哀伤的*wheep wheep*。\n栖息地：散布树木的草原和耕地。\n\
  分布范围：栖息于苏答腊、婆罗洲、爪哇、巴厘岛、菲律宾、苏拉威锡和小巽群岛。\n\n### 2 红尾鸢\n*Milvus migrans* 55–60cm\n野外记录：群居食腐动物。飞行姿态松散，尾巴频繁扭动。`M.`\
  \ `m.`. `lineatus` (2b)（黑耳鸢）是婆罗洲和菲律宾西部的候鸟，通常被视为独立物种。\n鸣声：类似马嘶的*pee-errrr*。\n栖息地：开放区域、湿地和城市地区。\n\
  分布范围：栖息于苏拉威锡和小巽群岛；苏答腊的冬季访客；婆罗洲和菲律宾西部的候鸟。\n\n### 3 印度��鸢\n*Haliastur indus* 45–51cm\n\
  野外记录：通常单只或成对出现。食腐性，特别是在港口和垃圾场周围。\n鸣声：嘶嘶的尖叫声。\n栖息地：森林边缘、开阔地区、湖泊、河流、淹水稻田、海岸潟湖、河口和渔鱼港。\n\
  分布范围：遍布该地区。\n\n### 4 变色锦雕\n*Nisaetus cirrhatus* 58–77cm\n野外记录：经常利用隐蔽的森林栖息点对猎物进行短距离俯冲。深色变种与黑头雕（图\
  \ 78）相似，但体型更瘦，尾巴更长。`N. c. limnaeetus`（主图）分布于苏答腊、爪哇、婆罗洲、苏拉威锡和菲律宾；`N. c. vanheurni`\
  \ (4b)分布于苏答腊附近的西满留岛。\n鸣声：一系列尖锐的哨声。\n栖息地：低地森林。\n分布范围：栖息于苏答腊、爪哇、巴厘岛、婆罗洲以及菲律宾南部和西部。\n\
  \n### 5 弗罗斯雕\n*Nisaetus floris* 75–79cm\n野外记录：曾被认为是前一种物的亚种；假定行为相似。\n鸣声：未记录。\n栖息地：山地森林、低地雨林和附近的耕地。\n\
  分布范围：小巽群岛特有。\n\n### 6 斑腹雕\n*Nisaetus alboniger* 50–58cm\n野外记录：翅膀平齐在树冠上方盘旋；追逐猎物时，在林间敏捷地穿梭。幼鸟腹部和头部无斑，呈肉桂褐色，但头冠羽为黑色。\n\
  鸣声：各种尖锐的哨声。\n栖息地：高地森林。\n分布范围：栖息于苏答腊和婆罗洲。\n\n### 7 爪哇雕\n*Nisaetus bartelsi* 60cm\n\
  野外记录：假定行为与变色锦雕相似；捕食大型鸟、小型哺乳动物和蜥蜴。幼鸟腹部和头部无斑，呈淡褐色，深色冠羽除外。\n鸣声：粗犷、高频的叫声。\n栖息地：热带丘陵和山地森林，以及开阔林地。\n\
  分布范围：爪哇特有。\n\n### 8 苏拉威锡雕\n*Nisaetus lanceolatus* 55–64cm\n野外记录：通常单只可见。栖息在树冠中，有时非常显眼。幼鸟在外表上与弗罗斯雕相似。\n\
  鸣声：一段逐渐下降的*kluuu-kluuu-kluuu-kluuu-kluuu-kluuu*……，前面由一个上扬的双音节引导；还有一段快速的*kee-kee-kee-kee*……。\n\
  栖息地：原生森林和高大的次生低地、丘陵和山地森林，森林边缘及附近的开阔地区。\n分布范围：苏拉威锡和苏拉群岛特有。\n\n### 9 菲律宾锦雕\n*Nisaetus\
  \ philippensis* 56–67cm\n野外记录：经常隐藏在树冠中。记录信息较少；假定与该属其他物种相似。幼鸟与弗罗斯雕相似，但有长冠冠羽。\n鸣声：哨声的*wheeet\
  \ whit* 或 *du-wheeet*。\n栖息地：从低地到山的森林。\n分布范围：菲律宾特有。\n\n### 10 宾斯克雕\n*Nisaetus bartelsi*\
  \ 54–61cm\n野外记录：曾被认为是前一种种的亚种；假定行为相似。\n鸣声：一系列尖锐的哨声*whistee*。\n栖息地：低地森林。\n分布范围：菲律宾南部特有。\n\
  \n### 11 华士雕\n*Nisaetus nanus* 45–49cm\n野外记录：幼鸟腹部和头部无斑，呈肉桂褐色，黑色冠羽除外。\n鸣声：尖锐的*yik*。\n\
  栖息地：原生和高大的次生森林。\n分布范围：栖息于苏答腊。\n\n![image](img/page73.jpg)\n\n## 80 蛇雕\n\n### 1 冠头雕\n\
  *Spilornis cheela* 56–74cm\n野外记录：经常在森林上方高空盘旋。描绘的种群包括：主图`S. c. pallidus`；`S. c. sipora`\
  \ (1b)来自苏答腊附近的门望岛；以及`S. c. abbotti` (1c)来自苏答腊附近的西留岛。\n鸣声：尖锐的*kwee-k*……。\n栖息地：良好的林地。\n\
  分布范围：栖息于苏答腊和菲律宾西部。\n\n### 2 山雕\n*Spilornis kinabensis* 55–58cm\n野外记录：沿山脊捕猎。\n鸣声：长而细的尖啸*kiill*。\n\
  栖息地：山顶山地森林。\n分布范围：婆罗洲特有。\n\n### 3 苏拉威锡蛇雕\n*Spilornis rufpectus* 46–54cm\n野外记录：通常单只或成对出现。嘈吵且显眼，经常栖息在树顶上。经常在树冠上方飞行。\n\
  鸣声：多变的、传播远的高频哨声，偶尔以微弱的啾啾结束。\n栖息地：原生低地、丘陵和山地森林，高大的次生灌木林，森林边缘和疏疏的耕地。\n分布范围：苏拉威锡和苏拉群岛特有。\n\
  \n### 4 菲律宾蛇雕\n*Spilornis holospilus* 47–53cm\n野外记录：经常栖息在森林边缘。在森林和森林边缘高空盘旋，通常在树冠中鸣叫。\n\
  鸣声：哨声*seeeap weep*，可能夹杂着*aah-e-a reep*。\n栖息地：森林和森林边缘。\n分布范围：菲律宾南部特有。\n\n### 5 短趾雕（短趾蛇雕）\n\
  *Circaetus gallicus* 62–67cm\n野外记录：在俯冲猎物前经常悬停。经常栖息在暴露的树枝上，单只或成对出现；在树冠和草原上方盘旋。\n\
  鸣声：通常沉默，但可能发出各种旋律般的鸣叫和嘎吱声。\n栖息地：原生和高大的次生季风林、稀树树林、混合灌丛和疏疏的耕地。\n分布范围：小巽群岛。\n\n###\
  \ 6 栗�劳\n*Circus aeruginosus* 48–56cm\n野外记录：通常在地面附近飞行，在芦苇丛或开阔草原上觅食，方式为一系列扇翅后接滑翔，翅膀呈浅“V”字型。双脚先朝下落下捕获猎物。\n\
  鸣声：通常沉默，但在受惊时会发出咯咯声的*chek-ek-ek-k-ek*。\n栖息地：芦苇丛、草原、农田和盐沼泽。\n分布范围：可能是苏答腊和婆罗洲的冬季访客。\n\
  \n\n\n\n# 7 大普通头驞\n*Circus spilonotus* 47–55cm 野外记录：觅食行为与之前的物种相似，后者曾被认为是同物种。头部斑纹的颜色变化不异，通常导致脸部或头部呈黑色。鸣声：通常保持沉默；在栖息地可能会发出类似猫叫的\
  \ `keeau` 声。栖息地：沼泽、草地和稻田。分布：苏门答腊、婆鲁洲和菲律宾的冬客。\n\n# 8 斑纹����\n*Circus assimilis* 50–61cm\
  \ 野外记录：单只或成对出现。在开阔地带低空狩猎；经常栖息在孤立的柱子或枯树上。鸣声：短促而尖锐的哨声和快速的叽喳。栖息地：草地、稻田、灌丛和耕地。分布：栖于小巽登群岛的苏望腊和松巴；可能也分布于小巽登群岛的苏拉群岛和帝汶岛。\n\
  \n# 9 雌����\n*Circus cyaneus* 44–52cm 野外记录：觅食行为与普通����相似，但扇翅更快，滑翔时间更短。双翅平齐或呈浅“V”字形滑翔。鸣声：受惊时，雄鸟发出\
  \ `chek-ek-ek-ek`，雌鸟发出急促的 `chit-it-it-it-it-it-et-it-et-it-et-it`。栖息地：开阔草地、沼泽和沿海沼泽。分布：婆鲁洲稀有的冬客或漂留鸟。\n\
  \n# 10 黑腹����\n*Circus melanoleucos* 41–49cm 野外记录：狩猎行为与雌����相似。鸣声：通常保持沉默；雌鸟受惊时可能发出\
  \ `chak-chak-chak-chak-chak`。栖息地：开阔草地、沼泽和稻田。分布：婆鲁洲和菲律宾的冬客；曾在菲律宾的吕宋岛繁殖。\n\n![image](img/page175.jpg)\n\
  \n## 81 雀鹰类\n\n### 1 凤冠脱雕\n*Accipiter trivirgatus* 30–46cm 野外记录：经常栖息，特别显眼地停在枯树顶端俯瞰空地；也会从森林中的低矮栖息处狩猎。通常飞行方式为硬实的扇翅，随后是短距离滑翔，通常位于森林冠层上方。`A.\
  \ t. javanicus` (1b) 分布于爪哇和巴厘里。鸣声：响亮且重复的 `weeee-aaa`，还有尖锐的 `he-he-hehehehe` 或类似声。栖息地：原生林和森林边缘。分布：栖于苏门答腊、爪哇、巴厘里、婆鲁洲和菲律宾。\n\
  \n### 2 苏望腊灰鹰\n*Accipiter griseiceps* 28–37cm 野外记录：通常单只可见。喜爱森林内部；在茂密的叶丛中栖息狩猎，俯冲捕捉地面上的猎物。鸣声：高音且非常微弱的\
  \ `tseee-tseee-tseee`。栖息地：原生低地林、丘陵和山林、红树林，偶尔出现在高大的次生林。分布：苏望腊特有。\n\n### 3 常见的隼\n\
  *Accipiter badius* 30–36cm 野外记录：通常从隐藏的叶丛栖息处狩猎，捕取树上或地面上的猎物。通过低空扇翅和滑翔变换栖息点。鸣声：哨音般的\
  \ `keeu-keeu-keeu` 和尖锐的 `kewick`。栖息地：开阔林、森林边缘和林木耕地。分布：苏门答腊稀见的冬客。\n\n### 4 变异鹰\n\
  *Accipiter hiogaster* 30–45cm 野外记录：单只或成对出现；经常看到在森林上空翱翔或沿森林边缘冲刺。`A. h. sylvestris`\
  \ (4b) 分布于小巽登群岛；`A. h. pallidiceps` (4c) 发现于马鲁库群岛的布鲁岛；`A. h. albiventris` (4d) 分布于南马鲁库群岛的凯岛；`A.\
  \ h. griseogularis` (4e) 发现于中、北马鲁库群岛。鸣声：一系列高音、上扬的音调。栖息地：原生及高大的次生低地林和丘陵林、森林边缘、季风林、草原灌丛和种植园。分布：栖于马鲁库群岛和小巽登群岛。\n\
  \n### 5 中国雀鹰\n*Accipiter soloensis* 27–35cm 野外记录：通常从树叶栖息处狩猎，扑捕青蛙、蜥蜴和昆虫。雌鸟较大，腹部略有横纹。鸣声：快速、加速且音调下降的哨音。栖息地：各种林地，通常靠近湿地。分布：苏门答腊、爪哇、婆鲁洲、菲律宾、苏望腊、北马鲁库群岛以及可能的小巽登群岛的冬客。\n\
  \n### 6 斑尾雀鹰\n*Accipiter trinotatus* 26–30cm 野外记录：栖息在森林下层，靠近树干，单只或成对出现。蜥蜴、蛇、青蛙、鸟和昆虫的活跃捕猎者。鸣声：一系列下降的\
  \ 4–6 个 `ke` 音。栖息地：原生低地林、丘陵和山林、高大次生林和红树林。分布：苏望腊特有。\n\n### 7 马鲁库鹰\n*Accipiter henicogrammus*\
  \ 37–43cm 野外记录：单只、成对出现，偶尔成群出现。不显眼，通常栖息在中层，靠近树干。鸣声：包括一系列上扬的音调，较长的哨声。栖息地：原生低地林和丘陵林、森林。分布：马鲁库群岛特有。\n\
  \n### 8 棕鹰\n*Accipiter faciatus* 33–55cm 野外记录：单只、成对出现，偶尔成群出现。`A. f. hellmayri` (8b)\
  \ 分布于帝汶岛。鸣声：快速的 `tchew-tchew-tchew` 和 `tit-tit-tit`。栖息地：从低地到山的森林。分布：南马鲁库群岛特有。\n\n\
  ### 9 日本隼\n*Accipiter gularis* 29–34cm 野外记录：迁徙时有时成群。经常隐藏在叶丛中。鸣声：尖锐的 `kek-kek-kek`\
  \ 和快速的尖叫声 `ki-weer`。栖息地：疏林地区、开阔地。分布：苏门答腊、爪哇、婆鲁洲、苏望腊和小巽登群岛。\n\n![image](img/page177.jpg)\n\
  \n## 82 雀鹰与隼\n\n### 1 凤隼\n*Accipiter virgatus* 29–36cm 野外记录：从隐藏的栖息处俯捕鸟类。`A. v. confusus`\
  \ (1b) 发现于菲律宾；`A. v. vanmeli` (1c) 分布于苏门答腊。鸣声：快速的 `hihihihi-tit-tit-tit`。栖息地：从低地到山的森林。分布：小巽登群岛。\n\
  \n### 2 苏望腊矮隼（苏望腊小雀鹰）\n*Accipiter nanus* 23–28cm 野外记录：通常单只或成对出现。主要在森林内部觅食。俯冲捕捉大型昆虫和小型鸟类。鸣声：细的高音\
  \ `kiliu`，有时是尖锐快速的 `ki-ki-ki-ki`。栖息地：原生丘陵林和山林。分布：苏望腊特有。\n\n### 3 红颈雀鹰\n*Accipiter\
  \ erythrauchen* 26–33cm 野外记录：不显眼地栖息在密集的冠层叶中，单只或偶尔成对出现。从掩体中冲捕小鸟。鸣声：一系列高音断奏音。栖息地：低地和丘陵的原生林、树木种植园和采伐低地林。分布：马鲁库群岛特有。\n\
  \n### 4 紫胸雀鹰\n*Accipiter rhodogaster* 26–33cm 野外记录：通常独居，有时成对。经常栖息在冠层暴露的枝条上，否则喜爱森林内部。鸣声：栖息地：原生及高大的次生低地林和丘陵林、疏林耕地和红树林。分布：苏望腊和苏拉群岛特有。\n\
  \n### 55 雀鹰（欧亚或北雀鹰）\n*Accipiter nisus* 28–38cm 野外记录：通常单只可见。鸣声：受惊时发出快速的 `kew-kew-kew-kew-kew`。栖息地：森林、灌丛林、开阔林地和林木耕地。分布：婆鲁洲的漂留鸟。\n\
  \n\n\n\n\n# 6 缅甸眼镜雕 *Accipiter meyerianus* 48–56cm\n野外习记：通常单独出现，通常在森林上空低空滑翔；偶尔可见栖息在森林空地边缘，或在森林溪流旁觅食。\n\
  鸣声：重复的、响亮的、鼻性的、上扬的 `whi-i-yu`，还有模糊的 `ka-ah`。\n栖息地：原生低地森林和山地森林。\n分布：留鸟于摩卢甲群岛。\n\n\
  # 7 红翅鹗 *Butastur liventer* 35–41cm\n野外习记：独居但不胆小。经常在开阔地区附近的树木上栖息捕食。通过短距离飞行捕捉地面猎物，如小型哺乳动物、蜥蜴、青蛙、螃蟹和昆虫。双翅平直滑翔。\n\
  鸣声：尖锐的 `pit-piu`，还有高音的 `eeoe-tsut`。\n栖息地：干旱森林、次生林、草原、稻田和城市地区。\n分布：留鸟于爪哇和苏里答腊。\n\n\
  # 8 灰脸鹗 *Butastur indicus* 46cm\n野外习记：迁徙期间经常形成大群。捕食青蛙、蜥蜴和啮齿类，通常利用死树顶作为瞭哨点。\n鸣声：颤抖的\
  \ `chit-kwee`。\n栖息地：附近有开阔地的林地地区。\n分布：冬候于苏门答腊、爪哇、婆罗洲、菲律宾、苏里答腊和北摩卢甲群岛。\n\n# 9 白眼灰鹗\
  \ *Butastur teesa* 36–43cm\n野外习记：长时间栖息在显眼的栖息点上，从那里俯冲攻击地面猎物，主要是小型哺乳动物、蜥蜴、青蛙、螃蟹和蛇。\n\
  鸣声：忧郁的 `pit-weer pit-weer`。\n栖息地：散布着树木和灌木的干旱开阔地区。\n分布：苏里答腊的候鸟。\n\n# 10 普通鹗 *Buteo\
  \ buteo* 51–57cm\n野外习记：经常在开阔地的柱子或树木上栖息。双翅呈浅“V”字型滑翔。羽色变化非常大。\n鸣声：猫叫般的 `peeeeooo`。\n\
  栖息地：散布树木的开阔地区、开阔林和森林边缘。\n分布：爪哇、巴厘岛、婆罗洲和菲律宾的候鸟。\n\n![image](img/page179.jpg)\n\n\
  ## 83 隼类；隼类\n\n### 1 黑腿短隼 *Microhierax fringillarius* 15–17cm\n野外习记：寻找显眼且无遮挡的栖息点，从那里进行短距离出击捕捕猎物。\n\
  鸣声：尖锐的 `kee` `kee kee` 和尖叫的 `kweer`。\n栖息地：森林空地、森林边缘和林地耕地。\n分布：留鸟于苏门答腊、爪哇、巴厘岛和婆罗洲。\n\
  \n### 2 白额短隼 *Microhierax latifrons* 14–16cm\n野外习记：栖息在高树的枯枝上，从那里通过快速俯冲来追捕昆虫或鸟类。\n\
  鸣声：未记载，推测与前述物种相似。\n栖息地：低地原生森林和森林边缘。\n分布：婆罗洲特有种。\n\n### 3 菲律宾短隼 *Microhierax erythrogenys*\
  \ 15–18cm\n野外习记：单只、成对或以家庭群出现。喜好树冠或死树的上部树枝。对昆虫或小鸟进行空中出击，从树上或地面捕取蜥蜴。\n鸣声：高音、快速的 `chik-chik-erk-erk`，还有持续的吱吱声\
  \ `pew pew pew pew`……\n栖息地：开阔森林、森林边缘和空地，范围从低地到中等山区。\n分布：菲律宾特有种。\n\n### 4 普通红隼 *Falco\
  \ tinnunculus* 31–37cm\n野外习记：在觅食时经常悬停，或利用显眼的柱子或树枝俯冲攻击猎物。\n鸣声：尖锐的 `kee-kee-kee-kee`\
  \ 和颤音的 `vriii`。\n栖息地：开阔地区、悬崖和人类居住区周围。\n分布：菲律宾冬候鸟。\n\n### 5 斑红隼 *Falco moluccensis*\
  \ 26–32cm\n野外习记：栖息在死树上并在搜寻猎物时悬停。\n鸣声：尖锐、重复的 `kee-kee-kee-kee`、`kiek-kiek-kiek-kiek`\
  \ 或类似声音。\n栖息地：散布树木的草地、疏林耕地、森林边缘和空地，以及人类居住区周围。\n分布：留鸟于爪哇、巴厘岛和华莱腊地区（南摩卢甲群岛的凯屿除外）；婆罗洲的候鸟。\n\
  \n### 6 亚隼 *Falco cenchroides* 28–35cm\n野外习记：通常单只出现。动作与红隼相似。\n鸣声：快速、尖锐的 `ki-ki-ki`……以及缓慢的\
  \ `tek-tek-tek`。\n栖息地：散布树木的开阔地区和农田。\n分布：爪哇、巴厘岛、小松达群岛和摩卢甲群岛的冬候或候鸟；在圣诞岛繁殖。\n\n###\
  \ 7 远伯尔隼（东红足隼） *Falco amurensis* 28–30cm\n野外习记：追捕飞行中的昆虫时飞行极其敏捷；也会悬停。\n鸣声：尖锐的 `kew-kew-kew-kew`。\n\
  栖息地：开阔地区和林地地区。\n分布：留鸟于摩卢甲群岛。\n\n### 8 红隼 *Falco columbarius* 25–30cm\n野外习记：追击飞行往往迅速且略有起伏，并在低空转弯。\n\
  鸣声：通常保持沉默。\n栖息地：开阔地区。\n分布：菲律宾候鸟。\n\n### 9 游隼（欧亚隼或北隼） *Falco subuteo* 30–36cm\n野外习记：在追捕昆虫和鸟类时快速且动作灵活。经常栖息在孤立的树上。\n\
  鸣声：快速的 `kew-kew-kew-kew`（等等，`kew-kew-kew-kew`）。\n栖息地：开阔地区和林地地区。\n分布：爪哇、婆罗洲和小松达群岛的候鸟。\n\
  \n### 10 东方隼 *Falco severus* 27–30cm\n野外习记：动作与游隼相似。\n鸣声：快速的 `ki-ki`。\n栖息地：森林边缘和空地、耕地、湖泊。\n\
  分布：留鸟于爪哇、巴厘岛、菲律宾、苏里答腊、苏拉威岛和摩卢甲群岛。\n\n### 11 澳洲隼 *Falco longipennis* 33cm\n野外习记：鸟类和蝙蝠的快速敏捷猎手。\n\
  鸣声：微弱、高音的 `ki-ki`……\n栖息地：疏林草地、开阔地区、林地耕地。\n分布：留鸟于摩卢甲群岛和小松达群岛。\n\n### 12 游隼 *Falco\
  \ peregrinus* 36–48cm\n野外习记：在快速追击后，通过闭翅高速俯冲杀掉猎物。\n鸣声：略带脉冲性的、嘶声和尖锐的 `kek-kek`……\n\
  栖息地：包括开阔地区、湿地、森林边缘（沿海和内陆）。\n分布：该地区的留鸟和冬候鸟。\n\n![image](img/page181.jpg)\n\n## 84\
  \ 鹱；����鸟\n\n### 1 大鹱 *Fregata minor* 85–100cm\n野外习记：通过触碰水面捕鱼；也会追逐其他海鸟迫使其吐出食物，并在船只周围觅食。常与小鹱聚集在一起。繁殖季节，雄性会膨胀喉部的红色皮肤。幼鸟头部和腹部白色白色被黑色胸纹分开，胸纹会随年龄增长而变淡。\n\
  鸣声：通常保持沉默。\n栖息地：主要在海洋，上陆繁殖和栖息；在平地或树上筑巢。\n分布：全年留留；在圣诞岛以及班达海、弗里斯海的海域繁殖。\n\n### 2 小鹱\
  \ *Fregata ariel* 71–81cm\n野外习记：经常成群出现，与大鹱混在一起。觅食行为与大鹱相似。繁殖季节，雄性会膨胀喉部。幼鸟头部色浅，腹部和腋下白色被纤细的深色胸纹分开，随着头部颜色加深，胸纹会变淡。\n\
  鸣声：通常保持沉默。\n栖息地：主要在海洋，上陆繁殖或栖息。\n分布：全年留留；在圣诞岛繁殖；可能在班达海的岛屿繁殖。\n\n\n\n\n\n# 3 圣诞节军鹻\n\
  *Fregata andrewsi* 90–100cm\n野外札记：觅食行为与大军鹻相似。雄性在繁殖季节会膨胀喉部皮肤。幼鸟与幼年小军鹻相似，但胸部带较宽。鸣声：在繁殖地外通常保持沉默。栖息地：主要在海洋，上陆繁殖和栖息。分布：在圣诞岛繁殖；为往苏门答腊、爪哇、巴厘岛和婆罗洲附近海域的非繁殖期访客；其他地区为漂候鸟。\n\
  \n# 4 白尾大��鸟\n*Phaethon lepturus* 70–82cm\n野外札记：飞行由扇动翅膀后紧接长距离滑翔组成。通过悬停后用半合翅膀俯冲捕鱼觅食。*P*.\
  \ *l*. *fulvus* (4b) 在圣诞岛繁殖，并游徙至苏门答腊、爪哇和婆罗洲附近的海域。鸣声：尖锐的“吱-吱-吱”。栖息地：远洋及沿岸海域；在岩石缝隙或隐蔽的地面窝繁殖。分布：在圣诞岛、爪哇和巴厘岛繁殖；游徙于整个地区的海域。\n\
  \n# 5 红尾大��鸟\n*Phaethon rubricauda* 78–81cm\n野外札记：动作与白尾大��鸟相似。鸣声：粗哑、快速的“咯-咯-咯”……栖息地：远洋；主要在悬崖上繁殖。分布：在圣诞岛繁殖，可能也在巴厘岛和班达海的岛屿繁殖；迁徙至苏门答腊、爪哇和菲律宾附近的海域。\n\
  \n# 6 阿伯特邵\n*Papasula abbotti* 71cm\n野外札记：飞行往往比其他邵类更悠闲，翅膀扇动缓慢，滑翔姿慵懒。鸣声：在繁殖地外通常保持沉默。栖息地：繁殖后在远洋；在树上繁殖。分布：圣诞岛的特有繁殖种；游徙至苏门答腊和爪哇附近的海域，在班达海和塞拉姆海也有记录。\n\
  \n# 7 红脚鴱\n*Sula sula* 66–77cm\n野外札记：通过倾斜俯冲觅食。深色体型的变异包括白尾型和白头白尾型。鸣声：在海面上通常保持沉默。栖息地：繁殖地外的海洋。分布：该地区的居民；在菲律宾、弗罗斯海和班达海的岛屿或礁石上繁殖，以及圣诞岛；游徙至苏门答腊、爪哇和婆罗洲沿岸。\n\
  \n# 8 墨色鴱\n*Sula dactylatra* 81–92cm\n野外札记：通过俯冲觅食，倾向于以比其他邵类更陡的角度俯水。鸣声：在繁殖地外通常保持沉默。栖息地：繁殖地外的海洋。分布：该地区的居民；在菲律宾和班达海的礁石上繁殖。\n\
  \n# 9 棕色鹵\n*Sula leucogaster* 64–74cm\n野外札记：倾斜俯冲觅食。群居性。鸣声：在繁殖区通常保持沉默。栖息地：繁殖地外的海洋。分布：该地区的居民；在菲律宾、班达海和弗罗斯海的岛屿上繁殖。\n\
  \n![image](img/page183.jpg)\n\n## 85 鹈\n\n# 1 白鹈（大白鹈）\n*Pelecanus onocrotalus* 140–175cm\n\
  野外札记：经常协作捕鱼，形成半圆将鱼推入浅水，使每只鸟都能舀一嘴鱼。非繁殖期成鸟颜色较浅。翅膀和颈部呈褐色。鸣声：飞行时可能发出低沉的咯声。栖息地：湖泊、河流和避风的沿岸海域。分布：苏门答腊。\n\
  \n# 2 斑嘴鹈\n*Pelecanus philippensis* 140cm\n野外札记：社交性，像前述物种一样经常协作捕鱼。非繁殖期鸟喙和面部颜色较浅。鸣声：捕鱼群体可能发出深沉的咩声。栖息地：大型湖泊、泻湖和入海口。分布：菲律宾的冬季访苏门答腊。\n\
  \n# 3 澳洲鹈\n*Pelecanus conspicillatus* 150cm\n野外札记：群居性，通常以小群或大群出现。经常协作捕鱼。休息在沙洲、树枝和人工物上。非繁殖期鸟类颜色较浅。鸣声：通常保持沉默。栖息地：湖泊、沼泽、沿岸海域和珊瑚礁。分布：苏门答腊、爪哇和华拉西的漂候鸟。\n\
  \n# 4 印度蛇鸟\n*Anhinga melanogaster* 85–97cm\n野外札记：经常坐在翅膀展开的裸露处。非繁殖期羽毛颜色较暗。通常只露出颈部和头部。飞行时颈部呈明显的弯曲。鸣声：繁殖鸟发出响亮的“吱-吱”和各种咯声。栖息地：湖泊、沼泽和大河。分布：该地区的居民。\n\
  \n# 5 鸬（大鸬��）\n*Phalacrocorax carbo* 80–100cm\n野外札记：经常显著地展开翅膀停留。飞行时颈部呈轻微弯曲。鸣声：通常保持沉默。栖息地：湖泊、河流和沿岸海域。分布：婆罗洲、菲律宾和东摩鹿群岛的漂候鸟。\n\
  \n# 6 小黑鸬��\n*Phalacrocorax sulcirostris* 61cm\n野外札记：通常单只或小群大群。经常显著地停在水边的死树上。飞行时颈部呈轻微弯曲。鸣声：通常保持沉默；繁殖地发出各种吠声和咯声。栖息地：湖泊、池塘和沿岸海域。分布：爪哇和华拉西的居民；婆罗洲的漂候鸟。\n\
  \n# 7 小斑白鸬��\n*Microcarbo melanoleucos* 55–65cm\n野外札记：通常单只或多达 20 只的群体出现。显著地栖息，通常在水边的树上。飞行时颈部呈轻微弯曲。幼鸟黑色头冠延伸至眼部。鸣声：通常保持沉默；繁殖地发出各种咕咕声和咔哒声。栖息地：沼泽、湖泊、池塘、河流、沿岸泻湖、红树林和入海口。分布：华拉西的居民；爪哇、巴厘岛和婆罗洲的漂候鸟。\n\
  \n# 8 小鸬\n*Microcarbo niger* 51cm\n野外札记：经常张开翅膀坐。飞行时颈部呈轻微弯曲。鸣声：通常保持沉默；繁殖地发出各种咕噜声、呻吟声和吼声，还有低音的“啊-啊-啊”和“咯-咯-咯”。栖息地：淡水湿地、红树林和入海口。分布：爪哇居民，婆罗洲的繁殖种。\n\
  \n![image](img/page185.jpg)\n\n## 86 鹭\n\n# 1 苍鹭\n*Bubulcus ibis* 48–53cm\n野外札记：社交性，经常成群栖息。经常看到它们觅食被牲畜惊扰的昆虫。经常停在树上。鸣声：飞行时可能发出粗哑的咯声“噜”或“咯”。栖息地：各种湿地和草地。分布：该地区的居民或冬季访客，南摩鹿群岛的凯群除外。\n\
  \n# 2 黑白鹭\n*Egretta picata* 50cm\n野外札记：经常以小群或大群出现。活跃的伏击觅食者，尽管有记录它们在落在猎物前会“悬停”。幼鸟为棕灰色，头部白色。鸣声：飞行时发出响亮的“喔”或“奥”。栖息地：各种湿地，包括湖泊、泥涂滩和入海口。分布：苏拉威西居民；向东小松群岛和南摩鹿群岛迁徙。\n\
  \n# 3 白面鹭\n*Egretta novaeholiae* 61–74cm\n野外札记：单只、成对或小群出现；有时与其他涉水鸟类混在一起。活跃的伏击觅食者。鸣声：通常保持沉默；飞行时可能发出长长的、喉音的咯声。栖息地：淡水和咸水沼泽、稻田、湖缘和河流。分布：圣诞岛和小松群岛居民；南摩鹿群岛和巴厘岛的非繁殖访客；婆罗洲漂候鸟。\n\
  \n# 4 太平洋礁鹭（东礁鹭）\n*Egretta sacra* 58–66cm\n野外札记：繁殖期鸟类有短而不明显的脑冠。觅食动作较为迟缓，但在发现潜在猎物时会快速追击。鸣声：惊恐时发出沙哑的咯声和粗鲁的“嘎”。栖息地：岩石岸、海滩和泥涂滩。分布：该地区的居民。\n\
  \n\n\n\n# 5 小白鹭 *Egretta garzetta* 55–65cm \n鸟类记录：在繁殖期开始时，眶纹变为黄色、黄橙色或红色。通常通过张开翅膀快速来回穿梭来觅食。非繁殖期成年鸟和幼鸟缺乏头部、胸部和背部的羽冠。黑足白鹭亚\
  \ *E.* *g.* *nigripes*（图中未显示）在瓦腊群岛繁殖，并出现在该地区的其他地方。叫声：在争斗或受惊时发出粗厉的 *aaah* 或 *kgarrk*。栖息地：湖泊、河流、沼泽、稻田、潮汐水道和河口。分布：在该地区分布的留鸟以及该地区的非繁殖季节访客。\n\
  \n# 6 中国白鹭（斯文鹤白鹭）*Egretta eulophotes* 65–68cm \n鸟类记录：非繁殖期鸟类的喙部尖端呈深色，它们和幼鸟缺乏头部和背部的羽冠。经常与其他鹭类鸟一同觅食，通常通过张开并扇动翅膀来回穿梭来寻找食物。叫声：通常保持安静。栖息地：潮间泥滩、海湾、海岸潟湖和红树林。分布：苏门答腊、婆罗洲、菲律宾和苏拉西的稀有冬候。\n\
  \n# 7 中鹭（黄嘴鹭或羽鹭）*Ardea intermedia* 65–72cm \n鸟类记录：繁殖季节喙部会在短时间内变为黑色。非繁殖期鸟和幼鸟缺乏羽冠。觅食时行进缓慢。叫声：受干扰时发出粗厉的\
  \ *kwark* 或 *kuwark*。栖息地：淡水湖泊、河流和沼泽；也有潮汐水道和红树林沼泽。分布：该地区的留鸟和非繁殖访客。\n\n# 8 大白鹭（大鹭）*Ardea\
  \ alba* 85–102cm \n鸟类记录：经常挺直脖子悄悄行走。在繁殖前的一段短时间内，喙部变黑，眶纹呈蓝色，胫骨呈粉红色。非繁殖期和幼鸟缺乏背部羽冠。叫声：通常保持安静，尽管可能发出沙哑的鸣声。栖息地：淡水和咸水湿地。分布：该地区的留鸟和非繁殖访客。\n\
  \n![image](img/page187.jpg)\n\n## 87 鹭类\n\n# 1 苍鹭鹭 *Ardea cinerea* 90–98cm \n鸟类记录：通常独自觅食。经常静止站在水边或树枝上。翅下覆羽为灰色，与深色的飞羽形成对比。叫声：飞行时发出粗厉的\
  \ *frahnk*。栖息地：各种湿地，包括湖泊、沼泽、河流、潮汐水道和红树林。分布：留于苏门答腊、爪哇西、巴厘岛和小巽巽西群岛；婆罗洲和菲律宾的非繁殖访客。\n\
  \n# 2 大嘴鹭（苏门答腊鹭）*Ardea sumatrana* 115cm \n鸟类记录：通常害羞且警觉，独自或成对觅食。翅下覆羽为灰色，与飞羽对比不明显。叫声：偶尔发出响亮、粗厉的鸣声。栖息地：红树林、未受扰扰的海滩、礁石和海岸附近的大河。分布：在该地区广泛分布。\n\
  \n# 3 枯颈鹭 *Ardea purpurea* 78–90cm \n鸟类记录：行踪，倾向于躲在水生植物的遮蔽下。翅下覆羽看起来全深色。叫声：飞行时发出粗厉的\
  \ *frahnk*，音调比苍鹭高。栖息地：植被茂密的水生植物沼泽和湖泊；繁殖后经常访问更开阔的水域。分布：除北摩卢甲群岛外，在该全范围内留鸟。\n\n# 4\
  \ 黑额夜鹭 *Nycticorax nycticorax* 58–65cm \n鸟类记录：主要是晨昏性或夜行性；通常独自觅食，但可能会看到小群从白天的栖息地飞出。幼鸟上部为棕色并带有肉白色斑点；头部、颈部和胸部为肉黄色，有棕色条纹。叫声：飞行时发出类似蛙的鸣声。栖息地：带有边缘植被和红树林的湿地。分布：留于爪哇、婆罗洲、苏拉西，可能还有菲律宾；苏门答腊的非繁殖访客；小巽西群岛的漂留。\n\
  \n# 5 黄腹夜鹭 *Nycticorax caledonicus* 55–59cm \n鸟类记录：夜行性。白天休息在阔叶树的遮蔽下。最佳观测时间是晚上，此时鸟类离开集体栖息地前往觅食地。幼鸟与前一种物种幼鸟非常相似，但颈部和胸部的条纹更明显。叫声：飞行时发出响亮的\
  \ *kyok* 或 *kwok*。栖息地：沼泽、池塘、湖泊、红树林以及森林环绕的水道河流。分布：留于爪哇、婆罗洲、菲律宾和瓦腊群岛。\n\n# 6 马来夜鹭\
  \ *Gorsachius melanolophus* 49cm \n鸟类记录：主要是晨昏性或夜行性。行踪，通常独自觅食。初羽末端带白色。叫声：一系列深沉的 *oo*\
  \ 声。栖息地：茂密森林中的沼泽和溪流。分布：菲律宾的繁殖留鸟；向该地区其他地区的非繁殖迁徙。\n\n# 7 日本夜鹭 *Gorsachius goisagi*\
  \ 48–50cm \n鸟类记录：躲避。独居。主要是夜行性。初羽有大面积的锈色末端。叫声：深沉的 *bou-bou*，通常在晚上发出。栖息地：森林中的底层灌木丛。分布：婆罗洲和北苏拉西的冬候。\n\
  \n# 8 纹鹭 *Butorides striata* 40–48cm \n鸟类记录：通常在河流或湖泊边的植被中独自静止觅食。幼鸟上部为棕色带有浅色斑点，腹部和颈部有深棕色条纹。叫声：受惊时发出粗厉的\
  \ *kyah*。栖息地：红树林、河流、溪流以及海岸泥滩。分布：在该地区的广泛留鸟。\n\n# 9 中国池鹭 *Ardeola bacchus* 42–45cm\
  \ \n鸟类记录：等待猎物时静止不动。飞行时显示白色的翅膀和尾羽。叫声：通常保持安静；飞行或受惊时发出粗厉的鸣声。栖息地：沼泽、稻田、水沟和海岸水域。分布：苏门答腊、婆罗洲和菲律宾的冬候。\n\
  \n# 10 爪哇池鹭 *Ardeola speciosa* 45cm \n鸟类记录：晨昏性。静止等待猎物。飞行时显示白色的翅膀和尾羽。叫声：受惊时发出粗厉的\
  \ *kaa kaa*；飞行时发出鸣声。栖息地：各种内陆和海岸湿地。分布：留于爪哇、巴厘岛、婆罗洲、菲律宾和西巽群岛；苏门答腊的非繁殖访客。\n\n![image](img/page189.jpg)\n\
  \n## 88 秧鹭；��\n\n# 1 黄鹭 *Ixobrychus sinensis* 30–40cm \n鸟类记录：躲避，主要是晨昏性或夜行性。飞行时显示黄色的翅下覆羽、黑色的飞羽和尾羽。幼鸟上黄色带有深色条纹。叫声：飞行时发出尖锐的\
  \ *kakak kakak*。栖息地：沼泽、湖泊周围的植被。分布：留于苏门答腊、婆罗洲、菲律宾、苏拉西和巽西群岛的弗莱斯；其他地区的非繁殖访客。\n\n# 2\
  \ 冯伦克鹭 *Ixobrychus eurhythmus* 33–39cm \n鸟类记录：躲避，通常独居。飞行时翅下覆羽为黄色，飞羽为灰色，尾羽为黑色。幼鸟类似于雌鸟。叫声：低沉且重复的\
  \ *gup*；飞行时发出低沉的鸣声。栖息地：森林附近的沼泽、池塘和稻田，以及植被良好的开放湿地。分布：苏门答腊、爪哇、婆罗洲、菲律宾和苏拉西的冬候。\n\n\
  # 3 肉褐色鹭 *Ixobrychus cinnamomeus* 40–41cm \n鸟类记录：行踪。通常独自觅食，主要是晨昏性。幼鸟上部为深棕色带有浅色斑点，下部为肉黄色带有明显的深棕色条纹。叫声：低沉的\
  \ *kwok-kwok-kwok*……有时以两个或三个较轻的音符结束。飞行时发出鸣声。栖息地：各种湿地，包括水淹稻田、沼泽和芦苇丛。分布：留于苏门答腊、爪哇、婆罗洲、菲律宾、苏拉西、苏拉群岛和西巽西群岛。\n\
  \n\n\n\n\n### 4 黑嘴大 cm 鹭（黄颈大 cm 鹭或红大 cm 鹭）\n*Dupetor flavicollis* 54–66cm\n**野外记录：**\
  \ 行踪隐秘，在茂密的植蔽物中躲藏；主要是晨昏性活动。幼鸟像雌鸟，但背部边缘有浅色边缘。\n**鸣声：** 飞行时，发出沙哑的嘎咯声。\n**栖息地：** 淡水湿地、沼泽森林和红树林。\n\
  **分布：** 该地区的留留鸟和迁徙鸟。\n\n### 5 大 cm 鹭（大欧利亚大 cm 鹭）\n*Botaurus stellaris* 70–80cm\n\
  **野外记录：** 行踪隐秘，更多在飞行中看到。幼鸟斑纹不明显。\n**鸣声：** 飞行时，发出刺耳、鼻腔的 *kau* 或 *krau* 声。\n**栖息地：**\
  \ 淡水和咸水苇丛。\n**分布：** 婆罗洲和菲律宾的漂离鸟。\n\n### 6 白肩白鶴\n*Pseudibis davisoni* 75–85cm\n**野外记录：**\
  \ 在河岸觅食。在高树上栖息和筑巢。飞行时，前翅内侧显示白色斑块。幼鸟色较棕，带有脏白色颈圈。\n**鸣声：** 发出沙哑的尖叫 *ERRRRRRRROH*，伴有低沉的\
  \ *ohhaaa ohhaaa* 和 *errr-ah*；还有其他尖叫和鸣声。\n**栖息地：** 河边森林。\n**分布：** 婆罗洲的稀有留留鸟。\n\n\
  ### 7 澳洲白鶴\n*Threskiornis molucca* 65–75cm\n**野外记录：** 单独、成对或多达 35 只鸟的群体出现。经常栖息在孤立的枯树和倒下的河岸树木上。幼鸟裸皮肤点缀白色羽毛，有黑色三级羽且缺乏羽冠。\n\
  **鸣声：** 通常保持沉默，但偶尔发出刺耳的嘎咯声和鸣声。\n**栖息地：** 沼泽、湿润和新烧过的草地、海岸泥滩、红树林以及大型河流边缘。\n**分布：**\
  \ 小巽他群岛南部和中马鲁古群岛的留鸟。\n\n### 8 黑头鶴（东方白鶴或黑颈鶴）\n*Threskiornis melanocephalus* 65–75cm\n\
  **野外记录：** 通常成小群出现。在浅水中行走，左右移动喙部过滤水中的食物。群居繁殖。幼鸟裸皮肤仅限于脸部。\n**鸣声：** 通常保持沉默；在繁殖地发出奇怪的咕噜声。\n\
  **栖息地：** 沼泽、稻田、盐沼和海岸泥滩。\n**分布：** 在爪哇答和可能在苏门答繁殖；菲律宾的冬季候客；婆罗洲和苏里腊锡的漂离鸟。\n\n### 9 闪光翠鶴\n\
  *Plegadis falcinellus* 55–65cm\n**野外记录：** 通常成小群发现。幼鸟像成鸟但缺乏光泽，颈部和头部点有白色斑点。\n**鸣声：**\
  \ 咕噜般的 *grru* 或 *graa*；在繁殖地发出咕噜声和嘎咯声。\n**栖息地：** 各种湿地，包括沼泽、湖泊和海岸潟湖。\n**分布：** 爪哇、菲律宾和苏里腊锡的留鸟；其他地区为冬季候客或漂离鸟。\n\
  \n![image](img/page191.jpg)\n\n## 89 嘴鹳；鹤\n\n### 1 斑勺鹳\n*Platalea regia* 74–81cm\n\
  **野外记录：** 单独、成对或小群出现。行走并左右扫动喙部，过滤水中的食物。非繁殖期鸟缺乏羽冠且腹部无黄色调。\n**鸣声：** 通常保持沉默。\n**栖息地：**\
  \ 沼泽、潟湖和潮间泥滩。\n**分布：** 爪哇、巴厘、华拉西西亚和可能在婆罗洲的漂离鸟。\n\n### 2 琵脸勺鹳（小勺鹳）\n*Platalea minor*\
  \ 60–84cm\n**野外记录：** 通常成群发现。觅食动作与前一种物种相似。非繁殖期失去羽冠和胸部的黄色调。幼鸟初级羽末端为黑色。\n**鸣声：** 通常保持沉默。\n\
  **栖息地：** 潮间泥滩、盐沼、河口和内陆湖泊。\n**分布：** 婆罗洲和菲律宾的稀有漂离鸟。\n\n### 3 白鹳\n*Mycteria cinerea*\
  \ 92–97cm\n**野外记录：** 非繁殖期鸟类的喙呈粉黄色。幼鸟呈灰褐色，头部和颈部较棕；脸部皮肤和喙为浅黄色。\n**鸣声：** 通常保持沉默。繁殖期间，发出尖叫声、嘶嘶声以及拍喙声。\n\
  **栖息地：** 潮间泥滩和红树林；柬埔寨的泛滥森林。\n**分布：** 苏门答腊、爪哇、巴厘和可能在苏里腊锡的留鸟；小巽他群岛的漂离鸟。\n\n### 4 东方嘴鹳（亚洲嘴鹳）\n\
  *Anastomus oscitans* 68–81cm\n**野外记录：** 通常群居活动。非繁殖期成鸟的黑色部分偏褐色，颈和头部呈灰色，喙为灰色。飞行时，翅膀下方显示白色覆羽和黑色飞行羽，尾羽为黑色。幼鸟呈灰色，背部较深。\n\
  **鸣声：** 通常保持沉默。\n**栖息地：** 淡水沼泽、湖泊和潟湖。\n**分布：** 全区留鸟。\n\n### 5 毛颈鹳\n*Ciconia episcopus*\
  \ 75–92cm\n**分布：** 全区留鸟。\n\n### 6 风暴鹳\n*Ciconia stormi* 75–91cm\n**野外记录：** 通常单独或成对出现。飞行时，尾部被白色覆覆盖。\n\
  **鸣声：** 短促的口哨声和拍喙声。\n**栖息地：** 淡水沼泽森林。\n**分布：** 苏门答腊、爪哇、巴厘、菲律宾和苏里腊锡。\n\n### 7 大 cm\
  \ 鹳\n*Leptoptilos dubius* 120–150cm\n**野外记录：** 非繁殖期成鸟呈均匀板黑色。飞行时，翅下比小 cm 鹳浅，并在腋窝处显示三角形斑块。\n\
  **鸣声：** 通常保持沉默。\n**分布：** 全区留鸟。\n\n### 8 小 cm 鹳\n*Leptoptilos javanicus* 110–120cm\n\
  **野外记录：** 通常单独或成小群遇到。飞行时，黑色的翅下在腋窝处显示三角形斑块。\n**鸣声：** 求偶时，发出系列高频吱吱声和类似牛的哞声。\n**分布：**\
  \ 全区留鸟。\n\n### 9 斑腹鹤\n*Antigone antigone* 156–176cm\n**野外记录：** 俯视飞行显示黑色初级羽；颈部伸直，双腿伸过尾部。幼鸟头部和上颈部呈锈褐色，背部染有红色。\n\
  **鸣声：** 响亮的鸣叫声。\n**栖息地：** 水域，如沼泽、稻田、湖泊和河流。\n**分布：** 曾在菲律宾的吕宋岛繁殖；可能有漂离鸟。\n\n![image](img/page193.jpg)\n\
  \n## [90 剪鸥\n\n### 1 角剪鸥\n以快速、浅而僵硬的翅膀运动穿插短促滑翔。跟随船只和渔船。通常成群出现。\n**栖息地：** 大洋。\n**分布：**\
  \ 望达海的漂离鸟。\n\n### 2 大溪提剪鸥\n**野外记录：** 喙粗，身体长。飞行通常贴贴水面上空，翅膀动作松弛。独居，很少跟随船只或渔船。\n**栖息地：**\
  \ 大洋。\n**分布：** 菲律宾、马鲁古群岛和小巽他群岛的稀有访客。\n\n### 3 波尼尼剪鸥\n**野外记录：** 典型的快速跳跃式“甘油鸟”飞行——扇动翅膀获得高度，随后是长距离滑翔和宽阔的弧形转向。倾向于不跟随。\n\
  **栖息地：** 大洋。\n**分布：** 菲律宾北部可能的漂离鸟。\n\n### 4 夏威夷剪鸥\n**野外记录：** 典型的“甘油鸟”飞行（见前述物种）。通常独居。\n\
  **栖息地：** 大洋。\n**分布：** 菲律宾和北马鲁古群岛的漂离鸟。\n\n\n\n\n## 5 凯马代克海燕\n*Pterodroma neglecta*\
  \ 38cm 野外笔记：上翅初羽基部呈白色是其识别特征。典型的“苍蝇式”飞行（参见波尼尼海燕）。独居，不跟随船只或船艇。鸣叫：通常安静。栖息地：远洋。分布：菲律宾北离鸟。\n\
  \n## 6 巴劳乌海燕\n*Pterodroma baraui* 38cm 野外笔记：通常独居，很少跟随船只。该属典型的飞行方式，通过扇动翅膀获得高度，随后是长滑翔和宽阔的弧形转向。鸣叫：安静。栖息地：远洋。分布：苏门答腊附近的离鸟。\n\
  \n## 7 布尔威尔海燕\n*Bulweria bulwerii* 26–28cm 野外笔记：通常以不规则、轻浮的方式在水面上低飞，非常像大风雨燕。尾羽张开时呈楔形。独居或成对出现。通常不跟随船只。鸣叫：通常安静。栖息地：远洋。分布：婆罗洲附近的常客访客；菲律宾西部、苏拉威西东北部、摩鹿加群北部、班达海和小巽群岛的罕见访客。\n\
  \n## 8 乔安海燕\n*Bulweria fallax* 31cm 野外笔记：独居，不跟随船只。翅膀明显弯曲，贴近水面飞行。鸣叫：安静。栖息地：远洋。分布：苏门答腊南离鸟。\n\
  \n![image](img/page195.jpg)\n\n## 91 洋鸻；剪鸱；风雨燕\n\n### 1 极地洋鸻\n*Pachyptila desolata*\
  \ 27cm 野外笔记：以快速、不规则的之字形动作飞行。群居性强，常成大群出现。很少跟随船只或船艇。鸣叫：安静。栖息地：远洋。分布：爪哇答南部的偶然离鸟。\n\n\
  ### 2 斑纹剪鸱（白面剪鸱）\n*Calonectris leucomelas* 48cm 野外笔记：尾基有时显示出浅色月牙。飞行看起来可能懒散，但实际上非常快，在强风中具有动态的、类信海鸟式的翱翔。跟随渔船并常成大群出现。鸣叫：通常安静。栖息地：远洋。分布：该海域的季节性迁徙。\n\
  \n### 3 肉足剪鸱（白足剪鸱）\n*Ardenna carneipes* 40–45cm 野外笔记：飞行由懒散的扇翅组成，随后是坚硬翅膀上的长距离滑翔。单只或成小群出现，被渔船吸引。鸣叫：通常安静。栖息地：远洋。分布：苏门答腊西部和北部海岸的离鸟。\n\
  \n### 4 楔尾剪鸱\n*Ardenna pacifica* 41–46cm 野外笔记：缓慢的扇翅后跟随短距离滑翔；在强风中飞行方式更具跳跃性。常出现在渔船周围。鸣叫：通常安静。栖息地：远洋。分布：该海域的常客。\n\
  \n### 5 威尔逊风雨燕\n*Oceanites oceanicus* 15–19cm 野外笔记：趾间有黄色蹼膜，仅在近距离可见。觅食时经常垂下脚在海面上“跳舞”。被渔船吸引。鸣叫：快速的“叽叽声”，偶尔在觅食时发出。栖息地：远洋。分布：苏门答腊、爪哇、巴厘和华拉腊亚海域的常客。\n\
  \n### 6 白面风雨燕\n*Pelagodroma marina* 18–21cm 野外笔记：通过一系列摆动的跳跃觅食，每次跳跃时垂下脚，因此看起来像是在水上行走。飞行时，脚伸出远尾部；近距离可见黄色蹼膜。被渔船吸引。鸣叫：通常安静。栖息地：远洋。分布：可能是苏门答腊和小巽群岛西部的季节性迁徙。\n\
  \n### 7 斯温霍风雨燕（斯温霍海燕）\n*Oceanodroma monorhis* 19–20cm 野外笔记：觅食不规则，具有跳跃性飞行，并在浅翅扇动中悬停从海面捕取猎物。倾向不跟随船只。鸣叫：安静。栖息地：远洋。分布可能是巽达海峡和摩鹿加群岛附近的季节性迁徙。\n\
  \n### 8 松平风雨燕（烟玄风雨燕）\n*Oceanodroma matsudairae* 24–25cm 野外笔记：翅膀保持浅“V”字型，向下俯冲从海面捕取食物；也通过降落在水面上觅食。常跟随船只。鸣叫：通常安静。栖息地：远洋。分布：到华拉腊亚的季节性迁徙；婆罗洲以及可能的菲律宾和苏拉威西附近的离鸟。\n\
  \n![image](img/page197.jpg)\n\n## 92 兜鸟\n\n### 1 施奈德兜鸟\n*Hydrornis schneideri* 21–23cm\
  \ 野外笔记：在森林地面觅食，翻动叶子寻找猎物。鸣叫：低沉、柔和、长时间、颤抖的双音哨声，第一个音上扬，第二个音下降。栖息地：具有茂密植被和树木倒隙的原生山林，或森林边缘。分布：苏门答腊特有。\n\
  \n### 2 巨兜鸟\n*Bulweria bulwerii* 26–28cm 野外笔记：通常以不规则、轻浮的方式在水面上低飞，非常像大风雨燕。尾羽张开时呈楔形。独居或成对出现。通常不跟随船只。鸣叫：通常安静。栖息地：远洋。分布：婆罗洲附近的常客访客；菲律宾西部、苏拉威西东北部、摩鹿加群岛北部、班达海和小巽群岛的罕见访客。\n\
  \n### 3 马来斑纹兜鸟\n*Hydrornis irena* 21–24cm 野外笔记：在地面觅食，像母鸡一样刨地。曾被与爪哇兜鸟归类。鸣叫：短促重复的\
  \ `pow` 声和柔和的 `ringring` 声。栖息地：阔叶林和次生林。分布：苏门答腊特有。\n\n### 4 爪哇斑纹兜鸟\n*Hydrornis guajanus*\
  \ 20–23cm 野外笔记：飞行由懒散的扇翅组成，随后是坚硬翅膀上的长距离滑翔。单只或成小群出现，被渔船吸引。鸣叫：通常安静。栖息地：远洋。分布：苏门答腊西部和北部海岸的离鸟。\n\
  \n### 5 婆罗洲斑纹兜鸟\n*Hydrornis schwaneri* 20–23cm 野外笔记：……（文本内容混乱）。\n\n\n\n\n# 1 菲律宾六嘴鸟（红腹六嘴鸟）\n\
  *Erythropitta erythrogaster* 16–17cm\n野外记录：通常在地面上或附近可见。通常很害羞且不起眼，除非在鸣叫。它们会在露出的岩石、树桩或高树上上鸣叫。幼鸟通常呈暗褐色，喉部较浅，翅膀和尾部带有蓝色调。\n\
  鸣声：两声长长的、空灵的、类似猫头鹰的哨音，第一声上扬且波动，第二声下调。\n栖息地：森林和次生林。\n分布：特产于菲律宾。\n\n# 2 南马鲁库加六嘴鸟\n\
  *Erythropitta rubrinucha* 16–17cm\n野外记录：曾被认为是菲律宾六嘴鸟的一个亚种；假设行为相似。\n鸣声：假设与菲律宾六嘴鸟相似。\n\
  栖息地：热带湿润低地森林。\n分布：特产于南马鲁库群岛的布鲁岛（Buru）和塞拉姆岛（Seram）。\n\n# 3 北马鲁库六嘴鸟\n*Erythropitta\
  \ rufiventris* 16–17cm\n野外记录：曾被认为是菲律宾六嘴鸟的一个亚种；假设行为相似。\n鸣声：假设与菲律宾六嘴鸟相似。\n栖息地：亚热带和湿润低地森林。\n\
  分布：特产于北马鲁库群岛。\n\n# 4 苏拉威锡六嘴鸟\n*Erythropitta celebensis* 16–17cm\n野外记录：曾被认为是菲律宾六嘴鸟的一个亚种；假设行为相似。\n\
  鸣声：假设与菲律宾六嘴鸟相似。\n栖息地：亚热带和热带湿润低地森林以及种植园。\n分布：特产于苏拉威锡岛（Sulawesi）和托吉群岛（Togian Islands）。\n\
  \n# 5 西亚乌六嘴鸟（西奥六嘴鸟）\n*Erythropitta palliceps* 16–17cm\n野外记录：曾被认为是菲律宾六嘴鸟的一个亚种；假设行为相似。\n\
  鸣声：假设与菲律宾六嘴鸟相似。\n栖息地：亚热带和热带湿润低地森林，也是次生林。\n分布：特产于西亚岛（Siau）、塔胡兰岛（Tahulandang）和鲁昂岛（Ruang）。\n\
  \n# 6 桑给黑六嘴鸟\n*Erythropitta caeruleitorques* 16–17cm\n野外记录：曾被认为是菲律宾六嘴鸟的一个亚种；假设行为相似。\n\
  鸣声：假设与菲律宾六嘴鸟相似。\n栖息地：亚热带和热带湿润低地森林。\n分布：特产于桑给群岛（Sangihe Islands）。\n\n# 7 石榴六嘴鸟\n\
  *Erythropitta granatina* 15–16cm\n野外记录：在地面觅食，在落叶层以及倒下的树枝和木头间寻找；有时在木头上寻找。幼鸟通常呈暗褐色，翅膀和尾部为暗蓝色；脑颈呈红色。\n\
  鸣声：拉长的单调调哨声，音量逐渐增大；激动时会发出咕噜般的`prrr prrr prrr`。\n栖息地：原生森林和采伐过的低地森林。\n分布：居住于苏门答腊和婆罗洲岛。\n\
  \n# 8 优雅六嘴鸟\n*Erythropitta venusta* 18cm\n野外记录：在地面或倒木上觅食。幼鸟为简单的深褐色，头部有浅褐色条纹。\n鸣声：低沉、哀伤的哨声。\n\
  栖息地：湿润、黑暗的高地森林，具有密密的下层植物和峡谷。\n分布：特产于苏门答腊岛。\n\n# 9 黑冠六嘴鸟\n*Erythropitta ussheri*\
  \ 15–16cm\n野外记录：通过在落叶层中探测、或在潮湿地面或倒木上觅食。曾被认为是石榴六嘴鸟的一个亚种。\n鸣声：与石榴六嘴鸟相似但持续时间更长。\n栖息地：低地原生森林和采伐过的森林。\n\
  分布：特产于婆罗洲岛。\n\n![image](img/page201.jpg)\n\n94 六嘴鸟类\n\n# 1 蓝带六嘴鸟\n*Erythropitta\
  \ arquata* 15cm\n野外记录：记录较少；假设在地面觅食，以蚂蚁和其他昆虫为食。幼鸟通常呈棕褐色，头部两侧和喉部有灰褐色和黄色斑纹。\n鸣声：单调的、笛子般的哨声。\n\
  栖息地：有竹林和许多倒木的森林。\n分布：特产于婆罗洲岛。\n\n# 2 兜笠六嘴鸟\n*Pitta sordida* 16–19cm\n野外记录：在地面活动；鸣叫时经常栖在藤蔓或树枝上。幼鸟颜色更暗，腹部为脏黄色，缺乏红色尾端。`P.s.\
  \ .cucullata` (2b) 是迁徙至苏门答腊和爪哇的。\n鸣声：响亮的`whew-whew`。\n栖息地：原生河岸森林、下层植物茂密的次生林或灌木丛、湿林或干林以及各种种植园。\n\
  分布：居住于苏门答腊、爪哇、婆罗洲、菲律宾和苏拉威锡，并是它们的冬季游客。\n\n# 3 象胸六嘴鸟\n*Pitta maxima* 22–28cm\n野外记录：通常单只出现、成对或偶尔成群出现。离开地面的时间往往比大多数六嘴鸟长。幼鸟与成鸟相似但颜色更暗。\n\
  鸣声：独特的、哀伤的`wu-whoouw`，不断重复。\n栖息地：石灰岩地区未破坏和经过选择性采伐的山地森林，下层有棕榈类或密集的刺藤丛丛。\n分布：特产于北马鲁库群岛。\n\
  \n# 4 蓝胸六嘴鸟\n*Pitta steerii* 19cm\n野外记录：在地面、岩石和倒木上觅食。幼鸟与成鸟相似但颜色更暗，胸部和侧面带有绿色色调。\n\
  鸣声：爆发性的`whirp whirp whirp`，重复几次。\n栖息地：具有下层植物的森林，也包括退化森林。\n分布：特产于中马鲁库群岛。\n\n# 5 仙子六嘴鸟\n\
  *Pitta nympha* 19cm\n野外记录：在地面落叶层中觅食。幼鸟颜色更暗，翅上有白点。\n鸣声：清晰的哨鸣`kwa-kaih-kaaih`。\n栖息地：龙眼科混合林。\n\
  分布：婆罗洲稀有冬季游客。\n\n# 6 红树林六嘴鸟\n*Pitta megarh* 20cm\n野外记录：在红树林附近的泥泞区域觅食。幼鸟颜色更暗，冠部黑色。\n\
  鸣声：响亮的`tae-laew tae-laew`。\n栖息地：红树林。\n分布：居住于苏门答腊。\n\n# 7 蓝翅六嘴鸟\n*Pitta moluccensis*\
  \ 18cm\n野外记录：在地面觅食，像画眉一样跳跃。幼鸟较暗且缺乏红色腹部。\n鸣声：响亮、清晰的`taew-laew taew-laew`或`yeeow-yeeow\
  \ yeeow-yeeow`，重复几次；报警时发出粗糙的`skyeew`。\n分布：苏门答腊的冬季游客；居住于婆罗洲。\n\n# 8 优雅六嘴鸟\n*Pitta\
  \ elegans* 19cm\n野外记录：单只或成对出现。害羞且隐蔽，最好通过鸣声来定位。\n鸣声：`kwweee-kwill`；在不同岛屿上有不同变体，如桑巴岛的`ka-wha-kil`、苏拉群岛的`kwuwik-kwk`以及邦盖岛的`perriew-priew`。\n\
  栖息地：各种森林类型，包括湿润原生森林、季风森林、森林边缘以及退化和选择性采伐森林。\n分布：居住于巽群、马鲁库、苏拉和桑给群岛以及佛罗里斯海的岛屿。\n\n\
  ![image](img/page203.jpg)\n\n95 大嘴鸟类\n\n# 1 暗色大嘴鸟\n*Corydon sumatranus* 25–29cm\n\
  野外记录：通常成小群喧闹地出现在上层；在静止后会短暂冲刺到树枝或叶片上捕取昆虫。\n鸣声：尖锐、上扬的哨声，`hi-ky-ui ky-ui ky-ui`或`ky-ee\
  \ ky-ee ky-ee`；还发出尖锐的下降调`pseeoo`和高音的`tsiu`。\n栖息地：原生低地和山地森林。\n分布：居住于苏门答腊和婆罗洲。\n\n\
  # 2 黑红大嘴鸟\n*Cymbirhynchus macrorhynchos* 20–24cm\n野外记录：不起眼；长时间静止。\n鸣声：一系列加速的`parnk`声和类似蝉的摩擦声；此外还有各种咕噜声、悦耳的哨声和单调重复的`tyook`。报警时发出快速的`pip-pip-pip-pip`。\n\
  栖息地：低地森林和水边的森林边缘、淡水沼泽森林和红树林。\n分布：居住于苏门答腊和婆罗洲。\n\n\n\n\n### 3 斑纹宽嘴喙\n*Eurylaimus\
  \ javanicus* 21–23cm\n**野外记录：** 经常在中中层的小群中出现，移动缓慢。**鸣声：** 一声尖锐的 `wheeoo`，随后是一连串急促、上升的音符；还有鼻音的\
  \ `whee-u`、下降的 `kyeeow`、滚动的 `keowrr` 以及尖叫的 `keek-eek-eek`。**栖息地：** 各种类型的森林，通常靠近溪流和河流。**分布：**\
  \ 栖息于苏门腊岛、爪哇和婆罗洲。\n\n### 4 黑黄宽嘴喙\n*Eurylaimus ochromalus* 13–15cm\n**野外记录：** 通常在中上层成小群觅食。通常静静地坐着，然后进行短距离俯冲，从叶片上捕捉昆虫。**鸣声：**\
  \ 一系列快速、急促的音符，开始缓慢后逐渐加速；还有 `kyeeow` 和 `keowrr`。**栖息地：** 从低地到丘陵的各种森林。**分布：** 栖息于苏门腊岛和婆罗洲。\n\
  \n### 5 民兰肉冠宽嘴喙（肉冠宽嘴喙）\n*Sarcophanops steerii* 16–17cm\n**野外记录：** 在森林的中层和下层觅食，单独、成对或成小群。通常看到它们短距离俯冲以啄取昆虫或在飞行中捕捉。有时是混合物种觅食群的一员。**鸣声：**\
  \ 哀伤的哨声。**栖息地：** 雨林、龙热叶林、混龙热叶林和山坡次生林；偶尔出现在红树林和灌木林。**分布：** 菲律宾南部民兰老岛特有。\n\n### 6\
  \ 维萨亚亚宽嘴喙（维萨亚宽嘴喙）\n*Sarcophanops samarensis* 16–17cm\n**野外记录：** 曾被视为前一种物种的亚种；行为相似。**鸣声：**\
  \ 昆虫般的 `tik tik t-rrrrrrrr`。**栖息地：** 原生林，通常靠近石灰岩露头。**分布：** 菲律宾中部萨马岛、莱特岛和波霍岛特有。\n\
  \n### 7 银胸宽嘴喙\n*Serilophus lunatus* 18cm\n**野外记录：** 成对或小群觅食，从树枝或叶片上啄取猎物；也会在飞行昆虫后进行短距离空中俯冲。**鸣声：**\
  \ 柔和、悦的 `chir-r-r-r`；还有吱吱的 `ki-uu`。**栖息地：** 开阔的丘陵森林、溪流和河流。**分布：** 栖息于苏门腊岛。\n\n###\
  \ 8 长尾宽嘴喙\n*Psarisomus dalhousiae* 28cm\n**野外记录：** 以松散的小群出现；通过啄取或在飞行昆虫后进行短距离俯冲觅食。**鸣声：**\
  \ 响亮而尖锐的 `tseeay-tseeay-tseeay-tseeay`… `pseew-pseew-pseew-pseew`…或 `piu-piu-piu-piu`。**栖息地：**\
  \ 原生林和次生林。**分布：** 栖息于苏门腊岛和婆罗洲。\n\n### 9 绿宽嘴喙\n*Calyptomena viridis* 18cm\n**野外记录：**\
  \ 安静；主要在下层和林下觅食，偏好果实无果。**鸣声：** 柔和的泡泡般的颤音，节奏逐渐加快；还有像蛙一样的泡泡声 `oo-turr`。**栖息地：** 低地原生林。**分布：**\
  \ 栖息于苏门腊岛和婆罗洲。\n\n### 10 豪宽嘴喙\n*Calyptomena hosii* 20cm\n**野外记录：** 在下层觅食，单独或成对，或在果树上成小群。**鸣声：**\
  \ 柔和的、鸽子般的咕声。**栖息地：** 丘陵和亚山森林。**分布：** 婆罗洲特有。\n\n### 11 白头宽嘴喙\n*Calyptomena whiteheadi*\
  \ 25cm\n**野外记录：** 在果树上觅食，单独、成对或有时成嘈闹的小群。偶尔加入混合物种觅食群。**鸣声：** 响亮、尖锐的 `eek eek eek`、`wark\
  \ wark wark` 和像啄木鸟的咯哒声。**栖息地：** 山地森林和森林边缘。**分布：** 婆罗洲特有。\n\n![image](img/page205.jpg)\n\
  \n96 蜜吃鸟\n\n### 2 墨耳嘴雀\n*Myza celebensis* 17cm\n**野外记录：** 在花树上觅食，并在藤蔓、树枝和叶片上啄取，主要在树冠层。通常单独或成对。**鸣声：**\
  \ 一系列啾啾的吱吱声，或纤细、尖锐的 `pst` 或 `pst-pst`；还有尖锐、粗鲁的 `tsreet`。**栖息地：** 山地森林。**分布：** 苏拉威锡岛特有。\n\
  \n### 2 白耳嘴雀\n*Myza sarasinorum* 20cm\n**野外记录：** 活跃且显著。在花上觅食并从植物上啄取节肢动物。`M`. `s`.\
  \ `chionogenys` (2b) 出于苏拉威锡岛北部和南部。**鸣声：** 叫声包括高音 `kik` 或 `kuik`、鼻音的 `tuck` 以及进食时\
  \ 3–5 声喘息的、高音音符；歌声由一系列高音吱吱声组成。**栖息地：** 山地森林。**分布：** 苏拉威锡岛特有。\n\n### 3 灰嘴雀\n*Myzela\
  \ blasii* 11–12cm\n**野外记录：** 在树冠层觅食。**鸣声：** 未记录。**栖息地：** 低地山地。**分布：** 巽他群岛。\n\n\
  ### 4 暗色嘴雀\n*Myzela rubincta* 13cm\n**野外记录：** 在小群中单独觅食。**鸣声：** 纤细的高音 `tsut-sit`。**栖息地：**\
  \ 原生林。**分布：** 哈尔马黑拉岛和比萨岛。\n\n### 5 绯冠嘴雀\n*Myzela kueni* 11cm\n**野外记录：** 在茂密的灌木丛到树冠层觅食，单独或成对；也是混合物种群的一员。**鸣声：**\
  \ 高音 `tsiew-tsiew`。**栖息地：** 低地季风林、高次生林、稀疏林和灌木丛。**分布：** 韦塔岛特有。\n\n### 6 桑巴嘴雀\n*Myzela\
  \ dammarni* 11cm\n**野外记录：** 经常单独、成对或成小群出现。**鸣声：** 未记录。**栖息地：** 原生林、森林边缘。**分布：**\
  \ 西巽他群岛。\n\n### 7 班达嘴雀\n*Myzela boiei* 9–12cm\n**野外记录：** 单独、成对或有时成小群。**鸣声：** 未记录。**栖息地：**\
  \ 封闭原生林、高大次生林和红树林。**分布：** 摩鹿卢喀群岛南部特有。\n\n### 8 苏拉威锡嘴雀\n*Myzela chloroptera* 9–12cm\n\
  **野外记录：** 独自、成对或成小群发现；经常是混合物种群的一员。**鸣声：** 响亮的重复 `peeeew`、`treeu`、快速的 `tuedu` 以及短促的高音鸣唱或啾啾声。**栖息地：**\
  \ 原生山地和高次生林。**分布：** 苏拉威锡岛、苏拉群岛。\n\n### 9 瓦科洛嘴雀\n*Myzela wakoloensis* 9–12cm\n**野外记录：**\
  \ 单独、成对或成小群出现；也在花树上与混合物种群一起觅食。**鸣声：** 未记录。**栖息地：** 原生林和高次生林。**分布：** 布鲁岛和塞拉姆岛特有。\n\
  \n### 10 红臀嘴雀（黑胸嘴雀）\n*Myzela vulnerata* 10–11cm\n**野外记录：** 花丛中活跃的觅食者。**鸣声：** 微弱的昆虫般的\
  \ `sit-sit-sit`，还有快速重复的 `tipa-tipa-tipa`。**栖息地：** 次生季风林和灌木丛。**分布：** 帝汶岛特有。\n\n97\
  \ 蜜吃鸟\n\n### 1 鳞冠蜜吃鸟\n*Lichmera lombokia* 13–15cm\n**野外记录：** 在下层到树冠的花树上觅食；单独、成对或成小群；也是混合物种觅食群的一员。**鸣声：**\
  \ 一系列快速重复的叽喳音符。**栖息地：** 原生林和退化森林、森林边缘、稀疏林地和灌木丛。**分布：** 西巽他群岛特有。\n\n\n\n\n\n## 2\
  \ 橄榄石蜜莺\n*Lichmera argentauris* 13–16cm 野外笔记：在花树上觅食，单独、成对或成小群。鸣声：粗哑的 `zhip` 声。栖息地：沿海\
  \ `Casuarina` 树、椰子树和灌丛。分布：留在马鲁古群岛。\n\n## 3 印度尼西亚石蜜莺\n*Lichmera limbata* 15cm 野外笔记：喧闹且具有攻击性。在花树和灌木中是活跃、动作敏捷的觅食者。通常单独、成对或成小群出现。鸣声：各种响亮的断续音、快速的哨声和粗鲁的叽鸣。栖息地：季风林、次生林、红树林、灌丛、林木稀疏的耕地和园林。分布：留在巴厘岛和小巽达群岛。\n\
  \n## 4 鳞胸石蜜莺\n*Lichmera squamata* 14–15cm 野外笔记：喧闹且引人注目。在花树上觅食，也从叶片背面采集昆虫。鸣声：下滑的\
  \ `chirrup`、上扬的 `chirrup` 或 `chisip`、哨音般的 `tsi-tsi-tsi`、类似起伏的 `whitcheo whitcheo\
  \ whitcheo`……以及一声响亮的、下降的颤音。栖息地：沿海和低地次生季风林、红树林、林木稀疏的耕地、椰子园和树木稀散的村庄。分布：特有东马鲁古群岛和东小巽群岛。\n\
  \n## 5 布鲁石蜜莺\n*Lichmera deningeri* 15–16cm 野外笔记：通常单独或成对出现；在 `Rhododendron` 花或其他花植物上觅食时，可能与瓦科洛黑蜜雀（图\
  \ 96）伴在一起。鸣声：柔和的 `kew-kew-kew` 声。栖息地：原生林、选择性采伐和受干扰的森林、高大次生林和灌丛。分布：特有南马鲁古群岛布鲁岛。\n\
  \n## 6 塞拉姆石蜜莺\n*Lichmera monticola* 14–17cm 野外笔记：通常成小群在花树和灌木中觅食。鸣声：重复的 `tshoek tschoek\
  \ tschoek`，非常像欧洲黑鸫（`Turdus merula`）的叫声。栖息地：山地森林和山地石林。分布：特有南马鲁古群岛塞拉姆岛。\n\n## 7 黄耳石蜜莺（焰耳石蜜莺）\n\
  *Lichmera flavicans* 12–14cm 野外笔记：在中层上部的花朵上觅食，单独或成对。鸣声：一系列短促、极快的、泡般的哨音，和柔和的、鼻性的\
  \ `bzz` 声。其他短语包括 `ik-a-blik`、`ze-plerk` 和 `klook-klook`；还会发出粗鲁的、咯咯般的歌声，包含各种铃声般的短句。栖息地：低地到山地的森林、滨水林、次生林、开放的\
  \ `Eucalyptus` 森林和森林边缘。分布：特有东小巽群岛的帝汶汶岛。\n\n## 8 黑颈环石蜜莺\n*Lichmera notabilis* 13–15cm\
  \ 野外笔记：单独、成对或在混合物种觅食群中出现；在树冠的花朵和藤蔓丛中觅食。鸣声：未有记录。栖息地：低地季风林、沿海灌丛、过度生长的耕地、高大次生林和园林。分布：特有东小巽群岛的韦塔岛。\n\
  \n![image](img/page209.jpg)\n\n## 98 蜜莺类；寿嘴类\n\n## 1 纹胸石蜜莺\n*Meliphaga reticulata*\
  \ 15–16cm 野外笔记：喧闹。喜好在 `Eucalyptus` 树的花朵上觅食，单独、成对或成小群。鸣声：一系列哀伤的、上扬的 `wheep` 音，开始很快后变慢；还有快速重复的、高音的\
  \ `wik-wik-wik`……或 `week-week-week`，以及较低的 `work-work`。栖息地：原生和次生落叶林及常绿林、退化森林、灌丛和半耕作区、城市园林和红树林。分布：特有小巽达群岛的塞拉姆岛和帝汶岛。\n\
  \n## 2 白条纹寿嘴鸟\n*Melitograis gilolensis* 23cm 野外笔记：在花树和灌木丛上觅食，也采集无脊椎动物食物；通常单独、成对或成小群出现。鸣声：不悦耳的音调，中等偏高音；还有一声粗鲁的、摩擦音。栖息地：低地和山地森林、森林边缘、草原和耕地中的残存森林、选择性采伐林、恢复林、红树林和椰子园。分布：特有北马鲁古群岛。\n\
  \n## 3 帝汶寿嘴鸟\n*Philemon inornatus* 24cm 野外笔记：喧闹、引人注目且具有攻击性。在树冠层觅食，单独、成对或成小群。鸣声：歌声是中等响亮音的混合，包括一系列快速的\
  \ `t-chika-wook` 音；还会发出一系列起伏的音调，通常在歌声前出现。栖息地：原生和次生季风林、开放林地、开放灌丛，以及偶尔出现的林木稀疏的耕地。分布：特有东小巽群岛的帝汶岛。\n\
  \n## 4 灰喉寿嘴鸟\n*Philemon rubicollis* 25cm 野外笔记：喧闹、引人注目且具有攻击性。在树冠层觅食，单独、成对或成小群。鸣声：歌声是中等响亮音的混合，包括一系列快速的\
  \ `t-chika-wook` 音；还会发出一系列起伏的音调，通常在歌声前出现。栖息地：原生和次生季风林、开放林地、开放灌丛以及偶尔出现的林木稀疏的耕地。分布：特有东小巽群岛的帝汶岛。\n\
  \n## 5 灰腹寿嘴鸟\n*Philemon fuscapillus* 30cm 野外笔记：通常成小群在花树和灌木中觅食。鸣声：重复的 `tshoek tschoek\
  \ tschoek`，非常像欧洲黑鸫（`Turdus merula`）的叫声。栖息地：山地森林和山地石林。分布：特有南马鲁古群岛的塞拉姆岛。\n\n## 6 黑脸寿嘴鸟\n\
  *Philemon moluccensis* 31–37cm 野外笔记：单独或成对出现，在树中觅食。鸣声：包括响亮的、流动的 `yio`、短促的 `kawah`\
  \ 和单音。栖息地：低地和山地森林。分布：特有南马鲁古群岛的布鲁岛。\n\n## 7 塔尼巴寿嘴鸟\n*Philemon plumigenis* 31–37cm\
  \ 野外笔记：单独或成对出现，在树中觅食。鸣声：一对响亮的二唱：第一只鸟 `seeow`，随后是第二只鸟泡般的号声。栖息地：所有类型的林区，包括果园。分布：特有东小巽群岛的塔尼巴岛。\n\
  \n## 8 塞拉姆寿嘴鸟\n*Philemon subcorniculatus* 35cm 野外笔记：单独或成对出现，在树中觅食。喧闹。鸣声：爆发性的 `pprow`\
  \ 或 `prrt`；还有响亮的 `gock` 或 `geck` 以及单音。栖息地：森林、森林边缘、红树林和果园。分布：特有南马鲁古群岛的塞拉姆岛。\n\n##\
  \ 9 冠寿嘴鸟\n*Philemon buceroides* 32–36cm 野外笔记：在花树和果树上觅食，单独、成对或成小群。喧闹。鸣声：一系列低音的、鼻性的音。栖息地：所有类型的林区，包括人类居住区周围。分布：留在巽达群岛。\n\
  \n\n\n\n\n# 3 蓝翅绿雀\n*Chloropsis cochinchinensis* 16–18cm 野外笔记：昆虫、果实和花蜜的敏捷搜寻者；经常是混种食群的一员。*C.*\
  \ *c.* *viridinucha* (3b) 居住在婆罗洲；*C.* *c.* *moluccensis* (3c) 分布于苏门答腊及其卫星岛以及纳塔纳群岛。声音：各种甜美悦律的音符；也会模仿其他物种。栖息地：落叶和阔叶常绿林、森林边缘和次生林。分布：居住在苏门答腊、爪哇和婆罗洲。\n\
  \n# 4 婆罗洲绿雀\n*Chloropsis kinabaluensis* 17cm 野外笔记：独居、成对或小群体觅食；在果实树的冠层觅食。声音：高频的啾鸣和快速重复的\
  \ `chit chit chit`。栖息地：成熟且再生良好的中、上高山森林。分布：婆罗洲特有。\n\n# 5 大绿绿雀\n*Chloropsis sonnerati*\
  \ 20–23cm 野外笔记：经常出没于中上层，单只或成对；有时构成混种食群的一部分。声音：悦耳的哨声，间杂着短促的叽喳声；也沉迷于模仿。栖息地：低地常绿林、泥炭沼泽林、生长良好的次生林，偶尔出现在高红树林。分布：居住在苏门答腊、爪哇、巴厘和婆罗洲。\n\
  \n# 6 苏门答腊绿雀\n*Chloropsis media* 17–19cm 野外笔记：据报道在树冠层取食无花果，其他记录较少。声音：圈养鸟的歌声被记录为响亮且旋律极其丰富。栖息地：低地常绿林和次生林、种植园和果园。分布：苏门答腊特有。\n\
  \n# 7 小绿绿雀\n*Chloropsis cyanopogon* 16–19cm 野外笔记：在树冠层觅食，单只、成对或作为混种食群的一部分。声音：响亮、多样的丰富鸣唱短语序列，包括深沉、柔和的音符。栖息地：阔叶常绿林、开阔森林以及森林边缘和空地。分布：居住在苏门答腊和婆罗洲。\n\
  \n# 8 蓝脸绿雀\n*Chloropsis venusta* 14cm 野外笔记：在冠层觅食，通常成对，尽管也有过小群体觅食的记录。声音：未描述。栖息地：成熟的低地和中高山森林、森林边缘和空地。分布：苏门答腊特有。\n\
  \n# 9 黄喉绿雀\n*Chloropsis palawanensis* 15–17cm 野外笔记：较难以寻见，最好通过叫声定位。在树冠层觅食，单只或作为混种食群的一部分。声音：鸣啭般的\
  \ `zo-o zo-o` 和有节奏的 `twick err treet`。栖息地：低地常绿林边缘和次生林。分布：西菲律宾特有。\n\n# 10 菲律宾绿雀\n\
  *Chloropsis flavipennis* 18–19cm 野外笔记：在冠层觅食，单只或成对。通常难以寻见，最好通过叫声定位。声音：哨音般的 `chick`\
  \ `weeeeep` 和哨音般的 `chick-ur-treet`。栖息地：低地常绿林、次生林以及森林边缘。分布：南菲律宾特有。\n\n![image](img/page213.jpg)\n\
  \n## 100 鹎类；飞鸸；伯劳\n\n# 1 黄腹鹎\n*Gerygone sulphurea* 10–11cm 野外笔记：进行短距离空中俯冲以捕获受惊扰的昆虫，也会从树冠层或中层的叶子上啄食昆虫。声音：各种高频哨声、一个上升的\
  \ `chu-whee` 和一系列长长的喘息般的 `whiz` 音符。栖息地：红树林、海岸灌木丛、淡水沼泽林、种植园、公园和花园。分布：居住在苏门答腊、爪哇、巴厘、婆罗洲、菲律宾、苏拉威锡和小巽他群岛。\n\
  \n# 2 普通鹎\n*Gerygone inornata* 10cm 野外笔记：中层和下冠层的活跃觅食者；经常是混种食群的一部分。声音：优美、下降的 16–18\
  \ 声成对音，`poo-pii`、`pee-pee`、`po-po`、`po-pu`，类似于快速的铃声。栖息地：低地和山的原生及次生季风林、林地灌木丛和红树林。分布：小巽他群岛特有。\n\
  \n# 3 侧腹鹎\n*Gerygone dorsalis* 10cm 野外笔记：通常成对出现，在中层的叶片和藤蔓丛中啄食食物。声音：一系列半颤音的平音音符，还有一组不慌的、略微鸣啭的音符。栖息地：海岸和低地森林、次生林、森林边缘、部分开垦地区、林木稀疏的耕地和红树林。分布：在东摩鹿加、东小巽他群岛和弗罗斯海岛屿居住。\n\
  \n# 4 黄腹飞鸸（坦姆巴飞鸸）\n*Microeca hemixantha* 12cm 野外笔记：通常利用暴露的树枝或头上的电线发动短距离俯冲捕捕飞行昆虫；也会与混种食群一起觅食。声音：各种杂的鸣声。栖息地：低地森林。分布：小巽他群岛特有。\n\
  \n# 5 虎纹伯劳（厚喙伯劳）\n*Lanius tigrinus* 17cm 野外笔记：比伯劳更多栖息在遮蔽处。从叶子上捕食昆虫。声音：重复的 `cha`\
  \ 和尖锐的 `chik`。栖息地：开阔森林。分布：冬季苏门答腊、爪哇和婆罗洲。\n\n# 6 棕伯劳\n*Lanius cristatus* 18cm 野外笔记：吵闹、不安。在暴露的栖息处捕猎昆虫。*L.\
  \ c.* *lucionensis* (6b) 冬迁在菲律宾和苏拉威锡。声音：粗鲁的 `r-ri`。栖息地：开阔林地。分布：广布冬季候客。\n\n# 7 山伯劳\n\
  *Lanius validirostris* 20–23cm 野外笔记：通常单只或成对出现。从暴露的栖息处俯冲捕获地面或附近的猎物。*L. v.* *tertius*\
  \ (7b) 出现在民兰老岛的山区。声音：一系列粗鲁的哨音 `pia` 或 `chaao`。栖息地：山地空地。分布：菲律宾特有。\n\n# 8 长尾伯劳\n*Lanius\
  \ schach* 24cm 野外笔记：侵略性。它的可能包括模仿。*L. s.* *nasutus* (8b) 居住在菲律宾，是婆罗洲候客；`fuscatus`\
  \ (8c) 可能冬季迁至婆罗洲。声音：包括粗鲁的 `tchick` 和责备的 `chaak-chaak`。栖息地：开阔林地。分布：居住在苏门答腊、爪哇、巴厘、菲律宾和小巽他群岛。\n\
  \n# 9 草原伯劳\n*Lanius pallidirostris* 25cm 野外笔记：显著栖息在灌木、岩石或电线上，从那里发动俯冲捕获地面或附近的猎物。声音包括重复的\
  \ `kwi-wide`、`sheenk-sheenk` 或 `shihk-shihk`。栖息地：散布灌木的开阔地区。分布：婆罗洲候客。\n\n## 101 哨鸟\n\
  \n# 1 鹳（黄颊哨）\n*Hylocitrea bonensis* 14–15cm 野外笔记：不显眼。在中层和下层觅食，单只、成对或作为混种食群的一部分。*H.*\
  \ *b.* *bonthaina* (1b) 位于苏拉威锡西南部的隆波巴塔山。声音：纤细、高频的嗡嗡音；也会发出响亮的管状叫声。栖息地：山地森林，尤其是苔林。分布：苏拉威锡特有。\n\
  \n# 2 红背哨鸟\n*Coracornis raveni* 15cm 野外笔记：胆怯且躲避。通常成对或单只出现，从亚下层到中中层觅食。声音：重复的、响亮的、爆发性的鞭子声叫声。栖息地：山地森林。分布：苏拉威锡特有。\n\
  \n\n\n\n# 3 SANGIHE SHRIKE-THRUSH\n`Coracornis sanghirensis` 17–19cm\nFIELD NOTES:\
  \ Forages in the middle and upper storey, also in dense rattan undergrowth and occasionally\
  \ on the ground. VOICE: Song is loud and consists of repeated ten-second-long phrases;\
  \ also a lisping `chweep chweep`. HABITAT: Lower montane primary forest and well-established\
  \ secondary forest. DISTRIBUTION: Endemic to Sangihe Island, north of Sulawesi.\n\
  \n# 4 MANGROVE WHISTLER\n`Pachycephala cinerea` 17cm\nFIELD NOTES: Unobtrusive and\
  \ sluggish; gleans insects from branches and trunks. Juvenile has rusty edges to\
  \ wing-coverts and secondaries. VOICE: A loud, whistled `oo-oo-oo-oo chew-it` or\
  \ similar; in W Philippines, utters a whistled `peeee pur-purr chiaoonkk` or `peee\
  \ pur chiaoonkk`, the last note ending abruptly. HABITAT: Mangroves and nearby vegetation,\
  \ forest, riverine vegetation, plantations and wooded gardens. DISTRIBUTION: Resident\
  \ in Sumatra, Java, Bali, Borneo, the W Philippines and Lombok in the W Lesser Sundas.\n\
  \n# 5 ISLAND WHISTLER\n`Pachycephala phaionota` 16cm\nFIELD NOTES: Skulking. Forages\
  \ in the shady understorey, singly or in pairs. VOICE: A loud `weet-chuw-weeEEee`,\
  \ busy `chup` calls and nasal notes. HABITAT: Mangroves, coastal woodland, beach\
  \ scrub, secondary scrub and plantations. DISTRIBUTION: Resident in the Moluccas.\n\
  \n# 6 WHITE-VENTED WHISTLER\n`Pachycephala homeyeri` 16–17cm\nFIELD NOTES: An inconspicuous\
  \ bird. Generally occurs singly or as part of mixed-species feeding parties. `P.`\
  \ `h`. `winchelli` (6b) occurs in the WC Philippines. VOICE: Various whistles, including\
  \ `oo-wichee`, `yump`, `yump-wit` and `u-wichee-u`…; also a high-pitched `wheeu\
  \ tu tu tu` or similar. HABITAT: Forests, from sea-level to mountains. DISTRIBUTION:\
  \ Resident in the Philippines and islands off NE Borneo.\n\n# 7 GREEN-BACKED WHISTLER\n\
  `Pachycephala albiventris` 16cm\nFIELD NOTES: Shy, foraging quietly in the canopy\
  \ or understorey; seen singly, in pairs or as a member of mixed-species feeding\
  \ groups. VOICE: A loud, metallic `peee` or `peee-wit`, repeated frequently. HABITAT:\
  \ Forests, from lowlands to high mountains. DISTRIBUTION: Endemic to the Philippines.\n\
  \n# 8 BORNEAN WHISTLER\n`Pachycephala hypoxantha` 16cm\nFIELD NOTES: Forages in\
  \ the middle to upper canopy, often as part of mixed-species feeding parties. Captures\
  \ prey by gleaning or during fly-catching sallies. VOICE: A whistled `dee-dee-dee-dee-dit`,\
  \ the last note like a whip-crack. HABITAT: Montane forests. DISTRIBUTION: Endemic\
  \ to Borneo.\n\n# 9 SULPHUR-VENTED WHISTLER\n`Pachycephala sulfuriventer` 14–15cm\n\
  FIELD NOTES: Encountered singly, in pairs or as part of mixed-species feeding parties;\
  \ forages mainly in the mid-storey, on trunks or large branches. VOICE: A whistled\
  \ `wiwiwiwiwiwiuWHIT` that decreases in pitch and increases in volume; also a short,\
  \ staccato `wheeu tu tu tu`. HABITAT: Primary and secondary forest and forest edges.\
  \ DISTRIBUTION: Endemic to Sulawesi.\n\n# 10 YELLOW-BELLIED WHISTLER\n`Pachycephala\
  \ philippinensis` 15–16cm\nFIELD NOTES: An inconspicuous bird. Forages from the\
  \ understorey to the canopy, singly, in pairs or as part of mixed-species feeding\
  \ flocks. `P`. `p`. `apoensis` (10b) occurs in the EC and S Philippines. VOICE:\
  \ A repeated, rising `peeeeeup`; also gives a forceful `hu-i-yu wit weeu`. HABITAT:\
  \ Forests, from sea-level to mountains. DISTRIBUTION: Endemic to the Philippines.\n\
  \n![image](img/page217)\n\n## 102 GREY WHISTLER\n`Pachycephala simplex` 15–16cm\n\
  FIELD NOTES: Forages in the mid-storey, on trunks or large branches. VOICE: A whistled\
  \ `wiwiwiwiwiwiuWHIT` that decreases in pitch and increases in volume; also a short,\
  \ staccato `wheeu tu tu tu`. HABITAT: Primary and secondary forest and forest edges.\
  \ DISTRIBUTION: Endemic to Sulawesi.\n\n## FAWN-BREASTED WHISTLER\n`Pachycephala\
  \ orpheus` 14cm\nFIELD NOTES: A whistled `dee-dee-dee-dee-dit`, the last note like\
  \ a whip-crack. HABITAT: Montane forests. DISTRIBUTION: Endemic to Borneo.\n\n##\
  \ RUSTY-BREASTED WHISTLER\n`Pachycephala fulincta` 16cm\nFIELD NOTES: Forages in\
  \ the middle to upper canopy, often as part of mixed-species feeding parties. VOICE:\
  \ A whistled `dee-dee-dee-dee-dit`, the last note like a whip-crack. HABITAT: Montane\
  \ forests. DISTRIBUTION: Endemic to Borneo.\n\n## 102 GREY WHISTLER\n`Pachycephala\
  \ simplex` 15–16cm\nFIELD NOTES: Forages in the mid-storey, on trunks or large branches.\
  \ VOICE: A whistled `wiwiwiwiwiwiuWHIT` that decreases in pitch and increases in\
  \ volume; also a short, staccato `wheeu tu tu tu`. HABITAT: Primary and secondary\
  \ forest and forest edges. DISTRIBUTION: Endemic to Sulawesi.\n\n## RUSTY-BREASTED\
  \ WHISTLER\n`Pachycephala fulincta` 16cm\nFIELD NOTES: Forages in the middle to\
  \ upper canopy, often as part of mixed-species feeding parties.\n\n## YELLOW-THROATED\
  \ WHISTLER\n`Pachycephala hypoxantha` 16–19cm\nFIELD NOTES: An inconspicuous bird.\
  \ Forages from the understorey to the canopy, singly, in pairs or as part of mixed-species\
  \ feeding flocks.\n\n## `Pachycephala albiventris` 16cm\nFIELD NOTES: Shy, foraging\
  \ quietly in the canopy or understorey; seen singly, in pairs or as a member of\
  \ mixed-species feeding groups. VOICE: A loud, metallic `peee` or `peee-wit`, repeated\
  \ frequently.\n\n## YELLOW-BELLIED WHISTLER\n`Pachycephala philippinensis` 15–16cm\n\
  FIELD NOTES: An inconspicuous bird. Forages from the understorey to the canopy,\
  \ singly, in pairs or as part of mixed-species feeding flocks.\n\n\n\n\n# 1 瘦嘴鸦\n\
  *Corvus enca* 43–47cm\n野外记录：通常以小群形式出现，在树冠中觅食或在树冠上方飞行。\n鸣声：变化多变，包括高调的 `ahk-ahk-ahk`、鼻性的\
  \ `werk-werk-werk` 以及 `whaaa-whaaa-whaaa`。\n栖息地：森林、森林边缘和次生林。\n分布：栖于苏门答腊、爪哇、巴厘岛、婆罗洲、菲律宾、苏拉威西、苏拉群岛和北马卢克群。\n\
  \n# 2 紫鸦\n*Corvus violaceus* 40–42cm\n野外记录：通常成对或成小群活动；经常袭击正在成熟的玉米地。曾被认为是前述一种物种的亚种。\n\
  鸣声：短促的鼻性吠声，单独发出或以 2–3 个音节的形式。\n栖息地：森林、半开阔地带和农田。\n分布：塞拉姆岛特有。\n\n# 3 家鸦（印度家鸦）\n*Corvus\
  \ splendens* 40cm\n野外记录：胆大，非常群社交性，通常成小群结结。\n鸣声：平扁、干燥的 `kaaa-kaaa`。\n栖息地：在港口周围很常见；也出现在村庄、城镇和耕作区。\n\
  分布：栖于婆罗洲西北部。\n\n# 4 噪鸣鸦\n*Corvus typicus* 19–20cm\n野外记录：胆害羞且非常紧张，飞行时伴随着嘈杂呼啸的翅膀扇动声。经常成小群出现。\n\
  鸣声：刺耳、尖锐的叫声；还有三个上扬的哨声后跟着一声乌鸦叫，以及各种嘎吱声和颤鸣音。\n栖息地：森林边缘和带有空地的开阔林地。\n分布：苏拉威西岛中部和南部特有。\n\
  \n# 5 班加凯黑鸦\n*Corvus unicolor* 39cm\n野外记录：信息较少，仅通过两个旧标本已知。可能是森林丘陵中隐秘的鸟类。\n鸣声：未知。\n\
  栖息地：推定为丘陵森林。\n分布：苏拉威西岛附近的班加凯岛特有。\n\n# 6 长嘴鸦\n*Corvus validus* 46–48cm\n野外记录：通常成对或成小群出现，主要在树冠层可见；经常从最顶端的枝头鸣叫。\n\
  鸣声：响亮、短促、干燥、沙哑的 `cruk`… `cruk`… `cruk`… `cruk`。\n栖息地：森林。\n分布：北马卢克特有。\n\n# 7 弗罗里斯鸦\n\
  *Corvus florensis* 40cm\n野外记录：通常单独或成对出现，偶尔发现小群群；经常出没于树冠或亚树冠。\n鸣声：高调、下行的、沙哑的 `cwaaa`、`cawaraa`\
  \ 或 `waak`；还有破裂声或咕噜声 `pol-ok` 或 `burr-ok`。\n栖息地：原生林、高大的次生林以及受干扰的潮湿和半落叶低地和丘陵森林；偶尔出现在残存林斑和林稀疏地区。\n\
  分布：西小巽达腊群岛的弗罗里斯岛特有。\n\n# 8 大嘴鸦\n*Corvus macrorhynchos* 41–49cm\n野外记录：可见个体、成对或成小群。既食腐肉也捕活猎物。\n\
  鸣声：沙哑的 `kyarrh kyarrh`、`kyearh kyearh`、`kaaa-kaaa` 或 `weerrk weerrk weerk`。\n栖息地：开阔森林和林地、红树林、开阔地和人类居住区附近。\n\
  分布：栖于苏门答腊、爪哇、巴厘岛、菲律宾和小巽达腊群岛。婆罗洲的罕见访客。\n\n# 9 多雷西亚鸦\n*Corvus orru* 39cm\n野外记录：单独、成对或成小群出现。经常在路边觅食。\n\
  鸣声：8–14 声鼻性的 `uk` 音，以 `uk-ohw` 结束；还有各种粗哑的鸣声或 `uk` 音。\n栖息地：开阔沿海地区、林木稀疏的耕地以及村庄或城镇附近的林地。\n\
  分布：栖于北马卢克和小东巽达腊群岛。\n\n![image](img/page221.jpg)\n\n# 104 灰雀；松鹊；山雀类\n\n## 1 冠凤鹊\n\
  *Platylophus galericulatus* 31–33cm\n野外记录：通常成对或成小群出现，在低、中层树冠觅食。*P.* *g.* *coronatus*\
  \ (1b) 见于苏门答腊和婆罗洲。\n鸣声：兴奋的、断续的、咯哒的响声；还有单声的 `chik`，通常在叶丛中觅食时发出。\n栖息地：阔叶常绿林。\n分布：栖于苏门答腊、爪哇和婆罗洲。\n\
  \n## 2 黑松鹊\n*Platysmurus leucopterus* 39–41cm\n野外记录：通常成对或成小群活动。在从低层到高层的树冠中觅食。栖息时会反复点头低头。婆罗洲的亚种翅膀上缺少白色。\n\
  鸣声：嘈杂，词汇丰富，包括响亮且不和谐的 `keh-eh-eh-eh-eh`、铃铛般的 `tel-ope` 和 `kontingka-longk`；还有类似木琴声的\
  \ `xylophone-like`。\n栖息地：未提及。\n\n## 3 家松鹊（印度松鹊）\n*Corvus splendens* 40cm\n野外记录：胆大，非常有社交性，通常成小群结。\n\
  鸣声：平扁、干燥的 `kaaa-kaaa`。\n栖息地：在港口周围很常见；也出现在村庄、城镇和耕作区。\n分布：栖于婆罗洲西北部。\n\n## 4 噪鸣鸦\n\
  *Corvus typicus* 19–20cm\n野外记录：胆害且非常紧张，飞行时伴随着嘈杂呼啸的翅膀扇动声。经常成小群出现。\n鸣声：刺耳、尖锐的叫声；还有三个上扬的哨声后跟着一声乌鸦叫，以及各种嘎吱声和颤鸣音。\n\
