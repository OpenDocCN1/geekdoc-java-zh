  \ `xylophone-like`。\n栖息地：未提及。\n\n## 3 家松鹊（印度松鹊）\n*Corvus splendens* 40cm\n野外记录：胆大，非常有社交性，通常成小群结结。\n\
  鸣声：平扁、干燥的 `kaaa-kaaa`。\n栖息地：在港口周围很常见；也出现在村庄、城镇和耕作区。\n分布：栖于婆罗洲西北部。\n\n## 4 噪鸣鸦\n\
  *Corvus typicus* 19–20cm\n野外记录：胆害且非常紧张，飞行时伴随着嘈杂呼啸的翅膀扇动声。经常成小群出现。\n鸣声：刺耳、尖锐的叫声；还有三个上扬的哨声后跟着一声乌鸦叫，以及各种嘎吱声和颤鸣音。\n\
  栖息地：森林边缘和带有空地的开阔林地。\n分布：苏拉威西岛中部和南部特有。\n\n## 5 班加凯黑鸦\n*Corvus unicolor* 39cm\n野外记录：信息较少，仅通过两个旧标本已知。可能是森林丘陵中隐秘的鸟类。\n\
  鸣声：未知。\n栖息地：推定为丘陵森林。\n分布：苏拉威西岛附近的班加凯岛特有。\n\n## 5 爪哇松鹊\n*Cissa thassina* 31–33cm\n\
  野外记录：成小群活动。\n鸣声：未记录，推定与其他松鹊相似。\n栖息地：丘陵和山地森林。\n分布：爪哇岛特有。\n\n## 6 婆罗洲山雀\n*Dendrocitta\
  \ cinerascens* 40cm\n野外记录：嘈且显眼，通常成小群出现。\n鸣声：粗哑的 `shraank`。\n栖息地：山区森林、次生林和竹林。\n分布：婆罗洲特有。\n\
  \n## 7 苏门答腊山雀\n*Dendrocitta occipitalis* 40cm\n野外记录：在树冠层觅食。\n鸣声：铃铛般的叫声，推定与前述物种相似。\n\
  栖息地：山地和丘陵森林、种植园。\n分布：苏门答腊特有。\n\n## 8 凤尾山雀\n*Crypsirina temia* 31–33cm\n野外记录：稀少。通常单独、成对或成小群出现。在灌木丛、低层树冠和高下层中敏捷地觅食。\n\
  鸣声：高调、粗鲁、响亮的 `chu`；还有沙哑的 `churg-churg`、`grasp-grasp` 或 `chrrrk-chrrrk`。\n栖息地：森林、次生林和耕地。\n\
  分布：栖于爪哇和巴厘岛。\n\n![image](img/page223.jpg)\n\n# 105 标准翅；天堂鸦\n\n## 1 华莱标准翅\n*Semioptera\
  \ wallacii* 23–26cm\n野外记录：离开求偶场后通常单独或成对出现；也可能是混群觅食群的一部分。雄性通过华丽的飞行、跳跃和静态姿势进行求偶。\n\
  鸣声：广告声由一系列响亮、上扬、鼻性的 `wark` 音组成。\n栖息地：原生林和砍伐过的低地及丘陵森林。\n分布：北马卢克特有。\n\n## 2 天堂鸦\n\
  *Lycocorax pyrrhopterus* 40–44cm\n野外记录：隐秘，最好通过其鸣声定位；通常在果实树中觅食，单独、成对或偶尔成小群出现。\n鸣声：一种独特的、低沉的\
  \ `wu-wuk` 或 `woo-up krek`，以及响亮的 `wu-wnk` 或 `krek-kek`；还有吠声或沙哑的 `ekk`。\n栖息地：原生林和高大的次生林、耕地边缘灌丛、林木稀疏的耕地、椰子种植园和果园。\n\
  分布：北马卢克特有。\n\n\n\n\n\n### 3 婆罗洲冠�� *Pityriasis gymnocephala* 26cm\n**野外习记：** 通常以\
  \ 5–12 只鸟的群出现，在树木中层区域觅食；经常是物种混群食群的一部分。雌性侧腹有斑块状红色，雄性有时也如此。飞行时，初级羽上有一条白色翼带。\n**鸣声：**\
  \ 各种奇特的喷鼻声和口哨声，以及奇怪的鼻息喘鸣声；还会发出 `pit-pit-peeoo`，间杂着类似乌鸦的叫声。\n**栖息地：** 原始林和次生低地森林，尤其是泥炭沼泽森林。\n\
  **分布范围：** 婆罗洲特有。\n\n### 4 白胸蜂燕 *Artamus leucorynchus* 19cm\n**野外习记：** 群居性强，群体通常一起栖息在光秃的树顶树枝或电线上，从那里俯冲捕食飞行中的昆虫。\n\
  **鸣声：** 包含拟声的叽叽叽声；叫声包括沙哑的 `wek-wek-wek`、尖锐的 `pirt pirt` 以及 `git`、`geet` 或 `geet\
  \ geet`。\n**栖息地：** 开阔林地、森林空地、树木稀疏的开放区域、种植园以及人类居住区附近。\n**分布范围：** 该地区广泛分布。\n\n###\
  \ 5 黄背蜂燕 *Artamus monachus* 20cm\n**野外习记：** 成对或多达 20 只鸟的群体出现。栖息在森林空地或靠近森林的开阔地区的裸枝上，从那里短距离俯冲捕食昆虫；也会在滑翔飞行时捕食空中的昆虫。\n\
  **鸣声：** 一系列单音音节，比前两种物种更有金属感、更有穿透力。\n**栖息地：** 森林、森林边缘和森林空地。\n**分布范围：** 苏拉威西岛和苏拉群岛特有。\n\
  \n### 6 黑脸蜂燕 *Artamus cinereus* 18cm\n**野外习记：** 单独、成对或小群出现。栖息在低树枝、围栏、柱子和头顶电线上，从那里俯冲捕食飞行中的昆虫；滑翔时也会捕食昆虫。倾向于比其他蜂燕飞得更低。\n\
  **鸣声：** 拉长的 `tchiff-tchiff-tchiff` 联络声和柔和、啾啾的歌声，通常包含拟声。\n**栖息地：** 开阔林、灌木丛和耕地。\n\
  **分布范围：** 居住在东小巽丹群岛。\n\n### 7 林鹸 *Eupetes macrocerus* 29cm\n**野外习记：** 在森林地面觅食。走路时点头非常像鸡；也会在地面和倒倒的树枝间穿梭以捕捉无脊椎动物。\n\
  **鸣声：** 长长而单调的口哨声。\n**栖息地：** 阔叶常绿林。\n**分布范围：** 居住在苏门答腊和婆罗洲。\n\n### 8 喜鹊云雀 *Grallina\
  \ cyanoleuca* 26cm\n**野外习记：** 单独、成对或小群出现。主要在地面觅食，但也栖息在树上，从那里偶尔会俯冲捕食飞行中的昆虫。\n**鸣声：**\
  \ 双唱：第一只鸟发出 `tee-hee`，接着第二只鸟发出 `pee-o-wee` 或 `pee-o-wit`。还会发出流动的、柔和的 `cloop cloop\
  \ cloop` 或 `clue-weet clue-sweet`，在受惊时发出加强音的 `pee pee pee`。\n**栖息地：** 湿润草地、稻田、沼泽地区和草原。\n\
  **分布范围：** 居住在东小巽丹群岛和东南马鲁库群。\n\n![image](img/page225.jpg)\n\n## 106 黄鸟类\n\n### 1\
  \ 橄榄黄鸟 *Oriolus melanotis* 25cm\n**野外习记：** 通常通过鸣声最易发现。单独或成对出现，从中层到树冠层觅食。雌性是冠状寿鸎（图\
  \ 98）的视觉拟态。`O`。`m`。`finschi` (1b) 出于韦塔岛和阿陶罗岛。\n**鸣声：** 一种变化的、流动的、音乐般的三音节摇调，`ti-ti-lu-i`；还有粗鲁的鼻性责备声。\n\
  **栖息地：** 剩余的季风林斑块、次生季风林、开阔林地、部分林木化的耕地和红树林。\n**分布范围：** 小巽群岛特有。\n\n### 2 黑耳黄鸟 *Oriolus\
  \ bouroensis* 23–32cm\n**野外习记：** 独居或成对觅食，通常与黑脸寿鸎（图 98）混在一起活动；由于这种黄鸟是后者的视觉拟态者，因此很难将两者区分。\n\
  **鸣声：** 据说会模仿黑脸寿鸎，但尚未有确切记录。可能是流动的 `yio-wheea`。\n**栖息地：** 低地和山地森林、落叶季风林、次生林、红树林和林木稀疏的耕地。\n\
  **分布范围：** 南马鲁库群岛布鲁岛特有。\n\n### 3 丹尼巴黄鸟 *Oriolus decipiens* 23–32cm\n**野外习记：** 独居或成对觅食。曾被认为是黑耳黄鸟的一个亚种。丹尼巴寿鸎（图\
  \ 98）的视觉拟态者。\n**鸣声：** 响亮、大声、清晰且下调的音乐音符；还有清晰纯净的口哨声，起初低沉后升高。\n**栖息地：** 湿润的山地森林。\n\
  **分布范围：** 小巽群岛丹尼巴岛特有。\n\n### 4 暗褐黄鸟 *Oriolus phaeochromus* 26cm\n**野外习记：** 在高树树冠层觅食，单独出现，有时成群活动。是暗色寿鸎（图\
  \ 98）的视觉拟态者。\n**鸣声：** 多变的、流动的 `yio`。\n\n### 5 灰领黄鸟 *Oriolus forsteni* 31–32cm\n\
  **野外习记：** 单独或成对出现，有时作为物种混群的一员，通常位于树冠层。塞拉姆寿鸎（图 98）的视觉拟态者。\n**鸣声：** 3–4 声上升的流动音乐音符。\n\
  **栖息地：** 原始森林。\n**分布范围：** 南马鲁库群岛塞拉姆岛特有。\n\n### 6 绿黄鸟 *Oriolus flavinctus* 25–30cm\n\
  **野外习记：** 偏好树冠层。单独、成对或小群。\n**鸣声：** 快速的断奏；略显忧郁的 `chup-chup-chup`。\n**栖息地：** 季风林。\n\
  **分布范围：** 居住在小巽丹群岛。\n\n### 7 橄榄背黄鸟 *Oriolus sagittatus* 27cm\n**野外习记：** 吵闹——通常先听后见。在叶叶树冠层觅食节肢动物和果实。\n\
  **鸣声：** 滚动的、柔和的 `olly`、`olly-ole`、`urry-ole` 或 `olio`；还有粗鲁的责备声。\n**栖息地：** 开阔林地。\n\
  **分布范围：** 小巽丹群岛的客。\n\n### 8 暗喉黄鸟 *Oriolus xanthonotus* 20–21cm\n**野外习记：** 通常从中层到树冠层觅食；有时是物种混群的一部分，否则通常单独或成对出现。\n\
  **鸣声：** 美妙的笛子声 `tu-u-liu` 或 `peu-peu-peu-poh`，最后一个音符是下降的沙哑声。叫声是高音的哨声 `kyew`、`pheeu`。\n\
  **栖息地：** 原始和高大次生林、次生林和森林边缘。\n**分布范围：** 居住在苏门答腊、爪哇、婆罗洲和西菲律宾。\n\n![image](img/page227.jpg)\n\
  \n## 107 黄鸟类；果鸟\n\n### 1 菲律宾黄鸟 *Oriolus steerii* 20–21cm\n**野外习记：** 单独、成对以及偶尔成混群觅食，通常位于树冠层。`O`。`s`。`cinereogenys`\
  \ (1b) 居住在苏禄群岛。\n**鸣声：** 喇叭般的高音 `per-jek`，速度加快并重复；还会发出喇叭般的 `eeerk eeerk eeerk` 和\
  \ `hooooo-op`。\n**栖息地：** 森林、森林边缘和次生林。\n**分布范围：** 除北部外，菲律宾群岛特有。\n\n### 2 白额纹黄鸟 *Oriolus\
  \ albiloris* 20–21cm\n**野外习记：** 曾被认为是前一种物种的亚种；行为预计相似。\n**鸣声：** 略显忧郁的 `chow-wooooo`\
  \ 和快速的断奏 `chup-chup-chup`。\n**栖息地：** 森林、森林边缘和次生林。\n**分布范围：** 菲律宾北部特有。\n\n\n\n\n\n\
  ### 3 伊莎贝拉黄鎴\n*Oriolus isabellae* 20–21cm\n野外记录：非常稀有。在中层到树冠层间觅食，单只、成对或成小群，也作为混合物种觅食群的一部分出现。鸣声：未有记录。栖息地：低地雨林，尤其是密集的竹林；也有次生林和森林边缘。分布范围：菲律宾北部特有。\n\
  \n### 4 黑脑黄鎴\n*Oriolus chinensis* 27cm\n野外记录：树栖性，被结果树木吸引，单只、成对或在混合物种觅食群中。`O. c.\
  \ celebensis` (4b) 出现于苏拉威锡及北部海岸的岛屿；`O. c. melanisticus` (4c) 居住在塔劳德岛。鸣声：流动的、哨音般的\
  \ `luwee - wee - wee-leeow` 或类似声音；还有一种上扬的 `wheeeip`。栖息地：开阔林地、种植园、红树林、公园和花园。分布范围：留于苏门答腊、爪哇、巴厘、菲律宾、苏拉威锡、苏拉群岛、西小巽群岛、塔劳德岛和摩鹿答腊北部马渝岛；婆罗洲的客鸟。\n\
  \n### 5 黑脸黄鎴\n*Oriolus xanthornus* 25cm\n野外记录：主要是树栖，在树高处单只或成对觅食；偶尔降到地面捕食昆虫。有时加入混合物种觅食群。鸣声：悦耳、哨音般的\
  \ `why-you` 或 `why-you-you`，通常夹杂着粗哑的 `cheeahs` 和 `kwaaks`。栖息地：红树林、河流及沿岸森林、开阔林、次生林和耕地。分布范围：留于婆罗洲；苏门答腊北部和东冬客。\n\
  \n### 6 黑黄鎴\n*Oriolus hosii* 21cm\n野外记录：在树冠层觅食果实、浆果和无脊椎动物，单只、成对或成小群。鸣声：清晰且带有下调的哨声。栖息地：山林和苔藓过渡林。分布范围：婆罗洲特有。\n\
  \n### 7 红腹黄鎴\n*Oriolus cruentus* 23–25cm\n野外记录：从林下层到树冠层单只或成对觅食；经常加入混合物种觅食群。鸣声：短促而悦耳的叫声和生硬的\
  \ `kek kreo` 或 `ee-oo`；还会发出类似猫的 `keeeeu` 和紧张的 `hhsssu`。栖息地：阔叶常绿林。分布范围：留于苏门答腊、爪哇和婆罗洲。\n\
  \n### 8  帝汶果蜜�鸟（绿果蜜�鸟）\n*Sphecotheres viridis* 26cm\n野外记录：在结果树木和灌木中觅食，单只、成对或成群活动，并与其他食果物种共同活动。经常在树顶裸露处鸣叫。鸣声：沙哑感的金属颤音，由两个极短的短语组成。栖息地：原生林和高大的次生季风林、残留林块、林地、林耕地、红树林和灌丛。分布范围：小巽群岛东部特有。\n\
  \n### 9 韦塔蜜�鸟\n*Sphecotheres hypoleucus* 26cm\n野外记录很少；行为推测与前一种物种相似。鸣声：低沉、粗哑、鼻音且不悦耳的音调。栖息地：原生林和次生落叶季风林、林地和稀疏的灌丛。分布范围：小巽群岛东韦塔岛特有。\n\
  \n### 10 澳洲果蜜�鸟\n*Sphecotheres vieilloti* 27–30cm\n野外记录：主要在结果树中觅食，通常以约 20 只鸟为群活动。鸣声：高音、下降的哨声和短促、弱的沙沙颤音。歌声由\
  \ 3–5 声简单的哨音组成，最后一个音带有强烈的下调。栖息地：沿海次生林和相邻耕地。分布范围：留于摩鹿答腊东南部的凯群岛。\n\n![image](img/page229.jpg)\n\
  \n### 108 寿嘴留\n\n#### 1 巽他腊普通嘴留\n*Coracina larvata* 26–27cm\n野外记录：出没于树冠层，单只或成对；有时在混合物种觅食群中发现。`C.\
  \ l. melanocephala` (1b) 出现于苏门答腊。鸣声：粗哑而响亮的 `eeooo-eeooo-eeooo`、一声 `shreeok` 以及一种奇特的响亮、喘息的歌声。栖息地：山林。分布范围：留于苏门答腊、爪哇和婆罗洲。\n\
  \n#### 2 爪哇普通嘴留\n*Coracina javensis* 28cm\n野外记录：在高树顶端或森林空地边缘单只或成对觅食。鸣声：响亮、穿透的哨鸣\
  \ `pee-eeo-pee-eeo` 和 `tweer` 或 `twee-eet`。栖息地：开阔林、森林边缘和空地以及稀树草原。分布范围：爪哇和巴厘特有。\n\
  \n#### 3 灰普通嘴留\n*Coracina schistacea* 31cm\n野外记录：通常单只或成对觅食，在树高 10 米或更高处。鸣声：一系列略微下调的、鼻性的哨音；还有短促、不悦耳、略带金属感的音调。栖息地：原生林和次生林、低地林、次生林和耕地。分布范围：班加爱岛特有。\n\
  \n#### 4 瓦莱西亚普通嘴留\n*Coracina personata* 30–35cm\n野外记录：安静地在树冠层觅食，单只或成对。`C. p. alfrediana`\
  \ (4b) 出现于巽群岛的伦巴塔岛和奥洛尔岛；`C. p. sumbensis` (4c) 是巽群岛的客鸟；`C. p. pollida` (4d) 出现于摩鹿答腊东南部的凯群岛。鸣声：鼻性的、哀婉的\
  \ `plee-urk`；还有吱吱的鼻音，通常在飞行时发出。\n\n#### 5 摩鹿答腊普通嘴留\n*Coracina atriceps* 32–35cm\n\
  野外记录：通常吵且引注目。在高树木的上层觅食。`C. a. magnirostris` (5b) 出现于摩鹿答腊北部。鸣声：粗哑、断续的鸣叫，由两只个体交替发出。栖息地：原生林和高大的次生林、沿海和林地。分布范围：摩鹿答腊特有。\n\
  \n#### 6 布鲁岛普通嘴留\n*Coracina fortis* 35cm\n野外记录：信息很少；被认为不显眼。鸣声：未记录。栖息地：低地、山林和季风林。分布范围：摩鹿答腊南部的布鲁岛特有。\n\
  \n#### 7 黑脸普通嘴留\n*Coracina novaeliae* 32–35cm\n野外记录：通常单只或成群可见，通常停在暴露的树枝上；降落时反复折叠翅膀。`C.\
  \ n. subpallida` (7b) 是巽群岛的客鸟。鸣声：鼻性的、哀婉的（等待，修正文本）。栖息地：开阔林、森林边缘、空地和次生林。分布范围：留于苏拉威锡、苏拉群岛和摩鹿答腊。\n\
  \n#### 8 粗喙普通嘴留\n*Coracina caeruleogrisea* 33–37cm\n野外记录：在上层的大树上缓慢而专注地觅食，通常成对或成小群。鸣声：略带音乐感、粗哑、沙哑的\
  \ `shhhy yun-eshhyway`；还有柔和的鸣声、短促的 `chirp`、柔和的沙声和粗哑的嗡嗡音。栖息地：森林、森林边缘、高大的次生林和干扰区。分布范围：摩鹿答腊北部哈马黑拉岛的客鸟，或可能是被忽视的留鸟。\n\
  \n### 109 普通嘴留\n\n#### 1 蓝腹普通嘴留\n*Coracina temminckii* 30–31cm\n野外记录：通常成对或成小群遇到，在中层或高树的树冠层觅食；经常在高处裸树枝上鸣叫。鸣声：拉长的、鼻性的、沙哑的\
  \ `sssssschu`，会有 2–3 声干涩的断续音在前；还会发出哨音般的 `pi pi pi pi pi` 和短促的高音飞行鸣音。分布范围：苏拉威锡特有。\n\
  \n\n\n\n\n## 2 腹白蜂留\n*Coracina striata* 28cm \n习性记录：嘈杂且显眼，经常看到飞过林间空地或山脊，通常成小群出现，或作为多物种觅食群的一部分。*C.*\
  \ *difficilis* (2b) 居住在菲律宾西部；*C.* *sumatrensis* (2c) 出于苏门答腊和婆罗洲；*C.* *kochii* (2d)\
  \ 出于菲律宾南部。\n鸣声：清晰的嘶鸣 *kliu-kliu* 或尖锐的 *kriiu-kriu*，还有粗糙的 *kleep* 和上升的 *see-up*。\n\
  栖息地：低地森林，包括红树林、次生林。\n分布：居住在苏门答腊、婆罗洲和菲律宾。\n\n## 3 斑留\n*Coracina bicolor* 31cm \n\
  习性记录：通常成对出现，在密集的叶片树冠中觅食，通过叫声最易定位。\n鸣声：响亮的、铃声般的 3–5 音节序列，随后是 4–8 声较大的单哨声，通常由几声粗糙的声音开头。\n\
  栖息地：原生低地森林、森林边缘和红树林。\n分布：特产于苏拉维西及周边岛屿。\n\n## 4 白臀留\n*Coracina leucopygia* 25–29cm\
  \ \n习性记录：通常成对或成小群出现；在树冠层觅食，也会来到地面采集食物。经常栖息在树木和灌木的裸露树枝上。\n鸣声：一系列叮当声；还有微弱的、鼻音的叽叽声。\n\
  栖息地：开阔林地、稀疏林、次生林、带树木的灌木丛。\n分布：特产于苏拉维西。\n\n## 5 白腹留\n*Coracina papuensis* 22–29cm\
  \ \n习性记录：单只、成对或成小群出现；从中层到树冠层觅食，通过采食或短距离飞袭觅食。经常栖息在枯树的树枝上；栖息时有夸张的抖翅动作。*C.* *p.* *hypoleuca*\
  \ (5b) 出于小巽群岛和东南马鲁库群。\n鸣声：高音、鼻音的尖叫 *wheo-eey* 或 *witchew*。\n栖息地：森林边缘、次生林、稀疏林、带树木的灌木丛和椰子园。\n\
  分布：居住在马鲁库岛和小巽群岛。\n\n## 6 马哈黑留\n*Coracina parvula* 25cm \n习性记录：通常成对出现，在树冠层觅食或栖息在枯树顶部捕捉昆虫。\n\
  鸣声：一系列快速重复的断续叽叽声，在收尾前会减慢并下降。\n栖息地：原生山林。\n分布：特产于北马鲁库岛的马哈黑岛。\n\n## 7 矮蜂留\n*Coracina\
  \ abbotti* 20cm \n习性记录：在高树树冠中缓慢觅食，在粗壮的树枝上像䴴一样；通常单只或成对出现，偶尔成小群或作为多物种觅食群的一部分。\n鸣声：两个安静的音后是四个音的鸣叫；叫声包括高音下降的\
  \ *thip* 和飞行时的尖锐 *tseet*。\n栖息地：山地森林。\n分布：特产于苏拉维西。\n\n## 8 黑蜂留\n*Coracina coerulescens*\
  \ 25–26cm \n习性记录：通常成小群或多物种觅食群；在森林或次生林的树冠或上层觅食。\n鸣声：响亮、粗糙的 *peeeeeuuuu* 或 *peeeeeuuu\
  \ peeuu-tip-tip-peeuu*……后者带有咔哒声，几乎是在啾啾；还有粗糙的、啾啾的喳声。\n栖息地：亚热带或热带湿润低地森林和次生林。\n分布：特产于菲律宾。\n\
  \n![image](img/page233.jpg)\n\n## 1 普通蜂留\n*Coracina tenuirostris* 24–27cm \n习性记录：在高树茂密的叶树层中是不显眼的觅食者，通过鸣声最易定位。通常单只或成对出现。*C.*\
  \ *t.* *grayi* (1b) 出于北马鲁库群岛；*C.* *t.* *pelingi* (1c) 出于邦盖岛。\n鸣声：混杂的类蝉声 *ch-ch-ch*，随后是一个向下滑音的鼻音。\n\
  栖息地：原生、次生和经过采伐的森林以及森林边缘。\n分布：居住在苏拉维西南部、苏拉维西岛屿、马鲁库群岛和小巽群岛。\n\n## 2 桑巴蜂留\n*Coracina\
  \ dohertyi* 20–24cm \n习性记录：通常成对出现，有时单只或三只一组。在大树的中层和下层树冠层觅食。\n鸣声：歌声由三个摩擦性的类蝉音组成；还有粗糙、刺耳的\
  \ *queep* 声。\n栖息地：原生和次生林。\n分布：特产于小巽群岛西部。\n\n## 3 苏拉蜂留\n*Coracina sula* 20–24cm \n\
  习性记录：通常单只、成对或成小群出现，常作为多物种觅食群的一部分。在底层觅食。\n鸣声：一系列短促的爆发性音，间杂着清晰的下降哨声。\n栖息地：原生森林、次生林、林地。\n\
  分布：特产于苏拉群岛。\n\n## 4 凯蜂留\n*Coracina dispar* 21–25cm \n习性记录：通常单只或成对出现。活跃的觅食者，主要在中层层，在叶片背面觅食。\n\
  鸣声：快速、不悦耳的滑滑音；还有单声的 *chuk* 声。\n栖息地：森林、次生林。\n分布：特产于东南马鲁库群岛和小巽群岛。\n\n## 5 苏拉维西蜂留\n\
  *Coracina morio* 23–25cm \n习性记录：成对或成小群出现；在树冠和亚树冠层觅食。*C.* *m.* *talautensis* (5b)\
  \ 出于塔劳特岛。\n鸣声：一系列嗡嗡的、鼻音的、铃声类蝉音；还有低音的 *chup* 声。\n栖息地：原生低地森林、森林边缘、次生林。\n分布：特产于苏拉维西。\n\
  \n## 6 黑喉蜂留\n*Coracina mindanensis* 23cm \n习性记录：不显眼的觅食者，主要在树冠层；单只出现。*C.* *m.* *elusa*\
  \ (6b) 出于民棉兰岛。\n鸣声：无资料。\n栖息地：森林和次生林。\n分布：特产于菲律宾。\n\n## 7 浅色蜂留\n*Coracina ceramensis*\
  \ 24–25cm \n习性记录：常作为多物种觅食群，在高树的树叶中觅食；在树枝和叶片背面采食。\n鸣声：快速干燥的叽喳声和短促的断续 *tick* 声。\n\
  栖息地：森林，包括经过采伐的森林和次生林。\n分布：特产于南马鲁库群岛。\n\n## 8 小蜂留留\n*Coracina fimbriata* 19–21cm\
  \ \n习性记录：在树冠层觅食，常与多物种觅食群在一起；也单只或成对出现。\n鸣声：重复的、响亮的 *whit-it-it-chui-choi*……；还有一系列快速的\
  \ *whit* 音以及受惊时发出尖锐、鼻音的 *wherrh* 声。\n栖息地：森林、次生林、泥炭沼泽森林和人工。\n分布：居住在苏门答腊、爪哇、巴厘和婆罗洲。\n\
  \n![image](img/page235.jpg)\n\n## 111 蜂留类鸣鸟\n## 1 梅格高利蜂留\n*Coracina mcgregori* 21cm\
  \ \n习性记录：通常成群或作为多物种觅食群出现；在树冠层、下下层以及森林边缘觅食。\n鸣声：粗糙或咔哒的 *chu chu chu zwheeeeeeet-zhuuuuuuuu*，类比调收音机时的声音；还有\
  \ *zwheeet zwheeet zwheeet*。\n栖息地：苔藓山地森林和森林边缘。\n分布：特产于菲律宾南部的棉兰岛。\n\n\n\n\n\n## 2\
  \ 白翅灰嘴鴸 *Coracina ostenta* 25cm\n野外记录：通常成小群出现，或作为混异物种觅食群的一部分，在树冠层或森林边缘觅食。鸣声：响亮的、音调下降的\
  \ `schiirp` 或 `pi-ieu`；还会发出 `chu chu chu chu pi-ieuu ki chu`。栖息地：低地和中山森林、森林边缘和次生林。分布：菲律宾西部特有。\n\
  \n## 3 黑白噪噪� *Lalage melanoleuca* 21–22cm\n野外记录：通常在树冠层或森林边缘遇到，单独或作为混异物种觅食群的一部分；通常很吵闹。*L.*\
  \ *m.* *minor* (3b) 分布于菲律宾部和南部。鸣声：响亮的 `cha-chi cha-chi cha-chi`……或 `ka-choo ka-choo\
  \ ka-choo`；还有断续的 `chi chi chi chi`。栖息地：森林和森林边缘。分布：菲律宾特有。\n\n## 4 斑脸噪� *Lalage nigra*\
  \ 18cm\n野外记录：通常单独、成对或成小群出现。在所有层级觅食，偶尔在短草地上地上捕猎。鸣声：各种鼻音的咯咯声、`chaka-chevu` 或类似声音；还有沙沙的\
  \ `wheek chechechecheche-chuk`，以及 `kew kew` 紧随 2–8 声 `kyhek` 或 `chack` 声。栖息地：开阔林地、森林边缘、耕地、种植园、沿海林、公园和花园。分布：留于苏门答腊、爪哇、婆罗洲和菲律宾。\n\
  \n## 5 白肩噪� *Lalage sueurii* 18cm\n野外记录：通常很显著。单独、成对或成小群在短草地上或裸露区域觅食。栖息在孤立的树木上、栅栏柱和树桩上。鸣声：一系列粗哑、沙沙的快速、断续音符，几乎连在一起；歌声由十二个清晰、快速重复的音乐音符组成。栖息地：林地、稀树、开阔森林、红树林、茂密或疏林耕地、灌木丛和花园。分布：留于东爪哇、巴厘岛、巽群岛和苏拉答锡岛。\n\
  \n## 6 白臀噪� *Lalage leucopygialis* 19cm\n野外记录：从地面到大小树的树冠觅食，单独、成对或成小群。鸣声：一系列响亮、膨胀的快速、坚硬、清晰的啾鸣。栖息地：森林边缘、受干扰严重的森林、次生林、疏林耕地和红树林。分布：苏拉答锡岛、托吉安岛和苏拉岛特有。\n\
  \n## 7 褐腹噪� *Lalage aurea* 18–20cm\n野外记录：通常单独、成对或成小群出现；从中层林到树冠层觅食。鸣声：一系列七声断续的、哨般的音符。栖息地：原生林和经采伐的次生林、森林边缘、开阔次生林、灌木丛、沿海林和红树林。分布：摩鹿加群北部特有。\n\
  \n## 8 白眉噪� *Lalage moesta* 18–19cm\n野外记录：单独或成对从中层林到树冠层觅食；通过从叶片上取食和小果进食。鸣声：闷、不悦听、断续的\
  \ `nit nit` 声。栖息地：次生林、红树林、低地开阔森林，偶尔出现在高林。分布：东巽群岛塔尼巴岛特有。\n\n## 9 变色噪� *Lalage leucomela*\
  \ 17–20cm\n野外记录：主要在树冠层觅食，成对或三只一组；不显眼。通过从叶片或枝上取食；偶尔在捕食昆虫后进行短的空中俯冲。鸣声：一系列响亮、刺耳的 `s-teeu`\
  \ 声，频率约为每秒两个音。栖息地：季风林、次生林地和疏林耕地。分布：留于摩鹿加群岛南部凯岛。\n\n![image](img/page237.jpg)\n\n\
  ## 112 蜜蜂�；伯劳��\n\n### 1 灰蜜蜂� *Pericrocotus divaricatus* 18cm\n野外记录：通常成小群出现，在树冠外层分支觅食；也是混异物种觅食群的常见成员。鸣声：清脆的金属感颤音，通常在飞行时发出。栖息地：各种林地、散落树木的开阔地区、种植园和红树林。分布：苏门答腊、婆罗洲和菲律宾的冬客；苏拉答锡的漂留。\n\
  \n### 2 小蜜蜂� *Pericrocotus cinnamomeus* 16cm\n野外记录：通常出现在活跃、吵闹的群落中，在树顶的叶丛间穿梭寻找昆虫；还会进行短促的捕虫俯冲。鸣声：群成员之间不断重复的\
  \ `tswee-swee` 和高音调的 `tsch-tsch-tsch-tsch` 联络声。栖息地：开阔森林、红树林、耕地和花园。分布：留于爪哇和巴厘岛；婆罗洲可能有漂留。\n\
  \n### 3 火红蜜蜂� *Pericrocotus igneus* 15–16cm\n野外记录：通常成小群出现或作为混异物种觅食群的成员；在树冠层觅食。鸣声：纤细、上升的、悦律的\
  \ `swee-e`。栖息地：森林、森林边缘、空地、灌木丛，偶尔出现在红树林。分布。\n\n### 4 弗罗雷斯蜜蜂� ⮮噪�（小蜜蜂�）*Pericrocotus\
  \ lansii* 16cm\n野外记录：成对或成小群出现，是混异物种觅食群的成员；在水平栖木上取食。鸣声：安静的噪�声。栖息地：开阔公园林、高大次生林和河流森林。分布：松民瓦和巽群岛。\n\
  \n### 5 灰喉蜜蜂� *Pericrocotus solaris* 17–19cm\n野外记录：在树冠层从叶片上取食无脊椎动物，或进行空中俯冲。与其他物种混合。婆罗洲的鸟类喉部呈灰。鸣声：重复的\
  \ `tzeep-zip` 和模糊的 `swiririt`；还有柔和的 `trip`。栖息地：山地森林。分布：留于西苏门答腊、北婆罗洲和爪哇。*cotus miniatus*\
  \ 19cm\n野外记录：成小群或大群在树冠层觅食。鸣声：坚硬、尖锐的 `chee-chee-chee` 声和拉长的 `tsree-ee`。栖息地：山地森林和森林边缘，偶尔出现在耕地。分布：苏门答腊和爪哇特有。\n\
  \n### 7 火蜜蜂� *Pericrocotus speciosus* 20–22cm\n野外记录：群性强；是混异物种觅食群的成员。通过取食或悬停从叶片上取食，并进行空中俯冲捕食昆虫。鸣声：响亮、刺耳的\
  \ `sweep-sweep-sweep-sweep`、`swee-et sweet-e` 或 `twii-it twii-it` 等。栖息地：森林和林地地区。分布：留于苏门答腊、爪哇、巴厘岛、婆罗洲、菲律宾和兰波。\n\
  \n### 8 黑翅伯劳�� *Hemipus hirundaceus* 13–15cm\n野外记录：通常成对或成小群出现，与其他昆虫一起悬停。在经常栖木上进行捕虫俯冲；也从叶片上取食，偶尔从地面捕食。鸣声：粗的\
  \ `tu-tu-tu-tu hee-heetee-teet` 和 `hee-too-weet`，间杂着高音 `cheet-weet-weet-weet` 和\
  \ `dee-dit-do`。栖息地：所有类型的低地森林，包括次生林和沿海森林。分布：留于苏门答腊、爪哇、巴厘岛和婆罗洲。\n\n### 9 宽翅伯劳�� *Hemipus\
  \ picatus* 15cm\n野外记录：通常成小群出现，经常与其他物种混合。在经常栖木上进行捕虫俯冲；也从叶片上取食，偶尔从地面捕食。鸣声：尖锐的 `chisik`\
  \ 或 `chir-up`；还有高音的颤鸣。栖息地：低地、丘陵和山林。分布：留于苏门答腊和婆罗洲。\n\n\n\n\n\n# 1 闽答蓝蓝尾雀\n`Rhipidura\
  \ superciliaris` 16cm 野外笔记：在林下层觅食，通常作为物种混合觅食群的一部分。通过其独特的鸣声最易识别。鸣声：重复、快速上升的 `woo-woo-woo-woo-woo`……；还有尖锐、沙哑的\
  \ `whickkk whickkk` 鸣声。栖息地：森林的阴暗处，也有森林边缘。分布范围：菲律宾南部特有。\n\n# 2 维萨亚蓝尾雀\n`Rhipidura\
  \ samarensis` 16cm 野外笔记：曾被视为前一种物种的亚种；推测行为相似。鸣声：无信息；推测与前一种物种相似。栖息地：森林和森林边缘。分布范围：菲律宾中部特有。\n\
  \n# 3 蓝头尾雀\n`Rhipidura cyaniceps` 18cm 野外笔记：显眼且喧闹。在林下层觅食，通常成小群体或作为物种混合觅食群的一部分。鸣声：尖锐、金属质、断续的\
  \ `chip-chip-chip-chip chip chip`，速度变慢并夹杂着尖锐的 `chick` 声。栖息地：原生橡树林和松林，以及受干扰严重的次生林。分布范围：菲律宾北部特有。\n\
  \n# 4 塔拉斯尾雀\n`Rhipidura sauli` 18cm 野外笔记：曾被认为与前一种物种同种；推测行为相似。鸣声：可能与前一种物种相似。栖息地：成熟和半成熟的低地森林。分布范围：菲律宾中部塔拉斯岛特有。\n\
  \n# 5 维萨亚尾雀\n`Rhipidura albiventris` 18cm 野外笔记：推测行为与蓝头尾雀相似，曾被认为与其为同种。鸣声：推测与蓝头尾雀相似。栖息地：所有类型的林。分布范围：菲律宾中部特有。\n\
  \n# 6 褐尾尾雀\n`Rhipidura phoenicura` 17cm 野外笔记：在茂密的林下层近地面觅食；经常加入物种混合觅食群。鸣声：歌声为 `he-tee-tee-tee--oh-weet`。栖息地：具有茂密灌丛和灌木的成熟森林。分布范围：爪哇夷特有。\n\
  \n# 7 黑肉桂尾雀\n`Rhipidura nigrocinnamomea` 16cm 野外笔记：显眼，在森林林下层活跃穿梭，单只、成对或作为物种混合觅食群的一部分。`R`.\
  \ `n`. `hutchinsoni` (7b) 出于米尼兰岛的西北和东部。鸣声：尖锐的 `squeek` 或 `chick`，像尖吱玩具的声音。栖息地：中山区和山区森林。分布范围：菲律宾米尼兰岛特有。\n\
  \n# 8 白喉尾雀\n`Rhipidura albicollis` 17–21cm 野外笔记：不活跃的觅食者，经常在树主干或周围树枝上活动；还会进行短距离的捕虫飞行。通常是物种混合觅食群的一部分。尾巴经常张开并直立。鸣声：一系列\
  \ 4–8 声纤细、高音的下降音调，通常后接一系列上升的音调。栖息地：丘陵和山上的开阔次生林以及森林边缘。分布范围：栖于苏门答腊和婆鲁洲。\n\n# 9 白腹尾雀\n\
  `Rhipidura euryura` 18cm 野外笔记：小型飞行昆虫的活跃食者；单只或成对可见，经常形成物种混合觅食群的一部分。经常扇开并摇动尾巴。鸣声：兴奋、尖吱的\
  \ `cheet-cheet`。栖息地：山区森林。分布范围：爪哇特有。\n\n![image](img/page241.jpg)\n\n114 尾雀\n\n#\
  \ 1 马来斑尾雀\n`Rhipidura javanica` 17–20cm 野外笔记：在植被中不断移动，穿插着捕虫飞行；据报道会跟随捕食受扰昆虫的家畜或猴子。单只、成对或小群出现，并加入物种混合觅食群。鸣声：高音、尖吱的\
  \ `chee-chee-wee-weet`；还有各种尖吱的叽喳声和鸣叫声。栖息地：开阔林地、次生林、红树林和花园。分布范围：栖于苏门答腊、爪哇、巴厘岛、婆鲁洲和西部小巽群岛的兰莫卡岛。\n\
  \n# 2 菲律宾斑尾雀\n`Rhipidura nigritorquis` 19cm 野外笔记：显眼且喧闹；单只或成对出现。持续扇动尾巴。曾被认为与前一种物种同种。鸣声：金属铃般的\
  \ `pip pip chop siitt chop why-su-weet`，每分钟重复数。栖息地：早期次生林、竹林、红树林、公园和花园。分布范围：菲律宾特有。\n\
  \n# 3 斑尾雀\n`Rhipidura perlata` 17–18cm 野外笔记：中层和上层的活跃觅食者；在捕获飞行昆虫后会进行规律飞行。物种混合觅食群的常客。鸣声：悦律的\
  \ `chilip pechilip-chi`。栖息地：有高树的原生森林和老次生林。分布范围：栖于苏门答腊和婆鲁洲；可能是候鸟。\n\n# 4 笠尾雀\n`Rhipidura\
  \ leucophrys` 21cm 野外笔记：在地面或附近寻找昆虫；经常环绕并闪动翅膀和尾巴。鸣声：多变的尖吱哨音，音调起伏；发出粗哑的叽喳声。栖息地：草地、海滩、耕地。分布范围：栖于马鹿加群岛。\n\
  \n# 5 棕冠尾雀\n`Rhipidura diluta` 16–17cm 野外笔记：显眼，休息时直立栖息。喜好中层的开阔区域。羽色变化多大；包括：\n- `R.r.bourensis`\
  \ (6b) 出于布鲁岛\n- `R.r.finitima` (6c) 出于瓦图贝拉群岛\n- `R.r.obiensis` (6d) 出于奥比岛\n- `R.r.tenkatei`\
  \ (6e) 出于罗特岛\n上述所有个体及其他亚种可能被视为独立物种。鸣声：一系列停顿、高音音调，起伏并略微加速，或其变体。栖息地：原生森林、森林边缘、疏林耕地、灌丛和红树林。分布范围：栖于马鹿群岛和东小巽群岛。\n\
  \n# 6 北尾雀\n`Rhipidura rufiventris` 16–19cm 野外笔记：茂密林下层的活跃觅食者，单只、成对或在物种混合觅食群。据报道跟随灰猴以捕获受扰昆虫。鸣声：一系列\
  \ 3–5 声低沉、高音音调，夹杂着 `churr` 和 `tzic` 声。栖息地：山区森林；偶尔出现在经砍伐的低地森林。分布范围：\n\n# 7 肉桂尾雀\n\
  `Rhipidura fuscorufa` 18cm 野外笔记：通过啄食和空中飞行觅食；活跃，不断扇动尾巴。物种混合觅食群的常客。鸣声：由短促、不和谐的哨音组成，夹杂着高音啾鸣。栖息地：森林、森林边缘和红树林。分布范围：小巽群岛特有。\n\
  \n# 8 锈腹尾雀\n`Rhipidura teysmanni` 14cm 野外笔记：从中层到林冠层的活跃觅食者，单只、成对或作为物种混合觅食群的一部分。鸣声：一系列\
  \ 3–5 声低沉、高音音调，夹杂着 `churr` 和 `tzic` 声。栖息地：\n\n分布范围：苏拉威西和苏苏拉群岛特有。\n\n# 9 栗背尾雀\n`Rhipidura\
  \ superflua` 14cm 野外笔记：通常单只或成对出现；在林下层觅食。鸣声：一系列短促、安静的叮叮声。栖息地：山区森林和森林边缘。分布范围：特于马鹿加群岛的布鲁岛。\n\
  \n\n\n\n# 1 斑胸鸎\n`Rhipidura dedemi` 13–14cm。野外记录：非常显眼，是混物种觅食群的常见成员。其他其他信息。鸣声：悦听、快速重复的中音调音乐性音符。栖息地：低地和山地森林的林下。分布：特产于南马卢克群岛的塞拉岛（Seram）。\n\
  \n# 2 长尾鸎\n`Rhipidura opistherythra` 17cm。野外记录：胆小且躲避；经常是混物种觅食群的一部分。鸣声：歌曲由一系列高音的吱吱声组成；叫声是短促、不悦耳的重复音符。栖息地：原生林和次生林、森林边缘，偶尔出现在红树林。分布：特产于东小巽丹群岛的丹尼巴群岛（Tanimbar\
  \ Islands）。\n\n# 3 栗鸎\n`Rhipidura rufifrons` 15–18cm。野外记录：从地面到树冠上层均觅食；通过搜索叶片、捕虫以及偶尔悬停取食觅食。鸣声：叫声包括啾啾声、嗡嗡声和责备。栖息地：低地、丘陵和山地森林。分布：居住在北马卢克群岛。\n\
  \n# 4 阿拉富拉鸎\n`Rhipidura dryas` 16–17cm。野外记录：经常加入从地面到树冠的混物种觅食群，主要偏好林下层到中下层。鸣声：歌曲由哨哨声、泡泡声音符和短促音符的交织组成。栖息地：红树林、沿海林地、季风林、原生和次生低地、丘陵和山地森林以及森林边缘。分布：居住在小巽群岛、南马卢克群岛和弗罗里斯海的岛屿。\n\
  \n# 5 绿脸鸟\n`Aegithina viridissima` 12–15cm。野外记录：在树冠叶片中取食无脊椎动物，成对或小群活动，并作为混物种觅食群的一部分。鸣声：高音的\
  \ `itsu tsi-tu tsi-tu`、叽喳的 `tit-teeer` 和低沉的 `chititititit`。栖息地：原生林、高次生林和森林边缘。分布：居住在苏门答腊和婆罗洲。\n\
  \n# 6 普通绿鸟\n`Aegithina tiphia` 14cm。野外记录：树冠中的体操觅食者，经常快速出冲捕捉飞过的昆虫。通常单只或成对出现；非繁殖期经常加入混物种觅食群。鸣声：各种尖锐、不悦耳、哨声和哀鸣的歌曲。栖息地：开阔森林、红树林、泥炭沼泽森林、次生林、种植园、公园和花园。分布：居住在苏门答腊、爪哇、巴厘岛、婆罗洲和菲律宾西部。\n\
  \n# 7 栗胸八嘴留\n`Philentoma velata` 19–21cm。野外记录：经常长时间静止。动作通常缓慢，但在捕食飞行昆虫后会出击；经常出没于中上层。鸣声：清脆的铃铛般\
  \ `phu phu phu phu phu`……、有力而清晰的 `chut-ut chut-up chut-ut`……以及刺耳的金属声 `churr`。栖息地：阔叶常绿低地和低山地原生林、砍伐林和次生林。分布：居住在苏门答腊、爪哇和婆罗洲。\n\
  \n# 8 栗翅八嘴留\n`Philentoma pyrhoptera` 16–17cm。野外记录：动作缓慢。经常出没于中下层；也出现在低矮灌丛和地面。5% 的个体为蓝色变型。鸣声：柔和的、哨般的\
  \ `tu-tuuuuu` 或 `wee tooooo`，以及粗鲁的责备声。栖息地：原生林和次生林，以及泥炭沼泽、石楠和砍伐林。分布：居住在苏门答腊和婆罗洲。\n\
  \n# 9 大灰嘴留\n`Tephrodornis virgatus` 23cm。野外记录：在树顶成小群出现；通过从叶子、树枝有时从地面上拾食大昆虫，或在空中捕捉飞行昆虫来觅食。鸣声：响亮的\
  \ `kew-kew-kew-kew` 和粗鲁的 `chreek-chreek-chreek`……栖息地：低地和丘陵的原生、次生林和种植园。分布：居住在苏门答腊、爪哇和婆罗洲。\n\
  \n![image](img/page245.jpg)\n\n## 116 蜂尾\n\n### 1 蓝喉蜂尾\n`Eutrichomyias rowleyi`\
  \ 18cm。野外记录：主要在树冠和亚树层以 2–5 只鸟的小群形式觅食，偶尔加入混物种觅食群。通过捕虫和从植物上抓取或拾食觅食。尾巴经常抬起，有时扇动。鸣声：叫声包括响亮、刺耳的\
  \ `chew chew chew chew chew chew`；单声 `tuk`；响亮、下降的、颤音般的 `chreechreechchree`；以及高频、嘶嘶的\
  \ `streeeeee`。歌曲可能是稀疏音符的细哨声。栖息地：阔叶热带山地雨林；偏好山谷中的遮蔽森林。分布：特产于苏威腊岛北部的桑希赫岛。\n\n### 2\
  \ 布莱氏蜂尾\n`Terpsiphone affinis` 20cm；公鸟尾长 45cm。野外记录：通常从树冠下部的栖息处捕猎，通常成对。鸣声：清晰的、滚动的\
  \ `tu-tuuuuu` 或 `wee tooooo`，以及粗鲁的责备声。\n\n\n\n\n# 4 蓝脸霸�\n*Hypothymis puella* 15–17cm\n\
  野外记录：单独、成对或成小群出现。主要在叶片上拾食觅食，范围从下层到中层，偶尔到下林冠。经常呈直立姿势。鸣声：歌声由一系列哨音组成，包括 `s-si-si SI-SI-SII`、泡泡般的\
  \ `whiwhiwhiwhiwhi`……以及一个上扬的 `sweei-sweei-sweei`……。栖息地：低地、丘地和次生林、灌木丛和林木稀少的耕地。分布：特产苏拉答腊以及苏拉岛和班加盖岛。\n\
  \n# 5 岛霸雀\n*Monarcha cinerascens* 16–19cm\n野外记录：单独、成对或成小群觅食，范围从地面附近到树冠，主要通过拾食觅食。很吵闹。鸣声：快速、响亮、含糊的\
  \ `weeweeweeweeweewee`……；叫声包括粗鲁、责备的叽喳声，随后是一连串尖锐、清脆的哨音。栖息地：低地森林和灌木丛。分布：遍布瓦拉莱西亚地区。\n\
  \n# 6 白颊霸雀\n*Carterornis pileatus* 14–15cm\n野外记录：活跃。在树冠或中层通过拾食或悬停拾食觅食，通常成小群或混物种群活动。`C`.\
  \ `p`. `castus` (6b) 居住在东小巽达群岛和南马鲁群岛。鸣声：一系列半音乐性的、鼻音、争吵和叽喳的哨音，随后是一个粗鲁的、下扬的单音。栖息地：低地和丘地森林、选择性采伐森林和森林边缘。分布：特产马鲁群岛和东小巽达群岛。\n\
  \n# 7 马鲁蓝捕鸸\n*Myiagra galeata* 14cm\n野外记录：通常成对或在混物种觅食群中出现。主要在树冠觅食，在混群中时位于较低位置。经常竖起冠羽并抖动尾巴。`M`.\
  \ `g`. `buruensis` (7b) 出于布鲁岛。鸣声：响亮的哨音 `teu-teu-teu-teu-teu-teu`……，叫声带有快速的、不悦性的\
  \ `wik` 哨音。栖息地：原生和次生低地及丘地森林、采伐森林、森林边缘、耕地中的林地、红树林和椰子林。分布：特产马鲁群岛。\n\n# 8 宽嘴捕鸸\n*Myiagra\
  \ ruficollis* 15cm\n野外记录：在中层到下层觅食，通常单独独居或成对。通过拾食或空中俯冲捕获猎物。`M. r. fulviventris` (8b)\
  \ 出于塔尼姆巴岛。鸣声：旋律性的 `weeoo weeoo weeoo`，间杂着 `chwik chwik chwik`；叫声包括粗鲁、沙哑的 `zzzt`\
  \ 或 `zsh-wit` 和鼻音的 `bzzzsh`。栖息地：红树林、落叶林、次生季风林和林木稀少的耕地。分布：留于小巽达群岛和弗罗里斯海的小岛屿。\n\n\
  # 9 闪光捕鸸\n*Myiagra alecto* 16–17cm\n野外记录：通常成对出现，在茂密的丛林中觅食。鸣声：歌声由一系列清晰、颤动的哨音组成；叫声包括一个响亮的、长长的、下扬的、沙哑的音。栖息地：红树林、森林边缘、次生林和灌木丛。分布：留于北马鲁群岛和东小巽达群岛的塔尼姆巴岛。\n\
  \n![image](img/page249.jpg)\n\n118 霸雀捕鸸\n\n# 1 黑腹霸\n*Symposiachrus mundus* 16cm\n\
  野外记录：单独、成对或成小群出现；也会加入混物种觅食群。活跃地从叶片背面拾食。兴奋时会竖起并扇开尾巴。鸣声：歌声由一系列间距良好的哨音 `swih` 组成，音量增大并加速，随后是一连串高亢、上扬的音；还会发出粗鲁、拉长的音。栖息地：原生半常绿林和红树林。分布：特产东小巽达群岛。\n\
  \n# 2 斑纹霸雀\n*Symposiachrus trivirgatus* 14–16cm\n野外记录：从下层到下林冠觅食，单独或成对；也会加入混物种觅食群。鸣声：一系列粗鲁、闷哑、沙哑的音，一种“咕噜”声\
  \ `prrrrt` 和一段优美的 `whit`。栖息地：原生和次生林、森林边缘，偶尔有红树林。分布：特产小巽达群岛和南马鲁群岛。\n\n# 3 马鲁霸雀\n\
  *Symposiachrus bimaculatus* 14–16cm\n野外记录：单独或成对从下层到下林冠觅食；也是混物种觅食群的一部分。鸣声：一系列快速、沙哑、略带鼻音、断续的、双节音，通常带有上扬或下降的哨音；还有各种粗鲁、鼻音、争吵的音。栖息地：原生和次生林。分布：特产北马鲁群岛。\n\
  \n# 4 弗罗里斯斯霸雀\n*Symposiachrus sacerum* 15–16cm\n野外记录：混物种觅食群的常见成员。成对活动。鸣声：上扬的哨音；还有嗡嗡的\
  \ `schr schr` 随后是笛声般的哨音，以及责备的 `sjay-sjay`。栖息地：原生和次生林。分布：特产小巽达群岛。\n\n# 5 白尖霸雀\n*Symposiachrus\
  \ everetti* 14cm\n野外记录：很吵闹。成对或偶尔成小群觅食；在混物种觅食群中。经常竖起并半扇开尾巴。鸣声：略微颤抖、哀伤的哨音；还有粗鲁、责备的音。栖息地：森林和灌木丛。分布：特产弗罗里斯岛。\n\
  \n# 6 黑尖霸雀\n*Symposiachrus loricatus* 18cm\n野外记录：在林下和次生林中觅食，单独或成对。鸣声：丰富的、下降的 `teoow\
  \ teoow teoow`。栖息地：低地和亚山原生森林、灌木状次生林。分布：特产布鲁岛。\n\n# 7 黑颏霸雀\n*Symposiachrus boanensis*\
  \ 16cm\n野外记录：非常罕见。单独、两或三只出现。灌木丛中的活跃觅食者。经常扇动尾巴。鸣声：清晰的 `tjuuu tjuuu`，随后是柔和、单调的嗡嗡声。栖息地：峡谷和山谷的密半常绿林。分布：特产布亚诺岛。\n\
  \n# 8 白尾霸雀\n*Symposiachrus leucurus* 15–16cm\n野外记录：在中层从叶片拾食，单独、成对或在混物种觅食群中。鸣声：一系列清晰、下降的、高调哨音；一系列缓慢、干燥、沙哑的双音责备叫声，以及一系列断续、略带音乐性的粗鲁叽喳声。栖息地：原生和次生海岸季风林、丘地森林和林木稀少的耕地。分布：特产凯群岛。\n\
  \n![image](img/page251.jpg)\n\n119 霸雀捕鸸\n\n# 1 嘴鹊鸸\n*Dicrurus annectans* 28cm\n\
  野外记录：喜欢高大的灌木丛和低树枝；在隐藏的栖息处俯冲捕食。鸣声：响亮、优美的哨音、叽喳声和咕噜声。栖息地：森林、种植园、园林、次生林、海岸灌木和红树林。分布：苏拉答腊、爪哇和婆罗洲的冬季访客，极少出现在菲律宾海岸。\n\
  \n# 2 铜霸鹊鸸\n*Dicrurus aeneus* 24cm\n野外记录：树栖性，主要在树顶；俯冲捕食飞行昆虫。经常是混物觅食群的成员。鸣声：响亮、清晰、优美的哨音。栖息地：阔叶常绿、半常绿和落叶森林、森林边缘和次生林。分布：留于苏拉答腊和婆罗洲。\n\
  \n\n\n\n# 3 冠黑鹊� *Dicrurus hottentottus* 32cm\n野外记录：树栖性。主要通过出击捕虫来捕食昆虫；也取食花蜜。通常嘈杂且活跃，或独居、成对或成小群活动。白眼*D*.\
  \ *h*. *leucops* (3b) 分布于苏拉威岛；*D*. *h*. *striatus* (3c) 位于菲律宾南部。\n鸣声：叫声包括响亮的 `chit-wiii`、单声的\
  \ `wiii`、`tsit-wit` 和 `tsit-wit wuu`。\n栖息地：森林、森林边缘、疏林、灌木林和红树林。\n分布：留守爪哇西、巴厘岛、婆罗洲、菲律宾、苏拉威、班盖岛和苏拉岛，以及马鲁鹿群岛的奥比岛。\n\
  \n# 4 苏答腊鹊� *Dicrurus sumatranus* 29cm\n野外记录：通过俯冲捕虫或在树枝和叶丛间搜寻来捕食昆虫。经常加入混食群。\n鸣声：悦耳的\
  \ `tee-tiyeeah` 和刺耳的音调。\n栖息地：山坡及低海拔山地的干燥原生林、高次生林以及森林边缘。\n分布：苏答腊特有。\n\n# 5 塔拉斯鹊�\
  \ *Dicrurus menagei* 35–36cm\n野外记录：通过空中截击捕捉猎物，以及在叶间和树干上觅食。喜好中层森林，通常靠近溪流。\n鸣声：类似蝉鸣的沙哑叫声、沙哑的\
  \ `dzak-tess-k` 和 `tsee-ik`。\n栖息地：成熟的闭闭冠层森林和森林空地。\n分布：菲律宾南部塔拉斯岛特有。\n\n# 6 华莱士鹊�\
  \ *Dicrurus densus* 28–38cm\n野外记录：有独居、成对或偶尔成小群出现的现象。栖息在林冠层下方，从那里出击捕捕飞过的昆虫。在三巴岛，常见到与食蟹猕（*Macaca\
  \ fascicularis*）结伴。\n鸣声：一系列沙哑的、高音或低音的摩擦声，以及短促的断奏打击性音节，听起来清脆且流利，以声刺耳、快速的咕咕声开头。\n\
  栖息地：原生林和高次生林、开阔林地、疏林耕地和红树林。\n分布：马鲁鹿群岛东部和小巽达群岛特有。\n\n# 7 斑胸鹊� *Dicrurus bracteatus*\
  \ 30–32cm\n野外记录：通常独居、成对出现或偶尔成小群活动；也会加入混食群。喜好中层和林冠层；在暴露的栖息处通过空中截击捕食飞行昆虫，有时也吃果实。\n\
  鸣声：穿透力强、长长的鼻音、高音上扬调。与一系列不连续的短语进行对唱，包括流畅的 `dew-dew-dew`、震动的 `krrreeow` 和尖锐的 `chu-chu-seee-chu`，后者听起来显然像蛙声和鸟声的混合。\n\
  栖息地：低地和山地森林、森林边缘，以及次生林和沿海林。\n分布：留守马鲁鹿群岛。\n\n![image](img/page253.jpg)\n\n# 120 鹊�\n\
  ## 1 苏拉威鹊� *Dicrurus montanus* 28cm\n野外记录：通常独居、成对或作为混食觅食群的一部分出现。\n鸣声：对唱：第一只鸟发出刺耳、摩擦摩擦的\
  \ `trrsh-trrrsh`，第二只鸟以柔和的低音 `twuu` 或 `tee-twuu` 回答。叫声包括类似警报的音调，飞行时发出的响亮哨哨调。\n栖息地：丘陵和山地森林。\n\
  分布：苏拉威岛特有。\n\n## 2 黑鹊� *Dicrurus macrocercus* 30cm\n野外记录：利用显眼的栖息处进行俯冲捕虫；在空中捕获猎物或扑向地面。\n\
  鸣声：叫声包括刺亮的 `ti-ui`、沙哑的 `jeez`、`cheece` 或 `cheece-chich`。\n栖息地：开阔地区、耕地和路边。\n分布：留守爪哇和巴厘岛；苏答腊和婆罗洲的非繁殖期访客。\n\
  \n## 3 大黑尾鹊� *Dicrurus paradieus* 30cm\n野外记录：俯冲捕食昆虫或小型脊椎动物；也会在叶片间啄食昆虫并从花树上取花蜜。经常加入混食觅食群。\n\
  鸣声：叫声包括单调的 `kit-kit-kit-kit`、响亮悦耳的铃声音调和哨声。歌曲由响亮的叮当声、断奏音和尖锐的哨声组成，随后是鼻音。\n栖息地：原生林、次生林、沼泽森林和红树林。\n\
  分布：留守苏答腊、爪哇和婆罗洲。\n\n## 4 小黑尾鹊� *Dicrurus remifer* 25cm\n野外记录：喜好森林冠层，从那里对飞行昆虫进行大胆敏捷的追击。通常独居或成对可见，且常是混食群的一部分。\n\
  鸣声：范围很大的响亮、金属感、音乐性哨声；还会模仿其他鸟的叫声。\n栖息地：密集的低地和山地雨林、次生林。\n分布：留守爪哇岛。\n\n## 5 巴利斯鹊� *Dicrurus\
  \ balassius* 26–27cm\n野外记录：嘈杂且显著。通常成小群出现，有时参与混食活动。在暴露的栖息处俯冲捕捉昆虫。*D*. *b*. *mirabilis*\
  \ 分布于菲律宾。\n鸣声：清脆与沙哑哨声的混合，夹杂着 `chuck`, `chunk`；经常模仿其他鸟。\n栖息地：亚热带或热带湿地森林。\n分布：菲律宾特有。\n\
  \n## 6 灰鹊� *Dicrurus leuchaeus* 30cm\n野外记录：有独居或成对出现的现象，有时在小群中。在树顶俯冲捕虫，有时在低处活动。*D*.\
  \ *l*. *stigmatops* 分布于北婆罗洲。\n鸣声：多变；包括 `chink-churr-tree` 和响亮的清脆 `tjuur-curr` 或\
  \ `wie-piet`；；还会模仿其他鸟。\n栖息地：森林空地、次生林。\n分布：留守苏答腊、爪哇、婆罗洲，以及西小巽达群岛的兰莫岛。\n\n![image](img/page255.jpg)\n\
  \n# 121 噪嘴画鸫；果鸫；画鸫\n## 1 亮眼噪嘴画鸫 *Myophonus melanurus* 24–29cm\n野外记录：胆小。在森林地面或靠近水的地方觅食；通常独居或成对。\n\
  鸣声：高音尖叫声；无其他信息。\n栖息地：有河流和溪流的苔藓山地森林。\n分布：苏答腊特有。\n\n## 2 爪哇噪嘴画鸫 *Myophonus glaucinus*\
  \ 24–27cm\n野外记录：在地面和下层觅食。经常展开尾羽。\n鸣声：歌曲由一系列响亮的清脆哨声组成；叫声包括尖叫声、悦耳的哨音，以及受惊时的 `ooweet-ooweet-teet`\
  \ 随后是 `truuu-truuu`、`cheet` 或 `tee-ee-eet`…… `tee-ee-ee-eet`。\n栖息地：有洞穴和缝隙的山地森林。\n\
  分布：爪哇和巴厘岛特有。\n\n## 3 苏答腊噪嘴画鸫（褐翼） *Myophonus castaneus* 25cm\n野外记录：通常在树的中层和上层觅食，尤其是果树；偶尔在溪流的岩石上。经常展开尾羽。\n\
  鸣声：摩擦性的 `waach`；无其他信息。\n栖息地：丘陵和山地森林，主要沿水分布。\n分布：苏答腊特有。\n\n## 4 婆罗洲噪嘴画鸫 *Myophonus\
  \ borneensis* 25cm\n野外记录：在落叶层中于地面觅食。经常像扇子一样展开尾羽。\n鸣声：叫声包括长拉长的哨声、尖叫声、高音响亮哨声和长长的叽啾声。\n\
  栖息地：丘陵和山地森林，靠近岩崖或溪流。\n分布：婆罗洲特有。\n\n\n\n\n\n# 5 蓝腹鸫\n`Myophonus caeruleus` 32cm\n\
  **野外记录**：通常在水流湍急的森林水道附近的岩石上觅食，俯冲向水面采集食物。\n**鸣声**：歌声由一系列断断续续、优美且高亢的人类哨声组成；有时包含模仿。鸣叫包括远处的\
  \ `tzeet-tze-tze-tzeet`、`tzeet-tzuit-tzuit-zuit` 或 `ee-ee-ee`。\n**栖息地**：低地和丘陵森林，带有岩石露头和河流。\n\
  **分布**：栖息于苏门答腊和爪哇西。\n\n# 6 食果鸫（黑胸果鸫）\n`Chlamydochaera jefferyi` 22–23cm\n**野外记录**：通常以小规模游荡群体或混群出现。在林中层和地面落叶层中觅食。\n\
  **鸣声**：安静而高亢的 `seep` 声。\n**栖息地**：低海拔的高山森林及附近的花园。\n**分布**：婆罗洲岛特有种。\n\n# 7 蓝岩石鸫\n\
  `Monticola solitarius` 20cm\n**野外记录**：在地面觅食，或从低矮栖息处俯冲捕猎；偶尔在捕食昆虫后进行短距离空中俯冲。\n**鸣声**：响亮、笛声般、旋律性的\
  \ `chu sree chur tee tee wuchi-trr-trrt-tri`；也可能包含一些模仿。鸣叫包括深沉 `chak-chak`、哀伤的 `see`\
  \ 和 `wit-wit`。\n**栖息地**：开阔岩石区、悬崖、耕作地、路边和城市地区。\n**分布**：栖息于菲律宾北巴丹岛；冬季到苏门答腊、婆罗洲、菲律宾、苏拉威锡和马琉古群岛。\n\
  \n# 8 苏拉威西鸫\n`Cataponera turdoides` 20–25cm\n**野外记录**：通常单独活动或成小群活动；偶尔加入混群觅食群体。沿水平枝条跳跃，寻找附生植物中的食物。`C`.\
  \ `t`. `abditiva` (8b) 出现在苏拉威锡北部。\n**鸣声**：阵阵的鸣叫和悦耳的旋律音，通常在清晨或黄昏发出。\n**栖息地**：具有茂密下层的山地常绿林和苔藓森林。\n\
  **分布**：苏拉威锡特有种。\n\n![image](img/page257.jpg)\n\n## 122 鸫类\n\n## 1 岛鸫\n`Turdus poliocephalus`\
  \ 21–25cm\n**野外记录**：通常很害羞，主要在茂密植被下的地面落叶层中觅食。羽色变化很大，已描述了许多亚种（全球范围内约 50 种）；以下是该地区发现的部分：`T`.\
  \ `p`. `deningeri`（主图），位于南马琉古群岛的塞拉姆；`T`. `p`. `thomassoni` (1b），位于菲律宾的吕宋岛；`T`. `p`.\
  \ `malindangensis` (1c），位于菲律宾的民兰老岛；`T`. `p`. `whiteheadi` (1d），位于东爪哇；`T`. `p`. `erythropleurus`\
  \ (1e），来自圣诞岛；`T`. `p`. `javanicus` (1f），位于中爪哇；`T`. `p`. `mindorensis` (1g），发现于菲律宾的民罗岛；`T`.\
  \ `p`. `indrapurae` (1h），发现于苏门答腊北部；`T`. `p`. `seebohmi` (1i），位于北婆罗锡；`T`. `p`. `fumidus`\
  \ (1j），发现于西爪哇。\n**鸣声**：低沉的笛声般的哨鸣旋律；鸣叫包括 `chook-chook`、快速的急促 `tchick-tchick-tchick`\
  \ 或 `tchick-chink-chink`，以及在兴奋或惊恐时发出 `tchook-chook-toaweet-oweet-toaweetoweet`。\n\
  **栖息地**：山地森林。\n**分布**：遍布于该地区。\n\n## 2 灰鸫\n`Turdus pallidus` 22–23cm\n**野外记录**：害羞且警觉，主要在地面或果实树上觅食。\n\
  **鸣声**：各种双重或三重哨声；鸣叫包括 `chook`、`tuck-tuck`、纤细的 `tsee` 或 `tsee-ip`，以及惊恐时的 `think-think`。\n\
  **栖息地**：开阔地区、林丛、灌木丛、耕作地和花园。\n**分布**：菲律宾北部稀见的冬季候客。\n\n## 3 眉鸫\n`Turdus obscurus`\
  \ 22cm\n**野外记录**：通常成中、大群出现。在地面以及果树灌木和树上觅食。\n**鸣声**：柔和的 `chuk`、短硬的 `tack-tack` 和\
  \ `shree`；飞行时发出 `dzee` 声。\n**栖息地**：开阔森林、森林边缘、红树林和花园。\n**分布**：冬季到达苏门答腊、爪哇、巴厘岛、婆罗洲和菲律宾；苏拉威锡和小巽巽群群岛的迷鸟。\n\
  \n## 4 画头鸫\n`Turdus chrysolaus` 23cm\n**野外记录**：在较低位置觅食，在灌木覆盖处内或附近，或在果实树的所有层级。\n\
  **鸣声**：重复的 `krurr krurr krr-zeee` 或 `kiron tsee`，以及 `chuck-chuck`；飞行或惊恐时发出 `zeeee`。\n\
  **栖息地**：林地。\n**分布**：冬季到达菲律宾。\n\n## 5 日本鸫\n`Turdus cardis` 22cm\n**野外记录**：通常很害羞，在果实树上觅食。\n\
  **鸣声**：由一系列笛声哨鸣组成；鸣叫包括纤细的 `twee`。\n**栖息地**：林地。\n**分布**：菲律宾。\n\n![image](img/page259.jpg)\n\
  \n## 123 鸫类\n\n## 1 鳞纹鸫\n`Zoothera dauma` 27cm\n**野外记录**：在地面觅食，通常单独活动。\n**鸣声**：柔和的单调哨声。\n\
  **栖息地**：低地森林。\n**分布**：栖息于爪哇。\n\n## 2 棕胸鸫\n`Zoothera machiki` 21–22cm\n**野外记录**：在茂密植被中隐蔽。\n\
  **鸣声**：纤细的 `tsee`。\n**栖息地**：次生森林。\n**分布**：提摩尔岛。\n\n## 3 巽达鸫\n`Zoothera romedae`\
  \ 25cm\n**野外记录**：极其害羞且隐蔽。\n**鸣声**：优美的旋律性音符。\n**栖息地**：山地森林。\n**分布**：栖息于苏门答腊、巴厘岛和菲律宾。\n\
  \n## 4 艾弗特鸫\n`Zoothera everetti` 23cm\n**野外记录**：在地面觅食，常在溪流附近。\n**鸣声**：柔和的音乐性歌曲。\n\
  **栖息地**：山麓森林。\n**分布**：北婆罗锡特有。\n\n## 5 海喉鸫\n`Zoothera heinrichi` 28–30cm\n**野外记录**：害羞且隐秘。\n\
  **鸣声**：间歇的、纤细的高音哨声。\n**栖息地**：山地森林。\n**分布**：苏拉威锡特有。\n\n## 6 西伯利亚鸫\n`Geokichla sibirica`\
  \ 22cm\n**野外记录**：隐秘，在地面觅食。\n**鸣声**：微弱的 `tsee`。\n**栖息地**：丘陵和山地森林。\n**分布**：冬季到达苏门答腊和爪哇。\n\
  \n## 7 灰背鸫\n`Geokichla schistacea` 16–17cm\n**野外记录**：在森林地层觅食。\n**鸣声**：精美的旋律。\n**栖息地**：低地森林。\n\
  **分布**：塔尼巴群岛特有。\n\n## 8 布鲁岛鸫\n`Geokichla dumasi` 17cm\n**野外记录**：在地面觅食。\n**鸣声**：高音的\
  \ `pthhhhhh`。\n**栖息地**：低海拔山地热雨林。\n**分布**：布鲁岛特有。\n\n## 9 塞拉姆鸫\n`Geokichla joiceyi`\
  \ 17cm\n**野外记录**：在地面觅食。\n**鸣声**：纤细的 `tseep`。\n**栖息地**：山地热雨林。\n**分布**：塞拉姆岛特有。\n\n\
  ![image](img/page261.jpg)\n\n\n\n\n\n# 1 栗顶画留\n*Geokichla interpres* 17–19cm 野外记录：胆小；通常单独活动或成对出现。在地面直达中层林木间觅食。声音：上升的、如哨子般的鸣声，间杂着叽叽的鸣叫声，转录为\
  \ `see it-tu-tu tyuu`。鸣声包括粗厉的 `tac` 和高调、下降的 `tsi-i-i-i`。栖息地：阔叶常绿林。分布：留鸟于苏答腊、爪哇西、婆罗洲、菲律宾和西小巽群岛。\n\
  \n# 2 栗背画留\n*Geokichla dohertyi* 16–18cm 野外记录：通常单独可见；偶尔在果果树上成小群出现，否则在地面上觅食。声音：3–7\
  \ 声柔和、美妙的哨声，间杂着更复杂的句式；鸣声包括纤细的哨声和高调、尖锐哨声。栖息地：原生山地和山地森林。分布：小巽群岛特有。\n\n# 3 恩加诺画留\n\
  *Geokichla leucolaema* 16–19cm 野外记录：信息较少；推测与栗顶画留相似，曾被认为是同物种。声音：歌声据像幼鸟的乞食声。栖息地：雨林。分布：特有于苏答腊岛西南海的恩加诺岛。\n\
  \n# 4 红背画留\n*Geokichla erythronota* 20cm 野外记录：胆小且隐秘，主要在森林阴凉处的地面觅食，通常单独活动。`G`. `e`.\
  \ `kabaena` (4b) 出现在于苏拉威夷岛东南部的卡莱纳岛。声音：纤细、高调、上扬的音符；歌声由一系列流动的音符组成。栖息地：热带低地和中海拔阔叶常绿林。分布：苏拉威夷岛特有。\n\
  \n# 5 红黑画留\n*Geokichla mendeni* 20cm 野外记录：曾被视为前一种物种的亚种；其行为和习惯推测相似。声音：未记录。栖息地：选择性采伐森林。分布：特有于望岛和苏拉岛。\n\
  \n# 6 橙头画留\n*Geokichla citrina* 20–23cm 野外记录：胆小。在茂密的植被和森林林下中地面觅食；也在果树和灌木丛中进食。声音：响亮、清晰的一系列婉扬的句式；鸣声包括柔和的\
  \ `chu` 和尖锐的 `kreeee` 或 `teer-teer-teer`。栖息地：阔叶常绿林、森林边缘、次生林和灌丛。分布：留鸟于爪哇、巴厘和婆罗洲；苏答腊的客鸟。\n\
  \n# 7 灰画留\n*Geokichla cinerea* 19cm 野外记录：在地面或地面附近觅食，通常在开阔地带。声音：喘息般的、起伏的 `wheeezizizizi\
  \ zizizizi`。栖息地：原生、次生和选择性采伐森林，具有石灰岩露头的森林、残存的山脊林斑、苔藓森林以及以藤藤为主的开阔林下层的森林。分布：菲律宾北部特有。\n\
  \n# 8 橙侧画留\n*Geokichla peronii* 19–22cm 野外记录：通常单独或成对遇到。小群聚集在果树上，否则主要在地面觅食，偶尔进入中层或树冠层。声音：美妙、浑厚、清晰的哨声音符，间杂着偶尔的短促、粗厉音符和长的高调音符。栖息地：闭郁的季风林和退化林斑。分布：特有于小巽群岛东。\n\
  \n![image](img/page263.jpg)\n\n## 125 短尾鸇；红喉；红起尾；蓝画��\n\n# 1 白眉短尾鸇\n*Brachypteryx\
  \ montana* 14cm 野外记录：躲避；在地面觅食。行为非常像欧亚画鸫（`Erithacus rubecula`）。`B`. `m`. `floris`\
  \ (1b) 出现在小巽群岛的弗民岛；`B`. `m`. `erythrogyna` (1c) 发现于婆罗洲；`B`. `m`. `andersoni` (1d)\
  \ 出现在菲律宾的吕宋岛。声音：多变；通常缓慢开始，带有几个单音符，加速变为哀伤的啾啾声然后突然结束，或类似。鸣声包括生硬的 `tack` 以及受惊时的 `tt-tt-tt`。栖息地：森林中密密的林下和灌丛。分布：留鸟于苏答腊、爪哇、婆罗洲、菲律宾和小巽群岛的弗民岛。\n\
  \n# 2 小短尾鸇\n*Brachypteryx leucophris* 13cm 野外记录：在森林地面枯叶中觅食时经常竖直尾巴。声音：单音符，随后是优美的、嘶嘶的鸣叫，以杂乱的嗡嗡声和丰富的音乐音符结束；鸣声包括纤细的哨声和粗厉的\
  \ `tack`。栖息地：湿润森林中茂密潮湿的林下。分布：留鸟于苏答腊、爪哇、巴厘和小巽群岛。\n\n# 3 大短尾鸇\n*Heinrichia calligyna*\
  \ 17–18cm 野外记录：非常胆小。在地面上跳跃，在落叶层、苔藓、地衣和小石头周围觅食。`H`. `c`. `picta` (3b) 出现在苏拉威夷东南部；`H`.\
  \ `c`. `simplex` (3c) 发现于北苏拉威夷。声音：歌声据说像幼鸟的乞食声。栖息地：原生森林。\n\n# 4 蓝喉画��\n*Calliope*\
  \ 15cm 野外记录：胆小隐秘，在茂密植被中觅食。歌唱时摇动尾巴。声音：多变的音乐鸣叫，交替着啾啾声和滑动的哨声；鸣声包括清晰的上升哨声和哀伤的 `chee`。栖息地：灌木丛、森林边缘。\n\
  \n# 5 蓝喉画��\n*Larvivora cyane* 14cm 野外记录：在地面或低矮植被中觅食。抖动尾巴。声音：鸣声包括低沉的 `tak` 以及受惊时的\
  \ `chuck-chuck`。栖息地：次生林、草地。分布：客鸟于苏答腊、婆罗洲。\n\n# 6 红侧颊画��\n*Tarsiger cyanurus* 14cm\
  \ 野外记录：曾被视为前一种物种的亚种；行为和习惯推测相似。在地面和低矮处觅食。声音：深沉的 `tok-tok` 声和哀伤的 `pheeou`。栖息地：阔叶常绿林。分布：客鸟。\n\
  \n# 7 亚眉起尾\n*Phoenicurus auroreus* 15cm 野外记录：在树木和灌木丛中觅食，像画�一样抖动尾巴。声音：鸣声包括 `tsip`、快速的\
  \ `titititik` 和 `teck-teck`。栖息地：灌木区、森林边缘。分布：客鸟于菲律宾。\n\n# 8 吕宋水画��\n*Phoenicurus\
  \ bicolor* 14–15cm 野外记录：常成小群出现在溪流边的岩石上，在水边觅食无脊椎动物。声音：相当响亮的重复声 `seep`。栖息地：穿过山地森林的清澈湍急、多石的山溪和河流。\n\
  \n# 9 巽蓝画��（巽蓝画��）\n*Myiomela diana* 15cm 野外记录：在林下中觅食；其他信息较少。声音：简单的 2–5 音符、忧郁美妙的鸣叫。栖息地：具有林下的的山地森林。分布：特有于苏答腊和爪哇。\n\
  \n## 126 鹊��画��；画��；姬��\n\n# 1 菲律宾鹊��画��\n*Copsychus mindanensis* 19–20cm 野外记录：吵闹。栖息时经常抖动并扇动尾巴。声音：优美、重复、清晰的哨声。栖息地：次生林、耕作区、灌木丛和竹林。分布：特有于菲律宾。\n\
  \n# 2 东方鹊��画��\n*Copsychus saularis* 20cm 野外记录：在地面跳跃时摆动起尾巴，觅食虫子和昆虫。`C`. `s`. `pluto`\
  \ (2b) 出现在婆罗洲东北部和。声音：多变的音乐鸣叫，交替着啾啾声和滑动的哨声；鸣声包括清晰的上升哨声和受惊时的粗厉 `che-e-e-e-h`。栖息地：次生林、红树林、耕作区、公园和花园。分布：留鸟于苏答腊、爪哇、巴厘和婆罗洲。\n\
  \n\n\n\n[content]\n\n### 3 白尾画眉留\n`Copsychus malabaricus` 25cm. 野外记录：通常在地面或低矮植蔽物中觅食。在开阔地上飞翔时，翅膀会发出咔哒声。声音：丰富、优美的鸣唱，包括模仿声；受惊时会发出粗厉的\
  \ `tshak` 声。栖息地：原生和次生低地及山地森林的林下边缘。分布：留于苏门答腊、爪哇哇和婆罗洲。\n\n### 4 白冠画眉留\n`Copsychus\
  \ stricklandii` 25cm. 野外记录：通常在地面或低矮植蔽物中觅食。显然在大面积范围内与前一种物种存在杂交——或许将其视为后者的亚种更为合适？`C.`.\
  \ `s.`. `barbouri` (4b) 出于东婆罗洲岛外的马鲁图亚岛。声音：据报道与白尾画眉留相似。栖息地：低地和山地原生林。分布：北婆罗洲岛特有。\n\
  \n### 5 白眉画眉留\n`Copsychus luzoniensis` 17–18cm. 野外记录：在森林林下层觅食，靠近地面。通过其叫声最容易发现。`C.`.\
  \ `l.`. `superciliaris` (5b) 出于菲律宾群岛。声音：一系列悦耳、优美的乐句，包括咕噜声和哨声，音调起伏，且通常以高音结束。栖息地：原生林和次生林。分布：北菲律宾岛特有。\n\
  \n### 6 白腹画眉留\n`Copsychus niger` 18–22cm. 野外记录：单只或成对出现；通过其响亮的歌声最容易发现。声音：各种重复的、响亮的、优美的、起伏伏的乐句。栖息地：低地森林、森林边缘、次生林和灌木丛。分布：菲律宾西部巴拉湾岛特有。\n\
  \n### 7 黑画眉留\n`Copsychus cebuensis` 20cm. 野外记录：在林下层的地面上或附近觅食。行踪神秘；通过其叫声最容易发现。声音：长的一系列优美、起伏哨声。栖息地：原生林、茂密灌丛、丛林和竹林。分布：菲律宾宿比岛特有。\n\
  \n### 8 褐尾画眉留\n`Copsychus pyrropygus` 25cm. 野外记录：长时间不动；经常翘尾。在地面和树上觅食，从叶片和地面采集食物。声音：歌声是响亮的哨鸣\
  \ `whi-iii whi-iii whi-uuu`；叫声是斥的 `tchurr`。栖息地：低地和山地原生阔叶常绿林。分布：留于苏门答腊和婆罗洲。\n\n###\
  \ 9 苏门答腊蓝兜\n`Cochoa beccarii` 28cm. 野外记录：主要在中层和上层可见——寻找其在栖枝间的短距离飞行。在高树上觅食果实，也可能在森林地面寻找无脊椎动物。声音：长而细、高亢且忧伤的哨声；飞行时还会发出\
  \ `sip` 声。栖息地：低山地森林。分布：苏门答腊岛特有。\n\n### 10 爪哇蓝兜\n`Cochoa azurea` 23cm. 野外记录：经常长时间静坐或安静移动，难以发现——注意其从一个栖枝到另一个栖枝的短距离飞行。偏爱结实的森林树木。声音：细细、高亢的哨鸣\
  \ `siiiit`；叫声包括斥的 `cet-cet-cet` 声，通常在受惊时发出。栖息地：中、高海拔热带山地雨林。分布：爪哇岛特有。\n\n![image](img/page267.jpg)\n\
  \n## 127 鹨类；�留�；叉尾鸟\n\n### 1 西伯利亚石鹨\n`Saxicola maurus` 13cm. 野外记录：停在显眼的栖枝上，以便频繁俯冲捕捉地面或近处的昆虫，偶尔进行空中捕虫飞行。声音：一系列多变的、沙哑的啾啾声和鸣声；叫声包括生硬的\
  \ `chack` 和细细的 `hweet`。栖息地：有灌木和耕地的开阔地区。分布：婆罗洲的候客。\n\n### 2 黑白画鹨（斑石鹨）\n`Saxicola\
  \ caprata` 13–14cm. 野外记录：觅行为与西伯利亚石鹨相似。声音：歌声是快速的哨鸣 `chip-chepee-chewee-ch` 或类似；叫声包括哀伤的\
  \ `chep-chep-hee` 和斥的 `chuh`。栖息地：有灌木或散落树木的开阔地、草原和耕地。分布：留于爪哇、巴厘、菲律宾、苏拉威锡和小松达达群岛；婆罗洲的候客。\n\
  \n### 3 白腹画石鹨\n`Saxicola gutturalis` 15–17cm. 野外记录：通常成对出现；在采集昆虫后进行短距离俯冲。偏爱树冠或高层林下灌木，并在高树的茂密树冠中歌唱。`S.`.\
  \ `g.`. `luctuosus` (3b) 出于塞马乌岛。声音：一系列甜美、从容的乐句；叫声包括 `tchk-tchk`。栖息地：季风林残片、季风林地和次生林。分布：东小松达达群岛特有。\n\
  \n### 4 �留�留（北�留）\n`Oenanthe oenanthe` 14cm. 野外记录：在地面觅食。显然在大面积范围内与前一种物种存在杂交——或许将其视为后者的亚种更为合适？声音：包括生硬的\
  \ `chack` 和细细的 `wheet`。栖息地：开阔地区、耕地。分布：婆罗洲和菲律宾的候客。\n\n### 5 婆罗洲叉尾鸟\n`Enicurus borneensis`\
  \ 28cm. 野外记录：行为与其他物种相似。声音：尖锐的双哨声。栖息地：山地溪流。\n\n### 6 白冠叉尾鸟\n`Enicurus leschenaulti`\
  \ 25–28cm. 野外记录：在岩石或水边觅食；受干扰时消失在附近的森林中。声音：一系列甜美、高音哨声；叫声包括生硬的 `ts`。栖息地：流快的河流。\n\n\
  ### 7 栗喉叉尾鸟\n`Enicurus ruficillus` 18–25cm. 野外记录：警觉；在溪边寻找食物。声音：一系列细、尖锐的哨声和 `dir-tee`。栖息地：河流、溪流和瀑布。分布：留于苏门答腊。\n\
  \n### 8 巽达叉尾鸟\n`Enicurus velatus` 16cm. 野外记录：信息较少；推测与其他叉尾鸟相似。声音：生硬、尖锐的 `chee`。栖息地：遍石的河流和流快的溪流。分布：苏门答腊和爪哇岛特有。\n\
  \n![image](img/page269.jpg)\n\n## 128 画雀\n\n### 1 褐眉吃蝶雀\n`Anthipes solitaris` 12–13cm.\
  \ 野外记录：长时间停留在下层，位于阴凉的栖枝上。进行短距离捕虫飞行，并从地面采集昆虫。声音：细细、颤抖的 `three-blind-mice`。叫声包括细的\
  \ `tseep`、锐的 `tchik` 和粗厉的啾声。栖息地：阔叶常绿林。分布：留于苏门答腊。\n\n### 2 黄臀画雀\n`Ficedula zanthopygia`\
  \ 13cm. 野外记录：在树叶或林下层觅食，并经常俯冲捕捉飞行的昆虫。声音：干燥、咔哒的 `tr-r-r-rt`。栖息地：森林、森林边缘和灌木丛。分布：苏门答腊的冬客；爪哇、巴厘和婆罗洲的候客。\n\
  \n### 3 金花画雀\n`Ficedula narcissina` 13–14cm. 野外记录：从中层或树冠进行捕虫俯冲；也在灌木丛林下层和低矮植物中觅食。叫声：包括柔和的\
  \ `tink-tink`。栖息地：开阔林地、选择性采伐森林、散落树木的耕地、灌木丛和红林。分布：婆罗洲和菲律宾的冬客。\n\n### 4 柳眉画雀\n`Ficedula\
  \ mugimaki` 13cm. 野外记录：在中层和上层中不起眼的觅食者。经常抖动并展开尾巴。叫声：包括柔和、咔哒的 `trrrr`。栖息地：森林和森林边缘。分布：苏门答腊、爪哇、巴厘、婆罗洲、菲律宾和苏拉威锡的冬客；北马鲁古群岛的候客。\n\
  \n\n\n\n# 5 塔楠巴鸴 *Ficedula riedeli* 11–12cm\n野外记录：在森林林层和竹林中觅食。曾被认为是栗胸鸴的一个亚种。鸣声：推测与栗胸鸴相似。栖息地：低地和低山森林。分布：特产于东小巽门腊群岛的塔楠巴岛。\n\
  \n# 6 栗胸飞鸴 *Ficedula dumetoria* 11–12cm\n野外记录：在茂密的植被低处觅食，通常靠近溪流；经常在飞行中捕食昆虫。鸣声：独特的高音、起升起伏的\
  \ `sii wi-sii si-wi-si-ii` 和 `si-wi-oo`；叫声包括柔和的 `sst-sst`。栖息地：低地到低山原生森林，伴有竹林和林层。分布：栖于苏门答腊、爪哇、婆罗腊岛和西小巽门腊群岛。\n\
  \n# 7 邦杜克鸴 *Ficedula luzoniensis* 11–13cm\n野外记录：行踪神秘，在森林林层中觅食。曾被认为是白眉飞鸴的一个亚种。`F`.\
  \ `l`. `nigrorum` (7b) 于菲律宾中部的尼格罗斯岛和潘盖岛。鸣声：信息较少；可能与以下物种相似。栖息地：山林。分布：特产于菲律宾。\n\n\
  # 8 白眉飞鸴 *Ficedula hyperythra* 11–13cm\n野外记录：在灌木丛和丛林低处觅食；像短翅莺一样在地面奔跑。`F`. `h`. `pallidipectus`\
  \ (8b) 于北摩鹿娄加群岛的巴坎岛。鸣声：纤细的 `sip` 和上扬的 `seep`；歌声是沙哑的、尖锐的 `tsit-sit-si-sii tsi-sii-swrri`\
  \ 或 `tsi-sit-i`。栖息地：丘陵和山林。分布：在该地区广泛，除菲律宾外。\n\n# 9 栗喉飞鸴 *Ficedula rufigula* 11–12cm\n\
  野外记录：通常在茂密的藤类丛林中地上觅食，多成对出现。鸣声：高低起伏的 `si-si-si` 或 `swee-wee-seee`；叫声包括快速的 `chik`\
  \ 和断续的叽喳声。栖息地：原生低地和丘陵森林以及沼泽森林。分布：特产于苏拉答腊岛。\n\n# 10 肉桂胸飞鸴 *Ficedula buruensis* 11–12cm\n\
  野外记录：不显眼。喜好茂密森林林层的阴暗处。鸣声：嗡嗡的、鼻音的 `tup tup tezeeew`。栖息地：低地和丘陵森林。分布：特产于南摩鹿娄群岛。\n\n\
  ![image](img/page271.jpg)\n\n## 129 飞鸴类\n\n# 1 石色飞鸴 *Ficedula basilanica* 12–13cm\n\
  野外记录：通常行踪神秘，在地面和错综的林层中觅食；通过其叫声最易被发现。`F`. `b`. `samarensis` (1b) 于菲律宾东部。鸣声：一系列叽喳声的哨音，有时以颤音结束。叫声包括柔和的、哨般的\
  \ `pee-pawww pee-pee-hi-hi`。栖息地：原生森林和次生林。分布：特产于菲律宾。\n\n# 2 达马飞鸴 *Ficedula henrici*\
  \ 12–13cm\n野外记录：通常单独独居或成对出现。利用暴露的树枝俯冲捕食昆虫；也采食猎物。鸣声：传播较远的哨声。栖息地：茂密的常绿林。分布：特产于东小巽门腊群岛的达马岛。\n\
  \n# 3 帛望飞鸴 *Ficedula platenae* 11–12cm\n野外记录：害羞且神秘，喜好密集的藤类和攀缘竹；通常单独活动。鸣声：多变的、沙哑的高音\
  \ `zee-zawww`、`zawwp-zeeepp`、`zee zeet zeeett` 或 `zeee-zawwwpppp`，随后是短促的叽喳。栖息地：低地原生森林和次生林。分布：特产于菲律宾西帛望岛。\n\
  \n# 4 桑巴飞鸴 *Ficedula harterti* 11cm\n野外记录：害羞且神秘。在森林下生植物中觅食，通常单独或成对出现。持续抖动尾巴。鸣声：一系列哀伤的三个下降哨音，随后是一声尖锐的\
  \ `zip`；叫声包括昆虫般的、嗡嗡的 `tszzz`、`chik-ik` 和 `chikikikikikiki`。栖息地：原生和次生森林、森林边缘、灌木丛和次生林。分布：特产于小巽门腊群岛的桑巴岛。\n\
  \n# 5 隐秘飞鸴 *Ficedula crypta* 11–12cm\n野外记录：神秘，通常喜好下生植物和次生林；单只或成对出现。鸣声：一系列高音短语。栖息地：亚山原生苔藓森林和次生林。分布：特产于菲律宾南部的民兰腊岛。\n\
  \n\n\n\n\n# 5 灰纹飞韸\n*Muscicapa griseisticta* 14cm\n野外习性：通常单独活动；在捕食飞行昆虫后会快速冲刺，经常回到同一个树顶上栖息。\n\
  鸣声：鸣叫声包括响亮的 `chipee`、`tee-tee` 或 `zeet zeet zeet`。\n栖地：开阔林地、森林边缘和空地，以及有树的草地。\n分布：冬季迁徙至新婆罗岛、菲律宾和瓦拉西群岛（西小巽丹群岛除外）。\n\
  \n# 6 苏门答腊斑条纹飞韸\n*Muscicapa sodhii* 12–14cm\n野外习性：从林下层或更高处的栖木飞出捕食飞行昆虫。偶尔在混物种觅食群中可见。\n\
  鸣声：纤细而高亮的哨声、啾鸣、叽叽声、颤音和嗡嗡音。\n栖地：原生低地森林和亚山地阔叶常绿林。\n分布：苏门答腊特有。\n\n# 7 灰胸飞韸\n*Muscicapa\
  \ randi* 12–13cm\n野外习性：在林下层或森林边缘及空地的较低层位觅食。通常单独或成对活动。\n鸣声：高调且重复的 `wee-tit`，以及较长的\
  \ `zeeeeee-tip-tip-zee zizizizi`。\n栖地：山地森林和选择性采伐的森林。\n分布：菲律宾特有。\n\n# 8 深色腹飞韸\n*Muscicapa\
  \ sibirica* 13cm\n野外习性：从显眼的栖木上快速俯冲捕获昆虫。\n鸣声：清脆的 `chi-up-chi-up-chi-up`。\n栖地：亚山地森林和山地森林。\n\
  分布：冬季迁徙至苏门答腊、爪哇西和婆罗岛；为菲律宾的客鸟。\n\n# 9 亚洲棕褐飞韸\n*Muscicapa dauurica* 13cm\n野外习性：从显眼的栖木上飞出捕食昆虫。\n\
  鸣声：鸣叫包括柔和的摩擦声、短促的 `tzi` 和柔和的 `churr`。\n栖地：开阔森林、次生林、公园和花园。\n分布：冬季迁徙至苏门答腊、爪哇、婆罗岛、菲律宾和苏威答腊。\n\
  \n# 10 棕斑纹飞韸\n*Muscicapa williamsoni* 14cm\n野外习性：从显眼的栖木上进行捕虫俯冲。本地种群（图中所示）通常颜色较深。\n\
  鸣声：尖锐的哨声；鸣叫包括纤细的 `tzi` 和粗哑、模糊的 `cheititit`。\n栖地：阔叶常绿林。\n分布：栖息于婆罗岛，冬季迁徙至婆罗岛。\n\n\
  # 11 桑巴棕褐飞韸\n*Muscicapa segregata* 13cm\n野外习性：在林下层和树木低层位觅食；经常长时间静静地停留。\n鸣声：一系列杂乱、快速、高调的哨声、颤音和粗哑音符，通常以颤音结束。\n\
  栖地：低地原生森林、次生林和森林边缘。\n分布：西小巽丹群岛的桑巴岛特有。\n\n# 12 铁锈色树飞韸\n*Muscicapa ferruginea* 12–13cm\n\
  野外习性：在扫掠式的空中追逐中捕获昆虫，回到喜爱的或附近的栖木上。\n鸣声：尖锐的 `tsit-tittu-titt` 和柔和的颤音 `si-si-si`。\n\
  栖地：低地和中低山地的成熟林及次生林。\n分布：冬季迁徙至苏门答腊、爪哇、婆罗岛和菲律宾。\n\n![image](img/page275.jpg)\n\n##\
  \ 131 飞韸类\n\n### 1 蓝白韸\n*Cyanoptila cyanomelana* 17cm\n野外习性：在树冠层觅食；也会访问较低层位从叶片或树枝上采集昆虫，并从显眼的栖木上进行捕虫俯冲。\n\
  鸣声：鸣叫包括粗鲁的 `tchk-tchk` 和柔和的 `tic` 或 `tac`。\n栖地：原生和次生低地及亚山地森林、海岸林和灌丛。\n分布：冬季迁徙至苏门答腊、爪哇、婆罗岛、苏威答腊北部和菲律宾。\n\
  \n### 2 蓝绿韸\n*Eumyias panayensis* 14cm\n野外习性：通常单独或成对出现；经常加入混物种觅食群。通过俯冲或啄食捕捉猎物。`E`.\
  \ `p`. `nigrimentalis` (2b) 出于菲律宾北部；`E`. `p`. `nigriloris` (2c) 位于菲律宾南部。\n鸣声：歌声是单调的鸣唱，由约\
  \ 20 个音符组成。\n栖地：亚山地森林、森林空地边缘。\n分布：栖息于菲律宾、苏威答腊、苏拉群岛和马鲁古群岛。\n\n### 3 绿喉韸\n*Eumyias\
  \ thalassinus* 15–17cm\n野外习性：从树冠层或森林边缘的裸露栖木上飞出捕食飞行昆虫。\n鸣声：悦耳的颤音式 `p-p-pwe`… `p-p-pwe`…\
  \ `pe-tititi-wu-pitititi-weu`；鸣叫包括短促、哀伤的 `pseeut`。\n栖地：低地和亚山地森林。\n分布：栖息于苏门答腊。\n\n\
  ### 4 蓝韸\n*Eumyias indigo* 14cm\n野外习性：在低层位觅食，常在灌木丛中。通过啄食或短促俯冲捕捉无脊椎动物。常在混物种群中可见。\n\
  鸣声：一系列重复三次的高调 `chirr` 音符，有时带有嗡嗡音或颤音。尖锐的哨声。\n栖息于爪哇。\n\n### 5 斑纹胸飞韸（丛韸类）\n*Eumyias\
  \ additus* 15cm\n野外习性：活跃的飞韸；相关信息较少。\n鸣声：未报道。\n栖地：低地、山地和选择性采伐森林。\n分布：马鲁古群岛的布鲁鲁岛。\n\
  \n### 6 褐背丛韸\n*Cyornis oscillans* 13–15cm\n野外习性：在茂密的灌木丛到中层层位觅食；在栖木上时可能会展开尾巴。`stresemanni`\
  \ (6b) 出于桑巴岛。\n鸣声：一系列杂乱的高调音符，包括单次上升音符、快速下降的哨声和颤音，以及交替的高低音。粗鲁的声。\n栖地：原生山地林。\n分布：小巽丹群岛特有。\n\
  \n### 7 棕胸丛韸\n*Cyornis brunneatus* 15cm\n野外习性：出没于底层树冠和灌木丛；在空中捕获昆虫或在森林地面落叶层中觅食。\n\
  鸣声：一系列下降的哨声；鸣叫包括粗鲁的摩擦声。\n栖地：半常绿混交林。\n分布：婆罗岛的客鸟。\n\n### 8 灰胸丛韸\n*Cyornis umbratilis*\
  \ 15cm\n野外习性：从灌木丛到中层树冠觅食；偶尔进行空中俯冲。\n鸣声：纤细、优美的下降调 `si ti-ti lou`；鸣叫包括责备的 `churr-churr-churr`、咔哒声\
  \ `tchk-tchk`。\n栖地：低地原生和次生森林。\n分布：栖息于苏门答腊和婆罗岛。\n\n## 132 飞韸类\n\n### 1 褐尾丛韸\n*Cyornis\
  \ colonus* 14cm\n野外习性：单独、成对或小群出现。不显眼。相关信息较少。\n鸣声：一系列杂乱、尖锐、清晰、高调的音符，包括单次上升音符、快速下降的哨声和颤音，以及交替的高低音。\n\
  栖地：低地原生、次生和退化森林；也出现在选择性采伐的森林中。\n分布：栖息于苏威答腊和苏拉群岛。\n\n### 2 栗尾丛韸\n*Cyornis ruficauda*\
  \ 15cm\n野外习性：在林下层和森林边缘觅食；偶尔从低处栖木上俯冲捕昆虫。\n鸣声：一系列最多重复三次的高调 `chirr` 音符，或更具韵律的 `cheep\
  \ cheep chirr`，有时带有嗡嗡音或颤音。\n栖地：低地和中低山森林及森林空地。\n分布：栖息于婆罗岛和菲律宾。\n\n![image](img/page277.jpg)\n\
  \n\n\n\n\n### 3 橙胸林鸏 *Cyornis olivaceus* 15cm\n**野外记录：** 通常发现于森林的中下层。捕食飞行昆虫后出击。偶尔会竖起尾羽并扇动尾羽。\n\
  **鸣声：** 一系列快速的短促句子，音调交替，由音乐性、沙沙声、叮当声和咕噜声组成；叫声包括低低的 `tchuck-tchuck`、`trrt` 和刺耳的 `tac`。\n\
  **栖息地：** 低地阔叶原生林和次生林、林场和森林边缘。\n**分布范围：** 栖于苏门答腊、爪哇岛、巴厘岛和婆罗洲岛。\n\n### 4 丁那蓝（蓝鸏） *Cyornis\
  \ sanfordi* 14–15cm\n**野外记录：** 不显眼。出没于灌木丛和森林的中下层，出击捕捉昆虫；通常单独活动或在混物种觅食群中活动。\n**鸣声：**\
  \ 一系列快速、纤细、清晰或低沉的音符，音调变化。\n**栖息地：** 原生山地和山地常绿阔叶林。\n**分布范围：** 苏拉威锡北岛特有。\n\n### 5\
  \ 蓝额蓝鸏 *Cyornis hoevelli* 15cm\n**野外记录：** 从灌木丛到森林树木的中层觅食，从叶片上搜寻昆虫。通常单只出现、成对出现，或偶尔在混物种进食群中出现。不显眼；最好通过其鸣声确定位置。\n\
  **鸣声：** 一段悦听、丰富的 10–20 个音符序列；还由 4–5 个不和谐的音符和声响亮的 `tsat-tsat-tsat` 组成。\n**栖息地：**\
  \ 山地雨林和苔藓森林。\n**分布范围：** 苏拉威锡岛特有。\n\n### 6 白尾蓝鸏 *Cyornis concretus* 18cm\n**野外记录：**\
  \ 在灌木丛底层或森林树木的低矮枝上上觅食；经常展开尾羽以露出白色斑块。`C.` `c.` `everetti` (6b) 见于婆罗洲，雄性尾部缺少白色。\n\
  **鸣声：** 一系列变化的、穿透力的嘶声哨叫；叫声包括柔和的 `pweee` 和刺耳的 `scree`。\n**栖息地：** 原生低地、山地和山地森林。\n\
  **分布范围：** 栖于苏门答腊和婆罗洲岛。\n\n### 7 帝汶蓝鸏 *Cyornis hyacinthinus* 16cm\n**野外记录：** 常出没于树木的中下层。出击捕捉飞行昆虫，经常回到同一个高处栖息。`C.`\
  \ `h.` `kuehni` (7b) 见于韦塔岛。\n**鸣声：** 一系列单调、快速的结结状起伏音符；叫声包括短促、低沉的咕泡声。\n**栖息地：** 原生和次生季风林及林地的残迹、山坡灌木丛，以及退化森林和林场的边缘。\n\
  **分布范围：** 小巽巽达群岛东部特有。\n\n### 8 鲁氏蓝鸏 *Cyornis ruckii* 17cm\n**野外记录：** 资料极少；仅已知 1917\
  \ 年和 1918 年采集的两个标本。\n**鸣声：** 未记录。\n**栖息地：** 经伐过的低地森林。\n**分布范围：** 苏门答腊东北部特有。\n\n\
  ![image](img/page279.jpg)\n\n#### 133 ��类\n\n### 1 蓝胸蓝鸏 *Cyornis herioti* 15cm\n\
  **野外记录：** 单只、成对或在混物种觅食群中遇到，范围从森林的下层到中层。`C.` `h.` `camarinensis` (1b) 见于吕宋南部和卡塔丹杜安斯岛。\n\
  **鸣声：** 哨般的 `seeeep wheeu` 或 `seeeep seeeep wheeu`，中间夹杂着叽叫和嗡嗡的音符。\n**栖息地：** 低地和亚山地原生及选择性采伐森林。\n\
  **分布范围：** 菲律宾北部特有。\n\n### 2 浅蓝鸏 *Cyornis unicolor* 18cm\n**野外记录：** 针对飞行昆虫进行空中出击，并在树木的中上层叶间觅食。\n\
  **鸣声：** 歌声丰富悦听，非常像画眉；受惊时发出柔和的 `tr-r-r-r`。\n**栖息地：** 原生和次生阔叶低地、山地和低山地森林。\n**分布范围：**\
  \ 栖于苏门答腊、爪哇岛和婆罗洲岛。\n\n### 3 山地蓝鸏 *Cyornis banyumas* 15cm\n**野外记录：** 不起眼；从低处栖息俯捕昆虫。\n\
  **鸣声：** 一段短促、金属感、下降颤音；叫声包括刺耳的 `tac` 和责备般的 `trrt-trrt-trrt`。\n**栖息地：** 密密灌木丛的亚山地森林。\n\
  **分布范围：** 栖于爪哇岛和婆罗洲岛。\n\n### 4 吕望蓝鸏 *Cyornis lemprieri* 16cm\n**野外记录：** 通常单只或成对遇到。在森林下层觅食。\n\
  **鸣声：** 一段柔和、悦听、下降后上升的 `de do da da do de`，以及 `da de do poy`。\n**栖息地：** 低地和亚山地干燥原生及次生森林。\n\
  **分布范围：** 菲律宾西部特有。\n\n### 5 婆罗洲蓝鸏 *Cyornis superbus* 15cm\n**野外记录：** 通常单独或成对出现。从低处栖息捕昆虫，并悬停在枝头啄取昆虫。\n\
  **鸣声：** 高音的 `hiu-te-hie`。\n**栖息地：** 亚山地原生和次生林；偶尔出现在低层森林。\n**分布范围：** 婆罗洲岛特有。\n\n\
  ### 6 大嘴蓝鸏（巽达腊蓝鸏） *Cyornis caerulatus* 14cm\n**野外记录：** 从低处觅食，通常成对出现。\n**鸣声：** 一段纤细、金属感、上升后下降的\
  \ `si-si`。\n**栖息地：** 低地。\n**分布范围：** 栖于苏门答腊和婆罗洲岛。\n\n### 7 马来西亚蓝鸏 *Cyornis turcosus*\
  \ 13–14cm\n**野外记录：** 从低处栖息进行空中追捕。\n**鸣声：** 哨般的 `do ray me`。\n**栖息地：** 低地龙脑香林。\n\
  **分布范围：** 栖于苏门答腊。\n\n### 8 提克蓝鸏 *Cyornis tickellae* 14cm\n**野外记录：** 在森林下层觅食。\n**鸣声：**\
  \ 柔和的金属感颤音；叫声包括刺耳的 `tac` 或 `tik-tk` 和 `trrt`。\n**栖息地：** 低地次生林。\n**分布范围：** 栖于苏门答腊和婆罗洲岛。\n\
  \n![image](img/page281.jpg)\n\n#### 134 ��类\n\n### 1 苏拉威锡蓝鸏 *Cyornis omissus* 14–15cm\n\
  **野外记录：** 清晨出现在路边植被中，其他偏好森林下层。通常成对出现。\n**鸣声：** 一段短促、弱的 4–5 音节鸣，随后是 3–4 声响亮的哨叫。\n\
  **栖息地：** 山地森林。\n**分布范围：** 苏拉威锡岛特有。\n\n### 2 腹红蓝鸏 *Cyornis rufigastra* 14–15cm\n\
  **野外记录：** 在低处觅食，经常从隐蔽的栖处出击。`C.` `r.` `kalaoensis` (2b) 见于卡拉奥岛；`C.` `r.` `philippinensis`\
  \ (2c) 发现于菲律宾西部。\n**鸣声：** 一段缓慢、低沉、短促的金属颤音，先下降后上升；叫声包括重复的干燥 `psst` 和尖锐 `chik-chik-chik`。\n\
  **栖息地：** 红树林、海岸森林、灌丛和林场边缘。\n**分布范围：** 栖于苏门答腊、爪哇岛、婆罗洲、菲律宾和塞亚莱岛。\n\n### 3 詹蓝鸏 *Cyornis\
  \ djampeanus* 14–15cm\n**野外记录：** 曾被认为是腹红蓝鸏的一个亚种。\n**鸣声：** 未知。\n**栖息地：** 郁闭森林。\n\
  **分布范围：** 詹岛特有。\n\n### 4 大蓝鸏 *Niltava grandis* 21cm\n**野外记录：** 在幽暗的灌木丛中躲藏。偶尔在空中追捕昆虫，尽管通常不如大多数蓝��类敏捷；有时在地面觅食。\n\
  **鸣声：** 哨般的 `do ray ray me` 或 `uu-uu-du-di`；叫声包括鼻性的 `dju-ee`、响亮的 `trr-k trr-k` 和刺耳的咯咯声。\n\
  **栖息地：** 山地森林。\n**分布范围：** 栖于苏门答腊。\n\n### 5 棕腹蓝鸏（苏门答腊蓝鸏） *Niltava sumatrana*\n\n\n\
  \n\n\n15cm 习性记录：在地面、密集的灌木丛以及森林树木的底层至中层觅食。鸣声：一系列单调、清晰且起伏的哨鸣声，以及一系列快速、刺耳、模糊的音符；叫声包括响亮的\
  \ `chik` 声。栖息地：山地阔叶常绿林。分布：留于苏门答腊。\n\n## 6 姬蓝鸸（小蓝鎸）*Muscicapella hodgsoni*\n\n10cm\
  \ 习性记录：在树木叶丛中活跃的、类似叶莺的觅食者，通常成对或单独活动；也会加入混种食群。经常抖动翅膀并歪尾巴。鸣声：高音的 `tzzit-che-che-che-heeee`\
  \ 或类似声音；叫声包括微弱的 `tsip`、`tip` 或 `tup` 以及低沉的 `churr`。栖息地：密集的山地阔叶林。分布：留于苏门答腊和婆罗洲。\n\
  \n## 7 灰头���（灰头金鸔）*Culicicapa ceylonensis*\n\n12–13cm 习性记录：在树枝、叶丛和藤蔓间活跃穿梭；也会进行杂技般的俯冲捕昆虫。栖息时经常抖动尾巴。鸣声：多变，包括响亮、尖锐的\
  \ `tit-titu- whee`、`chilup chilli chilli` 和 `saw-see-saw-see-saw`；叫声包括柔和的 `pit -\
  \ pit - pit` 和沙哑的 `churru`。栖息地：原生森林和高大的次生低地及丘陵森林、河岸森林、森林碎片、森林边缘和耕地。分布：留于苏门答腊、爪哇、巴厘岛、婆罗洲和小松汶达群岛。\n\
  \n## 8 黄腹���（黄腹金鸔）*Culicicapa helianthea*\n\n11–12cm 习性记录：喜欢中层和下林冠，以及次生生长灌木丛的顶部；通过捕捕昆虫或从叶片上啄食觅食。单独出现、成对或在混种觅食群中。鸣声：一系列\
  \ 4–5 声响亮、清晰、音调变化的音符，或带有升降的嗡嗡声短语，如 `tsu-si-tchu-si-si` 或 `sweet su sweet`，以短促的颤音结束；叫声包括\
  \ `tsu-tsu tswee`、长长的鼻音断奏颤音和 `speet`。栖息地：低地至山地森林、森林边缘、次生林和耕地边缘。分布：留于菲律宾、苏拉威锡岛以及班盖岛和苏拉岛。\n\
  \n![image](img/page283.jpg)\n\n## 135 鹊类\n\n### 1 塔尼姆巴鹊 *Aplonis crassa*\n\n20cm\
  \ 习性记录：单独、成对或多达 200 只鸟的群群出现，经常在花花或结果的树木冠层可见。幼鸟呈暗褐色，腹部色浅有深色条纹。鸣声：重复的哨音、金属感音；鸟群发出嘈杂混乱的哨音和金属感鸣声。栖息地：林区，包括次生林和林缘。分布：东小松汶达群岛的塔尼姆巴岛（特有）。\n\
  \n### 2 摩鹿加鹊 *Aplonis mysolensis*\n\n20cm 习性记录：群居性。通常以小群或大群出现，经常在果树上高处可见。幼鸟背部棕黑色，腹部为浅褐色，有明显的深色条纹。鸣声：不悦耳的、鼻音的模糊哨声，通常由鸟群发出；还有各种叽叫和尖叫声。栖息地：红树林、沿海林、原生低地和丘陵森林、退化森林、森林边缘、耕地和城市地区。分布：留于班盖岛、苏拉岛和马马鹿加群岛。\n\
  \n### 3 紫冠鹊 *Aplonis circumscripta*\n\n21–26cm 习性记录：曾被认为是金属鹊的一个亚种；习性和行为推测与之相似。鸣声：未知；推测与金属鹊相似。栖息地：森林边缘、林木稀疏的耕地、受干扰森林、次生林、红树林和种植园。分布：东小松汶达群岛的塔尼姆巴岛（特有）。\n\
  \n### 4 亚洲光鹊 *Aplonis panayensis*\n\n20cm 习性记录：主要是树栖性。群居性，集体繁殖和栖息。幼鸟背部暗色，腹部灰白色带深色条纹。鸣声：一系列金属感的尖叫声。栖息地：森林边缘、次生林、沿海森林、种植园和城市地区。分布：留于苏门答腊、爪哇、巴厘岛、婆罗洲、菲律宾和苏拉威锡。\n\
  \n### 5 金属鹊 *Aplonis metallica*\n\n21–26cm 习性记录：群居性，通常以中大、嘈杂的鸟群出现，经常与摩鹿加鹊在一起。喜欢花花或结果的树木冠层。幼鸟背部暗色，腹部色浅带浅色条纹。鸣声：响亮、不悦耳的下行模糊音；还有粗哑的音符，包括粗鲁的\
  \ `squeeow`。栖息地：林木稀疏的耕地、受干扰森林、种植园、红树林、次生林和森林边缘。分布：留于苏拉岛、东小松汶达群岛和马鹿加群岛。\n\n### 6\
  \ 短尾鹊 *Aplonis minor*\n\n18cm 习性记录：群居性；小群觅食，果树处集中度较高。幼鸟背部和胸部棕绿色，腹部浅褐色带条纹。鸣声：叫声包括哀婉的\
  \ `seep`、粗鲁的 `kaar` 和柔和的 `preep`（注：此处原文逻辑略乱）。\n\n### 7 栗颊鹊 *Agropsar philippensis*\n\
  \n16–18cm 习性记录：主要是树栖性。群居性，集体栖息；经常与其他鹊类混群。鸣声：穿透力的 `airr` 和尖锐的 `shree-shree`，飞行时为悦律的\
  \ `chruu`。栖息地：次生林、有树木的开阔地。分布：客于婆罗洲和北马鹿加群岛。\n\n### 8 达利亚鹊（紫背鹊）*Agropsar sturninus*\n\
  \n17cm 习性记录：群居性，集体栖息；经常与其他鹊类混群。休息的鸟群经常坐在暴露的树枝上理毛。鸣声：包括响亮的碎裂声和飞行时的柔和 `prrp`。栖息地：沿海森林、森林边缘、次生林、有树的开阔地和花园。分布：客于苏门答腊和爪哇。\n\
  \n![image](img/page28.jpg)\n\n## 136 鹊类；八脚鸟\n\n### 1 红嘴鹊（丝雀鹊）*Spodiopsar sericeus*\n\
  \n22cm 习性记录：群居性，经常成大群出现。在地面和树上觅食。鸣声：歌声甜美悦耳；鸟群会发出叽叫声。栖息地：有树木的耕地和花园。分布：客于菲律宾。\n\n\
  ### 2 白颊鹊 *Spodiopsar cineraceus*\n\n22cm 习性记录：群居性。主要在地面觅食。鸣声：单调的、吱吱的 `chir-chir-chay-cheet-cheet`。栖息地：开阔地区、耕地和开阔林。分布：客于北菲律宾。\n\
  \n### 3 白肩鹊 *Sturnia sinensis*\n\n17cm 习性记录：通常群居。在树上和地面觅食。鸣声：粗鲁的 `kaar` 和飞行时的柔和\
  \ `preep`。栖息地：有树木的开阔地、灌木丛和城市地区。分布：客于婆罗洲和菲律宾。\n\n### 4 亚洲斑鹊（亚洲八脚鸟）*Gracupica contra*\n\
  \n22–25cm 习性记录：主要在地面觅食，通常成对或小群出现，集体栖息地处成大群。鸣声：长时间的尖锐啾鸣，伴有几声咯咯声和嗡嗡声，有时还包括模仿其他鸟类。栖息地：开阔、通常潮湿的有树木地区、耕地和城市地区。分布：留于苏门答腊、爪哇和巴厘岛。\n\
  \n\n\n\n\n# 5 黑翅八哥 *Acridotheres melanopterus* 22–24cm 野外记记：主要在地面上觅食，通常以 3–10 只鸟成群活动。*A*.\
  \ *m*. *tertius* (5b) 出于巴厘岛和兰莫汶岛；*A*. *m*. *tricolor*（未画）发现于爪哇腊南部，背部呈灰色，次覆羽为黑色。声音：叫声包括向下转调的\
  \ `cha cha cha`、沙哑的 `tok` 或 `chok`、粗厉的 `kaar kaar`、拉长的 `kreeer` 以及 `kishaa kishaa`；还有各种哨哨声和吱叫声。栖息地：耕作区、休耕地、牧场、草坪和果园；曾见于于原生和次生季风雨林、森林边缘和林地。分布：特产于西小巽门群岛的爪哇腊、巴厘岛和兰莫汶岛。\n\
  \n# 6 常见的八哥 *Acridotheres tristis* 23cm 野外记记：非常温顺。飞行时，初级羽上有明显的白色斑块。声音：一种抱怨的 `kwerrh`\
  \ 和许多咕噜声和叽叽喳喳；警觉时会发出粗厉的 `chake-chake`。歌声是咕噜声和哨音短句的无调混杂。栖息地：人类居住区周围、开阔地区和耕地。分布：已引入婆罗洲岛。\n\
  \n# 7 爪哇八哥 *Acridotheres javanicus* 24–25cm 野外记记：主要在地面上成对或成小群觅食，在食物充足的地方会出现较大的群体。飞行时，初级羽基部显示白色斑块。声音：与常见八哥非常相似。栖息地：开阔乡村、耕地和城市地区。分布：留于苏答腊、爪哇腊和巴厘岛；已引入婆罗洲岛。\n\
  \n# 8 浅腹八哥（苏拉腊八哥） *Acridotheres cinereus* 25cm 野外记记：通常以 3–10 只鸟成群在地面觅食，在食物充足的周围觅食。声音：一种随机的干涩、不音乐感的鼻音、吱叫声和哨音。栖息地：旱地、水田、牧场、疏林的耕地。分布：特产于苏拉腊岛；已引入婆罗洲和小巽门群岛。\n\
  \n# 9 冠八哥 *Acridotheres cristatellus* 25cm 野外记记：通常成群出现，在地面觅食。成群栖息。飞行时，初级羽基部显示有一处白色闪光。声音：类似于常见八哥，但歌声更多哨音。栖息地：开阔地区、灌木丛。分布：已引入婆罗洲。\n\
  \n![image](img/page287)\n\n## 137 八哥\n\n# 1 巴厘八哥 *Leucopsar rothildi* 25cm 野外记记：主要在树上活动。通常成对出现，或成群栖息。幼鸟背部呈灰色，翅膀呈肉桂色。声音：响亮的哨音。栖息地：开阔林地。分布：特产于巴厘岛。\n\
  \n# 2 苏拉腊冠八哥（苏拉腊八哥） *Basilornis celebensis* 27cm 野外记记：通常成对或成小群出现。在树冠层觅食。在清晨或傍晚栖息在暴露的树枝上。声音：主要由高音调哨音组成，并伴有短促的鼻音、吱叫声和\
  \ `chip`。栖息地：低地森林、次生森林、森林边缘、以及耕地。分布：特产于苏拉腊岛。\n\n# 3 盔甲八哥 *Basilornis galeatus* 24–25cm\
  \ 野外记记：通常成对出现，在次生森林中栖息。声音：每隔几秒发出一次隆隆的 `poo poop`，并有上升的哨音和下降的鼻音。栖息地：原生林、选择性采伐森林、疏林耕地。分布：特产于班盖岛和苏拉腊群岛。\n\
  \n# 4 长冠八哥 *Basilornis corytha* 24–26cm 野外记记：吵闹。在果树上通常单只、成对或成小群出现。在飞行时，初级羽基部显示白色斑块。声音：一系列尖锐的哨音，并伴有拉长的鼻音。栖息地：次生森林、森林边缘、疏林耕地。分布：特产于塞拉姆岛（摩卢喀群岛）。\n\
  \n# 5 阿八哥 *Basilornis mirandus* 28–30cm 野外记记：通常单只、成对或成小群出现。栖息在高处的暴露树枝上。声音：各种叮哒声，并伴有咕噜声和吱叫声。栖息地：山地森林。分布：特产于棉兰（菲律宾）。\n\
  \n# 6 白颈八哥 *Streptocitta albicollis* 42–50cm 野外记记：通常成对或成小群出现，并与其他物种混合觅食。经常栖息在暴露的树枝上。声音：清晰的哨音、拉长的鼻音\
  \ `towee`。栖息地：原生林和次生森林、森林边缘、疏林耕地。分布：特产于北苏拉腊。\n\n# 7 裸眼八哥 *Streptocitta albertinae*\
  \ 42–45cm 野外记记：通常成对出现，偶尔三三成群。在树木的高层活动。栖息地：退化森林、选择性采伐森林、森林边缘、沼泽和疏林耕地。分布：特产于苏拉腊。\n\
  \n# 8 柯托八哥 *Sarcops calvus* 26–28cm 野外记记：通常成对出现，较大的群体出现在果树上。声音：金属性的咔哒声，随后是高音调的 `kliing-kliing`\
  \ 声。栖息地：森林、森林边缘、椰子林。分布：特产于菲律宾。\n\n![image](img/page289.jpg)\n\n## 138 八哥；嘴喙八哥；RHABDORNIS\n\
  \n# 1 山八哥（常见八哥） *Gracula religiosa* 25–29cm 野外记记：树栖性，通常成对或成小群出现在树冠顶部。飞行时，初级羽基部显示白色斑块。声音：各种\
  \ `chip` 声、柔和的 `um` 声、低语的哨音以及许多类型的哨音、咯咯声和哀鸣。栖息地：阔叶常绿林和落叶林、森林边缘和空地。分布：留于苏答腊、爪哇腊、巴厘岛和婆罗洲。\n\
  \n# 2 尼亚亚山八哥 *Gracula robusta* 32cm 野外记记：通常成群出现。飞行时，初级羽基部显示白色斑块。声音：据说模仿人类语言；没有其他信息。栖息地：山地森林。分布：特产于苏哇腊西北部的岛屿。\n\
  \n# 3 恩加诺八哥 *Gracula enganensis* 27cm 野外记记：飞行时，初级羽基部显示白色斑块。行为可能与山八哥相似。声音：未报道。栖息地：森林地区。分布：特产于苏哇腊西南部的恩加诺岛。\n\
  \n# 4 火红眉八哥（火红眉八雀） *Enodes erythrophris* 27cm 野外记记：在树冠层觅食，成对或成小群活动。经常栖息在高处的暴露树枝上。寻找食物时相当敏捷。声音：金属性的\
  \ `pik`、`tik`、`tsiit`、`sip` 或 `ssii`；还有快速、尖锐、响亮的 `tik-tik-tt-tt-tt` 以及高音调的 `peeep`\
  \ 声，并伴有各种喉音。栖息地：原生林、高大次生森林、选择性采伐森林和森林边缘。分布：特产于苏拉腊。\n\n\n\n\n\n## 5 大嘴犀椋 `Scissirostrum\
  \ dubium` 17–21cm 野外习记：群居性，在森林边缘喧闹的族群中觅食。群居繁殖。鸣声：鸣叫声包括觅食群发出的哨声 `wrriu`；还有响亮、清晰、高调的\
  \ `swee`、鼻音的鸣声和流质的 `chiruip` 飞行音。栖息地：森林边缘、林木稀疏的地区和种植园。分布范围：特有于苏门腊锡岛和班盖群岛。\n\n##\
  \ 6 纹胸八嘴鸟 `Rhabdornis inornatus` 15–19cm 野外习记：倾向于成小群在森林树木的中层和上层树冠觅食。活跃，通过跳跃、蹦起和伸展在树枝间寻找；在掠过昆虫后还会出击捕食。可能加入物种混合觅食群。鸣声：高调的\
  \ `tzit` 或 `tzit-tzit-tzit-tzit-tzit`。栖息地：亚山地和山地森林。分布范围：特有于菲律宾中部和南部。\n\n## 7 大八嘴鸟\
  \ `Rhabdornis grandis` 16–18cm 野外习记：通过在树枝间跳跃和蹦起觅食昆虫和小果实。通常单只或成小群出现；也加入物种混合觅食群。经常栖息在枯树顶端。鸣声：高调的\
  \ `zip zip zeet zip`，某些音节带有颤音。栖息地：中、高海拔海拔的原生和次生龙叶属林及硬木林。分布范围：特有于菲律宾北部。\n\n## 8 纹头八嘴鸟\
  \ `Rhabdornis mystacalis` 15–16cm 野外习记：出现在从中层到树冠的活跃群中，通过跳跃和蹦起寻找食物，或进行短距离的飞掠捕食。经常是物种混合觅食群的成员。鸣声：不悦耳的高调调\
  \ `tsee tsee wick-tsee`，前两个音节几乎听不见；还有在栖息或觅食时发出的一系列 `zeet` 音。栖息地：森林、森林边缘和空地。分布范围：特有于菲律宾。\n\
  \n![image](img/page291.jpg)\n\n## 139 �n�类；山雀\n\n### 1 红额�n�类 `Sitta frontalis`\
  \ 12–13cm 野外习记：从林下到树冠觅食。`S.` `f.` `corallipes` (1b) 见于婆罗洲。鸣声：歌声是沙沙的 `sit-sit-sit`……鸣叫包括生硬的\
  \ `chat`、`chip` 或 `chlit` 和纤细的 `sip`。栖息地：阔叶常绿林、半常绿林、混合落叶林以及混合橡树和松林。分布范围：留于苏门腊、爪答、婆罗洲和菲律宾西部。\n\
  \n### 2 黄嘴嘴�n�类 `Sitta oenochlamys` 12–13cm 野外习记：在上树层的主树干和附近的树枝上觅食。鸣声：鸣叫包括 `chit`、更纤细的\
  \ `sit` 或 `sit-sit-sit-sit`……、尖锐的 `snii` 和弯曲的沙哑。栖息地：松林和常绿林、森林边缘和空地、残留森林斑块和次生林。分布范围：特有于菲律宾。\n\
  \n### 3 蓝�n��类 `Sitta azurea` 13–14cm 野外习记：主要在上层在树干和大树枝上觅食。鸣声：短促的 `chit` 或 `chi-chit`、`chit-chit-chit`、`chir-ri-rit`\
  \ 或颤音的 `tititititititiik`、柔和的 `tup`、尖锐的 `zhe` 或 `zhe-zhe` 和鼻音的 `kneu`。栖息地：低山地森林和高山地森林。分布范围：留于苏门腊和爪答。\n\
  \n### 4 优雅山雀 `Pardaliparus elegans` 11–12cm 野外习记：通常成对或成小群出现；是从中层到树冠的活跃觅食者。`P.` `e.`\
  \ `bongaoensis` (4b) 见于苏禄群岛；`P.` `e.` `mindanensis` (4c) 发现于棉兰老；`P.` `e.` `albescens`\
  \ (4d) 居住于菲律宾中部。鸣声：多变；包括 `tweet chuck-z-chuck-z-chuck-z`、单调的 `sweet sweet sweet\
  \ sweet`……、`chi-bow sweet-zee-sweet-zee-sweet-zee` 和更快的 `swee-zee-swee-swee-zee-zoo`。栖息地：茂原生常绿林、次生林边缘以及耕地边缘的散树。分布范围：特有于菲律宾。\n\
  \n### 5 帛拉望山雀 `Pardaliparus amabilis` 12cm 野外习记：中层和树冠的活跃觅食者。鸣声：非常活跃；鸣叫包括粗鲁的 `chuwi-chuwi-chuwi`……、`wichi-wichi-wichi-wichi`\
  \ 或类似的、简单的加速沙哑声、悦耳的 `tui-tui-tui-tui`……和银色的下行颤音。栖息地：森林、森林边缘、沼泽林缘带和次生林。分布范围：特有于菲律宾西部帛拉望。\n\
  \n### 6 灰�n�山雀 `Parus cinereus` 13–14cm 野外习记：等待，原文说 `Parus cinereus` 是 13cm。栖息地：森林、森林边缘、沼泽林缘带和次生林。分布范围：留于苏门腊、爪答、巴厘岛。\n\
  \n### 7 额额山雀 `Sittiparus semilaratus` 13–14cm 野外习记：等待，原文说 `Sittiparus semilaratus`\
  \ 是 14cm。栖息地：开阔地区、次生林。分布范围：特有于菲律宾。\n\n### 8 苏苏坦山雀 `Melanochlor sultanea` 20–21cm\
  \ 野外习记：等待，原文说 `Melanochlor sultanea` 是 21cm。栖息地：开阔地区、次生林。分布范围：特有于菲律宾。\n\n### 9 矮�n�类山雀\
  \ `Psaltria exilis` 8–9cm 野外习记：等待，原文说 `Psaltria exilis` 是 9cm。栖息地：山地森林、森林边缘。分布范围：特有于爪答。\n\
  \n## [140 燕；燕尾形]\n\n### 1 家燕 `Riparia riparia` 12cm 野外习记：群居性；通常与燕类聚在一起。飞行快速轻盈，通常在水面上低飞。鸣声：粗鲁的\
  \ `tschr` 和兴奋时的 `schrrp`。栖息地：湖泊、河流和沼泽；以及开阔地区。\n\n### 2 树燕 `Hirundo rustica` 18cm\
  \ 野外习记：群居性，经常成群。敏捷；通过扭转和转弯捕捕昆虫。经常栖息在电线杆或暴露的树枝上。幼鸟缺少长尾羽。红褐色亚种见于婆罗洲和菲律宾北部。\n\n###\
  \ 3 太平洋燕 `Hirundo tahitica` 13cm 野外习记：飞行快速，伴有转弯、滑翔。鸣声：叽叽的 `twsit-twsit-twsit`；鸣叫包括\
  \ `titswwe` 和低低的 `swoo`。栖息地：沿海地区、森林和开阔地区；经常与人类居住区在一起。分布范围：留于当地。\n\n### 4 红臀燕 `Cecropis\
  \ daurica` 16–17cm 野外习记：飞行通常缓慢而优雅，有许多滑翔和上升。幼鸟缺少较长的尾羽。鸣声：包括猫叫声、攻击性的 `krr` 和接触音 `djuit`。栖息地：开阔地区、林木稀疏的地区、岩石峡谷和悬崖。分布范围：罕见于苏门腊和婆罗洲。\n\
  \n\n\n\n# 5 纹纹腹燕\n*Cecropis striolata* 19cm 野外札记：飞行缓慢且具有浮力，通常在地面低空处或悬崖周围飞行。幼鸟缺少较长的外尾羽。鸣声：柔和的啾啾声；叫声包括拉长的\
  \ `quitsch`、`pin` 以及重复的 `chi-chi-chi`。栖息地：开阔地区，通常靠近水边、悬崖和河谷。分布：栖息于苏门答腊、爪哇、巴厘岛、婆罗洲、菲律宾和小巽群岛。\n\
  \n# 6 树燕\n*Petrochelidon nigricans* 13cm 野外札记：飞行迅速，频繁扭转；经常在水面上方空捕昆虫。通常以 10–30 只鸟为群。鸣声：短促、细细、高音的啾鸣声；低音的啾鸣或嘈杂；以及高音、重复、生硬的鼻音\
  \ `zzit` 或 `tsweet`。栖息地：开阔地区，包括草地、机场和稻田，也有开阔林地。分布：小巽群岛和马鹿群岛的留鸟或冬客。\n\n# 7 仙燕\n*Petrochelidon\
  \ ariel* 11cm 野外札记：通常成小群活动；经常与其他燕类物种混在一起。飞行缓慢且带有飘动，通常在高处。鸣声：叫声包括短促的 `chrrr` 或 `prrrt-prrrt`。栖息地：开阔林地和乡村乡村，通常靠近水边。分布：小巽群岛的客鸟。\n\
  \n# 8 亚洲房子燕\n*Delichon dasypus* 12cm 野外札记：飞行包含频繁的滑翔、俯冲和倾斜，通常在很高处。鸣声：尖锐的联系鸣声。栖息地：山、丘陵和沿海地区的山谷和峡谷；也靠近人类居住区。分布：北苏门答腊、爪哇、婆罗洲和菲律宾的冬客或客鸟。\n\
  \n![image](img/page295.jpg)\n\n# 141 鹹类\n\n## 1 冠黑鹹\n*Pycnonotus zeylanicus* 29cm\
  \ 野外札记：通常成小群出现，从地面一直觅食到树冠层。鸣声：优美、丰富的婉转声；觅食时会发出微弱的叽喳声和咕噜声。栖息地：森林，通常靠近溪流和河流。分布：大巽群岛的留鸟。\n\
  \n## 2 吊白纹鹹\n*Pycnonotus leucogrammicus* 17–18cm 野外札记：在中层林或亚树冠层觅食果实和昆虫。通常单只或成对出现，偶尔成小群；是混合物种觅食群群的常见成员。鸣声：`tree-troo-troo`。栖息地：丘陵和山地常叶林、森林边缘和次生林。分布：苏门答腊特有。\n\
  \n## 3 斑颈鹹\n*Pycnonotus tympanistrigus* 16cm 野外札记：通常成对或成小群出现；有时加入混合物种觅食队。倾向于中层和树冠层。鸣声：双节的\
  \ `tdip-diew`；还有重复、强力的 `jret-jret-jtry`。栖息地：常叶林、森林边缘和次生林。分布：苏门答腊特有。\n\n## 4 黑白鹹\n\
  *Pycnonotus melanoleucos* 18cm 野外札记：最常在森林树冠遇到，尽管也会在低矮果实灌丛中觅食。鸣声：通常很安静；偶尔发出无调调的 `pet-it`、`tee-too`\
  \ 或类似的音调，以及较长的 `cherlee-chlee-chlee-chee-chee`。栖息地：阔叶常叶林和森林边缘。分布：苏门答腊和婆罗洲的留鸟。\n\n\
  ## 5 黑头鹹\n*Pycnonotus atriceps* 18cm 野外札记：通常成对或成小群在树木或灌木丛中觅食。羽色多变；显示正常色、中间色和灰色；东婆门答腊外马拉图亚岛的灰色鸟有时被认为是一个物种（`P`.\
  \ `hodiernus`）。鸣声：歌声是一系列断续的升降 `tink` 音；叫声包括强力的 `chew` 或 `chewp`。栖息地：低地原生林、次生林以及林木花园。分布：苏门答腊、爪哇、婆罗洲和菲律宾西部的留鸟。\n\
  \n## 6 红喉鹹\n*Pycnonotus dispar* 17–20cm 野外札记：觅食果实和昆虫；几乎没有其他信息。鸣声：`tee-tee-wheet-wheet`、`whit-wheet-wit`\
  \ 或 `hii-tii-hii-tii-wiit`，或其他音或其他组合。栖息地：开阔林地、灌木区和种植园。分布：苏门答腊、爪哇和巴厘岛特有。\n\n## 7\
  \ 婆罗洲鹹\n*Pycnonotus montis* 17–18cm 野外札记：经常停在森林边缘的开阔处。在结果树上觅食，在发现昆虫后会定期的空中俯冲。鸣声：不断重复的\
  \ `yek yek`，还有哨声般的 `grrrt grrrt`。栖息地：常叶林、次生林和废弃耕地的灌木复生林。分布：婆罗洲特有。\n\n## 8 灰腹鹹\n\
  *Pycnonotus cyaniventris* 16–17cm 野外札记：通常留在树冠层，成对或成小群。敏捷，经常像山鸟一样倒挂着采集果子。鸣声：甜美的 `pi-pi-p-`，甜美的\
  \ `pi-pi-p-`……（注：此处原文存在大量重复标识符，已按要求精简并翻译逻辑）。栖息地：此处原文存在大量重复标识符错误。分布：苏门答腊和婆罗洲。\n\n\
  ## 9 鳞腹鹹\n*Pycnonotus squamatus* 14–16cm 野外札记：通常在树冠层发现，单只或成小群。尾部有白尖。鸣声：尖锐的 `wit`、纤细的\
  \ `wit` 和优美的婉转声。栖息地：山地原生林。分布：苏门答腊和婆罗洲。\n\n![image](img/page97.jpg)\n\n# 142 鹹类\n\
  \n## 1 颊须鹹\n*Pycnonotus jocosus* 20cm 野外札记：通常单只或成对出现。幼鸟缺少红颊。鸣声：多变的乐句；叫声包括滚动的 `prroop`\
  \ 和粗糙的 `zeep`。栖息地：开阔森林、灌丛。分布：苏门答腊，可能在婆罗洲。\n\n## 2 灰头鹹\n*Pycnonotus aurigaster* 19–21cm\
  \ 野外札记：通常成小群喧闹。在地面和树上觅食。鸣声：嘈杂的 `wi-wi-wi`、`wi hu` 或 `chuk-chuk`。栖息地：开阔林地或灌木区、次生林。分布：爪哇和巴厘岛的留鸟。\n\
  \n## 3 蓬背鹹\n*Pycnonotus eutilotus* 20–22cm 野外札记：在树上觅食果实和昆虫，通常单只或成对；有时加入混合物种觅食队。尾部有白尖。鸣声：响亮、高音、颤动的婉转声。栖息地：低地原生林、沼泽林、次生林和森林边缘。分布：苏门答腊和婆罗洲的留鸟。\n\
  \n## 4 蓝冠鹹\n*Pycnonotus nieuwenhuisii* 18cm 野外札记：信息很少；仅已知两个标本。可能是杂交种。鸣声：未知。栖息地：婆罗洲低地的龙眼林和苏门答腊的矮灌丛。分布：苏门答腊和婆罗洲的留鸟。\n\
  \n## 5 黄冠鹹\n*Pycnonotus urostictus* 19cm 野外札记：单只、成对或成小群出现；喜欢结果树。鸣声：多变的、响亮的、三节的哨声\
  \ `wee-we-weeee` 或 `wee-eeee-ee`，还有高音、尖锐的哨声和更长、复杂的哨声，结尾为 `wee-eeee-ee`。栖息地：开阔林、次生林和森林边缘。分布：菲律宾特有。\n\
  \n## 6 橙点鹹\n*Pycnonotus bimaculatus* 20cm 野外札记：通常独处或成小群出现；喜欢开阔空地森林边缘。鸣声：各种响亮、粗糙的歌声，包括\
  \ `toc-toc-toc-toroc`、清晰的 `chewlk-chewlk-chewlk` 或 `chuk-chuk-chooh-chewlewlewlew`；还会发出尖锐的\
  \ `tik`。栖息地：山地森林边缘、高大次生林、灌丛和山顶云雾林。分布：苏门答腊、爪哇和巴厘岛特有。\n\n\n\n\n## 7 亚齐音留鸟\n*Pycnonotus\
  \ snouckaerti* 20–21cm 野外笔记：喜欢以蕨类和高草为主的小型灌丛空地。曾被认为是前一种物种的亚种。鸣声：歌声与前一种物种相似，但带有更金属感或干燥、哨的音质。栖息地：有空地的山地森林。分布：苏门答腊特有。\n\
  \n## 8 黄腹鹹鸟\n*Pycnonotus flavescens* 22cm 野外笔记：通常单只或成对出现，位于山地森林的冠层和树线以上的灌丛生长中。鸣声：短促的五音歌声和粗粗的鸣叫。栖息地：森林丘陵和山脉中的高灌木、灌木丛和空地。分布：留于北婆罗洲。\n\
  \n## 9 黄腹斑鹹鸟\n*Pycnonotus goiavier* 20–21cm 野外笔记：单只、成对或小群体觅食。偶尔从暴露的栖息处发动捕虫飞行。鸣声：歌声由一系列多变的断促音符组成；叫声欢快响亮，包括咕噜般的\
  \ `chic-chic-chic`、`tiddloo-tiddloo-tiddloo` 或 `tid-liu tid-liu tid-liu` 等类似声音。栖息地：开阔地区、次生林、耕地、路边和花园。分布：留于苏门答腊、爪哇、巴厘、婆罗洲、菲律宾和西小群岛。\n\
  \n## 10 橄榄翼鹹鸟\n*Pycnonotus plumosus* 20–21cm 野外笔记：通常在低处觅食，单只、成对或小群体。经常与其他鹹鸟一起聚集在果树上。鸣声：各种柔和的啾鸣和流动的短句；叫声包括喉部的\
  \ `whip-whip` 和咕噜声 `wrrh-wrrh-wrrh`。栖息地：低地森林、次生林、森林边缘、退化森林和沿海灌丛。分布：留于苏门答腊、爪哇、巴厘和婆罗洲。\n\
  \n![image](img/page299.jpg)\n\n143 种鹹鸟\n\n## 1 灰脸鹹鸟\n*Pycnonotus cinereifrons* 19–20cm\
  \ 野外笔记：喜欢果树。通常单只或成对出现，有时成小群；经常是混合物种觅食群的成员。曾被认为是橄榄翼鹹鸟的亚种（图 142）。鸣声：咕噜般的、重复 `chop\
  \ wit chu do-de-do-de-du`；叫声被认为与橄榄翼鹹鸟非常相似，包括 `whip-whip` 和咕噜声 `wrrh wrrh wrrh`。栖息地：开阔地区、森林边缘和次生林。分布：菲律宾西部巴拉湾特有。\n\
  \n## 2 奶油色腹鹹鸟\n*Pycnonotus simplex* 18cm 野外笔记：单只出现、成对或作为混合物种觅食群的一部分。喜欢果树。鸣声：低沉、颤抖的\
  \ `whi-whi-whi-whi`…，间杂着低低的 `pru-pru prr` 和 `prr-pru`；还有粗粗的叫声和短句，如 `quik chop, quik-plik\
  \ chop` 和较长的 `bee-quik` 或 `pee dee kew`。栖息地：阔叶常绿森林、森林边缘和次生林。分布：留于苏门答腊、爪哇和婆罗洲。\n\n\
  ## 3 红眼鹹鸟\n*Pycnonotus brunneus* 19cm 野外笔记：树栖性，主要在下中层；通常单只、成对或作为果树上混合物种觅食群的一部分。鸣声：高音、咕噜般的、上升的\
  \ `pri-pri-pri-pri-pri-pit-pit`；还有短促颤音和尖锐的 `chirrup` 或 `whit-it`。栖息地：阔叶林、森林边缘、次生林和灌丛。分布：留于苏门答腊和婆罗洲。\n\
  \n## 4 眼眼镜鹹鸟\n*Pycnonotus erythropthalmos* 16–18cm 野外笔记：通常单只或成对遇到，通常在森林下层或与其他鹹鸟一同聚集在果树上。鸣声：高音、机械的\
  \ `pip-pippidi` 或 `wip-wip-wi i i i`；还有短句，如 `willy-nilly`、`pippi-dippi` 或 `willy-nilly-no`。栖息地：原生林和成熟的次生低地森林、沼泽森林和次生林。分布：留于苏门答腊和婆罗洲。\n\
  \n## 5 芬奇鹹鸟\n*Alophoixus finchii* 16–17cm 野外笔记：主要在中层觅食，如果树木或灌木结果实则在较低处。鸣声：简单的 `choi-choi-chong-choi\
  \ choi-choi`；叫声包括低沉的 `wek` 或 `twut`、响亮的鼻音 `hwuiikt` 和刺耳的 `scree`。栖息地：低地、丘陵和山地森林以及次生林。分布：留于苏门答腊和婆罗洲。\n\
  \n## 6 赭色鹹鸟\n*Alophoixus ochraceus* 19–22cm 野外笔记：通常以松散、嘈闹的群体在果树和灌木中觅食。鸣声：歌声由婉转的序列和鸣叫音符组成；叫声包括粗粗的\
  \ `chrrt-chrrt-chrrt-chrrt`…\n\n## 7 灰脸鹹鸟\n*Alophoixus ochraceus* 21–22cm 野外笔记：嘈闹。通常单只、成对或小群出现。鸣声：多变；歌声由哀伤的\
  \ `whi-wi-whi` 组成，随后是高音的 `whi-wi-wi`…\n\n## 8  巴拉湾鸟\n*Alophoixus frater* 22cm 野外笔记：曾被认为是前一种物种的亚种；行为被认为是相似的。鸣声：响亮的\
  \ `chip-chu cha-wheet`。栖息地：森林、次生林。分布：菲律宾西部巴拉湾特有。\n\n## 9 黄腹鹹鸟\n*Alophoixus phaephalus*\
  \ 20–21cm 野外笔记：单只、成对出现。经常在下层活动。鸣声：低沉、嗡嗡的 `whi-wi-wi` 或刺耳的 `cherrit-berrit`。栖息地：低地原生森林。分布：留于苏门答腊和婆罗洲。\n\
  \n\n\n\n### 5 �毛背白头\n`Tricholestes criniger` 16–17cm \n**野外记录：** 通常成对出现在下层或中层。觅食果实或无脊椎动物，经常进行短距离俯冲捕捉飞行昆虫。外表普通但好奇心强。鸣声：沙哑、叽叽的鸣声，间杂着颤抖的\
  \ `whirrrh`；叫声包括高调上升的 `whiiii`。栖地：原生林、次生林、海岸森林和红树林。分布：留居于苏门答腊和婆罗洲。\n\n### 6 黄腹白头吊\n\
  `Iole crypta` 20–21cm\n**野外记录：** 在树冠和中层觅食，有时会下降到较低层次在果实灌木中觅食。鸣声：叫声包括悦耳的 `cherrit`、`whe-ic`\
  \ 和较平缓的 `whirr`。栖地：阔叶常绿林、森林边缘和次生林。分布：留居于苏门答腊和婆罗洲。\n\n### 7 黄腹白头\n`Iole palawanensis`\
  \ 18cm\n**野外记录：** 单独、成对或成小群出现。鸣声：叫声包括 `chirrup`、`chirrrup-chi` 或 `chip`。栖地：常绿林、森林边缘和次生林。分布：特产于菲律宾西部的吕宋（Palawan）。\n\
  \n### 8 斑纹白头\n`Ixos malaccensis` 23cm\n**野外记录：** 主要在树冠层觅食，单只或成对；偶尔会出击捕食飞行昆虫。鸣声：高调、下降调的\
  \ `chiri-chiri-chu`，或较长的 `ka-jee ka-jee ka-jee jueee`，有时会转入纤细、下降的颤音；叫声包括粗粗、响亮的摩擦声或咯哒声。栖地：低地和丘陵的原生林及次生林。分布：留居于苏门答腊和婆罗洲。\n\
  \n![image](img/page303.jpg)\n\n# [145 吊类；马来吊亚]\n\n### 1 巽他白头\n`Ixos virescens` 20cm\n\
  **野外记录：** 在中层和树冠层觅食时动作迟缓，单只、成对或成嘈闹的小群。`I. v. sumatranus` (1b) 出于苏门答腊西部。鸣声：叫声包括 `chiit-chiit`\
  \ 和尖锐的 `twink`。栖地：常绿山地森林、森林边缘和次生林。分布：特产于苏门答腊和爪哇夷。\n\n### 2 灰腹白头\n`Hemixos cinereus`\
  \ 20–21cm\n**野外记录：** 在中层、树冠和森林边缘觅食。`H. c. connectens` (2b) 出于婆罗洲。鸣声：短促、甜的 `beelee-bear\
  \ beelee burlee`；叫声包括响亮、清亮的 `tree-tree-tree`、哀鸣的 `whear`、尖锐的 `chiap` 和哨音般的 `wheesh-wheesh`。栖地：山地阔叶常绿林和次生林。分布：留居于苏门答腊和婆罗洲。\n\
  \n### 3 菲律宾白头\n`Hypsipetes philippinus` 22cm\n**野外记录：** 通常单只或成对出现，有时成小群出现。从底层到树冠层均觅食。鸣声：多变，包括上升和下降的\
  \ `deut doo doo doo da-leee-eut`。栖地：阔叶常绿林、森林边缘、灌木丛空地、次生林、有树的耕区和椰子林。分布：特产于菲律宾。\n\n\
  ### 4 民德岛白头\n`Hypsipetes mindorensis` 22cm\n**野外记录：** 曾被认为是前一种物种的亚种；行为和习性预计相似。鸣声：摇摆的\
  \ `we-to we-to we-to-to`。栖地：推测与前一种物种相似。分布：特产于菲律宾北民德岛。\n\n### 5 维萨亚白头\n`Hypsipetes\
  \ guimarasensis` 22cm\n**野外记录：** 行为预计与菲律宾白头相似，后者曾被认为与其为同种。鸣声：`deut deut deut`，随后加速为一系列复杂的悦耳音调。栖地：推测与菲律宾白头相似。分布：特产于菲律宾中西部。\n\
  \n### 6 三波安哥白头\n`Hypsipetes rufigularis` 24cm\n**野外记录：** 在树木的中层和上层觅食，通常成小群活动。鸣声：`chigur-chigur-chigur-chigur-chigur`\
  \ 和更快的 `chli-chli-chli`…；叫声包括 `chuk`、`tweer` 和 `choik`。栖地：森林和森林边缘。分布：特产于菲律宾棉兰老老岛西部和巴西兰岛。\n\
  \n### 7 斑纹胸白头\n`Hypsipetes siquijorensis` 26–27cm\n**野外记录：** 在所有森林层级觅食，通常成小群。`H.\
  \ s. cinereiceps` (7b) 出于塔布拉斯岛和罗姆布隆岛。鸣声：尖锐的 `whit pu whit tooer whit whee-er` 或\
  \ `pu-er whit pu-er` 据认为都是塔布拉斯/罗姆布隆种的叫声。栖地：森林、森林边缘、次生林和空地。分布：出现在宿务岛、塔布拉斯岛和罗姆布隆岛。\n\
  \n### 8 棕耳白头\n`Hypsipetes brunotis` 28cm\n**野外记录：** 嘈闹且通常成群活动；在所有森林层级觅食。鸣声：粗糙的 `pee-uk`\
  \ 和下降的 `tick tick`。栖地：落叶林。分布：菲律宾北部。\n\n### 9 黄腹白头\n`Hypsipetes everetti` 24–26cm\n\
  **野外记录：** 在中层和树冠层觅食，通常单只或成小群。`H. e. catarmanensis` 出于喀米林岛。鸣声：长长的 `peeeee`，随后是优美的\
  \ `dee-dee-dee`。栖地：落叶和常绿林。分布：特产于喀米林岛。\n\n### 10 利亚亚\n`Malia grata` 28–29cm\n**野外记录：**\
  \ 通常成小群活动，从地面到树冠层觅食。`M. g. stresemanni` 出于苏拉威西。鸣声：高调的哨声，伴随粗糙的快速鸣。栖地：原生山地森林和偶尔的次生林。分布：特产于苏拉威西。\n\
  \n![image](img/page305.jpg)\n\n# [146 鹹；棱棱亚；短尾莺]\n\n### 1 丛鹹\n`Cisticola juncidis`\
  \ 10–12cm\n**野外记录：** 在暴露的栖处或飞行时鸣唱最为明显。在地面或接近地面处觅食。鸣声：简单的 `zit-zit-zit-zit`…；叫声包括\
  \ `tew` 和 `tsipp-tsipp-tsipp` 或 `tick tick`。栖地：草地、湿地和稻田。分布：留居于苏门答腊、爪哇、菲律宾、苏拉威西和吕宋群岛。\n\
  \n### 2 金头鹹（明亮头鹹）\n`Cisticola exilis` 10cm\n**野外记录：** 在暴露的栖处或飞行时鸣唱。在地面或错综复杂的植被中觅食。鸣声：嘶嘶或喘息的音调，随后是响亮的\
  \ `scrrrrr plook` 等。叫声包括责备的 `squee` 或 `speeee`。栖地：高大的湿地植被、散布灌木的草地、稻田和灌木丛。分布：留居于苏门答腊、爪哇、巴厘、婆罗洲西部、菲律宾、苏拉威西、吕宋群岛和马马鲁群岛。\n\
  \n### 3 棕棱亚\n`Prinia polychroa` 16cm\n**野外记录：** 栖于茂密处；受干扰时倾向于在植被中爬行。鸣声：响亮的 `twee-ee-ee-ee-eet`\
  \ 或 `chook-chook-chook`。栖地：带低矮灌丛的草地、耕地、低灌木的开放森林。分布：留居于爪哇。\n\n### 4 山棱亚\n`Prinia\
  \ superciliaris` 17cm\n**野外记录：** 在草丛和低矮植被中嘈闹且活跃。鸣声：响亮、刺耳的 `cho-ee cho-ee cho-ee`。栖地：山地及山地森林的灌木丛、低矮植被和草地。分布：留居于苏门答腊。\n\
  \n### 5 翼棱亚\n`Prinia familiaris` 13cm\n记录：从地面到树顶层觅食，通常单只或成对；繁殖季节后成多达十五只鸟的嘈闹群体。鸣声：响亮、高调的\
  \ `chweet-chweet-chweet`。栖地：红树林、次生林、种植园、公园和灌木丛花园。分布：特产于苏门答腊、爪哇和巴厘岛。\n\n\n\n\n\n\
  ## 6 黄腹林鹎\n`Prinia flaviventris` 13cm 野外笔记：草丛中好动不安的觅食者。在裸露的栖息处或飞行中鸣叫。鸣声：微弱而刺耳的 *schink-schink-schink*、泡动的\
  \ *tidli-tidli-u* 以及柔和的喵声。婆罗洲的鸟类会发出 *sen-si-lak* 或类似的声音。栖息地：芦苇沼泽、高草丛和灌丛。分布：栖于苏门答腊、爪哇岛和婆罗洲。\n\
  \n## 7 普通林鹎\n`Prinia inornata` 10–11cm 野外笔记：通常以小群活跃群体活动，在植被低处觅食。在草茎或灌丛中鸣叫。鸣声：尖锐的\
  \ *chee-cheerrrrrr-roowet* 或 *cheerrrrlet*。栖息地：长草、芦苇、沼泽和耕地。分布：留栖于爪哇岛。\n\n## 8 爪哇短鹎\n\
  `Tesia superciliaris` 7cm 野外笔记：在森林地面或靠近地面处觅食；喜好密密的下植层、空地的灌丛和森林边缘。鸣声：响亮、爆发式的、约十五个音符的快速歌曲。栖息地：山地森林。分布：特产于西爪哇岛。\n\
  \n## 9 褐冠短鹎\n`Tesia everetti` 9–10cm 野外笔记：活跃。在地面、灌木丛、林下层以及树干上的藤本植物间觅食。鸣声：一系列响亮、断续的上升音和其他哨音，在音阶上上下交替律动。栖息地：湿润森林、退化林地、次生林和灌丛。分布：特产于小松汶群岛的桑望岛和弗洛勒斯岛。\n\
  \n## 10 帝汶尾\n`Urosphena subulata` 10cm 野外笔记：在落叶层中以及根部、倒木或树枝周围觅食。鸣声：纤细、高频、略微上升的哨音。栖息地：原生森林和高大季风森林以及山坡灌丛。分布：特产于东小松汶群岛。\n\
  \n## 11 婆罗洲尾\n`Urosphena whiteheadi` 10cm 野外笔记：在密密的灌木丛和地面上像鼠一样穿行。通常独处。鸣声：拉长的、高频的、安静的、像蝙蝠一样的、吱吱的\
  \ *tzi-tzi-tzeeee*。栖息地：山地森林。分布：特产于婆罗洲。\n\n![image](img/page307.jpg)\n\n## 147 灌木莺\n\
  \n## 1 日本林鹎\n`Horornis diphone` 18cm 野外笔记：茂密植被中不显眼的觅食者。鸣声：叫声包括干涩的 *tchet-tchet-tchet*\
  \ 和沙哑的 *trrt*。栖息地：竹林和灌丛。分布：菲律宾北部的冬季访客。\n\n## 2 东方林鹎（长嘴林鹎）\n`Horornis borealis` 15cm\
  \ 野外笔记：在茂密植被中觅食。在分类学上与前述物种存在很大混淆，它们常被认为是同物种。鸣声：叫声与前述物种相似。栖息地：竹林和灌丛。分布：菲律宾北部的冬季访客。\n\
  \n## 3 菲律宾林鹎\n`Horornis seebohmi` 12cm 野外笔记：在地面或地面附近的密闭遮蔽处觅食；通常独处。鸣声：有节奏的 *pee chap\
  \ chop*、*pee chap chop chi* 或 *do doooooor dor-pro-dee-dor-pee*；叫声包括重复的 *chekk*。栖息地：开阔的落叶林和松林，带有林下层、灌丛和低矮植被。分布：特产于菲律宾北部。\n\
  \n## 4 坦敏巴林鹎\n`Horornis carolinae` 12–13cm 野外笔记：在密密的灌丛中觅食，独处或作为混合物种群的一部分。鸣声：拉长的哨音，随后是短促、混乱的鸣声；叫声包括柔和的\
  \ *cherr* 或 *chuck*。栖息地：原生森林和季风森林、次生林、竹林、灌丛和森林边缘。分布：特产于东小松汶群岛的坦敏巴岛。\n\n## 5 巽他林鹎\n\
  `Horornis vulcanius` 12–13cm 野外笔记：单独或成对在密密的灌丛或地面觅食。`H`. `v`. `oreophilus` (5b) 出于婆罗洲北部。鸣声：上升下降的\
  \ *chee-heeoow cheeoow-wee-ee-eet*；叫声包括尖锐、重复的 *trr-trr*。栖息地：矮矮的山地森林，带有密密的灌丛、蕨类或高草。分布：留栖于苏门答腊、爪哇岛、巴厘岛、婆罗洲、菲律宾西部和小松汶群岛。\n\
  \n## 6 贝恩格特林鹎\n`Locustella seebohmi` 14cm 野外笔记：信息较少；推测具有该属典型的躲避行为。鸣声：金属质的快速过的声。栖息地：陡峭的草地山谷。分布：特产于菲律宾北部。\n\
  \n## 7 爪哇林鹎\n`Locustella montis` 14–15cm 野外笔记：在低树枝上或布满岩石的坡地上跳跃。`L`. `m`. `timorensis`\
  \ (7b) 曾被视为独立物种，出现在帝汶岛。鸣声：单调重复的 *pit*。栖息地：灌丛和草地。分布：留栖于爪哇岛、帝汶岛。\n\n## 8 长尾莺\n`Locustella\
  \ caudata` 16–18cm 野外笔记：躲避，在低矮遮蔽物内或下方觅食。鸣声：高频、略微上升的哨音。栖息地：森林灌木层和生长层。分布：特产于菲律宾群。\n\
  \n## 9 亲和林鹎（注：根据上下文，文本可能指 `Locustella accentor` 或类似物种）\n`Locustella accentor` 15cm\
  \ 野外笔记：隐密，在低矮遮蔽物内或下方觅食。鸣声：持续纤细、脉动的震翅声。栖息地：湿润雨林灌木层。分布：特产于婆罗洲北部的沙巴岛。\n\n## 10 栗背林鹎\n\
  `Locustella castanea` 14–15cm 野外笔记：单独出现或成对出现；在地面或附近觅食。鸣声：嗡嗡的、上升下降的三音颤音。栖息地：密密的灌丛、森林边缘。分布：留栖于南苏拉锡群岛。\n\
  \n![image](img/page309.jpg)\n\n## 148 筒莺；草鸟；苇莺\n\n## 1 尖叶莺\n`Locustella lanceolata`\
  \ 12cm 野外笔记：隐密，倾向于在低矮植被中觅食。鸣声：持续纤细、脉动的震翅声。栖息地：灌丛、草地和植被，通常位于沼泽地区。分布：北摩卢卡群岛冬季访客。\n\
  \n## 2 帕氏莺\n`Locustella certhiola` 13–14cm 野外笔记：在高草和芦苇间像鼠一样穿行，并在密闭遮蔽处活动。鸣声：高频的啾鸣，随后变为鸣声。栖息地：沼泽或其他湿地的长草、芦苇和交错的植被。分布：苏门答腊、爪哇岛和婆罗洲冬季访客。\n\
  \n## 3 灰莺\n`Locustella fasciolata` 16–18cm 野外笔记：隐密，在深层遮蔽处或草茎间觅食。鸣声：歌曲丰富且像笛声。栖息地：灌丛、森林边缘和高草。分布：菲律宾群岛、苏拉答锡岛、苏拉群岛和摩卢卡群岛冬季访客。\n\
  \n## 4 多氏莺\n`Locustella ochotensis` 13–15cm 野外笔记：躲避，在低矮遮蔽物内或下方觅食。鸣声：安静的声音。栖息地：湿润灌丛、草地和有挺水植被的沼泽。分布：婆罗洲和菲律宾冬季访客；苏拉答锡岛留客。\n\
  \n\n\n\n\n# 5 斑纹草鸟\n*Megalurus palustris* 24–26cm 野外记录：在芦苇和灌木丛中觅食。鸣声：强有力而丰富的鸣唱，随后是低沉的哨声，接着是一声响亮的\
  \ *wheeechoo*；叫声包括爆发性的 *pwit* 和粗哑的 *chat*。栖息地：高大潮湿的草地、芦苇丛和灌丛。分布：留居于爪哇岛、巴厘岛、婆罗洲和菲律宾。\n\
  \n# 6 栗褐色草鸟\n*Megalurus timoriensis* 22–24cm 野外记录：行为隐秘；经常利用草茎顶部作为瞭哨点。鸣声：歌声包含上升和下降的沙沙声、清脆音符。叫声包括\
  \ `tsip`、`chir-up` 或 `threr-up`。栖息地：芦苇丛和散布着树木灌木的草地。分布：留居于菲律宾、苏拉答锡、小巽达群岛和南马卢古群岛。\n\
  \n# 7 宽带林丛鸟\n*Buettikoferella bivittata* 18–19cm 野外记录：在茂密的灌木丛低处躲藏。鸣声：断续的 `zi-ka-cheet`\
  \ 或 `tswi-chit`、粗厉的下降颤抖音和高音调沙沙声。栖息地：季风森林斑块、次生林和灌丛。分布：东部小巽达群岛的提汶岛特有种。\n\n# 8 斑纹芦苇莺（斑纹芦苇莺）\n\
  *Acrocephalus sorghophilus* 13cm 野外记录：在植被低处觅食，爬上芦苇茎在显眼的栖息点上鸣唱。鸣声：一系列沙沙声或咕噜声音符。栖息地：芦苇丛和沼泽草地，通常靠近水边。分布：菲律宾吕宋岛、尼格格拉斯岛和波霍尔岛的冬季候客。\n\
  \n# 9 黑眉苇莺\n*Acrocephalus bistrigiceps* 12cm 野外记录：胆小且隐秘，在茂密的植被中觅食。鸣声：短促，间杂着沙沙声和咕噜声；叫声包括柔和的\
  \ `dzak` 和粗哑的 `chur`。栖息地：沼泽或水域附近的突出植被。分布：北苏门答腊的稀有冬季候客或漂留。\n\n# 10 喧闹芦苇莺\n*Acrocephalus\
  \ stentoreus* 18cm 野外记录：在芦苇茎间或灌丛低处爬行。鸣声：多变；通常是刮挠声、啾啾声、尖鸣和甜美音符的响亮组合。叫声包括粗哑的 `chack`\
  \ 和低沉的 `churr`。栖息地：湖边、池边的芦苇丛、岸边灌丛和稻田。分布：留居于西爪哇、南婆罗洲、菲律宾和拉西亚地区。\n\n# 11 东方芦苇莺\n*Acrocephalus\
  \ orientalis* 18cm 野外记录：在芦苇茎间或灌丛中爬行。鸣声：深沉、喉音的咕噜声和咯咯声，间杂着鸣唱短句；叫声包括安静的 `krak`、`chichikarr`\
  \ 和沙哑的 `si-si-si-si`。栖息地：芦苇丛和灌丛，通常离水。分布：苏门答腊、婆罗洲、菲律宾、苏拉答锡和拉西亚地区的冬季候客。\n\n![image](img/page311.jpg)\n\
  \n## 149 织布鸟\n\n# 1 山地织布鸟\n*Phyllergates cuculatus* 11–12cm 野外记录：行踪诡秘。在低矮灌木丛中觅食；有时在捕食飞行昆虫后进行空中俯冲。雏鸟的额头、冠顶和后脑为灰色。亚种\
  \ `P.`. `c.`. \\`riedeli` (1b) 发现于北苏拉答锡；`P.`. `c.`. \\`dumasi` (1c) 居住在南马卢古群岛的布鲁岛和塞拉姆岛。鸣声：细而高亢的\
  \ `pee-pee-peeeeeeeee-pee-pee` 或此主题的变体。叫声包括干涩的下降颤音、低沉的嗡嗡声 `kiz-ki`、纤细的 `trit` 和鼻腔鸣啾声。栖息地：阔叶常绿林中的灌木丛和林下植被。分布：广泛留留，但在该大部分地区呈斑状分布。\n\
  \n# 2 栗头织布鸟\n*Phyllergates heterolaemus* 11cm 野外记录：通常成对或小群结出现，在茂密错综的植被中觅食；偶尔在追逐掠过的昆虫并飞跳出时现身。鸣声：高亢的\
  \ `tee-tee lee-oot tee-lee-leee`；受惊时会发出快速的颤抖声 `trip-p-p-p-p-p-p-p-p`，通常连续重复。栖息地：高海拔森林和次生灌丛。分布：菲律宾南部米兰兰奥岛特有种。\n\
  \n# 3 普通织布鸟\n*Orthotomus sutorius* 10–14cm 野外记录：在遮蔽物内或其下地面觅食；常成对出现。繁殖期雄鸟发育长长的中央尾羽，鸣声：响亮而单调的\
  \ `te-chee-te-chee-te-chee` 和单声 `twee`。栖息地：疏林、次生林和灌木丛花园。分布：留居于爪哇岛。\n\n# 4 栗色额织布鸟\n\
  *Orthotomus frontalis* 12cm 野外记录：在低矮林下植物中觅食。鸣声：拉长的 `de de drer-r-r-rw`，类似于像跳动的桌子。栖息地：低地森林。分布：菲律宾南部特有种。\n\
  \n# 5 菲律宾织布鸟\n*Orthotomus castaneiceps* 13cm 野外记录：较吵闹。在茂密的植被中觅食，通常靠近地面。鸣声：`twee-doo`。栖息地：低地森林。分布：菲律宾南部特有种。\n\
  \n# 6 颤音织布鸟\n*Orthotomus chlorotus* 13cm 野外记录：曾被认为是前一种鸟的亚种；行为相似。鸣声：泡状、脉动的 `tuuut\
  \ tuutt`。栖息地：低地森林、森林边缘。分布：中部巽达群岛特有种。\n\n# 7 灰背织布鸟\n*Orthotomus derbianus* 11cm 野外记录：在茂密生长处觅食时保持隐蔽。鸣声：`chew-ee-pe`、`purr`\
  \ 和 `eeeeh`。栖息地：低地次生森林、森林边缘。分布：吕宋岛南部特有种。\n\n# 8 栗尾织布鸟\n*Orthotomus sericeus* 12–14cm\
  \ 野外记录：胆小且隐秘；在密集的叶片中单栖或成对。鸣声：多种响亮的快速音；叫声包括粗哑的 `terr-terr`、气声 `tzee-tzee` 和责备的 `speee-speee-speee`。栖息地：森林边缘、荒废空地。分布：留居于菲律宾西部和南部。\n\
  \n![image](img/page313.jpg)\n\n## 150 织布鸟\n\n# 1 黑颈织布鸟\n*Orthotomus atrogularis*\
  \ 11–12cm 野外记录：胆小且低调。在低矮植被中觅食，也会到达较高位置。亚种 `O.`. `a.`. \\`humreysi` (1b) 出现在婆罗洲东北部。鸣声：高而颤抖的\
  \ `pirra pirra` 和颤音 `kri-kri-kri`；在婆罗洲，据认为还会发出高而清亮的 `dweet-dweet dweet-dweet`。栖息地：原生林和次生林、次生生长、森林边缘、灌木丛和花园。分布：留居于苏门答腊和婆罗洲。\n\
  \n# 2 绿背\n*Orthotomus sepium* 12cm 野外记录：从林下层到冠层的活跃觅食者。鸣声：多种单音，单调地节奏重复，如 `chew-chew-chew`\
  \ 或 `turr-turr-tsee-sweet --- tsee-sweet`；还会发出颤抖的鼻腔叫声和响亮的颤音 `tree-yip`。栖息地：内陆次生森林、森林边缘、竹林丛和耕作地的灌丛边缘。分布：西小巽达群岛的爪哇岛、巴厘岛和兰莫岛特有种。\n\
  \n# 3 灰尾织布鸟\n*Orthotomus ruficeps* 11–12cm 野外记录：成对或小群出现，从林下植物一直到冠层觅食。鸣声：重复的 `chip-we\
  \ chip-wee` 或类似音符；叫声包括 `trrree-yip`、哀伤的 `cho-choee`、喷溅的 `prrrt`、滚动的 `prit-u` 和粗哑的\
  \ `thieu`。栖息地：次生森林、竹林丛、红树沼泽、海岸灌丛、泥炭森林和路边植被。分布：留居于苏门答腊、爪哇和婆罗洲。\n\n\n\n\n\n# 4 黄胸蜂��\n\
  *Orthotomus samarensis* 12cm\n野外记录：在茂密的灌木丛中隐秘的觅食者，通常成对出现；很少来到开阔地带。\n鸣声：长长的下降式、结式颤鸣，随后逐渐减慢、平稳，然后变为单调的律动声，记录为\
  \ `dededede-de-de-de-de-dep-dep-dep-deep-deep-deep-deeup-deeup-deeup`…\n栖息地：低地和森林边缘的茂密森林下层；有时出现在水流、山谷和干涸的河床。\n\
  分布范围：菲律宾东部特有。\n\n# 5 黑头蜂��\n*Orthotomus nigriceps* 12cm\n野外记录：在茂密的灌木丛中害羞且难以捉摸的觅食者，很少出现在开阔地带。\n\
  鸣声：长长的下降式、结式颤鸣，与前一种物种非常相似，但更具金属感且响亮；还会发出焦躁的下降声 `ssiirrrrpppppp` 和响亮的 `key-e ei`。\n\
  栖息地：低地的茂密森林下层。\n分布范围：菲律宾南部特有。\n\n# 6 白耳蜂��\n*Orthotomus cinereiceps* 12–13cm\n野外记录：通常成对出现，在茂密的灌木丛中觅食；很少在开阔地带被到。\n\
  鸣声：与前两种物种相似，但爆发力较弱，记录为 `dededede-dep-dep-deep-deeup deee-up deee-up deee-up deee-up`;还会发出焦躁的\
  \ `chat-chat-chat-chat-chat`。\n栖息地：低地森林空地或森林边缘茂密、错综的灌木丛。\n分布范围：菲律宾棉兰老岛西部特有。\n\n\
  ![image](img/page315.jpg)\n\n# 15 柳莺\n\n## 1 北极柳莺\n*Phylloscopus borealis* 12–13cm\n\
  野外记录：活跃、敏捷，主要是树栖觅食者；经常抖动翅膀和尾羽。经常是混种食物群的一部分。\n鸣声：颤抖的颤鸣，间杂着叫声；叫声包括沙哑的 `dzit`、`dz-dzit`\
  \ 或 `chizzick`。\n栖息地：开阔林、次生林和选择性采伐林、森林边缘、季风林、红林和林木花园。\n分布范围：该地区的冬候。\n\n## 2 日本柳莺\n\
  *Phylloscopus xanthodryas* 12–13cm\n野外记录：曾被视为前一种物种的亚种；行为习性相似。\n鸣声：叫声与前一种物种相似。\n\
  栖息地：林、次生林和红林。\n分布范围：该地区的冬候。\n\n## 3 黄眉柳莺\n*Phylloscopus inornatus* 11–12cm\n野外记录：在所有树层都是活跃的觅食者；从叶片上啄取猎物，悬停在外层叶上啄取昆虫，或进行俯冲捕食飞行中的昆虫。\n\
  鸣声：叫声包括高亮的 `tswe-eeet` 或 `tsweet`。\n栖息地：林、次生林、公园和花园。\n分布范围：苏门答腊和婆罗洲的迷鸟。\n\n## 4\
  \ 莱德柳莺\n*Phylloscopus schwarzi* 13–14cm\n野外记录：隐秘；动作相当缓慢。在浓密植被中或茂密灌木丛下的地面觅食。经常抖动翅膀和尾羽。\n\
  鸣声：叫声包括 `chek` 和 `pwit`。\n栖息地：开阔森林中的矮植被、森林空地和边缘，以及开阔地区的灌丛和高草。\n分布范围：菲律宾的迷鸟。\n\n\
  ## 5 褐柳莺\n*Phylloscopus fuscatus* 11–12cm\n野外记录：隐秘。在浓密植被或树木低枝间活跃的觅食者。\n鸣声：叫声包括尖锐的\
  \ `chac` 或 `chett`，像两块石子互相碰撞的声音。\n栖息地：带有矮树的开阔区域，通常靠近水边。\n分布范围：菲律宾的迷鸟。\n\n## 6 东方冠柳莺\n\
  *Phylloscopus coronatus* 12–13cm\n野外记录：所有层级的活跃的觅食者。\n鸣声：上升的 `pitschu-pitsch-wii`\
  \ 或更长的 `tuweeu tuweeu tuweeu tsu-eet tsu-eet-tzaa`;叫声包括柔和的 `phit phit` 或更粗的 `dwee`。\n\
  栖息地：混交和常绿林、森林边缘、矮树、灌木和红林。\n分布范围：苏门答腊和爪哇的冬候或迷鸟。\n\n## 7 择岛柳莺\n*Phylloscopus ijimae*\
  \ 12cm\n野外记录：经常进行捕虫飞行，否则是在丛中典型的活跃觅食者。\n鸣声：叫声包括响亮的 `twee` 和纤细的 `phi-phi-phi`。\n栖息地：落叶和混交亚热带常绿林、森林边缘、竹林和错综的灌丛。\n\
  分布范围：菲律宾的迷鸟。\n\n## 8 菲律宾柳莺\n*Phylloscopus olivaceus* 11–13cm\n野外记录：单独或作为混种食物群的一部分觅食；从灌木或树木的外层叶上啄取昆虫。\n\
  鸣声：频繁的、短促且尖锐的 `prrrr-chi`。\n栖息地：低地和中海拔森林。\n\n## 9 山地柳莺\n*Phylloscopus olivaceus*\
  \ 11–13cm\n野外记录：单独或作为混种食物群的一部分觅食；从灌木或树木的外层叶上啄取昆虫。\n鸣声：频繁的、短促且尖锐的 `prrrr-chi`。\n\
  栖息地：低地和中海拔森林及森林边缘。\n分布范围：菲律宾特有。\n\n\n\n\n\n# 7 栗冠嘴莺\n*Seicercus castaniceps* 9–10cm\n\
  野外记录：在树冠上层觅食。会抖动翅膀和尾巴。\n鸣声：极高调的 *see see see-see-see-see-see*；鸣声包括低的 *chik* 和 *chee-chee*。\n\
  栖息地：亚热带湿润山林。\n分布：留居于苏门答腊。\n\n# 8 巽答嘴莺\n*Seicercus grammiceps* 10cm\n野外记录：在森林边缘的林下和下冠层活跃的觅食者；繁殖季后经常出现在混物种觅食群中。*S.*\
  \ *g.* *sumatrensis* (8b) 产于苏门答腊。\n鸣声：清脆、高调的 *chee-chee-chechee*；鸣声带有嗡嗡的 *turrr*。\n\
  栖息地：下层发育良好的亚热带湿润山林。\n分布：苏门答腊、爪哇腊和巴厘岛特有。\n\n# 9 黄腹嘴莺\n*Abroscopus superciliaris*\
  \ 9cm\n野外记录：主要在林下层觅食，采食或进行短距离的飞行捕虫；经常抖动翅膀。\n鸣声：甜美、高调的 *dee-dee-dir-rit-tit-dewwt*；还有持续的啾啾声。\n\
  栖息地：灌木丛，尤其是山地和山林中的竹林。\n分布：留居于苏门答腊、爪哇腊和婆罗洲。\n\n![image](img/page319.jpg)\n\n## 153\
  \ 地地莺；����留莺\n\n### 1 科迪界地地莺\n*Robsonius rabori* 20–22cm\n野外记录：在落叶层或木屑中通过行走或跳跃觅食；据说也像小秧��一样穿过森林。经常翘起尾巴。\n\
  鸣声：多变的、极高调的类虫声 *tsui-ts sii uu ee*、*tsui-ts ssuuu ee*、*tit-tuuits ts ssu eeet* 或类似音。\n\
  栖息地：低地森林和次生林。\n分布：菲律宾吕宋岛北部特有。\n\n# 2 斯埃拉马德雷地地莺\n*Robsonius thompsoni* 20–22cm\n\
  野外记录：最近发现。在地面觅食，通过行走和奔跑寻找猎物。\n鸣声：高调且具有传声性，因此非常难以定位。\n栖息地：下层植物茂密的森林。\n分布：菲律宾吕宋岛北部特有。\n\
  \n# 3 俾科地地莺\n*Robsonius sorsogonensis* 20–22cm\n野外记录：在森林地地的叶叶间觅食时行走、跑步或跳跃；经常展开并翘起尾巴。\n\
  鸣声：高调的 *tit ----tsuuuu-tsiiiiii*，以及 *tssuit swiieeii*、*tssuu sit suuiee*、*tssiiuu\
  \ sweeiieet* 或 *tit-tsuee-swiieet*。\n栖息地：阔叶常绿林、森林边缘、次生林和竹林；喜欢有石灰岩岩或露头的区域。\n分布：菲律宾吕宋岛南部特有。\n\
  \n# 4 苏门答腊留鴸\n*Rimator albostriatus* 13cm\n野外记录：在森林地面或倒下的树木、树枝上觅食。\n鸣声：短促、清亮的铃音\
  \ *puu* 或 *puh*；兴奋时，会将这些与一系列 *whipu ip* 或 *whipu-wip* 声混合。鸣声包括低沉的 *wrrrt*、*trrrp*\
  \ 或 *trr h*。\n栖息地：低山橡树和月桂林。\n分布：苏门答腊西部特有。\n\n# 5 婆罗洲留鴸\n*Ptilocichla leucogrammica*\
  \ 15–16cm\n野外记录：通常成对或成小组出现在森林地面，在落叶层和腐烂的倒树枝间觅食。\n鸣声：哀伤的 *doo-dee* 或 *doo-doo-dee*；鸣声包括咯咯的\
  \ *churr* 或 *prr prr*。\n栖息地：原生林、次生林、伐木林、泥炭沼林和山地荒林。\n分布：婆罗洲特有。\n\n# 6 条纹留鴸\n*Ptilocichla\
  \ mindanensis* 13–14cm\n野外记录：单只、成对或小群在低矮植物或落叶层中觅食。*P.* *m.* *basilanica* (6b) 产于棉兰老岛西部外的巴实兰岛。\n\
  鸣声：下降的 *hi hi hi uu uu uu uu-u* 和穿透性的 *hiuu-hiuu-hiuu-hiuu*…；鸣声包括 *trrr-t, trrr\
  \ trrr* 和 *wh rrp*。\n栖息地：原生林和伐木林。\n分布：菲律宾特有。\n\n# 7 镰状留鴸\n*Ptilocichla falcata*\
  \ 19–20cm\n野外记录：在地面行走或跳跃觅食，或在密集的灌木丛和倒木中穿行。\n鸣声：响亮、哀伤、波动的 *hiuuu-huu oo* 或类似音。\n\
  栖息地：原生阔叶常绿林，通常靠近溪流；也有竹林。\n分布：菲律宾巴拉望岛特有。\n\n![image](img/page321.jpg)\n\n## 154 留鴸\n\
  \n### 1 纹留鴸\n*Kenopia striata* 14–15cm\n野外记录：在地面落叶层和倒树枝间觅食。\n鸣声：短促、清亮的铃音 *puu* 或\
  \ *puh*；鸣声包括柔软的 *whipu-wip*。\n栖息地：原生林、次生林和山地森林。\n分布：留居于苏门答腊。\n\n### 2 大留鴸\n*Napothera\
  \ macrodyla* 19cm\n野外记录：单只、成对或小群觅食，靠近地面。*N. macrodyla* 产于苏门答腊。\n鸣声：清脆、高调的 *chee-chee-chechee*；哨音句。\n\
  栖息地：阔叶常绿林。\n分布：菲律宾特有。\n\n### 3 锈胸留鴸\n*Napothera rufpectus* 18–19cm\n野外记录：在茂密植物中的地面或附近觅食。\n\
  鸣声：甜美、高调的 *dee-dee-dir-rit-tit-dewwt*。\n栖息地：山地常绿林。\n分布：留居于苏门答腊。\n\n### 4 黑喉留鴸\n\
  *Napothera atrigularis* 18cm\n野外记录：主要在地面觅食，探测树干缝隙。\n鸣声：清脆、高调的 *chee-chee-chechee*。\n\
  栖息地：低地原生常绿林。\n分布：婆罗洲特有。\n\n# 5 大理纹留鴸\n*Napothera marmorata* 21–22cm\n野外记录：害羞且隐秘，在灌木丛中的地面或附近觅食。\n\
  鸣声：清晰的哨音序列。\n栖息地：低山阔叶林。\n分布：留居于苏门答腊。\n\n# 6 山留鴸\n*Napothera crassa* 14cm\n野外记录：在低矮植物中觅食，有时也出现在较高处。\n\
  鸣声：尖锐的管乐鸣。\n栖息地：阔叶常绿林。\n分布：婆罗洲特有。\n\n# 7 眉留鴸\n*Napothera epilepidota* 10–11cm\n\
  野外记录：通常成对或成小组在森林地面的落叶间觅食。\n鸣声：细细、清亮的下降鸣声。\n栖息地：阔叶常绿林、混生豆林、潮湿廊林、针叶林和次生林。\n分布：留居于苏门答腊、爪哇腊和婆罗洲。\n\
  \n\n\n\n\n# 8 极小针眉鸟 *Pnoepyga pusilla* 7–9cm\n\n**野外记录：** 通常独居或成对出现，在阴凉处和中等密度的灌木丛的地上觅食。*P*.\
  \ *p*. *timorensis* (8b) 产于提汶汶岛。\n**鸣声：** 一声下降的 *tseei - tss – tsu*、一个 *tss-tsip*、一个\
  \ *tss-drrii*，在提汶汶岛为 *tsiee tsu tsii tssu*；鸣声包括尖锐、摩擦的 *tchit* 或 *chit*，在提汶汶岛为上升的\
  \ *tss u u u u u u u u u u-ssi-ssi*。\n**栖息地：** 山地森林、高次生林、灌木丛，偶尔出现在路边再生林。\n**分布范围：**\
  \ 留居于苏门答腊、爪哇、弗罗斯岛以及小松门群岛的提汶岛。\n\n![image](img/page323.jpg)\n\n## 155 剑尾留嘴鸟；留嘴类\n\
  \n### 1 巴戈博留嘴鸟 *Leonardina woodi* 19–20cm\n\n**野外记录：** 非常隐秘。在森林地面上或接近地面的地方觅食。\n\
  **鸣声：** 极高频、叮哒的 *seeeeep seepseep seep*，每隔 4–5 秒重复一次。\n**栖息地：** 原生阔叶常绿林和山地常绿林、森林边缘、山脊森林和过渡带森林（低地/山地）。\n\
  **分布范围：** 菲律宾南部（南部群岛特有）。\n\n### 2 栗背剑尾留嘴鸟 *Pomatorhinus montanus* 19–21cm\n\n**野外记录：**\
  \ 通常在灌木丛和中下层觅食，单只、成对或小群活动；也经常加入混种觅食群。\n**鸣声：** 一声快速的 *wu-pwi*，随后是第二只鸟发出 *wu-pu pu\
  \ pu pu pu pu*；在爪哇岛，第一只鸟发出 *hu-wi* 或 *wihu-wi*，第二只则以低低的 *wupup-wupup-wupup-wupup*\
  \ 跟随。\n**栖息地：** 阔叶常绿林。\n**分布范围：** 留居于苏门答腊、爪哇、巴厘岛和婆罗洲。\n\n### 3 苏拉威锡留嘴鸟 *Trichastoma\
  \ celebense* 15–16cm\n\n**野外记录：** 主要在地面或附近觅食，动作像鼠。*T. c. finschi* (3b) 产于苏拉威西南部。\n\
  **鸣声：** 一段响亮、欢快的、包含 2–5 声流动的、长笛般的忧郁哨音，有时会有回应（推测为雌性），以低调的 *kiew kiew kiew* 回答。\n\
  **栖息地：** 原生林、次生林和森林边缘的灌木丛。\n**分布范围：** 苏拉威西岛特有。\n\n### 4 白胸留嘴鸟 *Trichastoma rostratum*\
  \ 15–17cm\n\n**野外记录：** 在地面或附近觅食，也在水缘的树根、岩石或树枝上觅食。\n**鸣声：** 多变，包括重复的高频 *wi-ti-ti*、*chui-chwi-chew*\
  \ 或 *chr chr* *oo-iwee*；鸣声带有粗糙的摩擦声。\n**栖息地：** 河岸阔叶常绿林、次生淡水泥沼泽林，有时出现在红树林。\n**分布范围：**\
  \ 留居于苏门答腊和婆罗洲。\n\n### 5 铁锈色留嘴鸟 *Trichastoma bicolor* 16–18cm\n\n**野外记录：** 主要在中下层觅食，成对或松散的小群结活动。\n\
  **鸣声：** 各种欢快的短句和重复的、响亮、尖锐的 *u-wit* 或 *u-wee*；鸣声包括爆发性的 *wit* 和干枯、沙哑的音节。\n**栖息地：**\
  \ 原生林和次生林。\n**分布范围：** 留居于苏门答腊和婆罗洲。\n\n### 6 阿伯特留嘴鸟 *Malacocincla abbotti* 15–17cm\n\
  \n**野外记录：** 在落叶层中觅食，单只或成对活动。\n**鸣声：** 一系列 3–4 声丰富、长笛般的、流动的哨音；鸣声包括猫叫声、咕噜声和爆发性的 *cheu*，中间夹杂着神经质的\
  \ *wer* 音。\n**栖息地：** 红树林、海岸森林、河边森林、次生林、森林边缘和灌木丛。\n**分布范围：** 留居于苏门答腊、爪哇和婆罗洲。\n\n\
  ### 7 霍氏氏留嘴鸟 *Malacocincla sepiaria* 15–17cm\n\n**野外记录：** 在地面、低矮植物中觅食，偶尔也出现在较高的层。\n\
  **鸣声：** 一声尖锐的 3–4 音 *wi-cho-teuu* 或 *tip top tiu*；爪哇岛的鸟发出沉闷的 *wip-chup-chu--puiii*。\n\
  **栖息地：** 阔叶常绿林，通常靠近水。\n**分布范围：** 留居于苏门答腊、爪哇、巴厘岛和婆罗洲。\n\n### 8 黑眼眉留嘴鸟 *Malacocincla\
  \ perspicillata* 15–16cm\n\n**野外记录：** 仅从 1840 年代采集的一个标本可知；推测其行为与前述物种相似。\n**鸣声：**\
  \ 未记录。\n**栖息地：** 低地森林。\n**分布范围：** 婆罗洲东部班加马辛（Banjarmasin）特有。\n\n### 9 短尾留嘴鸟 *Malacocincla\
  \ malaccensis* 13–15cm\n\n**野外记录：** 在地面或其附近觅食，通常成对活动。\n**鸣声：** 一系列 6–7 声响亮的、丰富的、下降的哨音，以干枯的\
  \ *chututututut* 引导；中间夹杂着 *wer*。\n**栖息地：** 阔叶常绿林、泥生林。\n**分布范围：** 留居于苏门答腊。\n\n###\
  \ 10 灰头留嘴鸟 *Malacocincla ciniceps* 13cm\n\n**野外记录：** 常在地面跳跃，成对活动。\n**鸣声：** 一系列 3–4\
  \ 声丰富的、长笛般的、流动的哨音；鸣声包括干枯的哨音。\n**栖息地：** 低地森林、次生林。\n**分布范围：** 菲律宾南部特有。\n\n![image](img/page325.jpg)\n\
  \n### 苏门留嘴鸟 *Pellorneum buiko* 15cm\n\n**野外记录：** 在森林边缘觅食。\n**鸣声：** 一段响亮、欢快的、包含 2–5\
  \ 声流动的、长笛般的忧郁哨音。\n**栖息地：** 原生林、次生林。\n**分布范围：** 苏拉威锡岛特有。\n\n### 滕留嘴鸟 *Pellorneum\
  \ pyrrogen* 15cm\n\n**野外记录：** 在灌木丛中觅食。\n**鸣声：** 极高频、叮哒的 *seeeeep seepseep seep*，或是清晰的\
  \ *ti-tu-ti-tu* 或 *ti-tie-ti-tu*。\n**栖息地：** 阔叶常绿林。\n**分布范围：** 留居于爪哇。\n\n### 民留嘴鸟\
  \ *Pellorneum capilla* 15cm\n\n**野外记录：** 在中层觅食。\n**鸣声：** 尖锐的 *ip-ip-ip* 后接四个音。\n\
  **栖息地：** 原生林、次生林。\n**分布范围：** 留居于苏门答腊。\n\n### 黑顶留嘴鸟 *Pellorneum castratum* 16–17cm\n\
  \n**野外记录：** 在落叶层中觅食。\n**鸣声：** 一系列 6–7 声响亮的、丰富的、下降的哨音。\n**栖息地：** 原生阔叶常绿林、次生林。\n**分布范围：**\
  \ 留居于婆罗洲。\n\n### 须须留嘴鸟 *Malacopteron magnirostre* 18cm\n\n**野外记录：** 主要在中层觅食，小群活动。\n\
  **鸣声：** 清晰、甜美的 *ti-tu-ti-tu*。\n**栖息地：** 原生阔叶常绿林、泥沼泽林。\n**分布范围：** 留居于苏门答腊和婆罗洲。\n\n\
  ### 烟顶留嘴鸟 *Malacopteron affine* 15–17cm\n\n**野外记录：** 在小树的叶片上采集昆虫。\n**鸣声：** 一系列 6–9\
  \ 声上升和下降的哨音。\n**栖息地：** 阔叶常绿林、泥沼泽林。\n**分布范围：** 留居于苏门答腊和婆罗洲。\n\n### 鳞冠留嘴鸟 *Malacopteron\
  \ cinereum* 14–16cm\n\n**野外记录：** 中层活跃且敏捷的觅食者。\n**鸣声：** 多变，记为 *dit-dit-dit-dit-dit-dit-du-du-du-du-du-du-phu-phu-phu-phu-w-wiwiwiwiwi-wi-wi-wi-wu*。\n\
  **栖息地：** 原生阔叶常绿林、再生林。\n**分布范围：** 留居于苏门答腊、南爪哇和婆罗洲。\n\n\n\n\n\n# 7 红冠画眉\n*Malacopteron\
  \ magnum* 18–20cm\n**习性记录：** 主要在中层和灌木层觅食，成对、成小群体或作为混种群落的一部分出现。\n**鸣声：** 三段式鸣声，记录为\
  \ `phu-phu-phu-phi chuwee-chuwee-chuwee-chuwu-chuwu chut-chut-chut-chut-chut`。\n\
  **栖息地：** 原生阔叶常绿林、混合龙眼香林、伐区、山地石丛和矮矮的山脊森林；以及红树林和废弃的种植园。\n**分布：** 栖于苏门答腊和婆罗洲岛。\n\n\
  ##---\n\n# 8 妙声画眉\n*Malacopteron palawanense* 17–18cm\n**习性记录：** 在中层和下层觅食，单独或成小群体；注意到在竹林冠层中的枯叶中捕食昆虫。\n\
  **鸣声：** 一系列响亮、哀伤、清晰、交替的高低音哨声，音量逐渐增大，伴有 `whit-whit-whit-whit` 或 `chi-chi-chi-chi-chi`。\n\
  **栖息地：** 低地原生和老次生常绿林、竹林和森林边缘。\n**分布：** 菲律宾西部巴拉湾岛的特有种。\n\n##---\n\n# 9 灰胸画眉\n*Malacopteron\
  \ albogulare* 14–16cm\n**习性记录：** 通常在下层层觅食，单独、成对或成小群体。\n**鸣声：** 长而低沉、不和谐的短句调用，包括持续的咕咕声。\n\
  **栖息地：** 阔叶常绿林和淡水沼泽林。\n**分布：** 栖于苏门答腊和婆罗洲岛。\n\n![image](img/page327.jpg)\n\n157\
  \ 只画眉\n\n##---\n\n# 1 火焰眉画眉\n*Dasycrotapha speciosa* 13cm\n**习性记录：** 在灌木丛、下层灌木、藤蔓缠绕处中层觅食。\n\
  **鸣声：** 悦耳、模糊的鸣声，由微弱逐渐增强；调用包括柔和的 `yir`、`ju`、`chu` 或 `ju-jrrr`。\n**栖息地：** 原生、次生和退化的次生林，均有茂密的下层。\n\
  **分布：** 菲律宾西南部特有种。\n\n##---\n\n# 2 棉兰岛矮画眉\n*Dasycrotapha plateni* 10cm\n**习性记录：**\
  \ 分布于中层到下层冠层；敏捷的觅食者，偶尔进行捕虫飞行冲刺。\n**鸣声：** 调用包括 `tchik`、`a chik-chik-chik-chik-chik`，以及安静的\
  \ `tsieu-tsieu`… `tsieu tsieu tsieu`。\n**栖息地：** 原生和次生林、森林边缘和次生植被；也出现在废弃耕地的果树中。\n\
  **分布：** 菲律宾南部特有种。\n\n##---\n\n# 3 维萨亚矮画眉\n*Dasycrotapha pygmaea* 10cm\n**习性记录：**\
  \ 在中层觅食，偶尔在更高处。\n**鸣声：** 未知；可能与前一种物种相似。\n**栖息地：** 森林、森林边缘和次生植被。\n**分布：** 菲律宾东部特有种。\n\
  \n##---\n\n# 4 栗脸画眉\n*Zosterornis whiteheadi* 15cm\n**习性记录：** 通常从底层到冠层觅食；经常看到由多达\
  \ 30 只鸟组成的小群体出现，或作为混种觅食群的一部分。\n**鸣声：** 忙碌、啾啾的 `chip chip chip chip`，间杂着 `pe-chu`\
  \ 的音调。\n**栖息地：** 森林、次生植被、灌丛、纠结的高草丛和小山坡树木。\n**分布：** 菲律宾北部特有种。\n\n##---\n\n# 5 吕民条纹画眉\n\
  *Zosterornis striatus* 13–14cm\n**习性记录：** 从下层到上层缓慢而有节奏地觅食。\n**鸣声：** 高音调 `tsi` 声，加速变为颤音并以\
  \ `zeeep zep` 结束；调用包括断促、颤音的 `tiptiptiptiptiptip`。\n**栖息地：** 原生、次生、伐区和竹林、森林边缘、次生植被和过度生长的空地。\n\
  **分布：** 菲律宾北部特有种。\n\n##---\n\n# 6 潘纳 岛条纹画眉\n*Zosterornis latistriatus* 15cm\n**习性记录：**\
