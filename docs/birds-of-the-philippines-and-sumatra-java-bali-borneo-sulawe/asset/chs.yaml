  \n![image](img/page333.jpg)\n\n## 160 嘴条�类；画眉�；丝�；嘴�；画嘴�\n\n# 1 氏嘴条�\n*Pteruthius\
  \ aeralatus* 14cm\n野外习记：在树枝间滑动，在苔藓和地衣中寻找。\n鸣声：多变，记为 *cha-chew cha-chew*、*cha-cha-chip\
  \ cha-cha-chip*、*doo-du-dit-du-dit* 或类似声音。叫声包括粗厉的摩擦声和短促的 *pink*。\n栖息地：山林。\n分布：留于苏门答腊和婆罗洲。\n\
  \n# 2 黑白嘴条�\n*Pteruthius flaviscapis* 14cm\n野外习记：曾被认为与前种同种；行为假设相似。这种、前一种和下一种并不是真正的嘴条�；最新的建议将其归入画眉科。\n\
  鸣声：响亮、尖锐、有节奏的音节序列，开头短而弱。\n栖息地：阔叶常绿林和针阔混交林。\n分布：爪哇岛特有。\n\n# 3 栗额嘴嘴条�（颤音嘴条�）\n*Pteruthius\
  \ aenobarbus* 11–12cm\n野外习记：树栖性；在树冠和中层缓慢觅食。\n鸣声：单调的 *chip-chip-chip* 或类似声音，以及金属质感的颤音；叫声包括嗡嗡的\
  \ *jer-jer-jer* 和尖锐的 *pwit*。\n栖息地：阔叶常绿林和森林边缘。\n分布：留于爪哇岛。\n\n\n\n\n\n# 4 银耳眉\n*Leiothrix\
  \ argentauris* 15–17cm 野外记录：在灌木丛和树木间觅食，通常成小群活动。鸣声：欢快、下降的 `che tchu-tchu cher-it`\
  \ 或 `che-chu chiwi chu u`；叫声包括平直的哨声和粗耳的嘎喳声。栖息地：森林中的灌木和林下、森林边缘、次生林和灌丛。分布：留于苏门答腊岛西部。\n\
  \n# 5 斑腹嘴\n*Crocias albonotatus* 20cm 野外记录：通常以小群或混物种觅食群的形式出现，在树冠层或森林边缘觅食。鸣声：一系列沙哑的\
  \ `jhew` 或 `jhrr` 音符，以及一系列重复的 `whi tu` 或 `whi tui` 音符。栖息地：阔叶常绿林。分布：西爪哇岛特有。\n\n#\
  \ 6 长尾山鴴\n*Heterophasia picaoides* 28–35cm 野外记录：主要在高树的树冠层觅食，通常成对或成小群。鸣声：丰富、口哨般的六音节；叫声包括\
  \ `tsip-tsip-tsip-tsip`，有时夹杂着咯哒声或颤音。栖息地：阔叶常绿林、森林边缘、次生林和带有大树的开阔灌丛。分布：留于苏门答腊岛。\n\n\
  # 7 棕腹眉\n*Alcippe brunneicauda* 14–15cm 野外记录：在中下层和低矮植物中觅食，成对或成小群。鸣声：缓慢、高频的 `hi-tu-tu\
  \ ti-tu ti-tu` 或类似声音；叫声包括重音 `whit` 和短促粗耳的咯哒声。栖息地：阔叶常绿林，通常靠近溪流。分布：留于苏门答腊岛和婆罗洲岛。\n\
  \n# 8 爪哇腹眉\n*Alcippe pyrrhoptera* 14–15cm 野外记录：成小群觅食，偶尔出现在混物种觅食群中。鸣声：响亮清晰的 `ti-ti\
  \ chi chi chew`；叫声包括爆发性的 `bhip` 或 `jesip`，有时有松散的咯哒声。栖息地：山麓及山区阔叶常绿林。分布：西爪哇岛特有。\n\n\
  # 9 栗冠绣嘴\n*Yuhina everetti* 14cm 野外记录：通常出现在移动快速的群体中，在大小树顶觅食。鸣声：叫声包括低沉、快速的 `whit\
  \ whit whit` 或类似声音，以及咯哒的 `chr r r r r t`；群体会发出急促的嘎喳声。栖息地：山麓及山地阔叶常绿林、苔林、森林边缘和次生林。分布：婆罗洲岛特有。\n\
  \n# 10 白腹眼眼镜\n*Erpornis zantholeuca* 11–13cm 野外记录：在下树冠和高灌木中以杂技般的山�雀动作觅食。鸣声：短促、高频、下降的颤音，有时会上升，或上升后下降；叫声包括鼻音的\
  \ `nher-nher` 或 `jeer-jeer-jeer`，夹杂着啾啾声和干涩的颤音。栖息地：阔叶常绿林、次生林、伐木林、高地荒原和过度种植园。分布：留于苏门答腊岛西北和婆罗洲岛。\n\
  \n![image](img/page335.jpg)\n\n# 161 喜雀类\n\n## 1 巽答喜雀\n*Garrulax palliatus* 24–25cm\
  \ 野外记录：在低矮植物或地上觅食，通常成小群或在混种觅食群中。鸣声：群体歌声柔和开始，然后加速变成嘈杂、冒泡般的、翻滚般的尖叫、嘎喳和笑声混沌，最后平缓为一系列重复的\
  \ `wiku` 音符或流动的 `wipiwuwipiwpiwu`。联络声包括 `yo yo yo`……、`jieu jieu`、`yuk yuk`、`jup\
  \ jup` 或 `jip`。栖息地：阔叶常绿林，有时在次生林。分布：留于苏门答腊岛和婆罗洲岛。\n\n## 2 红额喜雀\n*Garrulax rufifrons*\
  \ 27cm 野外记录：通常出现在嘈闹的群体中或作为混种觅食群的一部分，主要在林下层觅食。鸣声：叫声包括重复、低抑、粗耳的 `kheh`、`queck` 或 `hii-tii\
  \ hii-tii-tii`……；激动时发出咯咯声或叮当的 `hi tu tu tu tu tu tu`……或 `hihi hu hu hu hu` `hu hu`……。栖息地：原生山林。分布：西爪哇岛特有。\n\
  \n## 3 苏门答腊喜雀（黑白喜雀）\n*Garrulax bicolor* 24–28cm 野外记录：嘈闹。成群在中层和下层觅食，偶尔也在地上觅食。鸣声：以嘎喳音符开始，随后是响亮、咯咯般的、美妙的笑声。栖息地：阔叶常绿林。分布：苏门答腊岛特有。\n\
  \n## 4 黑喜雀\n*Garrulax lugubris* 25–27cm 野外记录：成对或成小群觅食，通常接近地面。鸣声：空洞、呜咽般的 `huup-huup-huup`\
  \ 和快速的 `awk`。栖息地：阔叶常绿林、森林边缘。分布：留于苏门答腊岛。\n\n## 5 裸头喜雀\n*Garrulax calvus* 25–26cm\
  \ 野外记录：成对出现，有时在混种群中；喜好下层和中层。鸣声：一系列下降的颤音，有时上升，或上升后下降。栖息地：阔叶常绿林、次生林。分布：婆罗洲岛特有。\n\n\
  ## 6 栗冠喜雀\n*Garrulax mitr* 22–24cm 野外记录：嘈闹。成群在中层和下层觅食，偶尔在地上觅食。鸣声：`di-da-da` 和咯咯声。栖息地：阔叶常绿林、森林边缘。分布：西爪哇岛特有。\n\
  \n## 7 栗兜喜雀\n*Garrulax treacheri* 22–24cm 野外记录：从地面到树冠觅食，成小群活动。鸣声：纤细、高频的 `chu-wi-wi-we`\
  \ 或类似声音。栖息地：阔叶常绿林、森林边缘。分布：婆罗洲岛特有。\n\n![image](img/page337.jpg)\n\n# 162 绣眉鸟类\n\n\
  ## 1 绣眉\n*Madanga ruficollis* 13cm 野外记录：信息较少。最后的观测是混种群中的鸟类；也有记录发现它们像啄木一样上下爬树干寻找食物。鸣声：未有记录。栖息地：山林。分布：苏马鲁群岛的布鲁岛特有。\n\
  \n## 2 东方眼眼镜\n*Zosterops palpebrosus* 9–11cm 野外记录：好动，在树叶和花丛中敏捷觅食。经常是混种觅食群的一部分。鸣声：纤细，由模糊的叫声音符组成；啾啾的\
  \ `dzi-da-da` 和沙哑下降的 `djeeeer`。栖息地：阔叶常绿、落叶及沼泽林、次生林、红树林、园林、公园和花园。分布苏门答腊、爪哇、巴厘、婆罗洲和西巽达群岛。\n\
  \n## 3 低地眼眼镜\n*Zosterops meyeni* 10–12cm 野外记录：嘈闹。成群或混种群觅食。鸣声：`swit` 或 `swit-tzee`\
  \ 以及一系列复杂的啾啾声和喘息音符。栖息地：森林、森林边缘、竹林、灌丛、耕作区和花园。分布：菲律宾北部特有。\n\n## 4 恩加诺眼眼镜\n*Zosterops\
  \ salvadorii* 10cm 野外记录：成小群觅食；其他信息较少。鸣声：报告与东方眼眼镜相似。栖息地：低地林木区和椰子林。分布：苏门答腊岛西南部的恩加诺岛特有。\n\
  \n\n\n\n\n# 5 黑冠白眼雀\n*Zosterops atricapilla* 9–10cm\n野外记录：在树木和灌木中灵活敏捷的觅食者；经常成小群出现，或作为混种觅食群的一员。\n\
  鸣声：叫声包括颤动的音符和一系列响亮、清脆的连续音。\n栖息地：丘陵和低山森林、山地灌丛和高山杜鹃属草甸。\n分布：栖于苏门答腊和婆罗洲。\n\n# 6 埃弗特白眼雀\n\
  *Zosterops everetti* 11–12cm\n野外记录：群居性强，通常 5–20 只组成群，尽管也有记录过更高的数量；在树冠层觅食。\n鸣声：一系列\
  \ 8–13 声的金属感、沙哑的哨音，以及一系列甜美、微弱的啾啾声；叫声包括一声 `tsee-tsee`、金属感的 `spreet` 或 `peeet` 以及嗡嗡的\
  \ `dzee` 或 `dzee-ap`。\n栖息地：常绿林。\n分布：栖于婆罗洲、菲律宾西部和南部以及塔拉乌德群岛。\n\n# 7 黄腹白眼雀（金绿白眼雀）\n\
  *Zosterops nigrorum* 10–12cm\n野外记录：在多达 20 只鸟组成的嘈杂鸟群中或在混种群落中觅食。`Z`. `n`. `aureiloris`\
  \ (7b) 见于吕宋岛北部和西北部。\n鸣声：一系列 `pit-it tit`、`sit-it sit-it` 或 `sip-it sip-it` 的音符。\n\
  栖息地：森林、森林边缘、次生林、林地和龙脑香森林的下层。\n分布：菲律宾中部和北部的特有种。\n\n# 8 山地白眼雀\n*Zosterops montanus*\
  \ 11–12cm\n野外记录：群居性强，经常看到成小群或大群在树木上层觅食。`Z`. `m`. `obstinatus` (8b) 居住在马鲁群岛的塞拉姆岛、梯内岛和巴坎岛。\n\
  鸣声：变化多样；在爪哇为鸣唱，在苏门答腊为低沉而优美的歌声，在苏拉威西为 `peet-peet` 后接连颤音。联络声柔和且高亢。\n栖息地：原生山地森林、森林边缘、次生林、`Casuarina`\
  \ 林和木本耕地。\n分布：栖于苏门答腊、爪哇、巴厘、菲律宾和华莱腊群岛。\n\n# 9 圣诞岛白眼雀\n*Zosterops natalis* 12–14cm\n\
  野外记录：从低层到树冠均可觅食；群居性。\n鸣声：一种 `yerr yerr weet yerr yerr tyerr weet`……叫声包括啾啾声和鸣叫声、细细的\
  \ `ts-ee-sect`…… `tsee-eet`……、受惊时的 `tsirr-tsirr` 声，以及责备的 `cheeuw cheeuw cheeuw`。\n\
  栖息地：林地、灌木、森林边缘以及有树木丛的开阔地区。\n分布：圣诞岛特有种。\n\n![image](img/page339.jpg)\n\n## 163 只白眼雀\n\
  \n# 1 爪哇白眼雀\n*Zosterops flavus* 9–10cm\n野外记录：树栖性；以 10–40 只组成紧密的觅食群体觅食。\n鸣声：叫声包括一声\
  \ `trrieew`、短促而柔和的 `trrip` 以及受惊时的 `wiwiwiwi`。\n栖息地：红树林、沿海森林边缘、低水位水边树、林、灌木区和花园。\n\
  分布：爪哇岛西部和婆罗洲南部特有种。\n\n# 2 柠檬腹白眼雀\n*Zosterops chloris* 11–12cm\n野外记录：通常以小群出现；在所有高度层都是活跃的觅食者。`Z`.\
  \ `c`. `flavissimus` (2b) 见于苏拉威岛东南部的土卡恩贝西岛。\n鸣声：丰富、优美、高亢且起伏的音符，伴有短促的、重复的单调 `si-si`\
  \ 音。叫声包括一声 `shilp` 或 `chiew`。\n栖息地：次生林和开阔林地、灌丛、红树林、沿海林和灌木丛、耕地和花园。\n分布：栖于苏拉威岛、小松汶群岛西部和马鲁群岛。\n\
  \n# 3 灰腹白眼雀\n*Zosterops citrinella* 10–11cm\n野外记录：活跃，在外层树冠叶丛中以小群或作为混种群的一员觅食。\n鸣声：一系列微弱、高亢的啾啾声，间杂着快速重复的鸣唱、颤音和滑音；在塔尼姆巴岛，发出系列快速、起伏的、响亮而甜美的鸣声。\n\
  栖息地：原生林和次生林、退化林、森林边缘、开阔林地、季风林、红树林、沿海林、耕地和灌木丛。\n分布：小松汶群岛特有种。\n\n# 4 珍珠腹白眼雀\n*Zosterops\
  \ grayi* 13cm\n野外记录：单独、成对或在中间层以混种觅食群形式觅食。\n鸣声：一系列尖锐、吱吱的、叽喳声，间杂着三声尖锐高亢的音。叫声包括 `pipip`\
  \ 和 `trrr`。\n栖息地：马鲁群岛凯群岛。\n分布：马鲁群群岛。\n\n# 5 金腹白眼雀\n*Zosterops uropygialis* 12–13cm\n\
  野外记录：通常成对或小群见于树冠层。\n鸣声：一系列快速重复的甜美、清脆的音符，以几声响亮的音结束。\n栖息地：中海拔山区次生林、开阔地区。\n分布：凯群岛特有种。\n\
  \n# 6 淡腹白眼雀\n*Zosterops consobrinum* 11–12cm\n野外记录：主要在林下和森林边缘灌木丛中觅食，通常成对出现。\n鸣声：悦耳动目的歌声，不带颤音。\n\
  栖息地：苏拉威岛南部的残留林块、种植园。\n分布：苏拉威岛南部特有种。\n\n# 7 黑环白眼雀\n*Zosterops anomalus* 12cm\n野外记录：单独、成对、小群或混种群中发现，从林下植被到树冠。\n\
  鸣声：低沉的 `chewchicher-i- rr`。\n栖息地：被砍伐的丘陵、次生林、果园。\n分布：苏拉威岛南部特有种。\n\n# 8 黄环白眼雀（黄眼镜白眼雀）\n\
  *Zosterops wallacei* 11–12cm\n野外记录：在中间层和上层觅食，单独、成对或成小群。\n鸣声：变化多样；在松巴岛发出下行的清脆的鸣唱；在科莫多岛发出一系列快速的鸣声，以两声短音开始，一个上滑的哨音和杂乱的高音；在弗莱斯岛也有。\n\
  栖息地：原生林和次生林、干旱灌丛和耕地。\n分布：小松汶群岛西部特有种。\n\n# 9 桑基岛白眼雀\n*Zosterops nehrkorni* 10–12cm\n\
  野外记录：小群在密集的树冠和亚冠叶丛中觅食。\n鸣声：纤细、清脆并逐渐消失；叫声包括 `swiit`…… `swiit`…… `swiit`。\n栖息地：山脊顶原生阔叶林，长有密密的线藻属。\n\
  分布：桑基岛特有种。\n\n![image](img/page341.jpg)\n\n## [164 只白眼雀]\n\n# 1 爪哇白眼雀\n*Zosterops\
  \ somadiktai* 11cm\n野外记录：在密集的矮灌木中觅食，通常成对或成小群。\n鸣声：纤细甜美的鸣唱；移动的鸟群发出啾啾声。\n栖息地：红树林附近的矮灌木、椰子林、砍伐森林中的次生灌丛和花园。\n\
  分布：苏拉威岛北部提安岛特有种。\n\n# 2 塞拉姆白眼雀\n*Zosterops stalkeri* 11cm\n野外记录：以小群出现或作为混种觅食群的一部分；通常在森林下植被中觅食。\n\
  鸣声：一系列快速重复的甜美、清脆的音符，以几声响亮的音结束；还发出一系列快速的轻微滚动的 `swi` 音。\n栖息地：中海拔山区次生林。\n分布：马鲁群岛南部塞拉姆岛特有种。\n\
  \n\n\n\n\n## 3 黑冠白眼雀 *Zosterops atrifrons* 11–12cm\n**观野笔记：** 从低处一直到树冠层均觅食，成小群活动，有时是规模较大的群体（在苏拉威西岛记录过\
  \ 100 只左右）。**鸣声：** 变化多样：尖锐的鸣唱声、一系列快速的高音甜美音符，以及一系列清晰、高音、滚动的甜美哨哨声。鸣声包括双重音，随后是下降并减弱的啾啾，以及高音的\
  \ `peee`、`tiu` 或 `teew`。**栖息地：** 原生和次生低地及山地森林、采伐和退化的森林以及森林边缘。**分布：** 留居于苏拉威西岛、班盖岛和苏拉岛。\n\
  \n## 4 奶油喉白眼雀 *Zosterops atriceps* 12cm\n**观野笔记：** 相对躲避；在灌木丛、中层或树冠层觅食。*Z.* *a.*\
  \ *dehaani* (4b) 于莫罗泰岛；*Z.* *a.* *fuscifrons* (4c) 于哈马黑拉岛。**鸣声：** 纤细、甜美的哨哨音，高低起伏，最后以\
  \ 1–2 声 `tu-wit` 结束；哈马黑拉岛的鸟类声音更大，且缺少结尾音符。**栖息地：** 低地和山地的原生及次生森林、森林边缘和耕地。**分布：**\
  \ 北摩卢加群岛特有。\n\n## 5 亚汶白眼雀 *Zosterops kuehni* 12cm\n**观野笔记：** 树冠中的活跃觅食者，尤其在花期；成对或成小群出现。**鸣声：**\
  \ 旋律性的鸣唱；鸣声带有嘶嘶的 `teeu`。**栖息地：** 低地森林、次生森林残迹和林地、树木稀疏的耕地、灌木丛和花园。**分布：** 南摩卢加群岛的安汶岛和塞拉姆岛特有。\n\
  \n## 6 布鲁白眼雀 *Zosterops buruensis* 11–12cm\n**观野笔记：** 在树冠或亚树层的茂密叶丛中随混种群觅食。**鸣声：**\
  \ 觅食时，发出安静且快速重复的 `tsu-tsu-tsu-tsu-tsu`；还会发出 `chewit chewit chewit`。**栖息地：** 原生森林和选择性采伐森林、次生林和灌木丛。**分布：**\
  \ 南摩卢加群岛布鲁岛特有。\n\n## 7 褐眼双色白眼雀）*Tephrozosterops stalkeri* 12–13cm\n**观野笔记：** 独居、成对或成混种群觅食。**鸣声：**\
  \ 未记录。**栖息地：** 森林边缘或空地的茂密次生林、过度生长的耕地和灌木丛。**分布：** 南摩卢加群岛塞拉姆岛特有。\n\n## 8 米斯白眼雀（灰喉白眼雀）*Lophozosterops\
  \ javanicus* 13cm\n**观野笔记：** 主要发现于树冠或森林边缘高处，成对、小群或作为混种群的一部分。*L.* *j.* *elongatus*\
  \ (8b) 于东爪哇岛和巴厘岛；*L.* *j.* *frontalis* (8c) 于西爪哇岛。**鸣声：** 歌声由优美的哨声和鸣音组成；鸣声包括长而拉长的高音啾声，和沙哑的\
  \ `turr`、`teerrr-teerrr` 或 `chee-ee-wheet-chee-ee-weeeet`。**栖息地：** 森林、茂密的次生林和荒废种植园。**分布：**\
  \ 爪哇岛和巴厘岛特有。\n\n## 9 斑头白眼雀 *Lophozosterops squamiceps* 12cm\n**观野笔记：** 从下层到树冠层觅食，成对或成小群，并作为混种群的一部分。*L.*\
  \ *s.* *striaticeps* (9b) 于苏拉威西岛北部。**鸣声：** 一系列重复的、鸣唱的响亮、清晰、甜美、嘶嘶、高音音符；还会发出粗哑的啾啾颤音。**栖息地：**\
  \ 原生山地森林、森林边缘和次生林。**分布：** 苏拉威西岛特有。\n\n![image](img/page343.jpg)\n\n165 白眼雀；黑利亚雀；黑眼雀\n\
  \n## 1 民兰白眼雀（黑面白眼雀）*Lophozosterops goodfellowi* 13–14cm\n**观野笔记：** 在森林的所有层级觅食，成小群或混种群。**鸣声：**\
  \ 旋律性的、哨声 `tu-pik`、`chu-beer` 或 `su si deer`，通常一起发出。**栖息地：** 山麓和山地森林以及森林边缘。**分布：**\
  \ 菲律宾民兰老岛特有。\n\n## 2 奶油眉白眼雀（黄眉白眼雀）*Lophozosterops superciliaris* 13cm\n**观野笔记：**\
  \ 通常发现成小群觅食，偶尔成大群（在弗莱斯岛记录过超过 50 只），通常在中层。**鸣声：** 一系列快速的高音、泡泡音、颤音和鸣唱音符，偶尔夹杂着 `tchee-tchee`\
  \ 音；还会发出响亮的 `peu`。**栖息地：** 原生山地森林、森林边缘和次生林。**分布：** 西巽群岛特有。\n\n## 3 灰帽白眼雀 *Lophozosterops\
  \ pinaiae* 14cm\n**观野笔记：** 在茂密叶丛中随混种群 觅食。**鸣声：** 未知。**栖息地：** 山地森林。**分布：** 南摩卢加群岛塞拉姆岛特有。\n\
  \n## 4 冠白眼雀 *Lophozosterops dohertyi* 12cm\n**观野笔记：** 在下层觅食，成对或成小群，并作为混种群的一部分。**鸣声：**\
  \ 一系列清晰、甜美的哨声；还会发出柔和的 `tsip`。**栖息地：** 原生森林、退化的森林。**分布：** 西巽群岛特有。\n\n## 5 侏儒白眼雀 *Oculincta\
  \ squamiceps* 9–10cm\n**观野笔记：** 快速移动的小群在树顶觅食。**鸣声：** 旋律的 `wit-a-wit wheer`；鸣声包括啾啾。**栖息地：**\
  \ 干燥开阔地。**分布：** 布鲁洲岛特有。\n\n## 6 厚嘴黑利亚雀（厚嘴白眼雀）*Heleia crassistos* 13–14cm\n**观野笔记：**\
  \ 通常成对或成小群。**鸣声：** 一系列快速的哨声和颤音；鸣声包括深沉的 `chup`。**栖息地：** 原生森林。**分布：** 小巽他群岛特有。\n\n\
  ## 7 斑胸黑利亚雀（斑胸白眼雀）*Heleia muelleri* 13–14cm\n**观野笔记：** 混种群的成员。**鸣声：** 不悦耳的震动声；还会发出粗糙的摩擦声。**栖息地：**\
  \ 原生森林。**分布：** 小巽他群岛的帝汶汶岛特有。\n\n## 8 山地黑眼雀 *Chlorocharis emiliae* 11–12cm\n**观野笔记：**\
  \ 在地面附近觅食。**鸣声：** 结结的 `gujuguju`。**栖息地：** 山地苔藓森林。**分布：** 布鲁洲特有。\n\n![image](img/page345.jpg)\n\
  \n166 鹴；��；尾�\n\n## 1 爪哇灌鹴 *Mirafra javanica* 14cm\n**观野笔记：** 在地上觅食。**鸣声：** 变化的短句；鸣声包括爆发性的\
  \ `pitsi pitsi pitsipipipi`。**栖息地：** 有灌木的草地。**分布：** 留居于爪哇岛、巴厘岛、布鲁岛、菲律宾和小巽他群岛。\n\n\
  ## 2 东方云鹴 *Alauda gulgula* 15–18cm\n**观野笔记：** 在地上觅食。**鸣声：** 短促的主投影；鸣声包括 `baz-baz`、`a\
  \ baz-terr` 和 `twip`。**栖息地：** 干燥开阔地。**分布：** 留居于菲律宾北部。\n\n\n\n\n## 4 理查德云��\n*Anthus\
  \ richardi* 17–20cm 野外记录：在地面觅食。飞行有力且呈波浪状；着陆前经常会悬停。鸣声：叫声包括粗粗的 `schreep` 或 `sherrreeep`、`chup`、低的\
  \ `chirp` 和 `r-rump`。栖息地：开阔草地。分布：婆罗洲的冬季访客。\n\n## 5 稻云��\n*Anthus rufulus* 15cm 野外记录：在地面觅食；经常直立站立。鸣声：叫声包括响亮的\
  \ `chep` 或 `chep-chep`、细的 `pipit` 和粗厉的 `chwist`。栖息地：开阔地区、草地、稻田和农田。分布：居住在苏门答腊、爪哇、巴厘、婆罗洲、菲律宾、苏拉西和巽群岛。\n\
  \n## 6 佩乔拉云��\n*Anthus gustavi* 15cm 野外记录：躲避。在地面觅食；倾向于在着陆前悬停。鸣声：尖锐的 `tsip`、`tsip-tsip`\
  \ 或 `tsi-tsi-tsi-tsip`。栖息地：湿润草地和开阔林地。分布：婆罗洲、菲律宾、苏拉西、巽群岛和北摩卢加群的冬季访客。\n\n## 7 红喉云��\n\
  *Anthus cervinus* 14–15cm 野外记录：在地面觅食，通常成群。经常栖息在灌丛、电线或围栏上。鸣声：短促的 `tew` 和较长的高调的 `pseeeu`。栖息地：草地、湿地草缘和荒地。分布：婆罗洲和菲律宾的冬季访客；苏拉西的候鸟。\n\
  \n## 8 橄榄背云��\n*Anthus hodgsoni* 14–15cm 野外记录：在地面觅食；也经常栖息在树上。在菲律宾北部发现平背亚种 `A`.`h`.`yunnanensis`\
  \ (8b)。鸣声：响亮的 `teaze`，以及细的 `teez` 或 `tseep`。栖息地：开阔森林、林间、森林边缘和林地耕地。分布：婆罗洲和菲律宾的冬季访客。\n\
  \n## 9 森林长��\n*Dendronanthus indicus* 16–18cm 野外记录：奔或行走；尾巴和身体后部左右摇动。受惊时会飞到树上栖息。鸣声：生硬而尖锐的\
  \ `pick` 或 `pick-pick`。栖息地：森林小径、林地种植和红树林。分布：苏门答腊、爪哇、婆罗洲的冬季访客，极少见于菲律宾。\n\n## 10 白长��\n\
  *Motacilla alba* 17–18cm 野外记录：行走或跑步；尾巴上下摇动。`M.``a.``ocularis`（主图）见于婆罗洲和菲律宾；在菲律宾记录黑背亚种\
  \ `M`.`a`.`lugens` (10b)。鸣声：`ts-lee-wee`、`tslee-vit` 或类似的。栖息地：开阔地区，通常靠近水边。分布：婆罗洲和菲律宾的冬季访客。\n\
  \n## 11 东部黄长��\n*Motacilla tschutschensis* 16–18cm 野外记录：在地面觅食。存在蓝头和绿头的 `M.``t.``taivana`\
  \ (11b)。鸣声：响亮的 `pseeu` 或 `tsreep`。栖息地：湿润和干燥的草地，以及旱的稻田。分布：该地区的冬季访客。\n\n## 12 灰长��\n\
  *Motacilla cinerea* 17–20cm 野外记录：不断抽动后部和尾巴。经常栖息在水水水方的树枝上。鸣声：高调的 `zit-zit`，受惊时快速重复。栖息地：山溪、低地水道、沿海地区和路边。分布：该地区的冬季访客。\n\
  \n![image](img/page347.jpg)\n\n## 167 太阳鸟\n\n## 1 普通太阳鸟\n*Anthreptes simplex* 13cm\
  \ 野外记录：觅食方式很像叶色驻，从叶子上取食。鸣声：金属般的啾鸣和颤音，以及高调的 `seep`。栖息地：森林、森林边缘、灌丛、沿海灌丛和红树林。分布：居住在苏门答腊和婆罗洲。\n\
  \n## 2 喉太阳鸟\n*Anthreptes malacensis* 14cm 野外记录：单独或成对在各个高度觅食，从叶子和树枝上取食。`A.``m.``celebensis`\
  \ (2b) 见于苏拉西。鸣声：`sweet-sweet`、`swit-swit-sweet` 或 `wee-chew-chew-wee`；叫声包括重复的 `kelichap`、生硬的\
  \ `chip`、拉长的高调 `siiewei` 和尖锐的 `whiiu`。栖息地：森林边缘、红树林、淡水沼泽森林、次生林、沿海灌丛、种植园和花园。分布：居住在苏门答腊、爪哇、巴厘、婆罗洲、菲律宾、苏拉西以及班盖和苏拉岛。\n\
  \n## 3 灰喉太阳鸟\n*Anthreptes griseigularis* 12–13cm 野外记录：曾被认为与前一种物种同源；推测行为相似。鸣声：未知。栖息地：森林。菲律宾特有。\n\
  \n## 4 红喉太阳鸟\n*Anthus cervinus* 14cm 野外记录：在地面觅食，通常成群。经常栖息在灌丛、电线或围栏上。鸣声：短促的 `tew`\
  \ 和较长的高调的 `pseeeu`。栖息地：森林边缘、红树林、次生林。分布：居住在婆罗洲。\n\n## 5 红颊太阳鸟\n*Chalcoparia singensis*\
  \ 10–11cm 野外记录：主要在上层觅食，从叶子上取食。鸣声：尖锐的 `ti-titi`、低沉的 `sweet` 和各种高调鸣声。栖息地：森林、森林边缘、次生林。分布：居住在苏门答腊和婆罗洲。\n\
  \n## 6 紫喉太阳鸟\n*Leptocoma sperata* 9–10cm 野外记录：通常成对觅食，偶尔成小群。`L.s.henkei` (6b) 见于吕松北部；`L.s.juliae`\
  \ 见于民丹岛和苏禄群岛。鸣声：金属般的 `spee-spit` 或 `pee-pit`。栖息地：低地森林、次生林、种植。分布：菲律宾特有。\n\n## 7 哈塞尔特太阳鸟\n\
  *Leptocoma brasiliana* 10cm 野外记录：通常在树顶觅食；悬停从叶片和花朵上取昆虫。鸣声：一系列不和谐的 `sweet`；叫声包括微弱的\
  \ `chip`、尖锐的 `si-si` 和短高调的鸣声。栖息地：森林、森林边缘、次生林、种植。分布：居住在苏门答腊和爪哇。\n\n## 8 黑太阳鸟\n*Leptocoma\
  \ aspasia* 11–12cm 野外记录：活跃，通过取食或悬停觅食。`L.a.talautensis` (8b) 见于达劳岛；`L.a.chlorolaema`\
  \ (8c) 居住在凯群；`L.a.grayi` (8d) 见于苏拉西北部。鸣声：快速、甜美的韵律；叫声包括尖锐的 `zi-zi-zi`、低沉的 `swee`\
  \ 和各种高调哨声。栖息地：原生林和次生林、红树林、灌丛、村庄树木。分布。\n\n## 9 铜喉太阳鸟\n*Leptocoma calcostetha* 12–13cm\
  \ 野外记录：主要在红树林觅食，取食蜜和小型昆虫。鸣声：高调鸣声和深沉、优美的鸣声。栖息地：红树林、沿海灌丛、次生林。分布：居住在苏门答腊、爪哇、婆罗洲和菲律宾西部。\n\
