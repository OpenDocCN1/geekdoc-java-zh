    ```\n\nWe will start with the details page which will display the title, date,\
    \ body, and author with links to edit and delete. It will also link back to all\
    \ articles. Recall that the Django templating language's url tag parses the URL\
    \ name and then any arguments passed in. The name of our edit route is article_edit\
    \ and we need to pass in its primary key article.pk. The delete route name is\
    \ article_delete and it also needs a primary key article.pk. Our articles page\
    \ is a ListView so it does not need any additional arguments passed in.\n\n##\
    \ Code\n\n```html\n<!-- templates/article_detail.html -->\n{% extends 'base.html'\
    \ %}\n\n{% block content %}\n<div class=\"article-entry\">\n<h2>{{ object.title\
    \ }}</h2>\n<p>by {{ object.author }} | {{ object.date }}</p>\n<p>{{ object.body\
    \ }}</p>\n</div>\n\n<p><a href=\"{% url 'article_edit' article.pk %}\">Edit/</a>\
    \ | <a href=\"{% url 'article_delete' article.pk %}\">Delete/</a></p>\n\n<p>Back\
    \ to <a href=\"{% url 'article_list' %}\">All Articles/</a>.</p>\n{% endblock\
    \ content %}\n```\n\nFor the edit and delete pages we can use Bootstrap button\
    \ styling to make the edit light blue and the delete button red.\n\n## Code\n\n\
    ```html\n<!-- templates/article_edit.html -->\n{% extends 'base.html' %}\n\n{%\
    \ block content %}\n<h1>Edit/</h1>\n<form action=\"\" method=\"post\">{% csrf_token\
    \ %}\n  {{ form.as_p }}\n  <button class=\"btn btn-info ml-2\" type=\"submit\"\
    >Update</button>\n</form>\n{% endblock %}\n```\n\n## Code\n\n```html\n<!-- templates/article_delete.html\
    \ -->\n{% extends 'base.html' %}\n\n{% block content %}\n<h1>Delete/</h1>\n<form\
    \ action=\"\" method=\"post\"> {{ csrf_token }}\n<p>Are you sure you want to delete\
    \ \"{{ article.title }}?\"</p>\n<button class=\"btn btn-danger ml-2\" type=\"\
    submit\">Confirm</button>\n</form>\n{% endblock %}\n```\n\nAs a final step we\
    \ can add the edit and delete links to our lists page at the div card-footer...\
