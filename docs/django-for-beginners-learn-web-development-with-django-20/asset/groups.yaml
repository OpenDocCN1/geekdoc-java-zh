    \ keep our code nice and organized going forward.\n\nOn the command line use the\
    \ startapp command to create our new pages app. If the server is still running\
    \ you may need to stop it.\n\n# Command Line\n\n```bash\npython manage.py startapp\
    \ pages\n```\n\nThen immediately update our settings.py. I often forget to do\
    \ this so run the startapp command then update INSTALLED_APPS.\n\n# Code\n\n```python\n\
    # newspaper_project/settings.py\nINSTALLED_APPS = [\n    'django.contrib.admin',\n\
    \    'django.contrib.auth',\n    'django.contrib.contenttypes',\n    'django.contrib.sessions',\n\
    \    'django.contrib.messages',\n    'django.contrib.staticfiles',\n    'users',\n\
    \    'pages', # new\n]\n```\n\nNow we can update our project-level urls.py. Go\
    \ ahead and remove the import of TemplateView. We will also update the route to\
    \ include pages.\n\n# Code\n\n```python\n# newspaper_project/urls.py\n\nfrom django.contrib\
    \ import admin\nfrom django.urls import path, include\n\nurlpatterns = [\n   \
    \ path('', include('pages.urls')),\n    path('admin/', admin.site.urls),\n   \
    \ path('users/', include('users.urls')),\n]\n```\n\nIt's time to add our pages/urls.py\
    \ file. First create it.\n\nThen import our not-yet-created views, set the route\
    \ paths, and make sure to name each url, too.\n\n## Chapter 10: Bootstrap\n\n\
    207\n\n# Code\n\n```python\n# pages/urls.py\nfrom django.urls import path\nfrom\
    \ . import views\n\nurlpatterns = [\n    path('', views.HomePage.as_view(), name='home'),\n\
    ]\n```\n\nThe views.py code should look familiar at this point. We're using Django's\
    \ TemplateView generic class-based view which means we only need to specify our\
    \ template_name to use it.\n\n# Code\n\n```python\n# pages/views.py\nfrom django.views.generic\
    \ import TemplateView\n\nclass HomePage(TemplateView):\n    template_name = 'home.html'\n\
    ```\n\nWe already have an existing home.html template. Let's confirm it still\
