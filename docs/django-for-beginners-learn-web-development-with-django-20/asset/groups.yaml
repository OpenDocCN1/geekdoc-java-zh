    # Introduction


    Welcome to Django for Beginners, a project-based approach to learning web development
    with the Django web framework. In this book you will build five progressively
    more complex web applications, starting with a simple “Hello, World” app, progressing
    to a blog app with forms and user accounts, and finally a newspaper app using
    a custom user model, email integration, foreign keys, authorization, permissions,
    and more.


    By the end of this book you should feel confident creating your own Django projects
    from scratch using current best practices.


    Django is a free, open source web framework written in the Python programming
    language and used by millions of programmers every year. Its popularity is due
    to its friendliness to both beginners and advanced programmers: Django is robust
    enough to be used by the largest websites in the world—Instagram, Pinterest, Bitbucket,
    Disqus—but flexible enough to be a good choice for early-stage startups and prototyping
    personal projects.


    This book is regularly updated and features the latest versions of both Django
    (2.0) and Python (3.6x). It uses Pipenv which is now the officially recommended
    package manager by Python.org for managing Python packages and virtual environments.
    Throughout we''ll be using modern best practices from the Django, Python, and
    web development communities, especially the thorough use of testing.


    # Why Django


    A web framework is a collection of modular tools that abstracts away much of the
    difficulty—and repetition—inherent in web development. For example, most websites
    need the same basic functionality: the ability to connect to a database, set URL
    routes, display content on a page, handle security properly, and so on. Rather
    than recreate all of this from scratch, programmers over the years we have created
    frameworks in all the major programming languages: Django and Flask in Python,
    Rails in Ruby, and Express in JavaScript among many, many others.


    Django inherited Python’s “batteries-included” approach and includes out-of-the-box
    support for common tasks in web development:


    - user authentication

    - templates, routes, and views

    - admin interface

    - robust security

    - support for multiple database backends

    - and much much more


    This approach makes our job as web developers much, much easier. We can focus
    on what makes our web application unique rather than reinventing the wheel when
    it comes to standard web application functionality.


    In contrast, several popular frameworks–notably Flask in Python and Express in
    JavaScript–adopt a “microframework” approach. They provide only the bare minimum
    required for a simple web page and leave it to the developer to install and configure
    third-party packages to replicate basic website functionality. This approach provides
    more flexibility to the developer but also yields more opportunities for mistakes.


    As of 2018 Django has been under active development for over 13 years which makes
    it a grizzled veteran in software years. Millions of programmers have already
    used Django to build their websites. And this is undeniably a good thing. Web
    development is hard. It doesn’t make sense to repeat the same code–and mistakes–when
    a large community of brilliant developers has already solved these problems for
    us.


    At the same time, Django remains under active development and has a yearly release
    schedule. The Django community is constantly adding new features and security
    improvements. If you''re building a website from scratch Django is a fantastic
    choice.


    # Why this book


    I wrote this book because Django is extremely well documented there is a severe
    lack of beginner-friendly tutorials. When I first learned Django I struggled to
    even complete. My goal is that this book fills in the gaps and showcases how beginner-friendly
    Django is. However if you are serious about a career in web development, you will
    eventually need to invest the time to learn Python, HTML, and CSS. A list of recommended
    resources for further study is included in the Conclusion. The writers of the
    Django docs could emphasize ease-of-use or its depth, but not both. They choose
    the latter.


    # Book Structure


    We start by properly covering how to configure a local development environment
    in Chapter 1. We''re using bleeding edge tools in this book: Django (2.0), Python
    (3.6), and Pipenv to manage our virtual environments. We also introduce the command
    line and discuss how to work with a modern text editor.

