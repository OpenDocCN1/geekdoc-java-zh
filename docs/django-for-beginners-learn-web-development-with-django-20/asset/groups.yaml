    Chapter 12: Email


    # Code


    ```

    <!-- templates/registration/password_reset_email.html -->

    {% load i18n %}{% escape %}

    {% trans "Hi" %} {{ user.get_username }},


    {% trans "We''ve received a request to reset your password. If you didn''t make
    this request, you can safely ignore this email. Otherwise, click the button below
    to reset your password." %}


    {% block reset_link %}

    {{ protocol }}:{{ domain }}{{ url ''password_reset_confirm'' token=token }}

    {% endblock %}

    ```


    This code might look scary so let''s break it down line-by-line. Up top we load
    the template tag i18n which means this text is eligible to be translated into
    multiple languages. Django has robust internationalization support though covering
    it is beyond the scope of this book.


    We''re greeting the user by name thanks to user.get_username. Then we use the
    built-in reset_link block to include the custom URL link. You can read more about
    Django''s password management approach in the official docs.


