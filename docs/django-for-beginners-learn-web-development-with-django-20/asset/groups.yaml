    \ 模型中的中的内容匹配。\n\n使用 `control+c` 停止本地服务器，然后运行我们的测试以确认一切都已通过。\n\n# 命令行\n\n```bash\n\
    (news) $ python manage.py test\n```\n\n## Bootstrap\n\n如果你以前从未用过 Bootstrap，那么你将有一场盛宴。它用极少的代码实现了许多功能。\n\
