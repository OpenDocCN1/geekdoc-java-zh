    \    author = models.ForeignKey(\n        'auth.User',\n        on_delete=models.CASCADE,\n\
    \    )\n    body = models.TextField()\n\n    def __str__(self):\n        return\
    \ self.title\n```\n\n在顶部，我们导入了 `models` 类，然后创建一个名为 `Post` 的子类。使用此子类功能，我们可以自动访问\
    \ `django.db.models.Models` 中的所有内容，并根据需要添加额外的字段和方法。\n\n对于 `title`，我们将长度限制为 200\
    \ 个字符；对于 `body`，我们使用 `TextField`，它会根据需要自动扩展以适应用户的文本。Django 提供了许多字段类型；你可以在此此处查看完整列表。\n\
    \n对于 `author`，我们使用 `ForeignKey`，它允许多对一关系。这意味着一个特定的用户可以是许多不同博客文章的作者，但反之则不然。引用的是\
    \ Django 内置的 `User` 模型，因为 Django 提供了身份验证功能。对于所有如 `ForeignKey` 的多对一关系，我们还必须指定 `on_delete`\
    \ 选项。\n\n## 第 5 章：博客应用\n\n现在我们的新数据库模型已经创建，我们需要为它创建一个新的迁移记录，并将更改迁移到数据库中。这个二步过程可以通过以下命令完成：\n\
    \n## 命令行\n\n```\n(blog) $ python manage.py makemigrations blog\n(blog) $ python\
    \ manage.py migrate blog\n```\n\n我们的数据库配置好了！下一步是什么？\n\n## 管理后台\n\n我们需要一种访问数据的方法。进入\
