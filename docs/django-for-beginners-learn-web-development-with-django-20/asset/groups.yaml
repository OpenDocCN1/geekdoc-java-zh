    \n# 删除视图\n\n创建删除博客表单的过程与更新文章的过程非常相似。我们将使用另一个通用视图 `DeleteView` 来帮助，并需要为该功能创建一个视图、URL\
    \ 和模板。\n\n让我们首先在我们的单个博客页面 `post_detail.html` 上添加一个删除博客的链接。\n\n# 代码\n\n```python\n\
