  mdcn: "\n\n## 第10 章：Bootstrap\n\n由于我们为两个新页面都创建了 URL、模板和视图，因此我们将为每个页面添加测试。Django\
    \ 的 `SimpleTestCase` 足够用于测试首页，但由于注册页面使用了数据库，因此我们仍然需要使用 `TestCase`。\n\n以下是你的 `pages/tests.py`\
    \ 文件中代码的写法。\n\n# 代码\n\n```python\n# pages/tests.py\nfrom django.contrib.auth import\
    \ get_user_model\nfrom django.test import SimpleTestCase, TestCase\nfrom django.urls\
    \ import reverse\n```\n\nclass HomePageTests(SimpleTestCase):\n\n```python\ndef\
    \ test_home_page_status_code(self):\n    response = self.client.get('/')\n   \
    \ self.assertEqual(response.status_code, 200)\n```\n\n```python\ndef test_view_url_by_name(self):\n\
    \    response = self.client.get(reverse('home'))\n    self.assertEqual(response.status_code,\
    \ 200)\n```\n\n```python\ndef test_view_uses_correct_template(self):\n    response\
    \ = self.client.get(reverse('home'))\n    self.assertEqual(response.status_code,\
    \ 200)\n    self.assertTemplateUsed(response, 'home.html')\n```\n\nclass SignupPageTests(TestCase):\n\
    \n```python\nusername = 'newuser'\nemail = 'newuser@email.com'\n```\n\n```python\n\
    def test_signup_page_status_code(self):\n    response = self.client.get('/users/signup/')\n\
    \    self.assertEqual(response.status_code, 200)\n```\n\n```python\ndef test_view_url_by_name(self):\n\
    \    response = self.client.get(reverse('signup'))\n    self.assertEqual(response.status_code,\
    \ 200)\n```\n\n```python\ndef test_view_uses_correct_template(self):\n    response\
    \ = self.client.get(reverse('signup'))\n    self.assertEqual(response.status_code,\
    \ 200)\n    self.assertTemplateUsed(response, 'signup.html')\n```\n\n```python\n\
    def test_signup_form(self):\n    new_user = get_user_model().objects.create_user(\n\
    \        self.username, self.email\n    )\n    self.assertEqual(get_user_model().objects.all().count(),\
    \ 1)\n    self.assertEqual(get_user_model().objects.all()[0].username, self.username)\n\
    \    self.assertEqual(get_user_model().objects.all()[0].email, self.email)\n```\n\
    \n在第一行中，我们使用 `get_user_model()` 来引用我们的自定义用户模型。对于这两个页面，我们都测试了三件事：\n\n- 页面存在并返回\
    \ HTTP 200 状态码\n- 视图中使用了正确的 URL 名称\n- 使用了正确的模板\n\n我们的注册页面还有一个表单，因此我们也应该测试一下它。在\
