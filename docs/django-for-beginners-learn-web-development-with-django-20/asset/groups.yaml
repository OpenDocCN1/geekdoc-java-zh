    # Conclusion


    Congratulations on finishing Django for Beginners! After starting from absolute
    zero we''ve now built five different web applications from scratch. And we''ve
    covered all the major features of Django: templates, views, urls, users, models,
    security, testing, and deployment. You now have the knowledge to go off and build
    your own modern websites with Django.


    As with any new skill, it''s important to practice and apply what you''ve just
    learned. The CRUD functionality in our Blog and Newspaper sites is common in many,
    many other web applications. For example, can you make a Todo List web application?
    You already have all the tools you need.


    Web development is a very deep field and there''s still much more to learn what
    Django has to offer. For an example more advanced Django project would likely
    use multiple settings files, environment variables, and PostgreSQL locally instead
    of SQLite. It might even use third-party packages like django-allauth for social
    authentication, django-debug-toolbar for debugging, and django-extensions for
    extra goodies.


    The best way to learn more about Django and web development in general is to think
    of a project you want to build and step-by-step what you need to complete it.
    An additional resource that may help is DjangoX, which is a real-world starter
    project that features social authentication and more.


    You can also sign up for the Django for Beginners newsletter for periodic updates
    on new content and discounts on future books.


    And a final resource is my own personal website, wvincent.com, which is regularly
    updated and features articles on some of these advanced techniques already:'
