    # # Chapter 9: User Authentication


    Now that we have a working custom user model we can add the functionality every
    website needs: the ability to signup, login, and logout users. Django provides
    everything we need for login and logout but we will need to create our own form
    to sign up new users. We''ll build a basic homepage with links to all three features
    so we don''t have to type in the URLs by hand every time.


    # ## Templates


    By default the Django template loader looks for templates in a nested structure
    within each app. So a home.html template in users would need to be located at
    users/templates/users/home.html. But a project-level templates folder approach
    is cleaner and scales better so that''s what we''ll use.


    Let''s create a new templates directory and within it a registration folder as
    that''s where Django will look for the login template.


    # ### Command Line


    ```

    (news) $ mkdir templates

    (news) $ mkdir templates/registration

    ```


    Now we need tell Django about this new directory by updating the configuration
    ''DIRS'' in settings.py. This is a one-line change.'
