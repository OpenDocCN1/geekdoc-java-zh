- md: "\n# Introduction\n\nprojects should use a custom user model and in this chapter\
    \ you'll learn how. **Chapter 9** covers user authentication, **Chapter 10** adds\
    \ Bootstrap for styling, and **Chapters 11-12** implement password reset and change\
    \ via email. In **Chapters 13-15** we add articles and comments to our project,\
    \ along with proper permissions and authorizations. We even learn some tricks\
    \ for customizing the admin to display our growing data.\n\nThe **Conclusion**\
    \ provides an overview of the major concepts introduced in the book and a list\
    \ of recommended resources for further learning.\n\nWhile you can pick and choose\
    \ chapters to read, the book's structure is very elaborate. Each app/chapter introduces\
    \ a new concept and reinforces past teachings. I **highly recommend** reading\
    \ it in order, even if you're eager to skip ahead. Later chapters won't cover\
    \ previous material in the same depth as earlier chapters.\n\nBy the end of this\
    \ book you'll have an understanding of how Django works, the ability to build\
    \ apps on your own, and the background needed to fully take advantage of additional\
    \ resources for learning intermediate and advanced Django techniques.\n\n# Book\
    \ layout\n\nThere are many code examples in this book, which are denoted as follows:\n\
    \n```python\n# This is Python code\nprint(\"Hello, World)\n```\n\nFor brevity\
    \ we will use dots . . . to denote existing code that remains unchanged, for example,\
    \ in a function we are updating.\n\n# Introduction\n\n# Code\n\n```python\ndef\
    \ make_my_website:\n  ...\n  print(\"All done!\")\n```\n\nWe will also use the\
    \ command line console frequently (starting in Chapter 1: Initial Setup) to execute\
    \ commands, which take the form of a $ prefix in traditional Unix style.\n\n#\
    \ Command Line\n\n```\n$ echo \"hello, world\"\n```\n\nThe result of this particular\
    \ command is the next line will state:\n\n# Command Line\n\n```\n\"hello, world\"\
    \n```\n\nWe will typically combine a command and its output. The command will\
    \ always be prefaced by a $ and the output will not. For example, the command\
    \ and result above will be represented as follows:\n\n# Command Line\n\n```\n\
    $ echo \"hello, world\"\nhello, world\n```\n\nComplete source code for all examples\
    \ can be found in the official Github repository.\n\n# Conclusion\n\nDjango is\
    \ an excellent choice for any developer who wants to build modern, robust web\
    \ applications with a minimal amount of code. It is popular, under active development,\
    \ and thoroughly battle-tested by the largest websites in the world. In the next\
    \ chapter we'll learn how to configure any computer for Django development.\n\n\
    # Chapter 1: Initial Setup\n\nThis chapter covers how to properly configure your\
    \ computer to work on Django projects. We start with an overview of the command\
    \ line and use it to install the latest versions of both Django (2.0) and Python\
    \ (3.6x). Then we discuss virtual environments, git, and working with a text editor.\n\
    \nBy the end of this chapter you'll be ready to create and modify new Django projects\
    \ in just a few keystrokes.\n\n# The Command Line\n\nThe command line is a powerful,\
    \ text-only view of your computer. As developers we will use it extensively throughout\
    \ this book to install and configure each Django project.\n\nOn a Mac, the command\
    \ line is found in a program called Terminal located at /Applications/Utilities.\
    \ To find it, open a new Finder window, open the Applications folder, scroll down\
    \ to the Utilities folder, and double-click the application called Terminal.\n\
    \nOn Windows, there is a built-in command line program but it is difficult to\
    \ use. I recommend instead using Babun, a free and open-source command line program.\
    \ On the Babun homepage click on the “Download now” button, double-click on the\
    \ downloaded file to install Babun, and upon completion drag the installer to\
    \ the Recycle Bin. To use Babun go to the Start menu, select Programs, and click\
    \ on Babun.\n\nGoing forward when the book refers to the “command line” it means\
    \ to open a new console on your computer using either Terminal or Babun.\n\nWhile\
    \ there are many possible commands we can use, in practice there are six used\
    \ most frequently in Django development.\n\n- cd (change down a directory)\n-\
    \ cd .. (change up a directory)\n- ls (list files in your current directory)\n\
    - pwd (print working directory)\n- mkdir (make directory)\n- touch (create a new\
    \ file)\n\nOpen your command line and try them. The $ dollar sign is our command\
    \ line prompt: all commands in this book are intended to be typed after the $\
    \ prompt.\n\nFor example, assuming you're on a Mac, let's change into our Desktop\
    \ directory.\n\n# Command Line\n\n```\n$ cd ~/Desktop\n```\n\nNote that our current\
    \ location ~/Desktop is automatically added before our command line prompt. To\
    \ confirm we're in the proper location we can use pwd which will print out the\
    \ path of our current directory.\n\n# Command Line\n\n```\n~/Desktop $ pwd\n/Users/wsv/desktop\n\
    ```\n\nOn our Mac computer this shows that I'm using the user wsv and on the desktop\
    \ for that account.\n\nLet's create a new directory folder with mkdir, cd into\
    \ it, and add a new file index.html.\n\n# Chapter 1: Initial Setup\n\n# Command\
    \ Line\n\n```\n~/Desktop $ mkdir new_folder\n~/Desktop $ cd new_folder\n~/Desktop/new_folder\
    \ $ touch index.html\n```\n\nNow use ls to list all current files in our directory.\
    \ You'll see there's just the newly created index.html.\n\n# Command Line\n\n\
    ```\n~/Desktop/new_folder $ ls\nindex.html\n```\n\nAs a final step return to the\
    \ Desktop directory with cd .. and use pwd to confirm the location.\n\n# Command\
    \ Line\n\n```\n~/Desktop/new_folder $ cd ..\n~/Desktop $ pwd\n/Users/wsv/desktop\n\
    ```\n\nAdvanced developers can use their keyboard and command line to navigate\
    \ through their computer with ease; with practice this approach is much faster\
    \ than using a mouse.\n\nIn this book I'll give you the exact instructions to\
    \ run—you don't need to be an expert on the command line—over time it's a good\
    \ skill for any professional software developer to develop. Two good resources\
    \ for further study are the Command Line Crash Course and CodeCademy's Course\
    \ on the Command Line.\n\nInstructions are included below for Mac, Windows, and\
    \ Linux computers.\n\n# Install Python 3 on Mac OS X\n\nAlthough Python 2 is installed\
    \ by default on Mac computers, Python 3 is not. You can confirm this by typing\
    \ `python --version` in the command line console and hitting Enter:\n\n# Command\
    \ Line\n\n```\n$ python --version\nPython 2.7.13\n```\n\nTo check if Python 3\
    \ is already installed try running the same command using `python3` instead of\
    \ python.\n\n# Command Line\n\n```\n$ python3 --version\n```\n\nIf your computer\
    \ outputs 3.6.x (any version of 3.6 or higher) then you're in good shape, however\
    \ most likely you'll see an error message since we need to install Python 3 directly.\n\
    \nOur first step is to install Apple's Xcode package, so run the following command\
    \ to install it:\n\n# Command Line\n\n```\n$ xcode-select --install\n```\n\nClick\
    \ through all the confirmation commands (Xcode is a large program so this this\
    \ might take a while to install depending on your internet connection).\n\nNext,\
    \ install the package manager Homebrew via the longterm command below:\n\n# Command\
    \ Line\n\n```\n$ /usr/bin/ruby -e \"$(curl -fsSL https://raw.githubusercontent.com/Homebrew/inst/all/master/install)\"\
    \n```\n\nTo confirm Homebrew installed correctly, run this command:\n\n# Command\
    \ Line\n\n```\n$ brew doctor\n```\n\nYour system is ready to brew.\n\nAnd now\
    \ to install the latest version of Python, run the following command:\n\n# Command\
    \ Line\n\n```\n$ brew install python3\n```\n\nNow let's confirm which version\
    \ was installed:\n\nChapter 1: Initial Setup\n\n# Command Line\n\n```\n$ python3\
    \ --version\nPython 3.6.4\n```\n\nTo open a Python 3 interactive shell--lets us\
    \ run Python commands directly on our computer--simple type python3 from the command\
    \ line:\n\n# Command Line\n\n```\n$ python3\nPython 3.6.4 (default, Jan 7 2018,\
    \ 13:05:00)\n[GCC 4.2.1 Compatible Apple LLVM 9.0.0 (clang-900.0.39.2]) on darwin\n\
    Type \"help\", \"copyright\", \"credits\" or \"license\" for more information.\n\
    >>>\n```\n\nTo exit the Python 3 interactive shell at any time type Control-d\
    \ (the \"Control\" and \"d\" key at the same time).\n\nYou can still run Python\
    \ shells with Python 2 by simply typing python:\n\n# Command Line\n\n```\n$ python\n\
    Python 2.7.13 (default, Dec 18 2016, 07:03:39)\n[GCC 4.2.1 Compatible Apple LLVM\
    \ 8.0.0 (clang-800.0.42.1]) on darwin\nType \"help\", \"copyright\", \"credits\"\
    \ or \"license\" for more information.\n```\n\n# Install Python 3 on Windows\n\
    \nPython is not included by default on Windows, however we can check if any version\
    \ exists on the system. Open a command line console by entering command on the\
    \ Start\n"
  mdcn: "\n\n# 引言\n\n项目应该使用自定义用户模型，在本章中，你将学习如何做到。**第 9 章**涵盖了用户身份验证，**第 10 章**添加了用于样化的\
    \ Bootstrap，**第 11-12 章**实现了通过电子邮件重置和更改密码的功能。在**第 13-15 章**中，我们为项目添加了文章和评论，以及适当的权限控制和授权。我们甚至学习了一些自定义管理员管理后台的技巧，以显示我们不断增长的数据。\n\
    \n**结论**部分提供了书中介绍的各个概念的概述，并列出了进一步学习的推荐资源列表。\n\n虽然你可以根据需要选择章节进行阅读，但这本书的结构非常严谨。每个应用/章节都引入了一个新概念并强化了之前的教程。我**强烈建议**按顺序阅读，即使你急于跳到后面的章节。后面的章节对之前内容的覆盖深度将不如前面的章节那样深。\n\
    \n读完本书后，你将理解 Django 的工作原理，具备自己构建应用的能力，并拥有利用额外资源学习中级和高级 Django 技术所需的背景知识。\n\n#\
