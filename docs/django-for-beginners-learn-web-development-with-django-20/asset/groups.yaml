    \n![](img/593a0176e3a13ba5207237714df32537_180_0.png)\n\n# Django blog\n\n+ New\
    \ Blog Post\n\nYou are not logged in.\n\nlogin\n\n# Heroku site\n\n# Conclusion\n\
    \nWith a minimal amount of code, the Django framework has allowed us to create\
    \ a login, logout, and signup user authentication flow. Under-the-hood it has\
    \ taken care of the many security gotchas that can crop up if you try to create\
    \ your own user authentication flow from scratch.\n\n# Chapter 8: Custom User\
    \ Model\n\nDjango's built-in User model allows us to start working with users\
    \ right away, as we just did adding our Blog app in the previous chapters. However\
    \ the official Django documentation recommends using a custom user model for new\
    \ projects. The reason is that if you want to make any changes to the User model\
    \ down the road—for example adding an age field—using a custom user model from\
    \ the beginning makes this quite easy. But if you do not create a custom user\
    \ model, updating the default User model in an existing Django project is very,\
    \ very challenging.\n\nSo always use a custom user model for all new Django projects.\
    \ However the official documentation example is not actually what many Django\
    \ experts recommend. It uses the quite complex AbstractBaseUser when we use AbstractUser\
    \ things are far simpler and still customizable. This is the approach we will\
    \ take in this chapter where we start a new Newspaper app properly with a custom\
    \ user model. The choice of a newspaper app pays homage to Django's roots as a\
    \ web framework built for editors and journalists at the Lawrence Journal-World.\n\
    \n# Setup\n\nThe first step is to create a new Django project from the command\
    \ line. We need to do several things:\n\n- create and navigate into a new directory\
    \ for our code\n- create a new virtual environment\n- install Django\n- make a\
    \ new Django project newspaper_project\n\n# Chapter 8: Custom User Model\n\n-\
    \ create and navigate into a new directory for our code\n- create a new virtual\
    \ environment\n- install Django\n- make a new Django project newspaper_project\n\
    \nWe're calling our app users for managing users here but you'll also see it called\
    \ frequently in source code. The actual name doesn't matter as long as you are\
    \ consistent when referring to it throughout the project. Here are the commands\
    \ to run:\n\n# Command Line\n\n```\n$ cd ~/Desktop\n$ mkdir news\n$ pipenv install\
    \ django\n$ pipenv shell\n(news) $ django-admin startproject newspaper_project\n\
    (news) $ python manage.py startapp users\n(news) $ python manage.py runserver\n\
    ```\n\nNote that we did not migrate to configure our database. It's important\
    \ to wait until we've created our custom user model before doing so given how\
    \ tightly connected the user model is to the rest of Django. If you navigate to\
    \ http://127.0.0.1:8000 you'll see the familiar welcome screen.\n\n# Custom User\
    \ Model\n\nCreating our custom user model requires four steps:\n\n- update settings.py\n\
    - create a new CustomUser model\n- create new forms for UserCreation and UserChange\n\
    - update the admin\n\nIn settings.py we'll add the users app to our INSTALLED_APPS.\
    \ Then at the bottom of the file use AUTH_USER_MODEL to tell Django to use our\
    \ new custom user model in place of the built-in User model. We'll call our custom\
    \ user model CustomUser since it exists within our users app we refer to as users.CustomUser.\n\
    \n# Code\n\n```python\n# newspaper_project/settings.py\nINSTALLED_APPS = [\n \
    \   'django.contrib.admin',\n    'django.contrib.auth',\n    'django.contrib.contenttypes',\n\
    \    'django.contrib.sessions',\n    'django.contrib.messages',\n    'django.contrib.staticfiles',\n\
    \    'users',\n]\nAUTH_USER_MODEL = 'users.CustomUser'\n```\n\nNow update users/models.py\
    \ with a New User model which we'll call CustomUser. We'll also add our extra\
    \ field for \"age\". We can use Django's PositiveIntegerField which means the\
    \ integer must be positive or zero.\n\n# Code\n\n```python\n# users/models.py\n\
    from django.contrib.models import AbstractUser\nfrom django.db import models\n\
    \nclass CustomUser(AbstractUser):\n    age = models.PositiveIntegerField(default=0)\n\
    ```\n\nThat's really the code we need! Since we're extending AbstractUser CustomUser\
    \ is basically a copy of the default User model. The only update is our new age\
    \ field.\n\n# Forms\n\nIf we step back for a moment, what are the two ways in\
    \ which we would interact with our new CustomUser model? One case is when a user\
    \ signs up for a new account on our website. The other is within the admin app\
    \ which allows us, as superusers, to modify existing users. So we will need to\
    \ update the two built-in forms for this functionality: UserCreationForm and UserChangeForm.\n\
    \nStop the local server with Ctrl+c and create a new file in the users app called\
    \ forms.py.\n\n# Command Line\n\n```\n(news) $ touch users/forms.py\n```\n\nWe'll\
    \ update it with the following code to extend the existing UserCreationForm and\
    \ UserChangeForm forms.\n\n# Code\n\n```python\n# users/forms.py\n\nfrom django\
    \ import forms\nfrom django.contrib.auth.forms import UserCreationForm, UserChangeForm\n\
    from .models import CustomUser\n\nclass CustomUserCreationForm(UserCreationForm):\n\
    \    class Meta(UserCreationForm.Meta):\n        model = CustomUser\n        fields\
    \ = UserCreationForm.Meta.fields\n\nclass CustomUserChangeForm(UserChangeForm):\n\
    \    class Meta:\n        model = CustomUser\n        fields = UserChangeForm.Meta.fields\n\
    ```\n\nFor both we are setting the model to our CustomUser and using the default\
    \ fields by using Meta.fields.\n\nThe concept of fields on a form can be confusing\
    \ at first so let's take a moment to explore it further. Our CustomUser model\
    \ contains all the fields of the default User model and our additional age field\
    \ which we set. But what are these default fields? It turns out there are many\
    \ including username, first_name, last_name, email, password, groups, and more.\
    \ Yet when a user signs up for a new account on Django the default form only asks\
    \ for a username, email, and password. This tells us that the default setting\
    \ for fields on UserCreationForm is just username, email, and password even though\
    \ there are many more fields available.\n\nThis might not click for you since\
    \ understanding forms and models properly takes time. In the next chapter we will\
    \ create our own signup, login, and logout pages which tie together our CustomUser\
    \ model and forms more clearly. So hang tight!\n\nThe final step is to update\
    \ admin.py file since Admin is tightly coupled to the default User model. We will\
    \ extend the existing UserAdmin class to use our new CustomUser model and our\
    \ two new forms.\n\n```python\n# users/admin.py\nfrom django.contrib import admin\n\
    from django.contrib.auth.admin import UserAdmin\nfrom forms import CustomUserCreationForm,\
    \ CustomUserChangeForm\nfrom models import CustomUser\n\nclass CustomUserAdmin(UserAdmin):\n\
    \    add_form = CustomUserCreationForm\n    form = CustomUserChangeForm\n    list_display\
    \ = ['email', 'username', 'age']\n    model = CustomUser\n\nadmin.site.register(CustomUser,\
    \ CustomUserAdmin)\n```\n\nNote that our CustomUserAdmin also has a list_display\
    \ setting so that it only displays the email, username, and age fields even though\
    \ there are in fact many more on the CustomUser model at this point.\n\nOk we're\
    \ done! Go ahead and run makigrations and migrate for the first time to create\
    \ a new database that uses the custom user model.\n\n# Command Line\n\n```\n(news)\
    \ $ python manage.py makigrations\n(news) $ python manage.py migrate\n```\n\n\
    # Superuser\n\nLet's create a superuser account to confirm that everything is\
    \ working as expected. On the command line type the following command and go through\
    \ the prompts.\n\n# Command Line\n\n```\n(news) $ python manage.py createsuperuser\n\
    ```\n\nThe fact that this works is the first proof our custom user model works\
    \ as expected. Let's view things in the admin too to be extra sure.\n\nStart up\
    \ the web server.\n\n# Command Line\n\n```\n(news) $ python manage.py runserver\n\
    ```\n"
