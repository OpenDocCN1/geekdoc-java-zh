    # Chapter 10: Bootstrap


    Web development requires a lot of skills. Not only do you have to program the
    website to work correctly, users expect it to look good, too. When you''re creating
    everything from scratch, it can be overwhelming to also add all the necessary
    HTML/CSS for a beautiful site.


    Fortunately there''s Bootstrap, the most popular framework for building responsive,
    mobile-first projects. Rather than write all our own CSS and JavaScript for common
    website layout features, we can instead rely on Bootstrap to do the heavy lifting.
    This means with only a small amount of code on what we can quickly have great
    looking websites. And if we want to make custom changes as a project progresses,
    it''s easy to override Bootstrap where needed, too.


    When you want to focus on the functionality of a project and not the design, Bootstrap
    is a great choice. That''s why we''ll use it here.


    # Pages app


    In the previous chapter we displayed our homepage by including view logic in our
    urls.py file. While this approach works, it feels somewhat hackish to me and it
    certainly doesn''t scale as a website grows over time. It is also somewhat confusing
    to Django newcomers. Instead we can and create a dedicated pages app for all our
    django pages. This will keep our code nice and organized going forward.


    On the command line use the startapp command to create our new pages app. If the
    server is still running you may need to type Control+c first to quit it.'
