    # Code


    ```

    <!-- templates/home.html -->

    {% extends ''base.html'' %}


    {% block content %}

    {% for post in object_list %}

    <div class="post-entry">

    <h2><a href="{% url post_detail post.pk %}">{{ post.title }}</a></h2>

    <p>{{ post.body }}</p>

    </div>

    {% endfor %}

    {% endblock content %}",

    ```


    We start off by telling our Django template we want to reference a URLConf by
    using the code {% url ... %}. Which URL? The one named post_detail, which is the
    name we get BlogDetailView in our URLConf just moment ago. If we look at post_detail
    in our URLConf, we see that it expects to be passed an argument pk representing
    the primary key for the blog post. Fortunately, Django has already created and
    included this pk field on our post object. We pass it into the URLConf by adding
    it in the template as post.pk.


    To confirm everything works, refresh the main page at http://127.0.0.1:8000/ and
    click on the title of each blog post to confirm the new links works.


    # Tests


    We need to test our model and views now. We want to ensure that the Post model
    works as expected, including its str representation. And we want to test both
    ListView and DetailView.'
