    \ User 模型进行任何更改（例如添加一个年龄字段），从一开始就使用自定义用户模型会让这变得非常简单。但如果你没有自定义用户模型，在现有的 Django\
    \ 项目中更新默认的 User 模型将是非常挑战性的。\n\n因此，请对所有新的 Django 项目始终使用自定义用户模型。不过，官方文档的示例并不是许多\
    \ Django 专家推荐的。它使用了相当复杂的 `AbstractBaseUser`，而当我们使用 `AbstractUser` 时情况要简单得多且仍然可以自定义。这就是我们在本章将采取的方法，我们将通过自定义用户模型正确地启动一个新的\
    \ Newspaper 应用。选择报纸应用是为了致敬 Django 的根源——它是为 Lawrence Journal-World 的编辑和记者构建的 Web\
    \ 框架。\n\n# 设置\n\n第一步是从命令行创建一个新的 Django 项目。我们需要执行以下几件事：\n\n- 创建并进入一个用于代码的新目录\n\
    - 创建一个新的虚拟环境\n- 安装 Django\n- 创建名为 `newspaper_project` 的新 Django 项目\n\n# 第 8 章：自定义用户模型\n\
    \n- 创建并进入一个用于代码的新目录\n- 创建一个新的虚拟环境\n- 安装 Django\n- 创建名为 `newspaper_project` 的新\
    \ Django 项目\n\n我们在这里将应用命名为 `users` 以管理用户，但你也会经常在源代码中看到它。实际名称并不重要，只要你在整个项目中引用它时保持一致即可。以下是运行的命令：\n\
    \n# 命令行\n\n```\n$ cd ~/Desktop\n$ mkdir news\n$ pipenv install django\n$ pipenv\
    \ shell\n(news) $ django-admin startproject newspaper_project\n(news) $ python\
    \ manage.py startapp users\n(news) $ python manage.py runserver\n```\n\n注意我们还没有还没有迁移来配置数据库。鉴于用户模型与\
    \ Django 其他部分的连接非常紧密，在创建自定义用户模型之前执行迁移是非常重要的。如果你导航到 http://127.0.0.1:8000，你会看到熟悉的欢迎界面。\n\
    \n# 自定义用户模型\n\n创建我们的自定义用户模型需要四个步骤：\n\n- 更新 `settings.py`\n- 创建一个新的 `CustomUser`\
    \ 模型\n- 为 UserCreation 和 UserChange 创建新表\n- 更新 admin\n\n在 `settings.py` 中，我们将\
    \ `users` 应用添加到 `INSTALLED_APPS` 中。然后在文件末尾使用 `AUTH_USER_MODEL` 告诉 Django 使用我们新的自定义用户模型代替内置的\
    \ User 模型。我们将自定义用户模型命名为 `CustomUser`，由于存在于 `users` 应用中，我们将其引用为 `users.CustomUser`。\n\
    \n# 代码\n\n```python\n# newspaper_project/settings.py\nINSTALLED_APPS = [\n   \
    \ 'django.contrib.admin',\n    'django.contrib.auth',\n    'django.contrib.contenttypes',\n\
    \    'django.contrib.sessions',\n    'django.contrib.messages',\n    'django.contrib.staticfiles',\n\
    \    'users',\n]\nAUTH_USER_MODEL = 'users.CustomUser'\n```\n\n现在更新 `users/models.py`\
    \ 以包含一个名为 `CustomUser` 的新用户模型。我们还添加了额外的“年龄”（age）字段。我们可以使用 Django 的 `PositiveIntegerField`，这意味着该整数必须大于或等于零。\n\
    \n# 代码\n\n```python\n# users/models.py\nfrom django.contrib.models import AbstractUser\n\
    from django.db import models\n\nclass CustomUser(AbstractUser):\n    age = models.PositiveIntegerField(default=0)\n\
    ```\n\n这就是我们需要的全部代码！由于我们扩展了 `AbstractUser`，`CustomUser` 基本上是默认 User 模型的拷贝。唯一的更新是我们新定义的\
    \ `age` 字段。\n\n# 表单\n\n如果我们稍退一步，我们会有哪两种方式与新的 `CustomUser` 模型交互？一种是用户在我们的网站注册新账户。另一种是在\
    \ admin 应用中，允许我们作为超级管理员修改现有用户。因此，我们需要为此功能更新两个内置表单：`UserCreationForm` 和 `UserChangeForm`。\n\
    \n使用 Ctrl+c 停止本地服务器，并在 `users` 应用中创建一个名为 `forms.py` 的新文件。\n\n# 命令行\n\n```\n(news)\
    \ $ touch users/forms.py\n```\n\n我们将使用以下代码更新它，以扩展现有的 `UserCreationForm` 和 `UserChangeForm`\
    \ 表单。\n\n# 代码\n\n```python\n# users/forms.py\n\nfrom django import forms\nfrom\
    \ django.contrib.auth.forms import UserCreationForm, UserChangeForm\nfrom .models\
    \ import CustomUser\n\nclass CustomUserCreationForm(UserCreationForm):\n    class\
    \ Meta(UserCreationForm.Meta):\n        model = CustomUser\n        fields = UserCreationForm.Meta.fields\n\
    \nclass CustomUserChangeForm(UserChangeForm):\n    class Meta:\n        model\
    \ = CustomUser\n        fields = UserChangeForm.Meta.fields\n```\n\n对于两者，我们都将模型设置为\
    \ `CustomUser`，并使用 `Meta.fields`。\n\n对于 `CustomUser` 模型，设置 `Meta.fields` 是为了让它显示默认\
    \ User 模型的字段。这对于字段设置初学者可能让你感到很困惑，但让我们花时间深入了解一下。我们的 `CustomUser` 模型包含了用户名、密码和年龄字段，尽管实际上还有许多其他字段。\n\
    \n这可能一开始让你感到很困惑，因为正确理解表单和模型需要时间。在接下来的章节中，我们将创建自己的注册、登录和注销页面，将 `CustomUser` 模型连接起来。所以请稍等！\n\
    \n最后一步是更新 `admin.py` 文件，因为 admin 与默认 User 模型是紧耦合的。我们将扩展现有的 `UserAdmin` 类以使用我们新的\
    \ `CustomUser` 模型和两个新表单。\n\n```python\n# users/admin.py\nfrom django.contrib import\
    \ admin\nfrom django.contrib.auth.admin import UserAdmin\nfrom forms import CustomUserCreationForm,\
    \ CustomUserChangeForm\nfrom models import CustomUser\n\nclass CustomUserAdmin(UserAdmin):\n\
    \    add_form = CustomUserCreationForm\n    form = CustomUserChangeForm\n    list_display\
    \ = ['email', 'username', 'age']\n    model = CustomUser\n\nadmin.site.register(CustomUser,\
    \ CustomUserAdmin)\n```\n\n注意我们的 `CustomUserAdmin` 还有一个 `list_display` 设置，以便它只显示电子邮件、用户名和年龄字段，尽管在此时实际上还有许多其他字段。\n\
    \n好了，我们完成了！请第一次运行 `makigrations` 和 `migrate` 来创建一个使用自定义用户模型的数据库。\n\n# 命令行\n\n\
    ```\n(news) $ python manage.py makigrations\n(news) $ python manage.py migrate\n\
    ```\n\n"
