    \n- Django Documentation Topics, references & how-to\n- Get started with Django\
    \ Community, get help, or contribute\n\n## Create a database model\n\nOur first\
    \ task is to create a database model where we can store and display posts from\
    \ our users. Django will turn this model into a database table for us. In real-world\
    \ Django projects it's often the case that there will be many complex interconnected\
    \ models in our simple message board app we need only one. I won't cover database\
    \ design in this book but I have written a short guide which you can find here\
    \ if this is all new to you.\n\nOpen `posts/models.py` file and look at the default\
    \ code Django provides:\n\n## Code\n\n```python\n# posts/models.py\nfrom django.db\
    \ import models\n```\n\n## Create your models here\n\nDjango imports a `models`\
    \ module to help us build new database models which will model the characteristics\
    \ of the data in our database. We want to create a model to store the textual\
    \ content of a message board post which we can do so as follows:\n\n## Code\n\n\
    ```python\n# posts/models.py\nfrom django.db import models\n\nclass Post(models.Model):\n\
    \    text = models.TextField()\n```\n\nNote that we've created a new database\
    \ called `Post` which has the database field `text`. We've also specified the\
    \ type of content it will hold `TextField()`. Django provides many model fields\
    \ supporting common types of content such as characters, dates, integers, emails\
    \ and so on.\n\n## Activating models\n\nNow that our new model is created we need\
    \ to activate it. Going forward whenever we create or modify an existing model\
    \ we'll need to update Django in a two-step process:\n\n1. We create a migration\
    \ file with the `makemigrations` command which generates the SQL commands for\
    \ installed apps in our `INSTALLED_APPS` setting. Migration files do not execute\
    \ those commands on our database rather they are a reference of all changes to\
    \ our models. This approach means that we have a record of the changes to our\
