    \ means with only a small amount of code on what we can quickly have great looking\
    \ websites. And if we want to make custom changes as a project progresses, it's\
    \ easy to override Bootstrap where needed, too.\n\nWhen you want to focus on the\
    \ functionality of a project and not the design, Bootstrap is a great choice.\
    \ That's why we'll use it here.\n\n# Pages app\n\nIn the previous chapter we displayed\
    \ our homepage by including view logic in our urls.py file. While this approach\
    \ works, it feels somewhat hackish to me and it certainly doesn't scale as a website\
