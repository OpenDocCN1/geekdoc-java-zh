    \ class-based ListView.\n\nIn the posts/views.py file enter the Python code below:\n\
    \n### Code\n\n```python\n# posts/views.py\n\nfrom django.views.generic import\
    \ ListView\nfrom .models import Post\n\nclass HomePageView(ListView):\n    model\
    \ = Post\n    template_name = 'home.html'\n```\n\nIn the first line we are importing\
    \ ListView and in the second line we need to explicitly define which model we\
    \ are using. In the view, we subclass ListView, specify our model name and specify\
    \ our template reference. Internally ListView returns an object called object_list\
    \ that we want to display in our template.\n\nOur view is complete which means\
    \ we still need to configure our URLs and make our template. Let's start with\
    \ the template. Create a project-level directory called templates and a home.html\
    \ template file.\n\n### Command Line\n\n- $ mkdir templates\n- $ touch templates/home.html\n\
    \nThen update the DIRS field in our settings.py file so that Django knows to look\
    \ in this templates folder.\n\n### Code\n\n```python\n# settings.py\nTEMPLATES\
    \ = [\n    {\n        ...\n        'DIRS': [os.path.join(BASE_DIR, 'templates')],\n\
    \        ...\n    }\n]\n```\n\nIn our templates file home.html we can use the\
