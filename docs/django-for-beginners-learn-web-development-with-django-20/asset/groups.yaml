    \ 'commit' did not match any file(s) known to git`，这似乎与使用单引号 `''` 而不是双引号 `\"\"\
    ` 有关。如果你看到此错误，今后所有的提交信息请使用双引号。\n\n## Bitbucket\n\n为每个项目为代码创建一个远程仓库是一个好习惯。这样一旦你的电脑发生任何故障，你都有一个备份；更重要的是，它允许与其他软件人员协作。两个最流行的选择是\
    \ Bitbucket 和 Github。\n\n在本书中我们将使用 Bitbucket，因为它提供**免费的**私有仓库。Github 会收取费用。公共仓库互联网上的任何都可以都可以使用；私有仓库则不然。当你学习\
    \ Web 开发时，最好坚持使用私有仓库，这样你就不会无意中将密码等关键信息发布到网上。\n\n要在 Bitbucket 上开始操作，请注册一个免费账户。通过电子邮件确认账户后，你将被重定向到\
