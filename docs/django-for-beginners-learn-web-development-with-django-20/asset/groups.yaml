    \ soon find that most tests that you write are actually quite repetitive.\n\n\
    Time for our second test. The first test was on the model but now we want to test\
    \ our one and only page: the homepage. Specifically, we want to test that it exists\
    \ (throws an HTTP 200 response), uses the home view, and uses the home.html template.\n\
    \nWe'll need to add one more import at the top for reverse and a brand new class\
    \ HomePageViewTest for our test.\n\n## Chapter 4: Message Board app\n\n## Code\n\
    \n```\nfrom django.test import TestCase\nfrom django.urls import reverse\nfrom\
    \ .models import Post\n```\n\n```\nclass PostModelTest(TestCase):\n\n    def setUp(self):\n\
    \        Post.objects.create(text='just a test')\n\n    def test_text_content(self):\n\
    \        post=Post.objects.get(id=1)\n        expected_object_name = f'{post.text}'\n\
    \        self.assertEqual(expected_object_name, 'just a test')\n```\n\n```\nclass\
    \ HomePageViewTest(TestCase):\n\n    def setUp(self):\n        Post.objects.create(text='this\
    \ is another test')\n\n    def test_view_url_exists_at_proper_location(self):\n\
    \        resp = self.client.get('/')\n        self.assertEqual(resp.status_code,\
    \ 200)\n\n    def test_view_url_by_name(self):\n        resp = self.client.get(reverse('home'))\n\
    \        self.assertEqual(resp.status_code, 200)\n```\n\n```\ndef test_view_uses_correct_template(self):\n\
    \    resp = self.client.get(reverse('home'))\n    self.assertEqual(resp.status_code,\
    \ 200)\n    self.assertTemplateUsed(resp, 'home.html')\n```\n\nIf you run our\
    \ tests again you should see that they pass.\n\n## Command Line\n\n```\n(mb) $\
    \ python manage.py test\nCreating test database for alias 'default'...\nSystem\
    \ check identified no issues (0 silenced).\n.\n--------------------------------------------------------------------------------\n\
    Ran 4 tests in 0.036s\n\nOK\nDestroying test database for alias 'default'...\n\
    ```\n\nWhy does it say four tests? Remember that our setUp methods are not actually\
    \ tests, they let us run subsequent tests. Our four actual tests are test_view_content,\
    \ test_view_url_exists_at_proper_location, test_view_url_by_name, and test_view_uses_correct_template.\n\
    \nAny function that has the word test* at the beginning and exists in a tests.py\
