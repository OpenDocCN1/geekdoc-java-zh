    (blog) $ touch Procfile\n```\n\n在编辑器中向 `Procfile` 添加以下行。这告诉 Heroku 使用 gunicorn\
    \ 而不是适用于生产的本地服务器。\n\n## 代码\n\n```\nweb: gunicorn blog_project.wsgi\n```\n\n现在安装\
    \ gunicorn。\n\n## 命令行\n\n```bash\n(blog) $ pipenv install gunicorn\n```\n\n最后更新\
    \ `ALLOWED_HOSTS` 以接受所有域名，星号 `*` 表示。\n\n## 代码\n\n```python\n# blog_project/settings.py\n\
    ALLOWED_HOSTS = ['*']\n```\n\n我们可以提交新更改并将它们推送到 Bitbucket。\n\n## 命令行\n\n```bash\n\
    (blog) $ git status\n(blog) $ git add -A\n(blog) $ git commit -m 'Heroku config'\n\
    (blog) $ git push -u master\n```\n\n## Heroku 部署\n\n部署到 Heroku 之前先确认你已登录 Heroku\
    \ 账户。\n\n## 命令行\n\n```bash\n(blog) $ heroku login\n```\n\n然后运行 `create` 命令，告诉\
    \ Heroku 为我们的应用创建一个容器。如果你只运行 `heroku create`，Heroku 会给你分配一个随机名称，但你可以指定自定义名称，它在\
    \ Heroku 上必须是唯一的。换句话说，既然我选择了 `df-blog`，你就不能选。\n\n## 命令行\n\n```bash\n(blog) $ heroku\
    \ create df-blog\n```\n\n现在配置 git，当你推送到 Heroku 时，它会去你的新应用名称（将 `df-blog` 替换为你的自定义名称）。\n\
    \n## 命令行\n\n```bash\n(blog) $ heroku git:remote -a df-blog\n```\n\n有了静态文件（在我们的案例中是\
    \ CSS），还需要一步。Django 不支持在生产环境中提供静态文件，但 WhiteNoise 支持。所以让我们安装它吧。\n\n## 命令行\n\n```bash\n\
    (blog) $ pipenv install whitenoise\n```\n\n然后我们需要更新静态设置以便在生产环境中使用。在编辑器中打开 `settings.py`。将\
