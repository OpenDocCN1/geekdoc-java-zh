    \ Line\n\n```\n(helloworld) $ tree\n| helloworld_project\n| |-- __init__.py\n\
    | |-- settings.py\n| |-- urls.py\n| |-- wsgi.py\n└── manage.py\n```\n\n1 directory,\
    \ 5 files\n\nThe settings.py file controls our project's settings, urls.py tells\
    \ Django which pages to build in response to a browser or url request, and wsgi.py,\
    \ which stands for web server gateway interface, helps Django serve our eventual\
    \ web pages. The last file manage.py is used to execute various Django commands\
    \ such as running the local web server or creating a new app.\n\nDjango comes\
    \ with a built-in web server for local development purposes. We can start it with\
    \ the runserver command.\n\n### Command Line\n\n```\n(helloworld) $ python manage.py\
    \ runserver\n```\n\nIf you visit http://127.0.0.1:8000/ you should see the following\
    \ image:\n\n## Chapter 2: Hello World\n\n![](img/593a0176e3a13ba5207237714df32537_29_0.png)\n\
    \n## django\n\nView release notes for Django 2.0\n\n![](img/593a0176e3a13ba5207237714df32537_29_1.png)\n\
    \n## The install worked successfully! Congratulations!\n\nYou are seeing this\
    \ page because DEBUG=True is in your settings file and you have not configured\
    \ any URLs.\n\n- Django Documentation (Topics, references, & how-to)\n- Tutorial:\
    \ A Polling App (Get started with Django)\n- Django Community (Connect, get help,\
    \ or contribute)\n\n## Django welcome page\n\n## Create an app\n\nDjango uses\
    \ the concept of projects and apps to keep code clean and readable. A single Django\
    \ project contains one or more apps within it that all work together to power\
    \ a web application. This is why the command for a new Django project is startproject!\
    \ For example, a real-world Django e-commerce site might have one app for user\
    \ authentication, another app for payments, and a third app to power item listing\
    \ details. Each focuses on an isolated piece of functionality.\n\n## Chapter 2:\
    \ Hello World\n\nWe need to create our first app which we'll call pages. From\
    \ the command line, quit the server with Control+c. Then use the startapp command.\n\
    \n### Command Line\n\n```\nhelloworld $ python manage.py startapp pages\n```\n\
    \nIf you look again inside the directory with the tree command you'll see Django\
    \ has created a pages directory with the following files:\n\n### Command Line\n\
    \n```\npages\n|-- __init__.py\n|-- admin.py\n|-- apps.py\n|-- migrations\n|  \
    \ |-- __init__.py\n|-- models.py\n|-- tests.py\n|-- views.py\n```\n\nLet's review\
    \ what each new pages file does:\n\n- admin.py is a configuration file for the\
    \ built-in Django Admin app\n- apps.py is a configuration file for the app itself\n\
    - migrations/ keeps track of any changes to our models.py file so our database\
    \ and models.py stay in sync\n- models.py is where we define our database models,\
    \ which Django automatically translates into database tables\n- tests.py is for\
    \ our app-specific tests\n- views.py is where we handle the request/response logic\
    \ for our web app\n\nEven though our new app exists within the Django project,\
    \ Django doesn’t “know” about it until we explicitly add it. In your text editor\
    \ open the settings.py file and scroll down to INSTALLED_APPS where you'll see\
    \ built-in Django apps already.\n\n```python\nINSTALLED_APPS = [\n    'django.contrib.admin',\n\
    \    'django.contrib.auth',\n    'django.contrib.contenttypes',\n    'django.contrib.sessions',\n\
    \    'django.contrib.messages',\n    'django.contrib.staticfiles',\n    'pages',\n\
    ]\n```\n\n## Views and URLConfigs\n\nIn Django, Views determine what content is\
    \ displayed. Let’s start by updating views.py file to look as follows:\n\n```python\n\
    # pages/views.py\nfrom django.http import HttpResponse\n\ndef homeView(request):\n\
    \    return HttpResponse('Hello, World!')\n```\n\nBasically we're saying whenever\
    \ the function homeView is called, return the string Hello, World!. Now we need\
    \ to configure urls. Within the pages app, create a new urls.py file.\n\n### Command\
    \ Line\n\n```\n(helloworld) $ touch pages/urls.py\n```\n\nThen update it with\
    \ the following code:\n\n```python\n# pages/urls.py\nfrom django.urls import path\n\
    from . import views\n\nurlpatterns = [\n    path('', views.homeView, name='home')\n\
    ]\n```\n\nOn the top line we import path from Django to power our urlpattern and\
    \ on the line we import our views. The period used here from . import views means\
    \ reference the current directory, which is our pages app. Our urlpattern has\
    \ three parts:\n\n- a Python regular expression for the empty string ''\n- specify\
    \ the view which is called homeView\n- add an optional url name of 'home'\n\n\
    In other words, if the user requests the homepage, represented by the empty string\
    \ '' then we use the view. We're almost done. The last step is to configure our\
    \ project-level urls.py file too. Remember that it's common to have multiple apps\
    \ within a single Django project, so they each need their own route. Update the\
    \ helloworld_project/urls.py file as follows:\n\n```python\n# helloworld_project/urls.py\n\
    from django.contrib import admin\nfrom django.urls import path, include\n\nurlpatterns\
    \ = [\n    path('admin/', admin.site.urls),\n    path('', include('pages.urls')),\n\
    ]\n```\n\nWe've imported include on the second line next to path and then created\
    \ a new urpattern for our pages app. Now whenever a user visits the homepage at\
    \ / they will first be routed to the pages app and then to the homeViewView.\n\
    \nIt's often confusing to beginners that we don't need to import the pages app\
    \ here, yet we refer to it in our urlpattern as pages.urls. The reason we do it\
    \ this way is that the method django.urls.include() expects us to pass in a module,\
    \ app, or as the first argument. Without using include we would need to import\
    \ our pages app, but since we use include we don't have to at the project level!\n\
    \n# Hello, world!\n\nWe have all the code we need now! To confirm everything works\
    \ as expected, restart our Django server:\n"
  mdcn: "\n\n## 第 2 章：Hello World 应用\n\n在本章中，我们将构建一个 Django 项目，该项目会在主页上简单地显示“Hello,\
