    you are consistent when referring to it throughout the project.


    Here are the commands to run:


    # Command Line


    ```

    $ cd ~/Desktop

    $ mkdir news

    $ cd news

    $ pipenv install django

    $ pipenv shell

    (news) $ django-admin startproject newspaper_project .

    (news) $ python manage.py startapp users

    (news) $ python manage.py runserver

    ```


    Note that we did not migrate to configure our database. It''s important to wait
    until after we''ve created our custom user model before doing so given how tightly
    connected the user model is to the rest of Django.


    If you navigate to http://127.0.0.1:8000 you''ll see the familiar Django welcome
    screen.'
