    \ wsvincent with yours from Bitbucket.\n\n## Command Line\n\n```bash\n(blog) $\
    \ git remote add origin git@bitbucket.org:wsvincent/blog-app.git\n(blog) $ git\
    \ push -u origin master\n```\n\nAll done! Now we can deploy our new app on Heroku.\n\
    \n## Heroku config\n\nThis is our third time deploying an app. As with our Message\
