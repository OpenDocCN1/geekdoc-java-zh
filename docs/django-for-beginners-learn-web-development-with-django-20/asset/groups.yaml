    # 代码\n\n```python\ndef make_my_website:\n  ...\n  print(\"All done!\")\n```\n\n\
    我们还将频繁使用命令行控制台（从第 1 章：初始设置开始）来执行命令，命令以传统 Unix 风格的 `$` 前缀形式出现。\n\n# 命令行\n\n```\n\
    $ echo \"hello, world\"\n```\n\n该特定命令的结果将显示在下一行：\n\n# 命令行\n\n```\n\"hello, world\"\
    \n```\n\n我们通常会将命令及其输出结合在一起。命令总是以 `$` 开头，而输出则不会。例如，上面的命令和结果将表示如下：\n\n# 命令行\n\n\
    ```\n$ echo \"hello, world\"\nhello, world\n```\n\n所有示例的完整源代码可以在官方 Github 仓库中找到。\n\
    \n# 结论\n\nDjango 对于任何想要用最少代码构建现代、健壮 Web 应用程序的开发者来说都是一个极佳的选择。它非常流行，正在活跃开发中，并经过全球最大的网站的严格测试。在下一章中，我们将学习如何为任何计算机配置\
    \ Django 环境。\n\n# 第 1 章：初始设置\n\n本章涵盖了如何正确配置你的计算机以进行 Django 项目。我们从命令行的概述开始，并使用它安装最新版本的\
    \ Django (2.0) 和 Python (3.6x)。然后我们讨论了虚拟环境、git 以及如何与文本编辑器工作。\n\n在本章结束处时，你将已经准备好只需几次击键即可创建和修改新的\
    \ Django 项目。\n\n# 命令行\n\n命令行是计算机的一个强大的、仅文本的视图。作为开发者，我们将在整个书中频繁使用它来安装和配置每个 Django\
    \ 项目。\n\n在 Mac 上，命令行位于 `/Applications/Utilities` 下名为 Terminal（终端）的程序中。要找到它，打开一个新的\
    \ Finder 窗口，打开 Applications（应用程序）文件夹，向下滚动到 Utilities（工具）文件夹，然后双击名为 Terminal 的应用程序。\n\
    \n在 Windows 上，有一个内置的命令行程序，但它很难用。我建议使用 Babun，这是一个免费开源的命令行程序。在 Babun 主页上点击“Download\
    \ now”按钮，双击下载的文件安装 Babun，完成后将安装程序拖到回收站。要使用 Babun，前往开始菜单，选择程序，然后点击 Babun。\n\n今后，当书中提到“命令行”时，指的是使用\
    \ Terminal 或 Babun 在你的计算机上打开一个新的控制台。\n\n虽然有很多可以使用的命令，但在实践中，Django 开发中使用频率最高的有六种：\n\
    \n- cd (切换目录)\n- cd .. (切换到上级目录)\n- ls (列出当前目录下的文件)\n- pwd (打印工作目录)\n- mkdir (创建目录)\n\
    - touch (创建一个新文件)\n\n打开你的命令行并尝试它们。`$` 美元符号是我们的命令行提示符：书中的所有命令都旨在在 `$` 提示符之后输入。\n\
    \n例如，假设你正在 Mac 上，让我们进入桌面（Desktop）目录。\n\n# 命令行\n\n```\n$ cd ~/Desktop\n```\n\n\
    注意，我们的当前位置 `~/Desktop` 会自动添加到我们的命令行提示符之前。为了确认我们在正确的位置，我们可以使用 `pwd`，它会打印出当前目录的路径。\n\
    \n# 命令行\n\n```\n~/Desktop $ pwd\n/Users/wsv/desktop\n```\n\n在我们的 Mac 计算机上，这显示我正在使用用户\
    \ `wsv` 并在该账户的桌面。\n\n让我们用 `mkdir` 创建一个新的文件夹，进入它并添加一个新文件 `index.html`。\n\n# 第 1\
    \ 章：初始设置\n\n# 命令行\n\n```\n~/Desktop $ mkdir new_folder\n~/Desktop $ cd new_folder\n\
    ~/Desktop/new_folder $ touch index.html\n```\n\n现在使用 `ls` 列出目录中的所有当前文件。你会发现只有一个新创建的\
    \ `index.html`。\n\n# 命令行\n\n```\n~/Desktop/new_folder $ ls\nindex.html\n```\n\n\
    最后一步是使用 `cd ..` 返回桌面目录，并使用 `pwd` 确认位置。\n\n# 命令行\n\n```\n~/Desktop/new_folder $\
    \ cd ..\n~/Desktop $ pwd\n/Users/wsv/desktop\n```\n\n高级开发者可以使用键盘操作，这比鼠标快得多。\n\n\
    在书中，为了打开 Python 3 交互式 shell——让我们直接在计算机上运行 Python 命令——只需在命令行中输入 `python3`：\n\n\
    # 命令行\n\n```\n$ python3\nPython 3.6.4 (default, Jan 7 2018, 13:05:00)\n[GCC 4.2.1\
    \ Compatible Apple LLVM 9.0.0 (clang-900.0.39.2]) on darwin\nType \"help\", \"\
    copyright\", \"credits\" or \"license\" for more information.\n>>>\n```\n\n要随时退出\
    \ Python 3 交互式 shell，请按下 Control-d（Control 键和 d 键同时）。\n\n你仍然可以通过简单输入 `python`\
    \ 来运行 Python 2 shell：\n\n# 命令行\n\n```\n$ python\nPython 2.7.13 (default, Dec 18\
    \ 2016, 07:03:39)\n[GCC 4.2.1 Compatible Apple LLVM 8.0.0 (clang-800.0.42.1])\
    \ on darwin\nType \"help\", \"copyright\", \"credits\" or \"license\" for more\
    \ information.\n>>>\n```\n\n要检查 Python 3 是否已经安装，请在命令行中使用 `python3` 代替 `python`：\n\
    \n# 命令行\n\n```\n$ python3 --version\n```\n\n如果你的计算机输出 3.6x（任何 3.6 以上的版本），则你已经准备好了，不过我们需要安装\
    \ Python 3。\n\n我们的第一步是安装 Apple 的 Xcode 包，请运行以下命令：\n\n# 命令行\n\n```\n$ xcode-select\
    \ --install\n```\n\n点击确认命令（Xcode 是一个大程序，根据你的网络连接可能需要一段时间）。\n\n接下来通过以下命令安装包管理器\
    \ Homebrew：\n\n# 命令行\n\n```\n$ /usr/bin/ruby -e \"$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/master/install)\"\
    \n```\n\n要确认 Homebrew 安装正确，运行此命令：\n\n# 命令行\n\n```\n$ brew doctor\n```\n\n你的系统已准备好\
    \ brew。\n\n现在安装最新版本的 Python，运行以下命令：\n\n# 命令行\n\n```\n$ brew install python3\n\
    ```\n\n现在确认安装了哪个版本：\n\n第 1 章：初始设置\n\n# 命令行\n\n```\n$ python3 --version\nPython\
    \ 3.6.4\n```\n\n为了打开 Python 3 交互式 shell——让我们直接在计算机上运行 Python 命令——只需在命令行中输入 `python3`：\n\
    \n# 命令行\n\n```\n$ python3\nPython 3.6.4 (default, Jan 7 2018, 13:05:00)\n[GCC\
    \ 4.2.1 Compatible Apple LLVM 9.0.0 (clang-900.0.39.2]) on darwin\nType \"help\"\
    , \"copyright\", \"credits\" or \"license\" for more information.\n>>>\n```"
