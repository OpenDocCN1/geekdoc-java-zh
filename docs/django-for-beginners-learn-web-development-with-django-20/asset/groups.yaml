- md: "\n## Chapter 13: Newspaper app\n\n## Updated articles page\n\nThere's our new\
    \ article on the bottom as expected.\n\n## Conclusion\n\nWe have created dedicated\
    \ articles app with CRUD functionality. But there are no permissions or authorizations\
    \ yet, which means anyone can do anything! A logged-out user can visit all URLs\
    \ and any logged-in user can make edits or deletes to an existing article, even\
    \ one that not not own! In the next chapter we will add permissions and authorizations\
    \ to fix this.\n\n## Chapter 14: Permissions and Authorization\n\nThere are several\
    \ issues with our current website. For one thing we want our newspaper to be sustainable.\
    \ With more time we could require a user to log in to view articles. This is known\
    \ as authorization. Note that this is different than authentication which is the\
    \ process of registering and login flow. As a mature web framework, Django has\
    \ built-in functionality for authorization that we can quickly use. In this chapter\
    \ we will limit access to various pages to logged-in users. We will also add permissions\
    \ so that only the author of an article can update or delete it!\n\n## Improved\
    \ CreateView\n\nAt present the author on a new article can be set to any user.\
    \ Instead it should be automatically set to the current user. Then we will set\
    \ permissions on edit/delete so that only the author of an article can make such\
    \ changes. The default CreateView provides a lot of functionality for us in order\
    \ to set the current user to author will need to customize it. We will remove\
    \ author from the fields and set it automatically via the form_valid method.\n\
    \n### Code\n\n```python\n# articles/views.py\nclass ArticleCreateView(ContentView):\n\
    \    model = models.Article\n    template_name = 'article.html'\n    fields =\
    \ ['title', 'body']\n\n    def form_valid(self, form):\n        form.instance.author\
    \ = self.request.user\n        return super().form_valid(form)\n```\n\nHow did\
    \ I update CreateView like this? The answer is I looked at the source and used\
    \ Google. Generic class-based views are amazing for starting new projects but\
    \ when you want to customize it it is necessary to roll up your sleeves and start\
    \ to understand what is going under the hood. The more you use and customize built-in\
    \ views, the more comfortable you will become making like this. Chances are whatever\
    \ you are trying to do has already solved somewhere, either within Django itself\
    \ or on a forum like Stack Overflow. Don't be afraid to ask for help!\n\nNow reload\
    \ the browser and try clicking on the \"New\" link in the top nav. It will redirect\
    \ to the create page where author is no longer a field. If you create a new article\
    \ and then go into the admin you will see it is automatically set to the current\
    \ logged-in user.\n\n## Authorization\n\nThere are multiple issues around the\
    \ lack of authorizations in our current project. Obviously we would like to restrict\
    \ access to only users so we have the option of charging readers to our newspaper.\
    \ But beyond that, any random logged-out user who knows the correct URL can access\
    \ any part of the site.\n\nConsider what would happen if a logged-out user tried\
    \ to create a new article? To try it out, click on your username in the upper\
    \ right corner of the nav bar, then select “Logout” from the dropdown options.\
    \ The \"+ New” link disappears from the nav bar but what happens if you go to\
    \ it directly: http://127.0.0.1:8000/articles/new/?\n\nThe page is still there.\n\
    \nNew article\nTitle:\nBody:\nLogged out new\n\nNow try to create a new article\
    \ with a title and body. Click on the \"Save\" button.\n\n### ValueError at /articles/new/\n\
    \nCannot assign \"SimpleLazyObject: <django.contrib.auth.models.AnonymousUser\
    \ object at 0x1031e1e48>>: \"Article.author\" must be a \"CustomUser\".\n\n```\n\
    Request Method: POST\nRequest URL: http://127.0.0.1:8000/articles/new/\nDjango\
    \ Version: 2.0\nException Type: ValueError\nException Value: Cannot assign \"\
    SimpleLazyObject: <django.contrib.auth.models.AnonymousUser object at 0x1031e1e48>>:\
    \ \"Article.author\" must be a \"CustomUser\".\nException Location: /users/new/virtualenvs/opt-permissions-plc1ctm/python3/lib/python3.9/site-packages/django/db/fields/related_descriptors.py\
    \ in line 177\nPython Executable: /users/new/virtualenvs/opt-permissions-plc1ctm/python3/bin/python\n\
    ```\n\n"
  mdcn: "\n\n## 第 13 章：报纸应用\n\n## 更新后的文章页面\n\n正如预期的那样，底部出现了我们新写的文章。\n\n## 总结\n\n我们已经创建了一个具有\
    \ CRUD 功能的专用文章应用。但目前还没有权限或授权，这意味着任何人都可以进行任何操作！未登录的用户可以访问所有 URL，而任何登录的用户都可以对现有的文章进行编辑或删除，即使该文章不是他们创建的！在下一章中，我们将添加权限和授权来解决这个问题。\n\
    \n## 第 14 章：权限与授权\n\n我们目前的网站存在几个问题。首先，我们希望我们的报纸具有可持续性。如果有更多时间，我们可以要求用户登录后查看文章。这被称为授权（authorization）。注意，这与认证（authentication）不同，后者是指注册和登录流程。作为一个成熟的\
    \ Web 框架，Django 内置了授权功能，我们可以快速使用。在本章中，我们将限制只有登录用户访问各种页面。我们还将添加权限，使得只有文章的作者才能更新或删除它！\n\
    \n## 改进后的 CreateView\n\n目前，新文章的作者可以设置为任何用户。相反，它应该自动设置为当前用户。然后我们将在编辑/删除操作上设置权限，使得只有文章的作者才能进行此类更改。默认的\
    \ `CreateView` 为我们提供了很多功能，为了将当前用户设置为作者，我们需要对其进行自定义。我们将从字段中移除作者，并通过 `form_valid`\
    \ 方法自动设置。\n\n### 代码\n\n```python\n# articles/views.py\nclass ArticleCreateView(ContentView):\n\
    \    model = models.Article\n    template_name = 'article.html'\n    fields =\
    \ ['title', 'body']\n\n    def form_valid(self, form):\n        form.instance.author\
    \ = self.request.user\n        return super().form_valid(form)\n```\n\n我是如何这样更新\
    \ `CreateView` 的？答案是我查看了源码并使用了 Google搜索。通用类视图（Generic class-based views）对于启动新项目非常棒，但当你想要自定义它时，就必须卷起袖子开始理解底层发生了什么。你越是使用和自定义内置视图，进行这种操作时就会越从。很有可能你尝试做的任何事情已经在某处解决了，要么在\
    \ Django 内部，要么在 Stack Overflow 这样的论坛上。不要害怕寻求帮助！\n\n现在重新加载浏览器，尝试点击顶部导航栏中的“New”链接。它将重定向到创建页面，那里作者不再是一个字段。如果你创建了一篇新文章然后进入管理后台，你会发现它被自动设置为了当前登录的用户。\n\
    \n## 授权\n\n在我们目前的项目中，缺乏授权导致了多个问题。显然，我们希望将访问限制为仅用户，这样我们就有向报纸读者收费的选项。但除此之外，任何知道正确\
