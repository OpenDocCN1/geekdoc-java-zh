    \n## 激活模型\n\n现在我们的新模型已经创建，我们需要激活它。从今以后，每当我们创建或修改现有模型时，我们都需要通过两个步骤的过程来更新 Django：\n\
    \n1. 我们使用 `makemigrations` 命令创建一个迁移文件，该文件为 `INSTALLED_APPS` 设置中已安装的应用生成 SQL 命令。迁移文件不会在数据库上执行这些命令，而是对我们模型所有更改的引用。这种方法意味着我们拥有了模型随时间变化的记录。\n\
