    the email backend to use SMTP.


    # Code


    ```

    # newspaper_project/settings.py

    EMAIL_BACKEND = ''django.core.mail.backends.smtp.EmailBackend''

    ```


    Then right below add it the following five lines of email configuration. Note
    that ideally you should store secure information like your password in environment
    variables, but we won''t here to keep things simple.


    # Code


    ```

    # newnewspaper_project/settings.py


    EMAIL_HOST = ''smtp.sendgrid.net''

    EMAIL_HOST_USER = ''sendgrid_username''

    EMAIL_HOST_PASSWORD = ''sendgrid_password''

    EMAIL_PORT = 587

    EMAIL_USE_TLS = True

    ```


    Make sure to enter your own SendGrid username for EMAIL_HOST_USER and password
