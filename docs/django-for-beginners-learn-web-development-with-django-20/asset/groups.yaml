    (helloworld) $ git status\n```\n\n在分支 master 上\n\n暂无提交\n\n未跟踪的文件：\n\n（使用 \"git\
    \ add <file>...\" 将要提交的内容包含）\n\n-   db.sqlite3\n-   helloworldoworld_project/\n\
    -   manage.py\n-   pages/\n-   Pipfile\n-   Pipfile.lock\n\n没有要提交的内容，但存在未跟踪的文件（使用\
    \ \"git add\" 进行跟踪）\n\n我们接下来想使用 `add -A` 命令添加所有更改，然后带上描述更改内容的消息提交这些更改。\n\n## 命令行\n\
    \n```bash\n(helloworld) $ git add -A\n```\n\n```bash\n(helloworld) $ git commit\
