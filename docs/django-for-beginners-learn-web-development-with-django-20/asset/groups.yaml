    \ href=\"{% url 'post_edit' post.pk %}\">Edit Blog Post</a></p>\n<p><a href=\"\
    {% url 'post_delete' post.pk %}\">Delete Blog Post</a></p>\n{% endblock content\
    \ %}\n```\n\nThen create a new file for our delete page template. First quit the\
    \ local server Control-c and then type the following command:\n\n# Command Line\n\
    \n```\n(blog) $ touch templates/post_delete.html\n```\n\nAnd fill it with this\
    \ code:\n\n# Code\n\n```html\n<!-- templates/post_delete.html -->\n{% extends\
    \ 'base.html' %}\n\n{% block content %}\n<h1>Delete post</h1>\n<form action=\"\
    \" method=\"post\">{% csrf_token %}\n<p>Are you sure you want to delete \"{{ post.title\
    \ }}\"</p>\n<input type=\"submit\" value=\"Confirm\" />\n</form>\n{% endblock\
    \ %}\n```\n\nWe are using post.title here to display the title of our blog post.\
    \ We could also just use object.title as it too is provided by DetailView.\n\n\
    Now update our views.py file, by importing DeleteView and reverse_lazy at the\
    \ top, then create a new view that subclasses DeleteView.\n\n# Code\n\n```python\n\
    # blog/views.py\nfrom django.views.generic import ListView, DetailView\nfrom django.views.generic.edit\
    \ import CreateView, UpdateView, DeleteView\nfrom django.urls import reverse_lazy\n\
    \nfrom models import Post\n\nclass BlogListView(ListView):\n    model = Post\n\
    \    template_name = 'home.html'\n```\n\n```python\nclass BlogDetailView(DetailView):\n\
    \    model = Post\n    template_name = 'post_detail.html'\n```\n\n```python\n\
    class BlogCreateView(CreateView):\n    model = Post\n    template_name = 'post_new.html'\n\
    \    fields = ['title', 'body']\n```\n\n```python\nclass BlogUpdateView(UpdateView):\n\
    \    model = Post\n    fields = ['title', 'body']\n    template_name = 'post_edit.html'\n\
    ```\n\n```python\nclass BlogDeleteView(DeleteView):\n    model = Post\n    template_name\
    \ = 'post_delete.html'\n    success_url = reverse_lazy('home')\n```\n\nWe use\
    \ reverse_lazy as opposed to just reverse so that it won't execute the URL redirect\
    \ until our view has finished deleting the blog post.\n\nFinally add a url by\
