    \    template_name = 'home.html'\n```\n\n注意，我们对视图的首字母进行了大写，因为它现在是一个 Python 类。与函数不同，类应该始终大写开头。`TemplateView`\
    \ 已经包含了显示我们模板所需的所有逻辑，我们只需要指定模板名称。\n\n## URLs\n\n最后一步是更新我们的 URL 配置（URLConfs）。回想第\
    \ 2 章，我们需要在两个位置进行更新。首先，我们更新项目级的 `urls.py` 文件以指向我们的 pages 应用，然后在 `pages` 内部将视图映射到路由。\n\
    \n让我们从项目级的 `urls.py` 文件开始。\n\n# 代码\n\n```python\n# pages_project/urls.py\n\nfrom\
    \ django.contrib import admin\nfrom django.urls import path, include\n\nurlpatterns\
    \ = [\n    path('admin/', admin.site.urls),\n    path('', include('pages.urls'))\n\
    ]\n```\n\n此时应该检查一下这里的代码。我们在第二行添加了 `include`，将现有的 URL 指向 `pages` 应用。接下来创建一个应用级的\
