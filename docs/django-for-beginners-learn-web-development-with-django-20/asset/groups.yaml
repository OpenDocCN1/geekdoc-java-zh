    \ %}\n<div class=\"post-entry\">\n  <h2>{{ object.title }}</h2>\n  <p>{{ object.body\
    \ }}</p>\n</</div>\n```\n\n<p><a href=\"{% url 'post_edit' post.pk %}\">Edit Blog\
    \ Post</a></p>\n<p><a href=\"{% url 'post_delete' post.pk %}\">Delete Blog Post</a></p>\n\
    {% endblock content %}\n```\n\n然后为我们的删除页面模板创建一个新文件。首先通过 `Control-c` 退出本地服务器，然后输入以下命令：\n\
    \n# 命令行\n\n```\n(blog) $ touch templates/post_delete.html\n```\n\n并从中填入以下代码：\n\
    \n# 代码\n\n```html\n<!-- templates/post_delete.html -->\n{% extends 'base.html'\
    \ %}\n\n{% block content %}\n<h1>删除文章</h1>\n<form action=\"\" method=\"post\"\
    >{% csrf_token %}\n<p>你确定要删除“{{ post.title }}”吗？</p>\n<input type=\"submit\" value=\"\
    Confirm\" />\n</form>\n{% endblock %}\n```\n\n我们在这里使用 `post.title` 来显示我们博客文章的标题。我们也可以直接使用\
    \ `object.title`，因为它也是由 `DetailView` 提供的。\n\n现在更新我们的 `views.py` 文件，在顶部导入 `DeleteView`\
    \ 和 `reverse_lazy`，然后创建一个子类为 `DeleteView` 的新视图。\n\n# 代码\n\n```python\n# blog/views.py\n\
    from django.views.generic import ListView, DetailView\nfrom django.views.generic.edit\
    \ import CreateView, UpdateView, DeleteView\nfrom django.urls import reverse_lazy\n\
