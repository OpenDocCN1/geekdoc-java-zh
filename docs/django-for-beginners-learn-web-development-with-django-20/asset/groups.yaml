    # Local vs Production


    Up to this point we''ve been using Django''s own internal web server to power
    our Pages application locally on our computer. But you can''t share a localhost
    address with someone else. To make our site available on the Internet where everyone
    can see it, we need to deploy our code to an external server that anyone can use
    to see our site. This is called putting our code into production. Local code lives
    only on our computer; production code lives on an external server.


    There are many server providers available but we will use Heroku because it is
    free for small projects, widely-used, and has a relatively straightforward deployment
    process.


    # Heroku


    You can sign up for a free Heroku account on their website. After you confirm
    your email Heroku will redirect you to the dashboard section of the site.


    ![](img/593a0176e3a13ba5207237714df32537_61_0.png)


    Now we need to install Heroku''s Command Line Interface (CLI) so we can deploy
    from the command line. We will need to install Heroku globally so it is available
    across our entire computer, so open a new command line tab: Command + t on a Mac,
    Control + t on Windows. If we installed Heroku within our virtual environment,
    it would only be available there.


    Within this new tab, on a Mac use Homebrew to install Heroku:


    # Command Line


    ```

    $ brew install heroku

    ```


    On Windows, see the Heroku CLI page to correctly install either the 32-bit or
    64-bit version.


    Once installation is complete you can close our new command line tab and return
    to the initial tab with the pages virtual environment active.


    Type the command heroku login and use the email and password for Heroku you just
    set.


    # Command Line


    ```

    (pages) $ heroku login

    ```


    Enter your Heroku credentials:


    Email: will@wsvincent.com


    Password: *********************


    Logged in as will@wsvincent.com


    # Additional Files


    We need to make the following four changes to our Pages project so it''s ready
    to deploy online with Heroku:


    - update Pipfile.lock

    - make a new Procfile file

    - install gunicorn as our web server

    - make a one-line change to settings.py file


    Within your existing Pipfile specify the version of Python we''re using, which
    is 3.6. Add these two lines at the bottom of the file.


    # Code


    ```

    # Pipfile

    [requires]

    python_version = "3.6"

    ```


    Then run pipenv lock to generate the appropriate Pipfile.lock.


    # Command Line


    ```

    (pages) $ pipenv lock

    ```


    Heroku actually looks in our Pipfile.lock for information on our virtual environment,
    which is why we add the language setting here.


    Next create a Procfile which is specific to Heroku.


    # Command Line


    ```

    (pages) $ touch Procfile

    ```


    Open the Procfile with your text editor and add the following:


    # Code


    ```

    web: gunicorn pages_project.wsgi --log-file -

    ```


    This says to use our existing pages_project.wsgi file but with gunicorn, which
    is a web server suitable for production, instead of Django’s own server which
    is only usable for local development.


    # Chapter 3: Pages app


    # Command Line


    (pages) $ pipenv install gunicorn


    ```


    The final step is a one-line change to settings.py. Scroll down to the section
    called ALLOWED_HOSTS and add a ''*'' so it looks as follows:


    # Code


    ```

    # pages_project/settings.py

    ALLOWED_HOSTS = [''*'']

    ```


    The ALLOWED_HOSTS setting represents which host/domain names our Django site can
    serve. This is a security measure to prevent HTTP Host header attacks, which are
    possible even under many seemingly-safe web server configurations. However we''ve
    used the wildcard Asterisk * which means all domains are acceptable to keep things
    simple. In a production-level Django site you would explicitly list which domains
    are allowed.


    Use git status to check our changes, add the new files, and then commit them:


    # Command Line


    ```

    (pages) $ git status

    (pages) $ git add -A

    (pages) $ git commit -m "New updates for Heroku deployment"

    ```


    Finally push to Bitbucket so we have an online backup of our code changes.


    # Command Line


    ```

    (pages) $ git push -u origin master

    ```


    # Deploy


    The last step is to actually deploy with Heroku. If you''ve ever configured a
    server yourself in the past, you''ll be amazed at how much simpler the process
    is with platform-as-a-service provider like Heroku.


    Our process will be as follows:


    - create a new app on Heroku and push our code to it

    - add a git "hook" for Heroku

    - configure the app to ignore static files, which we''ll cover in later chapters

    - start the Heroku server so the app is live

    - visit the app on Heroku''s provided URL


    We can do the first step, creating a new app, from the command line with heroku
    create. Heroku will create a random name for our app, in my case cryptic-oasis-4039.
    Your name will be different.


    # Command Line


    ```

    (pages) $ heroku create

    Creating app... done, &cryptic-oasis-4039

    https://cryptic-oasis-4039.herokuapp.com/ | https://git.heroku.com/cryptic-oasis-439.git

    ```


    We now need to add a "hook" for Heroku within git. This means that git will store
    both our settings for pushing code to Bitbucket and to Heroku. My Heroku app is
    called cryptic-oasis-4039 so my command is as follows.


    # Command Line


    ```

    (pages) $ heroku git:remote -a cryptic-oasis-4039

    ```


    You should replace cryptic-oasis-4039 with the app-name Heroku provides.


    We need to do one set of Heroku configurations at this point, which is to tell
    Heroku to ignore static files like CSS and JavaScript Django by default tries
    to optimize for us. We''ll cover this in later chapters so for now just run the
    following command.


    # Command Line


    ```

    (pages) $ heroku config:set DISABLE_COLLECTSTATIC=1

    ```


    Now we can push our code to Heroku. Because we set our “hook” previously, it will
    go to Heroku.


    # Command Line


    ```

    (pages) $ git push heroku master

    ```


    If we just typed git push origin master then the code is pushed to Bitbucket,
    not Heroku. Adding heroku to the command sends the code to Heroku. This is a little
    confusing the first few times.


    Finally we need to make our Heroku app live. As websites grow in traffic they
    need additional Heroku services but for our basic example we can use the lowest
    level, web=1, which also happens to be free!


    Type the following command.

