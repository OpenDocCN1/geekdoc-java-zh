    \ 个文件\n\n`settings.py` 文件控制我们的项目设置，`urls.py` 告诉 Django 在响应浏览器或 URL 请求时构建哪些页面，`wsgi.py`（Web\
    \ 服务器网关接口）帮助 Django 交付我们最终的网页。最后一个文件 `manage.py` 用于执行各种 Django 命令，例如运行本地 Web 服务器或创建新应用。\n\
    \nDjango 自带了一个用于本地开发的内置 Web 服务器。我们可以通过 `runserver` 命令启动它。\n\n### 命令行\n\n```\n\
    (helloworld) $ python manage.py runserver\n```\n\n如果你访问 `http://127.0.0.1:8000/`，你应该看到下面的图片：\n\
    \n## 第 2 章：Hello World\n\n![](img/593a0176e3a13ba5207237714df32537_29_0.png)\n\
    \n## django\n\n查看 Django 2.0 的发布说明\n\n![](img/593a0176e3a13ba5207237714df32537_29_1.png)\n\
    \n## 安装成功！恭喜你！\n\n你之所以看到这个页面是因为设置文件中开启了 `DEBUG=True`，且你还没有配置任何 URL。\n\n- Django\
    \ 文档（主题、参考和教程）\n- 教程：投票应用（从 Django 开始）\n- Django 社区（联系、获取帮助或贡献）\n\n## Django 欢迎页\n\
    \n## 创建一个应用\n\nDjango 使用项目（projects）和应用（apps）的概念来保持代码整洁易读。单个 Django 项目包含一个或多个应用，这些应用共同运行一个\
    \ Web 。这就是为什么创建新 Django 项目的命令是 `startproject` 的原因！例如，一个真实的 Django 电商网站可能有一个用于用户身份验证的应用，另一个用于支付的应用，第三个用于商品列表详情的应用。每个应用都专注于一个独立的功能。\n\
    \n## 第 2 章：Hello World\n\n我们需要创建第一个应用，将其命名为 `pages`。在命令行中，使用 `Control+c` 停止服务器。然后使用\
    \ `startapp` 命令。\n\n### 命令行\n\n```\nhelloworld $ python manage.py startapp pages\n\
    ```\n\n如果你再次使用 `tree` 命令查看目录，你会发现 Django 已经创建了一个包含以下文件的 `pages` 目录：\n\n### 命令行\n\
    \n```\n\npages\n|-- __init__.py\n|-- admin.py\n|-- apps.py\n|-- migrations\n|\
