    \ which is not suitable for production.\n\n## Code\n\n```bash\nweb: gunicorn blog_project.wsgi\
    \ --log-file -\n```\n\nNow install gunicorn.\n\n## Command Line\n\n```bash\n(blog)\
    \ $ pipenv install gunicorn\n```\n\nFinally update ALLOWED_HOSTS to accept all\
    \ domains, which is represented by the asterisk *.\n\n## Code\n\n```python\n#\
    \ blog_project/settings.py\nALLOWED_HOSTS = ['*']\n```\n\nWe can commit our new\
    \ changes and push them up to Bitbucket.\n\n## Command Line\n\n```bash\n(blog)\
    \ $ git status\n(blog) $ git add -A\n(blog) $ git commit -m 'Heroku config'\n\
    (blog) $ git push -u origin master\n```\n\n## Heroku deployment\n\nTo deploy on\
    \ Heroku first confirm that you're logged in to your Heroku account.\n\n## Command\
    \ Line\n\n```bash\n(blog) $ heroku login\n```\n\nThen run the create command which\
    \ tells Heroku to make a new container for our app to live in. If you just run\
    \ heroku create then Heroku will assign you a random name, however you can specify\
    \ a custom name but it must be unique on Heroku. In other words, since I'm picking\
    \ the name df-blog you can't.\n\n## Command Line\n\n```bash\n(blog) $ heroku create\
    \ df-blog\n```\n\nNow configure git so that when you push to Heroku, it goes to\
    \ your new app name (replacing df-blog with your custom name).\n\n## Command Line\n\
    \n```bash\n(blog) $ heroku git:remote -a df-blog\n```\n\nThere's one more step\
    \ we need to take now that we have static files, which in our case is CSS. Django\
    \ does not support serving static files in production however WhiteNoise does.\
    \ So let's install it.\n\n## Command Line\n\n```bash\n(blog) $ pipenv install\
    \ whitenoise\n```\n\nThen we need to update our static settings so it will be\
    \ used in production. In your text editor open settings.py. Add whitenoise to\
    \ the INSTALLED_APPS above staticfiles and also to MIDDLEWARE on the third line.\
    \ Order matters for both INSTALLED_APPS and MIDDLEWARE.\n\nAt the bottom of the\
    \ file add new lines for both STATIC_ROOT and STATICFILES_STORAGE. It should look\
    \ like the following.\n\n## Code\n\n```python\n# blog_project/settings.py\nINSTALLED_APPS\
    \ = [\n    'django.contrib.admin',\n    'django.contrib.auth',\n    'django.contrib.contenttypes',\n\
    \    'django.contrib.sessions',\n    'django.contrib.messages',\n    'whitenoise.runserver_staticfiles',\
    \ # new!\n    'django.contrib.staticfiles',\n    'blog',\n    'accounts',\n]\n\
    \nMIDDLEWARE = [\n    'django.middleware.security.SecurityMiddleware',\n    'django.contrib.sessions.middleware.SessionMiddleware',\n\
