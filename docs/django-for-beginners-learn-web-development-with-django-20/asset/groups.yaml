    \n## Django Admin\n\nDjango 为我们提供了一个强大的管理界面来与数据库进行交互。这是一个少数框架提供的真正“杀手锏”的功能。它源于\
    \ Django 作为报纸项目的起源。开发者们需要一个 CMS（内容管理系统），以便记者可以编写和编辑他们的故事而无需接触“代码”。随着时间的推移，内置的\
    \ admin 应用已演变成一个优秀的开箱即用工具，用于管理 Django 项目的所有方面。\n\n要使用 Django admin，我们首先需要创建一个可以登录的超级用户。在命令行控制台中，输入\
    \ `python manage.py createsuperuser` 并对用户名、电子邮件和密码的提示做出响应：\n\n## 命令行\n\n```\n\
    (mb) $ python manage.py createsuperuser\nUsername (留空则使用 'wsv'): wsv\nEmail:\n\
    Password:\nPassword (again):\nSuperuser created successfully.\n```\n\n**注意：**\
    \ 当你输入密码时，出于安全考虑，密码不会显示在命令行控制台上。\n\n使用 `python manage.py runserver` 重启 Django\
    \ 服务器，并在浏览器中访问 `http://127.0.0.1:8000/admin/`。你应该看到管理员的登录界面：\n\n"
