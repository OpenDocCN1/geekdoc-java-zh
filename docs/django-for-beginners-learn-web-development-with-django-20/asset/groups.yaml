    # Admin Comment One


    At this point we could add an additional admin field so we''d see the comment
    and the article on this page. But wouldn''t it be better to just see all Comment
    models related to a single Post model? It turns out we can with a Django admin
    feature called inlines which displays foreign key relationships in a nice, visual
    way.


    There are two main inline views used: TabularInline and StackedInline. The only
    difference between the two is the template for displaying information. In a TabularInline
    all model fields appear on one line while a StackedInline each field has its own
    line. We''ll implement both so you can decide which one you prefer.


    Update articles/admin.py as follows in your text editor.'
