    \ [\n    'django.contrib.admin',\n    'django.contrib.auth',\n    'django.contrib.contenttypes',\n\
    \    'django.contrib.sessions',\n    'django.contrib.messages',\n    'django.contrib.staticfiles',\n\
    \    'blog', # new\n]\n```\n\nIf you navigate to http://127.0.0.1:8000/ in your\
    \ browser you should see the following page.\n\n## Chapter 5: Blog app\n\n![](img/593a0176e3a13ba5207237714df32537_102_0.png)\n\
    \n## django\n\nView release notes for Django 2.0\n\n![](img/593a0176e3a13ba5207237714df32537_102_1.png)\n\
    \nYou are seeing this page because DEBUG=True is in your settings file and you\
    \ have not configured any URLs.\n\n- Django Documentation Topics, references,\
    \ & how-to's\n- Tutorial: A Polling App Get started with Django\n- Django Community\
    \ Connect, get help, or contribute\n\n## Django welcome page\n\nOk, initial installation\
    \ complete! Next we'll create our database model for blog posts.\n\n## Database\
    \ Models\n\nWhat are the characteristics of a typical blog application? In our\
    \ case let's keep things simple and assume each post has a title, author, and\
    \ body. We can turn this into a database model by opening the blog/models.py file\
    \ and entering the code below:\n\n## Code\n\n```python\n# blog/models.py\n\nfrom\
    \ django.db import models\n\nclass Post(models.Model):\n    title = models.CharField(max_length=200)\n\
    \    author = models.ForeignKey(\n        'auth.User',\n        on_delete=models.CASCADE,\n\
    \    )\n    body = models.TextField()\n\n    def __str__(self):\n        return\
    \ self.title\n```\n\nAt the top we're importing the class models and then creating\
    \ a subclass of models. called Post. Using this subclass functionality we automatically\
    \ access to everything within django.db.models.Models and can add additional fields\
    \ and methods as desired.\n\nFor title we're limiting the length to 200 characters\
    \ and for body we're using a TextField which will automatically expand as needed\
    \ to fit the user's text. There are many field types available in Django; you\
    \ can see the full list here.\n\nFor the author we're using a ForeignKey which\
    \ allows for a many-to-one relationship. This means that a given user can be the\
    \ author of many different blog posts but not the other way around. The reference\
    \ is to the built-in User model as that Django provides for authentication. For\
    \ all many-to-one relationships such as a ForeignKey we must also specify an_delete\
    \ option.\n\n## Chapter 5: Blog app\n\nNow that our new database model is created\
    \ we need to create a new migration record for it and migrate the change into\
    \ our database. This two-step process can be completed with the commands below:\n\
    \n## Command Line\n\n```\n(blog) $ python manage.py makemigrations blog\n(blog)\
    \ $ python manage.py migrate blog\n```\n\nOur database is configured! What's next?\n\
    \n## Admin\n\nWe need a way to access our data. Enter the Django admin! First\
    \ create a superuser account by typing the command below and following the prompts\
    \ to set up an email and password. Note that when typing your password, it will\
    \ not appear on the screen for security reasons.\n\n## Command Line\n\n```\n(blog)\
    \ $ python manage.py createsuperuser\nUsername (leave blank to use 'wsv'): wsv\n\
    Email:\nPassword:\nPassword (again):\nSuperuser created successfully.\n```\n\n\
    Now start running the Django server again with the command python manage.py runserver\
    \ and open up the Django admin at http://127.0.0.1:8000/admin/. Login with your\
    \ new superuser account.\n\nOops! Where's our new Post model?\n\n## Admin homepage\n\
    \nWe forgot to update blog/admin.py so let's do that now.\n\n## Code\n\n```python\n\
    # blog/admin.py\n\nfrom django.contrib import admin\nfrom .models import Post\n\
    \nadmin.site.register(Post)\n```\n\nIf you refresh the page you'll see the update.\n\
    \n![](img/593a0176e3a13ba5207237714df32537_105_0.png)\n\n## Chapter 5: Blog app\n\
    \n![](img/593a0176e3a13ba5207237714df32537_106_0.png)\n\n## Admin homepage\n\n\
    Let's add two blog posts so we have some sample data to work with. Click on the\
    \ + Add button next to Posts to create a new entry. Make sure to add an “author”\
    \ to each post too since by default all model fields are required. If you try\
    \ to enter a post without an author you will see an error. If we wanted to change\
    \ this, we could add field options to our model to make a given field optional\
    \ or fill it with a default value.\n\n## Chapter 5: Blog app\n\n![](img/593a0176e3a13ba5207237714df32537_107_0.png)\n\
    \n## Admin first post\n\n## Add post\n\n![](img/593a0176e3a13ba5207237714df32537_108_0.png)\n\
    \n## Admin second post\n\n## Chapter 5: Blog app\n\n![](img/593a0176e3a13ba5207237714df32537_109_0.png)\n\
    \n## Admin homepage with two posts\n\nNow that our database model is complete\
    \ we need to create the necessary views, URLs, and templates so we can display\
    \ the information on our web application.\n\n## URLs\n\nWe want to display our\
    \ blog posts on the homepage, so, as in previous chapters, we'll first configure\
    \ our project-level URLConfs and then our app-level URLConfs to achieve this.\
    \ Note that “project-level” means in the same folder as the blog_project and blog\
    \ app folders.\n\nOn the command line quit the existing server with Control-c\
    \ and create a new urls.py file within our blog:\n\n## Command Line\n\n```\n(blog)\
    \ $ touch urls.py\n```\n\nNow update it with the code below.\n\n```python\n# blog/urls.py\n\
    from django.urls import path\nfrom . import views\n\nurlpatterns = [\n    path('',\
    \ views.BlogListView.as_view(), name='home'),\n]\n```\n\nWe're importing our soon-to-be-created\
    \ views at the top. The empty string '' tells Python to match all values and we\
    \ make it a named URL, home, which we can refer to in our views later on. While\
    \ it's optional to add a named URL it's a best practice we should adopt as it\
    \ keeps things organized as your number of URLs grows.\n\nWe should also update\
    \ our project-level urls.py file so it knows to forward all requests directly\
    \ to the blog app.\n\n## Code\n\n```python\n# blog_project/urls.py\n\nfrom django.contrib\
    \ import admin\nfrom django.urls import path, include\n\nurlpatterns = [\n   \
    \ path('admin/', admin.site.urls),\n    path('', include('blog.urls')),\n]\n```\n\
    \n## Views\n\nWe're going to use class-based views but if want to see a function-based\
    \ way to build a blog application, I highly recommend the Django Girls Tutorial.\
    \ It is excellent.\n\nIn our view, add the code below to display the contents\
    \ of our Post model using ListView.\n\n```python\n# blog/views.py\n\nfrom django.views.generic\
    \ import ListView\nfrom .models import Post\n\nclass BlogListView(ListView):\n\
    \    model = Post\n    template_name = 'home.html'\n```\n\nOn the top two lines\
    \ we import ListView and our database model Post. Then we subclass ListView and\
    \ add our model and template. This saves us a lot of code versus implementing\
    \ it all from scratch.\n\n## Templates\n\nWith our URLConfigs and views now, we're\
    \ only missing the third piece of the puzzle: templates. As we already saw in\
    \ Chapter 4, we can inherit from other templates to keep our code clean. We'll\
    \ start off with a base.html file and home.html file that inherits from it. Then\
    \ later when we add templates for creating and editing blog posts, they too can\
    \ inherit from base.html.\n\nStart by creating our project-level templates directory\
    \ with the two template files.\n\n## Command Line\n\n```\n(blog) $ mkdir templates\n\
    (blog) $ touch templates/base.html\n(blog) $ touch templates/home.html\n```\n\n\
    Then update settings.py so Django knows to look there for our templates.\n\n##\
    \ Code\n\n```python\n# blog_project/settings.py\nTEMPLATES = [\n{\n  ...\n  'DIRS':\
    \ [os.path.join(BASE_DIR, 'templates')],\n  ...\n},\n]\n```\n\nThen update the\
    \ base.html template as follows.\n\n## Code\n\n```html\n<!-- templates/base.html\
    \ -->\n<html>\n<head>\n  <title>Django blog</title>\n</head>\n<body>\n  <header>\n\
    \  <h1><a href=\"/\">Django blog</a></h1>\n  </header>\n</body>\n</html>\n```\n"
