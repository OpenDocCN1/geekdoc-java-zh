  mdcn: "\n\n# 第 15 章：注释\n\nDjango 有有一套内置的语法，我们可以使用 `FOO_set`，其中 `FOO` 是源模型的小写。因此，对于我们的\
    \ `Article` 模型，我们可以使用 `article_set` 来访问该模型的所有实例。\n\n但我个人非常不喜欢这种语法，因为我觉得它既困惑又不符合直觉。更好的方法是在我们的模型中添加一个\
    \ `related_name` 属性，这让我们能够显式地设置此反向关系的名称。让我们来这样做吧。\n\n首先，为我们的 `comment` 模型添加一个\
    \ `related_name` 属性。良好的默认命名方式是持有 `ForeignKey` 的模型的复数形式。\n\n# 代码\n\n```python\n\
    # articles/models.py\n...\nclass Comment(models.Model):\n    article = models.ForeignKey(\n\
    \        Article,\n        on_delete=models.CASCADE,\n        related_name='comments'\
    \ # new\n    )\n```\n\n由于我们刚刚对数据库模型进行了更改，因此我们需要创建迁移文件并更新数据库。使用 Control+c 停止本地服务器并执行以下两个命令。然后重新启动服务器，因为我们稍后会要用到它。\n\
    \n# 命令行\n\n```bash\n(news) $ python manage.py makemigrations articles\n(news)\
    \ $ python manage.py migrate\n(news) $ python manage.py runserver\n```\n\n理解查询需要一些时间，如果你觉得反向关系的概念很困惑，不要担心。我会向你展示如何按实现代码。一旦你掌握了这些基础案例，就可以探索如何详细过滤你的查询集，以便返回你想要的信息。\n\
    \n在我们的 `article_list.html` 文件中，我们可以将注释添加到 `card-footer` 中。注意，我将编辑和删除链接移动到了 `card-body`。为了访问每个注释，我们调用了\
    \ `comments.all`，这意味着首先是 `article` 模型，然后是 `comments`（这是整个 `Comment` 模型的相关名称），并选择包含的所有项。在模板中使用这种语法引用外键数据可能需要一点时间来适应！\n\
    \n# 代码\n\n```html\n<!-- template/article_list.html -->\n{% extends 'base.html'\
    \ %}\n\n{% block title %}Articles{% endblock content %}\n\n{% block content %}\n\
    {% for article in object_list %}\n<div class=\"card\">\n  <div class=\"card-header\"\
    >\n    <span class=\"font-weight-bold\">{{ article.title }}</span>&middot;\n \
    \   <span class=\"text-muted\">by {{ article.author }} | {{ article.date }}</span>\n\
    \  </div>\n  <div class=\"card-body\">\n    <p>{{ article.body }}</p>\n    <a\
    \ href=\"{% url 'article_edit' article.pk %}\">Edit</a> |\n    <a href=\"{% url\
    \ 'article_delete' article.pk %}\">Delete</a>\n  </div>\n  <div class=\"card-footer\"\
    >\n    {% for comment in article.comments.all %}\n    <p>\n      <span class=\"\
    font-weight-bold\">{{ comment.author }}</span>&middot;\n      {{ comment.text\
    \ }}\n    </p>\n    {% endfor %}\n  </div>\n</div>\n<br />\n{% endfor %}\n{% endblock\
    \ content %}\n```\n\n如果我们刷新 http://127.0.0.1:8000/articles/ 上的文章页面，就可以看到页面上显示了我们的新注释。\n\
    \n![](img/593a0176e3a13ba5207237714df32537_303_0.png)\n\n# 带有注释的文章页面\n\n耶！成功了。我们可以看到在初始消息下方列出了两个注释。\n\
    \n# 总结\n\n如果有更多时间，我们现在会关注表单，这样用户就可以在 articles/ 页面直接编写新文章并添加注释。本章的重点是演示 Django\
    \ 中外键关系是如何工作的。\n\n我们的 `Newspaper` 应用现在完成了。它是一个健壮的用户身份验证流程，包括使用邮箱重置密码。我们还使用了自定义用户模型，所以如果我们想为\
    \ `CustomUser` 模型添加额外字段，只需简单添加一个字段即可。\n\n我们已经为所有用户提供了一个 `age` 字段，目前默认设置为 `None`。如果我们愿意，我们可以在注册表单中添加一个年龄下拉框，并限制只有\
    \ 13 岁以上的用户才能访问。或者我们可以为 65 岁以上的用户提供折扣。我们想对 `CustomUser` 模型做的任何事情都是……\n\n# 总结\n\
    \n恭喜你完成了 Django！像学习任何新技能一样，练习和应用你所学到的非常重要。你现在拥有了构建自己的 Web 应用程序的工具。\n\n"
