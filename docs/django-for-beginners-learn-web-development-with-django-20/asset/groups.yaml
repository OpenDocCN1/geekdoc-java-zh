    \ can check against. In other words, we don't need to run on our actual database\
    \ but instead can make a separate test database, fill it with sample data, and\
    \ then test it against.\n\nLet's start by adding a sample post to the text database\
    \ field and then check that it is stored correctly in the database. It's important\
    \ that all our test methods start with test_ so Django knows to test them! The\
    \ code will look like this:\n\nCode\n\n```\n# posts/tests.py\nfrom django.test\
    \ import TestCase\nfrom .models import Post\n```\n\n```\nclass PostModelTest(TestCase):\n\
    \    def setUp(self):\n        Post.objects.create(text='just a test')\n```"
