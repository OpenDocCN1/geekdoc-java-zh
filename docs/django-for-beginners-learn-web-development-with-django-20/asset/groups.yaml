    \ our url will ensure that the user visits the homepage they are redirected to\
    \ the correct view.\n\nLet’s start by updating the views.py file in our pages\
    \ app to look as follows:"
  - "[PAGE 32]\n\n# Code\n\n```\n# pages/views.py\nfrom django.http import HttpResponse\n\
    \ndef homeView(request):\n    return HttpResponse('Hello, World!')\n```\n\nBasically\
    \ we're saying whenever the function homeView is called, return the text “Hello,\
    \ World!” More specifically, we've imported the built-in HttpResponse method so\
    \ we can return a response to the user. We've created a function called homeView\
    \ that accepts the request object and returns a response with the string Hello,\
    \ World!.\n\nNow we need to configure our urls. Within the pages app, create a\
    \ new urls.py file.\n\n# Command Line\n\n```\n(helloworld) $ touch pages/urls.py\n\
    ```\n\nThen update it with the following code:"
  - "[PAGE 33]\n\n# Code\n\n```\n# pages/urls.py\n\nfrom django.urls import path\n\
    \nfrom . import views\n\nurlpatterns = [\n    path('', views.homePageView, name='home')\n\
    ]\n```\n\nOn the top line we import path from Django to power our urlpattern and\
    \ on the line we import our views. The period used here from . import views means\
    \ reference the current directory, which is our pages app containing both views.py\
    \ and urls.py. Our urlpattern has three parts:\n\n+   - a Python regular expression\
    \ for the empty string ''\n- specify the view which is called homePageView\n-\
    \ add an optional url name of 'home'\n\nIn other words, if the user requests the\
    \ homepage, represented by the empty string '' then we use the view called homePageView.\n\
    \nWe're almost done. The last step is to configure our project-level urls.py file\
    \ too. Remember that it's common to have multiple apps within a single Django\
    \ project, so they each need their own route.\n\nUpdate the helloworld_project/urls.py\
    \ file as follows:"
  - "[PAGE 34]\n\n# Code\n\n```\n# helloworld_project/urls.py\nfrom django.contrib\
    \ import admin\nfrom django.urls import path, include\n\nurlpatterns = [\n   \
    \ path('admin/', admin.site.urls),\n    path('', include('pages.urls')),\n]\n\
    ```\n\nWe've imported include on the second line next to path and then created\
    \ a new\nurpattern for our pages app. Now whenever a user visits the homepage\
    \ at / they will\nfirst be routed to the pages app and then to the homePageViewView.\n\
    \nIt's often confusing to beginners that we don't need to import the pages app\
    \ here, yet\nwe refer to it in our urlpattern as pages.urls. The reason we do\
    \ it this way is that\nthe method django.urls.include() expects us to pass in\
    \ a module, app, or as the first\nargument. Without using include we would need\
    \ to import our pages app, but since\nwe use include we don't have to at at the\
    \ project level!\n\n# Hello, world!\n\nWe have all the code we need now! To confirm\
    \ everything works as expected, restart\nour Django server:"
- md: "\n## Chapter 2: Hello World app\n\n31\n\n## Command Line\n\n```bash\n(helloworld)\
    \ $ python manage.py runserver\n```\n\nIf you refresh the browser for http://127.0.0.1:8000/\
    \ it now displays the text “Hello, world!”\n\n![](img/593a0176e3a13ba5207237714df32537_35_0.png)\n\
    \nHello, World!\n\nHello world homepage\n\n## Git\n\nIn the previous chapter we\
    \ also installed git which is a version control system. Let’s use it here. The\
    \ first step is to initialize (or add) git to our repository.\n\n## Command Line\n\
    \n```bash\n(helloworld) $ git init\n```\n\nIf you type git status you’ll see a\
    \ list of changes since the last git commit. Since this is our first commit, this\
    \ list is all of our changes so far.\n\n## Command Line\n\n```bash\n(helloworld)\
    \ $ git status\n```\n\nOn branch master\n\nNo commits yet\n\nUntracked files:\n\
    \n(use \"git add <file>...\" to include in what will be committed)\n\n-   db.sqlite3\n\
    -   helloworldoworld_project/\n-   manage.py\n-   pages/\n-   Pipfile\n-   Pipfile.lock\n\
    \nnothing added to commit but untracked files present (use \"git add\" to track)\n\
    \nWe next want to add all changes using the command `add -A` and then commit the\
    \ changes along with a message describing what has changed.\n\n## Command Line\n\
    \n```bash\n(helloworld) $ git add -A\n```\n\n```bash\n(helloworld) $ git commit\
    \ -m 'initial commit'\n```\n\nPlease note Windows users may receive an error git\
    \ commit error: pathspec 'commit' did not match any file(s) known to git which\
    \ appears to be related to using single quotes '' as opposed to double quotes\
    \ \"\". If you see this error, using double quotes for all commit messages going\
    \ forward.\n\n## Bitbucket\n\nIt's a good habit to create a remote repository\
    \ of your code for each project. This way you have a backup in case anything happens\
    \ to your computer and more importantly, it allows for collaboration with other\
    \ software developers. The two most popular choices are Bitbucket and Github.\n\
    \nIn this book we will use Bitbucket because it allows private repositories **for\
    \ free**. Github charges a fee. Public repositories are available for anyone on\
    \ the internet to use; private repositories are not. When you're learning web\
    \ development, it's best to stick to private repositories so you don't inadvertently\
    \ post critical information such as passwords online.\n\nTo get started on Bitbucket,\
    \ sign up for a free account. After confirming your account via email you'll be\
    \ redirected to the Bitbucket welcome page. Click on the link for “Create a repository”.\n\
    \n## Chapter 2: Hello World app\n\n34\n\n![](img/593a0176e3a13ba5207237714df32537_38_0.png)\n\
    \nWelcome to Bitbucket, William\n\nFlying solo?\n\nCreate your first repository\
    \ and start bringing your ideas to life.\n\nPlan to work with others?\n\nAdd an\
    \ existing repository or create a new one, then start working better, together.\n\
    \nCreate a repository\n\nCreate a team\n\nNew to Git? Check out our tutorials\n\
    \n## Bitbucket welcome page\n\nThen on the “Create Repo” page enter in the name\
    \ of your repository: “hello-world”.\nThen click the blue “Create repository button”:\n\
    \n## Chapter 2: Hello World app\n\n![](img/593a0176e3a13ba5207237714df32537_39_0.png)\n\
    \n## Bitbucket create repo\n\nOn the next page, click on the link on the bottom\
    \ for “I have an existing project” which will open a dropdown:\n\n## Chapter 2:\
    \ Hello World\n\n36\n\n![](img/593a0176e3a13ba5207237714df32537_40_0.png)\n\n\
    We're already in the directory for our repo skip Step 1. In Step 2, we'll use\
    \ two commands to add our project to Bitbucket. Note that your command will differ\
    \ from mine since you have a different username. The general format is the below\
    \ where <USER> is your Bitbucket username.\n\n## Command Line\n\n```bash\n(helloworld)\
    \ $ git remote add origin https://<USER>@bitbucket.org/<USER>/hello-world.git\n\
    ```\n\nAfter running this command to configure git with this Bitbucket repository,\
    \ we must “push” our code into it.\n\n## Command Line\n\n```bash\n(helloworld)\
    \ $ git push -u origin master\n```\n\nIf you go back to your Bitbucket page and\
    \ refresh it, you'll see the code is online! Click on the \"Source\" tab on the\
    \ left to see it all.\n\n![](img/593a0176e3a13ba5207237714df32537_41_0.png)\n\n\
    Since we're done, go ahead and exit our virtual environment with the exit command.\n\
    \n## Command Line\n\n```bash\n(helloworld) $ exit\n```\n\nYou should now see no\
    \ parentheses on your command line, indicating the virtual environment is no longer\
    \ active.\n\n## Conclusion\n\nCongratulations! We've covered a lot of fundamental\
    \ concepts in this chapter. We built our first Django application and learned\
    \ about Django's project/app structure.\n\nWe started to learn about views, urls,\
    \ and the internal web server. And we worked with git to track our changes and\
    \ pushed our code into a private repo on Bitbucket.\n\nContinue on to **Chapter\
    \ 3: Simple app** where we'll build and deploy a more complex Django application\
    \ using templates and class-based views.\n\n## Chapter 3: Pages app\n\nIn this\
    \ chapter we'll build, test, and deploy a Pages app that has a homepage and an\
    \ about page. We'll also learn about class-based views.\n\n## Initial Setup\n\n\
    As in Chapter 2: Hello World app, initial setup involves the following:\n\n- create\
    \ a new environment\n- install Django\n- create a new project\n- create pages\
    \ app\n- update settings.py\n\n## Command Line\n\n```bash\n$ cd Desktop\n$ mkdir\
    \ pages\n$ pipenv install\nenv django\n$ pipenv shell\n$ django-admin startproject\
    \ pages_project\n$ python manage.py startapp pages\n```\n\n```bash\n(helloworld)\
    \ $ python manage.py runserver\n```\n\nAnd then navigate to http://127.0.0.1:8000/.\n\
    \n![](img/593a0176e3a13ba5207237714df32537_45_0.png)\n\nThe install worked successfully!\
    \ Congratulations!\n\nYou are seeing this page because DEBUG=True is in your settings\
    \ file and you have not configured any URLs.\n\n- Django Documentation: Topics,\
    \ references, & how-to\n- Tutorial: A Polling App Get started with Django\n- Django\
    \ Community: Connect, get help, or contribute\n\n## Templates\n\nEvery web framework\
    \ needs a convenient way to generate HTML files. In Django, the approach is to\
    \ use templates so that individual HTML files can be served by a view to a page\
    \ specified by the URL.\n\nIt's worth repeating this pattern since you'll see\
    \ it over and again in Django development: Templates, Views, and URLs. The order\
    \ in which you create them doesn't matter since all three are required and work\
    \ closely together. The URLs control the initial route, the entry point into a\
    \ page, such as /about, the views contain the logic or the “what”, and the template\
    \ has the HTML. For web pages that rely on a database model, it is the view of\
    \ how much to decide what data is available to the template.\n\nSo: Templates,\
    \ Views, URLs. This pattern will hold true for every Django web page you make.\
    \ However it will take some repetition before you internalize it.\n\nOk, moving\
    \ on. The question of where to place the templates directory can be confusing\
    \ for beginners. By default, Django looks within each app for templates. In our\
    \ pages app it will expect a home.html template to be located in the following\
    \ location:\n\n- pages\n  - templates\n    - pages\n      - home.html\n\nThis\
    \ means we would need to create a new templates directory, a new directory with\
    \ the name of the app, pages, and finally our template itself which is home.html.\n\
    \nA common question is: Why this repetitive structure? The short answer is that\
    \ the Django template loader wants to be really sure it find the correct template\
    \ and this is how it’s programmed to look for them.\n\nFortunately there's another\
    \ often-used approach to structuring the templates in a Django project. And that\
    \ is to instead create a single, project-level templates directory that is available\
    \ to all apps. This is the approach we'll use. By making a small tweak to\n"
  mdcn: "\n\n## 第2章：Hello World 应用\n\n31\n\n## 命令行\n\n```bash\n(helloworld) $ python\
