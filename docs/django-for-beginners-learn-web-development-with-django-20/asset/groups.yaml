    \ button”（创建仓库按钮）：\n\n## 第2章：Hello World 应用\n\n![](img/593a0176e3a13ba5207237714df32537_39_0.png)\n\
    \n## Bitbucket 创建仓库\n\n在下一页，点击底部的链接“I have an existing project”（我有一个现有的项目），这将打开一个下拉菜单：\n\
