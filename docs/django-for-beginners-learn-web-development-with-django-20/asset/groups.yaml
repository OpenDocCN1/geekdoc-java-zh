    \n## Bitbucket create app\n\nOn the next page click on the bottom link for \"\
    I have an existing project\". Copy the two commands to connect and then push the\
    \ repository to Bitbucket.\n\nIt should look like this, replacing wsvincent (my\
    \ username) with your Bitbucketusername:\n\n## Command Line\n\n```\n(mb) $ git\
    \ remote add origin git@bitbucket.org:wsvincent/mb-app.git\n(mb) $ git push -u\
    \ origin master\n```\n\n## Heroku configuration\n\nYou should also already have\
    \ a Heroku account setup and installed from Chapter 3.\nWe need to make the following\
    \ changes to our Message Board project to deploy it online:\n\n- update Pipfile.lock\n\
    - new Procfile\n- install gunicorn\n- update settings.py\n\nWithin your Pipfile\
    \ specify the version of Python we're using, which is 3.6. Add these two lines\
    \ at the bottom of the file.\n\n## Code\n\n```\n# Pipfile\n[requires]\npython_version\
    \ = \"3.6\"\n```\n\nRun pipenv lock to generate the appropriate Pipfile.lock.\n\
    \n## Command Line\n\n```\n(mb) $ pipenv lock\n```\n\nThen create a Procfile which\
    \ tells Heroku how to run the remote server where our code will live.\n\n## Command\
    \ Line\n\n```\n(mb) $ touch Procfile\n```\n\nFor now we're telling Heroku to use\
    \ gunicorn as our production server and look in our mb_project.wsgi file for further\
    \ instructions.\n\n## Command Line\n\n```\nweb: gunicorn mb_project.wsgi --log-file\
    \ -\n```\n\nNext install gunicorn which we'll use in production while still using\
    \ Django's internal server for local development use.\n\n## Command Line\n\n```\n\
    (mb) $ pipenv install gunicorn\n```\n\nFinally update ALLOWED_HOSTS in our settings.py\
    \ file.\n\n## Code\n\n```\n# mb_project/settings.py\nALLOWED_HOSTS = ['*']\n```\n\
    \nWe're all done! Add and commit our new changes to git and then push them up\
    \ to Bitbucket.\n\n## Command Line\n\n```\n(mb) $ git status\n(mb) $ git add -A\n\
    (mb) $ git commit -m 'New updates for Heroku deployment'\n(mb) $ git push -u origin\
    \ master\n```\n\n## Heroku deployment\n\nMake sure you're logged into your Heroku\
    \ account.\n\n## Command Line\n\n```\n(mb) $ heroku login\n```\n\nThen run the\
    \ create command and Heroku will randomly generate an app name for you. You can\
    \ customize this later if desired.\n\n## Command Line\n\n```\n(mb) $ heroku create\
    \ done #agile-inlet-25811\nCreating app... agile-inlet-25811.herokuapp.com/ |\
    \ https://git.heroku.com/agile-inlet-25811.git\n```\n\nSet git to use the name\
    \ of your new app when you push code to Heroku. My Heroku-generated name is agile-inlet-25811\
    \ so the command looks like this.\n\nChapter 4: Message Board app\n\n## Command\
    \ Line\n\n```\n(mb) $ heroku git:remote -a agile-inlet-25811\n```\n\nTell Heroku\
    \ to ignore static files which we'll cover in-depth when deploying our Blog app\
    \ later in the book.\n\n## Command Line\n\n```\n(mb) $ heroku config:set DISABLE_COLLECTSTATIC=1\n\
    ```\n\nPush the code to Heroku and add free scaling so it's actually running online,\
    \ otherwise the code is just sitting there.\n\n## Command Line\n\n```\n(mb) $\
    \ git push heroku master\n(mb) $ heroku ps:scale web=1\n```\n\nIf you open the\
    \ new project with heroku open it will automatically launch a browser window with\
    \ the URL of your app. Mine is live at:\n\nhttps://agile-inlet-25811.herokuapp.com/\n\
    \n![](img/593a0176e3a13ba5207237714df32537_98_0.png)\n\n## Message board homepage\n\
    \n- Hello world!\n- Second entry. This is working!\n- Today built my first Django\
    \ project.\n\nLive site\n\n## Conclusion\n\nWe've now built, tested, and deployed\
    \ our first database-driven app. While it's deliberately quite basic, now we know\
    \ how to create a database model, update it with the admin panel, and then display\
    \ the contents on a web page. But something is missing, no?\n\nIn the real-world,\
    \ users need forms to interact with our site. After all, not everyone should have\
    \ access to the admin panel. In the next chapter we'll build a blog application\
    \ that uses forms so that users can create, edit, and delete posts. We'll also\
    \ add styling via CSS.\n\n## Chapter 5: Blog app\n\nIn this chapter we'll build\
    \ a blog application that allows users to create, edit, and delete posts. The\
    \ homepage will list all blog posts and there will be a dedicated detail page\
    \ for each individual post. We'll also introduce CSS for styling and learn how\
    \ Django works with static files.\n\n## Initial Setup\n\nAs covered in previous\
    \ chapters, our steps for setting up a new Django project are as follows:\n\n\
    - create a new directory for our code on the Desktop called blog\n- install Django\
    \ in a new virtual environment\n- create a new Django project called blog_project\n\
    - create a new app blog\n- perform a migration to set up the database\n- update\
    \ settings.py\n\nExecute the following commands in a new command line console.\
    \ Note that the actual name of the virtual environment will be (blog-XXX) where\
    \ XXX represents random characters. I'm using (blog) here to keep things simpler\
    \ since my name will differ from yours.\n"
