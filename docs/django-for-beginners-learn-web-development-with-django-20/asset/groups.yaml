    \ `exit` 并按回车键。括号将会消失，这意味着该虚拟环境不再激活。\n\n我们将使用 `pipenv` 来创建一个新的虚拟环境，安装 Django，然后激活它。\n\
    \n## 命令行\n\n```bash\n$ pipenv install django\n$ pipenv shell\n```\n\n如果你使用的是 Mac，现在应该会在命令行提示符的开头看到括号，格式为\
    \ `(helloworld-XXX)`，其中 XXX 代表随机字符。在我的电脑上，我看到的是 `(helloworld-415ivvZC)`。我会在文中显示为\
    \ `(helloworld)`，但你电脑上看到的会略有不同。如果你使用的是 Windows，此时不会看到视觉提示符。\n\n创建一个名为 `helloworld_project`\
    \ 的新 Django 项目，确保在命令末尾包含点 `.`，这样它就会安装在当前目录中。\n\n### 命令行\n\n```\n(helloworld) $\
    \ django-admin startproject helloworld_project\n```\n\n如果你使用 `tree` 命令，就可以看到我们\
    \ Django 项目目前的结构了。（注意：如果 `tree` 命令不可用，请用 Homebrew 安装：`brew install tree`。）\n\n\
    ### 命令行\n\n```\n(helloworld) $ tree\n| helloworld_project\n| |-- __init__.py\n\
