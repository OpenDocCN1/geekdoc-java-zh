    ## 密码重置


    密码重置处理用户忘记密码的常见情况。步骤与我们刚刚完成的配置密码更改非常相似。Django 已经提供了一个默认实现，我们将使用它，然后自定义模板以与我们网站的其他部分匹配。


    唯一需要的配置是告诉 Django 如何发送电子邮件。毕竟，用户只有在能够访问与账户关联的电子邮件时，才能重置密码。在生产环境中，我们将使用电子邮件服务 SendGrid
    来实际发送邮件，但为了测试目的，我们可以依赖 Django 的控制台后端设置，它会将电子邮件正文输出到我们的命令行控制台中。


    在 `settings.py` 文件的末尾进行进行以下单行更改。


    ### 代码


    ```python

    # newspaper_project/settings.py

    EMAIL_BACKEND = ''django.core.mail.backends.console.EmailBackend''

    ```


