- md: "\n## Chapter 7: User Accounts\n\n## Code\n\n```python\n# accounts/urls.py\n\
    \nfrom django.urls import path\n```\n\n```python\nfrom . import views\n\nurlpatterns\
    \ = [\n\npath('signup/', views.SignUpView.as_view(), name='signup'),\n]\n```\n\
    \nWe're using a not-yet-created view called SearchView which we already know class-based\
    \ since it is capitalized and has the as_view() suffix. Its path will be signup/\
    \ so the overall path will be accounts/signup.\n\nNow for the view which uses\
    \ the built-in UserCreationForm and generic CreateView.\n\n## Code\n\n```python\n\
    # accounts/views.py\n\nfrom django.contrib.auth.forms import UserCreationForm\n\
    \nfrom django.urls import reverse_lazy\n\nfrom django.views import generic\n```\n\
    \n```python\nclass SignUp(generic.CreateView):\n\n    form_class = UserCreationForm\n\
    \n    success_url = reverse_lazy('login')\n\n    template_name = 'signup.html'\n\
    ```\n\nWe're subclassing the generic class-based view createView in our SignUp\
    \ class. We specify the built-in UserCreationForm and the not-created template\
    \ at signup.html. And we use reverse_lazy to redirect the user to the login page\
    \ upon successful registration.\n\nWhy use reverse_lazy instead of reverse? The\
    \ reason is that for all class-based views the urls are not loaded when the file\
    \ is imported, so we have to use the lazy form of reverse to load them when they're\
    \ available.\n\nNow let's add signup.html to our project-level templates folder:\n\
    \n## Command Line\n\n```bash\n(blog) $ touch templates/signup.html\n```\n\nAnd\
    \ then populate it with the code below.\n\n## Code\n\n```html\n<!-- templates/signup.html\
    \ -->\n{% extends 'base.html' %}\n\n{% block content %}\n<h2>Sign up</h2>\n<form\
    \ method=\"post\">\n{% csrf_token %}\n{{ form.as_p }}\n<button type=\"submit\"\
    >Sign up</button>\n</form>\n{% endblock %}\n```\n\nThis format is very similar\
    \ to what we've done before. We extend our base template at the top, place our\
    \ logic between <form></form> tags, use the csrf_token for security, display the\
    \ form's content in paragraph tags with form.as_p, and include a submit button.\n\
    \nWe're now done! To test it out, navigate to our newly created page:\n\nhttp://127.0.0.1:8000/accounts/signup/\n\
    \n![](img/593a0176e3a13ba5207237714df32537_173_0.png)\n\n## Django blog\n\nYou\
