    \ | <a href=\"{% url 'article_delete' article.pk %}\">Delete/</a></p>\n\n<p>Back\
    \ to <a href=\"{% url 'article_list' %}\">All Articles/</a>.</p>\n{% endblock\
    \ content %}\n```\n\n对于编辑和删除页面，我们可以使用 Bootstrap 按钮样式使编辑按钮变为浅蓝色，删除按钮变为红色。\n\n##\
    \ 代码\n\n```html\n<!-- templates/article_edit.html -->\n{% extends 'base.html'\
    \ %}\n\n{% block content %}\n<h1>Edit/</h1>\n<form action=\"\" method=\"post\"\
    >{% csrf_token %}\n  {{ form.as_p }}\n  <button class=\"btn btn-info ml-2\" type=\"\
    submit\">Update</button>\n</form>\n{% endblock %}\n```\n\n## 代码\n\n```html\n<!--\
    \ templates/article_delete.html -->\n{% extends 'base.html' %}\n\n{% block content\
    \ %}\n<h1>Delete/</h1>\n<form action=\"\" method=\"post\"> {{ csrf_token }}\n\
    <p>Are you sure you want to delete \"{{ article.title }}?\"</p>\n<button class=\"\
    btn btn-danger ml-2\" type=\"submit\">Confirm</button>\n</form>\n{% endblock %}\n\
    ```\n\n作为最后一步，我们可以在列表页的 `div card-footer...` 处添加编辑和删除链接。这些与添加到详情页的链接是相同的。\n\n\
    ## 代码\n\n```html\n<!-- templates/article_list.html -->\n...\n<div class=\"card-footer\
    \ text-center text-muted\">\n<a href=\"{% url 'article_edit' article.pk %}\">Edit</a>\
    \ |\n<a href=\"{% url 'article_delete' article.pk %}\">Delete</a>\n</div\n```\n\
    \n好了，我们准备好查看工作成果了。使用 `python manage.py run-server` 启动服务器并导航到 http://127.0.0.1:8000/articles/\
    \ 文章页面。点击第一篇文章上的“edit”链接，将被重定向到：\n\nhttp://127.0.0.1:8000/articles/1/edit/\n\n\
    # 第 13 章：报纸应用\n\n## 267\n\n![](img/593a0176e3a13ba5207237714df32537_271_0.png)\n\
    \n## 编辑页面\n\n如果你更新了“title”字段并点击 update（更新），你将被重定向到显示新更改的详情页。\n\n![](img/593a0176e3a13ba5207237714df32537_271_1.png)\n\
    \n## Hello world!（已编辑）\n\n作者 wsv | 2018年3月23日, 上午11:06\n\n这是我的第一篇文章。\n\n编辑 | 删除\n\
    \n返回所有文章。\n\n## 详情页\n\n如果你点击“Delete”（删除）链接，你将被重定向到删除页面。\n\n## 删除\n\n你确定要删除“Hello\
    \ world! (edited)” 吗？\n\n确认\n\n## 删除页面\n\n按下可怕的红色“Delete”（删除）按钮，你将被重定向到文章页面，现在那里只有两个条目。\n\
    \n![](img/593a0176e3a13ba5207237714df32537_272_0.png)\n\n## 文章页面两个条目\n\n## 创建页面\n\
    \n最后一步是为新文章创建一个创建页面，我们可以通过 Django 的 `CreateView` 来实现。我们的三个步骤是创建视图、URL 和模板。到目前为止，第\
    \ 13 章：报纸应用的流程应该让你非常熟悉了。\n\n在我们的 views 中，我们在顶部导入了 `Create`，并创建一个新类 `ArticleCreateView`，指定我们的模型、模板和字段。\n\
    \n## 代码\n\n```python\n# articles/views.py\n...\nfrom django.views.generic import\
    \ CreateView, UpdateView, DeleteView\n\nclass ArticleCreateView(CreateView):\n\
    \    model = models.Article\n    template_name = 'article_new.html'\n    fields\
    \ = ['title', 'body']\n```\n\n注意我们的字段中没有 `author`，因为我们希望将新文章与作者关联起来；然而，一旦文章被创建，我们不希望用户能够更改作者，这就是为什么\
    \ `UpdateView` 的字段是 `['title', 'body']`。\n\n更新我们的 `urls` 文件，为该视图添加新路由。\n\n## 代码\n\
    \n```python\n# articles/urls.py\n...\nurlpatterns = [\n    path('new/', ArticleCreateView.as_view(),\
    \ name='article_new'),\n    ...\n]\n```\n\n然后使用 ctrl+c 停止服务器，创建一个名为 `article_new.html`\
    \ 的新模板。\n\n## 命令行\n\n```\n(news) $ touch templates/article_new.html\n```\n\n并用以下\
    \ HTML 更新它。\n\n## 代码\n\n```html\n<!-- templates/article_new.html -->\n{% extends\
    \ 'base.html' %}\n\n{% block content %}\n  <h1>New article</h1>\n  <form action=\"\
    \" method=\"post\">{% csrf_token %}\n    {{ form.as_p }}\n    <button class=\"\
    btn btn-success ml-2\" type=\"submit\">Save</button>\n</form>\n{% endblock %}\n\
    ```\n\n作为最后一步，我们应该在导航栏中添加创建新文章的链接，以便登录用户可以在网站的任何地方访问。\n\n## 代码\n\n```html\n<!--\
    \ templates/base.html -->\n...\n<body>\n  <nav class=\"navbar navbar-expand-md\
    \ navbar-dark bg-dark mb-4\">\n    <a class=\"navbar-brand\" href=\"{% url 'home'\
    \ %}\">Newspaper</a>\n    {% if user.authenticated %}\n    <ul class=\"navbar-nav\
    \ mr-auto\">\n      <li class=\"nav-item\"><a href=\"{% url 'article_new' %}\"\
    >New</a></li>\n    </ul\n    {% endif %}\n    <button class=\"navbar-toggler\"\
    \ type=\"button\" data-toggle=\"collapse\" data-target=\"#navbarCollapse\" aria-controls=\"\
    navbarCollapse\" aria-expanded=\"false\" aria-label=\"Toggle navigation\">\n \
    \     <span class=\"navbar-toggler-icon\"></span>\n    </button>\n  </nav>\n</body>\n\
    ```\n\n并且为什么不用 Bootstrap 来改进我们的首页呢？我们可以如下所示更新 `home.html`。\n\n## 代码\n\n```html\n\
    <!-- templates/home.html -->\n{% extends 'base.html' %}\n\n{% block title %}Home{%\
    \ endblock %}\n\n{% block content %}\n\n<div class=\"jumbotron\">\n  <h1 class=\"\
    display-4\">Newspaper</h1>\n  <p class=\"lead\">A Newspaper website built with\
    \ Django.</p>\n  <p class=\"lead\">\n    <a class=\"btn btn-primary btn-lg\" href=\"\
    {% url 'article_list' %}\" role=\"button\">View All Articles</a>\n  </p>\n</div>\n\
    \n{% endblock %}\n```\n\n我们完成了。让我们确认一切都符合预期。再次启动服务器 `python manage.py run-server`\
    \ 并导航到我们的首页：\n\nhttp://127.0.0.1:8000/\n\n# 第 13 章：报纸应用\n\n![](img/593a0176e3a13ba5207237714df32537_277_0.png)\n\
    \n## 导航栏中有新链接的首页\n\n点击顶部导航栏中的“+ New”链接，你将被重定向到创建页面。\n\n# 第 13 章：报纸应用\n\n![](img/593a0176e3a13ba5207237714df32537_278_0.png)\n\
    \n## 新文章\n\n标题：\n\n正文：\n\n作者：\n\n## 创建页面\n\n放心地创建一个文章。然后点击“Save”按钮。你将被重定向到详情页。为什么？因为在我们的\
    \ `models.py` 文件中，我们将 `get_absolute_url` 方法设置为 `article_detail`。如果我们以后将详情页的 URL\
    \ 模式更改为 `articles/details/4/`，重定向仍然有效。与 `article_detail` 关联的路由将被使用；并没有硬编码路由本身。\n\
    \n# 第 13 章：报纸应用\n\n![](img/593a0176e3a13ba5207237714df32537_279_0.png)\n\n## 第\
    \ 4 篇文章\n\n作者 wsv | 2018年3月23日, 上午11:44\n\n这真的起作用了！\n\n编辑 | 删除\n\n返回所有文章。\n\n\
    ## 详情页\n\n注意这里 URL 中的主键是 4。尽管我们现在只显示三篇文章，但 Django 不会因为我们删除了其中一个就重新排列主键。在实践中，大多数真实的网站不会真正删除任何内容；相反，它们会隐藏被删除的字段，因为这有助于维护数据库的完整性，并在以后需要时提供“撤销删除的选项。在我们目前的方法中，一旦内容被删除，它就彻底消失了！\n\
    \n点击“All Articles”链接查看我们新的 /articles 页面。\n\n"
