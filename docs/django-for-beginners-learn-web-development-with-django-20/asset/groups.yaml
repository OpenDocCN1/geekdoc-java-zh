    that outputted to our command line console.


    # Custom emails


    The current email text isn''t very personal, is it? Let''s change things. At this
    point I could just show you what steps to take, but I think it''s helpful if I
    can explain how I figured out to do this. After all, you want to be able to customize
    all parts of Django as needed. In this case, I knew what Django was using by default
    but it wasn''t clear in the source code. And since all of Django''s source code
    is available on Github, we can just search for it.


    Chapter 12: Email


    Use the search bar and enter a few words from the email text. If you type "You
    are receiving this email" you will end up at this search page.


    # Github


    The first result is what we want. The code is located at django/contrib/templates/password_reset_email.html.
    That means in the contrib app the file we want is password_reset_email.html.


    Chapter 12: Email


    248


    Here is that default text from the Django source code.


    # Code


    ```

    {% load i18n %}{% escape %}


    {% blocktrans %}You''re receiving this email because you requested a password
    reset for your account at {{ site_name }}.{% endblock %}


    {% trans "Please go to the following page and choose a new password:" %}

    {% block reset_link %}

    {{ protocol }}:{{ domain }}{{ url ''password_reset_confirm'' token=token }}

    {% endblock %}


    {% trans "Your username, in case you''ve forgotten:" %}{{ user.get_username }}


    {% trans "Thanks for using our site!" %}


    {% blocktrans %}The {{ site_name }}{% endblock %}

    ```


    Let''s change it. We need to create a new password_reset_email.html file in our
    registration folder.


    # Command Line


