    # Class-Based Views


    Early versions of Django only shipped with function-based views, but developers
    soon found themselves repeating the same patterns over and again again. Write
    a view that lists all objects in a model. Write a view that displays only one
    detailed item from a model. And so on.


    Function-based generic views were introduced to abstract these patterns and stream-line
    development of common patterns. However there was no easy way to extend or customize
    these views. As a result, Django introduced class-based generic views that make
    it easy to use and also extend views covering common use cases.


    Classes are a fundamental part of Python but a thorough discussion of them is
    beyond the scope of this book. If you need an introduction or refresher, I suggest
    reviewing the official Python docs which have an excellent tutorial on classes
    and their usage.


    In our view we''ll use the built-in TemplateView to display our template. Update
    the pages/views.py file.'
