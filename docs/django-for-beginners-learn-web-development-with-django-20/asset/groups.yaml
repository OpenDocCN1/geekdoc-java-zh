    \ does execute the instructions in our migration files.\n\n## Command Line\n\n\
    ```\n(mb) $ python manage.py makemigrations posts\n(mb) python manage.py migrate\
    \ posts\n```\n\nNote that you don't have to include a name after either `makemigrations`\
    \ or `migrate`. If you run the commands then they will apply to all available\
    \ changes. But it's a good habit to be specific. If we had two separate apps in\
    \ our project and updated the models in both and then ran `makemigrations` it\
    \ would generate a migrations file containing data on both apps, making debugging\
    \ harder in the future. You want each migration file to be as small and isolated\
    \ as possible. That way if you need to look at past migrations, there is only\
