    # # Chapter 5: Blog app


    In this chapter we''ll build a Blog application that allows users to create, edit,
    and delete posts. The homepage will list all blog posts and there will be a dedicated
    detail page for each individual post. We''ll also introduce CSS for styling and
    learn how Django works with static files.


    # ## Initial Setup


    As covered in previous chapters, our steps for setting up a new Django project
    are as follows:


    +   * create a new directory for our code on the Desktop called blog

    * install Django in a new virtual environment

    * create a new Django project called blog_project

    * create a new app blog

    * perform a migration to set up the database

    * update settings.py


    Execute the following commands in a new command line console. Note that the actual
    name of the virtual environment will be (blog-XXX) where XXX represents random
    characters. I''m using (blog) here to keep things simpler since my name will differ
    from yours.


    Don''t forget to include the period . at the end of the command for creating our
    new blog_project.'
- md: "\n## Command Line\n\n```\n$ cd ~/Desktop\n$ mkdir blog\n$ cd blog\n$ pipenv\
    \ install django\n$ pipenv shell\n(blog) $ django-admin startproject blog_project\n\
    (blog) $ python manage.py startapp blog\n(blog) $ python manage.py migrate\n(blog)\
    \ $ python manage.py runserver\n```\n\nTo ensure Django knows about our new app,\
    \ open your text editor and add the new app to INSTALLED_APPS in our settings.py\
