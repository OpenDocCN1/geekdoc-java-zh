    \n## 结论\n\n恭喜你！我们在这一章中涵盖了许多基础概念。我们构建了第一个 Django 应用，并学习了 Django 的项目/应用结构。\n\n我们开始学习视图\
    \ (views)、URL (urls) 和内部 Web 服务器。我们还使用 git 来跟踪更改，并将代码推送到私有仓库中。\n\n恭喜你！我们在这一章中涵盖了许多基础概念。我们构建了第一个\
    \ Django 应用，并学习了 Django 的项目/应用结构。\n\n我们开始学习视图 (views)、URL (urls) 和内部 Web 服务器。我们还使用\
    \ git 来跟踪更改，并将代码推送到私有仓库中。\n\n## 第3章：Pages 应用\n\n在本章中，我们将构建、测试并部署具有首页和关于页面的 Pages\
    \ 应用。我们还将学习类视图。\n\n## 初始化设置\n\n如第 2 章：Hello World 应用所示，初始化涉及以下：\n\n- 创建环境\n- 安装\
    \ django\n- 创建项目\n- 创建 pages 应用\n- 更新 settings.py\n\n## 命令行\n\n```bash\n$ cd Desktop\n\
    $ mkdir pages\n$ pipenv install\n$ pipenv shell\n$ django-admin startproject pages_project\n\
    $ python manage.py startapp pages\n```\n\n```bash\n(helloworld) $ python manage.py\
    \ runserver\n```\n\n然后导航到 http://127.0.0.1:8000/。\n\n![](img/593a0176e3a13ba5207237714df32537_45_0.png)\n\
    \n安装成功！恭喜！\n\n你看到这个页面是因为设置文件中开启了 `DEBUG=True`，且你尚未配置任何 URL。\n\n- Django 文档：主题、参考和指南\n\
    - 教程：投票应用程序\n- Django 社区：联系、获取帮助或贡献\n\n## 模板\n\n每个 Web 框架都需要一种方便生成 HTML 文件的方法。在\
    \ Django 中，方法是使用模板，以便由视图为指定的页面提供服务。\n\n这个模式值得重复，因为你将在 Django 开发中反复遇到它：模板、视图和 URL。你创建它们的顺序并不重要，因为这三者都是必不可少的且紧密工作的。URL\
    \ 控制初始路由（例如 /about），视图包含逻辑或“内容”，而模板包含 HTML。对于依赖数据库模型的 Web 页面，视图决定了哪些数据可用。\n\n\
    所以：模板、视图、URL。这种模式适用于你制作的每一个 Django 页面。然而，需要一些重复才能将其内化。\n\n好了，继续。模板目录放置的位置可能会让学者感到困惑。默认情况下，Django\
    \ 在每个应用内部查找模板。在我们的 pages 应用中，它期望在以下位置找到 home.html 模板：\n\n- pages\n  - templates\n\
    \    - pages\n      - home.html\n\n这意味着我们需要创建一个 templates 目录、一个与应用同名的目录 pages，最后是我们的模板本身\
    \ home.html。\n\n一个常见问题是：为什么要这种重复的结构？简单来说，是因为 Django 模板加载器想要确保找到正确的模板，这就是它被设计查找的方式。\n\
    \n幸运的是，Django 项目的模板结构还有另一种常用的方法。那种方法是创建一个项目级的 templates 目录，供所有应用使用。我们将采用这种方法。通过对...微调\n\
    \n"
