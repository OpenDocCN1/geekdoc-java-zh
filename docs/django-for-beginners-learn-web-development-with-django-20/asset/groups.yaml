    \ views.SignUpView.as_view(), name='signup'),\n]\n```\n\n我们正在使用一个尚未创建的视图 `SearchView`，由于它是大字母大写且带有\
    \ `as_view()` 后缀，我们已经知道它是类视图。它的路径是 `signup/`，因此整个路径为 `accounts/signup`。\n\n现在处理使用内置\
    \ `UserCreationForm` 和通用 `CreateView` 的视图。\n\n## 代码\n\n```python\n# accounts/views.py\n\
    \nfrom django.contrib.auth.forms import UserCreationForm\n\nfrom django.urls import\
