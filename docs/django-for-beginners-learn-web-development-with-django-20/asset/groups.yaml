- md: "\n## Chapter 10: Bootstrap\n\nSince we have urls, templates, and views for\
    \ each of our two new pages we'll add tests for each. Django's SimpleTestCase\
    \ will suffice for testing the homepage but the signup page uses the database\
    \ so we'll need to use TestCase too.\n\nHere's what the code should look like\
    \ in your pages/tests.py file.\n\n# Code\n\n```python\n# pages/tests.py\nfrom\
    \ django.contrib.auth import get_user_model\nfrom django.test import SimpleTestCase,\
    \ TestCase\nfrom django.urls import reverse\n```\n\nclass HomePageTests(SimpleTestCase):\n\
    \n```python\ndef test_home_page_status_code(self):\n    response = self.client.get('/')\n\
    \    self.assertEqual(response.status_code, 200)\n```\n\n```python\ndef test_view_url_by_name(self):\n\
    \    response = self.client.get(reverse('home'))\n    self.assertEqual(response.status_code,\
    \ 200)\n```\n\n```python\ndef test_view_uses_correct_template(self):\n    response\
    \ = self.client.get(reverse('home'))\n    self.assertEqual(response.status_code,\
    \ 200)\n    self.assertTemplateUsed(response, 'home.html')\n```\n\nclass SignupPageTests(TestCase):\n\
    \n```python\nusername = 'newuser'\nemail = 'newuser@email.com'\n```\n\n```python\n\
    def test_signup_page_status_code(self):\n    response = self.client.get('/users/signup/')\n\
    \    self.assertEqual(response.status_code, 200)\n```\n\n```python\ndef test_view_url_by_name(self):\n\
    \    response = self.client.get(reverse('signup'))\n    self.assertEqual(response.status_code,\
    \ 200)\n```\n\n```python\ndef test_view_uses_correct_template(self):\n    response\
    \ = self.client.get(reverse('signup'))\n    self.assertEqual(response.status_code,\
    \ 200)\n    self.assertTemplateUsed(response, 'signup.html')\n```\n\n```python\n\
    def test_signup_form(self):\n    new_user = get_user_model().objects.create_user(\n\
    \        self.username, self.email\n    )\n    self.assertEqual(get_user_model().objects.all().count(),\
    \ 1)\n    self.assertEqual(get_user_model().objects.all()[0].username, self.username)\n\
    \    self.assertEqual(get_user_model().objects.all()[0].email, self.email)\n```\n\
    \nOn the top line we use get_user_model() to reference our custom user model.\
    \ Then for both pages we test three things:\n\n- the page exists and returns a\
    \ HTTP 200 status code\n- the page uses the correct url name in the view\n- the\
    \ proper template is being used\n\nOur signup page also has a form so we should\
    \ test that, too. In the test test_signup_form we're verifying that when a username\
    \ and email address are POSTed (sent to the database), they match what is stored\
    \ on the CustomUser model.\n\nQuit the local server with control+c and then run\
    \ our tests to confirm everything passes.\n\n# Command Line\n\n```bash\n(news)\
    \ $ python manage.py test\n```\n\n## Bootstrap\n\nIf you've never used Bootstrap\
    \ before you're in for a real treat. It accomplishes much in so little code.\n\
    \nThere are two ways to add Bootstrap to a project: you can download all the files\
    \ and serve them locally or rely on a Content Delivery Network (CDN). The second\
    \ approach is simpler to implement provided you have a consistent internet connection\
    \ that's what we'll use.\n\nBootstrap comes with a starter template that includes\
    \ the basic files needed. Notably there are four that we incorporate:\n\n- Bootstrap.css\n\
    - jQuery.js\n- Popper.js\n- Bootstrap.js\n\nHere's the updated base.html file\
    \ should look like. Generally you should type all code examples yourself but as\
    \ this is one is quite long, it's ok to copy and paste here.\n\n# Code\n\n```html\n\
    <!-- templates/base.html -->\n<!doctype html>\n<html lang=\"en\">\n<head>\n  <!--\
    \ Required meta tags -->\n  <meta charset=\"utf-8\">\n  <meta name=\"viewport\"\
    \ content=\"width=device-width, initial-scale=1, shrink-fit=no\">\n\n  <!-- Bootstrap\
    \ CSS -- -->\n  <link rel=\"stylesheet\" href=\"https://maxcdn.bootstrap.com/bootstrap/4.0.0/css/bootstrap.min.css\"\
    \ integrity=\"sha384-Gn5384xkQ1aoWXA+058RPxPg6fy4IVWtNH0E2-G3XMfCJlLSawiggFAW/dAIS6Xm\"\
    \ crossorigin=\"anonymous\">\n</head>\n<body>\n  <h1>Hello, world!</h1>\n\n  <!--\
    \ Optional JavaScript -- -->\n  <!-- jQuery first, then Popper.js, then Bootstrap\
    \ JS -->\n  <script src=\"https://code.jquery.com/jquery-3.2.1.slim.min.js\" integrity=\"\
    sha384-KJ30d2TktIvyYIK3UENzM7KckRr/rE9/Pq6aAZGjwFDMVNA/GpGF93hXp5KKKN\" crossorigin=\"\
    anonymous\"></script>\n  <script src=\"https://cdn.cloudflare.com/ajax/libs/popper.js/1.12.9/umd/popper.js\"\
    \ integrity=\"sha384-ApnBgb9H+Y1Qtv3R7W3mgPxhU9QcSqsApT7HUibX39j7fakFPskvXusvfa0b4Q\"\
    \ crossorigin=\"anonymous\"></script>\n  <script src=\"https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js\"\
    \ integrity=\"sha384-JZR6Spejh4U02d8j0t6vLEHfe/JQGIRRSQQxSFWpi1MQuvDayAyUar5+76PCmVl\"\
    \ crossorigin=\"anonymous\"></script>\n</body>\n</html>\n```\n\nIf you start the\
    \ server again with python manage.py runserver and refresh the homepage at http://127.0.0.1:8000/\
    \ you'll see that the font size has changed. Let's add a navigation bar at the\
    \ top of the page which contains our links for homepage, logout, and signup. Notably\
    \ we can use if/else tags in Django templating engine to add some logic. We want\
    \ to show \"log in\" and \"sign up\" button to users who are logged out, \"log\
    \ out\" and \"change password\" button to users logged in. Here's where the code\
    \ looks like. Again, it's ok to copy/paste here since the focus of this book is\
    \ learning HTML, CSS, and Bootstrap.\n\n# Code\n\n```html\n<!-- templates/base.html\
    \ -->\n<!doctype html>\n<html lang=\"en\">\n<head>\n  <!-- Required meta tags\
    \ -->\n  <meta charset=\"utf-8\">\n  <meta name=\"viewport\" content=\"width=device-width,\
    \ initial-scale=1, shrink-fit=no\">\n  <!-- Bootstrap CSS -- -->\n  <link rel=\"\
    stylesheet\" href=\"https://maxcdn.bootstrap.com/bootstrap/4.0.0/css/bootstrap.min.css\"\
    \ integrity=\"sha384-Gn5384xkQ1aoWXA+058RPxPg6fy4IVWtNH0E2-G3XMfCJlLSawiggFAW/dAIS6Xm\"\
    \ crossorigin=\"anonymous\">\n  <title>{% block title %}Newspaper App{% endblock\
    \ %}</title>\n</head>\n<body>\n  <nav class=\"navbar navbar-expand-md navbar-dark\
    \ bg-dark mb-4\">\n    <a class=\"navbar-brand\" href=\"{% url 'home' %}\">Newspaper</a>\n\
    \    <button class=\"navbar-toggler\" type=\"button\" data-toggle=\"collapse\"\
    \ data-target=\"#navbarCollapse\" aria-controls=\"navbarCollapse\" aria-expanded=\"\
    false\" aria-label=\"Toggle navigation\">\n      <span class=\"navbar-toggler-icon\"\
