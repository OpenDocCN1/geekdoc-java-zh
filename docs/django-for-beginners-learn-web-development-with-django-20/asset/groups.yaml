    - `migrations/` 用于跟踪我们 `models.py` 文件的任何更改，以确保我们的数据库和 `models.py` 保持同步\n- `models.py`\
    \ 是我们定义数据库模型的地方，Django 会自动将它们翻译成数据库表\n- `tests.py` 用于我们应用的特定测试\n- `views.py` 是我们处理\
    \ Web 应用请求/响应逻辑的地方\n\n尽管我们的新应用存在于 Django 项目中，但在我们显式添加它之前，Django 并并不“知道”它。在你的文本编辑器中打开\
    \ `settings.py` 文件，并滚动到 `INSTALLED_APPS`，你会在那里看到已经存在的内置的 Django 应用。\n\n```python\n\
    INSTALLED_APPS = [\n    'django.contrib.admin',\n    'django.contrib.auth',\n\
    \    'django.contrib.contenttypes',\n    'django.contrib.sessions',\n    'django.contrib.messages',\n\
    \    'django.contrib.staticfiles',\n    'pages',\n]\n```\n\n## 视图 (Views)\n\n\
    在 Django 中，视图决定了显示的内容。让我们先通过更新 `views.py` 文件来实现：\n\n```python\n# pages/views.py\n\
    from django.http import HttpResponse\n\ndef homeView(request):\n    return HttpResponse('Hello,\
    \ World!')\n```\n\n基本上我们是在当 `homeView` 被调用时返回“Hello, World!”。现在我们需要配置 URL。在 `pages`\
    \ 应用中创建一个新的 `urls.py` 文件。\n\n### 命令行\n\n```\n(helloworld) $ touch pages/urls.py\n\
    ```\n\n将其更新为以下代码：\n\n```python\n# pages/urls.py\nfrom django.urls import path\n\
    from . import views\n\nurlpatterns = [\n    path('', views.homeView, name='home')\n\
    ]\n```\n\n在第一行我们从 Django 导入了 `path` 来构建我们的路由模式，在另一行我们导入了 views。这里使用的点 `.` 意味着引用当前目录，即我们的\
    \ `pages` 应用。我们的路由模式包含三个部分：\n\n- 针对空字符串 `''` 的 Python 正则表达式\n- 指定视图 `homeView`\n\
    - 添加一个可选的 URL 名称 `'home'`\n\n换句话说，如果用户请求由空字符串 `''` 表示的首页，我们将使用该视图。我们快完成了。最后一步是也要配置项目级的\
    \ `urls.py` 文件。记住，一个 Django 项目中通常会有多个应用，因此每个应用都需要自己的路由。更新 `helloworld_project/urls.py`\
    \ 文件如下：\n\n```python\n# helloworld_project/urls.py\nfrom django.contrib import\
    \ admin\nfrom django.urls import path, include\n\nurlpatterns = [\n    path('admin/',\
    \ admin.site.urls),\n    path('', include('pages.urls')),\n]\n```\n\n我们在第二行 `path`\
    \ 旁边导入了 `include`，然后为我们的 `pages` 应用创建了新的路由模式。现在，每当用户访问 `/` 首页时，他们会被路由到 `pages`\
    \ 应用，然后到 `homeView`。\n\n对于初学者来说，经常困惑的是我们在这里不需要导入 `pages` 应用，但我们在路由模式中以 `pages.urls`\
    \ 引用了它。我们之所以这样做是因为 `django.urls.include()` 方法期望我们传入一个模块、应用或作为第一个参数。如果不使用 `include`，我们就必须导入我们的\
    \ `pages` 应用，但由于我们使用了 `include`，在项目级别就不需要了！\n\n# 好，世界！\n\n我们现在拥有了所有需要的代码！为了确认一切按预期工作，请重启我们的\
    \ Django 服务器：\n\n"
