    \nfrom django.contrib import admin\nfrom .models import Post\n\nadmin.site.register(Post)\n\
    ```\n\n如果你刷新页面，你将看到更新。\n\n![](img/593a0176e3a13ba5207237714df32537_105_0.png)\n\
    \n## 第 5 章：博客应用\n\n![](img/593a0176e3a13ba5207237714df32537_106_0.png)\n\n## 管理首页\n\
    \n让我们添加两篇博客文章，以便我们有一些示例数据可以使用。点击 Posts 旁边的 + Add 按钮创建一个新条目。确保为每篇文章都添加一个“author”，因为默认情况下所有模型字段都是必填的。如果你尝试输入没有作者的帖子，将看到错误。如果我们想更改这一点，可以为模型添加字段选项，使某个特定字段变为可选，或者为其填充默认值。\n\
    \n## 第 5 章：博客应用\n\n![](img/593a0176e3a13ba5207237714df32537_107_0.png)\n\n## 管理第一篇文章\n\
    \n## 添加文章\n\n![](img/593a0176e3a13ba5207237714df32537_108_0.png)\n\n## 管理第二篇文章\n\
    \n## 第 5 章：博客应用\n\n![](img/593a0176e3a13ba5207237714df32537_109_0.png)\n\n## 带有两篇文章的管理首页\n\
    \n现在我们的数据库模型已经完成，我们需要创建必要的视图（views）、URL 和模板（templates），这样我们就可以在 Web 应用程序上显示信息。\n\
    \n## URLs\n\n我们希望在首页显示博客文章，所以与之前的章节一样，我们将首先配置项目级的 URL 配置（URLConfs），然后配置应用级的 URL\
    \ 配置来实现这一目标。注意，“项目级”意味着在与 `blog_project` 和 `blog` 文件夹相同的文件夹中。\n\n在命令行中使用 `Control-c`\
    \ 退出现有服务器，并在我们的 blog 目录下创建一个新的 `urls.py` 文件：\n\n## 命令行\n\n```\n(blog) $ touch\
    \ urls.py\n```\n\n现在使用下面的代码更新它。\n\n```python\n# blog/urls.py\nfrom django.urls\
    \ import path\nfrom . import views\n\nurlpatterns = [\n    path('', views.BlogListView.as_view(),\
    \ name='home'),\n]\n```\n\n我们在顶部导入了即将创建的视图。空字符串 `''` 告诉 Python 匹配所有值，我们将其命名为 `home`\
    \ 的 URL，稍后我们可以在视图中引用它。虽然添加命名的 URL 是可选的，但这是我们应该采用的最佳实践，因为随着 URL 数量的增加，它可以保持条理清晰。\n\
    \n我们还应该更新项目的 `urls.py` 文件，使其知道将所有请求直接转发到 blog 应用。\n\n## 代码\n\n```python\n# blog_project/urls.py\n\
    \nfrom django.contrib import admin\nfrom django.urls import path, include\n\n\
    urlpatterns = [\n    path('admin/', admin.site.urls),\n    path('', include('blog.urls')),\n\
    ]\n```\n\n## 视图\n\n我们将使用基于类的视图（class-based views），但如果你想看基于函数的方法构建博客应用，我强烈推荐 Django\
    \ Girls 教程。它非常棒。\n\n在我们的视图中，添加以下代码使用 `ListView` 显示我们的 `Post` 模型的内容。\n\n```python\n\
    # blog/views.py\n\nfrom django.views.generic import ListView\nfrom .models import\
    \ Post\n\nclass BlogListView(ListView):\n    model = Post\n    template_name =\
    \ 'home.html'\n```\n\n在开头两行，我们导入了 `ListView` 和我们的数据库模型 `Post`。然后我们子类 `ListView`\
    \ 并添加我们的模型和模板。与从零实现相比，这节省了大量的代码。\n\n## 模板\n\n有了 URL 配置和视图，我们现在缺少拼图的第三部分：模板。正如我们在第\
    \ 4 章看到的，我们可以继承其他模板以保持代码整洁。我们将从一个 `base.html` 文件和一个继承自它的 `home.html` 文件开始。等稍后当我们添加创建和编辑博客文章的模板时，它们也可以继承\
    \ `base.html`。\n\n首先创建项目级的模板目录和两个模板文件。\n\n## 命令行\n\n```\n(blog) $ mkdir templates\n\
    (blog) $ touch templates/base.html\n(blog) $ touch templates/home.html\n```\n\n\
    然后更新 `settings.py` 让 Django 知道从那里查找我们的模板。\n\n## 代码\n\n```python\n# blog_project/settings.py\n\
    TEMPLATES = [\n{\n  ...\n  'DIRS': [os.path.join(BASE_DIR, 'templates')],\n  ...\n\
    },\n]\n```\n\n然后按照如下所示更新 `base.html` 模板。\n\n## 代码\n\n```html\n<!-- templates/base.html\
    \ -->\n<html>\n<head>\n  <title>Django blog</title>\n</head>\n<body>\n  <header>\n\
    \  <h1><a href=\"/\">Django blog</a></h1>\n  </header>\n</body>\n</html>\n```\n\
    \n"
