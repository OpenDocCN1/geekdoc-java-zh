- md: "\n# Chapter 15: Comments\n\nDjango has a built-in syntax we can use as FOO_set\
    \ where FOO is the lowercase source model name. So for our Article model we can\
    \ use article_set to access all instances of the model.\n\nBut personally I strongly\
    \ dislike this syntax as I find it confusing and non-intuitive. A better approach\
    \ is to add a related_name attribute to our model which lets us explicitly set\
    \ the name of this reverse relationship instead. Let's do that.\n\nTo start, add\
    \ a related_name attribute to our comment model. A good default is to name the\
    \ plural of the model holding the ForeignKey.\n\n# Code\n\n```python\n# articles/models.py\n\
    ...\nclass Comment(models.Model):\n    article = models.ForeignKey(\n        Article,\n\
    \        on_delete=models.CASCADE,\n        related_name='comments' # new\n  \
    \  )\n```\n\nSince we just made a change to our database model we need to create\
    \ migrations file and update the database. Stop the local server with Control+c\
    \ and execute the following two commands. Then spin up the server again as we\
    \ will be using it shortly.\n\n# Command Line\n\n```bash\n(news) $ python manage.py\
    \ makemigrations articles\n(news) $ python manage.py migrate\n(news) $ python\
    \ manage.py runserver\n```\n\nUnderstanding queries takes some time so don't be\
    \ concerned if the idea of reverse relationships is confusing. I'll show you how\
    \ to implement the code as desired. And once you've mastered these basic cases\
    \ you can explore how to filter your querysets in great detail so they return\
    \ the information you want.\n\nIn our article_list.html file we can add our comments\
    \ to the card-footer. Note that I've moved our edit and delete links into card-body.\
    \ To access each comment we're calling comments.all which means first at the article\
    \ model, then comments which is the related name of the entire Comment model,\
    \ and select all included. It can take a little while to become accustomed to\
    \ this syntax for referencing foreign key data in a template!\n\n# Code\n\n```html\n\
    <!-- template/article_list.html -->\n{% extends 'base.html' %}\n\n{% block title\
    \ %}Articles{% endblock content %}\n\n{% block content %}\n{% for article in object_list\
    \ %}\n<div class=\"card\">\n  <div class=\"card-header\">\n    <span class=\"\
    font-weight-bold\">{{ article.title }}</span>&middot;\n    <span class=\"text-muted\"\
    >by {{ article.author }} | {{ article.date }}</span>\n  </div>\n  <div class=\"\
    card-body\">\n    <p>{{ article.body }}</p>\n    <a href=\"{% url 'article_edit'\
    \ article.pk %}\">Edit</a> |\n    <a href=\"{% url 'article_delete' article.pk\
    \ %}\">Delete</a>\n  </div>\n  <div class=\"card-footer\">\n    {% for comment\
    \ in article.comments.all %}\n    <p>\n      <span class=\"font-weight-bold\"\
    >{{ comment.author }}</span>&middot;\n      {{ comment.text }}\n    </p>\n   \
    \ {% endfor %}\n  </div>\n</div>\n<br />\n{% endfor %}\n{% endblock content %}\n\
    ```\n\nIf you refresh the articles page at http://127.0.0.1:8000/articles/ we\
    \ can see our new comment displayed on the page.\n\n![](img/593a0176e3a13ba5207237714df32537_303_0.png)\n\
    \n# Articles page with comments\n\nYoohoo! It works. We can see both comments\
    \ listed underneath the initial message.\n\n# Conclusion\n\nWith more time we\
    \ would focus on forms now so a user could write a new article directly on the\
    \ articles/ page as well as add comments too. The main focus of this chapter is\
    \ to demonstrate how foreign key relationships work in Django.\n\nOur Newspaper\
    \ app is now complete. It is a robust user authentication flow including the use\
    \ of email for password resets. We are also using a custom user model so if we\
    \ want to add additional fields to our CustomUser model it is as simple as adding\
