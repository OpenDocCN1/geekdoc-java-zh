- md: "\n## Chapter 5: Blog app\n\n## 121\n\nAll blog post entries will start with\
    \ post/. Next is the primary key for our post entry which will be represented\
    \ as an integer <int:pk>. What's the primary key you're probably asking? Django\
    \ automatically adds an auto-incrementing primary key to our database models.\
    \ So while we only declared the fields title, author, and body on our Post model,\
    \ under-the-Django added another field called id, which is our primary key. We\
    \ can access it as id or pk.\n\nThe pk for our first “Hello, World” is post 1.\
    \ For the second post, it is 2. And so on. Wherever we go to the individual entry\
    \ page for our first post, we can expect its urlpattern will be post/1.\n\nNote:\
    \ Understanding how primary key works with DetailView is a very common place of\
    \ confusion for beginners. It's worth re-reading the previous two paragraphs a\
    \ few times if it doesn't click. With practice it will become second.\n\nIf you\
    \ now start up the server with `python manager.py runserver` and go directly to\
    \ `http://127.0.0.1:8000/post/1/` you will see a decorated page for your first\
    \ blog post.\n\n![](img/593a0176e3a13ba5207237714df32537_125_0.png)\n\n## Django\
    \ blog\n\n## Hello world!\n\nMy first blog post. Woohoo!\n\n## Blog post one detail\n\
    \nWoohoo! You can also go to `http://127.0.0.1:8000/post/2/` to see the second\
    \ entry.\n\nTo make our life easier, we should update the link on the homepage\
    \ so we can directly access individual blog posts from there. Currently in home.html\
    \ our link is empty: `<a href=\"\">` Update to `<a href=\"{% url 'post_detail'\
    \ post.pk %}\">`,\n\n## Code\n\n```html\n<!-- templates/home.html -->\n{% extends\
    \ 'base.html' %}\n\n{% block content %}\n{% for post in object_list %}\n<div class=\"\
    post-entry\">\n<h2><a href=\"{% url post_detail post.pk %}\">{{ post.title }}</a></h2>\n\
    <p>{{ post.body }}</p>\n</div>\n{% endfor %}\n{% endblock content %}\n```\n\n\
    We start off by telling our Django template we want to reference a URLConf by\
    \ using the code `{% url ... %}`. Which URL? The one named post_detail, which\
    \ is the name we get BlogDetailView in our URLConf just moment ago. If we look\
    \ at post_detail in our URLConf, we see that it expects to be passed an argument\
    \ pk representing the primary key for the blog post. Fortunately, Django has already\
    \ created and included this pk field on our post object. We pass it into the URLConf\
