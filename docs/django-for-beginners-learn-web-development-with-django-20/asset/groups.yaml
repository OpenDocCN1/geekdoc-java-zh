- md: "\n# Conclusion\n\nIn a small amount of code we've built a blog application\
    \ that allows for creating, reading, updating, and deleting blog posts. This core\
    \ functionality is known by the acronym CRUD: Create-Read-Update-Delete. While\
    \ there are multiple ways to achieve this same functionality–we could have used\
    \ function-based views or written our own class-based views–we've demonstrated\
    \ how little code it takes in Django to make this happen.\n\nIn the next chapter\
    \ we'll add user accounts and login, logout, and signup functionality.\n\n# Chapter\
    \ 7: User Accounts\n\nSo far we've built a working blog application that uses\
    \ forms, but we're missing a major piece of most web applications: user authentication.\n\
    \nImplementing proper user authentication is famously hard; there are many security\
    \ gotchas along the way so you really don't want to implement this yourself. Fortunately\
    \ Django comes with a powerful, built-in user authentication system that we can\
    \ use.\n\nWhenever you create a new project, by default Django installs the auth\
    \ app, which provides us with a User object containing:\n\n- username\n- password\n\
    - email\n- first_name\n- last_name\n\nWe will use this User object to implement\
    \ login, logout, and signup in our blog application.\n\n# Login\n\nDjango provides\
    \ us with a default view for a login page via LoginView. All we need to add a\
    \ project-level urlpattern for the auth system, a login template, and a small\
    \ update to our settings.py file.\n\nFirst update the project-level urls.py file.\
    \ We'll place our login and logout pages at the accounts/ URL. This is a one-line\
    \ addition on the next-to-last line.\n\n# Code\n\n```\n# blog_project/urls.py\n\
    from django.contrib import admin\nfrom django.urls import path, include\n\nurlpatterns\
    \ = [\n    path('admin/', admin.site.urls),\n    path('accounts/', include('django.contrib.auth.urls')),\n\
    \    path('', include('blog.urls')),\n]\n```\n\nThe LoginView documentation notes,\
    \ by default Django will look within a templates folder called registration for\
    \ a file called login.html for a login form. So we need to create a new directory\
    \ called registration and the requisite file within it. From the command line\
    \ type control-C to quit our local server. Then enter the following:\n\n# Command\
    \ Line\n\n```\n(blog) $ mkdir templates/registration\n(blog) $ touch templates/registration/login.html\n\
    ```\n\nNow type the following template code for our newly-created file.\n\n# Code\n\
    \n```html\n<!-- templates/registration/login.html -->\n{% extends 'base.html'\
    \ %}\n```\n\n{% block content %}\n<h2>Login</h2>\n<form method=\"post\">\n  {%\
    \ csrf_token %}\n  {{ form.as_p }}\n  <button type=\"submit\">Login</button>\n\
    </form>\n{% endblock content %}\n```\n\nWe're using HTML `<form>` tags and specifying\
    \ the POST method since we're sending data to the server (we'd use GET if we were\
    \ requesting data, such as in a search engine). We add `{% csrf_token %}` for\
    \ security concerns, namely to prevent an XSS Attack. The form's contents are\
    \ outputted between paragraph tags thanks to `{{ form.as_p }}` and then we add\
    \ a “submit” button.\n\nThe final step is to specify where to redirect the user\
    \ upon a successful login. We can set this with the LOGIN_REDIRECT_URL setting.\
    \ At the bottom of the settings.py file add the following:\n\n# Code\n\n```python\n\
    # settings.py\nLOGIN_REDIRECT_URL = 'home'\n```\n\nNow the user will be redirected\
    \ to the 'home' template which is our homepage.\n\nWe're actually done at this\
    \ point! If you now start up the Django server again with python manage.py runserver\
    \ and navigate to our login page:\n\n# http://127.0.0.1:8000/accounts/login/\n\
    \nYou'll see the following:\n\n![](img/593a0176e3a13ba5207237714df32537_163_0.png)\n\
    \n# Django blog\n\n# Login\n\nUsername:\nPassword:\n[Login]\n\n# Login page\n\n\
    Upon entering the login info for our superuser account, we are redirected to the\
    \ homepage. Notice that we didn't add any view logic or create a database model\
    \ because the Django auth system provided both for us automatically. Thanks Django!\n\
    \n# Updated homepage\n\nLet's update our base.html template so we display a message\
    \ to users whether they are logged in or not. We can use the is_authenticated\
    \ attribute for this.\n\nFor now, we can simply place this code in a prominent\
    \ position. Later on we can style it more appropriately. Update the base.html\
    \ file with new code starting beneath the closing </header> tag.\n\n# Code\n\n\
    ```html\n<!-- templates/base.html -->\n...\n</header>\n{% if user.is_authenticated\
    \ %}\n<p>Hi {{ user.username }}</p>\n{% else %}\n<p>You are not logged in.</p>\n\
    <a href=\"{% url 'login' %}\">login</a>\n{% endif %}\n{% block content %}\n{%\
    \ endblock content %}\n```\n\nIf the user is logged in we say hello to them by\
    \ name, if not we provide a link to our newly created login page.\n\n# Django\
    \ blog\n\nHi wsv!\n\n# Goals today\n\nLearn Django and build a blog application.\n\
    \n# 3rd post\n\nI wonder if this will work?\n\n# Is this form working?\n\nYes\
    \ it is!\n\n# Homepage logged in\n\nIt worked! My superuser name is wsv so that's\
    \ what I see on the page.\n\n# Logout link\n\nWe added template page logic for\
    \ logged out users...how do we log out now? We could go into the Admin panel and\
    \ do it manually, but there's a better way. Let's add a logout link instead that\
    \ redirects to the homepage. Thanks to the Django auth system, this is dead-simple\
    \ to achieve.\n\nIn our base.html file add a one-line `{% url 'logout' %}` link\
    \ for logging out.\n\n# Command Line\n\n```html\n<!-- templates/base.html -->\n\
    ...\n{% if user.is_authenticated %}\n<p>Hi {{ user.username }}</p>\n<p><a href=\"\
    {% url 'logout' %}\">logout</a></p>\n{% else %}\n...\n```\n\nThat's all we need\
    \ to do as the necessary view is provided to us by the Django auth system. We\
    \ do need to specify where to redirect upon logout though. Update settings.py\
    \ to provide a redirect link appropriately as follows:\n\n# Code\n\n```python\n\
    # settings.py\nLOGIN_REDIRECT_URL = 'home'\nLOGOUT_REDIRECT_URL = 'home'\n```\n\
    \nIf you refresh the homepage you'll see it now has a “logout” link for logged\
    \ in users.\n\n![](img/593a0176e3a13ba5207237714df32537_167_0.png)\n\n# Django\
    \ blog\n\nHi wsv!\n\n[logout]\n\n# Goals today\n\nLearn Django and build a blog\
    \ application.\n\n# 3rd post\n\nI wonder if this will work?\n\n# Is this form\
    \ working?\n\nYes it is!\n\n# Homepage logout\n\nGo ahead and try logging in and\
    \ out several times with your user account.\n\n# Signup\n\nWe need to write our\
    \ own view for a signup page to register new users, but Django provides us with\
    \ a form class, UserCreationForm, to make things easier. By default it comes with\
    \ three fields: username, password1, and password2.\n\nThere are many ways to\
    \ organize your code and url structure for a robust user authentication system.\
    \ Here we will create a dedicated new app, accounts, for our signup page.\n\n\
    # Command Line\n\n```\n(blog) $ python manage.py startapp accounts\n```\n\nAdd\
    \ the new app to the INSTALLED_APPS setting in our settings.py file.\n\n# Code\n\
    \n```python\n# blog_project/settings.py\nINSTALLED_APPS = [\n    'django.contrib.admin',\n\
    \    'django.contrib.auth',\n    'django.contrib.contenttypes',\n    'django.contrib.sessions',\n\
    \    'django.contrib.messages',\n    'django.contrib.staticfiles',\n    'blog',\n\
    \    'accounts'\n]\n```\n\nNext add a project-level url pointing to this new app\
