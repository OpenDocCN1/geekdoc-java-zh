    \ 'email')` 以要求用户名/邮箱/密码。我们不需要包含密码字段，因为它是必填的！但所有其他字段都可以按照我们的意进行配置。\n\n# 代码\n\n\
    ```python\n# users/forms.py\n...\nclass CustomUserCreationForm(UserCreationForm):\n\
    \    class Meta(UserCreationForm.Meta):\n        model = CustomUser\n        fields\
    \ = ('username', 'email', ) # 新\n```\n\n```python\nclass CustomUserChangeForm(UserChangeForm):\n\
    \    class Meta:\n        model = CustomUser\n        fields = ('username', 'email',\
    \ ) # 新\n```\n\n现在，如果你再次尝试 http://127.0.0.1:8000/users/signup/ 注册页面，你就能看到额外的“邮箱地址（Email\
    \ address）”字段在那里了。\n\n## 第9 章：用户认证\n\n202\n\n![](img/593a0176e3a13ba5207237714df32537_206_0.png)\n\
    \n# 注册\n\n用户名：必填。150 个字符以内。仅限字母、数字和 @/#/-/-/-_。\n\n邮箱地址：\n\n密码：\n\n- 你的密码不能与你的其他个人信息太相似。\n\
    - 你的密码必须包含 8 个字符。\n- 你的密码不能是常用密码。\n- 你的密码不能全是数字。\n\n确认密码：输入相同的密码进行验证。\n\n# 新注册页面\n\
    \n使用新用户账户注册。我将我的账户命名为 testuser2，邮箱地址为 testuser2@email.com。如果我们现在切换回管理员页面——并使用超级用户账户登录——现在这三个用户就一目易见了。\n\
    \n## 第9 章：用户认证\n\n203\n\n![](img/593a0176e3a13ba5207237714df32537_207_0.png)\n\
    \n# 管理员后台中的三个用户\n\nDjango 的用户认证流程需要一些设置，但你应该开始看到，它为我们提供了极大的灵活性，可以完全按照我们的要求配置注册和登录。\n\
    \n# 总结\n\n到目前，我们的报纸应用已经有了自定义用户模型以及可以工作的注册、登录和注销页面。但你可能注意到我们的网站看起来并不好看。在下一章中，我们将添加\
    \ Bootstrap 进行样式处理，并创建一个的 pages 应用。\n\n## 第10 章：Bootstrap\n\nWeb 开发需要很多技能。你不仅要编写网站使其正常运行，用户还期望它看起来很漂亮。当你从零开始创建一切时，为美化网站添加所有必要的\
    \ HTML/CSS 可能会让你感到从 overwhelming。\n\n幸运的是有 Bootstrap，它是最流行的构建响应式、移动优先项目的框架。我们不需要为常见的网站布局功能编写所有的\
    \ CSS 和 JavaScript，而是可以依靠 Bootstrap 来完成繁重的工作。这意味着只需要少量的代码，我们就能快速拥有美观的网站。如果我们想在项目进行期间进行自定义更改，也可以在需要的地方轻松覆盖\
    \ Bootstrap。\n\n当你想专注于项目的功能而不是设计时，Bootstrap 是一个很棒的选择。这就是我们在这里要使用它的原因。\n\n# pages\
    \ 应用\n\n在上一章中，我们通过在 `urls.py` 文件包含包含逻辑来显示首页。虽然这种方法可行，但我觉得它有些取巧，而且随着网站随时间的推移，它并不具备扩展性。对于\
    \ Django 初学者来说这也有点困惑。相反，我们可以并且已经为所有的 Django 页面创建一个专门的 pages 应用。这将让我们后的代码保持整洁有序。\n\
    \n在命令行中使用 `startapp` 命令来创建我们新的 pages 应用。如果服务器仍在运行，你可能需要停止它。\n\n# 命令行\n\n```bash\n\
    python manage.py startapp pages\n```\n\n然后立即更新我们的 `settings.py`。我经常忘记这样做，所以运行\
    \ `startapp` 命令后更新 `INSTALLED_APPS`。\n\n# 代码\n\n```python\n# newspaper_project/settings.py\n\
    INSTALLED_APPS = [\n    'django.contrib.admin',\n    'django.contrib.auth',\n\
    \    'django.contrib.contenttypes',\n    'django.contrib.sessions',\n    'django.contrib.messages',\n\
    \    'django.contrib.staticfiles',\n    'users',\n    'pages', # 新\n]\n```\n\n\
    现在我们可以更新项目级的 `urls.py` 了。去删除对 `TemplateView` 的导入。我们将更新路由以包含 pages。\n\n# 代码\n\n\
    ```python\n# newspaper_project/urls.py\n\nfrom django.contrib import admin\nfrom\
    \ django.urls import path, include\n\nurlpatterns = [\n    path('', include('pages.urls')),\n\
    \    path('admin/', admin.site.urls),\n    path('users/', include('users.urls')),\n\
    ]\n```\n\n是时候添加我们的 `pages/urls.py` 文件了。首先创建它。\n\n然后导入我们尚未创建的视图，设置路由路径，并确保为每个 url\
    \ 均命名。\n\n## 第10 章：Bootstrap\n\n207\n\n# 代码\n\n```python\n# pages/urls.py\nfrom\
    \ django.urls import path\nfrom . import views\n\nurlpatterns = [\n    path('',\
    \ views.HomePage.as_view(), name='home'),\n]\n```\n\n`views.py` 的代码现在看起来应该熟悉了。我们正在使用\
    \ Django 的 `TemplateView` 通用类视图，这意味着我们只需要指定 `template_name` 即可使用它。\n\n# 代码\n\n\
    ```python\n# pages/views.py\nfrom django.views.generic import TemplateView\n\n\
    class HomePage(TemplateView):\n    template_name = 'home.html'\n```\n\n我们已经有一个现有的\
    \ `home.html` 模板。让我们确认它在我们新的 url 和视图下仍然有效。导航到首页 http://127.0.0.1:8000/ 以确认它保持保持不变。\n\
    \n## 第10 章：Bootstrap\n\n![](img/593a0176e3a13ba5207237714df32537_212_0.png)\n\n\
    你好！\n\n退出登录 (logout)\n\n# 登录后的首页\n\n它应该显示你登录的超级用户账户名称，我们在上一章末尾使用了它。\n\n# 测试\n\n\
    我们添加了新的代码和功能，这意味着是时候进行测试了。你可以在你的项目中包含足够的测试。尽管编写它们需要一些前期时间，但它们总能在未来为你节省时间，并在项目增长时提供信心。\n\
    \n添加测试的理想时机有两个：在编写任何代码之前（测试驱动开发），或者在添加新功能后立即进行。\n\n目前我们的项目有四个页面：\n\n- home\n-\
    \ signup\n- login\n- logout\n\n然而我们只需要测试前两个。登录和注销是 Django 的一部分，依赖于内部视图和 url 路由。因此它们已经有了测试覆盖。如果我们将来对它们进行了重大更改，我们将希望为它们添加测试。但作为一般原则，你不需要为\
    \ Django 的核心功能添加测试。\n\n"
