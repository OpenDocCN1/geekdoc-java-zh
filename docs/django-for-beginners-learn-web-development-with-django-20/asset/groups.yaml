    # Chapter 12: Email


    At this point you may be feeling a little overwhelmed by all the user authentication
    configuration we''ve done up to this point. That''s normal. After all, we haven''t
    even created any core Newspaper app features yet! Everything has been about setting
    up custom user accounts and the rest.


    The upside of Django''s approach is that it is incredibly easy to customize any
    piece of our website. The downside is Django requires a bit more out-of-the-box
    code than some competing web frameworks. As you become more and more experienced
    in web development, the wisdom of Django''s approach will ring true.


    Now we want to have our emails be actually sent to users, not just outputted to
