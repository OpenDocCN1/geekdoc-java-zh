    the name and email address you associated with all your Git commits (more on shortly).


    Within the command line console type the following two lines. Make sure to update
    them name and email address.'
  - '[PAGE 25]


    # Command Line


    ```

    $ git config --global user.name "Your Name"

    $ git config --global user.email "yourname@email.com"

    ```


    You can always change these configs later if you desire by retyping the same commands
    with a new name or email address.


    # Text Editors


    The final step is our text editor. While the command line is where we execute
    commands for our programs, a text editor is where the actual code is written.
    The computer doesn''t care what text editor you use-the end result is just code–a
    good text editor can provide helpful hints and catch typos for you.


    Experienced developers often prefer using either Vim or Emacs, both decades-old,
    text-only editors with loyal followers. Each has a steep learning curve and requires
    memorizing many different keystroke combinations. I don''t recommend them for
    newcomers.


    Modern text editors combine the powerful features with an appealing visual interface.
    My current favorite is Visual Studio Code which is free, easy to install, and
    enjoys widespread popularity. If you''re not already using a text editor, download
    and install Visual Studio Code now.


    # Conclusion


    Phew! Nobody really likes configuring a local development environment but fortunately
    it''s a one-time pain. We have now learned how to work with virtual environments
    and installed the latest version of Python and git. Everything is ready for our
    first Django app.'
