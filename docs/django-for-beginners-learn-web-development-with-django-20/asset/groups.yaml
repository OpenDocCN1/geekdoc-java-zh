  - "[PAGE 46]\n\na web page specified by the URL.\n\nIt's worth repeating this pattern\
    \ since you'll see it over and over again in Django development: Templates, Views,\
    \ and URLs. The order in which you create them doesn't matter since all three\
    \ are required and work closely together. The URLs control the initial route,\
    \ the entry point into a page, such as /about, the views contain the logic or\
    \ the “what”, and the template has the HTML. For web pages that rely on a database\
    \ model, it is the view of how much to decide what data is available to the template.\n\
    \nSo: Templates, Views, URLs. This pattern will hold true for every Django web\
    \ page you make. However it will take some repetition before you internalize it.\n\
    \nOk, moving on. The question of where to place the templates directory can be\
    \ confusing for beginners. By default, Django looks within each app for templates.\
    \ In our pages app it will expect a home.html template to be located in the following\
    \ location:\n\n+   - pages\n  - templates\n    - pages\n      - home.html\n\n\
    This means we would need to create a new templates directory, a new directory\
    \ with the name of the app, pages, and finally our template itself which is home.html.\n\
    \nA common question is: Why this repetitive structure? The short answer is that\
    \ the Django template loader wants to be really sure it find the correct template\
    \ and this is how it’s programmed to look for them.\n\nFortunately there's another\
    \ often-used approach to structuring the templates in a Django project. And that\
    \ is to instead create a single, project-level templates directory that is available\
    \ to all apps. This is the approach we'll use. By making a small tweak to"
- md: "\n## Chapter 3: Pages app\n\nour settings.py file we can tell Django to also\
    \ look in this project-level folder for templates.\n\nFirst quit our server with\
    \ Control-c. Then create a project-level folder called templates and an HTML file\
    \ called home.html.\n\n# Command Line\n\n```\n(pages) $ mkdir templates\n(pages)\
    \ $ touch templates/home.html own```\n\nNext we need to update settings.py to\
    \ tell Django to look at the project-level for templates. This is a one-line change\
    \ to the setting 'DIRS' under TEMPLATES.\n\n# Code\n\n```python\n# pages_project/settings.py\n\
    TEMPLATES = [\n    {\n        ...\n        'DIRS': [os.path.join(BASE_DIR, 'templates')],\n\
    ...\n    }\n]\n```\n\nThen we can add a simple headline to our home.html file.\n\
    \n# Code\n\n```html\n<!-- templates/home.html -->\n<h1>Homepage.</h1>\n```\n\n\
    Ok, our template is complete! The next step is to configure our url and view.\n\
    \n## Class-Based Views\n\nEarly versions of Django only shipped with function-based\
    \ views, but developers soon found themselves repeating the same patterns over\
    \ and over and again. Write a view that lists all objects in a model. Write a\
    \ view that displays only one detailed item from a model. And so on.\n\nFunction-based\
    \ generic views were introduced to abstract these patterns and streamline development\
    \ of common patterns. However there was no easy way to extend or customize these\
    \ views. As a result, Django introduced class-based generic views that make it\
    \ easy to use and also extend views covering common use cases.\n\nClasses are\
    \ a fundamental part of Python but a thorough discussion of them is beyond the\
    \ scope of this book. If you need an introduction or refresher, I suggest reviewing\
    \ the official Python docs which have an excellent tutorial on classes and their\
    \ usage.\n\nIn our view we'll use the built-in TemplateView to display our template.\
    \ Update the pages/views.py file.\n\n# Code\n\n```python\n# pages/views.py\n\n\
    from django.views.generic import TemplateView\n\nclass HomePageView(TemplateView):\n\
    \    template_name = 'home.html'\n```\n\nNote that we've capitalized our view\
    \ since it's now a Python class. Classes, unlike functions, should always be capitalized.\
    \ The TemplateView already contains all the logic needed to display our template,\
    \ we just need to specify the template's name.\n\n## URLs\n\nThe last step is\
    \ to update our URLConfs. Recall from Chapter 2 that we need to make updates in\
    \ two locations. First we update the project-level urls.py file to point at our\
    \ pages app and then within pages we match the views to routes.\n\nLet's start\
    \ with the project-level urls.py file.\n\n# Code\n\n```python\n# pages_project/urls.py\n\
    \nfrom django.contrib import admin\nfrom django.urls import path, include\n\n\
    urlpatterns = [\n    path('admin/', admin.site.urls),\n    path('', include('pages.urls'))\n\
    ]\n```\n\nThe code here should be reviewed at this point. We add include on the\
    \ second line to point the existing URL to the pages app. Next create an app-level\
    \ urls.py file.\n\n# Command Line\n\n```\n(pages) $ touch pages/urls.py\n```\n\
    \nAnd add the following code.\n\n# Code\n\n```python\n# pages/urls.py\n\nfrom\
    \ django.urls import path\n\nfrom . import views\n\nurlpatterns = [\n    path('',\
    \ views.HomePageView.as_view(), name='home')\n]\n```\n\nThis pattern is almost\
    \ identical to what we did in Chapter 2 with one major difference. When using\
    \ Class-Based Views, you always add as_view() at the end of the view name.\n\n\
    And we're done! If you start up the web server with python manage.py runserver\
