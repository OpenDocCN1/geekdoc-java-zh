    \ navigate to our homepage at:\n\nhttp://127.0.0.1:8000/\n\n# Chapter 13: Newspaper\
    \ app\n\n![](img/593a0176e3a13ba5207237714df32537_277_0.png)\n\n## Homepage with\
    \ new link in nav\n\nClick on the link for “+ New” in the top nav and you'll be\
    \ redirected to our create page.\n\n# Chapter 13: Newspaper app\n\n![](img/593a0176e3a13ba5207237714df32537_278_0.png)\n\
    \n## New article\n\nTitle:\n\nBody:\n\nAuthor:\n\n## Create page\n\nGo ahead and\
    \ create a new article. Then click on the \"Save\" button. You will be redirected\
    \ to the detail page. Why? Because in our models.py file we set the get_absolute_url\
