- md: "\n# Chapter 8: Custom User Model\n\n186\n\n## Site administration\n\n### Admin\
    \ page\n\nIf you click on the link for “Users” you should see your superuser account.\
    \ Note that the three fields we see are email, username, and age since we set\
    \ that as the list_display in our CustomUserAdmin.\n\n## Admin one user\n\n##\
    \ Conclusion\n\nWith our custom user model complete, we can now focus on building\
    \ the rest of our Newspaper app. In the next chapter we will configure and customize\
    \ signup, login, and logout pages.\n\n## Chapter 9: User Authentication\n\nNow\
    \ that we have a working custom user model we can add the functionality every\
    \ website needs: the ability to signup, login, and logout users. Django provides\
    \ everything we need for login and logout but we will need to create our own form\
    \ to sign up new users. We'll build a basic homepage with links to all three features\
    \ so we don't have to type in the URLs by hand every time.\n\n## Templates\n\n\
    By default the Django template loader looks for templates in a nested structure\
    \ within each app. So a home.html template in users would need to be located at\
    \ users/templates/users/home.html. But a project-level templates folder approach\
    \ is cleaner and scales better so that's what we'll use.\n\nLet's create a new\
    \ templates directory and within it a registration folder as that's where Django\
    \ will look for the login template.\n\n### Command Line\n\n```\n(news) $ mkdir\
    \ templates\n(news) $ mkdir templates/registration\n```\n\nNow we need to tell\
    \ Django about this new directory by updating the configuration 'DIRS' in settings.py.\
    \ This is a one-line change.\n\n### Code\n\n```python\n# newspaper_project/settings.py\n\
    TEMPLATES = [\n{\n  ...\n  'DIRS': [os.path.join(BASE_DIR, 'templates')],\n  ...\n\
    }\n]\n```\n\nIf you think about what happens when you login or logout of a site,\
    \ you are immediately redirected to a subsequent page. We need to tell where to\
    \ send users in each case. The LOGIN_REDIRECT_URL and LOGOUT_REDIRECT_URL settings\
    \ do that. We'll configure both to redirect to our homepage which will have the\
    \ named URL of 'home'.\n\nRemember when we create our URL routes we have the option\
    \ to add a name to each one. So when we make the homepage URL we'll make sure\
    \ to call it 'home'.\n\nAdd these two lines at the bottom of the settings.py file.\n\
    \n### Code\n\n```python\n# newspaper_project/settings.py\nLOGIN_REDIRECT_URL =\
    \ 'home'\nLOGOUT_REDIRECT_URL = 'home'\n```\n\nNow we can create four new templates:\n\
    \n```\n(news) $ touch templates/registration/login.html\n(news) $ touch templates/base.html\n\
    (news) $ touch templates/home.html\n(news) $ touch templates/signup.html\n```\n\
    \nHere's the HTML code for each file to use. The base.html will be inherited by\
    \ every other template in our project. By using a block like % block content %\
    \ we can later override the content just in this place in other templates.\n\n\
    ### Code\n\n```html\n<!-- templates/base.html -->\n<!DOCTYPE html>\n<html>\n<head>\n\
    \  <meta charset=\"utf-8\">\n  <title>Newspaper App</title>\n</head>\n<body>\n\
    \  <main>\n    {% block content %}\n    {% endblock %}\n  </main>\n</body>\n</html>\n\
    ```\n\n### Code\n\n```html\n<!-- templates/home.html -->\n{% extends 'base.html'\
    \ %}\n\n{% block title %}Home{% endblock %}\n\n{% block content %}\n{% if user.is_authenticated\
    \ %}\nHi {{ user.username }}!\n<p><a href=\"{% url 'logout' %}\">logout</a></p>\n\
    {% else %}\n<p>You are not logged in</p>\n<a href=\"{% url 'login' %}\">login</a>\
    \ |\n<a href=\"{% url 'signup' %}\">signup</a>\n{% endif %}\n{% endblock %}\n\
    ```\n\n### Code\n\n```html\n<!-- templates/registration/login.html -->\n{% extends\
    \ 'base.html' %}\n\n{% block title %}Login{% endblock %}\n\n{% block content %}\n\
    <h2>Login</h2>\n<form method=\"post\">\n  {% csrf_token %}\n</form>\n{% endblock\
    \ %}\n```\n\n### Code\n\n```html\n<!-- templates/signup.html -->\n{% extends 'base.html'\
    \ %}\n\n{% block title %}Sign Up{% endblock %}\n\n{% block content %}\n<h2>Sign\
    \ up</h2>\n<form method=\"post\">\n  {% csrf_token %}\n</form>\n{% endblock %}\n\
    ```\n\nOur templates are now set. Let's look at the urls.py in the users app.\n\
    \n```python\nfrom django.urls import path, include\nfrom . import views\n\nurlpatterns\
    \ = [\n    path('home/', views.home, name='home'),\n    path('login/', views.login,\
    \ name='login'),\n    path('logout/', views.logout, name='logout'),\n    path('signup/',\
    \ views.signup, name='signup'),\n    path('registration/', include('registration.urls')),\n\
    ]\n```\n"
  mdcn: "\n\n# 第 8 章：自定义用户模型\n\n186\n\n## 站点管理\n\n### 管理员页面\n\n如果你点击“用户”（Users）链接，你应该能看到超级管理员账户。注意，我们看到的三个字段是邮箱、用户名和年龄，因为我们在\
    \ `CustomUserAdmin` 中将它们设置为了 `list_display`。\n\n## 管理单个用户\n\n## 结论\n\n自定义用户模型构建完成后，我们现在可以专注于构建\
    \ Newspaper 应用的其他部分。在下一章节中，我们将配置和自定义注册、登录和注销页面。\n\n## 第 9 章：用户认证\n\n现在我们已经有了可以工作的自定义用户模型，可以添加每个网站都需要的功能：注册、登录和注销用户。Django\
    \ 提供了登录和注销所需的一切，但我们需要自己创建表单来注册新用户。我们将构建一个基础主页，包含指向这三个功能的链接，这样我们就不需要每次手动输入 URL\
    \ 了。\n\n## 模板\n\n默认情况下，Django 模板加载器会在每个应用的嵌套结构中查找模板。因此，users 应用中的 `home.html`\
    \ 模板需要位于 `users/templates/users/home.html`。但项目级模板文件夹的方法更整洁且扩展性更好，所以我们将使用这种方法。\n\
    \n让我们创建一个新的 templates 目录，并在其中创建一个 `registration` 文件夹，因为 Django 将从那里查找登录模板。\n\n\
    ### 命令行\n\n```\n(news) $ mkdir templates\n(news) $ mkdir templates/registration\n\
    ```\n\n现在，我们需要通过更新 `settings.py` 中的配置 `DIRS` 来告诉 Django 这个新目录。这是一行代码的更改。\n\n###\
    \ 代码\n\n```python\n# newspaper_project/settings.py\nTEMPLATES = [\n{\n  ...\n\
    \  'DIRS': [os.path.join(BASE_DIR, 'templates')],\n  ...\n}\n]\n```\n\n如果你思考在网站登录或注销时发生了什么，你会被立即重定向到一个后续页面。我们需要告诉程序在每情况下将用户发送到哪里。`LOGIN_REDIRECT_URL`\
    \ 和 `LOGOUT_REDIRECT_URL` 设置实现了此功能。我们将两者配置重定向到我们的主页，主页将具有名为 'home' 的命名 URL。\n\n\
    记得我们在创建 URL 路由时，可以选择为每个路由添加一个名称。所以当我们创建主页 URL 时，我们会确保将其命名为 'home'。\n\n在 `settings.py`\
    \ 文件的底部添加这两行。\n\n### 代码\n\n```python\n# newspaper_project/settings.py\nLOGIN_REDIRECT_URL\
    \ = 'home'\nLOGOUT_REDIRECT_URL = 'home'\n```\n\n现在我们可以创建四个新模板：\n\n```\n(news)\
    \ $ touch templates/registration/login.html\n(news) $ touch templates/base.html\n\
    (news) $ touch templates/home.html\n(news) $ touch templates/signup.html\n```\n\
    \n这里是每个文件使用的 HTML 代码。`base.html` 将被项目中的其他所有模板继承。通过使用像 `{% block content %}` 这样的块，我们以后可以在其他模板中仅在此处覆盖内容。\n\
    \n### 代码\n\n```html\n<!-- templates/base.html -->\n<!DOCTYPE html>\n<html>\n<head>\n\
    \  <meta charset=\"utf-8\">\n  <title>Newspaper App</title>\n</head>\n<body>\n\
    \  <main>\n    {% block content %}\n    {% endblock %}\n  </main>\n</body>\n</html>\n\
    ```\n\n### 代码\n\n```html\n<!-- templates/home.html -->\n{% extends 'base.html'\
    \ %}\n\n{% block title %}Home{% endblock %}\n\n{% block content %}\n{% if user.is_authenticated\
    \ %}\nHi {{ user.username }}!\n<p><a href=\"{% url 'logout' %}\">logout</a></p>\n\
    {% else %}\n<p>You are not logged in</p>\n<a href=\"{% url 'login' %}\">login</a>\
    \ |\n<a href=\"{% url 'signup' %}\">signup</a>\n{% endif %}\n{% endblock %}\n\
    ```\n\n### 代码\n\n```html\n<!-- templates/registration/login.html -->\n{% extends\
    \ 'base.html' %}\n\n{% block title %}Login{% endblock %}\n\n{% block content %}\n\
    <h2>Login</h2>\n<form method=\"post\">\n  {% csrf_token %}\n</form>\n{% endblock\
    \ %}\n```\n\n### 代码\n\n```html\n<!-- templates/signup.html -->\n{% extends 'base.html'\
    \ %}\n\n{% block title %}Sign Up{% endblock %}\n\n{% block content %}\n<h2>Sign\
    \ up</h2>\n<form method=\"post\">\n  {% csrf_token %}\n</form>\n{% endblock %}\n\
    ```\n\n我们的模板现在设置好了。让我们来看 users 应用中的 `urls.py`。\n\n```python\nfrom django.urls\
    \ import path, include\nfrom . import views\n\nurlpatterns = [\n    path('home/',\
    \ views.home, name='home'),\n    path('login/', views.login, name='login'),\n\
    \    path('logout/', views.logout, name='logout'),\n    path('signup/', views.signup,\
    \ name='signup'),\n    path('registration/', include('registration.urls')),\n\
    ]\n```\n\n"
