  md: '# Introduction


    At the same time, Django remains under active development and has a yearly release
    schedule. The Django community is constantly adding new features and security
    improvements. If you''re building a website from scratch Django is a fantastic
    choice.


    # Why this book


    I wrote this book because Django is extremely well documented there is a severe
    lack of beginner-friendly tutorials available. When I first learned Django years
    ago I struggled to even complete the official polls tutorial. Why was this so
    hard I remember thinking?


    With more experience I recognize that the writers of the Django docs faced a difficult
    choice: they could emphasize Django''s ease-of-use or its depth, but not both.
    They choose the latter and as a professional developer I appreciate the choice,
    but as a beginner I found it so...frustrating!


    My goal is that this book fills in the gaps and showcases how beginner-friendly
    Django really is.


    You don''t need previous Python or web development experience to complete this
    book. It is intentionally written so that even a total beginner can follow and
    feel the magic of writing their own web applications from scratch. However if
    you are serious about a career in web development, you will eventually need to
    invest the time to learn Python, HTML, and CSS properly. A list of recommended
    resources for further study is included in the Conclusion.


    # Book Structure


    We start by properly covering how to configure a local development environment
    in Chapter 1. We''re using bleeding edge tools in this book: the most recent version
    of'
