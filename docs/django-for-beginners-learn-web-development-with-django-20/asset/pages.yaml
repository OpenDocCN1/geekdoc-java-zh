  md: '# # Chapter 15: Comments


    There are two ways we could add comments to our Newspaper site. The first is to
    create a dedicated comments app and link it to articles, however that seems like
    over-engineering at this point. Instead we can simply add an additional model
    called Comment to our articles app and link it to the Article model through a
    foreign key. By the end of this chapter users will have the ability to leave comments
    on any other users articles.


    # ## Model


    To start we can add another table to our existing database called Comment. This
    model will have a many-to-one foreign key relationship to Article: one article
    can have many comments, but not the other way around. Traditionally the name of
    the foreign key field is simply the model it links to, so this field will be called
    article. The other fields will be comment and author.


    Open up the file articles/models.py and underneath the existing code add the following.'
  merge: -1
  pgno: 290
- img_proc: true
  md: "# Code\n\n```\n# articles/models.py\n...\n```\n\n```\nclass Comment(models.Model):\n\
    \    article = models.ForeignKey(Article, on_delete=models.CASCADE)\n    comment\
    \ = models.CharField(max_length=140)\n    author = models.ForeignKey(\n      \
    \  settings.AUTH_USER_MODEL,\n        on_delete=models.CASCADE,\n    )\n\n   \
    \ def __str__(self):\n        return self.comment\n\n    def get_absolute_url(self):\n\
    \        return reverse('article_list')\n```\n\nOur Comment model also has a __str___\
    \ method and a get_absolute_url method that returns to the main articles/page.\n\
    \nSince we've updated our models it's time to make a new migration file and then\
    \ apply it. Note that by adding articles at the end of each command-which is optional-it\
    \ are specifying we want to use just the articles app here. This is a good habit\
    \ to use. For example, what if we changed models in two different apps? If we\
    \ did not specify an app, then both apps' changes would be incorporated in the\
    \ same migration file which makes it harder, in the future, to debug errors. Keep\
    \ each migration as small and contained as possible."
