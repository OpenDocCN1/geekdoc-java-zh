  md: '# Chapter 1: Initial Setup


    This chapter covers how to properly configure your computer to work on Django
    projects. We start with an overview of the command line and use it to install
    the latest versions of both Django (2.0) and Python (3.6x). Then we discuss virtual
    environments, git, and working with a text editor.


    By the end of this chapter you''ll be ready to create and modify new Django projects
    in just a few keystrokes.


    # The Command Line


    The command line is a powerful, text-only view of your computer. As developers
    we will use it extensively throughout this book to install and configure each
    Django project.


    On a Mac, the command line is found in a program called Terminal located at /Applications/Utilities.
    To find it, open a new Finder window, open the Applications folder, scroll down
    to the Utilities folder, and double-click the application called Terminal.


    On Windows, there is a built-in command line program but it is difficult to use.
    I recommend instead using Babun, a free and open-source command line program.
    On the Babun homepage click on the “Download now” button, double-click on the
    downloaded file to install Babun, and upon completion drag the installer to the
    Recycle Bin. To use Babun go to the Start menu, select Programs, and click on
    Babun.


    Going forward when the book refers to the “command line” it means to open a new
    console on your computer using either Terminal or Babun.'
  merge: -1
  pgno: 12
