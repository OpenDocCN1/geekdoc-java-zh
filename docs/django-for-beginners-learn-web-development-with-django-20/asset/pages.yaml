    \        views.ArticleDetailView.as_view(), name='article_detail'), # new\n  \
    \  path('<int:pk>/delete/',\n        views.ArticleDeleteView.as_view(), name='article_delete'),\
    \ # new\n]\",]\n```\n\nNow write up our views which will use Django's generic\
