  md: '# Password reset


    Password reset handles the common case of users forgetting their passwords. The
    steps are very similar to configuring password change, as we just did. Django
    already provides a default implementation that we will use and then customize
    the templates so it matches the rest of our site.


    The only configuration required is telling Django how to send emails. After all,
    a user can only reset a password if they have access to the email linked to the
    account. In production we''ll use the email service SendGrid to actually send
    the emails but for testing purposes we can rely on Django''s console backend setting
    which outputs the email text to our command line console instead.


    At the bottom of the settings.py file make the following one-line change.


    # Code


    ```

    # newspaper_project/settings.py

    EMAIL_BACKEND = ''django.core.mail.backends.console.EmailBackend''

    ```


    And we''re all set! Django will take care of all the rest for us. Let''s try it
    out.


    Navigate to http://127.0.0.1:8000/users/password_reset/ to view the default password
    reset page.'
