  md: '# # Chapter 11: Password Change and Reset


    In this chapter we will complete the authorization flow of our Newspaper app by
    adding password change and reset functionality. Users will be able to change their
    current password or or, if they''ve forgotten it, to reset it via email.


    Just as Django comes with built-in views and urls for login and logout, so too
    it also comes with views/urls for both password change and reset. We''ll go through
    the default versions first and then learn how to customize them with our own Bootstrap-powered
    templates and email service.


    # ## Password Change


    Letting users change their passwords is a common feature on many websites. Django
    provides a default implementation that already works at this stage. To try it
    out first click on the “log in” button to make sure you''re logged in. Then navigate
    to the “Password change” page at http://127.0.0.1:8000/users/password_change/.'
