  md: "# Chapter 15: Comments\n\nDjango has a built-in syntax we can use as FOO_set\
    \ where FOO is the lowercase source model name. So for our Article model we can\
    \ use article_set to access all instances of the model.\n\nBut personally I strongly\
    \ dislike this syntax as I find it confusing and non-intuitive. A better approach\
    \ is to add a related_name attribute to our model which lets us explicitly set\
    \ the name of this reverse relationship instead. Let's do that.\n\nTo start add\
    \ a related_name attribute to to our comment model. A good default is to name\
    \ the plural of the model holding the ForeignKey.\n\n# Code\n\n```\n# articles/models.py\n\
    ...\nclass Comment(models.Model):\n    article = models.ForeignKey(\n        Article,\n\
    \        on_delete=models.CASCADE,\n        related_name='comments' # new\n  \
