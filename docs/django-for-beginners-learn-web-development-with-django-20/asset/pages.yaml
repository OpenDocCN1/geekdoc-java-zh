  md: '# Chapter 8: Custom User Model


    Django''s built-in User model allows us to start working with users right away,
    as we just did adding our Blog app in the previous chapters. However the official
    Django documentation recommends using a custom user model for new projects. The
    reason is that if you want to make any changes to the User model down the road—for
    example adding an age field—using a custom user model from the beginning makes
    this quite easy. But if you do not create a custom user model, updating the default
    User model in an existing Django project is very, very challenging.


    So always use a custom user model for all new Django projects. However the official
    documentation example is not actually what many Django experts recommend. It uses
    the quite complex AbstractBaseUser when we use AbstractUser things are far simpler
    and still customizable. This is the approach we will take in this chapter where
    we start a new Newspaper app properly with a custom user model. The choice of
    a newspaper app pays homage to Django''s roots as a web framework built for editors
    and journalists at the Lawrence Journal-World.


    # Setup


    The first step is to create a new Django project from the command line. We need
    to do several things:


    +   - create and navigate into a new directory for our code

    - create a new virtual environment

    - install Django

    - make a new Django project newspaper_project'
  merge: -1
