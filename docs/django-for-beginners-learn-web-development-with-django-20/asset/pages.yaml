  md: "# Code\n\n```\n# helloworld_project/urls.py\nfrom django.contrib import admin\n\
    from django.urls import path, include\n\nurlpatterns = [\n    path('admin/', admin.site.urls),\n\
    \    path('', include('pages.urls')),\n]\n```\n\nWe've imported include on the\
    \ second line next to path and then created a new\nurpattern for our pages app.\
    \ Now whenever a user visits the homepage at / they will\nfirst be routed to the\
    \ pages app and then to the homePageViewView.\n\nIt's often confusing to beginners\
    \ that we don't need to import the pages app here, yet\nwe refer to it in our\
    \ urlpattern as pages.urls. The reason we do it this way is that\nthe method django.urls.include()\
    \ expects us to pass in a module, app, or as the first\nargument. Without using\
    \ include we would need to import our pages app, but since\nwe use include we\
    \ don't have to at at the project level!\n\n# Hello, world!\n\nWe have all the\
    \ code we need now! To confirm everything works as expected, restart\nour Django\
    \ server:"
