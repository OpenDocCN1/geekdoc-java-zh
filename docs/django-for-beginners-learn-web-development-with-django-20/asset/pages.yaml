    # Install Git


    Git is an indispensable part of modern software development. It is a version control
    system which can be thought of as an extremely powerful version of track changes
    in Microsoft Word or Google Docs. With git, you can collaborate with other developers,
    track your work via commits, and revert to any previous version of your code if
    you accidentally delete something important!


    On a Mac, because Homebrew is already installed we can simply brew install git
    on the command line:


    # Command Line


    ```

    $ brew install git

    ```


    On Windows you should download Git from Git for Windows. Click the “Download”
    button and follow the prompts for installation. Hit “next” on all steps except
    the fifth one, “Adjusting your PATH environment.” Instead choose the bottom option:
    “Use Git and optional Unix tools from the Windows Command Prompt.


    Once installed, we need to do a one-time system setup to configure it by declaring
    the name and email address you associated with all your Git commits (more on shortly).


    Within the command line console type the following two lines. Make sure to update
    them name and email address.'
