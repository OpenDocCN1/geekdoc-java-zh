    Django (2.0), Python (3.6), and Pipenv to manage our virtual environments. We
    also introduce the command line and discuss how to work with a modern text editor.


    In Chapter 2 we build our first project, a minimal Hello, World application that
    demonstrates how to set up new Django projects. Because establishing good software
    practices is important, we''ll also save our work with git and upload a copy to
    a remote code repository on Bitbucket.


    In Chapter 3 we make, test, and deploy a Pages app that introduces templates and
    class-based views. Templates are how Django allows for DRY (Don''t Repeat Yourself)
    development with HTML and CSS while class-based views require a minimal amount
    of code to use and extend core functionality in Django. They''re awesome as you''ll
    soon see. We also add our first tests and deploy to Heroku which has a free tier
    we''ll use throughout this book. Using platform-as-a-service providers like Heroku
    transforms development from a painful, time-consuming process into something that
    takes just a few clicks.


    In Chapter 4 we build our first database-backed project, a Message Board app.
    Django provides a powerful ORM that allows us to write concise Python for our
    database tables. We''ll explore the built-in admin app which provides a graphical
    way to interact with our data and can be used as a Content Management System (CMS)
    similar to WordPress. Of course we also write tests for all our code, store a
    remote copy on Bitbucket, and deploy to Heroku.


    Finally in Chapters 5-7 we are ready for our first project: a robust blog application
    that demonstrates how to perform CRUD (Create-Read-Update-Delete) functionality
    in Django. We''ll find that Django''s generic class-based views mean we have to
    write only a small amount of actual code for this! Then we''ll add forms and integrate
    Django''s built-in user system (login, logout, signup).


    In Chapter 8 we start a Newspaper site and introduce the concept of custom user
    models, a Django best practice that is rarely covered. Simply put all new'
