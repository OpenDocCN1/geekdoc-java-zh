  md: '# Chapter 5: Blog app


    # 121


    All blog post entries will start with post/. Next is the primary key for our post
    entry which will be represented as an integer <int:pk>. What''s the primary key
    you''re probably asking? Django automatically adds an auto-incrementing primary
    key to our database models. So while we only declared the fields title, author,
    and body on our Post model, under-the-Django also added another field called id,
    which is our primary key. We can access it as id or pk.


    The pk for our first “Hello, World” is post 1. For the second post, it is 2. And
    so on. Wherever we go to the individual entry page for our first post, we can
    expect its urlpattern will be post/1.


    Note: Understanding how primary key works with DetailView is a very common place
    of confusion for beginners. It''s worth re-reading the previous two paragraphs
    a few times if it doesn''t click. With practice it will become second.


