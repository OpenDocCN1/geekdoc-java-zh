  md: 'An error. This is because our model expects an author field which is linked
    to the current logged-in user. But since we are not logged in, there''s no author,
    and therefore the submission fails.


    # Mixins


    We clearly want to set some authorizations so only logged-in users can access
    the site. To do this we can use a mixin, which is a special kind of multiple inheritance
    the. Django uses to avoid duplicate code and allow for customization. For example,
    the built-in generic ListView needs a way to return a template. But so does DetailView
    and in fact almost every other view. Rather than repeat the same code in each
    generic view, Django breaks out this functionality into a “mixin” known as TemplateResponse-Mixin.
    Both ListView and DetailView use this mixin to render the proper template.


    If you read the Django source code, which is freely available on Github, you''ll
    see mixins used all over the place.


    To restrict view to only logged users, Django has a LoginRequired mixin that we
    can use. It''s powerful and extremely concise.


    Within the existing articles/views.py file import it at the top and then add Login-RequiredMixin
    to our ArticleCreateView. Make sure that the mixin is to the left of ListView
    so it will be read first. We want the ListView to already know we intend to restrict
    access.


    And that''s it! We''re done.'
