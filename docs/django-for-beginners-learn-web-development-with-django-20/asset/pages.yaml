  md: '# Virtual Environments


    Virtual environments are an indispensable part of Python programming. They are
    an isolated container containing all the software dependencies for a given project.
    This is important because by default software like Python and Django is installed
    in the same directory. This causes a problem when you want to work on multiple
    projects on the same computer. What if ProjectA uses Django 2.0 but ProjectB from
    last year is still on Django 1.107 Without virtual environments it becomes very
    difficult; with virtual environments it''s no problem at all.


    There are many areas of software development that are highly debated, but using
    virtual environments for Python development is not one. You should use a dedicated
    virtual environment for each new Python project.


    Historically Python developers use either virtualenv or pyenv to configure virtual
    environments. But in 2017 prominent Python developer Kenneth Reitz released Pipenv
    which is now the officially recommended Python packaging tool.


    Pipenv is similar to npm and yarn from the Node ecosystem: it creates a Pipfile
    containing software dependencies and a Pipfile.lock for ensuring deterministic
    builds. “Determinism” means that each and every time you download the software
    in a new virtual environment, you will have exactly the same configuration. Sebastian
    McKenzie, the creator of Yarn who first introduced this concept to JavaScript
    packaging, has a concise blog post explaining what determinism is and why it matters.


    The end result is that we will create a new virtual environment with Pipenv for
    each new Django Project.


    To install Pipenv we can use pip3 which Homebrew automatically installed for us
    alongside Python 3.'
  merge: -1
