  md: "# Chapter 7: User Accounts\n\n# Code\n\n```\n<!-- templates/registration/login.html\
    \ -->\n{% extends 'base.html' %}\n```\n\n{% block content %}\n<h2>Login</h2>\n\
    <form method=\"post\">\n  {% csrf_token %}\n  {{ form.as_p }}\n  <button type=\"\
    submit\">Login</button>\n</form>\n{% endblock content %}\n\nWe're using HTML </form>\
    \ tags and specifying the POST method since we're sending data to the server (we'd\
    \ use GET if we were requesting data, such as in a search engine). We add {% csrf_token\
    \ %} for security concerns, namely to prevent an XSS Attack. The form's contents\
    \ are outputted between paragraph tags thanks to {{ form.as_p }} and then we add\
    \ a “submit” button.\n\nThe final step is to specify where to redirect the user\
    \ upon a successful login. We can set this with the LOGIN_REDIRECT_URL setting.\
    \ At the bottom of the settings.py file add the following:\n\n# Code\n\n```\n\
    # settings.py\nLOGIN_REDIRECT_URL = 'home'\n```\n\nNow the user will be redirected\
    \ to the 'home' template which is our homepage.\n\nWe're actually done at this\
