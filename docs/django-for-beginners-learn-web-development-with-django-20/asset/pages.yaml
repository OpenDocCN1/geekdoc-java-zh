  md: '# Chapter 7: User Accounts


    So far we''ve built a working blog application that uses forms, but we''re missing
    a major piece of most web applications: user authentication.


    Implementing proper user authentication is famously hard; there are many security
    gotchas along the way so you really don''t want to implement this yourself. Fortunately
    Django comes with a powerful, built-in user authentication system that we can
    use.


    Whenever you create a new project, by default Django installs the auth app, which
    provides us with a User object containing:


    +   * username

    * password

    * email

    * first_name

    * last_name


    We will use this User object to implement login, logout, and signup in our blog
    application.


    # Login


    Django provides us with a default view for a login page via LoginView. All we
    need to add a project-level urlpattern for the auth system, a login template,
    and a small update to our settings.py file.


    First update the project-level urls.py file. We''ll place our login and logout
    pages at the accounts/ URL. This is a one-line addition on the next-to-last line.'
  merge: -1
  pgno: 160
- img_proc: true
  md: "Chapter 7: User Accounts\n\n# Code\n\n```\n# blog_project/urls.py\nfrom django.contrib\
    \ import admin\nfrom django.urls import path, include\n\nurlpatterns = [\n   \
    \ path('admin/', admin.site.urls),\n    path('accounts/', include('django.contrib.auth.urls')),\n\
    \    path('', include('blog.urls')),\n]\n```\n\nThe LoginView documentation notes,\
    \ by default Django will look within a templates folder called registration for\
    \ a file called login.html for a login form. So we need to create a new directory\
    \ called registration and the requisite file within it. From the command line\
    \ type control-C to quit our local server. Then enter the following:\n\n# Command\
    \ Line\n\n```\n(blog) $ mkdir templates/registration\n(blog) $ touch templates/registration/login.html\n\
    ```\n\nNow type the following template code for our newly-created file."
