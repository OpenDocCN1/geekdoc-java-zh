    to write, they always save you time down the road and give confidence as a project
    grows in complexity.


    There are two ideal times to add tests: either before you write any code (test-driven-development)
    or immediately after you''ve added new functionality and it''s clear in your mind.


    Currently our project has four pages:


    +   - home

    - signup

    - login

    - logout


    However we only need to test the first two. Login and logout are part of Django
    and rely on internal views and url routes. They therefore already have test coverage.
    We made substantial changes to them in the future, we would want to add tests
    for that. But as a general rule, you do not need to add tests for core Django
    functionality.'
