  md: '# Chapter 4: Message Board app


    +   1. We create a migration file with the makemigrations command which generate
    the SQL commands for preinstalled apps in our INSTALLED_APPS setting. Migration
    files do not execute those commands on our database file, rather they are a reference
    of all new changes to our models. This approach means that we have a record of
    the changes to our models over time.


    +   2. Second we build the actual database with migrate which does execute the
    instructions in our migration files.


    # Command Line


    ```

    (mb) python manage.py makemigrations posts

    (mb) python manage.py migrate posts

    ```


    Note that you don''t have to include a name after either makemigrations or migrate.
    If you run the commands then they will apply to all available changes. But it''s
    a good habit to be specific. If we had two separate apps in our project, and updated
    the models in both, and then ran makemigrations it would generate a migrations
    file containing data on both apps. This debugging harder in the future. You want
    each migration file to be as small and isolated as possible. That way if you need
    to look at past migrations, there is only one change per migration rather than
    one that applies to multiple apps.


