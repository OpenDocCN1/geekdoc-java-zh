  md: '# Introduction


    projects should use a custom user model and in this chapter you''ll learn how.
    **Chapter 9** covers user authentication, **Chapter 10** adds Bootstrap for styling,
    and **Chapters 11-12** implement password reset and change via email. In **Chapters
    13-15** we add articles and comments to our project, along with proper permissions
    and authorizations. We even learn some tricks for customizing the admin to display
