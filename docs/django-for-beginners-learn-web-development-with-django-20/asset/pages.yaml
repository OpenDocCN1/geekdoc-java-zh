  md: '# # Chapter 14: Permissions and Authorization


    There are several issues with our current Newspaper website. For one thing we
    want our newspaper to be financially sustainable. With more time we could add
    a payments app to charge for access, but for now we will require a user to log
    in to view any articles. This is known as authorization. It''s common to set different
    rules around who is authorized to view areas of your site. Note that this is different
    than authentication which is the process of registering and logging-in users.
    Authorization restricts access; authentication enables a user signup and login
    flow.


    As a mature web framework, Django has built-in functionality for authorization
    that we can quickly use. In this chapter we will limit access to various pages
    only to logged-in users. We will also add permissions so that only the author
    of an article can update or delete it; right now any user!


    # ## Improved CreateView


    At present the author on a new article can be set to any user. Instead it should
    be automatically set to the current user. Then we will set permissions on edit/delete
    so that only the author of an article can make such changes. The default CreateView
    provides a lot of functionality for us but in order to set the current user to
    author will need to customize it. We will remove author from the fields and instead
    set it automatically via the form_valid method.'
