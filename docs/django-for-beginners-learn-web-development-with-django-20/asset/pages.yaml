  md: 'While there are many possible commands we can use, in practice there are six
    used most frequently in Django development.


    +   - cd (change down a directory)

    - cd .. (change up a directory)

    - ls (list files in your current directory)

    - pwd (print working directory)

    - mkdir (make directory)

    - touch (create a new file)


    Open your command line and try them. The $ dollar sign is our command line prompt:
    all commands in this book are intended to be typed after the $ prompt.


    For example, assuming you''re on a Mac, let''s change into our Desktop directory.


    # Command Line


    ```

    $ cd ~/Desktop

    ```


    Note that our current location ~/Desktop is automatically added before our command
    line prompt. To confirm we''re in the proper location we can use pwd which will
    print out the path of our current directory.


    # Command Line


    ```

    ~/Desktop $ pwd

    /Users/wsv/desktop

    ```


    On our Mac computer this shows that I''m using the user wsv and on the desktop
    for that account.


    Let''s create a new directory folder with mkdir, cd into it, and add a new file
    index.html.'
