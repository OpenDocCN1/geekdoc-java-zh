  md: '# # Chapter 13: Newspaper app


    It''s time to build out our Newspaper app. We''ll have an articles page where
    journalists can post articles, set up permissions only the author of an article
    can edit or delete it, and finally add the ability for other users to write comments
    on each article which will introduce the concept of foreign keys.


    # ## Articles app


    To start create an articles app and define our database models. There are no hard
    and fast rules around what to name your apps except that you can''t use the name
    of a built-in app. If you look at the INSTALLED_APPS section of settings.py you
    can see which app names are off-limits: admin, auth, contenttypes, sessions, messages,
    and staticfiles. A general rule of thumb is to use the plural of an app name-posts,
    payments, users, etc.-unless doing so is obviously wrong in the common case of
    blog where the singular makes more sense.


    Start by creating our new articles.


    # ### Command Line


    ```

    (news) $ python manage.py startapp articles

    ```


    Then add it to our INSTALLED_APPS and update the time zone since we''ll be timestamping
    our articles. You can find your time zone in this Wikipedia list. For example,
    I live in Boston, MA which is in the Eastern time zone of the United States. Therefore
    my entry is America/New_York.'
