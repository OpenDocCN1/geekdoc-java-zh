  md: '“Very good,” he said. “Now suppose I remove the squares in the lower-right
    and upper-left corners.” He placed a coin on those two squares so I couldn’t use
    them. Now can you cover the remaining 62 squares using 31 dominos?”


    ![](img/3f33497047d2980a16cc0a7e85f4c95f_133_0.png)


    Can the checkerboard be covered with dominos when two opposite corners are removed?


    “Probably,” I said. But no matter how hard I tried, I was unable to do it. I was
    starting to think that the task was impossible.


    “If you think it’s impossible, can you prove that it’s impossible?” my friend
    asked. But how could I prove that it was impossible without exhaustively going
    through the trillions of failed attempts? He then suggested, “Look at the colors
    on the chessboard.”


    The colors? What did that have to do with anything? But then I saw it. Since both
    of the removed corner squares were light-colored, then the remaining board consisted
    of 32 dark squares and just 30 light squares. And since every domino covers exactly
    one light square and one dark square, it would be impossible for 31 dominos to
    tile a board. Cool!'
