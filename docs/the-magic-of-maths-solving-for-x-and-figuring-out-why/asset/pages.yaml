    ARTHUR BENJAMIN holds a PhD from Johns Hopkins University and is the Smallwood
    Family Professor of Mathematics at Harvey Mudd College. Dr. Benjamin has received
    numerous awards for his writing and teaching, and served as editor of Math Horizons
    magazine for the Mathematical Association of America. He has given three TED talks,
    which have been viewed over 10 million times. Reader’s Digest calls him “America’s
    best math whiz.” The author of Secrets of Mental Math, he lives in Claremont,
    California, with his wife and two daughters.'
