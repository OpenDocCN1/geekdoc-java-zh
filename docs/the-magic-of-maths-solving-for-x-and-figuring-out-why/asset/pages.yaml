  md: '# The Magic of Math


    three functions. They are the secant, cosecant, and cotangent functions,

    and they are defined as


    ```

    sec A = \frac{1}{\cos A} \csc A = \frac{1}{\sin A} \cot A = \frac{1}{\tan A}

    ```


    You can easily verify that the “co”-functions have the same complementary

    relationships that shine like sine and cosine. Namely, for any acute angle

    in a right triangle, sec(90° - A) = csc A and tan(90° - A) = cot A.


    Once you know how to compute the sine of any angle, you use complements

    to you can compute tangents and the other trig functions. But how do you calculate
    a

    sine value, like sin 40°? The simplest way is to use a calculator. My

    culator (in degree mode) tells me that sin 40° = 0.642.... How does it

    do calculation? We''ll explain that near the end of this chapter.


    There are a handful of trig values that you should know without

    needing to resort to a calculator. Recall that a 30-60-90 triangle has sides

    proportional to 1 : \sqrt{3}, as shown previously. Consequently,


    sin 30° = 1/2 cos 60° = \sqrt{3}/2


    and


    cos 30° = \sqrt{3}/2 cos 60° = 1/2


