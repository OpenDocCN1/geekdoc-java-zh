    A straight in poker consists of 5 cards of consecutive values, such as A2345 or
    23456 or . . or 10JQKA, like the one below.


    ![](img/3f33497047d2980a16cc0a7e85f4c95f_90_0.png)


    There are 10 different types of straights (defined by the lowest card), and once
    we choose its type (say 34567) then each of the 5 cards can be assigned one of
    4 suits. Here the number of straights is


    $10 \times 4^5 = 10,240$


    An even more valuable hand is the *full house*, consisting of 3 cards of one value
    and 2 cards of a different value. A typical hand might look like this:


    ![](img/3f33497047d2980a16cc0a7e85f4c95f_90_1.png)


    To construct a full house, we first need to choose a value to be tripled (13 ways),
    then a value to be doubled (12 ways). (Say we''ve decided on using three queens
    and two 7s). Then we need to assign suits. We can decide which three queens to
    use in $\binom{4}{3} = 4$ ways and which two 7s in $\binom{4}{2} = 6$ ways. Altogether
    the number of full houses is


    $13 \times 12 \times 4 \times 6 = 3744$'
