    # $D = 2r$


    The perimeter of a circle (its distance around) is called the circle’s circumference,
    denoted by C. From the picture, it is clear that $C$ is bigger than $2D$, since
    the distance along the circle from $P$ to $Q$ is bigger than $D$ and the distance
    from $Q$ back to $P$ is also bigger than $D$. Consequently, $C > 2D$. If you eyeball
    it, you might even convince yourself that $C$ is a little bigger than $3D$. (But
    to see it clearly, you might need to wear 3-D glasses. Sorry.)


    Now, if you wanted to go about comparing a circular object’s circumference to
    its diameter, you might wrap a string around the circumference. Then divide the
    length you measured by the diameter. You’ll find, regardless of whether you are
    measuring a coin, the base of a glass, a dinner plate, or a giant hula hoop,


    # $C/D \approx 3.14$


    We define the number $\pi$ (pi, pronounced “pie”; the Greek letter for the “p”
    sound) to be the exact constant that represents the ratio of a circle’s circumference
    to its diameter. That is,


    # $\pi = C/D$'
