  md: '# Aside


    There are infinitely many positive integers:


    1, 2, 3, 4, 5...


    There are also infinitely many even integers:


    2, 4, 6, 8, 10...


    Mathematicians say that the set of positive integers and the set of even positive
    integers have the same size (or cardinality or level of infinity) because they
    can be paired up with one another:


    |1 2 3 4 5 ...|

    |↕ ↕ ↕ ↕ |

    |2 4 6 8 10 ...|


    A set that can be paired with the positive integers is called countable. Countable
    sets have the smallest level of infinity. Any set that can be listed is countable,
    since the first element in the list is paired with 1, the second element is paired
    with 2, and so on. The set of all integers


    … -3, -2, -1, 0, 1, 2, 3...


    can’t be listed from smallest to largest (what would be the first number on the
    list?), but they can be listed this way:


    0, 1, -1, 2, -2, 3, -3...


    Thus the set of all integers is countable, and of the same size as the number
    of positive integers.

    How about the set of positive rational numbers? These are the numbers of the form
    m/n where m and n are positive integers. Believe it or not, this set is countable.
    They can be listed as follows:


    |1 2 1 2 3 4 ...|

    |1'' 2'' 1'' 3'' 2'' 1'' ...|


    where we first list the fractions according to the sum of their numerators and
    denominators. Since every rational number appears on the list, the positive rational
    numbers are countable too.'
