    angle must 180° (since 90° + 90° = 180° or -90° + -90° = -180° is the same as
    180°), which is a negative number. Finally, note that if z has angle θ, then 1/z
    must have angle -θ. (Why?) Since z · 1/z = 1, the angles for z and 1/z must sum
    to 0°. Therefore, when dividing complex numbers, you divide their lengths and
    subtract their angles. That is, z1/z2 length R1/R2 and angle θ1 - θ2.


