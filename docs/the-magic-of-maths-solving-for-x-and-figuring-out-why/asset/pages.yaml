  md: '# The Magic of π


    Interestingly, there is no simple formula for the circumference of an ellipse.
    But the mathematical genius Srinivasa Ramanujan (1887–1920) established the following
    excellent approximation. The circumference of an ellipse, as described above,
    is approximately


    ```

    $\pi (3a + 3b - \sqrt{(3a+b)(3b+a)})$

    ```


    Notice that when $a = b = r$, this reduces to $\pi(6r - \sqrt{6r^2}) = 2\pi r$,
    the circumference of a circle.


    The number $\pi$ appears in three-dimensional objects as well. Consider a *cylinder*,
    such as a can of soup. For a cylinder of radius $r$ and height $h$, its *volume*
    (which measures how much room the shape takes up) is


    ```

    $V_{cylinder} = \pi r^2 h$

    ```


    This formula makes sense, since we can think of the cylinder as made of circles
    with area $\pi r^2$ stacked on top of another (like a stack of round coasters
    at a restaurant) to a height of $h$.


    What is the *surface area* of the cylinder? In other words, how much paint would
    we need to paint its exterior, including the top and bottom? You do not need to
    memorize the answer you can figure it out by breaking the cylinder into three
    pieces. The top and bottom of the cylinder each have an area of $\pi r^2$, so
    they contribute $2\pi r^2$ to the surface area. For the rest of the cylinder,
    cut the cylinder with a straight cut from bottom to top and flatten the resulting
    object. The object will be a rectangle with height $h$ and base $2\pi r$, since
    that''s the circumference of the surrounding circle. This rectangle has area $2\pi
    rh$, the total surface area of the cylinder is


    ```

    $A_{cylinder}=2\pi r^2 + 2\pi rh$

    ```


    A *sphere* is a three-dimensional object where all points are fixed distance away
    from its center. What is the volume of a sphere of radius $r$? Such a sphere would
    fit inside a cylinder of radius $r$ and height $2r$, so its volume must be less
    than $\pi r^2(2r) = 2\pi r^3$. As luck (and calculus) would have it, the sphere
    occupies two-thirds of that space. In other words, the volume of a sphere is


    ```

    $V_{sphere}=\frac{4}{3}\pi r^3$

    ```'
