  md: '# The Magic of Math


    and $\pi$ is the same for every circle! Or if you prefer, you can write this as
    a formula for the circumference of any circle. Given the diameter $D$ or radius
    $r$ of any circle, we have


    ```

    $C = \pi D$

    ```


    or


    ```

    $C = 2\pi r$

    ```


    The digits of $\pi$ begin as follows:


    ```

    $\pi = 3.14159...$

    ```


    We will provide more digits of $\pi$ and discuss some of its numerical properties
    in this chapter.


    > Aside

    Interestingly, the human eye is not so good at estimating circumferences. For
    example, take any large drinking glass. What do you think is bigger, its height
    or its circumference? Most people think the height is bigger, but it''s usually
    the circumference. To convince yourself, put your thumb and middle finger on opposite
    sides of a glass to determine its diameter. You will likely see that your glass
    is less than 3 diameters tall.


    We can now answer question 1 from the beginning of the chapter. If we think of
    the radius of the Earth as a perfect circle with circumference $C = 25,000$ miles,
    then its radius must be


    ```

    $r = \frac{C}{2\pi} = \frac{25,000}{6.28} \approx 4000$ miles

    ```


    But we don''t actually need to know the value of the radius to answer this question.
    We all really need to know how much the radius will change if we increase the
    circumference by 10 feet. Adding 10 feet to the circumference will create a slightly
    larger circle with a radius that is larger by exactly $10/2\pi = 1.59$ feet. Here
    would be enough space beneath the root that you could crawl under it (but not
    walk under, unless you were to go a limbo dancer!). What is especially surprising
    about this problem is that the answer of 1.59 feet does not depend at all on the
    Earth''s actual circumference. You would get the same answer with any planet or
    with a ball of any size! For example, if we have a circle with circumference $C
    = 50$ feet, then its radius is $50/(2\pi) \approx 7.96$. If we increase the circumference
    by 10 feet, then the new radius is $60/(2\pi) \approx 9.55$, which is bigger by
    about 1.59 feet.'
