  md: '# 144 The Magic of Math


    Among the numbers from 1 to 100, there are exactly 25 primes. Among the next hundred
    numbers, there are 21 primes, 16 primes among the hundred numbers after that.
    As we look at larger and larger numbers, primes tend to become rarer (but not
    in a predictable way—for example there are still 16 primes between 300 and 400
    and 17 primes between 400 and 500). The number of primes between 1,000,000 and
    1,000,100 is only 6. The fact that primes become more scarce makes sense because
    a large number has so many numbers below it that it could potentially divide it.


    We can prove that there are stretches of 100 numbers with no primes. There are
    even priceless collections of consecutive numbers of length 1000, or 1 million,
    or as long as you''d like. Let me try to convince you of this fact instantly providing
    you with 99 consecutive composite numbers (although this isn''t the first time
    this happens). Consider the 99 consecutive numbers


    100! + 2, 100! + 3, 100! + 4, ..., 100! + 100


    Since 100! = 100 × 99 × ... × 3 × 2 × 1, it is divisible by all the numbers from
    2 to 100. Now consider a number like 100! + 53. Since 53 divides into 100!, then
    it must also divide into 100! + 53. The same argument shows that for all 2 ≤ k
    ≤ 100, 100! + k must be a multiple of k, so it must be composite.


    # Aside


    > Note that our argument doesn''t say anything about the primeness of 100! + 1,
    but we can determine that as well. There is a beautiful theorem called Wilson''s
    theorem, which says that n is a prime number if and only if (n-1)! + 1 is a multiple
    of n. Try it on a few small numbers to see in action: 1! + 1 = 2 is a multiple
    of 2; 2! + 1 = 3 is a multiple of 3; 3! + 1 = 7 is not a multiple of 4; 4! + 1
    = 25 is a multiple of 5; but not a multiple of 6; 6! + 1 = 721 is a multiple of
    7, and so on. Consequently, since 101 is prime, Wilson''s theorem says that 100!
    + 1 is a multiple of 101, and is therefore composite. Thus the numbers 100! +
    100 comprise 101 consecutive composite numbers.


    With prime numbers becoming scarcer and scarcer among the large numbers, it is
    natural to wonder if some point run out of primes. Euclid told us two thousand
    years ago, this will not be the case. But don''t just take his word for it; enjoy
    the proof for yourself.


    Theorem: there are infinitely many primes.'
