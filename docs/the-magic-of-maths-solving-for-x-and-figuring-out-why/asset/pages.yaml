    # The Magic of Calculus


    Going off on Tangents

    Mathematics of how things grow and change and move. In this chapter, we will learn
    how to determine the rate at which functions change and to approximate complicated
    functions with simpler functions like polynomials. Calculus is also a powerful
    tool for optimization and can be useful for determining how to choose your numbers
    in a way to maximize a quantity (like profit or volume) or minimize a quantity
    (cost or distance traveled).


    For example, suppose you have a square piece of cardboard, 12 inches per side,
    as shown on the next page. Suppose you cut x-by-x squares out of the corners and
    then fold the resulting tabs to create a tray. What is the maximum possible volume
    of the resulting tray?

    ’s start by computing the volume as a function of x. The base of the tray would
    have area (12-2x)(12-2x) and the height of the tray would be x, so the volume
    of the tray


    $V = (12 - 2x)^2x$'
