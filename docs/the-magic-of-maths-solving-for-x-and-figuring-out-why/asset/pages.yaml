    More satisfying are constructive proofs, which you exactly how to find the information
    you want. For example, one can show that every rational number $a/b$ must either
    terminate or repeat (since in the long division process, eventually $b$ must divide
    a number that has previously divided). But is the reverse statement true? Certainly
    a terminating decimal must be a rational number. For example, $0.12358 = 12,358/100,000$.
    But what about repeating decimals? For example, must the number $0.123123123...$
    necessarily be a rational number? The answer is yes, and there is a clever way
    to find exactly what number it is. Let''s give our mystery a name, like $w$ (as
    in waltz), so that


    $w = 0.123123123...$


    Multiplying both sides by 1000 gives us


    $1000w = 123.123123123...$


    Subtracting the first equation from the second, we get


    $999w = 123$


    and therefore


    $w = \frac{123}{999} = \frac{41}{333}$


    Let''s try this with another repeating decimal, where we don''t start repeating
    from the very first digit. What fraction is represented by the decimal expansion
    $0.83333...$? Here we let


    $x = 0.83333...$


    Therefore


    $100x = 83.3333...$


    and


    $10x = 8.3333...$'
