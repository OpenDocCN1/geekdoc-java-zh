    We suspected, and later proved, the sum of the first $n$ odd numbers is $n^2$.
    We accomplished this by a clever combinatorial proof where we counted the squares
    of a checkerboard in two different ways. But let''s try a different approach that
    doesn''t require as much cleverness. If I told you, or you accepted on faith,
    the sum of the first 10 odd numbers $1+3+\dots + 19$ has a total of $10^2 = 100$.
    If you accepted that statement, then it would automatically follow that when we
    added the 11th odd number, 21, the total would be 121, which is $11^2$. In other
    words, the truth of the statement for 10 terms automatically implies the truth
    of the statement for 11. That''s the idea of a *proof* by *induction*. We show
    that some statement involving $n$ is true at the beginning (usually the statement
    when $n=1$), then we show that *if* the theorem is true when $n=k$, then it will
    automatically continue to be true when $n=k+1$. This forces the statement to be
    true for all values of $n$. Proofs by induction are analogous to climbing a ladder:
    suppose we show that'
