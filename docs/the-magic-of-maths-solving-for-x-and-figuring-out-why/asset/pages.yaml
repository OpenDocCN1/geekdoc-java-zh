  md: '# The Magic of Algebra 49


    How does that help us? Notice that a number of the form 10(X + Y) would have to
    end in 0, and the digit (or) preceding the 0 be X+Y. Since X and Y are between
    1 and 10, X is greater than equal to Y, then X-Y is forced to be a one-digit number
    (between 0 and 9). Hence the last digit of the answer must be X-Y. For example,
    if you started with 9 and 3, then X=9 and Y=3. Hence the answer after Step 5 must
    begin with X+Y = 9+3 = 12 and end with X-Y = 9-3 = 6, resulting in 126. We know
    X+Y and X-Y, we can take their average to get ((X+Y)+(X-Y))/2 = X. For Y, we could
    calculate ((X+Y)-(X-Y))/2 (where would be (12-6)/2 = 6/3), but I find it simpler
    to just take the larger number you calculated and subtract the last digit of their
    answer (9-6=3) since X-(X-Y)=Y.


    > Aside\If you would like an additional challenge for yourself (and the spectator,
    who might want to use a calculator), you can ask the spectator to pick any two
    numbers between 1 and 100, but now in Step 3 you have them multiply their total
    by 100 instead of ten, then proceed as before. For example, if with an answer
