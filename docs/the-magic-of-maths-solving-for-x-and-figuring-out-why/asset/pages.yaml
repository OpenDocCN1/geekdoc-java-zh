  md: '# The Magic of Math


    don''t add up to anything. We say that the sum of all the positive numbers is
    infinity, denoted


    ```

    $1+2+3+4+5+\dots =\infty$

    ```


    which means that the sum grows without bound. In other words, the sum will eventually
    exceed one hundred, then one million, then one quadrillion, and so on. And yet,
    by the end of this chapter, we will see that a case could be made


    ```

    $1+2+3+4+5+\dots=\frac{-1}{12}$

    ```


    Are you intrigued? I hope so! As we shall see, when you enter the twilight zone
    of infinity, very strange things can happen, which is part of what makes mathematics
    so fascinating and fun.


    Is infinity a number? Not really, although it sometimes gets treated that way.
    Loosely speaking, mathematicians might say:


    ```

    $\infty+1=\infty\quad\infty+\infty=\infty\quad5\times\infty=\infty$

    ```


    Technically, there is no large number, since we can always add 1 to obtain a larger
    number. The symbol $\infty$ essentially means “arbitrarily large” or bigger than
    any positive number. Likewise, the term $-\infty$ means less than any negative
    number. By the way, since when we divide 1 by smaller and smaller positive numbers,
    the quantities $\infty-\infty$ (infinity minus infinity) and $1/0$ are undefined.
    It is tempting to define $1/0=\infty$, since when we divide 1 by smaller and smaller
    positive numbers, the quotient gets bigger and bigger. But the problem is that
    when we divide 1 by tiny negative numbers, the quotient gets more and more negative.


    # An Important Infinite Sum: The Geometric Series


    Let''s start with a statement that is accepted by all mathematicians, but seems
    wrong to most people when they first see it:


    ```

    $0.99999\dots=1$

    ```


    Everyone agrees that the two numbers are close, indeed extremely close, but still
    feel that they should not be considered the same number. Let me try to convince
    you that the numbers are in fact equal by offering different proofs. I hope that
    at least one of these explanations will satisfy you.'
