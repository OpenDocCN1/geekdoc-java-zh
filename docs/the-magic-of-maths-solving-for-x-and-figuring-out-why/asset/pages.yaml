  md: "# The Magic of i and e 237\n\nIn order to multiply and divide complex numbers\
    \ geometrically, we first need to measure their sizes. We define the length (or\
    \ magnitude) of a complex number $z$, denoted $|z|$, to be the length of the line\
    \ segment from the origin 0 to the point $z$. Specifically, if $z = a + bi$, then\
    \ by the Pythagorean theorem, $z$ has length\n\n```\n$|z| = \\sqrt{a^2 + b^2}$\n\
    ```\n\nFor example, as illustrated below, the point $3 + 2i$ has length $\\sqrt{3^2\
    \ + 2^2} = \\sqrt{13}$. Note that the angle $\theta$ corresponding to $3 + 2i$\
    \ would satisfy tan $\\theta = 2/3$. Thus $\theta = \\tan^{-1} 2/3 \\approx 33.7^{\\\
    circ}$ or about 0.588 radians.\n\n![](img/3f33497047d2980a16cc0a7e85f4c95f_247_0.png)\n\
    \nThe complex number $z = 3 + 2i$ has length $|z| = \\sqrt{13}$, and an angle\
    \ $\\theta$ where tan $\\theta = 2/3$\n\nIf you plot the points that have length\
    \ 1, you get the unit circle in the complex plane, shown on the next page. What\
    \ is the complex number on the circle associated with angle $\theta$? If this\
    \ were the $x-y$ Cartesian plane, then from Chapter 9 we know that it would be\
    \ the point $(\\cos\\theta, \\sin\\theta)$. So in the complex plane, this would\
    \ be $\\cos\\theta + i\\sin\\theta$. Likewise, any complex number with length\
    \ $R$ is of the form\n\n```\n$z = R(\\cos\\theta + i\\sin\\theta)$\n```"
