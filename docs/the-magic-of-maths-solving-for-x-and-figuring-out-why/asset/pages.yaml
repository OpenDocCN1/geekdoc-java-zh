  md: '# The Magic of The Proofs


    So if we have a mathematical statement that we think is true, how do we actually
    go about ourselves? Typically, we start by describing the mathematical objects
    that we are working with, like the collection of integers


    ..., -2, -1, 0, 1, 2, 3, ...


    consisting of all whole numbers: positive numbers, negative numbers, and zero.


    Once we have described our objects, we make assumptions about these objects we
    consider to be self-evident, like “The sum or product of two integers is always
    an integer.” (In the next chapter, geometry, we will assume statements “For any
    two points there is a line that goes through those points.”) These self-evident
    statements are called axioms. And from these axioms, a little logic and algebra,
    we can often derive other statements (called theorems) that are sometimes far
    from obvious. In this chapter, you will learn the basic tools of proving mathematical
    statements.


    Let’s try by proving some theorems that are easy to believe. The first time we
    have a statement like “The sum of two numbers is even” or “The product of two
    odd numbers is odd,” our mind typically checks the statement with a few examples,
    then concludes that it’s probably true or that it makes sense. You might even
    think that the statement is so self-evident that we could make it an axiom. But
    we don’t need to do, since we can prove this statement using the axioms we already
    know. To prove something about even and odd numbers, we need to be clear about
    what odd and even mean.


    An even number is a multiple of 2. To express this algebraically, we say n is
    even if n=2k where k is an integer. Is 0 an even number? Yes, since 0=2×0. We
    now need to prove that the sum of two even numbers is even.


    Theorem: If m and n are even numbers, then m+n is also an even number.


    This is an example of an “if-then” theorem. To prove such a statement, we typically
    assume the “if” part and, through a mixture of logic and algebra, show that the
    “then” part follows from our assumptions. Here we assume that m and n are even
    and want to conclude that m+n is also even.


    Proof: Suppose m and n are even numbers. Thus, m=2j and n=2k where j and k are
    integers. But then


    ```

    $m+n=2j+2k=2(j+k)$

    ```'
