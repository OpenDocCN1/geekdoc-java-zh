  md: '# Aside


    Here''s another trick that algebra can help us explain. Write down any three-digit
    number where the digits are in decreasing order, like 842 or 951. Reverse those
    numbers and subtract the second number from the first. Whatever your answer is,
    reverse it, and then add those two numbers together. Let''s illustrate with the
    number 853.


    | 853 | 495 |

    | --- | --- |

    | - 358 | + 594 |

    | 495 | 1089 |


    Now try it with a different number. What did you get? Remarkably, as long as you
    follow the instructions properly, you will always end up with 1089! Why?


    Algebra to the rescue! Suppose we state the three-digit number $abc$ where $a
    > b > c$. Just as the number $853 = (8 \times 100) + (5 \times 10) + 3$, the number
    $abc$ has value $100a + 10b + c$. When we reverse the digits, we get $cba$, which
    has value $100c + 10b + a$. Subtracting, we get


    ```

    $$(100a + 10b + c) - (100c + 10b + a)$

    $= (100a - a) + (10b - 10b) + (c - 100c)$

    $= 99a - 99c = 99(a - c)$

    ```


    In other words, the difference has to be a multiple of 99. Since the original
    number has digits in decreasing order, $a - c$ is at least 2, so it must be 2,
    3, 4, 5, 6, 7, 8, or 9. Consequently, after subtracting, we are guaranteed to
    have one of these numbers:


    198, 297, 396, 495, 594, 693, 792, or 891


    In each of these situations, we add the number to its reverse,


    ```

    $198 + 891 = 297 + 792 = 396 + 693 = 495 + 594 = 1089$

    ```


    we see that we are forced to end with 1089.


