  md: '# The Magic of π 201


    Greek letter τ (tau, rhymes with “wow”) has been adopted to represent this quantity


    τ = 2π


    Many people believe that if we could go back in time, mathematical formulas and
    key concepts in trigonometry would be expressed more simply using τ instead of
    π. These ideas have been elegantly and entertainingly expressed in articles by
    Bob Palais (“π is Wrong!” and Michael Hartl (“The Tau Manifesto”). The “central
    point” of the argument is circles defined in terms of their radius, and when we
    compare the circumference to the radius, we have C/r=2π=τ. Some textbooks are
    now labeled as“τ-compliant” to indicate that they will express formulas in terms
    of π and τ.(Although switching to this constant may not be as easy as pie,” many
    students and teachers agree that τ is easier than π.) It will be interesting to
    see what happens to this movement in the coming decades. Supporters of τ (who
    call themselves tauists) earnestly believe that the truth is on their side, but
    they are tolerant of the more traditional notation. As they like to say, tauists
    are never pious.


