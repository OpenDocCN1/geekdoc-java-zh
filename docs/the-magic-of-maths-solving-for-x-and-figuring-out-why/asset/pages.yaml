    \sin(90^\circ - B)$

    ```


    Earlier, we saw that these two statements were true when $B$ is an acute angle,
    but the algebra above makes it true for all angles. Likewise, if we replace $B$
    with $-B$ in the $\cos(A-B)$ theorem, we obtain


    ```

    $\cos(A+B) = \cos A \cos(-B) + \sin A \sin(-B)$\n= \cos A \cos B - \sin A \sin
    B$

    ```


    since $\cos(-B) = \cos B$ and $\sin(-B) = -\sin B$. When we let $B=A$ above, we
    get the double angle formula:


    ```

    $\cos(2A) = \cos^2 A - \sin^2 A$

    ```


    and since $\cos^2 A = 1 - \sin^2 A$ and $\sin^2 A = 1 - \cos^2 A$, we also get


    ```

    $\cos(2A) = 1 - 2\sin^2 A$ and $\cos(2A) = 2\cos^2 A - 1$

    ```


    We can build on these cosine identities to get related sine identities. For example,


    ```

    $\sin(A+B) = \cos(90 - (A+B)) = \cos((90 - A) - B)$\n= \cos(90 - A) \cos B + \sin(90
    - A) \sin B$\n= \sin A \cos B + \cos A \sin B$

    ```


    Setting $B=A$ gives us a double angle formula for sines,


    ```

    $\sin(2A) = 2\sin A \cos A$

    ```


    Or replacing $B$ with $-B$, we have


    ```

    $\sin(A-B) = \sin A \cos B - \cos A \sin B$

    ```'
