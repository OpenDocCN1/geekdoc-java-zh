    Let''s contrast the full house with getting exactly two pair. Such hands have
    two cards of one value, two cards of a different value, and another card of a
    third value, like


    ![](img/3f33497047d2980a16cc0a7e85f4c95f_91_0.png)


    Many people mistakenly start counting the paired values with 13 × 12, but this
    double-counts, since first picking queens followed by 7s is the same as first
    picking 7s followed by queens. The correct way to start is (¹³) (say picking queens
    followed by 7s and 7s together), then choosing a new value for the unpaired card
    (like 5), then assigning suits. The number of two-pair hands is


    ```

    $$\binom{13}{2}\binom{11}{1}\binom{4}{2}\binom{4}{2}\binom{4}{1} = 123,552$$

    ```


    which occurs about 5 percent of the time.

    We won''t go through all the rest of the poker hands in detail, but see if you
    can verify the following. The number of poker hands that are four of a kind, like
    A♠♥A♦A♠, is


    ```

    $$\binom{13}{1}\binom{12}{2}\binom{4}{4}\binom{4}{1} = 13 \times 12 \times 1 \times
    4 = 624$$

    ```


    A poker hand like A♠♥A♦♦8♠ is called three of a kind. The number of these is


    ```

    $$\binom{13}{1}\binom{12}{2}\binom{4}{3}\binom{4}{1} = 54,912$$

    ```


    The number of poker hands with exactly one pair, like A♠♥J♦8♠, is


    ```

    $$\binom{13}{1}\binom{12}{2}\binom{4}{2}4^3 = 1,098,240$$

    ```


    about 42 percent of all hands.'
