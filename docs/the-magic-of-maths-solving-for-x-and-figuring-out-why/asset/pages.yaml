  md: '# The Magic of Calculus 263


    **Theorem (the power rule):** For $n \ge 0$,


    $y = x^n$ has derivative $y'' = nx^{n-1}$


    For example,


    $if y = x^5$, then $y'' = 5x^4$


    and


    $if y = x^{10}$, then $y'' = 10x^9$


    Even a constant function, like $y=1$, can be differentiated by this rule, since
    since $1=x^0$ and $y=x^0$ has derivative $0x^{-1}=0$, for every value of $x$.
    This makes sense since the line $y=1$ is horizontal. As a consequence of the power
    rule and the previous theorem, we can now differentiate any polynomial. For example,
    if


    $y = x^{10} + 3x^5 - x^3 - 7x + 2520$


    then


    $y'' = 10x^9 + 15x^4 - 3x^2 - 2$


    The power rule is even true when $n$ is not a positive integer. Instance, if


    $y = \frac{1}{x} = x^{-1}$


    then


    $y'' = -1x^{-2} = \frac{-1}{x^2}$


    Likewise, if


    then


    $y = \sqrt{x} = x^{1/2}$


    $y'' = \frac{1}{2}x^{-1/2} = \frac{1}{2\sqrt{x}}$


    But we''re not ready to prove these facts yet. Before we learn how to differentiate
    more complicated functions, let''s take advantage of what we have learned so far
    to solve some other interesting and practical optimization problems.'
