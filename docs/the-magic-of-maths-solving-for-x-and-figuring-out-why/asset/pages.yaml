- img_proc: true
  md: '# 22 The Magic of Math


    It''s usually easy to determine how many digits will be in the answer by looking
    at the leading (leftmost) digits of each number. If the product of the leading
    digits is 10 or larger, the product is guaranteed to have m + n digits. (For example,
    with 271 × 82, the product of the leading digits is 2 x 8 = 16, so the answer
    has six digits.) If the product of the digits is 4 or smaller, then it will have
    m + n - 1 digits. For example, 314 × 159 has five digits. If the product of the
    leading digits is 5, 6, 7, 8, or 9, then closer inspection is required. For example,
    222 × 444 has five digits, but 234 × 456 has six digits. Both answers are very
    close to 100,000, which is what really matters.


    By reversing this rule, we get an even simpler rule for division: **An m-digit
    number divided by an n-digit number has m−n or m−n+1 digits.**


    For example, a nine-digit number divided by a five-digit number must have four
    or five digits. The rule for determining which to choose is even easier than the
    multiplication situation. Instead of multiplying and dividing the digits, we simply
    *compare* them. If the leading digit of the first number (the number divided)
    is smaller than the leading digit of the second number, it''s the smaller (m−n).
    If the leading digit of the first number is larger than the leading digit of the
    second number, it''s the larger (m−n+1). If the leading digits are the same, then
    we look at the digits and apply the same rule. For instance 314,159,265 divided
    by 12,358 will have a five-digit answer, but if we divide it by 62,831, the answer
    will have four digits. Dividing 161,803,398 by 14,142 will result in a five-digit
    answer since 16 is greater than 14.


    I won''t go through the process of doing mental division since it is similar to
    the pencil-and-paper method. (Indeed, any method for division problems on paper
    requires you to generate the answer from left to right!) But here are some shortcuts
    that can sometimes be helpful.


    When dividing by 5 (or any number ending in 5), the problem simplifies if you
    double the numerator and denominator. For example:


    ```

    34 ÷ 5 = 68 ÷ 10 = 6.8

    123 ÷ 4.5 = 246 ÷ 9 = 82 ÷ 3 = 27

    ```


    After doubling both numbers, you might notice that both 246 and 9 are divisible
    by 3 (we''ll say more about this in Chapter 3), so we can simplify the division
    further by dividing both numbers by 3.'
