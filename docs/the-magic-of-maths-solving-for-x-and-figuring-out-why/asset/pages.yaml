  md: 'Since your chance of winning in any given week is independent of previous weeks,
    your chance of losing all 100 weeks is


    ```

    $$(0.99)^{100} \approx 0.3660$$

    ```


    which is very close to


    ```

    $1/e \approx 0.3678794...$$

