    The final identity we prove in this section has many useful applications. We''ll
    prove it by induction, as well as a few other ways. The motivating question is:
    What do you get when you add up the first $n$ powers of 2, beginning with $2^0
    = 1$? Here are the first few powers of 2:


    +   1, 2, 4, 8, 16, 32, 64, 128, 256, 512, 1024, . . .


    As we start to add these numbers, we see:


    $1 = 1$

    $1+2 = 3$

    $1+2+4 = 7$

    $1+2+4+8 = 15$

    $1+2+4+8+16 = 31$


    Do you see the pattern? Each sum is 1 less than the next power of 2. The general
    formula is as follows:


    **Theorem:** For $n \ge 1$,


    > $1+2+4+8+\dots+2^{n-1} = 2^n-1$


    **Proof (by induction):** As noted above, the theorem is true when $n=1$ (and
    2, 3, 4, and 5, for that matter!). Assuming the theorem holds for $n=k$, we can
    say that


    > $1+2+4+8+\dots+2^{k-1} = 2^k-1$


    When we add the next power of 2, which is $2^k$, to both sides, we get


    > $1+2+4+8+\dots+2^{k-1}+2^k = (2^k-1)+2^k$

    $= 2\cdot2^k-1$

    $= 2^{k+1}-1$


    In Chapters 4 and 5, we proved many relationships by answering a counting question
    in two different ways. You might say that the following-ing combinatorial proof
    counts the most!'
