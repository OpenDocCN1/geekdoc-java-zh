  md: '# 126 The Magic of Math


    and since $j + k$ is an integer, $m + n$ is also a multiple of 2, so $m + n$ must
    be even.


    Notice that the proof relied on the axiom that the sum of two integers (here,
    $j + k$) must also be an integer. As you prove more statements, you are more likely
    to rely on previously proved theorems than the basic axioms. Mathematicians often
    denote the end of a proof with a designation like $\square$ or $\square$ or Q.E.D.
    on the right margin of the last line of proof, as seen above. Q.E.D. is the abbreviation
    for the Latin phrase *quod erat demonstrandum*, meaning “that was to be demonstrated.”
    (It’s also the abbreviation for the English phrase “quite easily done,” if you
    prefer.) If I think that a proof is particularly elegant, I will end it with a
    smiley $\odot$.


    After proving an if-theorem, mathematicians can''t resist wondering about the
    truth of the *converse* statement, obtained by reversing the “if” part and the
    “then” part. Here, the converse statement would be “If $m + n$ is an even number,
    then $m$ and $n$ are even numbers.” It’s easy to see that this statement is false,
    simply by providing a counterexample. For this statement, the counterexample is
    literally as


    ```

    $1 + 1 = 2$

    ```


    since this example shows that it’s possible to have an even sum when both numbers
    are not even.


    Our next theorem is about *odd numbers*. An odd number is a number that is *not*
    a multiple of 2. Consequently, when you divide an odd number by 2, you always
    get a remainder of 1. Algebraically, $n$ is odd if $n = 2k + 1$, where $k$ is
    an integer. This allows us to prove, by simple algebra, that the product of odd
    numbers is odd.


    **Theorem:** If $m$ and $n$ are odd, then $mn$ is odd.


    **Proof:** Suppose $m$ and $n$ are odd numbers. Then $m = 2j + 1$ and $n = 2k
    + 1$ for some integers $j$ and $k$. Thus, according to FOIL,


    ```

    $mn = (2j + 1)(2k + 1) = 4jk + 2j + 2k + 1 = 2(2jk + j + k) + 1$

    ```


    and since $2jk + k$ is an integer, this means that the number $mn$ is of the form
    “twice an integer plus 1.” Hence $mn$ is odd. $\square$


    What about the converse statement: “If $mn$ is odd, then $m$ and $n$ are odd?”
    This statement is also true, and we can prove it using a *proof by contradiction*.
    In a proof by contradiction, we show that rejecting the conclusion (here, the
    conclusion is that $m$ and $n$ are odd) leads to a problem. In particular, if
    we reject the conclusion, there would also'
