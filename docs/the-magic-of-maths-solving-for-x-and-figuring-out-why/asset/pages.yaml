  md: '**Question 2.** Two points X and Y are fixed on a circle, as in the figure

    below. We wish to choose a third point Z on the circle somewhere on

    the major arc (the long arc between X and Y, not the short arc). Where

    should we choose the point Z to maximize the angle $\angle XZY?

    A) Point A (opposite the midpoint of X and Y).

    B) Point B (the reflection of X through the center of the circle).

    C) Point C (as close to X as we can).

    D) It doesn''t matter. All angles will have the same measure.


    ![](img/3f33497047d2980a16cc0a7e85f4c95f_192_0.png)


    Which point on the major arc between X and Y results in largest angle? Is angle

    $\angle XAY$, $\angle XBY$, $\angle XCY$, or are they all the same?


    To answer these questions, we need to improve our understanding

    of circles. (Well, I suppose you don''t need circles to read the answers.

    The answers are B and D, respectively. But in order to appreciate why

    these answers are true, we need to understand circles.) A circle can be

    described by a point O and a positive number $r$ so that every point on

    the circle has a distance $r$ away from O, as shown on the opposite page.

    The point O is called the center of the circle. The distance $r$ is called the

    radius of the circle. As a mathematical convenience, a line segment $\overline{OP}$

    from O to a point P on the circle is also called a radius.


