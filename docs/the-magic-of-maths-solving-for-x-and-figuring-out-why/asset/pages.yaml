    # Perimeters and Areas


    The *perimeter* of a polygon is the sum of the lengths of its sides. For example,
    in a rectangle with a base of length $b$ and a height of length $h$, its perimeter
    would be $2b + 2h$, since it has two sides of length $b$ and two sides of length
    $h$. What about the area of the rectangle? We define the *area* of a 1-by-1 square
    (the *unit square*) to have area 1. When $b$ and $h$ are positive integers, like
    in the figure below, we can break up the region into $bh$ $1$-by-$1$ squares,
    so its area is $bh$. In general, for any rectangle with base $b$ and height $h$
    (where $b$ and $h$ are positive, but not necessarily integers), we define its
    area to be $bh$.


