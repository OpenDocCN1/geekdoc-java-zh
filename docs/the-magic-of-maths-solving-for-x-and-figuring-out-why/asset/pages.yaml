  md: '# # Aftermath


    I hope that this is not the last math book you ever read, since there is so much
    good material out there. Indeed, most of the really interest-ing math that I have
    learned from outside of the classroom, and included many of the items listed here.


    This book is an outgrowth of my video course The Joy of Mathematics, produced
    by The Great Courses. The course contains twenty-four 30-minute lectures by me
    on all of the topics covered in this book, plus a few more topics, like The Joy
    of Probability, Mathematical Games, and Magic. (I am grateful for their willingness
    to let me borrow many ideas from that course for this book.) The Great Courses
    has more than three dozen mathematics courses (available on audio, video, and
    downloadable formats) on many mathematical topics, including courses devoted to
    topics like algebra, geometry, calculus, and history of mathematics. They have
    done an excellent job at finding some of the best professors in the country to
    teach these courses, and it has been an honor and a privilege to create four courses
    for them. My three other courses are Discrete Mathematics, The Secrets of Mental
    Math, and The Mathematics of Games and Puzzles.


    For printed information on doing math in your head, see my book Secrets of Mental
    Math, written with Michael Shermer, by Randolph House. It goes into great detail
    on how to quickly and accurately answer all kinds of problems, by small and big.
    If you know your multiplication tables through 10, then you should be able to
    understand all of the techniques in the book. For a more elementary approach,
    I have created a workbook on doing mental addition and subtraction that is aimed
    at elementary-school-age children, called The Art of Mental Calculation (co-authored
    and beautifully illustrated by Natalya St. Clair). You can find it on Amazon.com
    or createspace.com.


    I have written three other mathematics books for advanced readers. The Mathematical
    Association of America (MAA) has published Proofs'
