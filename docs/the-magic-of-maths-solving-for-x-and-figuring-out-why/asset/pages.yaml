  md: 'Finally, let''s see what happens when we write the sum of all positive integers
    as $U$ and underneath that we write the previous (and unshifted) sum $T$.


    ```

    $U = 1+2+3+4+5+6+7+8+\dots$

    $$T = 1-2+3-4+5-6+7-8+\dots$$

    ```


    Subtracting the second equation from the first one reveals


    ```

    $U-T = 4+8+12+16+\dots = 4(1+2+3+4+\dots)$

    ```


    In other words,


    ```

    $U-T = 4U$

    ```


    Solving for $U$, we get $3U = -T = -1/4$, and therefore


    ```

    $U = -1/12$

    ```


    as claimed.


    For the record, when you add an infinite number of positive integers, the sum
    diverges to infinity. But before you dismiss all of these finite answers as pure
    magic with no redeeming qualities, it is possible that there is a context where
    this actually makes sense. By expanding our views of numbers, we saw a way in
    which the sum $1+2+4+8+16+\dots=-1$ was not so implausible. Recall also that when
    we confined numbers to the real line, it was impossible to find a number with
    a square of $-1$, yet this became possible once we viewed complex numbers as occupants
    of the plane with their consistent rules of arithmetic. In fact, theoretical physicists
    who study string theory actually use the sum $1+2+3+4+\dots=-1/12$ result in their
    calculations. When you encounter paradoxical results like the sum shown here,
    you could just dismiss them as impossible but if you allow your imagination to
    consider the possibilities, then a consistent and beautiful system can arise.


