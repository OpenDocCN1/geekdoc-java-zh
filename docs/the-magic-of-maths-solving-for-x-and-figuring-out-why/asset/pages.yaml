- img_proc: true
  md: 'Perhaps the quickest proof is that if you accept the statement that


    $$\frac{1}{3} = 0.33333...$


    then when you multiply both sides by 3 you get


    $$1 = \frac{3}{3} = 0.99999...$$


    Another proof is to use the technique that we used in Chapter 6 to evaluate repeating
    decimals. Let''s denote the infinite decimal expansion with the variable $w$ as
    follows:


    $$w = 0.99999...$$


    Now if we multiply both sides by 10, then we get


    $$10w = 9.99999...$$


    Subtracting the first equation from the second gives us


    $$9w = 9.00000...$$


    means that $w = 1$.\nHere''s an argument that uses no algebra at all. Do you agree
    that if two numbers are different, then there must be a different number in between
    them (for instance, their average)? Then suppose, to the contrary, $0.99999...$
    and 1 different numbers. If that were the case, what number would be in between
    them? If you can''t find another number between them, they can''t be different
    numbers.


    We say that two or infinite sums are equal if they are arbitrarily close to one
    another. In other words, the difference between the two quantities is less than
    any positive number you can name, whether it be 0.01 or 0.000001 or 1 divided
    by a trillion. Since the difference between 1 and $0.99999...$ is smaller than
    any positive number, mathematicians agree that we can call these quantities equal.


    It''s the same logic that we can evaluate the infinite sum below:


    $$$\frac{1}{2} + \frac{1}{4} + \frac{1}{8} + \frac{1}{16} + \dots = 2$$


    We can give this sum a physical interpretation. Imagine you are standing two meters
    away from a wall, and you take one step exactly one meter toward the wall, then
    another step half a meter toward the wall,'
