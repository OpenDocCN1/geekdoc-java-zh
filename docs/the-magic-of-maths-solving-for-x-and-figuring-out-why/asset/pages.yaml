    For example, $y = e^{x^3}$ has $y'' = (3x^2)e^{x^3}$.


    Notice that the function $y = e^{kx}$ has derivative $y'' = ke^{kx} = ky$. This
    is one of the properties that make exponential functions so important. They arise
    when the rate of growth of a function is proportional to the size of its output.
    This is why exponential functions arise so often in financial and biological problems.


    The natural logarithm $\ln x$ has the property


    $e^{\ln x} = x$


    for any $x > 0$. Let''s use the chain rule to determine its derivative. Differentiating
    $u(x) = \ln x$, we have $e^{u(x)} = x$. Differentiating both sides of the equation
    tells $u''(x)e^{u(x)} = 1$. In $\ln x = x$, but since $e^{u(x)} = x$, it follows
    that $u''(x) = 1/x$. In other words, if $y = \ln x$, then $y'' = 1/x$. Applying
    the chain rule again, we can obtain that if $y = \ln(g(x))$, then $y'' = \frac{g''(x)}{g(x)}$.


    We summarize the consequences of the chain rule here.


    | $y = f(g(x))$ | $y'' = f''(g(x))g''(x)$ |

    | $y = \sin(g(x))$ | $y'' = g''(x)\cos(g(x))$ |

    | $y = \cos(g(x))$ | $y'' = -g''(x)\sin(g(x))$ |

    | $y = (g(x))^n$ | $y'' = n(g(x))^{n-1}g''(x)$ |

    | $y = e^{g(x)}$ | $y'' = g''(x)e^{g(x)}$ |

    | $y = \ln(g(x))$ | $y'' = \frac{g''(x)}{g(x)}$ |


