    then a quarter of a meter, then an eighth of a meter, and so on. After each step,
    the distance between you and the wall is cut exactly in half. Ignoring the practical
    limitations of taking tinier and tinier steps, you eventually get as close to
    the wall as desired. Hence the total length of your steps would be exactly two
    meters.


    We can illustrate this sum geometrically, as in the figure below. We start with
    a 1-by-2 rectangle with area 2, then cut it in half, half again, then half again,
    and so on. The area of the first region is 1. The next region has area 1/2, then
    the next region has area 1/4, and so on. As $n$ goes to infinity, the regions
    fill up the entire rectangle, and so their total area is 2.


