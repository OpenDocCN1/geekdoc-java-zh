  md: 'you started with, so let''s represent it by the letter N. When we use a letter
    to represent an unknown number, the letter is called a variable.


    In Step 2, you are doubling the number, so you are now thinking of 2N. (We typically
    avoid using the multiplication symbol, especially since the letter x is frequently
    used as a variable.) After Step 3, your number is 2N + 10. For Step 4, we divide
    that quantity by 2, giving us N + 5. Finally, we subtract the original number,
    which was N. After subtracting N from N + 5, you are left with 5. We can summarize
    our trick in the following table.


    | Step 1 | N |

    | Step 2 | 2N |

    | Step 3 | 2N + 10 |

    | Step 4 | N + 5 |

    | Step 5 | N + 5 - N |

    | Answer | 5 |


    # Rules of Algebra


    Let''s start with a riddle. Find a number that when you add 5 to it, the number
    triples.


    To solve this riddle, let''s call the unknown number x. Adding 5 to it produces
    x + 5. Tripling the original number gives us 3x. We want those numbers to be equal,
    so we have to solve the equation


    ```

    3x = x + 5

    ```


    If we subtract x from both sides of the equation, we get


    ```

    2x = 5

    ```


    (Where does 2x come from? 3x - x is the same as 3x - 1x, equals 2x.) Dividing
    both sides of that by 2 gives us


    ```

    x = 5/2 = 2.5

    ```


    We can verify that this answer works, since 2.5 + 5 = 7.5, which is the same as
    3 times 2.5.'
