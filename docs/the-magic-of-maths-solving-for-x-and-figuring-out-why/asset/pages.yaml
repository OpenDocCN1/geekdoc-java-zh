  md: "# The Magic of Math\n\nThis notation means that the limit of $2+h$ as $h$ goes\
    \ to 2. Intuitively, as $h$ gets closer and closer to 0, $2+h$ gets closer and\
    \ closer to 2. So we have found that for the graph $y=x^2+1$ at the point $(1,2)$,\
    \ the slope of the tangent line is 2.\n\nThe general situation looks like this.\
    \ For the function $y=f(x)$, we want to find the slope of the tangent line at\
    \ the point $(x, f(x))$. As pictured, the slope of the secant line through the\
    \ point $(x, f(x))$ and the neighboring point $(x+h, f(x+h))$ is\n\n```\n$$\\\
    frac{y_2-y_1}{x_2-x_1} = \\frac{f(x+h)-f(x)}{x+h-x} = \\frac{f(x+h)-f(x)}{h}$\n\
    ```\n\n![](img/3f33497047d2980a16cc0a7e85f4c95f_270_0.png)\n\nThe slope of the\
    \ secant line through $(x, f(x))$ and $(x+h, f(x+h))$ is $\frac{f(x+h)-f(x)}{h}$\n\
    \nWe use the notation $f'(x)$ to denote the slope of the tangent line at the point\
    \ $(x, f(x))$,\n\n```\n$f'(x) = \\lim_{h\\to 0} \\frac{f(x+h)-f(x)}{h}$\n```\n\
    \nThis a complicated definition, so let's do some examples. For a straight line\
    \ $y=mx+b$, then $f(x)=mx+b$. To find $f(x+h)$ we replace $x$ with $x+h$ to obtain\
    \ $f(x+h)=m(x+h)+b$. Therefore, the secant slope equals to\n\n```\n$$\\frac{f(x+h)-f(x)}{h}\
    \ = \\frac{m(x+h)+b-(mx+b)}{h} = \\frac{mh}{h} = m$\n```"
