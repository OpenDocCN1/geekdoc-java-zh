  md: 'So why does the quadratic formula work? Let’s rewrite the equation $ax^2 +
    bx + c = 0$ as


    ```

    $ax^2 + bx = -c$$

    ```


    then divide both sides by $a$ (which is not 0) to get


    ```

    $$\frac{x^2}{a} + \frac{bx}{a} = -\frac{c}{a}$$

    ```


    And since $(x + \frac{b}{2a})^2 = x^2 + \frac{bx}{a} + \frac{b^2}{4a^2}$, we can
    complete the square by adding $\frac{b^2}{4a^2}$ to both sides of the above equation,
    giving us


    ```

    $$(x + \frac{b}{2a})^2 = \frac{b^2}{4a^2} + \frac{-c}{a} = \frac{b^2 - 4ac}{4a^2}$$

    ```


    Taking the square root of both sides,


    ```

    $$\frac{b}{2a} = \pm \frac{\sqrt{b^2 - 4ac}}{2a}$$

    ```


    Thus,


    ```

    $x = \frac{-b \pm \sqrt{b^2 - 4ac}}{2a}$$

    ```


    as desired.'
