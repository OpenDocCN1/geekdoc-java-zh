    this section, we switch to the capital-F Fibonacci numbers, since they will produce
    patterns.) The even numbers first appear in positions 3, 6, 9, 12, which suggests
    that they occur precisely every 3 terms. We can prove this by noticing that the
    pattern begins


    odd, odd, even


    and then is forced to repeat itself,


    odd, odd, even, odd, odd, even, odd, odd, even ...'
