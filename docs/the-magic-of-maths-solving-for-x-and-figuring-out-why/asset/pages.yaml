  md: '# CHAPTER ZERO


    # Introduction


    Throughout my life, I have always had a passion for magic. Whether I was watching
    other magicians or performing magic myself, I was fascinated with the methods
    used to accomplish amazing and impressive feats, and I loved learning its secrets.
    With just a handful of simple principles, I could even invent tricks of my own.


    I had the same experience with mathematics. From a very early age, I saw that
    numbers had a magic all their own. Here’s a trick you might enjoy. Think of a
    number between 20 and 100. Got it? Now add your digits together. Subtract the
    total from your original number. Finally, add the digits of the new number together.
    Are you thinking of the number 9? (If not, you might want to check your previous
    calculation.) Pretty cool, huh? Mathematics is filled with magic like this, but
    most of us are never exposed to it in school. In this book, you will see how numbers,
    shapes, and pure logic can yield delightful surprises. And with just a little
    bit of algebra or geometry, you can often discover the secrets behind the magic,
    and perhaps even discover some beautiful mathematics of your own.'
  merge: -1
