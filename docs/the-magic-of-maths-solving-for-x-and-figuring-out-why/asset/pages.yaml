  md: '# The Magic of Numbers 13


    1, 4, 9, 16, 25, ..., which were $1^2, 2^2, 3^2, 4^2, 5^2$, and so on. Does this
    pattern always work? I decided to try another example, by looking at pairs of
    numbers that add up to 26.


    # Distance Below 169


    $13 \times 13 = 169$ | |

    $12 \times 14 = 168$ | 1

    $11 \times 15 = 165$ | 4

    $10 \times 16 = 160$ | 9

    $9 \times 17 = 153$ | 16

    $8 \times 18 = 144$ | 25

    $:$ | $:


    Once again, the product was maximized when we chose the two numbers to be equal,
    and then the product decreased from 169 by 1, then 4, 9, and so on. After a few
    more examples, I was convinced the pattern was true. (I''ll show you the algebra
    behind it later.) Then I saw a way that this pattern could be applied to squaring
    numbers faster.


    Suppose we want to square the number 13. Instead of performing $13 \times 13$
    directly, we will perform the easier calculation of $10 \times 16 = 160$. This
    is almost the answer, but since we went up and down 3, it is shy of the answer
    by $3^2$. Thus,


    $13^2 = (10 \times 16) + 3^2 = 160 + 9 = 169$


    Let''s try another example. Try doing $98 \times 98$ using this method. To do
    this, we go up 2 to 100, then down 2 to 96, then add $2^2$. That is,


    $98^2 = (100 \times 96) + 2^2 = 9600 + 4 = 9604$


    Squaring numbers that end in 5 are especially easy, since when we go up and down
    5, the numbers you are multiplying both end in 0. For example,


    $35^2 = (30 \times 40) + 5^2 = 1200 + 25 = 1225$


    $55^2 = (50 \times 60) + 5^2 = 3000 + 25 = 3025$


    $85^2 = (80 \times 90) + 5^2 = 7200 + 25 = 7225$'
