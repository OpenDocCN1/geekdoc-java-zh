  md: '![](img/3f33497047d2980a16cc0a7e85f4c95f_101_0.png)


    After the 12th day of Christmas, how many gifts did my true love give to me?


    On the $nth$ day of Christmas, the number of gifts you receive


    $1 + 2 + 3 + \cdots + n = \frac{n(n+1)}{2} = \binom{n+1}{2}$


    (This comes from our formula for triangular numbers or from the hockey stick identity
    when $k=1$). So on the first day you get $\binom{2}{2} = 1$ gift; on the second
    day you get $\binom{3}{2} = 3$ gifts, and so on through the 12th day, when you
    receive $\binom{13}{2} = \frac{13 \times 12}{2} = 78$ gifts. Applying the hockey
    stick identity, it follows that the total number of gifts will be


    $\binom{2}{2} + \binom{3}{2} + \cdots + \binom{13}{2} = \binom{14}{3} = \frac{14
    \times 13 \times 12}{3!} = 364$


    Thus, if you spread these gifts out over the next year, you could enjoy a new
    gift practically every day (perhaps taking one day off for your birthday!)


    Let''s celebrate our answer to the last problem with a festive song I call "The
    $nth$ Day of Christmas."'
