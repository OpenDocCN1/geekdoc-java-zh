    Once we know the derivatives of sine and cosine, we can differentiate the tangent
    function.


    **Theorem:** For $y = \tan x$, $y'' = 1/(\cos^2 x) = \sec^2 x$.

    **Proof:** Let $u(x) = \tan x = $(\sin x) / (\cos x)$. Then


    $$\tan(x) \cos x = \sin x$$


    Differentiating both sides and using the product rule, we get


    $$\tan x(-\sin x) + \tan''(x) \cos x = \cos x$$


    Dividing through $\cos x$ and solving for $\tan''(x)$ gives us


    $$\tan''(x) = 1 + \tan x \tan x = 1 + \tan^2 x = \frac{1}{\cos^2 x}x$$


    where the second-to-last equality is obtained by dividing the identity $\cos^2
    x + \sin^2 x = 1$ by $\cos^2 x$.


    Taking a similar approach allows us to prove the quotient rule for differentiation.

    If $u(x) = f(x)/g(x)$, then


    **Theorem (quotient rule):**

    $$$\u''(x) = \frac{g(x)f''(x) - f(x)g''(x)}{g(x)g(x)}$$$'
