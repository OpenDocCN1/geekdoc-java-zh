  md: '# 258 The Magic of Math


    Given any two points, we can draw a line through them and determine the slope
    of the line without needing the line’s formula. The slope of the line that goes
    through the point $(x_1, y_1)$ and $(x_2, y_2)$ is given by the “rise over run”
    formula:


    ```

    $m = \frac{y_2 - y_1}{x_2 - x_1}$

    ```


    For example, take any two points on the line $y=2x + 3$, say the points (0,3)
    and (4,11). Then the slope of the line connecting them is $m = \frac{y_2 - y_1}{x_2
    - x_1} = (11 - 3) / (4 - 0) = 8 / 4 = 2$, which is exactly the slope we see in
    the original equation of that line.


    Now consider the function $y = x^2 + 1$, as shown in the graph below. This graph
    is not a straight line and we can see that the slope is always changing. Let’s
    try to determine the slope of the tangent line at the point (1,2).


    ![](img/3f33497047d2980a16cc0a7e85f4c95f_268_0.png)


    For $y = x^2 + 1$, find the slope of the tangent line at the point (1,2)


    The bad news is that it takes two points to determine a slope, and we only have
    the one point (1,2). Thus we first approximate the slope of the tangent line by
    looking at a line that goes through two points on the curve (a *secant line*),
    as shown on the right. If $x = 1.5$, then $y = (1.5)^2 + 1 = 3.25$. According
    to our slope formula, the slope of the line from (1,2) to (1.5,3.25).


    ```

    $m = \frac{y_2 - y_1}{x_2 - x_1} = \frac{3.25 - 2}{1.5 - 1} = 2.5$

    ```'
