  md: '# The Magic of Math


    I get the distinct impression that you are now thinking of the number 9. Is that
    right? (If not, then you may want to recheck your arithmetic.)


    What is magical about the number 9? In the rest of this chapter, we''ll see some
    of its magical properties, and we''ll even consider a world where it makes sense
    to say that 12 and 3 are functionally the same! The first magical property of
    the number 9 can be seen by looking at its multiples:


    +   9, 18, 27, 36, 45, 54, 63, 72, 81, 90, 108, 117, 126, 135, 144...


    What do numbers have in common? If you add the digits of each number, it seems
    you always get 9. Let''s check a few of them: 18 has digit sum $1+8=9$; 27 has
    $2+7=9$; 144 has $1+4+4=9$. But wait, there''s an exception: 99 has digit sum
    18, but 18 is itself a multiple of 9. So here is the key result, which you may
    have been taught in primary school, and we will explain later in this chapter:


    > If a number is a multiple of 9, then its digit sum is a multiple of 9 (and vice
    versa).


    For example, the 123,456,789 has digit sum 45 (a multiple of 9), so it is a multiple
    of 9. Conversely, 314,159 has digit sum 23 (not a multiple of 9), so it is not
    a multiple of 9.


    To use this rule to understand our earlier magic trick, let''s examine the algebra.
    You started by thinking of a number, which we call N. After tripling it, you get
    3N, which becomes 3N+6 at the next step. Tripling that result gives us $3(3N+6)=9N+18$,
    which equals $9(N+2)$. If you decide to double the number, you have $18N+36=9(2N+4)$.
    Either your final answer is 9 times a whole number, and therefore you must end
    up with a multiple of 9. When you take the digits of this number, you must again
    have a multiple of 9 (probably 9 or 18 or 27 or 36), and the sum of digits must
    be 9.


    Here is a variation of the previous magic trick I also like to perform. Ask someone
    with a calculator to secretly choose one of these four-digit numbers:


    3141 or 2718 or 2358 or 9999


    These numbers are, respectively, the first four digits of $\pi$ (Chapter 8), the
