  md: '# 242 The Magic Math


    If we replace the fraction 1/n with x/n where x is any real number, then as n/x
    gets larger and larger, the number $(1 + x/n)^{n/x}$ gets closer and to e. Raising
    both sides to the power x (recalling that $(a^b)^c = a^{bc}$) gives us what''s
    called the exponential formula:


    $$\lim_{n\to\infty} (1 + x/n)^n = e^x$$


    The exponential formula has many interesting applications. Suppose you put 10,000
    dollars in a savings account that earns an interest rate of 0.06 (which is 6 percent
    per year). If the interest is applied annually, then at the end of one year, you
    would have 10,000(1.06) = 10,600 dollars. After two years, you would earn 6 percent
    on this new amount and have 10,000(1.06)^2 = 11,236 dollars. In three years, you
    would have 10,000(1.06)^3 = 11,910.16 dollars. After t years, you would have


    $$10,000(1.06)^t$$


    dollars. More generally, if we replace the rate of 0.06 with an interest rate
    r, and if you begin with a principal of P dollars, then at the end of t years,
    the amount of dollars you would be


    $$(1 + r)^t$$


    Suppose our 6 percent interest is compounded semiannually: so you earn 3 percent
    every six months. After a year you would have 10,000(1.03)^2 = 10,609 dollars,
    which is a little more than the 10,600 dollars for annual compounding. If the
    money is compounded quarterly, then you earn 1.5 percent four times a year, yielding
    10,000(1.015)^4 = 10,613.63 dollars. More generally, if our money is compounded
    n times per year, then after one year, you would have


    $$10,000 \left(1 + \frac{0.06}{n}\right)^n$$


    dollars. Letting n get very large is called continuous compounding. After the
    exponential formula, after one year you would have


    $$10,000 \lim_{n\to\infty} \left(1 + \frac{0.06}{n}\right) = 10,000e^{0.06} =
    10,618.36$$


    dollars, as shown in the next table.'
