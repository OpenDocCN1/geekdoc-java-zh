  md: '# Aside


    Proof: To prove the law of cosines, we consider three cases, depending on whether
    $\angle C$ is a right angle, acute, or obtuse. If $\angle C$ is a right angle,
    then $\cos C = \cos 90^\circ = 0$, so the law of cosines simply says that $c^2
    = a^2 + b^2$, which is true by the Pythagorean theorem.


    ![](img/3f33497047d2980a16cc0a7e85f4c95f_226_0.png)


    If $\angle C$ is acute, as in the figure above, draw the perpendicular line from
    $B$ to $\overline{AC}$ intersecting at point $D$; this splits $ABC$ into two right
    triangles. From the picture above and the Pythagorean theorem applied to $CBD$,
    we have $a^2 = h^2 + x^2$, and therefore


    ```

    $h^2 = a^2 - x^2$

    ```


    From triangle $ABD$, we have $c^2 = h^2 + (b-x)^2 = h^2 + b^2 - 2bx + x^2$, and
    therefore


    ```

    $h^2 = c^2 - b^2 + 2bx$

    ```


    Setting the above values of $h^2$ equal to each other gives us


    ```

    $c^2 - b^2 + 2bx - x^2 = a^2 - x^2$

    ```


    and therefore


    ```

    $c^2 = a^2 + b^2 - 2bx$

    ```


    And from right triangle $CBD$, we see that $\cos C = x/a$, so $x = a \cos C$.
    Thus, when $\angle C$ is acute,


    ```

    $c^2 = a^2 + b^2 - 2ab \cos C$

    ```


    If $\angle C$ is obtuse, we create the right triangle $CBD$ on the outside of
    the triangle, as shown in the figure opposite.


    (continues on the following page)'
