    The pattern seems to suggest that the sum of the numbers in the row is n³. Will
    this always be the case, or is it just some odd coincidence? To help us understand
    this pattern, check out the middle numbers in rows 1, 3, and 5. What do you see?
    The perfect squares 1, 9, and 25. Rows 2 and 4 don''t have middle numbers, surrounding
    the middle are the numbers 3 and 5 with an average of 4, and the numbers 15 and
    17 with an average of 16. Let''s see how we can exploit this pattern.


    Look again at row 5. Notice that we see that the sum is 5³ without actually adding
    the numbers by noticing that these five numbers are symmetrically centered around
    the number 25. Since the average of these five numbers is 5², their total must
    be 5² + 5² + 5² + 5² + 5² = 5 × 5² = 5³. Similarly, the average of the four numbers
    of row 4 is 4², so their total must be 4³. With a little bit of algebra (which
    we won''t do here), you can show that the average of the n numbers in row is n²,
    their total must be n³, as desired.


