  md: '# The Magic of Math


    Method 2 (method of tan gents): Find a friendly park ranger and offer her shiny
    new protractor if she tells you the height of the mountain. If no park ranger
    can be found, look for a gentleman with a nice tan who has possibly spent considerable
    time outdoors and might well know the answer to your question. The advantage of
    this approach is that you may make a new friend and don''t need to surrender your
    calculator. Also, if you are suspicious of the tan gent''s response, you can still
    climb the mountain and apply method 1. The disadvantage is that you lose your
