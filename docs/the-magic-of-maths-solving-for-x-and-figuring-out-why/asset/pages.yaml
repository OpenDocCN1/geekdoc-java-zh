  md: '# The Magic of Algebra


    without success, until the Norwegian mathematician Niels Abel proved, in the early
    nineteenth century, that such a formula was impossible for polynomials of degree
    5 or higher. This leads to a riddle that only mathematicians find funny: Why didn''t
    Isaac Newton prove the impossibility theorem for quintics? He wasn''t Abel! We''ll
    see all examples of how to prove things impossible in Chapter 6.


    # Aside


    Why does $x^{-1} = 1/x$? For example, why should $5^{-1} = 1/5$? Look at the pattern
    of numbers below:


    $5^3 = 125, 5^2 = 25, 5^1 = 5, 5^0 = ?, 5^{-1} = ??, 5^{-2} = ???$


    Notice that each time our exponent decreases by 1, the number is divided by 5,
    which makes sense if you think about it. For that pattern to continue, we would
    need $5^0 = 1$ and $5^{-1} = 1/5, 5^{-2} = 1/25$, and so on. But the real reason
    for it is because of the law of exponents, which says $x^a x^b = x^{a+b}$. Now
    the law makes perfect when $a$ and $b$ are positive integers. For instance, $x^2
    = x \cdot x$ and $x^3 = x \cdot x \cdot x$. Thus,


    $x^2 \cdot x^3 = (x \cdot x) \cdot (x \cdot x \cdot x) = x^5$


    Since we want the law to work for 0, then that would require


    $x^{a+0} = x^a$


    and since the left side equals $x^a$, so must the right side be. But that can
    only happen if $x^0 = 1$.

    Since we want the law of exponents to work for negative integers too, then this
    forces us to accept


    $x^1 \cdot x^{-1} = x^{1+(-1)} = x^0$


    Dividing both sides by $x$ implies that $x^{-1}$ must equal $1/x$. By a similar
    argument, $x^{-2} = 1/x^2, x^{-3} = 1/x^3$, and so on.

    And since we want the law of exponents to be true for all real numbers as well,
    that forces us to accept


    $x^{1/2} \cdot x^{1/2} = x^{1/2+1/2} = x^1 = x$


    Hence when we multiply $x^{1/2}$ by itself, we get $x$, and therefore (when $x$
    is a positive number) we have $x^{1/2} = \sqrt{x}$.'
