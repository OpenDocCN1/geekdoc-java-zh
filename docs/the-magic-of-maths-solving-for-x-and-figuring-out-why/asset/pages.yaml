- img_proc: true
  md: '# The Magic of Trigonometry 229


    Because of the circular nature of sines and cosines, both graphs repeat themselves
    $2\pi$ units. (Score another point for the tau-ists!) This makes sense because
    the angle $x+2\pi$ is the same as the angle $x$. We say that these graphs have
    period $2\pi$. Moreover, if you shift the cosine graph to the right by $\pi/2$
    units, it completely coincides with the sine graph. That''s because $\pi/2$ radians
    is $90^{\circ}$, and therefore


    ```

    $sin x = \cos(\pi/2 - x)\n= \cos(x - \pi/2)$

    ```


    For example, $sin 0 = 0 = \cos(-\pi/2)$ and $sin \pi/2 = 1 = \cos 0$.

    Since $tan x = sin x / cos x$, it is undefined whenever $cos x = 0$ (which happens
    halfway between each multiple of $\pi$). The graph of the tangent function has
    period $\pi$, as shown below.


    ![](img/3f33497047d2980a16cc0a7e85f4c95f_239_0.png)


    The graph of $y = \tan x$


    You can combine sine and cosine functions to create almost any function that behaves
    in a periodic way. This is why trigonometric functions are instrumental in modeling
    seasonal behavior like temperatures and economic data, or physical phenomena such
    as sound and water waves, electricity, or the beating of your heart.'
  merge: -1
  pgno: 239
