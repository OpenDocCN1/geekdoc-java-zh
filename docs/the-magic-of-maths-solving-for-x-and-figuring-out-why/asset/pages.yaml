  md: '# The Magic of Math


    $ab + ac$. This illustrates the distributive law whenever $a, b, c$ are positive
    numbers.


    By the way, we sometimes apply the distributive law to numbers and variables together.
    For instance,


    $3(2x + 7) = 6x + 21$


    When this equation is read from left to right, it can be interpreted as a way
    of multiplying 3 times $2x + 7$. When the equation is read from right to left,
    it can be seen as a way of factoring $6x + 21$ by “pulling out a 3” from $6x$
    and 21.


    > Aside

    Why does a negative number times a negative number equal a positive number? For
    instance, why $(-5) \times (-7) = 35$? Teachers can come up with many ways to
    explain this, from talking about canceling debts to simply saying ‘that’s just
    the way it is.’ But the real reason is that we want the distributive law to work
    for all numbers, not just for positive numbers. And if you want the distributive
    law to work for negative numbers (and zero), then you must accept the consequences.
    Let’s see why.


    Suppose you accept the fact that $-5 \times 0 = 0$ and $-5 \times 7 = -35$. (These
    can be proved too, using a strategy similar to what we are about to do, but most
    people are happy to accept these statements as true.) Now evaluate the expression


    $-5 \times (-7 + 7)$


    What does this equal? On the one hand, this is just $-5 \times 0$, which we know
    to be 0. On the other hand, using the distributive law, it must also $(-5) \times
    (-7)) + (-5) \times (7)$. Concurrently,


    $((-5) \times (-7)) + (-5) \times (7) = ((-5) \times (-7)) - 35 = 0$


    And since $(-5) \times (-7)) - 35 = 0$, we are forced to conclude that $(-5) \times
    (-7) = 35$. In general, the distributive law ensures that $(-a) \times (-b) =
    ab$ for all numbers $a$ and $b$.


    # The Magic of FOIL


    One important consequence of the distributive law is the FOIL rule of algebra,
    which says that for any numbers or variables $a, b, c, d$,


    $(a + b)(c + d) = ac + ad + bc + bd$'
