  md: '# The Magic of Math


    ## Aside

    If you liked the last proof, you will enjoy this one as well. The video game Tetris
    uses seven pieces of different shapes, sometimes given the names I, J, L, O, Z,
    T, and S.


    ![](img/3f33497047d2980a16cc0a7e85f4c95f_134_0.png)


    Each piece occupies exactly four squares, so it is natural to wonder whether it
    would be possible to arrange them in such a way that they form a 4-by-7 rectangle,
    where we are allowed to flip or rotate the tiles. This turns out to be an impossible
    challenge. How do you prove that it’s impossible? Color the rectangle with fourteen
    light squares and fourteen dark squares, as shown.


    ![](img/3f33497047d2980a16cc0a7e85f4c95f_134_1.png)


    Notice that, with the exception of the T tile, every piece must cover two light
    squares and two dark squares, no matter where it is located. But the T tile must
    cover three squares of one color and one square of the other color. Consequently,
    no matter where the other six tiles are located, they must cover exactly twelve
    light squares and twelve dark squares. This leaves two light squares and two dark
    squares to be covered by the T tile, which is impossible.'
