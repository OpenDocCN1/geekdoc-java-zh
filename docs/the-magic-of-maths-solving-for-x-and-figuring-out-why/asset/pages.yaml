  md: '# The Magic of Calculus 267


    The product rule is not just computationally useful; it also allows us to find
    derivatives of other functions. For example, we previously proved the power rule
    for positive exponents. But now we can prove that it is true for fractional and
    negative exponents too.


    For example, the power rule predicts that


    ```

    if y = \sqrt{x} = x^{1/2}, then y'' = \frac{1}{2}x^{-1/2} = \frac{1}{2\sqrt{x}}

    ```


    Let’s see why this is true using the product rule. Suppose $u(x) = \sqrt{x}$.
    Then


    ```

    u(x)u(x) = \sqrt{x}\sqrt{x} = x

    ```


    When we differentiate both sides, the product rule tells that


    ```

    u(x)u''(x) + u''(x)u(x) = 1

    ```


    Thus $2u(x)u''(x) = 1$, and therefore $u''(x) = \frac{1}{2\sqrt{x}}$, as predicted.


    > The power rule also predicts that for negative exponents, $y = x^{-n}$ should
    have the derivative $y'' = -nx^{-n-1} = \frac{-n}{x^{n+1}}$. To prove this, let
    $u(x) = x^{-n}$, where $n \ge 1$. Then, by definition, for $x \neq 0$, we have


    ```

    u(x)x^n = x^{-n}x^n = x^0 = 1

    ```


    When we differentiate both sides, the product rule tells that


    ```

    u(x)(nx^{n-1}) + u''(x)x^n = 0

    ```


    Dividing through $x^n$ and moving the first term to the other side, get


    ```

    u''(x) = \frac{-n}{x} = \frac{-n}{x^{n+1}}

    ```


    desired. Thus, if $y = 1/x = x^{-1}$, then $y'' = -1/x^2$. If $y = 1/x^2 = x^{-2}$,
    then $y'' = -2x^{-3} = -2/x^3$, and so on.'
