  md: '# The Magic of Math


    ### Aside

    Let’s prove this last relationship using the Binet formulas and a little algebra
    $(x-y)(x+y)=x^2-y^2$. Letting $h=(1-\sqrt{5})/2$, the Binet formulas for Fibonacci
    and Lucas numbers can be stated as


    ```

    $F_n = \frac{1}{\sqrt{5}}(g^n-h^n)$ and $L_n = g^n+h^n$

    ```


    When we multiply these expressions, we get


    ```

    $F_Ln_n = \frac{1}{\sqrt{5}}(g^n-h^n)(g^n+h^n) = \frac{1}{\sqrt{5}}(g^{2n}-h^{2n})
    = F_{2n}$

    ```


    So where does the name "golden ratio" come from? It the golden rectangle below,
    where the ratio of the long side to the short side is exactly $g=1.61803\dots$


    ![](img/3f33497047d2980a16cc0a7e85f4c95f_128_0.png)


    The golden rectangle produces a smaller rectangle that also has golden proportions


    If we label the short side as 1 unit and remove a 1-by-1 square from the rectangle,
    the resulting rectangle has dimensions 1-by-(g-1) and the ratio of its long side
    to short side is


    ```

    $\frac{1}{g-1}=\frac{1}{0.61803\dots}=1.61803\dots=g$

    ```


    Thus the smaller rectangle has the same proportions as the original rectangle.
    By the way, $g$ is the only number that has this nice property, since the equation
    $\frac{1}{g-1}=g$ implies $g^2-g-1=0$, and by the quadratic formula, the only
    positive number that satisfies this is $(1+\sqrt{5})/2=g$.'
