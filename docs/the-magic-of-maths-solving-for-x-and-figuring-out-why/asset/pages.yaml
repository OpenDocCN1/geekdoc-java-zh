  md: '# The Magic of Trigonometry 213


    ![](img/3f33497047d2980a16cc0a7e85f4c95f_223_0.png)


    Since adding or subtracting $360^\circ$ to an angle doesn''t really change the
    angle (it literally takes us full circle), we have for any angle $A$,$


    sin(A\pm360^\circ) = \sin A \quad \cos(A\pm360^\circ) = \cos A$


    A negative angle moves in the clockwise direction. For example, the angle $-30^\circ$
    is the same as the $330^\circ$. Notice that when you move $A$ degrees in the clockwise
    direction, you have the same $x$-coordinate as when you move $A$ degrees in the
    counterclockwise direction, but the $y$-coordinates will have opposite signs.
    In other words, for any angle $A$,


    $cos(-A) = \cos A \quad \sin(-A) = -\sin A$


    For example,


    $cos(-30^\circ) = \cos 30^\circ = \sqrt{3}/2 \quad \sin(-30^\circ) = -\sin 30^\circ
    = -1/2$


    When we reflect angle $A$ across the $y$-axis, we get the *supplementary angle*
    $180 - A$. This keeps the $y$-value on the unit circle unchanged, but the $x$-value
    is negated. In other words,


    $cos(180 - A) = -\cos A \quad \sin(180 - A) = \sin A$'
