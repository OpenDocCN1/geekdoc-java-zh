    remainders when divided by 9. The idea of replacing a number with its remainder
    is not new for most people. We have been doing it since we learned how to tell
    it. For example, if a clock indicates that the time is 8 o''clock (without distinguishing
    between morning or evening), then what time will it indicate in 3 hours? What
    about 15 hours? Or 27 hours? Or 9 hours ago? Although your first reaction might
    be to say that the hour would either be 11 or 23 or 35 or −1, as far as the clock
    is concerned, all those times are represented by 11 o''clock, and differ by multiples
    of 12. The notation mathematicians use is


    ```

    $11 \equiv 23 \equiv 35 \equiv -1 \pmod{12}$

    ```


    ![](img/3f33497047d2980a16cc0a7e85f4c95f_70_0.png)


    What time will the clock say in 3 hours? In 15 hours? Or 27 hours? Or 9 hours
    ago?


    In general, we say that $a \equiv b \pmod{12}$ if $a$ and $b$ differ by a multiple
    of 12. Equivalently, $a \equiv b \pmod{12}$ if $a$ and $b$ have the same remainder
    when divided by 12. More generally, for any positive integer $m$, we say that
    two numbers $a$ and $b$ are congruent modulo $m$, denoted $a \equiv b \pmod{m}$,
    if $a$ and $b$ differ by a multiple of $m$. Equivalently,


    $a \equiv b \pmod{m}$ if $a = b + qm$ for some integer $q$


    The nice thing about congruences is that they behave almost exactly the same as
    regular equations, and we can perform modular arithmetic by adding, subtracting,
    and multiplying them together. For example, if'
