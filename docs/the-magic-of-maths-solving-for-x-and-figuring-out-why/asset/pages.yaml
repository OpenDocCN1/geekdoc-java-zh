  md: '# The Magic of Trigonometry 205


    30-60-90 triangle. In an equilateral triangle, all sides have equal length, and
    all angles measure 60°. If we divide an equilateral triangle into two congruent
    halves, as pictured below, we obtain two right triangles with angles measuring
    30°, 60°, and 90°. If the sides of the equilateral triangle have length 2, then
    the hypotenuse of the right triangle will have length 2, and the short leg will
    have length 1. By the Pythagorean theorem, the long leg will have height $\sqrt{2^2-1^2}=\sqrt{3}$.
    Thus all 30-60-90 triangles have the same proportions, $1:\sqrt{3}:2$ (or as I
    remember it, they are as easy as $1, 2, \sqrt{3}$). In particular, if the hypotenuse
    has length 1, then the other side lengths are 1/2 and $\sqrt{3}/2$.


    ![](img/3f33497047d2980a16cc0a7e85f4c95f_215_0.png)


    In a 30-60-90 triangle, the sides are proportional to $1:\sqrt{3}:2$, respectively


    > ### Aside

    When positive integers $a,b,c$ satisfy $a^2+b^2=c^2$, we call $(a,b,c)$ a Pythagorean
    triple. The smallest and simplest triple is $(3,4,5)$, but there are infinitely
    many. Naturally, you could scale the triple by positive integer to get triples
    like $(6,8,10)$ or $(9,12,15)$ or $(300,400,500)$, but we would like more interesting
    examples. Here''s a clever way to create Pythagorean triples. Choose any two positive
    numbers $m$ and $n$ where $m > n$. Now let

    $$a=m^2-n^2 \quad\ b=2mn \quad\ c=m^2+n^2$$

    Notice that $a^2+b^2=(m^2-n^2)^2+(2mn)^2=m^4+2m^2n^2+n^4$, which equals $(m^2+n^2)^2=c^2$,
    so $(a,b,c)$ is a Pythagorean triple. For example, choosing $m=2, n=1$ produces
    $(3,4,5)$; $(m,n)=(3,4)$ gives us $(5,12,13)$; $(m,n)=(4,1)$ yields $(15,8,17)$;
    $(m,n)=(10,7)$ yields $(51,140,149)$. What is especially remarkable (and is proved
    in any course on number theory) that every Pythagorean triple can be created by
    this process.'
