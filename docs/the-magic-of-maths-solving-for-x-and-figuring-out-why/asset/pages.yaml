  md: '# Max-Min Problems


    Differentiation helps us determine where a function achieves its maximum or minimum
    values. For instance, for what value of x does the parabola $y = x^2 - 8x + 10$
    reach its lowest point?


    ![](img/3f33497047d2980a16cc0a7e85f4c95f_274_0.png)


    The parabola $y = x^2 - 8x + 10$ is at its lowest point when $y'' = 0$


    At the lowest point, the slope of the tangent line must be 0. Since $y'' = 2x
    - 8$, solving $2x - 8 = 0$ tells us that the minimum occurs when $x = 4$ (and
    $y = 16 - 32 + 10 = -6$). For the function $y = f(x)$, a value of $x$ that satisfies
    $f''(x) = 0$ is called a *critical point* of $f$. For the function $y = x^2 -
    8x+10$, the only critical point is $x = 4$.


    Where does the maximum occur? In the above problem, there is no maximum because
    the $y$-value of $x^2 - 8x+10$ can get arbitrarily big. If we were restricted
    to an interval, say $0 \le x \le 6$, then $y$ would be greatest at one of the
    endpoints. Here, we see that when $x = 0, y = 10$ and when $x = 6, y = -2$, so
    the function would be maximized at the endpoint $x = 0$. In general, we have the
    following important theorem.


    **Theorem (optimization theorem):** If a differentiable function $f(x)$ is maximized
    or minimized at a point $x^*$, then $x^*$ must be a critical point of $f$ or an
    endpoint.


