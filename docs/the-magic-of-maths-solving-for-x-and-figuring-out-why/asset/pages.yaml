    ticket where your chance of winning a prize is 1 in 100. If you buy a ticket for
    100 consecutive weeks, what are your chances of winning a prize at least once?
    Each week, your probability of winning is $1/100 =0.01$ and your chance of losing
    is $99/100 = 0.99$.'
