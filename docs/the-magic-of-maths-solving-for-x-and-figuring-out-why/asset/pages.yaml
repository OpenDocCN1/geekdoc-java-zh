  md: '# Aside


    Look at the reciprocals of all the numbers from 1 to 10:


    1/2 = 0.5, 1/3 = 0.333..., 1/4 = 0.25, 1/5 = 0.2


    1/6 = 0.1666..., 1/8 = 0.125, 1/9 = 0.111..., 1/10 = 0.1


    All of the decimal expansions either terminate or repeat after two terms. But
    the one weird exception is the fraction for 1/7, which repeats after six decimal
    places:


    1/7 = 0.142857 142857 ...


    (The reason all the other reciprocals end so quickly is that the other numbers
    from 2 through 11 divide into either 10, 100, 1000, 90, 90, or 99, but the first
    nice number that 7 divides into is 999,999.) If you write the decimal digits of
    1/7 in a circle, something magical happens:


    ![](img/3f33497047d2980a16cc0a7e85f4c95f_33_0.png)


    The 7th circle


    What''s remarkable is that all the fractions with denominator 1/7 can be created
    by going around the circle forever from the appropriate starting point. Specifically,


    1/7 = 0.142857 142857..., 2/7 = 0.285714 285714...,


    3/7 = 0.428571 428571..., 4/7 = 0.571428 571428...


    5/7 = 0.714285 714285..., 6/7 = 0.857142 857142...


    Let''s end this chapter with the question we asked a few days ago. What is the
    sum of all the numbers in the multiplication table? When you first read the question,
    it seems intimidating, just as summing the first 100 numbers might have. By becoming
    more familiar with the beautiful patterns that emerge when numbers dance, we have
    a better chance of finding a beautiful answer to this question.'
