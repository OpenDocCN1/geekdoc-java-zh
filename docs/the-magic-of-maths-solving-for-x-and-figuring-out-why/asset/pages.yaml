    > Aside

    Here is another pretty formula worth knowing, called Hero''s formula, which tells
    us the area of a triangle with its side lengths $a, b$, and $c$. The formula is
    straightforward once you calculate the semi-perimeter

    $$s = \frac{a+b+c}{2}$$

    Hero''s formula says that the area of the triangle with side lengths $a, b, c$
    is

    $$\sqrt{s(s-a)(s-b)(s-c)}$$

    nFor example, a triangle with side lengths 3, 14, 15 (first five digits of $\pi$)
    would have $s = (3+14+15)/2 = 16$. Therefore the triangle has area $\sqrt{16(16-3)(16-14)(16-15)}
    = \sqrt{416} \approx 20.4$.

    Hero''s formula can be derived from the law of cosines and a little bit heroic
    algebra.


    # Trigonometric Identities


    Trigonometric functions satisfy many interesting relationships, called identities.
    We have seen a few of them already, like


    $$\sin(-A) = -\sin A \quad \cos(-A) = \cos A$$


    but there are other interesting identities leading to useful formulas, which we
    will explore in this. The first identity comes from the formula for the unit circle:


    $$x^2 + y^2 = 1$$


    Since the point $(\cos A, \sin A)$ is on the unit circle, it must satisfy its
    relationship, and therefore $(\cos A)^2 + (\sin A)^2 = 1$. This gives us perhaps
    the most important identity in all of trigonometry.


    **Theorem:** For any angle $A$,


    $$\cos^2 A + \sin^2 A = 1$$


    So we have mainly been using the letter $A$ to represent an arbitrary angle, but
    there is certainly nothing special about that letter. The identity above is often
    stated with other letters. For instance,


    $$\cos^2 x + \sin^2 x = 1$$'
