  md: "# The Magic of Counting 79\n\n![](img/3f33497047d2980a16cc0a7e85f4c95f_89_0.png)\n\
    \nMany problems involving games of chance involve combinations. For example, in\
    \ the California Lottery, you pick 5 different numbers between 1 and 47. Additionally,\
    \ you choose a MEGA number between 1 and 27 (which is allowed to be a repeat of\
    \ one of your 5 chosen numbers). There are 27 choices for the MEGA number and\
    \ the other 5 numbers can be chosen $\binom{47}{5}$ ways. Hence the number of\
    \ possibilities is\n\n$27 \times \\left(\\frac{47}{5}\right) = 41,416,353$\n\n\
    Now let's switch gears and consider the game of poker. A typical poker hand consists\
    \ of 5 different cards chosen from 52 different cards, where the order of the\
    \ 5 cards is unimportant. Hence the number of poker hands is\n\n$\\frac{52}{5}\
    \ = \\frac{52!}{517!} = 2,598,960$\n\nIn poker, five cards of the same suit, such\
    \ as\n\n![](img/3f33497047d2980a16cc0a7e85f4c95f_89_1.png)\n\nis called *flush*.\
    \ How many flushes are there? To create a flush, first choose your suit, which\
    \ can be done in 4 ways. (Mentally, I like to commit to a definite choice, say\
    \ spades.) Now how many ways can you choose 5 cards of that suit? From the 13\
    \ spades in a deck, 5 of them can be chosen $\binom{13}{5}$ ways. Hence the number\
    \ of flushes is\n\n$4 \times \\left(\\frac{13}{5}\right) = 5148$"
