  md: '# The Magic of Proofs 147


    been forty-eight discovered perfect numbers, all of which are even. Are there
    any odd perfect numbers? Presently, nobody knows the answer to that question.
    It has been shown that if an odd number exists, then it would have to contain
    over three hundred digits, but nobody has yet proved they are impossible.


    There are many easily stated unsolved problems pertaining to prime numbers. We
    have already stated that it is unknown whether there are infinitely many Fibonacci
    numbers. (It has been shown that there are only two perfect squares along the
    Fibonacci numbers (1 and 144) and only two perfect cubes (1 and 8.) Another unsolved
    problem is known as Goldbach''s conjecture, which speculates that every number
    greater than 2 is the sum of two primes. Here, too, nobody has been able to prove
    this conjecture, but it has been proved if a counterexample exists, then it must
    have at least 19 digits. (A breakthrough was recently made on a similar-sounding
    problem. In 2013, Harald Helgott proved that every odd number bigger than 7 is
    the sum of at most three odd primes.) Finally, we define twin primes to be two
    prime numbers that differ by 2. The first examples of twin primes are 3, 5, 7,
    11, 13, 17, 19, 29 and 31, and so on. Can you see that 3, 5, and 7 are the only
    “prime triplets?” And even though it has been proved (as a special case of a theorem
    due to Dirichlet) that there are infinitely many primes that end in 1 (or end
    in 3 or end in 7 or end in 9), the question of whether there exists an infinite
    number of twin primes remains.


    Let''s end this chapter with a proof that''s a little fishy, but I hope you agree
    with the statement anyway.


    **Claim:** You''ll agree that the first few numbers are all very interesting.
    **Proof:** For instance, 1 is the first number, 2 is the first even number, 3
    is the first odd prime, 4 is the only number that spells itself F-O-U-R, and so
    on. Now suppose, to the contrary, that all numbers are interesting. Then there
    would have to be a first number, call it N, that was not interesting. But then
    that would make N interesting! Hence no uninteresting numbers exist!


