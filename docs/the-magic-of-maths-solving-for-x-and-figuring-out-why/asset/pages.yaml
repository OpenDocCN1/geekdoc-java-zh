    # # The Pythagorean Theorem


    The Pythagorean theorem, perhaps the most famous theorem of and indeed one of
    the most famous formulas in mathematics, serves a section of its own. In a right
    triangle, the side opposite the right angle is called the hypotenuse. The other
    two sides are called legs. The right triangle below has legs BC and AC and hypotenuse
    AB, with respective lengths a, b, and c.


    ![](img/3f33497047d2980a16cc0a7e85f4c95f_183_0.png)


    **Pythagorean theorem:** For a right triangle with leg lengths a and hypotenuse
    c,


    $a^2 + b^2 = c^2$$


    There are reportedly over three hundred proofs of the Pythagorean theorem, but
    we''ll present the simplest ones here. Feel free to skip some of the proofs. My
    goal is that at least one of the proofs makes you smile or say, “That’s pretty
    cool!


    **Proof 1:** In the picture on the next page, we have assembled right triangles
    to create a giant square.


    Question: What is the area of the giant square?

    Answer 1: Each side of the square has length $a + b$, so the area is $(a + b)^2
    = a^2 + 2ab + b^2$.


    Answer 2: On the other hand, the giant square consists of four triangles, each
    with area $ab/2$, along with a tilted square in the middle with area $c^2$. Is
    the middle object a square? We know that all four sides are equal and if we rotated
    the figure 90 degrees, it would be identical, and so each of the middle square’s
    angles must be the same. Since the sum of the angles in a quadrilateral is 360
    degrees, we know that each angle must be 90 degrees.) Therefore the area is $4(ab)/2
    + c^2 = 2ab + c^2$.


    Equating answers 1 and 2 gives us


    $a^2 + 2ab + b^2 = 2ab + c^2$$'
