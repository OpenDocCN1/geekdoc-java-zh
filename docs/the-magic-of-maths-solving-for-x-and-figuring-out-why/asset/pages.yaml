    It follows that right triangle $OPS$ has area $\frac{1}{2} \cos h \sin h$, and
    right triangle $OQR$ has area $\frac{1}{2}ORQR = \frac{1}{2} \tan h = \frac{\sin
    h}{\cos h}$.


    Now focus on the sector $OPR$, which is a wedge-shaped object. The area of the
    unit circle is $\pi r^2 = \pi$, and sector $OPS$ is just a fraction $h/(2\pi)$
    of the unit circle. Therefore sector $OPR$ has area $\pi(h/2\pi) = h/2$.


    Since sector $OPR$ contains triangle $OPS$ and is contained inside triangle $OQR$,
    by comparing their areas we have


    $$\cos h \sin h < \frac{h}{2} < \frac{\sin h}{2 \cos h}$


    Multiplying through $\frac{2}{\sin h} > 0$, we have


    $$\cos h < \frac{h}{\sin h} < \frac{1}{\cos h}$


    $$\cos h < \frac{\sin h}{h} < \frac{1}{\cos h}$


    As $h \to 0$, both $\cos h$ and $1/\cos h$ go to $1$, as desired.


