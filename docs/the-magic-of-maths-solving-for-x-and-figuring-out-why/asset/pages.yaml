    Cow-culus question: Where should the cow drink to minimize the total amount of
    walking?


    Assuming Clara walks in a straight line from her starting point (0,1) to the drinking
    point (x,0), then the Pythagorean theorem (or the distance formula) tells us that
    the length of the line to the drinking point is $\sqrt{x^2+1}$ and the length
    of the trip to the barn at $B=(3,2)$ is $\sqrt{(3-x)^2+4}=\sqrt{x^2-6x+13}$. Hence
    the problem is to determine the number $x$ (between 0 and 3) that minimizes


    $y = \sqrt{x^2+1}+\sqrt{x^2-6x+13}=(x^2+1)^{1/2}+(x^2-6x+13)^{1/2}$


    When we differentiate the above expression (using the chain rule) and set it to
    0, we get


    ```

    $\frac{x}{\sqrt{x^2+1}}+\frac{x-3}{\sqrt{x^2-6x+13}}=0$

    ```


    You can verify that when $x=1$, the left side of the equation becomes $1/\sqrt{2}-2/\sqrt{8}$,
    which equals 0. (You can solve the equation directly by putting $x/\sqrt{x^2+1}$
    on the other side of the equation, squaring both sides and cross-multiplying.
    A lot of cancellation occurs, and the only solution between 0 and 3 is $x=1$.)


    We can confirm our answer with just a little reflection like we did in Chapter
    7. Imagine that instead of Clara going to the barn at (3,2) after her drink, she
    went to the barn''s reflection at $B''=(3,-2)$, as in the figure on the next page.


    The distance to $B''$ is exactly the same as the distance to $B$. And every point
    from above the river to the river must cross the x-axis somewhere. The path with
    the shortest distance is the straight line'
