  md: '# The Magic of Numbers 15


    about mental math. We spend an awful amount of time learning pencil-and-paper
    arithmetic, but precious little time learning to do math in your head. And yet,
    in most practical situations, you are more likely to need to calculate mentally
    than to calculate on paper. For large calculations, you will use a calculator
    to get the exact answer, but you generally don’t use a calculator when reading
    a nutrition label or hearing a speech or listening to a sales report. For those
    situations, you just need a good mental estimate of the important quantities.
    The methods taught in school are fine for doing math on paper, but they are generally
    poor for doing math in your head.


    I could write a book on mental math strategies, but here are some of the essential
    ideas. The main tip, which I cannot emphasize enough, is to do the problems from
    left to right. Mental math is a process of constant simplification. You start
    with a hard problem and simplify it to easier problems until you reach your answer
    at the end.


    # Mental addition.


    Consider a problem like


    314 ÷ 159


    (I’m writing the numbers horizontally so you’re less tempted to go into pencil-and-paper
    mode.) Starting with 314, first add the number 100 to give us a simpler addition
    problem:


    414 + 59


    Adding 50 to 414 gives us an even simpler problem that we can solve right away:


    464 + 9 = 473


    That is the essence of mental addition. The only other useful strategy is that
    sometimes we can turn a hard addition problem into an easy subtraction problem.
    This often arises if we are adding the price of retail items. For example, let’s
    do


    $23.58 + $8.95


    Since $8.95 is 5 cents below $9, we first add $9 to $23.58, then subtract 5 cents.
    The problem simplifies to


    $32.58 – $0.05 = $32.53'
