  md: '# 128 The Magic of Math


    We are now ready to prove a simple fact about rational numbers.

    Theorem: The average of two rational numbers is also rational.


    Proof: Let x and y be rational numbers. Then there exist integers $a,b,c,d$ where
    $x=a/b$ and $y=c/d$. Notice $x$ and $y$ have average


    ```

    $$\frac{x+y}{2} = \frac{a/b+c/d}{2} = \frac{ad+bc}{2bd}$$

    ```


    and that average is a fraction when the numerator and denominator are integers.
    Consequently, the average of $x$ and $y$ is rational.


    Let''s think about what this theorem is saying. It says that for any two rational
    numbers, even if they are really, close together, we can always find another rational
    number between them. You might be tempted to consider that all numbers are rational
    (as the ancient Greeks believed for a while). But, surprisingly, that''s not the
    case. Let''s consider the number $\sqrt{2}$, which has decimal expansion $1.4142...$
    Now, there are many ways to approximate $\sqrt{2}$ with a fraction. For example,
    $\sqrt{2}$ is approximately $10/7$ or $1414/1000$, but neither of these fractions
    is a square that is exactly 2. But maybe we have just looked hard enough? The
    following theorem says that such a search would be futile. The proof, as is usually
    the case for theorems about irrational numbers, is by contradiction. In the proof
    below, we will exploit the fact that fraction can be reduced until it is in *lowest
    terms*, where the numerator and denominator share no common divisors bigger than
    1.


    **Theorem:** $\sqrt{2}$ is irrational.


    **Proof:** Suppose, to the contrary, that $\sqrt{2}$ is rational. Then there must
    exist positive integers $a$ and $b$ for which


    ```

    $$\sqrt{2} = a/b$$

    ```


    where $a/b$ is a fraction in lowest terms. If we square both sides of this equation,
    we have


    ```

    $$2 = a^2/b^2$$

    ```


    or equivalently,


    ```

    $$a^2 = 2b^2$$

    ```


    But this implies that $a^2$ must be an *even* integer. And if $a^2$ is even, then
    $a$ must also be even (since we previously showed that if $a$ we odd, then $a$
    times itself would be odd). Thus $a=2k$, for some integer $k$. Substituting that
    information into the equation above tells us that


    ```

    $$(2k)^2 = 2b^2$$

    ```'
