  md: '# The Magic of $\pi$ 197


    There are many simple ways to approximate $\pi$ as a fraction. For example,


    $\frac{314}{100} = 3.14$, $\frac{22}{7} = 3.142857$, $\frac{355}{113} = 3.1415929\dots$


    I particularly like the last approximation. Not only does it correctly give $\pi$
    to six decimal places, but it also uses the first three odd numbers twice: two
    1s, two 3s, and two 5s, in order!


    Naturally, it would be interesting to find a fraction that gives us $\pi$ exactly;
    otherwise we could simply say $\pi = \pi{\pi}$. In 1768, Johann Heinrich Lambert
    proved that such a search would be futile, showing that $\pi$ is irrational. Perhaps
    it could be written in terms of square roots or cubes of numbers? For example,
    $\sqrt{10} = 3.162\dots$ is pretty close. But in 1882, Ferdinand von Lindemann
    proved that $\pi$ is more than just irrational. It is *transcendental*, which
    means that $\pi$ is not the root of any polynomial with integer coefficients.
    For example, $\sqrt{2}$ is irrational, but it is not transcendental, since it
    is a root of the polynomial $x^2 - 2$.


    Although $\pi$ cannot be expressed as a fraction, it can be expressed as the sum
    or product of fractions, provided we use infinitely many of them! For example,
    we will see in Chapter 12


    $\pi = 4 \left(1 - \frac{1}{3} + \frac{1}{5} - \frac{1}{7} + \frac{1}{9} - \frac{1}{11}
    + \dots\right)$


    The formula above is beautiful and startling, yet it is not a very practical formula
    for calculating $\pi$. After 300 terms, we are still not any closer to $\pi$ than
    $22/7$. Here''s another astounding formula, called *Wallis''s formula*, where
    $\pi$ is expressed as an infinite product, although it also takes a long time
    to converge.


    $\pi = 4 \left(\frac{2}{3} \cdot \frac{4}{3} \cdot \frac{4}{5} \cdot \frac{6}{5}
    \cdot \frac{6}{7} \cdot \dots\right) = 4 \left(1 - \frac{1}{9}\right) \left(1
    - \frac{1}{25}\right) \left(1 - \frac{1}{49}\right) \left(1 - \frac{1}{81}\right)\dots$'
