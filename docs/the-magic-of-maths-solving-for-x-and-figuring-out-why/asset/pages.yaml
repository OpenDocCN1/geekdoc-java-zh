  md: '# The Magic of Proofs 135


    In Chapter 1, we noticed that “the sum of the cubes is the square of the sum.”
    That is,


    ```

    $$1^3 = 1^2$

    1^3 + 2^3 = (1+2)^2$

    1^3 + 2^3 + 3^3 = (1+2+3)^2$

    1^3 + 2^3 + 3^3 + 4^3 = (1+2+3+4)^2$$

    ```


    but we weren’t ready to prove it. We can now do it pretty quickly by induction.
    The general pattern says that for $n \ge 1$,


    ```

    $$1^3 + 2^3 + 3^3 + \dots + n^3 = (1+2+3 + \dots + n)^2$$

    ```


    and we already know that $1 + 2 + \dots + n = \frac{n(n+1)}{2}$, we prove the
    equivalent theorem, shown below.


    **Theorem:** For $n \ge 1$,


    ```

    $$1^3 + 2^3 + 3^3 + \dots + n^3 = \frac{n^2(n+1)^2}{4}$$$

    ```


    **Proof (by induction):** When $n=1$, the theorem gives us the statement $1^3=1^2(2^2)/4$.
    Inductively, if the theorem is true when $n=k$ so that


    ```

    $$1^3 + 2^3 + 3^3 + \dots + k^3 = \frac{k^2(k+1)^2}{4}$$$

    ```


    then when we add $(k+1)^3$ to both sides, we


    ```

    $$1^3 + 2^3 + 3^3 + \dots + k^3 + (k+1)^3 = \frac{k^2(k+1)^2}{4} + (k+1)^3$$

    $= (k+1)^2 \left( \frac{k^2}{2} + (k+1) \right)$$

    $= (k+1)^2 \left( \frac{k^2+4(k+1)}{4} \right)$$

    $= \frac{(k+1)^2(k+2)^2}{4}$$$

    ```


    as desired.'
