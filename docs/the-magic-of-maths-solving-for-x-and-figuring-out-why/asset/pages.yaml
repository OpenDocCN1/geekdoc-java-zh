  md: 'Are there any infinite sets of numbers that are *not* countable? The German
    mathematician Georg Cantor (1845–1918) proved that the real numbers, even when
    restricted to those that lie between 0 and 1, form an uncountable set. You might
    try to list them this way:


    +   0.1, 0.2, ..., 0.9, 0.01, 0.02, ..., 0.99, 0.001, 0.002, ..., 0.999, ...


    and so on. But that will only generate real numbers with a finite number of digits.
    For instance, the number $1/3=0.333...$ will never appear on this list. Could
    there be a more creative way to list all the real numbers? Cantor proved that
    would be impossible, by reasoning as follows. Suppose, to the contrary, that the
    real numbers were listable. To give a concrete example, suppose the list began


    ```

    0.31415926...

    ```


    ```

    0.271828459...

    ```


    ```

    0.61803398...

    ```


    ```

    0.123581321...

    ```


    ```

    ...

    ```


    We can prove that such a list is guaranteed to be incomplete by creating a real
    number that won''t be on the list. Specifically, we create the real number $0.r_1r_2r_3...$
    where $r_1$ is an integer between 0 and 9 and differs from the first number in
    the first digit (in our example, $r_1 \neq 3$) and $r_2$ differs from the second
    number in the second digit (here $r_2 \neq 7$) and on. For instance, we might
    create the number $0.2674$... Such a number can''t be on the list anywhere. Why
    is it not the million number on the list? Because it differs in the million decimal
    place. Hence any example of a list you create is guaranteed to be missing some
    numbers, so the real numbers are not countable. This is called Cantor''s diagonalization
    argument, but I like to call it proof by Cantor-example. (Sorry.)


    In essence, we have shown that although there are infinitely many rational numbers,
    there are considerably more irrational numbers. If you randomly choose a real
    number from the real line, it will almost certainly be irrational.'
