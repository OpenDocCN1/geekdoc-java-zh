  md: '# Aside


    Here''s another important fact about circles.


    **Theorem:** Let X and Y be opposite points on a circle. Then for any other point
    P on the circle, $\angle XPY = 90^\circ$.


    For example, in the figure below, angles $\angle XAY$, \angle XBY$, and $\angle
    XCY$ are all right angles.


    ![](img/3f33497047d2980a16cc0a7e85f4c95f_195_0.png)


    **Proof:** Draw the radius from $O$ to $P$, and suppose that $\angle XPO = x$
    and $\angle YPO = y$. Our goal is to show that $x + y = 90^\circ$.


    ![](img/3f33497047d2980a16cc0a7e85f4c95f_195_1.png)


    Since $\overline{OX}$ and $\overline{OP}$ are radii of the circle, they both have
    length $r$, and therefore triangle $XPO$ is isosceles. $\angle OXP = \angle XPO
    = x$. Similarly, $\overline{OY}$ is a radius and $\angle OYP = \angle YOP = y$.
    Since the angles of triangle $XYP$ must sum to $180^\circ$, we have $2x + 2y =
    180^\circ$, and therefore $x + y = 90^\circ$, desired.


    The theorem above is a special case of one of my favorite theorems from geometry
    — the central angle theorem, described in the next aside.'
