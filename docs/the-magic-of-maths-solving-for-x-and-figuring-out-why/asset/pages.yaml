    Math with an Exclamation Point!


    We began this book with the problem of adding the numbers from 1 to 100. We discovered
    the total of 5050 and found a nice formula for the sum of the first *n* numbers.
    Now suppose we were interested in finding the *product* of the numbers from 1
    to 100; what would we get? A really big number! If you''re curious, it''s the
    58-digit number


    ```

    93326215439444152681692388526670049071596826438162146

    8592693895217599933291506809416397615518286253697920

    827223758251109168640000000000000000000000

    ```


    In this chapter, we will see how numbers like this are the foundation of counting
    problems. These numbers will enable us to determine such things as the number
    of ways to arrange a dozen books on a bookshelf (nearly half a *billion*), your
    chance of being dealt one pair in poker (not bad), and your chance of winning
    the lottery (not good).


    ```

    n! = n × (n-1) × (n-2) × × 3 × 2 × 1

    ```


    For example,


    ```

    5! = 5 × 4 × 3 × 2 × 1 = 120

    ```'
