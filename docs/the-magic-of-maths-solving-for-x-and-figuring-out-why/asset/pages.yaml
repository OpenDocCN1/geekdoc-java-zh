    we get


    $2x = 20$


    Finally, when we divide both sides by 2, we are simply left with


    $x = 10$


    It’s always a good idea to check your answer. Here, we will see that $x = 10,
    3(2x + 10) = 3(30) = 90$, as desired. Are there any other solutions to the original
    equation? No, because such a value of $x$ would also have to satisfy the subsequent
    equations, as $x = 10$ is the only solution.


    Here’s a real-life algebra problem that comes from the *New York Times*, which
    reported in 2014 that the movie *The Interview*, produced by Sony Pictures, generated
    $15 million in online sales and rentals during its first four days of availability.
    Sony did not say how much of this total came from $15 online sales vs $6 rentals,
    but the studio did that were were about 2 million transactions overall. To solve
    the reporter’s problem, let $S$ denote the number of online sales and let $R$
    denote the number of online rentals. Since there were 2 million transactions,
    we know that


    $S + R = 2,000,000$


    and since each online sale is worth $15 and each online rental is worth $6, the
    total revenue satisfies


    $15S + 6R = 15,000,000$


    From the first equation, we see that $R = 2,000,000 - S$. This allows us to rewrite
    the second equation as


    $15S + 6(2,000,000 - S) = 15,000,000$


    or equivalently, $15S + 12,000,000 - 6S = 15,000,000$, which only uses the variable
    $S$. This can be rewritten as


    $9S + 12,000,000 = 15,000,000$'
