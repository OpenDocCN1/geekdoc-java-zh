  md: '# CHAPTER NINE


    # $20^\circ = \pi / 9$


    # The Magic of Trigonometry


    The High Point of Trigonometry


    The subject of trigonometry allows us to solve geometrical problems that can''t
    be solved using classical geometry. For example, consider the following problem.


    Question: Using only a protractor and pocket calculator, determine the height
    of a nearby mountain.


    We will provide five different methods for solving this problem. The first three
    methods actually require almost no math whatsoever!


    Method 1 (brute force approach): Climb to the top of the mountain and hurl your
    calculator off the mountain. (This may require considerable.) Measure the time
    it takes for your calculator to hit the ground (or listen for the scream of a
    backpacker below). If the time is t seconds, and we ignore the effects of air
    resistance and terminal velocity, then standard physics equations indicate that
    the height of the mountain is approximately $16t^2$ feet. The disadvantage of
    this approach is that the effects of air resistance and terminal velocity can
    be quite significant, so your calculation will be inaccurate. Also, you are unlikely
    to recover your calculator. And it requires akeeping device, which might have
    been on your calculator. The advantage of this method is that the protractor does
    not need to be used.'
