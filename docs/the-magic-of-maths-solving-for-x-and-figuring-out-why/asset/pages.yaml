    values, we see that


    $sin B = \frac{4}{5} = \cos A \cos B = \frac{3}{5} = \sin A$


    Here we have $sin B = \cos A$ and $\cos B = \sin A$. This is not a coincidence,
    since for any angle $\angle A$, the other angle will switch what it considers
    to be the opposite side and the adjacent side, but it will still have the same
    hypotenuse. Since $\angle A + \angle B = 90^{\circ}$, we have for any acute angle


    $sin(90^{\circ} - A) = \cos A \quad cos(90^{\circ} - A) = \sin A$


    Thus, for example, if a right triangle $ABC$ has $\angle A = 40^{\circ}$, then
    its complement $\angle B = 50^{\circ}$ has the property $sin 50^{\circ} = \cos
    40^{\circ}$ and $\cos 50^{\circ} = \sin 40^{\circ}$. In other words, the complement
    sine is equal to the cosine (which is the word "cosine" comes from).


