  md: 'For example, let''s look at what happens when we add the first several Fibonacci
    numbers together:


    ```

    1 = 1 = 2-1

    1+1 = 2 = 3-1

    1+1+2 = 4 = 5-1

    1+1+2+3 = 7 = 8-1

    1+1+2+3+5 = 12 = 13-1

    1+1+2+3+5+8 = 20 = 21-1

    1+1+2+3+5+8+13 = 33 = 34-1

    ```


    The numbers on the right side of the equation are not quite Fibonacci numbers,
    but they are close. In fact, each of those numbers is just one shy of being Fibonacci.
    Let''s see why that pattern makes sense. Consider the last equation, and see what
    happens when we replace Fibonacci number with the difference of the next two Fibonacci
    numbers. That is,


    ```

    1+1+2+3+5+8+13

    (2-1)+(3-2)+(5-3)+(8-5)+(13-8)+(21-13)+(34-21)

    = 34-1

    ```


    Notice how the 2 from (2-1) is canceled by the 2 from (3-2). Then the 3 from (3-2)
    is canceled by the 3 from (5-3). Eventually everything cancels except the largest
    term, 34, and the initial -1. In general, this shows that sum of the $n$ Fibonacci
    numbers has a simple formula:


    ```

    F1+F2+F3+...+Fn = Fn+2-1

    ```


