  md: '# The Magic of Math


    An equation like


    ```

    $x^2 + 4x = 12$$

    ```


    is a little more complicated to solve because of the 4x term, but there are a
    few different ways to go about it. Just like mental mathematics, mathematics,
    there is often more than one way to solve the problem.


    The first method that I try on problems like this is called the *factoring method*.
    The first step is to move everything to the left side of the equation, so that
    all remains on the right side is 0. Here, the equation becomes


    ```

    $x^2 + 4x - 12 = 0$$

    ```


    Now what? Well, as luck would have it, in the last section, when practicing our
    FOIL, we saw that $x^2 + 4x - 12 = (x+6)(x-2)$. Hence, our problem can be transformed
    to


    ```

    $$(x+6)(x-2) = 0$$

    ```


    The only way that the product of two quantities can be 0 is if at least one of
    those quantities is 0. Consequently, we must have $x+6=0$ or $x-2=0$, which means
    that


    ```

    $$x = -6$ or $x = 2$$

    ```


    which, you should verify, solves the original problem.

    According to FOIL, $(x+a)(x+b) = x^2+(a+b)x+ab$. This makes factoring a quadratic
    bit like solving a riddle. For instance, in the last problem, we found two numbers
    $a$ and $b$ with a sum of 4 and a product of $-12$. The answer, $a=6$ and $b=-2$,
    gives us our factorization. For practice, try to factor $x^2+11x+24$: find numbers
    with sum 11 and product 24. Since the numbers 3 and 8 do the trick, we have $x^2+11x+24=(x+3)(x+8)$.


    But now suppose we have an equation $x^2+9x=-13$. There is no easy way to factor
    $x^2+9+13$. But no fear! In cases like this, we are rescued by the **quadratic
    formula**. This formula says that


    has the solution


    ```

    $$x=\frac{-b\pm\sqrt{b^2-4ac}}{2a}$$

    ```


    where the $\pm$ symbol means "plus or minus." Here''s an example. For the equation


    ```

    $$x^2+4x-12=0$$

    ```'
