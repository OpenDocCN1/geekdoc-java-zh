  md: "# Geometrical Magic\n\nLet's end this chapter, as it began, with a magic trick\
    \ based on geometry. Most proofs of the Pythagorean theorem involve rearranging\
    \ the pieces of one geometrical object to obtain another with the same area. Starting\
    \ with an 8-by-8 square, as pictured below, it looks like we can cut it into four\
    \ pieces (all of which have Fibonacci number lengths of 3, 5, or 8!), reassemble\
    \ these pieces to create a 5-by-13 rectangle. (Try yourself!) This should be impossible,\
    \ since the first figure has area $8 \times 8 = 64$, while the second figure has\
    \ area $5 \times 13 = 65$. What's going on?\n\n![](img/3f33497047d2980a16cc0a7e85f4c95f_188_0.png)\n\
    \nCan a square of area 64 be reassembled to create a rectangle of area 65?\n\n\
    The secret to this paradox is that the diagonal “line” of the 5-by-13 rectangle\
    \ is not really a straight line. For example, the triangle labeled C has a hypotenuse\
    \ with slope $3/8 = 0.375$ (since its $y$-coordinate increases by 3 as its $x$-coordinate\
    \ increases by 8), while the top of the figure labeled D (a *trapezoid*) has a\
    \ slope of $2/5 = 0.4$ (since its $y$-coordinate increases by 2 as its $x$-coordinate\
    \ increases by 5). Since the slopes are different, it doesn't form a straight\
    \ line, and the same phenomenon occurs with the bottoms of the upper trapezoid\
    \ and triangle as well. Hence, if we actually looked closely at the rectangle,\
    \ like in the figure on the opposite page, we'd see a little bit of extra space\
    \ between the two “almost diagonal lines.” In that space, spread out over a large\
    \ region, is exactly one extra unit of area."
