  md: '# The Magic of Math


    # Aside


    Proof: Let $u(x) = f(x) + g(x)$. Then


    ```

    $$u(x+h) - u(x) = \frac{f(x+h) + g(x+h) - (f(x) + g(x))}{h} = \frac{f(x+h) - f(x)}{h}
    + \frac{g(x+h) - g(x)}{h}$$}$

    ```


    Taking the limit of both sides as $h \to 0$ gives us


    ```

    $$u''(x) = f''(x) + g''(x)$$

    ```


    Note that when we take the limit on the right side of the equation, we are using
    the fact that the limit of the sum is the sum of the limits. We won''t rigorously
    prove that, however, the intuition is that if the number $a$ is getting closer
    and closer to $A$ and $b$ is getting closer and closer to $B$, then $a+b$ is getting
    closer and closer to $A+B$. It''s also true that the limit of the product is the
    product of the limits and the limit of the quotient is the quotient of the limits.
    But the rules for derivatives are not quite as straightforward. For instance,
    the derivative of the product is not the product of the derivatives. For the second
    half of the derivative, if $v(x) = cf(x)$, then we have


    ```

    $$v''(x) = \lim_{h\to0} \frac{v(x+h) - v(x)}{h} = c \lim_{h\to0} \frac{f(x+h)
    - f(x)}{h} = c f''(x)$$$

    ```


    as desired.


    To differentiate $f(x) = x^4$, let''s first expand $f(x+h) = (x+h)^4 = x^4 + 4x^3h
    + 6x^2h^2 + 4xh^3 + h^4$. The coefficients of this expression, $1, 4, 6, 4, 1$,
    might look familiar to you, but they are row 4 of Pascal''s triangle, studied
    in Chapter 4. Thus, we have


    ```

    $$f(x+h) - f(x) = 4x^3h + 6x^2h^2 + 4xh^3 + h^4 = 4x^3 + h \times [STUFF]$$$

    ```


    and as $h \to 0$, we get $f''(x) = 4x^3$. Do you see a pattern? The derivatives
    of $x, x^2, x^3$, and $x^4$ are, respectively, $1, 2x, 3x^2$, and $4x^3$. Applying
    the same logic to higher exponents gives us the following powerful rule. Another
    popular notation for the derivative is $y''$, let''s start using it here.'
