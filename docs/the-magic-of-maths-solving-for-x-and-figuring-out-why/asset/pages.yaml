    Once you have the hang of doing problems of this size, then it is time to move
    on to two-digit times two-digit problems. For me, this is where the fun begins,
    because there are usually many ways you can attack these problems. By doing the
    problem multiple ways, you can check your answer—and simultaneously revel in the
    consistency of arithmetic! I''ll illustrate all of these methods with a single
    example, 32 × 38.


    The familiar method (most closely resembling what you do on paper) is the addition
    method, which can be applied to any problem. We break up one number (usually the
    one with the smaller digit) into two parts, then multiply each part by the other
    number, and add the results together. For example,


    32 × 38 = (30 + 2) × 38 = (30 × 38) + (2 × 38) = ·


    Now how do we calculate 30 × 38? Let''s do 3 × 38, then attach the 0 at the end.
    Now 3 × 38 = 90 + 24 = 114, so 30 × 38 = 1140. Then 2 × 38 = 60 + 16 = 76, so


    32 × 38 = (30 × 38) + (2 × 38) = 1140 + 76 = 1216


    Another way to do a problem like this (typically one of the numbers ends in 7,
    8, or 9) is to use the subtraction method. Here we exploit the fact that 38 =
    40 – 2 to get


    38 × 32 = (40 × 32) - (2 × 32) = 1280 - 64 = 1216


    The challenge with the addition and subtraction methods is that they require you
    to hold on to a big number (like 1140 or 1280) while doing a separate calculation.
    That can be difficult. My usual preferred'
