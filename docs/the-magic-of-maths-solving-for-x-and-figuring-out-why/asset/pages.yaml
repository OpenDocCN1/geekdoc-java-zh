  md: '# Algebra Made Visual Through Graphs


    Mathematics took a giant step forward in the seventeenth century when the French
    mathematicians Pierre de Fermat and René Descartes independently discovered how
    algebraic equations can be visualized and conversely, how geometrical objects
    can be expressed through algebraic equations.

    Let''s start with the graph of a simple equation


    $y=2x+3$


    This equation says that for every value of the variable $x$, we double and add
    3 to obtain $y$. Here is a table listing a handful of values of $x, y$ pairs.
    We next the points, as below. When drawn on a graph, the points can be labeled
    as ordered pairs. For instance, the plotted points here would be $(-3,3)$, $(-2,-1)$,
    $(-1,1)$, and so on. When you connect the dots and extrapolate, the resulting
    object is called a graph. Below, we show the graph of the equation $y=2x+3$.


    ![](img/3f33497047d2980a16cc0a7e85f4c95f_51_0.png)


    The graph of the equation $y=2x+3$


    Here is some useful terminology. The horizontal line in our picture is called
    the $x$-axis; the vertical line is the $y$-axis. The graph in this example is
    a line with slope 2 and $y$-intercept 3. The slope measures the steepness of the
    line. With a slope of 2, this says that as $x$ increases by 1, then $y$ increases
    by 2 (which you can see from the table). The $y$-intercept is simply the value
    of $y$ when $x=0$. Geometrically, this is where the'
  merge: -1
  pgno: 51
- img_proc: true
  md: '# The Magic of Math


    line intersects the $y$-axis. In general, the graph of the equation


    $y = mx + b$


    is a line with slope $m$ and $y$-intercept $b$ (and vice versa). We usually identify
    a line with its equation. So we could simply say that the graph in the figure
    above is the line $y = 2x + 3$.


    Here''s a graph of the lines $y = 2x - 2$ and $y = -x + 7$.


    ![](img/3f33497047d2980a16cc0a7e85f4c95f_52_0.png)


    Where do the graphs of $y = 2x - 2$ and $y = -x + 7$ intersect?


    The line $y = 2x - 2$ has slope 2 and $y$-intercept $-2$. (The graph is parallel
    to $y = 2x + 3$, where the entire line has been shifted vertically down by 5.)
    The graph $y = -x + 7$ has slope $-1$, as $x$ increases by 1, $y$ decreases by
    1. Let''s use algebra to determine the point $(x, y)$ where the lines cross. At
    the point where they, they have the same $x$ and $y$ value, so we want to find
    a value of $x$ where the $y$-values are the same. In other words, we need to solve


    $2x - 2 = -x + 7$


    Adding $x$ to both sides and adding 2 to both sides tells us that


    $3x = 9$


    so $x = 3$. Once we know $x$, we can use either to give us $y$. Since $y = 2x
    - 2$, then $y = 2(3) - 2 = 4$. (Or $y = -x + 7$ gives us $y = -3 + 7 = 4$.) Hence
    the lines cross at the point $(3,4)$.'
