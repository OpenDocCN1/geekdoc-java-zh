- img_proc: true
  md: "# 228 The Magic of Math\n\nYou can see from the pictures of the reasons some\
    \ mathematicians prefer $\tau$ over $\\pi$. For a $90^\\circ$ angle, which is\
    \ one-quarter of the circle, the radian measure is $\tau/4$. For $120^\\circ$,\
    \ which is one-third of the circle, the measure is $\tau/3$. Indeed, the letter\
    \ $\tau$ was chosen since it suggested the word turn. For instance, $360^\\circ$\
    \ is one turn of the circle and has radian measure $\tau/6$ is one-sixth of a\
    \ turn and has radian measure $\tau/6$.\n\nAs we'll see later in this book, the\
    \ formulas for computing trigonometric functions are much cleaner when using radians\
    \ instead of degrees. For example, we can compute sines and cosines as “infinitely\
    \ long polynomials” with the formulas\n\n```\n$sin x = x - x^3/3! + x^5/5! - x^7/7!\
    \ + x^9/9! - \\dots$\n```\n\n```\n$cos x = 1 - x^2/2! + x^4/4! - x^6/6! + x^8/8!\
    \ - \\dots$\n```\n\nbut this formula only work when $x$ is expressed in radians.\
    \ Likewise, in calculus, we will see that the derivative of $sin x$ is $cosx$,\
    \ but that is only true when $x$ is in radians. The *graphs* of trigonometric\
    \ functions $y = sin x$ and $y = cos x$ are often given when $x$ is measured in\
    \ radians.\n\n![](img/3f33497047d2980a16cc0a7e85f4c95f_238_0.png)\n\nThe graphs\
    \ of $sin x$ and $cos x$, where the $x$ variable is measured in radians"
