  md: 'I think the exclamation point is the appropriate notation since the number
    n! grows very quickly, and as we''ll see, it has many exciting and surprising
    applications. For convenience, mathematicians define 0! = 1, and n! is not defined
    when n is a negative number.


    # Aside


    From its definition, many people expect that 0! should be equal to 0. But let
    me try to convince you that 0! = 1 makes sense. Notice that for n ≥ 2, n! = n
    × (n - 1), and so


    ```

    $$(n - 1)! = \frac{n!}{n}$$

    ```


    If we want that statement to remain true when n = 1, this would require that


    ```

    $$0! = \frac{1}{1} = 1$$

    ```


    As seen below, factorials grow surprisingly quickly:


    +   0! = 1

    1! = 1

    2! = 2

    3! = 6

    4! = 24

    5! = 120

    6! = 720

    7! = 5040

    8! = 40,320

    9! = 362,880

    10! = 3,628,800

    11! = 39,916,800

    12! = 479,001,600

    13! = 6,227,020,800

    20! = 2.43 × 10^{18}

    52! = 8.07 × 10^{67}

    100! = 9.33 × 10^{157}


    How big are these numbers? It''s been estimated that there are about 10^{22} grains
    of sand in the world and about 10^{80} atoms in the universe.'
