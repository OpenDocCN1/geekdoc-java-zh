    But before we delve into the method, it''s worth reviewing some of the scientific
    and historical background behind the calendar. Since the Earth takes about 365.25
    days to travel around the Sun, a typical year has 365 days, but we add a leap
    day, February 29, every four years. (This way, in four years, we have $4 \times
    365 + 1 = 1461$ days, which is just about right.) This was the idea behind the
    Julian calendar, established by Julius Caesar more than two thousand years ago.
    For example, the year 2000 is a leap year, as is every year after that: 2004,
    2008, 2012, 2016, and so on, through 2096. Yet 2100 will not be a leap year. Why
    is that?


    The problem is that a year is actually 365.24 days (about eleven minutes less
    than 365.25), so leap years are so overrepresented. With four hundred trips around
    the Sun, we experience 146,097 days, but the Julian calendar allocated $400 \times
    365.25 = 146,100$ days for this (which is three days too long). To avoid this
    difficulty associated with the timing of (Easter) the Gregorian calendar was established
    by Pope Gregory XIII in 1582. In that, the Catholic nations removed days from
    their calendar. For example, in Spain, the Julian date of Thursday, October 4,
    1582, was followed by the Gregorian date of Friday, October 15, 1582. Under the
    Gregorian calendar, years that were divisible by 100 would no longer be leap years,
    unless they were also divisible by 400 (removing three days). Consequently, 1600
    remained a leap year on the Gregorian calendar, but 1700, 1800, and 1900 were
    not leap years. Likewise, 2000 and 2400 are leap years, but under this system,
    in any four hundred year period, the number of days years is $(400 \times 365)
    + 97 = 146,097$ as desired.


    The Gregorian calendar was not accepted by all countries right away, and the non-Catholic
    countries were particularly slow to adopt it. For example, England and its colonies
    did not make the switch until September 2, 1752.(Notice that eleven days were
    eliminated, 1700 was a leap year on the Julian calendar but not in the Gregorian
    calendar.) It was not until the 1920s that all countries had converted from the
    Julian to the Gregorian calendar. This has been a source of complications for
    historians. My favorite paradox is that both William Shakespeare and Miguel de
