    ```


    Notice that the geometric series also works for negative numbers between zero
    and $-1$. For instance, when $x = -1/2$, it says


    ```

    $$-\frac{1}{2}+\frac{1}{4}-\frac{1}{8}+\frac{1}{16}-\dots = \frac{-1}{1-(-1/2)}$$

    ```


    A series that alternates between positive and negative numbers that are getting
    closer and to zero is called an *alternating series*. Alternating series always
    converge to some number. To illustrate with the alternating series, draw a line
    and put your finger on the number 0. Then move it to the right by 1, then go to
    the left by $1/2$, then go to the right by $1/4$. (At this point, your finger
    will be on the point $3/4$). Then go to the left by $1/8$ (so that your finger
    is now on the point $5/8$), and so on. Your finger will be homing in on a single
    number,

    this case 2/3.


    Now consider the alternating series


    ```

    $$-\frac{1}{2}+\frac{1}{3}-\frac{1}{4}+\frac{1}{5}-\frac{1}{6}+\dots$$

    ```


    After four terms, we know that the infinite sum is at least $1-1/2+1/3-1/4=7/12=0.583\dots$,
    and after five terms, we know that it is at most $1-1/2+1/3-1/4+1/5=47/60=0.783\dots$.
    The eventual infinite sum is a little than halfway between these two numbers,
    $0.69347\dots$. Using calculus, we can find the real value of this number:


    As a warm-up exercise, take the geometric series:


    ```

    $$1+x+x^2+x^3+x^4+\dots = \frac{1}{1-x}$$

    ```


    and let''s see what happens when we differentiate both sides. Recall from Chapter
    11 that the derivatives of $1, x, x^2, x^3, x^4$, and so on, respectively $0,
    1, 2x, 3x^2, 4x^3$, and so on. If we assume that the derivative of an infinite
    sum is the (infinite) sum of the derivatives, and use the chain rule to differentiate
    $(1-x)^{-1}$, then we get for $-1 < x < 1$,


    ```

    $$1+2x+3x^2+4x^3+5x^4+\dots = \frac{1}{(1-x)^2}$$

    ```'
