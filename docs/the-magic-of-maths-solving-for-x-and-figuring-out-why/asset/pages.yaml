    # Some surprising appearances of $\pi$


    It''s no surprise to see $\pi$ show up in areas and circumferences of circular
    objects like the ones we have seen. But $\pi$ shows up in many parts of mathematics
    where it doesn''t seem to belong. Take, for example, the quantity $n!$, which
    we explored in Chapter 4. There is nothing particularly circular about this number.
    It is largely used for counting discrete quantities. We know it''s a number that
    grows extremely fast, and yet there is no efficient shortcut for computing $n!$.
    For instance, computing 100,000! still requires many thousands of multiplications.
    And yet there is a useful way to estimate $n!$ using Stirling''s approximation,
    says that


    $n! \approx (\frac{n}{e})^n \sqrt{2\pi n}$'
