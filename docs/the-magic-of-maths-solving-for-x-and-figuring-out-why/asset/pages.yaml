    # Geometry Classics


    The subject of geometry goes back to the ancient Greeks. The name geometry comes
    from the Greek words for “earth” (geo) and “measurement” (metria), and indeed
    geometry’s original uses were for the study of earthly measurements in surveying
    and construction, and for heavenly applications as astronomy. But the ancient
    Greeks were masters of deductive reasoning and developed the subject into the
    art form that it is. All of the results of geometry that were known at the time
    (around 300 BC) were compiled by Euclid into *The Elements*, which became one
    of the most successful textbooks of all time. This book introduced the ideas of
    mathematical rigor, logical deduction, the axiomatic method, and proofs, which
    are still utilized by mathematicians.


    Euclid began with five axioms (also known as postulates), which are statements
    that we are supposed to accept as common sense. And once you accept these axioms,
    then you can, in principle, derive all geometric truths from them. Here are Euclid’s
    five axioms (Actually, he stated the fifth axiom a little differently, but our
    axiom is equivalent to it)


    +   **Axiom 1.** Given any two points, we can connect them with a unique line
    segment.

    **Axiom 2.** Line segments can be extended indefinitely in both directions to
    create lines.

    **Axiom 3.** Given any points $O$ and $P$, we can draw a unique circle, centered
    at $O$, where $P$ is on the circle.

    **Axiom 4.** All right angles measure 90 degrees.

    **Axiom 5.** Given a line $\ell$ and a point $P$ not on the line, there exists
    exactly one line through $P$ that is parallel to $\ell$.'
