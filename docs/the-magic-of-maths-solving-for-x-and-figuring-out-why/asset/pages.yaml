    Because there are so many marvelous mathematical properties satisfied by the golden
    ratio, there is sometimes a tendency to see it in places where it doesn''t exist.
    For example, in the book The Da Vinci Code, author Dan Brown asserts that the
    number 1.618 appears every-where, and that the human body is practically a testament
    to that number. For instance, it is claimed that the ratio of a person’s height
    to the height of his or her bellybutton is always 1.618. Now, I personally have
    not conducted this experiment, but according to the College Mathematics Journal
    article “Misconceptions About the Golden Ratio,” by George Markowski, this is
    simply not true. But to some people, anytime a number appears to be close to 1.6,
    they assume it must be the golden ratio at work.'
