    # Trigonometry and Circles


    So far, we have defined trigonometric functions in terms of a right triangle,
    and I strongly encourage you to be comfortable with that definition. However,
    this definition has the shortcoming that it allows us to find the sine, cosine,
    and tangent only when the angle is strictly between $0^\circ$ and $90^\circ$ (since
    a right triangle always contains a $90^\circ$ angle and two acute angles). In
    this section, we define the trigonometric functions in terms of the unit circle,
    which will allow us to find sines, cosines, and tangents for any angle whatsoever.


    Recall the unit circle is a circle of radius 1, centered at the origin $(0,0)$.
    It has $x^2 + y^2 = 1$, which we derived in the last chapter using the Pythagorean
    theorem. Suppose I asked you to determine the point $(x,y)$ on the unit circle
    that corresponds to acute angle $A$, measured in the counterclockwise direction
    from the point $(1,0)$, as shown in the next figure.'
