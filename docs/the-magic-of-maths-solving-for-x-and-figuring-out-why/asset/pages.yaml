  md: '# The Magic of i and e 241


    Does your answer begin 2.718? In fact, it wouldn''t surprise me if your answer
    began with several digits of the irrational number


    ```

    $e = 2.718281828459045\dots$

    ```


    So what is this mysterious number e, and why is it so important? In the magic
    trick you just performed, you calculated


    ```

    $(1+1/n)^n$

    ```


    for large number $n$. Now, what would you expect to happen to this number as $n$
    gets larger and larger? On the "one", hand, as $n$ gets larger, the number $(1+1/n)$
    gets closer and closer to the number 1, and when we raise 1 to any power, we still
    get 1. Thus it would be reasonable to expect that for very large values of $n$,
    $(1+1/n)^n$ would be approximately 1. For example, $(1.001)^{100} \approx 1.105.


    On the other hand, even when $n$ is large, $(1+1/n)$ is slightly larger than 1.
    And if you raise any fixed number that is bigger than 1 to larger and larger powers,
    then that quantity gets arbitrarily large. $(1.001)^{10,000}$ is over 20,000.


    The problem is that the base $(1+1/n)$ is getting small while the exponent $n$
    is getting large simultaneously. And in this tug-of-war between 1 and infinity,
    the answer gets closer and closer to $e=2.71828\dots$ For example, $(1.001)^{1000}
    \approx 2.717$. Let''s look at the function $(1+1/n)^n$ for large values of $n$,
    as shown in the following table.


    | $n$ | $(1+1/n)^n$ |

    |---|---|

    | 10 | $(1.1)^{10} = 2.593724\dots$ |

    | 100 | $(1.01)^{100} = 2.704813\dots$ |

    | 1000 | $(1.001)^{1000} = 2.716929\dots$ |

    | 10,000 | $(1.001)^{10,000} = 2.718459\dots$ |

    | 100,000 | $(1.00001)^{100,000} = 2.718268\dots$ |

    | 1,000,000 | $(1.000001)^{1,000,000} = 2.718280\dots$ |

    | 10,000,000 | $(1.0000001)^{10,000,000} = 2.718281\dots$ |


    We define $e$ to be the number that $(1+1/n)^n$ is getting closer and closer as
    $n$ gets larger and larger. Mathematicians call this the limit of $(1+1/n)^n$
    as $n$ goes to infinity, denoted


    ```

    $e = \lim_{n\to\infty} (1+1/n)^n$

    ```'
