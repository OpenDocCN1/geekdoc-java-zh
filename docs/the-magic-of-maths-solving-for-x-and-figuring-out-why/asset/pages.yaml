    Method 3 (law of signs): Before attempting method 1 or 2, look for a posted sign
    that tells you the height of the mountain. This has the advantage that you don''t
    need to surrender any of your equipment. 😊


    Of course, if none of these three methods appeal to you, then must resort to more
    mathematical solutions, which are the subject of this chapter.


    # Trigonometry and Triangles


    The word "trigonometry" has Greek roots *trigon* and *metria*, which literally
    means triangle measurement. We begin with the analysis of some classic triangles.


    *In an isosceles right triangle*, there is a 90° angle, and the two other angles
    must be equal. The other angles are then 45° (since the sum of the angles is 180°),
    so we refer to such a triangle as a 45-45-90 triangle. If both legs have length
    1, then by the Pythagorean theorem, the hypotenuse must have length $\sqrt{1^2+1^2}
    = \sqrt{2}$. Note that all isosceles right triangles will have the same proportions
    of 1 : 1 : $\sqrt{2}$, as pictured below.


    ![](img/3f33497047d2980a16cc0a7e85f4c95f_214_0.png)


    In a 45-45-90 triangle, the side lengths are proportional to 1 : 1 : $\sqrt{2}$'
