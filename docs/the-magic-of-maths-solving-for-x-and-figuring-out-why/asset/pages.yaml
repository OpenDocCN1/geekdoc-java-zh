    # $1 + 2 + 3 + 4 + \dots + 100 = 5050$


    # The Magic of Numbers


    # Number Patterns


    The study of mathematics begins with numbers. In school, after we learn how to
    count and represent numbers using words or digits or physical objects, we spend
    many years manipulating numbers through addition, subtraction, multiplication,
    division, and other arithmetical procedures. And yet, we often don''t get to see
    that numbers possess a magic of their own, capable of entertaining us, if we just
    look below the surface.


    Let''s start with a problem given to a mathematician Karl Friedrich Gauss when
    he was just a boy. Gauss''s teacher asked him and his classmates to add up all
    the numbers from 1 to 100, a tedious task designed to keep the students busy while
    the teacher did other work. Gauss astonished his teacher and classmates by immediately
    writing down the answer: 5050. How did he do it? Gauss imagined the numbers 1
    through 100 split into two rows, with the numbers 1 through 50 on the top and
    the numbers 51 through 100 written backward on the'
  merge: -1
