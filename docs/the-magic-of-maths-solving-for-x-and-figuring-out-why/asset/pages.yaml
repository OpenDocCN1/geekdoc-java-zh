  md: '# The Magic of the Math


    Here is a magical application of FOIL. Roll two dice and follow the instructions
    in the table below. As an example, let''s suppose when you roll the dice, the
    first die has 6 on top and the second die has 3 on top. Their bottom numbers are
    1 and 4, respectively.


    | Roll two dice (say we get 6 and 3) |

    |---|---||

    | Multiply top numbers: | $6 \times 3$ | = $18$ |

    | Multiply bottom numbers: | $1 \times 4$ | = $4$ |

    | Multiply first top by second bottom number: | $6 \times 4$ | = $24$ |

    | Multiply first bottom by second top number: | $1 \times 3$ | = $3$ |

    | Total: | 49 |


    In our example, we arrived at a total of 49. And if you try it yourself with any
    normal six-sided dice you will arrive at the same total. Based on the fact that
    every normal six-sided dice, the opposite sides add to 7. So if the dice show
    $x$ and $y$ on top, then they must have $7 - x$ and $7 - y$ on the bottom. So
    using algebra, our table looks like


    | Roll 2 dice ($x$ and $y$): |

    |---|---|---||

    | Multiply top numbers: | $xy$ | = $xy$ |

    | Multiply bottom numbers: | $(7-x)(7-y)$ | = $49-7y-7x+xy$ |

    | First top times second bottom: | $x(7-y)$ | = $7x-xy$ |

    | First bottom times second top: | $(7-x)y$ | = $7y-xy$ |

    | Total: | | $49$ |


    Notice how we use FOIL in the third row (and $-x$ times $-y$ is positive xy).
    We could also add 49 using algebra by looking at the second column of table and
    noticing these are precisely the four terms we would get by FOILing $(x+(7-x))(y+(7-y))
