    There is one sum that adds to 1, two sums that add to 2 (1 + 1 and 2), and 3 sums
    that add to 3 (1 + 1 + 1, 1 + 2, 2). Note that we are only allowed to use the
    numbers 1 and 2 in our sums. Also, the order of the numbers added matters. So,
    for example, 1 + 2 is different from 2 + 1. There are 5 sums that add to 4 (1
    + 1 + 1 + 1, 1 + 1 + 2, 2 + 1 + 1, 2 + 2). The numbers in our table seem to suggest
    that the numbers will be Fibonacci numbers, and indeed that is the case.


    Let''s see why there are $f_5=8$ sums that add to the number 5. Such a sum must
    begin with a 1 or 2. How many of them begin with 1? Well, after the 1, we must
    have a sequence of 1s and 2s that sum to 4, and we know there are $f_4=5$ of them.
    Likewise, how many of the sums that add to 5 begin with the number 2? After the
    initial 2, the remaining terms must add to 3, and there are $f_3=3$ of those.
    Hence the total number of sequences that add to 5 is $5+3=8$. By the same logic,
    number of sequences that add to 6 is 13, since $f_5=8$ begin with 1 and $f_4=5$
    begin with 2. In general, there are $f_n$ sequences that add to $n$. Of these,
    $f_{n-1}$ begin with 1 and $f_{n-2}$ begin with 2. Consequent,


    ```

    $f_n = f_{n-1} + f_{n-2}$

    ```


