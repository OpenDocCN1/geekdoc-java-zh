    more about in Chapter 12.)


    Note with polynomials, the exponents of the variables can only be positive integers,
    so exponents may not be negative or fractional. For instance, if our equation
    includes something like $y = 1/x$ or $y = \sqrt{x}$, then it is not a polynomial
    since, as we''ll see, $y = x^{-1}$ and $y = x^{1/2}$.


    We define the roots of the polynomial to be the values of $x$ for which the polynomial
    equals 0. For example, $3x+7$ has one root, namely $x = -7/3$. The roots of $x^2
