  md: '# The Magic of Infinity


    sum, since the commutative law of addition says that


    $A+B=B+A$


    for any numbers A and B. And yet, look what happens when we rearrange the sum
    in the following way:


    $1-\frac{1}{2}-\frac{1}{4}+\frac{1}{3}-\frac{1}{6}-\frac{1}{5}-\frac{1}{10}-\frac{1}{12}+\dots$


    Note that these are the same numbers being summed, since every fraction with an
    odd denominator is being added and every fraction with an even denominator is
    subtracted. Even though the even numbers are used up twice as fast as the odd
    numbers, both have an inexhaustible supply, and every fraction from the original
    sum appears exactly once in the new sum. But notice that this equals


    $$(1-\frac{1}{2})-\frac{1}{4}+(\frac{1}{3}-\frac{1}{6})-(\frac{1}{5}-\frac{1}{10})+(\frac{1}{12}-\dots)\dots$$


    $$(1-\frac{1}{2})-\frac{1}{4}+(\frac{1}{3}-\frac{1}{6})-(\frac{1}{5}-\frac{1}{10})+-\frac{1}{12}
    \dots$$


    $$(1-\frac{1}{2})-\frac{1}{4}+(\frac{1}{3}-\frac{1}{6})-(\frac{1}{5}-\frac{1}{10})+\frac{1}{6}\dots$$


    which is one-half of the original sum! How can this be? Is it possible that when
    we rearrange a collection of numbers, we get a completely different number? The
    surprising answer is that the commutative law of addition can actually fail when
    you are adding an infinite number of numbers.


    This problem arises in a convergent series whenever both the positive terms and
    the negative terms form divergent series. In other words, the positive terms add
    to $\infty$ and the negative terms add to $-\infty$. Such was the case with our
    last example. These sequences are conditionally convergent series, and amazingly,
    they can be rearranged to obtain any total you desire. How would we rearrange
    the last sum to get 42? You would add enough positive terms until the sum exceeds
    42, then subtract your first negative term. Then add more positive terms until
    it exceeds 42 again. Then subtract your second negative term. Repeating this process,
    your sum will eventually get closer and closer to 42. (For instance, after subtracting
    your fifth negative term, $-1/10$, you will always be within 0.1 of 42. After
    subtracting the fiftieth negative term, $-1/100$, you will always be within 0.01
    of 42, and so on.)'
