    \ The slope of the secant line would then be\n\n> $\frac{y_2-y_1}{x_2-x_1} = \\\
    frac{(2+2h+h^2)-2}{(1+h)-1} = 2+h$\n\nNow as $h$ gets closer and closer to 0,\
    \ the secant slope gets closer and closer to 2. Formally, we have\n\n> $\\lim_{h\\\
