  md: '# CHAPTER EIGHT


    # 3.141592653589...


    # The Magic of π


    Circular Reasoning


    We began the last chapter with some problems designed to challenge your geometric
    intuition pertaining to rectangles and triangles, ending with a problem that involved
    a rope connecting two goalposts at the opposite ends of a football field. In this
    chapter our focus will be on circles, and we will begin with a problem that starts
    by putting a rope around the Earth!


    **Question 1.** Imagine that a rope is to be tied around the Earth''s equator
    (approximately 25,000 miles long). Before tying the ends together, an extra 10
    feet of rope is added. If we now lift the rope so that it hovers over each point
