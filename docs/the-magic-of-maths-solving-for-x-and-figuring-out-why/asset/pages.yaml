  md: 'Let’s end with a magical connection between trigonometry and $\pi$. On a calculator,
    type as many 5s as you can. My calculator allows $5,555,555,555,555,555$. Now
    take the reciprocal of this number. On my calculator, I get


    ```

    $1/5,555,555,555,555,555 = 1.8 \times 10^{-16}$

    ```


    Next press the sign button on your calculator (in degree mode) and look at the
    leading digits (ignoring any initial strings of zeros that may appear). The answer
    on my display is


    ```

    $3.1415926535898 \times 10^{-18}$

    ```


    which (after a decimal point, followed by seventeen 0s) are the digits of $\pi$
    to several places! In fact, you should get a similar pi-culiar result if you start
    with any number of 5s — as long as you have at least five of them.


    In this chapter, we have seen how trigonometry helps us better understand triangles
    and circles. Trigonometric functions interact with each other in many beautiful
    ways, and we have seen how they are intimately connected with the number $\pi$.
    In the next chapter, we will see that they are also intertwined with two other
    fundamental numbers, the irrational number $e = 2.71828 \dots$ and the imaginary
    number $i$.'
