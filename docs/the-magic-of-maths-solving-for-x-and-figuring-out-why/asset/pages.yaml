  md: '# The Magic of Calculus 261


    The tangent slope is also equal to $m$ regardless of the value of $x$ involved,
    so $f''(x) = m$. This makes sense because the line $y = mx + b$ always has a slope
    of $m$.


    Let''s find the derivative $y = x^2$ using the definition. Here we have


    ```

    $f(x+h) - f(x) = \frac{(x+h)^2 - x^2}{h} = \frac{(x^2 + 2xh + h^2) - x^2}{h} =
    \frac{2xh + h^2}{2x + h}$

    ```


    and $h$ goes to $0$, we get $f''(x) = 2x$. For $f(x) = x^3$, we have


    ```

    $f(x+h) - f(x) = \frac{(x+h)^3 - x^3}{h} = \frac{(x^3 + 3x^2h + 3xh^2 + h^3) -
    x^3}{h} = \frac{3x^2h + 3xh^2 + h^2}{h} = 3x^2 + 3xh + h^2$

    ```


    and $h$ goes to $0$, we get $f''(x) = 3x^2$.


    Given the function $y = f(x)$, the process of determining the derivative $f''(x)$
    is called differentiation. The good news is that once we have found the derivatives
    of a few simple functions, we can determine the derivatives of more complicated
    functions with very little difficulty and without needing to use the formal limit-based
    definition given above. The following theorem is very useful.


    **Theorem:** If $u(x) = f(x) + g(x)$, then $u''(x) = f''(x) + g''(x)$. In other
    words, the derivative of the sum is the sum of the derivatives. Also, if $c$ is
    any real number, the derivative of $cf(x)$ is $cf''(x)$.


    As a consequence of this theorem, since $y = x^3$ has derivative $3x^2$ and $y
    = x^2$ has derivative $2x$, then $y = x^3 + x^2$ has derivative $3x^2 + 2x$. To
    illustrate the second statement, the function $y = 10x^3$ has derivative $30x^2$.'
