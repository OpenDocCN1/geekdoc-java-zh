  md: '# The Magic of i and e 245


    In other words, the log of the product is the sum of the logs.


    **Proof:** This comes immediately from the law of exponents, since


    ```

    $10^{\log x + \log y} = 10^{\log x} 10^{\log y} = xy = 10^{\log xy}$

    ```


    Thus, raising 10 to the log x + log y power gives us $xy$, as desired.


    Another useful property is the **exponent rule**.

    **Theorem:** For any positive number $x$ and any integer $n$,


    ```

    $\log x^n = n \log x$

    ```


    **Proof:** By the law of exponents, $a^{bc} = (a^b)^c$. Therefore,


    ```

    $10^{n \log x} = (10^{\log x})^n = x^n$

    ```


    Hence the logarithm of $x$ equals n base 10 logarithmic,


    There is nothing particularly special about the base 10 logarithmic, although
    it is widely used in chemistry and physical sciences like geology. But in computer
    science and discrete mathematics, the base 2 logarithm is more popular. For any
    $b > 0$, the base $b$ logarithm $\log_b$ is defined by the rule


    ```

    $y = \log_b x$ if $b^y = x$

    ```


    For example, $\log_2 32 = 5$ because $2^5 = 32$. All of the previous properties
    hold for any base $b$. For example,


    ```

    $\log_b x = x \quad \log_b xy = \log_b x + \log_b y \quad \log_b x^n = n \log_b
    x$

    ```


    However, in most areas of mathematics, physics, and engineering, the most useful
    logarithm is with base $b = e$. This is called the natural logarithm and is denoted
    by $\ln x$. That is,


    ```

    $y = \ln x$ if $e^y = x$

    ```


    Or equivalently, for any real number $x$,


    ```

    $\ln e^x = x$

    ```


    For example, your calculator can determine $\ln 5 = 1.609\dots$, which is how
    we determined earlier that $e^{1.609} \approx 5$. We will have to say more about
    the natural logarithm function in Chapter 11.'
