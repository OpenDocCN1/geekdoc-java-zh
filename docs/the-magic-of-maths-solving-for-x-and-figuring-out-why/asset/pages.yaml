  md: '# # Radians and Trigonometric Graphs


    So far in our discussion of geometry and trigonometry, we have assigned a measure
    that ranges from 0 to 360 degrees. But if you look at the unit circle, there is
    nothing particularly natural about the number 360. This number was chosen by the
    ancient Babylonians, probably since they used a base 60 number system and is approximately
    the number of days in a year. Instead, for most areas of science and mathematics,
    it is preferable to measure angles using radians.


    $2\pi \text{ radians} = 360^\circ$


    Or equivalently,


    $1 \text{ radian} = \frac{180^\circ}{\pi}$


    Or for the tauists out there who like $\tau = 2\pi$,


    $1 \text{ radian} = \frac{360^\circ}{2\pi} = \frac{360^\circ}{\tau}$


    Numerically, 1 radian is approximately $57^\circ$. Why are radians more natural
    than degrees? On a circle of radius $r$, an angle of $2\pi$ radians captures the
    circle''s circumference of $2\pi r$. If we take any fraction of that angle, then
    the amount of arc that we capture is $2\pi r$ times that fraction. Specifically,
    1 radian captures an arc of length $2\pi r(1/2\pi) = r$. In summary, on the unit
    circle, the angle in radians is equal to its corresponding arc length.


    ![](img/3f33497047d2980a16cc0a7e85f4c95f_236_0.png)


    A circle has $2\pi$ radians'
  merge: -1
  pgno: 236
