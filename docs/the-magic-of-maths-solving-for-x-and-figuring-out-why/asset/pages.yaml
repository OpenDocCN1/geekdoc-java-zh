  md: '# The Magic of Math


    This book covers the essential mathematical subjects like numbers, algebra, trigonometry,
    and calculus, but it also covers topics that are not so well represented, like
    Pascal''s triangle, infinity, and magical properties of numbers like 9, π, e,
    i, Fibonacci numbers, and the golden ratio. And although none of the big mathematical
    subjects can be completely covered in just a few dozen pages, I hope you come
    with an understanding of the main concepts, a better idea of why they work, and
    an appreciation of the elegance and relevance of each subject. Even if you have
    seen some of these topics before, I hope you will see and enjoy them with new
    perspectives. And as we learn more mathematics, the magic becomes more sophisticated
    and fascinating. For example, here is one of my favorite equations:


    ```

    e^π + 1 = 0

    ```


    Some refer to this "God''s equation," because it uses the most important numbers
    in mathematics in one magical equation. Specifically, it uses 0 and 1, which are
    the foundations of arithmetic; π = 3.14159..., which is the most important number
    in geometry; e = 2.71828..., which is the most important number in calculus; and
    the imaginary number i, with a square of -1. We''ll say maybe more about π in
    Chapter 8, and the numbers i and e are described in greater detail in Chapter
    10. In Chapter 11, we''ll see the mathematics that help us understand this magical
    equation.


    My target audience for this book is anyone who will need to take a math course,
    is currently taking a math course, or is finished taking courses. In other words,
    I want this book to be enjoyed by everyone, from math-phobics to math-lovers.
    In order to do this, I will establish some rules:


    +   Rule 1: You can skip the gray boxes (except this one!) Each chapter is filled
    with "Asides," where I will go off on a tangent about talking something interesting.
    It might be an extra example or a proof, or something that will appeal to the
    more advanced readers. You might want to skip these the first time you read this
    book (maybe the second and third times too). And I do hope that you reread this
    book. Mathematics is a subject that is worth revisiting.


    +   Rule 2: Don''t be afraid to skip paragraphs, sections, or even chapters. In
    addition to skipping the gray boxes, feel free to go anytime anytime get stuck.
    Sometimes you need perspective on a topic before it fully sinks in. You will be
    surprised by how much easier a topic can'
