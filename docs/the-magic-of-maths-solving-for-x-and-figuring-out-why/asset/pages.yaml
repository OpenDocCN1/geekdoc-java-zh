  md: '# 234 The Magic of Math


    For multiplication we use the FOIL rule from algebra in Chapter 2:


    ```

    $(3+4i)(2+5i) = 6+15i+8i+20i^2

    = (6-20)+(15+8)i

    = -14+23i$

    ```


    With complex numbers, every quadratic polynomial $ax^2+bx+c$ has two roots (or
    one repeated root). From the quadratic formula, the polynomial will equal 0 whenever


    ```

    $x = \frac{-b\pm\sqrt{b^2-4ac}}{2a}$

    ```


    In Chapter 2, we said there no real solutions if the number under the square root
    was negative, but now negative square roots don''t bother us. For example, the
    equation $x^2+2x+5$ has roots


    ```

    $x = \frac{-2\pm\sqrt{4-20}}{2} = \frac{-2\pm\sqrt{-16}}{2} = \frac{-2\pm4i}{2}
    = -1\pm2i$

    ```


    By the way, the quadratic formula still works when $a, b,$ or $c$ is complex.


    Quadratic polynomials always have at least one root, although it may be complex.
    The next theorem says this is true for almost all polynomials.


    **Theorem (Fundamental theorem of algebra):** Every polynomial $p(x)$ of degree
    1 or higher has a root $z$ where $p(z)=0$.


    Notice that a first-degree polynomial like $3x-6$ can be factored as $3(x-2)$,
    where 2 is the only root of $3x-6$. In general, if $a\neq 0$, the polynomial $ax-b$
    can be factored as $a(x-b/a)$ where $b/a$ is the root of $ax-b$.


    Similarly, for every second-degree polynomial $ax^2+bx+c$, we can factor it as
    $a(x-z_1)(x-z_2)$ where $z_1$ and $z_2$ are (possibly complex, possibly the same)
    roots of the polynomial. As a consequence of the fundamental theorem of algebra,
    this pattern extends to polynomials of any degree.


    **Corollary:** Every polynomial of degree $n\ge1$ can be factored into $n$ parts.
    More specifically, if $p(x)$ is an $nth$-degree polynomial with leading term $a\neq
    0$, then there exist $n$ numbers (possibly complex, possibly the same) $z_1, z_2,
    \dots, z_n$ such that $p(x)=a(x-z_1)(x-z_2)\cdots(x-z_n)$.


    The numbers $z_i$ are the roots of the polynomial where $p(z_i)=0$.'
  merge: -1
  pgno: 244
- img_proc: true
  md: 'This corollary means that every polynomial of degree $n \ge 1$ has at least
    one, and at most $n$, distinct roots. For example, the polynomial $x^4 - 16$ has
    degree 4 and can be factored as


    ```

    $x^4 - 16 = (x^2 - 4)(x^2 + 4) = (x-2)(x+2)(x-2i)(x+2i)$

    ```


    and has distinct roots $2, -2, 2i, -2i$. The polynomial $3x^3 + 9x^2 - 12$ has
    degree 3, but since it factors as


    ```

    $3x^3 + 9x^2 - 12 = 3(x^2 + 4x + 4)(x-1) = 3(x+2)^2(x-1)$

    ```


    it has only two distinct roots


    # The Geometry of Complex Numbers


    The complex numbers can be visualized by drawing the *complex plane*. It looks
    just like the $(x,y)$ plane from algebra, but the $y$-axis has been replaced with
    the *imaginary axis* with numbers $0, \pm i, \pm 2i$, and so on. We have plotted
    some complex numbers in the figure below.


    ![](img/3f33497047d2980a16cc0a7e85f4c95f_245_0.png)


    Some points in the complex plane


    We have seen how easy it is to add, subtract, and multiply complex numbers numerically.
    But we can also perform these operations metrically, just by looking at their
    points on the complex plane.'
