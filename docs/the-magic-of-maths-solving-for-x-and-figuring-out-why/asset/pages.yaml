  md: '# Aside


    The answer to question 2 from the beginning of the chapter is revealed by the
    central angle theorem. Let X and Y be any two points on the circle. The major
    arc is the longer of the two arcs connecting X and Y. The shorter arc is the minor
    arc. The central angle theorem says that the angle ∠XPY will be the same for every
    point P on the major arc between X and Y. Specifically, angle ∠XPY will be half
    of the central angle ∠XOY. If Q is on the minor arc from X to Y, then ∠XQY =180°
    - ∠XPY.


