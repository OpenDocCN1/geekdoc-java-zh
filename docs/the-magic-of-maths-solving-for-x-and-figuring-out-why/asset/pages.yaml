  md: '# Aside


    In Chapter 5, we discovered several relationships with Fibonacci numbers. Let''s
    see how to prove some of those identities using induction.

    **Theorem:** For $n \ge 1$,


    ```

    $F_1 + F_2 + \dots + F_n = F_{n+2} - 1$

    ```


    **Proof (by induction):** When $n = 1$, this says $F_1 = F_3 - 1$, which is the
    same as $1 = 2 - 1$, which is certainly true. Now assume that theorem is true
    when $n = k$. That is,


    ```

    $F_1 + F_2 + \dots + F_k = F_{k+2} - 1$

    ```


    Now we add the next Fibonacci number $F_{k+1}$ to both sides, we get


    ```

    $F_1 + F_2 + \dots + F_k + F_{k+1} = F_{k+1} + F_{k+2} - 1\n= F_{k+3} - 1$

    ```


    as desired.


    The proof for the sum of the squares of Fibonacci numbers is equally simple.

    **Theorem:** For $n \ge 1$,


    ```

    $F_1^2 + F_2^2 + \dots + F_n^2 = F_n F_{n+1}$

    ```


    **Proof (by induction):** When $n = 1$, this says $F_1^2 = F_1 F_2$, which is
    true, since $F_2 = F_1 = 1$. Assuming the theorem when $n = k$, we have


    ```

    $F_1^2 + F_2^2 + \dots + F_k^2 = F_k F_{k+1}$

    ```


    Adding $F_{k+1}^2$ to both sides gives us


    ```

    $F_1^2 + F_2^2 + \dots + F_k^2 + F_{k+1}^2 = F_k F_{k+1} + F_{k+1}^2\n= F_{k+1}(F_k
    + F_{k+1})\n= F_{k+1}F_{k+2}$

    ```


    as desired.'
