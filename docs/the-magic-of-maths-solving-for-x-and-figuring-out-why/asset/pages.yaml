  md: '# The Magic of Calculus 257


    Just to the left of the maximum, the function is going uphill, with a positive
    slope, and just to the right, it is going downhill, with a negative slope. So,
    at the maximum point, the function is neither increasing nor decreasing; it is
    switching between the two. To put it mathematically, at this optimal point, there
    is a horizontal line (with a slope of 0). In this chapter, we will use calculus
    to find that point between 0 and 6 where the tangent line is horizontal.


    And speaking of tangents, we will be going off on many tangents throughout this
    chapter. For instance, the problem we just considered was to find the optimal
    way to cut corners, and indeed we will be cutting lots of corners in this chapter.
    Calculus is a vast subject, with typical textbooks containing more than a thousand
    pages. In a couple dozen pages, we will only have time to cover the highlights.
    In this book, we will not cover the topic of integral calculus, which computes
    areas and volumes of complicated objects; we will focus only on differential calculus,
    which measures how functions grow and change.


    The simplest functions to analyze are straight lines. In Chapter 2, we noted the
    line $y = mx + b$ has a slope of $m$. Thus if $x$ increases by 1, then $y$ increases
    by $m$. For example, the line $y = 2x + 3$ has a slope of 2. If we increase the
    value of $x$ by 1 (say from $x = 10$ to $x = 11$), then $y$ will increase by 2
    (here, from 23 to 25).


    We have drawn the graphs of various lines in the figure below. Here, $y = -x$
    has slope $-1$, and the horizontal line $y = 5$ has slope 0.


    ![](img/3f33497047d2980a16cc0a7e85f4c95f_267_0.png)'
