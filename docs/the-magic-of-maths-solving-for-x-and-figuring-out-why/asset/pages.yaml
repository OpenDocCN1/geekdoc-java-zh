  md: '# The Magic of Trigonometry


    ![](img/3f33497047d2980a16cc0a7e85f4c95f_221_0.png)


    The point $(x, y)$ on the unit circle corresponding to angle $A$ has $x = \cos
    A$ and $y = \sin A$


    We can find $x$ and $y$ by drawing a right triangle and applying our formulas
    for cosine and sine. Specifically,


    $\cos A = \frac{\text{adj}}{\text{hyp}} = \frac{x}{1} = x$


    and


    $\sin A = \frac{\text{opp}}{\text{hyp}} = \frac{y}{1} = y$


    In other words, the point $(x, y)$ is equal to $(\cos A, \sin A)$. Generally,
    if the circle has radius $r$, then $(x, y) = (r \cos A, r \sin A)$.


    For any angle $A$, we extend this idea by defining $(\cos A, \sin A)$ to be the
    point on the unit circle identified with angle $A$. (In other words, $\cos A$
    is the $x$-coordinate and $\sin A$ is the $y$-coordinate of the point on the circle
    with angle $A$.) Here''s the big picture.'
