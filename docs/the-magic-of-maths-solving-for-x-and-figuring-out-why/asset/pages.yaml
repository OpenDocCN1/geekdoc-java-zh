  md: '# 102 The Magic of Math


    Oddly, the pattern is even clearer. The sum of the first n odd-positioned Fibonacci
    numbers is simply the Fibonacci number. We can exploit the previous trick, as
    follows:


    ```

    $F_1 + F_3 + F_5 + \cdots + F_{2n-1}$

    = 1 + (F_1 + F_2) + (F_3 + F_4) + \cdots + (F_{2n-3} + F_{2n-2})$

    = 1 + (F_{2n} - 1)$

    ```


    > Aside

    We could have arrived at the answer in another way, using what we have already
    shown. If we subtract the first n even-positioned Fibonacci numbers from the first
    2n Fibonacci numbers, we''ll be left with the first n odd-positioned Fibonacci
    number:

    $F_1 + F_3 + F_5 + \cdots + F_{2n-1}$

    = $(F_1 + F_2 + \cdots + F_{2n-1}) - (F_2 + F_4 + \cdots + F_{2n-2})$

    = $(F_{2n+1} - 1) - (F_{2n-1} - 1)$n= $F_{2n}$


    # Counting on Fibonacci


    We have only scratched the surface of the beautiful number patterns satisfied
    by the Fibonacci numbers. You may be tempted to guess that these numbers must
    be something other than pairs of rabbits. Indeed, Fibonacci numbers arise as the
    solution to many counting problems. In 1150 (before Leonardo of Pisa wrote about
    rabbits), the Indian poet Hemachandra asked how many cadences of length n were
    possible if a cadence could contain short syllables of length one or long syllables
    of length two. We state the question in simple mathematical terms.


    Question: How many ways can we write the number n as a sum of 1s and 2s?


    Answer: Let''s call the answer f_n and examine f_n for some values of n.'
