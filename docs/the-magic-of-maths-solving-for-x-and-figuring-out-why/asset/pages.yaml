  md: 'method for two-digit multiplication is the factoring method, which can be applied
    whenever one of the numbers is expressed as the product of two 1-digit numbers.
    In our example, we see that 32 can be factored as $8 \times 4$. Consequently,


    $38 \times 32 = 38 \times 8 \times 4 = 304 \times 4 = 1216$


    If we factor 32 as $4 \times 8$, we get $38 \times 4 \times 8 = 152 \times 8 =
    1216$, but I prefer to multiply the two-digit number by the larger factor first,
    so that the next number (usually a three-digit number) is multiplied by the smaller
    factor.


    > Aside The factoring method also works well on multiples of 11, since there is
    an especially easy trick for multiplying by 11: just add the digits and the total
    in between. For example, to do $53 \times 11$, we see that $5 + 3 = 8$, the answer
    is 583. What''s $27 \times 11$? Since $2 + 7 = 9$, the answer is 297. What if
    the total of the digits is bigger than 97? In that case, we insert the last digit
    of the total and increase the first digit by 1. For example, to compute $48 \times
    11$, $4 + 8 = 12$, the answer is 528. Similarly, $74 \times 11 = 814$. This can
    be exploited when multiplying numbers by multiples of 11. For example,


    $74 \times 33 = 74 \times 11 \times 3 = 814 \times 3 = 2442$


    Another method for multiplying two-digit numbers is the close together method.
    You can use it when both numbers begin with the same digit. It seems utterly magical
    when you watch it in action. For example, you believe that


    $38 \times 32 = (30 \times 40) + (8 \times 2) = 1200 + 16 = 1216$


    The calculation is especially simple (as in the example above) when the second
    digits sum up to 10. (Here, both numbers begin with 3 and the second digits have
    the sum $8 + 2 = 10$.) Here''s another example:


    $83 \times 87 = (80 \times 90) + (3 \times 7) = 7200 + 21 = 7221$


    Even when the second digits don''t add up to 10, the calculation is almost as
    simple. For example, to multiply $41 \times 44$, if you decrease the smaller number
    by 1 (to reach the round number 40), you must increase the larger number by 1
    as well. Consequently,


    $41 \times 44 = (40 \times 45) + (1 \times 4) = 1800 + 4 = 1804$'
