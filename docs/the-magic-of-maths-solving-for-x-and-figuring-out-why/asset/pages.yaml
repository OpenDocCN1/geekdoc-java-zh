  md: '# Mental subtraction.


    The most important idea with mental subtraction problems is the strategy of oversubtracting.
    For example, when subtracting 9, it''s often easier to first subtract 10, then
    add back 1. For example,


    ```

    83 - 9 = 73 + 1 = 74

    ```


    Or to subtract 39, it''s probably easier to first subtract 40, then add back 1.


    ```

    83 - 39 = 43 + 1 = 44

    ```


    When subtracting numbers with two or more digits, the key idea is to use complements.
    (You''ll compliment me later for this.) The complement of a number is its distance
    to the next-highest round number. With one-digit numbers, this is the distance
    to 10. (For example, the complement of 9 is 1.) For two-digit numbers, this is
    the distance to 100. Look at the following pairs of numbers that add up to 100.
    What do you notice?


    | 87 | 75 | 56 | 92 | 80 |

    |---|---|---|---|---|

    | + 13 | + 25 | + 44 | + 08 | + 20 |

    | 100 | 100 | 100 | 100 | 100 |


    Complementary two-digit numbers sum to 100


    We say that the complement of 87 is 13, the complement of 75 is 25, and so on.
    Conversely, the complement of 13 is 87 and the complement of 25 is 75. Reading
    each problem from left to right, you will notice that (except for the last problem)
    the leftmost digits add to 9 and the rightmost digits add to 10. The exception
    is when the numbers end in 0 (as in the last problem). For example, the complement
    of 80 is 20.


    Let''s apply the strategy of complements for the problem 1234 - 567. Now, that
    would not be a fun problem to do on paper. But with complements, hard subtraction
    problems become easy addition problems! To subtract 567, we begin by subtracting
    600. That''s easy to, especially if you think from left to right: 1234 - 600 =
    634. But you''ve subtracted too much. How much too much? Well, how far is 567
    from 600? It''s the same as the distance between 67 and 100, which is 33. Thus


    ```

    1234 - 567 = 634 + 33 = 667

    ```'
