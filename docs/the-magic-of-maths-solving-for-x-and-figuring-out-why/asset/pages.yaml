    # Aside


    It''s natural to ask, from 10 possible flavors, how many cups with 3 scoops can
    be made if repetition of flavors is allowed? (The answer is not $10^3/6$, which
    is not even a whole number!) The direct approach would be to consider three cases,
    depending on the number of different flavors in the cup. Naturally there are 10
    cups that we use just one flavor and, from the above discussion, there are $\binom{10}{3}
    = 120$ cups that we use three flavors. There are $2 \times \binom{10}{2} = 90$
    cups that use two flavors, since we can choose the two flavors in $\binom{10}{2}$
    ways, then decide which of the flavors gets two scoops. Adding all three cases
    together, the number of cups is $10 + 120 + 90 = 220$.


    There is another way to get this answer without breaking it into three cases.
    Any cup can be represented using 3 stars and 9 bars. For example, choosing flavors
    1, 2, and 7 can be represented by the star-bar arrangement


    ![](img/3f33497047d2980a16cc0a7e85f4c95f_88_0.png)


    Picking flavors 2, 2, and 7 would look like


    ![](img/3f33497047d2980a16cc0a7e85f4c95f_88_1.png)


    and the star-bar arrangement


    ![](img/3f33497047d2980a16cc0a7e85f4c95f_88_2.png)


    would be a cup with flavors 3, 5, and 10. Every arrangement of 3 stars and 9 bars
    corresponds to a different cup. Together the stars and bars occupy 12 spaces,
    which are occupied by stars. Hence, the stars and bars can be arranged in $\binom{12}{3}
    = 220$ ways. More generally, the number of ways to choose $k$ objects out of $n$
    where order is not important, repetition is allowed, is the number of ways to
    arrange $k$ stars and $n-1$ bars, which can be done in $\binom{n+k-1}{k}$ ways.'
