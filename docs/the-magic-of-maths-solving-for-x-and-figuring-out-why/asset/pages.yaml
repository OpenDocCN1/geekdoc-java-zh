  md: '# Celebrating and Memorizing π (and τ)


    Because people''s fascination with π (and as a way to test the speed and accuracy
    of supercomputers), π has been calculated to trillions of digits. We certainly
    don''t need to know π to that level of accuracy. With just digits of π, you can
    measure the circumference of the known universe to within the radius of a hydrogen
    atom!


    The number has developed almost a cult following. Many people like to celebrate
    the number π on Pi Day, March 14 (with numeric representation 3/14), which happens
    to be the birthday of Albert Einstein. A typical Pi Day event might consist of
    mathematically themed pies for display and consumption, Einstein costumes, and
    of course π memorization contests. Students generally memorize dozens of digits
    of π, and it is not unusual for the winner to have memorized a hundred digits.
    By the way, the current world record for memorization belongs to Chao Lu of China,
    who in 2005 recited π to 67,890 decimal places! According the Guinness Book of
    World Records, Lu practiced for four years to reach these many digits, and it
    took him a little over twenty-four hours to recite all the digits.


    Behold the first hundred of digits:


    ```

    π = 3.141592653385973238462643383271950288419716399375

    1058209794459230781402628209862803482534211067 ...

    ```


    Over the years, people have come up with creative ways to memorize the digits
    of π. One method is to create sentences where the length of each word gives us
    the next digit of π. Some examples include “How I wish I could calculate pi” (which
    yields seven digits: 3.141592) and “How I want a drink, alcoholic of course, after
    the heavy lectures involving quantum mechanics” (which provides fifteen digits).


    A most impressive example was written in 1995 by Mike Keith, who generated 740
    digits in an amazing parody of Edgar Allan Poe’s poem “The Raven.” The first stanza,
    along with the line, generates 42 digits. The stanza’s “disturbing” ten-letter
    word generates the digit 0.


    > Poe. E. Near a Raven


    Midnights so dreary, tired and weary.

    Silently pondering verses extolling all by-now obsolete lore.

    During my rather long nap—the weirdest tap!

    An ominous vibrating sound disturbing the chamber’s anteudor.

    “This,” I whispered, “I ignore.”'
