  md: '# The Magic of Algebra 33


    the constant term) is the product of the numbers $3 \times 4$. With practice,
    you can immediately write down the product. For example, since $5+7 = 12$ and
    $5 \times 7 = 35$, we instantly get


    ```

    $$(x + 5)(x + 7) = x^2 + 12x + 35$

    ```


    It works with negative numbers, too. Here are some examples. In the first example,
    we exploit the fact that $6+(-2) = 4$ and $6 \times (-2) = -12$.


    ```

    $$(x + 6)(x - 2) = x^2 + 4x - 12$$

    $$(x + 1)(x - 8) = x^2 - 7x - 8$$

    $$(x - 5)(x - 7) = x^2 - 12x + 35$

    ```


    Here are examples where the numbers are the same.


    ```

    $$(x + 5)^2 = (x + 5)(x + 5) = x^2 + 10x + 25$$

    $$(x - 5)^2 = (x - 5)(x - 5) = x^2 - 10x + 25$

    ```


    Notice that, in particular, $(x + 5)^2 \neq x^2$, a common mistake made by beginning
    algebra students. On the other hand, something interesting happens when the numbers
    have opposite signs. For example, since $5 + (-5) = 0$,


    ```

    $$(x + 5)(x - 5) = x^2 - 5x - 5x - 25 = x^2 - 25$

    ```


    In general, it''s worth remembering the difference of squares formulas:


    ```

    $$(x + y)(x - y) = x^2 - y^2$

    ```


    We applied this formula in Chapter 1, where we learned a shortcut for squaring
    numbers quickly. The method was based on the following algebra:


    ```

    $$$A^2 = (A + d)(A - d) + d^2$

    ```


    Let''s verify the formula. By the difference of squares formula, we see that $[(A
    + d)(A - d)] + d^2 = [A^2 - d^2] + d^2 = A^2$. Hence the formula works for all
    values of $A$ and $d$. In practice, $d$ is the distance to the nearest easy number.
    For example, to square 97, we choose $d = 3$ so


    ```

    $$$97^2 = (97 + 3)(97 - 3) + 3^2$$

    $$(100 \times 94) + 9$$

    $$= 9409$

    ```'
