    So why multiples of 9 always add up to 9? Let''s look at an example. The number
    3456, expressed in powers of 10, looks like


    ```

    3456 = (3 × 1000) + (4 × 100) + (5 × 10) + 6

    = 3(999 + 1) + 4(99 + 1) + 5(9 + 1) + 6

    = 3(999) + 4(99) + 5(9) + 3 + 4 + 5 + 6

    = (multiple of 9) + 18

    = a multiple of 9

    ```


    By the same logic, any number with a digit sum that is a multiple of 9 must itself
    be a multiple of 9 (and vice versa: any multiple of 9 must have a digit sum that
    is a multiple of 9).


    # Casting Out Nines


    What happens when the sum of the digits of your number is not a multiple of 9?
    For example, consider the number 3457. Following the above process, we can write
    3457 (whose digits sum to 19) as 3(999) + 4(99) + 5(9) + 7 + 12, so 3457 is 7
    + 12 = 19 bigger than a multiple of 9. And'
