    ![](img/3f33497047d2980a16cc0a7e85f4c95f_109_1.png)


    Fibonacci numbers have numerous applications- and they appear in nature surprisingly
    often. For example, the number of petals on a flower is often a Fibonacci number,
    and the number of spirals on a sunflower, pineapple, and pinecone tends to be
    a Fibonacci number as well. But what inspires me about Fibonacci numbers are the
