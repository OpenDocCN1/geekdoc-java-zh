  md: 'In the same way that the square root is the inverse of the squaring function
    (since the functions undo each other), the logarithm is the inverse of the exponential
    function. The most commonly used logarithm is the base 10 logarithm, denoted log
    x. We say that


    ```

    $y = \log x \text{ if } 10^y = x$

    ```


    Or equivalently,


    ```

    $10^{\log x} = x$

    ```


    For example, since $10^2 = 100$, we have log 100 = 2. Here is a useful table of
    logarithms.


    | Logarithm | Explanation |

    |---|---|

    | log 1 = 0 | Since $10^0 = 1$ |

    | log 10 = 1 | Since $10^1 = 10$ |

    | log 100 = 2 | Since $10^2 = 100$ |

    | log 1000 = 3 | Since $10^3 = 1000$ |

    | log(1/10) = -1 | Since $10^{-1} = 1/10$ |

    | log .01 = -2 | Since $10^{-2} = .01$ |

    | log $\sqrt{10}$ = 1/2 | Since $10^{1/2} = \sqrt{10}$ |

    | log $10^x = x$ | Since $10^x = 10^x$ |

    | log 0 is undefined | Since no $y$ has $10^y = 0$ |


    One of the reasons logarithms are so useful is that they transform large numbers
    into smaller numbers that our brains are better able to comprehend. For example,
    the Richter scale uses logarithms, which allow us to measure the size of an earthquake
    on a scale of 1 to 10. Log logarithms are also used for measuring the intensity
    of sound (using decibels), the acidity of a chemical solution (pH), and even the
    popularity of a webpage through Google''s PageRank algorithm.


    What is log 512? Any scientific calculator (or most search engines) will tell
    you log 512 = 2.709... This seems reasonable: 512 lies between $10^2$ and $10^3$,
    its logarithm must be between 2 and 3. Logarithms were invented as a tool for
    converting multiplication problems into easier addition problems. This was based
    on the following useful theorem.


    **Theorem:** For any positive numbers $x$ and $y$,


    ```

    $$\log xy = \log x + \log y$

    ```'
