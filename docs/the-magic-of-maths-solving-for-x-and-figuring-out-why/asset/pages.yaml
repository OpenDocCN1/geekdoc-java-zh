- img_proc: true
  md: '# The Magic of Algebra


    FOIL gets its name from First-Outer-Inner-Last. Here, ac is the product of the
    first terms in $(a+b)(c+d)$. Then $ad$ is the product of the outer terms. Then
    $bc$ is the product of the inner terms. Then $bd$ is the product of the last terms.


    To illustrate, let''s multiply two numbers using FOIL:


    ```

    $23 \times 45 = (20 + 3)(40 + 5)\n= (20 \times 40) + (20 \times 5) + (3 \times
    40) + (3 \times 5)\n= 800 + 100 + 120 + 15\n= 1035$

    ```


    > ### Aside

    Why does FOIL work? by the distributive law (with the sum part written first)
    we have

    $$(a+b)e = ae + be$$

    Now if we replace $e$ with $c+d$, this gives us

    $$(a+b)(c+d) = a(c+d) + b(c+d) = ac + ad + bc + bd$


    where the last equality comes from applying the distributive law. Or if you prefer
    a more geometric argument (when $a,b,c,d$ are positive), find the area of the
    rectangle below in two different ways.


    | a | ac | ad |

    |---|---||

    | b | bc | bd |

    | | c | d |


    On the one hand, the rectangle has area $(a+b)(c+d)$. On the other hand, we can
    decompose the big rectangle into four smaller rectangles, with areas $ac, ad,
    bc,$ and $bd$. Hence the area is also equal to $ac+ad+bc+bd$. Equating these two
    areas gives us FOIL.'
