    that add up to an odd number nor find a prime number that is larger than all other
    primes. Proofs can be a little scary the first (or second or third) time that
    you encounter them, and they are definitely an acquired taste. But once you get
    the hang of them, proofs can be quite fun to read and write. A good proof is like
    a well-told joke or story—it leaves feeling very satisfied at the end.


    Let me tell you about my first experiences of proving something impossible. When
    I was a kid, I loved games and puzzles. One day, a friend challenged me with a
