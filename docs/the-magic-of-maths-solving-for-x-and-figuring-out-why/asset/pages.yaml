    \ segment from $(x_1, y_1)$ to $(x_2, y_2)$.\n\n$L = \\sqrt{(x_2 - x_1)^2 + (y_2\
    \ - y_1)^2}$$\n\nFor example, the **length of the line segment** from $(-2,3)$\
    \ to $(5,8)$ would be $\\sqrt{(5-(-2))^2 + (8-3)^2} = \\sqrt{7^2 + 5^2} \\approx\
    \ 8.6$.\n\n![](img/3f33497047d2980a16cc0a7e85f4c95f_230_0.png)\n\nFrom the Pythagorean\
