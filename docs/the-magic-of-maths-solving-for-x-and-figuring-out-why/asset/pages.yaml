    It''s time to put these trigonometric functions to work. In geometry, the Pythagorean
    theorem tells us the length of the hypotenuse given the legs of any right triangle.
    In trigonometry, we can perform a similar calculation for *any* triangle using
    the law of cosines.


    **Theorem (law of cosines):** For any triangle ABC, where the sides of length
    $a$ and $b$ form $\angle C$, the third side of length $c$ satisfies


    > $c^2 = a^2 + b^2 - 2ab \cos C$


    For example, in the triangle below, triangle ABC has sides of 21 and 26 with a
    $15^\circ$ angle between them. So according to the law of cosines, the third side
    of length $c$ must satisfy


    > $c^2 = 21^2 + 26^2 - 2(21)(26) \cos 15^\circ$


    and since $\cos 15^\circ \approx 0.9659$, this equation reduces to $c^2 = 62.21$,
    and therefore $c \approx 7.89$.


    ![](img/3f33497047d2980a16cc0a7e85f4c95f_225_1.png)'
