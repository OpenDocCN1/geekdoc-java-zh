    \nHow many dots are in the rectangle?\n\nSince the two triangles form a rectangle\
    \ with 5 rows and 6 columns, there are 30 dots altogether. Hence, each original\
    \ triangle must have half as many dots, namely 15. Of course, if we knew that,\
    \ already, the same argument shows that if you take two triangles with $n$ rows\
    \ and put them together as we did, then you form a rectangle with $n$ rows and\
