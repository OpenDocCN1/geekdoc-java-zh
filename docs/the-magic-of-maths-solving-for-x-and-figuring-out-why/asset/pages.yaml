  md: '# The Magic of Proofs


    Question: How many ways can a hockey team with $n$ players (with jerseys numbered
    1 through $n$) choose a delegation to attend a conference where at least one player
    must be on the delegation?


    Answer 1: Each player has 2 choices, either attend or not, so the answer would
    seem to be $2^n$, but we need to subtract 1 to exclude the possibility that all
    players choose not to attend. Thus there are $2^n - 1$ possibilities.


    Answer 2: Consider the largest jersey number who attends the conference. There
    is only 1 delegation where 1 is the largest jersey number. There are 2 delegations
    where 2 is the largest jersey number (since player 2 either attends alone or with
    player 1). There are 4 delegations where 3 is the largest jersey number (since
    player 3 must attend and players 1 and 2 each have two choices). Continuing in
    this manner, there are $2^{n-1}$ delegations where player $n$ is the largest jersey
    number, since player $n$ must attend, but players 1 through $n-1$ each have 2
    choices (to attend or not). Altogether, there are $1 + 2 + 4 + \dots + 2^{n-1}$
    possibilities.


    Since answer 1 and answer 2 are both correct, then they must be equal. Therefore
    $1 + 2 + 4 + \dots + 2^{n-1} = 2^n - 1$.


    But the simplest proof relies only on algebra. It is reminiscent of the method
    used for expressing a repeated decimal as a fraction.


    # Proof by Algebra:


    $Let S = 1 + 2 + 4 + 8 + \dots + 2^{n-1} + 2^n$


    Multiplying both sides by 2 gives us


    $2S = 2 + 4 + 8 + \dots + 2^{n-1} + 2^n$


    Subtracting the first equation from the second, we have massive cancellation except
    for the first term of $S$ and the last term of $2S$. Therefore,


    $S = 2S - S = 2^n - 1$


    The theorem we just proved is actually the key to the important binary representation
    of numbers, which how computers store and manipulate numbers. The idea behind
    binary is that every number can be represented as a unique sum of distinct powers
    of 2. For example,


    $83 = 64 + 16 + 2 + 1$'
