  md: "# 252 The Magic of Math\n\nThis gives us the proof of “God’s equation,” introduced\
    \ at the beginning of the chapter. Letting $\theta = \\pi$ radians (or $180^\\\
    circ$), we have\n\n$$e^{i\\pi} = \\cos \\pi + i \\sin \\pi = -1 + i(0) = -1$$\n\
    \nEuler’s theorem says much more than this. We have seen the expression $\\theta\
    \ + i \\sin \\theta$ before. It is the point on the unit circle of the complex\
    \ plane that has an angle of $\\theta$ relative to the positive $x$-axis. Euler’s\
    \ theorem says that you can express that point in a simple way, as shown in the\
