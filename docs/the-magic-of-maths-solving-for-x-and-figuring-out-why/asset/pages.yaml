  md: '$a \equiv b (mod m)$ and $c$ is any integer, then it is also true


    $a+c \equiv b+c \text{ and } ac \equiv bc (mod m)$


    Different congruences can be added, subtracted, and multiplied. For instance,
    $a \equiv b (mod m)$ and $c \equiv d (mod m)$, then


    $a+c \equiv b+d \text{ and } ac \equiv bd (mod m)$


    For example, since $14 \equiv 2$ and $17 \equiv 5 (mod 12)$, then $14 \times 17
    \equiv 2 \times 5 (mod 12)$, and $238 \equiv 10 + (12 \times 19)$. A consequence
    of this rule is that we can raise congruences to powers. If so $a \equiv b (mod
    m)$, then we have the **power rule**:


    $a^2 \equiv b^2 \quad a^3 \equiv b^3 \quad \dots \quad a^n \equiv b^n (mod m)$


    for any positive integer $n$.


    > Why does modular arithmetic work? If $a \equiv b (mod m)$ and $c \equiv d (mod
    m)$, then $a = b+pm$ and $c = d+qm$ for some integers $p$ and $q$. Thus $a+c =
    (b+d) + (p+q)m$, and therefore $a+c \equiv b+d (mod m)$.\nmore, FOIL.


    > $ac = (b+pm)(d+qm) = bd+(bq+pd+pqm)$


