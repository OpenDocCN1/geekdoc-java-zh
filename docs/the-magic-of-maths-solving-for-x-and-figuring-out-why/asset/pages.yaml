  md: 'The hexagon can be broken into 6 triangles, each with a central angle of 360°/6
    = 60°. Two sides of triangle are radii of the circle with length 1, so the triangle
    is isosceles. By the isosceles triangle, the other two angles are equal, and must
    therefore also be 60°. Hence, these triangles are all equilateral with sides of
    length 1. The perimeter of the hexagon is 6, which is less than the circumference
    of 2π. Thus 6 < 2π, and so π < 3. Putting it all together, we have


    # 3 < π < 4


    We can restrict π to a smaller interval using polygons with more sides. For example,
    if we surround the unit circle with a hexagon instead of a square, we can prove
    that π < 2√3 = 3.46...


    ![](img/3f33497047d2980a16cc0a7e85f4c95f_206_0.png)


    Once again, the hexagon can be subdivided into six equilateral triangles. Each
    of these triangles can be subdivided into two congruent right triangles. If the
    short leg has length x, then the hypotenuse has length 2x, and by the Pythagorean
    theorem, x² + 1 = (2x)². Solving for x gives us x = 1/√3. Consequently, the perimeter
    of the hexagon is 12/√3 = 4√3, and since this is greater than the circle''s circumference,
    2π, it follows that π < 2√3. (Interestingly, we reach the same conclusion by comparing
    the area of the circle to the area of the hexagon.)


    The great Greek mathematician Archimedes (287 to 212 BC) built on this result
    to create inscribed and circumscribed polygons with 12, 24, 48, and 96 sides,
    leading to 3.14103 < π < 3.14271 and the simpler looking inequality


    3/71 < π < 1/7'
