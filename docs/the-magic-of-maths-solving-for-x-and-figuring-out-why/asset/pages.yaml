  md: "Now try $59^2$. By going up and down 1, you get $59^2 = (60 \times 58) + 1^2$\n\
    But how should you mentally calculate $60 \times 58$? Three words of advice: left\
    \ to right. Let's first ignore the 0 and compute $6 \times 58$ from left to right.\n\
    Now $6 \times 50 = 300$ and $6 \times 8 = 48$. Add these numbers together (from\
    \ left to right) to get 348. Therefore, $60 \times 58 = 3480$, and so\n\n$59^2\
    \ = (60 \times 58) + 1^2 = 3480 + 1 = 3481$\n\n> Aside\nHere's the algebra that\
    \ explains why this method works. (You may come back to this after reading about\
    \ the difference of squares in Chapter 2.)\n\n$A^2 = (A + d)(A - d) + d^2$\n\n\
    where $A$ is a number being squared, and $d$ is the distance to the nearest easy\
    \ number (although the formula works for any number $d$). For example, when squaring\
    \ 59, $A = 59$ and $d = 1$, so the formula tells you to do $(59 + 1) \times (59\
    \ - 1) + 1^2$, as in the previous calculation.\n\nOnce you get good at squaring\
    \ two-digit numbers, you can square three-digit numbers by the same method. For\
    \ example, if you know $12^2 = 144$, then\n\n$112^2 = (100 \times 124) + 12^2\
    \ = 12,400 + 144 = 12,544$\n\nA similar method can be used for multiplying any\
    \ two numbers that are close to 100. When you see the method, it looks like pure\
    \ magic. Look at the problem $104 \times 109$. Next to each number write down\
    \ its distance from 100, in the figure below. Add the first number to the second\
    \ distance number. Here, that would be $104 + 9 = 113$. Then multiply the distance\
    \ numbers together. In this case, $4 \times 9 = 36$. Push these numbers together\
    \ and your answer magically appears.\n\n104 (4)\n$\times$ 109 (9)\n113 36\n\n\
    A magical way to multiply numbers close to 100—here, $104 \times 109 = 11,336$\n\
    \nI'll show you more examples of this and the algebra behind it in Chapter 2.\
    \ But while we're on the subject, let me say a few words"
