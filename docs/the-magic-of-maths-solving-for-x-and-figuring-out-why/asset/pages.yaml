    Proofs by induction can handle more than just sums. Induction is often useful
    whenever the solution to your “larger” problem (of size $k+1$) can be expressed
    in terms of a smaller problem (of size $k$). Here is my favorite proof by induction,
    and it relates to the checkerboard tiling problem at the beginning of the chapter.


    ![](img/3f33497047d2980a16cc0a7e85f4c95f_147_0.png)


    Since 64 is not a multiple of 3, we can’t cover an 8-by-8 checkerboard with trominoes
    alone. But if you place a 1-by-1 square on the board, we claim that the rest of
    the board can be tiled with trominoes regardless of the square’s location. In
    fact, not only is this statement true for 8-by-8 checkerboards, but it’s also
    true for boards of size 2-by-2, 4-by-4, 16-by-16, and so on.


    **Proof (by induction):** The theorem is true when $n=1$, since any 2-by-2 board
    can be covered with a single tromino and square, where the square can be anywhere
    on the board. Now suppose the theorem holds when $n=k$, that is, for boards of
    size $2^k$-by-$2^k$. Our goal is to show that it remains true for boards of size
    $2^{k+1}$-by-$2^{k+1}$. Place the 1-by-1 square anywhere on the board, then divide
    the board into four quadrants, as illustrated below.


    ![](img/3f33497047d2980a16cc0a7e85f4c95f_147_1.png)


    Covering a checkerboard with trominoes'
