  md: "# CHAPTER SIX\n\n$1 + 2 + 3 = 1 \times 2 \times 3 = 6$\n\n# The Magic of Proofs\n\
    \n# The Value of Proofs\n\nOne of the great joys of doing mathematics, and indeed\
    \ what separates mathematics from all other sciences, the ability to prove things\
    \ true beyond a shadow of a doubt. In other sciences, we accept certain laws because\
    \ they conform to the real world, but those laws can be contradicted or modified\
    \ if new evidence presents itself. In mathematics, if a statement is proved to\
    \ be true, then it is true forever. For example, it was proved by Euclid over\
    \ thousand years ago that there are infinitely many prime numbers, and there is\
    \ nothing that we can say or do that will contradict the truth of that statement.\
    \ Technology comes and goes, but a theorem is forever. As the great mathematician\
    \ G. H. Hardy said, “A mathematician, like a painter or poet, is a maker of patterns.\
    \ If his patterns are more permanent than theirs, it is because they are made\
    \ with ideas.” To me, it often seems the best route to academic immortality would\
    \ be to prove a new mathematical theorem.\n\nNot only can mathematics prove things\
    \ with absolute certainty, it can also prove that things are impossible. Some\
    \ people say “You cannot prove a negative,” which I suppose means that you cannot\
    \ prove that there are no purple cows, since one might show up someday. But in\
    \ mathematics, you can prove negatives. For example, no matter how hard you try,\
    \ you will never be able to find two even numbers"
