    > **Aside**

    Later in this book, we''ll see how the approach of counting dots (and the general
    approach of answering a question in two different ways) leads to some interesting
    results in advanced mathematics. But it can also be useful for understanding elementary
    mathematics as well. For example, why does $3 \times 5=5 \times 3$? I''m sure
    you haven''t even questioned that statement since we were told, that the order
    of multiplication doesn''t matter. (Mathematicians say that multiplication of
    numbers is commutative.) But why 3 bags of 5 marbles contain the same amount as
    5 bags of 3 marbles? The explanation is simple if you just count the dots in a
    3-by-5 rectangle. Counting row by row, we see 3 rows of 5 dots apiece, we also
    have 5 columns with 3 dots apiece, so there are also $5 \times 5$ dots.


