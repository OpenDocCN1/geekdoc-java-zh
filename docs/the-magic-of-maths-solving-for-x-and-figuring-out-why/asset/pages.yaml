  md: 'bottom, as shown below. Gauss observed that each of the 50 columns would add
    up to the same sum, 101, and so their total would just be 50 × 101, which is 5050.


    | 1 | 2 | 3 | 4 | ... | 47 | 48 | 49 | 50 |

    | + 100 | + 99 | + 98 | + 97 | ... | + 54 | + 53 | + 52 | + 51 |

    | 101 | 101 | 101 | 101 | ... | 101 | 101 | 101 | 101 |


    Splitting the numbers from 1 to 100 into two twos; each pair of numbers adds to
    101


    Gauss went on to become the greatest mathematician of the nineteenth century,
    not because he was quick at doing mental calculations, but because of his ability
    to make numbers dance. In this chapter, we will explore many interesting number
    patterns and to see how numbers dance. Some of these patterns can be applied to
    mental calculations more quickly, and some are just beautiful for their own sake.


    We''ve used Gauss''s logic to sum the first 100 numbers, but what if we wanted
    to sum 17 or 1000 or 1 million? We will, in fact, use his logic to sum the first
    *n* numbers, where *n* be any number you want! Some people find numbers to be
    less abstract when they can visualize them. We call the numbers 1, 3, 6, 10, and
    15 triangular numbers, since we can create triangles like the ones below using
    those quantities of dots. (You might dispute that 1 dot forms a triangle, but
    nevertheless 1 is considered triangular.) The official definition is that the
    *n*th triangular number is $1 + 2 + 3 + \dots + n$.


    ![](img/3f33497047d2980a16cc0a7e85f4c95f_16_0.png)


    The first 5 triangular numbers are 1, 3, 6, 10, and 15


    Notice what happens when we put two triangles side by side, as depicted on the
    opposite page:'
