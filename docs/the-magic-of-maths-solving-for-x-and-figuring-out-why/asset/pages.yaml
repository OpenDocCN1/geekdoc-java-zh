  md: '# The Magic of Math


    When we start summing cubes, we get the totals 1, 9, 36, 100, 225, and so on,
    which are all perfect squares. But they''re not just any perfect squares; they
    are the squares of 1, 3, 6, 10, 15, and so on, which are all triangular numbers!
    Earlier we saw that these were the sums of integers and so, for example,


    ```

    $1^3 + 2^3 + 3^3 + 4^3 + 5^3 = 225 = 15^2 = (1 + 2 + 3 + 4 + 5)^2$

    ```


    To put it another way, the sum of the cubes of the first $n$ numbers is the square
    of the sum of the first $n$ numbers. We''re not quite ready to prove that result
    now, but we will see two proofs of this in Chapter 6.


    # Fast Mental Calculations


    Some people look at these number patterns and say, “Okay, that''s nice. But what
    good are they?” Most mathematicians would probably respond like any artist—by
    saying that a beautiful pattern needs no justification other than its beauty.
    And the patterns become even more beautiful the deeply we understand them. But
    sometimes the patterns can lead to real applications.


    Here''s a simple pattern that I had the pleasure of discovering (even if I was
    young. I wasn''t the first person to do so) I was looking at pairs of numbers
    that added up to 20 (such as 10 and 10, or 9 and 11), and I wondered how large
    the product could get. It seemed that the largest product would occur when both
    numbers were equal to 10, and the pattern confirmed that.


    # Distance Below 100


    $10 \times 10 = 100$

    $9 \times 11 = 99$

    $8 \times 12 = 96$

    $7 \times 13 = 91$

    $6 \times 14 = 84$

    $5 \times 15 = 75$


    The product of numbers that add to 20


    The pattern was unmistakable. As the numbers were farther apart, the product became
    smaller. And how far far below 100 were they?'
