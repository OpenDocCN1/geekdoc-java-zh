  md: '# The Magic of Math


    since 19 = 18 + 1, this indicates that 3457 is just 1 bigger than a multiple of
    9. We can reach the same conclusion by adding the digits of 19, adding the digits
    of 10, which I represent as


    ```

    3457 \rightarrow 19 \rightarrow 10 \rightarrow 1

    ```


    The process of adding the digits of your number and repeating the process until
    you are reduced to a one-digit number is called casting out nines, since at each
    step of the process, you are subtracting a multiple of 9. The one-digit number
    obtained at the end of the process is called the digital root of the original
    number. For example, the digital root of 3457 is 1. The number 3456 has digital
    root 9. We can succinctly summarize our previous conclusions as follows. For any
    positive n:


    > If n has a digital root of 9, then n is a multiple of 9. Otherwise, the digital
    root is the remainder obtained when n is divided by 9.


    Or expressed more algebraically, if n has digital root r, then


    ```

    n = 9x + r

    ```


    for the process of casting out nines can be a fun way to check your answers to
    addition, subtraction, and multiplication problems. For example, if an addition
    problem is solved correctly, then the digital root of the answer must agree with
    the sum of the digital roots. Here''s an example. Perform the addition problem


    ```

    91787 \rightarrow 32 \rightarrow 5\n+ 42864 \rightarrow 24 \rightarrow 6\n134651\n11
    \rightarrow (2)\n20 \rightarrow (2)

    ```


    nNotice that the numbers being added have digital roots of 5 and 6 and their sum,
    11, has digital root 2. It is no coincidence that the digital root of the answer,
    134,651, also has a digital root of 2. The reason this process works in general
    is based on the algebra


    ```

    (9x + r1) + (9y + r2) = 9(x + y) + (r1 + r2)

    ```'
