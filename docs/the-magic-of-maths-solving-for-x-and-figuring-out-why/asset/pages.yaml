  md: '# Figuring Out Y (and X!)


    Let''s end this chapter as we began it, with an algebra-based magic trick.

    Step 1. Think of two numbers from 1 to 10.

    Step 2. Add those numbers together.

    Step 3. Multiply that number by 10.

    Step 4. Now add the larger original number.

    Step 5. Subtract the smaller original number.

    Step 6. Tell me the number you''re thinking of and I''ll tell you both of the
    original numbers!


    Believe it or not, with one piece of information, you can determine both of the
    original numbers. For example, if the final answer is 126, you must have started
    with 9 and 3. Even if this trick is repeated a few times, it''s hard for your
    audience to figure out how you are doing.


    Here''s the secret. To determine the larger number, take the last digit of answer
    (6 here) and add it to the number(s) (12 here), then divide by 2. We conclude
    that the larger digit is (12 + 6)/2 = 18/2 = 9. For the smaller number, take the
    larger digit that you just computed (9) and subtract the last digit of the answer.
    Here that would be 9 - 6 = 3.


    Here are two more examples for practice. If the answer is 82, the larger number
    is (8 + 2)/2 = 5 and the smaller number is 5 - 2 = 3. If the answer is 137, the
    larger number is (13 + 7)/2 = 10 and the smaller number is 10 - 7 = 3.


    Why does it work? Suppose you start with two numbers X and Y, where X is equal
    to or larger than Y. Following the original instructions and the algebra in the
    table below, we see that after Step 5, you end up with the number 10(X + Y) +
    (X - Y).


    | Step 1 | X and Y |

    | Step 2 | X + Y |

    | Step 3 | 10(X + Y) |

    | Step 4 | 10(X + Y) + X |

    | Step 5 | 10(X + Y) + (X - Y) |

    | Larger Number: ((X + Y) + (X - Y))/2 = X |

    | Smaller Number: X - (X - Y) = Y |'
