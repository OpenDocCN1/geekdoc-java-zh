    It is superbly ironic that the socialist movement, far from being in the “vanguard”
    of current social and cultural developments, lingers behind them in almost every
    detail. This movement’s shallow comprehension of the counterculture, its anemic
    interpretation of workers’ liberation, its indifference to ecology, and its ignorance
    even of new currents that are drifting through the factories (particularly among
    young workers) seems all the more grotesque, when juxtaposed with its simplistic
    “class analysis,” its proclivity for hierarchical organization, and its ritualistic
    invocation of “strategies” and “tactics” that were already inadequate a generation
    ago.


    Contemporary socialism has shown only the most limited awareness that people by
    the millions are slowly redefining the very meaning of freedom. They are constitutively
    enlarging their image of human liberation to dimensions that would have seemed
    hopelessly visionary in past eras. In ever-growing numbers they seem society has
    developed a technology that could completely abolish material scarcity and reduce
    to a near vanishing point. Faced with the possibilities of a classless post-scarcity
    society and with the meaninglessness of hierarchical relations, they are intuitively
    trying to deal with the problems of communism, not socialism.¹ They are intuitively
    trying to eliminate domination in all its forms and nuances, not merely material
    exploitation. Hence the widespread erosion of authority as such—in the family,
    in the schools, in vocational and professional arenas, in the Church, in the army,
    in virtually every institution that supports hierarchical power and every nuclear
    relationship that is marked by domination. Hence, too, the intensely personal
    nature of the rebellion that is percolating through society, its highly subjective,
    existential, and cultural qualities. The rebellion affects everyday life before
    it visibly affects the broader aspects of social life and it undermines the concrete
    loyalties of the individual to the system even before it vitiates the system’s
    abstract political and moral verities.


    To these deep-seated liberatory currents, so rich in existential content, the
    socialist movement continues to oppose the constrict formulas of a'
