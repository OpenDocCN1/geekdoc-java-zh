  md: 'between the “realm of necessity” and the “realm of freedom,” is not a natural
    fact that has always been with our species or must always exist with into the
    future. The “realm of necessity” is a distinctly historical phenomenon. In my
    view it emerged when primitive communities ceased to view nature as a coexistent
    phenomenon to be accepted or reverted, and to use Marx’s simplistic metaphors,
    had to “wrestle” with nature as an “other” ultimately to be “dominated.” Once
    humanity’s mutual reciprocity with the natural world dissolved into antagonism
    and its oneness into duality, the process of recovering a new level of reciprocity
    and oneness doubtless the scars of millennia-long struggles to master the “forces”
    of nature. I share the Hegelian view that humanity had to be expelled from the
    Garden of Eden to attain the fullness of its humanity but I emphatically deny
    that this exile necessarily taints utopia with the blood and toil of history;
    the “realm of necessity” must always be the “basis” or precondition for the “realm
    of freedom.” remains Fourier’s lasting contribution that the “realm of necessity”
    can be colonized by the “realm of freedom,” the realm of toil by the realm of
    work, the realm of technics by the realm of play, fantasy, and imagination.

    In case, the “realm of necessity” can never be viewed as a passive “basis”; it
    must always infiltrate and malform the “realm of freedom” until Fourier’s ideal
    becomes the fact that, integral to his theoretical edifice, he colonizes the “realm
    of freedom” by the “realm of necessity as its basis.” The full weight of this
    theoretical approach, with its consequent reduction of social relations to economic
    relations, of creative to “unalienated labor,” of society to “associated producers,”
    of individuality to embodied “needs,” and of freedom to the “shortening of the
    working day” has yet to be grasped in all its regressive content.


    The opening essays in this compilation are united by the emphasis I place on the
    synthesizing role of ecology—a term I sharply distinguish in my very first essay
    from “environmentalism.” I claim that, having divided humanity from nature many
    millennia ago, we must now return to a unity between the social and the natural
    that preserves the gains achieved by social and contrasted history. Thus, the
    real history of humanity (which Marx contrasted with the irrational “prehistory”
