  md: 'above all, emancipatory.


    Thus, the ages-old desideratum of the “good life” converges in ecology (as I would
    define the term) with the thrust of historical development. The French students
    of 1968 inscribed the slogan “Be realistic, demand the impossible” on the walls
    of Paris; to this slogan, I have added, “If we do not do the impossible, we will
    be faced with the unthinkable." Utopia, which was once a mere dream in the pre-industrial
    world, increasingly became a possibility with the development of modern technology.
    Today, I would insist that it has become a necessity—that is, if we are to save
    the ravages of a totally irrational society that threatens to undermine the fundamentals
    of life on this planet.


    But also, my emphasis on achieving a new totality between humanity and nature
    is part of a larger endeavor to transcend the divisions on which hierarchy has
    been reared for centuries—the division between the “realm of necessity” and the
    “realm of freedom,” between work and play, town and country, and body, between
    the sexes, age, ethnic groups, and nationalities. Hence, the holistic outlook
    that pervades this book, a distinctly ecological, indeed, dialectical outlook,
    leads to an examination of community problems in their urban form, to Marxism,
    and to the problems of self-management. I have compiled my articles not only on
    ecology and the ecology movement but on city planning, the urban future, and Marxism,
    which should be seen as a meaningful and logical sequence. The modern urban crisis
    largely reflects the divisions that capitalism produced between society and nature
    reflects these divisions ideologically in Marx’s own dualism between “necessity”
    and “freedom.\ My essays on spontaneity and organization essentially deal with
    ecological “politics” within the revolutionary paradigms and organizational issues
    formulated by the past century of radical practice.


    Finally, this book as a whole is guided by its emphasis on hierarchy and domination
    as the authentic “social question” of human development—this distinguished from
