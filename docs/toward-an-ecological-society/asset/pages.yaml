    to human dimensions, and surrounded by a green belt to limit growth and provide
    open land for recreational and agricultural purposes. Suitable areas of the green
    belt to be occupied by farmers (Howard limited this agricultural population to
    two thousand); the larger urban population of thirty thousand is to engage in
    manufacturing, commerce, and services. All land is to be held in trust and leased
    to occupants on a rental basis. Howard spelled out many design and fiscal details
