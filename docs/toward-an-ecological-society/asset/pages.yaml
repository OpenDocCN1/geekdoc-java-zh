- pgno: 88
  md: 'describes as the “eco-anarchism” of many new technologists and communitarians
    in the United States, could well serve as a valuable point of departure for formulating
    an ethical dimension to the word “human.” If our values are not to be entirely
    arbitrary and relativistic, they must be rooted in certain, objective criteria
    about humanity itself. What clearly unites Aristotle and Kropotkin, despite a
    historic span of more than two millennia, is their emphasis on self-consciousness
    as the most distinctive of two human attributes, notably, the capacity of human
    beings to engage in self-reflection, rational action, and foresee the consequences
    of their activities. Human action is not merely any action by human beings but
    action that fosters reflexivity, rational practice, and foresight. Judging a habitat
    by this criterion, would be obliged to look beyond the mere presence of human
    artifacts and inquire into whether or not the habitat promotes distinctively human
    traits and potentialities.


    Clearly a habitat that is largely incomprehensible to the humans who inhabit would
    be regarded as inhuman. By reason of its size, its centralization, or the exclusivity
    of its decision-making process, would deny the individual the opportunity to understand
    key social factors that affect his personal destiny. Such a habitat, by closing
    to the individual strategic area for the formation of consciousness, would challenge
    the integrity of consciousness itself. This trend, so apparent in the years following
    World War II, can evoke popular resistance is suggested by the often-violent social
    unrest, particularly among American youth, of the 1960s. The official “habitat,”
    marked by a formidable degree of centralization and bureaucratization, seems to
    have generated, in reaction, the “subats” or “subcultures” of the last decade
    from which many of the new technologists and communitarians were to emerge.


    But the same trend toward gigantism and centralization can produce a mind-numbing
    quies. An inhuman habitat tends to produce a dehumanizing—dehumanizing in the
    sense that the degradation inflicted on the public sphere eventually invokes the
    private sphere. The individual who is denied the opportunity to exercise self-administration
    in the public sphere suffers an attrition not only of self-consciousness but also
    of selfhood. The primacy of subjectivity, which philosophy since the Renaissance
    placed above all considerations in the Western intellectual tradition, is vitiated
    by the erosion of the ego. The shriveling of'
