  md: 'That Bolsism recognized this possibility and later cynically exploited it is
    revealed by the emphasis Lenin placed on the factory as the social basis of the
    soviets. Here, indeed, a “proletarian sphere,” to use Oscar Neckt’s phrase, was
    acknowledged and hypostized—not as a truly democratic arena but as the locus for
    a “proletarian public” that could be strategically deployed against the great
    mass of “unreliable” peasants whose villages compromised the authentic “public
    sphere” of revolutionary Russia.


    But the factory, far from being strongest aspect of the “proletarian public sphere”
    is, in fact, its most vulnerable.However much its social weight is reinforced
    by revolutionary shop committees and the most democratic forms of self-management,
    the factory is in no sense an autonomous social organization. Quite to the contrary,
    it is a particularly dependent one that can only function—indeed,exist—in conjunction
    with other factories and sources of raw materials. The Bolsheviks were to astutely
    use this very limitation of the factory to centralize the “proletarian public
    sphere” to a point where they were to remove the last vestigial remains of proletarian
    democracy: first, by employing soviets to isolate the factory from its local community;
    then, by shifting power from the community to the nation in the form of national
    congresses of soviets. The use of soviets to interlink the proletariat from factory
    to factory across the entire breadth of Russia, literally amputating it as a social
    stratum from any comprehensible roots in specific localities where it could function
    effectively, served to hopelessly delimit its powers and to rigorously centralize
    it. In the immense, national congresses of soviets staged annually during the
    revolutionary years, the Russian proletariat had lost all power over even before
    the authority of the congresses had been completely usurped by the Bolshevik party.


    Quite likely, the centralization of the proletariat could have been achieved by
    the Bolsheviks in any case, without manipulating the soviet hierarchy. The very
    class nature of the proletariat, its existence as a creature of a national division
    of labor and its highly particularistic interests that rarely rise to the level
    of a general interest, belie Marx’s claims for its universality and its historic
    role as a revolutionary agent. These attributes, which hindsight clearly reveals
    today, explain the failure of all classical “proletarian revolutions” in the past.
