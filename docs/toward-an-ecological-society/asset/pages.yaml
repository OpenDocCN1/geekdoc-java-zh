    The most effective steps we can take at our congresses and conferences to assure
    a meaningful future for the antinucle movement and environmental movement broadly
    is to relentlessly foster the development of affinity groups as the bases of our
    alliances and direct action as the bases of our activities. Direct action does
    not merely mean nuclear site occupations; it means learning how to manage every
    aspect of our lives, from producing to organizing, from educating to printing.
