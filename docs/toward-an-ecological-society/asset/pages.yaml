  md: 'business (from childcare to education) on a local level and in an integrated
    way.” In this connection, the Blueprint suggests that men and women should rotate
    the use of their homes for childcare centers. First-aid skills and knowledge of
    more advanced medical techniques should be mobilized on a neighborhood basis.
    Finally, wastes should be collectively recycled to avoid pollution and the destruction
    of recyclable resources.⁷


    The Blueprint advances a refreshingly imaginative program for ruralizing the city
    and fostering the material independence of its inhabitants. It suggests communally
    worked gardens for the cultivation of organic food, even entering into the specifics
    of composting, mulching, and the preparation of seedlings. It proposes the establishment
    of a “People’s Market… which will receive the organic products of rural communes
    and small farmers and distribute them to the neighborhood (food) conspiracies.
    Such a marketplace will have other uses—craftpeople can sell their wares there.”
    The “People’s Market” is visualized as a “solid example of creative thinking about
    communal use of space. Its structure will be portable and will be built in such
    a way to serve neighborhood kids as play equipment on non-market days.”⁸


    The Blueprint leaves no illusion that this ensemble of reconstructive ideas will
    “liberate” Berkeley or other communities. It sees the realization of these concepts
    as the first steps toward reorienting the individual self from a passive acceptance
    of isolation and dependence on bureaucratic institutions to popular initiatives
    that will create communal contacts and face-to-face networks of mutual aid. Ultimately,
    society as a whole will have to be reorganized by the great majority who are now
    forced into hierarchical subservience to the few. Yet until these revolutionary
    changes are achieved, a new state of mind, nourished by working community ties,
    must be fashioned so that people will be able to fuse their deepest personal needs
    with broader social ideals. Unless this fusion is achieved, these very ideals
    will remain abstractions and will not be realized at all.


    Many of the Blueprint’s structural suggestions are not new. The idea of roof openings
    to link houses is obviously borrowed from Pueblo Indian villages, the urban gardens
    from medieval communes and precapitalitalist towns generally, the pedestrian streets
    and plazas from the Renaissance cities and earlier urban forms. What makes the
    plan unique, however, is that it derives its design concepts from radically new
    lifestyles'
