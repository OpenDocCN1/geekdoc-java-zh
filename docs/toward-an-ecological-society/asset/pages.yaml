- pgno: 139
  md: 'Shelter is redesigned to “overcome the fragmentation of our lives. . . to encourage
    communication and break down privatization.” The plan’s authors observe that with
    “women’s liberation, and a new communal morality, the nuclear family is becoming
    obsolete.” Accordingly, floor plans are proposed to allow for larger multipurpose
    rooms that promote interaction, such as communal dining rooms, meeting spaces
    and work areas. Methods are suggested for creating roof openings and converting
    exterior upper walls into communicating links with neighboring houses as well
    as between rooms and upper stories.25


    “All land in Berkeley is treated as a marketable commodity,” observe the young
    planners. “Space is parceled into neat consumer packages. between rows of land
    parcels are transportation ‘corridors’ to keep people flowing from workplace to
    market.” The Blueprint proposes the dismantling of backyard and side yard fences
    to open land as interior parks and gardens. Platform “bridgeweways” between houses
    are suggested to break down strict division between indoor and outdoor. The purpose
    of these suggestions is not merely to restore nature to the urban dweller’s world
    but to open avenues of intimate communication. The plan focuses not merely on
    public plazas and parks but the immediate neighborhoods in which people live their
    daily lives. Indeed, with magnificent insoucience, the plan tosses all considerations
    of private property to the winds by suggesting that vacant lots be appropriated
    by neighborhoods and turned into communal space. 26


    Half the streets of Berkeley, the plan notes, could easily be closed off to stimulate
    collective transportation experiments and reduce traffic congestion in residential
    areas. This would “free ten times more area for public use than we now have in
    park acreage. Intersections could become parks, gardens, plazas, with paving material
    recovered and used to make artificial hills.” The plan recommends that Berkeley
    residents should walk or bicycle to places whenever feasible. If motor vehicles
    must be used, they should be pooled and maintained on a communal basis. People
    should drive together to share common destinations in order to reduce the number
    of vehicles in use and to share the human experience of travel. Community services
    will make a “quantum leap,” observe the planners, when “small groups of neighbors
    mobilize resources and energy in order to cement fragmented neighborhoods back
    together and begin to take care of'
