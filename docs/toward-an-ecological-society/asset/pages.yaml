  md: '# Ecology and Meinel Environmentalism


    The extent to which a designer accepts this multidimensional notion of human scale
    generally tells us whether his or her work can be regarded as qualitatively “new”
    or merely extension of the conventional technical wisdom into new fields of research.


    A considerable amount of research is currently underway in non-nuclear “alternative”
    sources of energy such as solar, wind, and methane installations, in food cultivation,
    and in energy-saving dwellings and communities. From a strictly artifactual standpoint,
    this research is often difficult to distinguish. To cite a few examples: it is
    not unusual to read accounts of the “new technology” that contain fast-and-slow
    comparisons between the Meinel design for monumental “solar farms” and Steve Baer’s
    small, delightfully playful solar-heated “drum wall” house. One finds William
    E. Heronemus’s system for stranging large windmill installations across prairies
    and stretches of ocean juxtaposed with Hans Meyer’s twelve-foot-high wind generator.
    R. Buckminster Fuller’s “Tetrahedral City,” a soaring pyramid structure designed
    to accommodate a million residents may be found together with a description of
    Moshe Saflie’s compact modular “Habitat,” both of which are adduced as evidence
    of “organic” design and structural growth.


    But such sharply contrasting proposals and groups are grouped together because
    they employ similar technical principles or profess adherence to an “organic”
    design concept? The Meinel, Heronemus, and Fuller proposals differ not only in
    their physical dimensions from the installations designed by Baer, Meyer, and
    Safdie; they differ even more significantly in their conceptualization of a human
    habitat, whether this difference is explicitly stated, presupposed, or in Fuller’s
    case, grossly mistated. The habitats that would emerge from the Meinel, Heronemus,
    and Fuller proposals would differ from a New York City, a Chicago, or a Pittsburgh
    primarily by virtue of their capacity to use inexhaustible resources such as solar
    and wind power, and an inexhaustible form of “real estate,” notably the upward
    reaches of space. None of these proposals involves appreciable structural modifications
