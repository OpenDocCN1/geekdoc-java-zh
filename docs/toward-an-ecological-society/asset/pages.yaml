- pgno: 34
  md: '# # The Power to Destroy, The Power to Create


    The power of this society to destroy has reached a scale unprecedented in the
    history of humanity—and this power is being used, almost systematically, to work
    an insate havoc upon the entire world of life and its material bases.


    In nearly every region, air is fouled, waterways polluted, soil washed away, and
    wildlife destroyed. Coastal areas and even the depths of the sea are not immune
    to widespread pollution. More significantly in the long run, basic biological
    cycles such as the carbon cycle and nitrogen cycle, upon which all living things
    (including humans) depend for the maintenance and renewal of life, are being distorted
    to the point of irreversible damage. The proliferation of nuclear reactors in
    the United States and throughout the world have exposed countless millions of
    people to some of the most carcinogenic and mutagenic agents known to life. This
    terrifying menace to the very integrity of life may be with us for hundreds of
    thousands of years. To these radioactive wastes we should add long-lived pesticides,
    lead residues, and thousands of toxic or potentially toxic chemicals in food,
    water, and air; the expansion of cities into vast urban belts, with dense concentrations
    of populations comparable in size to entire nations; the rising din of background
    noise; the stresses created by congestion, mass living, and mass manipulation;
    the immense accumulations of garbage, refuse, sewage, and industrial wastes; the
    congestion of highways and city streets with vehicular traffic; the profligate
    destruction of precious raw materials; the scarring of the earth by real estate
    speculators, mining and lumbering highway construction bureaucrats. This ecological
    list of lethal insults to the biosphere has wreaked a degree of damage in a single
    generation that exceeds the damage inflicted by thousands of years of human habitation
    on this planet. If this tempo of destruction is borne in mind, it is terrifying
    to speculate about what lies ahead in the generations to come.


    The essence of the ecological crisis in our time is that this society—more than
    any other in the past—is literally undoing the work of organic'
  merge: -1
  img_proc: true
- pgno: 35
  md: 'evolution. It is a truism to say that humanity is part of the fabric of life.
    It is perhaps more important at this late stage to emphasize that humanity depends
    critically upon the complexity and variety of life, that human well-being and
    survival rest upon a long evolution of organisms into increasingly complex and
    interdependent forms. The development of life into a complex web, the elaboration
    of primal animals and plants into highly varied forms, has been the precondition
    for the evolution and survival of humanity and nature.


    # The Roots of the Ecological Crisis


    If the past generation has witnessed a despoliation of the planet that exceeds
    all the damage inflicted by earlier generations, little more than a generation
    may remain before the destruction of the environment becomes irreversible. For
    this reason, we must look at the roots of the ecological crisis with ruthless
    honesty. Time is running out and the remaining decades of twentieth century may
    well be the last opportunity we will have to restore the balance between humanity
    and nature.


    Do the roots of the ecological crisis lie in the development of technology? Technology
    has become a convenient target for bypassing the deep-seated social conditions
    that make machines and technological processes harmful.


    How convenient it is to forget that technology has served not only to subvert
    the environment but also to improve it. The Neolithic Revolution, which produced
    the most harmonious period between nature and post-paleolithic humanity, was above
    all a technological revolution. It was this period that brought to humanity the
    arts of agriculture, weaving, pottery, the domestication of animals, the discovery
    of the wheel, and many other key advances. True, there are techniques and technological
    attitudes that are entirely destructive of the balance between humanity and nature.
    Our responsibilities are to separate the promise of technology—its creative potential—from
    the capacity of technology to destroy. Indeed, there is no such word as “Technology”
    that presides over all social conditions and relations; there are different technologies
    and attitudes toward technology, some of which are indispensable to restoring
    the balance, others of which have contributed profoundly to its destruction. What
    humanity needs is a wholesale discarding of advanced technologies, a sifting,
    indeed further development of technology along ecological principles that will'
  merge: -1
  img_proc: true
- pgno: 36
  md: 'contribute to a new harmonization of society and the natural world.


    Do the roots of the ecological crisis lie in population growth? This thesis is
    the most disquieting, and in many ways the most sinister, to be advanced by ecology
    action movements in the United States. Here, an effect called “population growth,”
    juggled around on the basis of superficial statistics and projections, is turned
    into a cause. A problem of secondary proportions at the present time is given
    primacy, obscuring the fundamental reasons for the ecological crisis. True, if
    economic economic political, and social conditions prevail, humanity will in time
    overpopulate the planet and by sheer weight of numbers turn into a pest in its
    own global habitat. There is something obscene, however, about the fact that an
    effect, “population growth,” is given primacy in the ecological crisis by a nation
    that has little more than 7 percent of the world’s population and wastefully devours
    more than 50 percent of the world’s resources.


    We must pause to look more carefully into the population problem, touted so widely
    by the white races of North America and Europe—races that have wanted exploited
    the people of Asia, Africa, Latin America, and the South Pacific. The exploited
    have deliberately advised their exploiters, what they need are not contraceptive
    devices, armed “liberators,” and Prof. Paul R. Ehrlich to resolve their population
    problems; rather, what they need is a fair return on the immense resources that
    wereundered from their lands by North America and Europe. To balance these accounts
    are more of a pressing need at the present time to balance birth rates and death
    rates. The peoples of Asia, Africa, Latin America, and the South Pacific can just
    point out that their American “advisers” have shown the world how to depict a
    virgin continent in less than a century and have added the words “built-in obsolescence”
    to the vocabulary of humanity.


    This much is clear: when large labor reserves were needed during the Industrial
    Revolution of the early nineteenth century to man factories and depress wages,
    population growth was greeted enthusiastically by the new industrial bourgeoisie.
    And the growth of population occurred despite the fact that, owing to long working
    hours and grossly overcrowded cities,-tuberculosis, cholera, and other diseases
    were pandemic in Europe and the United States. If birth rates exceeded death rates
    at this time, it was not because advances in medical care and sanitation had produced
    any dramatic decline in human mortality; rather, the excess of birth rates over
    death'
