  md: 'forces than is afforded by their relatively simple technology, an illusion
    they acquire by group rituals and magical procedures.


    Elaborate as these rituals and procedures may be, however, humanity’s sense of
    dependence on the natural world, indeed, on its immediate environment, never entirely
    disappears. If this sense of dependence may generate fear or an equally object
    reverence, there is also a point in the development of organic society where it
    may generate a sense of symbiosis, more properly, of mutualistic interdependence
    and cooperation, that tends to transcend raw feelings of terror and awe. Here,
    humans not only populate powerful forces or try to manipulate them; their ceremonies
    help (as they see it) in a creative sense: to multiply animals, to bring changes
    in season and weather, to promote the fertility of crops. The organic community
    always has a natural dimension to it part of the balance of nature—a forest community
    or a soil community—in short, a truly ecological community or ecocomunity peculiar
    to its ecosystem, with an active sense of participation in the overall environment
    and the cycles of nature.


    This outlook becomes evident enough when we turn to accounts of people in organic
    communities. Many ceremonies and rituals are characterized not only by social
    functions, such as initiation rites, but also by ecological functions. Among the
    Hopi, for example, the major agricultural ceremonies have the role of summoning
    forth the cycles of the cosmic order, of actualizing the solstices and the different
    stages in the growth of maize from germination. Although the order of the solstices
    and the stages in the growth of maize are known to be predetermination. In contrast
    to strictly magical procedures, Hopi ceremonies assign a participatory rather
    than a manipulatory function to humans. People play a mutualistic role in natural
    cycles: they facilitate the workings of the cosmic order. Their ceremonies are
    part of a complex web of life that extends from the germination of maize to the
    arrival of the solstices. “Every aspect of nature, plants and rocks and animals,
    colors and cardinal directions and numbers and the dead and the living, all have
    a cooperative share in the maintenance of the universal order,” Lee observes.
    “Eventually, the effort of each individual, human or not, goes into this huge
    whole. And here, too, it is every aspect of a person'
  merge: -1
  img_proc: true
- pgno: 57
  md: 'which counts. The entire being of the Hopi individual affects the balance of
    nature; and as each individual develops his inner potential, so he enhances his
    participation, so does the entire universe become invigorated.


    It is not difficult to see that this harmonized view of nature follows from the
    harmonized relations within the early human community. Just as medieval theology
    structured the Christian heaven on feudal lines, so people of all ages have projected
    their social structure onto the natural world. To the Algonquians of the North
    American forests, the beaver in clans and lodges of their own, wisely cooperating
    to promote the well-being of the community. Animals, too, had their “magic,” their
    totem ancestors, and were invigorated by the Manitou, whose spirit nourished the
    entire cosmos. Accordingly, animals had to be reconciled or else they might refuse
    to provide humans with skins and meat. The cooperative spirit thus formed a precondition
    for the survival of the organic community thus entered completely into the outlook
    of preliterate people toward nature and the interplay between the natural world
    and the social.


    The break-up of these unified organic communities, based on a sexual division
    of labor and kinship ties, into hierarchical and finally classes gradually subverted
    the unity of society with the natural world. The division of clans and tribes
    into gerontocracies in which the old began to dominate the young; the emergence
    of the patriarchal family in which women were brought into universal subjugation
