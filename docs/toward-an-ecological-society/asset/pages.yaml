  md: '# An Open Letter to the Ecology Movement


    With the opening of the eighties, the ecology movement in both the United States
    and Europe is faced with a serious crisis. This crisis is literally one of its
    identity and goals, a crisis that painfully challenges the movement''s capacity
    to fulfill its rich promise of advancing alternatives to the domineering sensibility,
    the hierarchical political and economic institutions, and the manipulative strategies
    for social change that have produced the catastrophic split between humanity and
    nature.


    To speak bluntly: the coming decade may well determine whether the ecology movement
    will be reduced to a decorative appendage of an inherently diseased, anti-ecological
    society, a society riddled by an unbridled need for control, domination, and exploitation
    of humanity and nature—or, hopefully, whether the ecology movement will become
    the growing educational arena for a new ecological society based on mutual aid,
    decentralized communities, a people''s technology, and nonhierarchical, libertarian
    relations that will yield not only a new harmony between human and human but between
    humanity and nature.


    Perhaps it may seem presumptive to address himself to a sizable constituency of
    people who have centered their activities around ecological concerns. But my concern
    for the future of the ecology movement is not an impersonal or ephemeral one.
    For nearly thirty years, I have written extensively on our growing ecological
    dislocations. These writings have been reinforced by my activities against the
    growing use of pesticides and food additives as early as 1952, the problem of
    nuclear fallout caused with the first hydrogen bomb test in the Pacific in 1954,
    the radioactive pollution issue that emerged with the Windscale nuclear reactor
    “incident” in 1956, and Con Edison’s attempt to construct the world''s largest
    nuclear reactor in the very heart of New York City in 1963. Since then, I have
    been involved in antinuke alliances such as Clamshell and Shad, not to speak of
    their predecessors Ecology Action East, whose manifesto, The Power to Destroy,
    The Power to Create, I wrote in 1969, and the Citizens Committee on Radiation
    Information, which'
