    But we do not delude ourselves that this life-oriented world can be fully developed
    or even partially achieved in a death-oriented society. American society, as it
    is constituted today, is riddled with racism and aside the entire world, not only
    as a consumer of its wealth and resources, but as an obstacle to all attempts
    at self-determination at home and abroad. Its inherent aims are production for
    the sake of production, the preservation of hierarchy and toil on a world scale,
    mass manipulation and control by centralized, state institutions. This kind of
    society is unalterably counterposed to a life-oriented world. If the ecology movement
    does not direct its main efforts toward a revolution in all areas of life—social
    as well as natural, political as well as economic as as cultural—the movement
    will gradually become the safety valve of the established order.


    It is our hope that groups like our own will spring up throughout the country,
    organized like ourselves on a humanistic, libertarian basis, engaged'
  merge: -1
  img_proc: true
- pgno: 44
  md: 'in mutual action and a spirit of cooperation based on mutual aid. It is our
    hope that they will try to foster a new ecological attitude not only toward nature
    but also toward humans: a conception of spontaneous, variegated relations within
    groups and between groups, within society and between individuals.


    We hope that ecology groups will eschew all appeals to the “heads of government”
    and to international or national state institutions, the very criminals and political
    bodies that have materially contributed to the ecological crisis of our time.
    We believe the appeals must be made to the people and to their capacity for direct
    action that can get them to take control of their own lives and destinies. For
    only in this way can a society emerge without hierarchy and domination, a society
    in which each individual is the master of his or her own fate.


    The great splits that divided human from human, humanity from nature, individual
    from society, town from country, mental from physical activity, from emotion,
    and generation from generation must now be transcended. The fulfillment of the
    age-old quest for survival and material security in a world of scarcity was once
    regarded as the precondition for freedom and a fully human life. To live had to
    survive. As Brecht put it: “First feed the face, then give the moral.” The situation
    has now begun to change. The ecological crisis of our time has increasingly reversed
    this traditional maxim. Today, if we are to survive, we must begin to live. Our
    solutions must be commensurable with the scope of the problem, or else nature
    will take a terrifying revenge on humanity.


    # The Meaning of Direct Action and Affinity Groups


    Today, all ecological movements stand at a crossroad. They are faced with basically
