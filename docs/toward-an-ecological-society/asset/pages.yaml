- pgno: 98
  md: '“workers’ participation” face the challenge of an exploitative technics in
    its sharpest form. Perhaps no more compelling argument has been advanced against
    syndicalist notions of economic organization than the fact that modern technology
    is intrinsically authoritarian. Such arguments, as we shall see, come merely from
    overtly bourgeois ideologues but from seemingly “radical” ones as well. What underpins
    these arguments from all parts of the political spectrum is a shared assumption
    that technics is socially neutral. The functional view that techn is merely the
    instrumental means for humanity’s “metabolism” with nature is broadly accepted
    as given. That factories are the loci of authority is reduced to a “natural fact”—in
    short, a fact beyond the purview of ethics and social consideration.


    Tragically, when ethical values of technics are removed from their historic and
    social context, the functional view tends to prevail—for precisely the same reason
    that the ethical value technology is always a matter of design, a “given” that
    is either efficient or not. Only recently have we begun to see a popular questioning
    of technics as merely “given,” notably with respect to nuclear power installations.
    The notion that even the “peaceful atom” is intrinsically “demonic atom” has become
