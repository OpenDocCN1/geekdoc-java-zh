  img_proc: true
- pgno: 7
  md: 'represents one of the oldest forms of social theory, one that offers both a
    critique of the existing society and a vision for a different world. Today we
    take a dim view of utopia. The word is used in a pejorative or dismissive fashion:
    that’s utopia, it can never happen; it’s cloud cuckoo land. Bookchin understood
    the term in a more profound sense. The word utopia was coined in 1515 by Sir Thomas
    More, a lover of word play, who claimed the word had two roots, both from ancient
    Greece; the first ou-topia, meaning no place, and the second, u-topia, meaning
    the good place. It is the latter from which Bookchin draws inspiration.


    While recognizing the problematic nature of many classic utopias, Bookchin roots
    their shortcomings in their inability to transcend the hierarchical structures
    of the societies in which they were conceived. In other words, they were not utopian
    enough. Rather, all too often they project “what is” into the future, enlarging
    existing social arrangements, perhaps enhanced by the projection of a new technological
    capacity, but never challenging the status quo in basic ways. In Bookchin’s view,
    this approach is analogous to the shallow “futurism” that is the dominant way
    of thinking about the future in our own time.


    In contrast, and in keeping with the handful libertarian utopias that he admires,
    Bookchin approaches the future by asking “what should be?” and, as a dialectical
    thinker, he also crucially asks “what could be?” His vision for an ideal society
    is truly transcendent, but unlike the flights of fantasy that inform so many classical
    utopias, even those that he admires Fourier’s Phalanstery, or William Morris’s
    News from Nowhere, Bookchin’s utopian vision is rooted in real, existing potentialities.
    It is this understanding that makes his vision so powerful. He explores the tension
    between existing hierarchical structures of command and control and the deeply
    desired for freedom that has existed throughout the whole of human history. This
    is a dialectic that he teases out in greater detail in his magnum opus, The Ecology
    of Freedom, published two years after the original publication of this collection.


    While conforming to the patterns established by classical philosophical and literary
    utopias in the sense that he presents a critique of the existing society, his
    critique is more complete than most. In these groundbreaking essays such as “The
    Power to Destroy, The Power to Create,” “Toward an'
  merge: -1
