  md: 'enough to be taken in one view. Only in such a polis would human beings be
    able to realize their humanity, that is to say, to actualize their potentialities
    for rational judgment.


    The Hellenic interpretation of “human” as self-consciousness and self-realization
    in the private sphere of life recurs throughout Western thought from Descartes
    to the contemporary existentialists. A highly individualistic subjectivism is
    the intellectual hallmark of philosophy in the modern era. The Hellenic interpretation
    of “human” as self-activity and self-administration, in the public sphere, however,
    is surprisingly rare. The Protestant sects to be gather together under the ample
    rubric of Puritan Congregationalism seem to have articulated perhaps the earliest
    modern attempts to establish the administrative autonomy of small, decentralized
    groups as opposed to the centralized hierarchies of the Catholic and Anglican
    clergy. In colonial America, the Puritan congregation was to be extended from
    the religious to the political sphere—if, indeed, Puritan ideology established
    any distinction between the two—by vesting considerable civil authority in town
    meetings. The theme is picked up again by Rousseau in his critique of deputized
    power and representative government. His praise of the Greek popular assembly
    based on face-to-face democracy is all the more remarkable if one bears in mind
    that it was written at a high point in the development of the centralized nation-state.
    Finally, the concept of a human habitat as a modern polis acquires its clearest
    coherence and multidimensional in the work of Peter Kropotkin, one of the major
    theorists of nineteenth-century anarch. In Fields, Factories and Workshops, a
    classic that has exercised immense and direct influence since its publication
    as a series of articles in the late 1880s, Kropotkin formulates the most impressive
    case for decentralized communities. His concept of a human habitat is based on
    an ecological integration of town and countryside, a highly flexible technology
    and communications system, a revival of artisanship as a productive form of “aesthetic
    enjoyment,” and direct local democracy freed of the social ills, notably slavery,
    patriarchalism, and class conflict, that subverted Greek democracy.


    The revival of interest in Kropotkin’s work, a revival that has been nourished
    by The New Ecologist in England and by what Victor Farkiss'
