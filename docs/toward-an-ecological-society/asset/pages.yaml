- pgno: 149
  md: 'account, today, of this utterly un-Marxian constellation is to be excessively
    generous toward an ideology that has become the “revolutionary” persona of state
    capitalist reaction. Marxism is exquisitely constructed to obscure these new relationships,
    to distort their meaning, and, where all else fails, to reduce them to this economicistic
    categories.


    The socialist countries and movements, in turn, are no less “socialist” for their
    “distortions” than for their professed “achievements.” Indeed, their “distortions”
    acquire greater significance than their “achievements” because they reveal in
    fashion the ideological apparatus that serves to mystify state capitalism. Hence,
    more than ever, it is necessary that this apparatus be explored, its roots unearthed,
    its logic revealed, and its spirit exorcised from the modern revolutionary project.
    Once drawn into the clear light of critique, it will be seen for what it truly
    is—not “incomplete,” “vulgarized,” or “betrayed” but rather as the historic essence
    of counterrevolution, indeed, of counterrevolution that has more effectively used
    every literary vision against liberation than any historic ideology since Christianity.


    # Marxism and Domination


    Marxism converges with Enlightenment bourgeois ideology at a point where both
    share a scientific conception of reality. What usually eludes many critics of
    Marx’s scientism, however, is the extent to which “scientific socialism” objectifies
    the revolutionary project and thereby deviates it of all ethical content and goals.
    Recent attempts by neo-Marxists to infuse a psychological, cultural, and linguistic
    meaning into Marxism challenge it on its own terms without candidly dealing with
    its innermost nature. Whether consciously or not, they share in the mystifying
    role of Marxism, however use their work be in strictly theoretical terms. In fact,
    as to the matter of scientific methodology, Marx can be read in many ways. His
    famous comparison in the “Preface” to Capital of the physicist who experimentally
    reproduces natural phenomena in his “pure state” to his own choice of England
    as the “locus classicus” of industrial capitalism in his own day obviously reveals
    a scientific bias that is only reinforced by his claim that Capital reveals the
    “natural laws” of “economic movement” in capitalism; indeed, that the work treats
    “the economic formation of society (not only capitalism—M.B.) . . . as a process
    of natural'
  merge: -1
  img_proc: true
- pgno: 150
  md: 'history.” On the other hand, such formulations can be counterbalanced by the
    dialectical character of the Grundisse and of Capital itself, a dialectic that
    probes the internal transformations of capitalist society from an organic and
    immanent standpoint that hardly accords with the physicist’s conception of reality.


    What decisely unites the scientism of physics and the Marxist dialectic, however,
    is the concept of “lawfulness”—the preception that social reality and its trajectory
    can be explained in terms that remove human visions, cultural influences, and
    most significantly, ethical goals from the social process. Indeed, Marx eludes
    the function of the cultural, psychological, and ethical “forces” in terms that
    make them contingent on “laws” that act behind human wills. Human wills, by their
    mutual interaction and obstruction, “cancel” each other out and leave the “economic
    factor” free to determine human affairs. Or to use Engels’s monumental formulation,
    these wills comprise “innumerable intersecting parallelograms of forces which
    give rise to one resultant—the historic event.” Hence, in the long run, “the economic
    ones are ultimately decisive.”[Letter to J. Bloch) It is by no means that Marx,
    who adduced the physicist’s laboratory as a paradigm, would have disagreed with
    Engels’s social geometry. In any case, whether social “laws” are dialectical or
    not is beside the point. The fact is that they constitute a consistently objective
    basis for social development that is uniquely characteristic of the Enlightenment’s
    approach to reality.


    We must weigh the full implications of this turn in what could be called Marx’s
    “theory of knowledge.” Greek thought also had a notion of law, but one that was
    guided more by a concept of “destiny” or moira than “necessity” in the modern
    sense of the term. Moira embodied the concept of “necessity” governed by meaning,
    by an ethically conditioned goal fixed by “destiny.” The actual realization of
    “destiny” was governed by justice or dike which preserved the world order by keeping
    each of the cosmic elements within their appointed bounds. The mythic nature of
    this conception of “law” should not close our eyes to its highly ethical content.
    “Necessity” was not merely compulsion but moral compulsion that had meaning and
    purpose. Insofar human knowledge has a right to assume that the world is an orderly
    one—an assumption that modern science shares with mythic cosmologies only to make
    knowledge possible—it has a right'
  merge: -1
  img_proc: true
- pgno: 151
  md: 'to assume that this order has intelligibility or meaning. It can be translated
    by human thought into a purposive constellation of relations. From the implicit
    concept of a goal that is inherent in any notion of an orderly universe, Greek
    philosophy could claim the right to speak of “justice” and “stife” in the cosmic
    order, of “attraction” and “repulsion,” of “injustice” and “retribution.” Given
    the eventual need for a nature philosophy that will guide us toward a deeper sense
    of ecological insight into our warped relationship with the natural world, we
    are by no means free of a less mythic need to restore this Hellenic sensibility.


    The Enlightenment, by divesting law of ethical content, produced an objective
    cosmos that had without meaning. Laplace, his greatest astronomer, removed not
