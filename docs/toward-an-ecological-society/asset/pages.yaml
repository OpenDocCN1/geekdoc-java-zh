  md: 'issue: the old socialist categories and the new libertarian ones. The result
    that inevitably follows is that the logic of each is warped and its inherent opposition
    to the other is blurred. Marcuse, by wedding Freud to the sixties, muddled the
    meaning of all the partners in these forced alliances. What emerged from works
    like Eros and One-Dimensional Man was a mass of half-truths and gross inconsistencies.
    Characteristically, in Marcuse’s later works, it was Marx who triumphed over Freud,
    socialism that triumphed over anarchism—and Euro-Communism that triumphed over
    everything.


    What is at theoretical probing in Marcuse is easily reduced to pop culture by
    Gorz–with even more telling practical consequences. Strategy for Labour, bycasting
    students and intellectuals as a “new proletariat,” deflected the growing insight
    of sixties’ radicals from cultural movements into classical economic ones, producing
    massive confusion in the American student movement of the time. More than any
    single journalistic work, this book brought Marxism to the Students for a Democratic
    Society, producing the ideological chaos that eventually destroyed it.


    Much the same danger now faces the ecology movement if Gorz’s treatment of the
    subject exercises any appreciable influence. His book Ecology and Freedom (retitled
    Ecology as Politics) is essentially the New Strategy for Labour in ecological
    verbiage. It perpetuates all the incompatibilities of a mythic “libertarian socialism”
    sprinkles anarchist concepts of decentralized organization with Social-Democratic
    concepts of mass political parties and, more ofensensively, “radical ecology”
    with the opportunistic politics of conventional environmentalism. Thus Jerry Brown,
    once governor of California, sits side-by-side with Ho Chi Minh, Fritz Schumacher,
    and Buddha as Inperturbably, Gorz degrades each new concept raised by ecological
    theory and the practice of authentically radical tendencies in the ecological
    movement into his own current variant of Marxist socialism.


    Neither Marx nor ideology emerge untangled from this crude eclecticism. Clarity
    of thought, coherence of views, and, above all, the full logic of one’s radical
    premises are blunted by an ideological dilettantism that leaves every concept
    unfinished, every personalitycast, and every practice'
