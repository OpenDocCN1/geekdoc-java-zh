  md: '# André Gorz Rides Again—or Politics as Environmentalism


    Ecology and the ecological imbalances of our time open a sweeping social horizon
    profoundly challenges every conventional theory in the ideological spectrum. The
    split between humanity and nature; the notion that man can dominate nature, a
    notion that derives from the domination of human by human; the role of the market
    economy in developing technologies that can undo the work of natural evolution
    in only a few generations; the absurdity of dealing with ecosystems and food webs
    in hierarchical terms—all of these issues and tenets raise immense possibilities
    for developing a radical social ecology that transcends orthodox Left ideologies
    at one extreme. A serious theorist would want to explore these issues and would
    want to use them reconstructively to foster the reharmonization of nature with
    humanity and of human, both as fact and sensibility.


    As fact, the attempt to achieve a new harmony between humanity and nature would
    involve an exploration of the uses of ecotechnologies as the technical and creative
    means for recovering humanity’s metabolism with nature in a non-Promethean way.
    I refer to the use of new methods of food cultivation, ecological sources of energy
    (solar, wind, methane, and the like), the integration of craft with “high” technologies,
    fulfilling forms of work or work as play. It would involve an exploration of the
    decentralized, confederal, ecommities and forms of direct democracy that a new
    society would seek to create. For sensibility, the attempt to achieve a new harmony
    between humanity and nature would involve an exploration that opens the fascinating
    discussion of a nature philosophy as the basis for a new ethics, feminism as the
    basis for a new sensibility, and of the commune as the new form of human interaction
    and the arena for self-development.


    The ecological project conceived as a project of a radical social ecology would
    thereby provide the bases for a rich critique of prevailing ideologies—bourgeois
    and socialist alike—that would transcend the traditional'
  merge: -1
  img_proc: true
- pgno: 197
  md: '“radical” critiques of political economy. It would open the way for a discussion
    of new forms of organization (for example, the affinity group), new forms of struggle
    (direct action, conceived as the praxis of self-management, not merely the occupation
    of nuclear power-plant sites), new forms of citizenship (self-activity, viewed
    as forms of self-realization). The ecological project, so conceived, would provide
    the social gymnasium for shedding the sense of powerlessness that threatens to
    reduce the public sphere to a bureaucratized substitute for all forms of human
    consociation.


    Critique and practice would merge to form a coherent and consistently revolutionary
    perspective. This perspective would open a thoroughly radical critique of crucial
    problems such as patriarchalism, urban decay, corporate power, hierarchy, domination,
    pollution, technocratic manipulation—indeed, a multitude of issues that acquire
    meaning and authenticity—in the light of a libertarian, anarchist, interpretation
    of social ecology. Most precious of all to such a theorist would be the coherence
    and revolutionary consistency one would be expected to attain as a result of the
    theoretical and practical possibilities opened by a radical social ecology, particularly
    one that has a revolutionary anarchist focus.


    Given these sweeping implications, André Gorz’s Ecology as Politics turns out
    to be a very disappointing book—indeed, a highly disorienting one. Apart from
    the ideas Gorz pilfers quite freely from the works of anarchist theorists of the
    past and of the American New Left, the book contains very little new or interesting.
    It was to hoped that French readers, at least, would have acquired a fuller knowledge
    of these ideas in their original form, with emendations and possibly newer interpretations
    by Gorz. But Gorz is content not only to repeat them (with minimal or no acknowledgment)
    in a cursory, oft tattered fashion. He does substantially worse: he debases and
    divests them of their roots, of their coherence, of their internal logic and their
    revolutionary thrust. Ecology as Politics is not only an intellectual pastiche
    of ideas whose theoretical pedigree is as well as bad politics, often written
    in bad faith with respect to the real traditions which Gorz leans.


    What makes Gorz’s book particularly distasteful is its attempt to refurbish an
    orthodox econometric Marxism with a new ecological anarchism.'
