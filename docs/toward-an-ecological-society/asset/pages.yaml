    has been written about the extent to which ecologically minded young people began
    to subject city planning to a devastating critique, often advancing alternative
    proposals to dehumanizing urban “revitalization” and “rehabilitation” projects.
    Generally, these alternatives stemmed from a perspective toward design that was
    radically different from that of conventional city planners. The countercultural
