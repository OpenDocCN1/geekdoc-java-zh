  md: '# Foreword


    # The Utopian Vision of Murray Bookchin

    by Dan Chodorkoff


    In this collection of essays, written between 1969 and 1980 and first published
    in collected form in 1980, we encounter Murray Bookchin in a fascinating stage
    in the development of his ideas.


    Still enticed by the unfulfilled promise of the counterculture of the 1960s and
    deeply critical of the Marxist ideology that he embraced in his youth, this work
    was his attempt to reclaim a revolutionary critique of social life, and to posit
    a reconstructive vision for a truly ecological society.


    It is an expression of his dialectical synthesis at its most profound. He recognized
    the very clear limitations of both the existing society and the shortcomings of
    the critique offered by traditional Marxist and neo-Marxist theorists. At the
    same time, he teased out the potentialities for transcending both, which he identified
    in the counterculture, alternative technologies, feminism, ecology, and the range
    of liberation movements bubbling around him. The combination of critical analysis
    and reconstructive vision offered in this work uniquely situates Bookchin in contemporary
    social vision, insisting on a praxis that moved beyond the sterile critiques offered
    by academic “radicals” and the uninformed strategies and tactics that characterized
    most of the activists he encountered.


    Here Bookchin flew in the face of conventional thinking, as he did his whole life,
    even in the radical circles in which he traveled. He began his revolutionary journey
    with the Young Pioneers but broke with the party after the Hitler-Stalin Pact.
    He then turned to Trotskyism but drifted away from that ideology in the late 1940s
    to take inspiration from anarchism, with which he primarily identified at the
    time these essays were published. (It should be noted that he later rejected anarchism,
    which he felt had adopted an overemphasis on individualism and was straying from
    the deeply anticapitalist principles and praxis that informed Bookchin would later'
  merge: -1
  img_proc: true
- pgno: 6
  md: 'call Communalism.) This restless political and intellectual journey was one
    pursued until his death in 2006. Throughout it all he never abandoned his commitment
    to his revolutionary ideal.


    And make no mistake, Bookchin was a true revolutionary, calling for the termination
    of the state and capitalism and, beyond that, the transformation of everyday life
    through the elimination of all forms of hierarchy and domination. He demanded
    transcendence of the given in relations between men and women, whites and people
    of color, youth and elders, as well as the transformation of family structures,
    attitudes toward sexuality, art the role of work, our inner psychology, the structures
    of our communities, our relationship to technics and our attitudes toward nature,
    seeking a qualitatively different future. He was the first person to make the
    connection between ecology and revolutionary thought, identifying the ecological
    imperative that capitalism, the state, and Marxism were all equally incapable
    of addressing, and finding in his studies of ecology both a process and a set
    of ethics that he used as the basis of his revolutionary vision, which he called
    social ecology.


    This work also reveals the wide-ranging nature of his thinking, challenging the
    structures of an academy that increasingly demands specialization and all too
    often shrinks the focus of research to minutia. Bookchin worked on a grand scale,
    synthesizing history, philosophy, anthropology, urban studies, evolution, biology,
    and ecology to create a holistic view of human development and human potentiality,
    perhaps more akin to the great minds of nineteenth century theory like Marx and
    Kropkin the anemic scholarship of our day. His thinking was holistic, and in that
    sense ecology, and further, he stands with Marx in the sense that his goal was
    not only to understand the world, but to transform it. In the pages that follow,
    the reader will find essays that explore eco-technologies, ecocommunities, urban
    planning, the ecology movement, forms of freedom, critiques of Marxism and a range
    of Marxists, politics, self-management, the role of spontaneity, and utopia. What
    ties them all together is his unerring commitment to explicating a theory of revolution
    that could transform our society by transcending the given to create a new world
    rooted in the reharmonization of society and nature—a truly ecological society.


    Murray Bookchin was unabashedly utopian. The utopian tradition'
