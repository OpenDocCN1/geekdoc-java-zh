- pgno: 14
  md: 'It is this grounding of his utopia in nature itself that sets his inspiration
    apart from that of classic utopian thinkers, and ultimately forms the basis for
    his definition of an ecological society. In his view, we must transform these
    natural tendencies into an ethical framework that we apply in human society. And
    that framework must be developed through a directly democratic process to become
    actualized in “the good place.”


    It will be apparent to any reader of this collection Murray Bookchin was a prophetic
    voice. Many of these essays were written half a century ago, yet his observations
    about ecological destruction, technological advancements untoed moral considerations,
    and the need for a coherent left politics, have never been more relevant today.
    It is striking that Bookchin anticipated the global ecological crisis and what
    we needed to do it decades ago, for example, of global warming in his 1964 essay
    “Ecology and Revolutionary Thought,” fifty years before it became accepted wisdom.
    He recognized the need for ecological technologies like solar power and wind energy
    long before such approaches entered the mainstream He identified the need to create
    a truly ecological society to insure humanity’s continued survival on the planet.
    He called for the creation of a new revolutionary outlook which was nonhierarchical
    and directly democratic in order to bring that society into being.


    Murray Bookchin’s legacy looms large. He warned us of the perilous path we were
    reading, the ecological and social crisis that we faced if we did not heed his
    warnings. But he was not a modern-day Cassandra, prophesying environmental doom
    without a way out. While Bookchin was prescient in his understanding of the ecological
    crisis, his greatest contribution was his elaboration of an elegant solution:
    one that showed how the rejection of domination and hierarchy could allow to realize
    our unique potential as human beings, collectively rescuing our society and our
    planet.


    Bookchin’s utopian ideas resonate with even greater power today. To the utopian
    slogan of the French university students of 1968, who demanded: “Be realistic,
    demand the impossible!” he added the urgent appeal—now more salient than ever—“If
    we do not do the impossible, we will be faced with the unthinkable"'
