  md: 'must be wedded to natural history. Perhaps these are no longer the brave words
    they seemed to be when I advanced them back in 1964 in “Ecology and Revolutionary
    Thought,” but their implications have not been fully developed by the so-called
    radical movement today. The separation of humanity from nature, its sweeping social
    trajectory into a history that produced a rich wealth of mind, personality, technical
    insight, culture, and self-reflective thought, marks the potential for mind in
    nature itself, the latent spirit in substance that comes to consciousness in a
    humanity that melds with the natural world. The time comes to integrate an ecological
    natural philosophy with an ecological social philosophy based on freedom and consciousness,
    a goal that has haunted Western philosophy from the pre-Socratics onward.


    Doubtless, the practical implications of this goal are paramount. If we are to
    survive ecological catastrophe, we must decentralize, restore bioregional forms
    of production and food cultivation, diversify our technologies, scale them to
    human dimensions, and establish face-to-face forms of democracy. On this score,
    I agree with innumerable environmentalists as Barry Common argues a bit belatedly,
    for decentralization and “appropriate” technologies on grounds of pragmatism and
    efficiency. My concerns go much further. I am occupied with the value of alternate
    technologies not only because they are more efficient and rest on renewable resources;
    I am even more concerned with their capacity to restore humanity’s contact with
    soil, plant, animal life, sun and wind, in short, fostering a new sensitivity
    toward the biosphere. I am equally concerned with the individual’s capacity to
    understand the operations of these new technologies so that personality itself
    can be enriched by a sense of self-assurance and autonomy over the material aspects
    of life. Hence my emphasis on simpler forms—“passive” forms, to use the vernacular
    of alternate technology—of solar collectors, wind machines, organic gardens, and
    the like. By the same token, I am occupied with decentralization not only because
    it renders these technologies more feasible and more adaptable to the bioregions
    in which they are employed; I am even more concerned with decentralization as
    a means of restoring power to local communities and to the individual, to give
    genuine meaning to the libertarian vision of freedom as a system of direct democracy.
    Small, in my view, is not merely “beautiful”; it is also ecological, humanistic,
