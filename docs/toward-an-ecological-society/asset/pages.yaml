  img_proc: true
- pgno: 54
  md: 'The very notion of domination itself is not brought into question. Ecology,
    I would claim, advances a broader conception of nature and of humanity’s relationship
    with the natural world. To my thinking, it sees the balance and integrity of the
    biosphere as an end in itself. Natural diversity is to be cultivated not only
    because the more diversified components that make up an ecosystem, the more stable
    the ecosystem, but diversity is desirable for its own sake, a value to be cherished
    as part of a spiritualized notion of the living universe. Ecologists have already
    pointed out that the more simplified an ecosystem—as arctic and desert biomes
    or in monocultural forms of food cultivation—the more fragile the ecosystem and
    more prone to instability, pest infestations, and possible catastrophes. The holistic
    concept of “unity in diversity,” so common in the more reflective ecological writings,
    could be taken from Hegel’s works, an intellectual convergence that I do not regard
    as accidental and that deserves serious exploration by contemporary neo-Hegelians.
    Ecology, furthermore, advances the view that humanity must show a conscious respect
    for the spontaneity of the natural world, a world that is much too complex and
    variegated to be reduced to simple Galilean mechanomechanical properties. Some
    ecologists notwithstanding, I would hold with Charles Elton’s view that, “The
    world’s future has to be managed, but this management would not be like a game
    of chess . . . (but) more like steering a boat.” The natural world must be allowed
    the considerable leeway of a spontaneous development—informed, to be sure, by
    human consciousness and nature rendered self-conscious and selfactive—to unfold
    and realize its wealth of potentialities. Finally, ecology recognizes no hierarchy
    on the level of the ecosystem. There are no “kings of the beasts” and no “lowly
    ants.” These notions are the projections of our own social attitudes and relationships
    on the natural world. Virtually all that lives as part of the floral and faunal
    variety of an ecosystem plays its coequal role in maintaining the balance and
    integrity of the whole.


    These concepts, brought together in a totality that could be expressed as unity
    in diversity, spontaneity, and complementarity, comprise not only a judgment that
    derives from an “artful science” or “scientific art” (as I have described ecology
    elsewhere); they also constitute an overall sensibility that we are slowly recovering
    from a archaic archaic and placing it in a new social context. The notion that
    man is destined to dominate nature'
