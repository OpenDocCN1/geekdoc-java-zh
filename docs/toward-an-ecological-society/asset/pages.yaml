- pgno: 53
  md: 'Far from adhering to the claim that many environmentalist demands are too “radical,”
    I would argue that they are not radical enough. Confronted by a society that is
    not only polluting the planet on a scale unprecedented in history but undermining
    its most fundamental geochemical cycles, I would argue that environmentalists
    have not posed the strategic problems of establishing a new and lasting equilibrium
    with nature. Is it enough to stop a nuclear plant here or a highway there? We
    have missed the essential fact that environmental degradation stems from much
    deeper sources than the blunders or ill intentions of industry and government?
    To sermonize endlessly about the possibility of environmental apocalypse—whether
    as a result of pollution, industrial expansion, population growth—inadvertently
    drops a veil over a more fundamental crisis in the human condition, one that is
    not exclusively technological or ethical but profoundly social? Rather than deal
    again with the scale of our environmental crisis or engage in the easy denunciation
    that “pollution is profitable,” or argue that some abstract “we” is responsible
    for producing too many children or a industry for producing many commodities,
    I would like to ask if the environmental crisis does not have its roots in the
    constitution of society as we know it today, if the changes that are needed to
    create a new equilibrium between the natural world and the social do not require
    a fundamental, indeed revolutionary, reconstitution of society along ecological
    lines.


    I would like to emphasize the words “ecological lines.” In trying to deal with
    the problems of an ecological society, the term “environmentalism” fails us. “Environmentalism”
    tends increasingly to reflect an instrumentalist sensibility in which nature is
    viewed merely as a passive habitat, an agglomeration of external objects and forces,
    that must be made more serviceable for human use irrespective of what these uses
    may be. “Environmentalism,” in effect, deals with “natural resources,” “urban
    resources,” even “human resources.” Mr. Nixon, I would suppose, is an “environmentalist”
    of sorts insofar as the “peace” he would establish with nature consists of acquiring
    the “know-how” for plundering the natural world with minimal disruption of the
    habitat. “Environmentalism” does not bring into question the underlying notion
    of the present society that must dominate nature; rather, it seeks to facilitate
    that domination by developing techniques for diminishing the hazards caused by
    domination.'
