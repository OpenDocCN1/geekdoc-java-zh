  md: '# Self-Management and the New Technology


    Self-management values in all its rich and varied meanings has always been closely
    wedded to technical developments—often to an extent that has not not received
    the explicit attention it deserves. By emphasizing the association between the
    two, I do not mean to advance a crude, reductionist theory of technological determinism.
    People are completely social beings. They develop values, institutions, and cultural
    relationships that either foster or inhibit the evolution of technics. Need hardly
    be emphasized that basic technical inventions such as the steam engine, so vital
    to capitalist society, indeed to early industrial society, were known to the Hellenistic
    world more than two millennia ago. That this major source of power was never used
    as more than a playing attests to the enormous hoard of ancient values and culture
    on the evolution of technics generally and specifically on eras that were not
    assimilated to a market-oriented rationality.


    But it would be crude and in its own way reductionist to deny the extent to which
    technics, once in one form or another, contributes to humanity’s definitions and
    interpretations of selfmanagement. This is evident today when self-management
    is conceived primarily in economic terms such as “workers’ control,” “industrial
    democracy,” “workers participation,” indeed, as radical anarchosyndicalist demands
    for “economic collectivization.” The fact that this unadorned economic interpretation
    of self-management has preempted other interpretations of the term, notably forms
    reminiscent of the municipal confederations of medieval society, the French revolutionary
    sections of 1793, and the Paris Commune, will be discussed later. This is clear:
    when we speak of “self-management,” today, we usually mean one or another form
    of syndism. We mean an economic formation that involves the way in which labor
    is organized, tools and machines deployed, and material resources rationally allocated.
    In short, we mean technics.


    Once we bring technics into the situation, however, we open the way to a number
    of paradoxes that cannot be dismissed by bellicose rhetoric and moral platitudes.
    If the role of technics in shaping society and thinking has'
  merge: -1
  img_proc: true
- pgno: 97
  md: 'often been overstated by writers as disparate in their social views as Marshall
    McLuhan and Jacques Ellul, its influence in forming social institutions and cultural
    attitudes cannot be dismissed. The highly economic meaning we so often impart
    of the term “self-management” is itself damning evidence of the extent to which
    industrial society “industrializes” the meaning to terms. The words “self-management”
    become intellectually dissociated into their components and ideologically opposed
    to each other. “Management” tends to preempt “self”; administration tends to assume
    sovereignty over individual autonomy. Owing to the influence of technocratic values
    over thinking, self-hood—so crucial to the meaning of libertarian management in
    all aspects of life—is subtly displaced by the virtues of efficient administrative
    strategies. Accordingly, “self-management” is increasingly promoted for functional
    rather than literary reasons, even by the most committed syndicalists. We are
    urged to think that “small is beautiful” because it yields the conservation of
    “energy” rather than a human scale that renders society comprehensible and controllable
    by all. Self-activity and self-management are seen as aspects of industrial logistics
    that resolve economic and technical problems rather than moral and social ones.
    Thus the very technocratic society that denies selfhood to humanity establishes
    the terms of discourse for those who wish to replace it by a libertarian one.
    It reaches into the sensibility of its most radical opponents by establishing
    the parameters for their critique and practice, in short, by “industrializing”
    syndicalism.


    No less paradoxical is the limited nature of “self-management” itself when it
    leaves its technical premises unquestioned. We can comfortably assume that collectivized
    enterprises controlled by workers have changed the social, cultural, and intellectual
    status of workers to a decisive degree? Do factories, mines, and large-scale agricultural
    enterprises become domains of freedom whose operations are now managed—however
    anarchastically by workers’ collectives? By eliminating economic exploitation
    we have actually eliminated social domination? By removing class rule have removed
    hierarchical rule? To state the bluntly: present-day technics remain substantially
    the way it is while the men and women who operate it are expected to undergo significant
    transformation as human beings?


    Here, notions such as “workers’ control,” “industrial democracy,” and'
