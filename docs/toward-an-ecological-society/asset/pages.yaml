- pgno: 198
  md: 'Almost every page sounds a false note. To critically review a volume of some
    200 pages with the detail that it requires would yield a work or three times the
    size of the original. To illustrate the magnitude of the problem, let us closely
    examine Gorz’s “Introduction,” which presumably presents the theoretical basis
    of the book. Although this “Introduction” is scarcely more than seven printed
    pages, the piece acquires particular interest when one looks beyond its pretension
    to sweep and scope. What lies under the carpet of Gorz’s theoretical ponderosity
    is an appalling amount of intellectual confusion—and an interesting glimpse of
    Gorz’s methodology, notably the sectarian Marxian orthodoxy that always subverts
    the author’s sense of “vision” and “discovery.”


    From the outset, the introduction begins to crumble into semantic confusion. Its
    purpose is to distinguish “Two Kinds of Ecology” (this is the actual subtitle
    of the “Introduction”). But as actually turns out, Gorz is really concerned with
    two kinds of politics. To the ecologist who can use a viable politics, this might
    be a laudable endeavor if Gorz were intent on discussing politics as ecology,
    that is, to determine how politics can be developed in ecological terms. But actually,
    this is not Gorz’s claim. He is trying to tell us about ecology *itself* as it
    relates to social questions—to explore its special qualities and how they interface
    with society. And it is precisely that the book begins to fall apart, for it becomes
    apparent that André Gorz knows very little about ecology, or, more precisely,
    “ecological thinking” as he puts it. There are in fact two different kinds of
    “ecology”—notably, ecology and environmentalism—but Gorz is basically oblivious
    to the difference. When Gorz speaks of “Two Kinds of Ecology” he is actually talking
    about two kinds of politics and his own. That ecology has very little to do with
    the distinction he means to develop evident when, scarcely a few lines into the
    “Introduction,” we are somewhat advised that “Ecological thinking still has many
    opponents in the (corporate) board rooms, but it already has enough converts in
    the ruling elite to ensure its eventual acceptance by major institutions of modern
    capitalism,” (My emphasis—M.B.)


    While loose formulations of this kind might have been tolerable years ago, they
    become totally obfuscatory today. To describe the kind of environmentalistic thinking
    that goes on in corporate “boardrooms” as “ecological” is to set back the clock
    of ecological thinking and the'
  merge: -1
  img_proc: true
- pgno: 199
  md: 'ecological movement historically. The attempt to rescue the term “ecology”
    from “boardrooms” and from writers like Gorz has been long in the making. Ecology,
    particularly conceived as social ecology, contains very radical philosophical
    and cultural implications. These center around the nonhierarchical nature of ecosystems
    and the importance of diversity as a function of biotic stability. Extended to
    society, they suggest the need for nonhierarchical social relations and a nonhierarchical
    sensibility to achieve a truly harmonious balance with and between people. What
    Gorz means by “ecological thinking” in the “boardrooms” is in fact what should
    properly be called “environmentalism,” the largely technocratic stratagens for
    manipulating nature. Taken as an academic discipline, “environmentalism” is essentially
    an instrumental body of techniques that the Massachusetts Institute of Technology
    once taught as “sanitary engineering.” Like Barry Commoner, who consciously eschews
    the word “ecology” for “environmentalism,” Gorz is mindful that he is advancing
    a politics that is environmentally oriented, not an ecological sensibility that
    is meant to yield a political orientation. To distinguish environmentalism and
    to explore the social thrust of ecological thinking as distinguished from the
    merely technical strategies of environmental thinking would actually compel Gorz
    to confront the serious challenges of a radical social ecology—notably, socialist
    “thinking.” For the real conflict that faces the Left so far as society and the
    natural world is concerned is not between a specific form of bourgeois “ecology”
    and social politics but between a libertarian form of social ecology and an econometric,
    technologically oriented form of socialism—in short, Marxism. And this, as we
    shall see, is it not André Gorz seriously intends to do. Ecology, in effect, is
    reduced to environmentalism all the more to spuriously fuse “thinking” with the
    ecological issues of our time.


    Accordingly, Gorz proceeds to underpin his own environmentalist “thinking” by
    asserting that capitalism, from being faced with an ecological impasse that can
    tear down the entire biosphere, can actually “assimilate ecological necessities
    as technical constraints and adapt the conditions of exploitation to them.” Ironically,
    this formulation is not only “sanitary engineering” with a vengeance; it is even
    bad Marxism. If any serious ecological conclusion is to be drawn from Capital,
    vol. 1, it is from'
  merge: -1
  img_proc: true
- pgno: 200
  md: 'Marx’s compelling demonstration that the very law of life of capitalist competition,
    of the fully developed market economy, is based on the maxim, “grow or die.” Translated
    into ecological terms, this clearly means that a fully developed market economy
    must relentlessly exploit nature to a point (even Marx could not foresee) that
    is literally regressive geologically and biologically. Capitalism, in effect,
    is not only polluting the world on a historically unprecedented scale; it is simplifying
    all the ecosystems of the planet, turning soil into sand, the oceans into lifeless
    sewers, indeed, threatening the very integrity of our sources of atmospheric oxygen.
    If one were to follow the logic of this tendency to its very end, capitalist—and
    hierarchical—society is utterly incompatible with a viable biosphere. What limits
    the ecological validity of Marx’s view is obviously not his revelation of capitalism’s
    “law of life” but rather the “progressive role he imparts to capitalism’s “success”
    in supposedly achieving the technical domination of nature. This Janus-faced aspect
    of Marx’s writings is what thwarts them in conflict with an authentic ecological
    sensibility. Gorz, by contrast, sidesteps exactly what we most in the contradictory
    position of Marx, namely, that the very technical achievements of capitalism,
    far from assimilating “ecological necessities as technical restraints,” are governed
    by a “law of life” that technologically lacks any form of “restraint.”


    Having twisted himself into a pretzel, Gorz proceeds to raise a hammering demand:
    “Reform or revolution?” Shall we have “one” kind of “ecology,” a reformist one
    resolves our disequilibrium with nature by means of technology? Or shall we have
    another kind of “ecology” that resolves our disequilibrium by means of revolution?
    As it turns out, fiery demands are mere preamble. If Gorz is correct and capitalism
    can adapt to “ecological necessities” merely by developing pollution-controlling
    devices (and this is what Gorz means by “technical restraints”), why not have
    a series of nice, orderly reforms instead of a mass, possibly bloody revolution?


    It is at this point that the seemingly “semantic” distinction between ecology
    and environmentalism acquires considerable significance. If, as I personally suspect,
    Barry Commoner is really a closet Euro-Communist who, at heart, is committed to
    centralized economic planning, he prefers to designate himself as an environmentalist
    rather than an ecologist.'
