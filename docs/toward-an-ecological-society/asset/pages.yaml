    The ecology movement, even more than the feminist and community movements, thrives
    in this highly charged, often contrived ambience of opposition. “Antinuke” groups
    and alliances rise and fall at a metabolic rate that excludes serious reflection
    on their methods and goals. To “Stop Nukes” has far-reaching social implications
    that go beyond the problems of adequate energy resources and radioactive pollution.
    The demand poses such questions as how we try to “Stop Nukes”—by direct action
    or political action? How should we organize “Stop Nukes”—by decentralized forms
    of autonomous affinity groups or national mobilizations? What will replace nukes—high-technology
    solar installations managed by conventional power utilities or simple, often handcrafted
    popular technologies that can be constructed and managed by a moderate-sized community?
    These questions alone, not to speak of innumerable issues that range around notions
    of the communal ownership and management of society’s resources, nonhierarchical
    structures of social organization, and changes in human sensibility, reach far
    beyond the limited issue of nuclear power. “No Nukes is not enough —at least if
    we wish to remove the deep-seated social forces that produced nuclear power in
    the first place.


    “Managerial radicalism” fosters a preoccupation with method rather than an exploration
    of goals. It is noteworthy that surprisingly few leaders of the antique movement
