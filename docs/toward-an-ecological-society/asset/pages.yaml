- pgno: 10
  md: 'Bookchin saw changes in consciousness already underway in the counterculture
    that was experimenting with new, nonhierarchical forms of liberation and self-management
    through organizational forms such as communes and affinity groups. In his view
    at that time they were expanding the realm of freedom to include personal autonomy,
    sexual liberation, the rejection of commodity culture, the application of mutual
    aid, the rejection of the work ethic, and more. For him they represented a new
    Enlightenment, an attempt to change hierarchical consciousness in a struggle for
    the unconscious. He saw them as a living, flourished expression of the utopian
    ideals he put forth.


    The principles that informed his utopian ideals grew out of his critique of existing
    institutions. In opposition to the gigantism and grow-or-die ethos of capitalism,
    he called for a human scale. He countered the notion of ecocommunities to the
    growing megalopolis that was displacing the traditional city. He insisted that
    ecotechnologies like solar, wind, and hydropower combined in a mosaic, and tailored
    to the particular environments in which they were deployed, could replace huge
    centralized fossil fuel and nuclear power facilities. He saw the need for local,
    decentralized forms of organic food production to replace large scale agribusiness.
    And he called for artisanal forms of manufacturing to replace giant factories.


    For Bookchin, decentralization was not only a way of creating more ecologically
    sound means to meet humanity''s needs, it also provided a basis for community
    control over crucial resources: a way to displace the hierarchical forms of command
    and control exerted by capitalism over crucial resources. It would allow communities
    to reclaim the very basis for their existence and give them power to decide, through
    directly democratic means, how the production and distribution of those resources
    were organized. In addition, a human scale would allow for the dissolution of
    bureaucracy and the reestablishment of primary ties—intersubjective relationships
    between people—as the basis of social life. He saw it as a precondition for the
    empowerment of people to participate actively in decisions that have a direct
    effect on their lives, and a critical step in the creation of an active citizenry.


    While calling for decentralization, Bookchin also recognized that certain aspects
    of an economy, like transportation and communications, would'
