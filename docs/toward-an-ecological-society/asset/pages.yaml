  md: '# Acknowledgments


    Apart from the “Introduction” and “Conclusion,” the essays in this book have appeared
    previously in the periodical literature—although several very important ones are
    published for the first time in their complete and unedited form. “Toward an Ecological
    Society” first appeared in WIN; “An Open Letter to the Ecology Movement” in Rain;
    the “Myth of City Planning” and “Spontaneity and Organization” in Liberation;
    “The Concept of Ecotchnologies and Eocommunities” in Habitat International (Pergamon
    Press); “Marxism as Bourgeois Sociology” in Comment; and “Self-Management and
    the New Technology” and an abridged version of “On Neo-Marxism, Bureaucracy and
    the Body Politic” called “Beyond Neo-Marxism, Bureau-Marxism” in Telos. Also published
    in Telos was my review of André Gorz’s book on ecology and politics. To all of
    these periodicals I would like to express my appreciation for permission to republish
    the aforementioned works. I owe a special debt of gratitude to Paul Piccone and
    Paul Breines for their independence of mind in publishing some of my most controversial
    articles on Marxism in the journal Telos, which has been associated with a neo-Marxian
    orientation.'
