- pgno: 37
  md: 'can be explained by the destruction of pre-industrial family farms, village
    institutions, mutual aid, and stable, traditional patterns of life at the hands
    of capitalist “enterprise.” The decline in social morale ushered in by the horrors
    of the factory system, the degradation of traditional agrarian peoples into grossly
    exploited proletarians and urban dwellers, produced a concomitantly irresponsible
    attitude toward the family and the beforgetting of children. Sexuality became
    a refuge for a life of toil on the same order as the consumption of cheap gin;
    the new proletariat reproduced children, many of whom were never destined to survive
    into adulthood, mindlessly as it drifted into Alcoholism. Much the same process
