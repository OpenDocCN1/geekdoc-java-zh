- pgno: 138
  md: 'radically new social alternatives that were already being practiced as subcultures
    in many communities throughout the country. To use an expression that was very
    much in the air: the attempt was made to replace hierarchical space by liberated
    space.


    Among the many plans of this kind to be developed in the late sixties and early
    seventies, perhaps the most impressive was formulated in Berkeley an ad hoc group
    from People''s Architecture, the local Tenant''s Union, and members of the local
    food cooperative. The plan shows a remarkably high degree of radical social consciousness.
    It draws its inspiration from the “People’s Park” episode in May 1969, when dropout
    youth, students, and later ordinary citizens of Berkeley fought with police for
    more than a week to retain a local park and playground that they had spontaneously
    created out of a neglected, garbage-strewn lot owned by the University of California.
    The park, eventually reclaimed by its university proprietors at the cost of a
    young man’s life, many severe injuries, and massive arrests, is that the memory
    of the episode has faded slowly. To the young Berkeley planners, “People’s Park
    was the beginning of the Revolutionary Ecology Movement”—a movement, unfortunately,
    that has yet to live up to these high hopes. The thrust of the plan, entitled
    Blueprint for a Communal Environment, is radically countercultural. “The revolutionary
    culture,” declare the writers of the Blueprint, “gives us new communal, eco-viable
    ways of organizing our lives, while people’s politics gives us the means to resist
    the system.”²³The Blueprint is a project not only for reconstruction but also
    for struggle on a wide social terrain against the established order.


    This document of the Berkeley planners aims at more than the structural redesigning
    of an existing community; it avows and explores a new way of life at this most
    elementary level of human intercourse. The new way of life is communal and seeks
    as much as possible to divorce itself from commodity relationships. The goal of
    the design is “Communal ways of organizing our lives (to) help to cut down on
    consumption, provide for basic human needs more efficiently, to resist the system,
    to support ourselves and overcome the misery of atomized living.” The social and
    private are thoroughly fused in this one sentence. Design gives expression to
    a new lifestyle that stands opposed to the repressive organization of society.”²⁴'
