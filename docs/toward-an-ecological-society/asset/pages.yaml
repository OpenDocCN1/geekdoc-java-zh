  md: 'municipal bureaucrats wear their identities on their sleeves. They can be singled
    out, disputed, and removed from their positions of authority. The central conflict
    confronting the ecology, feminist, and community movements lives within the movements
    themselves. Here, the problem they face is the need to discover the sweeping implications
    of the issues they raise: the achievement of a totally new, nonhierarchical society
    in which the domination of nature by man, of woman by man, and of society by the
    state is completely abolished—technologically, institutionally, culturally, and
    in the very rationality and sensibilities of the individual.


    The socialist movement never raised these issues clearly in the century that it
    flourished between 1840 and 1940. Its primary concerns were economic and turned
    on the abolition of wage labor and capital, of economic classes and material exploitation.


    That these concerns remain with us to this day hardly be emphasized and their
    resolution must be achieved if freedom is to have any substantive meaning. But
    there can be a decidedly classless, even nonexploitative society in the economic
    sense that preserves hierarchical rule and domination in the social sense—whether
    they take the form of the patriarchal family, domination by age and ethnic groups,
    bureaucratic institutions, ideological manipulation, or a pyramidal division of
    labor. The successive layers of the hierarchical pyramid may confer no privileges
    whatever on who command and no material renunciation by those who obey; indeed,
    the ideological tradition of domination that associates “order” with hierarchy,
    the psychic privileges that confer status, the historical inertia that carries
    the traditional forms and sensibilities of the past into the present and future—all
    of these may preserve hierarchy even after classes have been abolished. Yet classless
    or not, society would be riddled by domination and, with domination, a general
    condition of command and obedience, of unfreedom and humiliation, and perhaps
    most decisively, an abortion of each individual’s potentiality for consciousness,
    reason, selfishness, creativity, and the right to assert full control over or
    his daily life.¹


    The ecology, feminist, and community movements implicitly challenge this warped
    destiny. Ecology raises the issue that the very notion of man’s domination of
    nature stems from man’s domination of man. Feminism reaches even further and reveals
    that the domination of man by man'
