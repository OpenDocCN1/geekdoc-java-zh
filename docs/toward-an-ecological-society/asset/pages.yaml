  md: '# Toward an Ecological Society


    The problem of environmental degradation seems to be falling into a curious focus.
    Despite massive public support for environmentalist measures—as witness the positive
    public response in recent state referendums on such issues—we are being warned
    about a backlash against “extremists” who are raising “radical” demands for arresting
    environmental degradation. Much of this “backlash” seems to be generated by industry
    and the White House, where Mr. Nixon complacently assures us that “America is
    well on the way to winning the war against environmental degradation; well on
    the way to making our peace with nature.” This rhetoric is suspiciously familiar;
    presumably we are beginning to see the “light” at the end of the environmental
    tunnel. In any case, advertising campaigns by the petroleum, automobile, lumber,
    and chemical industries are urging Americans to be more “reasonable” about environmental
    movements, “sensibly” balance “benefits” against “losses,” to scale down norms
    for cleaner air and water that have already been adopted by the Environmental
    Protection Administration, to show “patience” and “understanding” for the ostensibly
    formidable technical problems that confront our friendly neighborhood industrial
    oligopolies and utilities.

    I will not try, to discuss the scandalous distortions that enter into propaganda
    of this kind. Many of you are already familiar with the study by a committee of
    the National Academy of Sciences that accuses the automobile industry of concentrating
    (in the words of a New York Times report) on the “most expensive, least satisfactory
    means of meeting the 1975 Federal exhaust emission standards. As to the pious
    rhetoric from the White House, Mr. Nixon’s efforts to make “peace” with nature
    “is totally at variance with the facts,” as the Times opens editorially., “The
    air over the nation’s cities is getting only marginally cleaner, if at all. Every
    major river system in the country is badly polluted. Great portions of the Atlantic
    Ocean are in danger of becoming a dead sea. Plastics, detergents, chemicals, and
