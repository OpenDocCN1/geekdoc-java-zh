    Such an approach might be described as “environmental” if, by this term we mean
    a morally neutral but more efficient technical administration of nature for concrete
    pragmatic ends. Environmentalism can be regarded simply as a form of natural engineering.
    The objectives of the environmentalist presuppose uniquely beneficial relationship
    between man and nature that is implicit in many statements of “ecological ethic,”
    notably a respect for the biosphere, a conscious effort to function within its
    parameters, and an attempt to achieve harmony between society and the natural
    world. Indeed, it is doubtful if words such as “nature” and “harmony” have any
    meaning for the environmentalist. “Nature” would be regarded as an inventory of
    “natural resources” and “harmony” as a poetic metaphor for “adaptation.” Environmentalism
    advances the goal of using these resources efficiently and prudently, with minimal
    harm to public health and well due regard to the conservation of raw materials
    for future generations.


    Although Baer, Meyer, and Safdie are likely to agree with the environmentalist
    emphasis on efficiency and prudence, they can hardly be regarded as mere technicians.
    It is fair to assume from their designs and sense of human scale that they are
    committed to an ecological ethic, not merely involved in the concerns of technical
    proficiency. Baer’s sense of outrage over social indifference of some of his colleagues,
    Meyer’s almost rhapsodic commitment to a naturalistic sensibility, and Safdie’s
    organic and communitarian vision despite its puzzling eclecticism, reflect a decentralistic
    concept of habitats, a fervent regard for human beings as ends in themselves,
    and a holistic attitude toward nature. In their quest for technologies and communities
    that will serve to harmonize man with man and human society with nature, they
    might well be called “social ecologists” rather than designers, a term the late
    E. A. Gutkind coined quarter of a century ago in a masterful discussion on community.¹15
    Their technologies and communities, in turn, could be described as “ecotechnologies”
    and “ecocommunities,” terms that are meant to imply an ecological ethic to conventional
    notions of technics and urbanism.¹16


