- pgno: 141
  md: 'that are antithetical to an increasingly bureaucratic society. Doubtless, each
    of its design elements could be assimilated in piecemeal fashion to conventional
    ways of life as has been the case with so many radical ideas in the past. The
    plan is sensitive to this possibility. From the outset, it adopts a revolutionary
    stance. Its premise in advance of any design is a culture that is counter to the
    prevailing one—one that emphasizes community rather than isolation, the sharing
    of resources and skills rather than their privatized possession, independence
    from rather than dependence on the bourgeois marketplace, loving relations and
    mutual aid rather than egotism and competition. The Blueprint clearlyates the
    social preconditions for a free community that other, ostensibly radical, plans
    leave unexamined. It is humanistic, not “iconoclastic”; it is radical, not “original.”
    Whether or not the planners were fully conscious of their historic antecedents,
    they were presenting a Hellenic vision of urban life. The truly human city, to
    them, is a way of life (not a mere “design”) that fosters the integration of individual
    with society, with country, of personal needs with social ones without denying
    the integrity of each.


    The sixties have passed—and with them many of the high hopes raised by dropout
    youth and radical students. An insecure, so-called middle-American adult public,
    seeking respite from challenges to traditional values, is trying to entrench itself
    in the status quo, indeed, to evoke “innocence” imputed to the past that is apocryphal
    in any case. Where the counterculture managed to hold its own against overtly
    hostile forces, it had to contend with a political mode of dope peddling in the
    form of sectarian Marxism and “Third World” voyeurism. Here, archaic ideologies
    and modes of organization assume the sembl of “radicalism” and, like toxic germs,
    fester in the wounds opened by political malaise and political repression.


    Yet even this ebbing phase of what is surely a much larger cultural and social
    development could be valuable as a sobering period of maturation. A new world
    will not be gained merely by strewing the pathway to the future with flowers.
    The largely intuitive impulses that exploded with such naive enthusiasm in the
    sixties, only to become bitter, harsh, and dehumanizing in the pseudoradicalism
    that closed the decade, were never adequate to the long-range historic project
    of developing a wider public consciousness of the need for social change. By the
    late sixties, the counterculture ceased'
