  img_proc: true
- pgno: 55
  md: 'stems from the domination of man by man—and perhaps even earlier, by the domination
    of woman by man and the domination of the young by the old. The hierarchical mentality
    that arranges experience itself—in all its forms—along hierarchical pyramidal
    lines is a mode of perception and conceptualization into which we have been socialized
    by hierarchical society. This mentality tends to be tenuous or completely absent
    in nonhierarchical communities. So-called primitive societies that are based on
    a simple sexual division of labor, that lacks and hierarchical institutions, do
    not experience reality as we do through a filter that categorizes phenomena in
    terms of “superior” and “inferior” or “above” and “below.” In the absence of inequality,
    these truly organic communities do not even have a word for equality. As Dorothy
    Lee observes in her superb discussion of the “primitive mind,” “equality exists
    in the very nature of things, as a byproduct of the democratic structure of the
    culture itself, not as a principle to be applied. In societies, there is no attempt
    to attempt the goal of equality, and in fact there is no concept of equality.
    Often, there is no linguistic mechanism whatever for comparison. When we find
    an absolute respect for man, for all individuals irrespective of age and sex.”

    The absence of coercive and domineering values in these cultures is perhaps best
    illustrated by the syntax of the Wintu tribe of California, a people Lee apparently
    studied first hand. Terms commonly expressive of coercion in modern languages,
    she notes, are so arranged by the Wintu that they denote cooperative behavior.
    A Wintu mother, for example, does not “take” her baby into the shade; she “goes”
    with it. A chief does not “rule” his people; he “stands” with them. In any case,
    he is never more than their adviser and lacks coercive power to enforce his views.

    Wintu never say, and in fact they cannot, as we do, “I have a sister,’ or a ‘son,’
    or ‘husband,’ Lee observes. “To live with is the usual way in which they express
    what we call possession, and they use this term for everything they respect, so
    that a man will be said to live with his bow and arrows.”

    “To live with”—the phrase implies not only a deep sense of mutual respect and
    a high valuation of individual voluntarism; it also implies a profound sense of
    oneness between the individual and the group. The sense of unity within the group,
    in turn, extends by projection to the relationship of the community with the natural
    world. Psychologically, people in organic communities must believe that they exercise
