  md: 'The notion of justice, as distinguished from the ideal of freedom, collects
    all of these values into a rule of equivalence that denies the entire content
    of archaic equality. In early organic societies, all human beings have a right
    to the means of life, irrespective of what they contribute to the social fund
    of labor. Anthropologist Paul Radin called this rule of the “irreducible minimum.”
    Archaic equality, here, recognizes the fact of inequality—the dependence of the
    weak upon the strong, of the infirm upon the healthy, of the young and old upon
    the mature. True freedom, is an equality of unequals that does not deny the right
    to life of those whose are failing or less developed than others. Ironically,
    in this scarcely undeveloped economy, humanity acknowledges the right of all to
    the scarce means of life even more emphatically—and in the spirit of tribal mutualism
    that makes all kin responsible for each other, more generously—than in a materially
    developing economy that yields surpluses and a concomitant scramble for privileges.


    But this true freedom of an equality of unequals is degraded on its own terms.
    As material surpluses increase, they create the very social classes that glean
    from the labor of the many privileges of the few. The gift which once symbolized
    an alliance between men akin to the blood tie is slowly turned into a means of
    barter and finally to a commodity, the germ of the modern bourgeois fairly. Justice
    emerges from the corpse of freedom to guard the exchange relationship—whether
    of goods or morality—as the exact principle of equality in all things. Now the
    weak are “equal” to the strong, the poor to the wealth, the healthy in all ways
    but their weakness, poverty, and infirmity. In essence, justice replaces freedom’s
    norm of an equality of unequals with an inequality of equals. Korkheimer and Adorno
    observe: “Before, the fetishes were subject to the law of equivalence. Now equivalence
    itself has become a fetish. The blindfold over Justitia’s eyes does not only mean
    that there should be no assault upon justice, but that justice does not originate
    in freedom.”


    Bourgeois society merely brings the rule of equivalence to its logical and historic
