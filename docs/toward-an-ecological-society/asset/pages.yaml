    of culture, the strictly man-made social substance from which humanity fashions
    the essential achievements of consociation.¹ In this tradition, the city is viewed
    as society distinguished from nature, territory from kinship, rationality from
    custom and, the civic compact of individuals from the archaic group cemented by
    the blood oath. Ideally conceived, the city is the arena for a mode of human propinquity
    that is freed from the dead grip of custom, irrationality, and the vicissitudes
    of natural contingency; in the sum, the social domain in which the sovereign citizen
    is free to fashion her or his selfhood and personal destiny. Here lies the utopian
    content of urban theory; and in truth, from a historic perspective, it would be
    difficult to dispute Max Korkheimer''s assertion that the fortunes of the individual
    have always bound up with the development of urban society. The city dweller is
    the individual excellence.\²


    Yet contemporary urban reality presents an entirely different picture. Today,
    urban history at its best grows grim at the modern city; and its ideals, tarnished
    beyond recognition, lie buried in the rubble of their own high precepts. No longer
    is the city nature domesticated, the arena of unfetter human propinquity, the
    space for individuality and rationality. The modern city reverts beyond even the
    archaic group to a herd of alienated humanity and to all that is demonic in human
    society. The city in our time is the secular altar on which propinquity and community
    are sacrificed to a lonely anonymity and privatized atomization; its culture is
    the debased creature of commodity production and the advertising agency, not the
    gathered wisdom of the mind; and its claims to freedom and individuality are mocked
    by the institutionalized manipulation of unknowing masses among crass egotism
    is the last residue of the selfhood that once formed the city''s most precious
    human goals. Even the'
