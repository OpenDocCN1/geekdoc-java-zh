  md: '# The Concept of Ecotechnologies and Ecocommunities


    The expression “human habitat” contains a paradox that should be examined if it
    is not to lead us into a certain measure of confusion. Clearly any man-made structure,
    indeed, any artifact that figures in an environment is “human” and part of a “human
    habitat.” Viewed in terms of this all-embracing definition, a human habitat could
    include the scarring skyscrapers of New York City and the low-slung town houses
    of Boston’s Beacon Hill or the steel mills of Pittsburg and the artisan shops
    of Williamsburg. What is man-made in a habitat “human,” strictly speaking, and
    many serious writers see no discordances in juxtaposing towers and town houses
    or mills and shops as components of a human habitat.


    But this definition, while obviously secure in its technical accuracy, is somewhat
    disquieting. It seems to preclude the basis for judging whether certain man-made
    values are desirable or not—and has been used to achieve this exclusion with telling
    effect. More than one horrendous urban design has been force-fed to the public
    on the grounds that it is no less “human,” technically speaking, than a Florentine
    neighborhood square, and no pains have been spared to remind elite citizens who
    are exercising inexcusable “value judgments” and the other eminently “human.”
    Yet we tend to resist the notion that the man-made origin of a thing suffices
    to characterize it as “human.” We press the point that the word “human” should
    have considerably more than a technical meaning, that should reflect deeply felt
    moral needs and ends.


    This vexing paradox by means no conflicts conventional technologists and planners
    alone. Even the new, so-called countercultural technologists and communitarians
    have confused technique with values, or more strictly speaking, the dimensions
    of a structure with their ethical or “human” qualities. It does not improve our
    insight into this paradox to declare that small is beautiful or to describe “small”
    technologies as “soft,” “intermediate,” or “appropriate.” Such adjectives are
    more neutral morally than E. F. Schumacher (who coined most of these terms) would
    have us'
