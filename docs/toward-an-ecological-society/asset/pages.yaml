    restore the human scale in our environment and in our social relations, replacing
    mediated by direct personal relations in the management of society. Finally, modes
    of domination—social or personal—must be banished from our conceptions of ourselves,
    our communities, and nature. The administration of humans must be replaced by
    the administration of things. The revolution we seek must encompass not only political
    institutions and economic relations, but consciousness, lifestyle, erotic desires,
    and our interpretation of the meaning of life.


    What is in the balance, here, is the age-long spirit and systems of domination
    and repression that have not only pitted human against human, but humanity against
    nature. The conflict between humanity and nature is an extension of the conflict
    between human and human. Unless the ecology movement encompasses the problem of
    domination in all its aspects, it will contribute nothing toward eliminating the
    root causes of the ecological crisis of our time. If the ecology movement moves
    at mere reforms in pollution and conservation control—at “environmentalism”—without
    dealing radically with the need for an expanded concept of revolution, it will
    merely serve as a safety valve for the existing system of natural and human exploitation.


    # Goals


    In some respects, the ecology movement today is waging a delaying action against
    the rampant destruction of the environment. In other respects, its most conscious
    elements are involved in a creative movement to totally'
  merge: -1
  img_proc: true
- pgno: 42
  md: 'revolutionize the social relations of humans to each other and of humanity
    to nature.


    Although they closely interpenetrate, the two efforts should be distinguished
    from each other. Ecology Action East supports every effort to conserve the environment:
    to eliminate nuclear power plants and weapons, to preserve clean air and water,
    to limit the use of pesticides and food additives, to reduce vehicular traffic
    in streets and on highways, to make cities more wholesome physically, to prevent
    radioactive wastes seeping into the environment, to guard and expand wilderness
    areas and domains for wildlife, to defend animal species from human depression.¹


    But Ecology Action East does not deceive itself that such delaying actions constitute
    the fundamental conflict that exists between the present social order and the
    natural world. Nor such delaying actions arrest the overwhelming momentum of the
    existing society for destruction.


    This social order plays games with us. It grants long-delayed, piecemeal, and
    woefully inadequate reforms to deflect our energies and attention from larger
    acts of destruction. In a sense, we are “offered” a patch of redwood forest in
    exchange for the Cascades, a nuclear power site in exchange for a neutron bomb.
    Viewed in a larger perspective, this attempt to reduce ecology operandi for trading
    away the greater part of the planet for a few islands of wilderness, for pocket
    parks in a devastated world of concrete. is not rescue; it is a cheap modus operandi
    it is the sick strategy of “benefits versus risks” of “trade-offs” that has reduced
    ethics to the pursuit of “lesser evils” rather than greater good.


    Ecology Action East has two primary aims: one is to increase in the revolutionary
    movement the awareness that the most destructive and pressing consequences of
    our alienating, exploitative society is the ecological crisis, and that truly
    revolutionary society must be built upon ecological precepts; the other is to
    create, in the minds of the millions of Americans who are concerned with the destruction
    of our environment, the consciousness that the principles of ecology, carried
    to their logical end, demand radical changes in our society and our way of looking
    at the world.


    Ecology Action East takes its stand with the lifestyle revolution that, at its
    best, seeks an expanded consciousness of experience and human freedom. We seek
    the liberation of women, of children, of gay people, of Black'
  merge: -1
  img_proc: true
- pgno: 43
  md: 'people and colonial people, and of working people in all occupations as part
    of a growing social struggle against the age-old traditions and institutions of
    domination—traditions and institutions that have so destructively shaped humanity’s
    attitude toward the natural world. We support libertarian communities and struggles
