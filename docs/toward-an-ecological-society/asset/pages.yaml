    To state the issue more broadly, the buyer–seller relationship of the marketplace,
    carried by the logic of the commodity relationship to the point of a market society,
    literally simplifies social life to the level of the inorganic. I have pointed
    elsewhere that ecologically, the most significant problem we face today is not
    merely environmental pollution but environmental simplification.¹⁹ Capitalism
    is literally undoing the work of organic evolution. By creating vast urban agglomerations
    of concrete, metal, and gas, by turning soil into sand, by overriding and undermining
    highly complex ecosystems that yield local differences in the natural world—in
    short, by replacing a complex organic environment with a simplified inorganic
    one—market society is literally disassembling a biosphere that has supported humanity
    for countless millennia. In the course of replacing the complex ecological relationships,
    on which all living things depend, capitalism is restoring the biosphere to a
    stage where it will be able to support only simpler forms of life. If this reversal
    of the evolutionary process continues, is by no means fanciful to suppose that
    the preconditions for more complex forms of life will be irreparably destroyed
    and the earth will become incapable of supporting humanity itself.


    This process of simplification, however, is by no means confined to ecology; it
