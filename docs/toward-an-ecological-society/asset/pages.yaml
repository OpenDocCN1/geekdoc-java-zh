- pgno: 24
  md: '“Managerial radicalism” exhibits no real concern over the nature of its constituencies,
    or their qualities as educated, socially committed, and active personalities.
    “Mass actions” outweigh self-action; numbers outweigh ideals; quantity outweighs
    quality. The concept of direct action, a concept that was meant to develop active
    personalities who as individuals and individuated communities could take the social
    realm directly into their own hands—an authentic public guided by ethical considerations
    rather than legislative edicts—is odiously degraded into a matter of “tactics”
    rather than self-activity, self-development, and self-management. Affinity groups,
    an anarchist notion of organization that was meant to provide the intimate, human-scaled,
    decentralized forms to foster the new selves and sensibilities for a truly free
    society, are seen merely as “task forces” that quickly assemble and disperse to
    very limited and concrete actions. “Managerial radicalism,” in short, is primarily
    concerned with managing rather than radicalizing. And in the process of cultivating
    the manipulation of its mass following, it grossly denatures every libertarian
    concept of our times, often at a historic cost that yields a careerism within
    its self-appointed elite and cynicism within its naive following.


    The essays, articles, and papers that comprise this volume have been selected
    precisely for their critical thrust in the hope that we may recast the ecological,
    community, and theoretical issues of our time in a revolutionary direction. My
    omission of discussions on feminism and the feminist movement is merely a personal
    recognition that the best critiques and reconstructive notions in this area have
    already come from women, indeed the best scholarship in anthropology and social
    theory. The works that follow were written entirely during the seventies, and
    almost without exception, are free of the proximities of socialists and “managerial
    radicals” to follow trendy issues. If certain concepts and terms in this book
    now seem familiar, it is often because they were picked up by elements in the
    Left who found one or another sizable constituency to exploit for their own dogmatic
    ends. Thus, these writings can justifiably claim to “lead” intellectually: certainly,
    they do not follow—nor do they adopt new problems to shopworm causes.


    That my writings in ecology, urbanism, and technics have not always been celebrated
    by my colleagues on the Left, in my view, be attributed to'
