    the trailer, the motels, hotels, and ocean liners.”Portability replaces community
    and mobility a sense of rootedness and place. The individual becomes a camper
    who belongs everywhere—and nowhere. Perhaps more appropriately, Fullerian social
    theory envisions the individual as an astronaut who pilots the earth as a mechanical
