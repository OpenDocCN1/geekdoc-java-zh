  md: 'compromised—be direct action or electoral action, decentralization or centralization,
    a Jerry Brown or a Ho Chi Minh. The melding of all these contradictory views becomes
    insufferable not because ecology is distorted into Marxism, for the evidence of
    distortion would be clear on first inspection to any knowledgeable reader. Rather,
    it lies in the fact that one can recognize neither ecology nor the problems they
    raise because both are equally distorted in order to reconcile utterly alien premises
    that lead to completely conflicting conclusions. We must either choose between
    ecology, with its naturalism, its anarchistic logic of decentralization, its emphasis
    on human scaled alternate technologies, and socialism, with its typically Marxian
    antinaturalism, its political logic of centralization, its emphasis on high technology,
    and its bureaucratic institutions. Gor gives us neither alternative in the name
    of both and perpetuates a confusion that has already produced an internal crisis
    in every American and European ecology movement.


    No less disquieting the socialists who have been tracking the ecology, feminist,
