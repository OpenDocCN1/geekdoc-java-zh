  md: 'Alternatively, we are confronted by an urban development that is almost certain
    to disintegrate into bureaucratic mobilization, chronic social war, and a condition
    of permanent violence. If the earliest hieroglyph of the city was a wall intersected
    by two roads, the symbol of the megalopolis may become well a police badge on
    which a gun is superimposed. In this kind of “city,” the revenge of social irrationality
    will claim its toll in the form of an absolute division of human from human. This
    is the very negation of urbanity. Perhaps more significantly, the limits of the
    megalopolis can be formulated as nothing less than the limits society itself as
    an instrument of hierarchy and dominance. To its own development, the megalopolis
    spells the doom not only of the city as but of human sociation. For in such an
    urban world, technology, observed to irrational and demonic forces, becomes not
    the instrument of harmony and security, but the means systematically plunging
    the human spirit and the natural world.


    May 1973


