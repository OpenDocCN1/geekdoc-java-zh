    The young people who began to formulate these new values and forms of sociation—values
    and forms that have since been grouped under the rubric “the counterculture”—unquestionably
    comprised a privileged stratum. For the most part, they came from the affluent,
    white, middle-class suburbs and the better universities of the United States,
    the enclaves and training grounds of the new American technocracy. To seduce their
    privileged status as evidence for the trifling nature of the movement itself sidesteps
    a key question: why did privilege lead to a rejection of the social and material
    values that had spawned these very privileges in the first place? Why, in fact,
    didn’t these young people, like many before them in previous generations, take
    up the basic values of their parents and expand the arena of privilege they had
    inherited?


    These questions reveal a historic change in the material premises for the radical
    social movements in the advanced capitalist countries. By the sixties, the so-called
    First World had undergone unprecedented technological changes. Technology had
    advanced to a point where the values spawned by material scarcity, particularly
    those values fostered by the bourgeois era, no longer seemed morally or culturally
    relevant. The work ethic, the moral authority imputed to material denial, parsimony,
    and sensual renunciation, the high social value placed on competition and “free
    enterprise,” the emphasis on privatization and individuation based on egotism,
    seemed obsolete in the light of technological achievements that afforded entirely
    contrary alternatives—freedom from a lifetime of toil and a materially secure
    disposition oriented toward community and the full expression of individual human
    powers. The new alternatives opened by technological advances made the cherished
    values of the past seem not only obsolete but odious. There is no paradox in the
    fact that the weakest link in the old society turned out to be that stratum that
    enjoyed the real privilege of rejecting false privilege.


    Which is not to say that the technological context of the counterculture was consciously
    grasped and elaborated into a coherent perspective for society as a whole. Indeed,
    the outlook of middle-class dropout youth and students remained largely intuitive
    and often easy prey to the'
