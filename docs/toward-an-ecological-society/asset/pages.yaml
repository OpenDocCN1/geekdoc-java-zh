- pgno: 39
  md: 'society that produced hierarchy and domination—not only in bourgeois, feudal,
    and ancient society, nor in class societies generally but at the very dawn of
    civilization.


    # Ecology and Society


    The basic conception that humanity must dominate and exploit nature stems from
    the domination and exploitation of man by man. Indeed, this conception goes back
    earlier to a time when men began to dominate and exploit women in the patriarchal
    family. From that point onward, human beings were increasingly regarded as more
    resources, as objects instead of subjects. The hierarchies, classes, perfected
    forms, and statistic institutions that emerged with social domination were carried
    out conceptually into humanity’s relationship with nature. Nature became increasingly
    regarded as a mere resource, an object, a raw material to be exploited as relentlessly
    as slaves on a latifundium. This “worldview” permeated not only the official culture
    of hierarchical society; it began the way in which slaves, serfs, industrial workers
    and women of all social classes began to view themselves. As embodied in the “work
    ethic,” in a morality based on denial and renunciation, in a mode of behavior
    based on the sublimation of erotic desires, and in other worldly outlooks (as
    they European or Asian), the slaves, serfs, workers, and female half of humanity
    were taught to police themselves, to fashion their own chains, to close the doors
    on their own prison cells.


    If the “worldview” of hierarchical society is beginning to wane today, this is
    mainly because the enormous productivity of modern technology has opened a new
    vision: the possibility of material abundance, an end to scarcity, and an era
    of free time (so-called leisure time) with minimal toll.


    By “material abundance” we do not mean the wasteful, mindless “affluence” based
    on false needs, the subtle coercion of advertising, and the substitution of mere
    objects—commodities—for genuine human relations, self-reflection, and self-development.
    We refer to a sufficiency in food, shelter, clothing, and basic comforts of life
    with a minimum of toil that will permit everyone in society—not a specialized
    elite—to directly manage social affairs.


    Society is becoming permeated by a tension between “what is” and “what could be,”
    a tension exacerbated by the irrational, inhuman exploitation and'
  merge: -1
  img_proc: true
- pgno: 40
  md: 'destruction of the earth and its inhabitants. The greatest impediment that
    obstructs a resolution of this tension is the extent to which hierarchical society
    still fashions our outlook and actions. It is easier to take refuge in critiques
    of technology and population growth; to deal with an archaic, destructive social
    system on its own terms and within its own framework. Almost from birth, we have
    been socialized by the family, religious institutions, schools, and by the work
    process itself into accepting hierarchy, renunciation, and state systems as the
    premises on which all thinking must rest. Without shedding these premises, all
    discussions of ecological balance remain plaintative and self-defeating.


    By virtue of its unique cultural baggage, modern society—our profit-oriented bourgeois
    society—tends to exacerbate humanity’s conflict with nature in a more critical
    fashion than pre-industrial societies of the past. In bourgeois society, humans
    are not only turned into objects; they are turned into commodities—into objects
    explicitly designed for sale on the marketplace. Competition between human beings,
    as commodities, becomes an in itself, together with the production of utterly
    useless goods. Quality is turned into quantity, individual culture into mass culture,
    personal communication into mass communication. The natural environment is turned
    into a gigantic factory, the city into an immense marketplace; everything from
    a redwood forest to a woman’s body has a “price.” Everything is reduced to dollars-and-cents,
    be it a hollowed cathedral or individual honor. Technology ceases to be an extension
    of humanity; humanity becomes an extension of technology. The machine does not
    expand the power of the worker; the worker expands the power of the machine; indeed,
    she or he becomes a part of the machine.


    Is it surprising, then, that exploitative, degrading, quantified society pits
    humanity against itself and nature on a more awesome scale than any other in the
    past?


    Yes, we need change, but change so fundamental and far-reaching that the concept
    of revolution and freedom must be expanded beyond all earlier horizons. No longer
    is it enough speak of new techniques for conserving and fostering the natural
    environment; we must deal with earth communally, as a human collectivity, without
    those trammels of private property that have distorted humanity’s vision of life
    and nature since the break-up of tribal society. We must eliminate not only bourgeois'
  merge: -1
  img_proc: true
- pgno: 41
  md: 'hierarchy but hierarchy express such; not only the patriarchal family but all
    modes of sexual and parental domination; not only the bourgeois class and propertied
    system but all social classes and property. Humanity must come into possession
    of itself, individually and collectively, so that all human beings attain control
    of their everyday lives. Our cities must be decentralized into communities, or
    ecocommunities, exquisitely and artfully tailored to the carrying capacity of
    the ecosystems in which they are located. Our technologies must be readapted and
    advanced into ecotechnologies, exquisitely and artfully adapted to make use of
