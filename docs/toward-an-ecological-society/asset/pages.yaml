  md: 'revolution is spontaneous can we be reasonably certain that the “necessary
    condition” for revolution has matured, as it were, into the “sufficient condition.”
    An uprising planned by an elite predicated on a confrontation of power with power
    is almost certain today to lead to disaster. The state power we face is too formidable,
    its armamentarium is too destructive, and, if its structure is still intact, its
    efficiency is too compelling to be removed by a contest in which weaponry is the
    determining factor. The system must fall, not fight; and it will fall only when
    its institutions have been hollowed out by the new Enlightenment, and its power
    so undermined physically and morally, that an insurrection confrontation will
    be more symbolic than fact.


    Exactly when or how this “magic moment,” so characteristic of revolution, will
    occur is unpredictable. But, for example, when a local strike, ordinarily ignored
    under “normal” circumstances, can ignite a revolutionary general strike, then
    we will know that the conditions have ripened—and this can occur only when the
    revolutionary process has been permitted to find its own level of revolutionary
