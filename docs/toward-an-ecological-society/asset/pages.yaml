  md: 'organizational, and theoretical perspectives that are still viable today attests
    to the relevance of the book as a whole.


    The term “post-scarcity,” however, has encountered curious difficulties that require
    some discussion. “Scarcity” is not a mystical or absolute condition, a floating
    sense of “need” that is autonomous in its own right. It is a relative term whose
    meaning has changed with the emergence of new needs and waits. Marshall Sahlins
    has emphasized that technically primitive hunting bands lack center around sophisticated
    energy sources, dwellings, vehicles, entertainment, and the steady diet of food
    that Euro-Americans take for. Their “tool kit” is, in fact, utterly primitive
    and their needs so limited that they lack a sense of “scarcity” that riddles our
    own comparatively opulent society. In this sense, they are seemingly “post-scarcity”
    communities or, to be more accurate, “non-scarcity” communities.


    This line of reasoning is often convincing to suggest that a modern society based
    on “voluntary simplicity”—to use a new trendy term—might also become a “post-scarcity”
    society if it implemented “limits to growth” and “voluntary limits” on needs.
    Indeed, the implication of Sahlins’s views have been used with telling effect
    to demand a more austere, labor-intensive, relatively self-sufficient society—presumably
    one whose needs were in fact so limited that seeing energy problems and raw materials
    shortages would be removed. Anthropology has been placed in the service of the
    status quo—not to remove material want but to validate it.


    What this line of reasoning ignores is the considerable losses a drastic reduction
    of needs would create—losses in intellectual, cultural, and psychological complexity
    and ultimately a wealth of selfhood and personality. However how much hunting
    band may be in equipoise with its primitive tool kit and its limited needs, it
    remains primitive and limited nevertheless. Even if one assumes the “noble savage”
    is not a myth, it is a condition of “savagery” as well as nobility—with early
    tribal blood configurations rather than citizenship, tribal parochialism rather
    than *humanitas*, a sexual division of labor rather than a professional one, revenge
    than justice, in short custom rather than reason and biological inflexibility
    instead of social malleability. It lies within human potentialities to be more
    than a “noble Wei'
