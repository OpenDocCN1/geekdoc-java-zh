- pgno: 25
  md: 'one reason: my commitment to anarchism. I hold this commitment with pride,
    if nothing else it has been an invisible moral boundary that has kept me from
    oozing over neo-Marxism, academicism, and ultimately, reformism. I have not tried
    to mix contradictions and incompatibilities in order to gain the approval of my
    peers. A revolutionary ethical opposition has seemed to me to be a much better
    destiny than the social acceptance of those eminently practical “radicals” who
    basically despise the “masses” and in time grow to despise themselves. Hence the
    reader will find no convenient “uncertainties,” no recipes for “success,” no shifts
    of focus to suit a new “lesser evil” around which to embrace an even worse evil
    in the long run.


    A second observation I would like to make is that this collection does not stand
    in any contradiction to my earlier sixty collection of essays, Post-Scarcity Anarchism.
    On the contrary, it largely elaborates problems in the first volume within the
    changing context of the seventies. The counterculture, in my view, is not “dead”;
    it was aborted by many factors and if anything, awaits a richer, more perceptive,
    and more conscious development. The ideals it raised of communal living, openness
    of relations, love, sexual freedom, sensuousness of dress and manner are the abiding
    goals of utopian thought at best. To dismiss the sixties as a “phase” as a “dream”—to
    deny the relevance of Charles Fourier and a William Morris for our times—and to
    restrict the concept of a revolutionary movement to an apparatus, denying its
    significance as a culture. Such rejections of goals and traditions would be nothing
    less than an acquiescence to the status quo. What is remarkable about the sixties
    counterculture is not that it has been aborted; this could have been anticipated
    in the absence of a theoretical armament suitable to its needs. What is remarkable
    is that the counterculture of the sixties emerged at all in the face of a middle-aged,
    smug, and middle-class environment or that it survived in different ways despite
    the hustlecra who preyed upon it, be they the media-oriented canaille which became
    “spokesmen” and clowns and the leeches of the dogmatic Left who parasitized it.


    Post-Scarcity Anarchism tried to explain the emergence of this astonishing cultural
    phenomenon—so alien to the adults of the Eisenhower era—and to offer it a perspective.
    That my essays advanced ecological, technological,'
