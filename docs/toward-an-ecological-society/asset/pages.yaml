  img_proc: true
- pgno: 142
  md: 'speak to America with understanding and in relevant terms. Its politicization
    took the worst form possible—arrogance and a senseless violent rhetoric. Far more
    than the flowers of the mid-sixties, the angry clenched fists of the late sixties
    served to alarm and utterly alienate an uncomprehending public.


    Yet many of the demands raised by this movement of young people are imperishable.
    No matter how far the movement may recede from its earlier eminence, these demands
    must inevitably be recovered and advanced there is to be any social future. In
    calling for a melding of the more abstract ideals of social liberation with personal
    liberation, in seeking to form the nuclear libertarian communist relationships
    necessary for the rearing of a truly emancipated society, in trying to subvert
    the influence of the commodity nexus on the individual self and its relationship
    with other selves, in emphasizing the need for a spontaneous expression of sexuality
    and a humanistic sensibility, in challenging hierarchy and domination in all its
    forms and manifestations, in trying to synthesize new decentralized communities
    on an ecological balance with the natural world—raising all of these demands as
    a single ensemble, the counterculture gave a modern expression to a long historic
    mainstream of human dreams and aspirations. And intuitively, it did so on the
    basis of the historic challenge posed by technological advances unprecedented
    in history. These demands can never be fully submerged by political repression;
    they have become the voice of an increasingly self-conscious reason that is sedimented
    into the very perspective of humanity towards its future. What were only recently
    the hotly debated views of a small minority of the young are almost unconsciously
    accepted by millions of people in all age groups.


    What strongly favors the growth of these demands is the harsh fact that society
    is left with few choices today. The city has completed its historic evolution.
    Its dialectic of the village, temple area, fortress, or administrative center,
    each dominated by agrarian interests, to the megalopolis that completely dominates
    the countryside, marks the absolute negation of the city as we have known it in
    history. With the modern city, we can no longer speak of a clearly defined urban
    entity with a collective urban interest of its own. Just as each phase or “moment”
    of the city in history is marked by its own internal limits, so the megalopolis
    represents the limits of the city as such—civitas as distinguished from communitas.'
