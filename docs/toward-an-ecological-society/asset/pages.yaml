- pgno: 8
  md: 'Ecological Society,” and the book’s moving conclusion, “Utopian and Futurism,”
    he questions the underlying assumptions of the state and the market and of hierarchy
    and domination themselves, not just exploitation and oppression, categories more
    often addressed by less radical thinkers. While he draws inspiration for the new
    society he hopes to see from emerging technologies, like solar energy, wind power,
    ecological agriculture, and energy building techniques, unlike the futurists he
    disdains, he does so from a dialectical perspective that recognizes both potential
    problems as well as liberating possibilities. He insists that these new techniques
    be realized within a context of human scale and community control if their true
    potential to provide a material basis for an ecological society is to be realized.
    He warns (and remember he was writing on these topics in the nineteen sixties
    and seventies), that their development under capitalism would result in centralized
    corporate control and gigantic: huge offshore wind factories and solar farms covering
    vast areas of land, far beyond a human scale and the ease of community control,
    thus viatiating their potential for liberation.


    Bookchin believes that futurism, environmentalism, and Marxism all fail to examine
    our society in fundamental ways, and in their projections of the future, “The
    status quo is enlarged rather than challenged.” His utopia proceeds from a blistering,
    thorough critique to a vision of a qualitatively different world in which all
    forms of hierarchy and domination are banished, including humanity’s attempt to
    dominate nature. He envisions a world in which difference does not necessarily
    lead to subjugation, but is rather turned into complementarity, or mutualism.
    He recognizes the ways that, under the state and capitalism, hierarchy has become
    internalized to the point that it has colonized our very consciousness. We have
    come to accept it as a part of “human nature,” an inevitability that is reflected
    in the tepid visions by these other approaches to thinking about the future. He
    demands a clean break with such thinking, and as part of that process undertakes
    a withering critique of Marxism and neo-Marxist approaches, in such essays as
    “Marxism as Bourgeois Sociology,” “On Neo-Marxism, Bureaucracy, and the Body Politic,”
    and “André Gorz Rides Again—or Politics as Environmentalism"


    Bookchin’s utopian vision, while following the classic pattern of projecting an
    ideal society, takes a radical departure that he refuses to put'
  merge: -1
  img_proc: true
- pgno: 9
  md: 'forward a blueprint for his ideal society. Rather, he offers a set of principles
    that must inform it. He recognizes these principles will manifest in different
    forms based on the particular history, culture, and environment of individual
    communities. He sees this diversity of approaches as both healthy and necessary,
    reflecting the breadth of the human experience and the biodiversity characteristic
    of a healthy ecosystem. Further, while the principles he proposes represent “the
    good place,” he does not see them exhausting the possibilities for further development.


    There is no telos contained in Bookchin’s utopia. His vision does not represent
    an end, but rather a starting point for the unfolding of a new set of possibilities.
    As we approach the shores of this utopia the horizon keeps receding into the distance.
    Bookchin’s vision aligns with the process of evolution itself, which underlies
    his philosophy. He makes a distinction between growth for the sake of growth,
    and true organic development; he sees room for the continual evolution of humans
    become more aware of themselves and their relationship to nature—as we become
    “nature rendered self-conscious”; self-awareness, and the development of new relationships
    between people and the rest of nature that grows out of this self-awareness is
    the engine that drives his project forward. He believes that we, as a species,
    can achieve a level of selfconsciousness that will allow for the creation of a
    truly rational society, and that such a rational society must, by definition,
    be an ecological society.


    What then for Bookchin, we must ask, constitutes an ecological society? In the
    seminal essay “The Myth of City Planning,” and others in this work, he offers
    some clear guidelines: It must be non-hierarchical; it must be human scaled; it
    must be decentralized; it must be complementary; it must be rooted in a post-scarcity
    economy based on mutual aid and solidarity; and it must be self-managed through
    directly democratic means. These individual elements must be all understood as
    part of a whole which is greater than the sum of the parts. Throughout his life
    Bookchin always thought holistically. He demanded coherence, and believed that
    cherry-picking his ideas would destroy the integrity of his revolutionary project—that
    individual elements could be easily co-opted and assimilated into the status quo.
    To achieve a truly revolutionary change required a transformation not only of
    the structures of society but human consciousness as well.'
