  md: '# Introduction


    These essays have been collected for a special purpose: to recover the very idea
    of a radical critique of social life.

    At the outset it should be clear that this is no abstract or insignificant task.
    Perhaps at no time in modern history has radical thought in such grave peril of
    losing its very identity as a consistent critique of the existing social order
    and a coherent project for social reconstruction. Unless we are prepared to retreat
    to the sectarian politics of a by-gone era, it must be bluntly asserted that hardly
    any revolutionary opposition exists in North America and Europe. Worse, the mere
    notion of what a revolutionary opposition consists of has become blurred and diluted
    to the point of sheer opaqueness. The ghosts of Gerrard Winstan, Jacques Danton,
    Gracchus Babeuf, Mikhail Bakunin, Louise Michel—yes, even Marx, Luxembourg, and
    Lenin—occasionally haunt us, they have become spectral and inchoate that we can
    no longer see or hear, even as voices of social conscience.

    What we now call “radical” is an odd mockery of three centuries of revolutionary
    opposition, social agitation, intellectual enlightenment, and popular insurgency.
    Radical politics in our time have come to mean the numbing quietude of the polling
    booth, the deadening platitudes of petition campaigns, car-bumper sloganering,
    the contradictory rhetoric of manipulative politicians, the spectator sports of
    public rallies, and finally, the knee-bent, humble pleas for small reforms—in
    short, the shadows of the direct action, embattled commitment, insurgent conflicts,
    and social idealism marked every revolutionary project in history. Not that petitions,
    slogans, rallies, and the tedious work of public education have no place in these
    projects to hypostase adventuristic escapades to recognize the loss of a balanced
    revolutionary stance, one that has enough sense of time and place to achieve the
    appropriate goals. My point is that the very goals of contemporary radicalism
    have all the features of a middle-aged bourgeois opportunism—of “trade-offs” for
    small gains, of respectability for “mass” but meaningless'
