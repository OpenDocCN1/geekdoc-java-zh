    praxis involved in social reconstruction. And, in fact, step by step the counterculture
    forms been taken up, not only subjectively but also in their most concrete and
    practical forms, an immense host of issues that bear directly on the utopian future
    of humanity, issues that just a generation ago could be (if they were posed at)
    only as the most esoteric problems of theory. To review these issues and reflect
    upon the dizzying rapidity with which they emerged in less than a decade is simply
    staggering, indeed, unprecedented in history. Only the principal ones be cited:
    the autonomy of the self and the right to self-realization; the invocation of
    love, sensibility and the unfettered expression of the body; the spontaneous expression
    of feeling; the de-alienation of relations between people; the formation of communities
    and communes; the free access to all the means of life; the rejection of the plastic
    world and its careers; the practice of mutual aid; the acquisition of skills and
    countertechnologies; a new reverence for life and for the balance of nature; the
    replacement of the work ethic by meaningful work and the claims of pleasure; indeed,
    a practical redefinition of freedom that a Fourier, a Marx, or a Bakunin rarely
    approximated in the realm of thought.


    The point to be stressed is that we are witnessing a new Enlightenment (more sweeping
    than the half-century of enlightenment that preceded the Great French Revolution)
    that is challenging not only the authority of established institutions and values
    but authority as such. Percolating downward from the intelligentsia, the middle
    classes, and youth generally to all strata of society, this Enlightenment is slowly
    undermining the patriarchal family, the school as an organized system of repressive
    socialization, the institutions of the state, and the factory hierarchy. It is
    eroding the work ethic, the sanctity of property, and the fabric of guilt and
    renunciation that internally denies to each individual the right to the full realization
    of her or his potentials and pleasures. Indeed, no longer is merely capitalism
    that stands in the dock of history but the cumulative legacy of domination that
    has policed the individual from within for thousands of years, the “archetypes”
    of domination, as it were, comprise the state within our unconscious lives.'
