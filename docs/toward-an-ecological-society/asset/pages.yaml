- pgno: 143
  md: 'The political principle in the form of the state dissolves all the elements
    of the social principle, replacing community ties with bureaucratic ones. Personified
    space dissolves into institutional space—and with the violent ghettoization of
    the modern city, into what Oscar Newman crassly describes as “defensible space.”
    The human scale is enveloped by urban gigantism. This “anticity,” neither urban
    nor rural, affords no arena for the development of community or even humanistic
    sociation. At most, the megalopolis is pieced together by mutually hostile enclaves
    each of which is internally “united” by its hostility to the stranger on the perimeter.
    At its worst, urban cancer is in physical, moral, and logical decay. It ceases
    to function on its own terms, as an efficient arena for the production and marketing
    of commodities.


    We see here, the profound difference between the sensibility of the young Berkeley
    planners and their conventional counterparts. The Berkeley planners start from
    the premise that urbanity cannot emancipate human sociation from the blood tie
    merely to deliver the individual to the alienated and privatized world of the
    bourgeois marketplace. In the Blueprint, sociation is recovered in the commune,
    in ties freed by human affinity rather than ancestral lineage. Urbanity, in effect,
    is fulfilled as a commune composed of communes. Conventional planning, by accepting
    the city as it is, prevents us from understanding how humanized territory could
    be—namely, a new polis that would be a commune made up of communes, of nuclear
    groups united by choice and selective affinity, not'
  merge: -1
  img_proc: true
- pgno: 144
  md: 'simply by kinship and blood ties. Accordingly, just as people become mere “population,”
    territorialism becomes mere “space” through which people, vehicles, and commodities
    flow. City planning becomes the organization of space by design, not the ecological
    colonization of territory by people. Civitas completely assimilates communitas;
    the political principle, the social principle.


    To restore urbanity as a humanized terrain for soient, the megalopolis must be
    ruthlessly dissolved and its place taken by new decentralized ecocommunities,
    each carefully tailored to the carrying capacity of the natural ecosystem in which
    it is located. One reasonably say that these ecocommunities will possess the best
    features of the polis and medieval commune, supported by rounded ecotechnologies
    that rescale the most advanced elements of modern technology to local dimensions.
    The equilibrium between town and country will be restored—not as a sprawling suburb
    that matches a lawn or woodlot for “nature” but as an interactive functional ecocomunity
    that unites industry with agriculture, mental work with physical. No longer a
    mera espectacular to be seen from a window or during a stroll, nature will become
    an integral part of all aspects of the human experience, from work to play. Only
    in this way can the needs of the natural world become integrated with those of
    the social to yield an authentic ecological consciousness that transcends the
    instrumentalist “environmental” mentality of the sanitary engineer.


    Our place in the history of the city is unique. Precapitalist cities, owing to
    an incomplete technological development that perpetuated material scarcity, either
    stagnated within their limits or exploded destructively beyond them, only to fall
    back again to their original dimensions or disappear entirely. Where the city
    was not frozen (as in Asia and the Near East) by hereditary castes and agrarian
    hierarchies, its unity was dissolved by the commodity system and marketplace.
    This was the fate of the polis. Modern technology has now reached so advanced
    level of development that it permits humanity to reconstruct urban life along
    lines that could foster a balanced, well-rounded, and harmonious community of
    interests between human beings and between humanity and the natural world. This
    ecocomunity would be more than what we have always meant by a city; it would be
    a social work of art, a community fashioned by human creativity, reason, and ecological
    insight.'
