    August 1979


    +   1. It remains superbly ironic that, in the history of elitism and vanguardism
    that runs through millennia of social theory, hierarchy did not confer material
    privileges on the rulers of ideal societies rather it was conferred by austerity
    and renunciation of the material world. Plato’s “guardians” are notably denied
