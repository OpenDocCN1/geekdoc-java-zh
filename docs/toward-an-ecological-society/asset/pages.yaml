  md: 'This crudely Baconian mentality pervades modern city planning. To Aristotle,
    the city was a way of life: its achievement was gauged not by its size, population,
    or logistical efficiency but by the extent to which it enabled its citizens “to
    live temperately and liberally in the enjoyment of leisure.”¹⁴ To Le Corbusier,
    by contrast, the city is a “tool,” a logistical device.¹⁵ Frank Lloyd Wright described
    the city as “the only possible ideal machine.”⁶ This mechanistic orientation had
    its conceptual antecedents in the functionalist theories of the bourgeois Enlightenment
    architects—figures such as Lodoli, who provocatively expressed a greater admiration
    for the sewers of Rome than that of St. Peter’s. Speculative thought tends to
    be replaced by pragmatic realism, human values by operationalism, by the hypostatization
    of means. With Lodoli, as Alexander Tzonis observes an end to the period when
    “theories of architecture considered the design of a building to be determined
    by a set of independent objectives, which the Vitruvian triad (‘Accommodation,
    Handsomeness, and Lastings’) or Perrault’s dichotomy between ‘Positive’ and ‘Arbitrary’
    values.”¹⁷


    Modern city planning is the stepchild of this degraded rationalism and functionalism.
    Inspired by Howard’s intentions be, he assigns himself to design the task of achieving
    goals that involve sweeping revolutionary changes in the economic, social, and
    cultural fabric of bourgeois society. Compared to the megalopolis, Howard’s garden
