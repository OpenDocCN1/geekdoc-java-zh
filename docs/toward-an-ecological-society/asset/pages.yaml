  md: 'Ecotechnology, in fact, can scarcely be exemplified by a statuesque solar collector
    or a dramatic wind generator reared in splendid isolation from the ecosystem in
    which it is located. If the word “ecotechnology” is to have more than a strictly
    technical meaning, it must be seen as the very ensemble itself, functionally integrated
    with human communities as part of a shared biosphere of people and nonhuman life-forms.
    This ensemble has the distinct goal of not meeting human needs in an ecologically
    sound manner—one which favors diversity within an ecosystem—but of consciously
    promoting the integrity of the biosphere. The Prometheusian way of using technology
    to “dominate nature” is replaced by the ecological ethic of using technology to
    harmonize humanity’s relationship with nature.


    Human consciousness, in effect, is placed in the service of both human needs and
    ecological diversity. Inasmuch as human beings are themselves products of the
    natural world, human self-consciousness could be described in philosophical terms
    as nature rendered “self-consciousness,” a natural world guided by human rationality
    toward balanced or harmonious ecological as well as ends. This philosophical vision
    has a historical pedigree in the Western intellectual tradition. It reaches back
    to Hellenic philosophy as the concept of a *nous*, a concept that, in Fichte’s
    stirring, envisions consciousness “no longer as stranger in Nature whose connection
    with existence is so incomprehensible; it is native to it, and indeed one of its
    necessary manifestations.”²


    Ecocomunity, in turn, could scarcely be exemplified by any urban aggregate or,
    for matter, any rural household that has to acquire its resources from solar and
    wind installations. If the “ecocomunity” is to have more than a strictly logistical
    and technical meaning, it must describe a decentralized community that allows
    for direct popular administration, the efficient return of wastes to the countryside,
    the maximum use of local resources—and yet it must be large enough to foster cultural
    diversity and psychological uniqueness. The community, like its technology, is
    itself the ensemble of its libertarian institutions, human scaled structures,
    the diverse productive tasks that expose the individual to industrial, craft,
    and horticultural work, in short, the rounded community that the Hellenic polis
    was meant to be in the eyes of its great democratic statesmen. It is within such
    a decentralized community, sensitively tailored to its natural ecosystem, that
    we could hope to develop a new sensitivity'
