    Human beings, plants, animals, soil, and the inorganic substrate of an ecosystem
    form a community not merely because they share or manifest an oneness in “cosmic
    energy” but because they are qualitatively different and thereby complement each
    other in the wealth of their diversity. Without giving due and sensitive recognition
