- pgno: 19
  md: 'actually originates in the domination of woman by man. Community movements
    implicitly assert that in order to replace social domination by self-management,
    a new type of civic self—the free, self-governing citizen—must be restored and
    gathered into new institutional forms such as popular assemblies to challenge
    the all-pervasive state apparatus. Followed through their logical conclusion,
    all of these movements challenge not only class formations but hierarchies, not
    only material exploitation but domination in every form. Although hierarchical
    structures reach into the most intimate aspects of social and personal life, the
    supriclass problems they raise nowhere falls within the limited orbit of the socialist
    and labor movements. Hence, if we are to complete the logic of the ecology, feminist,
    and community movements, we must extend our notion of freedom beyond any concept
    we have held of this notion in the past.


    But will these new movements be permitted to follow the logic of their premises,
    to complete them in a consistent and coherent fashion?


    It is around crucial issue that we encounter two major obstacles: the attempt
    by socialists to reduce these expansive concepts of freedom to economistic categories
    and the attempt by the “managerial radicals” to compromise them. Of the two, the
    socialist view tends to be the most deceptive. Slogans like “pollution is profitable,”wages
    for housewives,” and “fight the slumlords” involve a subtle denaturing of the
    more sweeping revolutionary demands for an ecological society, the abolition of
    domination, and the restoration of community control. The real “slime of history,”
    to reinterpret Sartre’s phrase, is the muck of the past that is flung upon the
    present to re-sculpt it into forms—that accord with an archaic vision of social
    reality. A “socialist” ecology, a “socialist” feminism, and a “socialist” community
    movement—with its red flags, clenched fists, and sectarian variety—are not contradictions
    in terms; they infest the newly formed, living movements of the future with the
    maggots of cadavers from the past and must be opposed relentlessly.


    A special onus must be borne by ideologists who perpetuate the infestation and
    even conceal it with theoretical cosmetics. One thinks, here, of the André Gorz
    and Herbert Marcus who not only worship at the mausoleum of socialism but promote
    it as a viable habitat for the living. What uniquely distinguishes their ideological
    obscurism from that of the socialist sectarians is their repeated attempts to
    reformulate both sides of the'
