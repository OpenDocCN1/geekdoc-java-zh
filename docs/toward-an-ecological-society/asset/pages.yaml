    Bourgeois society ironically concealed these problems for centuries by giving
    them an economicistic framework. Marx was fall victim to this historic subteruge
    by ignoring the subsurface modes of obedience and command that lie in the family,
    school, bureaucracy, and age structure, or more precisely, identifying the “social
    problem” with class relations at the expense of a searching investigation into
    the hierarchical relations that produced class forms in the first place. Indeed,
    Marxism may well be the ideology of capitalism par excellence precisely because
    the essentials of its critique have focused on capitalist production without challenging
    the underlying cultural sensibilities that sustain it. My insistence that every
    revolutionary movement must be a cultural one as well as a social one is not simply
    the product of an exaggerated aversion for march; it has deeper roots in my conviction
    that the revolutionary project remains incomplete if it fails to reach into the
    problems of hierarchy and domination as such—in short, if it fails to seek the
    substitution of an ecological sensibility for a hierarchical one.


    Accordingly, this book is marked by a host of contrasts that ordinarily remain
    unstated or blurred in the radical and environmental literature I have encountered.
    It contrasts ecology with environmentalism, hierarchy with class, domination with
    a people’s technology with “appropriate” technology, self-management with “economic
    democracy,” cultural movements with economicistic parties, direct democracy with
    representative democracy, utopia with futurism. I have not tried to develop all
    of these contrasts in these introductory remarks. The reader must turn to the
    book for a clearer elucidation of them. Let merely voice one caveat. Nowhere I
    claim that a hierarchical analysis of society involves a denial of a class analysis
    and its significance. Obviously, the former includes the latter. I am certain
    that this caveat will be magnificently ignored by socialists and syndicalist-oriented
    libertarians alike. It is merely to be stated so that the reader has been alerted
    to “criticisms” that more often involves bias rather than analysis.'
