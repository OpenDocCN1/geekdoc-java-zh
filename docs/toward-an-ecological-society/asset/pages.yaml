    activity, all contracts and dealings, and for taxes and grants.”^2 No figure could
    be so-inclusive. In blending Pythagorean mysticism with pragmatic considerations,
    Plato affords his contemporaries a bridge to span the gap between the archaic
    world of the mythopoeic and the practical world of social organization, a characteristic
    example of “cosmic” and social parallelism that proved so appealing to the new
    technologists and communitarians of our own time.


    Aristotle is more secular: he replaces with strictly ethical premises. These very
    premises provide him with his uniquely Hellenic stance—a moral conception of what
    we (borrowing our social terminology from zoology) designate as a “habitat.” In
    a widely quoted passage, Aristotle tells us that the “best polis” must be one
    that “can be taken in a single view.”^4 His reasons for this scale, although rarely
    cited, form what is perhaps one of the most compelling arguments in social theory
    for decentralization. The population of a polis must suffice to achieve not only
    the “good life” and “self-sufficiency” in a “political community” but must be
    limited to a size that renders it possible for citizens to “know each other’s
    personal characters, where this happens not to be the case of the business of
    electing officials and trying lawsuits is bound to go badly; haphazardazard decision
    is unjust in both matters, and this must obviously prevail in an excessively numerous
    community.”^5


    “Small,” in Aristotle’s view, human allows for individual control over the affairs
    of the community and the exercise of individual human powers in the social realm.
    A “big” community may be more efficient for economic or military purposes, but
    it would be “unjust.” Its citizens would be incapable of making decisions of profound
    social importance and would thereby fail to realize their distinctive capacities
