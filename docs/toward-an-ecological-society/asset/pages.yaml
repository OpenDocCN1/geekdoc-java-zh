  md: 'savage,” a product of natural history alone. To leave humanity’s latent capacity
    for actualizing the fullness of reason, creativity, freedom, personality, and
    a sophisticated culture only partially or one-sidedly fulfilled is to deny the
    dialectic of the human condition in its full state of realization and even of
    nature as life rendered self-conscious.


    Hence even were a “non-scarcity” society to exist, humanity would still suffer
    the same deprivation of form and development that exists in a “scarcity” society.
    “Post-scarcity” does not denote an affluence that would stifle the fulfillment
    of the human condition; indeed, an abundance of needs that can be fulfilled is
    more likely to perpetuate unfreedom from the “non-scarcity” condition of a hunting
    band. “Post-scarcity” denotes a free society that can reject false, dehumanizing
    needs precisely because it can be substantially free of need itself. It can decide
    to adopt a simpler way of material life because there is enough available for
    everyone to accept or reject. That it even make such a decision reflects a high
    degree of social freedom in itself, a new system of social relations and values
    that merit libertarian social judgments possible. Gauged merely by our agricultural
    and industrial output, North Americans and Europeans currently have the means
    for making such a judgment; gauged by our social relations, on the other hand,
    we lack the freedom, values, and sensibility to do. Hence our affluent society—all
    myths of depleted or shrinking resources notwithstanding to the contrary—is as
    gripped by scarcity as our medieval ancestors centuries earlier. A “post-scarcity”
    society, in effect, would have to be a libertarian society that possessed enough
    material resources to limit growth and needs as a matter of choice, not as a matter
    of need—for if limits were determined by needs that emerge from scarcity, it would
    still be limited by scarcity and whether resources were in short supply or not.
    The need to diminish need would materially provide the basis, if not the cause,
    of hierarchy and domination based on privilege.


    Marx hypothesized the problem of needs as the “realm of necessity,” a concept
    that reaches back to Aristotle, and thereby absolutized it in a way that obscured
    the historical formation of needs. How needs are formed—this, in contrast to the
    acceptance of needs as they exist—represents a complex problem which I shall not
    attempt to explore here. It suffices to point out that the formation of the “realm
    of necessity,” with the harsh split'
