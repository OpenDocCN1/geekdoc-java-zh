- pgno: 13
  md: 'in which the outlook of Indigenous peoples led to economic systems that functioned
    without a market and exhibited a sense of living as an interdependent part of
    the natural world, in contrast to the Promethean outlook that characterizes our
    society.


    Bookchin’s utopia was informed by all of these rich histories, while he admired
    them also clearly recognized their limitations. He had no desire to return to
    the past. Rather for him these examples represented a potentiality—a clear indication
    that humanity has the capacity to organize social life on a very different basis.
    He saw that possibility as grounding his utopia in reality. He believed that the
    principles they represented could be dialectically transformed and applied in
    a new, revolutionary context.


    Indeed, all of the principles that inform Bookchin’s utopia are grounded in what
    he saw as the unrealized potential contained in our society and in humanity itself.
    Moreover, he finds an ethical basis for these ideas in his interpretation of nature
    itself, by which means natural evolution and natural history. In later works,
    Bookchin systematically elaborates the elements of an ethical framework, derived
    from understanding of nature, which informs the utopian principles he puts forward
    in this book. The application of these tendencies in nature to social life, he
    argues, is the only way to achieve his utopia: a reharmonization of people and
    the rest of nature that leads to an ecological society.


    Briefly, Bookchin’s naturalistic ethics recognize several crucial tendencies in
    nature. First, nature is nonhierarchical. No lion as king of beasts, nor lowly
    ant; all life is interconnected and interdependent. This leads to his second ethical
    principle; nature is mutualistic and complimentary in every respect. His third
    principle derived from nature is that of unity in diversity. He finds strength
    and resilience in the interplay of a variety of species at any given environment.
    The greater the biodiversity of an ecosystem, the healthier it is. In addition,
    he sees in natural evolution a tendency toward greater diversity, complexity,
    and degrees of freedom. Further, Bookchin understands nature to be homeostatic,
    whenever possible achieving a dynamic balance: stability maintained through on-going
    cycles of birth, death, and decomposition. Finally, he recognizes the importance
    of spontaneity in the process of evolution; mutation and change are essential
    components in the development of life.'
