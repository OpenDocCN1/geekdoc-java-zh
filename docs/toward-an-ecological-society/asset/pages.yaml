- pgno: 22
  md: 'Movements leap-frogged over entire eras of historical experience and theoretical
    development with an arrogant indifference for the labors of the past, abandoning
    anarchism for Marxism, machismo militancy for feminism, communal living for privatism,
    sexual promiscuity for monogamy, rock music for disco, only to revert again to
    new libertarian fads, sado-masochism, singles'' bars, punk rock in crisscrossing
    patterns that more closely resemble the sprawl of an infant than the decipherable
    messages of maturing individuals. That young men and women can write marketable,
    often salacious “biographies” at the age of thirty or is not surprising; there
    is detail plenty to entertain the reader—but nothing of significance to communicate.


    What counts is the extent to which appearance can so easily replace reality in
    the American mind. Rebellion, too, can become mere theater when it lacks the substance
    of knowledge, theory, and wisdom. Indeed, the myth that “doing” is more important
    than “thinking,”“constructive action” is more important than rational critique—these
    are actually mystified forms of theory, critique, and rationalism. The traditional
    American maxim that “philosophy is bunk” has always been a philosophical judgment
    in its own right, a statement of empirical philosophy as against speculative,
    of sensuous knowledge as against intellectual. The gruff attack upon theory and
    reason does not annul activity. “Common sense” is merely “sense” that is common,
    that is untutored, uninformed, and riddled by acquired biases. It merely replaces
    the presuppitions of unconscious prejudice by self-conscious wisdom. In either
    case, presuppitions are always being made and thereby involve theory, philosophy,
    and mentality in one form or other.


    The “managerial radical” capitalizes upon this antithetical syndrome, particularly
    on its myth of fast speed. Immediacy of reward, a psychologically formative technique,
    fosters the infantile demand for immediate gratification and the manager’s constituency.
    Radicalism thus ceases to be a body of theory and informed practice; it becomes
    the fastest route to the most immediate goals. The notion that basic social change
    may require the labors and dedication of a lifetime—a notion so basic to revolutionary
    idealism—has no place in this technocratic constellation. Radicalism becomes methodology
    rather than morality,'
