- pgno: 225
  md: 'The enormous difficulty that arises in understanding this Enlightenment is
    its invisibility to conventional analyses. The new Enlightenment is not simply
    changing consciousness, a change that is often quite superficial in the absence
    of other changes. The usual changes of consciousness that marked earlier periods
    of radicalization could be carried lightly, as mere theories, opinions, or a cerebral
    pundry that was often comfortably discharged outside the flow of everyday life.
    The significance of the new Enlightenment, however, is that it is altering the
    unconscious apparatus of the individual even before it is articulated consciously
    as a social theory or by commitment to political convictions.


    Viewed from the standpoint of a typically socialist analysis—an analysis that
    focuses almost exclusively on “consciousness” and is almost completely lacking
    in psychological insights—the new Enlightenment seems to yield only the most meager
    “political” results. Evidently, the counterculture has produced no “mass” radical
    party and no visible “political” change. Viewed from the standpoint of a communist
    analysis—an analysis that deals with the unconscious legacy of domination—the
    new Enlightenment is slowly dissolving the individual’s obedience to institutions,
    authorities, and values that have vitiated every struggle for freedom. These profound
    changes tend to occur almost unknowingly, as for example among workers who, in
    the concrete domain of everyday life, engage in sabotage, work indifferently,
    practice almost systematic absenteeism, resist authority in almost every form,
    use drugs, and acquire various freak traits—and, in the abstract domain of politics
    and social philosophy, claim the most homalities of the system. The explosive
    character of revolution, its suddenness and utter unpredictability, can be explained
    only as a release of the tension between unconscious desires and consciously held
    views in the form of an outright confrontation with the existing social order.
    The erosion of the unconscious restrictions on these desires and the full expression
    of the desires that lie in the individual unconscious is a precondition for the
    establishment of a transitory society. There is a sense in which we can say that
    the attempt to change consciousness is a struggle for the unconscious, both in
    terms of the fetters that restrain desires and the desires that are fettered.


