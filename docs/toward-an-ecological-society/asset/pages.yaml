  md: 'development” is an understatement. The “postrevolutionary political development”
    of the early republic was largely counterrevolutionary and the township, particularly
    its town meetings, were deliberately excluded precisely they gave “concrete organs”
    to an “abstract political system of democracy.”³⁵ As Merrill Jensen has pointed
    out in a fascinating account of that period, “the nature of city government came
    in for heated discussion.” Town meetings, whether legal or informal, “had been
    a focal point of revolutionary activity.” The antidem reaction that set in after
    the American Revolution was marked by efforts to do away with town meeting governments
    that spread beyond New England to the mid-Atlantic and Southern states. Attempts
    by conservative elements were made to establish a “corporate form (of municipal
    government) whereby the towns could be governed by mayors and councils elected
    from urban wards. Judging from New Jersey, the merchants “backed incorporation
    consistently in the efforts to escape town meetings.” Such efforts were successful
    not only in cities and towns of that state but also in Charleston, New Haven,
    and eventually Boston. Jensen, addressing himself to the incorporated form of
    municipal government and restricted suffrage that replaced the more democratic
    assembly form of the revolutionaries of 1776 in Philadelphia, expresses a judgment
    that could apply to the successful efforts in belief of municipal incorporation
    following the revolution: “The counterrevolution in Philadelphia was complete.”³⁷


    Here, then, lies a history and a literary tradition that awaits full and conscious
    expression as a demand for human scale, local popular control, decentralization,
    and face-to-face democracy both within the revolutionary movement and within society.
    In turning the notion of the “people” against its bourgeois utopian origins, this
    literary tradition recovers and transcends a vision for which the material premises
    were established by bourgeois society itself. A “revolutionary subject” exists
    in the social vacuum left by society and the centralized power at its summits.³⁸
    The system turns everyone against it be the conservator or the small struggling
    entrepreneur, the worker or the intellectual, women, Blacks, aged, or the seemingly
    privileged suburbanite. The denuding of the individual from “brothers” and “sisters”
    into “citizens” and finally “taxpayers” expresses the common lot of every individual
    who is burdened by a terrifying sense of powerlessness that is so easily mistaken
    for apathy.'
