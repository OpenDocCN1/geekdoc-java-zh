    development can be healed and transcended. Hierarchical society performed the
    baneful “miracle” of turning human beings into instruments of production, into
    objects on a par with tools and machines, thereby defining their humanity by usufruct
    in a universal system of scarcity, of domination, and, under capitalism, of commodity
    exchange. Even earlier, before the domination of man by man, hierarchical society
    brought woman into universal subjugation to man, opening a realm of domination
    that reached beyond exploitation—a realm of domination for its own sake, of domination
    in its most reified form. Domination, carried into the very depths of personality,
    has turned into the bearers of an archaic, millennia- legacy that fashions the
    language, the gestures, indeed, the very posture we employ in everyday life. All
