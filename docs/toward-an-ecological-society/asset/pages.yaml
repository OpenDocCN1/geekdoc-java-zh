    It may be well to pause and examine this argument since it rears itself in ghostly
    fashion with every defense of Marxism against its most fallacious theoretical
    conclusions. The Marxist corpus lies in an uncovered grave, distended by gases
    and festering with molds and worms. Its rich sweep—the project of a scientific
    socialism, historical materialism as a base-superstructure theory of social development,
    the call to proletarian insurrection, the ideal of a centralized planned economy,
    the strategy of developing revolutionary workers’ parties in industrially advanced
    countries of the world—all, have turned into a sickly, fetid jelly. But let we
    face up to the day of the Marxian project and draw serious lessons from its tragic
    destiny, we are inevitably marked by Marxist pundits that “instrument of analysis”
    survives, indeed, is “irreplaceable.” Marxism, in effect, is a success as a method
    however it is a failure as a theory.


    Why such an “irreplaceable” method should yield such impoverished remains inexplicably
    unclear. Indeed, the crucial relationship between methodology and reality raises
    far-reaching philosophical questions that can hardly be discussed at any length
    here. It is difficult not to note that the decline of philosophy itself from an
    interpretation of the world into a mere “method” of “analysis” has been the subject
    of brilliant critique by the theorists of the Frankfurt School, notably Max Horkheimer
    and Theodor Adorno. May justifiably turn this critique against Marxism itself,
    which has increasingly been turned by its acolytes into an analytical instrumentalist
    methodology rather than a theory of actual social change. Change, by Hegel’s dialectic,
