  md: '# On Neo-Marxism, Bureaucracy, and the Body Politic


    The historic failure of proletarian socialism, particularly its Marxian form,
    to provide a revolutionary theory and practice for our time has been followed
    by a highly abstract form of socialist theoretics that stands sharply at odds
    with the very notion of a revolutionary project—notably, with a theory that is
    meant to yield a viable revolutionary practice.


    If this judgment seems harsh, it hardly conveys the extent to which this theoretics
    have become a considerable culture industry in its own right. The retreat of socialism
    from the factory to the academy—an astonishing phenomenon that cannot be justified
    by viewing “knowledge” as a technical force in society—has denied socialism the
    right to a decent internment by perpetuating it as a professionalized ideology.
    An enfeebled theory, long drained of its sweeping liberatory claims, socialism
    has been turned from a social phenomenon into an academic discipline, from a historic
    reality into a mere specimen of intellectual history that is culturally exotic
    all the more to obscure the need for an entirely new conception of theory and
    practice.


    Indeed, to the degree that the academy itself has become increasingly disengaged
    from society, it has used socialist theoretics to indulge its worst intellectual
    habits. The remains of a once-insurgent movement have provided the intellectual
    nutrients for academic conceptual frameworks that are utterly alien to it—a level
    of discourse, a range of perceptions, a terminology, and a body of intellectual
    pretensions that mutually reinforce the reduction of academic ideology to socialism
    and of socialism to ideology. One must leave it to the conscience of the socialist
    academics to ask themselves if Marx’s account of social development as a history
    of class struggle can be translated into a history of “distorted communication,”
    his critique of political economy into a specific “paradigm” of “intersubject,”
    and his relations of production into “symbolically mediated forms of social interaction.”¹An
    earlier generation of Marxian theorists, however serious their shortcomings, would
