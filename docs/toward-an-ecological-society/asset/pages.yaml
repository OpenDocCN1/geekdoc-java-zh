    conception of revolutionary organization forms the basis of the anarchist affinity
    group. Members of an affinity group perceive themselves as sisters and brothers
    whose activities and structures are, in Josef Weber’s words, “transparent to all.”
    Such groups function as catalysts in social situations, not as elites; they seek
    to advance the consciousness and struggles of the larger communities in which
    they function, not assume positions of command.


    Traditionally, revolutionary activity has been permeated by the motifs of “suffering,”
    “denial,” and “sacrifice,” motifs that largely reflected the guilt of the revolutionary
    movement’s intellectual cadres. Ironically, to the extent that these motifs still
    exist, they reflect the very inhuman aspects of the established order that the
    “masses” seek to abolish. The revolutionary movement (if such can be called, today)
    thus tends, even more than ideology, to “echo” the prevailing actuality—worse,
    to condition the “masses” to suffering, sacrifice, and denial at its own hands
    and in the aftermath of the revolution. As against this latter-day version of
    “republican virtue,” the anarchist affinity groups affirm not only the rational
    but the joyous, the sensuous, and the aesthetic side of revolution. They affirm
    that the revolution is not only an assault on the established order but also a
    festival in the streets. The revolution is desired carried into the social terrain
