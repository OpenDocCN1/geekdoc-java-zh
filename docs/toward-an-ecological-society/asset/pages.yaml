    seem tame. The “revolutionary” movement—as the Left itself—positively supports
    the situation which it professes to attack. The mass party is the precondition
    for the existence of a mass society, the political face of its institutional bureaucracy.
    The entire future of the Left diverges whether it seeks to recover a body politic—the
    koinonia of a face-to-face citizenry—or whether, in the name of the “pragmatic,”
    the “expedient,” and the appropriate “mediations” it will foster the ever-greater
    rationalization of the society with the rhetoric of progress, planning, reform—and
    even “revolution.”


    Beyond the intramural disputes of the Left lie the larger social issues of historic
    recovery and social advance. The municipal tradition, however faint, persists
    in Western society today as an American tradition that may well speak to an American
    revolutionary movement with greater meaning than the European emphasis on centralization.
    “The continued growth of the New England town by division of the central nucleus
    into new cells, having an independent life of their own, recalled the earlier
    pattern of Greece,” Lewis Mumford has observed, “But the New England towns added
    a new feature that has never been sufficiently appreciated nor as widely copied
    as it deserved: the township. The township is a political organization that encloses
    a group of towns, villages, hamlets, along with the open country area that surrounds
    them: it performs the functions of local government, including the provision of
    schools and the care of local roads, without accepting the long-established division
    between town and county.


    Mumford’s lament that the failure of “both the federal and the state constitutions”
    to incorporate the township as the basic unit of American democracy was one of
