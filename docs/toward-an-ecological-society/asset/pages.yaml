- pgno: 32
  md: 'To return to my opening remarks, this book is primarily intended to give voice
    to a revolutionary idea of social change, particularly in terms of the problems
    that have emerged with the decline of the traditional workers’ movement. Owing
    to the growing sense of powerlessness that freezes into adaptive strategies for
    survival, an all-pervasive pragmatic mentality now invades our thinking. We live
    in a society of “trade-offs” which are rooted in a pseudo-ethics of “benefits
    versus risks.” An “ethics” of “trade-offs” involves a choice between lesser evils
    that increasingly carries us to the brink of the worst evils conceivable. Such,
    in fact, was the destiny of the German Left, which chose right-wing Rather than
    conservative center parties, only to be faced with reactionaries who opposed fascists,
    finally to choose a Hindenburg against a Hitler who then proceeded to make Hitler
    chancellor of the Reich. Our modern “ethics” of “trade-offs” and lesser evils,
    rooted in adaptation, pragmatism, and careerism stands in historic contrast to
    the ethics of capitalist society. Even to such conservative thinkers like Plato
    and Aristotle—a realm that could never be disassociated from ethics—denoted the
    achievement of virtue in the form of justice and the good life. Hence, authentic
    politics stood opposed to evil and called for its complete negation by the good.
    There are no “trade-offs” in Plato’s *Republic* or in Aristotle’s *Politics*.
    The ultimate goals of these works are to assure the success of virtue over evil,
    of reason over superstition and custom.


    Modern politics, by contrast, has decisively separated itself from this tradition.
    Not only have we disassociated politics from ethics, dealing with the former strictly
    as a pragmatic body of techniques and the latter as a corpus of relativistic values
    based on personal taste and opinions; we have even turned the pragmatic techniques
    of politics into a choice between lesser evils, of “trade-offs,” that thereby
    replace virtue by evil as the essence of political norms.²


    Politics has now become a world of evil rather than virtue, of injustice rather
    than justice, a world that is mediated by “lesser” versus “greater” transgressions
    of the “good,” the “right,” and the “just.” We no longer speak of what is “right”
    or “good” or “just” *as such* but what is less or more evil in terms of “benefits”
    we derive, or more properly, the privations and dangers to which we are exposed.
    Only the general ignorance of culture is slowly gathering like a darkening cloud
    over the present society has made'
