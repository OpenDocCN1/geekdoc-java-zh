    If my remarks seem overly contentious, it is because I am deeply concerned with
    the integrity of the new, inherently radical issues that have emerged in recent
    years—issues that potentially at least have more far-reaching emancipatory implications
    than the radical ones of the past. I refer to ecology, feminism, and community
    control—a group of problems that reaches beyond the largely economic conflicts
    of the movements of the last generation. These new problems raise expansive notions
    of freedom and an emancipatory sensibility, not merely of justice and material
    exploitation. What is at stake, today, particularly in the movements and tendencies
    that have formed around ecology, feminism, and community control is the extent
    to which they can be fully actualized as liberating forces.


    These movements and tendencies are now faced with a crisis that threatens to warp
    their emancipatory logic into aborted, subservient, and conventional ideologies
    of the status quo. Their destiny may be determined by our ability to unearth that
    emancipatory logic, to reveal its revolutionary content, and to explore the new
    meaning it can give to the word “freedom.”


    Should we fail in this momentous endeavor, the colonization of society by a deeply
    sediment bourgeois sensibility will be complete—perhaps so complete that it is
    doubtful if a revolutionary opposition will emerge again in the present century.


    The traditional locus of modern radicalism—the workers movement—is dead. My essays
    on socialism and Marxism in this book delineate the inherent limits and mystified
    premises on which it rested historically. The ecology, feminist, and community
    movements that have emerged in the 1970s have demonstrably shattered the silence
    that socialism has left in its wake. They are vital, rebellious, and richly promising,
    but the conflicts face these new movements have been grossly miscast. The central
    conflict confronting the ecology, feminist, and community movements is not merely
    with those who wish to despois the environment or those who foster sexism or those
    who oppose community control. The despoilers, sexists, and'
