  md: 'require a degree of coordination that could be achieved through a process of
    administration built from the bottom up and controlled by democratic means, with
    decision making still residing at the community level and various regional, continental,
    and even global councils representing and coordinating those local mandates. He
    emphasized a distinction between decision making and administration, demanding
    that decisions come from the community even if they were to be administered or
    implemented by “experts.”


    This is in keeping with his call for complementarity. Bookchin, while concerned
    with emphasizing individual autonomy and community selfmanagement, also recognized
    the interdependent, or mutualistic, nature of individuals and society. He sought
    to maximize the self-reliance of every community but knew that total self-sufficiency
    was not achievable nor desirable. Our interdependence however, had to take mutualistic
    form, structured around the principle of complementarity rather than the mechanisms
    of command and control inherent in hierarchical systems. He recognized that all
    human societies required means to make decisions, but he called for such power
    to be distributed equally and democratically: power with rather than power over.


    Bookchin believed that humanity had already achieved its post-scarcity potential.
    He was convinced that through the rational application of our technological capacity
    we had the ability to meet all of our material needs, and to do so without the
    soul-destroying, tedious labor imposed by the productive relations of capitalism.
    In his utopian future Bookchin saw manual labor replaced by machines and computerization,
    as he described in an earlier essay “Towards a Libertary Technology,” published
    in his 1971 collection Post-Scarcity Anarchy. He saw the drudgery of work giving
    to creativity and joyfulness of play; the freeing of humanity from the struggle
    for survival; the realm of necessity giving way to the realm of freedom. He saw
    such a development unleashing new aspects of human potential and allowing people
    the time and energy to engage fully in the self-management of their society.


    The full realization of post-scarcity would mean the abolition of the capitalism
    and even the market itself. His utopian vision called for new mechanisms for the
    production and distribution of goods, for artisanship as an expression of creativity,
    and mutual aid and solidarity as the way to'
