- pgno: 201
  md: 'The concepts of social ecology stand at odds with his basically orthodox Marxist
    views. By not naming his social theories as ecological, Commoner quite consistently
    retain his refurbished Marxist views under the socially neutral term of “environmentalism.”


    Gorz, whether he is clearly mindful of the fact or not, does precisely the same
    thing. And it is not what is most viable in Marx’s writing that Gorz chooses for
    the theoretical underpinnings of his views but what is largely moribund or, at
    least, most questionable. In Gorz’s view, capitalism threatens to produce a profound
    social crisis not as form of ecological disequilibrium and breakdown but rather
    as a form of economic disequilibrium and breakdown. If one is to take Gorz’s “Introduction”
    seriously, ecology can be regarded as simply as an exacerbating factor in a much
    larger economic crisis that faces capitalism. If one peers behind the rich verdure
    of Gorz “ecology,” one finds the most dismal cobwebs of orthodox Marxism. For,
    when all is said and done, Gorz really argues in his “Introduction” that capitalism,
    by introducing “technical constraints” increases the organic composition of capital,”
    that is to say, the ratio of constant capital (machinery and raw materials) to
    variable capital (labor). Inasmuch as labor, in Marxist economic theory, is the
    source of all value and hence of all profit, this changing ratio yields the horrendous
    result that“either the rate of profit declines or the price of products increases.”
    Hence “price will tend to rise faster than real wages, purchasing power will be
    reduced, and it will be deducted from the income available to individuals for
    the purchase of consumers.”The suspicion that Gorz is concerned not with ecology
    or even with environmentalism but with politics, specifically with economics,
    not only emerges with stark clarity, but even his economics turns out to be highly
    dubious. His crudity is matched only by its simplicity. To Gorz, price rises are
    the result not primarily of oligopolistic or monopolistic manipulations of the
    market but by diminishing profits due to increasing capital costs. As it turns
    out, this is precisely the argument that the bourgeoisie itself uses against environmental
    controls. For Gorz to ignore the profound structural changes in modern capitalism
    such as price-fixing in order to rehabilitate Marx’s most dubious theories in
    the so-called free market era of the last century reflects poorly not only on
    Gorz the environmentalist but on Gorz'
