    Odell, energy consultant to the British government observes: “The so-called ‘generally
    accepted oil shortage’ is the outcome of commercially oriented interests rather
    than a statement of the essential realities of the oil resources of the world.”
    That the “bonanza” oil field like the Texas and Oklahoma ones of the 1920s and
    the Near Eastern ones of the 1960s are limited may be true as things stand now,
    but a mass of material can be adduced to demonstrate that current energy and mineral
    shortages are the result of oligistic market manipulation and controlled petroleum
    production for price advantages. Indeed, if we were to believe the “official”
    estimates of various governmental agencies (based almost entirely on oil company
    reports), we should have exhausted our oil reserves in 1925, 1950, and now, 1980–90.
    There is no serious evidence that the latest estimates are authentic or based
    on real facts other than those that the energy industry wants us to believe. For
    example, the Oil and Gas Journal placed the world’s “proven reserves” outside
    of the so-called socialist world at seventy-two billion barrels. Recent evidence
    now reveals that some 230 billion barrels of oil discovered prior to 1950 somehow
    failed to appear in the 1950 estimate. This game has gone on repeatedly and seems
    to find no echo in Gorz’s book.


    Much of the same is true of metals and minerals. Estimates of declining lead,
    zinc, bauxite, manganese, chrome, and similar resources have flooded the press,
    but much of the data is specious at best and deliberately misleading at worst.
    Traditional mining operations are largely privately worked, and fears of shortages
    serve the interests of price-fixing operations, not to speak of costly imperialistic
    policies. Some of the most grim predictions of the Brookings Institution’s John
    Titlon are tinged with irony. If the reader finds his predictions “disconcerting,”
    Titlon notes, many important mineral resources are increasing at an even faster
    rate than they are depleted and an acceptable substitute can be found for virtually
    every diminishing mineral in use today. Which is not to say that capitalism can
    plunder the world forever. But the greatest danger these practices raise is not
    depletion but simplification and the limits to capitalist expansion are ecological,
    not geological.'
