  md: 'city’s form—or lack of form—speaks the dissolution of its civic integrity.

    To say with Marx that the modern city urbanizes the land is testimony not so much
    to its dominance as its loss of identity. For the city, by the very nature of
    the case, disappears when it becomes the whole, when it lacks the specificity
    provided by differentiation and delineability of form.


    Caught in the contradiction between ideal and real, city planning emerges not
    merely as ideology but as myth. The myth originates in the nomenclature and pedigree
    that this seeming discipline “city planning” appropriates for itself. Juxtaposed
    to the megalopolis, the formless urbanity sprawls across the land and devours,
    the word “city” has already become a euphemism, an erstwhile reality digested
    by Lewis Mumford so justly calls the “anti-city.” In dealing with the putative
    fact, city planning entrenches the shadow of the real in a futile effort to stake
    out a legacy to what is forever gone. Even more basely, it subtly devalues this
    memory in the very act of invoking it, for if the shadow must be presented as
    the real, the real must be degraded. Accordingly, city planning reduces all that
    is vital in the traditional city, including the ideal itself, to a deadening caricature—the
    megalopolis as “city,” the non-city as the representation of its very antithesis.
    All the high standards of urbanity, as these have been developed over the centuries,
    have degraded to establish a false continuity between past and present, to offer
    up the death of the city as the token of its life.


    The word “planning” merely compounds this grotesque act of violation. To the modern
    mind, “planning” implies rationality, a conceptual purposiveness that brings order
    to disorder, that reorganizes chance and contingency into humanly meaningful design.
    Behind the seeming rationality imparted to this word lie inherent social irrationality.
    Under capitalism, “planning” is basically the conscious organization of scarcity
    amid abundance, the attempt to impose a social nexus of want, denial, and toil
    on a technological system that, potentially at least, could remove all of these
    dehumanizing conditions from social life. Thus, “planning” emerges not only as
