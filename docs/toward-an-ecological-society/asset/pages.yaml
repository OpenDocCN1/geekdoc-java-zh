- pgno: 89
  md: 'the public sphere is followed by the shriveling of the private sphere—that
    inviolable area which is presumably the last refuge of the individual in an overly
    centralized and bureaucratized society. The ego, increasingly desiccated by the
    aridity of the social sphere, becomes fit material for mass culture, stereotyped
    responses, and a preoccupation with trivia.¹¹¹


    A human habitat minimally presupposes human scale, that is to say, a scale that
    lends itself to public comprehension, individual participation, and face-to-face
    relationships. But a caveat must be sounded: it is not enough to deal with such
    a habitat exclusively in terms of its artifacts or its dimensions. Even the most
    delicately wrought “garden cities” do not make a human habitat if the term “human”
    is to mean more than pleasant vistas, comfortable homes, and efficient logistics.
    The “big” literally dwarfs the ego, but the “small” does not in itself elevate
    it. Beyond “big” or “small” are the compelling problems of the “just” and “good”
    in the Hellenic and libertarian sense of these terms: the “good life” as a materially
    secure and reflexive one, the “good society” as an ethical community based on
    justice, public participation, and mutual concern. For Greek “science,” if such
    it be called in the modern sense of the term, is rarely free of an ethical stance
    toward reality and experience. To Plato and Aristotle, the analysis of phenomena
    at all levels of reality is never exhausted by the strictly descriptive query,
    “how?” Analysis must include an acknowledgment of functional interrelation, indeed,
    of a metaphysical *telos*, which is expressed by the intentional query “why?”¹²
    Despite the high degree of secularism and factual systematization that Greek thought
    (especially in Aristotle’s extant writings) introduced into the Western intellectual
    tradition, its center was ethically and its orientation was human and social.


    Thus, it is patently impossible to describe a habitat strictly in terms of its
    physical attributes, however important they may be. Eventually, any such description
    must include the political infrastructure, institutions, interpersonal relations,
    and guiding values that justify the use of the word “human.” In the absence of
    these political, institutional, psychological, and moral elements, the description
    becomes a mere inventory of things and structures, an artifactual aggregate that
    may secure the individual’s self-preservation and creature comforts explains nothing
    about the development of his selfhood and moral outlook.'
