  img_proc: true
- pgno: 67
  md: 'played a crucial role in stopping the Ravenswood reactor in 1963. Hence, I
    can hardly be described as an interloper or newcomer to the ecology movement.
    My remarks in this letter are the product of a very extensive experience as well
    as my individual concern for ideas that have claimed my attention for decades.


    It is my conviction that my work and experience in all of these areas would mean
    very little if they were limited merely to the Nukes themselves, however important
    each one may be in its own right. “No Nukes,” or for that matter, no food additives,
    by agribusiness, or no nuclear bombs is simply not enough if our horizon is limited
    to each issue alone. Of equal importance is the need to reveal the toxic social
    causes, values, and inhuman relations that have created a planet that is already
    vastly poisoned.


    Ecology, in my view, has always meant social ecology: the conviction that the
    very concept of dominating nature stems from the domination by human being, induced
    of women by men, of the young by their elders, of one ethnic group by another,
    of society by the state, of the individual bureaucracy, as well as of one economic
    class by another or a colonized people by a colonial power. To my thinking, social
    ecology has to begin its quest for freedom not only in the factory but also in
    the family, not only in the economy but also in the psyche, not only in the material
    conditions of life but also in the spiritual ones. Without changing the most molecular
    relationships in society—notably, those between men and women, adults and children,
    and other ethnic groups, heterosexuals and gays (the list, in fact, considerable)—society
    will be riddled by domination in a socialist “classless” and “non-exploitative”
    form. It would be infused by hierarchy even as it celebrated the dubious virtues
    of “people’s democracies,” “socialism,” and the “public ownership” of “natural
    resources.” And as long as hierarchy persists, as long as domination organizes
    humanity around a system of elites, the project of dominating nature will continue
    to exist and inevitably lead our planet to ecological extinction.


    The emergence of the women’s movement, even more so than the counterculture, the
