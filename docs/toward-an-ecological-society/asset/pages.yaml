  md: 'vocational ties of the past. What unites humanity in the bourgeois marketplace
    is competition: the universal antagonism of each against all. Graduated to the
    level of competing capitals, of grasping and warring bourgeois enterprises, the
    marketplace dictates the ruthless maxim: “Grow or die”—he who do not expand his
    capital and devour his competitor will be devoured. In this constellation of ever-regressive
    as relationships, where even personality itself is reduced to an exchangeable
    object, society is ruled by production for the sake of production. Equivalence
    asserts itself as exchange value; through the mediation of money, every artistic
    work, indeed every moral qual, is degraded to an exchangeable quantum. Gold or
    its paper symbol makes it possible to exchange the most measured cathedral for
    so many matchsticks. The manufacturer of shoelaces can transmute his wares into
    a Rembrandt painting, beggars the talents of the most powerful alchemist.


    In this quantitative domain of equivalences, which is ruled by production for
    the sake of production and growth is the only antidote to death, the natural world
    is reduced to natural resources—the domain of wanton exploitation par excellence.
    Capitalism not only validates precapitalist notions of the domination of nature
    by man; it turns the plunder of nature into society’s law of life. To quick with
