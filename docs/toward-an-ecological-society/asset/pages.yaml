  md: '# Marxism as Bourgeois Sociology


    Marx’s work, perhaps the most remarkable project to demystify bourgeois social
    relations, has itself become the most subtle mystification of capitalism in our
    era. I refer not to any latent “positivism” in the Marxist corpus or to any retrospective
    recognition of its “historical limits.” A serious critique of Marxism must begin
    with its innermost nature as the most advanced product—indeed,the culmination—of
    the bourgeois Enlightenment. It will no longer suffice to see Marx’s work as the
    point of departure for a new social critique, to accept its “method” despite the
    limited content it yielded in its day, to extol its goals as liberatory apart
    from its means, to view the project as tainted by its dubious heirs or adherents.


    Indeed, Marx’s “failure” to develop a radical critique of capitalism and a revolutionary
    practice emerges not even as a failure in the sense of an enterprise that remains
    inadequate to its goals. Quite to the contrary. At its best, Marx’s work is an
    inherent self-deception that inadvertently absorbs the most questionable tenets
    of Enlightenment thought into its sensibility and remains surprisingly vulnerable
    to their bourgeois implications. At its worst, it provides the most subtle apology
    for a new historic that has witnessed the melding of the “free market” with economic
    planning, private property with nationalized property, competition with the oligopolistic
    manipulation of production and consumption, the economy with the state—in short,
    the modern epoch of state capitalism. The surprising congruence of Marx’s “scientific
    socialism”—a socialism that realized the goals of economic rationalization, planned
    production, and a “proletarian state” as essential elements of the revolutionary
    project—with the inherent development of capitalism toward monopoly, political
    control, and a seemingly “welfare state” has already brought institutionalized
    Marxist tendencies such as Social Democracy and Euro-Communism into open complicity
    with the stabilization of a highly rationalized era of capitalism. Indeed, by
    a slight shift of perspective, we can easily use Marxist ideology to describe
    this state capitalist era as'
  merge: -1
  img_proc: true
- pgno: 148
  md: '“socialist.”


    Can such a shift of perspective shrugged off as a “vulgarization” or “betrayal”
    of the Marxian project? Or does it comprise the very realization of Marxism’s
    most fundamental assumptions—a logic that may have even hidden to Marx himself?
    When Lenin describes socialism as “nothing but state capitalist monopoly made
    to benefit the whole people,” does he violate the integrity of the Marxian project
    with his own “vulgarizations?” Or does he reveal underlying premises of Marxian
    theory that render it historically into the most sophisticated ideology of advanced
    capitalism? What is basically whether there are shared assumptions between all
    Marxists that provide real premises for Social-Democratic and Euro-Communist practice
    and Lenin’s futuristics. A theory that is so readily “vulgarized,” “betrayed,”
    or, more sinisterly, institutionalized into bureaucratic power forms by nearly
    all of its adherents may well be that lends itself to such “vulgarizations,” “betrayals,”
    and bureaucratic forms as a *normal condition of its existence*. What may seem
    to be “vulgarizations,” “betrayals,” and bureaucratic manifestations of its tenets
    in the heated light of doctrinal posits in the cold light of historical development
    may prove to be the fulfillment of its tenets. In case, all the historical roles,
    today, seem to have been totally miscast. Rather than refurbishing Marxism so
    that it can catch up with the many advanced phases of modern capitalism, it may
    well be that the many advanced phases of modern bourgeois countries have yet to
    catch up with Marxism as the most sophisticated *ideological anticipation of the
    capitalist development*.


    Let be no mistake that I am engaged in an academic play of words. Reality exhibits
    even more compelling paradoxes than theory. The Red Flag flies over a world of
    socialist countries that stand at mutual war with each other, while Marxian parties
    outside their perimeter form indispensable props for an increasingly state capitalist
    world that, ironically enough, arbitrates between—or aligns itself with—its contending
    socialist neighbors. The proletariat, with its plebeian counterpart in the ancient
    world, shares alike in a system that sees its greatest threat from a diffuse populace
    of intellectuals, urban dwellers, feminists, gays, environmentalists—in short,
    a transclass “people” that still expresses the utopian ideals of democratic revolutions
    long passed. To say that Marxism merely no'
