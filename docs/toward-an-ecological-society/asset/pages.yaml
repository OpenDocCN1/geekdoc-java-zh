  md: '“desirable” or “undesirable.” Spontaneity is integrally part of the very dialectic
    of self-consciousness and self-de-alienation that removes the subjective fetters
    established by the present order. To deny the validity of spontaneity is to deny
    the most literary dialectic that is occurring today; as such, for us it must be
    a given that exists in its own right.


    The term should be defined lest its content disappear quibbling. Spontaneity is
    not more impulse, certainly not in its most advanced and truly human form, and
    this is the only form that is discussing. Nor does spontaneity imply undelibrated
    behavior and feeling. Spontaneity is behavior, feeling, and thought that is free
    of external constraint, of imposed restriction. It is self-controlled, internally
    controlled, behavior, feeling, and thought, not an uncontrolled effluvium of passion
    and action. From the libertarian communist viewpoint, spontaneity implies a capacity
    in the individual to impose self-discipline and to formulate guidelines for social
    action. Insofar as the individual removes the fetters of domination that have
    stifled her self-activity, she or he is acting, feeling, and thinking spontaneously.
    We might as well eliminate the word “self” from “self-consciousness,” “self-activity,”
    and “selfmanagement” as remove the concept of spontaneity from our comprehension
    of the new Enlightenment, revolution, and communism. If there is an imperative
    need for a communist consciousness in the revolutionary movement today, we can
    never hope to attain it without spontaneity.


    Spontaneity does not preclude organization and structure. To the contrary, spontaneity
    yields nonhierarchical forms of organization, forms that are truly organic, self-created,
    and based on voluntarism. The only serious question that is raised in connection
    with spontaneity is whether it is informed or not. As I have argued elsewhere,
    the spontaneity of a child in a laboratory society will not be of the same order
    as the spontaneity of a youth, or that of a youth of the same order as that of
    an adult; each will simply be more informed, more knowledgeable, and more experienced
    than its junior.aries may seek to promote this informative process, but if they
    try to contain or destroy it by forming hierarchical movements, they will vitiate
    the very process of self-realization that will yield self-activity and a society
    based on self-management.


