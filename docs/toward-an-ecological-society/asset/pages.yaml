  md: 'to social ecology, The New Alchemy Institute and urban service groups such
    as the Institute for Local Self-Reliance exhibit a high degree of ideological
    sophistication.17 The assumption that John Todd, director of The New Alchemy Institute,
    is guided by a “practical, how-to-do it approach” (as a journalist once reported
    in a major New York daily) is grossly misleading.18 The New Alchemy Institute,
    which Todd did so much to establish, scores a major advance over many new technologists
    by integrating ecotechnologies into functionally interrelated systems that stand
    in marked contrast to the mutually exclusive units one often encounters at other
    research installations. The Institute’s windmills, solar collectors, aquaculture
    units, and, very significantly, its extensive gardens—all taken together—could
    be described as a highly unique ecosystem. Todd, is worth noting, explicitly acknowledges
    the influence of Kropotkin and other libertarian thinkers on his decentralistic
    and integrative outlook. He views his work as a project to alter social consciousness
    and human sensibility as well as technical practice.19


    This emphasis on the integration of small-scale ecotechnologies acquires a distinct
    communitarian thrust in the work of the Institute for Local Self Reliance The
    Institute, occupied with most modest rooftop gardens, solar energy units, waste
    recycling, and retrofitting projects in the very midst of Washington, DC.20 Ecotechnologies
    are expressly viewed by the Institute’s members as a means for achieving a new
    kind of urban community based on popular control of the resources and institutions
    that affect the urban dweller’s life. They stress full public participation in
