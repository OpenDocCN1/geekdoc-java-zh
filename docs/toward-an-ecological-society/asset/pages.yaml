  md: 'formation with administration placed the institutional emphasis of classical
    socialism on centralized bodies, indeed, by an ironic twist of historical events,
    bestowing the privilege of formulating policy on the “higher bodies” of socialist
    hierarchies and their execution precisely on the more popular “revolutionary committees”
    below.


    Similarly, the concept of “representation” intermingled with “direct democracy”
    serves to obscure the distinction between popular institutions that should decide
    policy and “representative” institutions that should merely execute them. In this
    connection, Rousseau’s famous passage on the constitutive nature of a “people”
    in The Social Contract applies even more to the “mass society” of our times than
    the institutionally articulated one of his era. “Sovereignty, for the same reason
    that makes it inalienable, cannot be represented,” Rousseau declares. “It lies
    essentially in the general will, and will not admit of representation: it is either
    the same or other; there is no intermediate possibility. The deputies of the people,
    therefore, are not merely their stewards and can carry through without dictates.
    Every law the people has not ratified in person is null and void—, in fact, not
    a law. The people of England regards itself as free; but it is grossly mistaken:
    it is free only during the election of members of parliament. As soon as they
    are elected, slavery overtakes it, and it is nothing.” However problematic Rousseau’s
    concept of “general will” may be, quite aside from his archaic concept of “law,”
    the premises under it cannot be evaded “the moment a people allows itself to be
    represented, it is no longer free.”² (My emphasis—M.B.)


    It is precisely in terms of a “general will” more libertarian and individuated
    than any conceived by Rousseau that the workers’ councils, soviets, and the Räte
    are revealed to be socially onesided and potentially hierarchical. Councils may
    be popularly constituted, but they are not constitutive of a “public sphere.”
    As the locus of the decision-making process in society, they absorb within executive
    bodies the liberties that more appropriately belong to a clearly delineable body
    politic and thereby subvert institutions such as communes, cooperatives, and popular
    assemblies that indeed constitute a people and express a popular will. Councils,
    in effect, usurp the political subjectivity that should be shared by all social
    forms that express the individual’s claim to social sovereignty.'
