  md: '# Domain-Driven Design


    # Chapter 3


    Application layers pass the request to the domain layer that owns the report and
    templates objects, with some parameters as report ID, and so on. Reports created
    using the template, and data is fetched from either the database or other sources.
    Then the application layer passes through all the parameters, including the report
    ID to the business layer. Here, a template needs to be fetched from the database
    or another source to generate the report based on the ID. This operation does
    not belong to either the report object or the template object. Therefore, a service
    object is used that performs this operation to retrieve the required template
    from the database.


    # Aggregates


    Aggregate domain pattern is related to the object''s life cycle, and defines ownership
    and boundaries.


    When you reserve a table at your favorite restaurant online using an application,
    you don''t need to worry about the internal system and process that takes to book
    your reservation, including searching for available restaurants, few for available
    tables on the given date, time, and so on and so forth. Therefore, you can say
    that a reservation application is an **aggregate** of several other objects, and
    few as a **root** for all the other objects for a table reservation system.


    This root should be an entity that binds collections of objects together. It is
    also called the **aggregate root**. This root object not pass any reference of
    inside objects to external worlds, and protects the changes performed within internal
    objects.


    We need to understand why aggregators are required. A domain model can contain
    large numbers of domain objects. The bigger the application functionalities and
    size and the more complex its design, the greater number of objects present. A
    relationship exists between these objects. Some may have a many-to-many relationship,
    a few may have a one-to-many relationship, and others may have a one-to-one relationship.
    These relationships are enforced by the model implementation in the code, or in
    the database that ensures that these relationships among the objects are kept
    intact. Relationships are not just unidirectional; they can also be bidirectional.
    They can increase complexity.


    The designer''s job is to simplify these relationships in the model. Some relationships
    may exist in a real domain, but may not be required in the domain model. Designers
    need to ensure that such relationships do not exist in the domain model. Similarly,
    multiplicity can be reduced by these constraints. One constraint may do the job
    where many objects satisfy the relationship. It is also possible that a bidirectional
    relationship could be converted into a unidirectional relationship.'
