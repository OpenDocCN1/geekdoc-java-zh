    Microservices are generally deployed using image containers such as Docker that
    provide the log with commands that help you to read logs of services deployed
    inside the containers. Docker and Docker Compose provide commands to stream the
    log output of running services within the container and in all containers respectively.
    Please refer to the following logs command of Docker and Docker Compose:


    Docker logs command:


    ```

    Usage: docker logs [OPTIONS] <CONTAINER NAME>

    ```


    Fetch the logs of a container:


    ```

    -f, --follow Follow log output

    --help Print usage

    --since=" Show logs since timestamp

    -t, --timestamps Show timestamps

    --tail="all" Number of lines to show from the end of the


    ```


    logs


