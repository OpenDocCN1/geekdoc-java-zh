  md: '# Login page


    When a user clicks on the **Reserve** button on the **Restaurant Detail** page
    after selecting the date and time of the reservation, the **Restaurant Detail**
    page checks whether the user is already logged in or not. If the user is not logged
    in, then the **Login** page displays. It looks like the following screenshot:


    ![](img/f551c3d57000fcdbbc1268267d5af69e_237_0.png)


    > We are not authenticating the user from the server. Instead, we are just populating
    the user name in the session storage and root scope for implementing the flow.


    Once the user logs in, they are redirected back to the same booking page with
    the persisted state. Then, the user can proceed with the reservation. The **Login**
    page uses basically two files: `login.html` and `login.js`.'
