    }\npublic void setFunction(String function) {\n    this.function = function;\n\
    }\n```\n\n# Writing the REST controller class\n\nRoy Fielding defined and introduced\
    \ the term Representational State Transfer (REST) in his doctoral dissertation.\
    \ REST is a style of software architecture for a distributed hypermedia system\
    \ as WWW. REST refers to those systems that conform to REST architecture properties,\
    \ principles, and constraints.\n\nNow, you'll create a REST controller to handle\
    \ the Calculation resource. The controller handles the HTTP requests in the Spring\
    \ RESTful web service implementation.\n\n# The @RestController annotation\n\n\
    @RestController is a class-level annotation used for the resource class introduced\
    \ in Spring 4. It is a combination of @Controller and @ResponseBody, and because\
    \ of it, a class returns a domain object instead of a view.\n\nIn the following\
    \ code, you can see that the CalculationController class handles GET requests\
