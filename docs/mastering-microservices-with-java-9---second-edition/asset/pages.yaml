    such as EC2, Spinnaker and Aminator help you to do that in an autonomous way.


    # Service registration and discovery - Eureka


    Eureka, as we have explored in this book, provides a service that is responsible
    for microservice registration and discovery. On top of that, Eureka is also used
    for load balancing the middle tier (processes hosting different microservices).
    Netflix also uses Eureka, with other tools, such as Cassandra or memcached, to
    enhance its overall usability.


    Service registration and discovery is a must for microservice architecture. Eureka
    serves this purpose. Please refer to Chapter 4, Implementing a Microservice, for
    more information about Eureka.


    # Service communication - Ribbon


    Microservice architecture is of no use if there is no interprocess or service
    communication. The Ribbon application provides this feature. Ribbon works with
    Eureka for load balancing and with Hystrix for fault tolerance or circuit breaker
    operations.'
