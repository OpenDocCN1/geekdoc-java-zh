  md: '# OAuth 2.0 roles


    There are four roles defined in the OAuth 2.0 specifications:


    +   - Resource owner

    - Resource server

    - Client

    - Authorization server


    ![](img/f551c3d57000fcdbbc1268267d5af69e_179_0.png)'
  merge: -1
  pgno: 179
- img_proc: true
  md: 'Securing Microservices


    Chapter 7


    # Resource owner


    For the example of a Quora sign in using Twitter, the Twitter user was the resource
    owner. The resource owner is an entity that owns the protected resources (for
    example, user handle, tweets, and so on) that are be shared. This entity can be
    an application or a person. We call this entity the resource owner because it
    can only grant access to its resources. The specifications also define that when
    the resource owner is a person, they are referred to as an end user.


    # Resource server


    The resource server hosts the protected resources. It should be capable of serving
    the access requests to these resources using access tokens. For the example of
    a Quora sign in using Twitter, Twitter is the resource server.


    # Client


    For the example of the Quora sign in using Twitter, Quora is the client. The client
    is the application that makes access requests for protected resources to the resource
    server on behalf of the resource owner.


    # Authorization server


    The authorization server provides different tokens to the client application,
    such as access tokens or refresh tokens, only after the resource owner authenticates
    themselves.


    OAuth 2.0 does not provide any specifications for interactions between the resource
    server and the authorization server. Therefore, the authorization server and resource
    server can be on the same server, or can be on a separate one.


    A single authorization server can also be used to issue access tokens for multiple
    resource servers.'
  merge: -1
  pgno: 180
- img_proc: true
  md: '# OAuth 2.0 client registration


    The client that communicates with the authorization server to obtain the access
    key for a resource should first be registered with the authorization server. The
    OAuth 2.0 specification does not specify the way client registers with the authorization
    server. Registration does not require direct communication between the client
    and the authorization server. Registration can be done using self-issued or third-party-issued
    assertions. The authorization server obtains the required client properties using
    one of the assertions. Let''s see what the client properties are:


    +   - Client type (discussed in the next section)

    - Client redirect URI, as discussed in the example of a Quora sign in using Twitter.
    This is one of the endpoints used for OAuth 2.0. We will discuss other endpoints
    in the Endpoints section.

    - Any other information required by the authorization server, for example, client
    name, description, logo image, contact details, acceptance of legal terms and
    conditions, and so.


    # Client types


    There are two types of client described by the specification, based on their ability
    to maintain the confidentiality of client credentials: confidential and public.
    Client credentials are secret tokens used by the authorization server of clients
    to communicate with them. The client types are described as follows:


    +   - Confidential client type: This is a client application that keeps passwords
    and other credentials securely or maintains them confidentially. In the example
    of a Quora sign in using Twitter, the Quora application server is secure and has
    restricted access implementation. Therefore, it is one of the client client type.
    Only the Quora application administrator has access to client credentials.

    - Public client type: These are client applications that do not keep passwords
    and other credentials securely or maintain them confidentially. Native app on
    mobile or desktop, or an app that runs on a browser, are perfect examples of public
    client type, as these keep client credentials are embedded inside them. Hackers
    can crack these and the client credentials can be revealed.


    A client can be a distributed component-based application, for example, it could
    have both a web browser component and a server-side component. In this case, both
    components will have different client types and security contexts. Such a client
    should register each component as a separate client if the authorization server
    does not support such clients.'
