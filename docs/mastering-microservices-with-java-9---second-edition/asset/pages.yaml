- img_proc: true
  md: '# Implementing a Microservice


    # Chapter 4


    The preceding diagram shows how each microservice works independently. This is
    the reason microservices can be developed, enhanced, and maintained separately,
    without affecting others. These services can each have their own layered architecture
    and database. There is no restriction to use the same technologies, frameworks,
    and languages to develop these services. At any given point in time, you can introduce
    new microservices. For example, for accounting purposes, we can introduce an accounting
    service that can be exposed to restaurants for bookkeeping. Similarly, analytics
    and reporting are other services that can be integrated and exposed.


    For demonstration purposes, we will only implement the three services shown in
    the preceding diagram.


    # Developing and implementing microservices


    We will use the domain-driven implementation and approach described in the last
    chapter to implement the microservices using Spring Cloud. Let''s revisit the
    key artifacts:


    +   Entities: These are categories of objects that are identifiable and remain
    the same throughout the states of the product/services. These objects are not
    defined by their attributes, but by their identities and threads of continuity.
    Entities have traits as identity, a thread of continuity, and attributes that
    do not define their identity.


    +   Value objects (VOs) just have the attributes and no conceptual identity. A
    best practice is to keep VOs as immutable objects. In the Spring Framework, entities
    are pure POJOs; therefore we''ll also use them as VOs.


    +   Service objects: These are common in technical frameworks. These are also
    used in the domain layer in domain-driven design. A service object does not have
    an internal state; the only purpose of it is to provide the behavior to the domain.
    Service objects provide behaviors that cannot be related with specific entities
    or VOs. Service objects may provide one or more related behaviors to one or more
    entities or VOs. It is best practice to define the services explicitly in the
    domain model.


    +   Repository objects: A repository object is part of the domain model that interacts
    with storage, such as databases, external sources, and so on, to retrieve the
    persisted objects. When a request is received by the repository for an object
    reference, it returns the existing object reference. If the requested object does
    not exist in the repository, then it retrieves the object from storage.


