  md: 'Securing Microservices


    The authorization request (step four) to the authorization endpoint URI:


    | Parameter | Required/optional | Description |

    |--- | --- | --- |

    | response_type | Required | Code (this value must be used). |

    | client_id | Required | It represents the ID issued by the authorization server
    to the client at the time of registration. |

    | redirect_uri | Optional | It represents the redirect URI given by the client
    at the time of registration. |

    | scope | Optional | The scope of the request. If not provided, then the authorization
    server provides the scope based on the defined policy. |

    | state | Recommended | The client uses this parameter to maintain the client
    state between the requests and callback (from the authorization server). The specification
    recommends it to protect against cross-site request forgery attacks. |


    Authorization response (step five):


    | Parameter | Required/optional | Description |

    |--- | --- | --- |

    | code | Required | Code (authorization code) generated by the authorization server.
    Code should be expired after it is generated; the maximum recommended lifetime
    is 10 minutes. The client must not use the code more than once. If the client
    uses it more than once, then the request must be denied and all previous tokens
    issued based on the code should be revoked. Code is bound to the client ID and
    redirect URI. |

    | state | Required | It represents the ID issued by the authorization server to
    the client at the time of registration. |


