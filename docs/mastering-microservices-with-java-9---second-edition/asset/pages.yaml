  md: '# Migrating modules to microservices


    Now, you have one server-side monolithic application and one or more UI applications.
    It gives you one advantage of consuming the APIs while separating the modules
    from existing monolithic applications. For example, after separation of UI applications,
    you might transform one of the modules to a microservice. Once the UI applications
    are successfully tested, API calls related with this module can be routed to the
    newly transformed module instead of the monolithic API. As shown in next diagram,
    when API GET/customer/1 is called, the Gateway can route the request to the Customer
    Microservice instead of the Monolithic application.


    You can also perform the testing on production before making the new microservice-based
    API by comparing the response from both monolithic and microservice modules. Once
    we have consistently matching responses, we can be sure that the transformation
    is done successfully and API calls can be migrated to the refactored module API.
    As shown in the following figure, a component is deployed that makes another call
    to a new customer API when called. Then, it compares the responses of both the
    calls and stores the results. These results can be analyzed and a fix should be
    delivered for any inconsistency. When a response from a newly transformed microservice
    matches with the existing monolithic responses, you can stop routing the calls
    to existing monolithic applications and replace it with new microservice.


    Following this approach allows you to migrate modules one by one to a microservice,
    and at one point in time, you can migrate all monolithic modules to microservices.


    ![](img/f551c3d57000fcdbbc1268267d5af69e_299_0.png)'
  merge: -1
  pgno: 299
- img_proc: true
  md: '# How to accommodate a new functionality during migration


    A new functionality should be avoided in ideal scenarios during migration. Only
    important fixes and security changes should be allowed. However, if there is an
    urgency to implement a new functionality, then it should be developed either in
    a separate microservice or in a modular way to existing monolithic code that makes
    its separation from existing code easier.


    For example, if you really need a new feature in the customer module that you
    can simply create a new customer microservice and use it for specific API calls,
    by external world or through other modules. It is up to you whether you use REST
    calls or for inter-process communication.


    Similarly, if you need a new functionality that has dependency on other modules
    (for example, a new functionality having a dependency on booking) and it is not
    exposed as an API to a UI or service API, then it can still be developed as a
    separate microservice, as shown in the following diagram. The customer module
    calls a newly developed microservice and then calls the booking module for request
    processing and provides the response back to the customer module. Here, for inter-process
    communication, REST or events could be used.


    ![](img/f551c3d57000fcdbbc1268267d5af69e_300_0.png)


    Implementing a new module as a microservice that calls another module'
