  md: "# Consuming Services Using a Microservice Web Application\n\nWe have also added\
    \ a few of the filters in the restaurants.js module to format the date and time.\
    \ These filters perform the following formatting on the input data:\n\n+   - date1:\
    \ Returns the input date in dd MMM yyyy format, for example, 13-Apr-2016\n- time1:\
    \ Returns the input time in HH:mm:ss format, for example, 11:55:04\n- datetime1:\
    \ Returns the input date and time in dd MMM yyyy HH:mm:ss format, for example,\
    \ 13-Apr-2016 11:55:04\n\nIn the following code snippet, we've applied the three\
    \ filters:\n\n```\n.filter('date1', function ($filter) {\n  return function (argDate)\
    \ {\n    if (argDate) {\n      var d = $filter('date') (new Date(argDate), 'dd\
    \ MMM\nyyyy');\n      return d.toString();\n    }\n    return \"\"\n  }\n}\n.filter('time1',\
    \ function ($filter) {\n  return function (argTime) {\n    if (argTime) {\n  \
    \    return $filter('date') (new Date(argTime), 'HH:mm:ss');\n    }\n    return\
    \ \"\"\n  }\n}\n.filter('datetime1', function ($filter) {\n  return function (argDateTime)\
    \ {\n    if (argDateTime) {\n      return $filter('date') (new Date(argDateTime),\
    \ 'dd MMM\nyyyy HH:mm a');\n    }\n    return \"\"\n  }\n}\n\n```"
