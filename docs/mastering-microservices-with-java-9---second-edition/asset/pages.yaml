    \ It will make our job easier when building services for various platforms. We\
    \ need to configure the following four properties:\n\n+   - We will use the Spring\
    \ profile identified as Docker.\n- There won't be any conflict of ports among\
    \ embedded Tomcat, since services will be executed in their own respective containers.\
    \ We can now use port 8080.\n- We will prefer to use an IP address to register\
