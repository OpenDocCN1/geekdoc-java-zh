  md: '# Domain-Driven Design


    # Chapter 3


    The main advantage of using the repository is having a consistent way to retrieve
    objects where the requestor does not need to interact directly with the storage,
    such as one or more databases, filesystems, or factory repositories, and so on.


    A repository may query objects from various storage types, such as databases,
    filesystems, factory repositories, and so on. In such cases, a repository may
    have strategies that also point to different sources for different object types
    or categories:


    ![](img/f551c3d57000fcdbbc1268267d5af69e_82_0.png)


    As shown in the repository object flow diagram, the repository interacts with
    the infrastructure layer, and this interface is part of the domain layer. The
    requestor may belong to a domain layer, or an application layer. The repository
    helps the system to manage the life cycle of domain objects.


    # Factory


    A factory is required when a simple constructor is not enough to create the object.
    It helps to create complex objects, or an aggregate that involves the creation
    of other related objects.


    A factory is also a part of the life cycle of domain objects, as it is responsible
    for creating them. Factories and repositories are in some way related to each
    other, as both refer to domain objects. The factory refers to newly created objects,
    whereas the repository returns the already existing objects either from the memory,
    or from external storage.'
