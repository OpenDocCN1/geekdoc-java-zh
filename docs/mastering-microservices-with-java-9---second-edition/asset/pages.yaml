    \nAn AngularJS module has two important parts, `config()` and `run()`, apart from\
    \ other components such as controllers, services, filters, and so on:\n\n+   *\
    \ `config()` is used for registering and configuring the modules and it only entertains\
    \ the providers and constants using `$injector`. `$injector` is an AngularJS service.\
    \ We'll cover providers and `$injector` in the next section. You cannot use instances\
    \ here. It prevents the use of services before it is fully configured.\n\n+  \
    \ * `run()` is used for executing the code after `$injector` is created using\
    \ the preceding `config()` method. This only entrains the instances and constants.\
    \ You cannot use providers here to avoid configuration at runtime.\n\n# Providers\
    \ and services\n\nLet's have a look at the following code:\n\n```\n.controller('optsAppCtrl',\
    \ function ($injector) {\n  var log = $injector.get('$log');\n```\n\nlog` is a\
    \ built-in AngularJS service that provides the logging API. Here, we are using\
    \ another built-in service, `$injector`, which allows us to use the `$log` service.\
    \ `$injector` is an argument in the controller. AngularJS uses function definitions\
    \ and regex to provide the `$injector` to a caller, also known as the controller.\
    \ These are examples of how AngularJS effectively uses the dependency injection\
    \ pattern.\n\nAngularJS heavily uses the dependency injection pattern, using the\
    \ injector service (`$injector`) to instantiate and wire most of the objects we\
    \ use in our AngularJS applications. This injector creates two types of objects—services\
