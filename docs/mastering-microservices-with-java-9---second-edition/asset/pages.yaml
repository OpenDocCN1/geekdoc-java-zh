  md: '# Consuming Services Using a Microservice Web Application


    For simplification, you can say that we (developers) define services. On the contrary,
    specialized objects are AngularJS items such as controllers, filters, directives,
    and so on.


    AngularJS provides five recipe types that tell the injector how to create service
    objects—provider, value, factory, service, and constant.


    +   - The provider is the core and most complex recipe type. Other recipes are
    synthetic sugar on it. We generally avoid using the provider except when we need
    to create reusable code that requires global configuration.

    - The value and constant recipe types work as their names suggest. Neither of
    them can have dependencies. Moreover, the difference between them lies with their
    usage. We cannot use service objects in the configuration phase.

    - Factory and service are the most used service types. They are of a similar type.
    We use the factory recipe when we want to produce JavaScript primitives and functions.
    On the other hand, the service is used when we want to produce custom-defined
    types.


    As we have some understanding of services, we can say that there are two common
    uses of services—organizing code and sharing code across applications. Services
    are already seen a few of the built-in AngularJS services such as $injector, $log,
    and so on. AngularJS services are prefixed with the $ symbol.


    # Scopes


    In AngularJS applications, two types of scopes are widely used—$scope and $scope:


    +   - $scope is the topmost object in the service hierarchy and has the global
    scope associated with it. That means that any variable you attach to it will be
    available everywhere, and therefore, the use of $scope should be a carefully considered
    decision.

    - Controllers have $scope as an argument in the callback function. It is used
    for binding data from the controller to the view. Its scope is limited to the
    use of the controller it is associated with.'
  merge: -1
  pgno: 215
