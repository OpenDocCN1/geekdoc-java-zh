  md: '# Mandatory services for good microservices


    There are a few patterns/services that should be in place for implementing microservice-based
    design. This list consists of the following:


    +   - Service discovery and registration

    - Edge or proxy server

    - Load balancing

    - Circuit breaker

    - Monitoring


    We''ll implement these services in this chapter to complete our OTRS system. Following
    is a brief overview. We will discuss these patterns/services in detail later.


    # Service discovery and registration


    The Netflix Eureka server is used for service discovery and registration. We created
    the Eureka server in the last chapter. It not only allows you to register and
    discover services, but also provides load balancing using Ribbon.


    # Edge servers


    An edge server provides a single point of access to allow the external world to
    interact with your system. All of your APIs and frontends are only accessible
    using this server. Therefore, these are also referred to as gateway or proxy servers.
    These are configured to route requests to different microservices or frontend
    applications. We''ll use the Netflix Zuul server as an edge server in the OTRS
    application.


    # Load balancing


    Netflix Ribbon is used for load balancing. It is integrated with the Zuul and
    Eureka services to provide load balancing for both internal and external calls.'
  merge: -1
