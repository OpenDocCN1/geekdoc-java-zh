  md: '# Authentication and authorization


    Providing authentication and authorization is de facto for web applications. We''ll
    discuss authentication and authorization in this section. The new paradigm that
    has evolved over the past few years is OAuth. We''ll learn and use OAuth 2.0 for
    implementation. OAuth is an open authorization mechanism, implemented in every
    major web application. Web applications can access each other''s data by implementing
    the OAuth standard. It has become the most popular way to authenticate oneself
    for various web applications. For example, on https://www.quasar.com/, you can
    register and log in using Google or Twitter login IDs. It is also more user friendly,
    as client applications (for example, https://www.quasar.com/) don''t need to store
    the user''s passwords. The end user does not need to remember one more user ID
    and password.


    ![](img/f551c3d57000fcdbbc1268267d5af69e_176_0.png)


    # OAuth 2.0


    The Internet Engineering Task Force (IETF) governs the standards and specifications
    of OAuth. OAuth 1.0a was the most recent version before OAuth 2.0 that was having
    a fix for the session-fixation security flaw in OAuth 1.0. OAuth 1.0 and 1.0a
    are very different from OAuth 2.0. OAuth 1.0 relies on security certificates and
    channel binding, whereas OAuth 2.0 works completely on Transport Layer Security
    (TLS). Therefore, OAuth 2.0 does not provide backward compatibility.'
  merge: -1
  pgno: 176
- img_proc: true
  md: '# Usage of OAuth


    The various uses of OAuth are as follows:


    +   - As discussed, it can be used for authentication. You might have seen it
    in various applications, displaying messages such as sign in using Facebook or
    a sign in using Twitter.

    - Applications can use it to read data from other applications, such as by integrating
    a Facebook widget into the application, or having a Twitter feed on your blog.

    - Or, the opposite of the previous point can be true: you enable other applications
    to access the end user''s data.


    # OAuth 2.0 specification - concise details


    We''ll try to discuss and understand the OAuth 2.0 specifications in a concise
    manner. Let''s first see how signing in using Twitter works.


    Please note that the process mentioned here was used at the time of writing, and
    may change in the future. However, this process describes one of the OAuth 2.0
    processes properly:


    +   1. The user visits the Quora home page, which shows various login options.
    We''ll explore the process of the Continue with Twitter link.

    2. When the user clicks on the Continue with Twitter link, Quora opens a new window
    (Chrome) that redirects the user to the www.twitter.com application. During this
    process, few web applications redirect the user to the same opened tab/window.

    3. In this new window/tab, the user signs in to www.twitter.com with their credentials.

    4. If the user has not authorized the Quora application to use their data, Twitter
    asks for the user''s permission to authorize Quora to access the user''s information.
    If the user has already authorized Quora, this step is skipped.

    5. After proper authentication, Twitter redirects the user to Quora''s redirect
    URI with an authentication code.

    6. Quora sends the client ID, client secret token, and authentication code (sent
    by Twitter in step five) to Twitter when the Quora redirect URI is entered in
    the browser.'
