- img_proc: true
  md: 'Migrating a Monolithic Application to Microservice-Based Application


    Chapter 11


    # Do you need to migrate?


    This is the first question that should set the tone for your migration. Do you
    really need to migrate your application to a microservice-based architecture?
    What benefits does it bring to the table? What are the consequences? How can we
    support the existing customers? Would existing customers support and bear the
    cost of migration to microservices? Do I need to write the code from scratch?
    How would the data be migrated to a new microservice-based system? What would
    be the timeline for this migration? Is existing team proficient enough to bring
    this change fast? Could we accept the new functional changes during this migration?
    Does our process in line to accommodate migration? So and so forth. I believe
    there would be plenty of similar questions that come to your mind. I hope, from
    all of the previous chapters, that you might have gained good knowledge of the
    work a microservice-based system requires.


    After all the pros and cons, your team would decide the migration. If the answer
    is yes, this chapter will help you on the way forward to migration.


    # Cloud versus on-premise versus both cloud and on-premise


    What is your existing offering to a cloud solution, an on-premise solution, or
    do you want to offer both cloud and on-premise solutions or do you want to start
    cloud offering along with on-premise solution. Your approach would be based on
    the kind of solution you offer.


    # Cloud only solution


    If you offer cloud solutions, your migration task is easier than the other two.
    Having that, it does not mean it would be a cake walk. You would have full control
    over migration. You have the liberty of not considering the direct impact of migration
    on customers. Cloud customers simply use the solution and are not bothered by
    how it has been implemented or hosted. I assume there is no API or SDK change,
    and obviously, migration should not involve any functional change. Microservice
    migration only on the cloud has the edge of using smooth incremental migration.
    This means that you would first transform the UI application, then one API/service,
    and then the next, so on and so forth. Mind you, you are in control.


    [ 280 ]'
  merge: -1
  pgno: 294
- img_proc: true
  md: 'Migrating a Monolithic Application to Microservice-Based Application Chapter
    11


    # On-premise only solution


    On-premise solutions are deployed on customer infrastructure. On top of that,
    you might have many clients with different versions deployed on their infrastructure.
    You don''t have full control of these deployments. You need to work with customers
    and a team effort is required for successful migration.


    Also, before you approach a customer, you should have the flesh migration solution
    ready. Having different versions of your product makes this extra difficult. I
    recommend offering migration of the latest version and while you developed migration,
    only security and break fixes should be allowed for customers. Yes, you should
    not offer new functionality at


    # Both cloud and on-premise solution


    If your application has both cloud and on-premise offering, then migration of
    on-premise solution to microservices could be in synchronization with the cloud
    or vice versa. This means that if you spend efforts migrating one, you can replicate
    the same on the other. Therefore, it includes changes mentioned earlier for either
    cloud or on-premise migration with addition to replication on other environments.
    Also, sometimes on-premise customers may have their own customization. It also
    needs to be taken care while migrating. Here, your own cloud solution should be
    migrated first to microservices, which can be replicated on-premises later.


    Migrating a production/solution offering only on-premise deployment, but you want
    of start cloud deployments also; this is most challenging. You are supposed to
    migrate your existing code as per my service design, making sure it also supports
    existing on-premise deployments. Sometimes, it could be a legacy technology stack,
    or even existing code might have been written using some proprietary technology
    like protocols. It could be that the design is not flexible enough to break into
    microservices. This type of migration offers the most challenges. An incremental
    migration of on-premise solution to microservices should be done, where you can
    separate the UI applications and offer external APIs that interact with UI applications.
    If APIs are already in place or your application is already divided into separate
    UI applications, believe me, it removes tons of baggage from migration. Then,
    you can focus on migrating the server-side code, including the APIs developed
    for UI applications. You might ask why we can''t migrate all UI applications,
    APIs, and server code together. Yes, you can. But, doing an incremental development
    would give you surety, confidence, and quick failures/learning. After all, Agile
    development gives you about incremental development.


    [ 281 ]'
  merge: -1
  pgno: 295
- img_proc: true
  md: '# Migrating a Monolithic Application to Microservice-Based Application


    If your existing code is not modular or contains lots of legacy code, then I would
    advise you to refactor it and make it modular. It would make your task easier.
    Having said that, it should be done by module. Break and refactor whatever code
    you can before migrating it to pure microservices.


    We''ll discuss a few approaches that might help you to refactor a large complex
    monolithic application into microservices.


    # Approaches and keys to successful migration


    Software modernization has been done for many years. A lot of work is done to
    perform successful software modernization. You will find it useful to go through
    all of the best practices and principles for successful software modernization
    (migration). In this chapter, we will talk specifically about software modernization
    of the microservice architecture.


    # Incremental migration


    You should transform monolithic applications to microservices in an incremental
    manner. You should not start the full-fledged migration of the whole code all
    together. It entangles the risk-reward ratio and increases the probability of
    failure. It also increases the probability of transition time and, hence, cost.
    You may want to break your code into different modules and start transforming
    each of the modules by one. It is quite likely that you may want to rewrite a
    few modules from scratch, which should be if the existing code is tightly coupled
    and too complex to refactor. But, writing the complete solution from scratch is
    a big no. You should avoid it. It increases the cost, time to migration, and the
    probability of failures.'
  merge: -1
