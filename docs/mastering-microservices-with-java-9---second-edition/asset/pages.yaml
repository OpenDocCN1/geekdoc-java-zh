    Angular-route, and app.js, our own developed custom JavaScript file. We have already
    discussed Angular and Angular-UI. app.js will be discussed in the next section.


    The modernizer allows developers to use new CSS3 and HTML5 features while maintaining
    a fine level of control over browsers that don''t support them. Basically, the
    modernizer performs the next generation feature detection (checking the availability
    of those features) while the page loads in the browser and produces the results.
    Based on these, you can detect what the latest features available in the browser
    are, and based on that, you can provide an interface to the user end. If the browser
    does not support a few of the features, then an alternate flow or UI is provided
    to the end user.


    We are also adding Bootstrap templates, which are written in JavaScript, using
    the bootstrap-tpls javascript file:


