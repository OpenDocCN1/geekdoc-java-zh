- img_proc: true
  md: '# Client identifier


    It is the authorization server''s responsibility to provide a unique identifier
    to the registered client. This client identifier is a string representation of
    the information provided by the registered client. The authorization server needs
    to make sure that this identifier is unique. The authorization server should not
    use it on its own for authentication.


    The OAuth 2.0 specification does not specify the size of the client identifier.
    The authorization server can set the size, and it should document the size of
    the client identifier it issues.


    # Client authentication


    The authorization server should authenticate the client based on their client
    type. The authorization server should determine the authentication method that
    suits and meets security requirements. It should use only one authentication method
    in each request.


    Typically, the authorization server uses a set of client credentials, such as
    the client password and some key tokens, to authenticate confidential clients.


    The authorization server may establish a client authentication method with public
    clients. However, it must not rely on this authentication method to identify the
    client, for security reasons.


    A client possessing a client password can use basic HTTP authentication. OAuth
    2.0 does not recommend sending client credentials in the request body, but recommends
    using TLS and brute force attack protection on endpoints required for authentication.


    # OAuth 2.0 protocol endpoints


    An endpoint is but a URI we use for REST or web components, such as Servlet or
    JSP. OAuth 2.0 defines three types of endpoints. Two are authorization server
    endpoints and one is a client endpoint:


    +   * Authorization endpoint (authorization server endpoint)

    * Token endpoint (authorization server endpoint)

    * Redirection endpoint (client endpoint)'
  merge: -1
  pgno: 185
- img_proc: true
  md: '# Securing Microservices


    # Authorization endpoint


    This endpoint is responsible for verifying the identity of the resource owner
    and, once verified, obtaining the authorization grant. We''ll discuss the authorization
    grant in the section.


    The authorization server requires TLS for the authorization endpoint. The endpoint
    URI must not include the fragment component. The authorization endpoint must support
    the HTTP GET method.


    The specification does not specify the following:


    +   - The way the authorization server authenticates the client.

    - How the client will receive the authorization endpoint URI. Normally, documentation
    contains the authorization endpoint URI, or the client obtains it at the time
    of registration.


    # Token endpoint


    The client calls the token endpoint to receive the access token by sending the
    grant or refresh token. The token endpoint is used by all authorization grants
    except the implicit grant.


    Like the authorization endpoint, the token endpoint also requires TLS. The client
    must use the HTTP POST method to make the request to the token endpoint.


    Like the authorization endpoint, the specification does not specify how the client
    will receive the token endpoint URI.'
  merge: -1
