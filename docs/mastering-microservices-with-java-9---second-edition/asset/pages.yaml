  md: "# Consuming Services Using a Microservice Web Application\n\nLet's understand\
    \ what default_sequence task performs:\n\n+   - As the defined default_sequence\
    \ task, first it will connect to the server, then build the web application, and\
    \ keep a watch on the changes. The watch will help to render changes we make in\
    \ the code and will be displayed immediately on the UI.\n- The most important\
    \ tasks in this script are connect and watch. Others are self-explanatory. So,\
    \ lets dig in them.\n- gulp-connect: This is a gulp plugin to run the web server.\
    \ It also allows for live reload.\n- gulp-watch:this is a file watcher whose chokidar\
    \ and emits vinyl objects (describe the file—its path and content). In simple\
    \ words, we can say that gulp-watch watches files for changes and triggers tasks.\n\
    \nThe gulpfile.coffee will look something like this:\n\n```\ngulp            \
