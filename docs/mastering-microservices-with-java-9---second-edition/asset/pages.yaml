  md: "# Making a sample REST application executable\n\nCreate a RestSampleApp class\
    \ with the annotation SpringApplication. The main method uses Spring's SpringApplication.run()\
    \ method to launch an application.\n\nWe will annotate the RestSampleApp class\
    \ with the @SpringBoot annotation that adds all of the following tags implicitly:\n\
    \n+   - The @Configuration annotation tags the class as a source of bean definitions\
    \ for the application context.\n- The @EnableAutoConfiguration annotation indicates\
    \ that Spring Boot is to start beans by classpath settings, other beans, and various\
    \ property settings.\n- The @EnableWebWebMvc annotation is added if Spring Boot\
    \ finds spring-mvc on the classpath. It treats the application as a web application\
    \ and activates key behaviors as setting up DispatcherServlet.\n- The @ComponentScan\
    \ annotation tells to look for other components, configurations, and services\
    \ in the given package:\n\n```\npackage com.packpub.mmj.rest;\n\nimport org.springframework.boot.SpringApplication;\n\
    import org.springframework.boot.autoconfigure.SpringBootApplication;\n\n@SpringBootApplication\n\
    public class RestSampleApp {\n    public static void main(String[] args) {\n \
    \       SpringApplication.run(RestSampleApp.class, args);\n    }\n}\n```\n\nThis\
    \ web application is 100 percent pure Java and you don't have to deal with configuring\
    \ any plumbing or infrastructure using XML; instead, it uses the Java annotation\
    \ that is made even simpler by Spring Boot. Therefore, there wasn't a single line\
    \ of XML except pom.xml for Maven. There wasn't even a web.xml file."
