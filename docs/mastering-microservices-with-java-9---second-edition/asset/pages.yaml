  md: '# AngularJS framework overview


    Now, since we are ready with our HTML5 web application setup, we can go through
    the basics of AngularJS. This will help us understand the AngularJS code section.
    This section depicts the high level of understanding that you can utilize to sample
    the application and explore further using AngularJS documentation or by referring
    to other Packt Publishing resources.


    AngularJS is a client-side JavaScript framework. It is flexible enough to be used
    as a model-view-controller (MVC) or a model-view-model (MVVM). It also provides
    built-in services such as $http or $log using a dependency injection pattern.


    # MVC


    MVC is a well-known design pattern. Struts and Spring MVC are popular examples.
    Let''s see how they fit in the JavaScript world:


    +   - **Model**: Models are AngularJS objects that contain the application. They
    also represent the state of the application.

    - **View**: View is a presentation layer that consists of HTML files. Here, you
    can show the data from models and provide the interactive interface to the user.

    - **Controller**: You can define the controller in JavaScript and it contains
    the application logic.


    # MVVM


    MVVM is an architecture design pattern that specifically targets the UI development.
    MVVM is designed to make two-way data binding easier provides the synchronization
    between the model and the view. When the model (data) changes, it reflects immediately
    on the view. Similarly, when the user changes the data on the view, it reflects
    on the model.


    +   - **Model**: This is very similar to MVC and contains the business logic and
    data.

    - **View**: Like MVC, it contains the presentation logic or user interface.

    - **View model**: A view model contains the data binding between the view and
    the model. Therefore, it is an interface between the view and the model.'
  merge: -1
  pgno: 212
- img_proc: true
  md: '# Modules


    A module is the first thing we define for AngularJS application. A module is a
    container that contains the different parts of the application, such as controllers,
    services, filters, and so on. An AngularJS application can be written in a single
    module or multiple modules. AngularJS can also contain other modules.


    Many other JavaScript frameworks use the `main` method for instantiating and wiring
    the different parts of the application. AngularJS does not have the `main` method.
    It uses the module as an entry point due to the following reasons:


    +   * **Modularity**: You can divide and create your application freedom-wise
    or with reusable components.

    * **Simplicity**: You might have come across complex and large application code,
    which makes maintenance and enhancement a headache. No more: AngularJS makes code
    simple, readable, and easy to understand.

    * **Testing**: It makes unit testing and end-to-end testing easier as you can
    override configuration and load only the modules that are required.


    Each AngularJS application needs to have a single module for bootstrapping the
    AngularJS application. our application requires the three parts:


    +   * **Application module**: A JavaScript file (`app.js`) that contains the AngularJS
    module, as shown:


    ```

    var otrsApp = AngularJS.module(''otrosApp'', [ ])

    // [ ] contains the reference to other modules

    ```


    +   * **Loading library and application module**: An index.html file containing
    the reference to the JavaScript file with other AngularJS libraries:


    ```

    <script type="text/javascript"

    src="bower-components/angular/angular.min.js"></script>

    <script type="text/javascript" src="scripts/app.js"></script>

    ```'
  merge: -1
