  md: '# Use of correlation ID for service calls


    When you make a call to any REST endpoint and if any pops up, it is difficult
    to trace the issue and its root origin because each call is made to a server,
    and this call may call another, and so and on forth. This makes it very difficult
    to figure out which particular request was transformed and what it was called.
    Normally, an issue that is caused by one service can have domino effect on other
    services or can fail service operation. It is very difficult to track and may
    require an enormous amount of effort. If it is monolithic, you know that you are
    looking in the right direction, but microservices can make it difficult to understand
    what the source of the issue is and where you should get your data.


    # Let''s see how we can tackle this problem


    By using a correlation ID that is passed across all calls, it allows you to track
    each request and track the route easily. Each request will have its unique correlation
    ID. Therefore, when we debug any issue, the correlation ID is our starting point.
    We can follow it, and along the way, we can find out what went wrong.


    The correlation ID requires some extra development effort, but it''s effort well
    spent as helps a lot in the long run. When a request travels between different
    microservices, you will be able to see all interactions and which service has
    problems.


    This is not something new or invented for microservices. This pattern is already
    being used by many popular products such as Microsoft SharePoint.


    # Use of Zipkin and Sleuth for tracking


    For the OTRS application, we''ll make use of Zipkin and Sleuth for tracking. It
    provides trace IDs and span IDs and a nice UI to trace the requests. More importantly,
    you can find out the time taken by each request in Zipkin and it allows you to
    drill down to find out the request that makes maximum time for serving the request.'
  merge: -1
