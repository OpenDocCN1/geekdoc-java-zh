  md: '# Best Practices and Common Principles


    Logging is another important aspect for microservices that should not be ignored.
    Having effective logging makes all the difference. As there could be 10 or more
    microservices, managing logging is a huge task.


    For our sample project, we have used Mapped Diagnostic Context (MDC) logging,
    which is sufficient, in a way, for individual microservice logging. However, we
    also need logging for an entire system, or central logging. We also need aggregated
    statistics of logs. There are tools that do the job, such as Logly or Logspout.


    A request and generated correlated events give you an overall view of the request.
    For tracing of any event and request, it is important to associate the event and
    request with service ID and request respectively. You can also associate the content
    of the event, such as message, severity, class name, and so on, to service ID.


    ![](img/f551c3d57000fcdbbc1268267d5af69e_264_0.png)


    # A separate data store for each microservice


    If you remember, the most important characteristics of microservices you can find
    out about the way microservices run in isolation from other microservices, most
    commonly as standalone applications.


    Abiding by this rule, it is recommended that you do not use the same database,
    or any other data store across multiple microservices. In large projects, you
    may have different teams working on the same project, and you want the flexibility
    to choose the database for each microservice that best suits the microservice.


    Now, this also brings some challenges.


    For instance, the following is relevant to teams who may be working on different
    microservices within the same project, if that project share the same database
    structure. There is a possibility that a change in one microservice may impact
    the other microservice models. In such cases, change in one may may affect the
    dependent microservice, so you also need to change the dependent model structure.


    To resolve this issue, microservices should be developed based on an API-driven
    platform. Each microservice would expose its APIs, which could be consumed by
    the other microservices. Therefore, you also need to develop the APIs, which is
    required for the integration of different microservices.'
