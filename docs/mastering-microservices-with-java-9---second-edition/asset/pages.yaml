    # # Dependences and versions


    Two common problems that we face in product development are cyclic dependencies
    and API versions. We will discuss them in terms of microservice-based architecture.


    # # Cyclic dependencies and their impact


    Generally, monolithic architecture is a typical layer model, whereas microservices
    carry the graph model. Therefore, microservices may have a dependency cyclic dependencies.


    Therefore, it is necessary to keep a check on microservice relationships.'
  merge: -1
  pgno: 289
- img_proc: true
  md: '# Troubleshooting Guide


    # Chapter 10


    Let us have a look at the two cases:


    +   - If you have a cycle of dependencies between your microservices, you are
    vulnerable to distributed stack overflow errors when a certain transaction might
    be stuck in a loop. For example, when a restaurant table is being reserved by
    a person. In this case, the restaurant needs to know the person (findBookedUser),
    and the person needs to know the restaurant at a given time. If not designed well,
    these services may call each other in a Loop. The result may be a stack overflow
    generated by JVM.

    - If two services share a dependency and you update that other service''s API
    in a way that could affect them, you''ll need to update all three at once. This
    brings up questions such as, should you update first? In addition, how do you
    make this safe transition?


    # Analyzing dependencies while designing the system


    Therefore, it is important while designing the microservices to establish the
    proper relationship between different services internally to avoid any cyclic
    dependencies. It is a design issue and must be addressed if it requires a refactoring
    of the code.


    # Maintaining different versions


    When you have more services, it means different release cycles for each of them,
    which adds to this complexity by introducing different versions of services, in
    that there will be different versions of the same REST services. Reproducing a
    problem will prove to be very difficult when it has gone in one version and returns
    in a newer one.


    # Let''s explore more


    The versioning of APIs is important because, over time, APIs change. Your knowledge
    and experience improves with time, and that leads to changes in APIs. Changing
    APIs may break existing client integrations.


    [ 276 ]'
  merge: -1
  pgno: 290
- img_proc: true
  md: '# Troubleshooting Guide


    # Chapter 10


    Therefore, there are various ways to manage the API versions. One of these is
    using the version in the path that we have used in this book; some also use the
    HTTP header. HTTP header could be a custom request header or you could use Accept
    Header for representing the calling API. For more information on how versions
    are handled using HTTP headers, please refer to RESTful Java Patterns and Best
    Practices by Bhakti Mehta, Pack Publishing:

    https://www.packpub.com/application-development/restful-java-patterns-and-best-practices.


    It is very important while troubleshooting any issue that your microservices are
    implemented to produce the version numbers in logs. ideally, you should avoid
    any instance where you have too many versions of any microservice.


    # References


    This following will have more information:


    +   - Elasticsearch: https://www.elastic.co/products/elasticsearch

    - Logstash: https://www.elastic.co/products/logstash

    - Kibana: https://www.elastic.co/products/kibana

    - willdurand/elk: ELK Docker image

    - Mastering Elasticsearch - Second Edition: https://www.packpub.com/web-development/mastering-elasticsearch-second-edition


    # Summary


    In this chapter, we have explored the ELK stack overview and installation. In
    the ELK stack, Elasticsearch is used for storing the logs and service queries
    from Kibana. Logstash is an agent that runs on each server that you wish to collect
    logs from. Logstash reads the logs, filters/transforms them, and provides them
    to Elasticsearch. Kibana reads/queries the data from Elasticsearch and presents
    it in tabular or graphical visualizations.'
