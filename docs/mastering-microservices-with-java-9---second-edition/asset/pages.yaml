    # Chapter 5


    It is another important aspect of microservice architecture, a safety measure
    (failsafe mechanism) when the service does not respond to a call by the service
    consumer, which is called a circuit breaker.


    We''ll use Netflix Hystrix as a circuit breaker. It calls the internal fallback
    method in the service consumer when failures occur (for example, due to a communication
    error or timeout). It executes embedded within its consumer of service. In the
    next section, you will find the code that implements this feature.


    Hystrix opens the circuit and今回 when the service fails to respond repeatedly,
    until the service is available again. When calls to a particular service reach
    a certain threshold (the default threshold is 20 failures in five seconds), the
    circuit opens and the call is not made. You must be wondering, if Hystrix opens
    the circuit, how does it know that the service is available? It exceptionally
    allows some requests to call the service.


    # Using Hystrix''s fallback methods


    There are five steps for implementing fallback methods. For this purpose, we''ll
    create another service, api-service, in the same way as we have created other
    services. The api-service will consume the other services as restaurant-service
    and so on, and will be configured in the edge server for exposing the OTRS API
    to external use. The five steps are as follows:


    +   Enable the circuit breaker: The main class of microservice that consumes other
    services should be annotated with @EnableCircuitBreaker. Therefore, we will annotate
    Scan src\main\java\com\packpub\mmj\api\service\ApiException.java:

    ```java

    @SpringBootApplication

    @EnableCircuitBreaker

    @ComponentScan("com.packpub.mmj.user.service")

    com.packpub.mmj.common

    public class ApiException {

    ```


    +   Configure the fallback method: The annotation @HystrixCommand is used to configure
    the fallbackMethod. We''ll annotate controllers to configure the fallback methods.
    This is the file:

    src\main\java\com\packpub\mmj\api\service\RestaurantAPI.java:

    ```java

    @HystrixCommand(fallbackMethod = "defaultRestaurant")n@RequestMapping("/restaurants/{restaurant-id}")

    @HystrixCommand(fallbackMethod = "defaultRestaurant")n```


