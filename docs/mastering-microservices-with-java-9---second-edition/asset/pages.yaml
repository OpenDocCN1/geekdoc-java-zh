- img_proc: true
  md: '# Domain-driven design fundamentals


    An enterprise, or cloud application, solves business problems and other real-world
    problems. These problems cannot be resolved without knowledge of the domain. For
    example, you cannot provide a software solution for a financial system such as
    online trading if you don''t understand the stock exchanges and their functioning.
    Therefore, having domain knowledge is a must for solving problems. Now, if you
    want to offer a solution using software or applications, you need to design it
    with the help of domain knowledge. When we combine the domain and software design,
    it offers a software methodology known as DDD.


    When we develop software to implement real-world scenarios offering the functionalities
    of a domain, we create a model of the domain. A model is an abstraction, or a
    blueprint, of the domain.


    > Eric Evans coined the term DDD in his book Domain-Driven Design: Tackling Complexity
    in the Heart of Software, published in 2004.


    Designing this model is not rocket science, but it takes a lot of effort, refining,
    and refining from domain experts. It is the collective job of software designers,
    domain experts, and developers. They organize information, divide into smaller
    groups, group them logically, and create modules. Each module can be taken up
    individually, and can be divided using a similar approach. This process can be
    followed until the unit level, or when we cannot divide it any further. A complex
    project may have more of such iterations; similarly, a simple project could have
    just a single iteration of it.


    Once a model is defined and well documented, it can move onto the next stage -
    code design. So here we have a software design—a domain model and code design,
    and code implementation of the domain model. The domain model provides a high
    level of the architecture of a solution (software/application), and the code implementation
    gives the domain life, as a working model.


    DDD makes design and development work together. It provides the ability to develop
    software continuously, while keeping the design up to date based on feedback received
    from the development. It solves one of the limitations offered by Agile and Waterfall
    methodologies, making software maintainable, including design and code, as well
    as keeping application minimum viable.'
  merge: -1
  pgno: 71
- img_proc: true
  md: '# Domain-Driven Design


    Design-driven development involves a developer from the initial stage, and all
    meetings where software designers discuss the domain with domain experts in the
    modeling process. It gives developers the right platform to understand the domain,
    and provides the opportunity to share early feedback of the domain model implementation.
    It removes the bottleneck that appears in later stages when stockholders wait
    for deliverables.


    # Fundamentals of DDD


    To understand domain-driven design, we can broadly categorize these three concepts:


    +   - Ubiquitous language and unified model language (UML)

    - Multilayer architecture

    - Artifacts (components)


    The following sections explain the usage and importance of ubiquitous language
    and multilayer architecture. There will also be an explanation of the different
    artifacts to be used in the model-driven design.


    # Ubiquitous language


    Ubiquitous Language is a common language to communicate within a project. As we
    have seen, designing a model is the collective effort of software designers, domain
    experts, and developers; therefore, it requires a common language to communicate
    with. DDD makes it necessary to use ubiquitous language. Domain models use ubiquitous
    language in their diagrams, descriptions, presentations, and meetings. It removes
    the misunderstanding, misinterpretation, and communication gap among them. it
    must be included in all diagrams, description, presentations, meetings, and so
    on—in short, everything.


    used and popular when creating models. It also has a few limitations; for example,
    when you have thousands of classes drawn from a paper, it is difficult to represent
    class relationships and simultaneously understand their abstraction while taking
    a meaning from it. Also, UML diagrams do not represent the concepts of a model
    and what objects are supposed to do. Therefore, UML should always be useded with
    other documents, code, or any other reference for effective communication.


    Other ways to communicate the domain model include the use of documents, code,
    and so on.'
  merge: -1
  pgno: 72
- img_proc: true
  md: '# Multilayered architecture


    Multilayered architecture is a common solution for DDD. It contains four layers:


    +   1. Presentation layer or User Interface (UI).

    2. Application layer.

    3. Domain layer.

    4. Infrastructure layer.


    ![](img/f551c3d57000fcdbbc1268267d5af69e_73_0.png)


    You can see here that only the Domain layer is responsible for the domain model,
    and others are related to other components as UI, application logic, and so on.
    This layered architecture is very important. It keeps domain-related code separate
    from other layers.


    In this multilayered architecture, each layer contains its respective code, and
    it helps to achieve loose coupling and avoids mixing code from different layers.
    It also helps the product/service/s long-term maintainability and the ease of
    enhancements, as the change of one-layer code does not impact on other components
    if the change is intended for the respective layer only. Each layer can be switched
    with another implementation easily with multi-tier architecture.'
  merge: -1
  pgno: 73
- img_proc: true
  md: 'Domain-Driven Design


    Chapter 3


    # Presentation layer


    This layer represents the UI, and provides the user interface for the interaction
    and information display. This layer could be a web application, mobile application,
    or a third-party application consuming your services.


    # Application layer


    This layer is responsible for application logic. It maintains and coordinates
    the overall flow of the product/service. It does not contain business logic or
    UI. It may hold the state of application objects, like tasks in progress. For
    example, your product REST services would be part of this application layer.


    # Domain layer


    The domain layer is a very important layer, as it contains the domain information
    and business logic. It holds the state of the business object. It persists the
    business objects, and communicates these persisted states to the infrastructure
    layer.


    # Infrastructure layer


    This layer provides support to all the other layers and is responsible for communication
    among the other layers. It contains the supporting libraries that are used by
    the other layers. It also implements the persistence of business objects.


    To understand the interaction of the different layers, let us use an example of
    table booking at a restaurant. The end user places a request for a table booking
    using UI. The UI passes the request to the application layer. The application
    layer fetches the domain objects, such as the restaurant, the table, a date, and
    so on, from the domain layer. The domain layer fetches these existing persisted
    objects from the infrastructure, and invokes relevant methods to make the booking
    and persist them back to the infrastructure layer. Once domain objects are persisted,
    the application layer shows the booking confirmation to the end user.


    [ 60 ]'
  merge: -1
  pgno: 74
- img_proc: true
  md: 'Domain-Driven Design


    Chapter 3


    # # Artifacts of domain-driven design


    There are seven different artifacts used in DDD to express, create, and retrieve
    domain models:


    +   - Entities

    - Value objects

    - Services

    - Aggregates

    - Repository

    - Factory

    - Module


    # # Entities


    Entities are certain types of objects that are identifiable and remain the same
    throughout the states of the products/services. These objects are not identified
    by their attributes, but by their identity and thread of continuity. These type
    of objects are known as **entities.**


    It sounds pretty simple, but it carries complexity. We need to understand how
    we can define the entities. Let''s take an example of a table booking system,
    where we have a `restaurant` class with attributes such as restaurant name, address,
    phone number, establishment data, and so on. We can take two instances of the
    `restaurant` class that are not identifiable using the restaurant name, as there
    could be other restaurants with the same name. Similarly, if we go by any other
    attribute, we will not find any attributes that can singularly identify a unique
    restaurant. If two restaurants have all the same attribute values, they are therefore
    the same and are interchangeable with each other. Still, they are not the entities,
    as both have different references (memory addresses).


    Conversely, let''s take a class of US citizens. Each citizen has his or her social
    security number. This number is not only unique, but remains unchanged throughout
    the life of the citizen and assures continuity. This citizen would exist in the
    memory, by would be serialized, and would be removed from the memory and stored
    in the database. It even exists after the person is deceased. It will be kept
    in the system for as long as the system exists. A citizen''s social security number
    remains the same irrespective of its representation.


    [ 61 ]'
  merge: -1
  pgno: 75
- img_proc: true
  md: '# Domain-Driven Design


    # Chapter 3


    Therefore, creating entities in a product means creating an identity. So, now
    give an identity to any restaurant in the previous example, either use a combination
    of attributes such as restaurant name, establishment date and street, or add an
    identifier as restaurant_id to identify it. The basic rule is that two identifiers
    cannot be the same. Therefore, when we introduce an identifier for an entity,
    we need to be sure of it.


    There are different ways to create a unique identity for objects, described as
    follows:


    +   * Using the primary key in the table.

    * Using an automated generated ID by a domain module. A domain program generates
    the identifier and assigns it to objects that are being persisted across layers.

    * A few real-life objects carry user-defined identifiers. For example, each country
    has its own country codes for dialing ISD calls.

    * Composite key. This is a combination of attributes that can also be used for
    creating an identifier, as explained for the preceding restaurant object.


    > Entities are very important for domain models. Therefore, they should be defined
    from the initial stage of the modeling process.


    When an object can be identified by its identifier and not by its attributes,
    a class representing these objects should have a simple definition, and care should
    be taken with the life cycle continuity and identity. It is imperative to identify
    objects in this class that have the same attribute values. A defined system should
    return a unique result for each object queried. Designers should ensure that the
    model defines what it means to be the same thing.


    # Value objects


    Value objects (VOs) simplify the design. Entities have traits such as identity,
    a thread of continuity, and attributes that do not define their identity. In contrast
    to entities, value objects have only attributes and no conceptual identity. A
    best practice is to keep value objects as immutable objects. If possible, you
    should even keep entity objects immutable too.'
  merge: -1
  pgno: 76
- img_proc: true
  md: "# Domain-Driven Design\n\n# Chapter 3\n\nEntity concepts bias you to keep all\
    \ objects as entities, as a uniquely identifiable object in the memory or database\
    \ with life cycle continuity, but there has to be one instance for each object.\
    \ Now, let's say you are creating customers as entity objects. Each customer object\
    \ would represent the restaurant guest, and this cannot be used for booking orders\
    \ for other guests. This creates millions of customer entity objects in the memory\
    \ if customers are using the system. There are millions of uniquely identifiable\
    \ objects that exist in the system, but each object is being tracked. Tracking\
    \ as well as creating a highly credible system is required to create and track\
    \ these objects, which is not only very complex, but also resource heavy. It may\
    \ result in system performance degradation. Therefore, it is important to use\
    \ value objects instead of using entities. The reasons are explained in the next\
    \ few paragraphs.\n\nApplications dont always need to be traceable and have identifiable\
    \ customer object. There are cases when you just need to have some or all attributes\
    \ of the domain element. These are the cases when value objects can be used by\
    \ the application. It makes things simple and improves the performance.\n\nValue\
    \ objects can easily be created and destroyed, owing to the absence of identity.\
    \ This simplifies the design—it makes value objects available for garbage collection\
    \ if no other object has referenced them.\n\nLet's discuss the value object's\
    \ immutability. Value objects should be designed and coded as immutable. Once\
    \ they are created, they should never be modified during their life-cycle. If\
    \ you need a different value of the VO, or any of its objects, then simply create\
    \ a new value object, but dont modify the original value object. Here, immutability\
    \ carries all the significance from **object-oriented programming (OOP)**. A value\
    \ object can be shared and used without impacting on its integrity if, and only\
    \ if, it is immutable.\n\n# FAQs\n\n+   * Can a value object contain another value\
    \ object?\n  Yes, it can\n* Can a value object refer to another value object or\
    \ entity?\n  Yes, it can\n* Can I create a value object using the attributes of\
    \ different value objects or entities?\n  Yes, you can"
  merge: -1
