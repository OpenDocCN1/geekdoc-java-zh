  md: '# A Solution Approach


    To understand the design differences between monolithic and microservices, let''s
    take an example of a restaurant table-booking application. This application may
    have many services such as customers, bookings, analytics and so on, as well as
    regular components such as presentation and database.


    We''ll explore three different designs here; traditional monolithic design, monolithic
    design with services, and microservices design.


    # Traditional monolithic design


    The following diagram explains the traditional monolithic application design.
    This design was widely used before SOA became popular:


    ![](img/f551c3d57000fcdbbc1268267d5af69e_23_0.png)


    In traditional monolithic design, everything is bundled in the same archive such
    as **Presentation code, Application Logic and Business Logic code, and DAO** and
    related code that interacts with the database files or another source.'
