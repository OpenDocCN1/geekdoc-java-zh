  md: '# Domain-Driven Design Chapter 3


    This sort of development may bring with it a certain level of complexity with
    regard to duplicate code, a code break, or maybe broken-bounded context. It happens
    not only because of the large size of code and domain model, but also because
    of other factors, such as changes in team members, new members, or not having
    a well-documented model, to name just a few of them.


    When systems are designed and developed using DDD and Agile methodologies, domain
    models are not designed fully before coding starts, and the domain model and its
    elements evolve over a period of time with continuous improvements and refinement
    happening gradually.


    Therefore, integration continues, and this is one of the key reasons for development
    today. In continuous integration, the code is merged frequently to avoid any breaks
    and issues with the domain model. Merged code not only gets deployed, but it is
    also tested on a regular basis. There are various continuous integration tools
    available in the market that merge, build, and deploy the code at various times.
    These days, organizations put more emphasis on the automation of continuous integration.
    Hudson, TeamCity, and Jenkins CI are a few of the popular tools available for
    continuous integration. Hudson and Jenkins CI are open source tools, and TeamCity
    is a proprietary tool.


    Having a test suite attached to each build confirms the consistency and integrity
    of the model. A test suite defines the model from a physical point of view, whereas
    UML informs you of any error or unexpected outcome that requires a code change.
    It also helps to identify errors and anomalies in a domain model early on.


    # Context map


    The context map helps you to understand the overall picture of a large enterprise
    application. It shows how many bounded contexts are present in the enterprise
    model, and how they are interrelated. Therefore, we can say that any diagram or
    document that explains the bounded contexts and relationship between them is called
    a context map.


    Context maps help all team members, whether they are on the same team or in a
    different team, to understand the high-level enterprise model in the form of various
    parts (bounded context or submodels) and relationships.'
