  md: '# OTRS overview


    Based on microservice principles, we need to separate microservices for each functionality.
    After looking it at OTRS, we can easily divide it into three main microservices—Restaurant
    service, Booking service, and User service. There are other microservices that
    can be defined in the OTRS. Our focus is on these three microservices. The idea
    is to make them independent, having their own separate databases.


    We can summarize the functionalities of these services, as follows:


    +   * **Restaurant service**: This service provides the functionality for the
    restaurant resource—create, read, update, delete (CRUD) operation and searching
    based on criteria. It provides the association between restaurants and tables.
    Restaurant would also provide access to the Table entity.


    +   * **User service**: This service, as the name suggests, allows the end user
    to perform CRUD operations on User entities.


    +   * **Booking service**: This service makes use of the Restaurant service and
    User service to perform CRUD operations on booking. It will use restaurant searching
    and its associated table lookup and allocation based on table availability for
    a specified time duration. It creates the relationship between the restaurant/table
    and the user:


    ![](img/f551c3d57000fcdbbc1268267d5af69e_101_0.png)'
  merge: -1
