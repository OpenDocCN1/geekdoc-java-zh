  md: "# Deployment and Testing\n\nNormally, it is recommended to have a single edge\
    \ server for all requests. However, a few companies use a single edge server per\
    \ client to scale. For example, Netflix uses a dedicated edge server for each\
    \ device type.\n\nAn edge server will also be used in the next chapter, when we\
    \ configure and implement microservice security.\n\nConfiguring and using the\
    \ edge server is pretty simple in Spring Cloud. You need to perform the following\
    \ steps:\n\n+   1. Define Zuul dependency in the pom.xml file:\n\n```\n<dependency>\n\
    \  <groupId>org.springframework.cloud</groupId>\n  <artifactId>spring-cloud-starter-zuul</artifactId>\n\
    </dependency>\n```\n\n+   2. The @EnableZuulProxy annotation in your application\
    \ class. It also internally uses the @EnableDiscoveryClient annotation; therefore,\
    \ it is also registered to the Eureka server automatically. You can find the Zuul\
    \ server in the figure Client-side load balancing.\n\n+   3. Update the Zuul configuration\
    \ in the application.yml file, as follows:\n\n+   * zuul.ignoredServices: This\
    \ skips the automatic addition of services. We can define service patterns here.\
    \ The * denotes that we are ignoring all services. In the following sample, all\
    \ services are ignored except restaurant-service.\n* Zuul.routes: This contains\
    \ the path attribute that defines the URI's pattern. Here, /restantapi is mapped\
    \ to restaurant-service using the serviceId attribute. The ServiceId attribute\
    \ represents the service in the Eureka server. We can use a URL in a place of\
    \ service, if the Eureka server is not used. We have also used the stripPrefix\
    \ attribute to strip the prefix (/restaurantapi), and the resultant /restantapi/v1/restantapi/1\
    \ calls to /v1/restantapi/1 while calling the service:\n\n```\napplication.yml\n\
    info:\n  component: Zuul Server\n  # Spring properties\nspring:\n  application:\n\
    \    name: zuul-server # Service registers under this name\n\nendpoints:\n  restart:\n\
    ```"
