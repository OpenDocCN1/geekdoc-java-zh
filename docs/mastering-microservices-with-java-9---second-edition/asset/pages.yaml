  md: '# Securing Microservices


    # Chapter 7


    +   7. After validating these parameters, Twitter sends the access token to Quora.

    8. The user is logged in to Quora on successful retrieval of the access token.

    9. Quora may use this access token to retrieve user information from Twitter.


    You must be wondering how Twitter got Quora''s redirect URI, client ID, and secret
    token. Quora works as a client application and Twitter as an authorization server.
    Quora, as a client, is registered on Twitter using Twitter''s OAuth implementation
    to use resource owner (end user) information. Quora provides a redirect URI at
    the time of registration. Twitter provides the client ID and secret token to Quora.
    In OAuth 2.0, user information is known as user resources. Twitter provides a
    resource server and an authorization server. We''ll discuss more of these OAuth
    terms in the following sections.


    ![](img/f551c3d57000fcdbbc1268267d5af69e_178_0.png)'
