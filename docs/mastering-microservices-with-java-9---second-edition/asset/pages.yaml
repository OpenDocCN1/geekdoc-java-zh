  md: '# Deployment and Testing


    # Chapter 5


    +   - Monitoring dashboard: The Hystrix dashboard is used with Netflix Turbine
    for microservice monitoring. It provides a dashboard to check the health of running
    microservices.


    # Load balancing


    Load balancing is required to service requests in a manner that maximizes speed
    and capacity utilization, and it makes sure that no server is overloaded with
    requests. The load balancer redirects requests to the remaining host servers if
    a server goes down. microservice architecture, a microservice can serve internal
    or external requests. Based on this, we can have two types of load balancing—client-side
    and server-side load balancing.


    # Server-side load balancing


    We''ll discuss server-side load balancing; before, we''ll discuss routing. It
    is important to define the routing mechanism for our OTRS application from the
    microservice architecture point of view. For example, / (root) could be mapped
    to our UI application. Similarly, `/restaurantapi` and `/userapi` could be mapped
    to the Restaurant service and User service respectively. The edge server performs
    routing with load balancing.


    We''ll use the Netflix Zuul as our edge server. Zuul is a JVM-based router and
    server-side load balancer. Zuul supports any JVM language for writing rules and
    filters and has built-in support for Java and Groovy.


    Netflix Zuul, by default, with discovery client (Eureka client) support. Zuul
    also makes use of Ribbon and Eureka for load balancing.


    The external world (the UI and other clients) calls the edge server, which uses
    the routes defined in `application.yml` to call internal services and provide
    the response. Your guess is right if you think it acts as a proxy server, carries
    gateway responsibility for internal networks, and calls internal services for
    defined and configured routes.


