  md: '# Deployment and Testing


    Netflix Turbine is a web application that connects to the instances of your Hystrix
    applications in a cluster and aggregates information, which it does in real time
    (updated every 0.5 seconds). Turbine provides information using a stream that
    is known as the Turbine stream.


    If you combine Hystrix with Netflix Turbine, then you can get all of the information
    from the Eureka server on the Hystrix dashboard. This gives you a landscape view
    of all of the information about the circuit breakers.


    To use Turbine with Hystrix, just type in the Turbine URL http://localhost:8989/turbine.stream
    (port 8989 is configured for the Turbine server in application.yml) in the first
    textbox shown in the preceding screenshot, and click on **Monitor Stream**.


    Netflix Turbine and Turbine use RabbitMQ, an open source message queuing software.
    RabbitMQ works on **Advance Messaging Queue Protocol (AMQP)**. It is a software
    which queues can be defined and use connected applications to exchange messages.
    A message can include any kind of information. A message can be stored in the
    RabbitMQ queue until a receiver application connects and consumes the message
    (taking off queue).


    Hystrix uses RabbitMQ to send metrics data feed to Turbine.


    > Before we configure Hystrix and Turbine, please install the RabbitMQ application
    on your platform. Hystrix and Turbine use RabbitMQ to communicate between themselves.


    # Setting up the Hystrix dashboard


    We''ll create another project in the Hystrix dashboard in the same way as we created
    other services. Inside this new project, we''ll add the new Maven dependency,
    `dashboard-server`, for the Hystrix server. Configuring and using the Hystrix
    dashboard is pretty simple in Spring Cloud.'
