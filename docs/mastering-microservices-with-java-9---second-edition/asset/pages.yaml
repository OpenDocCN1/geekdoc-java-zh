  md: '# System/end-to-end part of product and service delivery.


    Testing is a very important part of any product and service delivery. You do not
    want to deliver buggy applications to customers. Earlier, at the time when the
    waterfall model was popular, an organization used to take 1 to 6 months or more
    for the testing stage before delivering to the customer. In recent years, after
    the agile process became popular, more emphasis is given to automation. Similar
    to prior point testing, automation is also mandatory.


    Whether you follow test-driven development (TDD) or not, we must have system or
    end-to-end test automation in place. It''s very important to test your business
    scenarios and that is also the case with end-to-end testing that may start from
    your REST call to database checks, or from UI to database checks.


    Also, it is important to test your APIs if you have public APIs.


    Doing this makes sure that any change does not break any of the functionality
    and ensures seamless, bug-free production delivery. As discussed in the last section,
    each module is tested in isolation using unit testing to check everything is working
    as expected, then integration testing is performed between different modules to
    check the expected behavior and validate the requirements, whether implemented
    correctly or not. After integration tests, functional tests are executed that
    validate the functional and feature requirements.


    So, if unit testing makes sure individual modules are working in isolation, integration
    testing makes sure that interaction among different modules works as expected.
    If unit tests are working fine, it implies that the changes of integration test
    failure is greatly reduced. Similarly, integration testing ensures that functional
    testing is likely to be successful.


    > It is presumed that one always keeps all types of tests updated, whether these
    are unit-level tests or end-to-end test scenarios.


    # Self-monitoring and logging


    A microservice should provide service information about itself and the state of
    the various resources it depends on. Service information represents statistics
    such as the average, minimum, and maximum time to process a request, the number
    of successful and failed requests, being able to track a request, memory usage,
    and so on.'
