  md: '# Circuit breakers


    A fault or break should not prevent your whole system from working. Also, the
    repeated failure of a service or an API should be handled properly. Circuit breakers
    provide these features. Netflix Hystrix is used as a circuit breaker and helps
    to keep the system up.


    # Monitoring


    The Hystrix dashboard is used with Turbine for microservice monitoring. It provides
    a dashboard to check the health of running microservices.


    # An overview of microservice architecture using Netflix OSS


    Netflix are pioneers in microservice architecture. They were the first to successfully
    implement microservice architecture on a large scale. They also helped increase
    its popularity and contributed immensely to microservices by open sourcing most
    of their microservice tools with Netflix Open Source Software Center (OSS).


    According to the Netflix blog, when Netflix was developing their platform, they
    used Apache Cassandra for data storage, which is an open source tool from Apache.
    They started contributing to Cassandra with fixes and optimization extensions.
    This led to Netflix seeing the benefits of releasing Netflix projects with the
    name OSS.


    Spring took the opportunity to integrate many Netflix OSS projects, such as Zuul,
    Ribbon, Hystrix, the Eureka server, and Turbine, into Spring Cloud. This is one
    of the reasons Spring Cloud provides a ready-made platform for developing production-ready
    microservices.'
