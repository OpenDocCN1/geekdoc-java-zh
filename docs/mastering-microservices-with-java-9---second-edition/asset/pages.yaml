  md: "# Setting Up the Development Environment\n\nIf no defaultValue is defined,\
    \ and the user doesn't provide the request parameter, RestController returns the\
    \ HTTP status code 400 with the message Required String parameter 'base' is not\
    \ present. It always uses the reference of the first required parameter if more\
    \ than one of the requests is missing:\n\n```\n{\n  \"timestamp\": 1464678493402,\n\
    \  \"status\": 400,\n  \"error\": \"Bad Request\",\n  \"exception\": \"org.springframework.web.bind.MissingServletRequestParamException\"\
    ,\n  \"message\": \"Required String parameter 'base'\",\n  \"path\": \"/calculation/power/\"\
    \n}\n```\n\n# @PathVariable variable annotation\n\n@PathVariable helps you create\
    \ the dynamic URLs. @PathVariable annotation allows you to map Java parameters\
    \ to a path parameter. It works with @RequestMapping where the placeholder is\
    \ created in URI then the placeholder name is used either as a PathVariable or\
    \ a method parameter, as you can see in the CalculationController class' method\
    \ sqrt(). Here, the value placeholder is created inside the @RequestMapping and\
    \ the value is assigned to the value of @PathVariable.\n\nThe sqrt() method takes\
    \ the parameter in the URI in place of the request parameter, for example http://localhost:8080/calculation/sqrt/144.\
    \ Here, the 144 value is passed as the path parameter and this URL returns the\
    \ square root of 144, that is 12.\n\nTo use the basic check in value, use the\
    \ regular expression \"^-+\\d+\\.?\\d*$\\$\\ to allow only valid numbers in parameters.\
    \ If non-numeric values are passed, the respective method adds an error message\
    \ to the output key of the JSON:\n\nCalculationController also uses the regular\
    \ expression . + in the path variable (path parameter) to allow the decimal point(.)\
    \ in numeric values: /path/{variable:.}. Spring ignores anything after the last\
    \ dot. Spring default treats it as a file extension.\nThere are other alternatives,\
    \ such as adding a slash at the end (/path/{variable}/), or overriding the\n\n\
    configurePathMatch(PathMatch) method of WebMvcConfigurerAdapter to setting the\
    \ useRegisteredSuffixPathMatcher to true, using PathMatchConfigurer (available\
    \ in Spring 4.0.1).\n\n![](img/f551c3d57000fcdbbc1268267d5af69e_56_0.png)\n\n\
    [ 42 ]"
