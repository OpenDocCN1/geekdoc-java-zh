  md: '# A Solution Approach


    # Chapter 1


    Micro-components are made loosely coupled thanks to their exposed API, which can
    be continuously integration test. With microservices'' continuous release cycle,
    changes are small and developers can rapidly exploit them with a regression test,
    then go over them and fix the eventual defects found, reducing the risk of a deployment.
    This results in higher velocity with a lower associated risk.


    Owing to the separation of functionality and single responsibility principle,
    microservices makes teams very productive. You can find a number of examples online
    where large projects have been developed with minimum team sizes as eight to ten
    developers.


    Developers can have focus with smaller code and result better feature implementation
    that leads to a higher empathetic relationship with the users of the product.
    This induces better motivation and clarity in feature implementation. An empathetic
    relationship with users allows a shorter feedback loop and better and speedy prioritization
    of the feature pipeline. A shorter feedback loop also makes defect detection faster.


    Each microservices works independently and new features or ideas can be implemented
    without being coordinated with larger audiences. The implementation of endpoint
    failures failing is also easily achieved in the microservices design.


    Recently, at one of the conferences, a team demonstrated how they developed a
    microservices-based transport-tracking application including iOS and Android applications
    within 10 weeks, which had Uber-type tracking features. A big consulting firm
    gave a seven months estimation for the same application to its client. It shows
    how microservices is aligned with Agile methodologies and CI/CD.


    # Microservices build pipeline


    Microservices could also be built and tested using the popular CI/CD tools such
    as Jenkins, TeamCity, and so on. It is very similar to how a build is done in
    a monolithic application. In microservices, each microservice is treated like
    a small application.


    For example, once you commit the code in the repository (SCM), CI/CD tools trigger
    the build process:


    +   - Cleaning code

    - Code compilation

    - Unit test execution

    - Contract/Acceptance test execution

    - Building the application archives/container images'
