    # Bounded context


    When you have different submodels, it is difficult to maintain the code when all
    submodels

    are combined. You need to have a small model that can be assigned to a single
    team. You

    might need to collect the related elements and group them. Context keeps and maintains

    tmeaning of the domain term defined for its respective submodel by applying this
    set of

    conditions.


    These domain terms define the scope of the model that creates the boundaries of
    the

    context.


    Bounded context seems very similar to the module that you learned about the previous

    section. In fact, the module is part of the bounded context that defines the logical
    frame

    where a submodel takes place and is developed. Whereas, the module organizes the

    elements of the domain model, and is visible in the design document and the code.


    Now, as a designer, you would have to keep each submodel well-defined and consistent.
    In

    this way, you can refactor each independently without affecting the other

    submodels. This gives the software designer flexibility to refine and improve
    it at any

    point in time.


    Now, let''s examine the table reservation example we''ve been using. When you
    started

    desesigning the system, you would have seen that the guest would visit the application,
    and

    request a table reservation at a selected restaurant, date, and time. Then, there
    is the

    backend system that informs the restaurant about the booking information, and
    similarly,

    the restaurant would keep their system updated in regard to table bookings, given
    that

    tables can also be booked by the restaurant themselves. So, when you look at the
    system''s

    finer points, you can see two domain models:


    +   - The online table reservation system

    - The offline restaurant management system


    Both have their own bounded context and you need to make sure that the interface
    between

    them works fine.


    # Continuous integration


    When you are developing, the code is scattered among many teams and various

    technologies. This code may be organized into different modules, and has applicable

    bounded context for respective submodels.'
