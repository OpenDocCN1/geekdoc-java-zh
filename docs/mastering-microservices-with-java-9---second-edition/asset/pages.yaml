    Therefore, you need to evaluate all the pros and cons before you make a call for
    starting a new microservice-based project from scratch or planning to upgrade
    the design of an existing monolithic system to a microservice-based system. You
    have to listen to and understand the different ideas and perspectives shared across
    your team, and you need to take a cautious approach.


    Finally, I would like to share the importance of having better processes and an
    efficient system in place for a successful production system. Having a microservice-based
    system does not guarantee a successful production system, and a monolithic application
    does not mean you cannot have a successful production system in today''s age.
    Netflix, a microservice-based cloud video rental service, and Etsy, a monolithic
    e-commerce platform are both examples of successful live production systems (an
    interesting Twitter discussion link in the References section later in the chapter).
    Therefore, processes and agility are also key to a successful production system.


    # Best practices and principles


    As we have learned from the first chapter, microservices are a lightweight style
    of implementing Service Oriented Architecture (SOA). On top of that, microservices
    are not strictly defined, which gives you the flexibility of developing microservices
    the way you want and according to need. At the same time, you need to make sure
    that you follow a set of the standard practices and principles to make your job
    easier and implement microservice-based architecture successfully.


    # Nanoservice, size, and monolithic


    Each microservice in your project should be small in size and perform one functionality
    or feature (for example, user management), independently enough to perform the
    function on its own.


