    # # Summary


    In this chapter, we have learned about the new dynamic web application development.
    It has changed completely over the years. The web application frontend is completely
    developed in pure HTML and JavaScript instead of using any server-side technologies
    as JSP, servlets, ASP, and so on. UI application development with JavaScript now
    has its own development environments such as npm, Bower, and so on. We have explored
    the AngularJS framework to develop our web application. It makes things easier
    by providing built-in features and support for Bootstrap and the $http service
    that deals with the AJAX calls.


    I hope you have grasped the UI development overview and the way modern applications
    are developed and integrated with server-side microservices. In the next chapter,
    we will learn the best practices and common principals of microservice design.
    The chapter will provide details about microservices development using industry
    practices and examples. It will also contain examples of where microservices implementation
    goes wrong and how you can avoid such problems.


    [ 242 ]'
