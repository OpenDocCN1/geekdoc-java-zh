  md: '# 4

    Implementing a Microservice


    This chapter takes you from the design stage to the implementation of our sample
    project—an online table reservation system (OTRS). Here, you will use the same
    design explained in the last chapter and enhance it to build the microservices.
    At the end of this chapter, you will have not only learned how to implement the
    design, but also learned the different aspects of microservices—building, testing,
    and packaging. Although the focus is on building and implementing the Restaurant
    microservices, you can use the same approach to build and implement other microservices
    used in the OTRS.


    In this chapter, we will cover the following topics:


    +   - OTRS overview

    - Developing and implementing the microservice

    - Testing


    We will use the domain-driven design key concepts demonstrated in the last chapter.
    In the last chapter, you saw how domain-driven design is used to develop the domain
    model using core Java. Now, we will move from a sample domain implementation to
    a Spring Framework-driven implementation. You will use of Spring Boot to implement
    the domain-driven design concepts and transform them from core Java to a Spring
    Framework-based model.


    In addition, we will also use Spring Cloud, which provides a cloud-ready solution
    that is available through Spring Boot. Spring Boot will allow you to enable an
    embedded application container relying on Tomcat or Jetty inside your service,
    which is packaged as a JAR or as a WAR. This JAR is executed as a separate process,
    a microservice that will serve and provide the response to all requests and point
    to endpoints defined in the service.


    Spring Cloud can also be integrated easily with Netflix Eureka, a service registry
    and discovery component. The OTRS will use it for registration and the discovery
    of microservices.'
