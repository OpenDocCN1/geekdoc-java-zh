  md: '# Domain-Driven Design


    # Chapter 3


    # # Services


    While creating the domain model, you may encounter various situations where behavior
    may not be related to any object specifically. These behaviors can be accommodated
    in service objects.


    Service objects are part of domain layer that does not have any internal state.
    The sole purpose of service objects is to provide behavior to the domain that
    does not belong to a single entity or value object.


    Ubiquitous language helps you identify different objects, identities, and value
    objects with different attributes and behaviors during the process of domain modeling.
    During the course of creating the domain model, you may find different behaviors
    or methods that do not belong to any specific object. Such behaviors are important,
    and cannot be neglected. Neither can you add them to entities or value objects.
    It would spoil the object to add behavior that does not belong to it. Keep in
    mind, that behavior may impact on various objects. The use of object-oriented
    programming makes it possible to attach to some objects; this is known as a service.


    Services are common in technical frameworks. They are also used in domain layers
    in DDD. Service object does not have any internal state; the only purpose of it
    is to provide a behavior to the domain. Service objects provide behaviors that
    cannot be related to specific entities or value objects. Service objects may provide
    one or more related behaviors to more entities or value objects. It is a practice
    to define the services explicitly in the domain model.


    While creating the services, you need to tick all of the following points:


    +   - Service objects'' behavior performs on entities and value objects, but it
    does not belong to entities or value objects

    - Service objects'' behavior state is not maintained, and hence, they are stateless

    - Services are part of the domain model


    Services may also exist in other layers. It is very important to keep domain-layer
    services isolated. It removes the complexities and keeps the design decoupled.


    Let''s take an example where a restaurant owner wants to see the report of his
    monthly bookings. In this case, he will log in as an admin and click the Display
    Report button after providing the required input fields, such as duration.'
  merge: -1
