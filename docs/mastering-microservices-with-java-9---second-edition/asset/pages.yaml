  md: '# Domain-Driven Design


    # Chapter 3


    # Conformist


    This pattern is similar to that of the customer and the supplier, where one needs
    to provide the contract and information while the other needs to use it. Here,
    instead of bounded context, actual teams are involved in having an upstream/downstream
    relationship.


    Moreover, upstream teams do not provide for the needs of the downstream team,
    because of their lack of motivation. Therefore, it is possible that the downstream
    team may need to provide and work on items that will never be available. To resolve
    such cases, the customer team could develop their own models if the supplier provides
    information that is not worth enough. If the supplier provided information that
    is really worth it or partial worth, the customer can use the interface or translators
    that can be used to consume the supplier-provided information with the customer''s
    own models.


    # Anticorruption layer


    The anticorruption layer remains part of a domain and is used when a system needs
    data from external systems, or from their own legacy systems. Here, anticorruption
    is the layer that interacts with external systems and uses external system data
    in the domain model without affecting the integrity and originality of the domain
    model.


    For the most part, a service can be used as an anticorruption layer that may use
    a facade pattern with an adapter and translator to consume external domain data
    within the internal model. Therefore, your system would use the service to retrieve
    the data. The service layer can be designed using the facade pattern. This would
    make sure that it would work with the domain model to provide the required data
    in a given format. The service could then also use the adapter and translator
    patterns that would make sure that, whatever format and hierarchy is sent, by
    external sources, the service would be provided in the desired format and the
    hierarchy would use adapters and translators.


    # Separate ways


    When you have a enterprise application and a domain where different domains have
    no common elements, and it''s made of small submodels that work independently,
    still works as a single application for an end user.


    In such cases, a designer could create separate models that have no relationship,
    and develop a small application on top of them. These small applications become
    a single application when merged together.'
  merge: -1
  pgno: 89
- img_proc: true
  md: '# Domain-Driven Design


    # Chapter 3


    An employer’s intranet application that offers various small applications, such
    as those that are HR-related, issue trackers, transport, or intra-company social
    networks, is one such application where a designer could use the separate ways
    pattern.


    It would be very challenging and complex to integrate applications that were developed
    using separate models. Therefore, you should take care before implementing this
    pattern.


    # Open Host Service


    A translation layer is used when two submodels interact with each other. This
    translation layer is used when you integrate models with an external system. The
    Open Host Service is required when you have one submodel that uses this external
    system is being used by many submodels to remove the extra and duplicated code,
    because then you need to write a translation layer for each submodels system.


    An Open Host Service provides the services of an external system using a wrapper
    to all sub-models.


    # Distillation


    As you know, distillation is the process of purifying liquid. Similarly, in DDD,
    distillation is the process that filters out the information that is not required,
    and keeps only the meaningful information. It helps you to identify the core domain
    and the essential concepts for your business domain. It helps you to filter out
    the generic concepts until you get the core domain concept.


    Core domain should be designed, developed, and implemented with the highest attention
    to detail, using the developers and designers, as it is crucial to the success
    of the whole system.


    In our table reservation system example, which is not a large or complex domain
    application, it is not difficult to identify the core domain. The core domain
    here exists to share the real-time accurate vacant tables in the restaurants,
    and allows the user to reserve them in a hassle-free process.'
