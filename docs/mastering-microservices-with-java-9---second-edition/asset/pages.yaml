  md: '# Deployment and Testing


    # Chapter 5


    A Docker container provides a lightweight runtime environment, consisting of the
    core features of a virtual machine and the isolated services of operating systems,
    known as a Docker image. Docker makes the packaging and execution of microservices
    easier and smoother. Each operating system can have multiple Dockers, and each
    Docker can run single application.


    # Installation and configuration


    Docker needs a virtualized server if you are not using a Linux OS. You can install
    VirtualBox or similar tools as Docker Toolbox to make it work for you. The Docker
    installation page gives more details about it and lets you know how to do it.
    So, leave it to the Docker installation guide available on Docker''s website.


    You can install Docker, based on your platform, by following the instructions
    given at: https://docs.docker.com/engine/installation/.


    DockerToolbox-1.9.1 was the latest version available at the time of writing. This
    is the version we used.


    # Docker machine with 4 GB


    Default machines are created with 2 GB of memory. We''ll recreate a Docker machine
    with 4 GB of memory:


    ```

    docker-machine rm default

    docker-machine create -d virtualbox--virtualbox-memory 4096 default

    ```


    # Building Docker images with Maven


    There are various Maven plugins that can be used:


    +   - https://github.com/rhuss/docker-maven-plugin

    - https://github.com/alexec/docker-maven-plugin

    - https://github.com/spotify/docker-maven-plugin


    You can use any of these, based on your choice. I found the Docker Maven plugin
    by @rhuss be best suited for us. It is updated regularly and has many extra features
    compared to the others.'
