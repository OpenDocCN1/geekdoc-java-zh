  md: '# A Solution Approach


    # Chapter 1


    # Docker


    Container technology is one of the fastest growing technologies today, and Docker
    leads this segment. Docker is an open source project and it was launched in 2013.
    10,000 developers tried it after its interactive tutorial launched in August 2013.
    2.75 million times by the time of the launch of its 1.0 release in June 2013.
    Many large companies have signed the partnership agreement with Docker, such as
    Microsoft, Red Hat, HP, OpenStack, and service providers such as Amazon Web Services,
    IBM, and Google.


    As mentioned earlier, Docker also use of the Linux kernel features, such as cgroups
    and namespaces, to ensure resource isolation and packaging of the application
    with its dependencies. This packaging of dependencies enables an application to
    run as expected across different Linux operating systems/distributions, supporting
    a level of portability. Furthermore, this portability allows developers to develop
    an application in any language and then easily deploy it from a laptop to a test
    or production server.


    Docker runs natively on Linux. However, you can also run Docker on Windows and
    MacOS using VirtualBox and boot2docker.


    ![](img/f551c3d57000fcdbbc1268267d5af69e_33_0.png)


    Containers are comprised of just the application and its dependencies including
    the basic operating system. This makes it lightweight and efficient in terms of
    resource utilization. Developers and system administrators get interested in container''s
    portability and efficient resource utilization.


    Everything in a container executes natively on the host and uses the host kernel
    directly. Each container has its own owner namespace.


    # Docker''s architecture


    As specified in Docker documentation, Docker architecture uses client-server architecture.
    As shown in the following figure (sourced from Docker''s website: https://docs.docker.com/engine/docker-overview/),
    the Docker client is primarily a user interface that is used by an end user; clients
    communicate back and forth with a Docker daemon. The Docker daemon does the heavy
    lifting of the building, running, and distributing of your Docker containers.
    The Docker client and the daemon can run on the same system or different machines.'
  merge: -1
  pgno: 33
- img_proc: true
  md: '# A Solution Approach


    The Docker client and daemon communicate via sockets through a RESTful API. Docker
    registers are public or private Docker image repositories from which you upload
    or download images, for example, Docker Hub (hub.docker.com) is a public Docker
    registry.


    ![](img/f551c3d57000fcdbbc1268267d5af69e_34_0.png)


    The primary components of Docker are:


    +   * Docker image: A Docker image is a read-only template. For example, an image
    could contain an Ubuntu operating system with Apache web server and your web application
    installed. Docker images are a build component of Docker and images are used to
    create Docker containers. Docker provides a simple way to build new images or
    update existing images. You can also use images created by others and/or extend
    them.

    * Docker container: A Docker container is created from a Docker image. Docker
    works so that the container can only see its own processes, and has its own filesystem
    layered onto a host filesystem and a networking stack, which pipes to the host-networking
    stack. Docker Containers can be run, started, stopped, moved, or deleted.'
  merge: -1
