  md: '# Summary


    In this chapter, you learned about reactive microservices or event-based microservices.
    These services work on messages/events rather than REST calls over HTTP. They
    provide asynchronous communication among services, which provide non-blocking
    communication and allow better usage of resources and failure handling.


    We have made use of Apache Avro and Apache Kafka with Spring Cloud Stream libraries
    for implementing the reactive microservices. We have added the code in the existing
    booking-service module for producing the amp.bookingOrdered messages under the
    Kafka topic and added new module billing-service for consuming the same event.


    You may want to add a new event for producers and consumers. You can add multiple
    consumers for an event or create a chain of events as exercise.


    In the next chapter, you will learn to secure the microservices with respect to
    authentication and authorization. We will also explore the other aspects of microservice
    securities.'
