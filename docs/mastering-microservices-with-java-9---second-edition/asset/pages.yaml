    # Continuous integration and deployment


    You must have a continuous integration and deployment process in place. It gives
    you the edge to deliver changes faster and detect bugs early. Therefore, each
    service should have its own integration and deployment process. In addition, it
    must be automated. There are many tools available, such as Teamcity, Jenkins,
    and so on, that are used widely. It helps you to automate the build process—which
    catches build early, especially when you integrate your changes with the mainline
    (like either release branch/tag or master branch).


    You can also integrate your tests with each automated integration and deployment
    process. Integration testing tests the interactions of different parts of the
    system, such as between two interfaces (API provider and consumer), or between
    different components, or modules in a system, such as between DAO and database,
    and so on. Integration testing is important as it tests the interfaces between
    the modules. Individual modules are first tested in isolation. Then, integration
    testing is performed to check the combined behavior and validate that requirements
    are implemented correctly. Therefore, in microservices, integration testing is
    a key tool to validate the APIs. We will cover more about this in the next section.


    Finally, you can see the updated mainline changes on your CD (continuous deployment)
    machine where this process deploys the build.


    The process does not end here: you can make a container, such as Docker, and hand
    over to your WebOps team, or have a separate process that delivers to a configured
    location or deploys to a WebOps stage environment. From here, it could be deployed
    directly to your production system once approved by the designated authority.


