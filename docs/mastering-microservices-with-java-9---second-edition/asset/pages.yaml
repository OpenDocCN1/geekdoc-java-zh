  md: '# A Solution Approach


    # Chapter 1


    The preceding issues can be tackled easily by microservices, for example, UI developers
    may have their own UI component that can be developed, built, tested, and deployed
    separately. Similarly, other microservices might also be deployable independently
    and, because of their autonomous characteristics, the risk of system failure is
    reduced. Another advantage for development purposes is that UI developers can
    use of the JSON object and mock Ajax calls to develop the UI, which can be taken
    up in an isolated manner. After development completes, developers can consume
    the actual APIs and test the functionality. To summarize, you could say that microservices
    development is swift and aligns with the incremental needs of businesses.


    # Ease of development – could be done better


    Generally, large monolithic application code is the toughest to understand for
    developers, and it takes time before a new developer can become productive. Even
    loading the large monolithic application into IDE is troublesome, and it makes
    IDE slower and the developer less productive.


    A change in a large monolithic application is difficult to implement and takes
    due to a large code base, and there will be a high risk of bugs if impact analysis
    is not done properly and thoroughly. Therefore, it becomes a prerequisite for
    developers to do thorough impact analysis before implementing changes.


    In monolithic applications, dependencies build up over time as all components
    are bundled together. Therefore, the risk associated with code change rises exponentially
    as code changes (number of modified lines code) grows.


    When a code base is huge and more than 100 developers are working on it, it becomes
    very difficult to build products and implement new features of the previously
    mentioned reason. You need to make sure that everything is in place, and that
    everything is coordinated. A well-designed and documented API helps to lot in
    such cases.


    Netflix, the on-demand internet streaming provider, had problems getting their
    application developed, with around 100 people working on it. Then, they used a
    cloud and broke the application into separate pieces. These ended up being microservices.
    Microservices grew from the desire for speed and agility and to deploy teams independently.'
