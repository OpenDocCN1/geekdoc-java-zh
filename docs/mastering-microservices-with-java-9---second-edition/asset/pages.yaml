  md: '# # Securing Microservices


    As you know, microservices are the components that we deploy in on-premises or
    cloud infrastructures. Microservices may offer APIs or web applications. Our sample
    application, OTRS, offers APIs. This chapter will focus on how to secure these
    APIs using Spring Security and Spring OAuth2. We''ll also focus on OAuth 2.0 fundamentals,
    using OAuth 2.0 to secure the OTRS APIs. For more understanding on securing REST
    APIs, Packt Publishing book. You can also refer to the Spring Security, Packt
    Publishing video for more information on Spring Security. We''ll also learn about
    cross-origin request site filters and cross-site scripting blockers.


    In this chapter, we will cover the following topics:


    +   - Enabling Secure Socket Layer (SSL)

    - Authentication and authorization

    - OAuth 2.0


    # ## Enabling Secure Socket Layer


    So, we have used the Hyper Text Transfer Protocol (HTTP). HTTP transfers data
    in plain text, but transfer over the internet in plain text is not a good idea
    at all. It makes hacker''s jobs easy and allows them to get your private information,
    such as your user ID, passwords, and credit card details using a packet sniffer.


    We definitely don''t want to compromise user data, so we will provide the most
    secure way to access our web application. Therefore, we need to encrypt the information
    that is exchanged between the end user and our application. We''ll use Secure
    Socket Layer (SSL) or Transport Security Layer (TSL) to encrypt the data.'
  merge: -1
  pgno: 172
- img_proc: true
  md: '# Securing Microservices


    SSL is a protocol designed to provide security (encryption) for network communications.
    HTTP associates with SSL to provide the secure implementation of HTTP, known as
    Hyper Transfer Protocol Secure, or Hyper Text Transfer Protocol over SSL (HTTPS).
    HTTPS makes sure the privacy and integrity of the exchanged data is protected.
    It also ensures the authenticity of websites visited. This security centers around
    the distribution of signed digital certificates between the server hosting the
    application, the end user''s machine, and a third-party trust store server. Let''s
    see how this process takes place:


    +   1. The end user sends the request to the web application, for example `http://twitter.com`,
    using a web browser

    2. On receiving the request, the server redirects the browser to `https://twitter.com`
    using HTTP code 302

    3. The end user''s browser connects to `https://twitter.com` and, in response,
    the server provides the certificate containing the digital signature to the end
    user''s browser

    4. The end user''s browser receives this certificate and checks it against list
    of trusted certificate authority (CA) for verification

    5. Once the certificate gets verified all the way to the root CA, an encrypted
    communication is established between the end user''s browser and the application
    hosting server:


    ![](img/f551c3d57000fcdbbc1268267d5af69e_173_0.png)'
  merge: -1
  pgno: 173
