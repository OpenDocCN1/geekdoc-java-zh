  md: '# Best Practices and Common Principles


    Adrian Cockcock highlighted a few practices which are very important for monitoring
    microservices by Glue Conference (Glue Con) 2015. Most of them are valid for any
    monitoring system:


    +   - Spend more time working on code that collects, moves, stores, and displays
    metrics. This helps to not increase the productivity, but also provide important
    parameters to fine-tune the microservices and increase the system efficiency.
    The idea is to develop more analysis tools rather than developing more tools.

    - The metric to display latency needs to be less than the human attention span.
    That means than 10 seconds, according to Adrian.

    - Validate that your measurement system has enough accuracy and precision. Collect
    histograms of response time.

    - Accurate data makes decision-making faster and allows you to fine-tune until
    you reach precision level. He also suggests that the best graph to show the response
    time is a histogram.

    - Monitoring systems needs to be more available and scalable than the systems
    being monitored.

    - The statement says it all: you cannot rely on a system which itself is not stable
    or available 24/7.

    - Optimize for distributed, ephemeral, cloud-native, containerized microservices.

    - Fit metrics to models to understand relationships.


    Monitoring is a key component of microservice architecture. You may have a dozen
    to thousands of microservices (true for a big enterprise''s large project) based
    on project size. Even for scaling and high availability, organizations created
    a cluster or load balanced pool/pod for each microservice, even pools for each
    microservice based on versions. Ultimately, it increases the number of resources
    you need to monitor, including each microservice instance. In addition, it is
    important that you have a process in place so that whenever something goes wrong,
    you know it immediately, or better, receive a warning notification before something
    goes wrong. Therefore, effective and efficient monitoring is crucial for building
    and using the microservice architecture. Netflix uses security monitoring using
    tools as Netflix Atlas (real-time operational monitoring which processes 1.2 billion
    metrics), Security Monkey for monitoring security on AWS-based environments),
    Scumblr (intelligence-gathering tool) and FIDO (for analyzing events and automated
    incident reporting).'
