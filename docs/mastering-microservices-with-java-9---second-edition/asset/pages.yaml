  md: '# Setting Up the Development Environment


    We will implement two URIs for a Calculation resource—the square root (Math.sqrt()
    function) as the /calculations/sqrt URI, and power (Math.pow() function) as the
    /calculation/power URI.


    # The @RequestMapping annotation


    The @RequestMapping annotation is used at class level to map the /calculation
    URI to the CalculationController class, is that, it ensures the HTTP request to
    /calculation is mapped to the CalculationController class. Based on the path defined
    using @RequestMapping of the URI (postfix of /calculation, example, /calculation/sqrt/144),
    it would be mapped to respective methods. Here, the request mapping /calculation/sqrt
    is mapped to the sqrt() method and /calculation/power is mapped to the pow() method.


    You might also have observed that we have not defined method default (GET/PUT,
    and so on) these methods would use. The @RequestMapping annotation maps all the
    HTTP requests by default. You could use specific methods by using the method property
    of RequestMapping. For example, you could write a @RequestMethod annotation in
    the following to use the POST method:


    ```

    @RequestMapping(value = "/pow", method = POST)

    ```


    For passing the parameters along the way, the sample demonstrates both request
    parameters and path parameters using annotations @RequestParam and @PathVariable,
    respectively.


    # The @RequestParam annotation


    @RequestParam is responsible for binding the query parameter to the parameter
    of the controller''s method. For example, the QueryParam base and exponent are
    bound to parameters b and e of method pow() of CalculationController. Both of
    the query parameters of the pow() method are required since we are not using any
    default value for them. Default values for query parameters can be set using the
    defaultValue property of @RequestParam, for example, @RequestParam(value="base",
    defaultValue="2"). Here, if the user does not pass the query parameter base, then
    the default value 2 would be used for the base.'
