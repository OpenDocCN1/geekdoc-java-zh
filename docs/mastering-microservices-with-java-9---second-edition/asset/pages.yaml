  md: 'Migrating a Monolithic Application to Microservice-Based Application


    Chapter 11


    # Process automation and tools setup


    Agile methodologies work hand in hand with microservices. You can use any Agilenprocesses,
    such as Scrum and Kanban with modern development processes, such as test-

    driven development or peer programming, for incremental development. Process automation

    aust for microservice-based environments. You should have automated CI/CD and
    test

    automation in place. If containerization of deliverables is not yet done with
    the CI/CD

    pipeline, then you should do it. It enables successful integration of newly developed

    microservices with the existing system or other microservices.


    You would wanting to set up the service discovery, service gateway, configuration
    server, or

    an event-based system in parallel or prior to the start of your first microservice

    transformation.


    # Pilot project


    Another problem I have observed in microservice migration is starting development
    with

    different modules altogether. Ideally, a small team should perform the pilot project
    to

    transform any of the existing modules to microservices. Once it is successful,
    the same

    approach can be replicated to other modules. If you start the migration of various
    modules

    simultaneously, then you may repeat the same mistake in all microservices. It
    increases the

    risk of failures and the duration of transformation.


    A team that performs successful migration offers the way to developed modules
    and its

    integration with existing monolithic applications successfully. If you successfully
    developed

    and transformed each module into a microservice one by one, at some point in time,
    you

    would a microservice-based application instead of a monolithic application.


    # Standalone user interface applications


    If you already have standalone user interface applications that consume APIs,
    then you are

    already steps away from a successful migration. If this is not the case, it should
    be the first

    step to separate your user interface from the server code. UI applications would
    consume

    APIs. If the existing application does not have the APIs that should be consumed
    by the

    UI applications, then you should write the wrapper APIs on top of the existing
    code.


    [ 283 ]'
