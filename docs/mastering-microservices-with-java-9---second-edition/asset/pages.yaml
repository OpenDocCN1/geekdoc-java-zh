  md: '# 11

    Migrating a Monolithic Application to Microservice-Based Application


    We are at the last chapter of this book and I hope you have enjoyed and mastered
    the full stack (except DB) microservice development. I have tried to touch upon
    all necessary topics that will give you a complete view of a microservice-based
    production application and allow you to move forward with more exploration. Since
    you have learned about microservice architecture and design, you can easily differentiate
    between a monolithic application and a microservice-based application, and you
    can identify what work one needs to migrate a monolithic application to a microservice-based
    application.


    In this chapter, we''ll talk about refactoring a monolithic application to a microservice
    based application. I assume an existing monolithic application is already deployed
    and being used by customers. At the end of this chapter, you''ll learn about the
    different approaches and strategies one can use to make monolithic migration to
    microservice easier.


    This chapter covers the following topics:


    +   - Do you need to migrate?

    - Approaches and keys for successful migration'
