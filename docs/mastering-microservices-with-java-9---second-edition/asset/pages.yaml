- img_proc: true
  md: '# OAuth 2.0 grant types


    The client requests an access token from the authorization server, based on the
    obtained authorization from the resource owner. The resource owner gives authorization
    in the form of an authorization grant. OAuth 2.0 defines four types of authorization
    grant:


    +   * Authorization code grant

    * Implicit grant

    * Resource owner password credentials grant

    * Client credentials grant


    OAuth 2.0 also provides an extension mechanism to define additional grant types.
    You can explore this in the official OAuth 2.0 specifications.


    # Authorization code grant


    The first sample flow that we discussed in the OAuth 2.0 example flow for signing
    in with Twitter depicts depicts an authorization code grant. We will add a few
    more steps for the complete flow. As you know, the eighth step, the end user logs
    in to the Quora application. Let''s assume the user is logging in to Quora for
    the first time and requests their Quora profile page:


    +   1. After logging in, the Quora user clicks on their Quora profile page.

    2. The OAuth client Quora requests the Quora user''s (resource owner) resources
    (for example, Twitter profile photo, and so on) from the Twitter resource server
    and sends the access token received in the previous step.

    3. The Twitter resource server verifies the access token using the Twitter authorization
    server.

    4. After successful validation of the access token, the Twitter resource server
    provides the requested resources to Quora (OAuth client).

    5. Quora uses these resources and displays the Quora profile page of the end user.


    # Authorization code requests and responses


    If you look at all the steps (a total of 13) of the authorization code flow, as
    shown in the following figure, you can see that there are a total of two requests
    made by the client to the authorization server, and the authorization server provides
    two responses: one request-response for the authentication token and one request-response
    for the access token.'
