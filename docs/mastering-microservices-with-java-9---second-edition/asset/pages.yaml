  md: '# A Solution Approach


    # Chapter 1


    Now let us discuss the limitations you''d face while working with Monolithic applications.


    # One dimension scalability


    Monolithic applications are large when scaled, scale everything as all the components
    are bundled together. For example, in the case of a restaurant table reservation
    application, even if you would like to scale the table-booking service, it would
    scale the whole application; it cannot scale the table-booking service separately.
    It does not utilize the resources optimally.


    In addition, this scaling is one-dimensional. Running more copies of the application
    provides the scale with increasing transaction volume. An operation team could
    adjust the number of application copies using a load-balancer based on the load
    farm or cloud. Each of these copies would access the same data source, therefore
    increasing the memory consumption, and the resulting I/O operations making caching
    less effective.


    Microservices give the flexibility to scale only those services where scale is
    required and allows optimal utilization of the resources. As we mentioned previously,
    when it is needed, you can scale the just-booking service without affecting any
    of the other components. It also allows two-dimensional scaling; here we can not
    only increase the transaction volume, but also the data volume using caching (Platform
    scale).


    A development team can then focus on the delivery and shipping of new features,
    instead of worrying about the scaling issues (Product scale).


    Microservices could help you scale platform, people, and product dimensions as
    we have seen previously. People scaling here refers to an increase or decrease
    in team size depending on microservices'' specific development and focus needs.


    Microservice development using RESTful web-service development makes it scalable
    in this sense that the server of REST is stateless; this means there is not much
    communication between servers, which makes it horizontally scalable.


    # Release rollback in case of failure


    Since monolithic applications are either bundled in the same archive or contained
    in a single directory, they prevent the deployment of code modularity. In example,
    many of you may have experienced the pain of delaying rolling out the whole release
    due to the failure of one feature.'
  merge: -1
  pgno: 26
- img_proc: true
  md: '# A Solution Approach


    # Chapter 1


    To resolve these situations, microservices gives us the flexibility to rollback
    only those features that have failed. It''s a very flexible and productive approach.
    For example, let''s assume you are the member of an online shopping portal development
    team and want to develop an application based on microservices From different
    domains such as products, payments, cart, and so on, package all these components
    as separate packages. Once you have deployed all these packages separately, these
    would act as single components that can be developed, tested, and deployed independently,
    and called µService.


    Now, let''s see how that helps you. Let''s say that after a production release
    launching new features, enhancements, and bug fixes, if you find flaws in the
    payment service that need an immediate fix. Since the architecture you use is
    based on microservices, you can rollback the payment service instead of rolling
    back the whole release, if your application architecture allows, or apply the
    fixes to the microservices payment service without affecting the other services.
    This not only allows you to handle failure properly, but it also helps to deliver
    the features/fixes swiftly to a customer.


    # Problems in adopting new technologies


    Monolithic applications are mostly developed and enhanced based on the technologies
    primarily used during the initial development of a project or a product. It makes
    it very difficult to introduce new technology at a later stage of the development
    or once the product is in a mature state (for example, after a few years). In
    addition, different modules in the same project, depend on different versions
    of the same library, which can make this more challenging.


    Technology is improving over year. For example, your system might be designed
    in Java and then, a few years later, you want to develop a new service in Ruby
    on Rails or NodeJS because of a business need or to utilize the advantages of
    new technologies. It would be very difficult to utilize the new technology in
    an existing monolithic application.


    It is not just about code-level integration, but also about testing and deployment.
    It is possible to adopt a new technology by re-writing the entire application,
    but it is time-consuming and a risky thing to do.


    On the other hand, because of its component-based development and design, microservices
    gives us the flexibility to use any technology, new or old, for its development.
    It does not restrict you to using specific technologies, it gives a new paradigm
    for your development and engineering activities. You can use Ruby on Rails, NodeJS,
    or any other technology at any time.'
  merge: -1
