  md: "# Modules\n\nModules are the best way to separate related business objects.\
    \ These are best suited to projects where the size of domain objects is bigger.\
    \ For the end user, it makes sense to divide the domain model into modules and\
    \ set the relationship between these modules. Once you understand the modules\
    \ and your relationship, start to see the big picture of the domain model, thus\
    \ it's easier to drill down further and understand the model.\n\nModules also\
    \ help in code that is highly cohesive, or maintains low coupling. Ubiquitous\
    \ language can be used to name these modules. For the table booking system, we\
    \ could have different modules, such as user-management, restaurants and tables,\
    \ analytics and reports, and so on.\n\n# Strategic design and principles\n\nAn\
    \ enterprise model is usually very large and complex. It may be distributed among\
    \ different departments in an organization. Each department may have a separate\
    \ leadership team, so working and designing together can create difficulty and\
    \ coordination issues. In such scenarios, maintaining the integrity of the domain\
    \ model is not an easy task.\n\nIn such cases, working on a unified model is not\
    \ the solution, and large enterprise models need to be divided into different\
    \ submodels. These submodels contain the accurate relationship and contract in\
    \ minute detail. Each submodel has to maintain the defined contracts without any\
    \ exception.\n\nThere are various principles that could be followed to maintain\
    \ the integrity of the domain model, and these are listed as follows:\n\n+   *\
    \ Bounded context\n* Continuous integration\n* Context map\n  * Shared kernel\n\
    \  * Customer-supplier\n  * Conformist\n  * Anticorruption layer\n  * Separate\
    \ ways\n  * Open Host Service\n  * Distillation"
