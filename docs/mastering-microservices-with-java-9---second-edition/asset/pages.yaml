  md: '# Securing Microservices


    # Chapter 7


    Error response:


    | Parameter | Required/optional | Description |

    | --- | --- | --- |

    | error | Required | One of the error codes defined in the specification, unauthorized_client
    or invalid_scope. |

    | error_description | Optional | Short description of the error. |

    | error_uri | Optional | The URI of the error page describing the error. |


    An additional error parameter state is also sent in the error response if the
    state was passed in the client authorization request.


    # Implicit grant


    There are no authorization code steps involved in the implicit grant flow. It
    provides the implicit grant for authorization code. Except the authorization code
    step, everything is the same if you compare the implicit grant flow against the
    authorization code grant flow. Therefore, it is called implicit grant. Let''s
    find out its flow:


    +   1. The client application (for example, Quora) sends the access token request
    to the resource server (for example, Facebook, Twitter, and so on) with the client
    ID, redirect URI, and so on.

    2. The user may need to authenticate if not already authenticated. On successful
    authentication and other input validation, the resource server sends the access
    token.

    3. The OAuth client requests the user''s (resource owner) resources (for example,
    Twitter profile photo, and so on) from the resource server and sends the access
    token received in the previous step.

    4. The resource server verifies the access token using the authorization server.

    5. After successful validation of the access token, the resource server provides
    the requested resources to the client application (OAuth client).

    6. The client application uses these resources.'
