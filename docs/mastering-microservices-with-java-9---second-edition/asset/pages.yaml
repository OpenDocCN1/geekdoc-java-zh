  md: 'Best Practices and Common Principles Chapter 9


    Paying attention to the previous points will mitigate any possible difficulties
    you may encounter when you migrate to microservices.


    Generally, large or complex projects should be developed using microservices-based
    architecture, due to the many advantages it provides, as discussed in previous
