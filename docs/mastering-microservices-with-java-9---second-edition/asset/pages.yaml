  md: '# Resource owner password credentials grant


    This flow is normally used on mobile or desktops applications. In this grant flow,
    only two requests are made: one for requesting an access token and another for
    access token verification, similar to implicit grant flow. The only difference
    is the resource owner’s username and password are sent along with the access token
    request. (In implicit grant, which is normally on a browser, redirects the user
    to authenticate itself.) Let’s find out its flow:


    +   1. The client application (for example, Quora) sends the access token to the
    resource server (for example, Facebook, Twitter, and so on) with client ID, resource
    owner’s username and password, and so on. On successful parameter validation,
    the resource server sends the access token.

    2. The OAuth client requests the user’s (resource owner) resources (for example,
    Twitter profile photo) from the resource server and sends the access token received
    in the previous step.

    3. The resource server verifies the access token using the authorization server.

    4. After successful validation of the access token, the resource server provides
    the requested resources to the client application (OAuth client).

    5. The client application uses these resources.


    The resource owner’s password credentials grant requests and responses.


    As seen in the previous section, in all of the steps (a total of five) of the
    resource owner password credential grant flow, you can see that there are a total
    of two requests made by the client to the authorization server, and the authorization
    server provides two responses: one request-response for the access token and one
    request-response for resource owner resources.


    Let’s discuss the parameters used for each of these requests and responses.'
