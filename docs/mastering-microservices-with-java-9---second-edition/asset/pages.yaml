  md: 'Securing Microservices


    Chapter 7


    # Client credentials grant


    As the name suggests, the client''s credentials are used instead of the user''s
    (resource owner''s). Except client credentials, it is very similar to the resource
    owner password credentials grant flow:


    +   1. The client application (for example, Quora) sends the access token request
    to the resource server (for example, Facebook, Twitter, and so one) with the grant
    type and scope. The client ID and secrets are added to the authorization header.
    Successful validation, the resource server sends the access token.

    2. The OAuth client requests the user''s (resource owner) resources (for example,
    Twitter profile photo, and so on) from the resource server and sends the access
    token received in the previous step.

    3. The resource server verifies the access token using the authorization server.

    4. After successful validation of the access, the resource server provides the
    requested resources to the client application (OAuth client).

    5. The client application uses these resources.


    Client credentials grant requests and responses.


    If you looked at all the steps (a total of five) of the client credentials grant
    flow, you can see that there are a total of two requests made by the client to
    the authorization server, and the authorization server provides two responses:
    one request-response for the access token and one request-response for the resource
    that involves access token verification.


    Let''s discuss the parameters used for each of these requests and responses.


    Access token request to the endpoint URI:


    | Parameter | Required/optional | Description |

    |---|---|--|

    | grant_type | Required | client_credentials (this value must be used). |

    | scope | Optional | The scope of the request. If not provided, then the authorization
    server provides the scope based on the defined policy. |


