  md: '# Deployment and Testing


    In this chapter, we''ll continue from where we left off in Chapter 4, Implementing
    a Microservice. We''ll add a few more services to groom our online table reservation
    system (OTRS) application that only depends on three functional services (Restaurant,
    User, and Booking services) and Eureka (service discovery and registration) to
    create a fully functional microservice stack. This stack will have gateway (Zuul),
    load balancing (Ribbon with Zuul and Eureka), and monitoring (Hystrix, Turbine,
    and the Hystrix dashboard). You want to have compose APIs and see how one microservice
    talks to others. This chapter will also explain how to containerize microservices
    using Docker and how to run multiple containers using docker-compose. On top of
    this, we''ll also add the integration tests.


    In this chapter, we will cover the following topics:


    +   - An overview of microservice architecture using Netflix OSS

    - Edge servers

    - Load balancing microservices

    - Circuit breakers and monitoring

    - Microservice deployment using containers

    - Microservice integration testing using Docker containers'
