  md: '# A Solution Approach


    # Chapter 1


    # Monolithic design with services


    SOA, applications started being developed based on services, where each component
    provides the services to other components or external entities. The following
    diagram depicts the monolithic application with different services; here services
    are being used with a Presentation component. All services, the Presentation component,
    or any other components are bundled together:


    ![](img/f551c3d57000fcdbbc1268267d5af69e_24_0.png)


    # Services design


    The following third design depicts the microservices. Here, each component represents
    autonomy. Each component could be developed, built, tested, and deployed independently.
    Here, even the application User Interface (UI) component could also be a client
    and consume the microservices. For the purpose of our example, the layer designed
    is within uService.


    The API Gateway provides the interface where different clients can access the
    individual services and solve the following problems:


    What do you do when you want to send different responses to different clients
    for the same service? For example, a booking service could send different responses
    to a mobile client (minimal information) and a desktop client (detailed information)
    providing different details, and something different again to a third-party client.'
