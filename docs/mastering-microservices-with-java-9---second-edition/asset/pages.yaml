  md: '# Implicit grant


    Implicit grants are very similar to authorization code grants, except for the
    code grant step. If you remove the first step—the code grant step (where the client
    application receives the authorization token from the authorization server)—from
    the authorization code grant, the rest of the steps are the same. Let''s check
    it out.


    Enter the following URL and parameters in the browser and press Enter. Also, make
    sure to add basic authentication, with the client as username and the password
    as password if asked:


    ```

    https://localhost:9001/auth/oauth/authorize?response_type=token&redirect_uri=https://localhost:8765?scope=apiAccess&state=553344&client_id=client

    ```


    Here, we call the authorization endpoint with the following request parameters:
    response type, client ID, redirect URI, scope, and state.


    When the request is successful, the browser will be redirected to the following
    URL with new request parameters and values:


    ```

    https://localhost:8765/#access_token=6a233475-a5db-476d-8e31-d0aeb2bd003e9u9&token_type=bearer&state=553344&expires_in=19592

    ```


    Here, we receive the access_token, token_type, state, and expiration duration
    for the token. Now, we can use this access token to access the APIs, as used in
    the authorization code grant.


    # Resource owner password credential grant


    In this grant, we provide username and password as parameters when requesting
    the access token, along with the grant_type, client, and scope parameters. We
    also need to use the client ID and secret to authenticate the request. These grant
    flows use client applications in place of browsers, and are normally used in mobile
    and desktop applications.'
  merge: -1
