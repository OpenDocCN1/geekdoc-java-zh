  md: '# Sample domain service


    Let us create a sample domain service based on our table reservation system. As
    discussed in this chapter, the importance of an efficient domain layer is the
    key to successful products or services. Projects developed based on the domain
    layer are more maintainable, highly cohesive, decoupled. They provide high scalability
    in terms of business requirement changes, and have a low impact on the design
    of other layers.


    Domain-driven development is based on domain, hence it is not recommended that
    you use a top-down approach where the UI would be developed first, followed by
    the rest of the layers, and finally the persistence layer. You should use a bottom-up
    approach, where the persistence layer like the DB is designed first, followed
    by the rest of the layers, with the UI last.


    Having a domain model developed first, using the patterns described in this book,
    gives clarity to all members functionality-wise, and an advantage to the software
    designer to helps the organization to launch a world-class product with fewer
    maintenance costs.


    Here, you will create a restaurant service that provides the feature to add and
    retrieve restaurants. Based on implementation, you can add other functionalities,
    such as finding restaurants based on cuisine or ratings.


    Start with the entity. The restaurant is our entity, as each restaurant is unique
    and has an identifier. You can use an interface, or set of interfaces, to implement
    the entity in our table reservation system. Ideally, if you go the interface segregation
    principle, you will use a set of interfaces rather than a single interface.


    > The Interface Segregation Principle (ISP) states that clients should not be
    forced to depend upon interfaces that they do not use.


    # Entity implementation


    For the first interface, you could have an abstract class or interface that is
    required by all the entities. For example, if we consider ID and name, attributes
    would be common for all entities.'
