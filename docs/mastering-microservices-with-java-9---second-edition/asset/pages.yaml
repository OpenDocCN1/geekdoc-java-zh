  md: "# Reactive Microservices\n\nNow, since our dependencies are in place, we can\
    \ start writing producer implementation. Booking microservice would send the amp.bookingOrdered\
    \ event to the Kafka stream. We'll declare the message channel for this purpose.\
    \ It can be done either using Source.OUTPUT with the @InboundChannelAdapter or\
    \ by declaring the Java interface. We'll use the interface approach because it\
    \ is easier to understand and correlate.\n\nWe'll create the BookingMessageChannels.java\
    \ message channel in the com.packtub.mmj.booking.domain.service.message package.\
    \ Here, we can add all the message channels that are required. Since we are using\
    \ the single event for sample implementation, we have to just declare the bookingOrderOutput.\n\
    \nThe BookingMessageChannels.java file will look something like this:\n\n```\n\
    package com.packtub.mmj.booking.domain.message;\n\nimport org.springframework.cloud.stream.annotation.Output;\n\
    import org.springframework.messaging.MessageChannel;\n\npublic interface BookingMessageChannels\
    \ {\n\n    public final static String BOOKING_ORDER_OUTPUT = \"bookingOrderOutput\"\
    ;\n\n    @Output(BOOKING_ORDER_OUTPUT)\n    MessageChannel bookingOrderOutput();\n\
    }\n```\n\nHere, we have just defined the name of the message channel, bookingOrderOutput,\
    \ using the @Output annotation. We also need to configure this message channel\
    \ in application.yaml. We'll use this name to define the Kafka topic in the application.yaml\
    \ file:\n\n```\nspring:\n  cloud:\n    bindings:\n      bookingOrderOutput:\n\
    \        destination: amp.bookingOrdered\n```\n\nHere, the Kafka topic name amp.bookingOrder\
    \ message channel is given that is bound to the bookingOrderOutput message channel.\
    \ (Kafka topic name could be any string. We prefix amp to denote asynchronous\
    \ message passing; you can use Kafka topic name with or without prefix.)"
