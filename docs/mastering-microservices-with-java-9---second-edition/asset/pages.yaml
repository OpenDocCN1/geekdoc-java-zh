  md: '# Evolution of microservices


    Martin Fowler explains:


    > The term microservice was discussed at a workshop of software architects near
    Venice in May 2011 to describe what the participants saw as a common architectural
    style that many of them had been recently exploring. In May 2012, the group decided
    on µServices as the most appropriate name.


    Let''s get some background on the way it has evolved over the years. Enterprise
    architecture evolved more from historic mainframe computing, through client-server
    architecture (two-tier to n-tier) to Service-Oriented Architecture (SOA).


    The transformation from SOA to microservices is not a standard defined by an industry
    organization, but a practical approach practiced by many organizations. SOA eventually
    evolved to become microservices.


    Adrian Cockcroft, a former Netflix Architect, describes it as:


    > Fine grain. SOA so microservice is with emphasis on small ephemeral components.


    Similarly, the following quote from Mike Gancarz, a member that designed the X
    Windows system, which defines one of the paramount precepts of Unix philosophy,
    suits the microservice paradigm as well:


    > Small is beautiful.


    Microservices shares many common characteristics with SOA, such as the focus on
    services and how one service decouples from another. SOA evolved around monolithic
    application integration by exposing API that was most Simple Object Access Protocol
    (SOAP) based. Therefore, middleware such as Enterprise Service Bus (ESB) is very
    important for SOA. Microservices are less complex, and even though they may use
    the message bus it is only used for message transport and it does not contain
    any logic. It is simply based on smart endpoints.


    Tony Pujals defined microservices beautifully:


    > In my mental model, I think of self-contained (as in containers) lightweight
    processes communicating over HTTP, created and deployed with relatively small
    effort and ceremony, providing narrowly-focused APIs to their consumers.'
  merge: -1
  pgno: 21
- img_proc: true
  md: '# A Solution Approach


    # Chapter 1


    Though Tony only talks about the HTTP, event-driven microservices may use the
    different protocol for communication. You can make use of Kafka for implementing
    the event-driven microservices. Kafka uses the wire protocol, a binary protocol
    over TCP.


    # Monolithic architecture overview


    Microservices is not something new, it has been around for many years. For example,
    a general purpose infrastructure based on Remote Procedure Call (RPC) was used
    in Google data centers in the early 2000s to connect a network of service and
    access data centers. Its recent rise is owing to its popularity and visibility.
    Before microservices became popular, there was primarily monolithic architecture
    that was being used for developing on-premise and cloud applications.


    Monolithic architecture allows the development of different components such as
    presentation, application logic, business logic, and Data Access Objects (DAO),
    and then you either bundle them together in Enterprise Archive (EAR) or Web Archive
    (WAR), and store them in a single directory hierarchy (for example, Rails, NodeJS,
    and so on).


    Many famous applications such as Netflix have been developed using microservices
    architecture. Moreover, eBay, Amazon, and Groupon have evolved from monolithic
    architecture to a microservices architecture.


    Now that you have had an insight into the background and history of microservices,
    let''s discuss the limitations of a traditional approach, namely monolithic application
    development, and compare how microservices would address them.


    # Limitation of monolithic architecture versus its solution with microservices


    As know, change is eternal. Humans always look for better solutions. This is how
    microservices became what it is today and it may evolve further in the future.
    Today, organizations are using Agile methodologies to develop applications--it
    is a fast-paced development environment and it is also on a much larger scale
    after the invention of cloud and distributed technologies. Many argue that monolithic
    architecture could also serve a similar purpose and be aligned with Agile methodologies,
    but microservices still provides a better solution to many aspects of production-ready
    applications.'
  merge: -1
  pgno: 22
