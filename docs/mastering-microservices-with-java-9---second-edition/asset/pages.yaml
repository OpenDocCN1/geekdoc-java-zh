- img_proc: true
  md: '# Best Practices and Common Principles


    Similarly, due to different data stores, actual project data is also spread across
    multiple data stores and it makes data management more complicated, because separate
    storage systems can easily get out of sync or become inconsistent, and foreign
    keys can change unexpectedly. To resolve such an issue, you need to use master
    data management (MDM). MDM tools operate in the background and find inconsistencies
    if they exist any. For the O sample example, it might check every database that
    stores booking request IDs, to verify that the same IDs exist in all of them (in
    other words, there aren''t missing or extra IDs in any database). MDM tools available
    in the market include Informatica, IBM MDM Advance Edition, Oracle Siebel UCM,
    Postgres (master streaming replication), mariadb(master/master configuration),
    and so on.


    If none of the exists products suits your requirements, or you are not interested
    in a proprietary product, then you can write your own. Specifically, API-driven
    development and platforms reduce such complexities; therefore, it is important
    that microservices should be developed with an API platform.


    # Transaction boundaries


    We went through domain-driven design concepts in Chapter 3, Domain-Driven Design.
    Please review this if you have not grasped it thoroughly, as it gives you an understanding
    of the state vertically. Since we are focusing on microservice-based design, the
    result is that we have a system of systems, where each microservice represents
    a system. In this environment, finding the state of a whole system at any given
    point in time is very challenging. If you are familiar with distributed applications,
    then you may be comfortable in such environment, with respect to state.


    It is very important to have transaction boundaries in place that describe which
    microservice owns a message at any given time. You need a way or process that
    can participate in transactions, routed routes, and error handlers, idempotent
    consumers, and compensating actions. It is not an easy task to ensure transactional
    behavior across heterogeneous systems, but there are tools available that do the
    job for you.


    For example, Camel has great transactional capabilities that help developers easily
    create services with transactional behavior.'
