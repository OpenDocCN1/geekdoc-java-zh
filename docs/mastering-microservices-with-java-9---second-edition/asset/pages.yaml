    If you want to target the Internet Explorer browser versions greater than eight
    or IE version nine onwards, then we need to add the following block of code that
    will prevent JavaScript from rendering and give the no-js output to the end:


    After, adding a few meta tags and the title of the application, we''ll also define
    the important meta tag viewport. The viewport is used for responsive UI.


    The width property defined in the content attribute controls the size of the viewport.
    It can be set to a specific number of pixels, as width = 600, or to the special
    device-width value that is the width of the screen in CSS pixels at a scale of
    100%.


    The initial-scale property controls the zoom level when the first page is loaded.
    The maximum-scale, minimum-scale, and user-scalable properties control how users
    are allowed to zoom the page in or out:


    ```

