- img_proc: true
  md: '# 9 Best Practices and Common Principles


    After all the hard work put in by you toward gaining the experience of developing
    a microservice sample project, you must be wondering how to avoid common mistakes
    and improve the overall process of developing microservice-based products and
    services. We can follow these principles or guidelines to simplify the process
    of developing microservices and avoid/reduce the potential limitations. We will
    focus on these key concepts in this chapter.


    This chapter is spread across the following three sections:


    +   - Overview and mindset

    - Best practices and principles

    - Microservice frameworks and tools


    # Overview and mindset


    You can implement microservice-based design on new and existing products and services.
    Contrary to the belief that it is easier to develop and design a new system from
    scratch rather than making changes to an existing one that is already live, each
    approach has its own respective challenges and advantages.'
  merge: -1
  pgno: 257
- img_proc: true
  md: '# Best Practices and Common Principles


    # Chapter 9


    For example, since there is no existing system design for a new product or service,
    you have freedom and flexibility to design the system without giving any thought
    to its impact. However, you don''t have the clarity on both functional and system
    requirements for a new system, as these mature and take shape over time. On the
    other hand, for mature products and services, you have taken detailed knowledge
    and information of the functional and system requirements. Nevertheless, you have
    a challenge to mitigate the risk of impact that design change brings to the microservices.
    Therefore, when it comes to updating a production system from monolithic to microservices,
    you will need to plan better than if you were building a system from scratch.


    Experienced and software design experts and architects always evaluate the pros
    and cons and take a cautious approach to making any change to existing live systems.
    One should not make changes to existing system simply because it may be cool or
    trendy. Therefore, if you would like to update the design of your existing production
    system to microservices, you will need to evaluate all the pros and cons before
    making this call.


    I believe that monolithic systems provide a great platform to upgrade to a successful
    microservice-based design. Obviously, we are not discussing this case. You have
    ample knowledge of the existing system and functionality, which enables you to
    divide the existing system and build microservices based on functionalities and
    how those would interact with each other. Also, if your monolithic product is
    already modularized in some way, directly transforming microservices by exposing
    an API instead of an Application Binary Interface (ABI) is possibly the easiest
    way of achieving a microservice architecture. A successful microservice-based
    system is more dependent on microservices and their interaction protocol than
    anything else.


    Having said, it does not mean that you can have a successful microservice-based
    system if you are starting from scratch. It is recommended to start a new project
    based on monolithic design that gives you perspective and understanding of the
    system and functionality. It allows you to find bottlenecks quickly and guides
    you to identify any potential feature that can be developed using microservices.
    Here, we have not discussed the size of the project, which is another important
    factor. We''ll discuss this in the next section.


    In today''s cloud age and agile development world, it takes an hour between making
    any change and the change going live. In today''s competitive environment, every
    organization would like to have the edge for quickly delivering features to the
    user. Continuous development, integration, and deployment are part of the production
    delivery process, a completely automatic process.'
  merge: -1
