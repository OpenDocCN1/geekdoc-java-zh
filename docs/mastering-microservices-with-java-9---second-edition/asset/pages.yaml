  md: '# Troubleshooting Guide


    # Chapter 10


    # A brief overview


    The Elasticsearch, Logstash, Kibana (ELK) stack is a chain of tools that performs
    log aggregation, analysis, visualization, and monitoring. The ELK stack provides
    a complete logging platform that allows you to analyze, visualize, and monitor
    all of your logs, including all types of product logs and system logs. If you
    already know about the ELK stack, skip to the next section. Here, we''ll provide
    a brief introduction to each tool in the ELK Stack:


    ![](img/f551c3d57000fcdbbc1268267d5af69e_277_0.png)


    # Elasticsearch


    Elasticsearch is one of the most popular enterprise full text search engines.
    It is open source software. It is distributable and supports multi-tenancy. A
    single Elasticsearch server stores multiple indexes (each index represents a database),
    a single query can search the data of multiple indexes. It is a distributed search
    engine and supports clustering.


    It is readily scalable and can provide near-real-time searches with a latency
    of 1 second. It is developed in Java using Apache Luc. Apache Lucene is free and
    open source, and it provides the core of Elasticsearch, also known as the informational
    retrieval library.


    Elasticsearch APIs are extensive in nature and very elaborative. Elasticsearch
    provides a JSON-based schema, less storage, and represents data models in JSON.
    Elasticsearch APIs use JSON documents for HTTP requests and responses.'
