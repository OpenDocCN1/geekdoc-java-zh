  md: '# # 3 Domain-Driven Design


    This chapter sets the tone for the rest of the chapters by referring to one sample
    project. The sample project will be used to explain different microservices concepts
    from here onward. This chapter uses this sample project to drive through different
    combinations of functional and domain services, or applications to explain domain-driven
    design (DDD). It will help you to learn the fundamentals of DDD and its practical
    usage. You will also learn the concepts of designing domain models using REST
    services.


    This chapter covers the following topics:


    +   - Fundamentals of DDD

    - How to design an application using DDD

    - Domain models

    - A sample model design based on DDD


    A good software design is as much the key to the success of a product or services
    as the functionalities offered by it. It carries equal weight to the success of
    product; for example, Amazon.com provides the shopping platform, but its architecture
    design makes it different from other similar sites and contributes to its success.
    It shows how important software or architecture design is for the success of a
    product/service. DDD is one of the software design practices, and we''ll explore
    it with various theories and practical examples.


    DDD is a key design practice that helps to design the microservices of the product
    that you are developing. Therefore, we''ll first explore DDD before jumping into
    microservices development. After studying this chapter, you will understand the
    importance of DDD for microservices development.'
  merge: -1
