  md: '# Spring Boot configuration


    Spring Boot is an obvious choice to develop state-of-the-art production-ready
    applications specific to Spring. Its website (https://projects.spring.io/spring-boot/)
    also states its real advantages:


    +   * Takes an opinionated view of building production-ready Spring applications.
    Spring Boot favors convention over configuration and is designed to get you out
    and running as quickly as possible.


    # Spring Boot overview


    Spring Boot is an amazing Spring tool created by Pivotal and it was released in
    April 2014 (GA). It was developed based on the request of SPR-9888 (https://jira.spring.io/browse/SPR-9888)
    with the title Improved support for ''containerless'' web architectures.


    You must be wondering, why containerless? Because, today''s cloud environment
    or PaaS provides most of the features offered by container-based web architectures,
    such as reliability, management, or scaling. Therefore, Spring Boot focuses on
    making itself an ultralight container.


    Spring Boot is preconfigured to make production-ready web applications very easily.
    Spring Initializr is a page where you can select build tools like Maven or Gradle,
    and project metadata as group, artifact, and dependencies. Once you feed the required
    fields you can just click on the Generate Project button, which will give you
    the Spring Boot project you can use for your production application.


    On this page, the default Packaging option is Jar. We''ll also use JAR for microservices
    development easier. The reason is simple: it makes microservices development easier.
    Just think how difficult it would be to manage and create an infrastructure where
    each microservice runs on its own server instance.


    Josh Long shared in his talk one of the IOs:


    > "It is better to make Jar, not War."'
