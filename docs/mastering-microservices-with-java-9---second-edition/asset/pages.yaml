  md: '# A Solution Approach


    # Chapter 1


    So, how is it achieved? Well, it''s very simple. Microservices-based application
    code does not bundle into a single archive and is not stored in a single directory.
    Each µService has its own archive and is deployed separately. A new service could
    be developed in an isolated environment and could be tested and deployed without
    any technical issues. As you know, microservices also owns its own separate processes;
    it serves its purpose without conflict such as shared resources with tight coupling,
    and processes remain independent.


    Since a microservice is by definition a small, self-contained function, it provides
    a low-risk opportunity to try a new technology. That is definitely not the case
    where monolithic systems are concerned.


    You can make your microservices available as open source software so it can be
    used by others, and if required it may interoperate with a closed source proprietary
    one, which is not possible with monolithic applications.


    # Alignment with Agile practices


    There is no question that monolithic applications can be developed using Agile
    practices, and these are being developed. Continuous Integration (CI) and Continuous
    Deployment (CD) could be used, but the question is—does it use Agile practices
    effectively? Let''s examine the following points:


    +   * For example, when there is a high probability of having stories dependent
    on each other, and there could be various scenarios, a story could not be taken
    until the dependent story is complete

    * The build takes more time as the code size increases

    * The frequent deployment of a large monolithic application is a difficult task
    to achieve

    * You would have to redeploy the whole application if you updated a single component

    * Redeployment may cause problems to already running components, for example,
    a job scheduler may change whether components impact it or not

    * The risk of redeployment may increase if a single changed component does not
    work properly or if it needs more fixes

    * UI developers always need more redeployment, which is quite risky and time-consuming
    for large monolithic applications'
