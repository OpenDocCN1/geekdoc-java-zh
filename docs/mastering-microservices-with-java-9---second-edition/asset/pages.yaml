  md: '# Domain-Driven Design


    # Chapter 3


    No matter how much simplification you input, you may still end up with relationships
    in the model. These relationships need to be maintained in the code. When one
    object is removed, the code should remove all the references to this object from
    other places. For example, a removal from one table needs to be addressed wherever
    it has references in the form of foreign keys and such, to keep the data consistent
    and maintain its integrity. Also, invariants (rules) need to be forced and maintained
    whenever data changes.


    Relationships, constraints, and invariants bring a complexity that requires an
    efficient handling in code. We find the solution by using the aggregate represented
    by the single entity known as the root, which is associated with the group of
    objects that maintains consistency with regards to data changes.


    This root is the only object that is accessible from outside, so this root works
    as a boundary gate that separates the internal objects from the external world.
    Roots can refer to one or more inside objects, and these inside objects can have
    references to other inside objects that may or not have relationships with the
    root. However, outside objects can also refer to the root, and not to any inside
    objects.


    An aggregate ensures data integrity and enforces the invariant. Outside objects
    cannot make any change to inside objects; they can only change the root. However,
    they can use the root to make a change inside object by calling exposed operations.
    The root should pass the value of inside objects to outside objects if required.


    If an aggregate object is stored in the database, then the query should only return
    the aggregate object. Traversal associations should be used to return the object
    when it is internally linked to the aggregate root. These internal objects may
    also have references to other aggregates.


    An aggregate root entity holds its global identity, and holds local identities
    inside the entities.


    A simple example of an aggregate in the table booking system is the customer.
    Customers can be exposed to external objects, and their root object contains their
    internal object address and contact information.


    [ 66 ]'
