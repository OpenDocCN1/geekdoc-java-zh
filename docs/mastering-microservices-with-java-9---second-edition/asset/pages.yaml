    | Parameter | Required/optional | Description |

    | access_token | | The access token issued by the authorization server. |

    | token_type | Required | The token type defined by the authorization server.
    Based on this, the client can utilize the access token. For example, Bearer or
    Mac. |

    | refresh_token | Optional | This token can be used by the client to get a new
    access token using the same authorization grant. |

    | expires_in | Recommended | Denotes the lifetime of the access token in seconds.
    A value of 600 denotes 10 minutes of lifetime for the access token. If this parameter
    is not provided in the response, the document should highlight the lifetime of
    the access token. |

    | scope | Optional/Required | Optional if identical to the scope requested by
    the client. Required if the access token scope is different from the one the client
    provided in their request to inform the client about the actual scope of the access
    granted. If the client does not provide the scope while requesting the access
    token, then the authorization server should provide the default scope, or deny
    the request, indicating the invalid scope. |


