    # # Repository


    In a domain model, at a given point in time, many domain objects may exist. Each
    object may have its own life-cycle, from the creation of objects to their removal
    or persistence. Whenever any domain operation needs a domain object, it should
    retrieve the reference of the requested object efficiently. It would be very difficult
    if you didn''t maintain all of the available domain objects in a central object.
    A central object carries the references of all the objects, and is responsible
    for returning the requested object reference. This central object is known as
    the **repository**.


    The repository is a point that interacts with infrastructures such as the database
    or file system. A repository object is the part of the domain model that interacts
    with storage such as the database, external sources, and so on, to retrieve the
    persisted objects. When a request is received by the repository for an object''s
    reference, it returns the existing object''s reference. If the object does not
    exist in the repository, then it retrieves the object from storage. For example,
    if you need a customer, you would query the repository object to provide the customer
    with ID **31**. The repository would provide the requested customer object if
    it is already available in the repository, and if not, it would query the persisted
    stores such as the database, fetch it, and provide its reference.


    [ 67 ]'
