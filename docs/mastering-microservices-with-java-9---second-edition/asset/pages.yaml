  md: "# Setting Up the Development Environment\n\nCode of CalculationController resource,\
    \ where we have implemented REST endpoints\n\n```\npackage com.packtub.mmj.rest.resources;\n\
    \nimport com.packtub.mmj.lib.model.Calculation;\nimport java.util.ArrayList;\n\
    import java.util.List;\nimport org.springframework.web.bind.annotation.PathVariable;\n\
    import org.springframework.web.bind.annotation.RequestMapping;\nimport static\
    \ org.springframework.web.bind.annotation.RequestMethod.GET;\nimport org.springframework.web.bind.annotation.RequestParam;\n\
    import org.springframework.web.bind.annotation.RestController;\n\n/**\n * @author\
    \ soushamham\n */\n@RestController\n@RequestMapping(\"/calculation\")\npublic\
    \ class CalculationController {\n\n    private static final String PATTERN = \"\
    ^-?+\\d+\\.\\?\\d*$\";\n\n    /**\n     * @param b\n     * @param e\n     * @return\n\
    \     */\n    @RequestMapping(\"/power\")\n    public Calculation pow(@RequestParam(value\
    \ = \"base\") String b, @RequestParam(value = \"exponent\") String e) {\n    \
    \    List<String> input = new ArrayList();\n        input.add(b);\n        input.add(e);\n\
    \        List<String> output = new ArrayList();\n        String powValue;\n  \
    \      if (b != null && e != null && b.matches(PATTERN) &&\n        e.matches(PATTERN))\
    \ {\n            powValue = String.valueOf(Math.pow(Double.valueOf(b), Double.valueOf(e)));\n\
    \        } else {\n            powValue = \"Base or/and Exponent is/are not set\
    \ to numeric.\";\n        }\n        output.add(powValue);\n        return new\
    \ Calculation(input, output, \"power\");\n    }\n}\n```"
