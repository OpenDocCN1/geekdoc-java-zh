  md: '# # Reactive Microservices


    In this chapter, we''ll implement reactive microservices using Spring Boot, Spring
    Stream, Apache Kafka, and Apache Avro. We''ll make use of the existing Booking
    microservice to implement the message producer, or in other words, generate the
    event. We''ll also create a new microservice (Billing) for consuming the messages
    produced by the updated Booking microservice, or we can say, for the event generated
    by the Booking microservice. We''ll also discuss the tradeoffs between REST-based
    microservice and event-based microservice.


    In this chapter, we will cover the following topics:


    +   - An overview of the reactive microservice architecture

    - Producing an event

    - Consuming the event


    # ## An overview of the reactive microservice architecture


    So far, the microservices we have developed are based on REST. We have used REST
    for both internal (inter-microservice, where one microservice communicates with
    another microservice in the same system) and external (through the public API)
    communication. At present, REST fits best for the public API. Are there other
    alternatives for inter-microservices communication? Is it the best approach to
    implement the REST for inter-microservices communication? We''ll discuss all this
    in this section.'
  merge: -1
  pgno: 157
- img_proc: true
  md: '# Reactive Microservices


    You can build microservices that are purely asynchronous. You can build microservicebased
    systems that would communicate based on events. There is a tradeoff between REST
    and event-based microservices. REST provides synchronous communication, whereas
    reactive microservices are based on asynchronous communication (asynchronous message
    passing).


    We can use asynchronous communication for inter-microservice communication. Based
    on the requirement and functionality, we can choose REST or asynchronous message
    passing. Consider the example case of a user placing an order, which makes a very
    good case for implementing reactive microservices. On successful order placement,
    the inventory service would recalculate the available items; account service would
    send the messages (SMS, emails, and so on) to all involved users such as a customer
    and a supplier. In this case, more than one microservice may perform distinct
    operations (inventory, account, messaging, and so on) based on an operation (order
    placement) performed in one microservice. Now, just think if all these communications
    were synchronous. Instead, reactive communication, with asynchronous message passing,
    provides efficient use of hardware resources, non-blocking, low latency, and high
    throughput operations.


    We can primarily divide the microservice implementations into two groups—REST-based
    microservices and event-based/message-driven microservices. Reactive microservices
    are event-based.


    ![](img/f551c3d57000fcdbbc1268267d5af69e_158_0.png)


    Reactive microservices are based on the Reactive Manifesto (https://www.reactivemanifesto.org/).
    The Reactive Manifesto comprises four principles, which we will now discuss.'
  merge: -1
  pgno: 158
- img_proc: true
  md: '# Reactive Microservices


    # Chapter 6


    # Responsive


    Responsiveness is the characteristic of serving a request in a timely manner.
    It is measured by the latency. The producer should provide the response in time
    and the consumer should receive the response in time. A failure in the chain of
    operations performed for a request should not cause a delay in response or failure.
    Therefore, it is very important for availability of services.


    # Resilient


    A resilient system is a robust system. The resilient principle is in line with
    the responsive principle. A microservice, despite failures, should provide the
    response, and if one instance of the microservice goes down, the request should
    be served by another node of the same microservice. A resilient microservice should
    be monitored for detecting failures and all failures should be handled. We have
    used the service discovery eureka for monitoring and Hystrix for circuit breaker
    pattern implementation in the last chapter.


    # Elastic


    A reactive system is elastic if it reacts to the load by utilizing the hardware
    and other resources optimally. It can bring new instances of a microservice or
    microservices if the demand increases and vice versa. On special sales days, such
    as Black Friday, Christmas, Diwali, and so on, a reactive shopping application
    would instantiate a greater number of microservice nodes in order to share the
    load of requests. On normal days, the shopping application may not require a bigger
    number of resources on average, hence it can reduce the number of nodes. Therefore,
    for effectively using the hardware, a reactive system should be elastic in nature.


    # Message driven


    A reactive system would idle if it has nothing to do; it would not use the resources
    unnecessarily if it was not supposed to do so. An event or a message may make
    a reactive microservice active and start working (reacting) on the received event/message
    (request). Ideally, communication should be asynchronous and non-blocking by nature.
    A reactive system uses messages for communication—asynchronous message passing.
    In this chapter, we will use the Apache Kafka for messaging.'
  merge: -1
  pgno: 159
- img_proc: true
  md: '# Reactive Microservices


    # Chapter 6


    Ideally, a reactive programming language is the best way to implement the reactive
    microservices. A reactive programming language provides asynchronous and non-blocking
    calls. Java could also be used for developing the reactive microservices with
    the use of Java streaming feature. Kafka would be used for messaging with Kafka''s
    Java libraries and plugins. We have already implemented service discovery and
    registry service (Eureka Server-monitoring), the proxy server (Zuul) with Eureka
    for elasticity, and Hystrix with Eureka for Circuit Breaker (resilient and responsive).
    In the next section, we will implement the message-driven microservices.


    # Implementing reactive microservices


    Reactive microservices perform operations in response to events. We will make
    changes in our code to produce and consume events for our sample implementation.
    Although we will create a single event, a microservice can have multiple producers
    or consumer events. Also, a microservice can have both producer and consumer events.
    We''ll make use of existing functionality in the Booking microservice that creates
    the new booking `POST /v1/booking`. This will be our event and make use of Apache
    Kafka for sending this event. Other microservices can consume this event by listening
    to the event. On successful booking, the Booking microservice will produce the
    Kafka topic (event) `amp.bookingOrdered`. We''ll create a new microservice Billing
    (in the same way in which we created the other microservices like Booking) for
    consuming this event `amp.bookingOrdered`.


    # Producing an event


    An object would be sent to Kafka when an event is produced. Similarly, Kafka would
    send this object to all listeners (microservices). In short, the produced object
    travels over the network. Therefore, we will need serialization support for these
    objects. We''ll make use of Apache Avro for data serialization. It defines the
    data structure (schema) in the JSON format and also provides a plugin for both
    Maven and Gradle to generate Java classes using JSON schema. Avro works well with
    Kafka because both Avro and Kafka are Apache products and align with each other
    for integration.


    Let''s start with defining the schema that represents the object sent over the
    network when a new booking is created. As shared earlier for producing the event,
    we''ll make use of the existing Booking microservice. We''ll create the Avro schema
    file `bookingOrder.avro` in `src/main/resources/avro` directory in Booking microservice.'
