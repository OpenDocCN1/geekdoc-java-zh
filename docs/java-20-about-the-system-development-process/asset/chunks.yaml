    # Poul Klausen


    # Java 20: About the system development process


    ## Software Development


    Java 20: About the system development process: Software Development


    1st edition


    © 2018 Poul Klausen & bookboon.com


    ISBN 978-87-403-2669-7


    Peer review by Ove Thomsen, EA Dania


    # Foreword


    It is the last book in this series of books on software development in Java. The
    book deals with system development focusing on the process and primarily in relation
    to major system development projects. In addition, the book gives an introduction
    to three concrete system development methods: `Unified Process`, `SCRUM` and `Extreme
    Programming`. In addition, a number of other activities and techniques are described
    that are part of modern system development, regardless of whether one uses a method.
    After you have read these 20 books on system development in Java and solved all
    the exercises and tasks, you may not be able to call you a professional Java developer.
    This can only lead to by experience, but you have a good foundation and you are
    well-dressed to join a professional team of software developers. You never graduate
    as a software developer, and there are always new versions of products and methods
    that you have to learn, but I hope these books can provide a good basis. Everything
    is not included either because there was no room or because it was forgotten and
    something else might even be deprecated, but maybe a future release may remedy
    some of it, but if it happens, I will end up at the same place, where something
    did not come along and something else is deprecated. Software development does
    never stop.


    As the title says this series of books deals with software development, and the
    goal is to teach the reader how to develop applications in Java. It can be learned
    by reading about the subject and by studying complete sample programs, but most
    importantly by yourself to do it and write your own programs from scratch. Therefore,
    an important part of the books is exercises and problems, where the reader has
    to write programs that correspond to the substance being treated in the books.
    All books in the series is built around the same skeleton and will consist of
    text and examples and exercises and problems that are placed in the text where
    they naturally belongs. The difference between exercises and problems is that
    the exercises largely deals with repetitions of the substance that is presented
    in the text, and furthermore it is relatively accurately described what to do.
    Problems are in turn more loosely described, and are typically a little bigger
    and there is rarely any clear best solution. These are books to be read from start
    to finish, but the many code examples, including exercises and problems plays
    a central role, and it is important that the reader predict in detail studying
    the code to the many examples and also solves the exercises and problems or possibly
    just studying the recommended solutions.


    All books ends with one or two larger sample programs, which focus primarily is
    on process and an explanation of how the program is written. On the other hand
    appears the code only to a limited extent – if at all – and the reader should
    instead study the finished program code perhaps while testing the program. In
    addition to show the development of programs that are larger than the examples,
    which otherwise is presented, the aim of the concluding examples also is to show
    program examples from varying fields of application.


    Most books also ends with an appendix dealing with a subject that would not be
    treated in the books. It may be issues on the installation of software or other
    topics in computer technology, which are not about software development, but where
    it is necessary to have an introductory knowledge. If the reader already is familiar
    with the subject, the current appendix can be skipped.


    The programming language is, as mentioned Java, and besides the books use the
    following products:


    1. `NetBeans` as IDE for application development

    2. `MySQL` to the extent there is a need for a database server (from the book
    `Java 6` onwards)

    3. `GlassFish` as a web server and application server (from the book `Java 11`
    onwards)

    4. `Android Studio`, that is a tool to development of apps to mobil phones


    It is products that are free of charge and free to install, and there is even
    talk about products, where the installation is progressing all by itself and without
    major efforts and challenges. In addition, there are on the web detailed installation
    instructions for all the three products. The products are available on Windows
    and Linux, and it therefore plays no special role if you use Linux or Windows.


    All sample programs are developed and tested on machines running Linux. In fact,
    it plays no major role, as both Java and other products work in exactly the same
    way whether the platform is one or the other. Some places will be in the books
    where you could see that the platform is Linux, and this applies primarily commands
    that concerning the file system. Otherwise it has no meaning to the reader that
    the programs are developed on a Linux machine, and they can immediately also run
    under Windows unless a program refers to the file system where it may be necessary
    to change the name of a file.


    Finally a little about what the books are not. It is not “how to write” or for
    that matter reference manuals in Java, but it is as the title says books on software
    development. It is my hope that the reader when reading the books and through
    the many examples can find inspiration for how to write good programs, but also
    can be used as a source collection with a number of examples of solutions to concrete
    everyday programming problems that you regularly face as a software developer.


    # 1 Introduction


    All the previous books in this series have been about system development and how
    to write programs using the Java programming language, and if I look backwards
    it’s probably the last that fills most, and it’s actually not fair if you’re are
    going to be a good software developer, you should strive to free yourself from
    the tools and instead focus on the methods and principles common to all system
    development tasks. However, it is not so easy, because in the end, one must necessarily
    become concrete and learn how to work with the technologies and tools needed to
    implement solutions practices. In fact, it is a bit of a dilemma in software development,
    where you have always been emphasized the importance of learning good system development
    methods and focusing on analysis, design and patterns, and where the technology
    and programming in some language was secondary. As mentioned above, the intentions
    of this series of books were to write about software development, but with the
    emphasis on the process, and perhaps the final examples should have been more
    important than the case is. Much of the foregoing has focused on Java and details,
    but maybe it does not matter, because that’s what it’s all about.

    '
