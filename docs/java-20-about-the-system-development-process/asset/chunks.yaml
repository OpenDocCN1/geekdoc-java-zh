- fmt: "\nAs a last comment on system development, I want to mention log files, which\
    \ are typically text files, where a program intermittently stores data relating\
    \ to the application’s use. Now it does not have to be text files, but it can\
    \ also be a database table, and if necessary, make sure that the program has database\
    \ access. If you are using text files, make sure that the log file is created\
    \ in a directory with a write access, and often you want to use the user’s home\
    \ directory, but it is of course not an option if the log is to be used by multiple\
    \ users. If a program uses log files, it can of course be a little dangerous to\
    \ let a program write unrestricted and unchecked to a file or database table,\
    \ and therefore log files should usually be combined with an option to disable/enable\
    \ this functionality.\n\nThere may be several reasons for using log files, and\
    \ one is to collect statistic data relating to the application’s use, perhaps\
    \ in order to improve the program later. Another and perhaps even more important\
    \ application is logging of an error message. Once a program has been put into\
    \ operation and errors occurs, they are reported to developers who then have the\
    \ correct error. In order for this to be possible, you need some information,\
    \ and here I would like to say that an error handling, where the program just\
    \ crass and the screen is filled with errors regarding exceptions, simply can\
    \ not be used. Firstly, users will not accept such malware, and it creates frustration\
    \ and unwillingness towards the development organization, and secondly, it is\
    \ far from the assumption that users are reported to such errors, and at best,\
    \ you will be notified that the program is not working. As a developer, you know\
    \ critical places where a program can go down and here you can encapsulate the\
    \ code that can fail in a `try/catch` block and in case of an exception write\
    \ a message in a log file. As a developer, in case of an error, you can ask to\
    \ get the log file, and here you can see when and where in the program there have\
    \ been errors.\n\nSuch error logging can be a very big help in troubleshooting,\
    \ just be careful about where in the code you write in the log file. In principle,\
    \ the error log must be empty and therefore it may be a nice check of the program\
    \ to periodically inspect the log file.\n\nIt is important to note that error\
    \ logging is by no means an alternative to testing and it is only something that\
    \ can be used when the program is finished and tested and ready to deliver to\
    \ the customer, but conversely, has the program first been put into operation,\
    \ it can also be an extremely important source of reporting errors.\n\n# 6 Poker\n\
    \nI want to close this book and thus also this series of books about software\
    \ development in Java with another example of a program. The goal is similar to\
    \ the final examples in the other books to show the development process, but the\
    \ task/project does not directly follow any of the previous system development\
    \ methods, but uses elements from several of them and what is otherwise mentioned\
    \ in these books. The reason is partly the size of the program, where it is still\
    \ a small program in size, and partly that the program is written by a single\
    \ person. For these reasons, it does not make sense to use, for example, `SCRUM`\
