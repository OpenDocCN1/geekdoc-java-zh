    最大的任务是 `TexasPlayer` 类中游戏算法的更改。那些涉及由哪个玩家开始一轮下注的初始算法不适用于这种扑克变体，因此它们都是一些微不足道的算法。其他决定玩家注额的算法在恰恰实现上立即变得更加困难，因为此时玩家只能看到少数几张牌。在第一轮下注回合中，玩家只能看到自己的两张底牌，因此规则必须非常简单、数量较多，并且在很大程度上看起来是随机的。在另外三轮回合中，玩家分别能看到
    5、6 或 7 张牌，其中 3、4 或 5 张牌是与其他玩家共享的。在目前的实现中，算法仅考虑了当前玩家拥有的牌，但通过同样考虑其他玩家可以从桌上的明牌牌中获得哪些牌，可以改进算法。


    ## 6.10 迭代 7


    `Omaha` 变体基本上与 `Texas Hold’em` 相似。实现包含了以下类：


    1. `OmahaPlayer`，作为 `TexasPlayer` 的副本

    2. `OmahaView`，作为 `TexasView` 的副本

    3. `OmahaPlayer`，作为 `TexasPresenter` 的副本


    接下来，对应其他变体修改了以下类：


    1. `Game`

    2. `MainPresenter`

    3. `OmahaPresenter`，其中由 showdown 调用的 `showResult()` 参数必须更改为 9，然后重新运行程序，但显然程序仍在玩
    `Texas Hold’em`。然而，在用户界面方面，存在一个小问题，因为 `ResultView` 中的牌占据了太多空间。然而，最大的任务是更改 `OmahaPlayer`
    类中的游戏规则。关于由谁开始下注回合没有更改，因为我将应用与 `Texas Hold’em` 相同的规则，即由庄家之后的玩家开始下注。尽管这与真实的扑克世界相比有点过于简化，但我保留了这个简单的规则，因为它对当前程序没有产生影响。


    关于决定玩家在下注回合中必须注多少的算法，我使用了与 `Texas Hold’em` 相同的规则，但这次对可以使用哪些牌进行了扩展。


    在第一轮下注回合中，必须从玩家的四张底牌中选择两张，提供 6 种选择。对于这 6 种选择中的每一种，我都会选择能导致最好牌的两张牌，并在这两张牌上使用与 `Texas
    Hold’em` 相同的算法。在第二轮下注回合中，必须从玩家的底牌中选择两张，这又提供了 6 种选择，这两张牌与桌面上的三张明牌结合，我选择产生最高牌的组合。对于这种组合，我使用了与
    `Texas Hold’em` 相同的算法。第三轮下注回合也是一样。从 4 张底牌中选 2 张（6 种方式），然后从 4 张明牌中选 3 张（4 种方式），产生
    24 种组合。在这里选择最佳组合，并对此组合应用与 `Texas Hold’em` 相同的算法。最后是第四轮下注回合，需要从 5 张明牌中选择 3 张，这有
    10 种方法。在这种情况下，有 60 种组合，同样选择值最高的牌型。


    在 showdown 时，没有弃牌的玩家应该展示他们所选择的获胜的牌。对于每个玩家，只需展示 9 张牌中的 5 张（即玩家能组成的最好牌）即可，因此有点像
    `Texas Hold’em` 变体，但这次我将在对话框中显示结果：


    ![](img/Image3557.jpg)


    也许 `Texas Hold’em` 变体也应该更改为使用相同的对话框显示结果。


    ## 6.11 迭代 8


    最后一个变体是 `5 Card Draw`，它也是最简单的变体，因为只有两轮下注，而且由于游戏规则非常简单，玩家始终只能看到自己的 5 张牌。关于注额，我想使用与
    `Texas Hold’em` 相同的算法，但对于高额注额的概率略高。此外，第一个算法必须进行扩展，以便玩家可以决定换哪些牌。它基于一个非常简单的算法：


    1. 如果玩家有同花顺，则不换任何牌

    2. 如果玩家有四条，则不换任何牌

    3. 如果玩家有葫芦，则不换任何牌

    4. 如果玩家有同花，则不换任何牌

    5. 如果玩家有顺子，则不换任何牌

    6. 如果玩家有三条，则换两张牌

    7. 如果玩家有两对，则换一张牌

    8. 如果玩家有一对，则换三张牌

    9. 如果玩家有高牌，则换掉所有比 Jack 小的牌


    这些规则非常简单，甚至简单得过头，因为用户相对容易推断出虚拟玩家可能持有哪些牌。因此，最后 4 条规则被更改了，以便玩家可以更少数量的牌。


    最后，物理玩家必须能够换牌，因此能够选择要换的牌。这在用户点击他想要交换的牌时发生：


    ![](img/Image3565.jpg)


    为了让用户能够点击牌，`CardView` 类已更改，如下：


    ![](img/Image3566.jpg)


    `clicked` 变量用于表示牌是否被点击，而 `clickOn` 变量用于表示支持此功能。只有 `5 Card Draw` 变体支持此功能，且仅在第一轮下注回合支持。此外，模型类
    `Hand` 扩展了：


    ![](img/Image3567.jpg)


    以便用户指定要换的牌。在 `DrawPlayer` 类中，由玩家在第一轮下注时调用的 `round1()` 方法进行了扩展，以便它初始化玩家想要交换的牌数组，最后
    `DrawPresenter` 类扩展了 `deal()`。


    ## 6.12 迭代 9


    这是最后一个迭代。在规划方面，迭代发生了变化，但包含了：


    1. 程序的选项

    2. 用户界面

    3. 代码审查和重构

    4. 一个安装脚本


    这是一项相当大的工作，我想先对以下类型进行代码审查：


    * 程序使用了 5 个枚举：`CardColor`、`CardValue`、`PokerValue`、`PokerGames` 和 `PokerBets`。

    * `Card` 和 `Cards` 类，是简单的类，但是可以在其他应用程序使用的类。

    * `Game` 类，没有更改。在审查该类时，我也看到了 `GameView` 和 `GamePresenter`，它们也没有更改。


    ### 程序的选项


    到目前为止有两个选项：


    1. 用于记录各个游戏回合的应用程序日志文件的目录。

    2. 该功能的禁用或启用状态。


    已决定扩展两个新选项。玩家可以在同一下注回合中加注两次，在最后一轮下注回合中加注三次。已决定这应该是一个选项，以便第一轮下注回合的玩家可以加注 1、2、3、4
    或 5 次，而最后一轮下注回合的玩家可以再加注一次。最后，决定程序应该有一个错误日志的选项，并且该功能的启用或禁用也必须是一个选项。


    同样，`Option` 类扩展了两个新属性：


    ![](img/Image3568.jpg)

