  raw: 'Now SCRUM is not always the right method, and for SCRUM to makes sense, the
    project must be of a reasonable size and be a project that should solved by a
    team of developers. In addition, it usually has to be a project characterized
    by many uncertainties and complexity, and where there is a need for agile methods,
    but can a project to some extent be characterized in that way, SCRUM has proven
    itself as an effective project management method.


    #### The elements in SCRUM


    Basically, the principles of SCRUM are to divide a project into a series of small
    iterations, which are called *sprints*. The starting point is that it has already
    been decided to develop a system (and in this book an application), and the task
    manager or customer already has a relatively accurate meaning of what it is for
    a system to be developed. The project starts with the development of two documents:


    1.  *Vision Statement*, which gives a brief description of the goals of the project,
    which in the course of the project process will help the project team to focus
    on what is important seen from the task manager.


    2.  *Product Map,* which is an introductory schedule for when important sub-products
    are delivered.


    The project process is divided into two phases, called respectively


    1.  Pre-sprints


    2.  Timeboxed activities


    where you can think of the first one as planning and the other as production,
    but how far the largest part of time is used in the final phase. In fact, phases
    are not the right word, as it is not so that you are either in one phase or another,
    but it all starts with *pre-sprints*, after which you perform a series of sprints
    and eventually (and often) return to the pre-sprints phase. You usually outline
    the SCRUM with a figure similar to the following:


    ![](image/Image1806.jpg)


    During pre-sprint, one focuses on injecting the user requirements and describing
    them as tasks to be solved. These descriptions are called stories. The result
    will typically be a large collection of stories, called *Product Backlog*. Typically,
    you do not complete Product Backlog before starting the individual sprints, and
    as soon as you find that enough information has been gathered that some stories
    are well described, you can start the first sprints. The goal is to get something
    done that end users can relate to and evaluate, and then to return to the pre-sprint
    phase and possibly update Product Backlog.


    Looking at the sprints phase, it includes a sprint planing for every sprint, a
    meeting where you plan what stories from Product Backlog to be transferred to
    *Sprint Backlog*, and thus what stories to work on in it a following sprint. A
    sprint is scheduled to take a certain period of time, which may vary, but typically
    takes a sprint of about 4 weeks, and it is recommended that a sprint should not
    take longer than one month. The team breaks down the selected stories for tasks
    that are then delegated among the team’s members. During a sprint, daily meetings,
    called *Daily Scrum*, are held, where each team member reports briefly the progress
    (or the opposite) in connection with the current tasks. These Daily Scrums are
    short meetings, and may take up to 15 minutes. At the end of a sprint, a meeting
    called *Sprint Demo* (or *Sprint Review*) is held. This meeting is held together
    with the task manager, where the team demonstrates the result of the current sprint
    and thus how the individual stories are resolved. The entire sprint finishes with
    a *Scrum Retrospective*, that is a meeting that is a review of the sprint, where
    the team looks back on the course for improvements.


    In connection with a SCRUM project, there are three roles (and there may be no
    other roles), and these roles are completed by the scrum team:


    1.  *Product Owner*, which is one person who is part of the project on full-time
    or on part-time, and which represents the business area within the project is
    anchored.


    2.  *Scrum Master*, who is one person who is full-time or on part-time on the
    project and who is a coach and facilitator for the development team.


    3.  *The Development Team*, which is 3–9 full-time employees (also called specialists)
    and is part of the development organization as those who perform the individual
    sprints.


    In addition to this, there may be other stakeholders, who typically represent
    the customer or his organization.


    It is assumed that the team meets two basic assumptions that are considered necessary
    to ensure flexibility, creativity and productivity and are considered necessary
    for the agile environment:


    1.  The team is self-organizing and plans its work without explicit leadership
    from the outside. One or more people in the team can be in charge of management
    while other participants are solely responsible for special specialist activities,
    but in SCRUM there is no division of management and specialist functions.


    2.  The team participants have all the necessary expertise and competencies needed
    to get the task solved and without the need to get help from outside.


    #### The Product Owner


    Any project needs a person familiar with the business area whose task is to maximize
