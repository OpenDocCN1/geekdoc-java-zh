    # Overview

    Compared to the prototype from iteration 1, there are no significant changes to
    the overall design, and the development follows the classic MVP design pattern
    for JavaFX applications. With regard to the model layer, it is primarily expanded
    with three new classes. A class `Model` has been added.


    ![](image/Java_20_801.jpg)


    The variable `pot` represents the pot on the table and where players deposit amounts
    (chips) in each betting round. It is defined as a JavaFX property, so the user
    interface can bind to it. The next variable `game` represents the program’s settings
    as an object of the type `Game`. Initially, there are only 4 properties, but the
    class may need to be extended at a later time. The variable `value` is the current
    value of a round that is updated each time a player bet `BET` or `RAISE`. The
    variable thus indicates what it costs to continue in a specific round. Finally,
    there is the variable `hands`, which is a list of current players and represents
    their cards.


    The class’s methods are generally simple and consist primarily of `get` and `set`
    methods. In addition, there are methods for maintaining the variables `pot` and
    `value`:


    ![](image/Java_20_81.jpg)


    The methods are quite simple, but important as these are the methods that the
    players call in connection with the individual betting rounds. You should especially
    note the method `call()`, which has a parameter. If a player raises and another
    player has already placed an amount in the pot, it is necessary to subtract this
    amount, before the pot is updated and that is the goal of this parameter. The
    above methods thus determines what it costs to play in the individual betting
    rounds. Similar to the decisions in iteration 1, it is somewhat simplified in
    relation to “real” poker games, and another purpose of the methods is also that
    these rules need to be changed by overriding the methods in a derivative class.
    It is also the reason why the two variables `pot` and `value` are defined protected.


    ## New Classes

    There are also added two classes:


    ![](image/Image3518.jpg)


    where the class `Card5Player` represents a virtual player who plays `5 Card Stud`.
    The base class is created because there will be a corresponding class for each
    of the 4 other poker variants. I will explain both classes below.


    ## Hand Class

    Compared to the prototype, the class `Hand` is extended significantly:


    ![](image/Java_20_83.jpg)


    The first variable `bigCard` determines what the virtual players should perceive
    as a big card (JACK, QUEEN, KING and ACE), and the value is used in conjunction
    with the betting rounds. The value may need to be changed later into an option
    regarding the program’s settings. The next variable `cards` is a list of a player’s
    cards and the variable `state` is used to keep track of whether a card is open
    (facing up) or closed (facing down). The variable `folded` indicates whether the
    player has folded and thus dropped out of the round. The variable `place` indicates
    the player’s position at the table, where position 0 is always perceived as the
    physical player, while the variable `raise` indicates how many times a player
    has bet `RAISE` or `BIGRAISE` in a betting round. The value is used to set a limit
    for how many times a player must `RAISE` in the same betting round. Finally, there
    is the variable `value`, which indicates how many chips the player has already
    deposited in the pot in the current betting round. The value is used in conjunction
    with `CALL` if another player bet `RAISE`. Finally, there is the variable `jetons`,
    which indicates the player’s amount of chips, and it is defined as a JavaFX property,
    so that for each player it can bind to the user interface.


    Regarding a limit on how many times a player can bet `RAISE` in a betting round,
    it is not in agreement with a real poker game, but it is included here as otherwise
    it is difficult to get the virtual players to act properly. So far, this limit
    is 2 for the first three betting rounds and 3 for the last betting round, but
    the limit may need to be changed to an option.


    The class has many methods and implements all the algorithms regarding the value
    of a hand, including the methods that the virtual players must use to determine
    their bets during a betting round. There are many methods, and many of them are
    defined as both instance methods and static methods.


    For the implementation of the methods in the classes `AbstractPlayer` and `Card5Player`
    (and also `Card5Presenter`), it is crucial that the methods in the classes `Card`,
    `Cards` and `Hand` work correctly, and especially the comparison of objects, as
    the objects in some contexts are compared in ascending order while in other contexts
    are compared in descending order. Therefore, unit test classes are written for
    each of the three classes. After these classes have been tested, I can return
    to the classes `AbstractPlayer` and `Card5Player`.


    ## AbstractPlayer Class

    The base class is so far a simple class:


    ![](image/Java_20_84.jpg)


    The first constant is the limit of how many times a player must `RAISE`, and the
    next variable is the program’s model. When the program has to deal out cards,
    a smaller delay is inserted between each card (so the user can follow the cards
    being dealt out). The same goes for the bets, where there is a delay between each
    player’s bet – again in order for users to keep track of how the virtual players
    act (simulates they think). It requires that the algorithms for dealing of cards
    and the betting rounds are performed in their own threads, which complicates the
    code a bit to ensure proper user interface update, where the user interface needs
    to be updated with `Platform.runLater()`. The last two variables in the class
    `AbstractPlayer` are used in that context.


    Otherwise, the class consists primarily of auxiliary methods. The class defines
    9 abstract methods:


    ![](image/Java_20_841.jpg)


    where the first 4 are the methods for the 4 betting rounds. The first parameters
    are the player’s card and the next parameter `others` is the other players’ open
    cards. The third parameter indicates whether it is the first betting round, while
    the last parameter indicates the current player. The last 5 methods are used to
    determine who will start a betting round, which is determined by the players’
    open cards.


    The class `AbstractPlayer` will probably change during the course of development,
    where there will surely be more and other abstract methods.


    The class `Card5Player` is an extensive class and consists exclusively of implementing
    the 9 abstract methods from the base class. Here are especially the first 4 comprehensive
    corresponding to the algorithms from iteration 2.


    ## User Interface Layer

    In addition to the model classes, there are the classes in the user interface,
    and here the changes primarily concerns the class `Card5Presenter`. It is also
    expanded considerably and is until this time the program’s most complex class
    equivalent to the fact that this class contains the entire game logic.


    In the same way as in the prototype, the class is derived from


    ![](image/Java_20_86.jpg)


    which now has a reference to an object of the type `AbstractPlayer`. Also note
    the first variable, which is a reference to the program’s `MainPresenter`, and
    the purpose is that the class `Card5Presenter` should be able to refer to the
    window’s buttons. Which buttons are available depends on who the player is (a
    virtual player or a physical player). In relation to the prototype, the class
    is expanded with 7 abstract methods:


    ![](image/Java_20_861.jpg)


    with one method for each of the 7 possible bets in a betting round.

    '
