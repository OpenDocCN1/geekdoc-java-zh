    If two or more players have two pairs, it is the largest pair that determines
    the rank. If the largest pair has the same value, the rank is determined as the
    largest of the smallest pair, and if this pair has the same value, the rank is
    determined of the last card. If also the last cards have the same value, the rank
    is determined as the color of the last card.


    ### One pair


    Two cards with the same value, where the last three cards all have a different
    value and do not have the same value as the two cards that make up the pair, for
    example:


    - `spade ace, clubs ace, hearts 4, hearts 7 and diamonds jack`


    Have two or more players a pair the biggest pair determines the rank. Do they
    have two pairs of the same value, the rank is determined as the highest card of
    the first of the three remaining cards that are different and have all three remaining
    cards the same value determines the color of the highest of these cards determines
    the rank.


    ### High card


    None of the above hands occurs, for example:


    - `clubs 5, diamods 6, hearts 9, spades 10 and spades ace`


    If more players have high card, determines the highest value of the first card
    that is different the rank and have all 5 cards the same value determines the
    color of the highest card the rank.


    ### A round


    A single game is called a round, and for each round the players are switched as
    dealer. The game is played by players continuously building their hand as the
    cards are dealt. How it happens and how the hand is formed depends on the current
    variant (`Texas Hold’em`, `Omaha` and so on). For each variant there are a number
    of betting rounds where players either deposit money into a pool (a pot) or leave
    the round (and the money they have already deposited are thus lost). You can win
    a round in poker in two ways:


    1. By having the best hand at `showdown` (when all betting rounds are completed
    and the round is over).

    2. By being the last remaining player in the current round.


    For a round, as mentioned above, there are more betting rounds where each remaining
    player bets, thus either depositing an amount in the pot or leaving the current
    round (dropping out). You have the following options (slightly dependent of the
    current variant):


    1. `FOLD`, the player gives up and is no longer a player in the current round.

    2. `CHECK`, the player wishes to continue the round, but without making a deposit
    (only possible if in the current betting round there is not already a player who
    has deposit money in the pot).

    3. `BET`, the player deposits an amount in the pot (only possible if there is
    not already a player who has deposited an amount) or there is another player who
    has `CHECK`.

    4. `CALL`, you deposit the same amount as the last `BET` or `RAISE` and is thus
    the least amount that allows you to continue playing.

    5. `RAISE` if there is already a `BET`, a player can increase the deposit amount
    and all remaining players who are still there must choose either `CALL`, `RAISE`
    or `FOLD`.


    In connection with `BET` and `RAISE`, there will usually be an upper limit for
    the amount of money you have to deposit.


    With regard to the different variants, the current program should support 5 variants:


    - `Texas Hold’em`

    - `Omaha`

    - `7 Card Stud`

    - `5 Card Draw`

    - `5 Card Stud`


    Here is there probably not no game as the last version, and at least it’s not
    a game found on the usual poker game pages, but it’s a very simple poker game
    and that’s how I’ve learned to play poker. The game is similar to `7 Card Stud`,
    and hence the above name.


    ### Chips


    In this program, the smallest amount is a chip (or jeton), which in principle
    is just a unit. When a new game is started, each player gets a number of chips,
    and one player is released from the game when the player does not have more chips.
    If the player is the user, the game is over.


    At the start of a game, it is determined how much as a number of chips (default
    is 1), it will cost each player to detach in a round. This value is in this program
    called a `blind`.


    A `blind` is then the minimum value a player has to deposit in the pot at a `BET`.


    In this program, the following rules must be applied regarding how much players
    must deposit in the pot and thus the limits of the game:


    1. At the start of a new round, all players deposit a `blind`.

    2. A round has a value at any time, and is the last deposit in the pot at any
    time. That is, at the start of the first betting round the size of the value is
    equal to a `blind`.

    3. At `BET` you can deposit the value or 2 times the value, which is then the
    round’s value.

    4. At `RAISE` you can raise to 2 times the value or 4 times the value, which is
    then the round’s value.


    In addition, in a single betting round, there should be a limitation on how many
    times a player must perform a `RAISE` (for example 2 or 3).


    If a player does not have more chips, the player must leave the game.


    It has been decided (primarily for the user interface) that there can be 2–6 players
    regardless of the variant of the variant.


    ### Texas Hold’em


    In this game, each player has two closed cards (which only the player can see).
    In addition, 5 open cards are placed on the table. Each player then forms the
    best hand with his own two closed cards. The game has 4 betting rounds, and the
    game progresses as follows:


    1. At the start of a game, all players deposit a `blind`. The dealer changes clockwise
    after each round.

    2. Then players get two closed cards. Now three cards all with face are placed
    at the table – the so-called `flop`. It is common cards and can be used by all
    players. Then the first betting round begins at the player after the dealer, who
    is still in the game.

    3. Another open common card is placed on the table. This is called the `turn`.
    Then another betting round follows.

    4. The fifth and last common card – the `river` card – is placed on the table,
    after which the game’s last betting round is performed, exactly as the.

    5. If there are two or more players who have not thrown their cards after the
    last betting round, the winner will be settled at a `showdown`. Each player builds
    the best five-card hand out of his own two personal cards and the five common
    cards on the table. The player with the best poker hand wins the pot. If there
    is only one player left, this player has won the pot.


    ### Omaha


    This variant is basically played as `Texas Hold’em`. In `Omaha`, however, you
    get four cards on the hand (4 closed cards) and when you combine your personal
    cards with the common cards, you need to use exactly two cards from the hand and
    three from the table.


    ### 7 Card Stud


    In this variant there are 5 betting rounds. The variation differs from `Texas
    Hold’em` and `Omaha` in that each player is assigned his own open personal cards
    – that is cards, which may only be used by one player. There is thus no common
    cards. In `7 Card Stud`, each player receives from the start two closed cards
    and one open card, followed by three more open cards one at a time with a betting
    round between each and finally another closed card. Thus, each player ends finally
    at the end of the round with seven cards – three closed and four open.

