- fmt: '

    It is not a fact that you in an individual iteration follow a waterfall model,
    but more typically you will work iteratively, where you work with analysis, design,
    programming and then return to some analysis tasks.


    The result of an iteration is:


    * The project is in a stable state, which can be presented to the task manager
    or customer. It will usually be a software product that the task testers can test
    and comment on.

    * An updated version of the task formulation with regard to decisions taken in
    connection with the implementation of this iteration, as well as an extension
    of a section with important results for the current iteration.

    * An updated version of requirement specification based on the analysis performed
    during the iteration.

    * A conclusion that includes the customer’s remarks after testing the product
    and the developers’ recommendations regarding the continued system development.

    * Adjustment of project plan, including planning of next or the few next iterations.


    Looking at the above, it may seem that you work without having a schedule and
    decides what should happen as you move forward in the project. Such, of course,
    you can not develop IT systems, because the task manager or customer must know
    when the system is expected to be delivered and what it will cost, but vice versa,
    it should be noted that when unified process continuously adjusts the requirements
    and continuously plans iterations, it is exactly, what’s means that it’s an agile
    method. This does not mean that you are working without planning, but it is a
    recognition that for large and complex systems it is impossible to describe a
    completed requirement specification and estimate how long the development will
    take and what it will cost, and the question is, what you then can do it. The
    idea of unified process is that you continuously work through the requirements
    specification and the project plan so that after the completion of elaboration,
    the requirements specification is complete and including the final price for what
    the solutions cost and when it can be delivered and applied. Until then, it must
    all be based on estimates that are continually underpinned and adjusted, and that
    is exactly the dilemma of system development. However, in the unified process,
    the goal is that after elaboration the requirements must be in place, as well
    as the completed project plan and project requirements for resources.


    As an addition to the above, I would like to mention that when it is so difficult
    to estimate a system development project, it is not only because developers are
    bad planners, but equally because the task manager and customers of large and
    complex IT solutions can not formulate the task. It requires a process of continuously
    identifying the requirements and deciding what to do, and what should be delineated,
    and remember that delineation may also be postponed to later. This is exactly
    the process that elaboration deals with.


    The central concept in unified process is an iteration, which typically has a
    time span of about one month. As mentioned, an iteration must bring the system
    from one stable state to another and it is important that the result of an iteration
    is, that the task manager experiences a progression through a presentation of
    the result. The planning of the individual iterations starts during the inception
    phase and continues throughout the elaboration phase, with continuous being expanded
    with new iterations. For each iteration one must:


    1. plan what the iteration should include

    2. and when the iteration must be completed


    With regard to the first, the iteration must include a well-defined work of the
    entire project process, and the iteration should typically end in a month and
    should rarely last much longer. More people may work on the same iteration, but
    there will be few. Another question is what should happen if the iteration is
    not completed on time. Here it is an imperative requirement in unified process
    that the iteration is to be terminated on time, and what may be missing has to
    be postponed to a later iteration.


    ### Construction


    It is the longest phase in time. It consists in the same way as elaboration of
    a number of iterations, where each iteration brings the project from one stable
    state to another. There is no sharp boundary between elaboration and construction,
    but the difference is that at the start of construction, the remaining iterations
    will be planned and under the construction phase, the individual iterations will
    only contain to a limited extent analysis and, and to a lesser degree, design.
    One can think of it that when you get to the construction phase, all requirements
    are formulated and in place (the requirement specification is complete) and all
    important decisions and risk assessments are clarified. Therefore, programming
    and testing are primarily what lacking.


    The construction phase is usually extensive in time as many tasks can be deferred
    to construction. It is also typical that each iterations under construction to
    a greater extent than during the elaboration can be carried out in parallel, where
    several developers works on each their iteration.


    The result of an iteration is in principle the same as during the elaboration
    phase, but with the difference that there will typically not be updates of the
    task formulation and the requirement specification and in worst case only minor
    adjustments, and in addition to the product, the result is just a short and accurate
    summary of the current iteration and including the results of the iteration’s
    test.


    One can also think of construction as a phase, where the project has now moved
    into a stable and planned course, through which the project moves forward towards
    the finished product through a carefully planned course. At that point, the risk
    is gone and there is only “hard” work left.


    ### Transition


    The last phase is also an iterative phase, but typically there are few iterations
    and often only one. It is the delivery phase and the tasks can vary a lot, but
    are the same as I previously described in the book `Java 7`. The planning of the
    phase’s iterations takes place during elaboration.


    ## 2.4 SCRUM


    Everything that is said in these books about system development relates solely
    to the developers’ specific tasks, including how the developers can go forward
    to write and test the individual programs. Of course, it is also important, in
    one way or another it is, what it is all about, but for large projects where a
    team of developers collaborates to develop the current system, it is necessary
    with project management, and one of the reasons why IT projects sometimes goes
    wrong is actually lack of management. Over time, several project management methods
    have been developed, and one of those who has been very successful is called `SCRUM`.
    In fact, the method is not directly aimed at system development of software, but
    the method has proved particularly suitable for managing IT development projects.
    The following is a brief presentation of `SCRUM`.


    One of the principles behind `SCRUM` is the recognition that, due to a number
    of uncertainties, it is not possible in advance to define all requirements for
    a system, thus completely the same as what I have mentioned above during the unified
    process. It is therefore necessary to have a project management method that is
    flexible enough to handle the development of a system that is characterized by
    continued change of requirements throughout the development process while ensuring
    progress in the project. Such system development processes are called agile, and
    `SCRUM` is a project management method for agile projects, and is the most widely
    used project management method in practice.

