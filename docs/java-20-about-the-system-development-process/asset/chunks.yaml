    result. If the result of a sprint is a potentially releasable part of the finished
    product (what to aim for is the result of each sprint), it is said that an *increment*
    has been reached, and an increment is thus the sum of all the elements in *Product
    Backlog*, which has been completed so far in the project. One can therefore consider
    each increment as an update of the previous increment and an extension of the
    product with new functions and features. An increment may not be applied, but
    in case of an increment, it should be possible.


    Typically, an increment (result of Sprint Review) requires changes, and they will
    then be added Product Backlog as new stories.


    Each story in the Product Backlog should usually be developed in a single sprint,
    as it makes it much easier to keep an overview. Product Owner and the Development
    Team selects a number of stories from Product Backlog for each sprint, with the
    goal of getting them completely completed in the upcoming sprint, so after the
    sprint the team has a new increment. It is therefore important that from the start
    you have decided when a story has been completed.


    #### Sprint Planing


    Sprint Planing is a time-boxed meeting, where all team members participate as
    a starting point. If it is a sprint of 4 weeks, the meeting may last 8 hours,
    but at short sprints the meeting will be shorter. Participants in the Development
    Team will estimate how many hours they can deliver in the sprint. Prior to that,
    the Product Owner prioritized the individual elements of the project’s Product
    Backlog and ensured that each story is easy to understand. The Development Team
    then selects an appropriate number of items from the top of Product Backlog and
    moves them to Sprint Backlog as the work to be performed in the current sprint.
    The work for each story is estimated by the Development Team and the total work
    for Sprint Backlog tasks should as best as possible correspond to the capacity
    available to the team.


    Then, a *Sprint Goal* is written, which is nothing else a short text describing
    the target of the current sprint, including what are the criteria for the sprint
    to finishing and what the tasks are solved. Sprint Goal must also contain at least
    a detailed plan for the first days of the sprint. Sprint Goal is part of Sprint
    Backlog, and there are no special requirements for documentation or form, and
    often a board is used, which makes it easy to maintain the plan, and ensure that
    the plan is visible to everyone. Sprint Backlog is thus made up of


    1.  *Sprint Goal*


    2.  The stories selected from Product Backlog for the current sprint.


    3.  A detailed work plan for the sprint, where the tasks (stories) can be categorized
    as *To Do*, *Doing* or *Done*.


    In principle, a sprint can not be interrupted, but Product Owner may, as a sole
    exception, decide to interrupt a sprint typically caused by events/changes in
    the project’s environments/prerequisites.


    #### Daily Scrum


    As its name says, it is a daily meeting held throughout the sprint period. At
    the meeting, only members of the development team participates. The meeting lasts
    no more than 15 minutes, and at this meeting each team participant must answer
    three questions:


    1.  What has been completed since the last meeting?


    2.  What will be done before next meeting?


    3.  What obstacles/difficulties are there?


    Team members must compare the progress with the Sprint Goal, but should also estimate
    the likelihood that a task will be completed before the sprint is complete.


    #### Sprint review


    It is a meeting to be held at the end of a sprint and the meeting will take for
    a sprint of 4 weeks max 4 hours, but for a shorter sprint the meeting will usually
    be shorter. The meeting includes the entire Scrum team but also other stakeholders,
    and at the meeting the solution of all tasks from the current sprint are presented.
    The goal is to get feedback and as early as possible to adjust the requirements
    so Product Owner can update the project’s Product Backlog.


    It is the Development Team that presents the product, but only for tasks that
    are *Done* and not for tasks that are “almost” Done. It is the Product Owner who
    before the meeting must ensure that the products presented also are Done.


    At the end of the whole sprint, another meeting called Sprint Retrospective is
    held, which is a meeting of 2–3 hours. It is a meeting where you look back on
    the sprint for improvements, and it applies to both the working procedures for
    the individual team participants, processes and the tools that you use.


    #### More about SCRUM'
