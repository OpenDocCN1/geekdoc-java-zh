    Then there is the class `Card5Presenter`. The code does not fill much, and the
    challenges are primarily to make the threads run correctly, and especially how
    to test the code. For example, `RAISE` complicates the logic, as `RAISE` has to
    go back and let the front sitting players bet again, and as they also can `RAISE`,
    there are manys situations to take into account. With regard to tests, it is necessary
    to test the program and that is to play the game. Here you can find errors and
    inconveniences, but it can be difficult to track where and how errors occurs.
    Therefore, I have extended the model layer with an additional class, which represents
    a form of log file:


    ![](image/Java_20_862.jpg)![](image/Java_20_87.jpg)![](image/Java_20_88.jpg)


    The class is quite simple to understand. You can then let the program write to
    the log on specific places, which can make it much easier to find out where the
    program is failing.


    Of course, the log file should not be part of the completed program, and the class
    – and all references in the code – must of course be removed before the application
    should be used. I have not done so for now. Partly because I can use the class
    later in the other iterations, and partly because the reader can see how I used
    the log file.


    There is also reasons to warn a little against this technique, where a log file
    as part of the development process has been used for errors. The risk is that
    you not remove all references in the code and then the program suddenly fails
    because you refer to something that no longer exists. In this case, the class
    `LogFile` is a singleton, and if I delete the class, the compiler will find all
    references to the class, and I can thus make sure that everything about the log
    file is removed.


    As another thing of the same kind, the program works in that way, that when you
    select `SHOW` to see who has won, then all cards will appear – even for those
    players who have folded. This should not happen and when all cards are shown,
    it is because some code in the method `deal()` in the class `Card5Presenter` must
    be replaced by something else:


    ![](image/Java_20_89.jpg)


    Again, it’s a question that I have to remember at one point to remove the bottom
    `for` loop and replace it with the code being commented out. The purpose is, of
    course, that in the course of the test I can keep an eye on whether players who
    fold, also make it on a reasonable decision.


    ## 6.7 Iteration 4


    After the end of 3rd iteration, *5 Card Stud* is in principle implemented, at
    least a user can play this poker variant against 4 other virtual players. In this
    iteration, the following features must be implemented:


    Maintenance of user accounts for each user (player) where you have to register:


    *   user name, which must uniquely identify the user

    *   password

    *   balance and thus how much is in the account

    *   transactions, when and how much has been added to/used from the account, but
    not the result of the individual rounds


    A user can not play unless there is money on the account.


    Login where players at the start of the program must identify themselves as a
    player with a user name and a password. As part of the feature, it must be possible
    to create a new account.


    Starting a new game that is a feature that the user can choose at any time. The
    function opens a dialog box where the user must select:


    1.  Poker variant (Card 5 Stud, Card 7 Stud, Texas Hold’em, Omaha, Card Draw)

    2.  Number of players (2–6)

    3.  Blind (1–10, the number of chips to join a new round, default 1)

    4.  Start amount (the number of chips for each player, default 1000)


    The program must be able to save the result for each round, where the program
    for each betting round stores the cards and the bets and thus logs the game. It
    has not been decided what this result should be used for, but it could be used
    for some form of statistics in order to improve the behavior of the virtual players.
    The function must be able to be turned on and off and will probably be disabled
    as default.


    ### Start a new game


    This feature is simple to implement and opens the following dialog box:


    ![](image/Image3526.jpg)


    The dialog opens either from the login window or from a button at the top of the
    application window. The function can be performed at any time, and you can therefore
    interrupt an ongoing round.


    The implementation consists primarily of adding two classes `GameView` and `GamePresenter`
    to the views layer and a few changes in the classes `MainView` and `MainPresenter`.


    ### User accounts


    It has been decided to completely remove this feature from the program as it does
    not really make any sense. The argument for the function was that if you play
    poker for a long time, it might be interesting to follow if you win or lose for
    a long time, but thinking about the game’s idea, it is a facility that will hardly
    be used. Therefore, the program is reduced with regard to this feature, but also
    because it is not really trivial to implement the feature if you have to make
    sure that it also reflects the actual conditions and there are, for example, decisions
    related to the function as to when to updates the account and the program will
    not be interrupted without modifications are written back to the disk.


    It also means that the login function is dropping away, as the whole user concept
    is thus uninteresting and thus the user (the player) will always be the current
    user of the machine.


    Due to this decision, this iteration is significantly reduced.


    ### The log file


    The log file must be a regular text file, and the content depends on the specific
    variant. For example: Each time a new round is started, a line is written for
    each player who are arranged after their position at the table. The colors of
    the cards are D (Diamonds), H (Hearts), S (Spades) and C (Clubs), and the values
    of the cards are 2, 3, 4, 5, 6, 7, 8, 9, 0, J, Q, K, A. Is there 5 players the
    result after the 2nd deal could be:


    ![](image/Java_20_93.jpg)


    For each betting round, one line is written each time a player give a bet, where
    the player’s place at the table is written, the player’s bet, how much the player
    has added to the pot, the game’s new value, the player’s amount, and the content
    of the pot. Note that the number of lines in a single betting round may vary,
    but the result of a single line could be:


    ![](image/Java_20_92.jpg)


    With regard to players bets, the following terms are used:


    *   `B1` = BET

    *   `B2` = BIGBET

    *   `CH` = CHECK

    *   `FO` = FOLD

    *   `R1` = RAISE

    *   `R2` = BIGRAISE

    *   `CA` = CALL


    Finally, a line is written at the end of a round showing the result of the player
    who has won. The line shows the player’s place, the hand’s value, the player’s
    amount after the game is played and the cards. A result could be:


    ![](image/Java_20_92.jpg)


    where the following abbreviations are used for the value of a hand:


    *   `SF` = Straigth Flush

    *   `C4` = Four of a kind

    *   `FH` = Full House

    *   `FL` = Flush

    *   `ST` = Straight

    *   `C3` = Three of a kind

    *   `TP` = Two pairs

    *   `C2` = One pair

    *   `HC` = High Card


    Since the function should be disabled as default, the program is expanded by the
    following dialog box:


    ![](image/Image3533.jpg)


    which maintains the following data structure:


    ![](image/Java_20_931.jpg)![](image/Java_20_94.jpg)![](image/Java_20_95.jpg)

