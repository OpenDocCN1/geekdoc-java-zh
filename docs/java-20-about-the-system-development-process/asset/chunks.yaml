    如上一章提到的，`测试驱动开发`（Test-Driven Development，也简称为 `TDD`）是`极端编程`的要求之一。它的过程非常简单：你从编写一些单元测试开始。然后实现被测试的代码，并对代码进行单元测试，最后进行重构。这个过程不断重复直到完成：


    ![](img/Image1813.jpg)


    TDD 基于单元测试的使用，在本书中使用了 `JUnit`（可以参考 Java 3 相关书籍），但作为一个说明 TDD 理念的简单示例，我将展示一个可以在三个温度单位之间转换的程序的开发：


    1. 摄氏度 (celsius)

    2. 华氏度 (fahrenheit)

    3. 开尔文 (kelvin)


    ![](img/Image1822.jpg)


    下面显示操作步骤。


    我从一个 JavaFX 项目开始，将其命名为 `Degrees`。在这种情况下，程序必须由一个用户界面类（由 NetBeans 创建，名为 `Degrees`）以及一个实现必要转换方法的
    `Converter` 类组成。我想将 `Converter` 类类作程序的模型，在编写该类时，我将从一个测试类开始。


    第一步，在 Projects（项目）下，右键点击项目名称并选择 `New | JUnit Test`（见下文）。在这里我：


    *   将测试类命名为 `ModelsTest`

    *   指定测试类应添加到包 `models` 中（位于 `Test Packages` 之下）

    *   取消勾选 `Generated Code` 下的所有复选框


    后者并不是必要的，但在这种情况下，我没有应用这些初始化方法；不过通常你可以让 NetBeans 创建它们，因为它们默认是空的，因此不会执行任何操作。当你点击
    `Finish`（完成）时，NetBeans 会创建以下测试类：


    ![](img/Image1830.jpg)!!(image/Java_20_34.jpg)


    这仅仅是一个简单的测试方法。在这里我添加了一条语句：


    ![](img/Java_20_35.jpg)


    显然，这会导致翻译错误，因为 `Converter` 类并不存在，但如果你按下 `ALT + Enter`，就会出现以下弹出窗口：


    ![](img/Image1837.jpg)


    如果你选择 `在 package models (Source Packages) 中创建类 “Converter”`，NetBeans 会创建一个包 `models`，并包含一个
    `Converter` 类。该类目前是空的。该类必须有一个方法 `ftoc()`，它可以将华氏度测量的温度转换为摄氏度。如果 `f` 代表华氏度，而 `c`
    代表摄氏度，那么这种关系可以用以下公式表示：


    ![](img/Java_20_351.jpg)


    为了测试 `ftoc()` 方法，我扩展了测试类并添加了静态数组，该数组可以根据选定的华氏度显示对应的摄氏度：


    ![](img/Java_20_352.jpg)


    注意，你可以通过在网上寻找连贯的值或通过自己计算值来创建此表格。有了这个静态数组后，测试方法可以如下完成：


    ![](img/Java_20_36.jpg)


