  trans: "\n\n下方的窗口显示了一个原型，其中已经开始了一场 5 人参与的 `5 Card Stud` 游戏，5 名玩家各获得了前 2 张牌：\n\n\
    ![](img/Image1854.jpg)\n\n底部的玩家是用户。每个玩家下方都有一个 `TextField` 显示玩家的金额（筹码数量），中间的区域是底池（pot）。\n\
    \n在底部，按钮是用户游戏时必须使用的命令。含义如下：\n\n*   当你开始一个新游戏时，只有 `NEW` 启用状态，当用户点击它时，将开始新的一轮游戏。\n\
    *   之后，只有 `DEAL` 启用状态，点击后，牌牌将从庄家之后的玩家开始发牌。在原型中，用户是庄家。发完牌后，只有 `BID` 按钮被启用。\n* \
    \  当你点击 `BID` 时，将开始下注轮。当轮到用户下注时，剩余的 7 个按钮将根据实际情况启用，它们是：\n    *   `CHECHK`, `BET`,\
    \ `BET+`, `FOLD`\n    *   `CALL`, `RAISE`, `RAISE+`, `FOLD`\n*   在玩家点击其中一个按钮后，所有按钮都将被禁用，剩余的（虚拟）玩家将下注。然后有三种选择：\n\
    \    1.  下注轮尚未完成，因为某个玩家提高了筹码。如果是这种情况，`BID` 将被启用，下注轮将按上述描述继续，但玩家只能选择：\n       \
    \ *   `CALL`, `RAISE`, `RAISE+`, `FOLD`\n    2.  下注轮已完成，如果不是最后一轮，`DEAL` 将启用，当用户点击它时，将发放下一张牌，然后\
    \ `BID` 将启用。\n    3.  下注轮已完成，但是最后一轮。此时 `DEAL` 被启用，但文本变为 `SHOW`，这提示你回合已结束，当点击 `SHOW`\
    \ 时，将更新赢者的筹码并清空底池。然后 `NEW` 被启用，你已准备好进入下一轮。\n\n你应该注意，这些按钮的功能尚未实现。\n\n### 项目架构\n\
    \n该项目的初步架构如下所示，其中包 `resources.images` 包含扑克牌的图像：\n\n![](img/Image1861.jpg)\n\n\
    `resources.css` 包含一个样式表，目前仅包含此程序中使用的一种样式——位于 `CardView` 类中。`poker.tools` 包含辅助类。其中一个类名为\
    \ `Images`，是一个单例，提供扑克牌图像。另一个类是 `CardView`，它是一个带有 `ImageView` 的 `GridPane`，因此是一个带框显示扑克牌的简单组件。\n\
    \n关于 `poker.models` 包，定义了 4 个枚举：\n\n1.  `CardColor`，代表四种牌的颜色\n2.  `CardValue`，代表\
    \ 13 种牌值\n3.  `PokerGames`，列出了 5 种扑克变体\n4.  `PokerBets`，指示玩家的注\n\n以及 5 个类。`Card`\
    \ 代表一张扑克牌：\n\n![](img/Java_20_62.jpg)\n\n而 `Cards` 代表一组包含 52 张牌的扑克牌：\n\n![](img/Java_20_63.jpg)\n\
    \n这些是我之前展示过的类，它们的工作方式与 `Poker` 程序中基本相同。接下来的类是游戏本身模型的开头，也被定义了，但尚未广泛使用：\n\n![](img/Java_20_631.jpg)\n\
    \n最后，有一个类代表给定玩家持有的牌：\n\n![](img/Java_20_632.jpg)\n\n此外还有一个异常类。然后是 `poker.views`\
    \ 包，它包含视图（view）和演示器（presenter）类。初步包括：\n\n1.  `MainView` 和 `MainPresenter`，定义了带有按钮的主工具栏或菜单。\n\
    2.  `HandView` 和 `HandPresenter`，显示单个玩家的牌和筹码数量。\n3.  `Card5View` 和 `Card5Presenter`，定义了当前变体的面板。\n\
    4.  `TableView` 和 `TablePresenter`，是上述内容的类的类。\n\n迭代以简单的重构结束，这无非是清理工作。\n\n## 6.5\
    \ 迭代 2\n\n以下算法具有 `Card[]` 类型的参数，代表玩家的牌。假设牌是按降序排列的。前面的算法用于确定玩家牌的值。这些算法会被其他算法调用：\n\
    \n![](img/Java_20_64.jpg)(image/Java_20_65.jpg)(image/Java_20_66.jpg)\n\n可能需要多个类似的算法，因为在测试中，牌序列可能具有特定的值，如果合适，它们将看起来像上面一样且通常非常简单。在\
    \ `5 Card Stud` 中，明牌中最好的玩家必须始终开始下注轮。共有 4 轮下注，每轮下注都定义了一个算法，该算法返回开始下注轮的玩家索引。作为参数，算法拥有待测试的牌数组，并假设\
    \ 0 始终表示用户的手牌。\n\n![](img/Java_20_661.jpg)(image/Java_20_67.jpg)(image/Java_20_68.jpg)\n\
    \n在比牌（showdown）时，需要一个算法来返回拥有最大牌（hand）的玩家索引：\n\n![](img/Java_20_681.jpg)\n\n最后的算法涉及虚拟玩家在下注轮中如何行动，例如说明玩家需要下注多少（`BET`），当玩家加注（`RAISE`）时下注多少，以及玩家应该何处选择\
    \ `CHECK`，并可能诈唬。该玩家将根据自己的牌和其他玩家的明牌来做出选择。玩家如何做出选择取决于当前的下注轮，因此取决于玩家能看到多少张牌，这使得预测下注变得困难，选择在某种程度上是随机的。对于每轮下注，有两种情况：\n\
    \n1.  该玩家是第一个，或者该轮最后一次下注是 `CHECK`，然后玩家有四种选择：`BE = BET`, `B+ = BET`, `CH = CHECK`,\
    \ `FO = FOLD`\n2.  玩家已经下注，因此已投入底池资金，在这种情况下有四个选项：`RA = RAISE`, `R+ = RAISE`, `CA\
    \ = CALL`, `FO = FOLD`\n\n"
