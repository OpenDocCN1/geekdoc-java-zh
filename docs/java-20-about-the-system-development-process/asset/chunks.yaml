    1. Each player pays a blind to the pot.

    2. Each player gets two closed cards (face down) and an open card (face up). Then
    the first betting round follows and the player with the lowest open card starts.
    If two players open cards have the same value, it is the cards color that determines
    who starts.

    3. Players who have not yet folded their cards now receive a fourth and open card
    and a new betting round (the 2nd betting round) begins. This time it is the player
    with the best combination of the open cards that starts.

    4. Another card is given with face up and another betting round (the 3rd bidding
    round) takes place according to the same pattern as the previous betting round.

    5. Another card is given with face up and another betting round (the 4th betting
    round) takes place according to the above pattern.

    6. A seventh and last card is given to the remaining players in the round, but
    with the face down (a closed card) and the last betting round (the 5th betting
    round) takes place according to the same pattern as the previous one.

    7. If there are two or more players who have not yet folded their cards after
    the last betting round, the winner will be settled at a showdown where each player
    will make the best five-card poker hand out of his own seven cards. The player
    with the best hand wins the pot. If there is only one player left, this player
    has won.


    ### 5 Card Draw

    It is the original poker game and is simpler than the above variants, and there
    are only 2 betting rounds. The procedure is as follows:

    1. Each player deposits a blind.

    2. Each player is given 5 closed cards.

    3. The first betting round takes place and starts with the player to the left
    of the dealer.

    4. After the first betting round, the players still in the game must throw between
    0–5 cards, after which they receive a corresponding number of new cards given
    by the dealer.

    5. When the players have exchanged cards (if they choose so), the second betting
    round will come.

    6. If there are more than one player left, the winner is founded at showdown and
    if there is only one player left that player has won.


    If there are 6 players, it means that you in principle needs 60 cards, which is
    not possible. It is decided to ignore this problem as it is perceived as theoretically
    that all players throw all there cards. Should it happen, it is assumed that the
    game is ignored, but the pot will remain to the next round.


    ### 5 Card Stud

    As mentioned, it is a simplified game with four betting rounds and the procedure
    is as follows:

    1. Each player pays a blind to the pot.

    2. Each player receives a closed card and an open card. Following is the first
    betting round where the player with the highest open card starts.

    3. Players who have not yet folded their cards now receive a third open card and
    a new betting round (the 2nd betting round) begins where the player with the best
    combination of the two open cards starts.

    4. A fourth card is given with the face up and another betting round (the 3rd
    betting round) takes place according to the same pattern as the previous betting
    round.

    5. A fifth and last open card is given to the remaining players in the game and
    the last betting round takes place according to the same pattern as the previous
    two.

    If there are two or more players who have not yet thrown their cards after the
    last betting round, the winner will be settled at a showdown, otherwise the remaining
    player will win the pot.


    ## 6.3 The process

    The development is planned to include the following iterations:


    1. **iteration**

    Development of prototype for `5 Card Stud`. The purpose is primarily to get started,
    including the preparation of a preliminary design of the user interface. You should
    not be able to complete a hole round, but you should be able to deal the first
    two cards so that all the technical regarding showing the cards is in place.


    2. **iteration**

    An algorithm must be developed for how a virtual player should play `5 Card Stud`.
    The algorithm should include:

    * how the virtual player should act in a betting round, for example, how much
    the player has to bet (`BET` of `BIG BET`), when the player has to raise (`RAISE`
    or `BIG RAISE`) and when the player should choose `FOLD` and possibly bluff

    * who should start a betting round

    * who wins at showdown

    In addition, the iteration must include an algorithm for how the individual betting
    rounds should proceed depending on whether is the user or a virtual player who
    starts the betting round.


    3. **iteration**

    The overall design of the program’s classes, which includes important decisions
    for which classes the program should primarily consist of.

    Implementation of the poker variant `5 Card Stud`. The iteration thus includes
    implementation of all algorithms from iteration 2. After this iteration, you should
    be able to play poker with the program, but only the simple `5 Card Stud` variant
    and there should be no user administration.


    4. **iteration**

    The Iteration includes decisions and designs regarding how to save the program’s
    data and what data to save. It is decided that data should be stored in common
    files, partly because it should be simple to install the program, and partly because
    data is not critical, which means that the program’s vision is merely entertainment.
    It also includes the design and implementation of the classes that are necessary
    for users’ accounts.

    Finally, the iteration must include an extension of the version from iteration
    3 extended with login, including the maintenance of users and their accounts.

    The iteration must also implement the user dialog to start a new game.


    5. **iteration**

    Implementation of the variant `7 Card Stud`. It includes new algorithms corresponding
    to the algorithms developed for `5 Card Stud`, but it is expected that these algorithms
    will substantially resemble the algorithms from iteration 2, and part of the algorithms
    may be used directly. In addition, the iteration will include a change of the
    user interface corresponding to the fact that each player now has more cards.


    6. **iteration**

    Implementation of `Texas Hold’em`. In the same way as iteration 5, this iteration
    includes implementation of new game algorithms, as well as developing new user
    interface.


    7. **iteration**

    Implementation of `Omaha`. It is perceived as a simple iteration, which is primarily
    a matter of modifying the result of iteration 6.


    8. **iteration**

    Implementation of `5 Card Draw`. It is the last variation of the game, and after
    this iteration, the program is in principle complete. The iteration includes new
    algorithms corresponding to `5 Card Draw`, including where the virtual players
    must make decisions as to which cards they wish to exchange. In addition, the
    variant requires the user interface to change.


    9. **iteration**

    This iteration includes improving the user interface, including colors and fonts.
    Optionally, a form of settings must also be implemented.

    The iteration also includes a code review and refactoring.

    Finally, the iteration must include the development of an installation script
    as well as an icon for the program.


    ### Challenges and risks

    In principle, it is a relatively simple program corresponding to the fact that
    it is a standalone windows program, and it is thus well known how the task should
    be solved. However, there are two challenges to the program where the solution
    is not clear and both are crucial to the success of the program and whether there
    are users who wish to use the program:

    1. The user interface must be nice and appealing – whatever it may be. In addition,
    the user interaction must be easy and intuitive.

    2. The virtual player must be implemented with a sensible behavior and as a player
    you can not immediately win over. It must be difficult (impossible) to figure
    out how the virtual player acts.


