    你并不是在单个迭代中遵循瀑布模型，这并非事实，而是通常你会以迭代的方式工作，即进行分析、设计、编程，然后返回某些分析任务。


    一次迭代的结果是：


    *   项目处于稳定状态，可以提交给任务经理或客户。它通常是一个任务测试人员可以进行测试并提供意见的软件产品。

    *   根据与本次迭代实施相关的决策，更新后的任务说明书版本，并扩展包含当前迭代重要结果的章节。

    *   根据迭代期间执行的分析，更新后的需求说明书版本。

    *   一份结论，包括客户在测试产品后的意见以及开发人员对系统持续开发的建议。

    *   项目计划的调整，包括下一次或未来几次迭代的计划。


    看到以上这些，似乎认为你是在没有计划的情况下工作，并随着项目的进展来决定应该发生什么。当然，你不能这样开发 IT 系统，因为任务经理或客户必须知道系统预计何时交付以及成本是多少；但反过来，应该注意的是，当统一用过程（unified
    process）不断调整需求并不断规划迭代时，这恰恰就是敏捷方法的含义。这并不意味着你是在没有计划的情况下工作，而是承认对于大型复杂系统，无法描述一份完整的需求说明书并估计开发所需的时间和成本，而问题在于，你如何能做到。统一用过程的想法是，你不断地完善需求说明书和项目计划，以便在细化阶段（elaboration）完成后，需求说明书是完整的，并包含了解决方案的最终价格以及何时可以交付和应用。在此之前，一切都必须基于不断支撑和调整的估算，而这恰恰是系统开发的困境。然而，在统一用过程中，目标是细化阶段之后需求必须就绪，并有完整的项目计划和资源项目需求。


    除了上述内容外，我想提一下，当估计一个系统开发项目如此困难时，不仅是因为开发人员计划能力差，同样也是因为大型复杂 IT 解决方案的任务经理和客户无法制定任务。这需要一个不断识别需求并决定做什么、哪些应该被界定的过程，并记住，界定也可以推迟到以后。这正是细化阶段所处理的过程。


    统一用过程的核心概念是迭代，其跨度通常在一个一个月左右。正如提到的，迭代必须将系统从一个稳定状态带到另一个稳定状态，重要的是迭代的结果是：让任务经理通过结果展示感受到进展。单个迭代的规划始于启动阶段（inception），贯穿整个细化阶段，随着新迭代的加入不断扩展。对于每次迭代，必须：


    1. 计划迭代应该包含什么

    2.  以及迭代必须何时完成


    关于第一点，迭代必须包含整个项目过程中定义良好的工作，且迭代通常在一个月内结束，很少持续更久。更多人可能同时同一个迭代，但人数不多。另一个问题是如果迭代没有按时完成该怎么办。在这里，统一用过程的一个强制性是迭代必须按时终止，缺失的部分必须推迟到后续迭代。


    ### 构建（Construction）


    这是时间最长的阶段。它与细化阶段一样由多次迭代组成，由于已制定并就绪（需求说明书已完成），且所有重要的决策和风险评估都已明确。因此，编程和测试是主要的缺项。


    构建阶段通常持续很长，因为许多任务可以推迟到构建阶段。通常，构建阶段的每次迭代比细化阶段可以在更大程度上并行进行，几名开发人员分别负责各自的迭代。


    迭代的结果在原则上与细化阶段相同，区别在于通常不会有任务说明和需求说明书的更新，在最坏的情况下只有微调；除了产品外，结果只是对当前迭代的简短且准确的总结，包括迭代测试的结果。


    人们也可以将构建视为一个阶段，在该阶段，项目已经进入了稳定且有计划的轨道，通过这一精心规划的轨道，项目向最终产品移动。在那个时刻，风险消失了，只剩下“硬”工作。


    ### 渡过渡（Transition）


    最后一个阶段也是迭代阶段，但通常迭代很少，往往只有一个。它是交付阶段，任务可能变动很大，但与我之前在书籍 `Java 7` 中描述的相同。该阶段迭代的规划发生在细化阶段。


    ## 2.4 SCRUM


    这些书中关于系统开发所说的一切内容，都仅与开发人员的特定任务有关，包括开发人员如何推进以编写和测试各个程序。当然，从某种意义上说，其核心内容（是什么）也很重要，但对于开发人员团队协作开发当前系统的大型项目，项目管理是必不可少的，IT
    项目有时出错的原因之一实际上是缺乏管理。随着时间的推移，开发出了几种项目管理方法，其中非常成功的一种被称为 `SCRUM`。事实上，该方法并不直接针对软件系统开发，但该方法被证明特别适用于管理
    IT 开发项目。以下是对 `SCRUM` 的简要介绍。


    `SCRUM` 背后的一个原则之一是承认，由于许多不确定性，无法预先定义系统的所有需求，这与我在上面统一用过程中提到的完全相同。因此，需要一种足够灵活的项目管理方法，来处理以整个开发过程中需求不断变化为特征的系统开发，同时确保项目的进展。这种系统开发过程被称为敏捷，而
    `SCRUM` 是一种敏捷项目用管理方法，也是实践中应用最广泛的项目管理方法。


    '
- fmt: '

    Now SCRUM is not always the right method, and for SCRUM to makes sense, the project
    must be of a reasonable size and be a project that should solved by a team of
    developers. In addition, it usually has to be a project characterized by many
    uncertainties and complexity, and where there is a need for agile methods, but
    can a project to some extent be characterized in that way, SCRUM has proven itself
    as an effective project management method.


    ## The elements in SCRUM


    Basically, the principles of SCRUM are to divide a project into a series of small
    iterations, which are called `sprints`. The starting point is that it has already
    been decided to develop a system (and in this book an application), and the task
    manager or customer already has a relatively accurate meaning of what it is for
    a system to be developed. The project starts with the development of two documents:


    1. `Vision Statement,` which gives a brief description of the goals of the project,
    which in the course of the project process will help the project team to focus
    on what is important seen from the task manager.

    2. `Product Map,` which is an introductory schedule for when important sub-products
    are delivered.


    The project process is divided into two phases, called respectively


    1. `Pre-sprints`

    2. `Timeboxed activities`


    where you can think of the first one as planning and the other as production,
    but how far the largest part of time is used in the final phase. In fact, phases
    are not the right word, as it is not so that you are either in one phase or another,
    but it all starts with `pre-sprints`, after which you perform a series of sprints
    and eventually (and often) return to the pre-sprints phase. You usually outline
    the SCRUM with a figure similar to the following:


    ![](image/Image1806.jpg)


    During pre-sprint, one focuses on injecting the user requirements and describing
    them as tasks to be solved. These descriptions are called stories. The result
    will typically be a large collection of stories, called `Product Backlog`. Typically,
    you do not complete Product Backlog before starting the individual sprints, and
    as soon as you find that enough information has been gathered that some stories
    are well described, you can start the first sprints. The goal is to get something
    done that end users can relate to and evaluate, and then to return to the pre-sprint
    phase and possibly update Product Backlog.


    Looking at the sprints phase, it includes a sprint planing for every sprint, a
    meeting where you plan what stories from Product Backlog to be transferred to
    `Sprint Backlog`, and thus what stories to work on in it a following sprint. A
    sprint is scheduled to take a certain period of time, which may vary, but typically
    takes a sprint of about 4 weeks, and it is recommended that a sprint should not
    take longer than one month. The team breaks down the selected stories for tasks
    that are then delegated among the team’s members. During a sprint, daily meetings,
    called `Daily Scrum`, are held, where each team member reports briefly the progress
    (or the opposite) in connection with the current tasks. These Daily Scrums are
    short meetings, and may take up to 15 minutes. At the end of a sprint, a meeting
    called `Sprint Demo` (or `Sprint Review`) is held. This meeting is held together
    with the task manager, where the team demonstrates the result of the current sprint
    and thus how the individual stories are resolved. The entire sprint finishes with
    a `Scrum Retrospective`, that is a meeting that is a review of the sprint, where
    the team looks back on the course for improvements.


    In connection with a SCRUM project, there are three roles (and there may be no
    other roles), and these roles are completed by the scrum team:


    1. `Product Owner,` which is one person who is part of the project on full-time
    or on part-time, and which represents the business area within the project is
    anchored.

    2. `Scrum Master,` who is one person who is full-time or on part-time on the project
    and who is a coach and facilitator for the development team.

    3. `The Development Team,` which is 3–9 full-time employees (also called specialists)
    and is part of the development organization as those who perform the individual
    sprints.


    In addition to this, there may be other stakeholders, who typically represent
    the customer or his organization.


    It is assumed that the team meets two basic assumptions that are considered necessary
    to ensure flexibility, creativity and productivity and are considered necessary
    for the agile environment:


    1. The team is self-organizing and plans its work without explicit leadership
    from the outside. One or more people in the team can be in charge of management
    while other participants are solely responsible for special specialist activities,
    but in SCRUM there is no division of management and specialist functions.

    2. The team participants have all the necessary expertise and competencies needed
    to get the task solved and without the need to get help from outside.


    ## The Product Owner


    Any project needs a person familiar with the business area whose task is to maximize
    the value of the team’s work and it is this person that is called `Product Owner`.
    Generally, the person comes from the development organization. It is important
    to be aware that the Product Owner must be know the problem area, but the person
    does not need to have special knowledge about system development. It is the `Product
    Owner` that is responsible for the project’s Product Backlog, which is a priority
    list of stories to be solved and it is the central planning tool in SCRUM. Stories
    are prioritized in terms of their value for the user organization, so that high-quality
    stories are solved first. It is also the `Product Owner` who is responsible for
    that each user story being easy to understand for the Scrum Team and other stakeholders.


    It is `Product Owner` who communicates with the task owner and user organization
    and uses this information to update the project’s Product Backlog. It is also
    the `Product Owner` who has an overview of the progress in the project and keeps
    the project stakeholders updated with regard to the final end date.


    The entire organization must respect `Product Owner` decisions, which is considered
    a prerequisite for the success of the project. Even Product Owner’s chief may
    not generally correct Product Owner decisions, and no one other than Product Owner
    may decide what the development team is supposed to deliver. However, it is permitted
    for the `Product Owner` to delegate decisions to the Development Team, such as
    adding items to Product Backlog, as long as the Product Owner has the full overview.


    ## Scrum Master


    `Scrum Master`’s task is to assist the Scrum Team by coaching them and ensuring
    that all principles of SCRUM are respected. Scrum Master must therefore have in-depth
    knowledge of SCRUM and the principles of the method. It is a management function,
    but it is not a project manager. Scrum Master will lead the SCRUM process, but
    not the Scrum Team. In addition to ensuring that the Development Team understands
    and uses SCRUM correctly, it is also the `Scrum Master`’s task to remove obstacles
    to the Development Team, ease everyday life and generally coach the participants.


    Scrum Master must also support `Product Owner` to pass the right information to
    the project’s stakeholders and generally provide expert knowledge available to
    the `Product Owner`.


    It is allowed for a person to be both `Scrum Master` and a member of the `Development
    Team`, but it is not recommended.


    ## The Development Team

