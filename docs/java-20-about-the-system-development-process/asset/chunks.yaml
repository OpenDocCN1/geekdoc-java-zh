  raw: 'As a last comment on system development, I want to mention log files, which
    are typically text files, where a program intermittently stores data relating
    to the application’s use. Now it does not have to be text files, but it can also
    be a database table, and if necessary, make sure that the program has database
    access. If you are using text files, make sure that the log file is created in
    a directory with a write access, and often you want to use the user’s home directory,
    but it is of course not an option if the log is to be used by multiple users.
    If a program uses log files, it can of course be a little dangerous to let a program
    write unrestricted and unchecked to a file or database table, and therefore log
    files should usually be combined with an option to disable/enable this functionality.


    There may be several reasons for using log files, and one is to collect statistic
    data relating to the application’s use, perhaps in order to improve the program
    later. Another and perhaps even more important application is logging of an error
    message. Once a program has been put into operation and errors occurs, they are
    reported to developers who then have the correct error. In order for this to be
    possible, you need some information, and here I would like to say that an error
    handling, where the program just crass and the screen is filled with errors regarding
    exceptions, simply can not be used. Firstly, users will not accept such malware,
    and it creates frustration and unwillingness towards the development organization,
    and secondly, it is far from the assumption that users are reported to such errors,
    and at best, you will be notified that the program is not working. As a developer,
    you know critical places where a program can go down and here you can encapsulate
    the code that can fail in a try/catch block and in case of an exception write
    a message in a log file. As a developer, in case of an error, you can ask to get
    the log file, and here you can see when and where in the program there have been
    errors.


    Such error logging can be a very big help in troubleshooting, just be careful
    about where in the code you write in the log file. In principle, the error log
    must be empty and therefore it may be a nice check of the program to periodically
    inspect the log file.


    It is important to note that error logging is by no means an alternative to testing
    and it is only something that can be used when the program is finished and tested
    and ready to deliver to the customer, but conversely, has the program first been
    put into operation, it can also be an extremely important source of reporting
    errors.


    # 6 Poker


    I want to close this book and thus also this series of books about software development
    in Java with another example of a program. The goal is similar to the final examples
    in the other books to show the development process, but the task/project does
    not directly follow any of the previous system development methods, but uses elements
    from several of them and what is otherwise mentioned in these books. The reason
    is partly the size of the program, where it is still a small program in size,
    and partly that the program is written by a single person. For these reasons,
    it does not make sense to use, for example, SCRUM or Unified Process, but conversely,
    elements of the methods will be used. In fact, it also reflects how system development
    methods are used in practice, where elements of concrete methods are used, and
    because the following is a slightly bigger program than what I have otherwise
    presented in these books, but in relation to the development of many IT systems
    in practice, it is still a very small program.


    I have previously shown – in the book Java 4, Problem 2 – a program where you
    could play poker against three virtual players. The program was somewhat simplified,
    primarily because it did not contain any betting. The following is also a poker
    program, but for the purpose of solving some of the shortcomings the program in
    Java 4.


    ## 6.1 Vision


    The task is to write a program where a player (user) can play poker on a single
    computer, a little like what for many is a very well-known Windows program called
    *Hearts Free*, but the card game here is instead poker. The user is playing against
    a number of virtual players. It is thus a usual GUI program.


    The game must support the following variants of poker:


    1.  Texas Hold’em


    2.  Omaha


    3.  7 Card Stud


    4.  5 Card Draw


    and it is the player (user) who decides what kind of game to start.


    The program’s vision is entertainment and you should not play with real money,
    but only about chips (jetons). The player must have an account that over time
    keeping track of how much the player (the user) has won and lost, and it must
    be possible to insert and raise the account.


    It is an important challenge to implement a virtual player that simulates a real
    poker player so that the virtual player is acting intelligently. The goal is that
    a user should find it interesting to play against other virtual players and that
    it is difficult to figure out how a virtual player acts.


    ## 6.2 Analysis of poker


    The following is an analysis of the game poker, and thus the rules of the game,
    or more precisely how the game poker is interpreted in this program and what options
    the program should support.


    Poker is played with all 52 cards and without jokers. Basically, the cards rank
    in ascending order are:


    *   two, three, four, five, six, seven, eight, nine, ten, jack, queen, king and
    ace


    In some cases, the color also has significance, and the rank is then (in ascending
    order):


    *   diamonds, hearts, spades and clubs


    A player must in one round form a *hand* consisting of 5 cards and the result
    of the hand is one of 9 options, arranged according to falling value:


    #### Straight flush


    Five consecutive cards of the same color, making it the hand with the highest
    value. An example could be


    *   5 spades: 8, 9, 10, Jack and Queen


    If there are two or more players who have straight flush, the highest card determines
    the rank, and if the cards are the same, the color determines the rank.


    #### Four of a kind


    Four cards of same value, and an example could be


    *   diamonds 4, hearts 4, spades 4, clubs 4 and another card


    The last card has no significance for the rank and has two or more players four
    of a kind, the highest card of the four of a kind determines the rank.


    #### Full house


    Three of a kind and one pair, for example


    *   diamonds 8, spades 8, clubs 8, hearts king, spades king


    If two or more players have a full house the highest of the three of a kind determines
    the rank.


    #### Flush


    Five cards in the same color, but not necessarily continuous values, for example


    *   diamonds 2, diamonds 7, diamonds 8, diamonds 10 and diamonds queen


    If two or more players have a flush determines the highest value of the first
    card the rank, which they are different, and if all cards the same value determines
    the color the rank.


    #### Straight


    Five cohesive cards, but not necessarily in the same color, for example


    *   diamonds 5, clubs 6, spades 7, heartsr 8 and spades 9


    Having multiple players straight determines the highest card the rank and has
    all cards the same value determines the color of the highest card the rank.


    #### Three of a kind


    Three cards of same value, where the last two cards have a different value and
    are not a pair, for example


    *   hearts jack, spades jack, clubs jack, diamonds 2 and hearts 5


    In the case where two or more players have three of a kind, the rank of the highest
    card (for the 3 of a kind) determines the rank. The last two cards therefore never
    have a meaning for the rank.


    #### Two pairs


    Two pairs: Two different pairs, where the last card must have another value, for
    example


    *   spades 2, clubs 2, hearts king, spades king and clubs ace'
