    2.  You can move the method to the base class and then add conditions that take
    into account for the specific classes.


    3.  You can let the methods be as they are, even if that means that the same code
    is duplicated.


    Each option has its pros and cons, and it’s very accurate to decide what’s right,
    but overall I prefer duplication of the code (and thus the last option) rather
    than complicating the code (what the middle option tends to). In the present case,
    I have actually applied all three options.


    The 5 classes also have methods that are used only in some of the classes. If
    so, one might consider moving the methods out as static methods in an auxiliary
    class. The class *Utils* in the package *poker.tools* is an example of such a
    class.


    The result of the above refactoring is that the class *TablePresenter* has grown
    significantly, while the 5 concrete view classes now do not fill a lot.


    Then there is refactoring of the model, where there are 20 classes (types), and
    here I have already at the start of this iteration carried out a review of 10
    of these types. Back there are the classes:


    *   *Model*


    *   *Hand*


    *   *AbstractPlayer*


    *   *Card5Player*


    *   *Card7Player*


    *   *TexasPlayer*


    *   *OmahaPlayer*


    *   *DrawPlayer*


    *   *Logfile*


    *   *PokerException*


    where there is nothing to notice about the last one. The same goes for the class
    *Model*, which is a central class, but also a very simple class.


    The class *Hand* is both comprehensive and important, and for the rest of the
    program it is crucial that this class works correctly. In connection with code
    review, nothing but ordinary cleanup has been done, but the class has a design
    problem similar to a low cohesion. The problem is that the last two variables:


    *   *selected*


    *   *clicked*


    that does not make sense for all variants of poker. The first one is only used
    in conjunction with *Texas Hold’em* and *Omaha*, while the latter is only used
    in conjunction with *CardDraw*. The problems are that you can refer to the variables
    in a context where they are not initialized or meaningful, and in particular,
    future maintenance of the program may be more difficult. The problem could be
    solved by introducing two derived classes, and then using these classes in the
    current variants. In the present case, I have omitted this change as it will mean
    changing some other classes and the problem solved solely with a comment in the
    code.


    Regarding the log file, there are also no important changes. However, a single
    adjustment has been made in the method *writeLine2()* to support *Texas Hold’em*
    and *Omaha*.


    Back there are the 6 player classes


    *   *AbstractPlayer*


    *   *Card5Player*


    *   *Card7Player*


    *   *TexasPlayer*


    *   *OmahaPlayer*


    *   *DrawPlayer*


    where the first is the basic class for the rest. A refactoring basically consists
    of the same as above with the view classes, where methods can be moved from the
    specific classes to the base class, but there are fewer methods that can be moved
    this time.


    Another thing is the algorithms, where there is room for improvement, but I’ve
    seen only on *Texas Hold’em* and *Omaha*. As for the first one, the algorithm
    looks only on the player’s own card, but does not take into account what cards
    the other players can form from the cards on the table. For example, if there
    are three cards on the table (what is the case in the second betting round), each
    of the other players can form a hand using two of 47 other cards (47 = 52 – the
    cards of the current player – the three cards on the table). The other players
    have therefore


    *   47 * 46/2 = 1081 possibilities


    to form a hand that contains the three cards on the table. For example, if there
    are 4 and 5 cards on the table, respectively, the numbers are respectively


    *   (46 * 45 / 2) * 4 = 4140 possibilities


    *   (45 * 44 / 2) * 10 = 9900 possibilities


    In order to determine what the player has to bet, instead, you can use a strategy
    that determines the value of the player’s hand (out of 5, 6 or 7 cards) and then
    determines how many of the other players’ options are better or worse than the
    player’s chosen hand. For example, if there are 5 cards on the table and you decide
    which cards the player should choose, and then you can do the following where
    *player* is a *List<Card>* with the 7 cards (the player’s two closed cards and
    the 5 on table) in descending order:


    ![](image/Java_20_121.jpg)


    and here c*reateHand()* is a simple method that creates a *Hand* object. With
    the player’s card available, the following method counts the frequency of hands
    that the other players can form from the 5 cards on the table and two other cards
    (which may not be the 7 cards the player knows):


    ![](image/Java_20_122.jpg)![](image/Java_20_123.jpg)


    The method returns a value between 0 and 1, and a large value (close to 1) indicates
    that the player has good cards and therefore can bet high. With this method available,
    the three bet methods can be written differently, where the value is determined
    based on the return value of the above method.


    You can use the same strategy in connection with *Omaha*, just be aware that the
    hand that a player can form is in another way, and that you get higher frequencies,
    as *Omaha* generally gives results with a greater value.


    #### The last thing


    There are still a few things that are missing. Firstly, there is a test of whether
    a player has money to deposit in the pool. If this is not the case, the player
    must leave the game and thus be out of the current game. In principle, it is quite
    simple to implement this facility, and it is primarily a matter of adding a variable
    to the Hand class:


    ![](image/Java_20_1231.jpg)


    If a player bet and does not have chips enough, this variable is set to true (the
    method *setLost()* is called). Then the number of the player’s chips is shown
    as 0, and the player folds the cards. In addition, the player in subsequent rounds
    must not be assigned cards.


    If it is especially the user who has lost his chips, it has been decided that
    the game is over and you get the following dialog box:


    ![](image/Image3580.jpg)'
