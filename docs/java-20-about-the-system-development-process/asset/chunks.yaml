    ```


    这里的 `createHand()` 是一个创建 `Hand` 对象的简单方法。在玩家牌可用的情况下，以下方法计算其他玩家可以组成的牌的频率：


    ```

    (image/Java_20_122.jpg)(image/Java_20_123.jpg)

    ```


    该方法返回 0 到 1 之间的值，大值（接近 1）表示玩家的牌很好，因此可以高注。有了这个方法，三个下注方法可以写得不同，，其值根据上述方法的返回值来确定。


    你可以在 `Omaha` 中使用相同的策略，只需注意玩家可以组成牌的方式是不同的，而且你会获得更高的频率，因为 `Omaha` 通常给出的结果更大。


    #### 最后一点


    仍然缺少一些东西。首先，有一个测试是检查玩家是否有足够的钱存入池中。如果不是这样，玩家必须离开游戏，从而退出当前游戏。原则上，实现此功能非常简单，主要关乎在
    `Hand` 类中添加一个变量：


