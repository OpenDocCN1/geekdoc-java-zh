    `GamePresenter`、`GameView`、`OptionsPresenter` 和 `OptionsView` 这四个类以及相关的接口 `IGameUpdater`
    在本次迭代中经过间接审查，因此它们已全部就绪。`HandView` 和 `HandPresenter` 是简单的类，审查并不意味着任何更改。


    `MainView` 和 `MainPresenter` 是重要的类，但它们是相对简单的类，审查的结果仅仅是对代码进行了简单的清理。


    接下来是 5 种扑克变体视图的类，它们同时也是用户界面的关键类。这 5 个视图类 `Card5View`、`Card7View`、`TexasView`、`OmahaView`
    和 `DrawView` 都是简单的，除了简单的清理外没有其他需要要做的操作。基类 `TableView` 也是如此，因为本次迭代早期从派生类的的方法已经移动到了基类中。


    查看这 5 个演示器类 `Card5Presenter`、`Card7Presenter`、`TexasPresenter`、`OmahaPresenter`
    和 `DrawPresenter`，它们非常相似，这表明大部分代码可以移动到基类中。这 5 个类中相同的方法可以立即移动到基类，此时你可能需要将可见性从 `private`
    更改为 `protected`。还有一些方法几乎相同，这里的选择就不那么简单了，在这里始终记住首要目的是增加可维护性。如果方法几乎相同，基本上有三种选择：


    1. 你可以在基类中创建一个与当前方法签名相同的方法，并实现公共代码。在子类中，你可以实现一个重写（override），调用基类方法并包含该子类特有的代码。

    2. 你可以将方法移动到基类中，然后添加考虑特定类的条件。

    3. 你可以保持方法原样，即使这意味着相同的代码重复。


    每个选项都有其优缺点，要决定哪种才是是非常准确的，但总的来说，我更倾向于代码重复（即最后一种选项），而不是让代码复杂化（中间选项倾向于这样做）。在当前的情况下，我实际上应用了所有三种选项。


    这 5 个类还包含仅在某些类中使用的方法。如果是这样，可以考虑将这些方法作为静态方法移动到辅助类中。`poker.tools` 包中的 `Utils` 类就是此类类的一个示例。


    上述重构的结果是 `TablePresenter` 类显著增长，而这 5 个具体的视图类现在不再占据大量空间。


    然后是模型的重构，这里有 20 个类（类型），在本次迭代开始时，我已经对其中 10 种类型进行了审查。这些是这些类：


    * `Model`

    * `Hand`

    * `AbstractPlayer`

    * `Card5Player`

    * `Card7Player`

    * `TexasPlayer`

    * `OmahaPlayer`

    * `DrawPlayer`

    * `Logfile`

    * `PokerException`


    其中最后一个没有特别的。`Model` 类也是如此，它是一个中心类，但一个非常简单的类。


    `Hand` 类既全面又重要，对于程序的其余部分，该类的正确工作至关重要。在代码审查方面，只进行了普通的清理，但该类存在类似于低内聚性的设计问题。问题在于最后两个变量：


    * `selected`

    * `clicked`


    这对于所有的扑克变体来说都是意义的。第一个只与 `Texas Hold’em`（德州扑克）和 `Omaha` 结合，而后者只与 `CardDraw`（抽牌扑克）结合。问题在于，你可以在变量未初始化或无意义的上下文中引用这些变量，特别是程序的未来维护可能会更加困难。这个问题可以通过引入两个派生类，然后在当前的变体中使用这些类来解决。在当前情况下，我省略了这一更改，因为这意味着要更改其他一些类，而该问题仅通过代码中的注释即可解决。


    关于日志文件，也没有重要的更改。不过，在 `writeLine2()` 方法中进行了一项调整以支持 `Texas Hold’em` 和 `Omaha`。


    接下来是这 6 个玩家类：


    * `AbstractPlayer`

    * `Card5Player`

    * `Card7Player`

    * `TexasPlayer`

    * `OmahaPlayer`

    * `DrawPlayer`


    其中第一个是其他类的基类。重构基本上与上述视图类的操作相同，方法可以从特定类移动到基类，但这次可以移动的方法较少。


    另一件事是算法，那里有改进空间，但我目前只只在 `Texas Hold’em` 和 `Omaha` 上看到了。至于第一个，算法只看玩家自己的牌，但没有考虑到其他玩家可以根据桌面上的牌组成什么牌。例如，如果桌上有三张牌（这是第二轮下注的情况），每个其他玩家可以使用其他
    47 张牌中的任意两张组成手牌（47 = 52 – 当前玩家的牌 – 桌面上的三张牌）。


    为了确定玩家应该选择什么，可以使用以下内容，其中 `player` 是一个包含 7 张牌（玩家知道的）降序排列的 `List<Card>`：


    ```

