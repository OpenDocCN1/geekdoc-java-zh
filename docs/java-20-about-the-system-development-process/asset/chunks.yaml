    # 4 Design patterns


    At one point, system development began to talk about design patterns, and like
    everything else new, design patterns received great attention – and perhaps even
    some interpreted as the solution to this world’s problems in software development.
    It is probably a little over-interpreted, but conversely, knowledge of design
    patterns is important for software development in practice. It all started with
    a book


    *Design Patterns: Elements of Reusable Object-Oriented Software*


    written by four writers, referred to as the *Gang of Four*. They described 23
    patterns, and this book has since been the main source of design patterns. It
    is certainly recommended to read the book and study the 23 patterns. Since then,
    others have described other patterns, so today there are many to choose from.'
