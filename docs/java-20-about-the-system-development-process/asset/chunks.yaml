    The dialog box itself is defined by two classes `OptionsView` and `OptionsPresenter`.
    The settings in this dialog should be saved somewhere, and provisionally, the
    idea is that it should be done by object serialization in the user’s home directory.
    However, this facility is not yet implemented, as it is expected that the program
    will receive other settings later, and the class `Options` and above dialog box
    will be expanded accordingly.


    It’s simple to implement the log file itself using a functionality similar to
    the class `LogFile` from the previous iteration. This class has now been deleted
    and replaced by a class `Logfile` that contains a `write` method for each of the
    four lines to be written:


    ![](image/Java_20_951.jpg)[](image/Java_20_96.jpg)


    Here you should note that the file is opened and closed for each line the program
    writes to the file. The reason is that function as default is disabled, and idea
    is that you only use the function if you want to collect information about the
    program for one reason or another. Otherwise, the challenge is to get the write
    operations in question put in the code in the correct places and then of course
    test.


    You should note that to write the cards to the log the class `Hand` is expanded
    with a single new method, which for a card returns the text to be written in the
    file.


    ## 6.8 Iteration 5


    The next four iterations are similar to each other and are about to implement
    another poker variant and, in principle, repeat much of the above just for another
    game. I want to start with `7 Card Stud` simply because this variant looks like
    `5 Card Stud` a lot. The most important differences are:


    1. that each player has 7 cards with three closed and 4 open cards

    2. that there are 5 betting rounds

    3. that the players at the last two betting rounds have 6 and 7 cards respectively
    to choose from

    4. that it is the player with the lowest card that starts the first betting round


    Compared to `5 Card Stud`, the two biggest challenges are:


    1. Implementation of the class `Card7Player` as an alternative to `Card5Player`.

    2. Implementation of the user interface, since there must now be room for more
    cards.


    I have started with the last as follows:


    *   Created two classes `Card7View` and `Card7Presenter` which are copies of `Card5View`
    and `Card5Presenter`.

    *   Modified the class `Card7Presenter`, so it instantiates a `Card7View` object
    instead of a `Card5View` object.

    *   Changed the class `Game` so it initializes the property `poker` with the value
    `CARD7`.

    *   Changed the method `initialize()` in the class `MainPresenter`, so there is
    now a case entry for `CARD7`.

    *   In the class `Card7View` I have commented out the line that shows the pot:![](image/Java_20_98.jpg)


    After that, the program is running again, so it uses the new classes `Card7View`
    and `Card7Presenter` for the user interface, and for each player there is now
    room for 7 cards (the number of cards to be room for has already been implemented
    in the base class `TableView`).


    I have then modified the class `Card7View`, so the pot moves up in the upper left
    corner:


    ![](image/Image3543.jpg)


    Then the user interface is in principle complete.


    As a next step, the model has been expanded with a new class `Card7Player`, which
    so far is just a copy of the class `Card5Player`. In addition, the constructor
    in the class `Card7Presenter` has been changed, so it instead creates a `Card7Player`
    object. After that, the program can run again, though it still plays `5 Card Stud`,
    but the task is now substantially reduced to modify the two classes `Card7Player`
    and `Card7Presenter`.


    As a first step, I have in the class `Card7Presenter` modified methods `deal()`
    and `deal1()`, so I can now deal 7 cards where the first two and the last are
    closed.


    The class `Card7Player` is extensive, as the algorithms regarding the betting
    rounds needs to be changed. Since there is now an additional betting round, the
    base class `AbstractPlayer` is expanded with two abstract methods:


    ![](image/Java_20_99.jpg)


    It requires that these methods are also implemented in the class `Card5Player`,
    where they are simply implemented as trivial methods, for example.


    ![](image/Java_20_991.jpg)


    The methods that determines who will start a betting round are largely unchanged,
    and the changes primarily concerns the five methods that determines the virtual
    player’s bets. In principle, these methods work in the same way as in `Card5Player`
    and are based on determining a bet from the open cards. This is primarily done
    by methods in the class `Hand`, but as a player may have more cards (6 or 7) this
    time, it is necessary to modify some of the methods in the class `Hand` and to
    add some new ones. These methods are crucial to how the game algorithms works,
    and it is therefore necessary to test them thoroughly before using them in the
    algorithms. Therefore, the test classes for the unit test have been expanded and
    a single new test method has been added. After that, the algorithms in the class
    `Card7Player` can be implemented according to the same pattern as in `Card5Player`.


    The class `Card7Presenter` must of course also be modified. It is actually modest
    what needs to be changed, and it primarily concerns that the class now has to
    support 5 betting rounds. In addition, the class is changed, so when showdown
    alone the 5 cards that the player uses are shown and as always are the cards that
    give the best hand.


    Looking at the classes `Card7Player` and `Card7Presenter` they contains many repeats
    from the corresponding iteration, and it means that some of the code should later
    be moved to the base classes. I will postpone that later to a refactoring in iteration
    9.


    ## 6.9 Iteration 6


    As the next poker variant, I will implement `Texas Hold’em`. Here, in the same
    way as `5 Card Stud` there is 4 betting rounds, but the players can, as in `7
    Card Stud`, have up to 7 cards, where the two are closed cards, while the remaining
    5 are open cards on the table. The challenges in this iteration are a bit like
    in the previous iteration, but such that the user interface should be somewhat
    different.


    In the same way as in the previous iteration, I have added the following classes:


    1. `TexasView`, as a copy of `Card7View`

    2. `TexasPresenter`, as a copy of `Card7Presenter`

    3. `TexasPlayer`, as a copy of `Card7Player`


    Then I have modified the class `Game`, so the default poker variant is `Texas
    Hold’em`, and I have expanded the method `initialize()` in the class `MainPresenter`.
    Then the program can run again and use as the default the above classes. As the
    next step, the class `TexasView` has been changed, so the user interface is as
    follows:


    ![](image/Image3550.jpg)


    where each player now has room for 2 cards while there are room for 5 cards on
    the table.


    There is an additional challenge for the user interface, that in one way or another
    I have to present the cards that are a player’s hand after the end of a round.
    It is solved that way, that after showdown, I replace the above panel with another
    panel similar to the user interface in `Card7View`. It’s a relatively simple solution,
    which consists simply of adding another two classes:


    *   `ResultView`

    *   `ResultPresenter`


    and then open the window from the method `deal1()`.

