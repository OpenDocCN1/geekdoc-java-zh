- fmt: "\nThe window below shows the prototype where a `5 Card Stud` game has been\
    \ started with 5 players and the 5 players are given the first 2 cards:\n\n![](image/Image1854.jpg)\n\
    \nThe bottom player is the user. Below each player there is a `TextField` showing\
    \ the player’s amount of money (the number of chips) and the field in the center\
    \ is the pot.\n\nAt the bottom, the buttons are the commands that the user must\
    \ use to play. The meaning is as follows:\n\n*   When you start a new game, only\
    \ `NEW` is enabled and when the user clicks on it, a new round starts.\n*   After\
    \ that, only `DEAL` is enabled and when clicked, cards is dealt out starting with\
    \ the player who is after the dealer. In the prototype the user is the dealer.\
    \ After dealing cards, only the `BID` button is enabled.\n*   When you click on\
    \ `BID`, a bidding round starts and when it’s the turn of the user to bet, the\
    \ remaining 7 buttons are enabled as they make sense, and it is:\n    *   `CHECHK`,\
    \ `BET`, `BET+`, `FOLD`\n    *   `CALL`, `RAISE`, `RAISE+`, `FOLD`\n*   After\
    \ the player has clicked on one of the buttons they are all disabled and the remaining\
    \ (virtual) players are betting. Then there are three options:\n    1.  The betting\
    \ round has not been completed because a player has raised the deposit. If it\
    \ is the case, `BID` will be enabled and the betting round will continue as described\
    \ above, however, the player may only choose:\n        *   `CALL`, `RAISE`, `RAISE+`,\
    \ `FOLD`\n    2.  The betting round is completed and if it is not the last round,\
    \ `DEAL` will be enabled and when the user clicks on it the next card is given\
    \ and `BID` will then be enabled.\n    3.  The betting round is completed, but\
    \ it is the last round. Then `DEAL` is enabled, but the text changes to `SHOW`,\
    \ which tells you that the round is over, and when clicking on `SHOW`, the winner’s\
    \ chips are updated and the pot is cleared. Then `NEW` is enabled and you are\
    \ ready for the next round.\n\nYou should note that the functionality of these\
    \ buttons has not yet been implemented.\n\n### Project Architecture\n\nThe project’s\
    \ architecture is preliminary the following, where the package `resources.images`\
    \ contains images of the playing cards:\n\n![](image/Image1861.jpg)\n\n`resources.css`\
    \ contains a style sheet that for now only contains one style used in this program\
    \ – in the class `CardView`. `poker.tools` contains a few help classes. One class\
    \ is called `Images` and is a singleton that makes the images of the cards available.\
    \ The other class is `CardView` that is a `GridPane` with an `ImageView` and thus\
    \ a simple component that shows a playing card with a frame around.\n\nWith respect\
    \ to the package `poker.models`, 4 enumerations are defined:\n\n1.  `CardColor`,\
    \ representing the four card colors\n2.  `CardValue`, representing the 13 card\
    \ values\n3.  `PokerGames`, which lists the 5 poker variants\n4.  `PokerBets`,\
    \ which indicates the player’s bets\n\nand 5 classes. `Card` represents a playing\
    \ card:\n\n![](image/Java_20_62.jpg)\n\nwhile `Cards` represents a stack of playing\
    \ cards with 52 cards:\n\n![](image/Java_20_63.jpg)\n\nThese are classes that\
    \ I have shown before and they work basically the same way as in the program `Poker`.\
    \ The following class, which is the beginning of model for the game itself, is\
    \ also defined, but it is not yet used much:\n\n![](image/Java_20_631.jpg)\n\n\
    Finally, there is a class representing the cards that given player has:\n\n![](image/Java_20_632.jpg)\n\
    \nand in addition there is exception class. Then there is `poker.views` package\
    \ that contains view and presenter classes. Preliminary there is:\n\n1.  `MainView`\
    \ and `MainPresenter`, which defines the main window with the buttons and maybe\
    \ later a toolbar or menu.\n2.  `HandView` and `HandPresenter`, which shows the\
    \ individual player’s cards and the number of player’s chips.\n3.  `Card5View`\
    \ and `Card5Presenter`, which defines a pane for the current variant.\n4.  `TableView`\
    \ and `TablePresenter`, there are basic classes for the above.\n\nThe iteration\
    \ ends with simple refactoring, which is nothing but a cleanup.\n\n## 6.5 Iteration\
    \ 2\n\nThe following algorithms have parameter of the type `Card[]` that represents\
    \ player’s cards. It is assumed that the cards are sorted in descending order.\
    \ The first algorithms are used to determine the value of player’s cards. The\
    \ algorithms help used by the other:\n\n![](image/Java_20_64.jpg)(image/Java_20_65.jpg)(image/Java_20_66.jpg)\n\
    \nThere will probably be need for multiple algorithms of similar kind, as tests\
    \ of where sequence of cards may have a certain value, and they will, if appropriate,\
    \ look like the above and generally be simple. In `5 Card Stud`, the player with\
    \ the best open cards must always start the betting round. There are 4 betting\
    \ rounds and an algorithm is defined for each betting round, which returns the\
    \ index for the player to start the betting round. As a parameter, the algorithms\
    \ have array of the cards to be tested, and it is assumed that 0 always indicates\
    \ the user’s hand.\n\n![](image/Java_20_661.jpg)(image/Java_20_67.jpg)(image/Java_20_68.jpg)\n\
    \nAt showdown, an algorithm is required that returns the index for the player\
    \ who has the highest hand:\n\n![](image/Java_20_681.jpg)\n\nThe last algorithms\
    \ relates to how the virtual player should act in betting round, for example,\
    \ to say how much the player has to bet (`BET`), and how much when the player\
    \ raises (`RAISE`) and where the player should choose `CHECK`, and possibly bluff.\
    \ The player in question will make his choice based on his own cards and the other\
    \ players’ open cards. How the player makes his choice is determined from the\
    \ current betting round and hence how many cards the player can see and make it\
    \ harder to predict the betting, the choice is to some extent random. For each\
    \ betting round there are two situations:\n\n1.  that it is the player who is\
    \ the first or round’s last bet was `CHECK`, and the player then has four: `BE\
    \ = BET`, `B+ = BET`, `CH = CHECK`, `FO = FOLD`\n2.  that a player has already\
    \ bet, and thus has deposited money in the pot, and in this case there are four\
    \ options: `RA = RAISE`, `R+ = RAISE`, `CA = CALL`, `FO = FOLD`\n\nFor each bet,\
    \ there are two options, such as `CH` or `BE`, but such that the first one is\
    \ chosen with some probability or random. If a situation in the following algorithms\
    \ determines that the player can choose `10%, CH, BE`, this means that the player\
    \ randomly chooses `CH` in 10% of the cases, while in other cases, the player\
    \ chooses `BE`. This means that it can be difficult to predict what the player\
    \ bets. The following 4 algorithms are all formulated using a five-column table,\
    \ where the first column indicates a condition and the other columns indicates\
    \ the player’s bet. The individual rows should be perceived as `if/else` so that\
    \ if a condition is not met then the next one is tested. Note that the virtual\
    \ player’s action can be fine-tuned by introducing more rows in the tables, which\
    \ will probably also be the case in the implementation, and you should only perceive\
    \ the following as examples of which conditions the algorithm may contain.\n\n\
    ![](image/Java_20_69.jpg)(image/Java_20_70.jpg)(image/Java_20_71.jpg)(image/Java_20_72.jpg)(image/Java_20_73.jpg)(image/Java_20_74.jpg)(image/Java_20_75.jpg)(image/Java_20_76.jpg)(image/Java_20_77.jpg)(image/Java_20_78.jpg)(image/Java_20_79.jpg)(image/Java_20_80.jpg)\n\
    \nIn connection with the implementation and later when testing, there will certainly\
    \ be changes to the above tables, partly as to which and how many conditions are\
    \ required, and partly as to the probabilities that will be used. If applicable,\
    \ the above tables will not be updated. The game’s value will largely be determined\
    \ by how lucky it is with the implementation of these algorithms and it is actually\
    \ extremely difficult (impossible) to implement the kind of algorithms so that\
    \ an experienced poker player can not win at all times.\n\n## 6.6 Iteration 3\n"
