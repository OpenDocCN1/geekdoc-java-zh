    \ which is nothing but a simple cleanup in the code.\n\n## 6.5 Iteration 2\n\n\
    The following algorithms have a parameter of the type *Card[]* that represents\
    \ a player’s cards. It is assumed that the cards are sorted in descending order.\n\
    \nThe first algorithms are used to determine the value of a player’s cards. The\
    \ algorithms are help algorithms used by the other algorithms.\n\n![](image/Java_20_64.jpg)![](image/Java_20_65.jpg)![](image/Java_20_66.jpg)\n\
    \nThere will probably be a need for multiple algorithms of similar kind, and as\
    \ tests of where a sequence of cards may have a certain value, and they will,\
    \ if appropriate, look like the above and will generally be simple.\n\nIn *5 Card\
    \ Stud*, the player with the best open cards must always start the betting round.\
    \ There are 4 betting rounds and an algorithm is defined for each betting round,\
    \ which returns the index for the player to start the betting round. As a parameter,\
    \ the algorithms have an array of the cards to be tested, and it is assumed that\
    \ index 0 always indicates the user’s hand.\n\n![](image/Java_20_661.jpg)![](image/Java_20_67.jpg)![](image/Java_20_68.jpg)\n\
    \nAt showdown, an algorithm is required that returns the index for the player\
    \ who has the highest hand:\n\n![](image/Java_20_681.jpg)\n\nThe last algorithms\
    \ relates to how the virtual player should act in a betting round, for example,\
    \ to say how much the player has to bet (BET), and how much when the player raises\
    \ (RAISE) and where the player should choose CHECK, FOLD and possibly bluff. The\
    \ player in question will make his choice based on his own cards and the other\
    \ players’ open cards. How the player makes his choice is determined from the\
    \ current betting round and hence how many cards the player can see and to make\
    \ it harder to predict the betting, the choice is to some extent random. For each\
    \ betting round there are two situations:\n\n1.  that it is the player who is\
    \ the first or round’s last bet was CHECK, and the player then has four options:\
    \ BE = BET, B+ = BET double, CH = CHECK, FO = FOLD\n\n2.  that a player has already\
    \ bet, and thus has deposited money in the pot, and in this case there are four\
    \ options: RA = RAISE, R+ = RAISE double, CA = CALL, FO = FOLD\n\nFor each bet,\
    \ there are two options, such as CH or BE, but such that the first one is chosen\
    \ with some probability or random. If a situation in the following algorithms\
    \ determines that the player can choose\n\n10, CH, BE\n\nthis means that the player\
    \ randomly chooses CH in 10% of the cases, while in other cases, the player chooses\
    \ BE. This means that it can be difficult to predict what the player bets. The\
    \ following 4 algorithms are all formulated using a five-column table, where the\
    \ first column indicates a condition and the other columns indicates the player’s\
    \ bet for the two situations. The individual rows should be perceived as if/else\
    \ so that if a condition is not met then the next one is tested. Note that the\
    \ virtual player’s action can be fine-tuned by introducing more rows in the tables,\
    \ which will probably also be the case in the implementation, and you should only\
    \ perceive the following as examples of which conditions the algorithm may contain.\n\
    \n![](image/Java_20_69.jpg)![](image/Java_20_70.jpg)![](image/Java_20_71.jpg)![](image/Java_20_72.jpg)![](image/Java_20_73.jpg)![](image/Java_20_74.jpg)![](image/Java_20_75.jpg)![](image/Java_20_76.jpg)![](image/Java_20_77.jpg)![](image/Java_20_78.jpg)![](image/Java_20_79.jpg)![](image/Java_20_80.jpg)\n\
    \nIn connection with the implementation and later when testing, there will certainly\
    \ be changes to the above tables, partly as to which and how many conditions are\
    \ required, and partly as to the probabilities that will be used. If applicable,\
    \ the above tables will not be updated. The game’s value will largely be determined\
    \ by how lucky it is with the implementation of these algorithms and it is actually\
    \ extremely difficult (imposible) to implement the kind of algorithms so that\
    \ an experienced poker player can not win at all times.\n\n## 6.6 Iteration 3"
