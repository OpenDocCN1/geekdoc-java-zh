    and the methods are changed accordingly. Then the classes `OptionsView` and `OptionsPresenter`
    are to be adjusted, which is immediately simple. In the view class there is not
    much to note but the settings must be saved somewhere and it is decided that it
    should be in a file `poker.init` in the user’s home directory and that it should
    be done by simple object serialization. It has been decided that the settings
    should be saved each time they are changed. However, it does have a small problem,
    since JavaFX properties are not immediately serializable. Therefore, a small class
    has been written that encapsulates these properties so that you can serialize
    an object of this class.


    ![](image/Java_20_109.jpg)![](image/Java_20_110.jpg)


    With this class available, it is easy to extend the class `OptionsPresenter` with
    a method that serializes a `PokerOptions` object with the program’s settings when
    clicking on the `OK` button in `OptionsView`. Similarly, the class `Model` is
    expanded with a method `deserialize()`, which, if possible, deserialize a `PokerOptions`
    object and instantiate an `Options` object.


    In terms of error logging, it must occur in a text file called `poker.error` in
    the user’s home directory. The functionality is implemented by the following class:


    ![](image/Java_20_1101.jpg)![](image/Java_20_111.jpg)


    and back is just to call the method `write()` if the functionality is enabled.
    An example could be:


    ![](image/Java_20_1111.jpg)


    which is an error handling in the class `OptionsPresenter`. Back then, the error
    handling has to be implemented, where relevant, which happens in connection with
    the following code review and refactoring.


    ### The user interface


    The user interface should be improved in some places (and can certainly be improved
    in many places). The program, as it is now, runs well on a high resolution display
    (1920 × 1080), but on a screen with significantly lower resolution, there is no
    room for all the cards. The following is primarily about making the user interface
    dependent on the current screen resolution and at the same time depending on the
    current variation of the game.


    The program has two buttons in the top right corner of the window that are used
    to open the dialog boxes for game selection and the settings. These two buttons
    have I moved down to the actual game view, where they are located to the right
    of the top hand.


    ![](image/Image3572.jpg)


    The goal is to save a little space at the top. On the other hand, the change must
    be implemented in all 5 game views. For that in the package `poker.tools`, the
    following component has been added:


    ![](image/Java_20_112.jpg)![](image/Java_20_113.jpg)


    Here you should first notice the parameter of the constructor, which is a `MainPresenter`,
    so that the two buttons can call event handlers in this class. In `MainView`,
    the two original buttons are removed, and the class `MainPresenter` is modified
    accordingly. The above component must be inserted into the 5 game views. It is
    resolved to add the following method to the base class `TableView`


    ```

    ![](image/Java_20_1131.jpg)

    ```


    and the method is then used to insert the component into `Card5View`, which is
    a `BorderPane`:


    ```

    ![](image/Java_20_1132.jpg)

    ```


    Then, the same change must take place in `Card7View`, `TexasView`, `OmahaView`
    and `DrawView`.


    Then I have reduced the font size of the `TextField` components (the class `HandView`)
    that shows the players’ amount and the same applies to the pot. The class `Card5View`
    has a method called `createCenter()` that creates a component for the pot. This
    method I have moved to `TableView` and called it `createPot()`. Next, it must
    be changed in `Card7View`, `TexasView`, `OmahaView` and `DrawView`, and the result
    is that the pot is displayed alike and in the same place (in the middle of the
    window) in all 5 variants.


    Each time the user selects a new game, the method `newGame()` is performed in
    the class `MainPresenter`. When this method is performed, a new view is created,
    and you can customize the window size to the current game. What determines the
    size of a view is primarily the cards, and you can reduce the window size requirements
    by compressing the cards. For that reason, the class `CardView` is expanded with
    4 static variables:


    ```

    ![](image/Java_20_114.jpg)

    ```


    where the first two are constants which indicates the default size of a card.
    The other two variables can be changed if you want to scale the image size and
    they are then used to define the size of a component. They are also used in the
    class `HandView` to define the size of the component for a hand. As a result,
    how much the cards now fill on the screen are determined by the two variables
    `width` and `height`.


    The class `CardView` is additionally expanded with the following static method:


    ```

    ![](image/Java_20_1141.jpg)

    ```


    which is used to initialize the two static variables and calculate the window
    size, where the window is represented by the last `Stage` object. Both parts depend
    on the current screen resolution and the poker variant to be played. The method’s
    first two parameters indicates the screen resolution, while the two next indicates
    how much space that view requires. The next two parameters indicates how much
    space is to be used horizontally and vertically beyond the cards, and thus the
    amount of space there is no need to scale and finally the next two parameters
    indicates the number of cards, respectively, horizontal and vertical. The last
    parameter refers to the window whose size is to be changed.


    The class `MainPresenter` has a method `setSize()` which uses the above method
    to determine the window size:


    ```

    ![](image/Java_20_115.jpg)![](image/Java_20_116.jpg)

    ```


    The method determines the size of the window based on the number of players and
    thus the amount of what the cards filled up corresponding to how many players
    should be presented at the table. It is divided into 2 players, 3 or 4 players
    and 5 or 6 players, and for each division, the size is determined based on the
    current poker variant.


    With the above change, the window adjusts to the current screen resolution. If
    you play `Omaha`, the program opens a dialog at showdown, and this dialog should
    be configured in the same way that it also takes into account the screen resolution.
    It requires that the class `OmahaPresenter` has a `setSize()` method similar to
    the above, but it is much simpler as the dialog always displays 5 cards for each
    hand.


    If you play `Texas Hold’em`, another view opens at showdown, but it is preferable
    to use the same dialog as above. This means that classes `TexasPlayer` and `TexasPresenter`
    need to be changed. In `TexasPlayer`, the method `round4()` is called at the last
    bidding round, which should be adjusted according to the corresponding method
    in `OmahaPlayer`, and in `TexasPresenter`, the dialog must be opened instead of
    the window `ResultView`. Then the two classes `ResultView` and `ResultPresenter`
    can be deleted.


    As a last change regarding the user interface, in *Texas Hold’em* and *Omaha*
    you can not see if a player has folded. To solve this problem, I have added a
    back side card with a different color, then used it to display the cards for a
    player who has folded. For the time being, it is only implemented in connection
    with *5 Card Stud* but it must be implemented for the other variants in connection
    with the following refactoring.


    #### Code review and refactoring


    Next activity is code review combined with refactoring, and that means I’m going
    through all classes and review and adjust the code. It is an extensive work. There
    are 46 classes divided into 3 packages, and the following is a brief overview
    of what has been done. I want to start with the classes in the package *views*
    and the work will therefore indirectly include a test of the application’s user
    interface.

