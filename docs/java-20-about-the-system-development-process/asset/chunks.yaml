  trans: '

    对话框本身由两个类定义：`OptionsView` 和 `OptionsPresenter`。此对话框中的设置应该保存在某处，目前设想是通过在用户主目录中进行对象序列化来实现。然而，该功能尚未实现，因为预计程序之后还会接收其他设置，届时
    `Options` 类和上述对话框将进行相应的扩展。


    使用类似于上一个迭代中 `LogFile` 类的功能来实现日志文件本身是简单的。该类现在已经被删除，并被 `Logfile` 类所取代，该类为要写入的四行中的每一行都包含一个
    `write` 方法：


    ![](img/Java_20_951.jpg)[](image/Java_20_96.jpg)


    在这里你需要注意，程序每向文件写入一行，就会打开并关闭一次文件。其原因是由于默认情况下该功能是禁用的，设计思路是只有当你出于某种原因想要收集程序信息时，才使用该函数。否则，挑战在于将相关的写入操作放在代码的正确位置，然后自然进行测试。


    你需要注意的是，为了将卡牌写入日志，`Hand` 类扩展了一个新方法，该方法针对卡牌返回要写入文件中的文本。


    ## 6.8 迭代 5


    接下来的四个迭代彼此相似，都是关于实现另一种扑克变体，并且原则上将针对另一种游戏重复上述大部分内容。我想从 `7 Card Stud`（七牌休闲）开始，仅仅是因为这种变体看起来非常像
    `5 Card Stud`（五牌休闲）。最重要的区别在于：


    1. 每个玩家有 7 张牌，其中 3 张是底牌，4 张是明牌。

    2. 有 5 轮下注。

    3. 最后两轮下注的玩家分别有 6 张和 7 张牌可选。

    4. 由牌最小玩家开始第一轮下注。


    与 `5 Card Stud` 相比，最大的挑战是：


    1. 实现 `Card7Player` 类作为 `Card5Player` 的替代方案。

    2. 实现用户界面，因为现在必须留出更多卡牌的空间。


    我如下开始最后一项：


    *   创建了两个类 `Card7View` 和 `Card7Presenter`，它们是 `Card5View` 和 `Card5Presenter` 的副本。

    *   修改了 `Card7Presenter` 类，使其实例化一个 `Card7View` 对象而不是 `Card5View` 对象。

    *   更改了 `Game` 类，将属性 `poker` 初始化为值 `CARD7`。

    *   更改了 `MainPresenter` 类中的 `initialize()` 方法，现在为 `CARD7` 增加了一个 case 分目。

    *   在 `Card7View` 类中，我注释掉了显示底池（pot）的行：![](img/Java_20_98.jpg)


    之后，程序再次运行，因此使用了新类 `Card7View` 和 `Card7Presenter` 作为用户界面，并且每个玩家现在都有容纳 7 张牌的空间（容纳卡牌的数量已经在基类
    `TableView` 中实现）。


    然后我修改了 `Card7View` 类，使底池移动到左上角：


    ![](img/Image3543.jpg)


    然后用户界面在原则上就完成了。


    作为下一步，模型扩展了一个新类 `Card7Player`，该类到目前只是 `Card5Player` 类的副本。此外，`Card7Presenter` 类中的构造函数被修改了，使其创建一个
    `Card7Player` 对象。之后，程序可以再次运行，尽管它仍在玩 `5 Card Stud`，但任务现在大幅减少为修改 `Card7Player` 和
    `Card7Presenter` 这类。


    第一步，我在 `Card7Presenter` 类中修改了 `deal()` 和 `deal1()` 方法，现在我可以分发 7 张牌，其中前两张和最后一张是底牌。


    `Card7Player` 类非常复杂，因为关于下注轮的算法需要更改。由于现在多了一个下注轮，基类 `AbstractPlayer` 扩展了两个抽象方法：


    ![](img/Java_20_99.jpg)


    这要求在 `Card5Player` 类中也实现这些方法，在其中它们仅被实现为简单的方法，例如。


    ![](img/Java_20_991.jpg)


    决定由谁开始下注轮的方法很大程度上没有变化，更改主要涉及确定虚拟玩家注额的五个方法。原则上，这些方法的工作方式与 `Card5Player` 中相同，并且基于明牌来确定注额。这主要通过
    `Hand` 类中的方法完成，但由于这次玩家可能有更多的牌（6 张或 7 张），有必要修改 `Hand` 类中的某些方法并添加一些新方法。这些方法对于游戏算法运行至关重要，因此在算法中使用它们之前必须对其进行彻底测试。因此，单元测试的测试类已经过扩展，并添加了一个新的测试方法。之后，就可以按照
    `Card5Player` 中相同的模式实现 `Card7Player` 类中的算法。


    当然，也必须修改 `Card7Presenter` 类。实际上需要更改的内容不多，主要涉及该类现在必须支持 5 轮下注。此外，该类还被更改，以便在比牌（showdown）时显示玩家使用的
    5 张牌。


    观察 `Card7Player` 和 `Card7Presenter` 类，它们包含了许多对应迭代的重复，这意味着某些代码应该移动到基类中。我将此推到迭代
    9 再重构。


    ## 6.9 迭代 6


    作为下一个扑克变体，我将实现德州扑克（Hold’em）。在这里，与 `5 Card Stud` 一样有 4 轮下注，但玩家像 `7 Card Stud` 一样拥有
    7 张牌，其中 2 张是底牌，其余 5 张是桌上的明牌。此迭代的挑战与之前的迭代相似，不同之处在于用户界面会有所不同。


    与上一个迭代相同，我添加了以下类：


    1. `TexasView`，`Card7View` 的副本。

    2. `TexasPresenter`，`Card7Presenter` 的副本。

    3. `TexasPlayer`，`Card7Player` 的副本。


    然后我修改了 `Game` 类，将默认扑克变体设为德州扑克，并扩展了 `MainPresenter` 类中的 `initialize()` 方法。然后程序可以再次运行，并使用上述类作为默认。下一步，修改了
    `TexasView` 类，用户界面如下：


    ![](img/Image3550.jpg)


    其中每个玩家现在有容纳 2 张牌的空间，而桌上有容纳 5 张牌的空间。


    用户界面还有一个额外的挑战，即我必须以某种方式在回合结束后展示玩家的手牌。解决办法是，在比牌阶段后，我用另一个与 `Card7View` 用户界面类似的面板替换掉上面的面板。这是一个相对简单的解决方案，仅需添加另外两个类即可：


    *   `ResultView`

    *   `ResultPresenter`


    然后从 `deal1()` 方法打开窗口。

    '
- fmt: '

    The biggest task is the change of game algorithms in the class `TexasPlayer`.
    The first algorithms that concern which player should start a betting round should
    not be used in this variant of poker, so they are all trivial algorithms. The
    other algorithms that determines a player’s bet are immediately harder to implement
    appropriately, as a player this time only can see quite a few cards. In the first
    betting round, the player can only see his own two closed cards, and the rules
    must therefore be quite simple, quite a few and to a large extent seem random.
    In the other three rounds, the player can see 5, 6 or 7 cards respectively, where
    3, 4 or 5 of the cards are shared with the other players. In the current implementations,
    the algorithms take into account only which cards the current player has, but
    the algorithms can be improved by also taking into account which cards the other
    players can get from the open cards on the table.


    ## 6.10 Iteration 7


    The `Omaha` variant is basically similar to `Texas Hold’em`. The implementation
    includes the following classes:


    1. `OmahaPlayer`, as a copy of `TexasPlayer`

    2. `OmahaView`, as a copy of `TexasView`

    3. `OmahaPlayer`, as a copy of `TexasPresenter`


    Next, the following classes are modified corresponding to the other variants:


    1. `Game`

    2. `MainPresenter`

    3. `OmahaPresenter`, where the parameter to `showResult()`, that is called by
    showdown, must be changed to 9 and then the program runs again, but so the program
    obviously still plays `Texas Hold’em`. However, with regard to the user interface,
    there is a small problem, because the cards in `ResultView` fill up too much.
    The biggest task, however, is to change the game rules in the class `OmahaPlayer`.
    As for who to start the betting rounds there are no changes, as I will apply the
    same rule as for `Texas Hold’em`, where it is always the player after the dealer
    who starts the betting. However, it is a little simplified in relation to the
    real poker world, but I maintain this simple rule as it does not change anything
    in relation to the current program.


    Regarding the algorithms that determines what a player has to bet in a betting
    round, I have used the same rules as in `Texas Hold’em`, but this time there is
    an expansion as to which cards may be used.


    In the first betting round, only two of the player’s four closed cards must be
    selected, giving 6 options. For each of these 6 options, I choose the two cards
    that can lead to the best hand, and on these two cards, the same algorithm is
    used as in `Texas Hold’em`. In the second betting round, two of the player’s closed
    cards must be selected, which in turn gives 6 options and these two cards are
    combined with the three open cards on the table, and I choose the combination
    that results in the highest hand. For this combination, I use the same algorithm
    as in `Texas Hold’em`. The third betting round goes the same way. There are 2
    out of 4 closed cards (6 ways) and then 3 out of 4 open cards (4 ways), giving
    24 combinations. Here the best combination is selected and the same algorithm
    as in `Texas Hold’em` is applied to this combination. Finally, there is the fourth
    betting round where 3 out of 5 open cards are to be selected, what can be done
    in 10 ways. In this case, there are 60 combinations, and again the hand that with
    the highest value is selected.


    At showdown players, who have not folded, should show the cards they have chosen
    and who have won. For each player, it is enough to show 5 out of 9 cards (that’s
    the best hand the player can make) and thus a bit like the `Texas Hold’em` variant,
    but this time I will show the result in a dialog box:


    ![](image/Image3557.jpg)


    Perhaps the `Texas Hold’em` variation should be changed to show the result using
    the same dialog box.


    ## 6.11 Iteration 8


    The last variant is `5 Card Draw`, which is also the simplest variant, as there
    are only two betting rounds, and since the game rules are very simple, a player
    can always only see his own 5 cards. With regard to bets, I want to use the same
    algorithm as in `Texas Hold’em`, but with slightly higher probabilities for higher
    bets. In addition, the first algorithm must be expanded so the players can decide
    which cards to switch. It is based on a very simple algorithm:


    1. If the player has a straight flush, no card is exchanged

    2. If the player has 4 of a kind, no card is exchanged

    3. If the player has a full house, no card is exchanged

    4. If the player has a flush, no card is exchanged

    5. If the player has a straight, no card is exchanged

    6. If the player has 3 of a kind two cards are exchanged

    7. If the player has two pairs, one card is exchanged

    8. If the player has a pair three cards are exchanged

    9. If the player has high card, all cards less than a jack are exchanged


    These rules are simple and even too simple as it is relatively easy for the user
    to figure out which cards the virtual players may have. Therefore, the 4 last
    rules are changed, so the player may exchange a smaller number of cards.


    Finally, the physical player must be able to exchange cards and therefore be able
    to select the cards to be exchanged. This happens when the user clicks on the
    cards that he wants to exchange:


    ![](image/Image3565.jpg)


    In order for the user to click on a card, the class `CardView` has been changed
    so:


    ![](image/Image3566.jpg)


    The variable `clicked` is used to indicate whether a card is clicked, while the
    variable `clickOn` is used to indicate whether this feature is supported. Only
    the poker variant `5 Card Draw` will support this feature, and only in the first
    betting round. In addition, the model class `Hand` is expanded with a variable:


    ![](image/Image3567.jpg)


    so the user can specify which cards to exchange. In the class `DrawPlayer`, the
    method `round1()` called by players in the first betting round is expanded so
    that it initializes the above array with the cards the player wants to exchange
    and finally the class `DrawPresenter` is expanded to `deal()`.


    ## 6.12 Iteration 9


    It is the final iteration. In relation to the planning, the iteration has changed
    a bit, but includes:


    1. the program’s options

    2. the user interface

    3. code review and refactoring

    4. an installation script


    It’s a relatively big job and I want to start with a code review of the following
    types:


    * The program uses 5 enumerations: `CardColor`, `CardValue`, `PokerValue`, `PokerGames`
    and `PokerBets`.

    * The classes `Card` and `Cards`, that are simple classes but classes that could
    be used in other applications.

    * The class `Game` where there are no changes. In the review of this class, I
    have also seen the classes `GameView` and `GamePresenter`, for which there are
    no changes either.


    ### The program’s options


    Up to this place there are two options:


    1. The directory to be used for the application’s log file when logging the individual
    game rounds.

    2. Where this functionality is disabled or enabled.


    It has been decided to expand with two new options. A player can RAISE twice in
    the same betting round and three times in the last betting round. It has been
    decided that it should be an option so that a player at the first betting rounds
    can RAISE 1, 2, 3, 4 or 5 times while the player at the last betting round can
    RAISE one more time. Finally, it has been decided that the program should have
    the option of error logging, and whether this feature is enabled or disabled must
    also be an option.


    Similarly, the class `Option` is expanded with two new properties:


    ![](image/Image3568.jpg)

