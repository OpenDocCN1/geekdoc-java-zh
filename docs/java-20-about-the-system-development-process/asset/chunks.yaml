  trans: '


    现在 SCRUM 并不总是正确的方法，为了让 SCRUM 产生意义，项目规模必须合理，并且是一个应该由开发团队解决的项目。此外，它通常是一个具有许多不确定性和复杂性特征、并且需要敏捷方法的项目，但如果一个项目在某种程度上具有这些特征，SCRUM
    已经证明了自己是一种有效的项目管理方法。


    ## SCRUM 中的元素


    基本上，SCRUM 的原理是将项目划分为一系列小型的迭代，这些迭代被称为 `sprints`（冲刺）。起点是已经决定要开发一个系统（在书中是一个应用程序），并且任务经理或客户已经对开发的系统的含义有了相对准确的理解。项目从开发两份文档开始：


    1. `愿景声明（Vision Statement)`，对项目目标进行简要描述，在项目执行过程中，这将帮助项目团队关注任务经理视角来看的重要事项。

    2. `产品路线图（Product Map)`，这是一个关于重要子产品交付时间的介绍性计划表。


    项目过程分为两个阶段，分别称为


    1. `冲刺准备（Pre-sprints）`

    2. `时箱活动（Timeboxed activities）`


    你可以将第一阶段视为规划，第二阶段视为生产，但大部分时间是在最后阶段使用的。事实上，“阶段”并不是准确的词汇，因为你不是处于某一个阶段或另一个阶段之间，而是一切都从
    `pre-sprints` 开始，之后你执行一系列冲刺，并最终（通常）回到冲刺准备阶段。你通常用类似下面的图来勾勒 SCRUM：


    ![](img/Image1806.jpg)


    在冲刺准备期间，重点在于注入用户需求并将其描述为待解决的任务。这些描述被称为“故事（stories）”。结果通常是一个巨大的故事集合，被称为 `产品待办列表（Product
    Backlog）`。通常在开始单个冲刺之前你不需要完成产品待办列表，一旦你发现收集了足够的信息使得某些故事已经描述清楚，就可以开始第一次冲刺了。目标是完成一些端用户可以联系和评估的东西，然后返回冲刺准备阶段并可能更新产品待办列表。


    看看冲刺阶段，它包含了每个冲刺的冲刺计划（sprint planning），在会议上，你计划将产品待办列表中的故事转移到 `冲刺待办列表（Sprint Backlog）`，从而在随后的冲刺中处理哪些故事。一个冲刺被安排持续特定的时间，时间可能有所不同，但通常持续约
    4 周，建议一个冲刺时间不要超过一个月。团队将选定的故事拆分为任务，然后将其分配给团队成员。在冲刺期间，每天举行名为 `每日 Scrum（Daily Scrum）`
    的会议，每个团队成员简要汇报与当前任务相关的进展（或反之）。这些每日 Scrum 是短会，可能花费 15 分钟。冲刺结束时，会举行一个名为 `冲刺演示（Sprint
    Demo）`（或 `冲刺评审`）的会议。会议与任务经理一起举行，团队展示当前冲刺的结果，即各个故事是如何解决的。整个冲刺以 `Scrum 回顾` 结束，这是一次回顾冲刺的会议，团队回顾过程以进行改进。


    在 SCRUM 项目中有三个角色（可能没有其他角色），这些角色由 Scrum 团队完成：


    1. `产品所有者（Product Owner)`，一个全职或兼职参与项目的人，代表项目内部所锚定的业务领域。

    2. `Scrum 师（Scrum Master)`，一个全职或兼职参与项目的人，是开发团队的教练和协调者。

    3. `开发团队（The Development Team)`，由 3–9 名全职员工（也称为专家）组成，是开发组织的一部分，执行各个冲刺。


    此外，可能还有其他利益相关者，他们通常代表客户或其组织。


    假设团队满足两个基本假设，这些假设被认为是确保灵活性、创造力和生产力所的，也是敏捷环境所必需的：


    1. 团队是自组织的，并且在没有外部明确领导的情况下规划自己的工作。团队中的一个或多个人负责管理，而其他参与者专门负责特定的专家活动，但在 SCRUM 中没有管理和专家职能的划分。

    2. 团队参与者都拥有解决任务所需的所有专业知识和能力，不需要从外部寻求帮助。


    ## 产品所有者（The Product Owner）


    任何项目都需要一个熟悉业务领域的人员，其任务是使团队产出的价值最大化，这个人就被称为 `产品所有者（Product Owner）`。通常，这个人来自开发组织。重要的是，产品所有者必须了解问题领域，但此人不需要关于系统开发的特殊知识。是
    `产品所有者` 负责项目的产品待办列表，这是一份待解决故事的优先级列表，它是 SCRUM 中的核心规划工具。故事根据其对用户组织的价值进行优先级排序，以便先解决高质量的故事。同样由
    `产品所有者` 负责确保每个用户故事对于 Scrum 团队和其他利益相关者来说都是易理解的。


    是 `产品所有者` 与任务所有者用户组织通信，并利用这些信息更新项目的产品待办列表。也是 `产品所有者` 掌握项目进度，并向利益相关者更新截止日期。


    整个组织必须尊重产品所有者的决策，这被认为是项目成功的先决条件。即使产品所有者的上级通常也不能纠正产品所有者的决策，除了产品所有者，没有其他人可以决定开发团队应该交付什么。但是，允许产品所有者委托决策（例如向产品待办列表添加项目），只要产品所有者拥有全局视图。


    ## Scrum 师（Scrum Master）


    `Scrum 师` 的任务是通过教练他们并确保遵守所有 SCRUM 原则来协助 Scrum 团队。因此，Scrum 师必须对 SCRUM 及其原则有深入了解。这是一个管理职能，但不是项目经理。Scrum
    师将引导 Scrum 过程，而不是领导 Scrum 团队。除了确保开发团队正确理解和使用 Scrum 外，`Scrum 师` 的任务还是消除开发团队的障碍，减轻日常生活并通常对参与者进行教练。


    Scrum 师还必须支持产品所有者向项目利益相关者传递正确信息，并通常为产品所有者提供可用的专家知识。


    允许一个人既担任 `Scrum 师` 又担任 `开发团队` 成员，但不建议这样做。


    ## 开发团队（The Development Team）


    '
- fmt: '

    Members of the `Development Team` are IT experts and are responsible for delivering
    solutions to the elements of the backlog. Members generally have knowledge to
    do everything from A to Z in connection with the development of a task from the
    backlog, and they must be able to work independently themselves, and be able to
    solve the challenges that arise. One assignment can be awarded to a particular
    member through a sprint, but the entire `Development Team` is responsible and
    accountable for the task and there is thus no single person who owns a particular
    task.


    The `Development Team` delivers the finished product developed through an iterative
    process managed by the project’s Product Backlog. It is highly recommended that
    team members work full-time on the current project, and efforts should be made
    that the `Development Team` members not being replaced along the way, as it is
    considered important to ensure that members are focused and agile.


    Experience has shown that `SCRUM` is most effective with a `Development Team`
    of 3–9 members, but for large projects it is possible to establish more `Scrum
    Teams`.


    It is important to note that members of the `Development Team` do not have titles,
    such as designers, architects, managers, etc. Everyone must have the same role,
    and the title is only a member of the `Development Team`. The whole idea behind
    `SCRUM` is team work. The reason is that the members will otherwise focus on their
    own roles and not sufficiently focus on the finished product. Each member is responsible
    for all project results.


    #### The sprints


    Then there is the content of the individual sprints, where the actual system development
    takes place. A system development project managed by `SCRUM` solves the task through
    a number of iterations, called sprints, where a sprint is time-boxed and takes
    a certain period of time. A sprint contains 4 activities:


    1. `Sprint Planning` is the first activity in a sprint, where the `Scrum Team`
    plans what will be the result of the sprint and what to deliver.

    2. `Daily Scrum`. The `Development Team` starts the work immediately after `Sprint
    Planning` is completed. During the sprint, the `Development Team` keeps daily
    meetings, called `Daily Scrum`. It is a short meeting of approximate 15 minutes
    where the work for the next 24 hours is coordinated. As part of `SCRUM` it is
    recommended that these meetings be held standing.

    3. `Sprint Review`. Before the sprint finishes, the `Development Team` presents
    the sprint’s results for the user organization and retrieves feedback.

    4. `Sprint Retrospective`. After `Sprint Review` and as the last in the sprint,
    the `Development Team` holds an internal meeting as a kind of review of the sprint
    in order to learn from the course.


    Time boxing is considered to be central to `SCRUM`, and is the means to ensure
    that things are done, and for a project, each sprint should generally have the
    same fixed length. The length of a sprint is typically about one month, but may
    be shorter, but hardly for a week. The product is finished after a number of (and
    possibly many) sprints, and each sprint brings the product a step toward the finished
    result. If the result of a sprint is a potentially releasable part of the finished
    product (what to aim for is the result of each sprint), it is said that an `increment`
    has been reached, and an increment is thus the sum of all the elements in `Product
    Backlog`, which has been completed so far in the project. One can therefore consider
    each increment as an update of the previous increment and an extension of the
    product with new functions and features. An increment may not be applied, but
    in case of an increment, it should be possible.


    Typically, an increment (result of `Sprint Review`) requires changes, and they
    will then be added `Product Backlog` as new stories.


    Each story in the `Product Backlog` should usually be developed in a single sprint,
    as it makes it much easier to keep an overview. `Product Owner` and the `Development
    Team` selects a number of stories from `Product Backlog` for each sprint, with
    the goal of getting them completely completed in the upcoming sprint, so after
    the sprint the team has a new increment. It is therefore important that from the
    start you have decided when a story has been completed.


    #### Sprint Planning


    `Sprint Planning` is a time-boxed meeting, where all team members participate
    as a starting point. If it is a sprint of 4 weeks, the meeting may last 8 hours,
    but at short sprints the meeting will be shorter. Participants in the `Development
    Team` will estimate how many hours they can deliver in the sprint. Prior to that,
    the `Product Owner` prioritized the individual elements of the project’s `Product
    Backlog` and ensured that each story is easy to understand. The `Development Team`
    then selects an appropriate number of items from the top of `Product Backlog`
    and moves them to `Sprint Backlog` as the work to be performed in the current
    sprint. The work for each story is estimated by the `Development Team` and the
    total work for `Sprint Backlog` tasks should as best as possible correspond to
    the capacity available to the team.


    Then, a `Sprint Goal` is written, which is nothing else a short text describing
    the target of the current sprint, including what are the criteria for the sprint
    to finishing and what the tasks are solved. `Sprint Goal` must also contain at
    least a detailed plan for the first days of the sprint. `Sprint Goal` is part
    of `Sprint Backlog`, and there are no special requirements for documentation or
    form, and often a board is used, which makes it easy to maintain the plan, and
    ensure that the plan is visible to everyone. `Sprint Backlog` is thus made up:


    1. `Sprint Goal`

    2. The stories selected from `Product Backlog` for the current sprint.

    3. A detailed work plan for the sprint, where the tasks (stories) can be categorized
    as `To Do`, `Doing` or `Done`.


    In principle, a sprint can not be interrupted, but `Product Owner` may, as a sole
    exception, decide to interrupt a sprint typically caused by events/changes in
    the project’s environments/prerequisites.


    #### Daily Scrum


    As its name says, it is a daily meeting held throughout the sprint period. At
    the meeting, only members of the development team participates. The meeting lasts
    no more than 15 minutes, and at this meeting each team participant must answer
    three questions:


    1. What has been completed since the last meeting?

    2. What will be done before next meeting?

    3. What obstacles/difficulties are there?


    Team members must compare the progress with the `Sprint Goal`, but should also
    estimate the likelihood that a task will be completed before the sprint is complete.


    #### Sprint review


    It is a meeting to be held at the end of a sprint and the meeting will take for
    a sprint of 4 weeks max 4 hours, but for a shorter sprint the meeting will usually
    be shorter. The meeting includes the entire Scrum team but also other stakeholders,
    and at the meeting the solution of all tasks from the current sprint are presented.
    The goal is to get feedback and as early as possible to adjust the requirements
    so `Product Owner` can update the project’s `Product Backlog`.


    It is the `Development Team` that presents the product, but only for tasks that
    are `Done` and not for tasks that are “almost” Done. It is the `Product Owner`
    who before the meeting must ensure that the products presented also are `Done`.


    At the end of the whole sprint, another meeting called `Sprint Retrospective`
    is held, which is a meeting of 2–3 hours. It is a meeting where you look back
    on the sprint for improvements, and it applies to both the working procedures
    for the individual team participants, processes and the tools that you use.


    #### More about SCRUM

