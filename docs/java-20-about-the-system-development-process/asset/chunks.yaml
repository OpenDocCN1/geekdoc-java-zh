    \ Should it happen, it is assumed that the game is ignored, but the pot will remain\
    \ to the next round.\n\n#### 5 Card Stud\n\nAs mentioned, it is a simplified game\
    \ with four betting rounds and the procedure is as follows:\n\n1.  Each player\
    \ pays a blind to the pot.\n\n2.  Each player receives a closed card and an open\
    \ card. Following is the first betting round where the player with the highest\
    \ open card starts.\n\n3.  Players who have not yet folded their cards now receive\
    \ a third open card and a new betting round (a 2nd betting round) begins where\
    \ the player with the best combination of the two open cards starts.\n\n4.  A\
    \ fourth card is given with the face up and another betting round (a 3rd betting\
    \ round) takes place according to the same pattern as the previous betting round.\n\
    \n5.  A fifth and last open card is given to the remaining players in the game\
    \ and the last betting round takes place according to the same pattern as the\
    \ previous two.\n\nIf there are two or more players who have not yet thrown their\
    \ cards after the last betting round, the winner will be settled at a showdown,\
    \ otherwise the remaining player will win the pot.\n\n## 6.3 The process\n\nThe\
    \ development is planned to include the following iterations:\n\n1.  iteration\n\
    \n    Development of prototype for *5 Card Stud*. The purpose is primarily to\
    \ get started, including the preparation of a preliminary design of the user interface.\
    \ You should not be able to complete a hole round, but you should be able to deal\
    \ the first two cards so that all the technical regarding showing the cards is\
    \ in place.\n\n2.  iteration\n\n    An algorithm must be developed for how a virtual\
    \ player should play *5 Card Stud*. The algorithm should include\n\n    *   how\
    \ the virtual player should act in a betting round, for example, how much the\
    \ player has to bet (BET of BIG BET), when the player has to raise (RAISE or BIG\
    \ RAISE) and when the player should choose FOLD and possibly bluff\n\n    *  \
    \ who should start a betting round\n\n    *   who wins at showdown\n\n    In addition,\
    \ the iteration must include an algorithm for how the individual betting rounds\
    \ should proceed depending on whether it is the user or a virtual player who starts\
    \ the betting round.\n\n3.  iteration\n\n    The overall design of the program’s\
    \ classes, which includes important decisions for which classes the program should\
    \ primarily consist of.\n\n    Implementation of the poker variant *5 Card Stud*.\
    \ The iteration thus includes implementation of all algorithms from iteration\
    \ 2\\. After this iteration, you should be able to play poker with the program,\
    \ but only the simple *5 Card Stud* variant and there should be no user administration.\n\
    \n4.  iteration\n\n    The Iteration includes decisions and designs regarding\
    \ how to save the program’s data and what data to save. It is decided that data\
    \ should be stored in common files, partly because it should be simple to install\
    \ the program, and partly because data is not critical, which means that the program’s\
    \ vision is merely entertainment. It also includes the design and implementation\
    \ of the classes that are necessary for users’ accounts.\n\n    Finally, the iteration\
    \ must include an extension of the version from iteration 3 extended with login,\
    \ including the maintenance of users and their accounts.\n\n    The iteration\
    \ must also implement the user dialog to start a new game.\n\n5.  iteration\n\n\
    \    Implementation of the variant *7 Card Stud*. It includes new algorithms corresponding\
    \ to the algorithms developed for *5 Card Stud*, but it is expected that these\
    \ algorithms will substantially resemble the algorithms from iteration 2, and\
    \ part of the algorithms may be used directly. In addition, the iteration will\
    \ include a change of the user interface corresponding to the fact that each player\
    \ now has more cards.\n\n6.  iteration\n\n    Implementation of *Texas Hold’em*.\
    \ In the same way as in iteration 5, this iteration includes implementation of\
    \ new game algorithms, as well as developing a new user interface.\n\n7.  iteration\n\
    \n    Implementation of *Omaha*. It is perceived as a simple iteration, which\
    \ is primarily a matter of modifying the result of iteration 6.\n\n8.  iteration\n\
    \n    Implementation of *5 Card Draw*. It is the last variation of the game, and\
    \ after this iteration, the program is in principle complete. The iteration includes\
    \ new algorithms corresponding to *5 Card Draw*, including where the virtual players\
    \ must make decisions as to which cards they wish to exchange. In addition, the\
    \ variant requires the user interface to change.\n\n9.  iteration\n\n    This\
    \ iteration includes improving the user interface, including colors and fonts.\
    \ Optionally, a form of settings must also be implemented.\n\n    The iteration\
    \ also includes a code review and refactoring.\n\n    Finally, the iteration must\
    \ include the development of an installation script as well as an icon for the\
    \ program.\n\n#### Challenges and risks\n\nIn principle, it is a relatively simple\
    \ program corresponding to the fact that it is a standalone windows program, and\
    \ it is thus well known how the task should be solved. However, there are two\
    \ challenges to the program where the solution is not clear and both are crucial\
    \ to the success of the program and whether there are users who wish to use the\
    \ program:\n\n1.  The user interface must be nice and appealing – whatever it\
    \ may be. In addition, the user interaction must be easy and intuitive.\n\n2.\
    \  The virtual player must be implemented with a sensible behavior and as a player\
    \ you can not immediately win over. It must be difficult (impossible) to figure\
    \ out how the virtual player acts.\n\n## 6.4 Iteration 1"
