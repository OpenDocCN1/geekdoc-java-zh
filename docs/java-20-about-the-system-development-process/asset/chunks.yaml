    test, however, such that the weight changes through the course, where an iteration
    during elaboration largely focuses on analysis and design while the tasks under
    construction at most emphasis on programming and test.


    #### Inception


    This phase will usually consist only of a single iteration. It is a start-up phase
    where you must analyze what it is for a task to be solved. It is not the goal
    to prepare a completed requirement specification, but inception is a short phase
    in which you analyze critical requirements and determine the basic visions of
    the system. You should not try to make a detailed list of as many system requirements
    as possible. A risk analysis for the development of the system must be carried
    out and a decision must be made whether or not to complete the project. The objective
    is:


    *   to gain an understanding of what it is for a system to be developed


    *   describing the most important functions, and often as use cases


    *   to develop an overall design of the system’s architecture


    *   to develop a development plan for the subsequent phases, including identifying
    the project’s costs and risks


    Any system development starts with an idea that is presented to the person(s)
    to solve the task. During the inception phase there will be relatively few people.
    The system development project starts with the presentation of the idea, and the
    phase will provide guidelines for how the system development group comes from
    idea to the completed solution that the task manager (the customer) can apply.


    The first phase is a clearing phase and is a short phase and is typically performed
    as a single iteration. How long does of course depend entirely on the specific
    task, and maybe the phase lasts only a few days, and I find it hard to imagine
    an inception phase that spans more than a few weeks. During the start, the project
    team must clarify the following:


    *   What is the task going on?


    *   What is the technical platform?


    *   What risk factors are there?


    *   What is the time horizon?


    *   What resources are required?


    *   How is the project plan?


    *   What are the criteria for the task being solved?


    The result of the inception will typically be:


    *   A task formulation


    *   A requirement specification


    *   One or more prototypes


    *   Attachments


    *   Conclusion


    A task formulation is a text document organized in relation to the relevant of
    the above headings. The aim is to keep the assignment form brief and accurate,
    and the task formulation is perceived as a document that is continuously updated
    after each of the following iterations.


    As mentioned, it is not a goal to prepare a final requirement specification during
    the inception phase, but you will start it. Often you choose one or a few of the
    issues that the system will solve and start formulating the requirements. This
    is typically done in the form of use cases, and it is even said that the unified
    process is use case driven. During start-up, focus will be on the most central
    issues and the issues with the greatest risks.


    The task formulation may be supplemented by one or more prototypes that should
    indicate to the task manager the important decision regarding the finished project’s
    user interface. Often it is a good idea to have important decisions regarding
    the user interface in place before continuing with the next phases.


    Finally, the inception may include attachments or references to sources that are
    important for the following system development.


    The inception phase concludes with a conclusion where the system developers emphasize
    the consequences of continuing the project, and possibly highlighting proposals
    for adjustments. If the result becomes a decision that the project is to proceed,
    a project plan is prepared, including a planning of the first iterations during
    elaboration.


    #### Elaboration


    In this phase, one or more iterations are performed (and usually there will be
    more and maybe many), in which it will develop a part of the overall system in
    an iteration. One can thus think of an iteration as a mini development project,
    and the result will basically be a program (a product) that the task manager can
    test. One can think of an iteration as a development process that brings the entire
    project from one state to another.


    An iteration should take shortly in time, but vice versa, it should also be so
    extensive that the customer experiences progress. An iteration length is determined
    of the current project, but the time frame will typically be from 2 to a few weeks.
    Of course, the number of iterations will also be determined by the scope of the
    project, and in small projects, there will in principle only be a single iteration,
    but if you use a unified process, there will usually be more.


    As mentioned, an iteration is a development process, and it will consist of


    1.  analysis


    2.  design


    3.  programming


    4.  test'
