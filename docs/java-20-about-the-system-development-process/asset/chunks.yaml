    are prioritized in terms of their value for the user organization, so that high-quality
    stories are solved first. It is also the Product Owner who is responsible for
    that each user story being easy to understand for the Scrum Team and other stakeholders.


    It is Product Owner who communicates with the task owner and user organization
    and uses this information to update the project’s Product Backlog. It is also
    the Product Owner who has an overview of the progress in the project and keeps
    the project stakeholders updated with regard to the final end date.


    The entire organization must respect Product Owner decisions, which is considered
    a prerequisite for the success of the project. Even Product Owner’s chief may
    not generally correct Product Owner decisions, and no one other than Product Owner
    may decide what the development team is supposed to deliver. However, it is permitted
    for the Product Owner to delegate decisions to the Development Team, such as adding
    items to Product Backlog, as long as the Product Owner has the full overview.


    #### Scrum Master


    *Scrum Master*’s task is to assist the Scrum Team by coaching them and ensuring
    that all principles of SCRUM are respected. Scrum Master must therefore have in-depth
    knowledge of SCRUM and the principles of the method. It is a management function,
    but it is not a project manager. Scrum Master will lead the SCRUM process, but
