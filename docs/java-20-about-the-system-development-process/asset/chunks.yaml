    I will not go into the content of the method and just refer to the book `Java
    7`, but for smaller and well-defined tasks, the method is still interesting and
    can be used very well. Several have tried to improve the method, primarily by
    incorporating ideas from other system development methods and one version of the
    waterfall model can be found in the literature described as the waterfall model
    with feedback, which is an attempt to formally integrate iterative system development
    into the waterfall model, what it in the principle does not support. Whatever
    you do, the waterfall model for large complex IT systems will never be the right
    system development method. Here, instead, you have to use one of the agile system
    development methods described below.


    ## 2.3 Unified Process


    `Unified Process` is an object-oriented system development method, but in the
    literature, the method is often termed the `Rational Unified Process`, which is
    a further development of the original method. It is an iterative system development
    method, solving the current task by working iteratively towards the solution through
    4 phases:


    1.  Inception

    2.  Elaboration

    3.  Construction

    4.  Transition


    One has the greatest success with unified process as a method for larger projects,
    where the task is relatively well-defined and where the project is associated
    with more developers. In many ways, the method can be seen as an alternative to
    the waterfall model, recognizing that this method is not suitable for the development
    of large and complex IT solutions. It is an iterative method in which the task
    is solved through a number of iterations, and one can reasonably perceive each
    iteration as the partial solution implemented after the waterfall method.


    The unified process is also an agile system development method, and thus a method
    where the goal is quickly to deliver value solutions for the customer, and at
    the same time after customer’s testing of the delivered sub-solutions, it can
    easily and accurately adjust the requirements according to the customer’s wishes.
    All modern systems development methods today are call agile, and it is perhaps
    not much more than an observation that today’s IT systems are far larger and more
    complex than before.


    I do not want to review the method in detail, but I strongly recommend reading
    a book or something that presents the method and provides instructions on how
    the method can be used in practice.


    As mentioned, the method comprises 4 phases, and each phase is performed as a
    number of iterations. How many iterations to be in the individual phases depend
    on how complex the task is, but the whole idea is, that each iteration should
    not take too long. It is recommended that an iteration should have a deadline
    of not more than a few weeks, but conversely, iteration should not be too short
    and should at least take several weeks. Before starting an iteration, you have
    to define which tasks are to be solved. These tasks depend on the phase, but in
    principle, each iteration can include tasks in analysis, design, programming and
    test, however, such that the weight changes through the course, where an iteration
    during elaboration largely focuses on analysis and design while the tasks under
    construction at most emphasis on programming and test.


    ### Inception


    This phase will usually consist only of a single iteration. It is a start-up phase
    where you must analyze what it is for a task to be solved. It is not the goal
    to prepare a completed requirement specification, but inception is a short phase
    in which you analyze critical requirements and determine the basic visions of
    the system. You should not try to make a detailed list of as many system requirements
    as possible. A risk analysis for the development of the system must be carried
    out and a decision must be made.


    The result of inception will typically be:

    *   A task formulation

    *   A requirement specification

    *   One or more prototypes

    *   Attachments

    *   Conclusion


    The inception phase concludes with a conclusion where the system developers emphasize
    the consequences of continuing the project, and possibly highlighting proposals
    for adjustments. If the result becomes a decision that the project is to proceed,
    a project plan is prepared, including a planning of the first iterations during
    elaboration.


    ### Elaboration


    In this phase, one or more iterations are performed (and usually there will be
    more and maybe many), in which it will develop a part of the overall system in
    an iteration. One can thus think of an iteration as a mini development project,
    and the result will basically be a program (a product) that the task manager can
    test. One can think of an iteration as a development process that brings the entire
    project from one state to another.

