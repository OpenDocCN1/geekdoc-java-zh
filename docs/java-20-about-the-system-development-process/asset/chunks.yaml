    `Development Team` 的成员是 IT 专家，负责为待办列表（backlog）中的元素交付解决方案。成员通常具备与待办列表任务开发相关的 A
    到 Z 的所有知识，并且必须能够独立工作并解决出现的挑战。某项任务可以在某个迭代（sprint）中分配给特定成员，但整个 `Development Team`
    对该任务承担责任并问责，因此没有某个人拥有特定的任务。


    `Development Team` 交付通过项目产品待办列表（Product Backlog）管理的迭代过程开发的完工产品。强烈建议团队成员全职投入当前项目工作，并应尽可能确保
    `Development Team` 成员在过程中不被更换，因为确保成员的专注和敏捷是非常关重要的。


    经验表明，`SCRUM` 在拥有 3–9 名成员的 `Development Team` 中效果最显著，但对于大型项目，可以建立更多的 `Scrum Teams`。


    注意的是，`Development Team` 的成员没有像设计师、架构师、经理之类的头衔。每个人都必须拥有相同的角色，头衔仅仅是 `Development
    Team` 的成员。`SCRUM` 的核心理念是团队合作。这是因为否则成员们将专注于自己的角色，而不会充分关注完工产品。每位成员都对所有项目结果负责。


    #### 迭代 (The sprints)


    然后是单个迭代的内容，即实际系统开发发生的地方。由 `SCRUM` 管理的系统开发项目通过多次迭代（称为 sprints）来解决任务，每个迭代都是时间限制的，并持续特定的时期。一个迭代包含
    4 项活动：


    1. `Sprint Planning`（迭代计划）是迭代中的第一项活动，`Scrum Team` 在此处计划迭代的结果以及要交付的内容。

    2. `Daily Scrum`（每日站会）。`Development Team` 在 `Sprint Planning` 完成后立即开始工作。在迭代期间，`Development
    Team` 举行名为 `Daily Scrum` 的每日会议。这是一个大约 15 分钟的短会，用于协调未来 24 小时的工作。作为 `SCRUM` 的一部分，建议这些会议站立进行。

    3. `Sprint Review`（迭代评审）。在迭代结束之前，`Development Team` 向用户组织展示迭代结果并获取反馈。

    4. `Sprint Retrospective`（迭代回顾）。在 `Sprint Review` 之后并作为迭代的最后一项，`Development Team`
    召开内部会议，对迭代过程进行某种回顾，以便从中学习。


    时间箱模型（Time boxing）被认为是 `SCRUM` 的核心，是确保事情完成的手段，且对于项目而言，每个迭代通常应该具有相同的固定长度。迭代的长度通常约为一个月，可以更短，但很难只有一周。产品在经过若干次（可能是很多次）迭代后完成，每个迭代都让产品向完工结果迈进一步。如果一个迭代的结果是完工产品中一个可能发布的部分（这是每个迭代的目标），则称为达到了
    `increment`（增量），因此，增量是项目到目前为止在 `Product Backlog` 中完成的所有元素的总和。因此，可以将每个增量视为对上一个增量的更新，以及带有新功能和特性的产品扩展。增量可能不被应用，但如果有增量，应该是可能的。


    通常情况下，一个增量（`Sprint Review` 的结果）需要更改，这些更改将作为新的故事（stories）被添加到 `Product Backlog`。


    `Product Backlog` 中的每个故事通常应在单个迭代中开发，这样更容易保持整体视图。`Product Owner` 和 `Development
    Team` 为每个迭代从 `Product Backlog` 中选择若干故事，目标是在接下来的迭代中将其完全完成，以便在迭代结束后团队拥有一个新的增量。因此，从开始就决定好何时完成一个故事是至关重要的。


    #### 迭代计划 (Sprint Planning)


    `Sprint Planning` 是一个时间限制的会议，所有团队成员都参与作为起点。如果是一个 4 周的迭代，会议可能持续 8 小时，但在短周期迭代中，会议时间会更短。`Development
    Team` 的参与者将估计他们在迭代中可以交付多少小时的工作。在此之前，`Product Owner` 对项目 `Product Backlog` 中的单个元素进行了优先级排序，并确保每个故事都易于理解。然后，`Development
    Team` 从 `Product Backlog` 顶部选择合适数量的项，并将它们移动到 `Sprint Backlog`（迭代待办列表），作为当前迭代中要执行的工作。每个故事的工作由
    `Development Team` 估算，`Sprint Backlog` 任务的总工作量应尽可能与团队的可用容量匹配。


    然后，会编写一个 `Sprint Goal`（迭代目标），它仅仅是一段描述当前迭代目标的短文本，包括迭代完成的标准以及解决了哪些任务。`Sprint Goal`
    必须包含至少一个针对迭代前几日的详细计划。`Sprint Goal` 是 `Sprint Backlog` 的一部分，对文档或格式没有特殊要求，通常使用看板，这使得计划易于维护，并确保计划对所有人可见。`Sprint
    Backlog` 因此由以下部分组成：


    1. `Sprint Goal`

    2. 为当前迭代从 `Product Backlog` 中选出的故事。

    3. 迭代的详细工作计划，其中任务（故事）可以被分类为 `To Do`（待办）、`Doing`（进行中）或 `Done`（已完成）。


    原则上，迭代不能被中断，但 `Product Owner` 作为唯一的例外，可以决定由于项目环境/先决条件变化引起的迭代中断。


    #### 每日站会 (Daily Scrum)


    正如其名，它是整个迭代期间举行的每日会议。在会议上，只有开发团队成员参与。会议持续不超过 15 分钟，在会议上每个团队参与者必须回答三个问题：


    1. 自上次会议以来完成了什么？

    2. 在下次会议之前将完成什么？

    3. 有哪些障碍/困难？


    团队成员必须将进度与 `Sprint Goal` 进行比较，还应估计在迭代结束完成任务的可能性。


    #### 迭代评审 (Sprint review)


    这是一个在迭代结束时举行的会议，对于 4 周的迭代，会议最多持续 4 小时，但对于较短的迭代，会议通常更短。会议包括整个 Scrum 团队以及其他利益相关者，在会议上展示当前迭代所有任务的解决方案。目标是尽早获取反馈并调整需求，以便
    `Product Owner` 更新项目的 `Product Backlog`。


    产品是由 `Development Team` 展示的，但仅针对已 `Done` 的任务，而不是那些“几乎”完成的任务。`Product Owner` 必须在会议前确保所展示的产品也是
    `Done` 的。


    在整个迭代结束后，还会举行另一次名为 `Sprint Retrospective` 的会议，持续 2–3 小时。这是一次对迭代进行回顾以寻求改进的会议，适用于个人团队成员的工作程序、流程以及你们所使用的工具。


    #### 关于 SCRUM 的更多信息


