    As mentioned, the method comprises 4 phases, and each phase is performed as a
    number of iterations. How many iterations to be in the individual phases depend
    on how complex the task is, but the whole idea is, that each iteration should
    not take too long. It is recommended that an iteration should have a deadline
    of not more than a few weeks, but conversely, iteration should not be too short
    and should at least take several weeks. Before starting an iteration, you have
    to define which tasks are to be solved. These tasks depend on the phase, but in
