    # Poul Klausen


    # Java 20: 关于系统开发过程


    ## 软件开发


    Java 20: 关于系统开发过程：软件开发


    第一版


    © 2018 Poul Klausen & bookboon.com


    ISBN 978-87-403-2669-7


    Ove Thomsen (EA Dania) 同行


    # 前言


    这是关于 Java 软件开发系列书籍中的最后一本书。本书关注系统开发中的过程，并主要与大型系统开发项目相关。此外，书中介绍了三种具体的系统开发方法：`Unified
    Process`（统一过程）、`SCRUM` 和 `Extreme Programming`（极限编程）。此外，还描述了现代系统开发中许多其他活动和技术，无论人们是否使用某种特定方法都是如此。在你读完这
    20 本关于 Java 系统开发的书籍并完成了所有的练习和任务后，你可能还不能称自己为专业的 Java 开发人员。这只能通过经验来获得，但你拥有了良好的基础，并已经准备好加入专业的软件开发团队。软件开发人员没有所谓的“毕业”，因为总会有新版本的产品和方法需要你学习，但我希望这些书籍能提供良好的基础。并不是所有内容都涵盖了，要么是因为空间不足，要么是被遗漏，而且某些内容可能已经过时，也许未来的版本可以修复这些问题，但如果真的发生了，我还是回到起点：某些东西没有出现而另一些过时了。软件开发永远不会停止。


    正如标题所示，系列书籍涉及软件开发，目标是教读者如何用 Java 开发应用程序。可以通过阅读相关主题和学习完整的示例程序来学习，但最重要的是亲自动手从零开始编写自己的程序。因此，书籍的一个重要部分是练习和问题，读者必须编写与书中内容相应的程序。该系列中的所有书籍都围绕同一个骨架构建，由文本、示例、练习和问题组成，这些内容被放置在文本中自然出现的位置。练习与问题的区别在于，练习很大程度上是对文中所介绍内容的重复，并且对需要做什么描述得相对准确。而问题的描述则较为松散，通常规模稍大，且很少有明确的最佳解决方案。这些书应该从头到尾阅读，但许多代码示例（包括练习和问题）起着核心作用，读者详细地研究许多示例中的代码至关重要，并且还要解决练习和问题，或者可能只是研究推荐的解决方案。


    所有书籍都以一个或两个较大的示例程序结束，这些程序主要关注过程以及程序是如何编写的说明。另一方面，代码只在有限范围内出现——如果有的话——读者应该可能在测试程序时来学习完成的程序代码。除了所介绍的比示例更大的程序开发外，总结示例的目标还为了展示来自不同应用领域的程序示例。


    大多数书籍还以一个附录结束，处理书中未涉及的主题。这可能是关于软件安装问题或其他计算机技术中的其他主题，这些主题与软件开发无关，但有必要具备基础知识。如果读者已经熟悉该主题，可以跳过当前附录。


    编程语言如前所述是 Java，除了书籍外，还使用了以下产品：


    1. `NetBeans` 作为应用程序开发的 IDE

    2. `MySQL`，在需要数据库服务器时使用（从 `Java 6` 书籍开始）

    3. `GlassFish` 作为 Web 服务器和应用服务器（从 `Java 11` 书籍开始）

    4. `Android Studio`，一个用于开发手机 App 的工具


    这些产品都是免费且可免费安装的，甚至提到有些产品的安装可以自动完成，无需巨大的努力和挑战。此外，网络上还有针对这三个产品的详细安装说明。这些产品适用于 Windows
    和 Linux，因此你使用 Linux 还是 Windows 并没有特殊区别。


    所有示例程序都是在运行 Linux 的机器上开发和测试的。事实上，这并没有主要影响，因为无论平台是其中一个还是另一个，Java 和其他产品的运行方式完全相同。在书中某些地方你可以看到平台是
    Linux，这主要适用于涉及文件系统的命令。否则，对于读者来说，程序在 Linux 机器上开发并没有意义，它们也可以立即在 Windows 下运行，除非程序引用了文件系统，此时可能需要更改文件名。


    最后，简单介绍一下这些书籍不是什么。它们不是关于“如何编写”的，或者说不是 Java 的参考手册，而是正如标题所示，是关于软件开发的书籍。我希望读者在阅读这些书籍并通过许多示例时，可以找到编写良好程序的灵感，也可以将其作为解决方案集，包含许多你作为软件开发人员经常面对的具体日常编程问题的示例。


    # 1 引言


    该系列之前的旧书籍都是关于系统开发以及如何使用 Java 编程语言编写程序的。如果回首看，这本可能是内容最充实的一本，而且如果你打算成为一名优秀的软件开发人员，其实并不公平：你应该努力摆脱对工具的束缚，转而关注所有系统开发任务共同的方法和原则。然而这并不容易，因为最终，人们必须变得具体，并学习如何处理实现解决方案所需的技术和工具。事实上，这是软件开发中的一个困境，人们一直强调学习良好的系统开发方法的重要性，并关注分析、设计和模式，而技术和某种语言的编程是次要的。


    '
- fmt: '

    We have gradually developed software for over 50 years, and during that time many
    new programming languages have been developed, many different development tools,
    and several system development methods and other guidelines for developing a program
    has also been developed, so in principle, it should be easier to develop a program
    today than before. It’s also – you simply have better tools than before, but conversely,
    the programs you are developing today are often much bigger and more complex than
    before, and also they have a greater diversity. For example, there is a big difference
    in writing a PC application and a web application, and again it is different to
    write an app to a mobile phone. In particular, the last means that it’s hard to
    be good all the way around and that it is necessary to specialize as software
    developer. Finally, new tools (including programming languages) are constantly
    being marketed to address specific tasks, so there are always new tools to be
    used to and use in the daily work as a professional software developer.


    Fortunately, there is also something that is stable such as algorithms and other
    solution techniques, and this is where you have to stay focused. In fact, programming
    languages and other development tools do not mean much. If you have first learned
    a programming language, it is easy to change to another language if needed. This
    is often encountered, typically because different development organizations do
    not use the same tools and because there are always new ones that might be particularly
    suitable for the type of tasks the current development department is working on.
    It is far from the fact that, as a developer, you have influence on the choice
    of tools, as they are often based on basic decisions in the organization, but
    you are influenced by the need to be critical and test the tools thoroughly before
    using them in the specific projects. Those who have elaborated new tools often
    promise a lot, and although there are also new and good tools on the market, it
    is important to be aware that it takes time and thus has the cost to take new
    tools in use. You have to consider the context of whether it is no better to use
    the time to become even more adept at using the tools that you already do, and
    adjust and refine the use of the known tools. Often, new tools promise a lot,
    but when you first dive into them, it’s far from the assumption that the news
    is so big.


    The primary tool in these books has been `Java` and `NetBeans`, but there are
    actually many other tools that relate to the `Java` world, and all have the same
    purpose to streamline the software development process. Among other things, I
    have previously mentioned alternatives to `NetBeans` (`Eclipse` is an example),
    while others can interfere with `NetBeans`. Many of these tools are good and widely
    used in practice, but although there is no room for a presentation in these books,
    I will mention actual project management tools. There are many each with their
    advantage, but they are tools that support the implementation of large projects
    with many project participants. They have facilities to manage large projects
    where multiple developers work closely together, including controlling versions,
    so that you can always go back to a previous version, so some developers will
    not override others’ code without being sure that you can recreate the code. It’s
    comprehensive tools, that it takes time to learn to use, and partly are either
    or tools. These are tools that are implemented on the basis of a decision in the
    development organization and after extensive investigations, which all have to
    undertake and apply. On the other hand, they are tools used by all major development
    organizations, and thus tools that you will certainly meet, and it is a must in
    the development of large and complex IT solutions.


    As a software developer, you must know your tools and development methods, and
    apart from `Java`, none of the subjects are presented in these books, but this
    as the last of the books ends with mentioning a few classic system development
    methods.


    # 2 System development methods


    This chapter is a brief review of three system development methods:


    1. Unified Process

    2. `SCRUM`

    3. Extreme programming


    None of the methods will be discussed in detail, and I would recommend that you
    find literature that explicitly addresses each of the three methods. In particular,
    `SCRUM` is a very popular system development method, although the two others certainly
    also have their followers.


    I have previously in the book `Java 7` mentioned the waterfall model as a system
    development method, and although this method is not considered flexible enough
    today, it definitely has its uses in development of smaller programs where the
    risks are small. However, I want to start with an even simpler method which, in
    fact, is not a method at all, but nevertheless describes a method that is often
    used in practice.


    ## 2.1 Code and test


    It is not a system development method, but it is mentioned here because many programs
    in practice are developed according to this model, and it also has the right to
    small programs. The method is quite simple where the developer starts to understand
    what it is for a program to be written, and then the developer programs some code
    and tests the result, reprograms, and tests again, and continues until the program
    is written.


    You can say that you actually work without using a method, and it is contrary
    to everything that has been said and written about system development, but yet
    the method is widespread, and under certain assumptions it also gives good opinion
    in practice.


    Of course, you can not tackle the code and test process before you understand
    what it is for a program to be written, and the process therefore starts with
    a form of analysis where you can clarify the requirements of the program with
    the customer. Then you start programming and testing whether the code you have
    written works according to the requirements, and so proceed with a large number
    of small steps until the task is solved.


    In order for such a simple approach to lead to a successful outcome, there are
    two prerequisites that must be met:


    1. It must be a small project and a project solved by a single person (such as
    the final examples in these books).

    2. The task must be well-defined and there must be no greater uncertainties about
    how the task should be solved and what the final result should be.


    If these prerequisites are present, there is nothing to solve the task after a
    code and test model, and in reality there may not be much else that makes sense.
    Here it is important to note that in the real world there are many tasks that
    just meet the above two assumptions, so code and test programming has its uses
    and has been used far more frequently than the many books on system development
    prescribe.


    ## 2.2 The waterfall model


    It is a system development method that I have already mentioned (`Java 7`). It
    used to be one of the most used system development methods, but since the most
    dated system development method that has existed, and the latter is not really
    quite fair. Everything I have previously said about the phases of the waterfall
    model still applies and is part of any other system development method. The problem
    with the waterfall method is not so much the content of the method but that it
    used uncritically as a number of phases performed in a certain order is not flexible
    enough to solve today’s large and complex IT systems. Actually, it is not the
    method that is something wrong with. It is just not suitable as a solution for
    large and complex systems, especially for projects with a long time horizon, and
    where the project group consists of several or many system developers.

