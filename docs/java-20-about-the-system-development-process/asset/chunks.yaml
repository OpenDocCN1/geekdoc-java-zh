    A `design pattern` is a description of a solution for a particular problem. The
    starting point is a simple observation that certain issues appear more or less
    directly over and over again in many different software projects. If that is the
    case, one can try to describe the problem abstract and subsequently indicate a
    concrete solution. That way, as a developer, if you have a problem that can be
    categorized under a design pattern, you can easily figure out how to solve the
    problem. This means several important advantages, the most important being that
    you use the experience of other developers to solve a specific problem, rather
    than having to find in your own way to do it. This means cheaper and far more
    stable programs.


    As an example of a design pattern, I would mention the `iterator pattern`, as
    I have previously mentioned and used several times. Given a collection of objects
    of one kind or another, the problem is that you need to traverse all objects and
    do something with them. If you use the design principle, to program to an interface,
    and the collection class `Collection` is defined by an interface `ICollection`
    so that the `Client` program only knows the collection class through the defining
    interface. The interface defines a method `createIterator()` that returns an iterator,
    which is an object that initially refers to the first object in the collection
    and has two methods, one that returns the object that the iterator points to and
    step the iterator forward, while the other method tests if the end is reached.
    The class `Iterator` can also be defined by an interface, and the iterator pattern
    can thus be illustrated as follows:


    ![](image/Image1845.jpg)


    If a collection class implements this pattern, it means that the class can be
    treated in the same way, regardless of whether it is for a collection. For example,
    think about Java’s implementation of collection classes.


    I have used other design patterns in the previous books:


    * `Singleton`

    * `Factory`

    * `Adapter`

    * `Observer`


    and there are many others, and since `Gang of Four` defined 23, many others have
    been defined. The latter can be a challenge as many patterns look similar and
    can be difficult to distinguish, and there has also been a tendency to define
    patterns for anything, but it does not change that patterns are important and
    that it pays to teach them.


    The patterns of `Gang of Four` and many others concerns concrete issues in programming,
    but other patterns are more general and are often composed of several patterns.
    One example is `MVC`, which is a pattern for the design of a GUI program. It is
    also a design pattern that expresses others’ experience of how to design a GUI
    program. If you do, others who must maintain the program knows how the program
    is designed. The pattern is described in these books. It’s a complex pattern,
    and it is a pattern that is found in several variants. It expresses the fact that
    it is actually difficult to define design patterns if they are to be general and
    therefore MVC exists in so many variants, which are determined by both software
    platforms and development tools.


    Another important reason for using design patterns is that developers in this
    way have a family of common concepts. For example, if I say that a class in a
    program is an `adapter`, I’ve told others that it’s a class that is used to smooth
    the differences to other classes, and I can even look up a book about design patterns
    and see what an `adapter` is and how it is used.


    # 5 Refactoring and other


    In order for a development project to be successful, the completed program must
    meet:


    * that the program meets the requirements

    * that the program works without errors

    * that the program is robust

    * that the program is easy to maintain


    and if you read the literature you will be presented with a number of other quality
    factors, but in addition to that, you can add that the project is completed within
    the estimated resource consumption and that it is completed on time.


    ## 5.1 Refactoring


    In order to meet these requirements, you have to work systematically and follow
    a method, and the four basic activities in system development are, as already
    mentioned many times:


    1. analyse

    2. design

    3. programming

    4. test


    and then combined with iterative system development, but in addition to that,
    there will always be an activity called `refactoring`, where you to some extend
    has to rewrites the code to make it easier to read and maintain, while you have
    to retain the code’s functionality.


    Once you have written the code and tested it and found that it meet the requirements,
    the code has been through a process where you have developed on the code, tested
    it, corrected, adjusted, expanded and so on and the result will very often be
    a code that is characterized by:


    * `Variables` not used and which must therefore be removed.

    * `Methods` not used, which should therefore be removed.

    * Two or more methods that almost do the same, and where you can reduce to a single
    method using a parameter.

    * `Methods` that may be called something different, but do the same where you
    should only have one method that may be placed in a particular tool class.

    * `Instance methods` that do not depend on the instance, where the method maybe
    can be defined static or move to a tool class.

    * `Classes` that are almost identical, where classes can be changed to specializations
    of a common super class and where the methods that are the same are moved to the
    super class.

    * Code commented because the code should not be used. Such a code must be removed.

    * Code that solves the task, but makes it inappropriate. Here you should find
    a better code, which usually is the same as a better algorithm.

    * Missing comments, which should be written.

    * `Classes` with very high coupling. If so, you should consider whether you can
    reduce the coupling in one way or another. An example could be to implement the
    `observer pattern` using an interface.

    * `Classes` with very low cohesion. If so, one should consider dividing the class
    into several classes.

    * `Import statements` that are unnecessary. They should be removed, so you only
    have the import statements that are necessary.


    and many other examples could be mentioned. These relationships mean two things:


    1. That the code fills more than necessary is.

    2. That the code is far harder to maintain than necessary is.


    and here it is absolutely the last, which is the biggest problem. Therefore, the
    code must be refactored, which can be considered as a cleanup process to clean
    the code for the above inconvenience.


    As mentioned, the aim of a refactoring is to get a simpler code and thus a code
    that is easier to maintain. Conversely, you should note that refactoring does
    not develop into direct reprogramming. If that is the case, the cause is usually
    serious error decisions during the development process, and if necessary, you
    should postpone a refactoring to a new project where the task is directly a refactoring
    of an existing program. To avoid getting in that situation, the solution is frequent
    refactoring, and maybe it should be part of each iteration, and here’s the worth
    to note that in Extreme Programming refactoring is an integral part of each iteration.


    ## 5.2 Log files

