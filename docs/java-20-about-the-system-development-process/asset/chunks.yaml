    然后是 `Card5Presenter` 类。代码内容并不多，主要的挑战在于让线程正确运行，特别是如何测试这些代码。例如，`RAISE`（加注）增加了逻辑的复杂性，因为
    `RAISE` 必须返回并让前面的玩家重新下注，而且由于他们也可以 `RAISE`，因此有很多情况需要考虑。在测试方面，有必要测试程序，即玩游戏。在这里你可以发现错误和不便之处，但要追踪错误发生在何时以及如何发生可能会困难。因此，我通过一个额外的类扩展了模型层，该类代表了一种日志文件的形式：


    ![](img/Java_20_862.jpg)![](img/Java_20_87.jpg)![](img/Java_20_88.jpg)


    这个类非常易理解。然后你可以让程序在特定位置写入日志，这可以让你更容易找到程序在何处失败了。


    当然，日志文件不应该是完成后的程序的一部分，而且该类——以及代码中所有的引用——必须在应用程序使用之前移除。我目前还没有这样做。部分是因为我稍可以在其他迭代中使用这个类，另一部分是因为读者可以看到我是如何使用日志文件的。


    也有理由要稍微警告这种技术，即将日志文件作为开发过程的一部分来记录错误。风险在于如果你没有移除代码中所有的引用，程序可能会因为你引用了不再存在的内容而突然失败。在这种情况下，`LogFile`
    类是一个单例，如果我删除了该类，编译器会找到所有对该类的引用，我就可以确保关于日志文件的所有内容都被移除。


    作为同类的另一个问题，程序的工作方式是：当你选择 `SHOW` 查看谁获胜了时，所有的牌都会出现——即使对于那些已经弃牌的玩家。这不应该发生，当显示所有牌时，是因为
    `Card5Presenter` 类中 `deal()` 方法的某些代码必须被其他内容替换：


    ![](img/Java_20_89.jpg)


    同样，我必须记住在某一点删除底部的 `for` 循环并替换为被注释掉的代码。其目的当然是为了在测试过程中，我可以观察弃牌玩家是否也做出了合理的决定。


    ## 6.7 迭代 4


    在第 3 次迭代结束后，*五哨扑克 (5 Card Stud)* 在原则上已经实现，至少用户可以与其他 4 个虚拟玩家玩这种扑克变体。在这次迭代中，必须实现以下功能：


    每个每个用户（玩家）的用户账户维护，你必须注册：


    *   用户名，必须唯一标识用户

    *   密码

    *   余额，即账户中有多少钱

    *   交易记录，何时以及多少钱被添加到/或从账户中取出，但不是单轮游戏的结果


    除非账户中有钱，否则用户将无法游戏。


    登录功能，玩家在程序开始时必须通过用户名和密码识别身份为玩家。作为该功能的一部分，必须能够创建新账户。


    开始新游戏是一个用户可以随时选择的功能。该函数打开一个对话框，用户必须在其中选择：


    1.  扑克变体（五哨扑克、七哨扑克、德州扑克、奥马哈、抽牌扑克）

    2.  玩家人数（2–6 人）

    3.  盲注（1–10，加入新轮回合的筹码数，默认 1）

    4.  起始金额（每个玩家的筹码数，默认 1000）


    程序必须能够保存每一轮的结果，程序在每个下注回合存储牌牌和注额，从而记录游戏。尚未决定这些结果将用于何处，但可以用于某些形式的统计，以改进虚拟玩家的行为。该功能必须能够开启和关闭，并且可能默认禁用。


    ### 开始新游戏


    这个功能的实现非常简单，它会打开以下对话框：


    ![](img/Image3526.jpg)


    对话框可以从登录窗口打开，也可以从应用程序窗口顶部的按钮打开。该函数可以随时执行，因此你可以中断正在进行的游戏。


    实现主要包括向视图层添加两个类 `GameView` 和 `GamePresenter`，并对 `MainView` 和 `MainPresenter` 类进行一些改更改。


    ### 用户账户


    已经决定从程序中完全移除此功能，因为这真的没有意义。该功能的理由是，如果你玩很长时间的扑克，追踪你长时间的赢或输可能很有趣，但考虑到游戏的初衷，这是一个几乎不会被使用的设施。因此，程序在这一功能上被精简了，而且因为如果你必须确保它也反映了实际情况，并且存在与功能相关的决策（例如何时更新账户以及在不中断程序的情况下如何将修改写回磁盘），那么实现这个功能并不容易。


    这也意味着登录功能将被舍弃，因为整个用户概念因此变得毫无趣味，因此用户（玩家）将始终是机器的当前用户。


    由于这个决定，这次迭代的内容显著减少了。


    ### 日志文件


    日志文件必须是一个普通的文本文件，其内容取决于具体的变体。例如：每当开始一新轮游戏时，都会根据玩家所在的位置写入一行。牌的颜色为 D（方片）、H（红桃）、S（黑桃）和
    C（梅花），牌的值为 2, 3, 4, 5, 6, 7, 8, 9, 0, J, Q, A。如果有 5 个玩家，第二次发牌的结果可能是：


    ![](img/Java_20_93.jpg)


    对于每个下注回合，每当玩家下注时都会写入一行，其中记录了玩家的位置、注额、添加到池中的金额、游戏的新值、玩家的金额以及池的内容。注意每个下注回合的行数可能会变化，但单行的结果可能是：


    ![](img/Java_20_92.jpg)


    关于玩家注额，使用了以下术语：


    *   `B1` = 注

    *   `B2` = 大注

    *   `CH` = 牌

    *   `FO` = 弃牌

    *   `R1` = 加注

    *   `R2` = 大加注

    *   `CA` = 跟注


    最后，在轮结束时会写入一行显示获胜玩家的结果。该行显示了玩家的位置、牌值、游戏进行后的玩家金额以及牌。一个结果可能是：


    ![](img/Java_20_92.jpg)


    其中牌值使用了以下缩写：


    *   `SF` = 同花顺

    *   `C4` = 四条

    *   `FH` = 葫芦

    *   `FL` = 同花

    *   `ST` = 顺子

    *   `C3` = 三条

    *   `TP` = 两对

    *   `C2` = 一对

    *   `HC` = 高牌


    由于该功能默认情况下是禁用的，程序通过以下对话框进行了扩展：


    ![](img/Image3533.jpg)


    它维护了以下数据结构：


    ![](img/Java_20_931.jpg)![](img/Java_20_94.jpg)![](img/Java_20_95.jpg)

