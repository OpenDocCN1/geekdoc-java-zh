    我不会深入探讨该方法的内容，仅参考 `Java 7` 一书，但对于较小且定义明确的任务，该方法仍然很有趣并且可以很好地使用。一些人尝试改进这种方法，主要通过引入其他系统开发方法的思想，其中文献中描述了一种被称为“带反馈的瀑布模型”的瀑布模型版本，这是试图将迭代系统开发正式整合到瀑布模型中，而这在原则上是不支持的。无论你怎么做，对于大型复杂的
    IT 系统，瀑布模型永远不会正确的系统开发方法。在这里，你必须使用下面描述的敏捷系统开发方法之一。


    ## 2.3 统一过程 (Unified Process)


    `Unified Process` 是一种面向对象的系统开发方法，但在文献中，该方法通常被称为 `Rational Unified Process`（理性统一过程），它是原始方法的进一步发展。它是一种迭代系统开发方法，通过向
    4 个阶段迭代实现解决方案来解决当前任务：


    1.  启动阶段 (Inception)

    2.  弹性阶段 (Elaboration)

    3.  构建阶段 (Construction)

    4.  过渡阶段 (Transition)


    统一过程作为一种方法，在任务相对明确且项目涉及更多开发人员的大型项目中最为成功。在许多方面，该方法可以看作瀑布模型的替代方案，承认了这种方法不适用于大型复杂
    IT 解决方案的开发。它是一种迭代方法，通过多次迭代来解决任务，人们可以合理地将每次迭代理解为瀑布方法之后实现的局部解决方案。


    统一过程也是一种敏捷系统开发方法，因此其目标是快速为客户交付有价值的解决方案，同时在客户对交付的子解决方案进行测试后，可以根据客户的意愿轻松且准确地调整需求。今天所有的现代系统开发方法都被称为敏捷的，这可能仅仅是一项观察，即今天的
    IT 系统比以前大得多，也复杂得多。


    我不想详细回顾这种方法，但我强烈建议阅读一本介绍该方法并提供如何在实践中使用该方法指导说明的书籍。


    如前所述，该方法由 4 个阶段组成，每个阶段通过若干次迭代执行。每个阶段包含多少次迭代取决于任务的复杂程度，但核心思想是，每次迭代不应耗时过长。建议每次迭代的截止日期不要超过几周，但相反，迭代不应太短，至少应该持续几周。在开始迭代之前，你必须定义要解决哪些任务。这些任务取决于阶段，但原则上，每次迭代可以包含分析、设计、编程和测试任务，尽管其权重随过程发生变化，例如弹性阶段的迭代主要侧重于分析和设计，而构建阶段的任务最多侧重于编程和测试。


    ### 启动阶段 (Inception)


    此阶段通常只包含一次迭代。这是一个启动阶段，你必须分析解决某个任务的目标。目标不是准备一份完整的需求规格书，启动阶段是一个短阶段，在其中阶段你分析关键需求并确定系统的基本愿景。你不应该尝试列出尽可能的系统需求列表。必须对系统开发进行风险分析并做出决策。


    启动阶段的结果通常是：

    *   任务制定

    *   需求规格书

    *   一个或多个原型

    *   附件

    *   结论


    启动阶段以结论结束，系统开发人员在结论中强调继续项目的后果，并可能提出调整建议。如果结果是项目继续进行的决定，则将准备项目计划，包括弹性阶段首次迭代的规划。


    ### 弹性阶段 (Elaboration)


    在此阶段，会执行一次或多次迭代（通常会有更多，可能很多），在其中每次迭代都会开发整个系统的一部分。因此，可以将每次迭代视为一个微型开发项目，其结果基本上是一个任务经理可以测试的程序（产品）。可以将迭代看作一个将整个项目从一个状态带到另一个状态的开发过程。


