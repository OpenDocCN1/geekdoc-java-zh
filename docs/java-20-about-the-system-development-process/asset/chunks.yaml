    一项原则上始终与单个冲刺并行活动被称为 `Product Backlog Grooming`（产品待列表梳理）。它始终关于审查和调整 `Product Backlog`（产品待列表）中的项，通常包括添加细节、调整估计等。`Product
    Owner`（产品所有）负责对 `Product Backlog` 中的项进行排序，而 `Development Team`（开发团队）负责对项进行估计。


    虽然它不是 `SCRUM` 的一部分，但建议在每个冲刺之间安排一两天的休息时间，你可以利用这段时间阅读文章、参加课程或研讨会，或者让自己熟悉新主题，或者简单地去散步享受大自然。也许这个想法很难向经理推销，但研究表明，这段时间花得非常值，部分是为了取得项目进展，部分是为了确保团队参与者跟上技术发展。这一理念支持
    `SCRUM`，在 `SCRUM` 中，始终以产品为导向而非以活动为导向至关重要。


    另一个问题是，如果你在冲刺结束时发现某些工作未完成，该怎么办？这里的规则非常明确：


    1. 未完成或未撤销的元素（`stories`）被放回 `Product Backlog`。

    2. `Product Owner` 重新排列待办列表，通常将未完成的元素放在顶部，但并不一定如此。

    3. 未撤销的故事不能重新调整大小以仅代表剩余的未完成工作。正在处理的故事不能被拆分为已完成和未完成的部分。故事要么完成，要么未完成。


    总的来说，可以认为 `SCRUM` 包含了以下产物：


    1. `Product Backlog`，即最终产品中可能需要的所有故事有序列表。

    2. `Sprint Backlog`（冲刺待办列表），即从 `Product Backlog` 中选择的要在冲刺中交付的故事，以及 `Sprint Goal`（冲刺目标）和针对
    `Sprint Backlog` 中所有故事的冲刺计划。

    3. `Increment`（增量），即项目到为止完成的所有 `Product Backlog` 故事的集合。

    4. `Definition of Done`（完成定义），即对一项工作何时被视为完成的理解。

    5. `Monitoring Progress`（监控目标进度），即对整个项目的性能衡量和预测。

    6. `Monitoring Sprint Progress`（监控冲刺进度），即对单个冲刺的性能衡量和预测。


    你应该意识到，关于 `SCRUM` 的文献定义了这些产物的具体内容以及你可以使用的典型工具。


    作为对 `SCRUM` 的最后评论，重要的是强调，其目标是提供一个框架，指导你如何有效地组织大型且复杂的（IT）系统的开发，该方法表达了专业开发人员在实施复杂开发项目方面的经验。另一方面，`SCRUM`
    并没有说明每个冲刺应该包含什么，以及每个团队成员应该如何执行日常工作，在这里你必须应用所学到的关于系统开发的其他知识（例如本系列书籍中解释的内容），或者最好是下文关于极端编程的章节中所说明的内容。在实践中，你将结合各种系统开发和编程技术。


    ## 2.5 极端编程


    `Extreme Programming`（极端编程），也称为 `XP`，是一种系统开发方法，顾如其名，与上述方法不同，它侧于编程。你不应该将 `XP` 视为例如统一化过程或
    `SCRUM` 的替代方案，而是将其视为如何成功完成单次迭代中编程部分的建议。`XP` 与其他系统开发方法一样，由多次迭代组成，每次迭代将项目从一个状态带到另一个状态。它与其他方法的活动相同，但在
    `XP` 中，`design`、`program` 和 `test` 三个活动共同形成单一活动。


    该方法基于四个主要原则：


    1. `Heavy customer involvement`（深度客户参与），用户组织的代表被纳入开发团队，持续参与并积极贡献单个迭代的计划以及各种验收测试，并在很大程度上也执行这些测试。

    2. `Test-driven development`（测试驱动开发），要求开发者在编写任何代码之前为每个新功能编写单元测试。通过这种方式，在成功执行所有单元测试之前，函数无法转移进行测试（见下一章关于测试驱动开发）。

    3. `Pair programming`（结对编程），所有代码由两个程序员编写，分别称为 `driver`（驾驶员）和 `navigator`（导航员）。两个程序员坐在同一台电脑前。`driver`
    写代码，而 `navigator` 监控过程、提出建议、思考设计和程序质量等。每半小时，他们交换这两个角色。这个想法很简单，两个脑袋胜过一个脑袋。当然，结对编程的效果不如两个程序员分别编写各自的代码，但经验表明，产生的代码质量更好，错误远少。

    4. `Short iteration cycles and frequent releases,`（短迭代周期和频繁发布），你在不超过几周的短迭代中开发软件。目标是频繁发布可以交付给用户组织并在原则上由其使用的版本。一个发布周期跨越几个月，并在几次迭代中完成。其理念是用户组织必须体验到进展，并且要有事情发生。


    与所有其他系统开发方法一样，`XP` 的目标是做得更好，`XP` 正确地将软件开发最大的问题视为风险。显而易见，随着项目变得越来越大和复杂，无法按计划执行会导致错误率增加，而误解任务意味着产品包含了客户完全不需要的功能，最坏的情况下，可能面临项目必须被完全放弃的风险。`XP`
    试图通过控制四个变量来最小化风险：


    1. `cost`

    2. `time`

    3. `quality`

    4. `features`


    其中后者可能是衡量程序能力的的最重要指标，但由于四个变量显然不是独立的，为了满足成本和时间要求，很容易意味着需要牺牲质量（这是短期的）或功能。这些变量的新奇之处在于，该方法从一开始就关注并控制这四个关键领域。


    除了这些控制变量外，`XP` 项目参与者还需要根据多个核心价值观工作，其中我想提到 `communication`（沟通），所有参与者都承诺将价值知识传播给整个团队。这可以通过较小的开发团队、如结对编程以及代码的共同所有来实现。


    此外，极端编程为开发过程定义了 12 条原则：


    1. `Planning`

    2. `Small releases at short intervals`

    3. `System metaphors`

    4. `Simple design`

    5. `Test`

    6. `Frequent refactorization`

    7. `Pair-programming`

    8. `Common ownership of the program code`

    9. `Continuous integration`

    10. `Affordable work rate`

    11. `An overall development team`

    12. `Common code standard`


    并且要成功使用该方法，遵守这些原则是至关重要的。


    关于 `XP` 还有很多内容，关于 `XP` 的著作和积累的经验也很多，这一切表明——至少如果你询问该方法的支持者的话——该方法在目标是开发高质量软件时特别有用。


    # 3 测试驱动开发


