  trans: '

    相应的方法也随之发生了变化。然后 `OptionsView` 和 `OptionsPresenter` 类需要进行调整，这看起来非常简单。在视图类中没有什么特别需要注意的，但必须将设置保存到某个处，决定将其保存在用户主目录下的
    `poker.init` 文件中，并通过简单的对象序列化来实现。决定在每次更改设置时都保存这些设置。然而，这存在一个小问题，因为 JavaFX 属性不能立即被序列化。因此，编写了一个很小的类来封装这些属性，以便你能够序列化该类的对象。


    ![](img/Java_20_109.jpg)![](img/Java_20_110.jpg)


    有了这个类后，可以很容易扩展 `OptionsPresenter` 类，添加一个方法，在点击 `OptionsView` 中的 `OK` 按钮时，将带有程序设置的
    `PokerOptions` 对象序列化。同样，`Model` 类也扩展了一个 `deserialize()` 方法，该方法在可能的情况下反序列化一个 `PokerOptions`
    对象并实例化 `Options` 对象。


    在错误日志方面，它必须记录在用户主目录下名为 `poker.error` 的文本文件中。该功能通过以下类实现：


    ![](img/Java_20_1101.jpg)![](img/Java_20_111.jpg)


    反之，只需在启用该功能时调用 `write()` 方法。一个示例可以是：


    ![](img/Java_20_1111.jpg)


    这是 `OptionsPresenter` 类中的错误处理。当时，必须在相关的地方实现错误处理，这与随后的代码审查和重构有关。


    ### 用户界面


    用户界面在某些地方需要改进（而且在很多地方无疑完全可以改进）。该程序目前在高分辨率显示器（1920 × 1080）上运行良好，但在分辨率明显更低的屏幕上，没有空间容纳所有的卡牌。以下内容主要关于如何让用户界面依赖于当前的屏幕分辨率，同时依赖于当前的游戏变体。


    程序在窗口的右上角有两个按钮，用于打开游戏选择和设置的对话框。我将这两个按钮移动到了实际的游戏视图中，它们位于顶部手牌的右侧。


    ![](img/Image3572.jpg)


    目标是在顶部节省一点空间。另一方面，这一更改必须在所有 5 个游戏视图中实现。为此，在 `poker.tools` 包中添加了以下组件：


    ![](img/Java_20_112.jpg)![](img/Java_20_113.jpg)


    在这里你应该首先注意到构造函数的参数，它是一个 `MainPresenter`，这样这两个按钮就可以调用该类中的事件处理器。在 `MainView` 中，删除了原来的两个按钮，并相应地修改了
    `MainPresenter` 类。上述组件必须插入到 5 个游戏视图中。决定是在基类 `TableView` 中添加以下方法：


    ```

    ![](img/Java_20_1131.jpg)

    ```


    然后使用该方法将组件插入到 `Card5View`（它是一个 `BorderPane`）：


    ```

    ![](img/Java_20_1132.jpg)

    ```


    然后，在 `Card7View`、`TexasView`、`OmahaView` 和 `DrawView` 中必须进行相同的更改。


    然后我减小了显示玩家金额的 `TextField` 组件（`HandView` 类）的字体，底池也是如此。`Card5View` 类有一个名为 `createCenter()`
    的方法，用于创建一个底池组件。我将此方法移动到 `TableView` 并将其命名为 `createPot()`。接下来，必须在 `Card7View`、`TexasView`、`OmahaView`
    和 `DrawView` 中进行更改，结果是底池在所有 5 变体中以相同的方式和位置（窗口中间）显示。


    每次用户选择新游戏时，`MainPresenter` 类中执行 `newGame()` 方法。执行此方法时，会创建一个新视图，你可以根据当前游戏自定义窗口大小。决定视图大小的主要是卡牌，你可以通过压缩卡牌来减少窗口尺寸的要求。为此，`CardView`
    类扩展了 4 个静态变量：


    ```

    ![](img/Java_20_114.jpg)

    ```


    其中前两个是常量，表示卡牌的默认大小。如果你想缩放图像大小，可以更改另外两个变量，它们随后被用于定义组件的大小。它们也被用于 `HandView` 类来定义手牌组件的大小。结果是，卡牌填充屏幕的程度由
    `width` 和 `height` 两个变量决定。


    `CardView` 类额外扩展了以下静态方法：


    ```

    ![](img/Java_20_1141.jpg)

    ```


    该方法用于初始化两个静态变量并计算窗口大小，其中窗口由最后一个 `Stage` 对象表示。这两个部分都取决于当前的屏幕分辨率和要运行的扑克变体。方法的前两个参数表示屏幕分辨率，接下来的两个表示该视图所需的空间。后续两个参数表示在水平和垂直方向上需要多少空间，除了卡牌之外还需要多少缩放空间，最后最后两个参数指向要更改大小的窗口。


    ```

    ![](img/Java_20_115.jpg)![](img/Java_20_116.jpg)

    ```


    `MainPresenter` 类有一个 `setSize()` 方法，使用上述方法来确定窗口大小，基于人数以及桌上应显示的卡牌数量。它分为 2 个玩家、3
    或 4 个玩家以及 5 或 6 个玩家，每种划分都根据当前的扑克变体确定大小。


    有了上述更改，窗口将适应当前的屏幕分辨率。如果你玩 `Omaha`，程序在结算时会打开一个对话框，该对话框应以相同的方式配置，使其也考虑到屏幕分辨率。这要求
    `OmahaPresenter` 类有一个类似于上面的 `setSize()` 方法，但简单得多，因为对话框始终显示 5 张卡牌。


    如果你玩 `Texas Hold’em`，结算时会打开另一个视图，但最好使用相同的对话框。这意味着 `TexasPlayer` 和 `TexasPresenter`
    类需要修改。在 `TexasPlayer` 中，最后下注轮调用 `round4()`，应根据 `OmahaPlayer` 中的相应方法进行调整，并在 `TexasPresenter`
    中，必须打开对话框而不是 `ResultView` 窗口。然后可以删除 `ResultView` 和 `ResultPresenter` 两个类。

    '
- fmt: '

    The four classes `GamePresenter`, `GameView`, `OptionsPresenter`, `OptionsView`
    and the related interface `IGameUpdater` have indirectly been through a review
    in this iteration so it is all in place. The classes `HandView` and `HandPresenter`
    are simple classes where a review also does not mean changes.


    The classes `MainView` and `MainPresenter` are important classes, but reverse
    relatively simple classes, and the result of a review is nothing but simple cleanup
    in the code.


    Back there are the classes for the 5 views for poker variants, which are at the
    same time the key classes for the user interface. The 5 view classes `Card5View`,
    `Card7View`, `TexasView`, `OmahaView` and `DrawView` are all simple and there’s
    nothing else to do than a simple cleanup. The same applies to the base class `TableView`,
    as methods from the derived classes already earlier in this iteration have been
    moved to the base class.


    Looking at the 5 presenter classes `Card5Presenter`, `Card7Presenter`, `TexasPresenter`,
    `OmahaPresenter` and `DrawPresenter`, they are very similar that indicates that
    a significant part of the code can be moved to the base class. Methods that in
    the 5 classes are the same can and be immediately moved to the base class, where
    you may need to change the visibility from `private` to `protected`. Then there
    are methods that are almost the same and here the choice is not quite so easy,
    and here it is always important to keep in mind that the primary reason is to
    increase maintenance. Are methods almost the same, there are basically three options:


    1. You can create a method in the base class with the same signature as the current
    method and which implements the common code. In the sub-classes, you can then
    implement an override that calls the base class method and also has the code that
    the is specific for the sub-class.

    2. You can move the method to the base class and then add conditions that take
    into account for the specific classes.

    3. You can let the methods be as they are, even if that means that the same code
    is duplicated.


    Each option has its pros and cons, and it’s very accurate to decide what’s right,
    but overall I prefer duplication of the code (and thus the last option) rather
    than complicating the code (what the middle option tends to). In the present case,
    I have actually applied all three options.


    The 5 classes also have methods that are used only in some of the classes. If
    so, one might consider moving the methods out as static methods in an auxiliary
    class. The class `Utils` in the package `poker.tools` is an example of such a
    class.


    The result of the above refactoring is that the class `TablePresenter` has grown
    significantly, while the 5 concrete view classes now do not fill a lot.


    Then there is refactoring of the model, where there are 20 classes (types), and
    here I have already at the start of this iteration carried out a review of 10
    of these types. Back there are the classes:


    * `Model`

    * `Hand`

    * `AbstractPlayer`

    * `Card5Player`

    * `Card7Player`

    * `TexasPlayer`

    * `OmahaPlayer`

    * `DrawPlayer`

    * `Logfile`

    * `PokerException`


    where there is nothing to notice about the last one. The same goes for the class
    `Model`, which is a central class, but also a very simple class.


    The class `Hand` is both comprehensive and important, and for the rest of the
    program it is crucial that this class works correctly. In connection with code
    review, nothing but ordinary cleanup has been done, but the class has a design
    problem similar to a low cohesion. The problem is that the last two variables:


    * `selected`

    * `clicked`


    that does not make sense for all variants of poker. The first one is only used
    in conjunction with `Texas Hold’em` and `Omaha`, while the latter is only used
    in conjunction with `CardDraw`. The problems are that you can refer to the variables
    in a context where they are not initialized or meaningful, and in particular,
    future maintenance of the program may be more difficult. The problem could be
    solved by introducing two derived classes, and then using these classes in the
    current variants. In the present case, I have omitted this change as it will mean
    changing some other classes and the problem solved solely with a comment in the
    code.


    Regarding the log file, there are also no important changes. However, a single
    adjustment has been made in the method `writeLine2()` to support `Texas Hold’em`
    and `Omaha`.


    Back there are the 6 player classes:


    * `AbstractPlayer`

    * `Card5Player`

    * `Card7Player`

    * `TexasPlayer`

    * `OmahaPlayer`

    * `DrawPlayer`


    where the first is the basic class for the rest. A refactoring basically consists
    of the same as above with the view classes, where methods can be moved from the
    specific classes to the base class, but there are fewer methods that can be moved
    this time.


    Another thing is the algorithms, where there is room for improvement, but I’ve
    seen only on `Texas Hold’em` and `Omaha`. As for the first one, the algorithm
    looks only on the player’s own card, but does not take into account what cards
    the other players can form from the cards on the table. For example, if there
    are three cards on the table (what is the case in the second betting round), each
    of the other players can form a hand using two of 47 other cards (47 = 52 – the
    cards of the current player – the three cards on the table).


    In order to determine what the player should choose, you can use the following
    where `player` is a `List<Card>` with the 7 cards (the player knows) in descending
    order:


    ```

    (image/Java_20_121.jpg)

    ```


    and here `createHand()` is a simple method that creates a `Hand` object. With
    the player’s card available, the following method counts the frequency of hands
    that the other players can form:


    ```

    (image/Java_20_122.jpg)(image/Java_20_123.jpg)

    ```


    The method returns a value between 0 and 1, and a large value (close to 1) indicates
    that the player has good cards and therefore can bet high. With this method available,
    the three bet methods can be written differently, where the value is determined
    based on the return value of the above method.


    You can use the same strategy in connection with `Omaha`, just be aware that the
    hand that a player can form is in another way, and that you get higher frequencies,
    as `Omaha` generally gives results with a greater value.


    #### The last thing


    There are still a few things that are missing. Firstly, there is a test of whether
    a player has money to deposit in the pool. If this is not the case, the player
    must leave the game and thus be out of the current game. In principle, it is quite
    simple to implement this facility, and it is primarily a matter of adding a variable
    to the `Hand` class:


    ```

    (image/Java_20_1231.jpg)

    ```


    If a player bet and does not have chips enough, this variable is set to true (the
    method `setLost()` is called). Then the number of the player’s chips is shown
    as 0, and the player folds the cards. In addition, the player in subsequent rounds
    must not be assigned cards.


    If it is especially the user who has lost his chips, it has been decided that
    the game is over and you get the following dialog box:


    ```

    (image/Image3580.jpg)

    ```

    '
