    # 概述

    与迭代 1 的原型相比，整体设计没有显著变化，开发遵循 JavaFX 应用程序的经典 MVP 设计模式。在模型层，主要扩展了三个新类。添加了一个 `Model`
    类。


    ![](img/Java_20_801.jpg)


    变量 `pot` 代表桌上的底池，以及玩家在每个下注轮次中向其存入金额（筹码）的地方。它被定义为 JavaFX 属性，因此用户界面可以绑定到它。下一个变量
    `game` 是类型 `Game` 对象的程序设置。初始只有 4 个属性，但该类在以后可能需要进行扩展。变量 `value` 是当前回合的值，每当玩家下注
    `BET` 或 `RAISE` 时就会更新。因此，该变量指示了在特定回合中继续游戏所需的费用。最后是 `hands` 变量，它是当前玩家的列表，代表他们的手牌。


    该类的方法通常非常简单，主要由 `get` 和 `set` 方法组成。此外，还有维护变量 `pot` 和 `value` 的方法：


    ![](img/Java_20_81.jpg)


    这些方法非常简单，但非常重要，因为这些是玩家在各个下注轮次中调用的方法。你应该特别注意带有参数的 `call()` 方法。如果一个玩家加注（raise），而另一个玩家已经在底池中投入了金额，则在更新底池之前需要减去该金额，这正是该参数的目的。因此，上述方法决定了在各个下注轮次中进行游戏的费用。与迭代
    1 中的决策类似，它相对于“真实”扑克游戏经过了简化，方法的另一个用途是，可以通过在派生类中重写方法来更改这些规则。这也是为什么 `pot` 和 `value`
    两个变量被定义为 `protected` 的原因。


    ## 新类

    增加了两个类：


    ![](img/Image3518.jpg)


    其中 `Card5Player` 类代表一个玩“五张牌派克”（5 Card Stud）的虚拟玩家。创建基类是因为其他 4 种扑克变体中的每种都会会有相应的类。我将在下面解释这两个类。


    ## Hand 类

    与原型相比，`Hand` 类被大幅扩展：


    ![](img/Java_20_83.jpg)


    第一个变量 `bigCard` 决定虚拟玩家应该将什么视为大牌（JACK、QUEEN、KING 和 ACE），该值与下注轮次结合使用。该值以后可能需要更改为关于程序设置的选项。下一个变量
    `cards` 是玩家手牌的列表，变量 `state` 用于跟踪牌是开牌的（朝上）还是隐藏的（朝下）。变量 `folded` 表示玩家是否已经弃牌（fold）并退出了该回合。变量
    `place` 指明玩家在桌上的位置，其中位置 0 始终被视为物理玩家，而变量 `raise` 指明玩家在一个下注轮次中下注 `RAISE` 或 `BIGRAISE`
    的次数。该值用于设置玩家在同一下注轮次中必须 `RAISE` 的次数限制。最后是 `value` 变量，它指示玩家在当前下注轮次中已向底池存了多少筹码。如果另一个玩家下注
    `RAISE`，该值将结合 `CALL` 使用。最后是 `jetons` 变量，指示玩家的筹码数量，它被定义为 JavaFX 属性，以便为每个玩家都能绑定到用户界面。


    关于玩家在一个下注轮次中可以下注 `RAISE` 的次数限制，这与真实的扑克游戏不一致，但包含在这里是因为否则很难让虚拟玩家正确行动。到目前，该限制在前三个下注轮次为
    2，最后一个下注轮次为 3，但该限制可能需要更改为一个选项。


    该类有许多方法，并实现了所有关于手牌价值的算法，包括虚拟玩家在下注轮次中必须用于确定下注的方法。有很多方法，其中许多既定义为实例方法也定义为静态方法。


    对于 `AbstractPlayer` 和 `Card5Player` 类（以及 `Card5Presenter`）中方法的实现，`Card`、`Cards`
    和 `Hand` 类中的方法能够运行至关重要，尤其是对象的比较，因为在某些上下文中是升序比较的，而在另一些上下文中是降序比较的。因此，为这三个类中的每一个都了单元测试类。在测试这些类后，我可以返回
    `AbstractPlayer` 和 `Card5Player` 类。


    ## AbstractPlayer 类

    基类目前是一个简单的类：


    ![](img/Java_20_84.jpg)


    第一个常量是玩家必须 `RAISE` 的次数限制，下一个变量是程序的模型。当程序必须发牌时，在每张牌之间会插入一个较小的延迟（以便用户可以跟踪发牌的过程）。下注也是如此，每个玩家的下注之间会有延迟——同样是为了让用户跟踪虚拟玩家的行动（模拟他们的思考）。这要求发牌算法和下注轮次算法在它们自己的线程中执行，这使得代码变得有点复杂，以确保用户界面的正确更新，用户界面需要通过
    `Platform.runLater()` 进行更新。`AbstractPlayer` 类中的最后两个变量用于此处。


    此外，该类主要由辅助方法组成。该类定义了 9 个抽象方法：


    ![](img/Java_20_841.jpg)


    其中前 4 个是 4 个下注轮次的方法。第一个参数是玩家的牌，下一个参数 `others` 是其他玩家的开牌。第三个参数指示是否是第一个下注轮次，最后一个参数指示当前玩家。最后
    5 个方法用于确定由谁开始下注轮次，这由玩家的开牌决定。


    `AbstractPlayer` 类在开发过程中可能会发生变化，肯定会有更多其他的抽象方法。


    `Card5Player` 是一个详尽的类，完全由实现基类的 9 个抽象方法组成。这里特别是前 4 个对应迭代 2 算法的完整方法。


    ## 用户界面层

    除了模型类，用户界面中还有相应的类，这里的更改主要涉及 `Card5Presenter` 类。它也被大幅扩展，并且到目前为止它是程序中最复杂的类，这等同于该类包含了整个游戏逻辑。


    与原型一样，该类派生自


    ![](img/Java_20_86.jpg)


    现在有一个类型为 `AbstractPlayer` 的对象的引用。同样注意第一个变量，它是对程序 `MainPresenter` 的引用，其目的是让 `Card5Presenter`
    类能够引用窗口的按钮。哪些按钮可用取决于玩家是谁（虚拟玩家还是物理玩家）。相对于原型，该类扩展了 7 个抽象方法：


    ![](img/Java_20_861.jpg)


    每个方法对应下注轮次中 7 种可能的下注中的每一种。


