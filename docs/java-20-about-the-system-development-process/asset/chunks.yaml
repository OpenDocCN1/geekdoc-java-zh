    An activity that in principle always takes place in parallel with the individual
    sprints is called `Product Backlog Grooming`. It is always about reviewing and
    adjusting items in `Product Backlog`, and typically includes adding details, adjusting
    estimates, and so on. It is `Product Owner` who is responsible for prioritizing
    the items in `Product Backlog`, and it is the `Development Team` that is responsible
    for estimating the items.


    Although it is not part of `SCRUM`, it is recommended that you plan a day off
    or two between each sprint, which you can use to read articles, attend courses
    or workshops or otherwise orientate yourself to new subjects, or you can simply
    go for a walk and enjoy the nature. Perhaps this idea may be difficult to sell
    to a manager, but studies shows that the time is actually well-done, partly in
    order to make progress in the project and partly to ensure that team participants
    stay up to date with the technology development. The idea supports `SCRUM`, where
    it is absolutely crucial that you are constantly product-oriented rather than
    activity-oriented.


    Another question is what you do at the end of a sprint if you find that some of
    the work is not done. Here the rules are quite accurate:


    1. Unfinished or undone elements (`stories`) are placed back on the `Product Backlog`.

    2. The `Product Owner` re-orders the backlog, where typically unfinished elements
    are placed at the top, but not necessarily.

    3. A story that is undone must not be resized to represent only the remaining
    undone work. The story that was worked on must not be split in and what was done
    and what was not done. A story is done or not.


    In general, it can be said that `SCRUM` includes the following artifacts:


    1. `Product Backlog`, that is an ordered list of all stories that might be needed
    in the final product.

    2. `Sprint Backlog`, that are selected stories from `Product Backlog` to be delivered
    through a sprint, along with the `Sprint Goal` and sprint plans for all stories
    in the `Sprint Backlog`.

    3. `Increment`, that is the set of all the `Product Backlog` stories completed
    so far in the project.

    4. The definition of `Done`, that is the understanding of what it means that a
    piece of work to be considered completed.

    5. `Monitoring Progress` towards a goal, that are the performance measurement
    and forecast for the whole project.

    6. `Monitoring Sprint Progress`, that is the performance measurement and forecasts
    for a single sprint.


    You should be aware that the literature regarding `SCRUM` defines the exact content
    of these artifacts and also typical tools that you can use.


    As a last comment on `SCRUM`, it is important to emphasize that the goal is to
    provide a framework for how you effectively can organize the development of a
    larger and complex (IT) system, and the method expresses the experience of professional
    developers in implementing complex development projects. On the other hand, `SCRUM`
    does not say anything about what the individual sprints should contain and how
    each team participant should perform the daily work, and here you must apply to
    what else you have learned about system development (for example, something of
    what is explained in this series of books) or better what is illustrated in the
    following chapter on extreme programming. In practice, you will combine a variety
    of systems development and programming techniques.


    ## 2.5 Extreme Programming


    `Extreme Programming`, also called `XP`, is a system development method that,
    as the name says, unlike the methods mentioned above, focuses on programming.
    You should not perceive `XP` as an alternative to, for example, Unified Process
    or `SCRUM`, but rather a recommendation for how to successfully complete the programming
    part of the individual iterations. `XP`, like the other system development methods,
    consists of a number of iterations where each iteration brings the project from
    one state to another. There are the same activities as in other methods, but in
    `XP`, the three activities `design`, `program` and `test` together form a single
    activity.


    The method is based on four main principles:


    1. `Heavy customer involvement`, where a representative of the user organization
    is included in the development team and continuously participates and actively
    contributes to the planning of the individual iterations and the various accept
    tests and to a large extent also conducts these tests.

    2. `Test-driven development`, where developers are required to write unit tests
    for each new feature before any of the code is written. In this way, a function
    can not be transferred for testing before all unit tests are performed with success
    (see the next chapter on test-driven development).

    3. `Pair programming`, where all code is written by two programmers, called a
    `driver` and a `navigator`. Both programmers are at the same computer. The `driver`
    writes the code while the `navigator` monitors the process, comes with suggestions,
    thinking about design and program quality and so on. Every half hour, they switch
    the two roles. The idea is quite simple, that two thinks better than one. Pair
    programming is of course less effective than two programmers working on each their
    code, but experience shows that code produced is of better quality and with far
    fewer errors.

    4. `Short iteration cycles and frequent releases,`, where you develop software
    in short iterations that do not extend beyond a few weeks. The goal is frequent
    releases that can be handed over to and in principle taken in use by the user
    organization. A release period spans no more than a few months and is performed
    over few iterations. The idea is that the user organization must experience progress
    and that something happens.


    As with all other system development methods, the goal of `XP` is doing better,
    and `XP` rightly considers the biggest issue in software development as risks.
    It is evident that schedules that do not hold increases error rates as projects
    grow bigger and more complex, and misunderstanding the task, which means that
    the product contains features that the customer does not demand at all, and at
    worst, one may risk that the project completely must be abandoned. `XP` tries
    to minimize risk by controlling four variables:


    1. `cost`

    2. `time`

    3. `quality`

    4. `features`


    where the latter might be the most important as a measure of what the program
    should be capable of, but the four variables are of course not independent and
    in order to meet the cost and time requirements, it can easily mean that it is
    necessary to quench either quality (what is always short-term) or features. The
    only thing new in these variables is that the method from the outset focuses on
    the four key areas and controls them.


    In addition to these control variables, participants in `XP` projects need to
    work from multiple core values, where I want to mention `communication`, where
    all participants commit to spreading valuable knowledge to the entire team. This
    can be achieved through relatively small development teams, like par programming,
    and collective ownership of the code also ensure effective communication.


    In addition, extreme programming defines 12 principles for the development process:


    1. `Planning`

    2. `Small releases at short intervals`

    3. `System metaphors`

    4. `Simple design`

    5. `Test`

    6. `Frequent refactorization`

    7. `Pair-programming`

    8. `Common ownership of the program code`

    9. `Continuous integration`

    10. `Affordable work rate`

    11. `An overall development team`

    12. `Common code standard`


    and to be successful with the method, it is considered crucial that these principles
    are respected.


    There is much more about `XP`, and much are written about `XP` and gained experience,
    and it all shows – at least if you ask the method’s advocates – that the method
    is particularly useful when the goal is to develop quality software.


