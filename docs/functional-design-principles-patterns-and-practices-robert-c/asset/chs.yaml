  \n## 那么模拟（Mocks）呢？\n\n`Mocking`（模拟）是 TDD 实践者使用的一种技术，用于将测试与系统的大部分区域离开来。实际上，他们创建了名为\
  \ `mocks`^(3) 的对象来代表这些部分，并使用里氏夫替换原则（LSP）用这些模拟对象替代它们。\n\n3。它们的正式名称是 `test-doubles`（测试替身），但在本文中，我将继续使用这种口语化的表达。\n\
  \n由于 LSP 被视为一种面向对象（OO）原则，而且 OO 语言中的模拟是基于多态接口的，因此“函数式语言不支持模拟”似乎已经变成了一个都市传说。\n\n但正如我们所看到的，LSP\
  \ 在函数式语言中的运作与在 OO 语言中一样好，而且多态接口通常非常容易创建。因此，以各种形式编写模拟的能力在函数式语言中完全不受阻碍。\n\n例如，这里来自我的\
  \ `more-speech`^(4) 应用程序的一个测试，它使用了两个模拟：\n\n4。 [`github.com/unclebob/more-speech`](https://github.com/unclebob/more-speech)\n\
  \n点击此处查看代码图片\n\n```\n(it \"adds an unrooted article id to a tab\"\n  (let [message-id\
  \ 1\n        messages {message-id {:tags []}}\n        event-context (atom {:text-event-map\
  \ messages})]\n    (reset! ui-context {:event-context event-context})\n    (with-redefs\
  \ [swing-util/add-id-to-tab (stub :add-id-to-tab)\n                  swing-util/relaunch\
  \ (stub :relaunch)]\n      (add-article-to-tab 1 \"tab\" nil)\n      (should-have-invoked\
  \ :relaunch)\n      (should-have-invoked :add-id-to-tab\n                      \
  \     {:with [\"tab\" :selected 1]}))))\n```\n\n不要太担心这个测试做了什么。只需查看 `with-redefs`\
  \ 语句即可。这个测试模拟了 `swing-util/add-id-to-tab` 和 `swing-util/relaunch` 函数，使用了具名的存根（stubs）。这些存根是完美的空操作（no-ops）。它们接受任意数量的参数并且不返回任何内容.^(5)。但它们会记住发生在它们身上的事情.^(6)。所以，在底部，我们看到\
  \ `:relaunch` 存根应该被调用，而 `:add-id-to-tab` 存根应该带有三个参数调用：`\"tab\"`、`:selected` 和 `1`。\n\
  \n5。有办法让它们返回数值，但这超出了本文的范围。如果你感兴趣，请查看 `speclj` 文档 ([`github.com/slagyr/speclj`](https://github.com/slagyr/speclj))。\n\
  \n6。从技术上讲，它们是间谍（spies）。\n\n## 基于属性的测试（Property-Based Testing）\n\n和函数式编程者在一起，最终一定会听到\
  \ QuickCheck 和基于属性的测试。遗憾的是，这个话题经常作为 TDD 的反论出现。我不会尝试去支持或反驳这一论点。相反，我想向你展示在 TDD 体系内基于属性的测试是非常强大的。\n\
  \n首先，什么是基于属性的测试？`Property-based testing`（属性测试）是一种验证和诊断技术，它采用了随机生成输入和非常强大的缺陷隔离策略。\n\
  \n假设我刚刚写了一个计算给定整数的质因数的函数：\n\n点击此处查看代码图片\n\n```\n(defn factors-of [n]\n  (loop [factors\
  \ [] n n divisor 2]\n    (if (> n 1)\n      (cond\n        (> divisor (Math/sqrt\
  \ n))\n        (conj factors n)\n        (= 0 (mod n divisor))\n        (recur (conj\
  \ factors divisor)\n               (quot n divisor)\n               divisor)\n \
  \       :else\n        (recur factors n (inc divisor)))\n      factors)))\n```\n\
  \n假设我也是使用 TDD 写了这个函数。以下是我的测试：\n\n点击此处查看代码图片\n\n```\n(defn power2 [n]\n  (apply *\
  \ (repeat n 2N)))\n\n(describe \"factor primes\"\n  (it \"factors 1 -> []\"\n  \
  \  (should= [] (factors-of 1)))\n  (it \"factors 2 -> [2]\"\n    (should= [2] (factors-of\
  \ 2)))\n  (it \"factors 3 -> [3]\"\n    (should= [3] (factors-of 3))))\n```\n\n\n\
  \n这样很棒。我可以随机生成大量输入，然后对输出进行属性检查。\n\n### 一种诊断技术\n\n但我曾把基于属性的测试称为一种诊断技术，不是吗？让我们来看一个更有趣的例子，我会向你们展示我的意思。\n\
  \n还记得我们上一节中的视频商店（Video Store）示例吗？让我们对它进行一些基于属性的测试。\n\n首先，请记得我们写了一个名为 `make-statement-data`\
  \ 的函数，它接收一个 `policy` 和一个 `rental-order`，并生成 `statement-data`，然后将其传递给我们的格式化器之一。这里是使用\
  \ `clojure.spec` 定义的 `rental-order` 类型规范：\n\n点击此处查看代码图片\n\n```\n(s/def ::name string?)\n\
  (s/def ::customer (s/keys :req-un [name]))\n(s/def ::title string?)\n(s/def ::type\
  \ #{:regular :childrens :new-release})\n(s/def ::movie (s/keys :req-un [::title\
  \ ::type]))\n(s/def ::days pos-int?)\n(s/def ::rental (s/keys :req-un [::days ::movie]))\n\
  (s/def ::rentals (s/coll-of ::rental))\n(s/def ::rental-order (s/keys :req-un [::customer\
  \ ::rentals]))\n```\n\n这并不难读。从下往上看：\n\n* `:rental-order` 是一个包含两个元素的 map：`:customer`\
  \ 和 `:rentals`。\n* `:rentals` 元素是 `:rental` 项目的集合。\n* `:rental` 是一个包含 `:days` 和\
  \ `:movie` 元素的 map。\n* `:days` 元素是一个正整数。\n* `:movie` 元素是一个包含 `:title` 和 `:type`\
  \ 的 map。\n* `:type` 是 `:regular`、`:childrens` 或 `:new-release` 之一。\n* `:title` 是一个字符串。\n\
  * `:customer` 是一个包含单个 `:name` 元素的 map。\n* `:name` 是一个字符串。\n\n有了这个类型规范，我们就可以编写一个生成器来产生符合该类型的租赁订单。首先，这些是生成器：\n\
  \n点击此处查看代码图片\n\n```\n(def gen-customer-name\n  (gen/such-that not-empty gen/string-alphanumeric))\n\
  \n(def gen-customer\n  (gen/fmap (fn [name] {:name name}) gen-customer-name))\n\n\
  (def gen-days (gen/elements (range 1 100)))\n\n(def gen-movie-type\n  (gen/elements\
  \ [:regular :childrens :new-release]))\n\n(def gen-movie\n  (gen/fmap (fn [[title\
  \ type]] {:title title :type type})\n            (gen/tuple gen/string-alphanumeric\
  \ gen-movie-type)))\n\n(def gen-rental\n  (gen/fmap (fn [[movie days]] {:movie movie\
  \ :days days})\n            (gen/tuple gen-movie gen-days))\n\n(def gen-rentals\n\
  \  (gen/such-that not-empty gen/vector))\n\n(def gen-rental-order\n  (gen/fmap (fn\
  \ [[customer rentals]]\n              {:customer :rentals})\n            (gen/tuple\
  \ gen-customer gen-rentals))\n\n(def gen-policy (gen/elements\n                \
  \  [(make-normal-policy)\n                   free-policy)]\n```\n\n我在这里不会解释 `clojure.check`\
  \ 的内部细节，但我会带你过一遍生成器的作用：\n\n* `gen-policy` 从两者中选择一个。\n* `gen-rental-order` 根据 `gen-customer`\
