  \ (apply set/union8 rumors)]\n      (map #(assoc % :rumors all-rumors) drivers)))\n\
  \n(defn spread-rumors [world]\n  (let [stops-with-drivers (get-stops world)\n  \
  \  (flatten10 (map merge-rumors drivers-by-stop))))\n\n(defn drive [world]\n  (->\
