  \n\n\n为了通过这一步，我们需要经过几个步骤。第一步是将 `rolls` 数组拆分成帧（frames）并对这些帧求和。最初，我们假设每帧只有两个掷：\n点击此处查看代码图片\n\
  \n```\n(defn to-frames [rolls]\n  (partition4 2 rolls))\n\n(defn add-frame [score\
  \ frame]\n\n(defn score [rolls]\n  (reduce add-frame 0 (to-frames rolls)))\n```\n\
  \n4。`partition` 函数将 `rolls` 列表拆分为一个对对列表。因此 `[1 2 3 4 5 6]` 变成了 `[[1 2][3 4][5 6]]`。\n\
  \n现在 `reduce` 函数发挥了它的作用。它循环遍历这些数对，并将它们累加成得分。\n这个更改让之前所有的测试都能通过，但仍然无法通过补中（spare）测试。为了通过该测试，我们必须对\
  \ `to-frames` 和 `add-frame` 函数添加特殊处理。我们的目标是将计算一帧所需的所有掷数数放入帧数据中。\n\n点击此处查看代码图片\n\n\
  ```\n(defn to-frames [rolls]\n  (let [frames (partition 2 rolls)\n        possible-bonuses6\
  \ (concat7 possible-bonuses [[0]])]\n    (map concat frames possible-bonuses)))\n\
  \n(defn add-frame [score frame-and-bonus]\n  (let [frame (take 2 frame-and-bonus)]\n\
  \    (if (= 10 (reduce + frame))\n      (+ score (reduce + frame-and-bonus))\n\n\
  (defn score [rolls]\n  (reduce add-frame 0 (to-frames rolls)))\n```\n\n5。`#(…)`\
  \ 形式创建了一个匿名函数。`%` 符号是该函数的参数。你也可以使用 `%n`，其中 `n` 是代表第 *n* 个参数的整数。所以 `#(take 1 %)`\
  \ 是一个返回包含参数第一个元素的列表的函数。\n\n\n7。`concat` 函数将列表连接在一起。因此 `(concat [1 2] [3 4])` 返回\
  \ `[1 2 3 4]`。\n\n仔细观察这段代码。里面有很多小巧思的技巧和变通方法。为什么呢？因为 Clojure 充满了许多精妙、诱人的小工具，你可以使用它们将数据转换成*几乎*你想要的格式，然后使用一些小技巧将数据操纵到*恰好*你想要的格式。如果你不小心，这些小技巧可能会开始主导代码。\n\
  \n例如，看看你是否能弄明白为什么我在 `to-frames` 中向 `concat` 函数传递了 `[[0]]`。^(8)另一个例子，问问自己为什么我用 `#(take\
  \ 1 %)` 而不是直接用 `first`。^(9)\n\n\n9。`(take 1 x)` 返回一个包含 `x` 中第一个元素的列表。`first` 返回第一个元素。\n\
  \n由于这段代码的复杂性，如果你在费力理解它，不要太担心。我在回看它时也感到很困难。所以……\n\n当这些小技巧泛滥时，是时候重新考虑解决方案了。因此我将解决方案重构为一个简单的\
  \ `loop`：\n\n\n```\n(defn to-frames [rolls]\n  (loop [remaining-rolls rolls\n  \
  \       frames []]\n    (cond\n      (empty? remaining-rolls)\n      frames\n  \
  \    (= 10 (reduce + (take 2 remaining-rolls)))\n      (recur (drop 2 remaining-rolls)\n\
  \             (conj frames (take 3 remaining-rolls)))\n      :else\n      (recur\
  \ (drop 2 remaining-rolls)\n             (conj frames (take 2 remaining-rolls))))))\n\
  \n  (+ score (reduce + frame)))\n\n(defn score [rolls]\n  (reduce add-frames 0 (to-frames\
  \ rolls)))\n```\n\n这看起来好多了。而且，它开始看起来有点像 Java 的解决方案了。下一个测试是全中：\n\n\n```\n(should=\
  \ 20 (score (concat [1 2] [3 4])))\n```\n\n这看起来好多了。而且，它开始看起来有点像 Java 的解决方案了。下一个测试是全中：\n\
  \n\n到目前为止，在这项对比分析中，我们还没有发现函数式编程优于面向对象（OO）编程的充分理由。所以，让我们来看一个稍微有趣一点的问题。\n\n面向对象诞生于\
  \ 1966 年，当时 Ole-Johan Dahl 和 Kristen Nygaard 对 `ALGOL-60` 语言进行了一些修改，以使其更适用于离散事件模拟。这种新语言命名为\
  \ `SIMULA-67`，被认为是第一种真正的面向对象编程语言。\n\n传说中他们当时正在模拟挪威的海上航运。\n\n那么，让我们对一个简单的离散事件模拟器进行对比分析吧。这应该让问题完全处于面向对象编程的优势范围内。一个很好的题目是“八卦的公交司机”（`Gossiping\
  \ Bus Drivers`） kata。\n[八卦的公交司机 题目](https://kata-log.rocks/gossiping-bus-drivers-kata)\n\
  \n给定 `n` 个司机，每位司机都有一个自己的环形站点路线，确定需要多少步才能让每位巴士司机已知的八卦被所有司机所知。只有当司机同时到达同一个站点时，他们才会交换八卦。\n\
  \n那么，假设 Bob 知道传卦 X，行驶路线为 `[p,q,r]`。Jim 知道传卦 Y，行驶路线为 `[s,t,u,p]`。Bob 和 Jim 什么时候能分享八卦？如果他们从时间\
  \ 0 开始，那么在时间 3 时，他们都会到达站点 `p`；记住，路线是环形的。\n\n该过程限制在 480 步内。\n当司机超过两个且路线更复杂时，这个问题就变得更有趣了。\n\
  \n### Java 解决方案\n\n我用 Java 写了该问题的解决方案。我从一种非常传统的面向对象分析和设计开始（参见[图 8.1]）。\n\n![](img/c08f001.jpg)\n\
  **图 8.1.** Java 版本的简单对象模型\n\n`Simulator` 持有多个 `Drivers`。每个 `Driver` 拥有一个 `Route`，每个\
  \ `Route` 包含多个 `Stops`。每个 `Stop` 有多个 `Drivers`，每个 `Driver` 拥有多个 `Rumors`。\n\n这是一个相当简单的对象模型。甚至没有隐含任何继承或多态。因此，它的实现应该非常直接。\n\
  \n当然，我使用 TDD（测试驱动开发）编写了 Java 代码。这里是测试用例。你可以看到，它们相当冗长；但至少它们都位于同一个测试类中。\n\n\n[点击此处查看代码图片]\n\
  \n```\npackage gossipingBusDrivers;\n\nimport org.junit.Before;\n\nimport static\
  \ org.hamcrest.MatcherAssert.assertThat;\nimport static org.hamcrest.collection.IsEmptyCollection.empty;\n\
  \nimport static org.hamcrest.collection.\n  IsIterableContainingInAnyOrder.containsInAnyOrder;\n\
  import static org.junit.Assert.assertEquals;\npublic class GossipTest {\n  private\
  \ Stop stop1;\n  private Stop stop2;\n  private Stop stop3;\n  private Route route1;\n\
  \  private Route route2;\n  private Rumor rumor1;\n  private Rumor rumor2;\n  private\
  \ Driver driver1;\n  private Driver driver2;\n\n  @Before\n  public void setUp()\
  \ {\n    stop1 = new Stop(\"stop1\");\n    stop2 = new Stop(\"stop2\");\n    route1\
  \ = new Route(stop1, stop2);\n    route2 = new Route(stop1, stop2, stop3);\n   \
  \ rumor1 = new Rumor(\"Rumor1\");\n    rumor2 = new Rumor(\"Rumor2\");\n    rumor3\
  \ = new Rumor(\"Rumor3\");\n    driver1 = new Driver(\"Driver1\", route1, rumor1);\n\
  \    driver2 = new Driver(\"Driver2\", route2, rumor2, rumor3);\n\n  @Test\n  public\
  \ void driverStartsAtFirstStopInRoute() throws Exception {\n    assertEquals(stop1,\
  \ driver1.getStop());\n  }\n\n  @Test\n    driver1.drive();\n    assertEquals(stop2,\
  \ driver1.getStop());\n  }\n\n  @Test\n  public void driverReturnsToStartAfterLastStop()\n\
  \  throws Exception {\n    driver1.drive();\n  assertEquals(stop1, driver1.getStop());\n\
  \  }\n\n  @Test\n  public void firstStopHasDriversAtStart() throws Exception {\n\
  \    assertThat(stop1.getDrivers(), containsInAnyOrder(driver1,\n              \
  \                                        driver2));\n  }\n\n  @Test\n  public void\
  \ multipleDriversEnterAndLeaveStops() throws Exception {\n    assertThat(stop1.getDrivers(),\
  \ containsInAnyOrder(driver1,\n                                                \
  \      driver2));\n    assertThat(stop2.getDrivers(), empty());\n    assertThat(stop3.getDrivers(),\
  \ empty());\n)\n\n\n\n\n### Driver\n\n\n```java\npackage gossipingBusDrivers;\n\n\
  import java.util.Arrays;\nimport java.util.HashSet;\nimport java.util.Set;\npublic\
  \ class Driver {\n  private String name;\n  private Route route;\n  private int\
  \ stopNumber = 0;\n  private Set<Rumor> rumors;\n\n  public Driver(String name,\
  \ Route theRoute,\n    this.name = name;\n    route = theRoute;\n    rumors = new\
  \ HashSet<>(Arrays.asList(theRumors));\n    route.stopAt(this, stopNumber);\n  }\n\
  \n  public Stop getStop() {\n  }\n\n  public void drive() {\n    route.leave(this,\
  \ stopNumber);\n    stopNumber = route.getNextStop(stopNumber);\n    route.stopAt(this,\
  \ stopNumber);\n  }\n  public Set<Rumor> getRumors() {\n    return rumors;\n  }\n\
  \n  public void addRumors(Set<Rumor> newRumors) {\n    rumors.addAll(newRumors);\n\
  \  }\n}\n\n### Route\n\n点击此处查看代码图片\n\n```java\npackage gossipingBusDrivers;\npublic\
  \ class Route {\n  private Stop[] stops;\n\n  public Route(Stop... stops) {\n  \
  \  this.stops = stops;\n  }\n\n    return stops[stopNumber];\n  }\n\n  public int\
  \ getNextStop(int stopNumber) {\n    return (stopNumber + 1) % stops.length;\n \
  \ }\n\n    stops[stopNumber].addDriver(driver);\n  }\n\n  public void leave(Driver\
  \ driver, int stopNumber) {\n    stops[stopNumber].removeDriver(driver);\n  }\n\
  }\n\n### Stop\n\n点击此处查看代码图片\n\n```java\npackage gossipingBusDrivers;\n\nimport java.util.HashSet;\n\
  import java.util.List;\nimport java.util.Set;\n\npublic class Stop {\n  private\
  \ String name;\n  private List<Driver> drivers = new ArrayList<>();\n  public Stop(String\
  \ name) {\n    this.name = name;\n  }\n\n  public String toString() {\n    return\
  \ name;\n  }\n  public List<Driver> getDrivers() {\n    return drivers;\n  }\n\n\
  \  public void addDriver(Driver driver) {\n    drivers.add(driver);\n  }\n\n   \
  \ drivers.remove(driver);\n  }\n\n  public void gossip() {\n    Set<Rumor> rumorsAtStop\
