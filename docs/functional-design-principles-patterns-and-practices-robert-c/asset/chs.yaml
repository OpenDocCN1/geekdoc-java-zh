  ```\n\n\n\n\n但现在我被 `world` 中的 `water` 依赖困扰着。有一个术语可以描述我对它的感觉。那个词是*恶心*（icky）。那个依赖在某种程度上是*错的*。\n\
  \n我需要洗个澡。我在洗澡时能解决很多问题。\n\n### 洗澡能解决问题\n\n好了，我洗完澡回来了，这是我在喷淋头下对自己进行的对话。\n\n“在 `world`\
  \ 中创建 `water` 感觉*恶心*。我的意思是，我只是把 `world` 分成了两部分，因为创建 `fish` 导致了循环。所以创建 `water` 也可能导致循环。但等等，这都是关于创建的。也许我需要一个工厂！对，一个名为\
  \ `cell-factory` 的抽象工厂，它将接受像 `:fish` 和 `:water` 这样的不透明令牌，然后. .（噢！）。. . 以及 `:default-cell`。是的，然后.\
  \ . 等等，为什么我需要一个全新的工厂？为什么 `world` 不能就是工厂呢？没错！这就是`工厂方法`（Factory Method）模式。这就对了！”\n\
  \n此设计的 UML 图（在 图 17.6 中）非常有启发性。\n\n一个架构边界出现了。所有的依赖都向高层侧跨越，遵循依赖规则（Dependency Rule）。我可能在实际架构中不会这个边界，但如果我需要，它就在那里。\n\
  \n![](img/c17f006.jpg)\n\n**图 17.6.** 使用工厂方法模式的 Wa-Tor\n\n现在代码看起来是：\n\n点击此处查看代码图像\n\
  \n```\n(ns wator.world\n  (:require [clojure.spec.alpha :as s]\n            [wator\n\
  \             [cell :as cell]\n             [water :as water]]))\n\n(s/def ::location\
  \ (s/tuple int? int?))\n(s/def ::cell #(contains? % ::cell/type))\n(s/def ::cells\
  \ (s/map-of ::location ::cell))\n(s/def ::bounds ::location)\n(s/def ::world (s/and\
  \ (s/keys :req [::cells ::bounds])\n                      #(= (::type %) ::world)))\n\
  \n(defmulti tick ::type)\n(defmulti make-cell (fn [factory-type cell-type] factory-type))\n\
  (defn make [w h]\n  {:post [(s/valid? ::world %)]}\n  (let [locs (for [x (range\
  \ w) y (range h)] [x y])\n        default-cell (make-cell ::world :default-cell)\n\
  \        loc-water (interleave locs (repeat default-cell))\n        cells (apply\
  \ hash-map loc-water)]\n    {::type ::world\n     ::cells cells\n     ::bounds [w\
  \ h]}))\n;. . .\n\n———————\n\n(ns wator.world-imp\n  (:require [wator\n        \
  \     [world :as world :refer :all]\n             [animal :as animal]\n        \
  \     [fish :as fish]\n                    [shark :as shark]\n             [water\
  \ :as water]]))\n\n(defmethod world/tick ::world/world [world]\n  (-> (make 2 1)\n\
  \        (set-cell [0 0] (water/make))\n        (set-cell [0 1] (animal/set-age\
  \ (fish/make) 1))))\n\n(defmethod world/make-cell ::world/world [world cell-type]\n\
  \  (condp = cell-type\n    :default-cell (water/make)\n    :water (water/make)\n\
  \    :fish (fish/make)\n    :shark (shark/make)))\n```\n\n`make-cell` 中的 `factory-type`\
  \ 仅作为 `::world` 传入。这允许 `defmethod ::world/world` 来解析它。\n\n我对这个改变寄予很大期望。请注意，整个变化是由一个测试驱动的，我让这个测试通过\
  \ `tick` 中一个虚拟实现来通过，这再次提醒了我们 TDD 是一种设计技术。\n\n好了，现在让那个虚拟实现失败吧。这是失败的测试：\n\n点击此处查看代码图像\n\
  \n```\n(it \"moves a fish around each tick\"\n  (doseq [scenario\n          [{:dimension\
  \ [2 1] :starting [0 0] :ending [1 0]}\n           {:dimension [2 1] :starting [1\
  \ 0] :ending [0 0]}\n           {:dimension [1 2] :starting [0 0] :ending [0 1]}\n\
  \           {:dimension [1 2] :starting [0 1] :ending [0 0]}]]\n    (let [fish (fish/make)\n\
  \          {:keys [dimension starting ending]} scenario\n          [h w] dimension\n\
  \          small-world (-> (world/make h w)\n                          (world/set-cell\
  \ starting fish)\n                          (world/tick))\n          vacated-cell\
  \ (world/get-cell small-world starting)\n          occupied-cell (world/get-cell\
  \ small-world ending)]\n      (should (water/is? vacated-cell))\n      (should (fish/is?\
  \ occupied-cell))\n      (should= 1 (animal/age occupied-cell)))))\n```\n\n我创建了四个可能的\
  \ 1x2 场景，并确保 `world` 在 `tick` 之后得到了正确的更新。\n\n让它通过迫使我再次更改了设计。`animal/move`、`animal/reproduce`\
  \ 和 `cell/tick` 函数必须返回一个 `[from to]` 列表，其中每个元素都是包含 `{loc cell}` 的单元素 map。看看 `world-imp`\
  \ 你就知道为什么了：\n\n点击此处查看代码图像\n\n```\n(ns wator.world-imp\n  . . .)\n\n(defmethod world/tick\
  \ ::world/world [world]\n  (let [cells (::world/cells world)]\n    (loop [locs (keys\
