  \n—Janet A. Carr，独立 Clojure 顾问\n\n# 前言\n\n这本书是写给处于战壕中的程序员的，他们想要学习如何使用函数式编程语言来解决实际问题。因此，我不会花费大量时间在函数式编程更具理论性的方面，例如\
  \ `Monads`（单子）、`Monoids`（半群元）、`Functors`（函子）、`Categories`（范）等。并不是说这些观点无效、没有价值或无关；而是它们并不经常影响程序员的日常生活。这是因为它们已经被烘焙”进了常用语言、库和框架的“蛋糕”里。如果你对函数式理论感兴趣，我推荐\
  \ Mark Seemann 的著作。\n这本书关于在为真实客户构建真实系统的日常工作中，如何以及为什么要使用函数式编程。在接下来的页面中，我们将对比 `Java`\
  \ 等面向对象的语言中常见的编码结构与 `Clojure` 等函数式语言中常见的结构。\n\n我特别选择了这两种语言，是因为 `Java` 被广为人知和使用，而\
  \ `Clojure` 学习极其简单。\n\n## 函数式编程与过程化编程简史\n1936 年，两位数学家艾兰·图灵（Alan Turing）和阿隆佐·丘奇（Alonzo\
  \ Church）独立解决了大卫·希尔伯特著名的挑战之一：`可判定性问题`（The Decidability Problem）。本介绍的范围不足以详细描述这个问题，只能说它与寻找整数公式的通用解有关。这与我们有关，，因为数字计算机中的每个程序都是一个整数公式。\n\
  \n[1] 丢番方程（Diophantine equations）。\n\n这两个人独立证明了不存在这样的通用解，他们证明了某些整数永远无法通过比自身更小的整数公式计算出来。\n\
  这种说的另一种表达是，某些数字是任何计算机程序无法计算的。事实上，这就是艾兰·图灵采取的方法。在他著名的 1936 年的论文中，图灵发明了数字计算机，然后证明了某些数字即使在无限的时间空间内也是无法计算的。\n\
  \n[2] A. M. Turing, “On Computable Numbers, with an Application to the Entscheidungsproblem”\
  \ (May 1936).\n\n\n另一方面，丘奇通过他发明的 `lambda calculus`（λ 演算）——一种处理函数的数学形式——得出了相同的结论。通过在其形式的逻辑中进行操作，他证明了存在某些无法解决的逻辑问题。\n\
  \n图灵的发明是所有现代数字计算机的祖先。每台数字计算机在任何意义上都是一台（有限的）图灵机。每个在数字计算机上执行过的程序在任何意义上都是图灵机程序。\n\n\
  丘奇和图灵后来合作证明了图灵和丘奇的方法是等价的。图灵机中的每个程序都可以在 `lambda calculus` 中表示，反之亦然。\n函数式编程在任何意义上都是在\
  \ `lambda calculus` 中进行编程。\n\n所以这两种编程风格在数学意义上是等价的。任何程序都可以使用过程化（`Turing`）风格或函数式（`Church`）风格编写。我们在书中要检查的并不是等价性，而是使用函数式方法如何影响我们程序的结构和设计。我们将试图确定这些不同的结构和设计在某种意义是否优于或劣于使用图灵方法产生的结构。\n\
  \n\n我为这本书选择 Clojure，是因为学习一种新语言和一种新范式是一项双倍困难的任务。因此，我试图通过一种足够简单的语言来简化这项任务，使其简单到不会干扰学习函数式编程和函数式设计。\n\
  \n`Clojure` 在语义上很丰富，但在语法上极其简单。这意味着语言本身的语法非常简单，学习时只需要很少的努力。`Clojure` 的学习曲线全在语义侧。库和惯用法需要大量的努力来内化；但语言本身几乎不需要任何努力。我希望这本书能给你提供一种学习和欣赏函数式编程的方法，同时不会被新语言的语法所分心。\n\
  \n\n[4] 到最后，你会认为我是个骗子。\n\n我在书中使用的测试框架是 `speclj`。随着章节的进行，你会看到越来越多的它。它与其他流行的测试框架非常相似，所以随着页面的翻页，你不应该难以熟悉它的各种功能。\n\
  \n[5] `https://github.com/slagyr/speclj`\n\n\n这本书的主要重点是描述用于函数式构建的系统的设计原则和架构。为了这一目标，我将采用统一建模语言（UML）图，并引用软件设计的\
  \ `SOLID` 原则、设计模式以及整洁架构（Clean Architecture）的概念。不要担心，我将在过程中进行解释，并在你需要时引用许多外部参考文献。\n\
  \n[6] Robert C. Martin, *Clean Architecture* (Pearson 2017), p. 57.\n\n[7] Erich\
  \ Gamma, Richard Helm, Ralph Johnson, and John Vlissides, *Design Patterns: Elements\
  \ of Reusable Object-Oriented Software* (Addison-Wesley, 1994).\n\n\n\n\n许多人认为面向对象编程和函数式编程是不兼容的。接下来的内容将证明事实并非如此。你在这里看到的程序、设计和架构将是函数式和面向对象概念的混合体。根据我的经验，我坚坚定地认为，这两种风格是完全兼容的，优秀的程序员可以并且应该将它们结合起来。\n\
  \n\n在本文中我将使用 `functional`（函数式）一词。我会对其进行定义并详细阐述。随着章节的推进，我也会对其进行一些灵活处理。有些示例虽然是用函数式语言和按照函数式风格编写的，但并不是\
  \ `purely`（纯粹）函数式的。在大多数此类情况下，我会给 `functional` 一词加上引号，并使用脚注来指出我所做的灵活处理。\n\n为什么要进行这种处理呢？因为这是一本关于实用主义的书，而非理论。我感兴趣的是从函数式\
  \ `style`（风格）中提取益处，而不是严格遵循某种理想。例如，正如我们在第一章中看到的，从用户获取输入的“函数”并不是纯函数式的。然而，我会根据需要使用此类“函数”。\n\
