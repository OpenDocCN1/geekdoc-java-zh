  ## 献辞\n\n给我的家人，我对他们的爱解释了我所做的一切。\n\n首先，送给我那相守 50 年的妻子，那位美丽的 16 岁少女，有着闪烁的棕色眼睛和长黑发，她俘获了我的心并守护了它半个世纪。她依然像我遇到她的第一天一样美丽。那双闪烁的棕色眼睛和飘动的长发每天都让我着迷。我孩子的母亲。我生活的支柱。我唯一的爱。\n\
  \n给 Angela，我美丽的长女，永远忠诚的女儿，她那极具感染力的微笑会融化你的心，并让你相信世界一切完好。我曾问她她想成为什么。她的回答是“有趣！”她随后实现并远超了这一目标。她对生活无限的热情感染了她遇到的每一个人。她嫁给了\
  \ Matt，一个优秀、勤奋且诚实（且有趣）的男人。他们两人将共同的乐趣变成了一种充满山地车狂热的丰收事业。他们住在林木茂的山丘上，为我生了三个美丽、聪明且有才的女儿供我宠爱。\n\
  \n给 Micah，我的次子，充满激情的儿子。他继承了母亲那闪烁的棕色眼睛。我曾问他他想成为什么。他说：“富有！”我很高兴地报告，他确实过得非常好。他花了十年的时间与我共事，创立了自己的软件公司，并在几年后卖掉了它。接着他花了一年在车库里造了一架飞机。现在他正经营着另一家软件公司。他的成功很大归功于他的妻子\
  \ Angelique，一位美丽、勤奋且深性的女性。他们抚养了两个出色的年轻人。\n\n给 Gina，我的第三女，带给我无尽惊喜。如果一个女人可以比我的妻子更漂亮，那么\
  \ Gina 就是那个女人。她成为了一名成功的化学工程师，处理铀、氟和浓氢氧化物等物质。她戴上安全帽，爬上反应容器，管理着化学操作员团队。她嫁给了 Keith，一位优秀、勤奋且诚实的机械工程师。他们交换着在大型复杂工厂冒险的故事。他们繁育了两个孩子——一男一女孩——这是我的孩子中第一个享有这一特权幸运的家庭。\n\
