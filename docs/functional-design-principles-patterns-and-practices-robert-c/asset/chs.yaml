  \ 2x1 的 `world`，其中有一个 `shark` 邻着 `fish`。经过一个 `tick` 后，`shark` 应该出现在 `fish` 之前的位置，而\
  \ `water` 应该出现在 `shark` 之前的位置，并且 `shark` 的 `::health` 应该增加。\n\n为了让这段代码通过，我被迫放弃了向\
  \ `animal/tick` 的委托，因为 `shark` 应该先尝试 `reproduce`，然后尝试 `eat`，最后才尝试 `move`：\n\n点击此处查看代码图片\n\
  \n```\n(ns wator.shark . ....)\n\n(defn eat [shark loc world]\n  (let [neighbors\
  \ (world/neighbors world loc)\n        fishy-neighbors (filter #(fish/is?\n    \
  \                              (world/get-cell world %))\n                     \
  \           neighbors)]\n    (if (empty? fishy-neighbors)\n      nil\n      [{loc\
  \ (water/make)}\n       {(rand-nth fishy-neighbors) (feed shark)}]))\n  )\n\n(defmethod\
  \ cell/tick ::shark [shark loc world]\n  (if (= 1 (health shark))\n    [nil {loc\
  \ (water/make)}]\n    (let [aged-shark (-> shark\n                         (animal/increment-age)\n\
  \                         (decrement-health))]\n      (if-let [reproduction (animal/reproduce\n\
  \                              aged-shark loc world)]\n        reproduction\n  \
  \      (if-let [eaten (eat aged-shark loc world)]\n          eaten\n          (animal/move\
  \ aged-shark loc world))))))\n```\n\n这一切都很顺利地完成了。我们已经渡过了设计的瓶颈，现在正在收获成果。\n\n建模人员告诉我们，鲨只有在健康值高于阈值时才会繁殖。让我们测试一下。事实上，让我们先进行这个更改^(18)，看看哪些测试会报错：\n\
