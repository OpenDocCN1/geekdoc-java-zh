  \n你可能已经注意到 `polygon` 函数似乎并不是函数式的，因为它没有从输入中产生返回值。相反，它具有在屏幕上绘图的副作用。此外，每条命令都会改变乌龟的状态。因此，`turtle-graphics`\
  \ 程序不是函数式的。\n\n尽管如此，`turtle-graphics` 框架是“函数式的”。或者更准确地说，它达到了 GUI 程序所能达到的最大函数化程度。（8)）毕竟，GUI\
  \ 程序的目的就是改变屏幕的状态。\n\n8。尽管你可能觉得这个很有意思：https://fsharpforfunandprofit.com/posts/13-ways-of-looking-at-a-turtle/](https://fsharpforfunandprofit.com/posts/13-ways-of-looking-at-a-turtle/)。\n\
  \n`turtle-graphics` 框架从配置和调用 Quil 开始：\n\n点击此处查看代码图像\n\n```\n(defn ^:export -main\
  \ [& args]\n  (q/defsketch turtle-graphics\n               :title \"Turtle Graphics\"\
  \n               :size [1000 1000]\n               :setup setup\n              \
  \ :update update-state\n               :draw draw-state\n               :features\
  \ [:keep-on-top]\n               :middleware [m/fun-mode])\n  args)\n```\n\n我在这里不会对\
  \ Quil 进行完整的教程，但有几点我应该指出。请注意 `:setup`、`:update` 和 `:draw` 元素。每个元素指向一个函数。\n\n`setup`\
  \ 函数将在程序开始时调用一次。\n\n`draw-state` 函数每秒会被调用 60 次以刷新屏幕。屏幕上应该显示的所有内容必须由 `draw` 函数绘制。屏幕不记得任何东西。\n\
  \n`update-state` 函数将在 `draw-state` 函数之前被调用。这个函数用于改变正在绘制的内容的状态。将其想象成将元素移动到未来 1/60\
  \ 秒的函数。\n\n把它想象成一个非常简单的循环：\n\n点击此处查看代码图像\n\n```\n(loop [state (setup)]\n  (draw-state\
  \ state)\n  (recur (update-state state)))\n```\n\n如果你将其认为一个尾递归循环，那么屏幕的内容就是尾递归的值。因此，尽管我们正在改变屏幕的内容，但我们是在递归的尾部进行操作，在那里改变是无害的。（9)）所以，虽然不是纯函数式的，但它和任何支持尾调用优化（TCO）的系统（10)）一样函数式。\n\
  \n9。大多无害。\n\n10。记得我们在第 1 章中关于尾调用优化的讨论。\n\n这是我的 `setup` 函数：\n\n点击此处查看代码图像\n\n```\n\
  (defn setup []\n  (q/frame-rate 60)\n  (q/color-mode :rgb)\n  (let [state {:turtle\
  \ (turtle/make)\n               :channel channel}]\n    (async/go\n      (turtle-script)\n\
  \      (prn \"Turtle script complete\"))\n    state))\n```\n\n这看起来非常简单。它将帧率设置为 60fps，将颜色模式设置为\
  \ RGB，并创建了将传递给 `update-state` 和 `draw-state` 的 `state` 对象。\n\n`async/go` 函数启动了一个新的轻量级线程，我们的\
  \ `turtle-script` 将其中执行。\n\n`state` 对象由 `channel` 和 `turtle` 组成。我们稍后讨论 `channel`。现在，让我们关注\
  \ `turtle`：\n\n点击此处查看代码图像\n\n```\n(s/def ::position (s/tuple number? number?))\n\
  (s/def ::heading (s/and number? #(<= 0 % 360)))\n(s/def ::velocity number?)\n(s/def\
  \ ::distance number?)\n(s/def ::omega number?)\n(s/def ::angle number?)\n(s/def\
  \ ::weight (s/and pos? number?))\n(s/def ::state #{:idle :busy})\n(s/def ::pen #{:up\
  \ :down})\n(s/def ::pen-start (s/or :nil nil?\n                         :pos (s/tuple\
  \ number? number?)))\n(s/def ::line-start (s/tuple number? number?))\n(s/def ::line-end\
  \ (s/tuple number? number?))\n(s/def ::line (s/keys :req-un [::line-start ::line-end]))\n\
  (s/def ::lines (s/coll-of ::line))\n(s/def ::visible boolean?)\n(s/def ::speed (s/and\
  \ pos? number?))\n```\n\n\n\n```clojure\n(defn update-position\n  [{:keys [position\
  \ velocity heading distance] :as turtle}]\n  (let [step (min (q/abs velocity) distance)\n\
  \        distance (- distance step)\n        step (if (neg? velocity) (- step) step)\n\
  \        radians (q/radians heading)\n        [x y] position\n        vx (* step\
  \ (Math/cos radians))\n        vy (* step (Math/sin radians))\n        position\
  \ [(+ x vx) (+ y vy)]]\n    (assoc turtle :position position\n                 \
  \ :distance distance\n                  :velocity (if (zero? distance) 0.0 velocity))))\n\
  \n(defn update-heading [{:keys [heading omega angle] :as turtle}]\n  (let [angle-step\
  \ (min (q/abs omega) angle)\n        angle (- angle angle-step)\n        angle-step\
  \ (if (neg? omega) (- angle-step) angle-step)\n        heading (mod (+ heading angle-step)\
  \ 360)]\n    (assoc turtle :heading heading\n                  :angle angle\n  \
  \                :omega (if (zero? angle) 0.0 omega))))\n\n(defn make-line [{:keys\
  \ [pen-start position weight]}]\n  {:line-start pen-start\n   :line-end position\n\
  \   :line-weight weight})\n\n(defn update-turtle [turtle]\n  {:post [(s/assert ::turtle\
  \ %)]}\n  (if (= :idle (:state turtle))\n    turtle\n    (let [{:keys [distance\n\
  \                  state\n                  angle\n                  lines\n   \
  \               position\n                  pen\n                  pen-start] :as\
  \ turtle}\n          (-> turtle\n              (update-position)\n             \
  \ (update-heading))\n          done? (and (zero? distance)\n                   \
  \  (zero? angle))\n          state (if done? :idle state)\n          lines (if (and\
  \ done? (= pen :down))\n                  (conj lines (make-line turtle))\n    \
  \              lines)\n          pen-start (if (and done? (= pen :down))\n     \
  \                 position\n                      pen-start)]\n      (assoc turtle\n\
  \             :state state\n             :lines lines\n             :pen-start pen-start))))\n\
  ```\n\n注意 `update-turtle` 拥有一个 `:post` 条件，用于在更新后检查乌的类型。当你更新一个大型结构时，如果知道自己没有搞乱其中的某个小部分，这种感觉很棒。\n\
  \n如果 `turtle` 的 `:state` 为 `:idle`，意味着它既不在移动也不旋转，那么我们就不进行任何更改。否则，我们会更新 `turtle`\
  \ 的位置和朝向，然后对其内部进行*解构*（destructure*）。当当前动画运动中剩余的距离和角度为零时，我们就完成了。如果任务完成，我们将 `:state`\
  \ 设置为 `:idle`。\n\n如果我们完成了任务且笔处于下笔状态（:down），则会将正在绘制的线条添加到之前的线条列表中，并更新 `pen-start`\
  \ 为当前位置，为下一条线条做准备。\n\n更新位置和朝向是简单的函数，它们执行必要的三角计算，将乌放置在适当的位置和方向上。它们都使用乌的 `:velocity`\
  \ 来调整每次更新时步进的大小。\n\n现在来处理命令部分：\n\n点击此处查看代码图片\n\n```clojure\n(defn handle-commands\
  \ [channel turtle]\n  (loop [turtle turtle]\n    (let [command (if (= :idle (:state\
  \ turtle))\n                    (async/poll! channel)\n                    nil)]\n\
  \      (if (nil? command)\n        turtle\n        (recur (turtle/handle-command\
  \ turtle command))))))\n```\n\n如果乌是 `:idle`，那么我们就准备好接收命令了。因此我们轮询 `channel`。如果 `channel`\
  \ 上有命令，通过调用 `turtle/handle-command` 处理它，然后重复直到 `channel` 上没有剩余为止。\n\n处理每个命令非常直接：\n\
  \n点击此处查看代码图片\n\n```clojure\n(defn pen-down [{:keys [pen position pen-start] :as\
  \ turtle}]\n  (assoc turtle :pen :down\n                :pen-start (if (= :up pen)\
  \ position pen-start)))\n\n(defn pen-up [{:keys [pen lines] :as turtle}]\n  (if\
  \ (= :up pen)\n    turtle\n    (let [new-line (make-line turtle)\n          lines\
  \ (conj lines new-line)]\n      (assoc turtle :pen :up\n                    :pen-start\
  \ nil\n                    :lines lines))))\n\n(defn forward [turtle [distance]]\n\
  \  (assoc turtle :velocity (:speed turtle)\n                :distance distance\n\
  \                :state :busy))\n\n(defn back [turtle [distance]]\n  (assoc turtle\
  \ :velocity (- (:speed turtle))\n                :distance distance\n          \
  \      :state :busy))\n\n(defn right [turtle [angle]]\n  (assoc turtle :omega (*\
  \ 2 (:speed turtle))\n                :angle angle\n                :state :busy))\n\
  \n(defn left [turtle [angle]]\n  (assoc turtle :omega (* -2 (:speed turtle))\n \
  \               :angle angle\n                :state :busy))\n\n(defn hide [turtle]\n\
  \  (assoc turtle :visible false))\n\n(defn show [turtle]\n  (assoc turtle :visible\
  \ true))\n\n(defn weight [turtle [weight]]\n  (assoc turtle :weight weight))\n\n\
  (defn speed [turtle [speed]]\n  (assoc turtle :speed speed))\n\n(defn handle-command\
  \ [turtle cmd]\n  (condp cmd\n    :forward (forward turtle)\n    :back (back turtle)\n\
  \    :right (right turtle)\n    :left (left turtle)\n    :pen-down (pen-down turtle)\n\
  \    :pen-up (pen-up turtle)\n    :hide (hide turtle)\n    :show (show turtle)\n\
  \    :weight (weight turtle)\n    :speed (speed turtle)))\n```\n\n\n\n\n你可能不熟悉我在这里使用的电话术语。事实上，如果你是在\
  \ 2000 年之后出生，你可能对电话本身都不熟悉。所以，出于历史和怀旧的角度，让我带你走一遍这个过程。\n\nBob 想给 Alice 打电话。Bob 拿起听筒^(1)\
  \ 并将其放在耳边。电话公司（telco）向听筒发送一个拨拨号音^(2)。听到该音调后，Bob 拨号^(3) Alice 的号码。电话公司随后向 Alice 的手机发送一个铃响电压^(4)，向\
  \ Bob 的听筒发送一个回铃音^(5)。Alice 听到手机响铃声并拿起听筒。电话公司接通了 Bob 和 Alice，Alice 对 Bob 说了“你好”。\n\
  \n- 1。 20 世纪初的电话有一个挂钩可以挂听筒。到 20 世纪 60 年代，挂钩被放置听筒的底座取代；但它仍然被称为 hook。\n- 2。 这是一个非常容易识别的声音，意味着电话系统已准备好让你拨打想要通话的号码。\n\
  - 3。 动词 `dial` 意味着输入电话号码。在 20 世纪 60 年代，这是通过使用电话上的旋转盘来实现的。\n- 4。在美国为 90 伏。\n- 5。\
  \ 另一个非常独特的声音，旨在等待被叫电话接听期间让呼叫者。。在这个场景中有三个有限状态机在运行：Bob、telco 和 Alice。Bob 和 Alice 分别运行\
  \ 图 15.2 所示的用户状态机^(6)。\n\n![](img/c15f002.jpg)\n\n**图 15.2.** 用户状态机\n\n- 6。 这些状态机经过缩写以保持简单。实际上，所有状态都有返回到\
  \ Idle 的转换。\n\nTelco 状态机在 图 15.3 所示。\n\n![](img/c15f003.jpg)\n\n**图 15.3.** Telco\
  \ 状态机\n\n在这些图中，`->` 符号意味着向另一个状态机发送相应的事件。\n\n所以，当 Bob 决定打电话（来自 Idle 状态的 call 事件）时，用户状态机向\
  \ Telco 发送 off-hook 事件。当 Telco 处于 Waiting for Dial（等待拨号）状态并接收到来自用户的 `Dial` 事件时，它会向相应的的用户状态机发送\
  \ `Ring` 和 `Ringback` 事件。\n\n如果你仔细研究这些图，你应该能够看到状态机和消息是如何交互以允许 Bob 拨通给 Alice 的的。\n\
  \n我们可以非常简单地用 Clojure 编写这些状态机：\n\n点击此处查看代码图片\n\n```\n(def user-sm\n  {:idle {:call\
  \ [:calling caller-off-hook]\n          :ring [:waiting-for-connection callee-off-hook]\n\
  \          :disconnect [:idle nil]}\n   :calling {:dialtone [:dialing dial]}\n \
  \  :dialing {:ringback [:waiting-for-connection nil]}\n   :waiting-for-connection\
  \ {:connected [:talking talk]}\n   :talking {:disconnect [:idle nil]}})\n\n(def\
  \ telco-sm\n  {:idle {:caller-off-hook [:waiting-for-dial dialtone]\n          :hangup\
  \ [:idle nil]}\n   :waiting-for-dial {:dial [:waiting-for-answer ring]}\n   :waiting-for-answer\
  \ {:callee-off-hook\n                        [:waiting-for-hangup connect]}\n  \
  \ :waiting-for-hangup {:hangup [:idle disconnect]}})\n```\n\n每个状态机简单都是状态的哈希映射（hash\
  \ map），每个状态都包含一个事件的哈希映射，指定了新状态和要执行的操作。\n\n所以当 `user-sm` 处于 `:idle` 状态并获取到 `:call`\
  \ 事件时，它转换到 `:calling` 状态并调用 `caller-off-hook` 函数。\n\n这些状态机可以通过以下 `transition` 函数执行：\n\
  \n点击此处查看代码图片\n\n```\n(defn transition [machine-agent event event-data]\n  (swap!\
  \ log conj (str (:name machine-agent) \"<-\" event))\n  (let [state (:state machine-agent)\n\
  \        sm (:machine machine-agent)\n        result (get-in7 sm [state event])]\n\
  \    (if (nil? result)\n      (do\n        (swap! log conj \"TILT!\")\n        machine-agent)\n\
  \      (do\n\n        (when (second result)\n          ((second result))\n     \
  \   machine-agent))\n```\n\n\n\n\n# 8. 简而言，解构是将复杂的数据元素分解为具名组件的方便方法。更多细节请参阅 Clojure\
  \ 文档。\n\n基于此实现，我们应该能够通过以下代码在 Bob 和 Alice 之间拨通电话。我以测试的形式了它：\n\n点击此处查看代码图像\n\n```\n\
  (it \"should make and receive call\"\n  (let [caller (make-user \"Bob\")\n     \
  \   callee (make-user \"Alice\")\n        telco (make-telco \"telco\")]\n    (reset!\
  \ log [])\n    (send caller transition :call [telco caller callee])\n    (Thread/sleep\
  \ 100)\n    (prn @log)\n    (should= :idle (:state @caller))\n    (should= :idle\
  \ (:state @callee))\n    (should= :idle (:state @telco))))\n```\n\n这个测试通过了，这意味着在\
  \ 100ms 之后，所有的状态机都返回了空闲（idle）状态。日志输出如下：\n\n点击此处查看代码图像\n\n```\n\"Bob<-:call\" \"\
  Bob goes off hook\"\n\"telco<-:caller-off-hook\" \"dialtone to Bob\"\n\"Bob<-:dialtone\"\
  \ \"Bob dials\"\n\"telco<-:dial\" \"telco rings Alice\"\n\"Alice<-:ring\" \"Alice\
  \ goes off hook\"\n\"Bob<-:ringback\"\n\"telco<-:callee-off-hook\" \"telco connects\"\
  \n\"Bob<-:connected\" \"Bob talks\"\n\"Alice<-:connected\" \"Alice talks\"\n\"Bob\
  \ hangs up\"\n\"Alice hangs up\"\n\"telco<-:hangup\" \"disconnect\"\n\"Alice<-:disconnect\"\
  \n\"Bob<-:disconnect\"\n\"telco<-:hangup\"\n```\n\n你可以看到线程是如何交错执行的，而三个有限状态机共同工作，驱动通话成功完成。\n\
  \n这三个代理具有可变状态；但不会出现并发更新问题，因为代理会对它们的操作进行序列化。所以没有竞态条件，对吧？\n\n别这么急，Newt。让我们来调查另一个场景。\n\
  \n我即将在 图 15.4 中向你展示的，是 60 年代电话系统中存在的一种竞态条件。(9) 我们再次从 Bob 拨打 Alice 开始。但这一次 Alice\
  \ 正好也要拨给 Bob。\n\n9。如果你使用固定电话，这现在可能仍然存在。\n\n![](img/c15f004.jpg)\n\n**图 15.4.** 电话系统中的竞态条件\n\
  \n你看到问题出在哪里了吗？那些交叉的线路就是问题所在。这是一个竞态条件。电信公司尝试拨打 Alice 的电话；但在声音发出之前，Alice 为了拨给 Bob\
  \ 拿起了听筒。从电信公司的角度来看，一切都是正常的。它响了电话，Alice 接听了。于是，电信公司高兴地连接了 Bob 和 Alice。但 Alice 坐在那里等待拨号音；而\
  \ Bob 则很困惑，因为没有人打招呼，而且回铃音已经停止了。\n\n最可能的结果是双方在没有交谈的情况下挂了电话。或者，Alice 可能会说些什么，Bob 可能会回应，他们就会陷入“到底是谁打给谁”的喜剧性循环。\n\
  \n我们能让我们的状态机模拟这种故障吗？这里是设置，再次以测试的形式给出：\n\n点击此处查看代码图像\n\n```\n(it \"should race\"\n\
  \  (let [caller (make-user \"Bob\")\n        callee (make-user \"Alice\")\n    \
  \    telco1 (make-telco \"telco1\")\n        telco2 (make-telco \"telco2\")]\n \
  \   (reset! log [])\n    (send caller transition :call [telco1 caller callee])\n\
  \    (send callee transition :call [telco2 callee caller])\n    (Thread/sleep 100)\n\
  \    (prn @log)\n    (should= :idle (:state @caller))\n    (should= :idle (:state\
  \ @callee))\n    (should= :idle (:state @telco1))\n    (should= :idle (:state @telco2))))\n\
  ```\n\n注意，我们现在有四个状态机：一个给 Bob，一个给 Alice，以及每个通话对应一个电信公司。测试失败了。在 100ms 之后，状态机没有返回 Idle\
  \ 状态。\n\n那么，日志告诉了我们什么？\n\n点击此处查看代码图像\n\n```\n\"Bob<-:call\" \"Bob goes off hook\"\
  \n\"telco1<-:caller-off-hook\"\n\"Alice<-:call\" \"Alice goes off hook\"\n\"telco2<-:caller-off-hook\"\
  \n\"dialtone to Bob\"\n\"Bob<-:dialtone\" \"Bob dials\"\n\"telco1<-:dial\" \"telco\
  \ rings Alice\"\n\"Bob<-:ringback\"\n\"Alice<-:ring\" \"TILT\"\n```\n\n你可以看到线程是如何交错执行的，而所有三个有限状态机共同工作驱动通话成功完成。这三个代理具有可变状态；但不会出现并发更新问题，因为代理会对它们的操作进行序列化。所以没有竞态条件，对吧？\n\
  \n\n\n\n## 图 16.1. 开关和灯的最简单解决方案\n\n`Switch` 类调用了 `Light` 类的 `TurnOn` 方法。\n\n3 记住，这是一个面向对象（OO）论坛。不要纠结于*class*（类）这个词。\n\
  \n对这种方案的反对意见是 `Switch` 类可以被用来开启其他东西，比如风扇（Fans）或电视机（Televisions）。因此，`Switch` 类不应该知道\
  \ `Light` 类。两者之间应该引入一种抽象，如图 16.2 所示。\n\n![](img/c16f002.jpg)\n\n## 图 16.2. 抽象服务器\n\
  \n现在 `Switch` 类使用一个名为 `Switchable` 的接口。`Light` 类实现了 `Switchable`。\n\n这解决了问题。现在我们可以有任意数量设备受\
  \ `Switch` 控制。这种解决方案是 `DIP`、`OCP` 和 `LSP` 最简单的表达之一。它也有一个名字，被称为*Abstract Server*（抽象服务器）。^(4)\n\
  \n4 Robert C. Martin, *Agile Software Development: Principles, Patterns, and Practices*\
  \ (Pearson, 2002), 318.\n\n如果我们在一个团队中讨论如何保护 `Switch` 类不被显式耦合到 `Light` 类，团队中的某人可能会插话说：“我们可以使用抽象服务器。”如果所有团队成员都认识这个名字及其包含的含义，他们就能快速决定该解决方案是否合适。\n\
  \n这是一种设计模式，即特定语境下问题的命名解决方案。设计模式的价值在于，其名称和解决方案是规范化的（canonical），因此，熟悉这些规范的人只需通过使用名称就能相互理解。你说“Abstract\
  \ Server”，我立即可理解为你的意思是“在客户端和服务器之间引入一个接口”。\n\n但设计模式中的语境（context）部分呢？让我们，回到我们的团队。有人刚刚建议使用抽象服务器模式。另一位团队成员说：“不，你不明白，我们并不拥有\
  \ `Light` 类；它是第三方库的一部分，所以我们无法修改它来实现接口。”\n\n因此，问题的语境是我们想要将 `Switch` 与 `Light` 解耦，但我们无法修改\
  \ `Light`。于是团队中的另一个人说：“嗯，我们可以使用一个*Adapter*（适配器）。”\n\n如果你在团队中且不知道什么是适配器模式，你就无法理解他们的建议。但如果你熟悉设计模式规范，你就能快速评估该建议。再次，设计模式的益处在于知道名称和规范形式，以便你快速应用它们。\n\
  \n适配器模式看起来如图 16.3 所示。\n\n![](img/c16f003.jpg)\n\n## 图 16.3. 适配器模式的对象形式\n\n`LightAdapter`\
  \ 实现了 `Switchable` 接口，并将 `TurnOn` 调用转发给 `Light`。即使在还没白板上画出来之前，团队中的每个人都能在脑海中看到它，因为他们熟悉设计模式规范。所以他们都对这个想法表示赞同。\n\
  \n正当他们准备进入下一个问题时，团队中的某人说：“等等，我们应该使用哪种形式的适配器？”\n\n事实证明，设计模式的规范名称并不一定描述单一的解决方案。某些模式有多种形式。适配器就是其中一种。它看起来可能像图\
  \ 16.3，也可能看起来像图 16.4。\n\n![](img/c16f004.jpg)\n\n## 图 16.4. 适配器模式的类形式\n\n前者被称为适配器的*对象*（object）形式，因为\
  \ `LightAdapter` 是它自己的一个对象。后者是适配器的*类*（class）形式，因为 `LightAdapter` 是 `Light` 的子类。\n\
  \n团队成员对这两种形式讨论了一会儿，决定适配器的类形式目前已经足够，并且可以减轻他们构建一个独立 `LightAdapter` 对象的复杂性。\n\n###\
  \ 函数式编程中的模式\n\n多年来我们听到的奇怪传闻之一是设计模式是为了绕过 OO 语言产生的问题“黑科技”（hacks），而在函数式语言中它们是必要的。\n\
  \n正如你将在后续章节中看到的，某些设计模式确实在某些方面似乎是 OO 语言某些缺陷的权宜之计；但这并不适用于所有设计模式。此外，即使那些特定的设计模式也有更通用的形式，使其在函数式语言中适用。\n\
  \n### 抽象服务器\n\n![](img/20_unnum_abstractserver.jpg)\n\n那么，抽象服务器在函数式语言中长什么样？\n\n\
  再次考虑 `Switch/Light` 问题。以下是我们在 Clojure 中可能这样表达：\n\n```cllojure\n(defn turn-on-light\
  \ []\n  ;turn on the bloody light!\n  )\n\n(defn engage-switch []\n  ;Some other\
  \ stuff...\n  )\n```\n\n\n\n\n这两个存根节点（stubs）模拟了目标函数。我们带有 `{:type :light}` 参数调用 `engage-switch`\
  \ 函数。然后，我们测试这两个目标函数是否确实被调用了。\n\n我将抽象服务器模式（Abstract Server pattern）的 `protocol/record`\
  \ 形式留作练习。到此时，显然该模式在函数式语言中既适用又很有用。\n\n### 适配器 (Adapter)\n\n![](img/21_unnum_adapter.jpg)\n\
  \n当你有一个想要使用服务器的客户端，但客户端期望的接口与服务器提供的接口不兼容时，就会使用适配器模式。\n\n例如，假设我们有前面讨论中提到的 `engage-switch`\
  \ 函数，但我们想给它传递第三方的 `:variable-light`。`:variable-light` 的 `turn-on-light` 函数接受一个表示光强度的参数：`0`\
  \ 表示关闭，`100` 表示全亮。\n\n`:variable-light` 的接口与 `engage-switch` 函数的预期。因此，我们需要一个适配器。\n\
  \n适配器最简单的形式可能看起来如下：\n\n点击此处查看代码图片\n\n```\n(defn turn-on-light [intensity]\n  ;Turn\
  \ it on with intensity.\n  )\n\n(defmulti turn-on :type)\n(defmulti turn-off :type)\n\
  \n(defmethod turn-on :variable-light [switchable]\n  (turn-on-light 100))\n\n(defmethod\
  \ turn-off :variable-light [switchable]\n  (turn-on-light 0))\n\n(defn engage-switch\
  \ [switchable]\n  ;Some other stuff...\n  (turn-on switchable)\n  ;Some more other\
  \ stuff...\n  (turn-off switchable))\n```\n\n我用以下测试对其进行了测试：\n\n点击此处查看代码图片\n\n```\n\
  (describe \"Adapter\"\n  (with-stubs)\n  (it \"turns light on and off\"\n    (with-redefs\
  \ [turn-on-light (stub :turn-on-light)]\n      (engage-switch {:type :variable-light})\n\
  \      (should-have-invoked :turn-on-light {:times 1 :with [100]})\n      (should-have-invoked\
  \ :turn-on-light {:times 1 :with [0]}))))\n```\n\n如果我在 UML 中画出这个结构，我可能会画出类似图 16.5\
  \ 所示的内容。\n\n![](img/c16f005.jpg)\n\n**图 16.5.** 适配器模式的对象形式\n\n`defmulti` 函数对应于 `Switchable`\
  \ 接口。`{:type :variable-light}` 对象结合两个 `defmethod` 函数对应于 `VariableLightAdapter`。`EngageSwitch`\
  \ 和 `VariableLight` “类”对应于我们尝试适配的两个函数。\n\n也许你觉得这没什么说服力。毕竟，这只是一个包含几个 `defmulti` 函数的简单程序。没有像\
  \ UML 中所示的那种明显的对象（OO）结构。因此，让我们通过拆分源文件来强制这种结构。\n\n我们从 `switchable` 接口开始。在 `ns` 语句中，我使用了约定：`turn-on-light`\
  \ 是包含 `switchable` 命名空间的项目的整体命名空间：\n\n```\n(ns turn-on-light.switchable)\n\n(defmulti\
  \ turn-on :type)\n(defmulti turn-off :type)\n```\n\n这是一个多态接口。注意它没有源代码依赖。同时请记住，Clojure\
  \ 中的 `ns` 语句与 Java 对类具有相同的源文件要求。源文件和命名空间必须具有对应的名称 `switchable.clj`。因此，当我们将这些代码元素移动到不同的命名空间时，我们也将它们移动到不同的源文件中。\n\
  \n特别是，`turn-on-light.switchable` 命名空间必须位于名为 `turn_on_light` 的目录下的 `switchable.clj`\
  \ 文件中。\n\n接下来，让我们 `engage-switch` 和 `variable-light` 命名空间：\n\n点击此处查看代码图片\n\n```\n\
  (ns turn-on-light.engage-switch\n  (:require [turn-on-light.switchable :as s]))\n\
  \n(defn engage-switch [switchable]\n  ;Some other stuff...\n  (s/turn-on switchable)\n\
  \  ;Some more other stuff...\n  (s/turn-off switchable))\n\n————————————————\n\n\
  (ns turn-on-light.variable-light)\n\n(defn turn-on-light [intensity]\n  ;Turn it\
  \ on with intensity.\n  )\n```\n\n这里没有意外。`engage-switch` 命名空间依赖于 `switchable` 接口。`variable-light`\
  \ 命名空间没有向外的源代码依赖。\n\n`variable-light-adapter` 命名空间将 `switchable` 接口连接到 `variable-light`。注意\
  \ `make-adapter` 构造函数。测试将使用它：\n\n点击此处查看代码图片\n\n```\n(ns turn-on-light.variable-light-adapter\n\
  \  (:require [turn-on-light.switchable :as s]\n            [turn-on-light.variable-light\
  \ :as l]))\n\n(defn make-adapter []\n  {:type :variable-light})\n\n(defmethod s/turn-on\
  \ :variable-light [switchable]\n  (l/turn-on-light 100))\n\n(defmethod s/turn-off\
  \ :variable-light [switchable]\n  (l/turn-on-light 0))\n```\n\n\n\n\n到此时，你应该已经相信这就是\
  \ GOF^(6) 书中的适配器模式了。你还应该预期许多其他 GOF 模式可以用 `Clojure` 这样的函数式语言来表达。或许重要的是，你应该将命名空间/源文件结构作为函数式程序设计和架构的一部分。\n\
  \n6. *`GOF`* 是我们在 90 年代对《设计模式》一书的亲切称呼。它代表“四人帮”，因为有四位作者：Erich Gamma、John Vlissides、Ralph\
  \ Johnson 和 Richard Helm。\n\n## 命令 (Command)\n\n![](img/22_unnum_command.jpg)\n\n\
  在 GOF 书中所有的设计模式中，`Command` 是令我最感兴趣的一个。不是因为它复杂，而是因为它非常`simple`。非常，非常简单。\n\n顺便提一下，这也是我对\
  \ `Clojure` 感兴趣的地方。正如我在本书引言中所说的，`Clojure` 在语义上非常丰富，但在语法上极其简单。嗯，`Command` 模式具有同样的属性。它的丰富性在于其不可置信的简单。\n\
  \n在 `C++` 中，我们可以这样写 `Command` 模式：\n\n```cpp\nclass Command {\n  public:\n    virtual\
  \ void execute() = 0;\n};\n```\n\n仅此而已。只有一个抽象类（接口）和一个单一的纯虚（抽象）函数。如此简单。但通过这种模式，你可以做很多有趣的事情。要深入探讨这种丰富性，请参阅*敏捷软件开发：原则、模式、实践*中的相应章节。^(7)\n\
  \n7. Martin, *Agile Software Development*, 第 181 页。\n\n在像 `Clojure` 这样的函数式语言中，你可能会认为这种模式消失了。毕竟，如果你想把一个命令传递给其他函数，你只需要传递\
  \ `command` 函数即可。你不需要把它封装成对象，因为在函数式语言中，函数*就是*对象：\n\n```clojure\n(ns command.core)\n\
  \n(defn execute []\n  )\n\n(defn some-app [command]\n  ;Some other stuff. . .\n\
  \  (command)\n  ;Some more other stuff. . .\n  )\n\n(ns command.core-spec\n  (:require\
  \ [speclj.core :refer :all]\n            [command.core :refer :all]))\n\n(describe\
  \ \"command\"\n  (with-stubs)\n  (it \"executes the command\"\n    (with-redefs\
  \ [execute (stub :execute)]\n      (some-app execute)\n      (should-have-invoked\
  \ :execute))))\n```\n\n8. 细心的读者会发现，这里所写的命令并不是一个纯函数（引用透明函数）。然而，显而易见的是纯函数可以按所示的方式进行传递。\n\
  \n如你所见，测试将 `execute` 函数传递给 `some-app`，而 `some-app` 函数调用了该命令。没什么大不了。\n\n现在，如果你想创建一个带有数据元素的命令，并将其作为参数传递给\
  \ `execute` 函数将会呢？在 `C++` 中，我们会这样做（请原谅内联函数）：\n\n```cpp\nclass CommandWithArgument\
  \ : public Command {\n  public:\n    CommandWithArgument(int argument)\n    :argument(argument)\n\
  \    {}\n\n    virtual void execute()\n    {theFunctionToExecute(argument);}\n\n\
  \  private:\n    int argument;\n\n    void theFunctionToExecute(int argument)\n\
  \    {\n      //do something with that argument!\n    }\n};\n```\n\n在 `Clojure`\
  \ 中我们这样做，这再次证明了在函数式语言中函数实际上是对象：\n\n```clojure\n(describe \"command\"\n  (with-stubs)\n\
  \  (it \"executes the command\"\n    (with-redefs [execute (stub :execute)]\n  \
  \    (some-app (partial execute :the-argument))\n      (should-have-invoked :execute\
  \ {:with [:the-argument]}))))\n\n(defn execute [argument]\n  )\n\n(defn some-app\
  \ [command]\n  ;Some other stuff. . .\n  (command)\n  ;Some more other stuff. .\
  \ .\n  )\n```\n\n## 撤销 (Undo)\n\n`Command` 模式的一个更有用的变体可以在下面的 `C++` 代码中看到：\n\n```cpp\n\
  class UndoableCommand : public Command {\n  public:\n    virtual void undo() = 0;\n\
  };\n```\n\n那个 `undo()` 函数开启了许多有趣的可能性。\n\n很久以前，我参与过一个类似于 `AutoCAD` 的 GUI 应用程序。它是一个用于建筑平面图、屋顶平面图、物业边界图等的绘图工具。GUI\
  \ 是典型的调色板/画布结构。用户点击调色板来选择功能。\n\n\n\n\n我们使用 `defmulti` 函数创建了 `undoable-command` 接口。我们在\
  \ `add-room-command` 命名空间实现了该接口，并在 `command.core` 命名空间的 `gui-app` 函数中模拟了 GUI。\n\n\
  测试存根了 `add-room-command` 的低层函数，并确保它们被正确调用。它带有一个 `palette-actions` 列表调用了 `gui-app`。\n\
  \n`add-room-command` 的两个方法通过多态派发。对于 `execute` 情况，这似乎并不是必要的，因为 `gui-app`刚刚创建了 `add-room-command`\
  \ 对象。但如果我们向该系统添加更多命令，`execute` 的多态派发将变得更加必要。\n\n`undo` 的多态派发即使在这个小示例中显然也是必要的，因为当从调板收到\
  \ `:undo-action` 时，我们并不知道哪个命令正在被撤销。\n\n在这里，我们再次看到，随着应用程序复杂性的增加，GOF 模式的标准形式开始显现出来。对于单方法命令，我们可以使用普通的函数（确切说是函数对象）来解决。但当应用程序需要更丰富的命令类型时，我们又回到了\
  \ GOF 风格。\n\n### Composite（组合）\n\n![](img/23_unnum_composite.jpg)\n\n`Composite`\
  \ 延续了语义丰富性和语法简单性的主题。它是我在 Jim Coplien 的书中首次读到的旧式句柄/体（handle/body）方法的绝佳示例。Composite\
  \ 模式的结构如 图 16.6 所示。\n\n[9] James O. Coplien, *Advanced C++ Programming Styles and\
  \ Idioms* (Addison-Wesley, 1991).\n\n![](img/c16f006.jpg)\n\n**图 16.6.** 组合模式\n\n\
  我们的老朋友 `Switchable` 接口由我们的其他老朋友 `Light` 和 `VariableLight` 实现。`CompositeSwitchable`\
  \ 也实现了 `Switchable`，并包含一个其他 `Switchable` 实例列表。\n\n`CompositeSwitchable` 中 `TurnOn`\
  \ 和 `TurnOff` 的实现简单是将相同函数的调用传播到列表中的所有实例。因此，当你对 `CompositeSwitchable` 实例调用 `TurnOn`\
  \ 时，它会对其其包含的所有 `Switchable` 实例调用 `TurnOn`。\n\n在 Java 中，我们可以这样实现 `CompositeSwitchable`：\n\
  \n点击此处查看代码图像\n\n```java\npublic class CompositeSwitchable implements Switchable\
  \ {\n  private List<Switchable> switchables = new ArrayList<>();\n\n  public void\
  \ addSwitchable(Switchable s) {\n    switchables.add(s):\n  }\n\n  public void turnOn()\
  \ {\n    for (var s : switchables)\n      s.turnOn();\n  }\n\n  public void turnOff()\
  \ {\n    for (var s : switchables)\n      s.turnOff();\n  }\n}\n```\n\n在函数式语言（如\
  \ Clojure）中，人们倾向于避免组合模式，简单地使用 `map` 或 `doseq` 函数，如下面的测试所示：\n\n点击此处查看代码图像\n\n```clojure\n\
  (ns composite-example.switchable)\n\n(defmulti turn-on :type)\n(defmulti turn-off\
  \ :type)\n\n—————\n\n(ns composite-example.light\n  (:require [composite-example.switchable\
  \ :as s]))\n\n(defn make-light [] {:type :light})\n\n(defn turn-on-light [])\n(defn\
  \ turn-off-light [])\n\n(defmethod s/turn-on :light [switchable]\n  (turn-on-light))\n\
  \n(defmethod s/turn-off :light [switchable]\n  (turn-off-light))\n\n———————\n\n\
  (ns composite-example.variable-light\n  (:require [composite-example.switchable\
  \ :as s]))\n\n(defn make-variable-light [] {:type :variable-light})\n\n(defn set-light-intensity\
  \ [intensity])\n\n(defmethod s/turn-on :variable-light [switchable]\n  (set-light-intensity\
  \ 100))\n\n(defmethod s/turn-off :variable-light [switchable]\n  (set-light-intensity\
  \ 0))\n\n———————————\n\n(ns composite-example.core-spec\n  (:require [speclj.core\
  \ :refer :all]\n            [composite-example\n             [light :as l]\n   \
  \          [variable-light :as v]\n             [switchable :as s]]))\n\n(describe\
  \ \"composite-switchable\"\n  (with-stubs)\n  (it \"turns all on\"\n    (with-redefs\n\
  \      [l/turn-on-light (stub :turn-on-light)\n       v/set-light-intensity (stub\
  \ :set-light-intensity)]\n      (let [switchables [(l/make-light) (v/make-variable-light)]]\n\
  \        (doseq [s-able switchables] (s/turn-on s-able))\n        (should-have-invoked\
  \ :turn-on-light)\n```\n\n\n\n\n```clojure\n(ns composite-example.circle\n  (:require\
  \ [clojure.spec.alpha :as s]\n            [composite-example.shape :as shape]))\n\
  \n(s/def ::center (s/tuple number? number?))\n(s/def ::radius number?)\n(s/def ::circle\
  \ (s/keys :req [::shape/type\n                              ::radius\n         \
  \                     ::center]))\n\n(defn make-circle [center radius]\n  {:post\
  \ [(s/valid? ::circle %)]}\n  {::shape/type ::circle\n   ::center center\n   ::radius\
  \ radius})\n\n(defmethod shape/translate ::circle [circle dx dy]\n  {:pre [(s/valid?\
  \ ::circle circle)\n         (number? dx) (number? dy)]\n   :post [(s/valid? ::circle\
  \ %)]}\n  (let [[x y] (::center circle)]\n    (assoc circle ::center [(+ x dx) (+\
  \ y dy)])))\n\n(defmethod shape/scale ::circle [circle factor]\n  {:pre [(s/valid?\
  \ ::circle circle)\n         (number? factor)]\n   :post [(s/valid? ::circle %)]}\n\
  \  (let [radius (::radius circle)]\n    (assoc circle ::radius (* radius factor))))\n\
  \n———————\n\n(ns composite-example.square\n  (:require [clojure.spec.alpha :as s]\n\
  \            [composite-example.shape :as shape]))\n\n(s/def ::top-left (s/tuple\
  \ number? number?))\n(s/def ::side number?)\n(s/def ::square (s/keys :req [::shape/type\n\
  \                              ::side\n                              ::top-left]))\n\
  \n(defn make-square [top-left side]\n  {:post [(s/valid? ::square %)]}\n  {::shape/type\
  \ ::square\n   ::top-left top-left\n   ::side side})\n\n(defmethod shape/translate\
  \ ::square [square dx dy]\n  {:pre [(s/valid? ::square square)\n         (number?\
  \ dx) (number? dy)]\n   :post [(s/assert ::square %)]}\n  (let [[x y] (::top-left\
  \ square)]\n    (assoc square ::top-left [(+ x dx) (+ y dy)])))\n\n(defmethod shape/scale\
  \ ::square [square factor]\n  {:pre [(s/valid? ::square square)\n         (number?\
  \ factor)]\n   :post [(s/valid? ::square %)]}\n  (let [side (::side square)]\n \
  \   (assoc square ::side (* side factor))))\n```\n\n注意方法上的 `:pre` 和 `:post` 条件。我正在使用这些条件来检查输入和输出函数的类型。你完全可以担心所有这些检查带来的运行时开销。我会要么全局禁用它们，要么在确认我的类型管理得当后，有针对性地将它们注释掉。\n\
  \n有一个编译时开关可以禁用所有的断言（assert），包括 `:pre` 和 `:post`。\n\n注意 `translate` 和 `scale` 函数返回的是新的\
  \ `shape` 实例。它们在行为上是完全函数式的。\n\n现在，让我们来看下 `composite-shape`：\n\n点击此处查看代码图片\n\n```clojure\n\
  (ns composite-example.composite-shape\n  (:require [clojure.spec.alpha :as s]\n\
  \            [composite-example.shape :as shape]))\n\n(s/def ::shapes (s/coll-of\
  \ ::shape/shape-type))\n(s/def ::composite-shape (s/keys :req [::shape/type\n  \
  \                                     ::shapes]))\n\n(defn make []\n  {:post [(s/assert\
  \ ::composite-shape %)]}\n  {::shape/type ::composite-shape\n   ::shapes []})\n\n\
  (defn add [cs shape]\n  {:pre [(s/valid? ::composite-shape cs)\n         (s/valid?\
  \ ::shape/shape-type shape)]\n   :post [(s/valid? ::composite-shape %)]}\n  (update\
  \ cs ::shapes conj shape))\n\n(defmethod shape/translate ::composite-shape [cs dx\
  \ dy]\n  {:pre [(s/valid? ::composite-shape cs)\n         (number? dx) (number?\
  \ dy)]\n   :post [(s/valid? ::composite-shape %)]}\n  (let [translated-shapes (map\
  \ #(shape/translate % dx dy)\n                               (::shapes cs))]\n \
  \   (assoc cs ::shapes translated-shapes)))\n\n(defmethod shape/scale ::composite-shape\
  \ [cs factor]\n  {:pre [(s/valid? ::composite-shape cs)\n         (number? factor)]\n\
  \   :post [(s/valid? ::composite-shape %)]}\n  (let [scaled-shapes (map #(shape/scale\
  \ % factor)\n                           (::shapes cs))]\n    (assoc cs ::shapes\
  \ scaled-shapes)))\n```\n\n我们之前在 `light`/`variable-light` 示例中见过这种模式。然而这一次，`composite-shape`\
  \ 返回了一个带有新 `shape` 实例的新 `composite-shape`。因此，它是函数式的。\n\n对于好奇的朋友，这里是我使用的测试代码：\n\n\
  点击此处查看代码图片\n\n```clojure\n(ns composite-example.composite-shape\n  (:require [clojure.spec.alpha\
  \ :as s]\n            [composite-example.shape :as shape]))\n\n(s/def ::shapes (s/coll-of\
  \ ::shape/shape-type))\n(s/def ::composite-shape (s/keys :req [::shape/type\n  \
  \                                     ::shapes]))\n\n(defn make []\n  {:post [(s/assert\
  \ ::composite-shape %)]}\n  {::shape/type ::composite-shape\n   ::shapes []})\n\n\
  (defn add [cs shape]\n  {:pre [(s/valid? ::composite-shape cs)\n         (s/valid?\
  \ ::shape/shape-type shape)]\n   :post [(s/valid? ::composite-shape %)]}\n  (update\
  \ cs ::shapes conj shape))\n\n(defmethod shape/translate ::composite-shape [cs dx\
  \ dy]\n  {:pre [(s/valid? ::composite-shape cs)\n         (number? dx) (number?\
  \ dy)]\n   :post [(s/valid? ::composite-shape %)]}\n  (let [translated-shapes (map\
  \ #(shape/translate % dx dy)\n                               (::shapes cs))]\n \
  \   (assoc cs ::shapes translated-shapes)))\n\n(defmethod shape/scale ::composite-shape\
  \ [cs factor]\n  {:pre [(s/valid? ::composite-shape cs)\n         (number? factor)]\n\
  \   :post [(s/valid? ::composite-shape %)]}\n  (let [scaled-shapes (map #(shape/scale\
  \ % factor)\n                           (::shapes cs))]\n    (assoc cs ::shapes\
  \ scaled-shapes))))\n```\n（注：原文最后一段似乎是之前代码的重复，我已根据提供的逻辑进行了结构清理。）\n\n你可能已经注意到，在接下来的章节中，我使用了更多\
  \ Clojure 的高级特性。这是故意的。我预计你在阅读这本书时，身边会有一份 Clojure 参考资料，因此我为你提供了一系列查阅和熟悉语言的机会。\n\n\
  正如我们所见，Composite 是另一种非常适合函数世界的 GOF 模式。一旦我们开始利用多态分发（通过虚表、多方法或协议/记录结构），GOF 模式就能完美契合，正如\
  \ GOF 所描述的那样。\n\n### 装饰器\n\n![](img/24_unnum_decorator.jpg)\n\n句/body 模式的另一种形式是装饰器（Decorator）。装饰器模式是在不直接修改类型模型的情况下为其添加功能的方法。\n\
  \n例如，让我们继续之前的 `shape` 项目。我们有一个支持 `circle` 和 `square` 子类的 `shape` 类型模型。在该类型模型内部，只要它符合里氏替换原则（LSP），我们就可以\
  \ `translate` 和 `scale` 任何 `shape` 子类，而无需知道我们正在操作的具体类型。\n\n现在，让我们添加一种新的可选功能：`journaled-shape`。`journaled-shape`\
  \ 是一个记录了自创建以来执行的所有操作的 `shape`。我们希望对 `square` 和 `circle` 记录日志；但仅针对特定的 `square` 和\
  \ `circle`。我们不希望每个 `circle` 和 `square` 都记录日志，因为内存和处理开销太大了。\n\n\n\n\n当然，我们可以通过向 `shape`\
  \ 抽象类添加一个 `:journaled?` 标记，然后在 `circle` 和 `square` 的实现中放置 `if` 语句来实现它。但那样太乱了。我们真正想要的是一种可以在不改变\
  \ `shape` 抽象或其任何子类型（包括 `circle`、`square` 和 `composite-shape`）的情况下添加此功能的方法（即 OCP）。\n\
  \n引入装饰器模式（Decorator pattern）。UML 图如图图 16.7 所示。\n\n![](img/c16f007.jpg)\n\n**图 16.7.**\
  \ 装饰模式\n\n我包含了 `composite-shape`，因为它目前是 `shape` 类型模型的一部分。`journaled-shape` 是装饰器。`journaled-shape`\
  \ 继承自 `shape` 并持有对 `shape` 的引用。当在 `journaled-shape` 上调用 `translate` 或 `scale` 时，它会在日志中创建一个条目，然后将调用委托给包含的\
  \ `shape`。\n\n这里是 Clojure 的实现：\n\n点击此处查看代码图像\n\n```\n(ns decorator-example.journaled-shape\n\
  \  (:require [decorator-example.shape :as shape]\n            [clojure.spec.alpha\
  \ :as s]))\n\n(s/def ::journal-entry\n       (s/or :translate (s/tuple #{:translate}11\
  \ number? number?)\n             :scale (s/tuple #{:scale} number?)))\n(s/def ::journal\
  \ (s/coll-of ::journal-entry))\n(s/def ::shape ::shape/shape-type)\n(s/def ::journaled-shape\
  \ (s/and\n                           (s/keys :req [::shape/type\n              \
  \                           ::journal\n                                        \
  \ ::shape])\n                           #(= ::journaled-shape\n                \
  \               (::shape/type %))))\n\n(defn make [shape]\n  {:post [(s/valid? ::journaled-shape\
  \ %)]}\n  {::shape/type ::journaled-shape\n   ::journal []\n   ::shape shape})\n\
  \n(defmethod shape/translate ::journaled-shape [js dx dy]\n  {:pre [(s/valid? ::journaled-shape\
  \ js)\n         (number? dx) (number? dy)]\n   :post [(s/valid? ::journaled-shape\
  \ %)]}\n  (-> js (update ::journal conj [:translate dx dy])\n      (assoc ::shape\
  \ (shape/translate (::shape js) dx dy))))\n\n(defmethod shape/scale ::journaled-shape\
  \ [js factor]\n  {:pre [(s/valid? ::journaled-shape js)\n         (number? factor)]\n\
  \   :post [(s/valid? ::journaled-shape %)]}\n  (-> js (update ::journal conj [:scale\
  \ factor])\n      (assoc ::shape (shape/scale (::shape js) factor))))\n```\n\n11。集合可以用作测试成员性的函数。\n\
  \n`::journaled-shape` 对象拥有 `::shape` 和 `::journal` 字段。`::journal` 字段是 `::journal-entry`\
  \ 元组的集合，形式为 `[:translate dx dy]` 或 `[:scale factor]`，其中 `dx`、`dy` 和 `factor` 为数字。`::shape`\
  \ 字段必须包含有效的 `shape`。\n\n`make` 构造函数创建一个有效的 `journaled-shape`（通过 `:post` 条件检查）。\n\
  \n`translate` 和 `scale` 函数将相应的日志条目添加到 `::journal` 中，然后将其各自的函数委托给 `::shape`，返回一个更新了\
  \ `::journal` 并修改了 `::shape` 的新 `journaled-shape`。\n\n这是测试。我只用 `square` 测试了 `journaled-shape`，因为如果它对\
  \ `square` 有效，它就适用于每个 `shape`：\n\n点击此处查看代码图像\n\n```\n(describe \"journaled shape\
  \ decorator\"\n  (it \"journals scale and translate operations\"\n    (let [jsd\
  \ (-> (js/make (square/make-square [0 0] 1))\n                  (shape/translate\
  \ 2 3)\n                  (shape/scale 5))]\n      (should= [[:translate 2 3] [:scale\
  \ 5]]\n               (::js/journal jsd))\n      (should= {::shape/type ::square/square\n\
  \                ::square/top-left [2 3]\n                ::square/side 5}\n   \
  \            (::js/shape jsd)))))\n```\n\n我们创建了一个包含 `square` 的 `journaled-shape`。我们对其进行\
  \ `translate` 和 `scale` 操作，然后确保 `::journal` 记录了 `translate` 和 `scale` 调用，并且 `square`\
  \ 具有平移和缩放后的值。\n\n再次，我包含类型规范只是为了给你一个挑战并演示如何使用它们。但坦率地说，我认为测试已经很好地检查了类型；因此，在现实生活中，我怀疑我不会为此此使用如此详细的类型规范。\n\
  \n### 访问者 (Visitor)\n\n当然，我们可以通过向 `shape` 抽象类添加一个 `:journaled?` 标记，并在 `circle` 和\
  \ `square` 的实现中放置 `if` 语句来实现。但那样太乱了。我们真正想要的是一种可以在不改变 `shape` 抽象或其任何子类型（包括 `circle`、`square`\
  \ 和 `composite-shape`）的情况下添加此功能的方法（即 OCP）。\n\n引入装饰器模式。UML 图如图图 16.7 所示。\n\n![](img/c16f007.jpg)\n\
  \n**图 16.7.** 装饰模式\n\n我包含了 `composite-shape`，因为它目前是 `shape` 类型模型的一部分。`journaled-shape`\
  \ 是装饰器。`journaled-shape` 继承自 `shape` 并持有对 `shape` 的引用。当在 `journaled-shape` 上调用 `translate`\
  \ 或 `scale` 时，它会在日志中创建一个条目，然后将调用委托给包含的 `shape`。\n\n这里是 Clojure 的实现：\n\n```\n(ns\
  \ decorator-example.journaled-shape\n  (:require [decorator-example.shape :as shape]\n\
  \            [clojure.spec.alpha :as s]))\n\n(s/def ::journal-entry\n       (s/or\
  \ :translate (s/tuple #{:translate}11 number? number?)\n             :scale (s/tuple\
  \ #{:scale} number?)))\n(s/def ::journal (s/coll-of ::journal-entry))\n(s/def ::shape\
  \ ::shape/shape-type)\n(s/def ::journaled-shape (s/and\n                       \
  \    (s/keys :req [::shape/type\n                                         ::journal\n\
  \                                         ::shape])\n                          \
  \ #(= ::journaled-shape\n                               (::shape/type %))))\n\n\
  (defn make [shape]\n  {:post [(s/valid? ::journaled-shape %)]}\n  {::shape/type\
  \ ::journaled-shape\n   ::journal []\n   ::shape shape})\n\n(defmethod shape/translate\
  \ ::journaled-shape [js dx dy]\n  {:pre [(s/valid? ::journaled-shape js)\n     \
  \    (number? dx) (number? dy)]\n   :post [(s/valid? ::journaled-shape %)]}\n  (->\
  \ js (update ::journal conj [:translate dx dy])\n      (assoc ::shape (shape/translate\
  \ (::shape js) dx dy))))\n\n(defmethod shape/scale ::journaled-shape [js factor]\n\
  \  {:pre [(s/valid? ::journaled-shape js)\n         (number? factor)]\n   :post\
  \ [(s/valid? ::journaled-shape %)]}\n  (-> js (update ::journal conj [:scale factor])\n\
  \      (assoc ::shape (shape/scale (::shape js) factor))))\n```\n\n11。集合可以用作测试成员性的函数。\n\
  \n`::journaled-shape` 对象拥有 `::shape` 和 `::journal` 字段。`::journal` 字段是 `::journal-entry`\
  \ 元组的集合，形式为 `[:translate dx dy]` 或 `[:scale factor]`，其中 `dx`、`dy` 和 `factor` 为数字。`::shape`\
  \ 字段必须包含有效的 `shape`。\n\n`make` 构造函数创建一个有效的 `journaled-shape`（通过 `:post` 条件检查）。\n\
  \n`translate` 和 `scale` 函数将相应的日志条目添加到 `::journal` 中，然后将其各自的函数委托给 `::shape`，返回一个更新了\
  \ `::journal` 并修改了 `::shape` 的新 `journaled-shape`。\n\n这是测试。我只用 `square` 测试了 `journaled-shape`，因为如果它对\
  \ `square` 有效，它就适用于每个 `shape`：\n\n点击此处查看代码图像\n\n```\n(describe \"journaled shape\
  \ decorator\"\n  (it \"journals scale and translate operations\"\n    (let [jsd\
  \ (-> (js/make (square/make-square [0 0] 1))\n                  (shape/translate\
  \ 2 3)\n                  (shape/scale 5))]\n      (should= [[:translate 2 3] [:scale\
  \ 5]]\n               (::js/journal jsd))\n      (should= {::shape/type ::square/square\n\
  \                ::square/top-left [2 3]\n                ::square/side 5}\n   \
  \            (::js/shape jsd)))))\n```\n\n（注：原文中存在大量重复的段落，译文已根据“不要重复输出原文”的原则进行了去重处理。）\n\
  \n\n\n我们从某处获取一个 `Shape` 对象。我们创建一个 `JsonVisitor`。我们通过 `accept` 方法将 `JsonVisitor`\
  \ 传递给我们的 `Shape`。`accept` 方法会多态地分发到 `Shape` 的相应子类型——假设它是一个 `Square`。`Square` 的 `accept`\
  \ 方法会在 `JsonVisitor` 上调用 `visit(this)`。由于 `this` 的类型是 `Square`，因此调用了 `JsonVisitor`\
  \ 的 `visit(Square s)` 函数。该函数为 `Square` 生成 JSON 字符串并将其保存在 `JsonVisitor` 的一个成员变量中。`getJson()`\
  \ 函数返回该成员变量的内容。\n\n你可能需要读几次才能理解。这种技术被称为“**双分发**”（`double-dispatch`）。第一次分发部署到 `Shape`\
  \ 的子类型，因此现在我们知道了该子类型的类型。第二次分发部署到访问者正确的子类型，并传递了该子类型的真实类型。\n\n如果你理解了所有这些，就会发现 `ShapeVisitor`\
  \ 的每个派类都是 `Shape` 类型模型的一个新“方法”，但我们对 `Shape` 唯一添加的只是 `accept` 方法。因此（符合开/闭原则 OCP）。你现在也应该理解为什么我们不能使用装饰器（Decorator）了。新函数强依赖于子类型。如果你不知道它是一个\
  \ `Square`，你就无法为它制作 JSON 字符串。\n\n现在，我告诉这一切是为了说明这一点：所有这些复杂性都是由于语言的限制。是的，是的……这些那些设计模式反对者确实有道理的地方。访问者模式之所以如此复杂，是因为特定的语言特性。\n\
  \n那是什么特性呢？**关闭式类**（`Closed classes`）。\n\n### 是关闭，还是 Clojure？\n\n在 C++ 和 Java 等语言中，我们创建的类是“关闭”的。这意味着我们无法通过在一个新的源文件中放置新方法的声明来向类添加新方法。如果在关闭式语言中为类添加新方法，我们必须打开该类的源文件，并在类的定义**内部**添加该方法。\n\
  \nClojure 没有这种限制。C# 在某种程度上也是如此。事实上，许多语言允许你在更改包含类定义的源文件的情况下向类添加方法。\n\nClojure 没有这种限制的原因是类并不是该语言的特性。我们通过约定创建类，而不是通过语法。\n\
  \n所以，等一下，这意味着在 Clojure 中我们不需要装饰器或访问者模式吗？不，完全不是如此。事实上，正如我们看到的，我们仍然需要 GOF 形式的装饰器。否则你该如何实现\
  \ `journaled-shape` 呢？\n\n然而，在拥有开放类的语言中，GOF 形式的访问者并不是必要的。或者说，GOF 形式的某些细节是不必要的。\n\
  \n所以，让我给你看 Clojure 中这个特定的访问者。首先是测试部分：\n\n点击此处查看代码图片\n\n```\n(ns visitor-example.core-spec\n\
  \  (:require [speclj.core :refer :all]\n            [visitor-example\n         \
  \    [square :as square]\n             [json-shape-visitor :as jv]\n           \
  \  [circle :as circle]]))\n\n(describe \"shape-visitor\"\n  (it \"makes json square\"\
  \n    (should= \"{\\\"top-left\\\": [0,0], \\\"side\\\": 1}\"\n             (jv/to-json\
  \ (square/make [0 0] 1))))\n\n  (it \"makes json circle\"\n    (should= \"{\\\"\
  center\\\": [3,4], \\\"radius\\\": 1}\"\n             (jv/to-json (circle/make [3\
  \ 4] 1)))))\n```\n\n这不应该太意外；尽管你应该特别注意源代码的依赖。这个测试几乎需要所有东西。\n\n现在让我们回想 `shape` 类型模型是什么样的。为了简单起见，我移除了所有的\
  \ `clojure.spec` 类型规范：\n\n点击此处查看代码图片\n\n```\n(ns visitor-example.shape)\n\n(defmulti\
  \ translate (fn [shape dx dy] (::type shape)))\n(defmulti scale (fn [shape factor]\
  \ (::type shape)))\n\n———————\n\n(ns visitor-example.square\n  (:require\n    [visitor-example.shape\
  \ :as shape]))\n\n(defn make [top-left side]\n  {::shape/type ::square\n   ::top-left\
  \ top-left\n   ::side side})\n\n(defmethod shape/translate ::square [square dx dy]\n\
  \  (let [[x y] (::top-left square)]\n    (assoc square ::top-left [(+ x dx) (+ y\
  \ dy)])))\n\n(defmethod shape/scale ::square [square factor]\n  (let [side (::side\
  \ square)]\n    (assoc square ::side (* side factor))))\n\n————————\n\n(ns visitor-example.circle\n\
  \  (:require\n    [visitor-example.shape :as shape]))\n\n(defn make [center radius]\n\
  \  {::shape/type ::circle\n   ::center center\n   ::radius radius})\n\n(defmethod\
  \ shape/translate ::circle [circle dx dy]\n  (let [[x y] (::top-left square)]\n\
  \    (assoc square ::top-left [(+ x dx) (+ y dy)])))\n\n(defmethod shape/scale ::circle\
  \ [circle factor]\n  (let [side (::side square)]\n    (assoc square ::side (* side\
  \ factor))))\n```\n*(注：提示中提供的代码块在逻辑上存在一些不一致/拼写错误，我将根据提供的文本进行格式化。)*\n\n\n\n在 Java、C#\
  \ 和 C++ 中，我们可以通过 `abstract factory`（抽象工厂）来解决这个问题，`App` 可以使用它来实例化 `visitor` 对象，而不需要直接依赖它。\n\
  \n在 Clojure 中，我们有另一个更好的选择。我们可以直接如下所示将 `json-shape-visitor` 的接口与其实现分离：\n\n点击此处查看代码图片\n\
  \n```\n(ns visitor-example.json-shape-visitor\n  (:require [visitor-example\n  \
  \           [shape :as shape]]))\n(defmulti to-json ::shape/type)\n\n————————\n\n\
  (ns visitor-example.json-shape-visitor-implementation\n  (:require [visitor-example\n\
  \             [json-shape-visitor :as v]\n             [circle :as circle]\n   \
  \          [square :as square]]))\n\n(defmethod v/to-json ::square/square [square]\n\
  \  (let [{:keys [::square/top-left ::square/side]} square\n        [x y] top-left]\n\
  \    (format \"{\\\"top-left\\\": [%s,%s], \\\"side\\\": %s}\" x y side)))\n\n(defmethod\
  \ v/to-json ::circle/circle [circle]\n  (let [{:keys [::circle/center ::circle/radius]}\
  \ circle\n        [x y] center]\n    (format \"{\\\"center\\\": [%s,%s], \\\"radius\\\
  \": %s}\" x y radius)))\n```\n\n这里的诀窍在于确保 `json-shape-visitor-implementation` 模块被\
  \ `main` `require`（引入），这样 `defmethod` 就能正确地注册到 `defmulti` 中：\n\n点击此处查看代码图片\n\n```\n\
  (ns visitor-example.main\n  (:require [visitor-example\n             [json-shape-visitor-implementation]]))\n\
  ```\n\n通常，`main` 在应用程序的任何部分之前被调用，因此应用程序没有对 `main` 的源码依赖。^(15)遗憾的是，我的测试无法访问真实的 `main`，因此必须包含该依赖：\n\
  \n15. Martin, *Clean Architecture*，第 231 页。\n\n点击此处查看代码图片\n\n```\n(ns visitor-example.core-spec\n\
  \  (:require [speclj.core :refer :all]\n            [visitor-example\n         \
  \    [square :as square]\n             [json-shape-visitor :as jv]\n           \
  \  [circle :as circle]\n             [main]]))\n\n(describe \"shape-visitor\"\n\
  \  (it \"makes square\"\n    (should= \"{\\\"top-left\\\": [0,0], \\\"side\\\":\
  \ 1}\"\n             (jv/to-json (square/make [0 0])))\n\n  (it \"makes circle\"\
  \n    (should= \"{\\\"center\\\": [3,4], \\\"radius\\\": 1}\"\n             (jv/to-json\
  \ (circle/make 3 4)))))\n```\n\n所以这就是在 Clojure 中一个功能性且架构上合格的 Visitor 模式。如 `图 16.10`\
  \ (#ch16.xhtml_ch16fig10) 中的 UML 所示，所有的依赖都跨越了架构边界，指向边界更高层（抽象）的一侧。赞美上帝！\n\n**图 16.10.**\
  \ `功能性且架构上合格`（等等，检查文本）\n\n因此 Visitor 模式是一个 GOF 形式被当年的语言限制所污染的案例。在 1995 年 GOF 书出版时，闭源类被认为是静态类型语言的必要属性，因此无处不在。\n\
  \n### 抽象工厂\n\n![\n\n`DIP`（依赖倒置原则）建议我们避免对既易变又具体的事物产生源码依赖。因此，我们创建抽象结构，并尝试将依赖路由到它们上。然而，当我们创建对象实例时，我们往往不得不违反这一建议；这会导致架构上的困难，如\
  \ `图 16.11` (#ch16.xhtml_ch16fig11) 中的 UML 所示。\n\n**图 16.11.** `由于创建导致的 DIP`\n\n\
  `图 16.11` (#ch16.xhtml_ch16fig11) 中的 `App` 使用了 `Shape` 接口。它需要做的一切都可以通过接口完成，但有一个例外。`App`\
  \ 必须创建 `Circle` 和 `Square` 派类的实例；这迫使 `App` 对相应的模块挂载了源码依赖。\n\n我们实际上在之前的示例中见过这种情况。例如，考虑早些\
  \ `visitor-example` 中的代码。注意，测试对 `square` 和 `circle` 的源码依赖其唯一目的是为了调用那些 `make` 函数：\n\
  \n点击此处查看代码图片\n\n```\n(ns visitor-example.core-spec\n  (:require [speclj.core :refer\
  \ :all]\n            [visitor-example\n             [square :as square]\n      \
  \       [json-shape-visitor :as jv]\n             [circle :as circle]]))\n\n(describe\
  \ \"shape-visitor\"\n  (it \"makes square\"\n    (should= \"{\\\"top-left\\\": [0,0],\
  \ \\\"side\\\": 1}\"\n             (jv/to-json (square/make [0 0])))\n\n  (it \"\
  makes circle\"\n    (should= \"{\\\"center\\\": [3,4], \\\"radius\\\": 1}\"\n  \
  \           (jv/to-json (circle/make 3 4)))))\n```\n\n也许这看起来是一个很小的代价。但正如 `图 16.12`\
  \ (#ch16.xhtml_ch16fig12) 所示，如果我们增加了架构边界，代价就变得清晰了。\n\n**图 16.12.** `跨边界的依赖`\n\n\
  在这里我们看到*依赖规则*^([16) 被违反了：源码依赖必须跨越边界指向高层侧。通过这种方式，我们处理了 `creates` 依赖。`Circle` 和 `Square`\
  \ 模块是 `App` 的低级细节。Robert C. Martin, *Clean Architecture* (2017)。`Abstract Factory`\
  \ 模式提供了一个很好的解决方案。正如 `图 16.13` (#ch16.xhtml_ch16fig13) 所示：\n\n**图 16.13.** `抽象工厂解决了依赖规则`\n\
  \n所有跨边界的源码依赖现在都指向高层侧，从而解决了 `creates` 依赖。这在 Clojure 中很容易实现。我们只需要 `shape-factory`\
  \ 接口及其实现：\n\n点击此处查看代码图片\n\n```\n(ns abstract-factory-example.shape-factory)\n\n\
  (defmulti make-circle\n  (fn [factory center radius] (::type factory)))\n\n(defmulti\
  \ make-square\n  (fn [factory top-left side] (::type factory)))\n\n—————\n\n(ns\
  \ abstract-factory-example.shape-factory-implementation\n  (:require [abstract-factory-example\n\
  \             [shape-factory :as factory]\n             [square :as square]\n  \
  \           [circle :as circle]]))\n\n(defn make []\n  {::factory/type ::implementation})\n\
  \n(defmethod factory/make-square ::implementation\n  [factory top-left side]\n \
  \ (square/make top-left side))\n\n(defmethod factory/make-circle ::implementation\n\
  \  [factory center radius]\n  (circle/make center radius))\n```\n\n我们可以编写一个模拟我们的\
  \ `App`：\n\n点击此处查看代码图片\n\n```\n(ns abstract-factory-example.core-spec\n  (:require\
  \ [speclj.core :refer :all]\n            [abstract-factory-example\n           \
  \  [shape :as shape]\n             [shape-factory :as factory]\n             [main\
  \ :as main]]))\n\n(describe \"Shape Factory\"\n  (before-all (main/init))\n  (it\
  \ \"makes a square\"\n    (let [square (factory/make-square\n                  \
  \ @main/shape-factory\n                   [100 100] 10)]\n      (should= \"Square\
  \ top-left: [100,100] side: 10\"\n               (shape/to-string square))))\n \
  \ (it \"makes a circle\"\n    (let [circle (factory/make-circle\n              \
  \       @main/shape-factory\n                     [100 100] 10)]\n      (should=\
  \ \"Circle center: [100,100] radius: 10\"\n                 (shape/to-string circle)))))\n\
  ```\n\n\n\n关于此测试需要注意的第一点是，它对 `circle` 或 `square` 没有源文件依赖。它只依赖于两个接口：`shape` 和 `shape-factory`。这是我们的架构目标。\n\
  \n但这个 `main` 依赖是什么？你看到测试开头的 `(before-all (main/init))` 这一行了吗？它告诉测试运行器在执行任何测试之前调用\
  \ `(main/init)`。这模拟了 `main` 模块在启动 `App` 之前初始化所有内容。\n\n这里是 `main`：\n\n点击此处查看图片\n\n\
  ```\n(ns abstract-factory-example.main\n  (:require [abstract-factory-example\n\
  \            [shape-factory-implementation :as imp]]))\n\n(def shape-factory (atom\
  \ nil))\n\n(defn init[]\n  (reset! shape-factory (imp/make)))\n```\n\n噢，天哪！我们有一个名为\
  \ `shape-factory` 的全局 `atom`！这个 `atom` 正在被 `init` 函数初始化为 `shape-factory-implementation`。\n\
  \n所以，回过头来看测试，我们看到 `make-circle` 和 `make-square` 方法传递的是被引用的 `atom`。\n\n像这样设置全局变量是处理工厂的一种非常常见的策略。主程序创建具体的工厂实现，然后将其加载到所有人都可以访问的全局变量中。在静态类型语言中，该全局变量的类型将是接口\
  \ `ShapeFactory`。在动态类型语言中，不需要这种类型声明。\n\n### 再次 90 度\n\n再次查看图 16.13 中的那张 UML 图。你看到\
  \ `ShapeFactory` 中的 90 度旋转了吗？你也可以在 `shape-factory` 代码中看到它。`ShapeFactory`（以及 `shape-factory`）拥有与\
  \ `Shape` 子类型对应的方法。\n\n这给 Visitor 模式引起的问题在这里也存在，尽管形式略有不同。每当添加一个新的 `shape` 的子类型时，都必须修改\
  \ `shape-factory`。这违反了 OCP（开闭原则），因为我们必须修改架构边界高侧的模块。如果 OCP 确实重要，它在跨越此类边界时尤为重要。仔细研究那张\
  \ UML 图，直到你明白我的意思。\n\n我们可以通过用一个接受不透明令牌（opaque token）的方法替换 90 度旋转来解决这个问题。如下所示：\n\n\
  点击此处查看图片\n\n```\n(ns abstract-factory-example.shape-factory)\n\n(defmulti make (fn\
  \ [factory type & args] (::type factory)))\n\n——————————\n\n(ns abstract-factory-example.shape-factory-implementation\n\
  \  (:require [abstract-factory-example\n             [shape-factory :as factory]\n\
  \             [square :as square]\n             [circle :as circle]]))\n\n(defn\
  \ make []\n  {::factory/type ::implementation})\n\n(defmethod factory/make ::implementation\n\
  \  [factory type & args]\n  (condp = type\n    :square (apply square/make args)\n\
  \    :circle (apply circle/make args)))\n\n————————————————\n\n(ns abstract-factory-example.core-spec\n\
  \  (:require [speclj.core :refer :all]\n            [abstract-factory-example\n\
  \             [shape :as shape]\n             [shape-factory :as factory]\n    \
  \         [main :as main]]))\n\n(describe \"Shape Factory\"\n  (before-all (main/init))\n\
  \  (it \"creates a square\"\n    (let [square (factory/make\n                  \
  \ @main/shape-factory\n                   :square\n                   [100 100]\
  \ 10)]\n      (should= \"Square top-left: [100,100] side: 10\"\n               (shape/to-string\
  \ square))))\n\n  (it \"creates a circle\"\n      (let [circle (factory/make\n \
  \                    @main/shape-factory\n                     :circle\n       \
  \              [100 100] 10)]\n        (should= \"Circle center: [100,100] radius:\
  \ 10\"\n                 (shape/to-string circle)))))\n```\n\n注意传递给 `shape-factory/make`\
  \ 的参数是不透明的。也就是说，它不是由任何其他模块定义的，包括——特别是——`square` 和 `circle` 模块。`:square` 和 `:circle`\
  \ 关键字没有命名空间，也没有在任何地方声明。它们只是恰好有名字的不透明值。我大完全可以用 `1` 代表 `square`，用 `2` 代表 `circle`，或者使用\
  \ `\"square\"` 和 `\"circle\"` 字符串。\n\n这种不透明性是该解决方案的关键。如果我们以后需要添加 `triangle` 子类型，边界线以上的任何内容都不需要更改（符合\
  \ OCP）。\n\n### 类型安全？\n\n在像 Java 这样的静态类型语言中，这种技术放弃了类型安全。不透明值是非类型安全的。例如，在 Java 中无法使用\
  \ `enum` 来解决这个问题。\n\n在 Clojure 中，我们不关心静态类型安全，但动态类型规范呢？在这方面我们也无为了。使用 `clojure.spec`\
  \ 无法获得优势，因为无论是否使用 `clojure.spec`，所有错误都将在运行时产生。\n\n例如，没有任何能阻止 `shape-factory/make`\
  \ 在传入 `sqare`（故意拼错）时直接抛出一个运行时异常。\n\n### 总结\n\n我认为在这里回顾一下引言中的希望和目标是明智的。现在应该很清楚，函数式编程和面向对象编程（OOP）是兼容且互利的。至于*单例模式（Singleton）*：直接创建一个即可。\n\
  \n### 后记：OO 毒？\n\n![](img/27_unnum_oopoison.jpg)\n\n\n\n\n因此，Clojure 是一种面向对象（OO)/函数式语言。Scala、Elixir\
  \ 和 F# 等语言（仅列举少数几个）在某种程度上也是如此。而且，既然事实如此，面向对象的思维模式仍然是这些语言中为应用程序建模的一种完全有效的方法。\n\n\
  OOFL？FOOL？嗯，也许我们应该避免使用这些缩写。\n\n我们仍然可以使用接口和类、类型和子类型来描述我们的函数式程序。我们仍然可以划分源文件并管理它们的依赖关系，以创建健壮、独立部署且独立开发的架构。在这方面，没有任何改变。\n\
  \n*发生*改变的是函数式编程对我们施加的额外限制，即对副作用的消除，或至少是强力隔离。我们的类和模块将强烈倾向于使用不可变对象而非可变对象。但它们仍然是对象，并且仍然可以被表示和组织为实现\
  \ `interfaces` 的 `classes`。\n\n这意味着，我们在面向对象语言中发现非常有用的设计原则和设计模式，在 Clojure 等其他函数式语言中仍然适用且有用。\n\
  \n# VI 章\n\n# 案例研究\n\n## 17\n\n## Wa-Tor\n\n![](img/28_unnum_wator.jpg)\n\n在本书的最后一章，你和我将玩一个关于小游戏的游戏。我们要玩的那个小游戏叫做\
  \ `Wa-Tor`；这是一个由 A. K. Dewdney 在 1984 年 12 月份的《科学美国》（Scientific American）杂志描述的简单细胞自动机。你和我要玩的游戏是*假装*\
  \ `Wa-Tor` 是一个在架构和设计上需要大量心血的企业级应用程序。\n\n唉，*SciAm*，我很熟悉它了……\n\n我的意思是，诚实地说，我可以在几个小时内拼凑出一个\
  \ `Wa-Tor` 并满意地离开。但对于这一章，我希望我们真的能像对待一个拥有 5000 万行代码（LOC）的巨兽一样，认真思考这些问题。\n\n那么什么是\
  \ `Wa-Tor` 呢？脚注中引用的维基百科条目应该会提供理解它所需深度的所有信息（其实不多）。但本质上，`Wa-Tor` 是一个使用鱼和鲨的典型捕食者/猎物模拟。鱼随机移动并偶尔繁殖。鲨也随机移动，但如果旁边有鱼，就会吃掉它。如果鲨吃了足够的鱼，就会偶尔繁殖。如果鲨在饿死之前没有吃到鱼，就会死亡。\n\
  \n[`en.wikipedia.org/wiki/Wa-Tor`](https://en.wikipedia.org/wiki/Wa-Tor)\n\n鱼和鲨生存的世界没有陆地；全是水。此外，顶部与底部相连，左侧与右侧连，所以拓扑上是一个环面。因此，`Wa-Tor`\
  \ 代表 `WAter TORus`（水环面）。\n\n我们稍后会详细讨论程序的功能。目前，架构和设计的考量有哪些？\n\n让我们从基础开始。SRP（单一职责原则）。参与者是谁——我们想要保持分离的是谁？\n\
  \n在大多数大型企业系统中，有许多不同的参与者。但在这个小应用中，只有两个需要担心。它们是用户体验（UX）设计师，他们在真正喜欢屏幕上显示的内容之前，无疑会改变十几次主意。然后是建模者，他们也可能反复调整鲨鱼/鱼的行为，并可能在组合中加入更多动物。\n\
  \n所以我们从 [图 17.1] 开始，这是一个非常明显且非常传统的划分。\n\n![](img/c17f001.jpg)\n\n**图 17.1.** Wa-Tor\
  \ 明显且传统的划分\n\n`WatorUI` 组件的级别低于 `WatorModel` 组件。根据依赖规则（Dependency Rule），这意味着源代码的依赖必须跨越架构边界并指向\
  \ `WatorModel`。正因如此，`WatorUI` 将成为 `WatorModel` 的插件。\n\n目前为止，这种划分中只有两个组件和一个边界。在更大的系统中，我们将会看到更多的边界以及每个边界内部的更多组件。\n\
  \n让我们先关注模型。我们需要哪些类？\n\n是的，我说了“类”。我们可能正在使用一种函数式语言。\n\n所以，初看之下，函数式设计和面向对象设计是硬币的两面。\n\
  \n**17.2.** 初始模型看起来如下：\n\n```\n(ns wator.cell)\n(defmulti type)\n```\n\n```\n(ns\
  \ wator.water)\n(def make {} ::type)\n```\n\n```\n(ns wator.animal)\n(defmulti move)\n\
  (defmulti reproduce)\n(defn tick [animal])\n```\n\n```\n(ns wator.fish)\n(def make\
  \ {} ::type)\n(defmulti tick [fish])\n(defmulti move [fish])\n(defmulti reproduce\
  \ [fish])\n```\n\n```\n(ns wator.shark)\n(def make {} ::type)\n(defmulti tick [shark])\n\
  (defmulti move [shark])\n(defmulti reproduce [shark])\n(defn eat [shark])\n```\n\
  \n\n\n但让我们暂时把这些都搁置一边。这种前期设计就够了。让我们看看能不能为一些行为编写代码。\n\n`water` 的行为是什么？我们询问我们的建模人员，他们告诉我们，如果给予足够的时间，`water`\
  \ 细胞会随机演变成一个 `fish` 细胞。这里是我对该规则的实现：\n\n点击此处查看代码图片\n\n```\n(ns wator.core-spec\n\
  \  (:require [speclj.core :refer :all]\n            [wator\n             [cell :as\
  \ cell]\n             [water :as water]\n             [fish :as fish]]))\n\n(describe\
  \ \"Wator\"\n  (with-stubs)\n  (context \"Water\"\n    (it \"usually remains water\"\
  \n          (with-redefs [rand (stub :rand {:return 0.0})]\n            (let [water\
  \ (water/make)\n                  evolved (cell/tick water)]\n              (should=\
  \ ::water/water (::cell/type evolved)))))\n\n    (it \"occasionally evolves into\
  \ a fish\"\n      (with-redefs [rand (stub :rand {:return 1.0})]\n        (let [water\
  \ (water/make)\n              evolved (cell/tick water)]\n          (should= ::fish/fish\
  \ (::cell/type evolved))))))))\n\n———\n\n(ns wator.water\n  (:require [wator\n \
  \            [cell :as cell]\n             [fish :as fish]\n             [config\
  \ :as config]]))\n\n(defn make [] {::cell/type ::water})\n\n(defmethod cell/tick\
  \ ::water [water]\n  (if (> (rand) config/water-evolution-rate)\n    (fish/make)\n\
  \    water))\n\n——————\n\n(ns wator.config)\n\n(def water-evolution-rate 0.99999)\n\
  ```\n\n所以，我们立刻看到了这个程序的“函数式”性质。(8) `tick` 的返回值是一个新的 `cell`。我不知道那个 `water-evolution-rate`\
  \ 是否正确。建模人员还没有告诉我们速率应该是多少。所以我只是猜的。我预计他们会等到看到模型的行为后，再告诉我们修改它。\n\n8。差不多。`(rand)` 的调用是不纯的。\n\
  \n到目前为止，我还没有指定任何动态类型。现在说这个还有点早。但我确定它是会来的。\n\n总之，让我们看看能不能让一条 `fish` 移动。\n\n等一下。你如何移动一条\
  \ `fish`？`fish` 在哪里？`fish` 知道自己的位置吗，还是由 `world` 知道？\n\n`cell` 被排列在一个二维矩形笛卡尔网图中，网格从左到右、从上到下循环。因此，`cell`\
  \ 的位置是元组 `[x y]`。`world` 可以用二维数组存储 `cell`，也可以用一个以位置元组为键的 map。\n\n我喜欢对这类事情使用 map，所以让我们创建一个充满\
  \ `water` 细胞的 `world`：\n\n点击此处查看代码图片\n\n```\n(context \"world\"\n  (it \"creates\
  \ a world full of water cells\"\n    (let [world (world/make 2 2)\n          cells\
  \ (:cells world)\n          positions (set (keys cells))]\n      (should= #{[0 0]\
  \ [0 1]\n                 [1 0] [1 1]} positions)\n      (should (every? #(= ::water/water\
  \ (::cell/type %))\n                      (vals cells))))))\n\n————\n\n(ns wator.world\n\
  \  (:require [wator\n             [water :as water]]))\n\n(defn make [w h]\n  (let\
  \ [locs (for [x (range w) y (range h)] [x y])\n        loc-water (interleave locs\
  \ (repeat (water/make)))\n        cells (apply hash-map loc-water)]\n    {:cells\
  \ cells}))\n```\n\n你注意到传递给 `interleave` 的 `water` 细胞惰性列表了吗？现在我们应该能够把一条 `fish` 放入世界并让它到处移动了。这是我的第一次尝试：\n\
  \n点击此处查看代码图片\n\n```\n(context \"animal\"\n  (it \"moves\"\n    (let [fish (fish/make)\n\
  \          world (-> (world/make 3 3)\n                    (world/set-cell [1 1]\
  \ fish))\n          [loc cell] (animal/move fish [1 1] world)]\n      (should= cell\
  \ fish)\n      (should (#{[0 0] [0 1] [0 2]\n                 [1 0] [1 2]\n    \
  \             [2 0] [2 1] [2 2]}\n               loc)))))\n```\n\n这非常直观。我们创建了一个中心有一条\
  \ `fish` 的 3x3 `world`。然后我们移动了这条 `fish`。最后，我们确保它仍然是一条 `fish`，并且它的目的地是其中之一。\n\n\n\
  \n```clojure\n(defn do-move [animal loc world]\n  (let [neighbors (world/neighbors\
  \ world loc)\n\n        destinations (filter\n                       #(water/is?\n\
  \                         (world/get-cell world %))\n                       neighbors)\n\
  \        new-location (rand-nth destinations)]\n    [new-location animal]))\n```\n\
  \n非常漂亮。我们向 `world` 请求该位置的 `neighbors`，过滤掉所有不是 `water` 的单元格，然后随机选择一个。很酷。\n\n我认为最好的办法是确保所有的环面数学计算都很好地封装在\
  \ `world` 内部。我不希望这些逻辑泄露到所有的 `animal` 中：\n\n点击此处查看代码图片\n\n```clojure\n(defn wrap\
  \ [world [x y]]\n  (let [[w h] (::bounds world)]\n    [(mod x w) (mod y h)])\n \
  \ )\n\n(defn neighbors [world loc]\n  (let [[x y] loc\n        neighbors (for [dx\
  \ (range -1 2) dy (range -1 2)]\n                    (wrap world [(+ x dx) (+ y\
  \ dy)]))]\n    (remove #(= loc %) neighbors))\n```\n\n### 你准备好面对那些不漂亮的内容了吗？\n\n\
  上面的代码拒绝编译，因为（你准备好了吗？）`water` 依赖于 `fish`（为了进化），`fish` 依赖于 `animal`（为了 `do-move`），而\
  \ `animal` 又依赖于 `water`。这是一个依赖循环，Clojure 非常讨厌依赖循环。参见图 17.3。\n\n![](img/c17f003.jpg)\n\
  \n**图 17.3.** 一个依赖循环\n\n好了，深呼吸。记住，我们是在这里玩游戏。在像 `Wa-Tor` 这样简单的应用中，我不会如此冷酷地划分这些文件。事实上，我很有可能直接把整个程序写在一个文件里，让恶魔随心所欲。但我们现在假装这是一个百万行的企业级应用程序，因此我们将对所有这些源代码依赖关系极其审慎。对吧？\n\
  \n所以，我们解决这个问题的方法是回到类似于旧 C 语言的声明与实现机制。参见图 17.4。\n\n![](img/c17f004.jpg)\n\n**图 17.4.**\
  \ 打破依赖循环\n\n通过拆分 `water` 使得其对 `fish` 的依赖位于 `water-imp` 中，并确保 `water-imp` 依赖于 `water`\
  \ 而不是反过来（即依赖倒置原则 DIP），循环被打破了。为了一致性，我也拆分了 `fish` 和 `shark`^(12)。我可能也需要拆分 `animal`^(13)。\n\
  \n12。实际上，只有 `fish`。我在图中拆分了 `shark`，但在代码中没有。YAGNI（你不需要这些功能），YAGNI，YAGNI。\n\n13。未来的\
  \ Uncle Bob：. . .不。\n\n所以现在的代码看起来是这样：\n\n点击此处查看代码图片\n\n```clojure\n(ns wator.world\n\
  \  (:require [wator\n             [water :as water]]))\n\n(defn make [w h]\n  (let\
  \ [locs (for [x (range w) y (range h)] [x y])\n        loc-water (interleave locs\
  \ (repeat (water/make)))\n        cells (apply hash-map loc-water)]\n    {::cells\
  \ cells\n     ::bounds [w h]}))\n\n(defn set-cell [world loc cell]\n  (assoc-in\
  \ world [::cells loc] cell))\n\n(defn get-cell [world loc]\n  (get-in world [::cells\
