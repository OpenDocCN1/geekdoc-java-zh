    给我拿食物。


    我感觉，如此奇怪，感觉就像……


    像我一样，莫度是古老者的学生，但我们曾是邻居。当我寻求救赎时，他一直被主宰——


    啊啊格格！！！


    ……更黑暗的欲望。


    啊啊格格！！！啊啊格格！


    啊希！啊哈哈啊。啊。


    当我成为古老者的继承者时，他在另一个地方接受了他的教导。


    他在一个比地狱更糟糕的地方找到了它，一个反叛的黑暗维度。


    恐惧之主多玛穆领域。


    小矮子，你到底在干什么？


    现在什么也没做了。多亏你了。


    提醒我一下，莫度，我是送你去地球是为了追逐享乐，还是为了工作？


    赫格格！


    一切都准备就绪。会完成的。别担心你那烧着的脑袋——


    他们都来了，他们都闻到了以太中的血味。


    但那个脑袋属于我。把它拿来，莫度。


    是的，会完成的，因为多玛穆下了命令。唯一的问题是，小莫度。


    你会是那个执行的人吗？


    否则，我会改为要你的。


    “没冒你了，医生。因为我知道他是你的宿敌之类的，但根据互联网上的，这个叫男爵莫度的家伙……”


    “他某种程度上是个失败者。”


    ## 魔法圣殿。


    这个国家里的每一个死亡都充满了失败者，塞尔玛。


    失去一切的人是最危险的人。相信我，我深有体会。


    我曾如此。


    是的，但我的意思是，你对付这家伙的胜率相当高。你每次和莫度决斗时都赢了他，对吧？


    我一直都拥有更强大的魔法，但即便如此我也无法救下所有人。


    莫度是黑魔法犯罪的大师，包括神秘恐怖主义、灵魂窃取、源于附身以及各种形式的肉体和精神的杀戮。


    男爵莫度是个危险的人，我必须找到他。


    你确定你有足够的魔法储备来对付他吗，医生？我见过你之后之后需要多久才能恢复——


    现在那不重要。重要的是找到莫度。


    我会尽一切办法搜遍这座城市，直到找到那个混蛋躲在哪里，然后——


    咚 咚


    ## 周二，男爵莫度


    你好，王。医生在吗？


    门，一定是门又故障了。它本该阻挡任何敲门的人，除非他们……


    流格


    他在这里。


    圣殿。激活防御封咒。


    医生现在的状态不应付这个。在经历了这一切之后——


    王，你是不是——


    我很好。


    那就待在里面。


    我们该怎么办，王？


    我希望我知道，艾玛。但这是一个全新的世界，即使对我来说也是——


    “以及《奇异奇异博士》。”


    卡尔……我正要找你呢。


    你找到我了。希望现在不是不方便的时候？


    对你来说，什么时候都方便。告诉我你去去哪儿了？


    那些该死的文青现在竟然穿得像德鲁伊一样。我讨厌那个村子。


    在风暴过去时寻求庇护。


    做得不错。你击败了埃普里克尔。我和老师留下了深刻印象。


    多玛穆。你又在侍奉多玛穆了。


    他是如何为你提供力量的，卡尔？你是不是——


    我想叙叙旧情够了。


    我们开始正事吧，好吗？


    我迫不及待想看全新的奇异博士大显身手了！


    我想，我应该就“一天一苹果，疾病远离#$%&*”之类的梗说句机智的回击。


    但你知道吗，卡尔？


    嘎嚓


    我没该死的时间了。


    啪


    我本打算逗逗你一会儿，延长你的痛苦之类的。但这个，这简直太可怜了。


    我觉得我简直是在施你的恩情。


    不客气，斯蒂芬！


    噢，我的苹果？


    这比我预想的还要糟糕。


    干得好，现在只要……只要让我出去。什么？你是怎么——？随时都可以。你到底是从哪儿弄来这件斗篷的？呃，放开我，你这该死的斗篷！别提我求你了。不！它是我的！你不能从我这里拿走！你不……不。不不……


    刚才发生了什么……噢，不。


    你好，医生。好久不见了，不是吗？看来我们有些事要叙叙了。告诉我。我最近做梦还好吗？


    ## 周二，第二部分。噩梦。


    ## 奇异博士：以太之血章节：万亿噩梦之夜


    人类人体内有60,000英里的血管，足够环绕地球好多次。有640块骨骼肌肉、45英里的神经、25英尺的血管。这一切在你的皮肤下交织成一个错综复杂的迷宫。如果我不小心划错了某个迷宫……你就会死。然而，我每周都会穿过那个迷宫多次。而且我从未失败过确定正确的位置，并做出拯救你生命而非终结它的切口。我穿裤的方式和别人一样，除非我打开并阅读地图的方式就像别人读书一样。然后进行切口。我是斯蒂芬·奇异医生，世界上最伟大的外科医生。这就是我天生要做的事。


    快！


    真巧，我正想些同样的事情。


    噢天哪，医生！这是你的房子？


    它比医院还大。


    这玩意儿有几个卧室？


    我不知道。让我们一起找找。


    > 什么——？


    > 在床底下，我观察了一整晚了。那里什么都没有。


    > 应该有什么吗？


    > 嗯。床底下什么都没有。


    > 大约有那种故事，对吧？我觉得我听过关于那样的故事。


    > 关于住在床底下的可怕东西。它们只在晚上出来。那些对我来说听起来像是糟糕的故事。我想你只是喝了太多酒。


    > 回床上睡。


    > 医生？你要去哪儿？


    > 有人知道这栋房子有地下室吗？


    > 可怕的东西。


    医生……我们楼上已经有很多酒了。


    在我的上一间房子里……我上一间房子的地下室有些不妙。


    这里什么都没有。我们为什么不回到——


    我不记得自己曾经害怕过。我的一生都是如此。


    我从未见过阴影中有任何东西在动，除了一个从黑暗中回望我的脸。


    据我所知，我从未经历过任何一件我无法解释的事情。


    你不觉得那……那是——


    那只是个地下室。这里没什么好怕的。


    为什么我想不出一个表示“正常”反义的词？那些词是存在的，不是吗？


    医生……回床上睡。


    我知道。那正是我所害怕的。


    不！！


    奇异是我的！那是我的头皮！


    该死你，这个白脸的——


    奇异会死在我手里。不是别人的手。我发誓。


    是的，你很喜欢发誓。不是吗，莫度？你竟然还让奖品溜走了，你这个矮小的鼠类。


