    STEPHEN STRANGE WAS A PREEMINENT SURGEON UNTIL A CAR ACCIDENT DAMAGED THE NERVES
    IN HIS HANDS. HIS EGO DROVE HIM TO SCOUR THE GLOBE FOR A MIRACLE CURE. BUT INSTEAD
    HE FOUND A MYSTERIOUS WIZARD CALLED THE ANCIENT ONE WHO TAUGHT MAGIC AND THAT
    THERE ARE THINGS IN THIS WORLD BIGGER THAN HIMSELF. THESE LESSONS TETHER EARTH''S
    FIRST DEFENSE AGAINST ALL MANNER OF MAGICAL THREATS CALL HIM...


    ## DOCTOR STRANGE


    The EMPIRIKUL, an interdimensional army, has destroyed almost all magic on Earth.
    Stephen and Earth''s mages managed to defeat them, but the state of magic will
    never be the same again.


    Now left to rebuild from the remains of the Sanctum Sanctorum, Doctor Strange
    finds himself at a crossroads.


    ## DOCTOR STRANGE


    DOCTOR STRANGE THE NEW FACE OF MAGIC


    ## YEARS AGO.


    THIS IS THE REAL 100% PURE MUTANT GROWTH HORMONE.


    THIS STUFF WILL MAKE YOU FEEL LIKE REAL OR MAKE YOU STRONGER ENOUGH TO CRUSH A
    CAR WITH YOUR BARE HANDS.


    I''D SETTLE FOR BEING ABLE TO WIPE MY BUT WITHOUT SCREAMING IN PAIN.


    GIVE ME ALL YOU GOT.


    YOU KNOW HOW TO DO THIS? I''VE... SEEN IT DONE. BUT MY HANDS... I CAN''T... YOU''LL
    HAVE TO DO IT FOR ME. THAT''LL COST YA EXTRA. ROLL UP YOUR SLEEVE.


    DUDE, YOU GAVE HIM TOO MUCH. I GAVE THE MAN HE PAID FOR. AIN''T MY FAULT IF HE
    CAN''T HANDLE HIS--


    EYES: LOOK OUT! HEY, MAN. YOU BETTER GET THOSE UNDER CONTROL BEFORE SOMEBODY CALLS
    THE----OH, HELL. I TOLD YOU TO GIVE HIM TOO MUCH. SHUT UP AND GRAB HIS LEGS.


    STAY


    WHO?


    IT DIDN''T WORK... I STILL CAN''T..


    THAT WAS MY LAST CHANCE. TRIED EVERYTHING I COULD POSSIBLY... WHAT DO I...


    WHERE THE HELL DO I GO NOW?


    HARDLY TOUCHED YOUR MAT, STEPHEN. IS SOMETHING WRONG?


    NO OFFENSE, CHONDU... BUT IT JUST DOESN''T TASTE THE SAME.


    NO, I DON''T SUPPOSE IT DOES.


    THE BAR TOOK QUITE A HIT FROM THE EMPIKUL. MUCH WAS LOST THAT CAN NEVER BE REPLACED.


    TELL ME ABOUT IT.


    BUT WE WILL REBUILD, NO MATTER HOW IT TAKES, WE WILL REOPEN.


    AND THE MAGIC WE HAD HERE WILL RETURN. STEPHEN, IN WAYS WE NEVER IMAGINED.


    THIS WAS MONAK''S SEAT.


    I WISH I COULD SAY THE SAME.


    I FEEL LIKE I''M STARTING OVER FROM SCRATCH, CHONDU. LIKE EVERYTHING I EVER LEARNED
    FROM THE ANCIENT ONE HAS BEEN BURIED AWAY, AND NOW THERE''S NOTHING BUT...


    THEN IT''S TO GO FIND OUT, DOCTOR STRANGE.


    IF THE OLD BOOKS OF MAGIC DON''T APPLY ANYMORE...IT''S TIME TO WRITE SOME NEW
    ONES.


    I DON''T EVEN KNOW WHAT THERE IS.


    ONE SPELL NAT A TIME, IF THAT''S WHAT IT TAKES.


    I''LL DO MY BEST, CHONDU. THANKS.


    ## BONK

    ONE SPELL AT A TIME:


    THE BAR WITH NO DOORS WASN''T THE ONLY PLACE TOOK A HIT FROM THE EMPIRIKUL


    WE ALL DID. ANYTHING AND EVERYTHING MAGIC RELATED


    THEY ALMOST KILLED IT. ALL OF IT. AND EVEN NOW, THE MAGIC IN THE WORLD IS STILL
    STRUGGLING TO COME BACK.


    LET''S SEE HOW WE''RE LOOKING TODAY.


    LIKE A GARDEN.


    IS MY JOB TO KEEP THAT GARDEN AS BEST.


    HEY, MAN. YOU BETTER GET THOSE UNDER CONTROL BEFORE SOMEBODY CALLS THE--


    OH, HELL. I TOLD YOU TO GIVE HIM TOO MUCH. SHUT UP AND GRAB HIS LEGS.


    LIKE A GARDEN.


    IS MY JOB TO KEEP THAT AS.


    THE SANCTORUM OF DOCTOR STRANGE.


    WONG, DOC. I THOUGHT YOU WERE GOING FOR A WALK.


    WALKS ARE A BIT TOUGHER THAN THEY USED TO.


    I''VE BEEN ORGANIZING OLD SPELLS THAT DON''T WORK.


    AND NEW ONES THAT DO.


    SO WHAT EXACTLY SHOULD I DO WITH ALL


    THE EMPIKUL BURNED MY LIBRARY. SO WE''RE GOING TO NEED A NEW ONE PAGE A TIME.


    OH, OKAY.


    BUT I''VE STILL GOT YOGA CLASS AT 4.


    IS IT DONE, WONG?


    THE MONKS HAVE ALL BEEN HOME, AND THE TEMPLE HAS BEEN DISMANTLED AS YOU REQUESTED.


    THOUGH I STILL THINK YOU''RE MAKING A---


    IT HAS TO BE.


    MAY I ASK WHAT HAPPENED TO YOUR FACE?


    THIS IS JUST THE WAY I LOOK NOW, WONG. SAY HELLO TO THE NEW FACE OF MAGIC.


    ALL THAT TRAINING, ALL THOSE SPELLS I HAD TO LEARN.


    GOT A MEETING... THE ANCIENT NEVER TOLD ME I COULD JUST USE BASEBALL BAT WRAPPED
    IN ENCHANTED BARBED WIRE.

