    \ QUESADA\n出版人：DAN BUCKLEY\n执行制片：ALAN FINE\n\n史蒂芬·斯特兰奇是一位顶尖的外科医生，直到一场车祸损伤了他的手部神经。他的自尊驱使他遍历全球寻找奇迹般的疗愈方法。但他发现了一位名为“古老者”的神秘巫师，他教他魔法，并告诉他这个世界上有比他更大的东西。这些教让地球对抗各种魔法威胁的第一道防线称他为……\n\
    \n## 奇异博士\n\n埃匹库尔（EMPIRIKUL），一支跨维度军队摧毁了地球上几乎所有的魔法。史蒂芬和地球上的法师们成功击败了他们，但魔法的状态永远无法回到从前。\n\
    \n现在从圣殿（Sanctum Sanctorum）的遗迹中重建，奇异博士发现自己处于一个十字路口。\n\n## 奇异博士\n\n奇异博士：魔法的新面孔\n\
    \n年前。\n\n这是真正的 100% 纯净变异人生长激素。\n\n这东西会让你感觉很真实，或者让你强大到能赤手捏碎一辆汽车。\n\n我只要能擦屁股而不疼得大叫就行了。\n\
    \n把你的本事都使出来。\n\n你知道怎么做吗？我……见过别人这么做过。但我的手……我做不到……你得替我做。那得额外加钱。卷起袖子。\n\n哥们，你给他的太多了。我给了他付钱买。他处理不了不是我的错——\n\
    \n眼睛：小心！嘿，伙计。你最好在有人报警之前把那些东西控制住——噢，见鬼。我告诉你给他太多了。闭嘴，抱住他的腿。\n\n留住\n\n谁？\n\n没用……我还是做不到……\n\
    \n那是我的最后机会了。尝试了我所能的一切……我该……\n\n我现在该去哪儿？\n\n几乎没碰上你的垫子，史蒂芬。哪里不对吗？\n\n没冒犯，秋杜（Chondu）……但味道不太一样。\n\
    \n不，我想确实如此。\n\n酒吧受到了埃匹库尔的沉重打击。许多无法弥补的东西丢失了。\n\n我懂。\n\n但我们会重建的，无论花多久，我们都会重新开业。\n\
    \n我们拥有的魔法将会回来的。史蒂芬，以我们从未想象过的方式。\n\n这是莫纳（Monak）的座位。\n\n我希望我也能这么说。\n\n我觉得我正从零开始，秋杜。感觉我从古老者那里学到的一切都被埋葬了，现在什么都不剩……\n\
    \n那就去寻找答案吧，奇异博士。\n\n如果古老的魔法书不再适用了……是时候写一些新的了。\n\n我甚至不知道那里还有什么。\n\n一次一个咒语，如果那是必须的话。\n\
    \n我会尽力的，秋杜。谢谢。\n\n咚（击声）\n一次一个咒语：\n\n那间没有门的酒吧并不是唯一一个受到埃匹库尔打击的地方\n\n我们都遭遇了。所有与魔法相关的任何事物和一切\n\
    \n他们几乎杀死了它。所有的魔法。即使现在，世界上的魔法仍在挣扎着回来。\n\n让我们看看今天情况如何。\n\n就像一个花园。\n\n我的工作就是让那个花园维持得尽可能好。\n\
    \n嘿，伙计。你最好在有人报警之前把那些东西控制住——\n\n噢，见鬼。我告诉你给他太多了。闭嘴，抱住他的腿。\n\n就像一个花园。\n\n我的工作就是让那个花园维持得。\n\
    \n奇异博士圣殿。\n\n旺，博士。我以为你要去散步了。\n\n散步比以前难了些。\n\n没冒犯，秋杜……但味道不太一样。\n\n不，我想确实如此。\n\n\
    酒吧受到了埃匹库尔的沉重打击。许多无法弥补的东西丢失了。\n\n我懂。\n\n但我们会重建的，无论花多久，我们都会重新开业。\n\n我们拥有的魔法将会回来的。史蒂芬，以我们从未想象过的方式。\n\
    \n这是莫纳的座位。\n\n我希望我也能这么说。\n\n我觉得我正从零开始，秋杜。感觉我从古老者那里学到的一切都被埋葬了，现在什么都不剩……\n\n那就去寻找答案吧，奇异博士。\n\
    \n如果古老的魔法书不再适用了……是时候写一些新的了。\n\n我甚至不知道那里还有什么。\n\n一次一个咒语，如果那是必须的话。\n\n我会尽力的，秋杜。谢谢。\n\
    \n"
