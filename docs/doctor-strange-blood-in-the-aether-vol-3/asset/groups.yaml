    谢谢你，斗篷，老伙计。


    不！


    啊啊！


    斯特兰由我来杀。多玛姆姆已经答应交给我的！


    该死，我利用了你，男爵·莫道作为诱饵，现在你的价值已经到头了。


    杀死斯特兰并不能带给你一直寻找了这么久的意义。听我的，永远不会。即使是死亡也不行。


    不过也许你无论如何都该死，卡尔。


    你真是个奇异的家伙，不是吗？告诉我，你感觉到的痛苦吗？


    这么多眼睛。我……我想我爱上你了。


    王，你确定我们应该离开幽灵位面吗？我的意思是，你看到那个火头家伙的体型了，对吧？


    幽灵位面对多玛姆姆是没用的。救医生只有一个办法。


    来吧，塞尔玛·斯坦顿。祈祷我们不要太晚。


    好吧，注定毁灭的将不仅仅是斯特兰博士了。


    啊啊！


    但这不足以保护我，时钟实际上保护我免受了冲击。感谢维山希提的微小奇迹。


    你能看到吗？在你的脑海中？我知道你有着可怕的想象力。我想让你在死之前能看到它。真正地看到它。


    看看当大法师陨落，当我彻底打开我们维度之间的大门时，你的世界将变成什么样。


    睁开眼睛，斯蒂芬·斯特兰博士，看着火焰，看着那些充满恐惧的脸。


    肉体将焚毁。灵魂将遭受蹂躏。


    人将吃人。母亲将杀掉仍在索要乳汁的婴儿。


    失智者将疯狂乱窜。世界将按照我的地狱形象重塑。


    你所认为美的一切都将枯萎死去，连同它曾存在过的记忆也之消失。


    而所有幸存者都将崇拜多玛姆姆——在他们悲惨生命的每一个清醒、尖叫、灵魂破碎的时刻。


    欢迎，斯蒂芬·斯特兰博士……来到新的黑暗维度。


    我要用你爱过的每一个人的骨头来建造我的王座，医生，就在你称之为家的土地上。


    由月球表面下的甲虫外壳制成，我拥有任何人有过的最后一个了。


    啊，不。谢了，多米。


    如果我足够好，也许足够让他睡一小会……


    纽约不需要另一个区了。光是困在斯塔滕岛就够糟糕了。


    我伸手伸进腰带寻找希望。我只找到了一个月亮护身符（Moon Mojo）。


    算了。


    不。腰带。坏了。希望没了。

