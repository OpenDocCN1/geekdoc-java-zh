- md: '

    "WITH AN OLD FRIEND."


    # YEARS AGO.


    GOOD NEWS. YOUR QUEST IS AT AN END.


    BEHOLD, STEPHEN STRANGE, I BRING YOU THE MIRACLE YOU HAVE CROSSED THE WORLD TO
    FIND.


    YOU CAN''T BE BE HERE. YOU KNOW THE ANCIENT ONE HAS FORBIDDEN YOU TO.


    I AM ONLY HERE TO HELP, STEPHEN. I AM HERE TO DO FOR WHAT YOUR MASTER NEVER HAS
    OR NEVER WILL.


    MORDO?


    ...REPAIR YOUR SHATTERED HANDS.


    WHAT?


    HOW MANY DIFFERENT CURES HAVE YOU SOUGHT OVER THE YEARS? MANY FRUITLESS LEADS
    DID YOU CHASE?


    HOW MUCH DID YOU PUT YOURSELF THROUGH ALL SO YOU COULD HOLD A SCALPEL AGAIN?


    WHAT IS THAT, MORDO?


    A HEALING ELIXIR, THE MOST POTENT I''VE EVER SEEN. TELL ME, DOES THE PAIN STILL
    KEEP YOU AWAKE AT NIGHT?


    THE ANCIENT ONE SAYS THE PAIN IS PART OF ME NOW. THERE''S NO CHANGING THAT.


    OF COURSE HE DOES, HE''S DESPERATE TO KEEP YOU HERE, IN SERVICE OF SLAVERY.


    THIS, STEPHEN, IS EMANCIPATION.


    I DON''T BELIEVE YOUR WORD, MORDO. I KNOW WHY THE ANCIENT ONE EXPELLED YOU. I
    KNOW WHAT YOU—


    PLEASE, DO NOT TAKE MY WORD FOR IT.


    ALLOW ME TO PROVIDE A DEMONSTRATION. NOW, IMAGINE IF YOU WILL, STEPHEN, THAT THIS
    BIRD...


    ...THIS SWEET, NAIVE LITTLE CREATURE...


    ...IS YOU.


    ONE DROP IS ALL IT TAKES AND...


    ...DOCTOR STRANGE IS FREE TO FLY AWAY HOME.


    TAKE IT, STEPHEN. TAKE YOUR CURE AND GO. GO BACK WHERE YOU BELONG.


    BACK TO YOUR CITIES. BACK TO THE ONLY LIFE YOU''VE EVER KNOWN.


    FORGET THE WORLD OF SORCERY EVEN EXISTS. YOU KNOW THAT''S WHAT YOU WANT. IT''S
    ALL YOU''VE EVER WANTED.


    NO.


    UUGH!


    YOU DO NOT BELONG HERE, STRANGE! YOU NEVER HAVE!

    TAKE THIS AND GO!

    WHILE YOUR HANDS ARE STILL THE ONLY THING ON YOU THAT ARE BROKEN!


    I''M NOT LEAVING, MORDO.


    WHAT? WHAT DID YOU SAY?


    I SAID... MY NAME IS STEPHEN STRANGE...


    AND I CHOOSE MAGIC!


    HI.

    REMEMBER ME?


    WHAT SAY WE TRY THIS AGAIN?


    HUH?

    ARE YOU TALKING TO—


    MAN, THE WEIRDOS IN THIS CITY GET WEIRDER EVERY DAY. BUT WOW...


    AT LEAST MY HEAD SUDDENLY FEELS A LOT BETTER.


    YOU''RE LATE.

    SORRY, I GOT A BIT.. DELAYED.


    I SUPPOSE THAT EXPLAINS THE FACE.


    IS THERE ANYTHING I NEED TO BE AWARE OF?


    ARE THERE ANY REASONS YOU MIGHT BE THINKING OF LEAVING US?


    I''M NOT LEAVING... UNTIL I''VE LEARNED EVERYTHING.


    WELL THEN...


    ".WE HAVE A LOT OF WORK TO DO, DON''T WE?"


    NO ONE EVER SAID MAGIC WOULD BE EASY.


    BUT THIS IS SUDDENLY A LOT HARDER THAN IT USED TO BE.


    I''VE ALREADY GOT ONE. THERE''LL BE HERE WAITING FOR YOU, IF YOU CAN EVER FIND
    YOUR WAY BACK.


    HELLO, WHO''S...


    I HEARD YOU WAS DEAD. I HEARD A FEW OTHER THINGS TOO.


    MORDO IS BACK IN TOWN. AND HE''S EAGER TO SEE SOME OLD FRIENDS.


    OH, NO.


    # DOCTOR STRANGE

    CHAPTER ONE: THE MOST MISERABLE MONDAYS


    I NEVER IMAGINED HOW MUCH I WOULD MISS THE SUFFERING, I MEAN. I TRULY DID TRY
    TO LIVE WITHOUT IT. IT''S BEEN ALMOST THREE ENTIRE DAYS SINCE I HURT ANYONE. BUT,
    MISERY IS ALL I EVER KNOWN. IT WAS MY CRADLE, MY MOTHER''S MILK. WITHOUT IT...
    I WITHER AND STARVE.


    YOU HUMANS, YOU DO TERRIBLE THINGS TO ANOTHER WHEN YOU''RE STARVING, DON''T YOU?


    STILL, I WANT YOU TO KNOW, I TAKE NO JOY FROM THIS SO DEEP DOWN, YOU UNDERSTAND.
    I KNOW YOU DO. PLEASURE, YES. AN IMMENSE AMOUNT OF PLEASURE. BUT NO JOY. I HOPE
    YOU ALL FORGIVE ME FOR WHAT I AM ABOUT TO DO.


    MAYBE SOMEDAY, I''LL EVEN BE ABLE TO FORGIVE MYSELF. THOUGH I''LL NEVER FORGIVE
    THE WHO—


    THESE PEOPLE HAVE DONE NOTHING TO YOU. I''M THE ONE YOU WANT TO SEE SUFFER. LET
    THEM GO.


    GAGAGH!


    I''M NOT A PART OF YOU ANYMORE DOCTOR. YOU OWN YOUR CREATURE NOW, YOU HAV''T EVEN
    ASKED MY NAME.


    WHAT... IS YOUR...


    IF YOU''VE GOT SOMETHING TO SAY, I''D PREFER YOU SCREAM IT.


    IT''S BEEN TOUGH. AFRAID I''M ALL OUT OF SCREAMS.


    HERE, TRY THIS INSTEAD.


    GUM OF THE WINTERFAWN TREE OF AUCKLAND, FRESHENS EVEN MY BREATH, AND ONCE IT''S
    CHEWED TO THE RIGHT CONSISTENCY...


    --FREEZES EVERYTHING IT TOUCHES.


    WHPP!


    SO SAD, SO MANY TOYS YOU HAVE TO CARRY WITH YOU NOW.


    WORDS AND A WAVE OF YOUR FINGERS USED TO BE ALL YOU EVER NEEDED.


    OH AND ALSO ME.


    LIFE WITHOUT ME IN YOUR CELLAR JUST SINS THE SAME. IT HURTS, DOESN''T IT? DOCTOR?
    IT DOESN''T IT BE SCOCHED? SUPREME, CERTAINLY I''D LOVE IT DOES.


    # NYU MEDICAL CENTER


    AND DO AND DO.


    # BLOOD IN THE AETHER


    YOU CAN''T GO.


    I DON''T KNOW WHAT''S HAPPENING. I DON''T KNOW... WHO YOU ARE.


    I AM BARON MORDO.


    WHO IS... THE BARON MORDO?


    YOU''LL LEARN. THE WHOLE WORLD WILL LEARN.

    '
  mdcn: '


    “和一位老友在一起。”


    # 多年前。


    好消息。你的追寻结束了。


    看吧，史蒂芬·斯特兰奇，我为你带来了你跨越世界来寻找的奇迹。


    你不该在这里。你知道古老者已经禁止你过来了。


    我来这里只是为了提供帮助，史蒂芬。我来这里是为了做你导师从未做过、也永远不会做到的事。


    莫多？


    ……修复你那破碎的手。


    什么？


    这些年来，你尝试过多少种治疗方法？你追寻过多少次徒劳的线索？


    为了能再次拿起手术刀，你让自己忍受了多少痛苦？


    那是什么，莫多？


    一瓶治愈药，我见过效力最强的一种。告诉我，痛苦是否还让你彻夜难眠？


    古老者说，痛苦现在已成为我的一部分。这一点是无法改变的。


    他当然是这么说的，他急于将你留在这里，为奴隶之效力。


    史蒂芬，这就是解放。


    我不相信你的话，莫多。我知道古老者为什么要驱逐你。我知道你——


    请，不要只听我的。


    让我来演示一下。现在，请想象一下，史蒂芬，如果这只鸟……


    ……这只甜美、天真的小生物……


    ……是你。


    只需要一滴，就……


    ……斯特兰奇医生就可以自由地飞回了了。


    拿去吧，史蒂芬。带上你的药走吧。回到你所属的地方去。


    回到你的城市。回到你唯一经历过的生活。


    忘记魔法世界曾经存在过吧。你知道那才是你想要的。那是你一直渴望的一切。


    不。


    呃！


    你不属于这里，斯特兰奇！你从不属于这里！

    拿上这个走吧！

    趁你的手还是你身上唯一坏掉的地方！


    我不离开的，莫多。


    什么？你刚才说什么？


    我说……我的名字是史蒂芬·斯特兰奇……


    而且我选择了魔法！


    嗨。

    还记得我吗？


    我们要不要再试一次？


    哈？

    你是在跟我说话吗——


    老兄，这座城市的怪胎一天一天比一天更怪了。但哇……


    至少我的头突然感觉好多了。


    你迟到了。

    抱歉，我稍微……耽误了。


    我想这解释了你的表情。


    有什么我需要注意的吗？


    你有什么理由考虑离开我们吗？


    我不会离开的……直到我学会一切。


    那么……


    “**我们有很多工作要做，不是吗？”


    没有人说过魔法是容易的。


    但这现在突然变得比以前困难得多。


    我已经有了一个。如果你能找到回来的路，它会在这里等你。


    你好，谁是……


    我听你死了。我也听说了其他几件事。


    莫多回到城里了。他急于见见一些老朋友。


    噢，不。


    # 奇异博士

    第第一章：最凄惨的周一


    我从未想过我会多么怀念痛苦，我的意思是。我真的尝试过没有没有痛苦的生活。自从我伤害任何人以来，已经过去整整三天了。但是，痛苦是我所知的一切。它是我的摇篮，是我母亲的乳汁。没有了它……我会枯萎和饿死。


    你们人类，在饥饿时会对别人做些可怕的事情，不是吗？


    尽管如此，我想让你们知道，从深处来说，我并没有从中获得任何快乐，你们懂的。我知道你们懂。快感，是的。巨大的快感。但不是快乐。我希望你们原谅我即将要做的事。


    也许有一天，我甚至能原谅我自己。尽管我永远不会原谅那什——


    这些人对你什么也没做。我才是那个你想要看他受苦的人。让他们走吧。


    嘎啊啊！


    我不再是你的一部分了，医生。你现在拥有你自己的生物，你甚至还没问过我的名字。


    你的……是你的……


    如果你有什么话想说，我希望你大声喊出来。


    这段时间很艰难。我怕我已经没力尖叫了。


    这里，试试这个吧。


    奥克兰冬青藤树的树脂，甚至让我的呼吸都变得清新，一旦咀嚼到合适的程度……


    ——冻结它所触及的一切。


    噗！


    真可怜，你现在得随身带着这么多玩具。


    言语和手指挥动曾是你需要的一切。


    噢，还有我。


    在你的地下室里没有我的生活同样是种罪。这很疼，不是吗？医生？难道不觉得被灼伤吗？至高无上，我当然很喜欢。


    # 纽约大学医学中心


    做，做，做。


    # 以太中的血


    你不能走。


    我不知道发生了什么。我不知道……你是谁。


    我是莫多男爵。


    谁是……莫多男爵？


    你会知道的。全世界都会知道的。

    '
