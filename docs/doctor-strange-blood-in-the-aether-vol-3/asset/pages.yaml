  md: 'STEPHEN STRANGE WAS A PREEMINENT SURGEON UNTIL A CAR ACCIDENT DAMAGED THE NERVES
    IN HIS HANDS. HIS EGO DROVE HIM TO SCOUR THE GLOBE FOR A MIRACLE CURE. BUT INSTEAD
    HE FOUND A MYSTERIOUS WIZARD CALLED THE ANCIENT ONE WHO TAUGHT MAGIC AND THAT
    THERE ARE THINGS IN THIS WORLD BIGGER THAN HIMSELF. THESE LESSONS TETHER EARTH''S
    FIRST DEFENSE AGAINST ALL MANNER OF MAGICAL THREATS CALL HIM...


    # # DOCTOR STRANGE


    The EMPIRIKUL, an interdimensional army, has destroyed almost all magic on Earth.
    Stephen and Earth''s mages managed to defeat them, but the state of magic will
    never be the same again.


    Now left to rebuild from the remains of the Sanctum Sanctorum, Doctor Strange
    finds himself at a crossroads.


