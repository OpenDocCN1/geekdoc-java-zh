  md: 'When you run the LinkedList program, enter a series of numeric values one at
    a time. These values are used as the data stored in each linked list node. After
    you have entered as many values as you want, choose 0 to finish. The nodes in
    the linked list will be displayed in ascending numeric order, as in this example:


    ```

    What value (0 to stop)? 7

    value (0 to stop)? 4

    value (0 to stop)? 13

    value (0 to stop)? 8

    value (0 to stop)? 5

    value (0 to stop)? 0

    4

    5

    7

    8

    13

    ```


    The first thing to note is the enumerated constant (line 3), which provides three
    constant values: kiSmaller, kiLarger, and kiSame. Every object that might be held
    in this linked list must support a compare() member function. These constants
    are the result value returned by the function.


    The Data class is declared on lines 8-17, and the compare() function is implemented
    on lines 21-29. A Data object holds a value and can compare itself with other
    Data objects. It also supports a show() member function to display the value of
    the Data object.


    The easiest way to understand the workings of the linked list is to step through
    an example of using one. On line 170, the main program is declared; on line 172,
    a pointer to a Data object is declared; and on line 174, a linked list is defined.


    When the linked list is created, the constructor that begins on line 158 is called.
    The only work done in the constructor is to allocate a HeadNode object and assign
    that object''s address to the pointer held in the linked list (line 160).


    This allocation of a HeadNode invokes the HeadNode constructor shown on line 131.
    In turn allocates a TailNode and assigns its address to the head node''s next
    pointer. The creation of the TailNode calls the TailNode constructor shown on
    line 102, an inline function that does nothing.


    Thus, by the simple act of allocating a linked list on the stack, the list is
    created, a head and tail node are created and their relationship is established,
    as illustrated in Figure 19.2.'
