    # Writing Professional-Quality Code


    With templates and exceptions under your belt, you are prepared to handle the
    more advanced aspects of C++. Before this 24-hour journey ends, it''s worth taking
    some time to discuss professional-quality code. When you go beyond hobbyist interest
    and work as part of a development team, you must write code that not only works
    but can be understood by others. Your code also must be maintained and supported
    by you, as the customer''s demands change, and also by others after you leave
    the project.


    Although it doesn''t matter what style you adopt, it is important to adopt a consistent
    coding style. An adherence to style makes it easier to guess what you meant by
    a particular part of the code, and avoid having to look up whether you spelled
    the function with an initial cap the last time you invoked.


    The following guidelines are just one of doing things, they''ve been tested by
    personal experience. You can easily devise your own, but these will get you started.


    Though Waldo Emerson said, “Foolish consistency is the hobgoblin of small minds,”
    Emerson never had to deliver a 100,000-line C++ web application on deadline. Having
    consistency in your code is a good thing. It makes your life, and the life of
    your co-workers, easier if you follow the style of your group. That doesn''t mean
    the style has to be permanently fixed (improvements and new ideas come along the
    time), but the consistency makes it easier for everyone to work together.


    Understand that there are many different styles, and you can run into serious
    disagreements on the following topics. Remember that these are guidelines, not
    absolutes.


    # Braces


    How to align braces be the most controversial topic between C and C++ programmers.
    Here are the tips I suggest:


    +   * Matching braces should be aligned vertically.


    +   * The outermost set of braces in a definition or declaration should be at
    the left margin. Statements within them should be indented. All other sets of
    braces should be in line with their leading statement.'
