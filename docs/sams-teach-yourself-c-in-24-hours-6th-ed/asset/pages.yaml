  md: "# Interface Versus Implementation\n\nThe parts of a program that create and\
    \ use objects are the clients of the class. The class declaration serves as a\
    \ contract with these clients. The contract tells clients what data the class\
    \ has available and what the class can do.\n\nFor example, the Tricycle class\
    \ declaration, you promise in the contract that every Tricycle object will be\
    \ able to retrieve its speed, that you can initialize the speed at construction\
    \ and retrieve it later, and that every Tricycle will know how pedal() and brake().\n\
    \nIf you make getSpeed() a const function, the contract also promises that it\
    \ won't change the Tricycle on which it is called in that function.\n\n# Organizing\
    \ Class Declarations and Function Definitions\n\nClass definitions often be separate\
    \ from their implementations in the source code of C++ programs. Each function\
    \ that you declare for your class must have a definition. Like functions, the\
    \ definition of a class function has a header and a body.\n\nThe definition must\
    \ be in a file that the compiler can find. Most C++ compilers expect that the\
    \ file end with .cpp.\n\nAlthough you put the declaration in the source code file,\
    \ a convention that most programmers adopt is putting the declaration in a header\
    \ file with the same name ending with the extension .hpp (or less commonly .h\
    \ or .hpp).\n\nSo if you put the declaration of the Tricycle class in a file named\
    \ Tricycle.hpp, the definition of the class would be in Tricycle.cpp. The header\
    \ file can be incorporated into the .cpp file with a preprocessor directive:\n\
    \n```\n#include \"Tricycle.hpp\"\n```\n\nThe reason to separate them is because\
    \ clients of a class don't care about the implementation specifics. Everything\
    \ they need to know is in the header file.\n\n# Inline Implementation\n\nJust\
    \ as you can tell the compiler to make a regular function inline, you can make\
    \ member functions inline. The keyword inline appears before the return value,\
    \ as in in this example:\n\n```\ninline int Tricycle::getSpeed()\\n{\n    return\
    \ speed;\n}\n```"
