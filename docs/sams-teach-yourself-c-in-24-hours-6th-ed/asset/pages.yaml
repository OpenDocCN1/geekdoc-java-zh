  md: '# # HOUR 5

    # Calling Functions


    **What You''ll Learn in This Hour:**


    +   - What a function does

    - How to declare and define functions

    - How to call functions with arguments

    - How to return a value from a function


    # ## What is a Function?


    A *function* is a section of a program that can act on data and return a value.
    Every C++ program has at least one function, the `main()` function called automatically
    when the program runs. This function can contain statements that call other functions,
    some of which might call others, and so on.


    Each function has a name to call the function. The execution of the program branches
    to the first statement in that function and continues until it reaches a `return`
    statement or the last statement of the function. At that point, execution resumes
    at the place where the function was called.


    A well-designed function performs a specific task. Complicated tasks should be
    broken into multiple functions, each of which can be called in turn. This makes
    your code easier to understand and maintain.


    # ## Declaring and Defining Functions


    Before you can write the code for a function, you must declare it.


    A function declaration tells the compiler the function''s name, the type of data
    the function produces, and the types of any parameters received by the function.
    A function''s declaration, which is also called its *prototype*, contains no code.'
