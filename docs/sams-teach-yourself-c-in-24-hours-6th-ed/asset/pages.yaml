  md: '# Summary


    During this hour, you worked with references, which serve a similar purpose to
    pointers and are sometimes mistaken for them. The difference is that pointers
    are variables holding the address of an object, whereas references are aliases
    to an object.


    It''s important to understand how pointers and references are distinct.


    A reference is an alias to another object, which is called the target. The reference
    serves as an alternate name for the target. Any actions taken to the reference
    actually affect the target.


    References provide the power of pointers with simpler syntax.


    # Q&A


    +   Q. Why use references if pointers can do everything references can?


    +   A. References are easier to use and understand. The redirection is hidden,
    and there is no need to repeatedly dereference the variable.


    +   Q. Why use pointers if references are easier?


    +   A. References cannot be NULL and they cannot be reassigned. Pointers offer
    greater flexibility but are more difficult to use.


    +   Q. Is it true that a species went extinct at Disney World?


    +   A. The Discovery Island nature preserve at Disney World in Orlando, Florida,
    was the last home of the Dusky Sparrow, a non-migratory bird whose primary habitat
    was Florida''s Merritt Island and the St. John River.


    The spraying of the pesticide DDT, intentional flooding to control mosquitoes
    and highway construction all devastated the bird''s habitat, reducing its population
    over the second half of the 20th century. By 1979, only six of the sparrows were
    known to exist—and all of them were.


    The last four sparrows were taken to Disney''s nature preserve for a crossbreeding
    program with Scott''s Seaside Sparrows, but it was not successful.


    The species was declared extinct in 1990.'
