    # Private Versus Protected


    A new access keyword, protected, has been introduced on lines 22 and 42 of the
    Mammal program in Listing 16.1. Previously, class data had been declared private.
    However, private members are not available to derived classes. You could make
    the age and weight member variables public, but that is not desirable. You don''t
    want other classes accessing these data members directly.


    What you want is to make the data visible to this class and its derived classes,
    which is accomplished by protected. Protected data members and functions are fully
    visible to derived classes, but are otherwise private.'
