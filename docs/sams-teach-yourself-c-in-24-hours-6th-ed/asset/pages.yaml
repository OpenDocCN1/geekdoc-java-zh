  md: '# Linked List Case Study


    In this section, we examine a linked list in detail as a case study how to use
    inheritance, polymorphism, encapsulation to manage large projects. It’s also a
    chance to explore how to create complex structures in C++.


    # Delegation of Responsibility


    A fundamental premise of object-oriented programming is that each object does
    one thing very well and delegates to other objects anything that is not part of
    its mission.


    A car is a demonstration of this idea. The engine’s job is to produce the power.
    Distribution of power is not the engine’s job; that is up to the transmission.
    Turning is not the job of the engine or the transmission; that is delegated to
    the wheels.


    A well-designed machine has lots of small, well-understood parts, each doing its
    own job and working together to accomplish a greater goal. A well-designed program
    is much more than: Each class sticks to its assignment, but together they create
    a functioning program.


    # Component Parts


    The linked list will consist of nodes. The node class itself will be abstract;
    we’ll use three-types to accomplish the work. There will be a head and tail node
    to manage those parts of the list and zero or more internal nodes. The internal
    nodes keep track of the actual data to be held in the list.


    Note the data and the list are quite distinct. You can save any type of data in
    a list. It is not the data that is linked together; it is the node that holds
    the data that is linked.


    A program doesn’t actually know the nodes; it only works with the list. The list
    does little work, simply delegating to the nodes.


    This hour’s first project, the LinkedList program demonstrates an object-oriented
    approach to linked lists. The program has three primary classes: Data, Node, and
    LinkedList. When it is run, the program asks the user for a series of integers,
    storing each in one of the Data class. These objects are stored in a LinkedList
    object and displayed in numerical order, even if they weren’t entered in order.


    The LinkedList uses a HeadNode class that’s one of three implementations of the
    abstract class Node. The other two are TailNode and InternalNode. Only the InternalNode
    holds data.


    The full program is in Listing 19.1. The source code is heavily commented to explain
    how each part works. To develop an understanding of how it works, read beginning
    where the main() function starts in line 170 and how to construct constructor
    and member function. The comments should give you a good idea of what is taking
    place before you enter the code yourself.'
