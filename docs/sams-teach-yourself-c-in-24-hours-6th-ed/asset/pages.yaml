  md: '# HOUR 13

    Developing Advanced References and Pointers


    What You''ll Learn in This Hour:


    +   - How to use pass to make your programs more efficient

    - How to decide when to use references and when to use pointers

    - How to avoid memory problems when using pointers

    - How to avoid the pitfalls of using references


    # Passing by Reference for Efficiency


    Each time you pass an object into a function by value, a copy of the object is
    made. Each time you return an object from a function by value, another copy is
    made.


    With large, user-created objects, the cost of these copies is substantial. You''ll
    use more memory than you need and your program will run more slowly.


    The size of a user-created object on the stack is the sum of all of its member
    variables. In turn, each can become user-created objects. Passing such a massive
    structure by copying onto the stack can be expensive in terms of performance and
    memory consumption.


    There is another cost, too. With the classes you create, each of these temporary
    copies is created when the compiler calls a special constructor: the copy constructor.


    In Hour 14, "Calling Advanced Functions," you learn how constructors work and
    how you can make your own. For now, it is enough to know that the constructor
    is called each time a temporary copy of the object is put on the stack. When the
    temporary object is destroyed, which happens when the function returns, the object''s
    destructor is called. If an object is returned by value, a copy of that object
    must also be made and destroyed.


    With large objects, the constructor and destructor calls can be expensive in speed
    and use of memory. To illustrate this idea, the ObjectRef in Listing 13.1 creates
    a stripped-down, user-created object: SimpleCat. A real object would be larger
    and more expensive, but this is sufficient to show how often the copy constructor
    and destructor are called.'
