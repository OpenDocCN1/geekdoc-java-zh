    # Implementing Pure Virtual Functions


    Typically, the virtual functions in an abstract base class are never implemented.
    Because no objects of that type are created, there is no reason to provide implementations,
    and the ADT works purely as the definition of an interface to objects that derive
    from it.


    It is possible, however, to provide an implementation to a pure virtual function.
    The function then can be called by objects derived from the ADT, perhaps to provide
    common functionality to all the overridden functions.


    The Shape2 program in 18.4 defines Shape as an ADT and includes an implementation
    for the pure virtual function draw(). The Circle class overrides draw(), as it
    must, and then chains up to the base class for additional functionality.


    In this example, the additional functionality is simply an additional message
    displayed. A more robust graphical class could set up a shared drawing mechanism,
    perhaps setting up a window that all derived classes use.


