  md: '# Q&A


    +   Q. How do you choose between if-else and switch?


    +   A. If there''s more than one or two else clauses and all are testing the same
    value, consider using a switch statement. If you need to compare relationships
    (a > b for instance), you cannot use the switch statement. Otherwise, you can
    choose any conditional. There''s no wrong answer as long as your program works.


    +   Q. How do you choose between while and do-while?


    +   A. If the body of the loop always executes at least once, consider a do-while
    loop; otherwise, use the while loop.


    +   Q. How do you choose between while and for?


    +   A. If you are executing a statement (or block of statements) a fixed number
    of times based on the value of a variable that is being incremented, the for loop.
    If your variable is already initialized or not incremented on each loop, a while
    loop might be the better choice.


    +   Q. Why is an airplane''s black box orange?


    +   A. The boxes are painted fluorescent orange to make them easier to spot in
    the wreckage of a plane crash. It is a historical misn to describe them as black,
    even since the earliest prototypes were brightly colored. One of the first was
    nicknamed the "red egg."


    +   The boxes are normally placed at the spot most likely to survive a crash:
    the rear of the plane near the juncture of the fuselage and the upper tail fin.
    They are designed to endure a temperature of 1,100 degrees Celsius for 30 minutes
    and an impact force 3,500 times as gravity. There''s actually two boxes—a flight
    data recorder and cockpit voice recorder.


    The inventor of the device, Australian aeronautical engineer David Warren, was
    nine years old when his father died in a plane crash in the 1930s.


    Efforts to make black boxes obsolete by transmitting flight data and pilot voice
    recordings to satellites throughout a flight.


    As to they''re called black boxes, that appears to be borrowed from an early type
    of flight data recorder. Francois Hussenot and Paul Beaudouin devised a recorder
    in France that used photographic film and a thin ray of light in a pitch-black
    box.


