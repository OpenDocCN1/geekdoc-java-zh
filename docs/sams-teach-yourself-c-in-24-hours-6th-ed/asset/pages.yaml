    # # The Indirection Operator, or Using Pointers Indirectly


    The indirection operator * also is called the dereference operator. When a pointer
    is dereferenced,

    t value at the address stored by the pointer is retrieved. Consider the following
    statements to

    assign one variable''s value to another:


    ```

    unsigned short int howOld = 50;

    unsigned short int yourAge;

    yourAge = howOld;

    ```


    A pointer provides indirect access to the value of the variable whose address
    it stores. To assign

    t value in how to the new variable yourAge by way of the pointer pAge, you write
    the\following:


    ```

    unsigned short int howOld = 50;           // create the variable howOld

    unsigned short int *pAge = &howOld;   // pAge points to the address of howOld

    unsigned short int yourAge;         // create another variable

    yourAge = *pAge;                      // assign value at pAge (50) to yourAge

    ```


    The indirection operator * in front of the variable pAge means "the value stored
    at.\ This

    assignment says, "Take the value stored at the address in pAge and assign it to
    yourAge.

    Another way of thinking about it is "don''t affect the pointer, affect the item
    stored at the address

    in the pointer."


    NOTE

    Theirection operator * is used in two distinct ways with pointers: declaration
    and dereference.

    When a pointer is declared, the star indicates that it is a pointer, not a normal
    variable.

    For example:


    ```

    unsigned short *pAge = nullptr; // make a pointer to an unsigned short

    ```


    When the pointer is dereferenced, the indirection operator indicates that the
    value at the memory

    location stored in the pointer is to be accessed, rather than the address itself:

    *pAge = 5; // assign 5 to the value at pAge


    Also note that this character (*) is used as the multiplication operator. The
    compiler knows

    which operator to call based on context.'
