  md: 'You confirm your early decision that you will read each mail message in its
    original format and transform it into PostMaster format. This way you will only
    have to store one core format, and writing to and from the disk will be simplified.
    You also decide to separate the header information (sender, recipient, date, title,
    and so on) from the body of the message. Often the user will want to scan the
    headers without necessarily reading the contents of all the messages. You anticipate
    that some time come when you want to download all the headers from the message
    provider, without getting the text at, but for now you intend that version of
    PostMaster always get the full message, although it might not display it to the
    user.


    # # Initial Class Design


    This analysis of the messages leads you to design the Message class. In anticipation
    of extending the program to non-email messages, you derive EmailMessage from the
    abstract base. From EmailMessage you derive PostMasterMessage, InterchangeMessage,
    OutlookMessage, GmailMessage, and so on.


    Messages are a natural choice for objects in a program handling mail messages,
    but finding all the right objects in a complex system is the greatest challenge
    of object-oriented programming. In some cases, such as messages, the primary objects
    seem to fall out of your understanding of the problem. More often, you have to
    think hard and about what you are trying to accomplish to find the right objects.


    Don''t despair. Most designs are not the first time. A good starting point is
    to describe the problem out loud. Make a list of all the nouns and verbs you use
    when describing the project. The nouns are good candidates for objects. The verbs
    might be the functions of those objects (or they might be objects in their own
    right). This is not a foolproof technique, but it is a good technique to use when
    starting on your design.


    Now the question arises, “Should the message header be a separate class from the
    body?” If so, do you need parallel hierarchies—ForumBody and ForumHeader as well
    as EmailBody and Email?


    Parallel hierarchies are often a warning of bad design. It is a common error in
    object-oriented design to have a set of objects in one hierarchy and a matching
    set of manager objects in another. The burden of keeping these hierarchies up-to-date
    and in sync with each other becomes overwhelming: a class maintenance nightmare.


    There are no hard-and-fast rules to designing a class hierarchy, of course, and
    at times parallel hierarchies are the most efficient way to solve a particular
    problem. Nonetheless, if you see your design moving in this direction, you should
    rethink the problem because a more elegant solution might be available.'
