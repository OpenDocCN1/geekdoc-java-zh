  md: '# # Q&A


    **Q. How big is a class object?


    +   A. A class object''s size in memory is determined by the sum of the sizes
    of its member variables. Class functions don''t take up room as part of the memory
    set aside for the object. Class functions don''t take up room as part of the memory
    set aside for the object.


    Some compilers align variables in memory in such a way that two-byte variables
    actually consume somewhat more than two bytes.


    **Q. Why shouldn''t I make all the member data public?


    +   A. Making member data private enables the class to use the data without worrying
    about how it is stored or computed. For example, the Tricycle class has a member
    function `getSpeed()`, clients of the Tricycle class can ask for the trike''s
    speed without knowing if the trike stores its speed in a member variable or computes
    it on-the-fly. Public data is global data—any code that uses the object can access
    the data. If it becomes changed, there''s often a difficult time figuring out
    where it happened.


    **Q. Why do gnomes protect our yards instead of lawn elves, lawn dwarves, lawn
    halflings, lawn half-elves, or lawn half-orcs?


    +   A. Lawn gnomes date back to 19th century Germany, where in the village of
    Thuringia the ceramic artisan Philipp Griebel created the first yard protectors
    in honor of local myths about gnomes protected gardens at night.


    The gnomes proved popular enough to spread over all Germany, then over to England,
    and finally the world. They''re typically bearded males with a red hat who smoke
    pipes.


    A popular prank in recent years is "gnoming," which is stealing someone''s lawn
    gnome and having him photographed at remote locations, perhaps even on a foreign
    vacation. In France in the late 1990s, a group calling itself the Gnome Liberation
    Front stole more than 150 in a bid to give them their freedom.


