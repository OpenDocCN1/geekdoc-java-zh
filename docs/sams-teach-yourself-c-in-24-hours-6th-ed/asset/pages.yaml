  md: '# Ongoing Design Considerations


    As the project continues, you will repeatedly confront this basic design issue:
    In which class should you put a set of functionality (or information)? Should
    the message class have this function, or should the address class? Should the
    editor store this information, or should the message store it itself?


    Your classes should operate on a need-to-know basis, much like international super
    spies. They shouldn''t share any more knowledge than absolutely necessary.


    As progress with your program, you will face hundreds of design issues. They will
    range from the global questions, “What do we want this to do?” to the more specific,
    “How do we make this work?


    Although the details of your implementation will not be finalized until you ship
    the code, and some of the interfaces will continue to shift and change as you
    work, you must ensure that your design is well understood in the process. It is
    imperative that you know what you are trying to build before you write the code.
    The single most frequent cause of software projects dying on the vine must be
    that there is not sufficient communication, early enough in the process, about
    what is being built.


    To get a feel for what the design process is like, examine this question: What
    will be on the menu? For PostMaster, the first choice is probably New Mail Message,
    and this raises another design issue: When the user selects New Message, what
    happens? Does an editor created, which in turn creates a mail message, or a new
    mail message created, which then creates the editor?


    The command you are working with is New Mail, so creating a new message seems
    like the obvious thing to do. But what happens if the user clicks Cancel after
    starting to write the message? Perhaps it would be cleaner to first create the
    editor and have it create (and own) the new message.


    The problem with this is that the editor will need to act differently if it is
    editing the message. If the message is created first, then handed to the editor,
    only one set of code needs to exist because everything is an edit of existing
    message.


    If a message created first, who creates it? Is it by the menu command code? If
    so, does the menu also tell the editor to edit itself, or is this part of the
    constructor of the message?


    It makes sense for the constructor to do this at first glance; after all, every
    time you create a message you''ll probably want to edit it. Nonetheless, this
    is not a good design idea. First, it is possible that the premise is wrong; you
