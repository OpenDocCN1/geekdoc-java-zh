    # Styles of Programming


    As programming languages have evolved, languages have been created to cater to
    different styles of programming.


    In procedural programming, programs are conceived as a series of actions performed
    on a set of data. Structured programming was introduced to provide a systematic
    approach to organizing these procedures and managing large amounts of data.


    The principal idea behind structured programming is to divide and conquer. Take
    a task that needs to be accomplished in a program, and break it down into a set
    of smaller component tasks. If any of those tasks is still too complicated, break
    it down into even smaller tasks. The end goal is tasks that are small and self-contained
    enough to be easily understood.


