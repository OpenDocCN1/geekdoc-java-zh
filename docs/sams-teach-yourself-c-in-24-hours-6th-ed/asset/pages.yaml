  md: '# Q. Why are changes to the value of function parameters reflected in the calling
    function?


    A. Parameters passed to a function are passed by value. That means that the parameter
    received by the function is actually a copy of the original value, even if it
    shares the same variable name. You learn how to pass a changeable parameter to
    a function when you are working with pointers and references in Hour 10.


    # Q. What happens if I have the following two functions?


    ```

    int findArea(int width, int length = 1);

    int findArea(int size);

    ```


    Will this overload? There are a different number of parameters, but the first
    one has a default value.


    A. The declarations will compile, but the findArea() with one parameter will cause
    a compile-time error about "ambiguity between findArea(int, int) and findArea(int).


    # Q. Why doesn''t anyone ever use a No. 1 pencil?


    A. Pencils are produced according to a grading system that rates them based on
    how soft the lead is, which dictates the darkness of the mark it produces. The
    softer the lead, the darker the mark.


    The grades of pencils sold in the United States are No. 1, 2, 2.5, 3, and 4.


    The No. 1 produces the darkest mark, but the soft lead breaks more easily and
    requires sharpening more often. The No. 4 has the hardest lead and produces the
    faintest mark.


    No. 2, by striking a balance between lead softness and mark darkness, is so popular
    that most people aren''t aware any of the others exist.


    The others can be found at supply stores, though they may use another grading
    system entirely using "B" for the softest leads and "H" for the hardest. The range
    goes "9B", "8B", "7B" on to a middle value of "B", then goes from "H" to "2H",
    "3H", "4H" up to a maximum of "9H".


    Also, pencils aren''t made of lead. They''re graphite.


    Who knew pencils so complicated? If you need to take notes while you figure all
    of this out, use a No. 2 pencil.


    # Workshop


    Now you''ve had the chance to see functions, you can answer a few questions and
    do a couple of exercises to firm up your knowledge of function prototypes and
    function parameters.'
