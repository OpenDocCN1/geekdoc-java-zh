  md: 'This statement creates a Tricycle object named wichita. The Tricycle class
    is used as a template for the object. The object will have all member variables
    and member functions defined for the class.


    C++ differentiates between the class Tricycle, which is the concept of a tricycle,
    and each individual Tricycle object.


    An object is just an individual instance of a class. When you create an object,
    you are said to “instantiate” it from the class.


    > NOTE

    Because C++ is case sensitive, class names should follow the same convention to
    minimize errors. Instead of having to remember whether a class is called Tricycle,
    tricycle, or TRICYCLE, if you always prefix the first letter of a class you''ll
    know it is Tricycle. Some programmers prefix each class name with a lowercase
    letter (for example, cTycle or cKeyboard). The convention used in this book is
    initial capitalization, as in Tricycle and Sasquatch.


    Member variables and functions should also follow the same naming rules. This
    begins both with lowercase letters, as in speed and pedal(), and a capital letter
    beginning each subsequent word (if any), as in bringMyTricycle().


    # Accessing Class Members


    After you create an object, you use the dot operator (.) to access the member
    functions and variables of that object. As you might recall, the Tricycle class
    has a member variable called speed. To set this variable, use the dot operator:


    ```

    Tricycle wichita:

    wichita.speed = 6;

    ```


    After the member function pedal() function has been defined, the dot operator
    is used to call wichita.pedal();


    # Private Versus Public Access


    The Tricycle class has two public member variables and two public member functions.
    The public keyword makes these parts of the class available to the public—in other
    words, other classes and programs that use Tricycle objects.'
