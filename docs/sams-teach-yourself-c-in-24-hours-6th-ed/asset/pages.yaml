  md: '# Operators


    # 51


    Because multiplication has higher precedence than addition and the same operators
    have left-to-right order, 8 times 9 is evaluated first and becomes 72:


    ```

    int x = 5 + 3 + 72 * 6;

    ```


    Next, 6 times is evaluated:


    ```

    int x = 5 + 3 + 72 + 24;

    ```


    Now the addition operators are handled in left-to-right order. The final result
    is that x equals 104.


    Some operators, such as assignment, are evaluated in right-to-left order:


    ```

    int z = x = y + 13;

    ```


    The first expression is evaluated is y + 13, which is assigned to x. Next, x is
    assigned to z.


    When precedence does not meet your needs, you can use parentheses to impose a
    different order. Items within parentheses are evaluated at a higher precedence
    than any mathematical operators:


    ```

    int totalSeconds = (minutesWork + minutesTravel) * 60;

    ```


    This expression adds minutesWork and minutesTravel, multiplies the result by 60,
    and assigns it to totalSeconds.


    Parentheses can be nested within each other. The innermost parentheses are evaluated
    first:


    ```

    totalSeconds = ((secondsWork * 60) + minutesTravel) * 60;

    ```


    NOTE


    When in doubt, use parentheses to make an expression''s meaning clear. They do
    not affect a program''s performance, so there''s no harm in using them even in
    cases where they wouldn''t be needed.


    # Relational Operators


    Relational operators are used for comparisons to determine when two numbers are
    equal or one is greater or less than the other. Every relational expression returns
    either true or false. The relational operators are presented in Table 4.2.'
