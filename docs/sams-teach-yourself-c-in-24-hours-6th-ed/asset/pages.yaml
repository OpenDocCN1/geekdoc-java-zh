    # # Overriding Functions


    A Dog has access to all the member functions in class Mammal, as well as any member
    functions, such as wagTail(), that the declaration of the Dog class might add.
    It can also override a base class function. Overriding means means the implementation
    of a base class function in a derived class. When you make an object of the derived
    class, the correct function is called.


    When a derived class creates a member function with the same return type and signature,
    but with a new implementation, it is said to be overriding that.


    When you override a function, it must agree in return type and signature with
    the function in the base class. The signature is the function prototype other
    than the return type that is, the name, the parameter list, and the keyword const,
    is used.


    The signature of a function is its name, and the number and type of its parameters.
    The signature does not include the return type.


    The Mamm5 program (Listing 16.5) illustrates what happens when the Dog class overrides
    the speak() member function in the Mammal class. To save room, the accessor functions
    have been left out of these classes.


