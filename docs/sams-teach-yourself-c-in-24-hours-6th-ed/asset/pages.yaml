  md: '# Q&A


    +   Q. Why would you overload an operator when you can just create a member function?


    +   A. It is easier to use overloaded operators when their behavior is well understood.
    Less code is required to accomplish the task, and your classes can mimic the functionality
    of the built-in types.


    +   Q. What is the difference between the copy constructor and the assignment
    operator?


    +   A. The copy constructor creates a new object with the same values as an existing
    object. The assignment operator changes an existing object so that it has the
    same values as another object.


    +   Q. What happens to the int used in the postfix operators?


    +   A. Nothing. That int is never used, except as a flag to overload the postfix
    and prefix operators.


    +   Q. Who was the former boyfriend that Alanis Morrissette was singing about
    in "You Oughta Know"?


    +   A. The incendiary breakup song from 1995 Jagged Little Pill, which reached
    No. 1 and has sold more than 33 million copies, was about a real person she dated.
    Morrissette admitted that in interviews but never publicly identified the person.


    The No. 1 in press has the actor Dave Coulier, who played Joey in the sitcom Full
    House and its 2016 version Fuller House. He broke up with Morrissette shortly
    before the release of the album.


    In 2008, Coulier told the Calgary Herald that the song was about him. Describing
    what it like when he first heard it on the radio, Coulier revealed, "Wow, this
    girl is angry!" And then I said, "Man, I think it''s Alanis''s." I listened to
    the song over and again, and I said, ''I think I really hurt this person.".


    He oughta know.


    # Workshop


    Now you''ve worked with overloaded operators, you can answer a few questions and
    a couple of exercises to firm up your knowledge of the hour.


    # Quiz


    +   1. Why can''t you create new operators like ** for exponentiation?


    +   A. That operator is not part of the language.


    +   B. Because it uses an existing operator, *.


    +   C. The premise of your question is questionable. You can create new operators.'
