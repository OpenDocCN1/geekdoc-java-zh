    **Arity:** How many terms an operator takes. The possible values for a C++ operator''s
    arity are unary, binary, and ternary.


    **Array:** A collection of objects all of the same type.


    **ASCII (American Standard Code for Information Interchange):** A system for encoding
    the characters, numerals, and punctuation used by many computers.


    **Assignment operator (=):** Causes the operand on the left side of the assignment
    operator to have its value changed to the value on the right side of the assignment
    operator.


    # # B


    **Binary operator:** An operator that takes two terms, such as a+b.'
