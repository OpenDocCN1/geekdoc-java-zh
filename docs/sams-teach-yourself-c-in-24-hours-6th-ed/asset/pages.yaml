    The `setSpeed()` function cannot be `const` because it changes the member variable\
    \ `speed`. The `getSpeed()` function, on the other hand, can be `const` because\
    \ it doesn't change the class at all. It simply returns the current value of the\
    \ member variable `speed`. Therefore, the declaration of it can become:\n\n```\n\
    int getSpeed() const;\n```\n\nIf you declare a function to be `const` and the\
    \ implementation of that function changes the object by changing the value of\
    \ any of its members, the compiler will flag it as an error.\n\nIt is good programming\
    \ practice to declare as many functions to be `const` as possible. When you do\
    \ this, this enables the compiler to catch unintended changes to member variables,\
    \ instead of letting these errors show up when your program is running."
