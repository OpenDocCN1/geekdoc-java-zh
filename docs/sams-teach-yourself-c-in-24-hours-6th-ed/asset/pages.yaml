  md: '# Multidimensional Arrays


    An array can be thought of as a single row of data. A second dimension could be
    conceptualized as a grid of rows and columns. This is a two-dimensional array
    of data, with one dimension representing each row and the second dimension representing
    each column. A three-dimensional array could be a cube, with one dimension representing
    width, and a third dimension representing depth. You can even have arrays of more
    than three dimensions, although they are harder to imagine as objects in space.


    When you declare arrays, each dimension is represented as a subscript in the array.
    A two-dimensional array has two subscripts:


    ```

    int grid[5, 13];

    ```


    A three-dimensional array has three subscripts:


    ```

    int cube[5, 13, 8];

    ```


    Arrays can have any number of dimensions, although it is likely that most of the
    arrays you create will have one or two dimensions.


    A good example of a two-dimensional array is a chessboard. One dimension represents
    the eight rows; the other dimension represents the eight columns. Figure 7.2 illustrates
    this.


    ![](img/a02db1218077338d7f27a73e9292bee2_112_0.png)


    FIGURE 7.2

    A chessboard is a two-dimensional array of squares.


    Suppose that you have an array of char values named board that represents the
    board. Each element could equal ''w'' if a white piece occupies the square, ''b''
    if a black piece does and " (no character) otherwise. The following statement
    creates the array:


    ```

    int board[8][8];

    ```'
