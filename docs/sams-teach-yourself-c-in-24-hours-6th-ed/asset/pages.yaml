  md: '# Null Pointer Constant


    As you learned earlier this hour, it''s important when using pointers to make
    sure they always have a value. A pointer that is not initialized could be pointing
    to anything in memory. These wild pointers pose a security and stability risk
    to your programs.


    In earlier versions of C++, a pointer was assigned a null value when created by
    either 0 or NULL as the value, in these statements:


    ```

    int *pBuffer = 0;

    int *pBuffer = NULL;

    ```


    These accomplish the same thing because NULL is a preprocessor macro that is converted
    to either 0 (an integer) or OL (a long).


    Setting null pointers like this worked well in almost all circumstances, but it
    created an ambiguity when a class relies on function overloading. Consider an
    overloaded function that takes either a character pointer or an integer as argument:


    ```

    void displayBuffer(char *);

    void displayBuffer(int);

    ```


    If this is called with a null pointer, the displayBuffer(int) member function
    will be called, despite the fact that this is probably not what the programmer
    intended.


    The nullptr keyword you have already been using solves this pointer problem:


    ```

    int *pBuffer = nullptr;

    ```


    The constant 0 remains valid as a null pointer, for reasons of backward compatibility,
    but nullptr is preferred.


    A nullptr is not implicitly converted to integer types, except for bool values,
    where nullptr converts to the value false.


    The Swapper program (Listing 10.5) gives one variable the value of another using
    a pointer.


    # LISTING 10.5 The Full Text of Swapper.cpp


    ```

    1: #include <iostream>

    2:

    3: int main()

    4: {

    5:     int value1 = 12500;

    6:     int value2 = 1700;

    7:     int *pointer2 = nullptr;

    8:

    9:     // give pointer the address of value2

    10: pointer2 = &value2;

    ```'
