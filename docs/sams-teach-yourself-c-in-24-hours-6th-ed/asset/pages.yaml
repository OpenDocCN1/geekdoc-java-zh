  md: 'Because these constants lack a type, the compiler cannot ensure the constant
    has a proper value. Because these defined constants cannot be checked for type,
    it''s better to use the standard constants and avoid using a directive just to
    set a constant.


    # Enumerated Constants


    Enumerated constants create a set of constants with a single statement. They are
    defined with the keyword enum followed by a series of comma-separated names surrounded
    by braces, as in this example:


    ```

    enum COLOR { RED, BLUE, GREEN, WHITE, BLACK };

    ```


    This statement creates a set of enumerated constants named COLOR with five values
    named RED, BLUE, GREEN, WHITE and BLACK. The set of constants is called an enumeration.


    Internally, enumerated constants hold integer values. The values begin with 0
    for the set and count upwards by 1. So RED equals 0, BLUE equals 1, Green equals
    2, White equals 3, and BLACK equals 4. All the constants are integers.


    Constants can also specify their values using an = assignment operator:


    ```

    enum Color { RED=100, BLUE=500, WHITE,BLACK=700 };

    ```


    This statement sets RED to 100, GREEN to 500, and BLACK to 700. The members of
    the set-assigned values will be 1 higher than the previous member, so BLUE equals
    101 and WHITE equals 501.


    The advantage of this technique is that you get to use a symbolic name such as
    BLACK or WHITE rather than a meaningless number such as 1 or 700.


    The program in Listing 3.4 uses enumerated constants for the eight compass directions,
    storing one value in a variable named heading.


