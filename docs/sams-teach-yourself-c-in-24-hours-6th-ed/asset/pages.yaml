- img_proc: true
  md: 'Click Next to install the software in the chosen folder. This process is tracked
    by a progress bar, and when it''s complete, click Finish to close the wizard.


    After the software has been installed, you must manually configure Path, a Windows
    environment variable.


    # # Setting the Path Environment Variable


    The MinGW tools are used in a command window. For these commands to work, Windows
    must know where the GCC compiler and the other tools can be found.


    These tools are in the bin subfolder the project''s main folder.


    If you choose `C:\MinGW` as the main path, the tools are in `C:\MinGW\mingw32\bin`.


    This folder must be included in Path, an environment variable that contains a
    list of folders. Windows uses Path to locate programs when you type a command.


    There''s an Environment Variables dialog in the Control Panel.


    On Windows 10, set the Path variable with these steps:


    +   1. In the Search box on the task bar, enter environment. A list of search
    results appears above the box.


    +   2. One of the top search results is Enter environment variables for your account.
    Click this result. The System Properties dialog opens.


    +   3. Click the Environment Variables button. A dialog with that title opens.


    +   4. In the System Variables pane, scroll down and choose Path, then click the
    Edit button below the System Variables pane. The Edit Environment Variables dialog
    appears.


    +   5. The Edit Environment Variables dialog lists all the folders in the Path.
    To add a new folder, click the New button. An entry opens up at the bottom of
    the list, as shown in Figure D.2.'
