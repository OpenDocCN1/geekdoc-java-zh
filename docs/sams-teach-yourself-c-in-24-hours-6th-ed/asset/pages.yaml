    # Summary


    If this is your first introduction to class inheritance, you might find yourself
    wondering if the work of creating base classes and derived classes is worth the
    effort. Deciding where to put member variables and functions among a set of related
    classes can take some time and planning.


    The reason to do the work is that it makes your classes more powerful and reusable.


    When you''ve designed a set of related classes well, you can extend a base class
    and design a new derived class much more easily. You only have to focus on the
    things that make the new class different from its parent.


    # Q&A


    +   Q. Are inherited members and functions passed along subsequent generations?
    If Dog derives from Mammal and Mammal derives from Animal, does Dog inherit Animal''s
    functions and data?

    A. As derivation continues, derived classes inherit the sum of all the functions
    in all their base classes.

    Can a derived class make a public base function private?

    A. Yes, and it will remain private for all subsequent derivations.

    Q. When did Constantinople become Istanbul?

    A. The city of Istanbul, Turkey, became known as Constantinople during the reign
    of the Roman emperor Theodosius II from 408 to 450. The name honored Constantine
    the Great, who made the city eastern capital of the Roman empire.

    Some centuries later, the name Istanbul began to be used as well, which roughly
    translates to mean the "City."

    After the creation of the Republic of Turkey, a law was passed in 1930 to ask
    the rest of the world to start calling the city Istanbul. To put some teeth in
    the request, the Turkish postal service began rejecting addresses to Constantinople.

    The name change inspired the 1953 song "Istanbul (Not Constantinople)," performed
    by the Four Lads, and a 1990 remake by They Might Be Giants.

    "Why did Constantinople get the works?" the song asks. "That''s nobody''s business
    but the Turks."'
