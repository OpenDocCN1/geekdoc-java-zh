    To convert the number $968_{10}$ to base 6:


    | 5 | 4 | 3 | 2 | 1 |

    | $6^4$ | $6^3$ | $6^2$ | $6^1$ | $6^0$ |

    | 1296 | 216 | 36 | 6 | 1 |


    There are no 1296s in 968, so column 5 has 0. Dividing 968 by 216 yields 4 with
