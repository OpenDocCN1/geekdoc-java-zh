  md: '# When to Use References and When to Use Pointers


    Generally, C++ programmers strongly prefer references to pointers because they
    are cleaner and easier to use. References cannot be reassigned, however. If you
    need to point first to one object and then to another, you must use a pointer.
    References cannot be NULL, so if there is any chance that the object in question
    might be, you must use a pointer rather than a reference. If you want to allocate
    dynamic memory from the heap, you have to use pointers as discussed in previous
    hours.


