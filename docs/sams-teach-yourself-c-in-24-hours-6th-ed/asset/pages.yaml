    +   1. A. Pass by reference, because pass by value causes a copy to be made of
    the variables being passed. For a large object, this could take considerable time
    and memory.


    +   2. C. Using the const keyword tells the compiler to prevent the called function
    from changing the value of the pointer. You get the protection of pass by value
