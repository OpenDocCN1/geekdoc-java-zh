  md: 'There is no reason why you would need to know the actual numeric value of the
    address of each variable. What you care about is that one has an address and that
    the right amount of memory is set aside.


    How does the compiler know how much memory each variable needs? You tell the compiler
    how much to allow for your variables by declaring the variable''s type.


    Therefore, if you declare your variable to be of type unsigned long, the compiler
    knows to set aside four bytes of memory because every unsigned long takes four
    bytes. The compiler takes care of assigning the actual address.


    When a pointer is allocated, the compiler assigns enough memory to hold an address
    in your hardware and operating system environment. The size of a pointer might
    or might not be the same size as an integer, so be sure you make no assumptions.


    # Storing the Address in a Pointer


    Every variable has an address. Even without knowing the specific address of a
    given variable, you can store that address in a pointer.


    For example, suppose that the variable how is an integer. To declare a pointer
    called pAge to hold its address, you write the following statement:


    ```

    int *pAge = nullptr;

    ```


    This declares pAge to be a pointer to int. That is, pAge is declared to hold the
    address of an int.


    Pointers can have any name that is legal for other variables. This book follows
    the convention of naming pointers with an initial p and a second letter capitalized,
    as in pAge or pHeap.


    Note that pAge is a variable like any other variable. When you declare a variable
    pAge, it is set up to hold an integer. A pointer is a special type of variable
    that holds the address of an object in memory; in this case, pAge is holding the
    address of an integer variable.


    You declare the type of variable you want the pointer to point to. This tells
    the compiler how to treat the memory at the location the pointer points to. The
    pointer itself contains an address.


    In this example, pAge is initialized to nullptr which represents a pointer whose
    address points to nothing in C++. A pointer with this value is called a null pointer.
    All pointers, when they are created, should be initialized to something. If you
    don''t know what you want to assign to the pointer, assign nullptr. A pointer
    that is not initialized is called a wild pointer. Wild pointers are dangerous,
    because they cause a program to have unpredictable results when the pointer is
    used.'
