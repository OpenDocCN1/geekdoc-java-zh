    +   3. Why did the author''s parents leave his tricycle behind when he was four?


    +   A. Cruel indifference


    +   B. A moving truck ran out of room


    +   C. Because adversity builds character


    # Answers


    +   1. A. A class occupies no memory because it is just a definition of how an
    object should be. An object is the implementation of that class.


    +   2. B. Private data and functions can be accessed only within the class itself.
    Public data and functions can be accessed outside of the class. You generally
    want to keep all your class data private and the functions public (so they can
    be called).


