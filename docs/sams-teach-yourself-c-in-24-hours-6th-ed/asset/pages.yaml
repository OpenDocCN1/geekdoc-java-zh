    # Summary


    Over the history of computer programming there have been several popular methodologies
    for creating programs. The one introduced in this hour is called object-oriented
    programming (OOP) because of how it conceives of programs.


    In OOP, a program consists of one or more objects, each of which has its own data
    in the form of member data and functions in the form of functions. The objects
    are separate from each other and specialize in a specific and narrow purpose.


    By designing objects to be independent of each other, you create code that''s
    more easily reused elsewhere. If you created a Printer class in a program to print
    documents, that class can be used by other programs you write if they need printing
    capabilities.


    You learn more about OOP in the next hour as you delve deeper into classes.'
