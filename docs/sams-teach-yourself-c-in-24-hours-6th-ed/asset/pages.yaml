    \ in the class use and modify the member variables. They are called the member\
    \ functions (or methods) of the class. Member functions of the Tricycle class\
    \ might include pedal() and brake().\n\nMember functions are as much a part of\
    \ your class as member variables. They determine what the objects of your class\
    \ can do.\n\n# Declaring a Class\n\nTo declare a class, use the class followed\
    \ by information about the member variables and member functions of the class.\
    \ An opening brace and closing brace enclose the class definition. Here's an example\
    \ for a Tricycle class:\n\n```\nclass Tricycle {\npublic:\n    unsigned int speed;\n\
    \    unsigned int wheelSize;\n    pedal();\n    brake();\n};\n```\n\nThis code\
    \ creates a class called Tricycle with two member variables, speed and wheelSize,\
    \ and two member functions, pedal() and brake(). All four can be used by classes\
    \ because the public keyword precedes them in the class definition. You learn\
    \ more about this keyword later in the hour.\n\nDeclaring this class does not\
    \ allocate memory for a Tricycle. It just tells the compiler the Tricycle class\
    \ is, what it contains (speed and wheelSize) and what it can do (pedal() and brake()).\n\
    \nIt also tells the compiler how much memory must set aside for each of the Tricycle\
    \ objects that you create. In this example, if an integer is four bytes, Tricycle\
    \ is only eight bytes total: speed is four bytes and wheelSize is another four.\
    \ The two functions take up no room because no storage space is set aside for\
    \ member functions.\n\n# Defining an Object\n\nAn object is created from a class\
    \ by specifying its class and a variable name, just as you've done with built-in\
    \ types in the preceding seven hours. For example:\n\nTricycle wichita;"
