    # Summary


    C++ is a popular language to use when programming languages. As you are introduced
    to features such as templates, the reason becomes clear. C++ exposes the building
    blocks of the language to modification.


    Templates enable the functionality of a class to be adapted to more than one data
    type without repeating code for each type.


    With templates, code can be written in the abstract that applies to multiple types
    of data.


    # Q&A


    +   Q. Why use templates as macros will do?


    +   A. Templates are type-safe and built in the language. The compiler can do
    a lot more with templates to ensure they are used correctly, making the resulting
    program less likely to contain errors.


    +   Q. What is the difference between the parameterized type of a template function
    and the parameters to a normal function?


    +   A. A regular function (non-template) takes parameters on which it may take
    action. A template function allows you to parameterize the type of a particular
    parameter to the function.'
