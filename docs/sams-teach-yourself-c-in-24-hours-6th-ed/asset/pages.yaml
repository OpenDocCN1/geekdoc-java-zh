    # Summary


    Functions are the workhorses of a C++ program. Every task a program performs represented
    by a function. When that task can be broken down into smaller tasks, each of these
    can be a function, and well.


    All functions should be declared using function prototypes, which are statements
    that identify the function''s name, the order and data type of parameters, and
    the data type that it returns. A function''s return type can be figured out by
    the compiler by putting auto in its place, a new capability of C++.


    The functions in this program are programs named: findArea(), convert(), and average().
    Functions are commands. You''re telling the computer to do something, such as
    to find an area, convert a value, or average two numbers.


    Each function that you write in a program is a discrete task. The more specific
    the task, the shorter the function will be.


    Function overloading makes it possible to use the same function name on several
    related functions. The data type and number of parameters to the function are
    used to differentiate between them. The C++ compiler figures out which function
    to execute based on these differences.


    # Q&A


    +   Q. Why not make all variables global?


    +   A. Although this used to be common in programming, as programs became more
    complex it became difficult to find bugs in programs with globally accessible
    variables. The reason is because data could be misused in any part of the program.
    To minimize the chance of error and make debugging easier, data should be kept
    in a local scope as possible.'
