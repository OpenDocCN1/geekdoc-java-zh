    # Understanding Function Headers and Prototypes


    The `swap()` function that takes references is easier to use and the code is easier
    to read. How does the calling function know if the values are passed by reference
    or by value? As a user of `swap()`, the programmer must ensure that `swap()` in
    fact change the parameters.


    This is another use for the function prototype. By examining the parameters declared
    in the prototype, which is typically in a header file with all the other prototypes,
    the programmer knows that the values passed into `swap()` are passed by reference
    and thus will be swapped properly.


    If `swap()` had been a member function of a class, the class declaration, also
    available in a header file, would have supplied this information.


    In C++, users of classes (any other class''s function using the class) rely on
    the header file to tell them all that is needed. This file acts as the interface
    to the class or function. The actual implementation is hidden from the class,
    which enables the programmer to focus on the problem at hand and use the class
    or function without concern for how it is implemented.


    # Returning Multiple Values


    As discussed, functions can return only one value. If you need to get two values
    back from a function? One way to solve this problem is to pass two objects into
    the function by reference. The function then can fill the objects with the correct
    values. Because passing by reference enables a function to change the original
    objects, this effectively lets the function return pieces of information. This
    approach bypasses the return value of the function, then can be reserved for reporting
