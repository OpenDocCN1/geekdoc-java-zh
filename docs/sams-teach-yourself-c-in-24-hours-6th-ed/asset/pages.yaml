    NOTE


    Static member functions do not have this pointer, so they cannot be declared const.
    Also, because member data variables are accessed in member functions using the
    this pointer, member functions cannot access any non-static member variables.


    # Containment of Classes


    As you have seen previously, it is possible for the member data of a class to
    include objects of another class. This establishes a "contains" relationship between
    the enclosing class (outer class) and a class used as its member data (inner class).
    C++ programmers say that the outer class contains the inner class. An Employee
    class might contain String objects for the name of the employee as well as integers
    for the employee’s salary and so forth.


    The String class in Listing 20.3 provides a stripped-down useful class. The file
    should be saved as String.hpp and is used in another program later in this section.'
