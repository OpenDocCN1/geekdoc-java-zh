    # Bugs, Errors, Mistakes, and Code Rot


    The code in this book was created for illustrative purposes. It has purposely
    not dealt with errors to keep the focus on the central issues being presented.
    Real-world programs, on the other hand, must take error conditions into consideration.
    In fact, anticipating and handling errors can account for the largest part of
    the code!


    The computer scientist Gerald Weinberg once, “If builders built the way programmers
    built programs, the first woodpecker to come along would destroy civilization.”
    Too many commercial programs from some of the biggest vendors in the business
    have bugs. Too many open source programs that are used on millions of Internet
    computers and other devices have bugs. Serious bugs.


    Writing robust, bug-free programs should be the number-one priority of anyone
    serious about programming. The biggest expense in major programming efforts often
    is testing, finding, and fixing bugs.


    There are a number of discrete bugs that can trouble a program. The first is poor
    logic: The program does what you asked, but you haven''t thought through the algorithms
    properly. The second is syntactic: You used the wrong idiom, function, or structure.
    These two are the most common, and they are the ones most programmers are on the
    lookout for. Far harder to find subtle bugs that pop up only when the user does
    something unexpected. These little logic bombs can lurk until they''re finally
    encountered and the program blows up.'
