    # Summary


    A C++ programmer doesn''t have to use classes or objects at all. Programs could
    consist simply of variables and functions, removing the need to master the complex
    concepts of object-oriented programming.


    Few programmers go this route. Why? Because you can be much more effective if
    you design a program as a series of classes that interact with each other.


    Developing classes make code more reusable. If an object''s use in one program
    would be useful in another, the class can be reused. Word processor''s Spellchecker
    class could be added to a web browser or any other tool where users write text.
    The spell-checking object''s capabilities would work the same in any program.


    Classes also make code more reliable. The tasks a program requires are packaged
    with the data necessary to get that work done. By thinking of a program as a set
    of objects that each have specific tasks to perform, the work is spread out and
    organized. When problems crop up, it''s easier to determine the class where the
    error occurs.


    # Q&A


    +   Q. If using a const function to change a class may cause a compiler error,
