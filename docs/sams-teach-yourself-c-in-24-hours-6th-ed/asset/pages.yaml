  md: '# Linked List Case Study


    Linked List


    ![](img/a02db1218077338d7f27a73e9292bee2_308_0.png)


    FIGURE 19.2

    The linked list after its creation.


    Continuing in the `main()` function, line 177 uses `while(true)` for an infinite
    loop. The user is prompted for values to add to the linked list. The code on line
    181 evaluates the value entered. If the value is 0, execution of the program breaks
    out of the loop.


    If the value is not 0, a new `Data` object is created and inserted into the list
    (lines 183–184).


    For illustration purposes, assume the user runs the program and enters the value
    15 as the first value. This invokes the `insert()` member function on line 184.


    The linked list immediately delegates responsibility for inserting the object
    to its head node in line 166. This invokes `insert()` on line 138. The head node
    immediately passes the responsibility to whatever node its `next` variable points
    to. In this case, it is pointing to the tail node. (When the head node was born,
    it created a link to a tail node.) This invokes the `insert()` function on line
    111.


    `TailNode::insert()` knows that the object it has handed must be inserted immediately
    itself, so the new object is placed in the right list after the tail node. Therefore,
    on line 113 it creates a new `InternalNode` object, passing the data and a pointer
    to itself. This invokes the constructor for the `InternalNode` object, shown on
    line 65.


    The `InternalNode` constructor does nothing more than initialize its `Data` pointer
    with the address of the Data object it was passed and its `next` pointer with
    the address it was passed. In this case, the node points to the tail. (The tail
    node is in its own `pointer`.)


    Now that the `InternalNode` has been created, the address of that internal node
    is assigned to the pointer data on line 113, and that address is returned from
    the `TailNode::insert()` member function.


    This returns to `HeadNode::insert()`, where the address of the `InternalNode`
    is assigned to the `HeadNode`’s `next` pointer (on line 140). Finally, the `HeadNode`’s
    address is returned to the linked list on line 166, although this value is not
    stored in a variable. Nothing is done with it because the linked list already
    knows the address of the head node.'
