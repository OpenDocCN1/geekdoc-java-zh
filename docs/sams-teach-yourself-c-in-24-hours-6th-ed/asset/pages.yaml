  md: '# HOUR 16

    Extending Classes with Inheritance


    What You''ll Learn in This Hour:


    +   - What inheritance is

    - How to derive one class from another

    - How to access base member functions from derived classes

    - How to override base member functions

    - What protected access is and how to use it


    # What Is Inheritance?


    It is a fundamental aspect of human intelligence to seek out, recognize, and create
    relationships among concepts. We build hierarchies, networks, and other interrelations
    to explain and understand how things interact. C++ embodies this in inheritance
    hierarchies, making it possible for a class to inherit from another class.


    Concepts can be categorized in many different ways. When you look at your dog,
    what do you see? A biologist sees a network of interacting organs, a physicist
    sees atoms and forces at work, a taxonomist sees a representative of the species
    canine domesticus, and a child sees a companion and protector.


    Each category often can be divided into subcategories. To a taxonomist, a dog
    is a canine. A canine is a kind of mammal. A mammal is a kind of animal—and so
    forth. Taxonomists divide the world of living things into kingdom, phyla, class,
    family, genus, and species.


    The taxonomist''s hierarchy establishes an “is a” relationship—dog is a canine.
    There are “is a” relationships everywhere. A Nissan Leaf is a kind of car, which
    is a kind of vehicle. A cannoli is a kind of dessert, which is a kind of food.


    When something is described as a kind of something else, this means it is a specialization
    of that thing. That, a car is a special kind of vehicle. Cars and buses are both
    vehicles. They are distinguished by their specific characteristics but share things
    in common with each other and other vehicles.'
