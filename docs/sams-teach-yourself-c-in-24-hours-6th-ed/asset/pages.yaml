  md: '# Inheritance and Derivation


    These relationships are conveyed by inheritance. The concept of a dog inherits
    the features of a mammal. Because it is a mammal, it moves and breathes air; by
    definition, all mammals move and breathe air. The concept of a dog adds to that
    the idea of barking, wagging tail, and so forth. A dog has unique traits to dogs
    and traits common to all mammals.


    Dogs can be divided further into hunting dogs and terriers; terriers can be divided
    into Yorkshire Terriers, Dandie Terriers, and so forth.


    A Yorkshire Terrier is a kind of terrier; therefore, it is a kind of dog; therefore,
    a kind of mammal; therefore, a kind of animal; and, therefore, a kind of living
    thing.


    C++ attempts to represent these relationships by defining classes that derive
    from one another. Derivation is a way of expressing the “is a” relationship. You
    derive a new class, Dog, from the class Mammal. You don''t have to explicitly
    state that dogs move because they inherit from Mammal. Because it derives from
    Mammal, Dog automatically moves.


    A class that adds new functionality to an existing class is said to derive from
    that original class. The original class is said to be the new class''s base class.


    If the Dog derives from the Mammal class, Mammal is a base class of Dog. Derived
    classes are supersets of their base classes. Just as in the real world dogs add
    features to the idea of a mammal, the Dog class will add certain member functions
    or data to the Mammal class.


    A base class can have more than one derived class. Just as dogs, cats, cats, and
    horses are all types of mammals, their classes would all derive from the Mammal
    class.


    # Animals and Inheritance


    To facilitate the discussion of derivation and inheritance, this section focuses
    on the relationships among a number of classes representing animals. Imagine that
    you have been asked to design a children''s game—a simulation of a farm.


    The game will have a whole set of farm animals, including horses, cows, dogs,
    cats, sheep, and so forth. You will create member functions for these classes
    so that they can act in the ways the child might expect, but for now you''ll stub
    out each function with a simple statement.


    Stubbing out a function means to write only that the function was called, leaving
    the details for later. The stub function serves as a placeholder. You do not have
    to fill in all the details as you work on the problem.'
