  md: '# 398 HOUR 24: Dealing with Exceptions and Error Handling


    Animal::lookupPreferences(), which in turn calls fstream::operator>>(), all these
    are on the call stack. A recursive function might be on the stack many times.


    The exception is passed up the call stack to each enclosing block. As the stack
    is unwound, the destructors for local objects on the stack are invoked and the
    objects are destroyed.


    After each try block are one or more catch statements. If the exception matches
    one of the catch statements, it is considered to be handled by having that statement
    execute. If it doesn''t match any, the unwinding of the stack continues.


    If the exception reaches all the way to the beginning of the program (the main()
    method) and is still not caught, the function terminate() is called, which in
    turn calls abort() to abort the program.


    It is important to note that the exception unwinding of the stack is a one-way
    street. As it progresses, the stack is unwound, and objects on the stack are destroyed.
    There is no going back: After the exception continues after the try block of the
    catch statement that handled the exception.


    In the Exception program, execution continues on line 104, the first line after
    the try block of the catch statement that handled the XBoundary exception. When
    an exception is raised, program continues after the catch block, not after the
    point where the exception was thrown.


    # More Than One Catch


    It is possible for more than one condition to cause an exception. In this case,
    catch statements can be lined up one after another, like the conditions in a switch
    statement. The equivalent to the default statement is the “catch everything” statement,
    indicated by catch().


    CAUTION


    Be careful about putting in two catch statements where one catch is a base class
    and the other catch is a derived class that is more specific. The code will actually
    do the steps of both catch statements; sometimes you want that behavior and sometimes
    you don''t, but you should be aware that this will happen.


    # Catching by Reference and Polymorphism


    You can take advantage of the fact that exceptions are just classes to use them
    polymorphically. By passing the exception by reference, you can use the inheritance
    hierarchy to take the appropriate action based on the runtime type of the exception.


    The PolyException program in Listing 24.2 illustrates using exceptions polymorphically.'
