  md: '# # APPENDIX D

    Using the MinGW C++ Compiler on Windows


    This book works with any programming tool or integrated development environment
    (IDE) that supports C++14, the current version of the C++ programming language.
    If you already have an IDE such as Microsoft Visual Studio or C++ Builder and
    you know it supports C++14, you can use it and stop reading this appendix right
    now.


    A popular and free option for Windows users who want to learn C++ is the GCC compiler,
    part of an open source programming toolkit for the language. GCC, which is available
    for Windows, Mac OS, and Linux, is a set of programs that are used in a command
    window instead of a graphical user interface. You edit programs in any text editor
    you like, then type commands to make the C++ compiler and link create a program''s
    executable code.


    GCC is included in MinGW, a set of programs called Minimalist GNU for Windows.
    In this appendix you learn how to download, install, and set up MinGW to work
    on a Windows computer.


    # ## Downloading MinGW-w64


    The most up-to-date version of MinGW for Windows is MinGW-64, which can be downloaded
    from the project''s SourceForge repository at http://sourceforge.net/projects/mingw-w64.
    This holds a lot of files, including the source code for advanced programmers
    to examine and modify, but all you need is the program''s main installation file
    for Windows.


    Click the Files in the navigation bar (which also includes links like Summary,
    Support, and Wiki).


    A page opens listing the project''s folders and files. Near the top, there should
    be a line that reads “Looking for the latest version?” followed by a link with
    the text Download Official MinGW-w64 installer. Click this link. The MinGW-w64
    download should begin automatically after a few seconds.


    (If you can''t find this link, try http://sourceforge.net/projects/mingw-w64/latest/download?source=files.)'
  merge: -1
  pgno: 442
- img_proc: true
  md: 'This download is an installation wizard. Run it to begin installing the software.


    The wizard presents you with setup settings such as Version, Architecture, and
    Build Revision. As a new user of MinGW-w64, you can click Next to accept the default
    values for these settings.


    You are asked for a destination folder in which to store the software. Instead
    of using the default value, here''s a better choice: In the Destination folder
    field, type C:\MinGW\, as shown in Figure D.1 (This assumes that C:\ is your main
    drive, as is it for MinGW Users.)


    ![](img/a02db1218077338d7f27a73e9292bee2_443_0.png)


    **FIGURE D.1**nChoosing a folder for MinGW.'
  merge: -1
