  md: '# Writing Past the End of Arrays


    The program stores the user''s current weight in the variable weight and the user''s
    target in the variable target. Both hold floating-point variables.


    The goal array holds four values that will be used to calculate the weight milestones.
    The four-element array is created (line 5) and values of 0.9, 0.75, 0.5, and 0.25
    are assigned to elements (6-9).


    A for loop iterates through the elements of the array. The amount to reach a milestone
    is stored in the loss variable (line 20). This variable is the total amount of
    weight to lose multiplied by the percentage.


    The loss total is added to target and displayed as a milestone (line 21).


    > NOTE

    The fact that arrays count from 0 rather than 1 is a common cause of bugs in programs
    written by C++ novices. When you use an array, remember that an array with 10
    elements counts from array[0] to array[9].


    # Writing Past the End of Arrays


    When you assign a value to an array element, the compiler computes where to store
    the value in memory based on the size of each element and its subscript. If you
    store a new value in goal[3], the compiler multiplies the offset of 3 by the size
    of each element, for long integers are four bytes. The compiler then moves that
    many bytes, 12, from the beginning of the array and stores the new value at that
    location.


    The goal array in the Weights program has only four elements. If you try to store
    something in goal[4], the compiler ignores that there is no such element. Instead,
    it stores it in memory 20 bytes past the beginning of the first element, replacing
    whatever data is at that location. This can be any data, so writing the new out-of-bounds
    value might have unpredictable results, such as the program crashing or running
    with strange results.


    These errors can be difficult to spot as a program runs, so it''s important to
    pay attention to the size of arrays when they are accessed.


    It is common to write one extra element past the end of an array that has its
    own name: a fence post error. The name refers to the problem of counting how many
    posts you need for a 10-foot fence if you need one for every foot. Some people
    answer 10, but you need 11, as shown in Figure 7.1.'
