  md: '# Using Template Items


    This indicates that Node will not exist as a class in itself, but rather that
    you instantiate Nodes of Robots and Nodes of Data objects. The actual type you''ll
    find in present is represented by T.


    Thus, InternalNode now become InternalNode<T> (read that as "InternalNode of T").
    And InternalNode<T> points to a Data object and another Node; rather, it points
    to a T (whatever type of object) and a Node<T>. You can see this on lines 118–119.


    Look carefully at the insert() function defined on lines 107–129. The logic is
    the same, but where we used to have a specific type (Data) now we have T. Thus,
    on line 107, the parameter is a pointer to a T. Later, when we instantiate the
    specific lists, the T will be replaced by the compiler with the right type (Data
    or Robot).


    The important thing is that the InternalNode can continue working, indifferent
    to the actual type. It knows to ask the objects to compare themselves. It doesn''t
    care whether Robot objects compare themselves in the way Data objects do. In fact,
    we can rewrite this so that Robot objects don''t keep their age, on-the-fly, and
    the InternalNode won''t care a bit.


