  md: '# HOUR 3

    Creating Variables and Constants


    What You''ll Learn in This Hour:


    +   - How to create variables and constants

    - How to assign values to variables and change those values

    - How to display the value of variables

    - How to find out how much memory a variable requires


    # What Is a Variable?


    A variable is a location in computer memory where you can store and retrieve a
    value. The computer''s memory can be thought of as a series of cubbyholes lined
    up in a long row. Each cubbyhole is numbered sequentially. The number of each
    cubbyhole is its memory address.


    Variables have addresses and are given names that describe their purpose. In a
    game program, you could create a variable `score` to hold the player''s score
    and a variable named `zombies` for the number of zombies the player has defeated.
    A variable is a label on a cubbyhole so that it can be accessed without knowing
    the actual memory address.


    Figure 3.1 shows seven cubbyholes with addresses ranging from 101 to 107. In address
    104, the zombies variable holds the value 17. The other cubbyholes are empty.'
  merge: -1
  pgno: 40
- img_proc: true
  md: '# 28 HOUR 3: Creating Variables and Constants


    ![](img/a02db1218077338d7f27a73e9292bee2_41_0.png)


    FIGURE 3.1

    A visual representation of memory.


    # Storing Variables in Memory


    When you create a variable in C++, you must tell the compiler the variable''s
    name and what kind of information it will hold, such as an integer, character,
    or floating-point number. This is the variable''s type (sometimes called *data
    type*). The type tells compiler how much room to set aside in memory to hold the
    variable''s value.


    Each cubbyhole in memory can hold one byte. If a variable''s type is two bytes
    in size, it needs two bytes of memory. Because computers use bytes to represent
    values, it is important that you familiarize yourself with this concept.


    A short integer, represented by *short* in C++, is usually two bytes. A long integer
    (*long*) is four bytes, an integer (*int*) can be two or four bytes, and a *long
    long* is eight bytes.


    Characters of text are represented by the *char* type in C++, which is usually
    one byte in size. In Figure 3.1, each cubbyhole holds one byte. A two-byte value
    such as a short integer could be stored in addresses 106 and 107.


    True-false values are stored as the *bool* type (short for Boolean). The values
    *true* and *false* are the only values it can hold.


    > NOTE

    Boolean variables are named for George Boole, an English mathematician who lived
    from 1815 to 1864. He created Boolean algebra, in which values are limited to
    either true or false. His creation forms the basis of modern computing all the
    way down to the smallest digital circuits. He must have been good at true-false
    tests as a child.'
