  md: '# Quiz


    +   1. What''s the first node in a linked list called?


    +   A. The origin


    +   B. The head


    +   C. The top


    +   2. What two things does a linked list node contain?


    +   A. Behavior and data


    +   B. Functions and variables


    +   C. Data and a node pointer


    +   3. How many pointers are needed for a doubly linked list?


    +   A. 2


    +   B. 1


    +   C. Either a or b


    # Answers


    +   1. B. As the name implies, it contains the head of the linked list. It is
    very important to know where the list starts so it can be accessed.


    +   2. C. The data can be any type of object. The pointer indicates the next member
    of the linked list.


    +   3. A. Each node in a doubly linked list has two pointers, one for next and
    one for previous, so that you can start at either end and work your way toward
    the opposite end.


