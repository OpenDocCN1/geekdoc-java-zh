  md: 'Q&A 41


    # # Q&A


    Q. If a short integer can run out of room, why not always use long integers?


    A. Both short integers and long integers will run out of room, but a long integer
    will do so with a much larger number. On most computers, a long integer takes
    up twice as much memory, which has become less of a concern because of the memory
    available on modern PCs.


    Q. What happens if I assign a number with a decimal to an integer rather than
    a float or double? Consider the following line of code:


    ```

    int rating = 5.4;

    ```


    A. Some compilers issue a warning, but the assignment of a decimal to an integer
    type is permitted in C++, so the statement assigns the rating value 5. The more
    precise information is lost in the assignment, so if you tried later using rating
    to a float variable, it would still equal 5.


    Q. Why should I bother using symbolic constants?


    A. When a constant is used in several places in a program, a symbolic constant
    enables all the values to change simply by changing the constant''s initialization.
    Symbolic constants also serve an explanatory purpose comments like. If a statement
    multiplies by 360, it''s less easily understood than multiplying it by a constant
    named degreesInCircle that equals 360.


    Q. Why did Jack Klugman have a 40-year feud with Norman Fell?


    A. Klugman, the star of the TV Quincy M.E. and The Odd Couple, had a well-publicized
    long-running span with Fell, the star of Three Company and the landlord on The
    Grade. No one seems to know the cause, but it did not end until Fell''s death
    in 1998.


    The movie reference site IMDb quotes Fell saying, ''I could have killed as Oscar.
    I would have been great to show him, pick. You were so Quincy. Klugman overacted
    every scene. You would want to chain-showing ...... who ruins any credibility
    for your project, I''ll give you Klugman''s number.''


    IMDb quotes Klugman as saying Fell''s funeral, ''Best funeral I''ve ever been
    to. I never laughed so hard in years. I had the time of my life.''


    The actors, born in Philadelphia two years apart, share some resemblance to each
    other and could have competed for the same roles over the decades they were acting
    in films and television. In reality, however, they were not enemies. The blogger
    Tom Nachicki found out in 2008, their feud was a 30-year joke they played on the
    media.'
