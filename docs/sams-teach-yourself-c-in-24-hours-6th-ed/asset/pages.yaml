    # Character Arrays


    Familiarity with arrays makes it possible to work with longer text than the single
    characters

    represented by the char data type. A string is a series of characters. The strings
    you''ve

    worked up with this point have been string literals in std::cout statements:

    std::cout << "Solidum in profundis\n";


    In C++, a string is an array of characters ending with a null character, a special
    character

    coded as ''\0''. You can declare and initialize a string like any other:


    ```

    char yum[] = { ''Z'', ''o'', ''m'', ''b'', ''i'', ''e'',

    '' '', ''E'', ''a'', ''t'', '' '', ''B'', ''r'', ''a'', ''i'', ''n'',

    s'', ''\0'' };

    ```


    The last character, ''\0'', is the null character that terminates the string.

    Because this character-by-character approach is difficult to debug and admits
    many opportuni-

    ies for error, C++ enables a shorthand form of string initialization using a literal:


    ```

    char yum[] = "Zombie Eat Brains";

    ```


    This form of initialization does not require the null character; the compiler
    adds automatically.

    The string "Zombie Eat Brains" is 18 bytes, including null.


    You can also create uninitialized character arrays, which are called buffers.
    With all arrays,

    is important to ensure that you don''t put more into the buffer than there is
    room for.

    Buffers can be used to store text typed by a user. Several programs created in
    past hours used

    the std::cin object to collect user input and store it in a variable:

    std::cin >> yum;


    Although this approach works, two major problems arise. First, if the user enters
    more characters

    than the size of the buffer, cin writes past the end of the buffer, making the
    program run

