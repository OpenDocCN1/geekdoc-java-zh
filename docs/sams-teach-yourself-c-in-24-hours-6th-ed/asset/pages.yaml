  md: 'A functionality prototype does not have the final user interface, but enables
    users to try out various features, such as forwarding messages or attaching files.


    Finally, an architecture prototype might be designed to give you a chance to develop
    a smaller version of the program and to assess how easily your design decisions
    will scale up as the program is fleshed out.


    It is imperative to keep your prototyping goals clear. Are you examining the user
    interface, experimenting with functionality, or building a scale model of your
    final product? A architecture prototype makes a poor user interface prototype,
    and vice versa.


    It is also important to keep an eye on overengineering, the prototype, or becoming
    so concerned with the investment you''ve made in the prototype that you are reluctant
    to tear down the code and redesign as you progress.


    # # The 80/80 Rule


    A good design rule of thumb at this stage is to design for things that 80% of
    the people want to do 80% of the time, and to set aside your concerns about the
    remaining 20%. The boundary conditions will need to be addressed sooner or later,
    but the core of your design should focus on the 80/80.


    Accordingly, you might decide to start designing the principal classes, setting
    aside the need for secondary classes. Further, when you identify multiple classes
    that will have similar designs with only minor refinements, you might choose to
    pick one representative class and focus on that, leaving until later the design
    and implementation of its close cousins.


    NOTE

    There is another rule, the 80/20 rule, that states: the first 20 percent of your
    time to code; the remaining 80 percent of your program will take the other 80
    percent of your time!

    The real rule is that 80 percent of the time is required to do 20 percent of the
    work—or that 80 percent of a company''s profit will come from 20 percent of the
    customers. This rule has wide application.


