  md: '# Simulating an Alarm System 347


    Whether you or not agree with that argument, it is the kind of decision you want
    to focus on during the analysis of the design. To continue this analysis, one
    could argue that only the sensor and the Log object know any details of how sensor
    activity is logged; the Alarm object shouldn''t know or care.


    Good encapsulation is marked by each class a coherent and complete set of responsibilities,
    and no other class having the same responsibilities. The Sensor is responsible
    for noting the current temperature, no other class should have that responsibility.


    On the other hand, other classes might help deliver the necessary functionality.
    For example, although it might be the responsibility of the Sensor class to note
    and log the current temperature, it might implement that responsibility by delegating
    to a Log object the job of actually recording the data.


    Maintaining a firm division of responsibilities makes your program easier to extend
    and maintain. When you decide to change the alarm system for an enhanced module,
    its interface to the log and sensors will be narrow and well defined. Changes
    to the alarm system should not affect the Sensor classes, and vice versa.


    Should the HeatSensor have a reportAlarm() function? All sensors will need the
    capability to report an alarm. This is a good indication that reportAlarm() should
    be a virtual member function of Sensor, and that might be an abstract base class.
    It is possible that HeatSensor will chain up to Sensor''s more general reportAlarm()
    member function; the overridden function will just fill in the details it is uniquely
    qualified to supply.


