    \ with the `const` keyword, it indicates that the function won't change the value\
    \ of any members of the class. To declare a function as constant, use the keyword\
    \ `const` after the parentheses, as in this example:\n\n```\nvoid displayPage()\
    \ const;\n```\n\nAccessors to retrieve a variable's value, which are also called\
