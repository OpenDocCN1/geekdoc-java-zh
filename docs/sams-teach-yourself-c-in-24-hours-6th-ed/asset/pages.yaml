  md: '# Binary


    Base 2 is the ultimate extension of this idea. There are only two digits: 0 and
    1. The columns are as follows:


    | Col | 8 | 7 | 6 | 5 | 4 | 3 | 2 | 1 |

    |---|---|---|---|---|---|---|---|-|

    | Power | $2^7$ | $2^6$ | $2^5$ | $2^4$ | $2^3$ | $2^2$ | $2^1$ | $2^0$ |

    | Value | 128 | 64 | 32 | 16 | 8 | 4 | 2 | 1 |


    To convert the number $88_{10}$ to base 2, follow the same procedure. There are
    no 128s, so 8 is 0.


    There is 64 in 88, column 7 is 1, and the rest is the remainder. There are no
    32s in 24, so column 6 is 0.


    There is 16 in 24, column 5 is 1. The remainder is 8. There is 8 in 8, and column
    4 is 1. There is no remainder, the rest of the columns are 0:


    0 1 0 1 1 0 0 0


    To test this answer, convert it back:


    ```

    1 * 64 = 64

    0 * 32 = 0

    1 * 16 = 16

    1 * 8 = 8

    0 * 4 = 0

    0 * 2 = 0

    0 * 1 = 0

    88

    ```


    # Why Base 2?


    The power of 2 is that it corresponds cleanly to what a computer needs to represent.
    Computers do not know anything at all about letters, numerals, instructions, or
    programs. At their core, they are just circuitry, and at a given juncture, there
    is a little of power or there is very little.


    To keep the logic clean, engineers do not treat this as a relative scale (a little
    power, some more power, or lots of power), but rather as a binary scale (enough
    power or not enough power). This is simplified to “yes” or “no.” Yes or no can
    be represented as 1 or 0. By convention, 1 means true or yes.


    After you make this great leap of intuition, the power of binary becomes: With
    1s and 0s, you can represent the fundamental truth of every circuit. (There is
    power or there isn''t.) All a computer ever knows is, “Is it on, or is it off?”
    On 1s, equals 0.'
