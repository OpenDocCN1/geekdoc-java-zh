  md: '# Summary


    Congratulations! You can now call yourself a C++ programmer, though if you quit
    at this point no one will call you an ambitious one.


    The C++ language has been a popular choice for software development for more than
    three decades. The language has its idiosyncrasies, but when you become comfortable
    with how programs are structured, it is easy to build on your knowledge by creating
    more sophisticated programs.


    Over the next few hours, you learn the basic building blocks of C++, creating
