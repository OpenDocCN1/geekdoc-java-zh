  md: '# Pointers to Member Functions


    Up to this point, all of the pointers you''ve created have been for general, non-class
    functions. It is also possible to create pointers to functions that are members
    of classes.


    To create a pointer to member function, use the same syntax as a pointer to a
    function, but include the class name and the scoping operator (::). Therefore,
    pFunc points to a member function of the class Shape, which takes two integers
    and returns void, the declaration for pFunc is following:


    ```

    void (Shape::*pFunc) (int, int);

    ```


    Pointers to member functions are used in exactly the same way as pointers to functions,
    except that they require an object of the correct class on which to invoke them.
