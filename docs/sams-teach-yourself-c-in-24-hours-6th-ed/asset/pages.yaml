  md: '+   2. Why is the overload syntax different for prefix and postfix increment
    and decrement operations?


    +   A. Because prefix and postfix return different values


    +   B. Because one uses ++ and the other uses --


    +   C. The syntax is not different.


    +   3. What do conversion operators do?


    +   A. Convert objects to built-in types


    +   B. Convert built-in types to objects


    +   C. Both a and b


    # # Answers


    +   1. Adding new operators such as ** requires a change to the compiler, because
    ** is not part of the language and so the compiler would not know what to do with
    it.


    +   2. The behavior differs totally depending on whether the ++ or -- operator
    appears before or after a variable, the code must follow the same behavior. Technically,
    it doesn''t have to mimic the behavior, but users of your class will expect it
    to work that way.


