    # Operator Precedence


    The values produced by complex expressions depend on the order of precedence,
    which is the order in which expressions are evaluated. Here’s a complex expression
    with three operators:


    ```

    int x = 5 + 3 * 8;

    ```


    Without knowing the order of multiplication and addition, it’s impossible to know
    what x equals after this statement executes.

    This expression sets x to 64 if addition takes place before multiplication, because
    8 times 8 equals 64. If multiplication takes place before addition, x equals 29
    because 5 plus 24 equals 29.'
