    # Summary


    This hour was the first of two devoted to pointers, a subject that trips up beginning
    C++ programmers than any other aspect of the language.


    Variable values are stored in computer memory, which is organized into sequential
    memory locations. Each location is a memory address. Pointers are special variables
    to one of those addresses.


    Pointers make it possible to manipulate computer memory directly in a program.
    When you know the memory address of data, you don''t have to use a variable to
    access that data. You can work with a pointer to that address instead.


    There are tasks where it makes more sense to use pointers than variables. Pointers
    are one of the most powerful parts of the C++ language.


    If they''re still a point of confusion, you should find they make more sense the
    further you progress through the book.


    # Q&A


    +   Q. Why are pointers so important?

    nA. As you saw during this hour, pointers are important because they are used
    to hold the address of objects on the heap and pass arguments by reference. In
    addition, in Hour 14, “Calling Advanced Functions,” you’ll see how pointers are
    used in a technique called polymorphism.'
