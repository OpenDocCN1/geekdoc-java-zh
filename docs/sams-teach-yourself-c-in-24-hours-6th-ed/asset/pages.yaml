  md: '# Using Special Classes,

    Functions, and Pointers


    What You''ll Learn in This Hour:


    +   - What static member variables and static member functions

    - How to use static member variables and static member functions

    - What friend functions and friend classes are

    - How to use friend functions to solve special problems

    - How to use pointers to member functions


    # Static Member Data


    Until now, you have probably thought of the data in each object as unique to that
    object and not shared among objects in a class. For example, if you have five
    Robot objects, each has its own age, weight, and data. The age of one does not
    affect the age of another.


    Sometimes you''ll want to keep track of information shared among the many objects
    of a class. For example, you might want to know how many Robot objects have been
    created and how many are still in existence.


    Unlike other member variables, static member variables are shared among all instances
    of a class. They occupy the middle ground between global data, which is available
    to all parts of your program, and member data, which is usually available only
    to each object.


    You can think of a static member as belonging to the class rather than the object.
    Normal member data is one per object, but static members are per class.


    The Robot program in Listing 20.1 declares a Robot object with a static data member,
    howManyRobots. This variable keeps track of how many Robot objects have been created
    by incrementing a static variable. The variable increases with each construction
    and decreases with each destruction.'
