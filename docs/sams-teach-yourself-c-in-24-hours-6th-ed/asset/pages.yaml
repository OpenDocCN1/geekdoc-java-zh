  md: '# # Introduction


    Congratulations! By reading this sentence, you are already 20 seconds closer to
    learning C++, one of the most important programming languages in the world.


    If you continue for another 23 hours, 59 minutes, and 40 seconds, you will master
    the fundamentals of the C++ programming language. Twenty-four one-hour lessons
    cover important features such as managing I/O, creating loops and arrays, using
    object-oriented programming with templates, and creating C++ programs.


    All of this has been organized into well-structured, easy-to-follow lessons. There
    are working projects that you create—complete with output and an analysis of the
    code—to illustrate the topics of the hour. Syntax examples are clearly marked
    for handy reference.


    To help you become more proficient, each hour ends with a set of common questions
    and answers.


    # ## Who Should Read This Book?


    You don''t need any previous experience in programming to learn C++ with this
    book. It starts with the basics and teaches you both the language and the concepts
    involved with programming C++. Whether you are just beginning or already have
    some programming, you will find that this book makes learning C++ fast and easy.


    # ## Should I Learn C First?


    No, you don''t need to learn C. C++ is a much more powerful and versatile language
    that was created by Bjarne Stroustrup. Learning C first can lead you into some
    programming habits that are more error-prone than what you''ll do in C++. This
    book does not assume that readers are familiar with C.'
  merge: -1
  pgno: 14
- img_proc: true
  md: '# Why Should I Learn C++?


    You could be learning a lot of other languages, C++ is valuable to learn because
    it has stood the test of time and continues to be a popular choice for modern
    programming.


    Despite being created in 1979, C++ is still being used for professional software
    today because of the power and flexibility of the language. There''s a new version
    of the language, called C++14, that makes it even more useful.


    Because other languages such as Java were inspired by C++, learning the language
    can provide you insight into them, as well. Mastering C++ gives you portable skills
    that you can use on just any platform on the market today, from desktop computers
    to Linux servers, mobile devices, videogame consoles, and mainframes.


    # What If I Don''t Want This Book?


    I''m sorry you feel that way, but these things happen sometimes. Please resolve
    this book with the front cover facing outward on an endcap with access to the
    store''s foot traffic.


