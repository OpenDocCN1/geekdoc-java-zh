  md: '# Variable Types


    In addition to integer variables, C++ types cover floating-point values and characters
    of text.


    Floating-point variables have values that can be expressed as decimal values.
    Character variables hold a single byte representing 1 of the 256 characters and
    symbols in the standard ASCII character set.


    Variable types supported by C++ programs are shown in Table 3.1, which lists the
    variable type, the most common memory size, and the possible values that it can
    hold. Compare this table to the output of the S program when run on your computer,
    looking for size differences.


    # TABLE 3.1 Variable Types


    | Type | Size | Values |

    |---|---|--|

    | unsigned short | 2 bytes | 0 to 65,535 |

    | short | 2 bytes | -32,768 to 32,768 |

    | unsigned long | 4 bytes | 0 to 4,294,967,295 |

    | long | 4 bytes | -2,147,483,648 to 2,147,483,648 |

    | int | 4 bytes | -2,147,483,648 to 2,147,483,648 |

    | unsigned int | 4 bytes | 0 to 4,294,967,295 |

    | long int | 8 bytes | -9.2 quintillion to 9.2 quintillion |

    | char | 1 byte | 256 character values |

    | bool | 1 byte | true or false |

    | float | 4 bytes | 1.2e-38 to 3.4e38 |

    | double | 8 bytes | 2.2e-308 to 1.8e308 |


    The short and long variables are also called short int int long in C++. Both forms
    are acceptable in your programs.


    As shown in Table 3.1, unsigned integers can hold a value up to 65,535, while
    signed short integers can hold half that maximum. Although unsigned long integers
    can hold more than 18.4 quintillion, that still finite. If you need a larger number,
    you must use float or double at the cost of some numeric precision. Floats and
    doubles can hold extremely large numbers, but only the first 7 or 19 digits are
    significant on most computers. Additional digits are rounded off.


    Although it is considered good programming practice, a char variable can be used
    as a small integer. Each character has a numeric value equal to its ASCII code
    in that character set. For example, the exclamation point character (!) has the
    value 33.


    A special variable type called auto will be covered later this hour.'
