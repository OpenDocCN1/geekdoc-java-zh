  md: '# HOUR 22: Employing Object-Oriented Analysis and Design


    When the messages arrive from the email provider, they will not necessarily be
    separated into header and body; many will be one large stream of data that your
    program will have to disentangle. Perhaps your hierarchy will reflect that idea
    directly.


    Further reflection on the tasks at hand leads you to the properties of these messages,
    with an eye towards introducing capabilities and data storage at the right level
    of abstraction. Listing properties of your objects is a good way to find the members,
    and well as to shake out other objects you might need.


    Mail messages will need to be stored, as will the user''s preferences, phone numbers,
    and so forth. Storage clearly needs to be high up the hierarchy. Should the mail
    messages necessarily share a base class with the preferences?


    # Rooted Hierarchies Versus Non-Rooted


    There are two overall approaches to inheritance hierarchies: you can have all,
    or nearly all, of your classes descend from a common root class, or can have more
    than one inheritance hierarchy. An advantage of a common root class is that you
    can often avoid multiple inheritance; a disadvantage is that many times implementation
    will climb up into the base class.


    A set of classes is rooted if all share a common ancestor. Non-rooted hierarchies
    do not all share a common base class.


    Because you know that your product will be developed on many platforms, and because
    multiple inheritance is complex and not necessarily well supported by all compilers
    on all platforms, your first decision is to use a rooted hierarchy and single
    inheritance. You decide to identify those places where multiple inheritance might
    be used in the future. You can then design so that breaking apart the hierarchy
    and adding multiple inheritance at a later time not be traumatic to your design.


    You decide to prefix the name of all your internal classes with the letter p,
    so that you can easily and quickly tell which classes are yours and which are
    from other libraries.


    Your root class will be pObject. Nearly every class you create will descend from
    this object. pObject itself will be kept fairly simple; only the data that every
    item shares will appear in this class.


    If you want a rooted hierarchy, you should give the root class a generic name
    (like pObject) and few capabilities. The point of a root object is to be able
    to create collections of all its descendants and refer to them as instances of
    pObject. The trade-off is that rooted hierarchies often push the interface up
    into the root class.


    The next likely candidates for top-of-the-hierarchy status is pStored and pired.
    pStored objects are saved to at various times (for example, when the program is
    not in use), and'
