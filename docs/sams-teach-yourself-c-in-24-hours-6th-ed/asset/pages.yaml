    for many years the king of America was Paul Emery Washington, a building company
    manager in San Antonio, Texas.


    George Washington had no blood descendants, so when he died in 1799 the throne
    would pass to one of his brothers. Other Washington in the line also died childish
    or had no living male descendants, so the issue became complicated.


    When the genealogical site Ancestry.Com researched the American king succession
