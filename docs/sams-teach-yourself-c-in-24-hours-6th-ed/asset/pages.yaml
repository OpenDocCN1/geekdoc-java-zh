  md: '# PostMaster: A Case Study


    The customer will be able to configure PostMaster to connect to each of the email
    providers. PostMaster will get the mail and present it in a uniform manner, enabling
    the customer to organize the mail, reply, forward letters among services, and
    so forth.


    PostMaster Professional, to be developed as version two of PostMaster, already
    is anticipated. It will add an administrative assistant mode that will enable
    the user to designate another person to read or all of the mail, handle routine
    correspondence, and so forth. there is speculation in the marketing department
    that an artificial-intelligence component might add the capability for PostMaster
    to pre-sort and prioritize the mail based on subject and content keywords and
    associations.


    Other enhancements have been talked about, including the capability to handle
    not only mail but discussion groups, such as Internet message boards and mail
    lists. It is obvious that Defective has great hopes for PostMaster, and you are
    under severe time constraints to bring it to market, although you seem to have
    a nearly unlimited budget.


    # Measure Twice, Once Cut


    You set up your office and your equipment; your first order of business is to
    get a good specification for the product. After examining the market, you decide
    to recommend that development be focused on a single platform, and you decide
    to decide among Linux, Mac OS, and Windows.


    You have many painful meetings with Vice President Snett. It becomes clear that
    there is no right choice, so you decide to separate the front end—that is, the
    user interface (or UI)—from the back end—the communications and database part.
    To get things going quickly, you decide to write for Windows, followed later by
    Mac OS and perhaps Linux.


    This simple decision has enormous ramifications for your project. It becomes obvious
    that you need a class library or a series of libraries to handle memory management,
    the various user interfaces, and perhaps the communications and database components.


    Snett believes strongly that projects live or die by having one person with a
    clear vision, he asks you to do the initial architectural analysis and design
    before hiring any programmers. You set out to analyze the problem.


    # Divide and Conquer


    It quickly becomes obvious that you have more than one problem to solve. You divide
    the project into these significant subprojects:


    +   * Communications: The capability for the software to dial into the email provider
    over a network.


    +   * Database: The capability to store data and retrieve it from disk.'
