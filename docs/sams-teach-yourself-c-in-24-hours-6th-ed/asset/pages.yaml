  md: "# Exceptions\n\nIn C++, an exception is an object that is passed from the area\
    \ of code where a problem occurs to the part of the code that is going to handle\
    \ the problem. When an exception occurs it is said to be thrown. When an exception\
    \ is handled, it is said to be caught.\n\nThe type of the exception determines\
    \ which area of code will handle the problem. The contents of the object thrown\
    \ as exception may be used to provide feedback on the problem to the user.\n\n\
    The basic idea behind exceptions is fairly straightforward:\n\n+   The actual\
    \ allocation of resources (for example, the allocation of memory or the locking\
    \ of a file) is usually done at a low level in the program.\n\n+   The logic of\
    \ when an operation fails, memory cannot be allocated, or a file cannot locked\
    \ is usually high in the program, with the code for interacting with resources.\n\
    \n+   Exceptions provide an express path from the code that can handle the error\
    \ condition. If there are intervening layers of functions, they are given an opportunity\
    \ to clean memory allocations, but are not required to include code whose only\
    \ purpose is to pass along the error condition.\n\n# How Exceptions are Used\n\
    \nA try block is created to surround areas of code that might have a problem and\
    \ throw an exception. For example:\n\n```\ntry\n{\n  someDangerousFunction();\n\
    }\n```\n\nA catch block is the block immediately following a try block in which\
    \ exceptions are handled. For example:\n\n```\ntry\n{\n  someDangerousFunction();\n\
    }\ncatch (outOfMemory)\n{\n  // take action to recover from low memory condition\n\
    }\ncatch (fileNotFound)\n{\n  // take action when a file is not found\n}\n```"
