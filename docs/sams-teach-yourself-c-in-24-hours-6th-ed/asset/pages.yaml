  md: '# Creating New Types


    As you work with built-in types in C++, each variable''s type tells you quite
    a bit about it. For example, if you write a program with height and width declared
    as unsigned short integers, you know that each variable can hold a number between
    0 and 65,535.


    The type also tells you capabilities of the variable. Short integers can be added
    together, by declaring height and width as that type, you know they can be added
    together.


    The type of a variable tells you several:


    +   * Its size in memory

    * The information it can hold

    * The actions that can be performed on


    In C++ you define your types to model a problem you are trying to solve. The mechanism
    for declaring a new type is to create a class. A class is a definition of a new
    type.


    # Classes and Members


    A C++ class is a template used to create objects. After you define a class, objects
    created from that class can be put to use like any other data type.


    A class is a collection of related variables and functions bundled together. The
    variables can be of any other type, including other classes.


    Variables make up the data in the class, and functions perform tasks using that
    data. Bundling these together is called encapsulation.


    This will make more sense in relation to a real object, such as the red tricycle
    my parents left behind during a move from Wichita Falls, to Dallas when I was
    four years old. (The U-Haul out of room. This is a tough subject for me.)


    One way to think about a class is it''s a collection of objects connected together—wheels,
    a seat, handlebars, and pedals. Another way is in terms of what it can do: move,
    accelerate, stop, and impress other four-year olds.


    Combining these together—the physical aspects and performance—is encapsulating
    the object.


    Encapsulation of a class makes possible for other programs to use the class without
    knowing how it works. Using of your class only need to know what it does, not
    how it does.


    The variables of the class are called its member variables. A tricycle might have
    member variables representing the wheel size, top speed, and the height of its
    fluorescent orange safety flag.'
