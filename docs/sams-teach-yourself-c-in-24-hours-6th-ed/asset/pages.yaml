  md: '# HOUR 2: Organizing the Parts of a Program


    A multiple-line comment begins with the slash and asterisk characters (*) and
    ends with the same characters reversed (*). Everything within the opening /* and
    the closing /* is a comment, even if it stretches over multiple lines. If a program
    contains a /* * somewhere, an error likely be flagged by the compiler. Here is
    a multiline comment:


    ```

    /* This part of the program does not work well. Please remember to fix this before
    the code goes live -- else a scapegoat you can blame for the problem. The new
    guy Curtis would be a good choice. */

    ```


    In the preceding comment, the text on the left margin is lined up to make it more
    readable. Is not required. Because the compiler ignores everything within the
    /* and /, anything can be put there—grocery lists, poems, secrets you''ve never
    told in your life, and so on.


    # CAUTION


    An important thing to remember about multiline comments is that they do not nest
    inside each other. If you use /* to start a comment and then use another /* a
    few lines later, the first /* mark encountered by the compiler will end all multiline
    comments. The second /* mark will result in a compiler error. Most C++ programming
    editors display comments in a different color to make clear where they begin and
    end.


    The next project that you create includes both kinds of comments. Write lots of
    comments in your programs. The more time you spend writing comments explaining
    what''s going on in source code, the easier that code will be to work on weeks,
    months or even years later.


