    it displays the address of the object it refers to, and this matches the address
    of the object on the heap.


    So far, good how will memory be free? You cannot `delete` on the reference. One
    clever solution is to create another pointer and initialize it with the address
    obtained from `rCat`. This deletes the memory and plugs the memory leak. One small
    problem, though: What is `rCat` referring to line 29? As stated earlier, a reference
    always must be an alias for an actual object. If it refers to a null object (as
    this does now), the program is invalid.


    # CAUTION


    It cannot overemphasized that a program with a reference to a null object might
    compile, but it is invalid and its performance is unpredictable.


    There are actually two solutions to this problem. The first is to return a pointer
    to the memory created on line 36. Then the calling function can delete the pointer
    when it is done. To do this, change the return value of `Function` to a pointer
    (rather than reference) and return the pointer, rather than the dereferenced pointer:


    ```

    SimpleCat *pFrisky = new SimpleCat(5,9);

    std::cout << "pFrisky << " << pFrisky << "\n";

    return pFrisky; // return the pointer

    ```


    A better solution is to declare the object in the calling function and then pass
    it to `Function()` by reference. The advantage of this approach is that the function
    that allocates the memory (the calling function) is also the function responsible
