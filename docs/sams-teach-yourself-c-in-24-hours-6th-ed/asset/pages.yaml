    # Overloading Versus Overriding


    The terms overloading and overriding sound similar and do similar things in C++.
    When you overload a member function, you create more than one function with the
    same name but with different signatures. When you override a member function,
    you create a function in a derived class with same name as a function in the base
    class and with same signature.


    # Hiding the Base Class Member Function


    In the Mammal program you created, the Dog class''s member function speak() hides
    the base class function. This is what is wanted, but it can have unexpected results.
    If Mammal has a move() member function that is overloaded, and Dog overrides that,
    the Dog function hides all the Mammal functions with that name.


