  md: 'Sensors can be divided into motion detectors, trip wires, sound detectors,
    smoke detectors, and so forth. All these are types of sensors, although there
    is no such thing as a sensor per se. This is a good idea that sensor is an abstract
    data type (ADT).


    As an ADT, the class Sensor would provide the complete interface for all types
    of sensors, and each derived type would provide the implementation. Clients of
    the various sensors would use them without regard to which type of sensor they
    are, and each would "do the right thing" based on their real type.


    To create a good ADT, you need to have a complete understanding of what sensors
    do, rather than how they work. Do they active? Do they wait for some element to
    heat up, a wire to break, or a pebble to melt, or do they probe their environment?
    Perhaps some sensors have only a binary state (triggered or unttriggered), but
    others have a more analog state (what is the current temperature?). The interface
    to the abstract data type should be sufficiently complete to handle all the anticipated
    needs of the myriad classes.


    # Other Objects


    The design continues in this way, teasing out other classes that are required
    to meet the specification. For example, if a log is to be kept, probably a timer
    is needed; should the timer poll each sensor, or should each sensor file its own
    report periodically?


    The user is going to be able to set up, disarm, and program the system, as a terminal
    of some sort is required. You might want a separate object in your simulation
    for the alarm program itself.


    # Designing the Classes


    As you solve these problems, you will begin to design your classes. For example,
    you HeatSensor will derive from Sensor. If the sensor is to make periodic reports,
    it might also derive via multiple inheritance from Timer, or it might have a timer
    as a member variable.


    The HeatSensor will probably have member functions, such as currentTemp() and
    setLimit(), and probably will inherit functions from soundAlarm() from its class,
    Sensor.


    A frequent issue in object-oriented design is that of encapsulation. You can imagine
    a design in which the alarm system has a setting for maxTemp. The alarm system
    asks the sensor what the current temperature is, compares it to the maximum temperature,
    and sounds the alarm if it is too hot. One could argue that this violates the
    principle of encapsulation. Perhaps it would be better if the alarm system didn''t
    know or about the details of temperature analysis—arguably that should be in the
    HeatSensor.'
