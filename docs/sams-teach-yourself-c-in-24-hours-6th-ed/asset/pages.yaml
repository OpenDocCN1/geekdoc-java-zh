    # Summary


    During this hour, you learned how to achieve more control over the creation and
    destruction of objects in C++.


    Constructors, like functions, can be overloaded. The number and type of parameter
    to the constructor enable the compiler to determine which one should be called
    by users of the class.


    A constructor may have default values just like member functions and ordinary
    functions.


    When an object is copied, all member variables are copied by the copy constructor.
    This creates problems when member variables are pointers to objects on the heap.
    Both the original object and the copy point to the same object. When one object
    goes out of scope and is destroyed, the other still has an active pointer to that.
    Any attempt to use pointer results in a crash of the program.


    This problem can be fixed by writing your own constructor for a class. The constructor
    takes one parameter: the original object that will be copied. In the constructor,
    care can be taken so that the pointer uses new memory.


    # Q&A


    +   Q. Why would you ever use default values when you can overload a function?

    A. Because it''s easier to maintain one function than two and easier to understand
    a function with default parameters than to study the bodies of two functions.
    Furthermore, updating one of the functions and neglecting to update the second
    is a common source of bugs.

    Q. Given the problems with overloaded methods, why not always use default instead?

    Aloaded methods supply capabilities not available with default variables, as varying
    the list of parameters by type rather than by number.

    Q. When writing a class constructor, how do you decide what to put in the initialization
    and what to put in the body of the constructor?

    A. A simple rule of thumb is to do as much as possible in the initialization phase
    and initialize all member variables. There such things as computations and std::cout
    statements must be in the body of the constructor.'
