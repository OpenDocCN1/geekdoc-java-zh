    # What is a Reference?


    In the past two hours, you learned how to use pointers to manipulate objects on
    the heap and refer to those objects directly. References, the topic of this hour,
    give you almost all the power of pointers with a much easier syntax.


    A reference is an alias. When you create a reference, you initialize it with the
    name of another object, the target. From that moment on, the reference acts as
    an alternative name for the target, and anything you do to the reference is really
    done to the target.


    You might read elsewhere that references are pointers, but that is not correct.
    Although references are often implemented using pointers, that is a matter of
    concern only to creators of compilers; as a programmer, you must keep these two
    ideas distinct.


    Pointers are variables that hold the address of another object. References are
    aliases to an object.


