  md: 'If x and y both equal 5, the expression is true. If either x or y does not
    equal 5, the expression is false. Both sides must be true for the entire expression
    to be true and for the conditional statement to execute.


    # OR Operator


    The logical OR operator evaluates two expressions and if either one is true, the
    expression is true:


    ```

    if ((x == 5) || (y == 5))

    // do something here

    ```


    If x or y equals 5 or both equal 5, the expression is true. In fact, if x equals
    5, the compiler never checks y at all.


    # NOT Operator


    A logical NOT reverses a normal expression, returning true if the expression is
    false and false if the expression is true. Here''s a statement that uses one:


    ```

    if (!(grade < 70))

    ```


    This expression is true if grade is 70 or greater and false otherwise. The Grader
    and NewGrader programs use grade >= 70 to check for passing grades. The NOT expression
    accomplishes the same thing by looking for grades that are not less than 70.


    # Relational Precedence


    Relational operators and logical operators, like other operators, return a value
    of true or false and have a precedence order determines which relations are evaluated
    first. This fact is important when determining the value of the statement such
    as following:


    ```

    if (x > 5 && (y > 5 || z > 5))

    ```


    The logical AND and OR operators have the same precedence, so they are evaluated
    left-to-right order. For this expression to be true, both x and y must be greater
    than 5 or z must be greater than 5.


    Parentheses can be used to impose a different order:


    ```

    if (x > 5 && (y > 5 || z > 5))

    ```


    For this expression to be true, x must be greater than 5 and either y or z must
    be greater than 5.'
