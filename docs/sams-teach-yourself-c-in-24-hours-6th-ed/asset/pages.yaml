  md: '# Linked Lists as Objects


    In object-oriented programming, each individual is given a narrow and well-defined
    set of responsibilities. The linked list is responsible for maintaining the head
    node. The HeadNode immediately passes any new data on whatever it currently points
    to, without regard for what might be.


    The TailNode, whenever it is handed data, creates a new node and inserts it. It
    knows only one thing: if this comes to me, it gets inserted right before me.


    Internal nodes are marginally more complicated; they ask their existing object
    to compare itself with the new object. Depending on the result, they either insert
    it or they just pass it along.


    Note that the InternalNode has no idea how to do the comparison; that is properly
    left to the object itself. The InternalNode knows to ask the objects to compare
    themselves and to expect one of three possible scenarios. Given one answer, it
    inserts; otherwise, it passes it along, not knowing or caring where it end up.


    So who is in charge? In a well-designed object-oriented program, no class is charge.
    Each object does its own job and the net effect is a well-running machine.


    The beauty of a linked list is that you can put any data type you would like in
    the Data of this class. In case, it contains an integer node. It could contain
    multiple types or even other objects (including linked lists).


    The use of dynamic memory allows linked lists to use very little memory when small,
    and lots of memory if they grow. The important thing is that they only use enough
    to hold the data they now contain. Arrays, on the other hand, are allocated to
    a specific size, which are both wasteful and limiting.


    > NOTE

    Because linked lists are more useful than arrays, you might be wondering why not
    use them all the time. The power comes at a cost. Linked lists are sequential
    in nature, which means that you have to start at one end and work your way to
    the other end to find the item you want. That access is relatively slow.


    # Summary


    Because there''s so much to learn in C++, the projects undertaken in this book
    have often been short and illustrative. That makes it easier to focus on their
    functionality.


    As you begin your own programming projects, you will find that the classes you
    create are never quite so simple.'
