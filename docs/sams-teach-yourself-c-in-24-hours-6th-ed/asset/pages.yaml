- img_proc: true
  md: '# HOUR 10: Creating Pointers


    The name Camp is your data on the heap. You don''t know where it is, but you know
    how to get to it. You access it by using its address. You don''t have to know
    that number; you just have to put it into a pointer. The pointer gives you access
    to your data without bothering you with the details.


    The stack is cleaned automatically when a function returns. All the local variables
    out of scope, and they are removed from the stack. The heap is not cleaned until
    your program ends, and it is your responsibility to free any memory that you''ve
    reserved using it. Leaving items hanging around in the heap when you no longer
    need them is known as a memory leak, a topic covered later in this.


    The advantage of the heap is that the memory remains available until you explicitly
    free it. If you reserve memory on the heap while in a function, the memory is
    still available when the function returns.


    The advantage of accessing memory in this way, rather than using global variables,
    is that only functions with access to the pointer have access to the data. This
    provides a tightly controlled interface to that data, and it eliminates the problem
    of function changing data in unexpected and unanticipated ways.


    For this work, you must be able to create a pointer to an area on the heap. The
    sections describe how to do this.


    # Using the new Keyword


    You allocate memory on the heap in C++ by using the new keyword followed by the
    type of the object that you want to allocate so that the compiler knows how much
    memory is required. Therefore, new unsigned short allocates two bytes in the heap,
    and new long allocates.


    The return value from new is a memory address. It must be assigned to a pointer.
    To create an unsigned short int on the heap, you write the following:


    ```

    unsigned short int *pPointer;

    pPointer = new unsigned short int;

    ```


    You can, of course, initialize the pointer at its creation:


    ```

    unsigned short int *pPointer = new unsigned short int;

    ```


    In either case, pPointer now points to an unsigned short int on the heap. You
    can use this like any other pointer to a variable and assign a value into that
    area of memory:


    ```

    *pPointer = 72;

    ```


    This means "put 72 at the value in pPointer" or "assign the value 72 to the area
    on the heap to which pPointer points."'
