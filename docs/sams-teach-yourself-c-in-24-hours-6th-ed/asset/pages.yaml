  md: '# Pointer, Pointer, Who Has the Pointer?


    When your program allocates memory on the heap, a pointer is returned. It is imperative
    that you keep a pointer to that memory, because after the pointer is lost, the
    memory cannot be deleted and becomes a memory leak.


    As you pass this block of memory between functions, one of the functions "owns"
    the pointer. Typically, the value in the block is passed using references, and
    the function that created the memory block is the one it deletes. But this is
    a general rule, not an ironclad one.


    It is dangerous for one function to create space in memory and another to free
    it, however. Ambiguity about which owns the pointer can lead to one of problems:
    forgetting to delete a pointer or deleting it twice. Either one can cause problems
    in your program. It is safer to build your functions so that they delete the memory
    they created.


    If you write a function that needs to create a block of memory and then pass it
    back to the calling function, consider changing your interface. The calling function
    allocate the memory and pass it into you by reference. This moves all memory management
    out of your function and back to the function that is prepared to delete it.


    # Summary


    With the completion of this hour, you now be comfortable with how pointers and
    references are created in C++ and understand their strengths and weaknesses.


    A pointer is a variable that holds a memory address, whereas a reference is an
    alias.


    Both provide forms of indirection that enable functions to be more, well, functional.
    In many cases, however, you''ll find that references are the better choice.


    # Q&A


    +   Q. Why have pointers if references are easier?

    nA. References cannot be NULL and cannot be reassigned. Pointers offer greater
    flexibility, but are slightly more difficult to use.


    +   Q. Why would you ever return by value from a function?

    A. If the object being returned is local, you must return by value or you will
    be returning a reference to a non-existent object.


    +   Q. Given the danger in returning by reference, why not always return by value?

    A. There is much greater efficiency in returning by reference. Memory is saved,
    and the program runs faster.'
