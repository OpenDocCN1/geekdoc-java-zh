  md: '# HOUR 19

    Storing Information in

    Linked Lists


    What You''ll Learn in This Hour:


    +   * What a linked list is

    * How to create a linked list

    * How to encapsulate functionality through inheritance


    # Linked Lists and Other Structures


    Arrays are like boxes for mailing items. They are useful containers, but each
    are a fixed size. If you pick a container that is too large, you waste space and
    may even be charged. If you pick one that is too small, there''s not enough room
    to hold what you need to ship.


    In programming, it''s useful to have a container that''s exactly the right size
    for the data it contains. One way to accomplish this is with a linked list.


    A linked list is a data structure that consists of small containers that connect
    together. Containers, in this context, are classes that contain the objects to
    be held in the list. The idea is to write a class that holds one object of your
    data—such as Cat or Rectangle—and knows how to point to the next container in
    the list. You create one container for each object and chain them together.


    These containers are called nodes. The first node in the list is called the head,
    and the last node in the list is called the tail.


    Lists come in three fundamental forms. From simplest to most complex, they are:


    +   * Singly linked

    * Doubly linked

    * Trees


    In a singly linked list, each node points to the next one forward, but not backward.
    To find a particular node, you start at the top and go from node to node in sequence.
    A doubly linked list'
