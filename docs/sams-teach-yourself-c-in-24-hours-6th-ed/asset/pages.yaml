  md: "# Using auto in Function Return Types\n\nC++ is a type-safe language, providing\
    \ an important assurance that all data will remain in the form it takes when its\
    \ variable is declared. The burden is on the programmer to use each variable according\
    \ to type. With each new version of the language, more type safety has been ensured\
    \ by the compiler.\n\nIn C++11, the auto keyword could be used in a variable declaration\
    \ to let the compiler infer the data type. This made it possible to do things\
    \ like:\n\n```\nauto length = 50;\nauto width = 30;\nauto height = 3;\nauto area\
    \ = length * width * height;\n```\n\n```\nstd::cout << \"Area: \" << area << std::endl;\n\
    ```\n\nThe variables are all integers, which the compiler knows. The length, width,\
    \ and height variables are integers because they are assigned integer values as\
    \ they are declared. The area is an integer because it is the result of multiplying\
    \ three integers.\n\nC++ extends this type inference capability by making it possible\
    \ to use auto as the return type of a function.\n\nAs the compiler does with variable\
    \ declarations, the auto keyword causes the function's return type to be determined\
    \ by the context. This function has auto as the return type:\n\n```\nauto getSalaryMultiple(int\
    \ years) {\n    if (years < 10) {\n        return 1.1;\n    }\n    return 1.25;\n\
    }\n```\n\nThe function takes an employee has worked as a parameter, returning\
    \ a multiplier of 1.1 for less than 10 years and 1.25 otherwise. This would be\
    \ multiplied by the employee's current salary to calculate the new salary.\n\n\
    The compiler determines that the function returns a double value because both\
    \ return statements return literals of that type.\n\nIn order for auto to be used\
    \ as a function return, every return statement in that function must return the\
    \ same type. If the preceding code was changed so that the final statement returned\
    \ instead of 1.25, compilation fails with this error message:\n\n```\nerror: inconsistent\
    \ deduction for 'auto': 'double' and then 'int'\n```"
