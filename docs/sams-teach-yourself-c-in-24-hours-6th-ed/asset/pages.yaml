  md: '# Answers


    +   1. **B.** The compiler knows because the prefix `template <T>` is used.


    +   2. **A.** The `T` will appear in the class wherever a specific data type would
    have appeared in a normal class.


    +   3. **C.** When the main function exits, the linked lists fall out of scope,
    and the destructor for that class is called. Because the individual (contained)
    objects are dynamically allocated, it is up to the linked list to delete them
    also.


