  md: 'There are three access specifiers: public, protected, private. If a function
    has an instance of a class, it can access all the public member data and functions
    of that class. The member functions of a class, however, can access all the private
    data members and functions of any class from which they derive.


    Therefore, the function Dog::wagTail() can access the private data breed and can
    access the protected data in the Mammal class.


