  md: "# Inline Functions\n\nWhen you define a function, the C++ compiler creates\
    \ just one set of instructions in memory. Execution of the program jumps to those\
    \ instructions when the function is called and jumps back after the function returns\
    \ to the next line in the calling function. If the program calls the function\
    \ 10 times, it jumps to the same set of instructions each time. There is only\
    \ one copy of the instructions that make up the function, not 10 copies.\n\nSome\
    \ performance overhead is required to jump in and out of functions. When a function\
    \ consists of a small number of statements, you can gain some efficiency if the\
    \ program avoids making the jumps. The program runs faster if the function can\
    \ be avoided.\n\nIf a C++ function is declared with the keyword inline, the compiler\
    \ does not create a real function. Instead, it copies the code from the inline\
    \ function directly into the place where the function was called. It is just as\
    \ if you had written the statements of the function right there.\n\nIf an inline\
    \ function is called 10 times, the inline code is copied all 10 times. The tiny\
    \ improvement in speed could be swamped by the increase in size of the executable.\n\
    \nNOTE\n\nThe inline keyword is a hint to the compiler that you would like the\
    \ function to be inlined. The compiler is free to ignore the hint and make a real\
    \ function. Current compilers do a terrific job on their own of making C++ code\
    \ execute quickly, so there's often little to be gained from declaring a function\
    \ inline.\n\nThe inline keyword is used in the function prototype:\n\n```\ninline\
    \ int double(int);\n```\n\nThe function itself does not change:\n\n```\nint double(int\
    \ target)\n{\n  return 2 * target;\n}\n```\n\n# Auto-Typed Return Values\n\nOne\
    \ of the features added to C++ with version C++14 is the automatic deduction of\
    \ a function's return type with the auto keyword. You already could create variables\
    \ with auto data type was figured out by the compiler based on the value assigned\
    \ to it. This takes that convenience a step further."
