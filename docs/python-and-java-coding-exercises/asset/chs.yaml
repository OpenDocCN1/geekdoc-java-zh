  \ :  [40, 10, 50, 20, 60, 30]\n\n### 获取元素的频率\n\n### Python 代码\n\n```python\nimport\
  \ collections\nmy_list = [10,10,10,10,20,20,20,20,40,40,50,50,30]\nprint(\"Original\
  \ List : \",my_list)\nctr = collections.Counter(my_list)\nprint(\"Frequency of the\
  \ elements in the List : \",ctr)\n```\n\n### 输出\nOriginal List :  [10, 10, 10, 10,\
  \ 20, 20, 20, 20, 40, 40, 50, 50, 30]\nFrequency of the elements in the List : \
  \ Counter({10: 4, 20: 4, 40: 2, 50: 2, 30: 1})\n\n### 在 Python 中生成列表的所有子列表\n\n###\
  \ Python 代码\n\n```python\nfrom itertools import combinations\ndef sub_lists(my_list):\n\
  \  subs = []\n  for i in range(0, len(my_list)+1):\n    temp = [list(x) for x in\
  \ combinations(my_list, i)]\n    if len(temp)>0:\n      subs.extend(temp)\n  return\
