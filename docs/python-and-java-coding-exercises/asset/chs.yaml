  ```python\ndef second_smallest(numbers):\n  if (len(numbers)<2):\n    return\n \
  \ if ((len(numbers)==2) and (numbers[0] == numbers[1]) ):\n    return\n  dup_items\
  \ = set()\n  uniq_items = []\n  for x in numbers:\n    if x not in dup_items:\n\
  \      uniq_items.append(x)\n      dup_items.add(x)\n  uniq_items.sort()   \n  return\
