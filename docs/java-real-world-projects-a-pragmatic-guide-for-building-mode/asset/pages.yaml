    # Exploring the PromQL


    Prometheus has a powerful query language that lets us extract helpful information
    from raw metric data on how the system behaves. Consider, for example, the usage
    of the following PromQL expression:


    # file_http_request_total


    The most basic way of executing a query is by providing the metric name we are
