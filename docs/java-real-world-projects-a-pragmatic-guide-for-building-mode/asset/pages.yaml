  md: '# # CHAPTER 12

    Solving problems with Domain-driven Design


    # ## Introduction


    As a Java developer, most of the software you will see is made to solve business
    problems. This software represents the processes, rules, and all sorts of things
    an organization needs to do stay fulfill customer expectations. Malfunctioning
    and bugs in such software may translate directly to financial and reputation damage
    because most, if not all, business activities depend on the software that enables
    them.


    As the software industry matured over the years and software systems shifted from
    supporters of business operations to becoming the core actors of business success,
    developers became more concerned about the practices that allowed them to develop
    applications that captured business knowledge more accurately. From that concern,
    one practice called domain-driven design (DDD) emerged as a software development
    technique with the main goal of designing applications driven by real-world problems.


    Knowing how to employ domain-driven design is a fundamental skill for any Java
    developer interested in building enterprise applications that as crucial assets
    for businesses. That is why this chapter covers essential domain-driven design
    principles and techniques.


    # ## Structure


    The chapter covers the following topics:


    +   - Introducing domain-driven design

    - Conveying meaning with value objects

    - Expressing identity with entities

    - Defining business rules with specifications

    - Testing the domain model

    - Compiling and running the sample project


    # ## Objectives


    By the end of this chapter, you will know how domain-driven design principles
    such as bounded context and ubiquitous languages help you to model a problem domain
    that lets you write code not only works but also serves as an accurate expression
    of the business operations that are conducted via software to solve real-world
    problems. By employing techniques such as entities, value objects, and specifications,
    you will be able to'
  merge: -1
  pgno: 338
- img_proc: true
  md: 'develop better-structured applications by keeping complexity under control
    and avoiding the so-called big ball of mud systems, where any code change represents
    a high risk of breaking things.


    # Introducing domain-driven design


    Software projects in an enterprise environment usually start with the organization''s
    desire to solve a perceived problem. The organization assesses the challenges
    existing and potential new customers face. Then, it attempts to devise solutions
    to tackle challenges in the best possible way. In agile-based organizations, we
    often find a product owner and designer trying to understand with business people
    what challenges, if benefit, will benefit customers and generate profit for the
    organization.


    Once it is clear which problem needs to be solved and the high-level requirements
    are more or less defined, software developers are summoned to devise a technical
    path to implement a working software that delivers the value customers are expected
    to receive. At glance, it may seem a straightforward path. In reality, the journey
    is marked by ambitions, unknowns, and unexpected challenges developers face when
    trying to understand precisely what the business needs to fulfill customer expectations.


    Understanding business needs can be quite challenging for developers because they
    are supposed to be experts in the technologies they use rather than the problem
    from which they want to create a software solution. Knowledge gaps in understanding
    how a given business operate a critical issue because such a weak understanding
    will translate into an ineffective software product.


    Aware of the fact that weak problem domain knowledge on the part of the software
    developers represents a considerable risk for the success of enterprise projects,
    Eric Evans shared through his book Domain-Driven Design, published in 2006, explaining
    how to bridge the gap between software developers and the required problem domain
    to design software systems as captured business intricacies in the most cohesive
    and maintainable way. Evans''s ideas considerably impacted the software development
    industry.


    Evans conceived a set of principles and techniques that put the problem domain
    as the main driver for the development of software systems. The problem domain
    is the specific field in which the business operates, like logistics, banking,
    and retail, to name some examples. The motivation for getting better problem domain
    knowledge was the technologies required to fulfill them. As may often be the case,
    developers can be tempted to prioritize, for example, which programming language,
    database, and technologies they will use rather than trying to understand the
    problem domain they are dealing with. When taken too far, temptation leads to
    a software code driven more by technology than by business. Domain-driven design
    proposes a change in this mindset with a business-centric perspective on how software
    can be developed.


    Concepts such as the bounded context, ubiquitous language, event storm, and the
    domain model are coroll of the domain-driven design. These concepts help us to
    translate business knowledge into working code. Domain-driven design coding techniques
    like entities, value objects, and specifications were established to implement
    the domain model, a tangible materialization based on code, documents, and diagrams
    that help us understand business problems and how they are solved through software
    code.


    This section explores essential domain-driven design concepts, which will help
    us implement a domain model in the upcoming sections. Let us start by learning
    the concept of bounded context.'
