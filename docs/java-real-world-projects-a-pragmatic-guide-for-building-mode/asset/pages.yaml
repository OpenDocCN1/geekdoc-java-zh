    # Commands


    Having identified our first domain event, the TransactionAdded, we must determine
    which command triggers this event. We can solve it by defining the AddTransaction
    command, as shown in the following figure:


    ![](img/9b5739f37699f084397670714bf63edd_344_1.png)


    The AddTransaction command starts with a verb indicating which action is carried
    out to trigger the event. Commands must always be represented with verbs in the
    present form.


    At this stage, we know the domain event and the command that triggers it, but
    we need to know who is responsible for executing the command.


    # Actors


    Actors play a fundamental role in even stemming because it is through them that
