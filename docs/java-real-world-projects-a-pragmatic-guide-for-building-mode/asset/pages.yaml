  md: "Developing a robust Java application means understanding what can go wrong\
    \ and how the application can gracefully handle unexpected behaviors. Your application\
    \ can have a logic that breaks whenever a user provides an unusual input that\
    \ the application is unprepared to handle. When integrating your application with\
    \ a database, you assumed the data would always come in one format. The API you\
    \ are consuming may suddenly change its contract, breaking your application. The\
    \ file system where your application saves files becomes full, causing failure\
    \ when saving new files. We can go on and on with the things that can cause issues\
    \ in an application.\n\nThe Java architects were aware of the failure conditions\
    \ an application may face, and because of that, they designed an error-handling\
    \ mechanism based on the **Throwable** class. This class handles all errors and\
    \ exceptions while a Java application is running.\n\nIn Java, we have checked\
    \ and unchecked exceptions. Checked exceptions represent failure conditions that\
    \ a Java application must handle or catch, while unchecked exceptions are the\
    \ opposite, meaning they are not supposed to be caught even though the programmer\
    \ may catch them if he wants. We can create a exception by using the **Exception**\
    \ class directly or extending it. There is also a *RuntimeException* class, which\
    \ is considered an unchecked exception, extending the *Exception* class. Every\
    \ other *Error* class that extends directly from the **Throwable** class and is\
    \ considered an unchecked exception.\n\nCatching a exception allows us to provide\
    \ some graceful recovery mechanism to our application while notifying us what\
    \ went wrong. Properly using the exception handling in Java can significantly\
    \ improve troubleshooting efforts by allowing us to identify faster why things\
    \ are not working as expected in our application.\n\nNext, let us use some cases\
    \ for checked exceptions.\n\n# Checked exceptions\n\nHere, we have an example\
    \ showing how checked exceptions can be used:\n\n```\npublic class ExceptionAnalysis\
    \ {\n\n    public static void main(String[] args) {\n\n        try {\n\n     \
    \       checkParameter(-1);\n        } catch (Exception e) {\n            System.out.println(\"\
    The following error occurred: \" +\n                e.getMessage());\n       \
    \     e.printStackTrace();\n        }\n    }\n\n    public static void checkParameter(int\
    \ parameter) {\n        if(parameter<0)\n            throw new Exception(\"Negative\
    \ numbers are not allowed\");\n    }\n}\n```"
