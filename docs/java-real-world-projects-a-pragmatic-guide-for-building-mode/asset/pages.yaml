- img_proc: true
  md: 'Jakarta Persistence only describes how a Java application should manage database
    entities. It provides the Jakarta Persistence API with a set of interfaces and
    classes that constitute the specification. Different providers implement the Jakarta
    Persistence specification. Hibernate and Eclipse are well-known Jakarta Persistence
    implementations.


    The decision to use Jakarta Persistence usually comes when a Java project requires
    a consistent database handling mechanism that allows database entities to be mapped
    to Java classes. The ability to represent a database table as a Java class enables
    developers to conveniently handle database entity relationships as Java objects
    without manipulating SQL code to achieve it because this is done by a Jakarta
    Persistence implementation like Hibernate, for example.


    Another good reason to adopt Jakarta Persistence is the standardization benefits
    it brings. It allows applications to switch between database technologies without
    the need to refactor the code responsible for handling database entities. This
    happens because the Java representation of database entities is translated to
    work with different database technologies.


    It means that you can, for many scenarios, change your Java application''s database
    from Oracle to SQL Server, and keep your code based on the Jakarta Persistence
    untouched.


    To understand how we can tap into the benefits provided by Jakarta Persistence,
    we will learn how to implement Jakarta Persistence entities and their main characteristics.
    We will also learn how to configure and use Hibernate, the most used ORM technology
    that implements the Jakarta Persistence specification.


    # Defining entities


    The magic behind the Jakarta Persistence lies in mapping a Java class to a database
    table. We use the Entity annotation on top of a Java class:


    ```

    @Entity

    @Table(name = "USER")

    public class User {


    @Id

    @Column(name = "id", updatable = false, nullable = false)

    private UUID id;


    @Column(name = "email", nullable = false)

    private String email;


    @Column(name = "password", nullable = false)

    private String password;

    ```'
