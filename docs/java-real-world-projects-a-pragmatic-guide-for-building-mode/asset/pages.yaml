- img_proc: true
  md: 'When Kubernetes objects need to be provisioned in one of the worker nodes,
    the kube-scheduler is responsible for finding a worker node that best suits the
    requirements of a given Kubernetes object. Worker nodes with high CPU, memory,
    and storage usage may be skipped in favor of worker nodes with more free capacity.
    A Pod is one of the Kubernetes examples we will explore further in the next section.


    # kube-apiserver


    The kube-apiserver interconnects different Kubernetes components and provides
    an external API that commandline tools like kubectl to interact with the Kubernetes
    cluster. Practically everything that occurs inside a Kubernetes cluster passes
    through the kube-apiserver.


    # kube-controller-manager


    Kubernetes objects have a current and desired state. The desired state is expressed
    through a Yet Another Markup Language (YAML) representation that describes how
    a Kubernetes object should be provided. If, for some reason, the current Kubernetes
    object''s state is not the same as the desired one, the kube-controller-manager
    may take action to ensure the desired state is achieved.


    Control plane components usually run in a master node, a machine in the Kubernetes
    cluster used only for management purposes.


    Next, we cover Kubernetes node components.


    # Container runtime


    It is the container engine running in a Kubernetes node. It can be containerd,
    which Docker is based on, or any other compatible container technology. Kubernetes
    provides the'
