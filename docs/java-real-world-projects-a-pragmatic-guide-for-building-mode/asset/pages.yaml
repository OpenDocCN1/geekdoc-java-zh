- img_proc: true
  md: 'Depending on the organization''s structure, developers will be in charge of
    ensuring their applications run well in production. It can also happen that this
    responsibility will instead fall on the shoulders of support application analysts
    or system administrators. Either way, someone needs to be capable of understanding
    application behaviors, predicting and preventing issues, and identifying and fixing
    those when they occur.


    For many years, developers, system administrators, support analysts, and anyone
    interested have been using monitoring tools to gain visibility and understanding
    of how server-side applications when serving requests and processing data. However,
    with the rise of distributed architecture applications, traditional monitoring
    approaches have clear limitations. This led to the emergence of observability,
    a more comprehensive approach that provides deeper insights, especially in distributed
    architectures like microservices.


    Before we explore, let us check what is monitoring.


    # Monitoring


    Any application behaves in its own way, given the constraints and load exerted
    upon it. The constraints are the computing resources, like CPU, memory, storage,
    and network bandwidth, available to the application to perform its activities.
    The load refers to how much of the available resources the application uses to
    carry on with its tasks. Roughly inspecting how an application behaves in the
    face of constraints and load is one form of monitoring. The goal of monitoring
    is, for example, to prevent resources like lack of storage or memory. That may
    be accomplished by setting up monitoring dashboards and alerts to send messages
    or phone calls when a predefined threshold is met, such as 80% of the disk being
    used.


    Another form of monitoring is concerned with application logic. Some applications
    are developed in an enterprise environment to solve business problems. The logic
    to be susceptible to dependencies like database availability, input data provided
    through an application request, or data obtained from an API. The ability to inspect
    how well an application solves business problems is fundamental to predicting
    or quickly remediating issues. Monitoring application logic can be accomplished,
    for example, through the usage of metrics and application logs. Dashboards and
    alerts can also be used on top of data provided by metrics and logs.


    Observability techniques were conceived to enhance standard monitoring practices
    and achieve a holistic understanding of what happens in a software system by considering
    the behavior of not only a single application but also the relationship between
    multiple of them, as in the case of distributed architectures like microservices.
    Let us explore more of it.


    # Observability


    For quite some time, the way to build server-side systems was by developing a
    single monolith application. The focal point for all activities would be around
    that single monolith application, resulting in the creation of monitoring dashboards
    based on application metrics. These dashboards, a cornerstone of our understanding
    of the application''s behavior, were heavily relied upon by developers and other
    interested parties. They served as a window into the application''s world, providing
    crucial insights and supporting troubleshooting activities. The information obtained
    from the monitoring dashboards could trigger further investigation of application
    logs to identify an issue''s root cause.


    A problem arises when server-side systems started to be developed based on distributed
    architectures. The logic from a distributed system is scattered across multiple
    applications'
  merge: -1
  pgno: 289
- img_proc: true
  md: 'having particular responsibilities. Instead of having a single monolith application,
    several smaller applications are now working together to provide system functionalities.
    The shift in server-side software is developed, from monolith to distributed,
    also triggered a change in techniques to understand how distributed software behaves,
    which ultimately culminated in called observability.


    Observability is the ability to understand software system behaviors through structured
    events containing contextual data. It aims to enable the discovery of what, when,
    where, and what happening in a system. Such contextual data is made of high-cardinality
    and high-dimensionality data


    A structured event is a piece of data describing system behavior at a given time.
    Its attribute are arguably defined to provide as much context as possible for
    what happened when the software attempted to do something.


    High cardinality refers to uniqueness. An high-cardinality data is an event having
    attributes like the Request ID that store unique values in a system. On the other
    hand, a low-cardinality data example would be an event having the Country attribute,
    which can contain non-unique values. High-cardinality data is one of the corners
    of observability because it allows us to identify events describing system behavior
    accurately.


    High dimensionality refers to the data attributes used in an event describing
    system behavior. An event containing a comprehensive set of attributes is helpful
    in understanding system behaviors from different dimensions. For example, User
    ID, Organization ID, Region, Status, Source, or Destination can be used as measures
    when User ID is identity, Organization ID is another, and so on. An event linking
    crucial attributes may compromise the comprehension of system behaviors; that
    is why it is essential to ensure structured events based on relevant attributes.


    Structured events with high-cardinality and high-dimensionality data are the foundation
    for observability tools and techniques. In distributed systems, observability
    techniques can used to understand the flow of a request going through multiple
    applications. Next, we learn how to implement distributed tracing using Spring
    Boot and OpenTelemetry.


    # Implementing distributed tracing with Spring Boot and OpenTelemetry


    Understanding system behavior is a non-trivial challenge in distributed architecture
    systems. In such an architecture, a user request may trigger other requests on
    different applications that work together to provide system functionality. For
    example, a user sends a request to Service A, which sends a request to Service
    B, which sends another request to Service C. If something goes wrong in one of
    the three services involved in operation, we must be able to identify where the
    problem is coming from. We can do that using distributed tracing.


    Distributed tracing is the technique that helps us understand system behavior
    based on traces emitted by application. A trace represents the path a request
    takes to execute a system behavior. Every trace contains one or more spans, representing
    a unit of work. The request goes from one application to another, new spans are
    generated, carrying contextual data that lets us know the previous span and to
    which trace all the spans are associated. With traces and spans, we can better
    see what happens in a system composed of multiple applications. We have an illustration
    of what trace looks like follows:'
