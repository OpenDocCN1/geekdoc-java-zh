    in the local machine building the Docker image. The second COPY directive refers
    to the path in the container environment. The COPY directive copies files from
    the local machine to the container environment. The WORKDIR directive sets the
    container default directory from where commands are executed. Next, the ENTRYPOINT
    is used to run the container as an executable. When combined with the CMD directive,
