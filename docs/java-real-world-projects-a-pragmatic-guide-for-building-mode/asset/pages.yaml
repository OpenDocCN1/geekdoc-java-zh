  md: '# # CHAPTER 6 Improving Developer Experience with Quarkus


    # ## Introduction

    Designed to be a cloud-first framework, Quarkus presents an attractive alternative
    for creating applications to run in the cloud. Based on industry standards through
    specifications provided by projects like Jakarta EE and Microprofile, Quarkus
    helps developers build cloud-native applications by offering through its framework
    libraries supporting dependency injection, data persistence, RESTful APIs, and
    more. Quarkus manages to reconcile cloud-native and enterprise development practices
    gracefully, bringing the best of both worlds and making developers'' lives easier.
    So, this chapter introduces Quarkus and covers some of its features frequently
    used in enterprise applications running in the cloud.


    # ## Structure

    The chapter covers the following topics:

    - Assessing Quarkus benefits

    - Kickstarting a new Quarkus project

    - Building a CRUD app with Quarkus

    - Writing native applications

    - Compiling and running the sample project


    # ## Objectives

    By the end of this chapter, you will learn why Quarkus can be a viable framework
    for your next Java project. Once you grow how fluid software development can be
    when using Quarkus, you will get it to help boost developer productivity. You
    will also acquire the skills to build modern Java applications by learning the
    Quarkus way to develop enterprise software.


    # ## Assessing Quarkus benefits

    Previously, Java development was not associated with frameworks capable of empowering
    developers to build applications optimized to tap into the advantages provided
    by cloud environments. Before cloud-native development practices became widespread
    as they are today, it was common to see many java projects relying on old-fashioned
    application servers like WebSphere or WebLogic. Anyone who has ever worked with
    such technologies'
  merge: -1
  pgno: 182
- img_proc: true
  md: 'understands nontrivial is it to set up a local development environment with
    a properly configured application server.


    With the decreasing cost of computing resources, virtualization technologies like
    containers have become popular, allowing faster development. Developers embraced
    a new approach instead of packing their Java systems to run in old-fashioned application
    servers, they started to pack in Docker containers to run in Kubernetes clusters.
    However, it was not just packing the application to run in a different environment.
    Having a Java application in the cloud created opportunities and challenges that
    forced developers to think of new ways to design their applications to extract
    the most of cloud environments provide.


    Positioning itself as an alternative frameworks from an era where cloud computing
    did not exist, Quarkus was built from scratch as a cloud-first framework for Java.
    It is cloud-first because the whole framework is designed to help developers create
    applications capable of benefiting from the advantages offered by cloud technologies,
    especially containerization. Suppose you are starting a new Java project and intend
    to run it in a Kubernetes cluster. In case, Quarkus can help with features that
    optimize the execution of your application.


    One of Quarkus'' most vital points is its reliance on industry standards to provide
    the capabilities most enterprises need. Such standards are based on rigorous specifications
    determining how a future feature should work. For example, the Quarkus dependency
    injection mechanism is based on the Jakarta EE Contexts and Dependency Injection
    specification which has been continuously adjusted and improved for many years.
    Building your application on Quarkus means you are adhering to consistent and
    stable industry standards, making your application more robust.


    Regarding computing resource utilization, Quarkus has built-in native support
    backed by GraalVM. This technology allows Java applications to be compiled into
    native code instead of bytecode. Native code considerably decreases the starting
    time of Quarkus applications, making them suitable for cases where the time required
    to start an application directly impacts cloud resource costs.


    Besides cloud-first and compliant with industry standards, Quarkus is designed
    to enhance developer productivity and joy. Features like live coding let developers
    see the impact of their code changes without having to restart the application,
    saving precious developer time that would be otherwise spent stopping, recompiling,
    and restarting the application.


    Quarkus is a vast framework with many different scenarios. So, this chapter focuses
    only on the fundamental framework components used in most Quarkus projects. We
    will start by learning how to bootstrap a new Quarkus application. After we have
    our Quarkus app up and running, we will explore how to learn Quark Di manage our
    application''s objects through the CDI. Then, we learn how Quarkus interacts with
    databases using Hibernate ORM and Jakarta Persistence. Finally, we explore how
    to create RESTful endpoints with Quarkus REST.


    We will start by learning how to restart a new Quarkus project.


    # Kickstarting a new Quarkus project


    Bootstrapping a Quarkus application from scratch involves setting it up with a
    build tool like Maven or Gradle to get the proper dependencies and provide the
    correct configuration to compile and run the Quarkus project. Fortunately, we
    do not need to do it manually because we use Quarkus CLI to set up new projects
    quickly.'
