  md: '# Importance of software architecture


    In the software development life cycle, there is a moment when we, as developers,
    have enough clarity regarding the solution we want to provide some specific problem.
    In those moments, we have an understanding of user requirements that we judge
    enough to start developing the code to provide a solution. After having such an
    understanding, the most important thing we do in the early stages of any application
    development is to create a code that solves the problem. Having a dirty, though
    working code, is much better than having nothing to show. However, once we figure
    out how to produce this dirty, though working code, we need to start thinking
    about polish it, making it better structured and maintainable.


    The aim for better structured and maintainable code comes from fact that we expect
    the software to change. New features may be introduced, current features may need
    to change, and bugs will rise. We expect to revisit the code often to change it,
    whenever necessary. So, by having the awareness that the software will change
    in the future, we do not want to produce code that only solves the problems we
    have now, but we also want to have code lets us easily tackle the issues we have
    in the future. That is when we must start thinking about software architecture.


    The software architecture we decide is in our capacity to accurately, safety,
    and quickly introduce code whenever needed. A poor software architecture results
    in what is known as the big ball of mud, an overly complex application code that
    is hard to grab that works. Also, since it works, ironically, we have a problem.
    It is a problem because we software that is useful to us but a burden to its maintainers.
    So, whenever a new requirement arises, a journey into the unknown with the developer
    navigating the intricate and highly complex code by the big ball of mud of software.


    How we choose the architecture for the applications we develop is something that,
    from the author''s experience, happens as a conscious effort or spontaneously.
    When done as a conscious effort, we usually try to assess more or less which of
    application we are developing and how it should evolve. As a result of this assessment,
    we determine the foundation from which the application will be developed. On the
    other hand, when we spontaneously choose the software architecture, we make decisions
    as we go, mainly by the desire to have a working code that solves our current
    problem, sometimes putting the maintainability aspect in the second plane.


    The reality is harsh, and sometimes, we do not have the time to spend on careful
    design. We need to be pragmatic and produce working code while not neglecting
    fundamental architecture aspects that can undermine our ability to change the
    code in the future. Layered architecture is an approach that helps us achieve
    pragmatism, which we will explore further in the next section.


    # Understanding layered architecture


    The layered architecture is a software development technique that helps us application
    code based on the concerns or responsibilities of a software system. To identify
    those concerns, we make an user making system requests and the steps required
    to fulfill those requests. The first step can be for the user to interact with
    a graphical user interface or an API. In this first step, we see a situation where
    something is presented to those interested in interacting with the application.
    Presenting something through a graphical user interface or an API can be seen
    the presentation concern. In the layered architecture, such a presentation concern
    can be captured, for example, into the presentation layer.'
  merge: -1
  pgno: 359
- img_proc: true
  md: 'The second step of a user request may involve data processing, where certain
    constraints are enforced to determine what the software can and cannot do. These
    constraints are represented through business rules that establish how the software
    should behave and how the data provided by the user in step one, the presentation
    layer, will be processed. Here, we have a part of the system that is not concerned
    with presenting things, but rather, it is concerned with processing them by applying
    constraints through business rules that may validate the data provided in the
    first step. For this part of the system where we process data, we can identify
    another concern, one that can be part of the business or service layer.


    The third and final step of the user request may involve persisting or getting
    data from a database. The data layer can capture all aspects related to handling
    database entities.


    So far, we have identified the three possible layers: presentation, service, and
    data layers. It does not mean that all applications can be layered in this way.
    There is no fixed size on how many layers an application can have. The number
    of layers depends on our assessment in identifying which application''s responsibilities
    make sense to capture as a layer. That is good because it gives flexibility in
    defining as many layers as we deem necessary, but at the same time, it can cause
    trouble if we define more layers than what is needed. So, prudence is advised
    when deciding how many layers are necessary for your application. The author usually
    utilizes a few layers, capturing only the explicit system responsibilities.


    Once the layers are defined, we must establish how they will communicate with
    each other. Let us explore how to do that next:


    # A layer knows only the next layer


    In this approach, the presentation layer would know and interact, for example,
    directly with the service layer. Every interaction with the data layer would be
    intermediated through the service layer.


    ![](img/9b5739f37699f084397670714bf63edd_360_0.png)


    Figure 13.1: One layer knows only the next layer'
  merge: -1
  pgno: 360
- img_proc: true
  md: 'As depicted Figure 13.1, this approach assumes that a higher-level layer knows
    only the next-lower layer.


    Let us next check an alternative where a layer can interact with other layers.


    # A layer can know other layers


    The presentation layer would be allowed to access, for example, the data layer,
    as shown in the figure below:


    ![](img/9b5739f37699f084397670714bf63edd_361_0.png)


    Figure 13.2: One layer can interact with any low-level layer


    With this approach, we can avoid the situation where a layer is used only as a
    proxy to access another layer.

    Regardless of the layer communication approach, the layer dependency direction
    must always go downwards because a high-level layer always depends on a lower-level
    layer. For example, the presentation layer can depend on the service or data layer,
    but the service layer cannot depend on the presentation layer.


    Having grasped the fundamental ideas of layered architecture, let us now look
    at their practical application in developing a personal finance system based on
    the Spring Boot framework. Starting from the layer structure we have discussed
    so far, which is based on the data, service, and presentation layers, we begin
    by exploring the role of the data layer in handling data entities and persistence.


