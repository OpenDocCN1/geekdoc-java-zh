    The Entity annotation is mandatory to map a class to a database table. We can
    also use the Table annotation to specify the name to which the Java class is mapped.
    If we do not specify the Table annotation, the Java column name is used in the
    mapping, and that will work if both the Java class and table have the same name.
    Otherwise, the mapping will not be possible because the table name differs from
    the Java class name. Nevertheless, using the Table annotation is recommended to
    ensure code clarity.


    The class attributes are mapped to table columns. The first attribute we declare
    is the Id annotation, which is mandatory for every entity class. Note that we
    have the Column annotation describing the column and declaring that this column
    cannot be updated and does not support NULL Values. As with the Table annotation,
    the Column annotation is optional, and if we do not specify it will be attempted
    to use the attribute names against the actual table columns.


    We can use the User entity class to retrieve and persist data of the USER table.
    This entity class gives us the possibility to handle database entities in the
    same way we handle other Java classes.


