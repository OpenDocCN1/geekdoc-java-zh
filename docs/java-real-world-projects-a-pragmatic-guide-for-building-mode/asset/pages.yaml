    This section covered the fundamentals to prepare a Java application to take advantage
    of the Jakarta Persistence specification and ORM technologies like Hibernate.


    The following section will cover the approaches to providing databases while developing
    an application locally.


    # Exploring local development approaches when using databases


    When developing an application that depends on a database, we need to define how
    the database will be provided so the application can properly start and connect
    to it. In this section, we will assess three different approaches: remote databases,
    in-memory databases, and container databases.


    # Local development with a remote databases


    When developing an application that depends on a database, we can rely on remote
    databases for local development. The problem with this approach is the operational
    burden of creating and managing those databases. Also, we need to consider the
    latency issues that may occur because the local application will access the database
    through the network.


    Remote databases are employed when providing the database locally is not feasible.
    It can happen, for example, the database server is too big to run on the developer''s
    laptop.


    # Local development with in-memory databases


    Using in-memory databases is a lightweight approach to locally run and test applications
    that depend on a database. In-memory databases are temporary and last as long
    as the application runs. Once the application is terminated, the in-memory database
    is destroyed. Most in-memory database technologies, like the H2, offer the possibility
    to store the database in a file, so the data is preserved in a file instead of
    being destroyed when the application terminates.


    The problem with the in-memory database approach is that some features in the
    actual database may not exist in the in-memory database, which can be a serious
    risk that the code used in the in-memory database may not work with the actual'
  merge: -1
  pgno: 120
- img_proc: true
  md: 'database and vice versa. So, in-memory databases are recommended for prototyping
    or testing basic database functionalities.


    # # Local development with container databases


    That is the preferable approach because it allows simple provisioning of different
    database servers using container technologies like Docker. Local applications
    immediately consume databases bootstrapped with Docker.


    The choice between these three approaches will vary according to constraints like
    computing resources and the database technology used by the application.


