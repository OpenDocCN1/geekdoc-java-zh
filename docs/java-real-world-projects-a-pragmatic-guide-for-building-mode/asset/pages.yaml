- img_proc: true
  md: '# Bounded contexts


    To understand bounded contexts and why mapping them is a fundamental undertaking
    in domain-driven design, let us consider the business scenario of a personal finance
    solution. A person usually expects from a personal finance solution the ability
    to keep track of their expenses by keeping track of how much money they received,
    where, when, and what they spent their money on. Seeing the money activity through
    a monthly report is also a valuable capability of such a personal finance solution.


    When imagining a software system capable of delivering the personal finance features
    described previously, we can consider the three system responsibilities:


    +   ** Money handling:** It is responsible for storing and providing access to
    money transactions. It also allows for the organization of transactions through
    user-defined categories like gym, rent, grocery, investments, etc.


    +   ** Report generation:** It contains the rules for generating monthly money
    activity using Excel spreadsheets.


    +   ** File storage:** It provides file storage capabilities, allowing Excel report
    files to be uploaded and downloaded.


    In a traditional monolithic approach, all these three responsibilities would be
    part of the same application, packed together in the deployable unit. They would
    probably be in the same source code repository. The following figure illustrates
    the structure of a monolith application based on the three responsibilities described
    above:


    ![](img/9b5739f37699f084397670714bf63edd_340_0.png)


    **Figure 12.1:** Personal finance monolith structure


    As a monolith system, all system responsibilities related to transactions, categories,
    report rules, file uploads, and downloads belong to the same context.'
  merge: -1
  pgno: 340
- img_proc: true
  md: 'We can create a Transaction class representing money-handling activity. We
    would use attributes like amount, date, type, and currency to capture the transaction
    details. Now, imagine we need to represent a transaction in the report engine.
    We could rely on the same attributes from the Transaction class of the money handling
    class but add new attributes like totalamount, nameamount. These attributes sense
    only in the context of report generation but not in the context of money handling,
    where they are not. To avoid this situation, we could create a TransactionReport
    or a new Transaction class in a different package. However, employing different
    names would only mask a potential issue in the design: the lack of defined contexts
    where a transaction means different things depending on what context it is.


    We can use contexts to solve this problem of a lack of context and define a clear
    boundary between money-handling and report-generation contexts. In practical terms,
    that could splitting the money handling and report generation responsibilities
    into separate code repositories or modules, each containing its version of the
    Transaction class based on the context that each responsibility represents. Going
    further, the team responsible for money handling can differ from those responsible
    for report generation, which would build repository split or modularization even
    more. We can also define a dedicated bounded context for file download and upload
    because such capabilities are not directly connected to the problem of money handling
    or generating reports, as shown in the following:


    ![](img/9b5739f37699f084397670714bf63edd_341_0.png)


    Figure 12.2: Personal finance with bounded contexts


    Bounded contexts are used to establish a clear delimitation between system responsibilities
    and remove ambiguities among elements that can have the same name but convey different
    meanings depending on which context they are situated in.


    # Ubiquitous language


    Clear communication is essential for the success of any software project. On the
    one hand, we have customers expressing their needs. On the other hand, business
    analysts try to understand these and share their learning with product owners
    and developers. Failure to express or interpret an idea may have severe consequences,
    as applications may be developed based on faulty thinking. How can we bridge the
    communication gap across all stakeholders in a software project? We can employ
    the domain-driven design principle called ubiquitous language, which helps us
    define a set of terms and their meanings that accurately describe a problem domain.
    These terms must be understood the same way by developers, product owners, designers,
    business analysts, and any other relevant stakeholders.'
  merge: -1
  pgno: 341
- img_proc: true
  md: 'The primary benefit of establishing a ubiquitous language is that when software
    system is developed based on the terms defined by such language, the application
    code becomes a source of knowledge of how the business operates. By having the
    same understanding as domain experts in the problem domain, developers go to create
    application code driven primarily by business needs rather than anything else.
    There is technology integration with databases and other resources, but it is
    not the technology choices that drive the code structure.


    Coming up with an ubiquitous language can be challenging. Sometimes developers
    have no clue about the problem domain in which they are supposed to develop a
    software solution. Problem domain knowledge usually can be found in the minds
    of business analysts or experienced developers who understand how the business
    operates. Documentation can also be a source of problem-domain knowledge. However,
    there may be scenarios where people with domain knowledge no longer work in the
    company, and there is no documentation explaining the problem domain. By employing
    domain-driven design, we can use knowledge-crunching techniques to learn more
    about the problem domain.


    Knowledge crunching can range from reading books on the problem domain area to
    talking with people who can provide helpful information on how the business operates.
    We use a technique called event storming as a way for knowledge crunching. Event
    storming technique originated from domain-driven design practices and can yield
    significant results in understanding the problem domain and building ubiquitous
    language. Next, we discuss what event storming is and the benefits it can provide
    to a software project.


    # # Event storm


    Most businesses operate based on events representing the interaction of people
    with business processes. These interactions come from the business process, which
    is expected to represent a series of steps that, when executed, produce a result.
    Mapping these business processes and how they work constitutes the main goal of
    the event storming, which is a workshop session between people who do not know
    how the business works and who know. Software developers seeking problem-domain
    knowledge are the people who need to learn how the business works. On the other
    hand, those who know the business process are the domain experts.


    Interested parties, developers and domain experts, sit together to define domain
    events and to which business processes those events are associated. Learning about
    domain events lets one know what must be done to achieve business outcomes. People
    usually leave these sessions with a better understanding of how problems are solved.
    Interested parties provide the input to implement applications that benefit customers.
    Domain experts provide their expertise and validate their knowledge by walking
    through the steps of the business.


    Aware of the benefits that event storming can provide to help clearly defined
    bounded contexts, the ubiquitous language, and the domain model, we explore how
    to conduct an event storm session.


    # # Identifying event storm session participants


    In an organization that follows agile practices, you may find a product owner,
    a scrum master, a tech lead, and engineers with back-end, front-end, QA, and DevOps
    backgrounds. These people are grouped in a product-oriented team, responsible
    for one product or one specific part of a product. Product-oriented teams are
    usually accountable for the whole life cycle of a software project. By collaborating
    with business areas, they identify'
  merge: -1
  pgno: 342
- img_proc: true
  md: 'customer requirements, translate them into technical requirements through user
    stories, and implement, deploy, and actively maintain the software solution. Everyone
    involved in the software project life-cycle should participate in an event storm
    session.


    Collaboration between business areas and product-oriented teams is essential for
    the success of a project. The business areas are usually composed of non-technical
    people who understand how the business operates. These people, also known as domain
    experts, must participate in an event-storming session to help those who want
    to create a software solution but need to learn how the business operates.


    A facilitator is also necessary to conduct an event storm session. The facilitator
    is someone acquainted with domain-drive and event-storming techniques. They guide
    participants in the right direction by explaining how to identify domain events
    and map them to their business processes.


    Having learned who should be present in an event storm session, let us see how
    we can prepare it.


    # Preparing the event storm session


    An event storm session produces the best results when conducted as an in-person
    meeting in a room containing a whiteboard, pens for all participants, and sticky
    notes in orange, blue, green, and colors. In the following, we see how each note
    color should be used:


    +   - Orange stick notes describe domain events. We choose orange to emphasize
    that the domain event is a central element during the event storm exercise.


    +   - Blue stick notes are used for commands. A command specification an action
    that triggers a domain


    +   - Yellow aggregates, which describe the object or data handled by the domain
    event and command.


    +   - Green colors can represent human actors, such as users, and non-human actors,
    such as systems.


    The standard approach for conducting an event storm session is to rely completely
    on the whiteboard and physical sticky notes. However, it is possible to explore
    a hybrid approach with web collaboration tools. If we go with that approach, the
    participants need their laptops during the session.


    Asking participants to bring their laptops allows us to explore different forms
    of collaboration. We can organize an event storm and put only domain event sticks
    on the whiteboard. Once we have enough sticky notes to describe the business processes
    we are interested in, we can replicate the sticky note representation in a web
    collaboration tool like Miro or Mural. We can continue the event storm session
    in the web collaboration tool by specifying the commands, aggregates, and actors.
    The benefit of such an approach is that the event storm results can be referred
    to and easily adjusted if necessary.


    Let us learn more about domain events, commands, and aggregates.


    # Domain events


    The event storm starts with the intent to acquire knowledge about how a business
    process works. Consider, for example, a personal finance solution and how it should
    work to achieve business outcomes. One of the most critical aspects of such a
    solution is to enable people to track their expenses by adding their transactions.
    Based on that, we can define a domain event named TransactionAdded, as shown in
    the following figure:'
