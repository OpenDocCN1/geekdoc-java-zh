  md: "Logs from different sources can be centralized in one place using technologies\
    \ like Fluentd, Elasticsearch, Kibana. Let us examine the purpose of each technology.\n\
    \n# Fluentd\n\nKnown as data collection software, Fluentd is frequently used to\
    \ capture application log outputs and send them to engines like Elasticsearch.\
    \ It has been widely adopted in distributed architecture systems running in a\
    \ Kubernetes cluster.\n\n# Elasticsearch\n\nBased on the Lucene search library,\
    \ Elasticsearch is a distributed enterprise search engine often used with data\
    \ collection systems like Logstash and Fluentd. Elasticsearch stores data in indexes\
    \ and allows for the fast search of large amounts of data.\n\n# Kibana\n\nBuilt\
    \ specifically to work with Elasticsearch, Kibana is a system that provides a\
    \ user interface for managing and searching Elasticsearch data. Users can search\
    \ data using customized filters and criteria, allowing high flexibility in the\
    \ search.\n\nThe three technologies, Elasticsearch, Fluentd, and Kibana, are commonly\
    \ used together, forming the reliable and widely used EFK stack. In the next section,\
    \ we will guide you through setting up EFK stack to capture logs from the Spring\
    \ Boot applications developed earlier.\n\n# Setting up EFK stack with Docker Compose\n\
    \nThere is no need to change the application code because Fluentd captures data\
    \ using the log output produced by the application. So, ensuring proper communication\
    \ between applications generating logs and the Fluentd server is essential. We\
    \ also need to ensure Fluentd sends log to the Elasticsearch server that Kibana\
    \ uses to display logs through a user interface.\n\n+   1. Let us start by configuring\
    \ the EFK stack in the docker-compose.yml file. The code is as follows:\n\n```\n\
    version: '3.8'\n\nfluentd:\n  build: ./fluentd\n  volumes:\n    - ./fluentd/conf/fluent.conf:fluentd/etc/fluent.conf\n\
    \  links:\n    - \"elasticsearch\"\n  ports:\n    - \"24224:24224\"\n    - \"\
    24224:24224/udp\"\n\nelasticsearch:\n```"
