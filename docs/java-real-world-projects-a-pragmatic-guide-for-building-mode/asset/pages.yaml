  md: '# Conclusion


    Although Quarkus is a new framework compared to Spring, it is evolving quickly
    and has an engaging community. Quarkus is built on and leverages solid industry
    standards like those provided by Jakarta EE, a set of specifications for enterprise
    Java applications, and Microprofile, a set of specifications for microservices.
    These standards ensure that Quarkus is a viable choice for developing enterprise
    cloud-native applications. As we see in this chapter, starting a new Quarkus project
    is just a matter of running a single command with the Quarkus CLI that creates
    a fully working Quarkus application. We learned how to inject support for dependencies
    using Quarkus DI. Dealing with databases is also easy, with extensive support
    for different database technologies and the pleasant Panache library that lets
    us conveniently handle Jakarta Persistence entities. We closed this chapter by
    exploring how simple creating an API with Quarkus REST.


    Quarkus provides a no developer experience by simplifying things that took precious
    time. With Quarkus, developers can focus more on developing their solution than
    on the technical details that are taken care of by Quarkus, required to enable
    their solution. This includes features like live coding, which allows developers
    to see changes in their code immediately without having to restart the application,
    and fast startup times, which enable quick iteration and testing of code changes.


    In the next chapter, we look further into Java enterprise development by learning
    how to create enterprise applications using the Jakarta EE. We will learn the
    Jakarta EE specification structure and how it defines standards that ensure the
    development of robust and reliable applications. We will also explore MicroProfile,
    a specification derived from the Jakarta EE that enables the development of microservices.'
