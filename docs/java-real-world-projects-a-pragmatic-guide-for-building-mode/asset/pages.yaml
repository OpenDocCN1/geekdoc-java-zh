    Aspects, beans, and dependency injection configure the building blocks of most
    Spring Boot applications. Now that we understand how these building blocks work,
    let us explore how to bootstrap a new Spring Boot project.


    #  Bootstrapping a new Spring Boot project


    As part of the Spring Framework ecosystem, Spring Boot lets developers quickly
    bootstrap new applications. The Spring Boot framework is built following the convention-configuration
    idea. This is based on observing how most Spring applications are developed. These
    observations allowed Spring maintainers to identify specific standards shared
    across those applications; these standards are based on how given Spring component
    would be configured. The architects found out that most of the time, the configuration
    of these components would be the same in many different Spring applications. So,
    why not use this configuration as the default convention when Spring Boot is used?
    Hence, this convention-configuration principle ended being the cornerstone of
    the Spring Boot.


    You get an application with most of its configuration already provided by Spring
    Boot, based on the convention of how most applications are configured. Instead
    of configuring the application from scratch, you only only change parts of the
    configuration that are relevant to your project.


    Let us explore by learning to initialize a new Spring Boot project.


    #  Creating a Spring Boot project with Spring Initializr


    To start a new Spring Boot project, you can rely on the Initializr, which is available
    online on the website https://start.spring.io/ as an IDE plugin (for example,
    IntelliJ Ultimate offers it) and as a command line interface (CLI) application
    which you can run from your machine. You can also start a new Spring Boot project
    by manually specifying the Spring Boot dependencies in your Maven or Gradle project.


    This book explores the CLI, which is compatible with Windows, Mac, and Linux operating
    systems. Installing the Initializr CLI is outside the scope of this book, but
    you can find instructions on how to install it at https://docs.spring.io/spring-boot/current/reference/html/cli.html.


    The following is how we can create a new Spring Boot project using the Initializr
    CLI:


    ```

    $ spring init --build=maven --java-version=21 --dependencies=sample-project

    ```


    Using archive at start.spring.io


    Project extracted to /home/nandr4ck/sample-project/


