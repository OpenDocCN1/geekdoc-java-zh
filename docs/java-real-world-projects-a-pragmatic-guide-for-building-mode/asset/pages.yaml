    Building Enterprise Applications with Jakarta EE and MicroProfile


    # Introduction


    Developing enterprise-grade applications in Java involves following the standards
    and best practices that contribute to the robustness, stability, reliability,
    and maintainability requirements that often appear when building mission-critical
    applications. Such requirements can be met by relying on the specifications provided
    by the Jakarta EE, a project that prescribes how fundamental aspects of enterprise
    applications, like persistence, dependency injection, transactions, security,
    and more, should work. Although extensive in its coverage of the things enterprise
    application requires, the Jakarta EE does not contain specifications that support
    the development of cloud-native applications based on highly distributed architectures
    like microservices. To fill this gap, the MicroProfile specification helps developers
    build modern enterprise applications that are better prepared for cloud-native
    environments.'
  merge: -1
  pgno: 204
- img_proc: true
  md: 'This chapter teaches us how powerful Jakarta EE and MicroProfile are when combined
    to build modern enterprise Java applications.


    # Structure


    The chapter covers the following topics:


    +   - Overlooking Jarkarta EE

    - Starting a new Jakarta EE project

    - Building an enterprise application with Jakarta EE

    - Adding microservices and cloud-native support with MicroProfile

    - Compiling and running the sample project


    # Objectives


    By the end of this chapter, you will be able to develop cloud-native enterprise
    applications using the Jakarta EE and MicroProfile specifications. This chapter
    shows how the technologies derived from both specifications support the development
    of applications that harness the time-tested enterprise features provided by Jakarta
    EE while tapping into the cloud-native development capabilities offered by MicroProfile.


    # Overview Jakarta EE


    Jakarta EE is a continuation of a project officially launched in 1999 under the
    name of Java 2 Enterprise Edition (J2EE). The vision behind this project was to
    provide a set of specifications to support the development of Java enterprise
    applications. These specifications would target technologies like databases, messaging,
    and web protocols such as HTTP and WebSockets, which were common in enterprise
    projects.'
  merge: -1
  pgno: 205
- img_proc: true
  md: 'Instead of reinventing the wheel by defining how to deal with those technologies,
    developers could rely on the standards provided by the J2EE specifications. Relying
    on the specifications would also grant some flexibility and vendor lock-in protection
    because multiple vendors offered implementations of the same J2EE specifications.


    Sun Microsystems, later acquired by Oracle, was responsible for the first versions
    of the J2EE specifications. In 2006, the project was renamed to Java EE until
    2020, when Oracle decided to turn Java EE into an open-source project by giving
    its governance to the Eclipse Foundation, which renamed it to Jakarta EE. Oracle
    decided to give up on Java EE because it could not catch up on the innovations
    and features provided by other frameworks like Spring. Many developers regarded
    Java EE as too complex and less productive compared to its alternatives, which
    would deliver the same and even more functionalities more straightforward.


    However, even with its reputation as complex and heavyweight, which was to a certain
    extent lost after the Java EE 5 version that introduced the annotation-based configuration
    as an alternative to the XML-based one, Java EE found strong adoption across many
    industries, such as banking and telecommunication, that relied on the Java enterprise
    to enable their most critical operations. The specifications provided the stability
    and robustness that big corporations needed to ensure the health of their businesses.


    Many things have changed since the first J2EE/Java EE version until its latest
    incarnation, the Jakarta EE. Some specifications were removed because they no
    longer make sense today, and other specifications evolved to reflect the needs
    of modern software development. Although new frameworks and ways to develop enterprise
    Java software have appeared, some principles and ideas from Jakarta EE remain
    relevant and are still in use today.'
