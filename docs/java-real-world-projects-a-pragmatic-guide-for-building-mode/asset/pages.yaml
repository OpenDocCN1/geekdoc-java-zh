    # Compiling and running the sample project


    As a sample project, we have a Java application called Remote File Converter.
    It is a dummy converter that downloads files from the internet and converts them
    to different file types. This application illustrates the usage of sealed classes,
    pattern matching, string templates, and virtual threads.


    You can clone the application source code from the GitHub repository at https://github.com/bpbpublications/Java-Real-World-Projects/tree/main/Chapter%2002.


    You need the JDK 21 or above and Maven 3.8.5 or above installed on your machine.


    To compile the project, go to the Chapter 2 directory from the book''s repository.
    From there, you need to execute the following command:


    ```

    $ mvn clean package

    ```


    Maven will create a JAR file that we can use to run the application by running
    the following command:


    ```

    $ java -jar target/chapter02-1.0-SNAPSHOT.jar

    ```


