    # Introducing Kubernetes


    Kubernetes started as an internal Google project called Borg, which used to operate
    containers on a large scale. Google eventually open-sourced the project and renamed
    it Kubernetes. It is considered the most used container orchestrator in the market.
    Kubernetes can operate containers in small devices like Raspberry PI or be used
    on top of an entire data center dedicated to containers.


    Kubernetes has become popular, especially in large enterprises, because it provides
    a reliable platform for managing and running containers. Organizations found Kubernetes
    to be a mature technology capable of hosting mission-critical applications with
    high availability and fault tolerance.


    The decision to use Kubernetes comes when operating containers solely with Docker,
    for example, is insufficient. Docker alone does not provide a high-availability
    solution for distributing container workloads across multiple cluster servers.
    Docker cannot dynamically auto-scale containers based on CPU or memory usage.
    Applying a load balancing mechanism on container traffic is not possible with
    just Docker; however, it is possible when using Kubernetes.


    So, Kubernetes gets the core container technology and surrounds it with additional
    components that make'
  merge: -1
