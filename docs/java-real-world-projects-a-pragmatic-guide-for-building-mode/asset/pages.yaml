  md: 'loops. Imperative programming is predictable, straightforward to understand,
    and simple to debug. Most Java programs are written using imperative programming.


    A critical challenge with imperative programming is when we need to deal with
    applications doing many blocking IO operations. We call blocking all system calls
    that need to wait for data from an external source, like accessing a database
    or waiting for an API to respond. In the upcoming section, we will assess how
    blocking IO operations can cause trouble and decrease the application’s processing
    throughput.


    # Platform threads and blocking IO operations


    Suppose you have a back-end server application, an API, that is responsible for
    doing expensive calculations using data from a database. These calculations are
    processed inside a traditional platform thread. Now consider the scenario where
    the API receives 100 concurrent requests. It means that 100 threads must be provided
    to serve each request. Let us say we need 20 MB of RAM to create each thread.
    So, we need at least 2 GB RAM to process all those requests. After creating a
    thread, we make a database call to perform the calculation and await a response.
    We say a thread is blocked when it is waiting for a response. The application
    will only continue execution once it gets a response or times out. Now, consider
    that every thread usually takes 20 seconds to get a response from the database,
    and during this interval, more additional requests arrive at the API. If no more
    than 2GB RAM is available in the machine running our application, we will not
    be able to create threads because there is no more available memory. So, those
    additional requests will wait until the first requests finish and memory is released
    to allow the creation of new platform threads. The following figure describes
    the scenario:'
