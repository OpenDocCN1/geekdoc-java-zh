  md: '# Packing, deploying, and running Jakarta EE applications


    Jakarta EE applications can be packed as Java Archive (JAR), Web Archive (WAR),
    or Enterprise Archive (EAR). Although they have different file name extensions,
    such as .jar, .war, and .ear, all these file types share the same internal file
    structure based on the .jar file. Next, we explore the purpose of each of these
    files.


    # Java Archive


    We use .jar files to pack classes containing enterprise beans, which constitute
    the enterprise application''s business rules code.


    # Web Archive


    Classes representing web components like servlets and other web resources, including
    HTML pages and images, are packaged in a WAR file. JAR files containing enterprise
    beans can also be bundled into a WAR file. So, in this packing structure, we can
    have both web and enterprise components packed into a single WAR file.


    # Enterprise Archive


    It is possible to put all the related modules of an enterprise application into
    an EAR file, which allows a packing structure based on JAR files containing enterprise
    beans and WAR files containing web components.


    Once you have packaged your enterprise application, you can deploy it into a compatible
    server. Fully compliant Jakarta EE projects run on certified Jakarta EE servers,
    which adhere to one of the Jakarta EE Platform or Profile specifications. Applications
    servers like Oracle WebLogic, RedHat JBoss, and Payara are examples of certified
    Jakarta EE servers. It is also possible to deploy WAR and JAR files into'
  merge: -1
  pgno: 215
- img_proc: true
  md: 'non-certified servers like Tomcat, which does not implement all the required
    Jakarta EE specifications but provides enough capabilities to host enterprise
    Java applications.


    Jakarta EE continues evolving to remain relevant as a solid platform for developing
    enterprise applications. In this section, we covered only the surface of this
    vast project, which offers a standard for creating Java applications through its
    specifications. Let us now explore another ramification of Jakarta EE: MicroProfile,
    a project that targets microservices development.


    # Introducing MicroProfile


    Over the years, we have seen significant changes in the approaches to developing
    Java enterprise applications. With decreased computing costs and the popularization
    of cloud computing technologies like containers, developers started to think in
    different ways to design enterprise systems. Instead of developing a single monolithic
    application to run in heavyweight application servers, developers are now exploring
    distributed architectures based on smaller applications, the so-called microservices,
    that run on containers orchestrated by Kubernetes.


    Organizations seeking to improve their ability to respond quickly to customer
    needs have widely adopted distributed architectures, like microservices. The main
    argument is breaking a monolith system into smaller applications, such as microservices,
    helps to tackle the maintainability and scalability issues when a monolith system
    becomes too big. New challenges arise for the Java developer tapping into the
    benefits of cloud-native applications based on the microservices architecture.
    It is essential to understand how Java applications behave when running inside
    containers. Knowing how to implement monitoring and observability capabilities
    becomes a critical development activity to ensure all components of a distributed
    system are running as'
  merge: -1
  pgno: 216
- img_proc: true
  md: 'expected. It is also fundamental to know how the components of a distributed
    system specifications communicate with each other.


    It is not trivial to ensure that a Java distributed system based on multiple microservices
    applies the techniques and technologies to leverage all the benefits provided
    by cloud environments. So, MicroProfile proposes, through its specifications,
    a standard for developers aiming to create Java microservices that run in cloud
    runtimes based on container technologies like Docker and Kubernetes.


    MicroProfile is similar to Jakarta EE in that it prescribes how to do things in
    a Java enterprise system. However, it differs by providing a set of specifications
    explicitly tailored for designing enterprise applications using cloud-native development
    techniques and technologies.


    To better understand how MicroProfile works, let us explore its specifications
    further.


    # Exploring MicroProfile specifications


    To guide the development of Java microservices, the MicroProfile comprises two
    specification sets: the Jakarta Core Profile specification and the MicroProfile
    specification. Next, we check all the specifications of the MicroProfile 6.1 release.


    # Jakarta EE Core Profile specifications


    MicroProfile relies on the Jakarta EE Core Profile specifications as the foundation
    for the development of cloud-native applications, listed as follows:


    +   * Jakarta RESTful Web Services 3.1

    * Jakarta JSON Processing 2.1

    * Jakarta JSON Binding 3.0'
  merge: -1
  pgno: 217
- img_proc: true
  md: '+   - Jakarta Interceptors 2.1

    - Jakarta Enterprise Beans Lite 4.0

    - Jakarta Dependency Injection 2.0

    - Jakarta CDI Lite 4.0


    The Core Profile specifications constitute the backbone of any Java enterprise
    application running in the cloud. We can use the Jakarta RESTful Web Services
    3.1 specification to construct API endpoints capable of handling JSON payloads.
    The Jakarta JSON Processing 2.1 and Jakarta JSON Binding 3.0 specifications provide
    JSON support. Jakarta Dependency Injection 2.0 and Jakarta CDI Lite 4.0 specifications
    offer a robust mechanism for handling object dependencies in an enterprise application.


    Complementing the Jakarta EE Core Profile specifications, we have the MicroProfile
    specifications.


    # MicroProfile specifications


    A typical Java microservice application may require monitoring, observability,
    configuration, security, and other essential capabilities. The MicroProfile covers
    the following capabilities with a set of specifications for cloud-native development
    practices:


    +   - MicroProfile Telemetry 1.1

    - MicroProfile OpenAPI 3.1

    - MicroProfile Rest Client 3.0

    - MicroProfile Config 3.1

    - MicroProfile Fault Tolerance 4.0

    - MicroProfile Metrics 5.1

    - MicroProfile JWT Authentication 2.1

    - MicroProfile Health 4.0'
