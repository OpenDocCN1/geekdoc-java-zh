    The ArrayList** is the way to go if you are looking for a completely mutable list.
    It allows adding and removing elements:


    ```

    List<String> listOfElements = new ArrayList<>();

    listOfElements.add("Element 1");

    listOfElements.add("Element 2");

    listOfElements.remove("Element 1");

    System.out.println(listOfElements.size()); // 1

    ```


    In the example, we remove a list item by providing an object of type String as
    a parameter, "Element 1". It is also possible to remove a list item by specifying
    its index position:


    ```

    List<String> listOfElements = new ArrayList<>();

    listOfElements.add("Element 1");

    listOfElements.remove(0);

    System.out.println(listOfElements.size()); // 0

    ```


    Using index instead of object equality is always preferable regarding performance.
    When we remove items from the list by passing an object for comparison, we must
    traverse all the list objects from beginning to end until we identify an object
    that matches. This process takes up computing time. When passing the index, it
    just removes the object in the specified position.

    Lists do not complain if you add duplicates:


    ```

    List<String> listOfElements = new ArrayList<>();

    listOfElements.add("Element 1");

    listOfElements.add("Element 1");

    System.out.println(listOfElements); // [Element 1, Element 1]

    ```


    Adding duplicates to a list is okay because there is no mechanism to ensure uniqueness
    across the list contents. Now, if we want a data structure that excludes duplicates,
    **java.util.Set** is the proper collection.


