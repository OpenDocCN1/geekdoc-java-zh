- img_proc: true
  md: '# Introducing hexagonal architecture


    Back-end applications are typically designed to work in cooperation with other
    systems. The interaction with other systems and their underlying technologies
    is a fundamental aspect of software development as it defines how application
    dependencies will be provided. We can describe some of the application''s dependencies
    as follows:


    +   - The database technology we use to store the data.

    - The message broker system we use to publish and consume messages.

    - The scheduler system we use to schedule tasks.


    These dependencies can influence how the software is designed. Applications that
    heavily rely, on a specific relational database technology can have business logic
    code mixed with code that deals with details of database technology. That is not
    an issue unless the underlying database technology changes, forcing a code refactoring
    to ensure the business logic code will work with the new database technology.
    How can we tackle this? Employing hexagonal architecture may be the answer. Let
    us check the reason.


    Alister Cockburn conceived the hexagonal architecture as a solution to develop
    where the business logic code can evolve without dependency on external technology
    details. Assuming that the business logic code represents the most important,
    often irreplaceable, asset in a software system, the hexagonal architecture application
    is designed to ensure the business logic code is shielded by any changes in the
    code responsible for dealing with any technology dependency. Using hexagonal architecture
    allows us to develop more change-tolerant applications because we can make these
    applications work efficiently with different technologies. This idea of ease of
    working with any technology can also be captured by the alternative name of hexagonal
    architecture, also known as ports and adapters architecture, where the ports express
    the behavior an application and the adapters express the different ways to trigger
    such behaviors.


    You may be wondering why hexagonal architecture is named such. Its name comes
    from the idea that the hexagon sides represent the boundaries between the application
    and the other systems with which it interacts. The hexagon form was used to differentiate
    from other architectural pictures, which often used to represent users and systems,
    and because hexagons were easier to draw than pentagons or heptagons, Each hexagon
    acts as an input or output adapter. It does not mean, however, that a hexagonal
    application must have only six adapters, as the number of sides makes it possible
    to be connected to as many adapters as needed with different technologies. The
    adapters play a fundamental role by communicating between the hexagonal application
    and all systems it needs to interact with to conduct its activities.


    To grasp the hexagonal architecture ideas, we explore an approach where the hexagonal
    system is divided into the domain, application, and framework hexagons. The domain
    hexagon oversees the domain model of the software system. The application hexagon
    handles data in a technology-agnostic way to enable the domain model from the
    domain hexagon. Finally, the framework hexagon provides the mechanisms for external
    systems to interact with the hexagonal application. The following figure provides
    a high-level representation of a hexagonal application:'
  merge: -1
  pgno: 378
- img_proc: true
  md: '![](img/9b5739f37699f084397670714bf63edd_379_0.png)


    Figure 14.1: The hexagonal application


    On the driver side, we have systems that can trigger behaviors in the hexagonal
    application. On the driven side, we have systems on which the hexagonal application
    depends. We can also use the primary and secondary systems instead of driver and
    driven. In the upcoming weeks, we will explore the driver and driven sides further.


    The domain, application, and framework hexagons each have their responsibilities
    in the hexagonal system. Let us start exploring such responsibilities with the
    domain hexagon.


    # # The domain hexagon


    When starting a new project, developers may want to think first in technical terms.
    They may consider which software development framework best meets the project''s
    needs, database technology is more adequate, caching system on provide better
    performance, and so on. These are all valid concerns which must be carefully addressed
    to ensure the development of good applications. However, when these concerns are
    addressed at the beginning of a software project, they can influence the development
    process to the point where the code developed is driven more by the technologies
    used to solve business problems than the business problems themselves. This is
    an application tailored to a specific technology stack, giving little flexibility
    for technology changes if necessary. Applications optimized to work with a well-defined
    technology stack is not an issue if you are not expecting technology changes.
    If however, the concerns we assessed previously regarding the technology choices
    of an application should be postponed to the later stages of software.


    What would we address these technology choices to a later stage in a software
    development project? First, we address the problem domain of the application we
    want to develop. By start creating code that contains the logic responsible for
    solving issues presented by the application''s problem domain. We should strive
    to do that in the most technologically agnostic way. The author calls it agnostic
    because such a code must not depend on frameworks or external libraries that can
    influence how the business logic works.


    The code responsible for solving business problems lives in the domain hexagon.
    This code can be arranged in any way; however, the domain-driven design technique
    is recommended because it provides the blueprint to create the domain model code,
    which'
  merge: -1
  pgno: 379
- img_proc: true
  md: 'contains all logic that solves business problems without relying on external
    dependencies.

    The following figure shows which elements are found inside the domain hexagon:


    ![](img/9b5739f37699f084397670714bf63edd_380_0.png)


    Figure 14.2: The domain hexagon


    Relying on domain-driven design, a domain hexagon can contain entities, value
    objects, specifications, and other domain-driven design elements that express
    through code the domain model of a system. Next, we will examine some of the most
    essential domain-driven design elements we can use in hexagonal architecture.


    # Entities


    In domain-driven design, we use entities to describe everything that can be uniquely
    identified. For example, a person, a user, or an account can be uniquely identified
    and modeled as entities in a hexagonal application. These domain entities should
    not be misidentified with database entities. Instead, such domain entities should
    be designed and inspired by our knowledge of the problem domain we are dealing
    with. We are not concerned about what technologies we will use to handle the entities
    on the domain hexagon. Instead, our focus is on the entity in the most straightforward
    way possible without depending on data or behaviors from outside of the application.
    When considering entity definition from the Java development perspective, entities
    are defined as Plain Old Java Objects (POJO), classes that rely only on the standard
    Java API and nothing more.


    Entities carry data and behavior. For example, an account entity can use email
    and password as data attributes. It can also have a method resetPassword as one
    of its behaviors.


    # Value objects


    Contrary to entities, value objects are not uniquely identifiable. We can use,
    however, value objects as attributes to describe an entity. Implemented as POJs
    in a Java application, value objects contribute with the domain hexagon purpose
    of solving business problems without depending on data and behaviors provided
    by third parties. Because of its immutable nature, a value object can be implemented
    as a record in Java. However, the author recommends using ordinary classes if
    the value object contains behaviors. The value objects are pure classes that compose
    classes inside the domain hexagon. Instead, of using a String or UUID class to
    define an ID attribute, we can create an ID value object containing the data and
    behaviors that accurately capture the identification needs of the problem name
    we are working with.


    # Specifications


    Enterprise applications are designed with a real business in mind. Specifications
    are the domain-driven design technique that lets us capture the rules for solving
    a system''s business problems. In a hexagonal architecture application, specifications
    are considered the butter in the bread because they carry the most critical asset
    of an'
  merge: -1
  pgno: 380
- img_proc: true
  md: 'application, the codified business rules that solve real-world problems. Specifications
    are essential because understanding business rules can be challenging, requiring
    knowledge and experience on how a business operates. As entities and values objects,
    specifications are also modeled as POJOs without dependency on data or behaviors
    provided by third parties.


    Other domain-driven design elements include aggregate and domain systems; however,
    entities, value objects, and specifications are enough to start implementing the
    domain hexagon.


    The domain hexagon is the foundation for the hexagonal system because it contains
    all the fundamental data and behaviors on which all other system parts depend.
    However, the domain hexagon alone is insufficient to provide a working system.
    The domain hexagon becomes powerful when combined with other hexagonal architecture
    elements, such as ports and adapters that adapt to the domain hexagon to provide
    fully functional features. However, it must be reinforced that the domain hexagon
    must evolve without any dependency on technological details. Such a requirement
    is necessary to achieve the essential outcome of shielding the code responsible
    for solving business problems from the code responsible for providing the technology
    to solve those problems.


    Let us explore how the application hexagon provides data and behaviors that work
    based on the domain model provided by the domain hexagon through input and output
    ports.


    # # The application hexagon


    Back-end systems may be expected to receive and process data from users or other
    applications. Also, depending on the scenario, such back-end systems may need
    to send and retrieve data from different systems, such as databases or message
    brokers. On the one hand, we have actors interacting with a system by sending
    request payloads and triggering behaviors through the system API. On the other
    hand, we have the back-end system interacting with other actors responsible for
    providing the dependencies required to make the back-end system work. We can identify
    these two sides as the driver and driven sides.


    The driver side comprises users and systems that interact with the hexagonal application,
    while the driver side corresponds to the systems on which the hexagonal application
    depends. Aware of this dynamic, we can affirm that the functionalities provided
    by a hexagonal application can be triggered by the driver side, while the dependencies
    to enable these functionalities come from the driver side. What lives on the driver
    side''s side is controlled and driven by the hexagonal application itself. We
    can implement input and output ports in the application hexagon to prepare a system
    to handle driver and driven operations. Also, we can employ use cases acting as
    abstractions for the input ports. When putting everything together, we can have
    input ports, output ports, and use cases as the elements that comprise the application
    hexagon, as shown in the following figure:'
  merge: -1
  pgno: 381
- img_proc: true
  md: '![](img/9b5739f37699f084397670714bf63edd_382_0.png)


    Figure 14.3: The application hexagon


    When we start developing the application hexagon, the domain hexagon should be
    already implemented. The application hexagon depends on the domain hexagon to
    process the driver and driven operations. So, we need to determine which kind
    of data the hexagonal application is expected to receive from the driver side
    and how such data should be processed, considering the possible constraints provided
    by the domain hexagon. The hexagonal application may need to retrieve data from
    somewhere else to process the data received from the driver side. Such concerns
    about how the data will be received, processed, or persisted can be expressed
    technologically through input ports, output ports, and use cases. Let us proceed
    by using use cases.


    # Use cases


    One of the advantages of a software system is the ability to automate things that
    would instead be done manually if the software did not exist. Sending a message
    to a friend using a letter instead of email. To send a letter, we must write the
    message on paper, put it into an envelope, paste a postal seal, and drop it in
    a mailbox. All our manual tasks we must perform to send a physical letter. Now,
    imagine the scenario of sending an email. The system responsible for it must provide
    the means to capture the message digitally by a user. Then, it must communicate
    with an SMTP server to send the email message to its destination. The ability
    to store the email message in the system memory and then send it using an SMTP
    server is an automated task provided by the software that has email delivery as
    one of its use cases.


    The use case represents the intent of an actor using the system. Such an actor
    can be a human or other system. In hexagonal architecture, use cases can be defined
    as abstractions, through interfaces or abstract classes, that represent the application
    A use case may contain the operations to achieve a goal. In the case of an email
    delivery system, we can have a Java interface with two abstract methods called
    `sendEmail(String message)` and `getSMTPServer()`, that when together, let the
    system send email messages.


    If the use case is an abstraction, what implements it? The input ports are responsible
    for that. Let us check the input ports.


    # Input ports


    Input ports describe how a use case is filled. Input ports are responsible for
    handling data provided by clients sitting on the driver side of a hexagonal application.
    Such data can be processed based on the constraints provided by the domain hexagon.
    If necessary, the input port can use output ports to persist or retrieve data
    from systems on the hexagonal application''s driven side.


    All operations in the application hexagon are defined without specifying the technology
    details of systems from both the driver and driven sides of the hexagonal application.
    Designing the system without providing the technology details in the application
    hexagon'
