  md: 'Released first in 2012, Prometheus is an open-source monitoring and alerting
    software that works on top of system-generated metrics. We can use Prometheus
    to monitor the infrastructure where applications are running by checking, for
    example, how much CPU, memory, and disk are being used. We can also use Prometheus
    to monitor application behaviors by capturing metrics through instrumented applications.
    It has been used by many organizations worldwide, serving a robust monitoring
    solution that can be easily integrated into cloud-native environments.


    Prometheus gained popularity through its simple yet powerful features. It allows
    us to store and query metrics data in a time-series database. Prometheus also
    relies on an alerting mechanism called **Alertmanager**, which lets us trigger
    alerts in various places, including email, phone, and chat systems.


    Prometheus is a prevalent component of most enterprise projects, supported by
    well-known frameworks, including Spring Boot, Quarkus, and MicroProfile. Understanding
    how Prometheus works and how it can be integrated into existing and new applications
    is critical for anyone interested in taking their monitoring machinery to the
    next level. Anyone running applications in production without any monitoring runs
    into a severe risk of missing crucial system information that could be used to
    avoid unwanted things or prevent something from becoming worse. That is why instrumenting
    applications with metrics and employing Prometheus to capture these metrics is
    the first step to mitigate the risk of system failure.


    We start our Prometheus exploration by learning about its architecture and how
    it works with other systems through exporters that expose metrics to dashboard
    systems like Grafana can consume. After learning the Prometheus architecture,
    we will install and configure it, enabling us to explore PromQL, a query language
    that lets us get answers from the metrics stored by Prometheus.


    # Learning the Prometheus architecture


    The Prometheus architecture''s main component is the server process that scrapes
    metrics from monitoring targets. It is worth noting that Prometheus is a pull-mode
    monitoring tool, which means it pulls monitoring data from the predefined systems
    through its configuration. The monitoring data, stored as metrics is made available
    through HTTP API endpoints that alert and dashboard systems can use. In the following
    figure, we have a high-level representation of the Prometheus architecture:'
