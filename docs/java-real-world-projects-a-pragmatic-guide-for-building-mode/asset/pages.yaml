  md: '# Structure


    The chapter covers the following topics:


    +   - Understanding container technologies

    - Introducing Kubernetes

    - Dockerizing a Spring Boot, Quarkus, and Jakarta application

    - Deploying Docker-based applications on Kubernetes

    - Compiling and running the sample project


    # Objectives


    By the end of this chapter, you will know how to package Java applications into
    Docker images and deploy them in a Kubernetes cluster. To serve as a solid foundation
    for your practical skills, you will also acquire fundamental knowledge about cloud
    technologies like virtualization and containers, allowing you to use such technologies
    properly according to your project''s requirements.


    # Understanding container technologies


    Although industries such as banking, insurance, and governmental organizations,
    to name a few, still rely on traditional application servers to run Java applications,
    new java projects today run in containers. Containers are not new technology.
    However, they matured to the point that they became an attractive technology for
    developers seeking better ways to deploy and run their applications.


    To understand containers, we must first understand virtualization because containers
    are just one of the possible ways to virtualize computer resources. Virtualization
    comes from the desire to run software in an environment that'
  merge: -1
  pgno: 246
- img_proc: true
  md: 'wholly or partially represents a real computer. There can be many motivations
    to run applications in virtualized environments. For example, Linux users may
    employ virtualization to use software available only to Windows. Tools like Wine
    emulate Windows in Linux environments and can solve compatibility problems. Still,
    sometimes, there is no way to run a specific software other than in the operating
    system it was originally designed for.


    Another virtualization case is running legacy applications that work only in old
    operating systems. Running old operating systems on new hardware is sometimes
    impossible due to a lack of driver support and other issues. Virtualization helps
    those who must run critical legacy systems that cannot be easily rewritten to
    run on modern platforms. We can also use virtualization as a mechanism to make
    an application portable. The virtualized system can provide all the dependencies
    for an application needs to run correctly. So, instead of delivering only the
    application, we can provide it bundled with the virtualized environment where
    it runs.


    Going next, we explore virtualization methods and technologies, including container-based
    virtualization.


    # Introducing virtualization


    Virtualization is the core technology enabling cloud-native environments. What
    we call cloud computing nowadays is only possible due due to the ability to virtualize
    computing resources. Knowledge of fundamental virtualization concepts can help
    us better decide how to run Java applications in cloud environments. Let us start
    exploring the full virtualization concept.


    # Full virtualization'
  merge: -1
  pgno: 247
- img_proc: true
  md: 'Full virtualization is the technique of running software in an environment
    that reproduces a real computer’s behaviors and instructions. It allows the complete
    virtualization of computer resources like CPU and memory. All things provided
    by computer hardware are virtualized, enabling the execution of software entirely
    unaware it is executing in a virtualized environment.


    A host machine can provide full virtualization with support for hardware-assisted
    virtualization technologies like Intel VT-x or AMD-V. The host machine runs hypervisor
    software responsible for creating virtual machine instances, also known as guests
    of the host machine. KVM, VMware, and VirtualBox are some of the hypervisors that
    provide full virtualization. When a machine is fully virtualized, it lets us install
    an operating system that is different from the operating system running on the
    host machine. For example, a Linux host machine can have Windows guest machines.


    Cloud providers rely on full virtualization technologies to provide virtual servers
    as an **Infrastructure-as-a-Service (IaaS)** solution. These virtual servers run
    on physical servers and are managed by hypervisor software.


    When organizations started to move their infrastructure to the cloud, virtual
    servers allowed those organizations to keep running their legacy and modern applications.
    An important feature of virtual servers is the flexibility to adjust computing
    resources like CPU and memory according to user demand. Organizations moving to
    the cloud would no longer struggle with over—or under-provisioning computing resources
    through physical hardware because these resources could now be easily managed
    through the virtualization hypervisor.


    Full virtualization is excellent for running any application. Modern virtualization
    technologies make the performance of'
  merge: -1
  pgno: 248
- img_proc: true
  md: 'applications running in virtualized servers practically the same as if they
    were running in bare metal servers. However, it comes at a cost. Full virtualization
    is a costly way to visualize software execution because it requires virtualizing
    all computer components. There is a cheaper alternative to full virtualization
    called paravirtualization. Let us explore it next.


    # Paravirtualization


    Partial virtualization, also known as paravirtualization, is possible when the
    host machine executes some instructions of the virtual guest machine. This implies
    that the virtualized operating system needs to be aware that it is running in
    a virtual environment. The paravirtualization technique relies on the cooperation
    of both host and guest machines in identifying which instructions are better executed
    by the virtualized hardware and which others the real hardware better execute.
    Such collaboration between host and guest machines enhances performance in the
    paravirtualized environment.


    A paravirtualization hypervisor requires a guest virtual machine running an operating
    system that can communicate with the hypervisor. So, the operating system needs
    to be modified or provide special drivers in order to be compatible with paravirtualized
    environments. That can be a limitation if you want to run applications in an operating
    system that does not support paravirtualization.


    Paravirtualization is cheaper than full virtualization but still implies significant
    costs because it consumes valuable computing resources to provide a functional
    virtualized environment. Xen and Hyper-V are some of the available paravirtualization
    technologies cloud providers may use to offer virtualized servers and other cloud
    solutions backed by paravirtualization.'
  merge: -1
  pgno: 249
- img_proc: true
  md: 'Full virtualization and paravirtualization techniques are extensively used
    to run Java applications. Such Java systems can run in application servers executing
    in virtualized environments. Kubernetes cluster nodes are provisioned using virtual
    servers. So, these virtualization techniques are awesome for running Java applications.
    Although they can make Java applications portable, it may be cumbersome to package
    and distribute those applications bundled into full or paravirtual machine images.


    Let us explore a virtualization technique that allows virtualizing the structure
    of an operating system, which enables a convenient way to package applications
    and their dependencies into a single, leaner, virtualized environment.


    # Container-based virtualization


    Also known as OS-level virtualization, container-based virtualization consists
    of virtualizing components of an operating system. In this approach, the guest
    virtualized environment shares the same kernel used by the host machine. This
    container virtualization does not go as deep as full virtualization or paravirtualization,
    which virtualizes hardware instructions to provide the virtual environment. We
    call containers the virtual environments offered by container-based virtualization
    technologies.


    Container technology has been around for quite a while through solutions like
    OpenVZ. Linux Containers (LXC), and Docker. It is based on two essential Linux
    kernel features: cgroups and namespaces. These features let applications run as
    isolated processes within an operating system. The namespace kernel mechanism
    allows the creation of an isolated environment in the hosting operating system.
    From the application perspective, an environment provided by a Linux namespace
    looks like a real operating system containing its own file system and process
    tree.'
  merge: -1
  pgno: 250
- img_proc: true
  md: 'Processes running in one namespace cannot see processes from other namespaces.
    Computing resources like CPU and memory are managed by the cgroups kernel feature,
    which is responsible for allocating computing resources to containers controlled
    by the host operating system.


    A container can run as one or more isolated processes. Processes running inside
    a container behave as if they were running in a real machine.


    Before the advent of Docker, containers were not widely embraced by developers.
    The earlier container technologies lacked a straightforward method to package
    and distribute environment dependencies with application binaries. However, Docker
    revolutionized this landscape by offering a container-based virtualization solution.
    This allowed developers to effortlessly bundle their applications into container
    images, complete with dependencies like libraries and customized configurations
    necessary for application execution. Docker’s impact extends beyond simplifying
    development processes; it also offers significant cost benefits, making it a game-changer
    in the world of container technology. Docker’s cost benefits can lead to significant
    savings, a prospect that should inspire optimism in any organization.


    The whole IT industry changed because of Docker. An increasing number of organizations
    started to deploy their applications as Docker containers, which raised challenges
    regarding how to efficiently operate containers at a large scale. That is when
    technologies like Kubernetes appeared as a solution to managing containers. Before
    diving into Kubernetes, let us discover how Docker works.


    # Exploring Docker


    It is relatively simple to operate a bunch of Docker containers without the assistance
    of any other tool than'
  merge: -1
  pgno: 251
- img_proc: true
  md: 'Docker itself. Containers run like processes in the operating system, so it
    is essential to ensure container processes are always running without errors.
    A system administrator can inspect container logs and restart containers when
    something goes wrong. For simple use cases, Docker alone may be enough to host
    applications. There may be manual administration tasks to keep containers running,
    which is fine for smaller, non-critical systems. However, Docker may need to be
    complemented with other technologies to host critical enterprise applications.


    Docker delivers effective container virtualization technology but lacks a reliable
    mechanism for operating containers in cluster-based environments that can meet
    strict application requirements involving high availability and fault tolerance.


    With the increasing adoption of container technologies, container orchestrator
    solutions like Mesos, Marathon, Rancher, Docker Swarm, and Kubernetes appeared
    in the market. These container orchestrators were designed to facilitate the operation
    of critical applications running on containers. With a container orchestrator,
    we can adequately manage operating system resources like networks and storage
    to meet the requirements of container-based systems. Also, container orchestrators
    play a fundamental role in deploying the software by allowing deployment strategies
