  md: 'Software development is a data processing activity in which we create systems
    that receive and produce data. As programmers, we are responsible for identifying
    the most efficient and straightforward ways to handle data in the applications
    we develop. Sometimes, this is not easy to achieve because what is efficient may
    not be simple, and vice versa. Developers have been searching for a balance between
    efficiency and simplicity, considering that nowadays, computing resources are
    not as expensive as they used to be.


    The maintainability of a complex code that is optimized to be very efficient may
    be higher than a simpler code that consumes more computing resources but can be
    easily understood and changed.


    It all depends on the context, of course. Certain businesses require their software
    to extract every bit of performance possible, like those of trading and financial
    fields, where every millisecond, even nanosecond, can significantly influence
    monetary gains. Unless in cases where high performance is required, there is always
    a trade-off space where building simpler, non-efficient code may be the best for
    your organization and customers.


    As most applications do not fall under requiring highly efficient performance,
    such applications rely on standard data structures and algorithms for data processing.
    This is where the Java API comes in by providing a rich library called Java Collections
    Framework that offers a set of built-in data structures that use most of the cases
    we see in a typical back-end application.


    Also the Java Collections Framework has interfaces and classes that may help those
    wanting to develop high-performance code, it really shines by providing support
    for frequently used data structures through the java.util.List, java.util.Set,
    and java.util.Map. The Map interface is not considered an abstract collection,
    because we can handle map-based classes as they were collections, we treat them
    as such.


    Let us start our exploration with the List interface and some of its implementations.


    # Creating object collections with lists


    A common way to store objects in Java is through lists. The basic idea behind
    this structure is that we can collect objects in an orderly manner, allowing us
    to preserve the sequence in which we store objects in a given list. It enables
    duplicates, so if you try to insert the same object multiple times, it would not
    complain.


    The java.util.List interface is derived from the java.util.Collection interface,
    meaning we can rely on the basic operations to handle a collection and specific
    methods to manipulate lists. The java.util.Collection interface extends the java.util.Iterator
    interface, which allows us to iterate through any list.


    We have the ArrayList implementing the java.util.List interface. The ArrayList
    is the most common list and data structure in Java projects.


    Based on the Java arrays, the ArrayList provides a list whose size can be dynamically
    increased, something we cannot do with ordinary arrays because their size, once
    defined, cannot be changed. Below is how we usually create an ArrayList:


    ```

    List<String> listOf = new ArrayList<>();

    ```


    Since and ArrayList are generic, we can leverage type safety by specifying which
    object type our List will support. In the example, we say that our List will accept
    only String objects. We establish it by declaring the variable type as List<String>.
    When creating the instance, we can explicitly define a type with angle brackets
    like ArrayList<String> or use the diamond operator <> to use them in the example'
