  md: 'Troubleshooting errors is one of the challenges when using microservices architecture
    because to understand why a request failed, a developer may need to check the
    log of multiple microservices involved in the failing request. The MicroProfile
    Telemetry 1.1 provides advanced observability capabilities with spans and traces,
