  md: '![](img/9b5739f37699f084397670714bf63edd_87_0.png)


    Virtual threads share the same platform thread, so they are cheap to create because
    creating them does not make the OS allocate more memory. How do they work under
    the hood?


    Whenever an IO task is executed inside a virtual thread, such thread is suspended
    from the platform thread until the IO task finishes. The virtual thread runs until
    it is blocked, usually by an IO operation. When that happens, the virtual thread
    is removed from execution, and a new virtual thread can be selected to run in
    a platform thread. There is no guarantee that a virtual thread that was removed
    will run as soon as its blocking operation is completed, nor is there any guarantee
    that it will execute on the same platform thread.'
