  md: "Let us explore how to write native applications with Quarkus.\n\n# # Writing\
    \ native applications\n\nA typical Java application is based on classes compiled\
    \ into bytecode that runs inside a **Java Virtual Machine (JVM)**. The JVM is\
    \ the software we install in the operating system we want to run the Java application.\
    \ Once compiled as bytecode, Java classes can be executed on different operating\
    \ systems like Windows, Mac, and Linux, as long as those systems have a JVM installed\
    \ on them. The JVM provides benefits like garbage collection and optimizations\
    \ that let us efficiently execute Java applications. However, such benefits come\
    \ with a price. A running JVM and performing all the warm-up activities required\
    \ to execute a Java application consumes resources, especially memory.\n\nBefore\
    \ a Java application becomes ready to execute its tasks, the JVM must start up\
    \ and processing the application's bytecode. In most cases, waiting for the application\
    \ to start and the heavy memory to run it inside a JVM is fine. However, there\
    \ are scenarios where speeding up application startup and using little memory\
    \ is crucial. The usage of Java applications for one-time executions, those offered\
    \ by function-as-service solutions like the **Amazon Web Services (AWS)** Lambda,\
    \ is one of the cases where Java applications with smaller memory footprint benefit\
    \ because those function-as-service charges cost on how much memory the system\
    \ uses and how time the system needs to execute its operations. Reducing the amount\
    \ of memory a Java application uses and the time required to start such an application\
    \ is possible. By doing so, we can save money, especially when turning many Java\
    \ applications into native.\n\nLet us explore a technology called native image\
    \ that enables us to create memory-optimized versions of Java applications.\n\n\
    # # Introducing the native image\n\nGraalVM is the **Java Development Kit (JDK)**\
    \ that provides a technology called native image. This technology relies on the\
    \ ahead-of-time compilation to compile a Java application into a standalone executable\
    \ that can be executed directly in the operating system without having a **Java\
    \ Virtual Machine (JVM)** installed. An ordinary Java application is compiled\
    \ into bytecode that executes inside the JVM. GraalVM, on the other hand compiles\
    \ a Java application into native code that executes directly in the targeted system.\n\
    \nQuarkus relies on GraalVM to provide support for native image compilation. Next,\
    \ we will learn how to compile Quarkus applications into native images.\n\n# #\
    \ Creating a native executable with Quarkus\n\nOn a Maven-based project, we can\
    \ configure a property in the **pom.xml** file that lets us compile a native executable\
    \ of the Quarkus application:\n\n```\n<?xml version=\"1.0\" encoding=\"UTF-8\"\
    ?>\n<project xmlns=\"http://maven.apache.org/POM/4.0.0\" xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\"\
    \n  xsi:schemaLocation=\"http://maven.apache.org/POM/4.0.0 https://maven.apache.org/xsd/maven-4.0.0.xsd\"\
    \n  xmlns=\"http://maven.apache.org/POM/4.0.0\">\n  <!-- Code omitted -->\n  <profiles>\n\
    \    <profile>\n```"
