    # Conclusion


    The ability to group system responsibilities into layers allows one to define
    boundaries within a system. These boundaries are formed based on our understanding
    of the steps of a software system needs to conduct to fulfill user needs. The
    layered architecture helps to capture an understanding into layers that operate
    in realizing system behaviors. Because of its pragmatic approach, the learning
    curve to grasp layered architecture is not so high, which makes such architecture
    a good candidate for fast application development.


    Aware of the benefits that layered architecture can provide, in this chapter,
    we explored the ideas behind designing software systems into layers by implementing
    the personal finance system employing first the data layer, responsible for abstracting
    and handling all database interactions, then the service layer in charge of enforcing
    constraints through business rules that dictate how the software should behave,
    and finally the presentation layer responsible for presenting through an API or
    a graphical user interface, the behaviors supported by the personal finance application.


    In the next and final chapter, we explore the software design approach called
    hexagonal architecture, which allows us to develop more change-tolerant applications.
    We will learn how to arrange the domain model in the domain hexagon, provide input
    and output ports in the application hexagon, and expose input and output adapters
    in the framework hexagon.'
