    Let us explore how to use streams to handle collections of objects.


    # Streams


    Introduced together with functional interfaces and lambda expressions in Java
    8, the Stream interface allows us to handle collections of objects functionally.
    One significant difference between streams and the data structures provided by
    the Collection interface is that streams are lazy loaded. For example, when we
    create a list of objects, the entire list is allocated in memory. If we deal with
    large amounts of data, our application may have memory issues loading all objects
    into a list. On the other hand, streams allow us to process one object at a time
    in a pipeline of steps called intermediate and terminal operations. Instead of
    using a collection and loading everything in memory, we rely on a stream to process
    object by object, performing the operations on demand.


    It is a common situation when results from a large database table are necessary.
    Instead of returning the results as a List, we can return them as a Stream to
    prevent memory bottlenecks in the application.


    Streams may be beneficial for preventing memory bottlenecks and also helping us
    handle collections of objects more flexibly. To understand how we can tap into
    the benefits provided by streams, we first need to understand the stream structure.


    Streams are designed like a pipeline where we have the following components:


    +   - Stream source

    - Intermediate operations

    - Terminal operation


    The stream source is where we get the data to process as a stream. We can use
    a List, for example, to source a stream. Intermediate operations allow us to manipulate
    data in a pipeline fashion, where from one intermediate operation can be used
    as the input to another intermediate operation. As the last component, we the
    terminal operation determines the stream''s final outcome. Terminal operations
    can return an object or handle the stream data without returning something.


    Let us start by checking how we can source a stream.


    # Sourcing streams


    The simplest way to initialize a stream is through the of factory method from
    the Stream interface:


    A more recurrent use is creating streams out of existing collection like a List.
    for example:


    ```

    var listOfElements = List.of("Element 1", "Element 2", "Element 3");

    Stream<String> streamOfStrings = listOfElements.stream();

    ```


    Once we have a stream, the next step is to handle its data with intermediate and
    terminal operations. Let us first check how intermediate operations works.


    # Intermediate operation


    For those familiar with Unix/Linux shells, you may know how helpful it is to use
    the output of a command as the input for another usage of the pipe | character.
    The Java streams'' intermediate operations work similarly by letting us use the
    result from'
