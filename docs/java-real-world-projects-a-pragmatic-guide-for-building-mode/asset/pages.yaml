  md: '# Increasing code readability with pattern matching


    Introduced in the Java 17 release (it appeared initially as a preview feature
    on Java 14), pattern matching represents a notable effort to decrease boilerplate
    from the Java language. This feature identifies areas in the language where pattern-matching
    techniques make sense, allowing developers to write cleaner and simpler code.
    Let us start our exploration by understanding what pattern matching is, then where
    and how Java is applying it to improve the language.


    # Introduction to pattern matching


    If you have ever faced the troubleshooting problem of searching for log messages
    containing a specific term, you may have used pattern-matching techniques. In
    Unix-based environments, tools like sed or grep allow us to match a word in a
    text file. For example, suppose we have a file called lines.txt with the following
    content:


    +   - Line 1 - Message A


    +   - Line 2 - Message B


    +   - Line 3 - Message C


    Then we execute the command:


    ```

    $ grep "Line 2" lines.txt

    ```


    +   - Line 2 - Message B


    Only the line containing the term Line 2 is displayed.


    The example above demonstrates the fundamental pattern-matching mechanism of checking
    a value against a pattern. The value is the content from the lines.txt file, and
    the pattern is Line 2, which matches Line 2—Message B, representing the result
    of the pattern-matching evaluation.'
  merge: -1
