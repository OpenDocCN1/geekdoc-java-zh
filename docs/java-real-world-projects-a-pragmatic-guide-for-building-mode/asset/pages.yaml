  md: '![](img/9b5739f37699f084397670714bf63edd_83_0.png)


    **Figure 2.2:** Platform threads memory usage


    The issue lies here in the platform thread waiting for a response. The thread
    is consuming memory resources but is not doing anything; it is only waiting for
    a database response. We cannot process more requests because no free available
    memory exists to create more threads, decreasing our program throughput capacity.


    Besides being expensive to build, platform threads take time to create. Creating
    a new thread object for every request is also a costly activity in terms of time.
    To overcome this issue, we can create thread pools with reusable threads. Having
    a thread pool solves the overhead of creating new threads, but we still have the
    hardware limitation on the number of total threads that can be created.


    A technique involving reactive programming has emerged in Java to solve the throughput
    problem caused by blocking IO operations. Let us look at how it works.'
