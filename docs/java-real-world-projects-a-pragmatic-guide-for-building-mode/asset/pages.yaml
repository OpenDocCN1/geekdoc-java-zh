  md: 'In Java, we use the try-catch construct to handle exceptions. Inside the try
    block, we put the code that may throw a checked exception. We may handle the exception
    inside the catch block by printing a friendly error message or doing something
    to recover from a failure condition.


    The code above will print the following output:


    ```

    The following error occurred: Negative numbers not allowed

    java.lang.Exception: some(ExceptionAnalysis.java:14)

    at ExceptionAnalysis.main(ExceptionAnalysis.java:5)

    ```


    The check checks if the provided parameter is a negative integer. If true, it
    throws an exception using the throw keyword. The Exception class provides a one-parameter
    constructor, allowing us to provide a String to the message.


    Since we are creating the exception, we must handle it inside the check or put
    a throw keyword on the method declaration. The throws keyword specifies one or
    more exceptions the method may throw.


    We use the throw keyword, which means any other method calling our method will
    have to either handle the exception or include the throws keyword in its declaration.
    If the programmer does not explicitly handle the exception, the default JVM exception
    handles it.


    # Unchecked exceptions


    Contrary to checked exceptions, unchecked exceptions are not required to be handled
    at runtime by our code. Although not recommended, handling unchecked exceptions
    is legal.

    Following is an example showing how an application can throw an unchecked exception:


    ```

    var listOfStrings = List.of("a", "b");

    var first = listOfStrings.get(0);

    var second = listOfStrings.get(2); // IndexOutOfBoundsException: Index: 2

    Size: 2;

    ```


    The IndexOutOfBoundsException is unchecked exception because it extends the RuntimeException
    class. When we try to access an index outside the list bounds, the default JVM
    exception handler handles this directly.


    When handling exceptions, there are scenarios where we want execute some code
    whenever the application leaves a try-catch. When the final block comes into play,
    allowing us to always execute some code, regardless of whether an exception is
    caught.


