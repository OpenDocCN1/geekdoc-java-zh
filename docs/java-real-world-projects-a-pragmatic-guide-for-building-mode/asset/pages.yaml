    # Getting more control over inheritance with sealed classes


    Java provides inheritance capabilities as an object-oriented language, allowing
    us to inherit classes and interfaces. When dealing with classes, inheritance occurs
    when extending a concrete or abstract class. With interfaces, we can extend or
    implement them. Whether we were dealing with classes or interfaces, until the
