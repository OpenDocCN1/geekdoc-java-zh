  md: '# # CHAPTER 9

    # Learning Monitoring and Observability Fundamentals


    # ## Introduction


    Those tasked with supporting Java applications in production understand the value
    of comprehending system behavior in various situations. This understanding is
    built on the foundation of monitoring and observability techniques, which leverage
    metrics, logs, events, and other data to predict or address application failures.
    By looking at the basics of monitoring and observability, we can make informed
    decisions about the most effective technologies and approaches to swiftly respond
    to unexpected application behaviors.


    # ## Structure


    The chapter covers the following topics:


    +   - Understanding monitoring and observability

    - Implementing distributed tracing with Spring Boot and OpenTelemetry

    - Handling logs with Elasticsearch, Fluentd, and Kibana

    - Compiling and running the sample project


    # ## Objectives


    By the end of this chapter, you will learn the main concepts behind monitoring
    and observability. With these concepts as a solid foundation, you will learn how
    to apply distributed tracing techniques to understand through traces the life
    cycle of requests spanning microservices. Finally, you will know how to collect
    and see logs from a Java application using Elasticsearch, Fluentd, and Kibana.


    # ## Understanding monitoring and observability


    The crucial moment for software developers is when their applications go live.
    For backend developers, it is when their software is deployed to production environments.
    Although what developers deploy most of the time are not user-facing features,
    they do deploy backend components that may support such features provided by the
    frontend. It is fundamental to remember that the well-functioning of these backend
    components directly impacts the user-facing features, underscores the importance
    of the backend development in ensuring a seamless user experience.


    Imagine you are working as a backend developer. In that case, chances are high
    that you will face a scenario similar to the one described above because most
    backend development nowadays is based on server-side applications often integrated
    with frontend applications.'
  merge: -1
