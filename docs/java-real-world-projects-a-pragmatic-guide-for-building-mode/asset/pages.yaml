- img_proc: true
  md: '# # CHAPTER 14

    Building Applications with Hexagonal Architecture


    # ## Introduction


    Software development in an environment of constant changes can be challenging.
    Customers want to receive good service, and organizations strive to provide it
    with efficient software systems. However, customer needs change. Not only that,
    the way to fulfill customer needs can also change. After all, enterprises are
    in an unending quest to produce value in the most inexpensive way possible. Such
    a landscape presents a formidable challenge for developers who need to solve complexity
    now and, at the same time, ensure the systems they are creating can evolve sustainably.
    By being sustainable, we are referring to the ability to handle software changes
    gracefully, especially those that with fundamental technological dependencies
    like, for example, database or messaging systems.


    We tackle uncertainty by developing software in a change-tolerant way. We can
    accomplish that by using hexagonal architecture, a technique that helps develop
    software so that the technological aspects are entirely decoupled from the business
    ones. This chapter explores how hexagonal architecture helps create software systems
    capable of welcoming fundamental technological changes without significant refactoring
    efforts.


    # ## Structure


    The chapter covers the following topics:


    +   - Introducing hexagonal architecture

    - Arranging the domain model

    - Providing input and output ports

    - Exposing input and output adapters

    - Compiling and running the sample project


    # ## Objectives


    By the end of this chapter, you will learn how to develop Java applications using
    the hexagonal architecture. You will learn how to define the domain model provided
    by the domain hexagon. You will also learn how to use input and output ports from
    the application hexagon to orchestrate system dependencies required to enable
    behaviors established by the domain hexagon. Finally, you will learn how to use
    adapters from the framework hexagon to make your system compatible with different
    technologies.'
  merge: -1
