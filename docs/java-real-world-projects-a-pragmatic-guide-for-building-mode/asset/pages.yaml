  md: '# About the Author


    **Davi Vieira** is a software craftsman with a vested interest in the challenges
    large enterprises face in software design, development, and architecture. He has
    over ten years of experience constructing and maintaining complex, long-lasting,
    and mission-critical systems using object-oriented languages. Davi values the
    good lessons and the software development tradition left by others who came before
    him. Inspired by such software tradition, he develops and evolves his ideas.


    Davi started his career in technology by working as a Linux system administrator
    in the web hosting industry. After learning much about server task automation
    with shell scripting, he moved on to the banking industry, where he fixed bugs
    in legacy Java systems. Working with such legacy systems enabled Davi to face
    exciting challenges in a telecommunications organization, where he played a crucial
    role in helping the company adopt cloud-native development practices. Eager to
    learn and make a lasting impact, Davi works currently as a tech lead for an enterprise
    software company.'
  merge: -1
  pgno: 5
- img_proc: true
  md: '# About the Reviewers


    +   * **Ron Veen** is a seasoned software engineer with over 20 years of experience
    in the Java ecosystem. From mainframes to microservices, he''s seen it all. His
    passion for software engineering and architecture drives his work.

    A A certified Java expert (OCP/OCPBCD), Ron is proficient in a wide range of frameworks
    and libraries, from Apache to ZK. He is also known on exploring alternative JVM
    languages like Kotlin.

    As a special agent and senior developer at Team Rockstars IT, Ron shares his knowledge
    as an international conference speaker and via his written works.

    He is the author of books on ‘Java Cloud-native migrations with Jakarta EE’ and
    ‘virtual threads, structured concurrency, and scoped values’.


    +   * **Stan Komar (Stanisław Kazimierz Komar)** is a business owner focused on
    industrial automation and systems integration, using either Rockwell Automation,
    Schneider, Siemens or Mitsubishi Tools. He has been actively programming since
    1973 and is going strong. Although he should be retired, he enjoys the projects
    he works on so much that “Retirement can Wait.” There is just so much change in
    the programming world that keeping up-to-date is very challenging. At 69 years
    young, he is an avid tennis player.'
