    **Figure 2.1:** The JVM platform and OS physical threads


    The virtual thread implementation introduced the term platform thread to differentiate
    traditional (now called platform threads) from virtual threads.


    Developing multi-thread applications using platform threads has been the standard
    approach since the first Java release. This approach worked well for quite a while,
    but as Java applications started to deal with more intense concurrent workloads,
    such an approach began to show some limitations. Let us assess these limitations.


    # Limitations of platform threads


    The code developed using platform threads is based on the imperative programming
    paradigm. Imperative programming is how we develop software through sequential
    statements that change application state through code that relies on conditional
    expressions, and control flows like while and'
