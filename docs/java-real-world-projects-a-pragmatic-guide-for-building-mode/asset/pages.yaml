    # # Objectives


    By the end of this chapter, you will have the fundamental skills to write effective
    unit and integration tests on Java applications using JUnit 5 and Testcontainers.
    Such skills will make you a better developer, ready to tackle any programming
    challenges with much more confidence by ensuring the features you are developing
    are secured by automated tests. Let us embark together on this fascinating testing
    journey.


    # # Overviewing unit and integration tests


    Common steps involved in developing a new application or adding features to an
    existing one consist of finding some way to run the application locally to observe
    how it behaves. Having the application running locally allows us to test application
    behaviors manually. After introducing some changes in the code, we recompile it,
    start the application, and perform some checks to confirm the changes are working
    as expected. However, this manual test approach depends on human''s ability to
    interpret the system behavior and judge whether it produces correct or wrong results.
    Besides being time-consuming, manual tests may not be sustainable in the long
    run. As the application receives more features, more manual testing will be required.


    The idea is to find ways to automate some of the tests we would execute manually
    to ensure the application is working well. To achieve test automation, we can
    rely on techniques like unit and integration testing, which have different'
  merge: -1
  pgno: 124
- img_proc: true
  md: 'purposes in terms of testing scope, but both share the intent to automate tests.
    So, in this session, we will examine what it means to employ unit or integration
    tests in a Java application. Let us start by exploring unit tests.


    # Unit tests


    When discussing tests, it is always important to consider the scope we want to
    address when validating system features. Such consideration is essential because
    the bigger the scope, the broader the test dependencies, which may include different
    systems, including databases, front-end applications, APIs, and so on. Another
    thing to consider when widening the scope is the cost and complexity associated
    with testing broader aspects of a system.


    With the awareness that tests encompassing a large scope of dependencies are complex
    and costly, we can reflect on which system elements can be tested in a smaller
    scope. This leads us to the behaviors an application may expose through methods
    containing a sequence of instructions. At the core of any Java application, we
    have a collection of classes and methods orchestrating a sequence of instructions
    to produce useful application behaviors aimed at hopefully solving real-life problems.


    With that in mind, unit tests are a technique to validate application behaviors
    on an isolated, self-contained level. At this level, we usually have methods containing
    logic that dictates how accurate and well an application handles its use cases.
    Unit tests are not concerned with the application''s behavior when interacting
    with external resources like a database. Instead, unit tests validate application
    behaviors that can be checked without needing external resources or dependencies.
    That is why, for example, we can employ the so-called mocks to simulate'
  merge: -1
  pgno: 125
- img_proc: true
  md: 'such external resources when unit testing an application functionality that
    depends on external resources.


    We can then state that unit tests are not supposed to test an entire use case
    or application feature but rather a minor part that contributes to such a use
    case or feature. It is also important to understand that unit tests cannot replace
    other tests, like acceptance tests, which validate how an application behaves
    from the user’s perspective.


    Unit tests are so appealing because they are cheap to implement yet beneficial.
    When properly implemented, they can protect critical areas of the application
    from unwanted changes and side effects. As the code complexity increases, unit
    tests can also help us identify what the application is doing with test cases
    targeting all the required behaviors to deliver helpful application features.


    Although unit tests validate how units of code behave, they cannot help us answer
    how the application behaves when it needs to deal with external resources like
    a database or an API. For such a purpose, we can rely on integration tests, which
    we will examine next.


    # Integration tests


    Earlier in this chapter, we discussed this manual test idea, which consists of
    locally running an application and observing how it behaves when something is
    changed. We can also locally run an application and see how it interacts with
    its external dependencies, like databases or APIs served by other systems. This
    validation increases our confidence that the application correctly handles data
    provided by external resources.


    Besides checking how an application behaves when dealing with external dependencies,
    we can manually validate how different application components or modules interact.
    For'
