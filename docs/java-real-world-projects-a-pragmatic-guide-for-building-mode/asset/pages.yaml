    functions to calculate how many requests have arrived based on the HTTP method:


    ```

    sum(increase(file_http_request_total(method="POST\){{$__range}})) by (method)

    ```


    The **increase** is a Prometheus query function that lets us calculate how a metric
    increases over a period. The **increase** function is defined in terms of the
    time series range. The time series interval we are interested in can be the last
    five minutes or an explicit range containing a beginning and ending period. In
    the example above, use use to calculate how the `file_http_request_total` counter
    increases over a period defined by `${{$__range}}` replaced by the time interval
    we set through the Grafana interface. After calculating the **sum**, we sum all
    the results based on the metric tag (**POST** or **GET**) defined by the by keyword.


