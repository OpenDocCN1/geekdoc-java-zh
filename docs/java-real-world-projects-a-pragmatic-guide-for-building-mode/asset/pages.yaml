    Figure 11.1: The Prometheus architecture


    Starting at the top of the figure above, the metrics exporters provide metrics
    data that the Prometheus server scra scrapes. Metric data is stored in the Prometheus
    storage, allowing us to trigger alerts through the Alertmanager and create dashboards.
    Let us assess each component of the architecture.


    # Metrics exporters


    Exporters are the architecture components responsible for making metrics available
    to Prometheus. There are three types of exporters we will cover, as follows:


    +   1. The third-party exporter is used when one wants to get metrics from a system
    that has no control over its source code. Suppose your application stores data
    in a MySQL database, and you want to get metrics from it. As you have no control
    over the MySQL source code, you must rely on an exporter provided by a third party
    that provides MySQL metrics.

    2. The application exporter provides metrics generated by instrumented applications.
    Contrary to third-party exporters, we have control over the metrics generated
    by application exporters because we can change the application''s code.

    3. The node exporter is aimed to expose only machine-based metrics like CPU, memory,
    and disk usage. It runs as a process in the operating system.


    All exporters provide an HTTP endpoint that the Prometheus server uses to pull
    metrics data. Let us explore what is inside a Prometheus server.


    # Prometheus server


    The Prometheus server is a fundamental architecture component. Its storage is
    based on a time-series database that persists data directly on the operating system
    disk. However, remote storage is also supported. The Prometheus server scrapes
    metrics data through a pull mechanism that reaches out to the HTTP endpoints provided
    by metric exporters. The'
