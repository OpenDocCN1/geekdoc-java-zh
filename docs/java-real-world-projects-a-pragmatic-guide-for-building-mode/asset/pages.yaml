    ```

    Stream<String>intermediateStream2 = streamOfStrings.filter(value ->

    contains("1"));

    ```


    ```

    Stream<String>intermediateStream3 = streamOfStrings.map(value ->

    toupperCase()).filter(value -> contains("1"));

    ```


    We are creating a stream of strings. The first intermediate operation puts all
    characters in uppercase. Note that intermediate operations always return a Stream
    object, so we can use it to perform another intermediate operation or terminate
    the stream with a terminal operation. Next, the second intermediate operation
    filters the stream data, returning only the objects containing the "1" string.
    Finally, we concatenate the **map** and **filter** intermediate operations in
    the third intermediate operation.


    The **map** intermediate operation receives a lambda expression implementing the
    Function interface as its parameter. Remember, a Function is a functional interface
    that accepts a parameter and returns an object. We are returning another String
    with its characters in uppercase.


    We are passing a lambda expression for the **filter** intermediate operation that
    implements the Predicate functional interface.


    Instead of creating multiple streams containing intermediate operations, we can
    create one single stream with multiple intermediate streams, as shown follows:


    ```

    streamOfStrings

    .map(value -> value.toUpperCase())

    .filter(value -> value.contains("1"))

    .filter(value -> value.contains("3"));n

    ```


    It is important to understand that we are not processing data by creating intermediate
    operations. The real processing only happens when we call a terminal operation.
    Let check next if it works.


    # Terminal operation


    Creating one or more intermediate operations on top of the stream data does not
    mean the application is doing something with the stream data. We are only stating
    how the data should be processed at the intermediate level. The stream data is
    only processed after we call a terminal operation. Here are some examples of terminal
    operations:


    ```

    Stream<String> streamOfStrings = Stream.of("Element 1", "Element 2",

    "Element 3");

    ```


    ```

    streamOfStrings

    .map(String::toUpperCase)

    .filter(value -> value.contains("1"))

    .forEach(System.out::println); // ELEMENT 1

    ```'
