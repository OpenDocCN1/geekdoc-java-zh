  md: 'containers viable for running enterprise applications.

    Most cloud providers offer Kubernetes-based solutions, and companies of all sizes
    rely on them to run their software.

    Designing an application to run on Kubernetes gives an organization the flexibility
    to change cloud providers without significant impact. Applications can be developed
    to rely on pure Kubernetes standards instead of features provided by a specific
    cloud provider. However, there are customized container orchestrators built on
    top of Kubernetes, like OpenShift from Red Hat and Kyma from SAP, that provide
    additional capabilities to ones already provided by Kubernetes.


    A Java developer needs a basic understanding of how Kubernetes works because a
    growing number of Java projects are running in Kubernetes clusters. So, next,
    we explore the fundamentals of Kubernetes architecture and some of its main objects
    commonly seen when deploying an application.


    # Kubernetes architecture


    Kubernetes is a cluster made of at least one worker node, which is where containerized
    applications run. We can have Kubernetes running on a single or multiple machines.
    When running on a single machine, this machine acts simultaneously as the master
    and worker node. When running with multiple machines, master and worker nodes
    run in separate machines. Master nodes are responsible for cluster management
    activities, while worker nodes run containerized applications.


    Inside a Kubernetes cluster, we have control plane and node components. Going
    next, we cover control plane components.


    # kube-scheduler'
  merge: -1
