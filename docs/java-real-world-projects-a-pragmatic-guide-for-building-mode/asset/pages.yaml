  md: 'Consider the scenario where we have an abstract class called Card to represent
    a physical card people use to access the facilities of a building. Possible implementations
    of the Card abstract class could be the PermanentCard or TemporaryCard classes
    with different rules regarding authorization to enter the building. Suppose now
    the system responsible for handling those cards will also support storing and
    credit card information to charge people who want to use the building parking
    space. To allow it, a developer, for some reason, decides to create the CreditCard
    class by extending the Card abstract class. The issue is that the developer who
    created the Card abstract class designed it in a way with methods and attributes
    that would make sense only in the context of cards as a means for access control,
    not payment. The CreditCard class may end up inheriting and attributes that are
    not supposed to be used in the context of payments but as means for access control.


    In the scenario described, a developer can provide dummy implementations of abstract
    methods to fulfill the abstract class contract. The code and the feature delivered
    would work as expected, but we would have a design incongruence in our code. Sealed
    classes can help prevent such incongruence which classes can implement the Card
    abstract class provided in our example.


    The developer providing the credit card feature would look like the card-sealed
    abstract class and see that PermanentCard and TemporaryCard are the only possible
    allowed implementations.


    Let us explore the scenario described above by learning how sealed classes can
    help us enforce our inheritance expectations.


    # Enforcing inheritance expectations'
