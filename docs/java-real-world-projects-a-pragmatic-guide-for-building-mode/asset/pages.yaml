  md: '# CHAPTER 11

    Creating Useful Dashboards with Prometheus and Grafana


    # Introduction


    Over the last chapters, we have been exploring how essential monitoring tools
    and techniques are to clarify how well a software system is running. Such tools
    and techniques are fundamental in providing helpful input through metrics, traces,
    and logs with details describing system behavior. Metrics, in particular, represent
    one of the corners of monitoring practices that shed light on the inner workings
    of applications'' operations. In today''s world, where the number of applications
    and the volume of metrics they produce is bigger than ever, a monitoring solution
    capable of collecting, storing, and serving large amounts of data is essential
    to ensure monitoring of highly complex and demanding applications. We have Prometheus
    as the solution that can help us tackle such monitoring challenge.


    Complementing Prometheus in a frequently used monitoring stack is Grafana, a powerful
