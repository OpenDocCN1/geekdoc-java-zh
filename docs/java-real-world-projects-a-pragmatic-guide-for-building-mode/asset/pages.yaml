  md: 'domain events.


    # Aggregates


    We have identified the TransactionAdded domain event and the AddTransaction command.
    The first represents an event that happened, while the second refers to the action
    generating the event. Domain events and commands represent a connection, an aggregation
    of activities to fulfill some business outcome. This connection between domain
    events and commands is described, in our personal finance example, through an
    aggregate called Transaction, as shown in the following:


    ![](img/9b5739f37699f084397670714bf63edd_345_0.png)


    Figure 12.6: The aggregate stick note


    Think of an aggregate as an entity or data that ties together the command and
    domain events responsible for enabling the business process. In the example above,
    the aggregate is positioned between the command and the domain event stick notes.


    We can map all the business processes we are interested in by using domain events,
    commands, actors, and aggregates. Once we have mapped them, the final result will
    serve as the input for the domain model implementation. In the following section,
    we will explore what the domain model is.


    # The domain model


    All this discussion around bounded contexts, the ubiquitous language, and event
    storming we had so far has significantly increased our capacity to acquire knowledge
    about the problem domain. We use such knowledge to create the domain model, a
    tangible representation of the problem we want to solve and how problem is solved.
    We call it tangible because the domain model usually combines artifacts based
    on written documents, diagrams, and code. These share the same ubiquitous language,
    so the terms used in the application code have the same meaning as in documents
    and diagrams. This is especially helpful because it ensures all projects'' stakeholders
    have a shared understanding of how the domain model is represented. Non-technical
    stakeholders can understand the model easily, knowing that the application code
    follows the same terminology and meanings.


    The domain model is usually expressed through elements such as entities, volume
    objects, and specifications on the code level. In the next section, we explore
    using such elements to implement an application using domain-driven design.


    # Conveying meaning with value objects


    In this section, we start developing the personal finances application, a system
    that lets us keep track of expenses and organize them into categories. A basic
