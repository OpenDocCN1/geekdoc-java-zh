  md: '# # CHAPTER 1

    Revisiting the Java API


    # ## Introduction


    Java has been widely used in enterprises of all sorts of industries. One good
    example of how Java helps boost developer productivity is it deals with memory
    management. While other programming languages may require developers to specify
    how memory will be allocated, Java takes this memory allocation responsibility
    and lets the developers focus on the problem domain they want to solve. Another
    thing that can boost developer productivity is knowing how to use the Java API
    properly.


    The Java API provides the language building blocks for application development.
    It crosses domains such as data structure handling with the Collections API, file
    manipulation with the NIO2 API, exception handling, and more. Instead of reinventing
    the wheel by implementing your data structures or algorithms, you can save a lot
    of time by tapping into what the Java API has to offer.


    So, revisiting the Java API while observing how it can be used to solve problems
    commonly seen in software projects will give us a solid foundation to explore
    further how Java can help us develop better software.


    # ## Structure


    The chapter covers the following topics:


    +   * Handling data structures with collections

    * Using the NIO2 to manate files

    * Error handling with exceptions

    * Improving application maintenance with the Logging API

    * Exploring the Date-Time APIs

    * Functional programming with Streams and Lambdas

    * Compiling and running the sample project


    # ## Objectives


    By the end of this chapter, you will know how to use some of the most crucial
    Java APIs. With such knowledge, you will be able to solve common problems that
    may occur in your software project. Understanding the Java API is the foundation
    for developing robust Java applications.


