    \  </property>\n</activation>\n<properties>\n  <skipITs>false</skipITs>\n  <quarkus.native.enabled>true</quarkus.native.enabled>\n\
    </properties>\n</profile>\n</profiles>\n<!-- Code omitted as native. -->\n</project>\n\
