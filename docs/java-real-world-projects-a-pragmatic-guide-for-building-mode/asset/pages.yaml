  md: 'Reactive programming may be challenging not only on the debugging side. The
    reactive code also differs, relying heavily on functional programming constructs
    like streams and lambda expressions. Not all developers are well-versed in such
    a programming style.


    Although reactive programming solves the IO blocking problem, it may create maintainability
    problems because it is more difficult to debug and write reactive code. Java architects
    aware of this situation came with a solution that allows us to leverage non-blocking
    IO threads and write and debug code as we do in the imperative programming style.
    We call this solution virtual threads. Let us see how it works.


    # Writing simple concurrent code with virtual threads


    We checked earlier that traditional platform threads are linked directly to an
    OS physical thread. Virtual threads, on the other hand, are connected to platform
    threads. Another critical point is that instead of the 1:1 relationship between
    platform and OS physical threads, we have a n:1 relationship between virtual and
    platform threads. In other words, we can have many virtual threads on top of a
    single platform thread. This is a fundamental characteristic of the virtual threads
    feature as a solution to overcome the thread bottleneck we have in the traditional
    platform threads model. The following is an illustration of how virtual threads
    are arranged:'
