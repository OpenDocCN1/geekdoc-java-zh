    What if we are only interested in the time aspect of a given date? That is when
    the LocalTime comes into play to help us.


    # LocalTime


    The way we manipulate LocalTime objects is similar to how we manipulate LocalDate.
    The LocalTime class provides many factory methods that allow the creation of LocalTime
    objects in different ways:


    ```

    System.out.println(LocalTime.now()); // 21:33:08.740527197

    System.out.println(LocalTime.now(ZoneId.of("Japan"))); // 05:33:08.740560750

    System.out.println(LocalTime.of(20, 10, 5)); // 20:10:05

    System.out.println(LocalTime.of(20, 10, 5)); // 20:10:05.000000010

    System.out.println(LocalTime.parse("20:10:05")); // 20:10:05

    ```


    As LocalDate, we can create LocalTime instances following the principle where
    we can get the current time with the now method or get a specific time by providing
    the components like hour minute second and nanosecond. It is also possible to
    provide a String representing time. Increasing or decreasing a LocalTime is also
    supported:


    ```

    System.out.println(LocalTime.of(20, 10, 5).plusHours(5)); // 01:10:05

    System.out.println(LocalTime.of(20, 10, 5).minusSeconds(30)); // 20:09:35

    ```


    Let us check how we can have an expression that represents date and time.


