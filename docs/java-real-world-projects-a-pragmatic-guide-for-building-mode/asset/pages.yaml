  md: "# Building a CRUD app with Quarkus\n\nThis section covers some of the fundamental\
    \ Quarkus features for developing back-end applications that persist data and\
    \ expose a REST API. After learning essential Quarkus components like Quarkus\
    \ DI, Hibernate, and Panache, we will implement, using Quarkus REST, a CRUD-based\
    \ account system allowing us to manage account credentials. Let us start our exploration\
    \ with Quarkus DI.\n\n# Injecting dependencies with Quarkus DI\n\nThe ability\
    \ to inject dependencies is an essential feature for most development frameworks,\
    \ and Quarkus is no different. At the beginning of the chapter, we learned that\
    \ Quarkus relies on industry to provide most of its features. It implements the\
    \ Jakarta Contexts and Dependency Injection (CDI) 4.0 specification, allowing\
    \ developers to inject dependencies in a Quarkus application. Quarkus DI, also\
    \ known as Arc, is the framework component that implements such a specification.\n\
    \nCompared to Spring, Quarkus achieves the exact outcome of allowing developers\
    \ to create, inject, and intercept managed beans. Spring and Quarkus differ in\
    \ how the injection activity takes place. To get an idea of how Quarkus injects\
    \ dependencies, we need to learn about managed beans and how they are produced\
    \ and injected within a Quarkus-based application.\n\nLet us learn about managed\
    \ beans.\n\n# Managed beans\n\nA managed bean is a Java object controlled by the\
    \ framework. In Spring, managed beans live in the application context. In Quarkus,\
    \ they live in what is called the container, which is the environment where the\
    \ application is running. The managed beans' lifecycle is controlled by the container\
    \ that decides when managed beans are created and destroyed. In Quarkus, we can\
    \ create beans at different levels, including the class, method, and field levels.\
    \ It is also possible to define the bean scope to determine how visible it will\
    \ be to other beans in the application. Some of the scopes we can use in a Quarkus\
    \ project are application-scoped, singleton, and request-scoped. Next, we explore\
    \ how to create and inject beans using such scopes.\n\n# Application-scoped beans\n\
    \nWhenever we need to provide an object that is accessible from any place in the\
    \ application, we can use application-scoped beans. An application-scoped bean\
    \ is created once and lives for the entire application runtime. The following\
    \ is how we can create an application-scoped bean:\n\n```\n@ApplicationScoped\n\
    public class Person {\n\n    private String name = \"John Doe\";\n\n    public\
    \ String getName() {\n        return name;\n    }\n}\n```"
  merge: -1
  pgno: 187
- img_proc: true
  md: "That is a class-level application-scoped bean because we use the @ApplicationScoped\
    \ annotation on top of the Person class. Following is how we can use this bean\
    \ in another part of the application:\n@Path(\"/person\")\n\n```\npublic class\
    \ SampleApplication {\n\n  @Inject\n  Person person;\n\n  @GET\n  @Produces(MediaType.TEXT_PLAIN)\n\
    \  public String setName() {\n    return person.getName(); // John Doe\n  }\n\
    }\n```\n\nThe SampleApplication is annotated with @Path(\"/person\") making it\
    \ a RESTful endpoint. A Person attribute annotated with @Inject. We call injection\
    \ point classes annotated with @Inject. When the Quarkus application starts, it\
    \ tries to manage a managed bean that can be assigned to an injection point. Because\
    \ we have annotated the Person class with @ApplicationScoped, Quarkus can find\
    \ a managed Person object and assign it to the Person injection point. For those\
    \ from Spring world, the @Inject annotation works similarly to the @Autowired\
    \ annotation.\n\nIt is worth noting that application-scoped beans are lazy loaded,\
    \ which means their instances are created only when one of their methods or attributes\
    \ is invoked. In our previous example, the Person bean instance is created only\
    \ when its getName is called.\n\nAn alternative to application-scoped beans is\
    \ the singleton beans. Let us check how they work.\n\n# Singleton beans\n\nLike\
    \ application-scoped beans, singleton beans are created only once and made available\
    \ for the entire application. Contrary to application-scoped beans, singleton\
    \ beans are eagerly loaded, appearing when the Quarkus application starts. The\
    \ following is how we can create a singleton bean:\n\n```\n@Singleton\npublic\
    \ class Location {\n\n  public List<String> cities = List.of(\"Vancouver\", \"\
    Tokyo\", \"Rome\");\n\n  @Produces\n  List<String> countries() {\n    return List.of(\"\
    Canada\", \"Japan\", \"Italy\");\n  }\n}\n```"
  merge: -1
  pgno: 188
- img_proc: true
  md: "Here, we have two beans, one created at the class level through the @Singleton\
    \ annotation and the other at the method level with the @Produces annotation.\
    \ The following code is how we can inject these beans:\n\n```\n@Path(\"/location\"\
    )npublic class SampleApplication {\n\n    @Inject\n    Location location;\n  \
    \  @Inject\n    List<String> countries;\n\n    @GET\n    @Produces(MediaType.TEXT_PLAIN)\n\
    \    public List<String> location() {\n        return Stream.of(countries, location.cities)\n\
    \            .flatMap(Collection::stream)\n            .toList();\n    // [Canada,\
    \ Japan, Italy, Vancouver, Tokyo, Rome]\n    }\n}\n```\n\nConsider the two injection\
    \ points, represented by the location and country attributes. Upon the start of\
    \ a Quarkus application, these attributes are eagerly assigned with bean instances\
    \ that are compatible with their types, in this case injecting Location would\
    \ be enough to allow direct access to both the cities field and countries method\
    \ from the Location bean instance. However, we introduce a new bean based on the\
    \ countries method to illustrate a specific use case: the possibility of having\
    \ beans at the method level.\n\nLet us explore the practical application of request-scoped\
    \ beans in Quarkus. Understanding will equip us with the knowledge to effectively\
    \ manage beans in real-world scenarios.\n\n# Request-scoped beans\n\nBoth application\
    \ and singleton-scoped beans are accessible from any part of the system and last\
    \ for long as the Quarkus application is alive. On the other hand, request-scoped\
    \ beans let us create objects available only in the context of an HTTP request.\
    \ Once the request is finished, the request-scoped bean ceases to exist. Every\
    \ HTTP request the Quarkus application receives will trigger the creation of a\
    \ new request-scoped bean. Following is an example showing how to use request-scoped\
    \ beans:\n\n```\n@RequestScoped\npublic class Account {\n\n    private String\
    \ name;\n```"
