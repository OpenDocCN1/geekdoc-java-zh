    types, like counters and gauges.


    The **MeterRegistry** is an interface with implementations supporting multiple
    monitoring systems. The **SimpleMeterRegistry** class, for example, can be used
    for testing purposes because it keeps metrics data only in memory. For real-world
    scenarios, you might use the **PrometheusMeterRegistry** if your monitoring is
    Prometheus. You can create a **SimpleMeterRegistry** using the following code:


    ```

    MeterRegistry registry = new SimpleMeterRegistry();

    ```


    By default, registry publishes metrics only to one monitoring system, but it is
    possible to publish metrics data to multiple monitoring systems by using the **CompositeMeterRegistry:


    ```

    CompositeMeterRegistry composite = new CompositeMeterRegistry();

    ```


    The metrics generation activity always starts with a registry, regardless of whether
    it is a single or composite one. Next, let us check how registries use meters
    to capture metric data.


    # Meters and tags


    Micrometer supports a set of distinct metrics that are defined as meters. Some
    of the most used meters are the counter, timer, gauge, distribution summary, and
    timer. Every meter has a name and a group of dimensions, known also as tags. Tags
    enable you to put more context into the metric data that is being captured. For
    example, we can have a counter named `.request` with tags like the HTTP method,
    browser, and operating system. Consider the following example:


    ```

    SimpleMeterRegistry meterRegistry = new SimpleMeterRegistry();

    var httpMethod = "GET"

    Counter.builder("http.request")

    .tag("HTTP Method", httpMethod)

    .register(meterRegistry)

    .increment();

    ```


    This code creates a counter meter with a tag that specifies the request''s HTTP
    method. Here, we manually set it to GET, in a real-world scenario, we get the
    HTTP method from the underlying technology handling the HTTP request. The more
    tags we add, the more increase the metric dimensionality, the more metric more
    valuable because we can slice and dice through the metric tags.


    # Counters


    There are scenarios where we are interested in the frequency at which something
    occurs inside the system. Imagine a web application that receives HTTP requests
    at different endpoints. We can use a counter to measure the rate at which the
    application processes HTTP requests. A counter corresponds to a positive number
    that can be incremented by one or any other number. The following is how we can
    create and use a counter:


    ```

    SimpleMeterRegistry meterRegistry = new SimpleMeterRegistry();

    Counter httpRequestCounter = Counter

    .builder("http.request")

    .description("HTTP requests")

    ```'
