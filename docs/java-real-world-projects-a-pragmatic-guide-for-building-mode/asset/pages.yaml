    # # Conclusion


    In this chapter, we explored monitoring and observability. We learned that monitoring
    refers to the traditional approach of understanding system behavior through metrics,
    logs, dashboards, and alerts. We discovered that observability complements traditional
    monitoring techniques and is especially helpful for understanding the behavior
    of systems based on distributed architectures, like microservices.


    We implemented a simple distributed system based on Spring Boot applications that
    can generate traces. On top of these traces, we configured OpenTelemetry Collector
    to capture traces and send them to the Jaeger, which lets us visualize traces
    and their spans.


    Finally, we configured centralized logging using the **Elasticsearch**, **Fluentd**,
    and **Kibana (EFK)** stack, which aggregates logs from different applications.


    In the upcoming chapter, we will look at the exciting world of **Micrometer**,
    a library that has the potential to enhance the observability of Java applications
    significantly. We will learn the importance of providing application-specific
    metrics to enable better monitoring of application behaviors and how to implement
    such metrics.'
