  md: '# CHAPTER 13

    Fast Application Development with

    Layered Architecture


    # Introduction


    Whenever a new software project is started, developers need to decide how the
    different software components will be structured and interact with each other
    to fulfill requirements. Such decisions are made to provide working software running
    in production in the best way possible. Over the years, developers have been exploring
    techniques to structure application code that produces working software and let
    them do so sustainably by identifying and separating concerns in a software systemnOne
    technique, known as layered architecture, is widely adopted in the enterprise
    software industry due to its reasonable simplicity and pragmatic approach. When
    employing layered architecture, it does not take too much to implement it and
    explain to other team how it works, which may make it a viable alternative for
    those wanting to deliver working software faster while keeping, to a certain degree,
    order on how the application code is structured. In this chapter, we will explore
    layered architecture and how we can use it to develop better-structured Java applications.


    # Structure


    The chapter covers the following topics:


    +   - Importance of software architecture

    - Understanding layered architecture

    - Handling and persisting data in the data layer

    - Defining business rules in the service layer

    - Exposing application behaviors in the presentation layer

    - Compiling and running the sample project


    # Objectives


    By the end of this chapter, you will understand layered architecture by arranging
    the application code into layers, each holding a specific responsibility. You
    will learn how the layered approach helps establish boundaries in the application
    code, which can contribute to identifying and separating concerns in a software
    system, positively influencing the overall software architecture. To solidify
    the concepts explored in this chapter, we will examine the development steps to
    implement a java application using layered architecture ideas.'
