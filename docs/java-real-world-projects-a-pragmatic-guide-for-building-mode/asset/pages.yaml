    # ZoneDateTime


    In all the previous examples we have seen so far, **LocalDate**, **LocalTime**,
    and **LocalDateTime** provide all date and time without considering a time zone.
    There are cases where the time zone is helpful as part of the date-time object.
    We can save date-times using the time zone of the region where the Java application
    is running, creating scenarios where a scenario is available for users in different
    time zones. Using **Coordinated Universal Time (UTC)**, a universal way to represent
    time, no matter the region where the Java application is running, can be numerous;
    to enable them, we use the **ZonedDateTime** class, which works similarly to LocalDateTime
    but with support for time zones. The following is how to create a **ZonedDateTime**
    object representing the current date and time.


    ```

    System.out.println(ZonedDateTime.now()); // 2024-01-28T23:43:26.709136750+01:00[Europe/Berlin]

    ```


    ```

    System.out.println(ZonedDateTime.now(ZoneId.of("Japan"))); // 2024-01-29T07:47:47.33.20625569+09:00[Japan]

    ```


    In addition to the date and time components, we have the time zone component as
    +01:00[Europe/Berlin] when calling the **now** method with a parameter defining
    a time zone and +09:00[Japan] when calling the **now** method with the Java time
    zone default.


    It is possible to convert the **ZonedDateTime** to a **LocalDateTime:**


    ```

    var localDateTime = LocalDateTime.now();

    ```


    ```

    System.out.println(LocalDateTime.of(localDateTime, ZoneId.of("UTC"))); // 2024-01-28T23:55:27.04617893[UTC]

    ```


    Remember that the **now** method gets the current date and time based on the operating
    system''s default time zone unless we force the **Java Virtual Machine (JVM)**
    to use another time zone. The example above gets the local date and then converts
    it to UTC when creating a **ZonedDateTime**.


