  md: 'Jakarta EE proposes a multitier architecture for developing enterprise applications.
    Let us explore what multitier applications mean further.


    # Designing multitier applications


    An enterprise system is often composed of different components that complement
    each other to provide valuable functionalities. Such components are grouped into
    tiers according to their responsibility in the enterprise system. In the following
    section, we examine the Jakarta EE tiers.


    # Client tier


    The client tier is where all the enterprise system clients live. A client can
    be a user interface (UI) served through a web browser or desktop application that
    interacts with the enterprise system. Other applications that are not UIs can
    also act as clients of the enterprise system. The main characteristic of the client-tier
    components is that they trigger behaviors in the enterprise system by making requests
    to it. A client is technology-agnostic; it can be developed in Java or any other
    technology.


    # Web tier


    An enterprise system may offer a web application that renders HTML pages accessible
    through a web browser. Although not so common today, where most front-end development
    is client-side, support for server-side front-end applications is also part of
    the Jakarta EE specification. Jakarta Server Pages (JSP) and Jakarta Server Faces
    (JSF) specifications, built on top of the Jakarta Servlet specification, are the
    technologies we find on the web tier that enable enterprise system components
    to serve web resources.


    # Business tier'
  merge: -1
  pgno: 207
- img_proc: true
  md: 'Business rules represent the most critical component of an enterprise system.
    Whatever business problem an enterprise system aims to solve, the business tier
    has components containing the business logic responsible for solving it. That
    is where Jakarta EE components like Jakarta Persistence entities and stateless,
    stateful, and message-driven beans, also known as enterprise beans, are used to
    solve business problems.


    # Enterprise information system tier


    Jakarta EE enterprise applications depend on external systems like databases,
    mainframes, **enterprise resource planning (ERP)**, and any other system that
    provides data to fulfill the enterprise application requirements. These external
    systems comprise the enterprise information system tier.


    The following figure illustrates how the tiers relate to each other:'
