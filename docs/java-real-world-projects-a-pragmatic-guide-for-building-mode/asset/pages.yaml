    # Introduction


    Gone are the days when we used to deploy Java applications in heavyweight application
    servers running on expensive dedicated hardware. Nowadays, it is far more common
    to see Java systems running in Kubernetes clusters offered by major cloud providers
    like Amazon Web Services (AWS), Google Cloud Platform (GCP), or Microsoft Azure.
    delegating most of their computing infrastructure operations to cloud providers,
    organizations can allocate their time to activities that have more potential to
    generate profit or reduce costs. The Java developer working in an organization
    that has its infrastructure on the cloud must know how to tap into the benefits
    of running Java applications in cloud-native environments. That is why this chapter
    explores good practices for deploying and running Java applications using technologies
    like Docker and Kubernetes.'
  merge: -1
