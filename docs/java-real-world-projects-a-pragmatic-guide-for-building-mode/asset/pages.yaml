  md: '![](img/9b5739f37699f084397670714bf63edd_327_0.png)


    By providing the name file_request_total as the query expression, Prometheus returns
    the metrics data in its raw state. The example shows that we have the same metric
    with method tags showing how many GET and POST requests arrived at /file endpoint.
    We can filter GET metric data with the following expression:


    ```

    file_request_total(method="POST")

    ```


    Which would return as follows:


    ```

    file_http_request_total(instance=localhost:8080, job="File Storage", method="POST",
    path="/file") 4

    ```


    Number 4 shows how many POST requests were captured as metric data. With PromQL,
    we can also check how many requests are arriving per second:


    ```

    rate(file_http_request_total(method="POST", path="/file"[5m]))

    ```


    The example uses the rate function, which allows us to perform the calculation
    and tells how many requests are arriving per second in the last five minutes.
    The result after the expression can return:


    ```

    {instance=localhost:8080, job="File Storage", method="POST", path="/file"} 0.031571689762439

    ```


    0.031571689762439 tells us the per-second rate at which the system processes POST
    requests for the /file endpoint.

    PromQL offers functions that let us aggregate metric data. In addition to the
    rate function, we can use the sum function to accumulate data or the top to get
    the top aggregation results, for example.


