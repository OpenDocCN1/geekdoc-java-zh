    # Increasing application throughput with virtual threads


    A thread is always linked to a process in the operating system. Multiple threads
    in each process share the same resources because they are part of the same process.
    Some programs may contain just one thread because their logic does not require
    concurrent processing. In this case, you see a process and a thread in the operating
    system. Other programs may create multiple threads because they must trigger different
    sequences of activities that must be executed concurrently, as such one thread
    request.


    A server application may receive multiple requests at the same time. A single
    process in the operating system represents a running application. To serve various
    requests simultaneously, the server can allocate individual threads to serve each
    request. However, such an approach comes with a computing resource price. Threads
    are expensive to create because they need considerable memory and CPU. Bottlenecks
    may quickly happen if you create more threads than available computing resources.
    Careful usage of threads is one of the challenges developers face when building
    concurrent applications.


    With these basic processes and thread concepts in mind, let us see how Java deals
    with threads.


    # Understanding Java platform threads


    We know that Java code runs in the Java Virtual Machine (JVM), executed as a process
    in the operating system. Every Java program has at least one thread, called the
    main thread. When we create a platform thread in Java, the JVM'
  merge: -1
