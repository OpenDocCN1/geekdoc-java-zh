  md: 'that input adapters that provide an interface enabling drivers to interact
    with the hexagonal application. Input adapters resemble physical adapters in a
    way that both the purpose of fitting the format of something into another thing.
    From the software system perspective, a format can be seen as a protocol supported
    by a hexagonal system. The support of a protocol depends on the notion of an API
    that establishes technologies are used to communicate with the hexagonal application.
    We can define APIs using HTTP-based solutions like RESTful, gRPC, or SOAP. Depending
    on the use case, we can explore protocols for file transfer or SMTP for email
    delivery.


    Hexagonal architecture allows us to support as many technologies as we want in
    the form of input adapters. A hexagonal application can be initially defined to
    provide an input adapter RESTful requests. A new input adapter supporting gRPC
    calls can be quickly introduced by the application matures. Adding new input adapters
    impacts only the framework hexagon. The code on the application and domain hexagons
    are entirely protected from changes on the framework hexagon. One or more input
    adapters can be connected to the same input port, which allows access to the same
    system functionality provided by the input port and exposes it different technologies
    supported by the input adapters.


    Input adapters are the hexagonal elements that open the door for those interested
    in the functionalities offered by the hexagonal application. However, to enable
    those functionalities, the hexagonal application needs to get data and access
    systems by different technologies. Access to these systems is made possible through
    the usage of output adapters. Let us explore them next.


    # Output adapters


    Most-backend applications depend on other systems to control their activities.
    Such dependency can be expressed by the need to access, for example, an external
    API responsible for processing payments, a scheduler system that executes tasks
    in a predetermined time, a message broker that allows asynchronous processing,
    or a database for data persistence. Countless scenarios can be used as dependency
    examples The critical concept here is that every dependency outside the hexagonal
    application is handled through an output adapter.


    Output adapters support the driven side of a hexagonal system. They are direct
    implementations of the output ports defined in the application hexagon. Through
    the output adapters, we define the code responsible for dealing with whatever
    technology is necessary to provide the data or behave within the hexagonal application
    functionalities. The system can start persisting data in MySQL databases and evolve
    without major refactoring to support Oracle databases. Every new technology is
    supported by a new output adapter implementing the same output port that expresses
    which kind of data, on the domain hexagon; the hexagonal system requires.


