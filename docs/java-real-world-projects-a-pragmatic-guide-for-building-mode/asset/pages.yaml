  md: '# Handling blocking IO with reactive programming


    In the previous section, we discussed how imperative programming is more developer-friendly
    because of its sequential nature, which makes it more predictable and maintainable.
    Although easier to write, programs that rely on imperative programming may face
    bottlenecks when using platform threads to handle many concurrent IO-blocking
    operations.


    As an alternative to imperative programming, where a program is designed to react
    to events. Instead of describing sequentially what an application must do, we
    need to think about which events can occur and how our application will respond
    to such events. Reactive programming is often used when an application needs to
    overcome blocking IO issues. An application can address such issues by running
    asynchronous tasks.


    In the reactive programming approach, asynchronous behavior is usually achieved
    through non-blocking IO threads. These threads trigger IO operations and are immediately
    released instead of being blocked waiting for a response. A continuation mechanism
    on non-blocking threads allows them to receive a callback response once the IO
    operation is finished, allowing an IO thread to continue the task execution. The
    following figure illustrates how non-blocking IO threads deal with IO operations:'
  merge: -1
  pgno: 84
- img_proc: true
  md: '![](img/9b5739f37699f084397670714bf63edd_85_0.png)


    **Figure 2.3:** IO thread triggering IO operation


    In the image above, the non-blocking IO tasks 1# and 2# run in parallel in non-blocking
    IO threads, which means no threads hanging waiting for a response. Once the IO
    operation finishes, the non-blocking IO task resumes and continues its execution.
    Once the IO operation finishes, the non-blocking IO task may continue in a different
    thread than it had started.


    The fact that the execution of non-blocking IO tasks is distributed in different
    threads creates a debugging challenge because the task stack trace will be scattered
    among distinct threads. If something fails, we may need to investigate the execution
    of more than one thread to understand what happened. In imperative programming,
    for example, we can rest assured the stack trace of a single task is confined
    to one thread, which considerably decreases the debugging effort.'
