    Note the randomId changes every time a new request is sent, which confirms that
    new Account beans are being created for each request.


    In addition to the application-scoped, singleton, and request-scoped, there are
    also the dependent, session, and other customized scopes. Those scopes provide
    different behaviors that are helpful in specific situations; however, most of
    the time, you will be using the scopes we covered in this section.


    Quarkus comes with solid support for data persistence. Let us explore it next.


    # Persisting data with Hibernate


    Quarkus has built-in JDBC support for many database technologies, so you can easily
    connect your Quarkus application to a database. It relies on Hibernate ORM as
    the Jakarta Persistence. Quarkus also has a library called Panache, which significantly
    enhances the experience of handling Jakarta Persistence entities. In this section,
    we explore all the aspects related to establishing a database connection and handling
    entities. We start by learning how to make Quarkus ready to work with databases.


    # Setting up Quarkus to work with databases


    To enable database support to an existing Quarkus project, we need to add the
    required extensions:


    ```

    $ quarkus add quarkus-hibernate-orm quarkus-hibernate-orm-panache quarkus-jdbc-h2

    [SUCCESS] ✅ Extension 10.quarkus:quarkus-hibernate-orm has been installed

    [SUCCESS] ✅ Extension 10.quarkus:quarkus-hibernate-orm-panache has been installed

    [SUCCESS] ✅ Extension 10.quarkus:quarkus-jdbc-h2 has been installed

    ```


    The quarkus-hibernate-orm and quarkus-hibernate-orm-panache extensions add Hibernate
    ORM support with the Quarkus Panache library. The Quarkus-jdbc-h2 extension adds
    the H2 in-memory JDBC driver to the Quarkus application. Once the dependencies
    in place, we can configure the database connection and how Hibernate should behave
    through the application.properties file:


    ```

    quarkus.datasource.url=jdbc:h2:mem:default

    quarkus.datasource.password=password

    quarkus.hibernate-orm.database.generation=drop-and-create

    ```


    As we use the H-memory database, settings like username and password are optional
    because Quarkus provides them with a default configuration. However, we need to
    specify the JDBC URL, which in our case, refers to the H2 database that will only
    exist during the application runtime. By setting quarkus.hibernate-orm.database.generation
    drop-and-create, we instruct Quarkus to create database tables based on the Jakarta
    Persistence entity classes defined in the Quarkus application. When the drop-and-create
    option is used with ordinary databases like MySQL or PostgreSQL, it recreates'
