    # # Using Spring context to manage beans


    When we decide to use Spring to develop an application, we must know that we are
    delegating part of the execution to the **Inversion of Control** (IoC) idea, where
    by execution control, the application is not the only responsible for creating
    instances of objects it needs to perform its activities. The Java objects management
    responsibility can be transferred from the Java application being developed to
    Spring, effectively injecting the object management control from the Java application
    to the Spring Framework. A similar idea can be applied to dependency handling,
    where Spring provides the dependencies that the application requires rather than
    the other way around, where the application itself needs to provide its dependencies


    This discussion about responsibilities is essential because it enables us to understand
    the purpose of the Spring context, which is used to manage objects managed by
    Spring. If we want our application to benefit from Spring''s features, we need
    to consider which objects of our application must be handled by Spring. The way
    we make Spring manage objects is by putting them into context. These objects managed
    by Spring are also known as beans. We can create beans from the classes of the
    application we are developing, but we can also create beans from classes of third-party
    libraries.


