  md: 'Jakarta EE is a set of specifications for developing enterprise applications
    in Java. The Jakarta EE project does not provide the implementations for those
    specifications. It is up to the Jakarta EE vendors to implement them. Developers
    use the specification to build their applications and can choose which Jakarta
    EE vendor suits their needs. Jakarta EE implementation is provided through Java
    libraries that implement the specification interfaces. These libraries are shipped
    together with the application server offered by a Jakarta EE vendor that implements
    the specifications or relies on third parties that implement some of the specifications.
    Oracle WebLogic, IBM WebSphere, Payara, and Eclipse Glassfish are some of the
    Jakarta EE vendors in the market.


    All the Jakarta EE individual specifications are grouped into the Jakarta EE Platform
    and Profile specifications. Let us examine the purpose of each specification further.


    # Jakarta EE Platform specification


    We have seen previously that Jakarta EE projects are based on a multitier architecture
    where different application components interact across the client, web, business,
    and **enterprise information system (EIS)** tiers. Components from the web and
    business tiers run in containers, a runtime environment provided by a Jakarta
    EE server. There are web containers responsible for executing web resources like
    **Java Server Page (JSP)** and **Enterprise Java Bean (EJB)** containers that
    execute business logic code. Components from the client and EIS tiers usually
    run outside a Jakarta EE server and interact with components from the web and
    business tiers. Running outside a Jakarta EE server, we may have client systems
    making calls to enterprise applications and databases providing data to such applications.


    The Jakarta EE Platform specification establishes what is required from a platform
    aiming to host Jakarta EE'
