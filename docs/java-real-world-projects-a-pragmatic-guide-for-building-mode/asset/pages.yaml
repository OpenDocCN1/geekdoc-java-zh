  md: '# # CHAPTER 10

    Implementing Application Metrics with Micrometer


    # ## Introduction


    Understanding how an application behaves through metrics can help us remediate
    issues faster or prevent problems from getting worse. Metrics play a fundamental
    role in monitoring because they us capture the state of the functionalities provided
    by the application. When interpreted, these states indicate whether they are working
    as expected or if there are deviations requiring further investigation.


    To harness the power of metrics in Java applications, we need to adjust them by
    configuring metrics to track application behaviors. We can do this using Micrometer,
    a well-known Java library that allows us to instrumentalize Java applications
    to generate metrics. That is why, in this chapter, we will explore how Micrometer
    works, the metrics types it provides, and how and when we should use these metric
    types.


    # ## Structure


    The chapter covers the following topics:


    +   - Providing application metrics

    - Introducing Micrometer

    - Using Micrometer and Spring Boot to implement metrics

    - Compiling and running the sample project


    # ## Objectives


    By the end of this chapter, you will learn the benefits of instrumentalizing Java
    applications to generate metrics that describe how well the system is performing
    its activities. Knowing the advantages of application-specific metrics, you will
    also learn how to implement them using Micrometer, a powerful metrics library
    for Java.


    # ## Providing application metrics


    Software systems are made of a set of instructions aimed at solving real-world
    problems. As programmers, we must understand what kind of real-world problems
    our applications intend to solve. It does not mean extensive expertise in a given
    field, like finance or medicine, is required to develop functional software. We
    do not need to be bankers to create good banking software. However, having substantial
    problem domain knowledge is invaluable for any developer. Such knowledge usually
    frames a specific aspect of an area'
  merge: -1
  pgno: 305
- img_proc: true
  md: 'that, for some reason, needs software to solve specific problems. So, the developed
    application should contain solutions for such specific problems.


    The solutions software are materialized through a set of application behaviors
    that handle data by rules and instructions defined by business logic code. The
    business logic in enterprise systems is the codified expression of real-world
    problems. The enterprise system is being emphasized to reinforce the focus on
    applications developed in a commercial, quite often generic, context. As the codified
    representation of real-world problems, the business logic plays a critical role
    in the success of any enterprise application. Knowing that the business logic
    is vital, how can we monitor it that it works as expected the application in production?
    Let us check it next.


    There are two significant journeys in the software development lifecycle. The
    first journey is where-solving ideas are turned into working code. The second
    journey starts when the software is produced and made available to users. Only
    after users begin to use our software, quite often in ways can we really learn
    how the business logic is fulfilling users expectations. Such learning can occur
    the hard way when something goes wrong, and we discover it because a user reported
    application failure. We can learn the effectiveness of business logic through
    application-specific metrics implemented in strategic systems to track critical
    behaviors. Having application-specific metrics placed in the right system gives
    us the necessary visibility to predict potential failure before it becomes too
    big and causes a significant impact on the users. There will be in cases where
    prediction will not be possible. Still, the troubleshooting time will be shorter
    if the metrics are used as a starting point to investigate the user''s root cause
    and potential solutions.


    It is important to remember that employing application-specific metrics is not
    a one-time activity. We usually start with metrics based on initial assumptions
    regarding what behaviors should be tracked in the application; then, we add more
    metrics based on what we learn by how the application reacts when users use it.


    Having covered why we should implement metrics in our applications, let us learn
    about the Micrometer library, which helps us instrument Java applications with
    metrics.


    # Introducing Micrometer


    Designed to be an agnostic metrics solution, Micrometer is a powerful library
    that lets us instrumental java systems to produce metrics. It is considered agnostic
    because the Micrometer metrics are non-generic; they can work with different vendors.
    Micrometer metrics are compatible, for example, with tools like Elastic and Dynatrace
    to name a few. Using Micrometer allows us to switch across monitoring vendors
    without having to refactor the Java application.


    Micrometer works so the metrics are produced by the instrumentalized Java application
    exposes an endpoint used by external monitoring tools Prometheus, for example,
    record metrics in a time series database. Having a place to record the metrics
    produced by a Java application is beneficial because the application is restarted,
    the metrics collected before are gone unless we have stored them elsewhere.


    This section explores some core Micrometer concepts, like the registry and metrics,
    and some of the most used meter types, including counters, gauges, timers, and
    distribution summaries. Lets proceed by checking what is a registry in Micrometer.


    # Registry


    The registry is represented through the MeterRegistry interface, which acts as
    the fundamental component of the Micrometer architecture. All metrics produced
    by the'
