  md: 'one intermediate operation as the input for the next intermediate operation.
    Because of this continuing and compounding nature, these operations are called
    intermediate. They do not represent the final outcome of the stream processing.


    Here are some common intermediate operations examples:


    ```

    Stream<String> ofStrings = Stream.of("Element 1", "Element 2",

    "Element 3");

    ```


    ```

    Stream<String>intermediateStream1 = streamOfStrings.map(value ->

    toupperCase());

