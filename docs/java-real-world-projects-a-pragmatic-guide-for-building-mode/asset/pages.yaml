    Creating a statement with the ResultSet.CONCUR_UPDATABLE option is required to
    obtain a ResultSet object that can perform changes in the database. In the example,
    where we want to update a person country, we traverse the ResultSet that contains
    all rows matching the SELECT statement that returns all rows where the first name
    is james. Once we are in the ResultSet cursor position of the row we want to change,
    we call resultSet.updateString("COUNTRY", country) where "COUNTRY" is the column
    name and country is the value we want to use for update. Similar to get methods,
    the update methods from the ResultSet are also on the database columns, providing
    methods like updateInt, updateBoolean, and so on. The update only persists in
    the database until we call resultSet.updateRow().


    The Statement, PreparedStatement, CallableStatement, and ResultSet interfaces
    are the building blocks of which the JDBC API allows Java applications to handle
    relational databases. Relying on the JDBC API is for those cases where creating
    SQL statements and directly manipulating the database results do not represent
    a maintenance burden.


    When a application manages and executes database statements, it may benefit from
