    \n# # Conclusion\n\nWe reach the end of this book with the exploration of the\
    \ hexagonal architecture. This software design technique lets us change-tolerable\
    \ applications by decoupling technology-related code from the code responsible\
    \ for solving business problems. This final chapter covered the fundamentals of\
    \ hexagonal architecture by exploring essential concepts like the domain hexagon\
    \ and its role in the domain model based on domain-driven design. We learned how\
    \ the hexagon application helps to express systems behaviors in a technology-agnostic\
    \ way, gives excellent flexibility by not coupling the hexagonal system with third-party\
    \ technologies. We also learned how the framework hexagon system is fundamental\
    \ in making the system behaviors compatible with different technologies.\n\nWe\
    \ could apply the ideas shared in this chapter by implementing the note keeper\
    \ system, a Spring Boot application structured using hexagonal architecture. This\
    \ application shows how to apply concepts like use cases, input and output ports,\
    \ and input and output adapters to create an application accessible through a\
    \ CLI interface and a REST API.\n\nAs we conclude this book, the author wants\
    \ to acknowledge the challenges you have faced and the knowledge you have gained\
    \ in our exploration of Java. You have persevered by exploring the core Java API,\
