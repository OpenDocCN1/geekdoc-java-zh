    # The Arrange-Act-Assert pattern


    The original AAA pattern is based on the following steps:


    +   The Arrange step arranges the data dependencies required to execute the test.


    +   On the Act (or Execute) step, we trigger the application behavior we want
    to test by usually calling an object''s method. That call usually returns a result
    that we use on the Assert step.


    +   Based on the result returned from the Act step, we check if the application
    behaved as we expected.


    It is common to find variances in the AAA pattern consisting of additional steps
    to clarify even more what the test is doing. Our test contains the additional
    Preparation, Pre-assert, and Post-assert steps. There is no general rule of thumb
    for organizing your tests but expressing it through steps can benefit everyone
    involved in maintaining them.


