    # Implementing reliable integration tests with Testcontainers


    The decision to use integration tests comes when we want to validate the interaction
    between different application components and how the application interacts with
    external dependencies like a database, for example. Integration tests are more
    expensive than unit tests because they require practically all the same dependencies
    the application would need if deployed somewhere. The increased setup cost comes
    with the benefit of running tests against real resources and data instead of using
    mocks when a resource is not available.


    With the popularization of container technologies like Docker, which enables us
    to bring up any system in seconds, Java projects have started to leverage containers
    to simplify the implementation of integration tests. The Testcontainers library
    stands out as one of the most well-known libraries providing containers for testing
    purposes. It provides a state-of-the-art solution that lets developers easily
    integrate containers into their integration tests.


    In this section, we will learn how to configure Testcontainers in our account
    registration application and use them to provide a MySQL database container used
    by an end-to-end integration test.'
