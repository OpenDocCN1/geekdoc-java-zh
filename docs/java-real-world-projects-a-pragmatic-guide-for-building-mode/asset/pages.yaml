  md: 'gives greater flexibility because we can define system functionalities without
    specifying which technologies will enable those functionalities.


    We learned earlier that input ports can rely on output ports to persist or retrieve
    data from systems on the hexagonal application''s driven side. Let us explore
    output ports.


    # Output ports


    Acting as abstractions, we use output ports to define what the hexagonal system
    needs from the outside. The idea here is to express the need to get some data
    without specifying how such data will be obtained. We do that to avoid dependency
    on the underlying technology that provides the data. If output ports are abstractions,
    may wonder who provides their implementations. That is the responsibility of the
    output adapter, which we will learn next when exploring the framework hexagon.


    # The framework hexagon


    There is a moment in developing a software system in which we must decide which
    technologies will enable the system functionalities. When creating a new system
    based on the hexagonal architecture, decisions can be postponed until the last
    moment when the domain model has already been implemented in the domain hexagon,
    and the use cases and orders are already defined in the application hexagon. What
    is left now is the integration of the hexagonal system with its externa dependencies,
    which may include database, email services, servers, protocols, and so on. The
    integration also covers providing an API that lets users and other systems send
    requests to the hexagonal application. The idea of having driven and driven sides,
    as discussed when covering ports in the hexagonal application, can also be applied
    when dealing with adapters in the framework hexagon.


    To recap, the driven side of the hexagonal application, we have actors such as
    users and other systems that can trigger system behaviors, and because of that,
    they are in a position to drive the hexagonal application. On the driven side,
    we have actors providing dependencies that drives these actors. The input adapters
    support the driver side, while the driven side is handled using output adapters.
    The framework hexagon is composed of input and output adapters that determine
    which technologies are supported by the hexagonal application, as shown in the
    following figure:


    ![](img/9b5739f37699f084397670714bf63edd_383_0.png)


    Figure 14.4: The framework hexagon


    Next, we explore what input and output adapters are and how we can use them to
    make hexagonal applications compatible with any technology.


    # Input adapters


    Once we have the hexagonal application expose features defined as use cases and
    implemented as input ports, we may want to expose those features to the outside
    world. We accomplish'
