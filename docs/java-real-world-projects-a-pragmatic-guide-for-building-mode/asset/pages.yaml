  md: 'As we embark on our journey to build a Spring Boot application, let us first
    understand the power of Spring and its core concepts. These are the building blocks
    that make Spring Boot a popular choice for Java developers.


    Previously, if you wanted to build applications supporting transactions, security,
    and data persistence, you could use a framework called Java Enterprise Edition
    (EE). That was the official framework initially offered by Sun Microsystems, which
    Oracle acquired. Oracle continued maintaining Java EE until it decided to open
    source the project by handing it to the Eclipse Foundation, which renamed Jakarta
    EE.


    Creating applications using Java EE in its first releases did not provide the
    best developer experience. Although sufficient to support the development of mission-critical
    applications, the Java EE Specifications were difficult to use and required considerable
    effort from developers to have things in place. This was when, around 2002, Rod
    Johnson decided to create the Spring Framework to deliver functionalities similar
    to those offered by EE but without the complexity of the official framework. Effectively,
    the Spring Framework was created as an interface for Java EE, providing a simpler
    abstraction for EE features like servlets, JPA (Java Persistence API), and messaging
    with JMS (Java Message Service). Since then, the adoption of the Spring Framework
    has tremendously increased over the years due to its ease of use, time-tested
    stability, outstanding developer experience, and engaging community.


    Spring is now an ecosystem of frameworks that serves the most diverse projects
    in software development. Well built on the backbone of the Spring project are
    other projects like Spring Data JPA, Spring Security, and of course, Spring Boot.


    The Spring Core project provides functionalities like context, dependency injection,
    and aspects found in most Spring applications.


    The Spring Boot project, in turn, takes an opinionated view from Spring maintainers
    to provide a framework that lets developers quickly bootstrap new applications,
    following a philosophy that favors convention over configuration.


    Let us start our exploration by learning what a Spring context is and how we can
