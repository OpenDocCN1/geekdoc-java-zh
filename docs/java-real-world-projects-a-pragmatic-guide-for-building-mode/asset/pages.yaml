  md: 'The Java Framework Collections is an extensive topic with much more than we
    covered in this session. Going into every aspect of this topic is out of this
    book''s scope. So, this session focused on collection approaches commonly seen
    in Java projects. Let us see now how we can efficiently handle files using Java.


    # Using the NIO to manipulate files


    Numerous cases can be where a Java application needs to interact with the operating
    system to handle files and directories. The author recalls a project where they
    worked with a system that generated reports and made them available through files
    for download. The application would run logic to create the report and save it
    somewhere in the file system where the JVM was running. After finishing, the application
    would provide a URL to download the report.


    Depending on your use case you may handle files and directories with Java. The
    good news is that Java has a powerful I/O API called NIO (Non-blocking I/O, version
    2), allowing an intuitive and smooth file system management experience. We can
    find the NIO2 API in the Java.nio package. There is also the standard I/O path
    in the Java.io package, but this is how to handle files in Java. New applications
    should rely on the NIO2 API.


    Our focus in this section will be on the NIO2 API because it provides modern features
    to handle files and directories.


    # Creating paths


    A file system represents how files and directories are organized in an operating
    system. Such representation follows a tree-based structure where we have a root
    directory and other directories and files below it. We have two kinds of file
    systems, one deriving from Windows and another from Unix (e.g. Linux or macOS).
    On Windows, the root directory is usually C:, while on Linux, it is /,


    How we separate paths can also change depending on the operating system. For example,
    on Windows, we use the backslash \ while on Linux, it is the forward slash /


