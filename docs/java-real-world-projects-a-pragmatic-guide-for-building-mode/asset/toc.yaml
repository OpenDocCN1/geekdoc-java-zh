  - 第 1 章：重新回顾 Java API
- - '##'
  - 引言
- - '##'
  - 本章重新回顾了真实项目中常见的 Java 核心 API。首先探索了 Collections API 的数据结构，展示了在 Java 系统中将数据处理为对象的可能方式。考虑到文件处理的频繁性，本章展示了如何使用
    NIO2 操作文件。通过对异常的深入检查以及后续日志 API，为有效的错误处理和增强的日志管理奠定了坚实基础。由于大多数 Java 应用程序都需要处理日期和时间，书中还探索了
    Date-Time API。章节最后涵盖了流处理和 Lambda 等函数式编程特性，展示了如何编写更高效简洁的 Java 代码。
