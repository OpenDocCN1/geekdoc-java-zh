  \n**解答：可以。** 让我们看看动态规划如何解决这个问题。这让我们写出递归公式：\n\n![images](img/image1554.jpeg)\n\n\
  #### 问题-11 给定一个 `n` 个数字的序列 `A(1)`...`A(n)`，给出一个算法寻找连续子序列 `A(i)`...`A(j)`，使其子序列中的元素之和最大。这里的条件是我们不应该选择*三个*连续数字。\n\
  \n\n\n\n\n假设 `M(i)` 表示从 1 到 `i` 个数字中在不选择三个连续数字的情况下的最大和。在计算 `M(i)` 时，我们需要做出的决策是是否选择第\
  \ `i^(th)` 个元素。这为我们提供了以下可能性：\n\n![images](img/image01567.jpeg)\n\n• 在给定的问题中，限制是不选择三个连续的数字，但我们可以连续选择两个元素并跳过第三个。这就是上述递归公式中第一种情况的情况。这意味着我们跳过了\
  \ `A[i – 2]`。\n\n• 另一种可能性是，选择第 `i^(th)` 个元素并跳过第二个 `i – 1^(th*)` 个元素。这是第二种情况（跳过 `A[i\
