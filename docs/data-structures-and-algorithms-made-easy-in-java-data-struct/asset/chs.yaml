  \ 哈希是如何获得 O(1) 复杂度的？\n### 14.15 哈希技术\n## 14.16 不适用于哈希表的问题\n### 14.17 布隆过滤器\n## 14.18\
  \ 哈希：问题与解决方案\n## 16.2 分类\n通常，第一种情况被称为算法的`最好情况`，第二种情况被称为算法的`最坏情况`。分析算法我们需要某种语法，这构成了渐近分析/表示法的基础。分析有三种类型：\n\
  \n* **最坏情况：** 定义算法花费时间最（最慢完成）的输入。这些是算法运行最慢的输入。\n* **最好情况：** 定义算法花费时间最少（最快完成）的输入。这些是算法运行最快的输入。\n\
  * **平均情况：** 对算法的运行时间提供预测。\n\n\n\n\n\n`void push(int data)`：将 `data` 插入栈。\n\n`int\
  \ pop()`：移除并返回最后插入的元素。\n\n#### 辅助栈操作\n\n`int Top()`：返回最后插入的元素但不移除。\n\n`int Size()`：返回栈中存储数量。\n\
  \n`int EmptyStack()`：指示栈是否存储了元素。\n\n`int IsFullStack()`：指示栈是否满。\n\n### 4.4 异常\n\n\
  尝试执行操作有时会导致错误状态，称为异常。异常是由无法执行的操作“抛出”的。在栈 ADT 中，如果栈为空，则无法执行 `pop` 和 `top` 操作。在空栈上尝试执行\
  \ `pop` (`top`) 会抛出异常。在满栈上尝试插入元素会抛出异常。\n\n\n\n\n• 其他数据结构的组件（例如：模拟队列，请参阅 `Queues`\
  \ 章节）\n\n## 4.6 实现\n\n实现栈 ADT 有许多方法；以下是常用的方法。\n\n• 基于简单数组的实现\n• 基于动态数组的实现\n• 基于链表的实现\n\
  \n### 简单数组实现\n\n这种栈 ADT 实现使用了数组。在数组中，我们从左到右添加元素，并使用一个变量来跟踪栈顶元素的索引。\n\n![Image](img/image00708.jpeg)\n\
  \n存储栈元素的数组可能会满。此时，`push` 操作将抛出 `full stack exception`。同样地，如果我们尝试从一个空栈中删除元素，它将抛出\
  \ `stack empty exception`。\n\n![Image](img/image00709.jpeg)\n\n#### 性能与局限性\n\n**性能：**\
  \ 设 `n` 为栈中元素的个数。这种表示法下栈操作的复杂度如下：\n\n| 空间复杂度（对于 `n` 次 push 操作） | O(`n`) |\n| :---\
  \ | :--- |\n| `push()` 的时间复杂度 | O(1) |\n| `pop()` 的时间复杂度 | O(1) |\n| `size()` 的时间复杂度\
  \ | O(1) |\n| `isEmpty()` 的时间复杂度 | O(1) |\n| `isFullStack()` 的时间复杂度 | O(1) |\n|\
  \ `deleteStack()` 的时间复杂度 | O(1) |\n\n**局限性：** 必须首先定义栈的最大尺寸且不能更改。尝试向满栈中 `push` 新元素会导致特定实现的异常。\n\
  \n### 动态数组实现\n\n首先，让我们考虑如何实现基于简单数组的栈。我们取一个索引变量 `top` 指栈中最近插入元素的索引。要插入（或 `push`）元素，我们增加\
  \ `top` 索引并将新元素放在该索引处。\n\n同样，要删除（或 `pop`）元素，我们取出 `top` 索引处的元素，然后减少 `top` 索引。我们用\
  \ `top` 等于 1 表示空栈。仍然需要解决的问题是，当固定大小数组栈的所有槽都被占用时，我们该怎么办？\n\n**第一次尝试：** 如果每次栈满时都将数组的大小增加\
  \ 1 会怎样？\n\n• `Push()`：将 `S[]` 的大小增加 1\n• `Pop()`：将 `S[]` 的大小减少 1\n\n#### 这种方法的问题？\n\
  \n这种增加数组大小的方法代价太高了。让我们来看看原因。例如，当 `n` = 1 时，为了推送一个元素，创建一个大小为 2 的新数组并将所有旧数组元素复制到新数组中，最后添加新元素。在\
  \ `n = 2` 时，为了推送一个元素，创建一个大小为 3 的新数组并将所有旧数组元素复制到新数组中，最后添加新元素。同样，在 `n = n – 1` 时，如果我们想推送一个元素，创建一个大小为\
  \ `n` 的新数组并将所有旧数组元素复制到新数组，最后添加新元素。经过 `n` 次 `push` 操作，总时间 `T(n)`（复制次数）正比于 1 + 2 +\
  \ ... + n ≈ O(`n²`)。\n\n#### 替代方法\n\n让我们使用翻倍技术来改进复杂度。如果数组满了，创建一个大小翻倍的新数组并复制元素。通过这种方法，推送\
  \ `n` 个元素的时间正比于 `n`。\n\n为了简单起见，假设我们最初从 `n = 1` 开始移动到 `n = 32`。这意味着翻倍操作发生在 1, 2,\
  \ 4, 8, 16。另一种分析方法是：在 `n = 1` 时，如果我们想添加（push）一个元素，将当前数组翻倍并将旧数组元素复制到新数组。在 `n = 1`\
  \ 时，我们做 1 次复制；在 `n = 2` 时，我们做 2 次复制；在 `n = 4` 时，我们做 4 次复制，以此此类推。当我们达到 `n = 32` 时，复制总次数为\
  \ 1+2+4+8+16，约等于 `2n`。如果仔细观察，我们正在进行 `log n` 次翻倍操作。现在让我们推广讨论。对于 `n` 次 `push` 操作，我们将数组大小翻倍\
  \ `log n` 次。这意味着下方的表达式会有 `log n` 项。`n` 次 `push` 操作的总时间 `T(n)` 正比于\n\n![Image](img/image00710.jpeg)\n\
  \n`T(n)` 是 O(`n`)，且 `push` 操作的摊还时间为 O(1)。\n\n![Image](img/image00711.jpeg)\n\n![Image](img/image00712.jpeg)\n\
  \n![Image](img/image00713.jpeg)\n\n**性能：** 设 `n` 为栈中元素的个数。这种表示法下操作的复杂度如下：\n\n| 空间复杂度（对于\
  \ `n` 次 push 操作） | O(`n`) |\n| :--- | :--- |\n| `create Stack: DynArrayStack()`\
  \ 的复杂度 | O(1) |\n| `push()` 的时间复杂度 | O(1) |\n| `pop()` 的时间复杂度 | O(1) |\n| `size()`\
  \ 的时间复杂度 | O(1) |\n| `isEmpty()` 的时间复杂度 | O(1) |\n| `isFullStack()` 的时间复杂度 | O(1)\
  \ |\n| `deleteStack()` 的时间复杂度 | O(1) |\n\n#### 链表实现\n\n实现的另一种方法是使用链表。`push` 操作通过在开头插入元素来实现。`pop`\
  \ 操作通过从开头删除节点来实现。\n\n![Image](img/image00714.jpeg)\n\n![Image](img/image00715.jpeg)\n\
  \n性能：设 `n` 为栈中元素的个数。这种表示法下操作的复杂度如下：\n\n| 空间复杂度（对于 `n` 次 push 操作） | O(`n`) |\n| :---\
  \ | :--- |\n| `create Stack: DynArrayStack()` 的复杂度 | O(1) |\n| `push()` 的时间复杂度 |\
  \ O(1) |\n| `pop()` 的时间复杂度 | O(1) |\n| `top()` 的时间复杂度 | O(1) |\n| `isEmpty()` 的时间复杂度\
  \ | O(1) |\n| `isFullStack()` 的时间复杂度 | O(1) |\n| `deleteStack()` 的时间复杂度 | O(1) |\n\
  \n## 4.7 实现对比\n\n#### 比较增量策略与翻倍策略\n\n我们通过分析执行 `n` 次 `push` 操作所需的总时间 `T(n)` 来比较增量策略和翻倍策略。我们从一个大小为\
  \ 1 的数组表示的空栈开始。我们将 `push` 操作的*摊还*时间称为一系列操作的平均时间，即 `T(n)/n`。\n\n**增量策略：** `push`\
  \ 操作的摊还时间（每个操作的平均时间）是 O(`n`) [O(`n²`)/n]。\n\n**翻倍策略：** 在这种方法中，`push` 操作的摊还时间是 O(1)\
  \ [O(`n`)/n]。\n\n**注意：** 逻辑推导请参见 `实现` 。\n\n#### 比较数组实现与链表实现\n\n数组实现\n- 操作需要常数时间。\n\
  - 偶尔进行一次昂贵的翻倍操作。\n- 从空栈开始的任何 `n` 次操作序列——“摊还”界限的时间正比于 `n`。\n\n链表实现\n- 优雅地增长和收缩。\n\
  - 每次操作都需要常数时间 O(1)。\n- 每次操作都使用额外的空间和时间来处理引用。\n\n## 4.8 栈：问题与解决方案\n\n**问题-1:** 讨论如何使用栈来检查符号的平衡性。\n\
  \n**解决方案:** 栈可以检查给定的表达式是否具有平衡符号。该算法在编译器中非常有用。解析器每次读取一个字符。如果该字符是左括号（如 (、{ 或 [ ），则将其写入栈中。当遇到右括号（如\
  \ ) 或 ]）时，从栈中弹出。然后比较左括号和右括号。如果它们匹配，则继续解析字符串。如果不匹配，解析器将指示该行错误。基于栈的线性时间 O(n) 算法如下：\n\
  \n**算法**\n\na) 创建一个栈。\nb) 当（未到达输入结束）\n1) 如果读取到的字符不是需要平衡的符号，则忽略它。\n2) 如果字符是开启符号（如\
  \ (、[ 或 {），将其入栈。\n\n\n\n\n\n3) 如果是闭合符号，如 `)`、]`、}`，那么如果栈为空，则报错。否则，弹出栈元素。\n\n4) 如果弹出的符号不是对应的起始符号，则报错。\n\
  \nc) 在输入结束时，如果栈不为空，则报错。\n\n![Image](img/image00716.jpeg)\n\n为了追踪算法，让我们假设输入为：`()\
  \ (() [()])`\n\n![Image](img/image00717.jpeg)\n\n时间复杂度：`O(*n*)`。因为我们只扫描一次输入。空间复杂度：`O(*n*)`\
  \ [用于栈]。\n\n![Image](img/image00718.jpeg)\n\n### 问题 2\n\n讨论使用栈的中缀表达式到后缀表达式的转换算法。\n\
  \n**解：** 在讨论算法之前，让我们先看看中缀、前缀和后缀表达式的定义。\n\n**中缀（Infix）：** 中缀表达式是一个单独的字母，或运算符，其前面跟着一个中缀字符串，后面跟着另一个中缀字符串。\n\
  \n![Image](img/image00719.jpeg)\n\n**前缀（Prefix）：** 前缀表达式是一个单独的字母，或运算符，其后面跟着两个前缀字符串。每个比单个变量长的前缀字符串都包含一个运算符、第一个操作数第二个操作数。\n\
  \n![Image](img/image00720.jpeg)\n\n**后缀（Postfix）：** 后缀表达式（也称为逆波兰表示法）是一个单独的字母或运算符，其前面跟着两个后缀字符串。每个比单个变量长的后缀字符串都包含第一第二操作数，后面跟着一个运算符。\n\
  \n![Image](img/image00721.jpeg)\n\n前缀和后缀的概念是不使用括号编写数学表达式的方法。求后缀和前缀表达式的时间为 `O(*n*)`，其中\
  \ *n* 是数组中元素的个数。\n\n![Image](img/image00722.jpeg)\n\n现在，让我们关注算法。在中缀表达式中，除非使用括号，否则运算符的优先级是隐式的。因此，对于中缀到后缀的转换算法，我们必须在算法内部定义运算符的优先级（或权重）。表格显示了运算符之间的优先级及其结合性（计算顺序）。\n\
  \n![Image](img/image00723.jpeg)\n\n### 重要属性\n\n- 让我们考虑中缀表达式 `2 + 3 * 4` 及其等效后缀表达式\
  \ `2 3 4 *+`。注意在中缀和后缀之间，数字（或操作数）的顺序保持不变。两种情况下都是 `2 3 4`。但这两个表达式中运算符 `*` 和 `+` 的顺序受到了影响。\n\
  \n- 仅用一个栈就足够将中缀表达式转换为后缀表达式。我们在算法中使用的栈将用于改变运算符从中缀到后缀的顺序。我们使用的栈只包含运算符和左括号符号 `(`。后缀表达式不包含括号。我们不会在后缀输出中输出括号。\n\
  \n### 算法\n\na) 创建一个栈\n\nb) 对于输入流中的每个字符 `t`\n\n![Image](img/image00724.jpeg)\n\n\
  c) 弹出并输出标记，直到栈为空\n\n为了更好地理解，让我们追踪一个例子：`A * B- (C + D) + E`\n\n![Image](img/image00725.jpeg)\n\
  \n### 问题 3\n\n对于一个具有 *n* 个符号的给定数组，有多少种可能的栈排列？\n\n**解：** *n* 个符号的栈排列数量由*卡特兰数*表示，我们将在*动态规划*章节中讨论。\n\
  \n### 问题 4\n\n讨论使用栈的后缀求值？\n\n**解：**\n\n**算法：**\n\n1. 从左到右扫描后缀字符串。\n2. 初始化一个空栈。\n\
  3. 重复步骤 4 和 5，直到所有字符都被扫描完毕。\n4. 如果扫描到的字符是操作数，将其推入栈。\n5. 如果扫描到的字符是运算符，且该运算符是一元运算符，则从栈中弹出一个元素。如果运算符是二运算符，则从栈中弹出两个元素。弹出元素后，对这些弹出元素应用运算符。让此操作的结果\
  \ `retVal` 入栈。\n6. 在所有字符扫描完毕后，栈中将只有一个元素。\n7. 返回栈顶作为结果。\n\n**示例：** 让我们通过例子看看上述算法是如何运行的。假设后缀字符串为\
  \ `123*+5-`。初始栈为空。现在，被扫描的前三个字符是 `1`、`2` 和 `3`，它们是操作数。它们将按顺序推入栈。\n\n![Image](img/image00726.jpeg)\n\
  \n下一个扫描到的字符是“*”，它是一个运算符。因此，我们从栈中弹出两个元素，并对这两个操作数执行“*”操作。第二个操作数将是弹出的第一个元素。\n\n![Image](img/image00727.jpeg)\n\
  \n表达式 `(2*3)` 的求值 `(6)` 被入栈。\n\n![Image](img/image00728.jpeg)\n\n下一个扫描到的字符是“+”，它是一个运算符。因此，我们从栈中弹出两个元素，并对这两个操作数执行“+”操作。\n\
  \n第二个操作数将是弹出的第一个元素。\n\n![Image](img/image00729.jpeg)\n\n表达式 `(1+6)` 的求值 `(7)` 被入栈。\n\
  \n![Image](img/image00730.jpeg)\n\n下一个扫描到的字符是“+”，它是一个运算符。因此，我们从栈中弹出两个元素，并对这两个操作数执行“+”操作。\n\
  \n第二个操作数将是弹出的第一个元素。\n\n![Image](img/image00731.jpeg)\n\n表达式 `(1+6)` 的求值 `(7)` 被入栈。\n\
  \n![Image](img/image00732.jpeg)\n\n下一个扫描到的字符是“-”，它是一个运算符。因此，我们从栈中弹出两个元素，并对这两个操作数执行“-”操作。\n\
  \n第二个操作数将是弹出的第一个元素。\n\n![Image](img/image00733.jpeg)\n\n表达式 `(7-5)` 的求值 `(2)` 被入栈。\n\
  \n![Image](img/image00734.jpeg)\n\n在所有字符扫描完毕后，栈中将只有一个元素。结果为：\n\n•后缀字符串：`123*+5-`\n\
  •结果：`2`\n\n![Image](img/image00734.jpeg)\n\n### 问题 5\n\n我们可以在一次扫描中求中缀表达式吗？\n\n**解：**\
  \ 使用两个栈可以在不转换后缀的情况下求中缀。\n\n**算法**\n\n1. 创建空运算符栈\n2. 创建空操作数栈\n3. 对于输入字符串中的每个标记\n\
  a. 获取中缀字符串中的标记\nb. 如果标记是操作数，将其放入操作数栈\nc. 如果标记是运算符\ni. 计算运算符（下一个运算符）\n4. 当运算符栈不为空时，弹出运算符和操作数（左右），计算并将结果推入操作数栈\n\
  \n### 问题 6\n\n如何设计一个栈使得 getMinimum() 为 O(1)？\n\n**解：** 取辅助栈来维护栈中所有值的最小值。此外，假设栈的每个元素都小于它下面的元素。为了简单，我们将辅助栈称为\
  \ min 栈。当我们弹出主栈时，也弹出 min 栈。当我们推入主栈时，推入新元素或当前最小值中的较小者。在任何我们需要最小值时，只需要返回 min 栈的顶部元素。让我们取一个例子追踪。假设我们推入了\
  \ 2, 6, 4, 1 和 5。根据上述算法，min 栈如下：\n\n| 主栈 | min 栈 |\n| :--- | :--- |\n| 5 →top |\
  \ 1 →top |\n| 1 | 1 |\n| 4 | 2 |\n| 6 | 2 |\n| 2 | 2 |\n\n弹出两次后我们得到：\n\n| 主栈 | min\
  \ 栈 |\n| :--- | :--- |\n| 4 -*-→ top | 2→top |\n| 6 | 2 |\n| 2 | 2 |\n\n根据上述讨论，现在让我们实现\
  \ push、pop 和 GetMinimum() 操作。\n\n![Image](img/image00735.jpeg)\n\n时间复杂度：O(1)。空间复杂度：O(*n*)\
  \ [用于 min 栈]。如果我们很少获得“新最小值或相等值”，该算法在空间使用上要好得多。\n\n### 问题 7\n\n对于[问题 6]，能否改进空间复杂度？\n\
  \n\n\n\n\n### 解决方案：是的。之前的方法的主要问题是，对于每个 push 操作，我们都也将元素推入到 `min stack` 中（无论是新元素还是现有的最小元素）。这意味着，我们向栈中推入了重复的最小元素。\n\
  \n现在，让我们改变算法来提高空间复杂度。我们仍然保留一个栈 `min stack`，但只有当从主栈中弹出的值与 `min stack` 上的值相等时，我们才从中弹出（pop）。只有当推入主栈的值小于或等于当前最小值时，我们才向\
  \ `min stack` 推入（`push`）元素。在这个修改后的算法中，如果我们想获取最小值，只需要返回 `min stack` 的栈顶元素。例如，取原始版本并再次推入\
  \ 1，我们将得到：\n\n| 主栈 (Main stack) | 最小栈 (Min stack) |\n| :--- | :--- |\n| 1 →top |\
  \ |\n| 5 | |\n| 1 | |\n| 4 | 1 →top |\n| 6 | 1 |\n| 2 | 2 |\n\n从上述栈中弹出操作会同时从两个栈中弹出，因为\
  \ `1 == 1`，结果如下：\n\n| 主栈 (Main stack) | 最小栈 (Min stack) |\n| :--- | :--- |\n| 5\
  \ →top | |\n| 1 | |\n| 4 | |\n| 6 | 1→top |\n| 2 | 2 |\n\n再次弹出*仅*从主栈中弹出，因为 `5 >\
  \ 1`：\n\n| 主栈 (Main stack) | 最小栈 (Min stack) |\n| :--- | :--- |\n| 1 →top | |\n\
  | 4 | |\n| 6 | 1 →top |\n| 2 | 2 |\n\n再次弹出会从两个栈中弹出，因为 `1 == 1`：\n\n| 主栈 (Main stack)\
  \ | 最小栈 (Min stack) |\n| :--- | :--- |\n| 4→top | |\n| 6 | |\n| 2 | 2→top |\n\n\
  **注意：** 区别仅在于 push 和 pop 操作。\n\n![Image](img/image00736.jpeg)\n\n时间复杂度：`O(1)`。空间复杂度：`O(n)`\
  \ [针对 Min stack]。但如果我们很少遇到“新最小值或相等值”，这个算法的空间利用率会好得多。\n\n### 问题-8\n给定一个由 a's 和 b's\
  \ 组成的字符数组。字符串用特殊字符 `X` 标记，代表列表的中间（例如：`ababa...ababXbabab…..baaa`）。检查该字符串是否为回文。\n\
  \n**解决方案：** 这是最简单的算法之一。我们的做法是设置两个索引，一个在字符串的开头，另一个在字符串的末尾。每次比较两个索引处的值是否相同。如果值不相同，我们就说这个字符串不是回文。\n\
  \n如果值相同，则增加左索引并减小右索引。继续这个过程，直到两个索引在中间（在 `X` 处）相遇，或者字符串不是回文为止。\n\n![Image](img/image00737.jpeg)\n\
  \n时间复杂度：`O(n)`。空间复杂度：`O(1)`。\n\n### 问题-9\n对于 问题-8，如果输入是单向链表，我们如何检查列表元素是否形成回文（这意味着无法向后移动）。\n\
  \n**解决方案：** 参考*链表* (Linked Lists) 章节。\n\n### 问题-10\n我们可以使用栈来解决 问题-8 吗？\n\n**解决方案：是的。**\n\
  \n**算法**\n- 遍历列表直到遇到输入为 `X`。\n- 在遍历过程中，将所有元素（`X` 之前）推入栈中。\n- 对于列表的后半部分，将每个元素的内容与栈顶比较。如果它们相同，则弹出栈并处理列表中的下一个元素。\n\
  - 如果它们不同，则给定的字符串不是回文。\n- 继续这个过程，直到栈为空或字符串不是回文为止。\n\n![Image](img/image00738.jpeg)\n\
  \n时间复杂度：`O(n)`。空间复杂度：`O(n/2)`。\n\n### 问题-11\n给定一个栈，如何仅使用栈操作（`push` 和 `pop`）反转栈的内容？\n\
  \n**解决方案：**\n**算法**\n- 首先弹出栈中的所有元素直到它变为空。\n- 在递归的每个向上步骤中，将元素插入栈的底部。\n\n![Image](img/image00739.jpeg)\n\
  \n时间复杂度：`O(n²)`。空间复杂度：`O(n)`，针对递归栈。\n\n### 问题-12\n展示如何使用两个栈实现一个队列。分析队列的运行时间。\n\n\
  **解决方案：** 参考*队列* (Queues) 章节。\n\n### 问题-13\n展示如何使用两个队列实现一个栈。分析栈的运行时间。\n\n**解决方案：**\
  \ 参考*队列* (Queues) 章节。\n\n### 问题-14\n我们如何使用一个数组实现两个栈？我们的栈例程不应该在数组的每个槽都被使用时才指示异常？\n\
  \n**解决方案：**\n![Image](img/image00740.jpeg)\n**算法：**\n- 开始两个索引，一个在左侧，另一个在右侧。\n- 左索引模拟第一个栈，右索引模拟第二个栈。\n\
  - 如果我们要向第一个栈推入一个元素，则将元素放在左索引处。\n- 只有当数组中的每个槽都被使用时，我们的栈例程才应指示异常。\n- 如果我们要向第二个栈推入一个元素，则将其放在右索引处。\n\
  - 第一个栈向右生长，第二个栈向左生长。\n\n两个栈的推入弹出时间复杂度为 `O(1)`。空间复杂度为 `O(1)`。\n\n![Image](img/image00741.jpeg)\n\
  \n### 问题-15\n在一个数组中实现三个栈：如何在数组中实现三个栈？\n\n**解决方案：** 对于这个问题，可以有其他解决方法。下面给出一种可能的方法，只要数组有空间。\n\
  \n![Image](img/image00742.jpeg)\n为了实现三个栈，保留以下信息：\n- 第一个栈的索引（`Top1`）：这指示第一个栈的大小。\n\
  - 第二个栈的索引（`Top2`）：这指示第二个栈的大小。\n- 第三个栈的起始索引。\n- 第三个栈的 `op`：这指示第三栈的大小。\n\n现在我们定义这种实现的推入和弹出操作。\n\
  \n**推入：**\n- 向第一个栈推入时，我们需要检查添加新元素是否会导致它撞上第三栈。如果是，尝试向上移动第三栈。将元素放在 `start1 + Top1`。\n\
  - 向第二个栈推入时，我们需要检查添加新元素是否会导致它撞上第三栈。如果是，尝试向下移动第三栈。将元素放在 `start2 - Top2`。\n- 向第三个栈推入时，检查它是否会撞上第二个栈。如果是，尝试向下移动第三栈并再次推入。将元素放在\
  \ `start3 + Top3`。\n\n时间复杂度：`O(n)`。因为我们可能需要调整第三栈。空间复杂度：`O(1)`。\n\n**弹出：** 对于弹出，不需要移动，只需减小相应栈的大小。时间复杂度：`O(1)`。空间复杂度：`O(1)`。\n\
  \n\n\n\n\n### 问题-17\n在一个数组中实现多个 `m`栈：类似于问题-15，如果我们想在一个数组中实现 `m` 个栈该怎么办？\n\n**解决方案：**\
  \ 假设数组索引从 1 到 `n`。类似于问题-15 中的讨论，为了在一个数组中实现 `m` 个栈，我们将数组分为 `m` 个部分（如下所示）。每个部分的大小为\
  \ ![Image](img/image00745.jpeg)。\n\n![Image](img/image00746.jpeg)\n\n从上面的表示法中我们可以看到，第一个栈从索引\
  \ 1 开始（起始索引存储在 `Base[l]` 中），第二个栈从索引 ![Image](img/image00745.jpeg) 开始（起始索引存储在 `Base[2]`\
  \ 中），第三个栈从索引 ![Image](img/image00747.jpeg) 开始（起始索引存储在 `Base[3]` 中），依此类推。类似于 `Base`\
  \ 数组，我们假设 `Top` 数组存储每个栈的栈顶索引。在讨论中考虑以下术语。\n\n- `Top[i]`，对于 1 ≤ `i` ≤ `m`，指向栈 `i`\
  \ 的最顶部元素。\n- 如果 `Base[i] == Top[i]`，那么我们可以说栈 `i` 为空。\n- 如果 `Top[i] == Base[i+1]`，那么我们可以说栈\
  \ `i` 为满。初始时 `Base[i] = Top[i] = ![Image](img/image00745.jpeg)` (`i` – 1)，对于 1 ≤\
  \ `i` ≤ `m`。\n- 第 `ith` 个栈从 `Base[i]+1` 增长到 `Base[i+1]`。\n\n**向第 `ith` 个栈推入元素：**\n\
  \n1) 向第 `ith` 个栈推入元素时，我们检查第 `ith` 个栈的顶部是否指向 `Base[i+1]`（这种情况定义为第 `ith` 个栈已满）。这意味着我们需要查看添加新元素是否会导致它碰撞到第\
  \ `i + 1th` 个栈。如果是，尝试将从第 `i + 1th` 个栈到第 `mth` 个栈向右移动。在 `(Base[i] + Top[i])` 处插入新元素。\n\
  \n2) 如果无法右移，尝试将从第 1 到第 `i – 1th` 个栈向左移动。\n\n3) 如果两者都不，我们可以说所有栈都是满的。\n\n![Image](img/image00748.jpeg)\n\
  \n时间复杂度：O(`n*`)。因为我们可能需要调整栈。空间复杂度：O(1)。\n\n**从第 `ith` 个栈弹出元素：** 对于弹出操作，我们不需要移动，只需减小相应栈的大小。我们唯一检查的情况是栈空的情况。\n\
  \n![Image](img/image00749.jpeg)\n\n时间复杂度：O(1)。空间复杂度：O(1)。\n\n### 问题-18\n考虑一个空的整数栈。让数字\
  \ 1, 2, 3, 4, 5, 6 按照它们从左到右出现的顺序推入此栈。让 5 表示推入操作，`X` 表示弹出操作。它们可以按照顺序 325641(输出) 和顺序\
  \ 154623 进行排列吗？（如果排列是可能的，请给出操作的顺序字符串。）\n\n**解决方案：** SSSXXSSXSXXX 输出 325641。154623\
  \ 输出，因为 2 的推入时间远早于 3，所以只能在 3 输出之后出现。\n\n### 问题-19\n假设有两个单链表，它们在某点相交并变成一个链表。两个列表的头指针或起始指针是已知的，但相交节点是未。此外，每个列表在相交之前的节点数也是未知的，且两个列表的数量可能不同。`List1`\
  \ 在到达相交点之前可能有 `n` 个节点，`List2` 在到达相交点之前可能有 `m` 个节点，其中 `m` 和 `n` 可能满足 `m = n`、`m <\
  \ n` 或 `m > n`。我们能使用栈找到合并点吗？\n\n![Image](img/image00750.jpeg)\n\n**解决方案：是的。** 算法请参考`链表`章节。\n\
  \n### 问题-20\n在本章前面的部分，我们讨论了对于栈的动态数组实现，使用了“重复倍增”方法。对于相同的问题，如果我们创建一个大小为 `n + K` 的新数组而不是倍增，复杂度是多少？\n\
  \n**解决方案：** 假设初始栈的大小为 0。为了简单起见，我们假设 `K = 10`。为了插入元素，我们创建一个大小为 `0 + 10 = 10` 的新数组。同样，在\
  \ 10 个元素之后，我们再次创建一个大小为 `10 + 10 = 20` 的新数组，这个过程在值 30, 40 ... 继续下去。这意味着对于给定的 `n`\
  \ 值，我们在以下位置创建新数组：![Image](img/image00751.jpeg)。总的拷贝操作次数是：\n\n![Image](img/image00752.jpeg)\n\
  \n如果我们执行 `n` 次推入操作，每次操作的代价是 O(`logn*`)。\n\n### 问题-21\n给定一个包含 `n 个 S` 和 `n 个 X` 的字符串，其中\
  \ 5 表示推入操作，X 表示弹出操作，且栈初始为空，请制定一个规则来检查给定的操作字符串 5 是否是允许的？\n\n**解决方案：** 给定一个长度为 `2*n`\
  \ 的字符串，我们希望检查给定的操作字符串相对于在栈的功能是否是允许的。唯一的受限操作是弹出，其前提条件是栈不能空。因此，当从左到右遍历字符串时，在任何弹出操作之前栈都不应为空。\n\
  \n### 问题-22\n**寻找跨度（Span）：** 给定数组 `A`，跨度 `S[i]` 是小于或等于其价格的最大连续元素。\n\n**另一种问法：**\
  \ 给定一个整数数组 `A`，找到跨度 `S[i]`。这是股票市场中一个非常常见的问题。股票在某天 `i` 的跨度是指直到该天为止价格小于或等于该价格的最大天数。\n\
  \n**解决方案：** 从上面的示例我们可以看到，如果我们知道 `i` 之前最近的一个大于 `i` 天价格的日子，就可以很容易计算出 `i` 天的跨度 `S[i]`。我们将这样一个一天称为\
  \ `P`。如果这样的日子存在，则跨度定义为 `S[i] = i – P`。\n\n![Image](img/image00756.jpeg)\n\n时间复杂度：O(`n`)。数组的每个索引都被推入栈一次，最多从栈弹出一次。循环循环中的语句最多执行\
  \ *n* 次。尽管算法有嵌套循环，但由于内部循环在算法执行期间只执行了 *n* 次，复杂度为 O(`n`)。空间复杂度：O(`n`) [用于栈]。\n\n###\
  \ 问题-23\n我们能提高问题-22 的复杂度吗？\n\n### 问题-24\n**直方图最大矩形：** 直方图是由一系列沿公共基准线对齐的矩形组成的多边形。为了简单，假设矩形的宽度相同但高度可能不同。例如，左图所示的直方图由高度为\
  \ 3, 2, 5, 6, 1, 4, 4 的矩形组成，以 1 为矩形宽度的单位。在这里我们的问题是：给定一个带有矩形高度的数组（假设宽度为 1），我们需要找到可能的最大矩形。对于给出的示例，最大的矩形是共享部分。\n\
  \n![Image](img/image00757.jpeg)\n\n\n\n\n\n**解决方案：** 一个简单直接的方法是遍历直方图中的每个条形，找到它在直方图中可能的最大面积。最后，找到这些值中的最大值。这将需要\
  \ O(`n`²)的时间。\n\n**问题-25** 对于对于 `Error! Reference source not found.`，我们能改进时间复杂度吗？\n\
  \n**解决方案：使用未完成子问题的栈进行线性搜索：** 解决这个问题有许多方法。`Judge` 为这个问题提供了一个基于栈的优秀算法。我们按照从左到右的顺序处理元素，并维护一个关于已开始但尚未完成的子直方图信息的栈。如果栈为空，通过将元素推入栈来开启一个新的子问题。否则，将其与栈顶的元素进行比较。如果新元素更大，我们再次将其推入栈。如果新元素相等，我们跳过它。在所有这些情况下，我们继续处理下一个新元素。\n\
  \n如果新元素较小，我们通过根据栈顶元素更新最大面积来完成最顶部的子问题。然后，丢弃栈顶元素，并在保持当前新元素的情况下重复该过程。这样，当栈为空或其栈顶元素小于或等于新元素时，所有子问题都会完成，导致上述描述的操作。如果所有元素都已处理且栈尚未空，我们通过根据栈顶元素更新最大面积来完成剩余的子问题。\n\
  \n![Image](img/image00758.jpeg)\n\n初看起来，这个解决方案的复杂度似乎是 O(`n`²)。但如果我们仔细观察，每个元素最多被推入弹出一次，在函数的每一步中至少有一个元素被推入或弹出。由于决策和更新的工作量是常数，通过摊还分析，算法的复杂度为\
  \ O(`n`)。\n\n空间复杂度：O(`n`) [用于栈`]。\n\n**问题-26** 给出一个升序排序栈的算法。我们不应该对栈的实现方式做任何假设。\n\
  \n**解决方案：**\n\n![Image](img/image00759.jpeg)\n\n时间复杂度：O(`n`²)。空间复杂度：O(`n`)，用于栈。\n\
  \n**问题-27** 给定一个整数栈，如何检查栈中连续的对数字是否是连续的。这些可以是递增的也可以递减的，如果栈的元素个数为奇数，顶部的元素将不参与配对。例如，如果栈元素为\
  \ [4, 5, -2, -3, 11, 10, 5, 6, 20]，那么输出应为 true，因为每一对 (4, 5), (-2, -3), (11, 10)\
  \ 和 (5, 6) 都由连续数字组成。\n\n**解决方案：** 参考 `Queues`章节。\n\n**问题-28** 递归删除所有相邻重复项：给定一个数字数组，递归地删除相邻重复数字。输出数组不应包含任何相邻重复。\n\
  \n| *输入*: 1,5,6, 8,8,8,0,1,1,0,6,5 *输出*: 1 | *输入*: 1,9,6, 8,8,8,0,1,1,0,6,5} *输出*:\
  \ 1, 9, 5 |\n\n**解决方案：** 该解决方案使用就地栈的概念运行。当栈上的元素与当前数字不匹配时，我们将其添加到栈中。当它与栈顶匹配时，我们跳过数字，直到元素与栈顶匹配并从栈中移除元素。\n\
  \n![Image](img/image00760.jpeg)\n\n时间复杂度：O(`n`)。由于栈模拟是就地完成的，空间复杂度为 O(1)。\n\n**问题-28**\
