  \ b2 : a3 b4\n7. 围绕中心交换元素：交换 b1 b2 a3 a4\n\n![images](img/image1276.jpeg)\n\n时间复杂度：O(*n)。\n\
  \n### 问题-79\n给定数组 `A[]`，找到最大的 `j – i` 使得 `A[j] > A[i]`。例如，输入：{34,8,10,3,2,80,30,33,1}，输出：6\
  \ (j = 7, i = 1)。\n\n**解决方案：暴力破解法：** 运行两个循环。在外层循环从左侧逐个选取元素。在内层中从右侧开始与所选元素比较。当看到大于所选元素时停止内层循环，并持续更新为止为止最大的\
  \ `j – i`。\n\n![images](img/image1277.jpeg)\n\n时间复杂度：O(*n²)。\n\n### 问题-80\n我们能改进问题-76\
  \ 的复杂度吗？\n\n**解决方案：** 为了解决这个问题，我们需要获取 `A[]` 的两个最优索引：左索引 `i` 和右索引 `j`。对于元素 `A[i]`，如果左侧有比\
  \ `A[i]` 小的元素，则我们不需要考虑 `A[i]` 作为左索引。同样，如果 `A[j]` 的右侧有更大的元素，则我们不需要考虑这个 `j` 作为右索引。\n\
  \n\n\n\n因此我们构造了两个辅助数组 `LeftMins[]` 和 `RightMaxs[]`，使得 `LeftMins[i]` 存储 `A[i]` 左侧（包含\
  \ `A[i]`）的最小元素，而 `RightMaxs[j]` 存储 `A[j]` 右侧（包含 `A[j]`）的最大元素。构造完这两个辅助数组后，我们从左到右遍历这两个数组。\n\
  \n在遍历 `LeftMins[]` 和 `RightMaxs[]` 时，如果我们发现 `LeftMins[i]` 大于 `RightMaxs[j]`，那么我们必须在\
  \ `LeftMins[]` 中移动（或 `i++`），因为 `LeftMins[i]` 左侧的所有元素都大于或等于 `LeftMins[i]`。否则，我们必须在\
  \ `RightMaxs[j]` 中移动以寻找更大的 `j` 值。\n\n![images](img/image01277.jpeg)\n\n时间复杂度：O(*n*)。空间复杂度：O(*n*)。\n\
  \n### 问题-81\n给定一个元素数组，如何检查该列表是否是两两排序的（pairwise sorted）？如果每个连续的数字对都按照排序（非递减）顺序，则认为该列表是两两排序。\n\
  \n**解决方案：**\n\n![images](img/image01278.jpeg)\n\n时间复杂度：O(*n*)。空间复杂度：O(1)。\n\n###\
  \ 问题-82\n在 5 GHz 计算机上对仅 1000 个元素进行线性搜索，与在 1 GHz 计算机上对 100 万个元素进行二分搜索，哪个更快？快多少？假设\
  \ 5 GHz 计算机上每个指令的执行速度是 1 GHz 计算机五倍，且线性搜索算法的每次迭代是二分搜索算法每次迭代的两倍。\n\n**解决方案：** 100\
  \ 万个元素的二分搜索最多需要 ![images](img/image01279.jpeg) 或大约 20 次迭代（即最坏情况）。1000 个元素的线性搜索平均需要\
  \ 500 次迭代（即运行到数组的一半）。因此，从迭代次数来看，二分搜索比线性搜索快 ![images](img/image01280.jpeg)。然而，由于线性搜索的迭代速度快倍，在同一台机器上，二分搜索总体上比线性搜索快\
  \ ![images](img/image01281.jpeg) 或大约快 12 倍。由于我们在不同的机器上运行，5 GHz 机器上的指令速度是 1 GHz 机器指令的五倍，因此二分搜索比线性搜索快\
  \ ![images](img/image01282.jpeg) 或大约快 2 倍！关键思想是，软件改进可以使算法运行得快得多，而无需使用更强大的软件。\n\n\
  ![images](img/image01283.jpeg)\n\n### 12.1 什么是选择算法？\n\n*选择算法*（Selection algorithm）是一种用于在列表中寻找第\
  \ `k^(th)` 小/大数字的算法（也称为第 `k^(th)` 序统计量）。这包括寻找最小值、最大值和中位数。寻找第 `k^(th)` 序统计量有多种提供不同复杂度的解决方案，在本章中我们将列举。\n\
  \n### 12.2 通过排序进行选择\n\n选择问题可以转换为排序问题。在这种方法中，我们首先对输入元素进行排序，然后获取所需的元素。如果我们想执行多次选择，这种方法是高效的。\n\
  \n例如，假设我们要获取最小值。对输入元素排序后，我们可以简单地返回第一个元素（假设数组是升序排序的）。现在，如果我们想找到第二个小元素，只需从排序后的列表中返回第二个元素。这意味着对于第二个小元素，我们不需要再次进行排序。即使我们想获取第\
  \ `k^(th)` 小元素，只需对排序后的列表进行扫描即可找到该元素（如果元素在数组中，我们可以返回第 `k^(th)` 个索引的值）。\n\n从上述讨论可以得出，通过初始排序，我们可以在一次扫描（O(*n*)）中回答任何查询。通常情况下，这种方法需要\
  \ O(*nlogn*) 时间（用于排序），其中 `n` 是输入列表的长度。假设我们正在执行 `n` 次查询，那么每次操作的平均成本仅为 ![images](img/image01284.jpeg)。这种分析被称为*摊销*（amortized）分析。\n\
  \n### 12.3 基于分区的选择\n\n算法请检查 `问题-6`。该算法类似于快速排序。\n\n### 12.4 线性选择算法 - 中位数中位数\n\n|\
  \ 最坏情况性能 | O(*n*) |\n| :--- | :--- |\n| 最优情况性能 | O(*n*) |\n| 最坏情况空间复杂度 | O(1) |\n\
  \n请参考 `问题-11`。\n\n### 12.5 按排序顺序找到 K 个最小元素\n\n算法请检查 `问题-6`。该算法类似于快速排序。\n\n### 12.6\
  \ 选择算法：问题与解决方案\n\n**问题-1** 在大小为 `n` 的数组 `A` 中找到最大的元素。\n\n**解决方案：** 扫描整个数组并返回最大的元素。\n\
  \n![imagesimages](img/image01285.jpeg)\n\n时间复杂度：O(*n*)。空间复杂度：O(1)。\n**注意：** 任何通过比较找到\
  \ `n` 个键中最大值的确定性算法至少需要 `n-1` 次比较。\n\n**问题-2** 在大小为 `n` 的数组 `A` 中找到最小和最大元素。\n\n**解决方案：**\n\
  \n![images](img/image01286.jpeg)\n\n时间复杂度：O(*n*)。空间复杂度：O(1)。最坏情况下的比较次数为 `2(n-1)`。\n\
  \n**问题-3** 我们可以改进之前的算法吗？\n\n**解决方案：是的**。我们可以通过配对来实现。\n\n![images](img/image01287.jpeg)\n\
  \n时间复杂度：O(*n*)。空间复杂度：O(1)。比较次数为 ![images](img/image01288.jpeg)\n\n**总结：**\n- 直接比较——`2(n-1)`\
  \ 次比较\n- 最大值失败时才比较最小值\n- 最优情况：升序——`n-1` 次比较\n- 最坏情况：降序——`2(n-1)` 次比较\n- 平均情况：`3n/2\
  \ - 1` 次比较\n\n**问题-4** 为给定的元素列表给出寻找第二大元素的算法。\n\n**解决方案：暴力法**\n**算法：**\n- 找到最大元素：需要\
  \ `n-1` 次比较\n- 删除（丢弃）最大元素\n- 再次找到最大元素：需要 `n-2` 次比较\n总比较次数：`n-1 + n-2 = 2n-3`\n\n\
  **问题-5** 我们可以减少 `问题-4` 解决方案中的比较次数吗？\n\n**解决方案：锦赛算法：** 为了简单起见，假设数字是唯一的且 `n` 是 2 的幂。我们将键配对并逐轮进行比较，直到剩下最后一轮。最后一轮的获胜者是最大的键。下图显示了该方法。\n\
  \n锦赛算法仅在 `n` 是 2 的幂时直接适用。如果不是这种情况，我们可以在末尾添加足够的元素以使数组大小变为 2 的幂。如果树是完全的，树的最大高度为 `log\
  \ n`。如果我们构建完全二叉树，找到最大值需要 `n-1` 次比较。第二大元素必须在与最大元素比较中失败的元素中。这意味着第二大元素应该是最大元素的对手之一。输给最大元素的键的数量是树的高度，即\
  \ `log n`（如果树是完全二叉树）。然后使用选择算法找到它们中最大的，需要 `log n - 1` 次比较。因此，找到最大和第二大元素的总比较次数为 `n\
  \ + log n - 2`。\n\n![images](img/image01289.jpeg)\n\n**问题-6** 使用分区方法在包含 `n` 个元素的数组\
  \ `S` 中找到 `k` 个最小元素。\n\n\n\n\n\n### 解决方案：暴力破解法\n遍历数字 `k` 次以获得所需的元素。这种方法被用于泡泡排序（以及选择排序），我们每次都通过比较每个元素来找到整个序列中最小的元素。在这种方法中，序列必须被遍历\
  \ `k` 次。因此，复杂度为 `O(*n* $\\times$ *k*)`。\n\n### 问题-7 \n我们可以使用排序技术来解决 问题-6 吗？\n\n\
  **解决方案：可以。** 排序并取前 `k` 个元素。\n\n1. 对数字进行排序。\n2. 选取前 `k` 个元素。\n\n时间复杂度的计算显而易见。`n`\
  \ 个数字的排序复杂度为 `O(*nlogn*)`，选取 `k` 个元素的复杂度为 `O(*k*)`。总复杂度为 `O(*nlogn* + *k*) = O(*nlogn*)`。\n\
  \n### 问题-8 \n我们可以使用*树形排序*技术来解决 问题-6 吗？\n\n**解决方案：可以。**\n\n1. 将所有元素插入二叉搜索树中。\n2.\
  \ 进行中序遍历并打印 `k` 个元素，这些将是最小的元素。这样，我们就得到了 `k` 个最小元素。\n\n创建一个包含 `n` 个元素的二叉搜索树的代价为 `O(*nlogn*)`，遍历前\
  \ `k` 个元素的代价为 `O(*k*)`。因此，复杂度为 `O(*nlogn* + *k*) = O(*nlogn*)`。\n\n**缺点：** 如果数字按降序排列，我们将得到一个向左倾斜的树。在这种情况下，树的构建代价为\
  \ `0 + l + 2 + ... + (*n*– 1)` ![images](img/image01290.jpeg) 即 `O(*n*² )`。为了避免这种情况，我们可以保持树平衡，这样构建树的代价仅为\
  \ `*nlogn*`。\n\n### 问题-9 \n我们可以改进*树形排序*技术来解决 问题-6 吗？\n\n**解决方案：可以。** 使用更小的树来获得相同的结果。\n\
  \n1. 取出序列的前 `k` 个元素来创建一个包含 `k` 个节点的平衡树（这需要消耗 `*klogk*`）。\n2. 逐个取出剩余的数字并：\n    a.\
  \ 如果数字大于树中的最大元素，则返回。\n    b. 如果数字小于树中的最大元素，则移除树中的最大元素并添加新元素。这一步是为了确保较小的元素替换掉树中较大的元素。当然，由于树是包含\
  \ `k` 个元素的平衡树，此操作的代价为 `*logk*`。\n\n一旦步骤 2 完成，包含 `k` 个元素的平衡树将拥有最小的 `k` 个元素。剩下的任务是打印树中最大的元素。\n\
  \n**时间复杂度：**\n\n1. 对于前 `k` 个元素，我们构建树。因此代价为 `*klogk*`。\n2. 对于剩下的 `n – k` 个元素，复杂度为\
  \ `O(*logk*)`。\n\n步骤 2 的复杂度为 `(*n` – *k*) *logk`。总代价为 `*klogk* + (*n` – *k*) *logk\
  \ = nlogk*`，这个界限实际上比之前提供的要优。\n\n### 问题-10 \n我们可以使用分区技术来解决 问题-6 吗？\n\n**解决方案：可以。**\n\
  \n**算法**\n\n1. 从数组中选择一个枢轴（pivot）。\n2. 对数组进行分区，使得：`A[low..i-1] <= pivot <= A[i+1..high]`。\n\
  3. 如果 `k < i`，则递归处理左侧。\n4. 如果 `k > i`，则递归处理右侧。\n5. 如果 `k == i`，则找到元素。\n\n**时间复杂度：**\n\
  最坏情况下复杂度为 `O(*n²*)`，平均情况下复杂度为 `O(*nlogn*)`。\n\n### 问题-13 \n在 问题-11 中，我们将输入数组分为每\
