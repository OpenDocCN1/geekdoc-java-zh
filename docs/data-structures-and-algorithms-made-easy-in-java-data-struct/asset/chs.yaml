  * 带有路径压缩的快速 UNION 实现\n\n### 8.8 快速 UNION 实现 (慢速 FIND)\n\n正如我们所讨论的，只有当元素处于同一个集合时，`FIND`\
  \ 操作才会返回相同的答案（集合名称）。在表示不交集时，我们的主要目标是为每个组提供不同的集合名称。通常情况下我们并不关心集合的名称。实现集合的一种可能是使用树\
