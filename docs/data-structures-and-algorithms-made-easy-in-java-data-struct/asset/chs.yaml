  \n\n\n\n\n时间复杂度：O(*n*)。因为不需要嵌套的 `for` 循环。空间复杂度：O(1)。\n\n### 问题-9\n给定一个包含 *n* 个数字的数组，给出一个算法找到数组中第一个重复的元素。例如，在数组\
  \ `A` = {3,2,1,2,2,3} 中，第一个重复的数字是 3（而不是 2）。这意味着我们需要在所有重复元素中返回第一个元素。\n\n**解决方案：**\
  \ 我们可以使用在解决问题-1 时使用的暴力破解法。对于每个元素，由于它会检查该元素是否存在重复，因此哪个元素先重复重复就会返回哪个元素。\n\n### 问题-10\n\
  对于问题-9，我们可以使用排序技术吗？\n\n**解决方案：** 不能。为了证明失败用例，让我们考虑以下数组。例如，`A` = {3, 2, 1, 2, 2,\
  \ 3}。排序后我们得到 `A` = {1,2,2,2,3,3}。在这个排序数组中，第一个重复元素是 2，但实际答案是 3。\n\n### 问题-11\n对于问题-9，我们可以使用哈希技术吗？\n\
  \n**解决方案：** 可以。但我们在解决问题-3 时使用的简单哈希技术将不起。例如，如果我们考虑输入数组 `A` = {3,2,1,2,3},那么第一个重复元素是\
  \ 3，但使用我们简单的哈希技术我们得到的答案是 2。这是因为 2 在 3 之前出现了两次。现在让我们改变哈希表的行为，以便获取第一个重复元素。假设我们最初不是存储\
  \ 1 个值，而是存储元素在数组中的位置。结果哈希表看起来如下（在插入 3,2 和 1 之后）：\n\n![images](img/image01237.jpeg)\n\
  \n现在，如果我们再次看到 2，我们只需要将哈希表中 2 的当前值取反。这意味着我们将它的计数器值设置为 –2。哈希表中的负值表示我们已经看到了同一个元素两次。同样，对于\
  \ 3（输入中的下一个元素），我们也对哈希表的当前值取反，最后哈希表看起来如下：\n\n![images](img/image01238.jpeg)\n\n在处理完整个输入数组后，扫描哈希表并返回其中最大的负索引值（在我们的案例中为\
  \ –1）。最大的负值表示我们（在重复元素中）首先看到了该元素，且它也是重复的。\n\n**如果一个元素重复了两次以上怎么办？** 在这种情况下，如果对应的值\
  \ `i` 已经是负数，则直接跳过该元素。\n\n### 问题-12\n对于问题-9，我们可以使用解决问题-3 时使用的技术（取反法）吗？\n\n**解决方案：不能。**\
  \ 作为一个矛盾的例子，对于数组 `A` = {3,2,1,2,2,3}，第一个重复元素是 3。但使用取反法的结果是 2。\n\n### 问题-13\n寻找缺失的数字：给定一个包含\
  \ *n* – 1 个整数的列表，这些整数在 1 到 *n* 的范围内。列表中没有重复项。列表中缺失一个整数。给出一个算法找到这个缺失的整数。\n**示例：**\
  \ 输入 (I/P): [1,2,4,6,3,7,8] 输出 (O/P): 5\n\n**暴力破解解决方案：** 此问题的简单方法是，对于 1 到 *n* 中的每个数字，检查该数字是否在给定数组中。\n\
  \n![images](img/image01239.jpeg)\n\n时间复杂度：O(*n*²)。空间复杂度：O(1)。\n\n### 问题-14\n对于问题-13，我们可以使用排序技术吗？\n\
  \n**解决方案：可以。** 对列表排序将按增加顺序排列元素，通过再次扫描我们可以找到缺失的数字。\n\n时间复杂度：O(*nlogn*)，用于排序。空间复杂度：O(1)。\n\
  \n### 问题-15\n对于问题-13，我们可以使用哈希技术吗？\n\n**解决方案：可以。** 扫描输入数组并将元素插入哈希表中。对于插入的元素，将 `counter`\
  \ 保持为 1（假设最初所有条目都填充为零）。这表示对应的元素已经出现。现在扫描哈希表并返回计数值为 0 的元素。\n\n时间复杂度：O(*n*)。空间复杂度：O(*n*)。\n\
  \n### 问题-16\n对于问题-13，我们可以改进复杂度吗？\n\n**解决方案：可以。** 我们可以使用求和公式。\n\n1) 获取数字和，`sum =\
  \ n` × (*n* + l)/2。\n2) 从和减去所有数字。\n\n时间复杂度：O(*n*)，用于扫描。\n\n### 问题-17\n在问题-13 中，如果数字和超过了最大整数，我们可能无法获得结果。我们可以解决这个问题吗？\n\
  \n**解决方案：**\n1) 使用所有元素的异或 (XOR)。\n2) 与 1 到 *n* 的数字进行异或。\n3) 结果就是缺失的数字。\n\n![images](img/image0124.jpeg)\n\
  \n时间复杂度：O(*n*)。空间复杂度：O(1)。\n\n### 问题-18\n寻找出现奇数次数的数字：给定一个除一个数字外均为偶数次数出现的数组，找到该数字。\n\
  \n**解决方案：** 使用所有元素的异或。结果将是出现奇数次数的数字。\n**示例：** 输入 (I/P): [1,2,3,2,1] 输出 (O/P): 3\n\
  \n时间复杂度：O(*n*)。空间复杂度：O(1)。\n\n### 问题-19\n在一个所有元素出现一次但在两个元素出现两次的数组。\n\n**解决方案：**\
  \ 使用所有元素的异或得到 `X XOR Y`。由于 `X` 和 `Y` 不同，`X XOR Y` 中至少有一个置位。利用置位将元素分为两组，并对每组进行异或以找到\
  \ `X` 和 `Y`。\n\n时间复杂度：O(*n*)。空间复杂度：O(1)。\n\n### 问题-20\n对于问题-19，我们可以改进时间复杂度吗？\n\n\
  **解决方案：** 使用任何排序算法排序数组，查看是否存在相同值的元素。\n\n时间复杂度：O(*nlogn*)。空间复杂度：O(1)。\n\n### 问题-21\n\
  对于问题-19，我们可以改进复杂度吗？\n\n**解决方案：** 使用计数数组。这种解决方案类似于使用哈希表。为了简单，我们可以使用数组存储计数。遍历数组并使用大小为\
  \ *n* 的临时数组 `count[]` 跟踪所有元素的计数。当我们看到已设置计数的元素，将其作为重复项打印。对两个重复项重复操作。\n\n时间复杂度：O(*n*)。空间复杂度：O(*n*)。\n\
  \n### 问题-22\n考虑问题-19。假设数字在 1 到*n*范围内。有其他解决问题的方法吗？\n\n**解决方案：可以，使用异或运算。** 假设重复数字为\
  \ *X* 和 *Y*，如果我们对数组中的所有元素以及 1 到 *n* 的所有整数进行异或，那么结果将是 *X XOR Y*。*X XOR Y* 二进制表示中的\
  \ 1 对应于 *X* 和 *Y* 之间的不同位。如果 *X XOR Y* 的第 *k* 位为 1，我们可以对数组中的所有元素以及 1 到 n 中第 *k* 位为\
  \ 1 的整数进行异或。结果将是 *X* 和 *Y* 之一。\n\n\n\n\n### 问题-23\n考虑 问题-19。假设数字在 1 到 `n` 的范围内。还有其他方法可以解决这个问题问题吗？\n\
  \n**解决方案：** 我们可以通过建立两个简单的数学方程来解决。假设我们要找的两个数字是 `X` 和 `Y`。我们知道 `n` 个数字之和为 `n(*n* +\
  \ l)/2`，乘积为 `n!`。利用这些和与乘积公式建立两个方程，并用这两个方程求出两个未知数。设数组中所有数字的和为 `S`，乘积为 `P`，重复的数字为\
  \ `X` 和 `Y`。\n\n![images](img/image01244.jpeg)\n\n使用上述两个方程，我们可以找到 `X` 和 `Y`。这种方法可能会出现加法和乘法溢出的问题。\n\
  \n时间复杂度：O(`n`)。空间复杂度：O(1)。\n\n### 问题-24\n与 问题-19 类似，假设数字在 1 到 `n` 的范围内。此外，`n – 1`\
  \ 个元素重复三次，剩余一个元素重复两次。找到重复两次的元素。\n\n**解决方案：** 如果我们对数组中的所有元素和 1 到 `n` 的所有整数进行 `XOR`\
  \ 操作，那么所有重复三次的元素都将变为零。这是因为该元素重复三次，而与范围再次 `XOR` 一次会使该元素出现四次。结果，输出为 `a XOR a XOR a\
  \ a = 0`。所有重复三次的元素也是如此。\n\n同样的逻辑，对于重复两次的元素，如果我们对输入元素以及范围进行 `XOR` 操作，那么该元素出现的总次数为\
  \ 3 次。结果输出为 `of a XOR XOR a = a`。最后，我们得到了重复两次的元素。\n\n时间复杂度：O(`n`)。空间复杂度：O(1)。\n\n\
  ### 问题-25\n给定一个整数数组，除了一个外每个元素都出现两次。找到那个唯一的元素。\n\n**解决方案：** 对所有元素进行位异或 `XRO`。我们得到出现次数正确的数字。\n\
  \n![images](img/image01245.jpeg)\n\n时间复杂度：O(`n`)。空间复杂度：O(1)。\n\n## 问题-26\n假设数字在\
  \ 1 到 `n` 的范围内。此外，`n – 1` 个元素重复三次，剩余一个元素重复两次。找到重复两次的元素。\n\n**解决方案：** 如果我们对数组中的所有元素和\
  \ 1 到 `n` 的所有整数进行 `XOR` 操作，那么所有重复三次的元素都将变为零。这是因为该元素重复三次，而与范围再次 `XOR` 一次会使该元素出现四次。结果输出\
  \ `a XOR a XOR a a = 0`。所有重复三次的元素也是如此。\n\n同样的逻辑，对于重复两次的元素，如果我们对输入元素以及范围进行 `XOR`\
  \ 操作，那么该元素出现的总次数为 3 次。结果输出为 `of a XOR XOR a = a`。最后，我们得到了重复两次的元素。\n\n时间复杂度：O(`n`)。空间复杂度：O(1)。\n\
  \n### 问题-27\n给定一个包含 `n` 个元素的数组。在数组中找到两个元素，使得它们的和等于给定元素 `K`？\n\n**暴力破解解决方案：** 此问题的一种简单方法是，对于每个输入元素，检查是否存在任何元素的和等于\
  \ `K`。我们只需要使用两个简单的 `for` 循环即可解决。该解决方案的代码可以如下：\n\n![images](img/image01246.jpeg)\n\
  \n时间复杂度：O(`n`²)。这是由于两个嵌套的 `for` 循环导致的。空间复杂度：O(1)。\n\n### 问题-28\n对于 问题-27，我们可以改进时间复杂度吗？\n\
  \n**解决方案：是的。** 假设我们已经对给定数组进行了排序。此操作需要 O(`n logn`)。在排序后的数组上，维护索引 `loIndex = 0` 和\
  \ `hiIndex = n – 1` 并计算 `A[loIndex] + A[hiIndex]`。如果和等于 `K`，则解决方案完成。如果和小于 `K`，则减小\
  \ `hiIndex`；如果和大于 `K`，则增加 `loIndex`。\n\n![images](img/image01247.jpeg)\n\n时间复杂度：O(`nlogn`)。如果给定数组已经是排序过的，则复杂度为\
  \ O(`n`)。\n\n空间复杂度：O(1)。\n\n### 问题-29\n问题-27 的解决方案在数组未排序的情况下也有效吗？\n\n**解决方案：是的。**\
  \ 由于我们正在检查所有可能性，算法确保了如果这对数字对存在，我们就能找到它们。\n\n### 问题-30\n还有其他方法可以解决 问题-27 吗？\n\n**解决方案：是的。**\
  \ 假设我们已经对给定数组进行了排序。此操作需要 O(`n logn`)。在排序后的数组上，维护索引 `loIndex = 0` 和 `hiIndex = n\
  \ – 1` 并计算 `A[loIndex] + A[hiIndex]`。如果和等于 `K`，则解决方案完成。如果和小于 `K`，则减小 `hiIndex`；如果和大于\
  \ `K`，则增加 `loIndex`。\n\n\n\n### 问题-36\n我们可以使用排序技术来解决 问题-34 吗？\n\n**解决方案：是的。**\n\n\
  ![images](img/image01253.jpeg)\n\n时间复杂度：排序的时间 + 在有序列表中搜索的时间 = `O(nlogn)` + `O(n²)`\
  \ `≈` `O(n² )`。这是由于两个嵌套的 `for` 循环导致的。空间复杂度：`O(1)`。\n\n### 问题-37\n我们可以使用哈希表技术来解决\
  \ 问题-34 吗？\n\n**解决方案：是的。** 因为我们的目标是找到数组中和为 `K` 的三个索引。假设这些索引为 `X`、`Y` 和 `Z`。这意味着\
  \ `A[X] + A[Y] + A[Z] = K`。\n\n假设我们已经将所有可能的和及其对应的对存储在哈希表中。这意味着哈希表的键为 `K – A[X]`，而\
  \ `K – A[X]` 的值是所有输入中和为 `A[X]` 的可能对。\n\n**算法：**\n\n• 在开始搜索之前，将所有可能的和及其元素对插入哈希表。\n\
  \n• 对于输入数组的每个元素，将其插入哈希表。假设当前元素为 `A[X]`。\n\n• 检查表中是否存在键为 `K — A[X]` 的哈希条目。\n\n• 如果存在这样的元素，则扫描键为\
  \ `K – A[X]` 的元素对，并返回包括 `A[X]` 在内的所有可能对。\n\n• 如果不存在这样的元素（以 `K – A[X]` 为键），则跳到下一个元素。\n\
  \n时间复杂度：在哈希表中存储所有可能的对的时间 + 搜索时间 = `O(n²)` + `O(n²)` `≈` `O(n²)`。空间复杂度：`O(n)`。\n\n\
  ## 问题-38\n给定一个包含 `n` 个整数的数组，三数之和问题是要找到和接近 `zero` 的三个整数。\n\n**解决方案：** 这与 问题-34 相同，只不过\
  \ `K` 的值为 `zero`。\n\n## 问题-39\n设 `A` 是一个包含 `n` 个不同整数的数组。假设 `A` 具有以下属性：存在一个索引 `1\
  \ ≤ k ≤ n`，使得 `A[1],...,A[k]` 是递增序列，且 `A[k + 1],...,A[n]` 是递减序列。设计并分析一个寻找 `k` 的高效算法。\n\
  \n**相似问题：** 假设给定数组是有序的，但负数开头，正数结尾 [此类函数被称为单调递增函数]。在该数组中找到正数的起始索引。假设我们知道输入数组的长度。设计一个\
  \ `O(logn)` 算法。\n\n**解决方案：** 我们使用二分查找的变体。\n\n![images](img/image01254.jpeg)\n\n\
  递归方程为 `T(n) = 2T(n/2) + c`。使用主定理（master-theorem），我们得到 `O(logn)`。\n\n## 问题-40\n如果我们不知道\
  \ `n`，该如何解决 问题-39？\n\n**解决方案：** 重复计算 `A[1], A[2], A[4], A[8], A[16]` 等，直到我们找到一个使得\
  \ `A[n] > 0` 的 `n` 值。\n\n时间复杂度：`O(logn)`，因为我们是以 2 的速率移动的。详情请参考《算法分析导》（Introduction\
  \ to Analysis of Algorithms）章节。\n\n## 问题-41\n给定一个大小未知的输入数组，开头全是 1，结尾全是 0。找到数组中 0\
  \ 开始的索引。考虑数组中有数百万个 1 和 0。例如：数组内容为 1111111………1100000…….0000000。\n\n**解决方案：**这个问题与\
  \ 问题-40 非常相似。以 `2^(K)` 的速率检查位，其中 `k = 0,1,2 ....`。由于我们是以 2 的速率移动，复杂度为 `O(logn)`。\n\
  \n## 问题-42\n给定一个包含 `n` 个整数且经过未知次数旋转的有序数组，请给出一个 `O(logn)` 算法来查找数组中的某个元素。\n\n**示例：**\
  \ 在数组 (15 16 19 20 25 1 3 4 5 7 10 14) 中寻找 5。**输出：** 8（5 在数组中的索引）\n\n**解决方案：** 假设给定数组为\
  \ `A[]`，并使用扩展后的 问题-39 解决方案。下面的 `FindPivot` 函数返回 `k`。\n\n```\n// Logic for FindPivot\
  \ \nfunction FindPivot(A) { }\n```\n\n\n\n\n## 问题-53\n是否存在解决 问题-51 的替代方法？\n\n**解决方案：**\n\
  \n#### 算法：\n* 找到 `data` 的第一次出现的位置，并将其索引命名为 `firstOccurrence`（算法参考 问题-49）\n* 找到 `data`\
  \ 的最后一次出现的位置，并将其索引命名为 `lastOccurrence`（算法参考 问题-50）\n* 返回 `lastOccurrence – firstOccurrence\
  \ + 1`\n\n时间复杂度 = `O(logn + logn)` = `O(logn)`。\n\n### 问题-54\n序列 1, 11, 21 中的下一个数字是什么？为什么？\n\
  \n**解决方案：** 大声读出给定的数字。这只是一个有趣的题。\n\n![images](img/image01264.jpeg)\n\n所以答案是，下一个数字是前一个数字大声读出来后的表示。\n\
  \n![images](img/image01265.jpeg)\n\n### 问题-55\n高效地找到第二小的数字。\n\n**解决方案：** 我们可以使用少于\
  \ `n` 次的比较为给定元素构建一个堆（算法参考*优先级队列* 章节）。然后我们通过 `logn` 次比较的 `GetMax()` 操作找到第二最小的值。总的来说，我们得到\
  \ `n + logn + constant`。\n\n### 问题-56\n是否存在解决 问题-55 的其他解决方案？\n\n**解决方案：** 另一种，将\
  \ n 个数字分成每 2 个一组，连续执行 `n/2` 次比较来找到最大值，使用类似于锦标赛的方法。第一轮将在 `n – 1` 次比较中产生最大值。第二轮将在第一轮的获胜者和被弹出最大值的元素之间进行。这将产生\
  \ `logn – 1` 次比较，总计为 `n + logn – 2`。上述解决方案被称为*锦标赛问题*。\n\n### 问题-57\n如果一个元素出现的次数超过\
  \ `n/2` 次，则它是一个多数元素。给出一个算法，接受一个包含 n 个元素的数组作为参数，并识别出多数元素（如果存在）。\n\n**解决方案：** 基础解决方案是使用两个循环，并跟踪所有不同元素的最大计数。如果最大计数大于\
  \ `n/2`，则跳循环并返回具有最大计数的元素。如果最大计数没有超过 `n/2`，则不存在多数元素。\n\n时间复杂度：`O(n²)`。空间复杂度：`O(1)`。\n\
  \n### 问题-58\n我们将 问题-57 的时间复杂度提高到 `O(nlogn)` 吗？\n\n**解决方案：** 使用二分查找可以实现这一点。二分搜索树（在此方法中使用）的节点将如下。\n\
  \n![images](img/image01266.jpeg)\n\n逐个向 BST 插入元素，如果元素已经存在，则增加节点的计数。在任何阶段，如果一个节点的计数超过\
  \ `n/2`，则返回。这种方法适用于数组开头出现 `n/2 + 1` 次多数元素的情况，例如 {1,1,1,1,1,2,3, 和 4}。\n\n**复杂度：**\
  \ 如果使用二分搜索树，则最坏时间复杂度将是 `O(n²)`。如果使用平衡二分搜索树，则是 `O(nlogn)`。空间复杂度：`O(n)`。\n\n### 问题-59\n\
  是否存在其他方法实现 问题-57 的 `O(nlogn)` 复杂度？\n\n**解决方案：** 对输入数组进行排序并扫描排序后的数组以找到多数元素。\n\n时间复杂度：`O(nlogn)`。空间复杂度：`O(1)`。\n\
  \n### 问题-60\n我们可以提高 问题-57 的复杂度吗？\n\n**解决方案：** 如果一个元素在 `A` 中出现的次数超过 `n/2` 次，那么它必须是\
  \ `A` 的中位数。但反之不成立，因此一旦找到中位数，我们必须检查它在 `A` 中出现了多少次。我们可以使用线性选择，它需要 `O(n)` 时间（算法参考*选择算法*\
  \ 章节）。\n\n![images](img/image01267.jpeg)\n\n### 问题-61\n是否存在解决 问题-57 的其他方法？\n\n**解决方案：**\
  \ 由于只有一个元素重复，我们可以通过跟踪元素的计数来简单地扫描输入数组。如果计数为 0，那么我们可以假设该元素是第一次访问的，否则它就是结果元素。\n\n![images](img/image01268.jpeg)\n\
  \n时间复杂度：`O(n)`。空间复杂度：`O(1)`。\n\n### 问题-62\n给定一个包含 `2*n` 个元素的数组，其中 `n` 个元素相同，其余 `n`\
  \ 个元素互不相同。找到多数元素。\n\n**解决方案：** 重复元素将占据数组的一半。无论如何排列，以下情况仅有一个为真：\n* 所有重复元素彼此之间的距离为\
  \ 2。例如：`n`，\n* 至少有两个元素相邻。例如：`n`\n* 重复元素在一起。例如：`n`\n最坏情况下，我们需要遍历数组：\n* 第一轮：比较 `A[i]`\
  \ 和 `A[i + 1]`\n* 第二轮：比较 `A[i]`\n这将消耗 `O(n)` 时间和 `O(1)` 空间。\n\n### 问题-63\n给定一个具有\
  \ `2*n` 个元素的数组，其中 `n` 个元素出现两次。通过 `O(n)` 操作和 `O(1)` 空间找到该整数。\n\n**解决方案：** 除了一个元素外，所有元素都是重复的。\n\
  \n![images](img/image1269.jpeg)\n\n时间复杂度：`O(n)`。\n\n### 问题-64\n从 n 层楼上扔鸡蛋：假设有 n\
  \ 个鸡蛋。假设从 `F` 层或更高层出的会损坏，否则。设计一种策略在损坏 `logn` 个鸡蛋的情况下确定层 `F`。\n\n**解决方案：** 参考*分治*。\n\
  \n### 问题-65\n数组的最小值：给定一个包含 n 个整数的数组 `A`，设计一个 `O(logn)` 算法找到索引 `i`使得 `A[i-1] < A[i]\
  \ < A[i+1]`。\n\n**解决方案：** 检查中间值 `A[n/2]` 以及两个邻居 `A[n/2-1]` 和 `A[n/2+1]`。如果 `A[n/2]`\
  \ 是局部最小值，停止；否则在较小的一半搜索。\n\n### 问题-66\n给出一个 n n 数组，每行和每列都是升序的，设计一个 `O(n)` 算法确定给定元素\
  \ `x` 是否在数组中。你可以假设 n n 数组中的所有元素都是不同的。\n\n**解决方案：** 假设矩阵为 `A[n][n]`。从最后一行、第一列开始[或第一行、最后一列]。如果搜索的元素大于\
  \ `A[1][n]`，则消除第一列。如果搜索元素小于 `A[1][n]`，则可以完全消除最后一行。一旦消除了第一列或最后一行，从剩余数组的左下角再次开始过程。在该算法中，搜索元素最多与\
  \ n 个元素比较。\n\n![images](img/image1270.jpeg)\n\n时间复杂度：`O(n)`。因为我们将遍历 2*n 个点。空间复杂度：`O(1)`。\n\
  \n### 问题-67\n给定一个包含 n² 个数字的 n n 数组，给出一个 `O(n)` 算法找到索引对 `i` 和 `j`，使得 `A[i][j] < A[i+1][j]`、`A[i][j]\
  \ < A[i][j+1]`、`A[i][j] < A[i-1][j]` 且 `A[i][j] < A[i][j-1]`。\n\n**解决方案：** 这个问题与\
  \ 问题-66 相同。\n\n### 问题-68\n给定一个 n n 矩阵，每行所有的 1 后面都是 0。找到 0 最多的行。\n\n\n\n\n\n**解决方案：**\
  \ 从第一行、最后一列开始。如果元素为 0，则移动到同一行的前一列，同时增加计数器以指示 0 的最大数量。如果元素为 1，则移动到同一列的下一行。重复此过程，直到你到达最后一行、第一列。\n\
  \n时间复杂度：O(2*n*) ≈ O(*n*)（类似于问题-66）。\n\n## 问题-69 \n给定一个大小未知的输入数组，开头是所有数字，末尾是特殊符号。找到数组中特殊符号开始的索引。\n\
  \n**解决方案：** 参考*分治法（*Divide and Conquer*）章节。\n\n## 问题-70：分离偶数和奇数\n给定一个数组 `A`[][]，编写一个函数将偶数和奇数分离。该函数应该将所有的偶数放在前面，然后是奇数。\n\
  \n**示例：** 输入 = {12,34,45,9,8,90,3} 输出 = {12,34,90,8,9,45,3}\n\n**注意：** 在输出中，数字的顺序可以改变，例如在上面的示例中，34\
  \ 可以出现在 12 之前，3 可以出现在 9 之前。\n\n**解决方案：** 这个问题与数组中的*分离 0 和 1*（问题-71）非常相似，而且这两个问题都是著名的*荷兰国旗问题（*Dutch\
  \ national flag problem*）的变体。\n\n**算法：** 逻辑类似于快速排序。\n\n1 初始化两个索引变量 `left` 和 `right`：`left`\
  \ = 0, `right = n` – 1\n2) 继续增加 `left` 索引，直到看到一个奇数。\n3) 继续减少 `right` 索引，直到看到一个偶数。\n\
  4) 如果 `left < right`，则交换 `A`[`left`]` 和 `A`[`right`]`\n\n![images](img/image01271.jpeg)\n\
  \n时间复杂度：O(*n*)。空间复杂度：O(1)。\n\n## 问题-71\n以下是问题-70 的另一种结构方法，但略有不同。\n\n**分离数组中的 0 和\
  \ 1：** 给出一个随机顺序的 0 和 1 数组。将 0 放在数组左侧，1 放在数组右侧。只遍历一次数组。\n\n输入数组 = [0,1,0,1,0,0,1,1,1,0]\n\
