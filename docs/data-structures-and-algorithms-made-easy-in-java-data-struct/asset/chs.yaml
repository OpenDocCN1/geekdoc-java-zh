  是否有其他方法解决 Problem-39？\n\n**解决方案：** 技巧在于重用已填充的 `nextSibling` 指针。如前所述，我们只需要多一步即可使其工作。在将\
  \ `left` 和 `right` 传递给递归函数之前，我们将右子节点的 `nextSibling` 连接到当前节点的 `nextSibling` 左孩子。为了使此起作用，当前节点的\
  \ `nextSibling` 指针必须被填充，这在在这种情况下是成立。\n\n![Image](img/image00855.jpeg)\n\n时间复杂度：O(*n*)。\n\
