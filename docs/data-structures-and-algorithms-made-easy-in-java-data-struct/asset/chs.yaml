  \ 经过。\n\n在每次迭代中，值 `A[i][j]` 将被更新为 `A[k-1][i,j]` 与 `A[k-1][i, k]` + `A[k*-1][k,j]`\
  \ 的最小值。\n\n![images](img/image01603.jpeg)\n\n第 `k^(th)` 轮扫描探索顶点 `k` 是否位于所有 `i`,`j`\
