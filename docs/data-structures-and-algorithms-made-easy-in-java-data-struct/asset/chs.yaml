  \n![Image](img/image00873.jpeg)\n\n时间复杂度：`O(n)`。空间复杂度：`O(1)`。\n\n### 问题-49\n完全 `k–ary`\
  \ 树是指每个节点拥有 0 个或 `k` 个子节点的树。给定一个包含完全 `k–ary` 树前序遍历的数组，给出一个构造完全 `k–ary` 树的算法。\n\n\
  **解决方案：** 在 k 叉树中，位于 $i^{th}$ 位置的节点其孩子将位于 `k * i + 1` 到 `k * i + k`。例如，下面的示例是一个完全\
  \ 3 叉树。\n\n![Image](img/image00874.jpeg)\n\n正如我们所见，在前序遍历中，首先处理左子树，然后是根节点和右子树。正如此，为了构造完全\
  \ `k`-叉树，我们只需要不断创建节点，而无需担心之前构造的节点。我们可以使用这个技巧，通过一个全局索引递归地构建树。k 叉树的定义可以给出：\n\n![Image](img/image00875.jpeg)\n\
  \n时间复杂度：`O(n)`，其中 `n` 是前序数组的大小。这是因为我们是顺序移动的，没有访问已经构造的节点。\n\n### 6.6 线索（无栈或无队列）二叉树遍历\n\
  在之前的章节中，我们看到`前序、中序和后序`二叉树遍历使用了栈，而`层序`遍历使用了队列作为辅助数据结构。在本节中，我们将讨论不需要栈和队列的新遍历算法。此类遍历算法被称为`线索二叉树遍历`或`无栈/无队列遍历`。\n\
  \n#### 普通二叉树遍历的问题\n- 栈和队列所需的存储空间很大。\n- 任何二叉树中的大多数指针都是 NULL。例如，一个拥有 `n` 个节点的二叉树有\
  \ `n + 1` 个 NULL 指针，这些都被浪费了。\n- 很难为给定节点找到后继节点（前序、中序和后序后继）。\n\n![Image](img/image00876.jpeg)\n\
  \n#### 线索二叉树的动机\n为了解决这些问题，一种思想是在 NULL 指针中存储某些信息。仔细观察之前的遍历，使用栈/队列是因为我们在处理完左子树后需要移动到右子树。如果我们在\
  \ NULL 指针中存储这种信息，就不需要栈/队列。从上述讨论中，让我们假设我们想要存储某些信息。下一个问题是存储什么？这意味着如果我们处理的是前序遍历，对于给定节点，NULL\
  \ 左指针将包含前驱信息，NULL 右指针将包含后继信息。这些特殊的指针被称为`线索`。\n\n#### 线索二叉树的分类\n分类基于我们是否在两个 NULL\
  \ 指针中都存储信息或仅存储其中一个。\n\n- 如果我们只在 NULL 左指针中存储前驱信息，则此类二叉树称为`左线索二叉树`。\n- 如果我们只在 NULL\
  \ 右指针中存储后继信息，则此类二叉树称为`右线索二叉树`。\n- 如果我们在 NULL 左指针中存储前驱信息并在 NULL 右指针中存储后继信息，则我们将此类二叉树为`完全线索二叉树`或简单称为`线索二叉树`。\n\
  \n**注意：** 在后续讨论中，我们只考虑（完全）线索二叉树。\n\n#### 线索二叉树的类型\n基于上述讨论，我们得到了线索二叉树的三种表示。\n\n-\
  \ `前序线索二叉树`：NULL 左指针将包含前序前驱信息，NULL 右指针将包含前序后继信息。\n- `中序线索二叉树`：NULL 左指针将包含中序前驱信息，NULL\
  \ 右指针将包含中序后继信息。\n- `后序线索二叉树`：NULL 左指针将包含后序前驱信息，NULL 右指针将包含后序后继信息。\n\n**注意：** 由于表示方法相似，在后续讨论中，我们将使用中序线索二叉树。\n\
  \n#### 线索二叉树结构\n任何检查树的程序都必须区分普通的`左/右`指针和`线索`。为了做到这一点，我们在每个节点中使用两个额外的字段，使得线索树的节点形式如下：\n\
  \n![Image](img/image00877.jpeg)\n\n![Image](img/image00878.jpeg)\n\n#### 二叉树与线索二叉树结构的区别\n\
  ![Image](img/image00879.jpeg)\n\n**注意：** 同样，我们也可以为前序/后序定义类似的区别。\n\n\n\n\n例如，让我们尝试用中序线程二叉树的形式来表示一棵树。下面的树展示了中序线程二叉树的样子。虚线表示线程。如果我们观察发现，最左侧节点\
  \ (2) 的左指针和最右侧节点 (31) 的右指针是悬空的。\n\n![Image](img/image00880.jpeg)\n\n## 最左和最右指针应该指向哪里？\n\
  \n在线程二叉树的表示中，使用一个特殊的节点 `Dummy` 是方便的，即使对于空树，它也存在。请注意 `Dummy` 节点的右标签为 1，它的右孩子指向它自己。\n\
  \n![Image](img/image00881.jpeg)\n\n按照这种约定，上面的树可以表示为：\n\n![Image](img/image00882.jpeg)\n\
  \n## 在中序线程二叉树中寻找中序后继节点\n\n为了在不使用栈的情况下找到给定节点的中序后继，假设我们要寻找中序后继的节点为 `P`。\n\n**策略：**\
  \ 如果 `P` 没有右子树，则返回 `P` 的右孩子。如果 `P` 有右子树，则返回左子树包含 `P` 的最近节点的左孩子。\n\n![Image](img/image00883.jpeg)\n\
  \n时间复杂度：O(*n*)。空间复杂度：O(1)。\n\n## 中序线程二叉树中的中序遍历\n\n我们可以从 `dummy` 节点开始，调用 `InorderSuccessor()`\
  \ 访问每个节点，直到到达 `dummy` 节点。\n\n![Image](img/image00884.jpeg)\n\n**另一种编码方式：**\n\n![Image](img/image00885.jpeg)\n\
  \n时间复杂度：O(*n*)。空间复杂度：O(1)。\n\n## 在序线程二叉树中寻找前序后继节点\n\n**策略：** 如果 `P` 有左子树，则返回 `P`\
  \ 的左孩子。如果 `P` 没有左子树，则返回右子树包含 `P` 的最近节点的右孩子。\n\n![Image](img/image00886.jpeg)\n\n\
  时间复杂度：O(*n*)。空间复杂度：O(1)。\n\n## 中序线程二叉树的前序遍历\n\n与中序遍历一样，从 `dummy` 节点开始并调用 `PreorderSuccessor()`\
  \ 访问每个节点，直到再次得到 `dummy` 节点。\n\n![Image](img/image00887.jpeg)\n\n**另一种编码方式：**\n\n\
  ![Image](img/image00888.jpeg)\n\n时间复杂度：O(*n*)。空间复杂度：O(1)。\n\n**注意：** 从上述讨论可以得很清楚，使用线程二叉树寻找中序和前序后继是简单的。但如果不使用栈，寻找后序后继是非常困难的。\n\
  \n## 中序线程二叉树中的节点插入\n\n为了简单起见，假设有两个节点 `P` 和 `Q`，我们想将 `Q` 连接到 `P` 的右侧。这有两种情况。\n\n\
  - 节点 `P` 没有右孩子：在这种情况下，我们只需要将 `Q` 挂在 `P` 上并改变它的左右指针。\n\n![Image](img/image00889.jpeg)\n\
  \n- 节点 `P` 有右孩子（例如，`R`）：在这种情况下，我们需要遍历 `R` 的左子树并找到最左侧节点，然后更新该节点的左右指针（如下所示）。\n\n![Image](img/image00890.jpeg)\n\
  \n![Image](img/image00891.jpeg)\n\n时间复杂度：O(*n*)。空间复杂度：O(1)。\n\n## 线程二叉树：问题与解决方案\n\
  \n**问题-50** 对于一个给定的二叉树（非线程的），我们如何找到前序后继节点？\n\n**解决方案：** 为了解决这个问题，我们需要使用一个辅助栈 5。在第一次调用时，参数\
  \ `node` 是指向树根的指针，之后其值为 NULL。由于我们只是请求上一次调用函数时获得的节点的后继，因此有必要栈 `S` 的内容和指向上一次“访问”节点的指针\
  \ `P` 在函数调用到下次调用之间被保留；它们被定义为静态变量。\n\n![Image](img/image00892.jpeg)\n\n**问题-51**\
  \ 对于一个给定的二叉树（非线程的），我们如何找到中序后继节点？\n\n**解决方案：** 与上述讨论类似，我们可以通过以下方式找到节点的中序后继：\n\n![Image](img/image00893.jpeg)\n\
  \n## 6.7 表达式树\n\n表示表达式的树称为 `expression tree`。在表达式树中，叶子节点是操作数，非叶子节点是运算符。这意味着表达式树是一种二叉树，其中内部节点是运算符，叶子是操作数。表达式树由二元表达式组成。但对于\
  \ n 元运算符，一个子树将是空的。下图显示了 (A + B * C) / D 的一个简单表达式树。\n\n![Image](img/image00894.jpeg)\n\
  \n### 从后序表达式构建表达式树的算法\n\n![Image](img/image00895.jpeg)\n\n#### 示例\n\n**示例：** 假设一次读取一个符号。如果该符号是操作数，我们创建一个树节点并将指向它的指针推入栈。如果该符号是运算符，从栈中弹出指向两棵树\
  \ `T[1]` 和 `T[2]` 的指针（`T[1]` 和 `T[2]`）。（注：此处原文逻辑似乎不完整，仅按原文翻译）\n\n（注：由于原文示例描述处逻辑跳跃，翻译已严格遵循原文结构）\n\
  \n## 6.8 XOR 树\n\n这个概念类似于*链表*章节中的*内存高效双向链表*。同样，像线程二叉树一样，这种表示方法不需要栈或队列来遍历树。使用 ⊕ 操作向后（到父）和向前（到孩子）。这种表示方法使用的规则如下：\n\
  \n- 每个节点的左指针是父节点与其左孩子的异或。\n- 每个节点的右指针是父节点与其右孩子的异或。\n- 根节点的父节点为 NULL，叶子节点也是 NULL。\n\
  \n![Image](img/image00901.jpeg)\n\n根据上述规则和讨论，树可以表示为：\n\n![Image](img/image00902.jpeg)\n\
  \n这种演示的主要目标是能够移动到父节点以及孩子。现在，让我们看看如何使用这种表示方法遍历树。例如，如果我们位于节点 B 并想移动到父节点 A，我们只需要对左内容与左孩子地址进行异或（我们也可以使用右孩子进入父节点）。\n\
  \n同样，如果我们想移动到它的孩子（例如，左孩子 D），我们必须对它的左内容与父节点地址进行异或。关于这种表示方法我们需要理解的一个重要点是：当我们位于节点 B\
  \ 时，如何知道它的孩子的地址？由于遍历从根节点开始，我们可以对根的左内容与 NULL 进行异或。结果我们得到了它的左孩子 B。当我们位于 B 时，我们可以对\
  \ B 的左内容与 A 地址进行异或。\n\n## 6.9 二叉搜索树 (BSTs)\n\n### 为什么使用二叉搜索树？\n\n在之前的章节中我们讨论了不同的树表示方法，在所有这些方法中我们都没有对节点数据设置任何限制。因此，为了搜索一个元素，我们需要同时检查左子树和右子树。由于由于，搜索操作的最坏情况复杂度为\
  \ O(*n*)。\n\n\n\n\n在本节中，我们将讨论二叉树的另一种变体：二叉搜索树（BST）。正如名称所示，这种表示法的主要用途是`searching`。在这种表示中，我们对节点可以包含的数据类型进行了限制。因此，它将最坏情况下的平均搜索操作降低到了`O(logn)`。\n\
  \n## 二叉搜索树属性\n\n在二叉搜索树中，所有左子树元素都小于根节点数据，所有右子树元素都大于根节点数据。这被称为二叉搜索树属性。注意，该属性应该在树的每个节点处满足。\n\
  \n- 节点的左子树包含键小于该节点键的节点。\n- 节点的右子树包含键大于该节点键的节点。\n- 左右子树也必须是二叉搜索树。\n\n![Image](img/image0090.jpeg)\n\
  \n**示例：** 左树是二叉搜索树，而右树不是二叉搜索树（在节点 6 处不满足二叉搜索树属性）。\n\n![Image](img/image00904.jpeg)\n\
  \n## 二叉搜索树的声明\n\n普通二叉树的声明与二叉搜索树的声明没有区别。区别仅在于数据，而不在结构。但为了方便起见，我们将结构名称更改为：\n\n![Image](img/image00905.jpeg)\n\
  \n## 二叉搜索树的操作\n\n#### 主要操作\n\n以下是二叉搜索树支持的主要操作：\n\n- 在二叉搜索树中查找/查找最小值 / 查找最大值\n- 在二叉搜索树中插入元素\n\
  - 从二叉搜索树中删除元素\n\n#### 辅助操作\n\n- 检查给定树是否为二叉搜索树\n- 查找树中第 `k^(th)` 小的元素\n- 对二叉搜索树的元素进行排序等\n\
  \n## 关于二叉搜索树的注意事项\n\n- 由于根数据始终位于左子树数据和右子树数据之间，对二叉搜索树执行`inorder traversal`产生一个有序列表。\n\
  - 在解决二叉搜索树的问题时，我们首先处理左子树，然后是根数据，最后处理右子树。这意味着根据问题的不同，只有中间步骤（处理根数据）会发生，我们不触碰第一和第三步。\n\
  - 如果我们正在搜索一个元素，且左子树根数据小于我们要搜索的元素，则跳过它。右子树的情况也是如此。因此，二叉搜索树搜索元素的时间比普通二叉树更短。换句话说，二叉搜索树在搜索元素时只考虑左子树或右子树，而不是两者都考虑。\n\
  - 在二叉搜索树（BST）上可以的基本的操作是插入元素、删除元素和搜索元素。在 BST 上执行这些操作时，树的高度每次都会发生变化。因此，最好情况、平均情况和最坏情况的时间复杂度存在差异。\n\
  - 二叉搜索树的基本操作所需的时间与树的高度成正比。对于具有 `n` 个节点的完全二叉树，此类操作在最坏情况下的运行时间为`O(lgn)`。然而，如果树是 `n`\
  \ 个节点的线性链（倾斜树），相同的操作在最坏情况下需要`O(n)` 时间。\n\n## 在二叉搜索树中查找元素\n\n`Find` 操作在 BST 中非常直观。从根节点开始，利用\
  \ BST 属性不断向左或向右。如果我们搜索的数据与节点数据相同，则返回当前节点。如果搜索的数据小于节点数据，则搜索当前节点的左子树；否则搜索当前节点的右子树。如果数据不存在，我们将止于一个\
  \ `null` 链接。\n\n![Image](img/image00906.jpeg)\n\n时间复杂度：`O(n)`，最坏情况（当给定的二叉搜索树为倾斜树时）。\n\
  \n空间复杂度：`O(n)`，用于递归栈。\n\n上述算法的`Non recursive`版本可以给出如下：\n\n![Image](img/image00907.jpeg)\n\
  \n时间复杂度：`O(n)`。空间复杂度：`O(1)`。\n\n## 在二叉搜索树中查找最小值\n\n在 BST 中，最小元素是最左侧的节点，它没有左孩子。在下方的\
  \ BST 中，最小元素是 **4**。\n\n![Image](img/image00908.jpeg)\n\n![Image](img/image00909.jpeg)\n\
  \n时间复杂度：`O(n)`，最坏情况（当 BST 为`left skew` 树时）。\n\n空间复杂度：`O(n)`，用于递归栈。\n\n上述算法的`Non\
  \ recursive`版本可以给出如下：\n\n![Image](img/image00910.jpeg)\n\n时间复杂度：`O(n)`。空间复杂度：`O(1)`。\n\
  \n## 在二叉搜索树中查找最大值\n\n在 BST 中，最大元素是最右侧的节点，它没有右孩子。在下方的 BST 中，最大元素是 **16**。\n\n![Image](img/image00911.jpeg)\n\
  \n![Image](img/image00912.jpeg)\n\n时间复杂度：`O(n)`，最坏情况（当 BST 为`right skew` 树时）。\n\n\
  空间复杂度：`O(n)`，用于递归栈。\n\n上述算法的`Non recursive`版本可以给出如下：\n\n![Image](img/image00913.jpeg)\n\
  \n时间复杂度：`O(n)`。空间复杂度：`O(1)`。\n\n## 中序前驱和后继在哪里？\n\n在假设所有键都不同的情况下，二叉搜索树中节点 `X` 的中序前驱和后继在哪里？\n\
  \n如果 `X` 有两个孩子，则其中序前驱是左子树中的最大值，中序后继是右子树中的最小值。\n\n![Image](img/image00914.jpeg)\n\
  \n如果如果它没有左孩子，则其中序前驱是它的左祖先。\n\n![Image](img/image00915.jpeg)\n\n## 在二叉搜索树中插入元素\n\n\
  要在二叉搜索树中插入`data`，我们首先需要找到该元素的位置。我们可以通过与`find`操作相同的机制找到插入位置。在查找位置时，如果`data`已经存在，我们可以简单忽略并退出。否则，在路径的最后一个位置插入\
  \ `data`。\n\n作为一个示例，让我们考虑下面的树。虚线节点表示要插入的元素 (5)。为了插入 5，使用`find` 函数遍历树。在键为 4 的节点处我们需要向右，但没有子树，所以\
  \ 5 不在树中，这就是正确的插入位置。\n\n![Image](img/image00916.jpeg)\n\n![Image](img/image00917.jpeg)\n\
  \n**注意：** 在上述代码中，在子树中插入元素后，树会被返回给其父节点。因此，整棵树将得到更新。\n\n时间复杂度：`O(n)`。\n\n空间复杂度：`O(n)`，用于递归栈。对于迭代版本，空间复杂度为\
  \ O(1)。\n\n## 从二叉搜索树中删除元素\n\n删除操作比其他操作复杂。这是因为要删除的元素可能不是叶子节点。在此操作中，我们首先需要找到要删除的元素的位置。一旦找到了要删除的节点，考虑以下情况：\n\
  \n- 如果要删除的元素是叶子节点：向其父节点返回 `NULL`。这意味着将相应的指针设置为 `NULL`。在下面的树中，删除 5 时，将其父节点 2 设置为\
  \ `NULL`。\n\n![Image](img/image00918.jpeg)\n- 如果删除的元素有一个孩子：在这种情况下，我们只需要将当前节点发送到其父节点。在下面的树中，删除\
  \ 4 时，将 4 的左子树设置为其父节点 2。\n\n![Image](img/image00919.jpeg)\n\n\n\n\n\n- 如果要删除的元素同时具有两个子节点：通用策略是用左子树中最大的元素替换该节点的键值，并递归地删除该节点（该节点现在为空）。左子树中最大的节点不会有右孩子，因此第二次\
  \ `delete` 操作是很容易的。例如，让我们考虑下面这树。在下方的树中，要删除 8，它是根节点的右孩子。键值为 8。它被其左子树中最大的键（7）替换，然后按照之前的方法删除该节点（第二种情况）。\n\
  \n![Image](img/image0092.jpeg)\n\n**注意：** 我们也可以用右子树中的最小元素进行替换。\n\n![Image](img/image00921.jpeg)\n\
  \n时间复杂度：`O(n)`。\n\n空间复杂度：递归栈需要 `O(n)`。对于迭代版本，空间复杂度为 `O(1)`。\n\n## 二叉搜索树：问题与解决方案\n\
  \n**注意：** 对于与二叉搜索树和平衡二叉搜索树相关的排序类问题，中序遍历（Inorder traversal）比其他方法更有优势，因为它提供了排序后的顺序。\n\
  \n### 问题-52\n给出一个寻找二叉搜索树（BST）中两个节点之间最短路径的算法。\n\n**解决方案：** 这无非是寻找 BST 中两个节点的最小公共先祖（LCA）。\n\
  \n## 问题-53\n给出一个计算具有 `n` 个节点的可能存在的 BST 数量的算法。\n\n**解决方案：** 这是一个动态规划（DP）问题。请参考 `Dynamic\
  \ Programming` 章节获取该算法。\n\n### 问题-54\n给定二叉搜索树中两个节点的指针，找到最低公共先祖（`LCA`）。假设这两个值都存在于树中。\n\
  \n**解决方案：** 解决方案的主要思路是：当从根节点向下遍历 BST 时，我们遇到的第一个值于 `α` 和 `β` 之间的节点（即 `α < node →\
  \ data < β`）就是 `α` 和 `β` 的最小公共先祖（LCA）（其中 `α < β`）。因此，只需以前序遍历 BST，如果发现发现一个值在 `α`\
  \ 和 `β` 之间的节点，那么该节点就是 LCA。如果它的值同时大于 `α` 和 `β`，则 LCA 位于节点的左侧；如果它的值同时小于 `a` 和 `β`，则\
  \ LCA 位于节点的右侧。\n\n![Image](img/image00922.jpeg)\n\n![Image](img/image00923.jpeg)\n\
  \n时间复杂度：`O(n)`。空间复杂度：对于倾斜树为 `O(n)`。\n\n### 问题-55\n给出一个算法来检查给定的二叉树是否为 BST。\n\n**解决方案：**\
  \ 考虑以下简单程序。对于每个节点，检查其左侧节点是否较小，检查其右侧节点是否更大。\n\n![Image](img/image00924.jpeg)\n\n\
  这种方法是错误的，因为它会为下方的二叉树返回 true。仅检查当前节点是不够的。\n\n![Image](img/image00925.jpeg)\n\n###\
  \ 问题-56\n我们能得到正确的算法吗？\n\n**解决方案：** 对于每个节点，检查左子树中的最大值是否小于当前节点的数据，且右子树中的最小值是否大于节点数据。\n\
  \n![Image](img/image00926.jpeg)\n\n假设我们有辅助函数 `FindMin()` 和 `FindMax()`，它们从非空树中返回最小或最大整数值。\n\
  \n时间复杂度：`O(n²)`。空间复杂度：`O(n)`。\n\n### 问题-57\n我们可以改进 问题-56 的复杂度吗？\n\n**解决方案：是的。**\
  \ 更好的解决方案是只查看每个节点。技巧是编写一个辅助函数 `IsBSTUtil(BinaryTreeNode* root, int min, int max)`，它在向下遍历树的同时跟踪不断收紧允许的最小最大值，只查看每个节点。min\
  \ 和 max 的初始值应该是 `INT_MIN` 和 `INT_MAX` —— 它们从那里缩小。\n\n![Image](img/image00927.jpeg)\n\
  \n时间复杂度：`O(n)`。空间复杂度：对于栈空间为 `O(n)`。\n\n### 问题-58\n我们可以进一步改进 问题-56 的复杂度吗？\n\n**解决方案：是的，**\
  \ 通过使用中序遍历。该解决方案背后的思想是 BST 的中序遍历会产生有序列表。在按中序遍历 BST 时，在每个节点处检查条件：其键值应大于上一次访问节点的键值。此外，我们需要将\
  \ `prev` 初始化为可能的最小整数（例如，`Integer.MIN_VALUE`）。\n\n![Image](img/image00928.jpeg)\n\
  \n时间复杂度：`O(n)`。空间复杂度：对于栈空间为 `O(n)`。\n\n### 问题-59\n给出一个空间复杂度为 `O(1)` 的将 BST 转换为循环双向链表（DLL）的算法。\n\
  \n**解决方案：** 将左左右子树转换为双向链表并维护这些列表的末端。然后调整指针。\n\n![Image](img/image00929.jpeg)\n\n\
  时间复杂度：`O(n)`。\n\n### 问题-60\n给定一个有序双向链表，给出一个转换为平衡二叉搜索树的算法。\n\n**解决方案：** 找到列表长度并自底向上构建树。\n\
  \n![Image](img/image00930.jpeg)\n\n时间复杂度：`2*T(n/2) + O(n)`。\n\n### 问题-61\n给定一个有序数组，给出一个将数组转换为\
  \ BST 的算法。\n\n**解决方案：** 如果我们要选择数组元素作为 BST 的根节点，应该选哪一个？我们需要选择中间元素。因此，下面的代码以 `O(n)`\
  \ 时间创建 BST。比较该代码与二分搜索算法有多相似。它们都使用了分治治法。\n\n![Image](img/image00931.jpeg)\n\n时间复杂度：`O(n)`。空间复杂度：对于栈空间为\
  \ `O(n)`。\n\n### 问题-62\n给定一个有序的单链表，将其转换为高度平衡二叉搜索树。\n\n**解决方案：** 朴素的方法是直接应用 问题-60\
  \ 的解决方案。在每次递归调用中，我们需要遍历列表的一半来找到中间元素。运行复杂度显然是 `O(nlogn)`，其中 `n` 是列表中元素的总数。这是因为每一层递归调用都需要总共\
  \ `n/2` 个遍历步骤，而总共有 `logn` 个层级（即平衡树的高度）。\n\n\n\n\n\n![Image](img/image00932.jpeg)\n\
  \n### Problem-64\n给出一个在二叉搜索树（BST）中寻找第 `k^(th)` 小元素的算法。\n\n**解决方案：** 该方案背后的思想是 BST\
  \ 的中序遍历会产生排序后的列表。在中序遍历 BST 的过程中，记录访问的元素数量。\n\n![Image](img/image00933.jpeg)\n\n\
  时间复杂度：O(*n*)。空间复杂度：O(1)。\n\n### Problem-65\n**下地板（Floor）和上地板（Ceiling）：** 如果给定的键小于\
  \ BST 根节点的值，则该键的下地板（BST 中小于或等于该键的最大键）必须在左子树中。如果键大于根节点的值，则该键的下地板可能在右子树中，但前提是右子树中存在小于或等于该键的键；如果没有（或者键等于根节点的值），则根节点的值就是该键的下地板。寻找上地板的方法类似，只需交换左右子树即可。例如，如果输入数组排序后为\
  \ {1, 2, 8, 10, 10, 12, 19}那么\n\n对于 `x` = 0：数组中不存在 floor，ceil = 1，\n\n对于 `x` = 1：floor\
  \ = 1, ceil = 1\n\n对于 `x` = 5：floor = 2, ceil = 8，\n\n对于 `x` = 20：floor = 19，数组中不存在\
  \ ceil\n\n**解决方案：** 该方案背后的思想是，BST 的中序遍历会产生排序后的列表。在中序遍历 BST 的过程中，记录被访问的值。如果根节点的数据大于给定值，则返回我们在遍历过程中维护的上一个值。如果根节点的数据等于给定数据，则返回根节点的数据。\n\
  \n![Image](img/image00934.jpeg)\n\n时间复杂度：O(*n*)。空间复杂度：O(*n*)，用于栈空间。\n\n对于上地板，我们只需要先调用右子树，然后调用左子树。\n\
  \n![Image](img/image00935.jpeg)\n\n时间复杂度：O(*n*)。空间复杂度：O(*n*)，用于栈空间。\n\n### Problem-66\n\
  给出一个寻找两个 BST 的并集和交集的算法。假设父节点指针可用（例如线索二叉树）。同时，假设两个 BST 的长度分别为 *m* 和 *n*。\n\n**解决方案：**\
  \ 如果父节点指针可用，则问题与合并两个排序列表相同。这是因为当我们每次调用中序后继节点时，都会得到下一个较大的元素。这只是调用哪一个 `InorderSuccessor`\
  \ 的问题。\n\n时间复杂度：O(*m* + *n*)。空间复杂度：O(1)。\n\n### Problem-67\n对于 Problem-66，如果没有父节点指针怎么办？\n\
  \n**解决方案：** 如果没有父节点指针，可以将 BST 转换为链表，然后进行合并。\n\n1. 在 O(*n* + *m*) 时间内将两个 BST 转换为排序后的双向链表。这会产生\
  \ 2 个排序后的列表。\n2. 将两个双向链表合并为一个，并在 O(*n* + *m*) 时间内同时维护元素总数。\n3. 在 O(*n* + *m*) 时间内将排序后的双向链表转换为高度平衡树。\n\
  \n### Problem-68\n对于 Problem-66，是否有解决该问题的替代方法？\n\n**解决方案：是的，** 通过使用中序遍历。\n\n* 对其中一个\
  \ BST 进行中序遍历。\n* 在执行遍历时，将它们存储在表中（哈希表）中。\n* 完成第一个 *BST* 的遍历后，开始遍历第二个 *BST* 并将其与哈希表的内容进行比较。\n\
  \n时间复杂度：O(*m* + *n*)。空间复杂度：O(*Max*(*m*, *n*))。\n\n### Problem-69\n给定一个 *BST* 和两个数字\
  \ `K1`, `K2`，给出一个打印在 `K1` 和 `K2` 范围内所有 `BST` 元素的算法。\n\n**解决方案：**\n\n![Image](img/image00936.jpeg)\n\
  \n时间复杂度：O(*n*)。空间复杂度：O(*n*)，用于栈空间。\n\n### Problem-70\n对于 Problem-69，是否有解决该问题的替代方法？\n\
  \n**解决方案：** 我们可以使用层序遍历：在将元素添加到队列时检查范围。\n\n![Image](img/image00937.jpeg)\n\n时间复杂度：O(*n*)。空间复杂度：O(*n*)，用于队列。\n\
  \n### Problem-71\n对于 Problem-69，我们还能想出解决该问题的替代方法吗？\n\n**解决方案：** 首先通过普通的二分查找定位 `K1`，之后使用\
  \ `InOrder successor` 直到遇到 `K2`。关于算法，请参考线索二叉树的 *Problems* 部分。\n\n### Problem-72\n\
  给定一个二叉搜索树的根节点，修剪该树，使得所有元素都位于 `A` 和 `B` 之间。Problem-69。\n\n### Problem-73\n给定两个 BST，检查它们是否相同。例如：两个\
  \ BST 10 5 20 15 30。\n\n**解决方案：** 一种方法是对两棵树进行中序遍历。由于中序遍历提供了排序后的列表，我们可以检查哈希表中是否存在不匹配。\n\
  \n时间复杂度：O(*max*(*m, n*))。空间复杂度：O(1)。这取决于第一棵树。\n\n### Problem-74\n对于 Problem-73，我们可以降低时间复杂度吗？\n\
  \n**解决方案：** 与其一个接一个地执行遍历，我们可以并行执行*中序*遍历。由于中序遍历提供了排序后的列表，我们可以检查它是否存在。\n\n### Problem-75\n\
  给定一个大小为 *n* 的 BST，其中每个节点 r 都有一个额外的字段 `size`，该字段表示以 r 为根的子树中键的数量（包括根节点）。给出一个 O(*h*)\
  \ 算法 `Greaterthan(r, k)` 来找到严格大于 *k* 的键的数量（*h* 是二叉树的高度）。\n\n时间复杂度：O(*h*)，其中在最坏情况下为\
  \ *h*O(*n*)，平均情况下为 O(*logn*)。\n\n**解决方案：**\n\n![Image](img/image00938.jpeg)\n\n\
  如果每个节点的键都是唯一值，建议的算法运行良好。否则，在遇到 `k=r.data` 时，我们应该开始向右移动直到到达键大于 *k* 的节点 `y`，然后我们应该返回\
  \ `keysCount + y.size`。\n\n\n\n\n\n在`HB`(`k*`)中，如果`k = 1`（如果平衡因子为 1），则这种二叉搜索树被称为`AVL\
  \ 树`。这意味着`AVL 树`是一种满足`balance`balance 平衡条件的二叉搜索树：左子树高度与右子树高度之差最多为 1。\n\n## AVL 树的属性\n\
  \n一棵二叉树被称为 AVL 树，如果满足：\n\n* 它是一棵二叉搜索树，且*对于任意节点 `X`，`X`的左子树高度和`X`的右子树高度之差不超过 1。\n\
  \n例如，在上述二叉搜索树中，左侧的不是 AVL 树，而右侧的二叉搜索树是 AVL 树。\n\n![Image](img/image00940.jpeg)\n\n\
  ## AVL 树最小/最大节点数\n\n为了简单起见，我们假设 AVL 树的高度为 `h`，`N(h)` 表示高度为 `h`的 AVL 树的节点数量。为了得到高度为\
  \ `h` 的最小节点数，我们应该尽可能用最少的节点填充树。这意味着，如果我们填充高度为 `h – 1` 的左子树，就应该填充高度为 `h – 2` 的右子树。结果，高度为\
  \ `h` 的最小节点数为：\n\n![Image](img/image00941.jpeg)\n\n在上述方程中：\n\n* `N(h – 1)` 表示高度为\
  \ `h – 1` 的最小节点数。\n* `N(h – 2)` 表示高度为 `h – 2` 的最小节点数。\n* 在上述表达式中，“1”表示当前节点。\n\n\
  我们可以将 `N(h – 1)` 分配给左子树或右子树。求解上述递归方程得到：\n\n![Image](img/image00942.jpeg)\n\n其中 `n`\
  \ 是 AVL 树的节点总数。此外，上述推导还说明了 AVL 树的最大高度为 `O(log n)`。\n\n同样地，为了得到最大节点数，我们需要填充两个高度为\
  \ `h – 1` 的左右子树。结果是，我们得到 `N(h) *= N(h – 1) + N(h – 1) + 1 = 2*N(h – 1) + 1`。上述表达式定义了满二叉树的情况。求解递归方程得到：\n\
  \n![Image](img/image00943.jpeg)\n\n∴ 在两种情况下，AVL 树属性都确保了拥有 `n` 个节点的 AVL 树的高度为 `O(log\
  \ n)`。\n\n![Image](img/image00944.jpeg)\n\n## AVL 树的声明\n\n由于 AVL 树是 BST（二叉搜索树），因此\
  \ AVL 的声明与 BST 相似。但为了简化操作，我们将高度也包含在声明中。\n\n![Image](img/image00945.jpeg)\n\n## 查找\
  \ AVL 树的高度\n\n![Image](img/image00946.jpeg)\n\n时间复杂度：`O(1)`。\n\n## 旋转\n\n当树的结构发生变化时（例如在插入或删除时），我们需要修改树以恢复\
  \ AVL 树属性。这可以通过单旋转或双重旋转来实现。由于插入/删除涉及添加/删除单个节点，这只会使子树的高度增加或减少 1。\n\n因此，如果节点 `X` 处违反了\
  \ AVL 树属性，意味着左(`X`)和右(`X`)的高度差恰好为 2。这是因为，如果我们每次都平衡 AVL 树，那么在任何时刻，左(`X`)和右(`X`)的高度差都恰好是\
  \ 2。旋转是用于恢复 AVL 树属性的技巧。这意味着我们需要对节点 `X` 应用旋转。\n\n**观察：** 一个重要的观察结果是，在插入之后，只有位于插入点到根节点路径上的节点平衡可能会发生变化，因为只有这些节点的子树发生了变化。为了恢复\
  \ AVL 树属性，我们从插入点开始一直向树根根移动。\n\n在移动到根节点的过程中，我们需要考虑第一个不满足 AVL 属性的节点。从该节点开始，通往根路径上的每个节点都会出现问题。\n\
  \n此外，如果我们修复了第一个节点的问题，那么通往根路径上的所有其他节点将自动满足 AVL 树属性。这意味着我们总是需要关注从插入点到根路径上第一个不满足 AVL\
  \ 属性的节点并修复它。\n\n## 违反类型\n\n假设必须重新平衡的节点为 `X`。由于任何节点最多有两个孩子，且高度不平衡要求`X`的两个子树高度之差为二，我们可以很容易地观察到可能发生在以下四种情况：\n\
  \n1. 在 `X`的左孩子的左子树中插入。\n2. 在 `X`的左孩子的右子树中插入。\n3. 在 `X`的右孩子的左子树中插入。\n4. 在 `X`的右孩子的右子树中插入。\n\
  \n情况 1 和 4 是对称的，可以通过单旋转轻松解决。同样，情况 2 和 3 也是对称的，可以通过双重旋转（需要两次单旋转）解决。\n\n## 单旋转\n\n\
  **左左旋转（LL 旋转）[情况-1]:** 在下方案例中，`X`不满足 AVL 属性。正如之前讨论的，单旋转需要在根节点执行。通常情况下，我们从插入点开始向树根移动，更新每个节点的平衡信息。例如，在上方图中，在左侧插入\
  \ 7 后，9 变得不平衡。\n\n![Image](img/image00947.jpeg)\n\n**右右旋转（RR 旋转）[情况-4]:** 在下方案例中，`X`不满足\
  \ AVL 属性。正如之前讨论的，单旋转需要在根节点执行。通常情况下，我们从插入点开始向树根移动，更新每个节点的平衡信息。例如，在上方图中，在左侧插入 29 后，15\
  \ 变得不平衡。\n\n![Image](img/image00950.jpeg)\n\n## 双重旋转\n\n**左右旋转（LR 旋转）[情况-2]:** 在下方案例中，`X`不满足\
  \ AVL 属性。正如之前讨论的，单旋转无法解决问题。我们需要执行双重旋转。例如，在上方图中，在右侧插入 7 后，9 变得不平衡。\n\n![Image](img/image00952.jpeg)\n\
  \n**右左旋转（RL 旋转）[情况-3]:** 在下方案例中，`X`不满足 AVL 属性。正如之前讨论的，单旋转无法解决问题。我们需要执行双重旋转。例如，在上方图中，在右侧插入\
  \ 6 后，9 变得不平衡。\n\n![Image](img/image00954.jpeg)\n\n## 向 AVL 树插入\n\n向 AVL 树插入插入与\
  \ BST 插入相似。在插入元素后，我们只需要检查是否存在不平衡。如果存在不平衡，调用相应的旋转函数。\n\n![Image](img/image00957.jpeg)\n\
  \n## AVL 树：问题与解答\n\n**问题-76** 给定高度 `h`，给出一个生成`HB(0)`的算法。\n\n**解答:** 如我们之前讨论过的，`HB(0)`就是生成满二叉树。在满二叉树中，高度为`h`的节点数为：2^(h+1)\
  \ – 1（我们假设只有一个节点的树的高度为 0）。结果节点可以编号为：1 到 2^(h+1) – 1。\n\n![Image](img/image00958.jpeg)\n\
  \n**问题-77** 是否有其他方法解决问题-76？\n\n**解答：是的，** 我们可以按照归排序的逻辑来解决。这意味着，与其处理高度，不如说处理范围。通过这种方法，我们不需要维护任何全局计数器。\n\
  \n\n\n\n`BuildHB0` 函数的初始调用可以是：`BuildHB0(1, 1 ≪ h)`。`1 ≪ h` 执行位移操作以计算 $2^{(h+1)}\
  \ – 1$。时间复杂度：O(`n`)。空间复杂度：O(`log n`)。其中 `log n` 表示最大栈深度，等于树的高度。\n\n### 问题-78\n构造高度为\
  \ 0, 1, 2, 3, 4 和 5 的最小 AVL 树。高度为 6 的最小 AVL 树中有多少个节点？\n\n**解答** 令 `N(h)` 为高度为 `h`\
  \ 的最小 AVL 树的节点数。\n\n![Image](img/image00960.jpeg)\n\n### 问题-79\n对于问题-76，高度为 `h`\
  \ 的最小 AVL 树有多少种不同的形状？\n\n**解答：** 令 `NS(h)` 为高度为 `h` 的最小 AVL 树的不同形状数量。\n\n![Image](img/image00961.jpeg)\n\
  \n### 问题-80\n给定一个二叉搜索树，检查它是否为 AVL 树？\n\n**解答：** 假设 `IsAVL` 是检查给定二叉搜索树是否为 AVL 树的函数。如果树不是\
  \ AVL 树，则 `IsAVL` 返回 -1。在检查过程中，每个节点都会向其父节点发送其高度。\n\n![Image](img/image00962.jpeg)\n\
  \n时间复杂度：O(`n`)。空间复杂度：O(`n`)。\n\n### 问题-81\n给定一个高度 `h`，给出一个生成节点数最少的 AVL 树的算法。\n\n\
  **解答：** 为了获得最少节点数，用一层填充 `h – 1` 个节点，另一层填充 `h – 2` 个。\n\n![Image](img/image00963.jpeg)\n\
  \n### 问题-82\n给定一个包含 `n` 个整数项以及两个整数 `a` 和 `b` 的 AVL 树，其中 `a` 和 `b` 是任意满足 `a <= b`\
  \ 的整数。实现一个算法来统计范围 `[a, b]` 内的节点数量。\n\n**解答：**\n\n![Image](img/image00964.jpeg)\n\
  \n该思想是利用二叉搜索树的递归属性。需要考虑三种情况：当前节点是否在范围 `[a, b]` 内、在范围 `[a, b]` 的左侧、或在范围 `[a, b]`\
  \ 的右侧。在每种情况下，只有可能包含目标节点的子树才会被处理。\n\n![Image](img/image00965.jpeg)\n\n该复杂度与树的后序遍历相似，但在左或右子树不包含任何答案时会跳过它们。因此，在最坏情况下，如果范围覆盖了树的所有节点，我们需要遍历所有\
  \ `n` 个节点来获取答案。因此，最坏时间复杂度为 O(`n`)。\n\n如果范围很小，仅覆盖树底部小子树中的少数元素，时间复杂度将为 O(`h`) = O(`log\
  \ n`)，其中 `h` 是树的高度。这是因为只需要遍历一条路径即可到达底部的小子树，并且在此途中许多高层子树已经被剪枝。\n\n**注意：** 请参考 BST。\n\
  \n### 问题-83\n无限整数序列中的中位数\n\n**解答：** 中位数是排序数字列表中间的数字（如果元素个数为奇数）。如果元素个数为偶数，中位数是排序列表中两个中间数的平均值。为了解决这个问题，我们可以使用二叉搜索树，并在每个节点中存储额外信息，以及左右子树的节点数。我们还记录了树中的总节点数。利用这些信息，我们可以在\
  \ O(`log n`) 时间内找到中位数，根据当前节点左右子树的数量在树中选择适当的分支。但插入操作是 O(`n`)，因为如果收到的数字是有序的，标准二叉搜索树可能会退化为链表。因此，让我们使用平衡搜索树来避免标准搜索树的最坏情况。对于这个问题，平衡因子是左子树的节点数减右子树的节点数。只有平衡因子为\
  \ +1 或 0 的节点被认为是平衡的。因此，左子树的节点数等于或比右子树多 1，但不会少。如果我们确保树中的每个节点都满足这个平衡因子，那么当元素个数为奇数时，树根就是中位数。当元素个数为偶数时，中位数是根节点及其中序后继节点的平均值（后继是右子树中最左侧的后代）。因此，维护平衡条件的复杂度为\
  \ O(`log n`)，在假设节点数为偶数的情况下，查找中位数的操作复杂度为 O(1)。插入和平衡与 AVL 树非常相似。我们不是更新高度，而是更新节点数。平衡搜索树似乎是最优的，插入为\
  \ O(`log n`)，查找中位数为 O(1)。\n\n**注意：** 请参考优先队列和堆。\n\n### 问题-84\n给定一个二叉树，如何删除所有（只有一个子节点的）节点？注意，我们不应该触碰叶子节点。\n\
  \n**解答：** 通过后序遍历可以高效地解决这个问题。我们首先处理左孩子，然后是右孩子，最后是节点本身。因此，我们从叶子节点向根节点向上形成树。当我们处理到当前节点时，它的左右子树都已经处理完毕。\n\
  \n![Image](img/image00966.jpeg)\n\n时间复杂度：O(`n`)。\n\n### 问题-85\n给定一个二叉树，如何删除它的叶子节点？\n\
  \n**解答：** 使用后序遍历可以解决这个问题（其他遍历方式也可以）。\n\n![Image](img/image00967.jpeg)\n\n时间复杂度：O(`n`)。\n\
  \n### 问题-86\n给定一个二叉搜索树（BST）和两个整数（最小值和最大值），如何删除不在该范围内的元素？\n\n![Image](img/image00968.jpeg)\n\
  \n![Image](img/image00969.jpeg)\n\n**解答：** 既然我们需要检查树中的每一个元素，并且子树的变化应该反映在父节点中，我们可以考虑使用后序遍历。因此我们从叶子开始向根节点处理。结果是，处理节点本身时，它的左右子树都是有效的剪裁\
  \ BST。在每个节点处，我们将根据其值返回一个指针，这取决于当前节点是父节点的左孩子还是右孩子。如果当前节点的值在 A 和 B 之间（`A <= 节点值 <=\
  \ B`），则不需要操作，因此返回节点本身。\n\n如果当前节点的值小于 A，我们返回它的右子树并丢弃左子树。因为如果节点的值小于 A，由于是二叉搜索树，其左孩子也也小于\
  \ A。但其右孩子可能大于也可能小于 A；我们无法，因此返回它。由于我们执行的是自底向后序遍历，其右子树已经是一个有效的二叉搜索树（可能为空），而左子树一定为空，因为那些节点确定小于\
  \ A 并在后序遍历期间被删除了。\n\n当节点的值大于 B 时，出现类似的情况，我们现在返回它的左子树。因为如果节点的值大于 B，其右孩子也一定大于 B。但其左孩子可能大于也可能小于\
  \ B；因此我们丢弃右子树并返回已经有效的左子树。\n\n![Image](img/image00970.jpeg)\n\n最坏情况下时间复杂度为 O(`n`)，平均情况下下为\
  \ O(`log n`)。\n\n**注意：** 如果给定的 BST 是 AVL 树，则 O(`n`) 是平均时间复杂度。\n\n\n\n\n### 问题-87\n\
  给定一个二叉树，如何连接同一层上的所有相邻节点？假设给定的二叉树除了左、右指针外，还有一个 `next` 指针。\n\n**解决方案：** 一简单的方法是使用层序遍历并不断更新\
  \ `next` 指针。在遍历过程中，我们将连接下一层的节点。如果节点有左右子节点，我们将左节点连接到右节点。如果节点有 `next` 节点，则将当前节点的最右侧子节点连接到下一个节点的最左侧子节点。\n\
  \n![Image](img/image00971.jpeg)\n\n时间复杂度：`O(n)`。空间复杂度：`O(n)`。\n\n### 问题-88\n我们能优化\
  \ 问题-87 的空间复杂度吗？\n\n**解决方案：** 我们可以逐层处理树，但不需要使用队列。逻辑部分是，当我们处理下一层的节点时，确保当前层已经完成了连接。\n\
  \n![Image](img/image00972.jpeg)\n\n时间复杂度：`O(n)`。空间复杂度（栈空间）为 `O(depth of tree)`。\n\
  \n### 问题-89\n假设一组包含 `n` 个数字的集合 `S` 存储在某种平衡二叉搜索树中；即树的深度为 `O(logn)`。除了键值和子节点指针外，假设每个节点包含其子树中的节点数量。请说明为什么平衡二叉树可能是存储集合\
  \ `S` 时比完全二叉树更好的选择。\n\n**解决方案：** 实现平衡二叉树需要的更少的 RAM 空间，因为我们不需要在内存中保持完整树（因为它们使用指针）。\n\
  \n### 问题-90\n对于 问题-89，说明为什么完全二叉树可能是存储集合 `S` 时比平衡二叉树更好的选择。\n\n**解决方案：** 完全二叉树的空间效率更高，因为我们不需要任何额外的标记。平衡二叉树通常占用更多空间，因为我们需要存储一些标记。例如，在红黑树中，我们需要存储一个表示色的位。此外，完全二叉树可以以数组的形式存储在\
  \ RAM 中而无需使用指针。\n\n### 问题-90\n令 `T` 为一个根节点为 `r` 的严格二叉树。考虑以下算法。\n\n![Image](img/image00973.jpeg)\n\
  \n该算法的作用是什么？\n\nA. 它始终返回值 1。\nB. 它计算树中节点数量。\nC. 它计算节点的深度。\nD. 它计算树的高度。\nE. 它计算树中叶子的数量。\n\
  \n**解决方案：** E。\n\n## 6.12 的其他变体\n在本节中，让我们遍历树的其他可能表示形式。在之前的章节中，我们学习了 AVL 树，它是具有平衡属性的二叉搜索树（BST）。现在，让我们来看更多几种平衡二叉搜索树：红黑树和伸伸树（Splay\
  \ Trees）。\n\n### 6.12.1 红黑树\n在红黑树中，每个节点都有一个额外的属性：颜色，红色或黑色。为了获得对数复杂度，我们实施了以下限制。\n\
  \n**定义：** 红黑树是一种满足以下属性的二叉搜索树：\n\n- 根属性：根节点是黑色的\n- 外部属性：每个叶子节点都是黑色的\n- 内部属性：红色节点的子节点是黑色的\n\
  - 深度属性：所有叶子节点具有相同的黑色深度\n\n类似于 AVL 树，如果红黑树变得不平衡，我们将执行旋转来强化平衡属性。对于红黑树，我们可以在最坏情况下以\
  \ `O(logn)` 时间执行以下操作，其中 `n` 是树中的节点数。\n\n- 插入\n- 删除\n- 查找前驱\n- 查找后继\n- 查找最小\n- 查找最大\n\
  \n### 6.12.2 伸伸树\n伸伸树是具有自调整属性的 BST。伸伸树的另一个有趣属性是：从空树开始，任何包含最多 `n` 个节点的 `K` 次操作序列在最坏情况下的时间复杂度为\
  \ `O(Klogn)`。\n\n伸伸树更容易编写，并且确保更快地访问最近访问的项目。与 `AVL` 和红黑树类似，在伸伸树失平衡的任何时刻，我们都可以执行旋转来强化平衡属性。\n\
  \n伸伸树无法保证最坏情况下的 `O(logn)` 复杂度。但它提供了摊均 `O(logn)` 复杂度。尽管单个操作可能昂贵，但任何操作序列都能获得对数级的复杂度。一次操作可能花费更多时间（单次操作可能需要\
  \ `O(n)` 时间），但后续操作可能不会达到最坏复杂度，且平均*每次操作*复杂度为 `O(logn)`。\n\n### 6.14.3 B 树\nB 树类似于\
  \ AVL 和红黑树等其他自平衡树，它在对其执行操作时会维持其节点平衡。B 树具有以下属性：\n\n- 最小阶为 `t`，其中除根节点外，所有其他节点必须有不少于\
  \ `t – 1` 个键\n- 每个拥有 `n` 个键的节点有 `n + 1` 个子节点\n- 每个节点中的键是排列的，如 `k[1]`\n- 每个节点不能超过\
  \ `2t-1` 个键，或者等价于 `2t` 个子节点\n- 根节点至少包含一个键。只有当根节点分裂时，树的深度才会增加。\n\nB 树每个节点允许的最小子节点数称为最小因子。如果\
  \ `t` 是这个最小因子，每个节点必须至少有 `t – 1` 个键。在某些情况下，根节点被允许违反这一属性，拥有少于 `t – 1` 个键。最小因子的选择通常使得节点的总大小对应于存储设备块大小的倍数。这种选择简化并优化了磁盘访问。因此，对于所有数据无法存储在主存储中且访问辅助存储器相对昂贵（或耗时）的情况，B\
  \ 树是理想的数据结构。\n\n*搜索*该树的方法类似于二叉树，但由于节点包含多个键，因此在给定的节点内对键进行多次比较。如果在节点中找到键，则搜索终止。否则，移动到\
  \ `ci` 指向的节点，其中 `k < k[i]`。\n\nB 树的键*插入*是从底部开始的。这意味着它首先从根节点向下移动目标子节点。如果子节点未满，直接插入键。如果满了，则将子节点从中间分裂，中位数键移动到父节点，然后插入新键。在插入并向下移动的过程中，如果发现根节点满了，则先进行分裂，产生一个新的根节点。然后执行正常的插入操作。\n\
  \n\n\n\n删除键的操作更为复杂，因为它需要维护每个节点中的键数量以满足约束条件。如果在叶节点中找到键，且删除它后节点中的键数量仍不会过低，则可以直接完成。如果是删除内部节点中的，则将相应子节点中该键的前驱移动过来以替换内部节点中的键。如果移动前驱会导致子节点违反节点数量约束，则合并兄弟子节点并删除内部节点中的键。\n\
  \n### 6.12.4 增强树 (Augmented Trees)\n\n在之前的章节中，我们已经见过各种问题，如在树中寻找第 `K^(th)` 小元素或其他类似的问题。在所有问题中，最坏复杂度为\
  \ O(*n*)，其中 *n* 是树中的节点数。为了在 O(*logn*) 内执行此类操作，增强树是非常有用的。在这些树中，每个节点都添加了额外信息，这些额外数据取决于我们正尝试解决的问题。\n\
  \n例如，要在二叉搜索树中找到 `k^(th)` 个元素，让我们看看增强树是如何解决这个问题的。假设我们使用红黑树作为平衡二叉搜索树（或任何平衡 BST），并在节点数据中增强了大小信息。对于红黑树中的给定节点\
  \ `X`，其字段 `size`(*X*) 等于该子树中的节点数，并可以计算为：\n\n![Image](img/image00974.jpeg)\n\n第 Kth\
  \ 小 小元素的操作可以定义为：\n\n![Image](img/image00975.jpeg)\n\n时间复杂度：O(*logn*)。空间复杂度：O(*logn*)。\n\
  \n**示例：** 有了额外的大小信息，增强树看起来如下：\n\n![Image](img/image00976.jpeg)\n\n### 6.12.5 均衡树\
  \ (Scapegoat Trees)\n\n\n\n均衡树是由 Arne Andersson 发现的一种自平衡二叉搜索树。它提供了最坏情况下的 O(*logn*)\
  \ 搜索时间，以及 O(*logn*) 的均摊（平均）插入和删除时间。\n\nAVL 树在两个兄弟子树的高度差大于 1 时就会重新平衡，而均衡树在子节点的大小超过其父节点某个特定比例（该比例被称为\
  \ `a`）时就会重新平衡。在插入元素后，我们向树向上回溯。如果我们发现某个子节点的大小超过了父节点大小乘以 `alpha`，我们必须重建父节点处的子树，即“替羊节点”（scapegoat）。\n\
  \n可能存在多个可能的替羊节点，但我们只需要选择一个。最优的替羊实际上是由高度平衡决定的。在删除时，我们查看树的总大小是否小于自上次重建树以来最大大小的 `alpha`。如果是，我们就会重建整棵树。均衡树的\
  \ `alpha` 可以是 0.5 到 1.0 之间的任意数字。0.5 值将强制完美平衡，而 1.0 将导致永远不会发生重新平衡，实际上使其变成了一个 BST。\n\
  \n### 6.12.6 区间树 (Interval Trees)\n\n我们经常面临涉及基于范围数组查询的问题。例如，对于一个给定的整数数组，范围 `α` 到\
  \ `β` 之间的最大值是多少，其中 `α` 和 `β` 当然在数组限制范围内。要遍历包含特定值的区间的条目，我们可以使用简单的数组。但如果我们需要更高效的访问，就需要一种更复杂的数据结构。\n\
  \n基于数组的存储方案和对整个数组进行暴力搜索只有在执行单次搜索或元素数量较少时才是可以的。例如，如果你预先知道所有感兴趣的数组值，你只需要对数组进行一次遍历。然而，如果你可以在不同时间交互式地指定不同的搜索操作，暴力搜索就会变得不可行，因为每次搜索操作期间都必须检查数组中的每个元素。\n\
  \n如果你按数组值升序排序数组，当你到达对象的低值大于我们正在搜索的元素时，就可以终止顺序搜索。遗憾的是，随着低值的增加，这种技术会变得越来越不灵灵，因为消除的搜索操作变少了。这意味着，如果我们必须回答大量此类查询呢？暴力搜索仍然是一个好选择吗？\n\
  \n另一个例子是我们需要返回给定范围内的和。我们也可以对此进行暴力处理，但大量查询的问题仍然存在。那么，我们能做什么呢？通过思考，我们可以想出一种方法，维护一个包含\
  \ `n` 个元素的独立数组（其中 `n` 是原始数组的大小），每个索引存储从 0 到该索引的所有元素之和。因此，本质上我们通过一些预处理，我们将查询时间从最坏情况的\
  \ O(*n*) 降低到了 O(1)。现在这对于静态数组来说很棒，但如果我们还被要求对数组执行更新操作呢？\n\n第一方法给了我们 O(*n*) 的查询时间，但\
  \ O(1) 的更新时间。另一方面，第二方法给了我们 O(1) 的查询时间，但 O(*n*) 的更新时间。所以，我们选哪个？\n\n区间树也是二叉搜索树，它们在节点结构中存储区间信息。这意味着我们维护了一组\
  \ `n` 个区间 `[`i[1]`, `i[2]]]`，使得可以高效地找到包含查询点 `Q` 的区间（如果有的话）。区间树用于高效地执行范围查询。\n\n线段树（也称为\
  \ *segtrees* 和 *interval trees*）是一种很酷的数据结构，主要用于范围查询。它是一个静态结构的高度平衡树。树的节点对应于各种区间，并可以增强与这些区间相关的信息。由于其静态结构，它的功能比二叉树稍弱一些，但由于操作的递归性质，它非常容易思考和编码。\n\
  \n我们可以使用线段树来解决范围最小/最大值问题。时间复杂度为 T(*nlogn*)，其中 O(*n*) 是构建树所需的时间，每个查询需要 O(*logn*)\
  \ 时间。线段树是一种类似于堆的数据结构，可用于对数时间内的更新/查询操作。\n\n区间，假设我们给定一个包含 *n* 个区间的集合 `S`。这 *n* 个区间将有\
  \ 2*n 个端点。现在，让我们看看如何构建区间树。\n\n**算法**\n\n递归地根据区间集 `S` 构建树如下：\n\n• 对 2*n* 个端点排序\n\n\
  • 令 `X[mid]` 为中位数点\n\n![Image](img/image00979.jpeg)\n\n构建区间树的时间复杂度：O(*nlogn*)。由于我们选择了中位数，区间树将是平衡的。这确保了我们每次将端点集合分成一半。树的深度为\
  \ O(*logn*)。为了简化搜索过程，通常每个节点都会存储 `X[mid]`。\n\n**示例：** 给定一组区间：5={[2-5], [6-7], [6-10],\
  \ [8-9], [12-15], [15-23], [25-30]}。查询 `Q = 9` 返回 [6,10] 或 [8,9]（假设这些是包含 9 的区间）。查询\
  \ `Q = 23` 返回 [15,23]。\n\n![Image](img/image00981.jpeg)\n\n## 7.1 什么是优先级队列？\n\n\n\
  \n\n\n在某些情况下，我们可能需要在一个元素集合找到最小/最大元素。我们可以借助优先队列抽象数据类型（Priority Queue ADT）来实现这一点。优先队列\
  \ ADT 是一种数据结构，支持 `Insert`（插入）和 `DeleteMin`（返回并删除最小值）或 `DeleteMax`（返回并删除最大值）操作。\n\
  \n这些操作相当于队列的 `EnQueue` 入队和 `DeQueue` 出队操作。区别在于，在优先队列中，元素进入队列的顺序与其处理的顺序可能不同。优先队列的一个应用是作业调度，它是根据优先级而不是先来来来服务的。\n\
  \n![Image](img/image00982.jpeg)\n\n如果键值最小元素优先级最高（这意味着总是删除最小元素），则该优先队列被称为`升序优先`队列。同样，如果键值最大的元素优先级最高（总是删除最大元素），则该优先队列被称为`降序优先`队列。由于这两种类型是对称的，我们将关注其中一种：升序优先队列。\n\
  \n### 7.2 优先队列 ADT\n\n以下操作使得优先队列成为一个 ADT。\n\n#### 优先队列主要操作\n\n优先队列是一个元素容器，每个元素都有关联的键（key）。\n\
  \n- `Insert(key, data)`：将带有 `key` 的数据插入优先队列。元素根据键进行排序。\n- `DeleteMin/DeleteMax`：删除并返回键最小/最大的元素。\n\
  - `GetMinimum/GetMaximum`：返回键最小/最大的元素，但不删除它。\n\n#### 优先队列辅助操作\n\n- `k^(th) – Smallestk^(th)\
  \ –Largest`：返回优先队列中第 `k^(th)` 小/第 `k` 大的键。\n- `Size`：返回优先队列中的元素数量。\n- `Heap Sort`：根据优先级（键）对优先队列中的元素进行排序。\n\
  \n### 7.3 优先队列的应用\n\n优先队列有很多应用——下面列出了其中：\n\n- 数据压缩：哈夫曼编码（Huffman Coding）算法\n- 最短路径算法：Dijkstra\
  \ 算法\n- 最小生成树算法：Prim 算法\n- 事件驱动模拟：排队中的顾客\n- 选择问题：寻找第 `k^(th)` 小的元素\n\n### 7.4 优先队列的实现\n\
  \n在讨论具体实现之前，让我们先列举可能的选项。\n\n### 无序数组实现\n\n元素插入到数组中而不考虑顺序。删除操作（`DeleteMax`）通过搜索键然后进行删除来实现。\n\
  \n插入复杂度：`O(1)`。DeleteMin 复杂度：`O(n)`。\n\n### 无序列表实现\n\n这与数组实现非常相似，但使用的是链表而不是数组。\n\
  \n插入复杂度：`O(1)`。DeleteMin 复杂度：`O(n)`。\n\n### 有序数组实现\n\n元素根据键字段按排序顺序插入数组。删除操作只在其中端进行。\n\
  \n插入复杂度：`O(n)`。DeleteMin 复杂度：`O(1)`。\n\n### 有序列表实现\n\n元素根据键字段按排序顺序插入列表。删除操作只在一个端进行，从而保持了优先队列的状态。所有与链表\
  \ ADT 关联的功能均在不修改的情况下执行。\n\n插入复杂度：`O(n)`。DeleteMin 复杂度：`O(1)`。\n\n#### 二叉搜索树实现\n\n\
  如果插入是随机的，插入和删除的平均复杂度均为 `O(logn)`（参见 `Trees` 章节）。\n\n#### 平衡二叉搜索树实现\n\n插入和删除在最坏情况下均为\
  \ `O(logn)`（参见 `Trees` 章节）。\n\n#### 二叉堆实现\n\n在随后的章节中我们将详细讨论。现在，假设二叉堆实现对于搜索、插入和删除的复杂度为\
  \ `O(logn)`，查找最大或最小元素的复杂度为 `O(1)`。\n\n#### 比较实现方式\n\n![Image](img/image00983.jpeg)\n\
  \n### 7.5 堆与二叉堆\n\n#### 什么是堆？\n\n堆具有某些特殊属性的树。堆的基本要求是节点的值必须大于（或小于）其子节点的值。这被称为`堆属性`。堆还有一个额外属性，所有叶子节点应位于\
  \ `h` 或 `h – 1` 层（其中 `h` 是树的高度），对于某些 `h > 0`（`完全二叉树`）。这意味着堆应该形成一个`完全二叉树`（如下）。\n\n\
  ![Image](img/image00984.jpeg)\n\n在下面的示例中，左树是一个堆（每个元素都大于其子节点），右树不是堆（因为 11 大于 2）。\n\
  \n![Image](img/image00985.jpeg)\n\n#### 堆的类型？\n\n根据堆的属性，我们可以将堆分为两类：\n\n- `Min heap\
  \ (最小堆)`：节点的值必须小于或等于子节点的值\n![Image](img/image00986.jpeg)\n\n- `Max heap (最大堆)`：节点的值必须大于或等于子节点的值\n\
  ![Image](img/image00987.jpeg)\n\n### 7.6 二叉堆\n\n在二叉堆中，每个节点最多有两个子节点。在实践中，二叉堆已经足够，我们在剩下的讨论中将关注二叉最小堆和二叉最大堆。\n\
  \n**堆的表示：** 在查看堆操作之前，让我们看看如何表示堆。一种可能性是使用数组。由于堆形成了完全二叉树，因此不会有任何 ![Image](img/image00988.jpeg)浪费。\n\
  \n**注意：** 在剩下的讨论中，我们假设元素存储在数组中。\n\n#### 堆的声明\n\n![Image](img/image00989.jpeg)\n\n\
  注意：以下所有函数都是类的一部分。\n\n#### 节点的父节点\n\n对于位于 `ith` 位置的节点，其父节点位于 ![Image](img/image00990.jpeg)\
  \ 位置。在以前的例子中，元素 6 位于第二个位置，它的父节点位于 `0th` 位置。\n\n![Image](img/image00991.jpeg)\n\n\
  时间复杂度：`O(1)`。\n\n#### 节点的节点\n\n与上述讨论类似，对于位于 `ith` 位置的节点，其子节点位于 `2 * i + 1` 和 `2\
  \ * i + 2`。例如，在上面的树中，元素 6 位于第二个位置，它的子节点 2 和 5 分位于 5(2 * 2 + 1) 和 6(2 * 2 + 2) 位置。\n\
  \n![Image](img/image00992.jpeg)\n\n#### 获取最大元素\n\n由于最大堆的最大元素始终位于根节点，它将存储在 `array[0]`\
  \ 中。\n\n![Image](img/image00993.jpeg)\n\n时间复杂度：`O(1)`。\n\n#### 元素的堆化（Heapifying）\n\
  \n在堆中插入元素后，它可能不满足堆属性。在这种情况下，我们需要调整堆的位置使其再次成为堆。这个过程被称为`堆化`。在最大堆中，为了对元素进行堆化，我们必须找到子节点中的最大值并与当前元素交换，重复此过程直到每个节点满足堆属性。\n\
  \n![Image](img/image00994.jpeg)\n\n**观察：** 堆的一个重要属性是，如果一个元素不满足堆属性，从该元素到根节点的所有元素都会相同的问题。在下面的示例中，元素\
  \ 1 不满足堆属性，它的父节点 31 也有这个问题。同样，如果我们对一个元素进行堆化，从该元素到根节点的所有元素也将自动满足堆属性。让我们来看一个例子。在上面的堆中，元素\
  \ 1 不满足堆属性。让我们尝试对该元素进行堆化。\n\n要堆化 1，找到子节点中的最大值并与其交换。\n\n![Image](img/image00995.jpeg)\n\
  \n\n\n\n我们需要继续这个过程，直到元素满足堆的属性。现在，将 1 与 8 交换。\n\n![Image](img/image0099.jpeg)\n\n\
  现在树满足堆的属性。在上面的堆化过程中，由于我们是从上到下移动的，这个过程有时被称为 `percolate down`（下沉）。同样，如果我们从任何其他节点到根开始堆化，我们可以将该从底到顶移动的过程称为\
  \ `percolate up`（上浮）。\n\n![Image](img/image00998.jpeg)\n\n时间复杂度：`O(log n)`。堆是一棵完全二叉树，在最坏情况下，我们从根开始到叶子节点。这等于完全二叉树的高度。空间复杂度：`O(1)`。\n\
  \n## 删除元素\n\n要从堆中删除元素，我们只需要从根节点删除该元素。这是标准堆支持的唯一操作（最大元素）。在删除根元素后，复制堆（树）的最后一个元素并删除该最后一个元素。\n\
  \n在替换了最后一个元素后，树可能不再满足堆的属性。为了使其恢复为堆，调用 `PercolateDown` 函数。\n\n- 将第一个元素复制到某个变量中\n\
  - 将最后一个元素复制到第一个元素的位置\n- 对第一个元素执行 `PercolateDown`\n\n![Image](img/image0099.jpeg)\n\
  \n**注意:** 删除元素使用 `PercolateDown`，插入元素使用 `PercolateUp`。\n时间复杂度：与 `Heapify` 函数相同，为\
  \ `O(log n)`。\n\n## 插入元素\n\n插入元素与堆化和删除过程类似。\n\n- 增加堆的大小\n- 将新元素保持在堆（树）的末尾\n- 从底到顶（根节点）对元素进行堆化\n\
  \n在查看代码之前，让我们来看一个例子。我们已经在堆的末尾插入了元素 19，它并不满足堆的属性。\n\n![Image](img/image0000.jpeg)\n\
  \n为了堆化这个元素 (19)，我们需要将其与它的父节点进行比较并调整它们。交换 19 和 4 得到：\n\n![Image](img/image0001.jpeg)\n\
  \n再次交换 19 和 6：\n\n![Image](img/image0002.jpeg)\n\n现在树满足堆的属性。由于我们采用了自底向上的方法，我们将此过程称为\
  \ `percolate up`。\n\n![Image](img/image0003.jpeg)\n\n时间复杂度：`O(log n)`。解释与 `Heapify`\
  \ 函数相同。\n\n![Image](img/image0004.jpeg)\n\n## 数组化\n\n构建堆的一种简单方法是取 `n` 个输入项并将放入空堆中。这可以通过\
  \ `n` 次连续插入完成，由于每次插入操作需要 `O(log n)`，在最坏情况下需要 `O(n log n)`。\n\n为了完成对二叉堆的讨论，我们将查看从键列表构建整个堆的方法。你可能想到的第一个方法可能是：给定一个键列表，你可以通过逐个插入键来轻松构建堆。由于你从一个包含一个元素的列表开始，该列表是有序的，你可以使用二分查找来找到下一个键插入的位置，代价为\
  \ `O(log n)`。但请记住，在列表中间插入元素可能需要 `O(n)` 次操作来移动列表的其他部分以为新键留空间。因此，向堆中插入 `n` 个键总共需要\
  \ `O(n log n)`。然而，如果我们从整个列表开始，我们可以在 `O(n)` 次操作内构建整个堆。\n\n**观察：** 叶子节点始终满足堆的属性，不需要关心它们。叶子元素始终位于末尾，要堆化给定的数组，对非叶子节点进行堆化就足够了。现在让我们专注于寻找第一个非叶子节点。堆的最后一个元素位于\
  \ `h - 1` 位置，找到第一个非叶子节点只需找到最后一个元素的父节点即可。\n\n![Image](img/image0005.jpeg)\n\n![Image](img/image0006.jpeg)\n\
  \n时间复杂度：构建堆的线性时间边界可以通过计算所有节点的高度之和来证明。对于一个高度为 `h` 包含 `n = 2^(h+1) - 1` 个节点的完全二叉树，所有节点的高度之和为\
  \ `n - h - 1`（证明请参考问题部分）。这意味着，构建堆的操作可以通过对反层级顺序的节点应用 `PercolateDown` 函数来在线性时间 (`O(n)`)\
  \ 内完成。\n\n## 堆排序\n\n堆 ADT 的一个主要应用是排序（堆排序）。堆排序算法将所有元素（来自无序数组）插入堆中，然后从堆的根部移除它们，直到堆为空。注意，堆排序可以在待排序数组上原地进行。与其删除元素，不如将第一个元素（最大元素）与最后一个元素交换并缩小堆的大小（数组的大小）。然后对第一个元素进行堆化。继续这个过程直到剩余元素数量为一个。\n\
  \n![Image](img/image0007.jpeg)\n\n时间复杂度：当我们从堆中移除元素时，值会变得有序（因为最大元素始终是 `root`）。由于堆的插入和删除算法的时间复杂度都是\
  \ `O(log n)`（其中 `n` 是元素数量），因此堆排序的时间复杂度为 `O(n log n)`。\n\n\n\n\n**解决方案：** 对于一个给定的最小堆，最大元素始终位于叶子节点。现在，下一个问题是如何在树中找到叶子节点。如果我们仔细观察，最后一个元素的父节点的下一个节点就是第一个叶子节点。由于最后一个元素始终位于\
  \ `h` → `count – 1`*第** 位置，其父节点（位于 ![Image](img/image01011.jpeg) 的父节点）可以计算为：\n\n\
  ![Image](img/image01012.jpeg)\n\n现在，剩下的步骤是扫描叶子节点并找到它们中的最大值。\n\n![Image](img/image01013.jpeg)\n\
  \n![Image](img/image01014.jpeg)\n\n时间复杂度：![Image](img/image01015.jpeg)\n\n### 问题-8\
  \ \n给出一个从最小堆中删除任意元素的算法。\n\n**解决方案：** 要删除一个元素，我们首先需要找到该元素。假设我们正在使用层序遍历来查找元素。找到元素后，我们需要遵循\
  \ `DeleteMin` 过程。\n\n时间复杂度 = 查找元素的时间 + 删除元素的时间\n\n= O(`n`) + O(`logn`) ≈ O(`n`)\
  \ // 搜索时间占主导。\n\n### 问题-9 \n给出一个在给定的最小堆中删除索引为 `i` 的元素的算法。\n\n**解决方案：**\n\n![Image](img/image01016.jpeg)\n\
  \n时间复杂度 = O(`logn`)。\n\n### 问题-10 \n证明对于高度为 `h` 的完全二叉树，所有节点的高度之和为 O(`n – h`)。\n\n\
  **解决方案：** 完全二叉树在每一层有 `2^(i*)*第** 个节点。（同时，第 `i` 层的节点深度为 `i`，高度为 `h – i`）。让我们假设 `S`\
  \ 表示所有这些节点的高度和，`S` 可以计算为：\n\n![Image](img/image01017.jpeg)\n\n两边乘以 2 得到：`2S = 2h\
  \ + 4(h – 1) + 8(h – 2) + ··· + 2^(h*)*(1)`\n\n现在，从 `2S` 中减去 `S`：`2S – S = –h +\
  \ 2 + 4 + ·· + 2^(h*) ⇒ S = (2^(h+1) – 1) – (h – 1)`。\n\n但我们已经知道高度为 `h` 的完全二叉树的总节点数\
  \ `n` 为 `n = 2^(h+1) – 1`。这让我们得到：`h = log(n + 1)`。\n\n最后，将 `2^(h+1) – 1` 替换为 `n`，得到：`S\
  \ = n – (h – 1) = O(n – logn) = O(n – h)`。\n\n### 问题-11 \n给出一个在二叉堆中找到所有小于值 `k` 的元素的算法。\n\
  \n**解决方案：** 从堆的根开始。如果根的值小于 `k`，则打印它的值，并递归地对其左子调用一次、右子调用一次。如果节点的值大于或等于 `k`，则函数停止而不打印该值。\n\
  \n该算法的复杂度为 O(`n`)，其中 `n` 是堆中的节点总数。这种界限出现在最坏情况下，即堆中每个节点的值都小于 `k`，因此函数必须调用堆的每个节点。\n\
  \n### 问题-12 \n给出一个合并两个二叉大堆的算法。假设第一个堆的大小为 `m + n`，第二个堆的大小为 `n`。\n\n**解决方案：** 解决此问题的一种简单方法是：\n\
  \n* 假设第一个数组（大小为 `m + n`）的元素位于开头。这意味着前 `m` 个单元格已填充，剩余的 `n` 个单元格为空。\n* 在不改变第一个堆的情况下，直接追加第二个堆并对数组进行堆化（heapify）。\n\
  * 由于新数组中的元素元素 `m + n`，每次堆化操作耗时为 O(`log(m + n)`)。\n\n该算法的复杂度为：O((m + n)*log(m + n))。\n\
  \n### 问题-13 \n我们可以改进 问题-12 的复杂度吗？\n\n**解决方案：** 与对 `m + n` 数组中的所有元素进行堆化相比，可以使用“使用元素数组构建堆（数组堆化）”的技术。我们可以从非叶节点开始并对它们进行堆化。算法可以给出：\n\
  \n* 假设第一个数组（大小为 `m + n`）的元素位于开头。这意味着前 `m` 个单元格已填充，剩余的 `n` 个单元格为空。\n* 在不改变第一个堆的情况下，直接追加第二个堆。\n\
  * 现在，找到第一个非叶节点并从该元素开始堆化。\n\n### 问题-14 \n是否存在一种高效的合并算法？\n\n**解决方案：** 假设第一个数组（大小为\
  \ `m + n`）的元素位于开头。这意味着前 `m` 个单元格已填充，剩余的 `n` 个单元格为空。\n\n* 在不改变第一个堆的情况下，直接追加第二个堆。\n\
  * 现在，找到第一个非叶节点并从该元素开始堆化。\n\n最后，辅助堆包含最大的 k 个元素。删除元素时我们应该留在 `HAux`。\n\n### 问题-15 \n\
  给出一个寻找最小堆中 `k^(th)` 小元素的算法。\n\n**解决方案：** 从堆的根开始。如果根的值小于 `k`，则打印它的值，并递归地对其左子调用一次、右子调用一次。如果节点的值大于或等于\
  \ `k`，则函数停止而不打印该值。\n\n该算法的复杂度为 O(`n`)，其中 `n` 是堆中的节点总数。这种界限出现在最坏情况下，即堆中每个节点的值都小于\
  \ `k`，因此函数必须调用堆的每个节点。\n\n### 问题-16 \n对于 问题-15，我们可以改进时间吗？\n\n**解决方案：** 可以使用“使用元素数组构建堆（数组堆化）”的技术。我们可以从非叶节点开始并对它们进行堆化。算法可以给出：\n\
  \n* 假设第一个数组（大小为 `m + n`）的元素位于开头。这意味着前 `m` 个单元格已填充，剩余的 `n` 个单元格为空。\n* 在不改变第一个堆的情况下，直接追加第二个堆。\n\
  * 现在，找到第一个非叶节点并从该元素开始堆化。\n\n### 问题-17 \n从大堆中找到 k 个元素。\n\n**解决方案：** 解决此问题的一种简单方法是：构建大堆并执行\
  \ k 次删除。\n\n![Image](img/image1020.jpeg)\n\n### 问题-18 \n我们如何用堆实现栈？\n\n**解决方案：**\
  \ 为了使用优先级队列 PQ（使用最小堆）实现栈，假设我们正在使用一个额外的整数变量 `c`。同时，假设 `c` 初始化为任何已知值（例如 0）。栈 ADT 的实现如下。在这里，从\
