  \n**注意：** 给定大小为 `m` 和 `n` 的两个文件 `A` 和 `B`，合并复杂度为 `O(m + n)`。\n\n**解：** 该算法不会产生最优解。作为反例，让我们考虑以下文件大小。\n\
