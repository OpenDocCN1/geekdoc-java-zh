  \ 是 `A[1]`，值为 2。取反为 -2。\n第 4 步，`A[A[3]]` 是 `A[2]`，值为 -1。已经取反。\n第 5 步，`A[A[4]]` 是\
  \ `A[2]`，值为 -1。已经取反。\n第 6 步，`A[A[5]]` 是 `A[3]`，值为 -2。已经取反。\n\n*(注：用户提供的文本在问题 4 的末尾非常重复/损坏。我将完全按照源代码进行格式化。)*\n\
