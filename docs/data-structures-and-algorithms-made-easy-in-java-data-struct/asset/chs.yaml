  \ = (x[1],y[1])` 和 `p[2] = (x[2],y[2])` 之间的距离。\n\n### 暴力法解决方案\n- 计算所有点对之间的距离。从 `n`\
  \ 个点中选择 2 个点有 ![images](img/image01515.jpeg) 种方法![images](img/image01516.jpeg)。\n\
  * 在找到所有 `n²` 种情况的距离后，我们选择距离最小的那一个，这需要 `O(n²)`。\n\n总时间复杂度为 `O(n²)`。\n\n## 问题-26\n\
  为最近点对问题（问题-25）提供一个 `O(nlogn)` 的解决方案？\n\n**解决方案：** 为了找到 `O(nlogn)` 的解，可以使用分治（D &\
  \ C）技术。在开始分治过程之前，假设点已按 `x` 坐标增大排序。根据 `x` 坐标的中位数将点分为两个等份。这意味着问题被分为寻找每个部分部分中的最近点对。为了简单起见，让我们考虑以下算法来理解该过程。\n\
  \n### 算法\n1) 根据 `x` 坐标对给定的点 `S`（点集）进行排序。通过通过 `S` 中位数的直线 `l` 将 `S` 分为两个子集 `S[1]`\
  \ 和 `S[2]`。这一步是 D & C 技术中的“划分”（Divide）部分。\n2) 递归地找到 `S[1]` 和 `S[2]` 中的最近点对，并称为 `L`\
  \ 和 `R`。\n3) 现在，第 4 到 8 步构成了 D & C 技术的合并（Combining）部分。\n4) 假设 `δ = min (L,R)`。\n\
  5) 排除距离 `I` 超过 `δ` 的点。\n6) 考虑剩余点并根据 `y` 坐标排序。\n7) 按 `y` 顺序扫描剩余点，并计算每个点到所有距离不超过 `2\
  \ × δ` 的邻居的距离（这就是按照 `y` 排序的原因）。\n8) 如果这些距离中任何一个小于 `δ`，则更新 `δ`。\n\n![images](img/image01517.jpeg)\n\
  \n### 在线性时间内合并结果\n![images](img/image01518.jpeg)\n\n令 `δ = min(L,R)`，其中 `L` 是第一个子问题的解，`R`\
  \ 是第二个子问题的解。跨越分线的最近点对候选点是那些距离分线小于 `δ` 的点。因此，我们只需要跨越分线两侧 `2 × δ` 区域内的点，如图所示。现在，为了检查距离分线\
  \ `δ` 以内的所有点，考虑下图。\n\n![images](img/image01519.jpeg)\n\n从上图中可以看到，在距离不小于 `δ` 的正方形内最多可以放置\
  \ 12 个点。这意味着我们只需要检查排序列表中相邻 11 个位置内的距离。这与上面的类似，但区别在于，在上述子问题的合并中，没有垂直边界。因此，我们可以对以分线为中线的\
  \ `2 × δ` 区域内所有可能的盒子应用“12 点盒”策略。由于该区域内最多有 `n` 个这样的盒子，因此在走廊中寻找最近点对的总时间为 `O(n)`。\n\
  \n### 分析\n1) 第 1 步和第 2 步通过排序和递归寻找最小值需要 `O(nlogn)`。\n2) 第 4 步需要 `O(1)`。\n3) 第 5 步排除需要\
  \ `O(n)`。\n4) 第 6 步排序需要 `O(nlogn)`。\n5) 第 7 步扫描需要 `O(n)`。\n总复杂度 `T(n) = 2T(n/2)\
  \ + O(nlogn) = O(nlogn)`（注：此处补充）。\n\n![images](img/image01520.jpeg)\n\n## 问题-27\
  \ 最大连续值序列\n给定一个长度为 `n` 的序列 `A`，给出一个算法找到和最大的连续子序列。例如：`{-2, 1, -3, 4}`。\n\n**解决方案：**\
  \ 将输入分为两半。最大和可能出现在以下三种情况：\n- 情况 1：完全在前半部分\n- 情况 2：完全在后半部分\n- 情况 3：起始于前半部分并结束于后半部分\n\
  \n我们从情况 3 开始。为了避免嵌套循环，考虑 `n/2` 个起始点和 `n/2` 个结束点。\n1) 递归地计算完全在前部分的最大子序列。\n2) 递归地计算完全在后半部分的最大子序列。\n\
  3) 通过两个循环计算起始于前半部分并结束于后半部分的和。\n\n![images](img/image01521.jpeg)\n\n基础情况代价为 1。程序执行两次递归调用，加上计算情况\
  \ 3 所的线性工作。递归关系为：\n\n![images](img/image01522.jpeg)\n\n使用分治（D & C）主定理，我们得到时间复杂度\
  \ `T(n) = O(nlogn)`。\n\n**注意：** 有效的解决方案请参考动态规划（Dynamic Programming）章节。\n\n### 问题-25\n\
  给定一个包含 `2n` 个整数的数组，格式为 `a*1 a*2 a*3...*an b*1 b*2 b*3...*bn`。在不使用额外内存 [MA] 的情况下，重排数组为\
  \ `a*1 b*1 a*2 b*2 a*3 b*3... an bn`。\n\n**解决方案：** 让我们举例子（暴力法解决方案参考搜索章节）\n\n1. 初始数组：`a*1\
  \ a*2 a*3 a*4 b*1 b*2 b*3 b*4`\n2. 将数组分为两半：`a*1 a*2 a*3 a*4 : b*1 b*2 b*3 b*4`\n\
  3. 围绕中心交换元素：交换 `a*3 a*4` 和 `b*1 b*2`，得到：`a*1 a*2 b*1 b*2 a*3 a*4 b*3 b*4`\n4. 将\
  \ `a*1 a*2 b*1 b*2` 分为 `a*1 a*2 : b*1 b*2`，然后将 `a*3 a*4 b*3 b*4` 分为 `a*3 a*4 : b*3\
  \ b*4`\n5. 对每个子数组围绕中心交换元素，得到：`a*1 b*1 a*2 b*2` 和 `a*3 b*3 a*4 b*4`\n\n\n\n\n请注意，此解决方案仅处理\
  \ `n = 2^(i)` 的情况，其中 `i = 0,1,2,3 等.`。在我们的示例中 `n = 2² = 4`，这使得很容易递归地将数组分为两半。在调用递归函数之前在中心周围交换元素的基本思想是产生规模更小的问题。如果元素具有特定性质，可以实现线性时间复杂的解。例如，你可以使用元素本身的值计算元素的新位置。这是一种哈希技术。\n\
  \n![images](img/image0152.jpeg)\n\n时间复杂度：O(*nlogn*)。\n\n#### Problem-26\n计算 `k^n`，给出算法并讨论其复杂度。\n\
  \n**Solution：** 计算 `k^n` 的朴素算法是：从 1 开始，不断乘以 `k` 直到达到 `k^n`。对于这种方法，有 `n – 1` 次乘法，每次耗费常数时间，从而得到一个\
  \ Θ(*n*) 算法。\n\n但有一种更快的方法来计算 `k^n`。例如，\n\n![images](img/image01524.jpeg)\n\n注意，一个数的平方只需要一次乘法；通过这种方式，计算\
  \ `9²⁴` 我们只需要 5 次乘法而不是 23 次。\n\n![images](img/image01525.jpeg)\n\n让 `T(n)` 为计算 `k^n`\
  \ 所需的乘法次数。为了简单起见，假设对于某些 `i ≥ 1`，`k = 2^(i)`。\n\n![images](img/image01526.jpeg)\n\
  \n使用主定理得到 `T(n) = O(*logn*)`。\n\n#### Problem-27 轮际线问题：\n给定一个二维城市中 `n` 个矩形建筑的精确位置和形状。这些矩形建筑没有特定的顺序。假设所有建筑的底部都位于一条固定的水平线上（底边共线）。输入是一个三元组列表，每个建筑一个。建筑\
  \ `B[i]` 由三元组 `(l[i], h[i], r[i])` 表示，其中 `l[i]` 表示左边的 `x` 位置，`r[i]` 表示右边的 `x` 位置，`h[i]`\
  \ 表示建筑的高度。给出一个算法计算这些建筑的轮廓线（二维的），并消除隐藏的线条。在下图中 8 个建筑，从左到右分别由三元组 `(1, 14, 7), (3,\
  \ 9, 10), (5, 17, 12), (14, 11, 18), (15, 6, 27), (20, 19, 22), (23, 15, 30)` 和\
  \ `(26, 14, 29)` 表示。\n\n![images](img/image01527.jpeg)\n\n输出是描述轮廓线路径的点集。在问题的某些版本中，该点集由一组数字\
  \ `p[1]; p[2], ..., p[n]` 表示，其中当 `i` 为偶数时，点 `p[i]` 代表在高度 `p[i]` 处画的水平线；当 `i` 为奇数时，它代表在位置\
  \ `p[i]` 处画的垂直线。在我们的情况下，点集将是序列 `p[1], p[2], ..., p[n]` 的对 `(x[i], h[i])`，其中 `pi`\
  \ 代表轮廓线在位置 `x[i]` 的高度 `h[i]`。在上面的图中，轮廓线用粗线环绕建筑画出，并由位置-高度对序列 `(1, 14), (5, 17), (12,\
  \ 0), (14, 11), (18, 6), (20, 19), (22, 6), (23, 15)` 和 `(30, 0)` 表示。此外，假设最右侧建筑的\
  \ `R[i]` 最大为 1000。这意味着左建筑的 `L[i]` 坐标最小为 1，最右侧建筑的 `R[i]` 最大为 1000。\n\n**Solution：**\
  \ 最重要的信息是，我们知道每个建筑的左右坐标都是小于 1000 的非负整数。现在为什么这很重要？因为我们可以为每个 `i` 在 0 到 9,999 之间的不同\
  \ `x[i]` 坐标分配高度值。\n\n**Algorithm：**\n\n*   分配一个包含 1000 个元素的数组并将所有元素初始化为 0。我们称这个数组为\
  \ `auxHeights`。\n*   遍历所有建筑，对于每个 `B[i]` 建筑，遍历范围 `[l[i]..r[i])`，其中 `l[i]` 是建筑 `B[i]`\
  \ 的左坐标，`r[i]` 是右坐标。\n*   对于该范围内的每个 `x[j]` 元素，检查 `h[i]>auxHeights[xj]`，即建筑 `B[i]`\
  \ 是否高于位置 `x[j]` 处当前的高度。如果是，替换 `auxHeights[x[j]]`。\n\n#### Problem-28\n合并两条轮廓线与合并一个建筑有本质区别吗？\n\
  \n**Solution：** 答案显然是否定的。这表明我们使用分治法。将输入分成两个相等的集合。（递归地）计算每个集合的轮廓线，然后合并这两条轮廓线。正如我们在上面看到的，一个接一个插入建筑并不是解决此问题的最快方法。然而，如果我们先将建筑对合并为轮廓线，然后将这些轮廓线对合并成更大的轮廓线，那么——由于问题规模每一步都减半——在\
  \ *logn* 步之后我们就可以计算出最终的轮廓线了。\n\n\n\n在本章中，我们将尝试解决那些使用其他技术（例如 `Divide & Conquer` 和\
  \ `Greedy` 方法）无法获得最优解的问题。动态规划（Dynamic Programming，DP）是一种简单的技术，但可能很难掌握。识别和解决 DP 问题的一种简单方法是尽可能多地解决问题。`Programming`\
  \ 一词与编码无关，它实际上源于文学，意思是“填充表格”（类似于 `Linear Programming`）。\n\n## 19.2 什么是动态规划策略？\n\n\
  动态规划和备忘化（memoization）是协同工作的。动态规划与分治法的主要区别在于，在后者的情况下，子问题是独立的，而在 DP 中，子问题可能存在重叠。通过使用备忘化\
  \ [维护一个已求解子问题的表]，动态规划可以将许多问题的指数级复杂度降低到多项式级复杂度（O(*n*²), O(*n*³), 等）。DP 的主要组件是：\n\n\
  •递归：递归地解决子问题。\n\n••备忘化：将已计算的值存储在表中（`Memoization` 意味着缓存）。\n\n![images](img/image01533.jpeg)\n\
  \n## 19.3 动态规划策略的属性\n\n可以判断是否能解决给定问题的两个动态规划属性是：\n\n•`最优子结构:`：问题的最优解包含子问题的最优解。\n\n\
  •`重叠子问题:`：递归解包含少量不同的子问题，这些问题被多次重复。\n\n## 19.4 动态规划能解决所有问题吗？\n\n与贪心算法和分治法一样，DP 并不能解决每个问题。有些问题是无法通过任何算法技术\
  \ [`Greedy, Divide and Conquer and Dynamic Programming] 解决的。\n\n动态规划与直观递归之间的区别在于对递归调用的备忘化。如果子问题是独立的且没有重复，那么备忘化就起不到作用，因此动态规划不是所有问题的解决方案。\n\
  \n## 19.5 动态规划方法\n\n基本上解决 DP 问题有两种方法方法：\n\n•自底向上的（Bottom-up）动态规划\n\n•自顶向下的（Top-down）动态规划\n\
  \n### 自底向上的动态规划\n\n在这种方法中，我们从最小可能的输入参数值开始评估函数，然后遍历可能的值，逐渐增加输入参数的值。在计算值时，我们将所有计算过的值存储在表中（内存中）。当评估较大的参数时，可以使用较小参数的预先计算值。\n\
  \n### 自顶向下的动态规划\n\n在这种方法中，问题被分解为多个子问题；解决这些每个子问题；并记住解决方案，以备以后需要求解时。此外，我们将每个计算出的值保存为递归函数的最后一个动作，并作为第一个动作检查是否存在预先计算的值。\n\
  \n### 自底向上的编程 vs. 自顶向下的编程\n\n在自底向上的编程中，程序员必须选择要计算的值并决定计算顺序。在这种情况下，所有可能需要的子问题都会预先解决，然后用于构建更大问题的解决方案。在自顶向下的编程中，保留了原始代码的递归结构，但避免了不必要的重复计算。问题被分解为子问题，解决这些子问题并记住解决方案，以备需要再次求解。\n\
  \n**注意：** 某些问题可以使用这两种技术解决，我们将在下一节中看到示例。\n\n## 19.6 动态规划示例\n\n•`最短路径`\n•`最长公共子序列`\n\
  •`编辑距离`\n`Bellman-Ford`\n`Floyd 全对最短路径`\n`0/1 背包`\n`旅行商问题`\n`子集和`\n`矩阵乘法`\n`递增子序列`\n\
  \n## 19.7 理解动态规划\n\n在进入示例之前，让我们理解 DP 是如何工作的。\n\n### 斐波那契数列\n\n在斐波那数列中，当前数字是之前数字之和。递归式定义为：\n\
  \n```\n![images](img/image01534.jpeg)\n```\n\n实现方式为：\n\n```\n![images](img/image1535.jpeg)\n\
  ```\n\n### 备忘化有什么帮助？\n\n调用 `fib(5)`会导致指数级时间，因为子问题被再次调用。`Memoization` 的工作原理：如果一个值已经计算过，则在表中查找其答案。\n\
  \n```\n![images](img/image1536.jpeg)\n```\n\n**注意：** 对于所有问题，可能无法找到自顶向下和自底向上的解决方案。两个版本的斐波数列都明显将复杂度降低到了\
  \ O(*n*)。这是因为如果一个值已经计算过，我们就不再再次调用子问题。实现代码如下：\n\n```\n![images](img/image1539.jpeg)\n\
  ```\n\n#### 改进\n\n从斐波那数列中的另一个观察是，我们不需要存储所有之前的值。相反，如果我们只存储最后两个值，就可以计算出当前值。此实现为：\n\
  \n```\n![images](img/image1540.jpeg)\n```\n\n### 数字的阶乘\n\n作为另一个示例，考虑阶乘问题：*n*! 是\
  \ *n* 和 1 之间所有整数的积。递归阶乘的定义可以给出：\n\n```\n![images](img/image1541.jpeg)\n```\n\n这个定义很容易转换为实现。这里的问题是寻找\
  \ *n*! 的值，而子问题是寻找 (*n* – 1!) 的值。在递归情况下，当 *n* 大于 1 时，函数调用自己来寻找 (*n* – 1)! 的值，并将其与\
  \ *n* 相乘。在基础情况下，当 n 为 0 或 1 时，函数直接返回 1。\n\n上述实现的递归式可以给出：\n\n```\nT(n) = n * T(n\
  \ - 1) ≈ O(n)\n```\n\n时间复杂度：O(*n*)。空间复杂度：O(*n*)，递归调用需要一个大小为 *n* 的栈。\n\n\n\n在上述递归关系和实现中，对于任何\
  \ `n` 值，都不存在重复计算（没有子问题的重叠），且阶乘函数没有从动态规划中获得任何益处。现在，假设我们要计算某些任意值 `m` 的一系列 `m!`。使用上述算法，对于每次此类调用，我们可以在\
  \ `O(m)` 时间内完成计算。例如，为了同时找到 `n!` 和 `m!`，我们可以使用上述方法，其中寻找 `n!` 和 `m!` 的总复杂度为 `O(m +\
  \ n)`。\n\n**时间复杂度：** `O(n + m)`。\n\n**空间复杂度：** `O(max(m,n))`，递归调用需要一个大小等于 `m` 和\
  \ `n` 最大值的栈空间。\n\n### 改进： \n现在让我们看看动态规划是如何降低复杂度的。从上述递归定义可以看出，`fact(n)` 是通过 `fact(n\
  \ - 1)` 和 `n` 计算出来的，不再包含其他内容。我们不需要每次都调用 `fact(n)`，可以将之前计算的值存储在表中，并利用这些值来计算新值。这种实现可以写作：\n\
  \n![images](img/image0154.jpeg)\n\n为了简单起见，假设我们已经计算了 `n!` 并想要找到 `m!`。对于寻找 `m!`，我们只需要查看表，如果条目已经计算过则直接使用。如果\
  \ `m < n`，则我们不需要重新计算 `m!`。如果 `m > n`，我们可以使用 `n!` 并仅对剩余数字调用阶乘函数。\n\n上述实现显然将复杂度降低到了\
  \ `O(max(m,n))`。这是因为如果 `fact(n)` 已经存在，我们就不再再次计算该值。如果我们填充了这些新计算的值，后续的调用将进一步降低复杂度。\n\
  \n**时间复杂度：** `O(max(m,n))`。**空间复杂度：** `O(max(m,n))`（用于表）。\n\n### 最长公共子序列\n\n给定两个字符串：长度为\
  \ `m` 的字符串 `X` [`X(1..m)`] 和长度为 `n` 的字符串 `Y` `[7(1..n)]`，找到最长公共子序列：即在两个字符串中从左到右出现（但不一定是连续块）的最长字符序列。例如，如果\
  \ `X = “ABCBDAB\"` 且 `Y = “BDCABA\"`，则 `LCS(X, Y)` = {\"BCBA”, “BDAB”, “BCAB”}。我们可以存在多个最优解。\n\
  \n**暴力破解法：** 一个简单的想法是检查 `X[1..m]` (`m` 是序列 `X` 的长度）的每一个子序列，看它是否也是 `Y[1..n]` (`n`\
  \ 是序列 `Y` 的长度）的子序列。检查需要 `O(n)` 时间，而 `X` 有 `2^m` 个子序列。因此，运行时间是指数级的 `O(n. 2^m)`，对于长序列并不理想。\n\
  \n**递归解决方案：** 在采用 DP 解之前，让我们先为这个问题建立递归解，稍后我们可以添加备忘录来降低复杂度。让我们从对 LCS 问题的一些简单观察开始。如果我们有两个字符串，比如“ABCBDAB”和“BDCABA”，如果从第一个字符串中的字母连到第二个字符串中对应的字母，没有两条线会交叉：\n\
  \n![images](img/image0154.jpeg)\n\n从上述观察中我们可以看到 `X` 和 `Y` 的当前字符可能匹配也可能不匹配。这意味着，假设前两个字符不同。那么它们就不可能同时成为公共子序列的一部分——其中一个（或可能都是）都必须被移除。最后观察到，一旦我们决定了如何处理字符串的第一个字符，剩余的子问题又是一个两个较短字符串的\
  \ `LCS` 问题。因此，我们可以递归地解决它。\n\n`LCS` 的解应该在 `X` 和 `Y` 中找到两个序列，假设 `X` 中序列的起始索引为 `i`，`Y`\
  \ 中序列的起始索引为 `j`。此外，假设 `X[i...m]` 是 `X` 中从字符 `i` 开始到 `X` 结尾的子串，`Y[j...n]` 是 `Y` 中从字符\
  \ `j` 开始到 `Y` 结尾的子串。\n\n基于上述讨论，我们得到如下所述的可能性：\n\n1) 如果 `X[i] == Y[j]`：`1 + LCS(i\
  \ + 1, j + 1)`\n2) 如果 `X[i] != Y[j]`：`LCS(i, j + 1)` // 跳过 `Y` 的第 `j^{th}` 个字符\n\
  3) 如果 `X[i] != Y[j]`：`LCS(i + 1, j)` // 跳过 `X` 的第 `i^{th}` 个字符\n\n在第一情况下，如果 `X[i]`\
  \ 等于 `Y[j]`，我们得到一个匹配对并计入 `LCS` 的总长度。否则，我们需要跳过 `X` 的第 `i^{th}` 个字符或 `Y` 的第 `j^{th}`\
