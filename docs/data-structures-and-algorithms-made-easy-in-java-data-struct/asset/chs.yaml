  \n时间复杂度：O(*n*)。空间复杂度：O(*n*)。\n\n### Problem-29\n给出一个根据给定的中序遍历和前序遍历构造二叉树的算法。\n\n\
  **解决方案：** 让我们考虑下面的遍历：\n\n![Image](img/image00835.jpeg)\n\n在先序序列中，最左侧的元素表示树的根。因此我们知道对于给定的序列，‘A’是根。通过在中序遍历序列中搜索‘A’，我们可以找到‘A’左侧的所有元素（它们属于左子树）以及‘A’右侧的所有元素（它们属于右子树）。因此，我们得到了所示的结构。\n\
  \n![Image](img/image00836.jpeg)\n\n我们递归地遵循上述步骤并得到下面的树。\n\n![Image](img/image00837.jpeg)\n\
  \n**算法：** `BuildTree()`\n\n1. 从前序遍历中选择一个元素。增加前序索引变量（下方代码中的 `preIndex`）以便在下一次递归调用中选取下一个元素。\n\
  2. 以所选元素作为数据创建一个新的树节点（`newNode`）。\n3. 在中序遍历中查找选元素的索引。令该索引为 `inIndex`。\n4. 为 `inIndex`\
  \ 之前的元素调用 `BuildTree()` 并构建 `newNode` 的左子树。\n5. 为 `inIndex` 之后的元素调用 `BuildTree()`\
  \ 并构建 `newNode` 的右子树。\n6. 返回 `newNode`。\n\n### Problem-30\n根据给定的中序遍历和后序遍历构造二叉树的算法。\n\
  \n**解决方案：**\n\n![Image](img/image00839.jpeg)\n\n时间复杂度：O(*n*)。空间复杂度：O(1)。\n\n###\
