  \n### Problem-12 \n在 Problem-11 中，我们假设 `M(i)` 表示从 1 到 `i` 个数字中不选择三个连续数字的情况下的最大和。我们是否可以通过改变定义来解决相同的问题，即\
  \ `M(i)` 表示从 `i` 到 `n` 个数字中不选择三个连续数字的情况下的最大和？\n\n**Solution：可以。** 推理过程非常相似。让我们看看\
  \ DP 如何解决这个问题。假设 `M(i)` 表示从 `i` 到 `n` 个数字中不选择三个连续数字的情况下的最大和。\n\n![images](img/image01568.jpeg)\n\
  \n在计算 `M(i)` 时，我们需要做出的决策是是否选择第 `i^(th)` 个元素。这为我们提供了以下可能性：\n\n![images](img/image01569.jpeg)\n\
  \n• 在给定的问题中，限制是不选择三个连续的数字，但我们可以连续选择两个元素并跳过第三个。这就是上述递归公式中第一种情况的情况。这意味着我们跳过了 `A[i\
  \ + 2]`。\n\n• 另一种可能性是，选择第 `i^(th)` 个元素并跳过第二个 `i – 1^(th*)` 个元素。这是第二种情况（跳过 `A[i +\
  \ 1]`）。\n\n• 而第三种情况是不选择第 `i^(th)` 个元素，结果我们需要解决包含 `i + 1` 个元素的问题。\n\n时间复杂度：`O(n)`。空间复杂度：`O(n)`。\n\
  \n### Problem-13 Catalan Numbers:\n有多少个具有 `n` 个节点的二叉搜索树？\n\n**Solution：** 二叉搜索树（BST）是一种其左子树元素小于根元素，且右子树元素大于根元素的树。这一属性应该在树的每个节点上都满足。`n`\
  \ 个节点的 BST 数量被称为`卡兰数`，并用 `C[n]` 表示。例如，2 个节点的 BST 有 2 种（根节点有 2 种选择），3 个节点的 BST 有\
  \ 5 种。\n\n![images](img/image01570.jpeg)\n\n假设树的节点从 1 到 `n` 编号。在这些节点中，我们需要选择某些节点作为根，然后将小于根节点的节点分为左子树，将大于根节点的元素分为右子树。由于我们已经对顶点进行了编号，假设我们选择的根元素是第\
  \ `i^(th)` 个元素。\n\n如果我们选择第 `i^(th)` 个元素作为根，那么左子树有 `i – 1` 个元素，右子树有 `n – i` 个元素。由于\
  \ `C[n]` 是 `n` 个元素的卡兰数，`C[i–1]` 代表左子树元素（`i – 1` 个元素）的卡兰数，而 `C[n–i]` 代表右子树元素的卡兰数。这两个子树之间是相互独立的，因此我们只需要将这两个数字相乘。这意味着对于固定的\
  \ `i` 值，卡兰数为 `C[i–1] * C[n–i]`。\n\n由于有 `n` 个节点，对于每个 `i` 我们将得到 `n` 种选择。`n` 个节点的总卡兰数可以表示为：\n\
  \n![images](img/image01571.jpeg)\n\n对于这个简单的递归定义，我们可以将函数写为：\n\n![images](img/image01572.jpeg)\n\
  \n时间复杂度：`O(4^n)`。证明请参考 `Introduction` 章节。\n\n### Problem-14\n我们可以使用 DP 改进 Problem-13\
  \ 的时间复杂度吗？\n\n**Solution：** 递归调用 `C[n]` 只依赖于数字 `C[0]` 到 `C[n–1]`，且对于 `i` 的任何取值，存在大量的重复计算。我们将维护一个表来存储之前计算过的\
  \ `C[i]` 值。如果用参数 `i` 调用函数 `CatalanNumber()`，且它之前已经计算过，那么我们只需避免重复计算相同的子问题。\n\n![images](img/image01573.jpeg)\n\
  \n这种实现的时间复杂度为 `O(n²)`，因为为了计算 `CatalanNumber(n)` 需要计算所有的值。对于这个简单的递归定义，卡兰数可以表示为：\n\
  \n![images](img/image01574.jpeg)\n\n### Problem-15 Matrix Product Parenthesizations:\n\
  给定一系列矩阵 `A[1] × A[2] × ... × A[n]`，什么样的乘法顺序可以使乘法次数最少？\n\n**Solution：** 输入：矩阵序列 `P`。目标：对给定矩阵进行加括号以产生最少的乘法次数。假设\
  \ `M[i,j]` 表示乘以 `A[i] × ... × A[j]` 需要的最少乘法次数。由于矩阵乘法具有结合律，如何加括号似乎并不重要。例如，对于四个矩阵\
  \ A、B、C、D，可能出现：\n\n![images](img/image01575.jpeg)\n\n乘以 (*p × q*) 矩阵 (*q × r*) 需要\
  \ `pqr` 次乘法。基于贪心算法，我们总是先进行便宜的乘法。有时它返回的括号并不是最优的。为了找到最优解，我们使用 DP。`M[i,j]` 的递归公式为：\n\
  \n```\nM[i,j] = min_{i≤k<j} {M[i,k] + M[k+1,j] + p[i-1]*p[k]*p[j]}\n```\n\n其中 `p[i-1]`、`p[k]`\
  \ 和 `p[j]` 是矩阵的维度。我们使用另一个表（例如 `S[i,j]`）来重构最优括号方案。以底上的方式计算 `M[i,j]` 和 `S[i,j]`。\n\
  \n![images](img/image01576.jpeg)\n\n**有多少个子问题？** 在上述公式中，`i` 的范围是从 1 到 `n`，`j` 的范围是从\
  \ 1 到 `n`。因此总共有 `n²` 个子问题，而且我们执行了 `n – 1` 次这样的操作。所以时间复杂度为 `O(n³)`。空间复杂度：`O(n²)`。\n\
  \n### Problem-16\n对于 Problem-16，可以使用贪心算法吗？\n\n**Solution：** 贪心算法不是解决这个问题的最优方法。让我们来看反例。正如我们已经看到的，贪心算法做出的决策是局部最优，它不考虑未来的最优解。\n\
  \n**Example：** 考虑 A[1] × A[2] × A[3]，维度分别为 3 × 100、100 × 2 和 2 × 2。基于贪心算法，我们将其加括号为：`A[1]\
  \ × (A[2] ×A[3])`，需要 100 · 2 · 2 + 3 · 100 · 2 = 1000 次乘法。但这个问题的最优解是：`(A[1] × A[2])\
  \ × A[3]`，需要 3 · 100 · 2 + 3 · 2 · 2 = 612 次乘法。因此我们不能使用贪心算法来解决这个问题。\n\n\n\n\n\n\
  # 问题-17: 整数背包问题（允许重复物品）\n\n给定 `n` 种物品，其中第 `i^(th*)` 种物品具有整数大小 `s[i]` 和价值 `v[i]`。我们需要用物品填充一个总容量为\
  \ `C` 的背包，使得总价值最大。我们可以向背包中添加多个相同种类的物品。\n\n**注意：** 关于分数背包问题，请参阅*贪心算法*章节。\n\n**解：**\
  \ 输入：`n` 种物品，其中第 `i^(th)` 类物品的大小为 `s[i]`，价值为 `v[i]`。同时假设每种物品都有无限数量。\n\n**目标：** 使用\
  \ `n` 种物品填充容量为 `C` 的背包，并获得最大价值。\n\n一个重要的点是，并不强制要求填满背包。这意味着，如果我们完全填满背包（大小为 `C`）得到价值\
  \ `V`，而而不完全填满背包（假设为 `C – 1`）得到价值 `U`，且 `V < U`，则我们考虑后者。在这种情况下，我们实际上是在填充大小为 `C –\
  \ 1` 的背包。如果 `C – 1` 也出现相同的情况，那么我们尝试填充大小为 `C – 2` 的背包并获得最大价值。\n\n假设 `M(j)` 表示可以放入大小为\
  \ `j` 的背包中的最大价值。我们可以根据子问题的解递归地表示 `M(j)` 如下：\n\n![images](img/image01578.jpeg)\n\n\
  对于这个问题，决策取决于对于大小为 `j` 的背包，我们是否选择某个特定的第 `i^(th)` 物品。\n\n* 如果我们选择了第 `i^(th)` 物品，则将其价值\
  \ `v[i]` 添加到最优解中，并将待求解的背包大小减到 `j – s[i]`。\n* 如果我们不选择该物品，则检查是否为大小为 `j – 1` 的背包获得更好的解。\n\
  \n`M(C)` 的值将包含最优解的价值。我们可以通过维护和跟踪“回溯指针”来找到最优解中的物品列表。\n\n**时间复杂度：** 找到每个 `M(j)` 值需要\
  \ `Θ(n)` 时间，我们需要顺序计算 `C` 个值。因此，总运行时间为 `Θ(nC)`。\n\n**空间复杂度：** `Θ(C)`。\n\n# 问题-18:\
  \ 0-1 背包问题\n\n对于问题-17，如果物品不可重复（即每种物品没有无限数量，且每个物品允许使用 0 次或 1 次），我们如何解决它？\n\n**实时示例：**\
  \ 假设我们正在乘飞机，知道行李重量有限制。此外，我们携带的物品可能是不同类型的（如笔记本电脑等）。在这种情况下，我们的目标是选择价值最大的物品。这意味着，我们需要告诉海关人员选择那些重量更大而价值（利润）较低的物品。\n\
  \n**解：** 输入是一个包含 `n` 个物品的集合，大小为 `s[i]`，价值为 `v[i]`，以及一个大小为 `C` 的背包，我们需要用给定集合中的物品子集填充背包。让我们尝试使用动态规划为这个问题寻找递归公式。令\
  \ `M(i, j)` 表示使用物品 `1... i` 填充大小为 `j` 的背包所能获得的最优价值。递归公式可以给出为：\n\n![images](img/image01579.jpeg)\n\
  \n**时间复杂度：** `O(nC)`，因为有 `nC` 个子问题需要解决，每个子问题需要 `O(1)` 来计算。**空间复杂度：** `O(nC)`，而整数背包问题只需要\
  \ `O(C)`。\n\n现在让我们考虑下面的图，它有助于我们重建最优解并提供进一步的理解。下方矩阵的大小为 `M`。\n\n![images](img/image01580.jpeg)\n\
  \n由于 `i` 取值范围是 `1...n`，`j` 取值范围是 `1...C`，总共有 `nC` 个子问题。现在让我们看看上面的公式说明了：\n\n* `M(i\
  \ – 1, j)`：表示不选择第 `i^(th)` 物品的情况。在这种情况下，由于我们没有向背包添加任何大小，我们必须对子问题使用相同的背包大小，但排除第 `i^(th)`\
  \ 物品。剩余物品是 `i – 1`。\n* `M(i – 1, j – s[i]) + v[i]` 表示选择了第 `i^(th)` 物品的情况。如果我们添加第\
  \ `i^(th)` 物品，则必须将子问题的背包大小减到 `j – s[i]`，同时我们需要向最优解中添加价值 `v[i]`。剩余物品是 `i – 1`。\n\n\
