  \n### 21.2.22 不使用除法执行平均值\n\n是否存在位操作算法可以替代 `mid = (low + high) / 2`（用于二分查找和合并排序），变成快得多的方法？\n\
  \n我们可以使用 `mid = (low + high) >> 1`。注意，当整数溢出成为问题时，使用 `(low + high) / 2` 计算中点将无法正常工作。我们可以使用位移，还可以解决可能的溢出问题：`low\
  \ + ((high – low) / 2)`，其对应的位移操作为 `low + ((high – low) >> 1)`。\n\n### 21.3 其他编程题及答案\n\
