  \ `c` 值而不是负值。\n\n### 题 21\n给定一个包含数十亿个数字的大文件，你如何从该文件中找到最大的 10 个数？\n\n**解决方案：** 始终记住，当你需要找到最大的\
  \ *n* 个元素时，最好的数据结构是优先级队列。\n\n解决此问题的一种方案是将数据分成每组 1000 个元素（假设为 1000）并为它们建立堆，然后从每个堆中逐个取出\
  \ 10 个元素。最后对所有 10 个元素的组进行堆排序，并取出其中的前 10 个。但这种方法的问题在于从哪里存储每个堆的 10 个元素。由于我们有数十亿个数字，这可能需要大量的内存。\n\
  \n在后续元素中复用（来自之前的堆的）前 10 个元素可以解决这个问题。这意味着取第一块 1000 个元素，后续每块取 990 个元素。初始，对第一组 1000\
  \ 个数字进行堆排序，取出最大的 10 个元素，并将它们与第 2(*nd*) 组的 990 个元素混合。再次对这 1000 个数字（第一组的 10 个和第 2(*nd*)\
  \ 组的 990 个）进行堆排序，取出最大的 10 个元素，并将它们与第 3^(*rd*) 组的 990 个元素混合。重复此过程，直到最后一组 990（或更少）元素，并从最终堆中取出最大的\
  \ 10 个元素。这 10 个元素就是你的答案。\n\n时间复杂度：O(*n*) = *n*/1000 ×(1000 个元素堆排序的复杂度)。由于堆排序 1000\
  \ 个元素的复杂度将是一个常数，因此 O(*n*) = *n*，即线性复杂度。\n\n### 题 22：合并总元素量为 *n* 个的 *k* 个有序列表：\n\
  我们给定 *k* 个有序列表，所有列表总共有 *n* 个输入元素。给出一个算法将它们合并为一个单一的有序列表。\n\n**解决方案：** 因为由于有 *k* 个等大小的列表且总共有\
  \ *n* 个元素，每个列表的大小为 ![Image](img/image01025.jpeg)。解决此问题的一种简单方法是：\n\n*   取第一个列表并将其与第二个列表合并。由于每个列表的大小为\
  \ ![Image](img/image01025.jpeg)，这一步会产生一个大小为 ![Image](img/image01026.jpeg) 的有序列表。这类似于归并排序逻辑。这一步的时间复杂度为：![Image](img/image01026.jpeg)。这是因为我们需要扫描两个列表的所有元素。\n\
  *   然后，将第二个列表的输出与第三个列表合并。结果是这一步产生了一个大小为 ![Image](img/image01027.jpeg) 的有序列表。这一步的时间复杂度为：![Image](img/image01027.jpeg)。这是因为我们需要扫描两个列表的所有元素（一个大小为\
  \ ![Image](img/image01026.jpeg)，另一个大小为 ![Image](img/image01025.jpeg)）。\n*   继续这个过程，直到所有列表都合并为一个列表。\n\
  \n总时间复杂度：![Image](img/image01028.jpeg)\n\n空间复杂度：O(1)。\n\n### 题 23\n对于 [题 22]，我们可以改进时间复杂度吗？\n\
  \n**解决方案：**\n\n1.  将列表成对分组并合并它们。这意味着，首先每次取两个列表并合并它们，使得所有列表解析的元素总数为 O(*n*)。此操作产生了\
  \ *k*/2 个列表。\n2.  重复步骤 1 直直到列表数量变为一个。\n\n时间复杂度：步骤 1 执行了 *logk* 次，每次操作解析所有列表中的所有\
  \ *n* 个元素以生成 *k*/2 个列表。例如，如果我们有 8 个列表，第一轮将通过解析所有 *n* 个元素产生 4 个列表。第二轮通过再次解析 *n* 个元素产生\
  \ 2 个列表，第三轮通过再次解析 *n* 个元素产生 1 个列表。结果是总时间复杂度为 O(*nlogn*)。\n\n空间复杂度：O(*n*)。\n\n###\
  \ 题 24\n对于 [题 23]，我们可以改进空间复杂度吗？\n\n**解决方案：** 让我们使用堆来降低空间复杂度。\n1.  用所有第一个元素（*k* 个）构建最大堆。\n\
  2.  在每一步中，提取列表的最大值。\n3.  重复步骤 2 直到所有列表完成。\n\n时间复杂度：O(*nlogn*)。我们需要选择列表的最大值需要 O(*n*)。\n\
  \n空间复杂度：O(k)。\n\n### 题 25\n给定每个包含 *n* 个元素的数组 *A* 和 *B*。给出一个找到最大的 *n* 的算法。\n\n**解决方案：**\n\
  *   对 *A* 和 *B* 进行堆化。这一步需要 O(*n*)。\n*   然后从两个堆中删除。每一步需要 O(*logn*)。\n\n### 题 26：最小极大堆\n\
  给出一个支持 O(1) 时间查找最小值和最大值，O(*logn*) 时间删除最小值和最大值的算法。这意味着设计一个支持以下操作的数据结构：\n\n| 操作 |\
  \ 复杂度 |\n| :--- | :--- |\n| Init | O(*n*) |\n| Insert | O(*logn*) |\n| FindMin |\
  \ O(1) |\n| FindMax | O(1) |\n| DeleteMin | O(*logn*) |\n| DeleteMax | O(*logn*)\
  \ |\n\n**解决方案：** 这个问题可以使用两个堆来解决。假设两个是最小堆 `H[min]` 和最大堆 `H[max]`。此外假设元素具有相互指针。这意味着\
  \ `H[min]` 中的元素指向 `H[max]` 中的相同元素，而 `H[max]` 中的元素指向 `H[min]` 中的相同元素。\n\n*   在 O(*n*)\
  \ 时间构建 `H[min]` 和 `H[max]`。\n*   Insert(x)：在 O(*logn*) 时间将 `x` 插入 `H[min]`。在 O(*logn*)\
  \ 时间将 `x` 插入 `H[max]`。在 O(1) 时间更新指针。\n*   FindMin()：在 O(1) 时间返回 `root(H[min])`。\n\
  *   FindMax：返回 `root(H[max])`。\n*   DeleteMin：在 O(*logn*) 时间从 `H[min]` 删除。通过相互指针在\
  \ O(*logn*) 时间从 `H[max]` 删除相同元素。\n*   DeleteMax：在 O(*logn*) 时间从 `H[max]` 删除最大值。通过相互指针在\
  \ O(*logn*) 时间从 `H[min]` 删除相同元素。\n\n### 题 27\n动态位数查找。设计一种支持查找中位的堆数据结构。\n\n**解决方案：**\
  \ 在 *n* 个元素的集合中，位数是中间元素，使得小于中位的数量等于大于中位的数量。如果 *n* 是奇数，我们可以通过排序集合并取中间元素来找到位数。如果 *n*\
  \ 是偶数，位数通常定义为两个中间元素的平均值。该算法即使列表中的某些元素相等也有效。例如，多集 {1, 1, 2, 3, 5} 的位数是 2，多集 {1, 1,\
  \ 2, 3, 5, 8} 的位数是 2.5。\n\n\n\n\n\n“中位数堆”（Median heaps）是堆的一种变体，用于访问中位数元素。中位数堆可以使用两个堆来实现，每个堆包含一半的元素。其中一个是最大堆（max-heap），包含最小的元素；另一个是最小堆（min-heap），包含最大的元素。如果元素总数为偶数，则最大堆的大小等于最小堆的大小。在这种情况下，中位数是最大堆中最大元素和最小堆中最小元素的平均值。如果元素个数为奇数，则最大堆的元素个数比最小堆多一个。在这种情况下，中位数简单就是最大堆的最大元素。\n\
  \n### 问题-28 滑动窗口最大和\n给定数组 `A[]` 和一个大小为 `w` 的滑动窗口，窗口从数组的最左侧移动到最右侧。假设只能看到窗口内的 `w`\
  \ 个数字。每当滑动窗口向右移动一个位置。例如：数组为 `[1 3 -1 -3 5 3 6 7]`，`w` 为 `3`。\n\n| 窗口位置 | 最大值 |\n\
  | :--- | :--- |\n| `[1 3 -1] -3 5 3 6 7` | 3 |\n| 1 [3 -1 -3] 5 3 6 7 | 3 |\n| 1\
  \ 3 [-1 -3 5] 3 6 7 | 5 |\n| 1 3 -1 [-3 5 3] 6 7 | 5 |\n| 1 3 -1 -3 [5 3 6] 7 |\
  \ 6 |\n| 1 3 -1 -3 5 [3 6 7] | 7 |\n\n**输入:** 一个长数组 `A[]` 和窗口宽度 `w`。\n**输出:** 一个数组\
  \ `B[]`，`B[i]` 是 `A[i]` 到 `A[i+w-1]` 之间的最大值。\n**要求:** 找到一种良好的优化方法来获取 `B[i]`。\n**解:**\
  \ 暴力破解法是，每次窗口移动时，我们可以在窗口内搜索总共 `w` 个元素。\n时间复杂度：`O(nw)`。\n\n### 问题-29\n对于问题-28，我们可以降低复杂度吗？\n\
  \n**解：可以的，** 我们可以使用堆数据结构。这可以将时间复杂度降低到 `O(nlogw)`。插入操作需要 `O(logw)` 时间，其中 `w` 是堆的大小。然而，获取最大值是廉价的；它只需要常数时间，因为最大值始终保持在堆的根节点（头部）。当窗口向右滑动时，堆中的某些元素可能不再有效（其范围超出了当前窗口）。我们应该如何删除它们呢？在这里我们需要稍微小心。由于我们只删除超出窗口范围的元素，我们还需要跟踪元素的索引。\n\
  \n### 问题-30\n对于问题-28，我们可以进一步降低复杂度吗？\n\n**解：可以的，** 双端队列（double-ended queue）是解决这个问题的完美数据结构。它支持从前端和后端插入/删除。技巧是找到一种方法，使得窗口中的最大元素始终出现在队列的前端。当你向队列推入和弹出元素时，如何维护这一要求？\n\
  \n此外，你会发现队列中存在一些我们甚至不应该考虑的冗余元素。例如，如果当前队列元素为：`[10 5 3]`，窗口中有一个新元素 `11`。现在，我们可以在不考虑元素\
  \ `10`、`5` 和 `3` 的情况下清空队列，仅将元素 `11` 插入队列。\n\n通常，大多数人尝试保持队列的大小与窗口的大小相同。尝试打破这种思维并跳出框架。移除冗余元素并仅在队列中存储需要考虑的元素是实现下面高效\
  \ `O(n)` 解决方案的关键。这是因为列表中的每个元素最多被插入和删除一次。因此，插入+删除操作总数为 `2*n`。\n\n![Image](img/image01029.jpeg)\n\
  \n### 问题-31\n优先级队列是一个项列表，其中每个项都关联有一个优先级。项从优先级队列中按照其优先级的顺序取出，从最高优先级的项开始。如果需要最高优先级的项，则构建一个堆，使得每个节点的优先级大于其子节点的优先级。\n\
  \n设计这样一个堆，使得中等优先级的项先被取出。如果堆中有 `n` 个项，那么优先级小于中等优先级的项个数是 ![Image](img/image01030.jpeg)\
  \ 如果 `n` 是奇数，否则是 ![Image](img/image01030.jpeg) ∓ 1。\n\n解释取出和插入操作是如何工作的，计算它们的复杂度，以及数据结构是如何构造的。\n\
  \n**解：** 可以使用一个最小堆和一个最大堆，使得最小堆的根大于最大堆的根。最小堆的大小应该等于或比最小堆的大小少一个。这样中位元素始终是最大堆的根。\n\n\
  ### 问题-32\n给定两个堆，如何合并它们？\n\n**解：** 为了高效解决这个问题，可以使用合并堆（mergeable heaps）。合并堆支持高效合并。它支持：\n\
  - `Create-Heap()`：创建一个空堆\n- `Insert(H,K)`：将键为 `K` 的项插入堆 `H`\n- `Find-Min(H)`：返回最小项\n\
  - `Delete-Min(H)`：返回并移除最小项\n- `Union(H1, H2)`：合并 `H1` 和 `H2`\n\n合并堆的示例：\n- 二项堆（Binomialaps）\n\
  - 斐波那契堆（Fibonacci Heaps）\n\n两种堆都支持：\n- `Decrease-Key(H,X,K)`：分配键为 `K` 的项 `Y`\n-\
  \ `Delete(H,X)`：移除项 `X`\n\n#### 二项堆\n与由单棵树组成的堆不同，二项堆由一组树组成，在执行合并操作时不需要重建所有内容。每个组件树都有特殊的格式，称为二项树。\n\
  \n阶为 `k` 的二项树用 `B[k]` 表示，递归如下：\n- `B[0]` 是只有一个节点的树\n- 当 `k` ≥ 1 时，`B[k]` 通过连接两个\
  \ `B[k-1]` 形成，其中一个树的根成为另一棵树根的最左侧孩子。\n\n**示例：**\n![Image](img/image0101.jpeg)\n\n\
  #### 斐波那契堆\n斐波那契堆是合并堆的另一个例子。它对任何操作（`Insert/Create-Heap` 除外都没有良好的最坏情况保证。斐波那契堆执行每个操作具有极佳的摊还成本。像二项堆一样，*斐波那契*堆由一组最小堆排序的树组成。然而，与二项堆不同，它：\n\
  - 树的数量没有限制（`O(n)`）\n- 树的高度没有限制（`O(n)`）\n\n此外，`Find-Min`、`Delete-Min`、`Union`、`Decrease-Key`、`Delete`\
  \ 的最坏情况运行时间均为 `O(n)`。但在摊还意义上，每个操作执行得非常快。\n\n![Image](img/image01032.jpeg)\n\n\n\n\
  \n`MaxHeap` 中的整数始终小于或等于 `MinHeap` 中的整数。此外，`MaxHeap` 中的元素个数要么等于 `MinHeap` 中的元素个数，要么多\
  \ 1 个。在流中，如果我们获得了 `2*n` 个元素（在任何时间点），`MaxHeap` 和 `MinHeap` 将包含相同数量的元素（在这种情况下，每个堆包含\
  \ `n` 个元素）。否则，如果我们收到了 `2*n + 1` 个元素，`MaxHeap` 将包含 `n + 1` 个，`MinHeap` 包含 `n` 个。\n\
  \n让我们来寻找中位数：如果我们有 `2*n + 1` 个元素（奇数），则接收到的元素的中位数将是 `MaxHeap` 中的最大元素（即 `MaxHeap` 的根节点）。否则，接收到的元素的中位数是\
  \ `MaxHeap` 中最大元素（即 `MaxHeap` 的根）和 `MinHeap` 中最小元素（即 `MinHeap` 的根）的平均值。这可以在 `O(1)`\
  \ 时间内完成。\n\n向堆中插入元素可以在 `O(logn)` 内完成。注意，任何包含 `n + 1` 个元素的堆可能也需要一次删除操作（以及插入到另一个堆）。\n\
