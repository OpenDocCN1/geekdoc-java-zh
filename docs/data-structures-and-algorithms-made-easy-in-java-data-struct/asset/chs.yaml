  \ 在沿路找到该房屋后，在 7 英里处定位一个手机基站\n5) 回到步骤 2\n\n## 问题-17：制作歌曲磁带：\n假设我们有一组 *n* 首首歌曲，并想将这些歌曲存储在磁带上。将来，用户将从磁带中读取这些歌曲。从磁带上读取歌曲与从磁盘上读取不同；我们必须先快进通过所有其他歌曲，这需要花费大量时间。令\
  \ `A*[1 ..n*]` 为列出每首歌长度的数组，具体来说，第 *i* 首歌曲的长度为 `A[*i*]`。如果按照从 1 到 *n* 的顺序存储歌曲，那么访问第\
  \ *k^(th)* 首首歌曲的成本为：\n\n![images](img/image01457.jpeg)\n\n该成本反映了我们在读取歌曲 *k* 之前，必须先扫描磁带上所有更早的歌曲。如果我们改变磁带上歌曲的顺序，就会改变访问歌曲的成本，导致某些歌曲的读取成本更高，而另一些则变得更廉。。不同的歌曲顺序可能会导致不同的预期成本。如果我们假设每首歌被访问的概率相等，如果想让预期成本最小，我们应该使用什么顺序？\n\
  \n**解决方案：** 答案很简单。我们应该按照从短到长的顺序存储歌曲。将短的歌曲放在开头可以减少剩余任务的快进时间。\n\n## 问题-18：\n考虑一个拥有非常长的道路和沿路房屋的国家。假设所有房屋的居民都使用手机。我们想沿路放置手机基站，每个基站的覆盖范围为\
  \ 7 公里。创建一个高效算法，以便使用最少的手机基站。\n\n\n\n\n于是他把他们聚在一起，向他们展示了七根绑在一起的木头，并告诉他们谁能折断这捆木头就能继承一切。他们都尝试了，但没有人能折断这捆木头。然后老人解开了绳，一根根折断了木头。兄弟们决定应该团结在一起，共同努力，共同成功。对于问题解决者来说，这个道理是不同的：如果我们无法解决问题，就将其分成若干部分，一次解决一部分。\n\
  \n在前面的章节中，我们已经基于 `D` & `C` 策略解决了许多问题：如 `Binary Search`、`Merge Sort`、`Quick Sort`\
  \ 等等。参考这些主题可以了解 `D` & `C` 的工作原理。下面是其他可以利用 `D` & `C` 策略轻松解决的实时问题。对于所有问题，我们都可以找到与原始问题类似的子问题。\n\
  \n*   在电话簿中查找名字：我们有一本按字母顺序排列名字的电话簿。给定一个名字，我们如何找到该名字是否在电话簿中？\n*   将石头变成粉末：我们想把一块石头变成粉末（极小的石头）。\n\
  *   寻找酒店的出口：我们处于一个非常长的酒店大堂的尽头，有一长排门，我们旁边有一扇门。我们正在寻找通往出口的那扇门。\n*   在停车场寻找我们的车。\n\n\
  ### 18.6 分治策略的优点\n\n**解决困难问题：** `D` & `C` 是解决困难问题的强大方法。例如，考虑汉诺诺塔问题。这需要将问题分解为子问题，解决平凡情况并合并子问题以解决原始问题。将问题分解为子问题以使得子问题可以再次合并，是设计新算法的主要难点。对于许多此类问题，`D`\
  \ & `C` 提供了一个简单的解决方案。\n\n**并行性：** 由于 `D` & `C` 允许我们独立地解决子问题，这允许其在多处理器机器上执行，特别是在共享内存系统中，在这些系统中，处理器之间的数据通信不需要预先计划得当，因为不同的子问题可以在不同的处理器上执行。\n\
  \n**内存访问：** `D` & `C` 算法自然倾向于高效利用内存缓存。这是因为一旦子问题足够小，其所有子问题都可以在缓存中解决，而无需访问较慢的主内存。\n\
  \n### 18.7 分治策略的缺点\n\n`D` & `C` 方法的一个缺点是递归很慢。这是由于重复调用子问题的开销导致的。此外，`D` & `C` 方法需要栈空间来存储调用（递归过程中每个点的状态）。实际上，这取决于实现风格。对于具有足够大的递归基准情况的许多问题，递归的开销可以忽略不计。\n\
  \n`D` & `C` 的另一个问题是，对于某些问题，它可能比迭代方法更复杂。例如，要加 `n` 个数字，用简单的循环顺序相加比使用 `D` & `C` 方法简单得多，后者将数字集合分成两半，递归地相加，然后将和相加。\n\
  \n### 18.8 主定理\n\n如上所述，在 `D` & `C` 方法中，我们递归地解决子问题。所有问题通常都根据递归定义。这些递归问题可以使用主定理轻松解决。关于主定理的细节，请参考《算法分析导论》章节。为了连续性，让我们重新考虑主定理。\n\
  \n如果递归的形式为 ![images](img/image01463.jpeg)，其中 `a` ≥ 1, `b` > 1, `k` ≥ 0 且 `p` 是实数，则复杂度可以直接给出：\n\
  \n1) 如果 `a > b^k`，则 ![images](img/image01464.jpeg)\n2) 如果 `a` = `b^k`\n   a. 如果\
  \ `p` > –1，则，![images](img/image01465.jpeg)\n   b. 如果 `p` = –1，则 ![images](img/image01466.jpeg)\n\
  \   c. 如果 `p` < –1，则 ![images](img/image01467.jpeg)\n3) 如果 `a` < `b^k`\n   a. 如果\
  \ `p` > 0，则 `T(n)` = Θ(`n^klog^pn`)\n   b. 如果 `p` < 0，则 `T(n)` = O(`n^k`)\n\n###\
  \ 18.9 分治的应用\n\n*   二分查找 (Binary Search)\n*   归并排序与快速排序 (Merge Sort and Quick Sort)\n\
  *   中位数查找 (Median Finding)\n*   最大最小值查找 (Min and Max Finding)\n*   矩阵乘法 (Matrix\
  \ Multiplication)\n*   最近对问题 (Closest Pair problem)\n\n### 18.10 分治：问题与解决方案\n\n\
