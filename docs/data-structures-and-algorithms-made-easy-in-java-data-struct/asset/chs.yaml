  给出一个寻找二叉树中两个节点的最小公共祖先（LCA）的算法。\n\n**解决方案：**\n\n![Image](img/image00843.jpeg)\n\n\
  时间复杂度：O(*n*)。空间复杂度：O(*n*)。\n\n### Problem-34\n**之字形遍历：** 给出一个按之字形遍历二叉树的算法。例如，下面树的输出应该是：1\
  \ 3 2 4 5 6 7\n\n![Image](img/image00844.jpeg)\n\n**解决方案：** 这个问题可以使用两个栈轻松解决。假设两个栈为\
  \ `currentLevel` 和 `nextLevel`。我们还需要一个变量来跟踪当前层是从左到右还是从右到左。\n\n从 *currentLevel* 栈中弹出并打印节点的值。每当当前层级是从左到右时，将节点的左孩子、然后右孩子推入栈\
  \ *nextLevel*。由于栈是后进先出（*LIFO*）结构，下次从 nextLevel 弹出节点时，顺序将是反的。\n\n相反，当当前层级是从右到左时，我们会先推入右孩子，再推入左孩子。最后，不要忘记在每一层结束时（即\
  \ *currentLevel* 为空时）交换这两个栈。\n\n![Image](img/image00845.jpeg)\n\n时间复杂度：O(*n*)。空间复杂度：两个栈的空间\
  \ = O(*n*) + O(*n*) = O(*n*)。\n\n### Problem-35\n给出一个寻找二叉树垂直和的算法。例如，\n\n![Image](img/image00846.jpeg)\n\
  \n该树有 5 条垂直线\n\n* 垂直-1: 节点-4 => 垂直和为 4\n\n\n\n\n## Vertical-2: 节点-2 => 垂直和为 2\n\n\
  - Vertical-3: 节点-1,5,6 => 垂直和为 1 + 5 + 6 = 12\n- Vertical-4: 节点-3 => 垂直和为 3\n- Vertical-5:\
  \ 节点-7 => 垂直和为 7\n\n我们需要输出：`4 2 12 3 7`\n\n**解决方案：** 我们可以进行中序遍历并对列进行哈希处理。我们调用 `VerticalSumInBinaryTree(root,\
  \ 0)`，这意味着根节点位于列 0。在遍历过程中，对列进行哈希并通过 `root.getData()` 增加其值。\n\n![Image](img/image00847.jpeg)\n\
  \n### Problem-36\n具有 `n` 个节点可能有多少种不同的二叉树？\n\n**解决方案：** 例如，考虑一个具有 3 个节点的树 (`n` =\
