  \n![images](img/image01319.jpeg)\n\n只要 ![images](img/image01320.jpeg)，该式的上限为 (`a\
  \ + c`) *`n*`。因此，我们可以选择 7 作为分组大小。\n\n**问题-15**\n给定两个各包含 *n* 个有序元素的数组，给出一个 O(`logn`)-*时间*的算法来找到所有\
  \ 2*n* 个元素的中位数。\n\n**解决方案：** 该问题的简单解决方案是合并两个列表，然后取中间两个元素的平均值（注意，并集始终包含偶数个值）。但是，合并操作的时间复杂度是\
  \ Θ(`n`)，所以这不满足题目要求。为了获得 `logn` 复杂度，设 `medianA` 和 `medianB` 为各自列表的中位数（由于两个列表都是有序的，这可以很容易找到）。如果\
  \ `medianA` == `medianB`，那么它就是并集的整体中位数，我们完成了。否则，并集的中位数必须在 `medianA` 和 `medianB`\
  \ 之间。假设 `medianA` < `medianB`（相反的情况完全相似）。我们需要找到以下集合并集的中位数：\n\n![images](img/image01321.jpeg)\n\
  \n因此，我们可以通过重置两个数组的边界来递归地执行。该算法使用两个索引跟踪两个数组（它们是有序的）。这些索引用于访问并比较两个数组的中位数，以找到整体中位数所在。\n\
  \n![images](img/image01322.jpeg)\n\n时间复杂度：O(`logn`)，因为我们将问题规模减了一半。\n\n**问题-16**\n\
  设 `A` 和 `B` 为两个包含 *n* 个元素的有序数组。我们可以通过直接输出 `A[`k`]]` 在 O(1) 时间内找到 `A` 中的第 k 小元素。同样，我们可以很容易地找到\
  \ `B` 中的第 k 小元素。给出一个 O(`logk`) 时间的算法来找到整体第 k 小的元素（即 `A` 和 `B` 的并集）。\n\n**解决方案：**\
  \ 这只是提问问题-15 的另一种方式。\n\n**问题-17**\n**按顺序找到 k 小元素：** 给定一个来自全序域的 *n* 个元素的集合，找到 k 小的元素并按有序顺序列出。分析最佳实现的最坏情况下的运行时间。\n\
  \n**解决方案：** 对数字排序并列出 k 个最小值。`T`(`n`) = 排序的时间复杂度 + 列出 k 个元素的时间 = Θ(`logn`) + Θ(`n`)\
  \ = Θ(`logn`)。\n\n**问题-18**\n对于问题-17，如果采用下面的方法，复杂度是多少？\n\n**解决方案：** 使用堆排序中的优先级队列数据结构，在集合上构建一个最小堆，并执行\
  \ k 次提取最小操作。更多细节请参阅优先级队列（*Heaps*）。\n\n**问题-19**\n对于问题-17，如果采用下面的方法，复杂度是多少？找到集合的第\
  \ k 小元素，围绕该枢值元素进行划分，并对 k 小元素进行排序。\n\n**解决方案：**\n\n![images](img/image01323.jpeg)\n\
  \n由于 *k* ≤ *n*，这种方法比问题-17 和问题-18 更好。\n\n**问题-20**\n在 O(`n`) 时间内找到 n 个不同数字的中数的 k\
  \ 个邻。\n\n**解决方案：** 假设数组是有序的。现在找到中位数并将其索引标记为 `X`（由于数组是有序的，中位数位于 ![images](img/image01324.jpeg)）。我们需要做的是选择\
  \ `X` – 1 到 0 以及 `X` + 1 到 `n` – 1 之间距离中位数绝对值最小的 k 个元素，当中位数位于 `m` 时。时间复杂度：每一步都是\
  \ Θ(`n`)。因此，算法的总复杂度为 Θ(`n`)。\n\n\n\n\n我们可以将`symbol table`（符号表）定义为一种将`value`与`key`（key\
  \ 键）关联的数据结构。它支持以下操作：\n\n- 查找某个名称是否在表中\n- 获取该名称的属性\n- 修改该名称的属性\n- 插入新名称及其属性\n- 删除一个名称及其属性\n\
  \n符号表只有三种基本操作：查找、插入和删除。\n\n**示例：** DNS 查找。假设在这种情况下，键是 URL，值是 IP 地址。\n\n- 插入带有指定\
  \ IP 地址的 URL\n- 给定 URL，找到对应的 IP 地址\n\n| 键[网站] | 值 [IP 地址] |\n| :--- | :--- |\n|\
  \ [www.CareerMonks.com](http://www.CareerMonks.com) | 128.112.136.11 |\n| www.AuthorsInn.com\
  \ | 128.112.128.15 |\n| www.AuthInn.com | 130.132.143.21 |\n| [www.klm.com](http://www.klm.com)\
  \ | 128.103.060.55 |\n| [www.CareerMonk.com](http://www.CareerMonk.com) | 209.052.165.60\
  \ |\n\n### 13.3 符号表的实现\n\n在实现符号表之前，让我们列举可能的实现方式。符号表可以用许多方式实现，下面列出了其中。\n\n### 无序数组实现\n\
  使用这种方法，只需维护一个数组即可。在最坏情况下，查找、插入和删除需要 `O(n)` 时间。\n\n#### 有序[排序]数组实现\n在此方法中，我们维护一个排序的键值数组。\n\
  \n- 按键的排序顺序存储\n- `keys[i]` = 第 `i` 大的键\n- `values[i]` = 与第 `i` 大的键关联的值\n\n由于元素是经过排序并存储在数组中的，我们可以使用简单的二分查找来寻找元素。查找需要\
  \ `O(logn)` 时间，而最坏情况下插入和删除需要 `O(n)` 时间。\n\n#### 无序链表实现\n这种方法只需维护一个带有两个数据值的链表即可。在最坏情况下，查找、插入和删除需要\
  \ `O(n)` 时间。\n\n#### 有序链表实现\n在这种方法中，在插入键时，要维护链表中键的顺序。即使列表是有排序的，在最坏情况下查找、插入和删除仍需要\
  \ `O(n)` 时间。\n\n#### 二叉搜索树实现\n参考 `Trees` 章节。这种方法的优势是：它不需要大量代码，并且搜索速度快 [平均 `O(logn)`]。\n\
  \n#### 平衡二叉搜索树实现\n参考 `Trees` 章节。它是二叉搜索树实现的扩展，查找、插入和删除操作在最坏情况下需要 `O(logn)` 时间。\n\n\
  #### 三叉查找实现\n参考 `String Algorithms` 章节。这是实现字典的重要方法之一。\n\n#### 哈希实现\n这种方法非常重要。欲详细讨论，请参考\
  \ `Hashing` 章节。\n\n### 13.4 各实现方法的符号对比表\n\n让我们考虑针对所有实现方式的对比表。\n\n![images](img/image01327.jpeg)\n\
  \n**注意：**\n\n- 在上表中，`n` 是输入规模。\n- 表格指出了书中讨论的可能实现。但可能存在其他实现方式。\n\n![images](img/image01328.jpeg)\n\
  \n## 14.1 什么是哈希？\n\n哈希（Hashing）是一种用于尽可能快速存储和检索信息的技术。它用于执行最优搜索，并且实现符号表有用。\n\n###\
  \ 14.2 为什么用哈希？\n\n在 `Trees` 章节中，我们看到平衡二叉搜索树支持在 `O(logn)` 时间内执行 `insert, delete and\
  \ search` 操作。在应用中，如果我们需要在 `O(1)` 内完成这些操作，那么哈希提供了一种方法。记住，哈希的最坏情况复杂度仍为 `O(n)`，但它平均可以达到\
  \ `O(1)`。\n\n### 14.3 HashTable（哈希表）ADT\n\n哈希表的常用操作有：\n\n- `CreatHashTable`: 创建一个新的哈希表\n\
  - `HashSearch`: 在哈希表中查找键\n- `Hashlnsert`: 向哈希表中插入新键\n- `HashDelete`: 从哈希表中删除键\n\
  - `DeleteHashTable`: 删除哈希表\n\n### 14.4 理解哈希\n\n简单来说，我们可以将 `array` 视为哈希表。为了理解哈希表的作用，让我们考虑以下示例：如果一个元素中存在重复元素，给出一个算法打印出第一个重复的字符。让我们思考可能的解决方案。简单且暴力的解决方法是：给定一个字符串，对于每个字符检查该字符是否重复。这种方法的时间复杂度为\
  \ `O(n²)`，空间复杂度为 `O(1)`。\n\n现在，让我们为这个问题找到一个更好的解决方案。由于我们的目标是找到第一个重复的字符，如果在某个数组中记住之前的字符会怎样？\n\
  \n我们知道可能的字符数量为 256 个（为了简单起见假设只有 `ASCII` 字符）。创建一个大小为 256 的数组并将其初始化为全零。对于每个输入字符，跳转到对应的位置并增加其计数。由于我们使用了数组，到达任何位置都需要常数时间。\n\
  \n![images](img/image0329.jpeg)\n\n#### 为什么不使用数组？\n\n在前面的问题中，我们使用大小为 256 的数组是因为预先知道字符的数量。现在，让我们考虑该问题的变体。假设数组给的是数字而不是字符，那么我们如何解决？\n\
  \n![images](img/image0330.jpeg)\n\n在这种情况下，值的集合是无限的（或至少很大）。创建一个巨大的数组并存储计数器是不可能的。这意味着有通用的键和有限的位置。如果我们想解决这个问题，我们需要将这些键映射到位置。从上面的讨论和图示可以看出，我们需要映射到可用位置。因此，使用简单数组不是解决这些问题的正确选择。这被称为\
  \ `哈希`。\n\n**注意：** 目前不要担心键是如何映射的。那取决于使用的函数。其中一种简单的函数是 `key % table size`。\n\n###\
  \ 14.5 哈希组件\n\n哈希包含四个关键组件：\n\n1) `Hash Table`（哈希表）\n2) `Hash Functions`（哈希函数）\n\
  3) `Collisions`（冲突）\n4) `Collision Resolution Techniques`（冲突解决技术）\n\n### 14.6 哈希表\n\
  \n哈希表是数组的推广。在数组中，我们将键为 `k` 的元素存储在数组的 `k` 位置。这意味着，给定键 `k`，我们通过直接查看 `k^(th)` 位置来找到键为\
  \ `k` 的元素。这被称为 `直接寻址`。\n\n直接寻址适用于我们能够负担起为每个可能的键分配一个位置的情况。但如果我们没有足够的空间为每个可能的键分配位置，我们需要一种机制来处理这种情况。另一种描述场景的方式是：如果位置较少而可能的键很多，那么简单的数组实现是不够的。\n\
  \n在这种情况下，一种方案是使用哈希表。哈希表或哈希映射是一种存储键及其关联值的数据结构，哈希表使用哈希函数将键映射到其关联值。\n\n### 14.7 哈希函数\n\
  \n哈希函数将键转换为索引。理想情况下，哈希函数应该将每个可能的键映射到唯一的槽索引，但在实践中很难实现。\n\n\n\n\n给定一组元素，将每个项目项映射到唯一槽位的哈希函数称为\
  \ `perfect hash function`（完美哈希函数）。如果我们知道元素且该集合永远不会改变，那么就可以构造出一个完美哈希函数。遗憾的是，对于任意的元素集合，没有系统的方法来构造完美哈希函数。幸运的是，我们不需要哈希函数是完美的也能获得性能效率。\n\
  \n始终拥有一个完美哈希函数的一种方法是增加哈希表的大小，使得元素范围内的每种可能的值都能被容纳。这保证了每个元素都将有一个唯一的槽位。虽然这对于少量元素来说是实行的，但当可能的元素数量很大时，它是不可行的。例如，如果元素是九位社会安全号码，这种方法将需要近十亿个槽位。如果我们只想存储一个\
  \ 25 名学生班的数据，我们将浪费大量的内存。\n\n我们的目标是创建一个能够尽可能减少冲突、易于计算、并且在哈希表中均匀分布元素的哈希函数。扩展简单取余方法有许多常用方法。我们这里将考虑其中几种。\n\
  \n用于构造哈希函数的 `folding method`（折叠法）首先将元素划分为等大小的部分（最后一部分可能不等大）。然后将这些部分相加得到结果的哈希值。例如，如果我们的元素是电话号码\
  \ 436-555-4601，我们将数字并分成每 2 位一组（43,65,55,46,01）。在相加之后，`43+65+55+46+01`，我们得到 `210`。假设我们的哈希表有\
  \ 11 个槽位，那么我们需要执行除以 11 并保留余数的额外步骤。在这种情况下，`210 % 11` 为 `1`，因此电话号码 436-555-4601 哈希到槽位\
  \ `1`。某些折叠法更进一步，在相加之前反转每一个其他部分。对于上面的示例，我们得到 `43+56+55+64+01=219`，得到 `219 % 11 =\
  \ 10`。\n\n## 如何选择哈希函数？\n\n与创建哈希表相关的基本问题是：\n\n*   应该设计一个高效的哈希函数，使其将插入对象的索引值均匀地分布在整个表中。\n\
  *   应该设计一个高效的冲突解决算法，以便当键的哈希索引对应于哈希表中之前插入的位置时，为该键计算一个备用索引。\n*   我们必须选择一个可以快速计算、返回值在我们表位置范围内、并且尽可能减少冲突的哈希函数。\n\
  \n## 良好的哈希函数的特征\n\n一个良好的哈希函数应该具有以下特征：\n\n*   冲突最少化\n*   易于且快速地计算\n*   在哈希表中均匀分布键值\n\
  *   利用键提供的所有信息\n*   对于给定的键集具有高负载因子（load factor）\n\n### 14.8 负载因子 (Load Factor)\n\
  \n非空哈希表的负载因子是表中存储的项目数除以表的大小。这是当我们重新哈希（rehash）或扩展现有的哈希表条目时使用的决策参数。这有助于我们确定哈希函数的效率。这意味着它告诉我们哈希函数是否在均匀地分布键。\n\
  \n![images](img/image01331.jpeg)\n\n### 14.9 冲突 (Collisions)\n\n哈希函数用于将每个键映射到不同的地址空间，但实际上无法创建这样的哈希函数，该问题被称为\
  \ `collision`（冲突）。冲突是两条记录存储在相同位置的情况。\n\n## 14.10 冲突解决技术\n\n寻找备用位置的过程称为 `collision\
  \ resolution`（冲突解决）。尽管哈希表存在冲突问题，但在许多情况下，它们比搜索树等所有其他数据结构更高效。有很多冲突解决技术，最流行的是直接链法（direct\
  \ chaining）和开放地址法（open addressing）。\n\n*   **直接链法 (Direct Chaining):** 链表数组的应用\n\
  \    *   分离链法（Separate chaining）\n*   **开放地址法 (Open Addressing):** 基于数组的实现\n   \
  \ *   线性探测（Linear probing，线性搜索）\n    *   二次探测（Quadratic probing，n 次非线性搜索）\n    *\
  \   双哈希（Double hashing，使用两个哈希函数）\n\n### 14.11 分离链法 (Separate Chaining)\n\n通过链法解决冲突是将链式表示与哈希表结合。当两条记录哈希到相同位置时，它们被插入到链表中。\n\
  \n![images](img/image0132.jpeg)\n\n### 14.12 开放地址法 (Open Addressing)\n\n在开放地址法中，所有的键都存储在表本身。这种方法也被封闭哈希（closed\
  \ hashing）。\n\n#### 线性探测 (Linear Probing)\n\n探测之间的间隔是固定的。在线性探测中，我们从原始哈希位置开始顺序搜索表。如果某个位置被占用，我们就检查下一个位置。\n\
  \n![images](img/image01331.jpeg)\n\n线性探测的问题之一是项目倾向于聚集在一起。簇可能会彼此靠近，合并成更大的簇并降低整体效率。\n\
  \n#### 二次探测 (Quadratic Probing)\n\n探测之间的间隔随哈希值成比例增加。如果使用二次探测，就可以消除聚集（Clustering）问题。在二次探测中，我们从原始哈希位置\
  \ `i` 开始。如果某个位置被占用，我们就检查位置 `i+1², i+2², i+3²...`。\n\n*示例*：假设表的大小为 11 (0..10)。哈希函数：`h(key)\
  \ = key mod 11`\n\n插入键：\n*   `31 mod 11 = 9`\n*   `19 mod 11 = 8`\n*   `2 mod 11\
  \ = 2`\n*   `13 mod 11 = 2` → `2 + 1² = 3`\n*   `25 mod 11 = 3` → `3 + 1² = 4`\n\
  *   `24 mod 11 = 2` → `2 + 1², 2 + 2² = 6`\n*   `21 mod 11 = 10`\n*   `9 mod 11\
  \ = 9` → `9 + 1², 9 + 2² mod 11, 9 + 3² mod 11 = 7`\n\n![images](img/image0134.jpeg)\n\
  \n尽管二次探测避免了聚集，但仍然可能聚集。聚集是由多个搜索键映射到同一个哈希键引起的。\n\n#### 双哈希 (Double Hashing)\n\n探测之间的间隔由另一个哈希函数计算。双哈希以更好的方式减少聚集。探测序列的增量通过使用第二个哈希函数计算。第二个哈希函数\
  \ `h2` 应该是：\n\n![images](img/image0135.jpeg)\n\n我们首先探测位置 `h1(key)`。如果该位置被占用，我们探测位置\
  \ `h1(key) + h2(key), h1(key) + 2 * h2(key), ..*.`\n\n\n\n\n\n哈希函数：假设 `h1(key) *=\
  \ key mod 11`且 `h2(key) = 7 - (key mod 7)`\n\n*插入键：*\n\n`58 mod 11 = 3`\n`14 mod\
  \ 11 = 3` → `3 + 7 = 10`\n`91 mod 11 = 3` → `3 + 7, 3 + 2*7 mod 11 = 6`\n`25 mod\
  \ 11 = 3` → `3 + 3, 3 + 2*3 = 9`\n\n![images](img/image01337.jpeg)\n\n### 14.13\
  \ 冲突解决技术的比较\n\n#### 比较：线性探测法 vs 双重哈希\n线性探测和双重哈希之间的选择取决于计算哈希函数的成本以及表的负载因子 `[每个槽的元素数量]`。两者使用的探测次数较少，但双重哈希花费的时间更多，因为对于长键需要哈希两个哈希函数进行比较。\n\
  \n#### 比较：开放寻址法 vs 链地址法\n这有些复杂，因为我们必须考虑内存使用。链地址法使用额外的内存来存储链。开放寻址法在表中隐式地需要额外的内存来终止探测序列。如果数据没有唯一的键，则无法使用开放寻址哈希表。替代方案是使用链地址哈希表。\n\
  \n#### 比较：开放寻址方法\n![images](img/image01338.jpeg)\n\n### 14.14 哈希如何获得 O(1) 复杂度\n\
  根据之前的讨论，人们会怀疑如果多个元素映射到同一个位置，哈希是如何获得 O(1) 复杂度的……\n\n这个问题的答案很简单。通过使用负载因子，我们确保每个数据块（例如链地址法中的链表）在平均上存储的元素最大数量小于`load\
  \ factor`。此外，在实际实践中，这个负载因子是一个常数（通常为 10 或 20）。因此，在 20 个元素或 10 个元素中进行搜索变成了常数级操作。\n\
  \n如果一个块中的平均元素数量大于负载因子，我们将使用更大的哈希表尺寸对元素进行重新哈希。我们需要记住的一点是，在决定重新哈希时，我们考虑平均占用率 `(哈希表中的元素总数除以表的大小)`。\n\
  \n表的访问时间取决于负载因子，而负载因子又取决于哈希函数。这是因为哈希函数将元素分布到哈希表中。因此，我们说哈希表平均提供了 O(1) 复杂度。此外，我们通常在搜索操作多于插入和删除操作的情况下使用哈希表。\n\
  \n### 14.15 哈希技术\n哈希技术有两种类型：静态哈希和动态哈希。\n\n#### 静态哈希\n如果数据是固定的，那么静态哈希是有用的。在静态哈希中，键集保持固定并预先给出，目录中的主页数量也保持固定。\n\
  \n#### 动态哈希\n如果数据不是固定的，静态哈希可能会性能很差，在这种情况下动态哈希是替代方案，在这种情况下键集可以动态变化。\n\n### 14.16\
  \ 哈希表不适用的问题\n- 需要数据排序的问题\n- 具有多维数据的问题\n- 前缀搜索，特别是当键很长且长度可一时\n- 具有动态数据的问题\n- 数据没有唯一键的问题\n\
  \n### 14.17 布隆过滤器\n布隆过滤器是一种概率数据结构，设计用于高效内存和时间上检查元素是否存在于集合中。它告诉我们，该元素要么确定`不在`集合中，要么`可能`在集合中。布隆过滤器的基础数据结构是`Bit\
  \ Vector`（位向量）。该算法由 Burton Bloom 在 1970 年发明，它依赖于使用多个不同的哈希函数。\n\n#### 它是如何工作的？\n\
  ![images](img/image01339.jpeg)\n\n既然位向量中的位已经为 `Element1` 和 `Element2` 设置，我们可以查询布隆过滤器告诉我们之前是否见过某个内容。对元素进行哈希处理，但这次不是设置位，而是进行检查；如果应该设置的位已经设置，布隆过滤器将返回真，表示该元素以前出现过。\n\
  \n布隆过滤器从初始化为零的位数组开始。为了存储一个数据值，我们只需应用 `k` 个不同的哈希函数，并将生成的 `k` 个值视为数组中的索引，并将 `k` 个数组元素中的每一个设置为\
  \ 1。我们对遇到的每个元素重复此操作。\n\n现在假设一个元素出现，我们想知道以前是否见过它。我们所的是应用 `k` 个哈希函数并查找指定的数组元素。如果其中任何一个为\
  \ 0，我们就可以 100% 确定我们从未遇到过该元素——如果遇到过，该位就会被设置为 1。然而，即使它们全部为 1，我们仍然无法得出见过该元素的结论，因为所有位都可能是通过应用到多个其他元素的\
  \ `k` 个哈希函数设置的。我们唯一能得出的结论是，我们`可能`遇到过该元素。\n\n注意，从布隆过滤器移除元素是不可能的。原因很简单，我们无法取消一个看起来属于某个元素的位，因为它也可能被另一个元素设置。\n\
  \n如果位数组大部分是空的（即设置为 0），且 `k` 个哈希函数是独立的，那么假误报（即：认为我们见过某项数据，但实际上没有）的概率就很低。随着位数组的填充，假误报的概率会缓慢增加。当然，当位数组满时，每个查询的元素都会被识别为见过。因此，显然我们可以用空间换取准确性，也可以用空间换取时间。\n\
  \n#### 元素\n从布隆过滤器中一次性移除元素可以使用一个包含已删除元素的第二个布隆过滤器来模拟。然而，第二个过滤器的假误报会变成复合过滤器的假阴性，这可能是不可接受的。在这种方法下，重新添加以前删除过的项目是不可能的，因为必须从`removed`过滤器中将其移除。\n\
  \n#### 选择哈希函数\n对于较大的 `k`，设计 `k` 个不同独立哈希函数可能是难以行的。对于具有宽输出的良好哈希函数，不同位域之间不应该有或没有相关性，因此这种类型的哈希可以通过将其输出切分成多个位域来生成多个不同的哈希函数。或者，可以将\
  \ `k` 个不同的初始值（如 0, 1, ..., `k-1`）传递给接受初始值的哈希函数——或将这些值添加到（或附加）键中。对于较大的 `m` 和/或 `k`，哈希函数之间的独立性可以降低，而假误报率的影响忽略不计。\n\
  \n#### 选择位向量的大小\n相比之下，一个错误率为 1%且具有最优 `k` 值的布隆过滤器每个元素只需要大约 9.6 位——无论元素的大小如何。这种优势部分源于其自数组的紧凑性，部分源于其概率性质。通过每个元素增加大约\
  \ 4.8 位，1% 的假误报率可以降低十倍。\n\n#### 空间优势\n\n\n\n\n尽管存在误报的风险，布隆过滤器在表示集合方面其空间优势远优于其他数据结构，例如自平衡二叉搜索树、字典树（tries）、哈希表，或者条目的简单数组或链表。这些结构中的大多数至少需要存储数据项本身，这可能需要从针对小整数的少量位到任意数量的位（例如字符串）不等（字典树是一个例外，因为它们可以在具有相同前缀的元素之间共享存储）。链式结构会因指针产生额外的线性空间开销。\n\
  \n然而，如果可能值的数量较少，且其中许多值都在集合中，那么布隆过滤器很容易被确定性位数组超越，后者每个潜在元素只需要 1 个位。\n\n#### 时间优势\n\
  布隆过滤器还具有一种不寻特性：添加项或检查某个项是否在集合中的所需的时间是一个固定的常数 `O(k)`，这完全取决于集合中已有的项数量。没有其他常空间集合数据结构具有这一属性，但稀疏哈希表的平均访问时间在实践中可能比某些布隆过滤器更快。然而，在硬件实现中，布隆过滤器表现优异，因为它的\
  \ `k` 次查找是独立的且可以并行化。\n\n## 实现\n请参见*问题章节*。\n\n### 14.18 哈希：问题与解答\n\n**问题-1** 实现一种分离链法冲突解决技术。同时，请讨论每个函数的时间复杂度。\n\
  \n**解答：** 为了创建一个给定大小（例如 `n`）的哈希表，我们分配一个包含 `n/L`（通常在 5 到 20 之间）个列表指针的数组，并初始化为 `NULL`。执行\
  \ `Search/Insert/Delete` 操作时，我们首先使用 `hashfunction` 根据给定的键计算表的索引，然后在该位置维护的线性列表中执行相应的操作。为了使键在哈希表上形成均匀分布，请将表的大小保持为质数。\n\
  \n![images](img/image01340.jpeg)\n![images](img/image01341.jpeg)\n![images](img/image01342.jpeg)\n\
  ![images](img/image01343.jpeg)\n\n```\nCreatHashTable - O(n). HashSearch - O(1)\
  \ average. Hashlnsert - O(1) average. HashDelete - O(1) average.\n```\n\n**问题-2**\
  \ 给定一个字符数组，给出一个删除重复项的算法。\n\n**解答：** 从第一个字符开始，使用简单的线性查找检查它是否出现在字符串的剩余部分。如果重复了，则将最后一个字符移到该位置，并将字符串长度减一。对给定字符串的每个不同字符重复此过程。\n\
  \n![images](img/image01344.jpeg)\n\n时间复杂度：`O(n²)`。空间复杂度：`O(1)`。\n\n**问题-3** 我们能找到其他以比\
  \ `O(n²)` 更好的时间解决此的方法吗？观察到解决方案中字符的顺序并不重要。\n\n**解答：** 使用排序将重复字符聚集在一起。最后扫描数组以移除相邻位置的重复项。\n\
  \n![images](img/image01345.jpeg)\n\n时间复杂度：`Θ(nlogn)`。空间复杂度：`O(1)`。\n\n**问题-4** 我们能对给定数组进行单次遍历来解决这个问题吗？\n\
  \n**解答：** 我们可以使用哈希表来检查给定字符串中的字符是否重复。如果当前字符不在哈希表中，则将其插入哈希表并同时保留给定字符串中的该字符。如果当前字符存在于哈希表中，则跳过该字符。\n\
  \n![images](img/image01346.jpeg)\n\n平均时间复杂度：`Θ(n)`。空间复杂度：`O(n)`。\n\n**问题-5** 给定两个无序数字数组，检查两个数组是否具有相同的数字集合？\n\
  \n**解答：** 假设两个给定数组为 `A` 和 `B`。解决该问题的简单方法是：对于 `A` 中的每个元素，检查该元素是否在 `B` 中。如果存在重复项，这种方法就会出现问题。例如，考虑以下输入：\n\
  \n![images](img/image01347.jpeg)\n\n上述算法给错误的结果，因为对于 `A` 中的每个元素，`B` 中也有一个对应的元素。但如果我们观察出现次数，它们是不相同的。我们可以通过将已经比较过的元素移动到列表末尾来解决这个问题。这意味着，如果我们在\
  \ `B` 中找到一个元素，就将该元素移动到 `B` 的末尾，在下次搜索时我们就找不到这些元素了。但这种方法的缺点是需要额外的交换。这种方法的时间复杂度为 `O(n²)`，因为对于\
  \ `A` 的每个元素我们都要扫描 `B`。\n\n**问题-6** 我们能改进问题-5 的时间复杂度吗？\n\n**解答：是的。** 为了改进时间复杂度，假设我们已经排序了两个列表。由于两个数组的大小都是\
  \ `n`，我们需要 `O(n log n)` 的时间进行排序。排序后，我们只需要用两个指针扫描两个数组，查看它们每次是否指向同一个元素，并不断移动指针直到到达数组末尾。\n\
  \n这种方法的时间复杂度为 `O(n log n)`。这是因为排序数组需要 `O(n log n)`。排序后，我们还需要 `O(n log n)`。\n\n**问题-7**\
  \ 我们能进一步改进问题-5 的时间复杂度吗？\n\n**解答：是的，** 为了改进时间复杂度，让我们使用哈希表。为此，请考虑以下算法。\n\n**算法：**\n\
  \n•使用 `A` 元素作为键构建哈希表。\n\n•在插入元素时，跟踪每个数字的频率。\n\n•构建 `A` 元素的哈希表后，现在扫描数组 `B`。\n\n•对于\
  \ `B` 元素的出现减少相应的计数器。\n\n•最后，检查所有计数器是否为零。\n\n•如果所有计数器为零，则数组相同，否则不同。\n\n时间复杂度：扫描数组为\
  \ `O(n)`。空间复杂度：哈希表为 `O(n)`。\n\n**问题-8** 给定一组数字对；如果存在 `(i,j)` 且存在 `pair(j,i)`，报告所有此类对。例如，在\
  \ `{{1,3},{2,6},{3,5},{7,4},{5,3},{8,7}}` 中，我们看到 `{3,5}` 和 `{5,3}` 存在。我们将此类对称为“对称对”。因此给出一个寻找所有此类对的高效算法。\n\
  \n**解答：** 通过哈希，我们只需一次扫描即可解决这个问题。考虑以下算法。\n\n**算法：**\n\n•逐个读取元素对并将其插入哈希表。对于每个对，将第一个元素作为键，第二个元素作为值。\n\
  \n•在插入元素时，检查当前对的第二个元素的哈希值是否与当前对的第一个数字相同。\n\n•如果相同，则说明存在对称对并输出该对。\n\n•否则，将该元素插入。这意味着，使用当前对的第一个数字作为键，第二个数字作为值并将它们插入哈希表。\n\
  \n•当我们完成对所有对的扫描时，已经输出了所有的对称对。\n\n时间复杂度：扫描数组为 `O(n)`。空间复杂度：哈希表为 `O(n)`。\n\n**问题-9**\
  \ 给定一个单链表，检查它内部是否存在环。\n\n**解答：使用哈希表**\n\n**算法：**\n\n•逐个遍历链表节点。\n\n•检查节点地址是否存在于哈希表中。\n\
  \n•如果它已经在哈希表中，则表明我们正在访问一个已经访问过的节点。这只有在给定的链表存在环时才可能。\n\n\n\n\n- 如果节点的地址不在哈希表中，则将该节点的地址插入哈希表中。\n\
  - 继续此过程，直到我们到达链表的末尾或找到循环。\n\n时间复杂度：扫描链表需要 `O(n)`。请注意，我们只对输入进行了扫描。空间复杂度：哈希表需要 `O(n)`。\n\
  \n**注意：** 为了获得高效的解决方案，请参阅“链表（Linked Lists）”章节。\n\n### Problem-10\n给定一个包含 101 个元素的数组。其中\
  \ 50 个元素是不同的，24 个元素重复了 2 次，有一个元素重复了 3 次。请在 `O(1)` 时间内找到重复 3 次的元素。\n\n#### 解决方案：使用哈希表\n\
  \n#### 算法：\n- 逐个扫描输入数组。\n- 检查该元素是否已经在哈希表中。\n- 如果已经在哈希表中，则增加其计数器值[这表示该元素出现的次数]。\n\
  - 如果元素不在哈希表中，则将该节点插入哈希表并将计数器设置为 1。\n- 继续此过程，直到到达数组末尾。\n\n时间复杂度：`O(n)`，因为我们进行了两次扫描。空间复杂度：哈希表需要\
  \ `O(n)`。\n\n**注意：** 为了获得高效的解决方案，请参阅“搜索（Searching）”章节。\n\n### Problem-11\n给定 `m`\
  \ 组包含 `n` 个元素的整数，提供一种算法找到出现在最多集合中的一个元素？\n\n#### 解决方案：使用哈希表\n\n#### 算法：\n- 逐个扫描输入集合。\n\
  - 对于每个元素，跟踪计数器。计数器表示其在所有集合中出现的频率。\n- 完成对所有集合的扫描后，选择计数器值最大的那个。\n\n时间复杂度：`O(mn)`，因为我们需要扫描所有的集合。空间复杂度：哈希表需要\
  \ `O(mn)`。因为在最坏的情况下，所有元素可能是不同的。\n\n### Problem-12\n给定两个集合 `A` 和 `B` 以及一个数字 `K`，提供一种算法来寻找是否存在一对元素（一个来自\
  \ `A`，一个来自 `B`），它们的和等于 `K`。\n\n#### 解决方案：为了简单起见，我们假设 `A` 的大小为 `m`，`B` 的大小为 `n`。\n\
  \n#### 算法：\n- 选择元素最少的集合。\n- 为选定的集合创建一个哈希表。我们可以将键和值设为相同。\n- 现在扫描第二个数组并检查 `(K-选定的元素)`\
  \ 是否存在哈希表中。\n- 如果存在，则返回这对元素。\n- 否则继续，直到到达集合的末尾。\n\n时间复杂度：`O(Max(m, n))`，因为我们进行了两次扫描。空间复杂度：哈希表需要\
  \ `O(Min(m, n))`。我们可以选择较小的集合来创建哈希表。\n\n### Problem-13\n提供一种算法，从给定字符串中删除另一个字符串中给出的字符？\n\
  \n#### 解决方案：为了简单起见，我们假设不同字符的最大数量为 256。首先我们创建一个初始化为 0 的辅助数组。扫描要删除的字符，对于这些字符中的每一个，我们将值设置为\
  \ 1，这表示我们需要删除该字符。\n\n初始化之后，扫描输入字符串，对于每个字符，检查该字符是否需要删除。如果标志位被设置，我们直接跳到下一个字符，否则我们在输入字符串中保留该字符。继续此过程，直到到达输入字符串的末尾。所有这些操作都可以如下所示原地进行。\n\
  \n![images](img/image01348.jpeg)\n\n时间复杂度：扫描待删除字符的时间 + 扫描输入数组的时间 = `O(n) + O(m)`\
  \ ≈ `O(n)`。其中 `m` 是待删除字符的长度，`n` 是输入字符串的长度。\n\n空间复杂度：`O(m)`，待删除字符的长度。但由于我们假设不同字符的最大数量为\
  \ 256，我们可以将其视为常数。但我们应该记住，当我们处理多字节字符时，不同字符的总数远多于 256。\n\n### Problem-14\n提供一种算法找到字符串中的第一个非重复字符。例如，字符串\
  \ `\"abzddab\"` 中的第一个非重复字符是 `'z'`。\n\n#### 解决方案：这个问题的解决方法是显而易见的。对于给定字符串中的每个字符，我们可以扫描剩余字符串，检查该字符是否出现在其中。如果它没有出现，我们就完成了解决方案并返回该字符。如果该字符出现在剩余字符串中，则处理下一个字符。\n\
  \n![images](img/image01349.jpeg)\n\n时间复杂度：`O(n²)`，对应两个 for 循环。空间复杂度：`O(1)`。\n\n\
  ### Problem-15\n我们可以改进时间复杂度 `0` 吗？\n\n#### 解决方案：可以。通过使用哈希表我们可以降低时间复杂度。通过读取输入字符串中的所有字符创建一个哈希表，并记录每个字符出现的次数。创建哈希表后，我们可以读取哈希表条目以查看哪个元素的计数等于\
  \ 1。这种方法占用 `O(n)` 空间，但也将时间复杂度降低到了 `O(n)`。\n\n![images](img/image1350.jpeg)\n\n时间复杂度：创建哈希表需要\
  \ `O(n)`，读取哈希表条目需要另一个 `O(n)`。空间复杂度：`O(n)`。\n\n### Problem-16\n给定一个字符串，提供一种算法找到字符串中的第一个重复字符？\n\
  \n#### 解决方案：该问题的解决方法与 `0` 相似。区别在于，与其扫描两次哈希表，我们只需要扫描一次。这是因为在插入哈希表时我们可以查看该元素是否已经存在。如果它已经存在，我们只需要返回该字符。\n\
  \n![images](img/image1351.jpeg)\n\n时间复杂度：创建哈希表需要 `O(n)`。注意此问题我们需要一次扫描。因此总时间为 `O(n)`。空间复杂度：`O(n)`。\n\
  \n### Problem-17\n给定一个包含 `n` 个数字的数组，创建一个算法显示和为 `S` 的所有对。\n\n#### 解决方案：这个问题类似于 `Problem-12`。但我们不使用两个集合，只使用一个集合。\n\
  \n#### 算法：\n- 逐个扫描数组的元素并创建一个哈希表。键和值可以相同。\n- 创建哈希表后，再次扫描输入数组并检查 `(S–选定的元素)` 是否存在哈希表中。\n\
  - 如果存在，则返回这对元素。\n- 否则继续并读取数组的所有元素。\n\n时间复杂度：创建哈希表需要 `O(n)`，读取哈希表条目需要另一个 `O(n)`。因此总时间为\
  \ `O(n) + O(n)` = `O(2n)` ≈ `O(n)`。空间复杂度：`O(n)` 用于存储计数值。\n\n### Problem-18\n是否有其他方法解决\
  \ `Problem-17`？\n\n#### 解决方案：有的。解决该问题的替代方案涉及排序。首先对输入数组进行排序。排序后，使用两个指针，一个在起始，另一个在结束。每次将两个索引的值相加，查看它们的和是否等于\
  \ `S`。如果相等，则打印该对。否则，如果和小于 S，则增加左指针；如果和大于-S，则减小右指针。\n\n时间复杂度：排序的时间 + 扫描的时间 = `O(nlogn)`\
  \ + `O(n)` ≈ `O(nlogn)`。\n\n空间复杂度：`O(1)`。\n\n### Problem-19\n我们有一个包含数百万行数据的文件。只有两行是相同的；其余都是唯一的。每行都非常长，以至于可能无法放入内存中。找到相同行的最有效解决方案是什么？\n\
  \n\n\n\n\n**解决方案：** 由于完整的一行可能无法放入主内存中，可以部分读取该行并从该部分计算哈希值。然后读取行的下一部分并计算哈希。这次在计算新的哈希值时，也使用之前的哈希值。继续此过程，直到找到完整行的哈希值。对每一行执行此操作，并将所有哈希值存储在文件中[或维护一个这些哈希值的哈希表]。如果在某一点获得了相同的哈希值，则部分读取对应的行进行比较。\n\
  \n**注意：** 相关问题请参考*搜索（Searching）*章节。\n\n**问题-20** 如果 `h` 是哈希函数并用于将 `n` 个键哈希到大小为 `s`\
  \ 的表中，其中 `n` <= `s`，涉及特定键 `X` 的期望冲突次数为：\n\n(A) 小于 1。\n\n(B) 小于 `n`。\n\n(C) 小于 `s`。\n\
  \n(D) 小于 ![images](img/image01352.jpeg)。\n\n**解决方案：** A。\n\n![images](img/image01353.jpeg)\n\
  \n## 15.1 引言\n\n为了理解字符串算法的重要性，让我们考虑在任何浏览器中（例如 Internet Explorer、Firefox 或 Google\
  \ Chrome）输入 URL（统一资源定位符）的情况。你会发现，在输入 URL 前缀后，会显示所有可能的 URL 列表。这意味着浏览器正在进行一些内部处理并向我们提供匹配\
  \ URL 的列表。这种技术有时被称为*自动补全（auto – completion）*。\n\n同样，考虑在命令行界面中输入目录名的情况（在 `Windows`\
  \ 和 `UNIX` 中均如此）。在输入目录名前缀后，如果我们按下 `tab` 键，就会获得所有可用匹配目录名的列表。这是自动补全的另一个例子。\n\n为了支持此类操作，我们需要一种能够高效存储字符串数据的数据结构。在本章中，我们将介绍实现字符串算法有用的数据结构。\n\
  \n我们从字符串的基本问题开始讨论：给定一个字符串，我们如何搜索子串（模式）？这被称为*字符串匹配*问题。在讨论了各种字符串匹配算法后，我们将查看用于存储字符串的数据结构。\n\
  \n### 15.2 字符串匹配算法\n\n在本节中，我们重点关注检查模式 `P` 是否是另一个字符串 `T`（T 代表文本）的子串。由于我们正尝试检查一个固定字符串\
  \ `P`，有时这些算法被称为*精确字符串匹配*算法。为了简化讨论，让我们假设给定文本 `T` 的长度为 `n`，我们尝试匹配的模式 `P` 的长度为 `m`。这意味着，`T`\
  \ 拥有从 0 到 `n–1` 的字符（`T[0...n–1]`），而 `P` 拥有从 0 到 `m–1` 的字符（`P[0...m–1]`）。该算法在 `C++`\
  \ 中被实现为 `strstr()`。\n\n在随后的章节中，我们将从暴力法开始，逐渐过渡到更好的算法。\n\n* 暴力法 (Brute Force Method)\n\
  * Rabin-Karp 字符串匹配算法\n* 基于有限自动机的字符串匹配\n* KMP 算法\n* Boyer-Moore 算法\n* 后缀树\n\n###\
  \ 15.3 暴力法\n\n在此种方法中，对于文本 `T` 中的每个可能位置，我们都检查模式 `P` 是否匹配。由于 `T` 的长度为 `n`，我们有 `n –\
  \ m + 1` 个可能的比较选择。这是因为我们不需要检查 `T` 的最后 `m – 1` 个位置，因为模式长度为 `m`。以下算法在文本字符串 `T` 中搜索模式字符串\
  \ `P` 的首次出现。\n\n**算法**\n\n![images](img/image01354.jpeg)\n\n时间复杂度：O((n – m + 1)\
  \ × m) ≈ O(n × m)。\n\n空间复杂度：O(1)。\n\n### 15.4 Rabin-Karp 字符串匹配算法\n\n在此种方法中，我们将使用哈希技术，不再检查\
  \ `T` 中的每个可能位置，而是只检查 `P` 的哈希值和 `T` 中 `m` 个字符的哈希值是否产生相同的结果。\n\n最初，对 `T` 的前 `m` 个字符应用哈希函数，并检查此结果与\
  \ `P` 的哈希结果是否相同。如果不相同，则移动到 `T` 的下一个字符，再次对 `m` 个字符应用哈希函数（从第二个字符开始）。如果相同，则我们将 `T`\
  \ 的这 `m` 个字符与 `P` 进行比较。\n\n#### 选择哈希函数\n\n在每一步中，由于我们正在寻找 `T` 的 `m` 个字符的哈希，我们需要一个高效的哈希函数。如果哈希函数在每一步中花费\
  \ O(m)复杂度，那么总复杂度就是 O(n × m)。这比暴力法糟糕，因为我们首先应用了哈希函数而且进行了比较。\n\n我们的目标是选择一个哈希函数，使其每次寻找\
  \ `T` 的 `m` 个字符的哈希时复杂度为 O(1)。只有这样才能降低算法的总复杂度。如果哈希函数不好（最坏情况），总复杂度为 O(n × m)。如果哈希函数良好，总复杂度为\
  \ O(n + m)。\n\n设 `h(i)` 为从 `i` 开始的长度为 `m` 的子串的哈希。我们可以在 O(1) 时间内从 `h(i)` 计算 `h(i+1)`：\n\
  \n```cpp\nh(i+1) = 10 * (h(i) - T[i] * 10^(m-1)) + T[i+m]\n```\n\n其中 `10^(m-1)`\
  \ 可以预先计算。\n\n### 15.5 有限自动机字符串匹配\n\n在此方法中，我们使用有限自动机，这是计算理论（ToC）中的概念。在看算法之前，让我们先看看有限自动机的定义。\n\
  \n#### 有限自动机\n\n有限自动机 F 是一个五元组 `(Q, q[0], A, ∑, δ)`，其中：\n\n* Q 是状态的有限集\n* q[0] ∈\
  \ Q 是起始状态\n* A ⊆ Q 是接受状态集\n* ∑ 是有限输入字母表\n* δ 是转移函数，它为给定的当前状态和输入提供下一个状态\n\n#### 有限自动机是如何工作的？\n\
  \n* 有限自动机 F 从状态 q[0] 开始\n* 一次一次从 ∑ 中读取字符\n* 如果 F 处于状态 q 且读取输入字符 a，则 F 移动到状态 δ(q,a)\n\
  * 在结束时，如果它的状态在 A 中，则我们说，F 接受了目前为止读取的输入字符串\n* 如果输入字符串未被接受，则它被称为拒绝字符串\n\n\n\n\n\n\
  示例：假设 `Q = {0,1}`，`q[0] = 0`，`A = {1}`，`∑ = {a, b}`。`δ(q,a)` 如转移表/图所示。它接受以奇数个数 `a`\
  \ 结尾的字符串；例如，`abbaaa` 被接受，而 `aa` 被拒绝。\n\n![images](img/image01359.jpeg)\n\n## 构建有限自动机的重要注意事项\n\
  \n构建自动机时，我们首先从初始状态开始。如果匹配了模式中的 `k` 个字符，有限自动机（FA）将处于状态 `k`。如果下一个文本字符等于模式字符 `c`，则我们匹配了\
  \ `k + 1` 个字符，FA 进入状态 `k + 1`。如果下一个文本字符不等于模式字符，则 FA 跳到状态 `0,1,2,....or k*`，这取决于有多少个初始模式字符与以\
  \ `c` 结尾的文本字符匹配。\n\n## 匹配算法\n\n现在，让我们关注匹配算法。\n\n- 对于给定的模式 `P[0.. m – 1]`，首先我们需要构建一个有限自动机\
  \ `F`\n  - 状态集为 `Q = {0,1,2, ...,m*}`\n  - 起始状态为 0\n  - 唯一的接受状态是 `m`\n  - 如果 `∑`\
  \ 很大，构建 `F` 的时间可能很大\n- 扫描文本字符串 `T[0.. n – 1]` 以找到模式 `P[0.. m – 1]` 的所有出现\n- 字符串匹配是高效的：`Θ(n)`\n\
  \  - 每个字符被精确检查一次\n  - 每个字符的操作是常数时间\n  - 但计算 `δ`（转移函数）的时间为 `O(m|∑|)` —— 这是因为 `δ`\
  \ 有 `O(m|∑|)` 个条目。假设 `|∑|` 是常数，则复杂度变为 `O(m)`。\n\n**算法：**\n\n![images](img/image01360.jpeg)\n\
  \n时间复杂度：`O(m)`。\n\n## 15.6 KMP 算法\n\n如之前，假设 `T` 是要搜索的字符串，`P` 是要匹配的模式。该算法由 Knuth、Morris\
  \ 和 Pratt 提出。搜索模式的时间复杂度为 `O(n)`。为了获得 `O(n)` 时间复杂度，它避免了与 `T` 中之前参与过模式 `P` 某些元素比较的元素再次比较。\n\
  \n该算法使用一张表，我们通常称之为`前缀函数`或`前缀表`或`失败函数` `F`。首先我们来查看如何填充这张表，然后查看如何使用该表搜索模式。模式的前缀函数\
  \ `F` 存储了关于模式如何与其自身偏移匹配的知识。这些信息可以避免模式 `P` 的无用位移。这意味着该表可以避免在字符串 `T` 上回溯。\n\n####\
  \ 前缀表\n\n![images](img/image01361.jpeg)\n\n作为一个示例，假设 `P = a b a b a c a`。对于这个模式，让我们按照步骤说明填充前缀表\
  \ `F`。初始状态：`m = length[P] = 7`，`F[0] = 0` 且 `F[1] = 0`。\n\n**步骤 1：** `i = 1, j =\
  \ 0, F[1] = 0`\n\n![images](img/image01362.jpeg)\n\n**步骤 2：** `i = 2, j = 0, F[2]\
  \ = 1`\n\n![images](img/image01363.jpeg)\n\n**步骤 3：** `i = 3, j = 1, F[3] = 2`\n\
  \n![images](img/image01364.jpeg)\n\n**步骤 4：** `i = 4, j = 2, F[4] = 3`\n\n![images](img/image01365.jpeg)\n\
  \n**步骤 5：** `i = 5, j = 3, F[5] = 1`\n\n![images](img/image01366.jpeg)\n\n**步骤 6：**\
  \ `i = 6, j = 1, F[6] = 1`\n\n在这一步，前缀表的填充完成。\n\n### 匹配算法\n\nKMP 算法以模式 `P`、字符串 `T`\
  \ 和前缀函数 `F` 作为输入，并在 `T` 中找到 `P` 的匹配。\n\n![images](img/image01368.jpeg)\n\n时间复杂度：`O(m\
  \ + n)`，其中 `m` 是模式的长度，`n` 是要搜索文本的长度。\n\n空间复杂度：`O(m)`。\n\n现在，为了理解这个过程，让我们通过一个示例。假设\
  \ `T = b a c b a b a b a b a c a c a` & `P = a b a b a c a`。由于我们已经填充了前缀表，让我们使用它进入匹配算法。初始状态：`n\
  \ = T 的大小 = 15; m = P 的大小 = 7`。\n\n**步骤 1：** `i = 0, j = 0`，比较 `P[0]` 和 `T[0]`。`P[0]`\
  \ 不匹配 `T[0]`。`P` 向右平移一位。\n\n![images](img/image01369.jpeg)\n\n**步骤 2：** `i = 1,\
  \ j = 0`，比较 `P[0]` 与 `T[1]`。`P[0]` 匹配 `T[1]`。由于匹配，`P` 不平移。\n\n![images](img/image01370.jpeg)\n\
  \n**步骤 3：** `i = 2, j = 1`，比较 `P[1]` 与 `T[2]`。`P[1]` 不匹配 `T[2]`。在 `P` 上回溯，比较 `P[0]`\
  \ 和 `T[2]`。\n\n![images](img/image01371.jpeg)\n\n**步骤 4：** `i = 3, j = 0`，比较 `P[0]`\
  \ 与 `T[3]`。`P[0]` 不匹配 `T[3]`。\n\n![images](img/image01372.jpeg)\n\n**步骤 5：** `i\
  \ = 4, j = 0`，比较 `P[0]` 与 `T[4]`。`P[0]` 匹配 `T[4]`。\n\n![images](img/image01373.jpeg)\n\
  \n**步骤 6：** `i = 5, j = 1`，比较 `P[1]` 与 `T[5]`。`P[1]` 匹配 `T[5]`。\n\n![images](img/image01374.jpeg)\n\
  \n**步骤 7：** `i = 6, j = 2`，比较 `P[2]` 与 `T[6]`。`P[2]` 匹配 `T[6]`。\n\n![images](img/image01375.jpeg)\n\
  \n**步骤 8：** `i = 7, j = 3`，比较 `P[3]` 与 `T[7]`。`P[3]` 匹配 `T[7]`。\n\n![images](img/image01376.jpeg)\n\
  \n**步骤 9：** `i = 8, j = 4`，比较 `P[4]` 与 `T[8]`。`P[4]` 匹配 `T[8]`。\n\n![images](img/image01377.jpeg)\n\
  \n**步骤 10：** `i = 9, j = 5`，比较 `P[5]` 与 `T[9]`。`P[5]` 不匹配 `T[9]`。在 `P` 上回溯，因为 `F[4]\
  \ = 3`，比较 `P[4]` 与 `T[9]`。\n\n![images](img/image01378.jpeg)\n\n![images](img/image01379.jpeg)\n\
  \n**步骤 11：** `i = 10, j = 4`，比较 `P[4]` 与 `T[10]`。`P[4]` 匹配 `T[10]`。\n\n![images](img/image01380.jpeg)\n\
  \n**步骤 12：** `i = 11, j = 5`，比较 `P[5]` 与 `T[11]`。`P[5]` 匹配 `T[11]`。\n\n![images](img/image01381.jpeg)\n\
  \n**步骤 13：** `i = 12, j = 6`，比较 `P[6]` 与 `T[12]`。`P[6]` 匹配 `T[12]`。\n\n![images](img/image01382.jpeg)\n\
  \n发现模式 `P` 在字符串 `T` 中完全出现。找到匹配的总位移次数为：`i – m = 13 – 7 = 6` 次。\n\n**备注：**\n\n- KMP\
  \ 从左到右进行比较\n- KMP 算法需要预处理（前缀函数），需要 `O(m)` 的空间和时间复杂度\n- 搜索复杂度为 `O(n + m)`（不取决于字母表大小）\n\
  \n### 15.7 Boyer-Moore 算法\n\n与 KMP 算法一样，它也进行预处理，我们称之为`last 函数`。该算法从右侧开始向左扫描模式字符。在测试模式\
  \ `P` 在 `T` 中的可能位置时，不匹配的处理如下：假设当前匹配的字符为 `T[i] = c`，对应的模式字符为 `P[j]`。如果 `c` 不包含在 `P`\
  \ 中，则将模式 `P` 完全移过 `T[i]`。否则，平移 `P` 直到 `P` 中字符 `c` 的出现位置与 `T[i]` 对齐。这种技术通过相对于文本平移模式来避免无用的比较。\n\
  \n`last` 函数需要 `O(m + |∑|)` 时间，实际搜索需要 `O(nm)` 时间。因此，Boyer-Moore 算法的最坏情况运行时间为 `O(nm\
  \ + |∑|)`。这意味着在 `n == m` 的情况下，最坏运行时间是二次的，与暴力破解算法相同。\n\n- Boyer-Moore 算法在大字母表（相对于模式长度）上非常快。\n\
  - 对于小字母表，Boyer-Moore 不是优选。\n- 对于二进制字符串，推荐 KMP 算法。\n- 对于极短的模式，暴力破解算法更好。\n\n## 15.8\
  \ 用于存储字符串的数据结构\n\n如果我们有一组字符串（例如字典中的所有单词）以及我们想要在该集合搜索的单词，为了更快地执行搜索操作，我们需要一种高效的存储字符串的方法。为了存储字符串集，可以使用以下任何数据结构：\n\
  \n- 哈希表\n\n- 二叉搜索树\n\n- 字典（Trie）\n\n- 三元搜索树\n\n## 15.9 字符串哈希表\n\n\n\n\n\n正如在 `Hashing`\
  \ 章节中所所示，我们可以使用哈希表来存储整数或字符串。在这种情况下，键仅仅是字符串。哈希表实现的问题在于我们丢失了顺序信息——在应用哈希函数之后，我们并不知道它将映射到哪里。结果是某些查询需要更长的时间。例如，要找到所有以字母\
  \ `“K” 开头的单词，使用哈希表表示我们需要扫描整个哈希表。这是因为哈希函数获取了完整的键并对其进行哈希处理，而我们不知道每个单词的位置。\n\n## 15.10\
  \ 用于字符串的二叉搜索树\n\n在这种表示法中，每个节点都用于按字母顺序对字符串进行排序。这是因为字符串具有自然顺序：`A` 在 `B` 之前，`B` 在 `C`\
  \ 之前，以此此类推。这是因为单词可以排序，我们可以使用二叉搜索树（`BST`）来存储和检索它们。例如，假设我们要使用 `BST` 存储以下字符串：\n\n*this\
  \ is a career monk string*\n\n对于定的字符串，有很多方法可以在 `BST` 中表示它们。其中一种可能性如下树所示。\n\n![images](img/image0138.jpeg)\n\
  \n### 二叉搜索树表示的问题\n\n这种方法在存储效率方面表现良好。但这种表示法的缺点是，在每个节点处，搜索操作都会将给定的键与节点数据进行完全匹配，导致搜索操作的时间复杂度增加。因此，我们可以说，字符串的\
  \ `BST` 表示在存储上是很好的，但在时间上并不理想。\n\n### 15.11 字典树 (Tries)\n\n现在，让我们看看另一种减少搜索操作时间复杂度的表示法。`trie`get\
  \ 名字来源于单词 `re”trie”。\n\n#### 什么是字典树？\n\n`trie` 是一棵树，其中每个节点包含的指针数量等于字母表中的字符数量。例如，假设所有字符串都是由英文字母字符\
  \ `“a”到“z”` 组成的，那么 `trie` 的每个节点就包含 26 个指针。假设我们要存储字符串 `“a”、“all”、“als”和“as”`：这些字符串的\
  \ `trie` 看起来如下：\n\n![images](img/image01384.jpeg)\n\n### 为什么用字典树？\n\n字典树可以在 `O(L)`\
  \ 时间内（`L` 代表单个单词的长度）插入和查找字符串。这比哈希表和二叉搜索树表示法快得多。\n\n### 字典树节点声明\n\n`TRIE` 数据结构的基本元素\
  \ - `TrieNode` 如下：\n\n![images](img/image01385.jpeg)\n\n`TRIE` ADT 的节点结构具有 `data\
  \ (char)`、`is_End_Of_String (boolean)` 和一组子节点（`Collection of TrieNode`）。它还有一个一个名为\
  \ `subNode(char)` 的方法。该方法接受一个字符作为参数，如果存在该字符类型的子节点，则返回该子节点。\n\n![images](img/image01386.jpeg)\n\
  \n#### 字典树声明\n\n现在我们已经定义了 `TrieNode`，让我们来看看 `TRIE` 的其他操作。幸运的是，`TRIE` 数据结构实现起来简单，因为它有两个主要方法：`insert()`\
  \ 和 `search()`。让我们看看这两个方法的初步实现。\n\n![images](img/image01387.jpeg)\n\n### 在字典树中插入字符串\n\
  \n要插入一个字符串，我们只需要从根节点开始并遵循相应的路径（从根开始的路径表示给定字符串的前缀）。一旦我们到达 `NULL` 指针，我们只需要为给定字符串的剩余字符创建一个尾部节点链。任何插入操作理想情况下都遵循以下算法。\n\
  \n1) 如果输入字符串长度为零，则将根节点的标记置为 true。\n2) 如果输入字符串长度大于零，则对每个字符重复第 3 和第 4 步。\n3) 如果字符存在于节点的子节点中，将当前节点指向该子节点。\n\
  4) 如果字符不存在于当前子节点中，则插入新节点并将当前节点设置为该新插入的节点。\n5) 当到达末尾字符时，将标记标志置为 true。\n\n时间复杂度：`O(L)`，其中\
  \ `L` 是要插入字符串的长度。\n\n**注意：** 对于实际的字典实现，我们可能还需要更多检查，例如检查给定的字符串是否已在字典中。\n\n### 在字典树中搜索字符串\n\
  \n搜索操作的情况也是如此：我们只需要从根开始并遵循指针。搜索操作的时间复杂度等于要搜索的给定字符串的长度。\n\n1) 对于字符串中的每个字符，查看是否存在以该字符为内容的子节点。\n\
  2) 如果该字符不存在，返回 false。\n3) 如果该字符存在，重复第 1 步。\n4) 重复上述步骤直到到达字符串末尾。\n5) 当到达字符串结束且当前\
  \ `Node` 的标记被设置为 true 时，返回 true，否则返回 false。\n\n时间复杂度：`O(1)`，其中 `L` 是要搜索字符串的长度。\n\
  \n### 字典树表示的问题\n\n字典树的主要缺点是它们存储字符串需要大量内存。正如我们上面看到的，对于每个节点，我们有太多的节点指针。很多情况下，每个节点的占用很大。关于字典结构的最终结论是，它们更快但需要巨大的内存。\n\
  \n**注意：** 有一些改进的字典树称为 `字典压缩技术`。但即使使用这些技术，我们也只能减少叶子节点的内存而非内部节点。\n\n## 15.12 三元搜索树\
  \ (TST)\n\n这种表示法最初由 Jon Bentley 和 Sedgewick 提出。三元搜索树结合了二叉搜索树和字典树的优点。这意味着它结合了二叉搜索树的内存效率和字典树的时间效率。\n\
  \n### 三元搜索树声明\n\n![images](img/image01388.jpeg)\n\n三元搜索树（TST）使用三个指针：\n\n- `left`\
  \ 指针指向小于 `data` 的 TST。\n- `right` 指针指向大于 `data` 的 TST。\n- `eq` 指针指向等于 `data` 的字符串。这意味着，如果我们搜索一个字符串，且字符串的当前字符与节点的\
  \ `data` 相同，我们需要在 `eq` 指向的子树中处理字符串的下一个字符。\n\n### 在三元搜索树中插入字符串\n\n为了简单，假设要在 TST 中存储以下单词（同样假设相同的顺序）：*boats,\
  \ boat, bat 和 *bats*。最初，让我们从 `boats` 字符串开始。\n\n![images](img/image01389.jpeg)\n\n\
  现在如果我们想插入字符串 `boat`，那么 TST 将[唯一的更改是将“t”节点的 `is_End_Of_String` 标记设置为 1]：\n\n![images](img/image01390.jpeg)\n\
  \n现在，让我们插入下一个字符串：`bat`\n\n![images](img/image01391.jpeg)\n\n现在，让我们插入最后一个单词：`bats`\n\
  \n![images](img/image01392.jpeg)\n\n基于这些示例，我们可以写出插入算法。我们将结合二叉搜索树和字典树的插入操作。\n\n![images](img/image01393.jpeg)\n\
  \n时间复杂度：`O(L)`，其中 `L` 是要插入字符串的长度。\n\n### 在三元搜索树中搜索\n\n如果在插入单词后我们要搜索它们，那么必须遵循与二叉搜索相同的规则。唯一的区别是，在匹配的情况下，我们应该检查剩余字符（在\
  \ `eq` 子树中），而不是直接返回。\n\n![images](img/image01394.jpeg)\n\n\n\n时间复杂度：`O(L)`，其中 `L`\
  \ 是待搜索字符串的长度。\n\n### 显示三元搜索树（TST）的所有单词\n\n如果我们想打印 TST 的所有字符串，可以使用以下算法。如果我们想按照排序顺序打印它们，我们需要遵循\
  \ TST 的中序遍历。\n\n![images](img/image01395.jpeg)\n\n### 查找 TST 中最大单词的长度\n\n这类似于查找二叉搜索树（BST）的高度，可以通过方式找到：\n\
  \n![images](img/image01396.jpeg)\n\n### 15.13 比较 BST、Trie 和 TST\n\n- 哈希表和 BST 实现在每个节点存储完整的字符串。因此，它们搜索需要更多时间。但它们内存效率较高。\n\
  - TST 可以动态增长和收缩，而哈希表仅根据负载因子进行重调整。\n- TST 支持部分搜索，而 BST 和哈希表不支持。\n- TST 可以按排序顺序显示单词，但在哈希表中无法获得排序顺序。\n\
  - 字典树（Tries）执行搜索操作非常快，但存储字符串需要巨大的内存。\n- TST 结合了 BST 和 Trie 的优点。这意味着它们结合了 BST 的内存效率和\
  \ Trie 的时间效率。\n\n### 15.14 后缀树\n\n后缀树是字符串的重要数据结构。通过后缀树，我们可以非常快地回答查询但这但这一些预处理和后缀树的构建。尽管后缀树的构建很复杂，但它可以在线性时间内解决许多与其他字符串相关的问题。\n\
  \n**注意：** 后缀树针对一个字符串使用树（后缀树），而哈希表、BST、Trie 和 TST 存储一组字符串。这意味着，后缀树回答与单个字符串相关的查询。\n\
  \n让我们来看用于这种表示法的术语。\n\n#### 前缀和后缀\n\n给定字符串 `T = T[1]T[2] … T[n]`，`T` 的`前缀`是字符串 `T[1]\
  \ ...T[i]`，其中 `i` 取值可以从 1 到 `n`。例如，如果 `T = banana`，那么 `T` 的前缀为：`b, ba, ban, bana,\
  \ banan, banana`。\n\n同样，给定字符串 `T = T[1]T[2] … T[n]`，`T` 的`后缀`是字符串 `T[i] ...T[n]`，其中\
  \ `i` 取值可以从 `n` 到 1。例如，如果 `T = banana`，那么 `T` 的后缀为：`a, na, ana, nana, anana, banana`。\n\
  \n#### 观察\n\n从上面的示例中很容易看出，对于给定的文本 `T` 和模式 `P`，精确字符串匹配问题也可以定义为：\n\n- 找到 `T` 的一个后缀，使得\
  \ `P` 是该后缀的前缀*或*\n- 找到 `T` 的一个前缀，使得 `P` 是该前缀的后缀。\n\n**示例：** 待搜索文本为 `T = acebkkbac`，模式为\
  \ `P = kkb`。在这个例子中，`P` 是后缀 `kkbac` 的前缀，也是前缀 `acebkkb` 的后缀。\n\n#### 什么是后缀树？\n\n简单来说，文本\
  \ `T` 的后缀树是一种类似于 Trie 的数据结构，表示 `T` 的所有后缀。后缀树的定义可以给出：对于长度为 `n` 的字符字符串 `T[1 ...n]`，后缀树是一个具有以下属性的根树。\n\
  \n- 后缀树包含 `n` 个叶子节点，编号从 1 到 `n`。\n- 每个内部节点（根节点除）应至少有 2 个孩子。\n- 树中的每条边都由 `T` 的非空子字符串标记。\n\
  - 节点的任意两条边（子节点边）不会以相同的字符开头。\n- 从根到叶子节点的路径表示 `T` 的所有后缀。\n\n### 后缀树的构建\n\n### 算法\n\
  \n1. 令 `S` 为 `T` 的所有后缀的集合。在每个后缀后面添加 `$`。\n2. 根据第一个字符对 `S` 中的后缀进行排序。\n3. 对于每一组 `S[c]`：\
  \ \n   (i) 如果 `S[c]` 组只有一个元素。\n   (ii) 否则，找到 `S[c]` 组中后缀的最长公缀，创建一个内部节点，并递归地继续步骤\
  \ 2，此时 `S` 是从 `S[c]` 中分离出最长公缀后剩余的后缀集合。\n\n为了更好地理解，让我们通过一个例子。假设给定文本为 `T = tatat`。对于这个字符串，给每个后缀一个编号。\n\
  \n| 索引 | 后缀 |\n| :--- | :--- |\n| 1 | $ |\n| 2 | $t$ |\n| 3 | $at$ |\n| 4 | $tat$\
  \ |\n| 5 | $atat$ |\n| 6 | $tatat$ |\n\n现在，根据初始字符对后缀进行排序。\n\n![images](img/image01397.jpeg)\n\
  \n在三组中，第一组只有一个元素。因此，根据算法，为它创建一个叶子节点，如下：\n\n![images](img/image01398.jpeg)\n\n\n\n\
  \n### 解决方案：\n对于这个问题，我们可以结合优先级队列（priority queues）和字典树（tries）。我们首先创建一个字典树，在单词出现时插入它，并在字典树的每个叶子节点上，该节点包含该单词以及一个指向堆（`priority\
  \ queue`）中节点的指针，我们也创建这个堆。这个堆中的节点结构包含一个 `counter`（计数器）。它是该单词的频率，也是指向字典树叶子节点的指针，该叶子包含该单词，这样就不需要存储两次单词。\n\
  \n每当新单词出现时，我们在字典树中查找它。如果它已经存在，我们就增加堆中对应该单词的节点频率，并调用 `heapify`（堆化）。这样做是为了确保在任何时候都能获取频率最高的单词。在滚动处理时，当一个单词超出范围时，我们减小堆中的计数器。如果新频率仍大于零，则对堆进行\
  \ `heapify` 以包含修改。如果新频率为零，则从堆中删除该节点并从字典树中删除它。\n\n## Problem-2\n给定两个字符串，如何找到它们的最长公共子串？\n\
  \n### 解决方案：\n假设给两个字符串为 `T[1]` 和 `T[2]`。两个字符串 `T[1]` 和 `T[2]` 的最长公共子串可以通过为 `T[1]`\
  \ 和 `T[2]` 构建一个通用后缀树来找到。这意味着我们需要为这两个字符串构建一个单一的后缀树。每个节点都被标记，以表示它代表 `T[1]` 的后缀、`T[2]`\
  \ 的后缀还是两者。这表明我们需要为两个字符串使用不同的标记符号（例如，我们可以对第一个字符串使用 `$`，对第二个使用 `#`）。在构建完通用后缀树后，标记为\
  \ `T[1]` 和 `T[2]` 的最深节点即为最长公共子串。\n\n**另一种方法是：** 我们可以为字符串 `T[1]$T[2]#` 构建一个后缀树。这等于为这两个字符串构建一个通用后缀树。\n\
  \n时间复杂度：`O(m + n)`，其中 `m` 和 `n` 是输入字符串 `T[1]` 和 `T[2]` 的长度。\n\n## Problem-3: 最长回文\n\
  给定一个文本 `T`，我们如何找到 `T` 中是 `T` 的最长回文的子串？\n\n### 解决方案：\n`T[1..n]` 的最长回文可以在 `O(n)` 时间内找到。算法是：首先为\
  \ `T$reverse(T)#` 构建后缀树，或者为 `T` 和 `reverse(T)` 构建通用后缀树。构建完后缀树后，找到同时标记有 `$` 和 `#`\
  \ 的最深节点。基本上意味着找到最长公共子串。\n\n## Problem-4\n给定一个字符串（单词），提供一个寻找字典中下一个单词的算法。\n\n### 解决方案：\n\
  假设我们使用 `Trie` 来存储字典单词。要在 `Tries` 中找到下一个单词，我们可以按照所示的简单方法。从最右边的字符开始，逐个增加字符。一旦到达 `Z`，移动到左侧的下一个字符。\n\
  \n每当我们增加时，检查带有增加字符的单词是否存在于字典中。如果存在，则返回该单词，否则再次增加。如果我们使用 `TST`（树搜索树），则我们可以找到当前单词的中序后继。\n\
  \n## Problem-5\n提供一个反转字符串的算法。\n\n### 解决方案：\n![images](img/image01406.jpeg)\n\n时间复杂度：`O(n)`，其中\
