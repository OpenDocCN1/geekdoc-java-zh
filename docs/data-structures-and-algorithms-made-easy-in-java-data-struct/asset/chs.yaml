  \n![Image](img/image00840.jpeg)\n\n因此，以下组合可以唯一确定树：\n* 中序和前序\n* 中序和后序\n* 中序和层序\n\n\
  以下组合无法唯一确定树：\n* 前序和后序\n* 前序和层序\n* 后序和层序\n\n例如，即使给定了三个（前序 `Preorder`、层序 `Level-order`\
  \ 和后序 `Postorder`），也是无法构造的。\n\n### Problem-32\n给出一个打印二叉树中节点所有祖先的算法。对于下面的树，节点 7 的祖先是\
