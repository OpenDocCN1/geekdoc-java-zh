  \n为了区分根节点，假设它的父节点与数组中的元素相同。基于这种表示法，`MAKESET`、`FIND`、`UNION` 操作定义为：\n\n* `(X)`：创建一个包含单个元素\
  \ `X` 的新集合，并在数组中更新 `X` 的父节点为 `X`。这意味着 `X` 的根（集合名称）是 `X`。\n\n![images](img/image01044.jpeg)\n\
