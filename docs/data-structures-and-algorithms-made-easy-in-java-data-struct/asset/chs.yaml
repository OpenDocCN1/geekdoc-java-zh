  \ 问题-31：游戏最优策略\n\n考虑一行 `n` 个硬币，值为 `v[1] ... v[n]`，其中 `n` 为偶数（因为这是一个两人游戏）。我们与对手进行这个游戏。在每轮中，玩家从行中选择第一个或最后一个硬币，将其从行中移除并获得硬币的值。确定如果我们先手，我们可能赢得的最大金额。\n\
  \n### 解决方案\n让我们使用动态规划（DP）技术解决这个问题。在每轮中，由我们或对手从行的末端选择硬币。我们将子问题定义为：\n\n![images](img/image01613.jpeg)\n\
  \n`V(i,j)`：如果是我们的回合且剩余硬币为 `v[i] ... v[j]`，我们可能一定赢得的最大值。\n\n**基础情况：** 对于所有的 `i` 值，`V(i,i)`\
  \ 和 `V(i, i + 1)`。\n\n从这些值开始，我们可以计算 `V(i, i + 2)`、`V(i,i + 3)` 等。现在我们为每个子问题定义 `V(i,j)`：\n\
  \n![images](img/image01614.jpeg)\n\n在递归调用中，我们关注从 `i^(th)` 硬币到 `j^(th)` 硬币。\n\n\n\
  \n\n### 解决方案\n\n在进入解决方案之前，让我们考虑将字符串 `A` 转换为 `B` 的可能操作。\n\n* 如果 `m > n`，我们需要删除 `A`\
  \ 中的某些字符\n* 如果 `m == n`，我们可能需要转换 `A` 中的某些字符\n* 如果 `m < n`，我们需要从 `A` 中删除某些字符\n\n\
  因此，我们需要的操作包括插入字符、替换字符和删除字符，它们对应的成本代码定义如下。\n\n### 操作成本：\n\n| 插入字符 | `c[i]` |\n| :---\
  \ | :--- |\n| 替换字符 | `c[r]` |\n| 删除字符 | `c[d]` |\n\n现在让我们专注于问题的递归公式化。设 `T(i,j)`\
  \ 表示将 `A` 的前 `i` 个字符转换为 `B` 的前 `j` 个字符所需的最小成本。这意味着 `A[1...i]` 转换为 `B[1...j]`。\n\n\
  ![images](img/image01619.jpeg)\n\n根据上述讨论，我们有以下几种情况：\n\n* 如果我们从 `A` 中删除第 `i^(th)`\
  \ 个字符，那么我们必须将 `A` 剩余的 `i – 1` 个字符转换为 `B` 的 `j` 个字符\n* 如果我们在 `A` 中插入第 `i^(th)` 个字符，那么将\
  \ `A` 的这 `i` 个字符转换为 `B` 的 `j – 1` 个字符\n* 如果 `A[i] == B[j]`，那么我们必须将 `A` 剩余的 `i –\
  \ 1` 个字符转换为 `B` 的 `j – 1` 个字符\n* 如果 `A[i] ≠ B[j]`，那么我们必须将 `A` 的第 `i^(th)` 个字符替换为\
  \ `B` 的第 `j^(th)` 个字符，并将 `A` 剩余的 `i – 1` 个字符转换为 `B` 的 `j – 1` 个字符\n\n在计算所有可能性后，我们需要选择成本最低的一个。\n\
  \n### 有多少子问题？\n\n在上述公式中，`i` 的范围从 1 到 `m`，`j` 的范围从 1 到 `n`。这产生了 `mn` 个子问题，每个子问题花费\
  \ O(l) 时间，时间复杂度为 O(*mn*)。空间复杂度为 O(*mn*)，其中 `m` 是给定矩阵的行数，`n` 是列数。\n\n![images](img/image01620.jpeg)\n\
  \n## 问题-34：最长回文子序列\n\n如果一个序列从左到右读或从右到左读都相同，则它就是一个回文。例如 `A, C, G, G, G, G,C,A`。给定一个长度为\
  \ `n` 的序列，设计一个算法输出最长回文子序列的长度。例如，字符串 `A,G,C,T,C,B,M,A,A,C,T,G,G,A,M` 有许多许多回文子序列，例如：`A,G,T,C,M,C,T,G,A`\
  \ 的长度为 9。\n\n### 解决方案\n\n让我们使用动态规划（DP）来解决这个问题。如果我们观察字符串 `A` 的子字符串 `A[i,..,j]`，那么如果\
  \ `A[i] == A[j]`，我们可以找到一个长度至少为 2 的回文序列。如果它们不同，则我们必须在子序列 `A[i + 1,..., j]` 和 `A[i,...,\
  \ j – 1]` 中寻找最大长度的回文。\n\n此外，每个字符 `A[i]` 都是长度为 1 的回文。因此，边界情况由 `A[i, i] = 1` 给出。我们将子字符串\
  \ `A[i,...,j]` 的最大长度回文定义为 `L(i,j)`。\n\n![images](img/image01621.jpeg)\n\n![images](img/image01622.jpeg)\n\
  \n**时间复杂度：** 第一个 `for` 循环花费 O(*n*) 时间，第二个 `for` 循环花费 O(*n* – k*) 时间，这也是 O(*n*)。因此，算法的总运行时间为\
  \ O(*n²*)。\n\n## 问题-35：最长回文子串\n\n给定一个字符串 `A`，我们需要找到 `A` 的最长子串，使其反转后与与其完全相同。\n\n\
  ### 解决方案\n\n最长回文子串和最长回文子序列之间的基本区别在于：在最长回文子串的情况下，输出字符串应该是连续的字符，从而形成最大的回文；而在最长回文子序列的情况下，输出是字符序列，这些字符可能不是连续的，但它们相对于给定字符串中的位置应该是递增序列。\n\
  \n暴力破解法会详尽地检查给定长度为 `n` 的字符串中所有 `n (*n + 1) / 2` 个可能的子串，测试每个子串是否为回文，并跟踪目前为止见的最长的一个。这的最坏情况复杂度为\
  \ O(*n³*)，但我们可以通过意识到这一点来轻松改进：回文是以字母（对于奇数长度的回文）或字母之间的空格（对于偶数长度的回文）为中心。因此，我们可以检查所有\
  \ `n + 1` 个可能的中心，并找到该中心的最长回文，同时记录全局最长回文。这的最坏情况复杂度为 O(*n²*)。\n\n让我们使用 DP 来解决这个问题。值得注意的是\
