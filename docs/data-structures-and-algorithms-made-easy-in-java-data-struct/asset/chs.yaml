  \n![images](img/01426.jpeg)\n\n### 16.1 引言\n在之前的章节中，我们已经看到了许多不同问题的算法。在解决新问题之前，通常倾向于寻找它与已有问题的相似性。\n\
  \n## 16.2 分类\n算法有多种分类方法，下面显示了其中：\n\n- 实现方法\n- 设计方法\n- 其他分类\n\n### 16.3 按实现方法分类\n\
  \n#### 递归或迭代\n*递归*算法是一种反复调用自身直到满足基本条件的算法。这是函数式编程语言中的常用方法。\n\n*迭代*算法使用循环等结构，有时还使用栈和队列来解决问题。某些问题适合递归，另一些适合迭代。\n\
  \n#### 过程化或声明式（非过程化）\n在*声明式*编程语言中，我们说明想要什么，而不需要说明怎么做。在*过程化*编程中，我们必须指定获取结果的精确步骤。例如，SQL\
  \ 比过程化的更具声明性，因为查询并没有指定产生结果的步骤。\n\n#### 串、并行或分布式\n通常，在讨论算法时，我们假设计算机一次执行一条指令。这些被称为*串*算法。\n\
  \n*并行*算法利用计算机架构一次处理多条指令。它们将问题划分为子问题并提交给多个处理器或线程。迭代算法通常是可以并行的。\n\n如果并行算法分布在不同的机器上，那么我们称此类算法为*分布式*算法。\n\
  \n#### 确定性或非确定性\n*确定性*算法通过预定义过程解决问题，而*非确定性*算法通过使用启发式方法在每一步猜测最佳解决方案。\n\n#### 精确或近似\n\
  \n\n\n正如我们所见，对于许多问题我们无法找到最优解。这意味着我们能够找到最优解的算法被称为`exact`（精确）算法。在计算机科学中，如果我们没有最优解，就会提供近似算法。\n\
  \n近似算法通常与 NP-hard 问题相关（更多细节请参见`Complexity Classes`章节）。\n\n## 16.4 按设计方法分类\n\n另一种分类算法的方法是根据其设计方法。\n\
  \n### 贪心算法\n\n`Greedy` 算法分阶段工作。在每个阶段，都会做出在该点看来是良好的决策，而不考虑未来的后果。通常，这意味着选择了某种`local\
  \ best`（局部最优）。它假设局部最优选择也能产生`global`（全局）最优解。\n\n### 分治法\n\nD & C 策略通过以下步骤解决问题：\n\n\
  1) `Divide`（划分）：将问题分解为子问题，这些子问题本身是相同类型问题的更小实例。\n2) `Recursion`（递归）：递归地解决这些子问题。\n\
  3) `Conquer`（解决）：适当地组合它们的答案。\n\n示例：合并排序和二分查找算法。\n\n#### 动态规划\n\n动态规划（DP）和记忆化（memoization）共同工作。DP\
  \ 与分治法之间的区别在于，在后者的情况下，子问题之间没有依赖关系，而在 DP 中存在子问题的重叠。通过使用记忆化 [维护一个针对已求解子问题的表格]，DP 可以将许多问题的指数级复杂度降低为多项式级复杂度（`O(n²)`，`O(n³)`\
  \ 等）。\n\n动态规划与递归之间的区别在于对递归调用的记忆化。当子问题是独立的且没有重复时，记忆化将不起帮助，因此动态规划不是解决所有问题的方案。\n\n\
  通过使用记忆化 [维护一个已求解子问题的查找表]，动态规划将复杂度从指数级降低到多项式级。\n\n#### 线性规划\n\n在线性规划中，存在关于输入的不等式，以及对输入的某些线性函数进行`maximizing`（最大化）（或最小化）。许多许多问题（例如：有向图的最大流）可以使用线性规划进行讨论。\n\
  \n#### 归约 [转换与解决]\n\n在这种方法中，我们通过将困难问题转换为我们具有渐近最优算法的已知问题来解决它。在这种方法中，目标是找到一个归约算法，其复杂度不会被结果归约算法所主导。例如，在列表中寻找中数的算法涉及首先对列表排序，然后在排序后的列表中找到中间元素。这些技术也被称为`transform\
  \ and conquer`（转换与解决）。\n\n## 16.5 其他分类\n\n#### 按研究领域分类\n\n在计算机科学中，每个领域都有自己的问题并需要高效的算法。例如：搜索算法、排序算法、合并算法、数值算法、图算法、字符串算法、几何算法、组合算法、机器学习、密码学、并行算法、数据压缩算法、解析技术等。\n\
  \n#### 按复杂度分类\n\n在这种分类中，根据算法根据输入规模找到解决方案所需的时间对算法进行分类。某些算法需要线性时间复杂度（`O(n)`），另一些需要指数级时间，而有些则永远不会停止。注意，某些问题可能有多个具有不同复杂度的算法。\n\
  \n#### 随机算法\n\n少数算法随机做出选择。对于某些问题，最快的解决方案必须包含随机性。例如：快速排序。\n\n### 分支限界法枚举与回溯\n\n这些被应用于人工智能，我们不需要充分探索这些。关于回溯方法，请参见`Recusion\
  \ and Backtracking`章节。\n\n**注意：** 在接下来的几章中，我们将讨论贪心、分治和动态规划] 设计方法。强调这些方法是因为它们在解决问题时比其他方法用得频繁。\n\
  \n![images](img/image01427.jpeg)\n\n## 17.1 引言\n\n让我们从简单的理论开始讨论，这将有助于我们理解贪心技术。在`of\
  \ Chess`（国际象棋）游戏中，每当我们对走法决策时，都必须考虑未来的后果。而在`Tennis`（网球）（或排球）游戏中，我们的行动是基于当前情况的。\n\n\
  这意味着在某些情况下，在那个时刻看起来正确的决策提供了最佳解决方案（`Greedy`），但在其他情况下则不然。贪心技术最适合观察当前情况。\n\n### 17.2\
  \ 贪心策略\n\n贪心算法分阶段工作。在每个阶段，都会做出在该点看来是良好的决策，而不考虑未来。这意味着选择了某种`local best`。它假设局部良好的选择能产生全局最优解。\n\
  \n### 17.3 贪心算法的要素\n\n最优贪心算法的两个基本属性是：\n\n1) `Greedy choice property`（贪心选择性质）\n2)\
  \ `Optimal substructure`（最优子结构）\n\n#### 贪心选择性质\n\n该属性说明，通过做出局部最优解（贪心）可以获得全局最优解。贪心算法所做的选择可能取决于较早的选择，但不取决于未来。它迭代地做出一个又一个贪心选择，并将给定问题简化为更小的问题。\n\
  \n#### 最优子结构\n\n如果一个问题的最优解包含了该问题的子问题的最优解，则该问题就表现出最优子结构。这意味着我们可以通过解决子问题并构建解决方案来解决更大的问题。\n\
  \n## 17.4 贪心算法总是有效吗？\n\n做出局部最优选择并不总是奏效。因此，贪心算法并不总是给出最佳解决方案。我们将在`Problems`部分和`Dynamic\
  \ Programming`章节看到具体的例子。\n\n## 17.5 贪心方法的优缺点\n\n贪心方法的主要优点是直观、易于理解且易于编码。在贪心算法中，一旦我们做出决策，就不需要花时间重新检查已计算的值。它的主要缺点是许多问题没有贪心算法。这意味着，在许多情况下，无法保证对局部最优解进行局部最优改进就能产生全局最优解。\n\
  \n## 17.6 贪心应用\n\n•排序：选择排序、拓扑排序\n•优先级队列：堆排序\n•霍夫编码压缩算法\n•Prim 算法和 Kruskal 算法\n•加权图最短路径\
  \ [Dijkstra’s]\n•硬币找零问题\n部分背包问题\n•并集-按大小合并和按高度（或秩）合并\n•作业调度算法\n•贪心技术可以作为复杂问题的近似算法\n\
  \n## 17.7 理解贪心技术\n\n为了更好地理解，让我们来看一个例子。\n\n#### 霍夫编码算法\n\n#### 定义\n\n给定字母表 A 中的 *n*\
  \ 个字符 [每个字符 c ∈ A]* 以及它们相关的频率 `freq*(c)，为每个字符 c ∈ *A* 找到一个二进制代码，使得 ∑[c ∈ A] freq(c)|binarycode(c)|\
  \ 最小，其中 `/binarycode*(c)*/` 表示字符 c 的二进制代码的长度。这意味着所有字符编码的长度之和应该是最小的 [每个字符的频率乘以其表示的位数之和]。\n\
  \n\n\n\n\n霍夫曼编码算法的基本思想是为出现频率更高的字符使用更少的位。霍夫曼编码算法使用变长编码来压缩数据存储。我们知道每个字符需要 8 位来表示。但通常情况下，我们并没有使用所有的位。此外，我们使用某些字符的频率比其他字符高。在读取文件时，系统通常一次读取\
  \ 8 位来读取单个字符。但这种编码方案是低效的。原因是某些字符的使用频率比其他字符高。假设字符 `'e'` 的使用频率比字符 `'q'` 高 10 倍。那么，如果我们为\
  \ `e` 使用 7 位代码而为 `q` 使用 9 位代码，将是有利的，因为这可以减少我们消息的总长度。\n\n平均而言，在标准文件上使用霍夫曼编码根据字符频率将文件缩小\
  \ 10% 到 30% 不等。字符编码后的思想是为低频字符和字符组分配较长的二进制代码。此外，字符编码的构建方式使得没有两个字符代码是彼此的前缀。\n\n####\
  \ 示例\n\n假设在扫描文件后，我们发现了以下字符频率：\n\n| 字符 | 频率 |\n| :--- | :--- |\n| `a` | 12 |\n| `b`\
  \ | 2 |\n| `c` | 7 |\n| `d` | 13 |\n| `e` | 14 |\n| `f` | 85 |\n\n基于此，为每个字符创建一个二叉树，同时存储其出现的频率（如下所示）。\n\
  \n![images](img/image01428.jpeg)\n\n该算法的工作如下：在列表中，找到节点中存储最小频率的两个二叉树。\n\n将这两个节点连接到一个新创建的公共节点，该节点不存储字符，但将存储其下方所有连接节点的频率之和。因此，我们的图片看起来如下：\n\
  \n![images](img/image01429.jpeg)\n\n重复此过程，直到只剩下一个树：\n\n![images](img/image01430.jpeg)\n\
  \n一旦树建立，每个叶子节点对应一个带有代码的字母。要确定特定节点的代码，从根遍历到叶子节点。每向左移动一次，在代码后添加一个 0，每向右移动一次，在代码后添加一个\
  \ 1。结果，对于上述生成的树，我们得到了以下代码：\n\n| 字母 | 代码 |\n| :--- | :--- |\n| `a` | 001 |\n| `b`\
  \ | 0000 |\n| `c` | 0001 |\n| `d` | 010 |\n| `e` | 011 |\n| `f` | 1 |\n\n### 计算节省的比特数\n\
  \n现在，让我们看看这个霍夫曼编码算法节省了多少位。这种计算我们需要做的只是查看原始存储数据使用了多少位，并从中减去使用霍夫曼编码存储数据时使用的位数。在上面的示例中，由于我们有六个字符，假设每个字符都用三位代码存储。由于有\
  \ 133 个这样的字符（总频率乘以 3），使用的总总位数为 `3 * 133 = 399`。使用霍夫曼编码频率，我们可以计算出新的总总位数：\n\n![images](img/image01431.jpeg)\n\
  \n因此，我们节省了 `399 – 238 = 161` 位，或接近存储空间的 40%。\n\n![images](img/image01432.jpeg)\n\
  \n时间复杂度：`O(nlogn)`，因为在一个永远不超过 `n` 个元素的优先队列上将有 `build_heap`、`delete_mins` 和 `inserts`\
  \ 操作。请参阅优先队列章节。\n\n## 17.8 贪心算法：问题与解决方案\n\n### 问题-1\n\n给定一个大小为 `n` 的数组 `F`。假设数组内容\
