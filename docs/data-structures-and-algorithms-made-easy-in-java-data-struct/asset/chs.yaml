  \ 字符串查找算法\n\n参考*字符串算法*章节。\n\n### 11.11 查找：问题与解决方案\n\n**问题-1** 给定一个包含 `n` 个数字的数组，给出一个算法检查数组中是否存在重复元素？\n\
