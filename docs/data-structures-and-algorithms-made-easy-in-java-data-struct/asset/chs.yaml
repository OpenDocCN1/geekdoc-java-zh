  \n##### UNION\n\n![images](img/image01055.jpeg)\n\n### 8.7 快速 UNION 实现 (快速 FIND)\n\
  \n之前方法的主要问题是，在最坏情况下我们得到的是倾斜树，导致 `FIND` 操作花费了 `O(n)` 的时间复杂度。有两种方法可以改进它：\n\n* 按大小合并\
  \ `UNION`（也称为按权重 `UNION`）：让较小的树成为较大树的子树\n* 按高度合并 `UNION`（也称为按秩 `UNION`）：让高度较小的树成为高度较大的树的子树\n\
  \n（注：由于原文后续存在大量重复段落，已按要求进行过滤。）\n\n\n\n\n## 8.10 并查集：问题与解答\n\n**问题-1** 考虑一个城市列表 `c[1]`、`c[2]`、...`c[n]`。假设我们有一个关系\
  \ `R`，对于任意的 `i,j`，如果城市 `c[i]` 和 `c[j]` 处于同一个州，则 `R(c[i],c[j])` 为 1，否则为 0。如果将 `R`\
  \ 存储为表格，它需要多少空间？\n\n**解答：** `R` 必须为每一对城市设置一个条目。这样的组合有 Θ(`n²`) 个。\n\n**问题-2** 针对问题-1，使用并集\
  \ ADT，给出一个算法，将每个城市放入一个集合中，使得 `c[i]` 和 `c[j]` 处于同一个集合，当且仅当它们处于同一个州。\n\n**解答：**\n\n\
  ![images](img/image01064.jpeg)\n\n**问题-3** 针对问题-1，当城市存储在并查集 ADT 中时，如果我们两个城市 `c[i]`\
  \ 和 `c[j]`，我们如何检查它们是否处于同一个州？\n\n**解答：** 城市 `c[i]` 和 `c[j]` 处于同一个州，当且仅当 `FIND(c[i])\
  \ = FIND(c[j])`。\n\n**问题-4** 针对问题-1，如果我们使用按大小并集（UNION by size）的链表来实现并查集 ADT，我们使用多少空间来存储城市？\n\
  \n**解答：** 每个城市有一个节点，因此空间为 Θ(`n`)。\n\n**问题-5** 针对问题-1，如果我们使用按秩并集（UNION by rank）的树，那么算法\
  \ 0 的最坏情况运行时间是多少？\n\n**解答：** 每当我们在算法 0 中执行 `UNION` 时，第二个参数都是一个大小为 1 的树。因此，所有树的高度均为\
  \ 1，所以每次并集操作耗时为 O(1)。那么最坏情况运行时间为 Θ(`n²`)。\n\n**问题-6** 如果我们不使用按秩并集的树，算法 0 的最坏情况运行时间是多少？是否存在比问题-5\
  \ 更多的最坏情况？\n\n**解答：** 由于并操作的特殊性，按秩并集对我们的算法没有影响。因此，一切与问题-5 相同。\n\n**问题-7** 通过快速并集（quick-union）算法，我们知道一系列\
  \ `n` 次操作（`unions` 和 `finds`）在最坏情况下可能花费略超过线性的时间。请解释为什么如果所有的 `finds` 都在所有的 `unions`\
  \ 之前完成，`n` 次操作保证耗时 O(`n`)。\n\n**解答：** 如果先执行 `find` 操作，那么每个 `find` 操作耗时为 O(1)，因为因为每个元素都是其所在树的根。没有元素有父节点，所以查找某个元素所在的集合只需要固定次数的操作。并集操作始终耗时\
  \ O(1)。因此，所有 `finds` 在 `unions` 之前的 `n` 次操作耗时为 O(`n`)。\n\n**问题-8** 参考问题-7，解释为什么如果所有的\
  \ `unions` 都在所有的 `finds` 之前完成，`n` 次操作保证耗时 O(`n`)。\n\n**解答：** 这个问题需要摊还分析。`Find` 操作可能是昂贵的，但这个昂贵的\
  \ `find` 操作会被许多个廉价的 `union` 操作所抵消。\n\n会计方法如下：`Union` 操作始终耗时 O(1)，所以我们假设它们的实际成本为\
  \ ![images](img/image01065.jpeg)1。给每个 `union` 操作分配一个 ![images](img/image01065.jpeg)2\
  \ 的摊还成本，这样每次 `union` 操作都会向账户存入 ![images](img/image01065.jpeg)1。每次 `union` 操作创建一个新的子节点（某个之前不是任何其他节点子节点的节点现在变成了子节点）。当所有并集操作完成后，每个子节点账户中都有\
  \ ![images](img/image01065.jpeg)1，换句话说，对于每个深度为 1 或更大的节点。假设 `find(u)` 操作在 `u` 是根时耗时\
  \ ![images](img/image01065.jpeg)1。对于任何其他节点，`find` 操作每遍历一个父指针就会额外花费 ![images](img/image01065.jpeg)1。因此，实际成本为\
  \ ![images](img/image01065.jpeg)(1 + `d`)，其中 `d` 是 `u` 的深度。给每个 `find` 操作分配 ![images](img/image01065.jpeg)2\
  \ 的摊还成本。这涵盖了 `u` 是根或根的子节点的情况。对于额外遍历的每个父指针，从账户中取出 ![images](img/image01065.jpeg)\
  \ 1 来支付费用。\n\n幸运的是，路径压缩（path compression）改变了我们支付了 ![images](img/image01065.jpeg)1\
  \ 去遍历的所有节点的父指针，使得这些节点变成了根的子节点。所有深度大于或等于 2 的遍历节点都会移动，因此它们的深度现在变为 1。我们再也不需要付费遍历这些节点。假设如果一个节点的深度大于或等于\
  \ 2，则它为孙节点。\n\n每当 `find(u)` 访问孙节点时，从账户中取出 ![images](img/image01065.jpeg)1，但该孙节点不再是孙节点了。因此，从账户中提取出的最大金额是孙节点的数量。但我们最初为每个子节点存入了\
  \ ![images](img/image01065.jpeg)1，而每个孙节点都是子节点，所以余额永远不会为负。![images](img/image01065.jpeg)2，所以先完成所有的并。\n\
  \n## 9.1 引言\n\n在现实世界中，许多问题是用对象和连接来表示的。例如，在航空公司地图中，我们可能关注如下问题：图用于解决这些问题。\n\n### 9.2\
  \ 术语表\n\n**图 (Graph)** 图是一个对 `(V, E)`，其中 `V` 是节点集合，称为顶点（vertices），`E` 是顶点对的集合，称为边（edges）。\n\
  \n我们使用的定义：\n\n**有向边 (Directed edge)** 有序顶点对 `(u, v)`，第一个顶点 `u` 是起点，第二个顶点 `v` 是目的地。例如：单行道\n\
  ![images](img/image0167.jpeg)\n\n**无向边 (Undirected edge)** 无序顶点对 `(u, v)`。例如：铁路\n\
  ![images](img/image0168.jpeg)\n\n**有向图 (Directed graph)** 所有的边都是有向的。例如：路线网络\n![images](img/image0169.jpeg)\n\
  \n**无向图 (Undirected graph)** 所有的边都是无向的。例如：航班网络\n![images](img/image0170.jpeg)\n\n\
  - 当一条边连接两个顶点时，这两个顶点彼此相邻，该边关联这两个顶点。\n- 无环的图称为**树 (tree)**。树是无环的连通图。\n![images](img/image0171.jpeg)\n\
  - 自环（self loop）是连接顶点自身的边。\n![images](img/image0172.jpeg)\n- 如果两条边连接同一对顶点，则它们是平行边（parallel）。\n\
  ![images](img/image0173.jpeg)\n- 顶点的**度 (Degree)** 是关联它的边的数量。\n- 子图（subgraph）是图的边的子集（带有相关的顶点）构成的图。\n\
  - 图中的路径（path）是相邻顶点的序列。**简单路径（Simple path）**是不包含重复顶点的路径。在下图中，虚线表示从 `G` 到 `E` 的路径。\n\
  ![images](img/image0174.jpeg)\n- 环（cycle）是起点和终点相同的路径。简单环（simple cycle）是不包含重复顶点或边（除起点和终点外）的环。\n\
  ![images](img/image0175.jpeg)\n- 如果存在路径包含两个顶点，我们说一个顶点与另一个连通。\n- 如果从每个顶点到每个其他顶点都有路径，则该图是**连通的\
  \ (connected)**。\n- 如果一个图不是连通的，那么它由一组连通分量（connected components）组成。\n![images](img/image0176.jpeg)\n\
  \n\n\n\n- *有向*无环图 [DAG] 是一种没有环的有向图。\n\n![images](img/image01077.jpeg)\n\n- 森林是树的不相交集合。\n\
  \n- 连通图的生成树是包含该图所有顶点且是一棵树的子图。图的生成森林是图中所有连通分量生成树的并集。\n\n- 二分图是一种顶点可以分为两个集合的图，使得所有的边都连接其中一个集合中的顶点与另一个集合中的顶点。\n\
  \n![images](img/image01078.jpeg)\n\n- 在*加权图*中，每条边都被分配一个整数（*权重*）来表示（距离或代价）。\n\n![images](img/image01079.jpeg)\n\
  \n- 包含所有可能边的边的图称为*完全*图。\n\n![images](img/image01080.jpeg)\n\n- 边相对较少的图（通常当边数小于 `|V|`\
  \ log `|V|` 时）称为*稀疏图*。\n\n- 缺失可能边相对较少的图称为*稠密图*。\n\n- 有向加权图有时称为*网络*。\n\n- 我们用 `|V|`\
  \ 表示给定图的顶点数，用 `|E|` 表示边数。注意 `E` 的范围可以从 0 到 `|V|`(|V|` – l)/2（在无向图中）。这是因为每个节点都可以连接到其他所有节点。\n\
  \n### 9.3 图的应用\n\n- 表示电子电路中组件之间的关系\n- 交通网络：公路网络、飞行网络\n- 计算机网络：局域网、互联网、万网\n- 数据库：用于表示数据库中的\
  \ ER（实体关系）图，用于表示数据库中表的依赖关系\n\n### 9.4 图的表示\n\n与其他抽象数据类型（ADT）一样，为了操作图，我们需要以某种实用的形式来表示它们。基本上有三种实现方法：\n\
  \n- 邻接矩阵\n- 邻接接表\n- 邻接集合\n\n#### 邻接矩阵\n\n#### 邻接矩阵的图声明\n\n首先，让我们看看图数据结构的组成部分。为了表示图，我们需要顶点数、边数以及它们之间的连接关系。因此，图可以声明为：\n\
  \n### 说明\n\n在这种方法中，我们使用一个大小为 `V` × `V` 的矩阵。矩阵的值为布尔。假设矩阵为 `Adj`。如果从顶点 `u` 到顶点 `v`\
  \ 有边，则 `Adj[u, v]` 设置为 1，否则为 0。\n\n在矩阵中，对于无向图，每条边由两个位表示。这意味着从 `u` 到 `v` 的边在 `Adj[u\
  \ , v ]` 和 `Adj[u,v]` 中都用值 1 表示。为了节省时间，我们只需要处理这个对称矩阵的一半。此外，我们可以假设每个顶点到自身都有一条“边”。因此，所有顶点的\
  \ `Adj[u, u]` 都设置为 1。\n\n如果图是有向图，那么我们只需要在邻接矩阵中标记一个条目。例如，考虑下面的有向图。\n\n![images](img/image01081.jpeg)\n\
  \n该图的邻接矩阵可以给出：\n\n![images](img/image01082.jpeg)\n\n现在，让我们关注实现部分。读取图的一种方法是先读取顶点名称，然后读取顶点名称对（边）。下面的代码读取了一个无向图。\n\
  \n```\n![images](img/image01083.jpeg)\n```\n\n如果图是稠密的，邻接矩阵表示法很好。矩阵需要 `O(V²)` 位的存储空间和\
  \ `O(V²)` 的初始化时间。如果边数与 `V²` 成正比，那么没有问题，因为读取边需要 `V²` 步。如果图是稀疏的，矩阵的初始化将主导算法的运行时间，因为它需要\
  \ `O(V²)`。\n\n#### 邻接表\n\n#### 邻接表的图声明\n\n![images](img/image01084.jpeg)\n\n在这种表示法中，所有连接到顶点\
  \ `v` 的顶点都列在该顶点 `v` 的邻接列表中。这可以用链表轻松实现。这意味着，对于每个顶点 `v`，我们使用一个链表，链表节点表示 `v` 与 `v`\
  \ 有边的连接其他顶点之间的连接。链表的总数等于图中的顶点数。考虑与邻接矩阵相同的示例，邻接表表示法可以如上所示。由于顶点 `A` 有到 `B` 和 `D` 的边，我们已经在\
  \ `A` 的邻接列表中添加了它们。其他顶点也是如此。\n\n![images](img/image01085.jpeg)\n\n对于这种表示法，输入中边的顺序是*重要*的。这是因为它们决定了顶点在邻接列表中的顺序。同一个图可以用许多不同的方式在邻接表中表示。边在邻接列表中出现的顺序会影响算法处理边的边的顺序。\n\
  \n#### 邻接表的缺点\n\n使用邻接表表示法，我们无法高效地执行某些操作。例如，考虑删除节点的情况。在邻接表表示法中，仅仅从列表表示中删除一个节点是不够的，如果我们从邻接表中删除一个节点，那就足够了。该节点的邻接表中的每个节点指定了另一个顶点。\n\
  \n#### 邻接集合\n\n它与邻接表非常相似，但使用的不是链表，而是并集（Union-Find）。更多细节请参阅*并集 ADT*。\n\n#### 图表示法的比较\n\
  \n有向图和无向图使用相同的结构。对于有向图，一切都相同，只是每条边只表示一次。从 `x` 到 `y` 的边在邻接矩阵的 `Adj[x][y]` 中用 1 表示，或者在\
  \ `x` 的邻接列表中添加 `y`。对于加权图，一切都相同，只是用权重填充邻接矩阵而不是布尔值。\n\n![images](img/image1086.jpeg)\n\
  \n### 9.5 图遍历\n\n为了解决图的问题，我们需要一种遍历图的机制。图遍历算法也称为图搜索算法。类似于树遍历（中序、前序、后序和层次遍历），图搜索可以被视为从源顶点开始，通过遍历边并标记顶点来“搜索”图。现在，我们将讨论两种遍历图的算法。\n\
  \n- 深度优先搜索 [DFS]\n- 广度优先搜索 [BFS]\n\n#### 深度优先搜索 [DFS]\n\nDFS 算法的工作类似于树的前序遍历。像前序遍历一样，该算法内部使用栈。\n\
  \n考虑下面的示例。假设某人被困在一个迷宫里。为了走出迷宫，这个人访问每条路径每个交叉口（最坏情况下）。假设这个人使用两种颜色的漆来标记过的交叉口。发现一个新的交叉口时，将其标记为灰色，并继续向深处走。\n\
  \n在到达“死胡同”后，这个人知道灰色交叉口没有更多可探索的路径，现在将其标记为黑色。这个“死胡同”要么是一个已经标记为灰色或黑色的交叉口，要么是一个没有交叉口的路径。\n\
  \n迷宫的交叉口是顶点，交叉口之间的路径是图的边。从“死胡同”返回的过程被称为*回溯*。我们试图从起始顶点深入图，直到回溯到先前的灰色顶点。在 DFS 算法中，我们会遇到以下类型的边。\n\
  \n| *树边:* 遇到新顶点 |\n\n\n\n\n| *回溯边：* 从后代到祖先 |\n| *前向边：* 从祖先到后代 |\n| *跨越边：* 存在于树或子树之间\
  \ |\n\n对于大多数算法的布尔分类，使用“未访问/已访问”状态就足够了（三色标记实现请参阅问题章节）。这意味着，对于某些问题我们需要使用三种颜色，但在我们的讨论中，两种颜色就足够了。\n\
  \n![images](img/image01087.jpeg)\n\n最初，所有顶点被标记为未访问（`false`）。DFS 算法从图中的一个顶点 `u` 开始。通过从顶点\
  \ `u` 开始，它会考虑从 `u` 到其他顶点的边。如果边指向一个已经访问的顶点，则回溯到当前顶点 `u`。如果边指向一个未访问的顶点，则进入该顶点并从该顶点开始处理。这意味着新顶点变成了当前顶点。重复此过程，直到我们到达尽胡同。在此时，开始*回溯*。\n\
  \n当回溯回到起始顶点时，过程结束。基于此机制的算法如下：假设 `Visited[]` 是一个全局数组。\n\n![images](img/image01088.jpeg)\n\
  \n例如，考虑以下图。我们可以看到，有时边会指向一个已经发现的顶点。这些边被称为*回溯边*，其他边被称为*树边*，因为从图中删除回溯边会生成一棵树。\n\n最终生成的树被称为\
  \ DFS 树，处理顶点的顺序称为顶点的*DFS 编号*。在下面的图中，灰色表示顶点已被访问（没有其他意义）。我们需要观察 `Visited` 表何时更新更新。\n\
  \n![images](img/image01089.jpeg)\n![images](img/image01090.jpeg)\n![images](img/image01091.jpeg)\n\
  \n从上面的图中可以看出，DFS 遍历创建了一棵树（不含回溯边），我们将这种树称为*DFS 树*。即使给定的图具有连通分量，上述算法仍然有效。\n\n如果使用邻接表来表示图，DFS\
  \ 的时间复杂度为 `O(V + E*)`。这是因为我们从一个顶点开始，并且在相邻节点未被访问时才处理它们。同样，如果使用邻接矩阵表示图，则无法高效地找到所有相邻的边，这将导致\
  \ `O(V²)` 的复杂度。\n\n### DFS 的应用\n\n•拓扑排序\n•寻找连通分量\n•寻找图的割点（关接点）\n•寻找强连通分量\n•解决迷宫等谜题\n\
  \n算法请参阅*问题章节*。\n\n### 广度优先搜索 [BFS]\n\nBFS 算法的工作类似于树的*层序遍历*。与*层序遍历*一样，BFS 也使用队列。事实上，*层序遍历*的灵感源于\
  \ BFS。BFS 逐层工作。最初，BFS 从一个给定的顶点开始，该顶点位于第 0 层。在第一阶段，它访问第 1 层的所有顶点（即距离图起始顶点距离为 1 的顶点）。在第二阶段，它访问第\
  \ 2 层的所有顶点。这些新顶点是与第 1 层顶点相邻的顶点。BFS 继续这一过程，直到完成图的所有层级。通常使用*队列*数据结构来存储某一层的顶点。\n\n\
  与 DFS 类似，假设最初所有顶点都被标记为*未访问*（`false`）。已处理并从队列中的顶点被标记为*已访问*（`true`）。我们使用队列来表示访问集，因为它将保持顶点首次被访问的顺序。上述讨论的实现可以给如下：\n\
  \n![images](img/image01092.jpeg)\n\n例如，让我们考虑与 DFS 示例相同的图。BFS 遍历可以所示：\n\n![images](img/image01093.jpeg)\n\
  ![images](img/image01094.jpeg)\n\n如果使用邻接表表示图，BFS 的时间复杂度为 `O(V + E*)`，邻接矩阵表示则为 `O(V²)`。\n\
  \n### BFS 的应用\n\n•寻找图中的所有连通分量\n•寻找一个连通分量内的所有节点\n•寻找两个节点之间的最短路径\n•测试图的二分性\n\n###\
  \ 比较 DFS 和 BFS\n\n比较 BFS 和 DFS，DFS 的巨大优势在于内存需求远低于 BFS，因为不需要存储每一层的所有子指针。根据数据和我们要寻找的内容，DFS\
  \ 或 BFS 均具有优势。例如，在家族树中，如果我们正在寻找一个仍然活着的人，并且假设那人在树的底部，那么 DFS 是更好的选择。BFS 到达最后一层需要花费很长时间。\n\
  \nDFS 算法能更快找到目标。现在，如果我们正在寻找一个很久以前去世的家族成员，那么那个人会靠近树的顶部。在这种情况下，BFS 找到比 DFS 更快。因此，任何一种方法的优势取决于数据和我们要寻找的内容。DFS\
  \ 与树的先序遍历有关。与*先序*遍历一样，DFS 在访问子节点之前访问每个节点。BFS 算法的工作类似于树的*层序遍历*。\n\n如果有人问 DFS 更好还是\
  \ BFS 更好，答案取决于我们试图解决的问题类型。BFS 每次访问一个层，如果我们知道正在搜索的解位于较浅深度，那么 BFS 更好。下表显示了 DFS 和 BFS\
  \ 在应用方面的区别。\n\n![images](img/image1195.jpeg)\n\n### 9.6 拓扑排序\n\n*拓扑排序*是有向无环图 [DAG]\
  \ 中顶点的一种排序，每个节点都在其所有出边节点之前。例如，考虑大学的课程先修结构。定向*边* (`v,w`) 表示课程 `v` 必须在课程 `w` 之前完成。此示例的拓扑排序是不违反先修要求的序列。每个\
  \ DAG 可能都有一个或多个拓扑排序。拓扑排序有一个有趣的性质。排序中相邻顶点对通过边连接；那么这些边构成了图中的哈密顿路径[参见*问题章节*]。如果存在哈密顿路径，则拓扑排序是唯一的。如果拓扑排序没有形成哈密顿路径，DAG\
  \ 可以有两个或多个。在下面的图中：7, 5, 3, 11, 8, 2, 9, 10 和 3, 5, 7, 8, 11, 2, 9, 10 都是拓扑排序。\n\n\
  ![images](img/image01096.jpeg)\n\n最初，计算所有顶点的入度，从入度为大的顶点开始。这意味着考虑没有先修要求的顶点。为了跟踪入度为\
  \ 0 的顶点，可以使用队列。\n\n将所有入度为 0 的顶点放入队列。当队列不空时，移除顶点 `v`，并减少与其相邻的所有边的入度。当一个顶点的入度降为 0\
  \ 时，将其放入队列。拓扑排序是顶点出队列的顺序。\n\n如果使用邻接表，该算法的时间复杂度为 `O(|E| + |V|)`。\n\n![images](img/image01097.jpeg)\n\
  \n拓扑排序的总运行时间为 `O(*V* + E*)`。\n\n**注意：** 拓扑排序问题可以使用 DFS 解决。算法请参见*问题章节*。\n\n#### 拓扑排序的应用\n\
  \n•课程先修关系\n•检测死锁\n•计算流水线\n•检查符号链接循环\n•电子表格公式求值\n\n\n\n\n\n## 9.7 最短路径算法\n\n让我们考虑图的另一个重要问题。给定一个图\
  \ `G = (V, E)` 和一个特殊的顶点 `s`，我们需要找到从 `s` 到 `G` 中所有其他顶点的最短路径。最短路径算法有变体，取决于输入图的类型，如下所示。\n\
  \n## 最短路径算法的变体\n\n| 无权图中的最短路径 |\n| 加权图中的最短路径 |\n| 带有负边的加权图最短路径 |\n\n## 最短路径算法的应用\n\
  \n•寻找从一个地方到另一个地方的最快方法\n•寻找从一个城市到另一个城市飞行/发送数据的最便宜方法\n\n### 无权图中的最短路径\n\n设 `s` 为输入顶点，我们需要找到到所有其他顶点的最短路径。无权图是加权最短路径问题的一个特例，所有边的权重均为\
  \ `1`。该算法与 `BFS` 类似，我们需要使用以下数据结构：\n\n•一个具有三列的距离表（每行对应一个顶点）：\n    ○到源顶点的距离。\n   \
  \ ○路径 – 包含我们获取最短距离所经过的顶点名称。\n•使用队列来实现广度优先搜索。它包含已计算出到源节点距离的顶点以及待检查的相邻顶点。\n\n作为一个示例，考虑以下图及其邻接列表表示。\n\
  \n![images](img/image01098.jpeg)\n\n该图的邻接列表为：\n\n![images](img/image01099.jpeg)\n\
  \n`Lets = C`。从 `C` 到 `C` 的距离为 0。初始时，所有其他节点的距离尚未计算，我们在距离表中将除 `C` 之外的所有顶点的第二列初始化为\
  \ `-1`，如下所示。\n\n![images](img/image01100.jpeg)\n\n**算法**\n\n![images](img/image01101.jpeg)\n\
  \n如果使用邻接列表，运行时间为 `O(|E| + |V|)`。在 `for` 循环中，我们检查给定顶点的出边，而在 `while` 循环中所有检查过的边的总和等于边数，这得到了\
  \ `O(|E|)`。\n\n如果使用矩阵表示，复杂度为 `O(|V|²)`，因为我们需要读取长度为 `|V|` 的矩阵整行，以便找到给定顶点的相邻顶点。\n\n\
  ### 加权图中的最短路径 [Dijkstra 算法]\n\n`Dijkstra` 开发了最短路径问题的著名解决方案。`Dijkstra` 算法是 `BFS`\
  \ 算法的推广。普通的 `BFS` 算法无法解决最短路径问题，因为它无法保证队列头部的顶点是距离源 `s` 最近的顶点。\n\n在编写代码之前，让我们了解该算法是如何工作的。与无权最短路径算法一样，这里也使用距离表。算法通过在\
  \ `Distance` 表中保留顶点 `v` 到源的最短距离来工作。`Distance[v]` 存储从 `s` 到 `v` 的距离。源到自身的最短距离为零。所有其他顶点的\
  \ `Distance` 表被设置为 `-1`，表示这些顶点尚未被处理。\n\n![images](img/image01102.jpeg)\n\n算法完成后，`Distance`\
  \ 表将包含从源 `s` 到每个其他顶点 `v` 的最短距离。为了简化对 `Dijkstra` 算法的理解，假设给顶点维护在两个集合中。初始时，第一个集合只包含源元素，第二个集合包含所有剩余元素。在第\
  \ `k` 次迭代后，第一个集合包含距离源最近的 `k` 个顶点。这 `k` 个顶点是我们已经计算出到源最短距离的顶点。\n\n**关于 Dijkstra 算法的注意事项**\n\
  \n•它使用贪心算法：始终选择下一个距离源最近的顶点。\n•它使用优先队列根据到 `s` 的距离存储未访问的顶点。\n•它不适用于负权重情况。\n\n**无权最短路径与\
  \ Dijkstra 算法的区别**\n\n1) 为了在邻接列表中表示权重，每个顶点都包含边的权重（除其标识符外）。\n2) 我们使用优先队列代替普通队列 `[距离是优先级]`，并选择距离最小的顶点进行处理。\n\
  3) 到顶点的距离通过从源到该顶点路径上边的权重之和计算得出。\n4) 如果新计算的距离小于已计算的旧距离，我们就更新距离。\n\n![images](img/image01103.jpeg)\n\
  \n上述算法可以通过示例更好地理解，该示例将解释所采取的每一步以及 `Distance` 是如何计算的。下方的加权图有 5 个顶点 `A – E`。两个顶点之间的值被称为两个顶点之间的边成本。例如，`A`\
  \ 和 `C` 之间的边成本为 `1`。可以使用 `Dijkstra` 算法找到从源 `A` 到图中剩余顶点的最短路径。\n\n![images](img/image01104.jpeg)\n\
  \n初始的 `Distance` 表为：\n\n![images](img/image01105.jpeg)\n\n在第一步之后，从顶点 `A` 出，我们可以到达\
  \ `B` 和 `C`。因此，在 `Distance` 表中，我们更新 `B` 和 `C` 的可达性，如下所示：\n\n![images](img/image01106.jpeg)\
  \ （注：此处原文图片显示不完整）\n\n现在，让我们从中选择最小距离。最小距离顶点是 `C`。这意味着我们需要从这两个顶点到达其他顶点（`A` 和 `C`）。例如，`B`\
  \ 可以从 `A` 到达，也可以从 `C` 到达。由于通过 `C` 到达 `B` 得到了最小距离 `(1 + 2)`，我们更新 `B` 的距离为 `3`。剩余的顶点是\
  \ `E`。为了到达 `E`，我们需要查看所有到达 `E` 的路径，并选择成本最低的一个。我们可以看到，通过 `B` 到 `C` 得到了最小成本。\n\n![images](img/image01107.jpeg)\n\
  \n`Dijkstra` 算法生成的最终最小成本树为：\n\n![images](img/image01108.jpeg)\n\n**性能**\n\n在 Dijkstra\
  \ 算法中，效率取决于 `DeleteMins`（`V` 次 `DeleteMins`）和优先队列的更新（`E` 次更新）。如果使用标准二堆，复杂度为 `O(ElogV)`。`ElogV`\
  \ 项来自于 `E` 次更新（每次更新需要 `logV`）。如果使用的集合是数组，复杂度为 `O(E + V²)`。\n\n\n\n\n如果图具有负边权，则 `Dijkstra’s`\
  \ 算法无法工作。问题在于，一旦一个顶点 `u` 被标记为已知，就可能从另一个未知的顶点 `v` 存在一条回到 `u` 的权重非常负的路径。在这种情况下，从 `s`\
  \ 到 `v` 再回到 `u` 的路径比不使用 `v` 直接从 `s` 到 `u` 更优。将 `Dijkstra’s` 算法与无权算法结合可以解决这个问题。用\
  \ `s` 初始化队列。然后，在每个阶段，我们 `DeQueue` 一个顶点 `v`。我们找到与 `v` 相邻的所有顶点 `W`，使得：\n\n![images](img/image01110.jpeg)\n\
  \n我们更新 `w` 的旧距离和路径，如果 `w` 不在队列中，则将 `w` 放入队列。对于每个顶点可以设置一个标志位来表示其是否在队列中。我们重复这一过程直到队列为空。\n\
  \n![images](img/image01111.jpeg)\n\n如果不存在负权重环，该算法即可运行。每个顶点最多 `DeQueue` `|V|` 次，因此如果使用邻接表，其运行时间为\
  \ `O(|E| . |V|)`。\n\n## 最短路径算法概述\n\n| 无权图中的最短路径 [`Modified BFS`] | `O(|E| + |V|)`\
  \ |\n| :--- | :--- |\n| 加权图中的最短路径 [`Dijkstra’s`] | `O(|E| log |V|)` |\n| 带有负边的加权图中的最短路径\
  \ [`Bellman – Ford`] | `O(|E|..|V|)` |\n| 无环加权图中的最短路径 | `O(|E| + |V|)` |\n\n## 9.8\
  \ 最小生成树\n\n图的 `Spanning tree`（生成树）是包含所有顶点且本身是一棵树的子图。一个图可能有许多棵生成树。例如，考虑如下所示具有 4 个顶点的图。假设图的角点就是顶点。\n\
  \n![images](img/image01112.jpeg)\n\n对于这个简单图，我们可以得到如下所示的多个生成树。\n\n![images](img/image01113.jpeg)\n\
  \n我们现在将讨论的是无向图中的 `minimum spanning tree`（最小生成树）。我们假设给图是加权图。如果图是无权图，我们仍然可以通过将所有权重视为相等来使用加权图算法。无向图\
  \ `G` 的 `minimum spanning tree`是由图边形成的树，它连接了 `G` 的所有顶点且总代价（权重）最小。只有当图是连通的时，才存在最小生成树。这个问题有两个著名的算法：\n\
  \n• `Prim’s` 算法\n\n• `Kruskal’s` 算法\n\n### Prim 算法\n\nPrim 算法与 `Dijkstra’s` 算法几乎相同。与\
  \ `Dijkstra’s` 算法一样，在 `Prim’s` 算法中，我们在距离表中保留 `distance` 和 `paths` 值。唯一的例外是，由于 `distance`\
  \ 的定义不同，更新语句也略有不同。更新语句比以前简单。\n\n![images](img/image01114.jpeg)\n\n该算法的整个实现与 `Dijkstra’s`\
  \ 算法相同。在不使用堆的情况下[适用于稠密图]，运行时间为 `O(|V|²)`，使用二叉堆时为 `O(*ElogV*)`[适用于稀疏图]。\n\n### Kruskal\
  \ 算法\n\n该算法从 `V` 棵不同的树开始（`V` 是图中的顶点）。在构建最小生成树的过程中，每当 `Kruskal’s` 算法选择一条权重最小的边时，如果它不会产生环，则添加该边。因此，最小生成树是无向图\
  \ `G` 的由图边形成的树，它连接了 `G` 的所有顶点且总代价（权重）最小。\n\n\n\n\n### 解答\n数量为 `V (V – 1)/2`。任何有向图最多可以有\
  \ `n²` 条边。然而，由于图没有环，因此它不能包含自环，并且对于任意的一对顶点 `x,y`，`(x,y)` 和 `(y,x)` 中最多包含一条边。因此，边的数量最多可以为要求的\
  \ `(V² – V)/2`。可以实现 `V(V – 1)/2` 条边。将 `n` 个节点标记为 `1,2...n`，并且当仅当 `x < y` 时添加边 `(x,\
  \ y)`。该图具有相应数量的边，且不会包含环（任何路径都会访问一个递增的节点序列）。\n\n### 问题-7\n在 `V` 的情况下，有多少种没有平行边和自环的简单有向图是可能的？\n\
  \n### 解答\n`(V) × (V – 1)`。因为每个顶点可以连接到 `V – 1` 个顶点而不产生自环。\n\n### 问题-8\n在本章前面，我们讨论了最小生成树算法。现在，请给出一个用于寻找图中最大权重生成树的算法？\n\
  \n### 解答\n![images](img/image01125.jpeg)\n\n使用给图，构造一个具有相同节点和边的新图。但不是使用相同的权重，而是取它们权重的负值。这意味着，边的权重\
  \ = 给定图中对应边的权重的负值。现在，我们可以在这个新图上使用现有的`minimum spanning tree`（最小生成树）算法。结果我们将在原图中得到最大权重生成树。\n\
  \n### 问题-9\nDFS 和 BFS 之间的区别是什么？\n\n### 解答\n| DFS | BFS |\n| :--- | :--- |\n| 可以从死胡同进行回溯。\
  \ | 不可以回溯。 |\n| 探索不完全的顶点按 LIFO（后进先出）顺序处理。 | 待探索的顶点被组织为 FIFO（先进先出）队列。 |\n| 搜索在一个特定方向上。\
  \ | 同一级的顶点并行维护。 |\n\n### 问题-10\n给出一个算法，检查给定的图 `G` 是否存在从源点 `s` 到终点 `d` 的简单路径。假设图\
  \ `G` 使用邻接矩阵表示。\n\n### 解答\n让我们假设图的结构如下：\n\n对于每个顶点调用 `DFS` 并检查当前顶点是否与终点顶点相同。如果相同，则返回\
  \ `1`。否则，在其未访问的邻居节点上调用 `DFS`。这里需要注意的一个重要点是，我们是在尚未访问的顶点上调用 `DFS` 算法。\n\n![images](img/image01126.jpeg)\n\
  \n时间复杂度：`O(E)`。在上述算法中，对于每个节点，由于我们没有对其所有邻居调用 `DFS`（通过 `if` 条件舍弃），空间复杂度：`O(V)`。\n\n\
  ### 问题-11\n对于给定的图 `G`，计算其从源点 `s` 到终点 `d` 的简单路径数量？假设图使用邻接矩阵表示。\n\n### 解答\n与在 问题-9\
  \ 中的讨论类似，从一个节点开始并在该节点上调用 `DFS`。作为调用的结果，它访问了在图中它可以到达的所有节点。这意味着它访问了该节点所在连通分量的所有节点。如果有任何未访问的节点，则再次从其中一个节点开始并调用\
  \ `DFS`。\n\n在每个连通分量的第一次 `DFS` 之前，增加连通分量计数 `count`。继续此过程，直到图中所有的节点都被访问。结果是，在最后我们将得到连通分量的总数。基于此逻辑的实现如下：\n\
  \n![images](img/image01127.jpeg)\n\n### 问题-12\n所有对最短路径问题：找到给定图中每对顶点之间的最短图距离。让我们假设给定图不包含负边。\n\
  \n### 解答\n可以使用`Floyd – Warshall algorithm`（弗莱德-沃沃尔算法）来解决。该算法也适用于边具有负权重的加权图。该算法是动态规划的一个示例——请参考`Dynamic\
  \ Programming`章节。\n\n### 问题-13\n在 问题-12 中，如果图具有负权重的边，我们如何解决所有对最短路径问题？\n\n### 解答\n\
  可以使用`Floyd – Warshall algorithm`来解决。该算法也适用于边具有负权重的加权图。该算法是动态规划的一个示例——请参考`Dynamic\
  \ Programming`章节。\n\n### 问题-14\nDFS 应用：割点（Cut Vertex or Articulation Points）\n\n\
  ### 解答\n在无向图中，`cut vertex`（或割点）是一个顶点，如果我们移除它，图就会分成两个不连通的分量。例如，考虑下图。移除`“D\"`顶点会将图划分为两个连通分量（`{E,F}`\
  \ 和 `{A,B, C, G}`）。\n\n同样地，移除`“C\"`顶点会将图分成（`{G}` 和 `{A, B,D,E,F}`）。对于这个图，`A` 和 `C`\
  \ 是割点。\n\n**注意：** 如果一个连通的无向图在移除任何顶点后仍然连通，则称为`bi – connected`（双连通）。\n\n![images](img/image01128.jpeg)\n\
  \n一个连通的无向图在移除任何顶点后仍然连通，则称为`bi – connected`。\n\n![images](img/image01128.jpeg)\n\n\
  一个连通的无向图在移除任何顶点后仍然连通，则称为`bi – connected`。\n\n![images](img/image01128.jpeg)\n\n\
  一个连通的无向图在移除任何顶点后仍然连通，则称为`bi – connected`。\n\n![images](img/image01128.jpeg)\n\n\
