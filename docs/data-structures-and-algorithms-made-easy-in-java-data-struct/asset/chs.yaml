  \n时间复杂度：O(*n*²)。空间复杂度：O(*n*)。\n\n### Problem-37\n对于 Problem-36，我们如何生成具有 `n` 个节点的所有不同二叉搜索树\
  \ (BST)？\n\n**解决方案：**\n\n![Image](img/image00850.jpeg)\n\n### Problem-38\n给定具有特殊属性的树，叶子节点用‘L’表示，内部节点用‘I’表示。此外，假设每个节点有\
  \ 0 或 2 个孩子。给定该树的前序遍历，构造该树。**示例：** 给定前序字符串 => `ILILL`\n\n![Image](img/image00851.jpeg)\n\
  \n**解决方案：** 首先，我们应该观察前序遍历的排列方式。前序遍历意味着首先放置根节点，然后是左子树的前序遍历，然后是右子树的前序遍历。在正常情况下，仅通过前序遍历无法检测左子树何时结束以及右子树何时开始。由于每个节点有\
  \ 2 个孩子或没有孩子，我们可以确定，如果一个节点存在，那么它的兄弟节点也存在。因此，每当我们计算一个子树时，也需要计算它的兄弟子树。\n\n其次，每当我们在输入字符串中遇到‘L’时，它是一个叶子节点，我们可以在该点停止处理特定的子树。在这个‘L’节点之后（其父节点‘L’的左孩子），它的兄弟节点开始。如果‘L’节点是其父节点的右孩子，那么我们需要在层级中向上寻找找到下一个要计算的子树。\n\
  \n记住上述不变性，我们可以很容易地确定子树何时结束以及下一个何时开始。这意味着我们可以为我们的方法提供任何起始节点，它可以轻松地完成其生成的子树并超出其自身的节点范围。我们只需要向不同的子树传递正确的起始节点即可。\n\
  \n![Image](img/image00852.jpeg)\n\n时间复杂度：O(*n*)。\n\n### Problem-39\n给定一个具有三个指针（左、右和下一个兄弟）的二叉树，提供一种算法来填充\
  \ `nextSibling` 指针，假设它们初始为 NULL。\n\n**解决方案：** 我们可以使用简单的队列。\n\n![Image](img/image00853.jpeg)\n\
