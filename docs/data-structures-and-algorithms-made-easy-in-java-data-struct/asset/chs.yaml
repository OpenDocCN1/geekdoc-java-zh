  \n### 问题-17：DFS 应用：讨论欧拉（Euler）回路\n\n**解答：** 在讨论这个问题之前，让我们先来看术语：\n\n*   `Eulerian\
  \ tour`（欧拉迹）——一条不重复地包含所有边的路径。\n*   `Eulerian circuit`（欧拉回路）——一条不重复地包含所有边且起点和终点相同的相同的路径。\n\
  *   `Eulerian graph`（欧拉图）——包含欧拉回路的图。\n*   `Even vertex`（偶数顶点）：度数为偶数的顶点。\n*   `Odd\
  \ vertex`（奇数顶点）：度数为奇数的顶点。\n\n`Euler` 回路：对于一个给定的图，我们必须用笔重构回路，每条线只画一次。在画图过程中不能抬笔离开。这意味着我们必须在图中找到一条恰好访问每条边一次的路径，被称为\
  \ `Euler path`（欧拉路径，也称为 `Euler tour`）或 `欧拉回路问题`。这个谜题有一个基于 `DFS` 的简单解。\n\n![images](img/image01134.jpeg)\n\
  \n欧拉回路存在的当且仅当图是连通的且每个顶点的邻居数量都是偶数。从任意节点开始，选择任意未遍历过的出边并跟随它。重复此过程直到没有剩余未选择的出边。例如，考虑以下图：该图的一个合法的欧拉回路是\
  \ 0 1 3 4 1 2 3 5 4 2 0。\n\n如果我们从顶点 0 开始，可以选择指向顶点 1 的边，然后选择指向顶点 2 的边，再选择指向顶点 0 的边。此时顶点\
  \ 0 已经没有剩余未选择的边了：\n\n![images](img/image01135.jpeg)\n\n我们现在有一个 `0,1,2,0` 回路，它并没有遍历每条边。因此，我们选取该回路上的另一个顶点，例如顶点\
  \ 1。然后对剩余的边再次进行深度优先搜索。假设我们选择指向节点 3 的边，然后是 4，然后是 1。我们又卡住了，节点 1 没有更多未选择的边了。现在，我们将这条路径\
  \ `1,3,4,1` 接到旧路径 `0,1,2,0` 中，得到：`0,1,3,4,1,2,0`。现在未选择的边看起来如下：\n\n![images](img/image01136.jpeg)\n\
  \n我们可以再选取另一个顶点来开始另一个 DFS。如果我们选择顶点 2，并拼接路径 `2,3,5,4,2`，我们就得到了最终的回路 `0,1,3,4,1,2,3,5,4,2,0`。\n\
  \n一个类似的问题是在无向图中找到一个访问每个顶点的简单环。这被称为 `哈密顿回路问题`（Hamiltonian cycle problem）。尽管它看起来与欧拉回路问题几乎相同，但目前尚没有适用于它的高效算法。\n\
  \n**笔记：**\n\n*   一个连通的无向图当且仅当每个图顶点的度均为偶数，或者恰好有两个顶点的度数为奇数时，它是欧拉图（Eulerian）。\n*  \
  \ 一个有向图如果是强连通的且每个顶点的入度和出度相等，则它是欧拉图。\n\n**应用：** 邮员必须访问一组街道以递送邮件和包裹。他需要找到一条起点和终点都是邮局，且恰好通过每条街道（边）一次的路径。这样，邮员就能向所有必要的街道递送邮件包裹，同时在道路上花费最少的时间精力。\n\
  \n### 问题-18：DFS 应用：寻找强连通分量。\n\n**解答：** 这是 DFS 的另一个应用。在有向图中，两个顶点 `u` 和 `v` 强连通的当且仅当存在从\
  \ `u` 到 `v` 的路径且存在从 `v` 到 `u` 的路径。强连通性是一种等价关系。\n\n*   顶点与其自身是强连通的。\n*   如果顶点 `u`\
  \ 与顶点 `v` 强连通，那么 `v` 与 `u` 强连通。\n*   如果顶点 `u` 与顶点 `v` 强连通，且 `v` 与顶点 `x` 强连通，那么 `u`\
  \ 与 `x` 强连通。\n\n这说明，对于一个给定的有向图，我们可以将其划分为多个强连通分量。这个问题可以通过执行两次深度优先搜索来解决。通过两次 DFS 搜索，我们可以测试一个给定的有向图是否强连通。我们还可以生成强连通的顶点子集。\n\
  \n\n\n\n**解决方案：** 可以通过标记已添加到集合 `S` 的顶点在常数时间内完成环检测。如果一条边的两个顶点都被标记，则该边将引入一个环。\n\n\
  **算法：**\n\n![images](img/image01144.jpeg)\n\n### 问题-22\n是否有其他方法可以解决 问题-20？\n\n**解决方案：**\
  \ 有的。我们可以运行 `BFS` 并找到图的 `BFS` 树（图的层序树）。然后从根元素开始继续移动到下一层，同时我们必须只考虑下一层中的节点。这意味着，如果一个节点有多个输入边，我们应该只考虑其中一个；否则它们将形成一个环。\n\
  \n### 问题-23\n在无向图中检测环\n\n**解决方案：** 且且仅当 `DFS` 不产生回边（back edges，即 `v` 已经被发现且是 `u`\
  \ 的祖先的边 `(u, v)`）时，无向图是无环的。\n\n- 在图上执行 `DFS`。\n- 如果存在回边——则图包含环。\n\n如果图不包含环，则 `|E|\
  \ < |V|` 且 `DFS` 的代价为 O(`|V|`)。如果图包含环，则最多在 2*`|V|` 步后发现回边。\n\n### 问题-24\n在 DAG（有向无环图）检测环\n\
  \n**解决方案：**\n\n![images](img/image01145.jpeg)\n\n图的环检测与树的环检测不同。这是因为在图中，一个节点可以有多个父亲。在树中，检测环的算法是进行深度优先搜索，在遇到节点时对其标记。如果再次看到之前标记过的节点，则存在环。这在图上行不通。让我们考虑下所示图。如果我们使用树的环检测算法，它将报告错误的结果。这意味着该图有一个环。但给定的图并没有环。这是因为在从节点\
  \ 1 开始的 `DFS` 中，节点 3 会看到两次。\n\n树的环检测算法可以很容易修改为适用于图。关键在于，在无环图的 `DFS` 中，一个所有后代都已访问过的节点可以被再次看到而并不意味着存在环。但是，如果一个节点在所有后代被访问之前再次被第二次看到，那么一定存在环。\n\
  \n你能看出这是为什么吗？假设存在一个包含节点 A 的环。这意味着 A 必须从它的某一个后代可到达。所以当 `DFS` 访问该后代时，它在完成访问所有 `A`\
  \ 的后代之前会再次看到 `A`。因此存在一个环。\n\n为了检测环，我们可以修改深度优先搜索。\n\n![images](img/image01146.jpeg)\n\
  \n时间复杂度：O(`|V| + |E|`)。\n\n### 问题-25\n给定一个有向无环图，给出一个寻找其深度的算法。\n\n**解决方案：** 如果是无向图，我们可以使用简单的未加权最短路径算法（查看\
  \ `Shortest Path Algorithms` 章节）。我们只需要返回所有距离中的最大值。对于有向无环图，我们可以通过遵循我们用于在树中寻找深度的相似方法来。在树中，我们使用层序遍历（带有一个额外的特殊符号来表示层的结束）解决了这个问题。\n\
  \n![images](img/image01147.jpeg)\n\n总运行时间为 O(`|V| + |E|`)。\n\n## 问题-26\n以下 DAG 有多少种拓扑排序？\n\
  \n![images](img/image01148.jpeg)\n\n**解决方案：** 如果我们观察上面的图，有三个包含 2 个顶点的阶段。在本章的早期讨论中，我们看到拓扑排序在任何时刻选择入度为\
  \ 0 的元素。在两个顶点阶段中的每一个，我们可以先处理顶部顶点或底部顶点。结果，在这些阶段中的每一个阶段都有两种可能。因此，总可能性是每个阶段可能性的乘积，即\
  \ 2 × 2 × 2 = 8。\n\n### 问题-27\n**唯一拓扑排序：** 设计一种算法来确定有向图是否具有唯一的拓扑排序。\n\n**解决方案：**\
  \ 有向图具有唯一的拓扑排序，当且仅当拓扑排序中每对连续顶点之间都存在有向边。这也可以定义为：有向图具有唯一的拓扑排序，当且仅当它有一条哈密顿路径。如果该有向图有多个拓扑排序，可以通过交换一对连续顶点来获得第二个拓扑排序。\n\
  \n### 问题-28\n让我们考虑 `IIT Bombay` 课程的先修要求。假设所有先修都是强制性的，每门课程每学期都开设，并且每学期的课程数量没有限制。我们想知道完成该专业的最少学期数。描述我们用于表示此问题的数据结构，并概述一个解决它的线性时间算法。\n\
  \n**解决方案：** 使用有向无环图 (DAG)。顶点代表课程，边代表 `IIT Bombay` 课程之间的先修关系。它是一个 DAG。完成该专业所需的学期数比图中的长路径多一。这可以在\
  \ `DFS` 上以线性时间计算。\n\n### 问题-29\n在某所大学比说是 `IIT Bombay`，有一份课程及其先修列表。为该学生设计一个时间表。\n\
  \n**示例：**\n`A` – 课程：{C-Lang, Data Structures, OS, Algorithms, Design Patterns, Programming}\n\
  `B` – 先修：{(C-Lang, CO), (OS, CO), (Data Structures, Algorithms)} 表示 `x` 可以在 `y`\
  \ 之前\n\n**解决方案：** 该问题的解决方案与拓扑排序完全相同。假设课程名称是范围 `[1..n]` 中的整数，`n` 已知。课程之间的关系将由有向图\
  \ `G = (V,E)` 表示，其中 `V` 是课程集，如果课程 `i` 是课程 `j` 的先修，则 `E` 将包含 `(i,j)`。假设图由邻接表表示。\n\
  \n首先，让我们观察另一种在 O(||V| + |E|*) 内对 DAG 进行拓扑排序的算法。\n\n- Find 所有顶点的入度 – O(||V| + |E|*)\n\
  - 重复：\n    - 找到入度为 0 的顶点 `v` – O(||V||)\n    - 输出 `v` 并将其从图中移除（同它的边） – O(||V||)\n\
  \    - 减少每个与其边的节点 `u` 的入度，并保留入度为 0 的顶点列表 – O(`degree(v)`)\n- 重复过程直到所有顶点被移除\n\n该算法的时间复杂度也与拓扑排序相同，为\
  \ O(||V| + |E|*)。\n\n### 问题-30\n在 问题-29 中，学生想在最少的学期内完成 `A` 中的所有课程。这意味着学生准备好在每学期参加任何数量的课程。为这种场景设计一个时间表。*一种可能的时间表是：*\n\
  \n*学期* 1：C-Lang, OS, Design Patterns\n\n*学期* 2：Data Structures, CO, Programming\n\
  \n*学期* 3：Algorithms\n\n\n\n\n\n### 解决方案\n上述拓扑排序算法的一种变体：在每个学期中，不是修一门科目，而是修所有入度为 0\
  \ 的科目。这意味着对所有度为 0 的节点执行该算法（而不是在每个阶段处理一个源，而是处理并打印所有的源）。\n\n时间复杂度：`O(|V| + |E|`。\n\
  \n### 问题-31 DAG 的最近公共祖先\n给定一个 DAG 和两个顶点 `v` 和 `w`，找到 `v` 和 `w` 的`最近公共祖先`(LCA)。`v`\
  \ 和 `w` 的 LCA 是 `v` 和 `w` 的一个祖先，且其后代没有也是 `v` 和 `w` 的祖先。\n\n**提示：** 定义 DAG 中顶点 `v`\
  \ 的高度为从 `root` 到 `v` 的最长路径长度。在 `v` 和 `w` 的共同祖先中，高度最大的就是 `v` 和 `w` 的 LCA。\n\n###\
