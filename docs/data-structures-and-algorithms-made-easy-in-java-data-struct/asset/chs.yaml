  \ `O(1)`，而最坏情况的时间为 `O(n)`。有关哈希算法的更多信息，请参考*哈希*章节。作为一个例子，考虑数组 `A = {3,2,1,2,2,3}`。\n\
  \n扫描输入数组并将元素插入哈希表中。对于每个插入的元素，将 `counter` 保持为 1（假设最初所有条目都填充为零）。这表示相应的元素已经出现。对于给定的数组，哈希表（在插入前三个元素\
  \ 3、2 和 1 后）如下：\n\n```\n![images](img/image01228.jpeg)\n```\n\n现在如果我们尝试插入 2，由于 2\
  \ 的计数器值已经是 1，我们可以说该元素已经出现两次。\n\n时间复杂度：`O(n)`。空间复杂度：`O(n)`。\n\n**问题-4** 我们能进一步改进问题-1\
  \ 解决方案的复杂度吗？\n\n**解决方案：** 假设数组元素是正数，且所有元素都在 0 到 `n-1` 的范围内。对于每个元素 `A[i]`，前往索引为 `A[i]`\
  \ 的数组元素。这意味着选择 `A[A[i]]` 并标记 `- A[A[i]]`（将 `A[A[i]]` 处取反）。继续这个过程直到遇到值已经取反的元素。如果存在这样的元素，我们就说给定数组存在重复元素。作为一个例子，考虑数组\
