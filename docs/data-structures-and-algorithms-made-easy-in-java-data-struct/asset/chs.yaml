  \n### 问题-19 \n我们如何用堆实现队列？\n\n\n\n\n\n解决方案：为了使用优先级队列 `PQ`（使用最小堆）实现队列，类似于模拟栈的方法，让我们假设我们使用了一个额外的整数变量\
