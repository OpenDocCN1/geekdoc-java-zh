  \n### 6.1 什么是树？\n\n树是一种与链表类似的数据结构，但节点不是简单地以线性方式指向下一个节点，而是指向多个节点。树是非线性数据结构的一种。树结构是以图形形式表示结构层次性质的方法。\n\
  \n在树的 ADT（抽象数据类型）中，元素的顺序并不重要。\n\n### 6.2 术语\n\n![Image](img/image00778.jpeg)\n\n\
  * 队列的 `Rear` 在 `front` 的顺时针方向某处。\n* 入队元素时，我们将 `rear` 顺时针移动一位并在该位置写入元素。\n* 出队，只需将\
  \ `front` 顺时针移动一位。\n* 队列随着入队和出队沿顺时针方向移动。\n* 需要仔细检查空状态和满状态。\n* 分析可能的情况（画一些图来看看当队列为空、部分满和完全满时，`front`\
  \ 和 `rear` 所在的位置）。我们将得到：\n\n![Image](img/image00779.jpeg)\n\n### 6.3 二叉树\n\n如果每个节点都有零、一个或两个孩子，则该树被称为*二叉树*。空树也是有效的二叉树。我们可以将二叉树可视化为一个根和两个不相交的二叉树，称为根的左子树和右子树。\n\
  \n![Image](img/image00786.jpeg)\n\n#### 二叉树的类型\n\n**严格二叉树:** 如果每个节点恰好有两个孩子或没有孩子，则该二叉树被称为*严格二叉树*。\n\
  \n![Image](img/image00787.jpeg)\n\n**满二叉树:** 如果每个节点恰好有两个孩子且所有叶子节点都在同一层，则该二叉树被称为*满二叉树*。\n\
  \n![Image](img/image00788.jpeg)\n\n**完全二叉树:** 在定义*完全二叉树*之前，假设二叉树的高度为 `h`。在完全二叉树中，如果我们从根节点开始对节点进行编号（假设根节点为\
  \ 1），我们就能得到一个从 1 到树中节点数量的完整序列。\n\n\n\n\n在遍历时，我们也应该对 NULL 指针进行编号。如果一个二叉树的所有叶子节点的高度均为\
  \ `h` 或 `h – 1`，且序列中没有缺失，则该二叉树被称为`完全二叉树`。\n\n![Image](img/image0079.jpeg)\n\n####\
  \ 二叉树的属性\n\n对于以下属性，假设树的高度为 `h`。同时假设根节点的高度为零。\n\n![Image](img/image00791.jpeg)\n\n\
  ![Image](img/image00792.jpeg)\n\n从下图中我们可以推断出以下属性：\n\n- 满二叉树中的节点数 `n` 为 `2^(h+1)\
  \ – 1`。由于有 `h` 层，我们需要将每层的所有节点相加：`[2⁰ + 2¹ + 2² + . . . + 2^(h) = 2^(h+1) – 1]`。\n\
  \n- 完全二叉树中的节点数 `n` 介于 `2^h`（最小）和 `2^(h+1) – 1`（最大）之间。更多相关信息，请参阅`Priority Queues`章节。\n\
  \n- 满二叉树的叶子节点数为 `2^h`。\n\n- 有 `n` 个节点的完全二叉树中的 NULL 链接（浪费的指针）数为 `n + 1`。\n\n####\
  \ 二叉树的结构\n\n现在让我们定义二叉树的结构。为了简单起见，假设节点的数据为整数。表示一个包含数据的节点的一种方法是使用两个指向左、右孩子的链接，数据如下所示：\n\
  \n![Image](img/image0793.jpeg)\n\n![Image](img/image0794.jpeg)\n\n**注意：** 在树中，默认流是从父节点到子节点，并不强制显示分支。对于我们的讨论，假设两种表示法是相同的。\n\
  \n![Image](img/image0795.jpeg)\n\n## 二叉树的操作\n\n#### 基础操作\n\n- 向树中插入元素\n- 从树中删除元素\n\
  - 查找元素\n- 遍历树\n\n#### 辅助操作\n\n- 查找树的大小\n- 查找树的高度\n- 查找具有最大和的层\n- 为给定的节点对查找最小公共祖先（`LCA`），以及更多\n\
  \n## 二叉树的应用\n\n以下是二叉树发挥重要作用的一些应用场景：\n\n- 表达式树用于编译器。\n- 霍夫曼编码树用于数据压缩。\n- 二叉搜索树（`BST`），支持在\
  \ `Ologn`（平均）时间内对元素进行搜索、插入和删除。\n- 优先级队列（`PQ`），支持在对数时间内（最坏情况）对元素进行最小（或最大）的搜索和删除。\n\
  \n## 6.4 二叉遍历\n\n为了处理树，我们需要一种遍历机制，这正是本节的主题。访问树的所有节点的过程被称为树遍历。每个节点只被处理一次，但可能会被访问多次。正如我们在线性数据结构（如链表、栈、队列等）中看到的，元素在这些结构中按顺序访问，但那里有许多不同的方式。树遍历类似于搜索树，区别在于遍历的目标是按照特定的顺序在树中移动。此外，在遍历过程中所有节点都会被处理，而搜索在找到所需节点时就会停止。\n\
  \n#### 遍历的可能性\n\n从二叉树的根开始，可以执行三个主要步骤，执行的顺序定义了遍历的类型。这些步骤是：在当前节点上执行操作（称为“访问”节点，并标记为\
  \ `D`）、遍历到左孩子（标记为 `L`）以及遍历到右孩子（标记为 `R`）。这个过程可以通过递归很容易地描述。根据上述定义，有 6 种可能性：\n\n1.\
  \ `LDR`: 处理左子树，处理当前节点数据，然后处理右子树\n2. `LRD`: 处理左子树，处理右子树，然后处理当前节点数据\n3. `DLR`: 处理当前节点数据，处理左子树，然后处理右子树\n\
  4. `DRL`: 处理当前节点数据，处理右子树，然后处理左子树\n5. `RDL`: 处理右子树，处理当前节点数据，然后处理左子树\n6. `RLD`: 处理右子树，处理左子树，然后处理当前节点数据\n\
  \n#### 遍历的分类\n\n这些实体（节点）被处理的顺序定义了特定的遍历方法。分类是基于当前节点被处理的顺序。这意味着，如果我们根据当前节点（`D`）进行分类，且\
  \ `D` 出现在中间，那么 `L` 在 `D` 的左侧还是 `R` 在 `D` 的左侧并不重要。\n\n同样，`L` 在 `D` 的右侧还是 `R` 在 `D`\
  \ 的右侧也不重要。由于此，总共 6 种可能性减少到 3 种，分别是：\n\n- 前序 (`DLR`) 遍历\n- 中序 (`LDR`) 遍历\n- 后序 (`LRD`)\
  \ 遍历\n\n还有另一种不依赖于上述顺序的遍历方法，即：\n\n- 层序遍历：这种方法的灵感源于广度优先 own（图算法中的 BFS）。\n\n在剩余的讨论中使用下图。\n\
  \n![Image](img/image0796.jpeg)\n\n### 序遍历\n\n在前序遍历中，每个节点在它的任一子树之前（前）被处理。这是最容易理解的遍历。然而，尽管每个节点在子树之前被处理，但仍然需要在向下移动树时维护某些信息。在示例中，首先处理根，然后是左子树，最后是右子树。\n\
  \n因此，在完成左子树的处理后必须返回右子树。为了在处理左子树后移动右子树，我们需要维护根的信息。这种信息的抽象数据类型（ADT）是栈。由于其后进先出的（LIFO）结构，可以反向获取子树的信息。\n\
  \n前序遍历定义如下：\n\n- 访问根\n- 遍历左子树\n- 遍历右子树\n\n节点的访问顺序为 1 2 4 5 3 7\n\n![Image](img/image0797.jpeg)\n\
  \n时间复杂度：`O(n)`。空间复杂度：`O(n)`。\n\n### 迭代前序遍历\n\n在递归版本中，需要栈是因为我们需要记住当前节点，以便在完成左子树后进入右子树。为了模拟这一点，首先处理当前节点，并在进入左子树之前将当前节点存储在栈中。在完成左子树后，`pop`\
  \ 元素并进入右子树。重复此过程直到栈为空。\n\n![Image](img/image0798.jpeg)\n\n时间复杂度：`O(n)`。空间复杂度：`O(n)`。\n\
  \n### 中序遍历\n\n在中序遍历中，根节点在两个子树之间被访问。中序遍历定义如下：\n\n- 遍历左子树\n- 访问根\n- 遍历右子树\n\n节点的访问顺序为\
  \ 4 2 5 16 3 7\n\n![Image](img/image0799.jpeg)\n\n时间复杂度：`O(n)`。空间复杂度：`O(n)`。\n\n\
  ### 非递归中序遍历\n\n中序遍历的非递归版本与前序遍历相似。唯一的区别在于，不是在进入左子树之前处理节点，而是在弹出（pop）后处理（这指示在完成左子树处理之后）。\n\
  \n### 后序遍历\n\n在后序遍历中，根节点在两个子树之后访问。后序遍历定义如下：\n\n- 遍历左子树\n- 遍历右子树\n- 访问根\n\n\n\n\n\
  \n树节点的访问顺序为：4 5 2 6 7 3 1\n\n![Image](img/image00801.jpeg)\n\n时间复杂度：`O(n)`。空间复杂度：`O(n)`。\n\
  \n### 非递归后序遍历\n\n在先序和中序遍历中，在从栈中弹出元素后，我们不需要再次访问同一个顶点。但在后序遍历中，每个节点会被访问两次。这意味着，在处理完左子树后，我们会访问当前节点，在处理完右子树后，我们会再次访问同一个当前节点。但我们应该在第二次访问时处理该节点。这里的问题在于如何区分我们是从左子树还是右子树返回的。\n\
  \n我们使用一个 `previous` 变量来跟踪较先访问的节点。假设 `current` 是栈顶的当前节点。当 `previous` 是 `current`\
  \ 的父节点时，我们正在向下遍历树。在这种情况下，如果可用，我们尝试遍历 `current` 的左孩子（即将左孩子推入栈中）。如果不可，我们查看 `current`\
  \ 的右孩子。如果左右孩子都不存在（即 `current` 是叶子节点），我们打印 `current` 的值并将其从栈弹出。\n\n如果 `previous`\
  \ 是 `current` 的左孩子，我们正在从左侧向上遍历树。我们查看 `current` 的右孩子。如果可用，则向下遍历右孩子（即将右孩子推入栈）；否则打印\
  \ `current` 的值并将其从栈弹出。如果 `previous` 是 `current` 的右孩子，我们正在从右侧向上遍历树。在这种情况下，我们打印 `current`\
  \ 的值并将其从栈弹出。\n\n![Image](img/image00802.jpeg)\n\n时间复杂度：`O(n)`。空间复杂度：`O(n)`。\n\n\
  ### 层序遍历\n\n层序遍历的定义如下：\n\n- 访问根节点。\n- 在遍历第 1 层时，将第 1+1 层的所有元素留在队列中。\n- 进入下一层并访问该层的所有节点。\n\
  - 重复此过程，直到完成所有层级。\n\n树节点的访问顺序为：1 2 3 4 5 6 7\n\n![Image](img/image00803.jpeg)\n\n\
  时间复杂度：`O(n)`。空间复杂度：`O(n)`。因为在最坏情况下，整个最后一层的所有节点可能同时存在队列中。\n\n### 二叉树：问题与解决方案\n\n\
  **问题-1** 给出一个寻找二叉树中最大元素的算法。\n\n**解决方案：** 解决此问题的一种简单方法是：找到左子树中的最大元素，找到右子树中的最大元素，将它们与根节点的数据进行比较，并选择值最大的那个。这种方法可以通过递归轻松实现。\n\
  \n![Image](img/image00804.jpeg)\n\n时间复杂度：`O(n)`。空间复杂度：`O(n)`。\n\n**问题-2** 给出一个不使用递归的寻找二叉树中最大元素的算法。\n\
  \n**解决方案：** 使用层序遍历：只需在删除时观察元素的数据即可。\n\n![Image](img/image00805.jpeg)\n\n时间复杂度：`O(n)`。空间复杂度：`O(n)`。\n\
  \n**问题-3** 给出一个在二叉树中搜索元素的算法。\n\n**解决方案：** 给定一棵二叉树，如果在树中找到具有数据的节点，则返回 true。递归向下遍历，通过将数据与每个节点的数据比较来选择左分支或右分支。\n\
  \n![Image](img/image00806.jpeg)\n\n时间复杂度：`O(n)`。空间复杂度：`O(n)`。\n\n**问题-4** 给出一个不使用递归的在二叉树中搜索元素的算法。\n\
  \n**解决方案：** 我们可以使用层序遍历来解决这个问题。层序遍历所需的唯一变化是，不再打印数据，而是只需要检查根节点的数据是否等于我们要搜索的元素。\n\n\
  ![Image](img/image00807.jpeg)\n\n时间复杂度：`O(n)`。空间复杂度：`O(n)`。\n\n**问题-5** 给出一个向二叉树中插入元素的算法。\n\
  \n**解决方案：** 由于给定的树是二叉树，我们可以在任何地方插入元素。要插入元素，我们可以使用层序遍历，并在发现左孩子或右孩子为 NULL 的节点处插入该元素。\n\
  \n![Image](img/image00808.jpeg)\n\n#### 递归方法\n\n![Image](img/image00809.jpeg)\n\n\
  时间复杂度：`O(n)`。空间复杂度：`O(n)`。\n\n**问题-6** 给出一个寻找二叉树大小的算法。\n\n**解决方案：** 递归地计算左右子树的大小，加上\
  \ 1（当前节点）并返回给其父节点。\n\n![Image](img/image00810.jpeg)\n\n时间复杂度：`O(n)`。空间复杂度：`O(n)`。\n\
  \n**问题-7** 我们能在不使用递归的情况下解决问题-6 吗？\n\n**解决方案：可以，** 使用层序遍历。\n\n![Image](img/image00811.jpeg)\n\
  \n时间复杂度：`O(n)`。空间复杂度：`O(n)`。\n\n**问题-8** 给出一个寻找二叉树大小的算法。\n\n**解决方案：** 为了寻找二叉树的大小，我们必须使用栈。我们可以使用后序、中序或先序遍历。这类似于后序遍历。我们需要额外的空间。对于以下，输出应该是：4\
  \ 5 2 6 7 3 1。\n\n![Image](img/image00812.jpeg)\n\n**问题-9** 给出一个反转层序遍历的算法。\n\n**解决方案：**\
  \ 例如，输出为：4 5 2 6 7 3 1\n\n![Image](img/image00813.jpeg)\n\n**问题-10** 给出一个寻找二叉树高度（或深度）的算法。\n\
  \n**解决方案：** 递归地计算左右子树的高度并将其赋值给节点。这类似于深度优先搜索（DFS）。\n\n![Image](img/image00814.jpeg)\n\
  \n时间复杂度：`O(n)`。空间复杂度：`O(n)`。\n\n**问题-11** 我们能用栈解决问题-10 吗？\n\n**解决方案：** 使用栈模拟递归。\n\
  \n![Image](img/image00815.jpeg)\n\n**问题-12** 我们能在不使用递归的情况下解决问题-10 吗？\n\n**解决方案：可以。**\
  \ 使用层序遍历。这类似于图算法中的 BFS（广度优先搜索）。层结束通过 NULL 来识别。\n\n![Image](img/image00816.jpeg)\n\
  \n**问题-13** 给出一个寻找二叉树最小深度的算法。\n\n**解决方案：**\n\n![Image](img/image00817.jpeg)\n\n\
  **问题-14** 给出一个寻找二叉树中最深节点的算法。\n\n**解决方案：** 层序遍历中处理的最后一个节点就是二叉树中最深节点。\n\n![Image](img/image00818.jpeg)\n\
  \n**问题-15** 给出一个从二叉树中删除元素（假设数据已知）的算法。\n\n**解决方案：** 二叉树中节点的删除可以实现为：\n\n- 从根开始，找到我们要删除的节点。\n\
  - 找到深度节点。\n- 用深度节点的数据替换要删除节点的数据。\n- 然后删除深度节点。\n\n**问题-16** 给出一个不使用递归的寻找二叉树中叶子节点数量的算法。\n\
  \n**解决方案：** 左右孩子均为 NULL 的节点集合被称为叶子节点。\n\n![Image](img/image00821.jpeg)\n\n**问题-17**\
  \ 给出一个不使用递归的寻找二叉树中满节点数量的算法。\n\n**解决方案：** 所有具有左右两个孩子的节点集合被称为满节点。\n\n![Image](img/image00822.jpeg)\n\
  \n\n\n\n\n### Problem-18\n给出一个不使用递归的查找二叉树中半节点（只有一个子节点的节点）数量的算法。\n\n**解决方案：** 所有具有左子节点或右子节点（但不同不同）的节点集合被称为半节点。\n\
