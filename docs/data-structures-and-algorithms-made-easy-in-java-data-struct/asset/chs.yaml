  \n**解：** 该算法解决了区间染色问题。注意，如果贪心算法为当前教室 `c[i]` 创建了新房间，那么因为我们按开始时间的顺序处理教室的，`c[i]` 的起点必须与所有当前房间中的最后一个教室相交。因此，当贪心创建最后一个房间\
  \ `n` 时，是因为当前教室的开始时间与 `n – 1` 个其他教室相交。但我们知道对于任何教室中的任何单点，它最多与 `s` 个其他教室相交，因此必然 `n\
