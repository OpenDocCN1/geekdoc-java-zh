  ### 题目-14\n给定一个大小为 `n × n` 包含随机整数的矩阵。给出一个算法，检查行是否与列匹配。例如，如果第 `i` 行与第 `j` 列匹配，且第\
  \ `i` 行包含元素 - `[2,6,5,8,9]`。那么；第 `j` 列也包含元素 - `[2,6,5,8,9]`。\n\n**解决方案：** 我们可以为列中的数据构建一个\
  \ `trie`（行也可以工作）。然后我们可以将行与 `trie` 进行比较。这将允许我们在行的开头不与任何列匹配时立即退出（回溯）。此外，这允许我们一次遍历中检查某行是否匹配所有列。\n\
  \n如果我们不想在空指针上浪费内存，可以通过构建 `suffix tree` 来进一步改进解决方案。\n\n### 题目-15\n给定一个包含‘X’和‘O’的二维网格，捕获所有被‘X’包围的区域。通过将包围区域内所有的‘O’翻转为‘X’来捕获区域。\n\
  \n![images](img/image01420.jpeg)\n\n**解决方案：** 我们使用回溯来识别未被‘X’包围的元素，并用临时符号（`$`）标记这些元素。未被‘X’包围的元素意味着存在从‘O’到边界的路径。因此，我们从边界开始回溯算法。最后是将临时元素替换为‘O’，其余元素替换为‘X’。\n\
