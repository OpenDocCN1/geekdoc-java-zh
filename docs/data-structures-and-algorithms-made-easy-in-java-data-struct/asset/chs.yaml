  \n在之前的章节中，我们解决了不同复杂程度的问题。某些算法的增长率较低，而另一些的增长率较高。增长率较低的问题被称为 `easy` 问题（或容易解决的问题），增长率较高的问题被称为\
  \ `hard` 问题（或困难的问题）。这种分类是基于算法解决问题时消耗的运行时间（或内存）的。\n\n![images](img/image01643.jpeg)\n\
  \n有很多问题我们不知道解决方案。我们目前为止看到的所有问题都是计算机可以在确定性时间内解决的问题。在开始讨论之前，让我们看看本章中使用的基本术语。\n\n###\
  \ 20.2 多项式/指数时间\n\n指数时间本质上意味着尝试每种可能性（例如回溯算法），它们在本质上非常慢。多项式时间意味着有一些巧妙的算法来解决问题，我们不需要尝试每种可能性。在数学上，我们可以将其表示为：\n\
  \n*   多项式时间为 `O(n^k)`，对于某些 `k`。\n*   指数时间为 `O(k^n)`，对于某些 `k`。\n\n### 20.3 什么是决策问题？\n\
  \n决策问题是一个具有 `yes/no` 回的问题，答案取决于输入的值。例如，“给定一个包含 `n` 个数字的数组，检查是否存在重复项？”就是一个决策问题。该问题的答案可以是\
  \ `yes` 或 `no`，取决于输入数组的值。\n\n![images](img/image01644.jpeg)\n\n### 20.4 决策程序\n\n\
  对于一个给定的决策问题，假设我们已经提供了一个解决它的算法。以算法形式解决给定的决策问题的过程被称为该问题的 `decision procedure`（决策程序）。\n\
  \n### 20.5 什么是复杂度类？\n\n在计算机科学中，为了理解那些没有解决方案的问题，我们将问题分为不同的类，并称它们为复杂度类。在复杂度理论中，`complexity\
  \ class`（复杂度类）一组具有相关复杂性的问题的集合。它是计算理论的一个分支，研究在计算过程中解决给定问题所需的资源。\n\n最常见的资源是时间（算法解决问题需要多少时间）和空间（需要多少内存）。\n\
  \n### 20.6 复杂度类的类型\n\n#### P 类\n\n复杂度类 `P` 是可以在确定性机器在多项式时间内解决的决策问题集合（`P` 代表多项式时间）。`P`\
  \ 问题是一组解决方案容易找到的问题集合。\n\n#### NP 类\n\n复杂度类 `NP`（`NP` 代表非确定多项式时间）是可以在非确定性机器在多项式时间内解决的决策问题集合。`NP`\
  \ 类问题是指一组解决方案难以找到但容易验证的问题集合。\n\n为了更好地理解，让我们考虑一所有 500 名学生的大学。此外，假设有 100 间房间供学生使用。必须选出\
  \ 100 名学生配对住在房间里，但教务主任有一份名单，列出了由于某些原因不能同住的学生配对。\n\n可能的配对总数太大了。但提供给教务主任的解决方案（配对列表）很容易检查错误。如果列表中包含被禁止的配对之一，那么就是一个错误。在这个问题中，我们可以看到检查每种可能性非常困难，但结果是容易验证的。\n\
  \n这意味着，如果有人给了我们一个问题的解决方案，我们可以在多项式时间内告诉他们它是否正确。根据上述讨论，对于 `NP` 类问题，如果答案是 `yes`，我们可以在多项式时间内进行验证。\n\
  \n#### Co-NP 类\n\n`Co-NP` 是 `NP` 的相反面。如果一个问题属于 `NP`，我们可以验证 YES 答案。同样，任何属于 `P` 的问题也在\
  \ `Co-NP` 中。\n\n| 类 | 描述 |\n| :--- | :--- |\n| `P` | 在多项式时间内求解 |\n| `NP` | YES 答案可以在多项式时间内验证\
  \ |\n| `Co-NP` | NO 答案可以在多项式时间内验证 |\n\n#### P, NP Co-NP, NP-Hard 和 NP-Complete 之间的关系\n\
  \n根据上述讨论，我们可以如下所示写不同组件之间的关系（记住，这只是一个假设）。\n\n![images](img/image01648.jpeg)\n\n\n\
  \n\n\n## P==NP 吗？\n\n如果 `P = NP`，意味着每个可以被快速检查的问题都可以被快速解决（记住检查答案是否正确与实际解决问题之间的区别）。\n\
  \n这是一个大问题（而且没有人知道答案），因为现在有许多 `NP` 完备问题是无法快速解决的。如果 `P = NP`，这意味着存在一种方法快速解决它们。请记住，“快速”意味着不需要反复试错。它可能需要十亿年，但只要我们没有使用试错，它就是快速的。在未来，计算机将能够把这十亿年变成几分钟。\n\
  \n## 20.7 归约 (Reductions)\n\n在讨论归约之前，让我们考虑以下场景。假设我们想要解决问题 `X`，但觉得它非常复杂。在这种情况下我们该怎么办？\n\
  \n脑海中浮出的第一件事是，如果我们有一个与 `X` 类似的问题（我们称其为 `Y`），那么我们就尝试将 `X` 映射到 `Y`，并使用 `Y` 的解来解决 `X`。这个过程被称为归约。\n\
  \n![images](img/image01649.jpeg)\n\n为了将问题 `X` 映射到问题 `Y`，我们需要一些算法，这可能需要线性时间或更长时间。根据这一讨论，解决问题\
  \ `X` 的代价可以给出：\n\n![images](img/image01650.jpeg)\n\n现在，让我们考虑另一种场景。为了解决问题 `X`，我们有时需要多次使用\
  \ `Y` 的算法（解）。在这种情况下，\n\n![images](img/image01651.jpeg)\n\n`NP`-完备问题的核心是可归约性。这意味着我们将给定的\
  \ `NP`-完备问题归约（或转换）为其他已知的 `NP` 完备问题。由于 `NP` 完备问题很难解决，为了证明给定的 `NP` 完备问题是困难的，我们取一个现有困难的问题（我们可以证明它是困难的），并尝试将给定的问题映射到它，最终证明给定的问题是困难的。\n\
  \n**注意：** 为了证明给定问题的困难性，并非必须将该问题归约为已知的困难问题。有时，我们将已知的困难问题归约为给定的问题。\n\n### 重要的 NP 完备问题（归约）\n\
  \n**可满足性问题 (Satisfiability Problem):** 如果一个布尔公式是若干子句的合取（AND），并在`合取标准范式` (CNF)，其中每个子句是若干个文字的析取（OR），而每个文字要么是一个变量，要么是它的否定。例如：`(a\
  \ ∨ *b* ∨ *c ∨ d* ∨ *e*)∧(*b* ∨ *~c* ∨ *~d*) ∧ (~a ∨ *c* ∨ *d*) ∨ (a ∨ *~b*)`\n\n\
  3-CNF 公式是每个子句恰好有三个文字的 CNF 公式。上面的例子不是 3-CNF 公式，因为它的第一个子句有五个文字，最后一个子句只有两个。\n\n**2-SAT\
  \ 问题：** 3-SAT 只是限制在 3-CNF 公式上的 SAT：给定一个 3-CNF 公式，是否存在变量的赋值使得公式求值为 TRUE？\n\n**2-SAT\
  \ 问题：** 2-SAT 只是限制在 2-CNF 公式上的 SAT：给定一个 2-CNF 公式，是否存在变量的赋值使得公式求值为 TRUE？\n\n**电路可满足性问题\
  \ (Circuit-Satisfiability Problem):** 给定一个由 AND、OR 和 NOT 门组成的布尔组合电路，它是否是满足的？这意味着，给定一个由导线正确连接的\
  \ AND、OR 和 NOT 门组成的布尔电路，`Circuit-SAT` 问题是判断是否存在输入赋值使得输出为 TRUE。\n\n![images](img/image1652.jpeg)\n\
  \n**哈密顿路径问题 (Hamiltonian Path):** 给定一个无向图，是否存在一条路径，使得每个顶点恰好访问一次？\n\n**哈密顿回路问题 (Hamiltonian\
  \ Cycle):** 给定一个无向图，是否存在一个回路，使得每个顶点恰好访问一次？\n\n**旅行推员问题 (Travelling Salesman Problem):**\
  \ 给定一组城市和它们之间的距离，是否存在一条访问每个城市一次的最短路径？\n\n**最短路径问题 (Shortest Path):** 给定一个由 AND、OR\
  \ 和 NOT 门组成的布尔电路，是否存在输入赋值使得输出为 TRUE？\n\n**电路可满足性问题 (Circuit-Satisfiability):** 给定一个由导线正确连接的\
  \ AND、OR 和 NOT 门组成的布尔电路，`Circuit-SAT` 问题是判断是否存在输入赋值使得输出为 TRUE。\n\n**图着色问题 (Graph\
  \ Coloring):** 给定一个图和颜色数量，是否存在一种着色方案，使得相邻顶点的颜色不同？\n\n**独立集问题 (Independent Set):**\
  \ 给定一个图，是否存在一个顶点集合，使得该集合中的任意两个顶点互不相连？\n\n**顶点覆盖问题 (Vertex Cover):** 给定一个图，是否存在一个顶点集合，使得图中的每条边都至少包含集合中的一个顶点？\n\
  \n**团问题 (Clique):** 给定一个图，是否存在一个顶点子集，使得该子集中的任意两个顶点都相连？\n\n**子和问题 (Subset Sum):**\
  \ 给定一个整数集合和一个目标值，是否存在一个子集，其元素之和等于目标值？\n\n**整数规划 (Integer Programming):** 给定一个线性目标函数和一组线性约束，是否存在整数解满足所有约束并最大化或最小化目标函数？\n\
  \n![images](img/image1653.jpeg)\n\n## 20.8 复杂度类：问题与解\n\n**问题-1：** 什么是快速算法？\n**解：**\
  \ 快速算法（解）意味着不需要反复试错。它可能需要十亿年，但只要我们没有使用试错，它就是快速的。未来，计算机将能够把这十亿年变成几分钟。\n\n**问题-2：**\
  \ 什么是高效算法？\n**解：** 如果算法满足以下属性，则认为是高效的：\n- 与输入规模相关。\n- 忽略常数项。\n- 多项式时间。\n\n**问题-3：**\
  \ 可以在多项式时间内解决所有问题吗？\n**解：不能** 因为我们见过许多问题需要超过多项式的时间。\n\n**问题-4：** 是否存在问题是 `NP-hard`？\n\
  **解：** 根据定义，`NP-hard` 意味着它是困难的。我们可以证明它是困难的。Cook 定理证明了电路满足性问题是 `NP-hard`。\n\n**问题-5：**\
  \ 对于 2-SAT 问题，哪些是可能的？\n(a) `P`\n(b) `NP`\n(c) `CoNP`\n(d) `NP-Hard`\n(e) `CoNP-Hard`\n\
  (f) `NP-Complete`\n(g) `CoNP-Complete`\n**解：** 2-SAT 是多项式时间内解决的。因此它是 `P`、`NP` 和\
  \ `CoNP`。\n\n**问题-6：** 对于 3-SAT 问题，哪些是可能的？\n(a) `P`\n(b) `NP`\n(c) `CoNP`\n(d) `NP-Hard`\n\
  (e) `CoNP-Hard`\n(f) `NP-Complete`\n(g) `CoNP-Complete`\n**解：** 3-SAT 是 NP 完备的。因此它是\
  \ NP、NP-Hard 和 NP 完备。\n\n**问题-7：** 对于 2-Clique 问题，哪些是可能的？\n(a) `P`\n(b) `NP`\n(c)\
  \ `CoNP`\n(d) `NP-Hard`\n(e) `CoNP-Hard`\n(f) `NP-Complete`\n(g) `CoNP-Complete`\n\
  **解：** 2-Clique 在多项式时间内解决的。因此它是 `P.NP` 和 `CoNP`。\n\n\n\n\n\n### 问题-8\n对于 3-Clique（三阶团）问题，以下哪些是应用的？\n\
  \n(a) `P`\n(b) `NP`\n(c) `CoNP`\n(d) `NP-Hard`\n(e) `CoNP-Hard`\n(f) `NP-Complete`\n\
  (g) `CoNP-Complete`\n\n**解答：** 3-Clique 可以在多式时间内求解（在 `O(n³)` 时间内检查所有顶点三元组之间是否存在三角形）。因此它是\
  \ `P`、`NP` 和 `CoNP`。\n\n### 问题-9\n考虑确定性问题。对于一个给定的布尔公式，检查变量的每一个赋值是否满足它。以下哪些是应用的？\n\
  \n(a) `P`\n(b) `NP`\n(c) `CoNP`\n(d) `NP-Hard`\n(e) `CoNP-Hard`\n(f) `NP-Complete`\n\
  (g) `CoNP-Complete`\n\n**解答：** 恒真式（Tautology）是满足性（Satisfiability）问题的对补问题，后者是 NP-完全的，因此恒真式是\
  \ `CoNP-complete`。所以它是 `CoNP`、`CoNP-hard` 和 `CoNP-complete`。\n\n### 问题-10\n设 `S`\
  \ 是一个 `NP`-完全问题，`Q` 和 `R` 是另外两个已知不在 `NP` 中的问题。`Q` 可多项式时间归约为 `S`，`S` 可多项式时间归约为 `R`。以下哪个陈述是正确的？\n\
  \n(a) `R` 是 `NP-complete`\n(b) `R` 是 `NP-hard`\n(c) `Q` 是 `NP-complete`\n(d) `Q`\
  \ 是 `NP-hard`。\n\n**解答：** `R` 是 `NP-hard` (b)。\n\n### 问题-11\n设 `A` 在图 `G = (V,E)`\
  \ 中寻找哈密顿环的问题，其中 `|V|` 可 3 整除，`B` 是确定此类图中是否存在哈密顿环的问题。以下哪个是正确的？\n\n(a) `A` 和 `B` 都是\
  \ `NP-hard`\n(b) `A` 是 `NP-hard`，但 `B` 不是\n(c) `A` 是 `NP-hard`，但 `B` 不是\n(d) `A`\
  \ 和 `B` 都不是 `NP-hard`\n\n**解答：** `A` 和 `B` 都是 `NP-hard` (a)。\n\n### 问题-12\n设 `A`\
  \ 是一个属于 `NP` 类的问题。请说明以下哪个是正确的？\n\n(a) `A` 没有多项式时间算法。\n(b) 如果 `A` 可以在多项式时间内确定性求解，那么\
  \ `P = NP`。\n(c) 如果 `A` 是 `NP-hard`，那么它是 `NP-complete`。\n(d) `A` 可能是不可判定的。\n\n**解答：**\
  \ 如果 `A` 是 `NP-hard`，那么它是 `NP-complete` (c)。\n\n### 问题-13\n假设已知 `Vertex – Cover`（顶点覆盖）是\
  \ `NP`-完全的。基于我们的归约，我们可以说 `Independent – Set`（独立集）是 `NP`-完全的吗？\n\n**解答：是的。** 这遵循成为\
  \ `NP-complete` 所需的两个条件：\n- 独立集在 `NP` 中，如问题所述。\n- 来自已知的 `NP`-完全问题的归约。\n\n### 问题-14\n\
  假设已知 `Independent Set`（独立集）是 `NP`-完全的。基于我们的归约，`Vertex Cover`（顶点覆盖）是 `NP`-完全的吗？\n\
  \n**解答：不是。** 通过从顶点覆盖到独立集的归约，我们并不知道求解独立集的难度。这是因为独立集可能是一个比顶点覆盖困难得多的问题。我们还没有证明。\n\n\
  ### 问题-15\nNP 类是不能在多项式时间内接受的语言类。这是正确的吗？请解释。\n\n**解答：**\n- NP 类是在多项式时间内可以被验证（verified）的语言类。\n\
  - `P` 类是在多项式时间内可以被判决（decided）的语言类。\n- `P` 类是在多项式时间内可以被接受（accepted）的语言类。\n\n`P ⊆\
  \ NP` 且“P 中的语言可以在多项式时间内被接受”，因此“NP 中的语言不能在多项式时间内被接受”的描述是错误的。\n\nNP 术语源于非确定性多项式时间，并源自对使用非确定性多项式时间图灵机的另一种表征。它与“不能在多项式时间内被接受”无关。\n\
  \n### 问题-16\n不同的编码会导致相同算法产生不同的复杂度。这是正确的吗？\n\n**解答：** 正确。相同算法在符号编码和二进制编码之间的时间复杂度是不同的。但如果两种编码是多项式相关的（例如基\
  \ 2 和基 3 编码），那么在它们之间切换就不会引起变化。\n\n### 问题-17\n如果 `P = NP`，那么 `NPC（完全） ⊆ P`。这是正确的吗？\n\
  \n**解答：** 正确。如果 `P = NP`，对于任何语言 `L ∈ NP` (1) `L ∈ NPC` (2) 都是 NP-hard。根据第一个条件，`L\
  \ ⊆ NP = P`。\n\n### 问题-18\n如果 `NPC ⊆ P`，那么 `P = NP`。这是正确的吗？\n\n**解答：** 正确。所有的 NP\
  \ 问题都可以多项式时间归约为任意 NPC 问题。\n\n\n\n\n\n对于给定的数字 `n`，为了分离最右侧的零位，我们可以使用表达式：`~n & n +\
