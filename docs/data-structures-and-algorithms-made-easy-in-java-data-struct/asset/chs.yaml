  \n## 8.1 引言\n\n在本章中，我们将表示一个重要的数学概念：*集合*。这意味着如何表示一组不需要任何顺序的元素。不交集集合 ADT 是用于此目的抽象类型。它被用于解决等价问题。它的实现非常简单。可以使用简单的数组来实现，每个函数只需要几行代码。不交集集合\
  \ ADT 是许多其他算法的辅助数据结构（例如图论中的 `Kruskal’s` 算法）。在开始讨论不交集集合 ADT 之前，让我们集合的一些基本属性。\n\n\
  ### 8.2 等价关系与等价类\n\n对于下面的讨论，假设 5 是一个包含元素的集合，并在上面定义了一个关系 `R`。这意味着对于 `a, b` ∈ 5 中的每一对元素，`a\
  \ R b`。\n\n### 8.3 不交集集合 ADT\n\n为了操作集合，我们需要定义集合上的基本操作。在本章中，我们关注以下操作：\n\n`MAKESET(X)`：创建一个包含单个元素\
  \ `X` 的新集合。\n\n`UNION(X, Y)`：创建一个包含元素 `X` 和 `Y` 的新集合。\n\n`FIND(X)`：返回元素 `X` 所在的集合名称。\n\
  \n### 8.4 应用\n\n不交集集合 ADT 有许多应用，其中一些是：\n\n- 表示网络连通性\n- 图像处理\n- 寻找公共祖先\n- 定义有限状态机的等价性\n\
  - `Kruskal’s` 最小树算法（图论）\n- 游戏算法\n\n### 8.5 实现不交集集合的权衡\n\n让我们看看实现集合操作的可能性。最初，假设输入元素是\
  \ `n` 个集合，每个集合一个元素。这意味着初始表示假设所有关系（反射关系除外）都是假的。\n\n为了添加关系 `a R b` (`UNION`)，我们首先需要检查\
  \ `a` 和 `b` 是否已经相关。这可以通过对 `a` 和 `b` 执行 `FIND` 并检查它们是否在同一个等价类（集合）中来验证。\n\n如果不是，我们就应用\
  \ `UNION`。该操作将包含 `a` 和 `b` 的两个等价类合并一个新的等价类，创建一个新集合 `S[k] = S[i] ∪ S[j]` 并删除 `S[i]`\
  \ 和 `S[j]`。基本上有两种方法可以实现上述 FIND/UNION 操作：\n\n- 快速 FIND 实现（也称为 Quick FIND）\n- 快速 UNION\
  \ 操作实现（也称为 Quick UNION）\n\n### 8.6 快速 FIND 实现 (Quick FIND)\n\n\n\n\n\n在此方法中，我们使用了一个数组。例如，在下面的表示中，数组包含了每个元素的集合名称。为了简单起见，我们假设所有元素都从\
  \ 0 到 `n` – 1 连续编号。\n\n在下例示例中，元素 0 的集合名称为 3，元素 1 的集合名称为 5，依此类推。通过这种表示法，`FIND` 只需要\
  \ `O(1)` 时间，因为对于任何元素，我们都可以通过常数时间访问其数组位置来找到集合名称。\n\n![images](img/image01043.jpeg)\n\
