  \n### 5.1 什么是队列\n\n队列是一种用于存储数据的结构，在 във端进行插入，在另一端进行删除。类似于栈，队列的到达顺序是重要的。通常，它是先进先出（FIFO）。在队列中，在队尾执行\
  \ `EnQueue`，在头部执行 `DeQueue`。在空队列上执行 `DeQueue` 被称为 `underflow`，在满队列上执行 `EnQueue`\
  \ 被称为 `overflow`。\n\n![Image](img/image0075.jpeg)\n\n### 5.2 队列如何使用\n\n队列的概念可以通过观察售票窗口的排队来解释。在队列中，位于队头部的人是下一个被服务的。这种行为在需要按到达顺序的情况下非常有用。例如，考虑在操作系统系统中按到达顺序调度的任务。\n\
  \n### 5.3 队列 ADT\n\n以下操作使队列成为 ADT。队列的插入和删除遵循 FIFO 方案。为了简单，我们假设元素是整数。\n\n#### 主队列操作\n\
  \n* `enQueue(int data)`：在队尾插入元素\n* `deQueue()`：移除并返回头部的元素\n\n#### 辅助队列操作\n\n* `Front()`：返回头部元素但不移除\n\
  * `QueueSize()`：返回队列存储的元素数量\n* `IsEmptyQueue()`：指示队列是否没有任何元素\n\n### 5.4 异常\n\n与其他\
  \ ADT 类似，在空队列上执行 `DeQueue` 会抛出“空队列异常”，在满队列上执行 `EnQueue` 会抛出“满队列异常”。\n\n\n\n\n\n\
  在下方所示示例中，可以清楚地看到数组的初始槽位被浪费了。因此，使用简单的数组实现队列并不是高效的。为了解决这个问题，我们假设数组是循环数组。这意味着我们将数组的最后一个元素和第一个数组元素看作是连续的。通过这种表示方法，如果开头有任何空槽位，尾指针（rear\
  \ pointer）就可以轻松地移动到下一个空槽位。\n\n![Image](img/image00765.jpeg)\n\n![Image](img/image00766.jpeg)\n\
  \n**注意：** 简单循环数组和动态循环数组的实现与栈数组实现非常相似。请参考*栈 (Stacks)*章节对这些实现进行分析。\n\n## 简单循环数组实现\n\
  \n![Image](img/image00767.jpeg)\n\n这种简单的队列 ADT 实现使用了数组。在数组中，我们循环地添加元素，并使用两个变量来跟踪起始元素和结束元素。通常，`front`\
  \ 用于指示队列的起始元素，`rear` 用于指示结束元素。\n\n存储队列元素的数组可能会满。此时`EnQueue` 操作将抛出 `full queue exception`（队列满异常）。同样，如果我们尝试从空队列中删除元素，它将抛出\
  \ `empty queue exception`（队列空异常）。\n\n**注意：** 初始，`front` 和 `rear` 都指向 -1，表示队列为空。\n\
  \n![Image](img/image00768.jpeg)\n\n![Image](img/image00769.jpeg)\n\n#### 性能与局限性\n\
  \n**性能：** 假设 *n* 是队列中元素的数量：\n\n| 空间复杂度（对于 *n* 次 enQueue 操作） | O(*n*) |\n| :--- |\
  \ :--- |\n| `enQueueQ` 的时间复杂度 | O(1) |\n| `deQueueQ` 的时间复杂度 | O(1) |\n| `isEmpty()`\
