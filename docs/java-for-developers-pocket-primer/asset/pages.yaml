    The recursive definition for calculating powers of 2 is here:


    ```

    recursive(0) = 1;

    recursive(n) = 2*recursive(n-1);

    ```


    The recursive definition for the preceding function is shown here:


    ```

    if(n== 0) { return 1; }

    else { return 2*prod(n-1); }

    ```


    The iterative code for the preceding function is shown here:


    ```

    int prod = 1;

    for(int i=1; i<=n; i++) {

    prod *= i;

    }

    ```


    Instead of invoking the preceding code, you can use the closed form solution for
    the sum of the integer from 1 to n: sum = 2^n.


    # Factorial Values


