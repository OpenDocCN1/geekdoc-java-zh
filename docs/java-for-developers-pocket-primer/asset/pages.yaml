    \ a directory, and then returns `true` if the directory was successfully created,\
    \ and `false` otherwise. Directory creation can fail for various reasons:\n\n\
    +   * the directory already exists\n* intermediate directories do not exist\n\
    * insufficient file permissions\n* the path belongs to another user (as root)\n\
