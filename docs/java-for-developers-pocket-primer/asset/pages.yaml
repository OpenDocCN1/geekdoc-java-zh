  md: "# 156 • Java for Developers Pocket Primer\n\nUnsynchronized Java classes are\
    \ not thread-safe and are intended for situations that do not involve race conditions\
    \ from multiple threads. For example, read-only operations do not require synchronization.\
    \ As a result, such classes tend to be simpler and also have better performance.\n\
    \nOne benefit of the Collection framework is its support for thread-safe counterparts\
    \ in case you need functionality. Before delving into Collections, let's take\
    \ a brief tour of Iterators, code samples that illustrate different iteration\
    \ techniques that have been used during different releases of Java.\n\n# ITERATORS\n\
    \nThis section discusses the notion of an Iterator and also different types of\
    \ iterators. You will see several code blocks that perform iterations in Java,\
    \ starting with the earliest release of Java. If you have already worked with\
    \ Iterators, then you can quickly skip this section.\n\n# What is an Iterator?\n\
    \nAn Iterator enables you to sequentially access all elements of a collection.\
    \ In effect, an iterator allows you to iterate (“loop”) over a collection of objects.\
    \ You can use iterators to loop through the elements of an array, files in a directory,\
    \ and the vertices of a graph. An iterator does not change a given collection,\
    \ but the operations that are performed on the elements of the collection can\
    \ change the collection.\n\n# Active versus Passive\n\nIn the case of an active\
    \ iterator, the client controls the creation of an iterator as well as the iteration\
    \ of an active iterator. By contrast, a passive iterator controls its iteration\
    \ over a Collection. Note that active iterators were used prior to Java 8, whereas\
    \ passive iterators were used in later versions of Java.\n\n# Enumeration: Old\
    \ Style Iteration\n\nIn the initial releases of Java, the Iterator design pattern\
    \ was implemented via the Enumeration class (which is part of legacy code), as\
    \ shown in this example:\n\n```\nVector words = new Vector();\n\n// populate 'words'\
    \ with some strings\n// . . .\nEnumeration e = words.elements();\nwhile (e.hasMoreElements())\
    \ {\n    nString word = (String) e.nextElement();\n    System.out.println(word);\n\
    }\n```"
