  md: '# JAVA AND SQL


    This chapter contains code samples that illustrate how to access data in MySQL
    tables from Java. The previous chapter contains code samples that showed you how
    to work with streams in Java, which is helpful for some of the material in this
    chapter.


    The first part of this chapter briefly introduces SQL (Structured Query Language)
    and explains major types of SQL statements: DCL, DDL, and DML. The second part
    of this chapter introduces you to the MySQL database, and shows you various ways
    of creating and dropping database tables.


    The second part of this chapter contains an assortment of SQL statements that
    contain the SELECT keyword. The third part of this chapter shows you how to write
    code for connecting with MySQL, how to drop and recreate a MySQL table, and how
    to select data from a MySQL table.


    > Note: Remember to set the environment variable CLSPATH as described later in
    this chapter for Java classes that access a MySQL database.


    # WHAT IS SQL?


    SQL is an initialism for Structured Query Language, which is used for managing
    data in a relational database (RDBMS). SQL commands can be classified in the following
    four categories:


    +   * DCL (Data Control Language)

    * DDL (Data Definition Language)

    * DQL (Data Query Language)

    * DML (Data Manipulation Language)


    The following subsections provide additional information for each item in the
    preceding list.'
  merge: -1
  img_proc: true
- pgno: 224
  md: '# What is DCL?


    DCL is an acronym for Data Control Language, which refers to any SQL statement
    that contains the keywords GRANT or REVOKE. These keywords grant or revoke access
    permissions, respectively, from any database user.


    For example, the following SQL statement grants (gives) user ABC permission to
    view and modify records in the employee table:


    ```

    GRANT ALL ON employee

    TO ABC;

    [WITH GRANT OPTION]

    ```


    The GRANT enables a user to grant privileges to other database users. By contrast,
    the following SQL statement revokes (removes) UPDATE privileges on the employee
    table from ABC:


    ```

    REVOKE UPDATE

    ON employee

    FROM ABC;

    ```


    # What is DDL?


    DDL is an acronym for Data Definition Language, which refers to any SQL statements
    that contain the following keywords:


    +   * CREATE

    * ALTER

    * DROP

    * RENAME

    * TRUNCATE

    * COMMENT


    The preceding list of keywords can appear in SQL statements that refer to tables
    as views (discussed later). Here are partial examples of the way to use the keywords
    in the preceding list:


    ```

    ALTER TABLE

    CREATE/DROP/TRUNCATE tables

    CREATE TABLE abc as (SELECT * from def);

    CREATE/DROP/TRUNCATE views

    CREATE/DROP indexes

    ```


    # DELETE vs. DROP vs. TRUNCATE


    These have important differences. The DELETE keyword and the TRUNCATE keyword
    both delete data from a table, but there can be a significant performance difference.
    Consider the following SQL statements (the first two delete all the rows from
    the customers table):


    ```

    DELETE * FROM customers;

    TRUNCATE customers;

    DROP TABLE customers;

    ```'
