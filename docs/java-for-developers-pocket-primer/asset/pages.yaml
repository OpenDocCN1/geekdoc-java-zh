- pgno: 15
  md: '# WHAT YOU NEED TO KNOW FOR THIS BOOK


    You need an understanding of OOP (Object Oriented Programming), Java, and XML.
    Knowledge of another OO programming language instead of Java might be sufficient,
    but to be on the safe side, glance through the code samples to gauge whether or
    not you can manage the material.


    # THE TARGET AUDIENCE


    This book is intended to reach an international audience of developers with highly
    diverse backgrounds in various age groups. While many readers know how to read
    English, their native spoken language is not English (which could be their second,
    third, or even fourth language). Consequently, this book uses standard English
    and avoids colloquial expressions that might be confusing to those readers. As
    you know, many people learn by different types of mimicry, which includes reading,
    writing, or hearing new material. This book takes these points into consideration
    in order to provide a comfortable and meaningful learning experience for the intended
    readers.


    # GETTING THE MOST FROM THIS BOOK


    Some developers learn from prose, others learn from sample code (and lots of it),
    which means there''s no single style that works perfectly for everyone.


    Moreover, some programmers want to run the code first, see what it does, and return
    to the code to understand the details (and others use the opposite approach).


    Consequently, there is a variety of code samples in this book. Some are short,
    some are long, and other code samples “build” from earlier code samples.


    # HOW DOES THIS BOOK HELP ME?


    You will acquire an understanding of various “core” concepts in Java, along with
    an understanding of how to use many Java APIs. What you decide to learn about
    Java after you reading this Java Primer depends on your goals and career path.
    For example, if you are a developer, you will undoubtedly continue learning about
    Java. On the other hand, if you are in management, you will understand enough
    Java to interact on a technical level with Java developers.'
  merge: -1
  img_proc: true
- pgno: 16
  md: '# WHAT IS THE DEVELOPMENT STACK FOR THE CODE SAMPLES?


    The code samples in this book were developed using an early release of Java 13
    on a MacBook Pro with OS X 10.10 (Mavericks).


    # WHY SO MANY SHORT CODE SAMPLES?


    This book is for developers who are new to Java development. The code samples
    are intended to help you gain an understanding of various Java APIs, and that''s
    why every code sample is at most two pages in length (and often less than one
    page). The focus is to provide code for Java features that you are likely to need
    in your Java applications. Shorter code samples means that more Java APIs can
    be included in this book.


    # HOW WAS THE TABLE OF CONTENTS DETERMINED?


    The decision process was as objective as possible, and it involved several criteria.
    The first criterion was to include “must have” concepts that are common in Java
    applications. The second criterion was to include “nice to have” functionality
    that would apply to Java novices. The third criterion involved Java APIs that
    could be relevant useful for people who want to write “serious” Java applications.


    Examples of such APIs include social connectivity (Facebook and Twitter). The
    fourth criterion involved Java APIs that are needed for Java applications in the
    book.


    # WHICH JAVA TOPICS ARE EXCLUDED AND WHY?


    The Java features that do not meet any of the criteria listed in the previous
    section are not included in this book. Consequently, there is no coverage of Java
    Native Interface (JNI), which allows Java to invoke C/C++ functions. In addition,
    AWT, Java Swing, JavaFX, Java Servlets, JSPs, JAXB, JAXP, JAXR, JEE, and Java
    Security are not covered in this book. However, you can find a plethora of online
    blog posts and articles that discuss these topics.


    # WHAT SHOULD I READ AFTER FINISHING THIS BOOK?


    The answer to this question varies widely, mainly because the answer depends heavily
    on your objectives. Specifically, you need to decide how much effort you are prepared
    to invest in furthering your knowledge. The amount of time that you need to make
    significant advances in your technical expertise also depends on your current
    level of technical knowledge'
  merge: -1
  img_proc: true
