    # A QUICK INTRODUCTION TO INHERITANCE


    Although the fundamental concept of inheritance in OOP is straightforward, there
    are aspects of inheritance that might be confusing if you are new to this concept.
    Let''s consider a Venn diagram with circles A and B, and that A is a proper subset
    of B. Thus, B has everything that is in A, but there are things in B that are
    not in A. From a setoretic perspective, A is a subset of B; B is a subclass of
    A.


    Here is the key point: an instance of class A can be replaced by an instance of
    class B, but an instance of class B cannot be replaced by an instance of class
    A.


    With the preceding thought in mind, let''s look at Listing 5.4 that displays the
    content of SubClassB that is a subclass of ClassA that is defined in Listing 5.2.'
