    Notice the next snippet of commented-out code in Listing 5.4: if uncomment this
    code, you will get a compilation error because al is an instance of ClassA and
    not an instance of SubClassB. As we noted, an instance of SubClassB cannot be
    replaced by an instance of ClassA; therefore, al cannot be cast as an instance
    of SubClassB.


    Recall that if B is subclass of A, then B has access to the non-private members
    of A, but does not have access to members of B. In the case of subclass and then
    constructors are invoked in a sequence that starts from the parent class and then
    "downward" to the subclasses.


    For example, suppose that A is a class, and B is a subclass of A, and C is a subclass
    of B. When an instance of C is created, the sequence of constructor invocations
    is A, then B, and then C.


    # The final Modifier with Java Methods and Classes


    You can prevent a method in class A from being overridden in class B by designating
    that method as final. In general, you can also prevent a class from being subclassed
    by declaring that class as final. When would this functionality be useful? Suppose
    that you give someone a JAR file that contains compiled classes but nothing is
    declared as final. Then the other person can import your classes and override
    your final by defining subclasses of yours.


    # WORKING WITH VALUE OBJECTS IN JAVA


    A value object is a class that only keeps track of the attributes of a logical
    entity, which typically involves setters and getters and a constructor. For example,
    suppose a student registers for multiple courses, and you want to keep track of
    those courses.'
