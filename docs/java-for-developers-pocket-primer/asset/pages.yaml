- pgno: 226
  md: '# 208 • Java for Developers Pocket Primer


    In most cases, the preceding keywords modify the existing values of data in one
    or more tables. The following SQL statement specifies the INSERT keyword to insert
    a new row into the user table (the user table is defined later in this chapter):


    ```

    INSERT INTO user VALUES (1000, ''Developer'');

    ```


    The following SQL statement contains an example of the UPDATE keyword to update
    an attribute of a row:


    +   * UPDATE user

    * SET TITLE = ''Team Lead''

    * WHERE USER_ID = 1000;


    The following SQL query can affect multiple rows in the TAX_INFO table:


    ```

    UPDATE tax_info

    SET tax_rate = tax_rate + 0.05;

    ```


    # What is TCL?


    TCL is an acronym for Transaction Control Language, which refers to SQL statements
    that contain any of the following keywords:


    +   * COMMIT

    * ROLLBACK

    * SAVEPOINT

    * SET TRANSACTION


    The COMMIT keyword commits the results of a SQL statement or a transaction to
    the underlying database, whereas the ROLLBACK keyword serves the opposite purpose.
    The SAVEPOINT keyword identifies a point at which a subsequent transaction can
    be rolled back, which occurs when the ROLLBACK keyword appears in a SQL statement
    that is executed. The SET TRANSACTION statement is used to specify various characteristics
    of the current transaction, such as the start of a transaction. When the transaction
    is completed, either the COMMIT keyword or the ROLLBACK keyword is invoked.


    # WORKING WITH MYSQL


    Oracle provides the MySQL database, which you can download for your operating
    system:


    ```

    https://dev.mysql.com/downloads/

    ```


    Download the MySQL distribution for your machine and perform the installation
    procedure.'
