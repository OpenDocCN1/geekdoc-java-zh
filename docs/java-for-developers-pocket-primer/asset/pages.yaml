    # SERIALIZATION\n\nJava supports a byte stream of serialization, which enables\
    \ you to convert an object into a stream that you can send the object over a network\
    \ or store the object on a disk. If you want to support serialization in a custom\
    \ Java class, then that class must implement the Serializable interface. Note\
    \ that a serialized object in Java does not contain code.\n\nJava serialization\
    \ is performed via reflection in order to obtain the data from the fields (including\
    \ private and final) in a given object that you want to serialize. Moreover, if\
    \ a given field contains an object, Java will recursively perform serialization\
    \ on that object.\n\nThe ObjectOutputStream class is used to serialize an object.\
