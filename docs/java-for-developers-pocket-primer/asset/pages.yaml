  md: "# Introduction to OOP • 137\n\nIn simplified terms, a course contains attributes\
    \ its name, its description, and number of credits for the course. Hence, each\
    \ course can be maintained via a value object you will not perform any operations\
    \ on the name, description, or the number of credits. As a result, you only need\
    \ to create an instance of this class that you can add to the list of courses\
    \ for each student.\n\nEntities and value objects often have a master/detail relationship,\
    \ such as PurchaseOrder and LineItem, Employee and Department, Person and Address,\
    \ also Customer and PurchaseOrder. Some entities can contain references to multiple\
    \ entities and/or value objects. For example, a Customer can have many PurchaseOrder\
    \ instances, of which can contain one or more LineItem entities.\n\nHowever, Student\
    \ and Course have a many-to-many relationship because a single student can enroll\
    \ in multiple courses, and a single course can have multiple students enrolled.\
