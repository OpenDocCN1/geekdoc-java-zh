  md: '# WORKING WITH EXCEPTIONS IN JAVA


    An exception occurs when your code expects data of a certain type but of an incompatible
    type is received, so your code cannot process that data. Handling exceptions is
    important because they can occur in various situations, such as an array that
    is out of bounds, opening or closing streams, and missing files.


    For example, suppose that your code prompts for numeric input from the command
    line in order to print twice the input value. If the input string can be converted
    to a numeric value (such as A123), then your code will work as expected, but if
    the input string cannot be converted to a numeric value (such as A123), then your
    code will throw an exception.


    Java provides exceptions that handle a variety of scenarios that can occur during
    the execution of your Java program, some of which are listed here:


    +   * Division by zero exception

    * Conversion error (string -> int) exception

    * Database exception

    * File not found exception

    * JVM out-of-memory exception

    * Network-related exception


    A partial list of so-called "checked" Java exceptions are as follows:


    +   * ArithmeticException

    * ClassNotFoundException

    * InputMismatchException

    * InvocationTargetException

    * IOException

    * NumberFormatException

    * SQLClientInfoException

    * SQLException


    The first two exceptions in the preceding list occur during a division by zero
    (or square root of a negative number) and when a Java class is not found, respectively.
    The InputMismatchException occurs when the Scanner instance does not match the
    expected type. The InvocationTargetException "wraps" an exception that is thrown
    by an invoked method or a constructor.


    An IOException occurs during file IO stream operations (e.g., file not found).
    A NumberFormatException occurs during a conversion between data types (e.g., from
    a String to an int). Finally, the two SQL-related exceptions pertain to database
    errors.'
