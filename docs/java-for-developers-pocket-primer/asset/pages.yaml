    There are also interfaces in the java.io, such as DataInput and DataOutput. Recall
    that the preferred practice is to specify interfaces (rather than concrete objects
    or primitive types) as parameters for methods, and also when you instantiate objects.
    The reason for doing so is that you pass any instance of a class (directly or
    indirectly) implements the specified interface. Keep this point in mind when you
    see examples in this chapter that you use the DataInput and DataOutput interfaces
    of the java.io package.


    As mentioned earlier, the java.io package contains two abstract Java classes InputStream
    and OutputStream that are the base classes for the other stream-oriented classes,
    and they are discussed in the next section.


    # THE ABSTRACT INPUT CLASS


    As learned in the previous section, InputStream is an abstract class, and every
    method in InputStream-based classes throws a java.IOException, which in turn is
    a subclass of the Exception class. The InputStream provides a read() method (along
    with its variants) to read data from an input stream. Since the read() method
    also waits until data is available, the read() method is a "blocking" method.


    When an application makes an API call and "waits" for the result, the application
    does not wait for the result, then the API is an asynchronous API, and typically
    the API specifies a "callback" function to invoke when it is returned to the application.


    In the case of input and output streams, you are responsible for closing those
    streams after you have finished using them. In general, you close an input stream
    in a catch block in the case of an error, and then in the block during normal
    code execution.


    # THE FILEINPUT CLASS


    The FileInputStream class can be used to read data from a file on the file system,
    as shown in this code snippet:


    ```

    InputStream is = new FileInputStream("/path/and/fileName");

    ```


    Notice that the left side of the preceding code snippet specifies InputStream,
    whereas the right side specifies the FileInputStream class. The reason this code
    works is because FileInputStream is a subclass of InputStream (which is an abstract
    class).


    Recall from Chapter 4 that if B is a subclass of A, then occurrences of A can
    be replaced with occurrences of B, so both of the following code snippets are
    valid:


    ```

    A a1 = new A();

    A a2 = new B();

    ```'
