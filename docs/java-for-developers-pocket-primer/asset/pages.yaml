- pgno: 19
  md: '# CHAPTER 1


    # INTRODUCTION TO JAVA


    This chapter introduces the basic features of Java, along with code samples that
    illustrate those features. In many cases, the accompanying Java code samples are
    succinct, especially when the purpose of the code is intuitive. The files for
    this book contain additional code samples that illustrate other features of Java
    that are not covered in this chapter.


    The first part of this chapter contains a very brief introduction to Java, as
    well as a link for downloading Java onto your machine. You will also learn about
    Java data types and operators, as well as their precedence.


    The second section shows how to create, compile, and launch a Java class from
    the command line. You will learn how to create a “Hello World” code sample and
    how to work with numbers, random numbers, and trigonometric functions in Java.


    The third section covers Java characters and strings, and the purpose of the new
    operator. You will also learn how to determine if two strings are equal, and some
    other string-related function in Java.


    Note that occasionally you will see references to a Java class that is not fully
    explained in the chapter. For example, Listing 1.17 contains an example of autoboxing
    that invokes the ArrayList class without an explanation of the latter class. However,
    this happens infrequently, and you can find additional details using online documentation.


    One other detail: the last code samples in this chapter are marked “optional”
    because you can skip them and proceed directly to Chapter 2 with no loss of continuity.
    They are included in case you are eager to see code samples that go beyond the
    basic concepts illustrated in the other code samples in this chapter.'
  merge: -1
  img_proc: true
- pgno: 20
  md: '# A VERY BRIEF INTRODUCTION TO JAVA


    Java is an object-oriented programming language that enables you to run your code
    on many different hardware platforms, including desktops, mobile devices, and
    Raspberry PI.


    You need to install a platform-specific Java distribution for each platform where
    you intend to launch Java code (see the next section for details). Although Java
    17 is the current production version of Java, earlier versions of Java are still
    supported.


    # Java Release Dates


    The following bullet list contains the release dates of Java, ranging from Java
    7 to Java 18:


    +   * Java SE 7 (July/2011)

    * Java SE 8 (March/2014)

    * Java SE 9 (Sept/2017)

    * Java SE 10 (Mar/2018)

    * Java SE 11 (Sept/2018)

    * Java SE 12 (March/2019)

    * Java SE 13 (Sept/2019)

    * Java SE 14 (March/2020)

    * Java SE 15 (Sept/2020)

    * Java SE 16 (March/2021)

    * Java SE 17 (Sept/2021)

    * Java SE 18 (July/2022)


    As you can see, six years elapsed between Java7 and Java9, after which new Java
    versions were released at a more accelerated rate.


    The following link contains a diagram of the Java 2021 roadmap as well as a layout
    of Java features:


    https://medium.com/javarevisited/the-java-programmer-roadmap-f9db163ef2c2


    If you want to know about the new features that were introduced in different Java
    releases, visit the following website:


    https://www.javatpoint.com/history-of-java


    # Downloading a Java Release (Short Version)


    In view of the many Java releases that are available, how do you decide which
    version will be best for you? The answer to this question probably involves one
    or more of the following:


    +   * The version of Java that your company uses

    * The latest LTS (long term support)'
  merge: -1
  img_proc: true
- pgno: 21
  md: '+   * The version of Java that you prefer

    * The latest version of Java

    * The features of Java that you need


    One other point to keep in mind: you can also download multiple versions of Java
    onto your machine if you want to address all the points in the preceding bullet
    list.


    After you have made a determination regarding the version(s) of Java that will
    work best for you, navigate to the following website and then download the Java
    distribution for your machine:


    https://docs.oracle.com/javase/10/install/toc.htm


    # SELECTING A VERSION OF JAVA (DETAILED VERSION)


    Java 17 is available as this goes to print, and Java 18 will be released in July
    2022. Older versions of Java had release cycles that sometimes involved three
    or more years, whereas newer versions of Java have been released every six months.
    The newer releases usually have a much more limited set of updates.


    # Java 8 and Java 11


    Java 8 and Java 11 previously had LTS (Long Term Support) status and currently
    Java 17 has LTS status. Due to various factors, some companies are still working
    with Java 8, which was one of the most significant releases in the history of
    Java. If you are interested, the Oracle website contains a list of the features
    of Java 8. In fact, Java 8 will work correctly in all subsequent releases, up
    to and including Java 17.


    However, Java 8 and Java 11 have been deprecated, and currently Java 17 has LTS
    status. So, which version of Java is recommended? The answer depends on your requirements.
    If you are unencumbered with maintaining or developing code for older Java versions,
    then it is probably safe to work with Java 17. If you don''t have a choice, consider
    working with Java 13, Java 11, or Java 8 (in this order).


    Navigate to the following URL for information regarding earlier versions of Java
    and release dates for future versions of Java:


    https://www.oracle.com/java/technologies/java-se-support-roadmap.html


    # Java Version Numbers


    Until Java 8, the numbering sequence had the form 1.x. Hence, Java 7 was also
    called Java 1.7, and Java 8 was called Java 8. However, this naming convention
    has been dropped starting from Java 9. For example, you'
  merge: -1
