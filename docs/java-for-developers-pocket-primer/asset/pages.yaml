  md: 'purpose. You will see code samples that involve of some of these interfaces
    later in the chapter.


    The Collection interface enables you to work with groups of objects; it is at
    the top of the Collection hierarchy.


    The List interface extends Collection and an instance of List stores an ordered
    collection of elements.


    The Set interface contains the same methods as Collection, along with the constraint
    that a set must contain unique elements. SortedSet extends Set to handle sorted
    sets.


    Map maps unique keys to values, and Map.Entry is an inner class of the class Map
    that describes an element (a key/value pair) in a map.


    SortedMap extends so that the keys are maintained in ascending order. Enumeration
    is a legacy interface and defines the methods by which you can enumerate (obtain
    one at a time) the elements in a collection of objects. As you saw in a previous
    section, the Iterator supersedes the Enumeration interface.


    # THE COLLECTION CLASSES


    Java provides two types of collection classes that implement the Collection interfaces:
    some provide full implementations and abstract classes. Recall that you cannot
    instantiate an abstract class. First, you must extend an abstract class with a
    class that implements the abstract methods in the abstract class.


    The Collection framework provides several general-purpose implementations of the
    core interfaces. In particular, the most common implementation for the List, Map,
    Deque, Queue, and Set interfaces are the ArrayList, HashMap, ArrayDeque, LinkedList,
    and HashSet, respectively.


    An extensive list of the standard collection classes is here, with a one-sentence
    description of their purpose:


    +   * AbstractCollection: implements most of the Collection interface

    * AbstractList: extends AbstractCollection and implements most of the List interface.

    * AbstractSequentialList: extends AbstractList for use a collection that uses
    sequential rather than random access to its elements

    * LinkedList: implements a linked list by extending AbstractSequentialList

    * ArrayList: implements a dynamic array by extending AbstractList

    * AbstractSet: extends AbstractCollection and implements most of the Set interface

    * HashSet: extends AbstractSet for use with a hash table

    * LinkedHashSet: extends HashSet to allow insertion-order iterations

    * TreeSet: implements a set stored in a tree. AbstractSet

    * AbstractMap: implements most of the Map interface'
