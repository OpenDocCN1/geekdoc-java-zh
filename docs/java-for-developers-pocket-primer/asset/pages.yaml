    # GENERIC METHODS


    Generic methods enable you to specify one method that can perform the same operation
    on multiple sets of elements. For example, you can write one generic method for
    sorting array of objects, and then invoking the method with an array of Integer,
    Double, or String values.


    Generic methods also provide compile-time checking, which means that you can find
    invalid data types during the compilation stage. The rules for defining a Generic
    method are listed here:


    +   * A generic method declaration has a parameter section delimited by angle
    brackets (< and > that precedes the return type of the method.

    * Each type parameter section contains one or more type parameters (i.e., a generic
    name) separated by commas.

    * The type parameters can only represent reference types, not primitive types
    (such as int, char, and so forth).

    * The type parameters can be used to declare the return type and serve as placeholders
    for the types of the arguments passed to the generic method.

    * The body of a generic method is declared in the same manner as any other method.


    Listing 6.12 displays the content of Generic1.java that illustrates how to define
    a generic method that can print arrays that contain different types of values.'
