  md: '# CHAPTER 7


    # # STREAMS AND FILES


    This chapter introduces you to Java streams, which enable you to perform various
    tasks, such as read characters from the console, read data from files and write
    data to files, and handle streams of data coming from Web services or other sources.


    The first part of this chapter provides a quick overview of streams and some stream-oriented
    classes. You will see that some of these classes to read input from the console.
    After reading these code samples, compare them with the code samples for reading
    user input in Chapter 1.


    The second part of this chapter involves file-oriented classes for reading files,
    such as the FileInputStream, FilterInputStream, BufferedReader, and DataInputStream.
    You will learn how to read characters from the console and how to read line-oriented
    user input with these classes. This section also shows how to count characters
    in a file and how to search for a string in a file.


    The third part of this chapter involves file-oriented classes for writing data
    to files, such as the FileWriter and BufferedWriter classes. This section also
    shows how to list the files in a directory, and then you will learn about serialization
    and deserialization of data.


    # WORKING WITH STREAMS IN JAVA


    A stream is a high-level concept that refers to a source of data or a destination
    for data. The specific types of sources and destinations are implemented via lower
    level classes. For example, the notion of a file can be a physical file on your
    disk (for read/write operations), or an output file can be a printer. Streams
    and files have one thing in common: either you are getting data from some location,
    or you are sending (writing) data to a location, or both.'
