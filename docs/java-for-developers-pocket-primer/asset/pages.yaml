  md: '# CHAPTER 3


    # METHODS AND CONSTRUCTORS


    This chapter describes different types of methods that you can define in a custom
    Java class. You will also learn about the different permission levels to invoke
    methods and access variables in a Java class. In addition, this chapter contains
    code samples that illustrate about various ways to invoke Java constructors and
    methods.


    The first part introduces you to the public, protected, and private attributes
    for methods, as well as variables in a Java class, and how these attribute determine
    the accessibility of variables and methods in a given Java class from other Java
    classes.


    The second part of this chapter discusses static variables, methods, and static
    code blocks in a Java class. Next, you will learn how to construct arrays of instances
    of a custom Java class.


    The third part of this chapter contains five Java code samples to illustrate various
    ways that you can invoke a constructor in a custom Java class. This section also
    introduces to anonymous inner classes, Java named inner classes, and private constructors.


    The fourth part of this chapter discusses the Java import statement and explains
    the purpose of the package statement, along with some code samples that show you
    how to use the package statement.


    The final portion of this chapter discusses JAR files, as well as their purpose
    and how to use the jar utility to create JAR files.


    # WHAT IS A JAVA CLASS?


    As you have seen in previous code samples, a Java class consists of methods and
    data, and an object is an instance of a Java class. An object is created via the
    new keyword. The filename and the name of the class inside the file'
  merge: -1
