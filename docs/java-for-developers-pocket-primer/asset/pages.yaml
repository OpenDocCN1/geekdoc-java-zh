- pgno: 225
  md: '# Java and SQL • 207


    The DELETE statement sequentially processes all rows in the customers table, whereas
    the TRUNCATE statement performs one operation to remove all rows from the customers
    table. Hence, TRUNCATE can be much faster than DELETE when a table contains a
    large number of rows. By contrast, the DROP statement eliminates the rows and
    the customers table.


    Of course, if you want to remove a subset of the rows of the customers table,
    then you must specify a WHERE clause, so the required SQL statement would be something
    like this:


    ```

    DELETE *

    FROM customers;

    WHERE cust_id < 10000;

    ```


    # What is DQL?


    DQL is an acronym for Data Query Language, which refers to any SQL statement that
    contains the keyword SELECT. Note that DQL can involve selecting a subset of data
    as well as deleting a subset of data, as shown in the following pair of SQL statements:


    ```

    SELECT *

    FROM customers

    WHERE cust_id < 10000;

    ```


    ```

    DELETE *

    FROM customers

    WHERE cust_id IN

    (SELECT cust_id FROM customers

    WHERE cust_id < 10000);

    ```


    Although both of the preceding statements have the same effect, the first one
    is more efficient than the second one, which is also called a correlated subquery
    because the same table is referenced in the outer SQL query and the inner SQL
    query.


    # What is DML?


    DML is an acronym for Data Manipulation Language, which refers to SQL statements
    that execute queries against one or more tables in a database. DML statements
    are SQL statements that contain any of the following keywords:


    +   * INSERT

    * UPDATE

    * DELETE

    * MERGE

    * CALL

    * EXPLAIN PLAN

    * LOCK TABLE'
