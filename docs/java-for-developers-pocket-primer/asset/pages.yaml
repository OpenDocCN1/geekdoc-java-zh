  md: '# Java for Developers Pocket Primer


    The preceding observation in mind, Java input streams read data from a stream
    whereas Java output streams write data to a stream. Java provides the package
    java.io with stream-related classes that contain methods for manipulating text
    files and binary files. The java.io package contains more than 50 classes that
    serve as readers, writers, input streams, and output streams. Some of the stream-related
    classes include the following:


    +   * BufferedOutputStream

    * ByteArrayOutputStream

    * DataOutputStream

    * FileOutputStream

    * FilterOutputStream

    * InputStream

    * ObjectOutputStream

    * OutputStream

    * PipedOutputStream

    * OutputStreamWriter

    * PipedInputStream


    Most of these output streams have corresponding input streams in the java.io package.
    Stream operations can obviously encounter errors, which are handled by the classes
    Exception, FileNotFoundException, and IOException.


    The abstract InputStream and OutputStream are the top-level classes of the byte
    stream hierarchy, and both of them throw an IOException when an error occurs.
    For example, you can read input via System.in, which is actually a subclass of
    InputStream that contains three versions of the read() method. These three versions
    read a stream, and return -1 when the end of a stream is encountered.


    However consider using a buffered class for input or output instead of its non-buffered
    class to improve performance. For example, the class BufferedInputStream has a
    constructor that takes an InputStream as a parameter; similarly, the BufferedOutputStream
    has a constructor that takes an OutputStream as a parameter.


    As a specific example, whenever you write data to a file on your disk or read
    data from a file on your disk, you can be assured that these operations involve
    buffered input and output. Word processors also work in this fashion. You can
    search for the full list of methods that are available for the classes in the
    java.io package.


    Another key point: when you invoke methods in the classes in the java.io package'
