  md: "# CHECKING FOR PALINDROMES\n\nA palindrome is a sequence of digits or characters\
    \ that are identical when you read them on both directions (i.e., from left to\
    \ right and from right to left). For example, the string BoB is a palindrome,\
    \ and Bob is not a palindrome. Similarly, the number 12321 is a palindrome, but\
    \ 1232 is not a palindrome.\n\nListing 4.4 displays the content of Palindromes1.java\
    \ that checks if a given string or number is a palindrome.\n\n# LISTING 4.4: Palindromes1.java\n\
    \n```\npublic class Palindromes1 {\n    public Palindromes1() {}\n    public void\
    \ calculate(String str) {\n        int result = 0;\n        int len = str.length();\n\
    \        for (int i=0; i<len/2; i++) {\n            if(str.charAt(i) != str.charAt(len-1-i))\
    \ {\n                result = 1;\n                break;\n            }\n    \
    \    }\n        if(result == 0) {\n            System.out.println(str + \": is\
    \ a palindrome\");\n        } else {\n            System.out.println(str + \"\
    : is not a palindrome\");\n        }\n    }\n    public static void main(String[]\
    \ args) {\n        String[] names = {\"Dave\", \"BoB\", \"radar\", \"rotor\"};\n\
    \        int[] numbers = {1234, 767, 123421, -101};\n        Palindromes1 pall\
    \ = new Palindromes1();\n        for (String name : names) {\n            pall.calculate(name);\n\
    \        }\n        for (int num : numbers) {\n            pall.calculate(Integer.toString(num));\n\
    \        }\n    }\n```"
