- pgno: 234
  md: '# 216 Java for Developers Pocket Primer


    However, if a SQL statement updates records in one or more tables, all the affected
    indices must be updated. As a result, there can be performance impact when multiple
    indices are updated as a result of updating table data. Hence, it''s important
    to determine a suitable number of indices, and the columns in each of those, which
    can be done either by experimentation (not recommended for beginners) or via SQL
    tools (some are commercial) that provide statistics regarding the performance
    of SQL statements when indexes are involved.


    # Considerations for Defining Indexes


    A full scan for large tables will likely be computationally expensive, so make
    sure you define indices on columns that are referenced in the WHERE clause in
    your SQL statements. As a simple example, consider the following SQL statement:


    ```

    SELECT *

    FROM customers

    WHERE lname = ''Smith'';

    ```


    If you do not have an index that includes the lname attribute of the table, then
    a full scan is executed.


    Consider defining an index on attributes that appear in query statements that
    involve SELECT, GROUP BY, ORDER BY, or JOIN. As mentioned earlier, updates to
    table data necessitate updates to indices, which in turn can result in lower performance.


    A suggestion before inserting a large volume of data into a table (or tables):


    +   1. Disable the indexes.

    2. Insert the data.

    3. Enable the indices again.


    Although the preceding approach involves rebuilding the indices, which is performed
    after Step 3, you might see a performance improvement compared to directly inserting
    the table. Of course, you could also try both approaches and calculate the time
    required to complete the data insertion.


    As another option, it''s possible to perform a multi-row insert in MySQL, which
    enables you to insert several rows with a single SQL statement, reducing the number
    of times the indices must be updated. The maximum number of rows that can be inserted
    via a multi-row insert depends on the value of max_allowed_packet (which default
    value is 4M), described here:


    https://dev.mysql.com/doc/refman/5.7/en/packet-too-large.html


    Another suggestion: check the order of the columns in multi-column indexes and
    compare that order with the order of the columns in each index. MySQL will only
    use an index if the left-leading column is referenced.'
