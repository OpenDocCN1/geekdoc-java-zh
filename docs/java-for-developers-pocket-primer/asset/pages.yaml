  md: '# THE JAVA PACKAGE STATEMENT


    Java supports the package construct that is available in other languages, such
    as Ada. Note that a package name must appear as the first non-comment line in
    a Java file. A package is a convenient way to disambiguate a Java file with the
    same name that appears in more than one location. This feature is similar to the
    use of namespaces in XML.


    For example, suppose you have one Java file called Employee in the package com.acme.employees,
    a second Java file called Employee.java in the package is com.mycorp.employees,
    and a third Java file called Employee.java that does not belong to a package.
    Obviously, you must place these files in different directories. Specifically,
    place each Employee.java file in a subdirectory that reflects the structure of
    its package. In the preceding scenario, you will have the following directory
    structure:


    ```

    $TOP/com/acme/employees/Employee.java

    $TOP/com/mycorp/employees/Employee.java

    $TOP/Employee.java

    ```


    As you can see, the preceding directory structure enables you to maintain distinct
    Java files that have the same filename. In fact, the Java files can be in different
    $TOP directories, but for convenience, we will use the same $TOP directory.


    You must compile a Java class from the directory that is the parent of the left-most
    component of its package name. In the case of our three Employee.java files, you
    compile them as follows (assuming that there are no other dependencies):


    ```

    cd $TOP

    javac com.acme.employees.Employee.java

    javac com.mycorp.employees.Employee.java

    javac Employee.java

    ```


    # AN EXAMPLE OF THE PACKAGE STATEMENT (1)


    Earlier in this chapter, you saw an example of defining an array of instances
    of a Java class Employee, where the Employee class is defined as a class inside
    the file ArrEmployees.java.


    In this section, you will see how to use the package statement to define the Employee
    class in a separate file that belongs to the same package as the ArrEmployees
    class.


    Listing 3.18 displays the content of Employee.java that belongs to the com.employees
    package, which means that Employee.java must appear in the following directory
    structure:


    ```

    <your-top-directory>.com/acme/dept/Employee.java

    ```'
