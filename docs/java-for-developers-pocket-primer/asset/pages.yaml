  md: "# THE STRING CLASS\n\nA variable of type char is a single character that you\
    \ can define via the char keyword like this:\n\n```\nchar chl = 'Z';\n```\n\n\
    A variable of type String is an object that comprises a sequence of character-values.\
    \ Java also supports ASCII, UTF-8, and Unicode characters. The java.lang.String\
    \ class implements the interfaces Serializable, Comparable, and CharSequence.\n\
    \nIf you are familiar with interfaces, the following sentences in this paragraph\
    \ will make sense. The Serializable interface does not contain methods; it's essentially\
    \ a 'marker' interface, whereas the CharSequence interface is for sequences of\
    \ characters. In addition to the Java String class, the StringBuffer and the StringBuilder\
    \ class implement the CharSequence interface effectively. If you are unfamiliar\
    \ with interfaces (more details later), you will learn about them in Chapter 4,\
    \ which you can re-read this paragraph.\n\nKeep in mind the following point: every\
    \ Java String is immutable, and to modify a string (such as append or delete characters),\
    \ Java creates a new instance 'under the hood' for us. Yes, this means that string-related\
    \ operations are less memory efficient; however, Java provides the StringBuffer\
    \ and StringBuilder for mutable Java strings (also discussed later).\n\nAn array\
    \ of characters is effectively the same as a Java String:\n\n```\nchar[] chars\
    \ = {'h', 'e', 'l', 'l', 'o'};\nString str1 = new String(chars);\nString str2\
