  md: '40 Java Developers Pocket Primer


    For your convenience, the import statements for some of the earlier Java exceptions
    are shown here:


    +   * java.io.IOException;

    * java.lang.ArithmeticException;

    * java.lang.NumberFormatException;

    * java.lang.ArrayIndexOutOfBoundsException;

    * java.net.MalformedURLException;

    * java.util.InputMismatchException;

    * java.util.InputMismatchException;


    The Java code samples later in this chapter contain examples of the preceding
    exceptions (i.e., the SQL-related exceptions are not discussed in this book).


    Java provides two types of exceptions: checked exceptions and unchecked exceptions,
    both of which are discussed in the following sections.


    # Checked Exceptions


    Checked exceptions (also called compile-time exceptions) are checked by the compiler
    during compilation: doing so will confirm whether the exception is handled by
    the programmer. If not, the system displays a compilation error. For example,
    SQLException, IOException, InvocationTargetException, and ClassNotFoundException
    are checked exceptions.


    # Unchecked Exceptions


    Unchecked exceptions (also runtime exceptions) occur during the execution of a
    Java program. In general, runtime exceptions are ignored during the compilation
    process. They are not checked while compiling the program. Examples include incorrect
    APIs and logical errors. Unchecked exceptions in Java include the following:


    +   * ArrayIndexOutOfBounds

    * NullPointerException

    * IllegalArgumentException

    * IllegalStateException


    An ArrayIndexOutOfBounds occurs when your code attempts to access an array element
    that does not exist: i.e., the index value is invalid (too large or negative).


    A NullPointerException occurs when your code attempts to access an object that
    has not been initialized.


    An IllegalArgumentException occurs when the wrong type of argument is passed to
    a method. For example, if a method expects a variable of type int and you pass
    a variable of an incompatible type, or you pass a null variable, you will see
    this exception.


    An IllegalStateException occurs when the state of the environment does not match
    the operation being executed.'
