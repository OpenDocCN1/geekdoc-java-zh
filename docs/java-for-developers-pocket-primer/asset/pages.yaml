  md: '# Introduction to OOP • 147


    that is executed. As you will see later in this chapter, it''s also possible to
    explicitly invoke the overridden method in a superclass.


    # ENCAPSULATION


    Encapsulation involves the use of accessors and mutators in order to “shield”
    the internal properties (such as variables) of a Java class from other classes.
    The use of accessors also enables you to refactor code in a Java class without
    modifying public APIs. Hence, other classes can access the values of properties
    (through accessors) without knowing how those properties were calculated.


    Encapsulation refers to separating or isolating the internal details of a class
    from the “outside world.” Encapsulation is important because it prevents other
    programmers from modifying the internal details of a class, which in turn can
    change the intended behavior of the methods in a class, and perhaps causes them
    to fail.


    By way of analogy, the engine in your car is “encapsulated” so that you do not
    need to know (or understand) the internal details. In theory, your engine can
    be replaced by another engine without requiring you to understand the workings
    of the new engine.


    Another example is your cell phone: whenever you upgrade the hardware or download
    later versions of the internal software, you generally do not know the specific
    detail of the new functionality (or the bugs that have been fixed). Hence, encapsulation
    enables you to make internal changes without affecting the rest of the system
    (such as other classes).


    As a simple implementation, the Person.java class (defined in Chapter 1) defines
    a person with two attributes: a first name and a last name, of which are private
    String variables. This class defines two public access methods by which other
    classes can retrieve the first name and the last name of an instance of the Person
    class.


    # POLYMORPHISM


    Polymorphism means “having many forms.” For example, a person can have multiple
    roles: a student of one class and also a teacher of a different class. Through
    polymorphism, we can perform an action in multiple ways in different classes,
    all of which implement the same interface. For example, the Mammal interface can
    be implemented by a Cat class, a Dog class, and a Lion class. If the Mammal interface
    contains the method speak(), then the three preceding classes each have their
    own implementation of this method, which might emit the text “Meow,” “Woof,” and
    “Roar.”


    As you know Listing 5.4, we can replace a class by a subclass in an assignment
    statement when these classes have an inheritance relationship, which is represented
    here:


    ```

    ClassA b2 = new SubClassB();

    b2.display();

    ((ClassA) b2).display();

    ```'
