    which have higher priority than addition + subtraction -. In addition, Java supports
    the following operators:


    +   * Arithmetic operators: +, -, *, %, ++, --

    * Assignment operators: =, -=, *=, /=, %=, <=, >=, ^=, !=

    * Bitwise Operators: &, |, ^, and =

    * Boolean operations: and, or, not, xor

    * Logical Operators: &&, || !

    * Relational operators: ==, !=, >, <, >=, <=


    Java also supports the ternary operator ? and the operator instanceof checks if
    a variable is an instance of a particular class.


    # Precedence of Java Operators


    Operator precedence determines the grouping of terms in an expression, which in
    turn determines how an expression is evaluated. Higher precedence operators are
    evaluated before lower precedence operators, even when they appear inside expressions.


    Java operators are listed below, from highest to lowest precedence (LTR means-to-right
    and RTL mean-to-left):


    +   * RTL Postfix: () . (dot operator)

    * RTL Unary: ++ ! ~

    * L Multiplicative: * / %

    * RTL Additive: +

    * LTR Shift: >> >>> <<

    * RTL Relational: >= <=

    * LTR Equality: == =

    * LTR Bitwise AND: &

    * LTR Bitwise XOR: ^

    * LTR Bitwise OR: |

    * LTR Logical AND: &&

    * LTR Logical OR: ||'
