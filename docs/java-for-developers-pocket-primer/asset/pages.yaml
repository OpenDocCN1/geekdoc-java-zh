    \ the following statement is legal:\n\n```\nclassB.staticMethod();\n```\n\nHowever,\
    \ if nonStaticMethod() is a non-static method of classB, then the following statement\
    \ is legal:\n\n```\nClass B b = new ClassB();\nb.nonStaticMethod();\n//this is\
    \ illegal:\nclassB.nonStaticMethod();\n```\n\nEvery instance of a class contains\
    \ a copy of an instance variable, but only one copy of a static variable is available\
    \ to all instances of a class. If a static variable is modified in one instance,\
    \ that modified value is available to all other instances, including instances\
    \ that are created after a static variable have been modified. if x, y, and z\
    \ are static variables in a class, and their values are modified, then the modified\
    \ values are available in all instances of the given class.\n\nKeep in mind the\
    \ following distinction: instance variables are initialized when an instance is\
    \ created, whereas class variables are initialized when the class is created.\n\
