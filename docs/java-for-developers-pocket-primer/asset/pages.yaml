  md: "# THE COLLECTIONS CLASS\n\nThe java.util.Collections class extends the Object\
    \ class and contains static methods that operate on return collections. The methods\
    \ in this class throw a NullPointerException if they are given collections or\
    \ objects that are null.\n\nSome methods in this class include list-related operations\
    \ (insert, remove, and so forth) and some arithmetic operations, such as the min()\
    \ method and the max() method. Listing 6.8 displays the content of Collections1.java\
    \ that illustrates how to invoke methods in the Collections class to update variables\
    \ defined in the custom Collections1.\n\n# LISTING 6.8: Collections1.java\n\n\
    ```\nimport java.util.ArrayList;\nimport java.util.Collections;\nimport java.util.List;\n\
    \npublic class Collections1 {\n    public static void main(String a[]) {\n   \
    \     List<String> words1 = new ArrayList<String>();\n        words1.add(\"word1\"\
    );\n        words1.add(\"word2\");\n\n        System.out.println(\"Initial collection:\
    \ \" + words1);\n        Collections.addAll(words1, \"stuffed\", \"pizza\");\n\
    \        System.out.println(\"Appended collection: \" + words1);\n\n        String[]\
    \ words2 = {\"silicon\", \"valley\"};\n        Collections.addAll(words1, words2);\n\
    \        System.out.println(\"Final collection: \" + words1);\n    }\n}\n```\n\
