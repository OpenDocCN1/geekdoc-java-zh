    # JRE Versus a JDK


    A JRE (Java Runtime Environment) enables you to launch Java code, which means
    that a Java provides the java command-line tool. If you are on a Unix/Linux type
    of machine, type the following command:


    ```

    $ which java

    ```


    The preceding command displays the type of output:


    ```

    $ /usr/bin/java

    ```


    On the other hand, a JDK (Java Development Kit) enables you to compile and launch
    Java code. Although the JRE and JDK were available as separate downloads until
    Java 8, they have been merged i.e., starting from Java 9, the Java download is
    the JDK with JRE included.


    # Java Distributions


    There are various sites offering several Java JDKs: the OpenJDK project, the OracleJDK,
    and AdoptOpenJDK. The OpenJDK Project is the only site that contains the Java
    source code.


    Oracle provides JDK, which is free to use for your Java applications. Updates
    for older versions are not supported: for example, as soon as Java 13 was available,
    updates to Java 12 were discontinued. Oracle also provides OracleJDK, which is
    free to use only during development: if you deploy your code to a production environment,
    you must pay a fee to Oracle (which will provide you with additional support).


    You can also use AdoptOpenJDK, which was developed by various developers and vendors,
    and is freely available (like OpenJDK).


