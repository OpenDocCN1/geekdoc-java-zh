- pgno: 70
  md: '# 52 * Java Developers Pocket Primer


    must be the same. For the example, the file MyClass.java must contain a public
    class called MyClass. A Java class can contain other Java classes, but Java also
    supports the concept of anonymous inner classes, which are often used for the
    implementation of listeners in GUI widgets.


    A class can only subclass a single class that the extends keyword; hence, Java
    does not support the multiple inheritance of classes. However, a class can implement
    multiple interfaces via the implements keyword. An abstract class contains at
    least one method that must be implemented by a subclass. Thus, abstract classes
    cannot be directly instantiated, but a subclass that implements the abstract methods
    of its parent class can be instantiated.


    # Public, Private, or Protected?


    Java methods can be public, protected, or private. Unlike other languages, every
    Java method is a virtual method. A class can contain one or more constructors
    because they have different signatures (i.e., the set of parameters and their
    types).


    Variables can also be public or private; other keywords for variables include
    static, final, and transient. If a variable is not initialized, the Java compiler
    assigns it a value that depends on its type: a variable of int is initialized
    to 0, a variable of String is initialized to null, and so forth.


    The keyword exposes properties and methods, whereas the keyword private restricts
    access to the class itself. The keyword protected allows access to the internals
    of a class to its subclasses as well as the class itself.


    There are some examples of using the private and public keywords:


    ```

    private String fname = "Dave"

    public String getName() { return fname; }

    public void setName(String newName) { fname = newName; }

    ```


    The setters and getters in a class are also accessors and mutators, respectively.


    # THE SCOPE OF JAVA VARIABLES


    Java supports reference data types that are created during instantiation of a
    class.


    A reference variable can refer to any object of the declared type or any compatible
    type (such as a subclass).


    There are three types of scopes for variables in Java: local, instance, and static.
    Local variables are declared inside methods, constructors, or blocks. Instance
    variables are declared in a class, and they do not appear inside any methods,
    constructors or blocks. Listing 3.1 displays the content of JavaVars.java that
    clarifies the differences among these types of variables.'
