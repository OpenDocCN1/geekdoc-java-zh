    DELETE

    FROM customers

    Where FNAME = ''JOHN''

    CASCADE;

    ```


    The preceding statement is called a cascading delete, and it is very useful when
    the rows in a table have a one-to-many relationship with the purchase_orders table;
    hence, if you remove a "child" row from the customers table, you want to remove
    the rows from the purchase_orders table.


    You can also specify the LIMIT keyword with DELETE, an example of which is shown
    here:


    ```

    DELETE

    FROM customers

    Where FNAME = ''JOHN''

    LIMIT 1;

    ```


    The preceding statement will delete one row, but there is an exception: the preceding
    SQL query will delete all rows whose name equals JOHN if you specify on DELETE
    CASCADE in the table definition of the customers.


    # WHAT IS A SQL INDEX?


    An index is a construct that enables the faster retrieval of records from database
    tables and therefore improves performance. An index contains an entry that corresponds
    to each row in a table, and the index itself is stored in a tree-like structure.
    SQL enables you to define one or more indexes for a table, and some guidelines
    are provided in a subsequent section.


    By analogy, the index of a book enables you to search for a word or a term and
    locate the associated page number(s) so you can then navigate to those of pages.
    Clearly, the use of the book index is much faster than looking sequentially through
    every page in the book.


    # Types of Indexes


    A unique index prevents duplicate values in a column, provided that the column
    is also uniquely indexed, which can be performed automatically if a table has
    a primary key.'
