    # WORKING WITH SIMPLE SELECT STATEMENTS


    Earlier in this chapter, you saw examples of the SELECT keyword in SQL statements,
    and this section contains you additional ways to select subsets of data from a
    table. In its simplest form, a SQL statement with the SELECT keyword looks like
    this:


    ```

    SELECT [one-or-more-attributes]

    FROM [one-or-more-tables]

    ```


    Include an asterisk (*) after the SELECT statement if you want to select all the
    attributes of a table. For example, the following SQL statement illustrates how
    to select rows from the people table:


    ```

    MySQL[mytools]> select * from people;

    +--------------------------------------+

    +fname  | lname | age | gender | country |

    +--------------------------------------+

    +john | smith | 30  | m      | usa |

    jane | smith | 31  | f      | france |

    jack | jones | 32  | m      | france |

    dave | stone | 33  | m      | italy |

    sara | stein | 34  | f      | germany |

    eddy | bower | 35  | m      | spain |

    +--------------------------------------+

    +6 rows in set (0.000 sec)

    ```


    Issue the SQL statement that contains the LIMIT keyword if you want only the first
    row from the people table:


    ```

    select * from people limit 1;

    +--------------------------------------+

    +fname  | lname | age | gender | country |

    +--------------------------------------+

    +john | smith | 30  | m      | usa |

    +--------------------------------------+

    +1 row in set (0.000 sec)

    ```


    Replace the number 1 in the previous SQL query to display the number of rows you
    need. Incidentally, if you replace the number 1 with the number 0, you will see
    0 rows returned.

    Include the WHERE keyword to specify a condition on the rows, which will return
    a (possibly empty) subset of rows:


    ```

    SELECT [one-or-more-attributes]

    FROM [one-or-more-tables]

    WHERE [some condition]

    ```'
