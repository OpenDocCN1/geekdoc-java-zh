    The recursive definition of the sum of the first n positive integers is here:


    ```

    recursive(1) = 1;

    recursive(n) = n+recursive(n-1);

    ```


    The recursive definition for the preceding function is shown here:


    ```

    if(n <= 1) { return 1; }

    else { return n+recursive(n-1); }

    ```


    The iterative code for the preceding function is shown here:


    ```

    int sum = 0;

    for(int i=1; i<=n; i++) {

    sum += i;

    }

    ```


    Instead of invoking the preceding code, you can use the closed form solution for
    the sum of the integer from 1 to n: sum = n*(n-1)/2.


