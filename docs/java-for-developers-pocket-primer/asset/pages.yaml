    \ In more recent versions of Java, you can define a sub-interface of an interface,\
    \ and you can also specify a default method to execute in the interface.\n\nAn\
    \ interface contains the signature of one or more methods (but empty interfaces\
    \ exist, and possibly constants). Prior to Java 8, only a class could contain\
    \ the implementation of the methods in an interface (via the implements keyword),\
    \ whereas Java 8 supports method implementations in Java 8 interfaces.\n\nJava\
    \ supports single inheritance of classes and multiple inheritance of interfaces.\
