- pgno: 13
  md: '# PREFACE


    # WHAT IS THE GOAL?


    The goal of this book is to provide a reasonably thorough introduction to Java
    development to people who are relatively new to the Java programming language.
    The biggest challenge for a book of this length is to provide adequate coverage
    of some fundamental aspects of Java that are illustrated via code samples that
    are primarily for Java 8. As this book goes to print, Java 17 is the production
    release. If you are planning to write a Java application, you need to determine
    the versions of Java that contain the functionality that you need in your application,
    after which you can determine the version(s) you need to install.


    # WHY THE FOCUS ON JAVA?


    Great question! If you work with modern browsers, you might know about the "browser
    wars" and also the incompatibility issues that arose in different versions of
    the same browser (and the relief when problematic versions were discontinued).


    Fortunately, the situation regarding different versions of Java is much more benign
    (the main source of discontent is the proprietary nature of Java, which eventually
    led to OpenJDK).


    Java 8 was a significant milestone for Java in terms of significant new features,
    which introduced not only Collections, but also lambda expressions, functional
    programming, and Streams, all of which are also discussed in this book (along
    with code samples).


    Knowledge of the core features of Java will serve you well for subsequent versions
    of Java. If you are interested, a comprehensive look at Java is here:


    https://dzone.com/articles/j%CE%BB%e%CE%BB-8-a-comprehensive-look'
  merge: -1
  img_proc: true
