  md: '# CHAPTER 6


    # DATA STRUCTURES


    This chapter introduces various built-in data structures in Java, such as hash
    maps and linked lists, and also how to use some of the Java classes that belong
    to the Java Collections classes.


    The first part of this chapter discusses some of the legacy Java classes that
    have been superseded by classes in the Collection framework, followed by an overview
    of Iterators.


    The second part of this chapter delves into some of the most common Collection
    classes, with code samples that use the distinct characters in a text string.
    The benefit of solving the same task using different collection cases enables
    you to compare the code that is required for solving the same task.


    The final part of this chapter discusses the useful methods in the Java 8 enhancement
    for the Collection classes. The code samples are intended to provide a basic understanding
    of how to use Collection-related classes, and therefore they have not been optimized
    for performance.


    Let''s briefly explore legacy Java classes for data structures, along with some
    newer classes that supplant the legacy classes.


    # LEGACY DATA STRUCTURES


    The Java utility package provides the following interface and classes that are
    legacy classes: BitSet, Dictionary, Enumeration, Hashtable, Properties, Stack,
    and Vector. Starting with version 2, Java introduced a framework called the Collection
    Framework.


    Note: The legacy data structures Vector and Hashtable are synchronized, whereas
    the classes in the Collection framework in Java 7 are not synchronized.'
