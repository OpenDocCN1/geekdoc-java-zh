    The next section delves into recursion, which is a powerful technique for solving
    a myriad of tasks, such as calculating factorial values and computing Fibonacci
    numbers.


    # WHAT IS RECURSION?


    Recursion is an elegant and powerful technique for solving tasks, it can also
    be confusing if you are new to recursion. In brief, a recursive function is a
    function that is defined in terms of itself. While this might seem odd, it''s
    actually a convenient way to express some formulas and to solve tasks that would
    be cumbersome to solve using iterative algorithms.


    Later you will see complete code samples that illustrate how to use recursion
    to calculate well-known values. Although you probably won''t need all of them
    in your work, they will provide you with useful reinforcement regarding recursion.


    For instance, the factorial function f(n) is the product of the integers between
    1 and n. For simplicity, let''s assume that n is a positive integer in order to
    make the code simple. This means that f(1) = 1, f(2) = 2, f(3) = 6, f(4) = 24,
    and so on. In fact, according to the definition of factorial,


    ```

    f(n) = 1*2*3 . . * n.

    ```


    The preceding is an iterative definition, whereas this is the recursive definition:


    ```

    f(n) = n*f(n-1) for n > 0 and f(0) = 1.

    ```


    Note: Any recursive function has a "closed form" (non-recursive) representation
    and vice versa.


    The following subsections contain examples of recursive definitions of functions
    and their iterative counterparts for computing some well-known values.'
