    The interesting code is in the main() routine of SubClassC. The next section explains
    which code is correct and which code is incorrect, followed by a set of rules
    that enable you to determine the correctness of an assignment statement.


    The following code snippet is correct because c1 is an instance of SubClassC:


    ```

    SubClassC c1 = new SubClassC();

    ```


    You can replace the class on the left-side of the preceding code snippet with
    a super class. Since BaseClass2 is a super class of SubClassC, the code in #2
    is correct:


    ```

    BaseClass2 b1 = new SubClassC();

    ```


    Next, b1 was instantiated with the class SubClassC on the right-hand side, which
    means that we can "downcast" b1 as an instance of SubClassC, so the code in #3
    is correct:


    ```

    (SubClassC)b1.goodbye();

    ```


    However, SubClassD is not a super class of SubClassC, and obviously it does not
    equal SubClassC, so this line of code is incorrect:


    ```

    // ((SubClassD)b1).goodbye();

    ```


    Since BaseClass2 is a super class of SubClassD, the code in #4 is correct:


    ```

    BaseClass2 b2 = new SubClassD();

    ```


    Next, b2 was instantiated with the class SubClassD on the right-hand side, which
    means that we can "downcast" b2 as an instance of SubClassD (so that it can be
    used like an instance of SubClassD), and consequently the code in #5 is correct:


    ```

    (SubClassD)b2.goodbye();

    ```


    The final code snippet is incorrect because BaseClass2 does not contain a goodbye()
    method, and the instance variable b2 "behaves" like an instance of BaseClass2:


    ```

    //b2.goodbye();

    ```'
