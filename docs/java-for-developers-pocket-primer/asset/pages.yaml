  md: '# Java and SQL • 215


    A clustered index changes the order of the rows in a table, and then performs
    a search that is based in the key values. A table can have only one clustered
    index.


    MySQL S introduced invisible indexes that are unavailable for the query optimizer.
    MySQL ensures that those indexes are kept current when data in the referenced
    column are modified. You can make indexes invisible by declaring their visibility
    during table creation or via the ALTER TABLE command, which is not discussed in
    this chapter.


    # Creating an Index


    An index on a MySQL table can be defined in two convenient ways:


    +   * Part of the table definition during table creation

    * After the table has been created


    Here is an example of creating an index on the full_name attribute during the
    creation of the table friend_table:


    ```

    DROP TABLE IF EXISTS friend_table;


    CREATE TABLE friend_table (

    friend_id int(8) NOT NULL AUTO_INCREMENT,

    full_name varchar(40) NOT NULL,

    fname varchar(20) NOT NULL,

    iname varchar(20) NOT NULL,

    PRIMARY KEY (friend_id), INDEX (full_name)

    );

    ```


    Here is an example of creating index friend_lname_idx on the lname attribute after
    the creation of the table friend_table:


    ```

    CREATE INDEX friend_lname_idx ON friend_table(lname);

    Query OK, 0 rows affected (0.035 sec)

    Records: 0 Duplicates: 0 Warnings: 0

    ```


    You can create an index on multiple columns, an example of which is shown:


    ```

    CREATE INDEX friend_lname_fname_idx ON friend_table(lname, fname);

    ```


    An index on a MySQL table can specify a maximum of 16 indexed columns.


    # Overhead of Indexes


    An index occupies some memory on secondary storage. In general, if you issue a
    SQL statement that involves an index, that is first loaded into memory and then
    it''s utilized to access the appropriate record(s). A SQL query that involves
    simply accessing (reading) data via an index is almost always efficient than accessing
    data without an index.'
