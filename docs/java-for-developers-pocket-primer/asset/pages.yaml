  md: '# The throws Keyword


    The *throws* keyword indicates the type of exception that a method can throw if
    the specified exception occurs in the method, in which case the following can
    occur:


    +   - the calling method handles the thrown exception, or

    - its “parent” handles the exception, or

    - the “parent” passes the exception upward through the chain of calling methods.


    If the exception is not handled by any method in the chain of calling methods,
    an exception is thrown and the program halts execution.

    Alternatively, you can include your code in a try/catch/finally block, and the
    catch block specifies the exception that is caught. You can include multiple catch
    blocks, each of which catches a particular exception: the first catch is the most
    specific (such as *DivisionByZero*), and the last catch block is the most “generic”
    (such as Exception).


    # The Throwable Class


    The *Throwable* class is the superclass of all exceptions and errors. Keep in
    mind the following rule: do not catch a *Throwable* exception in a catch clause
    because it will catch all errors as well as all exceptions. Errors are thrown
    by the JVM to indicate serious problems (applications are not intended to handle
    them). Typical examples include *OutOfMemoryError* or the *OverflowError*. Both
    are caused by situations that are outside of the control of the application and
    cannot be handled.


    One more recommendation: avoid catching an exception and throwing the same exception
    again. Doing so generates multiple error message for the same exception.


    # GETTING USER INPUT AND HANDLING EXCEPTIONS


    The code samples involving user input contain a try block that attempts to do
    something, such as converting a string to a number. If users provide a non-numeric
    input, then the conversion will fail, in which case a catch block will catch the
    error that occurred, and the code that appears in the catch block is executed.


    Moreover, you can include a finally block after the catch blocks (yes, multiple
    catch blocks are allowed) that is executed in almost every case (the “exception”
    to this rule pertains to invoking the *System.exit(1)* statement). Note that if
    you use a try/catch block in a class where no exception can be thrown, Java will
    alert you during an attempt to compile your code.


    The code samples show you two things that have not been discussed. First, you
    will see how to use the import statement to access existing classes that handle
    the lower-level details for us, so we do not need to “reinvent the'
