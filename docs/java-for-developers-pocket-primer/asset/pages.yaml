    the remaining classes.


    # OVERVIEW OF JAVA COLLECTIONS


    As you saw earlier in this chapter, various Java legacy classes are synchronized,
    whereas the implementations in the Collection Framework are unsynchronized. However,
    the Collection Framework “wrapper” classes that are thread-safe.


    The six collection interfaces (Collection, Set, List, Map, SortedSet, and SortedMap)
    provide a corresponding static factory method, as shown here:


    +   * public static <T> Collection<T> synchronizedCollection(Collection<T> c);

    * public static <T> Set<T> synchronizedSet(Set<T> s);

    * public static <T> List<T> synchronizedList(List<T> list);

    * public static <K,V> Map<K,V> synchronizedMap(Map<K,V> m);

    * public static <T> SortedSet<T> synchronizedSortedSet(SortedSet<T> s);

    * public static <K,V> Map<K,V> synchronizedSortedMap(Map<K,V> m);


    The methods in the preceding list return a synchronized (i.e., thread-safe) Collection
    that involves the specified “backing” collection. Note that to the backing collection
    must be performed through the returned collection to ensure serial access. Create
    the synchronized collection via the following code snippet:


    ```

    List<Type> list = Collections.synchronizedList(new ArrayList<Type>())

    ```


    # Iterating over Wrapper-Synchronized Collections


    You must manually synchronize when you iterate over a returned collection. This
    requirement arises because iteration involves multiple invocations into a collection
    that must be handled as a single atomic operation. Here is an example of iterating
    over a wrapper-synchronized collection:'
