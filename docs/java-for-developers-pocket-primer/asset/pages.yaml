  md: "46 Java for Developers Pocket Primer\n\nThis concludes the basic introduction\
    \ to user input and how to use a try/catch block to handle conversion errors.\n\
    \n# NESTED EXCEPTIONS\n\nJava provides a number of classes for handling exceptions\
    \ that can occur in various situations. For example, when you attempt to open\
    \ a file that does not exist, Java throws a FileNotFoundException. If you attempt\
    \ to convert a string containing alphabetic characters to a number, you get an\
    \ exception. If you try to access a table that does not exist in a database, you\
    \ will also get an exception.\n\nThe general syntax is try/catch/finally, which\
    \ can involve multiple catch statements. If an exception is thrown, each catch\
    \ block is checked to see if it matches the exception. If the thrown exception\
    \ does not match any of the specified exceptions, you can include a \"catch all\"\
    \ exception that is invoked when nothing else matches the exception.\n\nAnother\
    \ point to keep in mind is that the finally block is optional: however, when it's\
    \ specified in your code, that block is always guaranteed to execute, regardless\
    \ of whether errors occurred.\n\nListing 2.13 displays the content of the class\
