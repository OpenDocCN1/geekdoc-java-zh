    ```\n\nListing 7.12 defines the class `CreateDir` and a `main()` method that specifies\
    \ a directory that is several layers below `/tmp`. Those directories might not\
    \ exist, the `main()` method invokes the `mkdirs()` method. If you invoke this\
    \ code multiple times, you will get an error because the directory already exists.\n\
