    \ directories, which handles the second case in the previous bullet list. Listing\
    \ 7.12 displays the content of the file `CreateDir.java` that creates the directory\
    \ `/tmp/user/java/bin.\n\n# LISTING 7.12: CreateDir.java\n\n```\nimport java.io.*;\n\
