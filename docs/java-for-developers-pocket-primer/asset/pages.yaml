  md: '# Introduction to OOP • 145


    for OOP. In this section, you will learn about OOP concepts from a general viewpoint,
    which means that they are applicable to other programming languages.


    As a starting point, a class is a group of functions and data, called methods
    and properties, respectively, that can have different types of accessibility via
    the utilization of specific Java keywords. An instance of a class is a concrete
    object that has state and identity.


    With the preceding in mind, there are several important OOP concepts that you
    need to know:


    +   * Inheritance

    * Delegation

    * Encapsulation

    * Polymorphism


    The term inheritance refers to the relationship between two classes A and B: if
    B is a subclass of A, then we say that B inherits from A.


    The term delegation refers to composition of objects. In instance, if A contains
    instances of classes B, C, and D, then A can delegate blocks of functionality
    to each of those classes.


    The term encapsulation refers to performing a set of operations inside a method
    of class A in a way that the code is not visible to other methods and classes.


    The term polymorphism involves a class that “act” as different classes. For example,
    if class A has subclass B and B has subclass C, then an instance of class C can
    as an instance of class B and also as an instance of class A.


    In addition, there are many patterns that exist in software, and you can find
    entire books devoted to a description of software patterns for different languages.


    # INHERITANCE


    If class B is a subclass of A, then B contains all the methods and properties
    of class A. If a method in class A has the desired behavior, then we do not need
    to define that same method in class B. Just to make things simpler, let''s assume
    that both classes are concrete classes. If the method perimeter() exists in class
    A, then the same method is accessible in class B.


    If we have an instance of class B called Binst, the code snippet Binst.perimeter(),
    then Java will look for perimeter() in class B; since it''s not defined in class
    B, then Java will search upward the inheritance “chain” until it finds perimeter(),
    which is defined in class A.


    Suppose, that Ainst is an instance of class A. Since class B is a subclass of
    A, any instance of A can be replaced with an instance of class B. Consequently,
    the code snippet Ainst.perimeter() can be replaced with Binst.perimeter().'
