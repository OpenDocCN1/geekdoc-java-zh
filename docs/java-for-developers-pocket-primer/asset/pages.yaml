  md: '# ANONYMOUS CLASSES VERSUS NAMED INNER CLASSES


    As you know, a Java can extend a class and implement an arbitrary number of interfaces.
    By contrast, an anonymous inner class can implement only one interface. In addition,
    anonymous inner classes are private (i.e., other public classes cannot access
    them), whereas named inner classes can be used only by the enclosing class.


    Be careful not to inadvertently mistake a named inner class as a class that is
    used in multiple locations (which is much less likely to happen) with an anonymous
    inner class. As a suggestion, use anonymous inner classes when they are used only
    once (such as an event handler for a button click in a GUI), and use named inner
    classes if they are used more than once in your code. Anonymous classes in Java
    can have an initializer such as the following:


    ```

    {

    super.foo(finalVariable+this.bar);

    }

    ```


    # Limitations of Anonymous Classes


    Although anonymous classes have some advantages, they also have limitations, as
    listed below:


    +   * they cannot be reused

    * they cannot have anything static in their definition

    * their fields cannot be inspected in Eclipse

    * they cannot be used as a type

    * they cannot be located using the class name in Eclipse

    * they do not have a name, so they cannot have a constructor

    * they cannot change the values of any included class members


    By contrast, named inner classes do not have the preceding limitations. Incidentally,
    here is a scenario in which non-static inner classes can be problematic. Whereas
    an outer class is not serializable, whereas an inner class is serializable. In
    this situation, there will be an attempt to serialize the outer class but this
    will fail (and therefore more time will be spent debugging your code).


    Since anonymous classes cannot have a constructor, how would you pass non-constructor
    variables from B to A, where B is a subclass of A? One possibility involves the
    use of a (static) named inner class.


    # PRIVATE CONSTRUCTORS (WHY?)


    Thus far, you have seen only public constructors, and you might think that a private
    constructor serves no useful purpose. However, a private constructor is useful
    when you want to ensure that only one instance of a class is created, which is
    also known as the singleton pattern.'
