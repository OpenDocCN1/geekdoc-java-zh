  md: '# Logging into MySQL


    You can log into MySQL as root with the following command, which will prompt you
    for the root password:


    ```

    $ mysql -u root -p

    ```


    If you installed MySQL via a DMG file, then when you launch the preceding command,
    you will be prompted for the password for the root user, which is the same as
    the password for logging into your laptop.


    # Creating a MySQL Database


    Log into MySQL and invoke the following command to create the mytools database:


    ```

    MySQL [mysql]> create database mytools;

    Query OK, 1 row affected (0.004 sec)

    ```


    Select the mytools database with the following command:


    ```

    MySQL [mysql]> use mytools;

    Database changed

    ```


    Display the tables in the mytools database with the following command:


    ```

    MySQL [mytools]> show tables;

    Empty set (0.001 sec)

    ```


    The preceding output makes sense because the mytools database is an empty database.


    # CREATING AND DROPPING TABLES


    There are three ways to create database tables in MySQL, as well as other RDBMSes.
    One technique is manual (shown in the next section); another technique (shown
    second) invokes a SQL file that contains SQL commands; and the third technique
    involves redirecting a SQL file to the MySQL executable from the command line.


    The next section shows how to create four tables in MySQL using a manual technique
    that involves explicitly defining a SQL statement from the MySQL prompt and then
    executing that SQL statement.


    # Manually Creating MySQL Tables


    This section shows how to manually create MySQL tables that are referenced later
    in this chapter. Specifically, you will see how to create the following tables:


    +   - customers

    - friends

    - weather'
