  md: "Consider the following code that involves the ArrayList class and a for loop\
    \ that appends 50 numbers to the variable items:\n\n```\nList<Integer> items =\
    \ new ArrayList<Integer>();\nfor (int i = 1; i < 50; i += 2)\nitems.add(i);\n\
    ```\n\nAlthough you use int values as primitive types instead of Integer objects\
    \ to the variable items, the code compiles correctly. Since items is a list of\
    \ Integer objects, not a list of int values, you might wonder why the Java compiler\
    \ does not issue a compile-time error. The compiler does not generate an error\
    \ because it creates an Integer object from i and adds the object to items. Thus,\
    \ the compiler replaces the previous code to the following at runtime:\n\n```\n\
    List<Integer> items = new ArrayList<Integer>();\nfor (int i = 1; i < 50; i +=\
    \ 2)\nitems.add(Integer.valueOf(i));\n```\n\nAs another example of auto boxing,\
    \ consider the following method:\n\n```\npublic static int sumEven(List<Integer>\
    \ items)\n{\n    int sum = 0;\n\n    for (Integer i: items)\n        if (i % 2\
    \ == 0)\n            sum += i;\n\n    return sum;\n}\n```\n\nSince the remainder\
    \ (%) and unary plus (+=) operators do not apply to Integer objects, why does\
    \ the Java compiler successfully compile the preceding method? The reason is that\
    \ the compiler invokes the intValue() method to convert an Integer to an int at\
    \ runtime\n\n```\npublic static int sumEven(List<Integer> li)\n{\n    int sum\
    \ = 0;\n    for (Integer i : li)\n        if (i.intValue() % 2 == 0)\n       \
    \     sum += i.intValue();\n    return sum;\n}\n```\n\nLISTING 1.17 displays the\
    \ content of Unboxing.java, which is a code sample of autoboxing in Java.\n\n\
    # LISTING 1.17: Unboxing.java\n\n```\nimport java.util.ArrayList;\nimport java.util.List;\n\
    ```"
