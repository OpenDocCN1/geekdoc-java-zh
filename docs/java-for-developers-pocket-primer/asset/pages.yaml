- pgno: 104
  md: '# CREATING JAVA FILES FOR JAVA CLASS FILES


    So far, you have seen examples of one-off Java classes that you can launch from
    the command line. However, a real application can contain dozens (even hundreds
    or thousands) of classes, located in various packages in multiple directories.
    Fortunately, you can create a JAR file containing your compiled code via the jar
    command.


    As a simple example, the following set of steps creates a JAR file that contains
    the class CompareStrings from Chapter 1:


    +   Step 1: Navigate to the directory that contains CompareStrings.

    Step 2: Create a JAR file with this class file:


    ```

    jar cvf MYCLASSES.jar CompareStrings

    ```


    +   Step 3: Copy the JAR file to a directory that does not contain CompareStrings
    and then navigate to that directory.

    Step 4: Launch CompareStrings by specifying the JAR file:


    ```

    java -classpath MYCLASSES.jar CompareStrings

    ```


    After you launch the preceding command, you will see the following output:


    ```

    linel: This is a simple sentence.

    line2: this is a simple sentence.


    linel and line2 are case-insensitive

    linel is mixed case

    ```


    Although the preceding example is trivial, you can see the usefulness of creating
    JAR files that contain application-related code, which can be organized in custom
    Java packages.


    In addition, add this JAR file to the CLASSPATH environment variable so that your
    application can locate any required classes, an example of which is here for Unix/Linux
    systems:


    ```

    export CLASSPATH=$TOP/MYCLASSES.jar:$CLASSPATH

    ```


    If you want to create a JAR named Employee.jar that contains only the compiled
    Java file(s) in a directory, use the following command:


    ```

    cd $TOP

    jar cvf Employee.jar *.class

    ```


    If you want to create a JAR file MyMyApp.jar that contains the compiled Java file(s)
    in the current directory and all subdirectories of the current directory, which
    would include all the compiled Java classes in those subdirectories, invoke the
    following command:


    ```

    cd $TOP

    jar cvf MyBigApp.jar .

    ```'
