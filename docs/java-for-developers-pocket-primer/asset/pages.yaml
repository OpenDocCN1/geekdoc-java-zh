    arrays, and recursion in Java.


    The first part of this chapter contains Java code samples for loops and while
    loops. These constructs are introduced early in this chapter because the more
    useful code samples often contain a combination of loops and conditional logic.


    The second part of this chapter contains Java code samples that manipulate strings,
    such as reversing a string and converting strings to uppercase or lowercase. This
    section also shows how you work with nested loops.


    The final part of this chapter shows you how to use recursion to calculate factorial
    values, Fibonacci numbers, the GCD (Greatest Common Divisor) of two positive integers,
    and the LCM (Lowest Common Multiple) of two positive integers.


