  md: '# 184 · Java for Developers Pocket Primer


    Another way to perform a similar read operation is with the following code snippet


    ```

    FileInputStream fis = new FileInputStream("/path/and/

    fileName);

    ```


    One point to remember is that the implementation of the method finalize() in FileInputStream
    (which is a protected method) will close the stream, and therefore you do not
    need to explicitly close that stream in your code.


    In many cases, the garbage collector invokes the finalize() when a stream is no
    longer in use (but you don''t know when the stream is actually closed). Due to
    a timely delay, you need to be careful not to write content to files, close and
    open them again too quickly, because doing so could result in an inconsistent
    state. You can also consider invoking the close() method if you are not sure of
    the exact type of InputStream that you received in your method.


    # THE FILTERINPUTCLASS


    The FilterInputStream class is an abstract class that essentially acts as a “pass
    along” gate for the methods in the InputStream interface. An interesting fact
    about the FilterInputStream class is that you can make multiple nested inversions,
    as shown here:


    ```

    InputStream is1 = getInputStream();

    FilterInputStream fis1 = new FilterInputStream(is1);

    FilterInputStream fis2 = new FilterInputStream(fis1);

    FilterInputStream fis3 = new FilterInputStream(fis2);

    ```


    After a read operation is performed in fis3, the request is sent to fis2, which
    forwards the request to fis1, until fis1 provides some data. The preceding construct
    can also be implemented via method chaining, as well as using this technique:


    ```

    fis3 = new FilterInputStream(new

    FilterInputStream(new FilterInputStream(is)));

    ```


    The preceding construct is simple and also recommended instead of the other alternatives.
    The next several sections contain information about some of the subclasses of
    FilterInputStream.


    # THE BUFFEREDINPUTSTREAM CLASS


    The BufferedInputStream class implements the methods in InputStream. In addition,
    the BufferedInputStream class handles larger blocks of data more efficiently (as
    you would expect from a buffered class). If need be, you can perform “wrapping”
    operations, as with the following code snippet:


    ```

    InputStream is = new BufferedInputStream(new

    FileInputStream("a.txt"));

    ```'
