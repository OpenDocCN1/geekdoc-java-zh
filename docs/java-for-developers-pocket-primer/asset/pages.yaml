  md: '# The LIMIT Keyword


    The LIMIT keyword limits the number of rows that are in a result set. example,
    the weather table contains 11 rows, as shown here:


    ```

    SELECT COUNT(*) FROM weather;

    +----------------+

    | count (*) | |

    +----------------+

    |    11     |

    +----------------+

    1 row in set (0.001 sec)

    ```


    If we want to see only three rows instead of all the rows in the weather table,
    issue the following SQL query:


    ```

    SELECT city, state

    FROM weather ORDER

    BY state, city

    LIMIT 3;

    +------+------+

    | city | state |

    +------+------+

    | sf   | ca   |

    | sf   | ca   |

    +------+------+

    3 rows in set (0.000 sec)

    ```


    # DELETE, TRUNCATE, AND DROP IN SQL


    SQL enables you to delete all the data from a table in several ways. One way is
    to invoke the following SQL statement:


    ```

    DELETE * from customers;

    ```


    However, if a database table has a large number of rows, a faster technique is
    the TRUNCATE statement, as shown here:


    ```

    TRUNCATE customers;

    ```


    Both of the preceding commands involve removing rows from a table without dropping
    the table. If you want to drop the rows in a table and the table as well, use
    the DROP statement as shown here:


    ```

    DROP TABLE IF EXISTS customers;

    ```


