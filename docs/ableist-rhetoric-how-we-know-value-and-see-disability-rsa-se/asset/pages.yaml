    For many, using person-first language connotes sensitivity to disability issues
    and demonstrates a desire to avoid appearing offensive. As a result, it becomes
    the standard in the “politically correct” vernacular, which I view as its greatest
    flaw. Using terms because they appear “p.c.” becomes a substitute for genuine
