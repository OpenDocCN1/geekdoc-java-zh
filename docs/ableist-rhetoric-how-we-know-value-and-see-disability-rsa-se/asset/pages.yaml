    Specifically, the cyborg offers unique avenues for rethinking normal society,
    normal bodies, and normal relationships with technology. Cyborg politics rearranges
    the foundation of equality by declaring that the contemporary integration of humans
    and machines has made all cyborgs.^{103 The “normal human body” has become so
    dependent on technology that the root binary division between human and machine
    no longer applies. In today’s modern societies people physically rely on technology
    and devices for such bases as food and shelter for the more complex goods of communication,
    cultural memory, and social order. The cyborg theory suggests that people have
    relied on technology for so long that their very bodies have come to rely on it
    all. Stripped of all technology—including everything from the simplest of tools
    and the ability to manipulate fire to such inventions as language and agriculture—the
    human body would survive for only a few days in the wilderness. Cyborg theory
    posits that millennia of evolution have made the human body and the machine inseparable,
    and the lines we draw between them become falsehood.


    Blurring the line between human and technology makes lines dividing one human
    from another completely incoherent. Once violated, the foundational border separating
    machines and humans becomes increasingly leaky and imprecise, and the fluid that
    escapes through the holes washes away the most superficial distinctions based
    on gender, race, or ability. On what can I claim to be different from any other
    technology dependent organism if I cannot clearly distinguish from my toaster?
    As cyborgs, all people are hybrids and border crossers. The common violation of
    human/machine divides all people and the “pure” foundation of identity. This context
    renders distinctions by physical difference senseless, how can one separate one
    cyborg from another? A cyborg who depends on a car or a computer is not qualitative
    or essentially different from a cyborg who depends on a wheelchair or a voice
    synthesizer. As cyborgs, biological distinctions between bodies become irrelevant,
    revealing the current aleist construction of disability as a discriminatory and
    completely artificial abstraction.


    While recognition of the cyborg belitt the distinctions we make between different
    humans, cyborg theory undermines all the ideological foundations of culture. The
