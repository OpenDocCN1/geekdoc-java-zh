    # The Decision


    Judge Coffin''s decision resolved the central legal questions of the controversy,
    but many of the public observers were not satisfied with the conclusion and the
    PGA Tour''s subsequent appeals continued its search for a legal remedy to its
    central complaint. In a preliminary judgment Coffin denied the Tour''s autonomy
    positions that it was exempt from the ADA as a private club and that it was not
    a public accommodation covered under Title III of the ADA, and reserved for the
    trial of whether Martin was an employee of the Tour (and therefore covered by
    the ADA''s Title I employment protections).73 Coffin found that the Tour did not
    qualify as a “private club” because it operates as “part of the entertainment
    industry” and relies on public participation (fans) to generate revenue for its
    members (prize money).74 Coffin also determined that the Tour''s commercial function
    met the definition of public accommodation, generally defined as entity whose
    operation affects public commerce,75 and noted that golf courses are specifically
    identified in the law as places of public accommodation covered by the ADA.76


    After the summary judgment, the Tour''s case was limited to whether the ADA applied
    to professional golf tournaments and that “walking is a substantive rule of its
