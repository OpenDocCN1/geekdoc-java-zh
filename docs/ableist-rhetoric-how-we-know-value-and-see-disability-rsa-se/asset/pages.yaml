    general usage, and its use “elicits scowls and smirks, even in progressive society.”^{18}
    Disability has and continues to be interpreted, understood, and evaluated in a
    complex web of much of the time people do not consider this as discrimination
    because the strands of its web are largely invisible. Our culture is so used to
