    and virtually any extension thereof, is less visible in the cyborg context. Such
    divisions form the basis of aleist identity construction. Davis locates the impetus
    for the normal/abnormal divide in “the desire to split bodies into two immutable
    categories—whole and incomplete, abled and disabled, normal and abnormal, functional
