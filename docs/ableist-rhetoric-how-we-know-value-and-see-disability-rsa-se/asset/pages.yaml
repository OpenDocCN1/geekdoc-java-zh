    question its reasonability. Body is able refers to the continuing practice of
    equivocating ability with skill, and the assumptions made about the capacity of
    a body once it is labeled “disabled.” This warrant seems so commonsensical that
    many will reject my critique of it as absurd. These three guidelines shape the
    interpretation of the disabled body as unruly, unnatural, and unable. This results
    in an extremely negative orientation toward becoming disabled, and from this perspective
    arise discriminatory attitudes and activities associated with an ableist culture.
    Although I firmly believe that other rhetorical warrants play a role in ableist
    culture, I seek to expose a substantial part of the rhetoric of ableism by examining
    each of these in more depth, tracing their history, demonstrating their transmission,
    and showing how they play a role in the contemporary status of disability.


