    # The Three Warrants


    In this book I investigate three rhetorical warrants of ableist culture that I
    identify by the essential relationships they express: deviance is evil, normal
    is natural, and body is able. Deviance refers to the religiously based interpretation
    of deviant bodies as punishment for sin or as marked by demonic possession. While
    we may attempt to consign these views to an ignorant past, I will show how they
    live'
