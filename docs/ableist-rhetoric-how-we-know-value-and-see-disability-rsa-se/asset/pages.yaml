  md: 'But the Deaf do not know deafness way; they have a different epistemic deafness,
    and they know it is the core of their identity. To someone grew without hearing,
    deafness is not a loss, and to someone in Deaf culture, deafness is not isolating.
    Long Lennidis nicely upped the Deaf text: “Deafness is not a handicap. It’s a
    culture, a language, and I’m proud to be deaf. If there was a medicine that could
    be given to deaf people to make them hear, I wouldn''t take it. Never till I die!³³¹


    Finally, when one examines the Casey Martin and Oscar Pistorius cases, it is a
    text of what makes an athlete—and what make the essential elements of a sport—that
    motivate those who fought against Martin’s accommodation and Pistorius’s acceptance
    in the Olympics. Martin’s withered leg and difficulty walking seem to violate
    the text of the athletic ideal of the talented, well-trained and admirable body.
    In contrast, those who supported Martin embodied him as disabled—a text in which
    his condition was a validation—and providing him with a cart was appropriate.
    From these narratives the debate over whether walking is essential to the sport
    of golf becomes an extension of the text out of these groups embodied Martin.
    For the PGA and its supporters, the question posed by walking related critically
    to the text of Martin as athlete; for Martin and his supporters, the issue of
    walking was practically inconvenient to the text of Martin as disabled, and accommodation
    became a necessary response. Similarly, Pistorius’ prosthetic legs did not fit
    the narrative of the ideal body held by those who opposed him participate in the
    Olympics, but it fit the text of the disabled athlete with his supporters embodied
    him. Here the tension became a contest over the presence and legitimacy of a cyborg
    body, where artificial modifications violated the ableist warrant of body is able,
    and which provoked anxiety counts as ability. For the Pistorius camp, the narrative
    he embodied had more to do with training, tenacity, and talent—notably, important
    qualities for an athlete—and his prosthetics had a lot to do with enabling him
    to display these characteristics and very little to do with cyborgs.


    In all of these cases, the rhetorical model provides a way to both see the strands
    of the ableism''s way of epistemology, ideology, and vision and ways to work ourselves
    free from it. From the position of the model, logic revealed in these few albeit
    inform each of different types of rhetoric. The text of ableism that became the
    discriminated against disabled body can be understood as arising from coherent
    and very problematic rhetoric, and once revealed that rhetoric becomes very hard
    to justify. The problem of ableism is that it does not make any sense; the problem
    is the texts that inform the way of knowing, valuing, and seeing through which
    it does sense. Taking on the warrants—decoupling deviance and evil, normal and
    natural, body and able—can work as a strategy for undermining all of ableism.
    At the very least, it provides a way to think beyond the enormous and ancient
    wall of rhetoric that protects ableist culture. Instead of scaling it, the model'
  merge: -1
