    # Ableism


    Scholars define ableism, like any complex concept, in different ways that allow
    them to conduct the work of their particular projects. The result is a range of
    ideas about what we mean by the term. As Campbell notes, “There is little consensus
    as to what practices and behaviours constitute ableism."14 But the various definitions
    of ableism found in the literature do not weaken the term’s primary value, because
    they link ableism to the negative connotations that provide the word with its
    primary political, social, and rhetorical power. Disability studies and ableism
    studies share the goal of convincing people that ableism has a destructive, unethical,
    and intolerable connotation, which further the project of transforming disability
    into a positive term describing a common facet of human life and a valuable component
    of human diversity. However scholars define ableism, we agree on its fundamental
    nature as a critical problem that needs to be understood and addressed.


    Moreover, a variety of different definitions enables and in-depth examination
    of the idea from distinct perspectives and lines of analysis. By defining ableism
    in even subtly different ways, scholars can more precisely shape their perspectives
    employed in their research, which produces more opportunity for discussing with
    and learning from each other. By extension, multiple definitions may even enhance
    the word’s impact because different perspectives of ableism will identify more
    places where it can and should be challenged. The definition I offer should not
    be the only one people invent,'
