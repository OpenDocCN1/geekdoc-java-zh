    lacks coherence and sensibility if that detail is left out of the narrative. Adding
    that element—which the audience must construct itself out of the details identified
    as salient by the newspaper reports—shifts the context in which Tracy''s body
    is valued, known, and seen (in the mind''s eye). Similarly, when Tracy Hemphill
    "encountered" Terrance Cottrell, he crafted the boy''s body with a possession
    narrative. In the context of that story, in which Cottrell''s body was under the
    control of pure evil, extreme and dangerous measures justified to save the boy''s
    soul at the expense of his life. In both of these cases, the rhetorical model
    unveils the rationale and warrants that turn the violent acts into reasonable
    responses. It also shows how the text of life worth living and the possession
    narrative preceded these men'' determination to respond to a particular body.
    The texts themselves direct attention to certain sensations while ignoring others,
    as well as providing a coherent framework that dictated a particular response.
    Without the narrative of the life not worth living, selecting certain aspects
    of Tracy''s body and perceiving them as relevant would not be possible, for their
    relevance arises from their fitness with the narrative. Without the narrative
    of possession, seeing some of the characteristics Terrace appeared to deciding
