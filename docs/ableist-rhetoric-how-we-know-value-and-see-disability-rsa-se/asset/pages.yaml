- img_proc: true
  md: 'suggests that the path underneath it, through the basic ideas on which it rests
    and relies. And from the rhetorical model’s perspective, the wall rests on friable
    soil (admittedly very densely packed) instead of impenetrable bedrock.


    Changing what disability means is hard, but when pursued through the rhetorical
    model the effort itself makes progress because it makes visible the strands of
    the web that constrain it. Siebers puts it best: "A reversal of the status quo
    is not easily achieved, and this fact may be important in itself. irreversibility
    is a sign that prejudices are at play, and the power of prejudice manifests itself
    whenever we try to reverse the proposition currently defining the interpretation
    of words and images."32 Like irreversibility, invisibility reveals that prejudices
    are at play, so articulating the presence of ableist ideas simultaneously exposes
    their most powerful rhetorical device. The rhetorical model provides a way of
    seeing ableism at work, identifying the orientation it encourages, and locating
    critical steps toward overcoming ableist discrimination. Given the strength of
    ableism in Western culture, this task can seem Sisyphean, but if we can start
    to see our own and others’ bodies as texts first and bodies second we can move
    the conversation directly to those texts instead of trying to solve the puzzles
    that bodies, in all their incredible variety and complexity, seem to pose. Shifting
    the conversation in this direction dramatically facilitates identifying, exposing,
    and critiquing the ableist rhetoric that generates and sustains ableist culture.'
