  md: 'have studied how the cyborg can restructure the way society conceives nature,
    alter awareness of how technology shapes culture, and complicate theories of interface
    and technological dependence in the computer age. Scholars have also explored
    how this futuristic concept is imagined in film and literature.⁹ In of this work,
    cyborg politics describes a mode of advocacy that transcends the conventional
    relationship of agency and body. In the context of ableist rhetoric, this reconceptualization
    of the body carries the potential to subvert what is natural. Yet this promise
    remains unfulfilled, which suggests the limitations of the cyborg for anti-ableist
    politics, indicates the durability of ableist culture, and explains why the Deaf
    explicitly rejected the identity of cyborgs in the CID.


