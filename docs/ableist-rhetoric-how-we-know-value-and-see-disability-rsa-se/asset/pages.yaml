  md: '# The Rhetorical Dimensions of Ableism


    This book resides at the intersection of one of the oldest disciplines, including
    one of the newest: rhetoric and disability studies. Both of these disciplines
    maintain an active presence in the contemporary universities of Western culture.
    Though much maligned at least since its documented origins in 600 BCE, rhetoric
    has endured, adapted, and developed such subdisciplines as public address (the
    study of important speeches and other forms of public discourse) and rhetorical
    criticism (the application of rhetorical theory to analyze and critique texts
    and communication events). Rhetorical theory also informs scholars from a variety
    of other disciplines, including composition, critical/cultural studies, and performance
    studies. In the latter part of the twentieth century, a “linguistic turn” reinvigorated
    the discipline in both the humanities and, to a lesser extent, the sciences.¹
    As a result, rhetoric has spread widely within academia that some argue it has
    overtextstuffed stance, essentially taking an “architectonic” or “big rhetoric”
    stance, meaning that it claims to underlie all forms of human experience including
    music, mathematics, science, and religion. Since the 1960s, more of the debate
    over “big rhetoric” in the United States has explored the ways that it shapes
    how people know (“rhetoric as epistemic”), what people value and believe (“ideological
    rhetoric”), and how people see (“visual rhetoric”). Rhetorical scholars have certainly
    explored a good deal about these concepts, but these three have been the focus
    of extensive discussion, and each helped shift the overall trajectory of the discipline
    in this early part of the twenty-first century.


    In comparison, disability studies is a fairly young discipline that developed
    in the last quarter of the twentieth century. Disability studies cover a wide
    variety of topics, but generally all interrogate the idea that disability is a
    primarily medical condition requiring treatment with the goal of curing the disabled
    individual. We call this perspective the “medical model” of disability, as it
    describes the approach that most doctors and health-care practitioners have adopted
    for centuries when considering disability as an empirical and physical phenomenon.
    The medical model views disability as a problem, and it locates that in the bodies
    of disabled people.³ Interrogating the medical model does not mean that disability
    studies opposes the practice of medicine or rejects medical treatment. Instead,
    it means that disability studies questions the medical model''s assumptions about
    bodies and points out its failure to account for the personal, social, and cultural
    dimensions of living with a disability. Disability studies also objects any approach
    that researches the lives of disabled people “only in their'
