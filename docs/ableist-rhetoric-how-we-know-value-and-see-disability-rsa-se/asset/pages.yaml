    Consider the example of stairs. Stairs are overwhelmingly accepted as a useful
    device that allows the efficient construction of multi-level houses and buildings.
    Growing up in an ableist culture, I thought little of stairs, or even saw them
    as elegant architectural devices—especially those grand marble masterpieces that
    elevate status, like the steps of the U.S. Capitol. I now read stairs as a discriminatory
    apparatus—as if they were tagged with a “For Walks Only” sign that only those
    looking able can can see—that make their invisible presence around buildings a
    so-subtle statement about who is deserves access to our most important public
