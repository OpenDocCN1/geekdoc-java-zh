    has been known as something to be avoided and not something to be understood.
    Disability studies seeks to rectify that.


    I am not the first to explore the intersection where these two disciplines meet,
    but I approach it in a relatively new direction to reach the destination I call
    the rhetoric of ableism.⁵ While I develop a more nuanced definition of the term
    later in this chapter, ableism refers generally to discrimination and oppression
    based on ability and is analogous to racism and sexism. Rhetoricians have been
    long interested in the ways that the predominantly white, male, middle-class center
    offers and marginalizes subaltern groups over time has expanded its attention
    from the classic triad of sex, race, and class to issues as sexual orientation,
    age, and disability. At roughly the same time that rhetoricians began to examine
    disability, scholars in disability studies applied rhetorical theory in their
    analyses of laws, social institutions, political movements, popular culture, medical
    practices, literature, and film. As rhetorical began to establish a foothold in
    disability studies,⁶ another area of disability studies arose with focus on ableism.⁷
    My work takes the next step by employing rhetorical theory to study ableism. This
    journey toward this particular intersection of rhetoric and disability studies
    moves along and sometimes across the pathways taken by other scholars.


    Specifically ableism instead of disability diverges from the most common route.
    While the two concepts relate to one another, my work shows how explicitly engaging
    the former can detail insights that examining the latter can overlook. Disability
    studies has focused generally on the immediate concerns of disabled people and
    the results of ableism, often accepting disability-based discrimination’s existence
    as a preexisting institutional problem. Sim Linton explains that to gain recognition
    and establish disability studies as an academic discipline, scholars have had
    to prove that “disabled people occupy a subordinate position in critical social
    and economic domains, that their histories and legacies have been distorted.”
    As scholars complete this stage of the discipline’s development, Lington argues
    that it is now “incumbent on people across the disciplines to study the…knowledge
    base within which social positioning is deemed rational and morally sound.”⁸ I
    craft this along the lines she provides.


    Scholars in disability studies explore the impact of ableism in social oppression,
    marginalization, and discrimination against disabled people. By exposing the inequities
    and injustices they cause, their work challenges the historical view of disability
    as physical incapacities that medical science ought to cure and provides perspectives
    that place disability in a more positive light. This unites the various branches
    of the field. Tobin Siebers, a leading disability studies scholar, wrote that
    “undoubtedly the central purpose of disability studies is to reverse the negative
    connotations of disability.⁹ The many works associated with this field include
    histories of disability and the political struggles for'
