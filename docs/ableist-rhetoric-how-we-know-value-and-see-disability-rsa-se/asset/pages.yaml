    I define ableism specifically as an orientation that considers physical deviation
    from a presupposed norm as a lack. I see it as a system of discrimination that
    rhetorically invents and employs the idea of a “normal body” and treats physical
    deviation from that norm as lacking something all other nondisabled people share.
    Ableism involves ways of knowing, valuing, and seeing the so-called “abnormal”
    body as inferior. By extension, ableism discrimination places the “normal body”
    at the top of an ideological hierarchy, isolates any deviant body as the oppressed,
    and protects this arrangement by denying its presence while promoting practices
    based upon it. While ableism clearly targets “severely” disabled people, it also
    tends to exclude people with any disability perceived as a relevant element of
    a situation.


    Although I developed my definition years before I encountered the one used by
    Campbell, concepts of ableism are remarkably similar. Campbell defines it as a
    “network of beliefs, processes and practices that produces a particular kind of
    self and body (the corporeal standard) that is projected as the perfect, species-typical
    and therefore essential and fully human. Disability is then as a diminished state
    of being.”¹⁵ Campbell and I share the point of view that the core of ableism is
    an idealized norm that defines what it means to be able, that who do not fit that
    norm are disabled, and the disabled are lacking something they are supposed to
    have. In my work, I extend this concept of “lack” to explore how ableist rhetoric
    promotes discrimination against people who have extraordinary abilities in the
    same way that it oppresses people perceived as disabled.


    The ableist tendency to discriminate, at varying degrees, against any bodied abnormal
    affords the opportunity to examine any deviation from the norm as subject to ableist
    oppression. The normalized identity of the body at the center of ableist thinking
    sees only itself as purself. Although society traditionally associates only disability
    with lack, I view any body lacking the form of the “normal” body as deviant—even
    those bodies that exist in the form in some “extraordinary” or even “superhuman”
    way. A body exhibiting parts, skills, or abilities not shared by the majority
    of the population may be a freak or a sport, but it will be treated differently
    from the normal body, like the body lacking parts, skills, or abilities shared
    by the majority of the population. A radically different body that has unconventional
    skills may be discriminated against, oppressed, and isolated. Medical science
    may see to cure and correct it, children can be taught to be shocked or repuls
    by it, while many may pity the person “forced to live” in it, and social institutions
    can isolate and constrain it.¹⁶ In the ableist mindset, having only one arm or
    having three pose the same problem. Simply put, any body that lacks the ability
    to be normal is abnormal and can thereby be subjected to ableist discrimination.
    As H. G. Wells made clear in'
