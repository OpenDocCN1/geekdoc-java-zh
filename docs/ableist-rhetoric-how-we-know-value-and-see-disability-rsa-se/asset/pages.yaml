    # Rhetorical Model of Disability and the Critique of Ableism


    Placing the disabled body within the rhetorical model in an ableist culture positions
    it as a collection of sensations interpreted through an ableist frame for knowing,
    evaluating, and seeing that body. When people interpret sensations as encountering
    a body they perceive as "disabled," then what that disabled means (how it is known,
    the values assigned to it, and the way it is seen) flows to and from the labels
    and the texts it embodies. Accordingly, we perceive a body as disabled experiencing
    what we understand as believed to fit with such knowledge, values, and vision.
    This becomes a self-reinforcing circle, as developments in the encounter continue
    to shape what the disabled body means to the perceiver, which in turn shapes recognition
    of the body as disabled. In other words, once someone categorizes the encounter
    as involving a disabled person, she or he interprets happens in the interaction
    through the lens framed by already present ideas of disability, and the experience
    weakens, modifies, or strengthens he or her sense of what disability means. These
    ideas correspond to expectations about the disabled body that influence the interaction,
    and these too are either weakened, modified, or strengthened by the experience
    of embodying the texts of disability. If someone perceives another as disabled
    but then the encounter actively violates her or her expectations about disability,
    the individual faces or the person is placed in a different category and refigured
    as something other than disabled.


    For example, when people look at a person sitting in a wheelchair, a whole series
    of texts become the body of that person. They might assume that this indicates
    that the person does not have the capacity to walk, difficulty opening doors,
    or people who do not use wheelchairs. They might pity the person, be thankful
    that they do not have to use a chair, and believe that they would "have to live
    like that." They might feel unsure about how to approach the person, or look away.
    If the wheelchair user appears to validate any of these assumptions and reactions,
    then these become stronger, more likely to be applied in the future, and harder
    to set aside. If they assume that the person in the wheelchair requires assistance,
    they may provide unwanted or unnecessary "help," perhaps by opening a door or
    giving the chair push. If the person refuses assistance or it otherwise becomes
    clear that the effort is undesired, then this can shape ideas about the wheelchair
    user''s personality and possibly associate such personality traits with disabled
    people in general.'
