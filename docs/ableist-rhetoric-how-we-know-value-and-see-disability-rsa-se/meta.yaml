  md: '# The Rhetorical Dimensions of Ableism


    This book resides at the intersection of one of the oldest disciplines, including
    rhetoric and disability studies. Both of these disciplines maintain an active
    presence in the contemporary universities of Western culture. Although much maligned
    at least since its documented origins in 600 BCE, rhetoric has endured, adapted,
    and developed such subdisciplines as public address (the study of important speeches
    and other forms of public discourse) and rhetorical criticism (the application
    of rhetorical theory to analyze and critique texts and communication events).
    Rhetorical theory also informs scholars from a variety of other disciplines, including
    composition, critical/cultural studies, and performance studies. In the latter
    part of the twentieth century, a “linguistic turn” reinvigated the discipline
    in both the humanities and, to a lesser extent, the sciences.¹² As a result, rhetoric
    has spread widely within academia that some argue it has overextended itself,
    essentially taking an “architectonic” or “big rhetoric” stance, meaning that it
    claims to underlie all forms of human experience including music, mathematics,
    science, and religion.² Since the 1960s, the debate over “big rhetoric” in the
    United States has explored the ways that it shapes how people know (“rhetoric
    as epistemic”), what people value and believe and how people see (“visual rhetoric”).
    Rhetorical scholars have certainly explored a good deal more these concepts, but
    these three have each been the focus of extensive discussion, and each helped
    shift the overall trajectory of the discipline in this early part of the twenty-first
    century.


    In comparison, disability studies is a fairly young discipline that developed
    in the last quarter of the twentieth century. Disability studies cover a wide
    variety of topics, but generally they all interrogate the idea that disability
    is primarily a medical condition requiring treatment with the goal of curing the
    disabled individual. We call this perspective the “medical model” of disability,
    as it describes the approach that most doctors and health-care practitioners have
    adopted for centuries when viewing disability as an empirical and physical phenomenon.
    The medical model views disability as a problem, and it locates that in the bodies
    of disabled people.³ Interrogating the medical model does not mean that disability
    studies oppose the practice of medicine or rejects medical treatment. Instead,
    it means that disability studies question the medical model''s assumptions about
    bodies and points out its failure to account for the personal, social, and cultural
    dimensions of living with a disability. Disability studies also objects to any
    approach that researches the lives of disabled people “only in their'
  merge: -1
  pgno: 8
- img_proc: false
  md: 'particularity ... as deviation from the norm in order to increase the knowledge
    about stature of the norm.⁴ For much of the history of Western culture, disability
    has been known as something to be avoided and not as something to be understood.
    Disability studies seeks to rectify that.


    I am not the first to explore the intersection where these two disciplines meet,
    but I approach it in a relatively new direction to reach the destination I call
    the rhetoric of ableism.⁵ While I develop a more nuanced definition of the later
    term in this chapter, ableism refers generally to discrimination and oppression
    based on ability and is analogous to racism and sexism. Rheticians have long been
    interested in the ways that the predominantly white, male, middle-class center
    operates and marginalizes subaltern groups and over time has expanded its relation
    the classic triad of sex, race, and class to issues such as sexual orientation,
    age, and disability. At roughly the same time that rheticians began to examine
    disability, scholars in disability studies applied rhetorical theory in their
    analyses of laws, social institutions, political movements, popular culture, medical
    practices, literature, and film. As rhetoric began to establish a foothold in
    disability studies,⁶ another area of disability studies arose with focus on ableism.⁷
    My work takes the next step by employing rhetorical theory to study ableism. This
    journey toward this particular intersection of rhetoric and disability studies
    moves along and sometimes across the pathways taken by other scholars.


    Specifically studying ableism instead of disability diverges from the most common
    route. While the two concepts clearly relate to one another, my work shows how
    explicitly engaging the former can detail insights that examining the latter can
    overlook. Disability studies has focused on the immediate concerns of disabled
    people and the results of ableism, often accepting disability-based discrimination’s
    existence as a preexisting institutional problem. Sim Linton explains that to
    gain recognition and establish disability studies as an academic discipline, scholars
    have had to prove that “disabled people occupy a subordinate position in social
    and economic domains, and that our histories and legacies have been distorted.”
    As scholars complete this stage of the discipline’s development, Linton argues
    that it is now “incumbent on people across the disciplines to study the…knowledge
    base within which social positioning is deemed rational and morally sound.”⁸ I
    craft this project along the lines she proposes.


    Scholars in disability studies explore the impact of ableism in social oppression,
    marginalization, and discrimination against disabled people. By exposing the inequities
    and injustices these, their work challenges the historical view of disability
    as physical incapacities medical science ought to cure and provides perspectives
    that place disability in a more positive light. This unites the various branches
    of the field. Tobin Siebers, a leading disability studies scholar, wrote that
    “undoubtedly the central purpose of disability studies is to reverse the negative
    connotations of disability.”⁹ The many works associated with this field include
    histories of disability and the political struggles'
  merge: -1
