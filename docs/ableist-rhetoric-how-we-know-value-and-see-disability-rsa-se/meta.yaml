    other while illuminating different paths through which ableism operates. In a
    sum, a rhetorical approach to ableism uniquely explains how it works, spreads
    across time, and plays a role in everyday life, while showing how this simultaneously
    operates through epistemic, ideological, and visual rhetrics.


    # Two Key Terms


    While his and three other children were at church on October 23, 1993, Robert
    Latimer of Saskatchewan carried his sleeping twelve-year-old daughter Tracy from
    her bed to his pickup truck and piped carbon monoxide into the cab until she died.¹²
    He then returned her body to her bed. When the Royal Canadian Mounted Police investigated
    the next day, Latimer initially claimed she had died in her sleep but quickly
    confessed to having planned and committed the murder. In November of the next
    year, he was found guilty of second-degree murder but acquitted of first-degree
    (premeditated) murder. He was subsequently released on bail pending his appeal.
    On February 6, 1997, the Canadian Supreme Court ordered a retrial on the basis
    of jury tampering refusing to acquit Latimer entirely, holding that his confession
    was admissible and legally obtained.


    On November 5, 1997, Latimer’s second trial concluded when he again found guilty
    of second-degree murder. Under Canadian law, the conviction carries a minimum
    sentence of life with the possibility of parole after ten years. Although instructed
    by trial court judge Ted Noble not to do so, the jury recommended he be eligible
    for parole just one year. The court released him on own recognition pending an
    attempt by his lawyer to seek intervention from the Canadian federal government.
    On December 1, 1997, in a decision that surprised many legal experts, Judge Noble
    refused'
