- img_proc: false
  md: 'rights, studies of texts about images of disabilities, and critiques of legal
    structures that both perpetuate and attempt to combat this discrimination.


    By emphasizing ableism instead of disability, I tap into these social and cultural
    practices in a way that complements disability studies research. Focusing on the
    basic mechanisms and logics of discrimination directs my attention to the already
    well-established research of other forms of bigotry and intolerance and brings
    this work into the conversation. Moreover, by emphasizing rhetoric instead of
    other approaches, I benefit from the extensive scholarship of rheticians who explore
    how words, language, and texts construct political identities, hierarchies, and
    power. By examining able rhetoric in detail, I provide evidence that its central
    ideas have spread extensively throughout Western culture that it operates in contexts
    well removed from disability, which explains why ableism is powerful and difficult
    to confront.


    While investigating ableism differs from exploring disability, I emphasize that
    my project aims to complement rather than challenge disability studies. I concur
    with Fiona Kumari Campbell that “a move towards ableism must not spell a separation
    with disability studies, rather the focus on ableism is meant to reconfigure a
    disability studies perspective and extend it.”10 developing study of ableism further
    the project of removing the negative connotations of disability by calling attention
    to the larger ideological problem behind the multitude of ways that society discriminates
    and disadvantages disabled people. Ableism studies focus shift away from the "individual
    patterns" specific discriminatory acts to investigate the “social situations or
    cultural representations that influence those patterns.”11 have extended such
    disciplines as ethnic studies and women’s studies.


    Exploring ableism rather than disability turns the discussion toward a new set
    of questions. While much of the literature in disability studies asks the important
    question “What can we do about society treats disability?” I ask the question
    “What makes this an ableist culture?” Encultural arises from somewhere. From where
    did contemporary Western culture acquire and develop ableist ideals? I also the
    parallel question “How is this an ableist culture?” For ableist to operate, its
    assumptions must be accepted by society at large, and these must be brought into
    to engage specific situations and controversies. Where do the main premises of
    ableism think in our discourse, and what do we do with them? My work shows that
    since the earliest recorded appearances of ableism in Western culture, rhetoric
    has been the driving it. Considering ableism and examining it through related
    critical theories allows rhetorical analysis to work toward these questions.


    My research also differs from the conventional approach of rhetorical scholarship
    because of directing my attention to one or another vector of rhetoric, I explore
    how three key types—epistemic,'
