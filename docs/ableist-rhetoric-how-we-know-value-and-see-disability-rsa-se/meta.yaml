  md: 'to impose the mandatory ten-year prison term on Latimer, instead sentencing
    him to serve one year in a provincial jail and a second year confined to his farm
    in Wilkie, Saskatchewan. Noble granted the rare constitutional exemption by finding
    that the mandatory sentence would be cruel and unusual punishment.


    Thus described, the story of Robert Latimer makes little sense. Such a light sentence
    and preferential treatment for a man who confesses to murdering his daughter seems
    bizarre. The story changes dramatically and begins to become comprehensible once
    a single element is added: Tracy Latimer was disabled. She had cerebral palsy
    since birth. She could not walk, talk, or feed herself, and she weighed less than
    forty pounds at the time of her death. She had undergone a number of operations,
    and according to her family, had lived in pain for most of her life. Once added
    to the story, Tracy Latimer’s disability alters the interpretive framework used
    to understand the narrative, and ableist rhetoric shapes the significance of the
    event. Latimer’s crime becomes reartic as “mercy killing,” “euthanasia,” or “compassionate
    homicide.” His claim that he had only wanted was best for his daughter, and that
    his act was one of love, becomes comprehensible. Judge Noble’s statement that
    “the evidence establishes Mr Latimer was motivated by his love and compassion
    for Tracy and the need—at least in his mind—that she should not suffer any more
    pain” appears more reasonable in this context.¹³


    This reevaluation of the story of Robert Latimer is made possible by the ableist
    thinking enriched in society. Western culture continues a tradition that values
    the lives of disabled people less than the values of able-bodied human beings.


    The simple detail of Ms. Latimer’s disability changes the story not simply because
    readers interpret disability as a negative characteristic, but because they presume
    they can understand the total value of her life through it. It becomes a function
    of her disability, a synecdoche that signals an ableist orientation. The story
    teaches very little about Tracy Latimer’s condition, quality of life, or even
    what her future might have held. Readers learn only that she was disabled, had
    a condition that has a medical diagnosis, she lacked skills associated with everyday
    living, she had a small body, and her family experienced a lot of pain.


    In our ableist culture, those of disability come with so much ideological baggage
    that they change the entire paradigm through which people understand the narrative.
    Her disability considered simply another element of the story, whose relevance
    and significance needed to be considered carefully before they could be understood,
    a shift would not be possible. Learning that Ms. Latimer had a disability would
    probably reveal an area that needs further investigation, but it could not stand
    alone as an explanation for what happened any more than learning that she was
    black, lesbian, or impoverished. Within an ableist culture, the mere mention of
    disability can lead us to see the situation differently, and to interpret the
    events surrounding the end of her life through a whole new'
