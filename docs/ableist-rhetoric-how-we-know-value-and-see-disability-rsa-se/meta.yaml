    # Sport and/as Technology


    As expected at the intersection of two major institutions, sport and technology
    exhibit a complicated relationship. Sports rely upon and utilize various technologies
    while forbidding the use of others. Professional baseball players use the basic
    tool as the bat, but the technology incorporated in the bat is closely regulated.
    Major League Baseball (MLB) outlines weights and bats that are “spiked” with illegal
    substances (such as cork or rubber balls) in professional baseball. Bats must
    also be made within allowed parameters of size, weight, and balance.93 This identifies
    a basic pattern in the relationship of sport and technology: the game requires
    using tools, but rules dictate strict standards to ensure that differences between
    tools remain “incidental” and do not “interfere” with the game.

    Generally speaking, sport traditions dictate that no players should be given any
    advantage over any others because of the technology incorporated into their particular
    tools. The debate over Martin''s cart reflected this idea.


    In sport, any game is a contest of body humans struggling on the proverbial level
    field to achieve victory because of some characteristic of the body itself. The
    myths that surround it, sport rewards the bodies that exhibit “talent,” “skill,”
    “training,” “mental toughness,” “will power,” and “dedication.” Players are supposed
    to have equal access to any technology that enhances performance, and technologies
    that “artially” increase chances of winning by acting directly on the body, such
    as steroids and other performance enhancing substances, are closely scrutinized
    and generally prohibited.'
