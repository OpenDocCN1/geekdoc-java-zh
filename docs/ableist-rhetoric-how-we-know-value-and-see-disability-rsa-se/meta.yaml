- img_proc: false
  md: 'have studied how the cyborg can restructure the way society conceives nature,
    alter awareness of how technology shapes culture, complicate theories of interface
    and technological dependence in the computer age. Scholars have also explored
    how this futuristic concept is imagined in film and literature.99 In of this work,
    cyborg politics describes a mode of advocacy that transcends the conventional
    relationship of agency and body. In the context of atheist rhetoric, this reconceptualization
    of the body carries the potential to subvert normal is natural. Yet this promise
    remains unfulfilled, which suggests the limitations of the cyborg for anti-able
    politics, indicates the durability of able culture, and helps explain why the
    Deaf explicitly rejected the identity of cyborgs in the CID.


    While the majority of this cyborg theory develops the concept as a challenge to
    sexism, a recurrent theme stresses the potential of cyborg politics undermining
    forms of discrimination. The disabled have been explicitly addressed as potential
    advocates of adherents to cyborg ideology, and many early cyborg theorists have
    suggested that disabled people should create a cyborg existence and engage in
    cyborg politics. The disabled have always had a complicated relationship with
    technology. As technology is built for by bodies, many technological advances
    reify and affirm notions of normalcy that disable those who are not able-bodied.
    Stairs and telephones, for example, are technological advances that have historically
    allowed and supported “progress” in architectural and communications design. Yet
    to those in wheelchairs or people who are deaf these can present serious difficulties.
    On the other hand, technology can provide aids and prosthetics that allow many
    bodies to accomplish tasks associated with “normal” life. From the wheelchair
    to the Kurzweil Reading Machine, technological advances have made the lives of
    disabled people easier, more productive, and more fulfilling. Furthermore, technology
    often provides access to areas that had previously excluded disabled people. Ramps,
    escalators, and elevators allow passage where previously only stair treads, and
    the teletypewriter (TTY) allow deaf people to use the phone. Finally, those who
    view disability as a lack, insufficiency, or a challenge to be overcome often
    seek to “solve” the “problem of disability” through technological fixes. The medical
    community especially has developed therapeutic medicines, surgical procedures,
    and drug regimens that attempt to (re)make disabled bodies. Because technology
    plays so many roles in the lives of the disabled, they view each new technological
    advance with close scrutiny.


    Many cyborg theorists suggest that this long enduring relationship has put the
    disabled in a unique position to exploit the cyborg identity for political ends.
    Constance Penley and Andrew Ross assert that “the highly developed technulture
