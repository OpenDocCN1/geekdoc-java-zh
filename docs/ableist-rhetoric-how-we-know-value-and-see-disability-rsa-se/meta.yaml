    The third ableist rhetorical warrant I name body is able. It creates a simple
    equation of “ability” and the physical “body,” thereby obscuring the rhetorical
    construction of ability by the interaction of social institutions, cultural systems,
    popular assumptions, and the ways these shape our world world. Like deviance is
    evil and normal is natural, this premise allows an ableist calculus to operate
    invisibly, so that things like bodies’ physical capacities, skills, and dimensions
