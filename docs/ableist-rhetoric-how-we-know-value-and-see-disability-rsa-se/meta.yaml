    If we consider a framework of interpretation, we can identify its dimensions by
    examining the linguistic codes and rhetorical assumptions that govern interpretation.
    As Burke put it, “We discern situational patterns by means of the particular vocabulary
    of the cultural group into which we are born. Our minds, as linguistic products,
    are composed of concepts (verbally molded) which select certain relationships
    as meaningful.” From this perspective, meaning exists primarily as a function
    of language rather than a natural or necessary consequence of material objects
    or bodies. Indeed, as Burke concludes, “different frameworks of interpretation
    will lead to different conclusions as to what reality is.”$^{27}$


