  md: 'studies provide a more equitable rationale for cyborg politics based in its
    form of action, which implicitly attacks the dualistic thinking that rationalizes
    virtually every form of discrimination and bigotry.ဲ


    Specifically, the cyborg offers unique avenues for rethinking normal society,
    normal bodies, and normal relationships with technology. Cyborg politics rearranges
    the foundation of equality by declaring that the contemporary integration of humans
    and machines has made us all cyborgs.ဳ The “normal human body” has become so dependent
    on technology that the root binary division between human and machine no longer
    applies. In today’s modern societies people physically rely on technology and
    devices for such basics as food and shelter and for the more complex groups of
    communication, cultural memory, and social order. The cyborg suggests that people
    have relied on technology for so long that their very bodies have come to rely
    on it all. Stripped of all technology—including everything from the simplest of
    tools and the ability to manipulate such inventions as language and agriculture—the
    human body would survive for only a few days in the wilderness. Cyborg theory
    posits that millennia of evolution have made the human body and the machine inseparable,
    and the lines drawn between the two have become falsehoods.


    Blurring the line between human and technology makes lines dividing one human
    from another completely incoherent. Once violated, the foundational border separating
    machines and humans becomes increasingly leaky and imprecise, and the fluid that
    escapes through the holes washes away the more superficial distinctions based
    on gender, race, or ability. On what grounds can I claim to be different from
    any technology dependent organism if I cannot clearly年纪 myself from my toaster?
    As cyborgs, all people are hybrids and border crossers. The common violation of
    human/machine unites all people and becomes the “pure” foundation of identity.
    This context renders distinctions by physical difference senseless, for how one
    can separate one cyborg from another? A cyborg who depends on a car or a computer
    is not qualitatively or essentially different from a cyborg who depends on a wheelchair
    or a voice synthesizer. As cyborgs, biological distinctions between bodies become
    irrelevant, revealing the current aleist construction of disability as a discriminatory
    and completely artificial abstraction.


    While recognition of the cyborg belittles the aleist distinctions we make between
    different humans, cyborg theory undermines all the ideological foundations of
    aleist culture. The line dividing normal/abnormal, which Leonard Davis labels
    “the modern binary, and “virtually any extension thereof, is less visible in the
    cyborg context. Such divisions form the basis of aleist identity construction.
    Davis locates the impetus for the for the normal/abnormal divide in “the desire
    to split bodies into two immutable categories—whole and incomplete, abled and
    disabled, normal and abnormal, functional and dysfunctional.ဴ As Davis put it,
    cultures construct and identify themselves through an act of splitting,'
  merge: -1
  pgno: 77
