    # A Rhetorical Model of Body


    The rhetorical model I propose rests on a relationship between text and body.
    These two key components of my model can be found throughout studies of the body
    and disability. These studies primarily posit the body as text (or argue that
    the body is a text), making the body’s making a function of all the different
    narratives, words, images, sculptures, theories, and models that direct attention
    to the body in particular ways. Body does not exist in a vacuum because it is
    labeled, evaluated, named, and crafted by texts. In this relationship, the word
    “text” does not denote a specific thing or genre of things crafted from language
    (the words of a book or the script of a play). Instead, text refers to providing
    a framework for interpretation, recognition, and other processes involved in making
    meaning. This includes the ideas and values that lead someone to see a painting
    by Georgia O’Keefe as beautiful, or appreciate a skillful execution of a difficult
    maneuver in figure skating, or when encountering a grand piano in someone’s living
    room, or make sense out of disability.


