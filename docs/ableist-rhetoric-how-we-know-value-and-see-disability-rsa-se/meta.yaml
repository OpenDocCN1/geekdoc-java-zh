  md: 'and/or make a particular physical characteristic necessary for fully functioning
    in society. Recognized as texts, these can be interrogated by bodies cannot, as
    the presumed objectivity of the body treats ability as an inherent characteristic
    rather than a potentially harmful and questionable assumption. Once again, recall
    the memory of the stairs. Understanding stairs as texts that are made material
    raises the question of what those texts are, what warrants they use, and what
    they express acceptable ideas. In the rhetorical model, the ability to climb stairs
    resides not in a physical skill or characteristic, but in the capacity to abide
    by the text they dictate: "For Walks Only."


    In a similar way, the rhetorical model provides a useful way to make sense of
    the cases discussed in this book. The father euthanized his daughter Tracy Lamer
    saw her as a text that told the story that she was better off dead. Once she embodied
    that, poisoning her with carbon monoxide as an act of mercy that any good father
    would perform. This becomes particularly clear when we read her story initially
    without the textual addition of her disability; the story lacks coherence and
    sensibility if that detail is left out of the narrative. Adding that element—which
    the audience must construct for itself out of the details identified by salient
    in the newspaper reports—shifts the context in which Tracyamer body is valued,
    known, and seen (or imagined in the mind''s eye). Similarly, when Tracy Hemhill
    "encountered" Terrance Cottrell, he crafted the body with a possession narrative.
    In the context of story, in which Cottrell''s body was under the control of pure
    evil, extreme and dangerous measures justified to save the boy''s soul at the
    expense of his life. In both of these cases, the rhetorical model unveils the
    rationale and warrants that turn the violent acts into reasonable responses. It
    also shows how the text of life not living and the possession narrative preceded
    these men'' determination to respond to a particular body. The texts themselves
    direct attention to certain sensations while ignoring others, as well as providing
    a coherent framework that dictated a particular response. Without the narrative
    of life not worth living, selecting certain aspects of Tracy''s body and perceiving
    them as relevant would not be possible, for their relevance arises from their
    fitness. Without the narrative of possession, seeing some of the characteristics
    Terrance appeared to display demonic and deciding to perform an exorcism would
    be absurd and incomprehensible to those responsible for his death.


    When one makes sense out of the Deaf culture, it is the competing texts of deafness
    that separate the Deaf view of cochlear implants from the otolaryngologists''
    orientation towards the technology. The Hearing perspective is misinformed by
    a text that imagines deafness as a tragedy, which arises because the Hearing way
    of knowing deafness is to imagine what it would be like one who belongs to and
    in Hearing culture were suddenly lose the ability to hear. The Hearing person
    assumes that being deaf is a permanent version of the condition that he she encounters
    when something temporarily disrupts hearing (such as wearing earplugs, or attending
    a very loud concert, or being close to an explosion).'
