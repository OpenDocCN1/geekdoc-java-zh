    # The Rhetoric of the Controversy


    From a rhetorical perspective, the CID arises from the clash between two different
    ways of evaluating, knowing and seeing the body of a person who is deaf. In other
    words, it arises from the ideological, epistemic, and visual aspects of ableism.
    Many of its participants—including some otolaryngologists'
