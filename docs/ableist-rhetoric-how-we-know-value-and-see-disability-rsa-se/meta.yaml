    the two sides, which requires operating from the medical model to “step out of
    the purely scientific mode for a bit” and “willing to consider thinking differently,
    to grapple with the definition of culture and disability, which may be more sophisticated
    and difficult than initially perceived.”85 Approaching the debate from this perspective,
    I seek to unpack its rhetoric to explore how the deaf warrant influence the events
    and arguments associated with it.


    Looking at the way the debate revolves around the concepts of normal and natural
    reveals how the implant advocates'' stance relies on normal, while the Deaf stance
    adopts the reverse warrant that natural is normal. While the Deaf’s rhetoric does
    not generate the same ableistic implications as the Hearing warrant, using one
    of the same terms as an argument. In particular, it accepts the positive connotations
    of both “natural” and “normal,” which makes it logically impossible to adopt a
    more rigorous anti-deaf stance that inverts the value of normalcy. As I explain
    below, the warrants that most effectively deny the able stance that normal is
    natural are the positions that abnormal is natural and normal is unnatural. By
    basing their argument on accepting the same terms as the Hearing stance, the Deaf
    lost the option of framing the CID as a contest between able and anti-able views.
    In a sense, by accepting the implant advocates'' key terms, the Deaf situated
    their arguments in the debate within a domain defined by the logic of able rhetoric.


    The CID demonstrates the power of able rhetorical warrant normal is natural and
    the appeal of linking the concepts of nature and norm. Although the debate offers
    two ways of evaluating, thinking about, and seeing disability, my analysis reveals
    that while the Deaf stance counters the Hearing arguments for cochlear implantation,
    it does not challenge the fundamental able rhetoric upon which the position is
    based. Although they do from a different set of assumptions both base what they
    argue are naturally characteristics and behaviors and presume that normalcy makes
    them naturally desirable. Instead of repudiating the Hearing stance, the Deaf
    position mirrors it: it inverts the preference for normalcy more important than
    the inversion of its relationship with nature. In the examples I explain below,
    the proponents of cochlear implant technology argue that hearing is “normal” for
