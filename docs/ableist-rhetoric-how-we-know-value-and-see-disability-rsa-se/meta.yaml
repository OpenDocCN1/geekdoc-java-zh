  md: 'ideological system. The epistemology, ideology, and vision all change: people
    know Tracy Latimer differently, evaluate her life differently, and picture her
    differently. Readers make assumptions about her quality of life that reflect more
    prejudices than disability. Because they believe they would not to live in her
    shoes, they put themselves in her father''s.


    To understand ableism I analyze the change in orientation that occurs once Ms.
    Latimer''s condition is revealed, by discerning the assumptions that begin to
    operate as the rhetorical framework through which her story is understood. Disability
    is a loaded term, weighted down with tools and supplies sufficient for the task
    of making difference. In ableist culture is one thing to kill your child, but
    entirely different to kill your own child. Such baggage begs to be unpacked. I
    seek to unload the term "disability" by casting attention on ableism itself and
    the rhetorical mechanisms through which it operates. Scholars define these terms—ableism
    and rhetoric—in a wide variety of ways, and since they form the matrix of this
    project, I explain how I use them in this study. I do not argue that my way of
    defining these and the critical terms should be preferred or in any way more correct
    than alternatives. I specify my ways of understanding ableism and rhetoric to
    clarify my approach and position it among the work of other disability studies
    scholars and rhetoricians.


    # Ableism


    Scholars define ableism, like any complex concept, in different ways that allow
    them to conduct the work of their particular projects. The result is a range of
    ideas about what we mean by the term. As Campbell notes, “There is little consensus
    as to what practices and behaviours constitute ableism.\14 But the various definitions
    of ableism found in the literature do not weaken the term’s primary value, because
    they all link ableism to the negative connotations that provide the word with
    its primary political, social, and rhetorical power. Disability studies and ableism
    studies share the goal of convincing people that ableism has a destructive, unethical,
    and intolerable connotation, which further the project of transforming disability
    into a positive term describing a common facet of human life and a valuable component
    of human diversity. However scholars define ableism, we agree on its fundamental
    nature as a critical problem that needs to be understood and addressed.


    Moreover, a variety of different definitions enables in subtly different ways,
    scholars can more precisely shape their perspectives employed in their research,
    which produces more opportunity for discussing with and learning from each other.
    By extension, multiple definitions may even enhance the word’s impact because
    different perspectives of ableism will identify more places where it can and should
    be challenged. The definition I offer should not be the only one people invent,'
  merge: -1
  pgno: 13
- img_proc: false
  md: 'understand, and employ. I choose it because it focuses on the rhetorically
    constructed roots of ableism as the core justifications for the attitudes and
    practices of discrimination against disabled people.


    I define ableism specifically as an orientation that considers physical deviation
    from a presupposed norm as a lack. I see it as a system of discrimination that
    rhetorically invents and employs the idea of a "normal body" and treats physical
    deviation from that norm as lacking something that all other nondisable people
    share. Ableism involves ways of knowing, valuing, and seeing the so-called "abnormal"
    body as inferior. By extension, ableism discrimination practices the "normal body"
    at the top of an ideological hierarchy, isolates any deviant body as the oppressed,
    and protects this arrangement by denying its presence while promoting practices
    based upon it. While ableism most clearly targets "severely" disabled people,
    it also tends to exclude people with any disability perceived as a relevant element
    of situation.


    Although I developed my definitions years before I encountered the one by Campbell,
    our concepts of ableism are remarkably similar. Campbell defines it as a “network
    of beliefs, processes and practices that produces a particular kind of self and
    body (the corporeal standard) that is projected as the perfect, species-typical
    and therefore essential and fully human. Disability is then as a diminished state
    of being."¹⁵ Campbell and I share the point of view that the core of ableism is
    an idealized norm that defines what it means to be able, that who do not fit that
    norm are disabled, and that the disabled are as lacking something they are supposed
    to have. In my work, I extend this concept of "lack" to explore how ableist rhetoric
    promotes discrimination against people who have extraordinary abilities in the
    same way that it oppresses people perceived as disabled.


    The ableist tendency to discriminate, at varying degrees, against any body deified
    abnormal affords the opportunity to examine any deviation from the norm as subject
    to ableist oppression. The normalized identity of the body at the center of ableist
    thinking sees only itself as pure. Society traditionally associates only disability
    with lack, I view any body lacking the form of the “normal” body as deviant—even
    those bodies that exist in the form "extraordinary" or even "superhuman" way.
    A body exhibiting parts, skills, or abilities not shared by the majority of its
    population may be called a freak or a sport, but it will be treated differently
    from the normal body, like the body lacking parts, skills, or abilities shared
    by the majority of the population. A radically different body that has unconventional
    skills may be discriminated, oppressed, and isolated. Medical science may seek
    to cure and correct it, children can be taught to shocked or repelled by it, which
    may pity the person "forced to live" in it, and social institutions can isolate
    and constrain it.¹⁶ In the ableist mindset, having only one arm or having three
    pose the same problem. Simply put, any body that lacks the ability to be normal
    is abnormal and can thereby be subjected to ableist discrimination. As H. G. Wells
    made clear in'
  merge: -1
  pgno: 14
- img_proc: false
  md: 'his story “The Country of the Blind,” society decides what is normal and seeks
    to correct that which is not, even when deviance is the ability to see.^{17}


    I find it difficult to understand the predominance of ableism in Western culture.
    Ableism has become so culturally pervasive that we rarely encounter the world.
    Siebers notes that although time has passed since disability activists and scholars
    “proposed the term ableism to name this prejudice,” it has not been accepted in
    general usage, and its use “elicits scowls and smirks, even in progressive society.”^{18}
    Disability has and continues to be interpreted, understood, and evaluated in a
    complex web of predominantly negative associations, much of the time people do
    not consider this as discrimination because the strands of its web are largely
    invisible. Our culture is so used to its presence that many fail to recognize
    it until it gets entangled in it becoming disabled.^{19}


    Consider the example of stairs. Stairs are overwhelmingly accepted as a useful
    device that allows the efficient construction of multilevel houses and buildings.
    Growing up in an ableist culture, I thought little of stairs, or even saw them
    as elegant architectural devices—especially those grand masterpieces that elevate
    status of stairs, like the steps of the U.S. Capitol. I now read stairs as a discriminatory
    apparatus—as if they were tagged with a “For Walks Only” sign that those looking
    able could can see—that make their invisible presence around buildings a no-so
    subtle statement about who has and deserves access to our most important public
    spaces. As Siebers explains, “In a society of wheelchair users, stairs would be
    nonexistent, and the fact that they are everywhere in our society implies only
    that our architects are able-bodied people who thinkiouriously about access.”^{20}
    The devices have become so ingrained in cultural assumptions about architecture
    that thinking of stairs as tools of oppression will strike many as ludicrous.


    But disability scholars view such ubiquitous things as stairs as the very origins
    of what society considers to be “disability.” They point out that someone cannot
    climb stairs only becomes disabled after stairs are invented and become widely
    used. Once stairs are common and constructs themselves around their presence,
    the person who cannot gain access through them is excluded from certain areas
    and activities. In this way, nobody is disabled by their inability to use stairs;
    society’s reliance on stairs as architectural devices disables the non-stair user.
    The availability of ramps and other devices that might see instead of stairs makes
    that the choice to build stairs reflects social assumptions about whom buildings
    should be built for, and who belongs in them.


    Until society sees ableist discrimination as a culturally generated and re-infused
    system, people generally view disability itself as the problem problem only for
    disabled people, similar to the way racism is often treated as a problem for people
    of color. Of seeing the absence of ramps as a problem faced by society as a whole
    because it undermines opportunities for interaction, commerce, and community,
    stairs are seen as a problem only for those who cannot walk.'
