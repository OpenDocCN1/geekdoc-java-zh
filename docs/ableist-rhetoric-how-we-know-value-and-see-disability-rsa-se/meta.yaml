  md: '# A Rhetorical Model of Disability


    Ableism presents a difficult problem. As I noted in the beginning, ableist rhetoric
    has so saturated contemporary society, and has been a part of the traditions of
    Western culture for so long, that it can be difficult to recognize its influence.
    What many think of as a reasonable perspective—the commonsense way of understanding
    disability—assumes that disability is inherently undesirable and diminishing.“After
    all,” the ableist asks,“who really wants to be disabled? Who does not want to
    be normal?” This way of thinking legitimates ableist rhetoric at work, as it provides
    the framework in which people interpret disability and legitimates perspectives
    that share ableist assumptions and discredits which do not. This rhetoric’s power
    arises from its widespread acceptance and the invisibility that results when it
    blends into the cultural background. A culture cannot turn from an ableist orientation
    until it recognizes the ways that it has adopted that perspective.


    This argument rests on an easily overlooked distinction, without which my claim
    may seem sound. I argue that contemporary culture accepts ableist rhetoric, not
    ableism per se. Today, when cultural practices become recognized as blatant discrimination
    and bigotry, society as a whole discourages these practices because they conflict
    with generally accepted egalitarian values. While some people do and remain comfortable
    with widespread inequality and injustice, most members of contemporary Western
    culture will distance themselves from the outright bigotry or bully. A modern
    culture to view itself as ableist and rife with ableist discrimination, I believe
    that substantial pressure would promote reforms and significant change. But, for
    the most part, people do not consider themselves fundamentally ableist, as they
    do not identify the rhetoric of ableism and the ways it impacts their knowledge,
    values, and vision.


