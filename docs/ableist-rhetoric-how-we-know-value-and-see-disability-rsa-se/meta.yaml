  md: 'equivalent to Freud’s process of Spaltung. Splitting protects the social order:
    the division of good from bad creates and protects the notion of good. Inability
    to craft a clean break between desirable and undesirable creates social anxiety
    and confusion. As ableist culture splits bodies into good and bad (“good: hair,
    face, lips, eyes, hands; bad: sexual organs, excretory organs, underarms”) the
    unification of these parts in a single body creates something of a psychological
    crisis, making Spaltung a social imperative.


    Davis concurs: "The division nearly seals the frightening writing on the wall
    that reminds the hallucinated one that its wholeness is in fact a hallucination,
    a developmental fiction. The primitive reaction creates the absolute categories
    of abled and disabled, with the concomitant defenses against the fragmented body."105
    As the emblem of unification, the cyborg implicitly denies the possibility of
    division, problematizing any act of Spaltung and collapsing these fundamental
    divides that shape the ableist view of the world.


    While the dissolution of distinctions between different bodies can undermine discriminatory
    perspectives, it also works against a group’s access to identity politics. Haraway
    concluded her manifesto with the line "I would rather be a cyborg than a goddess."106
    The need for a choice between this iconic representation of the power of women
    and the cyborg indicates how one of these paths abandons the other. Indeed, at
    its core the cyborg represents a new subject position that shifts "identity politics"
    to a strategy of "post-identity politics." As Haraway notes, of the traditions
    of Western science and politics that the cyborg upsets are "the tradition of reproduction
    from the reflections of the other," which is the core practice of groups engaged
    in identity politics.107


    Depending on what one prefers, the cyborg undermines the division of us and (or
    self and Other) upon which the identities of identity politics rely, and/or it
    replaces the currently prevalent identities (women, LGBTQ people, the disabled)
    with the cyborg as a new identity. As cyborg politics rips at the foundations
    of discriminatory societies, it rips at the bases for the identities it challenges.
    Were all of little consequence. But its impact in the immediate moment—and whenever
    humanity needs for a full transition to a post-human future—may be to fracture
    or undermine some social movements that continue to advance and protect the rights
    of many oppressed groups. While identity politics relies on persistent differences
    as rhetorical foundations for power, the cyborg questions virtually all established
    structures of differentiation by combining the uncombinable.


    Haraway describes the cyborg as blasphemy, in that it poses the radical elimination
    of “animal-human (organism) and machine” upon which so many social systems depend.108
    From this blasphemy it derives its power as it violates the sanctity of historically
    well-established cultural lines and raises questions about widely shared assumptions.
    It necessitates a complete paradigm shift that begins with rethinking cyborg itself.'
