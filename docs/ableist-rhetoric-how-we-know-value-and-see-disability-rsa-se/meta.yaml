    # Ableism and the Cochlear Implant Debate


    The negative value of disability implicit in the rhetorical warrant that deviance
    is evil also arises in the logic that I label normal as natural. Indeed, the latter
    could be understood as science’s iteration of the religious concept. The idea
    that normal nature establishes ableist ideology within the rhetoric of science.
    This tends to protect it from scrutiny and provide the aura of truth, yet the
    fiction of the “normal” body can be considered a tool of oppression—a rhetorical
    construct that has historically perpetuated ableism within powerful cultural institutions.
    Lennard J. Davis, who traces the origins of the idea of the normal body in contemporary
    Western culture to the mid-nineteenth century, explains that the “normal” informs
    “a notion of progress, of industrialization, and the ideological consolidation
    of the power of the bourgeoisie.” Ultimately, Davis argues, the “implications
    of the hegemony of normalcy are profound and extend into the very heart of cultural
    production.”¹


    In the model of the body, the construction of normalcy ensures the norm as the
    statistical average. A “normal” body has ten fingers and ten toes because that
    is what most people have, and those who have more or less of either are “abnormal.”
    A “normal” body can see, taste, smell, touch, and hear, because that is what the
    majority of bodies can do. This placement of the majority at the center of the
    concept isolates the minority on the outside, revealing that the construct of
    normal employees empowers one group over another and creates a social hierarchy
    capable of privileging some people at the expense of others. Yet the “normal body”
    simply cannot exist. It is simply impossible that someone will be completely “normal”
    in that no single body will have the statistical average of dimensions, parts,
    abilities, and all other aspects collected in the idea of a body. Humans vary
    in infinite ways; we are all different from each other. Additionally, as we grow
    and live our bodies change, and they are never completely stable. An accurate
    and exact count of the number of blood cells in a body could only be done after
    body was dead and the bone marrow ceased creating such cells. Indeed, the number
    of ones one could count as part of the body is unlimited, and it depends only
    on what one decides to or number. People cannot even identify the average of everything
    because more things are found or invented all the time. Moreover, if we arbitrarily
    establish one limited set of qualities to quantify, and someone were to have the
    complete statistical average in all characteristics, qualities, and abilities,
    that person would be unlike anyone else—and therefore abnormal.'
