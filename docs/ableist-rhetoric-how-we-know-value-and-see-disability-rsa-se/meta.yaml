  md: 'has remained volatile is because both sided valued the ideas of nature and
    normal. In argument theory terms, the positions do not “clash” on the question
    of whether those are both desirable concepts, or on the question of whether normal
    and natural belong together. This lack of clash undermines the utility of the
    debate as a mechanism for establishing policy or persuading anyone to agree with
    a contrary view. On these points, the debate lacks what the ancient Greeks called
    “stases,” are points of contention where competing sides run into each other and
    prohibit the other from advancing. At these points, movement in one direction
    or the other is not possible until one side wins the debate and proceeds along
    its way. Without stances, the debate cannot be resolved by no matter how much
    the sides spend compiling additional evidence and developing their positions,
    because they never engage each other. The result is that the debate proceeds like
    the proverbial “two ships passing in the night,” as the rhetorical positions head
    in opposing directions but fail to collide. Two swordfighting warriors who circle
    each other without making contact. Until they engage, the fight remains unresolved,
    and the question of which warrior is better than the other cannot be established
    except by preference.


    This limits the Deaf stance’s rhetorical efficacy by making acceptance of Deaf
    culprit for the debate. Those who saw natural and normal from the Deaf perspective
    would agree with their stance, but those who saw these things from the Hearing
    perspective would disagree. Identifying things as either natural or normal simply
    reflects the point of view that people bring to the question; their “meaning”
    is a function of perspective. The CID could become a clash over the propriety
    of ableist valuing, knowing, and seeing normal as natural, but in its current
    state it resembles a vary of assertions that apply only to those who already agree.
    The Hearing perspective views deafness as an abnormal deviation from human nature
