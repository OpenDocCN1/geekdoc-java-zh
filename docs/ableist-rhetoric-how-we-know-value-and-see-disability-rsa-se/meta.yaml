    cochlear implants. One uninformed explanation of why the implants were not more
    relied upon the profoundly ableist assertion that deaf people are essentially
    ignorant. For example, Margaret Skinner claimed that the social isolation caused
    by deafness prohibited the deaf from learning about the implant: “These people
    isolate themselves in the population. They avoid support groups that could help
    them, and they don’t listen to television or radio because they can’t hear it.”83
    Skinner’s dismissal of the entire controversy over implants as simple ignorance
