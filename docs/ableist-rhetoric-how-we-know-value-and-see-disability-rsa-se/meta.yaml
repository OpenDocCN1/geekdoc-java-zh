    # Cyborg Theory, Identity Politics, and Ableism


    One of the more provocative ideas about the body from postmodern theory is the
    notion of the cyborg as a radical political identity. Donna J. Haraway launched
    the concept in 1985 “Manifesto for Cyborgs,” and the theoretical investigation
    of the cyborg has culminated in several projects.\98 These'
  merge: -1
