  md: 'As a rhetician I am very sensitive to the power of names and words, and deliberately
    chose to use phrases as “disabled people” and “the disabled” in this book. I selected
    these terms over the common “person-first” language, which employs phrases such
    as “people with disabilities” with the logic that identifying subjects as persons
    before noting their disability will prioritize their humanity.

    Proponents of person-first language argue that using the term “disabled” tends
    to reduce people to a mera category identified by their condition, and that “disabled
    people” syntactically prioritizes disability over personhood. In theory, person-first
    language implicitly critiques the medical model, which conflates a person and
    their disability, because it approaches someone first as a person rather than
    a broken body that needs to be fixed.


    When originally developed, using person-first language challenged the conventions
    of ableist discourse that dehumanized people, and thus called attention to it.
    Saying or writing “person who is blind” instead of “the blind” sounds awkward
    and unwieldy to an ableist culture conditioned to think that a disability defines
    a person. In this context, using person-first phrases made an important statement
    and encouraged hearers and readers to consider the reasons why someone would willingly
    speak and write in this unconventional manner. For these reasons I formerly encouraged
    person-first language in my writing and classrooms, and I defended the practice
    in my dissertation. At the time I argued that I could best support the challenge
    to ableist culture by using language that deviated from typical ableist terminology.


    But person-first language is not without its problems or critics, and these have
    convinced me to instead use terms such as “disabled people” and “the disabled”
    in this book as a rhetorical practice that challenges ableist rhetoric. One problem
    with it is that it risks reifying negative connotations of disability because
    it implicitly accepts the ableist idea that disability lessens value. The idea
    that putting disability undermines person relies on the ableist assumption that
    something is wrong with being disabled. If we view disability as a neutral or
    positive term, then it should not undermine someone’s status and there be no reason
    to put the person first and disability second. We would not object to calling
    someone “outstanding student,” “exceptional athlete,” or “best friend,” and we
    do not express a preference for phrases like “person who is an outstanding student,”
    “person with exceptional athletic skills,” or “person who is my best friend.”
    In other words, using the adjective “disabled” as a neutral or even positive description
    is one way of following Foucault’s suggestion that we open the existing discursive
    practices to new meanings to transform the culture that uses such words and texts.


    Additionally, the phrase “people with disabilities” may counteractively displace
    attention from the ableist social oppression that it seeks to challenge. Linguistically
    putting the person first obscures the way that society generally treats disabled
    people as second-class citizens. Brendan Gleason, among'
