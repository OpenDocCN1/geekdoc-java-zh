  md: 'shift between these two perspectives requires a relatively small but profound
    movement, because it brings to light the operation of a system almost always overlooked.
    Just as studies of whiteness revealed the invisibility of institutional and subtle
    racism, I seek to engage the problem of ableism by exposing the ideological foundations,
    assumptions, and thinking that perpetuate its existence.^21 I do this by focusing
    on its rhetoric.


    # Rhetoric


    Rhetoric is the second word at the center of my project. The range of ways that
    scholars have defined this word in their work varies greatly, and its ancient
    roots and disparate uses make it a much broader term than the much newer "ableism."
    As above, I find this useful state for scholarship, and reiterate that I do not
    seek discipline other scholars who wish to approach the concepts from different
    angles.^22 My approach to rhetoric focuses on the way that it explains how being
    becomes becoming—that is, how society comes to understand, evaluate, and perceive
    something—and I ground my application of the theory in two concepts: ideology
    and warrants.


    Stuart Hall defined ideology as "the mental frameworks—the languages, the concepts,
    categories, imagery of thought, and systems of representation—which different
    classes and social groups deploy in order to make sense of it, define and render
    invisible the white society.^23 This theory of ideology "helps us analyse how
    a particular set of ideas comes to dominate the social thinking of a historical
    block ... and maintain its dominance and leadership over society as a whole."
    I find ideology thus described especially useful for explaining the hierarchies
    of dominance and subordination under which society organizes itself. As Hall writes,
    ideology “has especially to do with the concepts and the languages of practical
    thought that stabilize a particular form of power and domination; or which reconcile
    and accommodate the mass of the people to their subordinate place in the social
    formation.^24


    Hall’s articulation of ideology provides an excellent basis for understanding
    ableism, which dominates the thinking of our society as a whole and operates as
    a discourse of power. Furthermore, ableism becomes most visible as a mental framework
    transmitted through rhetorical devices, including language, imagery, and systems
    of representation. In this sense, I propose to identify the primary rhetoric that
    generates an ableist response and sustains ableist culture.


    Every way of thinking about something—every perspective, value system, paradigm,
    and ideology—has its biases somewhere. We are not born thinking of things one
    or the other, and we are taught to understand the world as we do. In our words,
    learn meaning—it does not arise naturally from objects or relationships. In Hall’s
    words, “there is no final, absolute meaning—no ultimate signified, only the endlessly
    sliding chain of signification.^25 The rhetician Kenneth Burke made the point
    in more dramatic terms: “Stimuli do not possess an absolute meaning. Even a set
    of signs indicating the likelihood of death by torture has another meaning in
    the orientation of a comfort-loving'
