  md: "# Solving Symbols and References\n\n```\n#Test\npublic void solveTypeInPackage()\
    \ throws Exception {\n    CompilationUnit cu = StaticJavaParser.parse(new File(FILE_PATH));\n\
    \    ResolvedReferenceTypeDeclaration otherClass = EasyMock.createMock(ResolvedReferenceTypeDeclaration.class);\n\
    \    EasyMock.expect(otherClass.getQualifiedName()).thenReturn(\"org.javaparser.example\\\
    chapter5.Bar\");\n    /* Start of the relevant part */\n    MemoryTypeSolver memorySolver\
    \ = new MemoryTypeSolver();\n    memoryTypeSolver.addDeclaration(\"org.javaparser.examples.chapter5.Bar\"\
    , otherClass);\n    Context context = new CompilationUnitContext(cu, memoryTypeSolver);\n\
    \    /* End of the relevant part */\n    EasyMock.replay(otherClass);\n\n    SymbolReference<ResolvedReferenceTypeDeclaration>\
    \ ref = context.solveType(\"Bar\", memorySolver);\n    assertEquals(true, ref.isResolved());\n\
    \    assertEquals(\"org.javaparser.examples.chapter5.Bar\", ref.getCorrespondingDeclaration().getQualifiedName());\n\
    }\n```\n\n# MemoryTypeSolverComplete.java\n\nIn this case, we want to verify that\
    \ the rest of the code looks for one specific type (com.foo.OtherClassInSamePackage)\n\
    Instead of parsing a JAR to use it in the text we use the MemoryTypeSolver and\
    \ instruct it to return a TypeDeclaration when the name com.foo.OtherClassInSamePackage\
    \ is used.\n\nIt could be possible to also analyze applications using custom class\
    \ loaders, generating classes on the fly or in weird situations. In most cases,\
    \ you can just ignore the existence of the MemoryTypeSolver.\n\n# Summary\n\n\
    At this point, you should have an idea of what kind of problems JavaSymbol can\
    \ solve for you. We do not expect to have answered all your questions on the library\
    \ and we did not explore the whole API, but we should have provided you with a\
    \ starting point. The Javadoc can help you solve some of your remaining questions.\
    \ For the others feel free to contact us."
