  md: "# Solving Symbols and References\n\nThink about the last point: if a is an\
    \ int then the result of a + 1 is going to be an int. However a could be a String,\
    \ in that case, we are not summing 1 but we are concatenating its string representation\
    \ to the String represented by a. In other words, by simply looking at the AST\
    \ we cannot say what kind of operation we are performing: an algebraic sum or\
    \ a string concatenation? It depends on the type of a. To answer these questions\
    \ we have resolve references. We have to connect the reference to a a + 1 to the\
    \ declaration of a that is being referred.\n\nNow consider the following case:\n\
