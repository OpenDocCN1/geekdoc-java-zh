  md: "# Solving Symbols and References\n\nIn this case, the context we use is the\
    \ fieldDeclaration. This means we want JavaSymbolSolver to consider what a reference\
    \ type Bar means when used to point to where that particular node is defined\n\
    \nConsider this:\n\n```\nclass Foo {\n  Bar bar;\n}\n\nclass Zum {\n  Bar bar;\n\
    }\n\nclass Bar {\n\n}\n```\n\nFrom the point of view of JavaParser, both the FieldDeclarations\
    \ have the same type: a named Bar. But that name in different contexts means different\
    \ things. By passing that name JavaParser type and the context (the first or the\
    \ second FieldDeclaration) JavaSymbolSolver will give us different answers and\
    \ figure out the real type being used in each case.\n\nPretty method, eh?\n\n\
    # Resolving method calls\n\nAnother thing that JavaSymbolSolver can help you with\
    \ is resolving method calls. As you probably know Java permits the overloading\
    \ of methods, i.e. different methods having the same name but a different signature.\
    \ This, however, can make it unobvious which method is called by a particular\
    \ invocation.\n\nConsider this:\n\n```\nclass A {\n  public void foo(Object param)\
    \ {\n    System.out.println(1);\n    System.out.println(\"hi\");\n    System.out.println(param);\n\
    \  }\n}\n```"
