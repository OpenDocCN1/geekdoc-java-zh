  md: "# A Flying Visit\n\nThere are a few lines of code here, let's go through them:\n\
    \nWe create a custom String which refers to the path of our Java file. As both\
    \ files exist within the project we're using its relative path rather than from\
    \ the file system root for brevity.\n\nInside our method we instantiate a CompilationUnit\
    \ type by calling the static parse method on the StaticJavaParser class; which\
    \ takes a FileInputStream using the path we previously defined.\n\nFor convenience,\
    \ although we're creating an instance of a FileInputStream we do not need to concern\
    \ ourselves with closing the resource, the parse method will take care of this.\n\
    \nAlthough there is no meaningful output, if you have completed all the previous\
    \ steps executing main should complete successfully. Try it now.\n\nOnce we have\
    \ a compilation unit to work with we can define our first visitor. Our visitor\
    \ is going to extend a class VoidVisitorAdaptor.\n\nAlthough that sounds like\
    \ an odd name we can break down into its constituent parts. The Void means we're\
    \ not expecting the visitor to return anything, i.e that this visitor may produce\
    \ a side effect, but not operate on the underlying tree. There are other types\
    \ of visitors that will do this, which we will come to later.\n\nThe Adaptor refers\
    \ to the class part of an adapter pattern, which provides default implementations\
    \ of the VoidVisitor interface, which accepts around 90 different types as arguments\
    \ ([Appendix B](link) for the full list). So defining our own visitor we are interested\
    \ in. In practice, this means you can define only the method for the type you\
    \ are to handle a certain type of nodes (e.g. field declarations), while your\
    \ visitor will not do anything with the dozens of other node types you are not\
    \ interested in. If you were instead to implement VoidVisitor directly you would\
    \ have to define dozens of methods, one for each node type: not very practical.\n\
    \nIn our case, we're going to override the adaptor visit method that accepts a\
    \ type of MethodDeclaration as an argument.\n\nDefine a new class that looks like\
    \ the following:\n\n```\nprivate static class MethodNamePrinter extends VoidVisitorAdapter<Void>\
