  md: "# Solving Symbols and References\n\n```\nclass MyClass extends SuperClass {\n\
    \    public void returnSomeValue() {\n        System.out.println(aField.size());\n\
    \    }\n}\n```\n\nWhere does aField comes from? We do not know, it could be a\
    \ field defined in MySuperClass. Or maybe MyClass extends another class named\
    \ MyExtraSuperClass and that class defines the field named aField.\n\nSo we need\
    \ to check MyClass to figure it out. Well, this is what JavaSolver will do for\
    \ us. In order to do that, however, JavaSolver will need to know where to look\
    \ for classes. Classes could:\n\n+   - in Java source files, if they are classes\
    \ we are compiling right now\n- in class files or JARs from some library\n- in\
    \ the IRE, for classes like java.lang.Object or java.lang.String\n\nDepending\
    \ on your area, there are different TypeSolvers that you need to pass to JavaSolver.\n\
    JarTypeSolver: this TypeSolver looks for classes inside a JAR file. You just need\
    \ to specify where the JAR file is located.\n\nJavaParserTypeSolver: this TypeSolver\
    \ looks for classes defined in source files. You just need to specify the root\
    \ directory. For example a src directory. It will look for source files in a directory\
    \ corresponding to the package. So it will look for class a.b.C in the directory\
    \ b under a directory a the root directory specified.\n\nReflectionTypeSolver:\
    \ there are some classes that are defined as part of the language and for which\
    \ there is no JAR. Classes like java.lang.Object for finding the definition of\
    \ such classes we can use reflection.\n\nMemoryTypeSolver: this TypeSolver returns\
    \ the classes we have recorded in it. It is mostly intended for tests.\n\nCombinedTypeSolver:\
    \ You want typically to combine multiple TypeSolver into one. To do that you use\
    \ the CombinedTypeSolver.\n\n# Resolving a type using an absolute name\n\nYou\
    \ can use a TypeSolver directly if you want. What will this do is find an element\
    \ definition given its qualified name.\n\nConsider this example:"
