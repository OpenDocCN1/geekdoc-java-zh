    # Working with comments


    As most cases, we tend to recommend using a visitor to meet your needs, we have
    previously seen an example of this in our quick start chapter: A Flying Visit.
    If you have jumped into this chapter you should refer back to.


    Another good option for working with comments in your code aside from visitors
    is the getAllContainedComments method of the CompilationUnit. If the current task
    you''re undertaking is primarily concerned with the comments, this gives you a
    comment centric view of the code. The list returned you can navigate Node in the
    AST is attributed via the commentedNode relationship.


    Beyond that, comments themselves are Node types, so they''re first-class citizens
    within the compilation unit. They hold largely the same information any AST node
    would around position. There are some differences; they cannot have comments attributed
    to them and do not have children, but that would be intuitive. So generally speaking
    you can work with them in a similar way any other node with respect to examination
    and manipulation.


    # Parsing Options


    Up until now we have only created a CompilationUnit by immediately calling the
    static parse method on the StaticJavaParser class. This is because the parser
    is assumed a number of sensible defaults; however, when working with comment parsing
    there are a couple of dials we can tweak.'
