  md: "Solving Symbols and References\n\nEach of these is an instance of ReferenceTypeDeclaration.\
    \ That class has many methods to access a rich model of the type. You can find\
    \ all the ancestors, inherited methods and fields, annotations, which types can\
    \ be assigned to and more.\n\nNote that it does not matter which TypeSolver are\
    \ using: if your class has been found through reflection from a source file or\
    \ from a JAR, JavaSymbolSolver will provide a model of it with the same interface,\
    \ i.e. it will always return an instance of ReferenceTypeDeclaration.\n\n# Resolving\
    \ a Type in a context\n\nTypeSolver alone can find types when their qualified\
    \ names are provided; however, JavaSolver can use the context to find which actual\
    \ qualified name corresponds to a certain declaration. Consider this:\n\n```\n\
    package org.javaparser.examples.chapter5;\nimport org.javaparser.examples.chapter4.*;\n\
    class Foo {\n  Bar bar;\n}\n```\n\n![](img/58740d8ab037662f51bd4ad4bcd77db6_51_0.png)\n\
    \nWhat is the type of the field bar?\nIt could be org.javaparser.examples.chapter5.Bar\
    \ or org.javaparser.examples.chapter4.Bar. JavaSymbolSolver will figure this out\
    \ for you by looking at the context and considering things like:\n\n+   - Name\
    \ of the classes in the type is used\n- Import directives\n- The current package\n\
    \nHow do you tell JavaSymbolSolver which context to use? Well, it determines this\
    \ by looking at the AST in which the node you are interested into is contained."
