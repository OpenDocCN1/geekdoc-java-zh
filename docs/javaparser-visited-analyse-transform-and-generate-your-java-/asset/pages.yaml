  md: "# Pretty Printing and Lexical Preservation\n\nYou can use JavaParser for different\
    \ purposes. Two of the most common are code generation and code transformation.\
    \ In both cases you end generating Java code, probably to store it in a file with\
    \ the Java extension.\n\nA simple call to toString() on your CompilationUnit will\
    \ return a String that you can use to write your source. The question we are posed\
    \ with is: how will it format the code from your AST?\n\nThe answer is one of\
    \ two ways:\n\n+   - using pretty-printing\n- lexical-preserving printing\n\n\
    So let's consider how they differ.\n\n# What is Pretty-Printing?\n\nPretty-printing\
    \ means that we write our code out as source, the textual representation is printed\
    \ in a nicely formatted and standard way.\n\nFor example, if you were to parse\
    \ an existing java class that looks like:\n\n```\nclass A { int\n\na; }\n```\n\
    \nThen later you decide to pretty-print it using JavaParser you would get following\
    \ representation of the code:\n\n```\nclass A {\nint a;\n }\n```"
  merge: -1
