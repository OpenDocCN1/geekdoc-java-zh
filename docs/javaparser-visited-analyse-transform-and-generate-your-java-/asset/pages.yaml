  md: 'Preface


    can I automatically detect problems, can I produce this code more quickly? All
    developers should be interested in how they can attain both of these.


    In likelihood, you will rarely be including the JavaParser library in user software.
    Typically it forms part of a tooling component that will operate on the source
    code of your project, or perhaps generate the code that will ultimately serve
    users.


    Language tooling is probably the most common example of what we see the library
    used for. This notion that we can identify points of interest within the code
    and then perform an action.


    More broadly speaking it is for language engineers and tooling developers.


    As a library for Java, it is assumed you already have a fair understanding of
    Java.


    # This book is not for


    Those wishing to learn Java, by extension of this book is not going to teach readers
    Java.


    It will not get you great insight into how to write a parser either, beyond what
    users will be interested in.


    We are also not going to take a deep look into the Java grammar or the underlying
    grammar definition of the library. Readers wish to gain more understanding in
    that area should visit the Java Language Specification¹ site.


    Perhaps most controversially, those who are squamish about lack of tests. Like
    most things, approaches to testing is subjective and it is not a goal of this
    book to offer opinions on the subject. As such the example in this book is largely
    demonstrated through the main method.


    # How to use this book?


    This book is intended to be a learning aid for those using the JavaParser library.


    It is not a reference guide, we have tried to maintain the JavaDoc² for this purpose.
    If you find that documentation lacking please raise a question on GitHub.


    We have separated the book into two parts, the first is intended to get you to
    speed with Abstract Syntax Trees, the key components of the library and how to
    get working examples on your machine. If you are a novice, it is recommended that
    you read the first part in order to get a good grounding in the subject.


    The second part of the book is a collection of use cases that provide a more detailed
    look at how we see the library being used. The use cases can be read out of order,
    perhaps starting with one the user relates to. Although there is certainly no
    harm in reading them all.


    > ¹https://docs.oracle.com/javase/specs/jsls/se8/


    > ²http://www.javadoc.io/doc/com.github.javaparser/javaparser-core/'
