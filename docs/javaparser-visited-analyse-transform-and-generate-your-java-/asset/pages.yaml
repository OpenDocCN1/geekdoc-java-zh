  md: "# Comments In Practice\n\nSo here is a fun little class we have put together\
    \ to exaggerate earlier points around commenting code being \"prison rules\" where\
    \ anything goes. Believe it or not, these are actually some of the more sane examples\
    \ we have seen.\n\nLet's explain the class itself, so it does not distract from\
    \ what we're actually here for the (comments). Mirroring our analogy, we use threads\
    \ to compete over who will be first/last to write to the console. We define a\
    \ simple class that contains a field that each thread will be thread's personal\
    \ catchphrase. When run is called for the thread it will print its catchphrase.\
    \ The main method instantiates three different threads with different catch phrases\
    \ and invokes the start method. The majority of times this code runs will execute\
    \ in the manner you would expect, but it is not guaranteed!\nAlthough it's particularly\
    \ obnoxious to have this variety of comments in a single class, these cases come\
    \ up, and some may be counter-intuitive.\n\n```\npackage com.github.javaparser;\n\
    public class PrisonRules /* Maybe use Runable? */ extends Thread {\n    @Deprecated\n\
    \    // What is\n    // dibbs?\n    private final String dibbs;\n\n    public\
    \ PrisonRules(final String dibbs) {\n        this.dibbs = dibbs;\n    }\n\n  \
    \  @Override // Is this really overridden?\n    public void run() {\n        System.out.println(dibbs);\n\
    \    }\n\n    public static void main(String/* We should pass arguments in here\
    \ */] args) {\n        Thread t1 = new Thread(PrisonRules(\"mine\") /* This should\
    \ run first */);\n        Thread t2 = new Thread(PrisonRules(\"yoink\"));\n  \
    \      Thread t3 = new Thread(PrisonRules(\"finders keepers!\"));\n\n        //\
    \ Here Be Dragons\n        t1/*(\\*_*)*/.start();\n        t2/*(@_)*/*(~)*/start();\n\
    \        /** We need more JavaDocs! */\n}\n```"
