  md: '# # A Brief Introduction to Abstract Syntax Trees


    It is not really possible to consider how a Java language parser can be useful
    without understanding the concept of syntax trees.


    Let''s start by trying to imagine that source code can be represented as a tree.
    Both have a single starting point, from here branches form independently from
    one another, either as code statements or in case of a tree, actual limbs. As
    with a real tree''s branches, the process of breaking complex statements into
    smaller parts will continue until we hit a terminal or a leaf.


    A tree representing Java code will have a root representing a whole file, with
    nodes connected to the root for all the top elements of a file, like import or
    class declarations, we could reach multiple nodes, representing the fields or
    the methods of the class.


    ![](img/58740d8ab037662f51bd4ad4bcd77db6_9_0.png)


    Fig. 1.1 - A first glance to an Abstract Syntax Tree


    In the same way that a branch on a real tree has no connection to other branches
    other through its origin, the same is true for a tree that represents source code.
    As a human, or a compiler understand that a variable reference or a method call
    relates to another part of the source code, a syntax tree does not, and this is
    an important distinction''


    # # Everything is a node


    The tree metaphor only takes us so far, however.


    In the classical computer science sense when talking about graphs with vertices
    and edges, or directed graphs in the case of trees. Depending on the literature
    you''re reading these can also be synonymous with nodes and relationships. For
    the purpose of this book, we use node as it is considered less convoluted, and
    in line with the library classes.


    > * Adding the connections between related elements, like method calls to method
    declarations or field references to a field is the job done by a Symbol Solver.
    The JavaSymbolSolver is the Symbol Solver created to work with JavaParser.'
