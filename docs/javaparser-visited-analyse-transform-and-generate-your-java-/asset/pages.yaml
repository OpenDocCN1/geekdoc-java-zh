  md: "Comments - Here Be Dragons\n\nAt this stage in the library's development, we\
    \ are largely opting to use sensible defaults rather than provide a multitude\
    \ of configurable options, that in themselves might be more confusing.\n\nIn the\
    \ above case arguably the programmer could have used a multiline comment and we\
    \ would avoid the issue! In itself that is a good exercise; see if you can identify\
    \ comments that appear on consecutive multiple lines and make them into a single\
    \ block comment.\n\n# Comment Attribution\n\nA node can have at most one comment\
    \ associated with it, which is referenced in its comment field. Then the type\
    \ of comment, as you might expect be one of either LineComment, BlockComment or\
    \ JavadocComment.\n\nThe relationship between node and comment is bi-directional,\
    \ so comment maintains a commentedNode reference.\n\nWhen trying to determine\
    \ where a comment should be attributed, first consider what type of comment it\
    \ is; block and Javadoc styles behave the same, but line comments are slightly\
    \ different.\n\nDuring attribute the comments parser will look to assign or Javadoc\
    \ style comments to the following node: either on the same line or subsequent\
    \ line. On the other hand, will be assigned to the node preceding when they appear\
    \ on the same line as another node or the following node when they're on one of\
    \ their own.\n\nThe above holds true when the comment is placed \"sensibly\" between\
    \ two tokens.\n\n# Orphan Comments\n\nWe have touched on this concept in other\
    \ chapters in the book, but it bears repeating. Comments that can't be attributed\
    \ to a particular node in the tree are deemed to be orphaned. More than not, if\
    \ you can't find a comment attributed to the node you expect, it will be an orphan\
    \ elsewhere. Most likely in the parent of the node you would expect.\n\nConsider\
    \ the following:\n\n```\n// Orphaned 1\n// Attributed 1\npublic class TimePrinterWithComments\
    \ {\n\n// Orphaned 2\n// Attributed 2\npublic static void main(String args[]){\n\
    \    System.out.print(LocalDateTime.now());\n}\n// Orphaned 3\n}\n```"
