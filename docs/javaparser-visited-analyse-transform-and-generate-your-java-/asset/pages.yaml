  md: "# Solving Symbols and References\n\n# A.java\n\nWe have three calls and those\
    \ three refer to three different methods that just happen to have the same name.\n\
    \nHere is how we can use JavaSymbolSolver to find out which method is invoked\
    \ in each case:\n\n```\npublic class ResolveMethodCalls {\n    private static\
    \ final String FILE_PATH = \"src/main/java/org/javaparser/examples/A.java\";\n\
    \n    public static void main(String[] args) throws Exception {\n        ReflectionTypeSolver\
    \ typeSolver = new ReflectionTypeSolver();\n        JavaSymbolSolver symbolSolver\
    \ = new JavaSymbolSolver(typeSolver);\n        StaticParser\n            .getConfiguration()\n\
    \            .setSymbolResolver(symbolSolver);\n\n        CompilationUnit cu =\
    \ StaticParser.parse(new File(FILE_PATH));\n\n        cu.findAll(MethodCallExpr.class).forEach(mce\
    \ ->\n            System.out.println(mce.resolveInvokedMethod().getQualifiedSignature(\\\
    n        )));\n    }\n}\n```\n\n# ResolveMethodCalls.java\n\nThis will print:\n\
    \n```\njava.io.PrintStream.println(int)\njava.io.PrintStream.println(java.lang.String)\n\
    java.io.PrintStream.println(java.lang.Object)\n```\n\nNote also that JavaSymbolSolver\
    \ figures out which methods are visible in a certain context, it determines the\
    \ type of the method calls (in this case System.out) and so on. It is quite some\
    \ work and you probably do not want to do it, especially when you can just use\
    \ this library and move on to the next problem."
