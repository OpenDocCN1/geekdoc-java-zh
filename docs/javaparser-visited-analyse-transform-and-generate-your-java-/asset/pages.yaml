  md: "# Using the CombinedTypeSolver\n\nWhen examining real applications you are\
    \ getting gonna to use the CombinedTypeSolver to group different other TypeSolver\
    \ into one.\n\nSuppose for example that the application you want to examine uses\
    \ classes from:\n\n+   - the standard libraries\n- 3 different jars\n- 2 directories\
    \ containing source code\n\nYou could create one CombinedTypeSolver containing\
    \ an instance of the ReflectionTypeSolver, 3 instances of the JarTypeSolver and\
    \ 2 instances of the JavaParserTypeSolver.\n\nThe code could look like this:\n\
    \n```\npublic static void main(String[] args) throws IOException {\n    TypeSolver\
    \ myTypeSolver = new CombinedTypeSolver(\n        new ReflectionTypeSolver(),\n\
    \        JarTypeSolver.getJarTypeSolver(\"jars/library1.jar\\),\n        JarTypeSolver.getJarTypeSolver(\"\
    jars/library2.jar\\),\n        JarTypeSolver.getJarTypeSolver(\"jars/library3.jar\"\
    ),\n        new JavaParserTypeSolver(new File(\"src/main/java\")),\n        new\
    \ JavaParserTypeSolver(new File(\"generated_code\\))\n    );\n    // using myTypeSolver\n\
    }\n```\n\nUsingCombinedTypeSolver.java\n\n# Using the MemoryTypeSolver\n\nAs we\
    \ anticipated this TypeSolver is typically not used in real applications; it is\
    \ mainly intended to be used in tests. Lets consider one real test from the JavaSymbolSolver\
    \ project:"
