  md: "# A Simple Visitor With State\n\nIt is often useful during traversal to be\
    \ able to maintain a record of what we have seen so far. This may be helpful for\
    \ our current decision-making process, or we may want to collect all occurrences\
    \ of something deemed interesting.\n\nThe second parameter to the visit method\
    \ is to offer a simple state mechanism that is passed around during the traversal\
    \ of the tree. This gives us the option of having the visitor perform an action,\
    \ the visitor's responsibility is to collect the items i.e. method names. Then\
    \ the invoking class with the method names collected is then up to them.\n\nLet's\
    \ have a look at this in practice, create another visitor class, this time it\
    \ will be parameterised with a List<String>.\n\n```\nprivate static class MethodNameCollector\
    \ extends VisitorAdapter<List<String>> {\n    @Override\n    public void visit(MethodDeclaration\
    \ md, List<String> collector) {\n        super.visit(md, collector);\n       \
    \ collector.add(md.getNameAsString());\n    }\n}\n```\n\n![](img/58740d8ab037662f51bd4ad4bcd77db6_18_0.png)\n\
    \nPreviously we referred to the argument as being a state, but that quite conjures\
    \ a negative image in people's mind. Therefore it might be better to think of\
    \ this object as being a collector in order to make it more palatable. In our\
    \ visitor method, we add the String name of the collector object rather than printing\
    \ it.\n\nOk, so we can now add our second visitor to main in order to compare\
    \ the outcome.\n\n```\nList<String> methodNames = new ArrayList<>();\nVoidVisitor<String>\
    \ methodNameCollector = new MethodNameCollector();\nmethodNameCollector.visit(cu,\
    \ methodNames);\nmethodNames.forEach(n -> System.out.println(\"Method Name Collected:\
