  md: "# Comments - Here Be Dragons\n\nWhere does one start on this subject? - Well\
    \ with a classic programmer metaphor it seems. I would say, as a community of\
    \ developers, more time has been spent discussing thoughts on comment parsing\
    \ rather than any other feature within JavaParser project.\n\nIt is hard to start\
    \ perhaps its tail [bad dragon] is not yet over. As of the time of writing the\
    \ next major release of the library plans on rebuilding the behaviour from the\
    \ ground up.\n\nWhy are comments so challenging to work with? Well, formally comments\
    \ do not constitute part of the abstract syntax tree for a language. The abstract\
    \ part meaning that it omits the elements of the syntax tree that are\n\nAs such\
    \ they're not really covered by the Java language specification, beyond a single\
    \ page; in a document that is 800 pages that barely consists as a footnote.\n\n\
    For the most part what you include in comment tokens, and when you include them,\
    \ becomes \"prison rules\" i.e. anything goes. Even when you eventualities are\
    \ catered, for someone will come provide a new edge case where comment parsing\
    \ falls short.\n\nUnlike annotations that are clearly stated with another language\
    \ concept, classes, methods, fields, due to their location within the syntax tree,\
    \ comments are not. In turn, this means the concept of attribution i.e. what is\
    \ commented can become ambiguous; so inevitably the implementation will not suit\
    \ everyone all of the time.\n\nAll said it is a hugely popular feature of the\
    \ library.\n\nWhat does this all mean for you as the user? Well, although we have\
    \ made the best efforts to make comment parsing and attribution work in a sensible\
    \ and robust way. It may not meet some expectations with regards to how it works,\
    \ particularly if you have complex needs.\n\nFor the current behaviour the relationship\
    \ between a node and comment being 1:1 is always desirable. Consider:\n\n```\n\
    // TODO: Fix this\n// Super important method\npublic void doAllThings(){\n   \
    \ ...\n}\n```\n\nIn this case, a human can easily understand that the TODO comment\
    \ is concerned with the method declaration; however, the parser would mark this\
    \ as an orphan or only attribute the following line. It is understandable how\
    \ a user of the library might take a different opinion on how this should work."
