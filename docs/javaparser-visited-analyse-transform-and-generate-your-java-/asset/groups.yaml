  - "[PAGE 27]\n\nComments - Here Be Dragons\n\nAt this stage in the library's development,\
    \ we are largely opting to use sensible defaults rather than provide a multitude\
    \ of configurable options, that in themselves might be more confusing.\n\nIn the\
    \ above case arguably the programmer could have used a multiline comment and we\
    \ would avoid the issue! In itself that is a good exercise; see if you can identify\
    \ comments that appear on consecutive multiple lines and make them into a single\
    \ block comment.\n\n# Comment Attribution\n\nA node can have at most one comment\
    \ associated with it, which is referenced in its comment field. Then the type\
    \ of comment, as you might expect be one of either LineComment, BlockComment or\
    \ JavadocComment.\n\nThe relationship between node and comment is bi-directional,\
    \ so comment maintains a commentedNode reference.\n\nWhen trying to determine\
    \ where a comment should be attributed, first consider what type of comment it\
    \ is; block and Javadoc styles behave the same, but line comments are slightly\
    \ different.\n\nDuring attribute the comments parser will look to assign or Javadoc\
    \ style comments to the following node: either on the same line or subsequent\
    \ line. On the other hand, will be assigned to the node preceding when they appear\
    \ on the same line as another node or the following node when they're on one of\
    \ their own.\n\nThe above holds true when the comment is placed \"sensibly\" between\
    \ two tokens.\n\n# Orphan Comments\n\nWe have touched on this concept in other\
    \ chapters in the book, but it bears repeating. Comments that can't be attributed\
    \ to a particular node in the tree are deemed to be orphaned. More than not, if\
    \ you can't find a comment attributed to the node you expect, it will be an orphan\
    \ elsewhere. Most likely in the parent of the node you would expect.\n\nConsider\
    \ the following:\n\n```\n// Orphaned 1\n// Attributed 1\npublic class TimePrinterWithComments\
    \ {\n\n// Orphaned 2\n// Attributed 2\npublic static void main(String args[]){\n\
    \    System.out.print(LocalDateTime.now());\n}\n// Orphaned 3\n}\n```"
- md: "\nComments - Here Be Dragons\n\n24\n\n![](img/58740d8ab037662f51bd4ad4bcd77db6_28_0.png)\n\
    \nAll Node objects expose their orphan comments specifically through: getOrphanComments;\
    \ but they will also be returned as part of getAllContainedComments.\n\n# Working\
    \ with comments\n\nAs most cases, we tend to recommend using a visitor to meet\
    \ your needs, we have previously seen an example of this in our quick start chapter:\
    \ A Flying Visit. If you have jumped into this chapter you should refer back to.\n\
    \nAnother good option for working with comments in your code aside from visitors\
    \ is the getAllContainedComments method of the CompilationUnit. If the current\
    \ task you're undertaking is primarily concerned with the comments, this gives\
    \ you a comment centric view of the code. The list returned you can navigate Node\
    \ in the AST is attributed via the commentedNode relationship.\n\nBeyond that,\
    \ comments themselves are Node types, so they're first-class citizens within the\
    \ compilation unit. They hold largely the same information any AST node would\
    \ around position. There are some differences; they cannot have comments attributed\
    \ to them and do not have children, but that would be intuitive. So generally\
    \ speaking you can work with them in a similar way any other node with respect\
    \ to examination and manipulation.\n\n# Parsing Options\n\nUp until now we have\
    \ only created a CompilationUnit by immediately calling the static parse method\
    \ on the StaticJavaParser class. This is because the parser is assumed a number\
    \ of sensible defaults; however, when working with comment parsing there are a\
    \ couple of dials we can tweak.\n\nComment parsing is enabled by default, if you\
    \ decide you wish to disable it, you can provide an instance of a ParserConfiguration\
    \ with setAttributeComments to false. Doing so will lead to faster parsing, although\
    \ this will be unnoticeable when working with single source files, but is worth\
    \ remembering if you are looking to parse large numbers of files.\n\n```\nParserConfiguration\
    \ parserConfiguration = new ParserConfiguration()\n.setAttributeComments(false);\n\
    StaticJavaParser.setConfiguration(parserConfiguration);\n```\n\n# ConfigurationOptions.java\n\
    \nThe second option available to allows you to control whether or not to consider\
    \ comments that precede a line space.\nConsider the following code:\n\n```\nclass\
    \ A {\n  // Blah\n  boolean f() { return false }\n}\n```\n\nIn this instance the\
    \ comment // Blah will be attributed to the method f providing comment attribution\
    \ is enabled.\n\nDoes it really belong to the method, or is it describing what\
    \ is going to happen in subsequent lines? Like many things, the answer is probably\
    \ “it depends”.\n\nThe alternative behaviour offered by JavaParser is to attribute\
    \ the comment to the containing node. In the above case for the Class A, and will\
    \ appear as an entry in the OrphanComments list.\n\nBy default, the parser will\
    \ use the former behaviour of attributing the comment to the next following node.\
    \ if you would prefer it to be considered as an orphan, use the following configuration.\n\
    \n```\nParserConfiguration parserConfiguration = new ParserConfiguration()\n.setDoNotAssignCommentsPrecedingEmptyLines(true);\n\
    ```\n\n# ConfigurationOptions.java\n\n# Comments In Practice\n\nSo here is a fun\
    \ little class we have put together to exaggerate earlier points around commenting\
    \ code being \"prison rules\" where anything goes. Believe it or not, these are\
    \ actually some of the more sane examples we have seen.\n\nLet's explain the class\
    \ itself, so it does not distract from what we're actually here for the (comments).\
    \ Mirroring our analogy, we use threads to compete over who will be first/last\
    \ to write to the console. We define a simple class that contains a field that\
    \ each thread will be thread's personal catchphrase. When run is called for the\
    \ thread it will print its catchphrase. The main method instantiates three different\
    \ threads with different catch phrases and invokes the start method. The majority\
    \ of times this code runs will execute in the manner you would expect, but it\
    \ is not guaranteed!\nAlthough it's particularly obnoxious to have this variety\
    \ of comments in a single class, these cases come up, and some may be counter-intuitive.\n\
    \n```\npackage com.github.javaparser;\npublic class PrisonRules /* Maybe use Runable?\
    \ */ extends Thread {\n    @Deprecated\n    // What is\n    // dibbs?\n    private\
    \ final String dibbs;\n\n    public PrisonRules(final String dibbs) {\n      \
    \  this.dibbs = dibbs;\n    }\n\n    @Override // Is this really overridden?\n\
    \    public void run() {\n        System.out.println(dibbs);\n    }\n\n    public\
    \ static void main(String/* We should pass arguments in here */ args) {\n    \
    \    Thread t1 = new Thread(PrisonRules(\"mine\") /* This should run first */);\n\
    \        Thread t2 = new Thread(PrisonRules(\"yoink\"));\n        Thread t3 =\
    \ new Thread(PrisonRules(\"finders keepers!\"));\n\n        // Here Be Dragons\n\
    \        t1/*(\\*_*)*/.start();\n        t2/*(@_)*/*(~)*/start();\n        /**\
    \ We need more JavaDocs! */\n}\n}\nt3.start();\n}\n```\n\n# Comments - Here Be\
    \ Dragons\n\n# PrisonRules.java\n\nFor fun we're going to make a quiz out of this,\
    \ all great learning material needs a quiz. For each comment try and decide which\
    \ node of the AST the comment will be attributed to. Then we'll go through the\
    \ answers in more detail afterwards.\n\n- 1. /* Maybe use Runnable? */ is attributed\
    \ to:\n   1. The ClassOrInterfaceDeclaration\n   2. The ClassOrInterface \"Thread\"\
    \n   3. The SimpleName \"PrisonRules\"\n   4. Nothing, it should be an orphan\n\
    - 2. // What is attributed to:\n   1. The LineComment \"dibbs\"\n   2. The MarkerAnnotationExpr\
    \ \"Deprecated\"\n   3. The FieldDeclaration \"@Deprecated final String dibbs\"\
    \n   4. Nothing, it should be an orphan\n- 3. // dibbs? is attributed to:\n  \
    \ 1. The VariableDeclarator \"dibbs\"\n   2. The ClassOrInterface \"String\"\n\
    \   3. The SimpleName \"dibbs\"\n   4. Nothing, it should be an orphan\n- 4. //\
    \ Is this really overrid? is attributed to:\n   1. The MarkerAnnotationExpr \"\
    Overridden\"\n   2. The MethodDeclaration \"public void run()\"\n   3. The VoidType\
    \ \"void\"\n   4. Nothing, it should be an orphan\n- 5. /* We pass arguments in\
    \ here */ is attributed to:\n   1. The ArrayStmt \"String[]\"\n   2. The BlockStmt\
    \ \"{...}\"\n   3. The Parameter \"String\" args\n   4. Nothing, it should be\
    \ an orphan\n- 6. /* This should run first */ is attributed to:\n   1. The ObjectCreationExpression\
    \ \"new Thread(...)\"\n   2. The OnjectCreationExpression \"new Thread(...)\"\n\
    \   3. It will be an orphan of ObjectCreationExpression)\"\n\n# Comments - Here\
    \ Be Dragons\n\n- 7. // Here Be Dragons is attributed to:\n   1. The NameExpr\
    \ \"t1\"\n   2. The MethodCallExpression \"t1.start()\"\n   3. The ExpressionStmt\
    \ \"t1.start()\"\n   4. Nothing, it should be an orphan\n- 8. /*(**)*/ is attributed\
    \ to:\n   1. The NameExpr \"t1\"\n   2. The MethodCallExpression \"t1.start()\"\
    \n   3. The SimpleName \"start\"\n   4. Nothing, it should be an orphan\n- 9.\
    \ /*(@_)*/ is attributed to:\n   1. The NameExpr \"t2\"\n   2. The MethodCallExpression\
    \ \"t2.start()\"\n   3. The SimpleName \"start\"\n   4. Nothing, it should be\
    \ an orphan\n- 10. /* We need more JavaDocs! */ is attributed to:\n   1. The MethodDeclaration\
    \ \"public void main()\"\n   2. The MethodCallExpression \"t3.start()\"\n   3.\
    \ The ExpressionStmt \"t3.start()\"\n   4. Nothing, it should be an orphan\n\n\
    # Answers:\n\nQuestion 1, the answer is 1, ClassInterfaceType \"Thread\". When\
    \ looking to assign a block comment we're looking for a subsequent node. The ClassInterfaceDeclaration\
    \ in this instance is the containing node. The SimpleName is the preceding node.\n\
    \nQuestion 2, the answer is 4, it is an orphan. The MarkerAnnotationExpr precedes\
    \ the line on a previous line so it will not be attributed to. Comment nodes themselves\
    \ cannot be attributed with comments, so it is not the LineComment. The FieldDeclaration\
    \ starts with the annotation, which is the containing node and where you will\
    \ find the comment in a List referenced by orphanComments.\n\nQuestion 3, the\
    \ answer is 1, the VariableDeclarator, which is the parent of both the SimpleName\
    \ and ClassInterface types in this instance.\n\nQuestion 4, the answer is 1,MarkerAnnotationExpr\
    \ \"Override\". Unlike BlockComments, LineComments look for a preceding node on\
    \ the same line before considering following nodes.\n\nQuestion 5, the answer\
    \ is 4, the comment is defined within the ArrayType token; as such it is the parent\
    \ and where the orphan can be found.\n"
