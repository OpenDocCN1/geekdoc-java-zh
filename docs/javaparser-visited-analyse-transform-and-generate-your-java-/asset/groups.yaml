    # # A Flying Visit


    In this chapter, we''re going to take a whistle stop tour of the key features
    the JavaParser library offers. You can think of it as a quick start guide that
    will get you up on running on your local machine.


    We are going to analyze the code of an interesting, although basic calculator
    takes input in the Reverse Polish Notation format and calculates the result (wikipedia).
    It also has a simple memory feature that can store a single number, similar to
    what you would find a regular calculator.


    The class is of a reasonable length so it can be found in Appendix A.


    # # Travelling Companions


    Firstly we should introduce you to your main travelling companions while journeying
    with the JavaParser.


    In addition to the numerous classes provided to represent support working with
    Java AST''s namely the JavaParser, StaticJavaParser and CompilationUnit, in addition,
    there is a variety of Visitor classes. We''ll look at all of these in more detail
    over the course of this book, but here is a brief introduction.


    In a few words:


    +   * The JavaParser class provides a full API for producing an AST from code

    * The StaticJavaParser class provides a quick and simple API for producing an
    AST from code.

    * the CompilationUnit is the root of the AST

    * the Visitors are classes which are used to find specific parts of the


    As always JavaDoc is your friend when using Java libraries, although this book
    will endeavour to cover as much as possible it will inevitably skip over some
    areas.


    # # JavaParser Class


    As you might imagine this class allows you to parse Java source code into Java
    objects you interact with.


    > * https://en.wikipedia.org/wiki/Reverse_Polish_notation

    * http://www.javadoc.io/doc/com.github.javaparser/javaparser-core'
- md: "\n## A Flying Visit\n\nIn most cases, you will be working with complete class\
    \ files, and in this instance the .parse method is overloaded to accept a Path,\
    \ a File, InputStream and a String will return a CompilationUnit for you to work\
    \ with.\n\nIt is also possible to work with source fragments as well, although\
    \ in order to parse a String you will need to know the resulting type to avoid\
    \ a parsing error.\n\nFor example:\n\n```\nStatement statement = StaticJavaParser.parseStatement(\"\
    int a = 0;\");\n```\n\n## CompilationUnit Class\n\nThe CompilationUnit is the\
    \ Java representation of source code from a complete and syntactically correct\
    \ class file you have parsed.\n\nIn the context of an AST as mentioned, you can\
    \ think of the class as the root node.\n\nFrom here you can access all the nodes\
    \ of the tree to examine its properties, manipulate the underlying Java representation\
    \ or use it as an entry point for a Visitor you have defined.\n\n## Visitor Classes\n\
    \nAlthough it is feasible to hand roll code to directly traverse the AST in the\
    \ CompilationUnit this tends to be laborious and error prone. This is largely\
    \ due to the process relying on recursion and frequent type checking to attain\
    \ your goal.\n\nIn most cases you will want to determine what you are looking\
    \ for, then define a visitor that will operate on it. Using a visitor is very\
    \ easy to find all nodes of a certain kind, like all the method declarations or\
    \ all the multiplication expressions.\n\n## A Simple Visitor\n\nAs mentioned it\
    \ is usually a good idea to define a Visitor that will traverse the AST and operate\
    \ on the concepts within the code you are interested in. So it makes good that\
    \ we start with a simple Visitor as our first example.\n\nAll the code in this\
    \ book is available in the accompanying repository¹¹, you are welcome to check\
    \ out the working example from there. Do however recommend writing the code yourself\
    \ as the best way to gain intuition into the subject.\n\nIn this example, we are\
    \ creating a Visitor that examines all the methods in our class and prints their\
    \ name and line length to the console. So let's get started!\n\n> ¹https://github.com/javaparser/javaparser-visited\n\
    \n## A Flying Visit\n\nFirst, create a new project in your favourite IDE, and\
    \ add the JavaParser library to your class path. If you prefer to use a dependency\
    \ management tool you have just to add a few lines to your build script. For Maven\
    \ these lines are:\n\n```\n<dependency>\n  <groupId>com.github.javaparser</groupId>\n\
