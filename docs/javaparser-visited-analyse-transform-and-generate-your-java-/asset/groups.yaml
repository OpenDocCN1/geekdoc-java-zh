    # How it works: the NodeText and the Concrete Syntax Model


    We previously described that the lexical preservation stores the initial text,
    that is somewhat of a simplification of what happens. What the lexical preservation
    actually does is create a NodeText for each node. NodeText is basically a list
    of either tokens or placeholders for children.


    For example, if you consider this method declaration:


    ```

    void foo(int a) { }

    ```


    Its NodeText would look like this:


