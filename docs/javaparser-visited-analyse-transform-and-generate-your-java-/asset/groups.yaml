  - "[PAGE 46]\n\n# Solving Symbols and References\n\nThink about the last point:\
    \ if a is an int then the result of a + 1 is going to be an int. However a could\
    \ be a String, in that case, we are not summing 1 but we are concatenating its\
    \ string representation to the String represented by a. In other words, by simply\
    \ looking at the AST we cannot say what kind of operation we are performing: an\
    \ algebraic sum or a string concatenation? It depends on the type of a. To answer\
    \ these questions we have resolve references. We have to connect the reference\
    \ to a a + 1 to the declaration of a that is being referred.\n\nNow consider the\
    \ following case:\n\n```\nclass Bar {\n    private String a;\n\nvoid aMethod()\
    \ {\n        float a;\n        while (true) {\n            int a;\n          \
    \  a = a + 1;\n        }\n    }\n}\n```\n\nBar.java\n\nThere are many a symbols.\
    \ Solving a reference means finding the correct one and it can be difficult. And\
    \ trust us, things can get very complex. Luckily you can just use the JavaParser\
    \ Symbol Solver to resolve references between elements of a JavaParser AST.\n\n\
    # How to setup the JavaParser Symbol Solver?\n\nFrom this point forward we will\
    \ refer to the JavaParser Symbol Solver as the 'JavaSymbolSolver', naming things\
    \ is hard and we don't always get it right first time. Future versions may be\
    \ refactored the class name\n\nJavaSymbolSolver comes bundled the JavaParser core\
    \ library. This is because each version of the JavaSymbolSolver is guaranteed\
    \ to work with a specific version of JavaParser. Historically it was not the case,\
    \ and the libraries were distributed separately.\n\nIf you previously elected\
    \ not to include the JavaSymbolSolver and just included the javaparser-core artifact\
    \ in your dependencies you will have to update to the bundled version."
