    2 sequence(space()), child(ObservableProperty.BODY), semicolon());

    ```


    This tells us that if the body of the method is present we print it, with a preceding
    space and follow it with a semicolon.


    If we use the CSM to calculate how the node should look before the change we would
    get this:


    +   1. child(void)

