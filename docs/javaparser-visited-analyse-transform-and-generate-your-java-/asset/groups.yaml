    \ JavaParser you would get following representation of the code:\n\n```\nclass\
    \ A {\nint a;\n }\n```\n\n## What is Lexical-Preserving Printing?\n\nLexical-preserving\
    \ printing means printing keeping the original layout. When we write code there\
    \ is information that is not strictly meaningful for the compiler, but is important\
    \ for human beings. I.e. the position of the whitespaces and comments.\n\nIf you\
