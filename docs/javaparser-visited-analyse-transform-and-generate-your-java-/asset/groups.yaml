    \ internally unless of course, are you curious; in which case the next section\
    \ is for you.\n\n# How it works: the NodeText and the Concrete Syntax Model\n\n\
    We previously described that the lexical preservation stores the initial text,\
    \ that is somewhat of a simplification of what happens. What the lexical preservation\
    \ actually does is create a NodeText for each node. NodeText is basically a list\
    \ of either tokens or placeholders for children.\n\nFor example, if you consider\
    \ this method declaration:\n\n```java\nvoid foo(int a) { }\n```\n\nIts NodeText\
    \ would look like this:\n\n![](img/58740d8ab037662f51bd4ad4bcd77db6_41_0.png)\n\
    \nIf we order the different elements:\n\n- 1. child(void)\n- 2. token(space)\n\
    - 3. child(name)\n- 4. token(lparen)\n- 5. child(param#0)\n- 6. token(rparen)\n\
    - 7. token(space)\n- 8. child(body)\n\nNow suppose that you add a parameter to\
