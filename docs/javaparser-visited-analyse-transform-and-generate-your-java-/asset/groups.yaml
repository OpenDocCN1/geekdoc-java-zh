    \ do that, however, JavaSolver will need to know where to look for classes. Classes\
    \ could:\n\n- in Java source files, if they are classes we are compiling right\
    \ now\n- in class files or JARs from some library\n- in the JDK, for classes like\
    \ java.lang.Object or java.lang.String\n\nDepending on your area, there are different\
    \ TypeSolvers that you need to pass to JavaSolver.\nJarTypeSolver: this TypeSolver\
    \ looks for classes inside a JAR file.\nJavaTypeSolver: this TypeSolver looks\
    \ for classes in source files.\nReflectionTypeSolver: this TypeSolver looks for\
    \ classes like java.lang.Object.\nCombinedTypeSolver: this TypeSolver combines\
    \ multiple TypeSolvers.\n\n# Resolving a type using absolute name\n\nConsider\
    \ this example:\n\n```java\nimport com.github.javaparser.resolution.declarations.ResolvedTypeDeclaration;\n\
    import com.github.javaparser.symbolsolver.types.TypeSolver;\nimport com.github.javaparser.symbolsolver.typesversvers.CombinedTypeSolver;\n\
    import com.github.javaparser.symbolsolver.typesversvers.ReflectionTypeSolver;\n\
    import com.github.javaparser.symbolsolver.typesversvers.JavaTypeSolver;\nimport\
    \ com.github.javaparser.symbolsolver.typesversvers.JavaSymbolSolver;\nimport com.github.javaparser.ast.StaticJavaParser;\n\
    import com.github.javaparser.ast.CompilationUnit;\nimport com.github.javaparser.ast.expr.AssignExpr;\n\
    import com.github.javaparser.resolution.types.ResolvedType;\nimport java.io.File;\n\
    import java.io.FileNotFoundException;\n\nclass UsingTypeSolver {\n  public static\
    \ void showTypeDeclaration(ResolvedTypeDeclaration declaration) {\n      System.out.println(String.format(\"\
    == %s =\", declaration.getQualifiedName()));\n  }\n\n  public static void main(String[]\
    \ args) {\n      TypeSolver typeSolver = new ReflectionTypeSolver();\n      JavaSymbolSolver\
    \ symbolSolver = new JavaSymbolSolver(typeSolver);\n      StaticJavaParser.getConfiguration().setTypeSolver(symbolSolver);\n\
    \n      CompilationUnit cu = StaticJavaParser.class.parse(new File(\"src/main/java/org/javaparser/examples/chapter5/Bar.java\"\
    ));\n\n      cu.findAll(AssignExpr.class).forEach(ae -> {\n          if (ae.getType().resolve()\
