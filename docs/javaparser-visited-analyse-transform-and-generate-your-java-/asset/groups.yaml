    \ to the MethodDeclaration.\n\nThe Lexical Preservation setup attaches observers\
    \ to all nodes. At every change, we get notified and we calculate how that node\
    \ should look like after the change and update these modifications to the NodeText.\n\
    \nTo understand how the Node should look like after the change we use a ConcreteSyntaxModel.\n\
    \n# What is the Concrete Syntax Model?\n\nYou may wonder what the Concrete Syntax\
