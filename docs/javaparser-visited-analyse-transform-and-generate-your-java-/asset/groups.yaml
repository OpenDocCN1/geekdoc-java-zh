    This is quite complicated because it considers all the potential elements that
    can compose a MethodDeclaration and how to present all of them.


    Consider this line, for example:


    ```

    1 list(ObservableProperty.PARAMETERS, sequence(comma(), space()), none(), none()),

    ```


    This tells us that the parameters of the MethodDeclaration should be ideally separated
    by comma and one space.


    Or these lines:


