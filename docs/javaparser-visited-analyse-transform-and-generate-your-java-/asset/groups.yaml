    ;\n3\n4 public static void main(String[] args) throws Exception {\n5\n6 CompilationUnit\
    \ cu = StaticJavaParser.parse(new FileInputStream(FILE_PATH));\n7 }\n```\n\n#\
    \ ModifyingVisitorStarter.java\n\nThe previous visitor we created in VoidVisitor.java\
    \ used the VoidVisitorAdaptor as a basis, but we did not intend changing the AST.\
