- md: "\nprivate static String FILE_PATH = \"src/main/java/org/javaparser/samples/ReversePolishNotation.java\"\
    ;\n\npublic static void main(String[] args) throws Exception {\n    CompilationUnit\
    \ cu = StaticJavaParser.parse(new File(FILE_PATH));\n    List<Comment> comments\
    \ = cu.getAllContainedComments();\n}\n\n# CommentReporter.java\n\nThe Visitor\
    \ classes we have worked with so far do not provide a mechanism to attain all\
    \ comments, as they operate on specific node types. On the other hand, tend to\
    \ cross cut through our code, where their positioning and attribute can be practically\
    \ anywhere.\n\nAll Node objects have a getComment method to be invoked to give\
    \ given nodes, you would need to traverse the tree manually. With this in mind\
    \ the library provides a convenience, a getAllContainedComments on the CompilationUnit\
    \ to acquire all comments.\n\nNow that we have a list of comments in our code,\
    \ let's do something a little more meaningful with them. One of the biggest challenges\
    \ when working with comments from a parsing point of view is where the comment\
    \ is attributed to i.e, which node does it document. In some cases, the comment\
    \ is made on a line where no obvious attribute is clear, and in this case, the\
    \ parser determines them to be orphan.\n\nFrom our list of comments, we're not\
    \ going to report their textual content, their types i.e. if they're a Block,\
    \ Line or JavaDoc style comment, but also or not they're orphan.\nIn our prepared\
    \ starter class add an inner class that will represent our report items.\n\n```java\n\
    private static class CommentReportEntry {\n    private String type;\n    private\
    \ String text;\n    private int lineNumber;\n    private boolean isOrphan;\n\n\
    \    CommentReportEntry(String type, String text, int lineNumber, boolean isOrphan)\
    \ {\n        this.type = type;\n        this.text = text;\n        this.lineNumber\
    \ = lineNumber;\n        this.isOrphan = isOrphan;\n    }\n}\n```\n\n# A Flying\
    \ Visit\n\n@Override\npublic String toString() {\n    return lineNumber + \" |\"\
    \ + type + \" |\" + isOrphan + \" |\" +\n           text.replaceAll(\"\\n\",\"\
    \").trim();\n}\n```\n\n# CommentReporter.java\n\nThere is nothing too remarkable\
    \ here, it is a simple container for the properties of comments we're interested\
    \ in our report. The toString method creates a pipe delimited representation.\
    \ It also strips of the whitespaces out from the comment to make it more console\
    \ friendly.\n\nNow let's modify our code to create a collection of CommentReportEntry\
    \ items, by mapping the fields we're interested in the JavaParser Comment type.\n\
    \n```java\nList<CommentReportEntry> comments = cu.getAllContainedComments()\n\
    \  .stream()\n  .map(p -> new CommentReportEntry(\n      p.getClass().getSimpleName(),\n\
    \      p.getComment(),\n      p.getRange().map(r -> r.beginLine).orElse(-1),\n\
    \      !p.getCommentedNode().isPresent()))\n  .collect(Collectors.toList());\n\
    \ncomments.forEach(System.out::println);\n```\n\n# CommentReporterComplete.java\n\
    \nWe're using the 'class' name for the type of our comment, then we use the content\
    \ for the text. To get the line number we use the Range object that all nodes\
    \ contain. Range position information from the source code, including both the\
    \ start and end of a line, in addition to column comments. Lastly to ascertain\
    \ if a comment is an orphan or not we access CommentedNode. CommentedNode is a\
    \ Java Optional so a call to isPresent to check its existence; if a node does\
    \ not have a commented node we consider it to be an Orphan.\n\nIn this example,\
    \ we are operating from the point of view of the comment to identify if it is\
    \ attributed to a particular node. We can also operate from the node's point of\
    \ view, from a given node we can use the node.getComment method or node.getOrphanComments.\n\
    \nRunning the application should return an unab version of the below:\n\n![](img/58740d8ab037662f51bd4ad4bcd77db6_24_0.png)\n\
    \n# A Flying Visit\n\n| Line Number | Type | IsOrphan | Text |\n| :--- | :---\
    \ | :--- | :--- |\n| 81 | BlockComment | true | EOF |\n| 7 | JavadocComment |\
    \ false | * A Simple Reverse ... |\n| 12 | LineComment | false | What does this\
    \ do? |\n| 17 | JavadocComment | false | * Takes reverse ... |\n| 59 | JavadocComment\
    \ | false | * Memory Recall ... |\n| 68 | JavadocComment | false | * Memory Clear\
    \ ... |\n\nThat concludes our brief look at how you can get started using the\
