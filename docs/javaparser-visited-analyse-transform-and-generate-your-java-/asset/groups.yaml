- md: "\n# A Simple Visitor With State\n\nIt is often useful during traversal to be\
    \ able to maintain a record of what we have seen so far. This may be helpful for\
    \ our current decision-making process, or we may want to collect all occurrences\
    \ of something deemed interesting.\n\nThe second parameter to the visit method\
    \ is to offer a simple state mechanism that is passed around during the traversal\
    \ of the tree. This gives us the option of having the visitor perform an action,\
    \ the visitor's responsibility is to collect the items i.e. method names. Then\
    \ the invoking class with the method names collected is then up to them.\n\nLet's\
    \ have a look at this in practice, create another visitor class, this time it\
    \ will be parameterised with a List<String>.\n\n```\nprivate static class MethodNameCollector\
    \ extends VisitorAdapter<List<String>> {\n    @Override\n    public void visit(MethodDeclaration\
    \ md, List<String> collector) {\n        super.visit(md, collector);\n       \
    \ collector.add(md.getNameAsString());\n    }\n}\n```\n\n![](img/58740d8ab037662f51bd4ad4bcd77db6_18_0.png)\n\
    \nPreviously we referred to the argument as being a state, but that quite conjures\
    \ a negative image in people's mind. Therefore it might be better to think of\
    \ this object as being a collector in order to make it more palatable. In our\
    \ visitor method, we add the String name of the collector object rather than printing\
    \ it.\n\nOk, so we can now add our second visitor to main in order to compare\
    \ the outcome.\n\n```\nList<String> methodNames = new ArrayList<>();\nVoidVisitor<String>\
    \ methodNameCollector = new MethodNameCollector();\nmethodNameCollector.visit(cu,\
    \ methodNames);\nmethodNames.forEach(n -> System.out.println(\"Method Name Collected:\
    \ \" + n));\n```\n\n![](img/58740d8ab037662f51bd4ad4bcd77db6_18_1.png)\n\nAs you\
    \ can see we additionally instantiate a List to be passed into the visit method.\
    \ We then do the work of printing to console in main rather than expecting the\
    \ visitor to do it.\n\nOur new output when running main should be:\n\n# A Flying\
    \ Visit\n\n- 1 Method Name Printed: calc\n- 2 Method Name Printed: memoryRecall\n\
    - 3 Method Name Printed: memoryClear\n- 4 Method Name Printed: memoryStore\n-\
    \ 5 Method Name Collected: calc\n- 6 Method Name Collected: memoryRecall\n- 7\
    \ Method Name Collected: memoryClear\n- 8 Method Name Collected: memoryStore\n\
    \nAlthough considered a good practice to separate concerns in this second example,\
    \ we should also be willing to be pragmatic, there is nothing wrong with the first\
    \ way either. As a language engineer might want to quickly write some disposable\
    \ code that is ever used once on a code base. In this case, perhaps, the quicker\
    \ the clean solution is the way to go.\n\nThese are two simple examples, but we\
    \ hope you can see the great potential there is to expand from here. Here we could\
    \ easily adapt this to code methods that are over 50 lines long. From the String\
    \ we use to collect names we could expand to use a DTO¹ object that collects,\
    \ number of lines and if the method has a JavaDoc. We're then on our way to writing\
    \ our own source code analyser.\n\n# A Simple Modifying Visitor\n\nOne of the\
    \ little known minor changes to the Java language in version 7 was the ability\
    \ to express numeric literals with underscores in the value.\n\nAlthough not a\
    \ killer feature as its application is fairly narrow, it can be particularly useful\
    \ for readability.\n\n```\npublic static int ONE_BILLION = 1000000000;\npublic\
    \ static int TWO_BILLION = 2_000_000_000;\n```\n\nIf you work with a code base\
    \ where you have define arbitrary large numeric values you can see this convention\
    \ has its advantages.\n\nWe're going to use our Reverse Polish Notation class\
