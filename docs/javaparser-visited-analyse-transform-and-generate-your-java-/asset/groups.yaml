    # Preface


    # What is JavaParser?


    In its simplest form, the JavaParser library allows you to interact with Java
    source code as a Java object representation in a Java environment. More formally
    we refer to this object representation as an Abstract Syntax Tree (AST).


    Additionally, it provides a convenience mechanism to navigate the tree with what
    we have termed as Visitor Support. This gives developers the ability to focus
    on identifying interesting patterns in their source, rather than writing laborious
    tree code.


    The final principal feature of the library is the ability to manipulate the underlying
    structure of the source code. This can then be written to a file, providing developers
    with the facility to build their code generating software.


    # JavaParser is not


    Although the library lends itself to being used as part of one, it is not a code
    refactoring toolkit. This is perhaps the most popular misconception about the
    library we see.


    Think of the library as providing a mechanism to answer the question **what is
    this code?**, the **why** and the **how** you might choose to monitor or report
    on it is up to you, the language engineer.


    It is not a compiler. Syntactically correct code that is parsed by the library
    does not necessarily mean it will successfully compile. Although successfully
    compiled code are inherently syntactically correct, parsing is just one stage
    of the compilation process. For example, if you refer to the variable v without
    having defined it, that is syntactically correct, but will lead to a semantic
    error in the compilation process.


    # Who is this book for?


    Without sounding too facet: most Java developers. If not the JavaParser library,
    they will likely benefit from understanding what parsers can offer with regards
    to their day to day work.


    To labour the point, in the majority of cases when choosing to parse source code
    you are looking either to identify something, usually issues in the code, or ways
    to automate the generation of code. Both of these practices are largely considered
    with attaining quality and efficiency improvements; can I automatically detect
    problems, can I produce this code more quickly? All developers should be interested
    in how they can attain both of these.


    In likelihood, you will rarely be including the JavaParser library in user software.
    Typically it forms part of a tooling component that will operate on the source
    code of your project, or perhaps generate the code that will ultimately serve
    users.


    Language tooling is probably the most common example of what we see the library
    used for. This notion that we can identify points of interest within the code
    and then perform an action.


    More broadly speaking it is for language engineers and tooling developers.


    As a library for Java, it is assumed you already have a fair understanding of
    Java.


    # This book is not for


    Those wishing to learn Java, by extension of this book is not going to teach readers
    Java.


    It will not get you great insight into how to write a parser either, beyond what
    users will be interested in.


    We are also not going to take a deep look into the Java grammar or the underlying
    grammar definition of the library. Readers wish to gain more understanding in
    that area should visit the Java Language Specification¹ site.


    Perhaps most controversially, those who are squamish about lack of tests. Like
    most things, approaches to testing is subjective and it is not a goal of this
    book to offer opinions on the subject. As such the example in this book is largely
    demonstrated through the main method.


    # How to use this book?


    This book is intended to be a learning aid for those using the JavaParser library.


    It is not a reference guide, we have tried to maintain the JavaDoc² for this purpose.
    If you find that documentation lacking please raise a question on GitHub.


    We have separated the book into two parts, the first is intended to get you to
    speed with Abstract Syntax Trees, the key components of the library and how to
    get working examples on your machine. If you are a novice, it is recommended that
    you read the first part in order to get a good grounding in the subject.


    The second part of the book is a collection of use cases that provide a more detailed
    look at how we see the library being used. The use cases can be read out of order,
    perhaps starting with one the user relates to. Although there is certainly no
    harm in reading them all.


    > ¹https://docs.oracle.com/javase/specs/jsls/se8/


    > ²http://www.javadoc.io/doc/com.github.javaparser/javaparser-core/


    # Conventions used in this book


    *Italic* - Used for introduction of an important concept within the subject.


    **Bold** - Emphasis a particular concept within the subject.


    `Code` - Used to highlight programmatic code.


    # Code Samples


    You are free to use all the code samples in this book without restriction.


    Original sources can be found on GitHub³


    We appreciate, but do not require attribution. This will usually include the Title
    of the book and its authors. For Example: *JavaParser: Visited by Smith, Tommasetti*


    # How to Contact Us


    Any questions, comments or concerns please come and visit us on Gitter.


    Feedback about the book: https://gitter.im/javaparser/javaparser


    JavaParser library support: https://gitter.im/javaparser/javaparser


    > ³https://github.com/javaparser/javaparser


    # The Authors


    # Nicholas Smith


    Nicholas is a seasoned Software Engineer currently applying his trade in London.
    He has been fortunate to travel a little with his work as well, working in Denmark,
    India and Italy during his career.


    His educational background is principally focused in Software Engineering, with
    both Bachelors and Masters degree, the latter specialising Financial Services.


    Although he has dabbled in several languages in fact he considers himself principally
    a Java programmer, having used the language ¹³


    When he has the free time, other than contributing to the JavaParser project he
    be found neglecting technical blog nicholaspaulsmith.com or hacking some hair
    brained scheme that will allow him to retire early.


    # Federico Tommasetti


    Federico is an independent Software Architect focusing on building languages:
    parsers, compilers, editors, simulator and other similar tools. He shares his
    thoughts on language engineering on his blog at tomasetti.me.


    Previously he had a PhD in Language Engineering, worked here and there (including
    TripAdvisor and Groupon) while now he focuses on consulting and contributing to
    open-source projects like JavaParser and JavaSolver.


    # Acknowledgements


    We would like to thank the original authors of JavaParser: Sreenivasa Viswanath
    and Jú Vilmar Gesser.


    Additionally, but most importantly we would like to thank all the contributors
    and the wonderful community who had grown around JavaParser. Today are dozens
    of people who have sent patches, hundreds who have asked questions on forums,
    Stack Overflow, on GitHub and on Gitter. Discussions with them have helped immeasurable
    with understanding how JavaParser was used and which parts required clarifications.


    > *http://nicholaspaulsmith.com

    *http://tomasetti.me

