    \            .setSymbolResolver(symbolSolver);\n\n        CompilationUnit cu =\
    \ StaticParser.parse(new File(FILE_PATH));\n\n        cu.findAll(MethodCallExpr.class).forEach(mce\
    \ ->\n            System.out.println(mce.resolveInvokedMethod().getQualifiedSignature()));\n\
