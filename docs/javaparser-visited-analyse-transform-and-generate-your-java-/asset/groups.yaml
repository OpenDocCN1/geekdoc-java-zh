    \ ae.getType().resolve());\n          }\n      });\n  }\n}\n```\n\nUsingTypeSolver.java\n\
    \nIn this example we get the definition of three types:\n\n* int\n* String\n*\
    \ java.List\n\nEach of these is an instance of ReferenceTypeDeclaration. That\
    \ class has many methods to access a rich model of the type. You can find all\
