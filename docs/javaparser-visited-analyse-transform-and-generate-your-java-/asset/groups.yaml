    ![](img/58740d8ab037662f51bd4ad4bcd77db6_12_0.png)


    Finally, but probably most significantly we have the branch of our tree that represents
    the BlockStmt. On its own, it constitutes a significant portion of the tree as
    a whole, but only represents a single line of code.


    We hope you can see from this example that syntax trees can get complex rather
    quickly!


    # Beyond Abstract


    We should also consider what makes an AST Abstract rather than say a Concrete
    Syntax Tree or Parse Tree. As with its meaning in the wider area of computer science,
    it is related to the omittance of information. Typically in an AST whitespace
    and comment tokens are omitted, as are parenthesis which can be inferred by the
    structure of the tree.


    During the support of the JavaParser library, we have however come to the realisation
    that many people desire the information relating to comments. So by default, while
    parsing, the JavaParser library will record comment information and include it
    the tree representation. The ability to exclude comments is possible through configuration
    options.


    Additionally, the team are also working on ways to provide support for whitespace
    preserving and pretty printing options when writing a class file.'
