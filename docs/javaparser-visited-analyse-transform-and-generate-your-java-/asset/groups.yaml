    \ you parse code and add to the AST some new nodes created programmatically: the\
    \ portion of the code that you have parsed will have layout information attached,\
    \ while the nodes you have created will not and they will be pretty-printed.\n\
    \n## Choosing between Pretty Printing and Lexical-Preserving Printing\n\nWe have\
    \ seen that there are two different styles that can be used when producing code\
    \ from an AST with JavaParser. The next question is when should we use one, and\
    \ when should we use the other?\n\nFrom what we have seen, many cases involve\
    \ JavaParser being used to perform transformations on large codebases. In this\
    \ instance, you will typically want to use Lexical-Preserving Printing. The reason\
    \ being, that all the code that is not modified by your transformation will remain\
    \ completely unchanged. Typically this is more reassuring to developers, that\
    \ get nervous when large (even safe) changes are submitted. This permits us to\
