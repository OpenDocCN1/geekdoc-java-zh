    \n`visit` 方法的第二个参数用于提供一种简单的状态机制，该机制在树的遍历过程中传递。这让我们有了让访问者执行某种操作的选项，访问者的责任是收集项，即方法名。然后，调用类将收集到的方法名，后续操作由它们来决定。\n\
