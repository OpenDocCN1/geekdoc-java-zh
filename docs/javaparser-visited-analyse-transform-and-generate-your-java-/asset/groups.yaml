  - "[PAGE 34]\n\n# Pretty Printing and Lexical Preservation\n\nYou can use JavaParser\
    \ for different purposes. Two of the most common are code generation and code\
    \ transformation. In both cases you end generating Java code, probably to store\
    \ it in a file with the Java extension.\n\nA simple call to toString() on your\
    \ CompilationUnit will return a String that you can use to write your source.\
    \ The question we are posed with is: how will it format the code from your AST?\n\
    \nThe answer is one of two ways:\n\n+   - using pretty-printing\n- lexical-preserving\
    \ printing\n\nSo let's consider how they differ.\n\n# What is Pretty-Printing?\n\
    \nPretty-printing means that we write our code out as source, the textual representation\
    \ is printed in a nicely formatted and standard way.\n\nFor example, if you were\
    \ to parse an existing java class that looks like:\n\n```\nclass A { int\n\na;\
    \ }\n```\n\nThen later you decide to pretty-print it using JavaParser you would\
    \ get following representation of the code:\n\n```\nclass A {\nint a;\n }\n```"
  - '[PAGE 35]


    # What is Lexical-Preserving Printing?


    Lexical-preserving printing means printing keeping the original layout. When we
    write code there information that is not strictly meaningful for the compiler,
    but is important for human beings. I.e. the position of the whitespaces and comments.


    If you parse some code and then print it back with Lexical-preserving you will
    get back the same code parsed. If you parse some code, modify and then print it
    back using lexical-preserving printing you will get very close to the original
    code, with changes confined to the nodes you have explicitly changed.


    You can use lexical-preserving printing, even on an AST that you have built programmatically
    and not parsed from source. In this case, there is no original layout to preserve
    and the code will default to the pretty-printed form. The same is true when you
    parse code and add to the AST some new nodes created programmatically: the portion
    of the code that you have parsed will have layout information attached, while
    the nodes you have created will not and they will be prettyprinted.


    # Choosing between Pretty Printing and Lexical-Preserving Printing


    We have seen that there are two different styles that can be used when producing
    code from an AST with JavaParser. The next question is when should we use one,
    and when should we use the other?


    From what we have seen, many cases involve JavaParser being used to perform transformations
    on large codebases. In this instance, you will typically want to use Lexical-Preserving
    Printing. The reason being, that all the code that is not modified by your transformation
    will remain completely unchanged. Typically this is more reassuring to developers,
    that get nervous when large (even safe) changes are submitted. This permits us
    to have much smaller diff files, making it easy when it comes to manual code reviews.
    Finally, it allows us to preserve complex layout or formatting that has a meaning.


    When generating code or transforming code that is not intended for manual reviews
    you could instead opt for pretty-printing. Pretty printing is also a good choice
    if you want to enforce a specific code style: every time you save code you are
    assured that it is well formed, without any exception.


    These are our considerations we consider common but bear in mind that JavaParser
    and JavaScript are intended to be used in many different contexts. You, as the
    developer, have to analyze your context and make the appropriate choice for you.


    We have seen what the differences between pretty-printing and lexical-preserving
    printing are. Now let''s look how to use those and how they work.'
