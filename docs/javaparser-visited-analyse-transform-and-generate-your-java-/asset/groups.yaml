  - '[PAGE 44]


    # Calculating the difference between CSMs


    At this point, a difference between the two computed CSMs is obtained and it basically
    looks like:


    +   1. keep: child(void)

    2. keep: child(name)

    3. keep: token(lparen)

    4. keep: child(param#0)

    5. add: token(comma)

    6. add: token(space)

    7. add: child(param#1)

    8. keep: token(rparen)

    9. keep: token(space)

    10. keep: child(body)


    Finally this difference is applied to the NodeText stored for the Node: we traverse
    the NodeText until we find the point where we have to add or remove new elements.
    We apply the changes we need. In this case, we add a comma, a space and a placeholder
    for a child (the second parameter). Applying the difference is not straightforward
    because we want to ignore some of the whitespace and comments which are present
    in the NodeText.


    # Summary


    For a long time JavaParser supported only pretty-printing, and for many uses,
    it was still and is a reasonable choice.


    Some will instead wish to perform modifications while preserving the format of
    existing code: keeping the exact whitespace, leaving comments exactly where they
    are. This layout information can be meaningless for a compiler but it is important
    for developers. For those usages, we created the lexical preservation, introduced
    for the first time in version 3.1.1.


    These two alternatives should cover all of your needs. If not, come talk to us
    or create a new issue on GitHub.'
  - "[PAGE 45]\n\n# Solving Symbols and References\n\nJavaParser, like other parsers,\
    \ take information present in source code and it organizes it into a tree, an\
    \ Abstract Syntax Tree.\n\nIn many situations, the information present in the\
    \ AST is sufficient for a user's needs. In other cases however you may need to\
    \ elaborate the AST and calculate additional information. In particular, you may\
    \ want to resolve references and find relations between nodes. In a sense, this\
    \ tracing new links and transforming a tree to a graph.\n\nWhen we find a name\
    \ used in Java code we recognize it as a symbol. Symbol is the term we use to\
    \ indicate any possible element that could be represented by a name. A symbol\
    \ could be a variable, but also a field or a type.\n\nWhen we encounter this expression:\n\
    \n```\ncontainer.element\n```\n\nWhat is the container? What is the element? Perhaps\
    \ container is a variable and element is a field of that variable. Or maybe container\
    \ is a class name and element is a static field of that class. At this stage we\
    \ do not know, so we speak generally of symbols.\n\nThe JavaParser Solver is the\
    \ part of the library that examines those symbols and tells us what they really\
    \ are, finding for us the variable declaration, parameter declaration or type\
    \ declaration that they are represented by symbol.\n\nConsider for this example\
    \ case:\n\n```\nvoid aMethod() {\n  int a;\n  a = a + 1;\n}\n```\n\nBy looking\
    \ at the AST we know that a = a + 1 corresponds to an assignment. We also know\
    \ that we are assigning the result of the adding 1 to the value of a.\n\nThere\
    \ are things that we not know:\n\n+   - Is there a symbol a in that context?\n\
    - Can that symbol be assigned?\n- What is the type of that symbol?"
- md: "\n# Solving Symbols and References\n\nThink about the last point: if a is an\
    \ int then the result of a + 1 is going to be an int. However a could be a String,\
    \ in that case, we are not summing 1 but we are concatenating its string representation\
    \ to the String represented by a. In other words, by simply looking at the AST\
    \ we cannot say what kind of operation we are performing: an algebraic sum or\
    \ a string concatenation? It depends on the type of a. To answer these questions\
    \ we have to resolve references. We have to connect the reference to a a + 1 to\
    \ the declaration of a that is being referred.\n\nNow consider the following case:\n\
    \n```\nclass Bar {\n    private String a;\n\n    void aMethod() {\n        float\
    \ a;\n        while (true) {\n            int a;\n            a = a + 1;\n   \
    \     }\n    }\n}\n```\n\nBar.java\n\nThere are many a symbols. Solving a reference\
    \ means finding the correct one and it can be difficult. And trust us, things\
    \ can get very complex. Luckily you can just use the JavaParser Symbol Solver\
    \ to resolve references between elements of a JavaParser AST.\n\n# How to setup\
    \ the JavaParser Symbol Solver?\n\nFrom this point forward we will refer to the\
    \ JavaParser Symbol Solver as the 'JavaSymbolSolver', naming things is hard and\
    \ we don't always get it right first time. Future versions may have refactored\
    \ the class name.\n\nJavaSymbolSolver comes bundled with the JavaParser core library.\
    \ This is because each version of the JavaSymbolSolver is guaranteed to work with\
    \ a specific version of JavaParser. Historically it was not the case, and the\
    \ libraries were distributed separately.\n\nIf you previously elected not to include\
    \ the JavaSymbolSolver and just included the javaparser-core artifact in your\
    \ dependencies you will have to update to the bundled version.\n\n# Solving Symbols\
    \ and References\n\n```\ndependencies {\n  compile group: 'com.github.javaparser',\
    \ name: 'javaparser-symbol-solver-core', version: 'LATEST'\n}\n```\n\nOr if you\
    \ feel more comfortable with the verbosity of Maven here you go:\n\n```xml\n<dependency>\n\
    \  <groupId>com.github.javaparser</groupId>\n  <artifactId>javaparser-symbol-solver-core</artifactId>\n\
    \  <version>LATEST</version>\n</dependency>\n```\n\n# How to get the type of references:\
    \ a first example\n\nLet's consider our initial example. How do we get the type\
    \ of the value being assigned?\nThis is the code we want to parse:\n\n```\nclass\
    \ Bar {\n  private String a;\n\n  void aMethod() {\n    while (true) {\n     \
    \ int a = 0;\n      a = a + 1;\n    }\n  }\n}\n```\n\n![](img/58740d8ab037662f51bd4ad4bcd77db6_47_0.png)\n\
    \nThis is the code to get the type of:\n\n# Solving Symbols and References\n\n\
    ```java\npublic class GetTypeOfReference {\n    private static final String FILE_PATH\
    \ = \"src/main/java/org/javaparser/examples/chapter5/Bar.java\";\n\n    public\
    \ static void main(String[] args) throws FileNotFoundException {\n        TypeSolver\
    \ typeSolver = new CombinedTypeSolver();\n\n        JavaSymbolSolver symbolSolver\
    \ = new JavaSymbolSolver(typeSolver);\n        StaticJavaParser\n            .getConfiguration()\n\
    \            .setTypeSolver(symbolSolver);\n\n        CompilationUnit cu = StaticJavaParser.class.parse(new\
    \ File(FILE_PATH));\n\n        cu.findAll(AssignExpr.class).forEach(ae -> {\n\
    \            ResolvedType resolvedType = ae.calculateResolvedType();\n       \
    \     System.out.println(ae.toString() + \" is a: \" + resolvedType);\n      \
    \  });\n    }\n}\n```\n\n![](img/58740d8ab037662f51bd4ad4bcd77db6_48_0.png)\n\n\
    The output would be: Type of a = a + 1 is PrimitiveTypeUsage(name='int')\nThis\
    \ line could look mysterious to you:\n\n```\nTypeSolver typeSolver = new CombinedTypeSolver();\n\
    ```\n\nWe'll take a look at what a TypeSolver is in the next paragraph.\n\n# Specifying\
    \ where to look for types\n\nIn the previous example, we have seen references\
    \ to elements in the same AST i.e. in the same Java source file. Life tends to\
    \ be more complex than that and references typically involve other files.\nConsider\
    \ this:\n\n# Solving Symbols and References\n\n```java\nclass MyClass extends\
    \ SuperClass {\n    public void returnSomeValue() {\n        System.out.println(aField.size());\n\
    \    }\n}\n```\n\nWhere does aField come from? We do not know, it could be a field\
