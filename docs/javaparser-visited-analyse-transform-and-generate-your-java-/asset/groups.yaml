    \   token(GeneratedJavaParserConstants.RPAREN),\n   list(ObservableProperty.THROWN_EXCEPTIONS,\
    \ sequence(comma, space)),\n   sequence(space),\n   child(ObservableProperty.BODY,\n\
    \   sequence(space)\n   )\n));\n```\n\n# Pretty Printing and Lexical Preservation\n\
    \n(Note: The text in the OCR seems to have repetitions or garbled fragments in\
