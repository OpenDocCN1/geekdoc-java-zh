    ```\n\n同样注意，`JavaSymbolSolver` 可以找出在特定上下哪些方法是可见的，它确定了方法调用的类型（在此例中为 `System.out`）等等。这是一大量工作，你可能不想自己做，尤其是当你可以直接使用它时。\n"
