    \ Lenny！），并将 `SimpleName` 作为其父节点。请记住——节点与注释之间的关系是 1:1。\n\n问题 10，的答案是 3，`ExpressionStmt`\
    \ \"t3.start()\"。Javadoc 注释的归属方式与块注释相同；尽管习惯上将它们应用于类、接口和方法，但这并不是强制执行的。\n\n## 格式化打印（Pretty\
    \ Printing）与词法保留（Lexical Preservation）\n\n你可以将 JavaParser 用于不同的用途。其中最常见的两种是代码生成和代码转换。在这两种情况下，你最终都会生成\
    \ Java 代码，可能会将其存储在带有 .java 扩展名的文件中。\n\n对你的 `CompilationUnit` 调用简单的 `toString()`\
    \ 将返回一个字符串，你可以用它来写入源码。我们面临的问题是：它将如何格式化来自 AST 的代码？\n\n答案是两种方法之一：\n\n- 使用格式化打印（pretty-printing）\n\
    - 使用词法保留的打印（lexical-preserving printing）\n\n所以让我们考虑它们之间的区别。\n\n## 什么是格式化打印？\n\n\
    格式化打印意味着我们将代码写成源码，其文本表示将以一种整洁且标准的方式打印。\n\n例如，如果你正在解析一个看起来所示的现有 java 类：\n\n```\n\
    class A { int\n\na; }\n```\n\n那么之后你决定使用 JavaParser 对其进行格式化打印，你将得到代码的如下表示：\n\n\
    ```\nclass A {\nint a;\n }\n```\n\n## 什么是词法保留的打印？\n\n词法保留打印意味着在打印时保留原始布局。当我们编写代码时，有些信息对于编译器来说没有严格的意义，但对人类来说非常重要。即：空格和注释的位置。\n\
    \n如果你解析了一些代码并使用词法保留打印打印回来，你将得到与解析时相同的代码。如果你解析了一些代码，对其进行修改，然后使用词法保留打印打印回来，你将得到与原始代码非常接近的代码，更改仅限于你显式修改的节点。\n\
    \n即使对于一个通过程序化构建而非从源码解析而来的 AST，你也可以使用词法保留打印。在这种情况下，没有原始布局需要保留，代码将默认采用格式化打印的形式。同样，当你解析代码并向\
    \ AST 中添加一些程序化创建的新节点时：你解析的代码部分将带有布局信息，而你创建的节点将不会，它们将被进行格式化打印。\n\n## 在格式化打印和词法保留打印之间选择\n\
    \n我们已经看到，使用 JavaParser 从 AST 生成代码时有两种不同的风格。下一个问题是，我们什么时候该用一种，什么时候该用另一种？\n\n根据我们所见，许多情况都涉及使用\
    \ JavaParser 对大型代码库进行转换。在这种情况下，你通常会想要词法保留打印。原因是，所有未修改的代码都将保持原样。\n"
