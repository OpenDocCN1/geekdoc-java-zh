    ;\n    private static final String SRC_PATH = \"src/main/java\";\n\n    public\
    \ static void main(String[] args) throws Exception {\n        TypeSolver reflectionSolver\
    \ = new ReflectionSolver();\n        TypeSolver javaParserSolver = new JavaParserSolver(new\
    \ File(SRC_PATH));\n        reflectionSolver.setParent(reflectionSolver);\n\n\
    \        CombinedTypeSolver combinedSolver = new CombinedTypeSolver();\n     \
    \   combinedSolver.add(reflectionSolver);\n        combinedSolver.add(javaParserSolver);\n\
    \n        JavaSymbolSolver symbolSolver = new JavaSymbolSolver(combinedSolver);\n\
    \        StaticJavaParser\n            .getStaticConfiguration()\n           \
    \ .setSymbolResolver(symbolSolver);\n\n        CompilationUnit cu = StaticJavaParser.parse(new\
    \ File(FILE_PATH));\n\n        FieldDeclaration fieldDeclaration = Navigator.findNodeOfGivenClass(cu,\
    \ FieldDeclaration.class);\n\n        System.out.println(\"Field type: \" + fieldDeclaration.getVariables().get(0).getType().\n\
    \            .resolve().asReferenceType().getQualifiedName());\n    }\n}\n```\n\
    \n# ResolveTypeInContext.java\n\nWhat are we doing here?\n\n- we get the first\
    \ of the (and only) variable defined in the FieldDeclaration\n- we translate that\
    \ type to a JavaSymbolSolver type, to do that we pass the JavaParser type and\
    \ the context to use\n\nThe JavaSymbolSolverResolvedType is a type containing\
    \ all the information you might need on the type.\n\n# Solving Symbols and References\n\
    \nIn this case, the context we use is the fieldDeclaration. This means we want\
    \ JavaSymbolSolver to consider what a reference type Bar means when used to point\
    \ to where that particular node is defined\n\nConsider this:\n\n```java\nclass\
    \ Foo {\n  Bar bar;\n}\n\nclass Zum {\n  Bar bar;\n}\n\nclass Bar {\n\n}\n```\n\
    \nFrom the point of view of JavaParser, both the FieldDeclarations have the same\
    \ type: a named Bar. But that name in different contexts means different things.\
    \ By passing that name JavaParser type and the context (the first or the second\
    \ FieldDeclaration) JavaSymbolSolver will give us different answers and figure\
    \ out the real type being used in each case.\n\nPretty method, eh?\n\n# Resolving\
    \ method calls\n\nAnother thing that JavaSymbolSolver can help you with is resolving\
    \ method calls. As you probably know Java permits the overloading of methods,\
    \ i.e. different methods having the same name but a different signature. This,\
    \ however, can make it unobvious which method is called by a particular invocation.\n\
    \nConsider this:\n\n```java\nclass A {\n  public void foo(Object param) {\n  \
