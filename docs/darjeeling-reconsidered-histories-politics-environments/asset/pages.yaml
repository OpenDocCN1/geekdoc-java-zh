    Darjeeling doubled. By 2011, Census ﬁ gures put the number of people


    living permanently in Darjeeling town at 120,000\. Given the persistent


    appeal of the picturesque hill station, there is every indication that this


    number will continue to increase. In addition to the permanent resi-


    dents are the 200,000 people who constitute a transitory population. ⁵


