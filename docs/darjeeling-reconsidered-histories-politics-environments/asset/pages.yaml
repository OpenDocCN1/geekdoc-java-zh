    talist politics. Th is, in the end, weakened the cause, as it opened the door


    to the West Bengal government to co-opt the movement’s leaders.


    Th e fact that people do not generally criticize the pursuit of private


    gain but rather its conﬂ ation with the domain of an idealized movement


    supports Parry’s argument that people object to a breach of boundar-


    ies between public (here: the movement) and private domains. ^(51) In


    people’s imagination a ‘true’ movement embodied the ‘other’ of politics.


    Gorkhaland’s existential importance prohibited an intermixing with


    personal quests for material gain. Such perceived boundaries between


    moral and immoral conduct are also functional in the GJM’s practice and


    rhetoric. As I showed, leaders responded to followers’ multiple demands


    for sharing their presumed wealth and ﬁ ghting for Gorkhaland through


    double-dealing, ^(52) while camouﬂ aging their involvement in politics as


    ‘virtuous’ behaviour. Examples for this camouﬂ aging include the presen-


    tation of patronage as social work, the denial of allegations of repression


    while proclaiming commitment to ‘non–violence’, and the justiﬁ cation of


    the GTA agreement as a step towards Gorkhaland. Leaders’ legitimacy


    ultimately rests on their ability to generate trust and responsibility in


    protecting the group’s interest. ^(53) Th e aim of such camouﬂ aging was thus


    to demonstrate that Gorkhaland—after all—was part of the domain of


    a virtuous movement represented by an honest leader. Resembling the


    logic of an ideal-type people’s movement, ^(54) the agitation for Gorkhaland


    should stand outside the realm of party politics in order to avoid exploi-


    tation for personal or electoral gain.


