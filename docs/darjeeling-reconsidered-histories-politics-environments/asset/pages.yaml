    Th is essay highlights the electoral incentives of Gorkha politicians


    to explain the variable intensity of mass autonomy movements. ¹ I point


    out the parallels in the careers of three major Darjeeling political ﬁ g-


    ures, whose careers span decades: Deoprakash Rai, Subash Ghisingh,


    and Bimal Gurung. Each of these leaders de-escalated his movement


    for Darjeeling autonomy as his personal power and electoral dominance


    was consolidated. In less competitive periods of Darjeeling politics, these


    leaders were able to maintain a tacit bargain with the state and national


    governments, receiving resources in return for quiescence on the issue of


    local autonomy.


    Reconsidering the Gorkhaland Movements in light of electoral com-


    petition provides institutional and political context for ethnographic


    and sociological accounts of Darjeeling. Th e popular anxieties animating


    calls for Darjeeling’s autonomy only reach the national stage via political


    organizations. Th ese organizations and their leaders produce discon-


    nects between Darjeeling’s social realities and the varied career of the


    Gorkhaland demand in national politics.


