    As a trade-based, transnational social justice movement, Fair


    Trade’s key tenets are to empower marginalized producers, to ensure


    their participation in key decision-making institutions in their com-


    munities, and to promote social justice in general, ³ with a core focus


    on women’s empowerment. ⁴ It is an alternative economic system, but


    what distinguishes it from ‘free trade’ is its imperative to measure and


    manage the working of social justice through this trading system. ⁵ Fair


    Trade promoters and activist consumers believe that ethical buying and


    selling of Fair Trade tea across national borders can fulﬁ l these goals


    by channelling new resources and governance mechanisms to producer


    communities. Th e Fair Trade product label stands as a proof and prom-


    ise of trade-based justice work.


    What remains unexplored within this abstract global discourse on


    Fair Trade is how subjects of transnational justice regimes, in this case


    smallholder women tea farmers in rural Darjeeling, understand and


    mobilize around the governance practices of ostensibly ethical trans-


    national justice regimes like Fair Trade. More speciﬁ cally, how do they


    understand and engage with Fair Trade in the context of their speciﬁ c


    identities (as housewives and savvy entrepreneurs) and histories of con-


    tention over gendered access to resources in their own communities? It


    is critical that we understand these sites of critical negotiation with Fair


    Trade as an example of gendered navigation, and as a critique of global-


    ization and its imbrication with local patriarchies. ⁶ Th rough long-term


    ethnography of Fair Trade operations and their eﬀ ects on a small-holder


    tea farmers’ cooperative in rural Darjeeling, I contend that Fair Trade


    interventions can inadvertently strengthen patriarchal/gendered power


    relations in producer communities, but that smallholder women tea


    farmers also make creative use of speciﬁ c Fair Trade interventions to


    defend their own priorities and rupture Fair Trade’s complicity with


    male domination in their communities. Th e gendered contestation


    around Fair Trade is also a critique of these so-called ‘sustainability’


    campaigns to address women’s everyday abilities to lead an economically


    satisfying and respectful life. ⁷


