    who with their families had left the suzerainty of the Sikkim king, his


    Dewan, and chief Lama, for Darjeeling. ⁷ Th e British oﬃ cial in charge


    dolefully reported that only 51 males and 37 females had responded to


    colonial overtures, despite a warm oﬃ cial welcome for the chief ’s son


    and cash advances for his followers. ⁸


    Unlike Herbert’s sanguine predictions, the majority of Lepchas,


    even when they were amenable about seeking work around Darjeeling,


    proved unenthusiastic about the arduous manual labour that building


    urban infrastructure entailed. ⁹ Th eir preferred lifestyle was to combine


    foraging, hunting, and shifting cultivation, moving from one spot to


    another as they deemed ﬁ t. Such moves allowed the soil to regain fertil-


    ity, and allowed cultivators to evade the increased dues that the Sikkim


    ruler levied after three years on a site. ^(10) However, an increasingly mon-


    etized colonial economy gradually made it a challenge to sustain a viable


    livelihood solely from shifting cultivation and foraged commons. Th is


    was a major reason why numerous Lepchas sought out temporary wage-


    earning tasks, as when the British botanist Joseph Hooker journeyed to


    Darjeeling to advance his quest for scientiﬁ c fame and success.


