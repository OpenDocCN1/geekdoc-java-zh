    course of the agitation, and that the party relied on violent means to


    sustain its dominance, suggests that for many the GJM had crossed the


    boundary separating the acceptable and the unacceptable. While people


    had initially equated the GJM with Gorkhaland and the movement,


    many now equated the GJM with dirty politics (or kutniti), and as such,


    were willing to criticize how the GJM had directed the movement and


    even claim that its leaders had sold Gorkhaland.


