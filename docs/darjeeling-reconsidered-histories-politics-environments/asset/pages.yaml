    **Th e Fall of Subash Ghisingh**


    Rai’s death was an obvious milestone in Darjeeling politics. It is harder


    to pinpoint the cause of Ghisingh’s fall from power. One factor was


    the unpopularity of the GNLF’s Sixth Schedule proposal. Many in


    Darjeeling considered the designation as ‘tribal’ to be contrived and even


    demeaning. Th e classiﬁ cation also had the potential to eliminate some


    of the special legal privileges of lower caste Gorkhas. Seizing an oppor-


    tune political moment, Bimal Gurung, Ghisingh’s second-in-command,


    broke from the GNLF in October 2007 to form the Gorkha Janamukti


    Morcha (GJM). ^(24)


    Gurung promised the GJM would prevent Darjeeling from becoming


    a Sixth Schedule area and establish statehood instead. To put pressure


    on Ghisingh and his state and national allies, the GJM used general


    strikes, *gheraos* (sieges of government buildings), tax boycotts, and road


    blockades. GJM activists clashed with non-Gorkha protestors in the


    plains of Darjeeling and with GNLF members in the hills. New Delhi


    tried to assist Ghisingh. It pushed the national legislature to expedite


    Sixth Schedule status for Darjeeling. But that legislative manoeuvring


    did not proceed quickly enough. In March 2008, Ghisingh resigned and


    ﬂ ed Darjeeling in face of massive GJM protests and interparty violence.


    **Th e GJM in Power**


    In 2011, GJM candidates for the West Bengal state legislature won in


    every Darjeeling constituency (see Table 4.1). Th ose elections signalled


    that the GJM was the new dominant political actor in Gorkha politics.


    Its electoral power was obvious again in the 2016 state assembly races.


    GJM candidates won with a margin of 8.3 per cent in Kalimpong, 21 per


    cent in Kurseong, and 31 per cent in Darjeeling. Th e GJM’s elimination


    of its political rivals ran parallel with a ratcheting down of its demands.


