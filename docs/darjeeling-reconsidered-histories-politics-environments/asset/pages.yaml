    Darjeeling relationally; not as a place in and of itself, but as a place seen


    and approached from Calcutta. Th is relational gaze goes a long way


    back. Th e very establishment of Darjeeling as a British hill station was


    itself a product of ‘visits’ from the (then) colonial capital in Calcutta.


    One of the ﬁ rst British ‘visitors’ to the area was the Deputy Surveyor


    General of India Captain J.D. Herbert. Herbert travelled around


    Darjeeling in February and March 1830, in order to survey the area as a


