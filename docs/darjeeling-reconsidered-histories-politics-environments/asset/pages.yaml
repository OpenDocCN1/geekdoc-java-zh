    Th ese interlinked demands for tribal recognition and autonomy have


    accordingly been structured by particular technologies of postcolonial


    governance on the subcontinent—speciﬁ cally those systems put in place


    to govern ethnic minorities. As the category ST has assumed new-found


    social lives, ethnic renewal and ethnic switching, to borrow terms from


    Nagel, have become a key dynamic of ethnopolitics in Darjeeling. ^(41) For


    Darjeeling’s aspiring tribes, this renewal includes selective appropria-


    tion and active deployment of cultural icons and imagery to present an


    authentic representation of their tribal culture and lifestyle. In this


    regard, the present demands for ST status can be read as symptomatic


    of both a broader pattern within the Indian polity and the emergence


    of a broader global discourse on indigeneity—a conjuncture that


    Middleton has called the ‘ethno-contemporary’. ^(42) Given the local and


    longer histories at hand, these demands also articulate the people of


    Darjeeling’s perennial quest to assert their belonging to the nation, and


    to claim citizenship rights from the state.


    Importantly, these movements for ST recognition have carried a


    strong cultural bent. Like the ethnic associations of 1920s and 1930s


    (discussed earlier), today’s ethnic associations have focused on cultural


    preservation and social welfare for their constituents. But unlike their


    colonial predecessors, these ethnic associations are also explicitly politi-


    cal in their articulations of a discrete ethnic—or ‘tribal’—identity. Th e


    plethora of demands raised by ethnic associations thus reﬂ ect a blend of


    civil society concerns (raised by earlier ethnic associations) and the more


    political society-oriented dispensations that have shaped the longstand-


    ing demands for subnational autonomy.


