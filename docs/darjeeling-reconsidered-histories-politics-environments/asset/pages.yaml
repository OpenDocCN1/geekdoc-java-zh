    In lieu of conclusion, there is a certain politics in Pradhan’s work


    that merits consideration—namely his attempts to foster acceptance


    of the possibility that diﬀ erent interests, traditions, and even nation-


    alities can co-exist within a territorial unit under common rule. It


    matters very little why territorial units (such as nation-states) have


    been constructed—whether for reasons of custom, tradition, conquest,


    negotiation or geographical circumstances. What matters more are the


    distinct and complex social structures that arise within these units. It


    is our contention that most of Pradhan’s writings call for a tolerance


    of diﬀ ering truths on nation and nationalism—truths that have called


    into question the linear histories of national time and identities in a way


    that rescues the history of the nation from that of the nation-state. ^(46)


