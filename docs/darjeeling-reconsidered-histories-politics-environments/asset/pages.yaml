    **Municipal Disconnections and Samaj Aﬀ ects**


    Darjeeling’s samaj are geographically clustered collectives. Th ese col-


    lectives are often multi-ethnic and based on residential patterns, rather


    than shared cultural or religious practices. ^(14) Given the diasporic popula-


    tion and the heterogeneous nature of Darjeeling’s settlement patterns ^(15)


    the samaj are often a stand-in for kin and ethnic-based networks. ^(16) Th at


    said, residence alone is not enough to ensure samaj aﬃ liation. A neigh-


    bourhood might have a samaj, but not all neighbours may belong to it


    in an oﬃ cial sense. Rather, people join samaj after a selection process


    is complete and a membership fee is paid. Once a person belongs to a


    samaj, he/she is entitled to emergency ﬁ nancial assistance as well as a


    considerable amount of social support. In a sense, they are akin to an


    informal insurance system that also serves as a social safety net. Members


    argue that the system simultaneously provides members ‘self-reliance’ as


    opposed to dependence on municipal or state governing bodies.


    A driving concept of the samaj is the idea that they provide *kalyan* , a


    Nepali term that can be translated as ‘welfare’. As a samaj member ada-


    mantly stated when asked, people join the samaj because they oﬀ er an


    ‘invisible structure’ that buﬀ ers the risks and insecurities associated with


    everyday life. By taking monthly fees, often of about Rs. 100 per member,


