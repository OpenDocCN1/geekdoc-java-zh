    **Reconsidering Darjeeling**


    Amid these conditions, we believe the time is now for a critical reconsid-


    eration of Darjeeling’s past, present, and future. Th ere is no doubt that


    Darjeeling is a special place—one of remarkable beauty, distinctive cul-


    tures, exquisite teas, and all the rest. Th ese real and imagined qualities


    have proven formative of the Darjeeling we know today. In rethinking


    this legacy, however, the challenge is not to do away with the legend of


    Darjeeling altogether, but rather to acknowledge how such idyllic fram-


    ings have shaped life in the hills, yet also failed to capture its dynamism


    and diﬃ culties. So long as the legend of Darjeeling continues to cast its


    long shadows across the hills, the postcolonial romance with this ‘queen


    of the hills’ will continue to obscure and occlude understandings of the


    region—and more importantly, the prospects of those who call it home.


    Figured in this way, the project of reconsidering Darjeeling stands as


    both an intellectual *and* political project; one that beckons a multitude


    of voices well beyond the covers of this book. Th e perspectives that


    follow provide some grist for the conversations to come, the emergent


    contours of which are brought into focus for future consideration by


    Tanka Subba’s Afterword, which at once commends and critiques the


    contributions. Tracing the shadows of Darjeeling’s postcolonial legend


    and casting light on lives lived otherwise, these essays, we hope, can help


    clear a space for rethinking Darjeeling on its own terms. Indeed, this


    book is underwritten by the possibility that reconsidering Darjeeling’s


    past and present may, in time, prove a vital step towards reimagining


    its future.'
