    Mediated through picturesque paintings, tourist guides and even


    governmental documents, narratives and images of Darjeeling began to


    circulate shortly after Darjeeling’s ‘discovery’. Like its European counter-


    parts, this guiding material ‘deﬁ ned a style of travel’ and selected ‘which


    tourist attractions were worth visiting’. ⁸ Intermeshed with historical,


    geological, and ethnographic descriptions of the area, the Darjeeling


    guides are full of advice to the traveller on transportation, food, and


    accommodation. And, as guides do, they point out to the reader what


    there is to see. Th is material was, in other words, central to a *disciplining*


    *of the gaze* with which Darjeeling was approached and experienced. ⁹


    In this chapter, I argue that such touristic observation is not only a


    way to consume places, but also—in its generalized, globally mediated


    form—a distanced form of *place production* . ^(10) Inspired by Foucault’s


    notion of the medical gaze, Urry conceptualizes the tourist gaze as a spe-


    ciﬁ c *way of seeing* whose emergence is tightly related to the development


    of modern tourism. ^(11) Just as the empirical, scientiﬁ c gaze of the clinic,


    the tourist gaze is ocular—a social practice that is primarily organized


    visually. From the early-nineteenth century onwards, tourism in general,


    and sightseeing in particular, thus joins science in situating the visual


    sense at the core of its practice. ^(12) In terms of place production, this is


    important. Th e visual character of modern tourism practice enables an


    increasingly ‘omnivorous production and “consuming [of] places” around


    the globe’ not only through corporeal travel, but also through more dis-


    tanced and mediated forms of virtual and imaginary tourism. ^(13)


    If we recognize that touristic consumption is part of the modern pro-


    duction of places, what—then—becomes of such places? If the ‘tourist


    gaze’ played a central role in the ‘reﬂ exive process’ by which Darjeeling


    ‘came to enter the global order’, what does this mean for Darjeeling?


    In his ‘introduction to supermodernity’, Marc Augé argues that modern,


    distanced observation creates a ‘false familiarity’ with certain places, an


    image-mediated sense of place that is global rather than local. ^(14) With


    reference to Darjeeling, I suggest a diﬀ erent perspective. In contrast to


