    Th e idea of fencing the border with Bangladesh, Pakistan, and


    Myanmar is not the same as fencing the border with Nepal. India will


    never endorse that idea because it is not in its national strategic interest


    to push Nepal towards China. India is aware of the pro-China ele-


    ments in Nepal and the inroads that China is making to connect itself


    better with Nepal. But it is high time India stops thinking that the


    high glacial mountains create an impenetrable natural barrier between


    China and Nepal. India should also stop relying on the ancient and


    deep historical, cultural, religious, and linguistic connections between


    Nepal and India, as such connections ﬂ y in the air when real politics


    comes into play, as it did after the Nepal blockade in late 2015\. Prime


    Minister Modi, who was the tallest hero of Nepal, became its biggest


    villain after the blockade.


    I therefore feel that the issues of Nepali national identity are going


    to bother the people of Darjeeling for a much longer time than they


    can imagine. I also do not believe that a separate state of Gorkhaland is


    going to help them much. Th ey will be told to go to Gorkhaland instead


    of being told to go to Nepal (as is often the case now), wherever and


    whenever there is an ethnic conﬂ ict with the local majority population


    and they are forced to leave the way they did from various parts of


    North-East India in the 1980s and from Bhutan in the 1990s. Some


    of them, perhaps the unscrupulous among them, will take the reins of


    power in the state of Gorkhaland, will amass wealth for themselves, and


    perpetuate backwardness of the majority much the same way it is done


    under West Bengal.


    So what should the Nepalis of Darjeeling do for their future? Th e


    Gorkhaland path is certainly one the GJM and its supporters will take.


    Th e Sixth Schedule path is touted by the GNLF, but the GNLF does


    not have any credible leader at present. Th e Union Territory path is also


    suggested by some, but the political leaders of Darjeeling do not see how


    they are going to be relevant under this system. Merger with Sikkim is


    certainly one great idea, but it is not an option because Sikkim will never


    agree to it. More districts and more development boards may be created


    by the state, but such a piecemeal approach will not be able to address


    the complex issues of Darjeeling. Similarly, the future of Darjeeling is


    bleak without Siliguri. If Bengali becomes a compulsory language in


    the hills of Darjeeling, as proclaimed by the state government recently,


    Darjeeling may not even be able to protect its lingua franca, Nepali.


    It was such linguistic chauvinism of Bengal that pushed Assam away


    from Bengal Province at the end of nineteenth century and a similar'
