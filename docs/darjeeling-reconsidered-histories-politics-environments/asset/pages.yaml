    sense of nation-space. ^(49) Hitherto considered a sacred space for reli-


    gious pilgrimage, the Himalayas were, in their writings, recast in terms


    of natural beauty rather than supernatural power. And much like the


    colonial British, the bhadralok fashioned themselves as ‘secular sojourn-


    ers’ visiting the Himalayas for leisure. As a result, their class anxieties


    fuelled a reproduction of the possessive ‘quasi-orientalist’ gaze of the


    colonial rulers in post-independence Bengal. ^(50) While the racial diﬀ er-


    ence between British colonialists and Bengali bhadralok was overcome,


    the class hierarchy of the colonial setting was maintained.


    **Politics of Belonging in a Summer Place**


    With its emphasis on Darjeeling as a tourist destination suitable for


    leisurely visits and visual consumption, the tourist gaze leaves notions


    of inhabitation and belonging obscured. Organized around notions of


    travel for leisure rather than labour, the gaze overlooks the large number


    of Nepali labour migrants who provided the physical input that trans-


    formed Darjeeling from the ‘forested spur’, described by its ﬁ rst colonial


    visitors, into a landscape that is both picturesque and productive. ^(51) Th e


    tourist gaze thus reinforces the complicated political situation of the


    ‘Indian Nepalis’. ^(52) At a time when claims for belonging are routinely


    legitimized through notions of indigenous rooting in place, the migration


    history of most Darjeeling inhabitants can quickly be seen as a liabil-


    ity. ^(53) Consequently, as Townsend Middleton has argued, the politics of


    belonging in Darjeeling are fuelled by a persistent, underlying anxiety


    and unfold in episodic spurts across multiple, shifting incarnations. ^(54)


    Rather than looking directly at these episodic spurts, the ﬁ nal section


    of this chapter traces the notion of ‘normality’ that is repeatedly pitched


    as their background: the picturesque and harmonious Darjeeling of


    the tourist gaze that provides a basis upon which the ﬁ erce political


    agitation of the Gorkhaland Movement’s multiple incarnations can be


    discounted as exceptional—that is, out of character of the Darjeeling


    that we know.


