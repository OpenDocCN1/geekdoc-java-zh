    Class: Labour and Leisure


    Tourism is a leisure activity, which presupposes its opposite, namely


    regulated and organised work. It is one manifestation of how work and


    leisure are organised as separate and regulated spheres of social practice


    in ‘modern’ societies. Indeed, acting as a tourist is one of the deﬁ ning


    characteristics of being ‘modern’….


    —John Urry, *Th e Tourist Gaze*


    Th e relationality involved in seeing and visiting Darjeeling was not


    a neutral one. If the tourist gaze, as Urry suggests in the quote above,


    relies on the ‘modern’ distinction between labour and leisure, it is clear


    on which side of this distinction Darjeeling falls. In the tourist gaze of


    the guidebook material, Darjeeling emerges as a ‘landscape of privilege’


    *par excellence* : a place reserved for the wealthy visitor from the plains. ^(41)


    Th e ﬁ rst lines of E.C. Dozey’s 1922 *A Concise History of the Darjeeling*


    *District* , for example, state that: ‘In these strenuous days when the struggle


    for existence shackles men to their desks, or keeps them tied to counters


    in the sweltering heat of the plains, the very mention of Darjeeling recalls


    memories of the last but too short week-end during which as much plea-


    sure as possible was pressed into it.’ ^(42) Th e audience Dozey addresses is


    here represented by a privileged male tied to his white-collar employment


