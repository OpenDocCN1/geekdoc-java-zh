    frames the document very diﬀ erently. Th e title page of the republication


    likens the Gazetteer to ‘good wine’, presenting it as the ‘fruits’ of the colo-


    nial oﬃ cial, L.S.S. O’Malley’s, ‘labour of love’. Th e reprint also adds an


    introduction to the Gazetteer with the title ‘A Summer Place’. In this, the


    author describes Darjeeling exactly as a tourist place: ‘a precious summer


    place’ where one can ‘take a break’ and ‘get away from the insane world’


    where people are ‘obsessed with money and the material goods that


    can be bought and consumed to satisfy our endless appetite’. ^(18) Although


    a visit to Darjeeling is thus framed as a departure from materialist


    obsession, the place itself appears exactly as an object of touristic


    consumption: ‘the land of that magic potion’ that can be gobbled down


    by the visitor just like the tea for which the area has become famous. ^(19)


    Albeit striking, this intrusion of commodiﬁ ed touristic leisure into a


    governmental document is not at all unprecedented. Darjeeling became,


    from the mid-nineteenth century onwards, the object of a range of gov-


    ernmental documents, historical tracts, and touristic guides. Th e overlap


    between these diﬀ erent documents is quite remarkable. Sections are


    often copied verbatim between the sources; the colonial bureaucracy’s


    minute categorizations of land and people are repeatedly coupled with


    suggestions for the traveller on what to see and where to eat. Th ese


    documents, in other words, repeatedly represent a merger between the


    tourist gaze and the gaze of centralized government—be it colonial or


    national. Th e result of this merger is an authoritative disciplining of a


    gaze that is *relational* and *classed* , constituting Darjeeling as a picturesque


    place for leisurely visits rather than one of belonging. In the following,


    I analyse this gaze in detail.


