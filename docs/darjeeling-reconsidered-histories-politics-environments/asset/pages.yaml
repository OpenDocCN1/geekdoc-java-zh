    secure rights and entitlements as citizens.


    **Nomenclatures of Belonging: Early Iterations**


    As the opening chapters of this volume demonstrate, British colonial-


    ism redeﬁ ned the contours of the Darjeeling region, and largely set the


    terms of integration into British India for its inhabitants. ⁴ Darjeeling


    was included within the colonial matrix as an ambiguous space charac-


    terized by its plantation economy, its framing as a site for rejuvenation


    of health, and its strategic geopolitical position in a frontier region.


    Amid these exceptional circumstances, a variety of ethnic organizations


    emerged in the early twentieth century to help forge a collective identity


    for the Nepali–Indian community of the hills and therein demand an


    exclusive status for the region. Th ree aspects were crucial in constituting


    this collective ethnic identity: (a) the formation of cultural and social


    organizations to articulate collective demands; (b) the forging of ties


    amongst ethnic groups to structure a collective ethnic label; (c)  the


    demands for a separate administrative set-up for Darjeeling, citing


    cultural diﬀ erences from the rest of Bengal. Issues of belonging and


    becoming played a signiﬁ cant role in the consolidation of the Nepali-


    speaking community in Darjeeling. Because issues of nomenclature were


    essentially linked to questions of nationality, many names were used to


    refer to the emergent Nepali-speaking community in the hills.


    From the start, the Nepali language became a prime symbol of belong-


    ing for the peoples of Nepali origin in Darjeeling. Th e language served


