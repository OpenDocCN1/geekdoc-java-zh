    Relationality


    Th e traveller leaves Calcutta at four o’clock in the afternoon, in the thin-


    nest clothing he possesses. Next morning he is glad of a winter’s suit, and


    before his arrival ulsters, fur cloaks, and rugs are more than welcome. Th e


    world cannot furnish a stranger railway journey than that from Calcutta


    to Darjiling.


    —William Sproston Caine, *Picturesque India:*


    *A Handbook for European Travellers*


