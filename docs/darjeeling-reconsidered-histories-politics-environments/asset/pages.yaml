    **Darjeeling Elites and the Gorkhaland Movement**


    Th is chapter describes a basic continuity to the structure of politics in


    Darjeeling. Autonomy demands have escalated after surprise events dis-


    placed political incumbents: Rai’s death, Ghisingh’s 2006–7 missteps,


    and so on. Th is kind of shock to the political system makes space avail-


    able for challengers who try to build a following by rekindling demands


    for greater autonomy for Darjeeling. Th ese challengers launch aggressive


    mass movements that clash with incumbent parties. Th us, electoral and


    partisan competition coincides with insecurity. By contrast, when incum-


    bents are electorally secure, their incentive to press autonomy demands


    dwindles. Th ey face no pressure from rivals in Darjeeling and no reason


    to disrupt the ﬂ ow of resources from state and central coﬀ ers. Both the


    national and the state governments tolerate the anti-democratic features


    of Darjeeling’s autonomous institutions precisely because periods of


    low political competition in Darjeeling have also been periods without


    aggressive autonomy movements.


    Commentaries on Gorkhaland often emphasize the popular griev-


    ances that lend force to calls for autonomy: questions of identity, social


    and economic power, and insecurity within the Indian polity. Th e


    transformation of grievances into mass actions— *hartal* s, marches, tax


    boycotts, and even violence—have been dominated by political parties,


    notwithstanding the all–party alliances and civil society fronts that have


    periodically appeared and foundered. ^(29) Political parties oﬀ er tactical


    advantages, such as the ability to gain leverage in New Delhi by inﬂ uenc-


    ing parliamentary races. Yet, it is obvious that Gorkha parties have not


    achieved much material improvement in the lives of Nepali-speakers in


    and around Darjeeling.


    Such failures prompt observers to denounce Darjeeling’s political


    class. Th is verdict may be well–deserved but it suggests no solutions


    ^(29) See Wenner, in this volume.'
