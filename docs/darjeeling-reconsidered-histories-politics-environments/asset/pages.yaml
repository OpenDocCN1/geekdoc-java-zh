    **Distinctiveness of the Nepalis in Darjeeling**


    Pradhan’s treatment of the history of national-identity formation


    among the Nepalis of Darjeeling resonates with his earlier intervention


    surrounding the grave question of conquest vis-à-vis nation building in


    the history of eastern Nepal. In *Pahilo Pahar* he elaborates three distinc-


    tive connotations of the term *Nepali* . First, *Nepali* implies a language.


    Second, the term implies a political denotation indicating those who


    speak Nepali language and are citizens of Nepal by origin. Th ird, he


    uses *Nepali* as a cultural symbol of a distinctive nation whose mem-


    bers are not conﬁ ned by the political boundaries of the country called


    Nepal. ⁷ Th e use of the term *Nepali* in all of his texts refers to this latter


    cultural connotation: an identity formation that might be considered a


    ‘nation’, but that transcends the borders of any single state. He further


    argues that the political subtext of the term *Nepali* refers to identity by


    citizenship of the subject population of Nepal, while the cultural import


    of the term *Nepali* refers to a linguistically uniﬁ ed community not con-


    strained by the political boundaries of any nation-state. We argue that


    Pradhan’s contribution can be appreciated properly only when one is


    ready to accept the term *Nepali* as a culturally articulated, rather than


    as a politically oriented phenomenon. Ultimately, Pradhan proposes a


    critique that interrogates the collapsing of nation, state and society or


    culture into one.


