    As I will demonstrate ethnographically, the repeated juxtaposition of


    Fair Trade and *swaccha vyapar* in regular conversation was a rhetorical


    strategy by which smallholder women tea farmers articulated


    the shortcomings of Fair Trade in promoting their speciﬁ c economic


    pursuits, which they had nurtured during previous participation in other


    transnational justice regimes like micro-lending. More importantly,


    women’s situated reading of ‘fairness’ in Fair Trade was ﬁ ltered through


    a localized, gendered political economy in which they had to struggle to


    gain respect and recognition for their daily labour and entrepreneurial


    ventures, which were critical for their families’ and communities’ survival


    in a context of shrinking economic opportunities for men. As I detail later,


    women’s entrepreneurial ventures involved illegal sale of tea and sale of


    alcohol, milk, and other produce from their farms, ventures they ﬁ nanced


    through micro-loans. For them ‘Fair Trade’ could become swaccha


    vyapar only if it helped them to meet the needs of their families with


    dignity through their women-only business ventures, and allowed them


    to mitigate the domination of local middlemen who became virtual brokers


    of transnational market-based justice regimes in their communities.


    In recent years, feminist scholars have nurtured healthy skepticism


    about empowerment strategies. ⁸ More worthy of critical feminist exami-


    nation is how rural women, who contest gendered resource inequities


    in their own communities, strategically mobilize around transnational


    justice regimes like Fair Trade. I see women’s critique of Fair Trade as


    centred on its use of their images to sell tea in Western markets, while


    leaving their labour and struggles unrecognized. ⁹ Th erefore, the images


    on tea packaging and posters that show women happily plucking tea


    obscure the male domination of the actual process of justice delivery. To


    challenge this opaqueness, women use the phrase swaccha vyapar, which


    at least rhetorically foregrounds their work and challenges the male


