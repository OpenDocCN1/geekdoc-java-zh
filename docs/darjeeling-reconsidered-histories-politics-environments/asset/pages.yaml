    the hills. Evolving in dialogue with these conditions, ethnicity and


    identity prove to be dynamic and ﬂ uid categories, which are constantly


    shaped and reshaped by various sociopolitical imperatives, desires, and


    opportunities. Th e spectrum of demands raised by the variously conﬁ g-


    ured communities of Darjeeling raise important questions regarding the


    historical interchanges between ethnopolitics and speciﬁ c technologies


    of governance, which have been reiﬁ ed and re-deployed as resources for


    popular struggles. In the current scenario, the inheritance and reworking


    of colonial categories such as ‘tribe’ has generated multiple possibilities


    and contestations. Amid varying claims of authentic heritage, culture,


    and religion, ethnic associations have consequently become a heteroge-


    neous space for the negotiation of identity.


    Since the early years of the twentieth century, ethnic identities and


    their attendant associations have played a crucial part in the social and


    political transformation of hill society. Ethnic associations raised crucial


    civil society-oriented concerns like the preservation of cultural heritage


    and the social welfare of citizens. In the wake of wider political trans-


    formations, these civil society concerns were absorbed into large-scale


    political mobilizations for regional autonomy. During these pan-ethnic


    mobilizations, exclusive ethnic associations faced serious setbacks and


    dwindled in time, only to re-emerge later in new forms. Th e present


    articulations of ethnic identities and demands for recognition as STs


    illustrate how older concerns for ethnic preservation and a quest to


    belong are being restructured and redeployed within the ambit of cul-


    tural rights and constitutional provisions.


    The politics of identity in Darjeeling thereby emerges at the


    convergence-point of civil and political society. Th is interface between


    civil and political concerns represents the changing contours of ethnop-


    olitics in the hills and brings into relief the perennial quest to become and


    belong to the nation-state. By subjecting themselves to political inﬂ u-


    ences and structuring their demands around constitutional provisions,


    ethnic associations try to recast identities and avail the beneﬁ ts that


    incur to ethnic minorities in India. Th e present demands for recognition


    as STs represents a new discourse of identity politics in which issues


    of legality and citizenship rights are redeﬁ ned at times within, and, at


    other times beyond, broader demands for regional autonomy. We see in


    these changing forms the ways in which the possibilities and constraints


    of postcolonial belonging and becoming are interpreted, negotiated, and


    articulated by a host of actors in Darjeeling.'
