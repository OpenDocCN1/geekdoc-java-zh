    6


    as forests were cleared, roads were built, and bungalows were erected to


    meet British desires. Th e ‘practically uninhabited’ ridge of Dorje–ling


    thus began its rapid metamorphosis into a colonial hill station.


    Th ese transformations required labour—far more than the local


    inhabitants (largely Lepcha and Limbu) could provide. Th e British


    consequently lured workers from Sikkim, Bhutan, and Nepal by prom-


    ising wages, shelter, and freedom from the oppressive tax and forced


    labour regimes that marked life in these neighbouring countries. ^(12) Tens


    of thousands poured into Darjeeling, marking the start of profound


    demographic changes that forever altered the ethnic landscape of the


    hills. In their contributions to this volume, Middleton and Sharma


    detail these patterns of mobility from historical perspectives, along


    with some of their legal and representational challenges. While integral


    to the hill station’s formation, these migrations also caused tension


    between the EIC and its Himalayan neighbours, who disapproved


    of these imperial encroachments on their human resources. British


    relations with Sikkim deteriorated throughout the 1840s, culminat-


    ing in the purported kidnapping of Campbell and renowned botanist


    and explorer Joseph Hooker in 1849\. Campbell and Hooker were


    released without incident, but the British leveraged the confrontation


    to permanently annex the region between the Mechi and Teesta rivers


    in 1850\. Th e British expanded further into the region in the 1860s,


    using the Anglo-Bhutanese War (1864–5) and consequent Treaty of


    Sinchula (1865) to incorporate Kalimpong and the lands east of the


    Teesta River into British control. Th us came into existence the region


    now commonly referred to as the Darjeeling hills: an area that loosely


    corresponds to the contemporary administrative districts of Darjeeling


    and Kalimpong. ^(13)


