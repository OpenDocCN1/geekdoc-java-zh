    political dominance by arresting other upstart politicians.


    New Delhi and Kolkata remained committed to Ghisingh’s political


    survival, fearing anarchy or more extreme leadership if Ghisingh fell. A


    new Gorkha leadership would escalate demands for Darjeeling’s self-


