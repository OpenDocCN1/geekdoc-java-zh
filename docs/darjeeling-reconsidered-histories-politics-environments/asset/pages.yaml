    men and women with high school or college educations. Th e DTMTC


    would answer a growing call by the GJM, the leading local political party


    that advocates for an independent federal state of Gorkhaland within


    the Indian union, to create jobs in Darjeeling for what politicians called


    the ‘educated unemployed’. With Gorkha sovereignty, quality local jobs


    would go to Gorkhas, to whom they rightfully belonged. According to


    the DTMTC’s founders, Gorkhas, by virtue of building, occupying, and


