  md: 'sara shneiderman and townsend middleton


    2


    imagination. Understandings of the region are rapidly transforming,


    as a new generation of scholars engages Darjeeling from fresh ana-


    lytical perspectives. Th is collection of essays brings together researchers


    from across Europe, North America, and India to shed fresh light on


    Darjeeling’s past and oﬀ er timely insight into the critical issues facing


    its people today. At present, Darjeeling ﬁ nds itself mired in a range of


    political, economic, and environmental crises that belie the popular nar-


    ratives of Darjeeling being somehow ‘above it all’—a land of Himalayan


    mystique, colonial splendour, and exquisite teas; a place to be visited and


    consumed. Th ese real and imagined qualities have done much to shape


    the region. Yet these narratives have also all too conveniently obscured


    the hard realities of life in this particular corner of India. Th is collection


    of essays proposes a more grounded understanding of the region and its


    people. Historiographically, these essays break with the hackneyed colo-


    nial accounts of the hill station’s founding to present alternative readings


    of the systems of colonial governance, labour, and migration that made


    Darjeeling a categorically exceptional place. Turning to the present, the


    essays oﬀ er in-depth ethnographic accounts of dynamics that deﬁ ne


    life in twenty-ﬁ rst century Darjeeling: among them, the realpolitik of


    subnationalist and indigenous struggles in the region; the controversial


    inner workings of Darjeeling’s tea industry and Fair Trade implementa-


    tion; gendered inequality, ecological transformation, and water rights


    controversies; and the enduring struggle of Darjeeling’s communities to


    ﬁ nd their place amidst the turbulent political and economic transforma-


    tions of twenty-ﬁ rst century India.


    Th e goals of this book are twofold: First, to explore how perspectives


    from the contemporary social sciences and humanities may open up new


    understandings of Darjeeling’s past, present, and future. Second, to ask


    what Darjeeling might teach us about South Asia, the Himalayan region,


    and the postcolonial world more generally. Placed within these broader


    frameworks of area studies and postcolonial theory, Darjeeling ﬁ gures as


    a key site for research. Geopolitically, the Darjeeling region—which for


    the purposes of this book we consider to include both the Kalimpong


    and Darjeeling districts—sits at a crucial nexus of South Asia (see the


    map in the frontispiece), yet it productively refuses many conventional


    demarcations within South Asian Studies. It is part of West Bengal, but


    has remained largely peripheral to the well-established intellectual com-


    munity focused on Bengali history, literature, and politics. Th e region


    likewise serves as a gateway to India’s North-East—namely, through the


    Siliguri Corridor and rapidly growing city of Siliguri—but it seldom'
