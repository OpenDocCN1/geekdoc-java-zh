    Th e notion of linking subnational recognition to education is not a


    new one in Darjeeling. Indeed, the idea of locally sourced and locally


    appropriate education has long been at the core of Darjeeling politics. Th e


    idea dates back as far as the 1960s, to the Nepali Language Movement’s


    eﬀ orts to make Nepali a recognized state language in government and


    educational contexts. More recently, however, Gorkha politicians have


    tended to describe the region’s educated youth as wayward and in need


    of discipline. In this, the situation in Darjeeling is distinct from the


    situation in other parts of India, where subnational subjectivity and


    education have been closely linked, ² or in Nepal, where student political


    activism is strong. ³


    Across India, subnational struggles have consistently been articu-


    lated on the basis of underdevelopment. Th e newly formed states of


    Uttarakhand and Telangana are good examples. In the Gorkhaland


    Movement, however, issues of unemployment, precarity, and distribution


    of resources have consistently taken a back seat to rights based on the


    recognition of identity, whether ethnic, tribal, or Gorkha. As I describe


    below, the DTMTC was thus an attempt to reconcile the tension within


    the movement between an aspiration of economic development and an


    aspiration of ethnic recognition.


    For the DTMTC to be successful, teachers and students alike had to


    ﬁ nd a way to see themselves as both potential managers and as proud


    Gorkhas. Over the course of the single year in which the DTMTC


    operated, these two subject positions proved to be diﬃ cult, if not impos-


    sible, to occupy at the same time. In what follows, I situate the story


    of the institute within a broader history of tea management in India.


    An analysis of colonial era texts aimed at would-be plantation managers


    reveals deep-rooted tensions over how tea management should ﬁ t into


    politics and over who should occupy managerial positions. I trace these


    tensions into the present through my own ethnographic observations


    of the DTMTC’s inauguration, its classes, and—most importantly—a


    series of charged exchanges between DTMTC instructors and students.


    Th ese in-class debates underscore an abiding concern among the


    educated unemployed about those same questions—how management


    should ﬁ t into politics and who should occupy managerial positions.


