    **Th e Origins of Adhocracy**


    Th e British ‘discovery’ of Darjeeling is an oft-repeated history. Th e


    story of Captain George Lloyd and J. W. Grant arriving to ‘Dorje-ling’


    and declaring the crescent shaped ridge an ideal perch for a colonial hill


    station sanatorium teems with the trappings of a classic discovery nar-


    rative: the intrepid traveller stumbling upon a wild, uninhabited land;


    the staking of a territorial claim; the winning over of the shy, ‘backward’


    natives; and the victorious transformation of a land and people as per


    the colonizers’ civilizational designs. Th is ‘discovery’ of Darjeeling needs


    no further celebration here. Such victorious histories do, however, raise


    questions about how exactly Darjeeling became the lauded ‘queen of the


    hills’. What, for instance, were the conditions of governance, capital, and


    labour that enabled the actualization of these Victorian designs? Th e


    issue is not *that* Darjeeling became something of a colonial utopia for the


    British, but rather *how* . Th e answer, I believe, lies in the special—that is,


    exceptional—status Darjeeling was granted from the start.


    Shortly after the British acquired Darjeeling by the controversial


    Deed of Grant from Sikkim in 1835, the task of transforming Darjeeling


    into a hill station sanatorium was handed to Dr A. Campbell. Campbell


    had earlier served as Assistant to the British Resident of Nepal, so he'
