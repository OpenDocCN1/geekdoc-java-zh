    agreement set the terms for the Darjeeling Gorkha Hill Council (DGHC).


    Th e DGHC was an apex body for district, village, and municipal govern-


    ments with authority for development funds and economic planning. Th e


    new council had no police or legislative powers but did come with a huge


    infusion of central development funds. In the 1988 accord the GNLF


    formally renounced the demand for Gorkhaland state and agreed to sur-


    render its arms in exchange for rehabilitation of ﬁ ghters. ^(17)


    Th e terms of the settlement and the manner in which it was imple-


    mented seem designed to repress political competition in Darjeeling.


    DGHC elections were supervised by a political appointee rather than


    the state election commission. In the 1989 council elections the GNLF


    took 26 out of 28 seats. ^(18) In the second and third DGHC elections,


    GNLF intimidation of candidates and poll-irregularities went unchal-


    lenged. GNLF candidates also won all the state legislature seats from


    the Darjeeling hills between 1991 and 2006, by an average vote margin


    of about 30 per cent (see Table 4.1 ).


