    2011 to 2012—Th e Art of Camouﬂ age


    Drawing on ethno-nationalist ideology alone was not suﬃ cient to sus-


    tain the agitation. Various accounts of party supporters suggested that


    they expected their leaders to share their presumed wealth. Indeed, many


    praised their *dajyu* (elder brother) Gurung for distributing money, and


    expected to be given jobs through the party. ^(35) Money was also needed


    to pay the salaries of the GLP—the aforementioned quasi–police force


    with about 13,000 members ^(36) —as well as the cost of transportation


    and food during demonstrations. Further, since 2008, central develop-


    mental institutions like the DGHC and the gram panchayats lacked


    any elected bodies, which left them somewhat dysfunctional. ^(37) After


    20 years of mismanagement of public funds through the DGHC, people


    were longing for development. Th is became especially pronounced in


    May 2009 when the cyclone Aila caused large-scale devastation in the


    hills, and the government provided an emergency fund of Rs. 200 million


    to the DGHC.


    To maintain their image as generous ‘social workers’ caring for the


