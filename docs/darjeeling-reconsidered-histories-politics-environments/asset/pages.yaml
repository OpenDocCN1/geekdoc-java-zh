    to answer the Gorkhas’ longstanding desires for autonomy in India.


    Politically, it has functioned as a one-party adhocracy, where the policies


    and jurisdictions of self-governance have been constantly renegotiated


    and manipulated by local, state, and federal governments alike. Th is state


    of *adhocracy* —to borrow Elizabeth Dunn’s useful term ¹ —is nothing


    new in the hills. Improvised and exceptional forms of governance extend


    deep into the region’s past. Beginning in the 1830s with the *carte blanche*


    authority vested to British administrators to transform Darjeeling into


    the consummate hill station sanatorium, the region has periodically


    been treated as separate—and largely ‘above’ the fray of India writ large.


    During the colonial period, Darjeeling was consistently exempted from


    the standard rule of governance, being ﬁ rst governed as an Non-Regulated


    Area, then made a Scheduled District in 1874, a Backward Tract in 1919,


    and a Partially Excluded Area in 1935\. Th is legacy of exceptionality has


    been subsequently extended in a range of postcolonial conﬁ gurations,


    including: the Darjeeling Gorkha Hill Council (in place from 1988 to


    2012); the failed attempt to make Darjeeling a Sixth Schedule ‘tribal


    area’ (2005–7); and the recently created GTA (2012–present). Ad hoc


    set-ups and special arrangements have been a hallmark of governance in


    the hills, making Darjeeling’s history exceptions ‘all the way down’.


    In this essay, I step back to ask how this history of exceptionality has


    both *marked* Darjeeling and *made* it a place apart. To be sure: Darjeeling’s


    colonial history ﬁ ts a broader pattern of exception that extended to


    other ‘frontier’, ‘backward’, and/or ethnically distinct regions—including


    the tea-growing areas of the North-East. Yet even within this greater


    pattern of colonial exception, the historical production of Darjeeling


    as an exceptional space is distinct in particular ways. Th e proximity


    to Nepal, Bhutan, and Sikkim was part of Darjeeling’s unique proﬁ le,


    as was its proximity to Calcutta. As Bennike and Sharma discuss in


    the ensuing chapters (this volume), these geographic circumstances


    rendered Darjeeling at once: a geopolitically strategic ‘frontier’; a hub


    of Himalayan cosmopolitanism; and a key site of the tourist gaze and


    colonial travel. Th ese elements were part of the constellation of historical


    forces that made Darjeeling an exceptional space—at once similar


