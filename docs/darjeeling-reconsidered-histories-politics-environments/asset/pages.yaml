    lives of a core group of smallholder women tea farmers, and interviewed


    many people associated with them, both male and female. To further


    situate these critical gendered contestations around Fair Trade, I ﬁ rst


    elucidate Fair Trade’s gradual imbrication with local patriarchies, then


    demonstrate the ways women contested this imbrication helping develop


    a ‘vernacular calculus of the economic’ ^(10) —a gendered evaluation of Fair


    Trade from the vantage point of everyday struggles for resources and


    recognition.


    **Th e Emergence of Smallholder Tea Production**


    **and Fair Trade in Darjeeling**


    Smallholder tea cultivation is quite frequent outside plantations. But


    the fact that some of this cultivation has become organic is a recent


    development, and was discovered quite by accident in the mid-1990s.


    SKS members were part of a plantation, which was abandoned soon


    after India’s Independence. Plantation workers became like refugees


    squatting on state land without any proper economic prospect. Th e


    years of tea mono-cropping had made their land unsuitable for subsis-


    tence agriculture, leading some farmers to uproot the bushes. Desperate


    plantation workers engaged in illegal timber trade, looked for jobs in


    Darjeeling town, or migrated to other places in India. Women in these


    households, however, harvested teas, hand rolled and dried them and


    sold them to local tea vendors. Sometime they also made treacherous


    trips (of 20 kilometres) to Darjeeling town to sell such dry contraband


    tea to local tea shops in order to get a better price than what was oﬀ ered


    by local middlemen. Th e picture below (Figure 11.2) shows how tea is


    processed at home. Th is tea is still designated ‘illegal’ by the Darjeeling


    Tea Association. ^(11)


    However, key transformations in the global tea market since the


    1990s—especially the growing demand for organic and Fair Trade cer-


    tiﬁ ed teas—brought non-plantation tea production in Darjeeling into


    the limelight. Darjeeling tea plantations were forced to adopt organic tea


    production in the 1990s and to give up the chemical-intensive agricul-


    ture that was popularized by the postcolonial Indian state in the 1960s.


