    **Inaugurating the DTMTC**


    It was a rare sunny morning in the midst of the monsoon. Attendees


    of the DTMTC’s inaugural ceremony milled around a rooftop patio,


    enjoying the unusually dry conditions. Among those assembled were


    several prominent GJM leaders, whom I had come to recognize from


    party rallies and meetings, as well as a slew of suited men I had never


    seen before. Th e dignitaries were seated in a circle of plastic chairs, while


    the potential students stood together on the far side of the patio, looking


    over the bustle of Darjeeling’s main bazaar. At the appointed hour, one


    of the suited men called for the attendees to come inside. ‘But not you,’


    he said to the future students, ‘we will call for you in a minute.’


    A minute turned into over two hours. With everyone seated around


    a small conference table, the DTMTC’s principal welcomed and intro-


    duced the honoured guests. Th ese included Gorkhas who had become'
