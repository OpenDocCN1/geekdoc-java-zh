    to and distinct from other exceptional spaces in colonial India. But


    there were other factors as well. My analysis focuses on the interplays of


    three key elements of the region’s history: colonial governance, planter


    capital, and labour. Th roughout the colonial era, relations between the


    British Indian government and Darjeeling’s tea industry were anything


    but stable—shaped, as they were, by periods of palpable collusion, ten-


    sion, and renegotiation. But they were formative of life in Darjeeling and


    what made the hills exceptional. Rethinking the Darjeeling exception,


    this chapter draws on nineteenth century colonial archives to interrogate


    the shifting arrangements of governance, capital, and labour that enabled


    the region to become a bastion of imperial capitalism, and a place that in


    mind, if not matter, has forever stood apart from the rest of India.


    Th ere is no doubt that Darjeeling’s exceptional status owes much to


    its geopolitical position, its Himalayan landscape with its cool, misty


    climes, and its fertile land. But in indulging these romantic framings, we


    should not underestimate the strategic practices through which British


    oﬃ cials and planters *made* Darjeeling diﬀ erent for their own personal


    gain and that of the British Empire more generally. Reading against the


    grain of prevailing historiography in the hills, here I explore Darjeeling’s


    exceptionality not as a ‘natural’ outcome of its Himalayan setting, but


    instead the endgame of a particular calculus of diﬀ erence and capital


    that forever transformed life in the hills.


    Darjeeling, in this regard, oﬀ ers an acute site through which to


    study broader paradigms of imperial capitalist expansion across the


    Indian subcontinent. Of particular interest are the strategies through


    which British actors—particularly planters—leveraged diﬀ erence (ethnic,


    geographic, administrative, and otherwise) to advance the interests of


    capital. At times, this was accomplished in concert with the colonial gov-


    ernment. In other instances, however, the aims of planter capital were


    clearly at odds with those of the British Empire. Keeping these registers


    distinct is therefore crucial if we are to understand the interplays of


    governance and capital that shaped this and other colonial spaces. It is


    likewise critically important if we are to venture a deeper reading of how


    labourers negotiated—and perhaps manipulated—Darjeeling’s excep-


    tional terrain of capital and diﬀ erence to their own ends.


    Darjeeling, in these dynamics, both epitomizes broader imperial pat-


    terns and demands analysis on its own terms. Here it is worth evaluating


    Darjeeling’s development in relation to—and contrast with—other


    ‘aboriginal’, ‘frontier’, ‘backward’ and/or tea-growing regions in India’s


    North-East and beyond. In terms of how these regions were governed,'
