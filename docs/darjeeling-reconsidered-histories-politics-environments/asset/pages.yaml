    Politically, the story was similar. Th e region’s geopolitical importance


    assumed a new valence as independent India looked to establish its place


    vis-à-vis its South Asian neighbours and its rival to the north, China. Th at


    Darjeeling served as a gateway to Nepal, East Pakistan (which became


    Bangladesh in 1971), Bhutan, Sikkim, Burma (Myanmar), and of course


    China, ensured it would remain the subject of governmental scrutiny and


    signiﬁ cant military presence. Th e Partition of 1947, and the demarcation


    of East Pakistan only redoubled the region’s geopolitical signiﬁ cance—


    namely by carving out the precarious sliver of territory known as the


    Siliguri Corridor, linking India’s ‘mainland’ to its ethnically divergent North-


    East. Darjeeling’s consequent place as both a frontier and crossroads of


    not only South Asia, but Asia writ large—and thus a national security


    hotspot for India—has directly and indirectly inﬂ uenced its political


    circumstances. Th e 1950 Indo-Nepalese Friendship Treaty established


    an open border between the two countries, but made it diﬃ cult for


    Nepali speakers to claim full belonging as Indians. Since independence,


    Darjeeling has remained territorially part of, and fully under the admin-


    istrative thumb of, the state of West Bengal. For much of this period,


    West Bengal maintained the longest running popularly elected commu-


    nist government in the world. Yet despite the Communist Party of India’s


    (Marxist) [CPI(M)] commitment to oppressed peoples, the regime


    accomplished little to bring the people of Darjeeling the autonomy and


    economic mobility they desired and deserved. Since the CPI(M) repre-


    sented the state government of West Bengal, political mobilizations for


    autonomy in Darjeeling have often been aligned with anti-communist


    forces, an apparent paradox given the class status of the plantation


    workers who made up signiﬁ cant proportions of the Nepali population.


    Swatahsiddha Sarkar and Babika Khawas explore these class questions


    in their contribution to this volume.


    Th e conditions of postcolonial life fuelled an array of political demands


    among Darjeeling’s people. By the 1970s, the various Nepali-speaking


    communities of the hills had congealed into a powerful multi-ethnic com-


    munity that increasingly went by the ethnonym ‘Gorkha’. Th roughout this


    period, people of Nepali heritage were served unnerving reminders of


    their precarious place in India. Bouts of ethnic cleansing targeting Nepali


    speakers in Mizoram in 1967, in Assam and Meghalaya in 1979, and in


    Manipur in 1980 violently emphasized the everyday discriminations that


    Nepali speakers faced throughout India. Th e ﬂ ight of tens of thousands


    of Nepali-speaking citizens from Bhutan in the early 1990s in response to


    alleged ethnic cleansing in the Buddhist kingdom that borders Darjeeling'
