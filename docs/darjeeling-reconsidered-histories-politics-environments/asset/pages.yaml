  md: '*Introduction*


    *Reconsidering Darjeeling*


    Sara Shneiderman and Townsend Middleton


    D


    arjeeling occupies a special place in the South Asian imaginary.


    With its Himalayan vistas, lush tea gardens, and brisk moun-


    tain air, Darjeeling became the consummate hill station for the


    British—a place somehow diﬀ erent from the rest of India in the plains


    below and an escape from the proverbial heat of the Empire. Th e romance


    with the ‘queen of the hills’ lives on, as thousands of Indian and foreign


    tourists ﬂ ock annually to the region to taste its world-renowned tea, soak


    up the colonial nostalgia, and glimpse mighty Mount Kanchenjunga.


    Darjeeling’s fame has now gone global, as its teas fetch top dollar on the


    world market and its legacy continues to fuel Hollywood and Bollywood


    fantasies. Th ese romantic images, however, tell only a part of Darjeeling’s story.


    Oﬀ ering new perspectives, this book aims to challenge—and


    ultimately, rethink—Darjeeling’s legendary status in the postcolonial


    Sara Shneiderman and Townsend Middleton, Introduction: Reconsidering Darjeeling.


    In: Darjeeling Reconsidered: Histories, Politics, Environments. Edited by Townsend


    Middleton and Sara Shneiderman, Oxford University Press (2018). © Oxford University


    Press. DOI: 10.1093/oso/9780199483556.003.0001'
