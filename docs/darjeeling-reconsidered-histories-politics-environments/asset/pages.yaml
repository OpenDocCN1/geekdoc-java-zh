    Darjeeling tea is world-renowned for its light body and muscatel


    taste. Expert tasters insist that the distinct sensory experience provided


    by the tea is connected to the geographical location in which it is grown.


    Tea bushes (and tea workers) are also well known across India as the


    landscape backdrops for Bollywood dance scenes. Within India, tea


    plantations are a space apart, both ideologically and materially. Th e


    mode of production on the tea plantations that blanket Darjeeling’s


    foothills has changed little over the last 150 years. Darjeeling tea can sell


    for hundreds of dollars per pound, but the workers who pluck, process,


    and package it on plantations make as little as Rs. 132.50 per day.


    Since the inception of the Darjeeling tea industry in the 1860s,


    Nepalis have dominated the ﬁ eld and factory labour force, but their abil-


    ity to advance beyond manual labour in the plantation labour hierarchy


    has remained severely limited. During the colonial period, plantations


