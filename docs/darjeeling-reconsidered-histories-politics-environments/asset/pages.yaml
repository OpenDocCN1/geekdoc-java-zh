    One needs to understand the competing gender ideologies in


    Darjeeling to understand the power of these shaming practices for


    women’s self-identiﬁ cation. Smallholder women tea farmers had a par-


    ticular investment in distinguishing themselves from women plantation


    workers, who were considered inferior in social status due to their wage


    work and lack of control over their leisure activities. Women and their


    families took pride in saying, ‘our daughters, sisters, and wives do not go


    for *hajira* (wage work).’ Th is gendered moral distinction had particular


    meaning imbued by past labour recruitment practices in the tea industry


    of Assam and North Bengal. As Jayeeta Sharma and Piya Chatterjee


    have both noted, sexualized and racial tropes accompanied plantation


    labour recruitment, which occurred mostly among tribal groups in east–


    central India. ^(16) In the postcolonial period, however, there has been a


    divergence in the identity politics of speciﬁ c tea producing communities


    in terms of how they situate themselves vis-à-vis these racialized and


    sexualized histories of plantation work. In Darjeeling, women plantation


    workers are also stigmatized as sexually immoral and alcoholic.


    Th ese speciﬁ c stereotypes have shaped a gendered moral terrain


    of critical distinctions where women who do not work on plantations


    but live nearby—like the smallholder women tea farmers discussed


    here—distinguish themselves from women plantation workers and


    their families, even though they likewise cultivate tea. Because among


    Nepali Hindu families the withdrawal of women from formal labour


