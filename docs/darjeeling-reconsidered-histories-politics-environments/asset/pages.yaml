    Th e ﬁ rst major Gorkha political party was a response to European


    mobilization for an autonomous Darjeeling dominated by the white set-


    tler community. Darjeeling’s European residents formed the Hillmen’s


    Association and asked that a separate administrative unit be carved


    out for the Nepali, Bhutia, and Lepcha areas of British India. ² Political


    mobilization in Darjeeling did not really pick up, however, until


    decolonization was imminent. At that point, the Hillmen’s Association,


    emphasizing the pre-Gorkha, tribal populations of Darjeeling, asked for


    total autonomy from independent India and ethnic electorates within


    Darjeeling to ensure continued European control. A rival movement,


    the All India Gorkha League (AIGL) founded in Darjeeling in 1943,


    grew out of union and communist movements among tea garden work-


    ers. Th e AIGL’s original demand was that Darjeeling become a part of


