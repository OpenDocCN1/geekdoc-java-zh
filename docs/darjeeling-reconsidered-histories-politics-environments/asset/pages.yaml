    Furthermore, his insistence that Darjeeling’s Nepali society was not


    internally class divided seems to be an overstated assessment. At least


    since the early twentieth century, if not earlier, traces of well-oﬀ Nepalis


    are available in Darjeeling’s history. ^(32) Some others have even traced aris-


    tocratic elements represented by the landholding class and the retired


    army and police oﬃ cials. ^(33) In fact, to accept at face value Pradhan’s


    emphasis on the absence of internal class diﬀ erentiation among the


    Nepalis of Darjeeling would be a debilitating move for further analysis—


    particularly if we wish to understand the emergence of palpable class


    diﬀ erences in the twentieth century Darjeeling hills.


    Th e history of Darjeeling suggests that theoretical claims and actual


    practice can be at great variance, as traced through the contradic-


    tions among the Nepalis whom Pradhan called sarvahara varga. Th e


    mechanisms of contradictions are not found only at the level of two


    extremes—the ruling class and the ruled—but also among the several ref-


    erents of Darjeeling’s diverse population, most importantly ethnicity and


    gender. Not all inner contradictions of the sarvahara varga of Darjeeling


    manifested in the form of exploitation of one group by another—except


    in the context of gender relations—but they were deﬁ nitely divided in


    shared spaces of the public domain. Th e socio-economic experiences of


    sipahis , *kanya* s */kaiya* s (traders) and even *sardars* (labour agents) diﬀ
    ered


    more widely than the experiences of wage earners, coolies (plantation


    labourers) or *bhariya* s (porters). Th eir interests cannot be reduced to


    their class positions. Although intra-class economic exploitation was not


    that prominent in the social relations of Darjeeling in those days, the


    growing social and cultural hiatus that historically deﬁ ned much of their


    intra-community relationships was inescapable. Likewise, women work-


    ers in the plantations shared an exploitative relation with the owners of


    the means of production who used their labour, as well as the labour of


    their male counterparts. However, for women, the exploitation doubled


    in the domestic sphere, where they were also exploited by men. ^(34)


