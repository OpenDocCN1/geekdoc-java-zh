    **Th e Right Kind of Man? Or the Right Kind of Training?**


    A central justiﬁ cation for the founding of the DTMTC was the con-


    tinued dominance of non-Gorkhas in the ranks of management in


    Darjeeling. Th at dominance was facilitated—indeed underwritten—by


    tea management training centres located outside Darjeeling. By the


    time the DTMTC opened, such centres were in operation at Assam


    Agricultural University, North Bengal University, and the National


    Institute of Tea Management. Th e founding of these centres is a relatively


    recent development in the history of the Indian tea industry. Before the


    mid-1990s, getting a job as a plantation manager was as much a matter


    of honing social connections and demonstrating a dexterity with middle


    class manners and speech as it was about mastering technical skills.


    Tea management was cloistered in a closed, guild-like circle of experts.


    It was what Julia Elyachar, drawing on the work of Michael Polanyi, calls


    tacit knowledge. ⁷ Training institutes promised to make tacit knowledge


    explicit—to package and distribute it to anyone who desired it regard-


    less of background, language, or ethnicity. Th is tension between tacit


    knowledge and technical training dates back to the days of British colo-


    nialism. Beginning in the early 1800s, tea plantations were established in


    Assam, the North-West Provinces, and later Darjeeling, the Dooars, and


    south India. ⁸ By the 1830s, books were circulating around Britain and


    colonial India that not only demystiﬁ ed the tea production process, from


    propagation to factory ﬁ nishing, but also attempted to lure European


    men to tea management, popularly called tea planting. Th ese texts reveal


    a history of the linked projects of capitalist accumulation, management,


    and colonial territorial sovereignty.


    In these texts, tea management is described as a means of social and


    economic mobility. An early account instructs:


    To those (and the class is numerous in England) who, possessing but a


    moderate sum of money, wish, nevertheless, to maintain the position in


    life to which they have been educated, to whom trade or the professions


    are obnoxious, who, having no military tastes or nautical tendencies, are


    still anxious to use that energy and enterprise which are said to belong to


    the British—to such, tea planting oﬀ ers peculiar inducements. ⁹


    ⁷ Elyachar (2012) .


    ⁸ See Sharma (2011) . See also Middleton, this volume, for historical detail


    and contrasts between Assam and Darjeeling.


    ⁹ McGowan (1860 : 33) .'
