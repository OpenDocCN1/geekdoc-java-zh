    Th e attainment of a clear national identity is an issue that is not likely


    to be resolved anytime soon. Th e formation of an Empowered Persons’


    Groups (EPG) to review the Indo-Nepalese Peace and Friendship Treaty


    of 1950 is perhaps more a concession extended to the leaders of Nepal


    when Prime Minister Narendra Modi ﬁ rst visited Nepal in 2014 rather


    than a realization of the changed situation between the two friendly


    countries. More often than not, it was the people of Nepal, especially


    under the Maoist leader Pushpa Kamal Dahal (alias Prachanda) who


    have called it an unequal treaty. Ghisingh, the leader of the GNLF that


    ruled Darjeeling for two decades from 1988, also condemned Articles VI


    and VII of the treaty, and so did some Gorkha organizations of Assam


    some decades ago. However, there has been no concerted and vociferous


    demand for its abrogation or amendment from any quarters in India.


    Most Nepalis of Darjeeling do not even know what the Indo-Nepalese


    Peace and Friendship Treaty contains, let alone what they might want


    to change in the treaty. Importantly, any change in it may signiﬁ cantly


    change the issues of their citizenship and nationality in the future. Th is


    is of course a wild guess for it is not likely that the EPG will even consult


    the stakeholders of which the Nepalis in Darjeeling and Nepalese of


    Indian origin in Nepal are equal claimants. Th ere are three possibilities:


    one, the treaty will be left as it is, in which case there will be no change in


