    Darjeeling. Th e ﬁ rst section contextualizes the criminalization of poli-


    tics in South Asia within which rowdies in Darjeeling might be located.


    Th e second section discusses the evolution of the rowdies from solitary,


    ‘community Robin Hood’ ﬁ gures to political musclemen, which reﬂ ects


    the criminalization of hill politics. Th e third section engages in an analy-


    sis of the vicious cycle of poverty and underdevelopment, which makes


    becoming rowdies a way to surpass economic hurdles. Th e conclusion


    uses the rowdies’ phenomenon to contextualize the mutually reinforcing


    issues of underdevelopment and a violent political culture.


    **Politics and Crime in South Asia**


    Th e relationship between politics and criminality is a historic one and


    remains pervasive across many parts of the world. In the South Asian


    context, the modern state has created political spaces and opportunities


    that allow the proliferation of a symbiotic relationship between crime


    and politics; the number of criminals present is thought to be on the


    rise even though the exact role or network of the criminals is poorly


    understood. ² Scandals and scams have become commonplace, exposed


    regularly by television stations that relentlessly stream ‘breaking news’ to


    the masses. Th is relationship between crime and politics has also become


    the subject of caricature, reproduced many times over in Bollywood


    ﬁ lms and television to the extent that there is now a general perception


    that no career politician is ‘clean’. ³


    Over the years, the nature and extent of the relationship between


    crime and politics has become more explicit and visible, especially


    through the participation of recognized criminals as electoral candidates.


    Th is phenomenon has been facilitated by political parties, institutions,


    and powerful individuals who have the power to aﬀ ect important policy


    changes. ⁴ Th e state (whether it be the central or the regional state) is the


    key agent in the distribution of public goods and services. Because of


