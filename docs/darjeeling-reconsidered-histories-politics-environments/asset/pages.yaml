    ﬁ gures in scholarly attention from both Indian and foreign scholars to the


    eight states that comprised the North-Eastern Council, ¹ as this does not


    include West Bengal. Likewise, within Himalayan Studies, Darjeeling


    has historically been understood as a key node of Nepali-speaking


    networks, but, with the prominent exception of its literary history, ² has


    remained largely beyond the scope of researchers focused on Nepal. Th e


    same may be said of Tibet and Tibetan Studies: several recent studies


    of Tibetan history, ³ death rituals, ⁴ and trade ⁵ have been based in whole


    or part on research conducted in Darjeeling, yet the sociopolitical reali-


    ties of the place itself are often obscured from view. Located accordingly,


    Darjeeling’s anomalous place in South Asia provides both a challenge


    and opportunity to reconsider the internal and external boundaries that


    have deﬁ ned this area of study. ⁶


    Darjeeling’s intellectual promise also extends beyond the subconti-


    nent. Most notably, Darjeeling ﬁ gures as a diﬀ erent kind of space for


    postcolonial critique. From this space so steeped in colonial lore, we


    gain critical insights into the historical and present workings of frontier


    capitalism; the less-understood dynamics of internal neocolonialism


    that followed decolonization in South Asia; ⁷ the ongoing turbulence


    of economic liberalization; ⁸ and the formative intersections of political


