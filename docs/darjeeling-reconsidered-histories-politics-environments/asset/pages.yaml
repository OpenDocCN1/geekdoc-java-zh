    Th e DTMTC’ s classes took place at Roy Villa, a stately turn-of-the-


    century building perched on a hillside overlooking a tea–covered valley.


    Th e most famous occupant of the building was Sister Nivedita, a dis-


    ciple of Swami Vivekananda, who died in 1911\. After Sister Nivedita’s


    death, the building was converted into a youth hostel. Classrooms were


    added to the original structure, complete with chalkboards and writing


    desks. Inside were several dormitory rooms in which students unable


    to commute back and forth from college in Darjeeling could stay for a


    modest fee. By 2008, however, Roy Villa had long sat unoccupied, and it


    was rumoured to be haunted by Sister Nivedita’s ghost. In the summer


    leading up to the DTMTC’s inauguration, the GJM commandeered the


    house from the state of West Bengal.


    In early October 2008, I sat in the back of a room, squeezed into


    a tiny wooden school desk and scribbling notes as a DTMTC teacher


    droned on about the diﬀ erent techniques of tea bush pruning. He read


    in English from photocopies, stating the intervals between LP (light


    prune), MP (medium prune), LS (light skiﬀ ), and DS (deep skiﬀ )


    prunes. Each of these diﬀ erent cuts was diﬀ erentiated by a particular—


    the number of centimetres from the top of the bush or mark left by the


    last prune. Like many DTMTC teachers, he read his lesson from the tat-


    tered texts and photocopies of circulars he had received from the TRA


    when he was an active assistant manager. Th e technical information in


    these documents was heavily geared to environmental conditions in the


    plains of the Dooars and the gentler foothills of Assam.


    When students interrupted the lectures to ask about how the tech-


    niques described in the TRA materials would apply to Darjeeling, the


    teachers did their best to provide an extemporaneous response. While


    the lectures I observed proceeded in English—the standard for both tea


    planting and the science of agronomy—the teachers’ attempts to tailor


    information to local conditions tended to be in Nepali. As students


    pressed (in Nepali) for more instruction, teachers would (switching to


    English) remind them that even though planting conditions varied, it


    was important to know the standards and the theory.'
