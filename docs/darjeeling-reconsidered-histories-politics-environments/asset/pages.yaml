    of postcolonial India. During the colonial period, subjecthood was char-


    acterized by indirect contact with the state. In the postcolonial period,


    both formal citizenship and substantive citizenship rights have been


    increasingly shaped by a larger discourse of cultural rights. ² Whereas


    liberal ideals of citizenship demand homogeneity, the global indigenous


    rights movement has articulated cultural rights premised on the notion


    of diﬀ erence. Th e Darjeeling case highlights these dynamics, as the


    ongoing demands for recognition and autonomy are essentially framed


    through an idiom of cultural exclusivity and diﬀ erence, which in vary-


    ing forms have come to constitute a perpetual quest to establish a clear


    sense of belonging to the nation.


    Discussing the early ethnic associations in hills, this chapter will


    try to provide an alternative history of identity-based demands in


    Darjeeling—one that augments, but also challenges, the standard gene-


    alogies of the Gorkhaland struggle. I begin by examining the historical


    processes through which early ethnopolitical identities were forged in


    the early years of the twentieth century. Drawing on archival materials


    and oral histories, I then chart the emergence and transformations of


    ethnic associations in mid-twentieth century. During this period, we


    see two markedly diﬀ erent trajectories of identity politics take shape.


    Th e  ﬁ rst concerned the representation and political demands of a


    collective *Hillmen/Gorkha* community. Th e second manifested in a


    range of ethnic associations representing individual ethnic groups like


    the Mangars, Gurungs, Limbus, Khas—and focused primarily on social


    welfare and cultural preservation of their respective constituents.


    Ethnic associations since the turn of the twentieth century largely


    reﬂ ected the concerns of Darjeeling’s civil society; these issues were later


    taken up by organizations and political parties making overtly political


    demands. Subsequent years would see the concerns emanating from


    political and civil domains converge, thus producing a hybrid nature of


    ethnic demands in the hills. We therefore need to look at the points of


    convergence between the civil and political domains. Th is helps us to


    note the complex trajectory of ethnic demands and analytically trace


    these struggles as more than mere survival strategies—they are, at once,


    a way to derive subsistence from the state and redeﬁ ne a people’s place


    and identity in India. ³


