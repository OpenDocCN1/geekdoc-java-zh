    loans could be obtained. When I began my research in 2004, Women’s


    Wing members were mostly involved in micro-credit and assisting the


    cooperative in ways that I detail later.


    Th e Women’s Wing devised thulo yojana in order to begin an


    organized business of their own that sold everything they produced


