    Union (HPSU), which advocated for rights and social improvement


    across the hills. ^(25) Th e HPSU’s journal *NeBuLa* (representing its


    Nepali, Bhutia, and Lepcha constituents) bolstered awareness of the


    collective identity and needs of Darjeeling’s Nepali-speaking major-


    ity. Th e All India Gorkha League (AIGL)—originally launched


    in Dehradun in 1923 and subsequently revived in Darjeeling in


    1943—worked within similarly pan-Nepali frames to advocate


    for Nepali speakers’ rights in India. Th ese and other organizations


    forged a thriving public sphere, which would lay the groundwork for


    a distinctive political and literary culture in the hills in the years to


    come. ^(26) Th e calls for autonomy, however, were met with few results,


    and socio-economic change was slow to come. As British rule drew to


    a close in the middle of the twentieth century, the people of Darjeeling


    found themselves in an increasingly diﬃ cult situation. Lacking clearly


    recognized citizenship rights in independent India, facing pernicious


    discrimination, and stuck on the lowest rungs of the local economy,


    frustrations mounted.


    **Postcolonial Darjeeling and the Gorkhaland Movement**


    India’s independence from British rule in 1947 brought signiﬁ cant


    changes to Darjeeling, but also troubling continuities. Darjeeling’s


    governmental and economic structure remained largely intact—as did


    its legend. Importantly though, as British oﬃ cials vacated their posts


    and British tea planters sold oﬀ their tea estates, it was not the local


    Nepali-speaking populations that ﬁ lled these vacancies, but Indian


    politicians and businessmen from the plains below. Th e postcolonial


    era paradoxically ushered in a new wave of colonial domination—an


    internal neocolonialism—that persists into the twenty-ﬁ rst century. ^(27)


    Economically, Darjeeling’s tea industry quickly came to be dominated


    by Bengali and Marwaris, as well as large-scale corporate conglomerates


    based elsewhere in India.


