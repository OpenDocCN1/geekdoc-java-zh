    was reluctant to label the Nepali nationality question in India as an eth-


    nic issue. He considered the concept of an ‘ethnic group’ to be closer to


    the Nepali term *janajati* , which refers to diﬀ erent community identities


    like Kirat, Tamang, Newar, Sunuwar, and so on. Th e appropriation of


    these diﬀ erent janajati, or ethnic groups, into a Nepali national identity


    formation in Darjeeling, was made on a cultural and linguistic plane


    rather than on a political one. Pradhan begins his analysis by emphasiz-


    ing that Nepali nationalism in Nepal grew out of a pluralist social fabric,


    whereas by contrast, syncretic unity served as the basis of forging the


    Nepali nation in Darjeeling. Nation formation in Nepal has undergone a


    process that he called *Kamila Prakriya* (a process in which people forage


    in a group much like ants, or *kamila* ) while *Mauri Prakriya* (swarming


    of bees, or *mauri* ) was the actual process that explains Nepali national


    identity formation in Darjeeling. ⁹


    By emphasizing the *Mauri Prakriya* model of identity formation in


    Darjeeling, it may seem that Pradhan has hinted at the diasporic foun-


    dation of the Nepali nation in India. Michael Hutt has also labelled


    Pradhan a historian, who contributed an understanding of Nepali


    ethnicity in the so-called Nepali diaspora. ^(10) However, it needs to be


    qualiﬁ ed as to whether Pradhan himself considered the Nepali nation


    in India a diasporic nation. Th is is indeed a signiﬁ cant issue about which


    others have commented at length. ^(11) Pradhan’s position was not very


    diﬀ erent from others who denied the diasporic leaning for the Indian–


    Nepalis, although it was he who perhaps, for the ﬁ rst time, made a


    critical estimation of what such labelling meant for the Indian–Nepalis


    in the essay titled *Agam Singh Giriko Kavitama Jatiya Bhavana* . ^(12) In that


    essay, Pradhan criticizes not only the eﬀ orts of the Indian national lead-


    ers to equate the Indian–Nepalis with citizens of Nepal, but also those


    Nepali leaders who thought that a reference to Nepal would be worth-


