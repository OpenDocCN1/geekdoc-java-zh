    Th e British relied on informal labour recruiters known as *sardar* s


    to bring labour to Darjeeling. Th is was largely in keeping with labour


    recruitment patterns throughout colonial India, wherein informal


    recruiters (sardars) were integral to various industries, plantation and


    otherwise. Yet Darjeeling’s *sardari* system took distinct forms, par-


    ticularly in relation to questions of transnational migration, legality, and


    regulation (a point I develop later). Similar to sardars operating else-


    where on the subcontinent, these native recruiters mobilized their ethnic


    ties, local knowledge, and cultural familiarity to spread the word of a bet-


    ter life and therein lure labour. ^(26) To this day, one can still hear folksongs


    about the gold growing on the tea bushes of Mugalan (the Nepali term


    for India at the time). ^(27) Generally speaking, sardars organized bands of


    coolies, ushering them across the border and to the particular estates


    where labour was needed. Th eir role entailed more than just delivering


    labour to market, however. Th e sardars came to occupy a key position


    in the plantation system. Working closely with planters, these native


    agents both supplied and managed labour. ^(28) For coolies, sardars served


    as liaisons to the planters and as community leaders within the gardens,


    brokering the workers’ material and cultural needs. As intermediaries


    between labour and management, sardars were lynchpins of the entire


    system.


    Th e sardari system remains a largely untold chapter of Darjeeling’s


    history. Sardars were not only responsible for the tens of thousands


    of labourers who made their way to Darjeeling during the nine-


    teenth century, they also helped shape a nascent cultural landscape.


    Recognizing the value of a good sardar, planters deputized favourite


    sardars to issue housing and small parcels of land to labourers within


    their estates. Soon small village communities began developing around


    sardars, who acted as the de facto headman of these coolie villages.


