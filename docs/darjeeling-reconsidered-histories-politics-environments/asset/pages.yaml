    tourism—take over the global imagination of the area? And how does


    commodiﬁ cation condition the politics of belonging and autonomy that


    also takes Darjeeling as its stage?


    Pursuing these questions, the remainder of this chapter explores the


    colonial origins and historical persistence of the ‘tourist gaze’ in produc-


    ing Darjeeling—even in the context of violent political contestation.


    Th e chapter is primarily based on textual analysis of a broad range of


    colonial and contemporary documents, supplemented with a month of


    ﬁ eldwork in Darjeeling during state elections in 2011\. On this basis, it


    investigates the picturesque sensibility and classed, relational character


    of the tourist gaze, and provides circumstantial evidence as to the conse-


    quences of this gaze for the politics of belonging.


    **Darjeeling in the Tourist Gaze**


    Darjeeling was—globally speaking—an early tourist destination. John


    Urry’s seminal book *Th e Tourist Gaze* points to the year 1840 as a


    watershed in the development of modern tourism. Counting, among


    other things, the invention of the camera, the organization of the ﬁ rst


    packaged holiday, and the introduction of the ﬁ rst national railway


    table, Urry argues that: ‘Th is is the moment when the ‘‘tourist gaze’’,


    that peculiar combining together of the means of collective travel, the


    desire for travel and the techniques of photographic reproduction,


    becomes a core component of western modernity.’ ⁵ If this was indeed


    ‘western modernity’, it did not exclude the colonies. Darjeeling was, in


    fact, at the forefront of modern tourism development at the time. Th e


    Darjeeling Himalayan Railway that was to become the quintessential


    means of accessing Darjeeling in the late nineteenth and early twentieth


    century was opened in 1881, post-dating the ﬁ rst European mountain


    railway (the Vitznau–Rigi in Switzerland) by only a decade; ⁶ already


    in the 1870s Darjeeling became the object of Samuel Bourne’s famed


    photographs, deeply inscribing the hill station in the visual archive of


    the British Empire; ⁷ and, like various early tourist destinations across


    nineteenth century Europe, Darjeeling quickly inspired a large body of


    guidebooks and other ‘guiding’ material.


