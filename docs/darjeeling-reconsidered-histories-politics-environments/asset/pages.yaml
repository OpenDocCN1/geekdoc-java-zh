    **Tribalism and the Re-emergence of Ethnic Associations**


    Formation, dissolution, and re-emergence of ethnic associations charac-


    terize the history of ethno-politics in Darjeeling. Th ese transformations


    suggest a dynamic articulation of identity claims, periodically framed to


    address issues of belonging and becoming in particular political contexts


    and eras. Tracking the trajectories of ethnic associations through time,


    we see that the changed political scenario following India’s Independence


    both augmented and altered the interwoven processes of ethnic for-


    mation and mobilization. In this regard, the recent demands for ST


    recognition have to be located within broader logics of postcolonial


    governmentality. ^(36)


    Insofar as the residual eﬀ ects of colonial thought permeated post-


    colonial governance, they, in turn, inﬂ uenced the mode and character


    of struggles raised by ethnic groups. As per the various protective dis-


    crimination policies enshrined in the Indian constitution, the oﬃ cial


    recognition of ascriptive social identities through aﬃ rmative action


    instituted a space to claim rights and beneﬁ ts on the basis of cul-


    tural identities. ^(37) Four communities in Darjeeling (Bhutia, Lepchas,


    Tibetans, and Yolmos) were originally listed as STs in the 1950s. In the


    1990s, the government’s decision to implement the recommendations of


    Mandal Commission signiﬁ cantly aﬀ ected ethnopolitics in Darjeeling. ^(38)


    Regrouping after the turbulence and failure of the Gorkhaland agitation


    of the 1980s, many ethnic groups revived their old ethnic associations,


