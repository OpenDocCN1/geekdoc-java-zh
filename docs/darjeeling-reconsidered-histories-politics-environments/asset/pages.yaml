    natives of the plains to the charms of rural scenery’ and laments how


    the entourage is invariably ‘passing by or stopping short of scenes of


    the greatest natural beauty’. ^(31) Even in an oﬃ cial governmental report


    predating Darjeeling’s annexation, we thus see the contours of a *classed,*


    *scenery-oriented, and relational tourist gaze* that soon became a quintes-


    sential way of seeing Darjeeling.


    As illustrated in the above quote, taken from the popular London-


    produced guide *Picturesque India* , this ‘tour’ structure is repeated over


    and over again in subsequent guides to Darjeeling. It goes without


    question that Darjeeling is a place one reaches from Calcutta. After the


    opening of the Darjeeling Himalayan Railway, histories and guidebooks


    for Darjeeling ubiquitously open with a train journey from Calcutta to


    Darjeeling. Th e very ﬁ rst lines of *Newman’s Guide* to Darjeeling state


    unambiguously that ‘the traveller to Darjeeling, whether in search of


    health or pleasure, leave the Sealdah terminus of the Eastern Bengal


    State Railway at about 4 p.m.’. ^(32) Similarly, E.C. Dozey’s *A Concise*


    *History of the Darjeeling District* commences with a description of the


    advances in accessibility of Darjeeling from Calcutta cutting down travel


    time from ‘the best part of a fortnight’ to ‘nineteen short hours’ followed


    by a lengthy review of ‘Th e Journey’. ^(33)


    Th rough such accounts, Darjeeling is repeatedly constituted through


    its accessibility from and relation to Calcutta and—via Calcutta—the


    wider world. Rather than constituting a place in its own right, Darjeeling


    is framed in terms of accessibility from the outside. While this might be


    explained away as a functional consequence of the audience the guid-


