    Augé, I propose that distanced, mediated senses of place are not neces-


    sarily to be seen as *false* familiarity.


    Firstly, the falseness that Augé emphasizes relies on a distinction


    between distanced observing of places and what he calls ‘anthropological


    place’—the proximate experience of places that arise from being there.


    Informed by the Heideggerian notion of ‘dwelling’, this latter sense of


    place is eloquently elaborated in the phenomenological literature, but


    its clear distinction from a ‘false’ sense of place seems problematic,


    especially when dealing with a globally branded tourist destination.


    Studies of tourism have, in fact, documented signiﬁ cant eﬀ ects of prior,


    mediated senses of place on the actual experience of places visited. One


    study of tourists in Queensland Australia, for example, documents that


    ‘actual experience of place [did] not signiﬁ cantly aﬀ ect’ tourists’ already


    established sense of that place mediated by the tourist industry. ^(15) While


    experiencing a place as a tourist obviously diﬀ ers from long-term dwell-


    ing, the notion of a fully unmediated experience of place seems unlikely.


    Secondly, as the present chapter is ultimately concerned with col-


    lective political struggles over place, I argue that even ‘false’ senses of


    place can be politically signiﬁ cant. As political struggles such as the


    Gorkhaland Movement operate beyond the sphere of personal experi-


    ence, they necessarily involve generalized representations or ways of


    seeing. Here, widely shared senses of place become all the more impor-


    tant *despite* their potential dissonances with proximate experience of


    the place. In fact, globalized, ‘tourist’ senses of place might trump local


    experiences in creating a sphere for politics of place that is detached to a


    certain extent from the locality. As I describe in detail below, the history


    of Darjeeling illustrates this.


