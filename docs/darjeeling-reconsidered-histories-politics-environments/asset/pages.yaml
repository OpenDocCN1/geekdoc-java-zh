  md: '*Introduction*


    7


    Th e British ‘discovery’ of Darjeeling has become standard fare in


    the historiography of the region. But it is misguided to suggest that


    Darjeeling’s history began with the advent of colonial rule. Prior to


    British arrival, the Darjeeling hills (and Kalimpong in particular) had


    been major points in trans-Himalayan trade networks, with goods and


    traders from Nepal, Sikkim, Tibet, Bhutan, and further aﬁ eld criss-


    crossing the region and, at times, making it home. ^(14) Sovereignty during


    the pre-colonial period was contested and ﬂ uid. As historian Catherine


    Warner has noted, local populations paid tribute to, and strategically


    allied themselves with, diﬀ erent powers at diﬀ erent times. ^(15) British rule


    eﬀ ectively reterritorialized the region, however. Th e borders separating


    British India and Nepal, Sikkim, and Bhutan hardened as new sovereign


    claims were laid upon the region and its people. ^(16) As the British and


    others made claims upon the region’s ﬂ uid populations, the question


    of who exactly was living in Darjeeling at the time became a point of


    concern and longstanding uncertainty. Such ambiguities continue to


    this day. Early colonial accounts claim that the region was sparsely


    inhabited by the indigenous Lepcha, Limbu, and Bhutia. Th ese colo-


    nial demographics are, at best, incomplete. Given the crosscurrents of


    trade, migration, and sovereignty that deﬁ ned the region throughout the


    pre-colonial period, the local population was likely more heterogeneous


    and numerous than the British accounted for. Many local writers and


    historians have argued for the autochthony of all of the Nepali-speaking


    peoples of Darjeeling. Th ese revisionist histories have been closely asso-


    ciated with diﬀ erent ethnic groups’ claims to rights and belonging in


    India, as detailed in Nilamber Chhetri’s contribution to this volume.


    Despite the challenges of identifying conclusive evidence, such claims


    should be understood in context as important assertions of belonging.


    While it is impossible to verify the precise dates and routes of migra-


    tion for diﬀ erent groups, what remains clear is that British colonial rule


    triggered signiﬁ cant migration into the area, and, with it, long-lasting


    demographic transformations.


    Tea proved formative. Experiments in the 1840s demonstrated that


    tea thrived in the hills of Darjeeling. By the 1850s, European investors


    were acquiring and converting massive tracts of land into the tea gardens


    that have become iconic of Darjeeling today. To meet the signiﬁ cant


