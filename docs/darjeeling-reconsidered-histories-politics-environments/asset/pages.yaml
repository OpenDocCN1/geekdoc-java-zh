    53


    agitations, the Gorkha Janamukti Morcha deserves credit for reinstat-


    ing the primacy of the Gorkhas’ labour in the history of the hills. At


    the end of the day, it was *their* labour, *their* hands, and *their* bodies that


    made Darjeeling. Anthropologist Sarah Besky has cogently shown how


    the Gorkhas’ aﬀ ective labour has fuelled powerful claims to belonging


    and territory—manifest most viscerally in the demands for a separate


    state of Gorkhaland. ^(70) Posing a timely challenge to prevailing histories


    of the hills, these subaltern voices oﬀ er a promising way of re-engaging


    Darjeeling on its own terms.


    Any such histories from below, however, can ill-aﬀ ord to eschew the


    broader capitalist contexts within which labour was brought to market


    and made to produce value for a particular class of colonial elites. A sub-


    altern history of plantation labour, in this regard, begs a corresponding


    critique of planter capital. While the latter has clearly been my project


    in this essay, I venture this analysis in the hope that it too may help clear


    a space for the histories—and voices—of the Gorkha labourers who


    have been so conveniently elided from Darjeeling’s history. In the oﬃ ng


    then is a historiographic synthesis of political import. Combining the


    attentions of subaltern history and more orthodox Marxian approaches,


    we may ask anew: What were the forces that made Darjeeling? In what


    way? To whose long-term advantage? And to what enduring eﬀ ects and


    aﬀ ects? To venture these questions is to forge a critical understanding


    of how the legacy of the exception continues to condition the possibili-


    ties and impossibilities of life and politics in the hills. Taken up in this


    spirit, revisiting the history of governance, planter capital, and labour


    in the nineteenth century may be an important step for rethinking the


    prospects of meaningful autonomy in the years ahead.


