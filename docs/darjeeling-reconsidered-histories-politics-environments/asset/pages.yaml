    All said and done, the reference to class in Pradhan’s interpretation of


    Nepali national identity formation may be considered as a statement of


    methodology and a programme of research. Th is seems to be a justiﬁ ed


    statement when we weigh up his contribution in terms of concepts, the-


    oretical presumptions, and propositions. We argue that throughout his


    writings on the issue, Pradhan elaborates class in tandem with its ‘nomi-


    nalist’ and ‘realist’ versions. ^(39) He begins with the ‘nominalist’ version
    of


    class and attempts to identify diﬀ erent classes in correspondence to a set


    of facts but not to any speciﬁ c phenomenon of reality. Class in this sense


    became useful to him as a methodological tool for classifying diﬀ erent


    categories of the population according to certain criteria, thereby giving


    his historical account theoretical precision. Such a nominalist view of


    class even led him to ignore the historicity of actually existing intra-class


    diﬀ erentiations in hill society. While situating the ‘realist’ conception


    of class in the history of Nepali national identity formation, he viewed


    class as a historical phenomenon that arises through social relationships,


    and not merely as a structure or a statistical aggregate. Enactment of


    such relationships involved experiences of living, acting, and suﬀ ering.


    Th eoretical discussions of national identity formation, in the ﬁ nal analy-


    sis, cannot remain purely diachronic and experiential. Nor can national


    identity formation can be solely attributable to the structural dynamics


    of early industrial capitalism. Pradhan’s signiﬁ cance in this regard lies


    in his historical journey with the nominalist and realist notions of class,


    which have both illuminated and mystiﬁ ed his position on Nepali nation


    formation in Darjeeling.


