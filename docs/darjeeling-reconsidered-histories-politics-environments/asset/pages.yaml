    **Social Class, Power, and Mobility Closure: Interlocking**


    **of Class and Ethnicity**


    Surprisingly there is much similarity in the theoretical position Pradhan


    held and the position maintained by social class analysts. ^(25) On many


    counts Pradhan’s analysis echoes Marshall’s, who holds the view that


    the objectivity of class consists not of the criteria that distinguish it, but


    of the social relations that it produces, with its subjectivity being the


    basic need for mutually conscious recognition. ^(26) In this sense, Pradhan’s


    emphasis on the class basis of the Nepali nation fundamentally implies


    the importance of power relations. We argue that much like Parkin, who


    developed a neo-Weberian interpretation of class, ^(27) Pradhan seems to


    reason that class relations arise out of market capacities, and that class


    relations were in fact maintained by a process that Parkin calls ‘mobility


    closure’. Reading between the lines in Pradhan’s work leads us to claim


    that his arguments could be framed in line with the neo-Weberian


    formulations of class. Pradhan’s insistence that community consciousness—


    rather than class consciousness—found a stronghold in the social his-


    tory of Darjeeling implies a theoretical proposition. We explore this


    theoretical position by arguing that the greater the mobility closure


    (that is the less individual mobility or fewer chances for the individual to


    acquire the opportunities available in the local resource niche) between


    groups with diﬀ erent market capacities, the more readily social class will


    assume a communitarian cleavage. Hutt has also noted such courses of


    mobility closure in the economic domain of Darjeeling. ^(28) Ultimately,


    mobility restrictions make class-community cohesion more probable. It


    is worth noting that in Pradhan’s analysis, the class-community nexus of


    the Indian Nepalis that occurred through a societal process of mobility


