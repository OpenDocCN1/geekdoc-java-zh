    **Colonial Settlement and Lepcha Nature**


    In 1830, Captain J.D. Herbert, dispatched from Calcutta to Sikkim to


    assess a remote Himalayan hamlet’s potential as a colonial hill station


    for the East India Company, wrote appreciatively of the local guides


    on whom he depended to reach his mountain destination. His guides


    were the Rong, a people whose preferred name originated in the phrase


    *mutanchi rong kup rum kup* , children of snowy peaks, or the Lepcha. Th e


    mightiest of those peaks was Kanchenjunga (a transliteration of the


    Tibetan name, Kangs–chen–mdzod–lnga), also known as Kongchen


    Kongchlo (big stone), whose snows gave birth to the Rong ancestors,


    Fudongthing and Nazong Nyu. ¹ Th e name Lepcha, in the colonial


    archive, was originally a pejorative term bestowed by their neighbours


    from Nepal. Unconcerned with its negative connotations, Herbert


    lauded Lepchas as a unique mountain people, ‘a totally diﬀ erent race,


    morally and physically, from the people in the plains … they allow them-


    selves to be originally the same people with the Bhoteeas or inhabitants


    of Tibet … in every thing the reverse of the Hindoostanee.’ ² In his view,


