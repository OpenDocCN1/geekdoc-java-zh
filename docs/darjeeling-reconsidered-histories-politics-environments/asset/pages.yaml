    **A Critique of Pradhan’s Propositions**


    Taken together, the above propositions form the crux of Pradhan’s thesis


    that mark a signiﬁ cant reworking of the problematic of class formation


    among Nepalis in India. However, Pradhan’s texts provide a less system-


    atic alternative theory of class formation than a set of admonitions whose


    value is largely determined by their place in a speciﬁ c polemic. Pradhan


    urges us to avoid sterile formalisms and to be ever-aware that there could


    be contradictions between classes but not necessarily amongst members


    of the same class. In fact, Pradhan implicitly assumes the essential cor-


    rectness of the theory of class that he seems to be denying. Pradhan’s


    conceptual categories are so formed upon his polemical opponent, that


    his attempt to transcend classical Marxism is far from satisfactory. He is


    unhesitant in using the term sarvahara varga (proletariat) rather loosely


    to imply the plantation (tea and cinchona) workers, agriculturalists,


    labourers, and even the sipahis (corps). Far from being a concept, ‘prole-


    tariat’ in Pradhan’s treatment appears more as a denotative term. Th at is


    why a concern for the proletariat as an historic force, or for that matter,


    the stages in the development of the proletariat into a class—cardinal


    questions for Marxist class analysis—are diﬃ cult to trace in Pradhan’s


    otherwise excellent account. In fact, Pradhan’s analysis of the class ques-


    tion of Nepali national identity in Darjeeling is not restricted to the


    quintessential Marxian notion of class. Treating the proletariat more as


    a denotative term rather than as the historic role player in the Marxian


    sense, Pradhan actually hints at the inﬂ ections of the term ‘proletariat’ in


    the non-industrial settings.'
