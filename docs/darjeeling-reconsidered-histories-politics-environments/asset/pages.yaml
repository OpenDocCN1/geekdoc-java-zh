    52


    **Lessons for the Present**


    Th e nineteenth century history of governance, planter capital, and labour


    holds important lessons for understanding Darjeeling today. First, it


    challenges us to recognize what is unique about Darjeeling, but to always


    also appreciate its exceptionality in context. Th e production of Darjeeling


    as an exceptional space was part and parcel of a broader colonial pattern


    of exception. Th e comparison of Darjeeling with India’s North-East, in


    this regard, reveals important similarities, but also notable diﬀ erences


    that can help us modulate between various states of exception and their


    lingering eﬀ ects on the present. Th e continuities with other hill stations


    and other tea-growing regions such as Assam are critically instructive.


    Yet the comparison with Assam—especially on the registers of labour


    and regulation—also reveals the actors and circumstances that made


    Darjeeling strategically diﬀ erent from other exceptional spaces. As we


    have seen, diﬀ erence and capital found a special and precarious balance


    in the hills. By the century’s end, Darjeeling’s planters were staving oﬀ


    a litany of competing interests, none more formidable than the British


    Indian government and the army. Th e encroachment of recruiters and


    regulation into their hallowed territory, and the government’s increased


    unwillingness to acquiesce to the planters’ privileged demands, made it


    clear: Darjeeling was not—and had never been—‘above’ the needs of


    the Empire and the hard realities of imperialism. Despite narratives tell-


    ing otherwise, Darjeeling was, from the start, inextricably bound up in


    broader networks of capital and colonial domination. Amid this milieu,


    its diﬀ erence became both its signature and operative advantage.


    Second, and along similar lines: the nineteenth century history of gov-


    ernance, capital, and labour begs a more critical reading of Darjeeling’s


    discovery, development, and distinction. Undergirding the romance


    with this ‘queen of the hills’ has always been a deeper set of material and


    political forces at work. Re-examining these material histories provides a


    way to think beyond the ‘natural’ explanations of what makes Darjeeling


    so special and to thereby raise a more grounded set of questions about


    what—and *who* —made Darjeeling diﬀ erent. Th is is, of course, a ques-


    tion with many answers.


    Of late, the question of *who* made Darjeeling diﬀ erent has become


    both an historiographic and political issue. And here we arrive at a third


    and ﬁ nal set of lessons that the nineteenth century history of Darjeeling


    puts to the present. Th is concerns the subaltern histories of the Gorkhas


    themselves. Whatever may be said of the most recent Gorkhaland'
