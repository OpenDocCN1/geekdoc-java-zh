    **Th e Evolution of Rowdies**


    Sunil sat across from me in a cramped tea shop near Kalimpong motor


    stand. He was soft-spoken, friendly, and the long yellow tika on his


    forehead was telling of his religious disposition. ^(28) We talked about his


    busy schedule, which comprised almost entirely of community activities.


    He had to help someone get a school admission, take someone else to


    the hospital and then later attend a political meeting organized by one


    of the newer parties of Kalimpong. Sunil was enthusiastic about the


    upcoming elections. He had been approached by most of the leading


    parties to canvass for them in his locality, Panchdaara, one of the poorest


    areas of urban Kalimpong. I asked him which party he would eventually


    support and he replied, ‘whichever party has the money’. He laughed it


    oﬀ as a joke and said that he was organizing a meeting in his locality


    the next day to gain a consensus on which party they should collectively


    support. Sunil, the social worker was also known in his circle of friends


    as ‘number one rowdies’ of the 1986 agitation; a past he claims is well


    behind him.


    Th e formation of the DGHC and the GTA did not drastically alter


    the political and socio-economic status of the Darjeeling hills. Sunil


    felt that nothing had changed for people like him. Politicians came and


    went; and he and his people still lived in poverty and squalor, as had


    generations before him. And yet, ironically, he felt that the elections


    were a chance to bring about some change in his neighbourhood. While


    community development might still be a distant goal, political interrup-


    tions like the Gorkhaland Movement in 1986, 2007–8, and the 2016


    state elections provided small niches in which Sunil and many more


    like him had ﬁ nally found some prospect of deriving monetary beneﬁ t


    from parties, or beneﬁ ting indirectly through party support in gaining


    employment, contracts and so on. Not surprisingly then, elections were


    the busiest time for rowdies, a time for them to prove their mettle and


    gain favours of their political overlords, who were at their humble, pliant,


    and community-spirited best.


    Political parties and politicians do not necessarily engage with the


    electorate on broader ideological issues, a characteristic feature of South


    Asian politics where vote banks are built on narrow claims of caste, reli-


    gion, region, or on the vague promise of development. Endemic poverty


    and government dysfunction can play a deterministic role in shaping


