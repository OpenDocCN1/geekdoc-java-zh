    Th is collection of essays provokes, for me, a number of questions.


    Reading the colonial critiques within this volume, one must ask: Was


    everything about colonialism bad for Darjeeling? After all, aren’t most


    of the roads and bridges on which we travel even today built by them?


    Aren’t the best schools and hospitals of Darjeeling all established by the


    colonial rulers? Are the tea gardens, which are an important focus of this


    book, not established by them as well? At times I wonder what we added


    to Darjeeling after we became independent in 1947 except congestion of


    roads, scarcity of water, ﬁ lth, unplanned urban growth and the like? Have


    we done one thing good for Darjeeling after Independence? So when


    *Darjeeling Reconsidered* takes the position it has taken about colonial rule


    I wonder if the authors have been fair to the colonial rulers. It is always


    easy to take on those who are not around to defend themselves. Had the


    contributors been historians of a ‘nationalist’—read Hindutva—brand,


    I would not be surprised. Yet I am indeed a little surprised that even this


    new generation of scholars, who did not see and experience the birth


    pangs of an independent India, is in a way more critical of the colonial


    than perhaps those who lived in colonial times.


    Relatedly, the book raises important questions about the continuity


