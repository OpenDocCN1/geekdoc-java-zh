    Searching for Gorkhaland: GJM and the Second Movement


    When I began doctoral ﬁ eldwork in Darjeeling in 2011, local politics


    of belonging had gone through a range of transformations. Following a


    long period of semi-autocratic reign by Ghisingh under the auspices of


    the Darjeeling Gorkha Hill Council (DGHC), culminating in attempts


    at establishing Darjeeling as a tribal area according to the Sixth Schedule


    of the Indian Constitution, the Gorkhaland Movement was revived in


    2007 under the renewed leadership of Bimal Gurung and his GJM. ^(62)


    Once again, the hills were shut down by strikes in an intense, sometimes


    violent, agitation. On 21 May 2010, Madan Tamang—whose memorial


    anniversary introduced this chapter—was killed in public in Darjeeling


    town. In February 2011, two GJM supporters were killed by the police


    further adding to the tension in the hills as well as to the demand for


    Gorkhaland. With a research imagination shaped by earlier ﬁ eldwork


    on the movement for a Limbuwan state on the other side of the border


    in Nepal, as well as readings on the politics of belonging across South


    Asia, I was searching for discursive and practical outlines of what this


    Gorkhaland–to–be looked like. ‘What is Gorkhaland’, I kept asking


    myself. To my frustration, answers were hard to come by.


    It all seemed quite paradoxical. I had arrived just around the time


    of what was to be a historic state election—an election where Mamata


    Bannerjee’s Trinamool Congress ended 34 consecutive years of rule by the


    Communist Party of India-led Left Front, and where the GJM swept all


    three hill constituencies in Darjeeling. At this time, the renewed demand


    for a Gorkhaland state that propelled Gurung and the GJM into power


    was forcefully written and performed across Darjeeling’s public space.


