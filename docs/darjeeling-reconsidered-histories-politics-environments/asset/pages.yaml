    **Th e Exception Reconsidered**


    Tracking Darjeeling’s exceptionality through the colonial era shows


    that relations between governance and capital were formative, but not


    stable. A brief review of the administrative arrangements in Darjeeling


    illustrates broader shifts in the rationales of colonial rule throughout


    the subcontinent. As various historians have demonstrated, the Revolt


    of 1857/8 marked a pivotal turn in the structures and technologies of


    British rule in India. ^(62) With the British government assuming control


    from the East India Company, strengthening and standardizing the


    rule of law throughout the colony became a top priority. Th e ﬁ rst step


    was to take stock of what rules and regulations were actually in force


    in the various corners of British territory. Darjeeling’s adhocracy soon


    became a source of concern. Campbell’s laissez faire administration


    had enabled impressive transformations to the hills, so much so that by


    1864 Darjeeling had been crowned the summer capital of the Bengal


    Presidency. But the arbitrary terms by which the hills were—and were


    not—being governed, ran counter to the British Raj’s imperatives of


    standardization. Up until the 1870s, Darjeeling was variously governed


    as an ‘Non-Regulated Area’, marking the hills as a place removed from


    the standard operating procedures of colonial law. ^(63) Darjeeling was


    not alone in this regard. Th e territorial holdings of British India were a


