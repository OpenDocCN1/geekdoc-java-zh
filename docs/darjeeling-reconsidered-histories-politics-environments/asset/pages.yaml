    **Discussion and Comments on Geographies of Exclusion**


    Th e chapter highlights the resource challenges, as well as the social


    subjectivities, found within Darjeeling’s diverse hydrological landscape.


    Th e subjectivities touched upon are inﬂ uenced by varying degrees of


    connection to municipal waters, as well as the aﬃ nities that are produced


    through belonging to a samaj. In Darjeeling, the subjectivities associated


    with water arise in parallel to what some call ‘geographies of exclusion’.


    Sibley’s approach to geographies of exclusion contains the idea that


    space is always contested and that ‘relatively trivial conﬂ icts can provide


    clues about power relations and the role of space in social control’. ^(28) Put


    in other words, attention to geographies of exclusion helps illuminate


    how inequalities and identity-based conﬂ icts are spread across spaces


    and places. While postcolonial water management schemas make clear


    how such geographies of exclusion operate in Darjeeling, we suggest


    that the samaj simultaneously create what we might call ‘geographies


    of inclusion’, especially within their locational clusters. Neither of these


    domains is pure, of course, so in saying this we do not mean to insti-


    tute a binary that demonizes the municipality or overly sanctiﬁ es the


    work of the samaj. Rather, the two are on a relational continuum. Th e


