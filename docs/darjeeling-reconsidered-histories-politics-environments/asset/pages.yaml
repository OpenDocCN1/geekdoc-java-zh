    October 2007 and May 2008—Th e Puriﬁ cation


    of Gorkhaland


    Uncommonly, on 7 October 2007, the motor stand at Darjeeling’s main


    bazaar was not crowded with jeeps and buses manoeuvring the parking


    spaces, while trying to avoid the mass of people crossing between them.


    Instead, more than 20,000 persons were loudly cheering on Gurung, the


    man who dared to challenge the so-called ‘king of the hills’ (Ghisingh),


    and to announce a new agitation for the long-standing demand of


    Gorkhaland.


    Bimal Gurung, dressed in green, with a traditional Nepali *topi*


    on his head and adorned in *khata*s*,* was by that time well-known


    as Ghisingh’s former ‘muscle man’, inciting fear amongst the town’s


    population. To convince the audience of his dissociation from Ghisingh,


    Gurung proclaimed a ‘new dawn’ in Darjeeling and presented himself as


    a trustworthy, honest, and generous leader—in contradistinction to the


    ‘selﬁ sh’ and ‘corrupt’ leaders of the GNLF. His presentation of masculine


    power was supported by his claim of having received divine inspiration


    from Mahakal Baba (Darjeeling’s local reincarnation of the god Shiva),


    as he communicated through occasional loud and aggressive shouting.


    He received a frenetic response from the audience whenever he hit the


    board with this ﬁ st. Gurung defamed Ghisingh’s practices as *kutniti*


    (a term used in Darjeeling for describing dirty politics based on cor-


    ruption, deception, and self-aggrandizement of leaders) and announced


    that the voice of Gorkhaland was rising again. Responding to the popu-


    lar perception that ‘leaders are selling the demand’, he alleged that the


    GNLF leaders had pawned their ‘mother’ (read: Darjeeling hills) with


    the West Bengal government in exchange for privileges: ‘Th ey [GNLF


    leaders] quickly forget about the land and about the *jati* [community/


    people], and turn to the money … But our brothers and sisters are


    conscious … Th is is why you cannot buy them with money anymore.


    Because they love their mother and they love their land.’ ^(23)


    In contradistinction to the GNLF’s violent practices, the new move-


    ment led by Gurung’s newly launched GJM would be ‘democratic’ and


    ‘non-violent’. His request to other local parties to abstain from political


    struggles over power for the sake of the movement added to his attempt


    to dissociate the Gorkhaland demand from the realm of party-political


