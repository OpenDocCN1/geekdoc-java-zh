  md: 'sara shneiderman and townsend middleton


    4


    ecology and identity-based politics. Crucially, the contributions to this


    volume provide insights into how all of these phenomena are experi-


    enced by those on the margins of ‘mainstream’ India. Th ese views


    from Darjeeling provide, moreover, incisive looks into the forging of


    postcolonial territory, the quandaries of postcolonial citizenship; and


    the entanglements of social movements, governance, and economic


    transformation that have come to deﬁ ne life at the margins of India and


    beyond. Darjeeling accordingly ﬁ gures as an alternative—and critically


    productive—site through which to engage a range of outstanding


    concerns in modern South Asia and the postcolonial world writ large.


    Indeed, part of this book’s project is to introduce Darjeeling to postco-


    lonial thinking and, in turn, to explore what this critical tradition might


    teach us about Darjeeling today.


    By reconsidering Darjeeling, this book seeks not to tell *the* deﬁ nitive


    story of this region and its people, but rather to challenge prevailing nar-


    ratives through an assortment of perspectives and voices. In keeping with


    the spirit of postcolonial critique, the essays embrace the possibilities of


    interdisciplinary collaboration. We feel privileged to count among the


    contributors to this volume anthropologists, development practitioners,


    geographers, historians, and political scientists, as well as scholars who


    deﬁ ne themselves in interdisciplinary terms that bridge social science


    with cultural, environmental, and literary studies. Readers will ﬁ nd


    the same place explored through several diﬀ erent methodological


    approaches, further refracted through a range of disciplinary frame-


    works for analysis. Th e chapters are grouped not by discipline, but rather


    by theme, in three sections: *Histories of Exception* , *Political and Social*


    *Movements* , and *Environments and Labour* . In each section readers will


    ﬁ nd multiple approaches to a shared set of issues—often developed in


    productive tension—which, taken together, illuminate Darjeeling in new


    ways. Th rough these diverse commitments, we venture a multifaceted


    engagement with the legend and hard realities of this oft-romanticized


    region and its people. Reconsidering Darjeeling’s past and present in this


    way, we hope, can also help open new ways of imagining its future. To


    establish a foundation for the analyses that follow, we begin with a short


    history of the region and its people.


    **Colonial Darjeeling**


    Th e Darjeeling hills have been an historic crossroads of South Asia.


    Subject to the ebb and ﬂ ow of regional powers, Darjeeling’s borders and'
