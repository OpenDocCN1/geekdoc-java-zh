    While Ghisingh called for autonomy, he was, at the same time, com-


    mitted to protecting his own political hegemony. Th at imperative meant


    eliminating political rivals who tried to outﬂ ank him with more aggres-


    sive demands for Darjeeling’s self-rule. In 1989, after Ghisingh agreed to


    the creation of the DGHC in place of Gorkha statehood, leaders of rival


