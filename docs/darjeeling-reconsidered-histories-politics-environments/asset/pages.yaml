  md: '*Note on Language*


    N


    epali is the lingua franca of Darjeeling, and therefore is the


    non-English language we most often encounter in these


    essays. However, readers will also ﬁ nd words from Hindi,


    Bengali, and Lepcha in various parts of the text. Th is diversity high-


    lights Darjeeling’s complex ethno-linguistic composition. While there


    are several formal systems for the transliteration of Nepali and other


    South Asian languages that rely on diacritical marks or the use of


    double letters such as ‘aa’ or chh’, we have opted to present non-English


    terms in simpliﬁ ed forms that will be accessible to non-specialist read-


    ers (and we beg forgiveness from speakers and scholars of the languages


    at hand). All non-English terms are italicized, with the exception of


    proper names, place names, and terms that have been adopted into


    English such as ‘coolie’. We have endeavoured to make language use'
