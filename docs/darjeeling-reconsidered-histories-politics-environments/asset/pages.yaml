    Training meant not mobility but stability—what the bureaucrat at


    the inauguration referred to as an ethical investment in Darjeeling’s


    plantations. Training was a form of collective solidarity and territorial


    control.


    Among some students and teachers involved with the DTMTC,


    recognition came in the form of accredited certiﬁ cates. As economic and


    geographical passports, certiﬁ cates would permit the advancement of the


    Gorkhaland cause by permitting more trained Gorkhas to work, in more


    places, with higher degrees of responsibility. Among others involved with


    the DTMTC, it was the institution, not its certiﬁ cates, which must be


    recognized. From this point of view, the DTMTC would only succeed


    if those outside Darjeeling recognized the capacity and right of Gorkha


    people to devise their own homegrown forms of training.


    Ultimately, the story of the DTMTC provides a more general les-


    son about the problem of occupation in Darjeeling. Management is an


    occupation in several senses. Management is about ﬁ lling and control-


    ling physical and institutional space. Th e post of manager is one that


    individuals can ﬁ ll interchangeably, but it is also a location in political


    economy, between labour and capital. It is a location on a plantation.


    Th e promise of a comfortable bungalow and membership in a social club


    once lured men from Europe, just as it now lures young Nepali men


    raised in plantation villages. Finally, management is the institution that


    enables the occupation of space by corporations and states. Tea planta-


    tion management positions in Darjeeling continue to be ﬁ lled by those


    whom Gorkha activists consider to be outsiders. Although management


    is occupational in all these senses, it has tended to be somewhat immune


    from politics. It is hard to imagine management as a position from which


    to take political action or as an institution through which to assert politi-


    cal beliefs. Management remains largely a function of politics rather


    than a set of political actions in itself.


    Over its short lifespan, the DTMTC thrust management and sub-


    national politics into an awkward relationship. In India, the idea of


    management is both bigger and smaller than the Gorkhaland Movement,


    or any movement for territorial sovereignty. Management is bigger in


    that it pulls young people away from their homelands, luring them to


    other states and other countries with promises of individual mobility,


    underwritten by certiﬁ cates and aﬃ liations. Management is smaller in


    the sense that its economic appeal—the oﬃ ces, the houses, the salary,


    and the petit bourgeois social clubs—is individual rather than collective.


    Th e recent rise of management training centres in India, predicated on'
