    **Proletarian Basis of Nepali Nation**


    After outlining the meaning and connotation of the term *Nepali* in the


    Darjeeling context, Pradhan shifts his analysis towards locating the


    sources of the nationality question, with special reference to Darjeeling.


    While explaining this phenomenon, Pradhan gives us an analytical clue


    by proposing that the principal causal factor that has augmented the


    feeling of national unity among the heterogeneous communities of the


    hills is the notion of class. He considers language the ‘second’ signiﬁ cant


    causal factor for explaining the Nepali nationality question in Darjeeling.


    While locating the production of national consciousness in late nine-


    teenth century Darjeeling, Pradhan held the view that almost all Nepalis


    settled in the hills were proletariats ( *sarvahara varga* ) as most of them


    were from working class backgrounds. Consequently, intra-community


    class exploitation and coercion had hardly taken shape among the


    Nepalis. In the late nineteenth century, Nepali society in Darjeeling did


    not experience in its ranks a signiﬁ cant emergence of capitalists or landed


    gentries ( *jamindar* ); nevertheless a lower middle class was germinating.


    According to Pradhan, the ideas of a ruling versus ruled class did not


    take shape within Nepali society in the hills, essentially because the alien


    colonial rulers in Darjeeling reigned over both of them. Th e British were


