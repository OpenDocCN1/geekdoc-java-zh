    Th e era of Rai’s political hegemony was a time of limited mobiliza-


    tion for autonomy in Darjeeling. After 1956, the AIGL’s focus shifted to


    promoting the Nepali language throughout India. ⁷ Th e party also scaled


    back its demands regarding Darjeeling, passing resolutions for auton-


    omy within West Bengal as opposed to prior demands for statehood or


    central administration. Little progress was made towards autonomy even


    under state governments in which Rai held a cabinet post. In 1976, a


    Darjeeling Hill Areas Development Council was formed but was only


    given an advisory role in development planning. ⁸ Despite the lack of


    autonomy concessions, the AIGL did not escalate its demands or tactics.


    Its mobilization consisted of little more than periodic memoranda to


    New Delhi or Kolkata. D.S. Bomjan argues that the AIGL also worked


    to marginalize upstart political formations that threatened to pursue


    Darjeeling’s autonomy more forcefully. Within the AIGL, Rai likewise


    quashed dissent: ‘the leaders who dared to challenge his style … were


    made like a ﬁ sh thrown on the sand’. ⁹


    Rai established a pattern for his successors: as his own stability in


    oﬃ ce consolidated, his party decreased its eﬀ orts at winning territorial


    autonomy for Darjeeling. Th at pattern became more obvious under the


    two later leaders—Subash Ghisingh and Bimal Gurung. Although this


    chapter is drawing a parallel between these three leaders, it is worth


    stressing that political life was more pluralistic under Rai’s AIGL than


    subsequently thereafter. Opposition parties like the Communist Party


    of India (Marxist) (CPI[M]) and civil society organizations that oper-


    ated in Darjeeling during the AIGL’s tenure were largely purged from


    the hills in the 1980s.


