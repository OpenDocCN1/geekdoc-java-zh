    labour needs of this budding industry, the British looked to neighbour-


    ing Sikkim, Bhutan, and especially Nepal for coolies to care for this


    global cash crop. Th e industry expanded rapidly throughout the 1850s


    and 1860s. Darjeeling subsequently transformed into a place not only of


    colonial convalescence, but also capitalist production. ^(17) By 1870, there


    were 56 gardens employing roughly 8,000 labourers. By 1900, there


    were more than 100 gardens employing an estimated 64,000 labourers—


    nearly all of them categorized as ‘Nepali’ by the colonial records. ^(18)


    However, other data suggests that colonial records did not adequately


    account for diﬀ erences between those born in Darjeeling and those


    newly migrated from Nepal. Th is lack of clarity regarding citizenship in


    a context of multiple identities shaped by high mobility remains a key


    vector in contemporary identity politics, as will be explored in further


    detail below.


    Th ese economic qua ecological developments prompted attendant


    transformations to Darjeeling’s cultural landscape. As members of


    various ethnic groups from across the Himalayas found work in the up-


    and-coming hill station, the new arrivals brought with them their own


    languages, customs, and religious practices. Th ese were the building


    blocks of the ethnic plurality that is the region’s signature. Th e ethnically


    diverse settlers found common ground in their Himalayan heritage,


    and the Nepali language soon became (and remains) Darjeeling’s


    lingua franca. Over the generations, as members of diﬀ erent ethnic


    groups mixed and intermarried, many of the discrete linguistic and


    religious practices of their ancestors gave way to new hybrid cultural


    forms. Today, many community members of groups like the Tamang,


    Gurung, Newar, and others do not speak the languages of their ances-


    tors and contemporaries in Nepal, but rather grow up speaking and


    studying Nepali, English, Hindi, and Bengali. ^(19) But where languages


    and customs were lost, new forms of solidarity and cultural identity


    were gained. Th ese dynamics of cultural loss, hybridity, and ethno-


    genesis over the last two centuries have yielded Darjeeling’s distinctive


    multicultural identity and made the hills a unique site of Himalayan


    cosmopolitanism. ^(20)


