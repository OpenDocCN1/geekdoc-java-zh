    Darjeeling train station, Mangalpuri samaj has been considered a part


    of the municipality since at least the 1970s. Samaj residents contend


    that they have long constituted an important vote bank for regional


    politicians. With 1,400 voters, their numbers are certainly sizeable


    and signiﬁ cant enough for close–call elections, especially that of the


    Municipal Commissioner. To court the votes of their samaj, politicians


    regularly make promises that hardly ever materialize. One woman wryly


    commented on this with the observation that, ‘Up is up and down will


    always remain down.’ Her point was that, despite performative eﬀ orts at


    inclusion within the municipality, the Mangalpuri samaj members seem


    to be unassociated with what happens uphill towards the administrative


    and political centre of town. As a part of this disconnected ‘down’, the


    Mangalpuri samaj members are often forgotten.


    Other Mangalpuri residents echoed the claim that they receive few


    beneﬁ ts from being a part of the municipality. Aside from the right to


    vote, the only provision was a single pipe leading to their enclave. Each


    member contributed their own money (roughly Rs. 300 each) in order to


    create ﬁ ve water points for distribution within the samaj. From each


    water point, a family can get between 10 and 20 litres of municipal water


    per week. Th is water, they complain, is yellow, foul-smelling, and not ﬁ t


    for even washing clothes. In recent years, in fact, they have threatened


    to secede from the municipality as a protest for their poor treatment.


    If they were no longer a part of the municipality, some quipped, they


    would not have to pay dhuri tax and they would no longer serve as


    pawns in Darjeeling’s municipal politics. What’s more, if they were part


    of the panchayat system, then they would be able to access government-


