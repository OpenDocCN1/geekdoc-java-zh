    Th is history of poverty and discrimination undergirds a longstanding


    movement to separate Darjeeling from the state of West Bengal and


    form a new state of Gorkhaland within the Indian union.  


    Tea plantation ﬁ elds and the workers within them are prominent in


    the political symbolism and discourse of the Gorkhaland Movement.


    Th e movement seeks both to undo the political economic inequities of


    the plantation system and to vigorously counter racial stereotypes that


    portray Nepalis in Darjeeling as exotic outsiders, rather than rightful


    residents. Th e tension between these two aspirations was palpable in


    the youth sitting outside the DTMTC on that summer day. Many of


    the would-be students hailed from tea plantations. Some had worked


    in call centres elsewhere in India, but had returned home because they


    were unsatisﬁ ed with nocturnal urban work. Most had ﬁ nished high


    school, or even college, but had been unable to ﬁ nd employment. When


