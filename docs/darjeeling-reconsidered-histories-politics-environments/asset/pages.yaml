    As I have argued here, the story of the DTMTC’s rise and fall illus-


    trates fundamental contradictions embedded in two concepts that are


    central to the Gorkhaland Movement: development and recognition.


    In the discussions about the purpose and operations of the DTMTC,


    development sometimes referred to the aspiration among the educated


    unemployed of Darjeeling for economic and social mobility. As it was


    elsewhere in India, management training was seen as a means of individ-


    ual improvement. Among older GJM activists, including the DTMTC’s


    teachers and founders, development indexed something diﬀ erent.'
