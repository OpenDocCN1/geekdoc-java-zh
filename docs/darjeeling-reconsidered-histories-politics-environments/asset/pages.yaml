    In certain cases becoming a tourist destination is part of a reﬂ exive


    process by which societies and places come to enter the global order.


    —John Urry, *Th e Tourist Gaze*


    Unfortunately, I never got a chance to interview the lone tourist who


    observed Madan Tamang’s memorial session in Darjeeling. What did he


    think of the spectacle? How did it impact his perception of Darjeeling?


    Did this coincidental experience set him apart from tourists visiting


    Darjeeling any other day when reminders of Darjeeling’s violent politics


    were not so obviously on display?


    In this chapter, I have tried to make sense of the ‘reﬂ exive process’


    by which Darjeeling entered the global order as ‘a summer place’: a


    tourist destination related to classed notions of pleasure and holiday


    visits rather than hard labour and uncertain belonging. I have also


    attempted to account for some of the consequences of this process for


    the politics of place and belonging in Darjeeling. In a recent essay, Sarah


    Besky notes that ‘to make claims to belonging in a place that was built


    for someone else’ is ‘complicated’ and argues that understanding these


    claims in Darjeeling ‘requires a historical view of the hill station as a built


