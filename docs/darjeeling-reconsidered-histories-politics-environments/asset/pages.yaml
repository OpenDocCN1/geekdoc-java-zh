    a result of the dam. I later learnt that some of the men were aﬃ liates


    of a local party that had been instrumental in stiﬂ ing public opposition


    to the dam. Th e local party had brought *rowdies* to public hearings and


    their presence had suﬃ ced to keep people away from meetings and


    ensure that none of the attendees asked awkward questions. Although


    those men had long changed their political alliances, they still had the


    reputation of being dangerous rowdies.


    In the dialect of Nepali spoken in Darjeeling, *rowdies* or *rowdy* ¹


    denotes a person who ﬁ ts somewhere between a gangster and a *goon* ,


    not a professional criminal but an individual prone to crime and violence


    usually at the behest of political leaders. Th e term *rowdies* in Darjeeling-


    Nepali is synonymous with the Hindi term *goonda* . Whether for the


    GJM, the GNLF or even the TMC, rowdies are the foot soldiers who


    ensure that the commands of their political leaders are carried out at the


    local level. Rowdies’ tasks include organizing political rallies and attend-


    ing public hearings, among other things. Often sighted leading political


    processions, enforcing strikes, and collecting *chanda* (tax) on behalf of


    their political parties, the rowdies of Darjeeling are a subaltern political


    phenomenon and part of the distinct political culture of the hills.


    Th e persistence of rowdies in the social and political history of


    Darjeeling forces an assessment of two important and inter-related


    aspects of the region’s political economy. First, rowdies are crucial to


    the success of any political party. Th ey are an extension of the politi-


    cal parties they represent and often enforce diktats on behalf of that


    political party. Whilst acting as mediators between the party and the


    community, they remain a political underclass with no actual voice in


    the political decision-making processes of the party. Th is is telling of


    the political structure and distribution of power in the hills. Second,


    their continued existence on the margins of society also requires us to


    examine the socio-economic stagnation that has enabled the prolifera-


    tion of this political class for which violence has become a route out of


    poverty. Th e phenomenon of rowdies, therefore, helps us analyse the


    prevailing political structure and rampant poverty in the hills, factors


    which work in tandem to reinforce and perpetuate a political culture


    of violence.


