    objects, both natural and social, including the networks and pathways


    which facilitate the exchange of materials, things, and information. Such


    ‘objects’ are not only things but also relations.’ ^(23) Following his call to


    examine space in light of the labour that constitutes it, we can problema-


    tize Darjeeling as a circulatory social space where seasonal, temporary,


    and permanent labouring migrations into a colonial high-altitude setting


    produced complex networks of classed, raced, and gendered relation-


    ships between, for, and by constituent subjects.


