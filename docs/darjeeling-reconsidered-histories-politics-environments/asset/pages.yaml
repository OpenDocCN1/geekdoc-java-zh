    Despite the fact that the Nepali-speaking population quickly became


    the region’s demographic majority, they faced diﬃ cult circumstances.


    Because neighbouring countries like Nepal and Sikkim did not approve


    of the immigration patterns that brought much of this workforce to


    Darjeeling, the British refused to oﬃ cially claim the settlers as British


    subjects. ^(21) Th e paradox was unmistakable. With one hand, colonial


    oﬃ cials and planters lured labourers with the promise of wages and


    housing, as an alternative to the forced labour regimes, caste-based agrar-


    ian exploitation, and excessive taxation schemes of their homelands in


    Nepal. With the other hand though, British oﬃ cials denied the settlers


    rights and a sense of security in India. Fears of being forcefully returned


    to their country of origin were rampant amongst the coolies. ^(22) Th ese


    anxieties, coupled with the jarring new capitalist circumstances that


    workers found themselves in, made precarity a formative condition of


    colonial life. ‘Going to Mugalan’ (as India was then called in Nepal) may


    have posed an enticing alternative to the oppressive hierarchies of nine-


    teenth century Nepal, ^(23) but the colonial conjuncture introduced a novel


    set of diﬃ culties that would haunt the Nepali speakers of Darjeeling


    for generations to come. Th ese communities’ anxieties over being-in and


    being-of India intensiﬁ ed as they encountered racial discrimination,


    xenophobic misrecognition as being ‘foreigners’, and various forms of


    structural exclusion from the India of the plains below. ^(24) Th e colonial


    archive, not surprisingly, tells us little of these hardships, but they remain


    integral to the sociopolitical life of Darjeeling today.


    In the twentieth century, the people of Darjeeling increasingly


    sought political formulations to secure the autonomy, well-being, and


    belonging in India that they desired. According to local histories, calls


    for rights and equitable representation for the Nepali-speaking majority


    were sounded as early as 1907\. In 1917, the Hillmen’s Association—


    an ethnically heterogeneous organization comprising Nepali, Lepcha,


    and Bhutia—formalized these claims with a memorandum to the


    Government of Bengal calling for native self-rule in the hills. Th e call


    for ethnic autonomy was taken up by numerous organizations in subse-


    quent decades. In 1934, S.W. Laden La founded the Hill People’s Social


