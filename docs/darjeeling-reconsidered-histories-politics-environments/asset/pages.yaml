    tune of the ﬁ rst national television was composed by a Nepali, and so


    on. Th ere are also today a small group of people who are, perhaps tired


    of arguing along the above lines, saying: ‘Yes, our forefathers came from


    Nepal. So what? If we are citizens of India, we must be treated as such.’


    Th is exudes self–conﬁ dence, which characterizes the new generation,


    well–educated, and well–travelled Nepalis from Darjeeling. History is


