  md: '*Introduction*


    5


    the territorial claims that deﬁ ne them have shifted periodically through


    time. Th e region’s status as a geopolitical frontier—at once strategic and


    sensitive—has inﬂ ected its standing in the context of South Asia from


    the precolonial period to the postcolonial present. Th roughout much of


    the eighteenth century, the territory between the Mechi and Teesta riv-


    ers (see the map in frontispiece) was claimed by the Chogyal of Sikkim.


    Nepal’s military expansion eastward in the ﬁ nal decades of that century


    brought the tract under the control of Nepal’s Gorkha Empire. Th e areas


    east of the Teesta River meanwhile remained part of Bhutan. Nepal’s


    rule over Darjeeling came to an end in 1815, when the British mandated


    Nepal return the tract to Sikkim at the conclusion of the Anglo-Nepalese


    War (1814–16) by way of the Treaty of Segowlee or Sugauli (1815) and


    subsequent Treaty of Titalia (1817). ⁹ If this marked the start of British


    territorial meddling in the area, it would not be long before the Empire


    began to make more direct claims upon the region and its people.


    Th e stories of Darjeeling’s colonial founding are by now legion. ^(10)


    In 1829, Captain George Lloyd and J.W. Grant were passing through


    Darjeeling en route to settle a border dispute between Sikkim and


    Nepal. Th e location was then known by local Lepcha peoples as


    *Dorje-ling* , or ‘Place of the Th underbolt’. Th e crescent shaped ridge of


    Dorje-ling struck Lloyd as an ideal location for a hill station sanatorium


    where colonial oﬃ cials could ﬁ nd respite from the swelter of the plains


    below. Lloyd conveyed his vision to the Governor General of India,


    Lord William Bentinck, who agreed that Dorje–ling would make an


    excellent sanatorium and strategic military outpost for monitoring the


    Himalayan frontier. Deputy Surveyor General of India Captain J.D.


    Herbert subsequently visited Darjeeling in February and March 1830


    to survey the site and concurred. ^(11) Taking the plan forward, in 1835,


    the British East India Company (EIC) secured rights to a roughly 24 × 6


    miles stretch of land from Sikkim by way of an oﬃ cial Deed of Grant


    (1835). With a lease on this land, the British set to work transforming


    the ostensibly ‘uninhabited’ hill tract into a proper hill station. Th e EIC


    appointed Dr A. Campbell as Darjeeling’s ﬁ rst superintendent in 1839,


    and, deeming the tract a ‘Nonregulated Area’, gave him far-reaching


    authority to develop the hills as he saw ﬁ t. Th e ﬁ rst decades of British


    rule brought major infrastructural and environmental transformations,


    ⁹ Kennedy (1996); Mullard (2011); Pradhan (1991); Subba (1989a: 1–5).


    ^(10) See, for instance, O’Malley (1907).


    ^(11) Herbert (1830).'
  merge: -1
