    By the time of that class in October, students had begun to complain


    regularly of a lack of practical education at the DTMTC. It was all


    well and good, they told their instructors, to discuss the ways in which


    planting tea on a steep mountainside might present challenges that went


    unaddressed in manuals written for the plains or Assam, but in order


    to understand these diﬀ erences, students needed to be allowed into the


    ﬁ eld. In response, teachers told students that they did not need practical


    training. After all, they had grown up playing around the tea bushes. As


    one teacher suggested, if they wanted to know how to pluck or prune,


    they could go ask their mothers.


    In these debates about the relationship between theory and practice,


    and between agronomy and embodied knowledge, a discord between


    the cultivation of a Gorkha subjectivity and the cultivation of a manage-


    rial subjectivity became evident. Was tea management something best


    learned on the job, or was it a set of discrete skills that could be corralled


    in books and taught in standard modules? ^(27) In some moments, the


    DTMTC’s curriculum seemed overly rigid and excessively deferential


    to the techniques laid out in TRA circulars. In others, it seemed exces-


    sively dependent on vague ideas about the deep connections between


    Gorkhas and Darjeeling plantations. How would a student’s completion


    of a year at the DTMTC be recognized by would-be employers? Would


    their work be recognized outside of Darjeeling at all? And if students


    did secure jobs on Darjeeling plantations, would they be regarded as


    managers, or as *Gorkha* managers?


    For students, these mounting concerns became crystallized in an


    unfulﬁ lled promise the GJM leadership made early in the school year.


    When they matriculated, students were assured that the party would help


    the DTMTC secure an aﬃ liation. Th e students reasonably took aﬃ lia-


    tion to mean accreditation by a university or other technological training


    institute. For students, aﬃ liation would increase the chances that training


    would yield job placement. To be recognized as a trained manager, they


    reasoned, a person needed a certiﬁ cate from an accredited institution.


    Despite the party’s promises, the question of the DTMTC’s pur-


    pose had never been fully resolved by the school’s leaders. For some,


