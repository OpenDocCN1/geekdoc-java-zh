    further heightened tensions in the region. ^(28) Th ese events imbued the


    people of Darjeeling with a sense of unease that continues to haunt


    and animate sociopolitical life in the hills. ^(29) Responding to this long-


    standing climate of prejudice, the All India Nepali Language Committee,


    in 1972, began a protracted struggle to make Nepali a national language


    of India. Th is all-India movement had strong activist roots in Darjeeling,


    but struggled throughout the 1970s to gain linguistic recognition for


    the millions of native Nepali speakers in India. ^(30) In 1979, India’s then


    Prime Minister Morarji Desai exacerbated the Gorkhas’ frustration by


    publically declaring Nepali to be ‘a foreign language spoken by foreigners


    in India’. ^(31) Given the anxiety-ridden histories outlined above, Desai’s


    remarks struck a painful nerve in Darjeeling.


    Th roughout the 1970s and early 1980s, local political outﬁ ts such as


    the AIGL and the Pranta Parishad elaborated the demands for ethnic


    autonomy, but to no avail. Spurred on by the aforementioned ethnic


    violence against Nepalis in the North-East and the various forms of


    structural violence that persistently relegated the people of Darjeeling


    to a literal and ﬁ gurative corner of the nation-state, there was a growing


    sense that the Gorkhas of Darjeeling needed a place to call their own. In


    1986, a new party, the Gorkhaland National Liberation Front (GNLF),


    launched a violent agitation for a separate state of Gorkhaland within


    India. Spearheaded by the GNLF’s charismatic leader Subash Ghisingh,


    the logics of the Gorkhaland Movement were clear. First, the people of


    Darjeeling demanded their own state within India, free from the oppres-


    sion of West Bengal. Second, despite being stigmatized as ‘outsiders’ and


    ‘foreigners’, the Gorkhas of Darjeeling were loyal Indians. A state bearing


    their own ethnonym would thereby establish their rightful place in the


    nation-state. In Ghisingh’s words:


    We Indian Nepalis who have nothing to do with Nepal are constantly


    confused as ‘Nepalis’, that is, citizens of Nepal, a foreign country. But if


    there is Gorkhaland then our identity as Indian, belonging to an Indian


    state … will be clear. ^(32)


