    their decisions to attend the DTMTC within the overtly political


    rhetoric of the Gorkhaland Movement. Rather, they described them-


    selves as unemployed and looking for work. Management training,


    which oﬀ ered translatable, compartmentalizable, and commensurable


    knowledge, would land them a job. A job, in turn, would enable them


    to become upwardly mobile citizens of India, but not necessarily of


    Gorkhaland.


