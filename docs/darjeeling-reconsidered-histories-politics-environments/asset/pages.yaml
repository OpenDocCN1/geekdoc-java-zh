    majority of the Euro-Americans who ﬂ ocked to the new hill station, this


    Himalayan settlement served as a potent symbol of human triumph over


    Nature. Th ey looked for similar triumphs over the denizens of those


    mountains. On their part, those denizens often had other ideas and


    desires, which they sought to realize within the strictures of the colonial


    establishment and Darjeeling’s urban morphology.


