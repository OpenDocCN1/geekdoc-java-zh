    In the mid-1980s, an ‘information document’ published by the


    Government of West Bengal and widely circulated in the hills during


    the peak of the ﬁ rst Gorkhaland Movement, claims that: ‘Th e peaceful


    Himalayan region of West Bengal, with a Nepalese majority, is largely


    known for its tea gardens and scenic beauty and is a major tourist attrac-


    tion in the country.’ ^(55) Later, the same publication goes on to emphasize


    how ‘until the recent happenings’ everyone ‘lived peacefully and amicably’


    and that ‘the atmosphere in the hills of Darjeeling was in keeping with


    the excellent tradition of communal harmony in the rest of the state’. ^(56)


    In line with this insistence that Darjeeling was, even in the midst of subna-


    tional agitation, a place of harmony and scenic beauty, other government


    documents repeatedly describe the violence taking place as something


    external to Darjeeling as a place, fuelled simply by the ‘anti-nationalist’


    and ‘secessionist’ agitation of the Gorkhaland National Liberation Front


    (GNLF) and incited by the ‘invisible hand’ of ‘foreign inﬂ uence’. ^(57) Just


    like *Barﬁ !* , these documents thus situate the ‘real’ Darjeeling in the tour-


    istic image, discounting the ongoing agitation as exceptional.


    News reports from the period similarly dramatize the ongoing events


    on the background of a ‘normality’ of scenic beauty and harmony. One


    article—aptly titled ‘Darjeeling Disquiet’—commences with the follow-


    ing paragraph:


