    Himalayan labouring migrants aspired to work for the mountain railway,


    but in their ﬁ rst years, often settled for carrying the dandee.


    During the 1860s and 1870s, when new transport infrastructure


    of roads and rail improved hill station access to the plains, labouring


    men were able to move into domestic openings for cooks, major-domos,


    grooms, bearers, and watchmen that provided better wages and less


    onerous work than porterage. Guidebooks list wages for household


    jobs at approximately Rs 8 a month in Darjeeling’s early years, rising to


    Rs 10–12 by 1862–78\. But these opportunities were almost entirely lim-


    ited to men. Women had a narrower range of jobs available as sweepers


    and ayah nursemaids whose wages ranged between Rs 5–8 a month. ^(25)


    Labouring female remuneration changed little over the years, compared


    to the higher-end domestic jobs that went to men over whose skills


    households might compete. A matter of shocking titillation for many


    Euro-American visitors was the high visibility of female load-carriers on


    Darjeeling’s streets. Such images as the stereoscopic views of labouring


    women porters by the American globetrotter James Ricalton, served to


    underline the alienness of these frontier people, and the exoticism of the


    imperial space, which their labour constituted ( Figure 3.3 ).


    Race became as crucial a determinant as gender since employers


    sought to diﬀ erentiate and discipline a ﬂ oating subaltern proletariat on


    the basis of reiﬁ ed cultural and biological traits that rested on ascribed


    racial and national origins. Hooker’s second collecting expedition, a


    three-month stint across Sikkim and eastern Nepal to the Tibet frontier,


    forms an early test case. In a letter, he described to Sir William how


    ‘preliminaries towards my trip to the snows’ involved interviews with a


    ‘motley group of natives—of various tribes, colours & callings such as


