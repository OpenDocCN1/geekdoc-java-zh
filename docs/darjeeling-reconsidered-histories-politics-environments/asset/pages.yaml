    A combination of push and pull factors encouraged labour circulation


    along porous Himalayan frontiers once the possibilities of wage-work in


    and around Darjeeling became known. Many migrants spoke Tibeto-


    Burman languages and were unlettered villagers who ﬂ ed a diﬃ cult


    agrarian economy and semi-feudal exploitation in the hilly tracts of


    eastern Nepal. Th e topography of their homeland earned them the label


    Pahari (from *pahar* , or hills). Michael Hutt describes how Nepali peas-


    ants, enslaved, or landless, or over-taxed, or indebted, long sought better


    prospects in ‘Mugalan’ (meaning India, literally, land of Mughals). ^(43) By


    the 1870s, William Hunter estimated that 34.1 per cent of the Darjeeling


    district’s population was born in Nepal. ^(44) Th e magnitude of the push


    and pull situation is apparent when we read about the diﬃ culties that


    attended such moves. One migrant recollected, ‘You do not run across


    the wild country of eastern Nepal. You creep up and down, out and


    about, over steep ridges, through jungle valleys, across rushing rivers, on


    trails that you can hardly see.’ ^(45)


    From the 1860s, labour needs on tea plantations expanded rapidly


    under the demands of clearing forests, and the demands of growing,


    picking, and harvesting the crop. In 1895, the Darjeeling Tea Company’s


    co-chairman, the Scottish planter George Christison estimated that the


    region’s 175 tea gardens employed 70,000 workers, the majority from


    Nepal. ^(46) Undoubtedly, many had heard sentiments such as this folk


    saying that went: ‘Darjeeling will take care of me.’ ^(47) However, this was


    not yet a permanent or even a settled workforce. Tea managers unhappy


    with such patterns of movement accused tea workers of running away to


    Nepal so as to default on moneylender debts. ^(48) In reality, their workforce


    included many peasants eager to earn tea wages during winter when


