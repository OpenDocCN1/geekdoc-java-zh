    It is important to analyse how and why colonial ethnography charac-


    terized these ‘Bhutan’ labourers, the people, whom the archive otherwise


    terms as Bhootea, Bhotiya, Bhotia, or Bhutia. In a study of Tibetan


    border worlds, Wim van Spengen describes them as cross-cultural


    traders who combined transhumance herding of yak and sheep with


    summer cultivation. ^(29) During winter migrations, these Tibetan-dialect


    speakers carried loads of wool, hides, butter, iron, and salt to barter for


    plains peoples’ grain and sugar at periodic open-air markets all over the


    Himalayas. ^(30) Hooker’s hiring them at Campbell’s urging shows how after


    a few years of Himalayan rule, colonial oﬃ cials had become convinced


    that Bhutia readiness to travel and familiarity with carrying loads made


    them the most desirable recruits for outdoor labouring jobs as sedan


    bearers, seasonal road-builders, load carriers, pony and mule operators.


    An important contributing factor was that Bhutia unfamiliarity with


    a settled lifestyle and urbanism made them more likely to accept low


    wages than Lepchas. Th is is borne out by the evidence from observers


    such as the guidebook authors Hathorn and Avery that outdoor wages


    were at the lowest end of labouring remuneration, and tended to remain


    stagnant. ^(31)


    Colonial descriptions, especially those in oﬃ cial publications, empha-


    sized that Lepchas were a shy and reserved children of Nature. Postcards


    and other visual depictions established them as picturesque representa-


    tives of the Himalayan exoticism that attracted visitors from around


    the world to Darjeeling. ^(32) Th e reluctance of many Lepchas to perma-


    nently forego a semi-sedentary agrarian habitus was taken to mean that


    they were inferior to other Himalayan people for physical endurance


    and cultural adaptability. Hooker marvelled at a nimble Lepcha


    ‘carrying 140 pounds on his back (as he) crosses (a narrow rope bridge


    over water).’ ^(33) But that praise was juxtaposed with his opinion that


    ‘indolence, when left to themselves, is their besetting sin; they detest any


    ﬁ xed employment’. ^(34)


