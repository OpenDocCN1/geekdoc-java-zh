    **Alternative Routes to Recognition**


    In the wake of the 1980s agitation, many citizens of Darjeeling sought


    alternative routes to rights and recognition in India. Inspired by the


    proliferation of indigenous movements around the world, individual


    ethnic groups that comprised the greater Gorkha conglomerate mobi-


    lized for recognition as Scheduled Tribes (ST) of India—a designation


    that aﬀ ords aﬃ rmative action beneﬁ ts, often referred to in India as


    ‘reservations’. ^(35) If these ‘tribal’ movements tapped into a global arena of


    indigenous struggle, they were also part and parcel of more regional—


    and speciﬁ cally Himalayan—networks of ethnic mobilization. Th e links


    with Nepal’s *janajati* movement for indigenous rights during the 1990s


    were formative. In Nepal, the comparatively strong presence of interna-


    tional development agencies encouraged ethnic activists to connect with


    global indigenous discourses through initiatives like the United Nations’s


    Year of Indigenous Peoples in 1993—ideas which further circulated to


    Darjeeling. ^(36) As groups like the Gurung, Tamang, Th angmi, and others


    mobilized to overcome their historic marginalization in the Hindu


    kingdom of Nepal, their ethnic counterparts in Darjeeling borrowed


    tactics, information, and inspiration from Nepal’s *janajati* movement to


    add new contours to the politics of identity in India.


    But as per the terms of the postcolonial state, in India the sought–


    after identity was not *janajati* , ‘indigenous’, or ‘ethnic’. Rather, these


    movements would go by the designation ‘tribe’. Th e Tamang and Limbu


    communities led the way towards ST status throughout the early 1990s,


    with other communities following suit. By the 2000s, the quest for ST


    status became a pan-ethnic phenomenon across the hills, as every major


    ethnic group that was not yet an ST applied for tribal status. ^(37) Th e


