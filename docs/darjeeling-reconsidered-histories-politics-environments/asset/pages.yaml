    13


    Taking up arms for Gorkhaland, the Gorkhas sought to opt out of West


    Bengal and into India on their own terms as citizens of an independent


    state in the federal union. Ethnic autonomy, further, seemed to promise


    redress for histories of discrimination and oppression.


    Th e 1980s Gorkhaland Movement lasted three years (1986–8).


    Society-wide strikes known as *bandhs* , endless protests, and sporadic


    violence against the government’s paramilitary forces (primarily the


    Central Reserve Police Force (CRPF)) crippled life in the hills. Th e


    subnationalist agitation resulted in an estimated 297 deaths and 1,164


    homes destroyed. ^(33) Public memories of the agitation are haunted by


    the imagery of decapitated heads appearing in the bazaar, CRPF raids,


    razed homes, disappearances of loved ones, and other traumas. But


    in the end, the Gorkhaland Movement failed to deliver a separate


    state. Ghisingh, West Bengal, and the central Government of India


    in New Delhi (often referred to as ‘the Centre’), instead negotiated for


    a conciliatory administrative set-up known as the Darjeeling Gorkha


    Hill Council (DGHC, established 1988): a new form of governmen-


    tal exceptionalism in the hills. Under this arrangement, Darjeeling


    received limited autonomy, but the district remained under the gov-


    ernment of West Bengal. Ostensibly, the DGHC arrangement would


    respond to the Gorkhas’ plea for autonomy (thereby answering the


    region’s ‘ethnic question’), while preserving the established sovereign


    chain of command over this geopolitically strategic area (thereby


    heeding the ‘security perspective’). ^(34) Ghisingh and the GNLF assumed


    control of the DGHC for the next two decades, but the arrangement


    was ultimately rendered a toothless entity that quickly drew rancour


    from all sides. Despite its failures, the Gorkhaland Movement nev-


    ertheless put Darjeeling on the national radar as something other


    than a Himalayan paradise. It moreover established the contours of a


    distinctive political culture in the hills, charged with unrequited and


    periodically volatile demands for rights, recognition, and autonomy in


    India. Th ese subnationalist desires would take a range of forms in the


    years to come.


    ^(33) Samanta (2000: 54).


