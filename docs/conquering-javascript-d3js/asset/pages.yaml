  md: '# 34 Conquering JavaScript: D3.js


    Rectangle


    The rectangle element &lt;rect&gt; draws a rectangular form on the screen, as
    its name suggests. To be visible, the &lt;rect&gt; element must have four properties.
    The parameters x and y define the position of the rectangle''s top-left corner,
    while width and height define its width and height, respectively. In your SVG
    container, add the following &lt;rect&gt; element and its attributes.


    ```

    <rect x="160" y="15" width="160" height="80" />

    ```


    By assigning the fill attribute to any CSS color, we may change the color. If
    we want to change the rectangle border, we use the stroke attribute.


    # Ellipse and Circle


    In data visualization, circular forms are frequently utilized. They draw the eye
    in naturally and make the visualization feel warm and lively. The &lt;circle&gt;
    element is used to create SVG circles. The radius and the position of the circle''s
    center (cx, cy) are essential attributes (r). The radius of a circle is the distance
    between its center and any point on its border. Add the circle below to your collection
    of forms. Give it a radius of 10 pixels and a center of (430, 50).


    ```

    <circle cx="430" cy="50" r="10" />

    ```


    # Path


    Paths in SVG are by far the most adaptable of all SVG elements. They’re used a
    lot in D3 to draw pretty much all the complex forms and curves that can’t be represented
    by one of the shape primitives we’ve talked about far (line, rectangle, circle,
    and ellipse).


    By declaring the d attribute, we tell the browser how to create a path. The d
    attribute comprises a series of commands, ranging from where to begin drawing
    the path to what types of curves to employ and whether or not the path should
    be closed. Another thing to understand about paths is that unless the fill attribute
    is set to one or transparent, browsers will fill them with black.


    # Text


    One of the most appealing features of inline SVG visuals is that they can include
    navigable text, just like any other HTML text included in a div'
  merge: -1
  pgno: 52
- img_proc: true
  md: '# Introduction to D3.js 35


    or p element. This is a significant improvement in terms of accessibility. Because
    data visualizations frequently contain several labels, knowing how to alter SVG
    text using the text /> element is essential. To grasp the fundamentals of SVG
    text, let''s add labels to our gallery of forms.


    You have noticed that all of the SVG shapes we''ve looked at so far have a self-closing
    tag (<link />, <rect />, <path />, etc.). We must utilize an opening and closing
    tag when working with SVG text elements.


    ```

    <text>line</text>

    ```


    Another point to consider when working with SVG text is how the text will flow.
    Regular HTML elements are placed on the page according to particular criteria
    that govern content flow. If you put a bunch of <div>/div> components on your
    website, they''ll automatically stack on top of each other, and their content
    will reflow so that it never leaves its container. SVG text does not flow, and
    each SVG element must be separated. Setting their x and y characteristics is one
    option. The label “line” will display the SVG line in our gallery of forms if
    we use these properties to place our text at (40, 160).


    ```

    <text x="40" y="160">line</text>

    ```


    # GROUPING ELEMENTS


    The group element is the last SVG element we''ll look at in this section. The
    group or g> element differs from the other SVG elements in that it has no graphical
    representation and does not exist as a bounded space. Rather, when developing
    visualizations with multiple shapes and text elements, you''ll want to use groups
    a lot.


    If we want the square and the "rect" label to appear together and move as one
    within the gallery of forms, we can put both inside a <g> element, as seen in
    the example below. Note how the <rect> element''s top-left corner has been altered
    to (10, 30). To keep the text below the <rect>, it is placed at (0, 45).


    ```

    <g>

    <rect x="10" y="20" width="30" height="50" />

    <text x="0" y="45">rect</text>

    </g>

    ```'
