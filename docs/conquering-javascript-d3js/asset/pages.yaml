  md: '# Code Optimization ■ 127


    # Avoid Taking Too Much Memory


    One of the most critical talents javascript developer must have is the ability
    to manage memory usage. It''s because determining the RAM requirements of the
    device when it''s utilized to run your software is challenging. If the code ever
    demands a new memory reserve for the browser, the browser''s garbage collector
    will be invoked, and JavaScript will be terminated. If this happens frequently,
    the page will slow down.


    # Defer Needless JavaScript Loading


    Users understandably want the page to load quickly. However, all functions do
    not have to be available when a website loads. If a user takes various actions,
    such as clicking and switching tabs, you can delay loading function until the
    initial page has finished loading.


    This approach allows you to avoid loading and compiling JavaScript code, which
    might otherwise prevent the page from displaying correctly. After the page has
    done loading, you can start all of the features that will be available once the
    user starts interacting. Google recommends deferring load in 50-ms blocks in the
    RAIL model. This eliminates the impact of the user''s interaction.


    # Remove Memory Leaks


    In the event of a memory leak, the loaded page will consume more and more memory
    until it has consumed all of the device''s memory. This would have a negative
    impact on overall performance. This type of failure, which occurs on a page with
    an image slide, may be familiar. There are tools to determine whether your website
    is leaking memory. Chrome Dev Tools is one of these tools, the chronology is recorded
    in the performance tab. Memory leaks are usually caused by bits of the removed
    DOM from the page because they have some variable responsible for reference, preventing
    the garbage collector from removing them.


    # HARDENING AND SECURITY


    Today, JavaScript is widely used. It works in both your browser and your backend.
    Furthermore, the JavaScript ecosystem is heavily reliant on third-party libraries.
    As a result, to secure JavaScript, best practices must be followed to decrease
    the attack surface. But how can we ensure that JavaScript applications are safe?
    Let''s have a look.'
