  md: "# 190 ■ Conquering JavaScript: D3.js\n\nTrading Hours and Axes That Aren't\
    \ Continuous\nThe current chart displays only a few hours of trading data; when\
    \ this is expanded to include data for several days, the graphic becomes somewhat\
    \ strange.\n\nThe foremost is that stocks are merchandized on exchanges with set\
    \ hours of operation, for example, for the very famous New York Stock Exchange\
    \ from 9:30 a.m. to 4:00 p.m., when the majority of dealers are present. The second\
    \ is a limited amount of after-hours trading, which is usually minimal in volume\
    \ but does cause price movement.\n\nFinancial charts frequently utilize a \"discontinuous\"\
    \ axis, that is, with an axis with \"breaks,\" because there is little benefit\
    \ in depicting periods of time when the price is not changing.\n\nThe discontinuous\
    \ scale component in d3fc allows you to customize a scale by introducing gaps\
    \ or breaks. Here's a simple example of how to make a linear scale with a gap\
    \ between 50 and 70 and 125:\n\n```\nvar scale = FC.scaleDiscontinuous(d3.scaleLinear())\n\
    .discontinuityProvider(FC.discontinuityRange([50,\n75], [100, 125]));\n```\n\n\
    The discontinuity provider interface also allows you to create recurrent discontinuities,\
    \ such as charts that skip every weekend, but for our needs, the basic primary\
    \ step is to figure out when our data's first and last orders occur inside each\
    \ day. The following function will do the job:\n\n```\nconst tradingHours = dates\
    \ => {\n  const getDateKey = date => {\n    date.getMonth() + '/' + date.getDate()\
    \ + '/'\n    + date.getFullYear();\n};\n\nconst tradingMinute = dates.reduce((acc,\
    \ curr) => {\n  const getDateKey = getDateKey(curr);\n  if (!acc.hasOwnProperty(dateKey))\
    \ {\n    acc[dateKey] = [curr, curr];\n  } else {\n    acc[dateKey][1] = curr;\n\
    \  }\n  return acc;\n}, {});\n```"
