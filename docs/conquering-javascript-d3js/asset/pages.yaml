  md: "# Conquering JavaScript: D3\n\n+   - Editor\n- Webserver\n- Step 1: Library\
    \ D3: To use D3 for data visualization, you must include the D3.js library in\
    \ your HTML webpage. There are two ways to do it:\n  - Include the D3 library\
    \ in the assignment folder.\n  - CDN's D3 library should be included (Content\
    \ Delivery Network).\n    Very first step is to get a copy of the D3 library,\
    \ and we need to visit: https://d3js.org/ and we need to download the latest version\
    \ of the D3 zip folder, by unzipping the folder and going to d3.min.js (Minified\
    \ version of D3 source code). Create an assignment folder on the desktop and copy\
    \ this D3 source code along other library files.\n\n![](img/7fba45ff5201792b222a9c70c681c49a_24_0.png)\n\
