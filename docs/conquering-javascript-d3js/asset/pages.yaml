  md: '# Conquering JavaScript


    JavaScript has become the facto standard when it comes to both web and cross-platform
    development. D3.js is an extremely popular JS framework, meant for rapid and more
    robust development.


    **Conquering JavaScript:** D3.js helps the reader master the D3.js framework for
    faster and more robust development. The book is a detailed guide that will help
    developers and coders do more with D3.js. It discusses the basics in brief, and
    then moves on to more advanced and detailed exercises to help readers quickly
    gain the required knowledge.


    Key Features:


    +   - Provides industry specific case-based examples.

    - Discusses visual implementation of D3.js for project work.

    - Emphasizes how to write clean and maintainable code.


    This book is a valuable reference for D3.js developers as well as those involved
    in game development, mobile apps, progressive applications, and now even desktop
    apps.'
