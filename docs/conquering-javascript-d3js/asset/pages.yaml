  md: '# Introduction to D3.js 33


    The cartesian coordinate system and the SVG coordinate system are similar. The
    2D plane uses two perpendicular axes to determine the position of elements, referred
    to as x and y.


    Now let us see some of the SVG shapes that we will come across while working on
    D3 applications. We will also discuss their main presentational attributes. The
    purpose here isn''t give a thorough tutorial on all of SVG''s shapes and features
    but rather to cover the fundamentals that will help you along your D3 journey.


    # Line


    The line element is the most basic of all the SVG shapes. It draws a straight
    line between two points with their positions set as attributes. Return to index.html
    and insert a line /> element within the SVG container. Give the attributes x1
    and y1 values of 60 and 55, respectively. This signifies that the starting point
    of our line is at (60, 55) in the SVG container''s coordinate system. You may
    find the line''s starting point by starting at the top-left corner of the SVG
    container, moving 10px to the right, and 15px down. Set the line''s endpoint to
    (150, 325) using the x2 and y2 attributes.


    ```

    <svg>

    <line x1="60" y1="55" x2="150" y2="325" />

    </svg>

    ```


    We must additionally set the stroke attribute, which determines the line''s color,
    for an SVG line to be displayed on the screen. The stroke attribute has a value
    that is identical to the CSS color property. It could be a name for color (red,
    pink, etc.), an RGB color (RGB (155,10,20)), or a hexadecimal value (#808080).
    Give your line a stroke attribute and the color of your choice.


    ```

    <line x1="60" y1="55" x2="150" y2="325" stroke="blue" />

    ```


    The stroke-width attribute is used to determine the line''s width. This attribute
    accepts either an absolute quantity in pixels or a relative value (%).


    ```

    <line x1="60" y1="55" x2="150" y2="325" stroke="blue" stroke-width="5" />

    ```'
