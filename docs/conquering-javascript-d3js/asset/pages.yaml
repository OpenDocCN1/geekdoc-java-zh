  md: "# DATA FROM EXTERNAL SOURCES IS BEING LOADED\n\nYou've hardcoded data into\
    \ your Angular components, but that's probably not a good idea. There are various\
    \ methods for loading data from external sources in D3, so let's look at two of\
    \ the most prevalent patterns.\n\n# CSV File Loading\n\nCSV files can be exported\
    \ from almost any spreadsheet format. CSV is a text-based data storage format\
    \ that separates values in the file using commas and line breaks. Because CSV\
    \ is a widely used data format, D3 includes native support for loading publicly\
    \ available CSV files.\n\nCreate a frameworks.csv in your Angular application's\
    \ src/assets/directory to show using a CSV file. To the file, add the following\
    \ text:\n\n```\nFramework, Stars, Released\nVue,16443,2014\nReact,150793,2013\n\
    Angular,62342,2016\nBackbone,27647,2011\nEmber,21471,2011\n```\n\nNext, open bar.component.ts\
    \ and update the ngOnInit() method to call D3's csv() method:\",\n\n```\nngOnInit()\
    \ : void {\n  this.createSvg();\n  // Parse data from a CSV\n  d3.csv(\"assets/frameworks.csv\"\
    ).then(data =>\n    this.drawBars(data));\n}\n```\n\nD3 can load CSV files from\
    \ your Angular application or a third-party URL and return the data as an array\
    \ of objects in the promise. Return to the browser to see the same bar chart as\
    \ before, but this time the data comes from the frameworks.csv file rather than\
    \ the Angular component.\n\n# Using a JSON API to Get Data\n\nJSON is another\
    \ popular data format for online APIs. REST and GraphQL APIs frequently return\
    \ JSON, a string representation of JavaScript objects. D3 supports JSON data out\
    \ of the box, making it simple to integrate with your Angular application."
  merge: -1
  pgno: 189
