  md: "# 38 Conquering JavaScript: D3.js\n\n# METHODS CHAINING\n\nWhen looking for\
    \ D3 project examples online, you'll discover that methods are called one after\
    \ the other on the same Selection. This is known as method chaining, and it aids\
    \ in keeping the code simple and legible.\n\nBreaking lines, which JavaScript\
    \ ignores, and indenting chained methods are very popular in D3. The indentation\
