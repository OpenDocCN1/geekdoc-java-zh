  md: "Introduction to D3js 5\n\n+   JavaScript: JavaScript is a scripting language\
    \ that runs in the user's browser and is loosely typed. In order to make the online\
    \ user interface interactive, JavaScript interacts with HTML elements (DOM elements).JavaScript\
    \ supports ECMAScript standards, including basic functionality based on the ECMA-262\
    \ specification as well as non-ECMAScript features. It transforms static HTML\
    \ web pages into interactive web pages by dynamically updating content, validating\
    \ form data, controlling multimedia, animating images, and nearly everything else.\
    \ Knowledge of JavaScript is required to use D3.js.\n\n# Example:\n\n```\nMany\
    \ <Script> tag\n<!DOCTYPE html>\n<html>\n<head>\n  <title>JavaScript Demo</title>\n\
    \  <script>\n    alert('Hello JavaScript 1')\n  </script>\n</head>\n<body>\n \
    \ <h1>JavaScript Tutorials</h1>\n  <script>\n    alert('Hello JavaScript 2')\n\
    \  </script>\n  <p>This page contains many script tags.</p>\n</body>\n</html>\n\
    ```\n\n# SETTING UP A D3 ENVIRONMENT\n\nWe'll learn how to set up a D3.js development\
    \ environment in this part. D3 is compatible with all modern browsers, and the\
    \ current version of D3.js is 7. (v7).\n\nBut before we begin, you'll require\
    \ the following items:\n\n+   - Library D3\n\n+   - Web browser"
