  md: '# Code Optimization ■ 131


    If the source has been tampered with, the integrity attribute allows a browser
    to inspect the fetched script to ensure that the code is never loaded.


    Testing for NPM Vulnerabilities Regularly

    i hope everyone knows that the npm audit command may be used to find vulnerabilities
    in all installed dependencies. It generates vulnerability reports and offers solutions.
    But how frequently do you do it?


    Unless we automate it, these vulnerabilities will pile up, making it impossible
    to patch them. Remember that some of them may be vital, allowing for serious exploits.


    You may find vulnerabilities by running NPM in CI for each pull request. As a
    result, you can avoid any vulnerabilities being undetected.


    ```

    rm -rf node_modules

    rm package-lock.json yarn.lock

    pm cache clean --force

    pm install

    ```


    Minor and Patch Version Updates Should Be Enabled


    Have you ever seen the symbol next to any NPM package version? For minor and patch
    versions, these symbols signify an automatic version bump (depending on the symbol).


    Minor and patch versions are backward compatible in terms of technology, lowering
    the chance of introducing flaws in the application.


    Because most third-party libraries provide hotfixes as patch version bumps, allowing
    automated patch updates to mitigate security concerns.


    Establish Validations to Avoid Injections


    As a general guideline, we should never rely solely on client-side validations
    because attackers can alter them whenever they choose. However, some JavaScript
    injections can be avoided by establishing validations for each input.


    If you put anything in the comment area with quotations script,script>, for example,
    those quotes will be changed with double - script>>script>. The JavaScript code
    you entered will not be executed.

    Cross-Site Scripting is the term for this (XSS).'
