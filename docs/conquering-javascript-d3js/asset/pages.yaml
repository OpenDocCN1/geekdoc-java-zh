  md: "# 184 Conquering JavaScript: D3.js\n\nThe lines series, chart components, and\
    \ d3fc extent are used in the above code. I will give you a quick explanation\
    \ of each one:\nThe extent component works in a similar way to D3’s extent function,\
    \ which calculates an array's maximum and lowest values. The d3fc extend component\
    \ lets allows you to set padding, symmetry, specified values, and other important\
    \ features — see the API docs for more information.\nThe mainValue/crossValue\
    \ properties define accessors on the underlying data, and the line series component\
    \ generates an SVG line.\nFinally, the chart component generates a chart that\
    \ has two axes and a plot area. By specifying it the plot area, the line series\
    \ is linked to the chart. Canvas components, such as seriesCanvasLine, are also\
    \ supported by the chart. The chart is responsive, meaning it will immediately\
    \ re-render if the element’s size changes.\nThese components all follow Mike Bostock’s\
    \ standard D3 component convention, allowing them to be rendered with D3 data\
    \ joins. As you can see, they are self-contained, which means you may use them\
    \ separately or in combination with other D3 code.\n\nFill the Space\nSome charting\
    \ libraries combine line, point, and area into a single series type whereas d3fc\
    \ advocates a “micro component” approach in which each is represented separately.\
    \ To achieve the delicate gradient effect in this chart, an additional area component\
    \ is required:\n\n```\nconst areaSeries = FC\n  .seriesSvgArea()\n  .baseValue(d\
    \ => yExtent(data) [0])\n  .mainValue(d => d.high)\n  .crossValue(d => d.date);\n\
    ```\n\nThe baseValue accessor is set to the minimal y-value, which is a constant\
    \ number. This guarantees that the gradient fill extends across the visible range\
    \ of values, rather than stretching down to zero.\nAnother d3fc component is gridlines:\n\
    \n```\nconst gridlines = FC\n  .annotationSvgGridline()\n```"
