    # INTEGRATING A MOVING AVERAGE


    Moving Average is added to the cart, which smooths the underlying data by calculating
    an average value based on the preceding “n” data points. It is one of the indicator
    components that is included in d3fc.


    The following code produces a 15-period moving average instance that computes
    on the “high” value (i.e, each point in the output data is the result of averaging
    the previous 15 values).


    The moving average is returned when the component instance is invoked with the
    chart data:


    ```

    const ma = FC

    .indicatorMovingAverage(())

    .value(d => d.high)

    .period(15);

    const maData = ma(data);

    ```


    D3 data joins work with a single array of data, merging the average into the current
    series is the simplest approach to add it to the chart. The following example
    clones each data point using an object spread and adds the moving average value:


    ```

    data = data.map((d, i) => ({ ma: maData[i], ...d }));

    ```'
