  md: "# Summary ■ 187\n\nTo determine the range of volume values, we must first establish\
    \ extent component:\n\n```\nconst volumeExtent = fc\n.extentLinear (\n  .include([0])\n\
    \  .pad([0, 2])\n  .ors([d => d.volume]);\nconst volumeDomain = volumeExtent(data);\n\
    ```\n\nThe padding of [0, 2] guarantees that the volume series is moved down to\
    \ the bottom third of the chart, while include ensures that the returned extent\
    \ contains zero.\n\nThe real magic begins with the following scale, which maps\
    \ the volume domain to the price domain:\n\n```\nconst volumeToPriceScale = d3\n\
    .scaleLinear()\n.domain(volumeDomain)\n.range(yExtent(data));\n```\n\nDeclaring\
    \ the scale mentioned above in maine accessor, the bar series component extracts\
    \ the volume data:\n\n```\nconst volumeSeries = FC\n.seriesSvgBar()\n.bandwidth(2)\n\
    .crossValue(d => d.date)\n.mainValue(d => volumeToPriceScale(d.volume))\n.decorate(see\
    \ =>\n sel\n  .enter()\n    .classed(\"volume\", true)\n    .attr(\"fill\", d\
    \ => d.open > d.close ? \"red\" : \"green\")\n);\n```\n\nThe decorate function\
    \ creates a selection (data join) that renders each individual bar as an SVG route\
    \ in this case. The attr function adjusts the color dependent on whether the price\
    \ is raising or lowering, which is an excellent example of the decorate pattern\
    \ in action!"
