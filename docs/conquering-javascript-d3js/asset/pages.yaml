  md: "# 36 ■ Conquering JavaScript: D3.js\n\nMoving a group around the SVG container\
    \ is done with the transform attribute. The transform attribute is a little more\
    \ intimidating than is identical to the CSS transform property attributes discussed\
    \ so far. It takes a transformation (translate, rotate, scale, etc.) or a stack\
    \ of transformations as values. To move a group, we use the translate(x,y) transformation.\
    \ If we want to move our <rect> and <text> elements to their original position,\
    \ we need to apply a translation of 260 pixels to the right and 175 pixels down\
    \ to the <g> element. To do so; we set its transform attribute to=\"translate(510,55)\"\
    .\n\n```\n<g transform=\"translate (510,55)\">\n  <rect x=\"0\" y=\"0\" width=\"\
    30\" height=\"50\" />\n  <text x=\"0\" y=\"45\">rect</text>\n</g>\n```\n\nBy it,\
    \ here we can add various codes of the Gallery of Shapes in D3 projects.\n\n#\
    \ CANVAS AND WebGL\n\nWe've already indicated that we frequently use SVG elements\
    \ in our D3 applications. We may occasionally need to produce complicated visualizations\
    \ from erroneous datasets, which the usual SVG technique can cause performance\
    \ problems. It's important to remember that, for each graphical detail in data\
    \ visualization, D3 appends one or many SVG nodes to the DOM. Big network visualization\
    \ with hundreds of nodes and links is a good illustration.\n\nCanvas is a client-side\
    \ API that creates graphics and animations using a script, most commonly JavaScript.\
    \ It doesn't add elements to the DOM, which dramatically improves performance\
    \ when building visualizations from large datasets. We may also use the WebGL\
    \ API to generate 3D objects with Canvas.\n\n# CASCADING STYLE SHEETS\n\nIt is\
    \ a programming language that describes how DOM elements are presented on the\
    \ screen and how they appear. From the overall grid layout of a page to the family\
    \ of fonts used for the text, up to the color of the circles in a scatterplot,\
    \ CSS can turn a plain HTML file into an awe-inspiring page. In D3 projects, we\
    \ generally apply CSS styles using inline styles"
  merge: -1
  pgno: 54
- img_proc: true
  md: "or via an external stylesheet. Inline styles are applied to elements with the\
    \ style attribute, as shown in the following example. The style attribute can\
    \ be used on both HTML and SVG elements, and D3 includes a convenient method for\
    \ setting or changing it.\n\n```\n<div style=\"padding: 18px; background: #00ced1;\"\
    > ...\n</div>\n```\n\n```\n<text style=\"font-size: 14px; font-family: serif;\"\
    > ...\n</text>\n```\n\nOnly the element to which inline styles are applied is\
    \ affected. If we wish to use the same design to several elements, we must provide\
    \ each of them the same style attribute. It does the job, although it isn't the\
    \ most efficient method.\n\nOn the other hand, external stylesheets are perfect\
    \ for applying styles globally. Asking D3 to add the same class name to many items\
    \ is one technique. We then use this class name as a selector in an external stylesheet\
    \ and apply the same styling properties to the targeted group of elements. This\
    \ approach is much more efficient, especially when maintaining large projects.\
    \ It also follows the separation of concerns principle, where we separate behaviors,\
    \ controlled with JavaScript, from styles, regulated by CSS.\n\nIn the CSS stylesheets:\n\
    \n```\n.my-class {\n  Font-size: 14 px;\n  Font-family: serif;\n}\n```\n\nIn the\
    \ DOM:\n\n```\n<text class=\"my-class\"> ... </text>\n```\n\nJavaScript\n\nThe\
    \ D3 library is a JavaScript library. It extends JavaScript’s fundamental functionality\
    \ by adding new functions. This means that a little bit of prior experience with\
    \ JavaScript is helpful when working with D3. It also means that you have access\
    \ to all existing JavaScript functionalities when creating D3 projects."
