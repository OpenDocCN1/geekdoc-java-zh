    </div>\n</body>\n</html>\n```\n\nIn the DOM, three categories of information about\
    \ each element define its behavior and appearance: styles, attributes, and properties.\
    \ Styles determine color, size, borders, opacity, and so on. but depending on\
    \ the type of element, some attributes can also impact the appearance. The position,\
