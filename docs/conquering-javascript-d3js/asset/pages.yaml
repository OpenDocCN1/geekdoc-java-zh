  md: '# Introduction to D3.js ■ 31


    readers. SVGs are also performant if built correctly, with file sizes that are
    a fraction of raster images. When creating data visualizations with D3, we usually
    inject SVG shapes into the DOM and modify their attributes to generate the visual
    elements that compose the visualization. Understanding how SVG works, the main
    SVG shapes and their presentational attributes are essential to most D3 projects.


    The first and foremost work that we have to do is to download ready-to-use code
    from the index.html from the SVG Shapes repository. Let''s start exploring vector
    graphics. We need to go to the ready-to-use code files (SVG_Shapes_Gallery) and
    right-click on the file index.html.


    Select a browser from the menu under Open with. Because of its excellent inspector
    features, we recommend using Chrome or Firefox. You''ll see a vector graphic when
    the file opens in a new browser tab.


    ![](img/7fba45ff5201792b222a9c70c681c49a_49_0.png)


    Suv graphics.


    The SVG graphic you are looking at contains the shapes you will use most often
    as you create D3 visualizations: lines, rectangles, circles, ellipses, paths,
    and text.


    When working with D3, you usually tell the library which shape(s) it should append
    to the DOM. You are also responsible for knowing which presentational attributes
    need to be calculated for the shape(s) to have the dimensions, color, and position
    that you are looking for.


    Let us use the code for each of the SVG elements in the above figure from below-mentioned
    source (https://d3js-in-action-third-edition.github.io/svg-shapes-gallery/).


    Open the index.html in your favorite code editor. We recommend Visual Studio Code,
    a free, easy-to-use code editor with a variety of essential features for front-end
    development. We propose Visual Studio Code, a editor that is free, simple to use,
