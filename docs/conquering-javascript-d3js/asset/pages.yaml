  md: '# Introduction to D3.js


    IN THIS CHAPTER


    +   - Basic about D3.js

    - Features of D3.js

    - Advantages and Disadvantages


    This chapter looks at why we need data visualizations and how to distribute them
    over the web to meet our communication goals. We will discuss the basic concept
    of a data visualization application using d3 and its various components.


    Let''s start by understanding the basics of data visualization.


    # CRASH COURSE OF D3.js


    If you work in finance, sales, marketing, or operations, you''ve surely noticed
    that big data is creeping into your daily routine. It will undoubtedly continue
    to develop for a good cause. The only problem is determining how to get insights
    from the data before making any decisions. Data visualization is a graphical representation
    of information and data. Using visual features such as charts, graphs, and maps,
    data visualization tools make it easy to explore and understand trends, outliers,
    and patterns in data. In the world of big data, data visualization tools and technologies
    are key to analyzing large amounts of data and making data-driven decisions.


    DOI: 10.1201/9781003356608-1'
  merge: -1
  pgno: 19
- img_proc: true
  md: '# Conquering JavaScript: D3.js


    Interactive visualizations can spice up even the monotonous information. A primary
    feature of interactive data is its ability to function as a single package. Allows
    users to select individual data points from which to illustrate the event. One
    of the effective methods of doing this is using JavaScript, specifically the D3.js
    framework.


    D3 (data-driven documents) is a JavaScript library developed by Mike Bostock,
    an American software engineer who developed this software at Stanford University
    during his PhD studies. Conceptually, it is similar to Protovis (a free and open-source
    graphical data visualization toolkit that uses JavaScript views for web-native
    visualizations and combines custom data views with simple marks such as bars and
    dots), except with D3 instead of static visualizations, focuses on interactions,
    transitions, and transformations.


    It has an official website: d3js.org and the D3 source code can be obtained using:
    https://github.com/d3/d3


    Unlike other data visualization frameworks, D3 allows you to be as creative as
    you want because you have complete control over the visuals you create. HTML,
    CSS, SVG, and JavaScript are among the web technologies used by D3.


    +   - D3 is very fast and supports code reuse.

    - It can handle large datasets and simplifies data loading and transformation.

    - It is useful for creating interactive visuals.


    ![](img/7fba45ff5201792b222a9c70c681c49a_20_0.png)


    Applications of D3.js.'
  merge: -1
  pgno: 20
- img_proc: true
  md: '# Introduction to D3.js ■ 3


    First, we need to familiarize ourselves with web standards before we can use D3
    to generate visualizations. Since D3 makes extensive use of the following web
    standards, we''ll briefly review them:


    +   HTML (HyperText Mark-up Language): The content of the website is structured
    using HTML. HTML 5 is the latest version. It is in a.html text file.


    HTMLCode:


    ```

    <DOCTYPE html>

    <html lang="en">

    <head>

    <meta charset="UTF-8">

    <p>India is the largely populated country.</p>

    <p>Tiger is National Animal and Peacock is National Bird.</p>

    </head>

    <body>

    </body>

    </html>

    ```


    Classical example of HTML.


    +   DOM (Document Object Model): When you write HTML code for a page, the browser
    converts it into a hierarchical structure. Every HTML tag is turned into a DOM
    element with a parent-child structure. It improves the logical structure of your
    HTML. It is easy to manipulate (add/modify/remove) the items on page once the
    DOM has been constructed. The initial “D” in D3 stands for Document, as we learned
    in the first chapter. D3 provides you with the ability to change the DOM using
    your data.'
  merge: -1
  pgno: 21
- img_proc: true
  md: "# Conquering JavaScript: D3.js\n\n+   CSS (Cascading Style Sheets): HTML gives\
    \ your web page structure, while CSS styles it to make it more appealing to the\
    \ eye. It's a stylesheet language for describing the appearance of an HTML or\
    \ XML document (including XML dialects like SVG or XHTML). CSS specifies what\
    \ elements on a web page should be displayed.\n\n```\nCSS\n<!DOCTYPE html>\n<html\
    \ lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<p>India is the largely populated\
    \ country.</p>\n<p>Tiger is National Animal and Peacock is National Bird.</p>\n\
    </head>\n<body>\n</body>\n</html>\n{\n  margin: 15px;\n  padding: 10px;\n  border:\
    \ 18px solid #999;\n}\n```\n\nClassical example of HTML and CSS.\n\n+   SVG (Scalable\
    \ Vector Graphics): SVG is a web-based image format that may be used to produce\
    \ images. It's a scalable vector, as the name implies. Resizing your browser will\
    \ not affect the image because it scales itself according to the size of the browser.\
    \ Except for Internet Explorer 8 and lower, all browsers support SVG. Because\
    \ data visualizations are visual representations, it's easier to render visualizations\
    \ using D3 using SVG.\n\n```\n<DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta\
    \ charset=\"UTF-8\">\n<svg width=\"500\" height=\"500\">\n<rect x=\"0\" y=\"0\"\
    \ width=\"300\" height=\"200\"></rect>\n</svg>\n</head>\n<body>\n</body>\n</html>\n\
    ```\n\nClassical example of HTML and SVG."
  merge: -1
  pgno: 22
