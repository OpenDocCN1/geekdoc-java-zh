  md: '# ANGULAR AND D3 INSTALLATION


    To create new applications and components, Angular uses a command-line interface.
    To get started, you will need Node.js and npm installed. If you are unfamiliar
    with Angular, you may read the local setup guide to learn more about the process,
    or you can skip the walkthrough and download the final application from GitHub.


    Install the Angular CLI first. The command-line tool makes it simple to get started
    with new Angular projects:


    ```

    npm install -g @angular/cli

    ```


    Create a new Angular App next. You may call anything you want, but I''ll go with
    angular-d3:


    ```

    ng new angular-d3

    ```


    Finally, enter the new project as follows:


    ```

    cd angular-d3/

    ```


    Then, through npm, install D3 and the D3 type definitions. Type declarations would
    enable TypeScript to add type hints to non-TypeScript D3 code.


    ```

    npm install d3 && npm install @types/d3 --save-dev

    ```


    Using the Angular CLI, create three new components. D3 will be used in the next
    phases to create data visualizations.


    First, there''s the bar:


    ```

    ng g component bar

    ```


    Then there''s the pie:


    ```

    ng g component pie

    ```


    And then there is the scatter element:


    ```

    ng g component scatter

    ```'
