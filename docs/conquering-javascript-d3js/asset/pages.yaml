    A 3D model is made up of the following elements:


    +   - Scene


    +   - Camera


    +   - Mesh


    +   - Lighting


    Before we directly jump to the coding section we must first talk about the overview
    of 3D web design in brief. As the title recommends 3D web application is a website
    that is rendered in three dimensions. When constructing a 3D world, your browser,
    like any other online application, needs to know what to display and show. In
    this approach, building a scene is similar to telling the browser that you''re
    preparing your presentation. The camera establishes the user''s viewport and informs
    the browser of our position in relation to the scene''s center. Finally, the renderer
    instructs the browser to display the elements we''ve constructed and placed in
    our scene. The "canvas" element in HTML is used to accomplish this. It was fashioned
    to shape and show dynamic, animatable illustrations that the customer can lure.
    Individuals were not just placed with all of that, and WebGL which helped in controlling
    the canvas in three dimensions. WebGL is a cross-platform web standard for a low-level
    3D graphics API based on OpenGL ES, which is available to ECMAScript via the HTML5
    Canvas element.


    But don''t worry if you don''t grasp what that implies. All we need to know that
    we can make 3D webpages with WebGL. We should probably know that it is typically
    considered a highly complex API to work in, and requires enormous amounts of code
    to achieve very simple things. That is what takes us to Three.js. Three.js is
    a JavaScript framework that acts as a translator between the programmer and WebGL,
    making it easier to write 3D code. It mostly accomplishes this by abstracting
    WebGL into a more comprehensible set of functions and classes. As is you code
    in Three.js, Three.js is writing dozens of lines of WebGL for you behind the scenes.


