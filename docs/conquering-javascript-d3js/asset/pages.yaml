  md: "# 186 Conquerering JavaScript: D3.js\n\nD3 maintains a clear distinction between\
    \ data and its visual representation, and d3fc follows suit. We only need to add\
    \ another series to the chart to represent the moving average:\n\n```\nconst movingAverageSeries\
    \ = FC\n  .seriesSvgLine(\n    .mainValue(d => d.ma)\n    .crossValue(d => d.date)\n\
    \  .decorate(see =>\n    sel.enter()\n      .classed(\"ma\", true)\n  );\n```\n\
    \nThe multi-series component displayed above is used to add the above series to\
    \ the chart.\n\nYou might be wondering why that using decorating method exists.\
    \ This exposes the causal data that the module utilizes to condense itself, which\
    \ is one of the fundamental characteristics of d3fc. This means you can manipulate\
    \ the component with the full power of D3. We're only adding a class with the\
    \ enter selection in this example, but you can do a lot more fascinating and powerful\
    \ things with decorating! This means you can manipulate the component with the\
    \ full power of D3. We're only adding a class with the enter selection in this\
    \ example, but you can do a lot more fascinating and powerful things with decorating!\n\
    \nThe chart is starting to look a little more intriguing now that the moving average\
    \ is in place.\n\nIncluding a Volume Set\n\nThe Yahoo chart we're reproducing\
    \ displays the stock's traded volume as a bar chart, with green bars indicating\
    \ rising prices and red bars declining prices. The way this series is displayed\
    \ is a little unusual; the volume series is displayed in the same region as the\
    \ main price series, but only takes the upper third of the chart. Additionally,\
    \ there is no obvious axis.\n\nYou can use the design pattern mentioned above\
    \ to add more plot sections to the chart, but there's a quicker way to accomplish\
    \ it for the volume series!\n\nD3 scales are a useful notion for mapping from\
    \ one domain to another. The volume series can be easily added by mapping the\
    \ volume domain onto the price domain and rendering it at the same scale. This\
    \ is pretty straightforward."
