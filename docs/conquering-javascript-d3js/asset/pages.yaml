  md: "# Summary ■ 183\n\n```\nconst loadDataEndOfDay = d3.csv(\"/yahoo.csv\", d =>\
    \ {\n  date: new Date(d.timestamp * 1000),\nvolume: Number(d.volume),\nhigh: Number(d.high),\n\
    low: Number(d.low),\nopen: Number(d.open),\nclose: Number(d.close)\n});\n```\n\
    \n```\nloadDataEndOfDay.then(data => {\n  // render the chart here\n});\n```\n\
    \nFor the chart to be rendered, we'll need an HTML element:\n\n```\n<div id=\"\
    chart-element\" style=\"height: 500px\"></div>\n```\n\nWe employ a minimal amount\
    \ of d3fc components to render the data once it has been loaded:\n\n```\nconst\
    \ xExtent = fc.extentDate()\n  .nice([d => d.date]);\nconst yExtent = fc.extentLinear()\n\
    \  .pad([0.1, 0.1])\n  .nice([d => d.high, d => d.low]);\n```\n\n```\nconst lineSeries\
    \ = fc\n  .svgLine()\n  .mainValue(d => d.high)\n  .crossValue(d => d.date);\n\
    ```\n\n```\nconst chart = fc\n  .chartCartesian(d3.scaleTime(), d3.scaleLinear())\n\
    \  .yOrient(\"right\")\n  .ydomain(yExtent(data))\n  .xdomain(xExtent(data))\n\
    \  .svgPlotArea(lineSeries);\n```\n\n```\nd3.select(\"#chart-element\")\n  .datum(data)\n\
    \  .call(chart);\n```"
