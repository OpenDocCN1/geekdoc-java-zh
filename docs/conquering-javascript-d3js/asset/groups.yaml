  - "[PAGE 201]\n\n# Summary ■ 183\n\n```\nconst loadDataEndOfDay = d3.csv(\"/yahoo.csv\"\
    , d => {\n  date: new Date(d.timestamp * 1000),\nvolume: Number(d.volume),\nhigh:\
    \ Number(d.high),\nlow: Number(d.low),\nopen: Number(d.open),\nclose: Number(d.close)\n\
    });\n```\n\n```\nloadDataEndOfDay.then(data => {\n  // render the chart here\n\
    });\n```\n\nFor the chart to be rendered, we'll need an HTML element:\n\n```\n\
    <div id=\"chart-element\" style=\"height: 500px\"></div>\n```\n\nWe employ a minimal\
    \ amount of d3fc components to render the data once it has been loaded:\n\n```\n\
    const xExtent = fc.extentDate()\n  .nice([d => d.date]);\nconst yExtent = fc.extentLinear()\n\
    \  .pad([0.1, 0.1])\n  .nice([d => d.high, d => d.low]);\n```\n\n```\nconst lineSeries\
    \ = fc\n  .svgLine()\n  .mainValue(d => d.high)\n  .crossValue(d => d.date);\n\
    ```\n\n```\nconst chart = fc\n  .chartCartesian(d3.scaleTime(), d3.scaleLinear())\n\
    \  .yOrient(\"right\")\n  .ydomain(yExtent(data))\n  .xdomain(xExtent(data))\n\
    \  .svgPlotArea(lineSeries);\n```\n\n```\nd3.select(\"#chart-element\")\n  .datum(data)\n\
    \  .call(chart);\n```"
- md: "\n## 184 Conquering JavaScript: D3.js\n\nThe lines series, chart components,\
    \ and d3fc extent are used in the above code. I will give you a quick explanation\
    \ of each one:\n\nThe extent component works in a similar way to D3’s extent function,\
    \ which calculates an array's maximum and lowest values. The d3fc extend component\
    \ allows you to set padding, symmetry, specified values, and other important features\
    \ — see the API docs for more information.\n\nThe mainValue/crossValue properties\
    \ define accessors on the underlying data, and the line series component generates\
    \ an SVG line.\n\nFinally, the chart component generates a chart that has two\
    \ axes and a plot area. By specifying the plot area, the line series is linked\
    \ to the chart. Canvas components, such as seriesCanvasLine, are also supported\
    \ by the chart. The chart is responsive, meaning it will immediately re-render\
    \ if the element’s size changes.\n\nThese components all follow Mike Bostock’s\
    \ standard D3 component convention, allowing them to be rendered with D3 data\
    \ joins. As you can see, they are self-contained, which means you may use them\
    \ separately or in combination with other D3 code.\n\n### Fill the Space\n\nSome\
    \ charting libraries combine line, point, and area into a single series type whereas\
    \ d3fc advocates a “micro component” approach in which each is represented separately.\
    \ To achieve the delicate gradient effect in this chart, an additional area component\
    \ is required:\n\n```javascript\nconst areaSeries = FC\n  .seriesSvgArea()\n \
    \ .baseValue(d => yExtent(data) [0])\n  .mainValue(d => d.high)\n  .crossValue(d\
    \ => d.date);\n```\n\nThe baseValue accessor is set to the minimal y-value, which\
    \ is a constant number. This guarantees that the gradient fill extends across\
    \ the visible range of values, rather than stretching down to zero.\n\nAnother\
    \ d3fc component is gridlines:\n\n```javascript\nconst gridlines = FC\n  .annotationSvgGridline()\n\
    \  .yTicks(5)\n  .xticks(0);\n```\n\nA single series can be plotted on the chart\
    \ plot area, however, many series instances can be joined together using a multi-series:\n\
    \n```javascript\nconst multi = fc.seriesSvgMulti()\n.series = [gridlines, areaSeries,\
    \ lineSeries];\nconst chart = FC\n// ...\nsvgPlotArea(multi);\n```\n\nAll d3 series\
    \ components provide x and y scale features that are refixed by the charts itself\
    \ when an element is added to the plot area, which is not immediately visible.\
    \ The scales are passed onto each of the sub-series by the multi-series.\n\n##\
    \ INTEGRATING A MOVING AVERAGE\n\nMoving Average is added to the chart, which\
    \ smooths the underlying data by calculating an average value based on the preceding\
    \ “n” data points. It is one of the indicator components that is included in d3fc.\n\
    \nThe following code produces a 15-period moving average instance that computes\
    \ on the “high” value (i.e, each point in the output data is the result of averaging\
    \ the previous 15 values).\n\nThe moving average is returned when the component\
    \ instance is invoked with the chart data:\n\n```javascript\nconst ma = FC\n.indicatorMovingAverage()\n\
    .value(d => d.high)\n.period(15);\nconst maData = ma(data);\n```\n\nD3 data joins\
    \ work with a single array of data, merging the average into the current series\
    \ is the simplest approach to add it to the chart. The following example clones\
    \ each data point using an object spread and adds the moving average value:\n\n\
    ```javascript\ndata = data.map((d, i) => ({ ma: maData[i], ...d }));\n```\n\n\
    ## 186 Conquerering JavaScript: D3.js\n\nD3 maintains a clear distinction between\
    \ data and its visual representation, and d3fc follows suit. We only need to add\
    \ another series to the chart to represent the moving average:\n\n```javascript\n\
    const movingAverageSeries = FC\n  .seriesSvgLine()\n    .mainValue(d => d.ma)\n\
    \    .crossValue(d => d.date)\n  .decorate(see =>\n    sel.enter()\n      .classed(\"\
    ma\", true)\n  );\n```\n\nThe multi-series component displayed above is used to\
    \ add the above series to the chart.\n\nYou might be wondering why that decorating\
    \ method exists. This exposes the causal data that the module utilizes to condense\
    \ itself, which is one of the fundamental characteristics of d3fc. This means\
    \ you can manipulate the component with the full power of D3. We're only adding\
    \ a class with the enter selection in this example, but you can do a lot more\
    \ fascinating and powerful things with decorating!\n\nThe chart is starting to\
    \ look a little more intriguing now that the moving average is in place.\n\n###\
    \ Including a Volume Set\n\nThe Yahoo chart we'reproducing displays the stock's\
    \ traded volume as a bar chart, with green bars indicating rising prices and red\
    \ bars declining prices. The way this series is displayed is a little unusual;\
    \ the volume series is displayed in the same region as the main price series,\
    \ but only takes the upper third of the chart. Additionally, there is no obvious\
    \ axis.\n\nYou can use the design pattern mentioned above to add more plot sections\
    \ to the chart, but there's a quicker way to accomplish it for the volume series!\n\
    \nD3 scales are a useful notion for mapping from one domain to another. The volume\
    \ series can be easily added by mapping the volume domain onto the price domain\
    \ and rendering it. This is straightforward.\n\nTo determine the range of volume,\
    \ we must first establish the extent:\n\n```javascript\nconst volumeExtent = FC\n\
    \  .extent()\n  .domain(volumeDomain)\n  .range([0, 2]);\n```\n\nMapping the volume\
    \ domain to the price domain:\n\n```javascript\nconst volumeToScale = d3\n  .scaleLinear()\n\
    \  .domain(volumeDomain)\n  .range(yExtent);\n```\n\nDeclaring the scale mentioned\
    \ above, the bar series extracts the volume:\n\n```javascript\nconst volumeSeries\
    \ = FC\n  .seriesSvgBar()\n  .bandwidth(2)\n  .crossValue(d => d.date)\n  .mainValue(d\
    \ => volumeToScale(d.volume))\n  .decorate(see =>\n    sel.enter()\n      .classed(\"\
    volume\", true)\n      .attr(\"fill\", d => d.open > d.close ? \"red\" : \"green\"\
    )\n  );\n```\n\nThe decorate function creates a selection (data join) that renders\
    \ each individual bar in this case. The attr function adjusts the color dependent\
    \ on whether the price is raising or lowering.\n\n### Inserting Legend\n\nThe\
    \ chart's legend is a basic table that displays the open, high, low, close, and\
    \ volume numbers for the chart's most recent data point. This information is straightforward\
    \ to present using a D3 data join, which is why we haven't included a legend component\
    \ in d3fc – it would be useless.\n\nFor the sake of clarity, it's still worth\
    \ wrapping the component functionality (and potential re-use).\n\nHere's a basic\
    \ legend component that takes an array of objects with name and value properties\
    \ as input:\n\n```javascript\nconst legend = () => {\n  const labelJoin = fc.dataJoin(\"\
    text\", \"legend-label\");\n  const valueJoin = FC.dataJoin(\"text\", \"legend-value\"\
    );\n\n  const instance = selection => {\n    selection.each((data, selectionIndex,\
    \ nodes) => {\n      labelJoin(d3.select(nodes[selectionIndex]))\n        .attr(\"\
    transform\", (d, i) => \"translate(50, \" + (i + 1) * 15 + \" )\")\n        .text(d\
    \ => d.name);\n      valueJoin(d3.select(nodes[selectionIndex]))\n        .attr(\"\
    transform\", (d, i) => \"translate(60, \" + (i + 1) * 15 + \" )\")\n        .text(d\
    \ => d.value);\n    });\n  };\n\n  return instance;\n};\n```\n"
  mdcn: "\n\n## 184 征服 JavaScript：D3.js\n\n上述代码使用了折线系列（lines series）、图表组件和 d3fc extent。我将对每一项进行简要说明：\n\
    \n`extent` 组件的工作方式类似于 D3 的 `extent` 函数，它用于计算数组的最大值和最小值。`d3fc extend` 组件允许你设置填充（padding）、对称性、指定值以及其他重要特性——更多信息请参\
    \ API 文档。\n\n`mainValue` / `crossValue` 属性定义了底层数据的访问器，而折线系列组件则生成一条 SVG 线。\n\n\
    最后，图表组件生成了一个具有两个坐标轴和一个绘图区域的图表。通过指定绘图区域，折线系列与图表相关联。图表还支持 Canvas 组件，例如 `seriesCanvasLine`。图表是响应式的，这意味着当元素尺寸发生变化时，它会立即重新渲染。\n\
    \n这些组件都遵循 Mike Bostock 的标准 D3 组件规范，允许它们通过 D3 数据连接（data joins）进行渲染。如你所见，它们是自包含的，这意味着你可以单独使用它们，也可以与其他\
    \ D3 代码结合使用。\n\n### 填充空间\n\n某些图表库将线、点和面积合并为单一系列类型，而 d3fc 提倡“微组件”方法，即每种类型都单独表示。为了实现图表中精细的渐变效果，需要额外的面积组件：\n\
    \n```javascript\nconst areaSeries = FC\n  .seriesSvgArea()\n  .baseValue(d =>\
    \ yExtent(data) [0])\n  .mainValue(d => d.high)\n  .crossValue(d => d.date);\n\
    ```\n\n`baseValue` 访问器被设置为最小 y 值，这是一个常数。这保证了渐变填充跨越数值的可见范围，而不是拉伸到零。\n\n另一个 d3fc\
    \ 组件是网格线（gridlines）：\n\n```javascript\nconst gridlines = FC\n  .annotationSvgGridline()\n\
    \  .yTicks(5)\n  .xticks(0);\n```\n\n一个系列可以绘制在图表的绘图区域上，但可以使用多系列（multi-series）将多个实例连接在一起：\n\
    \n```javascript\nconst multi = fc.seriesSvgMulti()\n.series = [gridlines, areaSeries,\
    \ lineSeries];\nconst chart = FC\n// ...\nsvgPlotArea(multi);\n```\n\n所有 d3 系列组件都提供\
    \ x 和 y 比例尺（scale）功能，当元素添加到绘图区域时，比例尺会由图表本身重新固定（这立即可见）。比例尺通过多系列传递给每个子系列。\n\n##\
    \ 集成移动平均线\n\n图表添加了移动平均线（Moving Average），它通过根据之前的“n”个数据点计算平均值来平滑底层数据。它是 d3fc 包含指标组件之一。\n\
    \n以下代码生成了一个 15 期的移动平均线实例，它对“high”值进行计算（即输出数据中的每个点都是之前 15 个值的平均结果）。\n\n当使用图表数据调用组件实例时会返回移动平均值：\n\
    \n```javascript\nconst ma = FC\n.indicatorMovingAverage()\n.value(d => d.high)\n\
    .period(15);\nconst maData = ma(data);\n```\n\nD3 数据连接与单个数据数组工作，将平均值合并到当前系列是将其添加到图表的简单方法。以下示例使用对象展开克隆每个数据点，并添加移动平均值：\n\
    \n```javascript\ndata = data.map((d, i) => ({ ma: maData[i], ...d }));\n```\n\n\
    ## 186 征服 JavaScript：D3.js\n\nD3 在数据与其视觉表示之间保持着清晰的区分，d3fc 也是如此。我们只需要向图表添加另一个另一个系列来表示移动平均线：\n\
    \n```javascript\nconst movingAverageSeries = FC\n  .seriesSvgLine()\n    .mainValue(d\
    \ => d.ma)\n    .crossValue(d => d.date)\n  .decorate(see =>\n    sel.enter()\n\
    \      .classed(\"ma\", true)\n  );\n```\n\n上面显示的多系列组件用于将上述系列添加到图表中。\n\n你可能会疑惑为什么存在这种装饰（decorating）方法。它暴露了模块用于压缩自身时利用的因果数据，这是\
    \ d3fc 的基本特征之一。这意味着你可以利用 D3 的完整威力来操作组件。在示例中，我们只在 `enter` 选择中添加了一个类，但你可以通过装饰做许多更多有趣且强大的事情！\n\
    \n随着移动平均线的到位，图表现在看起来更有趣了。\n\n### 包含成交量集\n\n我们正在复制的雅虎图表以柱状图显示股票成交量，绿色柱表示价格上涨，红色柱表示价格下跌。该系列的显示方式有点不同常；成交量系列与主价格系列在同一区域显示，但只占据图表的上三分之一。此外，没有明显的轴。\n\
    \n你可以使用上述设计模式为图表添加更多绘图区域，但对于成交量系列，有一种更快的方法！\n\nD3 比例尺是从一个域映射到另一个域的有用概念。通过将成交量域映射到价格域并进行渲染，很容易添加成交量系列。这非常直接。\n\
    \n要确定成交量的范围，我们必须建立范围（extent）：\n\n```javascript\nconst volumeExtent = FC\n  .extent()\n\
    \  .domain(volumeDomain)\n  .range([0, 2]);\n```\n\n将成交量域映射到价格域：\n\n```javascript\n\
    const volumeToScale = d3\n  .scaleLinear()\n  .domain(volumeDomain)\n  .range(yExtent);\n\
    ```\n\n在使用上述比例尺后，柱状系列提取成交量：\n\n```javascript\nconst volumeSeries = FC\n  .seriesSvgBar()\n\
    \  .bandwidth(2)\n  .crossValue(d => d.date)\n  .mainValue(d => volumeToScale(d.volume))\n\
    \  .decorate(see =>\n    sel.enter()\n      .classed(\"volume\", true)\n     \
    \ .attr(\"fill\", d => d.open > d.close ? \"red\" : \"green\")\n  );\n```\n\n\
    装饰函数创建了一个选择（数据连接），渲染每个柱。属性函数根据价格的上升调整颜色。\n\n### 插入图例\n\n图表的图例是一个基础表格，显示图表最新数据点的开盘、最高、最低、收盘和成交量。使用\
    \ D3 数据连接呈现这些信息很容易，这就是为什么我们没有在 d3fc 中包含图例组件。\n\n为了清晰起见，封装组件以及可能的重用仍然是有价值。\n\n\
    这是一个接收带有 `name` 和 `value` 属性的对象数组作为输入的基础图例组件：\n\n```javascript\nconst legend =\
    \ () => {\n  const labelJoin = fc.dataJoin(\"text\", \"legend-label\");\n  const\
    \ valueJoin = FC.dataJoin(\"text\", \"legend-value\");\n\n  const instance = selection\
    \ => {\n    selection.each((data, selectionIndex, nodes) => {\n      labelJoin(d3.select(nodes[selectionIndex]))\n\
    \        .attr(\"transform\", (d, i) => \"translate(50, \" + (i + 1) * 15 + \"\
    \ )\")\n        .text(d => d.name);\n      valueJoin(d3.select(nodes[selectionIndex]))\n\
    \        .attr(\"transform\", (d, i) => \"translate(60, \" + (i + 1) * 15 + \"\
    \ )\")\n        .text(d => d.value);\n    });\n  };\n\n  return instance;\n};\n\
    ```\n\n"
