    WRITING OPTIMIZED AND EFFICIENT CODE


    We make decisions and choose between solutions that may appear reasonable while
    writing code. Later, it is frequently discovered that some choices result in a
    more efficient program than others, prompting a search for best coding practices
    and optimization approaches. We begin to view the entire development process as
    an optimization problem.


    Although optimization concerns are not the only ones that developers deal with
    on a daily basis (other decisions and searching issues abound), it is the work
    that encompasses the most stages of web creation. Depending on how close the optimization
    is to machine code, code optimization can occur at several levels. We can only
    execute higher-level optimizations in web development because assembly- or runtime-level
    optimizations are not a choice, but we still have many options.


