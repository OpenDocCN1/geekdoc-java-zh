  mdcn: "\n\n## 124 征服 JavaScript: D3.js\n\n我们可以通过将编码风格指南整合到工作流中提高团队性能。我们可以在架构层面使用智能设计模式来优化代码，在源代码层面使用最佳编码实践和相关工具，并在团队层面使用最佳编码实践和适当工具。\n\
    \n无论我们采用何种方法，在每个代码优化任务中似乎都有一条必须遵循的基本规则：效率永远永远不能扭曲脚本的含义。随着项目的增长，代码优化的优势会不断增加，因为即使是小项目也会随着时间的推移而变得巨大，学习卓越的代码优化技能几乎总是会有显著收益。\n\
    \n## 熟悉异步编程\n\n你的应用程序可能需要进行多次 API 调用来获取数据。为每个函数获取不同的中间件是解决此问题的方法之一。由于 JavaScript\
    \ 是单线程的，它具有几个同步组件。这些组件具有锁定整个程序的风险。\n\n然而，JavaScript 的 async 特性有助于高效地管理异步代码。因此，异步代码被放入事件队列中，在所有其他代码执行完成后执行。即使使用了\
    \ JavaScript 的异步功能，也可能使用外部库来退回到同步阻塞调用。这会对整体性能产生负面影响。\n\n处理此问题的最好方法是在代码中使用异步 API。然而，你应该记住，对于初学者来说，学习异步编程的复杂性可能是困难。\n\
    \n在 D3 中，当你在应用加载页面时，它会异步加载 HTML、CSS 和 JS。如果某个功能无法，它将是唯一没有加载的那个。如果你更新了某个功能的数据，你不需要重新加载页面，因为它会在你交互时进行更新。\n\
    \n## 匿名函数和 D3 函数\n\n这类似于 Python 中的 lambda 函数。\n\n这是在 D3 v4 中导入 CSV 文件的方法。如 D3\
    \ 示例所示，你也可以使用 promises加载文件。使用 Promises 加载 CSV 文件：\n\n```javascript\nd3.csv(\"\
    file.csv\", function(data) {\n  somethingHappens(data);\n});\nconsole.log(data);\n\
    ```\n\n这是一个匿名回调函数 (data)。它在返回此函数之前会执行大括号内的代码。\n\n即使数据没有被完全加载，脚本也会继续运行 `console.log(data)`。此时控制台将不会显示任何数据。你可以干预这段代码并添加一个计时器，但我们给该函数留多少时间呢？\n\
    \n```javascript\nd3.csv(\"file.csv\", function(data) {\n  somethingHappens(data);\n\
    });\nsomeSortOfTimer(60);\nconsole.log(data);\n```\n\n相反，请在回调函数中编写所有使用加载数据的代码：\n\
    \n```javascript\nd3.csv(\"file.csv\", function(data) {\n  somethingHappens(data);\n\
    \  console.log(data);\n});\n```\n\n## 保持代码简洁直接\n\n代码尽可能轻量紧凑对于保留移动应用的卓越性能至关重要。保持代码短小可以减少延迟并提高速度。提高性能的另一种方法是将多个\
    \ JS 文件合并并减少为一个。如果你的应用有七个 JavaScript 文件，浏览器将需要发送七不同的 HTTP 请求来获取它们。为了避免这种情况，可以将这七个文件合并为一个精简的文件。\n\
    \n## 尽可能避免循环\n\n不建议在 JavaScript 中使用循环，因为它会给浏览器带来额外负担。值得注意的是循环所需的精力较少。你投入循环的精力越多，它完成得越快。还有其他简单的解决方案，例如将数组长度保存在单独的变量中，而不是每次循环迭代时都获取它。这可能有助于我们改进代码并让运行得更好。\n\
    \n一个从 1 到 10 的 for 循环：\n\n```javascript\nvar i;\nfor (i = 0; i < 10; i++) {\n\
    \  console.log(i)\n}\n```\n\n包含所有列表元素的 for 循环：（注意它不会返回 a、b 或 c。）\n\n```javascript\n\
    var allGroup = [\"a\", \"b\", \"c\"]\nfor (i in allGroup) {\n  console.log(i)\n\
    }\n```\n\nwhile 循环中从 0 数到 10：\n\n```javascript\nwhile (i < 10) {\n  console.log(i)\n\
    \  i++;\n}\n```\n\n### 减少 DOM 访问\n\n在 JavaScript 原生环境之外，浏览器与对象（DOM）的交互会导致大量的性能延迟和不可预测性。这是因为浏览器每次必须刷新，而可以通过限制\
    \ DOM 访问来避免。可以通过可以通过方式实现。例如，你可以保存浏览器对象的引用或减少 DOM 遍历的次数。\n\n### 对象缓存提高效率\n\n这可以通过两种方式实现。HTTP\
    \ 协议缓存是第一种选择。第二种选择是使用 JavaScript Cache API，可以通过安装 service workers 完成。脚本通常用于访问特定对象。通过使用关于该对象的变量或将重复访问的对象留在用户定义的变量中，你可以获得显著的性能提升。\n\
    \n## 避免占用过多内存\n\nJavaScript 开发者必须具备的最关键才能之一是管理内存使用的能力。这是因为确定设备运行时时的 RAM 要求是挑战性的。\n\
    \n## 延迟 JavaScript 加载\n\n用户自然地希望页面加载快速。这种方法允许你延迟 JavaScript 直到页面完成。\n\n### 消除内存泄漏\n\
    \n内存泄漏通常是由 DOM 片阻止垃圾回收器移除它们引起的。有很多工具可以判断你的网站是否存在泄漏。Chrome Dev Tools 是这些工具之一，时间记录在\
    \ performance 标签页中。\n\n## 加固与安全\n\n今天，JavaScript 被广泛使用。它在你的浏览器和后端都能工作。此外，JavaScript\
    \ 生态系统严重依赖第三方库。因此，为了安全 JavaScript，必须遵循最佳实践以减少攻击面。\n\n## 客户端攻击和数据外泄\n\n我们必须检查攻击者针对\
    \ JavaScript 源代码本身的安全风险，以及在浏览器中执行任意 JavaScript 的危险。我们看到网络供应链攻击的增加\n\n"
