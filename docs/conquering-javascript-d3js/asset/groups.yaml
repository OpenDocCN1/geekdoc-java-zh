    \ symbol, current price, net change, percent change, volume, and value.\n- Create\
    \ a Python dictionary from the parsed data.\n- Get the dictionary back.\n\nWhat\
    \ happened? Need assistance? Consider the following scenario:\n\n```python\nimport\
    \ CSV\nimport requests\n```\n\n## 174 Conquering JavaScript: D3.js\n\nURL = \"\
    http://www.nasdaq.com/quotes/nasdaq-100-stocks.aspx?render=download\"\n\n```python\n\
    def get_data():\n    r = requests.get(URL)\n    data = {'children': []}\n    RESULTS\
    \ = {}\n    for line in csv.DictReader(r.text.splitlines(skipinitialspace=True)):\n\
    \        RESULTS['children'].append({\n            'name': line['Name'],\n   \
    \         'symbol': line['Symbol'],\n            'price': line['lastsale'],\n\
    \            'net_change': line['netchange'],\n            'percent_change': line['pctchange'],\n\
    \            'volume': line['share_volume'],\n            'value': line['Nasdaq100_points']\n\
    \        })\n    return RESULTS\n```\n\n## What's Going On?\n\nWe use a GET request\
    \ to get the URL, then convert the Response object, r, to Unicode. The comma-delimited\
    \ text is then converted into an instance of the DictReader class, which will\
    \ not convert the data to a list but will choose a dictionary rather than a list,\
    \ using the CSV library.\n\nFinally, we return the RESULTS dict after looping\
    \ through the data and constructing a list of dictionaries (each dictionary representing\
