- md: "\n## D3.js FOR FRONTEND DEVELOPMENT\n\nTo be honest, you're probably here to\
    \ see if D3.js is worth considering for this type of visualization or to see how\
    \ simple it is to learn. That is also why I will not spend your time reading the\
    \ HTML file. Simply create an index.html file in the public/templates/ directory\
    \ and paste the contents into it. Only one line stands out:\n\n```html\n<canvas\
    \ width=\"800\" height=\"600\" style=\"border-...\"></canvas>\n```\n\nThis line\
    \ is significant because you must first decide whether to utilize canvas or SVG\
    \ before moving on the next step. As is often the case, the answer is that it\
    \ depends on the situation.\n\nAn excellent overview of the two technologies can\
    \ be found in this Stack Overflow post. In short, the canvas is more challenging\
    \ to master and interact with, but SVG is more intuitive and straightforward to\
    \ model interactions with. On the other hand, Canvas is more performant and is\
    \ perhaps best suited for large datasets like ours. We can use both at the same\
    \ time. We are showing the entire network in this post, but you can do so if you\
    \ only want to see a portion.\n\n```javascript\nconst width = 800;\nconst height\
    \ = 600;\nvar links;\nvar nodes;\nvar simulation;\nvar transform;\n```\n\nThese\
    \ are only some of the script's global variables. Now let's retrieve the context\
    \ for the canvas element:\n\n```javascript\nvar canvas = d3.select(\"canvas\"\
    );\nvar context = canvas.node().getContext('2d');\n```\n\nThe following step is\
    \ to create an HTTP request to get data from the server:\n\n```javascript\nvar\
    \ xmlhttp = new XMLHttpRequest();\nxmlhttp.open(\"GET\", '/load-all', true);\n\
    ```\n\n## 118 Conquering JavaScript: D3.js\n\n```javascript\nxmlhttp.setRequestHeader('Content-type',\
