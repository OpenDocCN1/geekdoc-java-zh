    Data joins are the technique by which D3 binds data to DOM elements via selects,
    as discussed in Mike Bostock’s essay “Thinking with Joins."


    Data joins allow us to match the data we provide to already existing elements,
    missing items, and eliminate no longer needed pieces. They employ D3.js selects,
    when paired with data, divide the selected items into three groups: those that
    must be created (the enter group), those that must be modified (the update group),
    and those that must be removed (the remove group) (the exit group).


