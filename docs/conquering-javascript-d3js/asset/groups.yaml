    //run game loop {update, render, repeat}\nvar GameLoop = function() {\n  requestAnimationFrame(GameLoop);\n\
    \  update();\n  render();\n};\n```\n\n```javascript\nGameLoop();\n</script>\n\
    </body>\n</html>\n```\n\nThe scene object generated var renderer = new THREE.WebGLRenderer();\
    \ represents the full 3D world.\n\nEvery frame, the update function on var update\
