    \n## D3 格式化信息可视化标准\n\n信息可视化（Info viz）从未像现在这样流行。无论是在工作中、休闲时间中还是日常生活中，都有大量的地图、图表以及系统和统计数据的复杂表示形式。这种流行导致了用于数据和信息可视化的类及其子类的库不断增加，以及为了提高可读性和理解力的审美指南。\n\
