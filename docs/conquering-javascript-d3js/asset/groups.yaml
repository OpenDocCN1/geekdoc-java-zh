- md: "\n## 124 Conquering JavaScript: D3.js\n\nWe can improve our team’s performance\
    \ by incorporating coding style guides into our workflow. We can optimize our\
    \ code using intelligent design patterns at the architectural level, best coding\
    \ practices and relevant tools at the source code level, and best coding practices\
    \ and appropriate tools at the team level.\n\nRegardless of the approach we employ,\
    \ there seems to be one basic rule which must be followed in every code optimization\
    \ task: efficiency should never ever twist the meaning of the script. The advantages\
    \ of code optimization increase as our project grows, because even small projects\
    \ can grow huge over time, learning excellent code optimization skills almost\
    \ always yields significant benefits.\n\n## GET FAMILIAR WITH ASYNCHRONOUS PROGRAMMING\n\
    \nYour application would need to make multiple API calls to get the data. Getting\
    \ different middleware for each function is one method to overcome this problem.\
    \ Because JavaScript is single-threaded, it features several synchronous components.\
    \ These components have the potential to lock the entire program.\n\nHowever,\
    \ the async js feature of JavaScript aids in the efficient administration of asynchronous\
    \ code. As a result, the async code is put into an event queue, where it fires\
    \ after all other code have been completed. Even with JavaScript’s async functionality,\
    \ an external library might be used to revert to a synchronous blocking call.\
    \ This could impart a negative impact on overall performance.\n\nThe best method\
    \ to deal with this is to use asynchronous APIs in your code. However, you should\
    \ keep in mind that learning the intricacies of async programming might be difficult\
    \ for beginners.\n\nIn D3, when you load a page in an App, it will load the HTML,\
    \ CSS, and JS asynchronously. If a feature isn’t working, it will be the only\
    \ one that doesn’t load. If you update the data on a feature, you don’t need to\
    \ reload the page because it updates as you interact with it.\n\n## ANONYMOUS\
    \ AND D3 FUNCTIONS\n\nThis is similar to a lambda function in Python.\n\nThis\
    \ is how you import a CSV file in D3 v4. As illustrated in D3, you can also load\
    \ a file with promises. Use Promises to load a CSV file.\n\n```javascript\nd3.csv(\"\
    file.csv\", function(data) {\n  somethingHappens(data);\n});\nconsole.log(data);\n\
    ```\n\nThis is an anonymous callback function (data). It executes the code within\
    \ the curly braces before returning to this function.\n\nEven if the data was\
    \ not completely loaded, the script will proceed and run console.log(data). The\
    \ console will then show no data. You could interfere with this code and add a\
    \ timer, but how much time do we give that function?\n\n```javascript\nd3.csv(\"\
    file.csv\", function(data) {\n  somethingHappens(data);\n});\nsomeSortOfTimer(60);\n\
    console.log(data);\n```\n\nInstead, write all of the code that uses the loaded\
    \ data in the callback function:\n\n```javascript\nd3.csv(\"file.csv\", function(data)\
    \ {\n  somethingHappens(data);\n  console.log(data);\n});\n```\n\n## Keep Your\
    \ Codes Short and Straightforward\n\nIt's critical to make the code as light and\
    \ compact as possible to retain the excellent performance of mobile applications.\
    \ Keeping the code short and small reduces latency and increases speed. Another\
    \ way to improve the application's performance is to combine and reduce multiple\
    \ JS files into one. If your App has seven JavaScript files, the browser will\
    \ need to send seven different HTTP requests to get them all. To get around this,\
    \ merge the seven files into a single streamlined file.\n\n## Avoid Loops Wherever\
    \ Possible\n\nLooping in JavaScript is not recommended since it puts an additional\
    \ burden on the browser. It's worth noting that the loop requires less effort.\
    \ The labor you put into the loop, the faster it will complete it. There are some\
    \ other simple solutions, such as preserving an array's length in a separate variable\
    \ rather than retrieving it at each loop iteration. This might help us in improving\
    \ our code and making things run better.\n\nA for a a one-to-ten loop:\n\n```javascript\n\
    var i;\nfor (i = 0; i < 10; i++) {\n  console.log(i)\n}\n```\n\nA for loop that\
    \ includes all list elements: (Note that it does not return a, b, or c.)\n\n```javascript\n\
    var allGroup = [\"a\", \"b\", \"c\"]\nfor (i in allGroup) {\n  console.log(i)\n\
    }\n```\n\nCounting from 0 to 10 in a while loop:\n\n```javascript\nwhile (i <\
    \ 10) {\n  console.log(i)\n  i++;\n}\n```\n\n### Reduce DOM Access\n\nOutside\
    \ of the JavaScript native environment, the host browser’s interaction with objects\
    \ (DOM) creates considerable performance delay and unpredictability. This happens\
    \ because the browser must refresh each time, which might be prevented by restricting\
    \ DOM access. It can be accomplished in a number of ways. You can, for example,\
    \ save references to browser objects or reduce the number of DOM traversal trips.\n\
    \n### Object Caching Improves Efficiency\n\nThis can be accomplished in two ways.\
    \ The HTTP protocol cache is the first option. The second option is to use the\
    \ JavaScript Cache API, which may be done with the installation of service workers.\
    \ Scripts are commonly used to access particular objects. You can obtain considerable\
    \ performance gains by using a variable about that object or keeping the repeated\
    \ access object inside the user-defined variable.\n\n## Avoid Taking Too Much\
    \ Memory\n\nOne of the most critical talents javascript developer must have is\
    \ the ability to manage memory usage. It's because determining the RAM requirements\
    \ of the device when it runs is challenging.\n\n## Defer JavaScript Loading\n\n\
    Users understandably want the page to load quickly. This approach allows you to\
    \ delay JavaScript until the page has finished.\n\n### Remove Memory Leaks\n\n\
    Memory leaks are usually caused by bits of the DOM preventing the garbage collector\
