    # Introduction to D3.js


    IN THIS CHAPTER


    +   - Basic about D3.js

    - Features of D3.js

    - Advantages and Disadvantages


    This chapter looks at why we need data visualizations and how to distribute them
    over the web to meet our communication goals. We will discuss the basic concept
    of a data visualization application using d3 and its various components.


    Let''s start by understanding the basics of data visualization.


    # CRASH COURSE OF D3.js


    If you work in finance, sales, marketing, or operations, you''ve surely noticed
    that big data is creeping into your daily routine. It will undoubtedly continue
    to develop for a good cause. The only problem is determining how to get insights
    from the data before making any decisions. Data visualization is a graphical representation
    of information and data. Using visual features such as charts, graphs, and maps,
    data visualization tools make it easy to explore and understand trends, outliers,
    and patterns in data. In the world of big data, data visualization tools and technologies
    are key to analyzing large amounts of data and making data-driven decisions.


    DOI: 10.1201/9781003356608-1'
- md: "\n## Conquering JavaScript: D3.js\n\nInteractive visualizations can spice up\
    \ even the monotonous information. A primary feature of interactive data is its\
    \ ability to function as a single package. Allows users to select individual data\
    \ points from which to illustrate the event. One of the effective methods of doing\
    \ this is using JavaScript, specifically the D3.js framework.\n\nD3 (data-driven\
    \ documents) is a JavaScript library developed by Mike Bostock, an American software\
    \ engineer who developed this software at Stanford University during his PhD studies.\
    \ Conceptually, it is similar to Protovis (a free and open-source graphical data\
    \ visualization toolkit that uses JavaScript views for web-native visualizations\
    \ and combines custom data views with simple marks such as bars and dots), except\
    \ with D3 instead of static visualizations, focuses on interactions, transitions,\
    \ and transformations.\n\nIt has an official website: d3js.org and the D3 source\
    \ code can be obtained using: https://github.com/d3/d3\n\nUnlike other data visualization\
    \ frameworks, D3 allows you to be as creative as you want because you have complete\
    \ control over the visuals you create. HTML, CSS, SVG, and JavaScript are among\
    \ the web technologies used by D3.\n\n- D3 is very fast and supports code reuse.\n\
    - It can handle large datasets and simplifies data loading and transformation.\n\
    - It is useful for creating interactive visuals.\n\n![](img/7fba45ff5201792b222a9c70c681c49a_20_0.png)\n\
    \nApplications of D3.js.\n\n## Introduction to D3.js ■ 3\n\nFirst, we need to\
    \ familiarize ourselves with web standards before we can use D3 to generate visualizations.\
    \ Since D3 makes extensive use of the following web standards, we'll briefly review\
    \ them:\n\n- HTML (HyperText Mark-up Language): The content of the website is\
    \ structured using HTML. HTML 5 is the latest version. It is in a.html text file.\n\
    \nHTMLCode:\n\n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"\
    UTF-8\">\n<p>India is the largely populated country.</p>\n<p>Tiger is National\
    \ Animal and Peacock is National Bird.</p>\n</head>\n<body>\n</body>\n</html>\n\
    ```\nClassical example of HTML.\n\n- DOM (Document Object Model): When you write\
    \ HTML code for a page, the browser converts it into a hierarchical structure.\
    \ Every HTML tag is turned into a DOM element with a parent-child structure. It\
    \ improves the logical structure of your HTML. It is easy to manipulate (add/modify/remove)\
    \ the items on page once the DOM has been constructed. The initial “D” in D3 stands\
    \ for Document, as we learned in the first chapter. D3 provides you with the ability\
    \ to change the DOM using your data.\n\n## Conquering JavaScript: D3.js\n\n- CSS\
    \ (Cascading Style Sheets): HTML gives your web page structure, while CSS styles\
    \ it to make it more appealing to the eye. It's a stylesheet language for describing\
    \ the appearance of an HTML or XML document (including XML dialects like SVG or\
    \ XHTML). CSS specifies what elements on a web page should be displayed.\n\n```css\n\
    <!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<p>India\
    \ is the largely populated country.</p>\n<p>Tiger is National Animal and Peacock\
    \ is National Bird.</p>\n</head>\n<body>\n</body>\n</html>\n{\n  margin: 15px;\n\
    \  padding: 10px;\n  border: 18px solid #999;\n}\n```\nClassical example of HTML\
    \ and CSS.\n\n- SVG (Scalable Vector Graphics): SVG is a web-based image format\
    \ that may be used to produce images. It's a scalable vector, as the name implies.\
    \ Resizing your browser will not affect the image because it scales itself according\
    \ to the size of the browser. Except for Internet Explorer 8 and lower, all browsers\
    \ support SVG. Because data visualizations are visual representations, it's easier\
    \ to render visualizations using D3 using SVG.\n\n```html\n<!DOCTYPE html>\n<html\
    \ lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<svg width=\"500\" height=\"\
    500\">\n<rect x=\"0\" y=\"0\" width=\"300\" height=\"200\"></rect>\n</svg>\n</head>\n\
    <body>\n</body>\n</html>\n```\nClassical example of HTML and SVG.\n\n## Introduction\
    \ to D3js 5\n\n- JavaScript: JavaScript is a scripting language that runs in the\
    \ user's browser and is loosely typed. In order to make the user interface interactive,\
    \ JavaScript interacts with HTML elements (DOM elements). JavaScript supports\
    \ ECMAScript standards, including basic functionality based on ECMA-262 specification\
    \ as well as non-ECMAScript features. It transforms static HTML pages into interactive\
    \ web pages by dynamically updating content, validating data, animating images,\
    \ and nearly everything else. Knowledge of JavaScript is required to use D3.\n\
    \nExample: \n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n  <title>JavaScript Demo</title>\n\
    \  <script>\n    alert('Hello 1')\n  </script>\n</head>\n<body>\n  <h1>JavaScript</h1>\n\
    \  <script>\n    alert('Hello 2')\n  </script>\n  <p>This page contains many tags.</p>\n\
    </body>\n</html>\n```\n\n## SETTING UP A D3 ENVIRONMENT\n\nWe'll learn how to\
    \ set up a D3.js development environment in this part. D3 is compatible with all\
    \ modern browsers, and the current version of D3 is v7. Before we begin, you'll\
    \ require the following:\n\n- Library D3\n- Web browser\n- Editor\n- Webserver\n\
    \n### Step 1: Library D3\n\nTo use D3 for data visualization, you must include\
    \ the D3.js library in your HTML. There are two ways to do it:\n- Include the\
    \ D3 library in your folder.\n- Include D3 library from CDN (Content Delivery\
    \ Network).\n\nThe first step is to get a copy of the D3 library, visit https://d3js.org/\
    \ and download the latest version by unzipping the folder and getting d3.min.js\
    \ (Minified version of D3 source code). Create a folder on the desktop and copy\
    \ this D3 source code along with other files.\n\n![](img/7fba45ff5201792b222a9c70c681c49a_24_0.png)\n\
    \nThis minified version of the D3 source code will be inserted in HTML code as\
    \ shown below:\n\n```html\n<!DOCTYPE html>\n<head>\n<script src=\"./d3.min.js\"\
    ></script>\n</head>\n<body>\n</body>\n</html>\n```\n\nBecause D3 is a JavaScript\
    \ language, you can write all of your D3 code inside the `<script>` tag. Since\
    \ you may need to change existing DOM components, writing D3 code shortly before\
    \ the `</body>` tag is recommended.\n\n### 1. D3 Library from CDN\n\nD3 library\
    \ can be used by adding a direct connection from the Content Delivery Network\
    \ (CDN) to your HTML. CDN is a collection of computers that host and deliver files\
    \ to users based on their location. You can avoid downloading the source code\
    \ if you use the CDN. We can include the D3 library in your page using the CDN\
    \ link https://d3js.org/d3.v4.min.js, as shown below:\n\n```html\n<!DOCTYPE html>\n\
    <html lang=\"en\">\n<head>\n  <script src=\"https://d3js.org/d3.v4.min.js\"></script>\n\
    </head>\n<body>\n  <script>\n    // write your d3 code here...\n  </script>\n\
    </body>\n</html>\n```\n\n### 2. Server Web\n\nLocal HTML files are served directly\
    \ in your browser by most browsers. However, there are some limits when it comes\
    \ to loading external data files. Data will be loaded from external files such\
    \ as CSV and JSON. It will be easier for us if we use a webserver from the beginning.\
    \ We can use whatever webserver you are familiar with, such as IIS or Apache.\n\
    \n### 3. Editor\n\nFinally, it will require an editor to begin your code. Some\
    \ excellent Integrated Development Environments (IDEs) that support JavaScript\
    \ include Web Storm, Eclipse, Sublime Text, or Visual Studio Code.\n\n## Conquering\
    \ JavaScript: D3.js\n\n- Web Browser: D3 works with all \"modern\" browsers, with\
    \ the exception of Internet Explorer 8 and earlier versions. D3 has been tested\
    \ on Firefox, Chrome, Safari, Opera, Internet Explorer 9+, Android, and iOS. Because\
    \ the main D3 library has minimum requirements: JavaScript and the W3C DOM API,\
    \ parts of D3 may operate in other browsers. Selectors API Level 1 is used by\
    \ D3; Sizzle can be preloaded for compatibility. To use SVG and CSS3 Transitions,\
    \ you'll need a contemporary browser. D3 is not a compatibility layer; if your\
    \ browser doesn't support standards, you'll need to use another browser.\n\nNodejs\
    \ is also used in D3. Install it with `npm install d3`.\nD3 can also run within\
    \ a WebWorker by creating a custom build that only contains the non-DOM features\
    \ you require.\n\n### Step 2: DOM elements\n\nNow that we have an open-source\
    \ code library, it's time to set up your own page by manipulating the style and\
    \ other DOM elements. It is important to get the reference of DOM elements using\
    \ `d3.selectAll` (CSS-selector) or `d3.select` (CSS-selector). These elements\
    \ will be applied after HTML and CSS conventions apply successfully.\n\nA number\
    \ of methods, such as `text(\"Content\")` and `remove()`, can be used to change\
    \ the DOM elements. These are fairly similar to existing nodes, making them simple\
    \ to code.\n\n### Step 3: Importing your information\n\nThe following step is\
    \ to load our data and link them to DOM elements. D3 is capable of handling both\
    \ local and external files. Data uploading is analogous to traditional data loading\
    \ using HTML and CSS, using methods such as `d3.json()` for json files; `d3.csv()`\
    \ for csv files, and so on.\n"
  mdcn: "\n\n## 征服 JavaScript：D3.js\n\n交互式可视化可以使单调的信息变得生动起来。交互式数据的一个主要特性是它能够作为一个单一包运行。它允许用户选择单个数据点，并借此说明事件。实现这一点的有效方法之一是使用\
    \ JavaScript，特别是 D3.js 框架。\n\nD3（数据驱动文档）是由 Mike Bostock 开发的 JavaScript 库，他是一位美国软件工程师，在斯坦福大学攻读博士期间开发了该软件。从概念上说，它与\
    \ Protovis 设计（一个免费开源的图形数据可视化工具包，使用 JavaScript 视图进行 Web 原生可视化，并将自定义数据视图与条形、点等简单标记相结合），不同之处在于\
    \ D3 取代了静态可视化，侧重于交互、过渡和变换。\n\n它有一个官方网站：d3js.org，并且可以通过以下地址获取 D3 源码：https://github.com/d3/d3\n\
    \n与其他数据可视化框架不同，D3 允许你随心所欲地发挥创意，因为你对创建的视觉效果具有完全控制权。HTML、CSS、SVG 和 JavaScript 都是\
    \ D3 使用的 Web 技术。\n\n- D3 非常快，并且支持代码复用。\n- 它可以处理大型数据集并简化数据加载和转换。\n- 它对于创建交互式视觉效果非常有用。\n\
    \n![](img/7fba45ff5201792b222a9c70c681c49a_24_0.png)\n\nD3.js 的应用。\n\n## D3.js\
    \ 简介 ■ 3\n\n首先在可以使用 D3 生成可视化之前，我们需要先熟悉 Web 标准。由于 D3 广泛使用了以下 Web 标准，我们将简要回顾一下它们：\n\
    \n- HTML（超文本标记语言）：网站的内容使用 HTML 进行结构化。HTML 5 是最新版本。它位于 a.html 文本文件中。\n\nHTML 代码：\n\
    \n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\"\
    >\n<p>India is the largely populated country.</p>\n<p>Tiger is National Animal\
    \ and Peacock is National Bird.</p>\n</head>\n<body>\n</body>\n</html>\n```\n\
    HTML 的经典示例。\n\n- DOM（文档对象模型）：当你为页面编写 HTML 代码时，浏览器会将其转换为层次级结构。每个 HTML 标签都会转换为一个具有父子结构的\
    \ DOM 元素。它改进了你 HTML 的逻辑结构。一旦 DOM 构建完成，就可以轻松地操作（添加/修改/删除）页面上的项目。D3 中的首字母“D”代表 Document（文档），正如我们在第一章中所学的那样。D3\
    \ 为你提供了使用数据来更改 DOM 的能力。\n\n## 征服 JavaScript：D3.js\n\n- CSS（层叠样式表）：HTML 为你的网页提供结构，而\
    \ CSS 对其进行样式化，使其更吸引眼球。它是一种用于描述 HTML 或 XML 文档外观的样式表语言（包括 SVG 或 XHTML 等 XML 变言）。CSS\
    \ 规定了网页页面上的哪些元素应该被显示。\n\n```css\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n\
    <meta charset=\"UTF-8\">\n<p>India is the largely populated country.</p>\n<p>Tiger\
    \ is National Animal and Peacock is National Bird.</p>\n</head>\n<body>\n</body>\n\
    </html>\n{\n  margin: 15px;\n  padding: 10px;\n  border: 18px solid #999;\n}\n\
    ```\nHTML 和 CSS 的经典示例。\n\n- SVG（可缩矢量图形）：SVG 是一种基于 Web 的图像格式，用于生成图像。正如其名所示，它是可缩放的矢量。调整浏览器大小不会影响图像，因为它会根据浏览器的大小进行缩放。除了\
    \ Internet Explorer 8 及以下版本外，所有浏览器都支持 SVG。由于数据可视化是视觉表示，因此使用 D3  SVG 渲染可视化更加简单。\n\
    \n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\"\
    >\n<svg width=\"500\" height=\"500\">\n<rect x=\"0\" y=\"0\" width=\"300\" height=\"\
    200\"></rect>\n</svg>\n</head>\n<body>\n</body>\n</html>\n```\nHTML 和 SVG 的经典示例。\n\
    \n## D3js 简介 5\n\n- JavaScript：JavaScript 是一种运行在用户浏览器中的脚本语言，它是松类型的。为了让用户界面具有交互性，JavaScript\
    \ 与 HTML 元素（DOM 元素）进行交互。JavaScript 支持 ECMAScript 标准，包括基于 ECMA-262 规范的基础功能以及非 ECMAScript\
    \ 特性。它通过动态更新内容、验证数据、制作动画以及几乎所有其他，将静态 HTML 页面转换为交互式 Web 页面。使用 D3 需要 JavaScript\
    \ 知识。\n\n示例： \n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n  <title>JavaScript\
    \ Demo</title>\n  <script>\n    alert('Hello 1')\n  </script>\n</head>\n<body>\n\
    \  <h1>JavaScript</h1>\n  <script>\n    alert('Hello 2')\n  </script>\n  <p>This\
    \ page contains many tags.</p>\n</body>\n</html>\n```\n\n## 设置 D3 环境\n\n在这一部分，我们将学习如何设置\
    \ D3.js 开发环境。D3 兼容所有现代浏览器，D3 的当前版本是 v7。在开始之前，你需要以下内容：\n\n- D3 库\n- Web 浏览器\n-\
    \ 编辑器\n- Web 服务器\n\n### 第 1 步：D3 库\n\n要使用 D3 进行数据可视化，你必须在 HTML 中包含 D3.js 库。有两种方法：\n\
    - 在你的文件夹中包含 D3 库。\n- 从 CDN（内容分发网络）包含 D3 库。\n\n第一步是获取 D3 库的副本，访问 https://d3js.org/\
    \ 并通过解压文件夹获取 d3.min.js（D3 源码的压缩版本）来下载最新版本。在桌面上创建一个文件夹并复制此 D3 源码以及其他文件。\n\n![](img/7fba45ff5201792b222a9c70c681c49a_24_0.png)\n\
    \n此压缩版本的 D3 源码将插入 HTML 代码中，如下：\n\n```html\n<!DOCTYPE html>\n<head>\n<script src=\"\
    ./d3.min.js\"></script>\n</head>\n<body>\n</body>\n</html>\n```\n\n此压缩版本的 D3 源码将如文所示插入\
    \ HTML 代码中：\n\n在 `<script>` 标签中插入 D3。由于 D3 是 JavaScript 语言，我们需要在 `</body>` 标签之前加载\
    \ D3 库。\n\n### 1. 从 CDN 使用 D3 库\n\n使用 CDN 包含 D3 库。CDN 是一个托管并分发文件的计算机集合。通过 CDN\
    \ 链接 D3 库如下：\n\n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <script\
    \ src=\"d3.min.js\"></script>\n</head>\n<body>\n  <script>\n    // 在此处编写 d3 代码\n\
    \  </script>\n</body>\n</html>\n```\n\n### 2. 服务器\n\n本地 HTML 文件由浏览器直接提供。然而，在加载外部文件方面存在限制。我们可以使用任何你熟悉的\
    \ Web 服务器，例如 IIS 或 Apache。\n\n### 3. 编辑器\n\n最后，启动需要一个编辑器。一些支持 JavaScript 的优秀集成开发环境（IDE）包括\
    \ Web Storm、Eclipse、Sublime Text 或 Visual Code。\n\n## 征服 JavaScript：D3.js\n\n\
    - Web 浏览器：D3 适用于所有现代浏览器，Internet Explorer 8 及旧版本除外。D3 在 Firefox、Chrome、Safari、Opera、Internet\
    \ Explorer 9+、Android 和 iOS 上测试过。由于 D3 库使用了 Selectors API Level 1，D3 的部分功能可以在其他浏览器中运行。为了使用\
    \ SVG 和 CSS3 过渡，你需要现代浏览器。D3 并不是兼容层；如果你的浏览器不支持标准，你需要使用其他浏览器。\n\nNodejs 也用于 D3。通过\
    \ `npm install d3` 安装它。\nD3 也可以通过创建一个包含你所需的非 DOM 特性的自定义构建在 WebWorker 中运行。\n\n\
    ### 第 2 步：DOM 元素\n\n现在我们有了开源库，是时候通过操作样式和其他 DOM 元素来设置你自己的页面了。使用 `d3.selectAll`（CSS\
    \ 选择器）或 `d3.select`（CSS 选择器）获取 DOM 元素的引用是重要的。这些元素将在 HTML 和 CSS 成功应用后应用。\n\n###\
    \ 步骤：导入你的信息\n\n下一步是加载我们的数据并链接到 DOM 元素。D3 能够处理本地和外部文件。数据上传类似于传统的使用 HTML 和 CSS 加载，使用\
    \ `d3.json()` 处理 json 文件；`d3.csv()` 处理 csv 文件等方法。\n\n"
