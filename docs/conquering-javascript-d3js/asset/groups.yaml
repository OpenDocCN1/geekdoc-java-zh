    }\n```\n\n## DATA FROM EXTERNAL SOURCES IS BEING LOADED\n\nYou've hardcoded data\
    \ into your Angular components, but that's probably not a good idea. There are\
    \ various methods for loading data from external sources in D3, so let's look\
    \ at two of the most prevalent patterns.\n\n## CSV File Loading\n\nCSV files can\
    \ be exported from any spreadsheet format. CSV is a text-based data storage format\
