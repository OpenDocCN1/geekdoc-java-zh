    \ Font-family: serif;\n}\n```\n\nIn the DOM:\n\n```\n<text class=\"my-class\"\
    > ... </text>\n```\n\nJavaScript\n\nThe D3 library is a JavaScript library. It\
    \ extends JavaScript’s fundamental functionality by adding new functions. This\
    \ means that a little bit of prior experience with JavaScript is helpful when\
