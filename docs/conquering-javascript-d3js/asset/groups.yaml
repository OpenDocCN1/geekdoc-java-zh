    </head>\n<body>\n</body>\n</html>\n```\n\nBecause all we want to view right now\
    \ is the 3D environment in the browser, the canvas can be styled to cover the\
    \ entire screen.\n\n## OUR 3D WORLD IS BEING BUILT\n\nThen we enter the Three.js\
    \ code and begin adding our 3D scene to the webpage. This is how the index.html\
    \ file should appear:\n\n```html\n<html>\n<head>\n  <title>Three.js 3d World</title>\n\
    \  <style>\n  body{\n    margin: 0.0;\n  }\n\n  canvas{\n    width: 90%;\n   \
    \ height:90%;\n  }\n  </style>\n</head>\n\n<body>\n  <script src=\"js/three.js\"\
    ></script>\n\n  <script>\n  var scene = new THREE.Scene();\n  var camera = new\
