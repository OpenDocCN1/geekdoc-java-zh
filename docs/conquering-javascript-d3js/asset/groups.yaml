  mdcn: "\n\n## D3.js 简介 33\n\n笛卡尔坐标系与 SVG 坐标系相似。二维平面使用两个垂直的轴来确定元素的位置，称为 x 和 y。\n\n\
    现在让我们来看看在开发 D3 应用时会遇到的一些 SVG 形状。我们还将讨论它们的主要表现属性。这里的目的不是对所有 SVG 形状和特性进行详尽教程，而是涵盖将帮助你开启\
    \ D3 之旅的基础知识。\n\n## 线 (Line)\n\n线元素是所有 SVG 形状中最基础的。它在两个点之间绘制一条直线，其位置通过属性设置。返回\
