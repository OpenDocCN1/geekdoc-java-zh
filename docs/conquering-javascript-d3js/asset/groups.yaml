- md: "\nWhen you open the developer console, you'll notice a new empty <p> element.\
    \ The `.text()` method can be used to add text to the new element, as seen below:\n\
    \n```html\n<!doctype html>\n<html>\n<head>\n  <script src=\"https://d3js.org/d3js.v4.min.js\"\
    ></script>\n</head>\n<body>\n  <p>First </p>\n  <p>Second </p>\n  <script>\n \
    \   d3.select(\"body\").append(\"p\").text(\"Third .\");\n  </script>\n</body>\n\
    </html>\n```\n\nD3 adds a new <p> element with the content “Third.” before the\
    \ closing body tag `</body>` in the example above.\n\n## insert()\n\nCreate a\
    \ new element and put it before the selected element's terminating tag using the\
    \ `d3.selection.insert()` method.\n\n```html\n<!doctype html>\n<html>\n<head>\n\
    \  <script src=\"https://d3js.org/d3js.v4.min.js\"></script>\n</head>\n<body>\n\
    \  <div style=\"border:10px solid\">\n    <p>First.</p>\n  </div>\n  <script>\n\
    \    d3.select(\"div\").insert(\"p\").text(\"Second.\");\n  </script>\n</body>\n\
    </html>\n```\n\n`d3.select(\"div\")` chooses the div element in the example above.\
    \ Then, using `.insert(\"p\")`, a new <p> element is created and added just before\
    \ the div tag's conclusion. The text of the inserted <p> element is set by `.insert(\"\
    Second\")`.\n\n## remove()\n\nUse `d3.selection.remove()` method to delete selected\
    \ DOM elements.\n\n```html\n<!doctype html>\n<html>\n<head>\n  <script src=\"\
    https://d3js.org/d3.v4.min.js\">\n  </script>\n</head>\n<body>\n  <p>First</p>\n\
    \  <p>Second</p>\n  <script>\n    d3.select(\"p\").remove();\n  </script>\n</body>\n\
    </html>\n```\n\nWe had two <p> items to begin with in the previous example; `d3.select(\"\
    p\")` returns the first <p> element, and `.remove()` deletes it from the page.\n\
    \n## html()\n\nThe `d3.selection.html()` method is used to set the inner HTML\
    \ of selected elements.\n\n```html\n<!doctype html>\n<html>\n<head>\n  <script\
    \ src=\"https://d3js.org/d3.v4.min.js\">\n  </script>\n</head>\n<body>\n  <p>First\
    \ paragraph</p>\n  <script>\n```\n\n# 28 Conquering JavaScript: D3.js\n\n```javascript\n\
    d3.select(\"p\").html(\"<span>This is new world</span>\");\n</script>\n</body>\n\
    </html>\n```\n\n`d3.select(\"p\")` chooses the paragraph element in the preceding\
    \ example, and `.html(\"This is new world\")` changes the inner HTML of the selected\
    \ <p> element. So, the original HTML \"First paragraph\" was replaced with \"\
    <span>this was added in HTML</span>\".\n\n## attr()\n\nUse `d3.select` instead.\
    \ To apply attributes to chosen DOM elements, use the `attr()` function.\n\n```html\n\
    <!doctype html>\n<html>\n<head>\n<script src=\"https://d3js.org/d3.v4.min.js\"\
    ></script>\n<style>\n.error {\n  color: red\n}\n</style>\n</head>\n<body>\n<p>Error:\
    \ This is error.</p>\n<script>\nd3.select(\"p\").attr(\"class\",\"error\");\n\
    </script>\n</body>\n</html>\n```\n\n`d3.select(\"p\")` picks the <p> element in\
    \ the preceding example, and `.attr(\"class\",\"error\")` adds the class property\
    \ to the paragraph element. Any legal attribute can be assigned to any DOM element\
    \ using the `attr()` method.\n\n## property()\n\nAttributes of specific components,\
    \ such as the checked attribute of a checkbox or the radio button, cannot be set\
    \ by the `attr()` method. Use the `property()` function to apply attributes to\
    \ the selected DOM components in this situation.\n\n```html\n<!doctype html>\n\
    <html>\n<head>\n  <script src=\"https://d3js.org/d3.v4.min.js\"></script>\n</head>\n\
    <body>\n  <p>D3</label><input type=\"cross\" />\n  <p>jQuery</label><input type=\"\
    checkbox\" />\n  <script>\n    d3.select(\"input\").property(\"cross\",true);\n\
    \  </script>\n</body>\n</html>\n```\n\n`d3.select(\"input\")` chooses the first\
    \ <input> element, and `.property(\"checked\",true)` applies the checked attribute\
    \ to the checkbox element in the example above.\n\n## style()\n\nUse `d3.selection`\
    \ instead to apply a style attribute with the supplied name and value to the selected\
    \ items, use the `style()` function.\n\n```html\n<!doctype html>\n<html>\n<head>\n\
    \  <script src=\"https://d3js.org/d3.v4.min.js\"></script>\n</head>\n<body>\n\
    \  <p>Error: This is error.</p>\n  <script>\n    d3.select(\"p\").style(\"color\"\
    , \"red\");\n  </script>\n</body>\n</html>\n```\n\n## classed()\n\nUse `d3.selection`\
    \ instead. To add a class to chosen elements, use the `classed()` function.\n\n\
    ```html\n<!doctype html>\n<html>\n<head>\n  <script src=\"https://d3js.org/d3.v4.min.js\"\
    ></script>\n<style>\n.error {\n  color: red\n}\n</style>\n</head>\n<body>\n<p>Error:\
    \ This is error.</p>\n<script>\nd3.select(\"p\").classed(\"error\", true);\n</script>\n\
    </body>\n</html>\n```\n\n`d3.select(\"p\")` picks the <p> element in the preceding\
    \ example, and `.classed(\"error\", true)` adds the class property to the paragraph\
    \ element. Any legal attribute can be assigned to any DOM element using the `classed()`\
    \ method.\n"
