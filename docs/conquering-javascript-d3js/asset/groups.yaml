    \ Update() and render(), this occurs. To allow functionality to be called multiple\
    \ times per second, we request AnimationFrame(requestAnimationFrame(GameLoop))\
    \ (also called a frame). This sequence of calls is known as a GameLoop in 3 applications.\n\
    \nSo without further ado, let's open the index.html in a browser and check for\
    \ any issues in the console; you should see a completely black screen.\n\n## 100\
