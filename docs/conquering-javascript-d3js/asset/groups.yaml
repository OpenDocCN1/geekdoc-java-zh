    \ D3 图表时脱颖而出。\n\n## 过渡链（TRANSITION CHAINING）\n\n过渡是 D3.js 最受欢迎的功能之一。它们设置简单，可以适应任何类型的数据或所需的审美。然而，你知道吗，从单个事件开始，你可以链式地按顺序触发过渡？\n\
    \n过渡链允许你通过实现复杂的类动画过渡为你的数据添加新的交互层。与一次性发生的传统过渡不同，每个链式过渡都会等待前一个完成后再开始下一个。\n\n链式过渡对于在演示过程中展示未来的影响或突出特定方面非常有用。\n\
