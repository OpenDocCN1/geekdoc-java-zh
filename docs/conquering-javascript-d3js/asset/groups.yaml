    React’s re-rendering optimizations are enabled by the virtual DOM, which represents
    the DOM’s current state. When the conditions change, the library employs a complicated
    diff method to determine which parts of the application need to be re-rendered.
    The “reconciliation algorithm” is the name for this different algorithm.


    # Dynamic Child Components


