    Resizing the Viewport Update


    If you are wondering what this actually means, it means precisely what it says.
    Simply adjust the web browser while your project tab is visible You will see some
    white space when you do; the remedy is to refresh the tab, you cannot keep refreshing
    the tab every time you resize the browser window. So that''s where Threejs Resize
    updates come in.

    Proventially, Threejs abridges the explanation to a few lines of code, as shown
    in the code snippet below:


    ```

    window.addEventListener(''resize'', function () {

    var width = window.innerWidth;

    var height = window.innerHeight;

    renderer.setSize(width, height);

    camera.aspect = width/height;

    camera.updateProjectionMatrix();

    });

    ```


