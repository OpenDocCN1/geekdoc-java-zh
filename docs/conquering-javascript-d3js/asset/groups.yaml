    ```\n\n处理 SVG 文本时另一个需要考虑的点是文本如何流式。普通的 HTML 元素根据控制内容流特定标准放置在页面上。如果你在网站上放置一堆 <div>\
    \ 组件，它们会自动堆叠在一起，其内容会重流，永远不会离开容器。SVG 文本不会流式，每个 SVG 元素必须相互分离。设置它们的 `x` 和 `y` 特性是一种方案。标签“line”就是一种。\n\
    \n## D3.js 简介 35\n\n### 元素分组 (Grouping Elements)\n\n组元素是最后一个讨论的。它允许你将多个 SVG 元素组合在一起，这样你可以一次对所有元素应用属性。这对于由简单形状创建复杂形状特别有用。组元素由\
    \ `<g>` 表示。\n\n```html\n<g>\n  <rect x=\"160\" y=\"15\" width=\"160\" height=\"\
    80\" fill=\"blue\" />\n  <circle cx=\"430\" cy=\"50\" r=\"10\" fill=\"red\" />\n\
    </g>\n```\n\n通过分组元素，你还可以作为一个单个单元移动、旋转或缩放整个组。这是在 D3 中创建动画的一项强大功能。\n\n"
