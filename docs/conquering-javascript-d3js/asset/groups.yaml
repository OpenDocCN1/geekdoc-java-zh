- md: "\n# 38 Conquering JavaScript: D3.js\n\n## METHODS CHAINING\n\nWhen looking\
    \ for D3 project examples online, you'll discover that methods are called one\
    \ after the other on the same Selection. This is known as method chaining, and\
    \ it aids in keeping the code simple and legible.\n\nBreaking lines, which JavaScript\
    \ ignores, and indenting chained methods are very popular in D3. The indentation\
    \ lets us see whatever we're working on, making the code easier to read.\n\n```javascript\n\
    d3.selectAll(\"div\")\n  .append(\"p\")\n  .attr(\"class\", \"my-HOME\")\n  .text(\"\
    Now\")\n  .append(\"span\")\n  .text(\"More Now\")\n  .style(\"font-weight\",\
    \ \"500\");\n```\n\n## ARRAYS AND OBJECTS MANIPULATION\n\nIt is at the heart of\
    \ D3, and data is frequently organized as JavaScript objects. Understanding how\
    \ these objects are built, as well as how to access and change the data they contain,\
    \ can greatly assist you in creating visualizations with D3.\n\n```javascript\n\
    const arrayOfNumbers = [18, 81, 2, 400, 80];\nconst arrayOfStrings = [\"black\"\
    , \"blue\", \"red\", \"orange\"];\n```\n\nThe first element in an array has an\
    \ index of 0, and each element in an array has a numeric location called the index.\n\
    \n```javascript\narrayOfNumbers[0] // => 18\narrayOfStrings[2] // => \"red\",\n\
    ```\n\n## DATA STANDARDS\n\nWe've established common ways of displaying different\
    \ types of data, which is reason we have the freedom to create many wonderful\
    \ data visualizations. Data can be presented in a variety of ways for various\
    \ reasons, but it usually falls into one of many categories: tabular data, nested\
    \ data, network data, geographic data, raw data, and objects.\n\n# Introduction\
    \ to D3.js ■ 39\n\n- Data in a table: In a spreadsheet or a database table, tabular\
    \ data is organized into columns and rows. Although you'll almost always end building\
    \ arrays of objects, pulling data in tabular format is often more efficient and\
    \ easier. The format of tabular data is determined by the character that is used\
    \ to delimit it. You can have Com-Separated Values (CSV) with a comma as the delimiter,\
    \ tab-delimited values with a semicolon, or a pipe symbol as the delimiter, or\
    \ tab-delimited values with a semicolon or a pipe symbol as the delimiter.\n\n\
