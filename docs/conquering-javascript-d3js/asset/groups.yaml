    # 征服 JavaScript 系列


    # 征服 JavaScript


    # D3.js


    编辑


    # Sufyan bin Uzayr


    CRC Taylor & Francis Group


    # 征服 JavaScript


    在 Web 和跨平台开发领域，JavaScript 已经成为事实上的标准。D3.js 是一个非常流行的 JS 框架，旨在快速且更稳健的开发。


    **征服 JavaScript：** D3.js 帮助读者掌握 D3.js 框架，以实现更快更稳健的开发。本书是一份详尽的指南，帮助开发者和编码人员使用 D3.js
    实现更多功能。它简要介绍了基础知识，然后进入更高级、更详细的练习，帮助读者快速获得所需的知识。


    主要特性：


    - 提供针对特定行业的案例示例。

    - 讨论用于项目工作的 D3.js 可视化实现。

    - 强调如何编写清洁且可维护的代码。


    这本书对于 D3.js 开发者以及参与游戏开发、移动应用、渐进式应用，甚至是桌面应用开发的人来说，都是非常有价值的参考书。


    # 关于系列


    《征服 JavaScript》系列涵盖了 JavaScript 编程生态系统的广泛主题，特别是框架和库。该系列的每本书都聚焦于一个单一主题，并详细介绍该主题，特别关注真实世界的用法和以代码为中心的方法，遵循行业标准的编码范式，以帮助学习者获得对现实项目实用的专业知识。


    该系列书籍的一些关键方面包括：


    - 文字清晰清晰，涵盖了按相关性排序的各种 JavaScript 相关主题。

    - 特别关注实战练习，包含大量的代码示例和程序。

    - 引导式的 JS 编码方法，带有分步教程和演练演示。

    - 高度强调技能在现实世界的实用性，从而剔除冗余和很少使用的概念以及臃肿软件。

    - 广泛的参考和资源，帮助读者从书中获得最大收益。


    《征服 JavaScript》系列假设读者对编程基础有基本的了解。


    《征服 JavaScript》系列由 Sufyan bin Uzayr 编辑，他是一位在计算领域拥有十年经验的作家和教育工作者。Sufyan 拥有多个学位，曾在全球的大学和机构任教。到目前为止，Sufyan
    已编写和编辑了 50 多本书，他为该系列带来了丰富的经验。可以在 sufyanism.com 了解更多他的作品。


    https://www.routledge.com/Conquering-JavaScript/book-series/CRCCONJAV


