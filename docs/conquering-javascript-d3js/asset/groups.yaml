  - "[PAGE 206]\n\n# 188 Conquering JavaScript: D3.js\n\nInserting a Legend\n\nThe\
    \ chart's legend is a basic table that displays the open, high, low, close, and\
    \ volume numbers for the chart's most recent data point. This information is straightforward\
    \ to present using a D3 data-join, which is why we haven't included a legend component\
    \ in d3fc – it would be useless.\n\nFor the sake of clarity, it's still worth\
    \ wrapping the component functionality (and potential re-use).\n\nHere's a basic\
    \ legend component that takes an array of objects with name and value properties\
    \ as input:\n\n```\nconst legend = () => {\n  const labelJoin = fc.dataJoin(\"\
    text\",\n    \"legend-label\");\n  const valueJoin = FC.dataJoin(\"text\",\n \
    \   \"legend-value\");\n\nconst instance = selection => {\n  selection.each((data,\
    \ selectionIndex, nodes) => {\n    labelJoin(d3.select(nodes[selectionIndex])),\n\
    \    data\n      .attr(\"transform\", (_, i) => \"translate(50,\n      \"\" +\
    \ (i + 1) * 15 + \" \" + \")\")\n      .text(d => d.name);\n    valueJoin(d3.select(nodes[selectionIndex])),\n\
    \    data\n      .attr(\"transform\", (_, i) => \"translate(60,\n      \"\" +\
    \ (i + 1) * 15 + \" \" + \")\")\n      .text(d => d.value);\n  });\n\n\n  return\
    \ instance;\n};\n```\n\nYou'll notice that the above code creates SVG text components\
    \ using the d3fc data join component rather than the classic D3 data join approach.\
    \ Rather than having to manage the enter, update, and exit selections explicitly,\
    \ this component allows you to specify that each data item should have a text\
    \ component that is uniquely recognized by a legend-label CSS class."
- md: "\nChris Price’s “Building Components with D3 Data Join” is a great resource\
    \ learning more about the functionality of this component.\n\nThe following code\
    \ converts a single datapoint into an array of name/value pairs that may be rendered\
    \ with the above component:\n\n```javascript\nconst dateFormat = d3.timeFormat(\"\
    %a %H:%M%p\");\nconst priceFormat = d3.format(\".2f\");\nconst legendData = datum\
    \ => [\n  { name: \"Open\", value: priceFormat(datum.open) },\n  { name: \"High\"\
    , value: priceFormat(datum.high) },\n  { name: \"Low\", value: priceFormat(datum.low)\
    \ },\n  { name: \"Close\", value: priceFormat(datum.close) },\n  { name: \"Volume\"\
    , value: priceFormat(datum.volume) }\n];\n```\n\nThe last step is to add the chart’s\
    \ legend. We return to the decorative pattern:\n\n```javascript\nconst chart =\
    \ FC\n  .chartCartesian(d3.scaleTime(), d3.scaleLinear())\n  // ...\n  .decorate(see\
    \ => {\n    sel\n      .datum(legendData(data[data.length - 1]))\n      .append(\"\
    SVG\")\n      .style(\"grid-column\", 3)\n      .style(\"grid-row\", 3)\n    \
    \  .classed(\"legend\", true)\n      .call(chartLegend);\n  });\n```\n\nThe legend\
    \ is bound to the current selection via datum using the adorn selection. The chart\
    \ component uses a CSS grid layout, with the above code adding a new SVG element\
    \ to the plot area in the third row and column. Finally, the legend component\
    \ is rendered using the call method of the selection.\n\nSome minor aesthetic\
    \ adjustments, as stretching the axis ticks, adding a border, and offsetting the\
    \ axis labels, are required to resemble the original chart. These are just minor\
    \ tweaks that I won’t go into detail here. It’s time to move on to something far\
    \ more exciting!\n\n# Conquering JavaScript: D3.js\n\n## Trading Hours and Axes\
    \ That Aren't Continuous\nThe current chart displays only a few hours of trading\
    \ data; when this is expanded to include data for several days, the graphic becomes\
    \ somewhat strange.\n\nThe foremost is that stocks are merchandized on exchanges\
    \ with set hours of operation, for example, for the very famous New York Stock\
    \ Exchange from 9:30 a.m. to 4:00 p.m., when the majority of dealers are present.\
    \ The second is a limited amount of after-hours trading, which is usually minimal\
    \ in volume but does cause price movement.\n\nFinancial charts frequently utilize\
    \ a \"discontinuous\" axis, that is, with an axis with \"breaks,\" because there\
    \ is little benefit in depicting periods of time when the price is not changing.\n\
    \nThe discontinuous scale component in d3fc allows you to customize a scale by\
    \ introducing gaps or breaks. Here's a simple example of how to make a linear\
    \ scale with a gap between 50 and 70 and 125:\n\n```javascript\nvar scale = FC.scaleDiscontinuous(d3.scaleLinear())\n\
    .discontinuityProvider(FC.discontinuityRange([50, 75], [100, 125]));\n```\n\n\
    The discontinuity provider interface also allows you to create recurrent discontinuities,\
    \ such as charts that skip every weekend, but for our needs, the basic primary\
    \ step is to figure out when our data's first and last orders occur inside each\
    \ day. The following function will do the job:\n\n```javascript\nconst tradingHours\
    \ = dates => {\n  const getDateKey = date => {\n    return date.getMonth() + '/'\
    \ + date.getDate() + '/' + date.getFullYear();\n  };\n\n  const tradingMinute\
    \ = dates.reduce((acc, curr) => {\n    const dateKey = getDateKey(curr);\n   \
    \ if (!acc.hasOwnProperty(dateKey)) {\n      acc[dateKey] = [curr, curr];\n  \
    \  } else {\n      acc[dateKey][1] = curr;\n    }\n    return acc;\n  }, {});\n\
    \n  return Object.keys(tradingHours).map(d => tradingHours[d]);\n};\n```\n\nThe\
    \ D3 pairs function is used to \"pair up one day’s closure with the next day’s\
    \ opening,\" creating the required discontinuities:\n\n```javascript\nconst xScale\
    \ = FC.scaleDiscontinuous(d3.scaleTime());\n```\n\n```javascript\nconst tradingHoursArray\
    \ = tradingHours.data(d => d.date());\nconst discontinuities = d3\n.pairs(tradingHoursArray)\n\
    .map(d => [d[0][1], d[1][0]]);\n```\n\n```javascript\nxScale.discontinuityProvider(FC.discontinuityRange(...discontinuities));\n\
    ```\n\nSince the underlying D3 scale decided to add tick marks at midnight for\
    \ each day, which falls inside our discontinuities, our x-axis ticks vanish.\n\
    \n```javascript\nSetting specific tick intervals can easily fix this:\n// create\
    \ a tick at 10:30 for each day\nconst xTicks = d3.timeMinute\n.filter(d => d.getHours()\
    \ === 10 && d.getMinutes() === 30);\n```\n\n```javascript\nconst chart = fc\n\
    .chartesian(xScale, yScale)\n//...\n.xTicks(xTicks);\n```\n\n# ANNOTATIONS\n\n\
    The original chart has some interesting annotations, consisting of a combination\
    \ of vertical lines and bands that help to clarify after-hours trade. To render\
    \ this type of feature, d3fc provides a number of distinct annotation types.\n\
    \n## Conquering JavaScript: D3.js\nWe utilize the band and line annotations:\n\
    \n```javascript\nconst verticalAnnotation = fc\n  .annotationLine()\n  .orient(\"\
    vertical\")\n  .value(d => d.value)\n  .decorate(see => {\n    sel\n      .enter()\n\
    \      .select(\".bottom-handle\")\n      .append(\"use\")\n      .attr(\"transform\"\
    , \"translate(0, -20)\")\n      .attr(\"xlink:href\", d => d.type);\n    sel\n\
    \      .enter()\n      .select(\".bottom-handle\")\n      .append(\"circle\")\n\
    \      .attr(\"r\", 3);\n  });\n```\n\n```javascript\nconst bands = fc\n  .annotationBand()\n\
    \  .orient(\"vertical\")\n  .fromValue(d => d[1])\n  .toValue(d => d[0]);\n```\n\
    \nThe embellished pattern has been used to add a number of additional features\
    \ to the vertical line, including the little icons. Instead of being tied to the\
    \ primary time data, these annotations render the discontinuities. So, how can\
    \ we get this information? The first step is to add the relevant data to the array\
    \ the chart outputs as a property:\n\n```javascript\ndata.tradingHoursArray =\
    \ tradingHoursArray;\n```\n\nThe annotations are added using the multi-series\
    \ component, which provides a helpful function for mapping the bound data for\
    \ certain components, such as changing the data for these:\n\n```javascript\n\
    const multi = FC\n.seriesSvgMulti()\n.series([\n  gridlines,\n  areaSeries,\n\
    \  lineSeries,\n  movingAverageSeries,\n  volumeSeries,\n  bands,\n  verticalAnnotation\n\
    ])\n.mapping((data, index) => {\n  switch (verticalAnnotation) {\n    case bands:\n\
    \      return d3.pairs(data.tradingHoursArray.map(d => exchangeOpening(d[0])));\n\
    \    default:\n      return data;\n  }\n});\n```\n\n# CROSS\n\nFinally, we'll\
    \ add some interactivity to the chart by including a crosshair that tracks the\
    \ cursor position. To do so, we'll need to handle mouse events in the plot area\
    \ of the chart. The mouse events are handled by basic pointer component in d3fc,\
    \ which emits the cursor's x and y positions. To take advantage of it, the chart\
    \ code will need to be restructured to allow it be re-rendered when events are\
    \ handled. The following modifications are required:\n\n```javascript\nconst render\
    \ = () => {\n  d3.select(\"#chart-element\")\n  .datum(data)\n  .call(chart);\n\
    };\n```\n\n```javascript\nconst pointer = fc.pointer().on(\"point\", event =>\
    \ {\n  data.crosshair = event.map(({x}) => {\n    const closestIndex = d3.bisector(d\
    \ => d.date)left(chartData, xScale.invert(x));\n    return data[closestIndex];\n\
    \  });\n  render();\n});\n```\n\n```javascript\nd3.select(\"#chart-element .plot-area\"\
    ).call(pointer);\nrender();\n```\n\nThe render function allows you to re-render\
    \ the entire chart. The above code handles the point event by finding the closest\
    \ data point using a D3 bisector and the cursor's x position. The closest point\
    \ is added to the data that the chart renders crosshair attribute. The next step\
    \ is to add a component, in this case the d3fc crosshair component, to render\
    \ the data.\n\nIt's better to see this feature in action than to provide a screenshot,\
    \ head over to GitHub to see the finished chart.\n\n# SUMMARY\n\nD3 is highly\
    \ versatile; you can make almost anything with it. We hope that by combining d3fc\
    \ with D3, we will be able to quickly create complicated charts without sacrificing\
    \ the capability of D3.\n\n# NOTE\n\n- 1. https://www.smashingmagazine.com/2018/02/react-d3-ecosystem/\n\
    \n# Bibliography\n\n- 1. D3js - https://tutorialteacher.com/d3js/what-is-d3js,\
    \ accessed on July 3, 2022\n2. Data driven d3 – https://www.geeksforgeeks.org/d3-js-data-driven-documents/,\
    \ accessed on July 3, 2022.\n3. d3 – https://observablehq.com/@d3-learn, accessed\
    \ on July 3, 2022.\n4. d3js introduction – https://www.tutorialspoint.com/d3js/d3js_introduction.htm,\
    \ accessed on July 3, 2022.\n5. d3 introduction – https://www.d3depth.com/introduction/,\
    \ accessed on July 4, 2022.\n6. https://www.freecodecamp.org/news/d3js-tutorial-data-visualization-for-beginners/,\
    \ accessed on July 4, 2022.\n7. D3js – https://d3.org/, accessed on July 4, 2022.\n\
    8. Data visualization – https://analytics.com/importance-of-data-visualization/,\
    \ accessed on July 4, 2022.\n9. Visualization using d3 – https://www.educational.io/courses/introduction-to-visualization-d3-js/JQol1EmDXOk,\
    \ accessed on July 5, 2022.\n10. Pros cons – https://www.comparecamp.com/d3js-review-pricing-pros-cons/,\
    \ accessed on July 5, 2022.\n11. Pro and cons – https://www.cloudhadoop.com/2018/08/understand-d3js-library-pros-and-cons.html,\
    \ accessed July 5, 2022.\n12. D3js – https://www.livebooking.com/book/d3js-in-action-second-edition/chapter-1.,\
    \ accessed on July 6, 2022.\n13. Application in D3 – https://devnet.logianytics.com/hc/en-us/articles/360057063733-D3-Sample-Application,\
    \ accessed on July 6, 2022.\n14. Intro D3js – https://mohamedddhaoui.github.io/dataengineering/d3js/,\
    \ accessed on July 6, 2022.\n"
  mdcn: "\nChris Price 的《使用 D3 Data Join 构建组件》是学习更多关于该组件功能的极佳资源。\n\n以下代码将单个数据点转换为名称/值对的数组，这些值对可以使用上述组件进行渲染：\n\
    \n```javascript\nconst dateFormat = d3.timeFormat(\"%a %H:%M%p\");\nconst priceFormat\
    \ = d3.format(\".2f\");\nconst legendData = datum => [\n  { name: \"Open\", value:\
    \ priceFormat(datum.open) },\n  { name: \"High\", value: priceFormat(datum.high)\
    \ },\n  { name: \"Low\", value: priceFormat(datum.low) },\n  { name: \"Close\"\
    , value: priceFormat(datum.close) },\n  { name: \"Volume\", value: priceFormat(datum.volume)\
    \ }\n];\n```\n\n最后一步是添加图表的图例。我们回到装饰性模式：\n\n```javascript\nconst chart = FC\n \
    \ .chartCartesian(d3.scaleTime(), d3.scaleLinear())\n  // ...\n  .decorate(see\
    \ => {\n    sel\n      .datum(legendData(data[data.length - 1]))\n      .append(\"\
    SVG\")\n      .style(\"grid-column\", 3)\n      .style(\"grid-row\", 3)\n    \
    \  .classed(\"legend\", true)\n      .call(chartLegend);\n  });\n```\n\n图例通过 `adorn`\
    \ 选择使用 `datum` 绑定到当前选择。图表组件使用 CSS 网格布局，上述代码在绘图区域第三行第三列添加了一个新的 SVG 元素。最后，使用选择的\
    \ `call` 方法渲染图例组件。\n\n为了像原始图表，还需要进行一些细视觉调整，例如拉伸轴刻度、添加边框和偏移轴标签。这些只是我不会在这里详述的细微调整。是时候进入更精彩的内容了！\n\
    \n# 征服 JavaScript：D3.js\n\n## 交易时间与非连续轴\n当前图表仅显示几小时的交易数据；当扩展到包含几天的数据时，图形会变得有些奇怪。\n\
    \n最重要的是，股票在固定营业时间的交易所交易，例如非常著名的纽约证券交易所，营业时间为上午 9:30 到下午 4:00，此时大多数交易员都在场。第二是有限的盘后交易，成交量通常很小，但确实会导致价格波动。\n\
    \n金融图表经常使用“不连续”轴，即带有“断开”的轴，因为描绘价格没有变化的时间段几乎没有处。\n\n`d3fc` 中的不连续比例组件允许你通过引入间隙或断开来自定义比例。这里有一个简单的示例，如何创建一个在\
    \ 50 到 70 以及 125 之间有间隙的线性比例：\n\n```javascript\nvar scale = FC.scaleDiscontinuous(d3.scaleLinear())\n\
    .discontinuityProvider(FC.discontinuityRange([50, 75], [100, 125]));\n```\n\n\
    断开提供器接口还允许你创建循环断开，例如跳过每个周末的图表，但对于我们的需求，基础步骤是弄清楚我们数据在每天内部第一笔和最后一个订单发生的时间。以下函数将完成这项工作：\n\
    \n```javascript\nconst tradingHours = dates => {\n  const getDateKey = date =>\
    \ {\n    return date.getMonth() + '/' + date.getDate() + '/' + date.getFullYear();\n\
    \  };\n\n  const tradingMinute = dates.reduce((acc, curr) => {\n    const dateKey\
    \ = getDateKey(curr);\n    if (!acc.hasOwnProperty(dateKey)) {\n      acc[dateKey]\
    \ = [curr, curr];\n    } else {\n      acc[dateKey][1] = curr;\n    }\n    return\
    \ acc;\n  }, {});\n\n  return Object.keys(tradingHours).map(d => tradingHours[d]);\n\
    };\n```\n\nD3 的 `pairs` 函数用于“将一天的收盘价与次日的开价配对”，创建所需的断开：\n\n```javascript\nconst\
    \ xScale = FC.scaleDiscontinuous(d3.scaleTime());\n```\n\n```javascript\nconst\
    \ tradingHoursArray = tradingHours.data(d => d.date());\nconst discontinuities\
    \ = d3\n.pairs(tradingHoursArray)\n.map(d => [d[0][1], d[1][0]]);\n```\n\n```javascript\n\
    xScale.discontinuityProvider(FC.discontinuityRange(...discontinuities));\n```\n\
    \n由于底层的 D3 比例决定在每天午夜添加刻度标记，而这落在我们的断开范围内，我们的 x 轴刻度消失了。\n\n```\n设置特定的刻度间隔可以轻松修复此：\n\
    // 为每天在 10:30 创建一个刻度\nconst xTicks = d3.timeMinute\n.filter(d => d.getHours()\
    \ === 10 && d.getMinutes() === 30);\n```\n\n```javascript\nconst chart = fc\n\
    .chartesian(xScale, yScale)\n//...\n.xTicks(xTicks);\n```\n\n# 注释\n\n原始图表有一些有趣的注释，它们由垂直线和条带组合组成，有助于阐明盘后交易。为了渲染这种功能，d3fc\
    \ 提供了多种不同的注释类型。\n\n## 征服 JavaScript：D3.js\n我们利用了带状和线条注释：\n\n```javascript\nconst\
    \ verticalAnnotation = fc\n  .annotationLine()\n  .orient(\"vertical\")\n  .value(d\
    \ => d.value)\n  .decorate(see => {\n    sel\n      .enter()\n      .select(\"\
    .bottom-handle\")\n      .append(\"use\")\n      .attr(\"transform\", \"translate(0,\
    \ -20)\")\n      .attr(\"xlink:href\", d => d.type);\n    sel\n      .enter()\n\
    \      .select(\".bottom-handle\")\n      .append(\"circle\")\n      .attr(\"\
    r\", 3);\n  });\n```\n\n```javascript\nconst bands = fc\n  .annotationBand()\n\
    \  .orient(\"vertical\")\n  .fromValue(d => d[1])\n  .toValue(d => d[0]);\n```\n\
    \n装饰模式已用于向垂直线添加一些功能。而不是绑定到原始数据，这些注释渲染了断开。那么，我们如何获取这些信息？第一步是将相关数据添加到图表输出中：\n\n\
    ```javascript\ndata.tradingHoursArray = tradingHoursArray;\n```\n\n注释使用 `multi-series`\
    \ 组件添加，它为某些组件映射提供了帮助函数：\n\n```javascript\nconst multi = FC\n.seriesSvg()\n.series([\n\
    \  gridlines,\n  areaSeries,\n  lineSeries,\n  movingAverageSeries,\n  volumeSeries,\n\
    \  bands,\n  verticalAnnotation\n])\n.mapping((data, index) => {\n  switch (verticalAnnotation)\
    \ {\n    case bands:\n      return d3.pairs(data.tradingHoursArray.map(d => d[0]));\n\
    \    default:\n      return data;\n  }\n});\n```\n\n# 交叉线\n\n最后，我们将通过包含一个追踪光标位置的交叉线为图表添加一些交互。为了这样做，我们需要在图表的绘制区域处理鼠标事件。鼠标事件由\
    \ d3fc 中的 `pointer` 组件处理 x 和 y 位置。为了利用它，图表代码需要重构以允许在处理事件时重新渲染。需要以下修改：\n\n```javascript\n\
    const render = () => {\n  d3.select(\"#chart-element\")\n  .datum(data)\n  .call(chart);\n\
    };\n```\n\n```javascript\nconst pointer = fc.pointer().on(\"point\", event =>\
    \ {\n  data.crosshair = event.map(({x}) => {\n    const closestIndex = d3.bisector(d\
    \ => d.date).left(chartData, xScale.invert(x));\n    return data[closestIndex];\n\
    \  });\n  render();\n});\n```\n\n```javascript\nd3.select(\"#chart-element .plot-area\"\
    ).call(pointer);\nrender();\n```\n\n`render` 函数允许你重新渲染整个图表。上述代码通过使用 D3 `bisector`\
    \ 和光标的 x 位置处理 `point` 事件。最近的点被添加到图表渲染的 `crosshair` 属性。下一步是添加一个组件，在这种情况下是 `d3fc\
    \ crosshair` 组件，渲染数据。\n\n与其提供截图，不如去 GitHub 查看完成的图表。\n\n# 总结\n\nD3 功能非常多；你可以用它制作几乎任何东西。我们希望通过将\
    \ `d3fc` 与 D3 结合，能够快速创建复杂的图表而不牺牲 D3 的能力。\n\n# 注意\n\n- 1. https://www.smashingmagazine.com/2018/02/react-d3-ecosystem/\n\
    \n# 参考文献\n\n- 1. D3js - https://tutorialteacher.com/d3js/what-is-d3js, 访问2022年7月3日\n\
    2. Data driven d3 – https://www.geeksforgeeks.org/d3-js-data-driven-documents/,\
    \ 访问2022年7月3日.\n3. d3 – https://observablehq.com/@d3-learn, 访问2022年7月3日.\n4. d3js\
    \ introduction – https://www.tutorialspoint.com/d3js/d3js_introduction.htm, 访问2022年7月3日.\n\
    5. d3 introduction – https://www.d3depth.com/introduction/, 访问2022年7月4日.\n6. https://www.freecodecamp.org/news/d3js-tutorial-data-visualization-for-beginners/,\
    \ 访问2022年7月4日.\n7. D3js – https://d3.org/, 访问2022年7月4日.\n8. Data visualization\
    \ – https://analytics.com/importance-of-data-visualization/, 访问2022年7月4日.\n9.\
    \ Visualization using d3 – https://www.educational.io/courses/introduction-to-visualization-d3-js/JQol1EmDXOk,\
    \ 访问2022年7月5日.\n10. Pros cons – https://www.comparecamp.com/d3js-review-pricing-pros-cons/,\
    \ 访问2022年7月5日.\n11. Pro and cons – https://www.cloudhadoop.com/2018/08/understand-d3js-library-pros-and-cons.html,\
