  - '[PAGE 68]


    # 50 Conquerng JavaScript: D3.js


    Mark Otto and Jacob Thornton created Bootstrap at Twitter as a framework to enable
    consistency across internal technologies. Because its objective is to provide
    structure to content, the term “framework” is arguably the most descriptive term.
    Perhaps in the same way as d3.js gives data structure.


    The following are some of Bootstrap''s most essential features:


    +   - Components of the interface

    - Layout grid


    # COMPONENTS OF THE INTERFACE


    There are also numerous interface components available. Standard buttons are among
    them tables, menus, dropdown buttons, and navigation tools.


    # LAYOUT GRID


    Bootstrap comes with four common pixel-width layout schemas to help you rapidly
    put up a page structure. This allows you to design and implement what you want
    to put on the page with the least amount of effort. You can modify any of the
    pre-set values, and you can also use the “fluid” row option, which uses a percentage
    instead of a fixed pixel value to dynamically scale a column’s width. This capability
    is what drew me to Bootstrap in the first place, and while I''m using a complex
    tool for a simple task, it performs admirably.


    # IMPLEMENTING BOOTSTRAP IN YOUR HTML CODE


    Bootstrap is a wonderfully adaptable framework. We may be forgiven for thinking
    the installation would be difficult. We''ll make the procedure primitive but effective
    for the sake of keeping things simple.


    You''ll need to copy the bootstrap.js file (or the reduced version (bootstrap.min.js))
    to a location where your script can find and load. While you''re there, add a
    line to import the jquery.js file (which is a Bootstrap dependency (though it''s
    not widely discussed)). If you copied the bootstrap-min.js file into the js directory,
    the following two lines will suffice:


    ```

    <script src="http://code.jquery.com/jquery.js"></n<script src="js/bootstrap.min.js"></script>

    ```'
