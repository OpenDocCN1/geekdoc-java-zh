    \ SVG 容器坐标系中的 (60, 55)。你可以从 SVG 容器的左上角开始，向右移动 10px，向下移动 15px 来找到线的起始点。使用 `x2`\
    \ 和 `y2` 属性将线的终点设置为 (150, 325)。\n\n```\n<svg>\n<line x1=\"60\" y1=\"55\" x2=\"\
    150\" y2=\"325\" />\n</svg>\n```\n\n我们必须额外设置 `stroke` 属性（它决定线的颜色），SVG 线段才能显示在屏幕上。`stroke`\
    \ 属性的值与 CSS 的颜色属性相同。它可以是颜色名称（red、pink 等）、RGB 颜色（RGB (155,10,20））或十六进制值（#808080）。给你的线设置一个\
    \ `stroke` 属性以及你选择的颜色。\n\n```html\n<line x1=\"60\" y1=\"55\" x2=\"150\" y2=\"\
    325\" stroke=\"blue\" />\n```\n\n`stroke-width` 属性用于确定线的宽度。该属性接受像素的绝对值或相对值（百分比）。\n\
    \n```html\n<line x1=\"60\" y1=\"55\" x2=\"150\" y2=\"325\" stroke=\"blue\" stroke-width=\"\
    5\" />\n```\n\n## 34 征服 JavaScript: D3.js\n\n### 矩形 (Rectangle)\n\n矩形元素 `<rect>`\
    \ 如其名，在屏幕上绘制矩形形状。为了可见，`<rect>` 元素必须具有四个属性。参数 `x` 和 `y` 定义矩形左上角的位置，而 `width` 和\
    \ `height` 分别定义它的宽度和高度。在你的 SVG 容器中，添加以下 `<rect>` 元素及其属性。\n\n```html\n<rect x=\"\
    160\" y=\"15\" width=\"160\" height=\"80\" />\n```\n\n通过将 `fill` 属性分配任何 CSS 颜色，我们可以更改颜色。如果我们想更改矩形的边界，可以使用\
    \ `stroke` 属性。\n\n### 椭圆和圆 (Ellipse and Circle)\n\n在数据可视化中，圆形形状被频繁使用。它们能自然地吸引注意力，并让可视化感到温暖活泼。`<circle>`\
    \ 元素用于创建 SVG 圆形。半径和圆心位置 (cx, cy) 是核心属性 (`r`)。圆的半径是圆心到边界上任意一点的距离。将下面的圆添加到你的形状集合中。给它设置\
    \ 10 像素的半径和 (430, 50) 的圆心。\n\n```html\n<circle cx=\"430\" cy=\"50\" r=\"10\" />\n\
    ```\n\n### 路径 (Path)\n\nSVG 中的路径是所有 SVG 元素中最灵活的。它们在 D3 中被广泛用于绘制几乎所有之前讨论的形状元素（线、矩形、圆和椭圆）的所有复杂形状和曲线。\n\
    \n通过声明 `d` 属性，我们告诉浏览器如何创建路径。`d` 属性包含一系列命令，从从开始绘制路径到使用什么类型的曲线，以及路径是否关闭。关于路径的另一个要点是，除非\
    \ `fill` 属性设置为一种或透明，否则浏览器将将其填充为黑色。\n\n### 文本 (Text)\n\n内联 SVG 可视化吸引人的特性之一是它们包含可以导航的文本，就像包含\
    \ div 或 p 元素中的其他 HTML 文本一样。这在可访问性是一个巨大的改进。由于数据可视化经常包含多个标签，知道如何使用 `<text />` 元素更改\
