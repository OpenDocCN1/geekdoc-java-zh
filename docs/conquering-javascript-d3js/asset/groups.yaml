  mdcn: "\n\n# 生命周期方法封装\n\nNicolas Henry 首次提出了这种解决方案，他使用了类 React 组件中存在的生命周期方法。它优雅地涵盖了\
    \ D3js 图表的生成、更新和销毁，在 React 和 D3js 代码之间划定了清晰的界限。\n\n```javascript\nimport D3Line\
    \ from './D3Line'\n```\n\n```javascript\nclass Line extends React.Component {\n\
    \  static propTypes = {...}\n\n  componentDidMount() {\n    // 创建图表的 D3 代码\n \
    \   this.chart = D3Line.create(\n      this._rootNode,\n      this.props.data,\n\
    \      this.props.config\n    );\n  }\n\n  componentDidUpdate() {\n    // 更新图表的\
    \ D3 代码\n    D3Line.update(\n      this._rootNode,\n      this.props.data,\n \
