  - "[PAGE 54]\n\n# 36 ■ Conquering JavaScript: D3.js\n\nMoving a group around the\
    \ SVG container is done with the transform attribute. The transform attribute\
    \ is a little more intimidating than is identical to the CSS transform property\
    \ attributes discussed so far. It takes a transformation (translate, rotate, scale,\
    \ etc.) or a stack of transformations as values. To move a group, we use the translate(x,y)\
    \ transformation. If we want to move our <rect> and <text> elements to their original\
    \ position, we need to apply a translation of 260 pixels to the right and 175\
    \ pixels down to the <g> element. To do so; we set its transform attribute to=\"\
    translate(510,55)\".\n\n```\n<g transform=\"translate (510,55)\">\n  <rect x=\"\
    0\" y=\"0\" width=\"30\" height=\"50\" />\n  <text x=\"0\" y=\"45\">rect</text>\n\
    </g>\n```\n\nBy it, here we can add various codes of the Gallery of Shapes in\
    \ D3 projects.\n\n# CANVAS AND WebGL\n\nWe've already indicated that we frequently\
    \ use SVG elements in our D3 applications. We may occasionally need to produce\
    \ complicated visualizations from erroneous datasets, which the usual SVG technique\
    \ can cause performance problems. It's important to remember that, for each graphical\
    \ detail in data visualization, D3 appends one or many SVG nodes to the DOM. Big\
    \ network visualization with hundreds of nodes and links is a good illustration.\n\
    \nCanvas is a client-side API that creates graphics and animations using a script,\
    \ most commonly JavaScript. It doesn't add elements to the DOM, which dramatically\
    \ improves performance when building visualizations from large datasets. We may\
    \ also use the WebGL API to generate 3D objects with Canvas.\n\n# CASCADING STYLE\
    \ SHEETS\n\nIt is a programming language that describes how DOM elements are presented\
    \ on the screen and how they appear. From the overall grid layout of a page to\
    \ the family of fonts used for the text, up to the color of the circles in a scatterplot,\
    \ CSS can turn a plain HTML file into an awe-inspiring page. In D3 projects, we\
    \ generally apply CSS styles using inline styles"
  - "[PAGE 55]\n\nor via an external stylesheet. Inline styles are applied to elements\
    \ with the style attribute, as shown in the following example. The style attribute\
