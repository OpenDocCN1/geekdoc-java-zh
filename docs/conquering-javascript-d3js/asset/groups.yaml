    \n数据连接允许我们 easily提供的数据与已存在的元素、缺失的项进行匹配，并消除不再需要的部分。当与数据配合 D3.js 选择器时，会将选中的项目分为三组：必须创建的项（enter\
    \ 组）、必须修改的项（update 组）以及必须删除的项（exit 组）。\n\n在实践中，数据连接由具有两个数组的 JavaScript 对象表示。在\
    \ D3.js 的当前版本中，我们可以调用选择器的 entry 和 exit 方法来对 enter 和 exit 组启动操作。同时，我们可以直接操作 update\
    \ 组。\n\n根据 Bostock 的说法，“你可以查看实时数据，允许交互式探索，并在不同数据集之间平滑过渡。”正如我们将在接下来的章节中看到的，它们实际上是一种\
    \ diff（差异比较）方法，类似于 React 处理元素渲染的方式。\n\n## D3 库\n\n由于 D3.js 过于低层级，D3 社区尚未开发出一种从\
    \ D3 代码生成组件的标准方法，而这是一个常见需求。我们可以说，在基于 D3 的库中已经存在着许多种实用的封装模式，但我们将根据其 API 将分为四类：\n\
    \n- 面向对象\n- 声明式\n- 函数式\n- 链式（或类 D3 式）\n\n## 总结 ■ 147\n\n我们将列出一些使用 D3.js 第 4 版本且具有高测试覆盖率的库。它们在\
    \ API 类型和抽象粒度上有所不同。\n\n### Plottable\n\nPlottable 是一个流行的面向对象的图表包，粒度较低；因此，为了构建图表，我们必须手动设置轴、比例尺和图表。\n\
    \n### Billboard\n\nBillboard 是著名的 C3.js 库的分支，已更新以适配 D3.js 第 4 版本，并旨在保留这一经典库的遗产。它使用\
    \ ECMAScript 6 和 Webpack 等现代工具制作。它具有基于提供给图表的配置对象的声明式 API。\n\n### Vega\n\nVega\
    \ 在声明式配置上更进了一步，将 JavaScript 对象转换为纯 JSON 文件。它尝试基于 Leland Wilkinson 的《图形语法法》（The\
    \ Grammar of Graphics）创建一个可视化语法法。本章形式化了数据可视化的构建部分，也是 D3.js 的灵感来源。\n\n### D3FC\n\
    \nD3FC 使用 D3.js 和专有的构建块来帮助你在 SVG 和 canvas 中同时创建交互式图表。它具有函数式的、低粒度的接口，以及大量的 D3.js\
    \ 代码，因此需要一些时间来适应。\n\n### Britecharts\n\n它是 Eventbrite 的一个库，我是其中的核心开发者。它使用了可复用图表\
    \ API（Reusable Chart API），这是 Mike Bostock 在他的文章《迈向可复用图表》（Towards Reusable Charts）中开的封装风格，并用于\
    \ NVD3 等其他库。Britecharts 是一种高级抽象，在保持内部复杂性低水平的同时使构建图表变得简单，允许 D3 开发者根据自己的需求自定义 Britecharts。开发一个复杂的用户界面和许多易懂的示例花费了大量精力和。\n\
    \n## 148 征服 JavaScript：D3.js\n\n## DOM 与 REACT\n\nReact 是一个 JavaScript 包，允许我们通过组合组件来创建用户界面。这些组件跟踪自己的状态并传入属性以有效地重新渲染，提高应用程序的性能。\n\
    \n## 流程是什么？\n\nReact 的重新渲染优化是通过虚拟 DOM 实现的，虚拟 DOM 代表了 DOM 的当前状态。当条件变化时，该库采用复杂的\
    \ diff 方法来确定应用程序的部分需要重新渲染。“调和算法”（reconciliation algorithm）就是这种算法的名称。\n\n## 动态子组件\n\
    \n在渲染包含元素列表的组件时，开发者必须使用连接到子元素的唯一“key”属性。当向组件提供新数据（在 React 世界中称为 state）时，它的值有助于\
    \ diff 过程确定该项是否需要重新渲染。调和算法检查基本值以确定是否应该添加或删除项。在学习了 D3.js的数据连接后，这看起来熟悉吗？\n\n从 0.14\
    \ 版本开始，React 将渲染器放在单独模块中。我们可以在多个方法中使用相同的组件，例如原生应用、虚拟现实（React VR）和 DOM。这种适应性类似于\
    \ D3.js 代码可以在各种上下文中显示，包括 SVG 和 canvas。\n\n## D3.js 与 REACT\n\nReact 和 D3 的目标相同：以最有效的方式帮助我们处理\
    \ DOM 及其复杂性。它们也偏好纯函数（对于给定的输入一致地交付相同的输出且不产生副作用）和无状态组件。\n\n然而，这两个具有鲜明理念的库在决定由谁来渲染和动画用户界面元素时会发生冲突，因为它们有共同的利益。\n\
    \n## 总结 ■ 149\n\n我们得出结论，没有简单的解决方案。然而，我们可以在不同的层面集成 React 和 D3，在 D3 侧或 React 侧。\n\
    \n## 方法\n\n### React 内部 D3.js\n\n第一种策略是尽可能让 D3 控制。它使用 React 元素作为数据可视化的根。通过确保 shouldComponentUpdate\
    \ 始终返回 false，我们可以防止组件变化。\n\n```javascript\nclass Line extends React.Component\
    \ {\n  static propTypes = {...}\n  componentDidMount() {\n    // D3 代码创建图表\n \
    \   // 使用 this._rootNode 作为容器\n  }\n  shouldComponentUpdate() {\n    // 防止重新渲染\n\
    \    return false;\n  }\n  _setRef(componentNode) {\n    this._rootNode = componentNode;\n\
    \  }\n  render() {\n    <div className=\"line-container\" ref={this\n      setRef.bind(this)}\
    \ />\n  }\n}\n```当我们评估这种策略时，看到了它的优缺点。优点之一是它是大多数情况下都有效的方法。在将旧代码转换为 React 或利用 D3.js\
    \ 图表时，它也是最有逻辑的。\n\n## 150 征服 JavaScript：D3.js\n\n反过来，将 React 和 D3.js 代码结合在 React\
    \ 组件中可能被认为有点“坏”，因为它会包含过多的依赖项并使文件变得过大。此外，这种实现不符合 React 的惯用法。最后，我们无法在 HTML 中包含渲染版本的图表，因为\
    \ React 服务器端不会调用 componentDidUpdate 方法。\n\n## React Faux DOM\n\n根据 Oliver Caldwell\
    \ 的说法，“Fake DOM 是一种使用现有 D3 技术但通过 React 进行渲染的方法。”它通过实现伪 DOM 来欺骗 D3.js，使其认为正在与真实的\
    \ DOM 交互。我们在保持 React DOM 树的同时充分利用 D3.js。\n\n```javascript\nimport {withFauxDOM}\
    \ from 'react-faux-dom'\nclass Line extends React.Component {\n  static propTypes\
    \ = {...}\n  componentDidMount() {\n    const faux = this.props.connectFauxDOM('div','chart');\n\
    \n// D3 代码创建图表\n    // 使用 faux 作为容器\n    d3.select(faux).append('svg');\n  }\n\
    \  render() {\n    <div className=\"line-container\">\n      {this.props.chart}\n\
    \    </div>\n  }\n}\nexport default withFauxDOM(Line);\n```\n\n"
