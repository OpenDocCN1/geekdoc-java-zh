    \ your changes: dokku master git push If everything went correctly, you should\
    \ see the following on your terminal:\n\nUsing D3 and d3fc to Create a Complex\
    \ Financial Chart\n\nD3 is the clear winner among the JavaScript visualization/charting\
    \ frameworks when it comes to producing complicated bespoke charts. This chapter\
    \ will explain you the process of creating a \"advanced\" financial charting with\
    \ D3 and d3fc.\n\nD3 is a powerful tool for making charts and visualizations,\
    \ but its API is limited to routes, rectangles, groups, and other primitives.\n\
    \nMany charting frameworks are constructed with D3, making it much easier to generate\
    \ traditional charts, however the core capability of D3 is lost in the process.\n\
    \nWe've chosen a completely different approach with d3fc, extending the D3 language\
    \ to allow you to deal directly with series, annotations, and gridlines while\
    \ maintaining D3's underlying strength.\n\nAnyway, enough theory; this blog post\
    \ will show you how to make a chart by step. More practice, less theory!\n\n#\
    \ Making a Simple Graph\n\nLet's get started by creating a simple chart.\n\nThis\
