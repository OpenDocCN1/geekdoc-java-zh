    # 理解数据可视化


    我们仍然生活在一个数据驱动的世界里。大数据在近年来成为一个热词，企业和政府依赖它来做出决策。数据可视化是创建和探索数据视觉化表示的过程。我们通过数据可视化（通常称为
    DataViz）清晰、高效地呈现信息。我们使用图表、插图和图形来实现。为了帮助我们“一眼”解释数据，我们需要构建数据可视化。当看到一个数值表时，人们必须在得出任何结论之前先“阅读”它。相反，数据可视化允许消费者立即“看到”数据，让他们能够发现趋势并比较结果。


    ![](img/7fba45ff5201792b222a9c70c681c49a_28_0.png)


