    ```\n\nOpen your browser's inspector tool (right-click in your browser window\
    \ and choose Inspect). The DOM that makes up the page is visible in the inspector\
    \ window. The SVG node, commonly known as the &lt;svg&gt;/&lt;svg&gt; container.\
    \ The SVG element on the page is highlighted when you move your cursor over it\
    \ in the inspector.\n\n# SVG Coordinate System\n\nNow we’ve learned how to make\
