    \ to up; just make sure you get Three.js from this link: Download THREEJS. Let's\
    \ get started up our our project; all you have to do now is unpack the zip file.\
    \ Only the three.js and three.min files in the build folder are of importance\
    \ to us, so copy those. Then add a JavaScript subfolder and an index.html file\
    \ to your project's new folder. Paste the previously copied files into the JavaScript\
    \ folder.\n\n## INITIAL HTML CONFIGURATION\n\nTo establish the initial layout\
