    # D3.js DATA VISUALIZATION WITH ANGULAR


    One of the issues is that product teams confront as firms focus on gathering and
    analyzing data is presenting that in a relevant way. While many software developers
    prefer list and table displays, users sometimes find these presentation types
    overwhelming.


    D3.js is the most popular library available. It lets you manipulate the DOM based
    on dynamic data to build data visualizations. D3 is reactive, which means we use
    JavaScript to “draw” HTML elements onto your web page rather than generating a
    static image on the server and transmitting it to the client. D3 is, therefore,
    more powerful but also more challenging to use other charting libraries.


    Angular is a popular open-source front-end web framework that Google maintains.


    This section will show how to use D3 to add data visualizations to your Angular
    App. We will learn how to install Angular and D3, create three types of charts,
    and input data from a third-party API or a local CSV file. By the end, we will
    be able to create our data visualizations using D3 and Angular.'
