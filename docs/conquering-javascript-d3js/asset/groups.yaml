    \ #00ced1;\"> ...\n</div>\n```\n\n```\n<text style=\"font-size: 14px; font-family:\
    \ serif;\"> ...\n</text>\n```\n\nOnly the element to which inline styles are applied\
    \ is affected. If we wish to use the same design to several elements, we must\
    \ provide each of them the same style attribute. It does the job, although it\
    \ isn't the most efficient method.\n\nOn the other hand, external stylesheets\
    \ are perfect for applying styles globally. Asking D3 to add the same class name\
    \ to many items is one technique. We then use this class name as a selector in\
