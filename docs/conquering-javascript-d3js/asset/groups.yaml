    62 Conquering JavaScript: D3.js


    # BUILDING APPS WITH Three.js


    Three.js is described as an "easy to use, lightweight, cross-browser, general
    purpose D3 toolkit" in the project description on GitHub.


    Three.js makes drawing 3D objects and models to the screen simple for us developers.
    We''ve had to connect directly with WebGL without it, which, although not difficult,
    can make even the simplest development project take a long time. A "game engine"
    is traditionally made up of several components. Unity and Unreal, for example,
    not only give a mechanism to render things to the screen but also a slew of other
    capabilities like networking and physics.


    Three.js, on the other hand, has a more constrained approach and excludes features
    like physics and networking. However, because of its simplicity, it is easier
    to learn and more efficient for what it does best. For example, drawing objects
    to the screen.


    It also includes a wealth of examples that may be used to learn how to draw a
    variety of objects to the screen. Finally, it allows us to load models into our
    scene in a simple and native manner.


    If you don''t want your users to download an App from an App store or install
    anything in order to play your game, Three.js could be a good solution. If your
    game is browser-based, you have the lowest entrance barrier, which can only be
    a good thing.


    # DESIGNING GAMES WITH Three.js


    In this section we will explore Three.js by creating a game that incorporates
    shaders, models, animation, and game logic. The idea is very much straightforward.
    We''re piloting a spacecraft thats blasting across a planet, and our mission is
    to collect energy crystals. We must also keep track of our ship''s health by collecting
    shield boosters and avoiding too much damage from the rocks in the scenario.


    The spacecraft returns to the mother spacecraft in the sky at the end of our journey,
    and if the player selects NEXT LEVEL, they are given an additional chance, this
    time with a longer path for the spacecraft to fly through.


    As the user progresses through the game, the spacecraft speed rises, forcing them
    to work harder to avoid rocks and acquire energy crystals.


    +   To make such a game, we must first answer the following questions:

    - How can we propel a spacecraft ship ahead indefinitely across a body of water?'
  - '[PAGE 81]


    # Application Development I ■ 63


    +   - How can we tell whether the spacecraft ship and other items collide?

    - How do we make a user interface that works on both desktop and mobile devices?


    We will have overcome these obstacles by the time we finish this game.


    # CODE TUTORIALS


    However, before we begin coding, we must first brush up with some basic theory,
    particularly about how we will create a sense of movement in the game.


    Creating a Feeling of Motion


    Consider yourself in command of a Chopper in real life, and you''re chasing an
    object on the ground. The thing moves at a gradually increasing speed. You must
    gradually increase the speed of the Chopper that you are in to stay up.


    If the Chopper or the thing on the ground had no speed constraints, this would
    go on for as long as you wanted to keep up with the object on the ground.


    It''s enticing to apply the same standard while creating a game that follows an
    item, we''re doing in this scenario. That is, to update the speed of the camera
    following behind the item as it speeds up in the world space. This, however, poses
    an immediate concern. Essentially, everyone who plays this game will do it on
    their phones or PCs. These are machines with limited resources. If we try to generate
    an infinite number of objects as the camera moves and then move the camera, we
    will eventually exhaust all available resources, causing the browser to become
    unresponsive or crash.


    A plane (a flat 2D object) representing the ocean must also be created. When we
    do, we must include the ocean''s dimensions. We can''t, ever, make a plane that
    is infinitely large, nor can we make a massive plane and hope the user never gets
    far enough into our level to travel off the plane. That''s bad design, and it
    never feels counter-intuitive to people who won''t play our game enough to encounter
    encounters.


    Within Bounded Constraints, Infinite Movement


    We keep the camera immobile and move the surroundings around rather than moving
    it indefinitely in one direction. This has a number of'
  - '[PAGE 82]


    # 64 Conquering JavaScript: D3.js


    advantages. One advantage is that we always know where our spacecraft is because
    its position does not vary over time; it only moves side to side. This allows
    us to quickly determine whether objects are behind the camera and can be eliminated
    to save up resources.


    Another advantage is that we can make objects at any point in the distance. This
    means that as objects approach the player, other items or objects will appear
    in the distance, outside of the player''s view.


    These items are disposed of the scene when they disappear from view, either because
    the player collides with them or because they move behind the player.


    We''ll need to do two things to achieve this effect: To move things toward the
    camera, we must first procedurally shift each item along the depth axis. Second,
    we must assign a value to our water surface that will be offset, and we must increase
    this value over time.


    The water''s surface will appear to be moving quicker and faster as a result of
    this.


    Now that we''ve found out how to propel the spacecraft forward through the scene,
    let''s move on setting up our project.


    # CONFIGURE THE GAME PROJECT


    Let''s get this game started! The initial step is to configure our development
    environment. We have chosen Typescript and Web pack for this example. Since this
    chapter isn''t about the advantages of these technologies, we won''t go into great
    depth about them for a brief overview.


    When we use Webpack to build our project and save our files, it will detect that
    our files have changed and we will reload our browser with the stored modifications.


    It allows you to focus on this reduces any need to manually reload the browser
    whenever you make a change. We can use plugins like three-minifier to decrease
    the size of our bundle when we launch it. When we deploy our bundle, we can also
    use plugins like three-minifier to reduce its size.


    In this case, using Typescript ensures that our project is type-safe. When working
    with certain of Three.js'' internal types, such as Vector3 and Quaternions, we
    will find this quite advantageous. It is exceptionally convenient to know that
    we are assigning the accurate type of value to a variable.'
- md: "\n# Application Development I ■ 65\n\nFor the UI, we will also use Materialize\
    \ CSS. This framework will come in handy for the few buttons and cards that will\
    \ make our user interface.\n\nFor the first step, we need to create a new folder\
    \ to begin working on the project. Once the folder is created, now we need to\
    \ create package.json within the folder in which the following contents will be\
    \ posted.\n\n```json\n{\n  \"dependencies\": {\n    \"materialize-css\": \"2.0.0\"\
    ,\n    \"nipples\": \"0.7.0\",\n    \"three\": \"0.137.2.0\",\n  },\n  \"devDependencies\"\
    : {\n    \"@types/three\": \"0.137.2.0\",\n    \"@yushijinhun/three-minifier-webpack\"\
    : \"0.3.1\",\n    \"clean-webpack-plugin\": \"4.0\",\n    \"copy-webpack-plugin\"\
    : \"11.0.0\",\n    \"html-webpack-plugin\": \"5.5.0\",\n    \"raw-loader\": \"\
    4.0.2\",\n    \"ts-loader\": \"9.3.0\",\n    \"typescript\": \"4.6.4\",\n    \"\
    webpack\": \"5.7.20\",\n    \"webpack-cli\": \"4.9.2\",\n    \"webpack-dev-server\"\
    : \"4.9.0\",\n    \"webpack-glsl-loader\": \"git+https://github.com/grieve/webpack-glsl-loader.git\"\
    ,\n    \"webpack-merge\": \"5.8.0\"\n  },\n  \"scripts\": {\n    \"dev\": \"webpack\
    \ serve --config ./webpack.dev.js\",\n    \"build\": \"webpack --config ./webpack.production.js\"\
    \n  }\n}\n```\n\nThen enter npm i to install the packages to your new project\
    \ in a command window.\n\n# Addition of Webpack Files\n\nWe now need to build\
    \ three files for our project: a base Webpack configuration, development, and\
    \ production configurations.\n\n# Conquering JavaScript: D3js\n\nWithin your project\
    \ folder, create a webpack.common.js file and paste it in the following configuration:\n\
    \n```javascript\nconst HtmlWebpackPlugin = require(\"html-webpack-plugin\");\n\
    const CopyPlugin = require(\"copy-webpack-plugin\");\nmodule.exports = {\n  plugins:\
    \ [\n    // Build an index.html file that contains the appropriate package identifier\
    \ and links to our scripting.\n    new HtmlWebpackPlugin({\n      template:'html/index.html'\n\
    \    }),\n    // Copy gameplay components to the webpack results from our fixed\
    \ folder.\n    new CopyPlugin({\n      patterns: [\n        {from: 'static', to:\
    \ 'statics'}\n      ]\n    }),\n  ],\n  // Our game's starting point\n  entry:\
    \ './Spacegame.ts',\n  module: {\n    rules: [\n      {\n        // Insert your\
    \ GLSL shaders as HTML.\n        test: /.(glsl|vs|fs|frag)$/, exclude: /node_modules/,\
    \ use: ['raw-loader']\n      },\n      {\n        // Analyze our typescript and\
    \ transport it to Javascript with this loader.\n        test: /.tsx$/,\n     \
    \   use: 'ts-loader',\n        exclude: /node_modules/,\n      }\n    ]\n  },\n\
    \  resolve: {\n    extensions: ['.tsx', '.ts', '.js'],\n  }\n}\n```\n\nCreate\
    \ a webpack.dev.js file and add these details to it. The hot-reload capability\
    \ of the Webpack development server is set up as follows:\n\n```javascript\nconst\
    \ merge = require('webpack-merge')\nconst common = require('./webpack.common.js')\n\
    const path = require('path');\nmodule.exports = merge(common, {\n  mode: 'development',\
    \ // The source should not be minified.\n  devtool: 'eval-source-map', // For\
    \ easy development, use the source map.\n  devServer: {\n    static: {\n     \
    \ directory: path.join(__dirname, './dist'),\n      // From this location, static\
    \ files are served.\n      hot: true, // Whenever the code changes, refresh the\
    \ site.\n    }\n  }\n});\n```\n\nFinally, build a webpack.production.js file with\
    \ the following information:\n\n```javascript\nconst { merge } = require('webpack-merge')\n\
    const common = require('./webpack.common.js')\nconst path = require('path');\n\
    const ThreeMinifierPlugin = require(\"@yushijinhun/three-minifier-webpack\")\n\
    const { CleanWebpackPlugin } = require(\"clean-webpack-plugin\")\nconst ThreeMinifier\
    \ = new ThreeMinifierPlugin();\nmodule.exports = merge(common, {\n  plugins: [\n\
    \    ThreeMinifier, // Minifies our three.js code\n    new CleanWebpackPlugin()\
    \ // Between builds, it cleans up our 'dist' folder.\n  ],\n  resolve: {\n   \
    \ plugins: [\n      threeMinifier.resolver,\n    ],\n    mode: 'production', //\
    \ Reduce the size of our\n    output: {\n      path: path.resolve(__dirname, 'dist'),\n\
    \      filename: '[name].[f_hash:8].js', // Our product would contain a one-of-a-kind\
    \ hashing, forcing our users to download updates as when they become accessible.\n\
    \      sourceMap: '[name].[f_hash:8].map',\n    },\n    optimization: {\n    \
    \  splitChunks: {\n        chunks: 'all',\n    }\n  }\n});\n```\n\n# Typescript\
    \ Configuration\n\nThe next step is to set up our environment so we can use TypeScript.\
    \ Create a tsconfig.json file and fill in the following:\n\n```json\n{\n  \"compilerOptions\"\
    : {\n    \"moduleResolution\": \"node\",\n    \"strict\": true,\n    \"allowJs\"\
    : true,\n    \"target\": \"es217\",\n    \"module\": \"commonjs\"\n  },\n  \"\
    include\": [\"src/**/*.ts\"]\n}\n```\n\nOur development environment is fully up.\
    \ It's now time to start working on the game.\n\n# SETTING THE GAME\n\nThe following\
    \ elements make up our scene:\n- Background objects\n- Sky\n- Spaceship\n- Water\n\
    \nWe will do most of our work in a file named Spacegame.ts, but we will also partition\
    \ elements into various files so we don’t end up with a huge file.\n\n# SETTING\
    \ THE STAGE\n\nThe first step is to establish a Scene that Three.js can render.\
    \ We will add the following lines to Spacegame.ts to create a reference for the:\n\
    \n```typescript\nexport const scene = new Scene()\nexport const camera = new PerspectiveCamera(70,\
    \ window.innerWidth / window.innerHeight, 0.5, 10000)\n// Our renderer\nlet renderer:\
    \ WebGLRenderer;\n```\n\nFor our scenario, we will also need to use an animation\
    \ loop. The animation loop will be used to move items around the screen as needed,\
    \ and the render loop will be used to draw new frames. Let us now develop the\
    \ render function in Spacegame.ts. Because this function is simply requesting\
    \ an animation frame and then generating the scene, it will appear empty at first.\
    \ There are several reasons why we require an animation frame, but one of the\
    \ most important is that our game will pause if the user switches tabs, improving\
    \ performance and perhaps saving device resources:\n\n```javascript\n// Can be\
    \ viewed here\nconst animate = () => {\n  requestAnimationFrame(animate);\n  renderer.render(scene,\
    \ camera);\n}\n```\n\nSo now we have an empty scene with a camera but no other\
    \ objects. We make our scenario more realistic by adding some water. Frankly,\
    \ it has a water object sample that we can use in our scenario. It has real-time\
    \ reflections and is rather attractive; you can see it here.\n\nFortunately for\
    \ us, water will take care of the majority of our scene's needs. All that left\
    \ is to change the water shader slightly so that we can update it from time the\
    \ render loop. We do this because we offset the roughness of our water by an increasing\
    \ amount over time, it will give us the impression of speed. This is our game's\
    \ opening scene, but we are increasing the offset every frame to show. The pace\
    \ of the ocean seems to increase as the offset increases (even though the spacecraft\
    \ is stationary). Three.js GitHub has the water object. All we have to do now\
    \ is a tiny tweak to our render loop to make this offset configurable so we can\
    \ update it over time.\n\nWe will start by getting a copy of the Realistic water\
    \ visualization in 3-D (Water.js sample) from the Three.js source. This file will\
    \ be located at objects/water.js in the project.\n\nWhen we open the water.js\
    \ file, we will see codes something like below:\n\n```javascript\nmirrorCoord\
    \ = textureMatrix * mirrorCoord;\nvec4 mvPosition = modelViewMatrix * vec4 ( position,\n\
    2.0 );\ngl_Position = projectionMatrix * mvPosition;\n#include <beginnormal_vertex>\n\
    #include <defaultnormal_vertex>\n#include <depthbuffer_vertex>\n#include <fog_vertex>\n\
    #include <shadowmap_vertex>\n```\n"
