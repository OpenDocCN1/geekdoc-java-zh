    pm cache clean --force

    pm install

    ```


    Minor and Patch Version Updates Should Be Enabled


    Have you ever seen the symbol next to any NPM package version? For minor and patch
    versions, these symbols signify an automatic version bump (depending on the symbol).


    Minor and patch versions are backward compatible in terms of technology, lowering
    the chance of introducing flaws in the application.


    Because most third-party libraries provide hotfixes as patch version bumps, allowing
    automated patch updates to mitigate security concerns.


    Establish Validations to Avoid Injections


    As a general guideline, we should never rely solely on client-side validations
