- md: "\n# HTML AND THE DOCUMENT OBJECT MODEL (DOM)\n\nSince animated GIFs and frames\
    \ were the pinnacles of dynamic Internet entertainment, we've gone a long way.\
    \ We can see why GIFs were never popular for web-based data visualizations because\
    \ GIFs, like infov libraries built with VML, were required for older browsers,\
    \ but D3 is built for modern browsers that don't require backward compatibility.\n\
    \nAn HTML file, such as the one, is loaded when you arrive on a web page. The\
    \ DOM is created by the browser parsing the HTML file. We often refer to it as\
    \ the DOM tree which consists of a set of nested elements, also called nodes or\
    \ tags. The <head> and <body> components are children of the <head> parent in\
    \ our example. Similarly, the <html>, <div>, and <p> tags are all children of\
    \ the <body> tag. The <div> element has a sibling in the <h1> title. When you\
    \ load a web page, what you see on the screen are the elements contained within\
    \ the <body> tag.\n\n```\n<!doctype html>\n<html>\n<head>\n  <meta charset=\"\
    UTF-8\">\n  <title>A simple HTML file | D3.js in Action</title>\n</head>\n<body>\n\
    <h1>I am a title</h1>\n<div>\n  <p>I am a paragraph.</p>\n  <p>I am another paragraph.</p>\n\
    </div>\n</body>\n</html>\n```\n\nIn the DOM, three categories of information about\
    \ each element define its behavior and appearance: styles, attributes, and properties.\
    \ Styles determine color, size, borders, opacity, and so on. But depending on\
    \ the type of element, some attributes can also impact the appearance. The position,\
    \ size, and proportions of the various forms in SVG elements are controlled by\
    \ attributes. The \"checked\" property of a check box, for example, is true if\
    \ the box is checked and false if it is unchecked.\n\n# 20 Conquering JavaScript:\
    \ D3.js\n\nAttributes are used in SVG elements to control the location, size,\
    \ and proportions of the various shapes. The “checked” property of a check box,\
    \ for example, is true if the box is checked and false if it is unchecked.\n\n\
    D3 is used to select DOM elements: D3 allows us to edit DOM elements in an HTML\
    \ document, but we must first choose a specific element or collection of components\
    \ and then manipulate these elements using D3 methods.\n\n# D3 GLOBAL OBJECT\n\
    \nWe must include the D3 library d3.min.js in our HTML page. This creates a global\
    \ JavaScript object called D3, which contains all the necessary functions to get\
    \ started, similar to how jQuery creates a global object called jQuery (or $).\n\
    \n# SELECTION OF DOM\n\nBefore modifying DOM elements, we must first obtain their\
    \ references using the methods below:\n\n| Method | Description |\n| :--- | :---\
    \ |\n| d3.select(CSS-selector) | Based on the provided CSS-selector, it returns\
    \ the first matched element in the HTML document. |\n| d3.selectAll(css-selector)\
    \ | Based on the provided CSS-selector, it returns all matched elements in the\
    \ HTML document. |\n\nLet's look at how to combine the two.\n\n### d3.select()\n\
    \nBased on the provided CSS-selector, d3.select() method returns the first element\
    \ in the HTML document.\n\n### Element Name Selection\n\nUsing d3.select, the\
    \ following example selects the first matching element by tag name.\n\n```\n<!doctype\
    \ html>\n<html>\n<head>\n  <script src=\"https://d3js.org/d3.v4.min.js\"></script>\n\
    </head>\n<body>\n  <p>I LOVE Coding</p>\n  <p>HELLO WORLD</p>\n\n  <script>\n\
    \    d3.select(\"p\").style(\"color\", \"yellow\");\n  </script>\n</body>\n</html>\n\
    ```\n\nThe d3.select(\"p\") method returns the first <p> element in the above\
    \ example, and the d3.style(\"color\", \"red\") method sets the color attribute\
    \ to red.\n\n### Element Id Selection\n\nAs illustrated below, the d3.select()\
    \ method can also be used to fetch an element with a specific id:\n\n```\n<!doctype\
    \ html>\n<html>\n<head>\n  <script src=\"https://d3js.org/d3js.v4.min.js\"></script>\n\
    </head>\n<body>\n  <p id=\"p1\">I LOVE coding</p>\n  <p id=\"p2\">HELLO WORLD</p>\n\
    \  <script>\n    d3.select(\"#p2\").style(\"color\", \"green\");\n  </script>\n\
    </body>\n</html>\n```\n\nThe d3.select(\"#p2\") picks the <p> element with the\
    \ id p2 and applies the style() method to color it, as shown in the example above.\
    \ As a consequence, you may use d3's select method to select the first matched\
    \ element.\n\n### d3.selectAll()\n\nBased on the provided CSS selector, the d3.selectAll()\
    \ method returns all matching items in the HTML document. The below example chooses\
    \ elements by tag name.\n\n```\n<!doctype html>\n<html>\n<head>\n  <meta charset=\"\
    Content-type\" content=\"text/html; charset=utf-8\">\n  <script src=\"https://d3js.org/d3.v4.min.js\"\
    ></script>\n</head>\n<body>\n  <p>I LOVE Coding</p>\n  <p>HELLO WORLD</p>\n  <script>\n\
    \    d3.selectAll(\"p\").style(\"color\", \"pink\");\n  </script>\n</body>\n</html>\n\
    ```\n\nd3.selectAll(\"p\") returns all p elements in the given example, and style(\"\
    color\",\"red\") changes the font color to red.\n\n### Selection All Elements\
    \ by CSS Name\n\nThe following example shows how to pick components based on their\
    \ CSS class.\n\n```\n<!doctype html>\n<html>\n<head>\n  <meta charset=\"Content-type\"\
    \ content=\"text/html; charset=utf-8\">\n  <script src=\"https://d3js.org/d3.v4.min.js\"\
    ></script>\n  <style>\n    .myclass{\n      color:blue;\n    }\n  </style>\n</head>\n\
    <body>\n  <p class=\"myclass\">I LOVE COUNTRY</p>\n  <p>HELLO WORLD</p>\n  <p\
    \ class=\"myclass\">BLISS</p>\n  <script>\n    d3.selectAll(\".myclass\").style('color',\
    \ 'red');\n  </script>\n</body>\n</html>\n```\n\nIn the example above, d3.selectAll(\"\
    .myclass\") returns all elements with the \"myclass\" class. The style attribute\
    \ is set to color: red using the .style() function.\n\n### Nested Elements to\
    \ Pick\n\nAs demonstrated below, the select() and selectAll() methods can be used\
    \ to select nested components.\n\n```\n<!doctype html>\n<html>\n<head>\n  <script\
    \ src=\"https://d3js.org/d3.v4.min.js\"></script>\n</head>\n<body>\n  <table>\n\
    \    <tr>\n      <td>four</td>\n      <td>five</td>\n    </tr>\n    <tr>\n   \
    \   <td>six</td>\n      <td>seven</td>\n    </tr>\n  </table>\n  <script>\n  \
    \  d3.select(\"tr\").selectAll(\"td\").style('background-color','pink');\n  </script>\n\
    </body>\n</html>\n```\n\nThe selectAll(\"td\") method returns all matching <td>\
    \ components within that <tr> in the given example. Finally, the .style() technique\
    \ gives these <td> a pink background color. Method Chaining is defined as calling\
    \ selectAll() immediately after select().\n\n# D3 MANIPULATION OF THE DOM\n\n\
    We learned how to use D3 to select DOM elements in this part. After selecting\
    \ elements with d3.select() or d3.selectAll(), D3 provides the following DOM manipulation\
    \ techniques.\n\n| Method | Description |\n| :--- | :--- |\n| text(\"Content\"\
    ) | Gets or sets the element's text. |\n| append(\"element name\") | Inserts a\
    \ new element inside the specified element, but just before the end. |\n| insert(\"\
    element name\") | Adds a new element to the currently element. |\n| remove() |\
    \ Removes the specified element from the DOM. |\n| html(\"Content\") | Gets or\
    \ sets the selected element's inner HTML. |\n| attr(\"name\", \"value\") | On\
    \ the selected element, gets or sets an attribute. |\n| property(\"name\", \"\
    value\") | On the selected element, gets or sets an attribute. |\n| style(\"name\"\
    , \"value\") | The specified element's style is returned or set. |\n| class(\"\
    css class\", bool.) | Gets or removes a CSS class from the selection. |\n\n###\
    \ Use d3.selection with text()\n\nTo update or change the text content of selected\
    \ items, use the text() method.\n\n```\n<!doctype html>\n<html>\n<head>\n  <script\
    \ src=\"https://d3js.org/d3.v4.min.js\"></script>\n</head>\n<body>\n  <div>\n\
    \    <p></p>\n  </div>\n  <p></p>\n  <script>\n    d3.select(\"p\").text(\"I LOVE\
    \ MY COUNTRY.\");\n  </script>\n</body>\n</html>\n```\n\nUsing d3, we select the\
    \ first matching <p> element within div in the example above. select(\"p\").text(\"\
    This is paragraph.\") inserts \"I LOVE MY COUNTRY\" text to the selected paragraph\
    \ element after the <p> element is selected.\n\nBecause we used the d3.select()\
    \ technique, the text will only be added to the first matched element. If we use\
    \ the d3.selectAll() method, all <p> elements will have text added to them.\n\n\
    ### append()\n\nUse d3.select append to add a new DOM element to the end of a\
    \ selected DOM element, use the append() function.\n\n```\n<!doctype html>\n<html>\n\
    <head>\n  <script src=\"https://d3js.org/d3js.v4.min.js\"></script>\n</head>\n\
    <body>\n  <p>First </p>\n  <p>Second</p>\n  <script>\n    d3.select(\"body\").append(\"\
    p\");\n  </script>\n</body>\n</html>\n```\n\nIn the example above, d3.select(\"\
    body\") returns the body element, and append(\"p\") adds a new <p> element exactly\
    \ before the end of the body.\n"
  mdcn: "\n\n# HTML 与文档对象模型 (DOM)\n\n由于动画 GIF 和帧曾是动态互联网娱乐的巅峰，我们已经走过了很长的一路。我们可以明白为什么\
    \ GIF 一直在 Web 端数据可视化中并不流行，因为 GIF 像使用 VML 构建的信息库一样需要在旧浏览器中使用，而 D3 是为不需要向后兼容的现代浏览器构建的。\n\
    \n当你访问一个网页时，像下面这样的 HTML 文件会被加载。DOM 是由浏览器解析 HTML 文件而创建的。我们通常将其称为 DOM 树，它由一组嵌套元素组成，也称为节点或标签。在我们的示例中，`<head>`\
    \ 和 `<body>` 组件是 `<head>` 父元素的子元素。同样，`<html>`、`<div>` 和 `<p>` 标签都是 `<body>` 标签的子元素。`<div>`\
    \ 元素在 `<h1>` 标题有一个兄弟元素。当你加载网页时，你在屏幕上看到的是包含在 `<body>` 标签内的元素。\n\n```\n<!doctype\
    \ html>\n<html>\n<head>\n  <meta charset=\"UTF-8\">\n  <title>简单的 HTML 文件 | D3.js\
    \ 实战</title>\n</head>\n<body>\n<h1>我是一个标题</h1>\n<div>\n  <p>我是一个段落。</p>\n  <p>我是另一个段落。</p>\n\
    </div>\n</body>\n</html>\n```\n\n在 DOM 中，关于每个元素的三个类信息定义了它的行为和外观：样式、属性和属性。样式决定了颜色、大小、边框、透明度等。但根据元素的类型，某些属性也会影响外观。SVG\
    \ 元素中各种形状的位置、大小和比例是由属性控制的。例如，复选框的“checked”属性在框被选中时为 true，在未选中时为 false。\n\n# 20\
    \ 征服 JavaScript: D3.js\n\n属性被用于 SVG 元素中，用于控制各种形状的位置、大小和比例。例如，复选框的“checked”属性在框被选中时为\
    \ true，在未选中时为 false。\n\nD3 用于选择 DOM 元素：D3 允许我们编辑 HTML 文档中的 DOM 元素，但我们必须首先选择特定的元素或组件集合，然后使用\
    \ D3 方法操作这些元素。\n\n# D3 全局对象\n\n我们必须在 HTML 页面中引入 D3 库 `d3.min.js`。这创建了一个名为 `D3`\
    \ 的全局 JavaScript 对象，它包含了启动所需的所有函数，类似于 jQuery 创建一个名为 `jQuery`（或 `$`）的全局对象。\n\n\
    # DOM 选择\n\n在修改 DOM 元素之前，我们必须使用以下方法获取它们的引用：\n\n| 方法 |  |\n| :--- | :--- |\n| d3.select(CSS-selector)\
    \ | 基于提供的 CSS-selector，返回 HTML 文档中第一个匹配的元素。 |\n| d3.selectAll(css-selector) |\
    \ 基于提供的 CSS-selector，返回 HTML 文档中所有匹配的元素。 |\n\n让我们看看如何结合这两者。\n\n### d3.select()\n\
    \n基于提供的 CSS-selector，`d3.select()` 方法返回 HTML 文档中的第一个元素。\n\n### 元素选择\n\n使用 `d3.select`，下面的示例通过标签名选择了第一个匹配的元素。\n\
    \n```\n<!doctype html>\n<html>\n<head>\n  <script src=\"https://d3js.org/d3.v4.min.js\"\
    ></script>\n</head>\n<body>\n  <p>我热爱编码</p>\n  <p>你好 世界</p>\n\n  <script>\n  \
    \  d3.select(\"p\").style(\"color\", \"yellow\");\n  </script>\n</body>\n</html>\n\
    ```\n\n`d3.select(\"p\")` 方法返回上述示例中的第一个 `<p>` 元素，而 `d3.style(\"color\", \"red\"\
    )` 方法将颜色属性设置为红色。\n\n### 元素 ID 选择\n\n如下所示，`d3.select()` 方法也可以用于获取具有特定 id 的元素：\n\
    \n```\n<!doctype html>\n<html>\n<head>\n  <script src=\"https://d3js.org/d3js.v4.min.js\"\
    ></script>\n</head>\n<body>\n  <p id=\"p1\">我热爱编码</p>\n  <p id=\"p2\">你好 世界</p>\n\
    \  <script>\n    d3.select(\"#p2\").style(\"color\", \"green\");\n  </script>\n\
    </body>\n</html>\n```\n\n`d3.select(\"#p2\")` 选取 id 为 `p2` 的 `<p>` 元素并应用 `style()`\
    \ 方法对其着色，如上面的示例所示。因此，你可以使用 d3 的 select 方法来选择第一个匹配的元素。\n\n### d3.selectAll()\n\n\
    基于提供的 CSS 选择器，`d3.selectAll()` 方法返回 HTML 文档中所有匹配的项。下面的示例通过标签名选择元素。\n\n```\n<!doctype\
    \ html>\n<html>\n<head>\n  <meta charset=\"Content-type\" content=\"text/html;\
    \ charset=utf-8\">\n  <script src=\"https://d3js.org/d3.v4.min.js\"></script>\n\
    </head>\n<body>\n  <p>我热爱编码</p>\n  <p>你好 世界</p>\n  <script>\n    d3.selectAll(\"\
    p\").style(\"color\", \"pink\");\n  </script>\n</body>\n</html>\n```\n\n`d3.selectAll(\"\
    p\")` 返回给定示例中的所有的 `p` 元素，而 `style(\"color\",\"red\")` 将字体颜色改为红色。\n\n### 通过 CSS\
    \ 名称选择所有元素\n\n下面的示例展示了如何根据它们的 CSS 类选取组件。\n\n```\n<!doctype html>\n<html>\n<head>\n\
    \  <meta charset=\"Content-type\" content=\"text/html; charset=utf-8\">\n  <script\
    \ src=\"https://d3js.org/d3.v4.min.js\"></script>\n  <style>\n    .myclass{\n\
    \      color:blue;\n    }\n  </style>\n</head>\n<body>\n  <p class=\"myclass\"\
    >我热爱祖</p>\n  <p>你好 世界</p>\n  <p class=\"myclass\">极乐</p>\n  <script>\n    d3.selectAll(\"\
    .myclass\").style('color', 'red');\n  </script>\n</body>\n</html>\n```\n\n在上面的示例中，`d3.selectAll(\"\
    .myclass\")` 选取了带有 `myclass` 类的元素。`d3.select(\".myclass\")` 返回第一个 `myclass` 元素。\n\
    \n### 选择嵌套元素\n\n如下所示，`select()` 和 `selectAll()` 方法可以选取嵌套元素。\n\n```\n<!doctype\
    \ html>\n<html>\n<head>\n  <script src=\"https://d3js.org/d3.v4.min.js\"></script>\n\
    </head>\n<body>\n  <table>\n    <tr>\n      <td>四</td>\n      <td>五</td>\n   \
    \ </tr>\n    <tr>\n      <td>六</td>\n      <td>七</td>\n    </tr>\n  </table>\n\
    \  <script>\n    d3.select(\"tr\").selectAll(\"td\").style('background-color','pink');\n\
    \  </script>\n</body>\n</html>\n```\n\n`d3.select(\"tr\")` 返回表格中的第一个 `tr`，而 `selectAll(\"\
    td\")` 给这些 `td` 设置了粉色背景。\n\n# D3 的 DOM 操作\n\n我们学习了如何使用 D3 选择 DOM 元素。以下提供了 DOM\
    \ 操作方法：\n\n| 方法 | 说明 |\n| :--- | :--- |\n| text(\"Content\") | 获取或设置文本。 |\n| append(\"\
    element name\") | 在指定元素的内部添加新元素。 |\n| insert(\"element name\") | 在指定元素之前插入新元素。\
    \ |\n| remove() | 从 DOM 中移除指定的元素。 |\n| html(\"Content\") | 获取或设置选中元素的内部 HTML。\
    \ |\n| attr(\"name\", \"value\") | 在选中元素上获取或设置属性。 |\n| property(\"name\", \"value\"\
    ) | 在选中元素上获取或设置属性。 |\n| style(\"name\", \"value\") | 获取或设置选中元素的样式。 |\n| class(\"\
    css class\", bool.) | 从选择中获取或移除 CSS 类。 |\n\n### 使用 d3.selection text()\n\n要更新或更改选中项的内容，请使用\
    \ `text()` 方法。\n\n```\n<!doctype html>\n<html>\n<head>\n  <script src=\"https://d3js.org/d3.v4.min.js\"\
    ></script>\n</head>\n<body>\n  <div>\n    <p></p>\n  </div>\n  <p></p>\n  <script>\n\
    \    d3.select(\"p\").text(\"我热爱祖国.\");\n  </script>\n</body>\n</html>\n```\n\n\
    使用 d3，我们选择了上方示例中 div 内第一个匹配的 `<p>` 元素。`select(\"p\").text(\"这是一个段落.\")` 在选中的 `<p>`\
    \ 元素处插入“我热爱祖国”文本。\n\n### append()\n\n使用 `d3.select append` 向选中的元素末尾添加新的 DOM 元素，使用\
    \ `append()` 函数。\n\n```\n<!doctype html>\n<html>\n<head>\n  <script src=\"https://d3js.org/d3js.v4.min.js\"\
    ></script>\n</head>\n<body>\n  <p>第一个 </p>\n  <p>第二个</p>\n  <script>\n    d3.select(\"\
    body\").append(\"p\");\n  </script>\n</body>\n</html>\n```\n\n在上面的示例中，`d3.select(\"\
    body\")` 返回 body 元素，而 `append(\"p\")` 在 body 结束之前添加了一个新的 `<p>` 元素。\n\n"
