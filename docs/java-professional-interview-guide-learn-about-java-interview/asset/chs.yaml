  ### `final` 关键字的作用是什么？\n\n在 Java 中，没有像 C、C++ 等早期编程语言中存在的 `const` 关键字。`final` 关键字用于标记不可修改的内容。你可以将变量声明为\
  \ `final`，使其成为常量。你也可以将类声明为 `final`，使其无法被扩展。你甚至可以将方法声明为 `final`。如果你将一个方法声明为 `final`，则子类不允许重写该方法。\n\
  ### 我们可以将引用声明为 final 吗？这意味着什么？\n\n我们可以将引用声明为 `final`。将引用声明为 `final` 并不意味着你让它引用的对象是\
  \ final 的。当你将任何引用声明为 `final` 时，你无法将对象重新赋值给引用。\n考虑以下代码片段：\n```\n//编译错误\n在片段中，`String\
  \ x` 被声明为 `final`。这意味着我们不能将任何对象重新赋值给它。由于由于，第 2 行将编译失败。但正如你看到的，可以通过调用所引用的对象的 `concat()`\
  \ 方法来对对象进行更改。\n\n### `static` 变量的作用是什么？\n`static` 关键字用于声明类变量。通常，当我们声明任何数据成员时，它会为不同的对象独立实例化。不同的对象会分配到不同的变量副本。因此，如果一个对象对该变量进行了任何更改，另一个对象与此没有任何关系。另一个对象将拥有该变量自己的副本，并在上面进行处理。\n\
  \n另一方面，如果我们将变量声明为 `static`，则该变量的副本将在所有相同对象之间共享。因此，如果一个对象对此类变量进行了修改，另一个对象将获得该变量的更新副本。\n\
  ### `static` 方法的作用是什么？\n\n众所周知，我们可以在类中声明 `static` 变量。`static` 变量是类变量，所有对象共享同一个变量副本。当我们想要处理\
  \ `static` 变量时，建议使用 `static` 方法。因此，本质上，`static` 方法用于处理或返回 `static` 变量。\n### 可以使用非静态方法来处理静态变量吗？\n\
  \n可以。我们可以使用非静态方法来处理静态变量。尽管这在开发者脑海中可能会引起困惑，但在技术上来说，这是允许的。\n### 可以使用静态方法来处理实例变量吗？\n\
  \n不可以。每当我们声明 `static` 方法时，内部永远不会使用 `this` 关键字。实例变量总是由编译器加上 `this` 关键字的前缀。但是，`static`\
  \ 方法不属于任何特定的对象，它们被称为类方法，不能处理任何专门针对特定对象的业务逻辑。因此，我们不能在 `static` 方法中使用非静态成员。\n### 静态和实例变量可以声明相同的名称吗？\n\
  \n不可以，你不能为静态和实例变量使用相同的名称，因为这会给编译器带来困惑。\n### 在什么场景下可以使用静态变量？\n\n有很多场景可以使用静态变量。假设你有一个\
  \ `Employee` 类。如果你感兴趣统计创建了多少个 `Employee` 对象，你需要一个计数器变量，该变量在每次创建对象时都应该加 1。但如果你将计数器变量声明为实例变量，那么如果一个对象增加了计数器变量的值，其他对象仍然将获得计数器的原始值。在这种情况下，你可以将计数器声明为\
  \ `static`，这样对计数器变量的所有更新都将在所有 `Employee` 对象之间共享，如下所示：\n```java\n{\nint empId;\n\
  counter;\n\nEmployee(int empId,String empName) {\n}\n{\nreturn counter;\n(String[]\
  \ args) {\nEmployee\nEmployee\nEmployees\n}\n}\n\n### 除了变量之外，我可以在其他地方应用 static 吗？\n\
  \n\n### `this` 关键字的作用是什么？\n\n\n此外，如果局部变量和实例变量之间存在任何歧义，你可以使用 `this` 关键字来区分于局部变量的实例变量。\n\
  \n\n`super` 关键字指向父类。如果你从子类显式地调用父类的成员，就可以使用这个关键字。你可以调用父类的数据成员或成员函数。不仅如此，你还可以从子类构造函数显式地调用父类的构造函数。\n\
  \n\n\n\n\n# super 关键字必须是构造函数的第一行。\n\n\n当我们说处于一个子类中时，它显然包含了一些数据成员。很多时候，子类的数据成员依赖于父类的数据成员。因此，除非父类的数据成员被初始化，否则子类的数据成员将无法被初始化。所以，为了确保父类的数据成员在子类的任何成员之前被初始化，`super`\
  \ 关键字被放置在构造函数的第一行。\n\n\n当我们创建一个任何类的对象时，隐式地会调用该对象的构造函数。但在内部，该构造函数通过 `super` 关键字调用父类的构造函数。因此从实际上，尽管我们可以观察到父类的构造函数是先调用的，但从理论上来说，并不是这样的。“事情并非看起来都是那样。”总是子类的构造函数首先执行，它在内部调用父类的构造函数。\n\
  \n\n与 C++ 等传统编程语言不同，在 Java 中没有与类名同名的析构函数。但是，`finalize()` 方法在 Java 中被称为析构函数。该方法在对象内存从虚拟内存中删除时，由\
  \ `JVM` 隐式地调用。我们可以重写此方法，编写自定义代码以释放与当前对象相关的资源。\n\n\n以下方法是 `Object` 类的一部分，可以被子类重写：\n\
  - `protected Object clone()`\n- `protected void finalize()`\n- `public int hashCode()`\n\
  - `public String toString()`\n一旦你列出了 `Object` 类中的不同方法，接下来，你可以预期会有基于这些方法的一系列问题。\n\
  \n## `toString()` 方法的作用是什么？\n正如名称所示，该方法以 `String` 格式表示对象。它返回一个包含对象信息的字符串，这对用户来说是易读的。如果没有被重写，它将返回对象哈希值的十六进制表示。我们可以重写此方法，以便根据业务需求返回我们想要作为对象信息的的字符串。\n\
  \n## `equals()` 方法是什么，它是如何使用的？\n该方法用于检查对象的相等性。开发者可以重写此方法以实现检查对象相等性的业务逻辑。在这个方法中，开发者可以检查成员级别的相等性，并根据结果返回\
  \ `true` 或 `false`。如果该方法没有被重写，`Object` 父类将认为每个对象都不相等，并向调用者返回 `false`。\n\n## 我们可以用\
  \ `abstract` 关键字声明接口吗？\n我们可以使用 `abstract`\n\n关键字声明接口，但这不是必须的。接口内部默认是抽象类，因此我们可以将接口声明为抽象接口。\n\
  ## 如果接口在内部是一个类，它是否会默认扩展万能父类，即 `Object` 类？\n\n接口没有可用的万能父类。由于其抽象实现方式，没有任何业务逻辑的范围，因此不需要\
  \ `Object` 父类。\n## 接口中的默认方法（default method）是什么？\n\n默认方法的概念在 `JDK1.8` 中引入。通常，接口提供完全的抽象，但接口中的默认方法是接口中已实现的方法。这等同于创建一个结合了具体方法和抽象方法的抽象类。\n\
  ## 为什么接口中需要默认方法？\n\n有时，我们有一个被某些类实现的接口。假设现在接口因为某些业务需要想要再声明一个方法。但当我们向接口中添加某些额外方法时，与该接口连接的类将会失败，因为它们并不知道接口中引入的新新方法。\n\
  因此，在这种情况下，新创建的方法或多个方法可以创建为默认实现方法。通过这样做，依赖于接口的现有类不需要修改自己，因为接口中的方法有与其关联的方法体。将实现你的接口的新类可以在需要时重写该方法。\n\
  \n## 接口可以有多个方法作为默认实现方法吗？\n是的，接口可以拥有任意数量的方法作为默认实现方法。\n\n## 接口中的静态方法（static method）是什么，它的意义是什么？\n\
  接口中的静态方法与默认方法类似，这意味着它们拥有关联的方法体。但两者之间的区别在于，由于方法是静态的，实现该接口的子类没有权限重写它；另一方面，默认方法是可以重写的。\n\
  \n## 什么是函数式接口（functional interface）？\n函数式接口只有一个目的的接口。这意味着函数式接口在其内容只声明了一个方法。任何实现此接口的类都需要重写此方法，以确保它为函数式接口所声明的服务提供了含义。\n\
  \n## Java 中的万能父类（cosmic super class）是哪个？\n`Object` 类被称为 Java 中每个对象的万能父类。即使你没有显式提到任何扩展\
  \ `Object` 的类，默认情况下，`JVM` 也会将 `Object` 变为每个类的父类。\n\n## 等于运算符 (`==`) 和 `equals` 方法之间的区别是什么？\n\
  相等运算符 `==` 通常用于基本类型以检查变量的相等性。另一方面，`equals()` 方法通过比较数据成员来检查相等性。要检查两个对象是否相等，我们需要重写\
  \ `equals()` 方法。我们也可以对引用使用 `==` 运算符，但它检查的不是对象，而是引用的相等性。只有引用指向同一个对象时，`==` 才会返回 `true`。\n\
  \n## 什么是变长参数（var argument）？在哪里可以使用？\n当我们重载方法时，我们在修改方法的参数。我们要更改参数的类型或数量。如果我们想要重载一个接受相同数据类型不同数量参数的方法，与其声明具有不同数量的方法，不如使用变长参数。\n\
  \n```java\n    // 方法体\n}\nmethod(int b, int c) {\n}\nmethod(int b, int c, int d)\
  \ {\n    // 方法体\n```\n\n在前面的代码片段中，我们重载了三个接受不同数量整数参数的方法。这段代码片段可以用下面的变长参数替换：\n```java\n\
  method(int... values) {\n    // 方法体\n```\n\n## 声明变长参数方法的不同规则是什么？\n在使用变长参数时，必须遵循以下规则：\n\
  - 给定方法中必须且只有一个变长参数。\n\n\n\n\n\n## 使用 `var` 参数和数组作为方法参数有什么区别？\n\n\n## 什么是方法重写（Method\
  \ Overriding）？\n\n\n## Java 中方法重写的规则有哪些？\n\n\n-   被重写的方法必须具有相同的方法名和相同的参数列表。\n- \
  \  被重写的方法必须具有相同的返回类型或协变返回类型（协变返回类型是原始方法返回类型的子类型）。\n-   `final` 方法不能被重写。\n-   私有方法不能被重写，因为它们在声明或定义的所在的类外部不可见。\n\
  -   被重写的方法不能抛出新的或更宽泛检查异常（checked exceptions）。\n-   `strictfp` 修饰符对重写过程没有影响。\n- \
  \  静态方法不能被重写。\n\n\n静态方法是可以重载的，因为重载的概念仅限于参数的类型或数量。在重载方法时，应用于该方法的其他关键字并没有意义。\n\n\n\
  这个问题有点诡机。如果我们在父类中将方法声明为 `static` 并用不同的实现重写相同的方法声明，那么不会出现编译错误。但这不被视为重写。`static` 关键字在面向对象的任何概念中都不被考虑，特别是继承关系。因此，简而言之，我们可以说不能重写静态方法。\n\
  \n\n当我们在子类中重写方法时，必须保持方法的返回类型相同或原始返回类型的子类型。这种返回类型的子类型被称为协变返回。\n\n\n```java\n{\n \
  \   \n}\n\n    public Integer method with covariant return\n}\n```\n在前面的代码段中，类 `B`\
  \ 是类 `A` 的子类，它重写了父类 `A` 中定义的 `returnSomething()` 方法。如果你观察父类中方法的返回类型，它返回 `Number`。但在子类中，该方法返回\
  \ `Integer`，它是 `Number` 的子类型。这种返回类型被称为协变返回类型。\n\n## 我们可以更改重写方法的返回类型吗？\n根据规则，被重写方法的返回类型必须相同。然而，你还有另一个备选方案。与其保持返回类型完全相同，你可以将方法的返回类型保持为父类中定义方法的子类型。\n\
  \n## 在实现方法重载时，对访问修饰符有任何限制吗？\n准确地说，方法重载的概念仅与方法签名相关。在方法重载中，我们需要严格保持相同的方法名但不同的参数列表。方法重载与访问修饰符无关，因此在重载时，保持访问修饰符相同或不同没有任何限制。\n\
  \n注意：有时，面试官可能会在白纸上和你分享一些代码，其中用不同的访问修饰符实现了方法重载，因此请确保你清楚在阅读重载方法时需要观察什么。\n## 抽象类和接口之间有什么区别？\n\
  \n以下是抽象类和接口之间的区别：\n-   抽象类可以包含抽象方法，也可以包含具体方法；接口只能包含抽象方法。\n-   抽象类可以包含构造函数，但接口不能包含构造函数。\n\
  -   抽象类可以包含数据成员，但接口只能声明和初始化常量。\n-   抽象类可以拥有私有的、保护的甚至是公共的成员。另一方面，接口的所有所有内容默认都是公共的。\n\
  \n## 什么是标记接口（Marker Interface）？\n标记接口是一种特殊的接口，其内部没有声明任何方法。它甚至没有与其关联的字段。这种接口也称为标签接口（tagging\
  \ interface）。\n\n## 标记接口的用途是什么？\n标记接口用于指示编译器在运行时可以应用于某个类的特殊行为。你不需要重写任何方法来实现接口；它只是提供给编译器的某些额外信息。当然，还有比标记接口其他方法可以向编译器提供额外信息，例如在类内部声明某些标志。但如果我们使用标记接口，它会增加类的可读性。\n\
  \n## 你能列出一些你工作过的标记接口吗？\n我工作过不同的标记接口，比如像 等等等。\n\n## 你可以创建自己的标记接口吗？如何声明它？\n创建标记接口没有任何特殊的魔法。我们只需要创建一个不带方法的接口，它将被视为标记接口。然后，你可以在类上实现这个接口，以表示该类是你声明的标记接口类型。此外，在你的业务逻辑中，你可以检查该类是否为你声明的类型，然后允许对象进行某些处理。\n\
  \n\n\n\n如果你观察的话，第 2 行使用了 `Object` 类的引用来访问 `Employee` 的数据成员，由于多态引用，这是不可能的。因此，为了实现这一点，你需要将\
  \ `Object` 类的引用向上转型（up-cast），如下：\n```java\npublic boolean equals(Object o) {\n \
  \   Employee e=(Employee)o;//Downcasting\n```\n\n### Java 中变量类型类型？请解释它们的作用域。\nJava\
  \ 提供了以下类型的变量：\n\n#### 实例变量 (Instance variables)\n\n#### 局部变量 (Local variables)\n\
  当变量在方法或块内部声明时，被称为局部变量。局部变量的主要属性是它们仅在声明它们的块或方法内可见。你可以在方法、循环、甚至 if 条件中声明局部变量。与实例变量不同，局部变量没有默认值。\n\
  #### 静态变量 (Static variables)\n静态变量看起来与实例变量几乎相似，但有一个区别：它们需要用 `static` 关键字声明。静态变量也被称为类变量，因为它们没有为每个对象提供单独拷贝。变量的单一拷贝在同类的所有对象之间共享。一个对象的修改将反映在同类的其他对象上。与实例变量类似，所有的静态变量都有默认值。\n\
  \n引用变量是指指向对象的变量。我们可以在方法中局部声明这些变量，也可以在组合概念中将其作为实例变量使用。如果它们被用作实例变量，则该类的所有方法都可以访问它们。但如果在任何方法内部声明，它们仅在该方法内是访问的。\n\
  \n### Java 中的实例初始化块 (instance initializer block) 是什么？\n\n### Java 中静态初始化块和实例初始化块有什么区别？\n\
  静态初始化块用于初始化静态成员，而实例初始化块用于初始化实例变量。两者之间的主要区别是，静态初始化块只在生命周期期间被调用，而实例初始化块在每次创建该类的对象时被调用。\n\
  ### 你能解释 Java 中包装类 (wrapper classes) 的概念吗？\n包装类顾其实名，封装了数据。它们封装数据并将其转换为对象。因此，本质上，包装类是原始类型的对象形式。例如，对于\
  \ `int` 原型，有一个 `Integer` 包装类。同样，我们还有 `Byte`、`Short`、`Long`、`Double`、`Float`、`Character`、`Boolean`。\n\
  \n包装类提供了两个重要的功能：\n1. Java 中有些概念（如集合）可以使用对象而不是原始类型。因此，在这种情况下，如果我们想使用原始类型，可以使用相同的包装形式。\n\
  2. 包装类提供了将数据类型从一种转换为另一种类型的方法。\n### 什么是自动装箱 (auto-boxing) 和自动拆箱 (auto un-boxing)？在什么场景下观察到它们？\n\
  自动装箱是将原始类型转换为包装类的过程。自动拆箱是将包装类转换为原始类型的过程。\n\n\n当你尝试访问、修改或处理包装类时，会发生自动拆箱。例如，考虑两个 `Integer`\
  \ 包装类，你想将它们相加，如下：\n\nInteger i1;\nInteger i2;\nint sum = i1 + i2;\n在这种情况下，你不能直接相加\
  \ `i1` 和 `i2`，因为它们是对象。但在运行时，JVM 会拆箱包装类并从中提取值，然后执行加法过程。\n\n### 什么是不可变对象 (immutable\
  \ object)？你能列出你处理过的某些不可变对象吗？\n\n### 不可变对象的用途是什么？我们为什么要创建这样的对象？\n如果你不想让对象在创建后被修改，则会创建不可变对象。当我们创建一个多线程应用程序时，有时一个线程创建的对象可能会被另一个线程修改，导致系统可能以意想不到的方式运行。因此，为了确保你的对象不会被其他线程修改，你可以创建一个不可变对象。\n\
  \n可以。我们可以创建不可变对象。要创建不可变对象，在设计类时需要遵循以下规范：\n- 类的所有数据成员都应该是 `private` 的。因为如果不是私有的，它们可能会在类外被修改。\n\
  - 你必须为类准备一个带参数的构造函数以便初始化数据成员。\n- 类不能有 setter 方法。它可以包含 getter 方法。\n- 如果类包含其他对象引用，那么\
  \ getter 方法不应该返回对象的引用；相反，应该返回该对象的拷贝。\n\nJava 中的枚举是一种特殊的类，包含一组命名的常量。枚举类是定义的 `Enum`\
  \ 类的子类。在 Java 中，枚举还可以包含变量、方法和构造函数。\n\n### enum 可以扩展其他类吗？\n不可以，`enum` 不能扩展其他类，因为它已经扩展了\
  \ `Enum` 类。这违反了 Java 的策略，即“Java 不多重继承”。\n### 我们可以编写实现接口的 enum 吗？\n可以，`enum` 可以实现任何其他接口如类，因为它内部是一个类。你只需要记住，你必须重写接口中声明的方法。\n\
  \n当你访问枚举中存在的常量时，Java 内部提供了 `toString()` 方法，返回该常量或对象的字符串表示。你甚至可以重写 `toString()` 方法并返回表示对象的自定义字符串。\n\
  \n### 可以在 enum 中声明构造函数吗？\n\n### 为什么枚举的构造函数保持为私有？\n枚举保持为私有是为了使其内部存在的值或常量不应在外部修改。\n\
  ### 可以使用 `new` 关键字实例化 enum 吗？\n由于 `enum` 没有公共构造函数，你不能通过 `new` 关键字创建枚举的实例。\n\nJava\
  \ 枚举中有三个重要方法：\n- `values()`：此方法返回枚举中存在的所有值。\n- `ordinal()`：返回枚举常量的位置。\n\n\n` 标签内似乎只有了一些占位符（如\
