  \ 关于作者\nMandar Jog 是一位热情的 Java 培训师，已从事培训工作 15 年以上。他的专业领域是 Java 及 J2EE 相关技术，如 `Spring`、`Spring\
  \ Boot` 和 `Hibernate`。在培训之，Mandar 还是一名自由作家，并在 BPB 出版社编写了名为《Java 9.0 to 13.0》的书。他还担任一些\
  \ Java 相关书籍的技术评审员。他也是许多对应届和资深候选人进行 Java 技术面试的组织的核心小组成员之一。\n\n## 关于评审员\nAbhijeet\
  \ Rathod 自 2006 年起一直从事软件行业，目前担任经验丰富的软件开发经理兼架构师，涉及微服务架构、分布式系统以及跨云部署的架构、设计和实现。在职业生涯中，他利用敏捷方法、代码审查、DevOps\
  \ 和 CI-CD 为多个产品类型组织成功交付了多个项目。\n\n此外，他还积极参与具有不同技能的团队成员招聘，并作为自豪地领导成功团队的一部分对他们进行培养。\n\
  \n面对预算、需求不完整等挑战，他始终专注于对项目所需的每种语言/技术的的基础知识保持清晰。\n\n为了通过小包交付大价值，他认为需要对 OOPS、`SOLID`\
  \ 原则和设计模式有良好的理解。\n\n此外，Abhijeet 认为一个人应该培养一种 X 能力。\n\n\n\n# 第 1 章：技术之外的准备\n本主题主要涵盖应届候选人的非技术内容。本主题讨论了机会、他们应该如何介绍自己以及他们适合哪些角色。本主题的重点是桥接行业与候选人之间的差距。\n\
  \n## 第 2 章：Java 架构\n本主题是一个通用主题，将讨论关于 Java 的架构信息。它将从 Java 版本信息以及这些版本中引入的不同新概念开始。该主题还将涵盖\
  \ Java 内部如何从源代码转换为可执行文件，以及在 `JDK` 或 `JRE` 中提供的其他文件系统。\n\n## 第 3 章：Java 中的面向对象\n\
  本主题将描述面向对象语言的不同概念，并详细讨论这些概念在 Java 中的具体实现。本主题将涵盖所有的 OOP 概念，包括抽象类、接口等，这些是应届生面试中最重要的部分之一。\n\
  \n# 第 4 章：异常处理\n本主题将首先涵盖如何在 Java 中处理异常的完整概念。它将涵盖所有概念，如 `try`、`catch`、`finally`、`throws`\
  \ 和 `throw` 关键字。此外， true 异常处理的新功能，如自动资源管理等。\n\n## 第 5 章：文件处理\n本章介绍了如何与文件连接以对文件执行不同的操作。该主题还详细涵盖了\
  \ Java 中的 IO 概念。除了传统的 IO，还涵盖了新的 `java.nio` 包（即 `NIO`），并对缓冲区（buffer）和通道（channel）等进行了详细研究。\n\
  \n# 第 6 章：并发\n本章从多线程基础到并发应用开发方法的高级概念。除了基本的线程创建，还讨论了 `Executor Framework`、`fork &\
  \ Joins`、`Locks` 和 `Barriers`、原子整数（atomic integers）等。\n\n# 第 7 章：JDBC\n\n\n\n\n\n\
  # Java 中的 JDBC API\n本主题讨论了 Java 中的 `JDBC API`。我们将连接到 MySQL 数据库，并讨论 JDBC 中的不同概念。该主题涵盖了数据库连接、检索数据、插入数据以及更新记录等内容。在章节的后半部分，将讨论到事务、`RowSet`、`CachedRowSet`\
  \ 等。\n\n# 第 8 章：集合 (Collections)\n集合是面试中最重要的主题之一。本主题从集合的基础知识及其必要性开始讨论。此外，章节还讨论了不同类型的集合及其适用场景，以及使用\
  \ `collection API` 进行数据排序和搜索等不同技术。\n\n## 第 9 章：杂项\nJava 中有很多概念/类，很难归类到任何层次结构中。本主题关注\
  \ Java 中所有此类概念，这些概念可能在其他主题中未涵盖，但就面试而言可能非常重要。\n\n# 第 10 章：函数式编程\n函数式编程是如今的一种编程新方法。本章从函数式编程的需求以及它在现代编程时代的重要性开始。此外，还讨论了函数式接口、lambdas\
  \ 和流（stream）的实现。\n\n# 第 11 章：设计模式\n软件开发不仅仅是编写代码和生成解决方案。除此之外，我们还需要确保为应用程序创建一个灵活且健壮的架构设计。设计模式为应用设计提供了这种方法。本主题涵盖了一些对面试非常重要的设计模式。\n\
  \n# 第 12 章：Web 基础\n本主题专注于 Web 应用开发的基础。在进入 `spring` 和 `spring boot` 等高级主题之前，读者必须了解这些基本概念。该主题涵盖了\
  \ `HTTP` 简介以及网络相关概念。章节还简要介绍了如何使用 `Servlet` 和 `JSP` 创建 Web 应用。\n\n# 第 13 章：Spring\
  \ 和 Spring Boot\n`Spring framework` 是目前最流行且轻量级的依赖注入框架之一。章节使用 `spring framework 5.0`\
  \ 来解释从 `spring` 基础到 `spring framework` 不同项目的概念。除了该主题外，章节还讨论了用于用于创建 `REST endpoints`\
  \ 的 `Spring boot`。\n\n# 第 14 章：Hibernate\n`Hibernate` 是最重要的框架之一，它通过 `ORM` 概念简化了数据库连接。该主题涵盖了从\
  \ `hibernate` 基础到 `HQL` 和缓存等高级功能。\n\n## 下载彩色图片\n请点击链接下载本书的彩色图片：ownhttps://rebrand.ly/7eb340\n\
