  \nJava 提供了 `FilenameFilter` 接口，它允许你提供关于可以接受哪些文件的信息。该接口存在 `java.io` 包中，声明了如下 `accept()`\
  \ 方法：\n\n```\naccept(File directory, String name)\n```\n\n该方法接受两个参数：指向目录的 `File`\
  \ 对象和文件名。\n\n### 总结\n\n在本章中，我们讨论了用于 I/O 操作的不同类和接口。Java I/O API 数量庞大，但我们尝试涵盖许多在面试题中起着至关重要的类和接口，这正是本书的主要目标。在本章中，我们讨论了许多\
  \ Java 面试中可能会问到的问题。\n\n\n\n\n\n从编程早期开始，开发者们就在编写顺序程序来开发应用程序。通常，这些程序运行在一个整个生命周期内只执行单一任务的系统上。虽然起初这并不是大问题，但在硬件开发的后期，当硬件和操作系统演进到下一个阶段时，这种编程方式被认为是既低效又昂贵的。顺序程序没有充分利用操作系统和硬件的性能。这导致了多线程或并发编程概念的产生，使得不同的程序可以在操作系统上同时运行。要理解多线程程序的概念，你可以从日常生活中寻找实时例子。例如，在为茶烧水时，你可以去拿一张放在门垫上的报纸，或者在喝茶时，你甚至可以读报纸；这些任务本质上通常是异步的。同样，应用程序中也有许多任务互不依赖。这些任务可以使用线程的概念同时执行。\n\
  \n## 结构\n\n对于初级 Java 程序员来说，线程的概念是一个相对新的概念。如果你不理解多线程的基础知识，那么理解高级并发 API 将具有挑战性。在本章中，我们将讨论以下内容：\n\
  \n- 什么是线程，以及如何创建它\n- 创建线程的不同方法及其意义\n- 线程间的通信\n- 线程生命周期方法\n- 并发 API\n- 关于多线程的面试问答\n\
  \n## 目标\n\n在本章中，你将学习什么是线程以及如何创建它。我们还将讨论不同线程如何相互通信以创建一个高效的应用程序。在后期，我们将讨论 Java 的并发\
  \ API，它使得多线程编程方式比传统的编程方法更加简单。\n\n## 什么是多线程？你能解释一下多线程吗？\n\n多线程是指多个线程同时执行的情况。多线程消耗的内存更少。由于线程是轻量级的，它们增强了应用程序的性能。\n\
  \n## 什么是线程？\n\n线程是一个轻量级的子进程。它是一个独立的执行路径，因为每个线程运行在不同的栈帧中。一个进程可以包含多个线程。线程共享进程资源，但它们仍然独立执行。\n\
  \n## 多线程有哪些优点？\n\n优点如下：\n\n- 线程是轻量级的。因此，它增强了应用程序性能。\n- 多线程减少了服务器，因为一台服务器可以同时执行多个线程。\n\
  - 即使某些后台任务正在运行，多线程也允许应用程序始终保持响应以接受输入。\n- 由于多线程包含了多个线程的独立执行，它允许任务更快地执行。\n- 线程共享公共内存资源。因此，多线程提供了对缓存内存更好的利用。\n\
  \n## 什么是进程？你能区分进程和线程吗？\n\n执行中的程序被称为进程，而线程是进程的子集。它们之间的区别如下：\n\n- 进程是独立的，但线程是进程的子集。\n\
  - 进程在内存中具有不同的地址空间。然而，线程包含进程的共享地址空间。\n- 线程间的通信比进程间的通信更快更容易。\n- 与进程相比，线程之间的上下文切换更快。\n\
  \n## 多线程中同步编程和异步编程有什么区别？\n\n以下是同步和异步编程之间的区别：\n\n- **同步**：这是一种编程模型。在同步编程中，一个线程被分配完成一个任务。一旦线程开始处理该任务，只有在分配的任务完成后，它才能用于其他任务。\n\
  - **异步编程**：在异步步编程中，一个作业可以由多个线程完成。它增强了应用程序性能，从而提供了最大的可用性。\n\n## 可以预测线程的行为吗？\n\n没有人能预测线程的行为。之所以这么说，是因为线程的执行是由线程调度器的。开发者对选择执行哪个线程没有控制权。线程调度器在不同平台上可能有不同的实现。因此，可能会出现同一个线程程序在相同平台上的后续执行中产生不同输出的情况。\n\
  \n## 你如何理解线程间通信？\n\n多线程应用程序本质上由不同的线程执行其任务以实现业务需求。在实现这一目标时，这些多个线程可以相互通信。它们可能拥有数据或方法调用，这些在它们之间共享。这通常是为了确保\
  \ CPU 始终保持利用状态，减少其空闲时间。线程之间的这种通信产生了它们之间的信息交换。这种信息交换有时是复杂的，因为信息在业务逻辑完成之前就已经交换。为了控制这种混乱，线程间通信通过不同的方法（如\
  \ `wait` 和 `notify`）进行控制。\n\n## 线程中 `wait()` 方法的作用是什么？\n\n`Object` 类拥有 `wait()`\
  \ 方法用于 Java 中的线程间通信。该方法用于暂停当前线程，等待另一个线程不再调用 `notify()` 或 `notifyAll()` 方法。\n\n##\
  \ 你知道 synchronized 块吗？为什么要在 synchronized 块中调用 `wait()` 方法？\n\n当人们尝试进行线程间通信时，`wait()`\
  \ 方法就会出现。`synchronized` 块为相应的线程提供了监视器锁。一旦线程获得了锁，它就成了监视器的所有者。如果在调用 `wait()` 方法时不使用\
  \ `synchronized` 块，它将抛出 `java.lang.IllegalMonitorStateException` 异常。\n\n## 你如何在\
  \ Java 中维护线程的执行顺序？如果你有多个线程，你如何控制特定线程先执行？\n\n这可以通过在特定线程上调用 `join()` 方法来实现。假设你有三个线程，并希望\
  \ `thread1` 先完成任务，那么你可以对 `thread1` 调用 `join()`。记住，在调用 `join()` 方法之前，你必须对 `thread1`\
  \ 调用了 `start()` 方法。\n\n## `join()` 方法的作用是什么？\n\n`join()` 方法导致当前运行线程暂停，直到它连接的线程完成任务。\n\
  \n`join()` 方法有三种重载版本如下：\n\n- `join()`：此方法会将当前运行线程置于等待状态，直到调用该方法的线程死亡。如果线程被中断，它将抛出\
  \ `InterruptedException`。\n- `join(long millis)`：此方法与 `join()` 方法类似，但它会等待参数指定的时间。\n\
  - `join(long milliseconds, int nanoseconds)`：此重载方法除了毫秒外，还增加了纳秒来表示 `join` 的等待时间。\n\
  \n## 解释线程生命周期。线程生命周期中有哪些状态？\n\n每个线程在生命周期内都会经历以下状态：\n\n- **新建（New）**：在此状态下，创建了 `Thread`\
  \ 类的实例。然而线程并不是活的。\n- **可运行（Runnable）**：一旦对线程调用了 `start()` 方法，线程就会变为可运行。它使线程准备好运行。线程尚未处于运行状态，因为它还没有被线程调度器选中。\n\
  \n\n\n\n\n## 线程状态\n\n- 运行（Running）：线程调度器从线程池中选择该线程，并调用其 `run()` 方法。该方法的执行表示线程正在运行。\n\
  - 等待（Waiting）或阻塞（Blocked）：在此状态下，线程是存活的，但没有在运行，或者它可能在等待其他线程完成。\n- 死亡（Dead）或终止（Terminated）：当\
  \ `run()` 方法执行完成后，即达到此状态。此后，线程被认为已死亡或终止。\n\n## 什么是上下文切换？\n\n当我们处理多个线程时，我们会从一个线程切换到另一个线程。在上下文切换过程中，执行中的线程的状态会被存储起来。当线程再次获得执行机会时，会恢复这些存储的状态并从该点继续执行。\n\
  \n## Thread 类与 Runnable 接口\n\n区分创建线程时使用的 Thread 类和 Runnable 接口。\n\n线程可以通过两种方式创建：\n\
  1. 通过定义一个继承 `Thread` 类的类。\n2. 通过定义一个实现 `Runnable` 接口的类。\n\n**这两种方式之间的区别：**\n- 当使用\
  \ `Thread` 类的扩展时，该类无法继承另一个类，因为 Java 不支持多继承。然而，当使用 `Runnable` 接口的实现时，该类仍然可以另一个类以利用其服务。\n\
  - 一旦我们写了一个自自 `Thread` 的类，每个线程都会创建一个唯一的对象并关联。然而，如果使用 `Runnable` 接口的实现，多个线程将共享同一个对象。\n\
  - `Thread` 类拥有内置方法，而 `Runnable` 接口只有一个方法。\n\n## Thread 和 Runnable 之间是什么关系？\n\n`Thread`\
  \ 类实现了 `Runnable` 接口。由于 `Runnable` 接口声明了 `run()` 方法，`Thread` 类对 `run()` 方法实现了空实现。\n\
  \n## Thread 构造函数\n\nThread 类提供了哪些重载的构造函数？\n\n（表 6.1：线程的构造函数）\n\n## 线程生命周期方法\n\n\
  ### 我们可以启动两次线程吗？如果对线程调用两次 `start()` 方法会发生什么？\n\n不，无法多次重启线程。一旦线程启动，它将由线程调度器执行并完成\
  \ `run()` 方法。之后，它会进入死亡状态。如果仍然尝试启动线程，将抛出一个异常类型的异常。\n\n### 是否可以直接调用 `run()` 方法而不是\
  \ `start()`？\n\n`run()` 方法是一个有效的公共方法。所以显然，可以直接调用 `run()` 方法。但我们需要理解这种调用方式的区别。当直接调用\
  \ `run()` 方法时，它不会作为线程工作，它会被视为普通对象调用了 `run()` 方法。因此，不会创建新的栈。当调用 `start()` 方法时，它会在内部调用\
  \ `run()` 方法，这会为线程创建一个新的栈。\n\n### 强制要求重写 `run()` 方法吗？如果我们不重写 run 方法会发生什么？\n\n`Thread`\
  \ 类是一个具体类，所以当人们继承自 `Thread` 的类时，并没有强制重写 `run()` 方法。由于我们没有重写该方法，新创建的线程没有自定义代码可以执行，什么都不会发生。\n\
  \n然而，如果我们正在编写实现 `Runnable` 接口的类，那么我们就没有选择，必须重写 `Runnable` 接口的 `run()` 方法。\n\n###\
  \ 我们可以重写 `start()` 方法吗？如果重写它会发生什么？\n\n`Thread` 类拥有 `start()` 方法，该方法不是 final 的。因此，重写此方法是合法的。但当我们在代码中对线程调用内置的\
  \ `start()` 方法时，它在内部调用 `run()` 方法，其中包含了为新线程编写的自定义代码。如果我们重写了 `start()` 方法，那么 `run()`\
  \ 方法将不会在内部调用。因此，我们需要显式地调用 `run()` 方法，否则它永远不会被调用。\n\n## 已弃方法\n\n### 为什么 `suspend()`\
  \ 和 `resume()` 方法被弃用了？\n\n`suspend()` 方法容易导致死锁。当目标线程持有对象的锁时，如果它处于挂起状态，其他任何线程都无法锁定该对象，直到目标线程恢复。尝试获取已由目标线程拥有的对象或监器锁的新线程，必须调用目标线程的\
  \ `resume()` 方法，否则会导致死锁条件。这种死锁也被称为冻（frozen）。`suspend()` 方法将线程从运行状态置于等待状态。现在，只有当对线程调用已弃用的\
  \ `resume()` 方法时，线程才能从等待状态变为可运行状态。`resume()` 方法仅与 `suspend()` 方法配合使用，这也是它被弃用的原因。\n\
  \n### 为什么 `destroy()` 方法被弃用了？\n\n`destroy()` 方法同样容易导致死锁。当目标线程持有被销毁对象的锁时，没有线程可以锁定该对象。这与不当使用\
  \ `suspend()` 和 `resume()` 方法形成的死锁非常相似。一旦形成死锁，必须调用 `destroy()` 方法。当在线程 上调用 `destroy`\
  \ 方法时，将抛出一个运行时异常，且 `destroy()` 方法将线程从运行变为死亡状态。\n\n## 比较\n\n### 解释 `wait()` 和 `sleep()`\
  \ 方法的区别。`wait()` 和 `sleep()` 方法有什么区别？\n\n最重要的区别之一是这些方法的层次结构。`wait()` 定义在 `Object`\
  \ 类中，而 `sleep()` 定义在 `Thread` 类中。`wait()` 方法释放线程获取的锁；然而，`sleep()` 方法不会释放锁。\n\n###\
  \ 线程之间如何通信？开发者可以使用哪些方法来实现线程间通信？\n\n多个线程可以通过 `notify()` 和 `notifyAll()` 方法进行相互通信。`wait()`\
  \ 方法可用于等待另一个线程的结果。`notify()` 和 `notifyAll()` 方法用于向处于等待状态的线程发送通知。\n\n### 为什么 `wait()`、`notify()`\
  \ 和 `notifyAll()` 在 `Object` 类中而不是 `Thread` 类中？\n\n`Object` 类拥有监器，多个线程可以访问同一个对象。一次只能有一个线程持有对象监器以执行同步方法或块。`Object`\
  \ 类提供的 `notify()` 和 `notifyAll()` 方法允许在在该对象上创建的所有线程能够轻松地相互通信。\n\n\n\n\n\n如果 `Thread`\
  \ 类提供了 `notify()` 和 `notifyAll()` 方法，那么线程间的通信将成为一个问题。对象上的同步将变得不可行。如果每个线程都有自己的监视器（monitor），那么将没有实现同步的方法，这将导致对象状态的不一致。\n\
  \n## 什么是线程饥饿（thread starvation）？\n\n线程饥饿发生在线程没有足够的 CPU 时间来执行任务时。这可能是由于不同的原因引起的，例如：\n\
  \n- 与高优先级线程相比，低优先级线程获得的执行所需的 CPU 时间较少。因此，低优先级线程可能会因为等待获取足够的 CPU 来执行任务而导致饥饿。\n- 在死锁情况下，两个或多个线程互相等待对方释放锁。因此，这两个线程都会由于无法获取\
  \ CPU 而处于饥饿。\n- 线程可能长时间等待对象监视器的锁（monitor lock），因为没有其他线程在调用 `notify()` 或 `notifyAll()`\
  \ 方法。\n\n## 解释守护线程（daemon thread）。什么是守护线程？\n\n守护线程是低优先级线程。守护线程为用户线程提供后台支持和服务。如果程序中只剩下守护线程，JVM\
  \ 会自动终止守护线程。`Thread` 类中的以下两个方法可用于守护线程：\n\n- `setDaemon(boolean)`：该方法用于将线程标记为守护线程或用户线程。\n\
  - 该方法用于检查线程是否为守护线程。\n\n### 如何创建守护线程？如果线程已经启动，我们可以把用户线程变成守护线程吗？\n\n如果一个线程已经启动，之后再尝试将其设置为守护线程，将会抛出异常。人们只能在启动线程之前创建守护线程。\n\
  \n下面的代码段演示了如何创建守护线程：\n\n```java\npublic class DaemonThread extends Thread {\n  \
  \  public DaemonThread() {\n    }\n\n    public void run() {\n        // 检查线程是否为守护线程\n\
  \        if (Thread.currentThread().isDaemon()) {\n            System.out.println(getName()\
  \ + \" is Daemon\");\n        } else {\n            System.out.println(getName()\
  \ + \" is User\");\n        }\n    }\n\n    public static void main(String[] args)\
  \ {\n        DaemonThread thread1 = new DaemonThread();\n        // 将用户线程设置为守护线程\n\
  \        thread1.setDaemon(true);\n        thread1.start();\n    }\n}\n```\n\n##\
  \ 什么是停机钩子（shutdown hook）？\n\n停机钩子是在 JVM 关之前隐式调用的线程。人们可以使用它在 JVM 正常或异常关闭时执行资源清理以保存状态。停机钩子只有在\
  \ JVM 关闭时才能被启动。停机钩子比其他方式更可靠，因为停机钩子不运行的概率非常小。可以调用 `Runtime` 类的 `halt(int status)`\
  \ 方法来停止停机钩子。\n\n## 我们什么时候应该中断（interrupt）一个线程？\n\n一旦对线程调用了 `wait()` 或 `sleep()` 方法，线程就会暂停。当我们想要通过调用\
  \ `interrupt()` 方法打破该线程的睡眠或等待状态时，就可以中断该线程。\n\n## 什么是同步？如何实现同步？\n\n有时，应用程序拥有可以被多个线程访问的共享资源。同步是控制多个线程访问此类共享资源的能力。同步用于防止线程干扰并防止一致性问题。每当多个线程尝试执行相同的任务时，很有可能获得错误的结果。为了避免这种情况，可以使用同步机制。在同步中，一次只允许一个线程执行。\n\
  \n可以通过以下方式实现同步：\n- 同步方法（Synchronized method）\n- 同步块（Synchronized block）\n- 静态同步方法（Static\
  \ synchronized method）\n\n### 你能提供一个应用程序中同步的实时示例吗？\n\n一个常见的例子可以是并发读写文件。想象这样一个场景：一个用户正尝试从文件中读取，而另一个用户正尝试更新文件。如果文件同时被两个用户访问，那么最终结果将非常复杂且诡异。在这种情况下，你可以利用同步的概念，在第一个用户仍在读取文件时，控制第二个用户进入以更新文件的操作。\n\
  \n## 同步块（synchronized block）的目的是什么？\n\n同步允许单个线程执行函数中编写的代码以避免副作用。但有时，只有几行代码可能会引起副作用，而不是整个函数。这意味着没有必要将整个函数都设为同步。在这种情况下，可以使用同步块对任何共享资源锁定对象。一次只有一个线程可以在同步块内部编写的特定资源上执行，而所有其他尝试进入的线程都会被阻塞。\n\
  \n## 我们可以将构造函数声明为同步吗？\n\n不，我们不能将构造函数声明为同步。构造函数用于创建对象的实例。这意味着当调用构造函数时，对象的创建过程正在进行。因此，在对象创建完成之前，不需要任何同步。如果我们尝试将构造函数声明为同步，将会显示编译错误。\n\
  \n**注意：** 需要记住构造函数不能是同步的；但在构造函数内部编写同步块是可以。\n\n## 你能解释一下内部锁（intrinsic lock）吗？\n\n\
  当同步围绕一个实体构建时，它被称为内部锁或监视器（monitor）。内部锁在强制执行对象状态的排他访问以及建立对可见性关重要的关系方面起着至关重要的作用。每个对象都关联有一个锁。当线程在访问对象成员之前需要进行排他且一致的访问时，对象应该获取对象的内部锁。\n\
  \n**注意**，在任务完成后，应该释放锁。线程仅在获取锁和释放锁之间拥有内部锁。一旦线程拥有了内部锁，其他线程就无法获取该锁。这意味着其他线程在尝试获取锁时会被阻塞。\n\
  \n## 什么是重入同步（reentrant synchronization）？\n\n当一个线程拥有锁时，另一个线程无法获取锁，但线程可以获取它已经拥有的锁。重入同步是允许线程多次获取同一个锁的情况。重入同步描述了这种情况：同步代码直接或间接地调用了另一个包含同步的方法，更重要的是，两组代码使用了同一个锁。在没有使用重入同步的情况下，同步代码需要许多额外的预防措施来避免线程阻塞。\n\
  \n## 什么是死锁（deadlock）？\n\n在多线程应用程序中，线程间的通信是非常正常的。死锁是指所有线程都在等待某种资源，而该资源被另一个同样处于等待状态的线程持有。这意味着没有一个线程正在执行，也没有执行的机会。因此，所有线程都普遍处于等待状态。死锁是一个非常复杂的情况，在编写多线程应用程序时，人们应该总是避免它。\n\
  \n### 如何检测死锁情况？如何避免它？\n\n我们可以通过在命令行中运行代码并收集线程转储（thread dump）来检测死锁情况。如果代码中存在任何死锁，命令行将显示相关消息。避免死锁情况的某些方法如下：\n\
  \n- 避免使用嵌套锁（nested lock）。\n\n\n\n\n嵌套锁是导致死锁的常见原因之一。当向多个线程提供锁时，就会发生死锁，因此要确保在任何特定时刻一个锁只给某一个线程。\n\
  \n避免使用不必要的锁。\n\n如果不需要，必须避免使用锁。\n\n### 使用线程连接 (thread join)\n线程连接允许等待某个线程，直到另一个线程完成其执行。合理地使用\
  \ `join` 方法有助于避免死锁。\n\n### 解释线程调度器\n开发者创建线程。然后，这些线程就在线程调度器的监管下运行。线程调度器是 JVM 的一部分，它负责调度线程并决定执行哪个线程。线程调度器使用抢占式和时间片两种机制来执行这种线程调度调度。线程调度器根据线程的优先级来决定选择哪个线程。调度器还负责确定线程的等待时间。\n\
  \n### 什么是抢占式调度、非抢占式调度和时间片？解释抢占式调度和非抢占式调的优点\n以下是用于线程调度的不同算法：\n\n#### 抢占式调度\n抢占式调度是一种根据优先级优先分配任务的调度方法。在某些情况下，在运行任何低优先级任务之前运行高优先级任务是非常重要的。有时，低优先级任务的线程正在运行；但我们仍然希望执行高优先级的任务。在抢占式调度中，具有最高优先级的任务将一直执行，直到它们进入等待状态或死锁状态，或者有其他更高优先的任务出现。\n\
  \n#### 抢占式调度的优点\n- 抢占式调度方法是一种更健壮的方法，因为单个进程无法垄断 CPU。\n- 任务在被中断后会重新考虑运行任务的选择。\n- 每一个事件都会导致运行任务的中断。\n\
  - 在这种方法中，操作系统确保所有运行进程的 CPU 使用是相同的。\n- 抢占式调度在我们用于多编程环境时是有益的。\n\n#### 非抢占式调度\n在非抢占式调度方法中，CPU\
  \ 被分配给特定的进程。保持 CPU 忙的进程将通过切换上下文或终止来释放 CPU。它不需要任何特殊的硬件，因此这种调度被用于各种硬件平台。非抢占式调度发生在进程自愿进入等待状态或终止之后。\n\
  \n#### 非抢占式调度的优点\n- 调度提供了较低的调度开销。\n- 概念上这是一种非常简单的方法。\n- 它倾向于提供高吞吐量。\n- 调度需要较少的计算资源。\n\
  \n#### 时间片\n在时间片调度中，特定任务执行预定义的时间片，之后，它会重新进入就绪任务的线程池。然后，线程调度器根据优先级或其他因素决定下一个应该执行哪个任务。\n\
  \n### 什么是线程优先级？\n线程优先级是一个与线程关联的 1 到 10 的数字。数字 1 表示最低优先级，10 表示最高优先级。`Thread` 类还提供了\
  \ `final static int` 类型的变量来设置线程优先级。与低优先级线程相比，具有 `MAX_PRIORITY` 的线程可能会获得更多的 CPU。`setPriority(int)`\
  \ 用于更改线程的优先级，该方法返回线程所拥有的优先级。\n\n### 什么是竞态条件 (race condition)？\n在多线程场景下，多个线程可能需要访问相同的资源。竞态条件实际上是多个同时执行的线程试图同时访问共享资源时发生的问题。人们可以正确地使用同步机制来避免竞态条件。\n\
  \n### Java 中的 volatile 关键字是什么？\n`volatile` 是一个用于在多线程编程中实现线程安全的关键字。一个 volatile 变量的变化对所有其他线程都是可见的，因此一个变量一次由一个线程使用。\n\
  \n### 什么是 ThreadLocal？\n当应用程序使用多线程或并发代码时，会伴随着同步或锁的开销。但这对应用程序的可扩展性有很大影响。当多个线程共享一个对象时，同步是实现安全的方法。`ThreadLocal`\
  \ 是另一种实现线程安全的方法。它不需要同步；而是通过为每个线程显式地提供对象的副本来消除共享。对象不再被共享，因此不再需要同步。这自动提高了应用程序的可扩展性和性能。\n\
  \n### 什么是线程池？\n线程池是一组等待分配任务的工人线程。线程池中的线程受调度器的监管，调度器从池中拉取提取一个线程并为其分配一个任务。一旦分配给线程的任务完成，该线程就会返回线程池。线程池的大小取决于保留备用执行的线程总数。\n\
  \n### Java 并发中的原子操作 (atomic action) 是什么？\n原子操作是在单个任务单元中执行且不受任何其他操作干扰的操作。原子方法在 `java.util.concurrent`\
  \ 包中可用。在正在的任务中间是不可能的停止原子操作。它只在任务完成后才会停止。对于原始变量，所有的读写操作都是原子操作（`long` 和 `double` 除外）。对于\
  \ volatile 变量，所有的读写操作都是原子操作。\n\n### Java 并发 API 中的 lock 接口是什么？\n`java.util.concurrent.locks.Lock`\
  \ 接口被用同步机制。它的工作原理类似于 `synchronized` 块。锁与 `synchronized` 块之间有几点区别，如下所示：\n\n- `Lock`\
  \ 接口提供了等待线程获得访问的保证，而 `synchronized` 块不保证。\n- `Lock` 提供了未获得访问时的超时选项，而 `synchronized`\
  \ 块不提供。\n- `Lock` 接口的方法（如 `lock()`）可以在不同的方法中调用，而单个 `synchronized` 块必须完全包含在一个方法内。\n\
  \n### 你使用并发 API 吗？你处理过哪些并发 API？并发 API 的主要组件是什么？\n并发 API 可于 `java.util.concurrent`\
  \ 包。我们可以在包中找到以下类和接口：\n\n`Executor`\n- `ForkJoinPool`\n- `ExecutorService`\n- `ScheduledExecutorService`\n\
  - `Future`\n- `TimeUnit` (枚举)\n- `CountDownLatch`\n- `CyclicBarrier`\n- `Semaphore`\n\
  - `ThreadFactory`\n- `BlockingQueue`\n- `DelayQueue`\n- `Locks`\n- `Phaser`\n\n\
  ### 并发 API 中的 Executor 接口是什么？\n`Executor` 接口是由包提供的，可以通过 `execute()` 方法来执行新任务。这是一种自动实现多线程的方法，无需开发者花费额外精力来创建和管理线程。\n\
  \n### 解释并发 API 中的 ExecutorService 接口\n`ExecutorService` 是 `Executor` 接口的子接口，它增加了管理生命周期的功能。\n\
  \n### 解释 ScheduledExecutorService 和 ExecutorService 接口之间的区别？\n\n\n\n\n`java.util.concurrent`\
  \ 包包含了 `ExecutorService` 和 `ScheduledExecutorService` 接口。`ExecutorService` 允许在后台对任务进行异步执行。`ScheduledExecutorService`\
  \ 接口比其父类多了一些额外方法。这些方法允许在延迟后或固定时间间隔后重复执行 `Runnable` 和 `Callable` 任务。\n\n### `Callable`、`Runnable`\
  \ 和 `Future` 接口之间的区别是什么？\n\n`Callable` 和 `Runnable` 接口都用于对多线程执行感兴趣的类，但它们之间的区别如下：\n\
  \n- `Callable` 接口仅在 Java 5 之后才能使用，而 `Runnable` 接口从 Java 的第一个版本就可以使用。因此，`Callable`\
  \ 是 `Runnable` 的改进版本。\n- `Callable` 接口可以返回结果，但 `Runnable` 接口不能返回任何结果。\n- `Callable`\
  \ 接口可以抛出受检异常（checked exception），但 `Runnable` 接口不能。\n\n另一方面，`Future` 接口用于提供并发过程的结果，它由\
  \ `Callable` 接口返回。该接口包含以下实现方法：\n\n- `cancel(boolean)`：此方法用于取消已分配任务的执行。\n- 该方法等待直到执行完成，之后获取结果。\n\
  - 该方法返回一个 `Boolean` 值。当任务在完成之前被取消时，该方法返回 `true`。\n- 该方法也返回一个 `Boolean` 值。如果作业成功完成，则返回\
  \ `true`；否则返回 `false`。\n\n### 传统多线程与并行编程之间的区别是什么？\n\n多线程设计用于用于单 CPU 工作，并利用 CPU 的空闲时间。遗憾的是，尽管系统具有多核心，多线程仍无法充分利用这一点。`fork-join\
  \ framework`（ForkJoin 框架）使用了并行编程，它可以利用计算机中的多个处理器，从而增强应用性能。\n\n### Java 中的 `fork-join\
  \ framework` 是什么？\n\n`fork-join framework` 在 JDK 7 中引入到 `java.util.concurrent` 包中。`fork`\
  \ 和 `join` 框架用于实现并行编程。该框架使用分治策略将一个大任务分解为更小的、易于管理的任务。\n\n### `ForkJoin framework`\
  \ 中的分治算法是什么？\n\n一个大任务被分解成更小的任务，使得子任务足够小到可以独立解决。分治策略递归地将任务分解为更小的子任务，直到子任务不再小到可以独立解决。\n\
  \n### 请说明 `ForkJoinPool` 的特征。为什么必须显式关闭 `ForkJoinPool`？\n\n`ForkJoinPool` 是一个特殊的线程池，专为\
  \ `fork-join` 任务拆分设计。该池使用工作窃（work stealing）方法来管理线程。每个线程都维护一个任务队列。当一个线程的队列为空时，它可以从另一个线程获取任务，这提高了应用的性能。\n\
  \n需要显式关闭线程池，是因为该池使用了低优先级的守护线程，这些线程在后台间歇性运行，并在所有其他用户线程死亡后终止。如果需要，可以使用 `shutdown()`\
  \ 方法关闭线程池。此外，可以设置并行级别；然而，设置级别并不保证会有相应数量的任务被同时管理。因此，执行的任务数可能会超过 `ForkJoinPool` 的并行级别。\n\
  \n### 你能解释一下 `fork-join framework` 的实际应用吗？\n\n假设我们有一个包含 100,000 个或更多元素的数组。我们想要计算数组元素的和。逐个执行计算任务将非常耗时。相反，可以使用\
  \ `fork-join framework` 进行计算。该框架使用分治策略进行并行编程。该策略递归地将数组分为更小的子数组，直到子数组不再小到可以独立处理。如果其中一个线程耗时较长或忙碌，池将使用工作窃方法来管理线程。\n\
  \n### `Executor` 框架中的 `Executors` 是什么？\n\n`Executors` 是并发 API 的一部分。`Executors` 是一个工厂，提供返回\
  \ `ScheduledExecutorService` 的方法，`Executors` 具有以下方法：\n\n- 该方法返回一个具有固定数量线程的池。需要向该方法传递一个数字来管理相应数量的线程。当并发提交的任务超过所维护的池大时，其余的任务需要在队列中等待。该方法的返回类型为\
  \ `ExecutorService`。\n- 该方法还用于创建一个固定大小的池，并带有一个额外功能可以调度线程，该线程可以在定义的延迟后运行。该方法对于调度任务非常有用。该方法的返回类型为\
  \ `ScheduledExecutorService`。\n- 它创建一个没有固定线程数量的池。线程将在运行时创建。当没有任务执行时，线程将存活 60 秒，并最终会死亡。该方法最适合创建一个具有短寿命线程的线程池。该方法的类型为\
  \ `ExecutorService`。\n\n### 解释 `FutureTask`\n\n`FutureTask` 类是 `Future` 接口的实现。只有当一个任务执行完成后，才能获取其生成的结果。如果计算尚未完成，`get()`\
  \ 方法将被阻塞。然而，如果执行已完成，它将无法重新启动甚至取消。\n\n### Java `Executor` 框架中 `shutdownNow()` 和 `shutdown()`\
  \ 的区别是什么？\n\n`shutdownNow()` 和 `shutdown()` 都属于方法。`shutdown()` 允许在完成当前任务后停止执行且不再接受新任务。`shutdownNow()`\
  \ 方法还会尝试停止运行的线程。这将强制停止所有正在运行或计划运行的任务。它不会执行任何已提交尚未启动的任务。它返回所有处于等待状态的任务列表。\n\n\n\n\
  `java.util.concurrent` 包提供了作为 `Map` 接口子类的接口，它确保了线程安全和原子性保证。该接口支持对底层 map 变量的原子操作。它具有\
  \ `get()` 和 `set()` 方法，用于对 volatile 变量进行读和写操作。\n\n`ConcurrentNavigableMap` 接口包含在\
  \ `java.util.concurrent` 包中，作为 `ConcurrentMap` 接口的子接口。它支持 `NavigableMap` 操作，如 `higherKey`\
  \ 等。\n\n### 如何使用 `BlockingQueue` 解决生产者-消费者模式？\n\n生产者-消费者问题可以使用 `wait()` 和 `notify()`\
  \ 方法来解决。生产者-消费者模式可以使用 `BlockingQueue` 接口进行优化。`BlockingQueue` 接口拥有 `put()` 和 `take()`\
  \ 方法来解决生产者-消费者模式。`put(i)` 方法用于生产者在共享队列中生产数据，而 `take()` 方法用于消费者从共享队列中消费数据。\n\n###\
  \ 在编写线程安全代码时应该注意什么？在编写多线程应用时，必须记住最重要的点是什么？\n\n线程安全的代码可能会导致应用程序出现各种问题。因此，在编写线程安全的健康代码并避免死锁时，必须格外小心。我们可以遵循的几点如下：\n\
  \n- 使用不可变的 `String` 代替，因为每当字符串的值发生变化时，它都会产生一个新的 `String`。\n- 多线程代码中的未同步方法可能会导致竞态条件。因此，请尝试使用\
  \ `synchronized` 块或 `synchronized` 方法。\n- `final` 变量是线程安全的，因为一旦赋值，就无法被修改。如果可能，请尝试使用\
  \ `final` 变量。\n- `static` 变量也不是线程安全的。如果在未同步的静态方法中使用此类静态变量，多个线程可能会并发进入该方法，导致问题。必须将静态方法声明为\
  \ `synchronized`。\n- 当字段被声明为 `volatile` 时，所有线程都能看到该变量的一致值。`volatile` 变量可以被视为 `synchronized`\
  \ 方法的替代方案。因此，在可能的情况下使用 `volatile` 变量。\n- 使用线程安全的集合，例如，使用 `ConcurrentHashMap` 代替其他方式。\n\
  \n### 当持有锁的对象调用 `sleep()` 或 `wait()` 方法时会发生什么？\n\n当调用 `sleep()` 方法时，线程不会离开锁状态，尽管它从运行状态转变为等待状态。现在，线程会等待指定的睡眠时间完成，一旦完成，线程将继续处于可运行状态。\n\
  \n当调用 `wait()` 方法时，线程会释放对象的锁，并从运行状态变为等待状态。现在，线程会等待同一个对象上的其他线程调用 `notify()` 或 `notifyAll()`\
  \ 方法。当任何一个 `notify()` 或 `notifyAll()` 被调用时，线程会离开等待状态并进入可运行状态。一旦线程处于可运行状态，它将重新获取对象的锁。\n\
  \n### 总结\n\n在本章中，我们讨论了 Java 的并发机制。应用程序中有许多任务可以同时执行，这将提高应用程序的性能。我们学习了如何通过使用多线程的概念来实现这一点。但在运行此多线程应用时，有时可能会出现线程功能交叉的问题，由于多个线程正在访问公共数据，这会产生意外或不理想的输出。为了避免这种情况，我们必须知道如何实现同步，我们在整个章节中已经通过不同的面试题学习了这一点。在本章的最后，我们讨论了\
  \ Java 中引入的并发 API 更新。在下一章中，我们将讨论 Java 数据库连接。\n\n# 第 7 章\n## Java 数据库连接\n\n### 简介\n\
  \n数据、数据、还是数据！世界充满了数据。这些数据可以是不同的格式。我们的大脑也由海量数据组成。每天进出（甚至是晚上），我们的大脑接收大量数据，令人惊讶的是，我们可以在需要时回想起这些数据。类似的，我们的应用程序处理大量数据。这些数据可能由应用程序生成，或由用户输入。但这些数据不是永恒的。当应用程序退出时，数据就会消失。有时这是可以接受的。但想象一种场景：你通过应用程序向银行账户存入了一些金额。显然，当你重新启动应用程序时，你希望在银行中看到该金额的反映。但这无法发生，因为数据在应用程序终止时会被删除。所以，必须有一种方法即使应用程序终止也能永久存储这些数据。而且，应用程序在每次重启时都能提取这些数据。另一个例子是你开户时提供的身份证明。你可能希望一旦向银行提供了此类信息，银行机构就不再对每笔交易都要求你的身份证明。你可以将此类数据存储在平面文件或数据库中。我们已经在第\
  \ 5 章中讨论了如何在文件中存储数据。但是，文件缺乏结构化格式的数据存储，这使得根据某些条件查找数据变得更加困难。为了实现这一点，Java 引入了 `JDBC`\
  \ API，它可以与数据库通信，以结构化格式存储、检索或更新数据。\n\n### 结构\n\n在本章中，我们将讨论：\n- 什么是持久化（persistency）\n\
  - 如何使用 `JDBC` API 连接数据库\n- `JDBC` API 的不同接口\n- ` JDBC` 的连接和离线架构\n- 如何实现事务管理\n- 如何有效回答关于\
  \ `JDBC` 的面试题\n\n### 目标\n\n在本章结束，你将学习基于 Java 数据库连接的各种面试题。使用 `JDBC` 总是复杂的，因为需要记住很多接口及其顺序以实现预期结果。在本章中，我们将从非常基础的概念开始旅程。我们将从理解持久化概念开始，然后学习如何使用\
  \ `JDBC` API 实现。我们没有针对特定的数据库来解释 `JDBC`，但在一些代码片段中，我们使用了 MySQL 作为底层数据库。但你可以根据你选择的数据库更改这些特定数据库的代码片段。在未来主题学习\
  \ Hibernate 时，理解 `JDBC`是非常重要的。\n\n持久化是任何应用程序最重要的部分之一。因此，面试官总是想知道你是否了解持久化的基础知识。让我们讨论一些与\
  \ `JDBC` 相关的面试可能会遇到的非常基础的问题。\n\n#### 什么是持久化？\n持久化是长时间地存储数据。\n\n#### 持久化的方式有哪些？\n\
  Java 提供了多种存储数据的方式。\n存储数据最早的方法是文件处理。Java 对象可以使用序列化保存到文件中。\nJava 对象可以存储在 XML 文件中，通过使用\
  \ `JAXB` API，开发者可以在 Java 应用程序中处理。\nJava 数据库连接能够在数据库中持久化数据。\n\n#### 什么是 JDBC？\n`JDBC`\
  \ 是一种用于数据库的 Java API。这种由 Sun Microsystems 开发（现属于 Oracle）的 API 用于处理数据库。`JDBC` API\
  \ 为连接到数据库提供了一种机制。它还提供了在数据库上执行 CRUD 查询的方法。\n\n\n\n\n\n# 你能解释一下 JDBC 的架构吗？\n\n图 7.1\
  \ 展示了 JDBC 的架构：\n\n![](img/00019.jpg)\n\n图 7.1：JDBC 架构\n\n从图中可以观察到，Java 应用程序通过 `JDBC\
  \ API` 与数据库建立连接。然而，Java 应用程序无法直接与数据库通信。我们需要在 Java 应用程序和数据库之间建立一个 `JDBC driver` 层。该驱动程序将\
  \ Java API 转换为相应的数据库 API，反之亦然。\n\n## 什么是 JDBC 驱动？为什么需要它？\n\n`JDBC 驱动` 是一个软件组件，允许\
  \ Java 应用程序与底层数据库进行交互。它提供了 `Java API` 中不同接口的实现。通常，该驱动以 `jar` 文件的格式提供，例如，\n\n## 为什么需要\
  \ JDBC 驱动？JDBC 驱动的作用是什么？\n\n`JDBC 驱动` 是安装在客户端机器上的客户端适配器。驱动程序帮助将 Java 程序的请求转换为数据库可以理解的协议。它还将将数据库供应商生成的生成传输到\
  \ Java 应用程序。\n\n## 有多少种驱动程序？你用过哪些驱动程序？什么是 Type 4 驱动？\n\n共有 4 种 `JDBC 驱动`。\n\n驱动类型：\n\
  - `Type 1` 或 `JDBC-ODBC 桥驱动`\n- `Type 2` 或 `native API 驱动` 或 `部分 Java 驱动`\n- `Type\
  \ 3` 或 `网络协议驱动`\n- `Type 4` 或 `纯 Java 驱动`\n\n## 详细解释驱动类型\n\n以下是不同类型的驱动程序：\n\n###\
  \ Type 1 或 JDBC-ODBC 桥驱动\n`Type 1` 驱动使用安装在每个客户端机器上的 `ODBC 驱动` 来连接数据库。需要在系统上配置 `Data\
  \ Source Name`（数据源名称）以使用 `ODBC`。`JDBC-ODBC 桥驱动`将 `JDBC` 方法调用转换为 `ODBC` 函数调用。数据的转换发生在\
  \ `JDBC` 到 `ODBC`，这导致速度较慢。由于不需要额外的下载或安装，因此易于使用。但我们不能忽略在每个系统上配置 `DSN` 的问题，这使得系统之间的迁移变得繁琐。\n\
  \n### Type 2 或 native API 驱动或部分 Java 驱动\n`Type 2` 驱动使用数据库的客户端库。在 `Type 2` 驱动中，`JDBC\
  \ API` 调用被转换为 `native C/C++ API` 调用，这些调用是数据库特有的。每当更改数据库时，必须更改 `native API`，因为它是特定于数据库的。性能优于\
  \ `JDBC-ODBC 桥驱动`。这些驱动由数据库供应商提供，并且必须安装在每个客户端机器上。\n\n### Type 3 或网络协议驱动\n`Type 3`\
  \ 驱动非常灵活，使用三层方法访问数据库。`网络协议驱动`使用中间件，中间件将 `JDBC` 调用转换为特定供应商的数据库协议。驱动程序完全用 `Java` 编写，不需要任何客户端库。\n\
  \n`JDBC 客户端`使用标准套接字与中间件应用程序服务器通信。现在，套接字信息由中间件应用程序服务器转换为 DBMS 需要调用格式并转发到数据库服务器。由于客户端上没有安装代码，且单个驱动程序实际上可以访问多个数据库，因此它非常灵活。\n\
  \n### Type 4 或纯 Java 驱动\n`Type 4` 或 `纯 Java 驱动` 通过套接字连接直接与数据库通信。它直接将 `JDBC` 调用转换为特定供应商的数据库协议，因此为数据库提供了可用性能最高的驱动程序。它完全用\
  \ `Java` 编写，通常由供应商提供。由于驱动是特定于数据库的，每次更改数据库，我们需要记得添加新的驱动定义。\n\n## 你能解释连接数据库的步骤吗？连接数据库的步骤有哪些？\n\
  \n连接数据库需要遵循以下步骤：\n1. 注册驱动\n2. 获取与数据库的连接\n3. 创建 `statement` 实例\n4. 执行 `CRUD` 操作\n\
  5. 关闭已打开的\n\n## 有哪些方法可以注册驱动？\n\n注册驱动有不同的方法，如下：\n- 使用 `Class` 的 `forName()` 方法可以注册驱动类。该方法动态加载驱动类。要加载的驱动取决于你想要连接到哪个数据库。\n\
  - 我们也可以使用 `newInstance()` 方法来处理不符合标准的 JVM，如下：\n- 我们可以使用静态的 `DriverManager.registerDriver()`\
  \ 方法来注册驱动。如果你在使用不符合 JDK 标准的 JVM，可以使用 `registerDriver()` 方法。\n\n```java\nDriver driver\
  \ = new oracle.jdbc.driver.OracleDriver();\nDriverManager.registerDriver(driver);\n\
  ```\n\n注意：如果指定的驱动不可用，则 JVM 将生成异常。对于 `TypeIV` 驱动，你可以在项目中添加相应的 `jar` 文件。\n\n## 解释\
  \ Class.forName() 和 DriverManager.registerDriver() 之间的区别\n\n这个问题可以重新表述为：\n- 为什么开发者总是使用\
  \ `Class.forName()` 来注册驱动？\n- 为什么建议不要使用 `DriverManager.registerDriver()` 进行驱动注册？\n\
  \n`JDBC` 规范要求驱动在类加载时获取注册自身。类使用 `Class.forName()` 方法加载。在 `JDBC 4` 中，驱动程序只需将它们放在类路径中即可自动加载。\n\
  \n另一方面，`DriverManager.registerDriver()` 是手动的。这是危险的，因为它会导致驱动被注册两次。\n\n## JDBC API\n\
  \nJava 通过 `JDBC` 提供了连接底层数据库的方法。它包含了许多接口，作为开发者，你必须了解。有关接口的问题将在后续章节讨论。\n\n## 如果 JDBC\
  \ 是一个 API，谁提供实现？\n\n供应商实现 `JDBC API` 并以 `jar` 文件形式提供。例如，MySQL 提供了该 jar 包含了不同接口的实现。\n\
  \n## 你能列出 JDBC API 的不同接口吗？\n\n`JDBC` 提供了等接口。\n\n\n\n\n\n`Statement` 是一种用于与表通信的通用方法。它被用于执行静态查询。\n\
  \n### PreparedStatement\n`PreparedStatement` 是一种非常有用的方法，可以在运行时使用不同的参数值反复执行相同的 SQL\
  \ 语句。它对于执行动态或参数化查询非常有用。`PreparedStatement` 是一个预编译查询，查询的只会发生一次，从而节省了时间。因此，它提高了应用程序的性能。\n\
  \n### CallableStatement\n`CallableStatement` 用于执行存储过程。我们可以按照如下方式向 `CallableStatement`\
  \ 传递三种类型的参数：\n\n- `IN` 参数用于向存储过程传递输入值。\n- `OUT` 参数用于存放存储过程返回的结果。\n- `INOUT` 参数同时持有\
  \ `IN` 和 `OUT` 参数。\n\n#### 如何使用 CallableStatement？如何使用 CallableStatement 调用过程？\n\
  使用 `CallableStatement` 的工作包含以下步骤：\n1. 创建 `CallableStatement` 对象。\n2. 使用 `setter()`\
  \ 方法传递 `IN` 参数。\n3. 使用 `registerOutParameter()` 方法注册 `OUT` 参数。\n4. 执行\n5. 使用 `getter()`\
  \ 方法获取存储过程返回的结果。\n\n让我们了解如何在不同情况下编写 `CallableStatement` 代码来调用 `procedure1`：\n\n\
  **情况 1：没有 IN 或 OUT 参数**\n```java\nCallableStatement callstmt =\ncallstmt.execute();\n\
  ```\n\n**情况 2：有 IN 参数但没有 OUT 参数**\n```java\nCallableStatement callstmt =\ncallstmt.execute();\n\
  ```\n\n**情况 3：同时有 IN 和 OUT 参数**\n```java\nCallableStatement callstmt =\nTypes.VARCHAR);\n\
  callstmt.execute();\nString address = \n```\n\n**情况 4：有 IN 和 INOUT 参数**\n```java\n\
  CallableStatement callstmt =\nTypes.VARCHAR);\ncallstmt.execute();\nString address\
  \ = \n```\n\n---\n\n### ResultSet\n#### 什么是 ResultSet？如何获取 ResultSet？\n`ResultSet`\
  \ 指以行和列的形式存在的数据，它是查询执行的结果。\n\n可以通过通过 `Statement` 发送查询查询来获取 `ResultSet`，如下：\n```java\n\
  Statement st=con.createStatement();\nResultSet * from ;\n```\n我们也可以使用参数化查询或 `PreparedStatement`\
  \ 来获取 `ResultSet` 对象。\n\n#### ResultSet 提供了哪些功能？你用过 ResultSet 的哪些功能？\n`ResultSet`\
  \ 提供了获取数据、导航数据中以及更新数据的方法。以下是 `ResultSet` 的一些方法：\n\n- 从列中返回数据，该列的索引在方法中声明。`XXX` 代表你感兴趣检索的数据类型。例如，如果你想从第二列检索\
  \ `String` 类型的数据，则该方法的调用方式为...\n- 此方法与之前的方法完全相同。唯一的区别是，你不需要提供列索引号，而是需要提供列名作为参数。例如，如果你想从\
  \ `first_name` 列检索 `String` 数据，该方法的调用方式为...\n- 将光标移动到...的下一行。\n- 将光标移动到...的上行。\n\
  - 将光标移动到...的第一行。\n\n注意：这些并不是所有的方法，但考虑到问题的范围，这些已经足够了。即使你能够列出这么多方法，面试官也会对你的知识水平做出自己的判断。\n\
  \n#### 如何判断 ResultSet 是否有数据或是否为空？\n`ResultSet` 标的光标始终指向它的开头。这意味着光标指向第一行之前。即使我们根据查询没有任何记录，`ResultSet`\
  \ 仍然会被生成，但它是空的。但是，当在这种情况下调用 `next()` 方法时，应用程序会抛出异常。为了避免这种情况，我们需要在处理之前检查 `next()`\
  \ 方法的返回值。如果...中没有可用的下一记录，`next()` 方法返回 `false`。\n\n以下代码段显示了我们如何实现这一点：\n```java\n\
  Statement st = con.createStatement();\nResultSet rs = * from\nif (rs.next() == {\n\
  \    in\n} else {\n    do {\n        String name =\n        System.out.println(name);\n\
  \    } while (rs.next());\n}\n```\n\n#### 什么是可滚动的 ResultSet？\n这可以重新表述为：什么是 `ResultSet.TYPE_SCROLL_INSENSITIVE`\
  \ 和 `ResultSet.TYPE_SCROLL_SENSITIVE`？\n\n`ResultSet` 持有数据。默认情况下，`ResultSet` 是不可更新的。光标只能向前移动。此外，`ResultSet`\
  \ 中的数据不能被更改。然而，可滚动的 `ResultSet` 更灵活，它既是可滚动的也是可更新的。\n\n`ResultSet` 是可滚动的，这意味着人们可以向前也可以反向遍历记录。可滚动的\
  \ `ResultSet` 具有读取第一条记录、最后一条记录、下一条记录和上一条记录的能力。\n\n要生成可滚动的 `Statement` 对象，必须提供滚动类型常量，如下：\n\
  - `ResultSet.TYPE_FORWARD_ONLY`：默认类型，允许 `ResultSet` 只能向前移动。\n- `ResultSet.TYPE_SCROLL_INSENSITIVE`：此常量允许数据向前和反向滚动，但它对\
  \ `ResultSet` 的更新不敏感。\n- `ResultSet.TYPE_SCROLL_SENSITIVE`：此常量允许数据向前和反向滚动。相反，数据对\
  \ `ResultSet` 的更新敏感。\n\n在可更新的情况下，更改将立即持久化到数据库中，并由 `ResultSet` 对象实时反映。\n\n`ResultSet`\
  \ 的并发类型有助于判断 `ResultSet` 是可更新的还是只读的。`ResultSet` 有两个并发级别：\n- `ResultSet.CONCUR_READ_ONLY`：`ResultSet`\
  \ 不可更新。\n- `ResultSet.CONCUR_UPDATABLE`：`ResultSet` 是可读可更新的。\n\n以下代码段显示了如何创建一个不敏感且只读的可滚动结果：\n\
  ```java\nStatement st = con.createStatement(ResultSet.TYPE_SCROLL_INSENSITIVE, ResultSet.CONCUR_READ_ONLY);\n\
  ```\n我们也可以使用 `PreparedStatement` 代替。如前所述，要创建可更新的，你需要更改 `createStatement()` 方法的第二个参数，如...\n\
  \n人们可以使用 `Statement` 实例执行查询，是否可以在不使用 statement 或执行查询的情况下向 DB 插入行？\n可更新的 `ResultSet`\
  \ 可以通过...的 `insertRow()` 在表中插入行。\n我们需要记住，插入行中的每个不允许为空值且没有默认值的列都必须给出一个值。在调用它之前，你必须调用\
  \ `updateXXX()` 方法来修改列数据。\n\n```java\nStatement st = con.createStatement(ResultSet.TYPE_FORWARD_ONLY,\
  \ ResultSet.CONCUR_UPDATABLE);\nResultSet rs = FROM\nrs.moveToInsertRow();\n\"Value\
  \ of\n\"Value of Last\nrs.insertRow();\nrs.moveToCurrentRow();\n```\n\n如果 `ResultSet`\
  \ 使用默认工作机制并尝试更新数据，会发生什么？\n这将产生异常，这意味着 `ResultSet` 必须来自可滚动且可更新的 `ResultSet` 类型。\n\
  \n#### JDBC 中通常会发生哪种异常，如何处理它？\n`java.sql.SQLException` 是 JDBC 程序中需要处理的最常见异常。处理传统异常和\
  \ JDBC 异常没有区别。我们可以使用 `try-multi catch` 甚至是 `finally` 块。此外，我们还可以使用 `AutoClosable`\
  \ 接口来消除 `finally` 块。\n\n####  JDBC 中的事务管理是什么？\n事务代表在 DB 上执行的单一工作单元。换句话说，事务也可以被视为一组用于执行任务的操作。\n\
  \n\n\n\n\n# 事务管理的 ACID 特性是指什么？\n\nACID 特性定义了事务管理的属性。它是原子性（Atomicity）、一致性（Consistency）、隔离性（Isolation）和持久性（Durability）的缩写：\n\
  \n- **原子性**：意味着所有执行的查询要么全部成功，要么一个都不执行。\n- **一致性**：确保数据状态的一致性。\n- **隔离性**：确保一个事务与其他事务相互隔离。\n\
  - **持久性**：确保一旦事务提交，即使发生错误事件，它也将保持提交状态。\n\n# 为什么应用程序需要事务管理？\n\n在 `JDBC` 中，事务是自动提交的。这种默认行为在小型应用程序是可以接受的。但在企业级\
  \ Java 应用中，由于以下原因我们可能需要自定义行为：\n\n- 它提高了应用程序的性能。\n- 它允许维护业务流程的完整性。\n- 事务管理允许我们使用分布式事务。\n\
  \n## 你能解释事务管理是如何提高应用程序的速度或性能的吗？\n\n有时，应用程序需要执行大量操作。可能会出现用户正在向数据库中插入数百行数据。如果这些插入是独立执行的，可能会影响性能。但如果使用事务，你能够一次性提交所有插入操作，这对于应用程序的性能显然是有益的。\n\
  \n# 事务有哪些类型？\n\n事务可以分为以下类：\n\n### 本地事务 (Local transaction)\n本地事务指定语句在单个事务资源（如 `JDBC`）上执行。本地事务更容易实现，在集中式计算环境中非常有用。在本地事务中，应用程序组件和资源位于单个站点，并涉及运行在单台机器上的本地数据管理器。\n\
  \n### 分布式事务 (Distributed transaction)\n分布式事务跨越多个事务资源。在分布式事务管理中，事务管理器负责所有与数据库特定的操作。需要注意的是，分布式事务必须在不同的位置保持同步和可用。\n\
  \n### 嵌套事务 (Nested transaction)\n嵌套事务发生在另一个事务的引用范围内。嵌套事务所做的任何更改对现有或主事务都是不可见的。一旦嵌套事务提交，发生的所有更改都可以通知给主事务。嵌套事务有助于管理事务机制的隔离性。\n\
  \n# 如何在 JDBC 中提供事务管理？\n\n默认情况下，`JDBC` 是自动提交的。为了控制事务管理，我们需要执行以下步骤：\n\n1. **禁用自动提交**\n\
  2. 使用 `execute()` 或 `executeUpdate()` 方法执行 CRUD 操作，然后调用 `commit()` 方法：\n```java\n\
  con.commit();\n```\n3. 如果事务中的任何操作未执行或发生发生异常，则调用 `rollback()` 方法：\n```java\ncatch\
  \ (Exception se) {\n    // 每当发生异常时\n    con.rollback();\n}\n```\n\n# commit() 和\
  \ rollback() 方法是什么？\n\n我们开始的事务可能成功，也可能失败。根据此，我们可以决定是希望让已执行任务的更改被永久反映，还是想要撤销它们。为了实现这一点，事务管理提供了两个方法，如下：\n\
  \n- 一旦执行了 CRUD 操作且我们希望这些更改永久反映在数据库中，我们就调用 `commit()` 方法。\n- 每当执行 CRUD 操作时，在执行其中一个步骤时都有可能出现异常。这可能包括已经执行的步骤。因此，为了维护数据的一致性，到目前为止的所有更改都需要回滚。要撤销这些更改，需要调用\
  \ `rollback()` 方法。\n\n# 什么是 Savepoint（保存点）？如何使用 Savepoint？\n\n事务是一个连续执行多个操作的概念。在执行这些多个操作时，我们可能在当前事务内部需要一个中间标记，这可以通过\
  \ `Savepoint` 实现。一旦设置，事务可以回滚到该 `Savepoint` 而不影响之前的工作。下面的代码片段详细说明了如何创建和使用：\n\n```java\n\
  Savepoint savepoint = con.setSavepoint();\n//中间操作\n// 回滚到‘savepoint’\n```\n\n# 什么是元数据（metadata）？什么是\
  \ DatabaseMetaData 和 ResultSetMetaData？\n\n元数据提供关于其他数据的结构化描述数据。`JDBC` 提供不同的对象来提供有关信息的信息，如下：\n\
  \n- 它提供了与应用程序通信的底层数据库的信息。\n- 我们可以使用 `DatabaseMetaData` 获取数据库信息，如下：\n    - 数据库用户、表、视图和存储过程\n\
  \    - 数据库模式（schema）和目录信息\n    - 关于表的主键（PK）、外键的信息\n- 它提供了由查询生成的 `ResultSet` 信息。我们可以使用\
  \ `ResultSetMetaData` 获取数据库信息，如下：\n    - 列数、名称、类型和长度\n    - 列是否可读/可写，是否可搜索\n\n#\
  \ 什么是 BatchUpdate（批量更新）？如何执行批处理？\n\n在批量更新中，一组更新被分组并一次性发送到数据库，而不是一个接一个地发送。以下是批量更新的优势：\n\
  \n- 使用批量更新有助于一次性执行更新，这比逐个发送数据并等待每个任务完成要快得多。\n- 批量更新有助于减少网络流量。\n- 速度相比于逐个执行更新要更快。\n\
  - 我们可以将批量更新用于 SQL 插入、更新以及删除。\n\n下面的代码片段描述了如何使用批量更新：\n\n```java\nStatement st = con.createStatement();\n\
  st.addBatch(\"employee set firstname='ABC' where ...\");\nst.addBatch(\"employee\
  \ set firstname='Eric' where ...\");\nst.addBatch(\"employee set firstname='May'\
  \ where ...\");\naffected = st.executeBatch();\n} finally {\n    st.close();\n}\n\
  ```\n注意：在前面的代码中可以使用 `PreparedStatement` 代替 `Statement`。\n\n# JDBC 中的游标（cursor）是什么？\n\
  \n游标是由 `ResultSet` 对象维护的指针，指向当前行\n\n# 什么是连接架构和离线架构？\n\nJava 提供了不同的架构来从数据库获取数据，如下：\n\
  \n- **连接架构**：必须打开连接才能访问从数据库获取的数据。\n- **离线架构**：即使数据库连接关闭，也可以访问从数据库获取的数据。\n\n`JDBC`\
  \ 默认使用连接架构。然而，`RowSet` 支持处理数据库的离线架构。\n\n# 什么是 RowSet？\n\n`RowSet` 实例是 JDK 1.5 中引入的\
  \ Java Bean 组件。它是一种封装器，以比 `ResultSet` 更简单灵活的方式存储表格数据。`RowSet` 对象默认是可滚动和可更新的。\n\n\
  # RowSet 有哪些不同类型？\n\n`RowSet` 分两种类型：\n\n- **连接型 (Connected)**：连接型 `RowSet` 对象建立数据库连接以执行\
  \ CRUD 操作。连接一直保持到 `RowSet` 对象关闭。\n- **离线型 (Disconnected)**：在离线型 `RowSet` 对象中，仅在向数据库读写数据时才会与数据库建立连接。在处理数据时不持有连接。\n\
  \n连接型和离线型 `RowSet` 对象几乎相同，区别在于：\n\n- 与连接型 `RowSet` 对象相比，离线型 `RowSet` 重量更轻。\n- 离线型\
  \ `RowSet` 默认是\n- 离线型 `RowSet` 可将数据发送到轻量级客户端，如手机等。\n\n`RowSet` 是一个接口。那么它的类型和实现类有哪些？\n\
  \n\n\n\n\n# 以下是不同类型的\n\n## JdbcRowSet\n`RowSet` 的扩展接口之一是 `JdbcRowSet`，它是 `ResultSet`\
  \ 对象的包装器。这使得 `ResultSet` 可以作为一个 JavaBean 组件使用。`JdbcRowSet` 是一个连接型的 `RowSet`，它使用支持\
  \ JDBC 技术的驱动程序维护与数据库的连接。`JdbcRowSet` 实例可以简单地接收在其上的调用，然后反过来，这些调用会发生在其 `ResultSet`\
  \ 对象上。默认情况下，`JdbcRowSet` 对象是可滚动和可更新的。当驱动程序和数据库不支持滚动或更新时，应用程序可以使用 `ResultSet` 对象的数据来填充\
  \ `JdbcRowSet` 对象，然后我们就可以对该 `JdbcRowSet` 对象进行操作。\n\n`JbdcRowSet` 的具体实现是：\n\n以下代码段说明了以下内容的的用法：\n\
  \n```\nJdbcRowSetImpl jdbcRowset= new JdbcRowSetImpl();\n* FROM employee WHERE empid\
  \ =\njdbcRowset.execute();\n```\n\n## CachedRowSet\n`CachedRowSet` 对象是离散的。它是数据行的容器，在内存中缓存这些行，从而能够在无需始终连接数据源的情况下进行操作。`CachedRowSet`\
  \ 对象包含来自的行。然而，它也可以包含来自任何具有表格格式的文件（如电子表格）。每当 `CachedRowSet` 中的数据被修改时，这些修改就可以传播到数据源。其实现方式是：\n\
  \n## WebRowSet\n`WebRowSet` 更适用于平台无关的通信。`WebRowSet` 是的扩展。通过使用它，`RowSet` 提供了将数据库查询结果写入\
  \ XML 文件的功能。其实现方式是：\n\n## JoinRowSet\n`JoinRowSet` 是 `WebRowSet` 的扩展，由来自不同 `JoinRowSet`\
  \ 的相关数据组成。`JoinRowSet` 提供了一种在不连接数据源的情况下，在离散 `RowSets` 之间建立 SQL JOIN 标准方法。任何数量实现\
  \ `Joinable` 接口的 `RowSet` 对象都可以添加到 `JoinRowSet` 对象中。`Joinable` 接口提供了根据指定执行 `JOIN`\
  \ 操作的列的方法。\n\n## FilteredRowSet\n有时，`RowSet` 对象必须对其内容进行某种程度的过滤。在这里，可以为所有标准的 `RowSet`\
  \ 实现提供查询语言。但对于轻量级组件来说，这是一种复杂且不实际的方法。`FilteredRowSet` 为数据过滤提供了一种轻量的解决方案。\n\n## 什么是\
  \ SQLTimeoutException？\nJDBC 提供了 `setQueryTimeout(int seconds)` 方法来设置获取结果的等待时间。如果查询没有在参数指定的时间内返回结果，则会抛出\
  \ `SQLTimeoutException`。\n\n## 结论\n在本章中，我们讨论了 Java 面试中可能会问哪些基于 JDBC 的问题。在讨论过程中，我们学习了关于如何连接数据库以及如何从数据库检索信息或数据到应用的许多知识。我们还讨论了不同的接口及其实现，这些构成了\
  \ JDBC 的核心部分。我们还处于大楼的第一层；就 Java 面试而言，还有很多需要学习和理解的内容。在下一章中，我们将详细讨论集合。\n\n# 第 8 章\n\
  # 集合\n\n## 引言\nJava 是一种面向对象的编程语言。使用 Java 创建的软件由许多相互通信的对象组成。将这些对象组合在一起以便对这些对象执行某些共同操作总是至关重要的。通常，此类操作需要开发者手动重复地执行。为了减少这种工作，Java\
  \ 引入了集合框架（Collection Framework），它由预定义的数据结构和算法组成，这些内容可以应用于对象。集合框架本质上是一组不同的接口及其实现类，通过这些类，可以根据不同的场景对对象进行分组。每个接口本身根据根据对象的排列或遍历方式为一组对象提供不同的功能。这些功能为开发者提供了灵活性，使其能够在应用程序中充分利用对象以实现预期的结果。有时，开发者需要有序的对象；有时，他们想要没有重复的相同对象组，或者有时，想要按某种排序顺序的相同对象组。集合框架为开发者提供了所有此类解决方案。\n\
  \n## 结构\n理解集合框架通常被认为是复杂的。它由许多接口、子接口及其实现类组成。在本章中，我们将涵盖 `Collection` 框架的不同方面：\n\n\
  - 为什么需要 `Collection` 框架？\n- 不同的 Collection 接口：\n  - `List`\n  - `Set`\n  - `Queue`\n\
  \  - `Map`\n  - 如 `Collections` 和 `Arrays` 等工具类\n\n## 目标\n`Collection` 中的每个接口旨在实现特定的功能。记住这样一个庞大的\
  \ API 并不是一项易事。由于其在实时项目中的重要性，`Collection` 是 Java 面试过程中最受欢迎的话题之一。如所述，`Collection Framework`\
  \ API 是巨大的。因此，就面试过程而言，涵盖每一个类是不可能的，或者事实上在面试过程中也是不需要的。但可以确定，在本章中，你将学习如何回答几乎每一个重要问题，从概念到实现，以便你在面试中成功。你将能够掌握不同的集合类型如\
  \ `List`、`Set`、`Queue` 和 `Map` 及其实现。\n\n## 解释集合框架。什么是集合框架？\nJDK 1.2 引入了集合框架，其中包含了一组集合接口、实现和算法。这些\
  \ API 是类和接口的集合，用于存储、查找、添加和操作对象。框架提供了诸如 `Queue` 的接口以及用于此目的的实现类。\n\n## 列出集合框架的优势\n\
  Java Collections 现在配备了泛型和并发集合类用于线程安全操作。它包括在 java concurrent 包中的阻塞接口实现。\n\n## 解释数组和集合的区别。数组和集合的主要区别是什么？\n\
  数组和集合都支持数据的存储。它们之间存在一些区别，如下：\n\n- 数组的大小始终是固定的。这意味着一旦定义了数组的大小，在运行时就无法更改，但集合的大小是动态的。这意味着集合的大小可以在运行时动态更改。\n\
  - 数组只能存储一种类型的对象或同构元素，但集合可以持有异构对象。\n- 数组没有预定义数据操作方法，用户需要为元素的排序和搜索提供逻辑。然而，集合提供了预定义数据操作方法。\n\
  \n## 什么是遗留类？\n\n\n\n\n集合框架（Collection framework）从一开始并不是 JDK 的一部分。它是从 JDK2 开始引入的。因此，在集合框架之前，JDK\
  \ 依赖某些类和接口来存储和操作数据集合。以下是遗留类：\n\n- `Vector` 与 `ArrayList` 类似，但 `Vector` 的方法是同步的，而\
  \ `ArrayList` 的方法是非同步的。\n- `HashTable` 基于 `Map` 接口的执行工作。`HashTable` 中的每个条目都是一个键值对。\n\
  - `Dictionary` 是一个抽象类，它将每个元素作为键值对持有。`Hashtable` 是 `Dictionary` 类的子类型。\n- `Properties`\
  \ 是 `Hashtable` 类的扩展。`Properties` 是线程安全的，因此它不需要任何手动同步来存储键值对中的值。\n- `Stack` 被称为 LIFO（后进先出），它允许仅从一端弹出（popping）。它是\
  \ `Vector` 类的扩展。\n\n### 集合框架中提供了哪些接口？\n\n`java.util` 包作为集合框架的一部分提供了各种接口和类。以下是该框架提供的接口列表：\n\
  \n- `Collection` 是框架提供的主要接口。该接口继承自 `Iterable` 接口。所有的接口和类必须实现此接口。\n- `List` 接口：`java.util.List`\
  \ 接口继承自 `Collection` 接口。列表接口是有序的对象集合，不一定按自然顺序排序。它允许重复元素。接口还允许对元素进行随机访问。\n- `Set`\
  \ 接口：`java.util.Set` 接口是一个不允许重复元素的对象集合。元素是无序且未排序的。该接口提供了 `Collection` 接口继承的方法。\n\
  - `Queue` 接口：`java.util.Queue` 接口定义了队列数据结构。队列以先入先出（First In First Out）的形式存储元素。\n\
  - `Map` 以键值对的形式存储元素。`Map` 接口没有实现 `Collection` 接口。它允许唯一的键，但元素可以是重复的。元素以无序、未排序的方式存储。\n\
  \n### 泛型集合（generic collection）的优势是什么？\n\n以下是使用泛型集合的优势：\n\n- 在获取或遍历元素时，如果使用泛型类，则不需要类型转换。\n\
  - 泛型是类型安全的，并在编译时进行检查。\n- 泛型集合通过在编译时即可检测错误，确保了代码的稳定性。\n\n### 什么是类型擦除（type erasure）？\n\
  \n默认情况下，集合 API 允许异构元素。这种异构性在处理集合数据时可能会产生问题。为了避免此类处理问题，泛型在 `JDK 1.5` 中被引入。泛型的使用确保了类型安全；这意味着集合允许持有相同类型的元素，内部不允许包含异构元素。\n\
  \n尽管泛型非常强大，但它只在编译时强制执行类型约束，类型信息在运行时是不可用的。这种在运行时擦除类型信息的过程被称为 `type erasure`（类型擦除）。\n\
  \n### Collection 和 Collections 之间有什么区别？\n\n以下是 `Collection` 和 `Collections` 之间的区别：\n\
  \n- `Collection` 是接口，而 `Collections` 是类。\n- `Collection` 接口为 `List`、`Set` 和 `Queue`\
  \ 提供数据结构的标准功能。`Collections` 类提供了排序和同步集合元素的方法。\n- `Collection` 是根接口，而 `Collections`\
  \ 是一个通用工具类。\n- `Collection` 接口提供了用于操作存储在相应数据结构中的元素的方法。`Collections` 类为集合对象提供了各种工具方法的静态方法。\n\
  \n### 集合框架的优势是什么？\n\n以下是集合框架的优势：\n\n- 框架通过提供预定义方法减少了编程工作量。\n- 使用框架可以提高性能，因为它提供了数据结构和算法的高性能实现。\n\
  - 它提供了不相关 API 之间的互操作性，使得集合可以从一个更改到另一个。\n- 框架非常容易学习和实现功能。\n\n### 陈述 ArrayList 和 Vector\
  \ 之间的区别\n\n`ArrayList` 和 `Vector` 都以 `List` 作为父接口。这意味着这两个类都是索引的、有序的、未排序的集合。然而，它们之间存在一些主要区别，如下：\n\
  \n- `ArrayList` 不是同步的；然而，`Vector` 是同步的。\n- `ArrayList` 不是遗留类，但 `Vector` 是遗留类。\n\
  - `ArrayList` 按数组大小的 50% 增加容量。`Vector` 按数组大小翻倍来增加容量。\n\n### ArrayList 和 Vector 之间有什么相似之处？\n\
  \n`ArrayList` 和 `Vector` 具有以下相似点：\n\n- 两个类都是索引集合。\n- 它们在内部都由数组支持。\n- 两个类都是有序集合。这意味着我们插入元素的顺序始终被保持。\n\
  - 两个类的 `iterator` 实现设计上都是快速失败（fail-fast）。\n- 两个集合都允许空值。\n- 它们都允许通过索引号对元素进行随机访问。\n\
  \n### ArrayList 和 LinkedList 之间有什么区别？\n\n以下是 `ArrayList` 和 `LinkedList` 之间的区别：\n\
  \n- `ArrayList` 使用动态数组，而 `LinkedList` 使用双向链表。\n- `ArrayList` 在操作上不高效，但 `LinkedList`\
  \ 高。\n- 当人们想要存储和获取数据时，`ArrayList` 更好。然而，操作数据时 `LinkedList` 是更好的选择。\n- `ArrayList`\
  \ 提供随机访问，但 `LinkedList` 不。\n- 由于 `ArrayList` 只存储对象，因此内存开销较小，而 `LinkedList` 存储对象及其地址，因此内存开销更大。\n\
  \n### Array 和 ArrayList 之间有什么区别？\n\n`array` 和 `ArrayList` 都是索引集合，区别如下：\n\n- `array`\
  \ 的大小是固定的，不能在运行时调整大小，而 `ArrayList` 的大小可以动态更改。\n- `array` 是静态类型，而 `ArrayList` 是动态大小。\n\
  - `array` 允许存储基本类型和对象；然而，在 `ArrayList` 中只能存储对象类型。\n\n### 解释数组长度和 ArrayList 大小的区别\n\
  \n可以使用 `length` 属性获取数组的长度，但 `ArrayList` 不支持 `length` 属性。`ArrayList` 提供了 `size()`\
  \ 方法，用于查找列表中元素的数量。\n\n### Array 和 ArrayList 可以互相转换吗？如何将 ArrayList 转换为数组反之？\n\n是的，可以。\n\
  \n- 可以 `Arrays` 类的 `asList()` 方法将数组转换为 `ArrayList`。`asList()` 方法是 `Arrays` 类提供的静态方法，接受\
  \ `List` 对象。\n- 同样地，可以使用 `ArrayList` 类的 `toArray()` 方法将 `ArrayList` 转换为数组。\n\n###\
  \ 如何从列表创建基本类型的数组？\n\n之前讨论的 `toArray()` 方法创建的是包装类数组。如果你尝试使用该方法生成基本类型数组，它将抛出异常。因此，创建此类数组的唯一选择是使用列表的\
  \ `get()` 方法显式地将元素复制到数组中。\n\n\n\n\n\n> 默认情况下，`ArrayList` 在运行时是可以修改的。这意味着可以使用 `remove()`\
  \ 或 `set()` 方法分别访问、删除或更新元素。\n\n> 但，可以通过调用 `Collections.unmodifiableList()` 方法获取一个只读的\
  \ `ArrayList`。当 `ArrayList` 为只读状态时，人们无法通过 `remove()` 或 `set()` 方法修改集合。\n\n> 下面的代码段展示了如何使用该方法：\n\
  \n```java\nlist = new ArrayList();\n// 填充列表\n// 打印列表\nlist: \" \" +\n// 获取不可修改的列表\n\
  // 使用 unmodifiableList() 方法\nnonModifiableList =\n// 向新列表添加元素\n// 以修改\n```\n\n如果你尝试执行上述代码，你将得到如下所示的异常\
  \ `UnsupportedOperationException`：\n\n```\nInitial list: [10, 20]\nTrying to modify\
  \ the list\nException in thread \"main\" java.lang.UnsupportedOperationException\n\
  at java.util.Collections$UnmodifiableCollection.add(Unknown Source)\n```\n\n## ArrayList\
  \ 可以包含重复元素吗？通过哪些方法可以移除 ArrayList 中的重复元素？\n\n默认情况下，`ArrayList` 可以包含重复元素。通过以下两种方法，可以移除\
  \ `ArrayList` 中的重复元素：\n\n### 使用 HashSet\n可以使用 `HashSet` 移除 `ArrayList` 中的重复元素。这意味着你需要将\
  \ `ArrayList` 转换为 `HashSet`。然而，在这种情况下，它不会保留插入顺序。\n\n### 使用 LinkedHashSet\n使用 `LinkedHashSet`\
  \ 可以在移除重复的同时保持插入顺序。可以通过以下步骤实现：\n1. 首先，将 `ArrayList` 的所有元素复制到...\n2. 现在，借助于 `clear()`\
  \ 方法清空 `ArrayList`。`clear()` 方法将移除列表中的所有元素并使其为空。\n3. 最后，将 `LinkedHashSet` 的所有元素复制到...\n\
  \n## 默认情况下，ArrayList 是有序的。是否有任何方法可以反转或排序 ArrayList 中的元素？\n\n默认情况下，`ArrayList` 不提供任何此类功能。但，通过使用工具类，我们可以实现这一点。下面的代码段展示了如何实现相同的效果：\n\
  \n```java\nlist = new ArrayList();\n// 填充列表\n// 打印列表\nlist: \" \" +\nlist:\nlist:\n\
  ```\n\n上述代码段的输出如下：\n```\nInitial list: [10, 6, 20, 4, 15]\nReversed list: [15, 4,\
  \ 20, 6, 10]\nSorted list: [4, 6, 10, 15, 20]\n```\n\n## 有哪些方法可以同步 ArrayList？\n\n\
  `ArrayList` 可以通过以下两种方式进行同步：\n\n### 使用 SynchronizedList\n该方法接受一个列表并返回一个同步列表。当人们不想同步遍历，但需要防止并发线程之间的干扰时，该方法非常有用。这种方式是昂贵的，因为每次写操作都需要单独的数组复制。当人们有一个列表且只需要遍历其元素而不频繁修改它们时，这种机制是非常高效的。\n\
  \n### 使用 CopyOnWriteArrayList\n在进行遍历时，即使人们尝试在遍历时修改数据，它也不会抛出 `ConcurrentModificationException`，因为迭代器是在...的副本上进行迭代。此外，写操作将在...的副本上执行。\n\
  \n## 解释 List 和 Set 接口之间的区别\n\n`List` 和 `Set` 接口都继承自 `Collection` 接口。它们有以下区别：\n-\
  \ `List` 可以包含重复元素，但 `Set` 只能包含唯一元素。\n- `List` 是有序集合。这意味着它维护了插入顺序。然而，`Set` 是无序集合。\n\
  - `List` 接口允许任意数量的 null 值，但 `Set` 接口只允许单个 null 值。\n- `List` 接口包含一个遗留类 `Vector`。但\
  \ `Set` 接口没有任何遗留类。\n\n## HashSet 和 TreeSet 的区别是什么？\n\n`HashSet` 和 `TreeSet` 类都是\
  \ `Set` 接口的实现。但它们有以下区别：\n- `HashSet` 是无序的，但 `TreeSet` 保持升序。\n- `HashSet` 由哈希表实现，而\
  \ `TreeSet` 是树结构。\n- `HashSet` 比...更快。\n- `HashSet` 由 `HashMap` 支持，而 `TreeSet` 由...支持。\n\
  \n## HashMap 和 HashTable 的区别是什么？\n\n`HashMap`是非同步的，意味着不能直接在线程之间共享，并且需要实现正确的同步代码。但\
  \ `HashTable` 是同步的，可以安全地与多个线程共享。\n- `HashTable` 不允许任何 null 键和 null 值，但 `HashMap`\
  \ 允许一个 null 键和多个 null 值。\n- 如果不需要同步，通常倾向于使用 `HashMap`。\n\n## HashTable 允许 null 吗？你能解释为什么\
  \ HashTable 不允许 null 吗？你能为什么 HashMap 允许 null？\n\n`HashTable` 中的每个条目都以键值对的形式存在。如果人们想成功地存储元素并从中检索存储的对象，那么用键的对象必须实现\
  \ `hashCode()` 和 `equals()` 方法。但如果我们使用 `null`，就会出现问题，因为 `null` 不是对象。由于它不是对象，它无法同时实现\
  \ `hashCode()` 和 `equals()` 方法。\n\n`HashMap` 是一个带有改进的高级版本。\n\n## 什么是 WeakHashMap？\n\
  \n这也是 Map 的一种实现，类似于某项重要的变化。如果我们声明的键是对象类型，那么它与垃圾回收器连接。这意味着 HashMap 接管了垃圾回收器，导致垃圾回收无法删除键。（注：此处逻辑似乎反了）。\n\
  \n## 能通过代码来解释 WeakHashMap 的概念吗？\n\n当然可以。下面的代码段展示了垃圾回收器如何活跃地删除未使用的键：\n\n```java\n\
  Map hashMap= new HashMap();\nMap weakHashMap = new WeakHashMap();\nString keyHashMap\
  \ = new;\nString keyWeakHashMap = new;\nhashMap.put(keyHashMap, );\nweakHashMap.put(keyWeakHashMap,\
  \ );\n// GC 之前\nkeyHashMap = null;\nkeyWeakHashMap = null;\nSystem.gc();\n// GC\
  \ 之后\n```\n\n所示，与对象关联的键被设置为 null。但，尽管如此，HashMap 的键仍然存在并指向实际对象，这在...的情况下并非如此。\n\n\
  注意：你也可以使用用户自定义对象作为键而不是字符串，并实现 `finalize()` 方法来证明垃圾回收器确实在工作...\n\n## 解释 Iterator\
  \ 和 ListIterator 之间的区别？\n\n`Iterator` 和 `ListIterator` 的区别如下：\n- `Iterator` 仅用于正向遍历元素。但\
  \ `ListIterator` 可用于用于正向和反向遍历元素。\n- `Iterator` 可以用于大多数集合，如...和，但 `ListIterator`\
  \ 的使用仅限于 List。\n- `Iterator` 在遍历集合时仅提供删除操作。但 `ListIterator` 在遍历集合时提供添加、更新和删除元素的操作。\n\
  \n## 陈述 Iterator 和 Enumeration 的区别？\n\n\n\n\n\n## Iterator 和 Enumeration 的区别\n\n\
  - `Iterator` 可以遍历遗留元素和非遗留元素。但，`Enumeration` 只能遍历遗留元素。\n- `Iterator` 是快速失败机制（fail-fast）的，而\
  \ `Enumeration` 不是。\n- `Iterator` 速度比 `Enumeration` 慢。\n- `Iterator` 在遍历集合时提供删除操作。然而，`Enumeration`\
  \ 只能遍历集合。\n\n## List 和 Set 接口的区别\n\n`Set` 和 `List` 的区别如下：\n- `List` 是一个有序集合。然而，`Set`\
  \ 是一个无序集合。\n- `Set` 包含唯一值，但 `List` 可以包含重复值。\n- `List` 默认不是排序的。`Set` 提供了一个排序版本，作为...\n\
  \n## Set 和 Map 接口的区别\n\n`Set` 和 `Map` 的区别如下：\n- `Set` 仅包含值，但 `Map` 同时包含键和值。\n- `Set`\
  \ 包含所有唯一值。然而，`Map` 可以包含与唯一键关联的重复值。\n- `Set` 可以有一个 null 值，但 `Map` 允许一个 null 键，且可以包含任意数量的\
  \ null 值。\n\n## HashMap 和 HashSet 的区别\n\n`HashSet` 和 `HashMap` 的区别如下：\n- `HashSet`\
  \ 实现了 `Set` 接口，而 `HashMap` 实现了 `Map` 接口。\n- `HashSet` 只包含值，而 `HashMap` 将键和值作为一个条目。\n\
  - `HashSet` 可以直接迭代。然而，要遍历 `HashMap`，需要先将其转换为 `Set`。\n- `HashSet` 不能包含重复值。但，`HashMap`\
  \ 可以包含重复值，这些将与唯一键关联。\n- `HashSet` 可以包含一个 null 值，但 `HashMap` 只能有一个 null 键。`HashMap`\
  \ 允许任意数量的 null 值。\n\n## HashMap 和 TreeMap 的区别\n\n`HashMap` 和 `TreeMap` 的区别如下：\n\
  - `HashMap` 是无序的。然而，`TreeMap` 按升序排序。\n- `HashMap` 默认实现哈希表，而 `TreeMap` 实现树形结构。\n\
  - get 可以使用键或值对 `HashMap` 进行排序，但 `TreeMap` 只能按键排序。\n- `HashMap` 允许一个 null 键对应多个 null\
  \ 值，但 `TreeMap` 不允许任何 null 键，尽管可以包含多个 null 值。\n- 与...相比，`HashMap` 的搜索操作更快。\n\n##\
  \ 如何按值对 HashMap 排序\n\n通常说 `HashMap` 是按键排序的。如何按值对其进行排序呢？\n我们可以执行以下步骤按值对 `HashMap`\
  \ 进行排序：\n1. 通过 `entrySet()` 方法将 `HashMap` 转换为 `LinkedList`。\n2. 使用 `Collections.sort(arg1,\
  \ arg2)` 方法并将 `LinkedList` 作为第一个参数。该调用的第二个参数将是 `Comparator` 的实现。\n3. 将 `LinkedList`\
  \ 转换为...\n\n## HashMap 和 Hashtable 的区别\n\n`HashMap` 和 `Hashtable` 的区别是：\n- `HashMap`\
  \ 是不同的，而 `Hashtable` 是同步的。\n- `HashMap` 允许一个 null 键和多个 null 值。然而，`Hashtable` 不允许任何\
  \ null 键或 null 值。\n- `HashMap` 不是线程安全的，适用于非多线程应用程序。但，`Hashtable` 是线程安全的，可以在不同线程之间共享。\n\
  - `HashMap` 继承自 `AbstractMap` 类，而 `Hashtable` 继承自 `Dictionary` 类。\n\n## Comparable\
  \ 有什么用？\n\n`Comparable` 接口用于通过... 对 POJO 类的对象进行排序。但它提供了一种单一的方法来对序列排序。\n\n## Set\
  \ 的唯一性和 equals()\n\n`Set` 仅允许唯一元素；那么，为什么我们得到的大小是三而不是二呢？我们需要做什么才能让 `Set` 仅拥有唯一元素？\n\
  \n是的，根据理论，`Set` 仅允许唯一元素。当我们添加用户定义类的实例时，`Set` 并没有任何方法来使两个实例相等。`Set` 中的实例和用户想要添加的实例可以通过隐式使用\
  \ `equals()` 方法检查它们的相等性。然而，在 `Employee` 类中，开发者并没有定义它。这意味着 `Employee` 类的默认父类类对象的\
  \ `equals()` 方法正在被调用。默认情况下，`equals()` 方法比较的是两个引用而不是两个实例的内容。显然，两个实例引用是不等的，这意味着尽管两个实例具有相同的内容或属性值，`Set`\
  \ 也会将它们视为两个唯一的实例并允许添加。\n\n以下代码的输出是什么？\n\n```java\nclass Employee {\n    private\
  \ int empId;\n    private String name;\n    //默认构造函数和参数构造函数\n    //getters and setters\n\
  \    //compareTo 方法\n}\n\nclass Test{\n    public static void main(String[] args){\n\
  \        Set<Employee> employees = new TreeSet<>();\n        // ... 逻辑\n    }\n\
  }\n```\n\n前面的代码将产生异常。\n为什么我们会得到异常？怎么做才能消除异常？\n\n在这里，我们将得到...\n原因：\n`TreeSet` 默认是排序集合。这意味着人们插入到排序集合中的所有元素必须实现\
  \ `Comparable` 接口，因为我们没有实现 `Comparable` 接口，如果我们违反了这一限制，我们将会得到...\n\n解决方案：在 `Employee`\
  \ 类中实现 `Comparable` 接口。\n\n## Comparable 和 Comparator 的区别\n\n`Comparable` 和 `Comparator`\
  \ 接口都用于集合元素的排序，但它们的区别如下：\n- `Comparable` 允许以一种方式排序。但 `Comparator` 允许以多种方式排序。\n-\
  \ `Comparable` 包含在 `java.lang` 包中，而 `Comparator` 包含在 `java.util` 包中。\n- `Comparable`\
  \ 提供 `compareTo()` 方法进行比较，而 `Comparator` 提供 `compare()` 方法进行排序。\n- POJO 类需要实现 `Comparable`\
  \ 接口进行排序。但没有强制要求...\n\n## 什么是 BlockingQueue？\n\n`BlockingQueue` 是一个扩展 `Queue` 的接口。它为获取、插入和删除数据提供了并发支持。在获取元素时，它会等待队列非空。在存储集合时，它会等待可用空间。它是一个安全的集合，不能包含空元素。\n\
  \n## 为什么要使用属性文件？\n\n有时，在编写代码时，可能需要某些值，这些值在未来或根据客户需求更改。如果人们硬编码这些值，更改值需要重新编译类并部署。属性文件可以包含键值对条目。与其硬编码，如果从属性文件中获取这些值，即使属性文件中的值在运行时，不需要重新编译类。使用属性文件使得应用程序易于管理。数据库的驱动程序、用户名和密码等值是存储在属性文件的常用方式。\n\
  \n## hashCode() 方法的作用是什么？\n\n`hashCode()` 方法返回一个称为哈希值的整数值。如果两个键相同，`hashCode()` 方法返回相同的整数。但，两个哈希值可能具有不同的或相同的键。如果两个对象使用\
  \ `equals()` 方法没有得到相等的结果，那么 `hashCode()` 方法将为这两个对象提供不同的结果。\n\n以下代码的输出是什么？\n\n```java\n\
  class Employee {\n    private int empId;\n    private String name;\n    //默认构造函数和参数构造函数\n\
  \    //getters and setters\n}\n\nclass Test{\n    public static void main(String[]\
  \ args){\n        Set<Employee> employees = new HashSet<>();\n        // ... 逻辑\n\
  \        System.out.println(\"size:-\" + employees.size());\n        // 删除后\n  \
  \      System.out.println(\"size:-\" + employees.size());\n    }\n}\n```\n\n\n\n\
  \n\n> 即使调用了 `remove()` 方法，对象也不会被移除，且初始大小和移除后的大小保持不变。\n\n> 员工的实例存在于集合中；那么，为什么初始大小和最终大小是一样的？需要做什么才能让代码正常运行？\n\
  \n> 是的，实例在 `HashSet` 集合中是可选。当我们尝试删除已有的实例时，必须减小集合的大小。然而，在实践中，我们得到了相反的结果，初始大小等于最终大小。\n\
  \n### 原因：\n\n当我们调用 `remove()` 方法时，`remove()` 方法首先会尝试寻找两个实例是否相等。是的，当需要对实例进行相等比较时，`equals()`\
  \ 方法就会登场。但在这里，我们使用 `HashSet` 时，在检查属性是否相等之前，两个实例的哈希码（hashCode）必须相等。但是员工类没有 `hashCode()`\
  \ 方法。作为 `object` 类的子类，将调用 `object` 类的 `hashCode()` 方法。这意味着两个实例具有不同的哈希码值，如果两个实例的哈希码不同，就不会调用\
  \ `equals()` 方法来比较属性。这就是为什么尽管内容相同，实例也不会被移除。\n\n在 `Employee` 类中添加 `hashCode()` 实现。\n\
  \n### 为什么我们要重写 `equals()` 方法？\n\n`equals()` 方法用于检查两个对象的相等性。如果人们想要根据属性来检查对象，他们就会重写该方法。\n\
  \n### 以下代码的输出将什么？\n\n```java\nclass \n    private int empId;\n    private String\
  \ name;\n\n    //默认构造函数和参数化构造函数\n    //getters and setters\n    //getters and setters\n\
  }\n\nClass Test{\n    public static void args(String[] args){\n        List<Employee>\
  \ employees = new ArrayList<>();\n        System.out.println(\"size:- \"+ employees.size());\n\
  \        System.out.println(\"of list after removing an element:- \"+ employees.size());\n\
  \    }\n}\n```\n\n作为输出，你预期元素从列表中被移除。但惊讶的是，元素不会被移除，且观察到移除前后的列表大小是相同的。\n\n尽管实例可用，但为什么员工实例没有被消除？我们需要做什么才能让\
  \ `remove` 方法正常工作？\n\n是的，实例在列表中，所以它必须被移除，但在实践中，它并没有被移除。\n\n### 原因：\n\n当我们尝试移除用户定义类的实例时，`remove()`\
  \ 方法内部首先会交叉检查实例的相等性。如果实例相等，则会被移除；否则将不会被移除。现在，为了检查实例的相等性，将隐式地调用 `equals()` 方法。然而，在\
  \ `Employee` 类中，开发者并没有定义它。这意味着 `Employee` 类的默认父类 `Object` 类的 `equals()` 方法被调用了。默认情况下，`equals()`\
  \ 方法比较的是两个引用而不是两个实例的内容。显然，两个实例引用是不相等的。由于实例不相等，`remove` 方法不起作用，大小保持不变。\n\n在 `Employee`\
  \ 类中添加 `equals()` 方法，并定义我们希望如何处理两个实例的相等性。例如，如果两个实例具有相同的[属性]，它们将被视为作是相等的。\n\n###\
  \ 我们可以同步集合接口吗？通过哪些方法可以同步 List、Set 和 Map 元素？\n\n是的，有一些方法可以对集合接口进行同步。`Collections`\
  \ 类提供了以下方法使 Set 或 Map 元素成为同步状态：\n\n```java\npublic static List synchronizedList(List\
  \ l)\npublic static Set synchronizedSet(Set s)\npublic static SortedSet synchronizedSortedSet(SortedSet\
  \ s)\npublic static Map synchronizedMap(Map m){}\npublic static SortedMap synchronizedSortedMap(SortedMap\
  \ m)\n```\n\n### hashtable 中的哈希冲突是什么？如何处理？\n\n当我们有两个不同的键具有相同的哈希值时，这种场景被称为哈希冲突。当两个不同的条目具有相同的哈希值时，它们会被保留在同一个哈希桶（bucket）中以避免冲突。\n\
  \n我们有以下两种方法避免哈希冲突：\n\n1.  **链链法 (Separate chaining)**：链链法实现简单。在这种情况下，这种安排使得哈希表的每个单元都指向具有相同哈希函数值的记录的链表。\n\
  2.  **开放地址法 (Open addressing)**：在开放地址法中，所有元素都存储在哈表本身。这意味着执行线性探测、二次探测或双哈希。\n\n###\
  \ 解释 HashMap 中初始容量和负载因子的作用。它们的默认值是多少？\n\n**初始容量 (Initial capacity)**：\n可以在创建 `HashMap`\
  \ 时将初始容量作为参数传递。这意味着初始容量影响内部数组的大小。初始容量默认为 16，且是 2 的幂。\n\n**负载因子 (Load factor)**：\n\
  `HashMap` 的负载因子是元素数量与桶数量的比率。例如，如果我们有 16 个桶包含 12 个元素，那么它的负载因子就是 `12/16=0.75`。较高的负载因子表示更多的冲突。当映射达到这个负载因子值时，它将调整其内部数组的大小。默认负载因子值为\
  \ 0.75；这意味着当未指定初始容量时，可以在 HashMap 中放入 12 个元素。\n\n### 快速失败 (fail-fast) 的含义是什么？\n\n\
  每当在遍历集合中的元素时尝试修改内部结构时，它将抛出 `ConcurrentModificationException` 异常。这被称为集合类中所有的 `Iterator`\
  \ 实现都是快速失败的，`ConcurrentHashMap` 等并发类除外。\n\n### 解释快速失败 (fail-fast) 和安全 (fail-safe)\
  \ 之间的区别？\n\n**安全 (fail-safe)**：\n`java.util.concurrent` 中的类是安全的。这意味着它不受集合中任何修改的影响。在遍历安全的集合时，`Iterator`\
  \ 永远不会抛出 Iterator 异常。安全属性与底层集合的副本工作。但当然，为了实现这一点，需要额外的内存。\n\n**快速失败 (fail-fast)**：\n\
  默认情况下，`java.util` 包中所有的集合类都是快速失败的。这不允许在迭代时修改集合。当我们迭代时尝试修改元素，快速失败迭代器会抛出。它使用原始集合遍历元素。不需要额外的内存。\n\
  \n\n\n\n\n`forEach()` 方法在将 lambda 表达式作为 `Consumer` 接口的参数时非常有用。\n\n`Collection` API\
  \ 也通过在 `Iterator` 接口中添加 `forEach(Consumer action)` 方法得到了改进。\n\n### 解释为什么 `Collection`\
  \ 不扩展 `Cloneable` 和 `Serializable` 接口？\n\n`Collection` 是一个接口，它定义了一组对象，这些对象被称为元素（elements）。\n\
  \n由于它是一个接口，如何维护这些元素的选择交由 `Collection` 接口的具体实现类来决定。\n\n例如，`List` 继承自 `Collection`\
  \ 接口，它允许重复元素；而 `Set` 作为 `Collection` 的另一个扩展类，是不允许重复元素的。在 `collection` 中添加 `clone()`\
  \ 是没有意义的，因为 `Collection` 作为一个接口，是一个抽象的表示，因此完全取决于 `clone()` 方法的实现，而不是声明。具体的实现类应该决定如何对其进行克隆或序列化。\n\
  \n因此，通过在接口中添加该方法来强制执行克隆或序列化实现，其其灵活性较低且限制也更多。因此，必须由特定的实现类来决定是否可以被克隆、序列化或两者兼有。\n\n\
  ### 为什么 `Map` 接口不扩展 `Collection` 接口？\n\n`Map` 接口及其所有的实现都是 `Collections` 框架的一部分。然而，`Map`\
  \ 没有扩展 `Collection`，因为所有扩展 `Collection` 的接口只支持值（values）。而 `Map` 将其中的每个条目都以键值对的形式存储。`Collection`\
  \ 提供了获取元素的方法，但 `Map` 方法提供的是获取键列表或值列表，这不符合处理元素的范式。\n\n### 解释 `Iterator`。什么是 `Iterator`？\n\
  \n`Iterator` 是一个提供遍历集合方法的接口。人们可以使用相应集合的 `iterator()` 方法获取 `Iterator` 实例。通过使用 `iterator`，可以在遍历集合的过程中从底层集合中移除元素。`Iterator`\
  \ 实现了 `iterator` 设计模式，为遍历集合元素提供了一种通用的方式。\n\n### 为什么 `Iterator` 不提供向集合添加元素的方法？\n\n\
  执行元素迭代时遵循的契约是不明确的。因此，如果尝试向 `list`（一个有序集合）中添加元素，由于 `iterator` 的语义不明确，将无法保证元素被添加到末尾。另一个特殊的迭代器\
  \ `ListIterator` 提供了一个添加元素的操作，因为它保证了迭代的顺序。\n\n### 我们能直接使用 `next()` 方法获取元素而不移动 `Iterator`\
  \ 的光标吗？为什么 `Iterator` 不提供在不移动光标的情况下直接获取元素的方法？\n\n对象存储在内存中，具有引用地址。现在，要获取任何对象的值，你需要提供引用信息。根据\
  \ API，`Iterator` 中的光标始终指向中间，因此将光标移动到当前位置是重要的。调用 `next()` 方法会将光标移动到当前位置。\n\n### 陈述\
  \ `Iterator` 和 `ListIterator` 之间的区别？\n\n`Iterator` 和 `ListIterator` 都用于迭代，区别如下：\n\
  \n- `Iterator` 可以用于遍历 `List` 和 `Set` 集合。相反，`ListIterator` 只能用于遍历 `List`。\n- `Iterator`\
  \ 只能向正向遍历。然而，`ListIterator` 可以用于正向和反向遍历。\n- `ListIterator` 继承自 `Iterator` 接口。它提供了额外的功能，例如使用索引位置对前一个后续元素进行添加、替换和获取。\n\
  \n### 遍历列表有哪些不同的方法？\n\n人们可以使用 `Iterator` 和/或 for-each 循环来遍历列表。使用 `Iterator` 更具线程安全性，因为它确保了当底层列表元素被修改时，会抛出异常。这两种方法都可以如代码代码所示：\n\
  \n使用 Iterator：\n```java\nList<String> list = new ArrayList<>();\nIterator it = list.iterator();\n\
  String data = it.next();\nSystem.out.println(data);\n```\n\n使用 for-each 循环：\n```java\n\
  List<String> list = new ArrayList<>();\nfor (String data : list) {\n    System.out.println(data);\n\
  }\n```\n\n### 什么是 `UnsupportedOperationException`？在执行过程中何时发生 `UnsupportedException`？\n\
  \n`UnsupportedOperationException` 是一种用于表示操作不支持的异常。它被广泛用于集合框架的 JDK 类中。`java.util.Collections.UnmodifiableCollection`\
  \ 对所有 `add` 和 `remove` 操作都会抛出此异常。\n\n例如，假设我们有一个数组，并从它获取一个列表：\n```java\nString[]\
  \ fruits = {\"Apple\", \"Banana\", \"Cherry\"};\nList<String> list = Arrays.asList(fruits);\n\
  ```\n现在，如果我们尝试向列表中添加另一个水果：\n```java\nlist.add(\"Mango\");\n```\n我们将得到 `UnsupportedOperationException`。在从获取的列表中移除元素时也会发生相同的异常。\n\
  \n### 以下两个语句之间的区别是什么\n\n```java\nList<String> fruits = Arrays.asList(\"Mango\",\
  \ \"Kiwi\", \"Orange\", \"Papaya\");\n```\n\n与\n\n```java\nString[] fruits = {\"\
  Mango\", \"Kiwi\", \"Orange\", \"Papaya\"};\nList<String> fruitList = new ArrayList<>(Arrays.asList(fruits));\n\
  ```\n\n第一条语句提供的是不可变列表。如果尝试从列表中添加或删除元素，将会得到 `UnsupportedOperationException`。\n\n\
  第二组语句提供了可变列表，这意味着可以对其添加或删除元素。\n\n### `HashMap` 在 Java 中是如何工作的？\n\n`HashMap` 使用 `Map.Entry`\
  \ 静态内部类存储每个条目作为键值对。它基于哈希算法工作。在通过相应的 `put` 或 `get` 方法操作元素时，它使用了 `hashCode()` 和 `equals()`\
  \ 方法。当调用 `put()` 方法传递键值对时，`HashMap` 使用 `key hashCode()` 来查找存储键值对的索引。如果存在已有的条目，它会使用\
  \ `equals()` 方法检查；如果不存在，则会创建一个新条目并存储该键值条目。\n\n当调用 `get()` 方法传递键时，`HashMap` 再次使用\
  \ `hashCode()` 查找数组中的索引，之后使用 `equals()` 方法找到正确的条目并返回其值。\n\n`HashMap` 具有 `capacity`、`load\
  \ factor`、`threshold` 等属性。`HashMap` 的初始默认容量为 `16`，负载因子为 `0.75`。阈值通过 `capacity` 与\
  \ `load factor` 计算。每当尝试添加条目时，都会检查映射的大小。如果大小大于阈值，`HashMap` 将内容重新哈希到容量更大的数组中。容量始终是\
  \ 2 的幂，所以如果我们知道需要存储大量的键值对，那么初始化具有正确 `capacity` 和 `load factor` 的 `HashMap` 是一个好主意。\n\
  \n### 可以将类的实例作为 Map 的键吗？\n\n是的，可以使用类的实例作为 map 的键。但在将实例作为键之前，我们需要考虑以下几点：\n\n- 如果该类重写了\
  \ `equals()` 方法，它也应该重写 `hashCode()` 方法。\n- 该类对于所有实例都符合与 `equals()` 和 `hashCode()`\
  \ 相关的规则。\n- 如果类字段没有在 `equals()` 中，那么也不应该在 `hashCode()` 方法中使用它。\n\n\n\n\n\n用户定义键类的最佳实践是使其变为不可变的，这样\
  \ `hashCode()` 值就可以被缓存，从而提供快速的性能。如果我们把类设为不可变，就能确保 `hashCode()` 和 `equals()` 在未来不会发生变化，这将解决任何可变性带来的问题。\n\
  \n### 如何访问 `Map` 类型集合中的每个条目？`Map` 接口提供了哪些不同的集合视图？\n\n`Map` 接口提供了以下方式或方法来访问元素：\n\n\
  #### Set\n`keySet()` 方法返回一个包含 `map` 中键的 `Set`。该 `set` 由 `map` 支持。这意味着 `map` 的任何更改都会反映在\
  \ `set` 中，反之，如果 `set` 发生了更改，这些更改将反映到 `map` 中。\n\n*   如果在遍历 `set` 的过程中修改了 `map`，迭代结果将为\
  \ `undffined`。\n*   `set` 支持删除元素，这将从 `map` 中移除映射。这种删除可以通过 `Iterator` 的 `remove()`\
  \ 和 `clear()` 操作完成。它不支持 `add()` 或 `addAll()` 操作。\n\n#### Collection\n该方法返回一个包含 `map`\
  \ 中值的集合。\n\n`collection` 由 `map` 支持，`map` 的任何更改都会反映在 `collection` 中，反之亦然。\n\n* \
  \  如果在遍历 `collection` 的过程中修改了 `map`，迭代结果将为 `undefined`。\n*   `collection` 支持删除元素，可以通过\
  \ `Iterator` 的 `remove()` 和 `clear()` 方法从 `map` 中移除相应的映射。它不支持 `add()` 或 `addAll()`\
  \ 操作。\n\n#### SetV>>\n该方法返回一个包含 `map` 中映射的集合集。\n\n`set` 由 `map` 支持，因此 `map` 的更改会反映在\
  \ `set` 中，反之亦然。\n\n*   如果在遍历 `set` 的同时修改了 `map`，迭代结果将为 `undefined`。\n*   `set` 允许删除元素，这实际上通过\
  \ `remove()` 和 `clear()` 操作从 `map` 中移除相应的映射，但它不支持 `add()` 或 `addAll()` 操作。\n\n###\
  \ 框架中的哪些集合类是线程安全的？\n\n`Properties` 和 `Stack` 等类是同步的；这意味着它们是线程安全的，可以在多线程环境中安全使用。在\
  \ JDK 1.5 中，包含了一些并发 API，允许在迭代过程中进行修改。这是可能的因为它们在 `collection` 的克隆上运行，使得它们在多线程环境中是安全的。这些类位于\
  \ `java.util.concurrent` 包中。这些类允许在迭代时修改集合。\n\n### 你能详细解释一下 `CopyOnWriteArraySet`\
  \ 吗？\n\n`CopyOnWriteArraySet` 引入于 JDK 1.5，它是 `Set` 的线程安全版本。内部，它使用 `CopyOnWriteArrayList`\
  \ 对元素执行的所有操作。有趣的是，它由不可变数组支持。这意味着如果你更改它的任何元素，它会在后台完全创建一个新数组。因此，如果你处于经常修改元素的情况下，那么这种\
  \ `Set` 实现的代价会更高。\n\n### `Queue` 和 `Stack` 是什么？列出它们的区别？\n\n`Queue` 和 `Stack` 用于在处理数据之前存储数据，其区别如下：\n\
  \n*   `java.util.Queue` 是一个接口，其实现类存在于 Java 并发包中。\n*   `Queue` 是一个接口；但 `Stack` 是一个继承自\
  \ `Vector` 的类。\n*   `Queue` 允许按照先进先出（FIFO）顺序检索元素，而 `Stack` 允许按照后进先（LIFO）顺序检索元素。\n\
  *   `Stack` 提供了 `push()` 和 `pop()` 操作，而 `Queue` 提供了 `offer()` 和 `poll()` 方法。\n\n\
  `Stack` 数据结构本质上是一种递归数据结构，具有良好的递归操作，例如实现二叉树的前序、后序和中序遍历。另一方面，`Queue` 是一种顺序数据结构，可以按顺序处理数据。\n\
  \n### 与 Java 集合框架相关的最佳实践有哪些？\n\n我们可以根据对大小的需求选择合适的集合。例如，如果我们需要固定大小，可能就会使用 `array`。如果我们需要唯一性，我们会选择\
  \ `Set`。如果我们需要以排序的方式维护对象，我们需要使用 `TreeSet`。如果我们希望即使对于重复对象也能实现唯一性，可以利用 `Map` 的实现。某些集合允许指定初始容量，所以如果我们能估计想要存储的元素数量，就可以利用它来避免重新哈希（rehashing）或调整大小。\n\
  \n在此基础上，我们还需要记住以下几点：\n\n*   始终以接口而非实现来编写应用程序，这样将来就可以轻松地更改实现。\n*   始终使用提供类型安全的泛型，而且它可以避免运行时出现\
  \ `ClassCastException`。\n*   使用 JDK 提供的不可变类作为 `Map` 的键，这样我们就不需要为自定义类实现 `hashCode()`\
  \ 和 `equals()` 方法。这避免了编码开销。\n*   尽可能多地使用工具类来实现算法或获取只读、同步或空集合，而不是自己写。\n\n\n\n\n简单来说，`Dequeue`\
  \ 是一个双端队列，元素在尾部插入并从头部移除。但是，你可以从两端执行这些操作。它实际上是 `Queue` 和 `Stack` 的结合体。这意味着它同时适用于\
  \ `FIFO`（先进先出）和 `LIFO`（后进先出）算法。`ArrayDeque` 和 `LinkedList` 类是 `Dequeue` 接口的实现类。为了方便从两侧添加和删除元素，它提供了与\
  \ `Queue`不同的方法，例如 `removeLast()` 等。\n\n在不同的 `Queue` 实现中，你如何决定使用哪一个？\n\n确定应该使用哪种\
  \ `Queue` 实现通常是很困惑的。但是，如果你确定了自己的功能需求以及对并发的需求，那么你的选择将会变得容易。\n\n如果你感兴趣按 `FIFO` 顺序获取元素，显然的选择是\
  \ `ArrayDeque`；但如果你更看重元素的优先级，则需要选择。这种选择是基于你不预期元素会被并发访问的假设。如果你打算进行并发访问，那么可以选择 `PriorityBlockingQueue`；或者在不想对\
  \ `Queue` 采用阻塞方法的情况下，你可以选择\n\n### 什么是 IdentityHashMap？它与普通的 HashMap 有何区别？\n\n`IdentityHashMap`\
  \ 是 `Java` `1.4` 版本引入的。该类也是 `Map` 的实现，但它内部不使用 `equals()` 和 `hashCode()` 方法进行对象比较。相反，它使用等价运算符来检查对象的相等性。因此，这种\
  \ `Map` 实现比另一个更快。另一个区别在于键，存储在 `HashMap` 中的键 必须是不可变的，但在 `IdentityHashMap` 中，键并不要求必须是不可变的。\n\
  \n### `Collections` 类中哪些是常用于对 `List` 执行操作的常用方法？\n\n可以调用以下这些来自 `Collections` 类的方法来专门用于对\
  \ `List` 执行操作：\n\n```java\nvoid reverse(List list)\nvoid rotate(List, int distance)\n\
  void shuffle(List list)\nvoid sort(List list)\nvoid sort(List list, comparatorSuper\
  \ T> c)\nvoid swap(List list, int i, int j)\nvoid copy(List dest, List src)\nvoid\
  \ fill(Listsuper T> list, T obj)\nvoid replaceAll(List list, T oldVal, T newVal)\n\
  ```\n\n### 结论\n\n你刚刚完成了 Java 面试中最重要且复杂的章节之一。在本章中，我们讨论了 `Java` 中的 `Collection` 框架。我们详细讨论了这一强大\
  \ API 中的不同接口和类。我们讨论了各种集合类型如 `List`、`Set`、`Queue` 和 `Map` 及其意义。在此，我们涵盖了该接口的不同实现类。除了这些类，我们还讨论了\
  \ `Arrays` 和 `Collections` 等工具类，以及它们如何增强集合的行为。\n\n在下一章中，我们将讨论 `Java` 的一些杂项概念，如 `String`、`StringBuffer`、内类、反射等。\n\
  \n## 第 9 章：杂项\n\n## 引言\n\n到目前为止，我们已经看到了许多帮助你应对 `Java` 面试的 `Java` 概念。我们从 Java 的架构开始，讨论了\
  \ `Java` 内部是如何构建的。我们还详细讨论了如何实现面向对象的方法，以及如何处理异常、并发、文件处理、`JDBC` 等。但是，`Java` 是巨大的。除了这些之外，还有许多其他组件使得应用程序开发更加灵活和易于维护。在本章中，我们将讨论此类杂项术语，并通过不同的面试问题进行讨论。\n\
  \n## 结构\n\n本章涵盖了以下概念：\n- `String` 和 `StringBuffer`\n- 内类\n- 反射 API (Reflection API)\n\
  - 单元测试\n- 国际化\n\n## 目标\n\n在本章结束时，你将能够根据内类、单元测试等不同概念回答面试问题。本章还将通过一些代码段提供关于如何实现所有这些概念的基础知识。\n\
  \n### 以下两个是相同还是不同的？\n\n```java\nString emptyLiteral = \"\";\nString emptyNewString\
  \ = new \"\";\n```\n\n`emptyLiteral` 将被添加到 `String` 池中，而 `emptyNewString` 将直接进入堆内存。\n\
  \n```java\nString nullValue = null; \n以及\nString emptyLiteral = \"\";\n```\n\n上述两个语句是相同还是不同的？\n\
  \n这些是不同的语句。如果我们尝试对具有 `null` 值的 `String` 调用任何方法，我们将得到 `NullPointerException`。然而，第一个不会抛出。\n\
  \n### StringBuffer 和 StringBuilder 之间有什么区别？\n\n以下是 `StringBuffer` 和 `StringBuilder`\
  \ 之间的区别：\n\n- `StringBuffer` 是同步的，而 `StringBuilder` 是非同步的。\n- `StringBuffer` 的效率比\
  \ `StringBuilder` 低。\n\n### StringBuffer 和 String 之间有什么区别？\n\n以下是 `StringBuffer`\
  \ 和 `String` 之间的区别：\n\n- `String` 类是不可变的，而 `StringBuffer` 是可变的。\n- `String` 消耗更多内存，并且对其执行的每次操作都会创建过多的实例。当你更新字符串时，`StringBuffer`\
  \ 消耗的内存较少。\n- `StringBuffer` 比 `String` 快。\n\n`StringBuffer` 重写了 `Object` 类的 `equals()`\
  \ 方法，但 `StringBuffer` 类没有重写对象的 `equals()` 方法。\n\n### 什么是反射？\n\n反射是一种在运行时检查并修改类的过程。通过反射，我们可以检查接口、字段和方法。\n\
  \n### 如何解释使用反射？\n\n反射提供了多种方法。以下显示了实现反射的一种方式：\n\n```java\nClass c = String.class;\n\
  System.out.println(c.getName());\n```\n\n上述代码片段将打印 String。\n\n### 如何不使用 new 运算符获取类的对象？\n\
  \n有三种方法可以生成类对象：\n\n- `Class` 类的 `forName()` 方法：用于动态加载类。如果你知道类的完全限定名，则应使用它。它不能用于基本类型。该方法在前面的问题中已经显示。\n\
  - `Object` 类的 `getClass()` 方法：返回 `Class` 实例。如果你知道类型，则可以使用它。它也可以用于基本类型。\n- 简单的 `.class`\
  \ 语法：如果没有实例但知道类型，可以通过在类型后附加 `.class` 获取类。它可以用于基本数据类型：\n\n```java\nClass c = int.class;\n\
  ```\n\n### 列出反射 API 的不同方法及其用途\n\n下表列出了反射 API 的一些方法：\n\n| API | 用途 |\n| :--- | :---\
  \ |\n| `getName()` | 返回类名 |\n| `getMethods()` | 返回类的所有公共方法 |\n| `getDeclaredMethods()`\
  \ | 返回类声明的所有方法 |\n| `getFields()` | 返回类的所有公共字段 |\n| `getDeclaredFields()` | 返回类声明的所有字段\
  \ |\n| `getConstructors()` | 返回类的所有公共构造方法 |\n| `getDeclaredConstructors()` | 返回类声明的所有构造方法\
  \ |\n| `newInstance()` | 创建类的的新实例 |\n\n### 我们可以使用反射访问另一个类的私有字段吗？\n\n私有字段成员通常不在类外访问。但是，使用反射，我们可以这样做。反射\
  \ API 提供了一个方法，通过你可以获取该字段的引用，然后在你的类中访问该字段。以下代码片段显示了如何从另一个类访问 `Person` 类中定义的私有字段 `personId`：\n\
  \n```java\nField personData = Person.class.getDeclaredField(\"personId\");\npersonData.setAccessible(true);\n\
  String personValue = (String) personData.get(personObj);\nSystem.out.println(personValue);\n\
  ```\n\n### 什么是内类及其类型？\n\n内类是嵌套在另一个类中的类。我们有四种类型如下：\n\n\n\n\n\n# 内部类\n\n- 另一个类内部的类\n\
  - 在类的方法内部声明的类\n- 匿名类\n- 静态内部类\n\n## 为什么需要内部类，或者说我们使用内部类？\n当我们想要在逻辑上将类组合在一起时，就会使用内部类。更具体地说，如果我们只想让某一个类利用另一个类的服务，那么与其单独创建该类，我们不如将其创建为内部类。\n\
  \n## 静态嵌套类可以访问外部类的任何其他成员吗？\n静态嵌套类无法访问外部类的任何其他成员。这确保了所有对象共有的数据是由静态嵌套类访问的。\n\n## 内部类可以声明为私有吗？\n\
  可以，嵌套类可以用任何修饰符声明。由于外部类对访问修饰符的使用有限制，而内部类没有这种限制，甚至可以声明为私有。这为嵌套类提供了灵活性，并允许它仅被内部类使用。\n\
  \n## 什么是隐藏（Shadowing）？\n当内部类中的成员声明与外部类中的成员声明同名时，内部类对其本地成员的优先级高于外部类成员。这意味着它将遮蔽外部类的成员。这一过程被称为隐藏。\n\
  \n## 什么是 JUnit？\nJUnit 是用于 Java 代码单元测试的测试框架。\n\n## 什么是单元测试？\n测试应用程序的单个功能（称为单元）的过程被称为单元测试。\n\
  \n## 你能解释一下如何测试应用程序的单元吗？\nJUnit 提供了不同的注解，你可以通过这些注解来测试应用程序。我们可以使用的一个重要注解是 `@Test`。此注解可以应用于被测试的方法。被测试的方法可以使用\
  \ `assertEquals()` 等方法来检查预期结果与生成结果之间的对比。根据结果，测试被认为成功或失败。\n\n## 哪些实用的 JUnit 扩展？\n\
  以下是 JUnit 的一些扩展：\n- JWebUnit\n- XMLUnit\n- Cactus\n- MockObject\n\n## 哪些是重要的 JUnit\
  \ 注解？\n以下是 JUnit 中使用的一些重要注解：\n- `@Test`\n- `@BeforeClass`\n- `@Before`\n- `@After`\n\
  - `@AfterClass`\n\n## @Before 和 @After 注解的作用是什么？\n当我们执行任何测试用例时，可能需要在该测试之前和之后执行某些业务逻辑。`@Before`\
  \ 注解应用于方法上，告知在每个测试之前应该执行该方法。同此，`@After` 注解用于告知在每个测试用例后执行该方法。\n\n## JUnitCore 类的作用是什么？\n\
  使用 `@Test` 注解，我们可以单独测试不同的方法。但如果我们想同时测试应用程序的多个方法，可以使用 `JUnitCore` 类。该类有一个方法可以运行所有测试用例并将信息以包的形式返回。\n\
  \n## 手动测试和自动化测试有什么区别？\n手动测试由人类执行，因此是耗时且成本高。自动化测试通过测试工具或程序执行，因此速度快且成本低。\n\n## 如何对“私有”方法进行测试？\n\
  没有直接的方法可以测试私有方法；因此必须进行手动测试，或者将方法改为“保护”方法。\n\n## Fixture（变形）中有哪些方法？\nFixture 包含以下方法：\n\
  - `setup`\n- `teardown`\n\n## 什么是国际化？\n国际化也被称为 `i18N`，它是一个概念，我们创建一个可以适应全球应用程序，并根据特定国家或地区的语言显示相应的消息或货币等。\n\
  \n## 什么是本地化？\n本地化是一个向应用程序添加资源的过程，以便应用程序能够支持特定的语言。为了实现这一点，我们可以借助 `Locale` 类的帮助，该类代表了语言以及该地区的时区等设置。可以通过传递语言和国家作为参数来创建\
  \ `Locale` 类的对象。\n\n## 如何使用 Locale 类更改数字格式？\n下面的代码段显示了如何使用 `Locale` 类更改数字的格式：\n\n\
  ```java\ndouble\nNumberFormat nf=NumberFormat.getInstance(Locale.ITALY);\nnumber\
  \ in ITALY format is\n```\n\n## 总结\n在本章中，你学习了 Java 的一些杂项 API。我们还讨论了内部类、反射和国际化等概念。我们还简要了解了单元测试的方法，以知道如何测试应用程序。在下一章中，我们将讨论函数式编程，这是最近\
  \ Java API 中最重要的增强功能之一。\n\n# 第 10 章\n## 函数式编程\n\n## 引言\n接口始终为你的应用程序提供松散耦合或灵活性。它们有助于子类在需要时实现自己的版本的业务逻辑。但通常，当接口只包含一个方法时，开发者会觉得他们正在编写的实现代码变得不必要的混乱。为了实现单个方法，他们可能必须编写一个完整的类，这有时比在接口重写的方法中编写的实际业务逻辑还要臃肿。为了克服这种复杂性，Java\
  \ 引入了匿名内部类形式的闭包。虽然匿名内部类避免了类定义的使用，但它在减少代码臃肿方面仍然不足。通常，人们说匿名内部类存在“垂直问题”，因为我们需要堆叠几行代码来包含单行的业务逻辑。函数式编程的主要目标是避免这种仪式性的代码，用声明式方法取代结构化代码块。这确实改进了开发者处理函数接口和集合的方法。\n\
  \n## 结构\n在本章中，我们将讨论软件开发中的不同设计模式。我们将涵盖：\n- 什么是函数式编程？\n- 什么是 lambda？\n- 什么是流以及创建它的方法？\n\
  - Stream API 有哪些操作？\n- 什么是谓词（Predicate）及其用途？\n\n## 目标\n尽管函数式编程为开发者理解实现增加了极大的灵活性，但对于初学者来说一直是一个挑战。虽然并不困难，但将开发者的思维从传统编程转变为函数式编程是一个关注点。在本章中，你不仅将学习如何实现函数式编程，还将学习\
  \ lambda、stream 等不同概念。我们将熟悉 lambda 和 stream 的基础。我们将讨论基于 lambda 和 stream 的不同面试题，如果面试是基于\
  \ Java 8 的，这些是面试中非常重要的部分。\n\n\n\n\n\n> 注意：尽管这个问题看起来非常基础，但它是一个重要的问题。通常当面试者在简历中提到\
  \ `Java 8`是一项技能时，他/她并并没有意识到自己是使用了 `Java 8` 编译器还是使用了 `Java 8` 的特性。由于 Java 编译器的后兼容性，即使你没有使用\
  \ `Java 8` 的任何新功能，你仍然可以在 `Java 8` 编译器上编译你的 Java 8 之前的程序，这会让你觉得你熟悉 `Java 8` API。显然，作为专家，面试官知道这一点，他/她会想你是否真的用过\
  \ `Java 8`。\n\n## 什么是函数式接口？如何创建它们？有必要用 `@FunctionalInterface` 注解声明函数式接口吗？\n\n`Java\
  \ 8` 引入了函数式接口。函数式接口只有一个抽象方法的接口。`Java 8` 提供了许多函数式接口，如 `Supplier`、`Consumer`、`Function`\
  \ 等。需要时也可以声明自定义的函数式接口。可以通过声明只有一个抽象方法的接口来开发函数式接口。我们也可以对这种包含单个抽象方法的接口进行注解。使用 `@FunctionalInterface`\
  \ 注解并不是强制的。但它是推荐的做法，因为该注解可以确保接口不会包含任何其他抽象方法，如果尝试添加，就会发生错误。\n\n## 在 `Java 8` 之前我们也有函数式接口吗？\n\
  \n是的。在 Java 8.0 之前的版本中，我们确实有一些行为类似于函数式接口的接口。换句话说，它们只有一个需要实现的抽象方法。唯一的区别是它们没有使用 `@FunctionalInterface`\
  \ 注解。以下是此类接口的示例：\n\n- `java.lang.Runnable`\n- `java.util.Comparator`\n- `java.util.concurrent.Callable`\n\
  - `java.io.FileFilter`\n- `java.nio.file.PathMatcher`\n- `java.lang.reflect.InvocationHandler`\n\
  - `java.awt.event.ActionListener`\n- `javax.swing.event.ChangeListener`\n\n## 什么是\
  \ SAM 接口？\n\n`Java 8` 引入了函数式接口，即只有一个抽象方法的接口。由于这些接口只包含一个抽象方法，它们也被称为 SAM 接口。SAM 代表\
  \ Single Abstract Method（单抽象方法接口）。\n\n## 定义函数式接口时应该遵循哪些指南？\n\n定义函数式接口时应遵循以下指南：\n\
  \n- 函数式接口应该只包含一个抽象方法。\n- 接口中不能定义多个抽象方法。\n- 为了确保接口不包含多个抽象方法，接口必须由 `@FunctionalInterface`\
  \ 注解。然而，使用该注解并不是强制的。\n\n## 什么是默认方法（default methods）？\n\n默认方法是接口中带有方法体的方法。顾其名，这些方法使用了\
  \ `default` 关键字。使用这些默认方法是为了“向后兼容”，这意味着如果 `JDK` 修改了任何接口（不带默认方法），那么实现该接口的类将会崩溃。\n\n\
  相反，如果你在接口中添加 `default` 方法，那么你就可以提供默认实现。这不会影响实现类，因为类没有负责实现它自己版本的该方法。\n\n## lambda\
  \ 函数有哪些不同的特征？\n\nlambda 函数的主要特征如下如下：\n\n- 被定义为 lambda 表达式的方法可以作为参数传递给另一个函数。\n- 函数独立存在，不属于任何类。\n\
  - 一个人可以跳过参数类型的声明，因为编译器可以从参数的值中获取类型。\n- 如果函数没有参数或只有一个参数，可以跳过写括号。\n- 使用多个参数时需要括号。\n\
  - 只要表达式体只有一条语句，就可以跳过使用大括号来声明函数体。\n\n## 你能解释 lambda 表达式的各个部分，或者如何编写 lambda 表达式吗？\n\
  \n一个典型的 lambda 表达式形式如下：\n\n`(value1, value2) ➡ body of function` \n\n它包含以下部分：\n\n\
  - 函数调用，根据函数的声明，可能包含也不包含传递给函数的参数。\n- 箭头运算符，指向函数体。\n- 函数体，可能包含一行或多行代码。\n\n## 你能通过一些代码展示如何实现\
  \ lambda 表达式吗？\n\nlambda 表达式本质上与函数式接口和匿名内部类的概念。让我们考虑以下函数式接口：\n\n`MyInterface.java`\n\
  ```java\n@FunctionalInterface\ninterface MyInterface {\n    void doSomething();\n\
  }\n```\n\n上述代码中的 `@FunctionalInterface` 注解完全可选可选。\n\n传统上，为了实现此接口，我们可以写一个具体的类来重写抽象方法。但是，我们也可以采用以下\
  \ lambda 表达式：\n\n`TestLambda.java`\n```java\npublic class TestLambda {\n    public\
  \ static void main(String[] args) {\n        MyInterface m = () -> {\n         \
  \   // is\n        };\n        m.doSomething();\n    }\n}\n```\n\n## 你用过 Collection\
  \ 吗？你用过 Stream API 吗？你能解释一下 Collection API 和 Stream API 之间的区别吗？\n\n以下点提供了 collection\
  \ API 和 stream API 之间区别的概念：\n\n- `Stream API` 是在 `Java 8` 标准版中引入的，`Collection API`\
  \ 是在 `Java 1.2` 中引入的。\n- `stream API` 用于计算。collection API 也可以用于存储。\n- `Stream API`\
  \ 不使用 `Iterator`，遍历不同元素时简单地使用 `forEach`。\n- 使用 `stream API` 只能消费和遍历一次；然而使用 collection\
  \ API 可以在需要时这样做。\n\n## 什么是方法引用（method reference）？\n\n方法引用是 `Java 8` 引入的另一个特性。方法引用函数式接口的方法。方法引用可以替换\
  \ lambda 表达式。\n\n下行表示 lambda 表达式：\n`name -> System.out.println(name)`\n\n相同的表达式可以转换为方法引用：\n\
  `System.out::println`\n\n这里 `::` 是用于区分类名和方法名的运算符。\n\n## 解释 String::valueOf 的含义\n\
  \n它是方法引用的示例，更准确地说，它是静态方法引用。该表达式创建了 `String` 类中 `valueOf` 方法的静态方法引用。该表达式可以返回类型为 `Character`、`Integer`、`Boolean`\
  \ 等参数的字符串表示。\n\n## 什么是 Stream API？为什么我们需要 Stream API？\n\n`Stream API` 已添加到 `Java\
  \ 8`，包含了处理来自 `collection` 等源对象的 API。它有助于：\n- 函数式编程\n- 简化处理的聚合操作\n- 更快的处理带来性能\n-\
  \ 利用多线程的并行操作\n\n## limit() 和 skip() 之间有什么区别？\n\n`limit()` 方法用于指定返回的元素数量。例如，当某人说输出将包含\
  \ 10 个元素时。以下代码片段说明了 `limit()` 方法的工作：\n\n在这里，我们将 limit 设置为 `6`。因此，它将返回前 10 个数字。\n\
  \n`skip()` 方法跳过到指定索引的元素。例如，如果我们调用它，它将跳过到第五索引的元素并返回其余元素。\n\n以下代码片段说明了 `skip()` 方法的工作原理。\n\
  \n\n\n\n\n> 这将跳过第五个索引，并返回从索引 6 开始的所有元素。\n\n## 如何在 Java 8 中使用 `forEach` 打印 5 个随机数？\n\
  \n以下代码将生成 5 个随机数，并借助 `forEach` 函数打印生成的数值：\n\n```java\nRandom random = new Random();\n\
  random.ints().forEach(System.out::println);\n```\n\n## 什么是中间操作和终端操作？Stream 中中间操作和终端操作的区别是什么？\n\
  \n所有的 `Stream` 操作都分为中间操作和终端操作。\n\n### 中间操作\n这些操作返回一个 `Stream`，因此可以在其上执行其他操作。中间操作被称为惰性操作（lazy\
  \ operations），因为在对它上执行任何终端操作之前，它们不会处理该 `Stream`。一些中间操作函数包括 `map()`、`filter()`、`distinct()`、`sorted()`、`limit()`\
  \ 和\n\n### 终端操作\n终端操作启动对 `Stream` 的处理。当调用终端操作时，`Stream` 将经过所有的中间操作。一些终端操作函数包括 `forEach()`、`toArray()`、`reduce()`、`collect()`、`min()`、`max()`\
  \ 和\n\n## 你能解释一下 Stream 中的 `reduce` 操作吗？\n\n当我们处理一组数据（即集合）时，通常需要执行不同的操作。其中某些操作可能需要根据流中存在的元素生成一个单一值。这可能是计数元素，或者计算平均值或和。在这种情况下，我们可以使用流的\
  \ `reduce()` 函数。\n\n以下是 `reduce()` 函数的语法：\n\n```java\nT identity, accumulator);\n\
  ```\n\n其中，\n- `T` 是初始值的恒等值（identity）\n- `Accumulator` 是我们想要对元素执行的函数或过程\n\n例如，以下代码段使用了\
  \ `reduce()` 函数，它计算流中所有元素的和：\n\n```java\nint total = (value1, value2) -> value1\
  \ + value2;\n```\n\n## 什么是流流水（stream pipelining）？\n\n流流水是将操作链式组合以产生所需结果的概念。流操作分为中间操作和终端操作。每个中间操作在运行时都会返回一个\
  \ `Stream` 实例。人们可以执行任意数量的中间操作来处理数据。所有这些操作构成了一个处理流水线。\n\n流水线必须有一个终端操作，它会终止流水线并返回最终值。\n\
  \n## Stream 是惰性的（lazy）是什么意思？\n\nStream 之所以是性是因为除非使用终端操作，否则中间操作链中的任何动作都不会发生。通常，当使用一个函数时，移动和流控制会运行到该行，函数会被调用并发生动作。但在\
  \ `Stream` 中，情况并非如此。只有当对 `Stream` 调用终端方法时，中间操作才会工作。\n\n## 请列出并解释不同的中间操作和终端操作\n\n\
  以下表列出了不同的中间操作：\n\n**表 10.1：中间操作**\n（根据源码省略了操作列表）\n\n以下表列出了不同的终端操作：\n\n**表 10.2：终端操作**\n\
  （根据源码省略了操作列表）\n\n## `findFirst()` 和 `findAny()` 方法之间有什么区别？\n\n`findFirst()` 方法使用谓词（predicate）返回满足指定条件的第一个元素。\n\
  \n`findAny()` 方法返回匹配指定条件的任意元素。在处理并行流时，`findAny()` 方法非常有用。\n\n## 你能展示流是如何惰性的吗？\n\n\
  让我们考虑以下代码段，我们想要查找值大于 5 的元素的首次出现：\n\n```java\nList<Integer> a = ...\n    .peek(num\
  \ -> \"Filtered element: \" + num)\n    .filter(x -> x > 5)\n    .findFirst();\n\
  ```\n\n上述代码段的输出如下：\n```\nFiltered element: 1\nFiltered element: 2\nFiltered element:\
  \ 15\n15\n```\n\n正如我们观察到的，我们使用了流的 `findFirst()` 方法，一旦找到匹配的元素，就不会再检查后续元素。这种方法使得流具有惰性。\n\
  \n## `Iterator` 和 `Spliterator` 之间有什么区别？\n\n`Iterator` 引入于 JDK 1.2，而 `Spliterator`\
  \ 引入于 JDK 1.8 之间。\n\n`Iterators` 用于迭代 `Collection` API。然而，`Spliterator` 用于 `Stream`\
  \ API。\n\n`Iterator` 具有用于迭代元素的 `next()` 和 `hasNext()` 方法。`Spliterator` 具有方法...\n\
  \n人们需要在集合对象上调用 `iterator()` 方法进行迭代。但对于 spliterator，我们需要在 `Stream` 对象上调用 `spliterator()`\
  \ 方法。\n\n`Iterator` 只能按顺序进行迭代。然而，`SplitIterator` 也可以以并行和顺序进行迭代。\n\n## 解释一下 `Optional`\
  \ 类？\n\n`Optional` 类是 Java 8 引入的 `java.util` 包中的一个类，用于避免 `NullPointerException`。它作为一个容器，用于包含非空对象。它包含许多方法；一些常用的方法是\
  \ `isPresent()` 和\n\n\n\n\n`isPresent()` 方法确保容器是否包含值。\n\n`get()` 方法在值存在时返回该值，否则会抛出异常。\n\
  \n### 什么是谓词（predicate）？解释谓词和函数（function）之间的区别？\n\n`Predicate` 和 `Function` 是 Java\
  \ 8 中 `java.util.function` 包下的预定义函数式接口。\n\n`Predicate` 返回一个 `Boolean`；然而 `Function`\
  \ 返回一个对象。\n\n`Predicate` 以 `Predicate<T>` 的形式编写，接受一个单一参数。然而，`Function` 以 `Function<T,\
  \ R>` 的形式编写，接受一个类型为 `T` 的单一参数并返回一个类型为 `R` 的结果。\n\n`Predicate` 用于验证条件。而 `Function`\
  \ 用于对参数执行某些操作并返回修改后的值。\n\n### 什么是 Consumer 函数式接口？\n\n`Consumer` 是一个函数式接口，它接受一个单一参数并对其进行处理以产生结果，但不返回生成的的结果。\n\
  \n### 什么是 Supplier 函数式接口？\n\n`Supplier` 是一个函数式接口。它不接受任何输入参数，但提供元素。从 `Supplier` 返回的值可以使用\
  \ `get()` 方法来获取。\n\n### map() 函数的作用是什么？你为什么要使用它？\n\n`Stream` 的 `map()` 函数执行映射操作。它允许通过应用某些逻辑将一种类型的对象转换为另一种。这意味着可以取一个\
  \ `List<String>` 并使用 `map` 将其转换为包含每个 String 长度的 `List`。\n\n这用于你想将一个对象转换为另一个对象的情况。\n\
  \n### flatmap() 函数的作用是什么？你为什么需要它？\n\n`flatMap()` 函数是 `map()` 的扩展。它不仅允许将一个对象转换为另一个，还可以将其扁平化（flatten）。\n\
  \n### 解释 map() 和 flatMap() 之间的区别？\n\n当使用 `Stream` 函数时，它每个输入值产生一个输出值。然而，当我们使用 `flatMap()`\
  \ 操作时，它每个输入值产生零或多个输出值。\n\n让我们来看一个例子。我们将创建一个如下列表：\n\n```java\nList<String> fruits\
  \ = Arrays.asList(\"mango\", \"papaya\", \"banana\");\nList<Integer> list = fruits.stream()\n\
  \    .map(s -> s.length())\n    .collect(Collectors.toList());\n```\n\n### filter()\
  \ 方法的作用是什么？什么时候使用它？\n\n`Stream` 的 `filter()` 方法用于过滤元素。过滤条件使用 `Predicate` 函数指定。\n\
  \n例如，如果你有一个整数列表，并想要那些能被 3 整除的整数，那么我们可以使用 `filter()` 函数。我们将提供一个函数来检查数字是否能被 3 整除，使用\
  \ `n -> n % 3 == 0`，而 `filter()` 将此应用于流的每个元素。\n\n### 为什么要使用 peek() 函数？peek() 方法的作用是什么？你什么时候应该使用它？\n\
  \n`Stream` 类的 `peek()` 方法允许透视流流水线。在这里，我们可以透视已处理的每一个步骤，然后在控制台上打印出有意义的消息。`peek()`\
  \ 的主要目的是调试与 lambda 表达式和 `Stream` 处理相关的问题。\n\n### 创建 Stream 的方法有哪些？你可以将数组转换为 Stream\
  \ 吗？如何做？\n\n以下是创建流的不同方式：\n\n1. **使用集合 API**：它有一个 `stream` 方法，允许从集合创建流，如下：\n```java\n\
  Stream<String> stream = fruits.stream();\n```\n2. **从指定值创建**：我们可以从某些指定值创建流：\n```java\n\
  Stream<String> stream = Stream.of(\"mango\", \"papaya\", \"banana\");\n```\n3. **创建空流**：`empty()`\
  \ 方法允许创建流，以避免为没有元素的流返回 null。\n```java\nStream<String> stream = Stream.empty();\n\
  ```\n4. **从数组创建流**：`Stream` 有一个 `of()` 方法，数组的 `stream()` 方法也可以用于从指定的数组获取顺序流。这两个方法在用非原始类型\
  \ `T` 调用时都会返回一个 `Stream`，如下：\n```java\nString[] fruits = {\"mango\", \"papaya\"\
  , \"banana\"};\nStream<String> stream = Arrays.stream(fruits);\n// 以及\nStream<String>\
  \ stream = Stream.of(fruits);\n```\n\n### 可以为基本类型创建 stream 吗？它有哪些不同的类型？\n\n是的，我们也可以从一组基本类型创建流。`Stream`\
  \ API 提供了不同类型的流来处理基本类型如 `long`，`IntStream` 处理 int，`DoubleStream` 处理 double，`LongStream`\
  \ 处理 long 类型的数据。以下代码段显示了如何使用 `IntStream` 处理 int 数据类型并打印它：\n\n```java\nint[] nums\
  \ = {1, 2, 3, 4, 5};\nArrays.stream(nums).forEach(System.out::println);\n```\n\n\
  ### 一旦终端操作后就可以重用该 stream 吗？可以提供任何实时示例吗？\n\n正如单词本身解释的那样，终端操作会终止流。一旦执行了终端操作，你就无法继续进行任何操作，因为流在之后就被关闭了。\n\
  \n考虑以下代码段：\n```java\nList<String> mystream = Arrays.asList(\"a\", \"b\", \"c\");\n\
  mystream.stream().filter(s -> s.startsWith(\"a\")).anyMatch(s -> true); // 终端操作后流关闭\n\
  ```\n\n\n\n是的，我们可以做到。虽然流（stream）中没有直接的 API 来实现，但我们可以借助 fork and join（分叉与合并）框架来实现。你可以创建一个\
  \ fork and join 对象，并将流操作封装在其中。下面的代码段展示了如何实现这一点：\n\n```java\nList data=\nForkJoinPool\
  \ customThreadPool = new\nint actualTotal = customThreadPool.submit(() ->\nInteger::sum)).get();\n\
  System.out.println(actualTotal);\n```\n\n前面的代码使用 fork and join 框架创建了 4 个线程，负责对转换为流的列表元素进行累加的任务。\n\
  \n# 结论\n在本章中，我们讨论了 `Java 8` 的一些更新。具体来说，我们讨论了函数式编程。我们讨论了 `lambda` 和 `streams` 的实现。我们讨论了什么是\
  \ `lambda` 以及如何构建 `lambda` 表达式。我们还讨论了 `streams`，它为对数据集合进行迭代和操作提供了更大的灵活性。在此期间，我们还讨论了\
  \ `stream` API 提供的不同方法，例如中间操作和终端操作。在最后，我们还讨论了 `parallel streams`（并行流）。在下一章中，我们将涵盖在软件架构中起至关作用的不同设计模式。\n\
  \n# 第 11 章：设计模式\n\n## 引言\n我们有多少次重复过“软件设计是……”这句话了？每当你设计软件时，你都需要记住这个并不受欢迎的短语。但问题是，是什么让软件变得复杂？而且当我们谈论面向对象编程时，它变得更加复杂。当我们设计软件时，我们需要考虑不同的对象，并为它们设计不同的\
  \ `classes` 和 `interfaces`。对象的行为取决于开发者定义 `classes` 和 `interfaces` 的效率。很多时候我们需要修改\
  \ `class` 的初始设计，以实现系统更大的灵活性和扩展性。有时，客户会在软件流程或结构方面更改需求，这导致我们可能需要从头设计整个结构。如果你想实现这一点，设计模式将是你的救星。设计模式为你提供了一种更灵活的方式来设计你的\
  \ `classes` 和 `interface`。\n\n## 结构\n在本章中，我们将学习以下核心概念：\n- 什么是设计模式？为什么要使用它？\n- 不同的设计模式，例如：\n\
  \    - 创建型设计模式\n    - 结构型设计模式\n    - 行为型设计模式\n    - J2EE 设计模式\n- `Java API` 中设计模式的实现\n\
  \n## 目标\n本章将涵盖大多数有助于更有效地创建应用程序的重要设计模式。此外，本章还旨在让你了解可能基于设计模式提出的各种面试问题，以及 `Java` 如何实现这些模式。\n\
  \n## 你能告诉我们什么是设计模式吗？\n设计模式是一种扩展代码，它们是独立语言的策略，用于解决常见的面向对象设计问题、重复编码问题或从零开始编写代码。它们定义了使应用程序更具灵活性并降低耦合的技术。设计模式描述了如何结构化\
  \ `classes` 以满足系统的特定需求，从而节省时间和精力并提高效率。\n\n## Java 设计模式有哪些分类？\n根据问题分析，可以将设计模式分为以下几类：\n\
  \n### 创建型模式 (Creational patterns)\n这些模式用于定义和描述创建对象的方法。它们深入描述了在类实例化时如何创建对象。\n- `Factory\
  \ method`（工厂方法）\n- `Abstract factory`（抽象工厂）\n- `Builder`（构建器）\n- `Prototype`（原型）\n\
  - `Singleton`（单例）\n\n### 结构型模式 (Structural patterns)\n结构型设计模式关注 `classes` 和对象如何组合在一起形成一个更大的结构。它们为类组合和对象结构提供了高效的解决方案。这些模式依赖于继承的概念，这允许多个类或对象作为一个单一的工作单元协同工作。它们通过识别它们之间的关系来简化结构。这些模式关注\
  \ `classes` 如何从相互继承以及它们是如何从其他类组合的。\n- `Adapter`（适配器）\n- `Bridge`（桥接）\n- `Filter`（过滤器）\n\
  - `Composite`（组合）\n- `Decorator`（装饰器）\n- `Facade`（门面模式）\n- `Flyweight`（备用模式）\n-\
  \ `Proxy`（代理）\n\n### 行为型模式 (Behavioral patterns)\n行为型设计模式关注对象之间的交互和责任。这些模式专注于对象之间交互的简易性。然而，这些模式确保通信对象之间是松耦合的，以避免硬编码。\n\
  - `Interpreter`（解释器）\n- `Template method/pattern`（模板方法/模式）\n- `Chain of responsibility`（责任链）\n\
  - `Command pattern`（命令模式）\n- `Iterator pattern`（迭代器模式）\n- `Strategy pattern`（策略模式）\n\
  - `Visitor pattern`（访问者模式）\n\n### J2EE 模式\n用于设计 J2EE 应用程序的模式。\n- `MVC pattern`（MVC\
  \ 模式）\n- `Data access object pattern`（数据访问对象模式）\n- `Front controller pattern`（前端控制器）\n\
  - `Intercepting filter pattern`（拦截过滤器模式）\n- `Transfer object pattern`（传输对象模式）\n\n\
  ## 解释 Java 设计模式的优点？\n以下是 Java 设计模式的优点：\n- 设计模式提供了模板化的、可重用的解决方案，可以用于多个项目。\n- 设计模式有助于定义一种解决方案，帮助定义并定制系统架构，而不是手动编写所有代码。\n\
  - 设计模式是捕捉专家和经验软件工程师或开发者反思的一种。他们提供了经过验证的解决方案。\n- 设计模式实现了应用程序设计中的透明性。\n\n## 解释设计模式的缺点？\n\
  以下是设计模式的缺点：\n- 模式并没有导致任何直接的代码重用。\n- 模式表面看起来非常简单。\n- 在应用程序中使用模式的团队可能会遭受模式过载。\n- 当团队协作工作时，将模式集成到应用程序开发中需要高度的人力活动。\n\
  \n## 哪种设计模式可以轻松顺序访问集合对象的元素？\n`iterator pattern`（迭代器模式）用于方便地顺序访问集合对象的元素。\n\n## 什么时候使用服务定位模式（service\
  \ locator pattern）？\n可以使用服务定位设计模式来定位各种服务。通常，这种模式使用中心注册表，负责向调用者返回所需的服务。你可以将此中心注册表视为\
  \ `JNDI`。这里需要注意的重要点是，该模式不直接实例化服务，因此不是紧耦合的。但它在某些服务器上注册服务并提供定位它们的方法。\n\n## 哪些技术使用了服务定位模式？\n\
  `EJB` 和 `JMS` 是内部使用服务定位模式的两个例子。\n\n## 哪种模式可以在代码中将抽象与其其实现解耦？\n为了将抽象与其实现解耦，可以使用 bridge（桥接）。在这里，实现可以独立地变化。为了实现这种独立修改，使用一个接口作为抽象和实现之间的桥接。这便于多个对象使用实现类，而不必担心抽象层的变化。\n\
  \n\n\n\n\n# 何时使用拦截器模式？\n\n当我们希望对请求响应中的数据进行预处理或后处理时，可以使用拦截器模式。这也被称为拦截过滤器模式（intercepting\
  \ filter pattern）。\n\n# 什么是工厂设计模式？\n\n什么时候可以使用工厂模式？工厂设计模式有哪些优点？\n\n工厂设计模式是一种创建性模式，它提供了创建对象的最佳方式。它也被称为虚拟工厂（virtual\
  \ factory）。在这种模式中，我们不向客户端暴露创建对象的逻辑以及使用创建对象的标准接口。它允许子类选择要创建的对象的类型。\n\n当我们必须根据给定的数据创建父类或其任一子类的对象时，可以使用工厂模式。工厂设计模式可以用于以下情况：\n\
  \n- 当一个类不知道需要创建哪种类的对象时。\n- 当类通过指定其子类来指定要创建哪些对象时。\n\n工厂设计模式的用处如下：\n\n- 它在创建对象时增加了封装层级。\n\
  - 它允许用更高级、更高性能的功能性实现来替换类的原始实现，而无需对客户端进行任何更改。\n- 工厂模式使代码更加健壮。代码的耦合度降低，因此更容易扩展。\n\n\
  # 既然可以使用 new 操作符，为什么还要用工厂类来实例化一个类？\n\n工厂类提供了具有以下优点的设计灵活性：\n\n- 使用这种模式会导致更解耦的代码，因为它能够从依赖代码中隐藏创建逻辑。\n\
  - 该模式允许引入控制反转容器（inversion of control container）。\n- 由于创建逻辑从依赖代码中隐藏了，它在需要更改应用程序时提供了更多的灵活性。\n\
  \n# 你能提供一些 JDK 中工厂设计模式的实现示例吗？\n\n- `java.util.Calendar`\n- `java.util.ResourceBundle`\n\
  - `java.text.NumberFormat`\n\n# 什么是抽象工厂模式？\n\n抽象工厂模式是一种创建性设计模式。该模式允许定义一个抽象类或接口，用于创建一组相关的对象，而无需指定它们具体的子类。拥有抽象工厂模式的原因是比工厂模式高一个层次，因为它定义了一个返回类工厂的类。抽象工厂模式围绕超类运行。这些超类参与了其他类的创建。每个生成的工厂都负责根据工厂模式提供对象。在抽象工厂模式中，一个接口负责创建相关对象的工厂，而无需显式地识别它们的类。\n\
  \n# 如何区分工厂模式和抽象工厂设计模式？\n\n工厂模式处理对象的创建并将其委托给单独的工厂类，而抽象工厂模式围绕工厂的超集运行，该超集参与了其他工厂的创建。\n\
  \n# 解释一下单例模式？\n\n单例模式是一种创建性模式，在应用程序内提供单一实例创建。JDK 类 `java.lang.Runtime` 基于单例模式。单例模式允许定义一个只有一个实例的类，并为该实例提供全局访问点。这意味着，类的责任是提供一种创建单一实例的机制，所有其他类都可以使用这个单一对象。\n\
  \n# 如何实现单例模式？\n\n创建单例模式的两种方式如下：\n\n### 早期实例化 (Early instantiation)\n在早期实例化中，实例将在加载时创建。以下代码表示如何实现早期实例化的单例设计模式：\n\
  \n```java\n{\n    EarlySingleton earlySingleton = new EarlySingleton();\n    EarlySingleton\
  \ {\n        return earlySingleton;\n    }\n}\n```\n\n### 懒性实例化 (Lazy instantiation)\n\
  在懒性初始化中，仅在需要时才创建实例。以下代码表示如何实现懒性实例化的单例设计模式：\n\n```java\n{\n    LazySingleton lazySingleton;\n\
  \    LazySingleton {\n        if lazySingleton = new LazySingleton();\n        return\
  \ lazySingleton;\n    }\n}\n```\n\n# 单例模式的局限性和缺点是什么？\n\n### 单例设计模式的局限性\n单例模式确保类只有一个实例，并为其提供全局访问点。这个单一实例变成了一个局限，因为应用程序中的大多数类可能需要创建多个实例。\n\
  \n### 单例设计模式的缺点\n- 该模式没有遵循单一职责原则，因为它控制了自己创建实例的逻辑以及如何管理对象的生命周期。\n- 由于它有一个共享的全局实例，它会停止对全局实例所访问的对象和资源的释放。\n\
  \n# 你能提供一些 JDK 中单例设计模式的实现示例吗？\n\n- `java.lang.Runtime` 的 `getRuntime()` 方法，它返回与当前\
  \ Java 应用程序的的对象。\n- `java.lang.System` 类的 `getSecurityManager()` 方法。该方法返回安全管理器。\n\
  - `java.awt.Desktop` 类的 `getDesktop()` 方法。该方法 `getDesktop()` 返回与当前桌面上下文相关的 `Desktop`\
  \ 实例。\n\n# 你能写线程安全的单例吗？我们为什么需要它？\n\n即使我们通过私有构造函数来实现单例模式，在某些情况下，多个线程也可以访问该类来创建对象。在这些情况下，即使实现了单例模式，也可能创建多个对象。为了控制这一点，我们可以创建一个同步或线程安全的单例对象。\n\
  \n有许多编写线程安全单例的方法如下：\n- 最直接的方法是使用 `enum` 创建线程安全的单例。\n- 通过双重检查锁定（double checked locking）来编写单例。\n\
  - 使用静态单例实例，它在类加载时初始化。\n\n你可以通过以下方式修改 `getInstance()` 方法使其线程安全：\n\n```java\npublic\
  \ static synchronized LazySingleton {\n    if lazySingleton = new LazySingleton();\n\
  \    return lazySingleton;\n}\n```\n\n# 我们可以创建单例对象的克隆吗？\n\n是的，可以创建单例对象的克隆。\n\n#\
  \ 将整个 getInstance 方法同步更好，还是只同步关键部分更好？你倾向于哪种？\n\n当整个方法同步时，锁将一直锁定直到整个方法执行完毕。因此同步 `getInstance()`\
  \ 方法的开销很大，而且它只在初始化单例实例以停止创建另一个单例实例时才需要。所以，最好倾向于同步部分而不是整个方法。\n\n# 你能列出标准 JDK 库中使用一些设计模式吗？\n\
  \n以下是 JDK 库中设计模式实现的一些示例：\n\n- **装饰器模式**：用于各种 Java IO 类。\n- **单例模式**：用于 `Calendar`\
  \ 类。\n- **工厂模式**：用于不可变类，例如 `Long.valueOf()` 方法。\n- **观察者模式**：用于 Swing 编程和许多事件监听框架。\n\
  \n# 什么是适配器模式？\n\n\n\n\n\n## 适配器模式 (Adapter Pattern)\n在适配器中，根据需求将一个类的接口转换为另一个接口。这意味着该模式允许开发者根据需求转换接口，同时通过其他不同的接口使用该类的服务。该模式也称为包装器（wrapper）。使用这种模式，我们可以创建一个混合对象，它可以在需要时同时使用两个接口的服务。\n\
  \n## 装饰器模式 (Decorator Pattern)\n解释一下装饰器模式。给出一些 JDK 中实现装饰器设计模式的示例。\n\n装饰器模式是最流行的设计模式之一。它便于在不改变代码的情况下改变现有对象的行为。这种模式创建了一个新类，称为装饰器类。该装饰器类在内部包装了原始类，并添加了额外的方法。显然，这保持了原始类不变，但同时，由于装饰器的存在，你也可以使用新功能。\n\
  \nJDK 的 `java.io` 包大量使用了这种模式。装饰器模式使用组合而非继承，在运行时扩展对象的功能。\n\n是装饰器模式的示例如下：\n- `java.io.InputStream`,\
  \ `java.io.OutputStream`, `java.io.Reader` 和 `java.io.Writer`\n- `java.io.BufferedReader`\n\
  - `java.io.BufferedWriter`\n- `java.util.Collections` 中的 `synchronizedXXX()`\n-\
  \ `java.util.Collections` 中的 `unmodifiableXXX()`\n\n## 模板方法模式 (Template Method Pattern)\n\
  在 Java 中何时使用模板方法设计模式？\n\n模板方法模式也是最流行的设计模式之一。模板方法写在父类中，声明了操作可以执行的结构和顺序。子类继承这个父类，并使用这个模板方法来严格遵循父类中声明的顺序。在该模式中，最重要的控制点之一是模板方法必须被声明为\
  \ `final`。这将确保子类无法重写此方法以更改算法实现的步骤或顺序。同时，某些单独的步骤可以是抽象的，以便子类可以以自己的方式实现它们。\n\n## 策略模式\
  \ vs 状态模式 (Strategy vs State Pattern)\n区分 Java 中的策略模式和状态设计模式？\n\n策略模式和状态设计模式具有相同的结构。两者的\
  \ UML 类图相同，但它们的意图非常不同。状态设计模式允许管理和定义对象的状态。而策略模式允许描述一组可交换的算法。\n\n## 代理模式 (Proxy Pattern)\n\
  什么是代理设计模式？\n\n代理设计模式是一种结构性模式。正如其名所示，它作为其他类的代理，反而访问其他类的功能。因此，客户端不是直接与对象通信，而是与代理对象通信，代理对象内部包装了实际对象以提供功能。\n\
  \n## 装饰器 vs 代理模式 (Decorator vs Proxy Pattern)\n解释装饰器模式和代理模式之间的区别。\n\n装饰器和代理设计模式都实现了它们所装饰或封装的对象的接口，这非常相似。但，装饰器模式用于在已经创建的对象上实现功能。而代理模式用于控制对对象的访问。\n\
  \n说明代理和适配器之间的区别？\n\n代理对象的输入与实际对象相同。然而，适配器对象的输入与实际对象不同。\n\n## 工厂模式 vs 抽象工厂 (Factory\
  \ vs Abstract Factory)\n解释工厂模式和抽象工厂之间的区别。\n\n抽象工厂模式创建一个工厂，而工厂模式创建对象。虽然两者都抽象了创建逻辑，但一个抽象了创建工厂的逻辑，另一个抽象了创建项的逻辑。\n\
  \n## 策略模式 (Strategy Pattern)\n在 Java 中何时使用策略设计模式？\n\n策略模式适用于实现一组相关的算法，例如压缩算法、过滤策略等。该模式允许创建上下文类，通过使用策略的实现来实现业务规则。`collections`\
  \ 和 `comparator` 的 `sort()` 方法具有排序策略，而 `comparator` 接口提供了比较对象的方法。由于策略的存在，`sort()`\
  \ 方法不需要修改。同时，人们可以通过重写 `comparator` 接口的 `compare()` 方法来定义比较策略。策略模式是开闭原则的良好示例。我们重写了\
  \ `comparator` 的方法。因此，它对实现是开放的，但不需要重写 `sort()` 方法，因为它没有改变。\n\n## 组合模式 (Composite\
  \ Pattern)\n说明 Java 中组合设计模式的优点？\n\n以下是组合设计模式的优点：\n- 组合模式允许客户端对一组对象进行集体操作，这些对象可能可能不表示相同的层次结构。\n\
  - 该模式提供了一种添加新类型组件的简单方法。\n- 该模式提供了结构的灵活性，将具有可管理的类或接口。\n\n解释组合模式的用途？在 Java 中何时使用组合设计模式？你之前在项目中使用它吗？\n\
  \n组合模式允许我们以相似的方式处理容器和对象。JDK 中组合模式最好的示例是 `JPanel` 类。`JPanel` 是一个既作为组件又作为容器的类。每当面板的显示需要修改时，就会调用它的\
  \ `paint()` 方法。`paint()` 方法内部会调用各个组件的 `paint()` 并允许它们自己绘制。\n\n当应用程序需要表示部分或完整的层次结构时，可以使用组合模式。当我们动态动态向单个对象添加职责而不影响其他对象时，也可以这种模式。\n\
  \n## 观察者模式 (Observer Pattern)\nJava 中的观察者模式是什么？在 Java 中何时使用观察者模式？\n\n观察者模式基于观察和通知的概念。我们的对象总是与应用的某些部分连接。而且，这些对象对它们连接的组件是否发生了变化感兴趣。在这种情况下我们可以使用观察者模式，当连接组件的状态发生变化时，会给对象通知。\n\
  \n能给出观察者模式的典型示例吗？\n\n观察者模式常见的实时示例是发布者-订阅者。假设你订阅了一个发布新闻更新的新频道。因此，新闻频道充当发布者，你充当订阅者。新闻频道发布的任何新更新都会到达你，因为你是订阅者。\n\
  \n## 构建者模式 (Builder Pattern)\nJava 中的构建者设计模式是什么？何时使用构建者设计模式？构建者模式解决了什么问题？说明构建者模式的优点。\n\
  \n构建者模式是一种创建性设计模式。当我们需要创建一个由不同过程产生的复杂对象时，该模式通过构建较简单的小对象来实现目标。\n\n构建者模式的优点：\n- 该模式提供了对构建过程的增强控制。\n\
  - 该模式促进了对象构建与其表示之间的清晰分离。\n- 在此模式中，对象始终在完整状态下被实例化。\n- 它有助于在对象构建过程中快速创建不可变对象。\n\n\n\
  \n\n\n# 何时构建过程允许被构建的对象具有不同的表示。\n\n该模式解决以下问题：\n\n当任何对象具有许多属性时。这些属性中的许多是可选的，或者它们可能处于不一致的状态。该模式通过提供一种分步构建对象的方法提供了解决方案。它提供了一个实际上返回最终对象的方法。\n\
  \n给出 JDK 中实现构建器设计模式的示例：\n\n- `java.lang.StringBuilder`\n- `java.lang.StringBuffer`\n\
  - `java.nio.ByteBuffer`\n- `java.nio.FloatBuffer`\n- `java.nio.IntBuffer`\n\n##\
  \ 什么是代理模式？它的作用是什么？代理的类型有哪些？代理模式的用例有哪些？\n\n代理（Proxy）意味着替身，一个代表其他对象的对象。代理模式提供了一个替代品，以控制对其他对象的访问。\n\
  \n根据 GOF（设计模式九），代理模式提供了对原始对象的访问控制。它通过隐藏原始对象的信息允许执行安全操作。它还允许按需加载对象。\n\n有不同类型的代理，如下所示：\n\
  \n- **保护代理 (Protection proxy)**：保护代理根据某些条件控制对原始对象的访问。\n- **缓存代理 (Caching proxies)**：缓存代理倾向于缓存对真实对象的昂贵调用以增强性能。这些缓存策略包括读穿（read-through）、写穿（write-through）、旁路（cache-aside）和基于时间（time-based）。\n\
  - **虚拟代理 (Virtual proxies)**：虚拟代理通过在实现中管理对象的生命周期来实例化昂贵的对象。它通过决定实例创建的需求以及何时复用来优化性能。\n\
  - **远程代理 (Remote proxies)**：远程代理用于分布式对象通信。远程代理调用本地对象方法来执行远程对象。\n- **智能代理 (Smart\
  \ proxies)**：智能代理用于实现日志记录调用和对对象的引用计数。\n\n代理模式可以用于想要提供以下服务的场景：\n\n- 懒性初始化\n- 日志记录实现\n\
  - 促进网络连接\n- 一种统计对象引用次数的方法\n\n## 解释责任链模式及其优点\n\n在责任链模式中，发送者将请求发送给一个对象链。然后，链中的任何一个对象都可以处理该请求。\n\
  \n责任链模式避免了请求发送者与请求接收者之间的耦合。让我们考虑一个 ATM 服务的例子。ATM 服务在货币交易中使用该模式。每个接收者都包含另一个接收者的引用。当一个对象无法处理请求时，它会将其发送给下一个接收者，并继续该。\n\
  \n以下是该模式的优点：\n\n- 该模式最小化了耦合。\n- 该模式在为对象分配职责时提供了灵活性。\n- 该模式允许一组类作为一个单元工作。通过组合（composition），其中一个类中产生的事件可以发送到其他处理程序类。\n\
  \n## 桥接模式与适配器模式有什么区别？\n\n桥接模式的设计用于将接口的实现与类隔离开。它允许在不更改客户端代码的情况下更改实现。\n\n另一方面，适配器模式允许消除两个类实现的需求，以便与不兼容的接口工作。\n\
  \n## 在什么场景可以使用适配器模式？\n\n当他/她需要让两个具有不兼容接口的类工作时，可以使用适配器模式。该模式可以用于封装第三方代码，使得你的应用程序仅依赖于适配器。当第三方代码发生变化或移动到第三方代码时，适配器可以调整自己。\n\
  \n## 解释依赖注入和服务定位器模式\n\n在依赖注入模式中，类感知不到依赖项的来源。服务定位器模式用于创建依赖项。类将不知道自己是否在使用定位器。定位器可以在从定位器获取请求时拦截请求。\n\
  \n## 依赖注入和服务定位器之间的区别：\n\n依赖注入比服务定位器更容易进行单元测试，因为我们可以传递它的 mock（模拟）实现。\n\n## 在依赖模式中何时使用\
  \ setter 注入和构造函数注入？\n\nsetter 注入用于提供对象的可选依赖，构造函数用于提供强制性依赖。\n\nSpring 框架提供了一个 IOC\
  \ 容器，它提供了使用 setter 方法或构造函数处理依赖的方法。\n\n## 什么是 MVC 模式？\n\n这是 J2EE 中最常用的设计模式之一。在 MVC\
  \ 中，M 代表模型（model），V 代表视图（view），C 代表控制器（controller）。\n\n模型是对象，用作应用程序中使用的所有对象的蓝图。\n\
  \n视图是数据的呈现方面，主要面向用户。\n\n控制器是控制点。控制器充当模型和视图之间的连接点。控制器接收传入的请求，然后可能将其转发到业务逻辑层或视图层。\n\
  \n## 解释拦截过滤器设计模式及其益处\n\n过滤器设计模式用于在处理请求之前之后拦截并操作响应。此类过滤器可以使用请求的身份验证和授权执行安全检查、记录请求、跟踪请求，并在记录或跟踪后将请求转发到相应的处理器。这些处理器可以是链中的另一个过滤器，也可以是控制器。\n\
  \n涉及的组件有过滤器、过滤器链、目标、过滤器管理器和客户端。\n\n过滤器是参与在请求处理器执行请求之前或之后执行特定任务的单元。过滤器链起着至关重要的作用。在某些情况下，单例控制器可能无法执行所需的任务，或者有时，多个任务被拆分为由不同过滤器执行的多个步骤。过滤器链包含多个过滤器，这些过滤器将按照定义的顺序在目标上执行。\n\
  \n目标是请求处理器。\n\n过滤器管理器管理过滤器和过滤器链。\n\n客户端是向目标对象发送请求的对象。\n\n\n\n\n\n## 数据访问实现\n\n数据访问实现或具体类：此类是\
  \ `DAO` 接口的实现。该类负责从数据源获取数据。该数据源可以是 XML 文件、某个数据库或任何其他存储机制。\n\n模型对象：模型对象是一个包含 getter\
  \ 和 setter 方法的 `POJO`，它允许使用 `DAO` 类存储从数据源检索的数据。\n\n## 前置控制器设计模式\n\n什么是前置控制器设计模式？你能给出一个置控制器的例子吗？\n\
  \n前置控制器设计模式提供了一种中心化的请求处理机制，所有的请求都由一个中心处理器进行处理。这个中心处理器可以用于身份验证、授权、日志记录和请求跟踪。一旦完成处理，前置控制器会将请求转发给相应的处理器。\n\
  \n以下是涉及前置控制器模式的实体：\n\n- **前置控制器 (Front controller)**：用于处理应用程序所有类型请求的单一处理器。\n- **分发器\
  \ (The dispatcher)**：前置控制器可以使用分发器对象，将请求分发给相应的特定处理器。\n- **视图 (The view)**：请求产生的对象。\n\
  \n## 构建器设计模式\n\n你会使用哪种设计模式来创建一个复杂对象？\n\n构建器设计模式最适合构建复杂对象。构建器模式旨在解决工厂模式和抽象工厂模式的问题。\n\
  \n## 空对象模式\n\n什么是空对象模式？\n\n空对象模式是一种设计模式，用空对象替换实例变量的 `NULL` 检查。与其对空值进行检查，空对象反映了“什么都不做”的关系。它也可以用于在数据不可用时提供默认行为。\n\
  \n## 开闭原则\n\n什么是开闭设计原则？\n\n开闭设计原则是 Robert C. Martin 在其最著名的书籍《清洁代码》中定义的 `SOLID` 原则之一。该原则指出，代码应该对扩展开放，但对修改关闭。一旦我们在编码开始阶段探索了多态的力量，我们就会发现可以提供该原则稳定性和灵活性的模式。状态模式和策略设计模式是该模式的关键示例之一，其中上下文类对修改关闭，而人们可以通过实现新的状态或策略来添加新功能。\n\
  \n## SOLID 设计原则\n\n什么是 SOLID 设计原则？你能给出一个 SOLID 设计原则的例子吗？\n\n`SOLID` 设计原则实际上是取取每个实际原则的首字母构成的缩写：\n\
  \n- 单一责任原则或 `SRP`\n- 开闭原则或 `OCD`\n- 利斯夫替换原则\n- 接口隔离原则\n- 依赖倒置原则\n\n## 总结\n\n在本章中，我们讨论了不同的设计模式及其在整体软件开发方法中的重要性。我们讨论了许多关于这些模式可能的问题，这将帮助你通过\
  \ `Java` 面试。虽然人们可能觉得对于 `Java` 来说设计模式可能并不重要，但这些知识无疑将成为你简历中的加分项。在下一章中，我们将进入 Web 世界并学习\
  \ Web 应用开发的基础。\n\n# 第 12 章：Web 基础\n\n### 引言\n\n多年来，开发者一直忙于开发独立应用程序。但是，独立应用程序对于用户和开发者来说一直是一个头疼的问题。关于软件是否让用户的工作变得更简单更可靠，这一点是不言置疑的。但开发者需要在安装、维护和更新独立应用程序上投入大量精力，这有时比开发应用程序本身还要多。这种方法在后期通过实现网络应用程序得到了一定的简化。在这种架构中，实际程序或软件安装在服务器上，网络中的客户端机器访问该服务器。虽然这种方法减少了工作，但它在系统连接距离和相互通信方面有自己的局限性。此外，纯网络应用程序在本质上是同质的，这意味着服务器应用程序和客户端应用程序必须使用通编程语言通信，这并不总是可行的。我们需要某种语言无关的方法，以便在不同应用程序之间共享数据。解决此问题的方案是\
  \ Web 技术。在 Web 技术中，应用程序位于 Web 容器内的服务器上，它可以使用 `HTTP` 等语言无关的协议与客户端通信。不同的编程语言开发了不同的\
  \ API 来处理 Web 架构。`Java` 使用 `Servlet` 和 `JSPs` 来开发此类应用程序。我们将在本章讨论它们。\n\n### 结构\n\n\
  理解 Web 技术可能比理解 `Spring` 和 `Hibernate` 等高级技术看起来简单。但如果你不知道 Web 编程的基础，那么面对基于 Web 技术的面试将会困难。\n\
  \n在本章中，我们将讨论 Web 应用开发的基础。我们将学习：\n\n- 不同的面试题及可能的答案\n- `Servlet` 和 `JSP` 的生命周期\n-\
  \ 读取和处理请求与响应\n- 会话管理\n\n### 目标\n\n在本章结束，你将能够回答各种基于 `Java` Web 技术的面试题。你还将学习如何使用 `Servlet`\
  \ 和 `JSP` 来处理请求和响应。\n\n## 企业级架构\n\n企业级架构有哪些类型？你工作过哪些架构？\n\n企业级应用可以通过实现不同的架构来构建，如：\n\
  \n- 单层架构\n- 二层架构\n- 三层架构\n- N 层架构\n\n### 单层架构\n\n单层架构适用于小型应用程序。它在单一的计算系统或平台中包含表示层、业务逻辑层和数据层。如\
  \ MP3 播放器、MS Office 等应用程序属于单层应用。\n\n### 二层架构\n\n这是开发企业级应用的传统方法。在二层架构中，数据层与其他两层分离。在这里，应用程序完全存在于本地机器上，而数据库则部署在独立的安全系统中。处理负载由客户端承担。然而，服务器处理应用程序与数据访问层之间的流量。由于数据是集中的，多个用户可以在同一时间访问它。\n\
  \n二层架构通常被称为客户端/服务器通信。客户端与服务器之间的通信通过提供 UI、业务逻辑和数据访问层的实现来实现。\n\n### 三层架构\n\n在三层架构中，我们有三个独立的层级，由位于第一层的表示层、第二层的业务逻辑组成，而数据层由第三层处理。由于表示层和业务逻辑相互分离，这增加了许多灵活性。对于一个取决于客户端需求的业务逻辑，也可以开发出多个表示层。\n\
  \n### N 层架构\n\n正如其名所示，N 层架构具有大量的层级，有助于开发者创建灵活且可重用的应用程序。它适用于开发企业级应用。该架构能够为扩展性、安全性、可重用性、容错性、互性和可维护性提供解决方案。\n\
  \n\n\n\n\n# 容器在 Java EE 中起什么角色？\n\n容器作为组件与支持该组件的底层、特定平台的功能之间的接口。它促进了应用的部署，并提供了管理和执行部署的应用组件的方法。\n\
  \n## 解释不同类型的容器\n\n以下是不同类型的容器：\n\n- **Web**: 它允许部署包含 `Servlet` 和 `JSP` 页及其所有组件的应用。所有的\
  \ Web 组件及其服务运行在 Web 容器上。\n- **应用程序客户端容器 (Application client container)**：应用程序客户端容器用于托管应用程序组件和客户端。正如名称所示，它运行在客户端计算机上。它能够开发健壮的\
  \ Java 应用，并支持访问数据源等 J2EE 资源。\n- **Applet 容器 (Applet container)**：applet 容器为 appletset\
  \ 模型提供支持。该容器是客户端机器上的 Java 插件和浏览器的混合。它使用沙箱安全模型防止 applet 访问系统资源以停止任何损坏。\n- **EJB 容器\
  \ (EJB containers)**：该容器用于部署 EJB 应用。它允许执行所有的企业豆（Beans）。这些也被称为应用程序容器。存在不同类型的 EJB\
  \ 容器，如 `Glassfish` 和 `JBOSS`。\n\n## 不同的应用开发和部署角色有哪些？\n\n部署应用及其管理是一个非常复杂的过程。许多人参与此过程并扮演不同的角色。这些角色根据\
  \ Java EE 规范定义。角色如下：\n\n- Java EE 产品提供者\n- 工具提供者\n- 应用程序组件提供者\n- 应用组装员 (Application\
  \ assemblers)\n- 应用部署者和管理员\n\n## 部署应用的过程是什么？\n\n部署是将应用及其所有组件安装到容器的过程。\n\n## 什么是协议？你用过哪些协议？\n\
  \n相互通信的双方所同意的一系列规则称为协议。\n\n例如，网络协议。网络协议建立了一套规则，决定了同一网络中不同设备之间传输数据的方式，无论它们的内部过程、结构或设计是否存在差异。\n\
  \n我们还有以下协议：\n- **通信**：`FTP`、`IP`、`Bluetooth`、`routing` 等\n- **安全**：加密协议、传输协议\n-\
  \ **网络管理**：连接协议、链路聚合协议\n- **网络**：`HTTP`、`SSH`、`SMS` 等\n\n## 你能解释不同的 Http 方法吗？\n\n\
  最常用的 HTTP 方法是 `GET` 和 `DELETE`，它们分别对应创建、读取、更新和删除操作。\n\n### GET\n`GET` 方法请求特定的资源。它主要用于检索数据。在这种情况下，客户端数据通过附加在\
  \ URL 后来发送到服务器。这种方法是安全的，因为人们可能会复制 URL 并在稍后重用。在由该方法生成的查询字符串中，最多只能发送 2047 个字符。\n\n\
  ### HEAD\n`HEAD` 方法请求服务器应用的某些响应。它与 `GET` 请求非常相似。然而，当我们使用 `HEAD` 方法时，服务器**不得**在响应中返回消息体。\n\
  \n### POST\n`POST` 方法用于向服务器上的指定资源提交数据。该方法会导致状态发生变化。这意味着它对服务器有副作用。来自客户端的数据通过请求体发送到服务器，使其非常安全。与\
  \ `GET` 方法不同，该方法对数据没有限制。\n\n### PUT\n`PUT` 方法用于用请求负载（payload）替换目标资源的所有当前表示。\n\n\
  ### DELETE\n`DELETE` 方法用于删除服务器上的指定资源。\n\n### OPTIONS\n`OPTIONS` 方法通过请求 URI 描述目标资源的通信选项。该方法有助于客户端确定与资源相关的选项或要求、服务器的能力，而无需暗示资源操作或启动资源检索。该方法的响应不能被客户端缓存。\n\
  \n### TRACE\n`TRACE` 方法专门用于诊断目的。它被用于调用指向目标资源路径上的远程应用层环回测试。\n\n### PATCH\n`PATCH`\
  \ 方法用于使用 URI 对资源进行部分更新。\n\n### CONNECT\n`CONNECT` 方法建立到由 URI 标识的服务器通道。\n\n## 什么是状态码？\n\
  \n当客户端向服务器发送请求时，服务器将响应返回给客户端。除了请求数据的实际内容外，服务器还会向客户端发布一个特定的数字。服务器响应客户端发发的这个特定数字称为状态。这些状态码分为五类。状态码的第一位定义了响应的类别。以下是状态码的不同类别：\n\
  \n- **1xx**：表示信息性响应。例如：已接收请求，继续处理。\n- **2xx**：表示任务成功。例如：已成功接收、接受并处理请求。\n- **3xx**：表示重定向正在进行。\n\
  - **4xx**：表示客户端错误。例如：请求包含错误语法或无法实现。\n- **5xx**：表示服务器错误。例如：服务器未能履行表面上有效的请求。\n\n##\
  \ 你能解释 Web 应用的组件吗？\n\nWeb 应用有三个主要组件：\n1. 视图层\n2. 业务逻辑层\n3. 数据访问层\n\n### 视图层或用户界面\n\
  视图层充当用户界面（UI 组件）。视图层可以认为是最重要的组件之一，因为它充当了系统用户与应用程序之间的桥梁。该组件仅负责数据的展示或接收用户数据的方法。它从不参与任何业务逻辑或数据库通信。然而，根据应用需求，它可以负责用户数据校验。\n\
  \n### 业务逻辑层\n业务逻辑层是应用最重要的层。该层的组件负责应用业务逻辑或算法来解决问题。它从不直接与数据库通信，但通常在从数据库检索的数据上进行操作。它从不决定如何展示数据，这个决定始终由\
  \ UI 负责。\n\n### 数据访问层\n数据访问层拥有与数据库或文件等持久化组件通信的代码。从一个数据库迁移到另一个是可能的。在这种情况下，如果该层编写得不当，就需要大量的重复工作。因此，开发者必须编写松耦合的类。\n\
  \n## 你能解释 MVC 1 和 MVC 2 架构吗？\n\n注意：面试官可能也想知道你是否熟悉 MVC 术语。\n\n`MVC` 是一种应用开发架构，将你的组件分为三类：\n\
  \n- **M – 模型 (Model)**\n- **V – 视图 (View)**\n- **C – 控制器 (Controller)**\n\n模型组件负责业务逻辑。这通常是纯\
  \ Java 代码。视图组件负责展示。通常是 `HTML` 或 `JSP` 代码。\n\n控制器控制应用的流。它通常将用户数据传输给模型，一旦模型生成响应，响应就会传输到视图以展示给终端用户。\n\
  \n\n\n\n\n## MVC1 和 MVC2\n\nMVC1 也称为单页请求-响应模式。在这种架构中，`JSP` 页面仅作为处理请求的唯一负责组件。所有的\
  \ HTTP 请求都映射到 `JSP` 页面。`JSP` 页面接收请求数据、对其进行处理，并生成带有呈现层的响应。因此，单个页面既充当控制器，又充当表现层。\n\
  \n另一方面，MVC2 引入了 `Servlet`，它接收请求并将将其委托给模型进行业务逻辑实现，而模型是纯粹的 Java 代码。模型生成数据/响应，然后将其传输到表现层。该表现层可以是\
  \ HTML、`JSP` 或任何可以生成呈现的模板（如 FreeMarker 等）。\n\n## 什么是 Servlet 及其用途？\n\n`Servlet`\
  \ 是一种 Java 程序，它作为 Web 应用程序的一部分托管或部署在服务器上。它扩展了服务器的功能，以便能够为请求生成响应。它提供了不同的方法，如 `doGet()`\
  \ 和 `doPost()`，来处理相应的请求。要创建一个 `Servlet`，你可以实现 `javax.servlet` 包中的 `Servlet` 接口，或者扩展\
  \ `javax.servlet.http` 包中的 `HttpServlet` 类。\n\n## 解释 Servlet 的生命周期\n\n`Servlet`\
  \ 由 `Servlet container` 管理。`Servlet` 的生命周期与普通对象的生命周期不同。它具有以下阶段：\n\n### Servlet 的加载和实例化\n\
  在此阶段，`Servlet` 被加载到内存中并由 `Servlet container` 实例化。为了实现这一点，容器使用 `Servlet` 的无参构造函数。\n\
  \n### Servlet 的初始化\n实例化后，使用 `init()` 方法对 `Servlet` 进行初始化。在此过程中，会生成 `ServletConfig`\
  \ 对象，该对象用于读取初始化参数。如果需要，你还可以通过重写此方法来初始化其他资源。这使得 `Servlet` 准备好处理请求。\n\n### 服务请求\n\
  在此阶段，`Servlet` 通过 `doGet()` 等方法生成 `HttpServletRequest` 和 `HttpServletResponse` 对象。这些方法在内部会调用\
  \ `service()` 方法，该方法负责处理来自客户端的不同请求。\n\n### 销毁 (Destroy)\n当 `Servlet` 完成服务客户端的任务时，容器会销毁\
  \ `Servlet` 实例。所有为该对象运行的线程都将被强制完成其任务，然后调用 `destroy()` 方法。你可以在此方法中释放与此 `Servlet`\
  \ 连接的所有资源。之后，`Servlet` 实例将符合垃圾收集条件。\n\n## 开发和配置基于 Servlet 的应用程序\n\n要开发基于 Servlet\
  \ 的应用程序，我们需要创建一个 `Servlet` 并对其进行配置，以便其他资源可以访问。\n\n### 创建 Servlet\n要创建一个 `Servlet`，你需要创建一个可以扩展\
  \ `HttpServlet` 或实现 `Servlet` 接口的类。推荐的做法是通过扩展 `HttpServlet` 并根据请求类型的需要重写 `doGet()`\
  \ 或 `doPost()` 方法。以下代码段显示了如何完成此任务：\n\n```java\nprotected void doGet(HttpServletRequest\
  \ req, HttpServletResponse res) throws ServletException, IOException {\n    //Reading\
  \ request parameters\n}\n```\n\n### 配置 Servlet\nServlet 可以通过使用 XML 文件（即部署描述符文件）或通过在\
  \ Servlet 类上应用注解来配置。\n\n#### 通过 XML 配置\n要为 `Servlet` 声明 URL 模式和其他初始化值，我们可以配置 Web\
  \ 部署描述符文件，即 `web.xml` 所示：\n\n#### 使用注解\n在 Servlet 3.0 API 中，我们可以对 `Servlet` 类使用注解而不是\
  \ XML 文件来定义 URL 模式：\n\n```java\n@WebServlet(\"/example\")\n{\n}\n```\n我们也可以为单个 servlet\
  \ 设置多个 URL 模式。\n\n## 请求处理\n\n### 如何读取请求参数？\n要读取请求参数，`HttpServletRequest` 对象提供了如下表所示的不同方法：\n\
  \n表 12.1: 读取请求参数\n\n### ServletRequest 的 getRequestDispatcher() 方法和 ServletContext\
  \ 的 getRequestDispatcher() 方法有什么区别？\n`getRequestDispatcher()` 用于将请求转发到方法提供的 `String`\
  \ 参数指定的位置。\n\n`ServletContext` 的 `getRequestDispatcher()` 只接受绝对路径作为参数。`ServletRequest`\
  \ 的 `getRequestDispatcher()` 同时接受绝对路径和相对路径作为参数。\n\n### 如何定义自定义 init() 方法？\n`HttpServlet`\
  \ 的 `init()` 方法在 servlet 处理第一个传入请求之前仅调用一次。正如名称所示，此方法用于初始化 `Servlet`。`init()` 方法可以使用\
  \ `super.init()` 方法保存 `ServletConfig` 实例。\n\n### 区分 GET 和 POST 方法？\n当在表单提交时使用 `GET`\
  \ 方法时，提交的表单参数将添加到 URL 中。此 URL 对所有人可见，任何人都可以使用这些值。这意味着 `GET` 不安全，不应使用它来传递用户名和密码类型的请求参数。此外，它对传输的数据量有上限。`GET`\
  \ 速度更快且更容易使用，可优于从服务器获取数据。\n\n`POST` 方法从请求体将参数传递到服务器，因此这些参数是不可见的。`POST` 是安全的，始终用于在客户端和服务器之间传递用户名和密码等数据。由于数据是从请求体传递的，因此传输量没有限制。\n\
  \n### 客户端如何向服务器发送信息？\n客户端可以使用请求参数向服务器发送信息。我们有两种方式向服务器发送请求参数：\n\n#### 表单提交\nHTML\
  \ `<form>` 标签用于收集客户端信息，并在提交表单时将信息发送到表单 `action` 属性映射的资源，如下：\n\n#### URL 重写\nURL\
  \ 重写用于在客户端和服务器之间传递数据，如下：当客户端点击链接时，请求将带有值发送到服务器\n\n### 属性（attribute）和参数（parameters）有什么区别？\n\
  在 Web 应用程序开发中，有时我们需要需要在组件（如 Servlet、JSP、过滤器）之间共享数据。\n\n请求参数是组件之间共享数据的一种方式，特别是从请求页面到请求目标。例如，从客户端向其他资源发送表单数据。除了请求参数，我们还有上下文参数和配置参数。\n\
  \n属性允许开发者以集合对象事件的形式在不同组件之间共享数据。然而，参数仅共享 `String` 类型的数据。\n\n属性可以在作用域（scope）中添加、更新甚至删除，但无法通过任何此类方法设置参数。只能通过表单提交或\
  \ URL 重写发送请求参数中的数据。\n\n\n\n\n\nHTTP 头部允许开发者在客户端和服务器之间交换一些额外信息。我们有两种类型的头部：请求头部和响应头部。头部使用键-值对的形式，并用冒号分隔。头部部分的结束由一个空字段头部表示。\n\
  \n从语境上来说，我们有以下四种类型的头部：\n\n- **通用头部（General headers）**：这类头部同时应用于请求和响应。\n- **请求头部（Request\
  \ headers）**：这种类型的头部包含关于客户端获取的请求的信息。\n- **响应头部（Response headers）**：这种类型的头部包含关于源位置的信息。\n\
  - **实体头部（Entity headers）**：这种类型的头部包含关于资源正体的信息，例如内容长度、MIME 类型等。\n\nHTTP 头部提供了有关请求上下文的信息，以便服务器利用这些信息生成适当的响应。请求头部的类型有：\n\
  \n- `From`\n- `Accept`\n- `Accept-Encoding`\n- `Accept-Language`\n- `Authorization`\n\
  - `Charge-To`\n- `If-Modified-Since`\n- `User-Agent`\n- `Referrer`\n- `Pragma`\n\
  \n我们可以使用头部来：\n\n- 通信认证信息、缓存信息。\n- 使用内容协商头部从服务器请求特定类型的响应。\n- 使用 cookie 处理会话（session）。\n\
  - 使用跨源共享（`CORS`）与第三方应用程序通信。\n\n## 什么是作用范围（scope）？作用范围的不同类型有哪些？\n\n作用范围是某个事物可以使用的生命周期。在\
  \ Web 应用中，作用范围用于解释一个属性可以被使用多久。以下是 Web 应用中提供的不同作用范围：\n\n- **请求作用范围（Request scope）**：请求范围在请求到达\
  \ servlet 时初始化，在 servlet 交付响应时结束。请求属性可以供参与处理请求的 Servlet 和 JSP 使用。\n- **会话作用范围（Session\
  \ scope）**：会话范围在客户端与 Web 应用建立通信时初始化。除非会话未被激活，否则会话范围会跨越多个请求和响应对。会话属性可以供参与服务客户端且属于同一个会话的\
  \ servlet 和 JSP 使用。\n- **上下文或应用作用范围（Context or application scope）**：上下文范围从应用程序启动开始。从属性添加到上下文中该刻起，请求属性对所有的请求和会话可用。该属性一直可用直到应用程序关闭或重载。\n\
  - **页面作用范围（Page scope）**：页面范围是一个非常特殊的范围，仅在 JSP 页面可用。页面范围被限制在从初始化到页面结束的同一页面内。隐式对象\
  \ `pageScope` 在 JSP 页面中表示页面范围。\n\n## 解释 ServletConfig 和 ServletContext 的区别\n\n`ServletContext`\
  \ 和 `ServletConfig` 实例用于通过初始参数或配置执行 Servlet 的初始化。\n\n`ServletContext` 实例由 servlet\
  \ 容器创建。该实例共享初始参数或配置信息给整个应用程序。这意味着所有的 servlet、JSP 和过滤器都可以使用存储在 `ServletContext` 实例中的数据。每个应用程序只创建一个\
  \ `ServletContext` 实例，所有的 Web 组件都使用同一个实例。可以如下所示配置上下文参数：\n\n我们可以如下所示获取公司名称：\n\n```\n\
  String company_name = getServletContext().getInitParameter(\"company_name\");\n\
  ```\n\nservlet 容器使用参数或配置信息创建 `ServletConfig` 实例。这些信息在初始化过程中传递给 servlet。`ServletConfig`\
  \ 实例特定特定的 Servlet。这意味着一个 `ServletConfig` 实例的信息不能被另一个实例使用。每个创建的 servlet 都会获得一个 `ServletConfig`\
  \ 实例。可以如下所示配置上下文参数：\n\n我们可以如下所示检索参数：\n\n```\nString servlet_name = getServletConfig();\n\
  ```\n\n## 什么是会话跟踪（session tracking）？会话跟踪的方法有哪些？为什么需要会话跟踪？什么时候使用会话跟踪？\n\n默认情况下，一旦请求被处理并将响应返回客户端，服务器就不会再记住该请求的任何细节。这意味着默认情况下应用程序无法在两个连续请求之间建立关系。换句话说，服务器是无状态的。会话跟踪是建立连续请求之间关系的过程。\n\
  \n会话跟踪的不同方法如下：\n\n- 隐藏表单字段（Hidden form field）\n- URL 重写（URL rewriting）\n- Cookie\
  \ 管理\n- Http session 处理\n\n## 在 Servlet 中如何与 HttpSession 对象配合工作？\n\n要实例化 `HttpSession`\
  \ 对象，我们需要调用返回当前会话的方法。如果当前会话不存在，则它将创建一个新的会话并返回它。\n\n`request.getSession()` 默认接受 `true`\
  \ 作为参数。因此，`request.getSession()` 和 `request.getSession(true)` 在内部是相同的。`request.getSession(true)`\
  \ 也会返回当前会话。如果当前会话不存在，则它将创建一个新会话并返回它。\n\n另一方面，`request.getSession(false)` 返回已存在的会话。如果会话不可用，它不会创建新会话并返回\
  \ null。\n\n这意味着从应用程序的角度来看，为了跟踪会话，开发者需要使用它。这将确保页面作为一个会话的一部分加载，并包含所有所需信息。\n\n## Servlet\
  \ 中的事件处理（event handling）是什么？\n\n事件表示用户动作的发生，它可能会改变某些对象的状态。没有人知道这个事件何时发生。因此，事件处理方法使用了回调机制。\n\
  \n事件类如下：\n\n- `ServletRequestEvent`\n- `ServletRequestAttributeEvent`\n- `ServletContextEvent`\n\
  - `ServletContextAttributeEvent`\n- `HttpSessionEvent`\n- `HttpSessionBindingEvent`\n\
  \n事件接口/监听器如下：\n\n- `ServletRequestListener`\n- `ServletRequestAttributeListener`\n\
  - `ServletContextListener`\n- `ServletContextAttributeListener`\n- `HttpSessionListener`\n\
  - `HttpSessionAttributeListener`\n- `HttpSessionBindingListener`\n- `HttpSessionActivationListener`\n\
  \n## 什么是 JSP？为什么要用 JSP？JSP 在 Web 中有什么用？\n\nJSP 是 JavaServer Pages 的缩写。它是一种服务器端编程技术，允许开发者创建动态、平台无关\
  \ Web 应用。对于每个 JSP，容器都会生成一个 servlet 类文件。\n\n在 JSP 中，既可以使用 HTML 标签也可以使用 Java 代码。为了使用\
  \ Java 代码，可以在 JSP 中使用不同标签：\n\n该标签用于将 Java 源码嵌入 HTML 页面。JSP 包含使用 HTML 标签加上 Java 代码的脚本段（scriptlet）。它的语法如下：\n\
  \n```jsp\n<% Java 源码 %>\n```\n\n表达式标签用于将代码写入输出流，其语法为：\n\n```jsp\n<%= 显示内容的语句 %>\n\
  ```\n\n指令标签用于向 Web 容器提供关于如何翻译 JSP 的信息。我们有以下三种指令标签：\n\n- `page` 指令\n- `include` 指令\n\
  - `taglib` 指令\n\n该标签用于声明数据成员和方法。使用声明标签编写的代码放置在自动生成的 servlet 的 `service()` 方法之外。\n\
  \n## JSP 的优点有哪些？\n\nServlet 写在 `.java` 文件中。在 servlet 中编写带有复杂设计的 HTML 代码是非常困难的。以下是\
  \ JSP 的优点：\n\n\n\n\n\nJSP 是扩展的 servlet，因此所有 servlet 的功能均可用。除了 servlet 的功能外，JSP 还具有隐式对象，并且它们支持\
  \ `JSTL` 标签、自定义标签和 `Els`。\n\n使用 JSP 进行开发速度更快。它不需要重新编译，因此在更改更改后需要重新部署应用程序。\n\nJSP\
  \ 易于维护。\n\n由于 JSP 支持许多预定义的标签、隐式对象、`JSTL` 标签和 `EL` 函数，开发者需要编写的代码相对较少。\n\n## 解释 JSP\
  \ 的生命周期？\n\n每个 JSP 遵循以下阶段：\n\n1. 容器将每个 JSP 翻译成一个 servlet 类。\n2. 容器编译转换后的 servlet\
  \ 并生成 `.class` 文件。\n3. `Classloader` 加载生成的生成的类文件。\n4. 容器使用构造函数实例化 servlet 类对象。\n\
  5. 实例化之后，容器调用 `jspInit()` 方法来执行资源的初始化。\n6. 为了为客户端提供服务，容器会调用 `jspService()` 方法。\n\
  7. 当应用程序关闭时，容器调用 `jspDestroy()` 方法执行清理工作。\n\n## JSP 中的隐式对象是什么？\n\n隐式对象是某些类型的预定义对象，由容器自动创建。这些对象在\
  \ JSP 的翻译阶段被创建。我们可以直接在脚本段中使用这些隐式对象。\n\n我们在 JSP 中使用的隐式对象包含以下内容：\n\n- 这是一个 `javax.servlet.jsp.jspWriter`\
  \ 类的对象，它允许将数据写入缓冲区并将响应中的输出发送给客户端。\n- 此对象是 ... 的实例。它用于获取表单参数、头部信息等信息。我们可以使用 `request.getParameter()`\
  \ 来获取请求参数。\n- 此对象是 `javax.servlet.http.HttpServletResponse` 的实例，可将响应发送到客户端。此隐式对象可以设置内容类型、向响应中添加\
  \ cookie 以及将响应重定向到其他资源。\n- 此对象是 ... 的实例。它由容器为每个 JSP 创建。它被用于检索在 ... 中配置的初始化参数。\n\
  - 此对象是 ... 的实例，用于检索 JSP 中的上下文信息。容器在应用程序部署时会创建一个单一的应用对象。\n- 此对象是 `HttpSession` 的实例。session\
  \ 对象用于获取、设置和删除会话范围内的属性。它还提供了关于会话实例的信息。\n- 此对象是 ... 类型。用于获取、设置和删除页面范围内的属性。\n- `page`\
  \ 代表当前 JSP 页面的对象。\n- 此对象是 `Throwable` 类的实例。这有助于在 JSP 中的异常处理。异常对象在创建错误页面中起着重要作用。\n\
  \n## 什么是动作标签（action tag）？如何使用它？\n\n动作标签用于从 JSP 执行某些操作。这些操作包括在页面之间的控制权转移、设置或获取实例的属性（包括从一个页面到另一个页面）等。我们有以下标准动作标签：\n\
  \n- `<jsp:bean>`：允许在 JSP 中使用 JavaBeans。该标签要么创建某个类型的新实例，要么从指定的范围内定位某些实例。其语法如下：`<jsp:bean\
  \ bean=\"...\" class=\"...\" scope=\"...\" var=\"...\" />`。`scope` 的值可以是 `page`、`request`、`session`\
  \ 或 `application`。`scope` 的默认值为 `page`。\n- `<jsp:include>`：该标签用于在页面的请求处理阶段包含另一个资源或文件。它提供了一种简单的重用页面的方法，例如页眉或页脚页面创建一次并在需要时添加。\n\
  - `<jsp:forward>`：前进标签用于在页面之间导航。当前页面的操作被终止，请求被转发到指定的资源。该资源可以是任何其他静态页面、JSP 甚至是 servlet。使用前进动作的语法如下：`<jsp:forward\
  \ page=\"...\" />`。\n- `<jsp:import>`：该标签用于将另一个 Java 组件嵌入页面。该标签确定浏览器类型，然后根据需要插入对象或嵌入内容。标签的语法如下：`<jsp:import\
  \ import=\"...\" prefix=\"...\" />`。\n- `<jsp:out>`：用于 JSP 中的文本模板。它的主体不能包含任何其他元素；它只包含文本或\
  \ `EL` 表达式。其语法如下：`<jsp:out value=\"...\" />`。\n- `<jsp:plugin>`：该标签是 plugin 标签的子对象。它必须包含一个或多个提供额外参数的动作。标签的语法如下：`<jsp:plugin\
  \ code=\"...\" type=\"...\" />`。\n- `<jsp:param>`：该标签用于定义用于生成动态元素体的 XML。标签的语法如下：`<jsp:param\
  \ name=\"...\" value=\"...\" />`。\n- `<jsp:attribute>`：该标签用于定义将动态生成的 XML 属性。其语法为：`<jsp:attribute\
  \ name=\"...\" value=\"...\" />`。\n\n## 包含指令（include directive）和包含标准动作（include standard\
  \ action）有什么区别？\n\n包含指令和包含标准动作都用于将一个文件包含到另一个文件中，其区别如下：\n\n- 包含指令在翻译时包含文件；而包含标准动作在运行时包含文件。\n\
  - 当被包含的文件发生更改但包含该更改页面的 JSP 未更改时，只有当开发者使用了更改后的页面时，更改才会生效。这两种方法使用不同的语法：\n- 包含指令使用：`<%@include\
  \ file=\"filename\"%>`\n- 以及 包含动作使用：`<jsp:include page=\"filename\"/>`。\n\n\n\n\n\
  \n在 Web 开发中，有时请求需要进行预处理或后处理。Servlet 充当控制器，接收请求数据并将其转发给模型以进行进一步的业务逻辑。过滤器（Filters）是允许对请求进行预处理或后处理的\
  \ Web 组件。过滤器用于日志记录、执行某些转换、文件压缩、数据加密或解密，或执行输入数据校验。\n\n开发一个过滤器，我们需要遵循以下步骤：\n\n1. 编写实现\
  \ `Filter` 接口的类。\n2. 重写 `doFilter()` 和 `destroy()` 方法。\n3. `doFilter()` 方法包含对请求数据预处理或后处理的逻辑。一旦预处理或后处理完成，请求就可以被转发到过滤器链中的下一个过滤器或\
  \ Servlet。`FilterChain` 的 `doFilter()` 方法将控制权委托给链中的下一个组件。`chain.doFilter()` 之前的代码用于预处理，而\
  \ `chain.doFilter()` 之后的代码用于请求的后处理。\n\n现在，在 web.xml 中映射过滤器所示所示：\n\n## 总结\n在本章中，我们讨论了\
  \ Java 中的 Web 技术。我们从 Web 技术所需的内容以及它如何比独立应用程序更好开始讨论。我们讨论了面试过程中可能提出的各种面试问题。在讨论这些问题时，我们学习了\
  \ Servlet 和 JSP 的许多组件。当然，Web 技术只是 J2EE 的一小部分；还有像 Spring 和 Hibernate 等其他技术，我们将在本书的后期阶段讨论。在下一章中，我们将讨论最热门的框架之一\
  \ Spring。大家准备好灵活应变吧，我们下章见。\n\n# 第 13 章：Spring 和 Spring Boot\n\n### 引言\n应用程序开发正变得日益复杂。客户的期望在提高，业务场景也变得越来越具有挑战性。除了编写业务逻辑外，开发者还需要考虑应用程序的其他维度，如应用程序数据流和其他跨交叉关注点。在满足所有需求的同时，开发者还必须确保他/她能够在给定的时间范围内交付软件。传统上，开发者完全负责开发所有耗时的内容，而且难以维护软件。因此，为了让开发变得简单一些，引入了框架。框架是半完成的应用，带有一些现代码或配置，开发者可以根据需要对其进行自定义以创建定制的应用程序。\n\
  \n不同的任务有不同的框架。Spring 框架就是此类框架之一，它以依赖注入和 IoC 技术等概念而闻名。在本章中，我们将介绍所有基于 Spring 和 Spring\
  \ Boot 框架可能提出的常见问题。\n\nSpring 框架是行业中需求最大的框架之一。通常，如果你的目标是金融机构，因为其高性能，Spring 是最受青的框架。Spring\
  \ 框架始终是面试官的“甜点”。当他/她在你的简历中看到“Spring Framework”时，你完全能看到面试官的眼睛闪放光。\n\n### 结构\n本章将通过讨论不同的面试问题，逐步从\
  \ Spring 框架的不同概念过渡到 Spring Boot。在本章中你将学习以下概念：\n* Spring 框架\n* Spring 模块\n* Spring\
  \ 中的 DI 和 IoC\n* Spring bean 的不同配置\n* Spring Boot 配置\n\n### 目标\n在本章结束时，你能够学习 Spring\
  \ 框架和 Spring Boot。你也将能够回答基于该框架的各种面试问题，这些问题现在已成为面试过程中不可或缺的一部分。\n\n#### 请介绍一下 Spring\
  \ 框架吗？\nSpring 是一个轻量级框架，由一些模块组成，使开发者能够快速开发控制台以及 Web 应用程序。\n\n#### 我们看到很多博客、书籍或参考声称\
  \ Spring 框架让开发变得简单。你能解释一下是怎么做的吗？\n以下是 Spring 框架实现的的主要特性，用于实现快速或简单的应用程序开发：\n* Spring\
  \ 开发专注于开发解耦的代码。\n* **易于配置**：Spring 提供了基于 XML 和基于注解的配置。这两种方式都是易用且自俗易懂的。\n* **关注开发**：开发者的主要关注点是通过某些业务逻辑、算法等为问题提供解决方案。但实际上，很多时候在开发\
  \ Java 企业级应用时，开发者需要考虑并编写配置、日志以及逻辑代码。这些配置、日志记录是耗时且重复的。框架管理 bean，为开发者提供 AOP，让他们能够关注应用程序的逻辑方面。\n\
  * **减少水管代码（plumbing code）**。\n* **减少样板代码（boiler-plated code）**：在开发过程中，开发者必须反复编写相似的代码，这被称为样板代码。Spring\
  \ 提供了模板（如 `RestTemplate` 组件）来消除样板代码。\n\n#### 你说的样板代码（boiler-plated code）是什么意思？\n\
  在开发过程中，在许多情况下，我们需要反复编写相似的代码，并且无法轻易摆脱。让我们以从表中获取数据为例。我们知道 `ResultSet` 是对象的集合，但我们无法直接获得一个对象或对象列表。当我们获取时，需要编写代码将\
  \ `ResultSet` 中的每一行转换为对象。然而，从 `ResultSet` 获取 `Employee` 对象的方法与从某处获取 `Book` 对象的方法是相似的。在这个过程中唯一的区别是每个对象具有不同的数据成员或数据类型。因此，这种代码被视为样板代码。\n\
  \n#### 你能提供一些样板代码的示例吗？\n是的！正如我提到的，JDBC 代码是样板代码的最好示例。此外，当我们处理异常、事务管理和日志记录时，需要编写样板代码。\n\
  \n#### 你用过哪些 Spring 模块？\n（这个问题是为了了解你对框架的熟悉程度以及你有多少实践经验。这个问题的答案将决定你的 Spring 框架学习历程。因此，请诚实回答。你可能对某些模块没有实战经验，这没关系。Spring\
  \ 非常庞大，无法涵盖一切。如果你假装在没有工作过的模块上很有经验，将很难逃脱。所以，请诚实。在这里我提供一个理想答案。某些模块你可能没有工作过。所以，请根据经验选择模块。现在问题是：“如果我自己在练习\
  \ Spring，我该怎么办？”在这种情况下，你可以提到你了解的模块，然后告诉他们你使用过的模块。）\n\nSpring 提供了如图所示的约 20 个模块，支持不同的功能：\n\
  \n### 核心容器\n核心容器由 `spring-context` 和 Spring 表达式模块组成。依赖注入和 IoC 等功能由 `spring-core`\
  \ 和 `spring-beans` 模块支持。`spring-context` 模块提供了从容器访问对象的方法。`spring-expression` 模块提供了查询和操作对象图的方法。\n\
  \n### Spring AOP 和仪器化\n\n\n\n\n\n> `Spring AOP` 模块支持面向切面编程方法的集成。通过使用 `AOP`，可以将交叉关注点集成到应用程序中。\n\
  \n> `Spring Aspects` 模块提供了在应用程序中集成 `AspectJ`get。\n\n> 数据访问或集成模块。\n\n> 可以 `data-access`\
  \ 模块集成 `JDBC`、`ORM`、`JMS`、`OXM` 和 `Transaction` 模块。\n\n> `Spring-Jdbc` 模块支持 `JDBC`\
  \ 的集成。\n\n> `Spring ORM` 提供对对象关系映射 (`ORM`) 集成的支持。\n\n> `Spring-TX` 模块支持程序化和声明式的事务管理。\n\
  \n> `JAXB`、`Castor`、`XStream` 提供了对象/XML 映射。`Spring-OXM` 支持这些映射的集成。\n\n> `Spring-JMS`\
  \ 模块在 Spring `4.1` 版本中添加。该模块提供了生产和消费消息的功能。\n\n### 消息传递\n\n> `Spring-Messaging` 模块已包含在\
  \ Spring `4` 中。该模块提供了在消息传递应用程序中集成 `MessageHandler` 的支持。\n\n### Web\n\n> `Web Module`\
  \ 层由 `Spring-Web MVC`、`Spring-WebSocket` 组成。\n\n> `Spring-Web` 模块支持面向 Web 的开发。\n\
  \n> `Spring-Web MVC` 支持为 `Spring MVC` 和基于 REST 的 Web 服务开发应用程序。\n\n### 测试\n\n> `Spring-Test`\
  \ 模块提供了使用 `JUnit` 或 `TestNG` 在应用程序中集成单元测试和集成测试的支持。\n\n### 什么是 Spring DI？\n\n> Spring\
  \ 使用依赖注入来管理 `bean` 的依赖关系。\n\n### 请解释依赖注入\n\n> 依赖注入是一个由容器将数据成员的值推送到对象的过程。\n\n\n\n\
  \n文件的位置取决于开发者的选择。在实例化容器时，我们需要从相关位置加载配置文件。如果文件在类路径（classpath）中或相对于类路径，我们可以使用 `ClassPathXmlApplicationContext`；如果文件与类路径无关，可以使用。\n\
  \n## 我们可以使用多个配置文件吗？是否可以在单个应用中将 bean 分配在多个配置文件？\n\n是的，我们可以使用多个配置文件来配置 bean。这些文件可以在\
  \ Spring 容器初始化时加载。\n\n## 哪些方法可以获取多个 bean 配置文件的容器实例化？在创建容器时如何加载多个 bean 配置文件？\n\n\
  以下是在 Spring 框架中从多个配置文件加载 bean 的不同方法。\n\n我们可以使用 `ClassPathXmlApplicationContext`\
