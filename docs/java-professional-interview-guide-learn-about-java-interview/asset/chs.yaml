  \ 注解代表什么？\n\n\n- 为什么要使用 `@Scope` 注解？\n\n\n- 解释 Spring MVC 框架\n\n\n- 在处理 Spring MVC\
  \ 框架时，你用过哪些注解？\n\n\n- 你刚刚提到请求映射（request mapping）位于 `WEB-INF/ servlet_name-servlet.xml`\
  \ 文件。这个位置是固定的吗？我们可以更改文件的位置或名称吗？\n\n\n- `1` 是做什么的？\n\n\n- 你过消息资源包（message resource\
  \ bundle）吗？它的用途是什么？\n\n\n- 什么是 `AOP`？\n\n\n- 解释 `AOP` 的概念\n\n\n- 以哪些方式可以织入（weaving）？Spring\
  \ `AOP` 支持哪些类型的织入？\n\n\n- 解释你用过的切点设计符（pointcut designators），或者解释你知道的切点设计符\n\n\n\
  - 你过 `Spring Boot` 吗？解释 `Spring Boot`。什么是 `Spring boot`？\n\n\n- 你过 Spring Boot 项目吗？用过哪些\
  \ starters？\n\n\n- 你创建 REST 应用时用过哪些注解？\n\n\n- 哪些是映射处理方法的注解？\n\n\n- 你如何从请求中读取输入？你用过哪些注解来读取请求输入？\n\
  \n\n- 你过 `Spring Boot` 的内部数据库吗？\n\n\n- `RestTemplate` 的作用是什么？如何使用 `RestTemplate`？\n\
  \n\n- 如何在应用程序中提供 `HATEAOS` 支持？\n\n\n## 结论\n\n\n### 简介\n### 结构\n\n- 什么是 `ORM`？\n\n\
  \n- `ORM` 的特性有哪些？`ORM` 如何帮助开发者？\n\n\n- 解释 `Hibernate` 的架构？\n\n\n- 解释你在 `Hibernate`\
  \ 中用过的接口或核心组件\n\n\n- 在 `Hibernate` 中维护配置需要哪些文件？\n\n\n- 如何获取 `SessionFactory`？\n\n\
  \n- 可以在应用程序中使用 `Hibernate` 与两个不同的数据库通信吗？如何在 `Hibernate` 中创建两个 session factory？\n\
  \n\n- `Session` 是线程安全的对象吗？\n\n\n- 如何将类映射到表？解释将实体映射到表中某行的注解。\n\n\n- `@NaturalId`\
  \ 是做什么的？\n\n\n- 是否可以停止数据成员被持久化，或忽略保存到数据库的字段？\n\n\n- 解释 `Session` 接口中 `persist()`\
  \ 和 `save()` 的区别。\n\n\n- 下面代码的输出是什么？\n\n\n- 你知道生成器类（generator classes）吗？用过多少种生成器类？请解释\
  \ `Hibernate` 中的生成器类\n\n\n- `hibernate.dialect` 是做什么的？\n\n\n- 如何映射层级表（Table Per\
  \ Hierarchy）、具体类表（Table Per Concrete Class）和子类表（Table Per Subclass）？\n\n\n- `Hibernate`\
  \ 中可用哪些关联模型？\n\n\n- 你能解释什么是多对多关联以及如何通过实时示例配置它？\n\n\n- 实体的一个属性需要通过某些表达式计算。如何使用 `Hibernate`\
  \ 映射这样的属性？\n\n\n- 什么是级联（cascading）？`CASCADE.ALL` 代表什么？你用过哪些级联选项？\n\n\n- 如何使用 `Hibernate`\
  \ 框架将枚举映射到数据库？\n\n\n- 什么是 `HQL`？\n\n\n- 解释 `HQL` 的缺点。\n\n\n\n\n\n本书特别关注如何通过技术面试。在整本书中，我们将讨论不同概念的不同问题。但这一章的内容超出了这些范围。在本章中，我们将讨论如何在面试中更好地展现自己。我所说的“展现”，并不是教你该穿什么或不该穿什么，而是将分享我关于如何在面试中成功的各种心理方面的知识。让我重申一下，技术知识是首要任务。你不会在心理诊所工作，而是在开发公司工作。但是，如果你了解面试官的心态，并且知道自己在面试期间应该持什么样的心态，你将增加被选中的机会。\n\
  \n\n学习技术始终很重要，但在之前，你还必须为行为技能做好准备。你应该知道如何介绍自己、如何准备自己，以及如何建立以自信参加面试的心态。面试过程在你真正出现在面试官面前很久就开始了。你准备得越充分，获得你心仪工作的机会就越大。在本章中，我们将讨论面试的这些非技术方面的内容。\n\
  \n\n在本章结束时，你将了解如何从非技术角度准备面试。我们将讨论集中在以下内容上：\n\n* Java 职业机会\n* 选拔流程：流水线\n* 如何选择你的职业或角色\n\
  * 如何练习面试\n* 你应该避免的常见面试错误\n* 面试官通常会做的分析\n让我们开始这段迷人的旅程吧。\n\n## 招聘类型\n作为求职者，了解公司从何处进行招聘也是重要的。你会在学院或大学内部获得工作吗？还是在毕业后获得工作？通常有两种类型的招聘。\n\
  \n### 校园招聘\n这是被组织选中的最简单的方法。通常，公司代表会在你处于毕业最后一年时访问一些优秀的大学并进行面试。此类面试通常基于你的能力以及对 `C`、`C++`\
  \ 编程技能的了解。要在校园招聘中被选中，你需要在课程中保持良好的记录，并在能力测试和技术测试中表现优异，随后将是个人面试。\n\n### 校外招聘\n如果你没有通过校园招聘被选中，这并不是世界末日。你仍然可以通过校外招聘流程获得另一个选择机会。在这里，公司会在报纸或招聘门户网站（如等）或有时在它们自己的网站上发布广告。你可以根据公司的规定进行申请，然后会被叫面试。有时，还会有现场投递（walk-ins），你可以看到成千上万的求职者在队列中等待自己的机会。校外招聘也会有与校园面试类似的轮次，但通常观察到，校外招聘在技术上比校园面试更困难。\n\
  \n## Java 职业机会\nIT 世界是巨大的。我们从外部看到的只是冰山一角。如果我们需要讨论 IT 领域中不同的职业机会，那么可能需要专门写写博客或一本书来彻底涵盖它。在本章中，我们将仅关注与\
  \ `Java` 技术对齐的职位。以下是如果你成为 `Java` 开发者可以预期的不同职位。\n\n### Java 全栈开发人员\n这可能是你现在在 IT 行业中遇到的最具挑战性的职位之一。全栈开发人员不仅开发应用程序，还会设计\
  \ UI 并对其进行测试。因此，你应该具备编程、UI 设计（如 `HTML`、`CSS`、`jQuery`、`Bootstrap`、`Angular` 或 `React\
  \ JS`）以及测试的知识来申请这一职位。\n\n### Java Web 开发者\n要成为一名 Java Web 开发者，你应该了解 Web 应用程序的整体架构。你的工作大部分将为\
  \ UI 生成的请求生成响应。你必须具备一些 `HTML` 知识，并且还应该了解 `servlet` 和 `JSP`。虽然 Web 技术已经进化到了 `servlet`\
  \ 和 `JSP` 之外，除非你了解这两个技术，否则你会发现学习其他技术时处于很尴尬的。\n\n### Java 移动应用开发者\n这是目前增长最快的领域之一。当你谈起任何业务，会立刻想到该业务的\
  \ App。移动应用程序开发有不同的框架。但对于 `Java` 而言，如果你想把应用开发者作为你的职业，你应该学习 `Android`。\n\n### Java\
  \ EE 开发者\n企业级开发者负责大型应用开发。与普通的 Web 应用程序不同，这些应用程序具有日志、消息、Web 服务等许多功能。这些应用程序可能是 Web\
  \ 应用程序或普通应用程序，但它们需要更高的可扩展性、可维护性和活性。构成此类应用程序的技术有 `EJB`、`Spring`、`Hibernate`、`REST`\
  \ 等。\n\n### Java API 开发者\n`REST` 的进化确实改变了应用程序的创建方式。应用程序开发者不再创建一切，可以使用 API 开发者创建的服务。作为\
  \ API 开发者，你可以创建一个 API 来更新数据库、响应请求、消费数据等。作为 API 开发的主要技术是 `Spring Boot`。\n\n## 选拔流程：流水线\n\
  IT 公司的选拔过程始终是一个艰难的过程。你需要经过许多轮次才能被选中。利益相关者显然希望让正确的人做正确的工作。在选拔过程中，你将遇到以下轮次。\n\n###\
  \ 电话面试\n“早上好！！我是 Google 公司的 Stella，请问是 George 吗？”如果你申请了 Google 公司的职位，在工作日的清晨你可能会听到这种话。\n\
  \n\n\n电话面试对面试者来说非常方便，因为它让你了可以在任何地方参加通话的灵活性。你唯一需要确保的是你选择的地方必须没有任何干扰，并且不应该有网络问题。电话面试与面对面试几乎相似；唯一的区别在于你物理上没有坐在面试小组面前。但这并不意味着虚拟的对面没有面试小组。有时，你可能会预计项目经理会拨打电话给你进行面试，而在过程中，还有其他人也参与了通话。现在是技术时代。所以，要足够明智地使用各种可用工具，如\
  \ `Skype`、`Zoom` 或 `GoToMeeting`，这些工具现在是进行面试的首选方式，而不是电话会议。\n\n\n如果你通过了电话筛选，下一轮面试将是技术测试。技术测试通常有两种类型：\n\
  \n-   基于算法的测试\n\n并不总是同时进行这两项测试。大多数情况下，当你申请校园招聘时（即从你的学院或大学申请时），会进行 `MCQ` 测试。因此，当公司在审视成千上万的候选人时，他们希望绝对确保只有合格的候选人才能获得参加面试的机会。这说明进行面试的高级人员不会浪费他们宝贵的时间去面试不符合标准的候选人。最终，这些资深人员是项目中的关键人物，他们需要将时间投入到更有生产力的工作中。\n\
  通常，一个 `MCQ` 测试分为两个部分：能力测试和技术测试。能力测试部分基于数学技能。技术部分将包含基于 `C`、`C++`、`SQL` 的问题，有时甚至包括\
  \ `Java`。我们在这本书中的重点不是 `C` 和 `C++`，我们将更多地关注于关于 `Java` 的面试题。由于这一轮是获得个人或面对面面试的筛选标准之一，因此最好练习这些测试。但请记住，能力不是一蹴而就的成功；你需要与它共处。你需要将其作为日常练习，以成为解决这些问题的专家。学生经常会问我，如果我是一个程序员，能力测试的意义是什么？为什么当我申请\
  \ `Java` 程序员职位时，不了解 `Java` 就不是唯一被检查的能力吗？这仅仅是公司为了减少实际面试的人数而进行的淘汰过程吗？如果你从地面以上 15,000\
  \ 英尺的高度观察这一点，你可能是正确的，但现实情况是你的能力技能与你解决问题的能力挂钩。这反映了你的大脑对日常生活中不同业务场景的反应有多快。\n\n解决技术\
  \ `MCQ` 会稍微简单一点，因为它基于你已经做了多年的东西。毕竟，你投入了毕业几年的时间来学习编程语言。这应该是你的主场，你可以在那里畅畅地得分。尽管如此，有时通过代码设计问题解决方案以及解决\
  \ `MCQ` 可能是不同的视角，因此你阅读的概念越多，练习的程序越多，你就越处于更好的位置来解决此类 `MCQ`。\n## 面对面试\n\n“恭喜！！你已经通过了技术测试，我们很高兴邀请你参加\
  \ IST 的面对面 (F2F) 面试。”如果你收到雇主的这封邮件，你应该为自己感到自豪。有时，技术测试和面对面面试会在同一天进行。在午休前的上午时段，你可能需要参加技术测试，随后在午后，你可能会获得在面试小组面前参加\
  \ F2F 轮的机会。\nF2F 是你选拔中最困难的方面。你不仅会被技术知识受到审视，还会有一些与你的行为技能相关的问题。大多数时候，面试将由一个小组进行，该小组由技术评估员和一些\
  \ HR 代表组成。技术人员可能是你未来的经理，你将与他一起工作。他将测试你在技术上有多优秀，以能够参与他领导下即将开展或正在进行的项目。而 HR 人员将监控你的行为技能，其中包括你的沟通能力。\n\
  \n尽管 HR 的观点很重要，但确保你满意地回答技术经理的问题会更重要。归结底，在考虑录取或拒绝时，他的/她的决定将得到更多考虑。他/她是负责项目成功交付的人员，他/她有全权选择合适的人来有效地完成工作。在整本书中，你将遇到技术面试中可能问到的各种问题。了解这一轮会问什么类型的问题是非常重要的。当然，这方面没有任何通用的规则。但根据我的经验，我想对此增加一点自己的浅见。一种可能性是，面试将基于你技术测试的表现开始。如果你刚刚通过的技术测试是关于某些算法实现的，那么面试官将会有兴趣了解相关的逻辑。有时，面试官会要求你现场更改算法，以检查你的灵活性以及你多快能接受挑战。记住，在这一点上，你是否完成了整个算法并不重要，更重要的是你解决问题的方法。面试官始终是技术大师，即使你只爬上了梯子的前几阶，他们也会知道你使用相同的方法能多快、多有效地到达顶层。所以，不要担心最终结果，如果被要求，请尽量强调解决问题描述的过程。这类解决方案通常要求在白纸或白板上产生。如果你没有练习，写在纸上有时会很麻烦。如今，我们如此喜欢系统，以至于往往忘记了纸和笔的使用。这可能是一个讽刺，但却是事实。当我试图回想上一次在纸上写程序时，那是\
  \ 5 年前的事了。所以，要养成在纸上书写整洁清晰的代码片段的习惯。\n\n\n\n\n## 处理无知与团队合作\n\n\n> 这应该是你被选入所申请职位前的最后一个障碍了。我之所以说“应该”，可能是因为有时面试过程可能非常死板，即使你通过了所有三轮面试（即电话筛选、技术测试和面对面面试），可能还有下一轮，你可能需要与\
  \ HR 经理打交道。HR 经理轮通常是为了决定你的薪资范围和其他条款。通常，如果你通过了技术轮，这会在技术轮之后立即发生。\n\n\n> 激情驱动成功。如果你对某事充满热情，你就会找到在该领域成功的方法。你的职业不是一场短期游戏。你将与你的职业共度一生。如果根据你投入工作中的有效小时数来计算，它几乎占了生活的三分之二。我知道，有人可能会辩称睡眠是最高效的工作，因为那是梦想产生的地方。但，让我们谈谈你清醒的时间段。我确信你们的大多数人都会同意这个事实：你大部分时间都会投入到工作中。因此，在申请工作之前，确保它与你的热情匹配。如果不是如此，几年后你将会产生怨恨。在\
  \ 4-5 年后转换工作角色对你来说将很困难。所以，在申请之前，请检查职位描述（JD）是否适合你。例如，如果你对应用程序 UI 是如何开发的感兴趣，你可能是一个喜欢做\
  \ UI 设计工作的人。但如果你渴望知道 Twitter 仪表板是如何被不同的帖子填充的，你就是一个热于编码的开发者。或者有时，你可能更倾向于数据库设计方法。因此，了解自己是面试过程中最关键的部分之一。\n\
  \n\n> 无论你是来自名誉大学的应届毕业生，还是寻求变化的资深候选人，都必须做好充分准备。充分准备必须有组织，并应该涵盖面试涉及的所有部分，从申请工作开始。一旦你在当地报纸或网站上看到符合你资的广告，你应该做的第一件事就是将简历或\
  \ `CV` 发给相关的 HR 代表。等一下。这里是 resume 还是 CV？\n\n\n> 一旦你分享了简历或 `CV`，你可以根据 HR 部门的政策期待面试电话或在线测试。你将通过电话或邮件收到此通知。但，不要等到接到电话。想得积极，假设你申请的所有工作都会被约面试。其主要原因是，在收到通知后，你可能没有足够的时间准备。少数公司会在周二晚上给你打电话，并希望你在周三早晨出现在面试小组面前。这正是持续准备将帮助你的地方。始终保持一档位，这样你就能快速驾驶你的汽车。定期复习所有概念并定期检查你的知识，也许和朋友一起或在在线门户上，即使你不会立即面对任何面试。\n\
  \n\n> 真正困难的事情是练习面试。你该怎么做呢？如果你觉得自己技术过硬并准备好参加面试，你如何确认这一点呢？是否有任何机构帮助你准备面试？我担心没有。即使有，数量也非常少。所以，练习面试是一项非常艰巨的工作。然而，你可以通过三种不同的方式来实现：\n\
  \n\n> 运动界常说：“无论你在网赛中表现得多好，你的真实能力将在参加实际比赛的压力下体现出来。”面试过程也是如此。你可能在技术上很好，或者觉得你会在面试中表现得从容。但现实可能是不同的。所以，去参加一场比赛来测试自己，在真实的比赛中练习。参加更多的面试。在最初几次面试中你会感到紧张。但之后，你将获得信心，能够理解面试官的心态。事实上，你将发现面试进展如何，以及你被选中的概率有多少。作为一名经验丰富的面试者，你将增加被选中的几率。\n\
  \n\n> “患难见真情是真正的朋友。”谁不知道这句世界著名的短语？准备面试可以通过创建面试环节来练习。你可以组成一个朋友小组，并创建面试期间可能被问到的数百个问题。之后，你可以实地参加面试，面试将由你的朋友主持（确保你忘记他是你的朋友，并像对待你的经理一样对待他）。这种练习将让你在面对真实面试时更加从。\n\
  \n\n> 每个面试小组都会为面试者维护一份绩效表，并将其提交给 HR 部门。当你收到未被选入理想职位的通知时，你可以礼貌地询问面试反馈。很多时候，这听起来可能是一种粗鲁的行为，因为对方可能会觉得你是在询问关于被拒绝的证明。但，如果你礼貌地请求\
  \ HR 部门，此类文档将帮助你在未来的面试中提高自己，他们可能会帮助你。记住，从建立联系的第一天起与 HR 的互动在这里很重要。如果你已经通过邮件和支持与 HR\
  \ 建立了一些积极的关系，HR 将通过提供关于面试的正确反馈来帮助你。\n\n\n\n\n错误是不可避免的。毕竟，你们是技术领域的毕业生，而不是如何应对面试的毕业生。可能在读完这本书后，你就能掌握如何应对面试，但在此时，你仍然是一个新手。错误是所难免的。你会在难题面前碰绊子，但经理们知道你是一个新人。即使是迈克·泰森，在职业生涯初期，脸上也挨过很多拳击；他倒下了，但又站了起来并继续反击。但正如我已经提到的，尽量尽早避免错误。现在让我们列出一些常见的错误。\n\
  \n### 过于复杂且混乱的回答\n\n### 失去冷静\n面试时感到压力并不稀奇。事实上，心理学家说，面试时产生一些压力是好的，但同时，你应该学会如何控制它。这种压力情况可能会让你进入大脑空白阶段，在那里你将忘记你准备好的内容。确保你找到如何控制压力的方法，以便在面试中表现得更好。\n\
  ### 给出背诵的答案\n背诵的答案可能让你通过多选题（MCQ），但无法通过面对面面试。记住，面试官是技术大师，他们在自己的领域拥有多年经验。如果你不能解释一个概念的本质，他们就不会指望有人谈论该概念的教科书定义。尝试寻找你可以使用该概念的不同场景。虽然关于概念的理论信息没有改变，但真实的案例可以是你自己的。\n\
  \n永远不要试图在面试中表现得格外聪明。很多时候，你在不需要时通过提供额外信息来在面试中进行尝试。如果你没有真正扎实的知识，这些额外信息可能会带来麻烦。此外，当小组在对你的人格进行判断时，这可能对你产生不利影响。做你自己。你必须证明你能做到这一点，而不仅仅是给人这种感觉。\n\
  \n### 面试官通常在分析什么？\n\n### 你胜任工作的能力如何？\n这是面试官需要进行的基础分析。为了进行这项分析，面试官可能会问与你的技能组合以及你对这些技能知识深度相关的问题。你的行为技能总是次要要求，因此面试官会将大部分时间花在这些问题上。这些问题通常包括你做过的项目、你面临的挑战，以及你是如何作为胜利者走出这些挑战的，或者无论结果如何你付出了什么努力。\n\
  ### 他们愿意与你共事吗？\n任何机构都不希望拥有一个试图打破其边界的资源。每个机构都有自己的一套规则和工作风格。这涉及到在升级问题时如何遵循等级制度，或者如何与直属经理或老板建立联系。面试官通常了解公司的这些参数，如果个人不遵守，可能会影响机构的工作文化。因此，你可以预计会有几个问题将引导他们从这方面更好地了解你。\n\
  \n动力是成功的关键。一个动力十足的人总是会找到完成事情的理由，而不是寻找无法完成的原因。面试官总是想知道你对你申请的职位是否充满动力。你可能会遇到这样的问题：“为什么要申请这个职位？”或“什么让你觉得这份工作是为你设计的？”准备好回答此类问题，因为它们与你对申请工作的兴趣相关。\n\
  \n### 你学习新工具/技术的能力有多好、多快？\n\n### 你适应团队文化吗？\n创建软件是一项团队任务。你不会坐在隔间里好几个月独自创建软件。由不同的角色（persona）来创建不同的模块。团队之间有更多的沟通，这是开发更好产品的关键方面之一。因此，面试官将渴望了解你的人际关系以及你如何处理与团队成员之间的冲突。\n\
  ### 肢体语言很重要\n\n\n\n\n除了你的技术水平如何，你的自我展示也同样重要。你可能认为这是面试的次要方面，但它其实非常重要。你的坐姿、说话方式都会对面试官产生影响。面试官可能会被你的肢体动作（咬指甲、敲桌子、抓挠等）分散注意力，从而错过你回答中的某些部分，你不应该让这种情况发生。尽可能，尝试在说话时带上温暖的微笑。一些候选人认为增加微笑可能会给人留下过度自信的印象，但事实并非如此。此外，即使你脸上表现出一些紧张也不是完全错误的。面试官理解面试并不是在玩游戏。这有时会被解读为你对面试和工作非常认真。\n\
  ## 研究公司\n这是显而易见的，不是吗？如果你在申请一家公司，你必须知道该公司的业务领域。该公司的主要或相关产品是什么？如果能从公共领域了解公司的利益相关者或董事会成员会更好。在面试过程中你可能没有见到他们，但了解这些细节可能帮助你做出更好的准备，因为在少数公司中，董事虽然在幕后发挥作用，但在筛选应届生方面扮演着重要角色。有时，面试小组中可能会出现一位成员，他想知道“你对我们公司了解多少”。\n\
  \n技能是你被选中的最重要的参数。确保你具备你所面试的职位所需的技能。例如，如果你申请全栈开发人员职位，你必须具备该要求的技能，如 UI 设计、数据库和编程。只有当这些技能出现在你的简历中时，你才会被选入面试名单。少数公司有一套系统，会通过作业或在线测试作为初选来检查技能。在面试前复习所需的技能总是明智的。有时，增加一些公司所属的领域知识也更好。例如，如果你申请像\
  \ `CITI` 或 `JPMorgan` 等金融机构，面试官会希望测试你与金融或交易相关概念的技能能力映射。\n\n## 理解职位描述\n\n## 你的性格与职位的关系\n\
  性格与开发人员的工作有什么关系呢？毕竟你将在孤立的隔间里对系统工作。在大多数情况下确实如此。但有些职位你需要成为团队的一部分。特别是如果一家公司采用敏捷方法，你必须直于胸臆。你应该在每日步行（daily\
  \ standup）中发言的勇气，这将有助于你或你组织开发的软件质量。所以，如果面试官发现你不是一个可以融入团队的人，或者不够外向而不主动分享你的观点，那么你可能会失去被选的机会。\n\
  ## 你的期望很重要\n你的期望总是与你的表现挂钩。如果你的期望与组织的政策一致，你将一直表现良好。高层管理人员对职位上的水平或垂直增长，甚至是薪资增长非常。。因此，在面试期间你可能会遇到一个问题：“你希望\
  \ 5 年后自己处于什么位置？”这类问题始终会让雇主明确你的期望，他/她会理解你是否会在组织的既定政策内获得满足。\n\n表现出肯定有时是好的。但在现实世界中，情况总是不同的。你可能有自己坚持的办事原则。但工作文化各不相同。雇主可能希望你在时间、技术，甚至你已经使用一段时间的政策方面保持灵活。在面试期间，你将得到一些问题来检查你的灵活性，以及你根据情况转变传统策略的开放程度如何。\n\
  \n## 你必须积极主动\n\n## 了解你的简历\n简历是你给人的第一印象。你根据简历的有效性被选入面试名单。但这并不意味着你要用自己并不掌握的技能来装饰你的简历。虽然首要目标是到达面试小组面前，但预期的结果是被选中。你难道仅仅对参加了面试或获得了该职位就感到满意了吗？如果你是应届生，不仅是技能树，你的爱好、学术项目在面试中也会被考虑进去。确保你了解你的简历。你应该知道简历中提到的所有内容。如果你无法谈论简历中提到的点，面试官可能会觉得你在欺骗。任何组织都不会愿意雇佣一个故意或无意试图欺骗他们的人。\n\
  ## 你应该值得信赖且良好的团队合作者\n一旦你通过了面试的技术流程，这将最后一步，面试官将对你作为团队合作者对组织有多好。你是否是一个能够融入现有团队的人？面试官会非常关注你在团队中工作时作为一个人的表现。\n\
  \n\n\n开发者是一个奇才。他/她对领域、算法有丰富的知识，并且知道如何将两者结合起来创建一个高效的应用程序。编写代码并编译它是一项惯用任务。一旦编译完成，程序就会在底层系统上执行。而这正是开发者会卡住的地方。开发者通常不了解操作系统的内部工作原理。这可能对编写程序的方式影响不大，但有时会导致非常令人不悦的惊喜。\n\
  ## 结构\n\n编译和执行 Java 程序只需要几条命令。但是，必须考虑这一过程在内部是如何发生的。本章将采用循序渐进的方法，介绍如何编写一个 Java 程序、如何编译它以及如何执行它。在讨论所有这些概念期间，我们还将讨论你在参加面试时可能会遇到的不同面试题。\n\
  ## 目标\n\n在本章结束时，你将理解 Java 程序的架构。你将能够理解：\n- Java 程序的执行流\n- Java 程序中的关键文件\n- `JVM`\n\
  - `JDK`\n- 字节码验证器 (Bytecode verifier)\n- 即时编译编译器 (Just-in-time compiler)\n## Java\
  \ 程序的执行流\n\n编写 Java 程序、编译和执行它是你来说的日常工作。但尽管如此，你仍然需要确保理解每一个细节。让我们结合面试题来深入讨论这一点。\n\
  ### 解释 Java 程序的执行流\n\n你需要理解的最基本的点是 Java 程序是如何执行的。图 2.1 给出了这一过程的图示表示：\n![](img/00011.jpg)\n\
  \n图 2.1：Java 程序的执行流\n正如我们观察到的，源文件 `.java` 被提供给编译器。编译器编译该文件并转换为字节码文件，这是一个与平台无关的文件。该文件被传递给\
  \ `JVM`，由 `JVM` 负责执行它。\n\n## Java 中的关键文件\n在开发 Java 应用程序时，我们会遇到不同类型的文件。作为开发者，你必须意识到所有文件。\n\
  \n### 不同的文件类型是什么？它们在 Java 编程中的意义是什么？\n当开发者编写应用程序代码时，他们通常在人类可读的文件中编写代码，这些代码会被转换为机器兼容的文件。作为开发者，你必须理解这些关键文件。\n\
  \n#### 源代码文件\n该文件由 Java 开发者编写，扩展名为 `.java`。这通常是用高级编程语言编写的程序。下面的代码段将向你展示此类文件的基本结构看起来如下：\n\
  \n```java\n    int x;\n    //其他数据成员\n    public void() {\n    }\n}\n```\n#### 字节码文件\n\
  \n在 Java 将高级代码转换为原生兼容的可执行文件之前，它会将其生成字节码，这是一种与平台无关的代码。该文件的扩展名为 `.class`，被称为可以执行的类文件。虽然面试官并不期望你去阅读类文件，但你可能可以看一眼编译后生成的类文件片段。\n\
  ### 为什么 Java 被称为平台中性或独立语言？\n\n传统的编程语言在编译后生成依赖于平台的文件来执行程序。例如，C 语言语言如果在 Windows 上编译，会生成\
  \ `.exe` 文件，该文件仅与 Windows 平台兼容。这意味着该文件是不可移植的。相反，Java 在编译后生成类文件，它是平台中性的。你可以在任何 `JVM`\
  \ 上加载此文件，相应的 `JVM` 将负责生成用于执行的原生文件。\n## Java 运行环境 (JRE)\n\n在讨论 Java 时，你会遇到的最常见术语之一是\
  \ `JRE`。虽然它很常见，但我们许多人并不知道 `JRE` 的内部工作原理。面试官可能会就 `JRE` 提出一些刁钻的问题，你可能对此无知。\n### JRE\
  \ 的作用是什么？\n\n`JRE` 通常是一个可以与其提供的类文件通信的程序。运行环境通常是软件传统上运行的一种物理操作系统。`JRE` 是运行在底层操作系统之上的软件。`JRE`\
  \ 在整个 Java 生命周期中起着至关重要作用的主要原因是，程序员不需要担心实际的操作系统，也不需要根据操作系统来修改代码或执行过程。当你指示 Java 执行程序时，`JRE`\
  \ 接受你的代码，通过 Java 类加载器合并不同的依赖项，并将其传递给 `JVM`。\n### JRE 的组件有哪些？\n\n`JRE` 包含以下三个组件：\n\
  1. 类加载器 (Class loader)\n2. 字节码验证器 (Bytecode verifier)\n3. 解释器 (Interpreter)\n##\
  \ 类加载器\n\n类加载器在整个 Java 应用程序流中起着至关重要的作用。以下是你可以期待关于类加载器的面试题。\n### 类加载器起什么作用？\n\nJava\
  \ 应用程序在设计上是复杂的。它们包含不同的类，这些类之间是相关的。大多数类使用来自其他类的服务。换句话说，它们依赖于某些其他类。因此，为了确保一个类被编译或执行，该类必须找到它所依赖的类。类加载器负责在内存中搜索并加载此类类。这些类并不是由类加载器一次性加载到内存中的；而是按需进行的。\n\
  ### 有哪些不同类型的类加载器？\n\n`JRE` 中有不同的类加载器，取决于它们从哪里动态加载类。\n### 启动类加载器 (Bootstrap class\
  \ loader)\n\n`JRE` 的单体版本有一个 `.jar` 文件，它是 Java 中所有系统或内部类的仓库。这个 `.jar` 文件存在于 `lib`\
  \ 目录。启动类加载器负责加载该 `.jar` 文件内部的类。此外，启动类加载器还作为其他类加载器的父类，需要有人来初始化它们。因此，它被称为 Java 的原始类加载器\
  \ (primordial class loader)。\n### 扩展类加载器 (Extension class loader)\n\n扩展类加载器是启动类加载器的子类。`JRE`\
  \ 中的外部类位于 `jre/lib/ext` 目录中。如果类没有被启动类加载器加载，则扩展类加载器从该目录加载类。\n#### 系统或应用类加载器 (System\
  \ or application class loader)\n\n该类加载器是扩展类加载器的子类。通常，开发者设置类路径来搜索应用程序的类。系统类加载器从类路径加载类。\n\
  如果你想知道哪个类加载器用于加载所需的类，可以使用该类的 `getClassLoader()` 方法，如下所示：\n\n```java\n\nclass CheckClassLoader\
  \ {\n    public static void main(String[] args) {\n        System.out.println(d.getClassLoader());\n\
  \    }\n}\n\n![](img/00013.jpg)\n\n\n正如你所观察到的，`CheckClassLoader` 类是从 `Date` 类加载加载的，你得到的输出是\
  \ `null`。这个 null 表示该类是由启动类加载器加载的。启动类加载器的输出 null 是因为启动类加载器是用 C 或 C++ 库实现的。\n\n\n\
  在通过我们在应用程序中加载类时，我们可以提供类加载器。`Class.forName()` 方法接收字符串格式的类的全限定名称作为参数，这是你想要作为资源加载的类。\n\
  \n\n\n\n众大家所知，Java 程序的编译和执行过程非常简单且直接。开发者通过一些事务性工作来生成类文件，并将其传递给 `JVM` 执行。尽管通常情况下，这不应该给\
  \ `JVM` 带来不一致性或安全性漏洞问题，但情况并非总是如此。有时，上传到 `JVM` 的类文件可能并非来自可靠的资源。例如，从热点浏览器下载的文件通常包含不需要\
  \ `JVM` 编译的类文件，因为它们在应用程序内部已经经过了预编译。此类第三方类文件可能包含某些代码，这些代码可以利用 Java 虚拟机。为了确保没有入侵者进入内部，`JVM`\
  \ 拥有一个守门人，即字节码验证器（bytecode verifier）。如名所示，字节码验证器会验证是否存在任何损害 `JVM` 的违反约束的行为。\n\n\
  ### 字节码验证器执行哪些验证？\n验证器会执行以下验证：\n- 帧中存在的操作数栈不应溢出，且不应下溢或未被充分利用。\n- 变量在使用之前必须先进行初始化。\n\
  - 方法调用必须使用正确的引用。\n- 栈不应溢出。\n- `final` 类不能被扩展，`final` 方法不能被重写。\n\n我知道你脑海中立刻产生的问题是：“嘿，你在开玩笑吗？所有这些任务都是由编译器完成的。字节码验证器在这些工作中起什么作用？”面试官可能会向你提出类似的问题。\n\
  \n\n尽管编译器可以检查所有这些方面并创建类文件，但类文件**是可以被修改的**。如果有任何心怀不轨的人了解汇编编程，他/她就可以编辑类文件并进行修改。这正是守门人拒绝此类类文件的地方。这使得\
  \ `JVM` 更加健壮和可靠。\n\n\n`JVM` 是整个 Java 生态系统的核心。无论你是初学者还是 Java 专家，都应该对 `JVM` 有足够的了解。面试官期望你深入了解\
  \ `JVM` 的作用。让我们过一下一些与 `JVM` 相关的面试题。\n\n\n“虚拟机”（Virtual Machine），这就是我们这样称呼它的。但当人们说虚拟机时，视角是不同的。通常，我们知道可以在现有的机器上安装虚拟机。例如，我们可以在\
  \ Windows 上安装一个 Linux 虚拟机，并在 Windows 系统之上运行 Linux。同样地，`JVM` 实际上是安装在你的系统上的一个抽象机器，你可以在上面执行你的\
  \ Java 程序。这种在你的系统上拥有一个独立虚拟机的方法是为了满足 Java 的平台无关性方法。大多数其他高层编程语言生成与操作系统匹配的可执行文件，而 Java\
  \ 则创建的是一个可以在 `JVM` 上执行的字节码文件。`JVM` 拥有像你拥有的系统所有的特征。硬件设备包含寄存器、指令指针和集合。所有这些特征都被赋予了\
  \ `JVM`，正因如此，我们可以在它上运行 Java 编写的程序。\n\n\nJava 程序包含不同的段，如方法、局部变量、引用、对象等许多。当我们执行类时，在程序运行期间，所有这些段都会被临时存储。这些段不会存储在\
  \ `JVM` 的相同位置，而是存储在不同的逻辑隔间内。图 2.3 显示了 `JVM` 的不同内存块。\n\n\n图 2.3：JVM 内存块\n\n\n以下是\
  \ `JVM` 生成的不同内存区域类型：\n- **方法区或类 (Method Area or Class)**：此区域存储类信息，如变量、方法数据或运行时常量池。\n\
  - **栈 (Stack)**：栈内存存储执行期间每个线程创建的帧。所有的局部变量、方法结果都存储在这里。每当方法调用结束或完成时，帧就会被删除或移除。\n-\
  \ **PC**：每个被 `JVM` 执行的任务都在线程内执行。程序计数寄存器是一个内存，包含当前由 `JVM` 执行的线程的指令。\n- **原生栈 (Native\
  \ Stack)**：如果应用程序中使用原生方法，则原生栈内存会被原生方法利用。\n### 你可以增加 JVM 的堆内存吗？\n\n### 或者什么是“OutofMemoryException”？我们如何处理它？\n\
  此异常在 `JVM` 内存不足时发生。为了处理这个问题，我们需要增加 `JVM` 的堆内存。我们可以通过向 Java 命令提供额外的属性来动态地增加 `JVM`\
  \ 的堆内存。我们可以使用以下属性来修改堆内存大小：\n- 设置最小堆大小\n- 设置最大堆大小\n例如，你可以执行以下 Java 命令来更改堆大小：\n```\n\
  java Sample -Xms512m -Xmx1024m\n\n或者，你也可以在操作系统中设置环境变量，以便在每次 Java 程序执行时更改堆大小：\n```bash\n\
  ```\n\n### 你如何区分栈内存和堆内存？\n栈内存是用于存储局部变量和对象或数组引用的内存。这种内存是运行时可扩展的。另一方面，堆内存是用于存储对象或数组的固定大小内存。这种内存可以在\
  \ JVM 启动时更改 Java 变量设置时更改。\n\n\n\nJIT 是 Just in Time compiler（即时编译器）的缩写，它是存在于 `JVM`\
  \ 内部的一种特殊编译器，将字节码转换为原生代码。`JIT` 在提高 Java 应用程序性能方面起着重要作用。它的工作方式与普通编译器相反。普通编译器在执行之前工作；而\
  \ `JIT` 在执行开始时开始工作。它本质上是动态的。让我们通过一些面试题来讨论 `JIT` 的概念。\n\n\n我们都知道 Java 程序包含需要执行的类。类无非是平台无关的字节码。当\
  \ `JVM` 开始执行这些代码时，它必须解释这些字节码以确保底层 CPU 能理解它们。这个过程是非常耗时的，因为每个调用的方法或代码都必须经过解释，这会导致应用程序性能受到影响。\n\
  \n图 2.4: 即时编译器\n\n图 2.4 显示了 `JIT` 如何获取字节码并将其转换为原生代码，以便 `JVM` 可以执行它。当然，与普通编译器一样，`JIT`\
  \ 也相当昂贵。它确实需要内存和其他系统资源。但是，即使考虑到这一点，与 `JVM` 的普通解释过程相比，`JIT` 仍然提高了应用程序的性能。\n### JIT\
  \ 内部如何工作选择要编译的方法？\n\n`JIT` 的工作方式非常有趣。`JIT` 编译器不会在方法调用时编译该方法。实际上，每个方法都会获得一个编译阈值。每当调用方法时，该阈值就会减一，一旦阈值达到零，`JIT`\
  \ 就会将该方法编译为原生代码。\n### 我们可以与 Java 版本不同的 JIT 版本吗？\n\n`JIT` 和 `JVM` 是集成在一起的。因此，没有选项可以使用不同于\
  \ `JVM` 或 `Java` 版本的 `JIT`。通常，`JIT` 与 `JVM` 绑定，因此无法将其分离并作为独立组件使用。\n### 可以禁用 JIT\
  \ 吗？\n\n可以，我们可以通过向 Java 命令提供选项 `-Xint` 或 `-DJava.compiler=NONE` 来禁用 `JIT` 编译器。\n\
  ### 如果禁用了 JIT，你会面临什么后果？\n\n不建议禁用 `JIT`，因为这将强制解释整个 Java 程序。正因如此，应用程序的性能将受到影响。所以，通常情况下，如果有人想诊断应用程序，才会禁用\
  \ `JIT`。\n### JDK、JRE 和 JVM 之间有什么区别？\n\n#### JVM\n\n#### JRE\n这通常是 `JVM` 的实现，称为\
  \ Java Runtime（Java 环境）。`JRE` 的主要工作是为 Java 提供运行时环境。它包含了执行 Java 文件所需的 Java 库。\n####\
  \ JDK\n`JDK` 是一个我们可以使用它来开发和编译 Java 应用程序甚至 applet 的环境。所以，我认为这是一个开发人员包。现在，`JRE` 本质上是\
  \ `JDK` 的一部分。\n\n\n`JVM` 期望程序中有一个 `main` 方法作为启动方法。`main` 方法必须声明为 `public static\
  \ void`。`main` 方法必须具有 `String` 类型的参数。参数不能是单个参数，但你可以拥有一个 `String` 数组或一个 `String`\
  \ 变长参数。\n\n\n```\npublic static void main(String data[])\npublic static void main(String…\
  \ data)\nstatic void main(String[] data)\nstatic public void main(String… data)\n\
  \n### 我们可以重载 main() 吗？\n\n\n### 如果我们重载了 main 方法，你的程序会执行吗？\n\n\n考虑以下代码段：\n\nclass\
  \ TestIT {\n    public static void main(String args[]) {\n        // 重载 main\n \
  \   public static void main(String[] args) {\n        // 重载 main\n    }\n```\n\n\
  ![](img/00005.jpg)\n\n在这里，`TestIT` 类包含了重载的 `main` 方法。这个类可以正常编译，但如果执行，它将像前面的输出截图所示抛错误。\n\
  \n\n答案仍然是！上一个问题将根据 `private` 关键字的访问修饰符规则后续下一个问题。\n\n\n我们可以将 `main()` 方法声明为 `private`。但如果你这样做，它在类外部是不可见的。正因为这样，`JVM`\
  \ 将无法找到它并生成找不到 `main` 方法的错误。\n\n\n可以，我们可以这样做。\n\n\n如果我们把 `main` 方法声明为非 static，那么有人负责初始化类并通过该类的对象来调用方法。如果我们把\
  \ `main()` 声明为 `static`，那么 `JVM` 将 `main` 方法作为静态方法加载。\n\n\n在本章中，我们讨论了 Java 的内部结构。我们探讨了在应用程序执行中起积极作用的不同\
  \ Java 组件。除此之外，我们讨论了针对每个这些组件可能提出的不同问题。\n\n\n\n\n类是对象的工厂。对象的属性和行为是由类定义构建的。我们也可以说，它包含了关于你的对象将如何行为的指令。它是现实世界实体与理论概念之间的桥梁。类中声明的变量描述了对象的物理属性，而类的方法描述了对象的行为。在设计项目架构时，良好的类设计始终是最重要的部分，因为错误的类设计会导致生成的对象在整个项目的预期生命周期内可能无法按照预期的意工作。\n\
  \n## 设计类的约定有哪些？\n在设计类时，应遵循以下约定：\n- 名称应该大大写字母开头\n- 方法应该使用小驼命名法（camel Case）\n- 应该包含私有数据成员\n\
  - 应该包含公共方法\n- 注意：你可能会遇到关于修饰符及其规则的后续问题。\n## 什么是对象？\n\n如果说类是想象或预期，那么对象就是现实。对象是从类中创建的实体。每个对象都拥有与数据成员关联的值，这被称为状态（state），以及执行分配给它的任务的业务逻辑，这被称为行为（behavior）。对象可以是逻辑上的，也可以在自然界中物理存在。\n\
  \n\n每个对象都与其相关的以下属性：\n\n状态是对象所拥属性的值。对象的设计通常通过这种状态来实现。例如，当一辆汽车是蓝色的，蓝色就是颜色属性的值，定义了汽车的状态。\n\
  \n## 行为\n\n## 身份\n同类型的每个对象都与其相关的唯一性，这被称为该对象的身份（identity）。你可以拥有任何数据成员并将其视为身份，或者你可能拥有该对象的内存地址，这被视为身份，但对程序员是不可见的。\n\
  \n人们说我们的出生是有原因的。上天分配给了我们某些任务。同样，对象的创建是为了某个目的；它们负责某些事情。它们必须参与它们被创建时所属的业务逻辑。\n\n对对象的详细了解是你必须掌握的最基础的内容之一。毕竟，对象是\
  \ OOP 的核心，你的整个开发都围绕它展开。你应该知道如何创建它、如何在不同对象之间建立关系，以及如何销毁它。如果你无法回答这些基础问题，那么你在面试中将会惨败。这些问题的答案很重要，因为你面试的接下来的旅程将取决于此。\n\
  ## 什么是构造函数？解释它的作用\n\n构造函数是定义在类中的特殊方法，其名称与类名相同。每当对象被创建时，构造函数就会被隐式调用。构造的主要目的是初始化对象，换句话说，初始化对象的数据成员。\n\
  ## 我们可以私有构造函数吗？\n\n是的，我们可以写私有构造函数。但是，如果我们这样做，可以观察到以下一些限制：\n- 你无法创建该类的子类。\n- 通常，这种做法用于单例设计模式。\n\
  \n## 为什么 Java 不被称为 100% 面向对象的编程语言？\n要将任何编程语言视为 OOP 语言，它必须遵循两个原则。它必须支持 OOP 语言的所有支柱，Java\
  \ 做到了。其次，它的所有内容都必须是对象。遗憾的是，Java 在这一点缺失。Java 仍然具有一些像基本类型（Primitives）这样的特性，它们不是对象。当然，Java\
  \ 有包装类作为基本类型的对应对象，但根据许多开发者的观点，API 中存在基本类型使得它不符合完整的 OOP 语言。\n\n## 为什么 Java 中所有的实例变量都有默认值？\n\
  当我们使用 `new` 关键字创建对象时，会在堆中保留内存。为了初始化这段内存，JVM 提供了默认构造函数，负责将实例变量初始化为默认值。当我们创建对象时，这个构造函数始终存在。所以，如果你了自己的构造函数，将在\
  \ JVM 提供的构造函数之后调用。\n\n## Java 中的访问器方法（accessor）和修改方法（mutator）是什么？它们的意义是什么？\n每个类都有参与业务逻辑的数据成员。访问和修改此类数据成员始终需要方法的帮助。这些方法可以用于初始化数据成员或设置数据成员。但是，如果我们写一个方法来访问和修改数据成员，我们就违反了面向对象的抽象规则。因此，Java\
  \ 引入了访问器和修改方法的概念。这些方法专门用于单个数据成员。因此，每个数据成员将有两个方法即 `setter` 和 `getter`。`setter` 方法用于设置数据成员的值，被称为修改方法。而\
  \ `getter` 用于获取其所声明的数据成员的值，被称为访问器方法。除此之外，访问器和修改方法还有另一个优势。许多框架如 `spring`、`hibernate`\
  \ 在内部与你对象的数据成员进行通信。如果访问数据成员的方法是由你写的，那么框架就不可能搜索这样的方法。但是，框架可以在内部找到 `getter` 和 `setter`\
  \ 方法来隐式地与数据成员通信。\n\n## 对象创建\n对象的创建是另一个基础但重要的领域，面试官会在那里测试你。你应该知道什么是创建对象，以及创建对象的不同方式。以下章节涵盖了大多数与对象创建相关的问题。\n\
  \n### 创建对象的不同方式有哪些\n- 使用 `new` 关键字\n- 使用 `clone` 方法\n- 使用反序列化（de-serialization）\n\
  \n\n### 如何使用 `newInstance` 方法创建对象？\n\n\n### 如何创建现有对象的拷贝？\n\n\n### `clone` 方法与将对象引用复制另一个对象有什么区别？\n\
  \n\n\n\n\n### 如何使用 clone 方法创建新对象？\n\n\n```java\nclass Student implements Cloneable\
  \ {\n    String studName;\n\n    Student(int rollNo, String studName) {\n      \
  \  this.studName = studName;\n    }\n\n        return super.clone();\n    }\n\n\
  \        try {\n            Student s1 = new Student(101, \"John\");\n         \
  \   Student s2 = (Student) s1.clone();\n            System.out.println(s2);\n  \
  \      } catch (CloneNotSupportedException c) {\n            c.printStackTrace();\n\
  \    }\n}\n```\n\n\n当我们尝试克隆一个没有实现 `Cloneable` 接口的对象时，`JVM` 会抛出此异常。如果对象没有实现 `Cloneable`\
  \ 接口，你无法对其调用 `clone` 方法。\n\n\n当我们想要序列化一个对象时，必须做的第一件事是对该对象的类实现标记接口 `Serializable`。这使得该类的对象具备序列化的资格。\n\
  \n\n注意：关于序列化还有一些可能的问题，但我们将在第 5 章 `File` 中详细介绍。\n\n### 什么是反序列化，它是如何生成新对象的？\n反序列化是我们能够检索已序列化对象的过程。我们不需要任何构造函数来创建此类对象，但\
  \ `JVM` 在内部会读取该对象在序列化时存储的全部字节码。然后，提取的数据被封装成对象格式并返回给用户。\n\n注意：有时，面试官可能会更进一步，问你是否可以反序列化从其他框架序列化的对象，例如，如果一个对象在\
  \ C# 中序列化，Java 能反序列化同一个对象吗？答案是不！反序列化是一个依赖于语言的过程，因为在序列化过程中，语言信息被添加到序列化对象中。\n### Java\
  \ 中存在哪些访问修符？你能解释它们的重要性吗？\n\n以下是 Java 中的访问修符：\n- **private**:\n当我们将任何成员声明为 `private`\
  \ 时，认为它具有最高安全级别。此类成员在声明它的类内部是可以被访问的。即使你导入了一个类，这些数据成员也是不可访问的。只有内部类可以访问其声明的外部类的私有数据成员。\n\
  \n如名所示，这是一个默认访问修符。没有特定的方法来声明它，但如果你没有提到任何修符，该成员就被认为具有默认访问权限。具有此修符的成员在同一个包内是可以访问的。\n\
  \n- **protected**:\n当我们将一个成员声明为 `protected` 时，该成员在包内是可以访问的。它在包外部也是可用的，但仅限于该类的子类。\n\
  - **public**:\n当我们要声明任何要暴露给整个世界的成员时，我们可以使用 `public` 访问修符来声明该成员。当然，即使我们使用了 `public`\
  \ 访问修符，如果我们在包之外使用该成员，导入该类是强制性的。\n\n### 我们可以对类应用 private 修饰符吗？\n这是一个棘手的问题。如果你说可以对类应用私修饰符，答案是错误的。但从另一个角度来看，如果一个类是内部类，你可以对它应用\
  \ `private` 关键字。\n\n### 封装\n著名诗人费尔南杜·佩索曾说过：“如果我死后人们想写我的传记，这并不简单。他们只需要两个日期：我的出生日期和去世日期。在两者之间，每一天都属于我。”每个人在现实世界中都享有隐私。对象也是如此，毕竟它们代表了现实世界。建议通过封装来设计对象，使其隐藏自身的构建方式和处理数据以实现目标的方式。\n\
  \n### 什么是封装，如何实现它？\n每个对象由数据成员和成员函数组成。数据成员的值表示对象的状态，成员函数定义对象的行为。行为通常由数据成员的值控制。因此，如果我们希望对象的行为正如创建者设计的那样，那么数据成员就不应该直接暴露给终端用户。这种从外部世界隐藏内部结构或数据成员的行为被称为封装。\n\
  \n我们可以通过将数据成员声明为 `private` 并将成员函数声明为 `public` 来实现封装。通过这种方式，系统的用户只能访问成员函数而不能访问数据成员。\n\
  ### 你能通过示例解释为什么要遵循封装吗？\n\n当然。考虑如下代码中的 `Rectangle` 类：\n```java\nclass Rectangle {\n\
  \    int width, height;\n\n    Rectangle(int width) {\n        this.width = width;\n\
  \    }\n\n    double getArea() {\n        return area;\n    }\n\n        Rectangle\
  \ rect = new Rectangle(10);\n        System.out.println(rect.getArea());\n    }\n\
  ```\n\n在这里，我们期望用户初始化 `width`，而在内部，`height` 将根据开发者编写的逻辑进行计算。但这种方法的问题在于，由于没有遵循封装，对象可以直接初始化数据成员\
  \ `height`：\n我们不希望对 `height` 数据成员进行手动修改。为了实现这一点，我们需要将 `width` 和 `height` 声明为 `private`\
  \ 数据成员，以便它们在类之外无法被访问：\n\n```java\n    private int width, height;\n    // 实现代码\n\
  }\n\n### 为了实现完全封装，我们可以将类声明为私修符吗？\n\n\n### 继承\n\n\n### 什么是 Java 中的关联（Association）？\n\
  \n\n\n\n\n\n下面的代码片段将演示如何实现组合：\n\n{\n  String color;\n  Engine\n  }\n  {\n    //data\
  \ member\n    //member functions\n}\n```\n\n这两者在 Java 中都是关联（association）的类型。这两个概念都使用另一个对象作为自身的一部分。但它们有一个区别：一旦使用组合，如果我们销毁了主对象，与之关联的对象也会被销毁或失去意义。在聚合的情况下，即使删除了主对象，另一个对象仍然存在于系统中。\n\
  \n### 你能提供一个组合和聚合的例子吗？\n\n### Java 中“是一个...”关系（is-a-kind relation）和“包含一个”关系（has-a-kind\
  \ relation）的区别是什么？\nJava 支持两种类型的继承方式：“是一个...”关系和“包含一个”关系。“是一个...”关系展示了继承的经典方法，你创建一个行为与现有类型相似的新类型。在这种方法中，你创建一个新对象，它本质上继承了已存在对象的所有属性和行为，该对象被称为它的超类（super\
  \ class）。新创建的对象称为子类（subclass）。例如，汽车是车辆（vehicle）类型。在这里，`vehicle` 定义了不同类型车辆的共同属性。汽车是一个子类，可以被设计为一种类型的汽车。这实现了\
  \ `vehicle` 中定义的代码的可重用。因此，你不需要重新定义 `vehicle` 中已经定义的共同属性或方法。\n另一方面，“包含一个”关系代表组合。在这种方法中，一个对象拥有另一个对象的引用作为其属性的一部分。在这里，新创建的对象不继承现有对象的属性和行为，但它可以通过内部声明的引用来使用该对象的服务。例如，汽车有一个方向盘，或者汽车内部有一个引擎。\n\
  \n### 你如何解释耦合（coupling）这个术语？\n\n 松耦合（loose coupling）是指什么意思？\n软件本质上是不同组件相互通信以实现某些目标的集合。这种通信通常需要在系统的不同组件之间建立关系。这种关系或连接在\
