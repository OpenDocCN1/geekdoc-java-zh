  抽象类不仅仅代表一个骨架。有时，它可能包含带有某些业务逻辑的具体方法。为了执行该方法的业务逻辑，抽象类可能需要局部变量或数据成员。因此，为了给数据成员某些默认值，抽象类提供了构造函数，你或\
  \ JVM 可以在构造从中初始化数据成员。\n\n\n通常，当我们定义一个类时，我们会编写描述对象行为的方法。这些方法在花括号边界内有与之关联的方法体。此类方法被称为**具体方法**（concrete\
  \ methods）。\n\n\n即使方法使用空花括号声明，该方法仍然被视为具体方法而不是抽象方法。\n\n\n可以。我们可以拥有一个所有方法都是具体方法的类，并且仍然将该类声明为抽象类。但正如我们所知，我们不能实例化抽象类。因此，如果你想使用该类提供的服务，你需要派生该类的子类然后实例化它。\n\
  \n\n将任何类声明为抽象类的整个目标是为了子类化。我们总是扩展抽象类并实例化子类。子类还会重写由抽象类声明的抽象方法。`final` 关键字使得类无法被子类化；如果类被声明为\
  \ `final`，则无法扩展该类。因此，不允许将声明的抽象类声明为 `final`。\n\n\n当我们把任何方法声明为 `private` 时，基本上是我们剥夺了它的可见性。该方法对外部世界不可见。抽象方法需要被子类重写，因此它们必须对子类可见。由于\
  \ `private` 方法在类外不可见，你无法重写它。因此，不允许将抽象方法声明为 `private`。\n\n\n`static` 关键字与类相关，而不是与对象相关。相反，重写的概念是建立对象之间的关系，你可以在其中覆盖父类的方法。因此，任何不属于对象的内容都不能被重写，所以在在声明抽象方法时不使用\
  \ `static` 关键字。\n\n\n抽象类被子类扩展。每个子类在实例化时都会隐式地调用它自己的构造函数。而构造函数提供了 `super` 关键字，它会调用父类的构造函数。\n\
