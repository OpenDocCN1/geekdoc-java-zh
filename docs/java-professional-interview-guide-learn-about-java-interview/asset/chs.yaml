  \ A\n\n\n//方法 1 的体\n\n\n}\n```\n### 接口有构造函数吗？它与抽象类有什么区别？\n\n与抽象类不同，接口没有构造函数。由于接口没有数据成员，因此它不需要构造函数。抽象类和接口之间的一个主要区别是，接口包含抽象方法，而抽象类可以包含具体方法和抽象方法的组合。\n\
  ### 接口的作用是什么？\n\nJava 不支持多重继承。因此，你无法利用从多个资源声明或定义的服务。接口是解决这个问题的方案。你可以为你的类扩展单个类和多个接口。接口是完全抽象的实时实现，你在其中声明方法，并将实现留给子类。接口在实现松耦合方面也起着重要作用。\n\
  ### 什么是多态引用？\n\n多态引用用于动态控制子类的行为。当子类对象被父类引用引用时，这种引用被称为多态引用。任何参与“是一种”这种关系（is-a kind\
  \ of）的实例都可以参与多态引用。因此，任何对象都可以被其直接父类、间接父类、它所实现的接口甚至是宇宙父类对象所引用。\n### 多态引用的意义是什么？你如何实现它？\n\
  \n当我们使用对象引用来调用方法时，JVM 在你所引用的对象中搜索该方法，并执行该方法。如果子类中不存在该方法，那么如果父类中存在该方法，则将执行父类的方法。因此，表面上看，子类足够灵活，可以编写并执行父类中不存在的方法。子类传统上是一个超级老板，除非有人控制它。\n\
  考虑以下代码段，其中 `Dog` 是以下类的子类：\n\n```java\nis\n}\n}\n\n`Dog` 扩展了 `Animal`，并且它可以重写 `Animal`\
  \ 类中的方法。因此，调用 `talk()` 时的 `Dog` 引用将调用 `Animal` 中的实现，而当调用 `breath()` 方法时，将调用 `Animal`\
  \ 类的方法，因为 `Dog` 类中不存在该方法。但是，让我们考虑 `Dog` 的实现如下：\n\nclass Dog extends Animal {\nvoid\
  \ read() {\n    System.out.println(\"reading Economic Times\");\n}\n```\n\n\n让我们现在更改\
  \ `Dog` 的引用，如下所示：\n\nAnimal d = new Dog();\nd.read();\n```\n前面的代码失败了，因为 `Dog` 的对象被\
  \ `Animal` 引用，它尝试调用 `Animal` 未知的方法。通过这种方式，我们可以使用多态引用来控制子类的行为。\n\n### 如果 Object 是宇宙父类，用它引用每个对象会有问题吗？\n\
  从技术上讲，通过 Object 父类引用每个对象没有问题。但动态来看，这将产生非常奇怪的情况。想象以下语句：\n\n```java\nObject c = new\
  \ Car();\nObject s = new Student();\n```\n在这里，所有三个对象都被 Object 父类引用，这对于编译器来说完全没问题。但当你尝试使用相应的引用调用\
  \ `Employee`、`Car` 或 `Student` 的方法时，将会失败。原因显而易见。因为所有对象都是多态引用的，只能调用 Object 类已知的方法。\n\
