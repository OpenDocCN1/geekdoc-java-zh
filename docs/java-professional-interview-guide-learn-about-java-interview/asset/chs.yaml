  }\n```\n\n在这里，我们需要如下如下定义两个 bean：\n\n```xml\n当我们使用“包含”关系时，我们需要在配置文件中使用 `ref` 属性。在前面的代码段中，我们使用了\
  \ `ref=\" \"` 而不是 `value=\"`\n\n## 你刚刚提到了几个 bean 配置；我想知道容器会为这种 bean 配置创建多少个实例？\n\
  \n这个问题可以重新表述为：\n当你定义一个 bean 配置时，容器会创建多少个实例？\n\nSpring 默认支持 bean 的单例作用（singleton\
  \ scope），这意味着 bean 只会被 Spring 实例化一次。Spring 容器只是会针对该 bean 的多次请求反复返回同一个实例。\n\n或者简单来说，XML\
  \ 中配置的每个 bean 只会创建一个对象。\n\n## 是否意味着开发者从容器中只能获得一个实例来工作？\n\n这个问题可以重新表述为不同的形式：\n是否可能从同一个\
  \ bean 配置中获取多个实例？\n\n## bean 的作用域（scope）是什么？Spring 中提供了哪些作用域？\n\nbean 的作用域定义了为 bean\
  \ 配置创建多少实例，或者 bean 实例存活多久。Spring 框架提供了以下五种作用域：\n\n1. **singleton**（单例）：Spring IoC\
  \ 容器为配置的 bean 只创建一个实例。这是 bean 的默认作用域。\n2. **prototype**（原型）：Spring IoC 容器为每个新请求创建一个新实例。\n\
  3. **request**（请求）：Spring IoC 容器为每个新的 HTTP 请求创建一个新实例。请求作用域仅在上下文感知 Web（Web-aware）时有效。\n\
  4. **session**（会话）：Spring IoC 容器为新的会话创建一个新实例。该作用域仅在上下文感知 Web 时有效。\n5. **application**（应用）：应用作用域将单个\
  \ bean 定义映射到应用的生命周期中。该作用域仅在上下文感知 Web 时有效。\n6. **global-session**（全局会话）：应用作用域将单个\
  \ bean 定义映射到生命周期。该作用域也仅在上下文感知 Web 时有效。\n\n## bean 的默认作用域是什么？\n\nbean 的默认作用域是 `singleton`。\n\
  \n## 你刚刚说 bean 是单例的。我们可以更改默认的单例作用域吗？\n\n面试官可能会将此问题重构为如下两个问题：\n- 如何更改 bean 的作用域？\n\
  - 如何配置 bean 的作用域？\n\n是的，我们可以通过修改配置来更改作用域，如下代码所示：\n与其使用 `prototype`，我们可以指定 `singleton`、`request`、`session`\
  \ 或 `global-session`。\n\n## 使用注解定义 bean 作用域可能？\n\n可以。我们可以通过注解驱动的组件定义 request 作用域，通过\
  \ session 作用和 application 作用域。\n\n## 是否可以创建自定义的作用域？\n\n可以，开发者可以开发一种新的作用域，称为自定义范围（custom\
  \ scope）。\n\n注意：如果你了解如何创建它，你可以解释如何创建自定义作用域。但只有在你了解流程且不是为了给面试官留好印象而解释时才这样做。他们只是在确保你了解框架特性。聪明是没问题的，但当你知识有限时不要试图表现得过分。\n\
  \n要定义自定义作用域，需要实现 `org.springframework.beans.factory.config.Scope` 接口并重写以下方法：\n\n\
  ```java\nObject get(String name, ObjectFactory objectFactory)\nObject remove(String\
  \ name)\nvoid registerDestructionCallback(String name, Runnable destructionCallback)\n\
  String getConversationId()\n```\n\n## 容器何时进行实例化过程？bean 是急激（eagerly）还是懒性（lazily）初始化？\n\
  \n默认情况下，Spring 容器为每个配置的 bean 急激实例。\n\n## 是否可以更改默认的实例化机制？\n\n再次，这个问题可以重新表述为：\n- 我们可以指示容器进行懒性初始化吗？\n\
  - 如何配置懒性初始化？\n\n可以通过在 XML 配置中配置 `lazy-init` 属性来更改急激初始化机制。配置如下：\n\n```\nbean 可以懒性初始化吗？可以在控制层控制懒性初始化吗？\n\
  ```\n\n是的，可以在容器级别懒性初始化。你认为哪种初始化更好，急激还是懒性？为什么？\n\n配置中的错误或环境中的问题可以在 XML 配置时立即发现，而不是在后期阶段发现。在不希望急激创建实例的情况下，我们可以配置\
  \ `lazy-init=true` 在被请求时创建。\n\n## 什么是自动装配（auto-wiring）？主依赖可以使用自动装配吗？\n\n通常，在定义 bean\
  \ 配置时，我们需要显式说明 bean 的所有依赖。自动装配有助于我们自动注入对象依赖。\n\n自动装配用于包含关系，即一个对象需要注入到另一个对象中。它不适用于\
  \ `long` 类型的主依赖，以及 `String` 类型依赖。\n\n## 自动装配类型有哪些？如何配置它们？\n\n不同的自动装配类型有：\n\n1. **no**：自动装配的默认模式是\
  \ `no`。这意味着开发者需要隐含注入所需的对象依赖。\n2. **byName**：`byName` 自动装配模式根据成员字段名称注入缺失的对象。\n3.\
  \ **byType**：`byType` 自动装配模式根据成员字段类型注入缺失的对象。\n4. **constructor**：`constructor` 自动装配模式通过调用类的参数化构造函数注入依赖。\n\
  \n## 解释 bean 的生命周期\n\n面试官可能会在类似概念上提出以下问题：\n\n\n\n\n\n# Bean 生命周期中的回调方法包含哪些？\n\n\
  ## 是否可以自定义 Bean 的特性？\n\n是的，可以使用某些回调函数来定制 bean 的特性。下图展示了 bean 的生命周期：\n\n![](img/00004.jpg)\n\
  \n图 13.2: Spring 生命周期\n\n## 是否可以设置某种机制，在 bean 实例化后修改其属性？\n\n这个问题可以有以下几种形式的提问：\n\
  - `init-method` 属性的作用是什么？\n- 我们在什么时候可以使用 `InitializingBean` 接口？\n- `InitializingBean`\
  \ 的作用是什么？\n\n在实例化后，如果我们需要修改 bean 的属性，就可以使用 `init` 方法。有几种不同的方法可以实现这一点：\n\n1. 在类中声明一个无参数的\
  \ `public void` 方法并使用该属性。\n2. 可以在类中实现 `InitializingBean` 接口，并重写 `afterPropertiesSet`\
  \ 方法来修改 bean 的属性。\n3. 或者，我们可以写一个通用方法并对其进行注解。\n\n使用 `init-method` 属性和实现 `InitializingBean`\
  \ 接口是实例化后修改 bean 属性的两种方法。哪一个更好呢？\n\n我不会说哪个好坏，而是会提供一些有助于决策选择哪一个的观点。实现接口的好处是，我们不需要在\
  \ bean 实例化后指定容器要调用的方法。但同时，我们需要记住一点：当我们实现一个接口时，代码是紧耦合的。\n\n同时，如果我们正在编写基于 XML 的配置，可以随时更改配置文件。因此，如果我们不倾向于使用紧耦合的类，那么这是一个很好的选择。\n\
  \n## 我们可以拥有自定义的清理方法吗？\n\n这个问题可以以不同的方式重述为：\n- 是否可以写一个方法在销毁 bean 之前释放资源？\n- `destroy-method`\
  \ 属性的作用是什么？为什么要使用 `DisposableBean` 接口？\n- 你能告诉一种提供清理机制的优雅方法吗？\n\n是的，我们可以拥有自定义清理机制。这种清理方法允许开发者在包含\
  \ bean 的容器销毁之前，提供一种关闭所有打开资源的方法或执行某些回滚。\n\n提供清理机制有三种方法：\n1. 在类中提供一个无参数的 `void` 清理方法，并在\
  \ XML 中配置该 bean。\n2. 实现此目的第二种方法是通过让类实现 `DisposableBean` 接口，并重写 `destroy` 方法来提供清理机制。\n\
  3. 或者，我们也可以写一个通用方法并使用 `@PreDestroy` 进行注解。\n\n在每个单独的 bean 配置中都提供 `init-method` 或\
  \ `destroy-method` 是既重复又耗时的。我们是否有替代方法提供默认的初始化或销毁方法？\n\n是的，为每个 bean 配置初始化和销毁方法是重复的。为了避免这种情况，我们可以在每个类中添加相同的方法，这些方法代表\
  \ `init()` 和 `destroy()` 方法。现在，我们可以在配置中通过类中声明的方法名配置 `default-init-method=\"method-name\"\
  ` 或 `default-destroy-method=\"method-name\"` 属性。\n\n## ApplicationContextAware、BeanFactoryAware\
  \ 或 BeanNameAware 是什么用的？\n\n有时，bean 需要访问 `ApplicationContext` 来查找其他 bean。`BeanFactoryAware`\
  \ 允许查找配置好的 bean。有时，bean 期望 `BeanFactory` 能感知它们的名称。在这种情况下，类可以实现\n\n## bean 配置中的 `parent`\
  \ 属性是做什么的？\n\n这个问题可以重述为：\n- 为什么要使用“parent”属性？\n- 解释“parent”属性的作用。\n\nSpring 始终支持减少样板代码。即使在\
  \ XML 配置中也是如此。假设我们有两个 bean 定义，它们的属性和值是相同的。与其重复相同的配置，我们可以通过提供 `parent` 属性在另一个定义中复用第一个。可以使用父类的所有属性值，但同时也允许对少数属性的值进行覆盖。\n\
  \n最棒的部分是，子 bean 定义继承了父类的范围（scope）、方法重写、构造器参数值以及属性值，并且添加新值的选项仍然开放。\n\n## XML 和基于注解的是两种不同的配置方式；你更倾向于哪一个？\n\
  \n这两种方法都是可行的，且各有优缺点。完全取决于哪种在特定场景下更好。\n\n基于 XML 的配置与源码是解耦。因此，人们可以在不接触源码的情况下修改配置。\n\
  \n当我们使用基于注解的配置时，它在声明中提供了上下文。不需要维护额外的配置文件。基于注解的配置更加简洁。\n\n另一个需要考虑的是，XML 允许将配置放置在集中位置。这意味着控制变化变得更容易。然而，当我们使用注解进行配置时，它们分布在整个代码中，此时要控制这种去中心化的配置就很困难了。\n\
  \n## 注解默认是开启的吗？\n\n或者面试官可能会问：\n- 如何开启基于注解的配置？\n\n当我们考虑基于 XML 的配置时，注解是禁用的。当我们要启用注解时，我们需要在\
  \ XML 文件的顶部进行配置。写在 XML 文件顶部的两个 `...` 和 `...` 都会激活基于注解的配置。它们是一样的吗？还是不同的？\n\n注解主要用于启用依赖注入的注解。配置激活了已经注册到上下文中\
  \ bean 的注解。配置会扫描包以检测类中的注解。\n\n## 哪个注解激活了包扫描？\n\n这个问题也可以问为：\n- 应用 `@ComponentScan`\
  \ 注解可以实现什么？\n\n`@ComponentScan` 允许扫描包以检测用于类型和自动注入的类和接口注解。\n\n## 解释类型注解（stereotype\
  \ annotation）\n\n类型注解在应用于类时会将其注册到应用文中。一旦类注册到上下文中，就可以在其他类进行依赖注入。\n\n## 哪些是类型注解？解释\
  \ Spring 中不同的类型注解\n\n以下是 Spring 中存在的不同类型注解：\n- `@Component`: 这是一个通用的 Spring 管理组件。\n\
  - `@Service`: 该注解应用于执行业务逻辑或调用 API 执行某些功能的类。\n- `@Controller`: 该注解应用于处理 HTTP 请求和响应的类。\n\
  - `@Repository`: `@Repository` 注解应用于涉及数据库通信的类。\n\n## 解释 @Configuration\n\n`@Configuration`\
  \ 是类级别的注解。应用它表示该类被 Spring 容器用作 bean 定义的源。\n\n## 解释 @Bean 配置\n\n`@Bean` 注解应用于方法。该注解表示从该方法返回的\
  \ bean 已注册到 Spring 上下文中。\n\n## 为什么要使用 @Autowired？解释 @Autowired 注解\n\n该注解用于依赖的自动注入。`@Autowired`\
  \ 可以用于数据成员、构造函数或 setter 方法。\n\n## 何时使用 @Qualifier 注解？@Qualifier 注解表示什么？\n\n\n\n\n\
  \n当 `@Autowired` 注解应用于依赖项时，通常表示按类型进行自动装配。当我们希望使用属性名称来发现用于注入的缺失属性时，会使用 `@Qualifier`。（它等同于\n\
  \n### `@Required` 注解表示什么含义？\n\n`@Required` 是一个方法级别的注解。当它应用于设置方法（setter method）时，它表示在配置时必须将属性注入到\
  \ bean 中。\n\n### `@Autowired` 和 `@Required` 是一样的吗？推荐使用哪一个？\n\n`@Autowired` 和 `@Required`\
  \ 注解在基于 Spring 的应用程序中扮演不同的角色。\n\n- `@Autowired` 用于标记依赖的自动装配。然而，`@Required` 对于检查属性是否已设置有用。\n\
  - `@Autowired` 可以应用于数据成员、构造函数或 setter 方法，但 `@Required` 仅应用于 setter 方法。\n- 当 `@Autowired`\
  \ 应用于依赖项时，表示属性的注入。如果未发现或依赖项可用，则会抛出异常。在不必注入 bean 的不确定，我们可以配置 `@Autowired(required=false)`\
  \ 来忽略默认的注入行为。\n\n### 为什么要使用 `@Scope` 注解？\n\n默认情况下，Spring 中配置的 bean 是单例（singleton）。当开发者想要更改默认范围时，对类应用该注解如下\n\
  \n### 你能解释一下 Spring MVC 框架的一些特性吗？\n\n- 它围绕前端控制器 MVC 设计模式设计。\n- 它通过 `Controllers`、`Validators`、`Model`\
  \ 和 `View` 对象实现了角色的清晰分离。\n- 数据的绑定和验证。\n- 提供 JSTL 标签以方便数据的绑定。\n\n### 解释 Spring MVC\
  \ 框架\n\n可以通过图示解释 Spring MVC 框架\n\n![](img/00014.jpg)\n\n图 13.3: Spring MVC 框架\n\n\
  Spring MVC 围绕前端控制器 MVC 设计模式设计。每次发出请求时，都会前端控制器处理。根据请求模式，请求被委托给相应的控制器。控制器负责从传入请求中读取数据并对其进行逻辑处理。一旦逻辑部分完成，就可以与用户通信响应了。控制器想要发送给用户的数据被绑定到\
  \ `Model` 对象上。该 `Model` 对象现在将由前端控制器绑定在视图模板中。包含包含数据的模板响应被返回给用户。\n\n### 请解释 Spring\
  \ MVC 设计模式的组件\n\nSpring MVC 围绕前端控制器 MVC 设计模式设计。MVC 代表模型、视图和控制器。\n\n- **Model** 是一个带有数据的对象。这些数据可能从数据库获取，或者使用某些逻辑创建的对象。\n\
  - **View** 由包含 JSTL 代码的简单 JSP 执行；它也可以是 Thymeleaf 模板。\n- **Controller** 是一个被 `@Controller`\
  \ 注解的类，负责处理请求并生成绑定在视图中的模型。\n- **front controller (前端控制器)** 是框架最重要的部分，它处理所有传入的请求并将其委托给后续控制器。前端控制器还负责将响应返回给用户。Spring\
  \ 框架提供的 `DispatcherServlet` 充当前端控制器。\n\n### 在处理 Spring MVC 框架时你用过哪些注解？\n\nSpring\
  \ MVC 框架中存在的注解有：\n\n- 处理 Http 请求和响应的类由 `@Controller` 注解。\n- `@RequestMapping`：此注解用于将\
  \ Web 请求映射到特定的处理器类和/或处理器方法，在这些方法中执行某些逻辑以生成某些可以作为响应返回的数据。\n- 此注解应用于需要执行验证的输入参数。\n\
  - 此注解应用于方法参数或方法的返回值。被注解的参数随后暴露给 Web 视图。\n\n### 前端控制器是如何让控制器委托请求的？\n\n前端控制器在 `web.xml`\
  \ 或部署描述符(`DD`) 中通过标签映射。发现调度请求的控制器的映射位于 `WEB-INF/servlet_name-servlet.xml` 文件中。\n\
  \n注意：尝试不要提供更多映射的信息。不要继续进行映射。\n\n### 你刚刚说映射位于 `WEB-INF/servlet_name-servlet.xml`\
  \ 文件中。这个位置是固定的吗？我们可以更改文件的位置或名称吗？\n\n默认情况下，`WEB-INF/servlet_name-servlet.xml` 文件是位置。但是可以更改文件的位置甚至名称。我们可以配置\
  \ `DD` 中标签的初始化参数来更改位置，如下：\n\n- `/WEB-INF/sub_folder_name/file_name_with_extension`\n\
  \n### 你配置了 1 吗？1 起了什么作用？\n\n`DD` 中的标签指定 servlet 是在项目部署时还是服务器启动时加载。容器按照标签内声明的整数值升序加载\
  \ servlet。如果我们不指定此标签，则 servlet 将按需加载。\n\n### WebApplicationContext 中包含哪些不同的 bean？\n\
  \n以下 bean 存在于：\n\n- 此 bean 负责将传入的请求映射到相应的处理器。\n- 此 bean 帮助将本地名称解析为实际的视图文件名。`ViewResolver`\
  \ 定义了 `prefix` 和 `postfix` 属性，可以应用于本地文件名，框架根据此定位实际的视图文件。\n\n### 你用过消息资源包（message\
  \ resource bundle）吗？它的用途是什么？\n\n是的，用过。`ResourceBundleMessageSource`帮助从属性文件中解析消息。它实现了\
  \ `MessageSource`，其主要用途之一是国际化。\n\n### 你处理过验证吗？验证的方法有哪些？为什么我们需要验证？\n\n与用户交互是软件的目的。用户通过提供某些输入与软件交互，基于这些输入生成输出。但每当用户输入数据时，都有输入错误数据的可能性。例如，假设应用程序要求用户输入电子邮件地址，但用户没有提供格式正确的电子邮件；或者想象要求用户输入年龄，用户输入了小于\
  \ 0 或大于 100 的数字。在这种情况下，假设用户是明的业务逻辑将会失败。因此，必须有一种确保正确性的方法。确保这种正确性的过程就是验证。验证可以在客户端或服务器端进行。客户端验证可以使用\
  \ JavaScript 完成。Spring 提供了 `Validators` 来执行服务器端验证。\n\n在编写自定义验证器的情况下，我们需要编写实现 `Validator`\
  \ 的类并重写 `support` 和 `validate` 方法。`support` 方法检查我们要验证的对象是否为预期类型。`validate` 方法包含应用验证规则的逻辑。为了执行此类验证，验证器必须注册到容器中作为\
  \ bean。\n\n编写自定义验证器是执行验证的方法之一。另一种方法是使用 Hibernate 验证。我们可以将 `@NotNull`、`@Min`、`@Max`、`@Size`\
  \ 注应用于 POJO 数据成员。现在我们可以对控制器请求处理方法的参数应用 `@Valid` 注解。\n\n### 什么是 AOP？\n\nAOP 是面向切面编程，用于编写交叉关注点，并有助于消除代码重复。\n\
  \n\n\n\n\n# 在什么情况下你会倾向于使用 AOP？选择 AOP 的用例有哪些？你能解释参考 AOP 的情况吗？\n\n开发者最重要的职责为客户提供一个集中的解决方案来解决特定的问题或故障。在开发解决方案的同时，开发者还需要考虑并实现异常处理、事务管理和日志记录。这些关注点分布在应用程序的所有层中，导致了代码重复。AOP\
  \ 允许我们在一处编写代码，并根据将其应用到连接点（join point）上。\n\n## 解释 AOP 的概念\n\nAOP 由不同的术语组成：\n\n- **切面（Aspect）**：包含跨切关注点的组件，例如事务管理或日志记录。\n\
  - **点点（Point）**：应用程序中可以应用切面的点。\n- **建议（Advice）**：在特定 `JoinPoint` 上执行的操作。\n- **表达式（Expression）**：用于选择应用建议的\
  \ `JoinPoint` 的表达式。\n- **目标（Target）**：将应用建议的对象称为目标对象。\n- **织入（Weaving）**：将切面与其他应用程序对象链接以创建被增强对象的过程。\n\
  \n## 什么是建议，有哪些类型的建议？\n\n建议是在特定点上采取的操作。\n\n### 建议的类型：\n\n- **前置建议（Before Advice）**：在连接点之前执行。\n\
  - **后置建议（After Advice）**：在连接点之后执行。\n- **返回后建议（After returning Advice）**：在连接点正常完成后执行。\n\
  - **抛出后建议（After throwing Advice）**：在方法抛出异常后执行。\n- **环绕建议（Around）**：在连接点之前和之后执行建议。\n\
  \n## 织入可以通过哪些方式完成？Spring AOP 支持哪些类型的织入？\n\n织入可以在编译时、加载时或运行时进行。Spring AOP 执行的是运行时织入。\n\
  \n## 使用几个示例解释如何编写切入点表达式（pointcut expression）。你能写出切入点表达式来跟踪 com.dao 包中的所有方法吗？\n\n\
  我们可以写如下的切入点表达式：\n\n- `@Pointcut(\"execution(public * *(..))\")` 用于跟踪来自所有包中所有方法的所有连接点。\n\
  - `@Pointcut(\"within(com.dao.MyClass.*(..)\")` 用于跟踪类 `com.dao.MyClass` 中所有方法的连接点。\n\
  - `@Pointcut(\"within(com.dao.*.*(..)\")` 表达式用于跟踪 `com.dao` 包中的所有方法。\n\n你可以参考以下表达式来编写切入点：\n\
  \n- 任何公共方法：`* *(..))`\n- 任何以 \"set\" 开头的方法：`set*(..))`\n- 任何以 \"get\" 开头的方法：`get*(..))`\n\
  - 由 `MyService` 接口定义的任何方法：`com.service.MyService.*(..))`\n- 在 `dao` 包或其子包中定义的任何方法：`com.dao..*.*(..))`\n\
  - `dao` 内部的任何连接点\n- `dao` 包或内的任何连接点\n- 代理实现 `MyService` 接口的连接点：`this(com.xyz.service.AccountService)`\n\
  \n## 解释你使用的切入点设计符（pointcut designators），或者解释你知道的切入点设计符\n\n我工作过的不同的切入点设计符有：\n\n-\
  \ **执行设计符（execution designator）**用于匹配方法执行连接点。\n- 为了将匹配限制在某些类型（如包）内的连接点，使用了 **within\
  \ 设计符（within designator）**。\n- 它用于限制匹配到 bean 引用为给定类型实例的连接点。\n- **目标设计符（target designator）**用于限制匹配到目标对象为给定类型实例的连接点。\n\
  - `@target` 注解限制匹配到执行对象的类具有给定类型注解的连接点。\n- **注解（annotation）**限制匹配到传递的实际参数的运行时类型具有给定类型注解的连接点。\n\
  - **设计符（designator）**限制匹配到具有 `@within` 注解的类型内的连接点。\n- 此 **注解（annotation）**用于限制匹配到连接点的主体具有给定注解的连接点。\n\
  \n## 你能解释环绕建议（Around advice）吗？\n\n这个问题也可以重述为：\n- `Around` 建议与其他建议有何区别？\n- 我们什么时候可以使用\
  \ `Around` 建议？\n\n`Around` 建议在匹配的切入点处运行。它允许在方法执行之前和之后执行工作。它还允许我们决定方法何时以及如何实际执行。据说当我们我们需要共享状态时，它是非常强大的。`around`\
  \ 建议通常用于我们需要在方法执行之前和之后共享状态的情况。例如，它可以用于计算完成方法执行所需的时间。\n\n## 你用过 Spring Boot 吗？解释一下\
  \ Spring Boot。什么是 Spring Boot？\n\nSpring Boot 是一个基于 Java 的框架，有助于创建生产级的独立应用程序以及 Web\
  \ 应用程序。\n\n## 能告诉我们一些 Spring Boot 的功能吗？\n\nSpring Boot 有不同的功能：\n\n- 它帮助或便于独立以及 Web\
  \ 应用程序的创建。\n- 它直接对 Tomcat 等服务器提供内置支持。\n- 它启用了 `Metrics Health Checks` 等功能来创建生产就绪的应用程序。\n\
  - 允许外部化应用程序支持，有助于从单点管理应用程序。\n- 应用程序可以通过简单的属性文件进行配置，而不是基于 XML 的配置。\n- 它提供了许多 starters\
  \ 以便轻松地配置应用程序。\n\n## 你用过 Spring Boot 项目吗？你用过哪些 starters？\n\n是的，我工作过以下 Spring Boot\
  \ starters：\n\n- `spring-boot-starter`\n- `spring-boot-starter-web`\n- `spring-boot-starter-jdbc`\n\
  - `spring-boot-starter-data-jpa`\n- `spring-boot-starter-hateoas`\n- `spring-boot-starter-security`\n\
  - `spring-boot-starter-data-rest`\n\n注意：如果你没有用过所有的它们，不要担心。你可以列出所有的 starters，然后告诉面试官你只用过其中几个。\n\
  \n## 创建 Spring Boot 应用程序有很多方法。你用过几种？能告诉我们创建 Spring Boot 项目的方法吗？\n\n可以通过以下方式创建 Spring\
  \ Boot ：\n\n1. Spring Initializer\n2. Spring Boot CLI\n3. Spring Tool suites\n\n\
  ## 创建 REST 应用你用过哪些注解？\n\n这个问题也可以重述为：\n- 你能解释 REST 应用程序中使用的注解吗？\n- 解释用于 REST 应用程序开发的注解？\n\
  \nREST 应用程序中不同注解有：\n\n- `@RestController`：为创建 REST Web 服务的类提供了一种方便的方法。该注解在 4.0 中引入，结合了\
  \ `@Controller` 和 `@ResponseBody`。\n- `@RequestMapping`：非常常用的注解。它允许将 HTTP 请求映射到\
  \ REST 控制器的处理方法。\n- `@GetMapping`：该注解允许映射 GET 请求到特定的处理方法。它是 `@RequestMapping(method\
  \ = RequestMethod.GET)` 的快捷方式。\n- `@PostMapping`、`@PutMapping`、`@DeleteMapping`\
  \ 和 `@PatchMapping` 是为映射 POST、PUT、DELETE 和 PATCH 方法引入的注解。\n- `@ResponseBody`：该注解告诉控制器返回的对象将被序列化为\
  \ JSON 并传回响应对象。\n\n## 你能解释一下 @PutMapping 和 @PatchMapping 注解吗？\n\n这也可以重述为：\n- 你能解释何时使用\
  \ PUT 和 PATCH 方法吗？\n\n我们可以创建代表 PUT 和 PATCH 方法的方法。并分别在这些方法上应用 `@PutMapping` 和 `@PatchMapping`。\n\
  \n当客户端需要完全替换现有资源时，使用 `PUT` 方法是可行的。\n\n当客户端需要部分替换现有资源时，使用 `HTTP` 方法是可行的。\n\n\n\n\n\
  \n## 哪些是映射处理程序方法的注解？\n\n可用于映射处理程序方法的不同注解有：\n\n- `@GetMapping` 注解允许将 HTTP GET 请求映射到特定的处理程序方法。它是\
  \ `@RequestMapping(method = ` 的快捷方式。\n- `@PostMapping`、`@PutMapping`、`@DeleteMapping`\
  \ 和 `@PatchMapping` 是引入用于映射 `POST`、`PUT`、`DELETE` 和 `PATCH` 方法处理句器的注解。\n\n## Boot\
  \ 中的 runners（运行器）是什么？\n\n你可以获取到与此问题相关的不同问题：\n\n- Spring Boot 提供了哪些 runners？\n- `CommandLinelineRunner`\
  \ 是什么？\n- 你可以使用 Spring Boot 创建一个独立应用程序吗？\n- 如何在 Spring Boot 中创建独立应用程序？\n\n`Runner`\
  \ 是一个接口，它便于在应用程序启动后执行代码。Spring Boot 提供了 `ApplicationRunner` 和 `CommandLineRunner`。`CommandLineRunner`\
  \ 是一个接口。它用于指示一个 bean 在包含在容器时应该运行。它允许创建独立应用程序。\n\n## 如何从请求中读取输入？你使用了哪些注解来读取请求输入？\n\
  \n我们可以使用如下注解从请求中读取输入：\n\n- 该注解用于从请求中读取数据（如表单数据），然后将其自动绑定到方法参数。\n- 该注解将请求体映射到 `Transfer\
  \ Domain Object` 到该类型的方法参数。\n\n## `@RequestParam` 和 `@QueryParam` 之间有什么区别？\n\n这两个注解都用于读取请求参数。`@QueryParam`\
  \ 是 `JAX-RS` 框架提供的注解，而 `@RequestParam` 是 `Spring` 框架的注解。\n\n## 你处理过 Spring Boot\
  \ 的内部数据库吗？\n\n这个问题的后续将是不同的问题：\n\n- 如何配置 H2 数据库？\n- 使用 H2 DB 好吗？\n- 在何时以及如何使用 H2\
  \ DB？\n\n`H2` 是一个用 `Java` 编写的内存数据库。它可以嵌入到 Java 应用程序中。Spring Boot 支持在 Spring Boot\
  \ 应用中集成 `H2`。\n\n要在 Spring Boot 中配置 `H2`，我们需要在 `pom.xml` 文件中添加 `H2` 依赖，然后在 `application.properties`\
  \ 文件中配置数据库属性。现在，在属性文件中配置 `spring.h2.console.enabled=true` 和 `spring.h2.console.path=/h2`。有时，在系统上安装数据库是不可能的或不可行的。这时，我们可以使用内部数据库进行代码测试，而无需担心事先安装和管理专门的数据库服务器。\n\
  \n当 `H2` 也将用于生产环境时，使用 `H2` 是更好的选择。然而，当我们在生产环境中使用不同的数据库时，针对 `H2` 进行代码测试是一个糟糕的选择。\n\
  \n## 如何执行数据库架构创建表或向表中插入记录？\n\nSpring Boot 提供了一种简单的方法来创建表并操作其中的数据。要实现这一点，你可以创建包含\
  \ `DML` 或 `DDL` 语句的 `.sql` 文件进行执行。你必须在该目录下创建文件\n\n该文件将在启动时加载并执行，根据其中编写的 SQL 语句创建表或向其中插入记录。\n\
  \n## How 的用法\n\n`RestTemplate` 用于消耗 REST 应用。`RestTemplate` 为 Web 通信提供了不同的方法，如下：\n\
  \n- 该方法执行指定的 HTTP 方法作为 `GET` 或 `POST`，并返回 `ResponseEntity`，它可以包含 HTTP 状态码、作为对象的资源或两者兼有。\n\
  - 该方法期望 `RequestCallback` 和 `ResultSetExtractor` 作为参数。它便于创建复杂请求或可能处理复杂响应。\n- 该方法执行一个\
  \ `GET` 请求并返回包含状态码和作为对象的 `ResponseEntity`。\n- 该方法执行一个 `GET` 请求并直接返回资源。\n\n注意：虽然这个答案足够了，但你可以添加额外的信息来点缀色彩，例如：与\
  \ `GET` 的 `getForEntity` 和 `getForObject` 一样，我们也有 `post` 和 `put` 的对应方法。\n\n## 什么是\
  \ HATEAOS？\n\n`HATEAOS` 是 `Hypertext As the Engine of Application`（超文本作为应用程序引擎）的缩写。\n\
  \n通常在 HTML 页面中，我们可以在两个资源之间放置超链接。在 Web 服务中，两个资源之间的响应链接由 `HATEAOS` 提供。它便于在两个资源之间创建链接以检索相关信息。它允许为模型类创建链接和资源表示模型链接。它支持链接构建器的\
  \ API，以创建指向 Spring MVC 控制器中声明方法的链接。\n\n## 如何在应用程序中提供 HATEAOS 支持？\n\n要启用 `HATEAOS`，我们需要遵循不同的步骤：\n\
  \n- 在 `pom.xml` 文件中添加 `HATEAOS` 的依赖。\n- 创建由 扩展的 POJO 类\n- 在控制器中，使用 `linkTo()` 方法创建资源之间的链接\n\
  \n## 什么是 Swagger，为什么要使用它？\n\n在 REST 应用中，有许多处理程序方法映射到不同的请求参数和响应类型。向客户端正确传达 REST API\
  \ 文档至关重要。`Swagger2` 是一个用于生成 REST API 文档的开源项目。它还提供了一个用户界面，可以通过 Web 浏览器访问我们的 RESTful\
  \ Web 服务。\n\n最后，这段有趣的旅程到达了终点。`Spring` 框架规模巨大，很难在一个章节中涵盖所有功能。但是，我们已经涵盖了几乎所有可能回答基于\
  \ `Spring` 和 `Spring Boot` 问题所需的概念。\n\n## 结论\n\n在本章中，我们探索了整个 `Spring` 框架。我们讨论了 `Spring`\
  \ 框架的各个组件，以及基于这些组件可能提出的问题。我们还通过不同的问题讨论了 spring 的用处以及我们如何使用 `XML` 文件和注解自定义应用程序的行为。\n\
  \n## 第 14 章\n\n## Hibernate\n\n### 引言\n\n将数据存储在数据库中是应用程序开发中最重要的方面之一。无论是什么种类型的应用程序，我们都需要持久存储数据。在之前的章节中，我们已经看到过如何使用\
  \ `JDBC` 存储数据。你也完全清楚编写 `JDBC` 代码并不是易事。经常，开发者对编写实现 `JDBC` 不同接口的样板代码感到沮丧。`Hibernate`\
  \ 框架为了救星。它提供了一种简化的方法将数据持久化到数据库。`Hibernate` 使用 Java 对象表示数据，并将其映射到可以持久化的表中。这种将对象存储到数据库的方法被称为对象关系映射（ORM），`Hibernate`\
  \ 是它的实现之一。`Hibernate` 通过提供实现对象持久化的配置，让开发工作变得更加简单。\n\n### 结构\n\n在本章中，我们将讨论：\n\n-\
  \ `Hibernate` 的架构\n- `Hibernate` 框架的工作原理\n- `Hibernate` 面试中可能提出的不同面试问题及答案\n\n###\
  \ 目标\n\n\n\n\n\n# Hibernate 简介\n\n在本章结束时，你将能够理解 Hibernate 这种持久化的自动化方法。你将能够处理 Hibernate\
  \ 的不同配置设置以及在该框架中使用的注解。此外，我们还将讨论基于 Hibernate 的不同面试问题。\n\n## 什么是 ORM？\n\n`ORM` 是对象关系映射（Object\
  \ Relational Mapping）。\n\n哪些支持 ORM 的框架？\n\n像 iBatis 等 `ORM` 工具提供了数据持久化的 `JPA`规范实现。\n\
  \n## ORM 有哪些特性？ORM 如何帮助开发者？\n\n以下是 `ORM` 的不同特性：\n- `ORM` 有助于快速开发应用程序。\n- `ORM` 消除了所有的底层细节。\n\
  - 使得继承映射、集合管理变得简单。\n- 它管理事务。\n\n## ORM 或 Hibernate 是否有缺点？\n\n尽管 `ORM` 为应用开发者提供了许多功能，但它也有一些缺点，例如：\n\
  - 开发速度更快，但应用程序性能比传统方式慢。\n- 应用程序的调试变得困难。\n- `Hibernate` 不允许多次插入（注）。\n- 建议在批处理时使用纯\
  \ `JDBC`，因为 `Hibernate` 在批处理中的性能不佳。\n- `Hibernate` 的学习曲线比较耗时。\n\n## 解释 Hibernate\
  \ 的架构？\n\n下图显示了 `Hibernate` 框架的不同组件：\n\n![](img/00009.jpg)\n\n*图 14.1：Hibernate\
  \ 架构*\n\n如图所示，`Hibernate` 框架由不同的组件组成：\n- `SessionFactory`\n- `Connection Provider`（连接提供者）\n\
  - `Transaction Factory`（事务工厂）\n- `Session`\n- `Transaction`（事务）\n\n## 什么是 Hibernate？JPA\
  \ 和 Hibernate 相同还是不同？\n\n`Java Persistence API`（Java 持久化 API）是一种规范，便于访问、管理和持久对象到数据库。`JPA`\
  \ 提供 API 但不提供任何实现，因此它需要实现。\n\n像 iBatis 等 `ORM` 工具提供了数据持久化的 `JPA` 规范实现。`Hibernate`\
  \ 和 `JPA` 之间相互相关，但它们有一些根本性的区别如下：\n\n*表 14.1：Hibernate 和 JPA 的区别*\n\n## 解释你在 Hibernate\
  \ 中使用的接口或核心组件\n\n`Hibernate` 框架的核心接口有：\n\n### Configuration（配置）\n`Configuration`\
  \ 的实例有助于应用程序指定属性和映射文档，这些文档可以用于创建。通常，在应用程序中，我们创建一个单一的 `Configuration` 来构建一个 `SessionFactory`\
  \ 实例。默认情况下，将从 `hibernate.properties` 文件中指定的属性创建一个新的 `Configuration`。\n\n通常，一个应用程序有一个\
  \ `SessionFactory` 实例，为服务客户端请求的线程从该工厂获取 `Session` 实例。`SessionFactory` 的内部状态始终是不可变的。一旦创建实例，该内部状态就会设定，其中包含了关于对象/关系映射的元数据。\n\
  \n### Session（会话）\n`Session` 的主要目的是为映射的实体类实例提供创建、读取和删除操作的。`session` 接口便于执行 CRUD\
  \ 操作，这些操作通过 `PK`（主键）在数据库上执行。另一方面，`Query` 接口提供了一种不使用 `PK` 获取行的方法。`Query` 接口提供了如 `executeUpdate()`、`list()`、`setMaxResult()`\
  \ 等方法，用于对数据库执行操作以处理数据。\n\n以下代码段描述了如何创建和使用 `Query` 对象：\n```java\nQuery sum(salary)\
  \ from\n```\n\n### Criteria（条件）\n`Criteria` 有助于动态构建条件查询对象。它提供了除 `HQL` 和原生 SQL 查询之外的另一种数据检索方式。`Criteria`\
  \ API 设计用于在不使用任何硬编码 SQL 语句的情况下操作数据。\n\n以下代码段描述了如何创建和使用 `Criteria` 对象：\n```java\n\
  Criteria c2 = \n```\n\n### Transaction（事务）\n`Transaction` 允许应用程序通过维护底层事务实现（如 `JTA`）的抽象来定义工作单元。`transaction`\
  \ 实例与 `Session` 关联，通常通过调用调用来实例化。\n\n## Hibernate 中的映射\n\n### 类可以通过多少种方式映射到表/多个表？Hibernate\
  \ 如何实现对象到表的映射的？\n\n`Hibernate` 将类映射到表。我们可以使用两种不同的方法来实现这种映射。首先是在 `XXX.hbm.xml` 文件中进行配置，另一种是在\
  \ POJO 类上使用预定义的注解。\n\n### 在 Hibernate 中维护配置需要哪些文件？\n\n`Hibernate` 需要关于如何与数据库通信以及类如何映射到数据库表的信息。为了实现这一点，`Hibernate`\
  \ 使用 `hibernate.cfg.xml` 文件来配置用于与数据库通信的属性。此外，`XXX.hbm.xml` Bean 文件有助于将类映射到表。\n\n\
  ### 我们可以更改 hibernate.cfg.xml 文件的名称吗？\n\n默认情况下，使用类路径下的 `hibernate.cfg.xml` 来获取实例。但是，也可以更改文件的位置以及使用不同的名称。\n\
  \n我们可以使用以下语法使用另一个文件名：\n```java\nConfiguration configuration = new Configuration();\n\
  ```\n\n### 如何获取 SessionFactory？\n\n我们可以像下面的代码段所示获取 `SessionFactory`：\n```java\n\
  Configuration configuration = new Configuration();\nSessionFactory factory=configuration.configure().buildSessionFactory();\n\
  ```\n\n### 开发者在应用程序中通常创建并可以使用多少个 SessionFactory 对象？\n\n这个问题可以重新表述为：你创建了多少次 `SessionFactory`\
  \ 实例？\n\n\n\n\n第二个数据库可以通过以下方式配置在同一个应用程序中获取另一个 `SessionFactory` 实例：\n\n```java\n\
  Configuration configuration1 = new Configuration();\nSessionFactory factory1=configuration1.configure().buildSessionFactory();\n\
  ```\n\n### `SessionFactory` 是线程安全的对象吗？\n是的，`SessionFactory` 是线程安全的对象；多个线程可以同时访问它。\n\
  \n### `Session` 是线程安全的对象吗？\n不是，`Session` 不是线程安全的对象；多个线程可以同时访问。换句话说，你可以在线程之间共享它。\n\
  \n### 请解释实体的阶段。什么是离态实体（detached entity）？对象的状态有哪些？\n下图显示了实体的不同阶段：\n\n![](img/00010.jpg)\n\
  图 14.2：实体的阶段\n\n- **New（新建）**：通过 `new` 和 `Transient()` 等方法实现新对象状态。这个新创建的对象准备好持久化。\n\
  - **Transient（瞬态）**：如果对象刚刚被创建，但在表中没有标识符或 `PK`，则处于瞬态状态。它没有与 `session` 关联。\n- **Persistent（持久化）**：`Session`\
  \ 对象对瞬态对象调用 `persist()` 等方法，将瞬态对象转换为持久化对象。在持久化状态下，应用程序中的对象代表活动会话数据库中的某行。在此状态下，它与唯一的\
  \ `identifier` 关联。或者，如果会话已打开，且你刚刚在数据库中保存了实例或从数据库中检索了实例，对象处于持久状态。\n- **Detached（离态）**：在离态阶段，应用程序中的对象与数据库没有活动通信。我们可以通过对持久化对象调用\
  \ `ev()` 或 `close()` 方法来实现这种状态。如果会话关闭，对象处于离态状态。无法对处于离态阶段的对象进行操作。如果我们调用 `lock()`\
  \ 或 `update()` 方法，对象将回到持久化状态。\n- **Removed（已删除）**：当对实体调用 `delete()` 方法时，实体会被推入删除状态。此状态下的对象会被交给垃圾回收器。\n\
  \n### 如何将类映射到表？解释将实体映射到表中的行的注解\nHibernate 支持基于 XML 和基于注解的配置来将实体映射到表。\n\n#### 基于\
  \ XML 的配置：\n```xml\nname = \"Employee\" table = \"employee\"\nname = \"name_of_data_memember_to_consider_as_PK\"\
  \ type = \"data_type\" column = \"column_name\"\nname = \"property_name\" column\
  \ = \"column_name\"\n```\n\n#### 基于注解的配置：\n- 使用 `@Entity` 注解 POJO 类。\n- 使用 `@Id`\
  \ 注解数据成员，该成员需要被视为表的 `PK`。\n- 其他数据成员默认成为表的列。默认情况下，数据成员名称被视为列名。然而，可以通过对数据成员使用 `@Column`\
  \ 注解来更改列名。该注解允许自定义属性，如……\n\n### `@Id` 注解的作用是什么？\n当我们对数据成员使用 `@Id` 注解时，该数据成员的值被视为表的\
  \ `PK`。\n\n### `@NaturalId` 的作用是什么？\n`@Id` 注解用于将数据成员标记为 `PK`。必须配合 `@GeneratedValue`\
  \ 使用 `@Id` 来为数据库中的记录创建主键。但有时，实体不使用 `PK` 作为标识，而是使用其他属性，这些属性可以视为自然 ID。如果你想将实体的任何属性作为自然\
  \ ID，可以使用 `@NaturalId` 注解它。\n\n### 你能提供 `@Id` 和 `@NaturalId` 的真实示例吗？\n如果你考虑 `Employee`\
  \ 实体，那么 `empId` 将始终被视为一个属性，即主键，可以使用 `@Id` 注解。但是，与 `Employee` 关联的 `emailAddress`\
  \ 也是唯一的，在某些情况下，可以通过邮箱地址识别员工。因此，`emailAddress` 属性可以使用 `@NaturalId` 注解。\n\n### 是否可以停止数据成员的持久化，或忽略保存到数据库的字段？\n\
  是的，可以忽略一个或多个数据成员在数据库中的持久化。要做到这一点，我们只需要添加 `@Transient` 注解到实体类、映射父类或可嵌入类的属性或字段。`@Transient`\
  \ 有助于忽略字段将其添加到数据库。\n\n### `Session` 提供了哪些方法？\n`Session` 提供的不同方法包括：\n- `save(Object\
  \ object)`：该方法保存给瞬态实例。\n- `saveOrUpdate(Object object)`：该方法允许保存新实例或更新表中的给定实例。\n\
  - `update(Object object)`：该方法允许通过给定离态实例的标识符更新持久化实例。\n- `delete(Object object)`：此方法允许从数据存储中删除持久化实例。\n\
  - `get(String entity_name, Serializable id)`：该方法根据指定的标识符返回给定命名实体的持久化实例。如果没有这样的持久化实例，则可能返回\
  \ `null`。\n- `getTransaction()`：该方法获取与当前会话关联的 `Transaction` 实例。\n- `beginTransaction()`：该方法开始工作单元并返回相关的\
  \ `Transaction` 对象。\n- `createCriteria(String entity_name)`：该方法为指定的实体名称创建一个新的 `Criteria`\
  \ 实例。\n- `createQuery(String query_to_execute)`：该方法为指定的查询字符串创建一个新的 `Query` 实例。\n\
  - `clear()`：该方法清除会话。\n- `close()`：该方法通过释放 JDBC 连接和清理来结束会话。\n\n### `Session` 的 `persist()`\
  \ 和 `save()` 方法有什么区别？\n以下是这两个方法之间的区别：\n- 两个方法都能向数据库插入记录。然而，`persist()` 方法返回 `void`，而\
  \ `save()` 方法返回 `serializable` 对象。\n- 两个方法都能使瞬态实例持久化。然而，`persist()` 方法不保证立即为持久化实例赋值。它可能在\
  \ `flush()` 时执行赋值。\n- 两个方法在事务边界外的行为不同。`persist()` 方法保证在事务边界外被调用时不会执行插入语句。然而，`save()`\
  \ 方法不保证这一点；它会返回标识符。如果为了获取标识符必须执行插入，无论是在事务内还是事务外，插入都会立即发生。\n在 事务边界外的 `persist()`\
  \ 方法对于扩展会话上下文中很有用。相反，`save()` 方法在扩展会话上下文中并不良好。\n\n### 解释 Hibernate 中 `save()`、`saveOrUpdate()`\
  \ 和 `persist()` 方法之间的区别。我们应该使用哪一个？\n`persist()` 方法用于将新实体实例添加到持久化上下。我们通常在向数据库添加记录时调用它，即当我们想要持久化实体实例时。以下代码段显示了如何使用该方法：\n\
  \n```java\nEmployee\nsession.persist(emp);\n```\n当对已经持久化的实例调用 `persist()` 方法时，什么都不会发生。当我们尝试持久化离态实例时，实现将抛出异常。\n\
  \n`save()` 的基本目的与 `persist()` 相同。但该方法保证返回该标识符的可序列化值。以下代码段显示了如何使用 `save()` 方法：\n\n\
  ```java\nEmployee\nLong id= session.save(emp); //long 是 PK 的数据类型\n```\n当对离态实例调用\
  \ `save()` 时，它会创建一个新的持久化实例并分配一个新的标识符。这会导致提交或刷新时在数据库中产生重复记录。\n\n\n\n`merge()` 方法用于从离态（detached）实体实例获取新字段值来更新持久化（persistent）实体实例。`merge()`\
  \ 方法通过已传递对象的 ID 查找实体实例，然后将其字段复制到此新实例中。最后，它返回新更新的实例。以下代码段展示了如何使用 `merge()` 方法：\n\n\
  ```java\nEmployee emp\nsession.save(emp);\nsession.evict(emp);\nemp.setName(\"name\"\
  );\nEmployee emp_new=(Employee)session.merge(emp);\n```\n\n`update()` 方法用于更新数据。该方法作用于传递的对象。`update()`\
  \ 方法将已传递的对象从离态状态转换为持久化状态。如果你向它传递一个瞬态（transient）实体，该方法将抛出异常。以下代码段展示了如何使用 `update()`\
  \ 方法：\n\n```java\nEmployee emp\nsession.save(emp);\nsession.evict(emp);\nemp.setName(\"\
  name\");\nsession.update(emp);\n```\n\n**注意：** 我们没有将 `update` 操作的结果存放在单独的变量中，因为更新是在\
  \ `Employee` 对象本身上进行的。这意味着我们正在将现有的实体实例重新关联到持久化上下文。\n\n`saveOrUpdate()` 方法是一个更安全的方法。当它应用于瞬态实例时，该方法不会抛出异常。在我们不确定表中是否存在某个标识符时，可以使用\
  \ `saveOrUpdate()` 方法。如果不存在，它将在表中添加新的一行。\n\n### 下列代码的输出是什么？\n\n```java\nEmployee\
  \ emp\nemp.setName(\"name\");\nsession.update(emp);\n```\n\n在瞬态实例上调用 `update` 将导致异常。因此，当我们运行上述代码时，它将无法工作。\n\
  \n### `get()` 方法和 `load()` 方法之间有什么区别？\n\n这两个方法实际上都用于获取对象。但它们也有一些区别。这些差异在下表中进行了讨论：\n\
  \n表 14.2：`get()` 和 `load()` 的区别\n\n### 你知道生成器类吗？你工作过多少个生成器类？请解释 Hibernate 中的生成器类\n\
  \n数据库中的每张表都将有一个主键。主键可以由应用程序为该行分配，也可以由底层数据库生成。它用于为持久化类的对象生成唯一标识符。可以使用元素或 `@GeneratedValue`\
  \ 来生成主键（PK）。\n\n必须使用哪种生成器类取决于底层数据库。Hibernate 支持 `assigned`、`increment`、`sequence`、`hilo`、`native`、`identity`、`seqhilo`、`uuid`、`select`、`foreign`。\n\
  \n可以使用 `@GeneratedValue(strategy =)` 根据策略生成主键。我们可以指定策略如下：\n- `GenerationType.AUTO`\n\
  - `GenerationType.IDENTITY`\n- `GenerationType.SEQUENCE`\n- `GenerationType.TABLE`\n\
  \n### `hibernate.hbm2ddl.auto` 代表什么？\n\n属性 `hbm2ddl.auto` 用于在创建 `SessionFactory`\
  \ 时验证并导出数据库的架构。可能的值有：\n- **Create**：创建一个架构\n- **Update**：更新现有架构\n- **Validate**：验证现有架构\n\
  - **Create-drop**：在话开始和结束时自动创建并删除架构\n\n### `hibernate.dialect` 起什么作用？\n\nHibernate\
  \ 将开发者从编写 SQL 查询的责任中解放出来。这些查询由 Hibernate 生成，而不是由开发者。然而，我们不能忽略不同的数据类型以及 SQL 中编写查询和过程的方式。`dialect`\
  \ 指定了 Hibernate 中使用的数据库类型，以确保正确生成对应类型的 SQL 语句。当我们将 Hibernate 连接到应用程序时，配置 `dialect`\
  \ 是关重要的。\n\n### 列出在 Hibernate 中实现继承的不同映射策略\n\n我们可以使用三种继承映射策略之一，通过数据库表来映射层次分类的类：\n\
  1. 每个类层次结构表 (Table Per Class Hierarchy)\n2. 每个具体类表 (Table Per Concrete Class)\n\
  3. 每个子类表 (Table Per Subclass)\n\n### 如何映射类层次结构表、每个具体类表和每个子类表？\n\n#### 每个类层次结构表 (Table\
  \ Per Class Hierarchy)\n在类层次结构映射中，需要一张表来映射整个层次结构。我们在配置中指定一个额外的列（鉴别器列），用于识别类。我们可以通过\
  \ XML 指定鉴别器列，也可以为其提供注解。\n\nXML 文件配置： \n使用注解：\n```java\ndiscriminatorType=DiscriminatorType.STRING\n\
  ```\n\n#### 每个具体类表 (Table Per Concrete Class)\n在每个具体类表的情况下，表会根据类来创建。虽然数据是根据类的定义存储的，但子类表中总是添加重复的列。\n\
  \n该策略可以通过两种方式进行映射：\n- 使用 `union-subclass` 元素：\n- 为每个类使用自建表：\n\n我们也可以使用注解来建立这种关系。要使用基于注解的配置，指定\
  \ `@Inheritance(strategy = )`。该注解表示每个具体类表的策略。它应该只在父类中指定。`@AttributeOverrides` 注解定义了父类属性如何在子类中被覆盖。在表结构中，父类表的列将格添加到子类表中。\n\
  \n#### 每个子类表 (Table Per Subclass)\n在这种策略中，表根据类创建，但通过外键关联。在每个子类表中，与父类相关的子类映射表通过外键进行连接。\n\
  \n基于 XML 的配置：\n我们需要使用 `class` 元素，通过主键和外键关系将子类与父类进行映射。\n\n基于注解的配置：\n要使用基于注解的配置，我们需要在父类中指定\
  \ `@Inheritance(strategy=InheritanceType.JOINED)`，并在子类中使用 `@PrimaryKeyJoinColumn`\
  \ 注解。\n\n### 你能解释映射的优缺点吗？\n\n以下是每种策略的优缺点：\n\n**每个类层次结构表 (Table Per Class Hierarchy)**\n\
  - **优点**：即使对于深层次结构，该策略也提供最好的性能，因为只需要一次查询。\n- **缺点**：每当层次成员发生变化时，都需要对表列进行更改、添加或删除。\n\
  \n**每个子类表 (Table Per Subclass)**\n- **优点**：当修改父类时，该策略不需要对数据库架构进行复杂的更改。适用于浅层次结构。\n\
  - **缺点**：随着层次结构的增长，可能会导致性能下降。构建子类所需的连接数量随之增加。\n\n**每个具体类表 (Table Per Concrete Class)**\n\
  - **优点**：这是最容易实现的继承映射方法。\n- **缺点**：属于父类的数据分散并重复在多个子类表中（这些表代表具体类）。每当父类发生变化时，更改都会反映到大量的表中。这会导致大量的查询操作。\n\
  \n\n\n\n# 多对一关联\n\n多对一关联表示实体之间的双向关系，其中一个对象引用另一个对象的多个引用。反之，另一个对象可以包含对第一个对象的单个引用。这种模式的典型示例可以用\
  \ `Movie`（电影）和 `Review`（评论）表示。`Movie` 可以有多个 `Reviews`，而每个 `Review` 实体可以引用一个 `Movie`。\n\
  \n下面的代码段展示了如何配置 `Movie` 和 `Review` 类来表示这种关联：\n\n### Movie.java\n```java\n@Entity\n\
  @Id\n@GeneratedValue(strategy = GenerationType.AUTO)\n@Column(updatable = false,\
  \ nullable = false)\nprivate Long id;\n\nprivate List reviews = new ArrayList();\n\
  // …\n}\n```\n\n### Review.java\n```java\n@Entity\n{\n@Id\n@GeneratedValue(strategy\
  \ = GenerationType.AUTO)\nprivate Long id;\n\n@ManyToOne\nprivate Movie movie;\n\
  // …\n}\n```\n\n**注意：** 这个问题也可以作为问题“如何在 Hibernate 中映射集合（collections）？”的答案。\n\n#\
  \ 多对多关联\n\n当一个实体可以引用多个实体，而另一个实体也可以引用第一个实体的多个引用时，这种关联被称为多对多关联。一个真实世界的例子是 `Movie`，`Movie`\
  \ 可以有多个 `writers`（作者），而多个 `writers` 可以编写多部 `movies`。\n\n下面的代码段展示了如何为相同的情况编写配置：\n\
  \n### Movie.java\n```java\n@Entity\n@Id\n@GeneratedValue(strategy = GenerationType.AUTO)\n\
  @Column(updatable = false, nullable = false)\nprivate Long id;\n\n@ManyToMany\n\
  @JoinTable(name = \"...\", joinColumns = {@JoinColumn(name = \"movie_id\")})\nprivate\
  \ List authors = new ArrayList();\n// …\n}\n```\n\n### Writer.java\n```java\n@Entity\n\
  {\n@Id\n@GeneratedValue(strategy = GenerationType.AUTO)\nprivate Long id;\n\nprivate\
  \ List books = new ArrayList();\n// …\n}\n```\n\n# 单向映射与双向映射\n\n### 单向\n顾如其名，它是单方向映射。当实体中只有一个包含对另一个实体的引用时，该关联是单向的。当仅有一个实体支持这种关系时，就是单向映射。这意味着我们可以从另一个实例获取一个实例，而另一个实例没有对早期实例的引用。让我们考虑\
  \ `User` 有一个 `Address`。`User` 实例可以访问并更新地址。然而，`address` 并不知道 `User` 正在使用地址，因为地址模型不包含任何对\
  \ `User` 模型的引用。\n\n### 双向\n当两个实体之间的关联是相互的时，它被称为双向映射。换句话说，当两个实体都对对方的引用时，被称为双向映射。这意味着一个实例可以轻松地获取、更新另一个实例。双向映射提供了两个方向的导航访问。考虑同样的例子。`User`\
  \ 有一个 `Address`，现在由于我们使用了双向映射，`Address` 也有了 `User` 实例，并且 `Address` 可以访问并更新彼此。\n\n\
  # 映射计算属性\n\n实体的某个属性需要通过某些表达式进行计算。如何使用 Hibernate 映射此类属性？\n\n为了实现这一点，我们可以在该属性上应用 `@Formula`\
  \ 注解。我们可以使用 SQL 表达式或普通表达式来生成值，这些值可以被 Hibernate 用于持久化。\n\n# 懒加载与 饿加载\n\n`Lazy`（懒加载）和\
  \ `Eager`（饿加载）是 Hibernate 支持的两种数据加载策略，适用于一对一、一对多等关联。\n\n### Eager（饿加载）\n在饿加载中，数据加载发生在父对象被获取时。多对一和一对一等关联默认使用饿加载策略。初始数据的加载可能需要更多时间，因为在加载父对象时，子对象也需要加载。使用\
  \ `fetch = FetchType.EAGER` 属性可以启用饿加载。\n\n### Lazy（懒加载）\n在懒加载中，数据加载只在开发者显式调用 `get`\
  \ 或 `size()` 方法时才发生。默认情况下，多对多和一对多关联使用懒加载策略。在这种情况下，初始加载时间远小于饿加载，因为子对象只有在被显式请求时才会被加载。要启用懒加载，可以使用\
  \ `fetch = FetchType.LAZY` 属性。\n\n# Hibernate 中的级联\n\n级联（Cascading）最简单的字典意思是“某种事物（通常是信息或知识）被连续传递的过程”。\n\
  \n在 Hibernate 中，一个实体与另一个实体具有某种关联。因此，当我们对目标实体执行某些操作时，该操作必须传播到与其具有关联的另一个实体上。这可以通过级联来实现。让我们考虑\
  \ `User` 有一个 `address`。当某人更新 `User` 时，是否更新 `address` 取决于提供 `cascading` 属性的值。\n\n\
  我们有如下级联选项：\n\n- **ALL**：这意味着在容器上执行的“所有”操作将应用于被包含的实体上。在这种情况下，当父实体被持久化时，它的所有相关实体也将被持久化。这意味着\
  \ `save()` 或 `persist()` 操作会级联到相关实体。\n- **REMOVE**：在这种情况下，如果父实体被删除，则所有相关实体也将被删除。\n\
  - **MERGE**：当父实体被合并时，其所有相关实体也被合并。\n- **DETACH**：当父实体被解离时，其所有相关实体也被解离。\n- **REFRESH**：当父实体被刷新时，其所有相关实体也被刷新。\n\
  \nJPA 中没有默认的级联类型；这意味着默认情况下没有操作是级联的。\n\n# 映射 java.util.Date\n\n如何在 Hibernate 中映射\
  \ `java.util.Date`？\n\n当我们把实体的一部分映射到数据库时，Hibernate 默认以纳秒存储。然而，你可以将此格式更改为不同的类型，如：\n\
  \n ** **TIMESTAMP**：以纳秒持久化日期和时间。\n- **TIME**：以纳秒持久化时间。\n- **DATE**：以年、月、日持久化日期。\n\
  \n要使用这些类型，可以使用 `@Temporal` 注解。\n\n# 映射 Enum\n\n如何使用 Hibernate 框架将枚举映射到数据库？\n\n将枚举属性映射到数据库，我们可以使用\
  \ `@Enumerated` 注解。我们可以为此枚举提供不同的值，这决定了枚举元素存储在数据库的方式。如果我们使用默认值，枚举的索引号将被持久化到数据库。但如果我们使用\
  \ `@Enumerated(EnumType.STRING)`，则枚举的字符串值将被持久化到数据库。\n\n# 事务管理\n\n什么是事务？如何在 Hibernate\
  \ 中管理事务？\n\n事务简单代表一个工作单元。这意味着如果某个步骤失败，整个单元都会失败。事务可以用原子性、一致性、隔离性和持久性属性来描述。在 Hibernate\
  \ 中，`Transaction` 接口定义了工作单元。它有 `JTA` 和 `JDBC` 作为事务的实现。事务始终与 `Session` 关联。`session.beginTransaction()`\
  \ 启用新会话的开始。\n\n`Transaction` 接口的方法如下：\n\n- `begin()`：启动新事务。\n- `commit()`：结束工作单元，除非设置了\
  \ `FlushMode.NEVER`。\n- `rollback()`：强制事务回滚。\n- `setTimeout()`：为后续调用 `begin` 启动的任何事务设置特定的超时时间。\n\
  \n\n\n\n\n> 与 SQL 相比，HQL 查询转换带来的性能下降可以忽略不计。\n\n> PL/SQL 程序无法被 HQL 调用。\n\n## 什么是缓存？为什么要使用缓存？\n\
  \n在 Hibernate 中，当从数据库获取更多数据时，由于数据量的大小，应用程序的性能会受到影响。如果每次查找数据，我们需要访问数据库。这个过程通过网络加载数据需要花费更多时间。与其每次都访问数据库，不如访问临时本地存储是一个更好的方法。这种存储是一个缓冲区内存，位于应用程序和数据库之间，被称为缓存内存。缓存内存存储最近使用的数据，以尽可能地减少对数据库的访问次数。\n\
  \n## 解释 Hibernate 中的缓存\n\n这个问题可以重新表述为：\n\n- 你能解释 Hibernate 的缓存架构吗？\n- 解释一级缓存和二级缓存。\n\
  - 解释二级缓存。\n\n下面的图解释了 Hibernate 的缓存架构：\n\n![](img/00015.jpg)\n\n图 14.3：缓存架构\n\n###\
  \ 一级缓存\n\n每当从数据库加载数据时，我们都在无意中使用了一级缓存。一级缓存无非就是 `Session` 缓存。它是一个强制性缓存，所有请求都必须通过它。`Session`\
  \ 对象在将对象提交到数据库之前会将其保留在本地。可以使用一级缓存在本地存储数据，或者存储所需的数据。一级缓存是默认开启的。\n\n### 二级缓存\n\n一级缓存是默认开启的。然而，二级缓存是可选的。在二级缓存尝试定位对象之前，总是会咨询一级缓存。可以按类和按集合为基础来配置二级缓存，它负责跨会话缓存对象。二级缓存维护在\
  \ `SessionFactory` 级别，并对所有会 可用。\n\n二级缓存默认是禁用的。Hibernate 也没有为之提供任何缓存实现。`JBossCache`\
  \ 是某些可以配合使用的第三方缓存。为了处理缓存实现，我们必须实现\n\n## 解释一级缓存和二级缓存之间的区别。或者 Hibernate 中一级缓存与二级缓存的区别\n\
  \n非常基础的区别是，一级缓存维护在 `Session` 级别，而二级缓存维护在 `SessionFactory` 级别。\n\n- 一级缓存仅供维护它的 `Session`\
  \ 访问。然而，二级缓存可供所有人访问。\n- 一级缓存默认开启，但二级缓存默认禁用。\n\n## 缓存和懒性加载之间有什么相似之处？\n\n缓存和懒性加载都有助于提高应用程序性能。但它们的机制和概念非常不同。缓存是将数据存储在\
  \ `Session` 中或使用二级缓存存储在本地。懒性加载仅在被请求时加载数据。在处理一对多关联时，懒性加载是更受关注的。\n\n## 在 Hibernate\
  \ 中什么是不可变类？如何在 Hibernate 中创建不可变类？\n\n类或对象默认是可变的，这允许类或集合进行添加、更新和删除。每当将这种可变性设置为 false\
  \ 时，该类及其相关的集合就不能被更改。我们可以使用 `@Immutable` 注解实体标记为不可变。\n\n`@Immutable` 将实体标记为不可变。当列表、映射或集合很少更改时，可以使用它。该类的更新将被忽略，且不会抛出任何异常。该类仅允许添加和删除操作。\n\
  \n## 不可变性规定对象不能突变，但有时对象需要在数据库中更新。如何更改数据？\n\n人们可以注解类以停止突变。这意味着状态倾向于很少改变。正如此，一旦我们把任何对象设为不可变，就没有办法使用\
  \ Hibernate API 在运行时修改该对象。如果必须更改数据，可以通过 SQL 或管理应用程序手动完成。\n\n注意：在讨论可变性时，必须考虑 Hibernate\
  \ 缓存。当引用数据更改时，必须安排以确保使用该数据的应用程序得到通知。这是通过 `refresh()` 方法或重启应用程序来实现的。\n\n## Hibernate\
  \ 中的自动脏检查（Automatic Dirty checking）是什么？\n\nHibernate 提供自动脏检查作为非常强大的功能之一。在这个概念中，对持久化对象的更改会在会话刷新（flush）或事务提交时自动保存到数据库中。它实现了对象的隐式更新，代码不需要显式调用\
  \ save 或 update。\n\n## 什么是检查策略（inspection strategy）？\n\n当对象从数据库加载时，内存中会保留它的一个快照。现在，当会话刷新时，\
  \ Hibernate 将存储的快照与当前状态进行比较。如果两者不同，对象被标记为脏，为了更新状态，会队列一个的 SQL 命令。Hibernate 的这种策略被称为检查。\n\
  \n## @NamedQuery 注解的作用是什么？\n\n在应用程序的许多场景中，我们需要找到可能具有不同参数的相似查询。因此，开发者总是坚持要求从某些中心化仓库中提取此类查询，而不是重复编写。`@NamedQuery`\
  \ 注解用于声明此类查询。该注解接受两个参数：`name`（查询的标识）和 `query`（你想执行的实际查询）。\n\n## 结论\n\n在本章中，我们通过不同的面试问题讨论了\
  \ Hibernate 的架构。我们讨论了 Hibernate 如何通过提供自动持久化机制来简化重量级 JDBC 代码的使用。我们还讨论了 Hibernate\
  \ 针对关联和继承的不同策略。与此同时，我们涵盖了一级缓存和二级缓存等不同概念，以及它们在持久化机制中起着什么作用。最重要的是，我们讨论了大部分问题及其答案，这些问题在\
  \ Hibernate 面试中可能会问到。\n\n\n\n\n\n# 相比应用开发角色 236\n## 应用开发角色\n## 相比应用部署角色 236\n\n\
