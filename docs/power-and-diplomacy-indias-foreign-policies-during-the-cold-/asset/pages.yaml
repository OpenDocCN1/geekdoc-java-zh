  md: '# Introduction


    # Organization of the Book


    The book has been divided into two parts to enable the more hurried reader to
    engage with such a long piece of work in a-la-carte fashion. This also seemed
    an appropriate way to structure the book because although envisioned as a grand
    comprehensive study, each period has received sufficient historical attention
    to stand on its own. Part 1, or the Nehru period, is about India''s looking beyond
    the subcontinent to remap Asia''s international relations. Part 2, or the Indira
    Gandhi period, is about India''s inward turn and attempts to reorder the subcontinent''s
    affairs. Thus, depending on their interests, readers could engage with either
    period. Others might like to survey the comparative facets of India''s regional
    politics by tracing the evolution of statecraft towards a recurring crisis in
    the neighbourhood.


    Chapter 1 reconstructs Nehru''s role concept by engaging in an analysis of his
    public and private communication record as well as those of his core advisor Krishna
    Menon. Nehru''s regional role concept of India as a peacemaker, it is argued,
    shaped by three core inter-related beliefs—internationalism centred on Asia, rejection
    of the balance of power concept, and the expression of an alternative concept
    of indivisible security called the peace—as well as a mode of statecraft that
    favoured persuasion and accommodation rather than coercion or in-state relations.
    Chapters 2-4 examine three major crises in the Nehru period—the 1950 East Bengal
    crisis, the 1954 Indochina crisis, and the 1955 Formosa or first offshore islands.
    In each crisis, I analyse Delhi''s behaviour to examine whether Nehru''s perceptions
    and policy choices were congruent with his beliefs and images, and peacemaker
    role concept. Collectively, the three cases tell us a story about the Nehru period
    and how India sought to shape the regional order at a time when an escalating
    Cold War seemed poised to unravel peace and security on India''s doorstep and
    across Asia.


    Chapter 5 reconstructs Indira Gandhi''s role concept by analysing the Prime Minister
    and her core advisors'' public and private communication record. Indira Gandhi''s
    regional role concept of India as a security seeker, it is contended, was shaped
    by three core'
