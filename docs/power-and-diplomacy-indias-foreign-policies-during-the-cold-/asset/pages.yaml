    seriously for its impact on shaping the course of events. India''s strategy was
    a logical extension of its role in the first Indochina crisis, namely, to stabilize
    Asia''s geopolitical status quo and prevent an escalation of a regional crisis
    into wider instability or a hot war between two great powers or blocs. More broadly,
    the Formosa crisis is an exemplary case of bridge building and Indian peacemaking,
    which reflected Nehru''s quest to promote patterns of interaction in East Asia
    that could sustain a legitimate and stable equilibrium between America and China.


    Between the fall of 1954 and the summer of 1955, the Western Pacific was on the
    verge of a major power conflict. In the first phase of the crisis, between September
    1954 and April 1955, the prospects of escalation in the Taiwan Straits was perceived
    by Delhi as a distinct possibility as Washington, Taipei, and Beijing engaged
    in a process of brinkmanship over several small islands spread across nearly 400
    miles of China''s eastern seabed. Nehru and Menon treated cautiously but strategically,
    aware of both the complexity of the issues at stake and the risks of entanglement
    in an explosive Sino-American dispute. Indian diplomacy during this phase emerged
    not from a perceived threat to its security interests—for Formosa was several
    thousand miles away from the subcontinent—but from Nehru''s peace area image and
    his approach to Asia''s security order, which was threatened by the prospect of
    an armed confrontation in the Western Pacific.


    In the second phase, after the Bandung Conference and Zhou Enlai''s direct talks
    with Washington, a posture promoted by India, the crisis moved away from being
    a military flashpoint in the East China seas to a political and ideological question.
    Thus, the action shifted from the Taiwan Straits to private and informal diplomatic
    channels with India assuming a crucial bridging role between two mutually suspicious
    and antagonistic powers without any direct communication channels. India not only
    helped reduce regional tension, it also enabled the process, from Zhou Enlai''s
    23 April to the simultaneous declaration of direct US–China ambassador talks in
