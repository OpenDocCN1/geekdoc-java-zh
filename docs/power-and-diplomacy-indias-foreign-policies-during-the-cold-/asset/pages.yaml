  md: '# Introduction


    It is often argued that India''s foreign policy in the post-1991 period witnessed
    a dramatic break from past patterns, with fundamental changes in India''s conception
    of its interests and its international roles and behaviour.¹ It is widely held
    that Indian leaders altered their international images, their ideas relating to
    national interest, the role of force and coercion in statecraft, and beliefs about
    how India ought to relate to its regional and global environment. Most of these
    notions of foreign policy change were not a new phenomenon at all. India''s statecraft
    during the Cold War period was infused by changing beliefs around such themes.
    Mainstream historiography portrays India''s foreign policy as that of a postcolonial,
    non-aligned state standing apart from the Cold War struggle by resisting being
    drawn into the political-military embrace of one or other of the superpowers.
    Such a cursory and static interpretation of a key period of India''s foreign policy
    rests, it is argued in this book, on a neglect of more complex Indian worldviews
    that evolved to coincide state action. The dramatic shift in roles and behaviour
    from the Nehru period in the 1950s to the Indira Gandhi period in the 1960s suggests
    that the so-called ‘rubicon’ or seminal transformation in India''s strategic thought
    and action had in fact been crossed.


    > ¹ C. Raja Mohan, Crossing the Rubicon: The Shaping of India’s New Foreign Policy
    [New Delhi: Viking, 2004].


