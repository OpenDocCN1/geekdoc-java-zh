    Personal testimonies of key former Indian officials combined with limited archival
    material now enable a richer re-construction of Indira Gandhi''s response to the
    Sikkim crisis. This chapter will explore the significant stages in the Indian
    decision-making process prior to Sikkim''s integration with India in 1975 to examine
    how Indira Gandhi''s security seeker conditioned the choices underlying India''s
    strategy. The crisis played out over three main phases. The first phase, between
    1970 and 1972, witnessed intense policy contestations that were reflective of
    a deeper transition from Nehru''s peace-maker role to Indira Gandhi''s security
    seeker role. This internal debate concluded with Indira Gandhi endorsing a new
    line by deciding to intervene in the fall of 1972. The second phase played out
    between October 1972 and May 1973 when covert means were cultivated and employed
    to shape the political conditions for a new agreement with the Chogal. This agreement
    not only restored India''s dominant position in Sikkim, it also altered the electoral
    system to favour representative democracy in that state. In the final post-May
    1973 phase, India continued with its strategy of changing the quo by completely
    displacing the old political structure in Sikkim with new democratic norms, which
    paved the way for a merger with the Indian Union in 1975. The chapter concludes
    by critically probing the reasons for Indira Gandhi''s choices during this crisis.


    # A Brewing Crisis and Competing Images


