    November 1953 was a turning point in India’s external environment as the US chose
    to pursue a formal military alliance with Pakistan, thereby dramatically affecting
    the balance of power in the subcontinent. During this same period, a crisis was
    also brewing in South East Asia, where France supported by the US sought to preserve
    its strategic foothold in Indochina. These two crises were perceived as indivisible
    fronts of a wider threat to Asian security and triggered a response that answered
    to counteract the expansion of the Cold War via an alternative approach to regional
    geopolitical problems. The US-Pakistan pact was seen as another dangerous chapter
    in the Cold War in Asia that required a systemic response. By normalizing relations
    with China and proactively shaping the conflict in Indochina, Nehru sought to
    counteract the emergence of new military alliances by striving to enlarge the
    area of peace in India’s eastern neighbourhood.


