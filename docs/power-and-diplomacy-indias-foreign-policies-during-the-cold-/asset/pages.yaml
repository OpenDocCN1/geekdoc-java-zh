  md: '# 100 Power and Diplomacy


    Despite the lasting significance of the year 1954 for India''s foreign policy,
    and indeed on the contemporary balance of power in the subcontinent, this phase
    remains curiously understudied. There are two main weaknesses in how we look back
    at that year.¹ First, the US-Pakistan alliance and the first Indochina crisis
    are typically examined as distinct events that impacted India''s regional environment.
    Second, the mainstream historiography has located the 1954 Sino-Indian agreement
    over Tibet and Delhi''s normalization with Beijing in an entirely isolated context,
    obscuring the wider changes in Cold War geopolitics as seen from Delhi, and the
    reasons and motivations underlying Nehru''s responses to these crises. In short,
    the deeper images that conditioned Indian behaviour during this period remain
    obscure.


    Structured chronologically, the combined crisis is divided into its two main phases.
    The first phase, from November 1953 to February 1954, witnessed internal policy
    debates regarding an appropriate response to the US-Pakistan military alliance.
    Rejecting the option of a balance of power Nehru set the strategy to deal with
    this regional development by largely accommodating the US-Pakistan part. His prior
    image of indivisible security led to define the crisis on India''s immediate periphery
    as part of a wider security problem in Asia. The second phase began after February
    1954 when Nehru and Menon positioned India into a peacemaker role to confront
    the heightening crisis in Indochina. This shift, it will be shown, was brought
    about by changing Indian perceptions regarding Asian geopolitics, and Nehru''s
    attempt to stabilize the escalating stalemate in the east.


