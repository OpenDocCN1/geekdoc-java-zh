  md: '# Conclusion 361


    exercise leadership, and relate to its smaller neighbours as well as with Pakistan,
    has been a contested theme from the very outset of the republic. Both Nehru and
    Indira Gandhi formulated distinct approaches of sub-regional statecraft that were
    informed by preferences over the appropriate mix and application of persuasion
    and coercion. These images and choices, as we have seen in this book, were never
    simple a function of material constraints or relative power but emerged from how
    Indian leaders defined their overall regional roles and concepts of security and
    order. And these two competing regional philosophies—Neru’s reluctance to impose
    India’s will on its periphery and Indira Gandhi’s willingness to do so—seem to
    keep recurring in contemporary debates over India''s statecraft in Southern Asia.48
    While the contemporary context, of which China’s rise represents no small part,
    might have altered the efficacy of different approaches to the neighbourhood,
    the past still holds lessons that policymakers could draw upon when formulating
    their strategies to shape a friendly and stable periphery.


