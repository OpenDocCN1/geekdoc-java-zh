    neglect of the more complex worldviews and strands of ideas that also conditioned
    Indian geopolitics during the Cold War. Second is the dearth of archival-based
    work on India''s foreign policy more generally, and the absence of a detailed
    empirical examination of regional statecraft under the Nehru and Indira Gandhi


