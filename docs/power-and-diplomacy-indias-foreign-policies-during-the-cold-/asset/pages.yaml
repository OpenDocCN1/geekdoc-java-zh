  md: '# Power and Diplomacy


    If we seek to make informed assessments about India''s future foreign policy and
    possible contestations, we must revisit a much larger and earlier slice of its
    strategic past in order to discern prior policy patterns during times of inflexion
    and change. The Cold War period offers a rich and relatively untapped empirical
    resource that can provide much needed depth to understanding Indian strategic
    and geopolitical practices. And, to truly understand Indian statecraft, one must
    go beyond the study of non-alignment examine the more concrete ideas that have
    informed Indian geopolitics over the years. This book attempts to explicate some
    of these ideas and their application during some of the most significant events
    and crises in India''s immediate and extended neighbourhood over three decades
    during the Cold War.


    # The Argument


    India''s foreign policy during the Cold War period from the 1950s to the 1970s
    was not simply an exercise in the preservation of its strategic independence.
    Analytical focus on a largely unchanging self-image of non-alignment has led scholars
    to downplay what was in fact a dramatic evolution in Indian foreign policy during
    that period. Specifically, by projecting itself initially in an extra-regional
    pacemaker role during the Nehru period, where India intervened in several crises
    in Asian high politics, India''s role dramatically contracted to that of a largely
    subcontinental seeker in the Indira Gandhi period, with narrower conceptions of
    order and security. Importantly, this shift was not simply one of a change in
    geopolitical scope but also a change in the modes of regional policy behaviour.
    The central argument of this book is that this change in Indian statecraft resulted
    from a change in regional role conceptions from the Nehru to the Indira Gandhi
    periods. Role conceptions emerge from policymakers'' beliefs and images relating
    to their state''s interaction with its external environment. As discussed later,
    these include the appropriate scale of regional activity and functional goals,
    orientation to this defined external environment, and the preferred modes of behaviour.
    The behavioural shift between the Nehru and'
