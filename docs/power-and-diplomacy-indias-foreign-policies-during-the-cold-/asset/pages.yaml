    # A Quid Pro Quo


    India Gandhi confronted the second major phase of escalation in the Vietnam war.
    After a 37-day pause between December 1965 and January 1966, the US resumed its
    bombing of North Vietnam on 31 January. This brief interlude of peace witnessed
    another fleeting attempt by India to influence the course of the crisis. In early
    January, Mehta, the CDA in Beijing, expounded on emerging geopolitical trends
    in South East Asia: ‘In the context of the Sino-Soviet feud’, Moscow’s policy
    towards the DRVN aimed to ‘enlarge their influence in Asia, maintain their claim
    to leadership of the socialist block by being steadfast anti-imperialists ...
    and yet not allow a distant confrontation between the China–US to jeopardize the
