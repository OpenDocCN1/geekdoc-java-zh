  md: '# Conclusion


    Within the broad and amorphous confines of non-alignment, Jawaharlal Nehru and
    Indira Gandhi’s responses to regional crises were distinct agency-level responses
    to a tumultuous international environment. But their decisions were not the only
    options available to India. Policy was often contested, sometimes fiercely, from
    within India''s foreign policy apparatus. Close attention to the battle of ideas
    in the decision-making process brings to the surface the competing worldviews
    that animated deliberations during each crisis. Doing so, I hope to have made
    a plausible argument for the presence of the dominant beliefs and role conceptions
    in each period, and their impact on policy choices.


    This book opens the possibility of fruitful enquiries into the evolution of Indian
    strategic thought and practices during the Cold War. First, a focus on the key
    policymakers at the apex—the core decision-making unit—is necessary to avoid the
    reductionism sometimes creeps into leadership or personality-based explanations.
    In both the Nehru and Indira Gandhi periods, we clearly discerned the operation
    of a leader-advisor mechanism in shaping worldviews, framing of crisis events,
    and conceiving and implementing geostrategies. It is unlikely that Indian responses
    to various crises would have played out in the fashion that they did—both in substance
    and in style—had not for the interventions of strategists such as Krishna Menon,
    P.N. Haksar, R.N. Kao, D.P. Dhar, and T.N. Kaul. Future scholarship should treat
    the decision-making setting as it actually existed rather than attempt to arbitrate
    between different personalities in a prejudiced fashion. Future access to Krishna
    Menon’s papers might shed further light on the Nehru period, and India’s approach
    to other crises during the 1950s. In the Indira Gandhi period, the distinct decision-making
    and deliberation style at the apex suggests direct observation into Indira Gandhi’s
    beliefs; her intellectual reasoning is rarely available for scrutiny from the
    evidentiary record. The Prime Minister’s discreet communication style suggests
    that even greater archival access might still obscure key stages of the decision-making
    process when different strategic options were


