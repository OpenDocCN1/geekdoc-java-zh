    The core question that drives this study—What explains the transformation in Indian
    geopolitics during the Cold War?—has certainly been acknowledged before. Michael
    Brecher, for instance, noted the shift from ''an active, dynamic involvement in
    world politics'' under the ''Nehru-Menon conception, to a more passive role, almost
    a withdrawal from conflicts external to India''s narrowly-conceived national interests''.2
    Yet this dramatic shift in the scope and modes of India''s foreign policy behaviour
    between the two periods has not been examined in any depth, and is usually portrayed
    either in terms of a reductionist contrast between an idealistic and naive Nehru
    versus a hard-nosed and insecure Indira Gandhi, or in terms of the structural
    deterministic argument that a changing external environment made India''s foreign
    policy shift all inevitable.^3 These popular images juxtaposing the Nehru and
    Indira Gandhi periods have not received the detailed study they deserve—both conceptually
    and empirically. More broadly, there seem to be two weaknesses in how we study
    India''s foreign policy. First, of the amorphous nature of non-alignment, and
    is thereby unable to account for the variations in India''s foreign policy during
