    Second, an important thumb rule, one I followed, for produc ing plausible ideological
    accounts is greater attentiveness for alter- native explanations. Because there
    could be in-built biases in the private and public evidentiary record, ''we must
    be careful to dis- distinguish reasons for behaviour and reasons actors for their
    behaviour as they are not always the same''.38 In addition, focusing on contestations
    that might have animated a decision- making setting setting despite the presence
    of a dominant leader helps in enhancing our understanding of the foreign policymaking
    process. In fact, most of the six case-studies in this book reveal the pres ence
    of competing worldviews and preferences towards the same circumstance of regional
    events. Contestations were particularly stark during the 1950 East Bengal crisis,
    the outbreak and escala- tion of the Vietnam War, and the Sikkim crisis, often
    emerging from diametrically opposing beliefs on India''s foreign policy and its
    place in the world. Illuminating these contestations brought out the dominant
    role conception and its associated cognitive pic- ture into sharper light, while
    also underscoring the strategic paths that were not taken.39


