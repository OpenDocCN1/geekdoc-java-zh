  md: '# Conclusion


    357


    Finally, an interesting finding from my study is that Indian beliefs did not undergo
    a permanent shift in the post-Nehru period. Although the salience of Nehruvian
    beliefs vis-à-vis an accommodative and conflict avoidance approach to the periphery
    declined in the Indira Gandhi period, these appear to have remained part of the
    strategic culture, albeit outweighed by Gandhi''s beliefs and preference for assertive
    stance. Recall, for example, the intense Parliamentary debates during the Vietnam
    war or the perceptions of senior ME officials during the outbreak of the 1971
    East Bengal crisis, or the competing approaches over how to handle the problem
    of India''s diminishing authority in Sikkim. While these historical contestations
    are set against the post-Cold War absence of Nehruvian beliefs on subcontinental
    states—particularly through methods of reassurance, and strategic restraint—exemplified
