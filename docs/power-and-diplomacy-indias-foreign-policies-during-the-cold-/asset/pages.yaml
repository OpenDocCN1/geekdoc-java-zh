    Operational conditions in the east were also deemed unsuitable for an early intervention.63
    An Indian commander later reflected that a blitzkrieg strike in the spring ‘would
    have been catastrophic’. East Bengal’s ‘large tracts of low-lying areas, which
    get waterlogged by the monsoons’, implied that an intervention ‘even at a short
    notice of four weeks, that is in the middle of May, would have involved the risk
    of forces on various thrust lines getting stuck all over the countryside under
    the impending monsoon’.64 In short, material constraints made an early intervention
    a risky endeavour. Additionally, there was the possibility of Chinese tactical
    tactical actions complicating an Indian intervention in East Pakistan. The contrast
    with Nehru’s perceptions in the 1950 crisis is pertinent to highlight here. The
    dominant reason for Nehru’s reluctance towards a coercive strategy in the first
    Bengal crisis was not a material but an ideational one: a image of ‘war avoidance’
    and a fear of heightening the security dilemma and creating an escalation dynamic
    even in circumstances of a favourable military balance. In 1971, Indira Gandhi
    and her advisors adopted restraint in the initial stages of unfavorable material
    circumstances and not because of a prior belief in conflict avoidance or a fear
    of escalation.


