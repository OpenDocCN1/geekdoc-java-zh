  md: '# Preface


    The Cold War is often called the ‘Long Peace’ when two gladiators strode the planet
    as never before, bearing such destructive arms as had never been seen before in
    human history. We are familiar with this story, where the two superpowers discovered
    in their mutual stability and survival, despite an unasing ideological and geopolitical
    rivalry. On the periphery of that struggle lay a tumultuous and uncertain fate
    for the middle powers that had recently emerged from the thrall of colonialism.
    Like several of its peers, India found itself in the midst of these two colliding
    worlds, and was compelled to craft a policy and strategy. The preservation of
    an independent personality and sovereignty, that is, being non-aligned, was a
    basic impulse for India. However, crafting a foreign policy was about other ideas
    too. This book is about those wider sets of beliefs about how India defined its
    interests and goals produced security in the context of the Cold War. And, it
    was in the neighbourhood where India confronted recurring crises and geopolitical
    challenges. How and why Indian policymakers responded to these regional events
    remains obscured or mired in competing interpretations.


    As analysts and historians, we are obligated to fulfil our main task and offer
    fresh vantage points to understand the past. However, my urge to examine Indian
    statecraft during the Cold War years was not merely to recover the past, which
    may be shrouded in the archives, or to engage in a conversation with other scholars.
    We'
