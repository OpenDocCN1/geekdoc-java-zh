  md: '# Conclusion


    Scholars and strategists continue to de-bate the nature of India’s rise and speculate
    on the purposes and strategies that policymakers might employ to navigate the
    emerging multipolar world. What has often been missing from these conversations
    is a historical perspective and a nuanced attention to past statecraft. Despite
    the importance of the region in India’s foreign policy, surprisingly little empirical
    work has been attempted to understand how India’s leaders and policymakers have
    related to the immediate and extended neighbourhood. Most studies have typically
    emanated from great power perspectives or ‘outside in’ approaches where Indian
    agency is treated rather perfunctoryly. Even when Indian viewpoints have been
    examined, they have provided only partial or highly generalized insights into
    the dominant foreign policy ideas of that time. By relying on the concept of role
    conceptions and going beyond the singular focus on non-alignment, this study has
    attempted to reconstruct the worldviews and strategies that underlay Indian politics
    through three decades of the Cold War. In doing so, this book has also shed light
    on the significant foreign policy shift between the Nehru and Indira Gandhi periods,
    as policymakers redefined some of their most fundamental precepts on India’s role
    in the subcontinent and extended Asian neighbourhood.'
