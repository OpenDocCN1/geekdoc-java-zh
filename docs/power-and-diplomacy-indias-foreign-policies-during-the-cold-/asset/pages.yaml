    # # The Role Conception


    Indira Gandhi''s security seeker role conception embodied three core inter-related
    beliefs: First, a definition of India''s interests in more narrow terms, and a
    regional image centred on the subcontinent rather than an extended Asian space
    that lay at the heart of Nehru''s image. Second, a divisible conception of security
    and an inclination to leverage the balance of power for geopolitical advantage
    rather than reform Asia''s ''interaction culture''26 as per Nehru''s role conception.
    Third, an inclination to employ coercive means to solve disputes or pursue geopolitical
    ends in South Asia rather than a preference for accommodation and strategic restraint
    embodied in Nehru''s worldview.


    # # Contraction in India''s Regional Image


    In 1955, confronting domestic pressure for coercive action against the colonial
    regime in Goa, Nehru had vowed to oppose external involvement in the subcontinent:


    > ... any interference by any other power would also be an interference with the
    political system of India.... It may be that we are weak and cannot prevent interference.
    But the fact is that any attempt by a foreign power to interfere in any way with
    India is a thing which India cannot tolerate, and subject, to her strength, we
    will oppose. That is the broad doctrine I lay down.27


