    The Crisis played out over three main phases prior to the December 1971 war. The
    first phase, from December 1970 to end March 1971, witnessed internal policy contestations
    regarding the nature of this regional problem as Broadly, the debate was divided
    between those who felt interference in Pakistan''s internal conflict was not a
    risk taking and those who advocated the virtues of a coercive strategy. This phase
    concluded with the Prime Minister and her closest advisors defining the East Bengal
    crisis as a strategic opportunity for India. The second phase began in end March,
    when Indira Gandhi and her strategists quickly positioned India into a cover to
    rout the internal insurrection against the East Pakistani regime. Indian policymakers
    also opened strategic conversations with the Soviet Union in order to shape a
    conducive global environment that could sustain India''s strategic preferences
    in the subcontinent, which were fundamentally aimed at changing the status quo
    on its eastern frontiers. The third and climatic phase began in the summer, when
    changing external conditions with respect to potential great power support on
    behalf of Pakistan culminated in the Indo-Soviet treaty, which not only restored
    India''s relative military advantages in the subcontinent but also bolstered Delhi''s
    freedom of action to escalate its involvement in the crisis in the ensuing months.
    The chapter concludes by engaging with some of the most influential accounts of
    the 1971 crisis and suggests why we might need to revise our understanding of
    Indian statecraft in light of what we now know.


