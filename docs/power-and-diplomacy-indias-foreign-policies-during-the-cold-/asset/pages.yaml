    # Power and Diplomacy


    unequivocally advocated an orthodox balance of power choice as Nayar and Paul
    define it, such policy options were consistently overruled by the Prime Minister,
    who favoured an indivisible approach to regional security. For Nehru and Menon,
    the US-Pakistan alliance had disturbed merely the subcontinent''s balance but
    Asia''s balance of power as well. The concurrent Indochina conflict was perceived
    to further exacerbate the Cold War dynamic and potentially entrenched an alliance-based
    system of collective security, which would have undermined the autonomy of India
    and other non-aligned states. The Indian counter-response via the peace area concept
    sought to stave off a further expansion of US-sponsored treaty by neutralizing
    contested regions via a bridge-building strategy that sought to dampen Asian security
    dilemmas as well as East-West competition in India''s extended neighbourhood.
    Indochina, Burma, and Indonesia were seen as the prime locales for Cold War competition
    that might have increased US involvement to a destabilizing level and tilted the
    Asian balance further away from non-aligned states. Nehru and Menon sought to
    stabilize Asia''s geopolitical quo on terms that they believed would not be detrimental
    to the core interests of either bloc. India''s foreign policy soon after the announcement
    of the US-Pakistan pact in late February was built around images and goals.


    This chapter also allows us to question the orthodox view of India''s China and
    South East Asia policy during this phase. Nehru''s China policy has typically
    deconstructed without focusing on his images of India''s larger security environment
    and his peacemaker role at a critical stage of the Cold War in Asia. The mainstream
    historiography has located the 1954 Tibet Agreement in an isolated context. Gopal,
    for instance, focuses primarily on the frontier issue. The context of 1953–4 and
    Nehru''s perceptions of the time are absent in his narrative.¹164 Allahabad Sardesai


