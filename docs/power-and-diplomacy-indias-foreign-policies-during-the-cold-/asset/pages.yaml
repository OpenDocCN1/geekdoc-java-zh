  md: '# Vietnam War and India, 1965–6


    examines India''s foreign policy flux after two traumatic security events in the
    subcontinent—the 1962 and 1965 wars—displaced Nehru''s peacemaker role conception
    with an alternative security seeker role.


    India''s response to the Vietnam war was underpinned by a combination of instrumental
    motives aimed at extracting economic and military assistance from the two superpowers,
    and balance-of-power motives aimed at arresting Chinese influence in South East
    Asia. If during the first Indochina crisis, Nehru had looked beyond South Asia
    to stabilize the Cold War in the second Indochina crisis, Indira Gandhi re-oriented
    India''s foreign policy with an eye on cultivating and exploiting an Asian balance
    of power that could secure India''s position in its sub-regional setting. Structured
    chronologically, the crisis has been divided into two parts. The first section
    examines India''s changing perceptions on Vietnam after the India–China conflict,
    as I discussed in Chapter 5, was the first traumatic event that triggered a role
    flux away from Nehruvian beliefs on security. Examining this phase is important
    because many of the nascent beliefs and images on regional security would also
    manifest and evolve during the subsequent period. I

    Phases. Between January and June 1966, policymakers perceived the renewed escalation
    in Vietnam as largely peripheral to more immediate material interests related
    to India''s economic problems. Indira Gandhi adopted a largely passive posture
    on Vietnam but one that was still distinct from alternative roles like those of
    a classic peacemaker or a frontline state aligned with one of the superpowers.
    After July 1966, India genuinely assumed a more active posture backed by quiet
    diplomacy and sharper pronouncements on the crisis. This shift was brought about
    changing Indian perceptions regarding Asian geopolitics and Indira Gandhi''s attempt
    to re-position India to exploit the changing balance of power and alignments in
    Asia. The conclusion will explore whether Indira Gandhi fluctuating postures during
    this crisis reflected domestic ideological contentations over India''s foreign
    policy or an attempt to legitimize her fledgling regime at home.'
