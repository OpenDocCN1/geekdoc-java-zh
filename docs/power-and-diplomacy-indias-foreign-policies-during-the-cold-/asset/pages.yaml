    **Zorawar Daulet Singh** is a fellow at the Centre for Policy Research, New Delhi,
    India, and is associated with the Institute of Chinese Studies, New Delhi. For
    the past decade, he has been a regular commentator and columnist on India’s foreign
    policy and various dimensions of India–China relations. His co-authored books
    include India–China Relations: The Border Issue and Beyond and Chasing the Dragon:
    Will India Catch up with China!


    Daulet Singh holds a PhD in international relations from King’s College London,
    UK, and an MA in international relations from the School of Advanced International
    Studies, Johns Hopkins University, Washington, DC, USA.'
