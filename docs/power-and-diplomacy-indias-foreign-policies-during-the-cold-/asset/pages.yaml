    the foreign policy worldviews of two different national leaders and their close
    advisors, this book offers fresh insights into how policymakers related to their
    region and neighbourhood during some of the tumultuous events of their time.


    This book questions the notion of an unchanging Nehruvian image of power, which
    has entrenched itself deeply in mainstream historiography on India''s foreign
    policy and continues to shape the nature of contemporary conversations and foreign
    policy debates. We have been living with many sweeping generalizations and interpretations
    of India''s regional statecraft during the Cold War. There is an interesting dichotomy
    between the interpretations of the first wave of scholarship, that is, contemporaneous
    of the Nehru and Indira Gandhi periods, and retrospective evaluations of Indian
    strategic thought and behaviour. Ironically, while the former could glean subtle
    aspects of Indian strategic thought despite the later generation of work has offered
