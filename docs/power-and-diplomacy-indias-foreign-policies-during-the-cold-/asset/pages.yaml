    In short, a political–military arrangement with Moscow was neither a knee-jerk
    reaction nor an ideological move or a quest to move into the Soviet bloc. Rather,
    it was an outcome of an evolutionary balance of power strategy first conceived
    in the late 1960s in the backdrop of changing dynamics in the US-Russia-China
    triangle, and only executed when systemic pressures under the 1971 crisis presented
    formidable constraints on Indira Gandhi’s strategy. Unlike Nehru’s peacemaker
    role, which constrained balance of power strategies for fear of dividing Asia,
    Indira Gandhi’s seeker role made it possible to exploit great cleavages for narrow
