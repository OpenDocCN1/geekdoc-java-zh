    It could be argued that external factors rather than policymakers’ beliefs shaped
    the changes in India’s foreign policy in the post-Nehru period. Shiv Shankar Menon,
    a former National Security Advisor, offers an interesting contrast between the
    structural contexts of the Nehru and Indira Gandhi periods. Although India had
    a favourable power balance in South Asia in both periods, globally, however, the
    bipolar balance worked against India in the Nehru period. By the late 1960s, and,
    especially after 1969, the changing global balance of power and alignments ‘suddenly’
    opened options for India ‘to do things ... to use the imbalance of power in South
    Asia in your favour, and therefore start doing things in Sri Lanka, in Bangladesh,
    in Sikkim ... because you have an international environment within which you can
    do this’. In the 1950s, if India had to exercise its relative power in the subcontinent,
    ‘they the superpowers] would both sit on you’. India’s power ‘imbalance in South
    Asia was unusable’. Post-1969 was one of those ‘moments when the international
    situation actually opens, enabling India to exploit an inherent advantage in its
    region.72 This fascinating reflection is akin to a structural mode of analysis
    where changing international conditions produce efficient and logical responses
    from states. It presumes preferences are largely fixed and a state will respond
    when external conditions evolve. While changes in the external environment certainly
    alter the cost-benefit calculus for states, it is the policymakers’ goal preferences
    and choices that ultimately matter. In short, policy and strategy are ‘shaped
    not by the environment or structure, but by how that environment is defined or
    interpreted by the actors....73 Hence, the availability of systemic windows does
    not imply that different policymakers will perceive, exploit, and finally act
    upon windows of opportunity in a similar fashion.


