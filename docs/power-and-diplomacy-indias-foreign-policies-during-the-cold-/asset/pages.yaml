    India-China conflict, the Maharaja discovered an opening to enhance Sikkim''s
    autonomy and status. His marriage to a young American, Hope Cooke, in 1963 coincided
    with subtle attempts at changing Sikkim''s equation with India and with the world.
    Having ''played his cards quite cleverly'', the Maharaja—now with the elevated
    title of Chogal—began to nurse ambitions and take advantage of India–China relations.
    Delhi was not sure whether ‘the US was trying to fish in troubled waters’. The
    Chogal began to look for opportunities to assert his own identity hoping to'
