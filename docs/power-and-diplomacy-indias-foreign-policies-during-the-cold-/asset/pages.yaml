  md: '# Conclusion 359


    to dissect this one abiding norm but at the cost of overlooking several beliefs
    that have also informed India''s foreign policy. By limiting their interventions,
    scholars have typically obscured the complexity and variation of India''s foreign
    policy since the 1950s. Within the rubric of non-alignment, India has, from the
    very outset, tilted towards different great powers. For example, Nehru''s foreign
    policy almost tilted more towards the West than the East. In fact, for the first
    half of the 1950s, the UK was perceived as an important anchor for India''s foreign
    policy. By the mid-1960s, the Soviet equation became important, and continued
    to grow as global alignments became more unfavourable and even dangerous from
    Delhi''s frame of reference. The 1971 crisis amplified this reordering of India''s
    equations with the great powers. Arguably, there is no ideational constraint peer
    to such a future re-ordering once again. When debates also ought to focus on more
    seriously are the dominant roles and functional goals that India seeks to prioritize
    in their interactions with great powers.


    Nehru had focused on a wider conception of security where the Asian system rather
    than the sub-region was the main area for order building. For Indira Gandhi, this
    was in a narrower realm where Indian leadership was sought and asserted, and the
    balance of power was leveraged unabashedly for that principal purpose. Policymakers
    today should remember despite their contrasting approaches to world order, at
    no stage during the Cold War did Indian leaders contemplate India''s moral and
    material capacity towards the strengthening of any single bloc. Indira Gandhi
    explained it best: "Most of these superpowers we are very friendly with them,
    we do not agree with this attitude of theirs and we are certainly not going to
    help them to have this kind of sphere of influence."46 For such a choice would
    been not only inconsistent with India''s non-aligned identity—or strategic autonomy
    as we prefer to call it today—but it would also have been outright dangerous given
    the intensity of great power competition in that era.


    > 46 Indira Gandhi, The Years of Ende: Selected Speeches of Indira Gandhi, August
