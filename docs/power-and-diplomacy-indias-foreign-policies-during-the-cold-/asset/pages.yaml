    The Conclusion returns to the central theme and examines whether changing role
    conceptions from a peacemaker to a security seeker is a persuasive interpretation
    for the dramatic shift in India''s foreign policy during the Cold War. It then
    situates this study in the broader historiography of India''s foreign policy and
