    The fundamental shift from Nehru–Menon’s images is reflected in how policymakers
    began to view the international order. For the post-Nehru leadership, which coalesced
    around Indira Gandhi, images of world order and security were based on new assumptions
    and lessons drawn from the formative events of the 1960s. Instead of attempting
    to reform the interaction culture of the bipolar system to advance Asian and Indian
    security, leveraging the balance of power dealth purely for instrumental purposes
    became a legitimate means to redress India''s material capabilities or improve
    its immediate regional environment. In addition, the one-step escalation tactic,
    which was central to Nehru’s strategic thought, was no longer deemed valid. As
    one former senior official notes, ‘Until 1962, there was a belief that the international
    system’ would help Indian security.60 But the 1962 and 1965 conflicts had dramatically
    shown the possibility of limited war despite a stable bipolar system on the norm
    of mutual assured destruction. For Indian policymakers, traumatic events had demonstrated
    that the superpowers could not or would prevent limited use of force on the periphery
    of their Cold War struggle.


    Three experiences in India’s interactions with the superpowers in the 1960s also
    shaped the evolution of strategic thinking after Nehru. The first was US attempts
    to leverage its food aid to influence India’s foreign policy. The perceived lesson
    ‘salutary’ and self-reliance became a conscious strategy for Indira Gandhi and
    her advisors..61 The second lesson was regarding the perceived reliability of
    the West in advancing India’s security interests after a very brief phase of strategic
