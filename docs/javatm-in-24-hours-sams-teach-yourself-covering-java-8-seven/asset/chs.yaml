  \n---\n\n要使新类执行一些操作，请在注释 `// TODO code application logic here` 下方的新行中添加以下代码行：\n\n\
  点击此处查看代码图像\n\n`System.out.println(\"I am Spartacus!\");`\n\n`System.out.println()`\
  \ 方法显示一段文本，本例中是句子 “I am Spartacus!”。\n\n确保完全按照所示输入此行。在确认您已正确输入该行并以分号结束后，单击“全部保存”工具栏按钮以保存该类。\n\
  \nJava 类必须先编译为可执行的字节码，然后才能运行它们。NetBeans 会尝试自动编译类。你也可以通过两种方式手动编译此类：\n\n![图像](img/image00476.jpeg)\
  \ 选择菜单命令 `运行`, `编译文件`。\n\n![图像](img/image00476.jpeg) 在“项目”窗格中右键单击 `Spartacus.java`\
  \ 以打开弹出菜单，然后选择 `编译文件`。\n\n如果 NetBeans 不允许你选择这两个选项中的任何一个，则表示它已经自动编译了该类。\n\n如果类未成功编译，则在“项目”窗格中文件名\
  \ `Spartacus.java` 旁边会出现一个红色的感叹号。要修复错误，请将你在文本编辑器中输入的内容与 `Spartacus.java` 的完整源代码（见\
  \ 清单 A.1）进行比较，然后再次保存文件。清单 A.1 中的行号不应出现在你的程序中——它们在本书描述代码工作方式时使用。（此外，第 8 行将包含你自己的用户名，而不是单词\
  \ “User”。）\n\n清单 A.1 Java 类 `Spartacus.java`\n\n点击此处查看代码图像\n\n---\n\n```\n/*\n\n\
