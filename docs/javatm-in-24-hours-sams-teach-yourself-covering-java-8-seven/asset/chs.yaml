  \n—Rogers Cadenhead\n\n## 附录 D. 搭建 Android 开发环境\n\n尽管 Android 应用是用 Java 编写的，但它们需要的不仅仅是标准的\
  \ Java 编程工具。应用需要 Java 开发工具包（JDK）和 Android 软件开发工具包（SDK），一个为 Android 编程量身定制的集成开发环境。它们还需要\
  \ Android 设备的驱动程序。\n\nEclipse 是 Android 最流行且支持最完善的集成开发环境（IDE）。\n\n在本附录中，你将设置所有这些工具，并确保它们能协同工作以运行\
  \ Android 应用。每个工具都是免费的，可以从互联网上下载。\n\n### 开始使用\n\n你可以在以下操作系统上进行 Android 编程：\n\n![Image](img/image00476.jpeg)\
  \ Windows XP 或更高版本\n\n![Image](img/image00476.jpeg) Mac OS X 10.5.8 或更高版本\n\n![Image](img/image00476.jpeg)\
  \ Linux\n\n你需要大约 600MB 的磁盘空间来安装 Android SDK，以及另外 1.2GB 用于 Eclipse IDE。\n\n此时，你应该已经安装了\
  \ Java Development Kit，因为在本书的整个学习过程中，它一直与 NetBeans 一起用于运行 Java 程序。Android 需要 JDK\
  \ 6 或更高版本。\n\n如果你出于某种原因仍然需要 JDK，可以从 [`jdk8.java.net/download.html`](http://jdk8.java.net/download.html)\
  \ 下载。\n\n### 安装 Eclipse\n\n尽管其他 IDE（如 NetBeans）也提供 Android 开发支持，但 Eclipse 已成为编写\
  \ Android 应用的最流行选择。Android 的开发人员将 Eclipse 指定为首选环境，并在其官方文档和教程中广泛使用。\n\n与 NetBeans\
  \ 一样，Eclipse 提供了一个用于编写 Java 程序的图形用户界面。你可以用它来创建任何类型的 Java 程序（它也支持其他编程语言）。\n\nAndroid\
  \ 需要 Eclipse 3.7.2 或更高版本。使用 Eclipse 创建 Android 应用还需要 Android SDK。\n\n> **注意**\n\
  >\n> Eclipse 也用于流行的 Android 编程教程，例如由 Carmen Delessio, Lauren Darcey 和 Shane Conder\
  \ 所著的《Sams Teach Yourself Android Application Development in 24 Hours》第三版（ISBN 0-672-33444-5）。你可以直接从本书过渡到那本书，因为本附录中设置的工具也用在那本书中。我读过那本书，强烈推荐它作为本书的后续。\n\
  \n最简单的设置方法是从 [`developer.android.com/sdk`](http://developer.android.com/sdk) 同时下载\
  \ Eclipse 和 SDK。该网站提供两个版本：ADT Bundle（Eclipse 和 SDK 一起）和 SDK Tools Only（不含 Eclipse）。选择适合你操作系统（Windows、Mac\
  \ OS 或 Linux）的 ADT Bundle 版本。\n\n该软件包以 ZIP 归档文件形式提供，其中包含一个 `eclipse` 文件夹、一个 `android`\
  \ 文件夹和一个名为 SDK Manager 的程序。没有安装程序来指导你在计算机上设置它。`eclipse` 文件夹包含运行 Eclipse 所需的所有文件。`android`\
  \ 文件夹包含 Android SDK，SDK Manager 是一个你将用来管理 SDK 和安装新版本的程序。\n\n> **注意**\n>\n> 要在 Windows\
  \ 中为安装程序所在的文件夹创建快捷方式，请右键单击 Eclipse 应用程序文件，然后选择“创建快捷方式”。可能会出现一个对话框，询问你是否要将快捷方式放在桌面上。单击“是”。你也可以将快捷方式拖动到桌面。\n\
  \n在存放程序的文件夹内创建一个 Eclipse 子文件夹。在我的 Windows 系统中，我将其放在 `Program Files (x86)` 文件夹中。解压\
  \ `eclipse` 和 `android` 文件夹以及 SDK Manager，并将这三项全部放入 `eclipse` 文件夹中。\n\n解压文件后，转到你刚刚创建的\
  \ `eclipse` 文件夹，找到可执行的 Eclipse 应用程序。为该应用程序创建一个快捷方式，并将其放入你的菜单或运行程序的其他位置，例如桌面或任务栏。\n\
  \n### 安装用于 Eclipse 的 Android 插件\n\nEclipse IDE 支持多种编程语言和技术，但并非所有语言和技术都立即得到支持。该 IDE\
  \ 通过提供所需功能的插件进行增强。\n\n第一次运行 Eclipse 时，它必须设置一个插件以将 IDE 与 Android SDK 集成。该插件向 IDE\
  \ 界面添加与 Android 相关的菜单命令，并使得创建和管理 Android 应用成为可能。为此，Eclipse 必须在你的计算机上以完全管理权限运行。这在\
  \ Windows 7 或 Windows 8 上不是默认设置，因此你不能仅仅通过单击来运行程序。相反，请右键单击其快捷方式并选择“以管理员身份运行”。\n\n\
  Eclipse 将自动设置 Android，并显示一个欢迎屏幕，其中包含一个“New Android Application”按钮和多个链接以了解更多关于 Android\
  \ 编程的信息。\n\n你应该定期检查 Eclipse 和 Android SDK 的新更新。随着新手机和其他设备进入市场，Android 正在以惊人的速度发展，SDK\
  \ 必须支持它们。\n\n选择菜单命令 `Help`, `Check for Updates` 以查看 Eclipse 是否已更新。\n\n选择 `Window`,\
  \ `SDK Manager` 运行 Android SDK Manager，它会查找 SDK 更新。管理器为你需要安装的具体项目呈现复选框，如图 D.1 所示。\n\
  \n![Image](img/image00573.jpeg)\n\n**图 D.1** 为 Android SDK 安装新软件包。\n\n有些软件包可能会被自动选中进行更新，这意味着管理器推荐它们。请听从该建议。当你勾选了想要安装的软件包的复选框，并取消勾选不需要的复选框后，单击“Install\
  \ Packages”。\n\n> **警告**\n>\n> 如果更新过程因任何错误而失败，特别是下载文件时出现“访问被拒绝”问题，请关闭 Eclipse 并以完全管理权限重新运行它。这通常能解决问题。\n\
  \nSDK 更新安装后，你可能会被要求关闭 SDK Manager 并再次检查 Eclipse 更新。\n\n### 设置你的手机\n\nAndroid SDK\
  \ 包含一个模拟器，其行为类似于 Android 手机，可以运行你创建的应用。这在你编写应用时非常方便，因为你可以在测试环境中使其工作；然而，在某个时候，你需要查看它在实际\
  \ Android 手机（或其他设备）上的工作方式。\n\n你可以通过计算机的 USB 连接，将使用 SDK 编写的应用部署到 Android 设备上。使用你用来在设备之间传输文件的同一根线缆。\n\
  \n在连接线缆之前，你必须通过以下步骤在手机上启用 USB 调试：\n\n**1.** 在你的手机上运行“Settings”应用，它通常是主屏幕或完整应用程序列表中的应用之一。\n\
  \n**2.** 运行“Settings”应用，选择“Applications”（如有必要），并找到“Development”或“Developer Options”按钮。选择它，然后选中“USB\
  \ debugging”框。\n\n其他设备可能在设置的其他位置有此选项。它的名称类似于“USB connection mode”、“USB debugging”或类似名称。位于\
  \ [`developer.android.com`](http://developer.android.com) 的 Android 网站有关于如何为不同 Android\
  \ 设备设置此选项的文档。\n\n> **注意**\n\n\n\n\n\n# 索引\n\n### 数字\n\n**二维图形, 362**\n\n弧线, 364-365,\
