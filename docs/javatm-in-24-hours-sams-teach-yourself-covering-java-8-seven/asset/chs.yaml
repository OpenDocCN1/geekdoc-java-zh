  \n## 第 22 小时：使用 JAX-WS 创建 Web 服务\n\n本小时待办事项清单：\n\n![Image](img/image00474.jpeg)\
  \ 为 Web 服务定义一个 Java 接口。\n\n![Image](img/image00474.jpeg) 将此接口应用于一个 Java 类。\n\n![Image](img/image00474.jpeg)\
  \ 在互联网上部署一个 Web 服务。\n\n![Image](img/image00474.jpeg) 查看 Web 服务契约。\n\n![Image](img/image00474.jpeg)\
  \ 创建一个 Web 服务客户端。\n\n如今互联网无处不在，驱动着数十亿的台式电脑、网络服务器、电话、视频游戏机和其他设备，将它们连接在一起的愿望催生了 Web\
  \ 服务，这是一种通过 HTTP（Web 协议）与其他软件进行通信的软件。\n\n实现这些连接的一种创新方法是使用 Java XML Web 服务 API（JAX-WS）。JAX-WS\
  \ 是一组创建客户端和服务端的包和类，客户端向 Web 服务发出请求，服务端则接受这些请求。\n\nJAX-WS 支持使用简单对象访问协议（SOAP）和表述性状态转移（REST）实现的\
  \ Web 服务。JAX-WS 大大简化了支持这些协议的任务。作为程序员，你创建 Java 对象并调用方法来使用 Web 服务，其余的工作都由幕后处理。\n\n\
  ### 定义服务端点接口\n\n创建 JAX-WS Web 服务的第一步是创建一个服务端点接口，这是一个 Java 接口，定义了客户端在使用 Web 服务时可以调用的方法。\n\
  \n你本小时正在开发的 `SquareRootServer` Web 服务是一个可以处理两个简单任务的服务：\n\n![Image](img/image00476.jpeg)\
  \ 计算一个数字的平方根\n\n![Image](img/image00476.jpeg) 显示当前日期和时间\n\n接口是一组提供名称、参数和返回类型的方法，但不包含实现这些方法的代码。接口作为对象之间的契约：如果一个对象实现了接口，其他对象就知道可以在该对象上调用接口的所有方法。\n\
  \n在第 15 小时“响应用户输入”中，你必须在任何需要在按钮被点击时接收动作事件的 Java 类中实现 `ActionListener` 接口。\n\n对于这个项目，你正在处理契约的另一方。`SquareRootServer`\
  \ 接口定义了实现该 Web 服务的类中必须存在的两个方法：`squareRoot(double)` 和 `getTime()`。\n\n以下语句定义了该接口：\n\
  \n单击此处查看代码图片\n\n```java\npublic interface SquareRootServer {\n    double getSquareRoot(double\
  \ input);\n    String getTime();\n}\n```\n\n接口中的方法定义后面是分号，而不是围绕块语句的 `{` 和 `}` 字符。接口不定义方法的行为。那是由实现该接口的类来处理的。\n\
  \n因为这些方法可以作为 JAX-WS Web 服务被调用，所以必须在每个方法前添加一个额外的修饰符——注解 `@WebMethod`：\n\n单击此处查看代码图片\n\
  \n```java\npublic interface SquareRootServer {\n    @WebMethod double getSquareRoot(double\
  \ input);\n    @WebMethod String getTime();\n}\n```\n\n#### 使用注解简化 Java 代码\n\n注解是一种更智能的注释形式，可以被\
  \ Java 解释器、编译器和编程工具理解。它们提供了一种定义程序信息的方式，这些信息不是程序本身的一部分，但可以在程序编译或运行时触发操作。\n\n注解以 `@`\
  \ 符号开头，后跟注解的名称。\n\n最常见的注解之一是 `@Override`，它表示一个方法覆盖了超类的方法。这里有一个例子：\n\n单击此处查看代码图片\n\
  \n```java\n@Override\npublic void paintComponent(Graphics comp) {\n    // method\
  \ definition here\n}\n```\n\n\n\n\n## 部署与使用 Web 服务\n\n如果你犯了一个错误，而这个错误没有导致方法覆盖（这会在你使用了错误的类型、错误的方法名或参数数量时发生），编译器能够捕获这个错误。（如果没有注解，编译器将无法检测到这个问题。）\n\
  \n`@WebMethod` 注解表明一个方法可以作为 Web 服务被调用。`SquareRootServer` 接口也使用了 `@WebService` 注解，表明该接口定义了一个服务端点接口。\n\
  \n注解可以接受参数以提供进一步的自定义。`SquareRootServer` 包含最后一个注解：\n\n```java\n@SOAPBinding(style\
  \ = Style.RPC)\n```\n\n此注解有助于定义 Web 服务与调用该服务的客户端程序之间的契约。您将在本章后面学习更多相关内容。\n\n现在，是时候开始编写\
  \ Web 服务的代码了。在 NetBeans 中创建一个新的 Java 文件，类名为 `SquareRootServer`，包名为 `com.java24hours.ws`。将\
  \ 清单 22.1 的内容输入文件中。\n\n**清单 22.1 `SquareRootServer.java` 的完整内容**\n\n点击此处查看代码图像\n\
  \n```\n 1: package com.java24hours.ws;\n 2:\n 3: import javax.jws.*;\n 4: import\
  \ javax.jws.soap.*;\n 5: import javax.jws.soap.SOAPBinding.*;\n 6:\n 7: @WebService\n\
  \ 8:\n 9: @SOAPBinding(style = Style.RPC)\n10:\n11: public interface SquareRootServer\
  \ {\n12:     // get the square root of a number\n13:     @WebMethod double getSquareRoot(double\
  \ input);\n14:\n15:     // get the current time and date as a string\n16:     @WebMethod\
  \ String getTime();\n17:\n18: }\n```\n\n该类已被放置在 `com.java24hours.ws` 包中，这一设计决策使得\
  \ Web 服务更容易被部署，以便其他软件通过互联网访问。\n\n现在，您已经完成了接口的定义，准备编写实现其两个方法的代码：`getSquareRoot()`\
  \ 和 `getTime()`。\n\n### 创建服务实现 Bean\n\n实现服务端点接口的 Java 类称为服务实现 Bean。（学习 JAX-WS 新奇的术语是不可避免的一部分。）\n\
  \n`SquareRootServerImpl` 类实现了 `SquareRootServer` 接口，如类声明所示：\n\n点击此处查看代码图像\n\n```java\n\
  public class SquareRootServerImpl implements SquareRootServer {\n```\n\n这意味着您正在创建的类必须包含接口中的所有方法，并且每个方法都具有正确的参数。\n\
  \n`getSquareRoot(double)` 和 `getTime()` 方法使用您之前学过的技术来实现。\n\n该类唯一的新方面是下面这个注解，它出现在\
  \ `class` 语句之前：\n\n点击此处查看代码图像\n\n```java\n@WebService(endpointInterface = \"com.java24hours.ws.SquareRootServer\"\
  )\n```\n\n此注解表明该类是名为 `com.java24hours.ws.SquareRootServer` 的服务端点接口的服务实现 Bean。您必须使用完整的类名，包括其包名。\n\
  \n请注意，注解后面不跟分号，这与语句不同。\n\n现在开始编写这个类：在包 `com.java24hours.ws` 中创建一个名为 `SquareRootServerImpl`\
  \ 的新 Java 文件，然后将 清单 22.2 的内容填充进去。\n\n> **注意**\n> \n> 名称服务实现 Bean 指的是 JavaBeans，这是为在\
  \ Java 企业版中充当可重用软件组件而设计的特殊 Java 类。然而，在 JAX-WS 中，对 bean 的引用有点名不副实。任何 Java 对象都可以是服务实现\
  \ Bean，只要它遵循 Web 服务方法的规则，并使用正确的注解创建。\n\n**清单 22.2 `SquareRootServerImpl.java` 的完整内容**\n\
  \n点击此处查看代码图像\n\n```\n 1: package com.java24hours.ws;\n 2:\n 3: import java.util.*;\n\
  \ 4: import javax.jws.*;\n 5:\n 6: @WebService(endpointInterface = \"com.java24hours.ws.SquareRootServer\"\
  )\n 7:\n 8: public class SquareRootServerImpl implements SquareRootServer {\n 9:\n\
  10:     public double getSquareRoot(double input) {\n11:         return Math.sqrt(input);\n\
  12:     }\n13:\n14:     public String getTime() {\n15:         Date now = new Date();\n\
  16:         return now.toString();\n17:     }\n18: }\n```\n\n通过您创建的这两个类，您已准备好启动\
  \ Web 服务，以便其他软件可以调用它。\n\n### 发布 Web 服务\n\nJAX-WS Web 服务可以由 Java 应用服务器部署，例如 BEA WebLogic、GlassFish、JBoss\
  \ 和 Jetty。如果您在支持这些服务器的开发环境中创建了 `SquareRootServer` Web 服务，那么此时您已准备好启动它。\n\n您也可以编写自己的\
  \ Java 应用来加载 Web 服务，并使其通过互联网可用。\n\n`SquareRootServerPublisher` 应用程序处理此任务，仅需两个步骤：\n\
  \n![Image](img/image00476.jpeg) 加载实现 Web 服务的类\n![Image](img/image00476.jpeg) 在可从互联网访问的地址上发布该对象\n\
  \n`javax.xml.ws` 包中的 `EndPoint` 类有一个类方法 `publish(String, Object)`，用于部署 Web 服务。\n\
  \n此方法的第一个参数是服务可以被访问的 Web 地址，对于本项目来说是 `http://127.0.0.1:5335/service`。此 Web 地址以主机名\
  \ `127.0.0.1` 开头，称为 localhost，因为它是您用于创建和运行 Java 程序的本地计算机。\n\n地址的第二部分是本地主机上等待连接的\
  \ Web 服务的端口号。端口 5335 是任意选择的，因为它不太可能被您计算机上的其他支持互联网的程序使用。\n\n地址的最后一部分 `/service` 是路径。每个\
  \ Web 服务都必须有一个唯一的路径。如果您在计算机上运行任何其他 Web 服务，它们不能拥有与 `SquareRootServer` 相同的路径。\n\n\
  要部署 Web 服务，请在 `com.java24hours.ws` 包中创建一个名为 `SquareRootServerPublisher` 的 Java 文件。在该文件中输入\
  \ 清单 22.3 的内容。\n\n**清单 22.3 `SquareRootServerPublisher.java` 的完整内容**\n\n点击此处查看代码图像\n\
  \n```\n 1: package com.java24hours.ws;\n 2:\n 3: import javax.xml.ws.*;\n 4:\n 5:\
  \ public class SquareRootServerPublisher {\n 6:     public static void main(String[]\
  \ arguments) {\n 7:         SquareRootServerImpl srsi = new SquareRootServerImpl();\n\
  \ 8:         Endpoint.publish(\n 9:             \"http://127.0.0.1:5335/service\"\
  ,\n10:             srsi\n11:         );\n12:     }\n13: }\n```\n\n当您运行该应用程序时，它会在您计算机的\
  \ 5335 端口上等待连接。您可以从任何支持基于 SOAP 或 REST 的 Web 服务的程序调用 Web 服务的方法，无论该程序是用 Java 还是其他语言编写的。只要您的\
  \ Web 服务在互联网上，任何其他连接到互联网的软件都可以调用其方法。\n\n### 使用 Web 服务定义语言文件\n\n在尝试此 Web 服务之前，您可以使用任何\
  \ Web 浏览器测试 `SquareRootServerPublisher` 应用程序的可用性。\n\n打开浏览器并加载地址 `http://127.0.0.1:5335/service?wsdl`。浏览器将显示\
  \ 清单 22.4 中所示的 XML 文件。此文件由您刚刚创建的应用程序提供。\n\n此文件是使用 Web 服务描述语言 (WSDL) 编写的服务契约，WSDL\
  \ 是一种 XML 方言，用于精确描述 Web 服务的功能，以便服务器和客户端可以充分利用它。\n\n\n\n\n\n# WSDL 服务契约\n\n要创建 JAX-WS\
  \ 服务及访问这些服务的客户端，你无需理解 WSDL。但花点时间粗略浏览其内容，对了解 SOAP 和基于 REST 的 web 服务如何运作是有价值的。\n\n\
  ## 清单 22.4 一个 Web 服务描述语言契约\n\n点击此处查看代码图像\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
  UTF-8\"?>\n<!-- Published by JAX-WS RI at http://jax-ws.dev.java.net. RI's version\n\
  is JAX-WS RI 2.2.2 in JDK 7. -->\n<!-- Generated by JAX-WS RI at http://jax-ws.dev.java.net.\
  \ RI's version\nis JAX-WS RI 2.2.2 in JDK 7. -->\n<definitions xmlns:soap=\"http://schemas.xmlsoap.org/wsdl/soap/\"\
  \nxmlns:tns=\"http://ws.java24hours.com/\"\nxmlns:xsd=\"http://www.w3.org/2001/XMLSchema\"\
  \nxmlns=\"http://schemas.xmlsoap.org/wsdl/\"\ntargetNamespace=\"http://ws.java24hours.com/\"\
  \nname=\"SquareRootServerImplService\">\n<types></types>\n<message name=\"getSquareRoot\"\
  >\n<part name=\"arg0\" type=\"xsd:double\"></part>\n</message>\n<message name=\"\
  getSquareRootResponse\">\n<part name=\"return\" type=\"xsd:double\"></part>\n</message>\n\
  <message name=\"getTime\"></message>\n<message name=\"getTimeResponse\">\n<part\
  \ name=\"return\" type=\"xsd:string\"></part>\n</message>\n<portType name=\"SquareRootServer\"\
  >\n<operation name=\"getSquareRoot\" parameterOrder=\"arg0\">\n<input message=\"\
  tns:getSquareRoot\"></input>\n<output message=\"tns:getSquareRootResponse\"></output>\n\
  </operation>\n<operation name=\"getTime\" parameterOrder=\"\">\n<input message=\"\
  tns:getTime\"></input>\n<output message=\"tns:getTimeResponse\"></output>\n</operation>\n\
  </portType>\n<binding name=\"SquareRootServerImplPortBinding\"\ntype=\"tns:SquareRootServer\"\
  >\n<soap:binding transport=\"http://schemas.xmlsoap.org/soap/http\"\nstyle=\"rpc\"\
  ></soap:binding>\n<operation name=\"getSquareRoot\">\n<soap:operation soapAction=\"\
  \"></soap:operation>\n<input>\n<soap:body use=\"literal\"\nnamespace=\"http://ws.java24hours.com/\"\
  ></soap:body>\n</input>\n<output>\n<soap:body use=\"literal\"\nnamespace=\"http://ws.java24hours.com/\"\
  ></soap:body>\n</output>\n</operation>\n<operation name=\"getTime\">\n<soap:operation\
  \ soapAction=\"\"></soap:operation>\n<input>\n<soap:body use=\"literal\"\nnamespace=\"\
  http://ws.java24hours.com/\"></soap:body>\n</input>\n<output>\n<soap:body use=\"\
  literal\"\nnamespace=\"http://ws.java24hours.com/\"></soap:body>\n</output>\n</operation>\n\
  </binding>\n<service name=\"SquareRootServerImplService\">\n<port name=\"SquareRootServerImplPort\"\
  \nbinding=\"tns:SquareRootServerImplPortBinding\">\n<soap:address location=\"http://127.0.0.1:5335/service\"\
  ></soap:address>\n</port>\n</service>\n</definitions>\n```\n\nWSDL 文件被称为服务契约，因为它规定了如何访问一个\
  \ web 服务、可以与该服务交换哪些消息，以及被传输信息的数据类型。WSDL 契约的第 13 到 22 行定义了 web 服务的方法、这些方法的参数以及响应中返回的数据。仔细查看这些行，看看你是否能确定它在哪里指明`getSquareRoot()`方法接受一个\
  \ double 参数并返回一个 double 值。契约中引用的数据类型并非 Java 数据类型，而是为任何支持 SOAP 的编程语言通用的数据类型。（Web\
  \ 服务并没有特别为 Java 量身定制的部分。）\n\n> **注意：** 由于 WSDL 契约如此详细地定义了一个 web 服务，你可以利用它来自动化 web\
  \ 服务编程的许多过程。Java 开发工具包（JDK）包含一个名为`wsimport`的命令行工具，它以 WSDL 文件作为输入，并生成访问该 web 服务的\
  \ Java 类。\n\n### 创建 Web 服务客户端\n\n在本节中，你将创建`SquareRootClient`，一个能够调用你刚创建的 web 服务方法的\
  \ Java 应用程序。当然，服务必须正在运行，客户端才能连接到它。因为像 JAX-WS 库这样的 web 服务技术支持 SOAP、REST、HTTP 和 XML\
  \ 等标准，所以你不必使用 Java 程序来连接这个平方根 web 服务。Perl、Python、Ruby 和其他语言都有支持 web 服务的库。\n\nJAX-WS\
  \ 库在`javax.xml.ws`包中提供了`Service`类，这是一个用于创建能够调用 web 服务的对象的工厂。\n\n> **谨慎：** 如前所述，URI\
  \ 不一定必须是一个有效的网址。虽然`http://ws.java24hours.com`看起来像一个网址，但这里仅用作一个唯一标识符。我拥有域名`java24hours.com`并控制其子域名的使用。因此，当我指定`http://ws.java24hours.com`作为\
  \ URI 时，我可以合理地确信没有其他 web 服务提供商会使用该标识。\n\n类方法`Service.create(URL, QName)`创建这个工厂。参数是`java.net`包中的一个`URL`对象和`javax.xml.namespace`包中的一个`QName`。`URL`必须是\
  \ web 服务的 WSDL 契约的地址：\n\n```java\nURL url = new URL(\"http://127.0.0.1:5335/service?wsdl\"\
  );\n```\n\n`QName`是一个限定名称，一个与 web 服务提供者关联的 XML 标识符。限定名称由一个命名空间 URI 和一个本地标识符组成。命名空间\
  \ URI 类似于 URL，但不一定能作为网址访问。由于平方根 web 服务的包名是`com.java24hours.ws`，按照 Java 惯例，这与 Internet\
  \ 主机名`ws.java24hours.com`关联，因此该 web 服务的命名空间 URI 是`http://ws.java24hours.com`。web\
  \ 服务的本地标识符是服务实现 Bean 的名称后跟“Service”一词。以下是创建限定名称的语句：\n\n```java\nQName qname = new\
  \ QName(\n    \"http://ws.java24hours.com/\",\n    \"SquareRootServerImplService\"\
  \n);\n```\n\n有了 URL 和限定名称，你就可以创建 web 服务客户端工厂：\n\n```java\nService service = Service.create(url,\
  \ qname);\n```\n\n该工厂有一个`getPort(Class)`方法，用于创建指定类的对象。要标识一个 Java 类作为方法参数使用，需使用该名为`class`的类变量。感到困惑吗？当你在\
  \ Java 语句中看到它时会更清楚：\n\n```java\nSquareRootServer srs = service.getPort(SquareRootServer.class);\n\
  ```\n\n使用`SquareRootServer.class`作为参数调用`getPort()`会导致工厂创建一个`SquareRootServer`对象。该对象存储在`srs`变量中。像调用\
  \ Java 中的任何其他对象一样调用`SquareRootServer`对象的方法：\n\n```java\nSystem.out.println(srs.getTime());\n\
  System.out.println(srs.getSquareRoot(625D));\n```\n\nJAX-WS 库将这些方法调用打包成 SOAP 消息，通过互联网发送到\
  \ web 服务，并传输调用。当服务响应这些调用时，它将响应打包为 SOAP 消息，通过互联网发送回来，然后它们被转换回 Java 数据类型。通过创建一个名为`SquareRootClient`的\
  \ Java 文件，并在其中输入清单 22.5 中的文本，将所有这些整合在一起。\n\n## 清单 22.5 `SquareRootClient.java`的完整内容\n\
  \n点击此处查看代码图像\n\n```java\npackage com.java24hours.ws;\n\nimport java.net.*;\nimport\
  \ javax.xml.namespace.*;\n```\n\n\n\n\n# 第 22 小时。创建和使用 Web 服务\n\n```java\nimport\
  \ javax.xml.ws.*;\n\npublic class SquareRootClient {\n    public static void main(String[]\
  \ arguments) throws Exception {\n        URL url = new URL(\"http://127.0.0.1:5335/service?wsdl\"\
  );\n        QName qname = new QName(\n            \"http://ws.java24hours.com/\"\
  ,\n            \"SquareRootServerImplService\"\n        );\n        Service service\
  \ = Service.create(url, qname);\n        SquareRootServer srs = service.getPort(SquareRootServer.class);\n\
  \n        System.out.println(srs.getTime());\n        System.out.println(srs.getSquareRoot(625D));\n\
  \   }\n}\n```\n\n当你运行客户端应用程序时，如果 `SquareRootPublisher` 应用程序正在运行，你会看到如 图 22.1 所示的输出。\n\
  \n![Image](img/image00548.jpeg)\n\n**图 22.1** 调用 Web 服务并显示响应。\n\n## 小结\n\n`JAX-WS`\
  \ 包和类集合是基于 XML 的远程过程调用（JAX-RPC）Java API 的后续技术，用于通过互联网从一个 Java 对象向另一个进行远程过程调用。另一个\
  \ API `JAX-RS` 则支持使用 REST 的 Java Web 服务。\n\n能够调用其他软件，无论其位置和编写所用的编程语言，是成为流行趋势的软件开发基石之一，该趋势在\
  \ Web 2.0 名称下得到普及。\n\nWeb 2.0 背后的卖点是使软件能够充分利用互联网无处不在的连接性，就像自 Web 在 1990 年代中期流行以来人类所享受的那样。\n\
  \n本小时涵盖了使用 `JAX-WS` 创建和使用 Web 服务的所有四个步骤。你可以创建服务的接口（服务端点接口）、实现服务（服务实现 Bean）、在互联网上发布服务，以及创建客户端来访问它。\n\
  \n许多编程工具，包括 `NetBeans` 和 `JDK`，使得自动生成代码成为可能，从而简化了创建和访问 Web 服务的任务。\n\n## 研讨会\n\n\
  ### 问与答\n\n**问.** `XML-RPC` 如何与 `SOAP` Web 服务契合？\n\n**答.** `XML-RPC` 是一种通过 HTTP（Web\
  \ 协议）以 XML 格式调用方法和接收数据的协议。`SOAP` 也包含所有这些功能，事实上这两种 Web 服务协议共享共同的起源。\n\n`XML-RPC`\
  \ 源自最终成为 `SOAP` 的协议草案版本。因为 `XML-RPC` 出现得更早且实现更简单，它发展了自己的追随者并至今仍然流行。Apache `XML-RPC`\
  \ Java 库，可从 [`ws.apache.org/xmlrpc`](http://ws.apache.org/xmlrpc) 获取，支持创建使用 `XML-RPC`\
  \ 的 Web 服务和客户端。\n\n`SOAP` 是一种更复杂的 Web 服务协议，支持更广泛的客户端/服务交互。\n\n**问.** 我不清楚为什么一个名为\
  \ `com.java24hours.ws` 的包与互联网主机 [`ws.java24hours.com`](http://ws.java24hours.com)\
  \ 相关联。这是如何工作的？\n\n**答.** Java 包名由开发该包的程序员选择。Oracle 以 `java` 或 `javax` 开头命名来自 Java\
  \ 类库的 Java 包，例如 `java.util` 和 `javax.swing`。当其他程序员创建包时，他们遵循一种惯例，以防止两个实体选择相同的包名而相互混淆。\n\
  \n惯例是选择一个基于实体拥有的东西（域名）的包名，并将其反转，使最后一部分放在前面。作为域名 `cadenhead.org` 的所有者，我创建了包名以 `org.cadenhead`\
  \ 开头的 Java 类，例如 `org.cadenhead.web`。拥有 `apache.org` 的 Apache 软件基金会，将其 `XML-RPC`\
  \ 包称为 `org.apache.xmlrpc`。\n\n**问.** 互联网上的第一个网站是什么？\n\n**答.** 第一个网站是 [`info.cern.ch`](http://info.cern.ch)，它今天仍然在线。蒂姆·伯纳斯-李，一位在欧洲核子研究中心（CERN）工作的英国物理学家，使用该网站来描述他的新发明——万维网。\n\
  \n第一个网页位于 [`info.cern.ch/hypertext/WWW/TheProject.html`](http://info.cern.ch/hypertext/WWW/TheProject.html)，并随着\
  \ Web 吸引用户、出版者和软件开发者而每日更新。\n\n该网站将 Web 定义为“一个旨在使大量文档获得普遍访问的广域超媒体信息检索计划。”\n\n###\
  \ 测验\n\n通过回答以下问题，看看你关于 Web 服务的知识填充了多少。\n\n**1.** 什么是服务实现 Bean？\n\n**A.** 一个标识通过\
  \ Web 服务可达的方法的接口\n\n**B.** 一个实现 Web 服务的类\n\n**C.** Web 服务与调用该服务的客户端之间的服务契约\n\n**2.**\
  \ 当文本如 `@WebMethod` 或 `@Override` 出现在方法声明中时，它被称为什么？\n\n**A.** 注解\n\n**B.** 断言\n\n\
  **C.** 一种恼怒\n\n**3.** `WSDL` 代表什么？\n\n**A.** Web Services Deployment Language\n\n\
  **B.** Web Services Description Language\n\n**C.** Lucy in the Sky with Diamonds\n\
  \n### 答案\n\n**1. B.** 答案 A 指的是服务端点接口。\n\n**2. A.** 尽管我猜答案 C 也可能成立，具体取决于你在本节中遇到了多少麻烦。\n\
  \n**3. B.** 它经常被错误地称为 Web Services Definition Language。\n\n### 活动\n\n为了进一步巩固你对本小时主题的知识，请完成以下活动：\n\
  \n![Image](img/image00476.jpeg) 为平方根 Web 服务添加一个将数字乘以 10 的方法，并修改 `SquareRootClient`\
  \ 应用程序以调用该方法。\n\n![Image](img/image00476.jpeg) 创建一个新的 Web 服务，如 第 21 小时 “读取和写入文件”\
  \ 所述，从属性文件读取一个地点的最高温度、最低温度和天气状况，并将此数据发送给调用该 Web 服务的客户端。\n\n要查看实现这些活动的 Java 程序，请访问本书网站\
  \ [www.java24hours.com](http://www.java24hours.com)。\n\n# 第 23 小时。创建 Java2D 图形\n\
  \n## 本小时待办事项：\n\n![Image](img/image00474.jpeg) 设置文本的字体和颜色。\n\n![Image](img/image00474.jpeg)\
  \ 设置容器的背景颜色。\n\n![Image](img/image00474.jpeg) 绘制线条、矩形和其他形状。\n\n![Image](img/image00474.jpeg)\
  \ 绘制 GIF 和 JPEG 图形。\n\n![Image](img/image00474.jpeg) 绘制填充和未填充的形状。\n\n在本小时中，你将学习如何将\
  \ Swing 容器——用于容纳图形用户界面（GUI）组件的纯灰色面板和框架——变成一个艺术画布，在上面可以绘制字体、颜色、形状和图形。\n\n## 使用 Font\
  \ 类\n\nJava 中的颜色和字体由 `java.awt` 包中的 `Color` 和 `Font` 类表示。通过这些类，你可以用不同的字体和大小呈现文本，并更改文本和图形的颜色。字体使用\
  \ `Font(String, int, int)` 构造方法创建，该方法接受三个参数：\n\n![Image](img/image00476.jpeg) 字体的字体名称，可以是通用名称（“Dialog”、“DialogInput”、“Monospaced”、“SanSerif”或“Serif”）或实际字体名称（“Arial\
  \ Black”、“Helvetica”或“Courier New”）\n\n![Image](img/image00476.jpeg) 样式，为以下三个类变量之一：`Font.BOLD`、`Font.ITALIC`\
  \ 或 `Font.PLAIN`\n\n![Image](img/image00474.jpeg) 字体的大小（以磅为单位）\n\n以下语句创建一个 12 点斜体\
  \ Serif 的 `Font` 对象：\n\n点击此处查看代码图片\n\n```java\nFont current = new Font(\"Serif\"\
  , Font.ITALIC, 12);\n```\n\n\n\n\n如果使用特定字体而非通用字体之一，则必须将其安装在运行程序的用户的计算机上。可以通过组合字体样式，如以下示例所示：\n\
  \n```java\nFont headline = new Font(\"Courier New\", Font.BOLD + Font.ITALIC, 72);\n\
  ```\n\n当您获得字体后，可调用 `Graphics2D` 组件的 `setFont(Font)` 方法将其指定为当前字体。所有后续的绘图操作都将使用该字体，直到设置另一个字体为止。以下示例中的语句创建一个\
  \ \"Comic Sans\" 字体对象，并在绘制文本前将其指定为当前字体：\n\n```java\npublic void paintComponent(Graphics\
  \ comp) {\n    Graphics2D comp2D = (Graphics2D) comp;\n    Font font = new Font(\"\
  Comic Sans\", Font.BOLD, 15);\n    comp2D.setFont(font);\n    comp2D.drawString(\"\
  Potrzebie!\", 5, 50);\n}\n```\n\nJava 支持抗锯齿功能，可以更平滑地绘制字体和图形，使其外观棱角更少。要启用此功能，必须在\
  \ Swing 中设置渲染提示。`Graphics2D` 对象有一个 `setRenderingHint(int, int)` 方法，它接受两个参数：\n\n\
  ![Image](img/image00476.jpeg) 渲染提示的键\n\n![Image](img/image00476.jpeg) 要与该键关联的值\n\
  \n这些值是 `java.awt` 类库中 `RenderingHints` 类的类变量。要激活抗锯齿，需使用两个参数调用 `setRenderingHint()`：\n\
  \n```java\ncomp2D.setRenderingHint(RenderingHints.KEY_ANTIALIASING,\n    RenderingHints.VALUE_ANTIALIAS_ON);\n\
  ```\n\n此示例中的 `comp2D` 对象是表示容器绘图环境的 `Graphics2D` 对象。\n\n### 使用颜色类\n\nJava 中的颜色由 `Color`\
  \ 类表示，该类包含以下作为类变量的常量：`black`、`blue`、`cyan`、`darkGray`、`gray`、`green`、`lightGray`、`magenta`、`orange`、`pink`、`red`、`white`\
  \ 和 `yellow`。\n\n在容器中，您可以通过调用 `setBackground(Color)` 方法，使用这些常量设置组件的背景色，如下所示：\n\n\
  ```java\nsetBackground(Color.orange);\n```\n\n当前颜色（如同当前字体）必须在使用 `setColor(Color)`\
  \ 方法进行绘图之前设置。以下代码包含一条将当前颜色设置为橙色并以该颜色绘制文本的语句：\n\n```java\npublic void paintComponent(Graphics\
  \ comp) {\n    Graphics2D comp2D = (Graphics2D) comp;\n    comp2D.setColor(Color.orange);\n\
  \    comp2D.drawString(\"Go, Buccaneers!\", 5, 50);\n}\n```\n\n与您可以直接在容器上调用的 `setBackground()`\
  \ 方法不同，您必须在 `Graphics2D` 对象上调用 `setColor()` 方法。\n\n### 创建自定义颜色\n\n您可以通过指定其标准红绿蓝\
  \ (sRGB) 值在 Java 中创建自定义颜色。sRGB 通过颜色中红、绿、蓝的含量来定义颜色。每个值的范围从 0（无该颜色）到 255（最大值）。\n\n\
  构造函数 `Color(int, int, int)` 接受代表红、绿、蓝值的参数。以下代码绘制一个面板，在深红色（235 红，50 绿，50 蓝）背景上显示浅橙色文本（230\
  \ 红，220 绿，0 蓝）：\n\n```java\nimport java.awt.*;\nimport javax.swing.*;\n\npublic\
  \ class GoBucs extends JPanel {\n    Color lightOrange = new Color(230, 220, 0);\n\
  \    Color darkRed = new Color(235, 50, 50);\n    public void paintComponent(Graphics\
  \ comp) {\n        Graphics2D comp2D = (Graphics2D) comp;\n        comp2D.setColor(darkRed);\n\
  \        comp2D.fillRect(0, 0, 200, 100);\n        comp2D.setColor(lightOrange);\n\
  \        comp2D.drawString(\"Go, Buccaneers!\", 5, 50);\n    }\n}\n```\n\n---\n\n\
  注意\n\nsRGB 值可以创建 1650 万种可能的颜色组合，尽管大多数计算机显示器只能近似呈现其中的大部分。关于炭火午夜蓝是否与中度褪色婴儿绿相配的指导，请阅读《*Sams\
  \ 在本书店排队时自学色彩感*》。\n\n---\n\n此示例调用 `Graphics2D` 的 `fillRect()` 方法，使用当前颜色绘制一个填充矩形。\n\
  \n### 绘制线条和形状\n\n在 Java 程序中绘制线条和矩形等形状与显示文本一样简单。您只需要一个 `Graphics2D` 对象来定义绘图表面，以及表示要绘制对象的对象。\n\
  \n`Graphics2D` 对象具有用于绘制文本的方法，如下所示：\n\n```java\ncomp2D.drawString(\"Draw, pardner!\"\
  , 15, 40);\n```\n\n这将在坐标 (15,40) 处绘制文本 \"Draw, pardner!\"。绘图方法使用与文本相同的 (x,y) 坐标系。\
  \ (0,0) 坐标位于容器的左上角，x 值向右递增，y 值向下递增。您可以通过以下语句确定帧或另一个容器中可使用的最大 (x,y) 值：\n\n```java\n\
  int maxXValue = getSize().width;\nint maxYValue = getSize().height;\n```\n\n除了线条，您绘制的形状可以是填充的或非填充的。填充形状使用当前颜色完全填充形状所占的空间。非填充形状使用当前颜色绘制边框。\n\
  \n#### 绘制线条\n\n二维对象的绘图被创建出来，并表示正在绘制的形状。\n\n定义形状的对象属于 `java.awt.geom` 包中的类。\n\n`Line2D.Float`\
  \ 类创建一条连接起点 (x,y) 和终点 (x,y) 的线。以下语句创建一条从点 (40,200) 到点 (70,130) 的线：\n\n```java\n\
  Line2D.Float line = new Line2D.Float(40F, 200F, 70F, 130F);\n```\n\n参数后跟字母 `F` 以表示它们是浮点值。如果省略此字母，Java\
  \ 将把它们视为整数。\n\n---\n\n注意\n\n`Line2D.Float` 的类名中有一个点，这与您之前处理过的大多数类不同。这是因为 `Float`\
  \ 是 `Line2D` 类的一个内部类，这是 第 20 小时“使用内部类和闭包”中涵盖的主题。\n\n---\n\n除了线条之外，所有形状都通过调用 `Graphics2D`\
  \ 类的方法来绘制：`draw()` 用于轮廓，`fill()` 用于填充形状。\n\n以下语句绘制上一示例中创建的 `line` 对象：\n\n```java\n\
  comp2D.draw(line);\n```\n\n#### 绘制矩形\n\n矩形可以是填充的或非填充的，可以是圆角或直角。它们使用 `Rectangle2D.Float(int,\
  \ int, int, int)` 构造函数创建，参数如下：\n\n![Image](img/image00476.jpeg) 矩形左上角的 x 坐标\n\n\
  ![Image](img/image00476.jpeg) 左上角的 y 坐标\n\n![Image](img/image00476.jpeg) 矩形的宽度\n\
  \n![Image](img/image00476.jpeg) 高度\n\n以下语句绘制一个直角的非填充矩形：\n\n```java\nRectangle2D.Float\
  \ box = new Rectangle2D.Float(245F, 65F, 20F, 10F);\n```\n\n此语句创建一个左上角位于 (x,y) 坐标\
  \ (245,65) 的矩形，宽度为 20 像素，高度为 10 像素。要绘制此矩形的轮廓，可以使用以下语句：\n\n```java\ncomp2D.draw(box);\n\
  ```\n\n如果您想填充矩形，请改用 `fill()` 方法：\n\n```java\ncomp.fill(box);\n```\n\n您可以使用 `RoundRectangle2D.Float`\
  \ 类创建圆角矩形，而不是直角矩形。\n\n该类的构造函数以与 `Rectangle2D.Float` 类相同的四个参数开头，并添加以下两个参数：\n\n\n\n\
  ![Image](img/image00476.jpeg) 从矩形角沿 x 方向移动的像素数。\n\n![Image](img/image00476.jpeg)\
  \ 从角沿 y 方向移动的像素数。\n\n这些距离用于确定矩形角圆角开始的位置。\n\n以下语句创建一个圆角矩形：\n\n点击此处查看代码图片\n\n```\n\
  RoundRectangle2D.Float ro = new RoundRectangle2D.Float(\n    10F, 10F,\n    100F,\
  \ 80F,\n    15F, 15F);\n```\n\n这个矩形的左上角位于坐标(10,10)。第三和第四个参数指定了矩形的宽度和高度。本例中，它应为 100\
  \ 像素宽，80 像素高。\n\n`drawRoundRect()`的最后两个参数指定了所有四个角都应从距离该角（位于(10,10)）15 像素处开始圆角化。\n\
  \n#### 绘制椭圆和圆\n\n你可以使用同一个类`Ellipse2D.Float`来创建椭圆和圆，它接受四个参数：\n\n![Image](img/image00476.jpeg)\
  \ 椭圆的 x 坐标\n\n![Image](img/image00476.jpeg) 椭圆的 y 坐标\n\n![Image](img/image00476.jpeg)\
  \ 它的宽度\n\n![Image](img/image00476.jpeg) 它的高度\n\n(x,y)坐标并不像你可能预期的那样表示椭圆或圆的中心点。相反，(x,y)坐标、宽度和高度描述了一个不可见的矩形，椭圆内接于其中。(x,y)坐标是这个矩形的左上角。如果宽度和高度相同，椭圆就是圆。\n\
  \n以下语句在矩形内创建一个圆，该矩形位于坐标(245,45)，高度和宽度均为 5 像素：\n\n点击此处查看代码图片\n\n```\nEllipse2D.Float\
  \ cir = new Ellipse2D.Float(\n    245F, 45F, 5F, 5F);\n```\n\n#### 绘制圆弧\n\n你可以在\
  \ Java 中绘制的另一种圆形形状是圆弧，即椭圆或圆的一部分。圆弧使用`Arc2D.Float`类创建，该类有一个构造方法，其参数与之前有许多相同之处。你通过指定椭圆、椭圆中应该可见的部分（以度为单位）以及圆弧在椭圆上开始的位置来绘制圆弧。\n\
  \n要创建圆弧，请向构造方法指定以下整数参数：\n\n![Image](img/image00476.jpeg) 椭圆内接于其中的不可见矩形的 x 坐标\n\n\
  ![Image](img/image00476.jpeg) 矩形的 y 坐标\n\n![Image](img/image00476.jpeg) 矩形的宽度\n\n\
  ![Image](img/image00476.jpeg) 矩形的高度\n\n![Image](img/image00476.jpeg) 圆弧在椭圆上开始的点（以\
  \ 0 到 359 度表示）\n\n![Image](img/image00476.jpeg) 圆弧的大小（也以度为单位）\n\n![Image](img/image00476.jpeg)\
  \ 圆弧的类型\n\n圆弧的起点和大小范围是逆时针方向 0 到 359 度，0 度位于 3 点钟方向，如图 23.1 所示。\n\n![Image](img/image00549.jpeg)\n\
  \n**图 23.1** 圆弧如何以度数定义。\n\n圆弧的类型使用类变量指定：`PIE`用于饼图切片，如果端点用直线连接则使用`CLOSED`，如果端点不应连接则使用`OPEN`。\n\
  \n以下语句绘制一个开放圆弧，位于(100,50)，长度为 120 度，从 30 度标记处开始，宽度为 65，高度为 75：\n\n点击此处查看代码图片\n\n\
  ```\nArc2D.Float smile = new Arc2D.Float(100F, 50F, 65F, 75F,\n    30F, 120F, Arc2D.Float.OPEN);\n\
  ```\n\n### 制作饼图\n\n为了结束本章，你将创建`PiePanel`，一个显示饼图的 GUI 组件。这个组件是`JPanel`的子类，`JPanel`是一个简单的\
  \ Swing 容器，可作为绘制内容的载体。\n\n创建类的一种方式是定义该类对象的创建方式。使用`PiePanel`类的程序必须执行以下步骤：\n\n![Image](img/image00476.jpeg)\
  \ 使用构造方法`PiePanel(int)`创建一个`PiePanel`对象。作为参数指定的整数是饼图包含的切片数量。\n\n![Image](img/image00476.jpeg)\
  \ 调用对象的`addSlice(Color, float)`方法，为切片指定颜色和值。\n\n`PiePanel`中每个切片的值就是该切片所代表的数量。\n\n\
  例如，表 23.1 显示了根据高等教育办公室数据，美国学生贷款还款计划前 38 年的状态信息。\n\n![Image](img/image00550.jpeg)\n\
  \n表 23.1 美国学生贷款还款情况\n\n你可以使用`PiePanel`通过以下语句将这些数据显示在饼图中：\n\n点击此处查看代码图片\n\n```\n\
  PiePanel loans = new PiePanel(4);\n\nloans.addSlice(Color.green, 101F);\n\nloans.addSlice(Color.yellow,\
  \ 68F);\n\nloans.addSlice(Color.blue, 91F);\n\nloans.addSlice(Color.red, 25F);\n\
  ```\n\n图 23.2 显示了包含一个组件的应用程序窗口中的结果：一个使用学生贷款数据创建的`PiePanel`。\n\n![Image](img/image00551.jpeg)\n\
  \n**图 23.2** 在饼图上显示学生贷款数据。\n\n当创建`PiePanel`对象时，切片数量在构造方法中指定。要绘制每个切片，你还需要知道三件事：\n\
  \n![Image](img/image00476.jpeg) 切片的颜色，由`Color`对象表示\n\n![Image](img/image00476.jpeg)\
  \ 每个切片代表的值\n\n![Image](img/image00476.jpeg) 所有切片代表的总值\n\n一个新的辅助类`PieSlice`用于表示饼图中的每个切片：\n\
  \n点击此处查看代码图片\n\n```\nimport java.awt.*;\n\nclass PieSlice {\n\n    Color color =\
  \ Color.lightGray;\n\n    float size = 0;\n\n    PieSlice(Color pColor, float pSize)\
  \ {\n\n        color = pColor;\n\n        size = pSize;\n\n    }\n\n}\n```\n\n每个切片通过调用`PieSlice(Color,\
  \ float)`构造。所有切片的组合值存储为`PiePanel`类的私有实例变量`totalSize`。还有用于面板背景色（`background`）和用于跟踪切片的计数器（`current`）的实例变量：\n\
  \n点击此处查看代码图片\n\n```\nprivate int current = 0;\n\nprivate float totalSize = 0;\n\n\
  private Color background;\n```\n\n既然你有了一个`PieSlice`类可以使用，你可以用另一个实例变量创建一个`PieSlice`对象数组：\n\
  \n```\nprivate PieSlice[] slice;\n```\n\n当你创建一个`PiePanel`对象时，没有任何切片被分配颜色或大小。在构造方法中你必须做的唯一事情是定义`slice`数组的大小，并保存面板的背景色：\n\
  \n点击此处查看代码图片\n\n```\npublic PiePanel(int sliceCount) {\n\n    slice = new PieSlice[sliceCount];\n\
  \n    background = getBackground();\n\n}\n```\n\n使用`addSlice(Color, float)`方法向面板添加一个饼图切片：\n\
  \n点击此处查看代码图片\n\n```\npublic void addSlice(Color sColor, float sSize) {\n\n    if\
  \ (current <= slice.length) {\n\n        slice[current] = new PieSlice(sColor, sSize);\n\
  \n        totalSize += sSize;\n\n        current++;\n\n    }\n\n}\n```\n\n实例变量`current`用于将每个切片放入`slice`数组的相应元素中。数组的`length`变量包含数组被定义为容纳的元素数量；只要`current`不大于`slice.length`，你就可以继续向面板添加切片。\n\
  \n正如你所预期的，`PiePanel`类在其`paintComponent()`方法中处理所有图形操作。这项任务中最棘手的部分是绘制代表饼图每个切片的圆弧。\n\
  \n这通过以下语句处理：\n\n\n\n\n## 绘制饼图扇形\n\n下面的代码展示了如何计算每个扇形的大小并进行绘制。\n\n```java\nfloat start\
  \ = 0;\n\nfor (int i = 0; i < slice.length; i++) {\n\n    float extent = slice[i].size\
  \ * 360F / totalSize;\n\n    comp2D.setColor(slice[i].color);\n\n    Arc2D.Float\
  \ drawSlice = new Arc2D.Float(\n\n        xInset, yInset, width, height, start,\
  \ extent,\n\n        Arc2D.Float.PIE);\n\n    start += extent;\n\n    comp2D.fill(drawSlice);\n\
  \n}\n```\n变量`start`用于跟踪绘制弧形的起始位置，而`extent`用于跟踪弧形的大小。如果您知道所有饼图扇形的总大小以及特定扇形的大小，就可以通过将弧形大小乘以\
  \ 360 再除以所有扇形的总和来计算出`extent`。\n\n所有的弧形都在一个`for`循环中绘制：计算出每个弧形的`extent`后，创建该弧形，然后将`extent`加到`start`上。这使得每个扇形都紧接在上一个扇形之后开始绘制。对`Graphics2D`方法`fill()`的调用完成了弧形的绘制。\n\
  \n## 完整 PiePanel 类代码\n\n为了将所有这些整合起来，创建一个名为`PiePanel`的新空 Java 文件，并输入以下完整的代码。\n\n\
  ### 清单 23.1 `PiePanel.java`的完整内容\n\n```java\npackage com.java24hours;\n\nimport\
  \ java.awt.*;\nimport javax.swing.*;\nimport java.awt.geom.*;\n\npublic class PiePanel\
  \ extends JPanel {\n    private PieSlice[] slice;\n    private int current = 0;\n\
  \    private float totalSize = 0;\n    private Color background;\n\n    public PiePanel(int\
  \ sliceCount) {\n        slice = new PieSlice[sliceCount];\n        background =\
  \ getBackground();\n    }\n\n    public void addSlice(Color sColor, float sSize)\
  \ {\n        if (current <= slice.length) {\n            slice[current] = new PieSlice(sColor,\
  \ sSize);\n            totalSize += sSize;\n            current++;\n        }\n\
  \    }\n\n    public void paintComponent(Graphics comp) {\n        super.paintComponent(comp);\n\
  \        Graphics2D comp2D = (Graphics2D) comp;\n        int width = getSize().width\
  \ - 10;\n        int height = getSize().height - 15;\n        int xInset = 5;\n\
  \        int yInset = 5;\n        if (width < 5) {\n            xInset = width;\n\
  \        }\n        if (height < 5) {\n            yInset = height;\n        }\n\
  \        comp2D.setColor(background);\n        comp2D.fillRect(0, 0, getSize().width,\
  \ getSize().height);\n        comp2D.setColor(Color.lightGray);\n        Ellipse2D.Float\
  \ pie = new Ellipse2D.Float(\n            xInset, yInset, width, height);\n    \
  \    comp2D.fill(pie);\n        float start = 0;\n        for (int i = 0; i < slice.length;\
  \ i++) {\n            float extent = slice[i].size * 360F / totalSize;\n       \
  \     comp2D.setColor(slice[i].color);\n            Arc2D.Float drawSlice = new\
  \ Arc2D.Float(\n                xInset, yInset, width, height, start, extent,\n\
  \                Arc2D.Float.PIE);\n            start += extent;\n            comp2D.fill(drawSlice);\n\
  \        }\n    }\n}\n\nclass PieSlice {\n    Color color = Color.lightGray;\n \
  \   float size = 0;\n\n    PieSlice(Color pColor, float pSize) {\n        color\
  \ = pColor;\n        size = pSize;\n    }\n}\n```\n`清单 23.1`在第 1-56 行定义了`PiePanel`类，在第\
  \ 58-66 行定义了`PieSlice`辅助类。`PiePanel`类可以在任何 Java 程序的 GUI 中作为组件使用。为了测试`PiePanel`，您需要创建一个使用它的类。\n\
  \n## 完整 PieFrame 类代码\n\n`清单 23.2`包含一个使用这些面板的应用程序`PieFrame`。创建一个新的空 Java 文件，并从该清单中输入这个类的源代码。\n\
  \n### 清单 23.2 `PieFrame.java`的完整内容\n\n```java\npackage com.java24hours;\n\nimport\
  \ javax.swing.*;\nimport java.awt.*;\n\npublic class PieFrame extends JFrame {\n\
  \    Color uneasyBeingGreen = new Color(0xCC, 0xCC, 0x99);\n    Color zuzusPetals\
  \ = new Color(0xCC, 0x66, 0xFF);\n    Color zootSuit = new Color(0x66, 0x66, 0x99);\n\
  \    Color sweetHomeAvocado = new Color(0x66, 0x99, 0x66);\n    Color shrinkingViolet\
  \ = new Color(0x66, 0x66, 0x99);\n    Color miamiNice = new Color(0x33, 0xFF, 0xFF);\n\
  \    Color inBetweenGreen = new Color(0x00, 0x99, 0x66);\n    Color norwegianBlue\
  \ = new Color(0x33, 0xCC, 0xCC);\n    Color purpleRain = new Color(0x66, 0x33, 0x99);\n\
  \    Color freckle = new Color(0x99, 0x66, 0x33);\n\n    public PieFrame() {\n \
  \       super(\"Pie Graph\");\n        setLookAndFeel();\n        setSize(320, 290);\n\
  \        setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n        setVisible(true);\n\
  \n        PiePanel pie = new PiePanel(10);\n        pie.addSlice(uneasyBeingGreen,\
  \ 1350);\n        pie.addSlice(zuzusPetals, 1221);\n        pie.addSlice(zootSuit,\
  \ 316);\n        pie.addSlice(sweetHomeAvocado, 251);\n        pie.addSlice(shrinkingViolet,\
  \ 201);\n        pie.addSlice(miamiNice, 193);\n        pie.addSlice(inBetweenGreen,\
  \ 173);\n        pie.addSlice(norwegianBlue, 164);\n        pie.addSlice(purpleRain,\
  \ 143);\n        pie.addSlice(freckle, 127);\n        add(pie);\n    }\n\n    private\
  \ void setLookAndFeel() {\n        try {\n            UIManager.setLookAndFeel(\n\
  \                \"com.sun.java.swing.plaf.nimbus.NimbusLookAndFeel\"\n        \
  \    );\n        } catch (Exception exc) {\n            // ignore error\n      \
  \  }\n    }\n\n    public static void main(String[] arguments) {\n        PieFrame\
  \ pf = new PieFrame();\n    }\n}\n```\n`PieFrame`类是一个简单的图形用户界面，包含一个组件：在第 25 行创建的`PiePanel`对象。在第\
  \ 26-35 行，调用了该对象的`addSlice()`方法 10 次，向饼图中添加扇形。\n\n## 程序运行效果\n\n当您运行应用程序时，`PieFrame`会显示一个饼图，展示\
  \ 10 个人口最多的国家（以百万为单位）的人口数据，数据来源于 2013 年 12 月美国人口普查局国际数据库的报告。按顺序排列，它们是：中国（13.5 亿）、印度（12.21\
  \ 亿）、美国（3.16 亿）、印度尼西亚（2.51 亿）、巴西（2.01 亿）、巴基斯坦（1.93 亿）、尼日利亚（1.73 亿）、孟加拉国（1.64 亿）、俄罗斯（1.43\
  \ 亿）和日本（1.27 亿）。\n\n由于`Color`类中定义的颜色较少，这里为此创建了 10 种新颜色并赋予了描述性名称。颜色以十六进制值表示——在 Java\
  \ 中，十六进制数字以`0x`为前缀——但也可以在每个`Color()`构造函数中指定为十进制值。\n\n![Image](img/image00552.jpeg)\n\
  **图 23.3** 在饼图中显示人口数据。\n\n> **注意**\n> 您可以通过访问 [美国人口普查局世界人口数据](http://www.cadenhead.org/census)\
  \ 查看最新的数据。\n\n## 总结\n\n通过使用字体、颜色和图形，您可以吸引人们更多地关注程序元素，并使它们对用户更具吸引力。\n使用 Java 可用的形状绘制某些内容可能看起来弊大于利。然而，用多边形描绘的图形相比于从图像文件加载的图形有两个优势：\n\
  \n![Image](img/image00476.jpeg) **速度**——即使是像图标这样的小图形，加载和显示所需的时间也比绘制一系列多边形要长。\n\n\
  \n\n\n\n## 缩放\n你可以简单地通过更改创建多边形图像的值，来改变整个图像的大小。例如，你可以在 `Sign` 类中添加一个函数，在创建每个形状之前，将其中所有的\
  \ (x,y) 坐标点乘以二，这样生成的图像就会放大一倍。多边形图像的缩放速度比图像文件快得多，并且效果也更好。\n\n## 实践篇\n\n### 问与答\n\n\
  **问：** 如何绘制顺时针方向而非逆时针方向的圆弧？\n\n**答：** 你可以通过将圆弧的大小指定为负数来实现。圆弧从同一点开始，但沿椭圆路径的反方向绘制。例如，以下语句在坐标\
  \ (35,20) 处绘制一个开放的圆弧，长度为 90 度，从 0 度位置开始，顺时针绘制，高度为 20，宽度为 15：\n\n点击此处查看代码图片\n```java\n\
  Arc2D.Float smile = new Arc2D.Float(35F, 20F, 15F, 20F,\n    0F, -90F, Arc2D.Float.OPEN);\n\
  ```\n\n**问：** 椭圆和圆没有角。那么在 `Ellipses.Float` 构造方法中指定的 (x,y) 坐标代表什么？\n\n**答：** (x,y)\
  \ 坐标代表椭圆或圆的最小 x 值和最小 y 值。如果你在其周围绘制一个不可见的矩形，矩形的左上角就是用作方法参数的 x 和 y 坐标。\n\n**问：** 如何在\
  \ Java 中使用 XRender？\n\n**答：** Java 支持在基于 X11 的环境（通常是 Linux）中使用 XRender 渲染引擎绘制 Java2D\
  \ 图形。此功能默认是关闭的，必须使用命令行选项开启：`-Dsun.java2d.xrender=true`。XRender 使 Java 程序能够利用现代图形处理单元的能力。\n\
  \n在 NetBeans 中，你可以通过选择“运行” -> “设置项目配置” -> “自定义”来设置这些选项。使用“VM 选项”字段设置此选项，然后点击“确定”。\n\
  \n**问：** 为什么摄影师会让你说“茄子”（cheese）？\n\n**答：** “Cheese”这个词会让你的嘴巴形成微笑，就像“威士忌”（whiskey）、“微风”（breeze）和“金钱”（money）这些词一样。以长音“e”结尾的词通常会让你的嘴角上扬并露出牙齿。\n\
  \n摄影师有时使用的另一个词是“咧嘴笑”（grin）。虽然它不是以“e”结尾，但它会扭曲嘴巴的形状，并且其含义会让人微笑。\n\n### 小测验\n通过回答以下问题，测试你的字体和颜色技巧是否出色。\n\
  \n**1.** 以下哪项不是用于选择颜色的常量？\n\n**A.** `Color.cyan`\n**B.** `Color.teal`\n**C.** `Color.magenta`\n\
  \n**2.** 当你更改某物的颜色并在容器上重新绘制它时，你必须做什么才能使其可见？\n\n**A.** 使用 `drawColor()` 方法。\n**B.**\
  \ 使用 `repaint()` 语句。\n**C.** 什么都不用做。\n\n**3.** RGB 的首字母缩写代表什么？\n\n**A.** Roy G.\
  \ Biv\n**B.** 红色、绿色、蓝色\n**C.** 天空中的露西与钻石\n\n### 答案\n**1. B.** 杰克逊维尔美洲虎队的主色调青绿色，在\
  \ `Color` 类中并未表示。\n\n**2. B.** 调用 `repaint()` 会导致 `paintComponent()` 方法被手动调用。\n\n\
  **3. B.** 如果 C 是正确答案，那么你只能使用那些在多年后闪回时才能看到的颜色了。\n\n### 实践活动\n为了进一步探索在程序中使用字体和颜色的可能性，请完成以下活动：\n\
  \n- ![Image](img/image00476.jpeg) 创建一个 `PieFrame` 类的版本，该版本接受命令行参数作为颜色值和饼图切片值，而不是将它们硬编码在应用程序的源代码中。\n\
  \n- ![Image](img/image00476.jpeg) 创建一个应用程序，在面板上使用颜色、形状和字体绘制一个停止标志。\n\n要查看实现了这些活动的\
  \ Java 程序，请访问本书网站 [www.java24hours.com](http://www.java24hours.com)。\n\n# 第 24 小时：编写\
  \ Android 应用程序\n本小时待办事项清单：\n\n- ![Image](img/image00474.jpeg) 了解 Android 创立的原因。\n\
  - ![Image](img/image00474.jpeg) 创建一个 Android 应用程序。\n- ![Image](img/image00474.jpeg)\
  \ 了解 Android 应用程序的结构。\n- ![Image](img/image00474.jpeg) 在模拟器上运行应用程序。\n- ![Image](img/image00474.jpeg)\
  \ 在 Android 手机上运行应用程序。\n\nJava 是一种通用编程语言，可以在多种平台上运行。近年来，其中一个平台已经成为激发新 Java 开发的极其成功的催化剂。\n\
  \nAndroid 操作系统最初运行于手机，现已扩展到各种其他设备，它专门运行用 Java 编写的程序。这些被称为应用程序的程序，建立在一个完全免费的开源移动平台上，供开发者构建使用。任何人都可以编写、部署和销售\
  \ Android 应用程序。\n\n在本小时中，你将了解 Android 的起源、它的特殊之处，以及为什么如此多的程序员在这个平台上进行开发。你还将创建一个应用程序，并在\
  \ Android 手机（如果你有的话）和模拟器（如果你没有的话）上运行它。\n\n### Android 简介\nAndroid 由 Google 于 2007\
  \ 年推出，此前两年 Google 收购了这项技术，作为建立全新非专有、开放移动手机平台的全行业努力的一部分，这与驱动 RIM BlackBerry 和 Apple\
  \ iPhone 的技术不同。一些手机和科技领域的巨头——谷歌、英特尔、摩托罗拉、英伟达、三星等公司——组成了开放手机联盟，以推广这个新平台，实现互惠互利。\n\
  \nGoogle 发布了 Android 软件开发工具包，这是一套免费的用于开发 Android 应用程序的工具。第一款运行 Android 的手机 T-Mobile\
  \ G1 于 2008 年 6 月上市。\n\n这项工作起步缓慢，但自 2010 年初以来迅速发展，成为 iPhone 和其他移动平台的真正竞争对手。现在所有主要的手机运营商都提供\
  \ Android 手机。平板电脑和电子书阅读器的市场也在不断增长。\n\n在 Android 出现之前，移动应用程序开发需要昂贵的编程工具和开发者计划。手机制造商控制着谁被允许为其创建应用程序，以及这些应用程序是否可以出售给用户。\n\
  \nAndroid 打破了这堵墙。\n\nAndroid 的开源和非专有性质意味着任何人都可以开发、发布和销售应用程序。唯一涉及的成本是向 Google 应用市场提交应用程序的象征性费用。其他一切都是免费的。\n\
  \n下载 Android SDK 并了解更多关于为该平台创建程序信息的地方是 Android 开发者网站 [`developer.android.com`](http://developer.android.com)。在编写自己的应用程序时，你会经常查阅它，因为它记录了\
  \ Android Java 类库中的每个类，并作为广泛的在线参考。\n\n如果你使用支持 Android SDK 的集成开发环境，编写 Android 应用程序会更容易。Android\
  \ 编程最受欢迎的 IDE 是 Eclipse，它同样是免费且开源的。Eclipse 的 Android 插件使 SDK 能够在 IDE 内无缝运行。你可以使用\
  \ Eclipse 来编写 Android 应用程序，在模拟 Android 手机的模拟器中进行测试，甚至将其部署到实际设备上。\n\n在其存在的大部分时间里，Java\
  \ 语言被用于编写在三个地方之一运行的程序：桌面计算机、Web 服务器或 Web 浏览器。\n\nAndroid 将 Java 带到了无处不在的地方。你的程序可以被部署在数百万部手机和其他移动设备上。\n\
  \n这实现了 James Gosling 在 20 世纪 90 年代中期发明 Java 语言时的原始设计目标。他当时的任务是创建一种能够运行在手机、智能卡和家电等各种设备上的语言。\n\
  \n\n\n\n\n当 Java 语言首先作为运行交互式网页浏览器程序的手段，继而成为通用编程语言而流行起来时，其开发者暂时搁置了那些梦想。\n\n---\n\n\
  > **注意**\n> 本章是本书中篇幅最长的一章，因为作为一名 Android 应用开发者和未来的百万富翁，你的入门之旅有很多内容需要涵盖。如果我的出版商没有否决备选书名《24\
  \ 小时自学 Java》，本章内容本可能被分拆到两小时中。\n\n---\n\n据一项行业估计，不到 20 年后的今天，Android 平台在全球范围内托管着多达十亿个\
  \ Java 程序。\n\nAndroid 有可能在未来数年内成为 Java 编程中最普及——也最赚钱——的领域。\n\n### 创建 Android 应用\n\
  \nAndroid 应用是普通的 Java 程序，它们使用一个应用框架——一组所有应用共有的核心类和文件。该框架体现了一套规则，规定了应用必须如何构建才能在 Android\
  \ 设备上正常运行。\n\n要开始编写应用，你必须安装并配置 Android SDK、Eclipse IDE 以及 Eclipse 的 Android 插件。\n\
  \n如果这是你第一次接触 Android 编程，你可以在 附录 D“设置 Android 开发环境”中了解如何获取和设置这些工具。\n\n请先去完成设置。我会在这里等你，同时去\
  \ Facebook 上找几个朋友聊聊。\n\n完成了？很好。\n\n**1.** 运行 Eclipse IDE，它的外观和操作与 NetBeans 非常相似。\n\
  \n**2.** 选择“File”（文件），“New”（新建），“Android Application Project”（Android 应用程序项目）。“New\
  \ Android Application Wizard”（新建 Android 应用程序向导）会打开，如 图 24.1 所示。\n\n![Image](img/image00553.jpeg)\n\
  \n**图 24.1** 在 Eclipse 中创建新的 Android 项目。\n\n**3.** 在“Application Name”（应用程序名称）字段中，输入\
  \ `SalutonMondo`。相同的名称会自动填入“Project Name”（项目名称）字段。\n\n**4.** “Package Name”（包名称）字段应包含此应用类所属的\
  \ Java 包名。输入 `org.cadenhead.android`。\n\n**5.** 每个 Android 项目都需要一个构建目标。该目标代表可以运行你的应用的最老的\
  \ Android 版本。因为每个新版本的 Android 都增强了功能，所以你的目标选择决定了你可以使用哪些功能。\n\n在“Minimum Required\
  \ SDK”（最低要求的 SDK）和“Target SDK”（目标 SDK）下拉菜单中，选择 API 19。\n\n**6.** 点击“Next”（下一步）。向导会询问更多关于项目的问题。\n\
  \n**7.** 有三个复选框应该已经被选中：“Create Custom Launcher Icon”（创建自定义启动器图标）、“Create Activity”（创建活动）和“Create\
  \ New Project in Workspace”（在工作区创建新项目）。（如果未选中，请选中它们。）\n\n**8.** 点击“Next”（下一步）。向导会询问关于应用程序图标的问题。\n\
  \n**9.** 你可以接受图标的默认设置，所以点击“Next”（下一步）。然后会询问要创建的活动。\n\n**10.** 选择“Fullscreen Activity”（全屏活动）并点击“Next”（下一步）。\n\
  \n**11.** Activity 是应用可以完成的一项任务。在“Activity Name”（活动名称）字段中输入 `SalutonActivity`。\n\
  \n**12.** 点击“Finish”（完成）。新应用已创建，并且在“Package Explorer”（包资源管理器）窗格中会出现一个 `SalutonMondo`\
  \ 项目。\n\n#### 探索新的 Android 项目\n\n一个新的 Android 项目包含大约 20 个文件和文件夹，它们在 Android 应用中总是以相同的方式组织。根据应用的功能，你可能会添加更多文件，但这些初始文件和文件夹必须始终存在。\n\
  \n图 24.2 显示了创建新 Android 项目后的 Eclipse Package Explorer。\n\n![Image](img/image00554.jpeg)\n\
  \n**图 24.2** 查看 Android 项目的组成部分。\n\n你可以使用这个窗格来探索项目的文件和文件夹结构。新的 `SalutonMondo` 应用开始时包含以下组件：\n\
  \n![Image](img/image00476.jpeg) `/src` 文件夹——应用 Java 源代码的根文件夹。\n\n![Image](img/image00476.jpeg)\
  \ `/src/org.cadenhead.android/SalutonActivity.java`——应用运行时默认启动的活动对应的类。\n\n![Image](img/image00476.jpeg)\
  \ `/gen` 文件夹——用于存放自动生成的 Java 源代码的文件夹，你无需手动编辑。\n\n![Image](img/image00476.jpeg) `/gen/org.cadenhead.android/R.java`——应用的自动生成的资源管理源代码。（永远不要编辑这个文件！）\n\
  \n![Image](img/image00476.jpeg) `/assets`——用于存放不会被编译到应用中的文件资源的文件夹。\n\n![Image](img/image00476.jpeg)\
  \ `/res`——用于存放应用资源（如字符串、数字、布局文件、图形和动画）的文件夹。有用于特定资源类型的子文件夹：`layout`、三个 `values` 文件夹和五个\
  \ `drawable` 文件夹。\n\n![Image](img/image00476.jpeg) `AndroidManifest.xml`——应用的主要配置文件。\n\
  \n![Image](img/image00476.jpeg) `default.properties`——由 Android 插件生成的一个构建文件，你不应编辑它。\n\
  \n![Image](img/image00476.jpeg) `project.properties`——项目自动生成的一个配置文件，必须手动编辑。\n\n\
  这些文件和文件夹构成了应用框架。作为 Android 程序员，你的首要任务就是学习如何修改这个框架，以便你能发现每个组件的功能。\n\n还有其他文件会根据特定目的被添加到框架中。\n\
  \n#### 创建应用\n\n虽然你还没有对它做任何事情，但你已经可以成功运行新的 Android 项目。这个框架本身就作为一个可工作的应用在运行。\n\n但这样没什么意思，所以你将自定义\
  \ `SalutonMondo` 应用，以提供传统的计算机编程问候语 “Saluton Mondo!”（你好，世界！）。\n\n在第 2 小时“编写你的第一个程序”中，你通过调用\
  \ `System.out.println()` 方法以字符串形式显示了 “Saluton Mondo!”。\n\nAndroid 应用显示的字符串首先存储在名为\
  \ `strings.xml` 的资源文件中。你可以在 `/res/values` 文件夹中找到此文件。\n\n使用 Package Explorer 导航到此文件夹。双击\
  \ `strings.xml`。一个 Resources 编辑器会打开，如 图 24.3 所示。\n\n![Image](img/image00555.jpeg)\n\
  \n**图 24.3** 编辑 Android 应用的字符串资源。\n\n字符串和其他资源就像 Java 中的变量一样，被赋予一个名称和一个值。Resources\
  \ 元素窗格中列出了三个字符串资源：`app_name`、`dummy_button` 和 `dummy_content`。\n\n资源的命名遵循三条规则：\n\
  \n![Image](img/image00476.jpeg) 必须全部小写。\n\n![Image](img/image00476.jpeg) 不能包含空格。\n\
  \n![Image](img/image00476.jpeg) 只能使用下划线字符 _ 作为标点符号。\n\n点击 Resources 元素窗格中的一个字符串。会出现名称和值文本字段，以及一些关于如何编辑字符串的指导。\n\
  \n`app_name` 字符串资源是你在运行“新建 Android 项目向导”时选择的。名称应与你之前给定的名称匹配，但你可以随时通过编辑此字符串进行更改。\n\
  \n`dummy_content` 字符串包含应用运行时在其主（也是唯一的）屏幕上显示的文本。点击此字符串的名称以调出进行编辑。\n\n在“Value”（值）字段中，输入\
  \ `Saluton Mondo!`。\n\n---\n\n> **注意**\n> 虽然你可以直接编辑 XML，但不要这样做。在为 Android 应用创建资源时，通常没有必要这样做。例外情况是当\
  \ Eclipse 编辑器不支持你想要在定义资源时进行的某些操作。对于字符串，情况并非如此，因此最好坚持使用 Resources 编辑器。直接编辑 XML 文件更容易出错。\n\
  \n---\n\n资源存储在 XML 文件中。Resources 编辑器是一个简单的 XML 编辑器。你也可以直接编辑 XML 本身。点击编辑器底部的 `strings.xml`\
  \ 选项卡以加载此文件进行直接编辑。（参见 图 24.3，该选项卡已被标出。）\n\n以下是 `strings.xml` 当前的样子：\n\n**输出**\n\n\
  \n\n\n点击此处查看代码图片\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n\n<resources>\n\
  \n    <string name=\"app_name\">SalutonMondo</string>\n\n    <string name=\"dummy_button\"\
  >Dummy Button</string>\n\n    <string name=\"dummy_content\">Saluton Mondo!</string>\n\
  \n</resources>\n```\n\n此编辑器允许编辑 XML 文件中的所有内容，甚至包括标记标签。`string`元素包含一个`name`属性，用于标识资源的名称。值被包含在标签内作为字符数据。\n\
  \n要返回资源编辑器，请点击\"Resources\"标签。点击 Eclipse 工具栏中的\"Save\"按钮，将更改保存到文件`strings.xml`。\n\
  \n完成此修改后，您几乎已准备好运行该应用。\n\n### 设置 Android 模拟器\n\n在构建 Android 应用之前，必须设置其调试环境。这可以在\
  \ Eclipse 中处理。您必须设置一个 Android 虚拟设备（AVD），该设备可以在您的桌面上作为模拟器运行应用。还必须创建项目的调试配置。完成后，您就可以构建应用并在模拟器中运行它。\n\
  \n要配置 Android 虚拟设备，首先点击 Eclipse 工具栏中的绿色 Android 手机图标，如图 24.4 所示。\n\n![Image](img/image00556.jpeg)\n\
  \n**图 24.4** 配置 Android 虚拟设备。\n\n这将启动 Android 虚拟设备管理器，它是 Android SDK 中的工具之一。您创建的模拟器列在左侧。管理器如图\
  \ 24.5 所示。\n\n![Image](img/image00557.jpeg)\n\n**图 24.5** 创建新的 Android 模拟器。\n\n\
  要添加新的模拟器，请点击\"New\"并按照以下步骤操作：\n\n**1.** 在\"AVD Name\"字段中，将其命名为`SimpleAVD`。\n\n**2.**\
  \ 在\"Device\"字段中，选择一款手机，例如`Nexus S`。\n\n**3.** 在\"Target\"字段中，必须从下拉菜单中选择一个目标 Android\
  \ 版本。选择 Android 4.4.2 - API Level 19。\n\n**4.** 在\"Skin\"字段中，选择\"No Skin\"。\n\n\
  **5.** 在\"Memory Options\"部分，在\"RAM\"下输入`768`。（较大的内存可能会导致模拟器在某些 Windows 计算机上无法加载。）\n\
  \n**6.** 在\"SD Card\"部分，在\"Size\"字段中，为假 SD 卡选择一个大小。输入`1024`并从关联的下拉菜单中选择 MiB，以创建一个大小为\
  \ 1024MB 的 SD 卡。您的计算机必须有足够的可用空间，因此如果不想占用太多空间，请选择较小的值。最小尺寸为 9MB。\n\n**7.** 点击\"OK\"\
  。新的模拟器将被创建，这可能需要一点时间（通常不超过一分钟）。\n\n您可以根据需要创建任意数量的模拟器。它们可以针对不同的 Android 版本和不同类型的显示屏进行自定义。\n\
  \n关闭 Android 虚拟设备管理器以返回 Eclipse 主界面。\n\n### 创建调试配置\n\n启动`SalutonMondo`应用之前，最后需要在\
  \ Eclipse 中创建一个调试配置。请按照以下步骤操作：\n\n**1.** 选择\"Run\"，然后\"Debug Configurations\"。将打开\"\
  Debug Configurations\"窗口。\n\n**2.** 在左侧面板中，双击\"Android Application\"项（如图 24.6 所示）。一个名为`New_configuration`的新条目将作为其子项创建。右侧面板显示了该新项目的一些配置选项。\n\
  \n![Image](img/image00558.jpeg)\n\n**图 24.6** 创建 Android 调试配置。\n\n**3.** 在右侧面板的\"\
  Name\"字段中，将其更改为`SalutonDebug`。\n\n**4.** 点击\"Browse\"按钮。将打开\"Project Selection\"\
  对话框。\n\n**5.** 选择项目`SalutonMondo`，然后点击\"OK\"。\n\n**6.** 点击\"Target\"标签。\n\n**7.**\
  \ 在\"Deployment Target Selection Mode\"下，选择\"Automatically Pick Compatible Device\"\
  （如果尚未选择）。表格允许您选择一个目标 AVD。\n\n**8.** 在表格中，选中`SimpleAVD`模拟器对应的复选框。\n\n**9.** 点击\"\
  Apply\"保存更改，然后点击\"Close\"。\n\n### 运行应用\n\n现在您有了一个 Android 模拟器和调试配置，可以运行您的第一个应用了。点击`SalutonMondo`（Package\
  \ Explorer 中的顶层项目），然后点击 Eclipse 工具栏中的 bug 图标。\n\nAndroid 模拟器将在其自己的窗口中加载。这可能需要一分钟或更长时间，因此请耐心等待虚拟手机启动。（模拟器加载如此缓慢，以至于有时间让你思考一句中国谚语：“牛很慢，但土地很有耐心。”）\n\
  \n您安装的应用将显示一个 Android 图标和标签`SalutonMondo`。点击图标运行应用。\n\n模拟器显示“Saluton Mondo!”作为应用的文本和标题栏，如图\
  \ 24.7 所示。控件允许像使用电话一样使用模拟器，只是用鼠标代替手指。点击返回按钮关闭应用，看看 Android 设备是如何被模拟的。\n\n![Image](img/image00559.jpeg)\n\
  \n**图 24.7** 在 Android 模拟器中运行应用。\n\n模拟器可以完成真实设备的许多功能，包括在计算机有活动连接时连接到互联网。它还可以接收虚拟的电话和短信。\n\
  \n由于它不是功能完全的设备，您开发的应用必须在实际的 Android 手机和平板电脑上进行测试。\n\n如果您可以使用 USB 线将 Android 手机（或其他设备）连接到计算机，并且手机设置为调试模式，您应该能够运行该应用。使用\
  \ Android SDK 开发的应用只能在此模式下部署到手机上。\n\n在手机上，通过选择\"Home\"、\"Settings\"、\"Applications\"\
  、\"Development\"（或\"Home\"、\"Settings\"、\"Developer Options\"）进入此模式。将显示\"Development\"\
  设置。选择\"USB debugging\"选项。\n\n接下来，在 Eclipse 中，按照以下步骤操作：\n\n**1.** 选择\"Run\"，然后\"\
  Debug Configurations\"。将打开\"Debug Configurations\"窗口。\n\n**2.** 点击右侧面板中的\"Target\"\
  标签将其置于前台。\n\n**3.** 将\"Deployment Target Selection Mode\"更改为\"Always Prompt to Pick\
  \ Device\"。\n\n**4.** 点击\"Apply\"然后\"Close\"。\n\n使用 USB 线连接您的 Android 手机。手机屏幕顶部栏上应该出现一个\
  \ Android bug 图标。如果向下拖动此栏，您应该会看到消息“USB Debugging Connected”。\n\n回到 Eclipse，点击工具栏中的\
  \ bug 图标。将打开 Android Device Chooser 对话框（参见图 24.8）。\n\n![Image](img/image00560.jpeg)\n\
  \n**图 24.8** 在 Android 手机上部署应用。\n\n如果 Android 手机已被检测到，它将出现在图 24.8 中顶部表格的\"Choose\
  \ a Running Device\"选项下。\n\n选择此选项，点击设备，然后点击\"OK\"。应用将像在模拟器上一样在手机上运行。\n\n就像您在第 2\
  \ 小时编写的第一个 Java 程序一样，您在 Android 上创建的第一个应用也极其普通。下一个项目将更有野心。\n\n### 设计真实应用\n\nAndroid\
  \ 应用可以利用设备的所有功能，例如短信服务、基于位置的服务和触摸输入。在本书的最后一个编程项目中，您将创建一个名为“带我去见你的领导人”的真实应用。\n\n\
  此应用利用 Android 手机的功能拨打电话、访问网站并在 Google Maps 中加载位置。该应用通过电话、网络和地图将您与白宫联系起来。（如果美国总统不是您的领导人，该应用可以自定义。）\n\
  \n要开始，请在 Eclipse 中执行以下步骤创建一个新项目：\n\n**1.** 点击\"File\"、\"New\"、\"Android Application\
  \ Project\"。将打开\"New Android Application\"向导。\n\n**2.** 在\"Application Name\"字段中，输入`Leader`。这也将自动输入到\"\
  Project Name\"字段中。\n\n**3.** 在\"Package Name\"字段中，输入`org.cadenhead.android`。\n\n\
  **4.** 在\"Minimum Required SDK\"和\"Target SDK\"下拉菜单中，选择 API 19，然后点击\"Next\"查看更多项目选项。\n\
  \n\n\n\n**5.** 确保以下三个复选框被选中：`Create Custom Launcher Icon`、`Create Activity` 和 `Create\
  \ Project in Workspace`。\n\n**6.** 点击 `Next` 以查看关于应用程序图标的问题。\n\n**7.** 点击 `Next`\
  \ 接受这些默认设置。\n\n**8.** 选择 `Fullscreen Activity`；然后点击 `Next`。\n\n**9.** 在 `Activity\
  \ Name` 字段中，输入 `LeaderActivity`。\n\n**10.** 点击 `Finish`。\n\n---\n\n**提示**\n\n本项目涉及内容广泛。在学习过程中，您会发现将浏览器保持在\
  \ Android 开发者网站的参考部分（[`developer.android.com/reference`](http://developer.android.com/reference)）会很方便。您可以搜索\
  \ Android 类库中的 Java 类以及项目中的文件名以获取更多信息。\n\n---\n\n项目会出现在 Eclipse Package Explorer\
  \ 中，就像 `SalutonMondo` 项目一样。为避免混淆，您应该在继续之前关闭 `SalutonMondo`。在 Package Explorer 中右键点击\
  \ `SalutonMondo`；然后从弹出菜单中选择 `Close Project`。\n\n### 组织资源\n\n创建 Android 应用需要 Java\
  \ 编程，但大量工作是在 Eclipse 界面中完成的。当您完全了解 Android SDK 的功能时，无需编写一行 Java 代码即可完成大量工作。\n\n\
  无需编程的一项工作是创建应用将使用的资源。每个新的 Android 项目都从包含多个文件夹的结构开始，用于放置资源。要查看这些文件夹，请在 Package Explorer\
  \ 中展开 `Leader` 文件夹，然后展开 `/res` 文件夹及其所有子文件夹（如 图 24.9 所示）。\n\n![Image](img/image00561.jpeg)\n\
  \n**图 24.9** 检查应用的资源文件夹。\n\n资源包括 PNG、JPG 或 GIF 格式的图形；存储在名为 `strings.xml` 文件中的字符串；XML\
  \ 格式的用户界面布局文件；以及您可以创建的其他文件。另外两个是用于应用中颜色的 `colors.xml` 和定义用户界面组件外观的 `styles.xml`。\n\
  \n新项目的 `/res` 文件夹包含名为 `drawable-hdpi`、`drawable-ldpi`、`drawable-mdpi`、`drawable-xhpdi`\
  \ 和 `drawable-xxhpdi` 的文件夹，这些文件夹中有不同版本的 `ic_launcher.png`，即应用的图标。图标是用来启动应用的小型图形。\n\
  \n`ic_launcher.png` 的多个版本是针对不同分辨率显示屏调整大小的相同图形。您不会使用这些图标，因此可以删除它们：在 Package Explorer\
  \ 中点击其中一个 `ic_launcher.png` 文件，然后按 `Delete` 键。您将被要求确认每次删除。\n\n删除这些文件会导致 Package\
  \ Explorer 中出现两个红色 X：一个在 `AndroidManifest.xml` 上，另一个在顶层的 `Leader` 项目上（在 图 24.10\
  \ 中标识）。这些 X 表示应用现在存在错误，将无法编译和运行。\n\n![Image](img/image00562.jpeg)\n\n**图 24.10**\
  \ 检测并修复应用中的错误。\n\n错误出现是因为应用现在缺少图标。一个新的图形文件 `appicon.png` 将被添加到项目中，并在其主配置文件 `AndroidManifest.xml`\
  \ 中被指定为应用的图标。\n\n本书网站包含 `appicon.png` 以及本应用所需的其他四个图形文件：`browser.png`、`maps.png`、`phone.png`\
  \ 和 `whitehouse.png`。访问 [`www.java24hours.com`](http://www.java24hours.com) 并转到本书本版对应的\
  \ 第 24 小时 页面。下载所有五个文件并将其保存在计算机上的临时文件夹中。\n\n---\n\n**注意**\n\n资源在应用中通过一个由其文件名（不含扩展名）构成的\
  \ ID 来标识。`appicon.png` 的 ID 是 `appicon`，`browser.png` 的 ID 是 `browser`，依此类推。不能有两个资源具有相同的\
  \ ID（相同图形存储在 `drawable-*` 文件夹的不同分辨率中除外，因为它们算作一个资源）。\n\n如果两个资源具有不含扩展名的相同名称，例如 `appicon.png`\
  \ 和 `appicon.gif`，Eclipse 将会标记错误，应用将无法编译。\n\n资源名称还必须仅包含小写字母、数字、下划线 (`_`) 和句点 (`.`)。本项目中的文件遵循这些规则。\n\
  \n---\n\nAndroid 对多种分辨率的支持很方便，但此处并不需要。您将通过执行以下步骤创建一个新的 `drawable` 文件夹，而不是使用现有的 `drawable`\
  \ 文件夹：\n\n**1.** 在 Package Explorer 中点击 `/res` 文件夹以选择它。\n\n**2.** 选择 `File`，`New`，`Folder`。`New\
  \ Folder` 对话框打开。\n\n**3.** 在 `Folder Name` 字段中输入 `drawable`。\n\n**4.** 点击 `Finish`。\n\
  \n将在 `/res` 内创建一个名为 `drawable` 的新文件夹。应用所需的所有图形都可以存储在此处，无需考虑其分辨率。\n\n文件可以通过拖放添加到资源中。打开包含五个文件的临时文件夹，选择它们，然后将它们拖到\
  \ Package Explorer 中的 `drawable` 文件夹。（可能会被问及是复制文件还是复制链接。选择 `Copy Files` 选项。）\n\n\
  现在项目有了一个新的图标，您可以将其设置为应用的图标，并消除 Package Explorer 中指出的错误。这将通过编辑 `AndroidManifest.xml`\
  \ 来处理。\n\n### 配置应用的清单文件\n\nAndroid 应用中的主要配置工具是位于主应用文件夹中名为 `AndroidManifest.xml`\
  \ 的文件。应用使用的所有 XML 文件都可以手动编辑或使用 Eclipse 中的内置编辑器进行编辑。后者更简单且不易出错。除非您对编辑 XML 非常熟悉，否则在获得更多\
  \ Android 编程经验之前，您应该坚持使用编辑器。\n\n要为应用选择合适的图标，请执行以下操作：\n\n**1.** 在 Package Explorer\
  \ 中双击 `AndroidManifest.xml`。该文件使用内置编辑器在 Eclipse 主窗口中打开以进行编辑。\n\n**2.** 编辑器底部边缘有几个选项卡。点击\
  \ `Application` 选项卡以查看与应用相关的设置（参见 图 24.11）。\n\n![Image](img/image00563.jpeg)\n\n\
  **图 24.11** 编辑应用的 `AndroidManifest.xml` 文件。\n\n**3.** `Icon` 字段标识应用的图标，当前具有不正确的值\
  \ `@drawable/ic_launcher`。点击此字段旁边的 `Browse` 按钮。出现一个 `Resource Chooser` 对话框，列出了您最近添加到应用中的五个图形资源。\n\
  \n**4.** 选择 `appicon` 并点击 `OK`。`Icon` 字段现在具有正确的值。\n\n**5.** 保存文件：在 Eclipse 主工具栏中点击\
  \ `Save` 按钮，或选择 `File`，`Save`。\n\nPackage Explorer 中的红色 X 消失，表明应用现在已正确指定了图标。\n\n\
  ### 设计用户界面\n\n应用的图形用户界面由布局组成，布局是容纳诸如文本字段、按钮、图形以及您自己设计的自定义小部件等部件的容器。向用户显示的每个屏幕可以包含一个布局，或多个相互包含的布局。存在用于垂直或水平堆叠组件、将它们组织在表格中以及其他排列方式的布局。\n\
  \n一个应用可以简单到只有一个屏幕，也可以包含多个屏幕。一个游戏可以组织成这些屏幕：\n\n![Image](img/image00476.jpeg) 显示游戏加载时的启动画面\n\
  \n![Image](img/image00476.jpeg) 带有查看其他屏幕按钮的主菜单画面\n\n![Image](img/image00476.jpeg)\
  \ 解释如何游玩的帮助画面\n\n![Image](img/image00476.jpeg) 列出最高玩家分数的分数画面\n\n![Image](img/image00476.jpeg)\
  \ 命名游戏开发人员的制作人员名单画面\n\n![Image](img/image00476.jpeg) 实际游戏的游戏画面\n\n`Leader` 应用由一个屏幕组成，该屏幕包含用于联系美国总统或稍后指定的领导人的按钮。\n\
  \n\n\n\n## 应用布局与编辑\n\n所有应用的屏幕都保存在 `/res/layout` 文件夹中。本项目在此文件夹中有一个名为 `activity_leader.xml`\
  \ 的文件，它被指定为应用启动时显示的屏幕。\n\n要开始编辑此屏幕的布局，请在 Package Explorer 中双击 `activity_leader.xml`。屏幕将在\
  \ Eclipse 主窗口中打开，如 图 24.12 所示。\n\n![Image](img/image00564.jpeg)\n\n**FIGURE 24.12**\
  \ 编辑活动的图形用户界面。\n\n编辑窗口包含一个带有多个可展开文件夹的 **Palette** 窗格。其中 **Form Widgets** 子窗格（很可能默认展开）显示了一些简单的控件。这些控件可以被拖放到右侧的屏幕上。\n\
  \n按照以下步骤向屏幕添加三个图形按钮：\n\n**1.** 删除显示“Dummy Button”文本的文本视图控件。在屏幕上单击此控件，然后按 Delete\
  \ 键。\n\n**2.** 单击 **Palette** 窗格中的 `Layouts` 文件夹。子窗格会展开。\n\n**3.** 将 `LinearLayout\
  \ (vertical)` 控件从面板拖放到屏幕上。屏幕窗口上方会出现两个新按钮，其中一个处于选中状态：Set Horizontal Orientation。将布局拖放到屏幕上决定了放置其上的用户界面元素将如何排列。\n\
  \n**4.** 单击 **Palette** 窗格中的 `Images & Media` 文件夹。子窗格会展开。\n\n**5.** 将一个 **ImageButton**\
  \ 控件从 **Palette** 拖放到屏幕上。会打开一个 **Resource Chooser** 按钮，要求你选择要在按钮上显示的图像。选择 `phone`\
  \ 并单击 OK。按钮现在有了一个电话的图形。\n\n**6.** 拖动另一个 **ImageButton** 控件并将其放到电话按钮的右侧。为此按钮选择 `browser`\
  \ 资源。添加了一个浏览器按钮。\n\n**7.** 再拖动一个 **ImageButton** 控件并将其放到浏览器按钮的右侧，为其分配 `maps` 资源。\n\
  \n**8.** **Outline** 窗格列出了屏幕上的控件。选择 `imageButton1` 项。该按钮的属性将在 **Properties** 窗格中打开（参见\
  \ 图 24.13）。\n\n![Image](img/image00565.jpeg)\n\n**FIGURE 24.13** 自定义控件的属性。\n\n**9.**\
  \ 向下滚动 **Properties** 窗格，直到看到 **ID** 属性。其当前值设置为 `@+id/imageButton1`。将其更改为 `@+id/phonebutton`。一个对话框会询问是否要更新所有引用以反映此更改。单击\
  \ Yes。\n\n**10.** 在 **On Click** 属性中，输入值 `processClicks`。（这将在下一节中解释。）\n\n**11.**\
  \ 对 `imageButton2` 重复步骤 8-10，为其设置 ID `@+id/webbutton` 和 **On Click** 属性 `processClicks`。\n\
  \n**12.** 对 `imageButton3` 重复步骤 8-10，为其设置 ID `@+id/mapbutton` 和 **On Click** 属性\
  \ `processClicks`。\n\n**13.** 单击 **Outline** 中的 **LinearLayout** 项。屏幕的属性将出现在 **Properties**\
  \ 窗格中。\n\n**14.** 单击 **Background** 的值；然后单击 `...` 按钮。**Reference Chooser** 会打开。\n\
  \n**15.** 展开 **Drawable**，选择 `whitehouse`，然后单击 OK。白宫的图形成为屏幕的背景。\n\n**16.** 单击 **Save**\
  \ 按钮。\n\n完成的屏幕如 图 24.14 所示。\n\n![Image](img/image00566.jpeg)\n\n**FIGURE 24.14**\
  \ 预览应用的图形用户界面。\n\n## 编写 Java 代码\n\n此时，你已经完成了新应用的大部分工作，但还没有编写一行 Java 代码。在尽可能利用 Android\
  \ SDK 的功能而不求助于编程的情况下，应用开发会更容易。\n\n应用被组织成 **Activities**，它们代表应用可以做的事情。每个 **Activity**\
  \ 由其自己的 Java 类定义。创建此应用时，你指定应创建一个名为 `LeaderActivity` 的 **Activity**。与该名称匹配的类在应用加载时自动运行。\n\
  \n`LeaderActivity.java` 的源代码可以在 Package Explorer 的 `/src/org.cadenhead.android`\
  \ 文件夹中找到。双击此文件进行编辑。\n\n开始时，该类已有大量现有源代码。\n\n与所有 **Activities** 一样，`LeaderActivity`\
  \ 类是 `android.app` 包中 `Activity` 的子类，该包包含了显示屏幕、收集用户输入、保存用户偏好设置等必要的行为。\n\n类中定义的 `onCreate()`\
  \ 方法在类加载时被调用。\n\n***\n\n**Note**\n\n你可以打开 `/res/gen/org.cadenhead.android` 文件夹中的\
  \ `R.java` 文件进行查看，以了解更多关于为什么 `main` 资源被称为 `R.layout.main` 的信息。`R` 类是由 Android SDK\
  \ 自动生成的，以便能够通过其 ID 引用资源。你自己永远不应该编辑此类。\n\n***\n\n该方法做的第一件事是使用 `super()` 调用其超类中的相同方法：\n\
  \n```\nsuper.onCreate(savedInstanceState);\n```\n\n接下来，它调用 `setContentView()`，这是一个选择要显示的屏幕的方法。此方法的参数是一个实例变量\
  \ `R.layout.activity_leader`，它引用 `/res/layout` 中的文件 `activity_leader.xml`。你可能还记得，资源的\
  \ ID 是其不带扩展名的文件名。\n\n之前设计应用的用户界面时，你将每个按钮的 **On Click** 属性设置为 `processClicks`。这表示当用户单击屏幕上的控件时，将调用一个名为\
  \ `processClicks()` 的方法。\n\n现在是时候实现该方法了。将以下语句添加到 `LeaderActivity` 中 `onCreate()`\
  \ 方法的上方：\n\n```\npublic void processClicks(View display) {\n\n    Intent action;\n\
  \n    int id = display.getId();\n\n}\n```\n\n此方法使用一个参数进行调用：来自 `android.view` 包的\
  \ `View` 对象。`View` 是应用中某种视觉显示。在这种情况下，它是包含拨号器、浏览器和地图按钮的屏幕。\n\n`View` 对象的 `getId()`\
  \ 方法返回被单击按钮的 ID：`phonebutton`、`webbutton` 或 `mapbutton`。\n\n此 ID 存储在 `id` 变量中，以便可以在\
  \ `switch` 语句中使用，根据点击采取操作：\n\n```\nswitch (id) {\n\n    case (R.id.phonebutton):\n\
  \n        // ...\n\n        break;\n\n    case (R.id.webbutton):\n\n        // ...\n\
  \n        break;\n\n    case (R.id.mapbutton):\n\n        // ...\n\n        break;\n\
  \n    default:\n\n        break;\n\n}\n```\n\n此代码将执行三种操作之一，使用每个 ID 的整数作为 `switch`\
  \ 的条件。\n\n`processClicks()` 方法中的第一条语句创建一个变量来保存 `Intent` 对象，`Intent` 是 Android 的\
  \ `android.content` 包中的一个类：\n\n```\nIntent action;\n```\n\nAndroid 中的 **Intents**\
  \ 是 **Activities** 告诉另一个 **Activity** 要做什么的方式。它们也是应用与 Android 设备通信的方式。\n\n以下是此方法中使用的三个\
  \ **Intents**：\n\n```\naction = new Intent(Intent.ACTION_DIAL, Uri.parse(\"tel:202-456-1111\"\
  ));\n\naction = new Intent(Intent.ACTION_VIEW, Uri.parse(\"http://whitehouse.gov\"\
  ));\n\naction = new Intent(Intent.ACTION_VIEW, Uri.parse(\"geo:0,0?q=White House,\
  \ Washington, DC\"));\n```\n\n`Intent()` 构造函数接受两个参数：\n\n![Image](img/image00476.jpeg)\
  \ 要执行的操作，由其一个类变量表示\n\n![Image](img/image00476.jpeg) 与操作关联的数据\n\n这三个 **Intents**\
  \ 分别告诉 Android 设备设置拨出电话到白宫公共电话线路 (202) 456-1111、访问网站 [`http://whitehouse.gov`](http://whitehouse.gov)，以及加载地址为“White\
  \ House, Washington, DC”的 Google 地图。\n\n创建 **Intent** 后，以下语句使其执行操作：\n\n```\nstartActivity(action);\n\
  ```\n\n\n\n由于您已从活动界面中移除了 Dummy Button，因此必须删除这行代码，它是 `onCreate()` 方法中的最后一行：\n\n点击此处查看代码图像\n\
  \n```java\nfindViewById(R.id.dummy_button).setOnTouchListener (mDelayHideTouchListener);\n\
  ```\n\n一个简单的移除方法是在其前面加上 `//`，使其变为编译器会忽略的注释。\n\n为使您添加的代码正常工作，必须将以下 `import` 语句添加到类中：\n\
  \n点击此处查看代码图像\n\n```java\nimport android.app.Activity;\nimport android.content.Intent;\n\
  import android.net.Uri;\nimport android.os.Bundle;\nimport android.view.View;\n\
  ```\n\n`LeaderActivity` 类中 `processClicks()` 方法的完整代码如清单 24.1 所示。请确保您的代码与该清单一致。\n\
  \n**清单 24.1** `LeaderActivity.java` 的完整代码\n\n点击此处查看代码图像\n\n```java\n1:     public\
