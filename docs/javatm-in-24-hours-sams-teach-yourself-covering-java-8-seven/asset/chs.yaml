  \n如果没有错误，您几乎就可以运行该应用了。\n\n首先，必须为项目创建一个新的调试配置：\n\n**1.** 单击主 Eclipse 工具栏中“调试”按钮旁边的箭头；然后选择“调试配置”（Debug\
  \ Configurations）。“调试配置”对话框将打开。\n\n**2.** 在左侧窗格中双击 `Android Application`。一个名为 `New_configuration\
  \ (1)` 的新配置将被创建。\n\n**3.** 在“名称”字段中输入 `LeaderDebug`。\n\n**4.** 单击“浏览”按钮，选择项目 `Leader`，然后单击“确定”。\n\
  \n**5.** 单击“目标”（Target）选项卡将其置于前台。\n\n**6.** 当“部署目标选择模式”设置为 `Automatic` 时，选择 `SimpleAVD`\
  \ Android 虚拟设备。\n\n**7.** 将“部署目标选择模式”更改为“始终提示选择设备”（Always Prompt to Pick Device），单击“应用”（Apply），然后单击“关闭”（Close）。\n\
  \n将创建一个名为 LeaderDebug 的新调试配置。\n\n要运行该应用，请单击“调试”按钮旁边的箭头并选择 LeaderDebug（如果存在）。如果不存在，请选择“调试配置”（Debug\
  \ Configurations），选择 LeaderDebug，然后单击“调试”（Debug）。Android 设备选择器（Android Device Chooser）将打开。选择“启动新的\
  \ Android 虚拟设备”（Launch a New Android Virtual Device），选择 SimpleAVD，然后单击“确定”。\n\n\
  模拟器将在接下来的几分钟内加载，然后自动运行该应用。\n\n模拟器不能模拟 Android 设备的所有功能。Leader 应用的拨号器和浏览器按钮应能正常工作，但您可能会遇到地图方面的问题。\n\
  \n如果您有一部已与 Android SDK 配合工作且已设置为调试模式的 Android 手机，也可以在该手机上运行该应用。\n\n单击“调试”旁边的箭头并选择\
  \ LeaderDebug（这次它肯定应该存在）。选择“选择正在运行的 Android 设备”（Choose a Running Android Device），在列表中选择您的手机，然后单击“确定”。\n\
