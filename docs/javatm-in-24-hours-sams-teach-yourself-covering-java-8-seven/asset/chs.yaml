  \ 255，绿 255，蓝 0）。\n\n* * *\n\n当您运行应用程序时，如前面的图 16.1 所示，一个框架窗口包含了三个滑块，它们代表了框架底部面板中红色、绿色和蓝色的分量值。\n\
  \n您可以调整每个滑块的值以更改显示的颜色。\n\n### 使用图像图标和工具栏\n\n改善图形用户界面视觉吸引力的最简单方法之一是使用图标。这些小图像用于标识按钮和界面的其他部分。\n\
  \n通过使用`javax.swing`包中的`ImageIcon`类，您可以为许多 Swing 类库中的组件设置图像标签，而不是文本标签。\n\n您可以通过调用`ImageIcon(String)`构造方法从计算机上的文件创建`ImageIcon`。该方法的参数是文件的名称或路径和名称，如以下示例所示：\n\
  \n点击查看代码图像\n\n```java\nImageIcon stopSign = new ImageIcon(\"stopsign.gif\");\nImageIcon\
  \ saveFile = new ImageIcon(\"images/savefile.gif\");\n```\n\n用于创建图像图标的图形文件必须是 GIF、JPEG\
  \ 或 PNG 格式。大多数情况下使用的是 GIF 格式，它非常适合显示颜色数量有限的小型图形。\n\n* * *\n\n**注意**\n\n尽管某些操作系统使用`\\\
  `字符分隔文件夹和文件名，但`ImageIcon`构造方法要求使用`/`字符作为分隔符。\n\n* * *\n\n`ImageIcon`构造方法会立即从文件中加载整个图像。\n\
  \n您可以通过使用`JLabel(ImageIcon)`和`JButton(ImageIcon)`构造方法将图像图标用作标签和按钮，如以下示例所示：\n\n点击查看代码图像\n\
  \n```java\nImageIcon siteLogo = new ImageIcon(\"siteLogo.gif\");\nJLabel logoLabel\
  \ = new JLabel(siteLogo);\n\nImageIcon searchWeb = new ImageIcon(\"searchGraphic.gif\"\
  );\nJButton search = new JButton(searchWeb);\n```\n\n多个组件可以同时拥有图标和文本标签。以下语句创建了一个同时包含两者的按钮：\n\
  \n点击查看代码图像\n\n```java\nJButton refresh = new JButton(\"Refresh\",\n    \"images/refreshIcon.gif\"\
  );\n```\n\n图像图标通常用于工具栏中，工具栏是将几个组件组合成一行或一列的容器。\n\n通过使用`JToolBar`类创建的工具栏可以设计成允许用户将其从图形用户界面的一个部分移动到另一个部分。此过程称为停靠（docking），这些组件也称为可停靠工具栏。\n\
  \n您可以通过以下构造方法之一创建工具栏：\n\n![Image](img/image00476.jpeg) `JToolBar()` — 创建一个将组件水平排列的工具栏。\n\
  \n![Image](img/image00476.jpeg) `JToolBar(int)` — 创建一个将组件按指定方向排列的工具栏，方向为`SwingConstants.HORIZONTAL`或`SwingConstants.VERTICAL`。\n\
  \n组件添加到工具栏的方式与添加到其他容器的方式相同——通过调用`add(Component)`方法并传入要添加的组件。\n\n要使工具栏可停靠，它必须放置在使用`BorderLayout`作为其布局管理器的容器中。此布局将容器划分为北、南、东、西和中心区域。然而，当您使用可停靠工具栏时，容器只应使用其中两个：中心和一个方向区域。\n\
  \n工具栏应添加到方向区域。以下语句创建了一个垂直的、可停靠的工具栏，其中包含三个图标按钮：\n\n点击查看代码图像\n\n```java\nJPanel pane\
  \ = new JPanel();\nBorderLayout border = new BorderLayout();\npane.setLayout(border);\n\
  \nJToolBar bar = new JToolBar(SwingConstants.VERTICAL);\nImageIcon play = new ImageIcon(\"\
  play.gif\");\nJButton playButton = new JButton(play);\nImageIcon stop = new ImageIcon(\"\
  stop.gif\");\nJButton stopButton = new JButton(stop);\nImageIcon pause = new ImageIcon(\"\
  pause.gif\");\nJButton pauseButton = new JButton(pause);\n\nbar.add(playButton);\n\
  bar.add(stopButton);\nbar.add(pauseButton);\n\nadd(bar, BorderLayout.WEST);\n```\n\
  \n您在接下来这个小时进行的项目是`Tool`，一个包含图像图标和可停靠工具栏的 Java 应用程序。创建一个名为`Tool`的 Java 文件，在文件中输入清单\
  \ 16.2，然后保存该文件。\n\n**清单 16.2 `Tool.java`的完整文本**\n\n点击查看代码图像\n\n* * *\n\n```java\n\
