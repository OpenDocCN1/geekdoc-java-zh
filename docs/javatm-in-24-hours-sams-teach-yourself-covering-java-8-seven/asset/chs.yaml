  \n# 第 7 小时。使用条件测试进行决策\n\n本小时待办事项：\n\n![图片](img/image00474.jpeg) 使用 `if` 语句进行基本条件测试。\n\
  ![图片](img/image00474.jpeg) 测试一个值是否大于或小于另一个值。\n\n\n\n\n![Image](img/image00474.jpeg)\
  \ 测试两个值是相等还是不相等。\n\n![Image](img/image00474.jpeg) 使用 `else` 语句作为 `if` 语句的反向操作。\n\
  \n![Image](img/image00474.jpeg) 将多个条件测试链接在一起。\n\n![Image](img/image00474.jpeg) 对于复杂的条件测试，使用\
  \ `switch` 语句。\n\n![Image](img/image00474.jpeg) 使用三元运算符创建测试。\n\n当你编写计算机程序时，你会向计算机提供一系列称为语句的指令，并且这些指令会被一字不差地执行。你可以告诉计算机去计算一些复杂的数学公式，它就会照做。告诉它显示一些信息，它就会忠实地响应。\n\
  \n有时你需要计算机在做什么事情上更具选择性。例如，如果你编写了一个平衡支票簿的程序，你可能希望计算机在你的账户透支时显示警告信息。计算机应该只在你的账户透支时才显示此消息。如果没透支，这条信息就不准确，并且会令人感到不快。\n\
  \n在 Java 程序中实现此任务的方法是使用条件语句，即只有在满足特定条件时才会在程序中执行某些操作的语句。在本节中，你将学习如何使用条件语句 `if`、`else`\
  \ 和 `switch`。\n\n当 Java 程序做出决策时，它通过使用条件语句来实现。在本节中，你将使用条件关键字 `if`、`else`、`switch`、`case`\
  \ 和 `break`，以及条件运算符 `==`、`!=`、`<`、`>`、`<=`、`>=` 和 `?`，来检查你 Java 程序中多个事物的条件，同时使用\
  \ `boolean` 变量。\n\n### if 语句\n\n在 Java 中测试条件最基本的方法是使用 `if` 语句。`if` 语句测试一个条件是真还是假，并且只在条件为真时采取行动。\n\
  \n你使用 `if` 加上要测试的条件，就像下面的语句一样：\n\n单击此处查看代码图片\n\n```\nlong account = -17_000_000_000_000L;\n\
  \nif (account < 0) {\n    System.out.println(\"Account overdrawn; you need a bailout\"\
  );\n}\n```\n\n`if` 语句使用小于运算符 `<` 检查 `account` 变量是否小于 0。如果是，则执行 `if` 语句内的代码块，显示文本。\n\
  \n该代码块仅在条件为真时运行。在前面的例子中，如果 `account` 变量的值为 0 或更高，则 `println` 语句将被忽略。请注意，你测试的条件必须用括号括起来，例如\
  \ `(account < 0)`。\n\n小于运算符 `<` 是你可以与条件语句一起使用的几种运算符之一。\n\n#### 小于和大于比较\n\n在上一节中，`<`\
  \ 运算符的使用方式与数学课上相同：作为小于号。还有一个大于条件运算符 `>`，用在以下语句中：\n\n单击此处查看代码图片\n\n```\nint elephantWeight\
  \ = 900;\nint elephantTotal = 13;\nint cleaningExpense = 200;\n\nif (elephantWeight\
  \ > 780) {\n    System.out.println(\"Elephant too big for tightrope act\");\n}\n\
  \nif (elephantTotal > 12) {\n    cleaningExpense = cleaningExpense + 150;\n}\n```\n\
  \n第一个 `if` 语句测试 `elephantWeight` 变量的值是否大于 780。第二个 `if` 语句测试 `elephantTotal` 变量是否大于\
  \ 12。\n\n如果在一个 `elephantWeight` 等于 600 且 `elephantTotal` 等于 10 的程序中使用前面两条语句，则每个\
  \ `if` 块内的语句都将被忽略。\n\n你可以使用 `<=` 运算符来确定某个东西是否小于或等于另一个东西。例如：\n\n单击此处查看代码图片\n\n```\n\
  if (account <= 0) {\n    System.out.println(\"You are flat broke\");\n}\n```\n\n\
  还有一个 `>=` 运算符用于大于或等于测试。\n\n#### 等于和不等于比较\n\n程序中要检查的另一个条件是相等性。一个变量是否等于特定值？一个变量是否等于另一个变量的值？这些问题可以使用\
  \ `==` 运算符来回答，如下面的语句所示：\n\n单击此处查看代码图片\n\n```\nif (answer == rightAnswer) {\n   \
  \ studentGrade = studentGrade + 10;\n}\n\nif (studentGrade == 100) {\n    System.out.println(\"\
  Show off!\");\n}\n```\n\n你也可以使用 `!=` 运算符来测试不等性，即某个东西是否不等于另一个东西，如下所示：\n\n单击此处查看代码图片\n\
  \n```\nif (answer != rightAnswer) {\n    score = score - 5;\n}\n```\n\n***\n\n**注意**\n\
  \n用于进行相等性测试的运算符有两个等号：`==`。很容易将这个运算符与用于给变量赋值的 `=` 运算符混淆。在条件语句中务必使用两个等号。\n\n***\n\n\
  你可以对除了字符串之外的每种类型的变量使用 `==` 和 `!=` 运算符，因为字符串是对象。\n\n#### 使用代码块语句组织程序\n\n到目前为止，本节中的\
  \ `if` 语句都伴随着一个包含在 `{` 和 `}` 括号内的代码块。（我认为这些字符的技术术语是“大括号”。）\n\n之前，你已经看到如何使用代码块语句来标记\
  \ Java 程序 `main()` 块的开始和结束。`main()` 块中的每条语句在程序运行时都会被处理。\n\n`if` 语句并不一定需要代码块语句。它可以只占一行，如下面的例子：\n\
  \n单击此处查看代码图片\n\n```\nif (account <= 0) System.out.println(\"No more money\");\n\
  ```\n\n`if` 条件后的语句仅在条件为真时执行。\n\n清单 7.1 是一个使用代码块语句表示 `main()` 块的 Java 程序示例。代码块语句从第\
  \ 3 行的开始大括号 `{` 开始，到第 15 行的结束大括号 `}` 结束。在 NetBeans 的 `com.java24hours` 包中创建一个名为\
  \ `Game` 的新空 Java 文件，并输入清单 7.1 中的文本。\n\n**清单 7.1** `Game` 程序\n\n单击此处查看代码图片\n\n```\n\
  1: package com.java24hours;\n2: \n3: class Game {\n4:     public static void main(String[]\
  \ arguments) {\n5:         int total = 0;\n6:         int score = 7;\n7:       \
  \  if (score == 7) {\n8:             System.out.println(\"You score a touchdown!\"\
  );\n9:         }\n10:         if (score == 3) {\n11:             System.out.println(\"\
  You kick a field goal!\");\n12:         }\n13:         total = total + score;\n\
  14:         System.out.println(\"Total score: \" + total);\n15:     }\n16: }\n```\n\
  \n运行程序时，输出应类似于图 7.1。\n\n![Image](img/image00495.jpeg)\n\n**图 7.1** `Game` 程序的输出。\n\
  \n你可以在 `if` 语句中使用代码块语句，使计算机在条件为真时执行多项操作。下面是一个包含代码块语句的 `if` 语句示例：\n\n单击此处查看代码图片\n\
  \n```\nint playerScore = 12000;\nint playerLives = 3;\nint difficultyLevel = 10;\n\
  \nif (playerScore > 9999) {\n    playerLives++;\n    System.out.println(\"Extra\
  \ life!\");\n    difficultyLevel = difficultyLevel + 5;\n}\n```\n\n大括号用于将所有属于 `if`\
  \ 语句的语句分组。如果变量 `playerScore` 大于 9,999，则会发生三件事：\n\n![Image](img/image00476.jpeg)\
  \ `playerLives` 变量的值增加 1（因为使用了递增运算符 `++`）。\n\n![Image](img/image00476.jpeg) 显示文本“Extra\
  \ life!”。\n\n![Image](img/image00476.jpeg) `difficultyLevel` 变量的值增加 5。\n\n\n\n\n\
  如果变量`playerScore`不大于 9,999，则什么都不会发生。`if`语句块内的所有三条语句都将被忽略。\n\n### if-else 语句\n\n\
  有时，你想在条件为真时执行某些操作，在条件为假时执行另一些操作。这可以通过在`if`语句的基础上使用`else`语句来实现，如下例所示：\n\n点击此处查看代码图片\n\
  \n```\nint answer = 17;\nint correctAnswer = 13;\n\nif (answer == correctAnswer)\
  \ {\n    score += 10;\n    System.out.println(\"That's right. You get 10 points\"\
  );\n} else {\n    score -= 5;\n    System.out.println(\"Sorry, that's wrong. You\
  \ lose 5 points\");\n}\n```\n\n与`if`语句不同，`else`语句本身不列出条件。`else`语句与其前面紧邻的`if`语句配对。你还可以使用`else`将多个`if`语句链接在一起，如下例所示：\n\
  \n点击此处查看代码图片\n\n```\nif (grade == 'A') {\n    System.out.println(\"You got an A.\
  \ Awesome!\");\n} else if (grade == 'B') {\n    System.out.println(\"You got a B.\
  \ Beautiful!\");\n} else if (grade == 'C') {\n    System.out.println(\"You got a\
  \ C. Concerning!\");\n} else {\n    System.out.println(\"You got an F. You'll do\
  \ well in Congress!\");\n}\n```\n\n通过将多个`if`和`else`语句以这种方式组合，你可以处理多种条件。前面的例子向 A\
  \ 等生、B 等生、C 等生以及未来的议员们发送了特定的消息。\n\n### switch 语句\n\n`if`和`else`语句适用于有两种可能条件的情况，但有时你会遇到超过两种条件的情况。\n\
  \n在前面的成绩示例中，你看到了`if`和`else`语句可以链接起来处理多个不同的条件。\n\n另一种方法是使用`switch`语句，它可以测试多种不同的条件并做出相应反应。在下面的代码中，成绩示例已使用`switch`语句重写：\n\
  \n点击此处查看代码图片\n\n```\nswitch (grade) {\n    case 'A':\n        System.out.println(\"\
  You got an A. Awesome!\");\n        break;\n    case 'B':\n        System.out.println(\"\
  You got a B. Beautiful!\");\n        break;\n    case 'C':\n        System.out.println(\"\
  You got a C. Concerning!\");\n        break;\n    default:\n        System.out.println(\"\
  You got an F. You'll do well in Congress!\");\n}\n```\n\n`switch`语句的第一行指定了被测试的变量——在本例中是`grade`。然后，`switch`语句使用`{`和`}`花括号形成一个块语句。\n\
  \n每个`case`语句将`switch`语句中的测试变量与一个特定值进行比较。`case`语句中使用的值可以是字符、整数或字符串。在前面的例子中，有针对字符\
  \ A、B 和 C 的`case`语句。每个`case`语句后面都有一条或多条语句。当某个`case`语句的值与`switch`中的变量匹配时，计算机将处理`case`语句之后的语句，直到遇到`break`语句。\n\
  \n例如，如果`grade`变量的值为 B，则会显示文本“You got a B. Good work!”。下一条语句是`break`，因此`switch`语句中的其他内容都不会执行。`break`语句告诉计算机跳出`switch`语句。\n\
  \n忘记在`switch`语句中使用`break`语句会导致不期望的结果。如果这个成绩示例中没有`break`语句，那么无论`grade`变量等于‘A’、‘B’还是‘C’，前三个“You\
  \ got a”消息都会被显示。\n\n`default`语句用作所有前面的`case`语句都不为真时的默认处理。在这个例子中，如果`grade`变量不等于 A、B\
  \ 或 C，则会执行`default`语句。你不必在每个`switch`块语句中都使用`default`语句。如果省略了它，当没有`case`语句匹配时，什么都不会发生。\n\
  \n清单 7.2 中的`Commodity`类使用`switch`来购买或出售某种未指定的商品。该商品在购买时花费 20 美元，出售时获利 15 美元。\n\n\
  一个`switch`-`case`语句测试一个名为`command`的字符串的值，如果它等于“BUY”则运行一个代码块，如果它等于“SELL”则运行另一个代码块。\n\
  \n清单 7.2 `Commodity` 程序\n\n点击此处查看代码图片\n\n```\n 1: package com.java24hours;\n 2:\n\
  \ 3: class Commodity {\n 4:     public static void main(String[] arguments) {\n\
  \ 5:         String command = \"BUY\";\n 6:         int balance = 550;\n 7:    \
  \     int quantity = 42;\n 8:\n 9:         switch (command) {\n10:             case\
  \ \"BUY\":\n11:                 quantity += 5;\n12:                 balance -= 20;\n\
  13:                 break;\n14:             case \"SELL\":\n15:                \
  \ quantity -= 5;\n16:                 balance += 15;\n17:         }\n18:       \
  \  System.out.println(\"Balance: \" + balance + \"\\n\"\n19:             + \"Quantity:\
  \ \" + quantity);\n20:     }\n21: }\n```\n\n此应用程序在第 5 行将`command`字符串设置为“BUY”。当`switch`被测试时，第\
  \ 11-13 行的`case`块被执行。商品数量增加 5，余额减少 20 美元。\n\n运行`Commodity`程序时，会产生如图 7.2 所示的输出。\n\
  \n![图片](img/image00496.jpeg)\n**图 7.2** `Commodity`程序的输出。\n\n### 三元运算符\n\nJava 中最复杂的条件语句是三元运算符`?`。\n\
  \n当你想根据条件赋值或显示一个值时，可以使用三元运算符。例如，考虑一个视频游戏，它根据`skillLevel`变量是否大于 5 来设置`numberOfEnemies`变量。一种方法是使用`if`-`else`语句：\n\
  \n```\nif (skillLevel > 5) {\n    numberOfEnemies = 20;\n} else {\n    numberOfEnemies\
  \ = 10;\n}\n```\n\n一种更短的方法是使用三元运算符。一个三元表达式由五部分组成：\n\n![图片](img/image00476.jpeg)\
  \ 用括号括起来的待测条件，例如 `(skillLevel > 5)`\n![图片](img/image00476.jpeg) 一个问号 (?)\n![图片](img/image00476.jpeg)\
  \ 条件为真时使用的值\n![图片](img/image00476.jpeg) 一个冒号 (:)\n![图片](img/image00476.jpeg) 条件为假时使用的值\n\
  \n要使用三元运算符根据`skillLevel`设置`numberOfEnemies`，你可以使用以下语句：\n\n点击此处查看代码图片\n\n```\nint\
  \ numberOfEnemies = (skillLevel > 5) ? 20 : 10;\n```\n\n你也可以使用三元运算符来决定显示什么信息。考虑一个程序的例子，它根据`gender`变量的值显示文本“Mr.”或“Ms.”。下面是一条完成此操作的语句：\n\
  \n点击此处查看代码图片\n\n```\nSystem.out.print( (gender.equals(\"male\")) ? \"Mr.\" : \"\
  Ms.\" );\n```\n\n三元运算符可能很有用，但它也是 Java 中最难理解的条件语句。在学习 Java 的过程中，你不会遇到必须使用三元运算符而不是`if`-`else`语句的情况。\n\
  \n### 观察时钟\n\n本小时的最后一个项目让你再次审视程序中可以使用的每种条件测试。在这个项目中，你将使用 Java 内置的时间跟踪功能，该功能可以跟踪当前的日期和时间，并以句子形式呈现这些信息。\n\
  \n\n\n# 启动 NetBeans 或您正在使用的其他开发工具，为新建文档命名`Clock.java`，包名设置为`com.java24hours`。\n\n\
  此程序较长，但大部分由多行条件语句组成。请在编辑器中完整输入清单 7.3 的内容，完成后将文件保存为`Clock.java`。\n\n## 清单 7.3 `Clock`\
  \ 程序\n\n点击查看代码图片\n\n```java\npackage com.java24hours;\n\nimport java.time.*;\nimport\
  \ java.time.temporal.*;\n\nclass Clock {\n    public static void main(String[] arguments)\
  \ {\n        // get current time and date\n        LocalDateTime now = LocalDateTime.now();\n\
  \        int hour = now.get(ChronoField.HOUR_OF_DAY);\n        int minute = now.get(ChronoField.MINUTE_OF_HOUR);\n\
  \        int month = now.get(ChronoField.MONTH_OF_YEAR);\n        int day = now.get(ChronoField.DAY_OF_MONTH);\n\
  \        int year = now.get(ChronoField.YEAR);\n\n        // display greeting\n\
  \        if (hour < 12) {\n            System.out.println(\"Good morning.\\n\");\n\
  \        } else if (hour < 17) {\n            System.out.println(\"Good afternoon.\\\
  n\");\n        } else {\n            System.out.println(\"Good evening.\\n\");\n\
  \        }\n\n        // begin time message by showing the minutes\n        System.out.print(\"\
  It's\");\n        if (minute != 0) {\n            System.out.print(\" \" + minute\
  \ + \" \");\n            System.out.print( (minute != 1) ? \"minutes\" :\n     \
  \           \"minute\");\n            System.out.print(\" past\");\n        }\n\n\
  \        // display the hour\n        System.out.print(\" \");\n        System.out.print(\
  \ (hour > 12) ? (hour - 12) : hour );\n        System.out.print(\" o'clock on \"\
  );\n\n        // display the name of the month\n        switch (month) {\n     \
  \       case 1:\n                System.out.print(\"January\");\n              \
  \  break;\n            case 2:\n                System.out.print(\"February\");\n\
  \                break;\n            case 3:\n                System.out.print(\"\
  March\");\n                break;\n            case 4:\n                System.out.print(\"\
  April\");\n                break;\n            case 5:\n                System.out.print(\"\
  May\");\n                break;\n            case 6:\n                System.out.print(\"\
  June\");\n                break;\n            case 7:\n                System.out.print(\"\
  July\");\n                break;\n            case 8:\n                System.out.print(\"\
  August\");\n                break;\n            case 9:\n                System.out.print(\"\
  September\");\n                break;\n            case 10:\n                System.out.print(\"\
  October\");\n                break;\n            case 11:\n                System.out.print(\"\
  November\");\n                break;\n            case 12:\n                System.out.print(\"\
  December\");\n        }\n\n        // display the date and year\n        System.out.println(\"\
  \ \" + day + \", \" + year + \".\");\n    }\n}\n```\n\n### 注意\n\n由于此程序使用了 Java 8\
