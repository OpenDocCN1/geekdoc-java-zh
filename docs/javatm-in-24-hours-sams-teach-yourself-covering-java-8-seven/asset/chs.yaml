  \ 第 16 行——在循环外部，程序显示其执行平方根计算的次数。\n\n应用程序的输出显示在图 8.2 的输出窗格中。\n\n![Image](img/image00499.jpeg)\n\
  \n**图 8.2** `Benchmark`程序的输出。\n\n`Benchmark`程序是查看你的计算机是否比我的计算机更快的好方法。在测试此程序期间，我的笔记本电脑执行了大约\
  \ 29 亿次计算。如果你的计算机结果更好，别只是给我发慰问信。多买几本我的书，这样我就能升级了。\n\n```\nif (condVar > someVal)\
  \ {console.log(\"xxx\")}\n```\n\n\n\n\nJava 对于数组声明时方括号的放置位置相当灵活。你可以将它们放在变量名之后，而不是变量类型之后，如下所示：\n\
  \n`String niceChild[];`\n\n为了让数组在程序中更易于识别，你应该保持一种风格，而不是来回切换。本书中使用数组的程序总是将方括号放在变量或对象类型之后。\n\
  \n***\n\n前面的例子创建了数组，但没有在其中存储任何值。为此，你可以使用`new`关键字配合变量类型，或在`{`和`}`标记内直接存储值。使用`new`时，你必须指定数组中存储多少个不同的项目。数组中的每个项目称为一个元素。以下语句创建了一个数组并为其预留了存储空间：\n\
  \n点击此处查看代码图片\n\n`int[] elfSeniority = new int[250];`\n\n此示例创建了一个名为`elfSeniority`的整数数组。该数组有\
  \ 250 个元素，可以存储圣诞老人的每个小矮人在北极工作了多长时间。（如果圣诞老人经营的是一个工会企业，这些信息就非常重要，需要跟踪。）\n\n当你使用`new`语句创建数组时，必须指定元素数量。数组的每个元素都有一个初始值，该值取决于数组的类型。所有数值数组的初始值为`0`，`char`数组的初始值为`'\\\
  0'`，`boolean`数组的初始值为`false`。`String`数组和所有其他对象的初始值为`null`。\n\n对于不是特别大的数组，你可以在创建时同时设置它们的初始值。以下示例创建了一个字符串数组并为其赋予初始值：\n\
  \n点击此处查看代码图片\n\n`String[] reindeerNames = { \"Dasher\", \"Dancer\", \"Prancer\"\
  , \"Vixen\", \"Comet\", \"Cupid\", \"Donder\", \"Blitzen\" };`\n\n应存储在数组元素中的信息被放置在`{`和`}`括号内，每个元素用逗号分隔。数组中的元素数量被设置为逗号分隔列表中的元素数量。\n\
  \n数组元素是编号的，第一个元素从`0`开始。可以通过在`[`和`]`括号内引用这个数字来访问特定的元素。前面的语句与以下代码完成相同的事情：\n\n点击此处查看代码图片\n\
  \n```java\nString[] reindeerNames = new String[8];\nreindeerNames[0] = \"Dasher\"\
  ;\nreindeerNames[1] = \"Dancer\";\nreindeerNames[2] = \"Prancer\";\nreindeerNames[3]\
  \ = \"Vixen\";\nreindeerNames[4] = \"Comet\";\nreindeerNames[5] = \"Cupid\";\nreindeerNames[6]\
  \ = \"Donder\";\nreindeerNames[7] = \"Blitzen\";\n```\n\n数组的每个元素必须是相同的类型。这里，使用字符串来保存每个驯鹿的名字。\n\
  \n数组创建后，你就无法为更多元素腾出空间。即使你回想起了最著名的驯鹿，也无法将“Rudolph”作为`reindeerNames`数组的第九个元素添加进去。Java\
  \ 编译器不会让可怜的 Rudolph 加入任何`reindeerNames`。\n\n### 使用数组\n\n在程序中使用数组与使用任何变量一样，但有一个区别：必须在数组名旁边的方括号内提供数组项目的元素编号。你可以在任何可以使用变量的地方使用数组元素。以下所有语句都使用了在本小时示例中已定义的数组：\n\
  \n点击此处查看代码图片\n\n```java\nelfSeniority[193] += 1;\nniceChild[9428] = \"Eli\";\ncurrentNation\
  \ = 413;\nif (hostileAirTravelNations[currentNation] == true) {\n    sendGiftByMail();\n\
  }\n```\n\n因为数组的第一个元素编号是`0`而不是`1`，这意味着最高编号比你预期的要小一。考虑以下语句：\n\n点击此处查看代码图片\n\n`String[]\
  \ topGifts = new String[10];`\n\n此语句创建了一个字符串变量数组，编号从`0`到`9`。如果你在程序的某个地方引用了`topGifts[10]`，你会得到一条引用`ArrayIndexOutOfBoundsException`的错误消息。\n\
  \n异常是 Java 程序中表示错误的另一个词。这个异常是“数组索引越界”错误，意味着程序试图使用在其定义边界之外不存在的数组元素。你将在第 18 小时“处理程序中的错误”中了解更多关于异常的信息。\n\
  \n如果你想检查数组的上限以避免超出该限制，每个创建的数组都关联一个名为`length`的变量。`length`变量是一个整数，包含数组持有的元素数量。以下示例创建了一个数组，然后报告其长度：\n\
  \n点击此处查看代码图片\n\n```java\nString[] reindeerNames = { \"Dasher\", \"Dancer\", \"Prancer\"\
  , \"Vixen\", \"Comet\", \"Cupid\", \"Donder\", \"Blitzen\", \"Rudolph\" };\nSystem.out.println(\"\
  There are \" + reindeerNames.length + \" reindeer.\");\n```\n\n在此示例中，`reindeerNames.length`的值为`9`，这意味着你可以指定的最高元素编号是`8`。\n\
  \n在 Java 中，你可以将文本作为字符串或字符数组来处理。当你处理字符串时，一个有用的技术是将字符串中的每个字符放入字符数组各自的元素中。为此，请调用字符串的`toCharArray()`方法，该方法生成一个`char`数组，其元素数量与字符串长度相同。\n\
  \n本小时的第一个项目使用了本节介绍的两种技术。`SpaceRemover`程序显示一个字符串，其中所有空格字符都被替换为句点（`.`）。\n\n要开始，请在\
  \ NetBeans 中打开 Java24 项目，选择“文件”、“新建文件”，并创建一个名为`SpaceRemover`的新空 Java 文件。在源代码编辑器中输入清单\
  \ 9.1，完成后保存。\n\n**清单 9.1** `SpaceRemover.java`的完整文本\n\n点击此处查看代码图片\n\n***\n\n```java\n\
  package com.java24hours;\n\nclass SpaceRemover {\n    public static void main(String[]\
  \ arguments) {\n        String mostFamous = \"Rudolph the Red-Nosed Reindeer\";\n\
  \        char[] mfl = mostFamous.toCharArray();\n        for (int dex = 0; dex <\
  \ mfl.length; dex++) {\n            char current = mfl[dex];\n            if (current\
  \ != ' ') {\n                System.out.print(current);\n            } else {\n\
  \                System.out.print('.');\n            }\n        }\n        System.out.println();\n\
  \    }\n}\n```\n\n***\n\n使用命令“运行”、“运行文件”运行程序，可以看到如图 9.1 所示的输出。\n\n![图片](img/image00500.jpeg)\n\
  \n**图 9.1** `SpaceRemover`程序的输出。\n\n`SpaceRemover`应用程序将文本“Rudolph the Red-Nosed\
  \ Reindeer”存储在两个地方：一个名为`mostFamous`的字符串和一个名为`mfl`的`char`数组。数组在第 6 行通过调用`mostFamous`的`toCharArray()`方法创建，该方法用文本中的每个字符填充数组的一个元素。字符“R”放入元素`0`，“u”放入元素`1`，依此类推，直到元素`29`中的“r”。\n\
  \n第 7-14 行的`for`循环检查`mfl`数组中的每个字符。如果字符不是空格，则显示它。如果是空格，则显示“.”字符代替。\n\n### 多维数组\n\n\
  到目前为止，本小时讨论的数组都是一维的，因此你可以使用单个数字检索元素。某些类型的信息需要更多维度才能作为数组充分存储，例如（x，y）坐标系中的点。数组的一个维度可以存储\
  \ x 坐标，另一个维度可以存储 y 坐标。\n\n\n\n\n要创建一个具有两个维度的数组，在创建和使用该数组时必须使用额外的一组方括号，如下列语句所示：\n\
  \n```java\nboolean[][] selectedPoint = new boolean[50][50];\n\nselectedPoint[4][13]\
  \ = true;\n\nselectedPoint[7][6] = true;\n\nselectedPoint[11][22] = true;\n```\n\
  \n这个示例创建了一个名为`selectedPoint`的布尔值数组。该数组在第一维有 50 个元素，在第二维也有 50 个元素，因此总共有 2500 个独立的数组元素（50\
  \ 乘以 50）。当数组被创建时，每个元素都被赋予默认值`false`。三个元素被赋予了`true`值：一个位于`(x,y)`位置`4,13`的点，一个位于`7,6`的点，以及一个位于`11,22`的点。\n\
  \n数组可以拥有你需要的任意多维度，但要记住，如果它们非常大，会占用大量内存。创建这个 50×50 的`selectedPoint`数组等同于创建了 2500\
  \ 个独立的变量。\n\n### 数组排序\n当你将一堆相似的项目分组到一个数组中后，你可以做的一件事就是重新排列这些项目。以下语句交换一个名为`numbers`的整数数组中两个元素的值：\n\
  \n```java\nint temporary = numbers[5];\n\nnumbers[5] = numbers[6];\n\nnumbers[6]\
  \ = temporary;\n```\n\n这些语句的结果是`numbers[5]`和`numbers[6]`彼此交换了值。名为`temporary`的整数变量用作交换其中一个值的临时存储位置。排序是将一组相关项目按特定顺序排列的过程，例如将一个数字列表从最低到最高排序。\n\
  \n圣诞老人可以使用排序来按姓氏安排礼物接收者的顺序，这样 Willie Aames 和 Hank Aaron 就能比字母顺序不幸的 Dweezil Zappa\
  \ 和 Jim Zorn 更早地获得他们的圣诞礼物。\n\n在 Java 中对数组进行排序很容易，因为`Arrays`类完成了所有工作。`Arrays`是`java.util`类组的一部分，可以重新排列所有变量类型的数组。\n\
  \n要在程序中使用`Arrays`类，请遵循以下步骤：\n\n1. 使用`import java.util.*`语句，使所有`java.util`类在程序中可用。\n\
  2. 创建数组。\n3. 使用`Arrays`类的`sort()`方法来重新排列数组。\n\n由`Arrays`类排序的变量数组会被重新排列成升序的数值顺序。字符和字符串则按字母顺序排列。\n\
  \n为了实际看到这一点，创建一个名为`NameSorter`的新空白 Java 文件，并在源代码编辑器中输入清单 9.2 的内容。\n\n清单 9.2 `NameSorter.java`的完整源代码\n\
  \n```java\npackage com.java24hours;\n\nimport java.util.*;\n\nclass NameSorter {\n\
  \    public static void main(String[] arguments) {\n        String names[] = { \"\
  Glimmer\", \"Marvel\", \"Rue\", \"Clove\",\n            \"Thresh\", \"Foxface\"\
  , \"Cato\", \"Peeta\", \"Katniss\" };\n        System.out.println(\"The original\
  \ order:\");\n        for (int i = 0; i < names.length; i++) {\n            System.out.println(i\
  \ + \": \" + names[i]);\n        }\n        System.out.println();\n        Arrays.sort(names);\n\
  \        System.out.println(\"The new order:\");\n        for (int i = 0; i < names.length;\
  \ i++) {\n            System.out.println(i + \": \" + names[i]);\n        }\n  \
  \      System.out.println();\n    }\n}\n```\n\n当你运行这个 Java 程序时，它会先按原始顺序显示九个名字的列表，对名字进行排序，然后重新显示列表。图\
  \ 9.2 展示了输出结果。\n\n![图片](img/image00501.jpeg)\n**图 9.2** `NameSorter`程序的输出。\n\n当你使用字符串和基本类型变量（如整数和浮点数）时，只能使用`Arrays`类按升序对它们进行排序。如果你在排序时想要元素的不同排列，或者想要比`Arrays`类提供的更高效率，你可以自己手写排序代码。\n\
  \n### 统计字符串中的字符\n英语中最常出现的字母是 E、R、S、T、L、N、C、D、M 和 O，顺序如上。如果你碰巧参加联播游戏节目《幸运轮盘》（*Wheel\
  \ of Fortune*），这是一个值得了解的事实。\n\n> **注意**\n> 如果你不熟悉这个节目，《幸运轮盘》是一个游戏，三位参赛者猜测一个短语、名称或引语的字母。如果他们猜对一个字母，并且它是辅音，他们就能赢得大转盘上转出的金额。要重现这种体验，可以在演播室观众面前和朋友玩猜词游戏，当有人猜对字母时分发随机金额的钱，并给获胜者一台新的\
  \ Amana 炉灶。\n\n你的下一个 Java 程序会统计你输入的尽可能多的不同短语和表达式中的字母频率。一个数组被用来统计每个字母出现的次数。完成后，程序会呈现每个字母在这些短语中出现的次数。\n\
  \n在 NetBeans 中创建一个新的空白 Java 文件`Wheel.java`，填充清单 9.3 的内容，完成后保存文件。你可以随意在第 17 行和第 18\
  \ 行之间添加额外的短语，格式与第 17 行完全一致。\n\n清单 9.3 `Wheel.java`的完整源代码\n\n```java\npackage com.java24hours;\n\
  \nclass Wheel {\n    public static void main(String[] arguments) {\n        String\
  \ phrase[] = {\n            \"A STITCH IN TIME SAVES NINE\",\n            \"DON'T\
  \ EAT YELLOW SNOW\",\n            \"JUST DO IT\",\n            \"EVERY GOOD BOY\
  \ DOES FINE\",\n            \"I WANT MY MTV\",\n            \"I LIKE IKE\",\n  \
  \          \"PLAY IT AGAIN, SAM\",\n            \"FROSTY THE SNOWMAN\",\n      \
  \      \"ONE MORE FOR THE ROAD\",\n            \"HOME FIELD ADVANTAGE\",\n     \
  \       \"VALENTINE'S DAY MASSACRE\",\n            \"GROVER CLEVELAND OHIO\",\n\
  \            \"SPAGHETTI WESTERN\",\n            \"AQUA TEEN HUNGER FORCE\",\n \
  \           \"IT'S A WONDERFUL LIFE\"\n        };\n        int[] letterCount = new\
  \ int[26];\n        for (int count = 0; count < phrase.length; count++) {\n    \
  \        String current = phrase[count];\n            char[] letters = current.toCharArray();\n\
  \            for (int count2 = 0;  count2 < letters.length; count2++) {\n      \
  \          char lett = letters[count2];\n                if ( (lett >= 'A') & (lett\
  \ <= 'Z') ) {\n                    letterCount[lett - 'A']++;\n                }\n\
  \            }\n        }\n        for (char count = 'A'; count <= 'Z'; count++)\
  \ {\n            System.out.print(count + \": \" +\n                letterCount[count\
  \ - 'A'] +\n                \" \");\n            if (count == 'M') {\n         \
  \       System.out.println();\n            }\n        }\n        System.out.println();\n\
  \    }\n}\n```\n\n如果你在没有添加自己短语的情况下运行该程序，输出应类似于图 9.3。\n\n![图片](img/image00502.jpeg)\n\
  **图 9.3** `Wheel`程序的输出。\n\n`Wheel`程序中发生的主要事情如下：\n\n![图片](img/image00476.jpeg) 第\
  \ 5–21 行——短语存储在一个名为`phrase`的字符串数组中。\n![图片](img/image00476.jpeg) 第 22 行——创建了一个名为`letterCount`的整数数组，包含\
  \ 26 个元素。这个数组用于存储每个字母出现的次数。元素的顺序是从‘A’到‘Z’。`letterCount[0]`存储字母‘A’的计数，`letterCount[1]`存储‘B’的计数，依此类推，直到`letterCount[25]`存储‘Z’的计数。\n\
  \n\n\n\n\n![Image](img/image00476.jpeg) 第 23 行—一个 `for` 循环遍历存储在 `phrase` 数组中的短语。`phrase.length`\
  \ 变量用于在遍历到最后一个短语后结束循环。\n\n![Image](img/image00476.jpeg) 第 24 行—一个名为 `current` 的字符串变量被赋值为\
  \ `phrase` 数组当前元素的值。\n\n![Image](img/image00476.jpeg) 第 25 行—创建一个字符数组，用于存储当前短语中的所有字符。\n\
  \n![Image](img/image00476.jpeg) 第 26 行—一个 `for` 循环遍历当前短语的字母。`letters.length` 变量用于在遍历到最后一个字母后结束循环。\n\
  \n![Image](img/image00476.jpeg) 第 27 行—创建一个名为 `lett` 的字符变量，其值为当前字母。除了文本值之外，字符还有其对应的数值。由于数组元素是编号的，因此使用每个字符的数值来确定其在数组中的元素编号。\n\
  \n![Image](img/image00476.jpeg) 第 28-30 行—一个 `if` 语句过滤掉所有不属于字母表的字符，如标点符号和空格。根据存储在\
  \ `lett` 中的当前字符的数值，`letterCount` 数组的某个元素会增加 1。字母表对应的数值范围是从 'A' 的 65 到 'Z' 的 90。由于\
  \ `letterCount` 数组从 0 开始到 25 结束，因此从 `lett` 中减去 65（'A'的值）来确定要增加的数组元素索引。\n\n![Image](img/image00476.jpeg)\
  \ 第 33 行—一个 `for` 循环遍历从 'A' 到 'Z' 的整个字母表。\n\n![Image](img/image00476.jpeg) 第 34-40\
  \ 行—显示当前字母，后跟一个分号和该字母在 `phrase` 数组存储的短语中出现的次数。当当前字母是 'M' 时，会显示一个换行符，以便输出分布在两行上。\n\
  \n***\n\n注意\n\n每个从 'A' 到 'Z' 字符所关联的数值，是 ASCII 字符集所使用的值。ASCII 字符集是 Unicode 的一部分，而\
  \ Unicode 是 Java 语言支持的完整字符集。Unicode 包含了对世界上 60,000 多种不同书面语言字符的支持。ASCII 则仅限于 256\
  \ 个。\n\n***\n\n本项目展示了如何使用两个嵌套的 `for` 循环来逐个字母地遍历一组短语。Java 为每个字符附加一个数值；这个数值比在数组中直接使用字符本身更便于操作。\n\
  \n### 总结\n\n数组使得在程序中存储复杂类型的信息并对其进行操作成为可能。它们非常适合于任何可以排列成列表的信息，并且可以使用你在第 8 小时“使用循环重复操作”中学到的循环语句轻松地进行访问。\n\
  \n说实话，圣诞老人的信息处理需求可能已经超出了数组的能力范围。每年被“制造”出来的孩子都在增加，他们想要的礼物在复杂性和成本上也日益增长。\n\n你的程序很可能会使用数组来存储那些用变量处理起来很笨重的信息，即使你并没有制作任何列表或者检查两遍。\n\
  \n### 练习场\n\n#### 问答\n\n**问。** 字母表的数值范围，从 'A' 的 65 到 'Z' 的 90，是 Java 语言的基础部分吗？如果是，1\
  \ 到 64 的数值是保留给什么的？\n\n**答。** 数字 1 到 64 包括数字、标点符号和一些不可打印的字符，如换行符、回车符和退格符。Java 程序中每个可打印的字符以及一些不可打印的字符都关联着一个数值。Java\
  \ 使用 Unicode 编号系统。前 127 个字符来自 ASCII 字符集，你可能在其他编程语言中使用过它。\n\n**问。** 为什么错误被称为异常？\n\
  \n**答。** 这个术语的意义在于，程序通常可以毫无问题地运行，而异常（exception）则表示一种需要处理的特殊情况。异常是从 Java 程序内部发出的警告消息。在\
  \ Java 语言中，术语“错误”有时被限定用于描述在运行程序的解释器内部发生的错误情况。你将在第 18 小时了解更多关于错误和异常的知识。\n\n**问。**\
  \ 在多维数组中，是否可以使用 `length` 变量来测量第一维以外的其他维度？\n\n**答。** 你可以测试数组的任何维度。对于第一维，使用数组名后跟 `length`，例如\
  \ `x.length`。后续维度可以通过使用该维度的 `[0]` 元素后跟 `length` 来测量。考虑一个名为 `data` 的数组，它由以下语句创建：\n\
  \n点击此处查看代码图像\n\n```\nint[][][] data = new int[12][13][14];\n```\n\n这个数组的维度可以通过 `data.length`\
  \ 变量测量第一维，`data[0].length` 测量第二维，`data[0][0].length` 测量第三维。\n\n**问。** 为什么新英格兰爱国者队的主教练比尔·贝利奇克总是在场边穿那件荒唐的连帽衫？\n\
  \n**答。** 当你在一个十年内的胜场数高于 NFL 历史上任何其他教练时（2003 年至 2012 年的 140 场），你的老板会允许你自定着装规范。体育作家认为，贝利奇克开始穿剪掉袖子的连帽衫，是为了回应\
  \ NFL 与锐步（Reebok）的一项协议，该协议要求所有教练穿着授权的球队服装。\n\n“他决定，如果他们要强迫他穿球队服装，那么他会从选项中筛选，然后穿上他能找到的最丑的东西，”雅虎体育的丹·韦策尔解释道。“他选了一件灰色的运动衫，通常还戴着兜帽。”\n\
  \n贝利奇克这种消极抵抗的时尚宣言，已经使这件连帽衫成为了球队最畅销的商品之一。\n\n#### 测验\n\n如果你的脑子是一个数组，你可以通过回答以下每个关于数组的问题来测试它的\
  \ `length`。\n\n**1.** 数组最适合存储哪类信息？\n\n**A.** 列表\n\n**B.** 相关信息的配对\n\n**C.** 琐事\n\
  \n**2.** 你可以使用哪个变量来检查数组的上边界？\n\n**A.** `top`\n\n**B.** `length`\n\n**C.** `limit`\n\
  \n**3.** 圣诞老人有多少只驯鹿，包括红鼻子鲁道夫？\n\n**A.** 8 只\n\n**B.** 9 只\n\n**C.** 10 只\n\n####\
  \ 答案\n\n**1. A.** 仅包含相同类型信息（字符串、数字等）的列表非常适合存储在数组中。\n\n**2. B.** `length` 变量包含数组中元素数量的计数。\n\
  \n**3. B.** 根据克莱门特·克拉克·摩尔的《圣尼古拉斯的来访》，圣诞老人有“八只小驯鹿”，所以加上鲁道夫一共是九只。\n\n#### 活动\n\n为了给自己积累一组可供日后借鉴的经验，你可以通过以下活动来扩展对本小时主题的了解：\n\
  \n![Image](img/image00476.jpeg) 创建一个使用二维数组存储学生成绩的程序。第一维应该是每个学生的编号，第二维应该是每个学生的各科成绩。显示每个学生所有成绩的平均分以及所有学生的总平均分。\n\
  \n![Image](img/image00476.jpeg) 编写一个程序，将前 400 个 13 的倍数存储在一个数组中。\n\n要查看实现这些活动的 Java\
  \ 程序，请访问本书网站 [www.java24hours.com](http://www.java24hours.com)。\n\n# 第 10 小时. 创建你的第一个对象\n\
  \n本小时任务清单：\n\n![Image](img/image00474.jpeg) 创建一个对象。\n\n![Image](img/image00474.jpeg)\
  \ 用属性描述一个对象。\n\n![Image](img/image00474.jpeg) 确定对象的行为。\n\n![Image](img/image00474.jpeg)\
  \ 组合对象。\n\n![Image](img/image00474.jpeg) 从其他对象继承。\n\n\n\n\n\n# 将对象及其他类型的信息进行转换\n\
  \n![Image](img/image00474.jpeg) 将对象及其他类型的信息进行转换。\n\n你在这些日子里遇到的更令人生畏的术语之一就是面向对象编程（OOP）。这个复杂的术语以一种优雅的方式描述了计算机程序是什么以及它如何工作。\n\
  \n在 OOP 之前，计算机程序通常被描述为你在本书中学到的最简单定义：一组列在文件中的指令，并以某种可靠的顺序执行。\n\n通过将程序视为对象的集合，你可以找出程序必须完成的任务，并将任务分配给最适合的对象。\n\
  \n### 面向对象编程如何工作\n\n你可以将你创建的 Java 程序视为对象，就像现实世界中存在的物理对象一样。对象独立于其他对象存在，以特定的方式交互，并且可以与其他对象结合形成更大的东西。如果你将计算机程序视为一组相互交互的对象，你就可以设计出更可靠、更易于理解且可在其他项目中重用的程序。\n\
  \n在 第 23 小时 “创建 Java2D 图形”中，你创建了一个显示饼图的 Java 程序——带有不同颜色馅饼切片的圆圈来表示数据（见图 10.1）。饼图是一个由较小对象组成的对象——代表不同颜色的独立切片、标识每个切片含义的图例以及一个标题。\n\
  \n![Image](img/image00503.jpeg)\n\n**图 10.1** 一个显示饼图的 Java 程序。\n\n每个对象都有使其与其他对象不同的东西。饼图是圆形的，而条形图则将数据表示为一系列矩形。如果你以分解饼图的方式来分解计算机程序，你就是在进行\
  \ OOP。\n\n在 OOP 中，一个对象包含两样东西：属性和行为。属性是描述对象并显示其与其他对象不同之处的东西。行为是对象执行的操作。\n\n你在 Java\
  \ 中通过使用类作为模板来创建对象。类是对象的主副本，决定了对象应该具有的属性和行为。术语“类”你应该很熟悉，因为 Java 程序被称为类。你用 Java 创建的每个程序都是一个类，你可以将其用作创建新对象的模板。例如，任何使用字符串的\
  \ Java 程序都在使用从 `String` 类创建的对象。这个类包含决定 `String` 对象是什么的属性，以及控制 `String` 对象能做什么的行为。\n\
  \n通过 OOP，计算机程序是一组协同工作以完成某项任务的对象。一些简单的程序可能看起来只由一个对象组成：类文件。然而，即使是那些程序也在使用其他对象来完成工作。\n\
  \n### 对象在行动\n\n考虑显示饼图的程序。一个 `PieChart` 对象可以由以下内容组成：\n\n![Image](img/image00476.jpeg)\
  \ 计算每个饼图切片大小的行为\n\n![Image](img/image00476.jpeg) 绘制图表的行为\n\n![Image](img/image00476.jpeg)\
  \ 存储图表标题的属性\n\n* * *\n\n注意\n\n自动拨号器是一种使用称为调制解调器的设备按顺序拨打一系列电话号码的软件。此类程序的目的是找到应答电话的其他计算机，以便你可以稍后调用它们以查看它们是什么。\n\
  \n年龄小于 30 岁的读者可能很难相信计算机过去曾通过电话相互连接。你必须知道计算机的电话号码才能连接到它，并且如果它已经在与另一台计算机通话，你会听到忙音。\n\
  \n现在我可能需要解释什么是忙音。\n\n引用诗人 T.S. Eliot 的话，“我变老了……我变老了。”\n\n* * *\n\n要求 `PieChart`\
  \ 对象自己绘制自己可能看起来很奇怪，因为在现实世界中，图表不会自己绘制。OOP 中的对象会尽可能为自己工作。这个特性使它们更容易被合并到其他程序中。例如，如果一个\
  \ `PieChart` 对象不知道如何绘制自己，那么每次你在另一个程序中使用该 `PieChart` 对象时，你都必须创建绘制它的行为。\n\n作为 OOP\
  \ 的另一个例子，考虑 Matthew Broderick 的角色在经典黑客电影《战争游戏》中使用的自动拨号程序，用于寻找他可以入侵的计算机。\n\n在今天使用自动拨号器会引起你当地电话公司和执法部门的注意。在\
  \ 1980 年代，这是一种不出门就能反叛的好方法。David Lightman（由 Broderick 扮演的角色）使用他的自动拨号器寻找一家视频游戏公司的私有计算机系统——他想在游戏发布前玩公司的新游戏。相反，Lightman\
  \ 发现了一个秘密的政府计算机，它可以玩从国际象棋到全球热核战争的一切游戏。\n\n自动拨号器，就像任何计算机程序一样，可以被视为一组协同工作的对象。它可以分解为以下内容：\n\
  \n![Image](img/image00476.jpeg) 一个 `Modem` 对象，它知道其属性（如连接速度）并具有行为——例如，它可以命令调制解调器拨号并检测另一个计算机系统是否已应答呼叫。\n\
  \n![Image](img/image00476.jpeg) 一个 `Monitor` 对象，它跟踪哪些号码被呼叫以及哪些呼叫成功。\n\n每个对象都独立于另一个对象存在。\n\
  \n设计一个完全独立的 `Modem` 对象的一个优势是，它可以被需要调制解调器功能的其他程序使用。\n\n使用自包含对象的另一个原因是它们更容易调试。计算机程序的大小很快会变得难以控制。如果你正在调试像\
  \ `Modem` 这样的对象，并且你知道它不依赖于其他任何东西，你就可以专注于确保 `Modem` 对象执行它应该执行的任务并保存其执行任务所需的信息。\n\n\
  将 Java 这样的面向对象语言作为你的第一门编程语言学习可能很有利，因为你不需要摒弃其他编程风格的习惯。\n\n### 什么是对象\n\n对象是通过使用一个类作为模板来创建的。以下语句创建了一个类：\n\
  \n```java\npublic class Modem {\n\n}\n```\n\n从这个类创建的对象不能做任何事情，因为它没有任何属性或行为。你需要添加这些才能使类有用，如以下语句所示：\n\
  \n```java\npublic class Modem {\n\n    int speed;\n\n    public void displaySpeed()\
  \ {\n\n        System.out.println(\"Speed: \" + speed);\n\n    }\n\n}\n```\n\n`Modem`\
  \ 类现在应该开始看起来像你在第 1 小时到第 9 小时编写的程序了。`Modem` 类以一个 `class` 语句开始，只不过它包含了 `public` 这个词。这意味着该类可供公众使用——换句话说，可供任何想要使用\
  \ `Modem` 对象的程序使用。\n\n`Modem` 类的第一部分创建了一个名为 `speed` 的整型变量。这个变量是对象的一个属性。\n\n`Modem`\
  \ 类的第二部分是一个名为 `displaySpeed()` 的方法。这个方法是对象行为的一部分。它包含一个语句 `System.out.println()`，它显示调制解调器的\
  \ `speed` 值。\n\n对象的变量称为实例变量或成员变量。\n\n如果你想在程序中使用 `Modem` 对象，你可以使用以下语句创建该对象：\n\n```java\n\
  Modem device = new Modem();\n```\n\n此语句创建一个名为 `device` 的 `Modem` 对象。在创建对象之后，你可以设置它的变量并调用它的方法。以下是设置\
  \ `device` 对象的 `speed` 变量值的方法：\n\n```java\ndevice.speed = 28800;\n```\n\n\n\n\n\
  ## 调用 `displaySpeed()` 方法\n\n要让这个调制解调器通过调用 `displaySpeed()` 方法来显示其速度，你需要这样调用该方法：\n\
  ```java\ndevice.displaySpeed();\n```\n名为 `device` 的 `Modem` 对象会通过显示文本“Speed: 28800.”来响应此语句。\n\
  \n### 理解继承\n\n面向对象编程的一大优势是继承，它使得一个对象能够从另一个对象继承行为和属性。\n\n当你开始创建对象时，你有时会发现新对象与你已有的一个对象非常相似。\n\
  \n如果大卫·莱特曼想要一个能够处理纠错和其他先进调制解调器功能的对象（这些功能在 1983 年《战争游戏》上映时还不存在），该怎么办？莱特曼可以复制 `Modem`\
  \ 对象的语句并进行修改，从而创建一个新的 `ErrorCorrectionModem` 对象。然而，如果 `ErrorCorrectionModem` 的大部分行为和属性与\
  \ `Modem` 相同，这将是一项大量不必要的工作。这也意味着，如果以后需要更改某些内容，莱特曼将需要更新两个独立的程序。\n\n通过继承，程序员可以通过定义新对象与现有对象的不同之处来创建一个新的对象类。莱特曼可以让\
  \ `ErrorCorrectionModem` 继承自 `Modem`，这样他需要编写的就只是那些使纠错调制解调器区别于普通调制解调器的内容。\n\n一个类通过使用\
  \ `extends` 语句从另一个类继承。以下是 `ErrorCorrectionModem` 类的骨架，它继承自 `Modem` 类：\n```java\n\
  public class ErrorCorrectionModem extends Modem {\n\n    // 程序放在这里\n\n}\n```\n\n\
  ### 构建继承层次结构\n\n继承使得无需重复工作即可开发各种相关类，从而使代码可以从一个类传递给另一个类，再传递给另一个类。这种类的组合称为类层次结构，你可以在\
  \ Java 程序中使用的所有标准类都是这个层次结构的一部分。\n\n要理解层次结构，最好先理解子类和超类。继承自另一个类的类称为子类。被继承的类称为超类。\n\
  \n在前面的《战争游戏》示例中，`Modem` 类是 `ErrorCorrectionModem` 类的超类。`ErrorCorrectionModem` 是\
  \ `Modem` 的子类。\n\n在一个层次结构中，一个类可以有多个继承自它的类——`Modem` 的另一个子类可以是 `ISDNModem`，因为 ISDN\
  \ 调制解调器具有使其区别于纠错调制解调器的行为和属性。如果存在一个 `ErrorCorrectionModem` 的子类，如 `InternalErrorCorrectionModem`，它将继承层次结构中其上方所有类的行为——既包括\
  \ `ErrorCorrectionModem`，也包括 `Modem`。这些继承关系如图 10.2 所示。\n\n![图片](img/image00504.jpeg)\n\
  **图 10.2** 一个类层次结构示例。\n\n构成标准 Java 语言的类充分利用了继承，因此理解它是必不可少的。你将在第 12 小时“充分利用现有对象”中学习更多关于继承的内容。\n\
  \n### 转换对象和简单变量\n\n在 Java 中，你需要完成的最常见任务之一是将信息从一种形式转换为另一种形式。你可以进行的几种转换类型包括：\n\n![图片](img/image00476.jpeg)\
  \ 将一个对象转换为另一个对象\n![图片](img/image00476.jpeg) 将一个简单变量转换为另一种类型的变量\n![图片](img/image00476.jpeg)\
  \ 使用一个对象来创建一个简单变量\n![图片](img/image00476.jpeg) 使用一个简单变量来创建一个对象\n\n简单变量是你在第 5 小时“在程序中存储和更改信息”中学习的基本数据类型。其中一些类型是\
  \ `int`、`float`、`char`、`long`、`double`、`byte` 和 `short`。\n\n> **注意**\n> 当一个方法（例如\
  \ `System.out.println()`）需要一个字符串参数时，你可以使用 `+` 运算符将几种不同类型的信息组合在该参数中。只要被组合的项中有一个是字符串，组合后的参数就会被转换为一个字符串。\n\
  \n在使用程序中的方法或表达式时，你必须使用这些方法和表达式所期望的正确类型的信息。例如，一个期望 `Calendar` 对象的方法必须接收一个 `Calendar`\
  \ 对象。如果你使用了一个需要单个整数参数的方法，却向它发送了一个浮点数，那么在尝试编译程序时就会发生错误。\n\n将信息转换为新形式的过程称为类型转换。类型转换会产生一个新值，这个值是与源不同类型的新变量或对象。实际上，你并不是在改变值本身，而是根据需要创建了一个新格式的变量或对象。\n\
  \n在讨论类型转换的概念时，术语“源”和“目标”很有用。源是某种以其原始形式存在的信息——无论是变量还是对象。目标是源在新格式中的转换版本。\n\n#### 类型转换简单变量\n\
  \n对于简单变量，类型转换最常见于数字变量之间，例如整数和浮点数。布尔值是一种不能用于任何类型转换的变量。\n\n要将信息转换为新格式，请在它前面加上用括号括起来的新格式。例如，如果你想将某个值转换为\
  \ `long` 变量，请在它前面加上 `(long)`。以下语句将 `float` 值转换为 `int`：\n```java\nfloat source =\
  \ 7.06F;\nint destination = (int) source;\n```\n\n在目标变量比源变量能存储更大值的变量转换中，值很容易转换，例如将\
  \ `byte` 转换为 `int`。`byte` 存储的值范围是 -128 到 127，而 `int` 存储的值范围是 -21 亿 到 21 亿。无论 `byte`\
  \ 变量持有何种值，新的 `int` 变量都有足够的空间容纳它。\n\n有时，你可以在不进行类型转换的情况下以不同的格式使用变量。例如，你可以像使用 `int`\
  \ 变量一样使用 `char` 变量。同样，你可以像使用 `long` 变量一样使用 `int` 变量，并且任何类型都可以用作 `double`。\n\n在大多数情况下，由于目标提供了比源更大的空间，信息在转换时不会改变其值。主要的例外情况是当\
  \ `int` 或 `long` 变量转换为 `float` 时，或者当 `long` 转换为 `double` 时。\n\n当你将信息从较大的变量类型转换为较小的类型时，必须显式地进行类型转换，如以下语句所示：\n\
  ```java\nint xNum = 103;\nbyte val = (byte) xNum;\n```\n\n这里，类型转换将一个名为 `xNum` 的整数值转换为一个名为\
  \ `val` 的 `byte` 变量。这是一个目标变量比源变量存储的值范围小的例子。`byte` 存储的整数值范围是 -128 到 127，而 `int` 存储的整数值范围要大得多。\n\
  \n当类型转换操作中的源变量具有目标变量中不支持的值时，Java 会更改该值以使类型转换成功完成。如果你没有预料到这种更改，这可能会产生意想不到的结果。\n\n\
  #### 类型转换对象\n\n当源和目标通过继承相关联时，你可以将对象类型转换为其他对象。其中一个类必须是另一个类的子类。\n\n有些对象根本不需要类型转换。你可以在任何需要其超类的地方使用该对象。Java\
  \ 中的所有对象都是 `Object` 类的子类，因此当需要 `Object` 时，你可以使用任何对象作为参数。\n\n\n\n\n当需要使用子类对象时，你也可以传入其父类对象。但由于子类通常比其父类包含更多信息，你可能会丢失部分数据。若对象缺少子类应有的某个方法，而程序中又调用了该方法，就会引发错误。\n\
  \n若要使用对象来替代其子类，必须进行显式转型，语句示例如下：\n\n```java\npublic void paintComponent(Graphics\
  \ comp) {\n    Graphics2D comp2D = (Graphics2D) comp;\n}\n```\n\n此处将名为`comp`的`Graphics`对象转型为`Graphics2D`对象。这种转型不会丢失信息，反而能获取子类定义的所有方法和变量。\n\
  \n## 将基本变量与对象相互转换\n\n你无法将对象直接转换为基本变量，也无法将基本变量直接转换为对象。Java 为每种基本变量类型都提供了对应的包装类，包括`Boolean`、`Byte`、`Character`、`Double`、`Float`、`Integer`、`Long`和`Short`。这些类名首字母大写，因为它们代表对象而非基本类型。\n\
  \n通过使用这些类中定义的方法，你可以将变量值作为参数来创建对象。以下语句创建了一个值为 5309 的`Integer`对象：\n\n```java\nInteger\
  \ suffix = new Integer(5309);\n```\n\n创建此类对象后，你可以像使用其他对象一样使用它。若想再次将其作为基本变量使用，这些类提供了相应的转换方法。要从前面的`suffix`对象获取`int`值，可以使用以下语句：\n\
  \n```java\nint newSuffix = suffix.intValue();\n```\n\n此语句会使`newSuffix`变量获得值 5309，并以`int`类型表示。从对象到变量的常见转型是将字符串用于数值表达式。当字符串值可转换为整数时，可使用`Integer`类的`parseInt()`方法实现，如下例所示：\n\
  \n```java\nString count = \"25\";\nint myCount = Integer.parseInt(count);\n```\n\
  \n这会将文本\"25\"的字符串转换为值 25 的整数。若字符串值不是有效整数，转换将失败。\n\n你接下来要创建的项目是一个将命令行参数中的字符串值转换为数值的应用程序——这是从命令行获取用户输入时的常用技巧。\n\
  \n返回 NetBeans 中的`Java24`项目，选择“文件”>“新建文件”，创建一个名为`NewRoot`的空 Java 文件。在源代码编辑器中输入清单\
  \ 10.1 的内容，并记得保存文件。\n\n**清单 10.1 `NewRoot.java`完整内容**\n\n```java\npackage com.java24hours;\n\
  \nclass NewRoot {\n    public static void main(String[] arguments) {\n        int\
  \ number = 100;\n        if (arguments.length > 0) {\n            number = Integer.parseInt(arguments[0]);\n\
  \        }\n        System.out.println(\"The square root of \"\n            + number\n\
  \            + \" is \"\n            + Math.sqrt(number)\n        );\n    }\n}\n\
  ```\n\n运行程序前，必须配置 NetBeans 以传递命令行参数。选择菜单命令“运行”>“设置项目配置”>“自定义”。项目属性窗口将打开。在“主类”字段输入`com.java24hours.NewRoot`，在“参数”字段输入`9025`。点击“确定”关闭对话框。\n\
  \n要运行程序，请选择“运行”>“运行主项目”（而非“运行”>“运行文件”）。程序将显示该数字及其平方根，如图 10.3 所示。\n\n`NewRoot`应用扩展了第\
  \ 4 小时“理解 Java 程序工作原理”中的早期教程——该教程曾显示整数 225 的平方根。\n\n如果该程序能接收用户提交的数字并显示其平方根，其实用性会更强。这需要实现字符串到整数的转换。所有命令行参数都存储在`String`数组中，因此必须先将其转换为数字，才能用于数学表达式。\n\
  \n要根据字符串内容创建整数值，需将字符串作为唯一参数调用`Integer.parseInt()`方法，如第 7 行所示：\n\n```java\nnumber\
  \ = Integer.parseInt(arguments[0]);\n```\n\n数组元素`arguments[0]`保存应用程序运行时提交的第一个命令行参数。当使用\"\
  9025\"作为参数运行程序时，字符串\"9025\"会被转换为`int`值 9025。\n\n## 自动装箱与拆箱\n\nJava 中每种基本数据类型都有对应的包装类：`boolean`（`Boolean`类）、`byte`（`Byte`）、`char`（`Character`）、`double`（`Double`）、`float`（`Float`）、`int`（`Integer`）、`long`（`Long`）和`short`（`Short`）。\n\
  \n这些配对中的值具有相同意义。它们唯一的区别在于值的表示形式。例如数值 413 既可表示为`int`，也可表示为`Integer`类的对象。\n\nJava\
  \ 的自动装箱与拆箱功能使得基本数据类型和对象形式的值可以互换使用。\n\n*   **自动装箱**：将基本变量值转换为对应的包装类对象。\n*   **拆箱**：将包装类对象转换为对应的基本数据类型。\n\
  \n这些功能在后台自动工作，确保当你需要`float`这样的基本类型时，对象会自动转换为相同值的匹配数据类型；当你需要`Float`这样的对象时，数据类型也会按需转换为对象。\n\
  \n以下语句展示了自动装箱与拆箱的便利之处：\n\n```java\nFloat total = new 1.3F;\nfloat sum = total /\
  \ 5;\n```\n\n在早期 Java 版本中，这段代码会因两个错误而失败。第一条语句试图将字面量`float`值 1.3 赋给`Float`对象（不允许），第二条语句试图将`Float`对象除以\
  \ 5 并赋值给`float`类型（不允许）。但在当前 Java 版本中能完美运行，因为第一条语句会自动将字面量装箱为对象，第二条语句会将对象拆箱为基本类型。Java\
  \ 自动处理这些语句，最终使`sum`等于 0.26。\n\n本小时早些时候，你已见过创建`Integer`对象的示例：\n\n```java\nInteger\
  \ suffix = new Integer(5309);\n```\n\n由于自动装箱与拆箱，以下语句也能实现相同效果：\n\n```java\nInteger\
  \ suffix = 5309;\n```\n\nJava 识别出需要将`int`值 5309 存储在`Integer`对象中，因此会自动完成转换。\n\n##\
  \ 创建对象\n\n为观察本小时下一个项目中的类与继承实例，你需要创建代表两类对象的类：实现为`CableModem`类的电缆调制解调器，以及实现为`DslModem`类的\
  \ DSL 调制解调器。实验将聚焦于这些对象的简单属性和行为：\n\n*   每个对象应能显示其运行速度。\n*   每个对象应能连接到互联网。\n\n\n\n\
  \n\n## 第十章 继承\n\n有线电缆调制解调器和 DSL 调制解调器的共同点在于它们都具有速度特性。由于这是它们共享的特性，可以将其放入一个作为 `CableModem`\
  \ 和 `DslModem` 类超类的类中。将该类命名为 `Modem`。在 NetBeans 中，创建一个新的空 Java 类，命名为 `Modem`。在源代码编辑器中输入\
  \ 清单 10.2 并保存文件。\n\n**清单 10.2 `Modem.java` 的完整文本**\n\n点击此处查看代码图片\n\n```\n1: package\
  \ com.java24hours;\n2:\n3: public class Modem {\n4:     int speed;\n5:\n6:     public\
  \ void displaySpeed() {\n7:         System.out.println(\"Speed: \" + speed);\n8:\
  \     }\n9: }\n```\n\n此文件会自动编译为 `Modem.class`。你不能直接运行此程序，但可以在其他类中使用它。`Modem` 类可以处理\
  \ `CableModem` 和 `DslModem` 类共享的部分功能之一。通过在创建 `CableModem` 和 `DslModem` 类时使用 `extends`\
  \ 语句，你可以使它们每个都成为 `Modem` 的子类。\n\n在 NetBeans 中启动一个新的空 Java 文件，类名为 `CableModem`。输入\
  \ 清单 10.3 并保存文件。\n\n**清单 10.3 `CableModem.java` 的完整文本**\n\n点击此处查看代码图片\n\n```\n 1:\
  \ package com.java24hours;\n 2:\n 3: public class CableModem extends Modem {\n 4:\
  \     String method = \"cable connection\";\n 5:\n 6:     public void connect()\
  \ {\n 7:         System.out.println(\"Connecting to the Internet ...\");\n 8:  \
  \       System.out.println(\"Using a \" + method);\n 9:     }\n10: }\n```\n\n在 NetBeans\
  \ 中创建第三个文件，命名为 `DslModem`。输入 清单 10.4 并保存文件。\n\n**清单 10.4 `DslModem.java` 的完整文本**\n\
  \n点击此处查看代码图片\n\n```\n 1: package com.java24hours;\n 2:\n 3: public class DslModem\
  \ extends Modem {\n 4:     String method = \"DSL phone connection\";\n 5:\n 6: \
  \    public void connect() {\n 7:         System.out.println(\"Connecting to the\
  \ Internet ...\");\n 8:         System.out.println(\"Using a \" + method);\n 9:\
  \     }\n10: }\n```\n\n如果没有错误，你现在有三个类文件：`Modem.class`、`CableModem.class` 和 `DslModem.class`。但是，你无法运行这些类文件中的任何一个，因为它们没有像你之前创建的程序那样的\
  \ `main()` 块。你需要创建一个简短的应用程序来测试刚刚构建的类层次结构。\n\n返回 NetBeans 并创建一个新的空 Java 文件，类名为 `ModemTester`。在源代码编辑器中输入\
  \ 清单 10.5 并保存文件。\n\n**清单 10.5 `ModemTester.java` 的完整文本**\n\n点击此处查看代码图片\n\n```\n\
  \ 1: package com.java24hours;\n 2:\n 3: public class ModemTester {\n 4:     public\
  \ static void main(String[] arguments) {\n 5:         CableModem surfBoard = new\
  \ CableModem();\n 6:         DslModem gateway = new DslModem();\n 7:         surfBoard.speed\
  \ = 500000;\n 8:         gateway.speed = 400000;\n 9:         System.out.println(\"\
  Trying the cable modem:\");\n10:         surfBoard.displaySpeed();\n11:        \
  \ surfBoard.connect();\n12:         System.out.println(\"Trying the DSL modem:\"\
  );\n13:         gateway.displaySpeed();\n14:         gateway.connect();\n15:   \
  \  }\n16: }\n```\n\n当你运行程序时，你应该看到与 图 10.4 匹配的输出。\n\n![Image](img/image00506.jpeg)\n\
  \n**图 10.4** `ModemTester` 程序的输出。\n\n清单 10.5 中发生了以下事情：\n\n![Image](img/image00476.jpeg)\
  \ 第 5-6 行——创建了两个新对象：一个名为 `surfBoard` 的 `CableModem` 对象和一个名为 `gateway` 的 `DslModem`\
  \ 对象。\n\n![Image](img/image00476.jpeg) 第 7 行——名为 `surfBoard` 的 `CableModem` 对象的\
  \ `speed` 变量被设置为 500000。\n\n![Image](img/image00476.jpeg) 第 8 行——名为 `gateway` 的\
  \ `DslModem` 对象的 `speed` 变量被设置为 400000。\n\n![Image](img/image00476.jpeg) 第 10 行——调用了\
  \ `surfBoard` 对象的 `displaySpeed()` 方法。此方法继承自 `Modem`——即使它在 `CableModem` 类中不存在，你也可以调用它。\n\
  \n![Image](img/image00476.jpeg) 第 11 行——调用了 `surfBoard` 对象的 `connect()` 方法。\n\n\
  ![Image](img/image00476.jpeg) 第 12 行——调用了 `gateway` 对象的 `displaySpeed()` 方法。\n\n\
  ![Image](img/image00476.jpeg) 第 13 行——调用了 `gateway` 对象的 `connect()` 方法。\n\n### 总结\n\
  \n在创建了你的第一个对象类并将多个类排列成层次结构后，你应该对“面向对象编程”这个术语感到更熟悉了。在接下来的两小时里，随着你开始创建更复杂的对象，你将学到更多关于对象行为和属性的知识。\n\
  \n随着你对这种开发风格的经验增加，诸如程序、类和对象这样的术语会变得更加清晰。OOP 是一个需要一些时间才能适应的概念。当你掌握了它，你会发现它是设计、开发和调试计算机程序的有效方式。\n\
  \n### 研讨会\n\n#### 问与答\n\n**问：** 类可以从多个类继承吗？\n\n**答：** 这在某些编程语言（如 C++）中是可能的，但在 Java\
  \ 中不行。多重继承是一个强大的特性，但它也使 OOP 更难学习和使用。Java 的开发者决定将任何类的继承限制为一个超类，尽管一个类可以有多个子类。补偿此限制的一种方法是从一种称为接口的特殊类型类中继承方法。你将在\
  \ 第 19 小时 “创建线程程序” 中了解更多关于接口的知识。\n\n**问：** 什么时候你想要创建一个不是 `public` 的方法？\n\n**答：**\
  \ 你不希望一个方法可供其他程序使用的主要情况是，当该方法严格用于你正在编写的一个程序时。如果你正在创建一个游戏程序，并且你的 `shootRayGun()`\
  \ 方法高度特定于你正在编写的游戏，它可以是一个私有方法。要阻止一个方法成为 `public`，只需在方法名前省略 `public` 语句。\n\n**问：**\
  \ 为什么可以将 `char` 值当作 `int` 值来使用？\n\n**答：** 字符可以用作 `int` 变量，因为每个字符都有一个对应的数字代码，表示其在字符集中的位置。如果你有一个名为\
  \ `k` 的变量，其值为 67，那么转换 `(char) k` 会产生字符值 ‘C’，因为根据 ASCII 字符集，与大写 C 关联的数字代码是 67。ASCII\
  \ 字符集是 Java 语言采用的 Unicode 字符标准的一部分。\n\n**问：** Tabasco 辣酱会变质吗？\n\n**答：** 不会，尽管如果你把一瓶打开的酱料放上几年，它的颜色会改变。醋、红辣椒和盐的成分对细菌生长来说是极其不利的环境。\n\
  \nTabasco 的制造商 McIlhenny 公司表示，原味品牌的保质期为五年。其他版本的保质期从 18 个月到三年不等。\n\n作为该产品的忠实粉丝，我很难相信有人会把一瓶\
  \ Tabasco 放那么久以至于提出这个问题。\n\n#### 测验\n\n以下问题测试你对对象及其使用程序的了解。\n\n**1.** 使用什么语句来使一个类能够从另一个类继承？\n\
  \n**A.** `inherits`\n**B.** `extends`\n**C.** `handItOverAndNobodyGetsHurt`\n\n\
  **2.** 为什么编译后的 Java 程序以 `.class` 文件扩展名保存？\n\n**A.** Java 的开发者认为它是一门优雅的语言。\n**B.**\
  \ 这是对全世界教师的微妙致敬。\n**C.** 每个 Java 程序都是一个类。\n\n\n\n\n\n**3.** 一个对象由哪两个部分构成？\n\n**A.**\
  \ 属性和行为\n\n**B.** 命令和数据文件\n\n**C.** 唾液和醋\n\n#### 答案\n\n**1. B.** 使用 `extends` 语句是因为子类是超类以及类层次结构中任何更高层超类的属性和行为的扩展。\n\
  \n**2. C.** 你的程序总是至少由一个主类和任何其他所需的类构成。\n\n**3. A.** 某种程度上，B 选项也是正确的，因为命令类似于行为，数据文件类似于属性。\n\
  \n#### 活动\n\n如果你不介意，可以通过以下活动来 `extend`（扩展）你对本小时主题的理解：\n\n![Image](img/image00476.jpeg)\
