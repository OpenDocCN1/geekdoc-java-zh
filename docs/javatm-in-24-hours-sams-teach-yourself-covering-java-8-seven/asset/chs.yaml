  \ 编写一个使用循环的简短程序，找出前 400 个是 13 的倍数的数字。\n\n要查看实现这些活动的 Java 程序，请访问本书网站[www.java24hours.com](http://www.java24hours.com)。\n\
  \n### 基准程序输出\n\n第 11-13 行——如果`now`大于`endTime`，这表示循环已经运行了一分钟，`break`结束`while`循环。否则，它继续循环。\n\
