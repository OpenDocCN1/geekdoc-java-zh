  \ Android 的讲解方式。\n\n***\n\n### 总结\n\n《Sams Teach Yourself Java in 24 Hours》的目标一直是帮助您熟悉编程概念，并相信自己有能力编写自己的应用程序，无论它们是在桌面计算机、网页、Web\
  \ 服务器还是手机上运行。Java 的方法有时难以掌握。（如果上一句话对真相是严重的误述，请随意划掉“有时”这个词。）\n\n随着您在 Java 方面经验的积累，您正在构建的经验也变得越来越有价值，因为诸如面向对象编程、虚拟机和安全环境等概念正处于软件开发的前沿。\n\
