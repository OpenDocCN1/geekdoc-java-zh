  \ Java 职位空缺。本书还有一个网站 [www.java24hours.com](http://www.java24hours.com)，您可以在那里向作者发送电子邮件，并阅读对读者问题的解答、对本书的澄清以及（天哪）更正。\n\
  \n继续构建您作为 Java 程序员技能的一种方式是阅读《Sams Teach Yourself Java in 21 Days》。那本书也是我写的，它扩展了这里涵盖的主题并介绍了新内容，例如\
  \ JDBC、Java servlets 和网络编程。\n\n还有更多关于 Android 的内容。\n\n如果您没有跳过并且刚刚完成了所有 24 小时，那么恭喜您。请运用您新获得的编程技能去获得一份好工作并重建世界经济。\n\
  \n### 研讨会\n\n#### 问答\n\n**问：** 为什么使用 Eclipse 来创建 Android 应用，而不是 NetBeans？\n\n**答：**\
  \ 您可以使用 NetBeans 来开发应用，但它对于 Android 编程来说更笨重且支持较少。Eclipse 已被 Google 指定为首选的 Android\
  \ IDE。Android 开发者网站 [`developer.android.com`](http://developer.android.com) 上的官方文档和教程都使用\
  \ Eclipse。\n\n大多数 Android 编程书籍也采用 Eclipse。虽然当您深入 Android 开发时，从 NetBeans 切换到 Eclipse\
  \ 有一个学习曲线，但一旦您掌握了编写、调试和部署应用的基础知识，您应该会发现 Eclipse 更容易使用，因为它得到了 Android 程序员和技术作者更好的支持。\n\
  \n**问：** 为什么这么多电影里都有完全相同的男人痛苦的尖叫声？\n\n\n\n\n# 附录\n\n## 附录 A. 使用 NetBeans 集成开发环境\n\
  \n尽管仅使用 Java 开发工具包 (JDK) 和文本编辑器也能创建 Java 程序，但使用集成开发环境 (IDE) 的体验会愉快得多。\n\n本书的前 23\
  \ 小时将使用 NetBeans，这是一款由 Oracle 为 Java 程序员提供的免费 IDE。NetBeans 是一款能使 Java 软件的组织、编写、编译和测试变得更加轻松的程序。它包含项目和文件管理器、图形用户界面设计器以及许多其他工具。其中一个绝佳功能是代码编辑器，它可以在您输入时自动检测\
  \ Java 语法错误。\n\nNetBeans 目前版本为 8.0，已成为专业 Java 开发人员的最爱，其功能和性能即使价格提高十倍也物有所值。它也是最容易上手的\
  \ Java 初学者 IDE 之一。\n\n在本附录中，您将了解足够多关于 NetBeans 的知识，以安装该软件并在本书中全程使用。\n\n### 安装 NetBeans\n\
  \n尽管起步并不顺利，NetBeans IDE 已发展成为 Java 开发人员的首选编程工具之一。Java 语言的创建者 James Gosling 在其为《NetBeans\
  \ 现场指南》一书所作的序言中给予了它终极的认可：\"我所有的 Java 开发都使用 NetBeans。\" 我也已成其信徒。\n\nNetBeans 支持该语言三个版本的所有方面——Java\
  \ 标准版 (`JSE`)、Java 企业版 (`JEE`) 和 Java 移动版 (`JME`)。它还支持 Web 应用程序开发、Web 服务和 JavaBeans。\n\
  \n您可以从 [`netbeans.org`](http://netbeans.org) 下载该软件，适用于 Windows、Mac OS 和 Linux。NetBeans\
  \ 可以与 `Java Development Kit` 捆绑下载，也可以单独下载。您的计算机上必须安装 NetBeans 和 `JDK`。\n\n如果您想确保下载的\
  \ NetBeans 和 `JDK` 版本与本书编写时使用的版本相同，请访问本书网站 [www.java24hours.com](http://www.java24hours.com)。点击本书封面打开本版的网站，然后寻找\
  \ \"Download `JDK`\" 和 \"Download NetBeans 8.0\" 的链接。您将被引导至正确的网站。\n\n### 创建新项目\n\
  \n`JDK` 和 NetBeans 以安装向导的形式下载，用于在您的系统上设置软件。您可以将软件安装在任何您喜欢的文件夹和菜单组中，但除非有充分的理由，否则最好坚持使用默认设置选项。\n\
  \n首次运行安装后的 NetBeans 时，您会看到一个起始页，显示指向新闻和编程教程的链接（参见图 A.1）。您可以使用 NetBeans 的内置网页浏览器在\
  \ IDE 内阅读这些内容。\n\n![Image](img/image00568.jpeg)\n\n**图 A.1** NetBeans 用户界面。\n\n\
  NetBeans 项目由一组相关的 Java 类、这些类使用的文件以及 Java 类库组成。每个项目都有自己的文件夹，您可以在 NetBeans 之外使用文本编辑器和其他编程工具探索和修改该文件夹。\n\
  \n要开始一个新项目，请单击图 A.1 中所示的 \"New Project\"（新建项目）按钮，或选择 File（文件）菜单中的 New Project（新建项目）命令。新建项目向导将打开，如图\
  \ A.2 所示。\n\n![Image](img/image00569.jpeg)\n\n**图 A.2** 新建项目向导。\n\nNetBeans 可以创建多种类型的\
  \ Java 项目，但在本书期间，您可以专注于一种类型：Java 应用程序。\n\n对于您的第一个项目（以及本书中的大多数项目），选择项目类型 \"Java Application\"\
  （Java 应用程序），然后单击 \"Next\"（下一步）。向导会要求您为项目选择名称和位置。\n\n\"Project Location\"（项目位置）文本字段指定了您使用\
  \ NetBeans 创建的编程项目的根文件夹。在 Windows 上，这可能是您 \"My Documents\"（我的文档）或 \"Documents\"\
  （文档）文件夹中名为 `NetBeansProjects` 的子文件夹。您创建的所有项目都存储在此文件夹内，每个项目都有自己的子文件夹。\n\n在 \"Project\
  \ Name\"（项目名称）文本字段中，输入 `Java24`。\"Create Main Class\"（创建主类）文本框会随输入而变化，建议将 `java24.Java24`\
  \ 作为项目中主 Java 类的名称。将其更改为 `Spartacus` 并单击 \"Finish\"（完成），接受所有其他默认值。NetBeans 将创建项目及其第一个类。\n\
  \n### 创建新的 Java 类\n\n当 NetBeans 创建一个新项目时，它会设置所有必要的文件和文件夹并创建主类。图 A.3 显示了您项目中的第一个类\
  \ `Spartacus.java`，它已在源代码编辑器中打开。\n\n![Image](img/image00570.jpeg)\n\n**图 A.3** NetBeans\
  \ 源代码编辑器。\n\n`Spartacus.java` 是一个最简单的 Java 类，只包含一个 `main()` 方法。类中所有浅灰色的行都是注释，解释了类的用途和功能。运行类时会忽略注释。\n\
  \n* * *\n\n**注意**\n\n那个声音是威廉尖叫（Wilhelm scream），一种音效，最早出现在 1951 年的电影《遥远的鼓声》（*Distant\
  \ Drums*）中。它最常出现在某人从高处坠落、被枪击中或被爆炸击退时。两个著名的使用案例是在最初的《星球大战》中，一名帝国冲锋队员被卢克·天行者击中并从平台坠落；以及在动画电影《玩具总动员》中，伍迪警长将巴斯光年推出窗外。\n\
  \n这种声音由电影音效设计师本·伯特（Ben Burtt）推广，他在为《星球大战》开发音效时，在华纳兄弟的音效库中发现了它，并将其包含在他参与制作的每一部史蒂文·斯皮尔伯格和乔治·卢卡斯的电影中。此后，它已成为音效设计师之间的传统，在超过\
  \ 140 部电影中都可以听到。\n\n尖叫的配音演员据信是谢布·伍利（Sheb Wooley），他是一位演员兼歌手，录制了 1958 年的趣味歌曲“紫色食人怪”（“Purple\
  \ People Eater”）。\n\n该尖叫声被命名为“威廉”，源自第三次使用该音效的电影。在 1953 年的电影《飞箭河之役》（*The Charge at\
  \ Feather River*）中，列兵威廉（Wilhelm）在被箭射中时痛苦地大喊。\n\n### 测验\n\n如果您想检验一下刚刚在 Android 开发中学到的知识，请回答以下问题。\n\
  \n**1.** 以下哪家公司不是支持 Android 的开放手持设备联盟（Open Handset Initiative）的成员？\n\n**A.** 谷歌（Google）\n\
  \n**B.** 苹果（Apple）\n\n**C.** 摩托罗拉（Motorola）\n\n**2.** 一个 Activity 用什么对象来告诉另一个 Activity\
  \ 该做什么？\n\n**A.** `Intent`（意图）\n\n**B.** `Action`（操作）\n\n**C.** `View`（视图）\n\n**3.**\
  \ 以下哪项任务 Android 模拟器无法执行？\n\n**A.** 接收短信\n\n**B.** 连接到互联网\n\n**C.** 拨打电话\n\n###\
  \ 答案\n\n**1. B.** 苹果（Apple），因为 Android 的创建部分是作为苹果 iPhone 的开源、非专有替代品。\n\n**2. A.**\
  \ `Intent`（意图）也是 Activity 与 Android 设备通信的方式。\n\n**3. C.** 模拟器无法做到真实设备能做的所有事情，因此它们只是应用测试过程的一部分。\n\
  \n### 实践活动\n\n为了让您的 Android 知识更加扎实，请进行以下实践活动：\n\n![Image](img/image00476.jpeg) 将\
  \ `SalutonMondo` 应用的文本更改为 \"Hello, Android\"，并在模拟器以及 Android 设备（如果您有的话）上运行该应用。\n\
  \n![Image](img/image00476.jpeg) 为另一个世界领导人创建 `Take Me to Your Leader` 的新版本，自定义电话、网络和地图目的地。\n\
  \n要查看实现这些活动的 Java 程序，请访问本书网站 [www.java24hours.com](http://www.java24hours.com)。\n\
