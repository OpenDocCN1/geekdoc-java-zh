  \ new Virus();\n            }\n            System.out.println(\"There are \" + Virus.getVirusCount()\n\
  \                + \" viruses.\");\n        }\n    }\n}\n```\n\n`VirusLab`类是一个应用程序，当在命令行运行它时需要一个参数：要创建的`Virus`对象的数量。要在\
