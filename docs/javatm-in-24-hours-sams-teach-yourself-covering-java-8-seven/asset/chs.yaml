  \n## 总结\n\n当你的 `Credits` 版本看起来像 图 6.1 时，值得给自己一些肯定。阅读本书六小时后，你已经能编写更长的 Java 程序并处理更复杂的问题了。每次坐下来编写程序时，你都会用到字符串。你将以多种方式使用字符串与用户进行通信。\n\
  \n## 互动环节\n\n### 问与答\n\n**问：** 如何将字符串变量的值设置为空？\n**答：** 使用空字符串，即一对不包含任何文本的双引号。以下代码创建了一个名为\
  \ `georgeSays` 的新字符串变量，并将其设置为空：`String georgeSays = \"\";`\n\n**问：** 似乎无法让 `toUpperCase()`\
  \ 方法将字符串全部改为大写字母。我哪里做错了？\n**答：** 当你调用一个 `String` 对象的 `toUpperCase()` 方法时，它实际上并不会改变被调用的\
  \ `String` 对象。相反，它会创建一个全新的字符串，并全部设置为大写字母。请看以下语句：\n点击此处查看代码图像\n```java\nString firstName\
  \ = \"Baz\";\nString changeName = firstName.toUpperCase();\nSystem.out.println(\"\
  First Name: \" + firstName);\n```\n这些语句显示文本“First Name: Baz”，因为 `firstName` 包含的是原始字符串。如果将最后一条语句改为显示\
  \ `changeName` 变量，它将输出“First Name: BAZ”。在 Java 中，字符串一旦创建，其值就不会改变。\n\n**问：** Java\
  \ 中的所有方法都像 `equals()` 方法处理字符串那样，以相同方式显示 `true` 或 `false` 吗？\n**答：** 方法在使用后产生响应的方式各不相同。当一个方法像\
  \ `equals()` 方法那样发回一个值时，这被称为返回一个值。`equals()` 方法被设置为返回一个布尔值。其他方法可能返回字符串、整数、其他类型的变量，或者根本不返回任何内容——这由\
  \ `void` 表示。\n\n**问：** 为什么学校用字母 A、B、C、D 和 F 来分配成绩，而没有 E？\n**答：** 字母等级 E 早前已被用于另一种评分系统。直到\
  \ 20 世纪中叶，在美国最受欢迎的评分系统是：E 代表优秀，S 代表满意，N 代表需要改进，U 代表令人畏惧的不及格。所以当 ABCD 系统出现时，给一个不及格的学生\
  \ E 被认为并非如此明智的做法。ESNU 评分在小学中仍被广泛使用。\n\n### 测验\n\n以下问题测试你对字符串处理和特性的了解。\n\n**1.**\
  \ 我的朋友进行“连接”。我应该向当局举报他吗？\n**A.** 不应该。这只在冬季月份是非法的。\n**B.** 应该，但要等我先把故事卖给[TMZ.com](http://TMZ.com)。\n\
  **C.** 不应该。他所做的只是在程序中粘贴两个字符串。\n\n**2.** 为什么单词 `String` 首字母大写，而 `int` 等却没有？\n**A.**\
  \ `String` 是一个完整的单词，而 `int` 不是。\n**B.** 与所有作为 Java 标准部分的对象一样，`String` 的名称首字母大写。\n\
  **C.** Oracle 的品控太差。\n\n**3.** 以下哪个字符可以在字符串中插入单引号？\n**A.** `<quote>`\n**B.** `\\\
  '`\n**C.** `'`\n\n### 答案\n\n**1. C。** 连接只是粘贴、连接、融合或其他方式将两个字符串拼接在一起的另一个说法。它使用 `+`\
  \ 和 `+=` 运算符。\n**2. B。** Java 中可用的对象类型名称首字母都是大写的，这也是变量名首字母使用小写的主要原因。这样可以降低将其与对象混淆的可能性。\n\
  **3. B。** 单反斜杠是插入到字符串中的特殊字符之一的起始标记。\n\n### 活动\n\n你可以通过以下活动更全面地复习本小时的主题：\n\n![图片](img/image00476.jpeg)\
