  \n***\n\n虽然 Java 在 `Thread` 类中包含了一个 `stop()` 方法，但它已被弃用。在 Java 中，弃用元素是已被更好的替代品取代的类、接口、方法或变量。\n\
  \n你接下来的项目将展示如何停止一个线程。你将进行的程序循环显示网站标题和访问它们的地址。\n\n每个页面的标题和网址在连续的循环中显示。用户能够通过点击应用程序图形用户界面中的按钮来访问当前显示的站点。该程序在一段时间内运行，按顺序显示有关每个网站的信息。由于这个时间因素，线程是控制程序的最佳方式。\n\
