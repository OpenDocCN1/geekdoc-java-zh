  \ 小时. 构建复杂用户界面\n\n本小时待办事项：\n\n![Image](img/image00474.jpeg) 使用滑块接受数值范围输入。\n\n![Image](img/image00474.jpeg)\
  \ 监控滑块上的用户输入。\n\n![Image](img/image00474.jpeg) 创建图像图标和工具栏。\n\n![Image](img/image00474.jpeg)\
  \ 在行列单元格的表格中呈现数据。\n\n使用 Swing 创建图形用户界面（GUI）不仅需要学习如何使用不同的界面组件、布局管理器和事件处理方法，还需要熟悉\
  \ Swing 提供的所有功能。\n\n超过 400 个不同的类使得 Swing 成为 Java 中最庞大的类库之一。其中许多类可以使用你在前三个小时中学习到的技术来实现——Swing\
  \ 容器和组件彼此共享超类，这赋予了它们共同的行为。\n\n在本小时中，你将学习可以在 Swing 程序中使用的几种其他组件。\n\n### 滑块\n\n从用户那里收集数值输入的最简单方法是使用滑块，这是一种可以左右或上下拖动的组件。滑块在\
  \ Swing 中由`JSlider`类表示。\n\n滑块允许在最小值和最大值之间选择一个数字。这些值可以显示在标签上，标签包括最小值、最大值和中间值。你在本小时后面创建的示例如图\
  \ 16.1 所示。\n\n![Image](img/image00528.jpeg)\n\n**图 16.1** 使用三个滑块组件选择颜色。\n\n你可以使用以下任一构造方法创建一个水平滑块：\n\
  \n![Image](img/image00476.jpeg) `JSlider()`—创建一个最小值为 0、最大值为 100、起始值为 50 的滑块。\n\n\
  ![Image](img/image00476.jpeg) `JSlider(int, int)`—创建一个具有指定最小值和最大值的滑块。\n\n![Image](img/image00476.jpeg)\
  \ `JSlider(int, int, int)`—创建一个具有指定最小值、最大值和起始值的滑块。\n\n要创建垂直滑块，请使用一个带有额外第一个参数的构造方法：滑块的方向。该参数应该是类变量`JSlider.VERTICAL`或`JSlider.HORIZONTAL`。\n\
  \n以下语句创建一个垂直滑块，用于选择 1 到 1,000 之间的数字：\n\n点击此处查看代码图像\n\n```java\nJSlider guess = new\
  \ JSlider(JSlider.VERTICAL, 1, 1000, 500);\n```\n\n此滑块的*游标*（组件中选择数字的部分）起始于 500 位置。\n\
  \n要为滑块显示标签，你必须设置标签将包含的信息。调用滑块的`setMajorTickSpacing(int)`和`setMinorTickSpacing(int)`方法来确定标签上刻度线显示的频率。主刻度显示为比次刻度更粗的线条。\n\
  \n设置好刻度线出现的频率后，调用滑块的`setPaintTicks(boolean)`方法，并将`true`作为参数。你也可以通过调用滑块的`setPaintLabels(boolean)`方法并将`true`作为参数，来显示每个主刻度的数值。\n\
  \n### 更改监听器\n\n要监控滑块输入，你必须有一个实现`javax.swing.event`包中`ChangeListener`接口的类。此接口仅包含一个方法：\n\
  \n点击此处查看代码图像\n\n```java\npublic void stateChanged(ChangeEvent event); {\n    //\
  \ 处理事件的语句\n}\n```\n\n要将一个对象注册为更改监听器，请调用持有滑块的容器的`addChangeListener(Object)`方法。当滑块移动时，监听对象的`stateChanged()`方法会被调用。\n\
  \n此方法接收一个`ChangeEvent`对象作为参数，该对象可以识别值发生更改的滑块组件。调用该对象的`getSource()`方法，并将对象强制转换为`JSlider`，如以下语句所示：\n\
  \n点击此处查看代码图像\n\n```java\nJSlider changedSlider = (JSlider) event.getSource();\n\
  ```\n\n在此示例中，`event`是作为`stateChanged()`方法参数的`ChangeEvent`对象。\n\n更改事件会在滑块移动过程中持续发生。它们从滑块首次被移动时开始，直到滑块被释放才会停止发生。因此，在滑块停止移动之前，你可能不想在`stateChanged()`方法中执行任何操作。\n\
  \n要查看滑块当前是否正在被移动，请调用其`getValueIsAdjusting()`方法。此方法在移动发生期间返回`true`，否则返回`false`。\n\
  \n此技术将在你的下一个项目中演示，这是一个使用三个滑块选择颜色的 Java 应用程序。在 Java 中，颜色通过使用`java.awt`包中的`Color`类来创建。\n\
  \n创建`Color`对象的一种方法是指定颜色中红、绿、蓝的含量。每种颜色分量可以是 0 到 255 之间的整数，其中 255 代表该颜色的最大量。\n\n以下语句创建一个代表奶油糖果色的`Color`对象：\n\
  \n点击此处查看代码图像\n\n```java\nColor butterscotch = new Color(255, 204, 128);\n```\n\n\
  用于创建此`Color`对象的红色值为 255，因此它包含最大量的红色。它还包含大量的绿色和一些蓝色。\n\n清单 16.1 包含`ColorSliders`应用程序，该程序有三个滑块、滑块的三个标签以及一个显示颜色的面板。创建一个名为`ColorSliders`的新的空白\
  \ Java 文件，在源代码编辑器中输入清单的文本，然后保存文件。\n\n清单 16.1 `ColorSliders.java`的完整文本\n\n点击此处查看代码图像\n\
