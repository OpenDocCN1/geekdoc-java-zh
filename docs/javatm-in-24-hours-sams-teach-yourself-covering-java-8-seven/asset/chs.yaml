  \ `if` 或 `switch` 条件语句来确定应显示哪些信息。\n\n此程序多次使用了 `System.out.println()` 和 `System.out.print()`\
  \ 来显示字符串。\n\n第 8-14 行引用了一个名为 `now` 的 `LocalDateTime` 变量。`LocalDateTime` 变量类型首字母大写，因为\
  \ `LocalDateTime` 是一个对象。\n\n您将在第 10 小时，“创建您的第一个对象”中学习如何创建和使用对象。对于本小时，请关注这些行中发生的事情，而不是它是如何发生的。\n\
  \n`Clock` 程序由以下几个部分组成：\n\n![Image](img/image00476.jpeg) 第 3 行使您的程序能够使用一个用于跟踪当前日期和时间的类：`java.time.LocalDateTime`。\n\
