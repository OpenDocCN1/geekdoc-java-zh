  \ 2 分的垫步才点的赞，那就点个赞吧。”\n\n### 测验\n\n通过回答以下问题，测试你对本小时涵盖内容的掌握程度。\n\n**1.** 以下哪一项 **不是**\
  \ 人们认为计算机编程极其困难的原因？\n\n**A.** 程序员散布这个谣言以改善我们的就业前景。\n\n**B.** 行话和首字母缩略词随处可见。\n\n\
  **C.** 觉得编程太难的人有资格获得政府救助。\n\n**2.** 哪种工具通过逐行解析来运行计算机程序？\n\n**A.** 一个缓慢的工具\n\n**B.**\
  \ 解释器\n\n**C.** 编译器\n\n**3.** 为什么 James Gosling 会躲在办公室里创建 Java？\n\n**A.** 他对当时在一个项目中使用的语言感到不满。\n\
  \n**B.** 他的摇滚乐队找不到演出机会。\n\n**C.** 上班时无法访问 YouTube，互联网就太无趣了。\n\n### 答案\n\n**1. C.**\
  \ 计算机书籍作者也没有获得救助。\n\n**2. B.** 解释器逐行解释。编译器事先解析指令，因此程序可以运行得更快。\n\n**3. A.** 他对 C++\
  \ 感到沮丧。回到 1991 年他创建 Java 时，YouTube 还是存放“YouToothpaste”的地方。\n\n### 活动\n\n如果你想更好地了解\
  \ Java 和计算机编程的主题，请完成以下活动：\n\n-   要听取程序员为何选择这门语言的意见，请访问 Stack Overflow 问答网站 [www.stackoverflow.com/questions/209555](http://www.stackoverflow.com/questions/209555)，阅读人们如何回答“你为什么选择\
  \ Java 编程语言而不是其他语言？”这个问题。\n-   用英语句子编写一组指令，将温度从摄氏度转换为华氏度。将这些指令分解成尽可能多的短小单行句子。\n\n\
  要查看每小时末尾活动的解答，请访问本书网站 [www.java24hours.com](http://www.java24hours.com)。\n\n\n\n\
  \n### `class` 语句\n\n程序的第一行是：\n\n```\npackage com.java24hours;\n```\n\n包（package）是一种将\
  \ Java 程序组织在一起的方式。这行代码告诉计算机将`com.java24hours`设置为该程序的包名。\n\n空行之后，第三行是：\n\n```\nclass\
  \ Saluton {\n```\n\n翻译成英语，它的意思是：“计算机，请将我的 Java 程序命名为`Saluton`。”\n\n正如你在第 1 小时中可能回忆到的，你给计算机的每条指令都称为一个语句（statement）。`class`语句就是你给计算机程序命名的方式。它也用于确定程序的其他方面，正如你稍后将看到的。`class`这个术语很重要，因为\
  \ Java 程序也被称为类（class）。\n\n在这个例子中，程序名`Saluton`与文档的文件名`Saluton.java`相匹配。Java 程序的名称必须与其文件名的第一部分匹配，并且大小写也应相同。\n\
  \n如果程序名与文件名不匹配，在你尝试编译某些 Java 程序时会得到一个错误，这取决于`class`语句如何被用于配置程序。\n\n#### `main`语句的作用\n\
  \n程序的下一行是：\n\n```\npublic static void main(String[] arguments) {\n```\n\n这行代码告诉计算机：“程序的主要部分从这里开始。”Java\
  \ 程序被组织成不同的部分，因此需要一种方法来标识程序运行时首先执行的部分。\n\n`main`语句是大多数 Java 程序的入口点。例外情况包括 applet（在网页上由\
  \ web 浏览器运行的程序）、servlet（由 web 服务器运行的程序）以及 app（在移动设备上运行的程序）。\n\n你在接下来的时间里编写的大多数程序都将使用`main`作为起点。这是因为它们直接在你的计算机上运行。而\
  \ Applet、app 和 servlet 则是由另一个程序或设备间接运行的。\n\n为了将它们与其他类型区分开，你直接运行的程序被称为应用程序（applications）。\n\
  \n#### 花括号标记\n\n在`Saluton`程序中，第 3、4、6 和 7 行包含某种类型的花括号——要么是`{`要么是`}`。这些括号是将程序行分组的一种方式（就像括号在句子中用于分组单词一样）。在开括号`{`和闭括号`}`之间的所有内容都属于同一组。\n\
  \n这些分组称为块（blocks）。在清单 2.1 中，第 3 行的开括号与第 7 行的闭括号相关联，这使得你的整个程序成为一个块。你以这种方式使用括号来表示程序的开始和结束。\n\
  \n块可以位于其他块内部（就像在这个句子中使用了括号（并且这里使用了第二组括号）一样）。`Saluton`程序在第 4 行和第 6 行有括号，它们定义了另一个块。这个块以`main`语句开始。`main`语句块内的行将在程序开始时运行。\n\
  \n> **提示**\n> NetBeans 可以帮助你找出一个块的开始和结束位置。点击`Saluton`程序源代码中的一个括号。你点击的括号会变黄，并与它对应的括号一起变黄。两个黄色括号所包围的\
  \ Java 语句就是一个块。这个提示对于像`Saluton`这样的短程序来说用处不大，但随着你编写更长的程序，它可以帮助你避免看起来像一个“呆头”（blockhead，双关语，意指不懂块结构）。\n\
  \n块内唯一包含的语句是：\n\n```\n// My first Java program goes here\n```\n\n这一行是一个占位符。行首的`//`告诉计算机忽略此行，因为它在程序中仅仅是为了方便查看源代码的人。服务于此目的的行称为注释（comments）。\n\
  \n现在，你已经编写了一个完整的 Java 程序。它可以被编译，但如果你运行它，什么都不会发生。原因是你还没有告诉计算机做任何事情。`main`语句块只包含一个注释，而注释会被计算机忽略。你必须在`main`块的开括号和闭括号内添加一些语句。\n\
  \n### 在变量中存储信息\n\n在你编写的程序中，你需要一个地方来临时存储信息。你可以通过使用变量（variable）来实现这一点，变量是一个存储位置，可以容纳整数、浮点数、布尔值、字符和文本行等信息。存储在变量中的信息可以改变，这就是它被命名为“变量”的原因。\n\
  \n在`Saluton.java`文件中，用下面的内容替换第 5 行：\n\n```\nString greeting = \"Saluton mondo!\"\
  ;\n```\n\n这个语句告诉计算机将文本“Saluton mondo!”存储在一个名为`greeting`的变量中。\n\n在 Java 程序中，你必须告诉计算机变量将容纳什么类型的信息。在这个程序中，`greeting`是一个字符串（string）——一行可以包含字母、数字、标点符号和其他字符的文本。在语句中放置`String`是为了将该变量设置为容纳字符串值。\n\
  \n当你将这个语句输入程序时，行末必须包含一个分号。分号用于结束 Java 程序中的每个语句。它们就像句子末尾的句号。计算机用它们来确定一个语句何时结束以及下一个语句何时开始。\n\
  \n每行只放一条语句可以使程序更容易理解（对我们人类而言）。\n\n#### 显示变量的内容\n\n如果你此时运行该程序，看起来仍然什么都没有发生。将文本存储在`greeting`变量中的命令在后台执行。要让计算机显示它正在做些什么，你可以显示该变量的内容。\n\
  \n在`Saluton`程序中，在`String greeting = \"Saluton mondo!\"`语句之后插入另一个空行。使用该空格输入以下语句：\n\
  \n```\nSystem.out.println(greeting);\n```\n\n这个语句告诉计算机显示存储在`greeting`变量中的值。`System.out.println`语句使计算机在系统输出设备（你的显示器）上显示信息。\n\
  \n现在，你开始取得进展了。\n\n### 保存最终产品\n\n你的程序现在应该类似于清单 2.2，尽管你可能在第 5-6 行使用了稍有不同的间距。进行任何必要的更正并保存文件（选择“文件，保存”）。\n\
  \n**清单 2.2** `Saluton`程序的最终版本\n\n```\npackage com.java24hours;\n\nclass Saluton\
  \ {\n    public static void main(String[] arguments) {\n        String greeting\
  \ = \"Saluton mondo!\";\n        System.out.println(greeting);\n    }\n}\n```\n\n\
