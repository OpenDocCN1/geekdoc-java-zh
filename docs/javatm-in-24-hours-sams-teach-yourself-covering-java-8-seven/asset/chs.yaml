  \ Java 类来为您做一些工作。\n\n`Dice` 程序使用了 `java.util` 包中的 `Random` 类，该类可用于创建随机数。\n\n在程序中使用此类所做的第一件事是使用以下语句导入其包：\n\
  \n```\nimport java.util.*;\n```\n\n这使得无需使用其全名 `java.util.Random` 就可以引用 `Random`\
  \ 类。相反，您可以简单地将其称为 `Random`。星号 (`*`) 使得可以通过较短的名称引用包中的所有类。\n\n`Random` 类是一个模板，可用于创建\
  \ `Random` 对象。要创建一个对象，请使用 `new` 关键字，后跟类名和圆括号：\n\n点击此处查看代码图片\n\n```\nRandom generator\
  \ = new Random();\n```\n\n这将创建一个名为 `generator` 的变量，其中保存着一个新的 Random 对象。该对象是一个随机数生成器，可以产生一个或多个随机数。\n\
  \n对于这个程序，将使用该对象的 `nextInt()` 方法来生成一个随机整数值：\n\n点击此处查看代码图片\n\n```\nint value = generator.nextInt();\n\
  ```\n\nJava 中的整数范围是从 –2,147,483,648 到 2,147,483,647。生成器随机选择其中一个数字，并将其分配给 `value`\
