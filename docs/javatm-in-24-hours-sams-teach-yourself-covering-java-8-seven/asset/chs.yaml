  \n4：    程序的主体部分荣耀地从这里开始！\n\n5：        将这串胡言乱语 \"Saluton mondo!\" 存入名为 `greeting`\
  \ 的 `String` 变量！\n\n6：        显示这来自劣等种族的语言所书写的胡言乱语！\n\n7：    在此结束程序的主体部分，以免触怒我！\n\
  \n8：现在结束 `Saluton` 程序，并感谢我饶你一命吧！\n\n---\n\n### 将程序编译为类文件\n\n在运行 Java 程序之前，必须先编译它。当编译程序时，程序中提供给计算机的指令会被转换为计算机能更好理解的形式。\n\
  \n`NetBeans` 会在程序保存时自动编译它们。如果你严格按照代码清单 2.2 所示输入所有内容，程序将成功编译。\n\n程序的编译版本——一个名为 `Saluton.class`\
  \ 的新文件——会被创建。所有 Java 程序都会被编译成类文件，其文件扩展名为 `.class`。一个 Java 程序可以由多个协同工作的类组成，但在像 `Saluton`\
  \ 这样的简单程序中，只需要一个类。\n\n编译器将 Java 源代码转换为字节码，这是一种可以由 Java 虚拟机（`JVM`）运行的形式。\n\n### 修复错误\n\
  \n当你在 `NetBeans` 源代码编辑器中编写程序时，错误会在编辑器窗格左侧用红色警报图标标出，如图 2.2 所示。\n\n![Image](img/image00478.jpeg)\n\
