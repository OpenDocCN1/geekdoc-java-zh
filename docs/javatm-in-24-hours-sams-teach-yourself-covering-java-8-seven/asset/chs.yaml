  运行该应用，即可看到如前文图 16.4 所示的表格。你应该通过执行以下三件事来测试表格的内置功能：\n\n**1.** 双击表格中的某个单元格。光标将出现在该单元格中，允许你通过输入新值来替换现有值。\n\
  \n**2.** 单击一个列标题，将其向左或向右拖动，然后释放。列顺序将重新排列，但单元格的值会保持不变。\n\n**3.** 将鼠标悬停在分隔两个列标题的线上。光标会变为左右箭头。通过将该线拖动到新位置来更改这两列的宽度。\n\
  \n**注意：** 使用数组将数据放入`JTable`组件的一个缺点是，它将每个单元格都视为字符串，并允许用户编辑所有单元格，并用任何字符串替换其值。`TableTest`应用程序中有一行使用了整数。这些整数可能会被更改为非整数和非数字值。为了更精确地控制哪些值可以放入表格单元格，并禁止编辑某些行，你可以使用`javax.swing.table`包中的`TableModel`接口。表格模型是一个提供表格内容及其修改方式信息的对象。\n\
  \n### 小结\n这是专门讲解 Swing（Java 语言中支持图形用户界面软件的部分）的四个小时的最后一个部分。尽管 Swing 是 Java 类库中最大的部分，但大多数类的使用方式都是相似的。一旦你知道了如何创建组件、将组件添加到容器、为容器应用布局管理器以及响应用户输入，你就可以在探索该语言的过程中使用许多新的\
  \ Swing 类了。\n\n### 实战练习\n#### 问答\n**问：** 我如何了解 Java 类库中其余的 Swing 类？\n\n**答：** 在\
  \ Oracle 的官方 Java 网站上，Java 类库的完整文档发布在[`docs.oracle.com/javase/8/docs/api`](http://docs.oracle.com/javase/8/docs/api)。你可以看到`javax.swing`、`java.awt`和`java.awt.event`这些包中包含的类，它们是前四个小时所涵盖的内容。所有的\
  \ Swing 类和接口都有文档记录，包括它们的构造方法、类变量和实例变量。\n\n**问：** 为什么一款关于一只扔桶、绑架公主的大猩猩和一名意大利水管工的电子游戏叫《大金刚》？\n\
  \n**答：** 《大金刚》是由宫本茂命名的，他在 1981 年为任天堂创造了这款投币式街机游戏。宫本茂错误地认为“donkey”在英语中意为“愚蠢”，但等到任天堂美国部门得知时，这个名字已经确定下来了。宫本茂的大猩猩/公主/水管工三角恋灵感来源于任天堂尝试为电子游戏授权《大力水手》失败的经历。后来的电子游戏确定了最初的“大金刚”已经变成了“疯狂大猩猩”，一只年长、脾气暴躁的猿猴，它认为与它辉煌的\
  \ 8 位机时代相比，现在游戏占用了过多的处理能力。\n\n#### 测验\n没有面板，就没有收益：通过回答以下关于滚动窗格、图像图标和其他 Swing 功能的问题来锻炼一下你的大脑。\n\
  \n**1.** `ImageIcon`类支持哪些图形文件格式？\n\n**A.** GIF\n\n**B.** GIF 和 JPEG\n\n**C.** GIF、PNG\
  \ 和 JPEG\n\n**2.** `JSlider`对象的`getValueIsAdjusting()`方法完成了什么？\n\n**A.** 它确定滑块是否已从其原始值更改。\n\
  \n**B.** 它确定滑块当前是否正在被更改值。\n\n**C.** 没什么大用；这个方法让它的父类感到非常失望。\n\n**3.** Swing 库以 20\
  \ 世纪 30 年代流行并在 90 年代复兴的一种舞曲爵士风格命名。以下哪一项不是由 Swing 音乐家演奏的真实歌曲标题？\n\n**A.** “Cement\
  \ Mixer (Put-ti, Put-ti)”\n\n**B.** “Sussudio”\n\n**C.** “Flat Foot Floogie (with\
  \ the Floy Floy)”\n\n#### 答案\n**1. C.** `ImageIcon`中的 PNG 支持是在 Java 1.3 中添加的。\n\n\
  **2. B.** `getValueIsAdjusting()`方法在滑块被移动时返回`true`，否则返回`false`。\n\n**3. B.** “Sussudio”是菲尔·柯林斯\
  \ 1985 年的热门歌曲，比 Swing 时代晚了五十年。另外两首是斯利姆·盖拉德的 Swing 热门歌曲，他胡言乱语的天赋在歌曲“Boot-Ta-La-Za”、“Ra-Da-Da-Da”、“Bingie-Bingie-Scootie”和“Vout\
  \ Oreenie”中也显而易见。\n\n#### 活动\n为了看看你是否掌握了要领，请尝试以下活动：\n\n![Image](img/image00476.jpeg)\
