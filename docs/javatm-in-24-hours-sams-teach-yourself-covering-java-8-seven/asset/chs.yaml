  \ `Integer.parseInt()` 方法就是一个例子，因为你不必创建一个新的 `Integer` 对象，就能将字符串转换为 `int` 值。\n\n\
  **问：** 有没有一份包含 Java 支持的所有内置方法的清单？\n\n**答：** Oracle 在网上提供了 Java 语言所有类的完整文档，包括你可以使用的所有公共方法，网址为\
  \ [`download.java.net/jdk8/docs/api`](http://download.java.net/jdk8/docs/api)。\n\
  \n**问：** 有什么方法可以控制 Java 程序使用的内存量吗？\n\n**答：** Java 虚拟机在运行应用程序时可用的内存由两件事控制：计算机上可用的总物理内存，以及\
  \ JVM 配置使用的内存量。默认内存分配是 256MB。可以使用 `-Xmx` 命令行参数设置不同的内存量。\n\n要在 NetBeans 中设置此项，请选择\
