  \n# 第 21 小时：读写文件\n\n本小时待办事项：\n\n![Image](img/image00474.jpeg) 从文件读取字节到程序中。\n\n![Image](img/image00474.jpeg)\
  \ 在计算机上创建新文件。\n\n![Image](img/image00474.jpeg) 将字节数组保存到文件中。\n\n![Image](img/image00474.jpeg)\
  \ 修改文件中存储的数据。\n\n计算机上有多种表示数据的方式。你已经通过创建对象使用了其中一种。对象包含以变量形式存在的数据和对对象的引用。它还包括使用这些数据来完成任务的方法。\n\
  \n要处理其他类型的数据，例如硬盘驱动器上的文件和网络服务器上的文档，你可以使用`java.io`包中的类。其名称中的“io”代表“输入/输出”，这些类用于访问数据源，如硬盘驱动器、DVD\
  \ 或计算机内存。\n\n你可以通过一种称为流的通信系统将数据带入程序并将数据传出。流是负责将信息从一个地方传输到另一个地方的对象。\n\n### 流\n\n\
  要在 Java 程序中永久保存数据，或稍后检索该数据，你必须至少使用一个流。\n\n流是一个对象，它从一个源获取信息并将其发送到其他地方，其名称源于水流将鱼、船只和工业污染物从一个地方带到另一个地方。\n\
  \n流连接着各种各样的来源，包括计算机程序、硬盘驱动器、互联网服务器、计算机内存和 U 盘。在你学会如何使用流处理一种数据后，你就能以相同的方式处理其他数据。\n\
  \n在本小时中，你将使用流来读写存储在计算机文件中的数据。\n\n流有两种类型：\n\n![Image](img/image00476.jpeg) 输入流：从源读取数据\n\
  \n![Image](img/image00476.jpeg) 输出流：向源写入数据\n\n* * *\n\n注意\n\nJava 类文件以称为字节码的字节形式存储。Java\
  \ 虚拟机运行字节码，而字节码实际上不一定非得由 Java 语言生成。它也可以运行其他语言（包括 NetRexx 和 Jython）编译生成的字节码。你也可能听到\
  \ JVM 被称为字节码解释器。\n\n* * *\n\n所有的输入和输出流都由字节组成，字节是值范围在 0 到 255 之间的单个整数。你可以使用这种格式来表示数据，例如可执行程序、文字处理文档和\
  \ MP3 音乐文件，但这只是字节能表示的数据的一小部分样本。字节流用于读写这类数据。\n\n一种更专门化的数据处理方式是以字符形式——单个字母、数字、标点符号等。当读写文本源时，你可以使用字符流。\n\
  \n无论你处理的是字节流、字符流还是其他类型的信息，总体过程是相同的：\n\n![Image](img/image00476.jpeg) 创建一个与数据关联的流对象。\n\
  \n![Image](img/image00476.jpeg) 调用流的方法，将信息放入流中或从流中取出信息。\n\n![Image](img/image00476.jpeg)\
  \ 通过调用对象的`close()`方法来关闭流。\n\n#### 文件\n\n在 Java 中，文件由`File`类表示，该类也是`java.io`包的一部分。文件可以从硬盘驱动器、软盘驱动器、CD-ROM\
  \ 和其他存储设备中读取。\n\n* * *\n\n注意\n\n此示例在 Windows 系统上工作，该系统使用反斜杠`\\\\`字符作为路径和文件名中的分隔符。Linux\
  \ 和其他基于 Unix 的系统则使用正斜杠`/`字符。要编写一个无论操作系统如何都能正确引用文件的 Java 程序，请使用类变量`File.pathSeparator`代替正斜杠或反斜杠，如以下语句所示：\n\
  \n点击查看代码图像\n\n```\nFile bookName = new File(\"data\" + File.pathSeparator\n    +\
  \ \"address.dat\");\n```\n\n* * *\n\n`File`对象可以表示已存在的文件或你想要创建的文件。要创建`File`对象，请使用文件名作为构造函数，如以下示例：\n\
  \n点击查看代码图像\n\n```\nFile bookName = new File(\"address.dat\");\n```\n\n这将为当前文件夹中名为`address.dat`的文件创建一个对象。你也可以在文件名中包含路径：\n\
  \n点击查看代码图像\n\n```\nFile bookName = new File(\"data\\\\address.dat\");\n```\n\n\n\
  \n\n\n当你有一个 `File` 对象时，你可以对该对象调用几个有用的方法：\n\n![Image](img/image00476.jpeg) `exists()`\
  \ — 如果文件存在则返回 `true`，否则返回 `false`\n\n![Image](img/image00476.jpeg) `getName()` —\
  \ 作为 `String` 类型的文件名\n\n![Image](img/image00476.jpeg) `length()` — 作为 `long` 类型的文件大小\n\
  \n![Image](img/image00476.jpeg) `createNewFile()` — 如果同名文件不存在，则创建一个文件\n\n![Image](img/image00476.jpeg)\
  \ `delete()` — 如果文件存在，则删除它\n\n![Image](img/image00476.jpeg) `renameTo(File)` — 使用作为参数指定的\
  \ `File` 对象的名称重命名文件\n\n你也可以使用 `File` 对象来表示系统上的文件夹而不是文件。在 `File` 构造函数中指定文件夹名称，该名称可以是绝对路径（如\
  \ `C:\\\\MyDocuments\\\\`）或相对路径（如 `java\\\\database`）。\n\n一旦你有一个代表文件夹的对象，你可以调用它的\
  \ `listFiles()` 方法来查看文件夹中的内容。此方法返回一个 `File` 对象数组，代表它包含的每个文件和子文件夹。\n\n#### 从流中读取数据\n\
  \n第一个任务是使用输入流从文件中读取数据。你可以使用 `FileInputStream` 类来完成此操作，它表示从文件读取字节的输入流。\n\n你可以通过指定文件名或\
  \ `File` 对象作为 `FileInputStream()` 构造函数的参数来创建文件输入流。\n\n读取或写入文件的方法在访问文件出错时可能会抛出 `IOException`。与读取和写入文件相关的许多方法都会生成此异常，因此经常使用\
  \ `try`-`catch` 块。\n\n流是 Java 中必须在不再使用时关闭的资源之一。在程序运行时保持流打开会显著消耗 Java 虚拟机的资源。\n\n\
  一种特殊的 `try` 语句称为 `try`-with-resources，它可以轻松确保资源（如文件输入流）在不再需要时被关闭。`try` 语句后面跟着括号。括号内是一个或多个\
  \ Java 语句，这些语句声明通过资源读写数据的变量。\n\n以下是一个示例，演示了如何使用名为 `stream` 的文件输入流读取名为 `cookie.web`\
  \ 的文本文件：\n\n```java\nFile cookie = new File(\"cookie.web\");\n\ntry (FileInputStream\
  \ stream = new FileInputStream(cookie)) {\n    System.out.println(\"Length of file:\
  \ \" + cookie.length());\n} catch (IOException ioe) {\n    System.out.println(\"\
  Could not read file.\");\n}\n```\n\n因为 `stream` 在 `try` 语句中，所以当 `try`-`catch` 块完成时（如果它尚未关闭），流会自动关闭。\n\
  \n文件输入流以字节为单位读取数据。你可以通过调用流的 `read()` 方法（不带参数）来读取单个字节。如果由于已到达文件末尾而在流中没有更多可用字节，则返回字节值\
  \ –1。\n\n当你读取输入流时，它从流中的第一个字节开始，例如文件中的第一个字节。你可以通过调用它的 `skip()` 方法并传递一个参数（一个 `int`\
  \ 表示要跳过的字节数）来跳过流中的某些字节。以下语句跳过名为 `scanData` 的流中的下一个 1,024 字节：\n\n```java\nscanData.skip(1024);\n\
  ```\n\n如果你想一次读取多个字节，请执行以下操作：\n\n![Image](img/image00476.jpeg) 创建一个大小正好等于要读取的字节数的字节数组。\n\
  \n![Image](img/image00476.jpeg) 使用该数组作为参数调用流的 `read()` 方法。数组将被从流中读取的字节填充。\n\n你创建了一个从\
  \ MP3 音频文件读取 ID3 数据的应用程序。由于 MP3 是如此流行的音乐文件格式，通常会在 ID3 文件末尾添加 128 字节来存储歌曲信息，如标题、艺术家和专辑。\n\
  \n* * *\n\n**注意**\n\n在 ASCII 字符集（包含在 Java 支持的 Unicode 标准字符集中）中，这三个数字分别代表大写字母“T”、“A”和“G”。\n\
  \n* * *\n\n`ID3Reader` 应用程序使用文件输入流读取 MP3 文件，跳过除最后 128 字节之外的所有内容。然后检查剩余的字节是否包含 ID3\
  \ 数据。如果包含，前三个字节就是数字 84、65 和 71。\n\n创建一个名为 `ID3Reader` 的新空 Java 文件，并用清单 21.1 中的文本填充它。\n\
  \n**清单 21.1 `ID3Reader.java` 的完整文本**\n\n```java\npackage com.java24hours;\n\nimport\
  \ java.io.*;\n\npublic class ID3Reader {\n    public static void main(String[] arguments)\
  \ {\n        File song = new File(arguments[0]);\n        try (FileInputStream file\
  \ = new FileInputStream(song)) {\n            int size = (int) song.length();\n\
  \            file.skip(size - 128);\n            byte[] last128 = new byte[128];\n\
  \            file.read(last128);\n            String id3 = new String(last128);\n\
  \            String tag = id3.substring(0, 3);\n            if (tag.equals(\"TAG\"\
  )) {\n                System.out.println(\"Title: \" + id3.substring(3, 32));\n\
  \                System.out.println(\"Artist: \" + id3.substring(33, 62));\n   \
  \             System.out.println(\"Album: \" + id3.substring(63, 91));\n       \
  \         System.out.println(\"Year: \" + id3.substring(93, 97));\n            }\
  \ else {\n                System.out.println(arguments[0] + \" does not contain\"\
  \n                    + \" ID3 info.\");\n            }\n            file.close();\n\
  \        } catch (IOException ioe) {\n            System.out.println(\"Error --\
  \ \" + ioe.toString());\n        }\n    }\n}\n```\n\n在作为应用程序运行此类之前，你必须指定一个 MP3 文件作为命令行参数（在\
  \ NetBeans 中使用“运行”、“设置项目配置”、“配置”）。该程序可以与任何 MP3 一起运行，例如 `Come On and Gettit.mp3`，这是\
  \ Marion Black 被不公平遗忘的 1973 年灵魂乐经典。如果你的系统上有歌曲 `Come On and Gettit.mp3`（你确实应该有），图\
  \ 21.1 显示了 `ID3Reader` 应用程序显示的内容。\n\n![Image](img/image00544.jpeg)\n\n**图 21.1**\
  \ 运行 `ID3Reader` 应用程序。\n\n该应用程序在清单 21.1 的第 11–12 行读取 MP3 的最后 128 字节，将它们存储在一个 `byte`\
  \ 数组中。此数组在第 13 行用于创建一个 `String` 对象，该对象包含这些字节表示的字符。\n\n* * *\n\n**提示**\n\n如果你的计算机上没有\
  \ `Come On and Gettit.mp3`（在我看来，这是个大错误），你可以使用知识共享许可在 [`search.creativecommons.org`](http://search.creativecommons.org)\
  \ 寻找要检查的 MP3 歌曲。\n\n知识共享是一套版权许可，规定了歌曲或书籍等作品如何分发、编辑或重新发布。网站 Rock Proper ([www.rockproper.com](http://www.rockproper.com))\
  \ 也提供了一系列根据知识共享许可授权共享的 MP3 专辑。\n\n* * *\n\n如果字符串中的前三个字符是“TAG”，则正在检查的 MP3 文件包含应用程序可识别的\
  \ ID3 信息格式。\n\n在第 16–19 行，调用字符串的 `substring()` 方法来显示字符串的部分内容。要显示的字符来自 ID3 格式，该格式总是将艺术家、歌曲、标题和年份信息放在\
  \ MP3 文件最后 128 字节的相同位置。\n\n一些 MP3 文件要么根本不包含 ID3 信息，要么包含应用程序无法读取的不同格式的 ID3 信息。\n\n\
  \n\n\n\n# Java 流处理与文件操作\n\n## 读取 MP3 文件中的 ID3 信息\n\n文件`Come On and Gettit.mp3`包含可读的\
  \ ID3 信息，前提是它源自您购买的*Eccentric Soul* CD 副本。从音频 CD 创建 MP3 文件的程序会从名为 CDDB 的音乐行业数据库读取歌曲信息。\n\
  \n---\n\n**注意**\n\n您可能很想在 BitTorrent 等流行的文件共享服务上寻找`Come On and Gettit.mp3`的副本。对于“Come\
  \ On and Gettit”这首歌，我完全理解这种诱惑。然而，根据美国唱片业协会的说法，任何下载您不拥有的音乐 CD 的 MP3 文件的人会立即自燃。*Eccentric\
  \ Soul*可从[亚马逊网站](http://Amazon.com)、eBay、Apple iTunes 和其他主要零售商处购买。\n\n---\n\n在从\
  \ MP3 的文件输入流中读取所有与 ID3 信息相关的内容后，该流在第 24 行关闭。完成对流的使用后，应始终关闭它们，以节省 Java 解释器中的资源。\n\
  \n## 缓冲输入流\n\n提高读取输入流的程序性能的方法之一是对输入进行缓冲。缓冲是将数据保存在内存中，以备程序稍后需要时使用的过程。当 Java 程序需要来自缓冲输入流的数据时，它会首先在缓冲区中查找，这比从文件等源读取要快。\n\
  \n要使用缓冲输入流，您需要先创建一个输入流，例如一个`FileInputStream`对象，然后使用该对象创建一个缓冲流。以输入流作为唯一参数调用`BufferedInputStream(InputStream)`构造函数。数据从输入流读取时会被缓冲。\n\
  \n要从缓冲流读取，请调用其不带参数的`read()`方法。返回一个 0 到 255 之间的整数，表示流中的下一个数据字节。如果没有更多可用字节，则返回 -1。\n\
  \n作为缓冲流的示例，您接下来要创建的程序为 Java 添加了一项功能，这是许多程序员怀念其他语言所具有的功能：控制台输入。\n\n控制台输入是在运行应用程序时从控制台（也称为命令行）读取字符的能力。\n\
  \n`System`类包含了在`System.out.print()`和`System.out.println()`语句中使用的`out`变量，还有一个名为`in`的类变量，它表示一个`InputStream`对象。此对象从键盘接收输入并将其作为流提供。\n\
  \n您可以像处理任何其他流一样处理此输入流。以下语句创建了一个与`System.in`输入流相关联的缓冲输入流：\n\n点击此处查看代码图片\n\n```java\n\
  BufferedInputStream bin = new BufferedInputStream(System.in);\n```\n\n下一个项目`Console`类包含一个类方法，您可以在任何\
  \ Java 应用程序中使用它来接收控制台输入。在一个新的 Java 文件中输入清单 21.2 的文本，文件名为`Console`。\n\n**清单 21.2**\
  \ `Console.java` 的完整内容\n\n点击此处查看代码图片\n\n---\n\n```java\n 1: package com.java24hours;\n\
  \ 2:\n 3: import java.io.*;\n 4:\n 5: public class Console {\n 6:     public static\
  \ String readLine() {\n 7:         StringBuilder response = new StringBuilder();\n\
  \ 8:         try {\n 9:             BufferedInputStream bin = new\n10:         \
  \        BufferedInputStream(System.in);\n11:             int in = 0;\n12:     \
  \        char inChar;\n13:             do {\n14:                 in = bin.read();\n\
  15:                 inChar = (char) in;\n16:                 if (in != -1) {\n17:\
  \                     response.append(inChar);\n18:                 }\n19:     \
  \        } while ((in != -1) & (inChar != '\\n'));\n20:             bin.close();\n\
  21:             return response.toString();\n22:         } catch (IOException e)\
  \ {\n23:             System.out.println(\"Exception: \" + e.getMessage());\n24:\
  \             return null;\n25:         }\n26:     }\n27:\n28:     public static\
  \ void main(String[] arguments) {\n29:         System.out.print(\"You are standing\
  \ at the end of the road \");\n30:         System.out.print(\"before a small brick\
  \ building. Around you \");\n31:         System.out.print(\"is a forest. A small\
  \ stream flows out of \");\n32:         System.out.println(\"the building and down\
  \ a gully.\\n\");\n33:         System.out.print(\"> \");\n34:         String input\
  \ = Console.readLine();\n35:         System.out.println(\"That's not a verb I recognize.\"\
  );\n36:     }\n37: }\n```\n\n---\n\n`Console`类包含一个`main()`方法，演示了如何使用它。当您运行该应用程序时，输出应类似于图\
  \ 21.2。\n\n![图片](img/image00545.jpeg)\n\n**图 21.2** 运行 `Console` 应用程序。\n\n---\n\n\
  **注意**\n\n`Console`类也是世界上最不令人满意的文字冒险游戏。您无法进入建筑物、在溪流中跋涉，甚至无法走开。要玩这个游戏更完整的版本，名为“Adventure”，请访问\
  \ Web-Adventures [www.web-adventures.org](http://www.web-adventures.org)。\n\n---\n\
  \n`Console`类包含一个类方法`readLine()`，它从控制台接收字符。当按下回车键时，`readLine()`返回一个包含所有接收字符的`String`对象。\n\
  \n## 向流中写入数据\n\n在`java.io`包中，用于处理流的类成对出现。有用于处理字节流的`FileInputStream`和`FileOutputStream`类，用于处理字符流的`FileReader`和`FileWriter`类，以及许多用于处理其他类型流数据的类。\n\
  \n要开始写入数据，您首先需要创建一个与输出流关联的`File`对象。此文件不必存在于您的系统上。\n\n您可以以两种方式创建`FileOutputStream`。如果您想将字节追加到现有文件，请使用两个参数调用`FileOutputStream()`构造函数：一个表示文件的`File`对象和`boolean`值`true`。您写入流的字节会被附加到文件的末尾。\n\
  \n如果您想将字节写入新文件，请使用`FileOutputStream()`构造函数，其参数为一个`File`对象。\n\n拥有输出流后，您可以调用不同的`write()`方法将字节写入其中：\n\
  \n![图片](img/image00476.jpeg) 以一个字节作为唯一参数调用`write()`以将该字节写入流。\n\n![图片](img/image00476.jpeg)\
  \ 以一个字节数组作为唯一参数调用`write()`以将数组的所有字节写入流。\n\n![图片](img/image00476.jpeg) 为`write(byte[],\
  \ int, int)`方法指定三个参数：一个字节数组、一个表示要写入流的数组第一个元素的整数，以及要写入的字节数。\n\n以下语句创建一个包含 10 个字节的字节数组，并将最后\
  \ 5 个字节写入输出流：\n\n点击此处查看代码图片\n\n```java\nFile dat = new File(\"data.dat\");\nFileOutputStream\
  \ datStream = new FileOutputStream(dat);\nbyte[] data = new byte[] { 5, 12, 4, 13,\
  \ 3, 15, 2, 17, 1, 18 };\ndatStream.write(data, 5, 5);\n```\n\n向流中写入字节时，您可以通过调用`String`对象的`getBytes()`方法将文本转换为字节数组，如本例所示：\n\
  \n点击此处查看代码图片\n\n```java\nString name = \"Puddin N. Tane\";\nbyte[] nameBytes = name.getBytes();\n\
  ```\n\n完成向流写入字节后，通过调用流的`close()`方法来关闭它。\n\n您接下来要编写的是一个简单的应用程序`ConfigWriter`，它通过向文件输出流写字节将几行文本保存到文件中。创建一个同名的\
  \ Java 文件，并将清单 21.3 中的文本输入到源代码编辑器中。\n\n**清单 21.3** `ConfigWriter.java` 的完整内容\n\n\
  点击此处查看代码图片\n\n---\n\n\n\n# ConfigWriter 示例与属性文件操作\n\n`ConfigWriter` 应用程序演示了如何向文件写入数据。其源代码如下：\n\
  \n```java\npackage com.java24hours;\n\nimport java.io.*;\n\npublic class ConfigWriter\
  \ {\n    String newline = System.getProperty(\"line.separator\");\n\n    public\
  \ ConfigWriter() {\n        try {\n            File file = new File(\"program.properties\"\
  );\n            FileOutputStream fileStream = new FileOutputStream(file);\n    \
  \        write(fileStream, \"username=max\");\n            write(fileStream, \"\
  score=12550\");\n            write(fileStream, \"level=5\");\n            fileStream.close();\n\
  \        } catch (IOException ioe) {\n            System.out.println(\"Could not\
  \ write file\");\n        }\n    }\n\n    void write(FileOutputStream stream, String\
  \ output)\n        throws IOException {\n\n        output = output + newline;\n\
  \        byte[] data = output.getBytes();\n        stream.write(data, 0, data.length);\n\
  \    }\n\n    public static void main(String[] arguments) {\n        ConfigWriter\
  \ cw = new ConfigWriter();\n    }\n}\n```\n\n运行此应用程序时，会创建一个名为 `program.properties`\
  \ 的文件，其中包含以下三行文本：\n\n**输出**\n\n```\nusername=max\nscore=12550\nlevel=5\n```\n\n\
  文件在第 10 行创建，并与一个文件输出流关联（第 11 行）。三个属性在第 12–14 行被写入流中。\n\n在 NetBeans 中运行的应用程序会将其创建的文件（或文件）保存在项目的主文件夹中（除非指定了其他文件夹）。要在\
  \ NetBeans 中查看 `program.properties` 文件，请在“Projects”窗格中点击“Files”选项卡将其置于前台。该文件位于顶层的\
  \ `Java24` 文件夹中，如图 21.3 所示。\n\n![Image](img/image00546.jpeg)\n\n**图 21.3** 找到 `program.properties`\
  \ 文件。\n\n双击文件名可在 NetBeans 源代码编辑器中打开它。\n\n### 读取和写入配置属性\n\n当 Java 程序能够通过命令行参数进行配置时，会变得更加灵活，正如您在前面几个小时创建的几个应用程序中所演示的那样。`java.util`\
  \ 包包含一个名为 `Properties` 的类，它支持从另一个源（一个文本文件）加载配置设置。\n\n可以像读取其他文件源一样读取该文件：\n\n-   创建一个代表该文件的\
  \ `File` 对象。\n-   从该 `File` 对象创建一个 `FileInputStream` 对象。\n-   调用 `load()` 从该输入流中检索属性。\n\
  \n属性文件包含一组属性名，后跟一个等号 `=` 和它们的值。以下是一个示例：\n\n```\nusername=lepton\nlastCommand=open\
  \ database\nwindowSize=32\n```\n\n每个属性占一行，因此这将设置名为 `username`、`lastCommand` 和 `windowSize`\
  \ 的属性，其值分别为“lepton”、“open database”和“32”。（`ConfigWriter` 应用程序也使用了相同的格式。）\n\n以下代码加载一个名为\
  \ `config.dat` 的属性文件：\n\n点击此处查看代码图像\n\n```java\nFile configFile = new File(\"config.dat\"\
  );\nFileInputStream inStream = new FileInputStream(configFile);\nProperties config\
  \ = new Properties();\nconfig.load(inStream);\n```\n\n配置设置（称为属性）以字符串形式存储在 `Properties`\
  \ 对象中。每个属性由一个键标识。`getProperty()` 方法使用其键检索属性，如以下语句所示：\n\n点击此处查看代码图像\n\n```java\n\
  String username = config.getProperty(\"username\");\n```\n\n由于属性以字符串形式存储，因此必须以某种方式将其转换才能用于数值，如以下代码所示：\n\
  \n点击此处查看代码图像\n\n```java\nString windowProp = config.getProperty(\"windowSize\");\n\
  int windowSize = 24;\ntry {\n    windowSize = Integer.parseInt(windowProp);\n} catch\
  \ (NumberFormatException exception) {\n    // do nothing\n}\n```\n\n可以通过使用两个参数（键和值）调用\
  \ `setProperty()` 方法来存储属性：\n\n点击此处查看代码图像\n\n```java\nconfig.setProperty(\"username\"\
  , \"max\");\n```\n\n您可以通过调用 `Properties` 对象的 `list(PrintStream)` 方法来显示所有属性。`PrintStream`\
  \ 是 `System` 类中 `out` 变量的类，您在本书中一直使用 `System.out.println()` 语句来显示输出。以下代码调用 `list()`\
  \ 来显示所有属性：\n\n```java\nconfig.list(System.out);\n```\n\n对属性进行更改后，您可以将它们保存回文件：\n\n\
  -   创建一个代表该文件的 `File` 对象。\n-   从该 `File` 对象创建一个 `FileOutputStream` 对象。\n-   调用 `store(OutputStream,\
  \ String)` 将属性保存到指定的输出流，并使用字符串作为属性文件的描述。\n\n在下一个项目中，您将基于 `ConfigWriter` 应用程序进行构建，该应用程序将多个程序设置写入文件。`Configurator`\
  \ 应用程序将这些设置读入 Java 属性文件，添加一个名为 `runtime` 的新属性（包含当前日期和时间），并保存更改后的文件。\n\n创建一个新的 Java\
  \ 文件来保存 `Configurator` 类，并输入清单 21.4 中的文本。\n\n### 清单 21.4 `Configurator.java` 的完整文本\n\
  \n点击此处查看代码图像\n\n```java\npackage com.java24hours;\n\nimport java.io.*;\nimport java.util.*;\n\
  \npublic class Configurator {\n\n    public Configurator() {\n        try {\n  \
  \          // load the properties file\n            File configFile = new File(\"\
  program.properties\");\n            FileInputStream inStream = new FileInputStream(configFile);\n\
  \            Properties config = new Properties();\n            config.load(inStream);\n\
  \            // create a new property\n            Date current = new Date();\n\
  \            config.setProperty(\"runtime\", current.toString());\n            //\
  \ save the properties file\n            FileOutputStream outStream = new FileOutputStream(configFile);\n\
  \            config.store(outStream, \"Properties settings\");\n            inStream.close();\n\
  \            config.list(System.out);\n        } catch (IOException ioe) {\n   \
  \         System.out.println(\"IO error \" + ioe.getMessage());\n        }\n   \
  \ }\n\n    public static void main(String[] arguments) {\n        Configurator con\
  \ = new Configurator();\n    }\n}\n```\n\n在此应用程序中，`program.properties` 的 `File`\
  \ 对象在第 11–12 行创建并与文件输入流关联。文件的内容在第 13–14 行从流加载到 `Properties` 对象中。\n\n当前日期和时间的新属性在第\
  \ 16–17 行创建。然后，文件在第 19 行与输出流关联，整个属性文件在第 20 行写入该流。\n\n`Configurator` 应用程序的输出如图 21.4\
  \ 所示。\n\n![Image](img/image00547.jpeg)\n\n**图 21.4** 运行 `Configurator` 应用程序。\n\n\
  `program.properties` 文件现在包含以下文本：\n\n**输出**\n\n点击此处查看代码图像\n\n```\n#Properties settings\n\
  #Sun Dec 22 20:31:07 EDT 2013\nruntime=Sun Dec 22 20\\:31\\:07 EDT 2013\nscore=12550\n\
  level=5\nusername=max\n```\n\n反斜杠字符 `\\` 的格式（与应用程序的输出不同）确保属性文件正确存储。\n\n### 总结\n\n\
  在本小时中，您使用了输入流和输出流来写入字节，这是通过流表示数据最简单的方式。\n\n\n\n\n## Java I/O 与 Web 服务\n\n`java.io`\
  \ 包中还有更多用于以其他方式处理流的类。还有一个名为 `java.net` 的类包，它支持通过 Internet 连接进行流的读写。\n\n字节流可以适应多种用途，因为您可以轻松地将字节转换为其他数据类型，例如整数、字符和字符串。\n\
  \n本小时的第一个项目 `ID3Reader` 应用程序，从流中读取字节并将其转换为字符串，以读取诸如 Marion Black 的歌曲《Come On and\
  \ Gettit》（选自专辑 *Eccentric Soul*）中的 ID3 格式数据。\n\n我提到过你应该买这首歌吗？\n\n### 工作坊\n\n####\
  \ 问答\n\n**问.** 为什么本小时的一些字节流方法使用整数作为参数？它们应该使用 `byte` 参数吗？\n\n**答.** 流中的字节与 `byte`\
  \ 类表示的字节之间存在差异。Java 中的 `byte` 的值范围是 -128 到 127，而流中的字节的值范围是 0 到 255。由于这个原因，在处理字节时经常需要使用\
  \ `int`——它可以保存 128 到 255 的值，而 `byte` 则不能。\n\n**问.** Mumblety-Peg 是什么？\n\n**答.**\
  \ 它是一种孩子们在校园里用小折刀玩的游戏。\n\n最简单的形式是，玩家站立并将刀扔向自己的脚。刀落得最近的玩家获胜。其他版本包括将刀扔向对方，迫使对手将脚伸到刀落下的地方。伸得太远而摔倒的玩家输掉。\n\
  \n这个名字来源于一条规则，即获胜者可以用刀将木钉敲入地面三次。输家必须“mumble the peg”，即只用牙齿把它移除。\n\n这个游戏在 20 世纪初失宠了，当时全世界共同意识到孩子们互相扔刀可能不是世界上最好的主意。\n\
  \n#### 测验\n\n看看你在本小时的知识之树上是否摘到了足够大的果实，回答以下关于 Java 中流的问题。\n\n**1.** 下列哪种技术可用于将字节数组转换为字符串？\n\
  \n**答.** 调用数组的 `toString()` 方法。\n\n**答.** 将每个字节转换为一个字符，然后将每个字符分配给 `String` 数组中的一个元素。\n\
  \n**答.** 使用数组作为参数调用 `String()` 构造函数。\n\n**2.** 在 Java 程序中，读取文件使用哪种流？\n\n**答.** 输入流\n\
  \n**答.** 输出流\n\n**答.** 两者皆可\n\n**3.** `File` 类的哪个方法可用于确定文件的大小？\n\n**答.** `getSize()`\n\
  \n**答.** `read()`\n\n**答.** `length()`\n\n#### 答案\n\n**1. C.** 你可以像选项 B 建议的那样单独处理每个字节，但你可以轻松地从其他数据类型创建字符串。\n\
  \n**2. A.** 输入流是从 `File` 对象创建的，或者通过向输入流的构造函数提供文件名来创建。\n\n**3. C.** 此方法返回一个 `long`，表示流中的字节数。\n\
