  \n![Image](img/image00474.jpeg) 创建构造函数。\n\n![Image](img/image00474.jpeg) 向方法发送参数。\n\
  \n![Image](img/image00474.jpeg) 使用 `this` 引用对象。\n\n![Image](img/image00474.jpeg)\
  \ 创建新对象。\n\n正如你在上一小时面向对象编程（OOP）介绍中所学到的，对象是一种组织程序的方式，使其拥有完成任务所需的一切。对象由属性和行为组成。\n\n\
  属性是存储在对象内部的信息。它们可以是整型、字符型和布尔值等变量，也可以是 `String` 和 `Calendar` 等对象。行为是用于处理对象内特定任务的语句组。这些语句组中的每一组都称为一个方法。\n\
  \n到目前为止，你一直在不知不觉地使用对象的方法和变量。任何时候，只要你的语句中包含一个不是小数点或字符串部分的句点，就涉及到一个对象。\n\n### 创建变量\n\
  \n在本小时，你将研究一个名为 `Virus` 的示例对象类，它在生活中的唯一目的就是尽可能多地繁殖——有点像我在大学认识的一些人。`Virus` 需要完成几项不同的工作，这些工作作为类的行为来实现。方法所需的信息则存储为属性。\n\
  \n对象的属性代表对象运行所需的变量。这些变量可以是整型、字符型和浮点型等简单数据类型，也可以是数组或 `String` 或 `Calendar` 等类的对象。你可以在对象的整个类中，在对象包含的任何方法中使用其变量。按照惯例，你在创建类的\
  \ `class` 语句之后、任何方法之前立即创建变量。\n\n`Virus` 对象需要的其中一件事是一种表明文件已被感染的方法。一些计算机会改变存储文件最后修改时间的字段；例如，病毒可能将时间从\
  \ 7:41:20 改为 7:41:61。因为没有正常文件会被保存在一分钟的第 61 秒，这个时间就表示该文件被感染了。\n\n`Virus` 对象使用一个名为\
  \ `newSeconds` 的整型变量来表示不可能的秒数值 86。以下语句开始一个名为 `Virus` 的类，该类有一个名为 `newSeconds` 的属性和另外两个属性：\n\
  \n```java\npublic class Virus {\n    public int newSeconds = 86;\n    public String\
  \ author = \"Sam Snett\";\n    int maxFileSize = 30000;\n}\n```\n\n所有三个变量都是该类的属性：`newSeconds`、`maxFileSize`\
  \ 和 `author`。\n\n在变量声明语句中放入 `public` 这样的语句被称为访问控制，因为它决定了使用 `Virus` 对象的其他程序是否可以使用该变量。\n\
  \n将变量设为 `public` 使得从使用 `Virus` 对象的另一个程序修改该变量成为可能。\n\n例如，如果另一个程序将数字 92 附加了特殊意义，它可以将\
  \ `newSeconds` 更改为该值。以下语句创建一个名为 `influenza` 的 `Virus` 对象并设置其 `newSeconds` 变量：\n\n\
  ```java\nVirus influenza = new Virus();\ninfluenza.newSeconds = 92;\n```\n\n在 `Virus`\
  \ 类中，`author` 变量也是 `public`，因此可以被其他程序自由更改。而另一个变量 `maxFileSize` 只能在类内部使用。\n\n当你将类中的一个变量设为\
  \ `public` 时，该类就失去了对该变量如何被其他程序使用的控制。在许多情况下，这可能不是问题。例如，`author` 变量可以更改为标识病毒作者的任何名称或化名。如果作者被起诉，这个名字最终可能会出现在法庭文件中，所以你不想选一个愚蠢的。*The\
  \ State of Ohio v. LoveHandles* 听起来可不如 *Ohio v. MafiaBoy* 响亮。\n\n限制对变量的访问可以防止其他程序错误地设置变量值时发生错误。对于\
  \ `Virus` 类，如果 `newSeconds` 被设置为 60 或更小的值，作为一种识别文件被感染的方法，它就不可靠了。无论病毒如何，一些文件可能都以该秒数保存。如果\
  \ `Virus` 对象类需要防范此问题，你需要做以下两件事：\n\n![Image](img/image00476.jpeg) 将变量从 `public` 切换为\
  \ `protected` 或 `private`，这两个是提供更严格访问控制的语句。\n\n![Image](img/image00476.jpeg) 添加行为来更改变量的值并向其他程序报告变量的值。\n\
  \n`protected` 变量只能在同一类、该类的任何子类或同一包中的类中使用。包是一组服务于共同目的的相关类。例如 `java.util` 包，它包含提供日期和时间编程以及文件归档等实用工具的类。当你在\
  \ Java 程序中使用带星号的 `import` 语句，如 `import java.util.*` 时，你正在使程序更容易引用该包的类。\n\n`private`\
  \ 变量比 `protected` 变量更受限制——你只能在同一类中使用它。除非你知道一个变量可以更改为任何值而不影响其类的功能，否则你应该将变量设为 `private`\
  \ 或 `protected`。\n\n以下语句使 `newSeconds` 成为 `private` 变量：\n\n```java\nprivate int\
  \ newSeconds = 86;\n```\n\n如果你想让其他程序以某种方式使用 `newSeconds` 变量，你必须创建使其成为可能的行为。这个任务将在本小时的后面部分介绍。\n\
  \n还有另一种访问控制类型：在创建变量时没有任何 `public`、`private` 或 `protected` 语句。\n\n在本小时之前你开发的大多数程序中，你没有指定任何访问控制。当没有设置访问控制时，变量仅对同一包中的类可用。这被称为默认访问或包访问。\n\
  \n### 创建类变量\n\n\n\n\n当你创建一个对象时，该对象会拥有其所属类所有变量的独立版本。从`Virus`类创建的每个对象都有自己版本的`newSeconds`、`maxFileSize`和`author`变量。如果你修改其中一个对象中的某个变量，它不会影响另一个`Virus`对象中的相同变量。\n\
  \n有时，某个属性应该描述整个类的对象，而不是特定的对象本身。这类变量被称为类变量。如果你想追踪程序中使用了多少个`Virus`对象，可以使用一个类变量来存储此信息。整个类只存在该变量的一个副本。到目前为止你为对象创建的变量可以称为对象变量，因为它们与特定对象相关联。\n\
  \n两种类型的变量以相同的方式创建和使用，但`static`是创建类变量的语句的一部分。下面的语句为`Virus`示例创建了一个类变量：\n\n```\nstatic\
  \ int virusCount = 0;\n```\n\n更改类变量的值与更改对象变量的值没有区别。如果你有一个名为`tuberculosis`的`Virus`对象，你可以使用以下语句更改类变量`virusCount`：\n\
  \n```\ntuberculosis.virusCount++;\n```\n\n因为类变量适用于整个类，所以你也可以直接使用类名：\n\n```\nVirus.virusCount++;\n\
  ```\n\n两种语句实现的功能相同，但在使用类变量时使用类名的一个优点是，它立即表明`virusCount`是一个类变量，而不是对象变量。如果你在使用类变量时总是使用对象名称，那么除非仔细查看源代码，否则无法判断它们是类变量还是对象变量。\n\
  \n* * *\n\n注意\n\n尽管类变量很有用，但你必须小心不要过度使用它们。这些变量在类运行期间一直存在。如果将大量对象数组存储在类变量中，它将占用相当大的内存空间，并且永远不会释放。\n\
  \n* * *\n\n类变量也被称为静态变量。\n\n## 使用方法创建行为\n\n属性是用于跟踪类对象信息的方式，但要让一个类执行其创建的目的，你必须创建行为。行为描述了类中执行特定任务的每个部分。这些部分中的每一个都称为方法。\n\
  \n* * *\n\n提示\n\n`System.out.println()`方法可能看起来令人困惑，因为它包含两个句点而不是一个。这是因为该语句涉及两个类：`System`类和`PrintStream`类。`System`类有一个名为`out`的变量，它是一个`PrintStream`对象。`println()`是`PrintStream`类的一个方法。`System.out.println()`语句实际上意味着：“使用`System`类的`out`实例变量的`println()`方法。”你可以以这种方式链接引用。\n\
  \n* * *\n\n到目前为止，你一直在程序中使用方法，只是没有意识到，尤其是`println()`方法。该方法在屏幕上显示文本。与变量一样，方法与对象或类一起使用。对象或类的名称后跟一个句点和方法的名称，如`object2.move()`或`Integer.parseInt()`。\n\
  \n### 声明方法\n\n你使用类似于开始一个类的语句来创建方法。两者都可以在名称后的括号中接受参数，并且都在开头和结尾使用`{`和`}`标记。区别在于方法在处理后可以返回一个值。该值可以是整数或布尔值等简单类型，也可以是对象类。\n\
  \n以下是`Virus`类可以用来感染文件的一个方法示例：\n\n```\npublic boolean infectFile(String filename)\
  \ {\n\n    boolean success = false;\n\n    // 文件感染语句放在这里\n\n    return success;\n\
  \n}\n```\n\n此方法接受一个参数：一个名为`filename`的字符串变量，它代表要攻击的文件。如果感染成功，`success`变量将被设置为`true`。\n\
  \n在开始方法的语句中，`boolean`位于方法名`infectFile`之前。此语句表示在方法处理后会返回一个布尔值。`return`语句是实际返回值的语句。在此方法中，返回的是`success`的值。\n\
  \n如果一个方法不应该返回值，请使用关键字`void`。\n\n当方法返回值时，你可以在表达式的任何位置使用该方法。例如，如果你创建了一个名为`malaria`的`Virus`对象，你可以使用如下语句：\n\
  \n```\nif (malaria.infectFile(currentFile)) {\n\n    System.out.println(currentFile\
  \ + \" has been infected!\");\n\n} else {\n\n    System.out.println(\"Curses! Foiled\
  \ again!\");\n\n}\n```\n\n你可以在程序中任何可以使用变量的地方使用返回值的方法。\n\n早些时候，你将`newSeconds`变量设为`private`，以防止它被其他程序读取或修改。\n\
  \n当实例变量是私有的时候，仍然有办法让`newSeconds`在其他地方使用：在`Virus`类中创建`public`方法来获取`newSeconds`的值和设置`newSeconds`的新值。这些新方法应该是`public`的，与`newSeconds`变量本身不同，这样它们才能在其他程序中被调用。\n\
  \n考虑以下两个方法：\n\n```\npublic int getSeconds() {\n\n    return newSeconds;\n\n}\n\n\
  public void setSeconds(int newValue) {\n\n    if (newValue > 60) {\n\n        newSeconds\
  \ = newValue;\n\n    }\n\n}\n```\n\n这些方法被称为访问器方法，因为它们使其他对象能够访问`newSeconds`变量。\n\n\
  `getSeconds()`方法用于检索`newSeconds`的当前值。`getSeconds()`方法没有任何参数，但其方法名后仍必须有括号。`setSeconds()`方法接受一个参数，一个名为`newValue`的整数。此参数是`newSeconds`的新值。如果`newValue`大于\
  \ 60，更改将会生效。\n\n在此示例中，`Virus`类控制其他类如何使用`newSeconds`变量。这个过程被称为封装，它是面向对象编程的基本概念。你的对象自我保护能力越强，当你将它们用于其他程序时，它们就越有用。\n\
  \n尽管`newSeconds`是私有的，但新方法`getSeconds()`和`setSeconds()`之所以能够与`newSeconds`一起工作，是因为它们在同一个类中。\n\
  \n### 具有不同参数的类似方法\n\n正如你在`setSeconds()`方法中看到的，你可以向方法传递参数来影响其功能。一个类中的不同方法可以有不同的名称，但如果方法具有不同的参数，它们也可以具有相同的名称。\n\
  \n如果两个方法具有不同数量的参数或参数属于不同的变量类型，它们可以具有相同的名称。例如，`Virus`类对象拥有两个`tauntUser()`方法可能很有用。一个可以没有参数，并提供一个通用的嘲讽。另一个可以将嘲讽指定为字符串参数。以下语句实现了这些方法：\n\
  \n```\nvoid tauntUser() {\n\n    System.out.println(\"That has gotta hurt!\");\n\
  \n}\n\nvoid tauntUser(String taunt) {\n\n    System.out.println(taunt);\n\n}\n```\n\
  \n\n\n## 方法签名\n\n方法可以同名，但参数不同：一个没有参数，另一个有一个 `String` 参数。方法的参数被称为方法的签名。一个类可以有多个同名的方法，只要每个方法的签名不同即可。\n\
  \n## 构造函数方法\n\n当你要在程序中创建一个对象时，需要使用 `new` 语句，如下例所示：\n\n```java\nVirus typhoid = new\
  \ Virus();\n```\n\n此语句创建了一个名为 `typhoid` 的新 `Virus` 对象。当你使用 `new` 语句时，该对象类的一个特殊方法会被调用。这个方法被称为构造函数，因为它处理创建对象所需的工作。构造函数的目的是设置任何必要的变量，并调用使对象正常工作所必须的方法。\n\
  \n构造函数的定义与其他方法类似，只是它们不能返回值。以下是 `Virus` 类对象的两个构造函数：\n\n```java\npublic Virus() {\n\
  \    author = \"Ignoto\"; // author 是一个字符串\n    maxFileSize = 30000; // maxFileSize\
  \ 是一个整数\n}\n\npublic Virus(String name, int size) {\n    author = name;\n    maxFileSize\
  \ = size;\n}\n```\n\n与其他方法一样，构造函数可以利用传入的参数，在同一个类中定义多个构造函数。在本例中，当使用如下所示的 `new` 语句时，将调用第一个构造函数：\n\
  \n```java\nVirus mumps = new Virus();\n```\n\n而另一个构造函数只有在 `new` 语句中传递一个字符串和一个整数作为参数时才能被调用，如下例所示：\n\
  \n```java\nVirus rubella = new Virus(\"April Mayhem\", 60000);\n```\n\n如果你不在类中定义任何构造函数，它将从其超类继承一个无参数的构造函数。根据所使用的超类，它还可能继承其他构造函数。\n\
  \n> **注意**\n> 如果你的子类定义了一个带有一个或多个参数的构造函数，该类将不再从其超类继承无参数的构造函数。因此，当你的类有其他构造函数时，你必须总是定义一个无参构造函数。\n\
  \n在任何类中，必须有一个构造函数，其参数的数量和类型与用于创建该类对象的 `new` 语句相同。在 `Virus` 类的例子中，它有 `Virus()` 和\
  \ `Virus(String name, int size)` 构造函数，你只能使用两种不同类型的 `new` 语句来创建 `Virus` 对象：一种不带参数，另一种带一个字符串和一个整数作为仅有的两个参数。\n\
  \n## 类方法\n\n与类变量类似，类方法是提供与整个类而非特定对象相关联的功能的一种方式。当一个方法不影响类的任何特定对象时，可以使用类方法。在上一小时的“创建你的第一个对象”中，你使用了\
  \ `Integer` 类的 `parseInt()` 方法将字符串转换为 `int` 类型的变量：\n\n```java\nint fontSize = Integer.parseInt(fontText);\n\
  ```\n\n这是一个类方法。要使一个方法成为类方法，请在方法名前使用 `static`，如以下代码所示：\n\n```java\nstatic void showVirusCount()\
  \ {\n    System.out.println(\"There are \" + virusCount + \" viruses\");\n}\n```\n\
  \n`virusCount` 类变量之前被用来跟踪程序创建了多少个 `Virus` 对象。`showVirusCount()` 方法是一个显示此总数的类方法，你可以使用如下语句调用它：\n\
  \n```java\nVirus.showVirusCount();\n```\n\n## 方法内的变量作用域\n\n当你在类中的方法内部创建一个变量或对象时，它只能在该方法内部使用。原因是变量作用域的概念。作用域是程序中变量存在的代码块。如果你超出了程序由作用域定义的部分，你就不能再使用该变量。\n\
  \n程序中的花括号 `{` 和 `}` 定义了变量作用域的边界。在这些标记内创建的任何变量都不能在它们之外使用。例如，考虑以下语句：\n\n```java\n\
  if (numFiles < 1) {\n    String warning = \"No files remaining.\";\n}\nSystem.out.println(warning);\n\
  ```\n\n这段代码无法工作——在 NetBeans 中也无法编译——因为 `warning` 变量是在 `if` 代码块的花括号内创建的。这些花括号定义了该变量的作用域。`warning`\
  \ 变量在花括号外不存在，因此 `System.out.println()` 方法无法将其用作参数。\n\n当你在一组花括号内使用另一组花括号时，需要注意嵌套变量的作用域。看下面的例子：\n\
  \n```java\nif (infectedFiles < 5) {\n    int status = 1;\n    if (infectedFiles\
  \ < 1) {\n        boolean firstVirus = true;\n        status = 0;\n    } else {\n\
  \        firstVirus = false;\n    }\n}\n```\n\n发现问题了吗？在这个例子中，`status` 变量可以在任何地方使用，但将值\
  \ `false` 赋给 `firstVirus` 变量的语句会导致编译器错误。因为 `firstVirus` 是在 `if (infectedFiles <\
  \ 1)` 语句的作用域内创建的，它在紧随其后的 `else` 语句的作用域内不存在。\n\n要解决这个问题，`firstVirus` 必须在这两个代码块之外创建，这样它的作用域才能包含它们两者。一个解决方案是在\
  \ `status` 创建之后的一行创建 `firstVirus`。\n\n强制执行作用域规则使程序更容易调试，因为作用域限制了你可以使用变量的区域。这减少了编程中最常出现的错误之一：在程序的不同部分以两种不同的方式使用同一个变量。\n\
  \n作用域的概念也适用于方法，因为它们是由一个左花括号和右花括号定义的。在方法内部创建的变量不能在其他方法中使用。只有在变量是作为对象变量或类变量创建时，你才能在多个方法中使用它。\n\
  \n## 将一个类放入另一个类中\n\n虽然一个 Java 程序被称为一个类，但许多时候程序需要多个类来完成其工作。这些程序由一个主类和任何所需的辅助类组成。\n\
  \n当你将程序划分为多个类时，有两种方式来定义辅助类。一种方式是将每个类单独定义，如下例所示：\n\n```java\npublic class Wrecker\
  \ {\n    String author = \"Ignoto\";\n\n    public void infectFile() {\n       \
  \ VirusCode vic = new VirusCode(1024);\n    }\n}\n\nclass VirusCode {\n    int vSize;\n\
  \n    VirusCode(int size) {\n        vSize = size;\n    }\n}\n```\n\n在这个例子中，`VirusCode`\
  \ 类是 `Wrecker` 类的辅助类。辅助类通常与其辅助的类定义在同一个源代码文件中。当源文件被编译时，会生成多个类文件。前面的示例在编译后会生成文件 `Wrecker.class`\
  \ 和 `VirusCode.class`。\n\n> **注意**\n> 如果在同一个源文件中定义了多个类，那么只能有一个类是 `public` 的。其他类不应该在其类声明中包含\
  \ `public`。源代码文件的名称必须与其定义的 `public` 类相匹配。\n\n在创建主类和辅助类时，你也可以将辅助类放在主类内部。这样做时，辅助类被称为内部类。\n\
  \n你将内部类放置在另一个类的左花括号和右花括号内。\n\n\n\n## 使用内部类\n\n点击此处查看代码图片\n\n```java\npublic class\
  \ Wrecker {\n    String author = \"Ignoto\";\n    \n    public void infectFile()\
  \ {\n        VirusCode vic = new VirusCode(1024);\n    }\n    \n    class VirusCode\
  \ {\n        int vSize;\n        \n        VirusCode(int size) {\n            vSize\
  \ = size;\n        }\n    }\n}\n```\n\n你可以像使用其他任何类型的辅助类一样使用内部类。主要的区别——除了它的位置——在于编译器处理这些类之后会发生什么。内部类不会获得其`class`语句中指示的名称。相反，编译器会给它们一个包含主类名称的名称。\n\
  \n***\n\n**注意**\n\n内部类支持一些复杂的 Java 编程技巧，这些技巧在你对这门语言有更多经验后会更有意义。准确地说，是再多九个小时。本书将在第\
  \ 20 小时“使用内部类和闭包”中再次讨论这个主题。\n\n***\n\n在上面的例子中，编译器生成了`Wrecker.class`和`Wrecker$VirusCode.class`文件。\n\
  \n### 使用 this 关键字\n\n因为你可以引用其他类中的变量和方法，也可以引用自己类中的变量和方法，所以在某些情况下你引用的变量可能会变得混淆。让事情更清楚的一种方式是使用`this`语句——这是一种在程序中引用程序自身对象的方式。\n\
  \n当你使用对象的方法或变量时，你在方法或变量名前面放上对象的名称，并用句点分隔。考虑以下示例：\n\n点击此处查看代码图片\n\n```java\nVirus\
  \ chickenpox = new Virus();\nchickenpox.author = \"LoveHandles\";\nchickenpox.setSeconds(75);\n\
  ```\n\n这些语句创建了一个名为`chickenpox`的新`Virus`对象，设置了`chickenpox`的`name`变量，然后调用了`chickenpox`的`setSeconds()`方法。\n\
  \n在程序中，有时你需要引用当前对象——换句话说，就是程序本身所代表的对象。例如，在`Virus`类内部，你可能有一个方法，该方法有自己的名为`author`的变量：\n\
  \n点击此处查看代码图片\n\n```java\npublic void checkAuthor() {\n    String author = null;\n\
  }\n```\n\n在这个例子中，一个名为`author`的变量存在于`checkAuthor()`方法的作用域内，但它与对象变量`author`不是同一个变量。如果你想引用当前对象的`author`变量，必须使用`this`语句，如下所示：\n\
  \n点击此处查看代码图片\n\n```java\nSystem.out.println(this.author);\n```\n\n通过使用`this`，你可以明确你指的是哪个变量或方法。你可以在类中任何你会通过名称引用对象的地方使用`this`。例如，如果你想将当前对象作为参数传递给某个方法，可以使用如下语句：\n\
  \n```java\nverifyData(this);\n```\n\n在许多情况下，`this`语句并非必须，你仍然可以清楚地表明你引用的是对象的变量和方法。然而，任何时候只要你想要确保引用了正确的东西，使用`this`都没有坏处。\n\
  \n`this`关键字在设置对象实例变量的值时，在构造函数中非常有用。考虑一个具有`author`和`maxFileSize`变量的`Virus`对象。这个构造函数会设置它们：\n\
  \n点击此处查看代码图片\n\n```java\npublic Virus(String author, int maxFileSize) {\n    this.author\
  \ = author;\n    this.maxFileSize = maxFileSize;\n}\n```\n\n### 使用类方法和变量\n\n在我们律师的坚持下，本小时的第一个项目不是创建一个可工作的病毒。相反，你将创建一个简单的`Virus`对象，它可以统计程序创建的`Virus`对象的数量并报告总数。\n\
  \n你知道流程：在 NetBeans 中选择文件（File）-> 新建文件（New File），创建一个新的名为`Virus`的空 Java 文件。在源代码编辑器中输入清单\
  \ 11.1 的内容。点击保存（Save）。\n\n**清单 11.1 `Virus.java`的完整文本**\n\n点击此处查看代码图片\n\n```java\n\
  package com.java24hours;\n\npublic class Virus {\n    static int virusCount = 0;\n\
  \    \n    public Virus() {\n        virusCount++;\n    }\n    \n    static int\
  \ getVirusCount() {\n        return virusCount;\n    }\n}\n```\n\n保存文件，NetBeans\
  \ 会自动编译它。这个类缺少一个`main()`方法，因此不能直接运行。要测试这个新的`Virus`类，你需要创建第二个类来创建`Virus`对象。\n\n`VirusLab`类是一个简单的应用程序，它创建`Virus`对象，然后使用`Virus`类的`getVirusCount()`类方法统计已创建的对象数量。\n\
  \n用 NetBeans 打开一个新文件，输入清单 11.2。完成后，将文件保存为`VirusLab.java`。\n\n**清单 11.2 `VirusLab.java`的完整文本**\n\
  \n点击此处查看代码图片\n\n```java\npackage com.java24hours;\n\npublic class VirusLab {\n \
