  \ 第二部分：学习编程基础\n\n## 第 5 小时：在程序中存储和更改信息\n\n本小时待办事项：\n\n![图片](img/image00474.jpeg)\
  \ 创建一个变量。\n\n![图片](img/image00474.jpeg) 使用不同类型的变量。\n\n![图片](img/image00474.jpeg)\
  \ 将值存储在变量中。\n\n![图片](img/image00474.jpeg) 在数学表达式中使用变量。\n\n![图片](img/image00474.jpeg)\
  \ 将一个变量的值存储在另一个变量中。\n\n![图片](img/image00474.jpeg) 增加和减少变量的值。\n\n\n\n\n\n# 第 2 小时：编写第一个程序\n\
  \n在第 2 小时“编写你的第一个程序”中，你使用了一个变量——一个专门设计来存放信息的特殊存储位置。变量中存储的信息可以在程序运行时改变。你的第一个程序在一个变量中存储了一段文本字符串。字符串只是可以存储在变量中的信息类型之一。变量还可以存储字符、整数、浮点数和对象。\n\
  \n在本小时中，你将学习更多关于在 Java 程序中使用变量的知识。\n\n## 语句和表达式\n\n计算机程序是一系列告诉计算机做什么的指令。每条指令被称为一个语句。以下来自\
  \ Java 程序的示例是一条语句：\n\n```java\nint highScore = 450000;\n```\n\n在 Java 程序中，你可以使用花括号将一组语句组合在一起。这些组合被称为块语句。考虑以下程序片段：\n\
  \n```java\n1: public static void main(String[] arguments) {\n2:    int a = 3;\n\
  3:    int b = 4;\n4:    int c = 8 * 5;\n5: }\n```\n\n此示例中的第 2-4 行是一个块语句。第 1 行的左花括号表示块的开始，第\
  \ 5 行的右花括号表示块的结束。\n\n有些语句被称为表达式，因为它们涉及一个数学表达式并产生一个结果。前面示例中的第 4 行是一个表达式，因为它将变量`c`的值设置为\
  \ 8 乘以 5。你将在本小时中使用表达式。\n\n## 赋值变量类型\n\n变量是计算机在运行程序时记住某些信息的主要方式。在第 2 小时中的`Saluton`程序使用了`greeting`变量来保存\"\
  Saluton mondo!\"。计算机需要记住那段文本，以便稍后能够显示该消息。\n\n在 Java 程序中，变量是通过一条语句创建的，该语句必须包含两件事：\n\
  \n- 变量的名称\n- 变量将存储的信息类型\n\n变量还可以包含被存储信息的值。\n\n为了查看不同类型的变量以及它们是如何创建的，启动 NetBeans\
  \ 并创建一个新的空 Java 文件，类名为`Variable`。\n\n开始编写程序，输入以下几行：\n\n```java\npackage com.java24hours;\n\
  \nclass Variable {\n    public static void main(String[] arguments) {\n        //\
  \ 即将到来：变量\n    }\n}\n```\n\n在进行任何更改之前，先保存这几行。\n\n### 整数和浮点数\n\n目前，`Variable`程序只有一个包含一条语句的`main()`块——注释`//\
  \ 即将到来：变量`。删除该注释并输入以下语句来代替：\n\n```java\nint tops;\n```\n\n这条语句创建了一个名为`tops`的变量。它没有为`tops`指定一个值，所以目前这个变量是一个空的存储空间。语句开头的`int`文本将`tops`指定为一个用于存储整数的变量。你可以使用`int`类型来存储计算机程序中需要的大多数非十进制数字。它可以容纳从约-21.4\
  \ 亿到 21.4 亿的任何整数。\n\n在`int tops`语句之后添加一个空行，并输入以下语句：\n\n```java\nfloat gradePointAverage;\n\
  ```\n\n这条语句创建了一个名为`gradePointAverage`的变量。`float`文本代表浮点数。浮点变量用于存储可能包含小数点的数字。\n\n\
  `float`变量类型可容纳最多 38 位数字的十进制数。更大的`double`类型可容纳最多 300 位数字的十进制数。\n\n> **注意**\n> 你可以使用浮点变量来存储平均绩点，例如\
  \ 2.25（以我自己在北德克萨斯大学的成绩为例——你好，韦尔斯教授！）。你也可以用它存储像 0 这样的数字，这是我的平均绩点进入一所好研究生院的百分比概率，这就是为什么在\
  \ 1996 年这家出版商寻找计算机书籍作者时，我有空。\n\n### 字符和字符串\n\n因为你目前处理的变量都是数字类型的，你可能认为所有变量都是用来存储数字的。再想想。你也可以用变量来存储文本。两种类型的文本可以存储为变量：字符和字符串。字符是一个字母、数字、标点符号或符号。字符串是一组字符。\n\
  \n你创建`Variable`程序的下一步是创建一个`char`变量和一个`String`变量。在`float gradePointAverage`行之后添加这两条语句：\n\
  \n```java\nchar key = 'C';\nString productName = \"Larvets\";\n```\n\n在程序中使用字符值时，必须在分配给变量的字符值两边加上单引号。对于字符串值，必须用双引号括起来。\n\
  \n引号可以防止字符或字符串与变量名或语句的其他部分混淆。看看下面这条语句：\n\n```java\nString productName = Larvets;\n\
  ```\n\n这条语句看起来像是告诉计算机创建一个名为`productName`的字符串变量，其文本值为`Larvets`。然而，由于单词`Larvets`周围没有引号，计算机被告知将`productName`的值设置为与名为`Larvets`的变量相同的值。（如果没有名为`Larvets`的变量，程序将因错误而无法编译。）\n\
  \n在添加`char`和`String`语句之后，你的程序类似于清单 5.1。进行任何必要的更改并确保保存文件。\n\n**清单 5.1 `Variable`程序**\n\
  \n```java\n 1: package com.java24hours;\n 2:\n 3: class Variable {\n 4:    public\
  \ static void main(String[] arguments) {\n 5:       int tops;\n 6:       float gradePointAverage;\n\
  \ 7:       char key = 'C';\n 8:       String productName = \"Larvets\";\n 9:   \
  \ }\n10: }\n```\n\n> **注意**\n> 尽管其他变量类型都是小写字母（`int`、`float`和`char`），但在创建字符串变量时，`String`这个词中的大写字母是必需的。Java\
  \ 程序中的字符串与你在变量语句中使用的其他类型的信息是不同的。你将在第 6 小时“使用字符串进行通信”中了解这种区别。\n\n`Variable`程序中的最后两个变量使用了`=`符号在创建变量时分配一个初始值。你可以在\
  \ Java 程序中为任何创建的变量使用这个选项，正如你在本小时稍后将发现的那样。\n\n这个程序可以运行但不会产生任何输出。\n\n### 其他数字变量类型\n\
  \n到目前为止介绍的变量类型是你在大多数 Java 编程中使用的主要类型。在特殊情况下，你可以使用几种其他类型的变量。\n\n你可以使用第一个`byte`，用于范围从-128\
  \ 到 127 的整数。以下语句创建了一个名为`escapeKey`的变量，初始值为 27：\n\n```java\nbyte escapeKey = 27;\n\
  ```\n\n第二个`short`，可用于比`int`类型小的整数。`short`整数范围可以从-32,768 到 32,767，如以下示例所示：\n\n```java\n\
  short roomNumber = 222;\n```\n\n数字变量类型的最后一个`long`，通常用于`int`类型无法容纳的过大整数。`long`整数范围可以从-9.22\
  \ quintillion 到 9.22 quintillion，这是一个足够大的数字，可以涵盖除政府支出以外的所有内容。\n\n> **注意**\n> ...（原文在此处截断）\n\
  \n\n\n\n\n## 数字中下划线的使用\n\n如果 NetBeans 源代码编辑器已设置为使用较旧版本的 Java，那么在其中使用下划线的数字将被标记为错误。为确保情况并非如此，请在“项目”窗格中，右键单击当前项目的名称（很可能是`Java24`）并选择“属性”。此时将打开“项目属性”对话框，其中“类别”窗格中已选中“源”。检查“源/二进制格式”下拉菜单，确保其为当前版本的\
  \ Java。\n\n## 处理大数字\n\n在 Java 中处理大数字时，可能很难一目了然地看出数字的值，例如下面这条语句：\n\n```java\nlong\
  \ salary = 264400000;\n```\n\n除非你去数零的个数，否则你很可能看不出这是 2.644 亿。Java 允许使用下划线（“_”）字符来组织大数字。示例如下：\n\
  \n```java\nlong salary = 264_400_000;\n```\n\n下划线会被忽略，因此变量的值仍然相同。它们只是使数字更易于人类阅读的一种方式。\n\
  \n## `boolean` 变量类型\n\nJava 有一种称为`boolean`的变量类型，只能用于存储`true`值或`false`值。乍一看，`boolean`变量似乎并非特别有用，除非你打算编写大量是非题测验。然而，`boolean`变量在你的程序中会用于各种情况。以下是一些可以使用`boolean`变量来回答的问题示例：\n\
  \n![Image](img/image00476.jpeg) 用户是否按下了某个键？\n\n![Image](img/image00476.jpeg) 游戏是否结束？\n\
  \n![Image](img/image00476.jpeg) 我的银行账户是否已透支？\n\n![Image](img/image00476.jpeg) 这条裤子是不是让我的臀部看起来很肥？\n\
  \n![Image](img/image00476.jpeg) 兔子能不能吃 Trix 麦片？\n\n> **注意**\n> 布尔数以乔治·布尔（1815–1864）的名字命名。布尔是一位在成年前主要靠自学的数学家，他发明了布尔代数，这已成为计算机编程、数字电子学和逻辑学的基础部分。可以想象，他小时候做是非题测试时表现得相当不错。\n\
  \n布尔类型用于存储是/否和真/假问题的答案。\n\n以下语句创建了一个名为`gameOver`的`boolean`变量：\n\n```java\nboolean\
  \ gameOver = false;\n```\n\n此变量的初始值为`false`，因此类似这样的语句可以在游戏程序中表示游戏尚未结束。稍后，当发生某些事件导致游戏结束时，可以将`gameOver`变量设置为`true`。\n\
  \n虽然这两个可能的布尔值在程序中看起来像字符串，但你不应该将它们用引号括起来。第 7 小时“使用条件测试做决策”将更全面地描述`boolean`变量。\n\n\
  ## 命名你的变量\n\nJava 中的变量名可以以字母、下划线字符（`_`）或美元符号（`$`）开头。名称的其余部分可以是任何字母或数字。你可以给变量起几乎任何你喜欢的名字，但应该保持命名的一致性。本节概述了变量的一般推荐命名方法。\n\
  \nJava 在变量名方面区分大小写，因此你必须始终以相同的方式书写变量名。例如，如果在程序中的某处将`gameOver`变量称为`GameOver`，那么编译器会报错，阻止程序编译。\n\
  \n> **注意**\n> 变量名并非 Java 中唯一区分大小写的方面。程序中其他所有可以命名的内容，包括类、包和方法，都必须使用一致的大小写来引用。\n\n\
  变量名应以某种方式描述其用途。第一个字母应小写，如果变量名包含多个单词，则每个后续单词的首字母应大写。例如，如果你想创建一个整数变量来存储游戏程序中的历史最高分，可以使用以下语句：\n\
  \n```java\nint allTimeHighScore;\n```\n\n变量名中不能使用标点符号或空格，因此以下两种写法都不起作用：\n\n```java\n\
  int all-TimeHigh Score;\n\nint all Time High Score;\n```\n\n如果你在程序中尝试使用这些变量名，NetBeans\
  \ 会通过在源代码编辑器中该行旁边显示红色警报图标来标记错误。\n\n语言保留字，例如`public`、`class`、`true`和`false`，不能用作变量名。\n\
  \n## 在变量中存储信息\n\n在 Java 程序中，你可以在创建变量的同时在其中存储一个值。你也可以在程序中的任何后续时间将值放入变量中。\n\n要在创建变量时设置初始值，请使用等号（`=`）。以下是创建一个名为`pi`且初始值为\
  \ 3.14 的双精度浮点型变量的示例：\n\n```java\ndouble pi = 3.14;\n```\n\n所有存储数字的变量都可以类似地设置。如果你设置的是字符或字符串变量，则必须按照本小时前面描述的那样将值用引号括起来。\n\
  \n你也可以将一个变量设置为等于另一个变量的值，前提是它们具有相同的类型。考虑以下示例：\n\n```java\nint mileage = 300;\n\n\
  int totalMileage = mileage;\n```\n\n首先，创建一个名为`mileage`的整数变量，其初始值为 300。接下来，创建一个名为`totalMileage`的整数变量，其值与`mileage`相同。两个变量的初始值都是\
  \ 300。在后续的课程中，你将学习如何将一个变量的值转换为另一个变量的类型。\n\n> **警告**\n> 如果你不给变量一个初始值，那么在使用它之前必须给它赋值。否则，当你的程序编译时，你可能会得到一个错误，指出该变量“可能尚未初始化”。\n\
  \n正如你所了解的，Java 有类似但存储不同大小值的数值变量。`int`和`long`都存储整数，但`long`存储的可能值范围更大。`float`和`double`都存储浮点数，但`double`更大。\n\
  \n你可以在数值后附加一个字母来指示值的类型，如下面的语句：\n\n```java\nfloat pi = 3.14F;\n```\n\n值 3.14 后面的“F”表示它是一个`float`值。如果省略该字母，Java\
  \ 会将 3.14 假定为一个`double`值。\n\n字母“L”用于`long`整数，“D”用于`double`浮点值。\n\nJava 中的另一个命名约定是：将值永不改变的变量名中的每个字母大写。这些变量称为常量。以下创建了三个常量：\n\
  \n```java\nfinal int TOUCHDOWN = 6;\n\nfinal int FIELDGOAL = 3;\n\nfinal int PAT\
  \ = 1;\n```\n\n因为常量的值永远不会改变，你可能想知道为什么还要使用它们——你完全可以使用赋予常量的值。使用常量的一个优点是它们使程序更容易理解。\n\
  \n在前面的三个语句中，常量的名称被大写了。这在 Java 中不是必需的，但在程序员中已成为区分常量和其他变量的标准惯例。\n\n## 关于操作符的所有知识\n\
  \n语句可以通过使用操作符`+`、`-`、`*`、`/`和`%`来使用数学表达式。你在整个 Java 程序中使用这些操作符来处理数字。\n\nJava 中的加法表达式使用`+`操作符，如下面的语句所示：\n\
  \n```java\ndouble weight = 205;\n\nweight = weight + 10;\n```\n\n第二条语句使用`+`操作符将`weight`变量设置为它的当前值加上\
  \ 10。减法表达式使用`-`操作符：\n\n```java\nweight = weight - 15;\n```\n\n此表达式将`weight`变量设置为它的当前值减去\
  \ 15。\n\n除法表达式使用`/`符号：\n\n```java\nweight = weight / 3;\n```\n\n这将`weight`变量设置为它的当前值除以\
  \ 3。\n\n\n\n\n\n## 寻找余数\n要找出除法表达式的余数，请使用 `%` 运算符（也称为取模运算符）。以下语句找出 245 除以 3 的余数：\n\
  ```\nint remainder = 245 % 3;\n```\n\n## 乘法表达式\n乘法表达式使用 `*` 符号。这里有一个在更复杂的语句中使用了乘法表达式的例子：\n\
  ```\nint total = 500 + (score * 12);\n```\n表达式中的 `score * 12` 部分将 `score` 乘以 12。完整的语句是将\
  \ `score` 乘以 12，然后在结果上加上 500。如果 `score` 等于 20，表达式的结果是 `total` 等于 740：`500 + (20\
  \ * 12)`。\n\n### 递增和递减变量\n程序中一个常见的任务是将变量的值改变一。你可以将值增加一，这称为递增变量；或者将值减少一，这称为递减变量。有相应的运算符来完成这两个任务。\n\
  \n要递增变量的值，使用 `++` 运算符，如以下语句所示：\n```\npower++;\n```\n该语句将 `power` 变量中存储的值加一。\n\n\
  要递减变量的值，使用 `--` 运算符：\n```\nrating--;\n```\n该语句将 `rating` 减少一。\n\n* * *\n\n**注意**\n\
  感到困惑了吗？如果你回想一下小学时学过的前缀知识，这比听起来要简单。就像前缀“sub-”或“un-”放在像 suburban 或 unexpected 这样的单词开头一样，前缀运算符放在变量名的开头。后缀运算符则放在末尾。\n\
  \n* * *\n\n你也可以将递增和递减运算符放在变量名的前面，如以下语句所示：\n```\n++power;\n--rating;\n```\n将运算符放在变量名前面称为前缀，放在名称后面称为后缀。\n\
  \n前缀和后缀运算符的区别在你在表达式中使用递增和递减运算符时变得重要。\n\n考虑以下语句：\n```\nint x = 3;\nint answer = x++\
  \ * 10;\n```\n这些语句处理后 `answer` 变量等于什么？你可能期望它等于 40——如果 3 先递增 1 变为 4，然后 4 乘以 10，这确实是正确的。\n\
  \n然而，`answer` 最终的值是 30，因为这里使用的是后缀运算符而不是前缀运算符。\n\n当变量在表达式中使用了后缀运算符时，变量的值在表达式被完全求值之前不会改变。语句\
  \ `int answer = x++ * 10` 做的事情与以下两个语句顺序相同：\n```\nint answer = x * 10;\nx++;\n```\n\
  前缀运算符的情况则相反。如果在表达式中使用了前缀运算符，变量的值会在表达式求值之前改变。\n\n考虑以下语句：\n```\nint x = 3;\nint answer\
  \ = ++x * 10;\n```\n这确实导致 `answer` 变量等于 40。前缀运算符导致 `x` 变量的值在表达式求值之前被改变。语句 `int answer\
  \ = ++x * 10` 做的事情与以下语句顺序相同：\n```\nx++;\nint answer = x * 10;\n```\n\n你很容易对 `++`\
  \ 和 `--` 运算符感到恼火，因为它们不像你在本书中遇到的许多其他概念那样直观。\n\n我不确定自己是否违反了 Java 程序员之间某种不成文的准则，但我得告诉你，你在自己的程序中不需要使用递增和递减运算符。你可以通过使用\
  \ `+` 和 `-` 运算符来达到相同的效果，像这样：\n```\nx = x + 1;\ny = y - 1;\n```\n\n* * *\n\n**注意**\n\
  回想一下 Hour 1，“成为一名程序员”中对 C++ 编程语言名称的描述，那是一个你后来才会理解的笑话。既然你已经认识了递增运算符 `++`，你就拥有了弄明白为什么\
  \ C++ 的名字有两个加号而不是一个的所有信息。因为 C++ 为 C 编程语言增加了新的特性和功能，它被认为是 C 的增量增加——因此得名 C++。\n\n\
  在你学完本书的全部 24 小时后，你也能够讲这种对世界上超过 99% 的人口来说难以理解的笑话了。\n\n* * *\n\n递增和递减是很有用的快捷方式，但在表达式中使用更长的写法也是完全可以的。\n\
  \n### 运算符优先级\n当你使用包含多个运算符的表达式时，你需要知道计算机在计算表达式时使用的顺序。考虑以下语句：\n```\nint y = 10;\n\
  x = y * 3 + 5;\n```\n除非你知道计算机在计算这些语句中的数学运算时使用的顺序，否则你无法确定 `x` 变量会被设置成什么值。它可能是 35\
  \ 或 80，这取决于 `y * 3` 先被计算还是 `3 + 5` 先被计算。\n\n计算表达式时使用以下顺序：\n**1.** 递增和递减首先执行。\n**2.**\
  \ 接着是乘法、除法和取模运算。\n**3.** 然后是加法和减法。\n**4.** 接下来是比较运算。\n**5.** 等号（`=`）用于设置变量的值。\n\n\
  因为乘法在加法之前进行，所以你可以回顾之前的例子并得出答案：`y` 首先乘以 3，得到 30，然后加上 5。`x` 变量被设置为 35。\n\n比较运算在 Hour\
  \ 7 中讨论。本小时已经描述了其他内容，所以你应该能够算出以下语句的结果：\n```\nint x = 5;\nint number = x++ * 6 +\
  \ 4 * 10 / 2;\n```\n这些语句将 `number` 变量设置为 50。\n\n计算机是如何得出这个总数的？首先，处理递增运算符，`x++` 将\
  \ `x` 变量的值设置为 `6`。但请注意，`++` 运算符在表达式中是作为 `x` 的后缀。这意味着表达式在求值时使用的是 `x` 的原始值。\n\n因为在变量递增之前使用了\
  \ `x` 的原始值，所以表达式变为：\n```\nint number = 5 * 6 + 4 * 10 / 2;\n```\n现在，乘法和除法从左到右进行。首先，5\
  \ 乘以 6，4 乘以 10，然后结果除以 2（4 * 10 / 2）。表达式变为：\n```\nint number = 30 + 20;\n```\n这个表达式导致\
  \ `number` 变量被设置为 50。\n\n如果你想以不同的顺序计算表达式，可以使用圆括号来将应该首先处理的部分分组。例如，表达式 `x = 5 * 3\
  \ + 2;` 通常会导致 `x` 等于 17，因为乘法在加法之前处理。但是，看这个表达式的修改形式：\n```\nx = 5 * (3 + 2);\n```\n\
  在这种情况下，括号内的表达式首先被处理，所以结果等于 25。你可以在语句中根据需要多次使用圆括号。\n\n### 使用表达式\n当你在学校里处理一个特别讨厌的数学问题时，你是否曾向更高力量抱怨过，抗议你在生活中永远不会用到这些知识？很遗憾地告诉你，你的老师是对的——你的数学技能在计算机编程中派上了用场。这是坏消息。\n\
  \n好消息是，计算机会处理你要求它做的任何数学运算。表达式在你的计算机程序中经常被用来完成诸如以下任务：\n- 更改变量的值\n- 计算程序中某事发生的次数\n\
  - 在程序中使用数学公式\n\n\n\n\n## 基本表达式\n\n编写计算机程序时，你会发现自己在使用表达式时会用到以前的数学课程知识。表达式可以使用加法、减法、乘法、除法和取模运算。\n\
  \n为了看看表达式的实际效果，请返回到 NetBeans 并创建一个新的 Java 文件，类名为 `PlanetWeight`。这个程序跟踪一个人在太阳系其他天体间旅行时的体重增减。在源代码编辑器中输入\
  \ 清单 5.2 的全部内容。程序的各个部分将依次讨论。\n\n**清单 5.2 `PlanetWeight` 程序**\n\n点击此处查看代码图片\n\n---\n\
  \n```java\n1: package com.java24hours;\n2:\n3: class PlanetWeight {\n4:     public\
  \ static void main(String[] arguments) {\n5:         System.out.print(\"Your weight\
  \ on Earth is \");\n6:         double weight = 178;\n7:         System.out.println(weight);\n\
  8:\n9:         System.out.print(\"Your weight on Mercury is \");\n10:         double\
  \ mercury = weight * .378;\n11:         System.out.println(mercury);\n12:\n13: \
  \        System.out.print(\"Your weight on the Moon is \");\n14:         double\
  \ moon = weight * .166;\n15:         System.out.println(moon);\n16:\n17:       \
  \  System.out.print(\"Your weight on Jupiter is \");\n18:         double jupiter\
  \ = weight * 2.364;\n19:         System.out.println(jupiter);\n20:     }\n21: }\n\
  ```\n\n---\n\n完成后，保存文件，它应该会自动编译。使用菜单命令 `Run`, `Run File` 运行程序。输出如 图 5.1 所示。\n\n\
  ![Image](img/image00492.jpeg)\n\n**图 5.1** `PlanetWeight` 程序的输出。\n\n与你创建的其他程序一样，`PlanetWeight`\
  \ 程序使用一个 `main()` 块语句来完成所有工作。这个语句可以分解为以下四个部分：\n\n**1.** 第 5–7 行：将人的初始体重设置为 178。\n\
  \n**2.** 第 9–11 行：计算在水星上的体重减轻。\n\n**3.** 第 13–15 行：确定在月球上的体重减轻。\n\n**4.** 第 17–19\
  \ 行：计算在木星上的体重增加。\n\n---\n\n**注意**\n\n在这个示例值中，`PlanetWeight` 应用程序使用了 178 磅的体重，这根据\
  \ BMC Health Study 刚好是北美人的平均体重。相比之下，大洋洲人平均为 164 磅，欧洲人 156 磅，拉丁美洲人 150 磅，非洲人 134\
  \ 磅，亚洲人 127 磅。\n\n所以，如果你在北美读到这里，有人问你，“需要来一份苹果派吗？”对这个问题的正确回答是“不”。\n\n---\n\n第 6 行创建了\
  \ `weight` 变量，并将其指定为一个大的浮点变量 `double`。该变量被赋予初始值 178，并在整个程序中用于监控该人的体重。\n\n下一行与程序中的其他几个语句类似：\n\
  \n`System.out.println(weight);`\n\n`System.out.println()` 命令显示包含在其括号内的一个字符串。在第 5\
  \ 行，`System.out.print()` 命令显示了文本 \"Your weight on Earth is\"。程序中有多个 `System.out.print()`\
  \ 和 `System.out.println()` 语句。\n\n它们的区别在于 `print()` 在显示文本后不开始新行，而 `println()` 会。\n\
  \n### 总结\n\n既然你已经了解了变量和表达式，你就可以在程序中给计算机下达各种指令。\n\n凭借你在这个小时所培养的技能，你可以编写程序来完成与计算器许多相同的任务，轻松处理复杂的数学方程。\n\
  \n你也会了解到，去月球旅行是一个特别有效的减肥计划。\n\n数字只是可以在变量中存储的一种东西。你还可以存储字符、字符字符串，以及称为 `boolean` 变量的特殊\
  \ `true` 或 `false` 值。下一个小时将扩展你对 `String` 变量的知识，以及它们的存储和使用方式。\n\n### 实践\n\n#### 问答\n\
  \n**问：** Java 程序中的一行与一个语句是同一回事吗？\n\n**答：** 不是。本书中创建的程序将每个语句放在一行上，以使程序更容易理解；但这并不是必需的。\n\
  \nJava 编译器在编译程序时不考虑行、空格或其他格式问题。编译器只希望看到每个语句末尾的分号。下面这行在 Java 中可以正常工作：\n\n`int x =\
  \ 12; x = x + 1;`\n\n将多个语句放在一行会使程序在阅读其源代码时对人类更难理解。因此，不推荐这样做。\n\n**问：** 为什么变量名的第一个字母应该是小写，比如\
  \ `gameOver`？\n\n**答：** 这是一个命名约定，它从两个方面帮助你的编程。首先，它使变量在 Java 程序的其他元素中更容易被发现。其次，通过遵循一致的变量命名风格，你可以消除在程序多处使用变量时可能发生的错误。本书中使用的大小写风格是多年来大多数\
  \ Java 程序员采用的风格。\n\n**问：** 我能在 Java 中指定二进制值的整数吗？\n\n**答：** 可以，这是在最近版本的 Java 中引入的一个特性。在数字前加上字符\
  \ \"0b\"，并在其后跟上值的位。由于 1101 是数字 13 的二进制形式，以下语句将一个整数设置为 13：\n\n`int z = 0b0000_1101;`\n\
  \n下划线只是为了使数字更具可读性。Java 编译器会忽略它。\n\n十六进制值可以用以 \"0x\" 开头的数字表示，就像超级碗 0x30（西雅图海鹰队以 0x2B\
  \ 比 0x8 击败了丹佛野马队）一样。\n\n**问：** Larvets 到底是什么？\n\n**答：** Larvets 是本节提到的一种零食，由可食用的蠕虫制成，这些蠕虫被杀死、烘干，并与多力多滋薯片一样美味的调味料混合而成。你可以从邮购零售商\
