  \ 总结\n\n在本小时中，你有机会创建一个 Java 程序、向程序传递参数，并利用 Java 类库中的现有程序。\n\n接下来的几个小时将继续聚焦于应用程序，因为你作为\
  \ Java 程序员的经验将变得更加丰富。应用程序测试起来更快，因为它们不需要你做任何额外的工作来运行，不像其他类型的程序。\n\n本小时是讨论如何在 Java\
  \ 程序中使用对象的几个小时中的第一个。你将在第 10 小时“创建你的第一个对象”中再次回到这个主题。\n\n### 研讨会\n\n#### 问与答\n\n**问：**\
  \ 所有发送到 Java 应用程序的参数都必须是字符串吗？\n\n**答：** Java 在运行应用程序时将所有参数存储为字符串。当你想将其中一个参数用作整数或其他非字符串类型时，必须转换该值。你将在第\
  \ 11 小时“描述你的对象是什么样子”中学习如何做到这一点。\n\n**问：** 如果小应用程序在网页上运行，应用程序在所有其他地方运行，那么由 Java Web\
  \ Start 启动的 Java 程序是什么？\n\n**答：** Java Web Start 是一种从网络浏览器启动 Java 应用程序的方式。用户点击网页上的链接来运行程序，这比下载它、运行安装向导并像启动其他任何桌面软件一样启动它更容易。\n\
  \n尽管它们是从浏览器运行的，但 Java Web Start 程序是应用程序而不是小应用程序。该应用程序始终是最新的，因为每次运行时都通过网络从程序提供者那里检索。\n\
  \nGoogle Web Toolkit (GWT)，一套用于 Web 编程的开源工具集，可以将 Java 程序转换为 JavaScript，使其在网页浏览器中运行得更快、更可靠，而根本不需要\
  \ Java 虚拟机。\n\n**问：** 英国王位的继承线是否会在某个时候耗尽？\n\n**答：** 根据自 1701 年起实施的议会法律，英国君主必须是汉诺威的索菲亚公主（一位德国公主，该法律通过时她是王位的女继承人）的新教后裔。\n\
  \n索菲亚的后裔人数是有限的，所以总会有排在王室继承线最后的人。英国政府只列出了前 38 位，因此系谱学家们试图自行填补名单的其余部分。\n\n继承顺序的最后一位是卡琳·沃格尔，一位三十多岁的德国疼痛治疗师。系谱学家们经过耗时多年的详尽搜索后确定，截至\
  \ 2001 年，她排在第 4973 位。所以，如果排在她前面的所有人都退出竞争（比如，花更多时间学习 Java 编程），沃格尔将接管白金汉宫的抵押贷款，并成为卡琳一世女王陛下。\n\
  \n沃格尔是索菲亚的曾曾曾曾曾曾曾曾孙女。她告诉《华尔街日报》，成为君主“压力太大了”。\n\n随着威廉王子和凯特王妃的儿子乔治（更正式的称号是剑桥的乔治·亚历山大·路易斯王子殿下）的出生，沃格尔降至第\
  \ 4974 位。\n\n#### 测验\n\n通过回答以下问题，测试你对本小时所涵盖内容的理解。\n\n**1.** 哪种类型的 Java 程序可以由浏览器运行？\n\
  \n**A.** 小应用程序（Applets）\n\n**B.** 应用程序（Applications）\n\n**C.** 都不是\n\n**2.** JVM\
  \ 代表什么？\n\n**A.** Journal of Vacation Marketing\n\n**B.** Jacksonville Veterans\
  \ Memorial\n\n**C.** Java Virtual Machine\n\n**3.** 如果你因为向 Java 应用程序传递信息的方式而与某人发生争执，你在做什么？\n\
  \n**A.** 为字符串而挣扎（Struggling over strings）\n\n**B.** 为参数而争论（Arguing about arguments）\n\
  \n**C.** 为功能而争吵（Feudin’ for functionality）\n\n#### 答案\n\n**1. A.** 小应用程序作为网页的一部分运行，而应用程序在所有其他地方运行。\n\
  \n**2. A.**, **B.**, 或 **C.** 脑筋急转弯！首字母缩写代表所有三样东西，尽管 Java Virtual Machine 是你在接下来的\
  \ 20 小时中需要记住的那个。\n\n**3. B.** 应用程序以参数的形式接收信息。我们难道就不能好好相处吗？\n\n#### 活动\n\n如果你想应用你对应用程序的敏锐理解，建议进行以下活动：\n\
