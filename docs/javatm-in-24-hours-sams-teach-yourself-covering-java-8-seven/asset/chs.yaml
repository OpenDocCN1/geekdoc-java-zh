  \n### 运行应用程序\n\n在成功创建并编译 Java 类 `Spartacus.java` 后，你可以通过两种方式在 NetBeans 中运行它：\n\n\
  ![图像](img/image00476.jpeg) 从菜单中选择 `运行`, `运行文件`。\n\n![图像](img/image00476.jpeg) 在“项目”窗格中右键单击\
  \ `Spartacus.java` 并选择 `运行文件`。\n\n当你运行一个 Java 类时，其 `main()` 方法会被 Java 虚拟机调用。字符串\
  \ “I am Spartacus!” 将出现在“输出”窗格中，如 图 A.4 所示。\n\n![图像](img/image00571.jpeg)\n\n**图\
  \ A.4** Spartacus 应用程序的输出。\n\n一个 Java 类必须具有 `main()` 方法才能运行。如果你尝试运行一个缺少该方法的类，NetBeans\
  \ 将返回错误。\n\n当你查看完程序的输出后，通过单击窗格选项卡上的 X 关闭“输出”窗格。这使得源编辑器更大，在创建程序时会很方便。\n\n### 修复错误\n\
  \n现在 Spartacus 应用程序已经编写、编译并运行，是时候破坏一些东西，来体验当事情变得极其糟糕时 NetBeans 如何响应了。\n\n像任何程序员一样，你将有大量机会自己把事情搞砸，但这里请注意。\n\
  \n返回到源编辑器中的 `Spartacus.java`，并从调用 `System.out.println()` 的行（清单 A.1 中的第 17 行）末尾去掉分号。甚至在保存文件之前，NetBeans\
  \ 就会发现错误，并在该行的左侧显示一个红色警报图标（参见 图 A.5）。\n\n![图像](img/image00572.jpeg)\n\n**图 A.5**\
  \ 在源编辑器中标记错误。\n\n将鼠标悬停在警报图标上，可以看到一个对话框，描述了 NetBeans 认为它发现的错误。\n\nNetBeans 源编辑器可以识别你在编写\
  \ Java 程序时遇到的大多数常见编程错误和拼写错误。在错误被修复之前，检测到的错误会阻止文件被编译。\n\n将分号放回行尾。警报图标消失，你可以再次保存并运行该类。\n\
  \n这些基本功能是你创建和编译本书中 Java 程序所需的全部功能。\n\nNetBeans 的功能远不止此处描述的基本功能，但在深入研究 IDE 之前，你应该专注于学习\
  \ Java。将 NetBeans 仅用作一个简单的编程项目管理器和文本编辑器。编写类，标记错误，并确保你可以成功编译和运行每个项目。\n\n当你准备好了解更多关于\
  \ NetBeans 的知识时，开始页面提供了学习如何使用它的资源。Oracle 还在 [`netbeans.org/kb`](http://netbeans.org/kb)\
  \ 提供培训和文档资源。\n\n## 附录 B. 下一步去哪里：Java 资源\n\n读完本书后，你可能想知道在哪里可以提升你的 Java 编程技能。本附录列出了一些书籍、网站、互联网讨论组和其他资源，你可以用来扩展你的\
  \ Java 知识。\n\n### 其他值得考虑的书籍\n\nSams Publishing 和其他出版商提供了几本关于 Java 编程的实用书籍，包括一些延续本书涵盖内容的书籍。如果书店目前没有你要找的书，可以使用这些\
  \ ISBN 号码：\n\n![图像](img/image00476.jpeg) *Sams Teach Yourself Java in 21 Days*，作者\
  \ Rogers Cadenhead（我！我！我！），ISBN：0-672-33710-X。尽管本书前七章中的一些材料有重复，但它更深入地介绍了 Java，并添加了许多高级主题。如果你准备再投入\
  \ 504 小时学习 Java，这应该是一本合适的书。\n\n![图像](img/image00476.jpeg) *The Java EE 6 Tutorial:\
  \ Basic Concepts*，第四版，作者 Eric Jendrock 等人，ISBN 0-13708-185-5。本书介绍了 Java 企业版 (JEE)，这是\
  \ Java 类库的一种扩展形式，用于在大规模计算环境中的大型企业中使用。\n\n![图像](img/image00476.jpeg) *Java Phrasebook*，作者\
  \ Timothy R. Fisher，ISBN 0-67232-907-7。一个由专业程序员和 *Java Developer’s Journal* 撰稿人创建的、超过\
  \ 100 个代码片段的集合，可用于你自己的 Java 项目。\n\n![图像](img/image00476.jpeg) *Agile Java Development\
  \ with Spring, Hibernate and Eclipse*，作者 Anil Hemrajani，ISBN 0-672-32896-8。一本针对\
  \ Java 企业版的书，展示了如何使用 Spring 框架、Hibernate 库和 Eclipse IDE 来降低企业应用编程的复杂性。\n\n![图像](img/image00476.jpeg)\
  \ *Android Programming Unleashed*，作者 B.M. Harwani，ISBN 0-13-315175-1。一本针对 Android\
  \ 版本 4.0.3 (Ice Cream Sandwich) 和 4.1 (Jelly Bean) 的广泛编程教程，本书涵盖了用 Java 编写 Android\
  \ 应用程序的基础知识、应用设计的构建块、应用部署以及包括动画、使用 Google Maps 以及发送短信和电子邮件在内的高级主题。\n\n\n\n\n# 章节及其他材料\n\
  \nSams Publishing 出版的众多 Java 书籍的章节及其他材料已在 [www.informit.com](http://www.informit.com)\
  \ 上免费提供，这是一个与 Sams 合作打造的信息技术专业人士网站。\n\nSams Publishing 的网站 [www.informit.com/sams](http://www.informit.com/sams)\
  \ 是了解 Sams Publishing 以及 Pearson Technology Group 旗下其他出版品牌动态的好地方。\n\n## Oracle 官方\
  \ Java 站点\n\nOracle 的 Java 软件部门维护着三个令其语言的程序员和用户感兴趣的网站。\n\nOracle 面向 Java 开发者的技术网络发布于\
  \ [www.oracle.com/technetwork/java](http://www.oracle.com/technetwork/java)，是查找\
  \ Java 相关信息的首选。你可以下载新版本的 Java 开发工具包（JDK）以及其他编程资源，以及整个 Java 类库的文档。此外，这里还有一个错误数据库、用户组目录和支持论坛。\n\
  \nJava.net（[www.java.net](http://www.java.net)）是一个庞大的 Java 程序员社区。你可以在这里开始你自己的、专注于该语言的博客，创建新的开源项目并免费托管在该站点上，还可以与其他程序员协作。\n\
  \nJava.com（[www.java.com](http://www.java.com)）向消费者和非程序员推广该语言的优势。你可以从该站点下载 Java\
  \ 运行时环境，它使用户能够在自己的计算机上运行使用 Java 创建的程序。还有一个画廊，展示了当今 Java 正在应用的示例。\n\n### Java 类文档\n\
  \nOracle Java 站点上或许最有用的部分是 Java 类库中每个 `class`、`variable` 和 `method` 的文档。数千页内容免费在线提供，向你展示如何在程序中使用这些类。\n\
  \n要访问 Java 8 的类文档，请前往 [`download.java.net/jdk8/docs/api`](http://download.java.net/jdk8/docs/api)。\n\
  \n## 其他 Java 网站\n\n由于 Java 现象在很大程度上最初源于其在网页上的使用，因此有大量网站专注于 Java 和 Java 编程。\n\n###\
  \ 本书官方网站\n\n本书的官方网站是 [www.java24hours.com](http://www.java24hours.com)，其完整描述见 附录\
  \ C，“本书网站”。\n\n### 工作台\n\n我还发布了一个名为“工作台”的博客，内容涵盖 Java、互联网技术、计算机书籍以及类似主题和其他内容。你可以在\
  \ [`workbench.cadenhead.org`](http://workbench.cadenhead.org) 找到它。\n\n### Slashdot\n\
  \n技术新闻网站 Slashdot 自 1997 年以来一直是程序员和其他计算机行业专业人士的首选之地。该网站从用户提交的故事中精选最佳内容放在首页，并允许用户对评论进行排名，以便你过滤掉无关信息。要查看其最新的\
  \ Java 相关故事，请访问 [www.slashdot.org/tag/java](http://www.slashdot.org/tag/java)。\n\
  \n### 其他 Java 博客\n\n还有数百个其他博客涉及 Java 编程，无论是作为其主要焦点还是作为更广泛主题的一部分。搜索引擎 IceRocket 在\
  \ [www.icerocket.com](http://www.icerocket.com) 提供了一个标记列表，索引了最近撰写了关于 Java 内容的博客。\n\
  \nWordPress.com 是数千个博客的宿主，在 [`en.wordpress.com/tag/java`](http://en.wordpress.com/tag/java)\
  \ 按站点分类展示最新的 Java 相关帖子。\n\n### InformIT\n\n技术参考网站 InformIT 可在 [www.informit.com](http://www.informit.com)\
  \ 访问，它是本书出版商支持的一个综合性资源。该网站设有十多个与软件开发和互联网相关的主题板块。InformIT 的 Java 部分包括操作指南文章和初学者参考指南。\n\
  \n### Stack Overflow\n\n在线社区 Stack Overflow 是一个程序员可以提问并对其他用户提供的答案进行评分的地方。该网站使用标签系统，你可以将搜索范围缩小到感兴趣的语言或主题。要查看\
  \ Java 相关问题，请访问 [`stackoverflow.com/questions/tagged/java`](http://stackoverflow.com/questions/tagged/java)。\n\
  \n### *JavaWorld* 杂志\n\n`JavaWorld` 是一本自该语言诞生之初就存在的杂志，它经常发表教程文章以及 Java 开发新闻和其他专题内容。还有视频和音频播客。访问\
  \ [www.javaworld.com](http://www.javaworld.com)。\n\n### Developer.com 的 Java 目录\n\
  \n由于 Java 是一种面向对象的语言，因此在自己的程序中使用其他开发者创建的资源很容易。在开始任何重要的 Java 项目之前，你应该在网上搜索可能在你程序中使用的资源。\n\
  \n一个好的起点是 Developer.com 的 Java 目录。该站点在 [www.developer.com/java](http://www.developer.com/java)\
  \ 编录 Java 程序、编程资源和其他信息。\n\n### Twitter\n\n若想在一个更具互动性的地方寻求 Java 程序员的指导，可以尝试 Twitter。这个流行的微博客服务被数百万人用来向朋友和关注者发送短消息。\n\
  \n`#java` 标签标识与 Java 相关的消息——尽管有些可能指的是爪哇岛或咖啡，因为标签是非正式且由用户创建的。\n\n要在 Twitter 上搜索关于\
  \ Java 的最新消息，请在网页浏览器中加载 [`search.twitter.com`](http://search.twitter.com) 并搜索 `#java`。\n\
  \n## 工作机会\n\n如果你是那些将学习 Java 作为成为行业领袖计划一部分的人之一，本附录中列出的若干资源都设有专门的工作机会板块。查看一些可能获得的\
