  PrimeFinder frame = new PrimeFinder();\n```\n\n但是，由于没有再次引用该对象的必要，因此无需将其存储在变量中。调用\
  \ `new` 创建对象会导致程序运行。\n\n在 Java 中，一个良好的编程实践是仅在需要时才将对象存储在变量中。\n\n## 使用线程\n\n你可以通过调用其\
  \ `start()` 方法来启动一个线程，这可能会让你认为也存在一个 `stop()` 方法来使其停止。\n\n***\n\n**警告**\n\n最好留意这个弃用警告。Oracle\
