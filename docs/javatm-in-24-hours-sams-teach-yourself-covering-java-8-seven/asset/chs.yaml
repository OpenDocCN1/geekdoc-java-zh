  miss.\");\n63:         }\n64:     }\n65:\n66:     public static void main(String[]\
  \ arguments) {\n67:         new Battlepoint();\n68:     }\n69: }\n```\n\n***\n\n\
  `Battlepoint`应用程序中的注释描述了构造函数的每个部分以及程序中重要的条件逻辑。\n\n该应用程序创建三个`Point`对象作为目标，并将它们添加到一个数组中（第\
  \ 45-52 行）。然后显示一张包含这些目标的地图（第 22-43 行）。\n\n接着，通过调用`shoot(int, int)`方法（第 54-64 行）对三个点进行射击。每次射击后，应用程序都会报告是否击中了某个目标。如果击中，该目标将从数组列表中移除。\n\
  \n最后，再次显示地图，应用程序终止。\n\n输出结果如图 17.1 所示。\n\n![图片](img/image00532.jpeg)\n\n**图 17.1**\
  \ 将`Point`对象放入数组列表并对其射击。\n\n图 17.1 的上方地图显示了三个目标。一个目标被击中后被移除。输出的下方地图反映了这一变化。\n\n\
  当一个目标被射击击中时，会通过调用`remove(Object)`方法，以该射击的点为参数，将其从`targets`数组列表中移除。\n\n***\n\n**注意**\n\
  \n在`Battlepoint`应用程序的`shoot()`方法中，将从数组列表中移除的`Point`对象是代表射击的点。它与被击中目标的(x,y)坐标相同。\n\
  \n***\n\n### 哈希映射\n\n在编程中，使用一条信息来访问另一条信息的能力很常见。在数据结构中，数组列表是最简单的例子，可以通过索引号从列表中检索一个对象。这里有一个例子，从`aristocrats`数组列表中获取第一个字符串：\n\
  \n点击此处查看代码图像\n\n```\nString first = aristocrats.get(0);\n```\n\n数组也使用索引号来检索数组中的每个元素。\n\
  \n哈希映射是 Java 中一种使用一个对象来检索另一个对象的数据结构。第一个对象是键，第二个是值。它们被实现为`java.util`包中的`HashMap`类。\n\
  \n该名称指的是键如何被映射到值。这类结构化数据的一个例子是电话簿。一个人的姓名（字符串）可以用来检索该人的电话号码。\n\n可以通过调用其无参数构造函数来创建一个哈希映射：\n\
  \n点击此处查看代码图像\n\n```\nHashMap phonebook = new HashMap();\n```\n\n***\n\n**注意**\n\n\
  就像数组列表有一个名为`Vector`的类以更占用资源的方式做同样的事情一样，哈希映射也有`Hashtable`。哈希表是同步的，而哈希映射不是，因此任何使用哈希表的类运行时间都会更长。通常更推荐使用哈希映射。\n\
  \n***\n\n在新的哈希映射中可以指定两件事来控制其效率：初始容量和负载因子。它们按此顺序用两个参数设置：\n\n点击此处查看代码图像\n\n```\nHashMap\
  \ phonebook = new HashMap(30, 0.7F);\n```\n\n容量是哈希映射值可以存储的桶的数量。负载因子是在容量自动增加之前可以使用的桶的数量。该值是一个从\
  \ 0（空）到 1.0（满）的浮点数，因此 0.7 意味着当桶被使用了 70%时，容量会增加。默认容量为 16，负载因子为 0.75，这通常已足够。\n\n应使用泛型来指定键和值的类。它们放在`<`和`>`字符内，类名用逗号分隔，如下例所示：\n\
  \n点击此处查看代码图像\n\n```\nHashMap<String, Long> phonebook = new HashMap<>();\n```\n\n\
  ***\n\n**注意**\n\n这些语句将使用`long`值在哈希映射中存放`Long`对象。在早期 Java 版本中，这将是一个错误，因为基本数据类型（如`long`）不能用于需要对象的地方。\n\
  \n但由于自动装箱和拆箱（Java 的一项特性，可自动在基本类型及其等效对象类之间转换），这不再是一个错误。当 Java 编译器看到像 8002888372 这样的`long`值时，会将其转换为对应值的`Long`对象。\n\
  \n***\n\n这将创建一个名为`phonebook`的哈希映射，其键为字符串，值为`Long`对象。第二组`<`和`>`字符是空的，它假定与该语句中前一组`<`和`>`中的类相同。\n\
  \n对象通过调用哈希映射的`put(Object, Object)`方法并传入两个参数来存储：键和值：\n\n点击此处查看代码图像\n\n```\nphonebook.put(\"\
  Butterball Turkey Line\", 8002888372);\n```\n\n这将在映射中存储一个条目，其键为“Butterball Turkey\
  \ Line”，值为`8002888372`的`Long`对象，即该服务的电话号码。\n\n可以通过调用`get(Object)`并以键作为唯一参数来从映射中检索对象：\n\
  \n点击此处查看代码图像\n\n```\nint number = phonebook.get(\"Butterball Turkey Line\");\n```\n\
  \n\n\n\n`get()` 方法在未找到匹配键的值时返回 `null`。这会在前面的示例中导致问题，因为 `null` 不是一个合适的 `long` 值。\n\
  \n处理这个潜在问题的另一种方法是调用 `getOrDefault(Object, Object)`。如果作为第一个参数指定的键未找到，则默认返回第二个参数，如以下语句所示：\n\
  \nClick here to view code image\n\n```\nint number = phonebook.getOrDefault(\"Betty\
  \ Crocker\", -1);\n```\n\n如果在映射中找到与键“Betty Crocker”匹配的数字，则返回该数字。否则，返回 -1。\n\n有两种方法可以指示映射中是否存在键或值：`containsKey(Object)`\
  \ 和 `containsValue(Object)`。它们返回一个布尔值，为 `true` 或 `false`。\n\n哈希映射与数组列表一样，有一个 `size()`\
  \ 方法，用于指示数据结构中的项目数量。\n\n遍历映射可以通过使用条目集（映射中所有条目的集合）来完成。`entrySet()` 方法将这些条目作为一个 `Set`\
  \ 对象返回（使用 `java.util` 中的 `Set` 接口）。\n\n集合中的每一项都由 `Map.Entry` 表示，这是 `java.util` 中\
  \ `Map` 类的一个内部类。当你有一个 `Entry` 对象时，可以调用其 `getKey()` 方法检索键，调用 `getValue()` 检索值。\n\n\
  以下 `for` 循环使用条目集和条目来访问 `phonebook` 哈希映射中的所有键和值：\n\nClick here to view code image\n\
  \n```\nfor (Map.Entry<String, Font> entry : map.entrySet()) {\n    String key =\
  \ entry.getKey();\n    Font value = entry.getValue();\n    // ...\n}\n```\n\n`FontMapper`\
  \ 项目将所有这些组合在一起，使用哈希映射管理字体集合。\n\n`java.awt` 包中的 `Font` 类用于创建字体，并在图形用户界面中使用它们来显示文本。字体包括字体名称、磅数以及它是常规、粗体还是斜体样式。\n\
  \n哈希映射可以包含任何类的对象。在 NetBeans 中，在 `com.java24hours` 包中创建一个名为 `FontMapper` 的 Java 文件。将\
  \ Listing 17.2 中的内容输入到文件中并保存。\n\n**LISTING 17.2** `FontMapper.java` 的完整文本\n\nClick\
  \ here to view code image\n\n```\n1: package com.java24hours;\n2: \n3: import java.awt.*;\n\
  4: import java.util.*;\n5: \n6: public class FontMapper {\n7:     public FontMapper()\
  \ {\n8:         Font courier = new Font(\"Courier New\", Font.PLAIN, 6);\n9:   \
  \      Font times = new Font(\"Times New Roman\", Font.BOLD, 12);\n10:        Font\
  \ verdana = new Font(\"Verdana\", Font.ITALIC, 25);\n11:        HashMap<String,\
  \ Font> fonts = new HashMap<>();\n12:        fonts.put(\"smallprint\", courier);\n\
  13:        fonts.put(\"body\", times);\n14:        fonts.put(\"headline\", verdana);\n\
  15:        for (Map.Entry<String, Font> entry : fonts.entrySet()) {\n16:       \
  \     String key = entry.getKey();\n17:            Font value = entry.getValue();\n\
  18:            System.out.println(key + \": \" + value.getSize() + \"-pt \"\n19:\
  \                + value.getFontName());\n20:        }\n21:    }\n22: \n23:    public\
  \ static void main(String[] arguments) {\n24:        new FontMapper();\n25:    }\n\
  26: }\n```\n\n`FontMapper` 应用程序在第 8-10 行创建了三个 `Font` 对象，然后在第 12-14 行将它们添加到名为 `fonts`\
  \ 的哈希映射中。它们使用描述字体用途的字符串键存储在映射中：“smallprint”、“body” 和 “headline”。\n\n第 15-20 行的 `for`\
  \ 循环使用条目集和集合中的每个条目遍历哈希映射。\n\n应用程序的输出显示在 Figure 17.2。\n\n![Image](img/image00533.jpeg)\n\
  \n**FIGURE 17.2** 在哈希映射中存储 `Font` 对象。\n\n### 总结\n\n数组列表和哈希映射是 `java.util` 包中最有用的两种数据结构。数组列表类扩展了数组的功能，使得克服该数据类型的固定大小限制成为可能。哈希映射允许使用任何类型的对象作为键来检索值。\n\
  \n还有位集（`BitSet` 类），用于保存 0 和 1 位值；栈（`Stack`），类似于数组列表的后进先出数据集合；以及属性（`Properties`），一种特殊的哈希映射，用于在文件或其他永久存储位置保存程序的配置属性。\n\
  \n### 练习室\n\n#### 问与答\n\n**问：** 当一个类是同步的意味着什么？\n\n**答：** 同步是 Java 虚拟机确保对象的实例变量和方法被对象的其他用户以一致和准确的方式访问的机制。\n\
  \n当你在 Hour 19 “创建线程程序”中学习线程时，这个概念会更有意义。Java 程序可以被设计成同时执行多个任务。每个任务都放在自己的线程中。\n\n\
  当多个线程访问同一个对象时，对象在每个线程中表现相同至关重要。因此，当类的方法需要同步（如向量和哈希表）时，Java 虚拟机必须更努力地工作，并且可能遇到可能导致线程停止运行的错误。\n\
  \n这就是为什么数组列表和哈希映射复制了向量和哈希表的功能。需要不需要同步并且因此运行更高效的数据结构。\n\n**问：** 华盛顿将军队曾经击败过哈林环球旅行者队吗？\n\
  \n**答：** 将军队在几十年间曾七次击败旅行者队，最近一次是在 1971 年。在田纳西州马丁市比赛，将军队以 100-99 获胜，投篮来自球队老板路易斯“红”克洛茨。\n\
  \n尽管将军队今天以输家闻名，但他们于 1921 年作为费城斯法斯队（一个合法的球队）开始，在东部和美国篮球联赛中打球。斯法斯——南费城犹太人协会的缩写——赢得了\
  \ 10 个冠军。克洛茨是前斯法斯队球员，他买下了球队，并于 1952 年更名为将军队，当时他们成为哈林著名球队的永久巡回伙伴。\n\n1971 年的胜利结束了旅行者队\
  \ 2495 场的连胜纪录。\n\n#### 测验\n\n以下问题测试你对数据结构的知识掌握程度。\n\n**1.** 以下哪项在创建后不能增长或缩小大小？\n\
  \n**A.** 数组列表\n\n**B.** 数组\n\n**C.** 哈希映射\n\n**2.** 用于查找数组列表或哈希映射中有多少个项目的方法的名称是什么？\n\
  \n**A.** `length()`\n\n**B.** `size()`\n\n**C.** `count()`\n\n**3.** 哈希映射中可以用作键的数据类型或类是什么？\n\
  \n**A.** `int` 或 `Integer`\n\n**B.** `String`\n\n**C.** 任何类的对象\n\n#### 答案\n\n**1.\
  \ B.** 数组的大小在创建时确定且无法更改。数组列表和哈希映射根据需要更改大小。\n\n**2. B.** `size()` 方法指示该数据结构中当前的项目数量。\n\
  \n**3. A、B 或 C。** 哈希映射可以使用任何类作为键和任何类作为值。\n\n#### 实践活动\n\n你可以通过以下活动应用你良好的结构化编程知识：\n\
  \n![Image](img/image00476.jpeg) 编写一个程序，使用本小时介绍的一种数据结构来管理公司电子邮件地址列表，其中每个电子邮件地址与该人的姓名相关联。\n\
  \n![Image](img/image00476.jpeg) 扩展 `FontMapper` 程序，将新字体的名称、大小和样式作为命令行参数，并在显示其键和值之前将其添加到哈希映射中。\n\
  \n\n\n\n要查看实现这些活动的 Java 程序，请访问本书网站[www.java24hours.com](http://www.java24hours.com)。\n\
  \n# 第 18 小时 处理程序中的错误\n\n本小时待办事项：\n\n![Image](img/image00474.jpeg) 了解为何错误被称为异常。\n\
  ![Image](img/image00474.jpeg) 在 Java 程序中响应异常。\n![Image](img/image00474.jpeg) 创建忽略异常的方法。\n\
  ![Image](img/image00474.jpeg) 使用会引发异常的方法。\n![Image](img/image00474.jpeg) 创建你自己的异常。\n\
  \n错误——那些阻止程序正确运行的缺陷、疏忽和笔误——是软件开发过程中自然的一部分。“自然”可能是用来描述它们最温和的词语。在我自己的编程经历中，当我找不到一个难以捉摸的错误的原因时，我会使用连副总统乔·拜登听了都会脸红的词语。\n\
  \n有些错误会被编译器标记出来，阻止你创建类。另一些错误则由解释器在发现某个问题导致其无法成功运行时记录下来。Java 将错误分为两类：\n\n![Image](img/image00476.jpeg)\
  \ 异常（Exceptions）—— 在程序运行时发生的、表示出现了异常情况的事件。\n![Image](img/image00476.jpeg) 错误（Errors）——\
  \ 表示解释器遇到问题的事件，这些问题可能与你的程序无关。\n\n错误通常不是 Java 程序能够从中恢复的，因此它们不是本小时的重点。你可能在使用 Java\
  \ 程序时遇到过`OutOfMemoryError`。一旦发生这类错误，在 Java 程序中无法采取任何措施来处理。程序会带着错误退出。\n\n异常通常可以被处理，从而使程序继续正常运行。\n\
  \n## 异常\n\n尽管你现在才开始学习它们，但你可能在前 17 个小时中已经对异常非常熟悉了。当你编写一个编译成功但在运行时遇到问题的 Java 程序时，就会出现这些错误。\n\
  \n例如，一个常见的编程错误是引用数组中不存在的元素，如以下语句所示：\n\n点击此处查看代码图片\n\n```java\nString[] greek = {\
  \ \"Alpha\", \"Beta\", \"Gamma\" };\n\nSystem.out.println(greek[3]);\n```\n\n`String`数组`greek`有三个元素。因为数组的第一个元素编号为\
  \ 0 而不是 1，所以第一个元素是`greek[0]`，第二个是`greek[1]`，第三个是`greek[2]`。因此，尝试显示`greek[3]`的语句是错误的。前面的语句编译成功，但当你运行程序时，Java\
  \ 虚拟机会停止并显示类似以下的消息：\n\n**输出**\n\n点击此处查看代码图片\n\n```\nException in thread \"main\"\
  \ java.lang.ArrayIndexOutOfBoundsException: 3\n\n    at SampleProgram.main(SampleProgram.java:4)\n\
  ```\n\n此消息表明应用程序生成了一个异常，Java 虚拟机通过显示错误消息并停止程序来记录它。\n\n错误消息引用了`java.lang`包中一个名为`ArrayIndexOutOfBoundsException`的类。这个类是一个异常，代表一个在\
  \ Java 程序中发生的异常情况。\n\n当 Java 类遇到异常时，它会向该类的使用者发出错误警报。在这个例子中，类的使用者是 Java 虚拟机。\n\n\
  所有异常都是`java.lang`包中`Exception`类的子类。`ArrayIndexOutOfBoundsException`正如你所料——它报告数组元素的访问超出了数组的边界。\n\
  \nJava 中有数百种异常。许多异常，如数组异常，表明可以通过修改编程来修复的问题。这些异常类似于编译器错误——一旦你修正了问题，就无需再担心这些异常了。\n\
  \n* * *\n\n注意\n\n有两个术语用来描述这个过程：抛出（throw）和捕获（catch）。对象抛出异常以提醒其他对象异常已经发生。这些异常会被其他对象或\
  \ Java 虚拟机捕获。\n\n* * *\n\n其他异常必须在每次程序运行时通过使用五个新关键字来处理：`try`、`catch`、`finally`、`throw`和`throws`。\n\
  \n### 在 try-catch 块中捕获异常\n\n到目前为止，你处理异常的方法是修复导致它们的问题。有时你无法以这种方式处理异常，必须在 Java 类内部处理该问题。\n\
  \n为了介绍为何这很有用，请在一个名为`Calculator`的新 Java 文件中输入清单 18.1 中的简短 Java 应用程序，并保存该文件。\n\n清单\
  \ 18.1 `Calculator.java`的完整内容\n\n点击此处查看代码图片\n\n* * *\n\n```java\n 1: package com.java24hours;\n\
  \ 2:\n 3: public class Calculator {\n 4:     public static void main(String[] arguments)\
  \ {\n 5:         float sum = 0;\n 6:         for (String argument : arguments) {\n\
  \ 7:             sum = sum + Float.parseFloat(argument);\n 8:         }\n 9:   \
  \      System.out.println(\"Those numbers add up to \" + sum);\n10:     }\n11: }\n\
  ```\n\n* * *\n\n`Calculator`应用程序接受一个或多个数字作为命令行参数，将它们相加并显示总和。\n\n因为在 Java 应用程序中，所有命令行参数都表示为字符串，所以程序在相加之前必须将它们转换为浮点数。第\
  \ 7 行的类方法`Float.parseFloat()`负责此操作，将转换后的数字添加到名为`sum`的变量中。\n\n在运行应用程序之前，请使用命令“运行”\
  \ -> “设置项目配置” -> “自定义”在 NetBeans 中设置以下命令行参数：`7 4 8 1 4 1 4`。选择“运行” -> “运行主项目”来运行应用程序，你应该会看到图\
  \ 18.1 中的输出。\n\n![Image](img/image00534.jpeg)\n\n**图 18.1** `Calculator`应用程序的输出。\n\
  \n多次运行程序，使用不同的数字作为参数。它应该能成功处理它们，这可能会让你想知道这个项目与异常有什么关系。\n\n为了看到关联性，将`Calculator`应用程序的命令行参数更改为`1\
  \ 3 5x`。\n\n第三个参数包含一个笔误——数字 5 后面不应该有`x`。`Calculator`应用程序无法知道这是一个错误，因此它尝试将`5x`与其他数字相加，导致显示以下异常：\n\
  \n**输出**\n\n点击此处查看代码图片\n\n```\nException in thread \"main\" java.lang.NumberFormatException:\
  \ For input\n\nstring: \"5x\" at sun.misc.FloatingDecimal.readJavaFormatString\n\
  \n(FloatingDecimal.java:1241)\n\n    at java.lang.Float.parseFloat(Float.java:452)\n\
  \n    at Calculator.main(Calculator.java:7)\n\nJava Result: 1\n```\n\n这个消息对程序员来说可能包含信息，但不是你希望用户看到的。最好是隐藏错误消息并在程序内部处理问题。\n\
  \nJava 程序可以使用`try`-`catch`块语句来处理自己的异常，其形式如下：\n\n点击此处查看代码图片\n\n```java\ntry {\n\n\
  \    // 可能导致异常的语句\n\n} catch (Exception e) {\n\n   // 异常发生时执行的操作\n\n}\n```\n\n任何你希望类的方法处理的异常都必须使用`try`-`catch`块。`catch`语句中出现的`Exception`对象应该是以下三种情况之一：\n\
  \n![Image](img/image00476.jpeg) 可能发生的异常的类。\n![Image](img/image00476.jpeg) 多种异常的类，用管道符`|`分隔。\n\
  ![Image](img/image00476.jpeg) 可能发生的几种不同异常的超类。\n\n\n\n\n\n# 异常处理\n\n`try`-`catch`\
  \ 代码块的 `try` 部分包含可能抛出异常的语句（或语句集）。在 `Calculator` 应用程序中，清单 18.1 第 7 行对 `Float.parseFloat(String)`\
  \ 方法的调用，只要使用无法转换为浮点值的字符串参数，就会抛出 `NumberFormatException`。\n\n为了改进 `Calculator` 应用程序，使其不会因这类错误而停止运行，你可以使用\
  \ `try`-`catch` 代码块。\n\n创建一个名为 `NewCalculator` 的新 Java 文件，并输入 清单 18.2 的文本。\n\n###\
  \ 清单 18.2 `NewCalculator.java` 的完整文本\n\n点击此处查看代码图像\n\n```java\n 1: package com.java24hours;\n\
  \ 2:\n 3: public class NewCalculator {\n 4:     public static void main(String[]\
  \ arguments) {\n 5:         float sum = 0;\n 6:         for (String argument : arguments)\
  \ {\n 7:             try {\n 8:                 sum = sum + Float.parseFloat(argument);\n\
  \ 9:             } catch (NumberFormatException e) {\n10:                 System.out.println(argument\
  \ + \" is not a number.\");\n11:             }\n12:         }\n13:        System.out.println(\"\
  Those numbers add up to \" + sum);\n14:     }\n15: }\n```\n\n保存应用程序后，自定义项目配置，并使用命令行参数\
  \ `1 3 5x` 运行 `com.java24hours.NewCalculator`。你应该会看到 图 18.2 所示的输出。\n\n![Image](img/image00535.jpeg)\n\
  \n**图 18.2** `NewCalculator` 应用程序的输出。\n\n第 7–11 行的 `try`-`catch` 代码块处理由 `Float.parseFloat()`\
  \ 抛出的 `NumberFormatException` 错误。这些异常在 `NewCalculator` 类内部被捕获，该类会对任何不是数字的参数显示错误消息。因为异常在类内部得到处理，Java\
  \ 解释器不会显示错误。你通常可以通过使用 `try`-`catch` 代码块来处理与用户输入和其他意外数据相关的问题。\n\n### 捕获多个不同的异常\n\n\
  `try`-`catch` 代码块可用于处理多种不同类型的异常，即使它们由不同的语句抛出。\n\n处理多个异常类的一种方法是为每个异常类专门设置一个 `catch`\
  \ 代码块，如以下代码所示：\n\n点击此处查看代码图像\n\n```java\nString textValue = \"35\";\n\nint value;\n\
  \ntry {\n    value = Integer.parseInt(textValue);\n} catch (NumberFormatException\
  \ exc) {\n    // 处理异常的代码\n} catch (ArithmeticException exc) {\n    // 处理异常的代码\n\
  }\n```\n\n你也可以在同一个 `catch` 代码块中处理多个异常，只需用管道符 `|` 分隔它们，并在列表末尾为异常变量命名。例如：\n\n点击此处查看代码图像\n\
  \n```java\ntry {\n    value = Integer.parseInt(textValue);\n} catch (NumberFormatException\
  \ | ArithmeticException exc) {\n    // 处理异常的代码\n}\n```\n\n如果捕获到 `NumberFormatException`\
  \ 或 `ArithmeticException`，它将被赋值给 `exc` 变量。\n\n清单 18.3 包含一个名为 `NumberDivider` 的应用程序，它接受两个整数命令行参数并在除法表达式中使用它们。\n\
  \n此应用程序必须能够处理用户输入中的两个潜在问题：\n\n![Image](img/image00476.jpeg) 非数字参数\n![Image](img/image00476.jpeg)\
  \ 除以零\n\n为 `NumberDivider` 创建一个新的 Java 文件，并将 清单 18.3 的文本输入到源代码编辑器中。\n\n### 清单 18.3\
  \ `NumberDivider.java` 的完整文本\n\n点击此处查看代码图像\n\n```java\n 1: package com.java24hours;\n\
  \ 2:\n 3: public class NumberDivider {\n 4:     public static void main(String[]\
  \ arguments) {\n 5:         if (arguments.length == 2) {\n 6:             int result\
  \ = 0;\n 7:             try {\n 8:                 result = Integer.parseInt(arguments[0])\
  \ /\n 9:                     Integer.parseInt(arguments[1]);\n10:              \
  \   System.out.println(arguments[0] + \" divided by \" +\n11:                  \
  \   arguments[1] + \" equals \" + result);\n12:             } catch (NumberFormatException\
  \ e) {\n13:                 System.out.println(\"Both arguments must be numbers.\"\
  );\n14:             } catch (ArithmeticException e) {\n15:                 System.out.println(\"\
  You cannot divide by zero.\");\n16:             }\n17:         }\n18:     }\n19:\
  \ }\n```\n\n使用命令行参数指定两个参数，你可以用整数、浮点数和非数字参数来运行它。\n\n第 5 行的 `if` 语句用于确保向应用程序发送了两个参数。如果没有，程序将退出而不显示任何内容。\n\
  \n`NumberDivider` 应用程序执行整数除法，因此结果是整数。在整数除法中，5 除以 2 等于 2，而不是 2.5。\n\n如果使用浮点数或非数字参数，第\
  \ 8–9 行会抛出 `NumberFormatException`，并由第 14–15 行捕获。\n\n如果使用整数作为第一个参数，零作为第二个参数，第 8–9\
  \ 行会抛出 `ArithmeticException`，并由第 14–15 行捕获。\n\n程序成功运行的一些示例输出如 图 18.3 所示。\n\n![Image](img/image00536.jpeg)\n\
  \n**图 18.3** `NumberDivider` 应用程序的输出。\n\n### 异常处理后执行操作\n\n当你使用 `try` 和 `catch` 处理多个异常时，有时你希望程序无论是否发生异常都在代码块结束时执行一些操作。\n\
  \n你可以通过使用 `try`-`catch`-`finally` 代码块来处理，其形式如下：\n\n点击此处查看代码图像\n\n```java\ntry {\n\
  \    // 可能导致异常的语句\n} catch (Exception e) {\n   // 异常发生时应执行的操作\n} finally {\n   \
  \ // 无论如何都要执行的语句\n}\n```\n\n`finally` 部分中的语句或语句集在代码块中的所有其他内容之后执行，即使发生了异常。\n\n这在一个从磁盘文件读取数据的程序中很有用，你将在\
  \ 第 21 小时 “读写文件” 中进行。在访问数据时，有几种方式可能发生异常：文件可能不存在、可能发生磁盘错误等等。如果读取磁盘的语句在 `try` 部分，错误在\
  \ `catch` 部分处理，那么你可以在 `finally` 部分关闭文件。这确保了无论读取时是否抛出异常，文件都会被关闭。\n\n### 抛出异常\n\n\
  当你调用另一个类的方法时，该类可以通过抛出异常来控制方法的使用方式。\n\n当你使用 Java 类库中的类时，编译器通常会显示如下消息：\n\n**输出**\n\
  \n点击此处查看代码图像\n\n```\nNetReader.java:14: unreported exception java.net.MalformedURLException;\n\
  must be caught or declared to be thrown\n```\n\n每当你看到错误提示某个异常“必须被捕获或声明抛出”时，这表明你正在尝试使用的方法会抛出异常。\n\
  \n任何调用这些方法的类，例如你编写的应用程序，必须执行以下操作之一：\n\n![Image](img/image00476.jpeg) 使用 `try`-`catch`\
  \ 代码块处理异常\n![Image](img/image00476.jpeg) 抛出该异常\n![Image](img/image00476.jpeg) 使用\
  \ `try`-`catch` 代码块处理异常，然后抛出它\n\n到目前为止，你已经了解了如何处理异常。如果你想在处理后抛出异常，可以使用 `throw` 语句，后跟要抛出的异常对象。\n\
  \n\n\n\n### 抛出和捕获异常\n\n以下语句在 `catch` 块中处理 `NumberFormatException` 错误，然后抛出该异常：\n\n\
  点击此处查看代码图片\n\n```java\nfloat principal;\n\ntry {\n    principal = Float.parseFloat(loanText)\
  \ * 1.1F;\n} catch (NumberFormatException e) {\n    System.out.println(arguments[0]\
  \ + \" is not a number.\");\n    throw e;\n}\n```\n\n这段改写后的代码处理了 `try` 块中可能生成的所有异常，并将它们抛出：\n\
  \n点击此处查看代码图片\n\n```java\nfloat principal;\n\ntry {\n    principal = Float.parseFloat(loanText)\
  \ * 1.1F;\n} catch (Exception e) {\n    System.out.println(\"Error \" + e.getMessage());\n\
  \    throw e;\n}\n```\n\n`Exception` 是所有异常子类的父类。一个 `catch` 语句会捕获该类以及类层次结构中位于其下的任何子类。\n\
  \n当你使用 `throw` 抛出异常时，通常意味着你尚未完成处理该异常所需的所有工作。\n\n一个可能有用的场景示例：考虑一个名为 `CreditCardChecker`\
  \ 的假想程序，这是一个验证信用卡购买的应用程序。该应用程序使用一个名为 `CheckDatabase` 的类，该类的工作如下：\n\n1.  连接到信用卡发卡方的计算机。\n\
  2.  询问该计算机客户的信用卡号是否有效。\n3.  询问该计算机客户是否有足够的信用额度进行购买。\n\n当 `CheckDatabase` 类执行其工作时，如果信用卡发卡方的计算机对任何连接尝试都没有响应，会发生什么？这类错误正是\
  \ `try`-`catch` 块旨在处理的类型，并且它被用于 `CheckDatabase` 内部以处理连接错误。\n\n如果 `CheckDatabase`\
  \ 类自己处理了这个错误，`CreditCardChecker` 应用程序根本不知道发生了异常。这不是一个好主意——应用程序应该知道何时无法建立连接，以便向使用该应用程序的人报告。\n\
  \n通知 `CreditCardChecker` 应用程序的一种方式是让 `CheckDatabase` 在 `catch` 块中捕获异常，然后使用 `throw`\
  \ 语句再次抛出它。异常在 `CheckDatabase` 中抛出，之后它必须像处理任何其他异常一样处理它。\n\n异常处理是类在发生错误或其他异常情况时相互通信的一种方式。\n\
  \n当你在一个捕获父类（如 `Exception`）的 `catch` 块中使用 `throw` 时，抛出异常会抛出该类。这会丢失一些关于发生何种错误的信息，因为像\
  \ `NumberFormatException` 这样的子类比单纯的 `Exception` 类能提供更多关于问题的细节。\n\nJava 提供了一种保留此细节的方法：`catch`\
  \ 语句中的 `final` 关键字。\n\n点击此处查看代码图片\n\n```java\ntry {\n    principal = Float.parseFloat(loanText)\
  \ * 1.1F;\n} catch (final Exception e) {\n    System.out.println(\"Error \" + e.getMessage());\n\
  \    throw e;\n}\n```\n\n`catch` 中的这个 `final` 关键字会导致 `throw` 的行为有所不同。被捕捉到的具体类会被抛出。\n\
  \n### 忽略异常\n\n本节涵盖的下一个技术是如何完全忽略异常。类中的方法可以通过使用方法定义中的 `throws` 子句来忽略异常。\n\n以下方法抛出\
  \ `MalformedURLException`，这是在 Java 程序中处理网址时可能发生的一个错误：\n\n点击此处查看代码图片\n\n```java\n\
  public void loadURL(String address) throws MalformedURLException {\n    URL page\
  \ = new URL(address);\n    // 加载网页的代码\n}\n```\n\n此示例中的第二条语句创建了一个 `URL` 对象，该对象表示网络上的一个地址。`URL`\
  \ 类的构造方法会抛出 `MalformedURLException`，以指示使用了无效地址，因此无法构造对象。当您尝试打开与该 URL 的连接时，以下语句会导致抛出此类异常之一：\n\
  \n点击此处查看代码图片\n\n```java\nURL source = new URL(\"http:www.java24hours.com\");\n```\n\
  \n字符串 `http:www.java24hours.com` 不是有效的 URL。它缺少一些标点符号：冒号后的两个斜杠字符（`//`）。\n\n因为 `loadURL()`\
  \ 方法已被声明为抛出 `MalformedURLException` 错误，所以它不必在方法内部处理它们。捕获此异常的责任落在任何调用 `loadURL()`\
  \ 方法的方法上。\n\n### 不需要 catch 的异常\n\n虽然本节已经说明异常需要用 `try`-`catch` 捕获或用 `throws` 子句声明为抛出，但有一个例外。\n\
  \nJava 程序中可能发生的一些异常无需以任何方式处理。当编译器检测到异常被忽略时，不会因此停止工作。这些异常被称为非受检异常，而其他则被称为受检异常。\n\n\
  非受检异常是 `java.lang` 包中 `RuntimeException` 的所有子类。一个常见的非受检异常例子是 `IndexOutOfBoundsException`，它指示用于访问数组、字符串或数组列表的索引不在其边界内。如果一个数组有五个元素，而您尝试读取第\
  \ 10 个元素，就会发生此异常。\n\n另一个是 `NullPointerException`，当使用一个没有值的对象时会发生。对象变量在被赋值之前具有 `null`\
  \ 值。一些方法在无法返回对象时也会返回 `null`。如果一条语句错误地假设一个对象具有值，就会发生 `NullPointerException`。\n\n\
  这两种错误都是程序员可以在代码中（也应该）防止的事情，而不是需要异常处理的事情。如果你编写了一个访问越界数组元素的程序，修复执行此操作的代码并重新编译它。如果你期望一个对象并且它等于\
  \ `null`，在使用对象之前先用 `if` 条件检查一下。\n\nJava 中非受检异常的原理是，它们要么可以通过编写良好的代码来防止，要么可能发生得如此频繁，以至于总是捕获它们会使程序不必要地复杂。`NullPointerException`\
  \ 可能发生在程序中调用对象方法的每条语句中。\n\n当然，仅仅因为一个异常可以被忽略，并不意味着它应该被忽略。你仍然可以选择对非受检异常使用 `try`、`catch`\
  \ 和 `throws`。\n\n### 抛出和捕获异常（项目）\n\n在本节的最后一个项目中，你将创建一个类，该类使用异常来告知另一个类所发生的错误。\n\n\
  本项目中的类有 `HomePage`（表示网络上的个人主页的类）和 `PageCatalog`（用于编目这些页面的应用程序）。\n\n在名为 `HomePage`\
  \ 的新 Java 文件中输入 清单 18.4 的文本。\n\n**清单 18.4** `HomePage.java` 的完整文本\n\n点击此处查看代码图片\n\
  \n```java\npackage com.java24hours;\n\nimport java.net.*;\n\npublic class HomePage\
  \ {\n    String owner;\n    URL address;\n    String category = \"none\";\n\n  \
  \  public HomePage(String inOwner, String inAddress)\n        throws MalformedURLException\
  \ {\n        owner = inOwner;\n        address = new URL(inAddress);\n    }\n\n\
  \    public HomePage(String inOwner, String inAddress, String inCategory)\n    \
  \    throws MalformedURLException {\n        this(inOwner, inAddress);\n       \
  \ category = inCategory;\n    }\n}\n```\n\n\n\n你可以在其他程序中使用 `HomePage` 类。该类代表个人网页。它有三个实例变量：`address`，一个表示页面地址的\
  \ `URL` 对象；`owner`，页面的所有者；以及 `category`，一个简短描述页面主要主题的注释。\n\n与任何创建 `URL` 对象的类一样，`HomePage`\
  \ 必须在 `try`-`catch` 块中处理 `MalformedURLException` 错误，或者声明它正在忽略这些错误。\n\n该类采取了后一种方式，如第\
  \ 10–11 行和第 17–18 行所示。通过在两个构造函数方法中使用 `throws`，`HomePage` 无需以任何方式处理 `MalformedURLException`\
  \ 错误。\n\n要创建一个使用 `HomePage` 类的应用程序，请返回 NetBeans 并创建一个名为 `PageCatalog` 的 Java 文件，其中包含\
  \ 清单 18.5 的内容。\n\n### 清单 18.5 `PageCatalog.java` 的完整内容\n\n点击此处查看代码图像\n\n```java\n\
  package com.java24hours;\n\nimport java.net.*;\n\npublic class PageCatalog {\n \
  \   public static void main(String[] arguments) {\n        HomePage[] catalog =\
  \ new HomePage[5];\n        try {\n            catalog[0] = new HomePage(\"Mark\
  \ Evanier\",\n                \"http://www.newsfromme.com\", \"comic books\");\n\
  \            catalog[1] = new HomePage(\"Jeff Rients\",\n                \"http://jrients.blogspot.com\"\
  , \"gaming\");\n            catalog[2] = new HomePage(\"Rogers Cadenhead\",\n  \
  \              \"http://workbench.cadenhead.org\", \"programming\");\n         \
  \   catalog[3] = new HomePage(\"Juan Cole\",\n                \"http://www.juancole.com\"\
  , \"politics\");\n            catalog[4] = new HomePage(\"Rafe Colburn\",\n    \
  \            \"www.rc3.org\");\n            for (int i = 0; i < catalog.length;\
  \ i++) {\n                System.out.println(catalog[i].owner + \": \" +\n     \
  \               catalog[i].address + \" -- \" +\n                    catalog[i].category);\n\
  \            }\n        } catch (MalformedURLException e) {\n            System.out.println(\"\
  Error: \" + e.getMessage());\n        }\n    }\n}\n```\n\n当你运行编译后的应用程序时，会显示 图 18.4\
  \ 中所示的输出。\n\n![图片](img/image00537.jpeg)\n\n**图 18.4** `PageCatalog` 应用程序的错误输出。\n\
  \n`PageCatalog` 应用程序创建一个 `HomePage` 对象数组，然后显示数组的内容。每个 `HomePage` 对象使用最多三个参数创建：\n\
  \n![图片](img/image00476.jpeg) 页面所有者的姓名\n\n![图片](img/image00476.jpeg) 页面的地址（作为 `String`，而不是\
  \ `URL`）\n\n![图片](img/image00476.jpeg) 页面的类别\n\n第三个参数是可选的，在第 17–18 行中未使用。\n\n`HomePage`\
  \ 类的构造函数方法在接收到无法转换为有效 `URL` 对象的字符串时会抛出 `MalformedURLException` 错误。这些异常在 `PageCatalog`\
  \ 应用程序中通过 `try`-`catch` 块处理。\n\n要纠正导致“no protocol”错误的问题，请编辑第 18 行，使字符串以 `http://`\
  \ 开头，就像第 9–16 行中的其他网址一样。当你再次运行该程序时，会看到 图 18.5 中所示的输出。\n\n![图片](img/image00538.jpeg)\n\
  \n**图 18.5** `PageCatalog` 应用程序修正后的输出。\n\n### 总结\n\n现在你已经实践了 Java 的异常处理技术，关于错误的主题应该比本小时开始时更受欢迎一些。\n\
  \n你可以使用这些技术做很多事情：\n\n![图片](img/image00476.jpeg) 捕获异常并处理它。\n\n![图片](img/image00476.jpeg)\
  \ 忽略异常，将其留给另一个类或 Java 解释器处理。\n\n![图片](img/image00476.jpeg) 在同一个 `try`-`catch` 块中捕获多个不同的异常。\n\
  \n![图片](img/image00476.jpeg) 抛出你自己的异常。\n\n在 Java 程序中管理异常使它们更可靠、更通用且更易于使用，因为你不会向运行你的软件的人显示任何晦涩难懂的错误信息。\n\
  \n### 研讨室\n\n#### 问与答\n\n**问.** 有可能创建自己的异常吗？\n\n**答.** 你可以通过使它们成为现有异常的子类来轻松创建自己的异常，例如\
  \ `Exception`，它是所有异常的超类。在 `Exception` 的子类中，你可能只想重写两个方法：无参数的 `Exception()` 和带有 `String`\
  \ 参数的 `Exception()`。在后者中，该字符串应该是一个描述所发生错误的消息。\n\n**问.** 为什么本小时没有涵盖如何抛出和捕获错误，除了异常之外？\n\
  \n**答.** Java 将问题分为 `Errors` 和 `Exceptions`，因为它们在严重性上有所不同。异常不那么严重，因此应该使用 `try`-`catch`\
  \ 或在方法声明中使用 `throws` 在你的程序中处理它们。另一方面，错误更严重，无法在程序中充分处理。\n\n这些错误的两个例子是堆栈溢出和内存不足错误。这些可能导致\
  \ Java 解释器崩溃，而且当解释器运行程序时，你无法在自己的程序中修复它们。\n\n**问.** 仍在报纸上连载的最古老的连环画是什么？\n\n**答.**\
  \ *《吵闹的孩子》*，由鲁道夫·德克斯于 1897 年创作，至今仍由 King Features Syndicate 提供。该漫画仅在第一部连环画 *《黄孩子》*\
  \ 出现两年后开始，是第一部使用对话气泡的连环画。\n\n德克斯是一位移民美国的德国人，他从祖国的儿童故事中获得灵感，创造了叛逆的孩子汉斯和弗里茨。他于 1912\
  \ 年因合同纠纷离开了这部漫画，由哈罗德·克纳继任，他一直绘制到 1949 年。此后有五位漫画家参与创作。海·艾斯曼自 1986 年以来一直在绘制。\n\n*Katzenjammer*\
  \ 这个词在德语中的字面意思是“猫的嚎叫”，但它更常用于描述宿醉。\n\n#### 测验\n\n虽然这一小时确实充满了错误，但看看你是否能在不犯任何错误的情况下回答以下关于它们的问题。\n\
  \n**1.** 一个 `catch` 语句可以处理多少个异常？\n\n**A.** 只有一个。\n\n**B.** 几个不同的异常。\n\n**C.** 此答案有意留空。\n\
  \n**2.** `finally` 部分中的语句何时运行？\n\n**A.** 在 `try`-`catch` 块因异常而结束之后\n\n**B.** 在 `try`-`catch`\
  \ 块没有异常而结束之后\n\n**C.** 两者都是\n\n**3.** 在讨论了这么多抛出和捕获之后，德州游骑兵队在休赛期需要做什么？\n\n**A.**\
  \ 获得更多的首发投手\n\n**B.** 签下一位能够打到右外野短距离围墙的左打强棒外野手\n\n**C.** 引进新的中继投手\n\n#### 答案\n\n\
  **1. B.** `catch` 语句中的 `Exception` 对象可以处理其自身类及其所有父类的所有异常。\n\n**2. C.** `finally`\
  \ 部分中的语句总是在 `try`-`catch` 块的其余部分之后执行，无论是否发生异常。\n\n**3. A.** 每个答案都是正确的，但 A 比其他答案更正确，并且在未来\
  \ 30 年内可能都是正确的。\n\n#### 活动\n\n为了检验你是否是一位出色的 Java 程序员，请尝试在以下活动中尽可能少地犯错误：\n\n![图片](img/image00476.jpeg)\
