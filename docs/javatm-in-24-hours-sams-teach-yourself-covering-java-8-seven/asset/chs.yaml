  \ Larvets——烧烤味、切达奶酪味和墨西哥香料味。\n\n#### 测验\n\n通过回答以下问题来测试你对变量、表达式以及本节其余信息的了解。\n\n**1.**\
  \ 一组包含在开括号和闭括号内的语句叫什么？\n\n**A.** 块语句\n\n**B.** 群件\n\n**C.** 带括号的语句\n\n**2.** `boolean`\
  \ 变量用于存储 `true` 或 `false` 值。\n\n**A.** 正确\n\n**B.** 错误\n\n**C.** 不，谢谢。我已经吃过了。\n\n\
  **3.** 什么字符不能用于变量名的开头？\n\n**A.** 美元符号\n\n**B.** 两个前斜杠 (`//`)\n\n**C.** 一个字母\n\n\
