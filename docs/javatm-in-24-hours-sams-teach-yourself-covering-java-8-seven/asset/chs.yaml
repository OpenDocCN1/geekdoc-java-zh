  \n\n\n\n\n# 第一部分：入门\n\n## 第 1 小时：成为程序员\n\n我就长话短说吧：Java 计算机编程比看起来要简单。本来我不该告诉你这个事实，因为成千上万的程序员已经凭借他们的\
  \ Java 技能在软件开发、Web 应用程序编程和移动应用开发领域获得了高薪工作。程序员最不想让老板知道的就是，只要有毅力和一点空闲时间，任何人都能学会这门世界上最流行的编程语言。通过学习《Sams\
  \ Teach Yourself Java in 24 Hours》中每一小时的教程，你将能够快速掌握 Java 编程。\n\n任何人都能学会编写计算机程序——即使你连\
  \ DVR 都不会设置。Java 是最好的编程语言之一，值得学习，因为它是一种实用、强大、现代化的技术，被世界各地的程序员所采用。\n\n本书面向非程序员、曾经厌恶学习编程的新程序员，以及希望快速掌握\
  \ Java 的资深程序员。它使用 Java 8，这门语言的最新版本。\n\nJava 是一种极其流行的编程语言，因为它能实现许多功能。你可以创建具有图形用户界面的程序，设计充分利用互联网的软件，连接\
  \ Web 服务，开发可以在 Android 手机或平板电脑上运行的应用程序，等等。\n\n本书从零开始教授 Java 编程。它用英语而非专业术语介绍概念，并通过一步一步的示例展示你将要编写的可运行程序。与本书共度\
  \ 24 小时，你将能够编写自己的 Java 程序，并对自己使用这门语言及进一步学习的能力充满信心。你还将掌握日益重要的技能，例如网络计算、图形用户界面设计和面向对象编程。\n\
  \n这些术语现在对你来说可能没什么意义。事实上，它们可能是让编程显得令人生畏和困难的那种东西。然而，如果你能使用电脑在 Facebook 上创建相册、申报纳税或操作\
  \ Excel 电子表格，那么通过阅读《Sams Teach Yourself Java in 24 Hours》，你也能学会编写计算机程序。\n\n***\n\
  \n**注意**\n此时此刻，如果你更想喝咖啡而不是 Java，请将本书封面朝外放回书店人流密集处的端架上。\n\n***\n\n### 本小时待办事项：\n\n\
  - `![Image](img/image00474.jpeg)` 找出学习 Java 的理由。\n- `![Image](img/image00474.jpeg)`\
  \ 探索程序是如何工作的。\n- `![Image](img/image00474.jpeg)` 选择一个 Java 开发工具。\n- `![Image](img/image00474.jpeg)`\
  \ 准备编写你的第一个程序。\n\n你可能听说过计算机编程极其困难。它需要计算机科学学位，价值数千美元的计算机硬件和软件，敏锐的分析头脑，约伯般的耐心，以及对含咖啡因饮料的强烈喜好。\n\
  \n除了咖啡因那部分，你听说的不对。编程比你想象的要容易，尽管程序员多年来一直这样告诉别人，以便让我们更容易获得高薪工作。\n\n现在是学习编程的好时机。无数编程工具正作为免费下载提供在网络上，成千上万的程序员将其作品作为开源软件分发，以便其他人可以查看软件是如何编写的，修正错误并贡献改进。即使在经济困难时期，许多公司仍在招聘程序员。\n\
  \n现在是学习 Java 的好时机，因为这门语言无处不在。数十亿移动设备使用 Android 操作系统，其所有应用都是用 Java 编写的。如果你有一部 Android\
  \ 手机，每次你查阅电影、用网络电台听音乐，或者向建造拙劣的猪堡投掷愤怒小鸟时，你都在享受 Java 程序员的工作成果。\n\n本书旨在向三类人教授 Java\
  \ 编程：\n\n1. 从未尝试过编程的紧张新手。\n2. 曾尝试编程但像伏地魔憎恨英国孤儿学生一样憎恨它的痛苦初学者。\n3. 已知其他编程语言并希望快速掌握\
  \ Java 的急躁知识分子。\n\n为实现此目标，本书尽可能使用英语而非技术术语或晦涩缩写。所有新的编程术语在引入时都会被彻底解释。\n\n如果我成功了，你读完本书时将拥有足够的编程技能，足以对自己和他人构成“危险”。你将能够编写程序，更自信地投身于编程课程和书籍的学习，并更轻松地学习新的编程语言。（我说的是编程语言。本书不会帮助你掌握西班牙语、世界语或克林贡语。）\n\
  \n你还将掌握 Java 这门地球上使用最广泛的编程语言的技能。\n\n本书的第一个小时提供了编程简介以及如何设置计算机的指南，以便你用它来编写和运行 Java\
  \ 程序。\n\n#### 选择语言\n\n如果你对计算机足够熟悉，能够制作一份漂亮的简历、平衡支票簿或在 Facebook 上分享假期照片，那么你就能创建计算机软件。\n\
  \n学习编程的关键是从正确的语言开始。你选择的编程语言通常取决于你想要完成的任务。每种语言都有其长处和短处。在我那个年代，年轻人学习编程使用的是某种形式的 BASIC\
  \ 语言，因为它是为初学者设计的。\n\n***\n\n**注意**\nBASIC 语言的发明初衷是让学生易于学习（BASIC 中的 B 代表“初学者”）。使用某种形式的\
  \ BASIC 的缺点在于，很容易养成该语言特有的草率编程习惯。\n\n***\n\n当今最受欢迎的使用 BASIC 思想的语言是 Visual Basic.NET，这是微软提供的一种编程语言和开发套件，早已超越了其起源。也称为\
  \ VB.NET，它旨在为运行 Windows 操作系统的计算机和移动设备创建程序。另一种流行的语言是 PHP，一种用于创建网站的脚本语言。其他你可能听说过的广泛使用的语言包括\
  \ C++、C#、Ruby 和 Python。\n\n这些语言都有各自的拥护者，但在高中和大学级别的计算机科学课程中，教授最广泛的是 Java。\n\nJava\
  \ 编程语言由 Oracle 提供，比 VB.NET 和 PHP 等某些语言更难学习，但它是几个原因下的良好起点。学习 Java 的一个优势是你可以在各种操作系统和计算环境中使用它。Java\
  \ 程序可以是 Windows、Mac、Linux 和其他操作系统上的桌面软件、Web 应用程序、互联网服务器、Android 应用等等。这种多功能性体现在早期\
  \ Java 雄心勃勃的口号中：“一次编写，到处运行。”\n\n***\n\n**注意**\n早期的 Java 批评者有一个不那么恭维的口号：“一次编写，到处调试。”自\
  \ 1996 年第一个版本发布以来，这门语言已经取得了长足的进步，宝贝。\n\n***\n\n另一个重要优势是 Java 要求高度结构化的方法来使程序运行。你必须对如何编写程序以及它们如何存储和修改数据一丝不苟。\n\
  \n当你开始编写 Java 程序时，你可能不会将语言这种挑剔的行为视为优势。你可能会厌倦编写一个程序，在它能够运行之前就需要修复几个错误。这种额外努力的好处在于，你创建的软件更可靠、有用且无差错。\n\
  \n在接下来的几个小时里，你将学习 Java 的所有规则以及需要避免的陷阱。\n\n\n\n\n# Java：一种更好的编程方式\n\nJava 由加拿大计算机科学家詹姆斯·高斯林发明，旨在为创建计算机程序提供一种更好的方式。1991\
  \ 年在太阳微系统公司工作期间，高斯林对当时 C++ 编程语言在一个项目上的表现感到不满，因此他创建了一种能更好地完成这项工作的新语言。当然，Java 是否优于其他编程语言仍是一个存在争议的话题，但该语言的成功证明了其初始设计的强大。全球有三十亿台设备运行\
  \ Java，这个数字令人惊叹，我打算再说一遍：三十亿台！自推出以来，已有超过 1000 本关于该语言的书籍出版。（这是我的第十八本。）\n\n* * *\n\n\
  > **注意**\n>\n> C++ 在本章中被多次提及，因此你可能会对这个术语感到困惑，想知道它的含义以及如何发音。C++ 的发音是“C-Plus-Plus”，它是由丹麦计算机科学家本贾尼·斯特劳斯特鲁普在贝尔实验室开发的一种编程语言。C++\
  \ 是 C 编程语言的增强版，因此名称中带有“Plus-Plus”部分。为什么不直接叫它 C+？“Plus-Plus”部分是一个计算机编程笑话，你将在本书后面理解它。\n\
  \n* * *\n\n无论 Java 是否是最佳语言，它绝对是一门值得学习的伟大语言。你将在 第 2 小时，“编写你的第一个程序”中首次尝试使用 Java。\n\
  \n学习一门编程语言会使学习后续语言变得容易得多。许多语言彼此相似，因此当你深入学习一门新语言时，并不是从零开始。例如，许多 C++ 和 Smalltalk 程序员认为学习\
  \ Java 相当容易，因为 Java 借鉴了那些早期语言的思想。同样，C# 也采纳了许多来自 Java 的思想，因此对于 Java 程序员来说更容易上手。\n\
  \n### 告诉计算机要做什么\n\n计算机程序（也称为软件）是一种告诉计算机执行任务的方式。计算机从启动到关闭所做的一切，都是由程序完成的。Mac OS X\
  \ 是一个程序；Minecraft 是一个程序；控制打印机的驱动软件是一个程序；甚至 Windows PC 蓝屏死机那个可怕的界面也是一个程序。\n\n计算机程序由一系列命令组成，计算机在程序运行时按照特定的顺序处理这些命令。每条命令称为一条语句。\n\
  \n如果你的房子有自己的管家，并且你是一个具有 A 型人格的控制狂，你可以给你的仆人一套详细的指令，让他每天遵循，就像这样：\n\n亲爱的 Jeeves 先生，\n\
  \n请在我外出向国会请求救助期间，为我处理以下事务：\n\n第一项：吸尘客厅。\n\n第二项：去商店。\n\n第三项：买酱油、山葵，以及尽可能多的加州寿司卷。\n\
  \n第四项：回家。\n\n此致，\n\n你的主人，\n\nBertie Wooster\n\n如果你告诉一个人类管家要做什么，如何满足你的请求会有一定的自由裁量空间。如果加州卷没有，Jeeves\
  \ 可能会带波士顿卷回家。\n\n计算机没有自由裁量空间。它们严格按照指令执行。你编写的程序会被精确地遵循，一次一条指令。\n\n以下是一个用 BASIC 编写的三行计算机程序示例。看看它，但不用担心每行应该意味着什么。\n\
  \n点击此处查看代码图片\n\n```basic\n1 PRINT \"Hey Tom, it's Bob from the office down the hall.\"\
  \n2 PRINT \"It's good to see you buddy, how've you been?\"\n3 INPUT A$\n```\n\n\
  翻译成英语，这个程序等同于给计算机以下待办事项：\n\n亲爱的个人电脑，\n\n第一项：显示消息，“嘿 Tom，我是走廊那头办公室的 Bob。”\n\n第二项：询问问题，“很高兴见到你，哥们，你最近怎么样？”\n\
  \n第三项：给用户一个回答问题的机会。\n\n此致，\n\n你的主人，\n\nIma Coder\n\n计算机程序中的每一行都称为一条语句。计算机按照特定顺序处理程序中的每条语句，就像厨师遵循食谱或管家\
  \ Jeeves 遵循 Bertie Wooster 的命令一样。在 BASIC 中，行号用于将语句按正确顺序排列。其他语言如 Java 不使用行号，而是使用不同的方式告诉计算机如何运行程序。\n\
  \n图 1.1 显示了这个三行 BASIC 程序在 ReadyBASIC 中的样子，ReadyBASIC 是一个在 [www.readybasic.com](http://www.readybasic.com)\
  \ 网站上提供的 BASIC 解释器。\n\n![Image](img/image00475.jpeg)\n\n**图 1.1** 一个 BASIC 程序示例。\n\
  \n* * *\n\n> **注意**\n>\n> ReadyBASIC 解释器是用 Java 语言创建的。开发者 Kevin Matz 创建了一个 Java\
  \ 小程序（一种运行在网页内的 Java 程序）来解释 BASIC 代码语句。\n>\n> 你的浏览器必须能够运行 Java 程序，ReadyBASIC 才能工作。如果你遇到问题，请访问\
  \ Oracle 的 Java 站点 [www.java.com](http://www.java.com) 测试你的浏览器是否具有 Java —— 并在必要时安装\
  \ Java 插件。\n>\n> 你可能还需要调整你的 Java 安全设置以允许程序运行。在 Windows 上，运行控制面板，单击 Java，然后单击“安全”选项卡将其置于前台。你可以更改安全级别或允许特定网站运行\
  \ Java 小程序。\n\n* * *\n\n由于程序的运行方式，当你的程序在运行过程中出现问题时，你不能责怪计算机。计算机正是按照你告诉它的方式在做事情，因此错误的责任通常在于程序员。\n\
  \n这是坏消息。好消息是你不会造成任何永久性伤害。在你学习用 Java 编程的过程中，不会有计算机受到伤害。\n\n### 程序如何工作\n\n构成计算机程序的语句集合称为其源代码。\n\
  \n大多数计算机程序的编写方式与你写电子邮件相同——将每条语句键入文本窗口。一些编程工具自带源代码编辑器，而另一些可以与任何文本编辑软件一起使用。\n\n当你完成计算机程序的编写后，需要将文件保存到磁盘。计算机程序通常有其自己的文件扩展名来表明文件类型。Java\
  \ 程序必须具有扩展名 `.java`，例如 `Calculator.java`。\n\n要运行你已保存为文件的程序，你需要一些帮助。所需帮助的类型取决于你使用的编程语言。有些语言需要解释器来运行其程序。解释器检查计算机程序的每一行并执行该行，然后继续下一行。许多版本的\
  \ BASIC 是解释型语言。\n\n* * *\n\n> **注意**\n>\n> 如果你最喜欢的文本编辑器是一个具有粗体文本、字体大小和其他样式化功能的文字处理程序，在编写计算机程序时，请选择另一个编辑器或不要使用这些功能。程序应作为纯文本文件准备，不要使用特殊格式。Windows\
  \ 附带的文本编辑器 Notepad 会将所有文件保存为未格式化文本。你也可以在 Mac 上使用 TextEdit，或在 Linux 系统上使用 vi 编辑器或\
  \ emacs 来创建无格式的文本文件。\n\n* * *\n\n解释型语言最大的优点是测试更快。当你编写 BASIC 程序时，可以立即尝试运行，修复错误，然后再次尝试。主要缺点是解释型语言比其他程序运行得慢。每一行都必须转换为计算机可以运行的指令，一次一行。\n\
  \n其他编程语言需要编译器。编译器接受一个程序并将其转换为计算机可以理解的形式。它还使程序尽可能高效地运行。编译后的程序可以直接运行，无需解释器。\n\n\n\n\
  \n\n# 编译型程序运行速度更快，但测试所需时间更长。你必须编写程序并编译整个程序，然后才能尝试运行。如果发现错误并修复，必须重新编译程序。\n\nJava\
  \ 的独特之处在于它同时需要编译器和解释器。编译器将构成程序的语句转换为字节码，这些字节码可由名为 Java 虚拟机的解释器运行。\n\nJava 虚拟机，也称为\
  \ JVM，使得相同的 Java 程序无需修改即可在不同操作系统和不同类型的计算设备上运行成为可能。虚拟机将字节码转换为设备操作系统可执行的指令。\n\n##\
  \ 当程序无法运行时\n\n许多新程序员在开始测试程序时会感到沮丧。错误无处不在。其中一些是语法错误，计算机在查看程序时会因语句书写方式而感到困惑，从而识别出这些错误。其他错误是逻辑错误，只有在测试程序时才会被程序员发现（或者可能被完全忽略）。逻辑错误常常导致程序执行非预期的操作。\n\
  \n***\n\n**注意**\n\n最早的计算机错误之一是在 1947 年由一个团队发现的，其中包括美国计算机科学家格蕾丝·霍珀。当时霍珀正在测试哈佛大学的一台计算机，一个继电器发生了故障。结果发现原因不是软件问题，而是一只真正的虫子。她通过移除一只死蛾来调试计算机，这只死蛾被粘在日志本上，并附有说明：“发现虫子的首个实际案例。”这只虫子和日志本页面可在[www.doncio.navy.mil/CHIPS/ArticleDetails.aspx?id=3489](http://www.doncio.navy.mil/CHIPS/ArticleDetails.aspx?id=3489)查看。\n\
  \n***\n\n当你开始编写自己的程序时，你会对错误非常熟悉。它们是编程过程中的自然组成部分。编程错误被称为 bug，这个术语可以追溯到一个世纪或更久以前，用于描述技术设备中的错误。\n\
  \n修复错误的过程也有其专有术语：调试。\n\n有如此多的术语来描述错误，这并非巧合。在学习编程的过程中，你会获得大量的调试经验——无论你是否愿意。\n\n##\
  \ 选择 Java 编程工具\n\n要开始编写 Java 程序，你必须拥有一个 Java 编程工具。Java 有多种此类程序可用，包括简单的 Java 开发工具包以及更复杂的`Eclipse`、`IntelliJ\
  \ IDEA`和`NetBeans`。后三种工具都是集成开发环境（IDE），是专业程序员用于完成工作的强大工具。\n\n每当 Oracle 发布新版本的 Java\
  \ 时，第一个支持它的工具就是`Java Development Kit`（JDK）。\n\n***\n\n**注意**\n\n在本书中，你不必使用`NetBeans`。如果你能使用`JDK`或其他工具来创建、编译和运行程序，这就足以满足大多数项目的要求。之所以涵盖`NetBeans`，是因为对于过去版本的读者来说，它已被证明比`JDK`更容易上手。我所有的`Java`编程都使用`NetBeans`。\n\
  \n***\n\n要创建本书中的程序，你必须使用`JDK`版本 8 或在其基础上工作的编程工具。`JDK`是一套用于创建`Java`软件的免费命令行工具。它没有图形用户界面，因此如果你从未在`Windows`命令提示符或`Linux`命令行界面等非图形化环境中工作过，你会发现使用`JDK`颇具挑战性。\n\
  \n同样由 Oracle 免费提供的`NetBeans IDE`是一种比`JDK`简单得多的方式来编写和测试`Java`代码。`NetBeans`提供图形用户界面、源代码编辑器、用户界面设计器和项目管理器。它与`JDK`互补，在后台运行，因此当你开始开发`Java`程序时，必须同时拥有这两个工具。\n\
  \n本书中的程序是使用`NetBeans`创建的，你可以从`JDK`网站单独下载并安装它。只要支持`JDK 8`，你可以使用其他`Java`工具。\n\n##\
  \ 安装 Java 开发工具\n\n本书每一小时的内容都以一个`Java`编程项目结束，你可以在学习主题知识的同时进行实践，让知识在大脑中充分消化吸收。\n\n\
  如果你的计算机上没有`Java`编程工具，这些编程活动都无法进行。\n\n如果你已经安装了支持`Java`的工具，你可以用它来开发接下来 23 小时中的教程程序。然而，你应该已经对如何使用该工具有一定的熟悉程度。同时学习`Java`和一个复杂的`IDE`可能会令人望而生畏。\n\
  \n在阅读本书时进行编程，推荐的选择是`NetBeans 8.0`，可从 Oracle 网站[`netbeans.org`](http://netbeans.org)免费获取。虽然`NetBeans`有一些需要时间学习的高级功能，但它使得创建和运行简单的`Java`应用程序变得非常容易。\n\
  \n要了解如何下载和安装`NetBeans`，请阅读附录 A，“使用`NetBeans`集成开发环境”。\n\n## 总结\n\n在这一小时中，你了解了为计算机编程的概念——给它一组称为语句的指令来告诉它该做什么。你还明白了为什么选择自学`Java`而不是其他编程语言是一个明智的决定。\n\
  \n你可能已经下载并安装了一个`Java`开发工具，用于在接下来的小时里创建程序。\n\n问 10 个程序员什么是最好的编程语言，你可能会得到 10 个答案，其中夹杂着“我的语言能打败你的语言”的嘲弄和“你的源代码太臃肿了”的玩笑。`Java`在这类争论中得分很高，因为它被广泛采用、极其通用且设计巧妙。你可以用这门语言完成很多事情，并且它让学习其他语言变得稍微容易一些。\n\
  \n如果你仍然对程序、编程语言或`Java`整体感到困惑，不要惊慌。一切将在下一小时“编写你的第一个程序”中开始变得清晰，该部分将逐步引导你完成创建`Java`程序的过程。\n\
  \n## 研讨会\n\n### 问与答\n\n**问.** `BASIC`？`C++`？`Smalltalk`？`Java`？这些语言的名称有什么含义？\n\n\
  **答.** `BASIC`的名字来自一个首字母缩略词：初学者通用符号指令代码。`C++`是一种编程语言，旨在改进`C`语言，而`C`语言本身是对`B`编程语言的改进。`Smalltalk`是\
  \ 20 世纪 70 年代开发的一种创新的面向对象语言，其许多理念被`Java`采用。\n\n`Java`打破了使用首字母缩略词或其他有意义术语命名的传统。它只是`Java`开发者最喜欢的名称，在竞争中胜过了`WebRunner`、`Silk`、`Ruby`等。（当时的`Ruby`编程语言尚不存在。）\n\
  \n当我创造自己的编程语言时，我会将其命名为`Salsa`。每个人都喜欢莎莎舞（Salsa）。\n\n**问.** 为什么解释型语言比编译型语言慢？\n\n**答.**\
  \ 它们较慢的原因与同声传译员比笔译员慢的原因类似。同声传译员必须在讲话进行时即时思考每一个语句，而笔译员可以处理整个演讲稿并采取捷径以加快过程。编译型语言可以比解释型语言快得多，因为它们会采取措施使程序运行更高效。\n\
  \n**问.** 你只回答关于`Java`的问题吗？\n\n**答.** 完全不是。随便问我什么都可以。\n\n**问.** 好的，那么《与星共舞》节目历史上给出的最低分数是多少？\n\
  \n\n\n\n## 第 2 小时：编写你的第一个程序\n\n**本小时待办事项：**\n\n-   在文本编辑器中输入一个 Java 程序。\n-   使用花括号组织程序结构。\n\
  -   将信息存储在变量中。\n-   显示存储在变量中的信息。\n-   保存、编译和运行程序。\n\n正如你在第 1 小时“成为程序员”中学到的，计算机程序是一组告诉计算机执行操作的指令。这些指令通过编程语言传递给计算机。\n\
  \n在本小时中，你将通过在文本编辑器中输入来创建你的第一个 Java 程序。完成后，你将保存程序、编译并测试它。然后，你可能会故意弄坏它，再修复它，纯粹是为了炫技。\n\
  \n### 编写程序所需工具\n\n如第 1 小时所述，要创建 Java 程序，你必须拥有支持 Java 开发工具包（`JDK`）的编程工具，例如 `NetBeans`\
  \ 集成开发环境（`IDE`）。你需要一个可以编译和运行 Java 程序的工具，以及一个用于编写这些程序的文本编辑器。\n\n对于大多数编程语言，计算机程序都是通过在文本编辑器（也称为源代码编辑器）中输入文本来编写的。有些编程语言自带其编辑器。`NetBeans`\
  \ 包含一个用于编写 Java 程序的编辑器。\n\nJava 程序是纯文本文件，没有任何特殊格式，如居中文本或加粗文本。`NetBeans` 源代码编辑器的功能类似于一个简单的文本编辑器，但为程序员提供了一些极其有用的增强功能。在输入时，文本会变成不同的颜色，以识别语言的不同元素。`NetBeans`\
  \ 还会适当地缩进行，并在编辑器内提供有用的编程文档。\n\n因为 Java 程序是文本文件，所以你可以使用任何文本编辑器打开和编辑它们。你可以使用 `NetBeans`\
  \ 编写一个 Java 程序，然后在 Windows 记事本中打开它进行修改，之后再次在 `NetBeans` 中打开，不会有任何问题。\n\n### 创建 `Saluton`\
  \ 程序\n\n你创建的第一个 Java 程序将显示来自计算机科学界的传统问候语：“Saluton mondo!”\n\n为在 `NetBeans` 中开始第一个编程项目，如果你还没有这样做，请按照以下步骤创建一个名为\
  \ `Java24` 的新项目：\n\n1.  选择菜单命令 File, New Project。打开“新建项目”对话框。\n2.  选择项目类别 `Java`\
  \ 和项目类型 `Java Application`，然后点击 Next。\n3.  输入 `Java24` 作为项目名称。（如果你之前创建过同名项目，会看到错误消息“Project\
  \ folder already exists and is not empty”。）\n4.  取消选中 Create Main Class 复选框。\n5.\
  \  点击 Finish。\n\n`Java24` 项目已在其自己的文件夹中创建。你可以将此项目用于你在学习本书过程中编写的 Java 程序。\n\n### 开始程序\n\
  \n`NetBeans` 将相关程序分组到一个项目中。如果你没有打开 `Java24` 项目，可以按照以下步骤检索它：\n\n1.  选择 File, Open\
  \ Project。出现文件对话框。\n2.  找到并选择 `NetBeansProjects` 文件夹（如果需要）。\n3.  选择 `Java24` 并点击\
  \ Open Project。\n\n`Java24` 项目出现在“项目”窗格中，旁边有一个咖啡杯图标和一个可展开的 + 号，展开后可以看到项目包含的文件和文件夹。\n\
