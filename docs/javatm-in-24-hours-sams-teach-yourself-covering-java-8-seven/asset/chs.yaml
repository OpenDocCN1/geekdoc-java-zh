  \ Java 程序，请访问本书网站 [www.java24hours.com](http://www.java24hours.com)。\n\n## 第 6 课：使用字符串进行通信\n\
  \n本课待办事项：\n\n![Image](img/image00474.jpeg) 使用字符串存储文本。\n\n![Image](img/image00474.jpeg)\
  \ 在程序中显示字符串。\n\n![Image](img/image00474.jpeg) 在字符串中包含特殊字符。\n\n![Image](img/image00474.jpeg)\
  \ 将两个字符串拼接在一起。\n\n![Image](img/image00474.jpeg) 在字符串中包含变量。\n\n![Image](img/image00474.jpeg)\
  \ 比较两个字符串。\n\n![Image](img/image00474.jpeg) 确定字符串的长度。\n\n你的计算机程序能够默默地执行工作，从不停下来聊天。\n\
  \nJava 程序使用字符串作为与用户沟通的主要方式。*字符串*是文本的集合——字母、数字、标点符号和其他字符。在本课中，你将学习关于处理字符串的所有知识。\n\
  \n### 在字符串中存储文本\n\n字符串存储文本并将其呈现给用户。字符串最基本的元素是字符。字符是单个字母、数字、标点符号或其他符号。\n\n在 Java\
  \ 程序中，字符是可以存储在变量中的一种信息类型。字符变量使用 `char` 类型创建，语句如下所示：\n\n```java\nchar keyPressed;\n\
  ```\n\n这条语句创建了一个名为 `keyPressed` 的变量，可以存储一个字符。创建字符变量时，可以为其设置初始值，如下所示：\n\n```java\n\
  char quitKey = '@';\n```\n\n字符的值必须用单引号括起来。\n\n字符串是字符的集合。你可以通过在 `String` 后跟变量名来设置一个变量来保存字符串值，如以下语句所示：\n\
  \n单击此处查看代码图像\n\n```java\nString fullName = \"Fin Shepard\";\n```\n\n这条语句创建了一个名为\
  \ `fullName` 的字符串变量，其中包含文本“Fin Shepard”，这是 2013 年电影杰作 *鲨卷风* 中的主角。在 Java 语句中，字符串用双引号括起来表示。这些引号本身并不包含在字符串中。\n\
  \n与你使用过的其他类型的变量——`int`、`float`、`char`、`boolean` 等不同——`String` 类型的名称首字母大写。\n\n字符串是一种称为对象的特殊信息，Java\
  \ 中所有对象的类型名称首字母都大写。你将在第 10 课“创建你的第一个对象”中学习对象。在本课中需要注意的重要一点是，字符串与其他变量类型不同，由于这种差异，`String`\
  \ 首字母大写。\n\n### 在程序中显示字符串\n\n在 Java 程序中显示字符串最基本的方法是使用 `System.out.println()` 语句。此语句接受括号内的字符串和其他变量，并将它们的值显示在系统输出设备（即计算机的显示器）上。以下是一个例子：\n\
  \n单击此处查看代码图像\n\n```java\nSystem.out.println(\"We can't just wait here for sharks\
  \ to rain down on us.\");\n```\n\n此语句会导致以下文本被显示：\n\n单击此处查看代码图像\n\n```\nWe can't\
  \ just wait here for sharks to rain down on us.\n```\n\n在屏幕上显示文本通常被称为打印，这就是 `println()`\
  \ 的含义——打印行。你可以使用 `System.out.println()` 语句来显示双引号内的文本，也可以显示变量，正如你稍后会看到的。将所有你想要显示的内容放在括号内。\n\
  \n显示文本的另一种方法是调用 `System.out.print()`。此语句显示括号内的字符串和其他变量，但与 `System.out.println()`\
  \ 不同，它允许后续语句在同一行显示文本。\n\n你可以连续多次使用 `System.out.print()` 在同一行上显示多个内容，如下例所示：\n\n单击此处查看代码图像\n\
  \n```java\nSystem.out.print(\"There's \");\nSystem.out.print(\"a \");\nSystem.out.print(\"\
  shark \");\nSystem.out.print(\"in \");\nSystem.out.print(\"your \");\nSystem.out.println(\"\
  pool.\");\n```\n\n这些语句会导致以下文本被显示：\n\n```\nThere's a shark in your pool.\n```\n\n\
  ### 在字符串中使用特殊字符\n\n当创建或显示字符串时，其文本必须用双引号括起来。这些引号本身不会显示，这就引出了一个好问题：如果你想显示双引号怎么办？\n\
  \n为了显示双引号，Java 创建了一个可以放入字符串中的特殊代码：`\\\"`。每当在字符串中遇到此代码时，它会被替换为一个双引号。例如，看看以下代码：\n\n\
  单击此处查看代码图像\n\n```java\nSystem.out.println(\"Anthony Ferrante directed \\\"Sharknado\\\
  \" in 2013.\");\n```\n\n此代码显示如下：\n\n单击此处查看代码图像\n\n```\nAnthony Ferrante directed\
  \ \"Sharknado\" in 2013.\n```\n\n你可以用这种方式在字符串中插入多个特殊字符。以下列表显示了这些特殊字符；注意每个前面都有一个反斜杠\
  \ (`\\`)。\n\n![Image](img/image00493.jpeg)\n\n换行符会使换行符之后的文本在下一行的开头显示。看这个例子：\n\n\
  单击此处查看代码图像\n\n```java\nSystem.out.println(\"Script by\\nThunder Levin\");\n```\n\
  \n此语句将显示为：\n\n```\nScript by\nThunder Levin\n```\n\n### 将字符串拼接在一起\n\n当你使用 `System.out.println()`\
  \ 并以其他方式处理字符串时，可以使用 `+` 将两个字符串拼接在一起，这个运算符与用于数字加法的那个相同。\n\n* * *\n\n注意\n\n随着你构建编程技能，你可能会在其他书中看到术语“连接”，因此值得了解。然而，当一个字符串与另一个字符串连接在一起时，这里使用的术语是“拼接”。“拼接”听起来很有趣。“连接”听起来像是在明火附近绝不应该做的事情。\n\
  \n* * *\n\n`+` 运算符对于字符串具有不同的含义。它不是执行某种数学运算，而是将两个字符串拼接在一起。此操作可以导致字符串一起显示，或者将两个较小的字符串组合成一个大字符串。\n\
  \n“连接”是用来描述此操作的词汇，因为它意味着将两个东西链接在一起。\n\n以下语句使用 `+` 运算符来显示一个长字符串：\n\n单击此处查看代码图像\n\n\
  ```java\nSystem.out.println(\"\\\"\\'Sharknado\\' is an hour and a half of your\
  \ \"\n    + \"life that you'll never get back.\\nAnd you won't want to.\\\"\\n\"\
  \n    + \"\\t-- David Hinckley, New York Daily News\");\n```\n\n你没有将整个字符串放在单行上（这会使你在稍后查看程序时更难理解），而是使用\
  \ `+` 运算符将文本拆分到程序的 Java 文本文件的两行上。当此语句显示时，它将呈现如下：\n\n单击此处查看代码图像\n\n```\n\"'Sharknado'\
  \ is an hour and a half of your life that you'll never get\nback. And you won't\
  \ want to.\"\n    -- David Hinckley, New York Daily News\n```\n\n字符串中使用了多个特殊字符：`\\\
  \"`、`\\'`、`\\n` 和 `\\t`。为了更好地熟悉这些字符，请将输出与产生它的 `System.out.println()` 语句进行比较。\n\n\
  ### 在字符串中使用其他变量\n\n虽然你可以使用 `+` 运算符将两个字符串拼接在一起，但你更常使用它来链接字符串和变量。看看以下例子：\n\n单击此处查看代码图像\n\
  \n```java\nint length = 86;\nchar rating = 'R';\nSystem.out.println(\"Running time:\
  \ \" + length + \" minutes\");\n```\n\n\n\nSystem.out.println(\"Rated \" + rating);\n\
  \n此代码将显示为以下内容：\n\nRunning time: 86 minutes\n\nRated R\n\n此示例展示了`+`运算符与字符串结合使用时的一个独特特性。当显示非字符串变量时，该运算符可使其被当作字符串处理。变量`length`是一个整数，被赋值为\
  \ 86。它在字符串`Running time:`和`minutes`之间被显示。`System.out.println()`语句被要求显示一个字符串加一个整数，再加另一个字符串。此语句能够正常工作，是因为这组表达式中至少有一个部分是字符串。Java\
  \ 语言提供此功能，以使信息的显示更加便捷。\n\n你可能想对字符串做的一件事是，将某些内容多次追加到其末尾，如以下示例所示：\n\n```java\nString\
  \ searchKeywords = \"\";\n\nsearchKeywords = searchKeywords + \"shark \";\n\nsearchKeywords\
  \ = searchKeywords + \"hurricane \";\n\nsearchKeywords = searchKeywords + \"danger\"\
  ;\n```\n\n此代码将导致`searchKeywords`变量被设置为“shark hurricane danger”。第一行创建了`searchKeywords`变量，并将其设置为空字符串，因为双引号之间没有任何内容。第二行将`searchKeywords`变量设置为其当前字符串加上字符串“shark”追加到末尾的结果。接下来的两行以同样的方式添加了“hurricane”和“danger”。\n\
  \n如你所见，当你要将更多文本追加到变量末尾时，该变量的名称必须列出两次。Java 提供了一个快捷方式来简化此过程：`+=`运算符。`+=`运算符结合了`=`和`+`运算符的功能。对于字符串，它用于将某些内容添加到现有字符串的末尾。使用`+=`可以缩短`searchKeywords`示例，如下所示：\n\
  \n```java\nString searchKeywords = \"\";\n\nsearchKeywords += \"shark \";\n\nsearchKeywords\
  \ += \"hurricane \";\n\nsearchKeywords += \"danger\";\n```\n\n此代码产生相同的结果：`searchKeywords`被设置为“shark\
  \ hurricane danger”。\n\n## 高级字符串处理\n\n你还可以使用其他几种方法来检查字符串变量并更改其值。这些高级特性之所以可能，是因为字符串在\
  \ Java 语言中是对象。处理字符串所培养的技能，你稍后将用于处理其他对象。\n\n### 比较两个字符串\n\n你在程序中经常测试的一件事是一个字符串是否等于另一个字符串。你可以通过在包含两个字符串的语句中使用`equals()`方法来实现，如下例所示：\n\
  \n```java\nString favorite = \"chainsaw\";\n\nString guess = \"pool cue\";\n\nSystem.out.println(\"\
  Is Fin's favorite weapon a \" + guess + \"?\");\n\nSystem.out.println(\"Answer:\
  \ \" + favorite.equals(guess));\n```\n\n此示例使用了两个不同的字符串变量。一个变量`favorite`存储了 Fin 最喜欢的捕鲨工具名称：电锯。另一个变量`guess`存储了关于他可能喜欢什么的猜测。猜测是\
  \ Fin 更喜欢台球杆。\n\n第三行显示文本“Is Fin's favorite weapon a”，后跟`guess`变量的值，然后是一个问号。第四行显示文本“Answer:”，然后包含一些新内容：\n\
  \n`favorite.equals(guess)`\n\n语句的这一部分被称为**方法**。方法是在 Java 程序中完成某项任务的一种方式。此方法的任务是确定一个字符串是否与另一个字符串具有相同的值。如果两个字符串变量具有相同的值，则显示文本`true`。否则，显示文本`false`。以下是此示例的输出：\n\
  \n**输出**\n\nIs Fin's favorite weapon a pool cue?\n\nAnswer: `false`\n\n### 确定字符串的长度\n\
  \n确定字符串的字符长度也可能很有用。你可以使用`length()`方法来实现。此方法的工作方式与`equals()`方法相同，只是只涉及一个字符串变量。请看以下示例：\n\
  \n```java\nString cinematographer = \"Ben Demaree\";\n\nint nameLength = cinematographer.length();\n\
  ```\n\n此示例将整型变量`nameLength`设置为等于 11。`cinematographer.length()`方法计算名为`cinematographer`的字符串变量中的字符数，并将此计数存储在整型变量`nameLength`中。\n\
  \n### 更改字符串的大小写\n\n因为计算机完全按照字面意思处理内容，所以很容易让它们产生混淆。虽然人类会识别出文本“Ian Ziering”和文本“IAN\
  \ ZIERING”指的是同一件事物，但大多数计算机可能不这么认为。本节前面讨论的`equals()`方法会权威地指出“Ian Ziering”不等于“IAN\
  \ ZIERING”。\n\n为了克服其中一些障碍，Java 提供了将字符串变量显示为全大写字母或全小写字母的方法，分别是`toUpperCase()`和`toLowerCase()`。以下示例展示了`toUpperCase()`方法的实际应用：\n\
  \n```java\nString fin = \"Ian Ziering\";\n\nString change = fin.toUpperCase();\n\
  ```\n\n此代码将字符串变量`change`设置为等于`fin`字符串变量转换成全大写字母的结果——“IAN ZIERING”。`toLowerCase()`方法以相同方式工作，但返回全小写的字符串值。\n\
  \n* * *\n\n注意\n\n克服此特定障碍的另一种方法是调用`equalsIgnoreCase()`方法，该方法在比较两个字符串时不区分大小写。调用此方法比较字符串“Tara\
  \ Reid”和“TARA REID”将返回值`true`以表示它们匹配。\n\n* * *\n\n请注意，`toUpperCase()`方法不会更改调用它的字符串变量的大小写。在前面的例子中，`fin`变量仍然等于“Ian\
  \ Ziering”。\n\n### 查找字符串\n\n处理字符串时的另一个常见任务是查看一个字符串是否可以在另一个字符串内部找到。要查找字符串内部的内容，请使用其`indexOf()`方法。将要查找的字符串放在括号内。如果未找到该字符串，`indexOf()`返回值-1。如果找到该字符串，`indexOf()`返回一个整数，表示该字符串开始的位置。字符串中的位置从\
  \ 0 开始向上编号，以字符串中的第一个字符为起始。在字符串“Sharknado”中，文本“nado”从位置 5 开始。\n\n* * *\n\n注意\n\n\
  `indexOf()`和`contains()`方法区分大小写，这意味着它们只查找与搜索字符串完全相同大小写的文本。如果字符串包含相同但大小写不同的文本，`indexOf()`将返回值-1，`contains()`将返回`false`。\n\
  \n* * *\n\n`indexOf()`方法的一个可能用途是，在整个《Sharknado》剧本中搜索英雄们驾驶直升机进入龙卷风并投掷炸弹的场景，Nova 说：“We‘re\
  \ gonna need a bigger chopper.”（“我们需要一架更大的直升机。”）\n\n如果整个《Sharknado》的剧本存储在一个名为`script`的字符串中，你可以使用以下语句搜索该引文的一部分。\n\
  \n```java\nint position = script.indexOf(\"We're gonna need a bigger chopper\");\n\
  ```\n\n如果可以在`script`字符串中找到该文本，则`position`等于文本“We‘re gonna need a bigger chopper”开始的位置。否则，它将等于-1。\n\
  \n如果你要在一个字符串中查找另一个字符串，但不在乎其位置，那么字符串的`contains()`方法返回一个布尔值。如果找到要查找的字符串，则为`true`；否则为`false`。这是一个例子：\n\
  \n```java\nif (script.contains(\"There's a shark in your pool\")) {\n\n    int stars\
  \ = 4;\n\n}\n```\n\n\n\n## 呈现片头字幕\n\n接下来，为了巩固已涵盖的字符串处理特性，你将编写一个 Java 程序来显示一部故事片的片头字幕。你可能能猜出是哪部电影。\n\
