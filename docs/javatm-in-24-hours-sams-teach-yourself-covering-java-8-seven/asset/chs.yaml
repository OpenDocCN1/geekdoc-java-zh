  \n**3. B.** 变量可以以字母、美元符号 (`$`) 或下划线字符 (`_`) 开头。如果变量名以两个斜杠开头，该行的其余部分将被忽略，因为斜杠用于开始注释行。\n\
  \n#### 活动\n\n你可以通过以下活动更充分地回顾本节的主题：\n\n![Image](img/image00476.jpeg) 扩展 `PlanetWeight`\
  \ 程序，以跟踪一个人在金星上的体重（地球体重的 90.7%）和他在天王星上的体重（地球体重的 88.9%）——别因为我提到了天王星就偷笑。\n\n![Image](img/image00476.jpeg)\
