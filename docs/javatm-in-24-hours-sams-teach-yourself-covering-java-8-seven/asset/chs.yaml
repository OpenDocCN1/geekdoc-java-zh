  \n#### 小测验\n\n以下问题用于检验你是否具备理解 OOP 技术的属性和行为。\n\n**1.** 在 Java 类中，方法是哪种概念的例子？\n\n\
  **A.** 属性\n\n**B.** 语句\n\n**C.** 行为\n\n**2.** 如果你想将一个变量设为类变量，在创建时必须使用什么语句？\n\n**A.**\
  \ `new`\n\n**B.** `public`\n\n**C.** `static`\n\n**3.** 程序中变量存在范围的那部分叫什么？\n\n**A.**\
  \ 它的巢穴\n\n**B.** 作用域\n\n**C.** 变量谷\n\n#### 答案\n\n**1. C.** 方法由语句组成，但它是行为的例子。\n\n\
  **2. C.** 如果省略了 `static` 语句，变量将成为对象变量，而不是类变量。\n\n**3. B.** 当变量在其作用域外被使用时，编译器会报错。\n\
  \n#### 练习\n\n如果关于病毒的所有讨论没有让你感到不适，你可以通过以下练习增加对本小时主题的了解：\n\n![图片](img/image00476.jpeg)\
  \ 向 `Virus` 类添加一个 `private` 变量，用于存储一个名为 `newSeconds` 的整数。创建方法以返回 `newSeconds` 的值，并且仅在新值介于\
  \ `60` 和 `100` 之间时才更改 `newSeconds` 的值。\n\n![图片](img/image00476.jpeg) 编写一个 Java 应用程序，它接收一个字符串参数，将其转换为\
  \ float 变量，再转换为 `Float` 对象，最后将其转换为 `int` 变量。使用不同的参数运行几次，观察结果如何变化。\n\n要查看实现这些活动的\
  \ Java 程序，请访问本书网站 [www.java24hours.com](http://www.java24hours.com)。\n\n## 第 12\
  \ 小时。充分利用现有对象\n\n本小时待办事项清单：\n\n![图片](img/image00474.jpeg) 设计超类和子类。\n\n![图片](img/image00474.jpeg)\
  \ 形成继承层次结构。\n\n![图片](img/image00474.jpeg) 覆盖方法。\n\nJava 对象非常适合用于繁衍后代。当你创建一个对象——一套属性和行为时，你设计的东西就准备好将这些特性传递给后代了。这些子对象继承了父对象的许多相同属性和行为。它们也可以做一些与父对象不同的事情。\n\
  \n这个系统被称为继承，这是每个超类（父类）都会传递给其子类的东西。继承是面向对象编程（OOP）最有用的方面之一，你将在本小时学习它。\n\nOOP 的另一个有用方面是能够创建一个可以在不同程序中使用的对象。可重用性使得开发无错误、可靠的程序变得更加容易。\n\
  \n### 继承的力量\n\n每次使用标准 Java 类（如 `String` 或 `Integer`）时，你都在使用继承。Java 类被组织成一个金字塔形的类层次结构，所有类都派生自\
  \ `Object` 类。\n\n一个类的对象从位于其上方的所有超类继承。为了实际了解这是如何运作的，我们来看看 `JApplet` 类。这个类是所有小程序（使用名为\
  \ Swing 的图形用户界面框架的基于浏览器的 Java 程序）的超类。`JApplet` 类是 `Applet` 的子类。\n\n`JApplet` 的部分家谱如图\
  \ 图 12.1 所示。每个方框代表一个类，线条将超类与其下方的任何子类连接起来。\n\n![图片](img/image00508.jpeg)\n\n**图 12.1**\
  \ `JApplet` 类的家谱。\n\n顶部是 `Object` 类。`JApplet` 在层次结构上方有五个超类：`Applet`、`Panel`、`Container`、`Component`\
  \ 和 `Object`。\n\n`JApplet` 类从这些类中的每一个都继承了属性和行为，因为每个类都直接位于其超类层次结构中。`JApplet` 没有从\
  \ 图 12.1 中的五个绿色类（包括 `Dialog` 和 `Frame`）继承任何东西，因为它们在层次结构中不位于其上方。\n\n\n\n\n# 面向对象编程的继承与重用\n\
  \n如果这看起来令人困惑，可以把这个层级结构想象成一个家族树。`JApplet` 继承自它的父类，父类的父类，以此类推。它甚至可能从它高祖父辈的 `Object`\
  \ 类继承一些东西。然而，`JApplet` 类不会从它的兄弟姐妹或堂表亲那里继承。\n\n创建一个新类归结为以下任务：你只需定义它与现有类的不同之处。其余的工作会自动完成。\n\
  \n## 继承行为与属性\n\n一个类的行为和属性是两部分的组合：它自身的行为和属性，以及它从超类继承的所有行为和属性。\n\n以下是 `JApplet` 的一些行为和属性：\n\
  \n![Image](img/image00476.jpeg) `equals()` 方法用于判断一个 `JApplet` 对象是否与另一个对象具有相同的值。\n\
  \n![Image](img/image00476.jpeg) `setBackground()` 方法用于设置小程序窗口的背景色。\n\n![Image](img/image00476.jpeg)\
  \ `add()` 方法用于向小程序添加用户界面组件，如按钮和文本字段。\n\n![Image](img/image00476.jpeg) `setLayout()`\
  \ 方法用于定义小程序的图形用户界面如何组织。\n\n`JApplet` 类可以使用所有这些方法，即使 `setLayout()` 是唯一一个它没有从其他类继承的方法。`equals()`\
  \ 方法定义在 `Object` 类中，`setBackground()` 来自 `Component` 类，而 `add()` 来自 `Container`\
  \ 类。\n\n### 方法重写\n\n在 `JApplet` 类中定义的某些方法，也在其某个超类中有定义。例如，`update()` 方法既是 `JApplet`\
  \ 类的一部分，也是 `Component` 类的一部分。当一个方法同时在子类和其超类中定义时，会使用子类的方法。这使得子类能够更改、替换或完全消除其超类的一些行为或属性。就\
  \ `update()` 而言，其目的是消除超类中存在的某些行为。\n\n在子类中创建一个新方法来更改从超类继承的行为，称为重写该方法。每当继承的行为产生不期望的结果时，你都需要重写该方法。\n\
  \n## 建立继承关系\n\n一个类使用 `extends` 语句定义为另一个类的子类，如下所示：\n\n```java\nclass AnimatedLogo\
  \ extends JApplet {\n\n    // 行为和属性放在这里\n\n}\n```\n\n`extends` 语句将 `AnimatedLogo`\
  \ 类对象建立为 `JApplet` 的子类。所有 Swing 小程序都必须是 `JApplet` 的子类。它们需要该类提供的功能，以便在网页上呈现时运行。\n\
  \n`AnimatedLogo` 必须重写的一个方法是 `paint()` 方法，它用于绘制程序窗口内的所有内容。`paint()` 方法由 `Component`\
  \ 类实现，一路传递到 `AnimatedLogo`。然而，`paint()` 方法本身不做任何事。它的存在是为了让 `Component` 的子类在需要显示某些内容时有一个可用的方法。\n\
  \n要重写一个方法，你必须以与其在从中继承的超类中声明的相同方式声明该方法。一个 `public` 方法必须保持为 public，方法返回的值必须相同，并且方法的参数数量和类型不得更改。\n\
  \n`Component` 类的 `paint()` 方法开头如下：\n\n```java\npublic void paint(Graphics g) {\n\
  ```\n\n当 `AnimatedLogo` 重写此方法时，它必须以类似这样的语句开头：\n\n```java\npublic void paint(Graphics\
  \ screen) {\n```\n\n唯一的区别在于 `Graphics` 对象的名称，而这在确定方法是否以相同方式创建时并不重要。这两个语句匹配是因为以下几点匹配：\n\
  \n![Image](img/image00476.jpeg) 两个 `paint()` 方法都是 `public` 的。\n\n![Image](img/image00476.jpeg)\
  \ 两个方法都不返回值，由使用 `void` 语句声明。\n\n![Image](img/image00476.jpeg) 两者都接受一个 `Graphics`\
  \ 对象作为其唯一参数。\n\n### 在子类中使用 `this` 和 `super`\n\n两个在子类中极其有用的关键字是 `this` 和 `super`。\n\
  \n正如你在前一个小时所学，`this` 关键字用于引用当前对象。当你在创建一个类并需要引用由该类创建的特定对象时，可以使用 `this`，如以下语句所示：\n\
  \n```java\nthis.title = \"Cagney\";\n```\n\n此语句将对象的 `title` 变量设置为文本“Cagney”。\n\n\
  `super` 关键字具有类似的用途：它引用对象的直接超类。你可以用几种不同的方式使用 `super`：\n\n![Image](img/image00476.jpeg)\
  \ 引用超类的构造方法，例如 `super(\"Adam\", 12);`\n\n![Image](img/image00476.jpeg) 引用超类的变量，例如\
  \ `super.hawaii = 50`\n\n![Image](img/image00476.jpeg) 引用超类的方法，例如 `super.dragnet();`\n\
  \n使用 `super` 关键字的一种方式是在子类的构造函数中。因为子类继承了其超类的行为和属性，所以你必须将该子类的每个构造函数与其超类的构造函数关联起来。否则，一些行为和属性可能无法正确设置，子类将无法正常工作。\n\
  \n为了关联构造函数，子类构造函数的第一条语句必须是调用超类构造函数的语句。这需要 `super` 关键字，如以下语句所示：\n\n```java\npublic\
  \ DataReader(String name, int length) {\n\n    super(name, length);\n\n}\n```\n\n\
  此示例是一个子类的构造函数，它使用语句 `super(name, length)` 来调用其超类中的一个可比构造函数。\n\n如果你不使用 `super()`\
  \ 来调用超类中的构造函数，Java 会在子类构造函数开始时自动调用无参的 `super()`。如果此超类构造函数不存在或提供意外的行为，将会导致错误，因此最好自己调用超类构造函数。\n\
  \n## 使用现有对象\n\nOOP 鼓励重用。如果你为一个 Java 编程项目开发了一个对象，那么应该可以将其合并到另一个项目中而无需修改。\n\n如果一个\
  \ Java 类设计良好，那么可以将其用于其他程序。你的程序中可供使用的对象越多，在创建自己的软件时你需要做的工作就越少。如果有一个优秀的、适合你需求的拼写检查对象，你可以使用它而不是自己编写。理想情况下，你甚至可以给你的老板造成一种错觉，让他以为你在项目中添加拼写检查功能花费了很长时间，并利用这些额外时间在办公室打私人长途电话。\n\
  \n**注意**\n\n本书作者，与他许多同行一样，是自由职业者，并在家中工作。在评估他关于如何在工作场所行事的建议时，请牢记这一点。\n\n当 Java 首次推出时，共享对象的系统在很大程度上是不正式的。程序员开发他们的对象，使其尽可能独立，并通过使用私有变量以及读写这些变量的公共方法来防止它们被误用。\n\
  \n当存在一种开发可重用对象的标准方法时，共享对象变得更加强大。\n\n标准的好处包括：\n\n![Image](img/image00476.jpeg) 无需太多文档来解释对象的工作原理，因为任何了解该标准的人已经对其运作方式了解甚多。\n\
  \n\n\n## 在数组列表中存储相同类的对象\n\n编写计算机程序时，一个重要的决策是数据存储的位置。在本书的前半部分，你已经发现了三种存储信息的实用位置：\n\
  \n- 基本数据类型，如 `int` 和 `char`\n- 数组\n- `String` 对象\n\n存储信息的方式远不止这些，因为任何 Java 类都可以持有数据。其中最实用的之一是\
  \ `ArrayList`，一种持有相同类对象的数据结构。顾名思义，数组列表类似于数组，后者也持有相关数据的元素，但它们可以在任何时候改变大小。\n\n`ArrayList`\
  \ 类属于 `java.util` 包中的类，这是 Java 类库中最实用的包之一。使用 `import` 语句使其在你的程序中可用：\n\n```java\n\
  import java.util.ArrayList;\n```\n\n一个数组列表持有属于同一类或共享同一超类的对象。它们通过引用两个类来创建：`ArrayList`\
  \ 类和列表所持有的类。列表所持有的类名被放置在 `<` 和 `>` 字符之间，如以下语句所示：\n\n```java\nArrayList<String> structure\
  \ = new ArrayList<String>();\n```\n\n前面的语句创建了一个持有字符串的列表。通过这种方式识别列表的类利用了**泛型**，这是一种指明数组列表等数据结构所持有对象类型的方法。如果你使用的是旧版本的\
  \ Java，你会编写如下构造函数：\n\n```java\nArrayList structure = new ArrayList();\n```\n\n尽管你仍然可以这样做，但泛型使你的代码更可靠，因为它们为编译器提供了一种防止更多错误的方法。在这里，它们防止你通过将错误类的对象放入数组列表中而误用它。如果你试图将一个\
  \ `Integer` 对象放入本应持有 `String` 对象的列表中，编译器会报错。\n\n与数组不同，数组列表不是以固定元素数量创建的。列表创建时默认有\
  \ 10 个元素。如果你知道要存储的对象数量远超于此，可以在构造函数中指定一个大小作为参数。以下是创建一个可容纳 300 个元素的列表的语句：\n\n```java\n\
  ArrayList<String> structure = new ArrayList<String>(300);\n```\n\n你可以通过调用列表的 `add()`\
  \ 方法并传入对象作为唯一参数来向列表添加对象：\n\n```java\nstructure.add(\"Vance\");\nstructure.add(\"\
  Vernon\");\nstructure.add(\"Velma\");\n```\n\n你按照顺序添加对象，因此如果这是添加到 `structure` 的前三个对象，元素\
  \ 0 是“Vance”，元素 1 是“Vernon”，元素 2 是“Velma”。\n\n你可以通过调用列表的 `get()` 方法并传入元素的索引号作为参数来检索元素：\n\
  \n```java\nString name = structure.get(1);\n```\n\n这条语句将“Vernon”存储在 `name` 字符串中。\n\
  \n要查看列表的元素中是否包含某个对象，可以调用其 `contains()` 方法并传入该对象作为参数：\n\n```java\nif (structure.contains(\"\
  Velma\")) {\n    System.out.println(\"Velma found\");\n}\n```\n\n你可以使用对象本身或其索引号从列表中移除对象：\n\
  \n```java\nstructure.remove(0);\nstructure.remove(\"Vernon\");\n```\n\n这两条语句会留下“Velma”作为列表中唯一的字符串。\n\
  \n### 遍历数组列表\n\nJava 包含一个特殊的 `for` 循环，可以方便地遍历数组列表并依次检查其每个元素。这个循环只有两部分，比你在第 8 小时，“使用循环重复操作”中学到的\
  \ `for` 循环少一部分。\n\n第一部分是初始化部分：一个用于保存从列表中检索到的每个对象的变量的类名和变量名。该对象应与持有列表的类属于同一类。第二部分指明列表。\n\
  \n以下是遍历 `structure` 列表并将每个名称显示到屏幕上的代码：\n\n```java\nfor (String name : structure)\
  \ {\n    System.out.println(name);\n}\n```\n\n本节的第一个项目将尝试使用数组列表和特殊的 `for` 循环，按字母顺序显示一个字符串列表。该列表来源于一个数组和命令行参数。在\
  \ NetBeans 中打开你的 Java24 项目，选择“文件”、“新建文件”，然后创建一个名为 `StringLister` 的新空 Java 文件。在源代码编辑器中输入清单\
  \ 12.1 的内容并保存文件。\n\n**清单 12.1 `StringLister.java` 完整文本**\n\n```java\npackage com.java24hours;\n\
  \nimport java.util.*;\n\npublic class StringLister {\n    String[] names = { \"\
  Spanky\", \"Alfalfa\", \"Buckwheat\", \"Daria\",\n        \"Stymie\", \"Marianne\"\
  , \"Scotty\", \"Tommy\", \"Chubby\" };\n\n    public StringLister(String[] moreNames)\
  \ {\n        ArrayList<String> list = new ArrayList<String>();\n        for (int\
  \ i = 0; i < names.length; i++) {\n            list.add(names[i]);\n        }\n\
  \        for (int i = 0; i < moreNames.length; i++) {\n            list.add(moreNames[i]);\n\
  \        }\n        Collections.sort(list);\n        for (String name : list) {\n\
  \            System.out.println(name);\n        }\n    }\n\n    public static void\
  \ main(String[] arguments) {\n        StringLister lister = new StringLister(arguments);\n\
  \    }\n}\n```\n\n在运行应用程序之前，你应该使用“运行”、“设置项目配置”、“自定义”命令将主类设置为 `StringLister`，并将参数设置为一个或多个以空格分隔的名字，例如\
  \ `Jackie Mickey Farina Woim`。然后选择“运行”、“运行项目”以查看结果。\n\n命令行中指定的名字被添加到第 6-7 行数组中存储的名字。因为直到程序运行才知道名字的总数，所以数组列表比数组更适合作为这些字符串的存储位置。列表中的字符串使用\
  \ `Collections` 类的一个方法按字母顺序排序：\n\n```java\nCollections.sort(list);\n```\n\n这个类与\
  \ `ArrayList` 一样，属于 `java.util` 包。数组列表和其他有用的数据结构在 Java 中被称为**集合**。\n\n运行程序时，输出应该是一个按字母顺序排列的名字列表（参见图\
  \ 12.2）。数组列表灵活的大小使得你添加的额外名字可以被添加到数据结构中，并与其他名字一起排序。\n\n![图片](img/image00509.jpeg)\n\
  \n**图 12.2** `StringLister` 程序的输出。\n\n## 创建子类\n\n为了了解继承的实际工作方式，在下一个项目中，你将创建一个名为\
  \ `Point3D` 的类，它表示三维空间中的一个点。你可以用 (x,y) 坐标表示一个二维点。三维空间增加了第三个坐标，可以称为 z。\n\n`Point3D`\
  \ 类的对象可以做三件事：\n\n- 跟踪对象的 (x,y,z) 坐标\n- 将对象移动到一个新的 (x,y,z) 坐标\n- 将对象移动指定数量的 x、y 和\
  \ z 值\n\nJava 已经有一个表示二维点的标准类，名为 `Point`。\n\n\n\n\n\n## Point3D 类的介绍与代码示例\n\n`Point3D`\
  \ 类继承自 `Point` 类，并添加了三维坐标的 `z` 值。它有两个整型变量 `x` 和 `y`，用于存储 `Point` 对象的 (x,y) 位置。它还包含一个\
  \ `move()` 方法，用于将点放置在指定位置，以及一个 `translate()` 方法，用于通过 x 和 y 值的增量移动对象。\n\n在 NetBeans\
  \ 的 Java24 项目中，创建一个名为 `Point3D` 的新空 Java 文件，并将 清单 12.2 中的文本输入到文件中。完成后保存。\n\n###\
  \ 清单 12.2 `Point3D.java` 的完整文本\n\n点击此处查看代码图片\n\n```java\npackage com.java24hours;\n\
  \nimport java.awt.*;\n\npublic class Point3D extends Point {\n    public int z;\n\
  \n    public Point3D(int x, int y, int z) {\n        super(x,y);\n        this.z\
  \ = z;\n    }\n\n    public void move(int x, int y, int z) {\n        this.z = z;\n\
  \        super.move(x, y);\n    }\n\n    public void translate(int x, int y, int\
  \ z) {\n        this.z += z;\n        super.translate(x, y);\n    }\n}\n```\n\n\
  `Point3D` 类没有 `main()` 方法，因此不能作为应用程序运行，但可以在任何需要三维点的 Java 程序中使用它。\n\n`Point3D` 类只需要完成其超类\
  \ `Point` 未完成的工作。这主要涉及跟踪整型变量 `z`，并将其作为参数传递给 `move()` 方法、`translate()` 方法和 `Point3D()`\
  \ 构造函数。\n\n所有方法都使用了关键字 `super` 和 `this`。`this` 语句用于引用当前的 `Point3D` 对象，因此第 10 行的\
  \ `this.z = z` 将对象变量 `z` 设置为在第 8 行作为参数传递给方法的 `z` 值。\n\n`super` 语句引用当前对象的超类 `Point`。它用于设置由\
  \ `Point3D` 继承的变量和调用方法。第 9 行的 `super(x,y)` 语句调用超类中的 `Point(x,y)` 构造函数，然后设置 `Point3D`\
  \ 对象的 (x,y) 坐标。因为 `Point` 已经能够处理 x 和 y 轴，所以 `Point3D` 类的对象再做同样的事情是多余的。\n\n要测试新的\
  \ `Point3D` 类，可以创建一个使用 `Point` 和 `Point3D` 对象并移动它们的程序。在 NetBeans 中创建一个名为 `PointTester`\
  \ 的新文件，并将 清单 12.3 输入到其中。文件保存时会自动编译。\n\n### 清单 12.3 `PointTester.java` 的完整文本\n\n\
  点击此处查看代码图片\n\n```java\npackage com.java24hours;\n\nimport java.awt.*;\n\nclass PointTester\
  \ {\n    public static void main(String[] arguments) {\n        Point location1\
  \ = new Point(11,22);\n        Point3D location2 = new Point3D(7,6,64);\n\n    \
  \    System.out.println(\"The 2D point is at (\" + location1.x\n            + \"\
  , \" + location1.y + \")\");\n        System.out.println(\"It's being moved to (4,\
  \ 13)\");\n        location1.move(4,13);\n        System.out.println(\"The 2D point\
  \ is now at (\" + location1.x\n            + \", \" + location1.y + \")\");\n  \
  \      System.out.println(\"It's being moved -10 units on both the x \"\n      \
  \      + \"and y axes\");\n        location1.translate(-10,-10);\n        System.out.println(\"\
  The 2D point ends up at (\" + location1.x\n            + \", \" + location1.y +\
  \ \")\\n\");\n\n        System.out.println(\"The 3D point is at (\" + location2.x\n\
  \            + \", \" + location2.y + \", \" + location2.z + \")\");\n        System.out.println(\"\
  It's being moved to (10, 22, 71)\");\n        location2.move(10,22,71);\n      \
  \  System.out.println(\"The 3D point is now at (\" + location2.x\n            +\
  \ \", \" + location2.y + \", \" + location2.z + \")\");\n        System.out.println(\"\
  It's being moved -20 units on the x, y \"\n            + \"and z axes\");\n    \
  \    location2.translate(-20,-20,-20);\n        System.out.println(\"The 3D point\
  \ ends up at (\" + location2.x\n            + \", \" + location2.y + \", \" + location2.z\
  \ + \")\");\n    }\n}\n```\n\n通过选择“运行，运行文件”来运行文件，如果程序编译正确，您将看到 图 12.3 中所示的输出。如果没有，请查找源代码编辑器旁边的红色警报图标，该图标指示触发错误的行。\n\
  \n![Image](img/image00510.jpeg)\n\n**图 12.3** `PointTester` 程序的输出。\n\n## 总结\n\n\
  当人们谈论出生的奇迹时，他们可能指的不是 Java 中超类可以派生子类的方式，或者类层次结构中行为和属性被继承的方式。\n\n如果现实世界像面向对象编程一样运作，那么莫扎特的每个后代都可以选择成为一名杰出的作曲家。马克·吐温的所有后代都可以对密西西比河上的汽船生活充满诗意。你祖先努力获得的每一项技能都会毫无费力地传承给你。\n\
  \n就奇迹的尺度而言，继承性并不完全与物种的延续或棒球比赛中连续投出无安打比赛相提并论。然而，它是一种以最少重复工作来设计软件的有效方式。\n\n## Workshop\n\
  \n### Q&A\n\n**问：** 到目前为止创建的大多数 Java 程序都没有使用 `extends` 来继承超类。这是否意味着它们存在于类层次结构之外？\n\
  \n**答：** 你在 Java 中创建的所有类都是层次结构的一部分，因为当你不使用 `extends` 关键字时，你编写的程序的默认超类是 `Object`。所有类的\
  \ `equals()` 和 `toString()` 方法都是自动从 `Object` 继承的行为的一部分。\n\n**问：** 为什么当人们发现某些东西时会喊“eureka！”？\n\
  \n**答：** “Eureka”借自古希腊语，意为“我找到了！”据说希腊学者阿基米德在踏入浴盆时喊出了这句话。\n\n希腊人在浴缸里发现了什么？上升的水位，这使他理解了排开水的体积必须等于他身体部位的体积。\n\
  \n关于阿基米德的故事是在两个世纪后由维特鲁威在他的多卷本《建筑十书》中传播开来的，这是一本关于建筑的书。\n\n“Eureka”自 1849 年以来一直出现在加利福尼亚州的州徽上，指的是早一年在\
  \ Sutter’s Mill 附近发现黄金。\n\n### Quiz\n\n为了确定你在过去一小时的工作中继承了什么样的知识，请回答以下问题。\n\n**1.**\
  \ 如果一个超类以你不希望在子类中使用的方式处理一个方法，你可以做什么？\n\n**A.** 在超类中删除该方法。\n\n**B.** 在子类中重写该方法。\n\
  \n**C.** 给《圣何塞水星报》的编辑写一封措辞激烈的信，希望 Java 的开发者能看到。\n\n**2.** 你可以使用什么方法来检索存储在数组列表中的元素？\n\
  \n**A.** `get()`\n\n**B.** `read()`\n\n**C.** `elementAt()`\n\n**3.** 你可以使用什么语句来引用当前对象的方法和变量？\n\
  \n**A.** `this`\n\n**B.** `that`\n\n**C.** `theOther`\n\n### Answers\n\n**1. B.**\
  \ 因为你可以重写该方法，所以不必更改超类的任何方面或其工作方式。\n\n**2. A.** `get()` 方法有一个参数——元素的索引号。\n\n**3.\
  \ A.** `this` 关键字引用它出现的对象。\n\n### Activities\n\n如果丰富的想象力在你心中催生了进一步学习的欲望，你可以通过以下活动衍生出更多关于继承的知识：\n\
  \n\n\n\n\n![Image](img/image00476.jpeg) 创建一个 `Point4D` 类，在 `Point3D` 类创建的 (x,y,z)\
  \ 坐标系基础上增加一个 `t` 坐标。`t` 坐标代表时间，因此你需要确保它永远不会被设置为负值。\n\n![Image](img/image00476.jpeg)\
  \ 考虑一支橄榄球队的进攻组成员：线锋、外接手、近端锋、跑卫和四分卫。设计一个类层次结构来代表这些球员的技能，将共同的技能置于层次结构的更高级别。例如，阻挡可能是线锋和近端锋类应该继承的行为，而速度则是外接手和跑卫应该继承的特质。\n\
  \n要查看实现这些活动的 Java 程序，请访问本书网站：[www.java24hours.com](http://www.java24hours.com)。\n\
  \n# 第四部分：编写图形用户界面程序\n\n## 第 13 小时。构建简单的用户界面\n\n本小时任务清单：\n\n![Image](img/image00474.jpeg)\
  \ 创建用户界面组件，例如按钮。\n![Image](img/image00474.jpeg) 创建标签、文本框和其他组件。\n![Image](img/image00474.jpeg)\
  \ 将组件分组。\n![Image](img/image00474.jpeg) 将组件放入其他组件内部。\n![Image](img/image00474.jpeg)\
  \ 水平和垂直滚动组件。\n![Image](img/image00474.jpeg) 打开和关闭窗口。\n\n这一小时将会变得相当“黏糊”。在使用 Java\
  \ 创建你的第一个图形用户界面（GUI）时，你将会制造一个巨大的“烂摊子”。\n\n计算机用户已经习惯于他们的软件拥有 GUI，能够通过鼠标接收用户输入，并像其他程序一样工作。尽管一些用户仍然在\
  \ MS-DOS 或 Linux shell 这样的命令行环境中工作，但大多数用户会对不提供像 Microsoft Windows 或 Mac OS 那样的点击式、拖放式图形界面的软件感到困惑。\n\
  \nJava 通过 Swing 来支持这类软件，Swing 是一组 Java 类的集合，代表了所有可以作为 GUI 一部分的按钮、文本框、滑块和其他组件，以及从这些组件接收用户输入所需的类。\n\
  \n在这一小时和下一个小时，你将学习如何在 Java 中创建和组织 GUI。之后在第 15 小时的“响应用户输入”中，你将使这些界面能够接收鼠标点击和其他用户输入。\n\
  \n### Swing 与抽象窗口工具包\n\n因为 Java 是一种跨平台语言，能够让你为多种操作系统编写程序，所以它的图形用户界面软件必须具有灵活性。它不能只迎合\
  \ Windows 风格或 Mac 版本，而必须同时处理两者以及其他平台。\n\n在 Java 中，程序用户界面的开发基于 Swing 和一个早期称为抽象窗口工具包（Abstract\
  \ Windowing Toolkit）的类集。这些类使你能够创建 GUI 并从用户那里接收输入。\n\n***\n\n**注意**\n\nSwing 包含数十种组件，它们的自定义方式远比本书所能记录的要多得多。本书涵盖了最常见的组件及其最有用的方法。在接下来的四个小时里探索它们时，你可以在\
  \ Oracle 官方的 Java 类库文档中了解每个组件的更多信息并发现新方法。阅读地址：[`download.java.net/jdk8/docs/api`](http://download.java.net/jdk8/docs/api)。该文档提供了关于\
  \ Java 8 中每个类和接口的额外参考文档。\n\n***\n\nSwing 包含了编写使用 GUI 的程序所需的一切。借助 Java 的用户界面类，你可以创建一个包含以下所有内容以及更多内容的\
  \ GUI：\n\n![Image](img/image00476.jpeg) 按钮、复选框、标签和其他简单组件\n![Image](img/image00476.jpeg)\
  \ 文本框、滑块和其他更复杂的组件\n![Image](img/image00476.jpeg) 下拉菜单和弹出菜单\n![Image](img/image00476.jpeg)\
  \ 窗口、框架、对话框、面板和小程序窗口\n\n### 使用组件\n\n在 Java 中，GUI 的每个部分都由 Swing 包中的一个类表示。有用于按钮的 `JButton`\
  \ 类，用于窗口的 `JWindow` 类，用于文本框的 `JTextField` 类，等等。\n\n要创建和显示一个界面，你需要创建对象，设置它们的变量，并调用它们的方法。这些技术与你之前三小时在学习面向对象编程（OOP）时所使用的技术相同。\n\
  \n当你组装 GUI 时，你会使用两种对象：组件和容器。组件是用户界面中的单个元素，例如按钮或滑块。容器是一种你可以用来容纳其他组件的组件。\n\n创建界面的第一步是创建一个可以容纳组件的容器。在应用程序中，这个容器通常是一个窗口或一个框架。\n\
  \n#### 窗口和框架\n\n窗口和框架是可以在用户界面中显示并容纳其他组件的容器。窗口是简单的容器，没有标题栏，也没有通常沿着 GUI 顶部边缘的其他按钮。框架是包含所有常见窗口特性的窗口，这些特性是用户在运行软件时期望看到的——例如关闭、展开和缩小窗口的按钮。\n\
  \n你可以使用 Swing 的 `JWindow` 和 `JFrame` 类来创建这些容器。要在 Java 程序中引用 Swing 类而不使用其完整的包名和类名，请使用以下语句：\n\
  \n```java\nimport javax.swing.*;\n```\n\n这只导入了 `javax.swing` 包中的类名。你还会在 Swing 中用到其他包。\n\
  \n在 Java 应用程序中使用框架的一种方法是使该应用程序成为 `JFrame` 的子类。你的程序继承了作为框架运行所需的行为。以下语句创建了一个 `JFrame`\
  \ 的子类：\n\n```java\nimport javax.swing.*;\n\npublic class MainFrame extends JFrame\
  \ {\n\n    public MainFrame() {\n\n        // 设置框架\n\n    }\n\n}\n```\n\n这个类创建了一个框架，但没有完全设置它。在框架的构造函数中，创建框架时你必须做几件事：\n\
  \n![Image](img/image00476.jpeg) 调用超类 `JFrame` 的一个构造函数。\n![Image](img/image00476.jpeg)\
  \ 设置框架的标题。\n![Image](img/image00476.jpeg) 设置框架的大小。\n![Image](img/image00476.jpeg)\
  \ 设置框架的外观和感觉。\n![Image](img/image00476.jpeg) 定义当用户关闭框架时发生的情况。\n\n你还必须使框架可见，除非有原因要求它在应用程序开始运行时不应显示。\n\
  \n大多数这些事情都可以在框架的构造函数中处理。该方法必须包含的第一件事是使用 `super` 语句调用 `JFrame` 的一个构造函数。这里有一个例子：\n\
  \n`super();`\n\n前面的语句调用了没有参数的 `JFrame` 构造函数。你也可以使用框架的标题作为参数来调用它：\n\n`super(\"Main\
  \ Frame\");`\n\n这将框架标题栏（位于顶部边缘）中的标题设置为指定的字符串。在这个例子中，显示文本“Main Frame”。\n\n如果未以这种方式设置标题，你可以使用标题作为参数调用框架的\
  \ `setTitle(String)` 方法：\n\n`setTitle(\"Main Frame\");`\n\n可以通过使用两个参数（宽度和高度）调用其\
  \ `setSize(int, int)` 方法来设置框架的大小。以下语句设置了一个宽 350 像素、高 125 像素的框架：\n\n`setSize(350,\
  \ 125);`\n\n设置框架大小的另一种方法是用组件填充它，然后使用无参数调用框架的 `pack()` 方法：\n\n`pack();`\n\n\n\n\n\
  \n# 框架简介\n\n`pack()` 方法会调整框架大小，使其刚好能够容纳框架内每个组件的首选尺寸（但不会更大）。每个界面组件都有首选尺寸，尽管根据界面中组件的排列方式，有时会忽略这一点。在调用\
  \ `pack()` 之前，你不需要显式设置框架的尺寸——该方法会在框架显示之前将其设置为一个合适的尺寸。\n\n每个框架显示时，其标题栏上都有一个可用于关闭框架的按钮。在\
  \ Windows 系统中，此按钮表现为框架右上角的一个 `X`。要定义点击此按钮时发生什么，请使用四个 `JFrame` 类变量之一作为参数来调用框架的 `setDefaultCloseOperation(int)`\
  \ 方法：\n\n- `EXIT_ON_CLOSE` — 点击按钮时退出程序。\n- `DISPOSE_ON_CLOSE` — 关闭框架并继续运行应用程序。\n\
  - `DO_NOTHING_ON_CLOSE` — 保持框架打开并继续运行。\n- `HIDE_ON_CLOSE` — 关闭框架并继续运行。\n\n此方法调用是最常见的，因为当图形用户界面关闭时，意味着应用程序应完成其工作并关闭：\n\
  \n```java\nsetDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n```\n\n使用 Swing 创建的图形用户界面可以通过外观和感觉来定制其外观，这是一种控制按钮和其他组件外观及行为的可视主题。\n\
  \n## 设置外观和感觉\n\nJava 包含一种名为 Nimbus 的增强外观和感觉，但必须在类中启用才能使用。设置外观和感觉是通过在主 Swing 包中调用\
  \ `UIManager` 类的 `setLookAndFeel()` 方法来完成的。\n\n该方法接受一个参数：外观和感觉类的完整名称。\n\n以下语句将 Nimbus\
  \ 设置为外观和感觉：\n\n```java\nUIManager.setLookAndFeel(\n    \"com.sun.java.swing.plaf.nimbus.NimbusLookAndFeel\"\
  \n);\n```\n\n最后一件事是使框架可见。使用 `true` 作为参数调用其 `setVisible()` 方法：\n\n```java\nsetVisible(true);\n\
  ```\n\n这将打开一个具有指定宽度和高度的框架。你也可以使用 `false` 调用它来停止显示框架。\n\n## 示例：SalutonFrame\n\n代码清单\
  \ 13.1 包含了本节描述的源代码。在一个名为 `SalutonFrame` 的 Java 文件中，输入以下语句。\n\n**代码清单 13.1** `SalutonFrame.java`\
  \ 的完整内容\n\n```java\npackage com.java24hours;\n\nimport javax.swing.*;\n\npublic\
  \ class SalutonFrame extends JFrame {\n    public SalutonFrame() {\n        super(\"\
  Saluton mondo!\");\n        setLookAndFeel();\n        setSize(350, 100);\n    \
  \    setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n        setVisible(true);\n\
  \    }\n\n    private void setLookAndFeel() {\n        try {\n            UIManager.setLookAndFeel(\n\
  \                \"com.sun.java.swing.plaf.nimbus.NimbusLookAndFeel\"\n        \
  \    );\n        } catch (Exception exc) {\n            // 忽略错误\n        }\n   \
  \ }\n\n    public static void main(String[] arguments) {\n        SalutonFrame frame\
  \ = new SalutonFrame();\n    }\n}\n```\n\n代码清单 13.1 的第 24–26 行包含一个 `main()` 方法，它将此框架类转换为一个应用程序。当你运行此类时，你会看到\
  \ 图 13.1 所示的框架。\n\n![在应用程序中显示框架](img/image00511.jpeg)\n\n`SalutonFrame` 只显示一个标题：传统的程序员问候语“Saluton\
  \ mondo!”。该框架是一个空窗口，因为它尚未包含任何其他组件。\n\n要向框架添加组件，你必须创建该组件并将其添加到容器中。每个容器都有一个 `add()`\
  \ 方法，它接受一个参数：要显示的组件。\n\n`SalutonFrame` 类包含一个 `setLookAndFeel()` 方法，该方法指定 Nimbus\
  \ 作为框架的外观和感觉。这是通过在第 16–18 行调用 `UIManager` 类的 `setLookAndFeel()` 方法来完成的。\n\n对此方法的调用放在一个\
  \ `try`-`catch` 块中，这使得可以处理可能发生的错误。`try` 和 `catch` 语句是新的，因为它们尚未介绍过。使用这些语句处理错误在 第\
  \ 18 小时 “处理程序中的错误” 中讲解。\n\n此时，你需要知道的是，调用 `UIManager.setLookAndFeel()` 可以设置 GUI 的外观和感觉。任何因此可能导致的错误只会导致程序保留默认的外观和感觉，而不是\
  \ Nimbus。\n\n> **提示：**\n> 在 代码清单 13.1 中，有些东西你可能以前没见过。仔细看看第 16–18 行。它们是一条语句，分布在三行上。该语句可以放在一行，但为了人类的可读性而被拆开了——Java\
  \ 编译器并不关心额外的空格。只要语句包含正确的内容并以分号结尾，它可以跨多行书写。\n\n# 向框架添加组件\n\n## 按钮\n\n你可以添加到容器中的一个简单组件是\
  \ `JButton` 对象。`JButton` 与你本节中使用的其他组件一样，是 `java.awt.swing` 包的一部分。`JButton` 对象是一个可点击的按钮，带有一个描述点击该按钮所执行操作的标签。此标签可以是文本、图形或两者兼有。以下语句创建一个名为\
  \ `okButton` 的 `JButton`，并为其指定文本标签 `OK`：\n\n```java\nJButton okButton = new JButton(\"\
  OK\");\n```\n\n在创建像 `JButton` 这样的组件后，应通过调用其 `add()` 方法将其添加到容器中：\n\n```java\nadd(okButton);\n\
  ```\n\n当向容器添加组件时，你不需要指定组件在容器中的显示位置。组件的排列由称为布局管理器的对象决定。其中最简单的是 `FlowLayout` 类，它是\
  \ `java.awt` 包的一部分。\n\n要使容器使用特定的布局管理器，你必须首先创建该布局管理器类的一个对象。你可以通过调用其无参构造函数来创建一个 `FlowLayout`\
  \ 对象：\n\n```java\nFlowLayout flo = new FlowLayout();\n```\n\n创建布局管理器后，你调用容器的 `setLayout`\
  \ 方法，将指定的管理器与该容器关联起来：\n\n```java\nsetLayout(flo);\n```\n\n此语句将 `flo` 对象指定为布局管理器。\n\
  \n## 示例：Playback\n\n你将创建的下一个应用程序，一个名为 `Playback` 的类，是一个 Java 应用程序，它显示一个带有三个按钮的框架。在新的\
  \ Java 文件中输入 代码清单 13.2 的内容并保存文件。\n\n**代码清单 13.2** `Playback.java` 的完整内容\n\n```java\n\
  package com.java24hours;\n\nimport javax.swing.*;\nimport java.awt.*;\n\npublic\
  \ class Playback extends JFrame {\n    public Playback() {\n        super(\"Playback\"\
  );\n        setLookAndFeel();\n        setSize(225, 80);\n        setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n\
  \        FlowLayout flo = new FlowLayout();\n        setLayout(flo);\n        JButton\
  \ play = new JButton(\"Play\");\n        JButton stop = new JButton(\"Stop\");\n\
  \        JButton pause = new JButton(\"Pause\");\n        add(play);\n        add(stop);\n\
  \        add(pause);\n        setVisible(true);\n    }\n\n    private void setLookAndFeel()\
  \ {\n        try {\n            UIManager.setLookAndFeel(\n                \"com.sun.java.swing.plaf.nimbus.NimbusLookAndFeel\"\
  \n            );\n        } catch (Exception exc) {\n            // 忽略错误\n     \
  \   }\n    }\n\n    public static void main(String[] arguments) {\n        Playback\
  \ frame = new Playback();\n    }\n}\n```\n\n# 总结\n\n在本节中，你学习了如何在 Java Swing 中创建和自定义框架，包括设置它们的大小、外观和关闭时的行为。你还学习了如何向框架添加简单的组件（如按钮），以及如何使用布局管理器来排列它们。\n\
  \n\n\n\n\n# UI 编程组件\n\n```java\nUIManager.setLookAndFeel(\n    \"com.sun.java.swing.plaf.nimbus.NimbusLookAndFeel\"\
  \n);\n} catch (Exception exc) {\n    // ignore error\n}\n}\n\npublic static void\
  \ main(String[] arguments) {\n    Playback frame = new Playback();\n}\n}\n```\n\n\
  `Playback`程序在第 12 行创建了一个`FlowLayout`布局管理器，并在第 13 行设置框架使用该布局。当三个按钮在第 17-19 行添加到框架时，它们将由这个布局管理器排列。\n\
  \n**注意**\n由于本小时介绍了许多不同的用户界面组件，此处并未列出创建每个图表的全部源代码。您可以在本书网站[www.java24hours.com](http://www.java24hours.com)的第\
  \ 13 小时页面找到每个程序的完整版本。\n\n当您运行应用程序时，您的输出应类似于图 13.2。虽然您可以点击按钮，但程序中没有包含接收和响应用户输入的方法，因此不会发生任何响应。这部分内容将在第\
  \ 15 小时中介绍。\n\n![图片](img/image00512.jpeg)\n**图 13.2** 显示了 GUI 上的按钮。\n\n您可以以这种方式向容器添加许多`Swing`用户组件。\n\
  \n#### 标签和文本字段\n\n`JLabel`组件显示用户无法修改的信息。这些信息可以是文本、图形或两者兼有。这些组件通常用于在界面中标记其他组件，因此得名。它们经常用来标识文本字段。\n\
  \n`JTextField`组件是一个允许用户输入单行文本的区域。创建文本字段时，可以设置其宽度。\n\n以下语句创建一个`JLabel`组件和一个`JTextField`组件，并将它们添加到容器中：\n\
  \n点击此处查看代码图片\n\n```java\nJLabel pageLabel = new JLabel(\"Web page address: \", JLabel.RIGHT);\n\
  JTextField pageAddress = new JTextField(20);\nFlowLayout flo = new FlowLayout();\n\
  setLayout(flo);\nadd(pageLabel);\nadd(pageAddress);\n```\n\n图 13.3 显示了并排显示的标签和文本字段。此示例中的两个语句都使用参数来配置组件的外观。\n\
  \n![图片](img/image00513.jpeg)\n**图 13.3** 显示标签和文本字段。\n\n`pageLabel`标签设置为文本“Web page\
  \ address:”和一个`JLabel.RIGHT`参数。后一个值表示标签应靠右对齐。`JLabel.LEFT`使标签文本靠左对齐，`JLabel.CENTER`使其居中。用于`JTextField`的参数表示文本字段应约为\
  \ 20 个字符宽。您也可以使用如下语句指定出现在文本字段中的默认文本：\n\n点击此处查看代码图片\n\n```java\nJTextField country\
  \ = new JTextField(\"Togolese Republic\", 29);\n```\n\n此语句将创建一个宽 20 个字符、且文本字段中包含文本“Togolese\
  \ Republic”的`JTextField`对象。\n\n您可以使用`getText()`方法检索对象内包含的文本，该方法返回一个字符串：\n\n点击此处查看代码图片\n\
  \n```java\nString countryChoice = country.getText();\n```\n\n正如您可能猜到的，您也可以使用相应的方法设置文本：\n\
  \n点击此处查看代码图片\n\n```java\ncountry.setText(\"Separate Customs Territory of Taiwan,\
  \ Penghu, Kinmen, and Matsu\");\n```\n\n这将设置文本为中华台北的官方名称，这是世界上最长的国家名称，略胜第二名：大不列颠及北爱尔兰联合王国。\n\
  \n#### 复选框\n\n`JCheckBox`组件是一个方框，旁边有一行文本，用户可以勾选或取消勾选。以下语句创建一个`JCheckBox`对象并将其添加到容器中：\n\
  \n点击此处查看代码图片\n\n```java\nJCheckBox jumboSize = new JCheckBox(\"Jumbo Size\");\n\
  FlowLayout flo = new FlowLayout();\nsetLayout(flo);\nadd(jumboSize);\n```\n\n`JCheckBox()`构造函数的参数指定要与方框一起显示的文本。如果您希望方框被选中，请改用以下语句：\n\
  \n点击此处查看代码图片\n\n```java\nJCheckBox jumboSize = new JCheckBox(\"Jumbo Size\", true);\n\
  ```\n\n您可以单独呈现`JCheckBox`，也可以将其作为组的一部分。在一组复选框中，一次只能选中一个。要使`JCheckBox`对象成为组的一部分，您必须创建一个`ButtonGroup`对象。请考虑以下内容：\n\
  \n点击此处查看代码图片\n\n```java\nJCheckBox frogLegs = new JCheckBox(\"Frog Leg Grande\"\
  , true);\nJCheckBox fishTacos = new JCheckBox(\"Fish Taco Platter\", false);\nJCheckBox\
  \ emuNuggets = new JCheckBox(\"Emu Nuggets\", false);\nFlowLayout flo = new FlowLayout();\n\
  ButtonGroup meals = new ButtonGroup();\nmeals.add(frogLegs);\nmeals.add(fishTacos);\n\
  meals.add(emuNuggets);\nsetLayout(flo);\nadd(jumboSize);\nadd(frogLegs);\nadd(fishTacos);\n\
  add(emuNuggets);\n```\n\n这将创建三个复选框，它们都分组在名为`meals`的`ButtonGroup`对象下。青蛙腿大餐（Frog Leg\
  \ Grande）复选框最初被选中，但如果用户选中其他餐点复选框之一，青蛙腿大餐旁边的选中标记将自动消失。图 13.4 显示了本节中不同的复选框。\n\n![图片](img/image00514.jpeg)\n\
  **图 13.4** 显示复选框组件。\n\n#### 组合框\n\n`JComboBox`组件是一个弹出式选择列表，也可以设置为接收文本输入。当两种选项都启用时，您可以使用鼠标选择一项，也可以使用键盘输入文本。组合框的作用类似于一组复选框，不同之处在于，除非弹出列表正在显示，否则只有一项选择是可见的。\n\
  \n要创建一个`JComboBox`对象，您必须在创建对象后添加每个选择，如下例所示：\n\n点击此处查看代码图片\n\n```java\nJComboBox\
  \ profession = new JComboBox();\nFlowLayout flo = new FlowLayout();\nprofession.addItem(\"\
  Butcher\");\nprofession.addItem(\"Baker\");\nprofession.addItem(\"Candlestick maker\"\
  );\nprofession.addItem(\"Fletcher\");\nprofession.addItem(\"Fighter\");\nprofession.addItem(\"\
  Technical writer\");\nsetLayout(flo);\nadd(profession);\n```\n\n此示例创建一个`JComboBox`组件，提供六种用户可选择的选择。选择一个项目后，它会出现在组件的显示区域。图\
  \ 13.5 显示了当选择列表的弹出菜单正在显示时的示例。\n\n![图片](img/image00515.jpeg)\n**图 13.5** 显示组合框组件。\n\
  \n要使`JComboBox`组件能够接收文本输入，必须使用参数`true`调用其`setEditable(boolean)`方法：\n\n```java\n\
  profession.setEditable(true);\n```\n\n必须在将组件添加到容器之前调用此方法。\n\n#### 文本区域\n\n`JTextArea`组件是一个允许用户输入多行文本的文本字段。您可以指定组件的宽度和高度。以下语句创建一个宽度为\
  \ 40 个字符、高度为 8 行的`JTextArea`组件，并将其添加到容器中：\n\n点击此处查看代码图片\n\n```java\nJTextArea comments\
  \ = new JTextArea(8, 40);\nFlowLayout flo = new FlowLayout();\nsetLayout(flo);\n\
  add(comments);\n```\n\n图 13.6 显示了在框架中的此示例。\n\n![图片](img/image00516.jpeg)\n**图 13.6**\
  \ 显示文本区域组件。\n\n您可以在`JTextArea()`构造函数中指定要在文本区域中显示的字符串，使用换行符`\\n`将文本发送到下一行，如以下所示：\n\
  \n\n\n\n\n# 使用 JTextArea 和 JScrollPane\n\n点击此处查看代码图片\n\n```java\nJTextArea comments\
  \ = new JTextArea(\"I should have been a pair\\n\"\n    + \"of ragged claws.\",\
  \ 10, 25);\n```\n\n文本区域有两个方法可以用来指定当用户输入的文本超过一行右边缘时组件的行为。调用 `setLineWrap(boolean)`\
  \ 方法，并传入 `true` 参数，可使文本自动换行到下一行：\n\n点击此处查看代码图片\n\n```java\ncomments.setLineWrap(true);\n\
  ```\n\n要确定文本如何换行到下一行，请使用 `setWrapStyleWord(boolean)` 方法。传入 `true` 参数表示根据单词边界换行，传入\
  \ `false` 表示根据字符换行。\n\n如果未调用这些方法，文本将不会自动换行。用户可以在同一行持续输入文本，直到按下 Enter 键或超过区域的右边缘。\n\
  \n文本区域组件的行为可能出乎你的意料——当用户到达区域底部时，它们会扩大尺寸，并且不会在右侧或底部边缘包含滚动条。为了使其表现更符合预期，你必须将文本区域放入一个称为滚动窗格的容器中。\n\
  \nGUI 中的组件通常大于可用于显示它们的区域。为了使组件能够从一个部分移动到另一个部分，你需要使用垂直和水平滚动条。\n\n在 Swing 中，通过将组件添加到滚动窗格（由\
  \ `JScrollPane` 类表示）来支持滚动。\n\n你可以使用以下构造函数创建滚动窗格：\n\n![Image](img/image00476.jpeg)\
  \ `JScrollPane()`——创建一个根据需要显示水平和垂直滚动条的滚动窗格。\n\n![Image](img/image00476.jpeg) `JScrollPane(int,\
  \ int)`——创建一个带有指定垂直和水平滚动条的滚动窗格。\n\n![Image](img/image00476.jpeg) `JScrollPane(Component)`——创建一个包含指定用户界面组件的滚动窗格。\n\
  \n![Image](img/image00476.jpeg) `JScrollPane(Component, int, int)`——创建一个带有指定组件、垂直滚动条和水平滚动条的滚动窗格。\n\
  \n这些构造函数的整数参数决定窗格中滚动条的使用方式。请使用以下类变量作为这些参数：\n\n![Image](img/image00476.jpeg) `JScrollPane.VERTICAL_SCROLLBAR_AS_NEEDED`\
  \ 或 `JScrollPane.HORIZONTAL_SCROLLBAR_AS_NEEDED`\n\n![Image](img/image00476.jpeg)\
  \ `JScrollPane.VERTICAL_SCROLLBAR_NEVER` 或 `JScrollPane.HORIZONTAL_SCROLLBAR_NEVER`\n\
  \n![Image](img/image00476.jpeg) `JScrollPane.VERTICAL_SCROLLBAR_ALWAYS` 或 `JScrollPane.HORIZONTAL_SCROLLBAR_ALWAYS`\n\
  \n如果你创建了一个没有包含组件的滚动窗格，可以使用窗格的 `add(Component)` 方法来添加组件。完成滚动窗格的设置后，应该将其添加到容器中以代替原来的组件。\n\
  \n以下是前一个示例的改写版，将文本区域放入滚动窗格中：\n\n点击此处查看代码图片\n\n```java\nFlowLayout flo = new FlowLayout();\n\
  setLayout(flo);\nJTextArea comments = new JTextArea(8, 40);\ncomments.setLineWrap(true);\n\
  comments.setWrapStyleWord(true);\nJScrollPane scroll = new JScrollPane(comments,\n\
  \    JScrollPane.VERTICAL_SCROLLBAR_ALWAYS,\n    JScrollPane.HORIZONTAL_SCROLLBAR_NEVER);\n\
  add(scroll);\n```\n\n图 13.7 展示了这个示例在框架中的效果。\n\n![Image](img/image00517.jpeg)\n\n\
  **图 13.7** 在滚动窗格容器中显示文本区域组件。\n\n## 面板 (Panels)\n\n在本小时中你将学习创建的最后一个组件是面板，在 Swing\
  \ 中使用 `JPanel` 类创建。`JPanel` 对象是图形用户界面中最简单的容器。`JPanel` 对象的目的是将显示区域细分为不同的组件组。当显示区域被划分为多个部分时，你可以在每个部分使用不同的布局管理器。\n\
  \n以下语句创建一个 `JPanel` 对象并为其分配一个布局管理器：\n\n点击此处查看代码图片\n\n```java\nJPanel topRow = new\
  \ JPanel();\nFlowLayout flo = new FlowLayout();\ntopRow.setLayout(flo);\nadd(topRow);\n\
  ```\n\n在安排界面中的组件时经常使用面板，如你在 第 14 小时, “布局用户界面” 中所见。\n\n通过调用面板的 `add()` 方法来添加组件。通过调用面板的\
  \ `setLayout()` 方法可以直接为面板分配布局管理器。\n\n当你需要界面中有一个区域来绘制某些内容（例如来自图形文件的图像）时，也可以使用面板。\n\
  \n`JPanel` 的另一个便捷用途是创建你自己的组件，这些组件可以添加到其他类中。这将在本小时的最终项目中进行演示。\n\n## 创建你自己的组件\n\n\
  面向对象编程（OOP）的一个优势是能够在不同项目中重用类。在下一个项目中，你将创建一个特殊的面板组件，该组件可以在其他 Java 程序中重用。组件 `FreeSpacePanel`\
  \ 报告运行应用程序的计算机上可用的磁盘空间。该面板显示可用空间量、总空间量以及可用空间的百分比。\n\n创建自己的用户界面组件的第一步是决定从哪个现有组件继承。你的新组件将拥有该现有组件的所有属性和行为，除非你对其进行修改或添加任何新内容。\n\
  \n`FreeSpacePanel` 组件是 清单 13.3 中定义的 `JPanel` 的子类。将 清单 13.3 中的文本输入到一个新的空 Java 文件中并保存该文件。\n\
  \n### 清单 13.3 `FreeSpacePanel.java` 的完整文本\n\n点击此处查看代码图片\n\n* * *\n\n```java\n1:\
  \ package com.java24hours;\n2: \n3: import java.io.IOException;\n4: import java.nio.file.*;\n\
  5: import javax.swing.*;\n6: \n7: public class FreeSpacePanel extends JPanel {\n\
  8:     JLabel spaceLabel = new JLabel(\"Disk space: \");\n9:     JLabel space =\
  \ new JLabel();\n10: \n11:     public FreeSpacePanel() {\n12:         super();\n\
  13:         add(spaceLabel);\n14:         add(space);\n15:         try {\n16:  \
  \           setValue();\n17:         } catch (IOException ioe) {\n18:          \
  \   space.setText(\"Error\");\n19:         }\n20:     }\n21: \n22:     private final\
  \ void setValue() throws IOException {\n23:         // get the current file storage\
  \ pool\n24:         Path current = Paths.get(\"\");\n25:         FileStore store\
  \ = Files.getFileStore(current);\n26:         // find the free storage space\n27:\
  \         long totalSpace = store.getTotalSpace();\n28:         long freeSpace =\
  \ store.getUsableSpace();\n29:         // get this as a percentage (with two digits)\n\
  30:         double percent = (double)freeSpace / (double)totalSpace * 100;\n31:\
  \         percent = (int)(percent * 100) / (double)100;\n32:         // set the\
  \ label's text\n33:         space.setText(freeSpace + \" free out of \" + totalSpace\
  \ + \" (\"\n34:             + percent + \"%)\");\n35: \n36:      }\n37: }\n```\n\
  \n* * *\n\n这个类是一个组件，当你想显示有关可用磁盘空间的信息时，可以将其添加到任何图形用户界面中。它不能作为应用程序独立运行。\n\n`FreeSpacePanel`\
  \ 中的 `setValue()` 方法设置显示磁盘空间信息的标签文本。此方法在第 22 行声明时包含关键字 `final`：\n\n点击此处查看代码图片\n\n\
  ```java\nprivate final void setValue() {\n    // ...\n}\n```\n\n在方法声明中包含 `final`\
  \ 关键字可以防止该方法在子类中被重写。`FreeSpacePanel` 要成为 GUI 组件，这是必需的。\n\n该面板是在第 11-20 行的构造函数中创建的。以下情况正在发生：\n\
  \n\n\n\n\n![Image](img/image00476.jpeg) 第 12 行——`super()`方法调用`JPanel`类的构造方法，确保其被正确初始化。\n\
  \n![Image](img/image00476.jpeg) 第 13 行——新标签`spaceLabel`，其文本为“Disk space:”并在第 8 行被创建为实例变量，通过调用`add(Component)`方法（将标签作为参数）被添加到面板中。\n\
  \n![Image](img/image00476.jpeg) 第 14 行——第 9 行创建的无文本实例变量`space`标签也被添加到面板中。\n\n![Image](img/image00476.jpeg)\
  \ 第 16 行——调用`setValue()`方法，该方法设置`space`标签的文本。\n\n第 16 行对`setValue()`的调用被包含在另一个`try`-`catch`块中，类似于设置外观时所使用的结构。你将在第\
  \ 18 小时学习更多关于错误处理的内容，但这里有个简要说明：`try`-`catch`使得处理 Java 程序中可能发生的一个或多个错误成为可能。\n\n*\
  \ * *\n\n**注意**\n\n“TLDR”是“too long; didn’t read”（太长不读）的首字母缩写，当人们在互联网上为不想阅读完整长文的读者提供极简要的摘要时使用它。\n\
  \n我希望这本书对你而言不是 TLDR。我们努力让它成为 JRLRWTANIRJP（just-right length; read whole thing and\
  \ now I’m rich Java programmer，意为“长度刚刚好；读完整本，我现在是富有的 Java 程序员”）。\n\n* * *\n\n这是必要的，因为调用`setValue()`在访问计算机文件系统以查看剩余空间时可能会导致错误。Java\
  \ 中有其自己的错误类`IOException`，代表输入/输出错误。\n\n`try`块包含可能导致错误的代码。`catch`块在括号内指定错误类型，以及发生该错误时要执行的代码。\n\
  \n如果在应用运行时遇到此类错误，第 18 行会将`space`标签的文本设置为“Error”，以告知用户出现了问题。\n\n要让自定义组件执行有趣的功能，需要快速了解\
  \ Java 文件处理，该主题将在第 21 小时“读写文件”中详细介绍。\n\n要计算计算机磁盘的可用空间，你需要使用`java.nio.file`包中的四个类，该包用于访问计算机的文件系统。\n\
  \n`Path`对象表示文件或文件夹的位置。`Paths`类有一个`get(String)`方法，它将字符串转换为匹配该字符串的路径。当用“”（空字符串）调用时，它返回\
  \ Java 应用程序运行所在的当前文件夹的路径：\n\n`Path current = Paths.get(\"\");`\n\n磁盘的存储信息在 Java\
  \ 中由`FileStore`对象表示，它是一个文件存储池。获得路径后，你可以使用`Files`类中的一个方法获取该路径所在的文件存储。调用`Files`的`getFileStore(Path)`方法来检索该文件存储池：\n\
  \n```\nFileStore store = Files.getFileStore(current);\n```\n\n有了这个存储池，你现在可以调用它的`getTotalSpace()`和`getUsableSpace()`方法来查明当前磁盘上有多少可用空间：\n\
  \n```\nlong totalSpace = store.getTotalSpace();\nlong freeSpace = store.getUsableSpace();\n\
  double percent = (double)freeSpace / (double)totalSpace * 100;\n```\n\n* * *\n\n\
  **警告**\n\n计算百分比的表达式包含许多对`double`的引用，这可能看起来很奇怪。后两个转换在`freeSpace`和`totalSpace`变量在表达式中使用前，将它们转换为`double`值。这对于防止表达式产生整数值而非所需的浮点数是必要的。Java\
  \ 根据表达式中的类型来确定表达式结果的数据类型。一个`long`除以一个`long`再乘以整数 100 将产生一个`long`，而不是所需的百分比。\n\n\
  * * *\n\n最后一条语句计算出的百分比可能具有小数点后极长的数字，例如 64.8675309。\n\n以下表达式将`double`百分比转换为最多两位小数：\n\
  \n```\npercent = (int)(percent * 100) / (double)100;\n```\n\n表达式的前半部分将百分比乘以 100——将小数点向右移动两位——然后将其转换为整数，因此\
  \ 64.8675309 变成 6487。\n\n第二部分将其除以 100——将小数点向左移动两位——以恢复百分比的近似值。这将 6486 变为 64.86。\n\
  \n百分比被限制在两位小数后，就可以设置标签的文本来报告可用和已用磁盘空间：\n\n```\nspace.setText(freeSpace + \" free\
  \ out of \" + totalSpace + \" (\"\n    + percent + \"%)\");\n```\n\n除非添加到图形用户界面中，否则无法看到你刚刚创建的面板。要试用`FreeSpacePanel`，请按照清单\
  \ 13.4 创建`FreeSpaceFrame`应用程序。为一个名为`FreeSpaceFrame`的类输入新的文本文件。\n\n**清单 13.4 `FreeSpaceFrame.java`的完整代码**\n\
  \n```\npackage com.java24hours;\n\nimport java.awt.*;\nimport javax.swing.*;\n\n\
  public class FreeSpaceFrame extends JFrame {\n    public FreeSpaceFrame() {\n  \
  \      super(\"Disk Free Space\");\n        setLookAndFeel();\n        setSize(500,\
  \ 100);\n        setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n        FlowLayout\
  \ flo = new FlowLayout();\n        setLayout(flo);\n        FreeSpacePanel freePanel\
  \ = new FreeSpacePanel();\n        add(freePanel);\n        setVisible(true);\n\
  \    }\n\n    private void setLookAndFeel() {\n        try {\n            UIManager.setLookAndFeel(\n\
  \                \"com.sun.java.swing.plaf.nimbus.NimbusLookAndFeel\"\n        \
  \    );\n        } catch (Exception exc) {\n            // ignore error\n      \
  \  }\n    }\n\n    public static void main(String[] arguments) {\n        FreeSpaceFrame\
  \ frame = new FreeSpaceFrame();\n    }\n}\n```\n\n此应用程序在第 14 行创建`FreeSpacePanel`组件，并在第\
  \ 15 行将其添加到其框架中。\n\n运行该应用程序时，应类似于图 13.8，显示来自你自己计算机的值。\n\n![Image](img/image00518.jpeg)\n\
  \n**图 13.8** 显示自定义磁盘空间组件。\n\n### 总结\n\n用户已经期待他们运行的程序提供点击式、可视化的环境。这种期望使得创建软件更具挑战性，但\
  \ Java 通过 Swing 将这些能力交到你手中，无论你使用何种设置运行 Java 程序，Swing 都提供了构建一个可用、实用的图形用户界面所需的所有类。\n\
  \n使用 Swing 开发图形化 Java 应用程序是实践面向对象编程的好方法。每个组件、容器和布局管理器都由其自己的对象类表示。其中许多类从相同的超类继承其公共行为。例如，本小时介绍的所有用户界面组件都是`javax.swing.JComponent`的子类。\n\
  \n在下一个小时，你将学习更多关于图形用户界面设计的内容，届时你将使用新的布局管理器，这些管理器可以以比`FlowLayout`更复杂的方式指定组件在容器中的位置。\n\
  \n### 研讨会\n\n#### 问答\n\n**问：** 如果我不给容器分配布局管理器，组件将如何排列？\n\n\n\n\n\n#### A. 在像面板这样的简单容器中，默认使用\
  \ `FlowLayout` 来排列组件。每个组件的添加方式类似于英文在页面上的显示方式：从左到右，当没有剩余空间时，就移到下一行。框架、窗口和小程序使用下一节你将学习到的\
  \ `BorderLayout` 默认布局样式。\n\n#### 问：为什么很多图形用户界面类的名称都以“J”开头，比如 `JFrame` 和 `JLabel`？\n\
  \n#### 答：这些类是 Swing 框架的一部分，这是 Java 类库中第二次尝试构建图形用户界面类。第一次是抽象窗口工具包（AWT），它的类名更简单，比如\
  \ `Frame` 和 `Label`。\n\nAWT 类属于 `java.awt` 包及相关包，而 Swing 类属于 `javax.swing` 等包，因此它们可能具有相同的类名。使用“J”开头的名称可以避免将这些类相互混淆。\n\
  \nSwing 类也被称为 Java 基础类（JFC）。\n\n#### 问：在哪里可以买到一整版未裁切的 1 美元纸币？\n\n#### 答：美国雕刻和印刷局在其网站\
  \ [www.moneyfactorystore.gov](http://www.moneyfactorystore.gov) 上出售真实的 1 美元、10 美元、20\
  \ 美元和 50 美元纸币整版。\n\n一版包含 32 张 1 美元纸币，售价 61 美元；16 张 10 美元纸币，售价 249 美元；16 张 20 美元纸币，售价\
  \ 409 美元；16 张 50 美元纸币，售价 900 美元。因为这些钱是真实货币，所以如果你算上这些纸币的面值，这些购买实际上更便宜。购买 1 美元纸币你额外支付了\
  \ 29 美元，10 美元的是 89 美元，20 美元的也是 89 美元，50 美元的则是 100 美元。\n\n还有一个五磅重的袋子，里面装有价值 10,000\
  \ 美元的碎纸币，售价 45 美元。\n\n该局是唯一承认自己在“挥霍金钱”的美国政府机构。\n\n### 小测验\n\n如果经过这一小时的学习，你的大脑还没有变成一团图形用户界面的浆糊，那就通过回答以下问题来测试一下你的技能。\n\
  \n**1.** 哪个用户组件被用作容器来容纳其他组件？\n\n- A. TupperWare\n- B. `JPanel`\n- C. Choice\n\n\
  **2.** 在容器内部，必须首先完成以下哪项操作？\n\n- A. 建立布局管理器\n- B. 添加组件\n- C. 没关系\n\n**3.** 哪个方法决定了组件在容器内的排列方式？\n\
  \n- A. `setLayout()`\n- B. `setLayoutManager()`\n- C. `setVisible()`\n\n### 答案\n\
  \n**1. B.** `JPanel`。你可以将组件添加到面板，然后再将面板添加到另一个容器（如框架）中。\n\n**2. A.** 你必须在添加组件之前指定布局管理器，这样才能以正确的方式添加它们。\n\
  \n**3. A.** `setLayout()` 方法接受一个参数：负责决定组件显示位置的布局管理器对象。\n\n### 实践活动\n\n为了进一步了解 GUI\
  \ 设计主题，请进行以下活动：\n\n![Image](img/image00476.jpeg) 修改 `SalutonFrame` 应用程序，使其在框架的主区域显示\
  \ “Saluton Mondo!”，而不是在标题栏中。\n\n![Image](img/image00476.jpeg) 增强 `FreeSpacePanel`\
  \ 组件，在磁盘大小数字中每隔三位显示一个逗号。一种实现方式是使用 `StringBuilder` 对象、`String` 类的 `charAt(`int`)`\
  \ 方法以及 `for` 循环来遍历字符串。\n\n要查看实现这些活动的 Java 程序，请访问本书网站 [www.java24hours.com](http://www.java24hours.com)。\n\
  \n# 第 14 小时：布局用户界面\n\n本小时待办事项清单：\n\n![Image](img/image00474.jpeg) 创建布局管理器。\n\n![Image](img/image00474.jpeg)\
  \ 为容器分配布局管理器。\n\n![Image](img/image00474.jpeg) 使用面板在界面中组织组件。\n\n![Image](img/image00474.jpeg)\
  \ 处理特殊布局。\n\n![Image](img/image00474.jpeg) 为 Java 应用程序创建原型。\n\n当你开始为 Java 程序设计图形用户界面（GUI）时，你会遇到一个障碍，那就是你的组件可能会移动。每当容器改变大小时——例如当用户调整框架大小时——它所容纳的组件可能会重新排列自身以适应新的尺寸。\n\
  \n这种流动性对你有利，因为它考虑到了界面组件在不同操作系统上显示方式的差异。一个可点击按钮在 Windows 上的外观可能与在 Linux 或 Mac OS\
  \ 上不同。\n\n界面中的组件是通过使用一组称为布局管理器的类来组织的。这些类定义了组件在容器内的显示方式。界面中的每个容器都可以有自己的布局管理器。\n\n\
  ### 使用布局管理器\n\n在 Java 中，组件在容器内的放置取决于组件的大小、其他组件的大小以及容器的高度和宽度。按钮、文本字段和其他组件的布局可能受以下因素影响：\n\
  \n![Image](img/image00476.jpeg) 容器的大小\n\n![Image](img/image00476.jpeg) 其他组件和容器的大小\n\
  \n![Image](img/image00476.jpeg) 正在使用的布局管理器\n\n你可以使用几种布局管理器来影响组件的显示方式。面板的默认管理器是 `java.awt`\
  \ 包中的 `FlowLayout` 类，上一小时我们已经使用过它。\n\n在 `FlowLayout` 下，组件被放置到区域的方式与单词在英文页面上排列的方式相同——从左到右，当没有空间时，移到下一行。\n\
  \n以下示例可用于框架，以便在添加组件时使用流式布局：\n\n点击此处查看代码图片\n\n```java\nFlowLayout topLayout = new\
  \ FlowLayout();\nsetLayout(topLayout);\n```\n\n你也可以为特定容器（如 `JPanel` 对象）设置布局管理器。可以通过使用该容器对象的\
  \ `setLayout()` 方法来完成。\n\n`Crisis` 应用程序有一个包含五个按钮的 GUI。为名为 `Crisis` 的类创建一个新的 Java\
  \ 文件。将 清单 14.1 中的文本输入到文件中并保存。\n\n**清单 14.1** `Crisis.java` 的完整代码\n\n点击此处查看代码图片\n\
  \n```java\npackage com.java24hours;\n\nimport java.awt.*;\nimport javax.swing.*;\n\
  \npublic class Crisis extends JFrame {\n    JButton panicButton;\n    JButton dontPanicButton;\n\
  \    JButton blameButton;\n    JButton mediaButton;\n    JButton saveButton;\n\n\
  \    public Crisis() {\n        super(\"Crisis\");\n        setLookAndFeel();\n\
  \        setSize(348, 128);\n        setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n\
  \        FlowLayout flo = new FlowLayout();\n        setLayout(flo);\n        panicButton\
  \ = new JButton(\"Panic\");\n        dontPanicButton = new JButton(\"Don't Panic\"\
  );\n        blameButton = new JButton(\"Blame Others\");\n        mediaButton =\
  \ new JButton(\"Notify the Media\");\n        saveButton = new JButton(\"Save Yourself\"\
  );\n        add(panicButton);\n        add(dontPanicButton);\n        add(blameButton);\n\
  \        add(mediaButton);\n        add(saveButton);\n        setVisible(true);\n\
  \    }\n\n    private void setLookAndFeel() {\n        try {\n            UIManager.setLookAndFeel(\n\
  \                \"com.sun.java.swing.plaf.nimbus.NimbusLookAndFeel\"\n        \
  \    );\n        } catch (Exception exc) {\n            // ignore error\n      \
  \  }\n    }\n\n    public static void main(String[] arguments) {\n        Crisis\
  \ frame = new Crisis();\n    }\n}\n```\n\n图 14.1 展示了运行中的应用程序。\n\n![Image](img/image00519.jpeg)\n\
  \n\n\n\n\n# **图 14.1** 使用流式布局排列组件。\n\n`FlowLayout` 类使用其容器的尺寸作为布局组件的唯一准则。调整应用程序窗口大小，可以看到组件是如何立即重新排列的。将窗口宽度加倍，你会看到所有的\
  \ `JButton` 组件现在都显示在了同一行。\n\n## 网格布局（`GridLayout`）管理器\n\n`java.awt` 包中的 `GridLayout`\
  \ 类将容器中的所有组件组织成指定数量的行和列。所有组件在显示区域中被分配相同大小的空间，因此，如果你指定一个三列三行的网格，容器将被划分为九个大小相等的区域。\n\
  \n`GridLayout` 会将所有添加进来的组件放置在网格上的一个位置。组件从左到右依次添加，直到一行填满，然后开始填充下一网格的最左列。\n\n以下语句创建了一个容器，并将其设置为使用两行三列的网格布局：\n\
  \n点击此处查看代码图片\n\n```java\nGridLayout grid = new GridLayout(2, 3);\n\nsetLayout(grid);\n\
  ```\n\n图 14.2 展示了如果 `Crisis` 应用程序使用网格布局会是什么样子。\n\n![Image](img/image00520.jpeg)\n\
  \n**图 14.2** 使用网格布局排列组件。\n\n图 14.2 中的一个标签显示的文本被缩短了。如果文本宽度超过了组件可用区域的宽度，标签文本会使用省略号（...）进行截断。\n\
  \n***\n\n**注意**\n\n本书网站包含了 `Crisis` 应用程序的修改版本，用于演示本节介绍的每种布局管理器，首先是 `CrisisGridDemo.java`\
  \ 来展示网格布局。要查看其源代码，请访问 [www.java24hours.com](http://www.java24hours.com)，点击你书籍的封面，并导航到\
  \ 第 14 小时 页面。\n\n***\n\n## 边界布局（`BorderLayout`）管理器\n\n同样位于 `java.awt` 包中的 `BorderLayout`\
  \ 类，将组件排列在容器内的特定位置，这些位置由五个方向之一标识：北、南、东、西或中。\n\n`BorderLayout` 管理器将组件排列到五个区域：四个由罗盘方向表示，一个用于中心区域。当你在此布局下添加组件时，`add()`\
  \ 方法包含第二个参数来指定组件应放置的位置。此参数应为 `BorderLayout` 类的五个类变量之一：此参数使用 `NORTH`、`SOUTH`、`EAST`、`WEST`\
  \ 和 `CENTER`。\n\n与 `GridLayout` 类一样，`BorderLayout` 将所有可用空间分配给组件。放置在中心的组件会获得未被四个边界组件占用的所有空间，因此它通常是最大的。\n\
  \n以下语句创建了一个使用边界布局的容器：\n\n点击此处查看代码图片\n\n```java\nBorderLayout crisisLayout = new\
  \ BorderLayout();\n\nsetLayout(crisisLayout);\n\nadd(panicButton, BorderLayout.NORTH);\n\
  \nadd(dontPanicButton, BorderLayout.SOUTH);\n\nadd(blameButton, BorderLayout.EAST);\n\
  \nadd(mediaButton, BorderLayout.WEST);\n\nadd(saveButton, BorderLayout.CENTER);\n\
  ```\n\n图 14.3 展示了这在 `Crisis` 应用程序中的样子。\n\n![Image](img/image00521.jpeg)\n\n**图 14.3**\
  \ 使用边界布局排列组件。\n\n## 箱式布局（`BoxLayout`）管理器\n\n另一个便捷的布局管理器，`javax.swing` 包中的 `BoxLayout`，使得在单行中水平或垂直堆叠组件成为可能。\n\
  \n要使用此布局，首先创建一个用于容纳组件的面板，然后使用两个参数创建一个布局管理器：\n\n- 使用箱式布局组织的组件\n- 值 `BoxLayout.Y_AXIS`\
  \ 用于垂直对齐，`BoxLayout.X_AXIS` 用于水平对齐\n\n以下是堆叠 `Crisis` 组件的代码：\n\n点击此处查看代码图片\n\n```java\n\
  JPanel pane = new JPanel();\n\nBoxLayout box = new BoxLayout(pane, BoxLayout.Y_AXIS);\n\
  \npane.setLayout(box);\n\npane.add(panicButton);\n\npane.add(dontPanicButton);\n\
  \npane.add(blameButton);\n\npane.add(mediaButton);\n\npane.add(saveButton);\n\n\
  add(pane);\n```\n\n图 14.4 展示了最终结果。\n\n![Image](img/image00522.jpeg)\n\n**图 14.4**\
  \ 使用箱式布局堆叠组件。\n\n### 使用内边距（Insets）分隔组件\n\n在容器内排列组件时，你可以使用 `Insets` 将组件从容器边缘移开，`Insets`\
  \ 是一个表示容器边框区域的对象。\n\n`Insets` 类是 `java.awt` 包的一部分，它有一个构造函数接受四个参数：在容器 `top`、`left`、`bottom`\
  \ 和 `right` 方向要留出的空间。每个参数都使用像素指定，这与定义框架大小时使用的度量单位相同。\n\n以下语句创建了一个 `Insets` 对象：\n\
  \n点击此处查看代码图片\n\n```java\nInsets around = new Insets(10, 6, 10, 3);\n```\n\n`around`\
  \ 对象表示一个容器边框，其顶部边缘内缩 10 像素，左侧内缩 6 像素，底部内缩 10 像素，右侧内缩 3 像素。\n\n要在容器中使用 `Insets` 对象，你必须重写容器的\
  \ `getInsets()` 方法。此方法没有参数并返回一个 `Insets` 对象，如下例所示：\n\n点击此处查看代码图片\n\n```java\npublic\
  \ Insets getInsets() {\n\n    Insets squeeze = new Insets(50, 15, 10, 15);\n\n \
  \   return squeeze;\n\n}\n```\n\n图 14.5 展示了这将如何改变图 14.1 中展示的由 `FlowLayout` 管理的界面。\n\
  \n![Image](img/image00523.jpeg)\n\n**图 14.5** 使用内边距在组件周围添加空间。\n\n图 14.5 中显示的容器有一个空白边框，其左侧边缘内缩\
  \ 15 像素，底部边缘内缩 10 像素，右侧边缘内缩 15 像素，顶部边缘内缩 50 像素。\n\n***\n\n**注意**\n\n`JFrame` 容器有一个内置内边距，以便为框架的标题栏留出空间。当你重写\
  \ `getInsets()` 并设置自己的值时，过小的内边距值会导致容器在标题栏下方显示组件。\n\n***\n\n### 为应用程序进行布局\n\n到目前为止，你看到的布局管理器都应用于整个框架；使用了框架的\
  \ `setLayout()` 方法，所有组件都遵循相同的规则。这种设置对于某些程序可能是合适的，但当你尝试使用 Swing 开发 GUI 时，经常会发现没有任何一种布局管理器完全适合。\n\
  \n解决这个问题的一种方法是使用一组 `JPanel` 对象作为容器，来容纳 GUI 的不同部分。你可以通过使用每个 `JPanel` 的 `setLayout()`\
  \ 方法为这些部分设置不同的布局规则。在这些面板包含了它们需要包含的所有组件之后，你可以将这些面板直接添加到框架中。\n\n下一个项目将为下一小时编写的程序开发一个完整的界面。该程序是一个彩票号码分析器，它评估用户在一生中赢得百万美元级彩票大奖的机会。这个机会是通过反复运行随机六号码彩票抽奖，直到用户的号码作为大奖得主出现来确定的。图\
  \ 14.6 展示了你正在为该应用程序开发的 GUI。\n\n![Image](img/image00524.jpeg)\n\n**图 14.6** 显示 `LottoMadness`\
  \ 应用程序的 GUI。\n\n创建一个名为 `LottoMadness` 的新 Java 文件，将清单 14.2 中的文本输入到源代码编辑器中，并保存该文件。\n\
