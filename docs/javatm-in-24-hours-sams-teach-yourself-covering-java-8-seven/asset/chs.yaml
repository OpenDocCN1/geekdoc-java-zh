  Lambda 表达式支持函数式编程，这是一种软件设计方法论，直到现在才为 Java 程序员所用。\n\n本节介绍了 lambda 表达式的基本语法以及在程序中使用的两种更常见的方式。\n\
  \n但 Java 中的函数式编程是一个如此强大且具有革命性的话题，以至于它是一些整本书的主题。\n\n此时，你应该能够识别 lambda 表达式，并使用它们来实现任何单方法接口，也称为函数式接口。\n\
  \n### 总结\n\n内部类、匿名内部类和 lambda 表达式是 Java 语言中最复杂的部分之一。它们主要吸引那些已经用该语言编写了一段时间程序的程序员，他们可以利用强大的功能在更少的代码行中完成更多工作。\n\
  \n但即使在你能编写自己的 lambda 表达式之前，你也应该能够从使用内部类和匿名内部类中受益。\n\n非匿名内部类的结构类似于一个单独的辅助类，但它被放置在另一个类内部，与实例变量、类变量、实例方法和类方法并列。与辅助类不同，它可以访问其创建所在的类的私有变量和方法。\n\
  \n匿名内部类消除了仅为使用一次的类分配对象的需要，例如附加到 Swing 中用户界面组件的事件监听器。\n\n\n\n\n\nLambda 表达式的外观看似简单，仅需使用新的箭头运算符`->`即可创建，但它们为\
  \ Java 程序员带来的功能扩展却极为深远。其他编程语言的使用者多年来一直强烈要求增加这一特性。\n\n### 讲堂\n\n#### 问与答\n\n**问：**\
  \ 匿名内部类令人困惑。我在程序中是否必须使用它们？\n\n**答：** 不必。与 Java 语言的其他复杂特性一样，如果有其他方法能完成任务，你并非必须使用它们。\n\
  \n不过你还是应该了解它们，因为你很可能会在 Java 代码中遇到它们。\n\n当有经验的程序员编写的 Java 程序时，你常会发现内部类和匿名内部类并存。因此，即使你目前还不准备自己创建它们，学习它们是什么以及如何工作也是值得的。\n\
  \n**问：** 哈特菲尔德家族和麦科伊家族还在争吵吗？\n\n**答：** 在这场长达 35 年、臭名昭著的冲突最后一次造成伤亡的 124 年后，西弗吉尼亚州和肯塔基州的这两个家族如今已和睦相处。\n\
  \n1979 年，哈特菲尔德和麦科伊两家人曾一起参加为期一周的电视游戏节目*家庭问答*。舞台上放着一头猪，并将其作为奖品授予获胜的家庭。\n\n2003 年，两家人在肯塔基州派克维尔正式签署了和平协议。\n\
  \n哈特菲尔德-麦科伊小径（Hatfield-McCoy Trails）是一条长 500 英里的越野休闲驾驶路线，于 2000 年在西弗吉尼亚州设立，并在随后的十年中不断扩展。\n\
  \n#### 小测验\n\n为了检验你是否掌握了本小时内所学的知识，可以凭此向班级前列走去。请回答以下关于内部类、匿名内部类和 lambda 表达式的问题。\n\
  \n**1.** 是什么使得某些内部类是匿名的？\n\n**A.** 它们实现了一个接口。\n\n**B.** 它们没有被赋予名称。\n\n**C.** 两者都是。\n\
  \n**2.** 只包含一个方法的接口还有另一个名字叫什么？\n\n**A.** 抽象接口\n\n**B.** 类\n\n**C.** 函数式接口\n\n**3.**\
  \ 当 lambda 表达式推断出方法参数的类时，这称为什么？\n\n**A.** 目标类型\n\n**B.** 类型转换\n\n**C.** 类推断\n\n\
  #### 答案\n\n**1. C.** 匿名内部类使用`new`关键字实现一个接口，跳过了为实现该接口的类创建和命名的步骤。\n\n**2. C.** 函数式接口（自\
  \ Java 8 起）。在该语言的早期版本中，它们被称为单一抽象方法接口。\n\n**3. A.** 目标类型可以推断任何函数式接口方法参数的类。\n\n####\
