  \ 类，用来处理 `InterruptedException`，这样其他类如 `LottoEvent` 就无需处理它们。\n\n要查看实现这些活动的 Java\
  \ 程序，请访问本书网站：[www.java24hours.com](http://www.java24hours.com)。\n\n## Hour 19. 创建线程程序\n\
  \n**本小时待办事项：**\n\n![Image](img/image00474.jpeg) 在程序中使用一个接口。\n![Image](img/image00474.jpeg)\
  \ 创建线程。\n![Image](img/image00474.jpeg) 启动、停止和暂停线程。\n![Image](img/image00474.jpeg)\
  \ 捕获错误。\n\n一个常被用来描述日常生活忙碌节奏的计算机术语是 `multitasking`（多任务），它意味着一次做多件事——比如坐在办公桌前浏览网页的同时，参加电话会议并做提臀运动。一个支持多任务的计算机能够同时运行多个程序。\n\
  \nJava 语言的一个高级特性是能够编写可以同时处理多个任务的程序，这通过一种称为线程（`Thread`）的对象类实现。\n\n### 线程\n\n在 Java\
  \ 程序中，计算机同时处理的每个任务称为一个线程（`Thread`），整个过程称为多线程（`multithreading`）。线程在动画和许多其他程序中非常有用。\n\
  \n线程是一种组织程序以同时处理多件事的方式。每个需要同时发生的任务都被放置在自己的线程中，这通常通过将每个任务实现为一个单独的类来完成。\n\n线程由 `Thread`\
  \ 类和 `Runnable` 接口表示，它们都属于 `java.lang` 类包。因为它们属于这个包，所以你无需使用 `import` 语句就能在程序中使用它们。\n\
  \n`Thread` 类最简单的用途之一是减慢程序执行某项操作的速度。\n\n#### 减慢程序速度\n\n`Thread` 类有一个 `sleep()` 方法，可以在任何需要暂停运行一小段时间的程序中调用。这种技术常用于带有动画的程序中，以防止图像显示速度快于\
  \ Java 解释器的处理能力。\n\n要使用 `sleep()` 方法，请调用 `Thread.sleep()` 并传入要暂停的毫秒数，如下语句所示：\n\n\
  `Thread.sleep(5000);`\n\n上一条语句会使 Java 虚拟机暂停 5 秒钟，然后再执行其他操作。如果由于某种原因 JVM 无法暂停那么长时间，`sleep()`\
  \ 方法会抛出 `InterruptedException`。\n\n因为这个异常可能会被抛出，所以在使用 `sleep()` 方法时必须以某种方式处理它。一种方法是将\
  \ `Thread.sleep()` 语句放在一个 `try`-`catch` 块中：\n\nClick here to view code image\n\n\
  ```java\ntry {\n\n    Thread.sleep(5000);\n\n} catch (InterruptedException e) {\n\
  \n    // 提前唤醒\n\n}\n```\n\n当你想让 Java 程序同时处理多件事情时，必须将程序组织成线程。你的程序可以拥有任意多的线程，它们可以同时运行而互不影响。\n\
  \n#### 创建线程\n\n一个可以作为线程运行的 Java 类被称为可运行（或线程化）类。虽然你可以使用线程来暂停程序的执行几秒钟，但程序员经常使用它们来达到相反的目的——加快程序速度。如果你将耗时任务放在它们自己的线程中，程序的其余部分会运行得更快。这通常用于防止单个任务降低程序图形用户界面（GUI）的响应速度。\n\
  \n例如，如果你编写了一个从磁盘加载股票市场价格数据并编译统计信息的应用程序，最耗时的任务是加载数据。如果在应用程序中不使用线程，当数据加载时，程序的界面可能会反应迟钝。这对用户来说会非常令人沮丧。\n\
  \n将任务放入自己线程的两种方式包括：\n\n![Image](img/image00476.jpeg) 将任务放在一个实现了 `Runnable` 接口的类中。\n\
  ![Image](img/image00476.jpeg) 将任务放在一个继承自 `Thread` 的子类中。\n\n为了支持 `Runnable` 接口，在创建类时使用\
  \ `implements` 关键字，如下例所示：\n\nClick here to view code image\n\n```java\npublic class\
  \ LoadStocks implements Runnable {\n\n    // 类的主体\n\n}\n```\n\n当一个类实现一个接口时，它表示该类除了自身的方法外，还包含一些额外的行为。\n\
  \n实现 `Runnable` 接口的类必须包含 `run()` 方法，其结构如下：\n\n```java\npublic void run() {\n\n \
  \  // 方法的主体\n\n}\n```\n\n`run()` 方法应该负责处理创建该线程所要完成的任务。在股票分析的例子中，`run()` 方法可以包含从磁盘加载数据并基于该数据编译统计信息的语句。\n\
  \n当一个线程化应用程序运行时，其 `run()` 方法中的语句不会自动执行。在 Java 中线程可以被启动和停止，一个线程在你做两件事之前不会开始运行：\n\n\
  ![Image](img/image00476.jpeg) 通过调用 `Thread` 构造函数创建线程类的对象。\n![Image](img/image00476.jpeg)\
  \ 通过调用其 `start()` 方法来启动线程。\n\n`Thread` 构造函数接受一个参数：包含该线程 `run()` 方法的对象。通常，你使用 `this`\
  \ 关键字作为参数，表示当前类包含 `run()` 方法。\n\n清单 19.1 包含一个 Java 应用程序，它在一个文本区域中显示一系列的质数。在 NetBeans\
