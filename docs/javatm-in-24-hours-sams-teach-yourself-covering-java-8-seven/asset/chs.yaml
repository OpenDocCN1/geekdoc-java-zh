  \n---\n\n运行应用程序并通过移动工具栏来尝试使用。你可以通过单击其控制柄并将工具栏拖动到文本区域的不同边缘来移动工具栏。释放工具栏后，它会沿着该边缘放置，文本区域会移动以为其腾出空间。\n\
  \n### 表格\n\n本小时介绍的最后一个用户界面组件是最复杂的。`JTable` 类表示一个以行和列形式呈现的表格信息。表格单元格中的信息可以被编辑，列可以重新排列，并且列可以调整大小以变宽或变窄。这听起来工作量很大，但所有这些都由类自动完成。该功能内置于属于\
  \ `javax.swing` 包的该类中。\n\n图 16.4 展示了一个 `JTable` 组件的示例。你将在本小时的最后一个项目中创建此表格。\n\n![Image](img/image00531.jpeg)\n\
  \n**图 16.4** 一个包含五行四列个人信息的表格。\n\n使用表格最简单的方法是将数据直接存储在表格中。\n\n采用此技术的第一步是创建一个包含每列名称的字符串数组，如以下代码所示：\n\
  \n```java\nString[] columnLabels = { \"First Name\", \"Last Name\",\n    \"Job\"\
  , \"Age\" };\n```\n\n表格的单元格可以具有不同的数据类型甚至对象。但是，每一列必须包含相同类型的内容。在你将要创建的项目中，每一行都有三个字符串（名、姓和职位）和一个表示年龄的整数。因此，从左到右，每一行应该有三个字符串和一个整数。\n\
  \n---\n\n> **注意**\n>\n> 你是否想知道像 50 或 16 这样的数字如何用于创建对象数组中的元素？此代码利用了 Java 执行装箱（boxing）和拆箱（unboxing）以在对象和相同值的原始数据类型之间自动转换的特性。整数字面量被装箱成代表相同值的\
  \ `Integer` 对象。\n\n---\n\n填充表格的下一步是创建一个二维对象数组，用于存储要放入其中的数据。完成此操作的代码看起来像你在第 9 小时，“使用数组存储信息”中使用的用于声明数组并赋予其由字面量定义的初始值的方式。`columnLabels`\
  \ 数组就是以这种方式创建的。\n\n以下是在 `Object[][]` 数组中创建表格数据的代码：\n\n```java\nObject[][] tableData\
  \ = {\n    {\n        \"Frankie\", \"Heck\", \"dental hygienist\", 50\n    },\n\
  \    {\n        \"Mike\", \"Heck\", \"quarry manager\", 51\n    },\n    {\n    \
  \    \"Axl\", \"Heck\", \"slacker\", 19\n    },\n    {\n        \"Sue\", \"Heck\"\
  , \"wrestlerette\", 16\n    },\n    {\n        \"Brick\", \"Heck\", \"reader\",\
  \ 12\n    }\n};\n```\n\n在一个跨多行的语句中，此代码创建了一个组织成四列五行的二维对象数组。每一行定义了关于特定人员的信息：字符串存储名、姓和职位，后面跟着该人年龄的整数。\n\
  \n代码中有很多空格和标点符号，因此请注意 `}` 闭合括号、`{` 开始括号和逗号放置的位置。空格无关紧要，但标点符号必须严格按照所示方式使用。\n\n数组的每一行被赋值为由逗号分隔的列表，并由开始和结束括号包围。以下是格式稍有不同的单行数据：\n\
  \n```java\n{ \"Sue\", \"Heck\", \"wrestlerette\", 16 }\n```\n\n为了让你更清楚地理解这定义了什么，它可用于创建一个一维对象数组的语句：\n\
  \n```java\nObject[] row1 = { \"Sue\", \"Heck\", \"wrestlerette\", 16 };\n```\n\n\
  对于二维数组，定义每一行的块由逗号分隔。因此有一个 `Frankie` 的块，后面跟着一个逗号和 `Mike` 的块，然后是逗号和 `Axl` 的块，逗号和 `Sue`\
  \ 的块，以及逗号和 `Brick` 的块。与 Java 代码中的任何逗号分隔列表一样，最后一项后面不需要逗号。\n\n现在你有了一个包含列名的字符串数组和一个包含表格数据的对象数组，可以使用数据和列名作为构造方法的参数来创建\
  \ `JTable` 对象：\n\n```java\nJTable table = new JTable(tableData, columnLabels);\n\
  ```\n\n表格通常包含的信息多于图形用户界面中可以显示的内容，因此它们应该放在支持滚动的滚动窗格内。\n\n也可以通过以 `true` 作为参数调用表格的\
  \ `setFillsViewportHeight(boolean)` 方法，将它们设置为在界面内占据所有可用高度：\n\n```java\ntable.setFillsViewportHeight(true);\n\
  ```\n\n\n\n\n你接下来创建的`TableFrame`应用将把所有这些内容整合起来。在 NetBeans 中新建一个空 Java 文件，并填入清单 16.3\
  \ 中的内容。\n\n**清单 16.3** `TableFrame.java` 的完整代码\n\n点击此处查看代码图片\n\n```\n1: package\
