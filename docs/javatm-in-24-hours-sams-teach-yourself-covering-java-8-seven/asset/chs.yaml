  \ A、B、C、D 和 F 等级的学生显示不同的消息。首先尝试用`if`语句实现，然后再尝试用`switch`语句实现。\n\n要查看实现这些活动的 Java\
  \ 程序，请访问本书网站 [www.java24hours.com](http://www.java24hours.com)。\n\n## 第 8 小时：用循环重复动作\n\
  \n本小时学习目标：\n\n![Image](img/image00474.jpeg) 使用`for`循环。\n\n![Image](img/image00474.jpeg)\
  \ 使用`while`循环。\n\n![Image](img/image00474.jpeg) 使用`do`-`while`循环。\n\n![Image](img/image00474.jpeg)\
  \ 过早退出循环。\n\n![Image](img/image00474.jpeg) 为循环命名。\n\n对小学生来说，更烦人的惩罚之一是让他们在黑板上一遍又一遍地写东西。在《辛普森一家》中，巴特·辛普森在他频繁去黑板“受罚”时，不得不写了几十遍“器官移植最好留给专业人士”。这种惩罚对孩子可能有效，但对计算机则完全没用。计算机程序可以轻松地重复执行任务。\n\
  \n程序非常适合一遍又一遍地做同样的事情，这得益于循环。循环是程序中重复执行的一条语句或一个语句块。有些循环运行固定的次数。其他的则无限期地运行。\n\nJava\
  \ 中有三种循环语句：`for`、`do`和`while`。每种都可以像其他语句一样工作，但了解所有三种的工作方式是有益的。通过选择合适的语句，你通常可以简化程序中的循环部分。\n\
  \n### for 循环\n\n在你的编程中，你会发现很多情况使用循环很有用。你可以用它们来重复做某件事多次，比如防病毒程序在每封新邮件到达时打开它以查找病毒。你也可以用循环让计算机在短时间内什么都不做，比如每分钟显示一次当前时间的动画时钟。\n\
  \n循环语句使计算机程序多次返回到同一位置，就像特技飞机完成一个特技筋斗一样。\n\nJava 中最复杂的循环语句是`for`。`for`循环将程序的一部分重复执行固定次数。以下是一个示例：\n\
  \n点击查看代码图片\n\n```\nfor (int dex = 0; dex < 1000; dex++) {\n    if (dex % 12 == 0)\
  \ {\n        System.out.println(\"#: \" + dex);\n    }\n}\n```\n\n这个循环显示从 0 到 999\
  \ 中每个能被 12 整除的数字。\n\n\n\n\n每个 `for` 循环都有一个变量，用于决定循环何时开始和结束。这个变量被称为**计数器**（或索引）。前面循环中的计数器是变量\
  \ `dex`。\n\n这个示例说明了 `for` 语句的三个部分：\n\n![Image](img/image00476.jpeg) 初始化部分——在第一部分中，变量\
  \ `dex` 被赋予初始值 0。\n\n![Image](img/image00476.jpeg) 条件部分——在第二部分中，有一个类似 `if` 语句中使用的条件测试：`dex\
  \ < 1000`。\n\n![Image](img/image00476.jpeg) 变化部分——第三部分是更改 `dex` 变量值的语句，在此示例中使用了自增运算符。\n\
  \n在初始化部分，你设置计数器变量。你可以在 `for` 语句中创建变量，就像前面示例中使用整数变量 `dex` 那样。你也可以在程序的其他地方创建变量。无论哪种情况，你都应该在\
  \ `for` 语句的这个部分为变量赋予起始值。当循环开始时，变量具有这个值。\n\n条件部分包含一个测试，为了使循环继续循环，该测试必须保持为 `true`。当测试为\
  \ `false` 时，循环结束。在这个示例中，当 `dex` 变量等于或大于 1,000 时，循环结束。\n\n`for` 语句的最后一部分包含一个更改计数器变量值的语句。每次循环执行时都会处理这个语句。计数器变量必须以某种方式更改，否则循环永远不会结束。在示例中，`dex`\
  \ 在变化部分递增了 1。如果 `dex` 没有改变，它将保持其原始值 0，并且条件 `dex < 1000` 将始终为 `true`。\n\n`for` 语句的代码块在每次循环过程中执行。\n\
  \n---\n\n注意\n\n你可能听到的一个与循环相关的不寻常术语是**迭代**。迭代是循环的一次单次运行。用于控制循环的计数器变量称为**迭代器**。\n\n\
  ---\n\n前面的示例在 `for` 代码块内包含以下语句：\n\n单击此处查看代码图像\n\n```\nif (dex % 12 == 0) {\n   \
  \ System.out.println(\"#: \" + dex);\n}\n```\n\n这些语句执行了 1,000 次。循环通过将 `dex` 变量设置为\
  \ 0 开始。每次循环执行时，它将 `dex` 加 1。当 `dex` 不再小于 1,000 时，循环停止循环。\n\n正如你在 `if` 语句中看到的那样，如果\
  \ `for` 循环只包含单个语句，则不需要括号。以下示例展示了这一点：\n\n单击此处查看代码图像\n\n```\nfor (int p = 0; p < 500;\
  \ p++)\n    System.out.println(\"I will not sell miracle cures\");\n```\n\n此循环显示文本“I\
  \ will not sell miracle cures” 500 次。虽然循环内单个语句周围不需要括号，但你可以使用它们使代码块更容易识别，如下所示：\n\n\
  单击此处查看代码图像\n\n```\nfor (int p = 0; p < 500; p++) {\n    System.out.println(\"I will\
  \ not sell miracle cures\");\n}\n```\n\n你在此时段创建的第一个程序将显示前 200 个 9 的倍数：9, 18, 27，依此类推，直到\
  \ 1,800（9 × 200）。在 NetBeans 中，创建一个名为 `Nines` 的新空 Java 文件，并输入清单 8.1 中的文本。保存文件时，它会存储为\
  \ `Nines.java`。\n\n**清单 8.1** `Nines.java` 的完整文本\n\n单击此处查看代码图像\n\n```\n1: package\
  \ com.java24hours;\n2:\n3: class Nines {\n4:     public static void main(String[]\
  \ arguments) {\n5:         for (int dex = 1; dex <= 200; dex++) {\n6:          \
  \   int multiple = 9 * dex;\n7:             System.out.print(multiple + \" \");\n\
  8:         }\n9:         System.out.println();\n10:     }\n11: }\n```\n\n`Nines`\
  \ 程序在第 5 行包含一个 `for` 语句。该语句有三个部分：\n\n![Image](img/image00476.jpeg) 初始化部分——`int dex\
  \ = 1`，创建了一个名为 `dex` 的整数变量，并赋予其初始值 1。\n\n![Image](img/image00476.jpeg) 条件部分——`dex\
  \ <= 200`，在每次循环过程中必须为真。当它不为真时，循环结束。\n\n![Image](img/image00476.jpeg) 变化部分——`dex++`，在每次循环过程中将\
  \ `dex` 变量递增 1。\n\n通过选择 NetBeans 中的“运行”->“运行文件”来运行该程序。程序产生如图 8.1 所示的输出。\n\n![Image](img/image00498.jpeg)\n\
  \n**图 8.1** `Nines` 程序的输出。\n\nNetBeans 中的输出窗口不会自动换行，因此所有数字都出现在一行上。要使文本换行，请右键单击输出窗格，然后从弹出菜单中选择“自动换行”。\n\
  \n## `while` 循环\n\n`while` 循环没有像 `for` 循环那么多不同的部分。它只需要一个条件测试，该测试与 `while` 语句一起使用。以下是\
  \ `while` 循环的一个示例：\n\n单击此处查看代码图像\n\n```\nwhile (gameLives > 0) {\n    // 循环内部的语句放在这里\n\
  }\n```\n\n此循环会持续重复，直到 `gameLives` 变量不再大于 0。\n\n`while` 语句在循环开始前测试条件，然后再处理循环中的任何语句。如果程序首次遇到\
  \ `while` 语句时测试的条件为 `false`，则循环内的语句将被忽略。\n\n如果 `while` 条件为 `true`，循环将运行一次，然后再次测试\
  \ `while` 条件。如果在循环内部测试的条件从未改变，循环将永远持续下去。\n\n以下语句导致 `while` 循环多次显示同一行文本：\n\n单击此处查看代码图像\n\
  \n```\nint limit = 5;\nint count = 1;\nwhile (count < limit) {\n    System.out.println(\"\
  Pork is not a verb\");\n    count++;\n}\n```\n\n`while` 循环使用在循环语句之前设置的一个或多个变量。在此示例中，创建了两个整数变量：`limit`，其值为\
  \ 5，以及 `count`，其值为 1。\n\n`while` 循环显示文本“Pork is not a verb”四次。如果你将 `count` 变量的初始值设为\
  \ 6 而不是 1，则文本永远不会显示。\n\n## `do-while` 循环\n\n`do-while` 循环类似于 `while` 循环，但条件测试位于不同的位置。以下是\
  \ `do-while` 循环的一个示例：\n\n单击此处查看代码图像\n\n```\ndo {\n    // 循环内部的语句放在这里\n} while (gameLives\
  \ > 0);\n```\n\n像 `while` 循环一样，此循环持续循环，直到 `gameLives` 变量不再大于 0。`do-while` 循环的不同之处在于，条件测试是在循环内部语句之后进行的，而不是之前。\n\
  \n当程序第一次运行到达 `do` 循环时，`do` 和 `while` 之间的语句会自动处理，然后测试 `while` 条件以确定是否应重复循环。如果 `while`\
  \ 条件为 `true`，循环将再运行一次。如果条件为 `false`，循环结束。`do` 和 `while` 语句内部必须发生一些事情来改变用 `while`\
  \ 测试的条件，否则循环将无限期继续。`do-while` 循环中的语句至少会执行一次。\n\n以下语句导致 `do-while` 循环多次显示同一行文本：\n\
  \n单击此处查看代码图像\n\n```\nint limit = 5;\nint count = 1;\ndo {\n    System.out.println(\"\
  I am not allergic to long division\");\n    count++;\n} while (count < limit);\n\
  ```\n\n像 `while` 循环一样，`do-while` 循环使用在循环语句之前设置的一个或多个变量。\n\n\n\n\n\n循环会将文本 \"I am\
  \ not allergic to long division\" 显示四次。如果你将 `count` 变量的初始值设为 6 而不是 1，那么该文本将只会显示一次，即使\
  \ `count` 从未小于 `limit`。\n\n在 `do`-`while` 循环中，即使循环条件第一次就为 `false`，循环体内的语句也至少会执行一次。\n\
  \n### 退出循环\n\n退出循环的正常方式是让测试条件变为 `false`。Java 中所有三种类型的循环都是如此。有时你可能希望即使测试条件仍为 `true`，循环也能立即结束。你可以使用\
  \ `break` 语句来实现这一点，如以下代码所示：\n\n```\nint index = 0;\n\nwhile (index <= 1000) {\n\n\
  \    index = index + 5;\n\n    if (index == 400) {\n\n        break;\n\n    }\n\n\
  }\n```\n\n`break` 语句会终止包含它的循环。\n\n在此示例中，`while` 循环会一直执行，直到 `index` 变量大于 1,000。然而，一个特殊情况导致循环提前结束：如果\
  \ `index` 等于 400，则执行 `break` 语句，立即终止循环。\n\n你可以在循环内使用的另一种特殊语句是 `continue`。`continue`\
  \ 语句会使循环退出当前迭代，并重新开始执行循环的第一条语句。考虑以下循环：\n\n```\nint index = 0;\n\nwhile (index <=\
  \ 1000) {\n\n    index = index + 5;\n\n    if (index == 400) {\n\n        continue;\n\
  \n    }\n\n    System.out.println(\"The index is \" + index);\n\n}\n```\n\n在此循环中，除非\
  \ `index` 的值等于 400，否则语句会正常处理。在这种情况下，`continue` 语句会导致循环跳转回 `while` 语句，而不是正常执行到 `System.out.println()`\
  \ 语句。由于 `continue` 语句的存在，循环永远不会显示以下文本：\n\nThe index is 400\n\n你可以在所有三种循环中使用 `break`\
  \ 和 `continue` 语句。\n\n`break` 语句使得在程序中创建无限循环成为可能，如本示例所示：\n\n```\nwhile (true) {\n\
  \n    if (quitKeyPressed == true) {\n\n        break;\n\n    }\n\n}\n```\n\n###\
  \ 为循环命名\n\n与 Java 程序中的其他语句一样，循环也可以放置在其他循环内部。下面的示例展示了一个嵌套在 `while` 循环内的 `for` 循环：\n\
  \n```\nint points = 0;\n\nint target = 100;\n\nwhile (target <= 100) {\n\n    for\
  \ (int i = 0; i < target; i++) {\n\n        if (points > 50) {\n\n            break;\n\
  \n        }\n\n        points = points + i;\n\n    }\n\n}\n```\n\n在此示例中，如果 `points`\
  \ 变量大于 50，`break` 语句会导致 `for` 循环结束。然而，`while` 循环永远不会结束，因为 `target` 从未大于 100。\n\n\
  在某些情况下，你可能希望同时跳出两个循环。为了实现这一点，你必须为外层循环（在本例中是 `while` 语句）命名。要为循环命名，请在循环开始前一行放置名称，后跟一个冒号（`:`）。\n\
  \n当循环有名称时，在 `break` 或 `continue` 语句后使用该名称来指定该语句所适用的循环。下面的示例重复了前一个示例，但有一点不同：如果 `points`\
  \ 变量大于 50，两个循环都会结束。\n\n```\nint points = 0;\n\nint target = 100;\n\ntargetLoop:\n\
  \nwhile (target <= 100) {\n\n    for (int i = 0; i < target; i++) {\n\n        if\
  \ (points > 50) {\n\n            break targetLoop;\n\n        }\n\n        points\
  \ = points + i;\n\n    }\n\n}\n```\n\n当在 `break` 或 `continue` 语句中使用循环名称时，名称不包含冒号。\n\
  \n#### 复杂的 for 循环\n\n`for` 循环可以更复杂，在其初始化、条件和更新部分包含多个变量。`for` 循环的每个部分用分号（`;`）与其他部分隔开。`for`\
  \ 循环可以在初始化部分设置多个变量，并在更新部分包含多个语句，如下代码所示：\n\n```\nint i, j;\n\nfor (i = 0, j = 0;\
  \ i * j < 1000; i++, j += 2) {\n\n    System.out.println(i + \" * \" + j + \" =\
  \ \" + (i * j));\n\n}\n```\n\n在 `for` 循环的每个部分中，使用逗号分隔变量，例如 `i = 0, j = 0`。示例循环显示了一个方程列表，其中\
  \ `i` 和 `j` 变量相乘。每次循环迭代中，`i` 变量增加 1，`j` 变量增加 2。当 `i` 乘以 `j` 等于或大于 1,000 时，循环结束。\n\
  \n`for` 循环的部分也可以为空。这种情况的一个例子是，循环计数变量已经在程序的其他部分以初始值创建，如下所示：\n\n```\nint displayCount\
  \ = 1;\n\nint endValue = 13;\n\nfor ( ; displayCount < endValue; displayCount++)\
  \ {\n\n    // 循环语句将在此处\n\n}\n```\n\n### 测试你的电脑速度\n\n本小时的下一个项目是一个执行基准测试的 Java 程序，基准测试是一种衡量计算机硬件或软件运行速度的测试。`Benchmark`\
  \ 程序使用循环语句反复执行以下数学表达式：\n\n```\ndouble x = Math.sqrt(index);\n```\n\n此语句调用 `Math.sqrt()`\
  \ 方法来计算一个数的平方根。你将在第 11 小时“描述你的对象是什么样子”中学习方法的工作原理。\n\n你正在创建的基准测试将看看一个 Java 程序在一分钟内可以计算多少次平方根。\n\
  \n使用 NetBeans 创建一个名为 `Benchmark` 的新空 Java 文件。输入代码清单 8.2 的文本，完成后保存程序。\n\n**代码清单 8.2**\
  \ `Benchmark.java` 的完整源代码\n\n```\npackage com.java24hours;\n\nclass Benchmark {\n\
  \n    public static void main(String[] arguments) {\n\n        long startTime =\
  \ System.currentTimeMillis();\n\n        long endTime = startTime + 60000;\n\n \
  \       long index = 0;\n\n        while (true) {\n\n            double x = Math.sqrt(index);\n\
  \n            long now = System.currentTimeMillis();\n\n            if (now > endTime)\
  \ {\n\n                break;\n\n            }\n\n            index++;\n\n     \
  \   }\n\n        System.out.println(index + \" loops in one minute.\");\n\n    }\n\
  \n}\n```\n\n程序中发生了以下事项：\n\n-   第 3-4 行 — 声明了 `Benchmark` 类，程序的 `main()` 块开始。\n-\
  \   第 5 行 — `startTime` 变量被创建，其值为当前时间（以毫秒为单位），通过调用 Java `System` 类的 `currentTimeMillis()`\
  \ 方法测量。\n-   第 6 行 — `endTime` 变量被创建，其值比 `startTime` 高 60,000。由于一分钟等于 60,000 毫秒，这设置了比\
  \ `startTime` 晚一分钟的变量。\n-   第 7 行 — 创建了一个名为 `index` 的 `long` 类型变量，初始值为 0。\n-   第\
  \ 8 行 — `while` 语句开始一个循环，使用 `true` 作为条件，这导致循环永远继续（换句话说，直到其他东西停止它）。\n-   第 9 行 —\
  \ 计算 `index` 的平方根并将其存储在 `x` 变量中。\n-   第 10 行 — 使用 `currentTimeMillis()`，`now` 变量被创建，其值为当前时间。\n\
  \n\n\n\n# 第三部分：以全新方式处理信息\n\n## 第 9 小时：用数组存储信息\n\n本小时待办清单：\n\n![Image](img/image00474.jpeg)\
  \ 创建一个数组。\n\n![Image](img/image00474.jpeg) 设置数组的大小。\n\n![Image](img/image00474.jpeg)\
  \ 为数组元素赋值。\n\n![Image](img/image00474.jpeg) 更改数组中的信息。\n\n![Image](img/image00474.jpeg)\
  \ 创建多维数组。\n\n![Image](img/image00474.jpeg) 对数组排序。\n\n计算机的发展没有谁比圣诞老人受益更多。几个世纪以来，人类给他施加了收集和处理信息的沉重负担。这位圣诞老人必须跟踪以下事项：\n\
  \n![Image](img/image00476.jpeg) 调皮的孩子\n\n![Image](img/image00476.jpeg) 乖巧的孩子\n\n\
  ![Image](img/image00476.jpeg) 礼物请求\n\n![Image](img/image00476.jpeg) 烟囱无法通行的家庭\n\n\
  ![Image](img/image00476.jpeg) 想从圣诞老人那里得到更多礼物但圣诞夫人不允许的女性\n\n![Image](img/image00476.jpeg)\
  \ 先击落不明飞行器再提问的国家\n\n计算机对北极来说是巨大的福音。它们非常适合存储、分类和研究信息。\n\n计算机程序存储信息的最基本方式是将其放入变量。到目前为止，你使用过的所有变量都是单个信息项，例如浮点数或字符串。\n\
  \n圣诞老人乖孩子名单就是一个包含大量类似信息集合的例子。要跟踪这类列表，你可以使用数组。\n\n数组是一组共享相同类型的变量。任何可以作为变量存储的信息类型都可以成为存储在数组中的项。数组可用于跟踪比单个变量更复杂类型的信息，但创建和操作起来几乎同样简单。\n\
  \n### 创建数组\n\n数组是在一个共同名称下分组的变量。数组这个术语你应该很熟悉——想想一位销售人员展示她的系列产品，或者一个游戏节目上令人眼花缭乱的奖品阵列。与变量一样，数组通过声明被组织成数组的变量类型和数组的名称来创建。类型后面跟着一对方括号（`[]`），以区别于变量。\n\
  \n你可以为任何可以作为变量存储的信息类型创建数组。例如，以下语句创建了一个字符串变量的数组：\n\n```java\nString[] naughtyChild;\n\
  ```\n\n再看两个例子：\n\n```java\nint[] reindeerWeight;\n\nboolean[] hostileAirTravelNations;\n\
  ```\n\n* * *\n\n注意\n\n### 小结\n\n循环是大多数编程语言的基本组成部分。通过连续显示多个图形来创建动画，这是没有循环你就无法在 Java\
  \ 或任何其他编程语言中完成的众多任务之一。\n\n辛普森一家中的巴特·辛普森在黑板上受罚写下的每一句话都已被记录在网站上。访问[www.snpp.com/guides/chalkboard.openings.html](http://www.snpp.com/guides/chalkboard.openings.html)查看列表。\n\
  \n该页面还包含一个由唐·德尔·格兰德制作的 Java 小程序，它会在绿色黑板上随机画出巴特的一句话。小程序的源代码也可以获取，因此你可以了解动画是如何实现的。\n\
  \n### 练习\n\n#### 问与答\n\n**问：** “初始化”这个术语在多处使用过。它是什么意思？\n\n**答：** 它的意思是给某物一个初始值并设置好它。当你创建一个变量并为其分配一个起始值时，你就是在初始化这个变量。\n\
  \n**问：** 如果一个循环永远不结束，程序如何停止运行？\n\n**答：** 通常在一个循环不结束的程序中，程序的其他部分会以某种方式设置来停止执行。例如，游戏程序中的一个循环在玩家还有生命值剩余时可能会无限期地持续。\n\
  \n一个在你编写程序时常出现的错误是无限循环，即由于编程错误而永不停止的循环。如果你运行的某个 Java 程序陷入了无限循环，请按“输出”窗格左侧的红色警告图标。\n\
  \n**问：** 我如何购买绿湾包装工队的股票？\n\n**答：** 除非这支公有的 NFL 球队决定再次发行股票，否则成为股东的唯一途径就是通过遗嘱继承股份。\n\
  \n包装工队在 1923 年、1935 年、1950 年、1997 年和 2011 年出售过股票。大约有 36.4 万人拥有该队的 500 万股股份，尽管与股票相关的权利非常有限。\n\
  \n股东不获得股息，也无法从他们的股份中获利。他们只能将股份卖回给球队，并在交易中赔钱。任何个人不能拥有超过 200,000 股。\n\n他们确实会收到独家球队商品优惠，并可以参加年度会议，选举管理球队的七人董事会。\n\
  \n在 1923 年形成该特许经营权的股票发行中，1000 名球迷以每股 5 美元的价格购买了股份。2011 年的出售为球队球场兰堡球场的升级筹集了 6700\
  \ 万美元。\n\n更多关于股票的信息可以在网站[www.packers.com/community/shareholders.html](http://www.packers.com/community/shareholders.html)上找到。\n\
  \n#### 小测验\n\n以下问题测试你对循环知识的掌握。本着本主题的精神，重复这些问题直到你答对为止。\n\n**1.** `for`语句的每个部分之间必须使用什么分隔？\n\
  \n**A.** 逗号\n\n**B.** 分号\n\n**C.** 休息中的警察\n\n**2.** 哪个语句会使程序返回到开始循环的语句，然后从那里继续执行？\n\
  \n**A.** `continue`\n\n**B.** `next`\n\n**C.** `skip`\n\n**3.** Java 中的哪个循环语句总是至少运行一次？\n\
  \n**A.** `for`\n\n**B.** `while`\n\n**C.** `do`-`while`\n\n#### 答案\n\n**1. B.**\
  \ 逗号用于分隔部分内部的事物，而分号用于分隔各个部分。\n\n**2. A.** `break`语句完全结束循环，而`continue`跳到循环的下一次迭代。\n\
  \n**3. C.** `do`-`while`条件直到第一次循环执行后才会被求值。\n\n#### 实践活动\n\n如果所有这些循环还没有让你头晕目眩，请通过以下活动回顾本小时的主题：\n\
