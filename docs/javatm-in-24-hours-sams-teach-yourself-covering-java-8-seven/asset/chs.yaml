  \ 第 9 小时，\"使用数组存储信息\" 中学习数组。\n\n### Java 类库\n\n本书将解释如何使用 Java 语言从头开始创建自己的程序。您将学习构成语言的所有关键字和运算符，然后将它们用于编写语句，使计算机执行有趣且有用的任务。\n\
  \n尽管这种方法是学习 Java 的最佳方式，但它有点像通过让某人先从头制造汽车的每个部件来教她如何组装汽车。\n\n作为 Java 程序员，已经有很多工作为你准备好了，前提是你知道去哪里寻找它。\n\
  \nJava 随附一个庞大的代码集合，称为 Java 类库，你可以在自己的程序中使用。这个库包含数千个类，其中许多都可以用于你编写的程序。\n\n* * *\n\
