  \n当你创建一个 `URI` 对象时，必须确保用于设置地址的文本格式正确：[`http://workbench.cadenhead.org`](http://workbench.cadenhead.org)\
  \ 和 [`http://www.samspublishing.com`](http://www.samspublishing.com) 是有效的，但 `http:www.javaworld.com`\
  \ 则无效，因为它缺少斜杠（/）。\n\n`getURI(String)` 方法接受一个网址作为参数，并返回一个代表该地址的 `URI` 对象。如果字符串不是有效的地址，该方法将返回\
  \ `null`：\n\n点击查看代码图片\n\n```java\nURI getURI(String urlText) {\n    URI pageURI\
  \ = null;\n    try {\n        pageURI = new URI(urlText);\n    } catch (URISyntaxException\
  \ m) {\n        // do nothing\n    }\n    return pageURI;\n}\n```\n\n`try`-`catch`\
  \ 代码块用于处理创建 `URI` 对象时可能出现的任何 `URISyntaxLException` 错误。由于抛出此异常时不需要执行任何操作，因此 `catch`\
  \ 代码块中只包含一个注释。\n\n### 启动线程\n\n在该程序中，`runner` 线程在其 `start()` 方法被调用时启动。\n\n`start()`\
  \ 方法作为构造函数的最后一条语句被调用。以下是该方法：\n\n点击查看代码图片\n\n```java\npublic void start() {\n   \
  \ if (runner == null) {\n        runner = new Thread(this);\n        runner.start();\n\
  \    }\n}\n```\n\n如果 `runner` 线程尚未启动，此方法将启动它。\n\n语句 `` `runner = new Thread(this)`\
  \ `` 创建了一个新的 `Thread` 对象，其中一个参数是 `this` 关键字。`this` 关键字指的是程序本身，指定它为在线程内运行的类。\n\n\
  对 `` `runner.start()` `` 的调用会导致线程开始运行。当一个线程启动时，会调用该线程的 `run()` 方法。因为 `runner` 线程就是\
  \ `LinkRotator` 应用程序本身，所以会调用应用程序的 `run()` 方法。\n\n#### 运行线程\n\n`run()` 方法是线程执行主要工作的地方。在\
  \ `LinkRotator` 程序中，以下代码代表 `run()` 方法：\n\n点击查看代码图片\n\n```java\npublic void run()\
  \ {\n    Thread thisThread = Thread.currentThread();\n    while (runner == thisThread)\
  \ {\n        current++;\n        if (current > 5) {\n            current = 0;\n\
  \        }\n        siteLabel.setText(pageTitle[current]);\n        repaint();\n\
  \        try {\n            Thread.sleep(1000);\n        } catch (InterruptedException\
  \ e) {\n            // do nothing\n        }\n    }\n}\n```\n\n在 `run()` 方法中首先执行的操作是创建一个名为\
  \ `thisThread` 的 `Thread` 对象。`Thread` 类的一个类方法 `currentThread()` 为 `thisThread` 对象设定了值。`currentThread()`\
  \ 方法负责跟踪当前正在运行的线程。\n\n此方法中的所有语句都属于一个 `while` 循环，该循环比较 `runner` 对象和 `thisThread`\
  \ 对象。两个对象都是线程，只要它们引用同一个对象，`while` 循环就会继续循环。此循环内部没有语句会导致 `runner` 和 `thisThread`\
  \ 对象具有不同的值，因此它会无限循环，除非循环外部的某个地方改变了其中一个 `Thread` 对象。\n\n`run()` 方法调用了 `repaint()`。接着，`current`\
  \ 变量的值加一，如果 `current` 超过 5，则重新设置为 0。`current` 变量用于确定要显示哪个网站的信息。它被用作字符串数组 `pageTitle`\
  \ 的索引，并将标题设置为 `siteLabel` 用户界面组件的文本。\n\n`run()` 方法包含另一个用于处理错误的 `try`-`catch` 代码块。`Thread.sleep(1000)`\
  \ 语句使线程暂停 1 秒钟，这段时间足够用户阅读网站名称及其地址。`catch` 语句负责处理在 `Thread.sleep()` 语句执行期间可能发生的任何\
  \ `InterruptedException` 错误。如果线程在休眠时被中断，就会发生这些错误。\n\n### 处理鼠标点击\n\n`LinkRotator`\
  \ 程序中最后需要处理的是事件处理。每当用户点击“Visit Site”按钮时，应用程序应该用网页浏览器打开显示的网站。这是通过一个名为 `actionPerformed()`\
  \ 的方法完成的，每当按钮被点击时都会调用该方法。\n\n以下是 `LinkRotator` 的 `actionPerformed()` 方法：\n\n点击查看代码图片\n\
  \n```java\npublic void actionPerformed(ActionEvent event) {\n    Desktop desktop\
  \ = Desktop.getDesktop();\n    if (pageLink[current] != null) {\n        try {\n\
  \            desktop.browse(pageLink[current]);\n            runner = null;\n  \
  \          System.exit(0);\n        } catch (IOException exc) {\n            //\
  \ do nothing\n        }\n    }\n}\n```\n\n此方法首先执行的操作是创建一个 `Desktop` 对象。`java.awt`\
  \ 包中的 `Desktop` 类代表运行应用程序的计算机的桌面环境。获得此对象后，你可以使用它来通过“mailto:”链接启动电子邮件客户端、打开文件以使用其他程序进行编辑、打印文件以及让\
  \ Java 外部的其他程序执行任务。\n\n这里，`Desktop` 对象用于使用计算机的默认网页浏览器打开一个网页。\n\n`browse(URI)` 方法在浏览器中加载指定的网址。如果\
  \ `pageLink[current]` 是一个有效地址，`browse()` 会请求浏览器加载该页面。\n\n### 显示循环链接\n\n现在你已经准备好创建程序并进行测试了。创建一个名为\
  \ `LinkRotator` 的新 Java 文件，并输入清单 19.2 中的文本。\n\n清单 19.2 `LinkRotator.java` 的完整文本\n\
  \n点击查看代码图片\n\n* * *\n\n```java\n1: package com.java24hours;\n2:\n3: import java.awt.*;\n\
  4: import java.awt.event.*;\n5: import java.io.*;\n6: import javax.swing.*;\n7:\
