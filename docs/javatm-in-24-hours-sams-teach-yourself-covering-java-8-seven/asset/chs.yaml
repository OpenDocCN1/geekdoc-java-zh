  匿名内部类在第 16-21 行被创建并使用。它使用`KeyListener`接口中应用程序所需的唯一方法来监视键盘输入，并通过更新`keyLabel`实例变量来显示该输入。\n\
  \n程序的输出如图 20.2 所示。\n\n![Image](img/image00542.jpeg)\n**图 20.2** 使用`NewKeyViewer`应用监视键盘输入。\n\
  \n匿名内部类不能定义构造函数，因此它们比非匿名内部类更受限制。\n\n它们是该语言的一个复杂特性，当你检查程序的源代码时更难理解，但它们可以使程序更简洁。有经验的\
  \ Java 程序员经常使用它们。\n\n### 闭包\n\nJava 8 新增了多年来最受期待的语言特性：闭包。\n\n闭包（也称为 lambda 表达式）允许仅使用`->`运算符创建一个具有单一方法的对象，只要满足其他条件即可。\n\
  \n以下是一个例子：\n点击查看代码图片\n\n```java\nRunnable runner = () -> { System.out.println(\"\
  Run!\"); };\n```\n\n这一行代码创建了一个实现`Runnable`接口的对象，并使其`run()`方法等同于以下代码：\n点击查看代码图片\n\
  \n```java\nvoid run() {\n\n    System.out.println(\"Run!\");\n\n}\n```\n\n在 lambda\
  \ 表达式中，箭头运算符`->`右侧的语句成为实现该接口的方法。\n\n只有当接口有一个需要实现的方法时才能这样做，例如`Runnable`，它只包含`run()`。Java\
  \ 中只有一个方法的接口现在称为函数式接口。\n\nlambda 表达式在箭头运算符`->`左侧也有一些内容。在第一个例子中，它是一对空的括号，指的是发送到函数式接口方法的参数。由于`Runnable`接口中的`run()`不带任何参数，因此表达式中不需要参数。\n\
  \n这里是第二个 lambda 表达式的例子，确实在那些括号中放置了内容：\n点击查看代码图片\n\n```java\nActionListener al =\
  \ (ActionEvent act) -> {\n\n    System.out.println(act.getSource());\n\n}\n```\n\
  \n这等同于在实现`java.awt.event`包中`ActionListener`接口的对象中的以下代码：\n点击查看代码图片\n\n```java\npublic\
  \ void actionPerformed(ActionEvent act) {\n\n    System.out.println(act.getSource());\n\
  \n}\n```\n\n`ActionListener`接口接收动作事件，例如当用户点击按钮时。函数式接口中的唯一方法是`actionPerformed(ActionEvent)`。参数是一个`ActionEvent`对象，描述了触发事件的用户动作。\n\
  \nlambda 表达式的右半部分将`actionPerformed()`方法定义为一条显示有关触发事件的用户界面组件信息的语句。\n\n表达式的左半部分声明一个名为`act`的`ActionEvent`对象是该方法的参数。\n\
  \n这个对象`act`在方法体内使用。左半部分对`act`的引用似乎超出了右半部分方法实现的范围。这是因为闭包允许代码引用其范围之外的另一个方法的变量。\n\n\
  如你所见，lambda 表达式的一个效果是它们缩短了代码。单个表达式创建一个对象并实现一个接口。\n\n\n\n\nJava 的这一新特性通过语言对目标类型的支持，可以使代码更加简洁。\n\
  \n在 lambda 表达式中，可以推断传递给方法的参数的类型。来看最后一个例子。由于`ActionListener`函数式接口只有一个方法，且该方法仅接受一个`ActionEvent`对象作为其唯一参数，因此可以省略该类的名称。\n\
  \n下面是考虑这一点后修订的 lambda 表达式：\n\n单击此处查看代码图片\n\n```java\nActionListener al = (act) ->\
  \ {\n    System.out.println(act.getSource());\n}\n```\n\n你接下来创建的两个程序应该更具体地演示 Java\
  \ 引入闭包所带来的差异。\n\n`ColorFrame`应用程序（如清单 20.3 所示）是一个图形化的 Swing 程序，它显示三个按钮来更改框架的颜色。此版本的应用程序使用匿名内部类（而不是\
  \ lambda 表达式）来监视用户对三个按钮的点击。\n\n在 NetBeans 中创建一个新程序，名称为该清单名称，包为`com.java24hours`。输入清单中的文本。\n\
