  \n### 运行 Java 程序\n\n要看 `Saluton` 程序是否按预期运行，请使用运行所有 Java 代码的解释器——Java 虚拟机——来运行该类。在\
  \ `NetBeans` 中，选择菜单命令 `运行`、`运行文件`。一个输出窗格会在源代码编辑器下方打开。在此窗格中，如果没有错误，程序将显示输出，如图 2.3\
  \ 所示。\n\n![Image](img/image00479.jpeg)\n\n**图 2.3** 运行你的第一个 Java 程序。\n\n如果你看到文本\
