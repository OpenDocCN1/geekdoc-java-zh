  \n该应用程序使用了多个布局管理器。为了更清楚地了解应用程序的用户界面是如何布局的，请查看图 14.7。界面被分为五个水平行，图中用黑色水平线分隔。每一行都是一个`JPanel`对象，应用程序的总体布局管理器将这些行组织成一个五行一列的`GridLayout`。\n\
  \n![图像](img/image00525.jpeg)\n\n## 图 14.7\n将`LottoMadness`应用程序划分为面板。\n\n在各行内部，使用了不同的布局管理器来确定组件应如何显示。第\
  \ 1 行和第 3 行使用`FlowLayout`对象。程序的第 47–48 行展示了如何创建它们：\n\n点击查看代码图像\n```java\nFlowLayout\
  \ layout1 = new FlowLayout(FlowLayout.CENTER,\n    10, 10);\n```\n\n`FlowLayout()`构造函数使用了三个参数。第一个参数`FlowLayout.CENTER`表示组件应在其容器（即放置它们的水平`JPanel`）中居中。最后两个参数指定了每个组件应与其他组件保持的宽度和高度距离。设置宽度\
  \ 10 像素、高度 10 像素会在组件之间留出少量额外间距。\n\n界面的第 2 行被布局为一个两行七列的网格。`GridLayout()`构造函数还指定了组件在每个方向上应与其他组件间隔\
  \ 10 像素。第 56–57 行设置了这个网格：\n\n点击查看代码图像\n```java\nGridLayout layout2 = new GridLayout(2,\
  \ 7, 10, 10);\nrow2.setLayout(layout2);\n```\n\n第 4 行使用`GridLayout`将组件排列成一个两行三列的网格。\n\
  \n`LottoMadness`应用程序使用了本小时介绍的多个组件。第 9–37 行用于设置构成界面的所有组件的对象。语句按行组织。首先，为该行创建一个`JPanel`对象，然后设置该行的每个组件。这段代码创建了所有组件和容器，除非使用`add()`方法将它们添加到应用程序的主框架中，否则它们不会显示。\n\
  \n在第 47–100 行中，组件被添加进去。第 47–54 行展示了整个`LottoMadness()`构造函数的特点：\n\n点击查看代码图像\n```java\n\
  FlowLayout layout1 = new FlowLayout(FlowLayout.CENTER,\n    10, 10);\noption.add(quickpick);\n\
  option.add(personal);\nrow1.setLayout(layout1);\nrow1.add(quickpick);\nrow1.add(personal);\n\
  add(row1);\n```\n\n创建布局管理器对象后，将其与行`JPanel`对象（本例中为`row1`）的`setLayout()`方法一起使用。指定布局后，通过使用其`add()`方法将组件添加到`JPanel`。所有组件放置完毕后，通过调用其自身的`add()`方法将整个`row1`对象添加到框架中。\n\
  \n`LottoMadness`应用程序设置图形用户界面外观风格的方式与之前的 Swing 应用程序不同。`setLookAndFeel()`方法被创建为类方法——注意第\
  \ 105 行的`static`关键字——并在第 116 行的`main()`方法中被调用。\n\n\n\n\n之前的示例将 `setLookAndFeel()`\
  \ 设为对象方法，并在对象的构造函数中调用它。之所以在 `LottoMadness` 中没有这样做，是因为外观和感觉必须在任何实例变量被创建和赋值之前选定。\n\
  \n## 总结\n\n当你第一次为 Java 程序设计图形用户界面（GUI）时，你可能难以相信组件能够自由移动是一种优势。布局管理器提供了一种方法，可以开发出足够灵活的\
  \ GUI，以处理显示上的差异，并且界面美观。\n\n在接下来的一个小时里，你将更深入地了解 GUI 的功能。你将有机会看到 `LottoMadness` 界面在运行，看着它处理彩票抽奖并统计中奖者。\n\
  \n## 研讨会\n\n### 问答\n\n**问.** 为什么 `LottoMadness` 应用程序中的一些文本字段显示为灰色，而另一些则是白色的？\n\n\
  **答.** 灰色字段使用了 `setEditable()` 方法，使其不可编辑。文本字段的默认行为是允许用户通过在其边框内点击并输入任何想要的更改来改变文本字段的值。然而，有些字段旨在显示信息，而不是接收用户的输入。`setEditable()`\
  \ 方法可以防止用户更改他们不应修改的字段。\n\n**问.** 在 *《威利·旺卡与巧克力工厂》* 中，真的有一位金票得主米兰达·派克（Miranda Piker）的死因过于恐怖而被删除了吗？\n\
  \n**A.** 米兰达·派克的命运是如此可怕，以至于她被从罗尔德·达尔的原著小说 *《查理和巧克力工厂》* 的最终稿中删除了，该小说启发了 1971 年的电影及其\
  \ 2005 年的翻拍版。派克是一个自以为是的孩子，认为孩子永远不该玩耍，应该一直上学。她的父亲是一位小学校长。\n\n派克和旺卡工厂的其他孩子们被介绍给了一种名为“雀斑粉”（Spotty\
  \ Powder）的糖果，这种糖果会导致食用者身上起红斑，这样他们就可以假装生病逃学。派克和她的父亲感到非常愤怒，并决定摧毁制造它的机器。\n\n当隔壁房间传来他们的尖叫声时，旺卡解释说，他们已经进入了将糖果原料研磨成粉末的地方。“这是配方的一部分，”他告诉米兰达的母亲。“我们偶尔必须使用一两个校长，否则它就不奏效。”\n\
  \n奥帕-伦帕人（Oompa-Loompas）用歌声庆祝她的灭亡：“哦，米兰达·玛丽·派克，/怎么会有人喜欢她，/这样一个自命不凡又令人讨厌的小孩。/所以我们说，‘何不把她放进/雀斑粉搅拌机，/那样我们肯定会比以前更喜欢她。’/很快这个如此恶毒的孩子/就会变得相当美味，/她的同学们肯定会明白，/他们不再说，‘米兰达！/哦，那个野兽！我们受不了她！’/他们会说，‘哦，她多么有用，多么好！’”\n\
  \n### 测验\n\n为了测试你的脑细胞是否排列得当，请通过回答以下问题来检验你的 Java 布局管理技巧。\n\n**1.** 当将界面细分为不同的布局管理器时，通常使用哪种容器？\n\
  \n**A.** `JWindow`\n\n**B.** `JPanel`\n\n**C.** `Container`\n\n**2.** 面板的默认布局管理器是什么？\n\
  \n**A.** `FlowLayout`\n\n**B.** `GridLayout`\n\n**C.** 无默认值\n\n**3.** `BorderLayout`\
  \ 类的名称来源于哪里？\n\n**A.** 每个组件的边框\n\n**B.** 组件沿着容器边框组织的方式\n\n**C.** Java 开发者的任性而为\n\
  \n### 答案\n\n**1. B.** `JPanel`，它是容器中最简单的。\n\n**2. A.** 面板使用流式布局，但框架和窗口的默认管理器是边界布局。\n\
  \n**3. B.** 你必须在将组件添加到容器时，使用方向变量（如 `BorderLayout.WEST` 和 `BorderLayout.EAST`）来指定组件的边框位置。\n\
  \n### 活动\n\n如果你想继续探索流式布局（以及网格布局和边界布局），请完成以下活动：\n\n![Image](img/image00476.jpeg)\
