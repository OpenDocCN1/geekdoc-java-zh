  \n至此，你已经完成了本书中面向对象概念三个小时学习内容的三分之二。你学会了如何创建对象，如何为对象及其类赋予行为和属性，以及如何通过使用转型将对象和变量转换为其他形式。\n\
  \n用对象的方式思考是 Java 编程语言中较难的挑战之一。然而，一旦你开始理解它，你就会意识到整个语言都在利用对象和类。\n\n在下一小时，你将学习如何为对象指定父类和子类。\n\
