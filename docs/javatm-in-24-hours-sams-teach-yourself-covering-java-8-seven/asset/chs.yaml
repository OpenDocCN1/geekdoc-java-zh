  \ 中 6”乐透抽奖的机会也极其渺茫。\n\n### 总结\n\n通过使用 Swing，你可以用少量的编程创建出专业外观的程序。尽管 `LottoMadness`\
  \ 应用程序比你在过去 14 小时中完成的许多示例都要长，但其中一半的程序都是用于构建界面的语句。\n\n如果你花些时间运行这个应用程序，你会对那些赢得这些六数字彩票的人的好运感到更加苦涩和嫉妒。\n\
  \n我最近一次运行该程序的结果表明，我可能会花费 27,000 美元和我生命中最宝贵的 266 年来购买彩票，最终只赢得了一些“6 中 4”和“6 中 3”的奖项。相比之下，让你的\
  \ Java 编程技能获得回报的机会几乎是十拿九稳的。\n\n### 讲座\n\n#### 问答\n\n**问：** 你需要对 `paint()` 方法或 `repaint()`\
  \ 方法做些什么来表明一个文本字段已经被更改了吗？\n\n**答：** 在使用文本组件的 `setText()` 方法更改其值之后，你不需要做任何其他事情。Swing\
  \ 会处理必要的更新以显示新值。\n\n**问：** 为什么你经常导入一个类以及它的一个子类，就像在 清单 15.1 中导入 `java.awt.*` 和 `java.awt.event.*`\
  \ 一样？第一个语句能否包含第二个？\n\n**答：** 虽然 `java.awt` 和 `java.awt.event` 包的名称看起来它们是相关的，但在 Java\
  \ 中包并没有继承关系。一个包不能是另一个包的子包。\n\n当你在 `import` 语句中使用星号时，你是在让一个包中的所有类在程序中可用。星号只对类有效，对包无效。单个\
  \ `import` 语句最多只能加载一个包中的所有类。\n\n**问：** 为什么演员 Michael J. Fox 的名字中要包含他的中间名首字母？\n\n\
  **答：** 因为美国演员工会中已经有一个叫 Michael Fox 的演员，迫使这位未来的《家庭纽带》和《回到未来》的明星为他的专业工作选择另一个名字。他的真名是\
  \ Michael Andrew Fox，但他不喜欢 Andrew 或 Andy Fox 这个名字——而且自称 Michael A. Fox 听起来像是在欣赏自己的英俊外貌。\n\
  \n他选择了 Michael J. Fox 作为对演员 Michael J. Pollard 的致敬。\n\n另一位 Michael Fox 是一位演员，他出演了《佩里·梅森》、《伯克的法律》等多部电视剧和电影，直到\
  \ 1996 年去世。\n\n#### 测验\n\n在 `LottoMadness` 程序让你对博彩失去兴趣之后，通过回答以下问题来玩一个技巧游戏。\n\n**1.**\
  \ 为什么动作事件要这样命名？\n\n**A.** 它们是对其他事情的反应。\n\n**B.** 它们表明应该采取某种行动作为回应。\n\n**C.** 它们是为了纪念电影冒险家\
  \ Action Jackson。\n\n**2.** 作为 `addActionListener()` 方法的参数时，`this` 意味着什么？\n\n**A.**\
  \ 当事件发生时，应使用`this`监听器。\n\n**B.** `this`事件优先于其他事件。\n\n**C.** `this`对象处理这些事件。\n\n\
  **3.** 哪个文本组件以整数形式存储用户输入？\n\n**A.** `JTextField`\n\n**B.** `JTextArea`\n\n**C.**\
  \ 既不是 A 也不是 B\n\n#### 答案\n\n**1. B.** 动作事件包括按钮的点击和从下拉菜单中选择一个项目。\n\n\n\n\n**2. C.**\
  \ `this`关键字指的是当前对象。如果使用对象的名称代替`this`语句作为参数，则该对象将接收事件并负责处理它们。\n\n**3. C.** `JTextField`和`JTextArea`组件将它们的值存储为文本，因此在将它们用作整数、浮点数或其他非文本值之前，必须先转换这些值。\n\
