  \n**图 7.3** `Clock`程序的输出。\n\n多次运行该程序，观察它如何与时钟保持同步。\n\n### 小结\n\n现在你能使用条件语句了，你的 Java\
  \ 程序的整体智能性得到了极大的提升。你的程序可以评估信息，并根据不同的情况做出不同的反应，即使信息在程序运行时发生变化。它们可以基于特定条件在两个或多个选项中进行选择。\n\
  \n编程计算机迫使你将任务分解为一系列逻辑步骤来执行，并做出必须做出的决定。在编程中使用`if`语句和其他条件语句，也能促进一种逻辑思维，这种思维可以为你生活的其他方面带来好处：\n\
  \n![Image](img/image00476.jpeg) “`如果`那位候选人在 11 月当选总统，我就去谋求一个内阁职位，`否则`我就搬到加拿大去。”\n\
  \n![Image](img/image00476.jpeg) “`如果`我的相亲对象喜欢我，我就请她去一家昂贵的餐厅吃晚餐，`否则`我们就去必胜客。”\n\n\
  ![Image](img/image00476.jpeg) “`如果`我违反了缓刑规定，唯一会选我的球队就是奥克兰突袭者队。”\n\n### 动手实践\n\n\
  #### 问答\n\n**问.** `if`语句看起来是最有用的。是否可能只在程序中使用`if`语句，而从不使用其他语句？\n\n**答.** 没有`else`或`switch`是可行的，许多程序员从不使用三元运算符`?`。然而，在程序中使用`else`和`switch`通常是有益的，因为它们使程序更容易理解。一连串链接在一起的`if`语句可能变得难以处理。\n\
  \n**问.** 在本小时中，当`if`语句只与一条语句一起使用时，有时不使用开括号`{`和闭括号`}`。使用括号不是强制性的吗？\n\n**答.** 不是。括号可以作为任何`if`语句的一部分，用来包围程序中依赖于条件测试的部分。使用括号是一个值得养成的好习惯，因为它可以防止在修改程序时可能出现的常见错误。如果你在`if`条件后添加第二条语句而没有添加括号，当程序运行时会发生意外错误。\n\
  \n**问.** 在`switch`语句块中，是否必须在每个`case`后的语句段中使用`break`？\n\n**答.** 你不一定必须使用`break`。如果你在语句组的末尾不使用它，switch\
  \ 语句块内的所有剩余语句都会被执行，无论它们对应的`case`值是什么。\n\n然而，在大多数情况下，你很可能希望在每组语句的末尾使用`break`语句。\n\
  \n**问.** 汤普森三重唱乐队为什么叫这个名字？他们是三人组合，彼此之间没有血缘关系，而且没有一个人的名字叫汤普森。\n\n**答.** 乐队成员汤姆·贝利、阿拉娜·库里和乔·李维自称汤普森双胞胎，以向比利时漫画书《丁丁历险记》中的一对笨手笨脚的侦探汤姆森和汤普森致敬。\n\
  \n这对戴圆顶礼帽的侦探在外形上几乎无法区分，除了他们的胡子形状有细微差别。尽管工作能力糟糕，他们却被莫名其妙地分配去执行重要且敏感的任务。他们经常追捕丁丁，指控他犯下他并未犯下的罪行。\n\
  \n正如他们的名字所示，这两位侦探之间也没有血缘关系。\n\n#### 小测验\n\n以下问题考察你在学习了 Java 中的条件语句后处于什么状态。\n\n**1.**\
  \ 条件测试会产生`true`或`false`值。这让你想起哪种变量类型？\n\n**A.** 都没有。别拿这些没完没了的问题烦我了。\n\n**B.** `long`变量类型。\n\
  \n**C.** `boolean`类型。\n\n**2.** 在`switch`语句块中，哪个语句被用作“兜底”的类别？\n\n**A.** `default`\n\
  \n**B.** `otherwise`\n\n**C.** `onTheOtherHand`\n\n**3.** 什么是条件语句？\n\n**A.** 洗发后用来修复乱糟糟的分叉和打结的护发素。\n\
  \n**B.** 程序中用来测试条件是真还是假的东西。\n\n**C.** 向宗教权威人士忏悔罪过的地方。\n\n#### 答案\n\n**1. C.** `boolean`变量类型只能等于`true`或`false`，这使其类似于条件测试。如果你选择了\
  \ A，我很抱歉，但我们只剩下 17 个小时了，还有很多内容要讲。Java 可不会自己教自己。\n\n**2. A.** 如果没有其他`case`语句匹配`switch`变量，`default`语句将被执行。\n\
  \n**3. B.** 其他答案描述的是护发素和忏悔室。\n\n#### 动手实践\n\n为了提高你在 Java 条件语句方面的“条件”水平，请通过以下活动复习本小时的主题：\n\
  \n![Image](img/image00476.jpeg) 在`Clock`程序中的一条`break`语句前加上`//`使其成为注释；然后编译它，看看运行时会发生什么。尝试再移除几个`break`语句。\n\
