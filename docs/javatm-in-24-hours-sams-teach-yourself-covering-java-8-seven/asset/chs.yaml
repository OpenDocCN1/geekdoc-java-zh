  \n![Image](img/image00476.jpeg) 复制 `LottoMadness.java` 文件并将其重命名为 `NewMadness.java`。修改此程序，使快速选择或个人选择成为一个组合框，而开始、停止和重置按钮成为复选框。\n\
  \n要查看实现这些活动的 Java 程序，请访问本书网站 [www.java24hours.com](http://www.java24hours.com)。\n\
  \n# 第 15 小时：响应用户输入\n\n本小时待办事项：\n\n![Image](img/image00474.jpeg) 让你的程序感知事件。\n\n![Image](img/image00474.jpeg)\
  \ 设置一个组件使其能触发事件。\n\n![Image](img/image00474.jpeg) 忽略某些组件。\n\n![Image](img/image00474.jpeg)\
  \ 弄清楚事件在程序中的最终去向。\n\n![Image](img/image00474.jpeg) 在界面中存储信息。\n\n![Image](img/image00474.jpeg)\
  \ 转换存储在文本字段中的值。\n\n你在过去两小时内开发的图形用户界面（GUI）可以独立运行。用户可以点击按钮、在文本字段中填写文本以及调整窗口大小。迟早，即使是最不挑剔的用户也会希望获得更多功能。程序提供的\
  \ GUI 必须在发生鼠标点击或键盘输入时引发相应的操作。\n\n当你的 Java 程序能够响应用户事件时，这些操作就变得可能。这被称为事件处理，也是本小时的主要内容。\n\
  \n## 让你的程序学会倾听\n\nJava 中的*用户事件*是指用户使用鼠标、键盘或其他输入设备执行操作时发生的事情。\n\n在接收事件之前，你必须先学习如何让一个对象进行监听。响应用户事件需要使用一个或多个`EventListener`接口。接口是\
  \ Java 面向对象编程的一个特性，它使一个类能够继承它本无法使用的行为。它们就像与其他类签订的合同协议，保证该类将包含特定的方法。\n\n一个`EventListener`接口包含接收特定类型用户输入的方法。\n\
  \n添加`EventListener`接口需要两件事。首先，由于监听类是`java.awt.event`包的一部分，你必须通过以下语句使它们可用：\n\n```java\n\
  import java.awt.event.*;\n```\n\n其次，该类必须使用`implements`关键字来声明它支持一个或多个监听接口。以下语句创建了一个使用`ActionListener`接口（用于响应按钮和菜单点击）的类：\n\
  \n```java\npublic class Graph implements ActionListener {\n```\n\n`EventListener`接口使\
  \ GUI 的组件能够生成用户事件。如果没有设置相应的监听器，组件就无法被程序的其他部分感知到任何操作。程序必须为其监听的每种组件类型包含一个监听接口。要让程序响应按钮上的鼠标点击或文本字段中的回车键按下，你必须包含`ActionListener`接口。要响应选择列表或复选框的使用，你需要`ItemListener`接口。\n\
  \n当你在同一个类中需要多个接口时，在`implements`关键字后用逗号分隔它们的名称，如下代码所示：\n\n```java\npublic class Graph3D\
  \ implements ActionListener, MouseListener {\n\n    // ...\n\n}\n```\n\n## 设置组件使其可被感知\n\
  \n\n\n\n\n实现特定组件所需的接口后，你必须让该组件生成用户事件。`ActionListener`接口用于监听操作事件，例如按钮点击或按下回车键。\n\n\
  ***\n\n注意\n\n`this`关键字初次介绍时可能会让很多读者感到困惑。`this`指的是该关键字所在的对象。因此，如果你创建了一个`LottoMadness`类并在该类的语句中使用`this`，它指的是执行该代码的`LottoMadness`对象。\n\
  \n***\n\n要让`JButton`对象生成事件，请使用`addActionListener()`方法，如下所示：\n\n```\nJButton fireTorpedos\
  \ = new JButton(\"Fire torpedos\");\nfireTorpedos.addActionListener(this);\n```\n\
  \n此代码创建了`fireTorpedos`按钮，并调用了该按钮的`addActionListener()`方法。作为`addActionListener()`方法参数使用的`this`关键字表示当前对象接收用户事件并根据需要进行处理。\n\
  \n### 处理用户事件\n\n当具有监听器的组件生成用户事件时，系统会自动调用一个方法。该方法必须在将监听器附加到组件时指定的类中找到。\n\n每个监听器都有不同的方法来接收其事件。`ActionListener`接口将事件发送到名为`actionPerformed()`的方法。以下是`actionPerformed()`方法的一个简短示例：\n\
  \n```\npublic void actionPerformed(ActionEvent event) {\n    // 方法放在这里\n}\n```\n\
  \n程序中发送的所有操作事件都会进入此方法。如果程序中只有一个组件可能发送操作事件，你可以将语句放在该方法中来处理事件。如果有多个组件可以发送这些事件，你需要检查发送给该方法的对象。\n\
  \n一个`ActionEvent`对象会被发送到`actionPerformed()`方法。有多个类的对象可以代表程序中可以发送的用户事件。这些类具有确定是哪个组件导致事件发生的方法。在`actionPerformed()`方法中，如果`ActionEvent`对象命名为`event`，你可以使用以下语句识别该组件：\n\
  \n```\nString cmd = event.getActionCommand();\n```\n\n`getActionCommand()`方法返回一个字符串。如果组件是按钮，则该字符串是按钮上的标签。如果是文本字段，则该字符串是字段中输入的文本。`getSource()`方法返回导致该事件的对象。\n\
  \n你可以使用以下`actionPerformed()`方法来接收来自三个组件的事件：一个名为`start`的`JButton`对象、一个名为`speed`的`JTextField`和另一个名为`viscosity`的`JTextField`：\n\
  \n```\npublic void actionPerformed(ActionEvent event) {\n    Object source = event.getSource();\n\
  \    if (source == speed) {\n        // speed 字段导致事件\n    } else if (source == viscosity)\
  \ {\n        // viscosity 导致事件\n    } else {\n        // start 导致事件\n    }\n}\n\
  ```\n\n你可以对所有用户事件调用`getSource()`方法来识别导致事件的特定对象。\n\n#### 复选框和组合框事件\n\n组合框和复选框需要`ItemListener`接口。调用组件的`addItemListener()`方法使其生成这些事件。以下语句创建了一个名为`superSize`的复选框，该复选框在选中或取消选中时发送用户事件：\n\
  \n```\nJCheckBox superSize = new JCheckBox(\"Super Size\", true);\nsuperSize.addItemListener(this);\n\
  ```\n\n这些事件由`itemStateChanged()`方法接收，该方法以一个`ItemEvent`对象作为参数。要查看哪个对象导致了事件，可以调用事件对象的`getItem()`方法。\n\
  \n要确定复选框是选中还是取消选中，可将`getStateChange()`方法返回的值与常量`ItemEvent.SELECTED`和`ItemEvent.DESELECTED`进行比较。以下代码是一个名为`item`的`ItemEvent`对象的示例：\n\
  \n```\npublic void itemStateChanged(ItemEvent item) {\n    int status = item.getStateChange();\n\
  \    if (status == ItemEvent.SELECTED) {\n        // 项目被选中\n    }\n}\n```\n\n要确定`JComboBox`对象中选定的值，请使用`getItem()`并将该值转换为字符串，如下所示：\n\
  \n```\nObject which = item.getItem();\nString answer = which.toString();\n```\n\n\
  #### 键盘事件\n\n当程序必须在按下按键时立即做出反应时，它会使用键盘事件和`KeyListener`接口。\n\n第一步是通过调用其`addKeyListener()`方法来注册接收按键的组件。该方法的参数应该是实现`KeyListener`接口的对象。如果就是当前类，则使用`this`作为参数。\n\
  \n处理键盘事件的对象必须实现三个方法：\n\n- `void keyPressed(KeyEvent)`—按键被按下的瞬间调用的方法\n- `void keyReleased(KeyEvent)`—按键被释放的瞬间调用的方法\n\
  - `void keyTyped(KeyEvent)`—按键被按下并释放之后调用的方法\n\n每个方法都有一个`KeyEvent`对象作为参数，该对象具有可调用的方法以获取关于事件的更多信息。调用`getKeyChar()`方法可找出按下了哪个键。该键作为`char`值返回，只能用于字母、数字和标点符号。\n\
  \n要监视键盘上的任何按键，包括回车键、主页键、向上翻页键和向下翻页键，可以调用`getKeyCode()`方法。此方法返回一个表示该按键的整数值。然后你可以使用该整数作为参数调用`getKeyText()`，以接收包含按键名称（例如\
  \ Home、F1 等）的`String`对象。\n\n`清单 15.1`包含一个 Java 应用程序，它使用`getKeyChar()`方法在标签中绘制最近按下的键。该应用程序实现了`KeyListener`接口，因此类中有`keyTyped()`、`keyPressed()`和`keyReleased()`方法。这些方法中唯一起作用的是第\
  \ 24–27 行的`keyTyped()`。创建一个名为`KeyViewer`的新 Java 文件，在 NetBeans 的源代码编辑器中输入清单内容，并保存该文件。\n\
  \n**清单 15.1 `KeyViewer.java`的完整文本**\n\n```\n 1: package com.java24hours;\n 2: \n\
  \ 3: import javax.swing.*;\n 4: import java.awt.event.*;\n 5: import java.awt.*;\n\
