  \n---\n\n注意\n\nOracle 在其网站上提供了 Java 语言的全面文档。你不需要它来使用本书，因为每个主题在引入时都会得到充分讨论，但当你想要扩展知识并编写自己的程序时，这份参考文献会派上用场。\n\
  \n文档可以下载，但根据需要在 Oracle 网站上浏览更为方便。最新的 Java 文档可在 [`download.java.net/jdk8/docs/api`](http://download.java.net/jdk8/docs/api)\
  \ 获取。\n\n---\n\n你可能会问自己为什么 \"Saluton mondo!\" 是一个传统的问候语。这个短语在世界语中意思是 \"Hello world!\"\
  ，世界语是由路德维希·柴门霍夫于 1887 年创造的一种人造语言，旨在促进国际交流。它之所以是一个传统问候语，仅仅是因为我试图开创这个传统。\n\n### 总结\n\
  \n在这一小时里，你首次有机会创建一个 Java 程序。你了解到，要开发一个 Java 程序，你需要完成以下四个基本步骤：\n\n1.  使用文本编辑器或像 `NetBeans`\
  \ 这样的工具编写程序。\n2.  将程序编译成类文件。\n3.  告诉 Java 虚拟机运行该类。\n4.  打电话给你妈妈。\n\n在此过程中，你接触到了一些基本的计算机编程概念，如编译器、解释器、块、语句和变量。这些概念在后续的小时中会变得更清晰。只要你让\
  \ `Saluton` 程序在本小时内运行起来，你就准备好继续了。\n\n（第四步与 Java 编程无关。这只是我母亲建议我放进书里的。）\n\n### 研讨会\n\
  \n#### 问答\n\n**问：** 在 Java 程序的一行中放置正确数量的空格有多重要？\n\n**答：** 对计算机来说这完全不重要。空格纯粹是为了让看程序的人更舒服——Java\
  \ 编译器根本不在乎。你本可以不用空格来编写 `Saluton` 程序，或者用 `Tab` 键来缩进代码行，它仍然能成功编译。\n\n\n\n\n## Java\
  \ 编程风格与常见问题\n\n尽管行前的空格数量并不重要，但你应该在 Java 程序中使用一致的间距和缩进。为什么？因为间距能让你更容易看清程序的组织结构，以及一条语句属于哪个编程块。\n\
  \n你编写的程序必须让其他程序员能够理解，包括你自己在数周或数月后查看代码以修复错误或进行增强时。一致的间距和缩进是所谓的编程风格的一部分。好的程序员会采用一种风格并在所有工作中实践它。\n\
  \n**问：** Java 程序被描述为一个类，也是一组类。到底是哪一个？\n\n**答：** 两者都是。你在接下来几个小时里创建的简单 Java 程序会被编译成一个扩展名为\
  \ `.class` 的单个文件。你可以使用 Java 虚拟机（`Java Virtual Machine`）运行这些文件。Java 程序也可以由一组协同工作的类组成。这个主题将在\
  \ 第 10 小时 “创建你的第一个对象” 中深入探讨。\n\n**问：** 如果每条语句末尾都需要分号，为什么注释行 `// My first Java program\
  \ goes here` 末尾没有分号？\n\n**答：** 注释会被编译器完全忽略。如果你在程序的某一行放置了 `//`，这会告诉 Java 编译器忽略该行\
  \ `//` 右侧的所有内容。下面的例子展示了与语句在同一行的注释：\n\n```\nSystem.out.println(greeting); // hello,\
  \ world!\n```\n\n**问：** 我在编译器指出错误的那行找不到任何错误。我该怎么办？\n\n**答：** 错误消息中显示的行号并不总是需要修复错误的地方。请仔细检查错误消息正上方的语句，看看是否能发现任何拼写错误或其他错误。错误通常就在同一个编程块内。\n\
  \n**问：** 我如何才能去南极洲旅游？\n\n**答：** 如果你不愿意成为科研人员或支持人员（如厨师、电工或医生），你可以成为每年 10,000 名以游客身份访问这片冰封大陆的人之一。\n\
  \n可以从澳大利亚、新西兰和南美提供飞越南极的航班，费用约为每人 1,000 美元。\n\n有几艘游轮提供为期 10 天到三周的旅行，其中最贵的大约是 25,000\
  \ 美元。一些游轮提供了在企鹅群中划皮艇或徒步、参观冰山甚至露营过夜的机会。\n\n`Polar Cruises` 网站（[www.polarcruises.com](http://www.polarcruises.com)）为潜在的南极游客提供了更多信息。\n\
  \n英国南极调查局为游客提供了一条建议：“除非经过适当训练，否则不要走上冰川或大片雪地。”\n\n#### 测验\n\n通过回答以下问题，测试你对本小时涵盖内容的理解。\n\
  \n**1.** 当你编译一个 Java 程序时，你在做什么？\n\n**A.** 将其保存到磁盘\n\n**B.** 将其转换成计算机能更好地理解的形式\n\n\
  **C.** 将其添加到你的程序集合中\n\n**2.** 什么是变量？\n\n**A.** 会摇晃但不会倒下的东西\n\n**B.** 编译器在程序中忽略的文本\n\
  \n**C.** 程序中存储信息的地方\n\n**3.** 修复错误的过程叫什么？\n\n**A.** 除霜\n\n**B.** 调试\n\n**C.** 分解\n\
  \n#### 答案\n\n**1. B.** 编译程序会将一个 `.java` 文件转换成一个或一组 `.class` 文件。\n\n**2. C.** 变量是存储信息的一种地方；稍后你会了解其他地方，比如数组和常量。`Weebles`\
  \ 会摇晃但不会倒下，而注释是编译器在程序中忽略的文本。\n\n**3. B.** 因为计算机程序中的错误被称为 `bugs`，所以修复这些错误被称为调试。一些编程工具附带了一个叫做调试器（`debugger`）的工具，可以帮助你修复错误。`NetBeans`\
  \ 就拥有其中一个最棒的调试器。\n\n#### 活动\n\n如果你想更全面地探索本小时涵盖的主题，请尝试以下活动：\n\n![Image](img/image00476.jpeg)\
  \ 你可以使用谷歌翻译器（[`translate.google.com`](http://translate.google.com)）将英文短语 “Hello\
  \ world!” 翻译成其他语言。编写一个程序，让你的计算机能用法语、意大利语或葡萄牙语等语言向世界问好。\n\n![Image](img/image00476.jpeg)\
  \ 返回 `Saluton` 程序并添加一两个错误。例如，去掉行末的分号，或将一行中的文本 `println` 改为 `print1n`（用数字 1 代替字母\
  \ L）。保存程序并尝试编译它；然后比较你看到的错误消息和你造成的错误。\n\n要查看这些活动的解决方案，请访问本书网站 [www.java24hours.com](http://www.java24hours.com)。\n\
  \n## 第 3 小时：Java 之旅\n\n本小时待办事项：\n\n![Image](img/image00474.jpeg) 发现 Java 的历史。\n\n\
  ![Image](img/image00474.jpeg) 学习使用这门语言的好处。\n\n![Image](img/image00474.jpeg) 查看 Java\
  \ 应用的实例。\n\n在你进一步深入 Java 编程之前，值得更多地了解这门语言，并看看程序员们今天用它在做什么。尽管 Java 早已超越了作为专注于网页浏览器程序语言的起源，但你仍然可以在网上找到一些关于\
  \ Java 如何被使用的有趣例子。\n\n在本小时中，我们将看看展示 Java 程序的网站，并讨论这门语言的历史和发展。\n\n要进行这次旅行，你需要一个已设置好可以运行\
  \ Java 程序的网页浏览器。\n\n加载你选择的浏览器，穿上你最好的蜡染衬衫，准备好开始一次旅行。你不会离开你的房子，也不会体验到旅游的简单乐趣，比如异国情调的风景、当地人、美食、有食物的当地人等等。\n\
  \n不过，往好处想：没有旅行支票的麻烦，没有护照，也没有蒙特祖马的复仇。\n\n### 第一站：Oracle\n\nJava 之旅从 [www.java.com](http://www.java.com)\
  \ 开始，这是一个由 Oracle（控制 Java 语言的公司）发布的网站。\n\n作为网页的一部分运行的 Java 程序被称为小程序（`applet`）。小程序像页面的其他元素（如照片和文本）一样被放置在页面上。标记语言\
  \ `HTML` 定义了程序应该显示在哪里、它有多大以及运行时做什么。Java 还通过另外两种方式增强 Web：用 Java 编写的桌面程序可以从网页浏览器启动，而\
  \ Java 服务器小程序（`Java servlets`）由 Web 服务器运行以提供 Web 应用程序。\n\n图 3.1 展示了 RuneScape，一款由\
  \ Java 支持的大型多人在线游戏。你可以使用任何网页浏览器访问 [www.runescape.com](http://www.runescape.com)\
  \ 免费玩这款游戏。当你访问该网站时，它会邀请你运行并在主页上玩游戏。这个程序是用 Java 语言实现的。\n\n![Image](img/image00480.jpeg)\n\
  \n**图 3.1** Java 驱动的在线游戏 RuneScape。\n\n当你运行它时，游戏在几秒钟内加载，你就可以开始创建角色并探索一个奇幻世界。\n\n\
  Oracle 的 Java 部门领导着 Java 语言的开发。*Java Magazine* 是 Oracle 在 [Java.com](http://Java.com)\
  \ 提供的免费在线杂志，展示了 Java 如何在网站、Android 手机和其他平台上被使用。数十亿台设备运行着用 Java 编写的程序。\n\n[Java.com](http://Java.com)\
  \ 网站帮助人们安装能够运行小程序的浏览器增强插件。它还描述了这门语言目前在互联网上被使用的一些方式。\n\n\n\n\nOracle 还为 Java 程序员提供了一个更具技术导向的网站：[www.oracle.com/technetwork/java](http://www.oracle.com/technetwork/java)。在此网站上，您可以找到最新发布的\
  \ NetBeans 版本、Java 开发工具包以及其他编程资源。\n\n***\n\n**提示**\n\nOracle 将 Java 插件与 `JDK` 及其他产品捆绑提供，因此它可能已安装在您的计算机上。如果您不确定\
  \ Java 是否已安装，请访问 [www.java.com](http://www.java.com) 网站。“我有 Java 吗？”链接可以检测 Java\
  \ 的存在。如果未找到，您将有机会下载它。\n\n***\n\n### Java 简史\n\nBill Joy，Sun Microsystems 公司创建 Java\
  \ 时的高管之一，将该语言称为“历时 15 年工作、旨在创造一种更好、更可靠的计算机编程方式的最终成果”。Java 的诞生过程则比这更复杂一些。\n\nJava\
  \ 于 1990 年由 James Gosling 开发，最初是作为智能电器（交互式电视、全知烤箱、时光旅行终结者、奴役人类的天网军用卫星等）的“大脑”而设计的语言。Gosling\
  \ 对使用一种名为 `C++` 的编程语言编写程序的结果感到不满。在灵感迸发下，他将自己关在办公室里，编写了一种更能满足其需求的新语言。\n\n***\n\n\
  **注意**\n\n您可能听说过 Java 是 “Just Another Vague Acronym” 的首字母缩写。也可能听说过它得名于 Gosling 对咖啡的喜爱。\n\
  \nJava 命名背后的故事不包含任何秘密信息或对液体的热爱宣言。选择 Java 作为名称的原因与喜剧演员 Jerry Seinfeld 喜欢说 *salsa*（莎莎）这个词一样：听起来就是很酷。\n\
  \n***\n\nGosling 将他的新语言命名为 Oak，以一棵他能从办公室窗口看到的树命名。该语言是他公司计划在交互式电视成为价值数百万美元的行业时大赚一笔的战略的一部分。这在今天仍未实现（尽管\
  \ Netflix、Hulu 等公司正在努力尝试），但 Gosling 的新语言却发生了完全不同的事情。就在 Oak 即将被废弃时，网络普及了。\n\n在一次偶然的情况下，许多使\
  \ Gosling 的语言在其电器项目上表现出色的特性，也使其适合移植到网络上。他的团队设计了一种让程序从网页安全运行的方法，并为语言的新用途选择了一个朗朗上口的新名字：Java。\n\
  \n尽管 Java 可用于许多其他方面，但它最初的成功展示是借助网络，吸引了全球软件开发者的注意力。当这门语言声名鹊起时，除非你被单独监禁或执行长期轨道任务，否则很难不听说它。\n\
  \nJava 语言共有九个主要版本，每个版本都引入了一些重要的新特性。以下是前八个版本：\n\n![Image](img/image00476.jpeg) **Java\
  \ 1.0** —— 原始版本（1995 年）\n\n![Image](img/image00476.jpeg) **Java 1.1** —— Java 数据库连接（JDBC），改进的图形用户界面（1997\
  \ 年）\n\n![Image](img/image00476.jpeg) **Java 2 版本 1.2** —— 内部类、用于网络浏览器的 Java 插件以及数据结构（1998\
  \ 年）\n\n![Image](img/image00476.jpeg) **Java 2 版本 1.3** —— 增强的多媒体功能（2000 年）\n\n\
  ![Image](img/image00476.jpeg) **Java 2 版本 1.4** —— 改进的互联网支持、XML 处理和断言（2002 年）\n\n\
  ![Image](img/image00476.jpeg) **Java 5** —— 泛型、新的 for 循环、注解以及自动数据类型转换（2005 年）\n\n\
  ![Image](img/image00476.jpeg) **Java 6** —— 内置的 Derby 数据库和 Web 服务（2006 年）\n\n![Image](img/image00476.jpeg)\
  \ **Java 7** —— 内存和资源管理的改进以及 Nimbus 图形用户界面（2011 年）\n\n***\n\n**注意**\n\n您是否好奇为什么\
  \ Java 的版本号如此奇怪，从 2 跳到 6，将第七版称为 Java 6，并且在某些版本中同时包含整数和小数？我也是！\n\n幸运的是，自 2006 年以来，版本编号方案变得更加合理，每个新版本都是比上一个版本高一个的整数。\n\
  \n***\n\n当前版本 `Java 8` 于 2014 年 3 月发布。这个版本历时三年开发，引入了闭包，这是高级 Java 编程中备受期待的功能，您将在第\
  \ 20 小时 “使用内部类和闭包” 中学习到。此外，它还提供了更好的处理日期和时间的方法，以及一些有用的新集合和注解。\n\n如果您不知道所有这些东西是什么——比如内部类、泛型或\
  \ XML——请不要惊慌。您将在接下来的 21 小时内学习它们。\n\n***\n\n**警告**\n\n当您访问此网站运行小程序时，您可能会在 Windows\
  \ 上收到“应用程序已被阻止”的安全警告。在本书付印前不久，Oracle 更改了 Java 插件处理不包含验证其作者身份的数字签名的小程序的方式。现在小程序会出错并显示警告，而不是询问用户是否要运行它们。\n\
  \n您可以编辑 Java 安全设置，以允许特定网页的小程序运行。打开控制面板，单击 Java，然后单击“安全”选项卡。单击“编辑站点列表”按钮添加网页并允许其小程序（或多个小程序）加载。\n\
  \n***\n\n### 使用 Java 上学\n\n网络包含大量供教育工作者和学童使用的资源。由于 Java 程序可以提供比标准网页更丰富的交互体验，一些程序员已使用这门语言编写面向互联网的学习程序。\n\
  \n作为一个例子，请访问 [www.cs.ubc.ca/~van/sssjava](http://www.cs.ubc.ca/~van/sssjava)，体验由不列颠哥伦比亚大学计算机科学教授\
  \ Michiel van de Panne 创建的跳台滑雪模拟器。该程序使用 Java 来演示基于物理的动画，滑雪者尝试不同的坡度和跳台。滑雪者的运动通过将鼠标向八个方向之一移动来控制，每个方向都会影响跳跃的成功率。图\
  \ 3.2 显示了我的虚拟滑雪者在遭遇悲惨结局之前的一次程序运行。\n\n![Image](img/image00481.jpeg)\n\n**图 3.2**\
  \ 可以使用 Java 程序在 Web 上交互式体验跳台滑雪模拟器。\n\n众多教育程序可用于许多操作系统，但该程序脱颖而出的一个特点是其可用性。模拟器直接从网页运行。无需特殊安装，而且与大多数桌面软件不同，它不受限于特定操作系统。您可以在任何拥有\
  \ Java 虚拟机（`JVM`）的计算机上运行 Java 程序。\n\n浏览器加载的 `JVM` 与您在第 2 小时 “编写您的第一个程序” 中用来运行 `Saluton`\
  \ 程序的 `JVM` 是同一个。浏览器的 `JVM` 只能运行为在网页上运行而设置的 Java 程序，无法处理为在其他地方（例如在桌面计算机上）运行而设置的程序。\n\
  \n首批支持 Java 的浏览器包含内置的 `JVM`。如今，浏览器通过依赖 Oracle 的 Java 插件（一个作为浏览器增强功能的 `JVM`）来支持 Java。\n\
  \n像跳台滑雪模拟器这样的 Java 程序，不必为特定操作系统编写。由于像 Windows 这样的操作系统也被称为平台，这个优势被称为平台独立性。Java 的创建就是为了在多个系统上工作。Java\
  \ 的开发者认为它需要是多平台的，因为它将被用于各种电器和其他电子设备。\n\n用户可以在各种系统上运行您用 Java 编写的程序，而无需您进行任何额外工作。在适当的情况下，Java\
  \ 可以消除为不同操作系统和设备创建特定版本程序的需求。\n\n### 在 JavaWorld 共进午餐\n\n\n\n### 培训\n\n在经过紧张的培训后，可能会感到有些疲惫，此时可以稍作休息。您或许可以考虑阅读《JavaWorld》，这是一个面向\
  \ Java 程序员的在线杂志。请访问 [www.javaworld.com](http://www.javaworld.com)。\n\n`JavaWorld`\
  \ 提供有关 Java 开发热点领域的操作指南、新闻报道和研究资料。该出版物网络格式的一个优势是，它可以在文章中展示功能性的 Java 程序。Figure 3.3\
  \ 展示了一个与解释其编写过程的教程一同出现的 Java 诗歌磁贴板。\n\n![Image](img/image00482.jpeg)\n\n**FIGURE\
  \ 3.3** 一篇关于如何创建诗歌磁贴板的 `JavaWorld` 操作指南文章，其中包含该程序的可运行示例。\n\n* * *\n\n注意\n\n`JavaWorld`\
  \ 偶尔会调整内容位置，但您可以直接访问诗歌磁贴板教程：[www.cadenhead.org/poetry](http://www.cadenhead.org/poetry)。\n\
  \n* * *\n\n`JavaWorld` 发表关于该语言及其发展的文章和评论。自 Java 引入以来，一个一直被激烈辩论的问题是该语言是否安全。\n\n安全性之所以重要，是因为\
  \ Java 程序在网页上运行的方式。您在本节中尝试的 Java 程序会被下载到您的计算机上。当程序下载完成后，它会在您的计算机上运行。\n\n除非您认识非常多的人，否则您访问的大多数网页都是由陌生人发布的。从安全角度来看，运行他们的程序与让公众来借用您的计算机没有太大区别。如果\
  \ Java 语言没有防止滥用的安全措施，其程序可能会向您的系统引入病毒、删除文件、播放威廉·沙特纳的口头歌曲表演，以及其他难以言说的事情。\n\nJava 包含多种安全措施，以确保其程序在网页上运行时是安全的。主要的安全性由针对在\
  \ Web 上运行的 Java 小程序（applets）的限制提供：\n\n![Image](img/image00476.jpeg) 任何小程序都不能在用户的计算机上打开、读取、写入或删除文件或系统属性。\n\
  \n![Image](img/image00476.jpeg) 任何小程序都不能在用户的计算机上运行其他程序。\n\n![Image](img/image00476.jpeg)\
  \ 由小程序创建的所有窗口都必须明确标识为 Java 窗口。\n\n![Image](img/image00476.jpeg) 小程序不能连接到托管它们以外的其他网站。\n\
  \n![Image](img/image00476.jpeg) 所有小程序都经过验证，以确保在编译后没有任何内容被修改。\n\n该语言通常被认为足够安全，可以在\
  \ Web 上使用，但近年来出现的安全漏洞促使一些安全专家建议用户在浏览器中完全禁用 Java。为了解决这些顾虑，Oracle 提供了与 Java 插件一起的\
  \ Java 更新工具，以确保在发现漏洞时可以升级语言来阻止它们。\n\nJava 语言还为在浏览器中运行的程序提供了更灵活的安全策略。您可以将某些公司和程序员指定为受信任的开发者，这使得他们的\
  \ Java 小程序可以在您的浏览器中运行，而无需通常存在的限制。\n\n这种信任体系是通过使用具有数字签名的签名小程序建立的，数字签名是清晰地标识 Java\
  \ 程序作者的文件。这些签名是与独立的验证组（如`VeriSign`）合作创建的。\n\n如果您曾经授权某个程序在`Internet Explorer`或`Google\
  \ Chrome`等浏览器中运行，那么您已经使用了类似的信任和身份验证系统。\n\n如今小程序仍然可以发挥作用，但多年来，其他技术（如`Flash`、`Silverlight`和`HTML5`）已被用于基于网页的程序。Java\
  \ 更常见地出现在移动应用、服务器程序和桌面软件中。\n\n### 在 NASA 观察天空\n\nJava 之旅的第一个下午停留点是前往 NASA，这是一个广泛使用\
  \ Java 的美国政府机构。一个著名的例子是`SkyWatch`，它是一个帮助观星者留意轨道卫星的小程序。通过访问 [www.cadenhead.org/nasa](http://www.cadenhead.org/nasa)\
  \ 在您的浏览器中加载它；您将自动被重定向到 NASA 的`SkyWatch`网站。\n\n`SkyWatch` 将卫星的当前位置和路径（您可以添加或从视图中删除）叠加在地球模型上。Figure\
  \ 3.4 中运行的小程序显示了`Galaxy Evolution Explorer`卫星（`GALEX`）在早上 6 点前约三分钟内穿过水瓶座的路径。\n\n\
  ![Image](img/image00483.jpeg)\n\n**FIGURE 3.4** NASA 的`SkyWatch`小程序监控轨道卫星的位置和路径，是观星爱好者的福音。\n\
  \n该小程序在运行时会重新绘制每个被跟踪卫星的位置。这种实时更新之所以可能，是因为 Java 语言是多线程的。多线程是计算机同时处理多件事情的一种方式。程序的一部分负责一项任务，另一部分负责不同的任务，这两部分可以互不干扰。在这个例子中，程序的每一部分被称为一个线程。\n\
  \n在像`SkyWatch`这样的程序中，每颗卫星都可以在自己的线程中运行。如果您使用像`Windows 8`这样的操作系统，当您同时运行多个程序时，您就在使用这种行为的一种类型。如果您在工作中在一个窗口玩`Desktop\
  \ Tower Defense`，同时在另一个窗口运行公司销售报告，并且给朋友打长途电话，那么恭喜您——您正在进行多线程处理！\n\n### 投入商业应用\n\n\
  在您旅途中的这个阶段，您可能会留下这样的印象：Java 主要对太空爱好者、糟糕的诗人和糟糕的滑雪者有用。我们旅途中的下一站将展示 Java 投入商业应用的例子。\n\
  \n将您的网络浏览器引导到`QuoteMedia`网站：[www.quotemedia.com](http://www.quotemedia.com)。该公司提供一个\
  \ Java 小程序，用于在其他网站上显示股票报价。Figure 3.5 展示了其滚动股票行情的一个演示。（要亲自查看，请访问 [www.cadenhead.org/stocks](http://www.cadenhead.org/stocks)\
  \ 重定向到该页面。）\n\n![Image](img/image00484.jpeg)\n\n**FIGURE 3.5** 来自`QuoteMedia`的 Java\
  \ 程序报告股票市场价格。\n\n与那些需要为每位需要访问权限的员工在其计算机上安装软件的其他股票分析程序不同，使用 Java 使`QuoteMedia`的客户能够向任何拥有网络浏览器的人提供这些程序。所有员工需要做的就是访问公司的网站。\n\
  \n您可以从多个角度思考像这个股票行情小程序这样的程序。一种是将程序视为一个对象——存在于世界上、占据空间并具有某些功能的东西。面向对象编程（`OOP`）是创建计算机程序作为一组对象的一种方式，您将在\
  \ Hour 10，“创建您的第一个对象”中发现 Java 使用了它。每个对象处理一个特定的工作，并知道如何与其他对象通信。例如，一个股票行情程序可以设置为以下对象组：\n\
  \n![Image](img/image00476.jpeg) 一个报价对象，代表单个股票报价。\n\n![Image](img/image00476.jpeg)\
  \ 一个投资组合对象，持有特定股票的一组报价。\n\n![Image](img/image00476.jpeg) 一个行情对象，显示一个投资组合。\n\n![Image](img/image00476.jpeg)\
  \ 一个互联网对象、一个用户对象以及许多其他对象。\n\n在这种模型下，股票行情软件是完成工作所需的所有对象的集合。\n\n\n\n\n\n# OOP 与 Java\
  \ 编程\n\n面向对象编程（OOP）是一种强大的编程方式，它使你编写的程序更加有用。以股票软件为例，如果程序员希望将该程序的报价功能与其他软件一起使用，那么报价对象就可以在新的程序中被复用，无需任何更改。\n\
  \n使用对象创建的程序更易于维护，因为它们组织得更好。对象包含了完成其工作所需的数据和代码。对象也使得程序更具可扩展性。一个新对象可以以现有对象为模板进行设计，并添加新的功能来增强它。\n\
  \n### 造访 SourceForge 以获取指引\n\n这次 Java 程序世界之旅是由一位深谙网络旅行风险和亮点的专业人士带领的。你很快也将开始自己的旅行，因此，了解一个对程序员极具价值的网站——SourceForge\
  \ 的布局是非常值得的。SourceForge 是寻找完整的 Java（或其他语言）程序示例的最佳场所之一。你可以在[www.sourceforge.net](http://www.sourceforge.net)找到它。\n\
  \nSourceForge 是一个专注于协作编程项目的庞大网站。如果你有兴趣与他人合作开发一个程序，你可以在 SourceForge 上启动一个项目，共享其所有文件，招募其他人，并与他们沟通。该网站上\
  \ 30 多万个项目全部是开源的，这意味着程序员们共享了所有的源代码。如果你不熟悉这个术语，“源代码”是用于创建计算机程序的文本文件的另一个名称。你在第 2 小时中开发的`Saluton.java`文件就是一个源代码的例子。\n\
  \n如果你使用 SourceForge 主页顶部的搜索框来搜索 Java applets，你将在这个网站的项目目录中找到超过 7,000 个结果。\n\nSourceForge\
  \ 上的一个项目是 Aleksey Udovydchenko 的 Absolute，这是一款街机风格的太空电子游戏，在游戏中你可以控制一艘飞船，在小行星带中杀出一条血路（见图\
  \ 3.6）。该游戏具有滚动动画、图形界面、键盘控制和声音效果。要了解更多信息，请访问[www.cadenhead.org/absolute](http://www.cadenhead.org/absolute)来玩这个游戏，并访问[www.sourceforge.net/projects/absolutejava](http://www.sourceforge.net/projects/absolutejava)来下载源代码。\n\
  \n![Image](img/image00485.jpeg)\n\n**图 3.6** 诸如 Aleksey Udovydchenko 的太空射击游戏 Absolute\
  \ 这样的 Java 程序的源代码可以在 SourceForge 上找到。\n\n整个 Absolute 程序仅用 700 多行代码编写而成。考虑到程序的所有功能，这是一个极小的数字。原因之一是\
  \ Java 包含了一个庞大的类库，你可以在自己的程序中使用这些类。Udovydchenko 使用了库中的`Image`类来显示小行星等图形，并使用`AudioClip`类来播放激光射击和爆炸声效。\n\
  \n众多程序用 Java 编写的原因之一——无论是在 SourceForge 上还是其他地方——是因为这种语言在拥有强大功能的同时，被设计得更易于学习。\n\n\
  该语言最初的设计目标是使其比 C++（高斯林在 1990 年代处理智能设备项目时倍感挫折的语言）更快地掌握。Java 的很多部分基于 C++，因此已经学会使用\
  \ C++的程序员会发现学习 Java 更容易。然而，C++中一些最难学习和正确使用的元素在 Java 中并不存在。\n\n对于第一次学习编程的人来说，Java\
  \ 比 C++更容易学。有些语言是为让经验丰富的程序员更轻松地利用计算机能力而设计的。这些语言包含编程老手容易理解的快捷方式和其他特性。\n\nJava 并不使用其中的一些特性，而是倾向于使这种语言尽可能地简单，就像一种面向对象编程语言所能达到的那样。Java\
  \ 被创建得易于学习、易于调试且易于使用。Java 包含众多增强功能，使其成为其他语言的有力竞争者。\n\n### 在你的手机上运行 Java\n\n这次 Java\
  \ 之旅的最后一站是你最近的谷歌 Android 手机。在 Android 上运行的每一个程序都是用 Java 编程的。这些扩展了手机功能的移动程序被称为应用程序（apps）。最受欢迎的应用程序之一就是《愤怒的小鸟》，如图\
  \ 3.7 所示。\n\n![Image](img/image00486.jpeg)\n\n**图 3.7** 《愤怒的小鸟》和所有其他的 Android 应用程序都是用\
  \ Java 语言创建的。\n\n如果你还不熟悉这款游戏，可以通过访问[www.angrybirds.com](http://www.angrybirds.com)来了解更多信息。（但别这么做！这游戏会摧毁你在今天、这周甚至这个月剩余时间里保持高效的任何希望——取决于你有多讨厌武装过的猪。）\n\
  \nAndroid 是这次 Java 之旅的终点，因为它正在成为这种语言使用的一个令人难以置信的热门平台。在你学会 Java 之后，你可以运用你的技能，使用 Android\
  \ 软件开发工具包（SDK）来开发自己的应用程序，这是一个免费的编程工具包，可在 Windows、Mac OS 和 Linux 上运行。\n\n已有超过 25\
  \ 万款应用程序为 Android 手机及其他运行该移动操作系统的设备而创建。你将在第 24 小时“编写 Android 应用程序”中了解更多关于如何创建它们的信息。\n\
  \n### 总结\n\n现在，一小时的假期结束了，是时候收拾行李，准备回归真正的 Java 编程了。\n\n在接下来的 21 个小时里，你将掌握 Java 语言的基本构建块，学习如何创建自己的对象以在面向对象编程中完成任务，设计图形用户界面等等。\n\
  \n除非你为了玩《愤怒的小鸟》而放下了这本书。\n\n### 研讨会\n\n#### 问答\n\n**问：** 为什么 Java applets 不再流行了？\n\
  \n**答：** 当 Java 语言在 1990 年代中期推出时，大多数人学习该语言是为了编写 applets。Java 是创建在网页浏览器中运行的交互式程序的唯一方式。多年来，替代方案出现了。Macromedia\
  \ Flash、Microsoft Silverlight 和新的网页发布标准 HTML5 都提供了将程序置于网页上的方法。\n\nApplets 受到加载时间差和浏览器开发者对新版\
  \ Java 支持缓慢的阻碍。Java 插件被引入以在浏览器中运行当前版本的 Java，但到那时，Java 已经超越了其起源，成为一种复杂的通用编程语言。\n\n\
  **问：** Java SE（Java 标准版）和 Java EE（Java 企业版）之间有什么区别？Java EE 需要花钱吗？\n\n**答：** Java\
  \ 企业版是 Java 标准版的扩展，包含了支持高级技术的包，例如企业 JavaBeans、XML 处理和 servlet 的开发——servlet 是运行在\
  \ Web 服务器上的 Java 程序。Java EE 还包括一个应用服务器，这是一个复杂的执行 Java 软件的环境，专为有繁重计算需求的企业和其他大型组织量身定制。Java\
  \ EE 开发工具包可以从 Oracle 免费下载，地址是[www.oracle.com/technetwork/java/javaee](http://www.oracle.com/technetwork/java/javaee)。\n\
  \n**问：** 什么是 Chris Steak House，为什么 Ruth 有一个？\n\n**答：** Ruth's Chris Steak House\
  \ 是一家拥有超过 120 家高档牛排餐厅的连锁店，遍布美国和其他少数国家。它这个奇特的双名组合揭示了其卑微的起源和创始人的固执性格。\n\n\n\n\n\n\
  ### 一家餐馆的起源\n\n该连锁餐厅创立于 1965 年，最初是露丝·费特尔（Ruth Fertel）经营的一家位于新奥尔良的独立餐厅。费特尔是一位有两个儿子的单身母亲。她看到一则出售餐厅的分类广告，并通过办理一笔`$22,000`的房屋抵押贷款将其买下（相当于今天的约`$150,000`）。\n\
  \n她与原老板克里斯·马图利奇（Chris Matulich）达成协议，保留了“克里斯牛排馆”这一名称，但后来因厨房失火不得不重新选址。\n\n费特尔的合同不允许她在原址以外的地方使用“克里斯牛排馆”的名称，因此她将其更名为“露丝的克里斯牛排馆”。尽管她没有餐饮或烹饪方面的专业知识，但生意异常成功，以至于在\
  \ 12 年内她就开始以特许经营的方式提供加盟。多年来，她无视了多次将餐厅更名以扩大吸引力的建议。\n\n“我一直讨厌这个名字，”她曾告诉《财富》杂志的一名记者，“但我们总能想办法应对。”\n\
  \n费特尔于 2002 年去世，生于 1927 年 2 月 5 日——这一天正是马图利奇开设第一家牛排馆的日子。\n\n### 小测验\n\n如果读到这里你的思绪还没有走神，不妨通过以下问题测试一下你对本小时内容的掌握程度。\n\
  \n**1.** 面向对象编程是如何得名的？\n\n**A.** 程序被认为是一组协同工作的对象。\n\n**B.** 人们经常反对，因为它很难掌握。\n\n\
  **C.** 它的父母给它起的名字。\n\n**2.** 以下哪项不是 Java 安全机制的一部分？\n\n**A.** 网页程序无法在用户的计算机上运行其他程序。\n\
  \n**B.** 程序作者的身份总是经过验证的。\n\n**C.** Java 窗口被标记为 Java 窗口。\n\n**3.** 计算机或设备需要什么才能运行\
  \ Java 程序？\n\n**A.** Java 编译器\n\n**B.** Java 虚拟机\n\n**C.** 两者都需要\n\n### 答案\n\n**1.\
  \ A.** 它也常被缩写为 OOP。\n\n**2. B.** 在 Java 中，程序员可以使用数字签名和像 VeriSign 这样的身份验证公司，但这并不是强制要求的。\n\
  \n**3. B.** Java 虚拟机（JVM）是一个解释器，它将 Java 字节码转换为计算机或设备可以执行的指令。创建 Java 程序需要编译器，但运行程序则不需要。\n\
  \n### 活动\n\n在收拾行李之前，你可以通过以下活动更充分地探索本小时涉及的主题：\n\n![Image](img/image00476.jpeg) 使用\
  \ [www.sourceforge.net](http://www.sourceforge.net) 上的 SourceForge，了解使用 Java 语言开发了哪些纸牌游戏。\n\
  \n![Image](img/image00476.jpeg) 访问 Oracle 的 Java 用户网站 [www.java.com](http://www.java.com)，然后点击“Do\
  \ I Have Java?”链接。按照说明查看你的计算机上是否安装了 Java。如果提示，请下载并安装最新版本。\n\n本书中活动的解答已发布在本书的网站 [www.java24hours.com](http://www.java24hours.com)\
  \ 上。\n\n## 第 4 小时. 理解 Java 程序如何工作\n\n本小时待办事项清单：\n\n![Image](img/image00474.jpeg)\
  \ 了解应用程序如何工作。\n\n![Image](img/image00474.jpeg) 构建一个应用程序。\n\n![Image](img/image00474.jpeg)\
  \ 向应用程序发送参数。\n\n![Image](img/image00474.jpeg) 了解 Java 程序的组织结构。\n\n![Image](img/image00474.jpeg)\
  \ 使用 Java 类库。\n\n![Image](img/image00474.jpeg) 在应用程序中创建对象。\n\n在 Java 编程中，一个重要的区别是你的程序应该在哪里运行。有些程序被设计为在你自己的计算机上工作。其他程序则被设计为作为网页的一部分运行。\n\
  \n在你本地计算机上运行的 Java 程序称为应用程序。在网页上运行的程序称为小程序，由网页服务器运行的程序称为 Servlet，而在移动设备上运行的程序称为应用。\n\
  \n在本小时中，你将创建一个应用程序并在你的计算机上运行它。\n\n### 创建一个应用程序\n\n你在第 2 小时“编写你的第一个程序”中编写的`Saluton`程序就是\
  \ Java 应用程序的一个例子。你将要创建的下一个应用程序将计算一个数的平方根并显示其值。\n\n在 NetBeans 中打开 Java24 项目后，开始创建一个新的应用程序：\n\
  \n**1.** 选择“文件”，“新建文件”。将打开新建文件向导。\n\n**2.** 选择类别`Java`和文件类型`空 Java 文件`，然后点击下一步。\n\
  \n**3.** 输入类名`Root`。\n\n**4.** 输入包名`com.java24hours`。\n\n**5.** 点击完成。\n\nNetBeans\
  \ 会创建`Root.java`并在源代码编辑器中打开这个空文件，以便你开始编辑。输入清单 4.1 中的所有内容，注意不要输入清单左侧的行号和冒号。这些数字是为了在书中更方便地描述程序的某些部分。完成后，点击工具栏上的“全部保存”按钮来保存文件。\n\
  \n#### 清单 4.1 `Root.java`的完整文本\n\n点击此处查看代码图片\n\n```java\npackage com.java24hours;\n\
  \nclass Root {\n    public static void main(String[] arguments) {\n        int number\
  \ = 225;\n        System.out.println(\"The square root of \"\n            + number\n\
  \            + \" is \"\n            + Math.sqrt(number)\n        );\n    }\n}\n\
  ```\n\n`Root`应用程序完成了以下任务：\n\n![Image](img/image00476.jpeg) 第 1 行——该应用程序被置于`com.java24hours`包中。\n\
  \n![Image](img/image00476.jpeg) 第 5 行——一个整数值 225 被存储在一个名为`number`的变量中。\n\n![Image](img/image00476.jpeg)\
  \ 第 6-10 行——显示这个整数及其平方根。第 9 行的`Math.sqrt(number)`语句显示平方根。\n\n如果你输入清单 4.1 时没有任何拼写错误，包括所有标点符号和如所示的大写，你可以通过在\
  \ NetBeans 中选择“运行”，“运行文件”来运行该文件。程序的输出将出现在“输出”窗格中，如图 4.1 所示。\n\n![Image](img/image00487.jpeg)\n\
  \n**图 4.1** `Root`应用程序的输出。\n\n当你运行一个 Java 应用程序时，Java 虚拟机（JVM）会寻找一个`main()`块，并开始处理该块中的\
  \ Java 语句。如果你的程序没有`main()`块，JVM 会返回一个错误。\n\n第 9 行的语句`Math.sqrt(number)`展示了 Java\
  \ 语言的一个内置功能——确定一个数的平方根的能力。有一个名为`Math`的 Java 程序，其中有一个名为`sqrt()`的方法用于求指定数的平方根。\n\n\
  `Math`程序是 Java 类库的一部分，你将在本小时稍后探索它。\n\n### 向应用程序发送参数\n\n你可以从命令行使用`java`（一个调用 JVM\
  \ 的程序）来运行 Java 应用程序。当你在 NetBeans 中运行程序时，它会在后台使用这个程序。当 Java 程序作为命令运行时，JVM 会加载该应用程序。命令可以包含额外的信息项，如下例所示：\n\
  \n点击此处查看代码图片\n\n```shell\njava TextDisplayer readme.txt /p\n```\n\n发送给程序的任何额外信息都称为参数。第一个参数（如果有的话）是在应用程序名称后隔一个空格提供的。每个附加参数也用一个空格分隔。在前面的例子中，参数是`readme.txt`和`/p`。\n\
  \n如果你想在参数内部包含一个空格，必须用引号将其括起来，如下所示：\n\n点击此处查看代码图片\n\n```shell\njava TextDisplayer\
  \ readme.txt /p \"Page Title\"\n```\n\n\n\n\n本示例使用三个参数运行 `TextDisplayer` 程序：`readme.txt`、`/p`\
  \ 和 `\"Page Title\"`。引号可防止 `Page` 和 `Title` 被当作单独的参数处理。\n\n你可以向 Java 应用程序发送任意数量的参数（在合理范围内）。要使用这些参数，必须在应用程序中编写相应的处理语句。\n\
  \n为了了解参数在应用程序中的工作原理，请在 Java24 项目中创建一个新的类：\n\n**1.** 选择 File，New File。\n\n**2.**\
  \ 在 New File 向导中，选择类别 `Java` 和文件类型 `Empty Java File`。\n\n**3.** 将类命名为 `BlankFiller`，包名为\
  \ `com.java24hours`，然后点击 Finish。\n\n在源代码编辑器中输入 清单 4.2 的文本，并在完成后保存。编译程序时，请根据编辑器在您输入时标记的错误进行修正。\n\
  \n**清单 4.2** `BlankFiller.java` 的完整文本\n\n点击此处查看代码图片\n\n* * *\n\n```\n 1: package\
  \ com.java24hours;\n 2: \n 3: class BlankFiller {\n 4:     public static void main(String[]\
  \ arguments) {\n 5:         System.out.println(\"The \" + arguments[0]\n 6:    \
  \         + \" \" + arguments[1] + \" fox \"\n 7:             + \"jumped over the\
  \ \"\n 8:             + arguments[2] + \" dog.\"\n 9:         );\n10:     }\n11:\
  \ }\n```\n\n* * *\n\n此应用程序可以成功编译并运行，但如果您尝试使用菜单命令 Run，Run File 来运行它，将会得到一个看起来复杂的错误：\n\
  \n**输出**\n\n点击此处查看代码图片\n\n```\nException in thread \"main\" java.lang.ArrayIndexOutOfBoundsException:\
  \ 0\n    at BlankFiller.main(BlankFiller.java:5)\n```\n\n此错误发生的原因是程序在运行时期望接收三个参数。您可以通过在\
  \ NetBeans 中自定义项目来指定参数：\n\n**1.** 选择菜单命令 Run，Set Project Configuration，Customize。这会打开\
  \ Project Properties 对话框。\n\n**2.** 在 Main Class 文本字段中输入 `com.java24hours.BlankFiller`。\n\
  \n**3.** 在 Arguments 字段中，输入 `retromingent purple lactose-intolerant` 并点击 OK。\n\n\
