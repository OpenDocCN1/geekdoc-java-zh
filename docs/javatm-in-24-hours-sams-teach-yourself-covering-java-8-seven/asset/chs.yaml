  \n# 第 20 小时. 使用内部类和闭包\n\n## 本小时任务清单：\n\n![图片](img/image00474.jpeg) 向对象添加内部类。\n\n\
  ![图片](img/image00474.jpeg) 探索内部类为何有用。\n\n![图片](img/image00474.jpeg) 创建匿名内部类。\n\n\
  ![图片](img/image00474.jpeg) 将适配器类与接口结合使用。\n\n![图片](img/image00474.jpeg) 了解 Java 8\
  \ 为何引入闭包。\n\n![图片](img/image00474.jpeg) 编写 lambda 表达式。\n\n![图片](img/image00474.jpeg)\
  \ 用 lambda 表达式替换匿名内部类。\n\n1995 年 Java 编程语言推出时，其应用范围有限且易于掌握。Java 类库中只有大约 250 个类。该语言的设计初衷主要是为了让被称为\
  \ `applet` 的交互式程序能够在 Web 浏览器内运行。由于当时没有其他技术能够实现这一点，Java 引起了巨大轰动，并迅速被数十万程序员所接受。\n\n\
  作为该语言设计精良的一个证明，它超越了最初的那个单一焦点，成为一种通用编程语言，足以与当时全球最流行、应用最广泛的 `C++` 语言相媲美。\n\n如今，当 Java\
  \ 接近 20 岁生日之际，仍有数百万程序员在使用它编写代码。每一次新版本的发布，Java 在支持现有开发者的同时，也扩展了其功能，以支持复杂的新软件开发方法。\n\
  \nJava 8 引入了一种令人兴奋的编码新方式，称为闭包或 lambda 表达式。这些表达式使得一种称为函数式编程的方法成为可能。\n\n在本小时中，在介绍了使用它们的两个先决条件——内部类和匿名内部类——之后，你将学习\
  \ lambda 表达式。\n\n### 内部类\n\n\n\n\n\n# Java 内部类\n\n当您在 Java 中创建一个类时，您需要定义该类的属性和行为。属性是保存数据的类变量和实例变量。行为是使用这些数据执行任务的方法。\n\
  \n一个类还可以包含同时具有属性和行为的东西：内部类。\n\n内部类是包含在封闭类中的辅助类。您可能想知道它们为什么是必要的，因为用尽可能多的新类创建一个程序是很容易的。如果您正在编写一个\
  \ `CheckBook` 程序，该程序需要为个人签发的每张支票创建对象，您会创建一个 `Check` 类。如果程序支持周期性的月度支付，则会添加一个 `Autopayment`\
  \ 类。\n\n内部类不是必需的。但是当您了解了它们能做的所有事情后，您会发现很多情况下它们非常方便。\n\nJava 包含内部类有三个原因：\n\n`1.`\
  \ 当一个辅助类只被另一个类使用时，将其定义在那个类内部是有意义的。\n\n`2.` 它们使一个辅助类能够访问作为独立类时无法访问的 `private` 方法和变量。\n\
  \n`3.` 它们将辅助类放置在尽可能靠近它在另一个类中使用的位置。\n\n内部类使用 `class` 关键字创建，与任何其他类一样，但它是在包含类内部声明的。通常，这与类变量和实例变量放在一起。\n\
  \n下面是一个在名为 `Simple` 的类内部创建的名为 `InnerSimple` 的内部类的示例：\n\n点击此处查看代码图片\n\n```java\n\
  public class Simple {\n\n    class InnerSimple {\n\n        InnerSimple() {\n\n\
  \            System.out.println(\"I am an inner class!\");\n\n        }\n\n    }\n\
  \n    public Simple() {\n\n        // empty constructor\n\n    }\n\n    public static\
  \ void main(String[] arguments) {\n\n        Simple program = new Simple();\n\n\
  \        Simple.InnerSimple inner = program.new InnerSimple();\n\n    }\n\n}\n```\n\
  \n内部类的结构与任何其他类相同，但放置在封闭类的 { 和 } 括号内。\n\n创建内部类需要一个外部类的对象。在对象上调用 `new` 运算符：\n\n点击此处查看代码图片\n\
  \n```java\nSimple.InnerSimple inner = program.new InnerSimple();\n```\n\n类的名称包括外部类的名称、一个句点（`.`）字符和内部类的名称。在前面的语句中，`Simple.InnerSimple`\
  \ 就是其名称。\n\n本小时的第一个项目是改写第 18 小时中的一个应用程序：\"处理程序中的错误。\"那一小时的 `PageCatalog` 应用程序需要一个名为\
  \ `HomePage` 的辅助类。清单 20.1 中的 `Catalog` 应用程序对该项目进行了修订，用内部类替换了那个单独的类。\n\n在包 `com.java24hours`\
  \ 中创建一个新的 Java 文件，名称为 `Catalog`；然后用清单 20.1 中的源代码填充它。\n\n## 清单 20.1 `Catalog.java`\
  \ 的完整文本\n\n点击此处查看代码图片\n\n```\n 1: package com.java24hours;\n 2: \n 3: import java.net.*;\n\
