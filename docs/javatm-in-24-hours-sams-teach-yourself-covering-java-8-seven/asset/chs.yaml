  \    JTextField keyText = new JTextField(80);\n 9:     JLabel keyLabel = new JLabel(\"\
  Press any key in the text field.\");\n10: \n11:     public KeyViewer() {\n12:  \
  \       super(\"KeyViewer\");\n13:         setLookAndFeel();\n14:         setSize(350,\
  \ 100);\n15:         setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n16:      \
  \   keyText.addKeyListener(this);\n17:         BorderLayout bord = new BorderLayout();\n\
  18:         setLayout(bord);\n19:         add(keyLabel, BorderLayout.NORTH);\n20:\
  \         add(keyText, BorderLayout.CENTER);\n21:         setVisible(true);\n22:\
  \     }\n23: \n24:     public void keyTyped(KeyEvent input) {\n25:         char\
  \ key = input.getKeyChar();\n26:         keyLabel.setText(\"You pressed \" + key);\n\
  27:     }\n28: \n29:     public void keyPressed(KeyEvent txt) {\n30:         //\
  \ do nothing\n31:     }\n32: \n33:     public void keyReleased(KeyEvent txt) {\n\
  34:         // do nothing\n35:     }\n36: \n37:     private void setLookAndFeel()\
  \ {\n38:         try {\n```\n\n\n\n\nUIManager.setLookAndFeel(\n    \"com.sun.java.swing.plaf.nimbus.NimbusLookAndFeel\"\
  \n);\n} catch (Exception exc) {\n    // 忽略错误\n}\n}\n\npublic static void main(String[]\
  \ arguments) {\n    KeyViewer frame = new KeyViewer();\n}\n}\n---\n\n当你运行该应用程序时，它应类似于\
  \ 图 15.1。\n\n![Image](img/image00526.jpeg)\n**图 15.1** 在程序中处理键盘事件。\n\n#### 启用和禁用组件\n\
  \n你可能在程序中见过某个组件呈现为灰色阴影而非其正常外观。阴影表示用户无法对该组件执行任何操作，因为它已被禁用。禁用和启用组件是通过组件的 `setEnabled()`\
  \ 方法完成的。该方法接受一个布尔值作为参数，因此 `setEnabled(true)` 启用组件以供使用，而 `setEnabled(false)` 则禁用它。\n\
  \n以下语句创建了标有“上一步”、“下一步”和“完成”的按钮，并禁用了第一个按钮：\n\n```\nJButton previousButton = new JButton(\"\
  Previous\");\nJButton nextButton = new JButton(\"Next\");\nJButton finishButton\
  \ = new JButton(\"Finish\");\npreviousButton.setEnabled(false);\n```\n\n此方法是防止组件在不应发送用户事件时发送事件的有效方式。例如，如果你正在编写一个使用文本字段收集用户地址的\
  \ Java 应用程序，你可以禁用“保存地址”按钮，直到用户提供了街道地址、城市、州和邮政编码。\n\n### 完成图形应用程序\n\n为了了解 Swing 的事件处理类在\
  \ Java 程序中的工作方式，你将完成 `LottoMadness`，这是一个在 第 14 小时“布局用户界面”中开始的彩票模拟程序。\n\n此时，`LottoMadness`\
  \ 只是一个图形用户界面（GUI）。你可以点击按钮并在文本框中输入文本，但没有任何响应。在这个练习中，你将创建 `LottoEvent`，这是一个新的类，用于接收用户输入、进行彩票抽奖并跟踪中奖次数。当该类完成后，你将向\
  \ `LottoMadness` 添加几行代码，以便使用 `LottoEvent`。通常将 Swing 项目这样划分是方便的，即 GUI 在一个类中，事件处理方法在另一个类中。\n\
  \n此应用程序的目的是评估用户在一生中赢得六号码彩票抽奖的机会。图 15.2 显示了程序运行时的屏幕截图。\n\n![Image](img/image00527.jpeg)\n\
  **图 15.2** 运行 `LottoMadness` 应用程序。\n\n计算机不使用概率来解决这个问题，而是快速连续地进行抽奖，直到有中奖者为止。由于“6\
  \ 中 6”的中奖概率极低，程序还会报告任何三个、四个或五个中奖号码的组合。\n\n该界面包括 12 个用于彩票号码的文本字段和两个分别标有“快速选择”和“手动选择”的复选框。六个禁用输入的文本字段用于显示每次抽奖的中奖号码。另外六个文本字段供用户选择号码。选择“快速选择”复选框会为用户随机选择六个号码。选择“手动选择”则允许用户选择所需的号码。\n\
  \n三个按钮控制程序的活动：停止、开始和重置。按下“开始”按钮时，程序会启动一个名为 `playing` 的线程并开始生成彩票抽奖。\n\n按下“停止”按钮会停止线程，按下“重置”会清空所有字段，以便用户可以重新开始。你将在\
  \ 第 19 小时“创建线程程序”中学习关于线程的内容。\n\n`LottoEvent` 类实现了三个接口：`ActionListener`、`ItemListener`\
  \ 和 `Runnable`。`Runnable` 接口与线程相关，在 第 19 小时 中介绍。监听器用于监听应用程序按钮和复选框生成的用户事件。程序不需要监听与文本字段相关的任何事件，因为它们严格用于存储用户选择的号码。用户界面会自动处理此存储。\n\
  \n该类需要使用主要的 Swing 包 `javax.swing` 和 Java 的事件处理包 `java.awt.event`。\n\n该类有两个实例变量：\n\
  \n- ![Image](img/image00476.jpeg) `gui`，一个 `LottoMadness` 对象\n- ![Image](img/image00476.jpeg)\
  \ `playing`，一个 `Thread` 对象，用于进行持续的彩票抽奖\n\n`gui` 变量用于与包含程序 GUI 的 `LottoMadness` 对象进行通信。当你需要对界面进行更改或从其某个文本字段检索值时，你会使用\
  \ `gui` 对象的实例变量。\n\n例如，`LottoMadness` 的 `play` 实例变量代表“开始”按钮。要在 `LottoEvent` 中禁用此按钮，你可以使用以下语句：\n\
  \n```\ngui.play.setEnabled(false);\n```\n\n你可以使用以下语句检索 `JTextField` 对象 `got3` 的值：\n\
  \n```\nString got3value = gui.got3.getText();\n```\n\n`清单 15.2` 包含 `LottoEvent`\
  \ 类的完整文本。请在 NetBeans 中创建一个名为 `LottoEvent` 的新 Java 文件以保存源代码。\n\n**清单 15.2** `LottoEvent.java`\
  \ 的完整文本\n\n```\npackage com.java24hours;\n\nimport javax.swing.*;\nimport java.awt.event.*;\n\
  \npublic class LottoEvent implements ItemListener, ActionListener,\n    Runnable\
  \ {\n\n    LottoMadness gui;\n    Thread playing;\n\n    public LottoEvent(LottoMadness\
  \ in) {\n        gui = in;\n    }\n\n    public void actionPerformed(ActionEvent\
  \ event) {\n        String command = event.getActionCommand();\n        if (command.equals(\"\
  Play\")) {\n            startPlaying();\n        }\n        if (command.equals(\"\
  Stop\")) {\n            stopPlaying();\n        }\n        if (command.equals(\"\
  Reset\")) {\n            clearAllFields();\n        }\n    }\n\n    void startPlaying()\
  \ {\n        playing = new Thread(this);\n        playing.start();\n        gui.play.setEnabled(false);\n\
  \        gui.stop.setEnabled(true);\n        gui.reset.setEnabled(false);\n    \
  \    gui.quickpick.setEnabled(false);\n        gui.personal.setEnabled(false);\n\
  \    }\n\n    void stopPlaying() {\n        gui.stop.setEnabled(false);\n      \
