  \ 11 行开始，接受网站所有者和网站 URI，另一个在第 18 行开始，接受网站所有者、URI 和类别。\n\n`Catalog` 类在第 27 行使用了这个内部类，创建了一个\
  \ `HomePage` 对象数组。内部类被引用为 `Catalog.HomePage`。\n\n应用程序的输出如图 20.1 所示。\n\n![图片](img/image00541.jpeg)\n\
  \n**图 20.1** `Catalog` 应用程序的输出。\n\n### 匿名内部类\n\n在 Java 编程中，您经常需要完成的一个常见任务是创建一个仅使用一次且具有简单目的的类。一种特殊的内部类非常适合这个目的。\n\
  \n匿名内部类是没有名称的类，它同时被声明和创建。\n\n要使用一个匿名内部类，您需要将对象的引用替换为 `new` 关键字、对构造方法的调用以及 { 和 }\
  \ 字符内的类定义。\n\n下面是一些不使用匿名内部类的代码：\n\n点击此处查看代码图片\n\n```java\nWorkerClass worker = new\
  \ WorkerClass();\nThread main = new Thread(worker);\nmain.start();\n```\n\n`worker`\
  \ 对象很可能实现了 `Runnable` 接口，可以作为线程运行。\n\n如果 `WorkerClass` 中的代码简短且简单，并且该类只需要使用一次，那么将其放入匿名内部类可能是值得的。下面是这样做的新版本：\n\
  \n点击此处查看代码图片\n\n```java\nThread main = new Thread(new Runnable()  {\n    public\
  \ void run() {\n        // thread's work to perform goes here\n    }\n\n});\nmain.start();\n\
  ```\n\n匿名内部类用以下代码替换了对 `worker` 的引用：\n\n点击此处查看代码图片\n\n```java\nnew Runnable()  {\n\
  \    public void run() {\n        // thread's work to perform goes here\n    }\n\
  \n}\n```\n\n这会创建一个匿名类，它实现了 `Runnable` 接口并覆盖了 `run()` 方法。方法内的语句将执行该类所需的任何工作。\n\n\
  通过一个关于如何编写匿名内部类及其用途的完整示例，这个概念将更容易理解。\n\n再次，您在早些时候创建的一个项目将通过使用内部类得到改进。\n\n在第 15 小时\
  \ \"响应用户输入\" 中，您创建了一个接受键盘输入的 Swing 应用程序。`KeyViewer` 应用程序使用一个实现了 `KeyListener` 接口的对象来监控键盘——也就是应用程序自己的类。\n\
  \n一个实现该接口的类必须实现三个方法：`keyTyped()`、`keyPressed()` 和 `keyReleased()`。下面是它们在该程序中的设计方式：\n\
  \n点击此处查看代码图片\n\n```java\npublic void keyTyped(KeyEvent input) {\n    char key =\
  \ input.getKeyChar();\n```\n\n\n\n\n\n## 键盘事件监听的演进\n\n`keyLabel.setText(\"You pressed\
  \ \" + key);`\n\n}\n\npublic void keyPressed(KeyEvent txt) {\n\n    // 不做任何操作\n\n\
  }\n\npublic void keyReleased(KeyEvent txt) {\n\n    // 不做任何操作\n\n}\n\n`keyListener`\
  \ 被设置为使用这个类来监视键盘事件：\n点击查看代码图片\n\n`keyText.addKeyListener(this);`\n\n使用`java.awt.event`包中的匿名内部类和`KeyAdapter`类，有一种更好的方式来创建监听器并将其添加到图形用户界面中。\n\
  \n`KeyAdapter`类以空操作方式实现了`KeyListener`接口的所有三个方法。它使得创建键盘事件监听器变得容易，因为你可以创建一个子类，只覆盖真正需要执行操作的方法。\n\
  \n以下是`KeyViewer`应用的一个关键监听器框架：\n点击查看代码图片\n\n```java\npublic class KeyViewerListener\
  \ extends KeyAdapter {\n\n    public void keyTyped(KeyEvent input) {\n\n       \
  \ // 待办\n\n    }\n\n}\n```\n\n这个监听器可以被创建并设置为监听器：\n点击查看代码图片\n\n```java\nKeyViewerListener\
  \ kvl = new KeyViewerListener();\n\nkeyText.addKeyListener(kvl);\n```\n\n这种方法需要一个单独的帮助类`KeyViewerListener`，以及一个该类的对象被创建并赋值给一个变量。\n\
  \n另一种方式是创建一个匿名内部类作为监听器：\n点击查看代码图片\n\n```java\nkeyText.addKeyListener(new KeyAdapter()\
  \ {\n\n    public void keyTyped(KeyEvent input) {\n\n        char key = input.getKeyChar();\n\
  \n        keyLabel.setText(\"You pressed \" + key);\n\n    }\n\n});\n```\n\n监听器是通过调用`new\
  \ KeyAdapter()`并跟随类的定义而匿名创建的。该类覆盖了`keyTyped()`方法，这样当按下键时，会通过调用`getKeyChar()`获取该键，并通过设置`keyLabel`的值来显示它，`keyLabel`是一个`JLabel`组件。\n\
  \n***\n\n**注意**\n\n在`java.awt.event`包中还有其他适配器类，可以方便地实现其他监听器。`MouseAdapter`类提供了三个鼠标监听器接口的空操作方法，`WindowAdapter`实现了三个窗口监听器，`FocusAdapter`实现了`FocusListener`。\n\
  \n***\n\n匿名内部类做了一件普通帮助类无法做到的事情：访问`keyLabel`实例变量。该变量属于`KeyViewer`类。内部类可以访问其外部类的方法和变量。\n\
