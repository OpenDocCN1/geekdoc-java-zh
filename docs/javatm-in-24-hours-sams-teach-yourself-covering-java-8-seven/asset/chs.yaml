  ### 停止线程\n\n```java\nwhile (runner == thisThread) {\n    current++;\n    if (current\
  \ > 5) {\n        current = 0;\n    }\n    siteLabel.setText(pageTitle[current]);\n\
  \    repaint();\n    try {\n        Thread.sleep(1000);\n    } catch (InterruptedException\
  \ exc) {\n        // 什么都不做\n    }\n}\n\npublic void actionPerformed(ActionEvent\
  \ event) {\n    Desktop desktop = Desktop.getDesktop();\n    if (pageLink[current]\
  \ != null) {\n        try {\n            desktop.browse(pageLink[current]);\n  \
  \          runner = null;\n            System.exit(0);\n        } catch (IOException\
  \ exc) {\n            // 什么都不做\n        }\n    }\n}\n\npublic static void main(String[]\
  \ arguments) {\n    new LinkRotator();\n}\n```\n\n* * *\n\n图 19.2 显示了计算机桌面上打开的两个窗口。较小的那个窗口（被圈出）是正在运行的\
  \ `LinkRotator` 应用程序。后面较大的那个窗口是该程序可以打开的其中一个链接：本书出版商 Sams 的网页。\n\n![图片](img/image00540.jpeg)\n\
  \n**图 19.2** 在应用程序中展示循环链接。\n\n`LinkRotator` 应用程序目前无法停止线程，但其设计方式使得实现这一点变得简单。以下是一个可以用来结束线程执行的方法：\n\
  \n```java\npublic void stop() {\n    if (runner != null) {\n        runner = null;\n\
  \    }\n}\n```\n\n`if` 语句检查 `runner` 对象是否等于 `null`。如果是，则没有需要停止的活动线程。否则，该语句将 `runner`\
  \ 设置为 `null`。\n\n将 `runner` 对象设置为 `null` 值会导致它的值与 `thisThread` 对象不同。当这种情况发生时，`run()`\
  \ 方法内部的 `while` 循环就会停止运行。\n\n## 总结\n\n线程是 Java 中用少量类和接口实现的一个强大概念。通过在你的程序中支持多线程，你可以使它们更具响应性，并能加快执行任务的速度。\n\
  \n即使你在这个小时里没学到其他东西，你现在也有一个新术语来描述你狂热的生活方式了。在几个句子中用用它，看看你是否喜欢：\n\n![图片](img/image00476.jpeg)\
  \ “天哪，昨天我们抢劫那几家连锁药店后，我真是‘多线程’运转了一天。”\n\n![图片](img/image00476.jpeg) “我午饭时一直在‘多线程’，结果搞得我胀气。”\n\
  \n![图片](img/image00476.jpeg) “今晚不行，亲爱的，我在‘多线程’呢。”\n\n## 实践环节\n\n### 问答\n\n**问.**\
  \ 有什么理由在 `catch` 语句中什么都不做吗，就像 `LinkRotator` 应用程序所做的那样？\n\n**答.** 这取决于所捕获的错误或异常类型。在\
  \ `LinkRotator` 应用程序中，你通过两个 `catch` 语句都知道异常的原因是什么，因此可以确信什么都不做总是合适的。在 `getURI()`\
  \ 方法中，只有当发送给该方法的 URI 无效时，才会引发 `URISyntaxException`。\n\n**问.** 那个唱过 “My Future’s\
  \ So Bright, I Gotta Wear Shades” 的乐队后来怎么样了？\n\n**答.** 他们的未来并不光明。Timbuk3 是一个由夫妻\
  \ Pat 和 Barbara K. MacDonald 组成的乐队，自从这首歌在 1986 年成为前 20 名单曲后，他们再也没有过热门歌曲。他们在 1986\
  \ 年至 1995 年间制作了六张专辑，之后乐队解散，两人也离婚了。\n\n帕特·麦克唐纳继续以自己的名字进行表演和发行专辑。他还为雪儿、彼得·弗兰普顿、夜曲巡逻队、史密斯飞船以及其他音乐家创作过歌曲。\n\
  \n芭芭拉·库伊曼以芭芭拉·K 的名字进行表演，并发行了多张专辑，其中一张重新演绎了 Timbuk3 的歌曲。她还成立了旨在捍卫艺术家言论自由的慈善机构“艺术家媒介多样性组织”。\n\
  \n他们最著名的歌曲被广泛理解为对未来传递积极信息，但其本意是讽刺性的。麦克唐纳夫妇曾表示，光明的未来实际上是一场即将到来的核浩劫。\n\n### 测验\n\n\
  放下你的线程（Java 意义上的，而非“裸露”意义上的），回答以下关于 Java 多线程的问题。\n\n**1.** 程序要使用线程，必须实现哪个接口？\n\n\
  **A.** `Runnable`\n\n**B.** `Thread`\n\n**C.** 不需要任何接口\n\n**2.** 如果一个接口包含三个不同的方法，那么实现该接口的类必须包含其中多少个方法？\n\
  \n**A.** 一个都不用。\n\n**B.** 全部都要包含。\n\n**C.** 我知道，但我不说。\n\n**3.** 你正在欣赏另一位程序员的作品，他创建了一个可以同时处理四个任务的程序。你应该对他说什么？\n\
  \n**A.** “我愿意花一块钱买那个。”\n\n**B.** “你是我羽翼下的风。”\n\n**C.** “线程真不错！”\n\n### 答案\n\n**1.\
  \ A.** `Runnable` 必须与 `implements` 语句一起使用。`Thread` 在多线程程序中使用，但在开始程序的 `class` 语句中并不需要。\n\
  \n**2. B.** 接口是一种保证，即该类包含了接口的所有方法。\n\n**3. C.** 如果这位程序员衣冠楚楚，这个恭维可能会让人困惑，但老实说，这种可能性有多大呢？\n\
