    *   Code completion supports camel case patterns. Entering NPE and clicking **Ctrl
    + Space** will propose **NullPointerException** and **NoPermissionException**.


    TIP #5 − CREATING GETTERS AND SETTERS


    *   Click on Source → Generate Getter and Setter to open the wizard that allows
    you to generate getter and setter methods.


    TIP #6 − GENERATING HASHCODE() AND EQUALS() METHODS


    *   Click on Source → Generate hashCode() and equals() to generate this methods
    for a Java class.'
