  raw: '| 1 | FileThe File menu allows you to open files for editing, close editors,
    save editor content and rename files. Among the other things, it also allows you
    to import and export workspace content and shutdown Eclipse. |


    | 2 | EditThe Edit menu presents items like copy & paste. |


    | 3 | SourceThe Source menu is visible only when a java editor is open. It presents
    a number of useful menu items related to editing java source code. |


    | 4 | NavigateThe Navigate menu allows you to quickly locate resources and navigate
    to them. |


    | 5 | SearchThe Search menu presents items that allow you to search the workspace
    for files that contain specific data. |


    | 6 | ProjectThe menu items related to building a project can be found on the
    Project menu. |


    | 7 | RunThe menu items on the Run menu allow you to start a program in the run
    mode or debug mode. It also presents menu items that allow you to debug the code.
    |


    | 8 | WindowThe Window menu allows you to open and close views and perspectives.
    It also allows you to bring up the Preferences dialog. |


    | 9 | HelpThe Help menu can be used to bring up the Help window, Eclipse Marketplace
    view or Install new plug-ins. The about Eclipse menu item gives you version information.
    |


    ## Customizing Menus


    The visible menu items on a menu depend on the installed plug-ins and customization
    done using the **Customize Perspective** dialog box.


    # Explore Views


    ## About Views


    Eclipse views allow users to see a graphical representation of project metadata.
    For example the project navigator view presents a graphical representation of
    the folders and files associated with a project and properties view presents a
    graphical representation of an element selected in another view or editor.


    An eclipse perspective can show any number of views and editors. All editor instances
    appear in a single editor area, whereas views are placed inside view folders.
    A workbench window can display any number of view folders. Each view folder can
    display one or more views.


    ## Organizing Views


    The following picture shows four views arranged in a view folder.


    ![Image](Images/image00050.jpeg)


    The picture given below shows the same four views arranged in two view folders.


    ![Image](Images/image00051.jpeg)


    ## Moving Views


    To move a view from one view folder to another, just click on the view title and
    drag to the title bar area of another view folder. The green line shown below
    is a result of dragging the title bar of the Properties view from one view folder
    to the title bar area of another view folder. The Properties view can be moved
    to where the green line is by releasing the mouse button and sending out a drop
    event.


    ![Image](Images/image00052.jpeg)


    ## Creating View Folders


    View folders can be dynamically created by dragging the title bar of a view to
    anywhere outside the editor area and title bar of another view folder. As you
    drag the title bar around, green lines will indicate where exactly the new view
    folder will be created.


    ![Image](Images/image00053.jpeg)


    Moving the drag icon to the bottom of a window allows you to create a view folder
    that spans the entire width of the window. Moving the drag icon to the left or
    right edge of window allows you to create a view folder that spans the entire
    height of the window.


    ## Opening a view


    To open a view, click on the **Window** menu and select the **Show View** menu
    item.


    ![Image](Images/image00054.jpeg)


    Clicking on the **Other** menu item brings up the Show View dialog box that allows
    you to locate and activate a view.


    ![Image](Images/image00055.jpeg)


    The views are organized by category. To quickly locate a view just type the name
    of a view into the filter text box. To open a view, select it and click on the
    OK button. The subsequent pages of this tutorial introduce you to a number of
    useful views.


    # Perspectives


    ## What is a Perspective?


    An eclipse perspective is the name given to an initial collection and arrangement
    of views and an editor area. The default perspective is called java. An eclipse
    window can have multiple perspectives open in it but only one perspective is active
    at any point of time. A user can switch between open perspectives or open a new
    perspective. The active perspective controls what appears in some menus and tool
    bars.


    ## Opening a Perspective


    To open a new perspective, click on the Windows menu and select Open Perspective
    → Other


    ![Image](Images/image00056.jpeg)


    The Open Perspective dialog box shows all the available perspectives. The same
    dialog can be brought up by clicking on the Open Perspective button (![Image](Images/image00057.jpeg) )
    on the tool bar.


    ## Switching between Perspectives


    The most commonly used perspectives for java development are the Java perspective
    and Debug perspective. Users can switch between open perspectives by clicking
    on the Perspective name on the toolbar.


    ![Image](Images/image00058.jpeg)


    ## Closing a Perspective


    To close a perspective, right click on the perspective name in toolbar and select
    the Close menu item.


    ![Image](Images/image00059.jpeg)


    ## Customizing a Perspective


    The customize perspective dialog can be used to customize a perspective. Customizing
    a perspective means −


    *   Determining the icons visible on the toolbar when a perspective is active.


    *   Determining the menu items visible when a perspective is active.


    *   Determine the menu items in New submenu, Show View submenu and Open Perspective
    submenu.


    ![Image](Images/image00060.jpeg)


    The tab descriptions of customize perspective are given below −


    *   The **Tool Bar Visibility** tab can be used to determine which icons are visible
    on the toolbar when a perspective is open.


    *   The **Menu Visibility** tab can be used to determine which menu items are
    visible when a perspective is active.


    *   The **Command Groups Availability** tab can be used to control the visibility
    of toolbar icons and menu items.


    *   The **Shortcuts** tab can be used to determine the menu items in New submenu,
    Show View submenu and Open Perspective submenu.


    Based on the Shortcuts selection in the picture given below, to bring up the "New
    Java Project from Existing Ant Build File" wizard users have to bring up the New
    submenu (File → New), click on Other, expand the Java category and then select
    "Java Project from Existing Ant Build File". On the other hand, to start the New
    Class wizard they can bring up the New submenu (File → New) and select the Class
    menu item because its selected in the picture given below. By selecting the "Java
    Project from Existing Ant Build File" check box this item will also appear under
    the New menu.


    ![Image](Images/image00061.jpeg)


    # Workspaces


    ## About Eclipse Workspace


    The eclipse workspace contains resources such as −


    *   Projects


    *   Files


    *   Folders


    The workspace has a hierarchical structure. Projects are at the top level of the
    hierarchy and inside them you can have files and folders. Plug-ins use an API
    provided by the resources plug-in to manage the resources in the workspace.


    ## UI Elements for Managing the Workspace


    Users use the functionality provided by views, editors and wizard to create and
    manage resources in the workspace. One among the many views that show the content
    of the workspace is the Project Explorer view.


    ![Image](Images/image00062.jpeg)


    The File Wizard (File → New → File) can be used to create a new file.


    ![Image](Images/image00063.jpeg)


    The Folder Wizard (File → New → Folder) can be used to create a new folder.


    ![Image](Images/image00064.jpeg)


    # Create Java Project


    ## Opening the New Java Project wizard


    The New Java Project wizard can be used to create a new java project. There are
    many ways to open this wizard −


    *   By clicking on the File menu and choosing New →Java Project.


    *   By right clicking anywhere in the Project Explorer and selecting New → Java
    Project.


    *   By clicking on the New button (![Image](Images/image00065.jpeg) ) in the Tool
    bar and selecting Java Project.'
