    # 概述


    ## 什么是 Eclipse？


    在计算领域，Eclipse 是一个集成开发环境（IDE），用于使用 Java 编程语言以及 C/C++、Python、PERL、Ruby 等其他语言开发应用程序。


    Eclipse 平台为 Eclipse IDE 提供了基础，由插件组成，并设计为可以使用额外的插件进行扩展。Eclipse 平台使用 Java 开发，可用于开发富客户端、集成开发环境和其他工具。只要有相应的插件，Eclipse
    就可以作为任何编程语言的 IDE 使用。


    Java 开发工具（`JDT`）项目提供了一个允许 Eclipse 用作 Java IDE 的插件；PyDev 是允许 Eclipse 用作 Python
    IDE 的插件；C/C++ 开发工具（`CDT`）是一个允许 Eclipse 用于使用 C/C++ 开发应用程序的插件；Eclipse Scala 插件允许
    Eclipse 作为开发 Scala 应用的 IDE；而 PHPeclipse 是一个为 PHP 提供完整开发工具的插件。


    ## 许可


    Eclipse 平台及其他插件是 Eclipse。


    ## Eclipse 版本


