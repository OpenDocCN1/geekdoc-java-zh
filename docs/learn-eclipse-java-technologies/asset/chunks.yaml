    The Commons tab provides common options such as the ability to allocate a console
    for standard input and output.


    ![Image](Images/image00087.jpeg)


    To save the run configuration click on the Apply button and to launch the application
    click on the Run button.


    # Running Program


    ## Running a Java Program


    The quickest way to run a Java program is by using the Package Explorer view.


    In the Package Explorer view −:

    * Right click on the java class that contains the main method.

    * Select `Run As` → `Java Application`.


    The same action can be performed using the Package Explorer view by selecting
    the class that contains the main method and clicking `Alt + Shift + X, J`.


    Either actions mentioned above create a new `Run Configuration` and use it to
    start the Java application.


    If a `Run` configuration has already been created you can use it to start the
    Java application by selecting `Run Configurations` from the `Run` menu, clicking
    on the name of the run configuration and then clicking on the `Run` button.


    ![Image](Images/image00088.jpeg)


    The `Run` item on the `Run` menu can be used to restart the java application that
    was previously started.


    ![Image](Images/image00089.jpeg)


    The shortcut key to launch the previously launched Java application is `Ctrl +
    F11`.


    # Create Jar Files


    ## Opening the Jar File wizard


    The Jar File wizard can be used to export the content of a project into a jar
    file. To bring up the Jar File wizard −:

    * In the Package Explorer select the items that you want to export. If you want
    to export all the classes and resources in the project just select the project.

    * Click on the `File` menu and select `Export`.

    * In the filter text box of the first page of the export wizard type in `JAR`.


    ![Image](Images/image00090.jpeg)

    * Under the Java category select `JAR` file.

    * Click on `Next`.


    ## Using the Jar File wizard


    In the JAR File Specification page −:

    * Enter the JAR file name and folder.

    * The default is to export only the classes. To export the source code also, click
    on the `Export Java source files and resources` check box.


    ![Image](Images/image00091.jpeg)

    * Click on `Next` to change the JAR packaging options.

    * Click on `Next` to change the JAR Manifest specification.

    * Click on `Finish`.


    # Close Project


    ## Why Close a Project?


    An eclipse workspace can contain any number of projects. A project can be either
    in the open state or closed state.


    Open projects −:

    * Consume memory.

    * Take up build time especially when the `Clean All Projects` (`Project → Clean
    all projects`) with the `Start a build immediately` option is used.


    ![Image](Images/image00092.jpeg)


    ## How to Close a Project?


    If a project is not under active development it can be closed. To close a project,
    from the `Project` select the `Close Project` menu item.


    ![Image](Images/image00093.jpeg)


    ## Closed Project in Package Explorer


    A closed project is visible in the Package Explorer view but its contents cannot
    be edited using the Eclipse user interface. Also, an open project cannot have
    dependency on a closed project. The Package Explorer view uses a different icon
    to represent a closed project.


    ![Image](Images/image00094.jpeg)


    # Reopen Project


    ## Reopening a Closed Project


    To reopen a closed project, in the Package Explorer view, select the closed project
    and click on the `Project` menu and select `Open Project`.


    ![Image](Images/image00095.jpeg)


    Once the project is open its content can be edited using the Eclipse user interface.


    # Build Project


    ## Building a Java Project


    A project can have zero or more builders associated with it. A java project is
    associated with a java builder. To see the builders associated with a project
    −:

    * In the Package Explorer view right click on the project and select `Properties`.

    * In the left hand side tree click `Builders`.


    ![Image](Images/image00096.jpeg)


    It''s the java builder that distinguishes a Java project from other types of projects.
    By click on the `New` button you can associate the `Ant` builder with a java project.
    The java builder is responsible for compiling the java source code and generating
    classes.


    The java builder is notified of changes to the resources in a workspace and can
    automatically compile java code. To disable automatic compilation deselect the
    `Build Automatically` option from the `Project` menu.


    ![Image](Images/image00097.jpeg)


    If automatic compilation is disabled then you can explicitly build a project by
    selecting the `Build Project` menu item on the `Project` menu. The `Build Project`
    menu item is disabled if the `Build Automatically` menu item is selected.


    # Debug Configuration


    ## Creating and Using a Debug Configuration


    An eclipse debug configuration is similar to a run configuration but it used to
    start an application in the debug mode. Because the application is started in
    the debug mode the users are prompted to switch to the debug perspective. The
    debug perspective offers a number of views that are suitable for debugging applications.


    The Debug Configuration dialog can be invoked by selecting the `Debug Configurations`
    menu item from the `Run` menu.


    ![Image](Images/image00098.jpeg)


    To create a debug configuration for a Java application, select `Java Application`
    from the list on the left hand side and click on the `New` button. In the dialog
    box that comes up in the main tab specify −:

    * A name for the debug configuration.

    * The name of `Project`.

    * The name of main class.


    In the arguments tab, specify −:

    * Zero or more program arguments.

    * Zero or more Virtual Machine arguments.


    ![Image](Images/image00099.jpeg)


    To save the run configuration, click on the Apply button and to launch the application
    in the debug mode click on the Debug button.


    # Debugging Program


    ## Debugging a Java Program


    The quickest way to debug a Java program is to the Package Explorer view. In the
    Package Explorer view −:

    * Right click on the java class that contains the main method.

    * Select `Debug As` → `Java Application`.


    The same action can be performed using the Package Explorer by selecting the class
    that contains the main method and clicking `Alt + Shift + D, J`.


    Either actions mentioned above create a new `Debug Configuration` and use it to
    start the Java application.


    If a `Debug` configuration has already been created you can use it to start the
    Java application by selecting `Debug Configurations` from the `Run` menu, clicking
    on the name of the debug configuration and then clicking on the `Debug` button.


    ![Image](Images/image00100.jpeg)


    The `Debug` item on the `Run` menu can be used to restart the java application
    that was previously started in the debug mode.


    ![Image](Images/image00101.jpeg)


    The shortcut key to launch the previously launched Java application in the debug
    mode is `F11`. When a java program is started in the debug mode, users are prompted
    to switch to the debug perspective. The debug perspective offers additional views
    that can be used to troubleshoot an application.


    The java editor allows users to place break points in the java code. To set a
    break point, in the editor area right click on the marker bar and select `Toggle
    Breakpoint`.


    ![Image](Images/image00102.jpeg)


    Breakpoints are shown on the marker bar. They are also visible in the `Breakpoints`
    View.


    When the execution of code reaches a break point the JVM suspends the execution
    of the program. At this point, you can inspect the memory and execute the program
    in a controlled manner.


    When the execution of a program is paused, the `debug` view can be used to inspect
    the call stack.


    ![Image](Images/image00103.jpeg)


    The `variables` view can be used to inspect the value of variables.


    ![Image](Images/image00104.jpeg)


    The `run` menu has menu items that allow you to Resume execution, step over a
    line of code, step into a function etc.


    ![Image](Images/image00105.jpeg)


    The picture given above shows the shortcut keys associated with actions such as
    Resume, Step Into and Step Over, etc.

