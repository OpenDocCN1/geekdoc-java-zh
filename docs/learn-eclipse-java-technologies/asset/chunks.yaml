    # Preferences


    ## Setting Preferences


    The Preferences dialog allows Eclipse users to manage their preferences. This
    dialog box is managed by the framework but any plug-in can add multiple pages
    to the dialog box.


    To invoke this dialog, click on the `Window` menu and select the `Preferences`
    menu item.


    The preference pages are organized by category. You can locate a preference page
    by expanding the nodes of the tree in the left hand side of the dialog box.


    ![Image](Images/image00106.jpeg)


    The filter text box on the left hand side top corner allows you to quickly locate
    a preference page. As you type characters into the filter text box the items shown
    in the left hand side tree are filtered. For e.g. type in `font` to quickly get
    to the `Font` preferences page.


    ![Image](Images/image00107.jpeg)


    After you make changes to the appropriate preferences click on the `OK` button
    to save the changes and close the dialog box or click on the `Cancel` button to
    discard the changes and close the dialog box.


    # Content Assist


    ## Using Content Assist


    Within an editor, content assist helps reduce the characters typed by providing
    a context sensitive list of possible completions to the characters already typed.
    The context assist can be invoked by clicking `Ctrl` + `Space`.


    If you are editing the body of a method in the java editor and press `Ctrl` +
    `Space` on a new line it will bring up a dialog showing −


    *   The class variables

    *   The class methods

    *   Super class methods

    *   Other relevant classes


    ![Image](Images/image00108.jpeg)


    To select an item from the list just highlight the item using the up or down arrow
    keys and press enter.


    If you type some characters and then press `Ctrl` + `space` the dialog box will
    show only items that start with the characters typed in.


    ![Image](Images/image00109.jpeg)


    # Quick Fix


    ## Using Quix Fix


    As you type characters into an eclipse editor it analyzes the document content
    for potential error and warnings. The java editor uses the java syntax to detect
    errors in the code. When it finds error or warning, it −


    *   Highlights errors using red squiggly lines.

    *   Highlights warnings using yellow squiggly lines.

    *   Displays errors and warnings in the Problem view.

    *   Adds a light bulb with a warning sign or error sign to the vertical ruler.


    The quick fix dialog provides a list of possible corrections. The quick fix dialog
    can be invoked by −


    *   Placing the mouse pointer on a squiggly line.

    *   Clicking on the light bulb.

    *   Placing the cursor in the highlighted text and selecting Quick fix from the
    Edit menu or clicking shortcut `Ctrl` + `1`.


    ![Image](Images/image00110.jpeg)


    In the above diagram, `getId` is highlighted because the `Person` class does not
    have a method called `getId()`. Selecting `Create method ''getId()'' in type ''Person''`
    would cause the `getId()` method to be added to the `Person` class.


    The Quick Fix dialog can also be displayed by right clicking on the error item
    in the Problems view and selecting the `Quick Fix` menu item.


    # Hover Help


    ## Using Hover Help


    The java editor is associated with different type of hovers. A hover provides
    additional information about the element under the mouse pointer. All the hovers
    associated with a java editor can be seen in the Java editor Hovers preference
    page.


    ![Image](Images/image00111.jpeg)


    In the java editor, placing the mouse pointer over the class being imported displays
    the java doc associated with that class.


    ![Image](Images/image00112.jpeg)


    Placing a mouse pointer on a method shows the java documentation for that method.


    ![Image](Images/image00113.jpeg)


    # Search Menu


    ## Searching the Workspace


    The Eclipse search dialog box allows you to search for files that contain a literal
    or a character pattern in the entire workspace, a set of projects, a specific
    project or folders selects in the package explorer view.


    The search dialog box can be invoked by −


    *   Clicking on the `Search` menu and selecting `Search` or `File` or `Java`.

    *   Clicking `Ctrl` + `H`.


    ![Image](Images/image00114.jpeg)


    The File Search page allows you to search any type of file but the Java Search
    page focuses on Java files only.


    ![Image](Images/image00115.jpeg)


    For example, to search for usage of the `Person` type, in the Java Search page
    −


    *   Enter `Person` into the `search box`.

    *   Set the `Search For` radio button to `Type`.

    *   Set the `Limit To` radio button to `References`.

    *   Click `Search`.


    The search result appears in the Search View.


    ![Image](Images/image00116.jpeg)


    # Navigation


    ## Navigating the Eclipse Workspace


    The navigate menu provides a number of menu items that allow you to quickly locate
    and navigate to a resource.


    ![Image](Images/image00117.jpeg)


    Among them, the `Open Type`, `Open Type in Hierarchy` and `Open Resource` menu
    items tend to be very useful.


    ## Open Type


    The Open Type menu item brings up a dialog box that allows you to locate a Java
    type. In the filter text box enter in either the fully qualified name or name
    of a class. The `*` character which stands for 0 or more characters and `?` which
    stands for a single character can be used to specify patterns. The dialog box
    will show all the names that match the given pattern.


    ![Image](Images/image00118.jpeg)


    Select the type you are interested in and click `OK`.


    Eclipse will open up an editor showing the selected type. If source code is not
    available for the type it will use the Class File editor to show the byte code.


    ![Image](Images/image00119.jpeg)


    You can use the Attach Source button to specify where the source code is located.


    The source code for the types that comes with the distribution is in `src.zip`
    which is located in java home folder.


    ## Open Type in Hierarchy


    The Open Type in Hierarchy menu items allows to open a type in the Hierarchy view.
    The Open Type in Hierarchy dialog box can be used to locate any type in the build
    path.


    ![Image](Images/image00120.jpeg)


    Once you select a type, its hierachy is shown in the Type Hierarchy view.


    ![Image](Images/image00121.jpeg)


    The Type Hierarchy is an excellent view for learning about a type. On the left
    hand side pane type, its super type and sub type are available. On the right hand
    side pane you can see the attributes and methods of selected type.


    ## Open Resource


    The open resource menu item can be used to locate a file in the workspace. The
    `*` character which stands for 0 or more characters and `?` which stands for a
    single character can be used to specify patterns. The dialog box will show all
    the names that match the given pattern.


    ![Image](Images/image00122.jpeg)


    Select the file that you want to open in an editor and click the OK button.


    # Refactoring


    ## Refactoring using Eclipse


    Renaming a class that is used widely throughout a project could take a lot of
    time but the Eclipse refactoring wizard makes the job easier by automatically
    detecting all dependencies on the class being renamed and modifying them also.


    The refactor menu can be opened by −


    *   Right clicking on a Java element in the Package Explorer view and selecting
    Refactor menu item.

    *   Right clicking on a Java element in the Java editor and selecting Refactor
    menu item.

    *   Selecting a Java element in either the Package Explorer view or Java Editor
    and clicking `Shift` + `Alt` + `T`.


    ![Image](Images/image00123.jpeg)


    The refactor menu shows all the possible changes that are supported on the selected
    Java element. To rename a class, select the Rename menu item.


    ![Image](Images/image00124.jpeg)


    Click on the Next button to see a preview of the changes (if available). Then
    click on Finish to get the wizard to do its work.

    '
