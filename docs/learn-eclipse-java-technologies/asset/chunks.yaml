  trans: '


    ## 菜单


    - **文件 (File)**：`File` 菜单允许你打开文件进行编辑、关闭编辑器、保存编辑器内容以及重命名文件。除其他功能外，它还允许你导入导出工作空间内容并关闭
    Eclipse。

    - **编辑 (Edit)**：`Edit` 菜单提供了复制和粘贴等项。

    - **源 (Source)**：`Source` 菜单仅在打开 Java 编辑器时才可见。它提供了许多与编辑 Java 源代码相关的有用菜单项。

    - **导航 (Navigate)**：`Navigate` 菜单允许你快速定位资源并导航到它们。

    - **搜索 (Search)**：`Search` 菜单提供的项可以在工作空间中搜索包含特定数据的文件。

    - **项目 (Project)**：与构建项目相关的菜单项可以在 `Project` 菜单中找到。

    - **运行 (Run)**：`Run` 菜单上的项允许你以运行模式或调试模式启动程序。它还提供了允许你调试代码的菜单项。

    - **窗口 (Window)**：`Window` 菜单允许你打开和关闭视图和视角。它还允许你调出 `Preferences`（首选项）对话框。

    - **帮助 (Help)**：`Help` 菜单可用于调出 `Help`（帮助）窗口、`Eclipse Marketplace` 或安装新插件。`about
    Eclipse` 菜单项提供版本信息。


    ## 自定义菜单


    菜单上可见的菜单项取决于已安装的插件以及使用 `Customize Perspective`（自定义视角）对话框进行的自定义。


    # 探索视图


    ### 关于视图


    Eclipse 视图（views）允许用户查看项目元数据的图形化表示。例如，项目导航视图（project navigator）显示与项目相关的文件夹和文件的图形化表示，而属性视图（properties
    view）显示另一个视图或编辑器中选中元素的图形化表示。


    一个 Eclipse 视角可以显示任意数量的视图和编辑器。所有的编辑器实例出现在单个编辑器区域，而视图被放置在视图文件夹中。工作窗口可以显示任意数量的视图文件夹。每个视图文件夹可以显示一个或多个视图。


    ### 组织视图


    下面的图片显示了视图文件夹中的四个视图。


    ![Image](img/image00050.jpeg)


    下方提供的图片显示了排列在两个视图文件夹中的相同四个视图。


    ![Image](img/image00051.jpeg)


    ### 移动视图


    要将视图从一个视图文件夹移动到另一个，只需点击视图标题并将其拖动到另一个视图文件夹的标题栏区域。下方显示的绿线是将 `Properties` 视图的标题栏从一个视图文件夹拖到另一个视图文件夹的标题栏区域的结果。通过释放鼠标按钮并发送丢落事件，可以将
    `Properties` 视图移动到绿线所在的位置。


    ![Image](img/image00052.jpeg)


    ### 创建视图文件夹


    可以通过将视图的标题栏拖到编辑器区域以外的任何地方或其他视图文件夹的标题栏来动态创建视图文件夹。当你拖动标题栏时，绿线将指示新视图文件夹将创建的确切位置。


    ![Image](img/image00053.jpeg)


    将拖动图标移动到窗口底部可以创建一个跨越整个窗口宽度的视图文件夹。将拖动图标移动到窗口的左边缘或右边缘可以创建一个跨越整个窗口高度的视图文件夹。


    ### 打开视图


    要打开视图，点击 `Window` 菜单并选择 `Show View`（显示视图）菜单项。


    ![Image](img/image00054.jpeg)


    点击 `Other`菜单项会调出 `Show View` 对话框，允许你定位并激活视图。


    ![Image](img/image00055.jpeg)


    视图按类别组织。要快速定位视图，只需在过滤器文本框中输入视图名称。要打开视图，请选择它并点击 `OK` 按钮。本教程的后续页面将向你介绍许多实用的视图。


    # 视角 (Perspectives)


    ### 什么是视角？


    Eclipse 视角（perspective）是对视图和编辑器区域初始集合和排列的命名。默认视角称为 `java`。一个 Eclipse 窗口可以打开多个视角，但在任何时刻只有一个视角是激活状态。用户可以在已打开的视角之间切换，或者打开一个新的视角。激活的视角控制某些菜单和工具栏中显示的内容。


    ### 打开视角


    要打开新视角，点击 `Windows` 菜单并选择 `Open Perspective`（打开视角）→ `Other`。


    ![Image](img/image00056.jpeg)


    `Open Perspective` 对话框显示所有可用的视角。也可以点击工具栏上的 `Open Perspective` 按钮（![Image](img/image00057.jpeg)
    ）来调出相同的对话框。


    ### 切换视角


    Java 开发中最常用的视角是 `Java` 视角和 `Debug` 视角。用户可以通过点击工具栏上的 `Perspective` 名称在已打开的视角之间切换。


    ![Image](img/image00058.jpeg)


    ### 关闭视角


    要关闭视角，右键点击工具栏上的视角名称并选择 `Close`（关闭）菜单项。


    ![Image](img/image00059.jpeg)


    ### 自定义视角


    可以使用 `customize perspective`（自定义视角）对话框来自定义视角。自定义视角意味着：


    - 确定在视角激活时在工具栏上可见的图标。

    - 确定在视角激活时可见的菜单项。

    - 确定 `New` 子菜单、`Show View` 子菜单和 `Open Perspective` 子菜单中的菜单项。


    ![Image](img/image00060.jpeg)


    `customize perspective` 的选项卡描述如下：


    - `Tool Bar Visibility` 选项卡用于在视角激活时在工具栏上显示哪些图标。

    - `Menu Visibility` 选项卡用于在视角激活时显示哪些菜单项。

    - `Command Groups Availability` 选项卡用于控制工具图标和菜单项的可见性。

    - `Shortcuts` 选项卡用于确定 `New` 子菜单、`Show View` 子菜单和 `Open Perspective` 子菜单中的项。


    根据下方图片的 `Shortcuts` 选择，要调出 `New Project from Ant File` 对话框，用户必须调出 `New` 菜单，点击
    `Other`，展开 `Java` 类别然后选择 `Java Project from Ant File`。另一方面，要启动 `New Class` 对话框，他们可以调出
    `New` 菜单并选择 `Class` 项（如下所示）。通过勾选 `Java Project from Ant File` 复选框，该项也会出现在 `New`
    菜单下。


    ![Image](img/image00061.jpeg)


    # 工作空间 (Workspaces)


    ### 关于工作空间


    Eclipse 工作空间包含以下资源：


    字体 项目

    - 文件

    - 文件夹


    工作空间具有分级结构。项目位于顶层，内部包含文件和文件夹。插件使用 `resources` 插件提供的 API 来管理工作空间中的资源。


    ### 管理工作空间的 UI 元素


    用户使用视图、编辑器和向导提供的功能在工作空间中创建和管理资源。显示工作内容的视图之一是 `Project Explorer` 视图。


    ![Image](img/image00062.jpeg)


    `File` 向导（`File` → `New` → `File`）用于创建新文件。


    ![Image](img/image00063.jpeg)


    `Folder` 向导（`File` → `New` → `Folder`）用于创建新文件夹。


    ![Image](img/image00064.jpeg)


    # 创建 Java 项目


    ### 打开 New Java Project 向导


    `New Java Project` 向导可用于创建新的 Java 项目。有许多方法可以打开此向导：


    - 点击 `File` 菜单并选择 `New` → `Java Project`。

    - 在 `Project Explorer` 任意位置右键点击并选择 `New` → `Java Project`。

    - 点击工具栏上的 `New` 按钮（![Image](img/image00065.jpeg) ）并选择 `Java Project`。


    '
- fmt: '

    ## Using the New Java Project wizard


    The New Java Project Wizard has two pages. On the first page −


    * Enter the Project Name

    * Select the Java Runtime Environment (`JRE`) or leave it at the default

    * Select the Project Layout which determines whether there would be a separate
    folder for the source codes and class files. The recommended option is to create
    separate folders for sources and class files.


    ![Image](Images/image00066.jpeg)


    You can click on the `Finish` button to create the project or click on the `Next`
    button to change the java build settings.


    On the second page you can change the `Java Build Settings` like setting the Project
    dependency (if there are multiple projects) and adding additional jar files to
    the build path.


    ### Viewing the Newly Created Project


    The package explorer shows the newly created Java project. The icon that represents
    a Project is decorated with a `J` to show that it is a Java Project. The folder
    icon is decorated to show that it is a java source folder.


    ![Image](Images/image00067.jpeg)


    # Create Java Package


    ### Opening the New Java Package wizard


    You can use the New Java Package wizard to create a Java package. The Java Package
    wizard can be opened in different ways −


    * By clicking on the `File` menu and selecting `New` → `Package`.

    * By right click in the package explorer and selecting `New` → `Package`.

    * By clicking on the package icon which is in the tool bar(![Image](Images/image00068.jpeg)
    ).


    If you are creating a sub package, before opening the Java Package wizard select
    the parent package so that name field can have a default value in it.


    ### Using the New Java Package Wizard


    Once the Java Package wizard comes up −


    * Enter/confirm the source folder name.

    * Enter the package name.

    * Click on the `Finish` button.


    ![Image](Images/image00069.jpeg)


    ### Viewing the Newly Created Package


    The package explorer will show the newly created package under the source folder.


    ![Image](Images/image00070.jpeg)


    # Create Java Class


    ### Opening the New Java Class Wizard


    You can use the New Java Class wizard to create a Java class. The Java Class wizard
    can be invoked in different ways −


    * By clicking on the `File` menu and selecting `New` → `Class`.

    * By right clicking in the package explorer and selecting `New` → `Class`.

    * By clicking on the class drop down button (![Image](Images/image00071.jpeg)
    ) and selecting class ( ![Image](Images/image00072.jpeg)).


    Before bringing up the New Java Class wizard, if possible, select the package
    in which the class is to be created so that the wizard can automatically fill
    in the package name for you.


    ### Using the New Java Class Wizard


    Once the java class wizard comes up −


    * Ensure the source folder and package are correct.

    * Enter the class name.

    * Select the appropriate class modifier.

    * Enter the super class name or click on the `Browse` button to search for an
    existing class.

    * Click on the `Add` button to select the interfaces implemented by this class.

    * Examine and modify the check boxes related to method stubs and comments.


    ![Image](Images/image00073.jpeg)


    * Click on the `Finish` button.


    ### Viewing the Newly Created Java class


    The newly created class should appear in the Package Explorer view and a java
    editor instance that allows you to modify the new class. It should appear in the
    editor area.


    ![Image](Images/image00074.jpeg)


    # Create Java Interface


    ### Opening the New Java Interface Wizard


    The New Java Interface wizard can be used to create a new java interface. There
    are many ways of opening this wizard −


    * Clicking on the `File` menu and selecting `New` → `Interface`.

    * Right clicking in the package explorer and selecting `New` > `Interface`.

    * Clicking on the class drop down button (![Image](Images/image00075.jpeg)) in
    the tool bar and selecting Interface (![Image](Images/image00076.jpeg)).


    Before bringing up the New Java Interface wizard, if possible, select the package
    in which the interface is to be created so that the wizard can automatically fill
    in the package name for you.


    ### Using the New Java Interface Wizard


    Once the java interface wizard comes up −


    * Ensure the source folder and package are correct.

    * Enter the interface name.

    * Click on the `Add` button to select the extended interfaces.

    * Select the `Generate comments` check box if you like comments to be generated.

    * Click on the `Finish` button.


    ![Image](Images/image00077.jpeg)


    ### Viewing the Newly Created Java Interface


    The newly created interface should appear in the Package Explorer view and a java
    editor instance that allows you to modify the new interface should appear in the
    editor area.


    ![Image](Images/image00078.jpeg)


    # Create XML File


    ### Opening the New XML File wizard


    You can use the New XML file wizard to create an XML file. To invoke this wizard
    −


    * Click on the `File` menu and select `New` → `Other` or

    * Click on the new drop down box (![Image](Images/image00079.jpeg)) select other
    or

    * Press `ctrl` + `N`


    Once the Select a wizard dialog box comes up −


    * In the filter text box enter `xml`, this should show only the wizards related
    to xml.

    * Expand XML category and select `XML File`.


    ![Image](Images/image00080.jpeg)


    * Click on `Next` to bring up the New XML File.


    #### Note


    If the XML perspective is open the New XML wizard can be invoked by −


    * Clicking on the `File` menu and selecting `New` → `XML File`.

    * Clicking on the `XML File` button (![Image](Images/image00081.jpeg) ) on the
    tool bar.


    ### Using the New XML Wizard


    Once the XML File wizard comes up −


    * Enter or select the parent folder.

    * Enter the name of the xml file.


    ![Image](Images/image00082.jpeg)


    * Click on `Next` to base the xml file on DTD, XML Schema else click on `Finish`.


    ### Viewing the Newly Created XML File


    The newly created XML file should appear in the Package Explorer view and an java
    editor instance that allows you to modify the newly created file should appear
    in the editor area.


    ![Image](Images/image00083.jpeg)


    The XML editor allows you to edit an XML file using either the Design view or
    Source view.


    # Java Build Path


    ### Setting the Java Build Path


    The Java build path is used while compiling a Java project to discover dependent
    classes. It is made up of the following items:


    * Code in the source folders.

    * Jars and classes folder associated with the project.

    * Classes and libraries exported by projects referenced by this project.


    The java build path can be seen and modified by using the Java Build Path page
    of the Java Project properties dialog. To bring up the Java Project properties
    dialog, right click on a Java Project in the Package Explorer view and select
    the `Properties` menu item. On the left side tree select `Java Build Path`.


    ![Image](Images/image00084.jpeg)


    A common requirement seen while developing java applications is to add existing
    jars to the java build path. This can be accomplished using the Libraries tab.
    In the Libraries tab, click on `Add JARs` if the jar is already in the Eclipse
    workspace or click on `Add External JARs` if the jar is elsewhere in the file
    system.


    # Run Configuration


    ### Creating and Using a Run Configuration


    The Run Configurations dialog allows create multiple run configurations. Each
    run configuration can start an application. The Run Configuration dialog can be
    invoked by selecting the Run Configurations menu item from the Run menu.


    ![Image](Images/image00085.jpeg)


    To create a run configuration for a Java application select `Java Application`
    from the list on the left hand side and click on the `New` button. In the dialog
    box that comes up in the main tab specify:


    * A name for the run configuration.

    * The name of a Project.

    * The name of the main class.


    In the arguments tab specify:


    * Zero or more program arguments.

    * Zero or more Virtual Machine arguments.


    ![Image](Images/image00086.jpeg)

    '
