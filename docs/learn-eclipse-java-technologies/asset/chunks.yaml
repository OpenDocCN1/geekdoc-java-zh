    To set a bookmark, right-click on the vertical ruler near the line on which you
    want the bookmark and select `Add Bookmark`. In the `Add Bookmark` dialog box
    enter a name for the Bookmark.


    ![Image](Images/image00125.jpeg)


    A bookmark icon appears in the vertical ruler. Also, a row is added to the table
    in the Bookmarks view.


    ![Image](Images/image00126.jpeg)


    ## Opening the Bookmarks View


    To open the Bookmarks view −


    *   Click on the `Window` menu and select `Show View → Other`.

    *   In the filter text box enter `Bookmark`.

    *   Under `General`, select `Bookmarks`.


    ![Image](Images/image00127.jpeg)


    *   Click on `OK`.


    ## Using the Bookmarks View


    The Bookmarks view shows bookmarks placed in resources across the workspace.


    ![Image](Images/image00128.jpeg)


    Using the Bookmarks view you can navigate to a bookmark by double clicking on
    a bookmark or right clicking on a bookmark and selecting "Go to" menu item.


    # Task Management


    ## Managing Tasks


    Programmers like to place TODO markers in their code which serves as a reminder
    for tasks that need to be completed. Comments in the Java code that has the word
    `TODO` in them are recognized as task and shown on the marker bar and in the Tasks
    view.


    ![Image](Images/image00129.jpeg)


    An eclipse editor can be used to associate tasks with the file being edited by
    right clicking on the marker bar and selecting `Add Task`. In the dialog box that
    comes up enter the task description and select a priority from the priority drop
    down list and then click on the `OK` button.


    ![Image](Images/image00130.jpeg)


    To remove a task using an Eclipse editor, right-click on the task icon in the
    marker bar and select the `Remove Task` menu item.


    ## Opening the Tasks View


    To open the Tasks view −


    *   Click on the `Window` menu and select `Show View → Other`.

    *   In the filter text box enter `Tasks`.

    *   Under `General`, select `Tasks`.


    ![Image](Images/image00131.jpeg)


    *   Click on `OK`.


    ## Using the Tasks View


    The Tasks view can be used to view all the tasks and add tasks not associated
    with any resource.


    ![Image](Images/image00132.jpeg)


    It can also be used to −


    *   Change the priority associated with a task.

    *   Mark a task as completed.

    *   Remove a task or all completed tasks.


    # Install Plugins


    ## Locating and Installing Plug-ins


    The Eclipse platform which provides the foundation for the Eclipse IDE is composed
    of plug-ins and is designed to be extensible using additional plug-ins.


    Several hundreds of plug-ins are available. Each plug-in adds more functionality
    to Eclipse. You can locate a plug-in that provides certain functionality by searching
    the Eclipse Market place (`http://marketplace.eclipse.org/`). For example you
    can locate plug-ins that allows eclipse to be used as a Python IDE.


    ![Image](Images/image00133.jpeg)


    From within the Eclipse IDE, you can search the market place by using the `Eclipse
    Marketplace` dialog which can be invoked by clicking on the `Help` menu and selecting
    `Eclipse Marketplace`.


    ![Image](Images/image00134.jpeg)


    In the screenshot above, to install `PyDev-Python IDE for Eclipse`, just click
    on the `Install` button. Using the dialog box that comes up you can install the
    plug-in.


    ![Image](Images/image00135.jpeg)


    You can also install a plug-in by using the `Install New Software` menu item accessible
    from the `Help` menu (`Help → Install New Software`).


    ![Image](Images/image00136.jpeg)


    In this case you have to know the URL of the remote site from which the plug-in
    can be downloaded. You can supply this URL by clicking on the `Add` button.


    ![Image](Images/image00137.jpeg)


    The `install` dialog box shows the plug-in components available in the remote
    site and allows you to install them.


    ![Image](Images/image00138.jpeg)


    # Code Templates


    ## Using Code Templates


    Code templates help reduce typing time by inserting code into the editor. Each
    code template is given a short literal. Typing the literal into the editor window
    and press `Ctrl + Space` brings up a dialog box from which a code template associated
    with that literal can be selected.


    Typing `for` within the body of a method in the java editor window and clicking
    `Ctrl + space` shows the code templates associated with `for`.


    ![Image](Images/image00139.jpeg)


    Selecting `for - iterate over array` inserts code for iterating through `depArray`
    which was declared earlier in the method body.


    Another useful code template literal is `sysout` which can be used to insert the
    `System.out.println()` method call.


    ![Image](Images/image00140.jpeg)


    ## Modifying/Adding code templates


    You can add new code templates using the `Preferences` dialog box. Bring up the
    `Preferences` dialog box by clicking on the `Windows` menu and selecting the `Preferences`
    menu item. To locate the `Templates` page type `Templates` into the filter text
    box.


    ![Image](Images/image00141.jpeg)


    You can read more about the variables that can be used to customize the code that
    is inserted by reading the Eclipse help. To bring up the help window click on
    the `Help` menu and select `Help Contents`. In the search text box enter `Java
    Editor Template Variables`. From the list on the left hand side select `Java Editor
    Template Variables`.


    # Shortcuts


    # Shortcuts


    ## About Shortcuts


    You can navigate the Eclipse User Interface using only the keyboard by −


    *   Using mnemonics associated with menus and menu items.

    *   Using mnemonics associated with controls in a dialog box or view.

    *   Using accelerators associated with actions on the toolbar.


    ![Image](Images/image00143.jpeg)


    The `Key Assist` action which can be invoked by `Ctrl + Shift + L` shows all the
    accelerators available in Eclipse.


    ![Image](Images/image00144.jpeg)


    The key combination assigned to an action can be changed using the `Keys` preference
    page. There are many commands or actions for which there are shortcut keys. This
    preference page also allows you to assign shortcut keys to.


    For example, to assign `Alt + C` as the shortcut key to trigger the `New Class`
    dialog box select `New Class` in the command list, navigate to the `Bindings`
    text box and then the `when` dropdown list allows you to select a context in which
    the shortcut key is valid. Ensure that there are no conflicts for the selected
    key and click on the `OK` button.


    ![Image](Images/image00145.jpeg)


    Now you can press `Alt + C` to bring up the `New Class` wizard.


    # Restart Option


    ## Restarting Eclipse


    The restart option allows users to restart eclipse. To restart eclipse, click
    on the `File` menu and select the `Restart` menu item.


    ![Image](Images/image00146.jpeg)


    After a plug-in is installed, users will be prompted to restart eclipse. If they
    choose not to restart at that point they can restart eclipse later by using the
    restart option. If eclipse user interface misbehaves, users may want to restart
    eclipse using this option.


    # Tips & Tricks


    TIP #1 DISCOVERING SHORTCUT KEYS


    *   Press `Ctrl + Shift + L` to open a widget that shows all the shortcut keys.


    TIP #2 – CONTENT ASSIST


    *   In the Java editor press `Ctrl + Space` to see a list of suggested completions.
    Typing one or more characters before clicking `Ctrl + Space` will shorten the
    list.


    TIP #3 – PARAMETER HINT


    *   When the cursor is in a method argument, press `Ctrl + Shift + Space` to see
    a list of parameter hints.


    TIP #4 – CAMEL CASE SUPPORT IN CODE COMPLETION


    *   Code completion supports camel case patterns. Entering `NPE` and clicking
    `Ctrl + Space` will propose `NullPointerException` and `NoPermissionException`.


    TIP #5 – CREATING GETTERS AND SETTERS


    *   Click on `Source → Generate Getter and Setter` to open the wizard that allows
    you to generate getter and setter methods.


    TIP #6 – GENERATING HASHCODE() AND EQUALS() METHODS


    *   Click on `Source → Generate hashCode() and equals()` to generate this methods
    for a Java class.

