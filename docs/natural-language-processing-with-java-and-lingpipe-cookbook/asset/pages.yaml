  md: '# Tagging Words and Tokens


    Next, the top-three tags are extracted from the POS feature tagger and added with
    the associated conditional probability. CRFs will be able to work with the varying
    weights productively.


    # There''s more...


    When generating new features, some thought about the sparseness of data is worth
    considering. If dates were likely to be an important feature for the CRF, it would
    probably not be a good idea to do the standard Computer Science thing and convert
    the date to milliseconds since Jan 1, 1970 GMT. The reason is that the MILLI_1000000000
    feature will be treated as completely different from MILLI_1000000001. There are
    a few reasons:


    +   - The underlying classifier does not know that the two values are nearly the
    same

    - The classifier does not know that the MILLI_ prefix is the same—thecommon prefix
    is only for human convenience

    - The feature is unlikely to occur in training more than once and will likely
    be pruned by a minimum feature count


    Instead of normalizing dates to milliseconds, consider an abstraction over the
    dates that likely have many instances in training data, such as the has_date feature
    that ignores the actual date but notes the existence of the date. If the date
    is important, then compute all the important information about the date. If it
    is a day of the week, then map to days of the week. If temporal order matters,
    then map to coarser measurement that is likely to have many measurements. Generally
    speaking, CRFs and the underlying logistic regression classifier are robust against
    ineffective features, so feel free to be creative—you are unlikely to make worry
    by adding features'
