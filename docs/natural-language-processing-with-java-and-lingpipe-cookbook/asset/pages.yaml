    Loading: \" + classifierPath);\n```\n\nNext, we will show how to deserialize a\
    \ classifier or other LingPipe object from disk:\n\n\n\n\n\nThe preceding code\
    \ snippet is the first LingPipe-specific code, where the classifier is built using\
    \ the static AbstractExternalizable.readObject method.\n\n```\nFile serializedClassifier\
    \ = new File(classifierPath);\n@SuppressWarnings(\"unchecked\")\nBaseClassifier<String>\
    \ classifier\n= (BaseClassifier<String>)\nAbstractExternalizable.readObject(serializedClassifier);\n\
    ```\n\nThis class is employed throughout LingPipe to carry out a compilation of\
    \ classes for two reasons. First, it allows the compiled to have final variables,\
    \ which supports LingPipe's extensive use of immutables. Second, it avoids the\
    \ messiness of exposing the I/O methods required for externalization and deserialization,\
    \ most notably, the no-argument constructor. This class is used as the subclass\
    \ of a private internal class that does the actual compilation. This private internal\
    \ class implements the no-arg constructor and stores the object required for readResolve().\n\
    \n> The reason we use Externalizable instead of Serializable is to avoid backward\
    \ compatibility when changing any method signatures or member variables. Externalizable\
    \ extends Serializable and allows control of how the object is read and written.\
    \ For more information on this, refer to the excellent chapter on serialization\
    \ in Josh Bloch's book, Effective Java, 2nd Edition."
