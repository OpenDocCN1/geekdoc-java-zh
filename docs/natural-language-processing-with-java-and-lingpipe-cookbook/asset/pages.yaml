    4. There are three named entities. Note that there is an ID in the output.

    The John Smith and Mr. Smith entities have the same ID, id=0. This means that
    phrases are considered to be coreferent. The remaining entity Washington has a
    different ID, id=1, and is not coreferent with John Smith / Mr. Smith.


    5. Create your own text file, supply it as an argument on the command line, and
    see what gets computed.


    # How it works...


    The coreference code in LingPipe is a heuristic system built on top of sentence
    detection and named-entity recognition. The overall flow is as follows:


    +   1. Tokenize the text.


    +   2. Detect sentences in the document, for each sentence, detect named entities
    in the sentence in the left-to-right order, and for each named entity, perform
    the following tasks:


    +   1. Create a mention. Mention is a single instance of a named entity.


    +   2. Mentions can be added to the existing mention chains, or they can start
    their own mention chains.


    +   3. Try to resolve the mention by chain that is already created. If a unique
    match is found, add the mention to the mention chain; otherwise, create a new
    mention chain.


    The code is in src/lingpipe/cookbook/chapter7/NamedEntitycoreference.java. The
    main() method setting up parts of this piece, starting with a tokenizer factory,
    sentence chunker, and a named-entity chunker:


    ![](img/83ff609b4222b256508d150d8823f9d6_271_0.png)'
