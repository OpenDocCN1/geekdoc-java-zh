  md: '# Simple Classifiers


    # # Introduction


    This chapter introduces the LingPipe toolkit in the context of its competition
    and dives straight into text classifiers. Text classifiers assign a category to
    text, for example, they assign the language to a sentence or if it is a tweet,
    positive, negative, or neutral in sentiment. This chapter covers how to use, evaluate,
    and create text classifiers based on language models. These are the simplest machine
    learning-based classifiers in the LingPipe API. What makes them simple is that
    they operate over characters only-later, classifiers will have notions of words/tokens
    and even more. However, do not be fooled, character-language models are ideal
    for language identification, and they were the basis of the world''s earliest
    commercial sentiment systems.


    This chapter also covers evaluation infrastructure—it turns out almost everything
    we turn out to be a classifier at some level of interpolation. So, do not skip
    on the power of cross validation, definitions of precision/recall, and F-measure.


    The best part that you will learn is to programmatically access Twitter data to
    train and evaluate your classifiers. There is a boring concerning the mechanics
    of reading and writing LingPipe objects from/to disk, but other than that, this
    is a fun chapter. The goal of this chapter is to get up and running quickly with
    the basic care and feeding of machine-learning techniques in the domain of natural
    language processing (NLP).


    LingPipe is a Java toolkit for NLP-oriented applications. This book will show
    you how to solve common NLP problems with LingPipe in a problem/solution format
    that allows developers to quickly deploy solutions to common tasks.


    # # LingPipe and its installation


    LingPipe 1.0 was released in 2003 as a dual-licensed open source NLP Java library.
    At the time of writing this book, we are coming up on 2000 hits on Google Scholar
    and thousands of commercial installs, ranging from universities to government
    agencies to Fortune 500 companies.


    Current licensing is AGPL (http://www.gnu.org/licenses/agpl-3.0.html) or our commercial
    license that offers more traditional features such as indemnification and non-sharing
    of code as well as support.


    # Projects similar to LingPipe


    Nearly all NLP projects have awful acronyms so we will lay bare our own. LingPipe
    is the short form for linguistic pipeline, which was the name of the cvs directory
    in Bob Carpenter put the initial code.'
  merge: -1
  pgno: 20
- img_proc: true
  md: '# Chapter 1


    LingPipe has lots of competition in the NLP space. The following are some of the
    more popular ones with a focus on Java:


    +   - **NLTK**: This is the dominant Python library for NLP processing.


    +   - **OpenNLP**: This is an Apache project built by a bunch of smart folks.


    +   - **JavaNLP**: This is a rebranding of Stanford NLP tools, again built by
    a bunch of smart folks.


    +   - **ClearTK**: This is a University of Boulder toolkit that wraps lots of
    popular machine learning frameworks.


    +   - **DkPro**: Technische Stuttgart from Germany produced this UIMA-based project
    that wraps many components in a useful manner. UIMA is a common framework for
    NLP.


    +   - **GATE**: GATE is more of a framework than competition. In fact, LingPipe
    components are part of their standard distribution. It has a nice graphical "hook
    the components up"


    +   - **Learning Based Java (LBJ)**: LBJ is a special-purpose programming language
    based on Java, and it is geared towards machine learning and NLP. It was developed
    at the Cognitive Computation Group of the University of Illinois at Urbana Champaign.


    +   - **Mallet**: This is the short form of MAchine Learning for LanguageE Toolkit.
    Apparently, reasonable acronym generator is in supply for these days. Smart folks
    built this too.


    Here are some machine learning frameworks that have broader appeal but are not
    necessarily tailored for NLP tasks:


    +   - **Wowpal Wabbit**: This is very focused on scalability around Logistic Regression,
    latent Dirichlet Allocation, and so on. Smart folks drive this.


    +   - **Factorie**: It is from UMass, Amherst and an alternative offering to Mallet.
    Initially it focused on graphic models, but now it supports NLP tasks.


    +   - **Support Vector Machine (SVM)**: SVM light libsvm are very popular SVM
    implementations. There is no SVM implementation in LingPipe, because logistic
    regression de so as this.


    # So, why use LingPipe?


    It is reasonable to ask why LingPipe with such outstanding free competition mentioned
    earlier. There are a few reasons:


    +   - **Documentation**: The class-level documentation in LingPipe is very thorough.
    If the work is based on academic work, that work is cited. Algorithms are laid
    out, the underlying math is explained, and explanations are precise. What the
