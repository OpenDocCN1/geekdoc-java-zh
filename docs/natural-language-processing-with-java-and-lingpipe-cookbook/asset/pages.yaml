  md: "# Finding Spans in Text – Chunking\n\n# # Introduction\n\nThis chapter will\
    \ tell you how to work with spans of text that typically cover one or more words/tokens.\
    \ The LingPipe API represents this unit of text as a chunk with corresponding\
    \ chunkers that produce chunkings. The following is some text with character offsets\
    \ indicated:\n\n```\nLingPipe is an API. It is written in Java.\n01234567890123456789012345678901234567890\n\
    \        1         2         3         4\n```\n\nChunking the preceding text into\
    \ sentences will give us the following:\n\n```\nSentence start=0, end=18\nSentence\
    \ start=20, end=41\n```\n\nAdding in a chunking for named entities adds entities\
    \ for LingPipe and Java:\n\n```\nOrganization start=0, end=7\nOrganization start=37,\
    \ end=40\n```\n\nWe can define the named-entity chunkings with their offsets from\
    \ the sentences that contain them; this will make no difference to LingPipe, but\
    \ Java will be:\n\n```\nOrganization start=17, end=20\n```\n\nThis is the basic\
    \ idea of chunks. There are lots of ways to make them.\n\n# # Sentence detection\n\
    \nSentences in written text roughly correspond to a spoken utterance. They are\
    \ the standard unit of processing words in industrial applications. In almost\
    \ mature NLP applications, sentence detection is a part of the processing pipeline\
    \ in the case of tweets, which can have more than one sentence in the allotted\
    \ 140 characters.\n\n# # How to do it?\n\n+   1. As usual, we will play with some\
    \ data first. Enter the following command in the console:\njava -cp lingpipe-cookbook.1.0.jar:lib/lingpipe-4.1.0.jar:\
    \ com.lingpipe.cookbook.chapter5.SentenceDetection\n2. The program will provide\
    \ a prompt for your sentence-detection experimentation.\nA new line / return terminates\
    \ the text to be analyzed:\nEnter text followed by new line\n>A sentence. Another\
    \ sentence."
