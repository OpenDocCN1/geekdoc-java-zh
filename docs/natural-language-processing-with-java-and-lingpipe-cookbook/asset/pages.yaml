  md: "# String Comparison and Clustering\n\n# How it works...\n\nThis code is a very\
    \ simple way to build a search engine rather than a good way to build one. However,\
    \ it is a decent way to explore how the concept of string distance works in the\
    \ search context. Later in the code, we will perform clustering based on the same\
    \ distance metric. Start with the main() class in src/com/linepipe/cookbook/chapter/6/TfIdException.java:\n\
    \n```\npublic static void main(String[] args) throws IOException {\n    String\
    \ searchableDocs = args.length > 0\n        ? args[0] : \"data/disneyWorld.csv\"\
    ;\nSystem.out.println(\"Reading search index\\nfrom \" + searchableDocs);\\n\n\
    \    String idfFile = args.length > 1\n        ? args[1] : \"data/connecticut_yankee_king_arthur.txt\"\
    ;\n    System.out.println(\"Getting IDF data from \" + idfFile);\n```\n\nThis\
    \ program can take command-line files for the searched data in the .csv format\
    \ and a text file for the source of data. Next, we will set up a tokenizer factory\
    \ and TfIdDistance. If you are not familiar with tokenizer factories, then refer\
    \ to the Modifying tokenizer factories in Chapter 2, Modifying Tokenizer Factories,\
    \ for an explanation:\n\n```\nTokenizerFactory tokFact = IndoEuropeanTokenizerFactory.INSTANCE;\n\
    TfIdDistance TfIdDist = new TfIdDistance(tokFact);\n```\n\nThen, we will get the\
    \ data that the IDF component by splitting the text on \\.\", which approximates\
    \ sentence detection–we could have done a proper detection like we did in the\
    \ Sentence detection recipe in Chapter 5, Finding Spans in Text – Chunking, but\
    \ we choose to keep the example as simple as possible:\n\n```\nString training\
    \ =\nFiles.readFromFile(new File(idfFile), Strings.UTF8);\nfor (String line :\
    \ training.split(\"\\\\n\")) {\n    TfIdDist.handle(line);\n}\n```\n\nInside the\
    \ for loop, there is handle(), which trains the class with knowledge of the token\
    \ distributions in the corpus, It happens that the concept of document is smaller\
    \ (sentence, paragraph, and word) or larger than what is typically termed document.\
    \ In the case, the document frequency will be the number of sentences the token\
    \ is in.\n\nNext, the documents that we are searching for loaded:\n\n```\nList<String>\
    \ docsToSearch =\nUtil.readCsvRemoveHeader(new File(searchableDocs));\n```"
