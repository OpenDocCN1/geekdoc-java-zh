  md: "# Simple Classifiers\n\nWith these definitions in hand, we can define the additional\
    \ common evaluation metrics as follows:\n\n+   - Precision for a category X is\
    \ true positive / (false positive + true positive)\n  - The degenerate case is\
    \ to make one very confident guess for 100 percent precision. This minimizes the\
    \ positives but will have a horrible recall.\n\n+   - Recall or sensitivity for\
    \ a category X is true positive / (false negative + true positive)\n  - The degenerate\
    \ case is to guess all the data as belonging to category X for 100 percent recall.\
    \ This minimizes false negatives but will have horrible precision.\n\n+   - Specificity\
    \ for a category X is true negative / (true negative + false positive)\n  - The\
    \ degenerate case is to guess that all data is not in category X.\n\nThe degenerate\
    \ cases are provided to make clear what the metric is focused on. There metrics\
    \ such as f-measure that balance precision and recall, but even then, there is\
    \ no inclusion of true negatives, which can be highly informative. The Javadoc\
    \ at com.aliasi.classify.PrecisionRecallEvaluation for more details on evaluation.\n\
    \nIn our experience, most business needs need to map to one of the three scenarios:\n\
    \n+   - **High precision / high recall**: The language ID needs to have both coverage\
    \ and good accuracy; otherwise, lots of stuff will go wrong. Fortunately, for\
    \ distinct languages where a mistake will be costly (such as Japanese versus English\
    \ or English Spanish), the LM classifiers perform well.\n\n+   - **High recall\
    \ / usable recall**: Most business cases have this shape. For example, a search\
    \ engine that automatically changes a query if it is misspelled better not make\
    \ lots of mistakes. This it looks pretty bad to change \"Breck Baldwin\" to \"\
    Brad Baldwin\", but no one really notices if \"Brad Baldwin\" is not corrected.\n\
    \n+   - **High recall / usable precision**: Intelligence analysis looking for\
    \ a particular need in a haystack will tolerate a lot of false positives in support\
    \ of finding the intended target. This was an early lesson from\n\n# How to serialize\
    \ a LingPipe object – classifier example\n\nIn a deployment situation, trained\
    \ classifiers, other Java objects with complex configuration, or training are\
    \ best accessed by deserializing them from a disk. The first recipe did exactly\
    \ this by reading in `LMClassifier` from the disk with `AbstractExternalizable`.\
    \ This recipe shows how to use the language ID written out to the disk for later\
    \ use.\n\n![](img/83ff609b4222b256508d150d8823f9d6_52_0.png)"
