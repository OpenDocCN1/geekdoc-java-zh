    \n# Classifier-building life cycle\n\nAt the top-level building, a classifier\
    \ usually proceeds as follows:\n\n+   1. Create training data–refer to the following\
    \ recipe for more about this.\n2. Build training and evaluation infrastructure\
    \ with sanity check.\n3. Establish baseline performance.\n4. Select optimization\
    \ metric for classifier–this is what the classifier is trying to do\nand will\
