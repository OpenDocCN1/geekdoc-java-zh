    # The Tf-Ldf distance


    A very useful metric between strings is provided by the TfIdfDistance class. It
    is, in fact, closely related to the distance metric from the open source search,
    Lucene/SOLR/Elastic Search, where the strings being compared are the query against
    documents in the index. Tf-idf stands for the formula that is term frequency (TF)
    times inverse document frequency (IDF) for terms shared by the query and the document.
    A very cool thing about this approach is that common terms (for example, the)
    are very frequent in documents are downweighted, while rare terms are upweighted
    in the distance comparison. This can help focus the distance on terms that are
    actually discriminating the document collection.


    Not only TfIdfDistance come in handy for search-engine-like applications, it can
    be very useful for clustering and for any problem that calls for document similarity
    without supervised training data. It has a desirable property; scores are normalized
    to a score between 0 and 1, and for a fixed document d1 and varying document lengths
    d2, do not overwhelm the assigned score. In our experience, the scores for different
    pairs of documents are fairly robust if you were trying to rank the quality of
    match for a pair of documents.


    > Note that there are a range of different distances called Tf-Ldf distances.
    The one in this class is defined to be symmetric, unlike typical Tf distances
    that are defined for information-retrieval purposes.


    There is a lot of information in the Javadoc that is worth a good look. However,
    for the purposes of these recipes, all you need to know is that the Tf-Ldf distance
    is useful for similar documents on a word-by-word basis.'
