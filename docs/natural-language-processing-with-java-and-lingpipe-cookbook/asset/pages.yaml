  md: "# Interesting phrase detection\n\nImagine that a program can take a bunch of\
    \ text and automatically find the interesting parts, where \"interesting\" means\
    \ that the word or phrase occurs more often than expected. It has a very nice\
    \ property—no training data is needed, and it works for any language that we have\
    \ tokens for. You have seen this most often in tag clouds as the one in the following\
    \ figure:\n\n```\njavadoc models textbook LingPipe 3.9.3 Home Page\nbugs license\
    \ install sandbox home citations Services\ndemos competition contact customers\
    \ about alias-\nlipiping core tutorials\n```\n\nThe preceding figure shows a tag\
