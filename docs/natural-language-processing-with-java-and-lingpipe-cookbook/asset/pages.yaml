    below .65 before the last value is found—with a score of .73.


    7. So, without tuning, we can report that we can achieve 30 percent for p at our
    accepted precision limit of 65 percent. This requires that we threshold the classifier
    by .73 for the category, which means if we reject scores less than .73 for p,
    some comments are:


    +   - We got lucky. Usually, the first classifier runs do not reveal an immediately
    useful threshold with default values.


    +   - Logistic regression classifiers have a very nice property that they provide;
    they also provide probability estimates for thresholding. Not all classifiers
    have this property—language models and naïve Bayes classifiers to push scores
    towards 0 or 1, making thresholding difficult.


    +   - As the training data is highly biased (this is from the Train a little,
