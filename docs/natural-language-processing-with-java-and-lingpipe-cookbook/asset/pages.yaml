  md: '# # Modifying tokenizer factories


    In this recipe, we will describe a tokenizer that modifies the tokens in the token
    stream. We will extend the ModifyTokenizerFactory class to return text that is
    rotated by 13 places in the English alphabet, also known as rot-13. Rot-13 is
    a very simple substitution cipher, which replaces a letter with the letter that
    follows it 13 places. For example, the letter a will be replaced by the letter
    n, and the letter z will be replaced by the letter m. This is a reciprocal cypher,
    which means applying the same cipher twice recovers the original text.


    # ## How to do it...


    We will invoke Rot13TokenizerFactory class from the command line:


    ```

    java -cp "lingpipe-cookbook.1.0.jar:lib/lingpipe-4.1.0.jar" com.lingpipe.cookbook.chapter2.Rot13TokenizerFactory

    ```


    ```

    type a sentence below to see the tokens and white spaces:

    Move along, nothing to see here.

    Token:''zbir''

    Token:''nybat''

    Token:'',`

    Token:''abguvat''

    Token:''gb''

    Token:''frr''

    Token:''urer''

    Token:''.


    Modified Output: zbir nybat, abguvat gb frr prer.

    type a sentence below to see the tokens and white spaces:

    zbir nybat, abguvat gb frr prer.

    Token:''move''

    Token:''along''

    Token:'',`

    Token:''nothing''

    Token:''to''

    Token:''see''

    Token:''here''

    Token:''.


    Modified Output: move along, nothing to see here.

    ```'
