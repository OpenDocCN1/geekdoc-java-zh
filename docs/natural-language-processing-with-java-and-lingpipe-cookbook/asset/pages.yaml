    # Training your own language model classifier


    The world of NLP really up when classifiers are customized. This recipe provides
    details on how to customize a classifier by collecting examples for the classifier
    to learn from—this is called training data. It is also called gold standard data,
    truth, or ground truth. We have some from the previous recipe that we will use.


    # Getting ready


    We will create a customized language classifier for English and other languages.
    Creation of training data involves access to text data and annotating it for the
    categories of the classifier—in this case, annotation is the language. Training
    data can come from a range of sources. Some possibilities include:


    +   * Gold standard data such as the one created in the preceding recipe.

    * Data that is somehow already annotated for the categories you care about. For
    example, Wikipedia has language-specific versions, which make easy pickings to
    train up a language ID classifier. This is how we created the 3LangId.LMClassifier
    model.

    * Be creative—where is the data that helps guide a classifier in the right direction?


    Language ID doesn''t require much data to work, so 20 tweets per language will
    start to reliably distinguish strongly different languages. The amount of training
    data will be driven by evaluation—more data generally improves performance.


    The example assumes that around 10 tweets of English and 10 non-English tweets
    have annotated by people and put in data/disney_e_n.csv.


    # How to do it?


    To train your own language model classifier, perform the following steps:


    +   1. Fire up a terminal and type the following:

    ```java

