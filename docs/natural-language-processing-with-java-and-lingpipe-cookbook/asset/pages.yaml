  md: '# Advanced Classifiers


    Next, we will adjust the variance of the prior. This sets an expected variation
    for the weights. A low variance means that coefficients are expected not to vary
    much from zero. In the preceding code, the variance was set to 2. This is the
    result of setting it to .01:


    ```

    Feature coefficients for category e

    : -0.00003809

    Feature coefficients for category n

    ```


    This is a drop from 104 features with variance 2 to one feature for variance .01,
    because once a feature has dropped to 0, it is removed.


    Increasing the variance changes our top e features from 2 to 4:


    ```

    Feature coefficients for category e

    I : 0.36886804

    ! : 0.29588525

    Disney : 0.14954419


    I : 0.40189501

    ! : 0.31387376

    Disney : 0.18255271

    ```


    This is a total of 119 features.


    Consider a variance of 2 and a gaussian prior:


    ```

    boolean noninformativeIntercept = false;

    double priorVariance = 2;

    RegressionPrior prior

    = RegressionPrior.gaussian(priorVariance,

    noninformativeIntercept);

    ```


    We will get the following output:


    ```

    I : 0.38866670

    ! : 0.27367013

    Disney : 0.22693340

    ```


    Oddly, we spend very little time worrying about which prior we use, but variance
    has a big role in performance, because it can cut down the feature space quickly.
    Laplace is a commonly accepted prior for NLP applications.


    Consult the Javadoc and logistic regression tutorial for more information.'
