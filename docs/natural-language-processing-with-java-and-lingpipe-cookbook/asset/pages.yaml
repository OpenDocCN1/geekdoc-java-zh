    final ObjectDoubleMap<String[]> accumulator\n    = new ObjectDoubleMap<String>()();\n\
    ```\n\nThen, we will iterate over each category and create a list of the false\
    \ negatives and positives for the category—these are the cases where the truth\
    \ category is the category label:\n\n```\nfor (String category : categories) {\n\
    \    List<Classified<CharSequence>> inCategory\n    = evaluator.truePositives(category);\n\
    \    inCategory.add(evaluator.falseNegatives(category));\n```\n\n134"
