  md: "The following is the first exposure to the Chunker interface in the book, and\
    \ a few comments are in order. The Chunker interface generates the Chunk objects,\
    \ which are typed and scored contiguous-character sequences over CharSequence—usually,\
    \ String. Chunks can overlap. The Chunker objects are stored in Chunker:\n\n```\n\
    String textStored = chunking.charSequence().toString();\nfor (Chunk sentence :\
    \ sentences) {\n  int start = sentence.start();\n  int end = sentence.end();\n\
    \  System.out.println(\"SENTENCE \" \n  + textStored.substring(start,end));\n\
    }\n```\n\nFirst, we recovered the underlying text string textStored that the chunks\
    \ are based on. It is the same string as text, but we wanted to illustrate this\
    \ potentially useful method of the Chunking class, which can come in recursive\
    \ or other contexts when the chunking is far removed from where CharSequence it\
    \ uses is unavailable.\n\nThe remaining for loop iterates over the sentences and\
    \ prints them out with the substring() method of String.\n\n# There's more...\n\
    \nBefore moving on to roll your own sentence detector, it is worth mentioning\
    \ that LingPipe has MedlineSentenceModel, which is oriented towards the kind of\
    \ sentences found in the medical research literature. It has seen a lot of data\
    \ and should be a starting place for your own sentence-detection efforts over\
    \ these kinds of data.\n\n# Nested sentences\n\nSentences, particularly in literature,\
    \ can contain nested sentences. Consider the following:\n\n> John said \"this\
    \ is a nested sentence\" and then shut up.\n\nThe preceding sentence will be marked\
    \ up properly as:\n\n> John said \"this is a nested sentence\" and then shut up.\n\
    \nThis sort of nesting is different from a linguist's concept of a nested sentence,\
    \ which is based on grammatical rule. Consider the following:\n\n> [[John ate\
    \ the gorilla] and [Mary ate the burger]].\n\nThis sentence consists of two linguistically\
    \ complete sentences joined by and. The difference between the two is that the\
    \ former is determined by punctuation and the latter by a grammatical function.\
    \ Whether this distinction is significant or not can be debated. However, the\
    \ former case is much easier to recognize programmatically."
