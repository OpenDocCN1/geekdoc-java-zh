    # There''s more...


    Clustering is very sensitive to Distance that is used for the comparison of clusters.
    Consult the Javadoc for the 10 implementing classes for possible variations. TfidfDistance
    can come in very handy to cluster language data.


    K-means (++) clustering is a feature-extractor-based clustering. This is what
