    # The case restoring corrector


    A case-restoring spell corrector, also called a trueasing corrector, only restores
    the case and does not change anything else, that is, it does not spelling errors.
    This is very useful when dealing with low-quality text from transcriptions, automatic
    speech-recognition output, chat logs, and so on, which contain a variety of case
    challenges. We typically want to enhance this text to build better rule-based
    or machine-learning systems. For example, news and video transcriptions (such
    as closed captions) typically have errors, and this makes it harder to use this
    data to train NER. Case restoration can be used as a normalization tool across
    data sources to ensure that all the data is consistent.


    # How to do it...


    +   1. In your IDE, run the CaseRestore class, or in the command line, type the
    following:

    `java -cp lingpipe-cookbook.1.0.jar:lib/lingpipe-4.1.0.jar com.lingpipe.toolbox.chapter6.CaseRestore`

    2. Now, let''s use some mangled-case or single-case input:

    `Enter input, . george washington was the first president of the u.s.a`nBest Alternative:
    George Washington was the first President of the U.S.A

    `Enter input, . to quit: ITS RUDE TO SHOUT ON THE WEB`nBest Alternative: its rude
    to shout on the Web

    3. As you can see, the mangled case gets corrected. If we use more modern text,
    such as current newspaper data or something similar, this would be directly applicable
    to case-normalizing broadcast news transcripts or closed captions.'
