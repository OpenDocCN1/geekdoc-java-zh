    various techniques from speech processing, Natural Language Processing, machine
    learning, and data mining to improve systems that perform automatic speech recognition
    and natural language understanding. The products has recently worked at Microsoft
    with the new Kinect sensor for Xbox One and the Cortana digital assistant in Windows
    Phone 8.1. In his previous roles at Microsoft, Karthik worked on shallow dependency
