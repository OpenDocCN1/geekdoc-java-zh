    # NER using CRFs with better features


    In this recipe, we''ll show you how to create a realistic, though not state-of-the-art,
    set of features for CRFs. The features will include normalized tokens, part-of-speech
    tags, word-shape features, position features, and token prefixes and suffixes.
    Substitute it for the SimpleCrffFeatureExtractor in the CRFs recipe to use it.


    # How to do it...


    The source for this recipe is in src/lingpipe/cookbook/chapter5/FancyCrffFeatureExtractor.java:


