    # How it works...


    Most developers are surprised that the only difference between language ID and
    sentiment is the labeling applied to the data for training. The language classifier
    is applying an individual language model for each category and also noting the
    marginal distribution of the categories in the estimates.


    # There''s more...


    Classifiers are pretty dumb but very useful if they are not expected to work outside
    their capabilities. Language ID works great as a classification problem because
    the observed events are tightly tied to the classification being done—the words
    and characters of a language. Sentiment is more difficult because the observed
    events, in this case, are exactly the same as the language ID and are less associated
    with the end classification. For the example, the phrase "I love" is a good predictor
    of the sentence being English but not as clear as a predictor that the sentiment
    is positive, negative, or other. If the tweet is "I love Disney", not, then it
    is negative. Addressing we have a positive statement. If the tweet is I love Disney,
    the complexities of sentiment or more complex phenomenon tends to be resolved
    in the following:


    +   - Create training data. Even relatively dumb techniques like language model
    classifiers can perform well well given enough data. Humanity is not creative
    in ways to gripe around, or praise, something. The Train a little, learn a little
    – active learning recipe of Chapter 3, Advanced Classifiers, presents a clever
    way to do this.

    - Use fancier classifiers that in turn use fancier features (observations) about
    the data to get the job done. At logistic regression recipes for more information.
    For the negation case, a feature that looked for a negative phrase in the tweet
    might help. This could get arbitrarily sophisticated.


