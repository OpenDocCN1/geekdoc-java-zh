  md: '# There''s more...


    Annotation is a very complex area that deserves its own book, and fortunately,
    there is a good one. Natural Language Annotation for Machine Learning, James Pustejovsky
    and Amber Stubbs, O''Reilly Media. To get annotations done, there is Amazon''s
    Mechanical Turk service as well as companies that specialize in the creation of
    training data such as CrowdFlower. However, be careful of outsourcing because
    classifiers are very dependent on the quality of data.


    Conflict resolution between annotators is a challenging area. Many errors will
    be due to attention lapses, but some will persist as legitimate areas of disagreement.
    Two easy resolution strategies are either to throw out the data or keep both annotations.'
