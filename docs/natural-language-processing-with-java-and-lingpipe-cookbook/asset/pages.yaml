    # Common problems as a classification problem


    Classifiers form the foundations of many industrial NLP problems. This recipe
    goes through the process of encoding some common problems into a classification-based
    solution. We will pull from real-world examples that we have built whenever possible.
    You can think of them as mini recipes.


    # Topic detection


    Problem: Take footnotes from financial documents (10Qs and 10Ks) and determine
    whether an eXtensible Business Reporting Language (XBRL) category is applied like
    "forward looking financial statements". Turns out that footnotes are where all
    the action happens. For example, is the footnote referring to retired debt? Performance
    needed greater than 90 percent precision with acceptable recall.


    Solution: This problem mirrors how we approached language ID and sentiment. The
    actual solution involves a sentence recognizer that detects the footnotes—see
    Chapter 5, Finding Spans in Text – Chunking—and then creates data for each of
    the XBRL categories. We used the confusion matrix output to refine the XBRL categories
    that the system was struggling to distinguish. Merging categories was a possibility,
    and we merged them. This system is based on language model classifiers. If done
    now, we would use logistic regression.


    # Question answering


    Problem: Identify FAQs in a large dataset of text-based customer support data
    and develop the answers and ability to automatically deliver answers with 90 percent
    precision.


    Solution: Perform clustering analysis over logs to find FAQs—see Chapter 6, String
    Comparison and Clustering. This will result in a very large set of FAQs that are
    really Frequently Asked Questions (IAQs); this means that the prevalence of an
    IAQ be as low as 1/20000. Positive data is fairly easy to find for a classifier,
    but negative data is too expensive to create any kind of balanced distribution—for
    every positive case, one will expect 19999 negative case. The solution is to assume
    that any random sample of a large size will contain very few positives and just
    use this as negative data. A refinement is to run a trained classifier over the
    negatives to find high-scoring cases and annotate them to pull out the positives
    that might be found.'
