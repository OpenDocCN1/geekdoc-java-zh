  md: '# Regular expression-based chunking for NER


    Named Entity Recognition (NER) is the process of finding mentions of specific
    things in text. Consider a simple name; location-named entity recognizer might
    find Ford Prefect and Guildford as the name and location mentions, respectively,
    in the following:


    Ford Prefect used to live in Guildford before he needed to move.


    We will start by building rule-based NER systems and move up to machine-learning
    methods. Here, we''ll take a look at building an NER system that can extract e-mail
    addresses from text.


    # How to do it...


    +   1. Enter the following command in the command prompt:

    java -cp lingpipe-cookbook.1.0.jar:lib/lingpipe-4.1.0.jar com.lingpipe.cookbook.chapter5.RegexNer


    +   2. Interaction with the program proceeds as follows:

    Enter text, . to quit:

    >Hello, my name is Foo and my email is foo@bar.com or you can also contact me
    at foo.bar@gmail.com.

    input-Hello, my name is Foo and my email is foo@bar.com or you can also contact
    me at foo.bar@gmail.com.

    chunking-Hello, my name is Foo and my email is foo@bar.com or you can also contact
    me at foo.bar@gmail.com : [37-48:email@0, 79-96:email@0.0]

    chunk=37-48:email@0.0 text=foo@bar.com

    chunk=79-96:email@0.0 text=foo@bar@gmail.com


    +   3. You can see that both foo@bar.com as well as foo.bar@gmail.com were returned
    as valid e-mail type chunks. Also, note that the final period in the sentence
    is not part of the second e-mail.'
