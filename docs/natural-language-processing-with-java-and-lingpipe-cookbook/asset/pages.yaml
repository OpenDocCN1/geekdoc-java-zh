    \ extractor is constructed.\nWe assume that you are familiar with the previous\
    \ recipe. First, the constructor that brings in the\nBrown corpus POS tagger:\n\
    \n```\nHmmDecoder mDecoder;\n```\n\n```\npublic ModifiedCrffFeatureExtractor()\
    \ throws IOException\nClassNotFoundException {\n    File hmmFile = new File(\"\
    models/pos-en-general-\"\n      + \"brown.HiddenMarkovModel\");\n    HiddenMarkovModel\
    \ hmm = (HiddenMarkovModel) AbstractExternalizable.readObject(hmmFile);\n    mDecoder\
    \ = new HmmDecoder(hmm);\n}\n```\n\nThe constructor brings in some external resources\
    \ for feature generation, namely, a POS\ntagger trained on the Brown corpus. Why\
    \ involve another POS tagger for a POS tagger? We will\ncall the role of the Brown\
    \ POS tagger a \"feature tagger\" to distinguish it from the tagger we are\ntrying\
    \ to build. A few reasons to use the feature tagger:\n\n+   - We are using a stupidly\
    \ small corpus for training, and a more robust generalized feature tagger will\
    \ help things out. TinyPosCorpus is too small for this benefit, but with a bit\
    \ more data, the fact that there is a feature that unifies the a, a and some will\
    \ help the CRF recognize that some dog is 'DET' 'N', even though it has never\
    \ seen in training.\n\n+   - We have worked with tag sets that are not aligned\
    \ with POS feature taggers. The CRF can use these observations in the foreign\
    \ tag set to better reason about the desired tagging. The simplest case is that\
    \ at, from the Brown corpus tag set, maps cleanly onto DET in this tag set.\n\n\
    +   - There can be performance improvements to run multiple layers that are either\
    \ trained on different data or use different technologies to tag. The CRF can,\
    \ hopefully, recognize contexts where one tagger outperforms others and use this\
    \ information to guide the analysis. Back in the day, our MUC-6 system featured\
    \ 3 POS taggers that voted for the best output. Letting the CRF sort it out will\
    \ be a superior approach.\n\n![](img/83ff609b4222b256508d150d8823f9d6_181_0.png)"
