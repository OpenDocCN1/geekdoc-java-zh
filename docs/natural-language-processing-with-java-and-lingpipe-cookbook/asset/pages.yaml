  md: '# Finding Spans in Text – Chunking


    This recipe does not cover all the evaluation methods—check out the Javadoc—but
    it provides what a sentence detector tuner likely be in need of; this is a listing
    of what the sentence detector got right (true positives), sentences found but
    were wrong (false positives), and sentences it missed (false negatives). Note
    that true negatives don''t make much sense in span annotations, because they will
    be the set of all the possible spans that are not in the truth sentence detection.


    # Tuning sentence detection


    Lots of data will resist the charms of IndoEuropeanSentenceModel, so this recipe
    will provide a starting place to modify sentence detection to meet new kinds of
    sentences. Unfortunately, this is a very open-ended area of system building, so
    we will focus on techniques rather than likely formats for sentences.


    # How to do it...


    This recipe will follow a well-worn pattern: create evaluation data, set up evaluation,
    and start hacking. Here we go:


    +   1. Haul your favorite text editor and mark up some data—we will stick to the
    [ and markup approach. The following is an example that runs ahaul of our standard
    IndoEuropeanSentenceModel:


    [All decent people live beyond their incomes nowadays, and those who aren''t respectable
    live beyond other people''s.] [A few gifted individuals manage to do both.]

    2. We will put the preceding sentence in data/saki.sentDetected.txt and run it:

    `java -cp lingpipe-cookbook.1.0.0.jar:lib/lingpipe-4.1.0.jar: com.lingpipe-cookbook.chapter5.EvaluateAnnotatedSentences
    data/saki.sentDetected`

    FalsePos: 0-159/All decent people live beyond their incomes nowadays, and those
    who aren''t respectable live beyond other people''s. A few gifted individuals
    manage to do both.

    FalseNeg: 0-114/All decent people live beyond their incomes nowadays, and those
    who aren''t respectable live beyond other people''s::S

    FalseNeg: 116-159/A few gifted individuals manage to do both.:


    # There''s more...


    The single false positive corresponds to the one sentence found, and the two false
    negatives are the two sentences not found that we annotated. What happened? The
    sentence model missed people''s. as a sentence end. If the apostrophe is removed,
    the sentence is detected properly—what is going on?'
