- img_proc: true
  md: 'Note that the application is performing spelling checking at the same time
    as completion. For instance, the top suggestion is amazon, even though the query
    so far is anz. This is not surprising, given that the number of results reported
    for the phrases that start with anaz is probably very small.


    Next, it is not doing word suggestion but phrase suggestion. Some of the results,
    such as amazon prime are two words.


    One important difference between autocompletion and spell checking is that autocompletion
    typically operates over a fixed set of phrases that must match the beginning to
    be completed. What this means is if I type a query I want to find anaz, there
    are no suggested completions. The source of phrases for a web search is typically
    high-frequency queries over the query logs.


    In LingPipe, we use the AutoComplete class, which maintains a dictionary of phrases
    with counts and provides suggested completions based on prefix matching by weighted
    distance and phrase likelihood.


    The autocomplete finds the best scoring for a given prefix. The score of a phrase
    versus a prefix is the sum of the score of the phrase and the maximum score of
    the prefix against any prefix of the phrase. The score for a phrase is just its
    maximum likelihood probability estimate, and that, is the log of it divided by
    the sum of all counts.


    Google and other search engines most likely use their query counts as the data
    for the best scoring. As we don''t have query logs here, we''ll use census data
    about cities in the US with populations greater than 100,000. The phrases are
    the city names, and their counts are their populations.


