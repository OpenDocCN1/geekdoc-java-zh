    \ sentenceModel = new\n        IndoEuropeanSentenceModel(endSent, parenS);\n```\n\
    \nWorking from the top of the main class, the Boolean endSent parameter controls\
    \ whether the string that is detected is assumed to be with a sentence, no matter\
    \ what—this means that the last character is a sentence boundary always—it does\
