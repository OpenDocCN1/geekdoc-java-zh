- img_proc: true
  md: '# Chapter 3


    4. Have a meeting with all the stakeholders in the annotation. This includes experience
    designers, business folks, developers, and end users. The goal of this meeting
    is to expose all the relevant parties to what the system will actually do—the
    system will take the 10 examples and produce the category label. You will be amazed
    at how much this step establishes. Here are the kinds of:


    +   - Upstream/downstream users of the classifier will have a clear idea of what
    are expected to produce or consume. For example, the system consumes UTF-8-encoded
    English tweets and produces an ASCII line character of p, n, or u.


    +   - For a sentiment, people tend to want a severity score, which is very hard
    to get. Is it worth it? A score of confidence can be provided, but there is confidence
    that the category is correct not the severity of the sentiment. This meeting will
    force the discussion.


    +   - During this meeting explain that each category will likely need at least
    100 examples, if not 500, to a reasonable job. Also explain that switching domains
    might require new annotations. NLP is extremely easy for your colleagues, and
    as a result, they will underestimate what it takes to build systems.


    +   - Don''t neglect to include whoever is paying for this. I suppose you should
    not have your parents involved if this is your undergraduate.


    5. Write down an annotation standard that explains the intent behind each category.
    It doesn''t need to be very complex, but it needs to exist. The annotation standard
    should be circulated around the stakeholders. Bonus points if you have one of
    the mentioned meetings; if so, it will likely be different at the end, but this
    is fine. An example is:


    +   - A tweet is positive if the sentiment is unambiguously positive about Disney.
    A positive sentiment that applies to a non-Disney tweet is not p but u. An example
    is the n tweet clearly negative intent towards Disney. Examples include that all
    other tweets are u.


    +   - Examples in the annotation standard do the best job of communicating intent.
    Humans do a better job with examples rather than descriptions in your experience.


    6. Create your collection of unannotated data. The best practice here is for the
    data to be random from the expected source, say 10 percent or more, but use binary
    classifiers that occur at a rate of 1/2,000,000 for question-answering systems.
    For rare categories, you can use a search engine to find instances of the category—for
    example, search for luv to find positive tweets. Alternatively, you can use a
    classifier trained on a few examples, run it on data, and look at the high-scoring
    positives—we covered in the previous recipe:


    ![](img/83ff609b4222b256508d150d8823f9d6_149_0.png)'
