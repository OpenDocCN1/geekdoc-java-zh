    2. This class will then produce the confusion matrix:

    reference\response

    \e,n,

    e 11,0,

    n 1,9,


    The confusion matrix is aptly noticed since it confuses almost everyone initially,
    but it is,

    without a doubt, the best representation of classifier output, because it is very
    difficult to

    hide classifier performance with it. In other words, it is an excellent BS detector.
    It is the

    unambiguous view of what the classifier got right, what it got wrong, and what
    it thought was

    the answer.


    The sum of each row represents the items that are known by truth/reference/gold
    standard

    to belong to the category. For English (e) there were 11 tweets. Each column represents

    the system thought was in the same labeled category. For English (e), the system
    thought 11

    tweets were English and none were non-English (n). For the non-English category
    (n), there

    are 10 cases in truth, of which the classifier thought 1 was English (incorrectly)
    and 9

    non-English (correctly). Perfect system performance will have zeros in all the
    cells that are not

    located diagonally, from the top-left corner to the bottom-right corner.


    The real reason it is called a confusion matrix is that it is relatively easy
    to see categories

    the classifier is confusing. For example, British English and American English
    would likely be

    high confusing. Also, confusion matrices scale to multiple categories quite nicely,
    and will be

    seen later. Visit the Javadoc for a more detailed explanation of the confusion
    matrix–it is well

    worth mastering.'
