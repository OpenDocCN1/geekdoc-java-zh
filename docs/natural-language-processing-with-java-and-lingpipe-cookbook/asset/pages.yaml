  md: '# Simple Classifiers


    # Getting ready


    In the previous recipe, we blithely deserialized to BaseClassifier<String> that
    hid all the details of what was going on. The reality is a bit more complex than
    suggested by the hazy abstract. Note that the file on disk that was loaded is
    named 3LangIdLMClassifier. By convention, we name serialized models with the type
    of object it will deserialize to, in this case, is LMClassifier, and it extends
    BaseClassifier.

    The most specific type for the classifier is:


    ```

    LMClassifier<CompiledNGramBoundaryLM,

    MultivariateDistribution> classifier

    = (LMClassifier <CompiledNGramBoundaryLM,

    MultivariateDistribution>) AbstractExternalizable.readObject(new

    File (args[0]));

    ```


    The cast to LMClassifier<CompiledNGramBoundaryLM,\MultivariateDistribution> specifies
    the type of distribution to be

    MultivariateDistribution. The Javadoc for com.alias.stats.

    MultivariateDistribution is quite explicit and helpful in describing this is.


    > MultivariateDistribution implements a discrete

    distribution over a finite set of outcomes, numbered

    consecutively from zero.


    The Javadoc goes into a lot of detail about MultivariateDistribution, but basically
    means that we have an n-way assignment of probabilities that sum to 1.


    The next class in the cast is for CompiledNGramBoundaryLM, which is the "memory"
    of

    t LMClassifier. In fact, each language gets its own. This means English will be
    a

    separate language model from Spanish and so on. There are eight kinds of language

    models that could have been used as part of this classifier--consult the Javadoc
    for the

    LanguageModel interface. Each language model (LM) has the following properties:


    +   - The LM will provide a probability that it generated the text provided. It
    is robust

    against data that it has not seen before, in the sense that it won''t crash or
    give

    a zero probability. Arabic just comes across as a sequence of unknown characters

    for our example.


    +   - The sum of all the possible character sequence probabilities of any length
    is 1

    for boundary LMs. Process LMs sum the probability to 1 all sequences of the

    same length. Look at the Javadoc for how this bit of math is done.


    +   - Each language model has no knowledge of data outside of the category.'
