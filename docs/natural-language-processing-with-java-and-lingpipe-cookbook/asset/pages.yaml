    # Single-link and link-link clustering using edit distance


    Clustering is the process of grouping a collection of objects by their similarities,
    that is, using

    some sort of distance measure. The idea behind clustering is that objects within
    a cluster are

    located close to each other, but objects in different clusters are farther away
    from each other.

    We can divide clustering techniques broadly into hierarchical (or agglomerative)
    and

    divisional techniques. Hierarchical techniques start by assuming that every object
    is its own

    cluster and merge clusters together until a stopping criterion has been met.


    ![](img/83ff609b4222b256508d150d8823f9d6_255_0.png)'
  merge: -1
  pgno: 255
- img_proc: true
  md: '# String Comparison and Clustering


    For example, a stopping criterion can be a fixed distance between every cluster.
    Divisional techniques go the other way by grouping all the objects into one cluster
    and split it until a stopping criterion has been met, such as the number of clusters.


    We will review hierarchical techniques in the next few recipes. The two clustering
    implementations we will provide in LingPipe are single-link clustering and complete-link
    clustering; the resulting clusters form what is known as a partition of the input
    set. A set of sets is a partition of another set if each element of the set is
    a member of exactly one set of the partition. In mathematical terms, the sets
    that make up a partition are pair-wise disjoint, and the union is the original
    set.


    A cluster takes a set of objects as input and returns a set of objects as output,
    that is, in code, `Clusterer` has a cluster method, which operates on `Set<String>`
    and returns `Set<Set<String>>`.


    A hierarchical cluster extracts the `Clusterer` interface and operates on a set
    of objects, but it returns `Dendrogram` instead of a set of objects. A dendrogram
    is a binary tree over the elements being clustered, with distances attached to
    each branch, which indicates the distance between the two sub-branches. For the
    aa, aaa, aaaa, bbb, bbbb strings, the single-link based dendrogram with `EditDistance`
    as the metric looks like this:


    ```

    3.0

    2.0


    1.0


    aaa

    aaa


    aaaa


    1.0


    bbbb

    bbb

    ```


    The preceding dendrogram is based on single-link clustering, which takes the minimum
    distance between any two elements as the measure of similarity. So, when {''aa'',
    ''aaa''} is merged with {''aaaa''}, the score is 2.0 by adding two to a. Complete-link
    clustering takes the maximum distance between any two elements, which would be
    3.0, with an addition of three to aa. Single-link clustering tends to create highly
    separated clusters, whereas complete-link clustering tends to create more tightly
    clustered clusters.


    There are two ways to extract clusters from dendrograms. The simplest way is to
    set a distance bound and maintain every cluster formed less than or equal to this
    bound. The other way to construct a clustering is to continue cutting the highest
    distance cluster until a specified number of clusters is obtained.


    In this example, we will look at single-link and complete-link clustering with
    edit distance as the distance metric. We will try to cluster city names by `EditDistance`,
    where the maximum distance is 4.'
