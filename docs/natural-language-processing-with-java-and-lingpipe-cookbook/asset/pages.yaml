  md: 'The probability of the tokens themselves, that is, p (tokens), the denominator
    in the preceding equation. This is just the sum of their probability in each category
    weighted by the probability of the category itself:


    ```

    p (tokens) = p(tokens|cat1) * p(cat1) + p(tokens|cat2)

    * p(cat2) + ... + p(tokens|catN) * p(catN)

    ```


    When building a naïve Bayes classifier, p (tokens) doesn''t need to be explicitly
    calculated. Instead, we can use p (tokens|cat) * p (cat) and assign the tokens
    to the category with the higher product.


    +   3. Now that we have laid out each element of our equation, we can look at
    these probabilities are calculated. We can calculate both these probabilities
    using simple frequencies.


    The probability of a category is calculated by counting the number of times the
    category showed up in the training instances divided by the total number of training
    instances. We know that Bayes classifiers have exhaustive and mutually-exclusive
    categories, the sum of the frequency of each category must equal the total number
    of training instances:


    ```

    p (cat) = frequency(cat) / (frequency(cat1) +

    frequency(cat2) + ... + frequency(catN))

    ```


    The probability of a token in a category is computed by counting the number of
    times the token appeared in a category divided by the number of times all the
    other tokens appeared in this category:


    ```

    p (token|cat) = frequency(token,cat)/frequency(token1,cat)

    + frequency(token2,cat) + ... + frequency(tokenN,cat)

    ```


    These probabilities are calculated to provide what is called the maximum likelihood
    estimate of our model. Unfortunately, these estimates provide zero probability
    for tokens that were not seen during the training. You can see this easily in
    the calculation of an unseen token. Since it wasn''t seen, it will have a frequency
    count of 0, and the numerator of our original equation goes to 0.


    In order to overcome this, we will use a technique known as smoothing that assigns
    a prior and computes a maximum posteriori rather than a maximum likelihood estimate.
    A common smoothing technique is called additive smoothing. Two sets of counts
    are added: the first is a token count added to all the token frequency calculations,
    and the second is a category count, which is added to all the category count calculations.'
