  md: "# Simple Classifiers\n\n# See also\n\nThe Javadoc for LingPipe's classifiers\
    \ are quite extensive on the underlying math that drives the technology.\n\n#\
    \ How to train and evaluate with cross validation\n\nThe earlier recipes have\
    \ shown how to evaluate classifiers with truth data and how to train with truth\
    \ data but how about doing both? This great idea is called cross validation, and\
    \ it works as follows:\n\n+   - Split the data into n distinct sets or folds—the\
    \ standard n is 10.\n- For i from 1 to n:\n    - Train on the n - 1 folds defined\
    \ by the exclusion of fold i\n    - Evaluate on fold i\n- Report the evaluation\
    \ results across all folds i.\n\nThis is how most machine-learning systems are\
    \ tuned for performance. The work flow is as follows:\n\n+   - See what the cross\
    \ validation performs.\n- Look at the error as determined by an evaluation metric.\n\
    - Look at the actual errors–yes, the data–for insights into how the system can\
    \ be improved.\n- Make some changes\n- Evaluate it again.\n\nCross validation\
    \ is an excellent way to compare different approaches to a problem, try different\
    \ classifiers, motivate normalization approaches, explore feature enhancements,\
    \ and so on. Generally, a system configuration that shows increased performance\
    \ on cross validation will also show increased performance on new data. What cross\
    \ validation does not, particularly with active learning strategies discussed\
    \ later, is reliably predict performance on new data. Always apply the classifier\
    \ to new data before releasing producing systems as a final sanity check. You\
    \ have been warned.\n\nCross validation also imposes a negative bias compared\
    \ to a classifier trained on all possible training data, because each fold is\
    \ a slightly weaker classifier, in that it has only 90 percent of the data on\
    \ 10 folds.\n\nRinse, lather, and repeat is the mantra of building state-of-the-art\
    \ NLP systems."
