  md: '# Advanced Classifiers


    The `classify()` method just does a lookup into Map and returns the value if there
    is one, otherwise, we will get the category `n` as the return classification.


    What is good about the preceding code is that you have a minimalist example of
    a BaseClassifier implementation, and you can see how the `handle()` method adds
    data to the classifier.


    What is bad about the preceding code is the utter rigidity of the mapping from
    training data to categories. If the exact example is not seen in training, then
    the `n` category is assumed.


    This is an extreme example of overfitting, but it essentially conveys what it
    means to have an overfit model. An overfit model is tailored too close to the
    training data and cannot generalize well to new data.


    Let''s think a bit more about what is so wrong about the preceding classifier
    for language identification—the issue is that sentences/tweets are the wrong unit
    of processing. Words/tokens are a much better measure of what language is being
    used. Some improvements that will be better in the later recipes:


    +   Break the text into words/tokens.


    +   Instead of a match/no-decision, consider a more nuanced approach. A simple
    which language matches more words would be a huge improvement.


    +   As languages get closer, British versus American English, probabilities can
    be called for that. Pay attention to likely discriminating words.


    While this recipe might be comically inappropriate for the task at hand, consider
    trying a sentiment for even more ludicrous. It embodies a core assumption of much
    of computer science that the world of inputs is discrete and finite. Machine learning
    can be viewed as a response to a world where this is not the case.


    # There''s more...


    Oddly enough, we often have a need for such a classifier in commercial systems—we
    call it management classifier; it runs preemptively on data. It has happened that
    a senior VP is unhappy with the system output for some example. This classifier
    can be trained with the exact case that allows for immediate system fixing and
    satisfaction of the VP.


    # Language model classifier with tokens


    Chapter 1, Simple Classifiers, covered classification without knowing what tokens/words
    were, with a language model per category—we used characters or ngrams to model
    the text. Chapter 2, Finding and Working with Words, discussed at length the process
    of finding tokens in text, and now we can use them to build a classifier. Most
    of the time, we use tokenized input to classifiers, so this recipe is an important
    introduction to the concept.'
