    +   3. The shared ID between He and John Smith indicates the coreference between
    the two. More examples will follow, with comments. Note that each input is considered
    a distinct separate with ID spaces.


    +   4. If pronouns are not resolved to a named entity, they get the index -1 as
    shown here:


    ```

