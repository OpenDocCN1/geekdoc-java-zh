  md: '# Advanced Classifiers


    The reason the word naïve used is that the classifier assumes that words (features)
    occur independent of one another—this is clearly a naïve assumption, but lots
    of useful and not-so-useful technologies have been based on the approach. Some
    notable features of the traditional naïve Bayes include:


    +   - Character sequences are converted to bags of tokens with counts. No whitespaces
    are considered, and the order of the tokens does not matter.


    +   - Naive Bayes classifiers require two or more categories into which input
    texts are categorized. These categories must be both exhaustive and mutually exclusive.
    This indicates that a document used for training must only belong to one category.


    +   - The math is very simple: p(category|tokens) = p(category, tokens) / p(tokens).


    +   - The class is configurable for various kinds of unknown token models.


    A naïve Bayes classifier estimates two things. First, it estimates the probability
    of each category, independent of any tokens. This is carried out based on the
    number of training examples presented for each category. Second, for each category,
    it estimates the probability of seeing each token in that category. Naive Bayes
    is so useful and important that we will show you exactly how it works and plug
    through the formulas. The example we have to classify hot and cold weather based
    on the text.


    First, we will work out the math to calculate the probability of a category given
    a word sequence. We will plug in an example and then verify it using the classifier
    we build.


    # Getting ready


    Let''s lay out the basic formula to calculate the probability of a category given
    a text input. A token-based naïve Bayes classifier computes the joint token count
    and category probabilities as:


    ```

    p(tokens,cat) = p(tokens|cat) * p(cat)

    ```


    +   - Conditional probabilities are derived by applying Bayes''s rule to invert
    the probability calculation:


    ```

    p(cat|tokens) = p(tokens,cat) / p(tokens)

    p(tokens|cat) * p(cat) / p(tokens)

    ```


    +   - Now, we get to expand all these terms. If we look at p(tokens|cat), this
    is where the naïve assumption comes into play. We assume that each token is independent,
    and thus, the probability of all tokens is the product of the probability of each
    token:


    ```

