  md: '# Chapter 5


    First, let''s look at the code running in the background. IndoEuropeanSentenceModel
    extends HeuristicSentenceModel by configuring several categories of tokens from
    the Javadoc for HeuristicSentenceModel:


    +   - Possible stops: These are tokens that are allowed to be the final ones in
    a sentence. This set typically includes sentence-final punctuation tokens


    IndoEuropeanSentenceModel is not configurable, by the Javadoc, it is clear that
    all single characters are considered impossible pen ultimates. The words people''s
    is tokenized into people, ''s and .. The single character s is penultimate to
    the . and is blocked.


    A few options present themselves:


    +   - Ignore the mistake assumption that it won''t happen frequently

    - Fix by creating a custom sentence model

    - Fix by modifying the tokenizer to not separate apostrophes

    - Write a complete sentence-detection model for the interface


    The second option, create a custom sentence model, is handled most easily by copying
    the source from IndoEuropeanSentenceModel into a new class and modifying it, as
    the relevant data structures are private. This is done to simplify the serialization
    of the class—very little configuration needs to be written to. In the example
    classes, there is a MySentenceModel.java file that differs by changes in the package
    name and imports:


    ```

    IMPOSSIBLE_PENULTIMATES.add("R");

    //IMPOSSIBLE_PENULTIMATES.add("S"); breaks on "people''s."

    //IMPOSSIBLE_PENULTIMATES.add("T"); breaks on "didn''t."

    imPOSSIBLE_PENULTIMATES.add("U");

    ```


    The preceding code just comments out of the two likely single-letter cases of
    penultimate tokens that are a single-word character. To see it at, change the
    sentence model to SentenceModel sentenceModel = new MySentenceModel(); in the
    EvaluateAnnotatedSentences.java class and recompile and run it.


