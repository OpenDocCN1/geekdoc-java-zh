    \n# The Jaccard distance\n\nThe Jaccard distance is a very popular and efficient\
    \ way of comparing strings. The Jaccard distance operates at a token level and\
    \ compares two strings by first tokenizing them and dividing the number of common\
    \ tokens by the total number of tokens. In the Eliminate near duplicates with\
    \ the Jaccard distance recipe in Chapter 1, Simple Classifiers, we applied the\
    \ distance to eliminate near-duplicate tweets. This recipe will go into a bit\
    \ more detail and show how it is computed."
