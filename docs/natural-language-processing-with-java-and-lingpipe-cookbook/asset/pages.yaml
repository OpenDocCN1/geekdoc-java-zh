    # Dictionary-based chunking for NER


    In many websites and blogs and certainly on web forums, you might see keyword
    highlighting that links pages you can buy a product from. Similarly, news websites
    also provide topic pages for people, places, and trending events, such as the
    one at http://www.nytimes.com/pages/topics/


    A lot of this is fully automated and easy to do with a dictionary-based Chunker.
    It is straightforward to compile lists of names for entities and their types.
    An dictionary chunker extracts chunks based on matches of tokenized dictionary
    entries.


    The implementation of the dictionary-based chunker in LingPipe is based on the
    Aho-Corasick algorithm which finds matches against a dictionary in linear time
    independent of the number of matches or size of dictionary. This makes it much
    more efficient than the naive approach of doing substring searches or using regular
    expressions.


    # How to do it...


    +   1. In the IDE of your choice run the DictionaryChunker class in the chapter5
    package or type the following using command line:

    java -cp lingpipe-cookbook.1.0.jar:lib/lingpipe-4.1.0.jar com.lingpipe.cookbook.chapter5.DictionaryChunker


