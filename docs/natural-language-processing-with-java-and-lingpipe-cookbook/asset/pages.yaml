  md: "# Advanced Classifiers\n\n# Picking a single metric to optimize against\n\n\
    Perform the following steps:\n\n+   While the confusion matrix establishes the\
    \ overall performance of the classifier, it is too complex to use as a tuning\
    \ guide. You don't want to have to digest the entire matrix every time you adjust\
    \ a feature. You and your team must agree on a single number that, if it goes\
    \ up, the system is considered better. The metrics apply to binary classifiers;\
    \ if there are more than two categories, then you will have to sum them up. Some\
    \ common metrics we see:\n    - **F-measure:** F-measure is an attempt to reward\
    \ reductions in false negatives and false positives at the same time\n      `F-measure\
    \ = 2*TP / (2*TP + FN)`\n      It is mainly an academic measure to declare that\
    \ one system is better than another. It sees little in industry.\n    - **Recall\
    \ at 90 percent recall:** The goal is to provide as much coverage as possible\
    \ without making more than 10 percent false positives. This is when the system\
    \ does not want to look bad often; this applies to spell checkers, question answering\
    \ systems, and sentiment dashboards.\n    - **Precision at 99.9 percent recall:**\
    \ This metric supports needle in the haystack or needle in the stack kind of problems.\
    \ The user cannot afford to miss anything and is willing to perhaps through lots\
    \ of false positives as long as they don't miss anything. The system is better\
    \ if the false positive rate is lower. Use cases are intelligence analysts and\
    \ medical researchers.\n\n+   Determining this metric comes from a mixture of\
    \ business/research needs, technical capability, available resources, and willpower.\
    \ If a customer wants a high recall and high-precision system, our first question\
    \ will be to ask what the budget is per document. If it is high enough, we will\
    \ suggest hints to correct system output, which is the best combination of what\
    \ computers are good at (exhaustiveness) and what humans are good at (discrimination).\
    \ Generally budgets do not support this, so the balancing act begins, we have\
    \ deployed systems in just this way.\n    For this recipe, we will pick a maximizing\
    \ recall for 50-percent precision for n (negative), because we want to be intercept\
    \ any negative sentiment and tolerate false positives. We will choose 65 percent\
    \ for a ρ sentiment, because the good news is less actionable, and who doesn't\
    \ know Disney? because we don't care what (other performance) is—the category\
    \ exists for linguistic reasons, independent of the business use. This metric\
    \ likely metric for a sentiment-dashboard application. This means that the system\
    \ will produce one mistake for every two guesses of a negative-sentiment category\
    \ and 13 out of 20 for positive sentiment.\n\n![](img/83ff609b4222b256508d150d8823f9d6_122_0.png)"
