  md: "# Evaluating tokens tokens with unit tests\n\nWe will not evaluate Indo-European\
    \ tokens like LingPipe with measures such as precision and recall. Instead, we\
    \ will develop them with unit tests, because others are heuristically constructed\
    \ and expected to perform perfectly on example data—if a tokenizer fails to tokenize\
    \ a known case, then it is a bug, not a reduction in performance. Why this? There\
    \ are a few reasons:\n\n+   - Many tokens are very \"mechanistic\" and are amenable\
    \ to the rigidity of the unit test framework. For example, the RegTokenizerFactory\
    \ is obviously a candidate to test rather than an evaluation harness.\n- The heuristic\
    \ rules that drive most tokenizers are general, and there is no issue of over-fitting\
    \ data at the expense of a deployed system. If you have a known bad case, you\
    \ can just go and fix the tokenizer and add a test.\n- Tokens and white spaces\
    \ are assumed to be semantically neutral, which means that tokens don't change\
    \ depending on context. This is not totally true with the Indo-European tokenizer,\
    \ because it differently if it is part of a decimal or at the end of a sentence,\
    \ for example, 3.14 is pi:\n\n```\nToken:'3.14'\nWhitespace: ' '\nToken:'is'\n\
    Whitespace: ' '\nToken:'pi'\nWhitespace: ' '\nToken:'.\nWhitespace: ' '.'\n```\n\
    \nIt might be appropriate to use an evaluation metric for statistics-based tokenizers;\
    \ this is discussed in the Finding words for languages without white spaces recipe\
    \ in this chapter. See the Evaluation of sentence detection recipe in Chapter\
    \ 5, Finding Spans in Text - Chunking, for appropriate span-based evaluation techniques.\n\
