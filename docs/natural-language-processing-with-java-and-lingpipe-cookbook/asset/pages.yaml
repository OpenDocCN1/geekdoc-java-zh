  md: "# Chapter 7\n\nThe MALE_EN_PRONOUNS constant is a regular expression, Pattern:\n\
    \n```\nstatic Pattern MALE_EN_PRONOUNS = Pattern.compile(\"\\\\b(he|He|Him|him)\\\
    \\\b\");\n```\n\nThe following lines of code show the addRegExMatchingChunks subroutine.\
    \ It adds chunks based on regular expression matches and avoids the overlapping,\
    \ existing HMM-derived chunks:\n\n```\nstatic void addRegExMatchingChunks(Pattern\
    \ pattern, String type,\nString text, Set<Chunk> chunkSet) {\n\njava.util.regex.Matcher\
    \ matcher = pattern.matcher(text);\n\nwhile (matcher.find()) {\nChunk regexChunk\n\
    = ChunkFactory.createChunk(matcher.start(),\nmatcher.end(),\ntype);\nfor (Chunk\
    \ chunk : chunkSet) {\nif (ChunkingImpl.overlap(chunk,regexChunk)) {\nchunkSet.remove(chunk);\n\
    }\n}\nchunkSet.add(regexChunk);\n}\n```\n\nThe complex bit is that the type for\
    \ the MALE_PRONOUN and FEMALE_PRONOUN pronouns will be used to match against PERSON\
    \ entities, with the consequence that the resolution sets the gender of the resolved-entity.\n\
    \nOther than that, the code should look very familiar with our standard I/O loop\
    \ running the interaction in the command prompt.\n\n# See also\n\nThe algorithm\
