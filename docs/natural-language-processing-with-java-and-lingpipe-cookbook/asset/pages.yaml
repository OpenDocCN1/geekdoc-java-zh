  md: '# Preface


    Welcome to the book you will want to have by your side when you cross the door
    of a new consulting gig or take on a new Natural Language Processing (NLP) problem.
    This book starts as a private repository of LingPipe recipes that Baldwin continually
    referred to when facing repeated but twitchy NLP problems with system building.
    We are an open source company but the code never merited sharing. They are shared.


    Honestly, the LingPipe API is an intimidating and opaque edifice to code against
    any rich and complex Java API. Add in the "black arts" quality needed to get NLP
    systems working and we have the perfect conditions to satisfy the recipe book
    that minimizes theory and maximizes the practicality of getting the job done with
    best practices sprinkled in 20 years in the business.


    This book is about getting the job done; damn the theory! Take this book and build
    the next generation of NLP systems and send us a note about what you did.


    LingPipe is the best tool on the planet to build NLP systems with; this book is
    the way to use it.


    # What this book covers


    Chapter 1, Simple Classifiers, explains that a huge percentage of NLP problems
    are actually classification problems. This book covers very simple but powerful
    classifiers based on character sequences and brings in evaluation techniques such
    as cross-validation and metrics such as precision, recall, and the always-BS-resistant
    confusion matrix. You get to train yourself on your own download data from Twitter.
    The chapter ends with a simple sentiment example.


    Chapter 2, Finding and Working with Words, is exactly as boring it sounds but
    there are some high points. The last recipe will show you how to tokenize Chinese/Japanese/Vietnamese
    languages, which doesn''t have whitespaces, to help define words. We will show
    you how to wrap Lucene tokenizers, which cover all of fund languages such as Arabic.
    Almost everything later in the book relies on tokenization.'
  merge: -1
  pgno: 13
- img_proc: true
  md: '# Preface


    Chapter 3, Advanced Classifiers, introduces the star of modern NLP systems—logistic
    regression classifiers. 20 years of hard-won experience lurks in this chapter.
    We will address the life cycle around building classifiers and how to create training
    data, cheat when training data with active learning, and how to tune and make
    the classifiers faster.


    Chapter 4, Tagging Words and Tokens, explains that language is about words. This
    chapter focuses on ways of applying categories to tokens, which in turn drives
    many of the high-end uses of LingPipe such as entity detection (people/places/orgs
    in text), part-of-speech tagging, and more. It starts with tag clouds, which have
    been described as “mullet of the Internet” and ends with a foundational recipe
    for random fields (CRF), which can provide state-of-the-art performance for entity-detection.
    In between, we will address confidence-tagged words, which is likely to be a very
    important dimension of sophisticated systems.


    Chapter 5, Finding Spans in Text – Chunking, shows that text is not alone. It
    is collections of words, usually in spans. This chapter will advance from word
    tagging to span tagging, which brings in capabilities such as finding sentences,
    named entities, and basal NPs and VPs. The full power of CRFs are addressed with
    discussions on feature extraction and tuning. Dichotomy approaches are discussed
    as they are ways of combining chunkings.


    Chapter 6, String Comparison and Clustering, focuses on comparing text with each
    other, independent of a trained classifier. The technologies range from hugely
    practical spellchecking to the hopeful but frustrating Latent Dirichlet Allocation
    (LDA) clustering approach. Less presumptive technologies such as single-link and
    complete-link clustering have driven major commercial successes for us. Don''t
    ignore this chapter.


    Chapter 7, Coreference Between Concepts/People, lays the future but unfortunately,
    you won''t get the ultimate recipe, just our best efforts so far. This is one
    of the bleeding edges of industrial and academic NLP efforts that has tremendous
    potential. Why is it we include our efforts to help grease the way to see this
    technology in use.


    # What you need for this book


    You need some NLP problems and a solid foundation in Java, a computer, and a developer-savvy
    approach.


    # Who this book is for


    If you have NLP problems or want to educate yourself in comment NLP issues, this
    book is for you. With some creativity, you can train yourself into being a solid
    NLP developer, a beast so rare that they are never seen as often as unicorns,
    with the result of most interesting job prospects in hot technology areas such
    as Silicon Valley or New York City.'
  merge: -1
