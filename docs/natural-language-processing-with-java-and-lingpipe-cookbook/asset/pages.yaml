    \        String tag = tagScores.category(i);\n        System.out.printf(\"%9.3f:\"\
    \ + pad(tag,4),conditionalProb);\n    }\n    System.out.println();\n}\n```\n\n\
    The method demonstrates the underlying lattice of tokens to the probabilities\
    \ explicitly, which is at the heart of the HMM. Change the termination condition\
    \ on the for loop to see more or fewer tags.\n\n# Training word tagging\n\nWord\
    \ tagging gets much more interesting when you can create your models. The realm\
    \ of annotating part-of-speech tagging corpora is a bit too much for a mere recipe\
    \ book—annotation of the part-of-speech data is very difficult it requires considerable\
    \ linguistic knowledge to do well. This recipe will directly address the machine-learning\
    \ component of the HMM-based sentence detector.\n\nAs this is a recipe book, we\
    \ will minimally explain what an HMM is. The token language models that we have\
    \ been working with do their previous calculations on some of words/tokens that\
    \ precede the current word being estimated. HMMs take into account some of the\
    \ previous tags while calculating estimates for the current token's tag. This\
    \ allows for seemingly disparate neighbors such as of and in to be similar, because\
    \ they are propositions.\n\nIn the Sentence detection recipe, from Chapter 5,\
    \ Finding Spans in Text - Chunking, a useful but not very flexible sentence detector\
    \ is based on the HeuristicSentenceModel in LingPipe. Rather than mucking about\
    \ modifying/extending the HeuristicSentenceModel, we will build a machine-learning-based\
    \ system with the data that we annotate."
