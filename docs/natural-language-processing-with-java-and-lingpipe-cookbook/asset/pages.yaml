  md: "# Advanced Classifiers\n\nThe addInterceptFeature Boolean controls whether\
    \ a category feature exists that models the prevalence of the category in training.\
    \ The default name of the intercept feature is *&INTERCEPT$^*, and you will see\
    \ it in the weight vector output if it is being used. By convention, the intercept\
    \ feature is set to 1.0 for all. The idea is that if a category is very common\
    \ or very rare, there should be a feature that captures this fact, independent\
    \ of other features that might not be as cleanly distributed. This models the\
    \ category probability in naive Bayes Bakes in some way, but the logistic regression\
    \ algorithm will decide how useful it is in with all the other features:\n\n```\n\
    boolean addInterceptFeature = true;\nboolean noninformativeIntercept = true;\n\
    ```\n\nThese Booleans control what happens to the intercept feature if it is used.\
    \ Priors, in the following code, are typically not applied to the intercept feature;\
    \ this is the result if the parameter is true. Set the Boolean to false, and the\
    \ prior will be applied to the intercept.\n\nNext is the RegressionPrior instance,\
    \ which controls how the model is fit. What you need to know is which priors prevent\
    \ logistic regression from overfitting the data by pushing coefficients towards\
    \ zero. There is a non-informative prior that does not do this with the consequence\
    \ that if there is a feature that applies to just one category it will be scaled\
    \ to infinity, because the model fits better as the coefficient is increased in\
    \ the numeric estimation. Priors, in this context, function as a way to not be\
    \ over confident in observations around the world.\n\nAnother dimension in the\
    \ RegressionPrior instance is the expected variance of the features. Low variance\
    \ will push coefficients to zero more aggressively. The prior returned by the\
    \ static lap method tends to work well for NLP problems. For more information\
    \ on what is going on here, consult the relevant Javadoc and the logistic regression\
    \ tutorial referenced at the beginning of the recipe—there is a lot going on,\
    \ but it can be managed without a deep theoretical understanding. \n\n```\ndouble\
    \ priorVariance = 2;\nRegressionPrior prior\n= RegressionPrior.laplace(priorVariance,\n\
