  md: '# Finding and Working with Words


    Read the Javadoc with LingPipe; it has a lot of useful information that we don''t
    have space for in this book.


    So far we configured and constructed a TrainSpellChecker class. The next step
    is to naturally train it:


    ```

    File trainingFile = new File(args[0]);

    String training = Files.readFile(trainingFile, Strings.UTF-8);

    training = training.replaceAll("\s+", " ");

    trainer.handle(training);

    ```


    We slurped a text file, which is UTF-8; if not, correct the character encoding
    and recompile. Then, we replaced all multiple white spaces with a single one.
    This might not be the best move if multiple white spaces have meaning. This is
    followed by training, like we trained language models in Chapter 1, Simple Classifiers.


    Next we will compile and configure the spell checker:


    ```

    System.out.println("Compiling Spell Checker");

    CompiledSpellChecker spellChecker = (CompiledSpellChecker)

    AbstractExternalizable.compile(trainer);

    nspellChecker.setAllowInsert(true);

    spellChecker.setAllowMatch(true);

    spellChecker.setAllowDelete(false);

    spellChecker.setAllowSubstitute(false);

    spellChecker.setAllowTranspose(false);

    spellChecker.setNumConsecutiveInsertionsAllowed(1);

    ```


    The next interesting line compiles spellChecker, which translates the counts in
    the underlying language model to precomputed probabilities, which is much faster.
    The compilation step can write to a disk, so it can be used without training;
    however, visit the Javadoc for AbstractExternalizable on how to do this. The next
    lines configure CompiledSpellChecker to only consider the edits that insert characters
    and to check for the exact string matches, but it forbids deletions, substitutions,
    and transpositions. Finally, only one insert is allowed. It should be clear that
    we are using a very limited portion of the capabilities of CompiledSpellChecker,
    but this is exactly what is called for-insert a space or doesn''t.'
