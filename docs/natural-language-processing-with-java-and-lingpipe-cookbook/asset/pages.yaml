  md: "# Candidate-edge features\n\nCRFs allow random features to be applied, so the\
    \ question is what features make sense to use. Edge features are used in conjunction\
    \ with node features, so another issue is whether a feature should be applied\
    \ to edges or nodes. Edge features will be used to reason about relationships\
    \ between the current word/token to those around it. Some edge features are:\n\
    \n+   - The shape (all caps, starts with a number, and so on) of the previous\
    \ token as done earlier.\n- Recognition of iambic pentameter that requires a correct\
    \ ordering of stressed and unstressed syllables. This will require a syllable-stress\
    \ tokenizer as well.\n- It often has tokens that contain one or more languages—this\
    \ is called code switching. It is a common occurrence in texts. A reasonable edge\
    \ feature will be the language of surrounding tokens; this language will better\
    \ model what the next word is likely to be of the same language as the previous\
    \ word.\n\n# Node features\n\nThe node features tend to be where the action is\
    \ in CRFs, and they can get very rich. The Named entity recognition with CRFs\
    \ with better features in Chapter 5, Finding Spans in Text - Chunking, is an example.\
    \ We will add part-of-speech tags in this recipe to the token features of the\
    \ previous recipe:\n\n```\npublic Map<String, ? extends Number> nodeFeatures(int\
    \ n) {\n    ObjectToDoubleMap<String> features\n        = new ObjectToDoubleMap<String>();\\\
    n    features.set(\"TOK_\" + token(n), 1);\n    ConditionalClassificationLattice\
    \ tagScores = tokenClassification(n);\n    for (int i = 0; i < 3; i++) {\n   \
    \     double conditionalProb = tagScores.score(i);\n        String tag = tagScores.category(i);\n\
    \        features.increment(tag, conditionalProb);\n    }\n    return features;\n\
    }\n```\n\nAs in the previous recipe the token feature is added with:\nfeatures.set(\"\
    TOK_\" + token(n), 1);\n\nThis results in the token being represented with TOK_\
    \ and a count of 1. Note that while tag(n) is available in training, it doesn't\
    \ make sense to use this information, as that the CRF is trying to predict."
