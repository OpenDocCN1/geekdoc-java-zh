  md: "# Advanced Classifiers\n\n# How it works\n\nThe goal is to create a classifier\
    \ that will assign p to a tweet if it scores above .525 for that category and\
    \ n scores above .549 for that category; otherwise, it gets o. Wrong... management\
    \ saw the p/n curve and now insists that p must be 80-percent precise, which means\
    \ that the threshold will be .76.\n\nThe solution is very simple. If a score for\
    \ p is .76, then it will be scored down to 0.0. Likewise, if a score for n is\
    \ .54, then it will be scored down to 0.0. The effect of this is o will be the\
    \ best category for all-threshold cases, because .75 p can be at .25 n, which\
    \ remains below the n threshold, and .53 n can at most be .47 p, which is below\
    \ category's threshold. This can get complicated if all categories are thresholded,\
    \ or the thresholds are low.\n\nStepping back, we are taking a conditional classifier\
    \ where all the category scores sum to 1 and breaking this contract, because we\
    \ will estimate for p to be .76 and bust it down to 0.0. It is a similar story\
    \ for n. The resulting classifier will now have to be ScoredClassifier because\
    \ this is the next most specific contract in the LingPipe API that we uphold.\n\
    \nThe code for this is in src/linkpipe/cookbook/chapter3/ThresholdedClassifier.\
    \ At the top level, we have the class, relevant member variable, and constructor:\n\
    \n```\npublic class ThresholdedClassifier<E> implements\nScoredClassifier<E> {\n\
    \nConditionalClassifier<E> mNonThresholdedClassifier;\n\npublic ThresholdedClassifier(ConditionalClassifier<E>\
    \ classifier) {\n  mNonThresholdedClassifier = classifier;\n}\n```\n\nNext, we\
    \ will implement the only required method for ScoredClassification, and this is\
    \ where the magic happens:\n\n```\n@Override\npublic ScoredClassification classify(E\
    \ input) {\n  ConditionalClassification classification =\n    mNonThresholdedClassifier.classify(input);\n\
    \  List<ScoredObject> scores =\n    new ArrayList<ScoredObject>();\n  for (int\
    \ i = 0; i < classification.size(); ++i) {\n    String category = classification.category(i);\n\
    \    Double score = classification.score(i);\n    if (category.equals(\"p\") &&\
    \ score < .76) {\n```\n\n![](img/83ff609b4222b256508d150d8823f9d6_136_0.png)"
