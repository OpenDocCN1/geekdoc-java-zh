    # How it works...


    There is little novel data in the code in src/com/lingpipe/cookbook/

    chapter3/InterAnnotatorAgreement.java. One slight twist is that we used BaseClassifierEvaluator
    to do the evaluation without a classifier ever being specified—the creation is
