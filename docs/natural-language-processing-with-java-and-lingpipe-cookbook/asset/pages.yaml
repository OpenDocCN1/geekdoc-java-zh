  md: '# Finding Coreference Between Concepts/People


    4. There is a Boolean that controls whether speculative entities will be added.
    If this Boolean is true, it means we will update our universe of cross-document
    entities with the ones that have never seen before. It is a much tougher task
    to reliably compute with this set to true.


    5. All the mentioned configuration goes into creating a Tracker object.


    6. Then, the main() method reads in documents to process, hands them off to the
    Tracker object for processing, and writes them to disk. The major steps of the
    Tracker.processDocuments() method are as follows:


    +   1. Take a set of documents in the XML format and find the individual documents.


    +   2. For each document, apply the processDocument() method, which runs within-document
    coreference using the named-entity detector and returns MentionChain[]. Then,
    resolve the individual mentions'' chains against the entity universe to update
    document-level IDs to universe IDs. The last step is to write the document to
    disk with about RunCoreference;


    That is all that we will say about RunCore; there is nothing that you should be
    able to handle in the context of this book. In the following sections, we will
    address the individual components that RunTracker uses.


    # Setting up the entity universe


    The entity universe EntityUniverse.java, is an in-memory representation of the
    global entities mentioned in a document/database collection. The entity universe
    also contains various indexes into these entities, which support computing XDoc
    on individual documents.


    The dictionary seeds the EntityUniverse file with known entities, and the documents
    processed subsequently are sensitive to these entities. The XDoc algorithm tries
    to merge with existing entities, so the dictionary entries are strong attractors
    for mentions of these entities.


    Each entity consists of a unique long ID, a set of aliases partitioned into four
    separate lists and a type (person, location, and so on). Whether the entity is
    in the user-defined dictionary and whether speculative mentions are allowed to
    be added to the entity are also mentioned. The toString() method lists an entity:


    ```

    id=556 type=ORGANIZATION userDefined=true allowSpec=false user

    XDC=[Nokia Corp., Nominal] user non-XDC=[] spec XDC=[] spec non-XDC

    []

    ```'
