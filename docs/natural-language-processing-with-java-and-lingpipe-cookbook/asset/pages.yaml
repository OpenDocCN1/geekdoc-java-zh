    # Automatic phrase completion


    Automatic phrase completion is different from spelling correction, it finds the
    most likely completion among a set of fixed phrases for the text entered so far
    by a user.


    Obviously, automatic phrase completion is ubiquitous on the Web, for instance,
    https://google.com. For example, if I type anz as a query, Google pops up the
    following suggestions:


    ![](img/83ff609b4222b256508d150d8823f9d6_252_0.png)'
