  md: '# # Finding and Working with Words


    In this chapter, we cover the following recipes:


    +   - Introduction to tokenizer factories – finding words in a character stream

    - Combining tokenizers – lowercase tokenizer

    - Combining tokenizers – stop word tokenizers

    - Using Lucene/Sol tokenizers

    - Using Lucene/Sol tokenizers with LingPipe

    - Evaluating tokenizers with unit tests

    - Modifying tokenizer factories

    - Finding words for languages without white spaces


    # # Introduction


    An important part of building NLP systems is to work with the appropriate unit
    for processing. This chapter addresses the abstraction layer associated with the
    word level of processing. This is called tokenization, which amounts to grouping
    adjacent characters into meaningful chunks in support of classification, entity
    finding, and the rest of NLP.


    LingPipe provides a broad range of tokenizer needs, which are not covered in this
    book. Look at the Javadoc for tokenizers that do stemming, Soundex (tokens based
    on what English words sound like), and more.'
