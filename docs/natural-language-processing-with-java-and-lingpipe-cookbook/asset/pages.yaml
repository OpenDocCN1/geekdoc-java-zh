    # See also...


    +   For a detailed tutorial including details on evaluations, go over to http://alias.com/linpipe/demos/tutorial/cluster/read-me.html


    # Latent Dirichlet allocation (LDA) for multipitopic clustering


    Latent Dirichlet allocation (LDA) is a statistical technique to document clustering
    based on the tokens or words that are present in the document. Clustering such
    as classification generally assumes that categories are mutually exclusive. The
    neat thing about LDA is that it allows for documents to be in multiple topics
    at the same time, instead of just one category. This better reflects the fact
    that a tweet can be about Disney and Wally World, among other topics.


    The other neat about LDA, like many clustering techniques, is that it is unsupervised,
    which means that no supervised training data is required! The closest thing to
    training data is that the number of topics must be specified before hand.


    LDA can be a great way to explore a dataset where you don''t know what you know.
    It can be difficult to turn, but it does something interesting. Let''s get a system
    working.


    For each document, LDA assigns a probability of belonging to a topic based on
    the words in that document. We will start with documents that are converted to
    sequences of tokens. LDA uses the count of the tokens and does not care about
    the context or order in which these words appear. The model that LDA operates
    on for each document is called "a bag of words" to denote that the order is not
    important.'
