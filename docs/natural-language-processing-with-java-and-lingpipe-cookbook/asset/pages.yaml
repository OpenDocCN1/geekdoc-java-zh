  md: '# Conditional random fields (CRF) for word/token tagging


    **Conditional random fields (CRF)** are an extension of the Logistic regression
    recipe in Chapter 3, Advanced Classifiers, but are applied to word tagging. At
    the end of Chapter 1, Simple Classifiers, we discussed various ways to encode
    a problem into a classification problem. CRFs sequence the tagging problem as
    finding the best category where each category (C) is one of the C*T tag (T) assignments
    to tokens.


    For example, if we have the tokens The and rain and tag d for determiner and n
    for noun, then the set of categories for the CRF classifier are:


    +   * Category 1: d d

    * Category 2: n d

    * Category 3: n n

    * Category 4: d d


    Various optimizations are applied to keep this combinatoric nightmare computable,
    but this is the general idea. Crazy, but it works.


    Additionally, CRFs allow random features to be used in training the exact same
    way that logistic regression does for classification. Additionally, it has data
    structures optimized for HMM mile observations against context. Its use for part-speech
    tagging is not very exciting, because our current HMMs are pretty close to state
    of the art. CRFs really make a difference in use cases we like named entity detection
    which are covered in Chapter 5, Finding Spans in Text – Chunking, but we wanted
    to address the pure CRF implementation before complicating the practically with
    a chunky interface.


    There is an excellent detailed tutorial on CRFs at http://alias-i.com/lingpipe/demos/tutorial/crf/read-me.html;
    this recipe follows this tutorial fairly closely. You will find more information
    and proper references there.


    # How to do it...


    All of the technologies we have been presenting up to now were invented in the
    previous millennium; this is a technology from the new millennium. Perform the
    following steps:


    +   1. In the command line, type:


    ```

    java -cp lingpipe-cookbook.1.0.jar:lingpipe-4.1.0.jar: com.lingpipe.cookbook.chapter4CRFTagger

    ```


    +   2. The console continues with results that should be familiar from the Logistic
    regression recipe of Chapter 3, Advanced Classifiers, and we will get the standard
    command prompt:


    **Enter text followed by new line**

    >The rain in Spain falls mainly on the plain.'
