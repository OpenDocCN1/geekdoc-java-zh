  md: '# Chapter 2


    This recipe starts with the creation of TokenizerFactory tokFactory in the first
    statement of the main() method. Note that a singleton IndoEuropeanTokenizerFactory.INSTANCE
    is used. The factory will produce tokens for a given string, which is evident
    in the line, Token tokenizer = tokFactory.tokenizer(input.toCharArray(), 0, input.length()).
    The entered string is converted to a character array with input.toCharArray()
    as the first argument to the tokenizer method and start offsets provided into
    the created array.


    The resulting tokenizer provides tokens for the provided slice of character array,
    and the white spaces and tokens are printed out in the while loop. Calling the
    tokenizer.nextToken() does a few things:


    +   - The method returns the next token or null if there is no next token. The
    null then ends the loop; otherwise, the loop continues.


    +   - The method also increments the corresponding white space. There is always
    a white space with a token, but it might be the empty string.


    IndoEuropeanTokenizerFactory assumes a fairly standard abstraction over characters
    that break down as follows:


    +   - Characters from the beginning of the char array to the first token are ignored
    and not reported as white space


    +   - Characters from the end of the last token to the end of the char array are
    reported as the next white space


    +   - White spaces can be the empty string because of two adjoining tokens—note
    the apostrophe in the output and corresponding white spaces


    This means that it is not possible to reconstruct the original string necessarily
    if the input does start with a token. Frankly, tokenizers are easily modified
    for customized needs. We will see this later in the chapter.


    # There''s more...


    Tokenization can be arbitrarily complex. The LingPipe tokens are intended to cover
    most cases, but you might need to create your own tokenizer to have fine-grained
    control, for example, Victoria''s Secret with "Victoria''s" as the token. Consult
    the source for IndoEuropeanTokenizerFactory if such customization is needed, to
    see how arbitrary tokenization is done here.'
