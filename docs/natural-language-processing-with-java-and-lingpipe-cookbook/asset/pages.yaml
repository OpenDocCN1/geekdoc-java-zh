  md: '# Simple Classifiers


    +   - Enterprise/server optimized: LingPipe is designed from the ground up for
    server applications, not for command-line usage (though we will be using the command
    line extensively throughout the book).


    +   - Coded in the Java dialect: LingPipe is a native Java API that is designed
    according to standard Java class design principles (Joshua Bloch''s Effective
    Java, by Addison-Wesley), so consistency checks on construction, immutability,
    type safety, backward-compatible serializability, and thread safety.


    +   - Error handling: Conditional attention is paid to error handling through
    exceptions and configurable message streams for long-running processes.


    +   - Support: LingPipe has employees whose job is to answer your questions and
    make sure that LingPipe is doing its job. The rare bugs fixed in under 24 hours
    typically. We respond to your queries quickly and are very willing to help people.


    +   - Consulting: You can hire experts in LingPipe to build systems for you. Generally,
    teach developers do not know NLP systems as a byproduct.


    +   - Consistency: The LingPipe API was designed by one person, Bob Carpenter,
    with an obsession of consistency. While it is not perfect, you will find a regularity
    and ease to design that can be missing in academic efforts. Graduate students
    come and go, and the resulting contributions to university toolkits can be quite
    wide.


    +   - Open source: There are many commercial providers, but their software is
    a black box. The open source nature of LingPipe provides transparency and confidence
    that the code is what we ask it to do. When the documentation fails, it is a huge
    relief to have access to code to understand it better.


