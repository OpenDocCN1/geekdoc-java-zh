  md: "# Paragraph detection\n\nThe typical containing structure of sentences is a\
    \ paragraph. It can be set off explicitly in a markup language such as <span>\
    \ in HTML or with two or more new lines, which is how paragraphs are usually rendered.\
    \ We are in the part of the NLP where no hard-and-fast rules apply, so we apologize\
    \ for the hedging. We will handle some common examples in this chapter and leave\
    \ it to you generalize.\n\n# How to do it...\n\nWe have never set an evaluation\
    \ harness for paragraph detection, but it can be done in ways similar to sentence\
    \ detection. This recipe, instead, will illustrate a simple paragraph-detection\
    \ routine does something very important—maintain offsets into the original document\
    \ with embedded sentence detection. This attention to detail will serve you if\
    \ you ever need to mark up the document in a way that is sensitive to sentences\
    \ or other subspans of the document, Consider the following example:\n\n```\n\
    Sentence 1. Sentence 2\nSentence 3. Sentence 4.\n```\n\nIt gets transformed into\
    \ the following:\n\n```\n{ [Sentence 1.] [Sentence 2]\n{[Sentence 3.] [Sentence\
    \ 4.]}\n```\n\nIn the preceding snippet, [] designates sentences, and {} designates\
    \ paragraphs. We will jump right into the code in this recipe from src/lingpipe/cookbook/chapter5/ParagraphSentenceDetection.java.\n\
    \n+   1. The example code will have to offer in paragraph-detection techniques.\
    \ It is an open-ended problem, and you will have to use your will to solve it.\
    \ Our paragraph detector is a pathetic split(\"\\n\\n\") that, in a more sophisticated\
    \ approach, will have into account content, characters, and features that are\
    \ far too idiosyncratic for us to cover. Here is the beginning of the code that\
    \ reads the entire document as a string and splits it into an array. Note that\
    \ separatorLength is the number of characters that form the basis of the paragraph\
    \ split—if the length of the split varieties, then that length will have to be\
    \ associated with the corresponding paragraph:\npublic static void main(String[]\
    \ args) throws IOException\n String document = Files.readFromFile(new File(args[0]),\
    \ Strings.UTF_8);\n String[] paragraphs = document.split(\"\\n\\n\");\n int separatorLength\
    \ = 2;\n}"
