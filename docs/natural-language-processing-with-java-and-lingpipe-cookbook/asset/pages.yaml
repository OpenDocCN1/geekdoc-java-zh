  md: "# Chapter 3\n\nBe aware that features are strings, and the only notion of equivalence\
    \ is the exact string match. The 12:01pm feature is completely distinct from 12:02pm,\
    \ although to a human, these strings are very close, because we understand time.\
    \ To get the similarity of these two features, you must have something like a\
    \ LUNCH_TIME feature that is computed using time.\n\n# Combining feature extractors\n\
    \nFeature extractors can be combined in the same way as tokenizers in Chapter\
    \ 2, Finding and Working with Words.\n\n# How to do it...\n\nThis recipe will\
    \ show you how to combine the feature extractor from the previous recipe with\
    \ a very common feature extractor over character ngrams.\n\n+   1. We will start\
    \ with a main() method in src/com/lingpipe/cookbook/chapter3/CombinedFeatureExtractor.java\
    \ that we will use to run the feature extractor. The following lines set up results\
