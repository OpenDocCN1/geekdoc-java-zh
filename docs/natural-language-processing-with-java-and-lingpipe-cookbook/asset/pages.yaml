  md: 'Finding and Working with Words


    # # Introduction to tokenizer factories – finding words in a character stream


    LingPipe tokenizers are built on a common pattern of a base tokenizer that can
    be used on its own, or can be the source for subsequent filtering tokenizers.
    Filtering tokens manipulate the tokens/white spaces by the base tokenizer. This
    recipe covers our most commonly used tokenizer, IndoEuropeanTokenizerFactory,
    which is good for languages that use the Indo-European style of punctuation and
    word separators—include English, Spanish, and French. As, the Javadoc has useful
    information.


    > IndoEuropeanTokenizerFactory creates tokenizers with built-in support for alpha-numerics,
    numbers, and other common constructs in Indo-European languages.

    The tokenization rules are roughly based on those used in MUC-6 but are necessarily
    more fine grained, because the MUC tokenizers are based on lexical and semantic
    information, such as whether string is an abbreviation.


    MUC-6 refers to the Message Understanding Conference that introduced the idea
    of government-sponsored competitions between contractors in 1995. The informal
    term was Bake off, in reference to thebury Bake-Off that started in 1949, and
    one of the authors was a participant as postdoc in MUC-6. MUC drove much of the
    innovation in the field of NLP systems.


    LingPipe tokenizers are built using the LingPipe TokenizerFactory interface, which
    provides a way of creating different types of tokenizers using the same interface.
    This is very useful in creating filtered tokenizers, which are constructed as
    a chain of tokenizers and modify their output in some way. A TokenizerFactory
    instance might be created either as a base filtered tokenizer, which takes other
    tokenizer factory objects as parameters. In either case, an instance of TokenizerFactory
    has a single tokenize() method, which takes input as a character array, a start
    index, and the number of characters to process and outputs a Tokenizer object.
    The Tokenizer object represents the state of tokenizing a particular slice of
    string and provides a stream of tokens. While TokenizerFactory is thread safe
    and/or serializable, tokenizer instances are typically neither thread safe nor
    serializable. The Tokenizer object provides methods to iterate over the tokens
    in the string and to provide positions of the tokens in the underlying text.


    # # Getting ready


    Download the JAR file and source for the book if you have not already done so.'
