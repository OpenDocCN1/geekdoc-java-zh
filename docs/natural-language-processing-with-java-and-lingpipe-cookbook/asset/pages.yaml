  md: '# Chapter 5


    ChunkingImpl implementing class (Chunking is an interface) requires the underlying
    text on construction, which is why we didn''t just populate it in the preceding
    loop. LinePipe generally tries to make object construction complete. If Chun cannot
    be created without the underlying CharSequence method, then what will be returned
    when the charSequence() method is called? An empty string is actively misleading.
    Alternatively, returning null needs to be caught and dealt with. Better to force
    the object to make sense of construction.


    Moving on, we will see the standard configuration of the sentence chunker from
    the previous recipe:


    ```

    boolean eosIsSentenceBoundary = false;

    boolean balanceParens = true;

    senceModel = new

    IndoEuropeanSentenceModel(eosIsSentenceBoundary, balanceParens);

    TokenizerFactory tokFactory =

    IndoEuropeanTokenizerFactory.INSTANCE;

    SentenceChunker sentenceChunker =

    new SentenceChunker(tokFactory, sentenceModel);

    ```


    The interesting stuff follows with an evaluator that takes sentenceChunker as
    being evaluated as a parameter:


    ```

    SentenceEvaluator evaluator =

    new SentenceEvaluator(sentenceChunker);

    ```


    Next up, the handle (sentChunking) will take the text we just pasted into Chunking
    and run the sentence detector on CharSequence supplied in sentChunking and set
    up the evaluation:


    ```

    evaluator.handle(sentChunking);

    ```


    Then, we will get the evaluation data and work our way through the differences
    between the truth sentence detection and what the system did:


    ```

    SentenceEvaluator eval = evaluator.evaluation();

    ChunkingEvaluation chunkEval = eval.chunkingEvaluation();

    for (ChunkAndSeq truePos : chunkEval.truePositiveSet()) {

    System.out.println("TruePos: " + truePos);

    }

    for (ChunkAndSeq falsePos : chunkEval.falsePositiveSet()) {

    System.out.println("FalsePos: " + falsePos);

    }

    for (ChunkAndSeq falseNeg : chunkEval.falseNegativeSet()) {

    System.out.println("FalseNeg: " + falseNeg);

    }

