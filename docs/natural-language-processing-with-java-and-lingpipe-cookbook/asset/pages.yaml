  md: '# Finding Spans in Text - Chunking


    One way to look at the preceding problem is that contractions should not be broken
    up into tokens for the purpose of sentence detection. IndoEuropeanTokenizerFactory
    should be tuned up to keep "people''s" and other contractions together. While
    it initially seems better that the first solution, it will run out of the fact
    that IndoEuropeanSentenceModel was tuned with a particular tokenization in mind,
    and the consequences of the change are unknown in the absence of an evaluation
    corpus.


    The other option is to write a completely novel sentence-detection class that
    supports the SentenceModel interface. Faced with a highly novel data collection
    such as Twitter feeds, we will consider using a machine-learning-driven span-annotation
    technique such as HMMs or CRFs covered in Chapter 4, Tagging Words and Tokens,
    and at the end of this chapter.


    # Marking embedded chunks in a string – sentence chunk example


    The method of displaying chunks in the previous recipes is not suited for applications
    that need to modify the underlying string. For example, a sentiment analyzer might
    want to highlight only sentences that are strongly positive and not mark the remaining
    sentences while still displaying the text. The slight complication in producing
    the marked-up text is that adding markup changes the underlying string. This recipe
    provides working code to insert the chunking by adding chunks in reverse.


    # How to do it...


    While this recipe may be technically complex it is useful to get span annotations
    in a text without having to invent the code from whole cloth. The src/com/lingpipe/cobook/chapter5/WriteSentDetectedChunks
    class has the referenced code:


    +   1. The sentence chunking is created as per the first sentence-detection recipe.
    The following code extracts the chunks as Set<Chunk> and sorts them by Chunk.
    LONGEST_MATCH_ORDER_COMPARATOR. In Javadoc, the comparator is defined as:


    > Compare chunks based on their text position. A chunk is greater if it starts
    later than another chunk, or if it starts at the same position and ends earlier.'
