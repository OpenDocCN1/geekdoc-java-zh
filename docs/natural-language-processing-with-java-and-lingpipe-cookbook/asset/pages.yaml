  md: '# Cross-document coreference


    Cross-document coreference (XDoc) takes the id space of an individual document
    and makes it global to a larger universe. This universally includes other processed
    documents and databases of known entities. While the annotation is trivial, all
    that one needs to swap the document-scope IDs for the universe-scope IDs. The
    calculation of XDoc can be quite difficult.


    This recipe will tell us how to use a lightweight implementation of XDoc developed
    over the course of deploying systems over the years. We will provide a code overview
    for those who might want to extend/modify the code—but there is a lot going on,
    and the recipe is quite dense.


    The input is in the XML format where each file can contain multiple documents:


    ```

    <doc id="1">

    <title/>

    <content>

    ck Baldwin and Krishna Dayanidahi wrote a book about LingPipe.

    </content>

    </doc>

    ```


    ```

    <doc id="2">

    <title/>

    <content>

    Krishna Dayanidahi is a developer. Breck Baldwin is too.

    </content>

    </doc>

    ```


    ```

    <doc id="3">

    <title/>

    <content>

    K-dog likes to cook as de Breckles.

    </content>

    </doc>

    ```


    The goal is to produce annotations where the mentions of Breck Baldwin share the
    same ID documents as Krishna. Note that both are mentioned by their nicknames
    in the last document.


    A very common elaboration of XDoc is linking a database (DB) of known entities
    to text mentions of these entities. This bridges the divide between structured
    DB and unstructured data (text), which may consider to be the next big thing in
    business intelligence / voice of the customer / enterprise-knowledge management.
    We have built systems that linked genes/proteins to MEDLINE abstracts and persons-of-interest
    lists to free text, and so on. DBs also provide a natural way for human editors
    to control how XDoc behaves.'
