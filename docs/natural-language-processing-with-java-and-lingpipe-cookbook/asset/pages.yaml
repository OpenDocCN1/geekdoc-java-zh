  md: "# How to do it...\n\nOur business use case is that recall is maximized while\
    \ p has .65 precision and n has .5 precision for reasons discussed in the Classifier-building\
    \ life cycle recipe. The o category is not important in this case. The p category\
    \ appears to be too low with .57, and the n category can increase recall as the\
    \ precision is above .5.\n\n+   We cannot use the cross-validation unless care\
    \ has been taken to produce a proper distribution of annotations–the active learning\
    \ used tends to produce such distributions. Even with a good distribution, the\
    \ fact that the classifier was likely tuned with cross validation means that it\
