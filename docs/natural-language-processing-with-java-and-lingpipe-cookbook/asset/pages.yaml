    ```\n\nNext, we will configure standard logistic-regression-training parameters\
    \ and create the evaluator for cross-fold evaluation. Note that the Boolean for\
    \ store is true, which will facilitate recording results. The How to train and\
    \ evaluate with cross validation recipe in Chapter 1, Simple Classifier, have\
    \ a complete explanation:\n\n```\nPrintWriter progressWriter = new PrintWriter(System.out);\n\
    boolean storeInputs = true;\nConditionalClassifierEvaluator<CharSequence> evaluator\n\
    \    = new ConditionalClassifierEvaluator<CharSequence>(null,\ncategories, storeInputs);\n\
    Tokenizer tokFactory\n    = IndoEuropeanTokenizerFactory.INSTANCE;\n```\n\nThen,\
    \ we will execute standard cross validation:\n\n```\nfor (int i = 0; i < numFolds;\
    \ ++i) {\n    corpus.setFold(i);\n    final LogicalRegression<CharSequence> classifier\n\
    \        = Util.trainLogReg(corpus,tokFactory, progressWriter);\n    evaluator.setClassifier(classifier);\n\
    \    corpus.visit(evaluator);\n}\n```\n\nAt the end of cross validation, the evaluator\
    \ will have all the classifications stored in visitTest(). Next, we will transfer\
