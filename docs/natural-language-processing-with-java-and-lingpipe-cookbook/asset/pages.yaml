    # Priors


    The role of priors is to restrict the tendency of logistic regression to perfectly
    fit the training data. The ones we use try in varying degrees to push coefficients
    to zero. We will start with the nonInformativeIntercept prior, which controls
    whether the intercept feature is subject to the normalizing priors of the prior—if
    true, the intercept is not subject to the prior, which was the case in the preceding
    example. Setting it to false moved it much closer to zero from -0.17.


    ```

    *&^INTERCEPT$%^** : -0.03874782

    ```'
