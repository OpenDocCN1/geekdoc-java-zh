  md: '# Finding Coreference Between Concepts/People


    Coreference, like word-sense disambiguation, is a next-generation industrial capacity.
    The challenges of coreference continue to the insistence of the IRS to have a
    social security number that unambiguously identifies persons independent of their
    names. Many of the techniques discussed were developed to help track persons and
    organizations in text data with varying degrees of success.


    # Named entity coreference with a document


    As seen in Chapter 5, Finding Spans in Text – Chunking, LingPipe can use a variety
    of techniques to recognize proper nouns that correspond to places, things, genes,
    and so on. However, chunking doesn''t quite finish the job, because it doesn''t
    help with finding an entity when two named entities are the same. Being able to
    say that John Smith is the same entity as Mr. Smith, or even an exact repeat,
    John Smith, can be very useful–useful that the idea was the basic of our company
    when we were a baby-defense contractor. Our novel contribution was the generation
    of sentences indexed by entities they mentioned, which turned out to be an excellent
    way to summarize what was said about that entity, particularly if the spanning
    languages—we call it entity-based summarization.


    > The idea for entity-based summarization can come as a result of a talk Baldwin
    at the University of Pennsylvania at a graduate student seminar. Mitch Marcus,
    the department chair, that that showing all sentences that mentioned an entity–including
    pronouns–will be an excellent summary of that entity. In some sense, this is why
    LingPipe exists. It led to Baldwin leading a UPenn DARPA project and the creation
    of Alias-I. Lesson learned–talk to everybody about your ideas and research.


    This recipe will take you through the basics of computing coreferences.


    # Getting ready


    Lay your hands on some narrative text; we will use a simple example that we know
    works–coreference systems usually need a lot of tuning to the domain. Feel free
    to pick something else, but it will need to be in English.


    # How to do it...


    As usual, we will take you through running code from the command line and then
    dive into what the code actually does. Off do we go.


    +   1. We will start with a simple text to illustrate coreference. The file is
    in data/simpleCoref.txt, and it contains:


    John Smith went to Washington. Mr. Smith is a business man.'
