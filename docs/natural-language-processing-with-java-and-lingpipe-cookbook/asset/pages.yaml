    Basic tokens, such as the Indo-European tokenizer, don''t need much in terms of
    parameterization, none at all as a matter of fact. However, filtered tokens need
    a tokenizer as a parameter. What we''re doing with filtered tokens is invoking
    multiple tokenizers where a base tokenizer is usually modified by a filter to
    produce a different tokenizer.


