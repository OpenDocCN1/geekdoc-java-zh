  md: '# Chapter 4


    > "The ungentle laws and customs touched upon this tale are historical, and the
    episodes which are used to illustrate them are also historical."


    This is very little training data, but it is sufficient for the point being made.
    Consider how we will get an estimate for the phrase, "The ungentle inflows" using
    our language model. There are 24 words with "The" occurring once; we will assign
    a probability of 1/24 to it. We will assign a probability of 1/24 to "ungentle"
    as well. If we stop here, we can say that the likelihood of "The ungentle" is
    1/24 * 1/24. However, the next word is "inflows", which does not exist in the
    training data. This token is assigned a value of 0/22, it will make the likelihood
    of the entire string 0 (1/24 * 1/24 * 0/20). This means that whenever there is
    an unseen token for which the estimate is likely going to be zero, this is generally
    an unhelpful property.


    The standard response to this issue is to substitute and approximate the value
    to stand in for data that has not been seen in training. There are a few approaches
    to solving this:


    +   * Provide a low but non-zero estimate for unknown tokens. This is a very common
    approach.


    +   * Use language models with the unknown token. There are provisions for this
    in the class—refer to the Javadoc.


    +   * There are lots of other approaches and substantial research literature.
    Good search terms are "back off" and "smoothing".


    # Hidden Markov Models (HMM) – part-of-speech


