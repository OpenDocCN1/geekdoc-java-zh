  md: "# Finding Spans in Text - Chunking\n\nNext, it will construct BioTagChunkCodec\
    \ and convert the tagging just printed out to a chunking followed by the chunking:\n\
    \n```\nBioTagChunkCodec codec = new BioTagChunkCodec();\nChunking chunk = codec.toChunking(tagging);\n\
    System.out.println(\"Chunking from StringTagging\");\nfor (Chunk chunk : chunk.chunkSet())\
    \ {\n    System.out.println(chunk);\n}\n```\n\nThe remaining code reverses the\
    \ process. First, a differ BioTagChunkCodec is created with boolean enforceConsistency,\
    \ which, if true, checks that the tokens created by the supplier tokenizer align\
    \ with the chunk begins and ends. Without the alignment we ends up with a potentially\
    \ untenable relationship between chunks and tokens depending on the case:\n\n\
    ```\nboolean enforceConsistency = true;\nBioTagChunkCodec codec2 =\nnew BioTagChunkCodec(IndoEuropeanTokenizerFactory.INSTANCE,\n\
    enforceConsistency());\nStringTagging tagging2 = codec2.toStringTagging(chunking);\n\
    System.out.println(\"StringTagging from Chunking\");\nfor (int i = 0; i < tagging2.size();\
    \ i++) {\n    System.out.println(tagging2.token(i) + \"/\" + tagging2.tag(i));\n\
    }\n```\n\nThe last for loop simply prints out the tagging returned by the codec.\n\
    toTagging(method).\n\n# There's more...\n\nThe recipe works through the simplest\
    \ example of mapping between taggings and chunkings. BioTagChunkCodec also takes\
    \ the TagLattice<String> objects to produce n-best output, as will be shown in\
    \ the HMM and CRF chunkers.\n\n# HMM-based NER\n\nHmmChunker uses an HMM to perform\
    \ chunking over tokenized character sequences. Instances contain an HMM decoder\
