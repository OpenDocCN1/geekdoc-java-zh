  md: '# Finding Spans in Text - Chunking


    However, we have rarely needed to model nested sentences in industrial contexts,
    but we took it on our MUC-6 system and vanilla coreference resolution systems
    in research contexts. This is beyond the scope of a recipe book, but be aware
    of the issue. LingPipe has no out-of-the-box capabilities for nested sentence
    detection.


    # Evaluation of sentence detection


    Like most of the things we do, we want to be evaluate the performance of our components.
    Sentence detection is no different. Sentence detection is a span annotation that
    differs from our previous evaluations for classifiers and tokenization. As text
    can have characters that are not in any sentence, there is a notion of sentence
    start and sentence end. An example of characters that do not belong in a sentence
    will be JavaScript from an HTML page.


    The following recipe will take you through the steps of creating evaluation data
    and running it an evaluation class.


    # How to do it...


    Perform the following steps to evaluate sentence detection:


    +   Open a text editor and copy and paste some literary gem that you want to evaluate
    sentence detection, or you can get with our source default text, which is used
    if you don''t provide your own data. It is easiest if you stick to plain text.

    Inserted [ and ] to indicate the beginnings and ends of sentences in the text.
    If the text already contains each [ or ], pick another character that is not in
    the text as a sentence delimiter—curly brackets or slashes is a good choice. If
    you use different delimiters, you will have to modify the source appropriately
    and recreate the JAR file. The code assumes a single-character text delimiter.
    An example of a sentence-annotated text from The Hitchhiker''s Guide to the Galaxy
    is as follows—not that every character is in a sentence; some whitespaces between
    sentences:


    > The Guide says that the best drink in existence is the Pan Galactic Blaster.]
    [It says that the effect of a Pan Galactic Blaster is like having your brains
    smashed out by a slice of lemon wrapped round a large gold brick.]


    +   Get a command line and run the following:


    ```

    java -cp lingpipe-cookbook.1.0.jar:lib/lingpipe-4.1.0.jar: com.lingpipe.cookbook.chapter5.EvaluateAnnotatedSentences

    ```


    ```

    TruePos: The Guide says that the best drink in existence is the Pan Galactic Blaster..S

    TruePos: It says that the effect of a Pan Galactic Blaster is like having your
    brains smashed out by a slice of lemon wrapped round a large gold brick.:S

