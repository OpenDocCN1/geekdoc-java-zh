  md: '# Distance and proximity – simple edit distance


    String comparison refers to techniques used to measure the similarity between
    two strings. We will use distance and proximity to specify how similar any two
    strings are. The more similar any two strings are, the lesser the distance between
    them, so the distance from a string to itself is 0. An inverse measure is proximity,
    which means that the more similar any two strings are, the greater their proximity.


    We will take a look at simple edit distance measures in how many edits are required
    to convert one string to the other. A common distance measure proposed by Levenshtein
    in 1965 allows deletion, insertion, and substitution as basic operations. In transposition
    it is called Damerau-Levenshtein distance. For example, the distance between foo
    and boo is 1, as we''re looking at a substitution of f with b.


    > For more on distance metrics, refer to the Wikipedia article on distance at
    http://en.wikipedia.org/wiki/Distance.


    Let''s look at some examples of editable operations:


    +   - Deletion: Bart and Bar

    - Insertion: Bar and Bat

    - Substitution: Bar and Car

    - Transposition: Bart and Brat


    Now, we will run a simple example on edit distance:


    +   1. Run the SimpleEditDistance class using the command line or your IDE:

    ```java -cp lingpipe-cookbook.1.0.jar:lib/lib/lingpipe-4.1.0.jar com.lingpipe.cookbook.chapter6.SimpleEditDistance```

    2. In the command prompt, you will be prompted for two strings:

    Enterter the first string:

    ab

    Enterter the second string:

    ba

    Allowing Transposition Distance between: ab and ba is 1

    No Transposition Distance between: ab and ba is 2.0'
