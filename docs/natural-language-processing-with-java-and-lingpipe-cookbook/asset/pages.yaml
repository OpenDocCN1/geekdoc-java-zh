  md: '# #7 Finding Coreference Between Concepts/ People


    In this chapter, we will cover the following recipes:


    +   - Named entity coreference with a document

    - Adding pronouns to coreference

    - Cross-document coreference

    - The John Smith problem


    # ## Introduction


    Coreference is a basic mechanism in human language that allows two sentences to
    be about the same thing. It functions much in the same way as variable names do
    in programming languages, with the additional subtly scope that is defined by
    very different rules than blocks. Coreference is less important commercially—maybe
    this chapter will help that. Here is an example:


    > > Alice walked into the garden. She was surprised.


    Coreference exists between Alice and She; the phrases talk about the same thing.
    It all gets very interesting when we start asking whether Alice in one document
    is the same as Alice in another.'
