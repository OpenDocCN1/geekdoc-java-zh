  md: "# Getting ready\n\nWhat is going on here is that we are using the classifier\
    \ to find more data that looks like what it knows about. For problems where the\
    \ target classes are rare in the unannotated data, it can very quickly help the\
    \ system identify more examples of the class. For example, in a binary-classification\
    \ task with marginal probability of 1 percent for the target class in the raw\
    \ data, it is almost certainly the way to go. You cannot ask annotators to reliably\
    \ mark a 1-in-100 phenomenon over time. While this is the right way to do it,\
    \ the end result is that it will not be because of the effort involved.\n\nLike\
    \ most cheats, shortcuts, and super powers, the question to ask what is is the\
    \ price paid. In the duality of precision and recall, recall suffers with this\
    \ approach. This is because the approach biases annotation towards known cases.\
    \ Cases that have very different wording are unlikely to be found, so coverage\
    \ can suffer.\n\n# How to do it...\n\nLet's get started with active learning:\n\
    \n+   1. Collect some training data in .csv format from Chapter 1, Simple Classifiers,\
    \ or use our example data in data/activeLearning/disneyDedupe.0.csv. Our data\
    \ builds on the Disney tweets from Chapter 1, Simple Classifiers. Sentiment is\
    \ a good candidate for active learning, because it benefits from quality training\
    \ data and creating quality training data can be difficult. Use the .csv file\
    \ format from the Twitter search downloader if you are using your own data.\n\
    2. Run the .csv deduplication routine from the Eliminate near duplicates with\
    \ Jaccard distance recipe of Chapter 1, Simple Classifiers to get rid of near-duplicate\
    \ tweets. We have already done this with our example data. We from 1,500 tweets\
    \ to 1,343.\n3. If you have your own data, annotate around 25 examples in the\
    \ TRUTH column according to the standard annotation:\n     p stands for positive\
    \ sentiment\n     n stands for negative sentiment\n     o stands for other, which\
    \ means that no sentiment is expressed, or the tweet is not in English\n     Be\
    \ sure to get a few examples of each category"
