  md: '# Tuning feature


    The features that are fed into logistic regression have a huge impact on the performance
    of the system. We will cover feature extraction in greater detail in the later
    recipes, but we will bring to bear one of the most useful and somewhat counter-intuitive
    approaches here, because it is very easy to execute—use character ngrams instead
    of words/tokens. Let''s show at an example:


    ```

    Type a string to be classified. Empty string to quit.

    The rain in Spain

    Rank Category Score P(Category|Input)

    0=e 0.5 0.5

    1=n 0.5 0.5

    ```


    This output indicates that the classifier is tied between e English and n non-English
    as a decision. Scrolling back through the features, we will see that there are
    no matches for any of the words in the input. There are some substring matches
    on the English side. The has the substring he for the feature word the. For language
    ID, it makes sense to consider subsequences, as a matter of experience, it can
    be a big help for sentiment and other problems as well.


    Modifying the tokenizer to be two-to-four-character ngrams is as follows:


    ```

    int min = 2;

    int max = 4;

    TokenizerFactory tokenizerFactory

    = new NGramTokenizerFactory(min, max);

    ```


    This results in the proper distinction being made:


    ```

    Type a string to be classified. Empty string to quit.

    The rain in Spain

    Rank Category Score P(Category|Input)

    0=e 0.5113903651380305 0.5113903651380305

    1=n 0.4880962438621965 0.4880962438621965

    ```


    The overall performance on cross validation brings a bit. For many training sets,
    as 21 tweets, this is not unexpected. Generally, the cross-validation performance
    with a consultation of the mistakes looks like and at a look at the false positives
    will help guide this process.


    In looking at false positives, it is clear that English is a source of problems,
    because the coefficients on features show it to be evidence for English. Some
    of the false positives:


    +   False Positives for e

    @greenath_ t''as de la chance d''aller a Disney putain j''y ai jamais été

    moi. : n

