  md: "# Annealing schedule and epochs\n\nAs logistic regression converges, the annealing\
    \ schedule controls how the search space is explored and terminated:\n\n```\n\
    AnnealingSchedule annealingSchedule\n    = AnnealingSchedule.exponential(0.00025,0.999);\n\
    double minImprovement = 0.000000001\nint minEpochs = 10;\nint maxEpochs = 20;\n\
    ```\n\nWhen tuning, we will increase the first parameter to the annealing schedule\
    \ by order of magnitude (.0025, .025, .) if the search is too long—often, we can\
    \ increase the training speed impacting the cross-validation performance. Also,\
    \ the minImprovement value can be increased to have the convergence end earlier,\
    \ which can both increase the training speed and prevent the model from overfitting—is\
    \ called early stopping. Again, your guiding light in this situation is to look\
    \ at the cross-validation performance when making changes.\n\nThe epochs required\
    \ to achieve convergence can get quite high, so the classifier is iterating to\
    \ maxEpochs -1, this means that more epochs are required to converge. Be sure\
    \ to set the reporter.setLevel(LogLevel.INFO) ; property or a more informative\
    \ level to get the convergence report. This is worthy to additionally force early\
    \ stopping.\n\nParameter tuning is a black art that can only be learned through\
    \ practice. The quality and quantity of training data is probably the dominant\
    \ factor in classifier performance, but tuning can make a big difference as well.\n\
    \n# Customizing feature extraction\n\nLogistic regression allows for arbitrary\
    \ features to be used. Features are any observations that can be made about data\
    \ being classified. Some examples are as follows:\n\n+   * Words/tokens from the\
    \ text.\n* We found that character ngrams work well in lieu of words or stemmed\
    \ words. For small data sets of less than 10,000 words of training, we will use\
    \ 2-grams. Bigger training data can merit a longer gram, but we have never had\
    \ good results over 8-gram characters.\n* Output from another component can be\
    \ a feature, for example, a part-of-speech tagger.\n* Metadata known about the\
    \ text, for example, the location of a tweet or time of the day it was created.\n\
    * Recognition of dates and numbers abstracted from the actual value."
