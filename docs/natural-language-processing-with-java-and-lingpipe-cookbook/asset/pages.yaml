  md: '# Advanced Classifiers


    The following are some of the features produced by our training recipe for 21
    tweets annotated for English e and non-English n. There are relatively few features
    because feature weights are pushed to 0.0 by our, and once a weight is 0.0, then
    the feature is removed. Note that one category, n, is set to 0.0 for all the features
    of the n-1 category—this is a property of the logistic regression process that
    fixes once categories features to 0.0 and adjust all other categories with respect
    to that:


    ```

    FEATURE        e       n

    I :            0.37      0.0

    !             0.30      0.0

    Disney :       0.15      0.0

    "             0.08      0.0

    to :            0.07      0.0

    amonymore :    0.06      0.0

    is :           0.06      0.0

    ''                               0.0

    t :            0.04      0.0

    for :          0.03      0.0

    que           -0.01      0.0

    moi :          -0.01      0.0

    -             -0.02      0.0

    ,             -0.08      0.0

    pra :          -0.09      0.0

    ?             -0.09      0.0

    ```


    Take the string, I l Disney, which will only have two non-zero features: I=0.37
    and Disney=0.15 for e and zeros for n. Since there is no feature that matches
    I, it is ignored. The probability that the English breaks down to:


    ```

    vectorMultiply(e,[I,Disney]) = exp(.37*1 + .15*1) = 1.68

    vectorMultiply(n,[I,Disney]) = exp(0*1 + 0*1)

    ```


    We will rescale to a probability by summing the outcomes and dividing it:


    ```

    p(e,[I,Disney]) = 1.68/(1.68+1) = 0.62

    p(n,[I,Disney]) = 1/(1.68+1) = 0.38

    ```


    This is how the math works on running a logistic regression model. Training is
    that issue entirely.


