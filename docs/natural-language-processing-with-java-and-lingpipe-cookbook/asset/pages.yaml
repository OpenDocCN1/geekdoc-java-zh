    Now that we''ve seen how to build a few types of NERs, we can look at how to combine
    them. In this recipe, we will use a regular expression chunker, a dictionary-based
    chunker, and an HMM-based chunker and combine their outputs to look for overlaps.


    We will initialize a few chunkers in the same way we did in the past few recipes
    and pass the text through these chunkers. The easiest possibility is that this
