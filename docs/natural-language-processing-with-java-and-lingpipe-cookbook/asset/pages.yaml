  md: "# Tagging Words and Tokens\n\nThe guts of feature extraction are accessed with\
    \ the extract method:\n\n```\npublic class ChainCrfFeatures<String>\nextract(List<String>\
    \ tokens, List<String> tags) {\n    return new ModChainCrfFeatures(tokens, tags);\n\
    }\n```\n\nModChainCrfFeatures is created as an inner class to keep the proliferation\
    \ of classes to a minimum, and the enclosing class is very lightweight:\n\n```\n\
    class ModChainCrfFeatures extends ChainCrfFeatures<String> {\nTagLattice<String>\
    \ mBrownTaggingLattice;\npublic ModChainCrfFeatures(List<String> tokens, List<String>\
    \ tags) {\n    super(tokens, tags);\n    mBrownTaggingLattice = mDecoder.taginal(tokens);\n\
    }\n```\n\nThe preceding constructor hands off the tokens and tags to the super\
    \ class, which handles bookkeeping of this data. Then, the \"feature tagger\"\
    \ is applied to the tokens, and the resulting output is assigned to the member\
    \ variable, mBrownTaggingLattice. The code will access the tagging, one token\
    \ at a time, so it must be computed now.\n\nThe feature creation step happens\
    \ with two methods: nodeFeatures and edgeFeatures. We will start with a slight\
    \ enhancement of edgeFeatures from the previous recipe:\n\n```\npublic Map<String,\
    \ ?> extends Number> edgeFeatures(int n, int k) {\nObjectToDoubleMap<String> features\
    \ = new ObjectToDoubleMap<String>();\nfeatures.set(\"TAG \" + tag(k), 1.0d);\n\
    String category = IndoEuropeanTokenCategorizer.CATEGIZER;\n.categorize(token(n));\n\
    features.set(\"TOKEN_SHAPE \" + category, 1.0d);\nreturn features;\n}\n```\n\n\
    The code adds a token-shaped feature that generalizes 12 and 34 into 2-DIG and\
    \ many other generalizations. To CRF, the similarity of 12 and 34 as two-digit\
    \ numbers is non-existent unless feature extraction says otherwise. Refer to the\
    \ Javadoc for the complete categorizer.\n\n![](img/83ff609b4222b256508d150d8823f9d6_182_0.png)"
