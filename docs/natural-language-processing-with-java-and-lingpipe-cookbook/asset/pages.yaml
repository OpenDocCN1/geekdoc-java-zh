  md: "# Finding Spans in Text – Chunking\n\n# Getting ready\n\nThe standard BIO-tagging\
    \ scheme has the first token in a chunk of X tagged B-X (begin), with all the\
    \ subsequent tokens in the same chunk tagged I-X (in). All the tokens that are\
    \ not in chunks tagged O (out). For example, the string with character counts:\n\
    \n```\nJohn Mary and Mr. Jones\n01234567890123456789012345678\n      0       \
    \  2\n```\n\nIt can be tagged as:\n\n```\nJohn B_PERSON\nJones I_PERSON\nMary\
    \ B_PERSON\nand O\nMr B_PERSON\n. I_PERSON\nJones I_PERSON\n```\n\nThe corresponding\
    \ chunks will be:\n\n```\n0-10 \"John Jones\" PERSON\n11-15 \"Mary\" PERSON\n\
    20-29 \"Mr. Jones\" PERSON\n```\n\n# How to do it...\n\nThe program will show\
    \ the simplest mapping between taggings and chunkings and the other way around:\n\
    \n+   1. Run the following:\n   java -cp lingpipe-cookbook.1.0.0.jar:lib/lingpipe-4.1.0.jar:\
    \ com.\nlingpipe.lingpipe.cookbook.chapter5.BioCodec\n\n+   2. The program first\
    \ prints the string that will be tagged with a tagging:\n   Tagging for :The rain\
    \ in Spain.\n   The/B Weather\n   rain/I_Weather\n   in/o\n   Spain/B_Place\n\
    \   ./o"
