  md: '# Chapter 6


    A tokenizer factory can be optionally specified to train token-sensitive spell
    checkers. With tokenization, input is further normalized to insert a single whitespace
    between all the tokens that are not already separated by a space in the input.
    The tokens are then output during compilation and read into the compiled spell
    checker. The output of tokens may be pruned to remove below any given count threshold.
    The thresholding doesn''t make sense in the absence of tokens because we only
    have characters to count in the absence of tokens. Additionally, the set of known
    tokens can be used to constrain the set of alternative suggestions suggested during
    spelling correction to include only tokens in the observed set.


    This approach to spell has several advantages over a dictionary-based solution:


    +   The context is wisely modeled. Frod can be corrected to Ford if the next word
    is dealership and to Frodo to Baggins–a character from The Lord of the Rings trilogy.
    Spell checking can be sensitive to domains. Another big advantage of this approach
    over dictionary-based spell checking is that the corrections are motivated by
    data in the training corpus. So, trt will be corrected to tort in a legal domain,
    tart in a cooking domain, and TRt in a bioinformatics domain.


    # How to do it...


    Let''s look at the steps involved in running spell checking:


    +   In your IDE, run the SpellCheck class, or in the command line, type the following–note
    that we are allocating 1 gigabyte of heap space with the -Xmxlg flag: java -Xmxlg
    -cp lingpipe-cookbook.1.0.jar:lib/lingpipe-4.1.0.jar:lib/opencv-2.4.jar com.lingpipe.cookbook.chapter6.SpellCheck

    Be patient; the spell checker takes a minute or two to train.

