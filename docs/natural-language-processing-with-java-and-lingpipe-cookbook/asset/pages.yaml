  md: "You can see that the input text, which was mixed case and in normal English,\
    \ has been transformed into its Rot-13 equivalent. You can see the second time\
    \ around, we have passed the Rot-13 modified text as input and got the original\
    \ text back, except that it was all lowercase.\n\n# How it works...\n\nRot13TokenizerFactory\
    \ extends the ModifyTokenTokenizerFactory class. We will override the modifyToken()\
    \ method, which operates a token at a time and, in this case, converts the token\
    \ to its Rot-13 equivalent. There is a similar modifyWhiteSpace(String) method,\
    \ which modifies the white spaces if required:\n\n```\npublic class Rot13TokenizerFactory\n\
    extends ModifyTokenTokenizerFactory {\n\npublic Rot13TokenizerFactory (TokenizerFactory\
    \ f) {\n}\n\n@Override\npublic String modifyToken(String tok) {\n    return rot13(tok);\n\
    }\n\npublic static void main(String[] args) throws IOException {\n\nTokenizerFactory\
    \ tokFactory = \n    IndoEuropeanTokenizerFactory.INSTANCE;\ntokFactory = new\
    \ LowerCaseTokenizerFactory(tokFactory);\ntokFactory = new Rot13TokenizerFactory(tokFactory);\n\
    ```\n\nThe start and end of the tokens remains the same as that of the underlying\
    \ tokenizer. Here, we will use an Indo-European tokenizer as our base tokenizer.\
    \ It filter once through LowerCaseTokenizer and then through Rot13Tokenizer.\n\
    \nThe rot13 method is:\n\n```\npublic static String rot13(String input) {\n  \
    \  StringBuilder sb = new StringBuilder();\n    for (int i = 0; i < input.length();\
    \ i++) {\n        char c = input.charAt(i);\n        if (c >= 'a' && c <= 'm')\
    \ c += 13;\n        else if (c >= 'A' && c <= 'M') c += 13;\n        else if (c\
    \ >= 'n' && c <= 'z') c -= 13;\n        else if (c >= 'N' && c <= 'Z') c -= 13;\n\
    \        sb.append(c);\n    }\n    return sb.toString();\n}\n```"
