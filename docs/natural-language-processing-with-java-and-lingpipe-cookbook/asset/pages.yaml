    +   7. The B-cored (Bagga, Bierman, and Baldwin) evaluation was created to heavily
    penalize large clusters together. It assumes that it is more of a problem to push
    lots of documents about George W. Bush together with George H. W. Bush, both large
    clusters, than to mistake George Bush, the mechanic who got mentioned once in
    the dataset. Other scoring metrics will count the mistakes as equally bad. It
    is the standard scoring metric used in the literature for this phenomenon.


    # See also


    There is a fair amount of work in the research literature on this exact problem.
    We were not the first ones to think about this, but we came up with the dominant
    evaluation metric, and we released a corpus for other groups to compare themselves
    with us and each other. Our contribution is Entity-based cross-document coreferencing
    using the Vector Space Model by Bagga and Baldwin in ACL ''98 Proceedings of the
    36th Annual Meeting of the Association for Computational Linguistics and 17th
    International Conference on Computational Linguistics. There has been much progress
    since—there are more than 400 citations to this model on Google Scholar; they
    are worth a look if this problem is of importance to you.'
