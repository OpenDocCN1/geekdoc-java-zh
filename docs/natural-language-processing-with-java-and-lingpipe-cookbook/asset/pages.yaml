    \ string that has a John Smith substring and adding it in as a PERSON entity.\
    \ Most kinds of cheating, this is quite useful if your purpose in life is tracking\
    \ John Smith. The cheating we did in reality was to use dictionary matching to\
    \ find all variations of high-value intelligence targets such as Osama bin Laden.\
    \ In the, we had over 40 versions of his name scoring openly available news sources\
    \ as part of the MiTAP project.\n\nFurther, as each sentence is processed, we\
    \ will check all mentions for a matching pattern for John Smith, and if so, we\
    \ will collect any sentence that has a mention of this ID. This means a sentence\
    \ that refers back to John Smith with a pronoun will be included, as will the\
    \ Mr. Smith cases if coreference is during his job. We need to see a match for\
    \ John Smith before start collecting contextual information, so we will miss the\
    \ first sentence of He awoke. John Smith was a giant cockroach. Also note that\
    \ if a second John Smith shows up with a different ID, it will be ignored—this\
    \ can happen.\n\nFinally, note that there is some error checking, in that if John\
