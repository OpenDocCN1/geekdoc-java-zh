  md: '# String Comparison and Clustering


    > While EditDistance is quite simple to use, it is not simple to implement. This
    is what the Javadoc has to say about this class:


    Note: This class implements edit distance using dynamic programming in O(n * m)
    where n and m are the length of the sequences being compared. Using a sliding
    window of three lattice slices rather than allocating the entire lattice at once,
    the space required is for three arrays of integers as long as the shorter of the
    two character sequences being compared.


    In the following sections, we will see how to assign costs to each edit operation.


    # See also


    +   - Refer to the LingPipe Javadoc on EditDistance at http://alias-i.com/lingpipe/docs/api/com/aliasi/spell/EditDistance.html
    for more details

    - For more details on distance, refer to the Javadoc at http://alias-i.com/lingpipe/docs/api/com/aliasi/util/Distance.html

    - For more details on proximity, refer to the Javadoc at http://alias-i.com/lingpipe/docs/api/com/aliasi/util/Proximity.html


    # Weighted edit distance


    Weighted edit distance is essentially a simple edit distance, except that the
    edits allow different costs to be associated with each kind of edit operation.
    The edit operations we identified in the previous recipe are substitution, insertion,
    deletion, and transposition. Additionally, there can be a cost associated with
    each exact matches to increase the weight for matching - this might be used when
    edits are required, such as a string-variance generator. Edit weights are generally
    scaled as log probabilities so that you assign likelihood to an edit operation.
    The larger the weight, the more likely that edit is. As probabilities are between
    0 and 1, log probabilities, or weights, will be negative infinity and zero. For
    more on this refer to the Javadoc on the WeightedEditDistance class at http://alias-i.com/lingpipe/docs/api/com/aliasi/spell/WeightedEditDistance.html.


    On the scale, weighted edit distance can be generalized to produce exactly the
    same results as simple edit distance did in the previous recipe by setting the
    match weight to 0 and substituting, deleting, and inserting weights to -1 and
    transposition weights to either -1 or negative infinity, if we want to turn transposition
    off.


    We will look at weighted edit distance for spell checking and Chinese word segmentation
    in other recipes.'
