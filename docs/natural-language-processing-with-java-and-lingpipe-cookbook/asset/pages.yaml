  md: "# Advanced Classifiers\n\n# How to do it...\n\nThe source for this recipe is\
    \ in src/com/lingpipe/cookbook/chapter3/ContainsNumberFeatureExtractor.java.\n\
    \n+   Feature extractors are straightforward to build. The following is a feature\
    \ extractor that returns a CONTAINS_NUMBER feature with weight 1:\n```java\npublic\
    \ class ContainsNumberFeatureExtractor implements FeatureExtractor<CharSequence>\
    \ {\n    @Override\n    public Map<String, Counter> features(CharSequence text)\
    \ {\n        ObjectToCounterMap<String> featureMap = new ObjectToCounterMap<String>();\n\
    \        if (text.toString().matches(\".*\\d.*\\*\")) {\n            featureMap.set(\"\
    CONTAINS_NUMBER\", 1);\n        }\n        return featureMap;\n    }\n}\n```\n\
    \n+   By adding a main(String[]) args we can test the method:\n```java\n static\
    \ void main(String[] args) {\n    FeatureExtractor<CharSequence> featureExtractor\
    \ = new ContainsNumberFeatureExtractor();\n    System.out.println(featureExtractor.features(\"\
    I have a number 1\"));\n}\n```\n\n+   Now run the following command:\n```\njava\
    \ -cp lingpipe-cookbook.1.0.jar:lib/lingpipe-4.1.0.jar:lib/opencv-2.4.jar com.lingpipe.cookbook.chapter3.ContainsNumberFeatureExtractor\n\
    ```\n\n+   The preceding code yields the output:\n```\nCONTAINS_NUMBER=1\n```\n\
    \nThat's it. The next recipe will show you how to combine feature extractors.\n\
    \n# There's more...\n\nDesigning features is a bit of an art. Logistic regression\
    \ is supposed to be robust in the face of irrelevant features, but overwhelming\
    \ it with dumb features will likely detract from performance.\n\nOne way to think\
    \ about what features you need is to wonder what evidence from the text or environment\
    \ helps you, the human, decide what the correct classification is. Try and ignore\
    \ your world knowledge when looking at the text. If world knowledge, like that\
    \ France is a country, is important, then try and model this world knowledge with\
    \ a gazetteer to generate CONTAINS_COUNTRY_MENTION.\n\n![](img/83ff609b4222b256508d150d8823f9d6_116_0.png)"
