    # Training on test data is OK


    As this is unsupervised data, there is no requirement that the training data should
    be distinct from the evaluation or production data.


    # Using edit distance and language models for spelling correction


    Spelling correction takes a user input text and provides a corrected form. Most
    of us are familiar with automatic spelling correction via our smart phones or
    editors such as Microsoft Word. There are obviously quite a few amusing of these
    on the Web where the spelling correction fails. In this example, we''ll build
    our own spelling-correction engine and look at how to tune it.


    LingPipe''s spelling correction is based on a noisy-channel model which models
    user mistakes and expected input (based on the data). Expected user input is modeled
    by a character-language model, and mistake (or noise) is modeled by weighted edit
    distance. The spelling correction is done using the CompiledSpellChecker class.
    This class implements the noisy-channel model and provides an estimate of the
    most likely message, given that the message actually received. We can express
    this through a formula in the following manner:


    ```

    didYouMean(received) = ArgMaxintended P(intended | received)

    = ArgMaxintended P(intended, received) / P(received)

    = ArgMaxintended P(intended, received)

    = ArgMaxintended P(intended) * P(received | intended)

    ```


    In other words, we will create a model of the intended message by creating an
    n-gram character-language model. The language model stores the statistics of seen
    phrases, that is, essentially it counts of how many times the n-grams occurred.
    This gives us P(intended). For example, P(intended) is how likely is the character
    sequence. Next, we will create the channel model, which is a weighted edit distance
    and gives us the probability that the error was typed for that intended text.
    Again, how likely is the error the when user intended to type the. In our case,
    we will model the likelihood using weighted edit distance where the weights are
    scaled as log probabilities. Refer to the Weighted edit distance recipe earlier
    in the chapter.


    The usual way of creating a compiled spell checker is through an instance of TrainSpellChecker.
    The result of compiling the spell-checker-training class and reading it back in
    a compiled spell checker. TrainSpellChecker creates the basics, weighted edit
    distance, and token set through the compilation process. We will then need to
    set various parameters on the CompiledSpellChecker object.'
