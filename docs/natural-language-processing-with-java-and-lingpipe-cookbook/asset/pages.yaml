  md: '# Finding Spans in Text - Chunking


    Here is the place to add more rules for overlapping chunks. For example, you can
    make it score based, so if the PRESIDENT chunk type has a higher score than the
    HMM-based one, you can choose it instead.


    # CRFs for chunking


    CRFs are best known to provide close to state-of-the-art performance for named-entity
    tagging. The recipe will tell us how to build one of these systems. The recipe
    assumes that you have read, understood, and played with the Conditional random
    fields – CRF for word token recognition in Chapter 4, Tagging Words and Tokens,
    which addresses the underlying technology. Like HMMs, CRFs treat named entity
    detection as a word-tagging problem, with an interpretation layer that provides.
    Unlike HMMs, CRFs use a logistic-regression-based classification approach, which,
    in turn, allows for features to be included. There is an excellent tutorial on
    CRFs that this recipe follows closely (but omit details) at http://alias-i.com/lingpipe/demos/tutorial/crf/read-me.html.
    There is a lot of information in the Javadoc.


    # Getting ready


    Just as we decided, we will use a small hand-coded corpus to serve as training
    data. The corpus is in src/com/lingpipe/cookbook/chapter5/TinyEntityCorpus.java.
    It starts with:


    ```

    public class TinyEntityCorpus extends Corpus<ObjectHandler<Chunking>>{


    public void visitTrain(ObjectHandler<Chunking> handler) {

    for (Chunking chunking : CHUNKS) handler.handle(chunking);

    }


    public void visitTest(ObjectHandler<Chunking> handler) {

    /* no op *

    }

    ```


    Since we are only using this corpus to train, the visitTrain() method does nothing.
    However, it exposes the handler to all the chunks stored in the CHUNKS constant.
    This, in turn, looks like the following:


    ```

    static final Chunking[] CHUNKS = new Chunking[] {

    chunking("""), chunking("The"),

    chunking("John ran.", chunk(0,4,"PER"),

    chunking("Mary ran.", chunk(0,4,"PER"),

    chunking("The kid ran."), chunking("John likes Mary."),

    chunk(0,4,"PER"), chunk(11,15,"PER"),

    chunking("Tim lives in Washington,"), chunk(0,3,"PER"),

    chunk(13,23,"LOC"), chunking("Mary Smith is in New York City")

    ```


