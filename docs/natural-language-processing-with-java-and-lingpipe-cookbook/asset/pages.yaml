  md: '# Degree of sentiment


    Problem: Classify a sentiment on a scale of 1 to 10 based on the degree of negatativeness
    to positivity.


    Solution: Even though our classifiers provide a score that can be mapped on a
    1-to-10 scale, this is not what the background computation is doing. To correctly
    map to a degree scale, one will have to annotate the distinction in training data—this
    tweet is a 1, this is a 3, and so on. We will then train a 10-way classifier,
    and the first best category should be, in theory, the degree. We will write in
    theory despite regular customer requests for this, we have never found a customer
    that was willing to support the required annotation.


    # Non-exclusive category classification


    Problem: The desired classifications are not mutually exclusive. A tweet can say
    positive and negative things, for example, "Loved Mickey, hated Pluto". Our classifiers
    assume that categories are mutually exclusive.


    Solution: We regularly use multiple binary classifiers in place of one n-way or
    multinomial classifiers. The classifiers will be trained for positive/non-positive
    and negative/non-negative. A tweet can then be annotated n and p.


    # Person/company/location detection


    Problem: Detect mentions of people in text data.


    Solution: Believe it or not, this breaks down into a word classification problem.
    See Chapter 6, String Comparison and Clustering.


    It is generally fruitful to look at any novel problem as a classification problem,
    even if classifiers don''t get used as the underlying technology. It can help
    clarify what the underlying technology actually needs to do.'
