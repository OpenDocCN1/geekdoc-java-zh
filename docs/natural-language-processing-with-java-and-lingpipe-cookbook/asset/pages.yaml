  md: '# Chapter 1


    LingPipe classifiers exist on a hierarchy based on the kinds of estimates they
    provide.

    The backbone is a series of interfaces—don''t freak out; it is actually pretty
    simple. You don''tnneed to understand it now, but we do need to write it down
    somewhere for future reference:


    +   - BaseClassifier<E>: This is just your basic classifier of objects of E.

    It has a classify() method that returns a classification, which in turn has a
    bestCategory() method and a toString() method that is of some informative use.

    - RankedClassifier<E> extends BaseClassifier<E>: The classify() method returns
    RankedClassification, which extends Classification and adds methods for category
    (int rank) that says what the 1st to nth classifications are. There is also a
    size() method that indicates how many classifications are.

    - ScoredClassifier<E> extends RankedClassifier<E>: The returned ScoredClassification
    adds a score (int rank) method.

    - ConditionalClassifier<E> extends RankedClassifier<E>: ConditionalClassification
    produced by this property has that the sum of scores for all categories must sum
    to 1 as accessed via the conditionalProbability(int rank) method and conditionalProbability(String
    category). There''s more; you can read the Javadoc for this. fancy, and we want
    to know the confidence that the tweet is English versus the tweet is Spanish.
    These estimates will have to sum to 1.

    - JointClassifier<E> extends ConditionalClassifier<E>: This provides JointClassification
    of the input and category in the space of all the possible inputs, and all estimates
    sum to 1. This is a sparse space, so values are log based to avoid unused errors.
    We do need a lot of use of this estimate directly in production.


    It is obvious that there has been a great deal of thought put into the classification
    stack presented. This is because huge numbers of industrial NLP problems are handled
    by a classification system in the end.


    It turns out that our simplest classifier—in some arbitrary sense of simple—produces
    the richest estimates, which are joint classifications. Let''s dive in.'
