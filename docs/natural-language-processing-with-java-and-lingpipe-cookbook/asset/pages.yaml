  md: '# Advanced Classifiers


    The thresholds are doing exactly as designed; p is .79 precision, which is close
    enough for consulting, and n is spot on. The source for the main() method should
    be straightforward given the context of this chapter.


    That''s it. Almost never do we release a nonthresholded classifier, and best practices
    require that thresholds be set on held-out data, preferably from later epochs
    than the training data. Logistic regression is quite robust against skewed training
    data, but the ointment cleanses the flaws of skewed data is novel annotated top
    down to precision objectives. Yes, it is possible to threshold with cross validation,
    but it suffers from the flaws that overfit due to tuning, and you would screw
    y up your distributions. Recall-oriented objectives are another matter.


    # Train a little, learn a little – active learning


    Active learning is a super power to quickly develop classifiers. It has saved
    many project in the real world. The idea is very simple and can be broken down
    as follows:


    +   1. Assemble a packet of raw data that is way bigger than you can annotate
    manually.

    2. Annotate an embarrassingly small amount of the raw data.

    3. Train the classifier on the embarrassingly small amount of training data.

    4. Run the trained classifier on all the data.

    5. Put the classifier output into a .csv file ranked by confidence of best category.

    6. Correct another embarrassingly small amount of data, starting with the most
    confident classifications.

    7. Evaluate the performance.

    8. Repeat the process until the performance is acceptable, or you run out of data.

    9. If successful, be sure to evaluate/threshold on fresh data, because the active
    learning process can introduce biases to the evaluation.


    What this process does help the classifier distinguish the cases where it is making
    higher confidence mistakes and correcting it. It also works as a classification-driven
    search engine of sorts, where the positive training data functions as the query,
    and the remaining data functions as the index being searched.


    Traditionally, active learning is applied to the near-miss cases where the classifier
    is unsure of the correct class. In this case, the corrections will apply to the
    lowest confidence classifications. We came up with the high-confidence correction
    approach because we were under pressure to increase precision with a thresholded
    classifier that only accepted high-confidence decisions.'
