  md: '# # String Comparison and Clustering


    In this chapter, we will cover the following recipes:


    +   * Distance and proximity – simple edit distance

    * Weighted edit distance

    * The Jaccard distance

    * The Tf-ld distance

    * Using edit distance and language models for spelling correction

    * The case restoring corrector

    * Automatic phrase completion

    * Single-link and complete-link clustering using edit distance

    * Latent Dirichlet allocation (LDA) for multitopic clustering


    # ## Introduction


    This chapter starts off by comparing strings using standard language neutral techniques.
    Then, we will use these techniques to build some commonly used applications. We
    will also look at clustering techniques based on distances between strings.


    For a string, we use the canonical definition that a string is a sequence of characters.
    So, clearly, these techniques apply to words, phrases, sentences, paragraphs,
    and so on, all of which you have learnt to extract in the previous chapters.'
