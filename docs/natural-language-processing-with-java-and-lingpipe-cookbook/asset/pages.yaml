  md: "# How it works\n\nWe will instantiate a FixedWeightEditDistance class with\
    \ some weights that are, arbitrarily chosen:\n\n```\ndouble matchWeight = 0;\n\
    double deleteWeight = -2;\ndouble insertWeight = -2;\ndouble substituteWeight\
    \ = -2;\ndouble transposeWeight = Double.NEGATIVE_INFINITY;\nWeightedEditDistance\
    \ wed = new FixedWeightEditDistance(matchWeight,insertWeight,substituteWeight,transposeWeight);\n\
    System.out.println(\"Fixed Weight Edit Distance: \" +wed.toString());\n```\n\n\
    In this example, we set the delete, substitute, and insert weights to be equal.\
    \ This is similar to the standard edit distance, except that we modified the weights\
    \ associated with the edit operations from 1 to 2. Setting the transpose weight\
    \ to negative infinity turns off transpositions completely. Obviously, it's not\
    \ necessary that the delete, substitute, and insert weights should be equal.\n\
    \nWe will also create a CustomWeightedEditDistance class, which treats punctuations\
    \ and whitespaces as matches, that is, zero cost for the insert and delete operations\
    \ (for letters or digits, the cost remains -1). For substitutions, if the character\
    \ is different only in case, the cost is zero; for all other cases, the cost is\
    \ -1. We will also turn off transposition by setting its cost to negative infinity.\
    \ This will result in Ab+ matching abc-\n\n```\npublic static class CustomWeightedEditDistance\
    \ extends\nWeightedEditDistance{\n\n@Override\npublic double deleteWeight(char\
    \ arg0) {\n    return (Character.isDigit(arg0) || Character.isLetter(arg0))\n\
    \    ? -1 : 0;\n}\n\n@Override\npublic double insertWeight(char arg0) {\n    return\
    \ deleteWeight(arg0);\n}\n```"
