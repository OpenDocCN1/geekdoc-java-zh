  md: '# Downloading LingPipe


    Downloading LingPipe is not strictly necessary, but you will likely want to be
    able to look at the source and have a local copy of the Javadoc.


    The download and installation instructions for LingPipe can be found at http://alias-i.com/lingpipe/web/install.html.


    The examples from this chapter use command-line invocation, but it is assumed
    that the reader has sufficient development skills to map the examples to their
    preferred IDE/ant or other environment.


    # Deserializing and running a classifier


    This recipe does two things: introduces a very simple and effective language ID
    classifier and demonstrates how to deserialize a LingPipe class. If you find yourself
    here from a later chapter, trying to understand deserialization, I encourage you
    to run the example program anyway. It will take 5 minutes, and you might learn
    something useful.


    Our language ID classifier is based on character language models. Each language
    model gives the probability of the text, given that it is generated in that language.
    The model that is most familiar with the text is the first best fit. This one
    has already been built, but later in the chapter, you will learn to make your
    own.


    # How to do it...


    Perform the following steps to deserialize and run a classifier:


    +   Go to the cookbook directory for the book and run the command for OSX, Unix,
    and Linux:


    java -cp lingpipe-cookbook.1.0.jar:lib/lingpipe-4.1.0.jar com.lingpipe.cookbook.chapter1.RunClassifierFromDisk


    For Windows invocation (quote the classpath and use ; instead of :):


    java -cp "lingpipe-cookbook.1.0.jar;lib\lingpipe-4.1.0.jar" com.lingpipe.cookbook.chapter1.RunClassifierFromDisk


    We will use the Unix style command line in this book.'
