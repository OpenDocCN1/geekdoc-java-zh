  md: '# Tagging Words and Tokens


    In this chapter, we will cover the following recipes:


    +   - Interesting phrase detection

    - Foreground- or background-driven interesting phrase detection

    - Hidden Markov Models (HMM) – part-of-speech

    - N-best word tagging

    - Confidence-based tagging

    - Training word tagging

    - Word-tagging evaluation

    - Conditional random fields (CRF) for word/token tagging

    - Modifying CRFs


    # Introduction


    Words and tokens are the focus of this chapter. The more common extraction technologies,
    such as named entity recognition, are actually encoded into the concepts presented
    here, but this will have to wait until Chapter 5, Finding Spans in Text – Chunking.
    We will start easy with finding interesting sets of tokens. Then, we will move
    on to HMM and finish with one of the most complex components of LingPipe–CRF.
    As usual, we show you how to evaluate tagging and train your own taggers.'
