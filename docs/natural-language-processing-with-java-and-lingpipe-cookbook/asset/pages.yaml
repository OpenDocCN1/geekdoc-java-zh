  md: '# Simple Classifiers


    The new bit for this recipe happens when we invoke the AbstractExternalizable.compileTo()
    method on DynamicLMClassifier, which compiles the model and writes it to a file.
    This method is used to write the writeExternal method from Java''s Externalizable
    interface:


    ```

    AbstractExternalizable.compileTo(classifier,outputFile);

    ```


    This is all you need to know folks to write a classifier to a disk.


    # There''s more...


    There is an alternate way to serialize that is amenable to more variations of
    data sources for serializations that are not based on the File class. An alternate
    way to write a classifier is:


    ```

    FileOutputStream fos = new FileOutputStream(outputFile);

    ObjectOutputStream oos = new ObjectOutputStream(fos);

    classifier.compileTo(oos);

    ooos.close();

    ```


    Additionally, DynamicLM can be compiled without involving the disk with a static
    AbstractExternalizable.compile() method. It will be used in the following fashion:


    ```

    @SuppressWarnings("unchecked")nLMClassifier<LanguageModel, MultivariateDistribution>
    compiledLM = (LMClassifier<LanguageModel, MultivariateDistribution>)

    AbstractExternalizable.compile(classifier);

    ```


    The compiled version is a lot faster but does not allow further training instances.


