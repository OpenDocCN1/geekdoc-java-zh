  md: "# String Comparison and Clustering -\n\nA distance of 0 is a perfect match,\
    \ that, the strings share all terms, and a distance of 1 is a perfect mismatch,\
    \ that is, the strings have no terms in common. Remember that proximity and distance\
    \ are additive inverses, so proximity ranges from 1 to 0. Proximity of 1 is a\
    \ perfect match, and proximity of 0 is a perfect mismatch:\n\n```\nproximity =\
    \ count(common tokens)/count(total tokens)\ndistance = 1 - proximity\n```\n\n\
    The tokens are generated by TokenizerFactory, which is passed in during construction.\
    \ For example, let's use IndoEuropeanTokenizer and take a look at a concrete example.\
    \ If string1 flies like a banana and string2 flies like an arrow, then the token\
    \ set for string1 would be {'fruit', 'flies', 'like', 'a', 'banana'}, and the\
    \ token set for string2 would be {'time', 'flies', 'like', 'an', 'arrow'}. The\
    \ common terms (or the intersection) between these two token sets are {'fruit',\
    \ 'flies', 'like', 'banana', 'arrow'}. Now, we can calculate the Jaccard proximity\
    \ by dividing the number of common terms by the total number of terms, which is\
    \ 2/8, which equals 0.25. Thus, the distance is 0.75 (1-0.25). Obviously, the\
    \ Jaccard distance is eminently tunable by modifying the tokenizer that the class\
    \ is initialized with. For example, one could use a case-normalizing tokenizer\
    \ so that Ab and abc would be considered equivalent; a stemming tokenizer would\
    \ consider the words run and run to be equivalent. We will see a similar ability\
    \ in the next distance metric, the Tf-idf distance, as well.\n\n# How to do it...\n\
    \nHere's how to run the JaccardDistanceSample class, or in the command line, type:\n\
    \n+   1. In Eclipse, run the JaccardDistanceSample class, or in the command line,\
    \ type:\n   `java -cp lingpipe-cookbook.1.0.jar:lib/lingpipe-4.1.0.jar com.lingpipe.cookbook.chapter6.JaccardDistanceSample`n2.\
    \ As in the previous recipes, you will be prompted for strings. The first string\
    \ that we will use Mimsey Were the Borgroves, which is an excellent sci-fi shortstory\
    \ title, and the second string all mimsy were the borogoves, is the actual line\
    \ from Jabberwocky that inspired it:\n\n```\nEnter the first string:\nMimsey Were\
    \ the Borgroves\nEnter the second string:\nAll mimsy were the borogoves,\n```\n\
    \n```\nIndoEuropean Tokenizer\nText1 Tokens: {'Mimsey'Were'the'}\n```\n\n228"
