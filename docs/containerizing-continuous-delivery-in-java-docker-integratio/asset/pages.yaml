    as this can introduce nondeterministic results depending on the load of the build
    server and timing of the build, and accordingly it is best to set a timeout and
    continually probe the health check endpoint until a good response is received.
    Many container orchestration frameworks offer health checks out of the box and
    Docker has introduced native support for a healthcheck command in a Dockerfile


