    # # The Move to Microservices


    One of the early use cases for Docker containers was the process isolation—the
    fact that multiple application instances could be deployed onto the same hardware
    without the need for a virtual machine hypervisor. Arguments emerged that suggested
    running only a single process per container was best practice, and that runtime
    limits should be minimal and the artifacts deployed into them should be monolithic
