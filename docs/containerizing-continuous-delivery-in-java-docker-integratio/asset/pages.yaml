  md: '# # Nonfunctional Testing: Security Across the System


    Security should be of paramount concern to any developer, regardless of whether
    deployment is occurring in containers. However, executing Java applications within
    a containerized runtime can add new security attack vectors, and these must be
    mitigated.


    # ## Host-Level Security


    Any host running containers must be hardened at the operating system level. This
    includes:


    +   * Ensuring the latest operating system version available is being used, and
    the OS is fully patched (potentially with kernel hardening options like grseurity)

    * Ensuring the application attack surface exposed in minimized (e.g., correctly
    exposing ports, running applications behind a firewall with DMZ, and using certificate-based
    login)

    * Using application-specific SELinux or AppArmor

    * Using an application-specific seccomp whitelist possible

    * Enabling user namespaces


    The Center for Internet Security (CIS) regularly publishes guidance for running
    containers in production. The CIS Docker 1.12.0-benchmark can be found on the
    CIS website. The team has also created the Docker Bench for Security, which attempts
    to automate many of the checks and assertions that the CIS documentation recommends.
    The Docker Bench for Security tool can be downloaded and executed as a container
    on the target host, and a comprehensive report about the current state of the
    machine''s security will be generated. Ideally, execution of the Docker Bench
    Security should be conducted on the initialization of any host that will be running
    containers, and also periodically against all servers to check for configuration
    drift or new issues. This process can be automated as part of an infrastructure
    build pipeline.


    # ## Container-Level Security


    Java developers may not be used to dealing with OS-level security threats, but
    will be exposed to this when packaging applications'
  merge: -1
  pgno: 54
- img_proc: true
  md: 'within containers. A Docker image running a Java application will typically
    include a Linux-based operating system such as Alpine, Ubuntu, or Debian Jessie,
    and may also have other tool installed via a package manager. Ensuring the OS
    and all associated software is up-to-date and configured correctly is very challenging
    without automation. Frankly, tooling like CoreOS''s open source Clair project
    can be used to statically analyze Docker images for vulnerabilities. This tool
    can be integrated within a build pipeline, or if Docker images are being pushed
    to a centralized image repository like Docker Hub or CoreOS Quay, then this will
    most likely be enabled by default (but do take care to ensure it is, and also
    actionable results—such as vulnerability detection—are fed back into the build
    pipeline).


    # Application-Level Security


    Any build pipeline should include automated security testing in addition to manual
    vulnerability analysis and penetration testing. Tooling such as OWASP ZAP and
    Continuum bdd-security can also be included in a standard build pipeline, and
    run at the (micro)service/application and system-level testing phases.


    # Additional Reading


    Further information on security aspects of running containers can be found in
    Adrian Mouat''s Using Docker (O''Reilly) or Aaron Grattafori''s white paper “Understanding
    and Hardening Linux Containers.”'
  merge: -1
