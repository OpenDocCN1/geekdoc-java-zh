  md: '# 9. Disponability: Maximize robustness with fast startup and graceful shutdown


    This can require a mindset shift with developers who are used to creating a traditional
    long-running Java application, where much of the expense of application configuration
    and initialization was front-loaded in the JVM/application startup process. Modern,
    container-ready applications utilize more just-in-time (JIT) configuration, and
    ensure that best efforts are taken to clean up resource and state during shutdown.
    The JDK exposes hooks for JRE/application startup and shutdown, and Docker (and
    the OS) can be instructed to call these, such as issuing SIGTERM (versus SIGKILL)
    to running processes within a container.


    # 10. Dev/prod parity: Keep development, staging, and production as similar as
    possible


    The use of Docker in orchestration with technologies like Docker Swarm, Kubernetes,
    and Mesos can make this easier in comparison with traditional bare metal deployments
    where the underlying hardware and OS configuration is significantly different
    than developer or test machines. As an application artifact moves through the
    build pipeline, it should be exposed to more and realistic environments (e.g.,
    unit testing can run in-memory [within a Docker container] on a build box). However,
    end-to-end testing should be conducted in a production-like environment (e.g.,
    if you are running Docker Swarm in production, you should be testing on Docker
    Swarm).


    # 11. Logs: Treat logs as ever event streams


    Java has had a long and sometimes arduous relationship with logging frameworks,
    but modern frameworks like Logback and Log4j 2 can be configured to stream standard
    output (and hence viewed when running in a container by using the docker logs
    command) or streamed to disk (which can be mounted from the host running container).


    # 12. Admin processes: Run admin/management tasks as one-off processes


    The ability to create simple Java applications that can run within a Docker container
    contains all administrative tasks to be run as one-off processes. However, these
    processes must be tested within (or as part of) the build pipeline.'
