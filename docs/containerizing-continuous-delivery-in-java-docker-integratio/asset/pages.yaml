    # The Impact of Docker on Java Application Architecture


    > “If you can''t build a [well-structured] monolith, what makes you think microservices
    are the answer?”


    —Simon Brown, Coding the Architecture


    Continuously delivering Java applications within containers require several long-standing
    architectural patterns and paradigms be challenged (along with new properties
    imposed like potential for automation and immutability with new properties provide
    resource-restriction and transience) means that new architecture and configuration
    approaches are required. This chapter looks at examples of these changes, such
    as the Twelve-Factor Application, the decomposition of monolithic applications
    into smaller API-driven composable components (microservices), and the need to
    develop mechanical sympathy—an appreciation and respect for the underlying deployment
    fabric.


    # Cloud-Native Twelve-Factor Applications


    In early 2012, Platform-as-a-Service (PaaS) pioneer Heroku developed the Twelve-Factor
    App, a series of rules and guidance for helping developers build cloud-ready PaaS
    applications that:


    +   - Use declarative formats for setup automation, to minimize time and cost
    for new developers joining the project'
  merge: -1
