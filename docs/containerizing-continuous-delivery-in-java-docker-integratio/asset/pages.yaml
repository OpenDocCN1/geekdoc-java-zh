- img_proc: true
  md: 'The built-in Docker stats command returns a live data stream of basic metrics
    for running containers, as shown in Figure 5-2.


    ![](img/4d47989b22b26f7571903fa9a64cdd6d_58_0.png)


    **Figure 5-2.** Command line output from docker stats command


    More detailed information about a container''s resource usage can also be found
    enabling and using the Docker Remote API, which is exposed as a REST-like API.


    cAdvisor (Container Advisor) is Google''s container monitoring daemon that collects,
    aggregates, and exports information about running containers (see Figure 5-3).
    Specifically, for each container it keeps resource isolation parameters, historical
    resource usage, histograms of complete historical resource usage, and network
    statistics. This data is exported by container and machine-wide.


    Sysdig is a container-friendly, open source, system-level exploration tool that
    can capture system state and activity from a running Linux instance, then save,
    filter, and analyze this data. Sysdig is scriptable in Lua and includes a command-line
    interface and a powerful interactive UI, csydig, that runs in a terminal.'
  merge: -1
