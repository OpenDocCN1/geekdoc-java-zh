  md: '# CHAPTER 6


    # Conclusion and Next Steps


    In a book of this size, it would be impossible to cover every detail about continuously
    delivering Java applications in Docker. Instead, we have attempted to highlight
    core areas for consideration, and also provide several practical examples for
    getting started. The value of implementing continuous delivery cannot be underestimated,
    and the increase in speed of feedback combined with the ability to reliably and
    repeatedly guarantee quality is a true game changer. The flexibility provided
    by packaging Java applications within Docker is also not to be be underestimated,
    and what might at first glance appear to be a strange marriage between a 20-year-old
    programming language and an emerging packaging and runtime format can add a lot
    of flexibility to building, testing, and deploying applications.


    The true benefits of continuously delivering Java applications within Docker rarely
    starts to emerge when these approaches and technologies are combined with a holistic
    approach to agility—embracing agile and lean practices at the business level,
    designing evolutionary architectures with patterns like microservices, developing
    and testing software using techniques from extreme programming (XP), deploying
    software to programmatically defined agile infrastructure such as cloud and modern
    cluster managers, and also supporting the growth of a DevOps culture and shared
    responsibility.


    There is much to learn, but we hope this guide serves you as well as an introduction!'
  merge: -1
