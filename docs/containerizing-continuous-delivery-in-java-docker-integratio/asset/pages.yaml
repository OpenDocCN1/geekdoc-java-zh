  md: '# Introduction


    > "It is not the most intellectual of the species that survives; it is not the
    strongest that survives; but the species that survives is the one that is able
    to adapt and adjust to the changing environment in which it finds itself."


    —C. Megginson, interpreting Charles Darwin


    Java is a programming language with an impressive history. Not many other languages
    claim 20-plus years of active use, and the fact that the platform is still evolving
    to adapt to modern hardware and developer requirements will only add to this longevity.
    Many things have changed during the past 20 years in the IT industry, and the
    latest trend of packaging and deploying applications in containers is causing
    a seismic shift in how software is developed. The open source release of Docker
    in March 2013, developers have rapidly become captivated with the promises that
    accompany this technology. The combination of a well-established language like
    Java and an emerging technology such as Docker may appear at first glance like
    a strange mix. But, it is not. Packaging applications that were developed using
    the production-ready, battle-hardened Java within flexible container technology
    can bring the best of both worlds to any project.


    As is with the introduction of any new paradigm or technology, some things must
    change. The process of containerizing Java applications is no exception, especially
    when an organization or development team aspires to practice continuous delivery.
    The emergence of practices like continuous integration and continuous delivery
    is currently transforming the software development industry, where short technical
    feedback cycles, improved functional/nonfunctional validation, and rapid deployment
    are becoming enablers. If'
  merge: -1
  pgno: 8
- img_proc: true
  md: 'we combine this with public cloud technology and programmable infrastructure,
    we have a potent recipe for deploying applications that can scale cost-effectively
    and on demand. Because not every-thing can be covered in a book of this size,
    the primary aim is to provide the reader with a practical guide to continuously
    delivering Java applications deployed within Docker containers. Let’s get started!


