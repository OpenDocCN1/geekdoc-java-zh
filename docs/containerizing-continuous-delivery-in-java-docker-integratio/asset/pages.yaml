  md: '![](img/4d47989b22b26f7571903fa9a64cdd6d_59_0.png)


    Figure 5-3. Web UI of cAdvisor showing local container metrics


    # # Application-Level Metrics and Health Checks


    Developers should expose important application metrics via API endpoints, like
    those provided by CodaHale''s Metrics library and Spring Boot''s Actuator. Metrics
    are typically exposed as gauges, counters, histograms, and timers, and relay vital
    information to both operators and business stakeholders. Many Java-based metric
    libraries also support the creation of health-check endpoints that can be queried
    by monitoring systems and load balancers in order to determine if the application
    instance is healthy and ready to accept traffic (Figure 5-4).'
