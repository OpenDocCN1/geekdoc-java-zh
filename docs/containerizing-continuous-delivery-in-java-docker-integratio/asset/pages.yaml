    # 5. Build, release, run: Strictly separate build and run stages


    For a compiled language such as Java, this guideline comes as no surprise (and
    with little choice of implementation!). It is worth mentioning that the flexibility
    provided by Docker means that separate containers can be used to build, test,
    and run the application, configured as appropriate. For example, a container can
    be created for build and test with a full OS, JDK, and diagnostic tools; and a
    container can be built for running an application in production with only a minimal
    OS or JRE. However, some may see this as an antipattern, as should only be one
    “source of truth” artifact that is created, tested, and deployed within the pipeline,
    and using multiple Docker images can lead to an impedance mismatch and configuration
    drift between images.


    # 6. Processes: Execute the app as one or more stateless processes


    Building and running a Java application as a series of microservices can be made
    easier by using Docker (the concept of microservice is explained later in this
    chapter).


    # 7. Port binding: Export services via port binding


    Java developers are used to exposing application services via ports (e.g., running
    an application on Jetty or Apache Tomcat). Docker compliments this by allowing
    the declarative specification of exposed ports within an Dockerfile, and Docker
    Compose also enables the same functionality when orchestrating multiple containers.


    # 8. Concurrency: Scale out via the process model


    Traditional Java applications typically take the opposite approach to scaling,
    as the JVM runs as a giant “uberprocess” that is often vertically scaled by adding
    more heap memory, or horizontally scaled by cloning and load-balancing across
    multiple running instances. However, the combination of decomposing Java applications
    into microservices and running these components within Docker containers can enable
    this approach to scalability. Regardless of the approach taken to implement scalability,
    this should be tested within the build pipeline.'
