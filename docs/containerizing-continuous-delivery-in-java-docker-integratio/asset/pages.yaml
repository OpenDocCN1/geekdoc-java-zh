  md: '# CHAPTER 5


    # Operations in the World of Containers


    > “You were not in control. You had no visibility: maybe there was a car in front
    of you, maybe not.”


    —Alain Prost, Formula Driver


    With continuous delivery, the build pipeline provides confidence that new or modified
    application features will work correctly, both at the functional and nonfunctional
    level. However, this is only part of the story for continuously delivering software
    to users—as soon as an application is released to production it must be monitored
    for signs of malfunction, performance issues, and security vulnerabilities.


    # Host-Level Monitoring


    Starting at the host level, it is essential that any machine running containers
    (and applications) provide hardware- and OS-level metrics. All cloud vendors provide
    an API for obtaining metrics such as CPU usage, disk and network I/O performance,
    and such an API is relatively easy to create and expose when running on bare metal
    (for example, using sar/sysstat). All Linux-based OSes provide excellent metrics,
    as number of processes running, run queue averages, and swap space usage.


    Regardless of where metrics originate, they should be collected and processed
    centrally, such as by using a tool like Prometheus, the'
  merge: -1
  pgno: 56
- img_proc: true
  md: 'InfluxData TICK stack, a SaaS-based offering like Datadog. Centralization not
    only provides a single place for developers and operators to manually monitor
    metrics, but also enables core alerts and automated warnings to be defined. Any
    unexpected or critical issues that require operator intervention should trigger
    a paging system like PagerDuty, and the on-call developer or operator must act
    the alert.


    All host and operating system-level logs should also be collected centrally, which
    is typically done by streaming logs to a tool like the Elasticsearch-Logstash-Kibana
    (ELK) stack (shown in Figure 5) or a commercial equivalent.


    ![](img/4d47989b22b26f7571903fa9a64cdd6d_57_0.png)


    Figure 5-1. Kibana UI dashboard, part of the ELK stack


    Operators may also consider running a host intrusion detection system (HIDS) if
    security or governance is of paramount concern (over and above hardening systems),
    and open source offers such as OSSEC or Bro Network Security Monitor.


    # Container-Level Metrics


    Monitoring at the container level ranges from as simple as the output to docker
    stats or using the more detailed overview provided by cAdvisor, to the full power
    of Sysdig.'
  merge: -1
