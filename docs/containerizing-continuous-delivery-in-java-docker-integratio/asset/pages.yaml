  md: '# Foreword


    Despite being around for more than two decades, Java is one of the most widely
    used programming languages today. Though it''s often associated with legacy, monolithic
    JEE apps, when combined with Docker and continuous delivery (CD) practices, tried-and-true
    Java becomes a valuable tool in a modern microservices-based application environment.


    In this report, author Daniel Bryant covers everything you need to know as you
    containerize your Java apps, fit them into CD pipelines, and monitor them in production.
    Bryant provides detailed step-by-step instructions with screenshots to help make
    the complex process as smooth as possible. By the end of the report, you will
    be well on your way to self-service deployments of containerized Java apps.


    One of the biggest challenges in production—Java or otherwise—is interconnecting
    them. With monolithic apps, everything remains on the same server, but microservices
    and containerizing apps introduces a new component you have to design and maintain:
    the network they use to communicate. With CD, the containers are continuously
    being updated and changing location, further complicating things.


    To help solve these networking and service discovery problems, we''ve created
    a series of reference architectures for microservices, powered by NGINX Plus.
    We''ve made it easy to connect, secure, and scale your distributed application
    by simply adding a few lines to a Dockerfile to embed NGINX Plus in your containers.
    Each container can then independently discover, route, and load balance to other
    services without the need for any middleware. This greatly speeds up communications
    between services and enables fast'
  merge: -1
