    \nFigure 2-11. Jenkins pipeline build configuration for djshopfront-component-test\n\
    \nFigure 2-12 shows the output from a typical execution of this test.\n\nRunning\
    \ Docker as a Deployment Fabric | 27\n\n![](img/4d47989b22b26f7571903fa9a64cdd6d_37_0.png)\n\
    \nFigure 2-12. Jenkins build logs from a successful run of djshopfront-component-test\n\
    \n## Using Docker Compose for E2E Testing\n\nThe acceptance and performance testing\
    \ stage of the pipeline, Location 4 in Figure 2-1, can be further modified with\
    \ the introduction of Docker by using Docker Compose, a tool for defining and\
    \ running multicontainer Docker applications. Using the same approach above with\
