    +   - Have a clean contract with the underlying operating system, offering maximum
    portability between execution environments

    - Are suitable for deployment on modern cloud platforms, minimizing the need for
    servers and systems administration

    - Minimize divergence between development and production, enabling continuous
    deployment for maximum agility

    - Can scale without significant changes to tooling, architecture, or development
    practices


    These guidelines were written before container technology became mainstream, but
    are all equally (if not more) relevant to Docker-based applications. Let''s looks
    briefly each of the factors now, and see how they map to continuously deploying
    Java applications within containers:


    +   **1. Codebase:** One codebase tracked in revision control, many deploys


    Each Java application (or service) should be tracked in a single, shared code
    repository, and Docker configuration files, such as Dockerfiles, should be stored
    alongside the application code.


    +   **2. Dependencies:** Explicitly declare and isolate dependencies


    Dependencies are commonly managed within Java applications using Maven or Gradle,
    and OS-level dependencies should be clearly specified in the associated Dockerfile.


    +   **3. Config:** Store config in the environment


    The Twelve-Factor App guidelines suggest that configuration data should be injected
    into an application via environment variables, although in practice many Java
    developers prefer to use configuration files, and there can be security issues
    with exposing secrets via environment variables. Storing nonsensitive configuration
    data in a remote service like Spring Cloud Config (backed by Git or Consul) and
    secrets in a service like HashiCorp''s Vault can be a good compromise. It is definitely
    not recommended to include secrets in a Dockerfile or Docker image.


    +   **4. Backing services:** Treat backing services as attached resources (typically
    consumed over the network)


    Java developers are accustomed to treating data stores and middleware in this
    fashion, and in-memory substitutes (e.g., HSQQLDB, Apache Qpid, and Stubbed Cassandra)
    or service virtualization (e.g.,'
