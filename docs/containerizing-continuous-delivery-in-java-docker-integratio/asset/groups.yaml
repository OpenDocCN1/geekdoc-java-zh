    \      def r = sh script: \"\\n            curl http://localhost:8010/health |\
    \ grep 'UP'\", returnStatus: true\\n            return (r == 0);\"\n    }\n  \
    \  }\n```\n\nFigure 2-11. Jenkins pipeline build configuration for djshopfront-component-test\n\
    \nFigure 2-12. Jenkins build logs from a successful run of djshopfront-component-test\n\
    \nRunning Docker as a Deployment Fabric | 27\n\n## The Impact of Docker on Architecture\n\
    \n“If you can't build a monolith, what makes you think microservices are the answer?”\
    \ — Simon Brown, Coding\n\nContinuously delivering Java applications within containers\
    \ require several architectural patterns and paradigms\n\n## Cloud-Native Applications\n\
    \nIn early 2012, Platform-as-a-Service (PaaS) pioneer Heroku developed the Twelve-Factor\
    \ App, a series of rules and guidance for helping developers build cloud-ready\
    \ applications that:\n\n- Use declarative formats for setup automation, to minimize\
    \ time and cost for new developers\n- Have a clean contract with the operating\
    \ system, offering maximum portability between execution environments\n- Minimize\
    \ divergence between development and production, enabling continuous deployment\n\
    - Can scale without significant changes to tooling, architecture, or development\
    \ practices\n\nThese guidelines were written before container technology became\
    \ mainstream, but are all equally (if not more) relevant to Docker-based applications.\
    \ Let's looks briefly each of the factors now, and see how they map to continuously\
    \ deploying Java applications within containers:\n\n**1. Codebase:** One codebase\
    \ tracked in revision control, many deploys\nEach Java application (or service)\
    \ should be tracked in a single, shared code repository, and Docker configuration\
    \ files, such as Dockerfiles, should be stored alongside the application code.\n\
    \n**2. Dependencies:** Explicitly declare and isolate እንደሚ\nDependencies are commonly\
    \ managed within Java applications using Maven or Gradle, and OS-level dependencies\
    \ should be clearly specified in the associated Dockerfile.\n\n**3. Config:**\
    \ Store config in the environmentThe Twelve-Factor App guidelines suggest that\
    \ configuration data should be injected into an application via environment variables,\
    \ although in practice many Java developers prefer to use configuration files,\
    \ and there can be security issues with exposing secrets via environment variables.\
    \ Storing nonsensitive configuration data in a remote service like Spring Cloud\
    \ Config (backed by Git or Consul) and secrets in a service like HashiCorp's Vault\
    \ can be a good compromise. It is definitely not recommended to include secrets\
    \ in a Dockerfile or Docker image.\n\n**4. Backing services:** Treat backing services\
    \ as attached resources (typically consumed over the network)\nJava developers\
    \ are accustomed to treating data stores and middleware in this fashion, and in-memory\
    \ substitutes (e.g., HSQQLDB, Apache Qpid, and Stubbed Cassandra) or service virtualization\
    \ (e.g.,\n"
  mdcn: "\n\n## 使用 Docker 进行组件测试\n\n组件测试环境的创建以及相关测试的触发（图 2-1 中的位置 2）可以通过 Jenkins Pipeline\
    \ 任务和 CloudBee Docker Pipeline 插件来实现，该插件的安装方式与之前提到的 CloudBee 插件类似。安装完成后创建一个名为\
    \ `djshopfront-component-test` 的 Pipeline 类型新项目并点击 OK。\n\n## Jenkins 流水线的威力（曾称为\
    \ Workflow）\n\n正如 Jenkins 网站上所述，虽然标准的 Jenkins 自由风格任务（freestyle jobs）通过允许你在应用程序生命周期中定义顺序任务来支持简单的持续集成，但它们无法创建跨越计划内或非计划重启的持久执行记录，无法让一个脚本处理复杂工作流中的所有步骤，也无法提供流水线的优势。\n\
    \nPipeline 功能允许 Jenkins 支持持续交付（CD）。Pipeline 插件的构建是满足了对灵活、可扩展且基于脚本的 CD 工作流能力的需求。\n\
    \n流水线的一项核心功能是在构建过程中定义阶段（stages），这既有助于清晰地分离构建过程中不同部分的配置，也能将结果报告进行分离。\n\n滚动到生成的项目配置页面中的\
    \ Pipeline 部分，并输入以下内容：\n\n```\nnode {\n  stage('Successful startup check') {\n\
    \    docker.image('danielbryantuk/djshopfront')\n    .withRun('-p 8010:8010')\
    \ {\n      timeout(time: 30, unit: 'SECONDS') {\n        waitUntil {\n       \
    \   r = sh script: \"\\n            curl http://localhost:8010/health | grep \\\
    n              'UP'\", returnStatus: true\\n            return (r == 0);\"\n \
    \       }\n      }\n    }\n  }\n}\n```\n\n此流水线命令使用 CloudBee docker 镜像库运行 `danielbryant/djshopfront`\
    \ 镜像，设置 30 秒的超时（以允许等待 Spring Boot 应用程序初始化），并等待 curl 的应用程序健康接口返回 UP。\n\n## 健康检查的价值\n\
