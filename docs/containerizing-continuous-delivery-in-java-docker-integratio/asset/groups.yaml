    ## 5. 构建、发布、运行：严格分离构建和运行阶段


    对于 Java 这种编译型语言来说，这一指南并不意外（而且实现方式也并不多样！）。值得提到的是，Docker 灵活性意味着可以根据需要配置使用独立的容器来构建、测试和运行应用程序。例如，可以创建一个包含完整操作系统、JDK
    和诊断工具的容器用于构建和测试；也可以创建一个仅包含最小化操作系统或 JRE 的容器用于在生产环境中运行应用程序。然而，某些人可能认为这是一种反模式，因为流水线中应该只有一个被创建、测试和部署的“单一真源”构件，而使用多个
    Docker 镜像可能会导致镜像之间的阻抗匹配和配置漂移。


    ## 6. 进程：将应用作为一个或多个无状态进程执行


    使用 Docker 可以使构建和运行一系列微服务化的 Java 应用变得更容易（微服务的概念在本章稍后部分解释）。


    ## 7. 端口绑定：通过端口绑定导出服务


    Java 开发者习惯通过端口暴露应用程序服务（例如，在 Jetty 或 Apache Tomcat 上运行应用程序）。Docker 通过允许在 Dockerfile
    中声明式指定暴露的端口补充了这一点，而 Docker Compose 在编排多个容器时也实现了相同的功能。


    ## 8. 并发：通过进程模型进行扩展


    传统的 Java 应用程序在扩展方面通常采取相反的方法，因为 JVM 作为一个巨大的“超级进程”（uberprocess）运行，通常通过增加更多堆内存进行垂直扩展，或通过在多个运行实例之间进行克隆和负载均衡进行水平扩展。然而，将
    Java 应用拆分为微服务并并在 Docker 容器中运行这些组件相结合，可以实现这种扩展性方法。无论采取何种实现扩展的方法，都应该在构建流水线中进行测试。


    ## 9. 可用性：通过快速启动和优雅关闭提高稳健性


    这可能需要习惯于创建传统的长时间运行 Java 应用的开发者进行思维转变。在传统应用中，配置和初始化的大部分开销都置于 JVM/应用程序启动过程中。现代的、容器就的应用程序利用了更多的即时（JIT）配置，并确保在关闭期间尽力清理资源和状态。JDK
    暴露了 JRE/应用程序启动和关闭的钩子，可以指令 Docker（以及操作系统）调用这些钩子，例如向容器内的运行进程发送 SIGTERM（而非 SIGKILL）。


    ## 10. 开发/生产一致性：保持开发、测试和生产环境尽可能相似


    与 Docker Swarm、Kubernetes 和 Mesos 等技术结合使用 Docker，相比传统的裸机部署，这变得更容易——后者的底层硬件和操作系统配置与开发者或测试机器显著不同。随着应用程序构件在构建流水线中移动，它应该暴露在更多、更真实的环境中（例如，单元测试可以在构建机上的内存中[Docker
    容器内]运行）。然而，端到端测试应该在类生产环境中进行（例如，如果你在生产环境中运行 Docker Swarm，那么你应该在 Docker Swarm 上进行测试）。


    ## 11. 日志：将日志视为不断的事件流


    Java 与日志框架之间有着长久且有时艰辛的关系，但 Logback 和 Log4j 2 等现代框架可以配置为流式标准输出（因此在容器中运行时，可以通过 `docker
    logs` 命令查看）或流式传输磁盘（可以从运行容器的宿主机挂载）。


    ## 12. 管理进程：将管理/维护任务作为一次性进程运行


    创建可以在 Docker 容器内运行的简单 Java 应用的能力，包含了所有作为一次性进程运行的管理任务。然而，这些进程必须在构建流水线内部（或作为其一部分）进行测试。


    本章的这一节尝试总结使用“十二因子应用”（Twelve-Factor App）原则的益处。对于寻求深入理解的开发者，可以参考 Kevin Hoffman 的《Beyond
    the Twelve-Factor》。


    ## 向微服务迁移


    使用 Docker 的早期用例之一是进程隔离——许多论点认为每个容器运行单个进程是最佳实践，这使得微服务化的 Java 应用变得容易。将现有的单体应用拆分，或者通过微服务组合来创建一个新应用，是一项艰巨的任务。诸如领域驱动设计中的映射技术可以帮助开发者理解生产环境中运行的应用程序构件。这些论点结合软件开发的其他趋势，导致了这种新架构风格的流行。


    本书深入探讨了微服务的概念；如果想了解关于该主题的介绍，可以参考 Christian Post 的《Microservices for Java》，更详尽的处理可以参考
    Sam Newman 的《BuildingMicroservices》。然而，Amundsen 等人的《Microservice Architecture》提到，许多开发者正结合容器化技术采用这种架构风格。


    ### 不要将微服务与容器技术混淆


    人们很容易将微服务与容器技术（特指 Docker）混淆，但微服务模式是一种架构风格，而容器是一种打包技术。尽管微服务和 Docker 是互补的，但实现一个并不一定需要另一个。


    微服务的核心概念围绕创建遵循单一职责原则且只有一个变更原因的服务。构建基于 Java 的微服务以以下方式影响 CD：


    - 需要创建和管理多个构建流水线（或流水线中的分支）

    - 多个服务的部署现在需要进行编排和管理

    - 组件测试现在可能需要对 mock 或 stub 服务

    - 端到端测试现在需要在执行测试前后编排多个服务及相关状态

    - 必须实现服务版本控制流程（例如，允许部署相互兼容的服务）

    - 监控、指标和应用性能管理（APM）工具必须适应多个服务


    一旦确定了服务边界，开发团队（以及利益相关者）就可以定义服务功能以及相关的接口——应用程序编程接口（API）。如果你想学习更多关于 API 设计，Mike
    Amundsen 的 OReilly 视频系列《Designing APIs for the Web》是一个很好的选择。许多团队尝试在初期定义服务 API，但实际上设计过程是迭代的。一种启用这种迭代方法的有效技术是行为驱动开发（BDD）技术，被称为“三剑客”，即任何需求都应该在至少一名开发者、一名测试人员和一个利益相关者的参与下定义。


    服务设计此阶段的典型输出包括：一组 BDD 风格的验收测试，用于断言组合'
