- md: "\n# Continuous Delivery of Java Applications with Docker\n\n> \"Integrating\
    \ containers into a continuous-delivery pipeline is far from easy. Along with\
    \ the benefits Docker brings, there are also challenges both technological and\
    \ process-related.\"\n—Viktor Farcic, author of DevOps 2.0\n\nThis chapter examines\
    \ the impact of introducing Docker into a Java application build pipeline. In\
    \ addition to looking at the theoretical issues, practical examples will also\
    \ be provided, with the goal being to enable a Java developer already familiar\
    \ with the basic concepts of Docker to start creating an appropriate pipeline.\
    \ For Java developers looking for an introductory explanation of Docker, Arun\
    \ Gupta's Docker for Java Developers is an excellent primer.\n\n# Adding Docker\
    \ to the Build Pipeline\n\nIntroducing Docker into a typical Java application\
    \ build pipeline will primarily impact 4 locations within the pipeline. The figure\
    \ below shows an extended example of the earlier Java application build pipeline\
    \ with the locations of change highlighted (Figure 2-1).\n\n## Figure 2-1. A Dockerized\
    \ Java application continuous delivery pipeline\n\nLocation 1, the developer's\
    \ machine, will now include packaging and running Java application within a Docker\
    \ container. Typically, testing will occur here in two phases: the first ensures\
    \ that the Java build artifact (JAR, WAR, etc.) is thoroughly tested, and the\
    \ second asserts that the container image wrapping the artifact has been assembled\
    \ correctly and functions as expected.\n\nThe CI-driven packaging of the application\
    \ within a container is highlighted in Location 2. Notice now that instead of\
    \ pushing a Java build artifact (JAR, WAR, etc.) to an artifact repository, a\
    \ Docker image is being pushed to a centralized container registry, such as\n\n\
    ![](img/4d47989b22b26f7571903fa9a64cdd6d_17_0.png)\n\nDocker Hub. This Docker\
    \ image now becomes the single source of truth, as opposed to the WAR previously,\
    \ and this is the artifact promoted through the pipeline. It is worth noting that\
    \ some organizations may want to store code artifacts in addition to Docker images,\
    \ and accordingly JFrog's Artifactory can store them.\n\nLocation 3 for defining\
    \ and running multi-container Docker application (such as Docker Compose) could\
    \ be used to drive acceptance and performance testing. Other existing options\
    \ for orchestration and execution of build artifacts can also be used, including\
    \ Maven/Gradle scripts, configuration management tooling (e.g., Ansible, Chef,\
    \ Puppet), and deployment tooling like Capistrano.\n\nLocation 4 highlights that\
    \ application environments from QA to production must now change in order to support\
    \ the execution of Docker containers, with the testing of an application within\
    \ a production-like (containerized) environment as early as possible. Typically,\
    \ the creation of a container deployment environment would be implemented by the\
    \ container orchestration framework like Docker Swarm, Kubernetes, or Apache Mesos,\
    \ but discussing this is outside of the scope of this book.\n\nThe easiest way\
    \ to understand these changes is to explore them with an example Java application\
    \ and associated build pipeline. This is the focus of the next section.\n\n# Introducing\
    \ the Docker Java Shopping Application\n\nThroughout the remainder of this chapter,\
    \ we will be working with an example project that is a simplified representation\
    \ of an e-commerce application.\n\n# Obtaining the Example Project Code and Pipeline\n\
    \nFor the examples in this chapter, we will use a simple e-commercestyle Java\
    \ application named Docker Java Shopping, which is available via GitHub. The source\
    \ repository contains three applications (with Docker build templates), a Docker\
    \ Compose for deploying of these applications, and a fully functional Jenkins\
    \ build pipeline Vagrant virtual machine (VM) configuration. If you would like\
    \ to follow along with the examples in this chapter, please clone the repository\
    \ locally:\n\n```bash\ngit clone https://github.com/danielbryantuk/oreilly-docker-java-shopping/\n\
    ```\n\nThe GitHub repository root project directory structure can be seen in Figure-2-2.\n\
    \n![](img/4d47989b22b26f7571903fa9a64cdd6d_19_0.png)\n\nFigure 2-2. The Docker\
    \ Java Shopping project on GitHub\n\n# Docker Java Shopping Application Architecture\n\
    \nThe application follows the microservices-style architecture and consists of\
    \ three applications, or services. Don't be too concerned with the use of the\
    \ microservice pattern at the moment, as this will be discussed in Chapter 3,\
    \ and we will deal with each of the three services as applications in their own\
    \ right. The shopfront service has a UI that can be seen in Figure-2-3.\n\n![](img/4d47989b22b26f7571903fa9a64cdd6d_20_0.png)\n\
    \nFigure 2-3 shows the architecture of this system, with the shopfront Spring\
    \ Boot-based application acting as the main entry point. The shopfront application\
    \ is mainly concerned with displaying and aggregating information from two other\
    \ services that expose data via REST-like endpoints: the productcatalogue Dropwizard/Java\
    \ EE-based application provides data on the products in the system, and the stockmanager\
    \ Spring Boot-based application provides stock (SKU and quantity) data on the\
    \ associated products.\n\nIn the default configuration (running via Docker Compose),\
