    \ 53\n\n# Foreword\n\nDespite being around for more than two decades, Java is\
    \ one of the most widely used programming languages today. Though it's often associated\
    \ with legacy, monolithic JEE apps, when combined with Docker and continuous delivery\
    \ (CD) practices, tried-and-true Java becomes a valuable tool in a modern microservices-based\
    \ application environment.\n\nIn this report, author Daniel Bryant covers everything\
    \ you need to know as you containerize your Java apps, fit them into CD pipelines,\
    \ and monitor them in production. Bryant provides detailed step-by-step instructions\
    \ with screenshots to help make the complex process as smooth as possible. By\
    \ the end of the report, you will be well on your way to self-service deployments\
    \ of containerized Java apps.\n\nOne of the biggest challenges in production—Java\
    \ or otherwise—is interconnecting them. With monolithic apps, everything remains\
    \ on the same server, but microservices and containerizing apps introduces a new\
    \ component you have to design and maintain: the network they use to communicate.\
    \ With CD, the containers are continuously being updated and changing location,\
    \ further complicating things.\n\nTo help solve these networking and service discovery\
    \ problems, we've created a series of reference architectures for microservices,\
    \ powered by NGINX Plus. We've made it easy to connect, secure, and scale your\
    \ distributed application by simply adding a few lines to a Dockerfile to embed\
    \ NGINX Plus in your containers. Each container can then independently discover,\
    \ route, and load balance to other services without the need for any middleware.\
    \ This greatly speeds up communications between services and enables fast SSL/TLS\
    \ connections. To learn more about our microservice reference architectures, please\
    \ visit nginx.com/mra.\n\nWe hope that you enjoy this report and that it helps\
    \ you use Java in exciting new ways.\n\n> — Faisal Memon, \nProduct Marketer,\
    \ NGINX Inc.\n\n# Introduction\n\n> \"It is not the most intellectual of the species\
    \ that survives; it is not the strongest that survives; but the species that survives\
    \ is the one that is able to adapt and adjust to the changing environment in which\
    \ it finds itself.\"\n\n—C. Megginson, interpreting Charles Darwin\n\nJava is\
    \ a programming language with an impressive history. Not many other languages\
    \ claim 20-plus years of active use, and the fact that the platform is still evolving\
    \ to adapt to modern hardware and developer requirements will only add to this\
    \ longevity. Many things have changed during the past 20 years in the IT industry,\
    \ and the latest trend of packaging and deploying applications in containers is\
    \ causing a seismic shift in how software is developed. Since the open source\
    \ release of Docker in March 2013, developers have rapidly become captivated with\
    \ the promises that accompany this technology. The combination of a well-established\
    \ language like Java and an emerging technology such as Docker may appear at first\
    \ glance like a strange mix. But, it is not. Packaging applications that were\
    \ developed using the production-ready, battle-hardened Java within flexible container\
    \ technology can bring the best of both worlds to any project.\n\nAs is with the\
    \ introduction of any new paradigm or technology, some things must change. The\
    \ process of containerizing Java applications is no exception especially when\
    \ an organization or development team aspires to practice continuous delivery.\
    \ The emergence of practices like continuous integration and continuous delivery\
    \ is currently transforming the software development industry, where short technical\
    \ feedback cycles, improved functional/nonfunctional validation, and rapid deployment\
    \ are becoming enablers. If we combine this with public cloud technology and programmable\
    \ infrastructure, we have a potent recipe for deploying applications that can\
    \ scale cost-effectively and on demand. Because not everything can be covered\
    \ in a book of this size, the primary aim is to provide the reader with a practical\
    \ guide to continuously delivering Java applications deployed within Docker containers.\
    \ Let’s get started!\n\n# Acknowledgments\n\nI would like to express gratitude\
    \ to the people who made writing this book not only possible, but also a fun experience!\
    \ First and foremost, I would like to thank Brian Foster for providing the initial\
    \ opportunity, and also extend this thanks to the entire O’Reilly team for providing\
    \ excellent support throughout the writing, reviewing, and publishing process.\
    \ Thanks to Arun Gupta for his very useful technical review, and to Nic (and the\
    \ entire notontheightstreet.com technical team), Tareq Abedrabdo, and the OpenCredo\
    \ and SpectLabs teams for support and guidance throughout the writing process.\
    \ Finally, I would like to thank the many people of the IT community that reach\
    \ out to me at conferences, meetings, and via my writing—your continued sharing\
    \ of knowledge, feedback, and questions are the reason I enjoy what I do so much!\n"
