    JVM 开销之和。

    - 另一个潜在问题源是容器通常共享主机上的单一熵源 (/dev/random)，这可能会被迅速耗尽。这表现为 Java 应用在安全功能初始化期间的加密操作（如令牌生成）中意外的停滞/阻塞。使用
    JVM 选项 -Djava.security.egd=/dev/urandom 通常是有有益的，但要注意这可能产生安全影响。

    - 容器技术（顺带地）向 JVM 暴露错误的资源可用性（例如，暴露给 JVM 应用的处理器核心数通常基于底层主机的属性，而不是应用于运行容器的限制）。

