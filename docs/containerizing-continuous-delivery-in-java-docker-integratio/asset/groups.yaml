    # 非功能测试：跨系统的安全性


    对于任何开发人员来说，安全性都应该是首要考虑的问题，无论部署是否在容器中进行。然而，在容器化运行时环境内执行 Java 应用程序可能会引入新的安全攻击向量，这些向量必须被缓解。


    ## 主机级安全


    任何运行容器的宿主机都必须在操作系统级别进行加固。这包括：


    - 确保使用可用的最新操作系统版本，并且操作系统已打全所有补丁（可能包含内核安全等内核加固选项）

    - 确保暴露的应用程序攻击面降至最低（例如：正确暴露端口、在带有 DMZ 的防火墙后运行应用程序，以及使用基于证书的登录）

    - 使用特定于应用的 SELinux 或 AppArmor

    - 尽可能使用特定于应用的 seccomp 白名单

    - 启用用户命名空间（user namespaces）


    互联网安全中心（CIS）定期发布生产环境中运行容器的指南。可以在 CIS 网站找到 CIS Docker 1.12.0-benchmark。团队还创建了 Docker
    Bench for Security，它尝试自动化 CIS 文档中推荐的许多检查和断言。Docker Bench for Security 工具可以作为容器在目标主机上下载并执行，并将生成关于机器当前安全状态的综合报告。理想情况下，应该在任何运行容器的主机初始化时执行
    Docker Bench Security，并定期对所有服务器执行，以检查配置漂移或新问题。此过程可以作为基础设施构建流水线的一部分进行自动化。


    ## 容器级安全


    Java 开发人员可能不习惯处理操作系统级别的安全威胁，但在容器内打包应用程序时将会面临这些威胁。运行 Java 应用程序的 Docker 镜像通常会包含基于
    Linux 的操作系统，如 Alpine、Ubuntu 或 Debian Jessie，并可能通过包管理器安装其他工具。在没有自动化的情况下，要确保操作系统和所有相关软件都是最新且配置正确是非常具有挑战性的。坦地说，可以使用像
    CoreOS 的开源 Clair 项目这样的工具来对 Docker 镜像进行静态漏洞分析。该工具可以集成到构建流水线中；或者如果 Docker 镜像被推送到类似
    Docker Hub 或 CoreOS Quay 的集中镜像仓库，那么该功能很可能是默认开启的（但要确保它已开启，并将可操作的结果——例如漏洞检测——回传到构建流水线中）。


    # 应用程序级安全


    任何构建流水线都应该在手动漏洞分析和渗透测试之外，包含自动化安全测试。诸如 OWASP ZAP 和 Continuum bdd-security 等工具也可以包含在标准构建流水线，并在（微）服务/应用程序以及系统级测试阶段运行。


    # 扩展阅读


    关于运行容器的安全性方面的更多信息，可以参考 Adrian Mouat 的著作 *Using Docker*（O''Reilly）或 Aaron Grattari
    的白皮书《Understanding and Hardening Linux Containers》。


    # 第 5 章


    # 容器世界中的运维


    > “你无法控制一切。你没有可见性：也许你前面有一辆车，也许没有。”


    — 阿兰·普罗斯特（Alain Prost），赛车手


    通过持续交付，构建流水线提供了信心，确保新的或修改的应用程序功能在功能和非功能层面都能正常工作。然而，这只是向用户持续交付软件的故事的一部分——一旦应用程序发布到生产环境，就必须对其故障迹、性能问题和安全漏洞进行监控。


    # 主机级监控


    从主机级别开始，任何运行容器（和应用程序）的机器都必须提供硬件和操作系统级别的指标。所有云厂商都提供一个 API 来获取 CPU 使用率、磁盘和网络 I/O
    性能等指标，这种 API 在裸机上运行时相对很容易创建和暴露（例如，使用 sar/sysstat）。所有基于 Linux 的操作系统都提供优秀的指标，如运行的进程数、运行队列平均值和交换空间使用情况。


    无论指标源自何处，都应该进行集中收集和处理，例如使用 Prometheus、InfluxData TICK 栈或 Datadog 这样的 SaaS 产品。集中化不仅为开发者和运维人员提供了手动监控指标的单一场所，还能定义核心告警和自动警告。任何需要运维人员干预的意外或关键问题都应该触发类似
    PagerDuty 的分页系统，值班开发者或运维人员必须对告警做出响应。


    所有主机和操作系统级别的日志也应该集中收集，这通常通过将日志流到 Elasticsearch-Logstash-Kibana (ELK) 栈（如图 5 所示）或同类的商业产品来实现。


    ![](img/4d47989b22b26f7571903fa9a64cdd6d_57_0.png)


    图 5-1. Kibana UI 仪表板，ELK 栈的一部分


    如果安全性或治理是首要考虑的问题（在系统加固之外），运维人员可能还会考虑运行主机入侵检测系统（HIDS），开源提供了如 OSSEC 或 Bro Network
    Security Monitor 等工具。


    # 容器级指标


    容器级别的监控范围广泛，从简单的 `docker stats` 输出或使用 cAdvisor 提供的更详细的概述，到 Sysdig 的强大功能。


    内置的 `docker stats` 命令返回运行容器的基础指标的实时数据流，如图 5-2 所示。


    ![](img/4d47989b22b26f7571903fa9a64cdd6d_58_0.png)


    **图 5-2.** docker stats 的命令行输出


    关于容器资源使用的的更详细信息也可以通过 Docker Remote API 找到，它以类似 REST 的 API 形式暴露。cAdvisor 是 Google
    的容器监控守护进程，负责收集、聚合和导出有关运行容器的信息（见图 5-3）。具体来说，对于每个容器，它保留了隔离参数、历史资源使用情况、直方图和网络统计数据。这些数据由一个容器友好的、开源系统级工具导出，该工具可以捕获系统状态、保存、过滤并分析这些数据。Sysdig
    包含一个命令行界面和一个在终端运行的强大交互式 UI。


