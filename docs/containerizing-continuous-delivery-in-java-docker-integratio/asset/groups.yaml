    UML 图的时代已经结束。架构师和开发者必须通过与新技术的接触，不断积累实践和操作经验。


    使用 Docker 等容器技术可以从根本上改变软件与其运行硬件之间交互的方式，意识到这些变化是有益的：


    - 由于开发者/操作人员的规范或资源竞争，容器技术可能会限制对系统资源的访问。

