    \ 53\n\n# 前言\n\n尽管 Java 已经存在了二十多年，但它仍然是今天最广泛使用的编程语言之一。尽管它通常与遗留的单体 JEE 应用相关，但当与\
    \ Docker 和持续交付 (CD) 实践相结合时，经受考验的 Java 就成为现代基于微服务的应用环境中非常有价值的工具。\n\n在本报告中，作者 Daniel\
    \ Bryant 涵盖了在将 Java 应用容器化、将其纳入 CD 流水线以及在生产环境中进行监控时所需的所有知识。Bryant 提供了带有截图的详细步骤说明，以帮助使这一复杂过程尽可能顺利。在报告结束时，你将能够顺畅实现容器化\
    \ Java 应用的自服务部署。\n\n生产环境（无论是 Java 还是其他）中最大的挑战之一就是将它们互连。对于单体应用，一切都留在同一台服务器上，但微服务和应用容器化引入了一个你必须设计和维护的新组件：它们用于通信的网络。在\
    \ CD 中，容器会不断更新并更改位置，这使得问题更加复杂。\n\n为了帮助解决这些网络和服务发现问题，我们创建了一系列由 NGINX Plus 驱动的微服务参考架构。通过在\
    \ Dockerfile 中添加几行代码将 NGINX Plus 嵌入容器，我们能够轻松地连接、保护和扩展您的分布式应用程序。每个容器都可以独立地发现、路由和负载均衡其他服务，而无需任何中间件。这极大地加快了服务之间的通信，并实现了快速的\
    \ SSL/TLS 连接。要了解更多关于我们的微服务参考架构，请访问 nginx.com/mra。\n\n我们希望你喜欢本报告，希望它能帮助你以令人兴奋的新方式使用\
    \ Java。\n\n> — Faisal Memon, \nNGINX Inc. 产品市场经理\n\n# 引言\n\n> “生存下来的不是智力最高的物种，也不是最强壮的物种；生存的是能够适应并调整环境的物种。”\n\
    \n——C. Megginson 引用达尔文\n\nJava 是一门拥有令人印象深刻的历史语言。没有多少语言可以声称拥有 20 多年的活跃历史，而且该平台仍在不断进化以适应现代硬件和开发者需求，这只会增加它的寿命。在\
    \ 20 年里，IT 行业发生了许多变化，封装和部署应用程序的最新趋势正引发软件开发领域的巨大变革。自 2013 年 3 月 Docker 开源以来，开发者迅速被这项技术的承诺所吸引。像\
    \ Java 这样成熟的语言与 Docker 这样新兴技术的结合，乍看似乎是一个奇怪的组合。但并非如此。将经过生产验证的 Java 应用灵活的容器技术，可以为任何项目带来两者的优势。\n\
    \n正如任何新范式或技术的引入，某些事情必须改变。Java 应用容器化也不例外，特别是当组织或团队希望实践持续交付时。持续集成和持续交付等实践的出现正在改变软件开发行业，短反馈周期、改进的功能/非功能验证以及快速部署正成为推动因素。我们将这些与公共云技术和可编程基础设施相结合，就有了按需成本效益部署应用程序的强大配方。由于书中无法涵盖所有内容，主要目标是为读者提供在\
    \ Docker 容器中部署 Java 应用的持续交付实践指南。让我们开始吧！\n\n# 致谢\n\n感谢所有让编写这本书成为可能并使其成为一段愉快经历的人们！首先，我要感谢\
    \ Brian Foster 提供的最初机会，并向整个 O’Reilly 团队表示感谢，他们在写作、评审和出版过程中提供了卓越支持。感谢 Arun Gupta\
