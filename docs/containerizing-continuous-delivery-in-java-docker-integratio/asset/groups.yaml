    ## 5. Build, release, run: Strictly separate build and run stages


    For a compiled language such as Java, this guideline comes as no surprise (and
    with little choice of implementation!). It is worth mentioning that the flexibility
    provided by Docker means that separate containers can be used to build, test,
    and run the application, configured as appropriate. For example, a container can
    be created for build and test with a full OS, JDK, and diagnostic tools; and a
    container can be built for running an application in production with only a minimal
    OS or JRE. However, some may see this as an antipattern, as should only be one
    “source of truth” artifact that is created, tested, and deployed within the pipeline,
    and using multiple Docker images can lead to an impedance mismatch and configuration
    drift between images.


    ## 6. Processes: Execute the app as one or more stateless processes


    Building and running a Java application as a series of microservices can be made
    easier by using Docker (the concept of microservice is explained later in this
    chapter).


    ## 7. Port binding: Export services via port binding


    Java developers are used to exposing application services via ports (e.g., running
    an application on Jetty or Apache Tomcat). Docker compliments this by allowing
    the declarative specification of exposed ports within a Dockerfile, and Docker
    Compose also enables the same functionality when orchestrating multiple containers.


    ## 8. Concurrency: Scale out via the process model


    Traditional Java applications typically take the opposite approach to scaling,
    as the JVM runs as a giant “uberprocess” that is often vertically scaled by adding
    more heap memory, or horizontally scaled by cloning and load-balancing across
    multiple running instances. However, the combination of decomposing Java applications
    into microservices and running these components within Docker containers can enable
    this approach to scalability. Regardless of the approach taken to implement scalability,
    this should be tested within the build pipeline.


    ## 9. Disponability: Maximize robustness with fast startup and graceful shutdown


    This can require a mindset shift with developers who are used to creating a traditional
    long-running Java application, where much of the expense of application configuration
    and initialization was front-loaded in the JVM/application startup process. Modern,
    container-ready applications utilize more just-in-time (JIT) configuration, and
    ensure that best efforts are taken to clean up resource and state during shutdown.
    The JDK exposes hooks for JRE/application startup and shutdown, and Docker (and
    the OS) can be instructed to call these, such as issuing SIGTERM (versus SIGKILL)
    to running processes within a container.


    ## 10. Dev/prod parity: Keep development, staging, and production as similar as
    possible


    The use of Docker in orchestration with technologies like Docker Swarm, Kubernetes,
    and Mesos can make this easier in comparison with traditional bare metal deployments
    where the underlying hardware and OS configuration is significantly different
    than developer or test machines. As an application artifact moves through the
    build pipeline, it should be exposed to more and realistic environments (e.g.,
    unit testing can run in-memory [within a Docker container] on a build box). However,
    end-to-end testing should be conducted in a production-like environment (e.g.,
    if you are running Docker Swarm in production, you should be testing on Docker
    Swarm).


    ## 11. Logs: Treat logs as ever event streams


    Java has had a long and sometimes arduous relationship with logging frameworks,
    but modern frameworks like Logback and Log4j 2 can be configured to stream standard
    output (and hence viewed when running in a container by using the docker logs
    command) or streamed to disk (which can be mounted from the host running container).


    ## 12. Admin processes: Run admin/management tasks as one-off processes


    The ability to create simple Java applications that can run within a Docker container
    contains all administrative tasks to be run as one-off processes. However, these
    processes must be tested within (or as part of) the build pipeline.


    This section of the chapter has attempted to summarize the benefits of using the
    principles from the Twelve-Factor App. For developers looking to develop a deeper
    understanding, Kevin Hoffman''s Beyond the Twelve-Factor App (O''Reilly) is a
    recommended read.


    ## The Move to Microservices


    One of the early use cases for Docker containers was the process isolation—the
    fact that multiple application instances could be deployed onto the same hardware
    without the need for a virtual machine hypervisor. Arguments emerged that suggested
    running only a single process per container was best practice, and that runtime
    limits should be minimal and the artifacts deployed into them should be monolithic
    applications. This proved a difficult (if not impossible) set of requirements
    for existing Java applications that were already running in production. These
    arguments, in combination with other trends in the software development industry,
    led to the increase in popularity of a new architectural style we now refer to
    microservices.


    This book covers the concept of microservices in depth; instead, an introduction
    to the topic can be found in Christian Post''s Microservices for Java Developers
    (O''Reilly), and a more thorough treatment can be found in Sam Newman''s Building
    Microservices (O''Reilly). However, Amundsen et al''s Microservice Architecture
    (O''Reilly), it is worth mentioning that many developers are embracing this architectural
    style in combination with adopting containerization technologies like Docker.


    ### Don''t Conflate Microservices with Container Technology


    It is tempting to conflate microservices with container technology (or Docker
    specifically), but the microservice pattern is an architectural style, and containers
    are a packaging/deployment technology. Although microservices and Docker are complementary,
    implementing one does not necessarily require the other.


    A core concept of microservices revolves around creating services that follow
    the single-responsibility principle and have one reason to change. Building Java-based
    microservices impacts the implementation of CD in several ways:


    - Multiple build pipelines (or branches within a single pipeline) must be created
    and managed

    - Deployment of multiple services to an environment now have to be orchestrated,
    managed, and tracked

    - Component testing may now have to mock, stub, or virtualize services

    - End-to-end testing must now orchestrate multiple services (and associated state)
    before and after executing tests

    - Process must be implemented to manage service version control (e.g., the enforcement
    of only allowing the deployment of compatible interdependent services)

    - Monitoring, metrics, and application performance management (APM) tool must
    be adapted to handle multiple services


    Decomposing an existing monolithic application, or creating a new application
    that provides functionality through a composite of microservices is a non-trivial
    task. Techniques such as mapping, from domain-driven design, can help developers
    (working alongside stakeholders and the QA team) understand how application/business
    functionality should be composed as a series of contexts or focused services.
    It is also critical to understand how to design service application programming
    interfaces (APIs).


    ## API-Driven Applications


    Once service boundaries have been determined, the development team (and stakeholders)
    can define service functionality and the associated interfaces—the application
    programming interfaces (APIs). Mike Amundsen''s O''Reilly video series "Designing
    APIs for the Web" is a good place if you want to learn more about API design.
    Many teams attempt to define a service API upfront, but in reality the design
    process will be iterative. A useful technique to enable this iterative approach
    is the behavior-driven development (BDD) technique named "The Three Amigos" where
    any requirement should be defined with at least one developer, one QA specialist,
    and one stakeholder present.


    The typical outputs from this stage of the service design process include: a series
    of BDD-style acceptance tests that asserts compo

