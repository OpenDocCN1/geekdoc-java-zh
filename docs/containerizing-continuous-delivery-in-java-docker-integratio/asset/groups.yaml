  - '[PAGE 33]


    +   - The artifact build process (and any unit, integration, and code quality
    tests) can be conducted separately from a job that packages the resulting JAR
    or WAR within a Docker image. This can save time and compute resources if a Docker
    image is not required upon every build.


    +   - Java artifacts can be stored in a Java artifact repository, such as Nexus,
    and pulled from this location into a Docker image within an additional job build.


    +   - Docker labels can be used to indicate artifact versions and metadata in
    the same format as the Maven groupId, artifactid, and version (GAV) format.


    +   - Jenkins jobs can be parameterized, and users upstream jobs can pass parameters
    to jobs to indicate the (label) version or other configuration options.


    +   - The Jenkins Promoted Build plugin can be used to "gate" build stages, and
    indicate when an artifact is ready to be promoted from one stage to the next.


    # # The Importance of Metadata


    It is important to understand, track, and manage artifacts that are produced within
    the build pipeline. Typical Java artifacts are versioned using GAV Maven coordinates,
    which follow principles of semantic versioning (semver); for example, 1.12.01
    (major.minor.patch). Additional metadata, such as the VCS commit SHA, QA control/audit
    information, and date/time of build is often included in manifest files. Docker
    has not yet standardized an approach to packaging this type of metadata, but several
    prominent members of the container community have proposed a label specification
    based on the use of Docker/container labels. You can learn more at label-schema.org.


    # # Running Docker as a Deployment Fabric


    The changes at Location 3 in Figure 2-1 indicate that any environment that previously
    ran Java applications as Fat JARS or deployed WARs must now be modified to instead
    run Docker containers.'
- md: "\n## Component Testing with Docker\n\nCreation of component test environments\
    \ and the triggering of associated tests (Location 2 in Figure 2-1) can be achieved\
    \ via the Jenkins Pipeline job type and the CloudBee Docker Pipeline plugin, which\
    \ can be installed in a similar manner to the previously mentioned CloudBee plugin.\
    \ After this has been installed, create a new item named djshopfront-component-test\
    \ of type Pipeline and click O.K.\n\n## The Power of Jenkins' Pipelines (Formerly\
    \ Workflow)\n\nAs stated on the Jenkins website, while standard Jenkins freestyle\
    \ jobs support simple continuous integration by allowing you to define sequential\
    \ tasks in an application lifecycle, they do not create a record of execution\
    \ that persists through planned or unplanned restarts, enable one script to address\
    \ all the steps in a complex workflow, or offer the other advantages of pipelines.\n\
    \nPipeline functionality allows Jenkins to support continuous delivery (CD). The\
    \ Pipeline plugin was built with requirements for a flexible, extensible, and\
    \ script-based CD workflow capability.\n\nA key feature of pipelines is the ability\
    \ to define stages within a build, which both help to clearly separate the configuration\
    \ of disparate parts of a build process and also separate the reporting of the\
    \ outcomes.\n\nScroll the resulting item configuration page to the Pipeline section,\
    \ and enter the following:\n\n```\nnode {\n  stage('Successful startup check')\
    \ {\n    docker.image('danielbryantuk/djshopfront')\n    .withRun('-p 8010:8010')\
    \ {\n      timeout(time: 30, unit: 'SECONDS') {\n        waitUntil {\n       \
    \   r = sh script: \"\\n            curl http://localhost:8010/health | grep \\\
    n              'UP'\", returnStatus: true\\n            return (r == 0);\"\n \
    \       }\n      }\n    }\n  }\n}\n```\n\nThis pipeline command uses the CloudBees\
    \ docker image library to run the danielbryant/djshopfront image, sets a timeout\
    \ for 30 seconds (to allow a max to wait for the Spring Boot application initialization),\
    \ and waits until the application health endpoint returns UP from a curl.\n\n\
    ## The Value of Health Checks\n\nThe provisioning of health checks are extremely\
    \ important when deploying applications into production, as an application that\
    \ is in trouble or cannot initialize correctly most likely indicates that it should\
    \ not be sent traffic (for example, adding the health check verification to a\
    \ load balancer that is managing traffic). Pausing for an arbitrary time for tests\
    \ within a build pipeline should also be avoided, as this can introduce nondeterministic\
    \ results depending on the load of the build server and timing of the build, and\
    \ accordingly it is best to set a timeout and continually probe the health check\
    \ endpoint until a good response is received. Many container orchestration frameworks\
    \ offer health checks out of the box and Docker has introduced native support\
    \ for a healthcheck command in a Dockerfile.\n\nThe curl/grep test above can be\
    \ replaced with any command or execution of any application that returns an exit\
    \ code to indicate success or failure (e.g., a test Docker container or JUnit-powered\
    \ test obtained from a Git repo).\n\nFigure 2-11 shows the example pipeline code\
    \ within the Jenkins configuration page. Save this item and run the associated\
