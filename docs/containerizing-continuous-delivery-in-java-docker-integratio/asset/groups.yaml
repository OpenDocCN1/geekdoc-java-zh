    # The Value of Health Checks


    The provisioning of health checks are extremely important when deploying applications
    into production, as an applications that is in trouble or cannot initialize correctly
    most likely indicates that it should not be sent traffic (for example, adding
    the health check verification to a load balancer that is managing traffic). Pausing
    for an arbitrary time for tests within a build pipeline should also be avoided,
    as this can introduce nondeterministic results depending on the load of the build
    server and timing of the build, and accordingly it is best to set a timeout and
    continually probe the health check endpoint until a good response is received.
    Many container orchestration frameworks offer health checks out of the box and
    Docker has introduced native support for a healthcheck command in a Dockerfile


    The curl/grep test above can be replaced with any command or execution of any
    application that returns an exit code to indicate success or failure (e.g., a
    test Docker container or JUnit-powered test obtained from a Git repo).


