    node {\n  stage('build') {\n    git url: 'https://github.com/danielbryant/oreilly-java-shopping.git'\n\
    \    // construct other build tasks\n  }\n\n  stage('end-to-end tests') {\n  \
    \  timeout(time: 60, unit: 'SECONDS') {\n    try {\n      sh 'docker-compose up\
    \ -d'\n    }\n\n    waitUntil { // application is up\n      def r\n```\n\n```\
    \ curl/grep test above can be replaced with any command or execution of any application\
    \ that returns an exit code to indicate success or failure (e.g., a test Docker\
