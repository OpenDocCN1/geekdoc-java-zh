    # # Nonfunctional Testing: Security Across the System


    Security should be of paramount concern to any developer, regardless of whether
    deployment is occurring in containers. However, executing Java applications within
    a containerized runtime can add new security attack vectors, and these must be
    mitigated.


    # ## Host-Level Security


    Any host running containers must be hardened at the operating system level. This
    includes:


    +   * Ensuring the latest operating system version available is being used, and
    the OS is fully patched (potentially with kernel hardening options like grseurity)

    * Ensuring the application attack surface exposed in minimized (e.g., correctly
    exposing ports, running applications behind a firewall with DMZ, and using certificate-based
    login)

    * Using application-specific SELinux or AppArmor

    * Using an application-specific seccomp whitelist possible

    * Enabling user namespaces


    The Center for Internet Security (CIS) regularly publishes guidance for running
    containers in production. The CIS Docker 1.12.0-benchmark can be found on the
    CIS website. The team has also created the Docker Bench for Security, which attempts
    to automate many of the checks and assertions that the CIS documentation recommends.
    The Docker Bench for Security tool can be downloaded and executed as a container
    on the target host, and a comprehensive report about the current state of the
    machine''s security will be generated. Ideally, execution of the Docker Bench
    Security should be conducted on the initialization of any host that will be running
    containers, and also periodically against all servers to check for configuration
    drift or new issues. This process can be automated as part of an infrastructure
    build pipeline.


    # ## Container-Level Security


    Java developers may not be used to dealing with OS-level security threats, but
    will be exposed to this when packaging applications'
  - '[PAGE 55]


    within containers. A Docker image running a Java application will typically include
    a Linux-based operating system such as Alpine, Ubuntu, or Debian Jessie, and may
    also have other tool installed via a package manager. Ensuring the OS and all
    associated software is up-to-date and configured correctly is very challenging
    without automation. Frankly, tooling like CoreOS''s open source Clair project
    can be used to statically analyze Docker images for vulnerabilities. This tool
    can be integrated within a build pipeline, or if Docker images are being pushed
    to a centralized image repository like Docker Hub or CoreOS Quay, then this will
    most likely be enabled by default (but do take care to ensure it is, and also
    actionable results—such as vulnerability detection—are fed back into the build
    pipeline).


    # Application-Level Security


    Any build pipeline should include automated security testing in addition to manual
    vulnerability analysis and penetration testing. Tooling such as OWASP ZAP and
    Continuum bdd-security can also be included in a standard build pipeline, and
    run at the (micro)service/application and system-level testing phases.


    # Additional Reading


    Further information on security aspects of running containers can be found in
    Adrian Mouat''s Using Docker (O''Reilly) or Aaron Grattafori''s white paper “Understanding
    and Hardening Linux Containers.”'
  - '[PAGE 56]


    # CHAPTER 5


    # Operations in the World of Containers


    > “You were not in control. You had no visibility: maybe there was a car in front
    of you, maybe not.”


    —Alain Prost, Formula Driver


    With continuous delivery, the build pipeline provides confidence that new or modified
    application features will work correctly, both at the functional and nonfunctional
    level. However, this is only part of the story for continuously delivering software
    to users—as soon as an application is released to production it must be monitored
    for signs of malfunction, performance issues, and security vulnerabilities.


    # Host-Level Monitoring


    Starting at the host level, it is essential that any machine running containers
    (and applications) provide hardware- and OS-level metrics. All cloud vendors provide
    an API for obtaining metrics such as CPU usage, disk and network I/O performance,
    and such an API is relatively easy to create and expose when running on bare metal
    (for example, using sar/sysstat). All Linux-based OSes provide excellent metrics,
    as number of processes running, run queue averages, and swap space usage.


    Regardless of where metrics originate, they should be collected and processed
    centrally, such as by using a tool like Prometheus, the'
  - '[PAGE 57]


    InfluxData TICK stack, a SaaS-based offering like Datadog. Centralization not
    only provides a single place for developers and operators to manually monitor
    metrics, but also enables core alerts and automated warnings to be defined. Any
    unexpected or critical issues that require operator intervention should trigger
    a paging system like PagerDuty, and the on-call developer or operator must act
    the alert.


    All host and operating system-level logs should also be collected centrally, which
    is typically done by streaming logs to a tool like the Elasticsearch-Logstash-Kibana
    (ELK) stack (shown in Figure 5) or a commercial equivalent.


    ![](img/4d47989b22b26f7571903fa9a64cdd6d_57_0.png)


    Figure 5-1. Kibana UI dashboard, part of the ELK stack


    Operators may also consider running a host intrusion detection system (HIDS) if
    security or governance is of paramount concern (over and above hardening systems),
    and open source offers such as OSSEC or Bro Network Security Monitor.


    # Container-Level Metrics


    Monitoring at the container level ranges from as simple as the output to docker
    stats or using the more detailed overview provided by cAdvisor, to the full power
    of Sysdig.'
  - '[PAGE 58]


    The built-in Docker stats command returns a live data stream of basic metrics
    for running containers, as shown in Figure 5-2.


    ![](img/4d47989b22b26f7571903fa9a64cdd6d_58_0.png)


    **Figure 5-2.** Command line output from docker stats command


    More detailed information about a container''s resource usage can also be found
    enabling and using the Docker Remote API, which is exposed as a REST-like API.


    cAdvisor (Container Advisor) is Google''s container monitoring daemon that collects,
    aggregates, and exports information about running containers (see Figure 5-3).
    Specifically, for each container it keeps resource isolation parameters, historical
    resource usage, histograms of complete historical resource usage, and network
    statistics. This data is exported by container and machine-wide.


    Sysdig is a container-friendly, open source, system-level exploration tool that
    can capture system state and activity from a running Linux instance, then save,
    filter, and analyze this data. Sysdig is scriptable in Lua and includes a command-line
    interface and a powerful interactive UI, csydig, that runs in a terminal.'
  - '[PAGE 59]


    ![](img/4d47989b22b26f7571903fa9a64cdd6d_59_0.png)


    Figure 5-3. Web UI of cAdvisor showing local container metrics


    # # Application-Level Metrics and Health Checks


    Developers should expose important application metrics via API endpoints, like
    those provided by CodaHale''s Metrics library and Spring Boot''s Actuator. Metrics
    are typically exposed as gauges, counters, histograms, and timers, and relay vital
    information to both operators and business stakeholders. Many Java-based metric
    libraries also support the creation of health-check endpoints that can be queried
    by monitoring systems and load balancers in order to determine if the application
    instance is healthy and ready to accept traffic (Figure 5-4).'
