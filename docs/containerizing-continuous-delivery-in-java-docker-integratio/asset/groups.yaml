    # 第 6 章


    # 结论与后续步骤


    在如此规模的一本书中，我们无法涵盖在 Docker 中持续交付 Java 应用的每一个细节。相反，我们试图强调需要考虑的核心领域，并为入门提供几个实用的示例。实施持续交付的价值不容低估，而反馈速度的提升，结合可靠且重复地保障质量的能力，确实是真正的游戏规则改变者。在
    Docker 中封装 Java 应用所提供的灵活性也不容低估；初看之下，这种 20 年历史的编程语言与新兴封装及运行时格式之间的结合似乎有些奇怪，但它可以为应用程序的构建、测试和部署增加许多灵活性。


    当这些方法和技术与整体敏捷性方法相结合时，在 Docker 中持续交付 Java 应用的真正收益才开始显现——这种方法包括：在业务层面采用敏捷和精益实践，使用微服务等模式设计演进式架构，使用极端编程（XP）技术进行软件开发和测试，将软件部署到程序定义的敏捷基础设施（如云和现代集群管理器），以及支持
    DevOps 文化的增长和共同责任制。


    要学习的还有很多，但我们希望本指南能为你提供帮助，并作为一个良好的介绍！


    # 关于作者


    Daniel Bryant 是 OpenCredo 的首席科学家和 Specto-Labs 的首席技术官。作为技术领袖并追求成为典型的“通才型专家”，他目前的工作包括通过引入更好的需求收集方法来实现组织的敏捷性、关注架构在敏捷开发中的相关性、实施高质量的测试策略以及促进持续集成/交付。


    Daniel 目前的技术专长专注于 DevOps 工具、云/容器平台以及微服务实现。他还是伦敦 Java 社区（LJC）的领导者，为多个开源项目做出贡献，为
    O''Reilly、InfoQ 和 Voxed 等知名技术网站撰写文章，并定期在 QCon、JavaOne 和 Devoxx 等国际会议上进行演讲。

