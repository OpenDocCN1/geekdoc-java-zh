    # # Don’t Use the “latest” Docker Image Tag


    Any application artifact deployed via a build pipeline must have a version associated
    with it; otherwise, it is impossible to know when the artifact was built and what
    functionality (and compatibility with other applications) offers. In the Java
    world, we are using to use GAV Maven coordinates—groupId, artifacts, and version.
    Docker allows images to be versioned with a tag, which can be an arbitrary string;
    we will discuss the impact this has on versioning in more depth. However, it is
    worth mentioning that Docker offers a latest tag, but this is unfortunately one
    of the most misunderstood tags, and simply indicates the last/tag that ran without
    a spe-


