    # CHAPTER 1


    # Continuous Delivery Basics


    > “Our highest priority is to satisfy the customer through early and continuous
    delivery of valuable software.”

    —First principle of the Agile Manifesto


    Continuous delivery (CD) is fundamentally a set of practices and disciplines in
    which software delivery teams produce valuable and robust software in short cycles.
    Care is taken to ensure that functionality is added in small increments and that
    the software can be reliably released at any time. In 2010, Jez Humble and Dave
    Farley published their seminal book Continuous Delivery (Addison-Wesley), which
    collated their experiences working on software delivery projects around the world,
    and this publication is still the go-to reference for CD. The book contains a
    very valuable collection of techniques, methodologies, and advice from the perspective
    of both technology and organizations. One of the core recommended practices of
    CD is the creation of a build pipeline, through any candidate change to the software
    being built is integrated, tested, and validated before determining that it is
    ready for deployment to a production environment.


    # Continuous Delivery with a Java Build Pipeline


    Figure 1-1 demonstrates a typical continuous delivery build pipeline for a Java-based
    monolithic application. The first step of the process of CD is continuous integration
    (CI). Code that is created on a developer’s laptop is continually committed (integrated)
    into a shared version control repository, and automatically begins its journey
    through the entire pipeline.


    ![](img/4d47989b22b26f7571903fa9a64cdd6d_11_0.png)


    Figure 1-1. A typical Java application continuous delivery pipeline


    The primary goal of the build pipeline is to prove that changes are production-ready.
    A code of configuration modification can fail at any stage of the pipeline, and
    this change will accordingly be rejected and not marked as ready for deployment
    to production.


    # Feature Branching and CI


    It''s worth noting that many people argue that code must be continually integrated
    (at least daily) into a trunk/master/development branch if one is practicing CI.
    An associated antipattern for this practice is long-lived feature branches that
    are not continually merged with the main codebase, and which often result in “merge
    hell” when they are integrated. Steve Smith has contributed several informative
    articles on this subject.


    Initially, the software application to which a code change is being applied is
    built and tested in isolation, and some form of code quality analysis (should)
    also be applied, perhaps using a tool like Sonar Qube. Code that successfully
    passes the initial unit and component tests the code-quality metrics moves to
    the right in the pipeline, and is exercised within a larger integrated context.
    Ultimately, code that has fully validated emerges from the pipeline and is marked
    as ready for deployment into production. Some organizations automatically deploy
    applications that have successfully navigated the build pipeline and passed all
    quality checks—this is known as continuous delivery.


    # Maximize Feedback: Automate All the Things


    The build pipeline must provide rapid feedback for the development team in order
    to be useful within their daily work cycles. Accordingly, automation is used extensively
    (with the goal of 100% automation) as this provides a reliable, repeatable, and
    error-free approach to processes. The following items should be automated:


    - Software compilation and code-quality status analysis

    - Functional testing, including unit, component, integration, and end-to-end

    - Provisioning of all environments, including the integration of logging, monitoring,
    and alerting hooks

    - Deployment of software artifacts to all environments, including production

    - Data store migrations

    - System testing, including nonfunctional requirements like fault tolerance, performance,
    and security

    - Tracking and auditing of change history


    # The Impact of Containers on Continuous Delivery


    Java developers will look at Figure 1-1 and recognize that in a typical Java build
    pipeline, these two are consistent regardless of the application framework (like
    Java EE or Spring) being used. The first is that Java applications are often packaged
    as Java Archives (JAR) or web application archive (WAR) deployment artifacts,
    and the second is that these artifacts are typically stored in an artifact repository
    as Nexus Apache Artifact, or Artificactory. This changes when developing Java
    applications that will ultimately be deployed within container technology like
    Docker.


    # Docker Isn''t the Only Container Technology


    It is worth noting that although this book focuses on the combination of Docker
    and Java, Docker is not the only technology available. Indeed, many people (including
    the author at times) conflate the words "container" and "Docker"; but this is
    not correct. Other container technologies include CoreOS and rkt, Canonical''s
    LXD, and Microsoft''s Windows Server Containers. Much of the high-level CD advice
    and patterns presented within this book will apply to all of these container technologies.


    Additional information for teams developing on a Windows platform can be found
    in the O''Reilly mini-book Continuous Delivery with Windows and .NET by Chris
    O''Dell and Matthew Skelton. Although this is .NET-focused, there are many useful
    chapters on Windows-related topics.


    Saying that a JAR file is similar to a Docker image is not a fair comparison.
    It is somewhat analogous to comparing an engine and a car—and following this analogy,
    Java developers are much more familiar with the skills required for building engines.
    For the scope of this book, an explanation of the basics of Docker is not included,
    the reader new to containerization and Docker is strongly encouraged to read Arun
    Gupta''s Docker for Java Developers and Adrian Mouat''s Using Docker for a deep-dive
    into the technology.


    Because Docker images run as containers within a host operating system, they typically
    include some form of operating system (OS), from lightweight ones like Alpine
    Linux or Debian Linux, to a fully-functional Linux distribution like Ubuntu, CentOS,
    or RHEL. The exception of running on OS inside a Docker container is the "scratch"
    base image that can be used when deploying statically compiled binaries (e.g.,
    when deploying applications) in Go. Regardless of the OS chosen, including Java,
    also require the packaging of a platform runtime that must be considered (e.g.,
    when deploying Java applications, a JVM must also be installed and running within
    the container).


    The packaging of a Java application within a container that includes a full OS
    often brings more flexibility, allowing, for example, the installation of OS utilities
    for debugging and diagnostics. However, with great responsibility (and increased
    risk). Packaging an OS within our build artifacts increases a developer''s area
    of responsibility, such as the security attack surface. Introducing Docker into
    the technology stack also means that additional build artifacts now managed within
    version control, such as the Dockerfile, which specifies what container image
    should be built.


    One of the core tenets of CD is testing in a production-like environment as soon
    as practical, and container technology can make this easier in comparison with
    traditional deployment fabrics like bare metal, OpenStack, or even cloud platforms.
    Docker-based orchestration frameworks that are used as a deployment fabric within
    a production environment, such as Docker Swarm, Kubernetes (nanokube), and Mesos
    (minimesos), can typically be spun up on a developer''s laptop or an inexpensive
    local or cloud instance.


    The increase in complexity of packaging and running Java applications within containers
    can largely be mitigated with an improved build pipeline—which we will be looking
    at within this book—and also an increased collaboration between developers and
    operators. This is one of the founding principles with DevOps movement.

