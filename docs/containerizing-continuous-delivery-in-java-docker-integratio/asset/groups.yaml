    ## Example 2-1. Typical output


    (master) oreilly-docker-java-shopping $ ls

    README.md docker-compose.yml resttests

    build_all.sh guests shopfront

    ci-vagrant productcatalogue stockmanager


    So far, this is nothing different from a typical Java project. However, there
    is also a Dockerfile in the shopfront directory. The contents are as follows:


    ```

    FROM jdk:8-jre

    ADD target/shopfront-0.0.1-SNAPSHOT.jar app.jar

    EXPOSE 8010

    ENTRYPOINT ["java", "-Djava.security.egd=/dev/urandom", "-jar", "/app.jar"]

    ```


    Assuming basic Docker knowledge, we can see that this Dockerfile is built from
    the default OpenJDK image with the 8-jre tag (ensuring that an OpenJDK8 JRE is
    installed within the base image), the shopfront application JAR is added to the
    image (and renamed to app.jar), and the entrypoint is set to execute the application
    via the java -jar <jar_file> command. Due to the scope of this book, the Dockerfile
    syntax will not be discussed in further detail in this chapter, as Arun''s Docker
    for Java Developers contains the majority of the commands that a developer will
    need.


    Now that the Java application JAR has been built, we can use the following Docker
    command in the shopfront directory to build the associated image:


    ```

    docker build -t danielbryantuk/djshopfront

    ```


    This builds a Docker image using the Dockerfile in the current directory (the
    specified build context of .) and tags (-t) the image as danielbryantuk/djshopfront.
    We now have a Docker image that can be run as a container with the following command:


    ```

    docker run -p 8010:8010 danielbryantuk/djshopfront

    ```


    After the application has initialized (visible via the logs shown after executing
    the run command), visit http://localhost:8010/health in a browser to confirm the
    successful startup (ss well worth noting that attempting to visit the shopfront
    UI will result in an error response, as the dependent productcatalogue and stockmanager
    applications have not been started). The docker run command can be stopped by
    issuing SIGINT via the key combination Ctrl-C.


    You should now have a basic understanding of how to build, package, and run Java
    applications locally via Docker. Let''s look at a few important questions that
    Docker using Java imposes, before we move to creating a Docker-based continuous
    delivery pipeline.


    ## Packaging Java Within Docker: Which OS, Which Java?


    Packaging a Java application within a Docker image may be the first time many
    Java developers have been exposed to Linux (especially if you develop Java applications
    on MS Windows), and as the result Docker container being running is within a production
    environment, this warrants a brief discussion.


    A Java developer who works in an organization that implements a similar pipeline
    as demonstrated in Figure 2-1 may not have been exposed to the runtime operational
    aspects of deployment; this developer may simply develop, test, and build a JAR
    or WAR file on their local, and push the code to a version control system. However,
    when an application is running in production, it runs on a deeper operational
    stack: a JAR or WAR file is typically run within an application container (e.g.,
    Tomcat, Websphere, etc.). When it runs on a Java JDK or JRE (Oracle, OpenJDK,
    etc.), which runs on an operating system (Ubuntu, CentOS, etc.), bare metal, VMs,
    cloud, etc.). When a developer packages an application within a Docker container,
    they are implicitly taking more responsibility further down this operational stack.


    Accordingly, a developer looking to incorporate the packaging of Java applications
    with a Docker container will have to discuss choices with their operations/sysadmin
    (or take individual responsibility for the deployment). The first decision is
    what operating system (OS) to use as the base image. For the reasons of size,
    performance, and security, Docker developers generally prefer base images with
    the smaller Linux distributions (e.g., Debian, Jessie, or Alpine) over traditional
    full-featured distributions (Ubuntu, RHEL). However, many organizations already
    have licenses or policies that dictate a certain distribution must be used. The
    same can often be said with the version of Java being used to run applications.
    Many organizations prefer to run the Oracle JDK or JRE, but the default Java Docker
    images available from the Docker Hub public container repository only offer OpenJDK
    for licensing reasons.


    Regardless of which OS and Java are chosen, it is essential that the usage is
    consistent throughout the pipeline; otherwise, unexpected issues may show up in
    production (e.g., if you are building on Ubuntu using the OpenJDK but running
    production on CentOS with Oracle''s JRE, then your application hasn''t been tested
    within a realistic production environment).


    ## Packing Java Within Docker: JDK or JRE?


    Although most Java development occurs alongside a full Java Development Kit (JDK),
    it is often beneficial to run an application using only a Java Runtime Environment
    (JRE). A JRE installation takes up less disk space, and due to the exclusion of
    many build and debugging tools has a smaller security attack surface. However,
    developing and testing, it is also convenient to run your application on a JDK,
    as includes additional tooling for easy debugging. It should be stated again,
    though, whatever you build and test must be identical to what is used in the production
    environment).


    ## Pushing Images to a Repository and Testing


    Traditional Java application deployment involved creating a JAR or WAR and pushing
    this to an artifact repository such as Nexus using a pipeline tool like Jenkins.
    Jenkins is an open source automation server written in Java that enables automation
    of the nonhuman (build pipeline) parts of the software development process. Alternatives
    to Jenkins include Bamboo, Team, and SaaS-based offers like TravisCI and CircleCI.


    Builds can be triggered in Jenkins by a variety of methods, such as code commit
    or a cron schedule, and resulting artifacts can be executed via external tooling
    like SonarQube. As shown in Location 2-1, with Docker-based deployment a Docker
    image is now pushed to a container registry, as such Docker Hub or JFrog''s Artifactory,
    rather than a traditional Java repository.


    In order to explore this next stage of the Java CD process, we need a Jenkins
    installation to illustrate the changes. Using HashiCorp’s Vagrant tool, the oreilly-docker-java-shopping
    project enables the construction of a Docker-enabled Jenkins server running on
    Ubuntu 16.04. To follow the instructions here, you must have locally installed
    the latest version of Vagrant and Oracle’s VirtualBox virtual machine hypervisor.


    ### Create a Jenkins Server via Vagrant


    From the docker-java-shopping project root, navigate into the ci-vagrant folder
    that contains a single Vagrant file. The Jenkins VM can be created by issuing
    the vagrant up command within this folder. The creation of the VM may take some
    time, especially on the first run, which downloads the Ubuntu 16.04 base image.
    While the VM is being created, the Vagrantfile can be explored to learn how the
    machine has been provisioned.


    The simple shell provisioning option has been used to install the necessary dependencies
    on a basic Ubuntu 16.04 base image. If you are familiar with Ubuntu operations,
    none of the commands should come as any surprise; if you aren''t, don''t overly
    concerned as this book focuses on the developer perspective on CD. It is worth
    noting that for a production-grade deployment of a Jenkins server, it would be
    typical to provision a machine using a configuration management tool like Puppet,
    Chef, or Ansible.


    Once the Jenkins Vagrant box is provisioned, you can navigate to http://localhost:8080,
    supply the Jenkins key that is provided in the terminal window at the end of the
    Vagrant provisioning process, create a Jenkins account, and install the recommended
    Jenkins plugins. One of the biggest technical strengths of Jenkins is that it
    is extremely extensible through the use of plugins, which can be installed to
    provide additional basic customization and functionality.


    Now navigate to the Manage Jenkins menu on the left of the Jenkins home page,
    and select Manage Plugins from the resulting main menu. Select the Available tab
    and search for docker. Approximately a quarter of down the page is a plugin named
    CloudBees Docker Build and Publish Plugin, which provides the ability to build
    projects with a Dockerfile and publish the resultant tagged image (repo) to the
    docker registry. Install this plugin without a restart and navigate back to the
    Jenkins home page.

    '
