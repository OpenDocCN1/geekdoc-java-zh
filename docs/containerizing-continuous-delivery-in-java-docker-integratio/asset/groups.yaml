    假设具备基本的 Docker 知识，我们可以看到此 Dockerfile 是基于带有 8-jre 标签的默认 OpenJDK 镜像构建的（确保了基础镜像中安装了
    OpenJDK8 JRE），shopfront 应用 JAR 包被添加到镜像中（并重命名为 app.jar），并且入口（entrypoint）被设置为通过
    `java -jar <jar_file>` 命令执行应用程序。由于本书的范围限制，本章将不再详细讨论 Dockerfile 语法，因为 Arun 的《Java
    开发者 Docker 指南》包含了开发者所需的大部分命令。


    现在 Java 应用 JAR 已构建完成，我们可以在 shopfront 目录下使用以下 Docker 命令来构建关联镜像：


    ```

    docker build -t danielbryantuk/djshopfront

    ```


    此命令使用当前目录下的 Dockerfile（指定的构建上下文为 `.`）构建 Docker 镜像，并将该镜像标记 (-t) 为 `danielbryantuk/djshopfront`。我们现在有了一个可以通过以下命令作为容器的
    Docker 镜像：


    ```

    docker run -p 8010:8010 danielbryantuk/djshopfront

    ```


    在应用程序初始化后（通过执行 run 命令后显示的日志可见），在浏览器中访问 http://localhost:8010/health 以确认成功启动（值得注意的是，尝试访问
    shopfront UI 将导致错误响应，因为依赖的 productcatalogue 和 stockmanager 尚未启动）。可以通过按组合键 Ctrl-C
    发送 SIGINT 来停止 docker run 命令。


    现在你应该已经对如何通过 Docker 在本地构建、打包和运行 Java 应用程序有了基本的了解。在移动到创建基于 Docker 的持续交付流水线之前，让我们来看
    Java 使用 Docker 时提出的几个重要问题。


    ## 在 Docker 中打包 Java：使用哪种 OS，哪种 Java？


    在 Docker 镜像中打包 Java 可能是许多 Java 开发者首次接触到 Linux（特别是如果你在 MS Windows 上开发 Java 应用程序），而且由于
    Docker 容器运行在生产环境中，这值得进行简要讨论。


    在实施如图 2-1 所示流水线的组织中工作的 Java 开发者可能没有接触过部署的运行时操作方面；该开发者可能仅在本地进行开发、测试和构建 JAR 或 WAR
    文件，并将代码推送到版本控制系统。然而，当应用程序在生产环境中运行时，它运行在更深层的操作栈上：JAR 或 WAR 文件通常运行在应用容器（例如 Tomcat、Websphere
    等）中；而它运行在 Java JDK 或 JRE（Oracle、OpenJDK 等）上，而这些环境又运行在操作系统（Ubuntu、CentOS 等）、裸机、虚拟机、云等上。当开发者在
    Docker 容器中打包应用程序时，他们隐含地承担了该操作栈更深处的责任。


    因此，寻求将 Java 应用程序打包与 Docker 容器相结合的开发者必须与其运维/系统管理员讨论选择（或自行承担部署责任）。第一个决定是使用哪种操作系统（OS）作为基础镜像。出于尺寸、性能和安全的考虑，Docker
    开发者通常倾向于使用较较小的 Linux 发行版（例如 Debian、Jessie 或 Alpine），而不是传统的全功能发行版（Ubuntu、RHEL）。然而，许多组织已经拥有规定必须使用特定发行版的许可或策略。对于用于运行应用程序的
    Java 版本通常也是如此。许多组织倾向于运行 Oracle JDK 或 JRE，但由于许可原因，从 Docker Hub 公共容器仓库提供的默认 Java
    Docker 镜像仅提供 OpenJDK。


    无论选择哪种 OS 和 Java，确保在整个流水线中的一致性都是至关重要的；否则，生产环境中可能会出现意之外的问题（例如，如果你在 Ubuntu 上使用 OpenJDK
    构建，但在 CentOS 上使用 Oracle 的 JRE 运行生产环境，那么你的应用程序就没有在真实的生产环境中进行过测试）。


    ## 在 Docker 中打包 Java：JDK 还是 JRE？


    尽管大多数 Java 开发都是配合完整的 Java 开发工具包（JDK）进行的，但仅使用 Java 运行时环境（JRE）运行应用程序通常是有益的。JRE 安装占用的磁盘空间较少，由于排除了许多构建和调试工具，其安全攻击面也较小。然而，在开发和测试时，在
    JDK 上运行应用程序也是方便的，因为它包含了额外的工具以便于调试。（尽管在此必须再次强调，你构建和测试的任何内容必须与生产环境中使用的内容完全一致）。


    ## 将镜像推送到仓库并测试


    传统的 Java 应用程序部署涉及创建 JAR 或 WAR，并使用 Jenkins 等流水线工具将其推送到 Nexus 等构制品仓库。Jenkins 是一个用
    Java 编写的开源自动化服务器，能够实现软件开发过程中非人工（构建流水线）部分的自动化。Jenkins 的替代方案包括 Bamboo、Team 以及基于
    SaaS 的产品，如 TravisCI 和 CircleCI。


    可以通过多种方法触发 Jenkins 中的构建，例如代码提交或 cron 计划任务，生成的产物可以通过 SonarQube 等外部工具执行。如位置 2-1
    所示，基于 Docker 的部署现在镜像被推送到容器仓库（如 Docker Hub 或 JFrog Artifactory），而不是传统的 Java 仓库。


    为了探索 Java CD 过程的下一个阶段，我们需要一个 Jenkins 安装来演示更改。使用 HashiCorp 的 Vagrant 工具，oreilly-docker-java-shopping
    项目能够构建运行在 Ubuntu 16.04 上的启用 Docker 的 Jenkins 服务器。要遵循这里的说明，你必须本地安装最新版本的 Vagrant
    和 Oracle 的 VirtualBox 虚拟机管理程序。


    ### 通过 Vagrant 创建 Jenkins 服务器


    从 docker-java-shopping 项目根目录，进入包含单个 Vagrant 文件的 ci-vagrant 文件夹。在该文件夹内执行 `vagrant
    up` 命令即可创建 Jenkins 虚拟机。创建虚拟机可能需要一些时间，特别是第一次运行时，因为它会下载 Ubuntu 16.04 基础镜像。在虚拟机创建期间，可以查看
    Vagrantfile 以了解它是如何配置的。


    简单的 shell 配置选项已用于在基础 Ubuntu 16.04 镜像上安装必要的依赖项。如果你熟悉 Ubuntu 操作，这些命令不应该让你意外；如果你不熟悉，不必过度担心，因为本书关注的是开发者的视角。值得注意的是，对于生产级的
    Jenkins 服务器部署，通常使用 Puppet、Chef 或 Ansible 等配置管理工具来配置机器。


    一旦 Jenkins Vagrant 准备就绪，你可以访问 http://localhost:8080，提供 Vagrant 配置过程结束时终端窗口提供的
    Jenkins 密钥，创建 Jenkins 账户并安装推荐的 Jenkins 插件。Jenkins 最大的技术优势之一是通过使用插件进行极强的扩展，可以通过插件提供额外的基础自定义和功能。


    现在导航到 Jenkins 主页左侧的 Manage Jenkins 菜单，并在生成的主菜单中选择 Manage Plugins。选择 Available
    标签页并搜索 docker。页面大约四分之一处是一个名为 CloudBees Docker Build and Publish Plugin 的插件，它提供了使用
    Dockerfile 构建项目并将生成的标记镜像（仓库）推送到 docker 注册表的能力。在不重启的情况下安装此插件并返回 Jenkins 主页。


    '
