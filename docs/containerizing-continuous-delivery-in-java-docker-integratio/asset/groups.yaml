    - 容器化应用可能会暴露新的安全攻击向量，这些向量必须被理解和缓解。


    这些对部署织网属性的更改不应让开发者感到意外，因为许多新技术的引入引入了某种形式的变化（例如，升级）。大多数此类潜在问题可以通过在构建流水线中使用容器技术并运行
    Java 应用来缓解。


    # 第 4 章


    # 持续测试的重要性


    > “如果你不喜欢测试你的产品，那么你的客户可能也不喜欢。”

    —— 匿名


    测试是任何持续交付流水线的核心部分，Docker 进入技术栈对某些领域没有影响，但在另一些领域有巨大影响。本章尝试强调这两种情况，并对修改构建流水线以支持容器化
    Java 应用提出建议。


    ## 使用容器进行功能测试


    好消息是在容器中运行 Java 应用不会上影响功能测试。坏消息是，无论部署技术如何，许多系统缺乏充分的功能测试。


    在容器中运行 Java 应用的单元测试和集成测试方法保持不变。然而，任何在容器中执行的组件或系统级测试应在尽可能接近生产的环境中进行。实际上，在容器中放置应用通常可以更容易“启动”并进行测试，主要的关注点是避免并发测试时的端口和数据冲突。


    虽然通常不建议在容器内运行生产数据库，但在构建流水线测试阶段在容器内运行 RDBMS 和其他中间件，可以通过在容器内加载预制数据或指定挂载到容器的数据目录来更容易创建场景。


    最后，无论应用是否部署在容器中，都强烈建议使用可执行规范和自动化验收工具来定义、捕获和运行测试。Java 开发生态系统中的热门工具包括 Serenity BDD、Cucumber、JBehave、REST-assured
    Selenium。


    ## 非功能测试：性能


    在容器中运行 Java 应用使得配置硬件和操作系统资源变得容易得多（例如，使用 cgroups）。正因如此，在构建流水线的后期，对运行时环境进行非功能测试必须尽可能模拟生产。这包括使用生产级选项运行容器（例如，通过
    Docker --cpuset 命令行配置 CPU 核心、通过 -c 配置 CPU 共享、通过 -m 配置内存限制）、在生产相同的编排框架中运行容器，并在相当的硬件基础设施上执行编排/容器运行时。

