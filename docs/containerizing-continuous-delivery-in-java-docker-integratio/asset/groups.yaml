    These service-level components can be run continuously within the build pipeline,
    and will validate local microservice functional and nonfunctional requirements.
    Additional internal resource API endpoints can be added to test, which can be
    used to manipulate internal state for test purposes or expose metrics.


    The benefits to the CD process of exposing application or service functionality
    via an API include:


    - Easier automation of test setup and teardown via internal resource endpoints
    (and this removes the need to manipulate state via file system or data access).

    - Easier automation of specification tests (e.g., REST-assured). Triggering functionality
    through a fragile UI is no longer required for every test.

    - API contracts can be validated automatically, potentially using techniques like
    consumer contracts and consumer-driven contracts (e.g., Pact-JVM).

    - Dependent services that expose functionality through an API can be efficiently
    mocked (e.g., WireMock), stubbed (e.g., stubby4j), or virtualized (e.g., Hoverfly).

    - Easier access to metrics and monitoring data via internal resource endpoints
    (e.g., Codahale Metrics or Spring Boot Actuator).


    ## Containers and Mechanical Sympathy


    Martin Thompson and Dave Farley have talked about the concept of mechanical sympathy
    in software development for several years. They were inspired by the Formula One
    racing driver Jackie Stewart''s famous quote "You don''t have to be a racing driver,
    but you do have to have mechanical sympathy", meaning that understanding how a
    car works will make you a better driver; and it has been argued that this is analogous
    to programmers understanding how computer hardware works. Not necessarily a degree
    in computer science or to be a hardware engineer, you do need to understand how
    hardware works and take that into consideration when you design software. The
    days of architects sitting in ivory towers and drawing UML diagrams is over. Architects
    and developers must continue to develop practical and operational experience from
    working with the new technologies.


    Using container technologies like Docker can fundamentally change the way your
    software interacts with the hardware it is running on, and it is beneficial to
    be aware of these changes:


    - Container technology can limit access to system resources, due to developer/operator
    specification, or to resource contention.

    - In particular, watch out for the restriction of memory available to a JVM, and
    remember that Java application memory requirements are not simply equal to heap
    size. In reality, Java applications'' memory requirements include the sum of Heap
    size, PermGen/Metaspace, native memory thread requirements, and JVM overhead.

    - Another source of potential issues is that containers typically share a single
    source of entropy (/dev/random) on the host machine, and this can be quickly exhausted.
    This manifests with Java applications unexpectedly stalling/blocking during cryptographic
    operations such as token generation on the initialization of security functionality.
    It is often beneficial to use the JVM option -Djava.security.egd=/dev/urandom,
    but be aware that this can have security implications.

    - Container technology (incidentally) expose incorrect resource availability to
    the JVM (e.g., the number of processor cores typically exposed to a JVM application
    is based on the underlying host properties, not the restrictions applied to a
    running container)

    - When running deployment fabric, it is often the case that additional layers
    of abstraction are applied over the operating system (e.g., orchestration framework,
    container technology itself, and an additional OS).

    - Container orchestration and scheduling frameworks often stop, start, and move
    containers (and applications) much more often compared to traditional deployment
    platforms.

    - The hardware fabric upon which containerized applications are run is typically
    more ephemeral in nature (e.g., cloud computing).

    - Containerized applications can expose new security attack vectors that must
    be understood and mitigated.


    These changes to the properties of the deployment fabric should not be a surprise
    to developers, as the use of many new technologies introduce some form of change
    (e.g., upgrading the JVM version on an application container, and running Java
    applications within an application container, and running Java applications in
    the cloud). The vast majority of these potential issues can be mitigated by augmenting
    the testing processes within the CD build pipeline.


    # CHAPTER 4


    # The Importance of Continuous Testing


    > "If you don''t like testing your product, most likely your customers won''t
    like testing it either."

    —Anonymous


    Testing is a core part of any continuous delivery build pipeline, and the introduction
    of Docker into the system technology stack has no impact in some areas of testing
    and a great impact in others. This chapter attempts to highlight these two cases,
    and makes recommendations for modifying an existing Java build pipeline to support
    the testing of containerized Java applications.


    ## Functional Testing with Containers


    The good news is that running Java applications within containers does not fundamentally
    affect functional testing. The bad news is that many systems being developed do
    not have an adequate level of functional testing regardless of the deployment
    technology.


    The approach to unit and integration testing with Java applications that will
    ultimately be executed within containers remains unchanged. However, any component
    or system-level end-to-end tests should be run against applications running within
    containers in an environment as close to production as possible. In reality, placing
    an application inside a container can often make it easier to “spin up” and test,
    and the major area of concern is avoiding port and data clashes when testing concurrently.


    Although it is not generally recommended to run production data stores from within
    containers, RDBMS and other middleware within containers during the build pipeline
    test phase can allow easier scenario creation by the loading of “pre-canned” data
    within containers, “data containers,” or by cloning and specifying data directories
    to be mounted into a container.


    Finally, regardless of whether or not an application is being deployed within
    a container, it is strongly recommended to use executable specifications and automated
    acceptance tools to define, capture, and run functional tests. Favorites in the
    Java development ecosystem include Serenity BDD, Cucumber, JBehave, REST-assured,
    Selenium.


    ## Nonfunctional Testing: Performance


    Running Java applications within containers makes it much easier to configure
    hardware and operating system resources (for example, using cgroups). Because
    of this, it is imperative during the later stages of the build pipeline, performing
    nonfunctional testing of the runtime environment is as production-like as possible.
    This includes executing the container with production-like options (e.g., with
    Docker CPU cores configured via the --cpuset command-line option, CPU shares via
    -c, and memory limits via -m), running the container within the same orchestration
    framework used in production, and executing the orchestration/container runtime
    on comparable hardware infrastructure (perhaps scaled down).


    Performance and load testing can be implemented by Jenkins using a tool like Docker
    Compose to orchestrate deployment of an application (or a series of services)
    and tools like Gatler or JMeter to run the tests. In order to isolate individual
    services under test, the technique of service virtualization can be used to control
    the performance characteristics of interdependent services. More information on
    this technique in the context of testing microservices can be found in my “Proposed
    Recipe for Designing, Building, and Testing Microservices” blog post.

