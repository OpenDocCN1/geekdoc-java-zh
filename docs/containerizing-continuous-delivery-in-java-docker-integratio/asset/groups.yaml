    # 第1章


    # 持续交付基础


    > “我们的最高优先级是通过早期和持续地交付有价值的软件来满足客户。”

    —《敏捷宣言》第一条原则


    持续交付（CD）从根本上是一套实践和规范，软件交付团队通过这些规范在短周期内产生价值且健壮的软件。特意确保功能是以小增量方式添加的，并确保软件可以任何时候可靠地发布。2010年，Jez
    Humble 和 Dave Farley 出版了他们的里程碑式著作《持续交付》（Addison-Wesley出版），该书汇总了他们在全球范围内参与软件交付项目的经验，该出版物至今仍是
    CD 的权威参考标准。书中从技术和组织两个角度出发，收集了极具价值的技术、方法论和建议。CD 的核心推荐实践之一是创建构建流水线，通过这条流水线，构建中软件的任何候选更改在确定其准备好部署到生产环境之前，都经过集成、测试和验证。


    # 基于 Java 构建流水线的持续交付


    图 1-1 展示了一个用于基于 Java 的单体应用的典型持续交付构建流水线。CD 流程的第一步是持续集成（CI）。在开发者笔记本电脑上创建的代码持续提交（集成）到共享版本控制仓库中，并自动开始通过整个流水线的旅程。


    ![](img/4d47989b22b26f7571903fa9a64cdd6d_11_0.png)


    图 1-1 典型的 Java 应用持续交付流水线


    构建流水线的主要目标是证明更改已准备好投入生产。配置修改代码可能会在流水线的任何阶段失败，该更改将相应被拒绝，不会被标记为准备好部署到生产。


    # 特性分支与 CI


    值得注意的是，许多人认为，如果实践 CI，代码必须持续集成（至少每天）到主干/master/development分支中。与这种做法相关的反模式是长寿命特性分支，这些分支没有与主代码库持续合并，在集成时经常会导致“合并地狱”。Steve
    Smith 对这一主题贡献了几篇信息丰富的文章。


    最初，应用代码更改的软件应用程序是在隔离状态进行构建和测试的，并且（应该）还会应用某种形式的代码质量分析，也许使用像 Sonar Qube 之类的工具。通过初始单元测试和组件测试的代码（代码质量指标）将向流水线的右侧移动，并在较大的集成上下文中进行测试。最终，经过充分验证的代码从流水线中输出，并被标记为准备好部署到生产环境。某些组织会自动部署成功通过构建流水线并通过所有质量检查的应用程序——这被称为持续交付。


    # 反馈最大化：一切自动化


    构建流水线必须为开发团队提供快速反馈，以便在他们的日常工作周期中发挥作用。因此，自动化被广泛使用（目标是 100% 自动化），因为它为流程提供了一种可靠、可重复且无错误的方法。以下项目应该被自动化：


    - 软件编译和代码质量状态分析

    - 功能测试，包括单元、组件、集成和端到端测试

    - 所有环境的配置，包括日志记录、监控和告警钩的集成

    - 软件构制品部署到所有环境（包括生产环境）

    - 数据存储迁移

    - 系统测试，包括非功能性需求，如容错、性能和安全性

    - 更改历史的跟踪和审计


    # 容器对持续交付的影响


    Java 开发者看到图 1-1 就会意识到，在典型的 Java 构建流水线中，无论使用的应用程序框架（如 Java EE 或 Spring），这两点是一致的。首先，Java
    应用通常被封装为 Java 归档（JAR）或 Web 归档（WAR）部署构制品；其次，这些构制品通常存储在制品仓库中，如 Nexus Apache Artifact
    或 Artificactory。在开发最终将部署在容器技术中的 Java 应用时，情况会发生变化。


    # Docker 不是唯一的容器技术


    值得注意的是，尽管本书专注于 Docker 与 Java 的结合，但 Docker 并非唯一的可用技术。事实上，许多人（包括作者有时）混淆了“容器”和“Docker”这两个词；这是错误的。其他容器技术包括
    CoreOS 和 rkt、Canonical 的 LXD 以及微软的 Windows Server Containers。书中介绍的高层级建议和模式适用于所有这些容器技术。对于在
    Windows 平台上开发的团队，更多信息可以在 Chris O''Dell 和 Matthew Skelton 的《Continuous Delivery
    with Windows and .NET》中找到。虽然这本书侧重于 .NET，但有很多关于 Windows 主题的章节。


    说 JAR 文件类似于 Docker 镜像是不公平的比较。这有点像是在比较引擎和汽车——按照这个类比，Java 开发者对构建引擎所需的技能更为熟悉。对于本书的范围，不包含
    Docker 基础说明，强烈建议新接触容器和 Docker 的读者阅读 Arun Gupta 的《Docker for Java Developers》和
    Adrian Mouat 的《Using Docker》。


    由于 Docker 镜像运行在宿主机系统的容器中，它们通常包含某种形式的操作系统（OS），从轻量级的 Alpine Linux 或 Debian Linux
    到功能完整的 Linux 发行版如 Ubuntu、CentOS 或 RHEL。Docker 容器内运行 OS 的例外是用于部署静态编译二进制文件（例如部署
    Go 应用）的“scratch”基础镜像。无论选择何种 OS（包括 Java），都需要考虑封装一个平台运行时（例如，在部署 Java 应用时，必须在容器内安装并运行
    JVM）。


    在包含完整 OS 的容器中封装 Java 应用通常会带来更大的灵活性，允许安装用于调试和诊断的 OS 工具。然而，能力越大责任越大（风险也随之增加）。在构建构制品中封装
    OS 增加了开发者的责任范围，例如安全攻击面。将 Docker 引入技术栈还意味着要在版本控制中管理额外的构建构制品，例如 Dockerfile，它指定了应该构建什么容器镜像。


    CD 的核心原则之一是在实际可行的情况下在类生产环境中测试，与传统的部署架构（如裸机、OpenStack 甚至云平台）相比，容器技术可以使其变得更容易。作为生产环境部署架构的
    Docker 编排框架（如 Docker Swarm、Kubernetes (nanokube) 和 Mesos (minimesos)）通常可以在开发者的笔记本电脑或廉价的本地/云实例上启动。


    在容器中封装和运行 Java 应用带来的复杂性增加，可以在很大程度上通过改进构建流水线（我们将在书中讨论）以及开发与运维人员之间增加协作来缓解。这是 DevOps
    运动的创立原则之一。


