    \n### JAVA CODE\n\n```java\nimport java.util.Arrays;\npublic class Exercise7 {\n\
    \    public static void main(String[] args) {\n        int[] my_array = {25, 14,\
    \ 56, 15, 36, 56, 77, 18, 29, 49};\n        System.out.println(\"Original Array\
    \ : \"+Arrays.toString(my_array));\n        // Remove the second element (index->1,\
    \ value->14) of the array\n        int removeIndex = 1;\n        for(int i = removeIndex;\
    \ i < my_array.length -1; i++){\n            my_array[i] = my_array[i + 1];\n\
    \        }\n        // We cannot alter the size of an array , after the removal,\
    \ the last and second last element in the array will exist twice\n        System.out.println(\"\
    After removing the second element: \"+Arrays.toString(my_array));\n    }\n}\n\
    ```\n\n### OUTPUT\nOriginal Array : [25, 14, 56, 15, 36, 56, 77, 18, 29, 49]\n\
