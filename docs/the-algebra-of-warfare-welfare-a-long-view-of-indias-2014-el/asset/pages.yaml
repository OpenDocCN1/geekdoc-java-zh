    Delhi. Hence, Hindutva was compelled to compromise on occasion on its ideology
    and programme. Further, the antiMuslim plank might be a major ingredient to bring
    people into its fold, it was still impossible to win an all-India election on
    this sole criterion as it would be a fraction of what the diverse electorate from
    different regions demanded. Even if Hindutva had won on this single issue, it
    could hardly have sustained. To overcome this limitation, Hindutva had been working
    round the clock to create, expand, and retain an all-India Hindu constituency,
    which lived off anti-Muslim fodder. So, when Modi came to power with absolute
    majority, Hindutva crossed a huge barrier and felt emboldened and wished his Hindu
    constituency to feel proud and empowered because of its decisive victory and demonstrate
    their prowess over Muslims.


