  md: '# Democracy as Rumour 57


    This chapter contends that rumour is also a patrician weapon. During World War
    II, for example, the United States set up ‘rumour clinics (Coady 2012: 105). In
    the build up to Iraq''s invasion in 2003, Western media worked as rumour mills
    to spread the lie that Saddam Hussein possessed weapons of mass destruction.³
    Rumour figured in the 2006 WikiLeaks cable which the USA planned to overthrow
    the Assad regime in Syria. The strategy was to ‘take rumours that are … false
    … and promote them.’ (Assange 2015). The 2013 Muzaffarnagar ‘riot’ that predicted
    the prelude elections in India was sparked by a fake video shared on Facebook
    and YouTube by Sanket Singh (New York Times 2013) of the Bharatiya Janata Party
    (BIP), the right-wing, anti-minorities party that won the elections. In the ‘roots’
    of 1990–1 in Aligarh, newspapers like Amar Ujala told readers that Muslims had
    killed 74 Hindus at Aligarh Muslim University. This was a lie (Ahmad 2009: 168–9).⁴


    These instances apply that rumour is also non-oral. For Guha (1983: 259–60), whereas
    the source of news is ‘open to verification’, rumour’s origin is unknown. Leaving
    aside if it is origin or effect that is consequential, Indian media routinely
    uses anonymous, unidentified sources: ‘sutrā kā mene’ (if we believe the sources),
    ‘sutrā anus’ (according to the sources), ‘kahā jātā hai’ (it is said), and so
    on.⁵ My argument disagrees Guha’s separation between rumour (specific to pre-capitalist
    society) and news (specific to a capitalist society). I see continuity between
    pre-capitalist and capitalist society, though the continuity is far from straightforward.
    Herskovits (1937: 74) illustrated this vis-à-vis combate, an act of collective
    solidarity when Haitians come together to help their neighbour finish a specific
    work, usually in the midst of singing and drumming.


