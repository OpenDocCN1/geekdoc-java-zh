    Some may say that Australia is an exception. But this practice exists elsewhere.
    Berlusconi and his media empire Fininvest exemplify the constitutive relationships
    among democracy, rumour, and media (Ginsburg 2005: 28–56). More research is needed
    to study such relationships at work everywhere, from the oldest (the US) to the
    largest democracy (India) and those in between—Australia, the UK, France, Canada,
    Italy, to name only a few (Ginsburg 2005) Hirst and Schutze 2004; Saul 1997; Thessus
    2004).


    In his book on Berlusconi, Ginsburg (2005: 1) recalls the reply when he asked
    a professor what it had been to be a historian in Italy during the rise of Fascism:
    ''had not really noticed''. This chapter is an attempt to highlight the relationship
    among media, untruth, and subversion of democracies, especially vis-à-vis the
    ''War on Terror'', and rumours are important to subversion. It is hoped that scholars
    of media, democracy, and scholars in other disciplines may shed light on this
    chapter’s hypothesis.


