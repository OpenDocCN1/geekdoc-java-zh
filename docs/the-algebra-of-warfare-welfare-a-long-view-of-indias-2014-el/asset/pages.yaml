    a story of 80 Dalit families converting to Islam in a small village called Meenakipuram
    in the erstwhile Ramanathapuram district in southern Tamil Nadu. A few days after
    the story was published, a local Tamil press from Chennai published the news as
    headlines, which created ripples across the political spectrum in the country
