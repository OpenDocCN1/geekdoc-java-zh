  md: '# xii Preface


    The elimination of the massacre in Banerjee''s account is not only an empirical
    omission. This narrative elimination—as constitutive of democracy in India (think
    alike of other massacres, not only in Gujarat in 2002 or Muzaffarnagar in 2013)—and
    the simultaneous use of superlative adjectives that inundate her account, I argue,
    stem from captivity to a theoretical vocabulary whereby accounts of democracy
    secure the auto-immunity for themselves by disguising, to Jason Brennan (2016a),
    the ‘rot’ in democracy’s roots’. The logical outcome of that captivity is discursive
    circularity (see ‘Introduction’).


    Panegyric accounts such as Banerjee’s thus figuratively (re)produce a series of
    arophes over democracy predicated on ‘a set of impossible concepts: people, border,
    life, liberty, decision, foundation, sovereignty’ (Ross 2006: 75). They equally
    display a blindness to the ‘antagonism’ against others and xenophobia that is
    built into this [democracy’s] very practice (Gaon 2009: 2). One may add, albeit
    with some cause, that antagonism against others and xenophobia are built into
    the theory of democracy as it is and towards hostility is directed as much against
    outsiders—‘civic enemies’ in Brennan’s (2016b: 245) term words.


    Superlatives as Banerjee’s are also to work in the characterization—by journalists
    and academics alike—of the of the 2014 elections. If Louise Tillin (2015: 118)
    described it as ‘extraordinary’ and ‘critical’ election, Rononoj Sen (2017: 172),
    called it ‘seminal’. For Ashutosh Varshney (2014: 34), it was truly ‘distinct’.
    Paul Wallace (2015: xxi) termed it ‘historic’. Journalist Rajdeep Sardesai (2014)
    described it as an election that changed India’—a phrase that appears in the title
    of his book on the election. Such descriptions are based on political pundry emanating
    from a short-termism manifest in the following maxim: ‘In politics, three months
    can be a lifetime.’ However, for a thorough, sound political analysis that refuses
    the seduction of presentism, the skewed temporal unit of analysis is surely unhelpful.
    Unlike


    Sajajwadi Party will be able to save you. That is why I am saying to Muslims,
    vote for us. If you vote for BJP you will be happy, else you will have to face
    problems.’ Srivastava issued the threat from a public stage in the presence of
    two ministers of the UP government who approved of his vitriol (News18 2017).'
