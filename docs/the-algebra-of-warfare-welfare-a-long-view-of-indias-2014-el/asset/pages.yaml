  md: '# ACKNOWLEDGEMENTS


    The idea of this volume emerged soon after the election results as a conversation
    between the two editors. At that time, Irfan Ahmad worked at the Institute for
    Religion, Politics and Society, Australian Catholic University (ACU), Melbourne,
    Australia, and Pralay Kanungo was at Leiden University, the Netherlands. As our
    conversation thickened, we felt the need for an intellectual partnership, which
    resulted in Kanungo becoming a Professorial Fellow at ACU. We organized a conference
    about the 2014 elections on 18 and 19 December 2015 in Sariska, Rajasthan, India.
    It was part of a larger network conference of EECURI (Explaining Electoral Changes
    in Urban and Rural India), consisting of European and Indian scholars and institutions.


    Most contributors to this volume were invited to present their papers in the conference.
    Though a few of them could not attend, they wrote their respective chapters. We
    solicited one additional contribution after the conference. However, despite our
    best efforts and whatever resources at our disposal, we could not get an academic
    or intellectually aligned with the Bharatiya Janata Party (BJP) to write a chapter.
    We then sought to have a conversation, such as the one with sociologist T.K. Oommen
    in this volume, with a prominent BJP intellectual or leader. After much effort
    and time, we established contact with Tarun Vijay, a member of the Upper House
    of the Indian Parliament and previously editor of Panchanjanya, a Hindi weekly
    magazine of the Rashtriya Swayamsevak Sangh (RSS). However, the interview could
    not take place on account of Vijay’s ill health as well as his hectic schedule.'
