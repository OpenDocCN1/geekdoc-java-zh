  md: '# Introduction 3


    ‘Introduction’ advances the thesis that is an important way to analyse electoral
    democracy to understand it as a phenomenon of warfare and welfare, where both
    become intimately intertwined in such a way that they can work—indeed they often
    do so—as near synonyms. In many forms—direct, now indirect—if this phrase is useful,
    is integral to electoral democracy in India, as also elsewhere. As a term, while
    ‘calculus’ has been used in writings on elections (for example, Khare: 52), algebra
    probably has not been used. Both calculus and algebra pertain to mathematics.
    According The Oxford English Dictionary (Simpson and Weiner 1989: 778, 311), while
    ‘calculus’ is a ‘method of calculation’, ‘algebra’ investigates the relations
    and properties of numbers by means of general symbols’ and does so in to account
    for what I take to be its relational, symbolic, and abstraction signification.


    To this end I examine various works on the 2014 elections and the understandings
    of democracy—most of which certain, to invoke Brian Massumi’s (2013[1987]: ix)
    phrase from a different context—to the genre of ‘state-happy’ scholarship. My
    examination of democracy is informed by insights from second works by Jason Brennan
    (2016), John Dunn (2014), Roselyn Fuller (2015), Stella Gaon (2009), and others
    cited in the text. If there is one commonality between these works and the exercise
    undertaken in this ‘Introduction’, it is to go past what Brennan (2016: 6) christens
    as ‘democratic triumphalism’. Much of these works, however, hardly deal with India,
    certainly not the way this ‘Introduction’ formulates the issue of democracy. The
    line of enquiry and argumentation is this own.


    Before I enchant this thesis in the second part of ‘Introduction’, it is necessary
    to create ground for its articulation by examining the available analyses of the
    2014 elections and the associated stories of democracy. In the first part, I pursue
    this task. I discuss select literature from many disciplines; I make no claim
    for a thorough engagement with the literature of any single discipline. My method
    is multidisciplinary and interdisciplinary at the same time, and my engagement
    with the literature is suggestive rather than exhaustive. I aim to throw a pebble
    into the calm, muddy, and unquestioned (to some, even unquestionable) water of
    democracy and its critical valorization as to shake it, in order to pave the way
    for an alternative notion of'
