  md: '# 2


    # MODI AND THE SPECTRE OF TERRORISM


    Crafting the Hindutva Icon


    Manisha Sethi


    For years, ''terrorism'' has remained one of the mainstays of the Bharatiya Janata
    Party’s (BJP) electoral campaigns. It has sought to project itself as the sole
    political party that is uncompromising on issues of national security, and thus
    the only one capable of rebuffing forces of terrorist violence. Largely, the invocation
    of this threat (Islamic) and the nation (Hindu), which is in need of protection
    follows the party’s ideas about true and authentic citizens.


    Narendra Modi’s campaign in 2014 drew upon the BJP’s traditional stances. In addition,
    he emphasized his distinctive image and history as the chief minister of Gujarat,
    as the one who relentlessly crushed terrorist conspiracies and delivered punishment
    to infiltrators and internal enemies alike. His reputation as the Hindu Hriday
    Samrat (loosely translated as Emperor of Hearts’) rested on the mass violence
    against Muslims in Gujarat in 2002 and the low tolerance he is supposed to have
    exhibited towards Islamic terrorism during his his tenure as the chief minister
    of the state.


    As such, Modi’s electoral success in the years leading up to the 2014 general
    elections punctured the celebratory narrative of Indian election studies as well
    as the easy isomorphism between the political, welfare, and care. ‘Fear’ is an
    unlikely, unprecedented, companion to


    Manisha Sethi, Modi and the Spectre of Terror: Crafting the Hindutva Icon. In:
    The Algebra of Warfare-Welfare: A Long View of India’s 2014 Election. Edited by
    Irfan Ahmed and Pralay Kanungo, Oxford University Press (2019). © Oxford University
    Press. DOI: 10.1093/oso/978019849626.003'
  merge: -1
  pgno: 112
- img_proc: true
  md: '# Manisha Sethi


    democracy. Attention to us terrorism was invoked by Modi and in the team places
    us squarely within the logic of‘warfare'' alluded to in the title of this volume,
    and which has been described in the ''Introduction'' as the process which ''constructs
    and produces a sharp fence between ‘us-friends’ and ‘them-enemy’.


    Modi unabashedly declared himself to be a ‘Hindu nationalist’ at the start of
    his 2014 campaign. Yet, the constraint of national elections also implied that
    Modi had to appear less sectarian and accommodative and statesmanlike. This dilemma
    is encapsulated in the Modi campaign slogan: ‘Sabka Saath Sabha Vikaas’ (with
    everyone, development for everyone). While it appeared to be a break from the
    earlier majoritarian politics, a sign that Modi had changed since 2002, it was
    also meant to be a riposte to ‘pseudo-secularists’, while who advocated for special
    protections for minorities. Likewise, his rhetoric on terrorism was more than
    uttered—making no direct allusions to Muslims, as was his wont in state—politics,
    this was also the consolation of symbols that Modi and BJP turned toforce in elaborating
    their political and ideological blueprint.


    The remarkable success of Modi-led BJP spurred a slew of analyses from a variety
    of perspectives. A special issue of Studies in Indian Politics (2015), devoted
    to understanding these ‘unprecedented’ elections, was largely an exercise within
    the election framework employing quantitative and qualitative techniques to track
    the process from the start of the campaign to the conclusion of the results—focussing
    on regions, as well as different social groups. Others examined the centrality
    of Modi in the party’s campaign in what has been seen as one of the most personalized
    elections ever (Jaffrelot 2015). Other collections focussed more narrowly on the
    mediated populism of Modi’s campaign in 2014, examining voter mobilization and
    image creation through cyberspace and television (Television and New Media 2015).
    In particular, Sanjay Srivastava explored a variety of discourses of masculinity
    gathered on the person of Modi, and how the image of his forceful masculinity
    was disseminated through the media. However, none of these analyses, Modi’s and
    BJP’s campaign, the role of the media, and the construction of BJP’s masculine
    personality was really look at the way in which the trope of terrorism was deployed
    by Modi.'
