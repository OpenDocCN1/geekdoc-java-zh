    # Failed Outreach?


    Despite these overtures, a key feature of the 2014 election result was a further
    marginalization of Muslims in the Parliament. Their numbers declined from 30 in
    2009 to 23 in 2014. Representation of Muslim MPs in the Lok Sabha has remained
    disproportionately low, ranging between 20 and 30, except in 1981 and 1984, when
    it reached 40 and 50 respectively (Ansari 2006). In 2014, the BJP had fielded
    seven Muslim candidates. Among them, Shahnawaz Hussain was a strong contender;
    but he, too, lost by a small margin from Bhagalpur. Consequently, the BJP did
    not have a single Muslim MP in the 16th Lok Sabha. It, however, did send three—Naqvi,
    Heptullah, and Akbar—to the Upper House. Heptullah and Naqvi were inducted into
    the cabinet in 2016. In 2016, Akbar was a minister after Heptullah was appointed
    as the governor of Manipur.'
