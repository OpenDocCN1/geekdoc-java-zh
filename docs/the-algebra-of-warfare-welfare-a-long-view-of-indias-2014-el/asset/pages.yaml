    # Ramdev''s Discourses: Social Transformation of the Nation


    Ramdev''s teachings can be contextualized in the tradition of nineteenth- and
    twentieth-century nationalist yoga, as he conceived yoga not only as a spiritual
    tool for personal rejuvenation but also as a tool for social and political regeneration
    and moral and ethical reconstruction of the nation (Gooptu 2016). While marking
    the recipe of yoga and Ayurveda on television, Ramdev simultaneously amplified
    his discourses and vision in texts as well. Ramdev''s manifesto of spiritual and
    social transformation was illustrated in Jeevan Darshan (Philosophy of Life 2009),
    in which he articulated a vision of yoga nationalism in his pursuit of social
    transformation and through his community of yoga practitioners. Drawing on Patanjali
    (the great Yoga philosopher), he described yoga as ‘the eradication of negative
    moods’, which leads to finding ‘solace in the merging with the soul’. We can say
    that the controlled practices which result in the meeting of Atma and Param-atma
    (Soul and the Supreme Soul) is Yog (Ramdev 2008: 1). Ramdev''s vision of yoga
    wasxtricably tied to his vision for the indian nation.


    In a section entitled ‘National Religion’ in Jeevan Darshan, he argued that ‘there
    is no greater religion than duties to the nation. There is no God greater than
    the nation. National interest is above everything. I will not betray the nation
    for my personal, political, economic, and mighty welfare. I will contribute my
    body, mind, life, and vote for national interest’ (Ramdev 2009: 12). This discourse
    echoes the RSS pledge for the nation. Ramdev observed: ‘Nation-god is the greatest....
    Every individual has gratitude, respect and pride towards the nation.’ Ramdev
    further warned: ‘Those who do not love the soul, culture, civilization, and the
    people of the nation have no right to stay in this country’ (Ramdev 2009: 16).
