    Immediately after the passing of the Forest Rights Act, 2006, corporate mobilization
    against the UPA-I started. The Forest Rights Act and the Land Acquisition Act,
    which were designed to ensure people''s rights over their land and forest, investment
    capital, putting a big question mark on the future of corporates. Against this
