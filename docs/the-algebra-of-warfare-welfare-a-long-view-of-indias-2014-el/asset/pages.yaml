  md: '# Preface xiii


    Sedwick (2008: xiii), who pleaded for the ''scale of centuries or even millennia'',
    to understand the politics of sexuality, this volume, while being attentive to
    the immediate factors and consequences, suggests that a proper appraisal of the
    2014 elections beyond its sheer immediacy can only be made over the French Annales
    School and Fernand Braudel termed as ''long durée''. Our usage of longue durée
    requires some clarification. While for Braudel several centuries, we use it to
    refer to the history of democracy and elections in India, primarily in the wake
    of British colonialism (see ''Introduction''). In On History, Braudel''s (1980:
    26, 28, 31ff.) counter-long durée is what he calls the ''instant'' and ''history''
    of events. He takes the history of events to mean a ''short time span, proportionate
    to individuals, to daily life ... to our hasty awareness—above all the time of
    the chronicle and the journalist''s. We use longue durée to show our dissatisfaction
    with the immediacy, the current, and a reluctance to step back and view election
    over a long span of time. Braudel criticizes sociologists–anthropologists precisely
    on this point, for their preoccupation with the present (Ahmad 2017: 91–3). Notably,
    Braudel''s longue durée was also conceptual. It meant a structural relationship
    with enduring, distinct features. As well known, Braudel did not give much weight
    to the political in its own right. But if we take it more seriously, longue durée
    will be considered justified here for we also refer to a certain structure of
    politics instituted in the early twentieth century and its continuation into our
    very present. Readers may still find longue durée unpleasant and least ''long
    view''—a non-technical but comprehensive phrase suggested by Peter van der Weer
    ''Thank you, Peter!''


    When and if analysed in the proposed long-term framework, the 2014 elections results
    were less than the most dramatic. They were instead out of a long process in motion—synthetically,
    albeit differently—by the ''secular'' Indian National Congress and ''communal''
    Bharatiya Party (BJP) or its ancestors, Jan Sangh and Hindu Mahasabha. Going past
    Friedrich Engels'' observation ''that the names of political parties are never
    quite right'' (cited in Schmitt 1986: 29), it is important to say that even the
    apparent differences in ideological programmes of different political parties
    are not different for them all, communist parties included,'
  merge: -1
