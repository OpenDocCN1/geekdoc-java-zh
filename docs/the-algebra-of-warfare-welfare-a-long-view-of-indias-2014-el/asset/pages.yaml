    In this chapter, I had proposed to examine three key issues. Is there a contradiction
    between the BJP''s outreach programmes towards Muslims and their condemnation
    of similar initiatives by other political parties as ''Muslim appeasement?'' How
    do the Sangh Parivar''s leaders—Muslims as Hindus—engaged in such programmes,
    views Muslims'' identity and their political participation? And finally, how effective
    were these outreach programmes in drawing Muslim voters towards the BJP?


    I have elaborated in detail on the inherent contradiction in the BJP''s predominantly
    towards Muslims, while also pointing out that in the 2014 general elections the
    efforts of the BJP''s Muslims could not yield the desired outcome. This does not
    imply that BJP''s Muslims might have no role in the saffron party. The BJP''s
    Muslims might not have been able bring in vote swings in the 2014 elections but
    they did succeed in continuing the narrative of the BJP being virtually untouchable
