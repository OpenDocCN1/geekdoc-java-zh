  md: '# Irfan Ahmad


    for news channels'' teams of highly-paid professionals to mobilize paid news.
    Claiming to present the ‘truth’, news channels, however, keep the sources of their
    own finances hidden (Gupta and Shivramakrishnan 2011; Mehta 2015; Rajopal 2015;
    Ranganathan 2015; Saeed 2015; Thomas 2010; Thuss 2007; also see Chapter 9 in this
    volume).


    Scholars also note the concomitant rise of electoral Hindutva (with its explicit
    othering of religious minorities) and the private television. However, the othering
    can be traced to the state-controlled Doordarsshan forecast of the television
    series, Ramayana, in 1987. Since the serial had a national audience, Indian and
    multinational companies competed to buy advertising time. At the conjunction of
    nationalism, Hindutva, and market, Ramayana surpassed all other series in advertising
    revenue (Mankekar 1999; Rajopal 2001). Such was the backdrop for the emergence
    of private news channels that aligned Hindu majoritarian nationalism with majority
    audience/viewers, who also shaped ratings of television networks. These news channels
    spoke of empowerment of audience/viewers vis-à-vis government-controlled media.
    However, ‘empowerment’ meant increased demand for the answerability of the media
    to ‘Hindu sentiment’ rather than enacting the common good (Ohm 2012; also see
    Gopalakrishnan 2006).


    ‘Designer democracy’ may capture the multilayered interface among media, elections,
    politicians, the advertising industry, and neoliberalization, which has led to
    the bastardization of the common good and a ‘major loss … in democracy’ (Said
    2000). As an ideological project, policy and programme, state form, and governmentality
    (England and Ward 2007: 11–14), neoliberalization should not be taken to mean
    either withdrawal of the state or its declining role, but the redesigning of the
    state, and hence, of democracy. By ‘designer democracy’, I mean electoral polity
    under a neoliberal economy where voters are viewed as consumers and parties as
    salesmen, and the communication between them is mediated predominantly by modern
    electronic and visual media, including social media (Chamadia 2015; Nan 2007;
    Oza 2006; Rodrigues 2010). With analytical fine-ness, in Branding the Nation:
    The Global Business of National Identity, Melissa Aronczyk (2013) shows how profound
    changes within the corporate firms in the 1980s, mediated as they were by globalization,
    led to the idea of nation as a brand, which was officially adopted by many'
