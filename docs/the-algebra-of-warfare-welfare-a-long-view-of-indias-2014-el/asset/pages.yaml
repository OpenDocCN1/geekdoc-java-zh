    ***


    Ramdev had a spectacular journey, challenging all odds from his childhood to his
    youth—physical, social, economic—and emerging as a charismatic and popular yoga
    guru. While imparting innovative style of yoga to his followers, he also disseminated
    his vision of nation and commitment to swadeshi and social transformation. The
    success of his entrepreneurship, which skillfully marketed yoga and Ayurveda,
    gave him enough spiritual and economic capital to explore his political ambitions.
    Broadly subscribing to the ideology of the Arya Samaj and having a commitment
    to swadeshi economics, he plunged into the national political stage when the nation
    was reeling under crony capitalism and corruption by the Congress-led UPA regime
    and was looking for sav. He found a perfect partner in the Gandhian Anna Hazare
    and got a perfect launch, being a part of his popular agitation.


    With Anna''s movement for an alternative political experiment—which later culminated
    in the formation of the AAP—Ramdev decided to break away from Anna’s followers
    and go solo to harvest his own political capital. When this experiment was crushed
    by the high-handedness of the state and his business empire was threatened, he
    found little option to look for a durable and committed political partnership.
    He learnt that charisma alone was not adequate to sail through politics. The yoga
    disciples cannot be converted into political cadre overnight and yoga camps cannot
    be turned into political battleground.


    The very amorphous nature of his social trust and the death of his political aide
    further compelled him to be grounded and channelize his personal ambitions in
    a different way. Though Ramdev had cultivated close relationships across a wide
    political spectrum—from the BJP and the Congress, to the Samajwadi Party and the
    Rashtriya Janata Dal—at this juncture, he could also see that a political change
    was in the off and it would be pragmatic to be in a partnership with the Sangh
    Parivar as the BJP, under the leadership of Narendra Modi, would be a strong contender
    for the next ruling regime in Delhi.'
