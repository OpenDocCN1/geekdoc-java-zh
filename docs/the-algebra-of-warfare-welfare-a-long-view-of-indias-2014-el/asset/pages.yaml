    and self-proclaimed image as an efficient administrator and symbol of development,
    why did he invoke a religious-mythical vocabulary to justify his choice for Banaras?
    Manisha Sethi (see Chapter 2) discusses in detail the connection between Hindutva
    and the electorate and the processes that led to the victory of BJP in 2014. Weaving
    insights from the disciplines of cultural-social geography and election studies,
    I analyse how a specific religious imagery of Banaras was projected at the cost
    of other identities in the 2014 elections. Different forms of media, including
    social media, played a crucial role in the construction and sustenance of such
    identities (see Chapter 1). To demonstrate this argument, I use sources such as
    newspaper reports (Hindi and English), television broadcasts (Hindi and English),
    and online videos of election campaigns. Drawing on Foucault’s idea of heteropia
    (explained later), I use these sources in a discursive framework to show how a
    specific, exclusionary notion of space (here Banaras) was used to serve a polarizing
    political goal to secure power.


    # Space, Culture, and Power: Many Identities of Banaras


    This section analyses histories of Banaras created by multiple power blocks and
    how one specific notion of its antiquity is particular and manipulated as a normative
    ideal. Historical narratives, historical truths, and the encompassing identities
    are better understood in a discursive field of power. It is, therefore, important
    to examine different notions which are associated with Banaras, often presented
    as a timeless, sacred, and Hindu city (Eck 1998; Gaenszie and Gengagel 2008).
    As recent scholarship suggests, history is intrinsically connected to knowledge
    production predicated on power. Constructed historical analysis based on the Foucauldian
    paradigm is used to analyse the spatial identity formation in Banaras. Foucault’s
    ‘archaeology’ centres on historical ‘interruptions’ and discursive formations
    in the ‘normative’ (projected identity) is constructed in opposition to the ‘pathological’
    (practiced identity). Here, the ‘self’ is produced through ‘pathological others’
    that play an important role in understanding the ‘projected’ and ‘practiced’ identity
    of the city (Choudhary and Prakash 2016). When we analyse Banaras, the self is
    produced through others (projected identity) and, at the same time, the other'
