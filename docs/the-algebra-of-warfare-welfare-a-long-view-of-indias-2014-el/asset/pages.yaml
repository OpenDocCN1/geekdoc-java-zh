  md: 'democracy because they lack official verification (Coady 2012). In both perspectives,
    however, rumour and democracy remain unrelated. Scholars have written separately
    on rumour (for example, Gluckman 1963; Pain 1967; Stewart and Strathern 2004),
    democracy (for example, Dahl 2001; Guha 2007; Keane 2009; Tilly 2007), and media
    (for example, Mehta 2008; Rajagopal 2001; Ranganathan and Rodrigues 2010; Rudolf
    2008; Willis 2007).2 But few connect them to advance a hypothesis as this chapter
    does.


    A key assumption of literature on rumour is that its agents often non-state. Although
    some view them positively, others hold a pessimistic view. In writings of Guha
    (1983) and Scott (1990) to Bhabha (1995), rumour is invested with a heroic signification
    and hailed as ‘genre of relic communication’ (Ghosh 2008: 1235; Spivak 1988).
    Anthropologists studying post-colonial India, albeit focussed on rumours, also
    echo this (for example, Gupta 1995: 388). So do studies of rumour elsewhere. In
    his study of the 1996 violence in Owerri, Nigeria, Bastian (2003: 67, 74–5) how
    rumour worked to galvanize subaltern militants against the wealthy, parvenuaires
    and the secrecy behind their power. ‘Rumored conspiracies’ that these elites belonged
    to ‘secret cults’, Bastian argues, were forms of contestation the non-transparent
    dictatorial regime. By Coombe (1997: 268, 270–1), rumour about Procter & Gamble,
    Reebook, and the like, among the ‘subaltern spheres’ of African-Americans are
    ‘cultural guerrilla tactics’ against the invisibility and hyperreality of the
    post-industrial age where sign value has dislodged exchange value. Coombe agrees
    with Patricia Turner (1993) that rumour and legends are modes of resistance; she
    critiques Turner for not linking them to the “post-industrial’ conditions’. In
    contrast, Veena Das (1998) and Jonathan Spencer (2000) view rumour pessimistically.
    Discussing the 1984 anti-Sikh pogrom, Das (1998:119) notes the ‘pessimistic view
    of rumour mobilizing hate’. Both viewpoints, however, imply that seldom the powerful
    and the state circulate (see, for example, Sunstein [2014] on rumours about Barack
    Obama). That members of a power elite (Mills 1959) such as John Howard, are also
    agents of rumour remains undisressed (Maddox 2008).


    2 Literature cited here is representative, not exhaustive. Space constraints prevent
    me from mentioning many other important works.'
