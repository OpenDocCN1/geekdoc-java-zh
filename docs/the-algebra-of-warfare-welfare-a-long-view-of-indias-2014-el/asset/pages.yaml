    enmity and promise of better people''s lot mean that democracy works on the logic
    of warfare and welfare in the same breath?


    TKO: It is problematic to compare India with Western countries. In the West, the
    ''people'' are defined based on their linguistic identities; wherever linguistic
    diversity has persisted, as in Great Britain and Spain, the deprived linguistic
    communities articulate their frustration and insofar they are territorially anchored,
    they get political representation. In South Asia, state formation is anchored
    to religious identity and religious communities are usually territorially dispersed.
    Hence, they are not likely to get political representation, which is an important
    basis of their deprivation. The RSS and the BJP follow an expansionist definition
    of ''Hindu'', encapsulating the primal vision of the indigenous peoples of India
    (divasis), the Buddhists, Hindus, and Sikhs (who are all defined as Hindu in the
    Hindu Code Bill). Further, the Hindus converted to Sikhism and Buddhism are given
    the benefits under the policy of reservation. In contrast, while the immigrant
    religious communities such as Jews, Parsis and Bahai’s are treated as guests in
    India, Muslims and Christians are castigated as dacoits. Thus, a policy of inclusion
    of Indic religious minorities flourished in independent India, not only by the
    BJP but also by those political parties who were in power earlier.


    French nationalism was nurtured through a process of ''culturocide'', that is,
    systematic elimination of non-French-speaking groups. In 1789, half the population
    in France spoke no French at all, and by 1863 about 20 cent of the population
    did not speak what was officially considered French. Alsatians, Basques, Bretons,
    Catalans, Corsicans, Flemings, and Occitans were all coerced to abandon their
    tongues and adopt French. That is, linguistic homogenization was the kernel of
    French nationalism. In contrast, religious homogenization is the crux of BJP–RSS
    nationalism. This viewed, the rightward thrust in France and India has different
    contents, although cultural homogenization is common to both.


    Since the linguistic reorganization of Indian states in the mid-1950s, the Tamil,
    Bengali, Punjabi, and later Telugu, Kannada, and other linguistic groups have
    articulated their deprivations. Therefore, to visualize an all-India pattern of
    electoral behaviour based on religious identities would be simplistic. The Kerala
    Muslims with their pre-colonial entry into India, the Bengali Muslims enveloped
    in Bengali'
