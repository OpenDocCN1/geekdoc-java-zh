    a corporate consensus was developed around Modi.


    When the corporates decided to throw their weight behind Modi, the corporate media
    obviously had to go all out for him. In fact, since 2009, Modi had been systematically
    cultivating a relationship with the corporate media and had built a close partnership
    with them. With this partnership, the dramatization of democracy was scripted
    with an open and undeclared support from the media, more particularly the electronic
    media. The Gujarat model was never critically questioned and got celebrated in
    the news, on public discussions, and in advertisements. The period preceding the
    first Gujarat Summit up to the months preceding the 2014 elections was enough
    to influence the media-consuming middle class of India, the opinion makers in
    the society; moreover, the Brahmanical, patriarchal and feudal elements among
    the middle class were already the followers of Hindutva.'
