  md: '# 200 Bikramaditya Kumar Chaudhary


    (that is, the projected Modi’s proclamation is produced through the self. During
    the campaign, the call can be read as a claim of ‘divine self’, which reduces
    ‘others’ (opposition candidates, particularly) to mere mortals. The conceptualized
    ‘self’ is so deeply ingrained in us that we no longer perceive it as the effect
    of a power that constrains us (Foucault 1982). The purification of Malviya’s statue
    by the SP workers also be read as an act of creating the ‘other’. In enacting
    the purificatory ritual, the SP workers probably did not realize that they served
    and advanced the very purificatory politics at the heart of BJP. Likewise, the
    participation of the AAP in various rituals associated with the city of Banaras
    strengthened the exhilarated ritualistic political atmosphere created by the BJP.


    It is well known that identity is constructed through different times. To understand
    Banaras as a city is to study the past episteme and power relations constructing
    histories at the local level and extrapolating such productions in its exteriority.
    Writing about the connections between history and power, Michel de Certeau (1984:
    68) pertinently observed: ‘Before knowing what history says of a society, we analyze
    how history functions within it... It plays the role of censor with respect to
    current social, economic, political postulates of analysis’. For Certeau, the
    past is not ‘given’, but constructed in narrative forms. History has its role
    in society and is tied to power and knowledge, and can culminate in homogeneous
    and self-serving identities. Contra its mobilization by the BJP during elections,
    Banaras’ historical identity is neither seamlessly homogeneously produced, as
    it has been shaped by different forces at different times. As evident from the
    accounts of Orientalists, colonialists, theologians, and nationalists, the ‘history’
    of Banaras bears witness to its discursive character, shaped by a projected metarrative.
    The metarrative is often constructed to project ‘one’ particular space (here Banaras)
    as sacred. By extension, other spaces become not-so-sacred. That is, the sanctity
    of a space has been instituted and stabilized, its status rarely questioned. The
    only battle, then, remains as to owns that particular space, rather than question
    the idea of ‘scared space’ itself. Different shades of scholarship on Banaras
    seem embraced in this discourse, as a result of which epistemological questions
    about sacred and spatial distinctiveness are hardly raised.'
