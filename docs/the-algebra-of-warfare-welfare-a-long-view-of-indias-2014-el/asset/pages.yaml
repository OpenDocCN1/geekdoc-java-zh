  md: '# Modi and the Spectre of Terrorism 111


    attack Modi: Delhi Police'' (Deccan Chronicle 2014). The story inside, however,
    had no such quote from the Delhi Police.


    Similarly, a news portal reported, ''The police claim that their main target was
    Modi who had several rallies lined up in Rajasthan'' (Nanjappa 2014), despite
    the fact that the police clearly had made no such claim. ''Conspiracy to attack
    Modi foiled'' was the headline of a Hindi daily (Jagran 2014). This newspaper
    dropped even the presence of being informed by undisclosed and ''highly placed''
    sources to spin a story full of vivid details: according to this news item, the
    attack was to take place during the filing of nominations in Banaras and that
    the terrorists had conducted a ''recce'' (reconnaissance) of the district headquarters.


    Another Hindi newspaper''s bold headline was ''Engineering students turned out
    to be terrorists used to read Quran in front of the landlord''. Following online
    outrage against this blatantly communal headline, it was changed to a more sober
    one: ''Six terrorists affiliated to IM arrested from the state'' (JTSA 2014).


    This reporting was a deliberate attempt at polarizing the electorate. Moreover,
    the constant appearance of ''IB alerts'' in the media served as an excellent device
    to pump the image of a leader with the ''56-inch chest''.


    Modi''s speeches and the report around terror threats to him crafted the tough,
    muscular, macho Hindutva icon who would rein ''Islamic terrorism''. Every potential
    and foiled attack burnished his image.


    ***


    This chapter aimed to draw out the connections between fear appeals about terrorism
    and elections, and more specifically the place of such fear rhetoric in the electoral
    success of Modi''s campaign. Drawing upon speeches, electoral advertising, and
    communication strategies devised by Modi and his team, the chapter demonstrated
    that such an appeal was, in fact, quite significant to the ensemble of images
    and ideas circulated in the course of the campaign. In the figure of Modi merged
    several narratives: Hindu pride, potent manhood, and other of the Muslim. Even
    as it did not appear starkly as a central motif in the'
  merge: -1
  pgno: 132
- img_proc: true
  md: '# 112 Manisha Sethi


    campaign, terrorism remained an important subtext of creating the allpowerful,
    invincible heroic leader, of consolidating a majoritarian vote behind this leader
    through subtle crude signs and tropes which identified a community as an internal
    enemy, casting political rivals as complicit in weakening of national security
    to defend ‘vote-bank’ politics. Most of all, it situated this crisis of national
    security and terror threats within the matrix of a larger crisis of governance
    and offered Modi as the only panacea.


    However, our survey of the history of the relationship between fear appeals and
    election campaigns in the earlier section illustrates two things. One, Modi was
    not the first to employ appeals about terrorism while seeking votes in 2014; in
    fact, there is a lineage that stretches back to the Congress election campaign
    in 1984. Modi himself has deployed these appeals extensively in his election campaigns
    in Gujarat quite successfully. Second, and more significantly, there is no certain
    congruence between fear appeals and electoral outcomes. The same slogans and speeches
    which Modi queried in 2014 failed to arouse either anxiety or anger among the
    voters in 2009, even though the year had seen a series of deadly explosions across
    the country. The rhetoric around terror lost to other material issues (incidentally,
    they had worked well in Gujarat assembly elections between 2002 and 2007). Nonetheless,
    when combined with general frustration about the real or perceived ineptness of
    the incumbent government, the appeals to impending terror threats found resonance
    in 2014.


    Though prediction is a risky business, it is interesting to observe how these
    issues played out in the assembly elections held after the 2014 general elections.
    In Bihar, for example—which, remember, had seen explosions in Modi’s rally as
    well as a blast at the Bodh Gaya temple, and provided Modi with ample ammunition
    to label his opponents as weaklings and beholden to secular vote banks (see Modi’s
    speech given earlier), and the BJP alliance was roughly defeated by the Grand
    Alliance in the assembly elections which took place in October–November 2015.
    This happened despite the BJP and its top leadership deploying the stock images
    of Pakistan, national security, Muslim terrorist groups, and vote-bank politics
    in their speeches as well as the full-page advertisements (see Figure 2.4) that
    appeared in newspapers.'
