    This unequivocal evocation of the context of violence and identification of possible
    victims stems from the 1990s policy discourse of affirmative action that transformed
    the marginalized groups into a political issue. The bill contextualizes the state
    as a point of departure to identify the hierarchical position of social groups.
    Hence, religious and linguistic minorities—Scheduled Castes (SCs) and Scheduled
    Tribes (STs)—at the state level are demarcated as groups that require protection
    against targeted violence. In other words, the bill seems to respond to various
    government and nong reports that show that poor and marginalized communities are
    the main victims of organized violence. The Bill, thus, emphasizes the relative
    marginalization of certain groups at the state level and, at the same time, calls
    upon the central government for a determined and possible administrative reaction.
    The introduction of the Bill, for instance, says:


