    # Dravidianism—Legacy of a Counterculture


    The Self-Respect Movement by E.V. Ramasamy (also known as Periyar; hereafter Periyar)
    in Tamil successfully turned these issues into a formidable ideological debate
    in the public realm from the 1920s onwards. The movement and its subsequent political
    manifestation—Dravidar Kazhagam (DK)—did not only challenge the hegemony of Brahmanical
    values but also laid the foundation for the nature of modern Tamil polity. The
    configuration of modern Tamil polity in the discourse of the Dravidian movement
    squared upon the unassailable principles of a counterculture celebrating Tamil
    antiquity and anti-Brahmanical cultural values. Celebration of the vernacular
    was central to the Dravidian movement and the political culture it unleashed.
    This celebration resonated with Gramsci’s (1985: 168) assertion that ‘the vernaculars
    are written down when the people regain importance’.


    To be precise, the Brahmins’ overt allegiance to the supremacy of Sanskrit and
    their desperation to assert themselves as the custodians of Sanskrit/Hindi tradition
    was not the major bone of contention for Periyar. The key contention was the sacralization
    of the Sanskrit/Hindi tradition as the locus in India’s civilational legacy. This
    self-styled sacralization of that legacy was aided by the contributions of British
    Orientalists, effectively inferiorizing non-Sanskrit/Hindi traditions. For Periyar,
    self-respect and dignity were non-negotiable elements for a nation. In other words,
    Brahmanical supremacy relied on three major sources—cast, religion, and language.
    Periyar sought to debunk these sources.


    Periyar categorically stated that jati (caste) had no genesis in Tamil traditions
    as... Similarly, Brahmanical Hinduism and Sanskrit remained outside the purview
    of Tamil sociocultural boundary. Therefore, the Self-Respect Movement'
