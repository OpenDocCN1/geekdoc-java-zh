    # Muzaffarnagar Violence and BJP’s Election Campaign


    To understand the aforementioned puzzling question, let us look at the reception
    of this riot in electoral politics. The BJP, which began its 2014 electoral campaign
    with the slogan Sabka Saath Sabha Vikas at the national level, used a completely
    different political language in the riots in Muzaffarnagar. Making an obvious
    reference to the riots in an election speech, Amit Shah, the BJP president, said
    that the 2014 Lok polls were an opportunity to seek ‘revenge’ for the insult’
    inflicted during the riots in Muzaffarnagar (Times of India 2014). Although an
    FIR was filed against him for using the word ‘revenge’ to highlight Muzaffarnagar
    riots as ‘Hindu subjugation’,32 On the other hand, the SP leaders did not use
    the riots as a main electoral agenda, though the narrative of Muslim victimhood
    had always evoked to re-establish the party’s image as a Muslim saviour.33


    The BJP’s electoral campaign requires some elaboration, especially in the context
    of media-centric discourse of violence, which was discussed in the previous sections.
    The party used marketing strategies to evolve what came to be as ‘Brand Modi’.
    The campaign however underplayed the conventional methods of political mobilization.
    Even the party’s electoral manifesto was not prioritized as a legitimate political
    statement.34 Instead, the campaign was centred on two main


