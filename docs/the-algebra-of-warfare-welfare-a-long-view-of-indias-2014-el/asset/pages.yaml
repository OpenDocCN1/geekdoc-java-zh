    Having said this, let me remind to the spirit of the question. When the National
    Democratic Alliance (NDA) came to power in 1996 with Vajpayee as the prime minister,
    the party and its supporters were less euphoric, partly because the then prime
    minister was perceived as moderate for a BJP leader. In contrast, Modi fashioned
    himself an unquestionable leader, captured power through two major devices. First,
    was through a process of demonization of religious minorities, particularly Muslims,
    who are widely perceived as cultural outsiders in India, and sacralization of
    the Hindu majority, who are described not only as insiders but also as the authentic
    owners of India, an idea which Rashtriya Swayamsevak Sangh (RSS) ideologues have
    nurtured since the 1930s. But the central-state authority in independent India
    could not be defined as Hindu before 2014. Thus viewed, the 2014 elections resulted
    in a paradigm shift in India. Second, as the development plan, Modi sold what
    was euphemistically referred to as the ''Gujarat model''. Development now is widely
    perceived as scores based on Human Development Index (HDI), and on several parameters
    of the HDI, the performance of the state of Gujarat did not afford a model. At
    any rate, a development model should encapsulate all citizens irrespective of
    primordial identities. The slogan, ''Sabka Saath Sabka Vikas'' (everybody''s development
    along with all), was floated by Modi after he left Gujarat for Delhi. During his
    three terms as the chief minister of Gujarat, the most notable ''development''
    was polarization of Hindus and Muslims in the state. Further, as chief minister
    of Gujarat, he was constantly emphasizing Gujarati pride (asmita) in and out of
    season. But after becoming the prime minister, he is deny-ying the Telugu, Bengali,
    and several other regional–linguistic prides.


    That is the 2014 electoral performance cannot be referred to as ''democratic''
    or ''developmental'' by any discerning analyst.


    RT: Many observers compare the 2014 Indian election result with the 2002 French
    presidential elections, when the far right initially secured more votes than the
    Socialist and other parties. The outraged public forced all parties to rally behind
    the centric president to defeat the fight. In contrast, Narendra Modi, who mainly
    maintain, facilitated the anti-Muslim pogrom in 2002 in Gujarat, ''democratically''
    elected as the prime minister. During the 2014 campaign, he continued to speak
    the divisive religious language of versus them. Of course, he was also projected
    as a leader of the backward castes, who will work for the welfare of the common
    man, so to speak. Does not the simultaneous use of polarizing'
