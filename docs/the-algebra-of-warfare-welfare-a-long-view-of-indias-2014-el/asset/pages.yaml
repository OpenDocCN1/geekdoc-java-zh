    # MEDIA, CORPORATES, AND DEMOCRACY

    Lessons from the 2014 General Elections


    Sudhir Pattnaik


    Indian politics became increasingly corporatized after the advent of neoliberal
    liberal economy under the Narasimha Rao-Manmohan Singh regime. However, the corporates
    faced strong resistance from the poor who refused to part with their land, forest,
    and natural resources; the resistance to a mighty corporate, Vedanta, by the Gondria
    Kondhs, a particularly vulnerable tribal group (PVTG) in Odisha, which was its
    leading example. Such democratic struggles and popular mobilisation compelled
    the Congress-led United Progressive Alliance (UPA) government to adopt some pro-people
    policies to address these popular movements. Thus, a few legislations were adopted
    including the Right to Information Act, 2005; the Forest Rights Act or the Scheduled
    Tribes and Other Forest Dwellers (Recognition of Forest Rights) Act, 2006; the
    Right to Education Act, 2009; the Right to Fair Compensation and Transparency
    in Land Acquisition, Rehabilitation and Resettlement (LARR) Act, 2013; Indian
    Companies Act, 2013, the National Food Security Act, 2013 (also Right to Food
    Act); and the Street Vendors (Protection of Livelihood and Regulation of Street
    Vending) Act, 2012. As these policies put constraints on the corporates, they
    were obviously unhappy;


