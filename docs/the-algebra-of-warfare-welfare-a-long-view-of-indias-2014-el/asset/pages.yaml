    # Effects of Rumours and Mediated (Un)truth


    Demonstrating the connections between rumour, media, and democracy, this chapter
    has argued that rumour is a tool wielded by the powerful. Modern media has not
    replaced originality; hence rumour, much in the same way that anonymity considered
    central to rumour is not absent in news. As I have shown, rumour and propaganda
    inform each other. To substantiate this argument, I used qualitative data from
    the coverage of 2014 elections by television channels and social media. Media''s
    narrative of Gujarat''s ''spectacular'' development resembled rumour almost none
    of those who fervently spoke of development had seen or known its source (rumour).
    Amid the mass-mediated rumours of development, the fact that Chandola and Millat
    Nagar in Ahmedabad (where Modi lived) had no electricity,'
