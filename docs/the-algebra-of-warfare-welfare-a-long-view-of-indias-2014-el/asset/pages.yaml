  md: '# The RSS, Hindutva and Muslims


    For the Hindu nationalists of colonial India, as depicted in Bankim Chandra’s
    Anandanda Math, British colonists were not necessarily their enemy; but Muslims
    were perceived as the ‘other’ (Noani 1999). The exclusivist nationalism was carried
    by the RSS and its ideology, Madhavrao Sadashrao Golwalkar (1906–1973). Established
    in 1925, the RSS appealed to carry India to the ‘pinnacle of glory by reorganizing
    the entire society and protecting the Hindu Dharma’ (RSS.org 2012). At best, Golwalkar
    was willing to give Muslims the status of ‘second-class’ citizens:


    +   The foreign races in Hindusthan must either adopt the Hindu culture and language,
    must learn to respect and hold in reverence Hindu religion, must enter no idea
    but the glorification of the Hindu race and culture, i.e. of the Hindu nation
    and must lose their separate to merge with the Hindu race, or may stay in the
    country, wholly subordinated to the Hindu Nation, claiming nothing, desiring privileges,
    less any preferential treatment—not even citizen’s rights.(Golwalkar 1939: 104–5)


    According to Hindutva ideologies, there is no distinction between Indian and Hindu
    culture, with religious minorities eventually assimilated by their paying allegiance
    to the samsams and mainways of the majority as those of the nation’ (Jaffrelot
    2007: 5). The long-term project of the Sangh Parivar is to create a Hindu rashtra
    in which Muslims automatically become the ‘principal enemy’ (Kanungo 2003: 21).
