    need to be observed and studied. To put it succinctly, the ''everyness'' of democracy
    needs to be studied intensely and constantly. But which method/s would be invoked
    to understand specific democratic processes depend upon the differing contexts.
    To study the democratic process, the decision-making process in the legislatures
    and the process of implementation of the laws needs to be studied and they require
    different ''methods''. I believe that for a sociological analysis one should resort
    to ''methodological eclecticism'', opting for differing combinations with varying
    emphasis depending on the context studied.


    RT: How complex is the Indian electoral system and how does it affect our electoral
    behaviour in your opinion?


    TKO: In the case of India, we have several religions. Of course, the social demographic
    situation is that the dominant religious group—namely Hindus—constitutes 82 per
    cent of India''s population. The remaining 18 per cent makes nearly 200 million
    people, a size much bigger than the biggest countries in Europe. Remember, unified
    Germany''s population is only around 80 million. Therefore, as India''s religious
    minorities constitute only 18 per cent of the total population, the three major
    religious groups among the religious minorities of India—namely Muslims, Christians,
    and Sikhs—together have a population much bigger than that of most countries in
    the world, and hence they play a major role. Their political choices do make a
    difference. Consider the case of Punjab: the Sikhs are more than 85 per cent there
    there. Similarly, there are three Christian-majority states in north-east India
    and even in Kerala and Goa, Christians are in sizeable numbers; and they matter
    in the electoral politics of these states. Of course, the Muslims are widely dispersed.
    While they are majority in Jammu and Kashmir and in Lakshadweep, their presence
    is substantial in several other provincial states. Thus, we are not dealing with
    one religious group. Moreover, democratic elections are territorial anchored;
    that to say, there are constituencies and there are contestants who are asking
    for votes in that constituency. Therefore, territorial anchorage has something
    to do with electoral behaviour. In we have a system where Sikhs will vote only
    where they live, the situation obviously becomes quite different, in fact, simpler.
    The Indian context is not like that. There is a lack of co-terminality between
    the territorial unit—the constituency—and the sociocultural units in terms of
    religion and caste.'
