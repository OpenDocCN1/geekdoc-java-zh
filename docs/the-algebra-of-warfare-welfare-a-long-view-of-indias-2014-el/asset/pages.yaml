    To understand the BJP''s Muslims better, let us take the example of Mohammad Irfan
    Ahmed (not to be confused with the co-editor of this volume), one of the Minority
    Morcha''s vice presidents. He joined the BJP in 1990 when the Ram Mandir movement
    was at its peak. In an interview with him, he stated that ''it was a difficult
    decision'' to join the BJP.^10 He rationalized the decision on the grounds that
    the BJP was a national party, and hence open to all. As the conversation went,
    he said: ''Ram Mandir was not really a BJP issue, but the party took it in reaction
    to the Mandal card of V.P. Singh. Jawaharlal Nehru, Arun Nehra, Rajiv Gandhi,
    N.D. Tiwari, all of them helped the cause of the Ram Mandir. However, the so-called
    secularists of this century accuse BJP for all the mess.'' In Ahmed''s view, the
    BJP leaders undoubtedly participated in the ''movement'', but they were not responsible
    for the demolition of the Babri Masjid. He instead blamed the prime minister,
    P.V. Narasimha Rao, for failing to act on time. His defence of the BJP is similar
    to Bakht''s who, in a 1997 interview to The Asian Age (whose editor at time was
    M.J. Akbar), had opened:


    The Babri tragedy happened in December 1992. What did the other parties tell us?
    What did BJP do with Babri Masjid? Who raised this controversy Syed Shahabbuddin
    [the diplomat-turned-parliamentarian] who died in 2017]. When did he raise it?
    February 1986. Why did he raise it? Because there was a lock on the door which
    was opened on court''s order. Where was the court? Uttar Pradesh. Who was ruling
    Uttar Pradesh? Vir Bahadur Singh of Congress. Who was ruling at the Centre? Rajiv
    Gandhi. (Ghosh 1997)


