  md: '# Communal Violence, Electoral Polarization, and Muslim Representation


    The discussion in this chapter shows that the Muzaffarnagar violence was an outcome
    of a few context-specific trajectories. The two main communities—Hindu Jats and
    Muslims—are highly divided by caste and class lines. The cultural milieu of the
    district is equally shared by both the communities—even crime against women is
    not specific to any particular social group. However, at the same time, there
    were constant efforts by a section of religious elite to polarize as well transform
    these virtually fuzzy communities into religiously marked entities. This religious
    segregation—Tablighi Jamaat among Muslims and revival of temple-centric religiosity
    among the Jats—worked well and paved the way for the rise of religiously distinctive
    and socially polarized communities. Consequently, Muslims became Jats became visibly
    Hindus in the course of time. In this highly tensed social context, a fight between
    two families acquired a clear communal meaning. The nature of subsequent violence,
    however, cannot be called an encounter between two identifiable communities. The
    Muslims, who were relatively poor and marginalized in the district, targeted,
    killed, and subsequently displaced in a much more organized and systematic manner.
    This pattern of violence underlines the two prime features of contemporary communalism,
    discussed in the second section of this chapter with regard to the Prevention
    of Communal Violence Bill, 2011: communal violence as a form of targeted violence
    and a reflection of social exclusion.


    The BJP and the Hindutva groups politicized these events directly. They continued
    to evoke these riots for electoral gain in the 2014 elections, especially in western
    UP. The ‘subjugation’ of Hindus, especially the victimhood of Hindu women, was
    used systematically by the BJP leaders to call upon the voters to support the
    party. On the contrary, the SP formally tried to maintain a distance from this
    event; yet, Muzaffarnagar is recognized as an important reference point to substantiate
    the story of communalism and Muslim victimhood.


    In this context, two distinctive features of Muslim electoral responses need to
    be highlighted. First, the anti-Muslim targeted violence in Muzaffarnagar could
    not force the Muslims of UP to vote as a group. A sizeable number of Muslims even
    voted for the BJP alliance. This fragmented voting pattern should not be seen
    as a kind of defensive Muslim politics. The Muslim communities of voters, we must
    remember, are constituted at the constituency level.'
