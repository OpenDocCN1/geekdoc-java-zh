  md: 'Kisan Pattnaik, the veteran socialist leader, was opposed to private news broadcasting.
    In an article ‘From Profession to Tamashagiri [Theiatrics]’, he wrote: ‘The world
    is not without alternatives’ (Nayak 2017: 12). However, the dependence on corporate
    sponsorship grew phenomenally over the years, which transformed and diversified
    media at national and regional levels. From a position of supporting private media
    initiatives, corporations gradually shifted their focus to influencing content.
    This shift occurred because the corporate interest in extractive industries directly
    clashed with the livelihood issues of the poor in the resource-rich regions, which
    led to powerful resistance movements against mining corporations. In order to
    deal with these movements the corporates needed control over local and regional
    media. Paranoy Guha-Thakurta (2012) aptly observed: ‘It was no longer the case
    that media would criticize the corporates and still get advertising revenue. On
    the other hand, most media houses entered into partnerships with leading corporates
    wherein they published stories that were friendly to the advertisers.’


    The transformation of corporations from advertisement providers to passive patrons
    of media, and then becoming facto owners, greatly impacted electoral processes.
    In fact, election campaigns started to begin in the media before the dates for
    elections were announced. Moreover, media campaigns ran in such a way that the
    news consumer became an innocent victim without his knowledge and would de favour
    of or against a political party before the elections.


    # The Sangh–Modi–Corporate–Media Nexus


    For the first time after Independence, a prime minister candidate for the general
    elections (2014) was decided not by a political party, but by two external forces
    outside the political party: first and foremost was the Rashtriya Swayamsevak
    Sangh (RSS); and the second was the corporate world. This marked the beginning
    of an era of political outsourcing in Indian democracy. For the RSS, its lifelong
    political ambition to rule India was going to be fulfilled through Modi, a long-serving
    pracharak (one who has renounced family to become a full-time RSS worker). Atal
    Bihari Vajpayee—a towering leader of the Bharatiya Janata Party (BJP) and a former
    prime minister—was also from the RSS. However, he was never considered by the
    hardcore hardcore RSS workers to be a true'
  merge: -1
  pgno: 297
- img_proc: true
  md: '# Media, Corporates, and Democracy 277


    Sanghi (a committed cadre of the RSS) due to his moderate political position.
    Thus, the RSS pushed for Modi''s selection by influencing the internal decision-making
    process of the BJP.


    The role of the RSS in Modi''s selection demonstrates, contrary to the claim by
    the BJP, the latter had never been autonomous from the former (RSS). In fact,
    it was in a two-day long meeting of the RSS, 8–9 September 2013, that Modi’s selection
    was made. Besides the RSS and the BJP, 13 other Sangh affiliates, including the
    Visha Hindu Parishad (VHP), participated in that meeting. Though the decision
    of Modi’s candidature was challenged by veterans such as L.K. Advani and Sushma
    Swayaraj, who was mediating between the Sangh and the dissenters, announced that
    ‘RSS has already made its position clear on the key issue and it was for BJP to
    take a decision’ (Livemint 2013).


    Sangh’s choice of Modi had strong approval from the corporate world, which convinced
    the Indian state would ensure the growth of their capital under Modi. In the industrialized
    democracy, electoral victory seemed impossible without making an alliance with
    capital. Hence, corporate capital and the Sangh cadre came together. A friendly
    corporate-controlled media endorsed the corporate alliance with the RSS.


    # Media’s Anti-Corruption Campaign as Preparatory Ground for 2014


    To understand the 2014 elections and its outcome, it is important to take into
    account important developments that took place between 2010 and 2012. The first
    one was a petition filed by the Centre for Public Interest Litigation in the Supreme
    Court of India for irregularities in awarding 2G spectrum licences in which, for
    the estimate of the Comptroller and Auditor General (CAG), the state lost Rs 1.76
    trillion. Second, an alliance called India Against Corruption was formed under
    Anna Hazare, in 2011, to fight corruption. The coal scam and the Commonwealth
    games gained further boost to the anti-corruption movement. The success of this
    movement led to the launching of the Aam Aadmi Party (AAP) and its electoral victory
    in Delhi.


    The campaign against corruption was obviously directed against the Congress. It
    received huge popular support and the electronic media'
  merge: -1
  pgno: 298
- img_proc: true
  md: '# 278 Sudhir Pattnik


    corporate houses played a key role in patronizing and popularizing this campaign.
    The live 24x7 telecast of the anti-corruption campaigns from Jantar Mantar or
    Ramlila ground in Delhi attracted a large number of people from all classes and
    raised the hope that corruption could be wiped out from India. News presentations
    and panel discussions were designed so that even the Indian intelligentsia came
    to believe the time had arrived for a cause. This media campaign, begun in 2011,
    was so subtle and deceptive that a majority of Indians did not realize that the
    campaign for the 2014 general elections had already started. The media literally
    dragged out the youth in metros such as Delhi to join the anti-corruption campaign.


    A campaign for a corruption-free India was cleverly manipulated by the media to
    support a campaign for Congress-free India. Along with that, the corporate media
    went on create a positive image of Modi, making him a symbol of the Gujarat model
    of development in such a way that it would become acceptable to most people. This
    was ideally facilitated by the prevalent atmosphere characterized by allegations
    of scams and corruption in the Congress-led UPA government. Given that the Indian
    media played such ideological role, number of pertinent issues affecting the common
    citizens of the country did not get any media attention; for instance, the issue
    of farmers'' suicide across regions. Media knew well enough which issues to downplay
    and which to highlight. On 12 December 2013, there was a massive assembly of workers
    in Delhi organized by 11 central trade union organizations to protest the anti-labour
    policy of the government. The media roughly blacked out the protest and instead
    ran 24x7 on Anna Hazare''s anti-corruption campaign, as other issues would have
    diluted the anti-corruption thrust of the party. The other reason behind the erasure
    of the labour protest by the media was obviously the fact that the protest was
    directed against capital. It needs to be stressed that the media was selective
    in picking up issues, conveniently ignoring the corruption in the BJP-ruled states.


    # Media''s Modi Campaign


    The media abandoned anti-corruption campaigns the moment it achieved its objective
    of discrediting the ruling regime beyond repair. Soon the BJP emerged as the favourite
    alternative. The corporates and'
  merge: -1
  pgno: 299
- img_proc: true
  md: '# Media, Corporates, and Democracy 279


    the media decided to put all their premium on the BJP. The campaign strategy was
    clear from the day of the selection of Modi as BJP’s prime ministerial candidate
    that it would promote a leader-centric model of campaign, which would only help
    in the concentration of power in the hands of the future prime minister. Not surprisingly,
    every other party leader was sidelined. Strong leadership, rather than ideology,
    became the focus of the media’s attention, resulting in least concern shown the
    discussion of manifests by different parties (see Chapter 11). In short, the focus
    was squarely on Modi’s charisma. Thus, the media systematically established the
    Modi phenomenon in such a way that the electorate started believing Modi was a
    great leader who could win the elections on his own. Simultaneously, the media
    gave wide publicity to the Gujarat model of development through news, advertisements,
    and panel discussions while remaining silent about the 2002 Gujarat riots. Clearly,
    the strategy worked in favour of Modi.


    The media sold the dream of the Gujarat model of prosperity to the common people
    by selectively presenting data, stories, and narratives about Gujarat. Middle-class
    intelligentsia also fell into the trap as the media never questioned the working
    of the Gujarat model of development (see Chapter 4); rather, the media went on
    spreading fairy tales about the model. Beside corruption, the media also harped
    on dynasty politics—associated with the Congress—to appeal to the youth to look
    for a better alternative.


    The 24x7 news channels created a perception among people that Modi was a strong
    and stable leader that he would ensure India became free of scams and corruption.
    Such a perception became effective and plausible because the media contrasted
    the incumbent Prime Minister Manmohan Singh as dull, docile, and ineffective.
    The media deliberately downplayed the achievements of the Manmohan Singh’s pro-people
    legislations and policies (most of which were later continued, with decorative
    changes in their names by the Modi government), and ridiculed him as the ‘yes
    man’ of Congress president Sonia Gandhi. A prime minister-centric model of election
    campaign, in the style of the US presidential elections, was designed and the
    media devised a model that eulogized Narendra Modi at the cost of his opponent,
    Rahul Gandhi. Media campaigns by the BJP eventually won in the absence of a similar
    campaign strategy by a demoralized Congress.'
  merge: -1
  pgno: 300
- img_proc: true
  md: '# 280 Sudhir Pattnick


    Thus, the image of Narendra Modi as a strong leader who could deliver a Gujarat-type
    development model did create hopes and aspirations. The media preferred to promote
    personality-centric politics without allowing any critical questioning. The national
    media, which was earlier critical of Modi’s role in the 2002 Gujarat riots, shifted
    to Modi’s contributions to a shining Gujarat rolled out a red carpet for the corporates,
    expecting that the same will be repeated nationally if Modi became prime minister.
    In addition, the 2014 elections were the first of its kind which witnessed a global
    campaign involving large participation of the Indian diaspora through social media
    platforms. The Indian diaspora made generous financial contributions to the BJP’s
    campaign (Diplomat 2014). Indeed, the media played a big role in articulating
    the agenda of the dominant aspirant party in such a way that there was no space
    available to the masses to critically question the usefulness, relevance, and
