    presented earlier, one is led to aver that the choice among the AAP, the BJP,
    and the Congress was indeed not a true choice in substance. On most issues, they
    almost converged. The vocabulary of choice, then, is neither about freedom nor
    choice; it is ultimately about our inability to articulate unfreedom and constraints
    which masquerade as freedom and choice. The road of a choice or freedom may not
