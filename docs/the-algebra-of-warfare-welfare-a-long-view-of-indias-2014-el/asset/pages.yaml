    # Evolution of the Corporitized Media


    Indian media has gone through a big transformation ever since Independence, particularly
    in the post-liberalization period. The conventional concern of media had been
    how to sustain itself if the scale of operations is locally unmanageable. This
    was where business and state advertisement support played a major role without
    interfering the editorial autonomy of newspapers. With the arrival of modernized
    printing and broadcast technology, those who wanted to take advantage of it to
    expand their reach had to look for big capital as the conventional sources of
    advertisement revenue to be rather inadequate. This was the time for corporates
    to extend their large hand. Meanwhile, many new developments took place in the
    arena of media. Small private operators (for instance, ''The World This Week''
    by NDTV) allowed space on official broadcast channels such as Doordarshan. As
    the private operators had to mobilize revenue for the production of the programme,
    as well as buying televetime and space, corporate sponsorship was inevitably.
    Generally, foreign media collaborations relaxed the Indian soil to reap benefits
    of the new liberalization policy, which resulted in forging different alliances.
    The Times of India in print and NDTV in the broadcast sectors are the pioneers
    in the field of corporatization. The telecast of the first-ever private analysis
    of elections was initiated by NDTV.


    In his book More News is Good News: 25 Years of NDTV, Prannoy Roy (2016) discussed
    how corporations extended their support for the first-ever private news broadcast.
    He wrote:


    The first tectonic shift in India''s broadcasting policy came in 1995. We at NDTV
    had been pressing the government to allow us to report on India news. One evening,
    the risk-taking, genuinely enlightened head of the Ministry of Information and
    Broadcasting told us he had to give us a chance and allotted us a nightly half-hour
    slot for national news. He added that the government wouldn''t pay a penny for
    the costs of production. We started our rounds of private companies with a plea:''Please
    find the first-ever private news programme in India ... it''s the beginning of
    a new era.'' The response was: Mr Ratan Tata was the first to say yes and fine
    others followed and we were ready to go with three years'' funding and editorial
    independence assured. On 5 February 1995, we aired India''s first-ever private
    news broadcast. (Roy 2016: 4)'
