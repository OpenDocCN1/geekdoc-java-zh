  md: '# xiv  Preface


    wed to the grammar of ethnifying nationalism. Proposals such as Habmars’ constitutional
    patriotism or civic nationalism (Hayward 2007), too, remain subservient to the
    master frame of nationalism, especially with the renewed assertions of populism
    (Müller 2016).


    One may, therefore, justifiably ask: is ‘socialist’ about the Samajwadi Party
    (socialist party)? Likewise, the word ‘socialist’ in the Preamble of the Indian
    Constitution have any signification beyond its decorative presence?


    This book examines the 2014 elections beyond the aforementioned twin types of
    superlatives that pave the understandings of electoral democracy—academic as well
    as popular. Unlike most books belonging to the genre of election studies with
    gigantic numbers and ‘cold statistics’ (Alam 2012: xv)—compiled among the variables
    of constituency, party’s name, caste, region, age, rural versus urban, and so
    on—this volume approaches election and democracy substantively. We use ‘substantively’
    to mean foregrounding of subjectivity liberated from the mere act and decision
    of voting and intend analyse elections as sociological–anthropological processes
    (which are no less political) with institutional anchoring rather than bare political
    events within a span of some weeks or months. Put differently, this volume makes—human
    and non-human, lived and unlived or unliveable—central to any understanding of
    elections and democracy. In our view, probably this is at once the most parsimonious
    and most expansive way to articulate an anthropological–sociological approach
    to election and democracy.


    The reigning assumption that ‘data’ about Indian elections and politics—which
    have witnessed ‘a dramatic increase’ since the early 1990s (Wilkinson 2010: 587)—are
    good things in themselves needs to be questioned. Likewise we ought to ask if
    our texts—packed with colour charts, bars, diagrams, and tables, which contain
    percentages—may divert our attention from the idea that mere data torn apart—the
    subjectivities in their fullness are no super gateways to knowledge, much less
    to meaningful understanding. For, if to understand is to stand ‘under’ (Tiryakan
    2005:305), mere data may disfigure that ‘under’ to present themselves as if they
    were objective truths defying their moment and motive of conceptualization, collection,
    and circulation.


    To recapitulate, the distinction of this volume is threefold. First, rather than
    focussing squarely on the empirical acts of voting and we'
  merge: -1
  pgno: 11
- img_proc: true
  md: '# Preface xv


    party politics—that largely inform voting as well as its studies—it anthropologically–sociologically
    examines the enduring as well as changing institutional, social, political, and
    cultural landscapes in which voting takes place and which shape the choice of
    voting for a given party. As a result, the contributors are able to transcend
    the dualism between formal and informal politics to view elections as a holistic
    political phenomenon: culture of elections and elections of culture (cf. Bertrand,
    Briquet, and Pels 2007). Second, contra statisticlist (distinct from statistical)
    analyses manifest in lifeless data, this volume puts subjectivity at the core
    of our understanding of electoral democracy. To state the obvious, the suggestion
    is not against the use of data per se, for too, have used them, albeit unconventionally
    (Ahmad and Siddiqui 2017), but against a tendency that elevates data to the status
    of an analytical destination, sacrificing pursuit of a coherent understanding.
    Third, and following from the second, the sensibility and trust of the volume
    are largely anthropological-sociological (broadly conceived) even as all contributors
    are not trained as anthropologists or sociologists. After all, the sensibility
    of everyone with a degree in anthropology or sociology is not necessarily and
    always anthropological-sociological!


    We hope that readers—academics across social sciences and humanities as well as
    the interested public at large from many walks of life—will find this intervention
    meaningful and useful to inaugurate a truly democratic conversation about democracy
    and its sine qua non, elections.


