    Democracy and Manifestos in the 2014 Indian Elections


    Irfan Ahmad


    Only a tiny segment of India''s vast and diverse population either reads or seriously
    discusses manifestos of different political parties. Perhaps much tinier is the
    segment whose acts of voting might be determined by the contents of manifestos.
    Yet, manifestos offer a window to understand elections in particular and democratic
    politics in general. In the 2014 parliamentary elections, manifesto itself became
    a topic of debate for the television media (Times Now 2014), not so much on account
    of its contents but more because of the delay by the main opposition party, Bharatiya
    Janata Party (BJP), to release it. The BJP was the last party to release its manifesto
    whereas it was the first to declare its prime ministerial candidate, Narendra
    Modi. The BJP released its manifesto on 7 April when voting had already begun
    in some constituencies.


