    # Editors


    Irfan Ahmad is senior research fellow, Max Planck Institute for Study of Religious
    and Ethnic Diversity, Göttingen, Germany. His most recent publication is Religion
    as Critique: Islamic Critical Thinking from Mecca to the Marketplace (2017) and
    Oxford University Press, 2018). Before working as associate professor of political
    anthropology at Australian Catholic University (ACU), Melbourne, Australia, he
    taught politics and anthropology at Monash University, Melbourne, Australia, from
    2009 to 2013. He was the founding co-editor of Journal of Religious and Political
    Practice from 2015 to 2017. He has held visiting positions, inter alia, at Brown
    University, Rhode Island, USA.


    Pralay Kanungo is professor of politics at Jawaharlal Nehru Nehru University (JNU),
    New Delhi, India, and fellow at Max-Weber-Kolleg, Erfurt, Germany. Previously
    chair of Contemporary India Studies, Leiden University, the Netherlands; fellow
    at International Institute for Asian Studies, the Netherlands; honorary professor
    at ACU, Melbourne, Australia, Kanungo is a guest professor at Sichuan University,
    Chengdu, China. He is the author of RSS’s Tryst with Politics: From Hedgewar to
    Sudarshan (2002) and co-editor of The Politics of Ethnicity in India, Nepal and
    China (2014). He was the principal Indian investigator of Indian–European Social
    Sciences Research Networking Project on Indian elections.'
