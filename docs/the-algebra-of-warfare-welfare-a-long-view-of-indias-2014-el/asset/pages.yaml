  md: '# AFTERWORD


    Pralay Kanungo


    The idea of this volume had been the outcome of long conversations between an
    anthropologist and a political scientist, gradually taking shape through continuous
    exchange of ideas and sharing of experiences. Despite different disciplinary backgrounds
    and training, perceptions and approach, we shared some common ground: we both
    worked on religion and politics, connected theory and practice, adopted interdisciplinary
    approach, privileged political anthropology, tracked everyday practices, and followed
    ethnographic method. Our shared social, political, and intellectual concerns drove
    us to collaborate produce this volume on the 2014 election, which aspired to be
