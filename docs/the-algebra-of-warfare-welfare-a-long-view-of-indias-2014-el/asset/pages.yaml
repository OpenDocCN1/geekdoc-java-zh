    2018, which had earlier elected the UP chief minister and deputy chief minister,
    sent out important political inferences.


    First, Modi’s welfare economics has not brought achhne for the common man so far—youth
    remain jobless, farmers face acute distress, small businesses struggle for survival,
    and big businesses feel stifled. Thus, all who voted for him are getting disillusioned,
    and if nothing correct happens soon, they may change their minds in future. Second,
    as Modi’s welfare agenda has not delivered on ground to meet the aspirations of
    various classes and social groups, a confident Modi seems to have buckled under
    pressure and criticism. Third, when Modi feels vulnerable without enough achievements
    to his credit, in an act of desperation he may likely dump welfare and fall back
    upon the Modi rhetoric to retain his electorate. If the second line of strategy
    is adopted, then a team with Hindutva firebrands as Yogi Adyanath will provide
    ammunition against Muslims by escalating the Ram Mandir issue; a test balloon
