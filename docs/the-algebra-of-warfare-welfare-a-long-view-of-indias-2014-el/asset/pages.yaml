  md: '# Communal Violence, Electoral Polarization, and Muslim Representation 193


    magnitude of targeted violence against them would decrease, simply cannot be substantiated
    in the case of Muzaffarnagar. There was a significant Muslim presence in the UP
    assembly at the time of riots. Muzaffarnagar district itself was represented by
    two Muslim MLAs and one Muslim MP.


    This failure of efficacy points towards the structural logic of representation
    in the Indian context. I have argued elsewhere that Muslim representation can
    be seen in a formal as well as in an informal sense. The elected Muslim representatives—MLAs
    and MPs who may or may not be elected exclusively by Muslim electorates—characterize
    the formal form of representation. This form corresponds to the constitutional
    principle that electors residing in a territorially defined constituency constitute
    a homogeneous community (of voters), whose political interests are identical,
    and therefore it should be represented by its own member(s). Unlike the formal
    electoral representation, the informal representation does not depend upon the
    participation of common Muslims as legitimate stakeholders. In this case, the
    ‘Muslim presence’ is evaluated differently: the Muslims in government institutions,
    public bodies, decision-making forums, influential individuals, and religious
    and civic organizations are marked as an expression of inclusiveness (Ahmed 2016:
    364–8).


    In the case of the Muzaffarnagar riots, the formal form of representation could
    not work for two possible reasons. First, the compulsions of competitive politics
    (party line and so on) could not allow the Muslim MLAs to act exclusively as Muslim
    representatives⁴² Second, and perhaps most importantly, the elected Muslim representatives
    did not evoke any grand imagination of Muslimhood. They responded to their immediate
    constituency—the community of Muslims they identified themselves with. In other
    words, the Muslim heterogeneity in UP prevailed over the imposed Muslim homogeneity.


    But, at the same time, the informal form of representation functioned differently.
    The Muslim social-religious organizations—particularly the JUH—emerged as legitimate
    stakeholders in post-riot reconstruction work. This kind of ‘informal form of
    representation’ worked at the bottom level of society and received favourable
    state recognition.


    > ⁴² Kadir Rana’s speech in the post-Juma prayer in the rally on 30 September
    2013 is the only reported incident when a Muslim representative spoke directly
    as a Muslim.'
