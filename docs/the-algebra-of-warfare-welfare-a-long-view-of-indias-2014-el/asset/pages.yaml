    In his second contribution, ''Unity in Diversity: Democracy and Manifestos in
    the 2014 Indian Elections'' (Chapter 11), Irfan Ahmad offers a detailed exploration
    of manifests of three parties: the AAP, the BJP, and the Congress. Paying attention
    to their texts as well as visual symbolism, the chapter argues that there were
    more similarities than differences among them. The discussion on similarity is
    organized under three headings: (a) Economy, Development, Religion; (b) Social
    Groups; and (c) International Relations and Security. The next section dwells
    on the minor differences to say that they, too, did not reflect what Jacques Rancière
    calls dissensus and takes, unlike Schmitt, as the core of the political. Ahmad
    concludes with some observations on the prevalent views that elections offer freedom
    of choice to show their limits, structural and theoretical. Ahmad''s contention,
    following Rancière, is that elections and their manifest policies that inscribe
    the world differently as opposed to a possible different world. In Rancière''s
    terms, this shows the weight of the warfare-w synthesis and the lack of an alternative
    to it.


    Before the volume concludes with an ''Afterword'' by Pralay Kanungo, in the final
    chapter, is Chapter 12, R. Thirunavakkarasu holds a detailed conversation with
    T.K. Oommen, Professor Emeritus at the Centre for the Study of Social Systems,
    Jawaharlal Nehru University, New Delhi. Formerly, president of the Indian Sociological
    Society, and an established author with many works of distinction to his credit,
    Oommen has influenced a generation of sociologists, some of whom contributors
    to this volume. Given the anthropological-sociological approach of this volume,
    it is only fitting to elicit Oommen''s views on how the discipline he worked in
    has historically dealt with the subjects of elections and democracy. The nature
    and subject of this conversation between Thirunavakkarasu and Oommen make it as
    much a chapter about the present as it is a chapter in the history of Indian sociology,
    or about the sociology of sociology. Thirunavakkarasu poses thoughtful and probing
    questions about the past as well as future of sociology-anthropology in relation
    to the study of elections. Drawing on his vast, long, rich experience as a teacher,
    as well as his prolific scholarship'
