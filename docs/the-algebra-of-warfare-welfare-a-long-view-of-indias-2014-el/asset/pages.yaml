  md: '# Democracy as Rumour 77


    road, water, or public toilets and that people like Jabbar Sheikh earned US $3
    a day to support his family of five (Langa and Gadhavi 2014) were suppressed to
    sustain the rumour of development. The context facilitating the rumour of development
    was marked by the emerging interrelationships among media, elections, and neoliberal
    economy. This chapter suggests how designer democracy might capture this new dynamic.


    An anthropology of rumour, media, and democracy must also ask: what do rumours
    do? In 2014 elections, rumours generated a regime of truth. Drawing on Foucault,
    Hall (2006:169) avers that central to a regime of truth is its effect of ‘regulating
    relations of power’. Rumours of development were intended to simultaneously erase
    Modi’s involvement in the 2002 pogrom and portray Muslims as the enemies of development
    by branding them as ‘terrorists’. Without waiting for evidence, the media’s constant
    blaming Muslims for terrorism since 9/11 (Ahmad 2017c) fashioned a regime of truth
    that India was at war with a Muslim enemy—external and internal. In the 2004 Gujarat
    elections, the politics of enmity was in full display as BJP posted with photos
    of the president of Pakistan, Parvez Musharraf, and Modi depicted as enemies (Bunsha
    2006). This was enacting Schmittian politics—Muslim antagonism (Schmitt 1996;
    Khare 2014).


    A significant strategy in creating this regime of truth was the mythologizing
    of Modi as a warrior of the Hindu cause. Contra the incumbent ‘impotent’ prime
    minister, Manmohan Singh, depicted Modi as someone with a ‘56-inch chest’ (that
    is, macho-muscular), as the savior of India (Srivastava 2015). Like God Ram, Modi
    had left home. A celibate, king of Hindu hearts, vegetarian, yoga practitioner
    (Marino 2014; Mehta 2006), as a child Modi sold at a railway station. It should
    be noted that the railways had no record of Modi as a tea seller and this myth
    was floated in 2014 (Times of India 2015a). Bird and Darden (2009) note how mythology
    and news are intertwined. They discuss Barthes, who located sources of myth, inter
    alia, in newspapers, advertisements, and films. By classifying what is newworthy,
    media generates myths to create a reality (Lule 2001). Media mythologized Modi
    precisely in this sense.


