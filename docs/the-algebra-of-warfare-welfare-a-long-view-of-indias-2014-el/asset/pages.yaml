  md: '# Democracy as Rumour 59


    ''politics as media''. In conclusion, the chapter discusses the effects of mass-mediated
    rumours and three distinct factors that enabled the BJP''s victory. It ends with
    comparative observations on the interrelationships between rumour and democracy
    beyond India.


    Situated in the emerging anthropological subfield of news and journalism (Bird
    2010b), this chapter draws on my earlier ethnographic fieldwork on Indian media
    (Ahmad 2014b). The anthropology of news and journalism has predominantly dealt
    with the reception of news media (Bird 2010a; Peterson 2010; Rao 2010). Using
    critical course analysis (van Dijk 2009) on the contents of television news—a
    neglected aspect Bird (2010a) urged anthropologists to address. Although I am
    aware of the need to study rumour of rumours, my focus is on their production
    and representation. Postill (2010: 8–9) notes that practice theory (concerned
    with reception) cannot explain phenomena such as the 2004 tsunami and ''rumours''
    and hoaxes across internet and mobile networks''. It is interesting to note that
    the 2014 election was called a ‘political tsunami’ (Sardesai 2014: xi). As the
    anthropology of news journalism is ‘inherently multidisciplinary’ (Bird 2010a:
    14), so is my intervention.


    # Examining the Separation: Rumour, Propaganda, Advertising, Public Relations
    (PR)


    I find Weeks'' and Garrett''s (2014: 402) definition of ''rumour'' useful:Rumours
    are unverified stories or information statements people share with one another.’
    An important difference between rumour and gossip concerns their respective scale.
    A communication becomes a rumour when it spreads via a large number of people.
    Gossip, in contrast, is focussed and first-hand. Although the subject of rumour
    may be impersonal, that of gossip is not (Coady 2012: 87, 107n4).⁸ The merit in
    Weeks'' and Garrett''s definition is rumour''s relative neutrality vis-à-vis


