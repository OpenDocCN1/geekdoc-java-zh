  md: '# I


    # DEMOCRACY AS RUMOUR


    Media, Religion, and the 2014 Indian Elections


    Irfan Ahmad


    The conscious and intelligent manipulation of the organized habits and opinions
    of the masses is an important element in democratic society. Those who manipulate
    this unseen mechanism of society constitute an invisible government which is the
    true ruling power of our country.


    > —Edward Bernays¹ (cited in Fuller 2015: 290)


    # The Argument: Media, Rumour, and Democracy


    It is my hypothesis that rumour, democracy, and media—in the ‘East’ and the ‘West’
    alike—are connected. Much of the literature, however, does not make this connection
    because it links rumour to peasants (prior to the onset of electoral democracy)
    who did not operate in the parliamentary realm. Furthermore, rumour belongs to
    ‘precapitalist society’ where, according to Guha (1983: 256), it is a natural
    medium of insurgency in the absence of literacy democracy pertains to capitalism
    with literacy. Put differently, the assumption here is that whereas the sources
    of written/printed words are identifiable, those of oral words are not. Another
    perspective views rumour as a threat


    ¹ An architect of modern public relations and nephew of Sigmund Freud.

    Irfan Ahmad, Democracy as Rumour: Media, Religion, and the 2014 Indian Elections.
    In: The Algebra of Warfare-Welfare:A Long View of India’s Election. Edited by
    Irfan Ahmad and Pralay Kanungo, Oxford University Press (2019). © Oxford University
    Press. DOI: 10.1093/oso/9780199489826.003.002'
