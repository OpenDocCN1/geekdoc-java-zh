    With the installation of Hindu nationalist governments in New Delhi (1998–2004)
    and in many other states, the Sangh–guru alliance became more interdependent as
    both needed each other''s patronage. Thus emerged a bonding between public Hinduism
    and Hindutva (Kanungo 2016), and many prominent New entrepreneurs such as Baba
    Ramdev and Sri Sri Ravishankar (Tollef 2011) became close with the Sangh Parivar.


    # The Making of Baba Ramdev


    Many interesting accounts are available on Ramdev''s life history (Deka 2017;
    Pathak-Narayn 2017; Raj 2010). He was born in the mid-1960s as Ramkish at Alipur
    village in Haryana in a backward caste Yadav farmer''s family. As Ramkish got
    a paralytic attack in his childhood and developed physical deformities, instead
    of going to the field to assist his parents, he took refuge in the village library.
    Two books inspired him to change the course of his life: one was on yoga; and
    the other was Satyarth Prakash by the Arya Samaj founder, Swami Dayananda. One
    day he fled from home and enrolled himself at the Kanpur Gurukul (residential
    school where knowledge is imparted-following-guru-shishya parampara [teacher-pupil
    tradition]) in Haryana where he learnt Ponnini''s Sanskrit grammar, the Vedas,
    the Upanishads, and Ayurveda. There he met his future associate, Balkrishna. From
    Kanpur Gurukul, he moved to Kalwa Gurukul, where he was rechened as Ramdev and
    got further training in yoga and Sanskrit literature and grammar from Acharya
    Baldev.


    As the boys at Kalwa Gurukul used to tease him for his physical deformity and
    squint eye, he became more determined to prove his physical fitness and overcome
    his physical disability. He mastered complex yogic breathing exercises and postures
    as ascetic practices at the gurukul. From Kalwa he moved to the Himalayas in search
    of moksha and spent three years near Gangotri, meditating practicing yoga and
    Ayurveda. He introspected on his future


