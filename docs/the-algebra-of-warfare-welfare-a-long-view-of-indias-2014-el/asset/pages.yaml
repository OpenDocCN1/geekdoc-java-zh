    This brings us to the main argument of this chapter. There is a highly complex
    and multi-layered relationship between the communal and targeted violence against
    Muslims and the actual Muslim voting behaviour. No doubt that communal violence
    does shape the contours of Muslim identities in various contexts, but it does
    not necessarily determine Muslim electoral preferences.


