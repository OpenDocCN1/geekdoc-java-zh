  md: '# Modi and the Spectre of Terrorism 93


    This chapter examines the extent to which the discourse of terrorism entered Modi’s
    election campaign and the role it may have played in sweeping the Modi-led coalition
    to power. It argues that terrorism as an election issue was carefully calibrated
    by Modi’s managers: raised directly in one place, elliptically in another, and
    spoken about through codes and signs elsewhere. The dangerous other identified,
    the outgoing government lambasted for failing to quarantine the danger, and an
    alternative ‘Gujarat model’ of battling terrorism held up. The process of communicating
    these threats and dangers was, first, Modi’s speeches and BJP’s publicity material,
    and the extensive reportage, commentary, and analysis focussed on the persona
    of Narendra Modi.


    We are not arguing that these fear appeals were the only reasons that swept Modi
    to power. However, these do constitute an important element of the wider use of
    ideas and images that Modi’s media team circulated. The central theme was that
    of the powerful, decisive leader, in contrast to the opposition, and most certainly
    the general and soft-spoken Manmohan Singh, who was dubbed mami baiba (the one
    who silent) by BJP’s propagandists. In fact, terrorism was not an isolated theme,
    but criss-crossed with other issues, such as women’s security, price rise, the
    drug problem in Punjab, and so on, feeding into the construction that the country
    was tottering on the edge of a grave crisis—things were falling apart and only
    one man could fix them.


    Terrorism remained quite key, rather than peripheral, to defining this persona,
    and in reiterating the BJP’s era of India as essentially a Hindu nation. One of
    the most mediatized elections ever, I will also examine the part played by the
    mass media in cementing this discourse of fear and Modi’s vigour as a leader.


    The chapter is divided into various sections. In the first section, I briefly
    lay out the contours of the relationship between fear appeals about terrorism
    and electoral behaviour in democracies. In the second, I trace the line of such
    fear appeals in Indian elections, particularly in the 1984 general elections,
    which took place in the shadow of the Punjab insurgency and Indira Gandhi’s assassination.
    In the third and fourth sections, I map the deployment of terror and fear troops
    in Narendra Modi’s election campaign of 2014. In the penultimate section, I describe
    the crafting of the Hindu image in the elections'
