    RT: India is often depicted as one of the largest democracies in the world. So
    far, it has conducted 15 general elections to the Lok Sabha (Lower House of India’s
    Parliament). Only recently have sociologists started paying attention, albeit
    little, to ‘Election Studies’. All along—from the 1950s, to the 1970s—sociologists
    in India were preoccupied with research on family, marriage, kinship, caste, and
    village studies. What prevented Indian sociologists from focussing on the study
    of elections if/when sociologists want to study them, what methodology would you
    suggest for them to adopt?


    TKO: All over the world, elections were not the primary focus of sociologists
    and social anthropologists. In fact, political scientists studied electoral behaviour
    continuously—before election, during election, and post election—and their singular
    question has been ‘Votes for whom, and why?’ The question is partly descriptive
    and explainatory. Thus, elections have been a very important area of investigation
    for political scientists. This is true in the case of India too.


    Psychologists would always try to predict the likely results of elections and
    invariably would go wrong. That does not make them irrelevant, however. Sociologists,
    as you indicate, traditionally interested in certain themes. Why were they involved
    in those kinds of research themes? One straight explanation is this: Indian sociology
    has been very much conditioned, in fact overshadowed, by British anthropological
    traditions. That is because of a colonial connection. Social anthropology has
    been defined in the West as the study of the ‘other’. And for the colonizers,
    India was certainly an ‘other’. The British scholars were interested in issues
    such as religion, caste, village, family, marriage, and kinship. Further, there
    were no elections during the colonial period. Understandably, in the scheme of
    studying Indian sociology and social anthropology, electoral analysis did not
    figure. Over time, as you have said, things have changed a bit indeed.


    If sociologists were to study electoral behaviour, they should link it with elements
    of social structure, such as caste, gender, age, religion, language, and above
    all, caste in the Indian context; simply focussing on who votes for whom and why
    is of very limited relevance in sociology. Unless one relates these social structural
    features with electoral behaviour, it cannot be called sociological. There is
    also, if I may say so, a social movement dimension because electoral behaviour'
  merge: -1
  pgno: 359
- img_proc: true
