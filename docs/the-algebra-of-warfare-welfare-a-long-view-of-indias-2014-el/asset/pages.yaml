- img_proc: true
  md: '# 192 Hilal Ahmed


    communities of voters adjusted themselves with the requirements of competitive
    electoral politics in a local setting. There is a strong possibility that this
    localized electoral polarization of Muslims may or may not be affected by immediate
    events, as communal violence. It is precisely what happened in Muzaffarnagar.
    The widespread displacement of the victims of communal violence affected the constitution
    of the Muslim community of voters in the Muzaffarnagar district in 2014.

    Despite the Election Commission''s drive to include the names of riot-affected
    people in the electoral rolls, a significant number of displaced Muslims could
    not cast their votes.41 On the other hand, Muslim communities of voters in other
    constituencies of UP, as it appears from the survey data, responded to constituency-specific
    electoral issues.


    Second, the Muslim voting pattern in 2014 must also be seen in relation to the
    aggressive BJP campaign. The Modi-led BJP spoke of Muslims as a closed and homogeneous
    social group—which does not satisfactorily respond to the nation''s patriotic
    demands—and Muslims as an unimportant constituent of a larger national community
    (therefore, they should not be treated exclusively as a minority group). Although
    the ''nationalism'' of Muslims could not become an important issue in the 2014
    campaign, the party leaders tended to evoke the ''Sabka Saath Sabka Vikas'' slogan
    to avoid specific questions related to Muslim backwardness and marginalization.


    The strategy of the BJP to ignore Muslims in a more direct fashion, interestingly,
    was not countered by any political force. In fact, the SP, BSP, and the Congress
    did not make any attempt to project Muslim exclusion or violence against Muslims
    as a national-level concern. In such a scenario, the focus shifted to constituency-level
    Muslim concentration: for the BJP, Muslims were to be avoided to configure a new
    Hindutva constituency; and for others, Muslims were to be ro in to recreate conventional
    whirlwind alliances (such as Yadav Muslims for the SP, Dalit Muslims for the BSP).


    The constituency-centric Muslim electoral responses are also linked to the question
    of Muslim representation and its effectiveness. The argument that if Muslims are
    represented by Muslims, the


