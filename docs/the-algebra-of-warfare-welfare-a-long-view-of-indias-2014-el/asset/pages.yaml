  md: '198 Bikramadityya Kumar Choudhary


    During the campaign, ''Mahādēv'' was replaced by ''Modi''; then, ''har mahadev''
    became ''har Modi''. The slogan—replacing Mahadev with Modi—became so contentious,
    fearing a backlash, Modi himself appealed for his withdrawal. The opposition parties,
    including the A Aad Party (AAP), the Indian National Congress (hereafter Congress),
    and the Samajwadi Party (SP), objected to this metaphorical equation between Modi
    and Lord Shiva. So did certain sections of the population from Banaras. The controversy
    reached a climax when the SP supporters observed a purificatory ritual by washing
    the Malviya statue with milk, claiming that the touch of Modi had polluted the
    sanctity of Malviya (Business Standard 2014).


    Evidently, Bharatiya Janata Party''s (BJP) effort was to cast the image of Banaras
    along a specific line to suit its interests. However, Banaras as a city-space
    is far more diverse than the singular, exclusive BJP tried to project. Banaras
    has multiple, overlapping identities. However, during the elections, the city''s
    mosaic antiquity was buried in archival forms, superimposing one identity over
    others. There are scholarly works to suggest the various ways the city''s historical
    identity is constructed and utilized to manifest its mythical identity (Choudhry
    and Prakash 2016; Desai 2007). Such mythical identities are constructed and utilized
    to create a particular kind of historicity of space to reproduce, manipulate,
    and perpetuate a normative ''history'' about Banaras as a city-space. In the 2014
    elections, the BJP chose to use these identities—Lord Shiva and Ganga—to mobilize
    the electorate. The mobilization worked as BJP won the seat with a margin of about
    36 per cent higher share, compared to the previous election when Murli Manohar
    Joshi of BJP won by a margin of 2 per cent The construction and use of ''myths''
    about Lord Shiva and the Ganga prompt many questions: what was the Gujarat model
    of development, invoked at the national level, not mobilized in Banaras? Why did
    the mythical categories, instead, became prominent in Banaras? How, in Banaras,
    the real (the caste and religion) and the imagined (such as satisfying the ''want''
    of Mother Ganga) were fused together?


    Against this backdrop, the chapter asks a less-explored but key question having
    multiple possible articulations: why did Modi decide to contest the election from
    Banaras? Why did he choose a constituency outside his home state, Gujarat? Instead
    of his mediated'
