    force might be packaged as unlimited choice and compulsion as unbound was reflected
    in the response of the European elites to the Irish referendum. In June 2008,
    Ireland held a referendum on the Lisbon Treaty on the reform of the European Union.
    Over 53 per of the Irish voters rejected the Lisbon Treaty. This rejection went
    against the wishes of Europe''s elites. Instead of accepting that the Irish people
    sovereignly decided, Valery Giscard, a key author of the Lisbon Treaty, told a
    radio journalist:


    Giscard: The Irish must not be allowed to express themselves again.


    Radio Journalist: Do not you find it deeply shocking to make people who have already
    expressed themselves take the vote over?


    Giscard: We spent our time re-voting. If we did not, the President of the Republic
    would be elected for all eternity. (Cited in Ross 2011: 84)


    It is clear what exactly Giscard meant by his comment, namely, the Irish people
    must keep on voting until they get the desired result he and other like-minded
    politicians in Brussels and other European metropolis cities wanted to hear and
    promote.


