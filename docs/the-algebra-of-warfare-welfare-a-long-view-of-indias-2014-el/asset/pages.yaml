    nationalism in the subcontinent, and the Urdu-speaking Muslims with their elective
    affinity to those who share the language, who may live in India and even in Pakistan,
    all complicate the possibility of mobilizations based on Hindus versus rest. To
    put it succinctly, the intersectionality between religion and language is crucial
    in the Indian context and needs to be taken into account in a nuanced analysis
    of electoral and political behaviour. Importantly, the centre-periphery relations
    can influence electoral alliances and behaviour as exemplified by the coalitions
    between the BJP and regional parties in Jammu and Kashmir (the Muslim-majority
    state) and in some of the Christian-majority states in the North-East to secure
    financial favour from the centre. An analysis which ignores the stick and carrot
    approach of the Modi government is not only simplistic but misleading. This means
    that the democratic ethos is yet to evolve in India.


    The final component of your question about the logic of warfare and welfare is
    an important one. Historically, the relationship between the state and citizens
    has been resolved in three distinct ways—in terms of hegemony, uniformity, and
    pluralism. The hegemonic type recognizes only one primordial identity (religious,
    linguistic, racial) as legitimate; the ‘national’ identity is synonymous with
    the mainstream identity and the smaller, weaker groups are prodded to assimilate.
    The uniformity pattern assumes that older identities will gradually disappear,
    thanks to modernization/globalization. The pluralist pattern acknowledges the
    existence of several nationalities within the polity and recognizes the distinction
    between citizenship and nationality, as in the erstwhile Union of Soviet Republics
    (USSR)


    The Indian situation does not fit into any of these; single citizenship coexists
    with multiculturalism. The welfare orientation, wherein the state was a protector
    of needs and aspiration of citizens, under planned economy. But the Indian state
    turned into a predator when internal emergency was declared in the mid-1970s,
    when the state waged war against those who challenged its authority. But it had
    to revert to its welfare orientation, thanks to elections. However, after the
    2014 elections—when the BJP secured a clear majority—the state initiated predatory
    measures against religious minorities, particularly against Muslims and Christians.
    Thus, the Indian state is at once a protector in terms of welfare measures and
    a predator indulging in warfare against a segment of its citizens because of their
    religious and even linguistic identities.'
