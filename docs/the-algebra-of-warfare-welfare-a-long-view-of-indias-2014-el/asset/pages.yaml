    The chapter is divided into six sections (including this introductory section).
    The following section, about the contemporary official meanings of communal violence
    in India, examines a few official sources such as annual reports and other related
    documents published by the Ministry of Home Affairs (MHA), election reports published
    by the Election Commission of India, the Uttar Pradesh (UP) assembly reports,
    and the Parliament of India publications. The third section discusses the events
    of 2013 in Muzaffarnagar. Using detailed ethnographic data-interviews and group
    discussions conducted in the Muzaffarnagar region in 2014–15, an attempt has been
    made to make sense of the local discourse of violence. The fourth section pays
    attention to the quantitative survey data (Lokni 2014) to look at the relationship
    between violence and political choices. The fifth section examines the Bharatiya
    Janata Party’s (BJP) electoral campaign of 2014. Finally, the concluding section
    recapitulates the main findings of the chapter. I argue that violence against
    Muslims plays an important role in influencing Muslim self-perceptions in various
    contexts; yet, Muslim electoral preferences are not always determined by ‘communal’
    considerations.


    # Contemporary Meanings of Communal Violence


    The question ‘What is communal violence?’ in my view is rather problematic in
    two ways. First of all, it is technically difficult, if not impossible, to evolve
    any well-ordered generalization on the basis of a larger number of violent incidents.
    Although one may identify a pattern or what Brass (2004) calls ‘riot system’,
    there is a strong possibility that actual events deviate significantly from any
    given model, especially if one studies the local context and the everyday culture
    of social groups. Second, the mode of violence—the manner in which the act of
    collective violence is performed—makes our task much more complicated. The standard
    definition of communal violence is a form of violence that is perpetrated across
    ethnic or communal lines


