    collective behaviour. In Collective behaviour, people are mobilized into action.
    At one point of time, voter turnout in India used to be very low; it is steadily
    increasing. Of, even in the highly ''advanced'' liberal democracies, the voter
    turnout was/is not very high—maybe between 40–60 per cent—for a variety of reasons.


    Indian elections are like social festivals, which means that each of the parties
    or coalitions would try to mobilize people against their opposing parties and
    vice versa, not necessarily based on ideology alone. So, during election time,
    if you observe the communication pattern, there is lot of demonization of the
    opposing party and sacralization of one''s own; political rivals/leaders become
    demons and their own leaders become charismatic heroes. These issues have not
    been studied systematically even by sociologists (It seems the world is catching
    up with India. With the recent election campaign in the United States [US]).


    RT: You could elaborate the reasons that had perhaps prevented sociologists and
    social anthropologists from studying elections more systematically?


    TKO: Sociology and social anthropology have not made much advance regarding elections
    because of the nature of their research terrain. In elections, individual as an
    individual is making choices. And the election result is the conjoint result of
    their independent actions. Sociologists refer to this as the synergetic model.
    When an individual acts as an individual, s/he does not necessarily consult others
    and vice versa. So, hundreds of thousands of individuals are making their decisions
    as individual voters. One may not actually know who has voted for whom, but in
    the end, one would get a pattern. The synergetic model of analysis is not very
    popular in India.


    The other related matter is that when we talk about election and democracy, the
    unit involved at the macro level is the so-called nation state. In Western democracies,
    there is a co-terminality between political and cultural boundaries. Thus, there
    is one recognized religion even though minority religions may exist there, they
    are usually insignificant in the context of elections and parties are not bothered
    about them. Second is the issue of language: almost all nationstates have one
    official/national language. Think of India, we have Telugu as well as Punjabi
    electoral politics. Similarly, in the case of the United'
  merge: -1
  pgno: 360
- img_proc: true
  md: '# 340 R. Thirunavukkaras


    Kingdom (UK), one can have English politics as well as Scottish politics. A predominantly
    Christian country needs to confront denominational national groups within the
    Christian community. In India, which is multi-religious and multilingual, the
    complexity of electoral politics increases exponentially.


    RT: Compared to many former colonial countries, democracy in India remains strong
    and vibrant. That is, elections are quite regular and India has never allowed
    military rule or one-party dictatorship. Without a grand consensus, democratic
    polity would not have survived long in India. However, this incredible feature
    of modern India as a democracy remains untouched to a large extent by sociologists/social
    anthropologists. Democracy is effectively understood as elections and hence, it
    has become an essential trope of political scientists. Could you explain why sociologists
    perhaps unwittingly fail to study democracy?


    TKO: We must recognize the conceptual distinction between military rule—where
    there is no scope for democracy, one-party rule which proscribes multiparty democracy,
    and democratic which permits functioning of several political parties to which
    India belongs. Acceptance of a principle does not automatically lead to its translation
    into practice. One-party dominance prevailed in India for about four decades,
    largely because the Indian National Congress (INC) emerged from the womb of the
    anti-colonial movement, which is usually referred to as national movement. Since
    the INC promised to put into practice the vision of the national movement, people
    of India gave them four decades to perform. coalition era started only in 1989
    and it continued for a quarter of a century. But the coalitions, too, did not
    perform up to the expected level. This resulted in the reversion to one-party
    dominance in 2014. Thus viewed, electoral democracy in India is a robust phenomenon
    and a rational response of the electorate. But electoral democracy should not
    be mistaken for liberal democracy in which values such as equality and dignity
    of fellow citizens are internalized by all. This has not yet happened in India.


    We also need to keep in mind the disjunction between democratic polity and hierarchical
    society in India. The former is anchored in equality and the latter in inequality.
    The unstated assumption that the introduction and the gradual internalization
    of democratic values will transform the hierarchical values embedded in India’s
    social institutions'
  merge: -1
  pgno: 361
- img_proc: true
  md: '# On Studying Elections and Democracy 341


    into egalitarian values has not come true. And, this is because of the bi-dimensional
    nature of the Indian status system which functions simultaneously in two contexts:
    the ritualistic and the secular. Change in the secular realm need not affect the
    ritual context; transformations in polity not necessarily transform society.


    As is well known, sociologists and social anthropologists focussed on traditional
    social institutions such as the joint family, the caste system, and Hinduism.
    Their concern was whether the joint family was changing into nuclear family, not
    if patriarchy was withering away or whether violence against women was diminishing.
    They emphasized the harmony in inter-case relations thanks to the elaborate division
    of labour and the Hindu Gajmani system was paid to the exploitation and structural
    violence embedded in the caste system. They were keen to highlight the tolerance
    and accommodating nature of Hinduism, as compared with Islam and Christianity.
    In other words, the focus was to highlight the unique features of Indian society
    and study of democracy—an ‘alien importation’—was not a priority on their agenda.
    That is, the analysis of elections could not have attracted sociologists and social
    anthropologists of India and hence its neglect.


    Let me add a word of caution here the inadequate, weak tradition in studying democracy
    in social science in general and in sociology in particular. Democracy as a value
    and as a political arrangement emerged largely in the twentieth century. In 1900,
    there were only 25 ‘democratic’ countries accounting for 12 per cent of world’s
    population. But what existed then was restricted democracy, in that only property-owning
    men had the right to vote. By 1950, there were 22 electoral democracies which
    permitted universal adult franchise, accounting for 31 per cent of the world’s
    population and 21 countries with restricted democracy accounting for 12 per cent
    of the world’s population. By 2000, of the 192 existing countries, 120—accounting
    for 58 per cent of the world’s population—had electoral democracies. Of these,
    democracies which respected basic human rights and rule of law were 85, accounting
    for 38 per cent of the world population. This is to underline the fact that a
    non-existing phenomenon could not have been studied. Election studies came into
    vogue as countries became electoral democracies, but the study of democracy as
    a socio-political phenomenon could have become popular only with the spread of
    liberal democracies. And, as recent as 2000,'
  merge: -1
  pgno: 362
