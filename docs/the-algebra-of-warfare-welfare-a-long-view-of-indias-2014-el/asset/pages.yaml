    a conflicting world, not a world of competing interests or values but a world
    of competing worlds’Rancière 2011: 7; emphasis mine). When seen from this perspective,
    the differences, if any, amongst the manifestos of the AAP, the BJP, and the Congress
    appear in the realm of policy, not politics. That parties have different names
    and say things differently, as opposed to saying different things, does not mean
    that they are also different in their politics, as outlined above. Friedrich Engels’
    (d. 1895) observation that ‘the names of political parties are never entirely
    right’ is not without some merit (Schmitt 1986: 29).


    A word about manifesto is in order here. A manifesto, a public declaration, spoken
    or written (Oxford English Dictionary 2014). Popularly, it means a written document.
    A manifesto is thus a document of intention and plan, also giving clues to what
    a party thinks of overall politics. Its ultimate aim, however, is to persuade
    or manipulate voters in favour of a specific party. After getting elected to power,
    no party has ever delivered 100 per cent what it promised in a manifesto. At times,
    a party elected to power may also go against what it promised. Importantly, everything
    is manifest in a manifesto, for many things remain latent. The latent manifest
    not in a manifesto but in practices of electoral mobilizations, and subsequently,
    the unsaid is as salient as the style, time, and the audience—both visible and
    invisible—for which things are said.


    Before I present my analysis, let me spell out the disciplinary and methodological
    assumptions that bear on this chapter. Issues of elections and manifestos have
    been the subjects of study by political scientists. Anthropologists’ interest
    in them is relatively recent and still thin. This chapter on manifests might well
    be one of the first, if not the first, writings by an anthropologist who is also
    trained in sociology and has taught and researched anthropology, politics, international
    relations, and religion for the past decade or so. Put differently, I tend to
    distrust the notion of a singular disciplinary fidelity; I instead favour what
    Emmanuel Wallerstein (2003: 457) calls ‘historical social sciences’, albeit with
    a ‘soft approach’ (Burawayoy 2013: 14).


