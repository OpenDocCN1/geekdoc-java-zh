  md: 'The key goal of this ''Introduction'' is to propose a preliminary frame-work
    to understand the truth behind, as opposed to the mere reality of (Fassin 2014),
    democratic politics, the celebrated manifestation of which is periodic election.
    By its very nature, this task is far from easy, requiring a critical appraisal
    of political science, political theory, and philosophy in multiple intellectual,
    linguistic, and cultural traditions, contemporaneously as well as historically.
    In 2014, political scientist James Alexander published ''Notes towards a Definition
    of Politics''. In a laudably ambitious endeavour, he examined the definitions
    of politics in the thoughts of Hannahrend, Michael Oakeshott, R.G. Collingwood,
    Carl Schmitt, and Jacques. Firmly in the Western tradition and its appropriation
    of the classical Greek thought, Alexander, however, did not discuss, for instance,
    Hindu political thoughts such as Kautilya’s (Altekar 1958; Bhandarkar 1929; Boesque
    2003; Mitra and Liebig 2017; Weiner 1984). Nor did he dwell on Muslim political
    thoughts, including emerging out of an engagement with the Greek traditions (Ahmad
    2017a; Black 2011; Mahdi 2001).


    What Alexander dove to revisit and write a definition of politics was the disjunction
    he identified between the pre-twentieth century understanding of politics, where
    it referred primarily to the business of the state, and the subsequent notion
    of politics that encompassed within its definitive abstract ''everything''. Though
    Alexander did not say explicitly, the latter definition of politics comes close
    to politics as an everyday practice beyond the affairs of the state, or to the
    maxim ''the personal is political'' of the second-wave feminist movement (McKininnon
    2015: 267). Alexander (2014: 300) concluded his article by offering a ''complete
    definition'' of politics—a definition, which, however, is unsatisfactory on many
    counts. To begin with, it effaces the non-Western thoughts on politics. Importantly,
    it does not clarify why one should have, rather than Nietzsche (2003; Geuss 1999),
    a definition rather than a genealogy of politics. Contra Alexander, my goal is
    less ambitious. Rather than viewing the understanding of politics as a function
    of the state in opposition to the understanding of politics as not limited to
    the state, I ask: can both be seen conjunctionally? If so, can welfare and warfare
    be the terms to construe politics as a function of the state as well as politics
    as an activity beyond the immediate realm of the state?'
