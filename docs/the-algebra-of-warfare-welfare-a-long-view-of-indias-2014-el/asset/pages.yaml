    # The Context: Corporate–Modi Connection


    Narendra Modi''s Gujarat model of development was an ideal to corporates aspire.
    In Gujarat, disregarding people''s rights, the Modi government handed out large
    tracts of land to the corporates literally for free or at a ridiculously low prices
    as an ''incentive'' to industry. However, the UPA''s LARR Act provided for a ''consent''
    clause which instructed that ''land'' can only be acquired with the approval of
    70% of the land owners for Public Private Partnership projects and 80% for private
    entities (Hindu 2015). Hence, corporate anger against the UPA intensified and
    simultaneously, a pro-Modi sentiment gathered momentum. Modi, as the supreme leader
    of party and the chief


