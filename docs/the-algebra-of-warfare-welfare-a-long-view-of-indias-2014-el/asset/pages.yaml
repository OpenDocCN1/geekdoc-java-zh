    It does not, however, mean that the great narrative of communal violence in contemporary
    India is irrelevant. Communal violence is more than a conflict between two or
    more religious communities. In fact, in recent years, communal violence has come
    to be understood primarily as violence against religious minorities, especially
    Muslims. Hence, it is important to reformulate the question—what is communal—we
    might ask another basic question: what are the ‘official’ meanings of communal
    violence in contemporary India$^{24}


    This reformation, as we observe, might help us in tracing the complex trajectory
    of communal violence: the stories/interpretations of the occurrence of an event;
    the legal articulation by law-enforcing agencies at the local level (such as police
    and local administration); the compilation of various events of communal violence
    by official agencies (such as MHA); and finally, the legislative debates around
    this database.


    Let us begin with the Prevention of Targeted Violence Bill, 2011 (PRS Legislative
    Research 2011). This bill, as is well known, was drafted by the National Advisory
    Council in the context of the Gujarat riots of 2002. Although the bill was finally-drawn
    by the government on 5 February 2015$^{5}$, the legislative discus-on the bill
    offers a comprehensive interpretation of the term ‘communal violence’ in recent
    years.


