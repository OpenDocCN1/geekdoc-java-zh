    of a quickly changing India, but voters were now more willing than their parents
    to do as they chose, and not to fall into patterns.


    ***


    This chapter argues that the outcome of the 2014 Indian general elections was
    a consequence of the targeting of ‘winnable’ seats by the BJP, the professional
    nature of the BJP’s national campaign compared to that of the Congress, high turnout
    among voters, a careful projection of Narendra Modi as a future prime minister,
    and a failure of attempts to caste-based identity in parts of north India at a
    time when voters were making decisions on the grounds of economic self-interest
    and aspiration. The consolidation of Hindu votes around a message of Hindutva
    appeared to be a less significant determinant than in previous and subsequent
    election campaigns factors conditioned the outcome on polling day, and many of
    these were complex in their effect.'
