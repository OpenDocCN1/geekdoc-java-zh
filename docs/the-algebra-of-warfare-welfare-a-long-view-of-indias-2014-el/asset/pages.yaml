    political ambitions and agenda as well. While analysing the convergence between
    the two agendas, it aims to understand why, setting aside his own political ambitions,
    Ramdev decided to have a partnership with Modi and the Bharatiya Janata Party
    (BJP) in the 2014 elections. Was it conviction or convenience? Ideological or
    quid pro quo? How did Ramdev craftily communicate a Hindu nationalist message
    to his disciples through his yoga discourse, appealing directly for support for
    Modi?


    # Gurus and Hindu Nationalism


    Hindu nationalism''s alliance with gurus such as Ramdev was not a new development.
    The Rashtriya Swayamsevak Sangh (RSS), the fountainhead of Hindu nationalism,
    had developed a close connection with Hindu gurus since the early days of its
    foundation in 1925, both in terms of philosophy and mission. K.B. Hedgewar founded
    the RSS to unite Hindus and proclaimed India as a Hindu rashtra (Hindu nation),
    and his organization claiming to be the true inheritor of the philosophical and
    ideological legacies of some Hindu sanyasis such as Vivekananda, Aurobindo, and
    Dayananda, a natural alliance emerged between the Sangh and the gurus. Thus, when
    the RSS was struggling to get a foothold in a new place, many Hindu gurus, organizations,
    and other notables came forward to provide initial logistics to the RSS pracharalaks
    (full-time organizers) to facilitate their mission. Hedgewar cautiously treated
    the tension between the Arya Samaj and Sanatanis, managing support from both sects.


    M.S. Golwarkar, popularly called Guruji, cultivated the Sangh–guru relationship
    further, which culminated in the foundation of the Vishva Hindu Parishad (VHP)
    in 1964 in partnership with Swami Chinmayanda. In the political sphere, despite
    differences, the Bharatiya Jana Sangh (BJS), the Hindu Mahasabha, and the Ram
    Rajya Parish of Swami Karpatri Ji Maharaj collaborated. The 1966 Go-raksha Andolan
    (Cow Protection Movement) brought many gurus and sadhus close to the Sangh Parivar,
    and the VHP provided a Hindu ecumenical platform to accommodate diverse Hindu
    sects, sadhus, and gurus to articulate their grievances and demands. In the mid-1980s,
    a large number of sadhus and sanyasis got actively involved in the Ram Janmabhoomi
    Movement, and subsequently, became'
