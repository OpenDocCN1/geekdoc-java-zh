    # Designer Democracy


    Such relationships between media and democracy, as discussed earlier, are not
    limited to elections. Politics like India, the United States, and the UK work
    on the principles of political marketing and permanent campaigning. In 1997, Tony
    Blair told the newly elected MPs: ‘Today is the day one of the campaign to win
    a second term’ (in Lilleker 2006:146). In India, elections are held almost every
    six months. Permanent campaigning following the logic of advertising industry
    in civic participation and meaningful debate are transformed into a brand through
    constant media ratings of politicians. Media and politics morph into politics
    as media (Ahmad 2014a).


    # Political Economy of News Media


    Politics as media is facilitated by structural conditions. The early 1990s saw
    the beginning of liberalization in India, which meant end of the ‘licence raj’,
    thereby throwing sectors previously under control open to the private sector.
    With privatization and expansion of television, enabled by foreign investment,
    the scene changed radically as news and television became a ‘free’ market. An
    important factor in the initial phase of privatization was Rupert Murdoch, chair
    of News Corporation. Among other things, he introduced the first 24/7 news network
    (Star News). In 2012, India was one of the top 15 media and entertainment markets
    in the world with $17 billion annual revenue (Mehta 2015: 50). From 1959 (when
    television was introduced) to 1991, state-controlled Doordarshan was the only
    news channel. In 2014, half of the 800 channels were news (Mehta 2015: 55). In
    this, Nalin Mehta, a television journalist-turned-academic, noted that news channels
    are largely propaganda wings of political parties; those investing in them are
    politicians, real estate, chit fund, money market companies and big corporations.
    It is an established practice'
