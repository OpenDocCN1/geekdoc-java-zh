  md: 'less than 40 per of the world population was exposed to liberal democratic
    practices. To be sure, in the decades to come, democracy would gain its deserved
    attention as a theme of sociological study.


    RT: If/when attempts are made to study democracy, what are the methods to be adopted
    to characterize the study as quintessentially sociological?


    TKO: Sociology has two connotations. The narrower view is that it is a residual
    discipline which studies those aspects left out by other disciplines: economy,
    polity, and culture. If viewed broadly, sociology is the general science of society,
    everything human is encapsulated in its scope. Democracy is increasingly recognized
    as an important aspect of human life in the contemporary world. As for the methods
    of studying democracy sociologically, it would be eclectic because both quantitative
    and qualitative data ought to be collected by a truly sociological analysis.


    A sociological analysis of election entails studying the individuals who cast
    votes—as well as the factors and forces which prompt him/her to vote—because voter
    apathy is a widely recognized phenomenon, even in liberal democracies. Therefore,
    a general understanding of the proportion of eligible voters who cast votes and
    the sociocultural background of the candidates as well as the sociocultural characteristics
    of the constituencies need to be understood. For this, social surveys need to
    be undertaken. But the content of vertical communication flow from leaders, as
    as horizontal communication flow among the voters and their subgroups—women, men,
    age groups, party members, religious and caste groups, the well-off, and the like—ought
    to be captured through informal interactions. Informant interviews, group discussions,
    observations of election meetings, both big and small, ought to be pressed into
    service to collect qualitative data. To put pithily, both quantitative and qualitative
    data need to be collected for sociological analyses of election, as noted above.


    However, analyses of elections do not exhaust the study of democracy, although
    it is a crucial aspect. To study democracy, one has to understand not only the
    pre-election processes involved, such as selection/identification of candidates,
    and the factors which influence this, but also how elected candidates participate
    in the decision-making processes. More importantly, the factors involved in getting
    the decisions implemented'
  merge: -1
  pgno: 363
- img_proc: true
