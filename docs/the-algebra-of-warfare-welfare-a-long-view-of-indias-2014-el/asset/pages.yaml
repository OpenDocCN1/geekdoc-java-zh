    involving the common man were subsumed under a calibrated corporate–media campaign
    harping on a strong leader and development, both of which raised hopes among millions.
    Expressions of diversity in terms of political discourses were methodically sidelined.
    The economically powerful corporates chose a leader in the form of Modi and the
    media backed him to it. While political leadership assured the corporates stability,
    security, and good business, the media committed itself to mediate between corporates
    and the political leadership. This model was national as well as regional, as
    evident from the case of Odisha.


