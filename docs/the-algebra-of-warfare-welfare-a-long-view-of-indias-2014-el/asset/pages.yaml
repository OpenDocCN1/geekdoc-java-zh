    # ON THE GROUND

    The Unfolding of the 2014 General Election Campaign


    Patrick French


    A win in a general election in a country as large as India can be a technical
    victory, depending not only on vote swings but also on complex alliances between
    one-time opponents and the ''transfer-ability'' of vote banks between castes,
    religions, and parties. The National Democratic Alliance (NDA)/Bhartiya Janata
    Party’s (BJP) success of 2014 was powerful enough not to be technical and came
    about from a concatenation of reasons: effective targeting by the BJP of ''winnable''
    seats; high turnout; the professionalism and ''presidential'' nature of the BJP’s
    national campaign against the undirected approach of the Indian National Congress
    (hereafter Congress); and a limitation in the success of appeals to caste identity
    over a willingness of voters to make decisions primarily on the grounds of economic
    self-interest and aspiration. The ''Introduction'' in this volume proposes that:


    An important way to electoral democracy is to understand it as a phenomenon of
    warfare and welfare, where both become intimately intertwined in such a way that
    they can work—indeed they often do so—as near synonyms. In many forms—now direct,
    now indirect—this algebra of warfare and welfare, if this phrase is used, is integral
    to electoral democracy, in India as well elsewhere.


    Patrick French, On the Ground: The Unfolding of the 2014 General Election Campaign.
