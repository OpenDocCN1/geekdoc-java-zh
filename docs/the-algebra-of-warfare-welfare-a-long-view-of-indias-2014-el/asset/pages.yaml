  md: '# PREFACE


    Writing about the 2014 Indian elections, anthropologist Mukulika Banerjee described
    them as ''rambunctious, great equalizer in public life''. Calling it ''the largest
    human event anywhere in the planet'', elections bring, transform the landscape
    into a ''festive one'', and generate ''exaggerated civility'' in ''the world''s
    biggest festival''. Election time, she continued, is ''efficient and exciting''
    and the act of voting is ''beautiful''. Nowhere did she mention, even mistakenly,
    that elections also constitute and generate terror as manifest in the chilling
    murder of over 40 Muslims in Assam in the first week of May 2014. The Bodo separatist
    militants killed Muslims ''as punishment for failing to vote for their [Bodo]
    candidate'' [BBC 2014; Guardian 2014]. It was not simply that lives of Muslims
    were eliminated; they were also eliminated from the subsequent electoral campaigns
    and discussions by the advocates of democracy in the world''s largest democracy.
    For families of the killed and for the people for whom the massacre was a stern
    message of warning, elections were an unspeakable tragedy, not a carnival; elections
    were a great equalizer of life in public, not an equalizer in public life; elections
    reflected and produced enmity, not exaggerated civility; the act of voting was
    awful, not beautiful.


    While campaigning for his wife, Shashi Srivastava, in a local election in Barabanki,
    Uttar Pradesh (UP), Ranjeet Bahadur Srivastava issued a threat:


    > ''You (Muslims) do not have anyone to be on your side in Bharatiya Janata Party.
    If you do not vote for BJP candidates, if you do not vote for my wife, not even'
