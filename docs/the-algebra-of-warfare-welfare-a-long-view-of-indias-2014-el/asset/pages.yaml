    # The Argument: Politics qua Policy


    My argument is informed by the writings of the contemporary French philosopher
    Jacques Rancière, who institutes a distinction between politics and policy. To
    Rancière (1992: 58), policy is built on consent and consensus concerned with distribution
    of shares which satisfy the existing hierarchy. Unlike the abstraction of John
    Rawls’ proceduralism (Chambers 2011:303–4) and the deliberation of Jürgen Habermas
    (Gutmann and Thompson 2004)—where deliberation is often deliberative at the service
    of the quo—policy, for Rancière, is about disagreement and dissensus. The essence
    of politics,’ writes Rancière (2001; also see Rancière 1999);is the manifestation
    of dissensus’ which imagines a ‘possible world’ other than the one which actors
    actually inhabit, whereas consensus is about prolonging the prevalent order of
    things so to terminate—if necessary, by the violent acts of the ‘law’—the very
    yearnings and flashes of a possible world. It is for this reason that Rancière
    detects an affinity between the thinking and deeds of policing and of policymaking,
    to the extent that police and policy can be viewed as complimentary, even substitutes
    (Chambers 2011: 306). In short: Rancière theorizes ‘politics not as a specific
    world but as'
