  md: '# Modi and the Spectre of Terrorism 109


    Modi had begun this discussion by asking the crowds in this trademark style: ''Brothers
    and sisters, these infiltrators who have come from Bangladesh, we should not expel
    them? Should we not expel them? Should we not expel them? Come on: tell me with
    all your force.'' The crowd seemed, ''yes'' (YouTube 2014c). Modi was projecting
    himself as a universal Hindu Hriday Samrat, leader of Hindus everywhere—where
    Bangladesh to Fiji to the US. This transnational community then pitted against
    the ''infiltrators''.


    The BJP candidate in Silchar lost, but due to the fact that Modi’s election rallies
    were telecast, with his speeches almost unedited, the impact of these rallies
    and speeches was much beyond localized space.


    It was precisely this quality of Modi—his alleged tolerance for terrorism—that
    was claimed to have him in the hairs of the terrorists. Everywhere Modi turned,
    it seemed, there were gangs of jihadis awaiting him. Given the Gujarat experience,
    it was not a surprise that the BJP was keen to make threat to Modi a poll issue.
    On 20 March, the BJP, citing media reports of Intelligence Bureau (IB) alerting
    regarding threat to senior leaders (a euphemism for Modi), held a press conference.
    Its spokesperson, Ms Nirmala Sitharaman, asked if ''the Home Ministry has taken
    cognizance of these reports and if they are taking any measures to ensure safety
    of our leaders'' (BJP 2014a).


    The following day, a delegation of BJP leaders met with the home minister to submit
    a memorandum, which read:


    It has come to our notice that several sections of the media have reported, based
    on IB sources, there is a threat to our leaders and this threat could even lead
    to kidnapping. It was suggested in these media reports that the motive behind
    such a heinous act could be to obtain the release of the terrorist Yasin Bhatkal
    (BJP 2014b)


    The BJP may have thought that it could dust and polish its old strategy that had
    reaped political dividends in Gujarat. On 22 March, an English daily reporting
    the alleged increased threat to Modi cited an unnamed source saying: ''IM want
    to expand terrorist activities in north and some communally sensitive parts of
    India. But if Narendra Modi becomes prime minister, its activities will not run
    for long. So, they don''t want Modi as prime minister'' (DNA 2014).


    This brings us to the role that media played, especially with regard to the hype
    around terrorism. Did it broadcast and amplify'
