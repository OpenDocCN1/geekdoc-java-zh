  md: '# INTRODUCTION


    # Democracy and the Algebra of Warfare-Welfare


    Irfan Ahmad


    Nothing is more available to the individual for deconstruction ''democracy'' since,
    not only

    in its implementation but also in its very idea, democracy seems nothing

    but a set of aporias. However democracy is imagined in every case it depends

    a set of impossible concepts: people, border, law, life, liberty, decision, foun-

    dation, sovereignty. It is not difficult to manifest the aporetic if not

    simply contradictory basis of each of these democratic pillars.


    > —Daniel Ross (2006: 75; emphasis in original)


