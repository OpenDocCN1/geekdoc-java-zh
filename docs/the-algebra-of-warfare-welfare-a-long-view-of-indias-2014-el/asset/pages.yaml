  md: '# 110 Manisha Sethi


    the fear and anxiety around terrorism? Anyone familiar with national security
    reporting and commentary in the Indian media will be aware the tone of sensationalism
    and hyper-patriotism, besides its credulous acceptance of the government and investigating
    agencies'' claims.


    News stories about ''IB alerts'' attributed to unnamed sources circulating throughout
    the campaign. In January 2014, a journalist known for his closeness to the national
    security establishment announced that Modi was at most risk among all politicians,
    facing multiple threats from ''pan-Islamic and Sikh fundamentalist terrorist groups'',
    after a red alert was apparently issued to the UP Police on 21 January, two days
    before Modi''s Gorakhpur (Gupta 2014).


    In March, the arrest of four alleged operatives of IM unleashed a barrage of report
    whose burden was to prove the high risk Modi encountered Islamic terrorists. A
    large section of the media convinced that it was Modi who the target of these
    alleged terrorists. Indeed, there seemed to be an almost pathological desire to
    link these arrests to Modi.


    One newspaper wrote confidently that the terror module ''had plans to carry out
    terror attacks during the election rally of BJP prime candidate Narendra Modi''
    (Indian Express 2014a). Another newspaper quoted ''sources'' to likewise declare
    that ''the terrorists had the BJP''s nominee Narendra Modi on their radar'' (Times
    of India 2014). It got a little carried away and told us that the Delhi Police
    would submit its report to the Ministry of Home Affairs, requesting to beef up
    the security apparatus of Narendra Modi during campaigning.


    However, in the press conference held by the special commissioner of police and
    in the police press release, the Delhi Police indicated that the investigation
    was at a preliminary stage and still ''in progress''. The commissioner made no
    reference to threats to Modi, nor did he recommend the augmentation of Modi''s
    existing security details (NDTV 2014). The Delhi Police, in its press conference,
    did not link to any particular politician. On being asked if terrorists were planning
    an attack on the election rallies or specific candidates, the police replied that
    they were not ruling anything out. Regardless of the fact that Modi was not as
    much as mentioned, the Modi angle was attributed to the Delhi Police in a daily''s
    headline: ''Indian Mujahideen terrorists could'
