    Contemporary Hindu gurdom is plural and diverse; all sorts of gurus—traditional,
    modern, and postmodern, and disseminating all of Hinduism, from esoteric, spiritual,
    and physical, to philosophical, pragmatic, and patriotic—are pervasive in the
    Hindu sphere, in India as well as overseas (Forsthoefe and Humes 2005; Spurr 2016;
    Zavos et al. 2012). New Age spiritual movements are not confined to the West alone;
    they are very vibrant in India too. Since the onset of neoliberal consumer economy,
    India witnessed a dramatic rise of the middle class, market, and media (see Chapters
    1 and 9). Material prosperity brought in many anxieties as well. As the upper
    and middle classes became conscious of their spiritual and physical health, all
    of a sudden many New Age gurus—anticipating the emergence of a boomarket—surfaced
    with the market-friendly packages to attract disciples and followers.


    As the guru market became, these New Age entrepreneurs were smart enough to realize
    that in order to succeed in a highly competitive market, they should not merely
    be authoritative and charismatic but also innovative and unique. After all, each
    brand or trademark had to be distinct from the rest and have something special
    to offer. One such charismatic guru, who became a household name very fast through
    television, is Baba Ramdev, a ‘modern yoga revolutionary’ (Sarbacker 2013), who
    successfully marketed a potent recipe of yoga and Auyurveda.³ The surging popularity
    of Ramdev nurtured his political ambitions, and also propelled political parties
    and leaders to seek his support to win elections which had the potential to swing
    the opinion of his large base of followers.


