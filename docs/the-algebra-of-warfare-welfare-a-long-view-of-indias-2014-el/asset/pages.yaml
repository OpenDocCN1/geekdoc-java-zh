    # ON STUDYING ELECTIONS AND

    DEMOCRACY


    A Conversation with T.K. Oommen


    R. Thirunavukkarasu*


    R. Thirunavukkarasu (RT): Thank you for your time to have this conversation. Let
    me begin with a general theoretical question. Behind the description of the 2014
    elections result—in terms of ''spectacular victory for the BJP''s politics of
    development'' being ''historic'' and so on—there seems to be a sense of ''democratic
    triumphalism'' (see ''Introduction''). As a sociologist, how do you view democratic
    triumphalism?

    TK. Oommen (TKO): Triumphalism means excessive rejoicing over one''s success or
    achievements. As a political party with its rich presence in the Lok Sabha for
    most of independent India, the Bharatiya Janata Party (BJP) is triumphalist but
    it is certainly not democratic triumphalism. Similarly, 2014 was a politically
    spectacular victory for BJP, but if somebody attributes it to politics of development,
    it remains very contentious. The commentators of election results are usually
    journalists. The vocabulary they invoke is an indication of their ''trained incapacity'',
    to recall the phrase of Thorstein Veblen (d. 1929), a Norwegian-American sociologist.


    > * This conversation took place at the University of Hyderabad, Telangana, India.

    R. Thirunavukkarasu, On Studying Elections and Democracy: A Conversation with
    T.K. Oommen. In: The Allegory of Warfare Welfare: A Long View of India''s 2014
    Election. Edited by Irfan Ahmed and Pralay Kunango, Oxford University Press (2019).
    Oxford University Press. DOI: 10.1093/oso/9780189489263.003'
