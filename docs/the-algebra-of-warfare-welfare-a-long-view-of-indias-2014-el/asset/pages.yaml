    # GURUS AND THE HINDU NATIONALIST

    POLITICS


    The Baba Ramdev–BJP Partnership in the 2014 Elections


    Pralay Kanungo


    The Sanskrit word guru (gu and ru) commonly refers to a teacher who enlightens
    the disciples by dispelling darkness of ignorance. In Vedic times, the ruling
    elites sent their children to ascetic gurus to receive education and training
    in multifarious spheres, not just warfare and governance, but encompassing a wide
    range of activities—from religious and philosophical to scientific and spiritual.
    As gurus came to be perceived as mediators between gods and humans, they enjoyed
    an exalted position being compared with Param Brahma (Ultimate Reality), thus
    acquiring a status of worship for themselves. Gurodom passed through many stages
    of evolution and transformation. Yet, as gurus’ guidance remained an indispensable
    obligation to access knowledge, especially the spiritual one, some elements of
    this perception survived into the present day. The rise of new religious movements
    across the world further legitimized the aura and authority of the guru (Copley
    2000). Gurodom, in fact, is ‘multifarious’ (Copeman and Ikegame 2012)¹


    > ¹ Here, the ‘guru’ is also applied to Hindu sansiyas, sadhus, and babas, who
    import various kinds of knowledge to their disciples: from religious and spiritual
    to physiological and political.


