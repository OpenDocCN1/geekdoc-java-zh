  md: '# Fear and Democracy


    I must preface the discussion with the disclaimer that the term ‘terism’ is not
    being deployed here as it appears in the mainstream media and political discourse.
    It is instead used fundamentally as a discursive strategy and political language
    with its elaborate system of ‘assumptions, symbolic systems, rhetorical modes
    and tropes, meta-narratives and meanings’ (Jackson 2005a: 147).


    Political speeches and rhetoric around terrorism—addressed to voters during elections
    or more generally to citizens at other times—may be directed to produce feelings
    of anger and righteous deignation (De Castella, Mcgarty, and Musgrove 2009: 21),
    or alternatively a ‘climate of fear’ and anxiety (Jackson 2005b: 120), or even
    a combination of all of these. For the 2016 US elections unfolded, the danger
    posed by immigrants, those of Muslim origin, came to acquire central significance.
    The Republican nominee, Donald Trump, budgeoned his way through the primaries
    by consistently provoking predominantly White anxieties, repeatedly warning about
    looming terror assaults, and attacking the Democrats for sympathizing with terrorists.
    The gun attack in San Bernardino (2 December 2015), Orlando (12 June 2016), and
    across Europe were great to his demographic mill. Trump’s speech which followed
    the shooting in the Orlando gay club combined of these themes:


    We need to respond to this attack on America as one united people, with force,
    purpose, and determination. The current politically correct response cripples
    our ability to talk to and think and act.... I do not know if you know this, but
    just a few weeks before San Bernardino, the slaughter, that’s all it was a slaughter,
    Hillary Clinton explained her refusal to say the words ‘radical Islam’. (Time
    2016)


    Typically, at the core of fear appeals are the relational themes of danger and
    threat; statements that construct images of an evil and dangerous other through
    appalling, terrible, and cruel’. These larger events are connected to more personal
    losses and concerns, such that each attack, or possible attack, becomes no longer
    distant but appears at once intimate. Simultaneously, they raise an alarm about
    the inability to cope with the threat—a threat that'
