    the BJP, and the Indian National Congress (here-after Congress), the party in
    power at the time of elections. The main contest was between the BJP and the Congress.
    The AAP was a new party, which had, for the first time, won to form a short-lived
    government in 2013 Delhi assembly elections. Its differentia specifica (mark of
    distinction) is its opposition to corruption. Since assuming power


