    whereas pluralism is the accommodative attitude. Word of caution is called for
    here: do not conflate ''plurality'' with ''pluralism''. Plurality refers to the
    co-existence of groups without interaction in social and cultural contexts, but
    pluralism implies harmonious co-existence of different sociocultural groups in
    the polity. When I refer to ''plurality'', I employ the conceptual framework provided
