  md: '# HOPE DIES


    The murder of their beloved king at the hands of the evil Empire has inspired
    open revolt on Mon Cala!


    Thanks to a timely counterattack by Admiral Akbar as well as the heroes of Luke
    Skywalker, Princess Leia and Han Solo, the Mon Calamari''s powerful fleet now
    stands ready to fight for peace and justice with the Rebel Alliance.


    Armed with new ships and new allies, the Rebellion is finally poised to take back
    the galaxy from the Empire in earnest. But the Rebels also owe their recent victory
    to Queen Trios of Shu-Torun and her defection to their cause. But Trios may have
    plans of her own....'
