  mdcn: '

    逃脱了，逃生舱。

    希望她被帝国军击落了，你这个叛徒。

    德拉文将军，告诉我，我们有什么可以利用的东西……


    我们仍在努力从舒-托伦（Shu-Torun）数据库中提取可以利用的信息。目前收获不多……但看来破坏者正控制着关键系统。我们很庆幸没有在护盾附近的任何地方使用舒-托伦的技术。


    不过，我们还有一个方案……


    有舒-托伦的干扰器阻止了我们对战斗机库舱门的直接控制。大门被密封了，无法手动打开。


    不过，只要飞船发射反抗军信号，近距离感应器仍然有效。


    所以我们向它们飞过去，舱门就会打开。


    我们需要把它们带送到巡洋舰上。战斗机可能是决定性的。它们能为我们争取时间。


    但马科雅（Mako-Ya）上没有战斗机。我们必须乘坐穿梭机出去。除非发生奇迹，否则无人通过。


    你说得对，莉娅。外面大家都在送命。我训练过半的飞行员。我来。


    > 路线设定完毕。出发。


    > 一艘穿梭机已从马科基地发射，维达勋爵。


    > 战斗机正在交战。


    > 它们追上我了。


    > 飞船太慢了。我——


    > 抱歉。我——


    ![](img/043783542c8691f931e952baca75148a_57_0.png)


    他……他是最优秀的驾驶之一。但他没能成功。


    我们必须再次尝试。


    没有其他选择。


    ![](img/043783542c8691f931e952baca75148a_59_0.png)


    唔！！！

    是的，切维，你永远不知道。卢克那边可能只是迟了，但我们还可以看——


    ![](img/043783542c8691f931e952baca75148a_59_1.png)


    ——这场戏。


    ![](img/043783542c8691f931e952baca75148a_59_2.png)


    咕噜。

    你说得对，切维。


    > 也许这只是某种战争游戏，勋爵？给贵宾们准备的象征性展示？


    > 这才不是战争游戏！金杆！这是帝国军见过最疯狂的场面！


    > 向马科塔基地发送信号，看看能不能叫到人……


    > 呃……你好？我是 C-3PO。礼仪机器人，在为莉娅公主及同伴效力期间损毁了。


    > 有人能听到我们的声音吗？


    ![](img/043783542c8691f931e952baca75148a_60_0.png)


    > 哈好？


    ![](img/043783542c8691f931e952baca75148a_60_1.png)


    > 噢，C-3PO，听到你的声音我太高兴了！汉在吗？我们需要——


    ![](img/043783542c8691f931e952baca75148a_60_2.png)


    > 耶，我在这里。但慢点，公主。告诉我发生了什么——


    > 汉！


    ![](img/043783542c8691f931e952baca75148a_60_3.png)


    完蛋了，我们。她在分散撤离前摧毁了所有反抗军巡洋舰。它们现在毫无防备，无法移动，且无法发射战斗机。我们正试找出该怎么办……


    对接门已封锁，但它们的感应器仍然有效。如果有一艘飞船向舱门飞去，它就会打开。


    很好，告诉他们，让那些战斗机飞这里来！


    他们的通讯也断了。我们做不到。我们需要有人去告诉他们。


    等一下——你真的是在让我自己去那里，对抗整个舰队，然后冲向一个可能打开也可能打不开的密封门吗？


    嘿！把那套说辞留给那些会信那套鬼的人吧。我去。


    唔。

    是的，我知道。


    这下最好能让她印象深刻。切维——去机炮塔顶端的旋转炮。好……你擅长护盾吗？勋爵，我精通六百万种形式的交流，但我并没有被植入护盾管理程序。生死攸关的时刻是巨大的动力，而且如果我们紧贴一艘处于平衡的歼星舰的话……


    ![](img/043783542c8691f931e952baca75148a_62_0.png)

