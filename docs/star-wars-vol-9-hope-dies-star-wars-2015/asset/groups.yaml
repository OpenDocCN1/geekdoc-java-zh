    维达勋爵很快就会来这里。


    房间将准备就绪……


    等等，你不是——


    我们进来了。出发吧。


    莉娅，看……


    另一艘巡洋舰坠毁了。这是我们不能在这里失败的另一个理由。


    不，莉娅笨蛋。


    离开这里。


    在他发现我们之前。


    你无法逃避黑暗面的力量。


    ## 阿克巴将的巡洋舰。


    GHGHGHHHHHH！


    我知道！我知道！


    我不像你那样喜欢这种局面。他们根本没生产兽人尺寸的战斗机。又不是为了腾出空间就能从Y翼战斗机上撕下一个座椅。


    见鬼，反正你也不想开那种东西。那就像是骑着曼兽进行狗斗。


    卢克，“隼号”报废了。我坐在一架X翼战斗机上，正出来。


    HHRGCHHHHH


    是的，丘维。别担心，我会回来的。我经历过比这更糟糕的困境。


    事实上，我收回的话。


    ## 准确的

    帝国旗帜：


    ![](img/043783542c8691f931e952baca75148a_113_0.png)


    快！


    维达随时可能发现我们。


    快了……公主。正在提取最后的几个文件并……


    ![](img/043783542c8691f931e952baca75148a_113_1.png)


    ……拿到了。所有的代码。一旦我们回到舰队，就能重启巡洋舰。


    离开这个巨兽最快的方法是什么？


    ![](img/043783542c8691f931e952baca75148a_113_2.png)


    小射线？运气好的话，我们可以带一艘穿梭机离开这里。


    后卫----报告？我们正被追击吗？


    ![](img/043783542c8691f931e952baca75148a_113_3.png)


    ![](img/043783542c8691f931e952baca75148a_114_0.png)


    报告？


    他来了。


    维达对安全部门：我的怀疑得到了证实。船上有反抗军。


    向我的区域集合。我将继续追击。


    我感受到了他们的恐慌。


    移动！对经过的任何门运行锁定代码。也炸掉控制面板。


    如果我们被困住，一切就结束了。


    如果我们封锁这扇门，就会切断杂兵与机库的联系。


    他们需要切割工具才能通过……


    ZZZP


    SSSHHR


    是的，“切割工具”。


    我们很快就会担心那个的。去机库……


    “希望他们有一架战斗机。”


    一艘船。

    太极了。

    库罗斯----看看你能不能破解对接安全系统，让这架帝国战机准备就绪。


    是的，先生。


    德文将军——你应该是那个把代码带回舰队的人。

    我会带领后卫——看看我能否慢得足够快，给你们离开争取时间……


    这也是我的责任，我想要的是派拉去对抗部队，而你会比我做得更好。现在，只要答应你会这么做。


    带着最大的敬意，莉娅公主，在这架该死的战斗机里！一直困扰我的是，我必须当英雄结果却错了。我希望我们有时间成为朋友。


    谢谢。


    就位。交战演习，如果这还有点价值的话。我真想要一个喷火器……看到他着火将是奇妙的景象。我们争取的每一秒都能拯救大局。我们不知道是否会产生影响。我们希望我们能。


    ![](img/043783542c8691f931e952baca75148a_118_0.png)


    我们……赢了。我们所做的……只是……慢下来。祝贺你们。


    你有全动力了，莉娅……去！去！不。


    好了。推力、控制、武器。系统？在哪在——不！嘿！卢克！一个幸运的飞行员从我身边溜了。他正朝你这边过来。我在追击他们，汉！


    他们很厉害。这该死的东西里把通讯放在哪儿？他们真的……但还不够。通讯是在飞行员头盔里，对吧？我一句话也说不出来。


    这种感觉……不对。扫描仪有发现关于这架帝国战机的任何东西吗？尝试发信息。没有回复？极了。得以某种方式表现我是友好的。代码？也许我脉冲一下引擎？噢，我有主意了。你知道的，卢克……抛开他们没有向我们射击的事，他们甚至不像学院训练的飞行员。


    ![](img/043783542c8691f931e952baca75148a_124_0.png)


    而且别那样。这到底是怎么了？无论如何，他们在我们这一边。我直知道。流亡中队！向我集合并保护这架帝国战机。无论它要去哪儿？我们把它们送到那里。


    ![](img/043783542c8691f931e952baca75148a_124_1.png)


    ![](img/043783542c8691f931e952baca75148a_124_2.png)


    噢，好痒！大师……


    噢，我无法相信我竟然如此无礼。


    我是三比，人类-半机器人关系专家。我该如何称呼您？


    我太感谢了，大师！我的二极管暴露过度。现在感觉很舒服吗？保持舒服是我所能做的。在可能的情况下发挥作用，有时那是我们所能做的。


    大师！但你不是应该做些别的事情吗？这听起来是个很感想法，而且——大师。


    外面发生了什么？战斗似乎正朝我们这边来。有人要降落。


    汉！我需要帮助。我想它正试图降落。但如果没有反抗军感应器，机库门就不会打开。我们需要保持门开启。在帝国战机后面排型，紧点！是的，是的。我知道这种演习。如果我们不保持门开启，那架帝国战机将直接撞在门上，我们所有的努力就白费了。真绅士。


    卢克！注意上方！我必须保持对准！阿图！调整偏转器！阿GGH！阿ROOO？立刻把这个传到终端！我明白了。


    卢克——你还好吗？大惊，我会没事的。而且——莉娅！


