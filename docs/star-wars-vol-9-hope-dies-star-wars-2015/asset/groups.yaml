    # 希望破灭\n\n邪恶帝国杀害了他们心爱的国王，这引发了蒙卡拉马的公开起义！\n\n得益于阿库巴将军的及时反击，以及卢克·天行者、莉娅公主和汉·索罗等英雄的努力，蒙卡马里强大的舰队现在已准备好与反叛军一起为和平与正义战斗。\n\
    \n拥有新舰船和新盟友，反叛军终于准备好认真从帝国手中夺回银河系。但反叛军最近的胜利也归功舒-托鲁恩的特奥斯女王以及她加入我们的事业。但特奥斯可能有她自己的计划....\n\
    \n![](img/043783542c8691f931e952baca75148a_8_0.png)\n\n# 蒙卡马里反叛军基地。\n\n> 莉娅，你父亲会为你骄傲的。\n\
    >谢谢，蒙。我应该去确保特奥斯女王住得舒适。\n> 为了让我们到达这里，她付出了很多努力……\n> 噢，莉娅，我直接的赞美可能让你很尴尬了。\n> 我猜今晚对你来说会是个疲惫的夜晚。\n\
    > 每个人都想见你……\n> 特奥斯！\n> 承认吧，你在这里让我有点意外。我还以为反叛军的大英雄会亲自指挥其中一艘船呢……\n> 我并不是指挥官。将军邀请我登上他的船，但我更愿意留在这里和你们在一起。\n\
