    # HOPE DIES


    The murder of their beloved king at the hands of the evil Empire has inspired
    open revolt on Mon Cala!


    Thanks to a timely counterattack by Admiral Akbar as well as the heroes of Luke
    Skywalker, Princess Leia and Han Solo, the Mon Calamari''s powerful fleet now
    stands ready to fight for peace and justice with the Rebel Alliance.


    Armed with new ships and new allies, the Rebellion is finally poised to take back
    the galaxy from the Empire in earnest. But the Rebels also owe their recent victory
    to Queen Trios of Shu-Torun and her defection to their cause. But Trios may have
    plans of her own....


    ![](img/043783542c8691f931e952baca75148a_8_0.png)


    # Mon Calari Rebel Base.


    > YOUR FATHER WOULD BE PROUD OF YOU, LEIA.

    > THANK YOU, MON. I SHOULD PROBABLY GO AND MAKE SURE QUEEN TRIOS IS COMFABLE.

    > SHE''S DONE SO MUCH TO GET US HERE, TOO...

    > OH, LEIA, I''VE EMBARRASSED YOU WITH A DIRECT COMPIMENT.

    > I SUSPECT TONIGHT WILL BE A TRYING NIGHT FOR YOU.

    > EVERYONE WANTS TO MEET YOU...

    > TRIOS!

    > ADMIT, I''M A LITTLE SURPRISED YOU''RE HERE. I WOULD HAVE THOUGHT THE GREAT
    HERO OF THE REBELLION WAS COMMANDING ONE OF THE SHIPS HERSELF...

    I''M NOT REALLY A COMMANDER. GENERAL INVITED ME ABOARD HIS SHIP, BUT I''D RATHER
    BE HERE WITH MON IN CASE SHE NEEDS ME...

    > OH, SO RESPONSIBLE. WELL, PROBABLY YOU''RE HERE WITH ME.

    WHAT DO YOU MEAN?

    > I DON''T KNOW ANYONE ELSE AT THE PARTY. I''M A MONARCH WITH NO SKILLS.

    YOUR PEOPLE FULFILLED THEIR QUOTAS TO THE EMPIRE AND HAD ENOUGH LEFT SECRETLY
    OF THIS FLEET, TRIOS.

    I CAN''T IMAGINE ANY SITUATION IN WHICH YOU WOULD FIND YOURSELF ADRIFT.

    > OH, LEIA. YOU''RE VERY GOOD.

    IT ADDS TO YOUR TRAGEDY, IN A BETTER TIME, YOU WOULD HAVE BEEN A RULER ON ALDERA.

    PLEASE, TRIOS, YOU CAN''T KNOW THAT. THERE''S NO NEED TO FLATTER ME.

    I''M NO COMPLAINER. JUST HAVE TO USE YOUR EYES TO SEE THE PROOF.

    LOOK! LOOK AT ALL YOU ACHIEVED...


    > LEIA, ...YOU DID THIS.

    > THANK YOU, MON. I SHOULD PROBABLY GO AND MAKE SURE QUEEN TRIOS IS COMFABLE.

    > YOU DID THIS, TRIOS.


    TRIOS, THANK YOU, BUT IT REALLY ISN''T LIKE THAT.

    THE CRUISERS ARE REFITTED MON CALAMARI SHIPS, BUT FROM THE HYPERDRIVE TO THE ENGINES
    YOU''LL FIND SHU-TORUN SYSTEMS.

    EACH IS FULLY OUTFITTED WITH FIGHTER SQUADRONS.

    THE FIGHTERS COME FROM A DOZEN, THE PILOTS COME FROM HUNDREDS MORE.

    THEY''RE NOT, ENGINEERS, MARINES, SPECIALISTS... EVERYTHING.

    EVEN THE EMPIRE DID PART—IF IT WEREN''T FOR THEM OVERPLAYING THEIR HAND WITH THE
    DEATH STAR, PEOPLE WOULDN''T BE SCARED ENOUGH TO RISK JOINING US.

    NO ONE DID THIS.

    WE DID THIS.

    WE''RE IN THIS TOGETHER.


    > GHGGGGGHHHH!

    CHEWIE, STOP COMPLAINING WE''RE NOT MISSING THE PARTY!

    BETTER WE DO WHAT WE''RE GOOD AT—AND I''VE GOT A CONTACT WHO''LL PAY TOP CREDIT
    FOR THIS PRIME COLLECTION OF FRESH TRANSPONDER CODES.

    DO YOU REALLY THINK LEIA WOULD LET US NEAR THE FANCY BRASS, ANYWAY?


    > OH, YEAH, LUKE''S THING...

    > HRHRHRHHH!


    > ...YEAH, YOU GOT ME. I''D HAVE LIKED TO HAVE SEEN THAT, TOO.


    ![](img/043783542c8691f931e952baca75148a_15_2)


