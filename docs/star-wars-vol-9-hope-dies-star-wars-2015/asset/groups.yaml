    # 舒-托伦还活着了


    可怕的死星超级武器已不复存在，被卢克·天行者和英雄的反抗军联盟摧毁。


    邪恶的银河帝国最令恐惧的执行者达斯·维达，正负责根除反抗军并恢复银河系的秩序。


    但每当对维达和帝国军取得一次胜利，反抗军就会变得越来越危险……


    穆斯塔法，

    几个月前……


    你是带着借口来的，奥泽将将……

    分享它们。


    死星的毁灭激发了反抗情绪。


    为我们的工程项目获取资源的尝试正在被延迟，实际上在工作中被阻败。


    我们反击，但只能找到较小的反抗军目标。他们同时无处不在，又无处寻。


    或许挖掘更多词汇会有帮助。我们没有死星，但一支能提供全球范围轰炸的舰队可能具有足够的威慑力？


    至少，我们需要更多的力量——你的死神中队必须立即投入。我们继续这样太荒谬了


