  mdcn: '


    这简直是折磨，汉独自一人在外面。


    我们能做的就是眼睁睁看着飞船一接一地坠毁——


    呜——啪！


    什么？


    哔哔——哔哔！


    阿尔图？


    你在做什么？


    嘎吱咔吱。


    三三三三波？


    长官！噢，这一切都太糟糕了！


    丘巴巴卡大师把我推进了密封舱，然后把它像投射物一样发射出去！它撞击在了表面上，我不得不一路爬到气闸对接口……在我的份上！


    这完全不在我的程序设定范围内，各位！（等等，原文写着"THIS IS NOT IN MY PROGRAMMING ALL!"）


    三三波，但是为什么？


    噢，是的！当然了。


    索罗大师告诉我，只要你直接朝着舱门飞过去，门就会打开。好像是因为安全机制正在运行的。


    ![](img/043783542c8691f931e952baca75148a_83_0.png)


    直接朝它们飞过去吧！


    ![](img/043783542c8691f931e952baca75148a_83_1.png)

    大家！准备好发射！


    ![](img/043783542c8691f931e952baca75148a_83_2.png)

    上船！现在！


    ![](img/043783542c8691f931e952baca75148a_83_3.png)

    放弃武器，斯凯沃克！


    将军，汉传回消息了！


    相信我，门会打开的。没时间浪费了！


    也许会吧，但我们需要先进行测试！


    明白了，斯凯沃克！放弃任务！


    好吧，我想这就是珍恩当时的感受……阿尔图，有开启的迹象吗？


    ![](img/043783542c8691f931e952baca75148a_85_0.png)

    等一下——那是“我不确定它会吗”的意思吗？


    ![](img/043783542c8691f931e952baca75148a_85_1.png)

    太极了


    ![](img/043783542c8691f931e952baca75148a_85_2.png)

    我信任原力，我拯救银河。


    ![](img/043783542c8691f931e952baca75148a_85_3.png)

    但如果我死了，那是因为我信任了三三波。


    ![](img/043783542c8691f931e952baca75148a_85_4.png)

    是的！我从未怀疑过你。


    他成功了！大家！发射！


    凡是卢克的，走吧。


    有同伴在的感觉不错，韦奇。


    没时间感性了，卢克。我们需要投入战斗。


    那么，飞行领队……我们的代呼号是什么？


    你知道的，韦奇，如果我们表现得像珍恩那样，我必须不同意。


    现在是感性的时候了。


    ![](img/043783542c8691f931e952baca75148a_88_0.png)

    流氓中队，结队。


    ![](img/043783542c8691f931e952baca75148a_89_0.png)

    # 马科塔。反抗军基地。


    不，不，不。


    ![](img/043783542c8691f931e952baca75148a_90_0.png)

    那是谁？


    汉，他对那艘飞船非常自豪。第一艘完全配备的飞船。第一艘通过测试的飞船……


    ![](img/043783542c8691f931e952baca75148a_90_1.png)

    ![](img/043783542c8691f931e952baca75148a_90_2.png)

    德文！突破“反叛号”的进度如何了？本该有测试的。由于那艘飞船的配置，由于安全机制正在运行，由于由于由于由于由于由于由于。


