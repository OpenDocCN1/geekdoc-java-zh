    # # Coffee Deposits and Out-Takes


    The interactive documentary, Coffee Deposits:::Topologies of Chance (2010), a
    project I developed in collaboration with artist Seda Manaoğlu, a hybrid between
    documentary forms and the जल्द, contoured into an interactive environment which
    is distributed as a DVD-ROM and partially available on the web. The project’s
    initial intent was to build up in-situ Turkish coffee encounters to collect stories
    while exploring a multiplicity of layers and movements of Istanbul''s denizens.
    The work is broken into seven distinct nodes, palimpsest, mobile networks, mediums,
    contours, pattern recognition, traceuse, and belly of Istanbul, which form a slow
    mapping of unpredictable and rapidly shifting urban patterns and diverse stories
