    of the 1960s and 1970s. This interest was triggered in late 2014 by the confluence
    of Femke''s Mondotheque project and an invitation to be an artist-in-residence
    in Mons in Belgium at the Mundane, home to Paul Otlet''s recently restored archive.


    This led me to identify three tropes of organizing and navigating written records,
    which has guided my thinking about libraries and research ever since: Classification
    entails tree-like structuring, as faceting the meanings of words and expressions,
    and developing classification systems for libraries. Referencing for citations,
    hyperlinking and bibliographies. Indexing from the occurrences of selected terms
    to an ‘absolute’ index of all terms, enabling full-text search.


