  md: 'Members can also edit videos online, download and upload videos, and create
    tags and annotations, bak.ma not aims to contain Gezi upheaval''s videos but also
    other videograms that were stored in hidden parts of computers by media activists.
    Pan.do/ra is a free and open source program. The data (depending on its size especially
    for massive uploads) is classified by date and topic and can be transferred to
    a computer running Linux. The whole process is based on collective working principles.
    Collective documentation and montage requires working collaboratively to produce
    alternative organizations and spaces in place. According to Tan, the ''collective''
    does not suggest the massing together of similar subjects, nor should the term
    ''action'' imply an efficacy that originates in intentional beings or is distinct
    from thought.


    In short, collective action requires the ethics of a community economy. I fact.
    I would articulate this more as an act of ethics of locality that meets the needs
    suggested by our everyday knowledge and the experience of safeguarding our livelihoods
    in urban spaces. The relational network established as a result is more of an
    instant community that chooses to think and discuss together rather than a normative
    structure. Self-organization is not a simple hierarchy based on certain labor
    activities and their division but, conversely, a work/labor structure that allows
    one to be a farmer in the morning and a graphic designer in the afternoon (Tan
    2014, 17).


    In the process of building the archive, everyone involved in the collective structure
    has discussed archiving practices and urban movements, collecting visual data,
    videograms of civil disobedience and the possibility of editing the revolution
    in a metamorphic sense. This is to say that we believe that the term ''archiving''
    in digital video production and dissemination not only means making an open source'
