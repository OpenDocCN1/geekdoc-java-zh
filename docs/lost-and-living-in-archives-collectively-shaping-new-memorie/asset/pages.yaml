  md: '# IGOR STROMAJER


    At the beginning of this decade, archiving digital art works was a hot topic:
    there was a lot of discussion about how to preserve such ephemeral artworks in
    a fast changing environment. Many conferences and symposia took place in Europe
    and elsewhere. Artists, curators, researches and experts were all trying to find
    solutions and best ways to archive and preserve digital art, including net art,
    fragile digital collaborative online projects, and networked performances.


    ![](img/f9e04f352b29e5fc3f1a0eb63b48c3e7_162_0.png)


    Igor Stromajer:

    www.intima.org/

    expunction. 1996-2011


    At that time, in 2011, I went in the opposite direction. Instead of trying to
    preserve my works, I ritually deleted them, live, publicly, in front of the eyes
    of the online community. Slowly starting at the beginning of the new millennium,
    the internet became a very hostile environment, extremely commercialized and potentially
    dangerous for the kind of intimate net art I was doing at that time. I decided
    to kill my works, just because it was about time to do it. I was also sure they
    had lived long enough to say everything, whatever they wanted to. Their mission
    was accomplished, so became useless, obsolete. And


