  md: 'Our dream rewired. Telephone switchboards, radio valves, television tubes integrated.
    Their logical culmination: the computer. The device of our times, a magic mirror
    that reveals what is to come. Our powers of prediction grow with every new circuit
    crammed in. Leap into tomorrow—one trillion calculations a second.


    And it grows more powerful, becomes smaller. Smart, mobile, personal. Today—in
    our pockets. Tomorrow—woven into our bodies.

    —*Dreams Rewired*, narration


    Read this article, I wrote it, very probably with a ‘smart’ device within reach—a
    general-purpose machine that bestows a natural extension of ourselves into networks
    of communication and information, which are perhaps soon to be networks of cognition.
    This enhancement is not just limited to our becoming users of the internet, nor
    to us becoming users at all. For these information networks also track our travelling,
    web-browsing and purchasing habits, for example, as gleaned from the metadata
    that we unconsciously, but continuously, write; thus the power of three parties
    (such as corporations) is also enhanced. The data sequestered in these networks
    (sometimes called ‘Big Data’)


