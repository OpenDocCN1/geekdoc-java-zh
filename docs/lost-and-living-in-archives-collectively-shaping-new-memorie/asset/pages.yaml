    the bulk material down to a core of examples, or themes from the study of the
    bulk documentation illustrated'', a regime that Frisch described the differentiation
    of digital data as ''raw vs. cooked'' (Frisch 2016, 1996).


    The long-take in-situ has many affordances (social, technical, political), which
    may potentially promote autonomous spaces (both offline and online) as well as
    evoke and expose extremely personal and sensitive conversation topics. For example,
    our city walks with Deniz Deniz (pictured below) on the streets, İstiklal Caddesi,
    Yüksek Kaldırım, Bankalar Caddesi, and within the vicinity of the Galata Tower,
    there is a section where we stop in the middle of a pedestrian staircase (Kamondo
    Stairs). We make Turkish coffee, (to really disrupt traffic) and continue talking
    for an extended period of time. Again, the encounter is in a long-take:


    LOST AND LIVING (IN) ARCHIVES'
  merge: -1
  pgno: 252
- img_proc: true
  md: 'capturing passiersly, the coffee brewing process, spontaneous coffee cup (fortune)
    readings, where personal and political stories are blurred, exchanged, translated
    and debated. Accordingly, as researcher and co-initiator of pad.ma Lawrence Liang
    reminds us, ‘there is the contingent surge any act of image-making always captures
    the unintended, the ambient and the transient’ (Liang 2016, 103).


    With this scenario in mind, the strategy of the long-take may call for varying
    modes of selection criteria given the multiple factors at play in the footage,
    especially if they are appraised over a period of time. Perhaps creating a space
    for iterative changes, extended tagging and annotation could be in the form of
    an external wiki. As Axel Bruns mentions, the editability of wikis ‘enable their
    users to create a network of knowledge that is structured ad hoc through multiple
    interlinking between individual pieces of information in the knowledge base’ which
    in turn, also supports process-oriented approach to offer some degree of secondary
    temporal structure for their contents (Bruns 2008, 102-3). In this way, out-takes
    from a project such as ours could be appraised to distinguish the diversity of
    conditions and contexts embedded into and surrounding the footage.


    To be sure, issues around privacy, ethics and on-camera permissions would inevitably
    come into play, especially considering the sensitivity of the material, and/or
    levels of intimacy cultivated during the recording. A Revisiting of the original
    ‘contract of good faith’ between appearing and participating in the footage might
    also be a consideration. Indeed, it goes without saying that ‘selection is hindered
    by the fact that we can never fully anticipate the use of anything in the future’
    (Cox 2011, 218). These and other related issues necessitate a more cogent and
    expansive revisiting, which is out of the scope of this short essay. Although
    I have only surveyed a sampling from our documented traversals in this text, I
    can only imagine that remaining mindful and transparent to the aforementioned'
  merge: -1
  pgno: 253
- img_proc: true
  md: 'complexities when revisiting and reappraising many hours of materials might
    inevitably become prey to the ‘funneling’ process that Frisch outlined. Regardless,
    the *bak.ma* archive and the gesture of the invitation beckon.


    # Post-Script


    I am pre-occupied with the thickness of our archive to reach beyond the ruin,
    the shoebox of unseen images and silenced voices, the ethics behind making personal
    encounters available as *raw data* which were filmed and distributed under different
    conditions from a Creative Commons Attribution ShareAlike 3.0 economy. To be sure,
    approaches of appraisal would continually inform future data framing through decontextualization
    process. Media historian Lisa Gitelman and Virginia Jackson posit the conundrum
    of decontextualization and framing through both data and in the photographic image:


    The presumptive objectivity of the photographic image like the presumptive rawness
    of data seems necessary somehow ... At the very least the photographic image is
    always framed and selected out of the filmic experience in which the photographer
    stands, points, shoots. Data too need to be understood as framed and framing ...
    Indeed, the seemingly indispensable misperception that data to be the one in which
    data are forever contextualized—that is, framed-according to a mythology of their
    own supposed decontextualization (Gitelman and Jackson 2013, 5).


    How to approach my own *framed* appraisal criteria? How might one construct an
    accompanying supplement that addresses the editorial choices and re-contextualization
    in selecting through a digital heap of so-called raw data? One suggestion I made
    was using the strategy of the long-take, in which each archival ‘deposit’ might
    provide a link'
  merge: -1
  pgno: 254
- img_proc: true
  md: 'to a wiki page that orients for example, the selection of long takes, their
    omissions, anomalies, et cetera. By no means is this a template, nor am I suggesting
    that other activists, artists, documentarians who want to upload and collaborate
    with bak.ma need to adhere to this rationale. However, as also mentioned by Gelman
    and Jackson, ‘Data require our participation. Data need us (Gelman and Jackson
    2013, 6). As well, library and information sciences scholar Richard J. Cox argued,
    ‘appraisal documentation is necessary since the nature of the new digital documentation
    universe requires re-thinking appraisal as a continuous process rather than one-time
    process (as it has often been thought of!) (Cox 2011, 228). It is especially necessary
    within the archival ecologies discussed here. Perhaps this wiki could be an addition
    to bak.ma’s existing tagging options and provided metadata fields within their
    interface.


    While operating along the fissures of activist and tactical media, the out-takes
    and archival surpluses from Coffee Deposits::Topologies of Chance are imbued with
    their own lapses, affordances, anomalies, predesigned outcomes and adventurous
    detours, and perhaps a more reflexive stance to détour the raw mythologies of
    any given footage.'
  merge: -1
  pgno: 255
