  md: 'In 1997, I had really bad luck, because as a young artist I naively submitted
    my first net art work to the EXTENSION exhibition and competition organized by
    the Hamburg Kunststalle, where Cornelia Sollfrank brilliantly bombed the event
    with her ''Female Extension'' (which later evolved into the net.art generator)
    which created 289 non-existent female artists to compete. Her intervention was
    a wonderful cyberfeminist action, it was one of the turning points in net art
    history, many great essays were written about it. Unfortunately, I was one of
    the three awarded (all male) artists who got the final award at that competition,
    know of the white/straight/male bad guys, and this has marked my further in in
    very negative way; because the net community perceived me as if I was their enemy,
    or at least one Cornelia Sollfrank had fighting against. although I had nothing
    to do with the selection process and the competition itself. But in the consciousness
    of the net art community of that time, the event remained an example of the conflict
    between Cornelia Sollfrank''s excellent subdivision and a non-critical participation
    of other artists, myself included. Im not talking bullshit: at many occasions,
    various artists and curators were making fun of the winners of Extension competition
    in my presence, some of without knowing that I was one of the awarded artists.
    Later, I was often perceived as the guy from the other side, a bad guy, and many
    doors were closed for me. The net art community never took me as one of them,
    but always as one of those guys Cornelia Sollfrank was ridiculing. So, without
    actually being guilty (and beside that, I deeply admired her work), I had to live
    with this, but it helped me to establish my later pseudo-artistic position. Perhaps
    the whole story didn''t happen exactly as I''ve described it, but this is how
    I remember it.


    As a consequence, my work is present in few net art history books, online lists,
    and retrospective exhibitions.


