    Another archival loss that could be configured as an act of caring for the archival
    subject is the current move by Danish, Swedish and Dutch museums towards removing
    offensive archival from digitized titles and descriptions and replacing them with
    less racially-charged terminology. This ''loss'' is by some (including the present
    author) experienced as a long-awaited recognition of, and break with, the countries''
    colonial history and a gesture of caring for archival subjects as objects. Others,
    however, perceive the gesture as a fundamental loss of cultural context and cultural
    heritage showing that even metadata, despite its original functionality, is also
    now thought of in terms of preservation. According to historian Peter Fritzsche,
    ''The history of the archive is the recognition of loss'' (Fritzsche 2005, 187).
    Such loss also calls for an examination of which kinds of bodies are abjected
    and in what contexts; whom and what is made inadmissible to the archival codes
    of intelligibility, how it is made known in policy and politics, and what is made
    to live ''in the shadowy regions of ontology'' (Meijer and Prins 1998, 277). For
    the most part, these questions have been raised in relation to the patriarchy,
    yet this article shows that the archive is, and has always been, gendered in complex
    ways. Whereas I described the beginning of this article that the operations of
    the archive have traditionally been related to the patriarchy, making feminine
    qualities invisible, perhaps this invisibility is exactly caused because of its
    connotation with the feminine?


    If so, archive theory would merely repeat a philosophical symptom, which has routinely
    made the female disappear both as object and subject of theory, not least in the
    philosophy of technology. Conceptualizing archives as


