  md: 'constitutes a user-generated archive. Conversely, as I will show, the archive
    absorbs the communication networks connected to it—just as it absorbs the standalone
    devices needed to read its contents. This assimilation of the network emphasizes
    the function of the archive in controlling knowledge, over its traditional role
    of being ‘neutral’ storage.


    The film Dreams Rewired (2015), directed by Luksch, Martin Reinhardt and Thomas
    Tode, is an assemblage of more than 200 films from the 1880s to the 1930s, many
    rare, some previously unseen; they range from the earliest dramatic works of music
    hall, newsreels, marketing materials, recordings of scientific experiments, and
    artistic explorations of film as medium. One major trajectory through Dreams Rewired
    traverses contemporary (network-induced) affects and anxieties back the birth
    of the electric age, illustrating how the psychological and social convulsions
    of today’s hyper-mediated world were prefigured in the electric media boom of
    the late nineteenth century. Not only is Dreams Rewired itself an archive, of
    depictions of the hopes and fears for a connected electric future, the central
    process in its making was the consultation of fifty public and private media archives
    around the world.


    Even the idea of making the film per stems from the accidental discovery in an
    archive cell of shellac discs, which upon inspection turned out to hold the (presumed)
    soundtrack to Eisenstein''s Battleship Potemkin by Edmund Meisel.


    ![](img/f9e04f352b29e5fc3f1a0eb63b48c3e7_103_0.png)


    Battleship Potemkin, and the disc that started as All Tonellenplatte/sound disc
    (number 3 of a set of 5 discs) of Brononesky Potemkin (Eisenstein, 1925) with
    soundtrack by Edmund Meisel, recorded in 1930 and rediscovered in 2002: restored
    and published as Wiener Fassung, 2014. Technisches Museum Wien.


    > Track, record, freeze the trace—then tune, control, accelerate.”— Dreams Rewired,
    narration


    In Dreams Rewired, the archive is not only a bridge to the past, but also a bridge
    to the future—to the future as foretold through early science fiction film, and
    also to a future scientifically predicted by the high-speed photography and time-and-motion
    studies of Étienne-Jules Marey.


