- img_proc: true
  md: 'Within the realm of archiving and conservation, free and open licences are
    a useful tool to make both the reuse and the conservation of digital art more
    feasible (Laforet 2010). Even though it is undeniable that such licences have
    an overall positive effect, they however struggle when coming to defining the
    components, materials, and assets that have been involved in the creation of a
    work. The lingo used in such licences stems from the world of software and despite
    its adaptation to cultural works, it hasn''t got rid of the binary nature of its
    origin. When a software licence requires access to the source, it refers to the
    source code, a well-known object in the making of software that is easy to define
    and identify. While this perfectly fits a particular form of art, in particular
    art that involves computational processes, is questionable whether this concept
    of source code can be literally ported to other cultural expressions, such as
    moving or digital images, sounds, and by extension multimedia and rich media works.
    In this essay, I argue that such works require both a media-specific as well as
    a metaphorical understanding of what source code is in the context of art, music,
    and design in order to make free and open licences valuable for conservation,
    archiving, and of course in-depth study and appropriation of the former. Behind
    this challenge lie the issues of accessibility and control with free cultural
    expressions and open knowledge, and how these compare their software-centric parent
    dependencies.


