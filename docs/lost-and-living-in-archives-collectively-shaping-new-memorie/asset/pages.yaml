  md: '# 7. An Archive Hostage I: Economic Crisis


    Occasionally, an archive became hostage to its own regulations and to the prevailing
    economic situation.


    The Filmoteca de Catalunya holds the largest collection of films by Spanish director
    Segundo de Chomón (1871–1929). The Filmoteca had provided screeners for several
    titles, all of which had been selected for *Dreams Rewired*. Although the archive
    was wishing to agree to licences, it was unable ''for an unknown period of time''
    to provide any high-resolution copies. The Spanish economy was in a crisis brought
    on by the 2008 crash; cultural spending had been slashed, and the Filmoteca''s
    laboratory was one of the victims. Offers to arrange duplicate at other trusted
    labs elsewhere were turned down since, understandably, they did not permit fragile
    negatives to be removed from the building.


    It appeared as if Ch Chomón''s highly original, poetic and technically refined
    films would remain locked out of circulation. Further research eventually turned
    up copies of some of the films in other archives, but a key—Le Miroir Magique
    (1908)—could not be found elsewhere. Luckily, only a few days prior to finalizing
    the *Dreams Rewired*, the transfer facility at the Filmoteca reopened, and this
    film made the cut.


    ![](img/f9e04f352b29e5fc3f1a0eb63b48c3e7_116_0.png)


    Still from Dreams Rewired (Luksch/Reinhart/Tode, 2015): Paris qui dort (René Clair.
    1924)'
