    dreaming of. Members of the collective also interviewed certain leading persons
    and important figures of the protests, such as the director of the Chamber of
    Architects, the members of parliament who were contributing and supporting the
    protests, lawyers, leading persons of political parties and activist groups. They
    were asked about their points of view on the whole resistance process in the framework
    of urban rights, democracy and emancipation, appropriation of public space, and
    the effects of recent social movements on Gezi resistance.


    Afterwards, the collective started to bring all this together by organizing the
    tasks and distributing the voluntary work among its members, and shared all the
    recordings with the public: interviews, happenings, violence, everyday acts, visual
