  md: 'And they have always posed a challenge for archivists, who are continuously
    required to monitor and judge the viability and vitality of their collections.


    As American librarian Melvin Dewey noted at the beginning of the twentieth century,
    a ''normal librarian''s instinct is to keep every book and pamphlet. He knows
    that possibly some day, somebody wants it'' (Dewey 1926, 311). Part of this instinct
    stems from the archival experience that no objective measures of quality exists
    that stays constant over time. Collections will therefore never achieve a sublime
    state, but rather function as representations of different views and values as
    they change over time. As Dewey also noted, books are often fetishized to a degree
    that their destruction becomes not only unprofessional, but also immoral, and
    accumulation the only ethical solution. This solution may also have been a viable
    solution in the nineteenth century and earlier, but the accelerating amount of
    printed matter accrued to lowering production prices and increasing literacy challenged
    this ''save-all'' mentality. Archives and libraries literally not contain any
    more and had to object increasingly large quantities of matter. Dewey suggested
    that librarians should fight their preservation instinct and distinct the book
    from ''a fetish to be worshipped'' to ''a tool'', if nothing else because of the
    lack of quality in many books, ''if a competent jury sat on all that is printed
    in books, magazines, and newspapers, more than ninety percent would go back to
    the paper mill'' (Dewey 1926, 311).


    As archivist Timothy L. Ericson (1991) describes, archives were confronted with
    the same problem as libraries. The growing amounts of information in the late
    1800s to early 1900s caused the British archivist Hilary Jenkins in 1937 to note
    that the 1900s raised ''at least one new question in Archive Science; one which
    has been little considered or to that time'' (Jenkinson 1937, 21): quantity. One
    major source of the accelerating growth of information was the First World War
    that had amassed an ''possibly bulky'' holdings of records. Jenkinson was concerned
    ''the post-War'
