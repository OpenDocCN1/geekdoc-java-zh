  md: 'but even more remain outside, to be forgotten. Rather than something negative,
    this loss, in the sense of forgetting, should be treasured, as it prepares for
    something new to emerge. Generally, loss in an archival sense is seen as the undesirable
    antipode to memory. However, German philosopher Friedrich Nietzsche has argued
    that forgetting is also positive, active and essential to life and thinking. Immmersing
    oneself in memories of the past would obstruct creative action in the present,
    and too much of a historical sense would destroy the concept of ''history'' itself
    (Spinks 2003, 80). As concluded by Nietzsche, there is a degree of sleeplessness,
