- img_proc: true
  md: 'The fact that Google Image Search (GIS) uses a mixture of textual cues and
    visual ones in performing an image search is not and itself problematic. However,
    it becomes a problem the ''secret sauce'' of a product like GIS is its inscrutable,
    imprecise, and subject to change without notice.2 The particular recipe of the
    day may or not ''bake it in'' an understanding of an image that subdivides pixels,
    costs, reinforcing the sense of the image as an illustration of quality. The apparent
    simplicity of the tool reflects a perception of ''digital tools'' as black boxes
    which are somewhat unnatural, inscrutable, inevitable.


    Hal Varian describes the ''secret sauce'' as follows,1 we would argue that Google
    really has a better product than the competition—because we have more or better
    ingredients, but because we are continuously improving theirs recipes because
    we know the competition. We can''t fall back on economies of scale, switching
    costs, or network effects, to isolate from the competition. The only thing we
    can do is work as hard as we can to keep our search quality better than that of
    the others (Varian 2008).


    In 2014, the Jorn Museum invited us to visit the SICV archive. Upon arrival, we
    were confronted with ideas and images stored in a complex relational and paper-based
    structure: manuscripts, indices, maps, negatives, content sheets, photographic
    prints, folders, binders, books. We tried to understand how the archive works,
    to map its'
  merge: -1
  pgno: 66
- img_proc: true
  md: 'relations, conjunctions and affordances, and we spoke about what a prospective
    digitization of this material might open up. The work took the form of a research
    period to become familiar with the particularities of the archive, and was followed
    by a small installation which eventually became part of a collection of ''hands-on''
    exhibitions and workshops exploring Jorn varied techniques. This article will
    analyse the consequences of the interchangeability of tools and techniques and
    how digital tools can lend themselves to miscuous and constructive (misuse) and
    novel assembly.


    # Green Tongues


    La Langue verte et la cuite is a large-format photo-book produced by Asger Jorn
    and French writer Noël Arnaud in 1968. The book riffs off Levi-Strauss''s Le Cre
    et le cuit (1964), the first in a series on ''mythologies'' comparing and contrasting
    recurring elements across different cultures via conceptual dualisms as ''raw''
    versus ''cooked''.


    Le Cre et le cuit comprises some 400 pages of primarily text and contains just
    four photographs in the main text, including a single portrait of a Bororo, the
    culture that plays a central role in the work. Besides this, the book contains
    a special appendix, titled ''Bestiaire'', containing sixteen pages of engravings
    of animals referenced by the myths found in the text. Drawing on the photographic
    archive of the SICV, a project Jorn started some years before Lang verte, in contrast,
    is driven by images. The vast majority of its pages contain black-and-white photographs,
    many nearly full bleed, each of which have been overpainted by Jorn with a single
    colour to indicate their ''tongues''. Some of the tongues would be evident without
    the colour, but are rather the suggestion of the overpainting, a playful gesture
    following the flourish of a decorative element or activating the negative space
    within an image. The colour of the overpainting changes over the course of the
    book in accordance with a range of themes, themselves often involving puns and
    wordplay. The title'
  merge: -1
  pgno: 67
- img_proc: true
  md: 'itself La Langue verte et la cuite is multiple play on words: ''la langue verte'',
    literally means ''the green tongue'' and also means popular language, or slang.
    ''La cuite'' or ''to be cooked'' in French is slang for being drunk.


    As art historian Steven Harris notes, ''Jorn insisted on the separation of text
    and image, that images could function independently of text and be arranged according
    to an order intrinsic to the images themselves'' (Harris 2012, 112–15). Beyond
    exhibiting simply a separation of text and image, a key feature in the book is
    the *primacy* of the image, with high-quality black-white- photographs printed
    without captions. Each image is discretely labelled with a numerical reference
    which leads the interested reader to a corresponding caption found in appendix
    form in the book. Jorn thus reversed the relationship of text to image typical
    of academic writing. In contrast to the reductive black-and-white engravings of
    animals in Lévi-Strauss''s *Bestiaire*, where each species is reduced to a single
    representative example, the photograph rewrites the conventions of ''objective''
    photographic representation of archaeological objects, employing dramatic lighting
    than flat, fluctuating shadows and expressive details rather than representing
    them.³ Jorn''s presentation of these as ''portraits of stones''⁴ is reflected
    in his efforts to print the books with multiple layers of ink to enhance the dynamic
    range of the blackness of the images (Henriksen 2014, 227).


    Teresa Østergaard has developed the archaeological implications of this visual
    strategy in her article ''The Image as Agent: "Comparative Vandalism" as Visual
    Strategy'': http://sicv.activearchives.org/


    Matthew Fuller. http://sicv.activearchives.org/w/Computational_Vandalism. Accessed
    20 June 2016.


    # # Tracings


    When we arrived in Silkberg, we were aware of the archive: seven filing cabinets
    with four drawers, temporarily moved into the main exhibition space. We were informed
    that the left-to-right order of the cabinets had been inverted as a result of
    the move up from the museum''s basement depot. Placed beside a short black table
    boundary, the cabinets had been staged as a kind of simulated worked complete
    with an adjacent table and lamp. A number of the photographs'
  merge: -1
  pgno: 68
- img_proc: true
  md: 'had been reproduced and strewn about in a pile on the floor with a scenographic
    flourish vaguely suggestive of a crime scene. We were given extension cables and
    additional lighting and got to work, the imagined workspace becoming actual as
    we unpacked it, plugged in our laptops and began to take notes and photographs
    of the material.


    In the cabinet, each image appears in several copies, first as a photographic
    negative, then on a contact sheet (itself a document often marked upon grease
    pencil), and finally in multiple reproductions at varying sizes. In this way Jorn
    and others were free to work from the archive, cutting out copies of images for
    use in (possible) spreads for publications. This literal form of ''cut and paste''
    and the function of the ''copayability'' of the photographic negative was a useful
    reminder of the many physical and manual gestures on which digital tools and workflows
    have been (metaphorically) based. As Jorn and Arnaud wanted to bring tongues back
    to ''la langue'', we started to wonder what it might mean to give something of
    the ''finger'' back to the digital.


    # Bag of (Visual) Words


    ''Holy shit, it''s working...'', Nomi exhaled and instinctively fanned the hands
    and bowed her head gravity to the monitor in a quasi-sincere gesture of adoration
    to the algorithm. Just an hour earlier, she was exasperated, slumped back in her
    chair at the computer in the corner of bedroom. She had been working non-stop
    during the weekend trying to get her code to work and she''d hit a major snag.
    The textbook in front of her was open on chapter seven, ''Searching Images'',
    about building a simple image-based search engine.


    Content-based image retrieval (CBIR) deals with the problem of retrieving visually
    similar images from a (large) database of images. This can be images with similar
    colour, similar textures or similar objects or scenes, basically any information
    contained in the images themselves.'
  merge: -1
  pgno: 69
- img_proc: true
  md: 'For high-level queries, like finding similar objects, it is not feasible to
    do a full comparison (for example using feature matching) between a query image
    and all images in the database. It would simply take too much time to return any
    results if the database is large. In the last couple of years, researchers have
    successfully introduced techniques from the world of text mining for CBIR problems
    making it possible to search millions of images for similar content. The most
    common weighting is tf-idf weighting (term frequency—inverse document frequency).
    But what form exactly does this ‘information’ take? (Solem 2012).


    Working with Computer Vision techniques was a relatively new area of interest
    for Nomi. Two decades ago, when the application of such techniques still belonged
    to the relatively speculative field of robotics, she studied some of the techniques
    during her Computer Science studies. However, it was the masses of smartphone
    users, rather than the hydraulics of robots, that mobilized these artificial eyes,
    first in the form of face-detection routines artificially adjusting cameras exposure
    settings and in the sophisticated tagging and analyses performed by social media
    platforms once these images were ‘shared’. The book is one of ‘animal books’ from
    the technical publisher O’Reilly. On the cover is an old-style black-and-white
    depiction of a ‘bullhead catfish’, which according to the book’s colophon is a
    ‘bottom-feeder’ that to its high reproductive rate and destructive effect on aquatic
    ecosystems is considered a curse for fisheries (Solem 2012, 247). Nomi wondered
    darkly if this was meant as wry statement on the implications of computer vision
    techniques culturally. These concerns were now far from her mind as she struggled
    with her code.


    She was trying to match image fragments from a video where images had been projected
    in a slide show back to the original digital images. Initially she thought to
    do the'
  merge: -1
  pgno: 70
- img_proc: true
  md: 'work ‘by eye’, but after a few minutes of flipping through just part of the
    300 possible images searching for a match, she realized that the task demanded
    more visual patience than she could endure. So she was hoping ‘visual bag of words’
    might do the trick.


    To apply text-mining techniques to images, we first need to create the visual
    equivalent of words. This is usually done using local descriptors like the SIFT
    descriptor in Section 2.2. The idea is to quantize the descriptor space into a
    number of typical examples and assign each descriptor in the image to one of those
    examples. These typical examples are determined by analyzing a training set of
    images and can be considered as visual words and the set of all words is then
    a visual vocabulary (sometimes called a visual codebook). This vocabulary can
    be created specifically for a given problem or type of images or just try to represent
    visual content in (Solem 2012).


    She dutifully went through all the steps. First she ran the SIFT program to detect
    and dump a ‘description’ of all the ‘interesting’ features of some 300 images.
    Next she ran a ‘training step’ to build the ‘visual vocabulary’ based on all of
    the features from all of the images. This step turned out to be quite computationally
    expensive’: running the code initially on her laptop had the computer struggling
    for half an hour or before showing a dreaded ‘segmentation fault’. Moving to a
    desktop computer with more memory and faster processors, after another half hour
    of computation, the algorithm had successfully dumped out the resulting ‘vocabulary’
    in the form of a file. She then reprocessed the 300 images, creating an ‘index’
    by recording the ‘profile’: the feature descriptions of each image made when ‘projected’
    back onto the statistical average of the vocabulary. Finally, she attempted to
    ‘search’ the index: the search image was a still from a video in which a fragment
    of the original'
  merge: -1
  pgno: 71
- img_proc: true
  md: 'images appeared in the background. She hoped that by searching the index, the
    original image would come back as a ''hit''. She ran the video frame through the
    same process, comparing its feature ''profile'' to all those in the index and
    returning a list of hits ordered by similarity. But it didn''t seem to be working
    at all. The code all errors seemed random and didn''t provide the match she was
    looking for.


    Having come to a dead end with visual bag of words, Nomi decided to abandon the
    technique and focus solely on the SIFT features themselves. Instead of relying
    on a search index, she decided to apply a ''brute-force'' matching algorithm to
    compare the features of one image to each feature of every other image by one.
    Such a technique would never work for a collection of thousands of images, but
    for her small set it suffice. She started the algorithm and waited for it to plod
    through the comparisons. After 15 minutes or so checked the log file and saw the
    algorithm worked surprisingly well: for a particular video frame, most comparisons
    yield no matches; in a few cases there are 1-10 matches, and one obvious match
    of over a hundred features! Nomi opened the corresponding image and visually confirmed
    that the fragment was contained within the photograph. In the rush of opulent
    relief she forgot all the work she had done to get to this point and was left
    marvellous at what she perceived as the mightness of the algorithm at work.


    # Computational Vandalism


    Bag of words is just one example of a ''layer cake'' of methods and techniques
    that is typical of computer programming in general, and of computer vision in
    particular. Different methods and algorithms are often pulled out of the programmer''s
    ''toolbox'' and mixed and matched, the output of one strapped onto the input of
    another, to perform a task. This fact is not problematic. The very interchangeability
    of tools and techniques is an exciting part of how digital'
  merge: -1
  pgno: 72
- img_proc: true
  md: 'tools can lend themselves to promiscuous and constructive (mis)use and novel
    assemblage. The difficulty, however, lies in understanding or considering how
    the assumptions and limitations of one layer influence the others and whether
    the assumptions of one part of the pipeline are still appropriate later when one''s
    attention has shifted the ''stack'' to another part of an application. ''Black
    boxing'' as an engineering process is all about being able to ''let go'' and forget
    the details of a particular part of a program one focuses on to another. The danger
    is when, in a process of abstraction where the inner details and context of particular
    routines are suppressed, one is tempted to start believing the often-exaggerated
    claims that effectively label the box.


    Jorn repeatedly referred to the Swedish architect Erikberg''s concept of a ''language
    of form'' and suggested that the mathematical field of topology might contribute
    to a ''comprehensive codification'' of visual art. See, for instance, Jorn 2012
    (1968).


    Jorn may well have the idea of creating ''language'' based on purely visual aspects
    (albeit filtered through the techniques of mathematics) profoundly appealing.
    But whose language is it, and what do the words refer to? Are they the observations
    of the anthropologist aiming to trace cultural heritage through ''symbolic icons'',
    or rather the cryptic mutterings of an obsessive-compulsive jigsaw player viewed
    through a loupe?


    Jorn''s offering of overpainting as visual evidence in a new kind of academic
    discourse, makes the radical proposal to embrace the subjectivity of the image,
    asserting the image as something open to multiple interpretations. The algorithmic
    treatment such as contour tracing can easily be seen as itself a kind of overpainting,
    a performative act contingent on the situated application of algorithm to image.
    Far from producing an essential reduction that ''consumes'' its subject, the algorithmic
    overpainting suggests new ways to read and re-read the image.


    How can one embrace the multiplicity of meaning in these forms of algorithmically
    determined language, in line with Jorn''s tactical deployment of the pun in La
    Langue verte? Jorn''s response to a reductive reductive of language evident in
    Lévi-Strauss''s structuralism was'
  merge: -1
  pgno: 73
- img_proc: true
  md: 'embrace and display the full capacity of language, both visual and textual,
    to include multiple meanings, speculations, deliberate ambiguities, insults and
    offence, fiction, insinuations, absurdities and contradiction. What are the equivalents
    in a visual vocabulary? What alternatives are there to the frequently used statistical
    reductions of techniques like k-means and principle component analysis and what
    are the impacts of using such techniques to index visual material? As the engineering
    world moves increasingly to ever more obscure and inscrutable methods such as
    deep learning, there is an increasing need for sharpness in ensuring that such
    techniques actually promote an more diverse and expansive image-reading culture
    rather than an ever banal and narrow one distorted by feedback loops of popularity.


    At the end of Harris''s reading of La Langue verte he describes the spread, occurring
    late in the book, where a well-known portrait of Albert Einstein, tongue playfully
    extended to the camera, has been overpainted in pink. Opposite this is a young
    woman taking part in the May 1968 protests in Paris, standing in the middle of
    a street delofting her tongue, presumably to the police. Harris notes how the
    gesture clearly originates from a joyful position of self-empowerment (Harris
    2012, 130). In early 2016, the authors created a small installation for the window
    of the Constant Office in the Saint-Germain neighbourhood of Brussels. For forty
    days, a camera was set to record short sequences of video frames, framed by the
    presence of a ''face'' as detectable by a standard ''face-detection'' algorithm.
    When a face was detected, a short sequence of frames was recorded, and the regions
    of the image detected as ''faces'' would be replaced by faces similarly detected
    in an archive of images, including images from the SIC. Many of the detected ''faces'',
    both from the street and the archive, would be considered false positives—images
    not of faces but of car hubscaps, the folds of a puffy jacket, the typography
    of a book page,


    For more information, see: http://constvag.org/site/The-Scandinavian-Institute-of-Vandalism.
    Accessed 20 June 2016.


    Based on the Haar-cascade face detection method, see http://docs.opencv.org/2.4/modules/objdetect/detect/cascade_classification.html.
    Accessed 20 June 2016.


    # LOST AND LIVING (IN) ARCHIVES'
