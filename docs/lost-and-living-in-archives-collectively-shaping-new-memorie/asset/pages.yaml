  md: 'or the play of light on the opposite building. A number of monitors were arranged
    facing the street in a reversal of the traditional surveillance setup, making
    the recording apparatus and processing pipeline as visible as possible, showing
    the transformation step by step to its subject. Once the recordings were complete,
    a short animation loop was produced and displayed on a central monitor. One Saturday
    evening, the image below was recorded.


    While it may be tempting to interpret the gesture as a statement of disapproval
    of the installation, something seems to be at play, suggesting a further meaning
    of the notion of giving the finger to the digital. The installation was not continuously
    recording but in fact only recorded fifteen frames before entering into the processing
    loop that took at least a full minute to complete. most of the recorded sequences
    are accidental, often showing passersby unaware of the camera and with the algorithm
    fleetingly finding faces, often involving false positives. In this recording however,
    the subjects stand with their faces forward, anticipating the operation of the
    machine and demonstrating a comprehension of the system and its mechanics. The
    pair fully address the algorithm, and in so doing they perform it. The gesture
    of the raised middle finger, then, is made from a position of positive subversion,
    feeding back a message of resistance to the captured gaze of artificial attention.


