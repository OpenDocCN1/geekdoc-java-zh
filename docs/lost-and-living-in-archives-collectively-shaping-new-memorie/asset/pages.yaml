  md: 'There are two particular types:

    First, we have the Under Construction pages—the ones that promise new material
    will be published over the weekend or next week. Some include notes from the author
    pointing out that it''s been a long time since he or she has written anything
    (besides Welcome to my Homepage), and this is usually followed by promises to
    be more diligent in the future. Geocities is rife with these unfilled promises.
    Some of them are nothing more than a line on an otherwise empty page; some are
    generously decorated with Under Construction graphics that are so characteristic
    of the late 1990s. Any user could have any number of reasons for not returning
    to their projects. The main one being that most people didn''t need home pages.
    Yet, even those who didn''t really need a home page were trying their hand at
    being a webmaster.


    I''ve no idea, on what to put here ... BUT! When you come back ... I''m sure you''ll
    find something interesting!'', one user promised in 1997. His ''coming soon''
    had remained archived online at www.geocities.com/Wellesley/1545/ for 13 years
    before it was archived.


    Unsuccessful attempts to set up a page have no particular value and may not be
    that visually gripping, when you come across them, you always get this special
    feeling—they remind you of the times when eternal construction was the core of
    all online activity.


    The other type of pages we call This page has moved. These include an author''s
    message declaring that his or her profile will no longer be updated. They may
    be neutral, sad, or sometimes full of hatred towards Geocities. The last type
    wasn''t so rare: At the turn of the century, users had reason to berate the service—including
    a lack of respect for the community and neighbourhood ideas, and watermarks that
    gave away the company''s intentions of catering to investors rather than users.
    While another variation on this were the happy and excited users who issued closing
    messages that announced they were finally buying their own domain name.'
