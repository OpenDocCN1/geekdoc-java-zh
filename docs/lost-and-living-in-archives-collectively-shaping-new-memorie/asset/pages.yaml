    I think that oral history is applied more broadly. There is now oral history about
    entrepreneurs too, not just about groups of homeless people and refugees. These
    are new groups that provide insight into how power structures are legitimized.
    It yields fine contrasts with the story of a self-employed person who feels exploited.


    Oral history enables you to show how certain things affect one another, the complexity
    and combination of gender, sex, colour, ethnicity. These are themes that lend
    themselves for for elaboration on the basis of personal experience. The best way
    to interpret the influence of your background on the role you are assigned in
    an institution it get people to talk about it. What are their arguments, how do
    they see themselves, how do they see the others? These kinds of aspects automatically
    emerge once people start to talk about their functioning.


