  md: 'were transforming institutions during modernity. These policies were stated
    in library legislation best-practice guidelines innocuouslyously titled Collection
    Development and Management policies, outlining what circumstances institutions
    could choose to rid themselves of material in their possession, how and under
    whose authority. The bureaucratic apparatus underpinning the practice of de-accessioning
    and disposal of books consequently developed in the subtle disenchanted discourse—promoted
    by Dewey. Only recently these guidelines on collection management also informed
    archives, whose outline on disposal were not developed clearly until late in the
