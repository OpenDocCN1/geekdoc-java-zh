    # 3. Licence to Thrill—Representing Jazz


    Before the broadcast spectrum has been apportioned between public service and
    commercial stations, amateur radio transmissions met and drove popular demand
    for music. Radio played a key role in the promotion of African-American music
    in the US of the 1930s. Jazz, or ‘hot music’, was associated with unrest—race
    riots, labour activism—and slancishness, stoking parents'' fears for their children’s
    ‘purity’. Broadcasts could pass invisibly through walls, granting jazz an audience
    in suburban homes. There arose a fear that black voices could use radio to lead
    the nation by its ears, sabotaging the solemn genre of homogenizing culture.


    This controversy was reflected in films such as the live-action/animated musical
    short, It Be’re Dead, You Rascal You., starring the glamorous cartoon character
    Betty Boop. Effectively a ‘music video’ for the song by Louis Armstrong, it depicts
    Armstrong as first performer, and later as ‘savage’ protagonist of the song’s
    story.


