    # DB


    Surely, in the realm of bits, nothing is designed to last forever. Uncritical
    adoption of Flash has turned out to be perhaps the worst tragedy so far. But while
    there certainly were more alternatives if one was OK with renewing its emblematic
    visual effects and aesthetics with it, with PDF it is harder. There are EPUBs,
    scholarly publications are simply unthinkable without page numbers that are not
    supported in this format. Another challenge the EPUB faces from artists'' books
    and other design–layout-conscious publications—its simplified HTML format does
    not match the range of possibilities for typography and layout one is used to
    from designing for paper. Another open-source solution, PNG tangbars, is not a
    viable alternative for sharing books.


    The main schism between PDF and HTML is that one represents the domain of print
    (easily portable, and with fixed size), while the other the domain of web (embedded
    within it hyperlinks pointing both directions, and with flexible page size). EPUB
    is developed with the intention of synthesizing both into a single format, but
    instead reduces them into a third container, which is doomed to reinvent the whole
    thing once again.


    It is unlikely that there will appear an ultimate converter between PDF and HTML,
    simply because of the specifics of print and the web and the fact that they overlap
