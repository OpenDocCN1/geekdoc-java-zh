  md: 'anthropologist Arjun Appadurai calls for a new way of thinking about archives:


    We should begin to see all documentation as intervention, and all archiving as
    part of some sort of collective project. Rather than being the tomb of the trace,
    the archive is more frequently the product of the anticipation of collective memory
    (Appadurai 2003,16).


    Indeed, it could be argued regardless of whether the archive is composed of print,
    photographs, film and/or digital media, the technologies used to organize, search
    and share documents have taken over the purview of the Focaultian state, with
    the crowd acting as the control mechanism. The new digital archives are increasingly
    flexible systems whose content is constantly recontextualised. So, even though
    the source may remain intact, as in the original archive, its existence is dynamic


    a free or open software licence requires the conservation of sources, the source
    code of a work is defined as modifiable textual representation. While film is
    a particular use and production of art, for instance software art, it is questionable
    whether this helps the conservation of artworks for the instrumentalization of
    software is articulated differently. Sole relying on the licence requirement is
    not enough. Mansoux clearly outlines, each work requires a different understanding
    of what source code is in order to make it truly accessible in the context of
    conservation.


