  md: 'levels demonstrates the extent to which the social network itself generates
    a parallel archive of movement recording the interactions of the networked itself,
    as a simultaneous—but exponentially bigger—living archive. This parallel archive
    may come to make correlations about ourselves which we are not yet aware (Hogan
    2015, 10).


    As the archive expands beyond the limits of human attention, the way in which
    users annotate and share mnemonic is a significant problem. Algorithms are being
    employed for tasks as varied as facial recognition in photo collections, aesthetic
    evaluation of snapshots, automated photo enhancement and the automated creation
    of digital family albums. Despite their goal to build intelligent machines for
    the management of the images, the field of informatics has not yet developed a
    perfectly accurate algorithmic means for approximating human vision. The development
    of computer vision is currently mitigated by a ‘semantic gap’ caused by the lack
    of similarity in the way in which humans and machines interpret these binary blobs
    of data. As a result, popular search engines have historically relied on the ability
    of their software spiders to harvest contextual text (metadata) rather than content
    to index images and videos.


    While user-generated tagging systems promise to bring some human order to material
    online, they cannot keep up with the expansion of the archive. As a result, paradigm
    of ‘browsing’ or ‘surfing’ hyperlinks is slowly being replaced by the search box
    which retrieves information from the archive. The search algorithm persists as
    a ‘PagerRank,’ and in work on mediated media theorist José van Dijk suggests that
    ‘the networked computer is a performative agent in the act of remembering in which
    the navigation of personal memory only highlights the processes of remembering
    but also allows the user to make connections that


