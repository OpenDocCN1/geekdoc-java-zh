  md: 'In 2013, the Mundaneum archive centre in Mons proudly announced that they were
    about to sign a collaboration agreement with Google. In the presence of Elio Di
    Rupo, then prime minister of Belgium, Paul Otlet was celebrated as ‘the man who
    dreamt up the internet and the Mundaneum website prominently featured an article
    that coined ‘Google on paper’, this only months after the company had opened a
    data-centre in the same Mons region (Djian 2009).


    The Mundaneum archive centre manages the heterogeneous collection of materials
    produced by the utopian documentist Paul Otlet (1868–1944) and pacifist statesman
    Henri La Fontaine (1854–1943). Named after their ambitious project to construct
    a world city of knowledge, the Mundaneum archive contains many different types
    of documents: personal correspondence, posters, glass-negatives, pamphlets, postcards,
    drawings, exhibition materials and thousands of index-cards that are grouped into
    different archives and collections as Paul Otlet’s personal papers, Archives and
    collection relating to anarchism. Archives and collection relating to pacifism.
    Archives and collection relating to feminism, the Iconographic collection and
    the International Newspaper Museum.¹ The walls of the exhibition spaces are decorated
    with hundreds of wooden drawers that contain remains of the Universal Bibliographic
    Repertory (RBU), millions of index cards produced by the International Institute
    of Bibliography (IIB). In their attempt to cross-reference all bibliographic knowledge
    in the world, Otlet and La Fontaine developed the Universal Decimal Classification
    system (UDC), a multi-dimensional version of the Dewey decimal system (Van den
    Heuvel 2008). In this way, the Mundaneum archive actually functions as an archive
    of, overlapping already classified material with a contemporary classification
    scheme.


    http://archives.mundaneum.org/en/collection.

    Accessed March 2017.


