    # Modes of Disposal


    The disenchanted discourse in collection-management policies affirms that disposal
    is an infrastructural condition of the archive, but it fails to address the affective
    work of disposal. Archival disposal is an emotionally charged symbolic act that
    connects—and ignites—a wide spectrum of cultural collations from political colonizations
    and oppressive social structures to questions of human (immortality and inclusion.
    Archival objects are affective objects; they enter collections not only through
    administrative valuation processes but also symbolic practices that cast archival
    objects as mere physical facts of printed paper; rather, archival objects come
    into being symbolic forms that represent a rich texture of political ideals such
    as enlightenment, education, transparency and accountability as well as complex
    psychological assessments of natality, mortality and infinity. It is no wonder,
    that, the destruction of them activates a cognitive register in the public.'
