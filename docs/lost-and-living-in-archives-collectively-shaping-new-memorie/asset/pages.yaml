  md: 'During the preparation of the thematic project Short Circuiting the Archive
    that I organized in 2015 for the PZI, I met Josien Pieterse (Framer Framed). In
    the past, Framer Had organized a number of projects on oral history and the practice
    of (online) archives, and seemed a good partner to involve in the programme. Josien
    proposed to discuss the role of oral history in the digital domain further with
    Stef Scagiola (who was a researcher at Erasmus University Rotterdam at the time).
    As our conversations progressed, we noticed similarities in our interests and
    decided to come together to further discuss the importance of oral history, its
    connection with living archives, and the influence of digital technologies on
    the practice and accessibility of its outcomes.


    Besides her activities with Framer Framed, Josien Pieterse, trained in Political
    Science and Gender Studies, has been working on oral history projects for the
    Atria Knowledge Institute for Emancipation and Women’s History for ten years.
    In 2007, Griet Keller and the director at the time Saskia Wering started the oral
    history archive on video. She has done projects on numerous topics, including
    the women’s health issues movement ‘Vrouwenverleningsbeweging’, feminists in the
    Church, the Communist Party of the Netherlands, the history of Stay Away from
    my Body (‘Blij van mijn lijf’), for victims of domestic violence), and abuse in
    the Roman Catholic Church.


    Stef Scagiola was trained as a historian in the Netherlands at the Erasmus University
    Rotterdam, where she conducted her PhD research on the discourse about Dutch war
    crimes committed during the Indonesian War of Independence from 1945 to 1949.
    This theme made her conscious of the importance and complexity of oral history
    sources, and led to the creation of the Dutch Veterans Interview Project for the
    Dutch Ministry of Defence. This was the first large-scale born-digital interview
    collection in the Netherlands, consisting of thousands of audio interviews with
    a representative number of Dutch veterans of war and military missions.'
