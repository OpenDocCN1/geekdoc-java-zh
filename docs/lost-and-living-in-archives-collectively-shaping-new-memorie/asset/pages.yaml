  md: 'Between 11 May and 16 June 2011. Slovenian artist Igor Šromajer literally deleted
    a number of his net art works produced between 1996 and 2007. Expunged one art
    project per day, permanently deleting it from his online server, so that the projects
    are no longer available at the Intima Virtual Base. He deleted 37 net works altogether,
    amounting to 3,288 files or 101.72 TB.


    Those of Šromajer''s projects that were not on the Intima Virtual Base online
    server at the time of expuncation but are permanently loaded on the servers of
    the galleries and museums that have acquired them through purchases or donations
    (Centre Pompidou in Paris, Ares Electronica Lab in Linz, Computer Fine Arts Gallery
    in New York, MNCA Reina Sofia in Madrid, were (and still are) inaccessible to
    the artist for deletion.


    Expuncion breaches the questions of temporality, duration, archiving, and accessibility
    of (net) art works that automatically change over time as the hardware and software
    change (browsers, players, applications etc.), slowly but inexorably losing their
    functionality and consequently their content. The artist''s basic premise in this
    project was whoever creates, programs, and copies art is also entitled to deprogram,
    deconstruct, but not an act of violence or destruction, rather the observation
    of the natural rhythm of birth, life, and death, cyclically repeated and oscillating
    in natural amplitudes. A Šromajer has erased history, including his own personal
    history, believes that our memory serves to deceive, to betray us, to misrepresent
    rather than paint and describe the past. A deceptive memory can be erased without
    quals, for it does not offer an authentic image of the past which it speaks, but
    always a deceptive, fraudulent, fabricated, and distorted image. For this reason
    the deleted works or their remaining fragments, undeletable once they have been
    made publicly accessible since the World Web is so widely spread and fragmentary,
    tell us more about


    Igor Šromajer: www.intima.org/expuncion,1996-2011


    ![](img/f9e04f352b29e5fc3f1a0eb63b48c3e7_160_0.png)'
