  md: 'open-access web-based archives arguably maintain some semblance of neutrality
    or openness, but even in these cases, the cost of access to works can be prohibitive.


    In 2001, the passing of the PATRIOT Act threatened the constitutional rights and
    privacy of all Americans, and in particular of library users. librarians organized
    under the American Library Association, to defend readers'' civil liberties against
    unwarranted intrusion. Passing to the electronic online library provided by Google,
    or via a device such as an Amazon Kindle, a similar defence cannot be easily mounted.
    In fact, unless readers take steps to anonymize themselves, their reading habits
    are being shared with interested parties, and in greater detail than they might
    imagine possible.


    With the ''algorithmic turn—towards a society under automatic management, with
    an urban fabric pervaded by computing—archive and network draw ever closer, and
    the role and identity of the archivist changes too. Traditionally, archivists
    acted as guardians and keepers of a collection, cataloguing and managing the rights
    of third party creators as necessary. Today''s automated network-archivists instead
    collect and trade in user behaviour.


    Acts of reading, viewing, and so on create what the more profitable commodity:
    user metadata. The archive of interest to users (a repository of books or films,
    for example) is not the same as that of interest to the automated archivist. And
    the value of the archive *per se* has manifestly shifted from its being a bridge
    to the past, to its becoming a tool for predicting the future.'
