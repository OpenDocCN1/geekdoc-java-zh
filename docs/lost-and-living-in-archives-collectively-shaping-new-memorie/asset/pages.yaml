  md: '# Black Culture


    I open my web browser and type in ''google.com''. I am redirected to google.nl
    and the interface appears in Dutch. At the top corner of the screen I see my first
    name and the image once set up to my ''avatar'' for a service called ''google
    plus''. I select ''log out'', click ''Google gebruiken'' and the interface changes
    into English. At the top right. I begin to type the word ''culture'' in the search
    box; as I type each letter, a stream of suggestions appears below my text. C:
    cat, cricket score, cars, calendar 2016, couple sleeping positions and what they
    mean. CU: cute puppies, cute quotes, cute animals, cute baby, cubs. CUL: culottes,
    culture, culture club, cult, cult de sac. I click ''culture'' and the page reloads
    with a grid of images.


    ![](img/f9e04f352b29e5fc3f1a0eb63b48c3e7_64_0.png)


    At the top of the results is a special row of images appearing together with texts
    below: ''Diversity''. The Word, ''Different'', ''World'', ''American'', and ''Traits''.
    Below, eleven images are shown in two rows, underneath which results lie in wait
    of scrolling. Of the seventeen images on the screen, six have the word ''culture''
    legible within them. Five of the images contain a circular depiction of the globe
    showing North and South America and a slice of the African continent. In of these
    images, the globe is surrounded by symbols representing people in a rainbow palette
    of colours. Six of the images contain multiple images of national flags. Nearly
    all the images appear on a white background.


    Above the grid are row of clickable links indicating different modes of search:
    All, Images (the mode now active), News, Books, Videos, and Search tools. Clicking
    on Search tools reveals a second row of options to images: Size, Colour, Type,
    Time, Usage rights, and More tools. Clicking Type reveals sub-items like Photo,
    Clip art, and Line drawing. Clicking on Colour opens a selection panel with options
    Any colour (active), Full colour, Black and white, Transparent and a 4:3 grid
    of colour switches (red, orange, yellow, green, etc.). I select the switch depicting
    colour'
