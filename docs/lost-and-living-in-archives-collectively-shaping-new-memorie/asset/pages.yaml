  md: '# MAKING PUBLIC SERIES


    The series ‘Making Public’ investigates the ‘public’, the civil domain where space,
    knowledge, values and commodities are shared. What does this notion of ‘public’
    mean? How does this domain change under the influence of social, political and
    technological tendencies? Where are the boundaries of ‘public’ and how are they
    determined? What forms of responsibility and solidarity the ‘public’ invoke? And
    how do artists and culture shape the debate on these issues?


    The series is initiated and edited by Valiz, Pol Ai, Astrid Vostersmans and Sarah
    van Binsberg.


    The series is designed by Template, Marlon Harder & Lasse van den Bosch Christensen,
    template.info.


    2017: Authenticity?: Observations and Artistic Strategies in the Digital-Age

    Barbara Cueto


    Contributors: Erika Balsom, Franco ‘Bifo’ Berardi, Jazmina Figueroa, Bas Hendrikx
    & Barbara Cueto, Holly Herndon & Jazmina Figueroa, Oliver Laric, Vermeulen, Robning,
    David Joseph, Oliver Laric, Timotheus Vermeulen.


    Ben Wagner

    With Impact Foundation, ISBN 978-4-92095-23-7


    2017: Being Public: How Art Create the Public

    Jeroen Boomgaard, Rogier Brom (eds.)


    Contributors: Barbara Alves, Jeroen Boomgaard, Rogier Brom, Anke Coumans, Florian
    Cramer, Eva Fotiadi, Maike Lauwaert, Gabriel Leister, Steven van Thijje


    With LAPS / Rietveld Academic, ISBN 978-4-92095-28-2


    2017: Compass: A Paradox in Art and Society

    Jeroen Boomgaard, Rini Hurmans, Judith Westerveld (eds.)


    Contributors: Jesse Ahlers, Nick Aikens, Sarah van Binsberg, Jeroen Boomgaard,
    Pascal Gielen, Rini Hurmans, Stefan Newman, Leonhard de Perpe, Judith Westerveld


    With LAPS / Rietveld Academic, ISBN 978-4-92095-29-9


