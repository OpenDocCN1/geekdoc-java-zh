  md: 'The free web hosting service Geocities was founded by Beverly Hills in July
    1995, which exactly corresponds with the moment that the web left academia and
    started to become accessible to everyone. Users began learning Hyper Text Markup
    Language, and welcomed each other onto their ‘home pages’—the first personal websites.


    Geocities soon emerged as one of the most popular and inhabited places on the
    web and remained until the late 1990s. Yahoo! purchased it in January 1999, at
    the peak of dot com fever.


    In the new millennium, Geocities proved to be a bad investment for Yahoo!. Having
    Geocities page basically synonymous with dilettantism and taste, the days of home
    pages were numbered as people drifted to social network profiles.


    Ten years later, in April 2009, Yahoo! announced that it was shutting down Geocities.


    On 26 October 2009, Geocities ceased to exist. But during the time between the
    announcement in April and its official death notice, a group of people themselves
    the Archive Team managed to rescue almost a terabyte of Geocities pages. On 26
    October 2010, marking the anniversary of this Digital Massacre, the Archive Team
    started to seed geocities.archivteam.torrent²


    1

    For more information-see. http://archivteam.org. Accessed 10 May 2016.


    2

    The original torrent is available at The Pirate Bay. https://thepiratebay.se/torrent/5923737/Geocities_The.torrent.
    Accessed 10 May 2016.


    On 1 November 2010, my partner Dragan Espionage and I bought a 2-TB disk and started
    downloading the largest Torrent file of all. In January 2011, we were able to
