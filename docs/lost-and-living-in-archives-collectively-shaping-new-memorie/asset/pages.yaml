  md: 'killing them was an act of love, an act of mercy. Besides that, deleting them
    was as much fun as creating them: both processes are actually very similar, emotional
    and intense, just that the first one, the one that creates them, goes in one,
    and the one that deletes them, in the opposite direction. But artististically,
    creating and destroying is the same thing. To be honest, deleting and deconstructing
    the works was even more intense: in just thirty-seven days, I went through a reversed
    programming process, which originally took me eleven years to complete (1996-2007).
    A wonderful experience, I admit.


    There were also a few technical things that made me think about the deletion even
    before 2001. For example, the we browsers were showing the source code was changing
    rapidly, and at, end, the visitor what saw in what I originally programmed. Which
    is fine, it also raised lots of interesting question at that time, like the autonomy
    of the machine, the interpretation of the code, translation from one computer
    language into another, the translation from one computer language into another,
    the actual authorship, etc., but on the other hand, all these technicalities did
    not have much to do with what the works were initially created for. And to keep
    my mind clean, I decided to ritually kill all of them.


    Another important factor that contributed to my decision was a political one.
    In 1995, when I started to work online, the internet was a free space, full of
    potential, it was the most open and democratic platform ever created. It appeared
    that way. We were all impressed by the freedom the internet was offering, by the
    possibilities of having free exchange of information, art, and opinions. Those
    were the golden times of direct online democracy. Everything was possible. It
    was shortly after the fall of the Berlin Wall, the East was celebrating, and optimism
    was all around us. Then, slowly but surely, year by year, the internet became
