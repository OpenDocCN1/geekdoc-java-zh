  md: '# Digital Space is the Public Space


    Urban space no longer refers to where we live and work; it is the space where
    the social and political are constantly reproduced. Urban justice movements are
    becoming more vital than ever in cities and conflicted geographies where any citizen
    can participate/through different actions with several abilities in their everyday
    life. We now live in a technological and digital age where image making and moving
    editing are not only accessible by any citizen but also have the potential to
    claim the future imagination regarding social and political co-existences. iPads,
    iPhones, and handy cheap digital HD cameras enable us to become part of the ''event''
    where social and political rupture happen in our society and cities.


    In this context, bak.ma aims to reveal the recent history of Turkey by means of
    audio-visual recordings, documents and testimonies. The content of the archive
    is being extended to include and involve visual data of other movements such as
    TEKEL (tobacco) workers'' resistance in 2009-2010. May days, workers marches from
    1977 until now, feminist and LGBTI movements, ecology movements, and specific
    demonstrations, events, meetings, talks, and interviews.


    The platform is for everyone to use and by using the software pan/do.ra. bak.ma
    has a special categorization that can be organized by topic, date, name, time
    of the day or location and that can be controlled by any of its members.


    ![](img/f9e04f352b29e5fc3f1a0eb63b48c3e7_238_0.png)'
