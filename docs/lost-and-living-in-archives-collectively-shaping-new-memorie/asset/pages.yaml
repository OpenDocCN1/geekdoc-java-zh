    As the archive is reconfigured as a database with a search field, it is significant
    to consider the way in which the search algorithm moderates these connections.
    For the archive, this shift means there is a permanent emphasis on transfer, rather
    than storage (Ernst 2013, 202), in which memory is ''collectively (re)constructed
    (and recon-textualized) in the present rather than collected and preserved from
    the past'' (Hogan, 2015, 10).


    # New Practices: the Anti-Archive and the Erasable Web


    Against this backdrop, apps such as Snapchat are at the vanguard of what is called
    ''the erasable web—new attitude emerging from Silicon Valley that self-consciously
    rejects the public aggregation of personal media in favour of ephemerality, erasure
    and immediacy. The problem, is that ''technology companies view movies, music,
    and television as INFORMATION. Snapchat''s CEO Evan Spiegel describes it, as directors,
    producers, musicians, and actors view them as feelings, as expression. Not to
    be searched, sorted, and viewed—EXPERIENCED'' (Spiegel 2014).


    For Spiegel, Snapchat offers a radical break with the archival paradigm of Web
    2.0: since each message self-destructs on viewing, it cannot be instrumentalized
    as more data—it can only be experienced. Additionally, because each video, image
    or text has a limited life-span on Snapchat, it intensifies the moment of viewing
    and its affective potential. The knowledge that an image disappears mimics real
    life: moments and go, like memories, or like a ghost (Snapchat''s icon). And imperfection
    rather than perfection can be embraced.


    Or. Spiegel argues:


    Traditional social media required that we live experiences in the offline world,
    record those experiences, and then post them online to recreate the experience
    and talk about it . . This traditional social media view'
  merge: -1
  pgno: 35
- img_proc: true
  md: 'of identity is actually quite radical: you are the sum of your published experience.
    Otherwise known as: pics or it didn''t happen. Or in the case of Instagram: beautiful
    pics or it didn''t happen AND you''re not cool.


    This notion of a profile made a lot of sense in the binary experience of online
    and offline. It was designed to recreate who I am online so that people could
    interact with me even if I wasn''t logged on at that particular moment (Spiegel
    2014).


    With the relentless aggregation of images, videos and texts, which are publicly
    shared and mined as your ''profile'' Snapchat offers the illusion of self-destruction,
    and represents a shift away from archiving yourself in real time to expressing
    yourself in real time. For Spiegel, the authenticity of the disappearing snaps
    in direct contrast with the polished and contrived Instagram feed. Without an
    archive or profile to maintain, the user of Snapchat is (allegedly) free to be
    their ''authentic'' self. As sociologist Nathan Jurgenson suggests, Snapchat''s
    photos are


    not made to be collected or archived, they are elusive, resisting other muse gestures
    of systemization and taxonomy, the modern impulse to classify life the present
    where you found, temporary photographs feel more like life and less its collection
    (Jurgenson 2013).


    This does not diminish the value of memory, as Jurgenson argues, rather Snapchat
    ''inspires'' welcomes the possibility of forgetting. Ten seconds or less, sharpens
    the focus on the message—in parallel, many performers reject the possibility of
    any kind of documentation.


    The discourse around documentation of live performances is strong: one of the
    main contestants of any form of documentation is Phelan 1993.


    In the age of surveillance and data mining, Snapchat'
  merge: -1
