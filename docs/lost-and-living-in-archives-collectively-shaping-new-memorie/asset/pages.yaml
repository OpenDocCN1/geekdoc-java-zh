  md: 'trusted to share their life, their tastes, preferences. Because the archival
    web relies on user information being captured, saved and sold to marketers, mined
    for statistical info, the user must be rendered visible and transparent. Paradoxically,
    even as the user is encouraged to upload, annotate, update and maintain their
    online profile to achieve visibility in these systems, the actual value or visibility
    of the individual tweet, photo or snap is diminished.


    An interesting example of the financial shift that has commodified these archives
    is the recent deal made with Getty Images. In 2013, both parties agreed that Pinterest
    would pay Getty Images for their images in return for their image metadata. The
    second-best referrer of traffic on the internet after Facebook, Pinterest''s choice
    makes sense from a commercial point of view; and advertising metadata will boost
    their traffic, and hence advertising income. Getty Images on the other hand has
    little to gain from this traffic, but they say to share the fee with the copyright
    holders of their contributors. Not only is this an interesting turn into licensing,
    but more importantly it signals the shift from interest in content (images, videos,
    audio) to metadata. This shift is further emphasized by Getty Images'' decision
    to make 30 million of their images available for free—as long as users embed them
    using Getty''s custom player. This ensures the automated crediting of images and,
    more importantly, it provides accurate data about how people are using their images:
    enhancing the company''s ability to track consumer behaviour and react quickly
    to trends.


    For more information see: http://press.gettyimages.com/gettyimages-partners-with-pinterest/.
    Accessed September 2016.


    For more information see: Cookson 2014.


    # The Algorithm, Computer Vision and Memory


    The problem with [Facebook''s Graph search] is that aggregation says more about
    us than we do consciously know we are making available. Tracking at all these'
