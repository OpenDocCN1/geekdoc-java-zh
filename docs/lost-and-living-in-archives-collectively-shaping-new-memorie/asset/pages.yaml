    # Interrogating the Archive


    Research to identify possible source materials for Dreams Rewired spanned ten
    years, and invited visits to archives around the world, discussions with historians
    and theorists, and consulting indexes and other literature. The sifting through
    hundreds of hours of material to discover cover keys, and the hunt for films known
    to have once existed, were relatively straightforward compared to the work of
    seeking out the appropriate rights-holders and negotiating a licence. The archive
    that had a particular source was identified—not always an easy task—and a viewing
    copy obtained (or a visit undertaken), it was necessary to identify the holder
    of exploitation rights in the material. On occasion, this would be the owner of
    the physical media, often it was another party unrelated to the archive, some
    works in the public domain, and some works were ‘orphans’—without any known claims.
    When a work existed in several versions or in several media, the issues were further
    complicated.


    Orphan works can be quoted provided that an adequate effort has been made to locate
    any claims, and that a future claim by a rights-holder emerges is insured against.


    In follows, the force and constraints that determined access to source material
    during the making of Dreams Rewired, and suggest that useful analogies can be
    drawn between the struggles depicted within the film or the struggles to obtain
    source material, and the struggles over ownership and control of data in our user-generated
    archive.


    The examples below were collated through discussion with Martin Repka, post-production
    manager, Carla Zamora, of the team''s archival researchers, and Mukul Patel, UK
    producer.


