    # # 6. Chasing the Tail


    As the rights researcher for Dreams Rewired found, rights clearance becomes particularly
    arduous after the death of the director, upon which the copyright for the subsequent
    seventy years is transferred via inheritance. How, in such cases, does one go
    about the rights-holder, who might have no interest in the director''s estate?


    Seeking the works of one particular avant-garde director of abstract films, the
    researcher obtained contact details of a remote relative from an archive, but
    received no response by phone or email. Subsequently, on consultation, several
    other archivists maintained that this relic had died. After weeks of investigation,
    the woman in question was finally located-alive, and willing to issue a licence.


    A similarly situated arose in the case of the classic René Clair film Paris qui
    dort (1925). The likely rights-holder had been identified as Clair''s son, but
    he had not responded to any emails. Around that time, the researcher was also
    awaiting response from the LightCone archive the rights for Henri Chomette''s
    Jeux des reflets de la vitesse (1925). LightCone explained that the month-long
    delay was due to the current rights-holder rather old and hard to reach. It was
    then that I recalled that “René Clair” was the nom de plume of a certain René-Lucien
