    # Collective Memory


    In many ways, the Gezi Park protests were an unprecedented social uprising, not
    only due to the heterogeneity of the protesters and actors involved, and their
    ways of acting, which created collaboration and solidarity, but also due to the
    extensive use of all kinds of new media that led to a proliferation of audio-visual
    and written materials being produced and shared in social media platforms. In
    a process where what is happening on the streets has no'
  merge: -1
  pgno: 231
- img_proc: true
  md: 'exposure in mass media at all or is completely manipulated or distorted, to
    think about and investigate the questions of collective memory becomes indispensable.
    At this point, a digital media archive as a tool de mémoire that gathers what
    would otherwise be forgotten, distorted or intentionally erased from the social
    memory. It also allows us to question what is visible and hidden and creates a
    space of collective investigation and creation based on the material available.


    Within the wider scope of an online media platform focusing on social and political
    movements in Turkey, it was meaningful to start with Videocupy''s video archive
    Gezi and immediately create an open-access online visual memory platform just
    after the protests. https://bak.ma emerged from these discussions. The social
    and political agenda has always been very lively and protests against all forms
    of authoritarian governance and repression have been going on in different ways
    and forms. bak.ma has the potential to establish connections between the past,
    the recent past and the future, with both regard to and upcoming movements. The
    significance of this archive stems from its potential as a resourceful platform
    and a space of memory, which paved the way for new ways of thinking through the
    visual material.


    # Normal Citizens Get Lost!


    Moving away from traditional state archives and their authoritarian methods, bak.ma
    is an attempt to create new means for archiving images. In Turkish, the word ''bakma''
    means ''don''t look'', and the name ''bak.ma'' is also inspired by a quote in
    an article written by Cypriot thinkerhus S. Baker discusses ''seeing'' as an emancipatory
    act, and he chooses a very specific moment, which happened in 1995 during the
    protests against F-type prisons in Ankara:


    > ''Normal Citizens Get Lost''... an announcement by the police could be heard
    in the centre of Ankara.'
  merge: -1
  pgno: 232
- img_proc: true
  md: 'Citizens who are not ''normal'' should probably be the ones who were to be
    surrounded by the police force and the tanks ready to spray water. The state''s
    desire is definitely to make them ''disappear'' (this doesn''t need a special
    ability) and disperse as soon as possible. However, for the first time, we are
    learning through a police announcement to ''normal'' citizens that people must
    ''get lost'', ''scatter'', as they suddenly disappear from the busiest squares
    and streets in the city. ''Don''t look!'' Another police announcement, just like
    ''Get lost!'' command, ringing in the ears... ''Don''t look!'', this command shows
    a distinction between ''to look'' and ''to see'' a special talent of human beings...
    It is as if human beings truly a talent to everything, with countless eyes (like
    the bees) if they were not looking and it is inevitable... (Baker 1996).


    As such, bak.ma is about looking: looking in different ways and different perspectives.
    One year after Gezi, the bak.ma digital media archive of social movements was
    accessible, following lengthy discussions about the collected visual data. It
    can be seen as an autonomous archival initiative.


    The autonomous archive refers to Lawrence Liang, legal researcher, lawyer and
    member of pad.ma. He argued, ''as a particular form, state archives do not exhaust
    the concept of the archive.'' He continued that


    The task of creating an archive is not to replicate nor to mimic state archives
    but to critically produce a concept of the archive. An archive actively creates
