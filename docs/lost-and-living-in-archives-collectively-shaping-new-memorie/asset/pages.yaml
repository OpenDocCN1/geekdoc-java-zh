    Meritis and TUMULT, and was president of the Dutch Association of Debate Centers
    (VND). In 2009, she co-founded Framer, a platform for contemporary art, visual
    culture, and critical theory & practice. From 2009-2011 she served as coordinator
    of the Forum for Democratic Development (FDO) and in 2011 she co-founded Network
    Democracy, a platform for democratic innovation. In 2014, Pieterse received the
