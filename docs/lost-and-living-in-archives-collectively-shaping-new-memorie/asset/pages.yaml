- img_proc: true
  md: 'and its peers are heralded as being about ‘taking control of your digital self’
    (Gillette 2013). Snapchat has built its audience and business by exploiting a
    desire for the anti-archival, the ephemeral. However, there is little to no economic
    model to support the anti-archival web in the server farm age. Initially, Snapchat
    was able to grow because of its low server load, but the emergence of new features
    such as ‘memories’ to archive the ephemeral content, reflect a retreat into the
    older archival forms of social media more amenable to marketing and tracking.
    While there is a strong urge for ‘forgetting’ (Mayer-Schönberberger 2009) and
    ‘whitewalling’ (boyd 2014), for now, economics rules over authenticity and ephemerality.


    # Remember to Forget Everything


    Information scientist, Geoffrey Bowker suggests we live in an ‘epoch of potential
    memory’ which ‘narrative remembering is a post hoc reconstruction from an ordered,
    classified set of facts which have been scattered over physical data collections’
    (Bowker 2005, 30). As narrative remembering becomes constituted through the performance
    of software it becomes linked to the discourse of informatics and knowledge management.
    The relational database has become a convenient site from which information can
    be stored, analysed and transmitted, feeding off the data it accumulates in order
    to develop new categories, relationships and knowledge. As the archive is re-invented
    as the ‘cloud’, ‘digital memories’ are not just vaporous, immaterial, streams
    of data—but as data which is embedded in the material structures of hardware and
    software.


    In the process of outsourcing the function of ‘seeing’ and ‘recalling’ to machines,
    there emerges a desire for memory which is both automated and passive. The modularity
    and flexibility of media creates the possibility of an ‘algorithmic memory’: an
    increasingly intelligent self-organizing extensible memory which can circulate
    independently of human'
