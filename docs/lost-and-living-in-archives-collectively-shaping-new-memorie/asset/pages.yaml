  md: 'DUŠAN BAROK (born 1979) is an artist, writer and founding editor of Monosk.
    He is currently a research fellow at the University of Amsterdam focusing on the
    documentation of contemporary arts. He graduated in Information Technologies from
    the University of Economics, Bratislava, and Networked Media from the Piet Zwart
    Institute, Rotterdam. Recently he organized and convened the series of seminars
    on modern aesthetics *The Extensions of Many* (with Bergen Center for Electronic
    Arts, 2015) and the symposium on documentation science and the legacy of Paul
    Otlet, *Ideographies of Knowledge (with Barbora Šěvíá)* held at Mundaneum, Mons
    (2015). Barak lives and works in Amsterdam.


    TINA BASTAJIAN (born 1962) is a media-artist and researcher and teaches documentary
    film at Amsterdam University, as well as leading thematic modules at the Piet
    Zwart Institute. Her work uses experimental approaches to documentary forms to
    explore themes of (counter) memory, palimpsest, erasure, intersubstantiality,
    and the contours of view and translation. Recent publications include: ''In and
    About Filmmadaran In No Particular Order'' in *Archives of Disobedience: Changing
    Tactics of Visual Culture in Eastern Europe* (2016). Currently, she is in post-production
    on a film essay inspired by this text that expands on the notion of archival aias.
    Bastajian lives and works in Amsterdam.


    NANNA BONDE THYLSTR works on the politics of digitization, the uncertainty of
    archival constructions and the epistemology of algorithms. She holds a PhD (2014)
    with a dissertation on the politics of mass digitization of cultural memory objects,
    in which she discussed the changing paradigms of cultural memory politics as it
    enters the digital environment. In her current research, Thylstrup examines big
    data environments through cultural theories of the archive and how big data creates
    new regimes of interaction and interpretation. And she is in particular interested
    in how data regimes'
  merge: -1
  pgno: 264
- img_proc: true
  md: 'create new cultural techniques of archiving, regulating, interpreting and retrieving.


    ÖGE ÇELIKASAN (born 1979) is an artist and video artist and activist. She is the
    co-founder and member of video artist. Her research as a PhD scholar focuses on
    the autonomous media archives. Since 2013, she has been working on the bak.ma
    open digital media archive of social movements in Turkey. Personally and with
    the Artikler collective, she has been involved in numerous solo and mixed exhibitions/biennials
    worldwide. She has co-edited the books Autonomous Archiving (2016) and Surplus
    of Istanbul (2014) with Alper Şen and Pelin Tan. Çelaslan lives and works in Ankara.


    ANNET DEKKER is a researcher, curator and writer. She is currently Assistant Professor
    Professor Media Studies: Archival and Information Studies at the University of
    Amsterdam, Visiting Professor and co-director of the Centre for the Study of the
    Networked Image at London South Bank University. She is interested in the influence
    of technology, science and popular culture at art and versa. Recent exhibitions
    include ‘How Much Of Is Fiction’ (co-curated with David Garcia and i.cw. Ian Alan
    Paul) at Framer Amsterdam, FACT Liverpool and H3K Basel, and ‘Algorithmic Rubbish:
    Daring to Defy Misfortune’, SMBA, Amsterdam (2015). Recent publications include
