  md: 'collaboration with our contributors and even our readers.


    # AD


    With Pages you tried to connect different worlds and disciplines while discussing
    specific topics, in what way will that strategy come back into the online archive?


    # BA & NT


    One of the characteristics of the magazine is indeed its eclectic selection of
    archival and original material which are edited around specific topics. We always
    try to keep an organic relationship between the materials and the topics.


    The ongoing exchanges we have with our authors feed back into the editing orientation
    of the issues. These processes are inevitably left out of the final print. Readers
    only sense its outcome. In the new online platform we want the thematic focus
    to be even less predefined, so that the interconnections between the various materials
    is something that is open and traceable by our readers. The emphasis is instead
    placed on individual contributions and their long-term progression through the
    website—the editorial direction will evolve along the lines of these single progressing
    materials. So for a large part it is the structural approach in the editing that
    defines the themes.


    # AD


    Could you explain in slightly more technical detail how you''re making the connections
    between the different articles, people and projects, so that they become networked?


    # BA & NT


    It is difficult at this stage to predict exactly how a network will evolve from
    the project or to fully understand the ''real'' effects of it. But we would like
    to see it as something that is sustainable not through permanence but through
    volatility (or permeability, to refer to the project''s working title). Everything
    that is online is always susceptible to appropriation along different lines and
    by different actors (authors and readers). As an example, the website facilitates
    the authors to directly upload and re-edit their contributions at any given time.
    Then there are additional research'
