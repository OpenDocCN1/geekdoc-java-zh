  md: '''What is archive?'' is one of the standard questions when discussing archives
    and it solicits several answers, ranging from the physical building or location,
    to the gathering of documents in these spaces, or the more conceptual response
    of process-bound information that refers to the way documents (or records) are
    created, structured and recorded as part of working processes and by which they
    can be queried and probed (Horsman 2009). Others exist, but depending on the different
    purposes and functions of an institution, in general archives are defined in relation
    to their context. However, as Michel Foucault expressed, an archive cannot be
    described from within or in its totality, rather ''it emerges in fragments, regions
    and levels'' (Foucault 2010, 130). It is from these different fragments, regions
    and levels that the authors in this publication describe archival practices.


    Archives have always been subjected to fragmentation, even those that are regulated
    by law. A document in an archive can change location, recontextualized and at
    destroyed in preference of another document, thus fracturing a once neatly organized
    working process. As such, no archive is entirely stable or fixed. However, digital
    documents have increased the fragmentary nature of archives. Whereas in the paper
    archive, documents and the archival administrative system are clearly divided,
    with digital archives, documents and contents are no longer separated from the'
