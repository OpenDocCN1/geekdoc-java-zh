- img_proc: true
  md: 'A significant consequence of the database-driven web is its dependence on highly
    efficient and scalable computing platforms—Facebook’s infrastructure alone serve
    up to 600,000 images per second. The enterprise data centre or server farm has
    emerged as the contemporary arkheion of


    Derida’s d''Archive: a facility for housing thousands of concatenated servers.
    With each site the size of a football pitch and costing anywhere up to $2 billion,
    these air-conditioned bunkers must be strategically located near cheap, abundant
    electricity; their location is often shrouded with secrecy and highly restricted
    (Markoff and Hansel 2006). And as the paradigm of ''cloud computing'' increasingly
    defines the web, these information warehouses are being re-branded as ''cloudings''
    in which users can relocate their archives to the Google grid for ubiquitous access.


    For more information see, for example, Hogan 2015 who discusses the impact and
    placement of data centres, and Dourish 2014 on the materials of database technologies.


    When the collection and distribution of media becomes the collection and distribution
    of data, our photographs, videos and texts become subject to the economics of
    information production and knowledge management. The database and its attendant
    technologies (SQL/XML) is also product of what humans Alan Liu describes as ‘the
    new discourse paradigm’ which values ‘the ability to say anything to quickly’
    (Liu 2008, 211). Liu’s work is significant in identifying the ways in which the
    development of such standards is informed by the need to make communication as
    post-industially efficient as possible to allow knowledge move seamlessly from
    print, to web or mobile devices. As Liu observes, the demand that discourse becomes
    transformable, autonomously mobile and automated is necessary so that ‘a proliferating
    population of machine servers, databases, and client programs can participate
    as cyborg agents and concatenated Web servers facilitating the processing and
    reprocessing of knowledge’ (Liu 2008, 216).


    XML is a set of rules for encoding elements electronically and provides a standard
    through which disparate data sources (especially from databases) can be structured
    and read Liu 2008. 211.


    Another consequence of standards such as XML is the separation of data from its
    presentation, which contributes


    LOST AND LIVING (IN) ARCHIVES'
  merge: -1
  pgno: 30
- img_proc: true
  md: 'to the mobility of contemporary media and its modularity. Digital media can
    be processed and circulated increasingly without human intervention: images and
    texts can be rapidly decontextualized and recontextualized onto different software
    and hardware. The GPS in your camera will encode each snapshot of capture, your
    calendar will sync up and confirm the context of your location, a face recognition
    algorithm will identify and tag the people in the frame before uploading to Flickr.
    From there it might be instantly syndicated into the sidebars of blogs or broadcast
    via RSS to the wireless photo frame sitting on your mother''s mantelpiece seconds
    after capture.


    With the post-industrial processing of social media, today''s web is not only
    ''real time'' but also more enclosed, searchable and trackable. While there is
    concern over the control and long-term preservation of these user-generated multimedia
    archive—broken links, lost webpages, searchable content—there is an increasing
    sense, that ''the Internet never forgets'' (Turkle 2011, 260). The ubiquity of
    digital storage now means it requires more energy to delete rather than save—Google
    has removed the button to ''delete'' mail in its mobile Gmail app in favour of
    an ''archive'' button. However, the difference now is that data is not just archived:
    it is automatically (and opautely) analyzed and shared.


    # The Archive as Commodity


    Whilst database-driven websites are certainly not new, they have emerged as a
    critical component to the financial success of contemporary social media. In his
    2004 article outlining the Web 2.0 paradigm, entrepreneur Tim O''Reilly observed
    that ''control over the database has led to market control and oversized financial
    returns'' (O''Reilly 2005, 3). O''Reilly emphasizes this in his following advice
    to developers:


    It''s no longer enough to know how to build a data'
  merge: -1
  pgno: 31
- img_proc: true
  md: 'base-backed web site. If you want to succeed, you need to know how to mine
    the data that users are adding, both explicitly and as a side-effect of their
    activity on your site (O''Reilly 2007).


    With greater centralization the need for greater computational power and an economic
    strategy to sustain it. The business model that has emerged become fetishized
    by Silicon Valley relies on the extraction of value from ever greater volumes
    of data. By evaluating the comments, clicks, tags, and other content in their
    databases, companies such as Yahoo, Facebook and Google are able to develop the
    intelligence of their algorithms and generate wealth from highly targeted advertising.
    Next to the impact of archives on collective memory and human identity, participation
    in the digital age generates another kind of memory—a ‘data shadow’, which is
    collected in exchange for free to access these platforms. The data mining of our
    global market not only contributes to the commodification of digital memory, but
    forms parts of an economy of association in which transversing the data-base is
    mediated by recommender systems which lead us towards certain content above.


    Ontologically, the effects of these algorithms are withdrawn from discursive action
    in the interests of protecting a company’s intellectual property. For example,
    in 2007 Yahoo uses to evaluate the quality of photographs to draw attention towards
    exceptional images from its database. Here commenting, favouriting and some ‘secret
    sauce’ contribute to the weighting of each image. Like Google’s PageRank algorithm,
    its nature is kept secret to prevent users from ‘gaming’ the system to rank higher
    in search results. While the algorithm remains hidden, the user is not afforded
    the same treatment. The authentication of real names and identities is now enforced
    across platforms a user can be


