  md: 'Dušan Barok is an artist, writer, and cultural activist involved in critical
    practice in the fields of software, art, and theory. After founding and organizing
    the online culture portal Koridor in Slovakia from 1999–2002, in 2003 he co-founded
    the BURUNDI media lab where he organized the Translab evening series. A year later,
    the first ideas about building an online platform for texts and media Monosk began
    to emerge and became reality. After a decade later, Barok is well-known as the
    main editor of Monosk. In 2016, he began a PhD research project at the University
    of Amsterdam. His project, titled Database for the Documentation of Contemporary
    Art, investigates art databases as discursive platforms that provide context for
    artworks. In an extended email exchange, we discuss the possibilities and restraints
    of an online ''archive''.


    ANNET DEKKER


    You started Monosk in 2004, already some time ago. What does the name mean?


    DUŠAN BAROK


    ''Monosk'' is the Slovak equivalent of the English ''monoscope'', which means
    an electric tube used in analogue TV broadcasting to produce images of test cards,
    station logo-types, error messages also for calibrating cameras. Monoscopes were
    automated television announcers designed to speak to live and machine audiences
    the status of a channel, broadcasting purely phatic messages.


    AD


    Can you explain why you wanted to do the project and how it developed to what
    it is now? In other words, what were your main aims and have they changed? If
    so, in which direction and what caused these changes?


    DB


    I began Monosk as one of the strands of the BURUNDI media lab in Bratislava. Originally,
    it was designed as a website for documenting media art and culture in the east-part
    of Europe, whose backbone consisted of entity composed of links to separate pages
    about various events,'
  merge: -1
  pgno: 176
- img_proc: true
  md: 'initiatives, and individuals. In the early days it was modelled on Wikipedia
    (which had been running for two years when Monoskop started) and contained biographies
    and descriptions from a kind of neutral point of view. Over the geographic and
    thematic boundaries gradually expanded to embrace the arts and humanities in their
    widest sense, focusing primarily on lesser-known phenomena. Perhaps the biggest
    change is the ongoing shift from mapping people, events, and places towards synthesizing
    discourses.


    See for example https://monoskop.org/Features. Accessed 28 May 2016.


    A turning point occurred during my studies at the Piet Zwart Institute, in 2010–2012,
    which combined art, design, software, and theory with support in the philosophy
    of open source and prototyping. While there I was researching aspects of the networked
    condition and how it transforms knowledge, sociality and economics: I wrote research
    papers on leaking as a technique of knowledge production, a critique of the social
    graph, and on libertarian values embraced in the design of digital currencies.
    When Aymeric Mansoux, one of the tutors, encouraged me to develop my side-project
    Monoskop into a graduation work, the timing was good.


    The website got its own domain, a redesign, and most crucially, the Monoskop was
    restructured from its focus on media art and culture towards the wider embrace
    of the arts and humanities. It turned to a media library of sorts. The graduation
    work also consisted of a symposium about personal collecting and media archives,
    which saw its loose follow-ups on media aesthetics (in Bergen) and on knowledge
    classification and archives (Mons4) last year.


    https://monoskop.org/Symposium. Accessed 28 May 2016.


    ADnDid you have a background in library studies, or have you taken their ideas/methods
    of systematization and categorization (meta data)? If not, what are your methods
    and how did you develop them?


    https://monoskop.org/The_Extensions_of_Many. Accessed 28 May 2016.


    177


    COPYING AS A WAY TO START SOMETHING'
