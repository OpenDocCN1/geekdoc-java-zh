  md: 'Bordered backgrounds were different from tiled backgrounds in that the latter
    can repeat infinitely so the appearance of the background doesn''t depend on the
    size of the browser window or the user''s computer screen. Meanwhile, a bordered
    background was not supposed to repeat horizontally.


    In other words, these were fairly short (to reduce traffic) but wide background
    images that could fill up an entire screen: 640, 800, or 1024 pixels, depending
    on how they were created. Other common backgrounds were particularly charming
    because adding this little extra breadth that the authors were preparing for the
    future—the very future that I am now observing from them.


    Needless to say that on my screen—which is far from the biggest available today—I
    see these borders repeating, sometimes three times, and, in the same way that
    we can count the concentric rings of a tree stump to estimate the age of a tree,
    number of repetitions on some level give an indication of the page''s age and
    how much the author was to enable the speed at which technology progresses.


    # Ageing With Grace


    We know how the web looked in the 1990s. An exaggerated version of this aesthetic
    spilled over into modern design in the form of starry wallpapers, ''under construction''
    signs, and animated GIFs. Whenever a designer or artist wants to recreate 1990s
    feel, they usually turn to these elements, which is acknowledged by those who
    remember or study web design. Various research and art projects allow us the opportunity
    to catch a glimpse of the past. But this is not the same as actually revealing
    or feeling the age of this particular medium.


    > Even if we count the year in which Bern-Lee invented HTTP and HTML. 1989. I
    prefer to count from 1993 when the Mosaic browser fell into the hands of users
    and started to build the web.


    The web is almost twenty years old.21 Throughout these years, it has transformed
    from a new medium to new media in the best very sense of the word—it continues
    to evolve. Its ''stupidity'', its neutrality, which lies at


    LOST AND LIVING (IN) ARCHIVES'
