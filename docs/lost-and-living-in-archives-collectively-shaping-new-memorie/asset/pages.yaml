    # Location, Location, Location


    The projects and people converging in the historical Mundaneum are profoundly
    linked to the context of twentieth century Brussels. King Leopold II, in an attempt
    to awaken his country''s desire for greatness, let steady stream of capital flow
    from his private colonies into the city. Located at the crossroads between France,
    the Netherlands and the United Kingdom, the Belgium capital formed a fertile ground
    for aspiring projects with international ambitions, such as the Mundaneum.


    See for example, Ascersion 1999.


    The Musée International, later known as the Palais Mondial or Mundaneum, finally
    opened in 1919. The project had been conceptualised by Paul Otlet and Henri La
    Fontaine ten years earlier, and was meant to be a mix between a documentation
    centre, conference venue and educational display. It occupied the left wing of
    the magnificent buildings in the Parc Cinquantenaire, originally erected to'
