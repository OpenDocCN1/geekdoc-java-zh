    on the 15th of June. Videooccupy aimed to collect visual data from the protesters
    who were using their mobile phones, iPads or video/photo cameras to make recordings.
    Members of the collective made a call to the protesters in the first days of the
    occupation of the park and collected data under the tent of a pioneering political
    activist collective called Our Commons. The call was made on the 4th of June by
