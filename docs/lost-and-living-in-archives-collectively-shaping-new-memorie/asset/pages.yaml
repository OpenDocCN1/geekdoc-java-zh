  md: '2004, Babak Afrassabi and Nasrin Tabatabai have been collaborating under the
    name Pages, developing various projects and publishing the bilingual magazine,
    also named Pages, in Farsi and English. Their projects and the magazine’s editorial
    approach are closely linked, described by the artists as ‘attempts in articulating
    the indecisive space between art and its historical condition’. At the moment
    they are exploring and experimenting to create an online platform, Permeable Archive
    to publish and archive past and future projects. This contradictory nature is
    many elematic for the projects that Pages develop, in which they engage in expansive
    re-readings of history and the intricacies of politics. Similar to their other
    practices, what they propose with Permeable Archive is a rethinking of the archive:
    its structure, creation and accessibility. Pages proposes a pass-slow seepage,
    post archival mode—meaning ‘to flow through fine pores or small openings, to enter
    or penetrate slowly, to become diffused or spread’¹ Emphasizing the impossibility
    of a coherent archive, which follows Pages describes how such an archive can provide
    a means to counter the modernist heritage of archives, moving beyond historical
    purpose in favour of disjunction, retraction and deviation.


    > Quote from the Merriam-Webster dictionary of the verb ‘seep’, in Pages [editorial
    note]: Pages 9 (October 2013): 85.


    # ANNET DEKKER


    Could briefly describe how the idea for Permeable Archive began, and what are
    you trying to achieve?


    # BABAK AFRASSIASABI & NASRIN TABATABAI


    We started the project in 2015 and Permeable Archive was the working title we
    came up with. In practical terms it is mainly an online platform for publishing
    and archiving. But it expands on some of our recent ideas we were busy with the
    past two years working on Pages. With Pages, every issue is always an end point.
    We edit the various materials towards this point. But we want this online platform
    to be a space for open-ending and archiving, an open magazine as it were, endlessly
    edited and disseminated in'
