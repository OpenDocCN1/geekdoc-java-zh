- img_proc: true
  md: 'the core of web architecture, allows it to continue to grow but without ever
    growing old or mature.


    Dealing with an eternally young medium means that we always have to deal with
    something new—technically as well as ideologically and aesthetically. It means
    that the dying of web pages, users or services is seen as a natural process. And
    it makes no sense to speak of a project reaching middle age, because age has no
    value here. Getting old is something that you don''t do on the web.


    The Geocities archive provides us with the experience of getting old. Coming into
    contact with aged pages is an important lesson that defies the impression that
    on the web, everything always happens in the present.'
