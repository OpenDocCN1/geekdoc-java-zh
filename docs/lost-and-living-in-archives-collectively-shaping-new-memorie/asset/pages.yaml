    the term is more complex and beyond the dualistic structure of colonizer/colonized
    and formation of subjectivities. Techno-politics based infrastructural colonization
    is more complex where extra statecraft is involved. Thus, discussing the practice
    of decolonization is already a confusing concept. How moving-image archives are
    utilized and how they function in a process of decolonization not only regards
    the sharing and use of open-source digital tools. It''s also about the storage
