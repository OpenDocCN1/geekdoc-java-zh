  md: 'The Making Public investigates the public, the civic domain where commerce
    and commodities are shared. What does public mean? How does the influence of social,
    political and psychological tendencies work? Where are the boundaries and how
    are they mined? What interests are involved in shaping public forms of responsibility
    and control? And how do artists conduct the debate on these issues?


    Archives are collections of records that are preserved for historical, cultural
    and evidentiary purposes. As, archives are considered as sites of a past, a place
    that contains traces of a collective memory of a nation, a people or a group.
    Digital archives changed from entities into flexible systems, sometimes referred
    to with the term ''Living Archives''. In what ways has this change affected our
    relationship to the past? Will erased, neglected and rediscovered, and new memories
    be allowed? Will the fictional versus factual mode of archiving offer the democratic
    demands, or is it another way for public instruments of power to operate? Living
    (in) Archives shows that archives are not simply a record, a reflection, or an
    image of an event, but they shape the event itself and thus present.


    # LOST AND LIVING (IN) ARCHIVES

    Collectively Shaping New Memories


