    # The Network-Archive as Locus of Power


    Our time is a total of connection. Distance is zero. The future is transparent.
    To be, to be connected—the network seeks out everyone.\’

    As illustrated by the above examples, the search for source materials for Dreams
    Rewired reveals how the archive, far from being a neutral repository, is an instrument
    for controlling knowledge and directing power—devolving it to the wider population,
    or concentrating it—as well as simply making money. National collections, copyright
    libraries, and


