  md: 'Sofia thus opens up the possibility of viewing container technologies in non-binary
    terms, consisting of features commonly ascribed to the masculine or the feminine.
    Such technologies, she suggests, could be conceived as ‘extra-uterine matrices’
    that provide shelters and human dwellings of all kinds, but the traditionally
    feminine domains can also pass as ‘static’ machines. The question that follows
    is: what the idea of the archive as a container contribute to the project of analyzing
    and interpreting disposal processes and the affects they engender? Approaching
    archives as container technologies allows us to acknowledge archives as complex
    spaces. This means seeing archives not merely passive keepers of information or
    aggressive power technologies that violently exclude histories, but also as creating
    debris through a series of performative and practical—and sometimes nurturing—acts
    that designate some artefacts as ‘history’, and thus worth keeping, and others
    as ‘waste’, and thus to be discarded.


    This traditionally “feminine” domain of equipment was not devoid of tools or machines
    used to perform drastic actions on plant, animal, and mineral matter—for chopping,
    whipping, skewering, shredding, grinding, liquefying etc. (Sofia 2000, 189).


    # Bursting at the Seams: What the Archives Can’t Contain


    Theorists attentive to the wasteful aspect of archives are fond of invoking the
    French historian Arlette Farge’s reminder that what work in archives requires
    a triage, a separation of documents. The question is knowing what to take and
    what to leave (Farge 2013, 70). While historians are faced with the choice of
    what to select from the archive, the archivists’ choice is more radical as their
    appraisal determines the collection. The archivists’ decisions on what to keep
    and what to leave are ideological and practical, and they are based on psychological,
    physical, technical and financial motivations. Psychological to ensure meaning-making,
    physical space to store the artefacts, technical infrastructures to organize them
    so they can be retrieved and finished to ensure their preservation. These limitations
    have been the premise of archival institutions since their inception.


    See, for example, Ernest 2013 and Hogan 2015.'
