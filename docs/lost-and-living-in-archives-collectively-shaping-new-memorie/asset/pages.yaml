  md: 'With the internet, everything we encounter is always already accumulated and
    distributed, as users we''ve just become silent labourers of this endless rotation.
    Maybe there is no exit but we can safely engage with it ''loudly'' to open it
    up to its own material condition. With this project we are interested to see how
    we can still invent a workspace. How to publish/archive as opposed to the claustrophobia
    of infinite proliferation Perhaps we should think in terms of subtraction and
    supplementarity, which are defined by the negative. When we first started thinking
    of this project what came to mind was a structure that is porous or permeable.
    The question we should be occupied with is what could be the labour of permeability?


    # AD


    In the project Seep you refer to the archive''s relationship with its geographical
    and historical context. How do you think this will affect the online archive?
    For example, with the different temporality and fluidity of the online archive,
    do you think a historical position, one of the main aims of an archive, is still
    possible? If not, what possible consequences could be?


    # BA & NT


    It is impossible to imagine archives without their relation to geography and history.
    But it may be more interesting to think of the historical (or geographical) ''situations''
    than ''contexts''. Here operates according to precedence and priority; it is a
    closed system, which places complexities of conditions under a single totality.
    Whereas situation is open and indeterminate. It is what is not contextualized.
    From this perspective we could say that the online archive can be in a historical
    and geographical relationship but that is carried by different localities and
    temporalities as you say. One of the arguments that drove the Seep project was
    the question of the location of the archive, which is normally the building where
    the archive is housed. For example the BP archive, which is one of the subjects
    of Seep, is housed in the vaults of the University of Warwick in the West Midlands,'
