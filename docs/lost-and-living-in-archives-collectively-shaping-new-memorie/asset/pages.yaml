    # Articulation and Figuration


    Through double negatives, (disambiguations) and multiscalar adventures, Mondotheque
    diffracts the all-encompassing Utopia that the Mundanese stood for. Working with
    translation, transformation and transclusion we tried to rewrite statements of
    sameness into more interesting tales of similarity and dissimilarity. In response
    to the specific materialanglements that we encountered, we felt the need to process
    and content together on every level and devise multiple forms of poetic re-use
    that included the mixing of fact and text, image, document and catalogue.


    The point of a project such as Mondotheque is to persist collectively demanding
    access to actual digital documents but also to the intellectual and technological
    infrastructures that interface and mediate them. Throughout the Mondotheque project
    it has evident how the position of public institutions has become eroded to the
    point that all forms of communication, including those through the archive, feed
    into neo-liberal agendas eventually. We urgently need to resist simplifications
    and find the patience to restore to these institutions, practices and their histories.


    > The analyses of these themes are transmitted through narrologies or factions,
    which I have renamed as "figurations" or cartographies of the present. A cartography
    is a politically informed map of one historical and social locations, enabling
    the analysis of situated formations of power and hence the elaboration of forms
    of ''resistance'' (Braidotti 2011, 271).


