- img_proc: true
  md: 'Digitization, it is commonly argued, has liberated our documents from the material
    limitations of physical media, producing a ''storage mania'' in which it is easier
    to accumulate data than delete. The rhetoric of cloud computing has further emphasized
    the passive accumulation and ''dematerialization'' of data, by promising to unleashackle
    documents from the limits of space and time in favour of universal accessibility.
    However, it would be a mistake to describe the expansion of networked storage,
    as simply a shift from ''material archive-systems'' to ''immaterial information-banks'',
    as argued by material theorists Jose Brouwer and Arjen Mulder (Brouwer and Mulder
    2003, 4). In their work on archives, sociologists Richard Harvey Brown and Davis
    Brown-State state that activities such as acquisition, classification and preservation
    are ''technical'' activities associated with the archive that may become explicitly
    ''political'' as they determine visibility and access (Brown and Davis-1998, 14).
    Far from representing the dematerialization of the object and the liberation from
    the archival gaze, digitization presents us with material structures, which raise
    new questions concerning how social and cultural memory is exploited and ''read''
    by both human and non-human actors. As Derrida''s *archive fever* is supplanted
    by database fever, technologies of memory are increasingly linked to the industrial
    processing of information and the performativity of software.


    Framing these shifts has been an ongoing consideration of how the archive might
    be understood in an age of ubiquitous networked media. In the early nineties,
    the rhetoric of Web 2.0 celebrated the possibility of shared media, which is both
    mobile and instant, hosted on storage that is limitless and ''free'', requiring
    little mastery to publish and share. With the ability to organize content through
    user-generated tagging systems, the democratic promise of social media appeared
    to extend the web''s potential to overhierarchies of knowledge. Platforms such
    as YouTube, Facebook and Flickr emerged not as ''guardians'' of digital


    333


    LOST AND LIVING (IN) ARCHIVES'
  merge: -1
  pgno: 28
- img_proc: true
  md: 'preservation, but social interfaces which offered opportunities to archive
    one''s life. By simplifying online publishing, these companies persuaded users
    to abandon their home pages and migrate to their services with promises of greater
    capacity and convenience, at zero or low cost. However, the economic and technical
    delivery of this new ''free'', ''social'' and ''archival'' web to millions of
    concurrent users is far from transparent, and offers new possibilities for the
    observation and administration of such data. It is clear, that when considering
    the digital archives that characterize web culture today, is no longer in the
    context of the ephemeral or ''virtual limitlessness of cyberspace'', but rather
    the contingent and specific economies of the server farm or database schema.


    # Database Fever


    The relational database was first proposed by computer scientist Edgar F. Codd
    in 1970, and has become a central, yet largely invisible technology of memory,
    a container for the blobs of information called videos, documents and snapshots.
    Databases have colonized the back-end of the web: they are the skeletons of search
    engines; they lie behind social platforms like Facebook, Twitter, YouTube and
    WordPress. However, it may not be immediately obvious that the pages that make
    up the web are increasingly being generated automatically from an underlying database.
    In the 1990s, HTML tags and a folder on a web server to store your ''home html''.
    In a post-Web 2.0 environment, authoring has reconfigured as a process of adding
    items to the [YouTube/WordPress] database. The rhetoric of Web 2.0 frames as a
    ''liberatory shift'' in thinking about the web not so much as a set of hyperlinked
    documents but as a rich interactive platform in which ''SQL is the new HTML''.
    Observing Observing ''database turn'' in relation to YouTube, media theorist Gert
    Lovink observes: ''We don''t watch TV anymore, we watch databases'''' (Lovink
    2008, 9).


    SQL or Structured Query Language is a language used to create, maintain and query
    databases. For information see O''Reilly 2005.


    ACCUMULATE. AGGREGATE. DESTROY'
