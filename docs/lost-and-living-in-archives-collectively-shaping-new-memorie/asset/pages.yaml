  md: 'subjectivities that create everyday assemblages.


    As Liang claimed that the state archives cannot define the archive since they
    are just a form of archives, they do not exhaust the concept of the archive. And
    as he says,


    Autonomous archival initiatives are often a response to the monopolization of
    public memory by the state, and the political effects that flow from such mnemonic
    power. But attempts to create autonomous archives do not necessarily supplement
    the memory machine of the state (Liang 2016).


    As an autonomous archival practice, bak.ma should not be considered as a storage
    space or a database for preserving images. As Liang affirms:


    Contemporary archival impulses attempt to realize the potential of the archive
    as virtuality, and challenge us to think through the productive capacities of
    an archive beyond the blackmail of memory and amnesia. The production of a concept
    is a provocation, a refusal to answer to the call of the known, and an opportunity
    to intensify our experiences. The archive is therefore not representational; it
    is creative. The naming of something as an archive is not the end, but the beginning
    of a debate (Liang 2016).


    Autonomous archives consist of various media, and since they are mostly based
    on free software, they motivate the users to be active and productive. Thus these
    archival practices are the complete opposite of state archives. The archives mostly
    emerge in areas of conflict. For example, in Ukraine, while former president Viktor
    Yanukovych was fleeing the country on a boat in 2014, a group of journalists,
    writers and activists rescued 23,776 secret documents that had been thrown into
    the lake by Yanukovych''s family. For two years, these ''secret'' documents have
