    # Looking at the Remains


    The Archive Team has managed to preserve a significant portion of Geocities. Our
    analysis of its directory structure reveals that over 1.2 million accounts. We
    cannot know, however, what percentage this represents and how many profiles are
    still missing. In their torrent announcement, Jason Scott simply shrugged it off:


    > How much? We''ll never know ... But we got a bunch of Geocities sites—a significant
    percentage, especially of earlier, pre-acquisition data. We archived it as best
    we could, compared notes, we merged and double-checked did whatever needed to
    be done with what we happened to have (Scott 2010).


    We often discovered that the links we were checking led to other files that had
    not been archived. Perhaps the Archive Team missed them, or perhaps they had been
    deleted earlier.


    Partially preserved profiles, with some missing files, are also quite frequent.
    Missing images are, of course, especially common. A border with an icon inside
    it (different for every browser), telling the viewer that there an image was supposed
    to be, are a telltale, classic sign that the site is dead. Site designs based
    entirely on images were a common standard during the second half of the 1990s,
    and in their abandonment, they became veritable ruins, spontaneous monuments to
    their designers.


