    # Videooccupy: All Efforts are for ''I See''


    On the 2nd of June, the media activist collective Videooccup was set up by a group
    of people from diverse backgrounds, with the aim of recording the whole process
    in the context of mapping the visual memory and creating an open-source digital
    archive Gezi resistance. Members of the collective also aimed to create their
    own media by revealing police violence towards protesters who were using their
    democratic rights, though they were being portrayed in Turkish mainstream media
    as if they were totally offensive, unfair, predatory, and looters. However, police
    frequently fired bullets at protesters'' heads and upper bodies. Tear gas canisters
    were routinely fired at protesters, bystanders and sometimes into residential
    buildings and medical facilities, resulting in hundreds of injuries. Chemical
    irritants were added to water cannon supplies. Female protesters were sexually
    abused by law enforcement officials. Live ammunition was used. Eleven people were
    killed and more than 8,000 injured at the demonstrations across Turkey.


    ![](img/f9e04f352b29e5fc3f1a0eb63b48c3e7_228_0.png)


