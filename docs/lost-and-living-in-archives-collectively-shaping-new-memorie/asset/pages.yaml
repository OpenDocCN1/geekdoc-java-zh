  md: 'Lost and Living (in) Archives is the outcome of thematic projects I organized
    as part of the Media Design and Communication programme at the Piet Zwart Institute
    in Rotterdam. The aim of the series was to investigate the transformation from
    physical to digital archives. Although the book is a mere glimpse of what has
    been studied and discussed, each of the contributions in this book offers a different
    perspective on this change, showing at times that perhaps little is changing and
    how we need to keep going back to revisit and rework the complexities of the archive.
    I''d like to thank all the students who wholeheartedly participated in class and
    inspired me to pursue this publication, the tutors Aymeric Mansoux, Michael Murtaugh,
    Andre Castro, Steve Rushton, David Haines, Barend Onnewweer, and in particular
    Tina Bastajian who co-organized one of the thematic projects with me, Leslie Robbins
    for her (in)visible presence, and Simon Pummell and Renee Turner for their generous
    support in making this book possible.


    Annet Dekker


    261


    ACKNOWLEDGEMENTS'
  merge: -1
  pgno: 261
