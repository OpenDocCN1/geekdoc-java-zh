  md: '# WHAT THE ARCHIVE CAN''T CONTAIN


    Nanna Bonde Thylstrup'
  merge: -1
  pgno: 141
- img_proc: true
  md: 'Archives are predisposed to accumulate and contain. This is their raison d''être
    and how we know them—as institutions that gather and contain material, preferably
    for eternity. Yet, archival accumulation and containment is always followed by
    loss and objection. Most often such a loss is presented to the public as lamentable
    if not catastrophic event, for instance if a painting is vandalized, a statue
    broken or an archival space collapsed. This article, however, investigates intentional
    losses and objections as an integral infrastructure of archives, more than a spectacular
    and unintended event. It seeks to interrogate the shifting construction of loss
    in archival institutions, the policies and practices that are in place to regulate
    it, and the archival affects it gives rise to. The article is based on interviews
    with Danish archivists and librarians from institutions that range from state
    to municipal levels: common to all is that they are the ones who in charge of
    discarding archival material. From these statements the article teases out an
    archival theory that thinks of them in terms of container technologies and the
    consequences for relations of power.


    # The Archival Gender


    Archives are both containers of information and technologies of power. They are
    usually thought of in the cumulative sense. Yet, while the main purpose of archives
    is to collect and preserve objects, they are also followed by a trail of debris
    that is expelled by the archive. Historically, these expulsions have been the
    results of the exclusions and exemptions enacted by patriarchal administrations
    and have therefore given rise to a patriarchal framing of the archive itself.
    As such, archival loss is often framed in violent terms, but interviews conducted
    with archivists suggest that there is also a level of care involved in the practice.
    This is the nuance that I wish to get at in the present article: how do archivists
    feel about disposing material? What meaning do they ascribe to the practice? And
    how is their experience'
  merge: -1
  pgno: 142
- img_proc: true
  md: 'changing with the digital paradigm. Instead of posing these questions through
    the lens of power, I am interested in framing archives as container technologies
    and archivists as belonging to—and performing crucial tasks of—these container
    technologies.


    In 2000 Zoë Sofia introduced the useful notion of ''container technology'' to
    discuss various forms of household technologies, their specific affordances and
    their inscriptions in history. Sofia draws extensively on Lewis Mumford''s essays
    in Techniques and Civilization (1934) where he argued that technical history had
    too much emphasis on power tools such as arrowheads and spear tips, and should
    pay more attention to ''utensils, apparatus, utilities'' which included pots and
    baskets, dye vats and brick kilns, reservoirs, aqueducts, roads, and buildings.
    These technologies, Mumford suggested, inaugurated the passage from a masculine
    hunter-gatherer culture to a feminine architecture based on settled village life.
    Indeed, he suggested, they were the catalyst of a development of a series of technologies
    that were focused on storage and protection. Mumford continues that while household
    utensils technologies were just as fundamental for understanding human development,
    they had been relegated to a much less prominent place in history partly because
    of their lack of development (a bowl has looked the same for millennia) in contrast
    to for instance the advances in technology, but also the history of technology
    favours practices that leave traces such as arrowheads and axes that do not leave
    traces such as ritual or community building. In her 2000 essay Sofia picks up
    on Mumford''s ''points about the devaluation yet continuing importance of containers''
    (2000, 186). She does so in a subtle way that acknowledges Mumford''s attention
    to gender, but also troubles the binaries he sets forth by reminding the reader
    that men''s bodies and activities may just as easily be interpreted as container
    technologies as women''s.'
