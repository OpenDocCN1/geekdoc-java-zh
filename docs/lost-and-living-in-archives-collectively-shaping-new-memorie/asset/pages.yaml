    # AD


    It could be argued that what you''re proposing is not an archive anymore, because
    it doesn''t preserve or even collect, but something more ''fluid'' or as you describe
    it as ''permeable'' comes in. How do you see the relation between the traditional
    archive and this new method, form or platform?


    # BA & NT


    It is true that Permeable Archive will not be an archive in the traditional sense,
    but this is not because the different possibilities online publishing can offer.
    the online material is always prone to re-articulation, which already undermines
    the notion of archive as stored content.


    The starting point of this project was about how to publishing through archiving.
    Obviously publishing and archiving are by definition interconnected. Every act
    of publishing is a testimony to the archive. But at the same time, this relationship
    has never been in a more critical state than now. This is especially so with the
    rapid expansion of the web and digital technologies into our daily lives. We are
    experiencing a boundless and indiscriminate distribution and accumulation of ''content''
    but that is always cleared from its geopolitics. What is always missing from the
    images of information is the labour and protocols of power inherent to it.'
