  md: 'surface level you might think my life could sometimes be lonely, uncomfortable
    and tough; quite dangerous too.


    In truth, there have been days out when it does get tough and I have been worried,
    but for me it is nothing compared to the stress of being trapped in a cycle of
    debt, unable to heat your home, feed your kids or pay your bills. The extreme
    times I''ve experienced been fleeting, lifelong burdens.


    I haven''t had the perfect life but no one has it all. I know I could never have
    been married, but that doesn''t mean it isn''t something that I''ve never considered
    either. There was one girl in my life who I really liked. It was before I left
    for Canada, all those years ago. My brother recently found the photo of me and
    her together and brought it to the cabin this summer. I think he discovered it
    in some old boxes and she is, all tangled in the memories of that person I used
    to be, and could easily have been. Pictures of us on nights out, Blackpool in
    the clubs and pubs, surrounded by gangs of friends and family. And me, smiling
    to the camera, with her sat on my knee. Caddling each other. It is like looking
    at another man, living another life completely.


    We were in love and she did talk about us getting married, but my mind was firmly
    set on travel. I told her that if she still felt the same way about me when I
    came back, we could think about it. I never really did come back, at least the
    person I was back then never did. You can''t live as I do, travel as I did, and
    somehow still settle down and have a family. Not without someone being really
    unhappy in the end. It isn''t fair.


    Of course, many people do wind up making big compromises in their life and still
    find a true happiness. That''s what makes you happy evolve over time. You might
    be drawn to travel and the wilderness as a young person, and then find yourself
    to settle down and have a more conventional life afterwards. That''s, we all change,
    and there are plenty of ways to experience a little bit of what I have going far
    as I have. However, if you are one of the few people like me, or think you might
    be, then convention would always mean conceding something fundamental about who
    you are, and we are always going to be. This was the path I was going to choose
    and I don''t regret a thing.


    A different kind of love has long since been born in me. A love of this place,
    the earth under my feet, a love of the wild and the wildlife (well, the wildlife
