    the fairer rings around their perimeter giving it away as a trout; like sandy
    beaches ringing a series of volcanic islands in a sea of ink.


    This fish was a ferox trout. A brown trout that has evolved over time to develop
    much jaws and amass a far greater size than a conventional brown trout. Ferox
