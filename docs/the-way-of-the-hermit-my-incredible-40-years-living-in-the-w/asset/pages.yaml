  md: '# By Foot and by Thumb


    21 JANUARY 1985


    Come dusk, I actually held back my head to yell to all this wilderness of nothing
    in a more emotional voice of anger than ever done before, a voice of anger not
    a soul could hear in those howling winds of torrential rain.


    “Ya bast—!” Not God, but to the winds...and they returned in power.


    That last two mile, or very near it, for not one inch of moorland and peatbog
