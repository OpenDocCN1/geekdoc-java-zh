  md: 'I started with the very basics of how to grip a pen, and then taught myself
    the simplest turns of phrase and everyday words. It took immense patience and
    discipline, but it was like being back to day one at Upper School, just without
    the cane or the bleedin'' left arm tie. Once I had grasped the basic letter sounds
    and elementary words, I graduated towards some seriously laborious rote-learning
    sessions with what became a very well-worn dictionary.


    If I couldn''t spell a word, I would drill it to the point that I could. Rewriting
    hundreds of times on sheets of paper, and even on the dictionary pages, in the
    smallest handwriting I could possibly muster. Eventually I had worked my way backwards
    from Z to A, so I started again. Again, again, and Until I felt every of loyalty
    was no longer embarrassing.


    It''ve been far too easy to hide my problems and do nothing to myself. I had the
    perfect excuse, after all. But learning how to walk, read and write, for the second
    time in my life, instilled in me single-mindedness and determination that would
    drive me forward in the wilderness. After all, if I could get through all this,
    I could get through anything.


    I ultimately spent forty-nine days in hospital and had almost ten months off work.
    The skinhead gang were eventually caught. They were made to pay £300 for the baker''s
    window, and £10 each in a fine. It doesn''t sound that much today, but that was
    more than a week''s wages back then. Mind you, you could argue they took more
    from me of my life, but there''s no wasting your thought on retribution, I can
    tell you that much for free. Focus on what you have that''s good, never on hate.


    My parents cared for me as I rehabilitated myself from their council house in
    Crich, and my employers, Bowmer and Kirkland, could not have been better to me.
    They made sure I was paid all my entitlements and kept my job open for me to return,
    but I know that many of the days in the building trade were numbered.


    As if I needed any more evidence that it really was time to go, I hadn''t been
    back at work too long before I fell thirteen feet from a steel post onto a bed
    of industrial steel spikes. The spikes punctured my body every'
