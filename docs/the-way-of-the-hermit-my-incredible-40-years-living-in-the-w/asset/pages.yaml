  md: '# The Poltergeist of Ben Alder


    I returned to England in 1984, aged thirty-six, homeless and jobless, with a very
    straightforward choice to make. I could go right back to the working-class job—accept
    predestined place in the lifelong tradition of earning whilst giving over my body,
    mind, and most of my time to paying rent and bills—or I could take that man, born
    in Derbyshire but made in the wilds of British Columbia, the Yukon and Alaska,
    and get him to replicate that newfound way of life on his own island.


    Remarkably, I still had some savings left, so I knew higher chance of nomadism
    going a while longer, but what would come after that? Could I really on living
    indefinitely with next to nothing? At some point I would need to find a home of
    sorts, but how could I afford that without any income?


    Superficially, you might think it easier to “go wild” over. The extremes in temperature
    aren''t as great in Britain when compared to Canada or Alaska, and the wilderness
    isn''t anything as vast, and potentially violent, but that would be a very simplistic
    read on the reality of my situation.


    Any sub-zero temperature makes wild food very hard to come by, and even single
    digits can kill you from exposure if you''re not suitably equipped and sheltered.
    The fact that it might be minus-a-lot in an average British winter, opposed to
    minus thirty in the pits of one in the Yukon or Alaska, isn''t however significant
    in terms of what you need to do to stay alive if you choose to live outside. Yes,
    the British environment itself is inarguably more benign in its size, climate,
    and the ferocity of its wildlife. We also have a National Health Service, some
    benefits for citizens in need, and there is far higher chance of rescue if something
    did go drastically, but the flipside is that it is far harder to work and live
    off the land.


    I knew the requisite abilities to survive, and the right mindset, too. The time
    in the wilderness, and alone in Bob and Ida''s cabin, was proof of how comfortable
    I could be in my own company. However, practically aspect of backwoods wilderness
    living would require breaking British'
