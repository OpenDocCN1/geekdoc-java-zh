    Back then, smoking was something everyone did. It was just another part of life;
    like having a pint after work or eating your breakfast; but today we really do
    know what a dangerous and deadly habit it can be, and it cost me my family dear.


    I was thirty-one years old when Mam had the heart attack. I just came home from
    work early one day, and there she was, pacing around the house holding her chest.
    "I''d rather not speak." Those were the last words I ever heard her say. The doctors
    arrived but she died soon after.


    The whole family was devastated and a dark cloud descended upon our household
    for some time. They said the arteries had hardened from all her smoking.


    Bloody smoking. I''ve never smoked. We had a bet among us kids that whoever smoked
    would have to give the non-smoking sibling threenpence. I stuck to it, and was
