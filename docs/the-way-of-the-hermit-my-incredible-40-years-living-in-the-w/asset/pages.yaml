  md: 'That was it then. I collapsed back into an abyss of the deepest shade of black.


    ***


    Sometimes, sitting here in my cabin at night, I''ll think back to that day and
    shed a little tear. Not out of sadness or self-pity, although either would be
    reasonable emotions to feel given the circumstances, but at the immense relief
    that I did not lose my life.


    I had so much more living to do, and it marked the biggest change in my life''s
    direction. I honestly believe that event had never happened, I doubt I''ve ever
    found the courage to truly put myself first and prioritize adventure. But all
    that had yet to come.


    First, I became aware of light. My eyes were open and I was lying in a hospital
    bed on my right side. My lips tried to form a word, but I was still unable to
    speak and quite unsure of what words really. I made an effort to move and discovered
    I was entirely paralyzed down one side.


    My sight was limited, and my vision was doubled, but what I was aware enough to
    note that I was staring out of the window beside me. The rain was bucketing down,
