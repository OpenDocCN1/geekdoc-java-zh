    ***


    With the foundation completed, I needed to source the logs for the walls. I wanted
    twenty-four logs cut to twelve feet in length and eight cut to fifteen feet, so
    that would give you an idea of the cabin size I had in mind. I was going to lurch.
    There was plenty of it in the woods, and handily it was an excellent timber for
    cabin building as its high resin content makes it resistant to rotting and very
    durable. The key was to find long and straight sections with a uniform diameter;
    the last thing you want is an aggressive taper that leaves you with wonky walls;
    but, also, I didn''t want to be chopping down living larch trees for my build.
    Rather, I set about looking for timbers that had already been blown over in storms
