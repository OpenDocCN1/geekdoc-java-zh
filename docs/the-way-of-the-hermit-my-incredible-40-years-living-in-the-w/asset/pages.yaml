    I''ve been bitten by hundreds of ticks through my lifetime, and as far as I know,
    I haven''t ever contracted Lyme disease. It is pretty rare. But nonetheless, the
    symptoms of this bacterial infection can be life-changing, and include recurrent
    bouts of swollen joints, fatigue, headaches and even paralysis of your facial
    muscles. The good news is that an infection with Lyme disease can be spotted early.
    One of the most obvious indications is a large red rash that looks like a bull''s-eye
    on a dartboard, spreading out from the site of the bite. See that, get treated
    with antibiotics early, and you will significantly lessen the chances of having
    any of those awful long-term problems.


    The obvious way to avoid a tick bite is to clear dense areas of vegetation, but
    given where and how I live, that''s impossible. I wear long trousers to lessen
    the chance of getting bitten, and if you should too, aside from that (and the
    use of insect repellent, if you have it), you just need to be vigilant and try
    tick tweezers, but usually I''ll just rip them off. They''ve latched on.


    I do have tick tweezers, but usually I''ll just rip them off. That''s not the
    recommended method. They say you should gently grip the tick with a fine-toothed
    twee, as close to your skin as possible, and then pull steadily without squeezing
    the creature, less it ejects its innards into your body. The traditional methods
