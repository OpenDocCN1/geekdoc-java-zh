  md: 'None of that means I''m necessarily armed with a higher wisdom or that I have
    developed some spiritual enlightenment or religious purpose—like that hermit fella
    from the dictionary definition. I don''t think I have a unique insight anyway,
    but I''ll let you decide that for yourself.


    I may live alone, but I''m far from the rich history of loners. The outsider,
    isolating themselves from the collective in some outlying place, is a consistent
    theme that stretches back to the dawn of collective human civilization. For, as
    long as we have chosen to live together, there are always those who have chosen
    to live apart.


    In ancient times, most populations would have had themselves a semi-professional
    hermit. Back then, they were celebrated as someone who outside of politics, corrupting
    influences and wider social ills. The hermit was the keeper of the stories, an
    important standard-bearer and comprehensive archivist of the history of a community.
    Most significant of all, they were the ultimate barometer as to what was right
    and what was wrong. Their ability to live without reliance on anything, or anyone,
    meant they were the ultimate source of apolitical and cultural opinion. The only
    people truly on the high ground. In reality, their lifestyle probably meant they
    struggled to get constructive advice on any social direction; as really, what''s
    the point of sparing any thought for all rubbish if you''ve already seen how senseless
    it all is? I know how I feel.


    You don''t have to stick up a cabin in the woods and isolate yourself forever
    to feel the benefits of a little time alone. There are hundreds of thousands of
    religious scholars, thinkers, creatives and leaders who have headed to the wilderness
    part-time to for, reflect and refine their world views and ideas. In Christian
    belief, Jesus of Nazareth was said to have taken to the remote Jordanian desert
    for forty days and nights, as Moses did Mount Sinai. Islamic tradition tells the
    story of the Prophet Muhammad receiving his first revelation while living alone
    in a cave near Mecca, and Hinduism has seen millions of Sadhus, Hindu holy people,
    living a monastic existence, in a near-permanent state of prayer, whilst receiving
    trickles of well-wishers and worshippers.


    Much art, science and literature has been produced by those people who chose to
    temporarily execute their ideas without interruption. Famous recluses, such as
    the scientist Charles Darwin, writer Emily Brontë, philanthropist Howard Hughes,
    director Stanley Kubrick, even the Beatles'
