- img_proc: true
  md: 'I used to plug gaps in the roof with sphagnum too, but that came to an end
    in 1987 after a chimney fire was accelerated onto the roof by handfuls of the
    dry moss. I soon replaced sphagnum''s role as a roof insulator and gap-filler
    with conventional fiberglass and tar, but fire was only a warning shot of far
    worse things to come.


    Life off-grid and in nature is where the work is constant and you survive, and
    hopefully thrive, by keeping ahead of your tasks—fixing an eye on the forecast
    and preparing for the future. There are,, moments in your life which you simply
    can''t prepare for, and on June 6, 1991, when I was forty-four years old, I had
    the biggest twist in my entire cabin existence. It was one that very nearly saw
    my off-grid life cut short permanently.


    It was a very ordinary afternoon and I was happily foraging away on the hillside.
    It''s funny how the moments before a seriously traumatic event, you can remember
    the most mundane details with absolute clarity. I had a pair of scissors in my
    left hand and crouched down collecting nettles to make some wine, when suddenly
    I heard the alrightiest BANG!


    You become highly attuned to every noise out. You learn to recognize every crack,
    every call, every whisper, and associate quickly with the correct creature, plant,
    or meteorological event. Some sounds you can''t place, but if they happen with
    enough regularity, they can be placed in the box marked “benign”—and considered
    as a future riddle to be unpicked.


    This explosive noise was foreign and as exceptional as, I''m afraid, it was violent.


    Startled, I looked up, and there, right above the tree line, was one of the worst
    sights of my life. Blackened smoke was spewing up into the sky and I just knew
    it was my cabin.


    I sprinted as fast as my legs could carry me, through the woods and back down
    the slope; but there was absolutely nothing that could be done.


    My life, my work, my home, were completely engulfed in flame and all I left were
    a handful of nettles and the scissors in my hands.


    I walked back up the hill and stood square in the middle of the train line with
    my arms stretched out. It should go without saying that, by the letter of the
    law, no should ever trespass onto a railway line under any circumstances; but
    my actions were in pure and total desperation.'
