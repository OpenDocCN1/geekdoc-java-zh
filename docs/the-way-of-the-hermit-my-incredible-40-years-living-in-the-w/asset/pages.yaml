- img_proc: true
  md: 'Those are the moments you''ve got to haul the last desperate, hard-won drops
    from the very depths of your well of determination, as—once I''ve started back
    out onto the glen, all awake, tired, and in foul weather—I know I must never stop
    moving, no matter what.


    It does not matter how slow you go—if you''ve got somewhere you must be before
    downfall, and you''re all in the wilderness, especially if the weather is bad:
    DO NOT STOP.


    Whenever we are pushed to pain, our mind will inevitably start to nag: “Just take
    a break. Sit down. Rest a while.” The more you indulge that voice, the more loudly
    it cries, until eventually you convince yourself that a break won''t hurt; if
    you''re not careful, then it can indeed wind up you doing an awful lot of harm.


    The bridge between taking a rest and giving up entirely is a cruel short one,
    especially when the weather is awful and you''re tired, cold, and feeling very
    sorry for yourself. Once you''ve stopped, though, one of your biggest tools for
    warming up, which is natural body heat generated through movement, shuts down
    immediately. Your temperature quickly drops and your mind can start to play cruel
    tricks on you. You can lose track of how long you''ve been on your break, and
    as you remain in stationary position, your body loses more heat than it can generate.
    Without immediate action, you''ll start to shake, your breathing will quicken,
    and a sense of confusion and disorientation can come set in.


    If that is allowed to deepen further then you''re really in trouble. You will
    enter a serious hypothermic state while the shaking stops. You might believe you
    are getting warmer, whilst actually colder than ever; some poor souls have been
    found dead and undressed in the snow, having torn clothes from their body in the
    belief they were burning up, even while the deepest of colds was sinking catastrophically
    into their core. After that, your blood pressure plumets to an unsustainable degree.
    Your body becomes overwhelmed. You suffer cardiac arrest and then die.


    Honestly, for the overwhelming majority of people reading this book, a bit of
    careful planning, appropriate clothing and weather forecasting would avoid you
    ever having to worry about being in such an awful state. I chose a unique way
    of life which has meant there times where I''ve simply had to go out in bad conditions,
    but that will most likely never be you. But if it is, try to keep that most of
    my survival rules in your head.'
