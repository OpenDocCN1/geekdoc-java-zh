  md: '# Put Your Faith in Wood


    The wood I live in has an importance that extends far beyond providing the walls
    for my home. It shields me from the elements and fuels the log burner that keeps
    me warm, dries my clothes, cooks my food and heats my water. The wood can provide
    food too, sometimes drink, and a home to all the wildlife that has brought me
    so much joy through the decades. The health of this wood is as important as my
    own.


    The woodland around me has a mix of species. There are the larch trees, of course,
    which I used to build my walls, but there''s also plenty of Scots pine, some rowan
    mountain ash (useful for axe handles), silver birch, holly and beech (all useful
    for wine!). This wood is so large—perhaps only around fifty acres, give or take—but
    I try to plant saplings to replace what I use, and lend my support to the wider
    conservation of the estate.


    Ultimately, many of the plants and trees that are going now will still be in their
    juvenile years long after I''m dead and buried. That''s precisely the way it should
    be. My debt to the trees in this wood is great, and it is deeply satisfying to
    know that I will leave it in a better state than it has at any other point in
    my lifetime.


    I go through three or four sacks of firewood on a cold winter''s night, and it
    takes around five bags to completely fill the pile next to the log burner. I made
    a count over one winter''s period. From December 18, 1986, till January 31, 1987,
    I chopped and split 5,379 chunks of wood, with 300 pieces being split in a single
    day. That intense physical closeness to my hands, the feeling and regrowth make
    me appreciate it so much more than if its warmth came into my home through a simple
    flick of a switch. I think about every piece of firewood as being its own unique
    part of a living, breathing tree, and give it proper thanks when I burn it for
    my well-being,


    I rowan and larch. They have a good density to them and a beautiful color to their
    insides—deep rusty roots, tangerine oranges, or salmon pinks—and sometimes this
    sweet, resinous smell too. It is a smell that heightens in its intensity just
    after an early summer''s rain.'
  merge: -1
  pgno: 124
- img_proc: true
  md: 'Splitting the wood is the activity which takes the most time, and I allow my
    thoughts to clear as I swing that axe and bring its heavy head to bear on the
    circular grain. The *thack* as I deliver the chop echoes around the woodland and
    bances off the trees. I hope they don''t know what it means.


    The most important thing when splitting wood is getting the shape right. So much
    of the commercial firewood you see sucked outside gas stations have been sliced
    into the most inefficient shapes: chunky and thick, elongated rectangles with
    uniform sides—good for stacking, perhaps; easy to cut with industrial saws, no
    doubt, but not the best for burning.


    When I cut mine, I make a kind of tubular triangular shape, ideally, a semicircle
    like a setting sun; just a finger-length in thickness and no more than a foot
    long. With a rectangular-shaped log, the flames burn the base and a bit of the
    sides, which you will probably have to flip it over to burn the very top; whereas
    you place the semicircular shape on the fire (rounded side up), it burns with
    greater efficiency. The flames burn the flat base but can easily lick the sides
    of the rounded cut too, creating more heat.


    The shape might not sound like such a big deal. Perhaps I sound a pedantic old
    bugger. I suppose if you''re burning wood for a bit of annual campfire, you won''t
    need to think too deeply about it, but when we are talking about thousands of
    fires, for a lifetime like mine, small changes add up to a world of difference.


    Another important consideration is how you stack wood in the fire. I stack my
    fire with two pieces of wood by side, with a gap in between, and another one or
    stacked in a lattice formation on top of the base. I''ll maintain that formation
    as the wood burns away below, crossing the wood into the burner as I go. I find
    that is the most efficient way for the air, flames and heat to circulate around
    the wood, and ultimately my home.


    Efficiency of the burn is so important. It''s important to the supply of firewood
    I have in my home, and it''s important to the wood growing in the earth outside.
    I waste nothing and, and once the decision to light the fire is made, I make sure
    I am maximizing the heat it generates by ensuring three or four tasks are happening
    simultaneously: the house is warmed, my clothes are drying, the kettle is on,
    perhaps the cooking pan is on too. I''ll try to keep it going by trickling in
    just a single piece of wood at a time.'
