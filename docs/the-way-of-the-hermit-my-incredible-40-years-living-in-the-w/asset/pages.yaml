    peeled off your socks and put on dry ones, with a roaring red fire before you,
    it’s all forgotten.


    It’s the memory of an achievement, and what more does a man want heat from a roaring
    fire and internal warmth from a bottle of Hansenen dry wine?


    Where I, it just isn’t possible to sustain yourself entirely from the land. I’d
    either need access to a more land to work, hunt and grow on, or it would need
    to be a different sort of land entirely—one filled with bounty of the sort that
    sustained the hunter-gatherers of yesterday. The reality, in modern Britain, is
    that environment has not existed for several hundred years. Our island is increasingly
    crowded and our wild places are struggling more than ever. I’ve been extremely
    lucky with quite much I have been able to take and grow wild from this land, but
    I still rely on access to the world outside the shores of Loch Treig for many
    products and foodstuffs.


    Every few weeks, I’ll venture out to town for my shopping and mail. In spite of
    my lifestyle, don’t hugely mind going to the shops and seeing people. I hear that
    everyone is doing much of their shopping on the internet with computers. I have
    never been on the internet, or on a computer, in my life; and it all sounds very
    strange to me. So there are all those people living'
