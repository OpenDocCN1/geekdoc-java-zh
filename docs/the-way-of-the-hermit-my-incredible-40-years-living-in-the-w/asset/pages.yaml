  md: '# Brown Gold and Wild Brews


    My cabin would be nothing without a solid foundation and I approached my garden
    in much the same way. The garden surrounds the entirety of my home—with the largest
    patch of earth sat squarely outside my front door. It is quite small; probably
    little more than an eighth of an acre; but it is prolific, and that is all down
    to the soil. There’s lots said and written all the things you can grow in a garden,
    but not enough said about the essential element that sustains all life. The brown
    gold. The muck itself.


    Your soil needs as much care and attention as you grow in it, if not more so.
    I’d learned enough in my years working for the Forestry Commission, the nursery,
    and on my allotment, to know what constituted good soil. It was finding it was
    going to prove the issue. The original soil around my cabin just didn''t have
    the depth to grow all I needed. The good news, though, that you didn''t have to
    travel in this wood to find some lovely patches of earth, filled with nutrients
    from decaying organic matter and, crucially, worms. I would find an area and scoop
    into my bag before transplanting it into my own garden, and I''d be on the hunt
    for natural fertilizers.


    Before the sheep moved from the mountain, my major source was sheep dung—a lovely,
    slow-release fertilizer, high in potassium and phosphorus; but I’ve always used
    my own fertilizer too, harvested from the depths of the Bottomless Pit, or from
    my dedicated food-waste compost heap.


    It has all worked wonderfully over the decades, and today I’ve got all sorts out
    there in my garden. Some of the plants I’ve grown from seeds I’ve collected and
    set, are some from shoots and saplings I’ve bought (or been given), and others
    are from cuttings I’ve borrowed and grown. There’s that much out there, and that
    much been and gone, it’s very hard to keep a track of it all.


    I used to be able to remember it quite easily, but some names do slip the mind.
    I did diligently write tags for all the plants as they went into the ground, but
    bad weather, and small creatures all played their part in mixing those tags up.'
