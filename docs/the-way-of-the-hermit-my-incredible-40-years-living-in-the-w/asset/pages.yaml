    hands in 1995, but the new family continue to be very kind to me. They have even
    made copies of many of my diaries too. I am so grateful to them all, really.


    There is a very kind ultra-running vet who makes my mail from the Span Bridge
    Post Office, so that''s one less job now; and real modern technology came into
    my life for the first time a few years ago. I have a GPS tracker and locator beacon
    that has a button on it I can press to alert medical staff when I''m severely
    ill. It probably saved my life when I had the stroke.


    My family continue to visit, my brother and nephews all come this year, and the
    estate are going to help me with a gas cylinder and gas stove, so I can stop cooking
    the top of my log burning stove. Gas cooking will make an enormous difference.
    It took me an hour to boil the kettle on the log burner today, so it will save
    wood fuel as well as all my time and energy chopping and carrying timber.


    I''ve had trouble accepting help with the cabin in the past. It used to be easier
    to be completely self-reliant and in the debt of no one; but that matters far
    less as time draws inevitably on. Life out here isn''t about living in the most
    uncomfortable way possible, it''s about learning the best life you can be by striking
    the balance between what you really need and what you can afford. With my life
    savings restored, a state pension, I can afford a little more now. I''m a hermit,
