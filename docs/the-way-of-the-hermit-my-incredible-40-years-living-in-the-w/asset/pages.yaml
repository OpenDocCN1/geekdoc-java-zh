    a lawnmower handle, a barstooland the trolley was complete. Truly, it was an education
    in what you could build simply from the waste of others; and we were well on our
    way.


    Higher and deeper into the Canadian north we went. We were becoming increasingly
    resourceful backwoodsmen and competent long-distance walkers. Our fish diet expanded
    from rainbow trout to include Arctic grayling, suckerfish, lake trout and Dolly
    Warden. We became skilled at setting snares for rabbits, and which were all the
    edible species of mushrooms and berries. We made jams of wild fruits, and for
    greens, we consumed vast amounts of dandelion leaves alongside the fresh shooting
    leaves of young fireweed plants, the purple-flowering beauties that sprang forth
    in this undisturbed boreal forest.


    With each month that passed, I could feel myself expanding, not only in terms
    of the skills I was acquiring, but physically and mentally too. I entered the
    Yukon and became far sur of my feet. Our hair grew long and our beards thickened.
    I forged fresh muscles, honed from carrying loads, hiking and hunting, and felt
    myself shedding the burden of all the former abuses to my body of the years past.
    My mental horizons expanded'
