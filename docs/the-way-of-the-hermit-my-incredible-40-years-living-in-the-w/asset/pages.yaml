  md: '# Catch It. Cook It.


    If you want to truly live in the wilderness, you must first learn how to hunt,
    fish or gather. In North America, I sustained myself off foraged plants and fungi,
    and used traps and a slingshot to harvest the occasional duck or rabbit. In Scotland,
    the deer aside, I needed to be much more opportunistic. I have eaten fresh road-and-train-kill
    when I''ve found it, and continue to forage seasonally, but my most regular source
    of wild food has always been the loch.


    There is something vital about choosing to take the life of an animal. Something
    that is lost on the vast majority of meat-eaters on this planet, whose only real
    engagements come when they choose the butcher''s or supermarket aisle. You can''t
    really blame people for being out of touch with what they put in their bellies.
    The gulf between the consumer, the producer, and the consumed could hardly be
    greater. The hard work is outsourced elsewhere and the animal is absolutely unrecognizable
    by the time it reaches the bottom of its baskets. All nearly presented; free of
    blood, guts and gore; lying on a plastic carpet with a price tag stuck blithely
    on the front of some shiny packaging. Everything that animal is, or, has been
    stripped away, as it is everything it has taken the farmer, fisherman or packer
    to get to that point.


    Eating meat is a privilege, and that animal''s life should always be remembered,
    whenever, however, you choose to take it. I would encourage you to learn a bit
    more about the meat you buy to eat, not just where it''s from, and how it was
    looked after or caught, but something of its life too. What it means to be that
    fish, pig or chicken. You might just find you a bit more respect for the animal
    and its home; and that can only be better all round.


    The depths of the loch hide beautiful brown trout, monstrously dark pike, thick,
    snake-like eels, pretty three-spinned stickleback, and three separate species
    of Arctic char—a hangover from the Ice Age. One species of those'
  merge: -1
  pgno: 163
- img_proc: true
  md: 'char was believed to be extinct, until netting survey hauled them right up
    from the frigid lake bed. Such are the mysteries of Treig; but I always knew those
    char were there, as—come the cold weather—they move up from the depths onto shallow
    sandbars to breed. A well-placed worm brought them to my net (and the lens of
    my camera) long before their official discovery.


    There are many ways to catch a fish, and I''ve tried a great deal of them through
    the course of my fishing life. Over the years, though, my fishing techniques have
    narrowed to either lure fishing or fishing with bait. Fishing with bait is nearly
    always a static method. You cast out your baited rig into a favorable area, and
    leave it until you have a bite from your target fish species. In the Canadian
    winter I would use cuts of dead fish to feed the serpentine trout out their icy
    lairs. They were ugly-looking bugs, but my goodness they tasted nice, with their
    big meaty chunks of cod-like white flesh, which I ate fried or boiled up in a
    stew. In Scotland, I employed worms for trout and perch, or small fish to snare
    a pike—usually, if I''m going to catch, I don''t muck looking for worms, or waste
    fish I could try to catch fish that are invariably too big to knock on the head
    anyway; instead, use lures.


    Inside series of small plastic tackle boxes and old tins, I keep all my lures.
    I''ve gone through thousands in my life, but there are plenty in there that are
    decades old and still more capable of catching fish—just like me.


    Lures are designed to mimic the actions of small prey fish, something that a larger
    predatory fish would like to eat. The various different lures achieve this are
    many and varied. One of the most popular here are metal lures, which are shaped
    to spin, flutter and flash as you reel back through the water. Usually, they are
    “spinners” or “spoons” that resemble a silver fish fleeing in open water. Another
    type are “plugs” or “crankba”, built to look almost exactly like a fish, with
    a swimming action that wobbles through the water as it is injured or weakened.
    Colors and patterns can be added to these lures, too, as well as feathers, and
    the hooks can even be baited with worms; anything to give your lure added bit
    of attraction: a splash of blood-red, or a trailing wormy scent that a predatory
    fish will likely follow.


    The very best lures cover several bases: they move in an attractive “eat me” way
    and are colored to provoke a predatory response. However, it is'
  merge: -1
  pgno: 164
- img_proc: true
  md: 'always worth remembering that a lot of fishing tackle is designed to catch
    the angler and not the fish. I have modern lures in my boxes that look very pretty,
    and are made with very fine materials indeed, but are only really good for stripping
    down and building back into an old lure that I know will work on this very specific
    water.


    I generally like lures that are made of metal and on the smaller side. That way,
    if a fish decides it wants to eat it, I know it''ll be well hooked. A lot of big
    fish anglers use very large lures. That''s all well and good, but patterns that
    are particularly long are always giving the fish chance of taking it right across
    the middle, avoiding the hooks placed on the ends of your lure. You lose fish
    (or have to put more hooks on the lure) when you could fish with a far smaller
    lure and hook that fish the first time anyway. Remember: big fish will eat fish
    too—you just need to find the right lure.


    I spend money on fishing tackle—it is an investment, as it goes towards providing
    a source of my food—but I''ll do everything I can make sure I don''t end losing
    up to all the many snags beneath Treig''s stretch. Means fishing with strong line
    to lessen the chances of it snapping, but, if the worst still happens and I lose
    my lure to a big rock or a submerged tree, I''ll mentally mark the spot where
    it is and, as soon as the water level drops enough, I''ll go in and retrieve it.


    I hand-make many of my lures and always on the lookout for everyday materials
    that might be attractive to fish: coins, spoons, odd name tags, keys; anything
    with a good shape and a bit of shine. I''ll add the holes for the hooks and swivels,
    and usually put on an extra bit of attractant in the form of colored beads, paint,
    or anything; anything will give me that extra edge.


    On Loch there are fish to catch everywhere, and a few hotspots that they seem
    to frequent with real regularity, especially the mouths of the burns and all the
    big bays. Of far greater importance, though, is the weather. The very obvious
    difference between a pure pleasure angler, and someone like myself, is that I
    catch to eat, whereas they just fish for fun. For a lot of those sort of anglers,
    being beside satisfies a lot of what they are looking for: a day away from stress
    and time spent in nature; the fish are just a bonus. That means they''ll usually
    choose the nicest days on which to head out with a rod in hand, favoring warm
    and dry weather, and the comeliest spot they can find on stretch of bank.'
  merge: -1
  pgno: 165
- img_proc: true
  md: 'For me, I won''t even head out if I know I''m not likely to catch. Sunny weather
    is actually the absolute worst possible for catching predatory fish. I have nothing
    whatsoever against fair-weather anglers, but when I''ve got so much to do day-to-day,
    and I''m reliant on catching to feed myself, I just can''t afford to waste my
    time trying and failing.


    You must think like the fish you are hoping to catch. A big fish-eating trout
    isn''t going to bother hunting on a day when its own prey is hard to sneak up
    on. In settled conditions, a small fish can see a big fish coming, and they will
    flee from the area; but when it is murky, overcast, with a good ripple on the
    lake, predatory fish will find ambush a hell of a lot easier. You would actually
    go so far as to: the more violent the take from the fish. As long as you''re not
    deaf to head out in truly severe weather conditions (that could see an errant
    lightning bolt mold your rod permanently to your palm), never overlook the fish-catching
    power of bloody awful.


    With the right time and place picked off, next think about what lure you are using
    and how it will work in the water. Too many anglers get time and place right,
    then just cast out and reel their lure straight back. You need to work through
    the water. Think about the water in three dimensions, not just the blank surface
    stretched out in front of you. Fish the lure at different depths, counting the
    seconds as it falls, and then wind it back towards you at varying speeds. Properly
    cover the area, fanning your casts out like you are fishing the face of a clock.
    That way you know you''ve put the lure through everything out there, and if anything
    really wanted it, you would have had.


    Finally, basic watercraft. Use stealth, wear clothing, and be quiet. Even if you
    can''t see the fish, they can see you. Here in Treig, they will often cast your
    lure right to your toes, so if you are being noisy and wearing garish colors,
    you''ll certainly blow it.


    My greatest fishing haul came off the back of one of the worst winters in living
    memory. The year 1994 opened with a month of solid squalls and snowstorms; frozen
    ground gave way to endless rains. That was rain thin—the dark skies, and even
    darker waters—that brought the biggest of Treig''s trout into the loch edges to
    hunt and feed.'
