  md: '# My Wild Neighbors and Me


    There are many creatures that I truly love seeing around my home. The birds, in
    particular, are constant sources of entertainment and wonder. I have a bird feeder
    set up outside my cabin window and, in 1994, I decided to begin listing every
    single species I saw. Come 2016, I had extended it to ninety-nine separate species.
    The list included birds of all designs—big and small, scarce and common, timid
    and tame. Tree creeper, great tit, cuckoo, chaffinch, siskin, robin, mistle thrush,
    great spotted collared doves. In winter I recorded wood pigeons roosting woodpecker
    and the lonesome call of the tawny owls on a nightly basis. I soon branched out
    from the bird feeder and started including all the birds I encountered on.


    By Treig''s shoreline I ticked off the geese, the gulls, the sandipers and the
    herons; on the uplands the meadow pipit was very simple to find. They are probably
    the most common songbird outside of these woods. They burst out from the brush
    with their skittish flight pattern, opening their white-edged tail fan as they
    zigzag zigzag birds that are always on the go with something: gathering flies,
    spiders, beetles and grubs, plucking out nest-building materials. Real stalwarts
    of the glen.


    I spotted some rarities too. The lesser redpoll and its young visited the woods
    one day. It is a finch species with a distinct red patch on its forehead. They
    hang upside down when then, but they are now on the Red List—the International
    Union for Conservation of Nature Red List of Threatened Species. In 2002 I saw
    another rare finch, the Striking orange parrot crossbill, and then there were
    the birds of prey: golden eagles, hen harriers, buzzards, goshawks, kestrels,
    sparrowhawks, merlins and ospreys. Some you''d expect, you might see regularly
    in other parts of Scotland, but all still had the ability to thrill whenever I
    received a privileged glimpse into their predatory world. Especially so, if I
    could get close.


    The golden eagles have a special corner of my heart. For years I would climb the
    crags to observe their nesting site, high up on a precipitous cliff ledge above
    the loch. From there I watched them tenderly raise their young, a pair of white
    chicks, and would be sad when they all left. In 1997, a'
