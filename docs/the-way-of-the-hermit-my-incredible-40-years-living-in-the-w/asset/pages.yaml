  md: 'sure you know now, when the weather turns out here, it truly turns, and it
    is all too easy to find yourself badly caught out.


    I can scarcely list the number of times people have been rescued up here, or the
    amount of close calls I''ve witnessed. The Highlands don''t discriminate by age,
    gender, or fitness, either; even the military have had problems—in the winter
    of 1997 two members of the Army were helicoptered off this area with severe hypothermia.


    Most search-and-rescues ended with a happy outcome; thanks largely to the dedication
    of a hardy band of volunteers from Mountain Rescue, and whoever else is experienced
    enough to lend a hand.


    Many years ago, before the cabin, and before I''d even been to North America,
    I was climbing a mountain over Glen Lyon, sandwiched between Loch Tay and Loch.


    I''d not long until I saw a bloke lying in the deep snow with his eyes shut. My
    immediate thought was that he must be dead, but as I knelt next to him to check
    his pulse, his bloomin'' eyes burst open and he almost gave me a heart attack.


    I heaved him up from the spot and carried him all the way back down the hill to
    safety. My name was John and we would become good friends. Later, he explained
    that absolutely nothing had happened to him. He was just feeling tired and simply
    sat down for a break and fell asleep in the snow.


    I''ve lost his letter to me now; but I remember he was moved to say that if it
    wasn''t for finding him that day, then he wouldn''t be here now. That really meant
    a. Tragically though, there are far too many cases of people who aren''t as lucky
    as John.


    Ten years ago, a young man died just into what he hoped a year-long survival challenge
    in the Scottish wilderness. He was up the track from my cabin when he apparently
    froze to death in a railway hut, just a half-hour''s walk from Ramnoch Station.
    I remember another too, a really fit man trying to do some Munros as he could.
    He was running up here in the snow and I was out on the estate with some guests.
    That was the start of the weekend, when I was off back to the cabin after the
    hunting had finished, but I wasn''t back long before I was told the alarm had
    been raised and that the man hadn''t made it to his final destination over at
    Ben Nevis. We went out on the search, and there was, dead on our land.'
