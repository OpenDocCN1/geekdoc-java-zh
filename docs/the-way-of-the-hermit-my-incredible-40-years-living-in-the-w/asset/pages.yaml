    *** * ***


    My relationship with wildlife is not completely harmonious. I have told you about
    the worst of biting and slithering mini-beasts, but there are plenty of other
    creatures that are capable of raising my blood pressure on their day. But no matter
    how reckless and murderous they may be, and how angry I might feel when they undo
