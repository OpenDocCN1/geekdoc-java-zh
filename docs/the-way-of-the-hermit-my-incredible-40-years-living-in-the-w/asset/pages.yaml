  md: '# Live to 102


    “It’s not the cough that carries you off, it’s the coffin you carry you off.

    I don’t know who said that originally, but they’ve got a very good point.

    Apart from being a good rhyme, I think what they are getting at is that it’s not
    about what killed you, it’s about how you choose to depart the earth.

    How you wish to be celebrated, and how and where you want to be laid to rest.


    I am now seventy-five and, quite frankly, a lot better than I was this time last
    year. I am now hoping to live to 102. I think, at least I hope, that the longing
    for more from my life will keep me going for many more years. It makes a real
    difference, you know. Wanting to stay alive and digging in. Finding reasons and
    inspiration to carry on. I’ve seen so many times, that people get to an age and
    keel over through the end on themselves because they don’t feel they have anything
    left to live. My life is so much of a gift for me to think like that. There are
    always times to see and do, more stories to make and tell; I know none of us live
    forever and if the end of my grand adventure is coming soon, then that’s okay.


    I believe that if you are a Christian you must go to church and subscribe strictly
    to an organized system of belief. No. I have my own Christian beliefs and that’s
    that. I’ve tried to be a good person and to be kind, but none of that has been
    with any thoughts of getting some sort of everlasting reward in heaven. I’ve said
    it before in these pages, but you should do good because that’s the right thing
    to do. No organization, religion, person or group has the monopoly over goodness;
    and no one should be made to feel like they haven’t got it right in their life,
    because they haven’t followed whatever those sorts of people have you’re supposed
    to do. Just strive to be kind and don’t worry about anything else.


    I don’t know where I’ll go when I die.


    It might be heaven, it might be hell, or maybe it will be somewhere in between.
    I thought I saw the light once. As I slipped into an unconscious state on one
    of my many trips to hospital, I could feel my vision narrowing into a tunnel with
    a bright light at the end. I thought that could be'
