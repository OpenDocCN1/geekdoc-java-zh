  md: 'weight of the log above slowly bore down into the cup-shaped saddle below.
    This method uses no screws or visible joints and was beautifully simple but incredibly
    effective.


    First, I marked the exact position and width of the notch using the timber above
    as the guide. Then I''d lift the timber off, and set to work cutting the saddle
    into the timber that was set to it below. First, I saw a cut halfway through the
    log, right in the center of the two width marks. Then I''d use an axe to hack
    chunks of wood in the rough cup-shape of the notch, before finishing the job accurately
    and smoothly with a hammer and chisel. Once I''d repeated the task for the other
    end corner, I could then lay the timber above the notches at each end, and repeat
    the process again, laying layers of logs right on top, till I''d gradually built
    up to the height of the entire wall.


    The higher the walls grew, the harder it became to make notches and hang the timbers
    digging hard into my shoulder blades, but every effort upwards proudly pulled
    my dreams towards the sky. The cabin was coming together.


    With the structure standing, I used a saw to cut in the windows and my front door,
    and cut off the rough ends to get the whole cabin smooth and uniform. Dick, I
    hoped, would''ve been proud; but for the roof I deviated from pure tradition and
    went for corrugated metal coated in zinc in preference to the customary wood shingles.
    I wanted something that I knew could take a heavy hit from a falling branch if
    needed, and wouldn''t rot away too easily; beneath I insulated with moss (although
    much later, I swapped that out for modern fiberglass. It was just so more efficient
    at holding the heat and wasn''t as much of a fire hazard as moss) and then finished
    it all off with ply-boarding for my ceiling.


    If I had been able to work absolutely flat-out, I think I would''ve finished the
    basic cabin in six weeks, but the start of my estate meant it took six months
    to get the structure as I wanted, working absolutely all of my free time. The
