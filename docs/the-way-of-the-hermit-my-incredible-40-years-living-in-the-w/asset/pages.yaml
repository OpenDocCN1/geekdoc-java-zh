    are doing okay. I can''t help myself.


    The chaffinch and bullfinch are plenty capable of stripping the garden of its
    berries, but when it comes to thievery, the pine marten is the undisputed king
    of the lot. They may have a cute and cheeky appearance, with their soft brown
    fur and teddy-bear eyes, but they are sleek and athletic killers too, armed with
    sharp paws and dagger-like teeth. Determined, intelligent, and powerful, I''ve
    actually been forced to store some meat and cheese within a secondhand locker.
    They might not be able to get in, but they have a habit of pissing on it, soaking
    through the hinges and rusting them right until it is a deliberate act; but yet
    again, I frequently myself worrying about them when the winters are at their very
    worst—and, in 1993, I would say I even went as far as making friends with one.


    Well, if not quite friends, we definitely declared a truce.


    Through the spring and summer of that year, a young pine marten as close to being
