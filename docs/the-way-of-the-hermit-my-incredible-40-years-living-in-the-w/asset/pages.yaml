    In bodies of water where the water is murky, stirred up with silt or sediment,
    the fish that hunt there will often appear quite dull in color. They need not
    take on camouflage in their skin, as the suspension in the water column has effectively
    done it for them. The gin-clear clarity of this loch, though, often means that
    the predatory fish take color of their own. Hold a brown trout in a turbid water
    next to one from Treig, and you could be forgiven for thinking the two fish were
    different species. The one murky water was a light brown with creamy yellow flanks
