  md: 'have a bit of a sweet tooth, but the one I will not compromise on is how I
    make my tea.


    How you make your brew is something you are absolutely in control of. You don''t
    need to be living in a palace or off-grid in some Highlands log cabin to make
    a really nice cup of tea. Yet the vast majority of tea drinkers ruin their drink
    from the second they enter the tea aisle in the shop.


    I was always told that the tea leaves reserved for the tea bags were the waste
    tea that had tumbled from the sacks as the tea was being offloaded from the docks.
    Muck is money, as they say, having been shipped here from the plantations of Asia
    or Africa, it seemed too wasteful to keep sweeping the leftover tea into the sea,
    so some bright spark suggested scooping it all up and putting it into tea bags.


    Whatever the truth, tea in a bag is never as fresh as loose tea, and the bag restricts
    the brewing process and alters the true taste of the tea. If you are making tea,
    always use loose tea leaves.


    So''s my first tip is: using boiling water. I know this sounds obvious, but when
    I say boiling water, I mean boiling water, and not the water from the kettle that
    boiled many minutes earlier. The moment that the water is bubbling vigorously,
    it goes straight onto the leaves in your cup. Some may say you wait, as boiling
    water scalds the tea, but they are wrong. Personally, I don''t mess about strainers
    either. I just put two teaspoons of tea straight into the mug and pour the water
    right over them.


    Next is your milk. Use whatever you like, but I use the creamy long-life stuff
    that comes from a can. By the way, if you''re punching a hole in a can to pour
    out a liquid, make sure you punch one in the rim of the lid for pouring, then
    another smaller hole on the opposite side of the lid; otherwise you''ll struggle
    to get anything out. Add your sugar and give it a stir, but make sure you dry
    your spoon after. In my situation, a sugary spoon left out on the side is an invitation
    to pests, but far worse than that, you might make another cup of tea and end sticking
    a damp, sugary spoon into the dry tea leaves. Do that, and you''vepossibly spoiled
    the whole bag. I suppose if you can just go to a shop and get more tea in minutes,
    it shouldn''t really matter too much (or maybe it should?). Anyway, just dry the
    spoon.


    Tea aside, another great drinking pleasure, clearly, is my home-brewing. I should
