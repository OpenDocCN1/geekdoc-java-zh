  md: 'vast desert wilderness filled with cacti, sagebrush and tumbleweed (and many
    rattlesnakes beneath the rocks), before hitching and hiking our way higher and
    deeper into central British Columbia.

    We found huge lakes filled with rainbow trout, and forests carpeting the mountains
    in every direction we turned. We built rafts and fished; spotted the nests of
    bald eagles, beavers, and the spectacular crimson-eyed diving bird, the moon.
    Alongside the fish, we caught grouse, and once trapped a squirrel, the meat was
    so tough that it was not going to be an animal we ever bothered to with again.
    We became friends with the local Indigenous people too, who netted the lakes and
    caught enormous char—a member of the salmon family, with dark backs and bright
    orange bells—which they gifted to us, alongside loans of their boats, canoes,
    and invitations to their homes and churches. We never once asked for a cent in
    return.

    It wasn''t pure paradise, of course; we had some awful to contend with: monumental
    downpours that pinned us beneath the tarp, sometimes for days at a time, and clouds
    of mosquitoes. At one point, we were even plagued by flying ants, which filled
    our camp and sleeping bags. And one morning, Roy was almost crushed by a charging
    bull moose that was fleeing a gang of First Nation hunters and their dogs.

    But the most dramatic moment came not too far from the town of Smithers. We had
    just stocked up on food for the long trek ahead and entered what felt like a never-ending
    region of swampy marshland. Eventually, we reached a creek with waist-deep water.
    Roy had fallen into a river earlier that day, so already soaked through, and didn''t
    think twice plunging right in; but I quite fancied my boots dry, after spotting
    a convenient fallen pine that seemingly bridged the two banks, I attempted to
    mimic a tightrope walker.

    Two things became instantly apparent. The first was that the log was absolutely
    soaked, and the second was that the creek had transformed into a raging torrent
    in the section immediately beneath my makeshift bridge. I attempted to edge across
    and discovered, to my horror, that not only was the tree wet, but the bark was
    rotten. Away it slipped, like the skin of a split banana, to reveal a marble-smooth
    interior. It was like balancing on a horizontal pillar of polished marble and
    I went, plunging sideways into the angry water.'
