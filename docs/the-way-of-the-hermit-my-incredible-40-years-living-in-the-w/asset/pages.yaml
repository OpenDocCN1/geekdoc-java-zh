    ***


    I was about five years old when we finally moved out of Whatstandwell. We only
    headed three miles down the road to a council house, but the relief in us all
    was palpable. Finally, we were free of primitive place and off to the relative
    civilization of the village of Crich.


    Crich was where my education began. I had attended Whatstandwell for a year before
    we’d moved, but I can’t remember learning anything of note. It was a brutal place,
    where corporal punishment was the norm. On my first day of school, I was caned
    for running out into the road to get a ball. A mistake certainly, but worthy of
    beating a small child finding his feet in a new school? Most certainly not. That
    was the way it was done back then, Victorian de education persevered into the
    middle half of the last century, until the practice of caning was finally outlawed
    in the 1980s.


    There were two primary schools placed on the hill at Crich: top school, for the
    infants, and bottom school for the juniors. They were both built in the late 1880s,
    a time of great economic and population growth in Britain’s'
  merge: -1
  pgno: 17
- img_proc: true
  md: 'industrial heartlands. As workers worked in the pits, mills and docks, the
    need to make provisions for the education of their children grew. Soon thick stone,
    brick, and slate-roofed buildings began to pop up in the working communities spread
    out across the land.


    They were typically small, cold and functional. In my first school you could get
    all the children in one room, and we only had four teachers in total; but that
