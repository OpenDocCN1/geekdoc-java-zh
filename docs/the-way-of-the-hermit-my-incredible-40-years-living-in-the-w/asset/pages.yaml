  md: 'makes this place feel somehow lonelier. Ossified homes. Pathways that are impossible
    to walk down, doors that will never be opened, fireplaces that can''t ever be
    lit. I saw it all in the heatwave of 1985, when the lake level dropped low enough
    for me to walk right up to the old school building. Amongst the sodden ruins I
    found old clay pipes, porcelain, and a penny date-stamped 1881. Remnants of a
    community tragically ousted by man’s needs.


    In Gaelic, Loch Treig translates to “the lake of death,” but as much as the crown
    of mountains surrounding it might seem to superbly cut Treig off civilization,
    the isolation here is far from complete. The image of a wilderness landscape utterly
    devoid of people, especially of local people, is an old trope cast the way of
    the Highlands by outsiders. This place may be remote by the stores of our congested
    island, but that cliché of it being somehow “untouched” or “forgotten by man”
    would be a lie.


    The dam aside, there is a historic network of man-made pathways puncturing this
    land. In the past there were trade routes; shepherds’ roads to distant farms and
    hamlets, linking farmers and laborers with market places where they could sell
    their wares. A big change was heralded with the Victorians, who encouraged the
    idea that Britain’s mountainous places were adventure playgrounds and in all their
    writings, paintings and poetry. Highland pathways changed dramatically after that.
    A clutch of the summits Treig became added to list of mountains known as the “Munros,”
    denoting a Scottish mountain with a height in excess of 3,000, and by the time
    Hugh Munro’s 1981 Munro Tables was popularized, the enthusiasm among hikers to
    “bag them” had grown with some gusto. The Scottish Highlands became a place of
    pleasure walking and mountaineering from that point forward. The most famous Munro
    of all, Ben Nevis, the highest mountain in the British Isles, sits ten miles to
    the west of Treig, and sees 130,000 ascents every year. “Forgotten by man,” this
    place is not.


    This is very much-walking country then, and mountains aside, there are lower-lying
    long-distance footpaths joining the dots between fell, village and road; all the
    way to the bustling town of Fort William and beyond. Good news for the local economy,
    which was boosted further by an upswing in transportation infrastructure.


    The Victorians established the train track that runs along Treig’s eastern slope.
