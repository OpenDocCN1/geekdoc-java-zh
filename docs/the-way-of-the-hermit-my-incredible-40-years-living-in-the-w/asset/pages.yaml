    Too many people have dramatic and truly brilliant ideas that never take the leap
    from the blueprint of their minds because they''ve already persuaded themselves
    it''s going to be impossible, long before they ever start to try. Sometimes you
    just need to get going, with little more than a “hope for the best,” and then
    simply see what happens. Don''t get overwhelmed by start living as you fit tomorrow,
    and then try and do it all the next day too. You''ll get where you need to go
    to.


    At first, I headed south, down to the extreme tip of Britain''s coastline at Land''s
    End, before steadily all the way back north. I explored many of the outlying places
    of the British Isles, and I learned to avoid cities the plague. Dreadfully expensive
    and suffocating places, filled with busy, mistrustful people. Not good places
