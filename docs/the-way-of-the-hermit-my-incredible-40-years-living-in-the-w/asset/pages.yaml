    At my least eyelids could move. At the top of some stairs, I could see a nurse
    dressed in a white cotton uniform. I knew I was definitely in hospital then. Then
    she had a small white hat on top of her head and was just about to disappear the
    stairs, when something instinctual must have made her glance over in my direction.


    “Oh!” she said with a start. “You’re awake, Mr. Smith!”


    It did not matter that I had no way to respond back to her. She continued with
    the warmth and generosity of spirit that is typical of so many work within the
