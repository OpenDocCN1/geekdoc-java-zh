  md: 'A train soon appeared on the tracks ahead, clanking down the line with an industrial
    rumble. The driver could see me from some distance and his horn started to blast
    out with some urgency. But I was not moving.


    The tracks were trembling as the train hurtled towards me with terrible intentions,
    but I couldn''t care less. The horn blast was so close it shocked my ears, but
    I still stood, locked in a deadly game of chicken.


    Finally, I heard the driver slam on the brakes and the screech ripped through
    the air like a stick puff. Only, at the last possible moment, did I leap clear
    of the moving locomotive.


    This was no suicide attempt. I urgently helped. I ran up to the driver, who was
    leaning forward, his hands trembling with a distress that may have well given
    to an absolutely furious rage, I had not been able to bluff out credible defense
    for my quite extraordinary behavior.


    "My cabin is on fire! you''ve got to help me!” The driver steered right through
