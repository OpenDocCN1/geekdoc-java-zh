  md: '# Grim and Grizzly


    I had a feeling within me...a strange feeling that my home in Britain was not
    as at I had left it.


    I felt that feeling before, back when Roy and I had been wandering in the Rockies
    in 1979, but I had tried to force it to the back of my mind. After the plane touched
    down, and Roy and I had made it through customs, there were my brothers, Dave
    and Mike, waiting.


    I could see from their ashen faces that something was very badly wrong. They explained
    they’d tried to get a message out to me, but by the time they’d received a postcard
    with my whereabouts, and hastily written back to that location to try and share
    the awful news, Roy and I had already long since departed.


    I still wish I''ve somehow seen it coming. I wish I''ve known what was going to
    happen while I was away. My dad died from cancer and that was it. Both my parents
    had passed in the space of little more than a year. Mam to the heart attack and
    then Dad to a Cancer I didn’t even know he’d had.


    I’d missed his funeral and was overwhelmed with grief. Losing Mam had been absolutely
    awful, but I had buried my emotions as my brothers and lowered her into the grave.
    Just a few months later I was away in Canada with Roy, and I was able to distract
    myself to a degree, but now back in England, without them, there was nowhere to
    hide to.


    It hit me really hard, that did. I became deeply depressed and, for a good while,
    I believe I was quite lost. I didn’t write in my diary for a very long time. In
    fact, I didn’t do very much at all.


    ***


    There''s so long anyone can run from grief before they are eventually forced to
    confront it. My whole life was put on hold for a year. I was consumed by a depression
    until the day eventually arrived where I had to let all my sorrow in. I bought
    a bottle of whisky and cried it out.'
  merge: -1
  pgno: 44
- img_proc: true
  md: 'No matter the circumstances, losing your parents is hard. You never really
    get over it, least of all losing both almost back-to-back.


    I had to try and get on with my life. I had no money, the council were wanting
    to repossess my parents’ council house, my home, and putting huge pressure on
    me, and I was soon left with mounting bills from rent, gas, electricity and food.
    Escape had been at the forefront of my mind before I''d made it back to England,
    and was doubly so no. I wanted to return to the wilderness and stay there for
    as long as I could. Maybe I was running away from the reality of the situation
    I''d come back to, whatever it was, there was no way I planned on hanging around
    for any longer than I needed to. There was even less tying to be a life here now
    than had been before.


    I wanted to get back to the place where I had happiest, to go even further into
    the North American country than I had with Roy; but first, I needed to return
    to the building industry to work and save harder than ever.


    The three and a half years that elapsed from coming home with Roy, to finally
    having enough money to return to Canada, were quite possibly the hardest period
    of my entire life. To add to the grief and other difficulties, I was living in
    a squalid, damp-filled home, with a toilet that would not flush and pipes that
    burst from the frost over one terrible winter. It was the sort of place where
    your breath crackedled like ice: a three-bedroomed stone tomb.


    Trying to save, I invited in a lodger to help with the bills, but he turned out
    to be an alcoholic womanizer, who fled the home when one of his many "conquests"
    eventually discovered where he lived and served him up some well-deserved just.
    The only plus turned out to be—because it was often so cold—I had no waste money
    refrigerating the stock of hare, rabbit or wood pigeon I''d harvest with my rifle
    for a bit of extra meat. But that was about the only positive. The amount I was
    paying out in bills, even living as meager as possible, could have kept me in
    the Canadian wilds for months; but, working back in construction, I labored as
    hard as I ever had and saved everything possibly could.


    Finally, mercifully, the days of my departure came around again. I was thirty-five
    years old and itching for another adventure.


    ***'
