    to everything I''d learned about. Green wood is so full of moisture that you''d
    ordinarily stack in a pile to dry for a year before using as fuel, in the Canadian
    wilderness, using the Star Fire technique, it worked brilliantly. If the wood
    was totally dry, you lost all your control; it just kept burning, even when the
