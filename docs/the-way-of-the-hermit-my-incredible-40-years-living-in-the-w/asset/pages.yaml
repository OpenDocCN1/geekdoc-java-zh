    That marked my last hospital stay of any description for the next twenty-nine
    years. There''s something in that time, you know. The decades that follow were
    my most extreme, my most adventurous, my wildest, and yet nothing ever injured
    me enough to put back in hospital for a stay. The truth is, you are always more
    likely to die from something mundane in a very trivial-seeming domestic environment.
    It''s not when you''re hyper-alert and vigilant against risk that you end getting
    hurt, it''s when you least expect it. Beyond accident, the biggest killers in
    the Western world are the symptoms of our own perpetual boredom and dissatisfaction
    with life''s mundane direction. A slow death through the grinding monotony of
    a routine that does us absolutely no favors. Booze, gambling, just food, drugs
    or smoking, all accelerating us closer to the grave, demining our depression,
    de-pression, and stealing away the simple joys of being alive. Renting us back
    two weeks of annual holiday, and then having the check to tell us we should be
