  md: 'Almost forty years have now passed since that terrible experience but it still
    feels so raw.


    I had stayed in Ben Alder Cottage before during my many holidays in Scotland,
    and for a few nights prior to the disturbances, all without incident. I''d heard
    of the bothy''s reputation for being haunted, and it honestly wasn''t something
    that bothered me. There is scarcely an old building in the wilds of Scotland that
    doesn''t have a ghost story attached to it. So, knowing that I had to bed down
    somewhere that winter, and Ben Alder Cottage was a well-placed bothy that offered
    warmth, wood and decent fishing right on the doorstep, it seemed an obvious choice.


    The well-worn anecdote that the place was haunted by the ghost of a Joseph Cook.
    Cook was a former deerstalker and gh on the Ben Alder Estate in the early 1900s.
    He had lived in the cottage, and it was alleged that he''d hung himself from the
    rafters. Virtually everyone in the area seemed to know about it; it was mentioned
    in the guest book in the bothy itself, and people had written and spoken publicly
    about the hanging and subsequent haunting. I fully admit, it was poor Mr. Cook
    who I initially blamed for all the carry-on in Ben Alder Cottage that was not.


    Several years later, I came to learn that Mr. Cook had not, in fact, died in Ben
    Alder Cottage at all. While he was peacefully at rest in a retirement home in
    Newtonmore, though, the suicide myth prevails to this day. The true reason the
    legend of the McCook haunting became so pervasive was actually down to the storytelling
    talent of the estate''s head keeper and a local novelist. Working in cahoots in
    the late 1930s, they spread the myth to discourage would-be deer poachers A good
    ghost story, hoped, would be enough to put them off a night in that building,
    which was the only obvious place from which to launch an illegal nighttime assault
    on their animals. However, as the decades passed, the rumor stuck, and then it
    grew into something else entirely.


    Regardless of the origins of the hauntings, for now hikers have on record with
    their strange experiences from a night spent at Ben Alder Cottage. Some say they
    clearly heard footsteps in adjacent rooms that were subsequently found to be empty.
    Others spoke and wrote of how they heard footsteps coming right up the front door
    outside; or even an opening of the door, without anyone ever entering the bothy
    itself.'
