  md: 'I chased one out of the cabin only last week. Do you know what it did as it
    went? It looked me in the eye, cocked one leg, and urinated all over my doorframe.
    I’m certain it knew *exactly* what it was doing.


    Still, we all somehow muddle together in this wood. A little under forty years
    I''ve been living off-grid here now. My neighbors and I, together in this thumbprint
    of trees on the bankside of Loch Treig.


    You have to surrender to the fact that you''re not going to be the master of the
    land if you choose to live in a place like this. A bit of your food is a peppercorn
    rent to pay to be part of the natural order. Instead of constantly railing against
    it, it''s easier to embrace the most basic facts of the wild and share a bit of
    what you have. Mind you, there is a limit to the amount I can feed to my furry
    and feathered friends—and that limit is met, away it''ll go into my locked cupboards
    and secure tins.


    I''ll have a glass of my homemade beer tonight, I think.


    Something from the barrel and not the demijohn. Just enough to lubricate the mind
    for a few stories without becoming a boorish, drunken old fort.


    I turn the tap and it trickles out into my glass. It''s a beautiful tawnycolored
    liquid. All grown and brewed within a stone''s throw of this barrel. Can''t remember
    what fruit I brewed from this though. It tastes like an apricot. It looks like
    apricot. But is it apricot?


    Anyway. Here’s to the story of the so-called hermit of Treig. May he live long
    and all that. Cheers!


    (I’m not sure it is apricot actually.)


    ***


    People say I am a hermit, but it isn''t really true in the strictest definition.
    My dictionary says a hermit is someone who lives alone (true in terms of people,
    untrue in all of the other things I’m up here with), apart from the rest of society
    (mostly true, but not strictly so), and especially for religious reasons (depends
    on your definition of religion, I suppose, but it’s a bit of a stretch for me,
    I’d say).


    I know what they really mean when they say I’m a hermit though, what with my scruffy
    “Wildman of the Woods” looks and apparent isolation. I exist in the popular image
    of what you might think a hermit would look like and how a hermit would live.
    Probably, even how you imagine they’d talk, too.'
