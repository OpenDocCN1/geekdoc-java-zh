- img_proc: true
  md: 'The cat became an overnight celebrity; but this was no savage beast. Experts
    agreed that the female puma, soon to be named “Felicity,” had been in the wild
    for possibly less than forty-eight hours. She was well fed (the point of actually
    being quite overweight) and was found to be rather tame. Apparently, she was quite
    partial to having her ears tickled.


    Clearly, this cat was once a pet who was well used to people and being hand-fed.
    Felicity found a new home at the Highland Wildlife Park, but her story confirmed
    long-held suspicions that the 1976 tightening in UK law, the keeping of dangerous
    wild animals as pets, had seen the liberation of several big cats directly into
    the remotest parts of the Scottish, Welsh and English countryside.


    Over the decades, big cat sightings continued to trickle in, with lynx, puma,
    black panther and mountain lions all being in the frame at some point—but nothing
    undeniable as the capture of Felicity has been achieved again. However, as the
    campaign for re-wilding the Highlands continues to gain momentum, it hasn’t taken
    too long for the subject of the reintroduction of apex predators to be raised.


    Scotland was home to bears, wolves, and the lynx, all of which once played an
    important role in controlling the many herbivores such as deer and rabbits. Natural
    control could benefit the environment in theory, but any suggestion of small-scale
    pilot projects in the Highlands have met with ferocious opposition from Scottish
    farmers. It doesn’t feel like something that will catch on anytime soon. Still,
    isn’t impossible to imagine at least a few lynx being released on the sly at the
    hands of enthusiastic animal activists, just as has happened with the beavers
    that popped up recently in the River Tay.


    Felicity passed away in capacity in 1985. Her body was stuffed and remains on
    display in the Inverness Museum; but there is one Scottish predatory species that
    is so rare it really does border on the mythological. Armed with lightning-fast
    reflexes and sharpened claws; muscular, with thick fur and distinctive black and
    brown stripes extending down its body, the Scottish wildcat is the true Highland.


    This feline is no lynx or puma. At a glance, our wildcat could even be confused
    with a domestic tabby. The pure wildcat, though, has a larger, flatter head with
    ears that stick out to the side (instead of pointing upwards on the tabby). It
    possesses no white markings on its underbelly or feet (like the tabby) and is
    up to double the size of your average pet cat. But the'
  merge: -1
  pgno: 147
- img_proc: true
  md: 'biggest difference comes in its absolutely savage ferocity. This animal, the
    only native species of cat still in the wild anywhere in Britain, will comfortably
    kill and eat rabbits, hares, reptiles and birds. It will even eat roadkill. Their
    aggression is the stuff of legend—one eyewitness reported how a wildcat all removed
    the face of a German shepherd dog when; others even the very largest of specimens
    have taken down.


    One thing is certain; the Scottish wildcat is critically endangered. Its life
    is compromised to such an extent that the clearly identified populations cling
    on the quietest woodland edges of the Highlands. I have been extremely lucky to
    see them in my life, but all my sightings were when I was fifteen years old and
    working in Rannoch. That was a very long time ago, and the specialists say they
    are no longer viable in the wild, as fragmentation of their habitat, feline disease,
    collisions with cars, and especially, hybridization with domestic and feral cat
    species, marches them to the point of no return.


    Their solitary lives and elusive behavior make them extremely hard to spot in
    the wild than anywhere else. I can''t honestly say for sure that I have ever laid
    eyes on a Scottish wildcat at Treig. That''s probably as damning an indictment
    of their survival chances as anything; these isolated woods would provide perfect
    cover for an animal or two, but there have only been a couple of “maybe” moments
    during my decades in these trees.


    The Scottish wildcat spends most of its life alone and in silence; during the
    winter breeding season, a female wildcat may want to attract a male, and in 1993
    I did hear a feline call that was quite unlike anything else I have ever heard
