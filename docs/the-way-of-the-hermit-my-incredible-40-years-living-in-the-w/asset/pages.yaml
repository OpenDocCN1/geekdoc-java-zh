  md: 'It is quite terrifying how easy it is to make a mistake that winds up costing
    your life. I wrote before how too I was once caught out on that awful frost-bite
    walk from Kinlochleven; where I thought I was following people, that turned out
    to be deer; and how easy it is to give in to the voice that tells you to sit down
    and rest.


    So to reiterate: it isn''t always an avalanche, or some catastrophic event that''ll
    kill you; more often than not, it is toxic cold that just causes you to lie down
    and give in. It can happen in the most trivial-seeming circumstances too. I recall
    the story of a local man leaving a pub in Roybridge, just off the River Spean.
    The weather was bad, but all he had to do was cut across a field and he was home
    safe. When he didn''t make it, the alarm was raised and the search party headed
    out.


    He was found dead, sitting on a rock. He''d probably just dozed off and the frost
    had got him. Heartbreaking, but it happens more often than you''d probably imagine.


    # THURSDAY 6 NOVEMBER 1997


    Emmanuel, the man who shot himself on Ben Alder with a black powder pistol, has
    finally been identified...


    On extremely rare occasions, the lack of preparation is quite deliberate. It seems
    to border on the suicidal because that is actually what it is. I have heard that
    when people decide they''ve had enough of this life, they will often take to the
    mountains to end it all. A place where they feel happy at peace, alone, with little
    chance of being disturbed or discovered.


    I dearly wish that they hadn''t so desperately sad in their minds and lives, but
    I completely understand why they would come here. Of course I do.


    There have been a few poor souls who have killed themselves in these hills, but
    none created quite a big stir as the story of the young Frenchman Emmanuel Caillet.


    I saw that day. There was nothing untrue about him whatsoever. Just a normal man
    walking out for Ben Alder Mountain from Rannoch Station. I remember he was roughly
    shaved (I think he was wearing a hat) but that''s about it.'
