  md: '# Everything Is Gone


    You would be forgiven for believing that once the cabin was built, and the garden
    established, that life for me might be quite relaxing. Maintaining the cabin''s
    upkeep, the odd bit of tending to the crops, but still plenty of spare time to
    live out my imagined monkish, meditative, and hermit sort of existence.


    I''m afraid that''s far from true.


    Certainly, the build is the most intense period of work, but you never really
    stop working. Summer is always grueling physically, as you plant, harvest, prune,
    and stockpile wood ahead of winter; cooler months might be a bit more relaxed,
    but there is always something to do out here, and honestly, I think that constant
    engagement is one of the main attractions for people who choose to live this way.
    A rolling stone gathers no moss, as the proverb says.


    No matter the time of year, things constantly need to be replaced and repaired,
    or modified. Just take this building, for example. The timber in my walls and
    roof breathes, swells and contracts as the seasons change. Following Dick Probeeke''s
    traditional Canadian cabin-building method to the letter, the trees should be
    peeled and then laid to dry for a spell before they are used in the building.
    In Scotland, that is a pipe dream. It is never enough logs to fully dry out before
    you stack them into your cabin walls. The logs only start to dry out after they''ve
    been resting in the walls for some time, and as they do, they shrink, leaving
    gaps of up to an inch between each of the timbers.


    Now, that''s far from ideal when the rain, wind or snow starts to blast through
    the gaps from outside, but I did find a good natural solution. Sphagnum forms
    these wondrous carpets throughout wet woods like mine. You''ll find plenty of
    it growing in places where it is damp: peat bogs, marshland, heath or moorland.
    I gathered what I needed (it soon regrows again) and waded into it the gaps between
    the timbers. Its soft-but-tough structure meant I could really stuff it in tight,
    and often started to grow a little too, filling even more space and giving me
    a living wall.'
