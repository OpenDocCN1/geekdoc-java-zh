  md: '# Going Off-Grid


    When it came to my inspiration for the cabin build, and indeed, much of how I''ve
    chosen to live, the story of one man’s life stood head and shoulders above the
    rest. The remarkable narrative of Richard “Dick” Proenneeke’s life was immortalized
    in the 1973 book *One Man’s Wilderness*. It tells of how Dick first took to the
    remote *Twin Lakes* region of Alaska, breaking ground and constructing his own
    cabin back in 1968. I''d first discovered it when I had roaming the North American
    wilderness myself; an impressionable time for me anyways, but this book really
    set an example, and contained plenty of sound practical advice.


    Dick found the motivation for his own life-change in the same way I had mine.
    In fact, our experiences were remarkably similar. He too had grown weary of the
    long hours and intense blue-collar labor. According to the records, Dick enlisted
    in the United States Navy the day after the deadly attack at Pearl Harbor. He
    served there as a carpenter, spending nearly two years at Pearl Harbor before
    rheumatic saw discharged in 1945. After that, the pull of the American high saw
    Dick first traveled to the forests of Oregon, where he ranched sheep, he traveled
    even further north: right up to Alaska and the island city of Kodiak. In Kodiak
    he held down multiple jobs for very skilled hands—repairman, technician and fisherman—and
    soon gained a deserved reputation as a very fine engineer who could fix anything.
    For me, it was falling onto bed of industrial spikes that started the firing pistol
    for perpetual adventure; for Dick, it was a welding accident that almost left
    him permanently blinded. Following that, he took early retirement and immediately
    acted upon his dream.


    *One Man’s Wilderness* details his first sixteen months in Twin Lakes. It describes
    how he was flown in seplane and the steps he took to build his cabin by hand.
    It also details his many extraordinary experiences with the local fauna, his battles
    with the weather, and his great meditation on life in the company of those great
