  md: 'I have made that return journey for wood, on the very single footpath, over
    ten thousand times. Just walking up and back sees me cover a little over a thousand
    miles a year. Pretty mad when it''s all laid out like that, isn''t it?


    That wood is like an old friend. I know every inch of its skin. Its moods, and
    especially its temper; evidenced in all the splintered trees and craters where
    the roots of trees have been ripped clean from the ground in all the great storms
    past. My foot is molded to the footpath''s lumps and rises. My muscles feel in
    memory as I cross the small burn, hop the log, or pass the four-foot stone, its
    beams groaning with the quartz that crosses its surface in a patterning like a
    brain. I forged that track with my own foot and could walk it with eyes shut tight;
    and yet, there is always new growth in the wood and the potential to surprise.


    The change in the deepest details through the seasons is so unfathomably complex
    and would take many lifetimes to witness it all. It is like an old friend, but
    one who is immortal and infinitely multifarious; best enjoyed in the moment then,
    without worrying too much about what parts of the story you might miss. Carrying
    a great bag of logs will quickly take your mind all off that. You will soon get
    used to spotting the ever-changing minutiae when your shoulders are screaming
    and you are head down and staring at the mid thatches around your ankles.


    Today, it is mid-July, and the woodland walk is damp but dripping with life. I
