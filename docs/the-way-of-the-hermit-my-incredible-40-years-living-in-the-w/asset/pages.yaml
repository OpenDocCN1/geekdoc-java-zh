  md: '![](img/90e3ad6f339d96acf35967d192c02ce7_215_0.png)


    The toilet is half-constructed on the new cabin build and I look very stressed
    here. I had to construct the cabin under huge time pressure—winter was coming
    to the Highlands and I needed a roof over my head before the snow descended.'
  merge: -1
  pgno: 215
- img_proc: true
  md: '![](img/90e3ad6f339d96acf35967d192c02ce7_216_0.png)


    An aerial view of the cabin. Easy to find if you''re a bird, I suppose, but only
    a few steps into the curtain of trees could leave you scratching your head and
    wondering where on earth you were when on the ground.'
  merge: -1
  pgno: 216
- img_proc: true
  md: '![](img/90e3ad6f339d96acf35967d192c02ce7_217_0.png)


    The back of the "new" cabin, complete with a window, deer antlers and a small
    wind turbine that didn''t really stand up to the Scottish elements for very long.
    Working flat out, it would take me about six weeks to get the basic cabin structure
    standing—but the outbuildings, loch-stone pathways and gardens took many more
    months of hard graft.


    ![](img/90e3ad6f339d96acf35967d192c02ce7_217_1.png)


    A bountiful garden heaving with root vegetables, herbs and the shoots of future
    fruit and berry trees. There are few things more nourishing for your belly, or
    pocket pennies, than growing food for yourself.'
  merge: -1
  pgno: 217
- img_proc: true
  md: '![](img/90e3ad6f339d96acf35967d192c02ce7_218_0.png)


    My cabin has had to withstand some serious weather over the years. Huge storms,
    subzero temperatures, snow drifts, even the occasional heat wave.


    ![](img/90e3ad6f339d96acf35967d192c02ce7_218_1.png)


    The bath arrives on the shores of Treig. I hauled it up to the side of my cabin
    and built a small log burner around its base to heat the water. If it was placed
    next to some fancy luxury cabin you could probably charge a fair bit for such
    a well-placed tub, but luckily it doesn''t cost me a thing.'
  merge: -1
  pgno: 218
- img_proc: true
  md: '![](img/90e3ad6f339d96acf35967d192c02ce7_219_0.png)


    A stunning windless day turns the loch into a millpond-calm mirror. I fell in
    love with this part of the world from the very first time I came here, aged just
    fifteen, when I discovered a very special sense of freedom.'
  merge: -1
  pgno: 219
- img_proc: true
  md: '![](img/90e3ad6f339d96acf35967d192c02ce7_220_0.png)


    The view up the slope from behind the cabin, illuminated by a band of sunlight.
    The train track runs in the shadow beside the tree line and snow fills the gullies
    and creases on the mountaintops.


    ![](img/90e3ad6f339d96acf35967d192c02ce7_220_1.png)


    Home sweet home. I live a simple life but it is not without its comforts. This
    is my room, with armchair facing the fire and a piece of carpet covering the gravel
    floor. There''s a barrel of booze on the go in the corner, my calendar to keep
    the score, tins on the shelf. Perfect for a long winter''s hibernation!'
  merge: -1
  pgno: 220
- img_proc: true
  md: '![](img/90e3ad6f339d96acf35967d192c02ce7_221_0.png)


    Fish-and-chips made the Ken Smith way: a pair of fresh trout fillets and a pan
    of boiling spuds over an open fire. Perfect!'
  merge: -1
  pgno: 221
- img_proc: true
  md: '![](img/90e3ad6f339d96acf35967d192c02ce7_222_0.png)


    One of my store cupboards: tins at the bottom, magazines and reading materials
    at the top, and a whole lot of home-brewed wine in between! There are very few
    edible berries or plants that I haven''t tried to make into wine at some point.'
  merge: -1
  pgno: 222
- img_proc: true
  md: '![](img/90e3ad6f339d96acf35967d192c02ce7_223_0.png)


    Chopping timber for logs with an axe or chain saw is a never-ending but very necessary
    part of my life out here. A well-maintained log pile is vital for heating my cabin
    through the long winter and for cooking my food all year round


    ![](img/90e3ad6f339d96acf35967d192c02ce7_223_1.png)


    A bucket of freshly harvested homegrown spuds. If planted well, and correctly
    cared for, a single seed potato can yield me up to three pounds of potato to boil
    or fry. Delicious!'
  merge: -1
  pgno: 223
- img_proc: true
  md: '![](img/90e3ad6f339d96acf35967d192c02ce7_224_0.png)


    A crop of juicy raspberries successfully grown. Wonderful to eat raw, make into
    a jam or use as a base flavor for an excellent home-brew wine—I just need to make
    sure I get out there and pick ''em before the birds get to work!'
  merge: -1
  pgno: 224
- img_proc: true
  md: '![](img/90e3ad6f339d96acf35967d192c02ce7_225_0.png)


    The scarlet berries of the rowan tree burst through and mark autumn. The wood
    around my home has a mix of species, but mostly the larch and Scots pine dominate,
    alongside silver birch and beech. I''ve planted a few species of tree myself—hollies,
    plum, willow and especially maples.'
  merge: -1
  pgno: 225
- img_proc: true
  md: '![](img/90e3ad6f339d96acf35967d192c02ce7_226_0.png)


    A lovely smear of fat, likely from a recent bacon sandwich, thickens up in my
    frying pan. I try not to waste anything. Fat can be warmed again and used as a
    cooking oil—especially useful for adding a meaty flavor to bannocks, a simple
    handmade flat bread.'
  merge: -1
  pgno: 226
- img_proc: true
  md: '![](img/90e3ad6f339d96acf35967d192c02ce7_227_0.png)


    Here is a pine marten enjoying scraps off the bird table. He''s welcome to them,
    of course, but when he crosses the line and goes for the bounty in my meat locker,
    or worse, takes up residence in the cabin roof and soaks my ceiling with pee,
    then we have a problem!


    ![](img/90e3ad6f339d96acf35967d192c02ce7_227_1.png)


    There have been many times when the local birds have become so confident around
    me that they have actually come to my hand for food. This is a male chaffinch,
    just one of almost a hundred species of bird that I''ve recorded over the years
    here at Treig.'
  merge: -1
  pgno: 227
- img_proc: true
  md: '![](img/90e3ad6f339d96acf35967d192c02ce7_228_0.png)


    A red deer calf gets hand-fed some milk. Although the population of deer on these
    fells must be managed for the health of the herd and the wider environment, that
    doesn''t mean we don''t care about them deeply.


    ![](img/90e3ad6f339d96acf35967d192c02ce7_228_1.png)


    The culmination of a lifetime of careful study as an angler—at twelve pounds exactly,
    this giant ferox trout remains the Loch Treig record. I never came close to meeting
    a ferox of this size again.'
  merge: -1
  pgno: 228
- img_proc: true
  md: '![](img/90e3ad6f339d96acf35967d192c02ce7_229_0.png)


    A blizzard begins. There won''t be any birds visiting the bird table on days like
    this. All animals, including hermits, must seek shelter and wait for it to pass
    through.


    ![](img/90e3ad6f339d96acf35967d192c02ce7_229_1.png)


    Sometimes the rain falls so heavily that it looks like the surface of the loch
    is actually smoking. The sheer amount of water in the Scottish Highlands is what
    brings the land much of its beauty—but there are times when it feels like it won''t
    ever stop pouring!'
  merge: -1
  pgno: 229
- img_proc: true
