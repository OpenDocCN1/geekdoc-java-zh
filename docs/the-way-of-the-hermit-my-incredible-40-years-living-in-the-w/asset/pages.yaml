  md: 'gathered most of my timbers on a steep sloping bank of the loch, over by a
    burn that flowed down into a small bay. It took a little forethought and planning,
    but once I''d selected the logs I definitely wanted, I laid smaller logs in horizontal
    positions down the slope beneath them, to act as rollers. Next, I pulled the larch
    timber until its end was pointing directly down the rollers, and then I''d just
    let it slide out, and hopefully, under its own weight.


    If I got it right, I would scarcely pull the timber at all—it would roll its right
    down to the water''s edge. I''d then float it in the water, letting the loch take
    the load, and tie a rope at each end to pull and steer the timber on its mile-long
    journey back to the building site. Pulling them up the slope to the foundation
    took a fair more time and muscle, but again, I''d use the log rollers and get
    the whole thing done about one hour per timber.


    The next job was peeling. Bark seals a ring of moisture into the log that can
    leave them to rotting, so all that needed to come off. I started with just a hatchet,
    but soon found that it was taking far too long and doing a slightly rough job
    than I would''ve liked, so I was off on the walk to the shops for a specialist
    tool known as a draw knife. It has a long cutting blade, with handles at both
    ends, that you simply draw the log towards yourself, taking off the bark in one
    efficient glide. It was a deeply satisfying process that marked a period of huge
    progress without a massive investment of my time or energy. With the wood peeled,
    the difference day-to-day was about to be massive.


    First, I rolled the larch logs into position per the stick model. Two lay on the
    ground parallel to each other—were the front and back wall. Then, I bridged the
    gap between the front and back with two more timbers for the side walls. Those
    side walls were lifted at the ends and balanced in position on top of the ends
    of the front and back wall—forming four basic corners and a full floorplan footprint
    of the building.


    As Dick Proennecke once had, I decided to use the traditional "saddle notch" method
    of building cabin. This required me to cut two half-moon curved cup-shapes at
    each end of each log that were designed to support a timber from above. The notch
    needed to be wide and deep enough to fit snugly around the log that was being
    locked into the corner, forming an airtight and weatherproof seal that would compress
    tightly over time, as the'
