  md: 'I knew I needed to escape that system, and all its trappings, as quickly as
    I possibly could. I spent a couple of years working and saving, cutting back on
    absolutely everything, barring the very barest essentials, before the early summer
    of 1979 finally ticked around. I went around to all my friends and family and
    told them we would all be having a pint together in The Black Swan pub in Crich.


    I didn''t tell them it was going to be a leaving party, and that I''d decided
    to put a load of money behind the bar, and so it went all the people closest to
    me in the world filled that place and drank long into the night on my tab. I recall
    coming back to my place afterwards, filling up on my homemade apricot wine hours
    after the bell for last orders had been gone. Bodies everywhere, and plenty of
    pools of amber liquid puddled on the floor. The next morning it was a scene of
    total devastation in my front room. Luckily, it was all apricot wine, and the
    sign of a proper send-off. I said my final goodby then, thinking, quite reasonably,
    I''d see them all again when I was back. But I got quite wildly wrong. It was
    the last time I ever saw most of them and that marked the end of my life in Crich.
    Really, I suppose, it also marked the end of my time as a reasonably “civilized”
    and normal member of society.


    I knew, from the day I awoke from the assault, that my life had fundamentally
    changed. No matter what, I would never put myself in a position where one person’s
    actions could have such a terrible impact on my life.


    If I was going to be born again, you’d better believe I wasn’t going to live on
    anyone else’s terms but my own.'
