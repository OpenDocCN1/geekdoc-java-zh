  md: 'People talk about “footprints” on my radio in a way that means more than just
    a footprint made by your foot. What I will leave behind, the footprint of my life,
    only extends as far as the physical print of this cabin, and when I am gone, I
    imagine this place will be reclaimed by the natural world and it''ll all vanish
    into dust.


    What of the record of my life, though? I hope you''ve had a little bit of it in
    this book to carry forward with you, but the best thing you could ever do is to
    take the spirit of a life like mine and make it part of your own.


    This book won''t allow you to taste a wild berry picked straight from its bush
    after an autumn shower, nor will it bring you the joy of something homegrown from
    your own garden. It won''t give you the sense of self-confidence and comfort to
    be had from living simply and compassionately, nor will it provide you the connection
    with humans of the ancient past, by staring into flames sprouting from a lump
    of wood that you yourself have cut from a tree. All these are treasures woven
    deep into the fabric of this poor man, who has lived a life of richness that a
    millionaire could never understand.


    Don''t be afraid of letting down a greedy system that rewards fewer people than
    there are hermits on earth, or fall into their trap of making you believe that
    your future happiness rests solely on buying the next best expensive thing, or
    having the biggest shinyest whatever it is now, whilst your entire liberty is
    thieved away, alongside the rest of this planet''s resources.


    Those letters, piled up over there, all have a variation on how the writer wishes
    they could live like me, but feel they can''t. They are scared to make the leap.
    That is a battle between what is expected of them by the world that lives outside
    of their head, and what they really think and feel instinctively inside their
    soul. They suffocate the little voice inside theirs. The one that speaks the truth.
    That is the most important of all.


    Don''t be afraid of putting that voice first, from the very moment you hear it
    calling out to you. The true happiness is to be had from a real life lived in
    the real, world is already out there. It''s just waiting for you to pick it up
    and pull it deep into your own life''s story.


    I''ve told you once, I''ll tell you again:

    Go and do it now.'
