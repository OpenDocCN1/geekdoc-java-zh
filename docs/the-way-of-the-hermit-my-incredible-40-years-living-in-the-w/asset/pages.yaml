  pgno: 125
- img_proc: true
  md: 'I take from trees that have fallen in storms or have already died. That way
    I''m helping clear the wood''s floor for new regrowth, and there is a far greater
    chance that the tree will have dried a little in its death, making it much easier
    to burn. Once I''ve found an appropriate tree, I''ll use a chainsaw (when it''s
    working and I have the oil; if not, a saw) to cut it into logs, and a long-handled
    axe to split the logs into the parcels of fuel.


    You can''t burn water. It sounds like blinkin'' obvious, but you only need to
    hold a piece of fresh-cut wood from a waterlogged tree against a piece that has
    been given some time to dry, just to notice a marked difference in their weight.
    Superficially, they might look similar, but one is full of water and impossible
    to burn. Honestly, it scarcely matters how your fire is raging, you as well toss
    a wet sponge into the middle of it, if your next piece of firewood is soaked through.


    Depending on how long the tree has been down, dead and drying out, you might be
    able to burn its wood right away; even if it has lost much of its moisture, you
    should still pick your log, feel its weight, and have a look at the cross-section
    too. If it has been raining hard, you might notice the bark and surface layers
    have soaked in some water and are noticeably darker. As with the cabin build,
    these can be shaved off with your axe and the wood will still burn well, but if
    not (or if the wood is obviously still holding a lot of moisture), then you need
    to slice the log as normal and stack it on a covered log pile to dry out.


    This is a process called seasoning, and the time it takes depends on the tree''s
    species and when you were stacked in the first place. That''s why log pile management
    is so important. It isn''t just about the wood you stack for burning, it is about
    what can be burnt today, and knowing the various stages of drying for the rest
    of the split logs you have piled up. I have several separate wood piles on the
    go at any one time, with some wood I can use right away (like the closest to the
    cabin) and others that will be sorted into logs drying for three months, six months,
    a year, or even two years.


    When I''m not working out at the log pile, you can be sure I''ll be spending a
    decent portion of the day thinking about it. Managing the wood for the fire is
    something that never stops. Chopping and collecting wood is as much as a part
    of your life out here as in the trees and the trout in the loch. In wintertime
    this is critically important work that be'
  merge: -1
  pgno: 126
- img_proc: true
  md: 'completed before the bad weather arrives in earnest. Your life may very well
    depend on having a ready-to-use and large log pile close to hand. In really bad
    snow you can be trapped inside for many days up here, and not having the ability
    to warm the cabin when temperatures fall well below zero can be very dangerous
    indeed.


    There is ample here for one human to live a sustainable life if they are careful
    and responsible, but I know that if too many, even very careful, humans came to
    my wood, it would all disappear. Really, these thoughts should be a part of how
    we live in all our walks of life. A proper consideration for what we need to take
