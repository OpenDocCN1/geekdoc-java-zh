    of living differently voluntarily resigned. Dreams become something that they
    imagine they''ll find to do later in their life, or once they''ve retired. Good
    luck to them, I, and I really hope it works out, but that isn''t always how life
    is. I did my roaming when I was in my prime, and at retirement I immediately contracted
    cancer.


    Life is a gift, but it is fleeting and fragile. If you''ve got a dream, something
    you really want to do, and you have the means to do it, then you need to get out
    there and do it while you still can.


    Don''t let your life pass you by while you wait for some imagined “best time”
    in a future filled with so many unknowns.

    Go and do it now.


