- img_proc: true
  md: 'Often, my solo trip took me through British Columbia and the Yukon once more,
    and then north, far north, to the Arctic Circle, Canada’s Northwest Territories,
    then back to the Yukon; north again to Alaska, then once more to the Yukon. I
    had an open return plane ticket, so no fixed date to come back to the UK—the plan
    was to go where I pleased and stay away for as long as my funds would last. In
    the event, I was gone for a year.


    I bounced up and down the hinterland of the continental northwest, tracing the
    major Fraser and Teslin rivers, and traversing the mountain ranges. I trumpped
    over snow-capped peaks through the immense boreal forests, and met many of the
    legendary creatures of American folklore.


    Often, it felt like I was in an elemental wilderness that was still somehow capable
    of repelling man''s malign influence; but, for generations, outsiders had arrived
    in these lands seeking something. Some sought the promises of great riches in
    the gold rush; others wished to discover deeper about their true selves: a wild
    man survivor image, reflected back against the jagged mountains and vast lakes.
    That land is unduly indifferent to us. It cares not for our will; and for every
    man who found their fortune, there were many who left empty-handed, or who were
    never seen or heard from again.


    For me, my adventures in Canada and America were the most transformative of my
