- img_proc: true
  md: 'exponentially too. I felt free and experienced a rarefied sense of belonging
    that I hadn’t ever felt anywhere outside of the Scottish Highlands. Of course,
    it helped that I was in an awesome area of wilderness vistas: snow-capped peaks,
    turquoise lakes and enormous trees; and that Roy and I were traveling at a time
    of year when it was possible to live very just from that land’s natural bounties
    alone; there was an authentic raess to this way of life that was undeniably seductive
    too—addictive, even.


    Even the dramas the enormous electrifying and terrifying storms, the day Roy was
    hospitalized by bee stings, a car crash at the hands of a drunk driver, all our
    encounter with wild animals (more on that later...) added to the pure excitement
    of it all. It was intoxicating, invigorating, and utterly liberating.


    Our last six weeks were spent in the Rocky Mountains, but the weather was turning.
    The snow was no longer confined to the caps of the mountains and, as the mercury
    plummeted, so we crept in the snow, and then the rain. It was undeniably spectacular:
    a land of glaciers and towering peaks, the height of which we hadn’t witnessed
    before. We hiked as much as we could, but the nights were closing in and it soon
    became punishingly cold. With our tarp encased in ice most mornings, wild food
    was harder to find and, times, so was ice-free water.


    Returning towards Vancouver, the rain was relentless. My pockets were empty and
    my wristwatch was worn halfway up my forearm, such was the amount of weight I
    had lost. It had been one hell of a journey, but it was clear we were being ushered
    off the land by nature.


    It was time to head home.'
