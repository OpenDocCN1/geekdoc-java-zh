  md: 'maim!). Then there''s the best bit of all. The peace and quiet. There are times
    when it is hard work out here, and it can be uncomfortable, but it is an insignificant
    price to pay for peace. It is nearly always peaceful. The faint sounds of a lapping
    loch and the burn water tumbling down the slope. The hush in the trees, broken
    by the occasional train rattling on the tracks, a hoot from an owl, a honk from
    a goose; the death crackle of the last piece of wood as it dissolves into ashes.
    We do have our place in the natural order of things, but not the one we think.
    Our true place is lined against everything and everyone as an equal. We are just
    one creature in the great sweep of nature on the planet—and one realize how small
    you are, you realize how great you are; to be just another animal rewarded with
    the privilege of walking the earth.


    I wouldn''t profess to be better than anyone else and I''d never dream of telling
    someone else how to live their life. I''m not stuck up my own arse, believing
    what''s up there better than everyone else''s. I feel very sure of my place and
    what makes me happy, and I think a lot of people could be a lot happier.


    Some people spend their entire lives dreaming of finding freedom, of traveling,
