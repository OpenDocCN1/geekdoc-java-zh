    I have seen tens of thousands of deer in my life, both our native species—the
    red and the roe—and the regularly see fallow and sika. For a fouryear period from
    1993, I would regularly see a pure white deer in the hills above Tulloch. Any
    albino creature is an extraordinary sight, white deer was an exceptional place
