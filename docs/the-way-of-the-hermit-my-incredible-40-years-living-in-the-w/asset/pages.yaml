- img_proc: true
  md: 'Usually, you''ll see the signs you''re onto a winner fairly quickly. The sap
    will start to bubble up around your drill as you ease it on its way through the
    bark, and then it''ll dribble out in steady drops. Nothing comes out at all, plug
    the hole and look again in another week.


    If I''ve hit sap, I''ll push one end of my tubing into the hole and put the other
    end into my demijohn to collect the fluid. If you''re in luck, you might get a
    few liters of sap from a single birch; if you''re exceptionally fortunate you
    might feel even your demijohn; but, once I feel the birch has donated enough,
    usually after a day of dripping, I''ll cap off the demijohn with something porous
    like a wad of muslin or a bandage—something that helps all those sweet fluids
    breathe. It is really important that you carefully seal the hole in the tree you''ve
    drilled. You don''t want to leave the bleeding out all that sap that it has made
    for its good health, once you''ve collected enough to toast your own. I''ll usually
    mine up with a good wad of spearmint.


    Brewing the birch sap is pretty straightforward. First, I''ll pour it into a deep
    pan and bring it to a boil. This kills any nasty that might be hiding away in
    it. Your belly will be bad if you overdo it on the booze; last thing you need
    is diarrhea from some little bugger of a bacteria too. Once that''s done, take
    it off the heat and let it cool. Next, I dissolve about two pounds of sugar per
    half demijohn into the mix; sometimes I''ll squeeze in the juice of a lemon or
    two (if I''m lucky enough to have them). Finally, I''ll add my yeast. It is vital
    that the sap has cooled down by this point, otherwise the heat will kill the yeast.
    I''ll use a pack of high-alcohol wine. I used to buy them from Boots the chemist,
    but I get my friends to send away for them now, using the "internet." With the
    yeast sprinkled on, I''ll return the mine to a demijohn and fix a bubble-trap
    valve and leave it for a year before cracking it open and having a party.


    You probably have gathered that there are very few things, whether flower, fruit,
