  md: 'She read them all loud. One by one. Then found another fistful. “And these
    are all your birthday cards.”


    She gently held my hand and fixed me with her eyes once more. I’d had four operations
    on my brain. Nine hours under the knife, and almost two weeks in a coma.


    “Tomorrow, Mr. Smith, is your birthday. But today. Today is the day you were reborn.”


    # 17 JANUARY 1975


    I went to hospital on 14 Oct 1974...

    I was seriously ill and was dying fast. The doctors gave me four serious operations
    on the brain with a small chance of living...

    I hope now I continue to recover and soon I hope entries in my diary are entered
    in joy, for besides the doctors, it is God saved my life, and I thank them all
    for the help they have given.


    The road back towards full health was set to be a long one. Not only could I not
    walk or speak, but I’d also lost two-thirds of my memory and could not write.
    The consensus among the doctors was that I might never recover. That my injuries
    were so profound that a degree of disability was going to be with me forever going
    forward. That, was not how I decided to see out the rest of my days. I had been
    gifted a second chance at living and I set to my rehabilitation like a man.


    I was determined to prove the doctors wrong, and so, thank goodness, were the
    nurses who cared for me. Every day one of them would come to give me encouragement
    to try and get a little bit of my movement back. At first it was for five minutes,
    then ten, then twenty; but slowly, working together, we got there.


    At first, I only focused on controlling the little things that I could. Incremental
    daily improvements in my physical state and well-being: wiggle my toes today and
    don’t worry if you are going to get up and start walking around tomorrow. Repetition
    and discipline slowly paved over the significant cracks in my broken mind too.


    The first challenge was getting well enough to get out of hospital. That took
    a fair few weeks in itself; then I had to salvage my memory and learn how to write
    and talk again.'
