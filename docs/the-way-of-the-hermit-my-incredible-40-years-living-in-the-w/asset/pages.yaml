  md: 'be enough for an army. Just counted ''em—sixty-three gallon of wine and three
    barrels of home-brew beer.


    I''ve already told you how I cultivate a few berry and fruit species in my garden
    specifically for my wine-making, but I''ve also foraged a fair few species in
    the wild for the same boozy purpose. The blossoms from rowan trees, roots of nettles,
    jack-by-the-hedge (also known as mustard), the pretty pink flowers of the rosebay
    herb, horsetail weed, even the yellow flowers of wild gorse and the purple heather
    flowers—all have been collected by my hand and brewed at some point in the path.


    One of the finest wild foraged ingredients for the wine, in my humble opinion,
    is the sap of the birch tree—and to get that, like a miner prospecting for oil,
    you''re going to have to get drilling.


    Now, there can be no hanging about when it comes to tapping a silver birch for
    its sap. It''s not like berries, roots or flowers, where you might have weeks
    on to complete your work. With birch sap you might only get a fortnight, or three
    weeks at a stretch, to complete your tap and start pulling near the silverine
    trunk of the birch. Usually it is somewhere around early spring, depending on
    how warm it is out; but this isn''t seeing a flower, tree, or bush in fruit or
    bloom, and thinking: "Oh, now''s the time to go for it." No, knowing when and
    where to tap is not easy as that, I''m afraid.


    Birch sap is a solution of water and sugar that is held within the tree''s trunk.
    Trees pull in water through their thirsty roots. Most of that will evaporate through
    its leaves, but for the birch, a little of it gets made into sugars and stored
    for the winter. Now, as soon as the tree senses spring is coming, up the tree
    takes all water and that store of sugar flows, giving the energy that the silver
    birch needs to start shooting out its fresh leaves for the warmer months. That''s
    the moment you start your tap.


    With the early spring birds chirping in the background, and all thanks God we
    made it it through another winter, I''ll be shuffling through the woods with a
    glass demijohnion, tube and hand drill. I''ll be looking for a silver birch with
    a foot-wide trunk, or preferably wider. Next, I''ll clear the drilling area at
    about waist height, ease off any moss from the creamy-white pap bark of the birch,
    and then start to drill a hole, on an upward slant, a couple of inches deep into
    the trunk.'
