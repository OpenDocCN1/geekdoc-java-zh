    right through to a downright disgust, wider humankind’s environmental destruction,
    our predilection for warfare, our generally regressive political directions and
    increasing disregard for others. All fair enough, I but in modern times I''m afraid
    its various manifestations have given the formerly good word of the hermit a very
    bad name indeed. More often than not, introversion and seclusion, the fundamental
    character traits of the hermit, become closely associated with those who have
    a real visceral anger and forced hostility towards humankind. I hear about them
    on my radio from time to time. People describe us as “lone wolves.” These hate-filled
    fellas who get guns and knives and occasionally go out on these awful killing
    spells.


    This is absolutely not the way of the hermit, and is a dreadful smear on all those
    who prefer the quiet life—all introverts, as well as hermits and recluses. This
    violent phenomenon has taken the former idea that we are gentle, and wisely enlightened
    people, quietly and peacefully engaged in secretive thought, and then bastardized
    it as simple time for us to manifest our menace. According to that typeface, some
    of us are all weirdos, and at worst potentially dangerous criminals. Today public
    opinion and speculation often paints the hermit, in all its guises, as someone
    should be feared and avoided; no longer a person to venerate, and certainly not
