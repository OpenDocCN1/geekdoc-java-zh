  md: 'I don''t mind being called a hermit, it makes me laugh, but am I really a hermit
    in the truest sense?


    For a long time, I was more of a homeless nomad—“The Tramp of Treig” rather than
    “The Hermit of Treig.” A vagrant who haunted the local mountain bothies and existed
    as legend in the visitors’ books that were kept in isolated huts. Whispering of
    this odd fellow written in pages sitting up on the shelf; the unofficial bothy
    lying among the cobwebs, puddles of candle wax, empty gas cylinders, and all the
    other useless and unwanted crap that’s been left behind by generations of hikers.


    It wasn''t 1986, the year before my forti birthday, that I was finally granted
    permission to build this cabin in the woods. When I found my home, and my hermit
    identity evolved and arms and legs all on its own.


    I don''t shun the outside world at all. Quite like most people and very much welcome
    company of the few close friends and family who come to stay and get away. Every
    few weeks I''ll hike out to the local shops for supplies, and get my post, too.
    Am no stranger to a pint or two at the pub eater. It is that I prefer to meet
    people on my terms, or rather, I like to be in control of my own day; deferring
    only to what the weather wants to do or what the seasons have in store; how I
    feel, rather than bending to the wills and whims of other humansoid. If you can
    grant me that, then you can call me a hermit as much as you and you''ll always
    be appreciated, and that''s about it.


    Well, it isn''t really. There are some obviously hermit-like behaviors in the
    way I choose to live. My log cabin in the woods has no clear path to its doorway.
    It emerges from the trees when you are only a few paces away from it. In fact,
    if you didn''t enter these woods knowing I was hidden in here, you''d likely miss
    my place entirely; but again, none of that is because I don''t necessarily like
    people.


    It is quite funny how incapable we are as a species of seeing anything from any
    other perspective than how it might directly relate to us. My decision to immerse
    myself in this place is not based on pulling away from all of you, rather is to
    give myself wholly to this wild space instead. To be a part of the nature, not
    forever set apart from it in some sanitized domestic setting, with all its noise
    and problems.


    I came here to find solace. A sanctuary of sorts. A deeper understanding of what
    this part of Scotland really is. Warts and all.'
