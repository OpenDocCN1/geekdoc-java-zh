  md: 'Despite that single monstrous trout, the biggest fish in the loch by far are
    the pike; and, of all the native freshwater fish that swim through British waters,
    the pike sits as the top dog. The true predatory king.


    In Latin, the northern pike’s name, Eso lucius, translates literally as “water
    wolf.” It is a well-chosen label for this fish, given their entire being is tailored
    towards remorseeless killing and eating. They are elegantly camouflaged, with
    mossy green flanks mixed with creamy yellow spots and stripes, and with a rear-loaded
    tail-set, perfect for explosive forward momentum and ambush. Most ominous are
    their fang-felled jaws, which sit inside an arrow-shaped head placed at the front
    of a long, streamlined body. Those teeth are razor-sharp, but they are backed
    up inside the mouth with bony pads that contain rows of yet more teeth. That cavernous
    mouth is the last thing a hapless fish will see, right before they are clamped,
    instantly split across, turned and swallowed whole.


    They will happily kill the living as they devour the dead and decaying; and, as
    such, they have a lot of responsibility for maintaining the health of any ecosystem
    where they are present. I have eaten Treig’s pike in the past, but mostly it is
    a fish I avoid. That is partly because killing off such an important cog in the
    wheel would be a mistake, but also because an average-sized pike would represent
    more meat than one man could eat in a single sitting, and there few sins worse
    than throwing out meat that you haven''t been able to finish.


    Amazingly, a pike of the same weight as my record trout is only really a modestly
    specimen. Pike have been caught in Treig to almost thirty pounds, and the world
    record is double that. These are truly giant fish, with heads like a prize bull
    and bodies thick enough to place a small saddle across and ride. If I ever am
    tempted for the fish, it will purely be to catch, admire, and slip them back to
    fight another day. Pike fishing is as close as I’ll get to please fishing. No
    mistake, though—there can be moments of absolute heartbreak, when fishing for
    that, especially if big fish are involved.


    I have been blessed with a lot of great fish throughout my life, but as the famous
