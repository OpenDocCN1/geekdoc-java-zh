  md: '# Canada, The Great White North


    My first trip to the high country of America and Canada came in May 1979 when
    I was thirty-one years old. Back then, I had a very loose plan to travel 2,000
    miles through Canada via British Columbia, the Yukon, and their portion of the
    Rocky Mountains. My great Scottish friend, Roy Stephen, had quit his job at the
    Fordoun sawmill to join me, and the grand, six-month adventure would leave an
    indelible impression on us both.


    Roy and I had spent many of our holidays working together in the Scottish Highlands;
    but there was always pull to try and learn more, to truly test ourselves, to find
    a place that was bigger and wilder than anything we could ever experience on our
    small island. The iconic mountains and forests of Canada would provide all that
    we sought—a wide-open place to be released, to feel truly free. What we couldn''t
    have known was that it really be all that, and so much more too.


    We walked until the soles dropped off our boots, hitchhiked as much as we could,
    and dipped into our pockets for a bus fare when we were truly out of all other
    options. There were only two nights when we didn''t sleep outside under a tarp
    or starting at the stars. We carried everything we needed on our backs, and learned
    to cook all our food over an open fire.


    The experience was profoundly inspiring but, when I arrived, I was brimming with
    the most brilliant brand of misplaced self-confidence, probably suffered by most
    young men on their first grand expedition away from home. So, the learning curve
    was steep for both of us and, in the cool of the high north, we were in for a
    baptism of fire.


    It was the evening of our first day in Canada and we''d already traveled about
    seventy miles from Vancouver, over the Fraser River, and into an area somewhat
    ominously called "Suicide Creek."


    Roy made camp, and I took a wander upstream to go fishing. I hadn''t made too
    many casts when I spotted a man leaping out of his truck and headed my way at
    some place. Assuming I''d broken some local fishing law, I did the honorable thing
    and immediately did a runner. Back through the bush, through an area of marsh
    and fallen logs, for about half a mile down'
  merge: -1
  pgno: 39
- img_proc: true
  md: 'the creek, and back out onto the road; where I was immediately apprehended
    by a simply enormous human and his very lively looking German shepherd.


    “What’s going on there then, and where’s your identity?” bellowed. This man-mountain
    was, in fact, a Mountie, member of the Royal Canadian Mounted Police. He didn''t
    have a horse, just which someone of my size probably could’ve ridden, if they
    were in an utterly suicidal cod. It loosely roped to his wrist, and appeared particularly
    keen for some fresh Derbyshire meat.


    I came with my fishing crime, and he looked at me as if I was some sort of bluffier
    idiot. “Son, you don’t have to pay to go fishing in these areas,” he declared,
    waving a hand across the almighty expanse of backcountry, and even if you did,
    can you imagine a billi own accent whatsoever to police this place? It would be
    impossible.” I discovered then that any explanation of wrongdoing in any British
    accent as thick and northern as mine, was an instant passport to an extraordinary
    degree of leniency, especially when backed up with an actual British passport,
    which I only too hastily produced as the Mountie continued to flex his muscles.


    I marched back to the camp with Roy, and it was explained to us both that the
    reason for him turning up was a local farmer had spotted me fishing in the river,
    and had tried to warn me about a cougar that had just been spotted prowling in
    the area. They had only recently sent out a hunter and the wildcat had killed
    both his dogs, the conscientious Canadian just wanted to let me know, lest I be
    on the menu next. But I’d simply run off.


    That caused the farmer to panic, and it turned out there were also two convicts
    in the viceta. That brought the call to the mounted police and usher forth my
    muscular new friend and his dog. We soon settled it all with the Mountie and were
    left to sleep beneath a derelict shed (which I presume was somehow cougar-and-convict-proof),
    honestly, we had scarcely been in Canada twenty-four hours and there were: camping
    in the wilds, prone to animal and criminal attack and, thanks to me, already in
    trouble with the law. It suddenly seemed a very long way from home…and and it
    felt absolutely bloomin’ marvelous!


    Our adventure through Canada continued. Days became weeks, months, and I had never
    been so happy. We moved north to Cache Creek, a'
