  md: 'Out went the trout, under went the float, and on went my finger. I felt the
    trout move across the depths, being gently pushed along by the water flow as it
    exited the Gaur''s mouth and entered the loch proper. Initially, the fish swung
    smoothly across the water, just as it had all day, but then I felt a sudden tightening
    on the line. I released my finger and watched, in some astonishment, as the line
    purposely persistently peeled off my reel.


    Something down there had picked up the big trout, and was now heading out into
    the loch with it.


    “Oh!” I exclaimed aloud. “There’s one on!”


    I felt my heart leap as the line continued to trickle before me, knowing that
    the only fish capable of inhaling a trout such was likely to be a very big fish
    indeed. My hands started to shake, but this was no time for panic.


    When a pike takes a fish to eat, it first grabs lengthwise across its teeth and
    moves away with it. Only then will it start to turn the fish in its mouth before
    it swallows, usually head. What means as an angler is that you don''t strike straightaway,
    as the hooks won''t properly be inside the pike''s mouth. You give it some line
    and you wait until it has turned the bait and is about to swallow, and then you
    strike. Strike before, and you are very likely to lose the pike; strike too late,
    and you are risking the pike swallowing the bait, and your hooks, deep down its
    gullet. You don''t want that either. The hooks will be very hard to remove and
    you could easily end killing the fish by doing fatal damage to its throat.


    Practice and experience teach the optimum time to set your hooks. The line spilled
    from my reel beautifully, before I knew, I looked up and realized it had gone
