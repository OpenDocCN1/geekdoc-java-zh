  md: 'Food poisoning from a bit of meat that had gone off made me extremely ill on
    one occasion; then, on another, I thought I might have inhaled a puff of weedkiller
    the sprayers up on the train line. Both brought awful diarrhea I dared not cough.
    I scarcely left the Bottomless Pit for twenty-four hours and I lost so much weight.
    The almightiest effort to haul myself to the doctor for those courses of antibiotics;
    but mostly I''ll grit my teeth and it goes away on its own, and I''ll try and
    fix myself.


    Quite recently, actually, I became aware of a scratching sensation on the inside
    of my eyelid. I had a look in the mirror and, would you believe, I could see a
    tiny stump of metal sticking out of my eyeball. I got a pair of tweezers and teased
    out a small splinter. I''m sure it cut off my axe when I was splitting wood merry
    moons ago. I taped it into my diary to keep and my eyeball healed just fine. Some
    people have tattoos as permanent reminders of moments in their life, but I have
    a body filled with lumps, bumps and scars. A tapestry of time spent out, carved
    into my own skin.


    It can get ugly at times, but it is part of the trade-off to live in all this
    beauty, and it teaches you very serious lessons in self-care and self-reliance.
    Above all, your level of risk needs to be managed as much as possible, and that
    starts with shutting up the voice that says, “It’t wont happen to me.” It bloody
    well. So, take responsibility for yourself and do everything you can avoid that
    trip to the doctor’s in the first place.


