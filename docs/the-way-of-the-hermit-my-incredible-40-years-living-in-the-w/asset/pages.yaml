  md: 'Let’s get it out of the way. The toilet. Outside I have a long drop toilet
    called the “Bottomless Pit.” It is not bottomless, of course, but the long drop
    design, and mostly single-use (bar one or two contributions from friends) means
    that it is not really that smelly at all, and the waste can be used as a fantastic
    manure. It is a simple log construction over a deep hole. Perched on top is a
    box with a toilet seat, and that’s about it.


    Cleaning out the Bottomless Pit can be hard and mucky work, though; a throwback
    to the “gong farmers” of Tudor times, where people were employed to head into
    the pits of a toilet, long after, to scoop out all the contents. Argh. Okay, it’s
    not that bad doing my dirty work. I’m being a bit dramatic. Those gong farmers
    of yesterear were likely dealing with thousands of arholes, and not just their,
    plus their poo-dupped to their waists and were even however to suffocate and die
    from the odor and lethal gases. Death in a pool of poo. It doesn’t get much worse
    than that.


    They were tasked with properly disposing the feces too, often taking them away
    for use as fertilizer on ornamental gardens and fields. I’d heard the penalty
    for not getting the disposal right was to be buried in poo and then made to stand
    in public with a sign detailing your crimes.


    Yup. Cleaning my Bottomless Pit was definitely not so bad.


    Moving on happy details: water. So, in terms of a fresh supply, water, I am naturally
    blessed here with an abundance of fresh, clean water. Obviously, there is the
    loc close by, but the benefit of having the cabin located by a running burn is
    that just a length of pipe (handily placed at the base of a small waterfall) on
    a downwards angle, with a tap at one end, gives me the convenience of running
    water all to my back garden, without having to haul buckets up and down the banks
    to drink, cook, wash my clothes and myself.


    The gardens, fence and borders took some considerable time to complete. Forty-one
    of Treig’s slabs and almost four thousand pounds of gravel went into the pathway.
    The path was then bordered with old, discarded fencing poles, and I then just
    filled the area with soil for the garden; but I’ll tell you about the garden and
    vegetable patch later on.


    In terms of interiors, I found an old cast-iron stove and a drainpipe for a chimney
    in an abandoned hut, and made all the planks for my furniture—the doors, cabinets
    and cupboards—myself. I’d find the stool of a dead pine tree and cut the planks
    of wood I needed on site. I would roughly dry'
