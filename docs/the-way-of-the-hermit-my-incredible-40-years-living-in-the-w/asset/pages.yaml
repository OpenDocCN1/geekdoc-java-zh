  md: 'It isn''t just money, though. Keep your eyes on the land and you''ll be amazed
    at what you might find. I''ve found sacks of coal, old stoves, building materials,
    tools, deer antlers, fishing tackle, everything from clothes to sleeping bags
    to food and even booze. One of the finest the time a tough fortnight was punctuated
    by a bottle of high-quality malt whisky coming into my hands. It had been carried
    across the loch by the waves and wind, before gently tapping into my bank, like
    a gift from God.


    I don''t always take everything I find. You have to use your judgment. If I ever
    find something that can go back to its owner, or if I think the owner might ever
    coming back to it, then I''ll hand it in to the police or leave it be. If once
    found a whole chest filled with brand-new high-end tools while on my travels on
    the Alaska Highway. I reported to the police and it transpired that they had been
    stolen from a man''s home back in Johnson''s Crossing, some two weeks previously.
    The thieves had hidden the cache roadside with the intention of coming back to
    collect it, but I''d found it first and managed to get the whole lot back to owner.


    I used to do the Football Pools, a sort of equivalent to the lottery, based on
    football results, where you can win up to £3 million. I kept the payments for
    many years, then one day, I had to ask myself, quite honestly, I was doing it
    for? I don''t want any more money in my life. I''ve already got everything I could
    ever need, and I have no idea what I would do with three million kind. They still
    tell me kind. The ones with Mrs. Such-and-Such holding a giant cardboard check
    outside their house in So-and-So. Can you imagine how daft that photo would look
    if I was holding a giant check standing outside my log cabin in in the woods?
    The interview would be even worse. I''d have to say I''m not leaving my home and
    I''m not going on a fancy holiday or buying a posh car as I can drive. I''m not
    even going to bother getting electricity or plumbing. Still, I could do something
