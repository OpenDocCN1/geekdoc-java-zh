- img_proc: true
  md: 'near to shops, instead choose to do it all without leaving home? Is that really
    how we are supposed to live these days? Without seeing a soul, having a conversation,
    experiencing life outside? I''ll go down to the shops, hitch a ride, have a chat,
    get a backslap off old mates, sample a pint, maybe; and yet I''m the one who''s
    supposed to be the antisocial old hermit. Odd, isn''t it?


    That trip to the world outside is a big adventure. On a shopping day I''ll rise
    before dawn, usually at three four o''clock in the morning. I''m a lucky person
    in that I don''t need an alarm clock. Before bed, I''ll just say to my body, "Right,
    we are up at three a.m.," and at three a.m., I''ll wake.


    I''ll almost walk the first eight miles, northwards through the glen before climbing
    up and onto the A86. I could just pick up the train a couple of hours'' walk away
