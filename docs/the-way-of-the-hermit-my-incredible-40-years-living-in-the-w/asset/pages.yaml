- img_proc: true
  md: 'I couldn’t keep Simon. As much as I would’ve liked to, and as much as his injury
    necessitated care, I could tell within his little heart that he longed for the
    freedom of the wild. It is all too easy to project our own will onto nature, to
    imagine animals as we imagine ourselves. Often, we do this to fill a void in our
    own lives and, in doing so, we unwittingly deprive nature of the right to behave
    in its most natural way.


    The odds are stacked unfathomably high against a bird that cannot fly, even one
    as tenacious and intelligent as a hooded crow, but I knew I was doing the right
    thing as I released Simon from his cage early one summer’s morning. He died on
    his terms rather than in a cage. Me, of all people, had to understand that.


    I didn’t think I would ever see Simon again, and assumed it wouldn’t take long
    before a fox picked up what would be a very easy meal. A fair fight, hooded crows
    can actually live for sixteen years, but I didn’t hold much hope for Simon. Then,
    to my utter shock, three years later, we were reunited.


    I was on travels and just come across the carcass of some animal that was picked
    up and consumed by a murder of hooded crows. As I approached, they all flew, bar
    one—a bird with a broken wing and no fear of me whatsoever. I walked right up
    to the crow and we looked each other in the eye. “Hello, Simon,” I said, and sat
