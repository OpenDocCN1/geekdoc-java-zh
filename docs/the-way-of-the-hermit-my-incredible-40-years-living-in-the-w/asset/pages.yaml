  md: 'We had left the cabin together to collect logs late one morning. It was a wet
    start to the day, with that misty sort of rain that clings to your clothes and
    soaks right through you in seconds. There were globs of cuckoo spit on almost
    every clump of grass, and a wind pushing some white waves right along the surface
    of the loch. It wasn''t the sort of day where you delay yourself whilst on a task,
    but—pressed directly into the mud outside my front gate—was one of the most unusual
    animal prints I''ve ever encountered.


    It was very large, seemingly five-fingered, with long claws and a narrow pad.
    The closest animal in size would be the badger, but it was far too narrow in its
    shape, lacking those heavy paws set into the soft of foot. Superficially, it was
    similar to a gray squirrel, but at five inches from claw-to-heel it cleared from
    a far larger animal. Later, we found a flattened area of grass that was just as
    my garden fork. A real mystery, with no further pugmarks in the mud, and just
    that single patch of crushed grass, it wasn''t something we were likely to be
    able to solve.


    Wild calls and flashes of animals that you couldn''t place. Living here, you soon
    got used to the mystery of the world and must accept that, to a large degree,
    you are not going to know it all. Mind you, just because something sits in the
    box marked "unsolved," it doesn''t mean you start blathering about your brush
    with Big Foot. Especially when a perfectly ordinary explanation is still most
    likely. You don''t immediately and completely discredit the extraordinary, either—if
    a puffin can come to the dam and an alpine deer can wander about the local hills,
    what else might be possible?


    There''s only one hairy sasquatch-like humanoid in my small patch of wood—and
    his name''s Ken Smith—but very strange things have happened in the wider Scottish
    Highlands, some of which proved to be wild than fiction. The most famous case
    came after a few years of consistent reports of a big cat roaming the Cannich
    countryside, some forty miles north of here.


    It all began in 1976, an elderly resident claimed to have seen a big black cat,
    and followed up with several more sightings around the forest near her cottage.
    Other reports trickled in, but no credible evidence was found until October 29,
    1980—the day after my birthday, in fact—when local farmer Donald “Ted” Noble baited
    a trap with sheep''s offal, and quite sensationally, captured a huge puma.'
