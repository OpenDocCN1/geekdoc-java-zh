  md: '# Derbyshire Boy


    I was born on October 28, 1947, in a small house in the village of Whatstandwell,
    Derbyshire. It sits close to the River Derwent, about five miles south of Matlock,
    with the Cromford Canal running right past it. I believe that canal was the main
    navigation to and from the sewing mills that had their heyday during the industrial
    era, but these days, most comings and goings are either along the B-road that
    joins Whatstandwell to the A6, or the small train station stop, just on the village''s
    fringe.


    I say village, but back in 1947 it was little more than a row of stone-built,
    slate-roofed terraced cottages. Hardly even a hamlet. In those days it was only
    your dad who worked, your mum stayed at home to look after the kids and do all
    the housework. My dad worked at Lea Mills spinning mill, which made fine knitwear,
    and later he went on to work at the wires, walking the canal towpath to and from
    work on a six-mile round each and every day. Before the mills he''d worked in
    the Royal Navy, and Mam also being a Wren, a member of the Women''s Royal Service.


    I was one of four. Brother Dave came first, born during the war, then came Mike,
    me, and finally my sister, Patricia, who we called Trisha. Trisha and Mike are
    still here, but my brother Dave sadly passed away. We were close and played together
    very happily, but the house I born into was not a nice place. I cant remember
    huge amounts of detail about the inside, we moved away when I was still young,
    but I knew I didn''t like it there at all. We rented off a wealthy man who lived
    in a luxurious mansion somewhere nearby, but sadly the living standards of his
    tenants were in marked contrast.


    Still, we were the lucky ones. We were the house at the top of the row and detached
    from the rest of the terrace. The posh house of the lot, or more accurately, the
    least worst. Not only were we detached, we were the only with our own private
    washing block. The washing block was this square lump of concrete with a large,
    cup-shaped copper tub inside. Us kids would go down to the well, where all the
    residents would draw their water, and then carry it back to fill that up. The
    water was heated'
  merge: -1
  pgno: 14
- img_proc: true
  md: 'by a fire built with logs chopped by Dad in the local woods, which like the
    water, had to be carried back up to the block by us children.


    When the water in the copper tub was not enough, we would have our bath. It was
    Mike and David first, then Trisha and me. Work shared, so was food, water, muck,
    and head lice. My upbringing taught me the value of hard work from a very young
    age, but there''s not a whole lot of romance about that of life. It could be a
    very hard existence, especially for my mam and dad, but it was also pretty typical
    of how working-class people were expected to live after the Second World War,
    and we were very happy for the most part.


    We mucked along together. There was a lot of camaraderie in that community. A
    sense that we were all in it together. You knew everyone on your street would
    help each other back then. If you were short of anything, food, soap, even a bit
    of cash, it was always there to be borrowed. You just found ways to split and
    share the little you, and make it go as far as possible. Mind you, I can''t personally
    remember helping out as we toddler. I do remember blocking up their keyholes with
    bread when they were all off down at the pub, though!


    ***


    Our house wasn''t inhabited by people. There were ghosts, too. Most children had
    a happy early memory. A hug from their mam, a favorite bit of food, maybe a holiday,
    but mine was waking up in the middle of the night to the sound of someone stroking
    my hand. I opened my eyes to see this man in suspenders, with a little boy stood
    right to me, both standing over me.


    It was far from a one-off occurrence. I recall it several times during my childhood,
    but strangely, I was never once scared. I didn''t shout out. I didn''t bury my
    head in the sheets. I just lay there watching them as they watched.


    One day though, we experienced something as a family that really did unnerve us.
    Mam, Mike, Dave, and I were all down in the wash block. Mam was the steps trying
    to get clothes washed and kids were left to our own devices at the bottom. In
    the corner of the room sat this small three-wheeled trike that all the children
    used to pedal around while their parents did the washing. Unbeknownst to us at
    the time, that tri had'
  merge: -1
  pgno: 15
- img_proc: true
  md: 'actually belonged to a young girl who’d fallen into the well and tragically
    drowned.


    That day, while we were all happily playing, the bell of the trike started ringing
    all out on its own. We looked over, absolutely struck dumb, and suddenly, it began
    to pedal right after the washroom floor.


    That was quite enough for our poor old man. She was horrified. “Blow the washing,”
    she cried out, before bounding down the steps and rushing all into the house.
    It would be many hours before she eventually built up the courage to go back to
    the washroom to get our clothes, and none of us felt particularly comfortable
    playing with that little trike after that.


    I know for a fact that similar things happened to the other tenants that followed
    us into that place. Thirty years later, I sat in a pub, and overheard a conversation
    between a husband and wife. They were actually recalling the time they lived in
    that same row of houses in Whatstand. I couldn’t quite believe my ears, and had
    to interrupt them just to double-check I’d definitely heard them.


    It was the most remarkable coincidence, but we soon started comparing notes about
    our respective time in place, and, when I finally felt comfortable enough that
    they wouldn’t think I was a *total* nut, I took a risk and asked, “So, did you
    happen to have any spooky experiences while you were there?


    The atmosphere changed in an instant.


    The wife pale and a dark cloud descended over the husband. “Oh no,” he opined,
    wagging a finger, “don’t bloody start on that again.”


    He went quiet and stared angrily at his pint, but his wife began to open up. “My
    hair was stroked at night,” she ventured nervously, “by a little boy and a man.
    She went on to detail experiences identical to mine, and her husband eventually
    admitted defeat and chipping in to. We even swapped bloody bleeds,” he said, “and
    she was *still* getting woken up by these blooming’ people stroking her.


    At the end of our chat, the wife elbowed her husband in the ribs so hard he spilled
    his beer. “See?” she said in a triumphant tone, pointing at me, her chief supporting
    witness and new friend, “I told you, Albert! It were haunted?


    Children, I think, have a far greater connection to whatever it is sits outside
    our known universe. They are naturally much more open and accepting. Able to take
    things at face value without feeling like they have to'
  merge: -1
  pgno: 16
- img_proc: true
  md: 'explain away the true mysteries of the universe. Adults don’t come forward
    with their paranormal experiences readily, not because they don’t believe in what
    they saw, but because they dread the judgment and ridicule of those people who
    weren’t even there. Naysayers, who seek to disprove and dismiss anything you’ve
    ever experienced that is a little, less than ordinary.


    “Judgment” is not really a concern for me, given my chosen way of life. I have
    the privilege of being able to be completely honest about everything I’ve ever
    experienced, as I suffer absolutely no ill consequences from the conclusions of
    others about what I have to say. Quite honestly, if you cared about what people
