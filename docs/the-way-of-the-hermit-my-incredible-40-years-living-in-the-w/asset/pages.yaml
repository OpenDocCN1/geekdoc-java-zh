  md: 'It was June 1996 when his body was found up near the summit of that desolate
    hill. The authorities reckoned he’d been lying there for months; but no one had
    the first clue who he was. All the labels had been pulled off his clothes, and
    I’d heard his bank and identity cards had all been destroyed too. According to
    the reports, he was wearing slip-on shoes that were completely inappropriate for
    a day in such mountains, carrying a sleeping bag tent, and three big bottles of
    water in an area where there is water everywhere. None of it made any sense, but
    apparent suicide rarely does to those left to pick up the pieces.


    The most surprising pick of all was his gun. The investigators said he’d shot
    himself through the chest with an antique black-powder pistol. You can imagine
    what the headline writers made of all this. They had a field day.


    It took seventeen months before Emmanuel was formally identified. It wasn’t easy
    because he had left few clues as to who he was, least of the fact that he was
    in a suburb in Paris and had only told his parents that he was going to Britain
    on holiday. Not that he was coming up here, or what his true intentions were.


    The exact circumstances of his death are still shrouded in mystery. Apparently,
    his parents believe Emmanuel was murdered, or at the very least aided in some
    sort of ritualized suicide. All those rumors have been publicly reported. Some
    people around him had said that another person was involved; someone mysterious
    who was then never seen seen again. Emmanuel’s mother and father came here several
    times to conduct their own investigations, and his father claims my Jimmy at Courrou
    Station said his son had been seen with another man while he was in the area.
    Jimmy would later say to a journalist that he couldn’t be sure if Emmanuel and
    this man were traveling together, or if they only met that day. According to Jimmy,
    this mystery partner said he was going to Fort William anyway, and that Emmanuel
    headed to Ben Alder alone. Apparently, Jimmy had then asked Emmanuel whether he
    was afraid of ghosts. That figures, given he knew full well what had happened
    to me at bloody Ben Alder Cottage.


    I don’t know. Sometimes we look for the fantastical when, really, the most likely
    answer is the one’s right in front of your nose. Whatever really happened has
    long disappeared, alongside that poor soul who took himself to that lonely mountain.'
