    hearsay? You''ve got conditions that are more than capable of whipping a phantom
    of the mind''s eye; especially after a long hike and one too many drinks. I''d
    all but said myself, in the buildup to my own fateful night.


    Those events tattooed something deep into my soul and it took me some time to
