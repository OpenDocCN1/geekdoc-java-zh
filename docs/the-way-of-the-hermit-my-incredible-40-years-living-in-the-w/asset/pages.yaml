  md: 'biggest fish I ever lost from Highland waters was one that will haunt me to
    the grave.


    It was back when I was living in Rannoch, working in forestry, and a young man
    at the absolute peak of a pike-fishing obsession. I was fishing an island on the
    wide and slow-flowing reaches of the River Gaur, and I was utterly fed. I''d been
    fishing the place for weeks and couldn''t seem to catch a pike over eight pounds,
    no matter what I''d tried.


    When out piking, you might catch lots of juveniles, known as “jacks,” of a few
    pounds or more; but you only really start to get excited when they are topping
    fifteen pounds, with a real specimen generally considered to be any fish of over
    twenty pounds. I''m not a greedy man, I wasn''t looking to set new records, I
    wanted a fish that was undeniably in the class marked “big.”


    When it came to my day with disaster, the conditions looked spot on, and I set
    out more determined than ever. “Ken, I remember saying to myself, “today is big
    pike or bust.”


    My method was crude but effective. I fished my way around an island with my lures,
    eventually I caught a trout that was far too big for any small pike to fit in
    its jaws. I placed sharpened treble hooks under its skin and flung it out towards
    the island, full of hope.


    There was, however, a considerable flaw in my plan. The trout bait was so heavy
    on the line that the float was hoping to suspend it beneath dragged right under.
    Your float sits on the surface and acts as your bite indicator. It should only
    slide under the water if a fish has grabbed the bait, below so mine disappearing
    alongside my super-sized trout, I was effectively fishing the river blind.


    With no float, I decided to fish for a bait instead. This is achieved by putting
    a little tension in your line between your rod and the bait, and then placing
    a finger on the line next to your. It is a really sensitive way of fishing, and
    as you feel every tremble and knock on the bait right through your fingertip.


    I worked my down the island, moving twelve feet after every cast, and carefully
    covering all the water and likely pike-holding areas. I ran out of river to fish
    and was standing on the bank right at the point the Gaur met the mighty Loch Rannoch.
    This was my last cast, and probably my last attempt to catch a big pike in these
    waters, but I focused, and made sure I fished it properly.'
