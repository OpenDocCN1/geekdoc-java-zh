    The best single piece of advice I can give you if you are ever in a threatening
    position with any potentially violent wild animal, whatever you might be feeling
    inside, you must fight the urge to run away. Running shows weakness and fear,
    two emotions that are near certain to escalate the predator''s idea that you are
    a very easy meal indeed. They could, in fact, lethally execute you before you
    ever make it to a climbable tree. You could never outrun a bear, a wolf, or a
    mountain lion; and even if you managed to get to a tree, a bear or a mountain
    lion would come after you and peel you open like a can of beans.


    What you need to do is play to that pragmatic part of the predator''s mind, which
    I mentioned earlier. You are looking to convince it, that however soft and fleshy-looking
    you may appear, you are still not worth the risk; that you could fight back; that
    might somehow have the ability to maim and wound.


    Stand your ground, slowly back away, if you can, and the mountain lion or wolf
    will very likely back down too. The only exceptions could be the bears. You are
    definitely giving yourself the best chance of survival if you don''t show fear,
    but bears—especially the grizzlies—are much more aggressive.


    If you still stand the bear attacks and it is black, then give it absolutely everything
    you have: shout, scream, target the eyes and ears, punch, kick, and use any available
