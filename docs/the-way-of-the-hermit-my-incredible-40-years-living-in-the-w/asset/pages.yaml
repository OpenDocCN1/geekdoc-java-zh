    least, but it was the fundamental kindness and quick thinking of a total stranger
    that rescued me.


    On a more positive note, the truth is that I''ve had thousands of lifts through
    half a century of thumbing, and a handful of tricky moments. Lord knows it only
    takes one disaster to completely ruin your life, but I''ve come to understand
    that there are many more good people out than bad, and you shouldn''t let your
    concerns about what a tiny minority could stand in the way of experiencing all
    the love, kindness and opportunity that are offered up by everyone.


    Terrible people do terrible things (and I''m truly very sorry if they ever have
    to you), but never allow yourself to think that their faults and flaws as humans
