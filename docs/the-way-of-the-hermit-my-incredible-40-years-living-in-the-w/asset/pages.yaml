  md: 'These days £100 is not worth a lot, but to me, from her, it’s equal to all

    money in this world.


    ***


    I worked for the Courrou Estate for seventeen years. You might wonder why

    I would need to work, given I have none of the ordinary big bills to pay, but

    even living as I do, you still need money for some things. Building

    materials doesn''t always come for free and neither do your tools for growing,

    chopping and fixing. Seeds, clothes, fishing tackle, and the food and drink

    y can''t easily make, grow or catch yourself—all those cost too. There

    there are some things I have for my cabin that just make my life that little

    bit more pleasant. My replacement wood-burning stove, for example;

    radio and its batteries; the film I need for my camera and the money to

    develop images into slides or photos for the album. I really like reading too,

    especially magazines about science, true crime and natural history, and will

    uusually try and buy a few titles when I venture to the shops.


    Regardless of all those reasons for earning some money, the

    agreement to build the cabin on estate land had come hand-nnglove with the offer
    of the work. I need the estate''s goodwill as much as I

    needed the income, but working hard and making friends there would later

    help me in ways I could never have imagined at the outset.


    I started work at the same time the cabin began. The work was not

    full-time. I''d get a message about a job that needed doing and I''d go.

    There would be periods, sometimes of weeks or months at a time, where I

    wn''t work at all; and then periods where I would be absolutely flat-out,

    especially during the deer hunting season. That suited me right down to the

    ground. There was after all, always an awful lot of work to be done around

    cabin.


    I was given the job of ghillie. The work of the ghillie is as tight as

    tartan into the ancient traditions of Scotland. “Ghillie” derives from an

    ancient Gaelic word whose rough translation rests somewhere between

    “manserv” or “attendant,” specifically within the hunting, riding and

    fishing disciplines. In the past, the ghillie acted more like countryside helps

    to the upper classes in their outdoor pursuits. Back in the sixteenth century

    it was a lowly position, one that involved really hard work, and not a whole

    lot in the way of reward. The ghillie was expected to physically carry their'
  merge: -1
  pgno: 112
- img_proc: true
  md: 'master across boglands, streams and rivers; to load the guns and tie the fishing
    rods; to do all the dirty work preparing the kill and clearing the way for their
    overlord and master to act the hero and claim all the glory.


    The ghillie''s role is still to act as an assistant and guide on hunting or fishing
    expeditions but, in these modern times, the ghillie is treated with a real respect
    that, depending on their skills, sometimes even borders on a veneration. The ghillie
    should have a firm instinct for the rhythms of the natural world too. Often that
    will have been learned through decades of knowledge passed down through the generations
    of ghillies before them; but you can''t replace the lessons of the country that
    are acquired through time spent out on the fell. The very best have an intimate
    knowledge of their patch of land, which is often pieced together over the course
    of a lifetime''s work and study.


    The most experienced can look at a wide sweep of glen and pick out the gullies,
    patches of wood and brush that are likely to hold animals; or the eddies, holes
    and features in the river bed where a guest should cast out their line for a fish.
    They understand patterns, and how relates to the behavior of wild animals and
    the environment they seek to traverse, and they can recognize and interpret trails
    left by the very subtle of clues: the rubbings on a tree from the antlers of a
    deer, delicate footprints in the mud, or the circles on the water''s surface where
    a trout has just gently dipped down a fly. They then need to package all that
    complex (and often quite abstract) knowledge in a way that a guest is able to
    understand, whilst still molding their hopes and expectations to see the reality
    of their actual abilities with horse, gun or rod.


