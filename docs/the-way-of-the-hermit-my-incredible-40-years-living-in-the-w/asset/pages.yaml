  md: 'By this point, in just a week and a half of fishing, I had broken my personal
    best Trout three times. To give some context to this quite remarkable window of
    good fortune, your average-sized brown trout in Scotland is likely to weigh less
    than a pound. A real specimen would be around three or four pounds, and catching
    a fish double, truly, would be the fish of a lifetime. So far, I had caught three
    “fish of a lifetime” on three back-to-back trips. That haul in itself stretched
    incredulity, but what came next was nothing short of a miracle.


    On Saturday, April 2, the snow was so awful that all work was out of the question
    again, I picked up my rod and went back to the boathouse. There were campers from
    Holland already on the spot, proudly displaying a nice two-pound trout that they
    had just caught on a lure. I asked if they wouldn''t mind me fishing there, and
    they were too happy to make any way. I could tell from their faces that they thought
    I was unlikely to catch anything, but I had them retrieving their lure far too
    quickly. In essence, they might have covered the bank, but they had only fished
    the upper few feet of water that dropped to several meters deep. There, down in
    the dark, I felt instinctively something could be stirred.


    Within a few casts, my rod hooped over and my reel screamed urgently into life.
    From the off, I was left in absolutely no doubt that, whatever this was, it was
    likely to be very large indeed. Fought, many of the biggest fish do: dogged resistance
    at depth, like a heavyweight boxer leaning every time his opponent tried to apply
    any pressure; but this fish held its ground and would not yield. It was almost
    like being attached to the lake bed of the lo itself itself but then it would
    move, chugging and down like a freight train, seemingly concerned about anything
    I attempted to do to bring it through the water column.


    I had to keep going through the stalemate, bending the rod as I dared, Treig''s
    wind whistled ominously through my line with a whine. The spot where I hooked
    this fish was littered with snags—enormous boulders and trees too—and if this
    giant fish made into any of those, my line would snap like cotton, but there was
    only so much pressure I could apply without the hook pulling clean from the mouth,
    or the line breaking purely under the strain of this fight.'
