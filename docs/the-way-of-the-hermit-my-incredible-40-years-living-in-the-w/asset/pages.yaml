    in a glowing performance for one very lucky set of human eyes.


    Sometimes, though, those walks can become very long. Occasionally, excruciating
    so. The plan, usually, is to get those eight miles done and then a lift to Spean
    Bridge Post Office for my letters; a pretty village with a pub and small shop;
    then on to the busy town of Fort William for my food from the supermarket. If
    that doesn''t come off, then it''s nine miles'' walk to the Post Office and another
    nine miles on top of that to get to the supermarket at "Fort Bill." If I can''t
    get a return train to Corrough, or turn a lift to the spot that meets my trail
