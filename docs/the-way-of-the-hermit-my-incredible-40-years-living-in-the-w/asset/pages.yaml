  md: '# Lost Souls


    THURSDAY 17 JUNE 1999


    There''s pain and there''s pain, but toothache has a pain of its own.

    A warmer night and a drier night, sitting by my outside stove trying to rid my
    body of an aching tooth when 6'' away sits a chaffinch asking for a peanut and
    saying'' "ignore the pain man."

    It''s alright for them bugs, they don''t have any teeth.


    TUESDAY 28 SEPTEMBER 2004


    That troubled filling fell out early this evening while eating a bacon sandwich.
    Some size it was, and worst of all I swallowed it. I suppose it''ll come out the
    other end sometime or other.


    It''s the little things out here that can wind up being problems: the coughs,
    the flus, the shits, the splinters, the burns, the occasional trapped nerve. If
    it gets really bad, I''ll take the long walk to get it sorted. That is not easy
    when you''re really sick, but bear in mind too, with no phone, I am often looking
    at the walk just to make an appointment, to come back again some days later to
    actually get fixed up. That return journey, whenever I''m suffering with had a
    few days to seek deeper into my body, is the absolute pits.


    Colds and flu are infrequent as I have such limited contact with the masses, but
    when I do them it is much more of an issue for me. Aside from Covid last year,
    January 2009 brought me the worst of flu I had. I caught it from a shop attendant
    who sneezed into her hands and then handled my tin cans of food. My coughing was
    so bad I stained the snow around the cabin with my blood. I don''t know if I suffer
    more due to my lack of exposure to your everyday bugs, like a wee gorilla hidden
    away in the remote recesses of some African jungle, or whether it is that it just
    feels worse as I can''t dose up on pills and put my feet up when I have so much
    physical work to do every day. Either way, it''s really bad.'
