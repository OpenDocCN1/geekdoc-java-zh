    alongside of dancing, shuffling feet and jumping. However, when they got up to
    investigate, the room was found to be vacant. That witness swore they would never
    return to Ben Alder Cottage. Some of these phenomena were later attributed to
    the behavior of a lone stag, which apparently liked to rub and bang its antlers
    along the outside walls of the bothy; but that stag, or its behavior, has never
