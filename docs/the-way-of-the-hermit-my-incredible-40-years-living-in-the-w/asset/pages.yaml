  md: '# Prologue


    # The Hermit Within


    Daylight is a fickle friend.


    In the middle of summer, it stretches itself across this land and casts its illusion
    of an everlasting grace. At its height, you can easily kid yourself into thinking
    it''ll go on like that forever. Bathing your back in its warmth and illuminating
    the loch you chop your wood. Daylight is a good friend when it wants to be, but
    hardly what I would call a reliable one.


    It''s chopping the wood that underpins the truth of your life in the far reaches
    of the Highlands. The log pile is your ballast when the daylight is at its longest,
    and building up your supply of wood serves as a daily reminder that de-light is
    only a fleeting flick of fancy. Aye, it''ll be getting the rounds in at the bar
    all summer when it wants to, but as soon as first autumnal storm arrives, off
    daylight scurry, right through the back door without paying its tab or even saying
    goodbye.


    Put your faith in chopping wood. Build up the pile and the calluses on your palms,
    and always remember: from the moment you first swing your axe in early spring,
    you''re already racing to get your pile in sound order before winter throttles
    the daylight back out of these mores.


    Yet Put your faith in wood, not daylight. Wood is your true friend, for wood provides
    light and warmth whenever you ask it to. Even now in May, as the daylight creeps
    forward and begs for your forgiveness after another long winter of absence, I''ll
    continue leaning on the wood for its favors. There is still a bitter chill in
    the air when the sun sinks behind the mountains and I''ll need a few logs to weather
    through the evenings here.


    We''ve definitely broken the back of the worst of it, though. This winter was
    rough, underpinned by great storms and torrential rains, but we''ve endured it
    all once again. The cabin and its creatures are edging out of the shadows. The
    hermit lives to fight on.'
