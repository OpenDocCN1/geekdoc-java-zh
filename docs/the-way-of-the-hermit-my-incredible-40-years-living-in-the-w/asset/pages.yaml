- img_proc: true
  md: 'I balance a fresh log atop the burning embers of the one that''s fading away
    in the flames below. I like to stack my wood in the log burner in a small grid
    shape and then watch the livid sparks get sucked right up the chimney. I get through
    four sacks on an evening like this, but it''s all right; the wood pile is full
    to the brim and within my arm''s reach. Fire shadows dance along the length of
    the log cabin''s timbers and my door is closed firm to the world. I shan''t need
    to risk the night for anything other than a pee and a clean of my teeth.


    That''s good news for you. I''ve got quite the story to tell and it is going to
    take me all summer to get it out.


    Nothing good ever comes in a rush, though. Everything starts and ends much later
    in the high north of Scotland, and it is all the better for it. Same for this
    hermit''s tale.


    Time for a drink then. Home-brewed beer or birch-wine?


    A shrew scuttles across my gravel floor. An insectivorous mammal, in reality,
    she''s far more interested in my Jaffa cakes than the spiders twitching their
    legs in the timber gaps. She tastes the air with her pointy nose. That long conk
    is of far more for finding them some orange dark-chocolate bloggers from her tiny
    coal-black eyes. She can smell one now, over on my desk.


    No bigger than half my thumb, off she scurries across all my papers, photo albums
    and books, piled up on the worktop. Collective memories of a life very well lived.
    That tiny shrew won''t live beyond a year, but can cut decades of my life to a
    Jaffa cake in a matter of seconds.


    It can have cake and eat it. Shrews are a tolerable nuisance. That is, till they
    cross the line and wade into the box marked "greedy buggers.\ Still, no matter
    what it does, a shrew is a minor problem next to the bleedin'' pine martens. Sharp
    cheekebones, brown coat with a creamy white breast; they are like a spoiled wee
    boy-prince decked out for a banquet in his fine velvet coat and bib. They certainly
    care not for the suffering of obliging service staff. I tell you that for free.


    Pine martens might look heavenly but they are a highly destructive, astonishingly
    intelligent, and very powerful menace of the most supreme order of mustelids.
    This spring they have already turned one of my barns inside out on their rampage
    for food. I say they are Beauty and the Beast rolled into one devilish creature.
    They drive me hopping mad.'
