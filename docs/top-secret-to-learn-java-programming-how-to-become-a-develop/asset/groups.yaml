    # 学习 Java 编程的机密：如何成为开发者：Java 语言的最显著优势


    ## 引言


    目前有很多可接触的编程方言，并且每一种都适用于特定的程序或应用程序。有些人学习了几种编程方言，并因为他们熟悉这些语言而使用它们，但在大多数情况下，开发人员会使用他们正在开发的应用程序所所需的编程语言。Java
    可能是最常用的编程语言，而用这种语言编写代码在某种程度上与 Pascal 或任何 C/C++ 形式不同，但这并不意味着学习 Java 代码比学习 Pascal
    或 C++ 更困难。如今有许多应用程序是用 Java 编写的，它的语法起初看起来可能有点难，但毫无疑问，任何人都可以用这种语言进行编写。


    在研究另一种编程语言时，大多数人都想知道它是否容易学习和工作。如果你将其与 C 或 C++ 进行比较，你可能会发现毫无疑问，很好地使用它可能更加简单。这是因为
    Java 与 C 语言相比特性要少得多。C 和 C++ 使用了大量的特性，学习并掌握所有特性可能是一项艰巨的任务（例如，临时因素在创建它们的函数执行完毕后仍然存在）。Java
    更加简单，因此更容易学习和也更容易工作。例如，Java 消除了显式的指针解引用和内存分配/回收，这些是 C 和 C++ 软件工程师两个最混乱的 bug 来源。


    越界加法并不容易追踪，因为 Java 可以进行数组边界检查。其他人可能认为，由于没有多少使用它执行极其复杂任务的情况，它看起来更容易操作，但公认的观点是，在某种程度上掌握
    C 或 C++ 更简单。学习用 Java 编写程序非常容易，特别是如果你了解其他更基础的编程方言，并且毫无疑问知道你需要如何使用它时，它与 C 和 C++
    相比有一系列优势。最重要的是，这种编程语言编写的代码非常紧凑。C 和 C++ 编写的代码则不然，这使得 Java 更可行（例如，在 C 和 C++ 中，每次执行都对基本数据类型的精确度和容量有特定的要求）。


    当你需要从一个框架移动到另一个框架时，这将引发问题，因为数值精度的变化会影响计算。然而，Java 规定了所有执行中基本类型的大小（例如，一个框架上的 "int"
    大小在每一个给定的框架上都是相同的，并且处理相似的值范围）。


    使用浮点数数学的项目实例需要特别考虑：使用浮点计算的程序在不同框架下可能会得出不同的结果（在这种情况下，差异程度会随着特定值经过的计算次数增加而增加）。然而，这是所有浮点数代码的共同问题，而不仅仅是
    Java 代码，Java 在其字节码方面同样比 C 或 C++ 灵活。它被编译为假设机器的字节码——最终，解释器模拟了那台机器。这意味着在一台 PC 上收集的代码将在具有
    Java 解释器的其他 PC 机器上运行，关于这一点，你将在学习 Java 编程时发现更多信息。


    ## 学习 Java 编程的最佳方法


    一个企业基本上可以被描述为 Java 编程一直是信息技术发展的最前沿。这在组织的 IT 开发中可以更好地看到。通常在企业发展中，Java 正在被使用。使用这种编程语言的一个真实模型是例如飞机订票的企业内部工具。你是否想过航空公司如何通过基本上登录框架让预订行程变得异常快速？正因为了
    Java，这成为了可能。在软件工程师中极少数人不同并掌握了 Java 的每一个门道。有些人可能了解它的原理，但只有少部分高级原理。这就是需要在该领域精通的软件工程师应该尽一切学习
    Java 编程的地方。当你有机会从每周五天每天 8 小时的工作中抽身并承担一些责任时，这怎么可能呢？幸运的是互联网充满了你可以利用其潜在利益的资源。你只需要找一个懂
    Java 的人，可以在你的业余时间一对一向你展示，并且有足够的资源教你关于这种编程语言的知识。


    事实上，学习 Java 编写程序的最佳方法是拥有一个有耐心的导师或教练，他们可以为你介绍基础知识并帮助你学习开发工具。准备好支付比预期稍多一点费用，特别是如果你需要从最好的人那里受益。除了从中获得的信息之外，你还可以通过最新的适应来更新自己。


    到目前，自 1997 年 2 月 19 日 JDK 1.1 版本首次发布以来共有 7 个 Java 版本。当前版本是 Java SE7，它是于 2011 年
    7 月 28 日发布的。Java 7 的更新 9 已于最近 2012 年 10 月 16 日发布。


    显而易见，如果你在 1997 年学习了 Java 但没有通过最新的更新刷新自己，你将会落。因此，学习 Java 编程并更新你的知识实际上是一项绝对的要求。不仅是为了基础，而是为了提高你的能力。


    ## 为什么要学习 Java？


    Java 是一种先进的面向对象的编程语言


    面向对象编写程序是一种设计风格，它使用称为类的代码单元来表示现实中的对象。这种编程风格已被证明产生既健壮又灵活的代码。除了面向对象之外，Java 还支持其他编程方法，例如多线程、异常和传统的编程。Java
    有简洁且可靠的语法结构，Java 语言的设计没有任何准备。它的设计者不需要担心与过去语言的相似性，这为 Java 提供了一个完美且稳定的标法。Java 自带一个巨大的高效的应用程序编程接口（API）。这允许软件'
