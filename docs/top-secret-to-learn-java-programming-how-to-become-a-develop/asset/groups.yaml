    工程师可以关注任务的要点，而不是编写更宽泛的代码或在外部库上胡乱尝试。


    Java 的设计初衷是多功能性的

    大多数 Java 项目可以在各种工作框架和设备阶段上几乎不需要修改即可运行。

    Java 是一种由组织驱动的语言


    Java 旨在能够在组织环境中良好地运行，其 API 和安全模型使得网络既保护又稳固。


    Java 是安全的。Java 是安全的，它允许来自网络的代码在隔离的环境中运行，保护主机框架免受感染等。此外，Java API 提供了管理计算机声明和其他加密方法的计划。Java
    是一门卓越语言。


    ### 摘要

    主要的观点是，万一你学会了 Java，你将会变得快乐、富有且闻名，孩子们会想成为你，外人会想要拥有你的孩子，你的众多回忆录将成为畅销书。


    在很长一段时间内，你的诺贝尔奖应该可以抵得上你大师家中架子上的菲尔兹奖，以及你真诚的年轻创作者


    来自 BBC 将需要制作关于你以及你各种成就的报道。


    ## 如何成为 Java 开发人员？


    ### 了解 Java 的优势


    Java 是 IT 行业中许多编程语言之一。你现在可能已经知道其中几种语言，或者可能了解过它们。


    - ASP、C、PHP 仅仅是几个模型。无论如何，有了这些模型，你为什么选择 Java 是一个好主意呢？


    我不是来这里说这是一门最棒或最糟糕的语言。我更想表达的是 Java 有它的用武之地，你需要了解它的特性。Java 对于大型框架，以及需要 Java 提供的展示性能和多功能性的项目来说，是一门很好的语言。对于更简单的任务或更简单的网站来说，它可能不是最好的语言选择——虽然这是可能的，但并不是
    Java 特性所在之处。


    ### 下载必要的工具

    要开始学习 Java，你必须下载用于创作的工具和软件。你需要两样东西——Java 开发工具包 (JDK) 和开发环境（也称为 IDE，代表集成开发环境）。一些非常著名的
    IDE 有 NetBeans 和 Eclipse。


    这些都可以从 Java 网站获取。一旦你下载并安装了它们，这就是学习这门语言的绝佳机会。


    ### 熟悉 Java 语言

    要成为 Java 设计师，你需要学会如何用 Java 编程。如果你熟悉其中一部分，那太棒了——这会让这部分变得简单。如果没有，你可以从几个渠道学会如何用 Java
    编程：


    - 基于网络的教学练习。许多网站提供关于如何创建 Java 最佳实践的教学练习，从初学者想法到尖端主题都有。通过 Google 搜索来找到适合你的练习。

    - 教科书——购买一本课程书籍是熟悉该语言的好方法，因为它同样包含了初级和高级思想。许多书中都有实用的活动和模型。

    - 大学或学校的课程。许多学校或学院提供短期课程，有些可能包含 Java 开发培训。这种方法的优点是处于群体环境中并有指导老师，而不是从书或网络中自学。


    ### 开始一个你自己的 Java 项目

    一旦你处理好了基础知识，你就可以开始自己的项目来帮助提升 Java 能力。这可以是你喜欢的任何内容。重点是练习和培养你的 Java 能力，以便你更精通 Java
    编程语言以及如何使用 IDE。你将在从故障排除、编写自己的代码到遵循最佳实践方面获得实用的经验。这些被认为是从你的练习或其他学习技术中获得的，但将它们投入使用是提高这些能力的好方法。


    ### 迈出的一一步

    当你对自己的 Java 开发能力有信心时，就是迈出下一步的绝佳机会


    - 获得一个 Java 开发职位。这可能是整个互动中最困难的部分。许多公司有特定的经验要求，可能包括证书、学位和专业经验。


    如果你只是在学习这种语言且没有专业经验，你应该寻找初级 Java 职位。这些职位可能需要某种形式的认证或能力证明。这就是你的侧边项目派上用场的地方——如果你使用
    Java 构建了应用程序或网站，可以很好地放在简历中增加机会。


    成为 Java 设计师的另一个大建议是获得认证。一个非常好的入门认证是 SCJA - Sun 认证 Java Associate。这项认证非常适合学生或初级
    Java 软件工程师，并在寻找 Java 设计师工作时将是一个巨大的优势。查看另一篇关于成为开发人员最佳方法的新文章以获取更多提示。


    ## Java 语言最重要的优势


    Java 自最初出现以来就获得了巨大的普及。它的快速崛起和广泛认可可以归功于它的设计和编程特性，特别是它保证了你可以“一次编写，到处运行”。Java 被选为网络计算机
    (NC) 的编程语言，并被视为企业信息库的通用前端。正如 Sun Microsystems 的 Java 语言白皮书中述：


    > "Java 是一种简单的、面向对象的、解释的、解释的、强大的、安全的、平台无关的、紧凑的、多线程的动态。" Java(TM) 比其他语言环境具有关键优势，使其适用于任何编程任务。


    Java 的优点如下：


    - Java 不难学习。Java 设计初衷是易于使用的，因此比其他语言更容易编写、组装、从故障排除和学习。

    - Java 是面向对象的。这允许你创建特定的项目和可重用的代码。

    - Java 是无平台的。也许 Java 主要优势之一是它可以从一个计算机框架有效率移动到下一个。


