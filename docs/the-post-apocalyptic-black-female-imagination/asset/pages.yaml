    encourages a rethinking of metonymic presence and its implications for race, class,
    gender, and sexual dominance. Through a focus on a global community of dispossessed
    subjects, Naylor attempts to name the space itself to a radical Black subjectivity.
    Bailey''s Café intervenes in the project of illuminating the unseen forces of
    dominance responsible for sexual and gender oppression by making visible the invisible
    forces of control seeking to circumscribe a range of subjects, from Sadie, a homeless
    woman on Chicago''s side, to Miss Maples, a Stanford-educated cross-dressing housekeeper/bouncer.
    Godfather''s grandiose claim that Eve "never had a mother or father would be alive
    if it weren''t for him" recalls the stratagems on the path of necromancers to
    induce forgetting among African abductees (82). The dictatorial position that
    Godfather assumes as Eve''s guardian, not less the role he occupies in Plittown''s
    school, cotton exchange, and church, contemplates the invisible forces of dominance
    manifesting the formal and informal institutional structures of the mid-twentieth
    century. But it is not African captives and their descendants who find themselves
