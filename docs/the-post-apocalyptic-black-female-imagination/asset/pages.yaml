  md: '# # Acknowledgments


    In the completion of any enterprise, especially one involving the production of
    a book-length monograph, there are individuals who labor behind the scenes—invisible,
    silent, often unacknowledged—but without whose the project would not have come
    to fruition. I would be remiss if I did not pay homage to those who played a key
    role in the research, writing, and revision of this book.


    First, I want to thank my research intern, Sabine Nemours, for her role in locating
    scholarly resources on Octavia E. Butler and for invigorating lunchtime conversations
    about Afro-futurist feminism, Black women''s fiction and cultural production,
    and current social and political events. I learned from you as much as you gleaned
    knowledge from me. I also wish to acknowledge graduate scholars in my Postocalyptic
    Black Female Imagination seminar who not only shared my enthusiasm for Afro-futurist
    but also challenged me in ways that prompted me to refine my arguments early on.
    Through lively debate and robust conversation, these scholars helped to push the
    project''s geographic and disciplinary boundaries beyond its initial construct.


    A one-semester sabbatical and summer research allowed focused attention to research
    and writing. Along with scholarly audiences at Ethno-futurist, Afro-futurist,
    and African-American Literary and Cultural Studies nationwide, colleagues Chester
    J. Fonten, II, Ronald Baxter Miller, and Candace Ward offered helpful insights
    along the way. My, Juanita Montgomery Hale, was a source of inspiration when I
    needed the extra push that would get me to the finish line.


    But not least, I owe a debt of gratitude to my husband, Nathaniel Crawford, my
    partner in love and life, and our daughter, Samantha Natalya Crawford, a talented,
    up-and-coming literary scholar in her own right. Thanks for allowing me a room
    of my own to get my work done.


    For each of you, the future is as unbounded as your imagination and willingness
    to move beyond the limits that confront us all.'
