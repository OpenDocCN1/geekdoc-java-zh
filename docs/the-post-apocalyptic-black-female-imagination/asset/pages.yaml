  md: '# Beyond the End of History 3


    fantasy culture through literature, film, art, music, and other forms of expressivity,
    including hip-hop, they also reveal a broad, unacknowledged commitment to futuristic
    concerns as writers and artists the diaspora create worlds that confront us with
    utopian visions of a society where humanity can be transformed, often dramatically,
    making space for a reappraisal of Afro-futuristic canon formation.


    The last few decades have observed a proliferation of criticism on Black fantasy
    culture, but much scholarly work remains in an investigation of Black women''s
    interventions into science fiction⁴ Current scholarship underscores the importance
    of historical recuperation in the project of reevaluating the work of marginalized
    or forgotten Black women authors and the manner in which writers have created
    an identifiable tradition apart from a masculinist literary lineage. Mae Gwendolyn
    Henderson describes a tradition of authors who investigate gendered and racial
    decodings of Black women in literature in order to offer “strong revisionary methods
    of reading, focusing as they do on literary discourses regarded marginal to the
    dominant literary-critical tradition.³ Representative texts often enlist disruption
    and revision, she rightly observes.“Disruption—the initial response to hegemonic
    and ambiguously (non)hegemonic discourse—and revision (rewriting or rereading),”
    Henderson points out,“together suggest a model for reading black and female literary
    expression⁶ Hortense Spillers situ her reading of Black literature and cultural
    production within a context involving recovery of the long-suppressed feminine
    as a critical linkage in the project of Black Atlantic identity construction⁷
    Central to national debates surrounding social justice issues, policing practices,
    and identity politics, Kimberlé Crenshaw''s concept of intersectionality, which
    refers to the interlocking interfaces of race, class, gender, and sexuality, offers
    a useful, if not problematic, paradigm for approaching literature and expressive
    culture by and among women of color.⁸


    Unlike writers and performers whose futuristic imaginaries serve a private and
    individualized function, Black women deploy fantasy and the fantastic as a means
    of social critique and in a manner reflecting the cultural history of the group
    as a whole. With women of color, images of a transformed social order emerging
    in the not-so-distant future offers a basis for reexamining social and political
    issues of the present moment, and these visions announce a reclamation of a gendered
    African post. In other words, for Black women, the future is Black and female,
    and representations of an otherworldly existence summon a diasporic heritage,
    but with gendered inflection that prompts a reappraisal of core themes in contemporary
    Black feminist thought.'
