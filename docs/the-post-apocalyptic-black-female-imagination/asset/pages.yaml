    and contemporary readers, who like the ghostly figures that people the pages of
    their fiction, bear witness to a turbulent past. Her observations regarding the
    historical distortions resulting in the systematic removal of "the presence and
    the heartbeat of black people" direct attention to the "writerly" imperative at
    the center of her fictional canon.¹¹⁹ As the Pulitzer and Nobel Prize-winning
    author reveals,


    You have to stake out and identify who have preceded you—re—summoning them, acknowledging
    them is just one step in that process of reclamation—so that they are always there
    the confirmation and the affirmation of the life that I personally have lived
    but is the life of that organism to which belong is black people in this country.¹⁰


    Morrison’s comments point to historical recovery as a guiding impulse in her narrative
    project as she seeks to excavate the buried chronicle of Blacks in a global historiography
    where the boundaries demarcating body and outer world, art and science, past and
    future, nation and diaspora are increasingly blurred. For Morrison, history and
    historic events are part of a reality that refuses to disassociate itself from
    time-present or the potentiality of a future with its bio-technical and scientific
    innovation. Her portrait of a post-catastrophe Eden in her fourth novel, Tar Baby,
    directs attention to the contemporaneous nature of historical events in a late
    twentieth-century African-Caribbean setting. So emerges as a liminal figure whose
    arrival at the Street homes marries a history of slavery and forced migration
    with inter-galactic time-travel involving a cosmic alien influx, insinuations
    of an extraterrestrial plague subjecting islanders to involuntary blindness. Isle
    de Cavaliers, a magically real island resonant with myth and legend, lends itself
    to the border-crossing points that a destabilizing mash-up linking trans-Atlantic
    slavery with stories of an extraterrestrial invasion and biblically inspired accounts
    of an Arm-like rescue featuring a legion of blind horses. Morrison’s decision
    to situate Son’s journey within a cultural context recalling the trans-Atlantic
    journey offers a commentary on a range of contemporary issues and an opportunity
    to explore multiple lines of possible futures apart from colonial inscriptions.


