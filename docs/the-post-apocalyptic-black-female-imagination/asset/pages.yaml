  md: '# Beyond the End of History


    # Race, Gender, Sexuality, and a Postapocalyptic Imaginary


    Hack this: Why do so few African-Americans write science fiction, a genre whose
    close encounters with the Other—the stranger in a strange land—would seem uniquely
    suited to the concerns of African-American novelists? Yet, to this writer''s knowledge,
    only Samuel R. Delany, Octavia Butler, Steve Barnes, and Charles Saunders have
    chosen to write within the genre conventions of SF. This is especially perplexing
    in light of the fact that African-Americans are, in a very real sense, the descendants
    of alien abductees. They inhabit a sci-fi nightmare in which unseen but no less
    impassable force fields of intolerance frustrate their movements; official histories
    undo what has been done to them; and technology, be it branding, forced sterilization,
    the Tusgee experiment, or tasers, is too often brought to bear on black bodies.


    > Mark Dery, “Black to the Future”


    They said Armageddon in effect. But let tell you how this business began... Reginald
    Dwayne Betts, “The Countdown to Armageddon”


    Write the things which thou hast seen, and the things which are, and the things
    which shall be hereafter...


    Revelation 1:19


    If evocative song titles such as “Mystery Babylon” and “New World Blues” from
    Ebony Bones’ genre-crossing album Behold a Pale horse hint at the British Queen
    of Afro-Punk’s fascination with future-oriented concerns, then the spectacular
    portrait of the artist on the album cover gestures openly toward the use of otherworldly
    and alien iconography in announcing her 2013 musical release. The cover features
    Bones sporting a blonde Afro, wearing a black cape and stilettos, riding an upside-down
    white horse, and holding a crystal ball'
