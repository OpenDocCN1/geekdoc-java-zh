    alienation marking the young woman as the mixed-race daughter of Mary Riley, a
    housekeeper of African-Moor, and Ralston O’Grady, an Irish policeman. Separated
    from her dark-skinned classmates by color and caste, Ella has no identity apart
    from the others to she. She is, within a British colonial imaginary, a noble savage
    in need of civilization and Christianization. Only after the practiced recitation
    of a Rudyard Kipling poem does she attract the attention of a local Anglican priest
    and wins her life.


