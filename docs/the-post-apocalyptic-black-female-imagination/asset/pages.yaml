    spirit who usually comes at night. One is reminded of vampires, night-witches,
    ghosts, or other figures as representative of a life lived in-between-nations,
    cultures, and worlds.³ Zora Neale Hurston states that the zombie exemplifies a
    drug-induced state issuing from a secret conception from Africa.³ Saidiya Hartman
    deploys a cultured, gender approach while theorizing the zombie in relation to
    maternal absence or loss. For African abductees and their descendants, the trans-Atlantic
