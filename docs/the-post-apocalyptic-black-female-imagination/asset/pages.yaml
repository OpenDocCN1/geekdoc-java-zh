  md: '# The Postapocalyptic Black Female Imagination


    Like the duplicitous, shape-shifting Papa Legba or Eshu Elegbara of Yoruba folklore
    fame, postapocalypticism functions as a mediating figurative presence by situating
    itself at theic crossroads, a liminal site involving connections between erased
    and re-constituted identities, presiding over the risky journey to imaginary worlds
    within yet prevailing social arrangements. This dialectical method is to translate
    the dislocating experience of trans-Atlantic passage into tangible form by unveiling
    the story of controlling influences or charting the map outside the often-invisible
    forces of hegemonic in a manner that maps efforts to negate the destructive effects
    of colonial and neocolonial powers. The urge toward recuperating a diasporic heritage
    with the feminine emerges as a predominant concern in a postapocalyptic culture.
    The utopian imaginaries in Black women’s literary and cultural production do not
    merely emanate from the tension between a diasporic past and alternative futures;
    they investigate tension in attending to cataclysm and disaster as symbolic acts
    of individual and communal emancipation central to the literary or cultural artifact
    as a whole. Moments of catastrophe summon Blackness in the nihilistic tests Calvin
    L. Warren deploys in describing race a destabilizing presence and a force against
    which whiteness makes itself known. As a fluid construct, race lends itself to
    the ways in which an estrangement between the signifier and the signified tends
    toward new signs heralding a reconfigured self and society, a New World Order
    arising out prevailing linguistic systems. What comes to mind George Lipschitz
    theorizing the crossroads as a site for transformative social, political, and
    cultural possibilities, or bell hooks’ imagining the margins as a locus of empowerment
    outside white, male structures.³33


    The idea of the “post,” which summons figurations of the interstitial space between
    clearly defined periods of time as well as cultural, aesthetic, or social movements,
    has implications for the current study in artistic efforts to critique present-day
    realities through the deployment of a postapocalyptic imagination. In my understanding
