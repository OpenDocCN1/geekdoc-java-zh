  md: '# Romance after the Ruin


    Klein presents an insightful analysis of the Shock Doctrine in connection with
    media and biblical tropes signaling the end of the world. She attends to crisis
    exploitation and the capitalist misuse of disasters designed to replace existing
    public spheres in terms suggestive of “a kind of corporate New Jerusalem.” Regarding
    the Bush administration''s policies in response to the Iraqi War, for instance,
    she asserts that those policies are “part of a movement that prays for crisis
    the drought-stricken farmers pray for rain, and the way Christian-Zionist end-timers
    pray for the Rapture.” As Klein points out,


    These are the closed, fundamentalist doctrines that cannot coexist with other
    belief systems; their followers deploy diversity and demand an absolute free to
    implement their perfect system. The world as it is must be erased to make way
    for their purist intent. Rooted in biblical fantasies of floods and great fires,
    it is a logic that leads inevitably toward violence. The ideologies that long
    for imperfect clean slate, which can be reached only through some kind of cataclysm,
    are the dangerous ones.


    Vernacular culture serve as a mode of resistance against the imperatives of a
    bureaucratic machine intent rendering individuals powerless in the face of unregulated
    capitalist expansion. Black women seek to retain aspects of a fragmented past,
    to salvage the bones, borrowing Jesmin Ward’s metaphor for reaffirming a disjointed
    diasporic heritage despite attempts at historical and cultural obliteration on
    the part of corporate and institutional structures. Chapter 2 of the present study
