  md: '# Beyond the End of History 5


    The prevalence of sexual dysfunction, psychological distress, physical impairment,
    or infection attests to the lingering consequences of the past. Those conditions
    also demonstrate the persistence of trauma in the lives of Black Atlantic subjects.
    Frantz Fanon posits the notion that slavery and colonization constitute an origami
    trauma marking the lives of a raced population.¹¹ Much of the postcolonial condition
    involves efforts to address the residual psychic or physical wounds of oppressive
    colonial and neocolonial influences. Tropes of illness and healing assume paramount
    importance in the fantastic worlds Black women seek to construct, signaling the
    lasting results of an unsettled Atlantic history that refuses to release its stranglehold
    on the present. Although science, technology, and medicine present themselves
    as solutions to physical, emotional, or psychological ailments, traditional institutional
    structures and modern medicine fail to displace enduring folk remedies involving
    Obeah, Myal, herbal cures, and homeopathic practices.


    Recent scholarship attends to the traumatic moments of the trans-Atlantic journey
    in relation to the dissociating nature of the Middle Passage and the implications
    for journey emerging identity constructions in a New World setting.¹² Such insights
    are resonant with James Berger''s assertion that "the study of post-apocalypse
    is a study of what disappears and what remains, and how the remainder has been
    transformed."³ Berger focuses on the Black experience as characteristically apocalyptic
    and traumatic; he is concerned with end-time events not just as a change of protest
    and empowerment, but also as an instrument of revolutionary change. One is reminded
    of James Baldwin’s theorizing about moments of secular catastrophe in biblical
    terms and as an instance of seismic rupture involving "historical vengeance, a
    cosmic vengeance" issuing from unresolved tensions.¹⁴ Keith Byerman’s discussion
    of the apocalyptic visions of John Edgar Widman, Toni Morrison, and Charles Johnson
    leads to an investigation of how artistic representations of end-time events are
    “linked not only to contemporary obsessions with technological and political disorder
    and religious media images of Armageddon but also with historical recurrences
    of such concerns at ends of centuries.¹⁵ As Byerman remarks, "By exploring the
    sources of the creating and transformative moments, the writers imply the truth
    of our moment. In this sense, the ''end of time'' becomes an opportunity to consider
    the ends of history. In each case, the end that ends them race.¹⁶


    Morrison asserts that "matters of race and matters of home are priorities in [her]
    work."⁷ The act of writing is similar to an excavation process enabling the historical
    reclamation crucial to healing on the part of Black Atlantic subjects'
