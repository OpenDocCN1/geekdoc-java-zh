  md: '# The Postapocalyptic Black Female Imagination


    structure that Shori hopes to create affirms the traditions of Ina without being
    subsumed by them. This new family arises in response to moments of personal and
    communal disaster points to the postapocalyptic dimensions of the novel in turn
    and a narrative investment in catastrophe as a means of radically reconstructed
    self and society. Shori’s new family, which has yet to materialize, has implications
    for the past as well as for the interfamilial and pansexual arrangements emerging
    futuristically.


    Rather than being a finale, this chapter therefore lays the groundwork for a continued
    investigation of Black women’s postapocalyptic imaginaries by mapping the terrain
    of male–female relations, gender constructions, and sexualities in the era of
    the “post.” If the domestic arena is, as Homi Bhabha firmly asserts in the interrogation
    of the various transhistorical spaces marking the displacement on the part of
    the postcolonial subject, a “site[s] for history’s most intricate invasions,”
    then a scholarly investigation of that space and its role as a possible locus
    for the formation of utopian spaces of familial harmony and stability is warranted.¹
    Naomi Klein’s theory of disaster capitalism offers a useful framework for interrogating
    the dominant culture at erasing difference and the struggle on the part of Black
    women to recover a gendered history. Tracing the account of free market ideology,
    artificially constructed social order, torture, and privatization from the Second
    World War until the present, Klein critiques unregulated capitalism as a tool
    designed to realign a post-catastrophe society in the interests of a bureaucratic
    system that favors wealth, power, and privilege. Natural disasters and war serve
    to seize control of institutions and infrastructures in the service of capitalist
    advancement, to lay claim to geographic and institutional spaces for free market
    purposes.


    One could easily add pandemics and social unrest to the litany of catastrophes
    prompting efforts to restructure present-day society in the wake of devastation
    and ruin. Incidents involving police brutality against unarmed men and women could
    well be considered evidence of the shock-and-wave tactics of a bureaucratic system
    intent on maintaining power over an oppressed group. Klein’s observations about
    capitalism tendency to not only advance the interests of a free market economy,
    but also render an adversary docile and complacent–zombie–like–through thought
    and mindcontrol are relevant in an appraisal of Black women’s postapocalyptic
    narratives and the stories that contemporary writers, filmmakers, and performing
    artists retell. Vernacular culture offers sites of memory useful in reinscribing
    forgotten historical narratives as a basis for recovering the multiple voices
    that comprise the Black woman’s narrative project.'
