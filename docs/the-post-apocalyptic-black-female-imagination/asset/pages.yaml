    # “Choked on the Foreign”: Language and the Ritual of Dispossession


    When Ella O’Grady-Langley falls victim to a mysterious illness, Mass Cyrus undertakes
    an unconventional healing to rid the young woman of the toxic substance that threatens
    her physical and psychological well-being. Brodder’s protagonist returns to Jamaica
    as a shadow of her former self, covered with boils, and carrying a huge mass in
    her belly. Staring blankly into space with routine utterances is evidence of a
    psychic disorder that has taken hold of the young woman in ways preventing meaningful
    social interaction with Grove Town residents. Mass Cyrus offers a vague diagnosis
    of Ella’s malady before carrying out a bizarre seven-day ritual allowing Ella
    to expel the large gray substance. With overtones of a drug overdose, childbirth,
    or exorcism, Ella’s illness and healing are a catalyst for a lightning storm of
    apocalyptic proportions accompanied by destruction of the natural world and homes
    along with widespread loss of life.


