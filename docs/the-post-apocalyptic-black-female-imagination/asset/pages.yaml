    # Killing Whiteness


    Cliff attends to the myriad parts of institutional control that frustrate the
    identities and aspirations on the part of a raced population—from the blatant
    racism on the part of the southern innkeeper to the subtle forms of racism in
    an urban landscape. Although the invisible structures of whiteness reinforce the
    sense of “otherness” confronting Clare and her family, the mother or motherhood
    serves as a locus for framing oppositional strategies of resistance in the move
    toward an intersectional self that refuses to distinguish one’s political consciousness
    from the larger project of identity construction. Inferences of the maternal persist
    throughout Clare’s transnational travels and culminate with her return to Jamaica
    where she and her comrades take refuge on Mattie’s land. Much like her husband,
    Boy Savage embodies the anxieties of belonging on the part of the West Indian
    immigrant. Rather denying her raced identity, however, she embraces a radical
    philosophy of Black empowerment that threatens to undermine the very foundations
    of a racialized contemporary America. Kitty’s efforts to find acceptance within
    the immigrant community in New York are thwarted as a result of tensions between
    the various cultural groups who take up residence in their largely West Indian
    Bedford neighborhood. Disillusionment with America’s persistent xenophobia and
    the tension between immigrant groups prompt her return to Jamaica where she hopes
    to open a school for disadvantaged youths.'
