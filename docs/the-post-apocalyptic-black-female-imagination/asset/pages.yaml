    suffering. In their literary or folkloric manifestations, they are responsive
    to necromancy in relation to an African-Caribbean epistemology as they are to
    the machinations of science or scientific intervention in the speculative, bending
    to external influences of manipulation, domination, and control.


    Drawn from African-Caribbean (Haitian) lore surrounding the undead, the condition
