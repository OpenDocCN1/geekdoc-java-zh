    To what extent, though, is it possible to account for the current preoccupation
    with the end-time events not only with the talented singer, but also among other
    musicians, authors, visual artists, filmmakers, moviegoers, superhero comic fans,
    as well as literary and cultural critics worldwide? Now that society has witnessed
    the *die siècle* without an apocalyptic final, why does the specter of a cataclysmic
    end of the world and its uncertain eschatological aftermath continue to exert
    a powerful influence on a late-twentieth and early-twenty-first-century imagination?
    What are the implications of an indigenous cultural past envisioned in a utopian
    social order? Can members of marginalized cultures intent on recovering a lost,
    fragmented heritage envisage possible futures? Questions about the existence of
    extraterrestrial aliens, and post-human creatures, ethical issues surrounding
    genetically engineered or technologically enhanced beings, theories surrounding
    deadly plagues, and matters concerning the role of biotechnology in the realms
    of medicine and science have been the focus of considerable debate in recent times.
    This efforts prompt literary theorists, cultural critics, scientists, and ordinary
    citizens to re-think customary boundaries between art and science, technology
    and the body, and, most important for this project, history and the future. The
    project not only interrogates Black women''s postocalyptic imaginaries; it also
    breaks scholarly ground by attending to the manner in which an non-hegemonic positioning
    transforms representations of futurity in distinctive ways.


    Mark Dery''s catalog of Black science fiction writers betrays a US and masculine
    bias with pioneering novelist Octavia E. Butler as the lone female named as contributor
    to the trendy genre. Rather than serving as a coda, a final quite regarding the
    Black literary engagement with science fiction, his essay offers a starting point
    for reviving a scholarly reappraisal of Black fantasy culture. Since the publication
    of his landmark essay announcing the beginnings of a formal study of Afro-futurism
    as a literary and cultural phenomenon, scholars have undertaken the challenging
    task of mapping the field in innovative ways.³ Not only have Black women made
    significant contributions'
