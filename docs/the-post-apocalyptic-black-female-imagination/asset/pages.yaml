  md: '# Beyond the End of History


    itself in a trans-Atlantic history featuring time travel, cultural clashes with
    the alien "other," and the ambivalent relation with home. The novel’s titular
    heroine is a Himba young girl, guided by an ancient astrolabe, "on the threshold
    ... between home and my future."27 Binti’s journey to Oomza Uma aboard a genetically
    enhanced fish serving as a space ship is at both a coming of age and a voyage
    cross cultures, nations, and worlds resonant with the immigrant experience. If
    an encounter with the genocidal, war-like Meduse prompts Binti to summon the indigenous
    cultural practices of her remote village, that moment also occasions her role
    as a master harmonizer whose mathematical and scientific attitude allows her to
    reclaim gender norms. Recent "Black to the Future" conferences held within and
    outside of the continental States advance the project of expanding the geographic
    and scholarly boundaries of Black fantasy culture to include Okafor and an emerging
    group of Black female authors. It is important to note that the 2018 box-office
    phenomenon Black Panther holds the distinction of being the first mainstream science
    fiction movie to be set in Africa and feature a predominantly Black cast.


    Language plays a central role in an appraisal of Black women’s postcolonial imaginaries
    with the construction of what hooks frequently describes as a reimagined social
    space for framing "new, alternative, oppositional aesthetic acts."28 Encoded within
    the unwritten here Black expressive culture, the passage to fanciful worlds entails
    a dismantling of established social arrangements in the objectifying discourses
    of the dominant culture. Jacques Derrida’s concept of "free play" as a disruption
    of presence has implications for postcolonialism in the term of the multifaceted
    identities and alternative realities writers and artists envision the role of
    catastrophe as a signing event marking a disassociation between the signifier
    and the signified, an instance of narrative rupture prompting a re-centering of
    meaning outside established semiotics.29 Lamonda Horton Stall initiates her critique
    of female sexuality in vernacular structures and modes of cultural production
    excluded from mainstream critical interventions. In her reading of narrative moments
    involving the wild woman, Horton Stall deploys a critical methodology involving
    what she labels "trickster-tropping" as a metaphor for futuristic possibilities
    of identity."30 “The binaries that women in the West are confronted with, Horton
    asserts,"seek to create a utopia by erasing difference or subordinating difference.
    Trickster-tropping captures Black female writers and performers’ deliberate narrative
    intersection of folklore, vernacular, myth, and queer within their texts to interrupt
    social binaries and express desire."31'
