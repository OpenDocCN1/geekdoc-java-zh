  md: '# The Postapococalyptic Black Female Imagination


    Implicit within remarks on the part of celebrated novelist Octavia E. Butler is
    her reliance upon the genre conventions of science fiction as a method of cultural
    criticism. "I was attracted to science fiction because it was so wide open," Butler
    reveals. "I was able to do anything and there were no walls to hold me in and
    there was no human condition that you were stopped from examining."10 Butler''s
    fictionalization of a postapocalyptic culture where aliens, vampires, and other
    extraterrestrial beings are commonplace disrupts a temporal history that insists
    upon a separation between past, present, and future, between ordinary experience
    and a fanciful world populated by ethereal figures. In the futuristic realm Butler
    evolins, not only do cyborgs, bionic women also embody an intersectionality that
    challenges notions of race, class, gender, and sexuality. These otherworldly beings
    may happily coexist with folkloric personae as the soucouants of Afro-Caribbean
    fame, known for their shape-shifting abilities. By challenging science fiction''s
    reliance upon tropes of witness and maleness, she opens up the genre to a wider
    audience, encouraging a reassessment of established identity constructs and the
    temporal spaces where identities are forged.


    The Postapococalyptic Black Female Imagination employs a theoretical methodology
    informed by the latest scholarship in gender and cultural studies as a means of
    examining moments of catastrophe and disaster and the futuristic imaginaries that
    follow. This project juxtaposes works widely considered as mainstays in Afro-futurism
    alongside those not previously included within fantasy culture in revealing the
    utility of reading Black women''s postapocalypticism as an unacknowledged subgenre
    of science fiction. Works under investigation envision cataclysmic upheaval that
    penetrates the end of an old era and the beginning of an altogether new reality
    existing as a part of, yet separate, temporal history. The cataclysm could be
    either a occurrence or one taking place in time-present of narrative action. It
    might consist of a rendering of an actual incident, or a visualization of one
    transpiring in the not-too-distant future. A natural or human-made disruption
    may also signal an apocalypse with Edwidge Danticat''s fictionalization of the
    2010 Haiti earthquake. Jesmyn Ward and Beyonce beyond the post-Katrina Southeastern
    US Gulf region in the area''s social, environmental, and cultural life. Incidents
    of social unrest or a pandemic likewise signify a postapocalyptic sensibility
    prompting Nalo Hopkins''s account of urban chaos following Toronto''s 1992 Yonge
    Street Riot in Brown Girl in the Ring or Erna Brodbder''s rendering of sickness
    and disease in Myal.'
