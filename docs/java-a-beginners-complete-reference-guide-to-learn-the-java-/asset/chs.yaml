  *   “Perl – 唯一在 RSA 加密前后看起来完全一样的语言。”\n\n\n\n\n\n> “你所学过的最糟糕的事情，就是你的第一门编程语言。”\n>\
  \ ― 艾兰·凯（Alan Kay）\n\n> “计算机就像小提琴。你可以想象一个新手先尝试唱片机，然后是尝试小提琴。他说，后者听起来非常难听。这就是我们从人文主义者和大多数计算机科学家那里听过的论点。他们说，计算机程序对于特定目的很有用，但它们并不灵活。小提琴或打字机也是如此，直到你学会如何使用它们。”\n\
  > ― 马尔文·明斯基（Marvin Minsky）\n\n> “程序最重要的属性是它是否实现了用户的意图。”\n> ― C.A.R. 霍尔（C.A.R. Hoare）\n\
  \n> “面向对象的编程提供了一种编写面条代码的可持续方法。它让你像堆积补丁一样堆积程序。”\n> ― 保罗·格拉姆（Paul Graham），*黑客与画家：计算机时代的宏大思想*\n\
  \n> “四十岁时，我已经太老不能再当程序员了；写代码是一项年轻人的工作。”\n> ― 米克尔·克莱顿（Michael Crichton），*猎物**\n\n\
  > “说真的，一些优秀的编程是在纸上完成的。把它们放入计算机只是一个次要的细节。”\n> ― 马克斯·卡纳特-亚历山大（Max Kanat-Alexander），*代码简单性：软件基础**\n\
  \n> “衡量程序员的标准不应该是他们的才智和逻辑，而应该是他们用例分析的完整性。”\n> ― 艾兰·J·珀利斯（Alan J. Perlis）\n\n> “只有当我们训练自己去思考程序，而不将它们仅仅视为可执行代码片段时，进步才可能。”\n\
  > ― 埃德格·W·迪杰斯特（Edsger W. Dijkstra）\n\n> “不要因为你‘知道’它是能运行的，就忽略掉涉及 bug 的例程或代码段。证明它。在这个语境下、使用这些数据、使用这些边界条件来证明它的正确性。”\n\
  > ― 安德鲁·亨特（Andrew Hunt），*程序实战之道：从行手到大师**\n\n> “记住，代码实际上是我们最终表达需求的语言。我们可能会创建更接近需求的语言。我们可能会创建帮助我们解析并将这些需求组装成正式结构的工具。但我们永远无法消除必要的精确——所以永远会有代码。”\n\
  > ― 罗伯特·C·马丁（Robert C. Martin）\n\n> “软件测试是一项像狩猎一样的运动，它是捕虫。”\n> ― 阿米特·卡兰特里（Amit Kalantri）\n\
  \n> “事实证明，编程是很的。基本规则通常简单清晰。但建立在这些规则之上的程序往往会变得复杂到足以引入它们自己的规则和复杂性。在某种程度上，你正在构建自己的迷宫，而你可能会迷失其中。”\n\
  > ― 马里恩·哈弗贝克（Marijn Haverbeke）\n\n谢谢！\n\n"
