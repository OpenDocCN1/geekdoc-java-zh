  \ W. Kernighan`\n*   “一种不能影响你思考方式的语言是不值得学习的。” —— `Alan J. Perlis`\n*   “计算机程序员是宇宙的创造者，因为他们是唯一的立法者。没有哪个剧作家、导演或皇帝（无论多强大）拥有过如此绝对的权威来安排舞台或战场，并指挥如此绝对听话的演员或士兵。”\
