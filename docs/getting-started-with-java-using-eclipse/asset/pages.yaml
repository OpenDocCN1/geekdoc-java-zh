  md: '# programmingcourse


    ![](img/292946f2e46e87f1c5153615a652bd5b_342_0.png)


    **Figure 20.6:** Anna has developed a technical analysis model.


    From a purely technical point of view, there are admittedly two manifestations
    of the course at the university: compulsory and elective. Therefore, according
    to the requirements, Anna has modeled the general class *Course*, which can be
    used for compulsory and elective subjects if later.


    # 20.4.2 Design


    The subject requirements for the student management program must be refined in
    a direction in the next stage of development. The blueprint of a Java program
    that now emerges is the so-called object-oriented design model. In a Java program,
    the design contains, other things, class models. In object-oriented design, the
    software develops a sensible technical form of the classes that are required for
    the program.


    In Figure 20.7, you can see Lukas'' proposal for the design model. Lukas has technically
    refined Anna’s design and added getter methods. He has marked all private attributes
    with a minus sign, and the public interface methods with a plus sign. Each of
    the classes listed in this model must be described as Java source code in the
    next section of the process flow, «Implementation».'
