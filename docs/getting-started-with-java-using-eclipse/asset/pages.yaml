    # **Keyword »final«


    To prevent a class from being inherited, you could put the keyword final, which
    you already know from constants, the name of the class. It has a slightly different
    effect: no subclasses can be created from classes that are marked in this way.
    This is true of many classes that are part of the Java standard library, such
    as the class *String*, a snippet of which you can see in Figure 9.23.


    The point behind the»inheritance prohibition» is that it can be used to prevent
    class hierarchies. Class hierarchies with very many levels lead to very strong
    dependencies in programs. If one changes a detail at a basis class, one must change
    often long chain of classes. This leads to very high test expenditure and is accordingly
    expensive. With the keyword final such long inheritance hierarchies can be prevented.'
