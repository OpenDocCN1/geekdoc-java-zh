    The error occurs on line 9, where the creation of the object with the new operator
    is missing. Therefore the program outputs the following:


    > Exception in thread "main" java.lang.NullPointerException

    at programmingcourse.NullPointerException.main(NullPointerException.java:9)


    The output says that line 9 of the program was an attempt to access a variable
    to which the program has not yet assigned an object. If you remove the error in
    line 9, the program looks like:


    # Listing 26.7: Creating an object in line 9 removes the NullPointerException.


