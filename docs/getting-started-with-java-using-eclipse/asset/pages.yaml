  md: '# 21.4 Java Virtual Machine 345


    systems and computer hardware as part of the Java installation. This software
    mimics a physical computer. Since it only imitates a machine, this software is
    called a \`virtual machine\u0 This virtual machine is a fairly complex piece of
    software (Figure 21.6).


    ![](img/292946f2e46e87f1c5153615a652bd5b_370_0.png)


    **Figure 21.6:** The very simplified illustrated structure of a modern HotSpot
    VM.


    A modern Java VM consists of (simplified representation of) the class loader,
    the bytecode verifier, the memory space, a JIT compiler, the interpreter, and
    the garbage collector. When the program starts, the virtual machine uses the class
    loader to load the classes of a program into its memory space, checks the bytecode
    using the bytecode verifier and, after a successful check, executes the Java program.
    This execution can be done in several ways: in pure interpreter mode, in pure
    mode with a JIT compiler, or via a mixed mode that combines both approaches.


    # 21.4.2 Interpreter mode


    The slowest way to run a Java program is in interpreter-only. In this mode, the
    virtual machine interprets each instruction of the bytecode and executes it. By
    processing each instruction of the bytecode itself, there is no conversion of
    the bytecode to native code. In newer Java machines, this mode is disabled due
    to slow processing speed. You can turn it on by using the \`java -Xint\` instruction
    (Section 21.8, » JVM Configuration»).


    More books: https://t.me/booksforsmith'
  merge: -1
  pgno: 370
- img_proc: true
  md: '# 21.4.3 JIT compiler mode


    Up to 40 times faster than in interpreter-only mode, the virtual machine executes
    Java programs when it uses its-in-time (JIT) compiler. In this mode, the JIT compiler
    translates code into real machine code step-by-step. As a result, a Java program
    is usually much faster compared to the interpreter mode. Only where parts of the
    program are run infrequently does the JIT technique have disadvantages in the
    execution speed of a Java program compared to interpreter mode.


    ![](img/292946f2e46e87f1c5153615a652bd5b_371_0.png)


    Figure 21.7: New Java VMs accelerate the execution of Java programs.


    Since the speed advantages of JIT technology outweigh interpreter operation, pure
    JIT operation was the technique of choice until JDK 1.2 if you wanted to optimally
    accelerate Java programs. Meanwhile, a modern Java VM executes bytecode in a mixed
    mode.


    # 21.4.4 Hotspot Mode


    Between the release of Java version 1.2 and version 1.3, then-owner Sun Microsystems
    introduced a new technique for accelerating Java programs: the hotspot VM. This
    modern Java VM combines the advantages of interpreter technology with those of
    a JIT compiler. The Hotspot VM does not translate the entire application into
    machine code, but only the parts where optimizations are really worthwhile. These
    parts are the »hot spots« of the program. the hotspot VM is still the state of
    the art in Java VM today.'
  merge: -1
  pgno: 371
- img_proc: true
  md: '# 21.4.5 Garbage Collector


    The virtual machine provides automatic memory management to Java programs. Each
    object is automatically allocated the memory it needs by the virtual machine.
    The Java developers do not have to worry about the memory management of their
    program.


    ![](img/292946f2e46e87f1c5153615a652bd5b_372_0.png)


    **Figure 21.8:** Robert gets rid of his garbage like a garbage collector.


    When objects are no longer needed, the garbage collector disponer of them. At
    regular intervals, it checks whether it can free up memory space. Objects that
    are no longer needed are, so to speak, the garbage that the garbage collector
    «disposes» of.


    # 21.5 Libraries


    # 21.5.1 Native Libraries


    The Java Runtime Environment consists not only of the virtual machine, but also
    of various native libraries that the virtual machine requires.'
