  md: '# 2.2 Overview


    # 2.2.1 The Early Days of Java


    The history of Java began when some programmers from the Californian company Micros
    were asked to develop an object-oriented programming language called Oak (Object
    Application Kernel) for programming household appliances in 1991. Household appliances
    are not very powerful. Therefore, Oak programs should be compact so that they
    can run quickly. Since home appliances use different software and hardware, Oak
    programs should be as easy as possible to transfer from one appliance to another.
    It turned out that these requirements were also an ideal fit for implementing
    Internet programs. Without further ado, the Oak team was given the task of developing
    the first browser for Oak programs.


    ![](img/292946f2e46e87f1c5153615a652bd5b_37_0.png)


    **Figure 2.2:** The early days of Java.


    About a year later, the new browser could display small programs (applets) on
    HTML pages. It saw the light of day as «HotJava» with the programming language
    ''Java'' in 1995. Java 1.0 was followed in 1996 by Java 1.1 in the same year.
    Java programs were still very slow at that. In addition, programming graphical
    user interfaces (GUIs) was difficult at the beginning. This ending brought a new
    Java class library calling Swing. The increased performance of Java was also increased
    in the size of the Java class libraries with 1.2. The number of classes increased
    explosively to over 1300 – Java became a technology.


    In 2000, Java 1.3 appeared with the so-called hotspot optimization. It frequently
    used parts of a program (hotspots) directly into native machine code. This led
    to Java running significantly faster for the first time. The successor Java 1.4
    brought more language extensions and the introduction of Java Webstart. Java Webstart
    updates a Java program automatically at start, that updates are available for
    this program.


    > Java is a slang expression for coffee. According to an anecdote, the team that
    developed Java named the new programming language after a type of coffee.


    More books: https://t.me/booksforits'
