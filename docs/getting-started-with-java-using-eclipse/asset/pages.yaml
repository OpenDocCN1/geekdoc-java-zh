    # 11.3 Summary


    Arrays are very simple data containers. Unlike some other programming languages,
    an array variable in Java is an object. This object consists of further elements
    of any type. These elements are also objects.


    ![](img/292946f2e46e87f1c5153615a652bd5b_212_0.png)


    **Figure 11.9:** Java is not enthusiastic about arrays because they are «only»
    semi-dynamic.


