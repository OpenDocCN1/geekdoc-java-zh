    # # 10.4 Summary


    Enumerations are one of the most noticed news of Java 5. You saw at the beginning
    of this chapter a self-developed enumeration class based on a pattern written
    without a Java keyword for enumerations. The keyword enum, available since Java
    5 eliminates the need to program own enumeration classes from scratch. Another
    advantage of Java enums is that they increase the readability of Java programs
    and improve the source code.

    As simple enums are to use, their internal structure is complicated. Internally,
    the Java compiler translates an enum class into a special enumeration class that
    inherits from the internal class Enum and has various methods based on this base
    class. The behavior of an enumeration class can be customized to output arbitrary
    element names. Therefore, it is important to deal not only with the definition
    and use of enums, but also with the internals of this special class.


