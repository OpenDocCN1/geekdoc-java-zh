  md: '# 19.2.3 Predefined Annotations


    # Standard Annotations


    You will not normally annotate yourself. Instead, you will resort to those that
    are already part of the Java language as standard annotations. Table 19.2 shows
    an overview of the predefined standard annotations. Especially the first three
    annotations are frequently-encountered in the source code of Java programs.


    Table 19.2: This table presents an overview of the predefined standard annotations.


    | Annotation | Description |

    |---|---|

    | @Deprecated | Marks a class, interface, method, or attribute as deprecated or
    obsolete |

    | @SuppressWarnings | Suppresses warnings and error messages |

    | @Override | Marks a method as overridden. The compiler checks whether a method
    that can be overridden exists in the base class and issues an error if it does
    not |

    | @SafeVarargs | Assures that method does not perform unsafe operations on its
    varargs parameter |

    | @FunctionalInterface | Specifies that the interface should be a functional interface
    according to the language definition |


    # Meta-Annotations


    If the previously mentioned standard annotations are not enough for you, you have
    to program your own annotations. To make this easier, Java provides so-called
    meta annotations. These are only needed to define your annotations (Table 19.3).


    Table 19.3: This table presents an overview of the predefined meta-annotations.


    | Annotation | Description |

    |---|---|

    | @Retention | Specifies how the annotation marked with it will be stored (this
    can be in source code, bytecode or at runtime) |

    | @Documented | Indicates that the use of this annotation should be documented
    (by default, the use of annotations does not need to be documented) |

    | @Target | Specifies to which language elements this annotation can be applied—type,
    methods, constructions, local variables, packages or all language elements |

    | @Inherited | Indicates that this annotation can be inherited from the superclass
    (applies only to annotations that refer to classes) |

    | @Repeatable | Indicates that this annotation can be used multiple times in the
    same place to mark up the source code |'
