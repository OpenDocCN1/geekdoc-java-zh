    # Return Values


    All Java methods – except constructors – must specify in their method header whether
    they return a value, or what type it is. So are two cases:

    * The method returns no value: return type void.

    * The method returns a value: data type corresponding to the return value.


    In Figure 12.8, you can see a comparison between a method without return value
    (left) and one with return value (right). In the figure on the left, you can see
    from the keyword void that this method does not return a value. In the method
    on the right, you can see the data type at this point. It must match the method
    returns. The return introduces the method by the keyword return.


    ![](img/292946f2e46e87f1c5153615a652bd5b_219_1.png)


    **Figure 12.8:** Comparison of methods without and with return value.


    # Access Protection


    The type of the return value is preceded by the visibility of the method. To treat
    the visibility in more detail would go beyond the scope of this chapter. Only
    this at this point: There are four levels to define the encapsulation of a method:
    public, protected, default, and private. Encapsulation is used to protect the
    method from access outside the object.


