    # 22.3.3 Threads


    In some situations it is necessary for a program to do not only one task, but
    several in parallel. In this program then several threads of action run, so-called
    threads. To avoid the situation in every Java programmer has to develop such difficult
    concurrent programs from scratch, there is support for this in the Java class
    library as well.


    The help comes from a class Thread and an interface called Runnable. The class
    implements this interface and provides every Java programmer with important functions
    to start, stop and synchronize mini-programs within their program. Here is an
    example, which consists of three classes. The class ThreadDemo is the main program
    with the start method main 22.10.


