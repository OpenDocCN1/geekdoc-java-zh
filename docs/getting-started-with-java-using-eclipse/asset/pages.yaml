    \ loops. The while loop is rejecting if the expression in the loop header is false.\
    \ The loop will not run if the termination condition in the loop header is false\
    \ 15.3.\n\n![](img/292946f2e46e87f1c5153615a652bd5b_278_0.png)\n\n**Figure 15.3:**\
    \ Structure of the while loop.\n\nListing 15.1 shows an example of a while loop.\
    \ The following example outputs the days of the week one after another, which\
    \ were defined in a string array. Since the numbering of an array always starts\
