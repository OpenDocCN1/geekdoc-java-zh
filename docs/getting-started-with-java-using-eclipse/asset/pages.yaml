    has been defined, it is unchangeable for the life of the program. The arithmetic
    operations that are bound to a variable are also unchangeable. For example, a
    string firstName cannot be multiplied by another string lastName (Figure 7.4).
    If the programmer had declared numerical values instead, the code could perform
    the multiplication.


