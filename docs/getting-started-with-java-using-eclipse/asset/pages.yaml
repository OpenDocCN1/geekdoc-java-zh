    # # 21.8 JVM Configuration


    The Java VM provides many basic options for starting a program. The option -cp
    means «Class Path» and is used if you want to start a program from single classes
    without a JAR archive. The -version option is also important. We used it in chapter
    4, »Development Environment«, to determine the Java version using java-version.


    **Table 21.1** The most important options for starting a Java program


    | Options | Meaning |

    |---|---|n| -cp <path> | Path to Java classes |

    | -D<name>=<value> | Set system properties |

    | -jar [options]<filename> | Start program from jar archive |

    | -verbose:[class][gcni] | Detailed information about loaded classes, garbage
    collector and Java Native Interface |

    | -version | Show version and exit |

    | -showversion | Show version and don''t exit |

    | -?,help | Print these (and other) options |

    | -X | Display messages that are not part of the standard |


    In addition to the base options, there are a number of advanced options. Table
    21.2 lists the most important ones. Especially for larger programs are the parameters
    you use -Xms and -Xmx, which determine the size of main memory for your program.
    You use the first value to set the initial heap size, and the second to set the
    maximum. Eclipse sets the first value to -Xms256m and the second to -Xmx1024m.


