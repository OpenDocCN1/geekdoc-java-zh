    # Dot Before Dash


    In the first case, the program tries to perform addition first, but is not allowed
    to do so because of the dot before dash rule. For this reason, it first performs
    the multiplication and gets 12 as result. It divides this value by *b* and gets
    3. The final addition of 3 plus 4 gives 7.


    # Excess Bracket Levels


    In the second case, the set parentheses do not change the result, they do not
    affect the evaluation order. Thus, the calculation proceeds identically.


    # Swap


    In the third case, a mathematical rule comes into effect, the so-called law of
    interchange (commutative law). This means equivalent operands (arguments) are
    interchanged. So where *b * c* is processed or *c * b*, does not matter at first
    for equivalent arithmetic operations. The calculation runs identically here, too.


    # Lost Division Remainder


    What happened in the 4th case? The bracketing of the expression c/d leads to contrast
    to the first case to fact that an intermediate result must be used. This also
    happened in the fifth and eighth case, because the expression could not be multiplied
    immediately.


    In the case of division, a type conversion takes place (Section 23.6, »Type Conversion»).
    Since the result 0.75 is not an integer value, the decimal places (division remainder)
    are lost. What remains is only the value 0, and as a multiplier in the seventh
