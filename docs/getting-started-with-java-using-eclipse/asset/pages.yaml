  md: '# 20.2.1 Correlation Between Phases And Activities


    In an agile approach, phases are divided into sections of two to three weeks –
    the so-called sprints. In each sprint, the activities »Requirements Capture, »Object-Oriented
    Analysis And Design, »Implementation» and »Test run in sequence in software development.
    The complicated overall process becomes clear if you take a closer look at the
    individual phases (20.3).


    | Time | | | | | | | | | | | Milestone RC1 | Milestone GA |

    |---|---|---|---|---|---|---|---|---|---|---|---||

    | Start of the Development | End of Rough Planning | | | | | Focus Planning |
    Focus Construction | Focus Operation |

    | Sprint | 1 | 2 | 3 | ... | n | 1 | 2 | 3 | ... | n | 1 | 2 | ... | n |


    **Figure 20.3:** Correlation between phases and activities.


    In the figure, you can see the individual sprints in the middle. They run from
    sprint 1 to n in the planning phase, in the construction phase and in the operation
    phase as well. From left to right, the software product becomes more and more
    through the various activities within the sprints (Requirements Capture, Analysis
    & Design, Implementation and Test) until delivery and thus operation is reached.
    Before delivery, the customer is provided with a so-called release candidate (RC),
    after which the software is »generally available–(GA), i.e. available as a product.'
