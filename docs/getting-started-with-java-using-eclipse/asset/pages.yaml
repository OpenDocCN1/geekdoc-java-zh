  md: '# 23.2 Overview


    When developing Java programs, you must respect many rules. This starts with notations
    of packages, classes, interface, methods, variables and constants and continues
    with the rules for visibility of classes, methods and variables. In addition there
    are rules concerning the evaluation order, rules for the type conversion, and
    rules for polymorphism.


    Writing conventions are soft rules. They are only necessary, so that one can read
    programs better and have no effect on the execution of programs. The situation
    is different with access levels: The keywords public, protected, private and default
    access level have a significant impact on the design of programs.


    Table 23.1: Overview of the Java rules in this chapter.


    | Rule | Description | Purpose |

    |---|---|---|n| Writing conventions | The writing conventions define how language
    elements (packages, classes, interfaces, methods, variables and constants) should
    be written within the Java source code. | Better readability and uniform notation
    of the Java source code |

    | Access levels | Access protection determines who may access objects, methods
    and attributes within Java programs. | Protection against unwanted objects and
    their elements |

    | Evaluation order | The evaluation order determines the order in which expressions
    are processed within Java programs. | Control of the evaluation order of Java
    instructions |

    | Type casting | Type casting temporarily removes the assignment of data to variables.
    | Controlled change of the assignment of variables to data types |

    | Polymorphism | Polymorphism allows methods to be overwritten and overloaded.
    | Situational change of the objects |


    Another stumbling block when developing Java programs is the evaluation order
    of expressions. Equally unpleasant are confusions in implicit and explicit type
    conversion. But not least, the rules for polymorphism, overloading and overfitting
    methods are extremely important rules.


    Eclipse can only keep track of a portion of these rules without extensions. If
    you want more support from the development environment, take a look at my homepage.
    There are some useful Eclipse listed, whose explanation would go beyond the scope
    of this book (Section 23.9, «Literature»).'
