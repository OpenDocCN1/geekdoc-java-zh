  md: '# 14.2 Overview


    Conditional statements are used to control the program flow. They therefore belong
    – like loops – to the control flow statements of a program. You can see an example
    of a flow chart with a conditional in 14.2. Here, at the beginning, where the
    green diamond is located, it is to be decided whether the person is enrolled at
    a university. The program distinguishes between two cases in this example: The
    person is a student, and the person is not a student. In each case, the program
    should be able to distinguish whether the person is enrolled or not.


    ![](img/292946f2e46e87f1c5153615a652bd5b_267_0.png)


    The example has shown that a programming language must have at least one way of
    making such case distinctions in order to control the program flow. Java has adopted
    two constructs from C/C++ with the if and case statements. If the statement allows
    simple distinctions, while the case statement can differentiate between multiple
    states. In the following, you will learn how to use these constructs with the
    help of some examples.


