  md: 'It is the same with the eclipse phase. Here, the focus is on analyzing the
    requirements, finding Java classes, programming Java code and testing this code.
    It may also be that new requirements are discovered in discussions with the customer.
    Then you have to estimate how long it will take to incorporate these requirements.
    Afterwards, one converts the changed requirements into Java code, then tests the
    program and presents it to the customer again.


    # 20.2.3 Tools


    A good developer must not only know and master this complicated overall process.
    It may also select development tools and learn how to use them. The productivity
    of the developer depends on the selection and integration of appropriate tools.
    In addition to an agile development process and well-trained developers, good
    tools and class libraries undoubtedly lead to less stress and lower development
    costs.


    Regarding class libraries, this part of the book comes in chapter 22. As far are
    concerned, it is quite enough to use the already installed Eclipse now. You should
    have the Eclipse development environment installed so that you can perform the
    exercises in this chapter. For a description and installation instructions, see
    chapter 4, [Development Environment].


    # 20.3 Planning Phase


    In the planning phase, a contract is created between the software developer and
    the client (customer or end user). This contract states, among other things, what
    is to be produced, how expensive the entire project may become and what risks
    the project entails. The contact person for the software developer is, for example,
    an end user, a business manager, the project team leader, the chief IT designer
    or chief IT architect. From one of these contacts, the software developer will
    learn what tasks he or she will be asked to perform.


    # 20.3.1 Order Clarification


    On the one hand, mission clarification causes much of the difficulty in developing
    the software because users and software developers do not speak the same language.
    Furthermore, it is necessary to determine exactly what the clients want so that
    the risk of developing something wrong is reduced. Certain techniques such as
    an agile approach help this.


    # 20.3.2 Requirements Capture


    The following example: Our programming class with Anna, Julia, Florian and Lukas
    is supposed to develop a program as part of their internship that displays the
    students of their university with the courses and electives they have taken. In
    discussions with a lecturer'
