  md: '# 24.2.2 Types of Algorithms


    Algorithms exist for every purpose. To better distinguish the abundance of algorithms,
    they are classified according to different types (Figure 24.3).


    +   Types of algorithms {

    * Sorting algorithms

    * Search algorithms

    * Graphs

    * Pattern recognition algorithms

    * Mathematical tasks

    * Solving geometric problems

    }


    > Algorithms are needed for a wide range of use cases such as sorting or searching
    for an array. Some you have to develop yourself, for others you can use prefabricated
    Java classes.


    ![](img/292946f2e46e87f1c5153615a652bd5b_458_0.png)


    Figure 24.3: Types of algorithms.


    # 24.2.3 Use of Algorithms


    Algorithms can be implemented by yourself or you can use prefabricated classes
    that have a suitable algorithm. For both cases I would like to present some examples
    below.


    # 24.3 Develop Algorithms


    # 24.3.1 Sorting Algorithms


    It happens all time in a program that values have to be sorted. These can be numerical
    values or character strings. The decisive factor for sorting algorithms is their
    speed. One of the simplest sorting algorithms is the Selection Sort.


    Listing 24.1: One of the simplest sorting methods is the «Selection Sort».'
