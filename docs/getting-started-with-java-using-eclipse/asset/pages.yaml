  md: '# Table 5.1 Reserved keywords


    | abstract | assert | boolean | break | byte |

    |---|---|---|---|---|n| case | catch | char | class | const |

    | continue | default | do | double | else |

    | enum | exports | extends | false | final |

    | finally | float | for | goto | if |

    | implements | import | instanceof | int | interface |

    | long | module | | new | null |

    | package | private | protected | public | requires |

    | return | short | static | strictfp | super |

    | switch | synchronized | this | throws | throws |

    | transient | true | | var | void |


    Two special keywords, *const* and *goto*, have been reserved in Java, but may
    not be used. The keyword *const* may not be used in Java because Java prefers
    a syntax for constants. It must not be used to avoid problems that such references
    can cause. The case is different for the goto statement. The fact that the two
    keywords were reserved without allowing their use is due to the fact they belong
    to the language scope of C/C++. Swimmers who use these keywords will receive a
    meaningful error message.

    Keywords as *case*, *break*, and *goto* are reserved for branches. Branches allow
    the programmer to make decisions easily. Depending on the case, the program flow
    branches into one or another part. Recurring sequences, called loops, use the
    keywords *do*, and for *while*. Loops are necessary to read files line by line,
    for example. Another use of *case* is for or in connection with data types. You
    already know the data type class. A class is identified by the keyword *class*.
    Classes like the *Person* class of this example can be defined by the programmer.
    Other data types, such as *boolean* or *int*, are hard-coded in Java. You can
    simply use them without having to define anything.


    # 5.7 Summary


    In this chapter, you have seen an example of how a simple Java program is constructed.
    It consists of the main class *ProgramDemo* and an object called *roth*. The program
    creates this object from the class *Person*. Classes are stored in text files
    with the same name. They consist of attribut (*variables*) and methods. All these
    components are just instructions to the program. These instructions determine
    how the program is executed.


    To implement these instructions, Java has a whole set of reserved keywords with
    different meanings. For example, there is a keyword for defining classes such
    as the class *Person* or a keyword for creating objects using the new operator.
    Other keywords are reserved for conditionals as *if*, others for loops as *for*.'
