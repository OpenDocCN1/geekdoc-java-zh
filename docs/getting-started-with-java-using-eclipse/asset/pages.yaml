    # 25.4.7 Implementing Class »CsvParser«


    The CsvParser has the task of reading in a Csv file and outputting it as a vector.
    Im-plemented the method using the Eclipse, as shown in Listing 25.14. To parse
    Csv files, the class has a method parseCsvFile(). At the beginning of the method,
    it creates a stream to read the file (line 19) and an object for the records (line
    20).


    The structure of the vector object exactly mirrors the structure of a Csv file:
    each row is a vector of data fields (columns). The whole file is again a vector
    of records and results in a matrix (table structure). Why the class vector?


    As mentioned in the 25.3.2 section, »Developing the Data Model», vectors are ideal
    for this use case because they grow dynamically when a file is read. Thus, the
    number of rows and columns need not be known when the table is initialized. In
    addition, vectors have the advantage that a Swing table can be easily updated
    with them: it has a method that exports the vector as a parameter.


