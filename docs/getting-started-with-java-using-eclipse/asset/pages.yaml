  md: '# 2.5 Java Versions


    In the early days of Java, it took a relatively long time for a new Java version
    to be released (section 2.2, «Overview»). Meanwhile, new Java versions are released
    every six months. At the time this book went press, Java 17 was just available,
    so this book is based on that Java version. However, most of the information in
    this book also applies to older Java versions back to Java 8 – with high probability
    – to newer versions as well.


    # 2.6 Java Editions


    Java inventor Sun Microsystems originally released three editions of the Java
    platform. For this book only the Java Standard Edition (Java SE) is important.
    For the sake of complete- however, I would like to present all three editions
    here in a comparative way.


    # 2.6.1 Java Standard Edition


    The simplest edition is the Java Standard Edition (Java SE or JSE). With this
    edition you can develop Java programs as presented in this book. You can equate
    this edition with the Java Development Kit (JDK) in a simplified way.


    # 2.6.2 Java Enterprise Edition


    Java Enterprise Edition (Java EE or JEE) is an extension of the Java Standard.
    Java creator Sun Microsystems released this edition to better support enterprise
    application development using Java. JEE, however, is not a product like the JDK
    that can be downloaded anywhere, but rather «just» a set of specifications from
    the Java inventor. Open source-developers can use these specifications to program
    class libraries for enterprise applications. Of course, you can download them
    again if you plan to develop such an application.


    # 2.6.3 Java Micro Edition


    This Micro Edition (Java ME or JME) has its roots in the origins of Java. As you
    may recall, Java was intended to be developed to better program household appliances.
    Since these devices are not very powerful, Sun Microsystems developed a particularly
    small edition of the Java programming platform. Since every smartphone today is
    so much more powerful than the household appliances of that time, this edition
    has become or less obsolete.'
