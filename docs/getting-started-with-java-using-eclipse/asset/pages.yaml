  md: '# Primitive Data Types


    # 8.1 Introduction


    «Primitive» Java data types are used wherever pure numerical values or states
    have to be stored. With their help, objects store their attributes and exchange
    data. Primitive types are not classes. Therefore, variables based on these data
    types are not objects. This seems to contradict the idea of object orientation.
    Why did the inventors of Java decide to use such data types? Robert has an answer:


    ![](img/292946f2e46e87f1c5153615a652bd5b_148_0.png)


    Figure 8.1: Primitive data types are lightweight, but not classes.'
  merge: -1
