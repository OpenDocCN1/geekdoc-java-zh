  md: '# 9.2 Overview 143


    ![](img/292946f2e46e87f1c5153615a652bd5b_168_0.png)


    **Figure 9.5:** Objects are declared as variables.


    # Creation of Objects


    Objects are created using the new operator. When creating, specify the new operator
    followed by the constructor of the class (Figure 9.6). Methods and operators will
    be discussed in detail in the next chapters. Only so much at this point: A method
    is nothing else the designation of object-oriented programming for a function.
    Java operators are shorthand notations for functions, just as in mathematics.
    In this case, the function of the new operator is to create a new object using
    the constructor (often called instantiate).


    ![](img/292946f2e46e87f1c5153615a652bd5b_168_1.png)


    **Figure 9.6:** Objects are created with the new operator.


    The constructor is called like a normal method when creating an object. What is
    special about the constructor is that it is the only method that is capitalized
    in Java. This allows it to be distinguished from other methods. It must also be
    used together with the new operator As a result, you get an object whose name
    you store in a variable. It is important to understand this in detail. After the
    statement new class() object is created. However, it has no label until you assign
    a variable to the object. Until that happens, the object remains anonymous, i.e.
    nameless. The variable gives you a reference to the nameless object and you can
    access it in program.


    Take a look at the table 9.2. The table represents the very simplified relationship
    between the variable object and the object from Figure 9.6 from a technical point
    of view. In the first column you can see the name of the data item, in the middle
    column its memory address and on the far right the contents of the memory. The
    representation is very simplified¹.


    > ¹ To read the correct memory addresses and complete memory contents of objects,
    you can use the open source tool JOL (Java Object Tool) (see literature at the
    end of the chapter)


    More books: https://t.me/bookforbits'
