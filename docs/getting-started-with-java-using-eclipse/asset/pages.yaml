  md: '# 23 Rules


    # ## 23.1 Introduction


    As with any programming language, Java programs have certain rules. Some rules
    are soft – they have no negative effect on the execution of the program. Other
    rules lead to the fact that the program cannot be compiled. Still other rules
    have the consequence that the program seems to work – but unfortunately completely
    different than you imagine.


    > The Java rules

    mentioned here are the key to stable

    and standard-compliant programs. This chapter

    introduces you to renting conventions, access

    protection of objects, evaluation order

    and type casting as well

    as polymorphism.


    ![](img/292946f2e46e87f1c5153615a652bd5b_424_0.png)


    Figure 23.1: The Roth family relationships provide illustrative examples of Java
    rules.


    In other words, it can''t hurt to learn a little more about the rules of Java
    programming. This chapter introduces you to all the rules, knowledge of which
    will ensure that your programs work as they should.'
  merge: -1
