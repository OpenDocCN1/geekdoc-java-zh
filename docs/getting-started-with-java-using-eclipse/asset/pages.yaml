  md: "# 8.2 Overview\n\n# 8.2.1 Purpose of Primitive Data Types\n\nThe goal of primitive\
    \ data types was to limit the memory hunger of object-oriented programs. Since\
    \ the primitive data types are not classes, they need only little memory. They\
    \ used them everywhere, where an object with its methods is not necessary. This\
    \ is particularly the case with simple attributes of classes, for example, a pure\
    \ numerical value such as *height*\n\n# 8.2.2 Types of Primitive Data Types\n\n\
    In Table 8.1 you can see an overview of all primitive data types. They differ\
    \ in their usage, how memory they need and the value range. The value range determines\
    \ the size of the memory for a variable of this.\n\nTable 8.1: Overview of primitive\
    \ data types.\n\n| Name | Type | Size | Value range | Default | Example |\n|---|---|---||-|---|\n\
    | byte | integer | 8 | -2⁷ - 2⁷ | 0 | 1 |\n| short | integer | 16 | -2¹⁵ - 2¹⁵\
    \ | 0 | 2 |\n| int | integer | 32 | -2³¹ - 2³¹ | 0 | 3 |\n| long | integer | 64\
    \ | -2⁶³ - 2⁶³ | 0 | 5 |\n| float | decimal | 32 | ±3.4082347 * 10³⁸ | 0 | 8.13\
    \ |\n| double | decimal | 64 | ±1.79769313486231570 * 10³⁰⁸ | 0,0 | 21,34 |\n\
    | char | character | 16 | All Unicode characters | \0 | F |\n| boolean | boolean\
    \ value | 8 | true, false | true |\n\nThere are the integer data types *byte*,\
    \ *short*, *int* and *long*, the decimal data types *float* and *double*. We use\
    \ the *char* data type to store single characters, and the *boolean* data type\
    \ to store simple statuses with two values *true* and *false*.\n\n# 8.2.3 Use\
    \ of Primitive Data Types\n\n# Declaration\n\nPrimitive data types are part of\
    \ the Java language. Therefore, unlike custom classes, they do not need to be\
    \ defined, but only declared when used. The declaration is identical to the variable\
    \ declaration you already know from the chapter 6, «Variables». Here you have\
    \ to «explain» to the compiler of which simple data type variable should be. In\
    \ the declaration, you first specify the type of the variable and then the name\
    \ of the variable. 8.2 shows using this example of the data type *int*."
