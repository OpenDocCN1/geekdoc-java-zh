    **Table 24.1:** The parameters for the »fillRect()= drawing method.

    | Parameter | Purpose | Formula / Variable |

    | --- | --- | --- |

    | x | Drawing in x-direction | chartPositionX + barWidth * index |

    | y | Drawing in y-direction | chartPositionY - size |

    | Width | | barWidth |

    | Height | Size of a member | size |


    In the x-direction, the index and the bar width can be used to place the bars
    next to each other in an orderly manner. with index = 0 the drawing of the first
    bar starts at the value for chartPositionX, with index = 1 shifted by the bar
    width to the right and so on. The best way to draw the bars side by side is to
    multiply the index by the bar width. the x parameter can be calculated according
    to the following formula:


    ```

    x = chartPositionX + barWidth * index

    ```


