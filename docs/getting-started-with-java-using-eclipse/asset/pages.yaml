    Arrays


    # 11.1 Introduction


    Arrays are simple data containers. They hold a number of variables of the same
    type. Arrays are needed, for example, to store and output simple tables.


    > Arrays are important deata containers. They can be compared to a one- or multi-dimensional
    matrix. In Java, unlike many other programming languages, arrays are objects.
    Therefore, they must be declared and created accordingly.


