    # 22.3.13 Remote Method Invocation


    Remote Method Invocation (RMI) is an architecture for accessing methods of remote
    objects (remote methods). It can be used to write distributed Java applications
    easily. This is because, unlike competing architectures such as CORBA, no additional
    product is required.


    The RMI architecture specifies four access layers:


    +   * Application layer: This layer represents client as well as server applications
    and contains the code to be executed.

    * Remote layer: The remote layer could also be called the intermediary layer between
    the proxy layer and the underlying transport layer.'
