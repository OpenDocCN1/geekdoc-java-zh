  md: '+   * Entity Beans

    * Session Beans

    * Message Driven Beans


    The entity beans are primarily data carriers and encapsulate the business data,
    again distinguishing between two types:


    +   * Entity Beans with Container-managed Persistence (CMP)

    * Entity Beans with Bean-managed Persistence (BMP)


    # ## 22.4.1 Entity Beans


    An example of entity beans could be a person from a human resources database.
    However, entity beans can also be stored in simple files or relational databases.
    The location is not relevant to the Java programmer.


    # ## 22.4.2 Session Beans


    Session beans are the representatives of business logic. They provide a service
    and cannot be stored. There are two types:


    +   * Stateless Session Beans

    * Stateful Session Beans


    Stateless session beans are very short-lived, stateless services do not store
    any data from one method call to the next. They all have the same identity, and
    there is no way to distinguish them.


    Stateful session beans, on the other hand, have state and store their data between
    multiple method calls. However, they are not persistent. After the server is shut
    down, their state is lost unless it is explicitly made persistent.


    # ## 22.4.3 Message Driven Beans


    Message Driven Beans are intended to support asynchronous communication, for example
    with message brokers. If one does not want to couple its application too strongly
    with another system, this kind of kind of EJB is suitable.


    # ## 22.4.4 Interfaces


    Enterprise JavaBeans have two interfaces through which they can be accessed:


    +   * Remote Interface

    * Home Interface


    The Remote Interface is used to access the actual component interface, for example
    to get the name of a person, while the Home Interface is used to affect the lifecycle
    of a bean. The Enterprise JavaBean architecture is a book-filling topic that I
    won''t go into.'
