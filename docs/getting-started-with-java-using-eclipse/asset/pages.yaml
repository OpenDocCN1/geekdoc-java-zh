  md: '# 22.6 External Class Libraries


    Outside of the Java editions, there is an unmanageable amount of other class libraries.
    The three most important sources are the Apache Software Foundation, Eclipse Community
    and SourceForge.


    # 22.6.1 Apache Software Foundation


    The Apache Software Foundation (ASF) contains the largest collection of freely
    available libraries for Java programming. Freely available means that not only
    is the open source, but you may also use the software without paying a fee. The
    Apache license is designed so that this also applies to commercial software. You
    will find in the ASF mainly solutions for professional Java programs. The Apache
    libraries are therefore used by many companies that develop Java software. You
    can find more details on the ASF homepage (https://www.apache.org).


    # 22.6.2 Eclipse Community


    The Eclipse Community is a creation of IBM. It all started with the development
    of the open source Eclipse development environment (Eclipse IDE). From this, IBM
    developed the open-source Eclipse Rich Client Platform (Eclipse RCP). The Eclipse
    Community was founded in 2004 to further develop this open-source platform. The
    Community, but also many other open source and free Java class libraries. As with
    ASF, the software of the Eclipse Community can be used free of charge, for commercial
    applications. For more information, please visit the Eclipse Community homepage
    (https://www.eclipse.org).


    # 22.6.3 SourceForge


    SourceForge is a non-profit organization like ASF or the Eclipse Community, but
    privately owned. The web portal is used by many free developers to distribute
    their open-source products. You can find Java class libraries, which are not tailored
    to professional programs. For more information, please visit the SourceForge homepage
    (https://www.sourceforge.net).


    # 22.6.4 Other Open-Source Software


    The Java-Source website provides a good overview of many open-source Java class
    libraries. For more details, see the Java Source homepage (https://java-source.net).'
  merge: -1
