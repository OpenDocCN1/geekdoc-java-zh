  md: '# 23.4 Access Protection


    # 23.4.1 Four Levels of Access Protection


    Java allows objects, methods and attributes to be protected. This is done either
    via access levels or via rules for the scope of identifiers. You may define two
    different access levels for classes: public and default. It is important with
    class definitions that only one of the classes in a class file may be public and
    thus publicly accessible. For methods and attributes, the Java programmer has
    four access levels available (Table 23.3).


    Table 23.3: Java has four access levels.


    | Keyword | Access level | Impact |

    | --- | --- | --- |

    | private | Class | Only visible within the current class. |

    | default | | Only visible within the package. |

    | protected | Inheritance & Package | Only visible to child classes and within
    the package. |

    | public | Public | Visible in the whole program. |


    The access levels private, protected and public are defined by the keyword of
    the same name. If you want to restrict the access area, simply omit the default
    keyword for the access area. The second highest level of protection then comes
    into effect. Figure 23.2 shows the effects of the access scopes using a class
    diagram.


    ![](img/292946f2e46e87f1c5153615a652bd5b_427_0.png)


    Figure 23.2: Access levels of Java classes.


    The diagram shows five classes in three packages. Two classes named ChildClass
    are derived from a SuperClass. Superclass is another name for a base class. One
    of the two child'
  merge: -1
  pgno: 427
- img_proc: true
  md: '# 23.4 Access Protection


    classes is inside the package containing the SuperClass. The other ChildClass
    is outside. Inside the package there is also a class named PackageClass for this
    reason. Outside the package is a class called ForeignClass.


    # 23.4.2 Access Level »private»


    Using the private keyword guarantees the strongest protection against other objects.
    Objects of the same class may access private methods and variables. Classes, of
    course, cannot be protected with this keyword for obvious reasons, otherwise the
    class would be untraceable.


    # 23.4.3 Access Level »default»


    The second encapsulation strength is the default section. Only classes that are
    in the same package have access to identifiers in the default section. In Figure
    23.2 you can see that classes ChildClass and the PackageClass get access to the
    methods of the base class.


    # 23.4.4 Access Level »protected»


    The next level of security is achieved by using the protected keyword. In Figure
    23.2 you see that confidential area can only be accessed by objects of a class
    that is either derived or in the same package. Elements of this class can only
    be accessed by objects that are within the same package or are derived.


    # 23.4.5 Access Level »public»


    The public keyword provides the weakest form of access protection. All information
    is public. You can see from Figure 23.2 that all classes in the diagram can access
    method A of the base class defined as public.

    A declared as public is accessible to all other classes, outside the package.
    The protected method B, on the other, can only be used by the two child classes
    and the foreign class. The method C (default) is even visible only to the child
    class inside the package and the foreign class, while the private method belongs
    to itself. So so much for the general rules.


