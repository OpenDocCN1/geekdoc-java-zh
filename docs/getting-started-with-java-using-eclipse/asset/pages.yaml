  md: '# Declaration of a Multidimensional Array


    Multidimensional arrays are declared in the same way as one-dimensional arrays.
    For each dimension, another pair of brackets is needed. For a two-dimensional
    array, this looks like in Figure 11.6.


    ![](img/292946f2e46e87f1c5153615a652bd5b_209_0.png)


    Figure 11.6: A multidimensional array has a pair of brackets for each dimension.


    # Creation of an Array With the New Operator


    There are two methods available for creating an array. One creates an array classically
    like any other object with the new operator. This then looks like Figure 11.7.
    Again, notice the pairs of brackets in the name of the variable need to be named
    if you have chosen the second type in declaration, where the pair of brackets
    is part of the name (Figure 11.5).


    ![](img/292946f2e46e87f1c5153615a652bd5b_209_1.png)


    Figure 11.7: Creation of an array with the new operator.


    The second pair of brackets specifies the number of elements of the array and
    thus the size of the array. This must be an integer value int (chapter 8, »Primitive
    Data Types»). You can find the number of elements using the variable length, which
    each object of an array type has. To show how this type of array is used in a
    java program, take a look at Listing 11.1.'
