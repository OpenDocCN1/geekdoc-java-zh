    # Determine System Type Under Linux And MacOS


    Under a Unix operating system such as Linux or MacOS, the quickest way to determine
    which system type you are working with is to use a Unix command. To do this, start
    a terminal via the graphical interface and then enter the following command:


    ```

    uname -m

