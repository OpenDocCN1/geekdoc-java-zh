  md: '# 22.6.5 Commercial Software


    Besides the well-known providers of open source Java class libraries, there are
    many commercial industry solutions. Almost all major software houses like SAP,
    Software AG, RedHat, Amazon or Tibco have developed commercial Java class libraries
    which they distribute with their products.


    # 22.7 Summary


    Java has a small language core that is extended by so-called class libraries.
    Java class libraries are nothing more than collections of related Java classes.
    Java class libraries can be divided into the official Java class libraries, open
    source class libraries of developer communities and private providers as well
    as commercial class libraries. The official Java class libraries are part of Java
    and are organized into three editions: Java Standard (JSE), Java Enterprise (JEE)
    and Java Micro (IME).


    The most important of the three editions is the Java Standard. It corresponds
    approximately to the Java Development Kit (JDK). In this edition, not only the
    JDK tools and the Java Runtime Environment (JRE) are contained, but several thousand
    classes for graphic surfaces, file input and output, strings, event and error
    handling as components.


