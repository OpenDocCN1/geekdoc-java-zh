  md: '# 13.4 Relational Operators 229


    The program outputs the following:


    +   - Anna is a being

    - Anna is a person

    - Robert is a being

    - Robert is a robot


    The use of the operator shows that the objects from type Person and Robot have
    only one in common: the base class Being. Both objects person and robot are instances
    of this base class. Hence the name of the operator instanceof, which you can use
    to analyze such inheritance relationships.


    However, things are different for the derived classes. If you would try to compare
    a robot with the class Person, the compiler would already report an error. It
    would signal with the help of the operator that the type of the object does not
    match the class. This means you can use the operator instanceof to find out while
    you are still developing a program that types of objects may not match.


