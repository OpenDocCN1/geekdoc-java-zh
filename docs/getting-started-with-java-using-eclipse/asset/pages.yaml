    # 4.4 Summary


    Eclipse is a development environment tailored to professional software development.
    The Eclipse IDE differs from other development environments by a number of special
    concepts. These include the modular structure with plug-ins and the layout of
    the interface with various perspectives, views and other editors. Special features
    of Eclipse are the build system and the concept of the workspace.


