    # 19.3.3 Annotation «Override»


    The last of the predefined standard annotations I want to introduce to you in
    this chapter is called the override annotation. You simply place it in front of
    the method that is overriding a method of the base class (Figure 19.16). It is
    used to avoid errors when overriding methods. With the previous example, it is
    important to understand the safety aspect as reason for using the annotation.


    If you override, you change the behavior of the base class. It should be self-evident
    that the underlying method exists at all. But the compiler cannot detect this
    without annotation. If you want the compiler to check whether an override works,
    you have to use the override annotation. It is a compiler statement: check if
    a base method of the same name exists and print an error message if not.


