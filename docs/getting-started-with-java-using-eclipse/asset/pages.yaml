  md: '# Preface


    Java is currently undisputedly the most important programming language. Therefore,
    many would like to learn Java. Unfortunately, getting started is not easy, because
    programming with Java requires at least two things: mastering the programming
    language and mastering a development environment. This is the reason why this
    book was written. With the help of many examples, it shows how the language is
    structured. In addition, the book uses the example of Eclipse development environment
    to teach you how to develop Java programs with this tool.


    ![](img/292946f2e46e87f1c5153615a652bd5b_22_0.png)


    Robert from the machine world accompanies you through the book.


    The first part »Basics gives you the Java and Eclipse basic knowledge. This part
    lays the programming foundations, gives you an overview of Java technology, and
    shows you what is special about object-oriented programming. A chapter about the
    Eclipse development environment completes this part.


    In the second part Java Language everything revolves around the subtleties of
    the Java language. This is where the first small Java applications are created.
    This part offers a mixture of knowledge part and practical exercises. At the end
    of each chapter, you will find tasks that you can do on your own. With the solutions
    to the tasks at the end of this book you check the learning success.'
  merge: -1
  pgno: 22
- img_proc: true
  md: '# XXII Preface


    Java technology is the focus of the third part «Java Technology». Additionally,
    this part- introduces to the rules you must observe when programming, what class
    libraries are and what advantages they have. In addition, you will learn how to
    test programs, what algorithms are and how to program them.


    A larger Java project is the focus of the fourth part. Here you will apply all
    the elements from the previous parts on an application with a graphical user interface.
    The project shows how to develop a larger application piece by piece with the
    Eclipse development environment.


    The fifth part, »Appendix», concludes this book with solutions to the tasks, with
    basics of information processing and a chapter on the most common mistakes that
    can occur when working with Eclipse.


    # The Plot


    As a plot, I based the book on the (fictional) programming course »Java with Eclipse«
    taught by Professor Roth to four students. The programming course is accompanied
    by the robot named »Robert« and among many others – namely by these five characters
    throughout the book:


    ![](img/292946f2e46e87f1c5153615a652bd5b_23_0.png)


    The programming course with Lukas, Anna, Professor Roth, Julia and Florian'
  merge: -1
  pgno: 23
- img_proc: true
  md: '# Who is the book for?


    This book is aimed at active readers. You don''t want ready-made solutions, you
    want to program yourself. Without actively programming yourself and staying on
    the ball until your self-written program runs, you will not learn Java. The book
    contains a tempting number of ready programmed examples that you can run at the
    click of a button. Only reach for the sample solutions if you get stuck. First,
    try to enter the programs yourself and learn from the mistakes. By actively programming
    you will master Java and the Eclipse development environment.


    # Bonus Material


    The book contains plenty of examples that can be easily imported into the Eclipse
    environment. You can easily download them from the Elektor publishing company
    www.elektor.com/books/programming. Among these downloads, you will also find a
    bonus chapter, which is not printed due to space limitations. It explains the
    programming of so-called terminal programs.


    # Font Conventions


    Various parts of the text are highlighted as follows for better readability:


    | Text Part | Meaning |

    | Data types in body text | Person |

    | Data types in headlines | »Person« |

    | Keywords in body text | implements |

    | Keywords in headlines | »implements« |

    | Variables in body text | roland |

    | Variables in headlines | »roland- |

    | Window (user interface) | ECLIPSE IDE LAUNCHER |

    | GUI element (user interface) | FINISH |

    | Menu (user interface) | FILE |

    | Menu command (user interface) | MENU → FILE → MENU → JAVA PROJECT |

    | Files | Samples.zip |

    | Directory paths | C:/Programs/Eclipse |

    | Listing (source code from sample programs) | 1 package programmingcourse; 2
    public class Robot { 3 (...) 4 } |

    | Program output | Result = true |

    | URL | http://eclipse.org |

    | (...) | Due to space limitations part of the source code is missing |'
