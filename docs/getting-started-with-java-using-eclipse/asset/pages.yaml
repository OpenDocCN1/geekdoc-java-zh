  md: '# # Getting Started With Java Using Eclipse


    # ##Mastering the Language and the Development Platform


    nMany people would like to learn Java but getting started is not easy since programming
    requires at least two things: mastering the programming language and the development
    environment. With the help of many examples, this book shows how the language
    is structured. In addition, it employs the Eclipse environment as an example of
    a powerful tool to develop Java programs.


    In Basics, the first part of the book, you acquire your Java and Eclipse basic
    knowledge. This part lays the programming foundations, gives you an overview of
    Java technology, and shows what you is special about object-oriented programming.


    In the second part called Java Language, everything revolves around the subtleties
    of the Java language and is where the first Java applications are created, aided
    by a fine blend of the knowledge part and practical exercises.


    Java Technology is both the name and the focus of the third part which also introduces
    you to the rules to use when programming, what class libraries are and what advantages
    they have. In addition, you will learn how to test programs, what algorithms are,
    and how to program them.


    The fourth part, Java Projects, enables you to apply all the previous elements
    in an application with a graphical user interface. The project shows how to develop
    a larger application piece by piece with the Eclipse development environment.
    The Appendix concludes with a section on frequent errors that can occur when working
    with Eclipse, and a Glossary.


    ![](img/292946f2e46e87f1c5153615a652bd5b_521_0.png)


    Bernhard Steppan is a Java developer from the very beginning. He has written several
    C++ and Java books as well as numerous articles on programming languages, architecture,
    development tools, and other topics. Bernhard Steppan lives in Wiesbaden (Germany)
    and works as Chief Architect at DB Systel, the systems house of Deutsche Bahn.


    All samples discussed in the book, and bonus material, are contained in an archive
    file which is available free charge from the Publishers'' website www.elektor.com/books.
    On this site, search for Java Eclipse. The tasks and solutions mentioned in the
    book are: www.programmingcourse.net/courses/java_with_eclipse/.


