    ![](img/292946f2e46e87f1c5153615a652bd5b_296_0.png)


    **Figure 17.3:** Principle flow of error handling.


    However, this action fails, the method sends an object. This object belongs to
    the class Exception or a derived class. The program «catches» this object in a
    catch block with error handling (point 2). Since the error is an «exception»,
    it is called «exception-handling». All classes in this are called «exceptions».


    A Try block can surround several statements, and there can also be several Catch
    blocks in a row. There is also a Finally statement. It is used to include statements
    that must be processed in any case. Important cleanup tasks can be placed here
    to avoid damage.


    ![](img/292946f2e46e87f1c5153615a652bd5b_296_1.png)


    **Figure 17.4:** The extended error handling with a finally block.


    If there are multiple exception states in the try block, you must also catch multiple
    exception objects. The correct order of catch blocks is important. Catch the special
    exceptions first, and put the general exception (if needed) at the end (Figure
    17.4). The following example shows why the order of processing is important.


    **Listing 17.1:** The order of catch blocks is very important.'
