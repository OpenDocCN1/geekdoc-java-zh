  md: '# 3.2 Overview


    How did it come about? It started in the mid-60s of the 20th century. At that
    time, there was a software crisis. It was triggered by the increased demands on
    computer programs. As a result, the software became more complex and buggy. At
    congresses, experts discussed the causes of the crisis and the reasons for the
    increased error rate.


    A part of the software experts came to the conclusion that the software crisis
    could not be mastered with the conventional programming languages. They criticized
    the conventional programming languages above all that the natural world could
    be represented so far inadequately. They therefore began to develop a generation
    of new programming languages.


    > Alan Kay, the inventor of the programming language -Smalltalk-, has set these
    six basic features for object-oriented languages.


    ```

    Object-Oriented Programming {

    1. Everything is an object

    2. Objects communicate by sending and receiving messages

    3. Objects have their own memory

    4. Every object is an instance of a class

    5. The class holds the shared behavior for its instances

    6. To eval a program list, control is passed to the first object and the remainder
    is treated as its message

    }

    ```


    ![](img/292946f2e46e87f1c5153615a652bd5b_49_0.png)


    Figure 3.2: Features of object-oriented languages.


    The experts began to use natural terms from the form theory for the new programming
    languages. They transformed these terms for programming (Figure 3.2). Since everything
    revolved around the notion of object, they called the generation of languages
    «object-oriented".'
