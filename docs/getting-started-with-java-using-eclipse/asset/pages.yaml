  md: 'The truth is: Java programs are comparatively easy to transfer (port) from
    one operating system to another. This is because Java programs can rely on finding
    almost the same conditions on other operating systems as the operating system
    on which they were developed.


    # Table 2.1: Operating systems currently supported by Java (64 bit).


    | Java version | Operating system |

    |---|-|

    | Java 13 | Linux x64, MacOS x64, Windows x64 |

    | Java 14 | Linux x64, MacOS x64, Windows x64 |

    | Java 15 | Linux AArch64, Linux x64, MacOS x64, Windows x64 |

    | Java 16 | Linux AArch64, Linux x64, MacOS x64, Windows x64 |

    | Java 17 | Linux x64, Linux x64, AArch64, MacOS x64, Windows x64 |

    | Java 19 | Linux AArch64, Linux x64, AArch64, MacOS x64, Windows x64 |


    Java programs are extremely easy to port under two conditions: the first prerequisite
    is that the developers of a Java program have not used any specialties of an operating
    system that are not covered by Java. The second prerequisite is that a Java version
    suitable for the program exists for the target operating system. The first requirement
    is easy to fulfill. The second prerequisite is usually given by the fact that
    Java is open source.


    # 2.3.9 Easily Expandable


    The term Java class library has come up several times before, without explaining
    it in detail: Java class libraries are pre-built program parts that your program
    can easily use. If you research on the Internet whether a certain problem is solved
    by a Java class library, you will be amazed how large the offer is.


    One of the reasons why Java is so successful is because of the variety of Java
    class libraries. You do not have to develop all program parts yourself. Instead,
    you can draw from the pool of prefabricated and proven solutions. And the best
    thing is: like Java, many of these class libraries are open source and free of
    charge.


    # 2.3.10 Easy to Develop And Test


    In the early years of Java, developing Java programs was painstaking. There were
    simply no professional development and testing tools. That has changed dramatically.
    Part of Java''s success is certainly due to the fact that there are hardly any
    other programming languages with as professional development environments as Eclipse
    IDE or IntelliJ IDEA. The fact that many professional tools are also free of charge
    was another point for many companies.'
