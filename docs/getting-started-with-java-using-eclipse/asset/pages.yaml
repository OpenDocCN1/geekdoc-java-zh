  md: '# 9.2.2 Types of Classes


    In Chapter 3, Object-Oriented Programming, there was only ever talk of one type
    of class. Over time, the developers of Java have tried to meet all the design
    requirements of Java programs. Thus today is not only one kind of class, but a
    whole for the most different purposes: concrete and abstract classes, interfaces
    and generic classes (Generics). Of the concrete classes, there are also three
    varieties: local, inner and anonymous classes (Table 9.1).


    Table 9.1: Java has four types of classes and three subtypes.


    | Class type | Expression | Usage |

    | --- | --- | --- |

    | »Concrete» class | »Natural» class | General purpose class |

    | | Local class | Auxiliary class |

    | | Inner class | Auxiliary class with interface |

    | | Anonymous class | Auxiliary class without name |

    | Abstract class | - | Base class |

    | Interface | - | Class without implementation |

    | Generics (Generic) | - | Type safe container |


    Concrete classes are the natural form of a class, so as, introduced in the chapter
    Object-Oriented Programming. Local classes are defined within a class when it
    is not worthwhile to outsource them to a separate file. Similarly it behaves with
    internal classes, only that for this an interface is needed. Anonymous classes
    likewise in a concrete class, but it carries no name.


    Abstract classes and interfaces are intended for special design tasks in connection
    with concrete classes. Generic classes were introduced with Java 5 to avoid programming
    errors. As a beginner, this must seem quite confusing to you. The different classes
    have their purpose, as the next pages will show.


    You will use classes in java programming that come from other programmers, but
    also classes that you have to define yourself. In both cases there is so-called
    class definition. If you use a class String, for example, this definition is included
    in the source code of the Java libraries. So you do not have to care about it.
    The situation is different for classes that you develop yourself. The first step
    is to define the class. Defining classes means that you specify the name of the
    class, its attributes, its methods and encapsulation.


    # 9.2.3 Definition of Classes


    Classes are the freely definable data types. That means the programmer of a class
    is free to define how his class should look like. For example, he can define the
    name of the class and determine which attributes and methods the class has. This
    is one of the large points of object-oriented programming. This allows classes
    to be built like real-world models, making the program much easier to understand.
    Figure 9.4 shows what a class definition looks like. The programmer of the class
    freely specifies which components make up the class. This is done in a file corresponding
    to the name of'
