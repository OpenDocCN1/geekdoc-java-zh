    # # 22.4 Java Enterprise Edition


    Unlike SE, Java Enterprise Edition (J2EE or JEE) is a collection of specifications.
    For these specifications, there are vendors such as the Apache Software Foundation
    (ASF) or the Eclipse community that provide classes based on the JEE specifications.
    The JEE addresses itself to larger enterprises, which would like to develop distributed
    applications. Distributed applications are programs that run not on one computer,
    but over several. So that the objects of different computers can communicate with
    each other, through different techniques. One technique is on servlets and JavaServer
    Pages, another on the Enterprise JavaBeans component architecture. The Common
    Object Request Broker Architecture (CORBA) is another way to develop distributed
    applications.


    | Enterprise Java Beans (EJB) | Java Servlet | Java Server Pages (JSF) |

    | Web Services (WB) | Java Naming and Directory Interface (JNDI) | Java Message
    Service (JMS) |

    | Java Transaction API (JTA) | Java Authentication and Authorization Service (JAAS)
    | Java Mail |

    | Java Architecture for XML Binding (JAXB) | Java API for RESTful Web Services
    (JAX-RS) | Java API for XML Web Services (JAX-WS) |


    **Figure 22.19**: The main specifications of Java Enterprise Edition.


