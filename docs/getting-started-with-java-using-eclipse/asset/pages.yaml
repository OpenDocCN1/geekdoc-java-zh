  md: '# Statements


    # 7.1 Introduction


    This chapter discusses statements before the remainder of the book presents Java
    programming from the perspective of classes and objects. Statements are elementary
    components of every Java program. You can compare them very well with sentences
    or commands of a natural language. From a somewhat technical point of view, a
    statement in the sense of programming is a «complete execution unit». The following
    examples show you what this means.


    > Statements are elementary building blocks of a Java program. Compare a Java
    statement with a command from natural life: »Add 1 + 1 and store the result in
    the variable x=. This instructs the Java program to execute this chain of commands.


    ![](img/292946f2e46e87f1c5153615a652bd5b_134_0.png)


    Figure 7.1: Florian hates statements. But they have to be in Java programs.'
  merge: -1
