    #  22.3.5 Properties


    Sometimes basic settings of a program need to be read and stored permanently on
    disk. In

    Windows, programs use ini files or store their information in the registry. To
    be independen-

    ent a particular operating system, the java inventors came up with a different
    concept:

    the concept of properties files.


    These properties have a trivial structure and consist of a key and one or more
    matching

    values (Figure 22.8). You can separate key and value(s) either by a space, by
    a colon, or by

    an equal sign. You read the values by calling a method of the Properties class
    and getting a

    string containing the value or list of values as return.'
