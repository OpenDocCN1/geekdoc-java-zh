  md: "# Getting Started With Java Using Eclipse\n\nMastering the Language and the\
    \ Development Platform\n\n```\ncopy function\nsource Source\ndestination Destination\n\
    Exception arises if something went wrong\n\nstatic void rcopy(File source, File\
    \ destination) throws IOException {\n    System.out.println(\"Copy from\\n\\n\"\
    \ + source + \"\\n\\nto:\\n\\n\" + destination);\n    if (source.isDirectory())\
    \ { // Is the source a directory?\n        destination.mkdir(); // Create directory\
    \ in the destination\n        File[] directoryEntry = source.list(); // List of\
    \ directory\n        for (int i = 0; i < directoryEntry.length; i++) {\n     \
    \       File entry = directoryEntry[i];\n            System.out.println(\"\\nCopy\
    \ \" .concat(String.valueOf(entry)) +)); // Debug info\n            rcopy(entry,\
    \ destination); // Recursively copy all source files\n        }\n    } else {\n\
    \        int numberOfBytes = 0;\n        byte[] buffer = new byte[3268];\n   \
    \     InputStream in = new FileInputStream(source);\n        OutputStream out\
    \ = new FileOutputStream(destination);\n        while ((numberOfBytes = in.read(buffer))\
    \ > 0) {\n            out.write(buffer, 0, numberOfBytes);\n        }\n    }\n\
    }\n```\n\nNo? Then the source is a file!\n\nBernhard Steemann\n\n![](img/292946f2e46e87f1c5153615a652bd5b_0_0.png)"
