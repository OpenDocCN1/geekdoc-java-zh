  md: '# Precision and Value Range


    Primitive data types differ in the amount of memory they require. For example,
    a memory area of 4 bytes (= 32 bits) is reserved for the data type int. The reserved
    memory area is identical on all computer systems running a Java program. This
    is one of the great advantages of Java and one of the reasons why Java programs
    can be transferred easily from one computer system to another.


    The reserved memory area is not identical to the value area for numerical data
    types. This is because all Java numeric data types have a sign that requires one
    bit of memory. This means that, for example, the int data type has <only 31 bits
    available (Figure 8.5).


    ![](img/292946f2e46e87f1c5153615a652bd5b_151_0.png)


    **Figure 8.5:** Value range and occupied memory using the data type «int» as an
    example.


    The situation is for the data type byte. The negative value range results from
    -2'' - 1, the positive value range from 2''. The fact that numerical data types
    have a sign is unfortunately not practical. For many cases, only «natural» numbers
    have a value range from 0 to 255 would be necessary; the data type byte does not
    provide.


    The value range of numeric data types is based on the maximum value that different
    computer systems can represent. Java allows to write portable programs (chapter
    2, «Technology Overviews»). To achieve the portability of programs, the inventors
    of the language had to take into account different computer systems.


    The highest amount of inaccuracy is called «computer infinity» by experts. The
    computer infinity for many computer systems is 64 bits, which is also why the
    limit of Java number data types. The computer infinity in PC systems (with mathematical
    coprocessor), is 80 bits and is usually closed to Java programs, unavoidable.


    By the maximum value range also comes a certain inaccuracy with mathematical calculations
    since no computer system is able to process all numbers arbitrarily. With integer
    data types, the accuracy within the secured limits is always optimal. They are
    always stored completely as they are in the value range.


    Floating point numbers, in contrast to integers, have in principle only a limited
    inaccuracy, even if they are in the value range of data type. This is because
    the computer can store such numbers only if they have a limited number of decimal
    places.


    When storing a floating point number, the computer breaks it into two parts. The
    first part is the exponent, and the second part is the mantissa; both are stored
    in binary. The decimal representation (Figure 8.6) shows that such a number is
    exact only to a certain decimal place, everything else falls under the tail. In
    this case, one of speaks-so rounding errors.'
