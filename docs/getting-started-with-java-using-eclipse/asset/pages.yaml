  md: '# 6.2 Overview


    # 6.2.1 Variable Purpose


    A Java program consists of objects. Objects are composed of methods, attributes
    and other objects. Java programs use variables to store attributes and objects.
    Variables are, so to speak, the memory of the objects of a program. To protect
    attributes from unauthorized access, an object surrounds them with a shell of
    methods (Figure 6.2).


    ![](img/292946f2e46e87f1c5153615a652bd5b_119_0.png)


    Figure 6.2 An object is similar to a cell with a protective capsule.


    # 6.2.2 Variable Types


    The first part of this book has called variables attributes of objects. Here were
    properties like the height of a person and its name or states like the attribute
    student. Java maps the various attributes of the object-oriented world to five
    different types of variables (table 6.1).


    Table 6.1 Overview of the types of variables.


    | Description | Type |

    | --- | --- |

    | Variable | Local variable |

    | | Parameter |

    | | Instance variable |

    | | Class variable |

    | Constant | Static variable ("variable» with unchangeable)|'
