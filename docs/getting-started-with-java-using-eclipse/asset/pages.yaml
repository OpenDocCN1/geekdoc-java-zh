  md: '# # 25.2 Requirements


    The program CourseStatisticsApp should tabulated a list of students in a semester.
    The program should have only one menu named FILE with the commands OPEN and EXIT.
    Below the menu, there shall be an input field to filter the list. The field should
    allow to reduce the list by a search term. Below the field there shall be a table
    with five columns (Figure 25.2).


    | Menu Bar | Label | Text Field |

    |---|---|---|

    | Menu | File | |

    | Filter Bar | | Filter: |

    | Student Number | First Name | Last Name | Mandatory Subjects | Elective subject
    |

    | 100010 | Anna | Seitz | Mathematics I ... | English |

    | 100011 | Julia | Lippert | Mathematics I ... | Biology |

    | 100012 | Lukas | Wittek | Mathematics I ... | History |

    | 100013 | Florian | Krause | Mathematics I ... | Geography |


    **Figure 25.2** The requirements for the user interface and presentation of the
    CSV file


    The first column contains the student''s matriculation number, the second first
    name, the third last name, the fourth the majors, and the last column. The list
    is stored in the form of a CSV file on a hard disk. the values are separated from
    each other with a separator. In the German language area one uses the semicolon
    for this. The program should be able to read the file and display the values in
    tabular form in the way mentioned before.


    # # 25.3 Analysis and Design


    The program breaks down into two technically distinct sections: the graphical
    user interface and the program logic such as reading a CSV file and the filter
    function. Let''s start with the user interface.'
