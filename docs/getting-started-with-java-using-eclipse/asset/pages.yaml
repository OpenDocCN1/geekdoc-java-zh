  md: '# 2.4 What Belongs to Java?


    On the previous pages the term "Java technology" was mentioned several times.
    I wanted to make clear that Java is far more than only a programming language
    in comparison with the predecessor languages C and C++. But what Java technology
    consist of? It provides a uniform basis for the development, execution and operation
    of programs. Java technology is based on the pillars «Java Programming Language,»
    Java Virtual Machine,


    Java Class Libraries and «Java Development Tools (Figure 2.6).


    If Java is your first programming language, you may be confused by the new terms
    and abbreviations in this section. Be patient. You don''t need to memorize everything,
    because the terms are repeated with many examples. And after the first program
    examples, the meaning of the terms will become much clearer to you.


    ![](img/292946f2e46e87f1c5153615a652bd5b_43_0.png)


    Figure 2.6: The Java technology rests on four pillars.


    # 2.4.1 Java Programming Language


    The programming language is the core of the Java technology. Like any programming
    language, Java has a special syntax to write a program. The developers of the
    Java programming language based their syntax on C++ to make the transition to
    Java easier. However, some elements, which I will discuss in more detail later,
    are greatly improved, resulting in the ease of reading and robustness of Java.


    # 2.4.2 Java Virtual Machine


    Java programs are not stored as executable files on Windows, for example. Therefore,
    you (usually) need a virtual machine to run the Java program. Behind the mysterious
    name «virtual machine» is a special program. This program executes Java programs.
    In the case of Java, the program is called »Java Virtual Machine«. Since the term
    is so long, it is usually abbreviated as Java VM or simply JVM.'
  merge: -1
