    The example seems banal. Who forgot to create such an obviously needed object?
    In larger programs, the error is here in line 9, is unwanted rarely so obvious.
    In professional programs, the creation of objects often depends on certain program
    conditions. If one has not thought through all these conditions completely, it
    happens that the program encounters a variable to which no object has been assigned.
    This variable throws a NullPointerException as soon as the program accesses it.
    As, by the way, the detection of such errors is made much easier because of Java
    14, this Java version explicitly outputs the variable that is the cause of the
    NullPointerException.'
