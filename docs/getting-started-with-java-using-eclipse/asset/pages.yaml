  md: "# 13.4.7 Type Comparison Operator\n\nThe type comparison operator instanceof\
    \ has a special role in the relational Java operators. It compares an object with\
    \ a certain type. You can use it to check an object is an instance of a class,\
    \ an instance of a subclass, or an instance of a class that implements a particular\
    \ interface. I will give here an example of four classes. The first class is the\
    \ base class Being. The class Being (Listing 13.18) is the base class for the\
    \ class Person as well as for the class Robot. This means that both person and\
    \ robot are instances of the class according to this definition.\n\n+   Listing\
    \ 13.18: The class =Being= is the base class for the classes =Person= and =Robot.\n\
    \n```\n//Examples/Operators\npackage programmingcourse;\npublic class Being {\n\
    \    private String name;\n    // Constructor with the parameter \"name\"\n  \
    \  public Being(String name) {\n        this.name = name;\n    }\n    /**\n  \
    \   * Returns the name of the object\n     * @return name\n     */\n    public\
    \ String getName() {\n        return name;\n    }\n}\n```\n\nThe derived class\
    \ Person (Listing 13.19) inherits all properties from the class Being. Each object\
    \ of this class is both a being and a person. An instance of the class Person\
    \ is the object anna.\n\n+   Listing 13.19: The =Person= class is derived from\
    \ the =Being= class.\n\n```\n//Examples/Operators\npackage programmingcourse;\n\
    class Person extends Being {\n    // Constructor with the parameter \"name\"\n\
    \    public Person(String name) {\n        super(name);\n    }\n}\n```"
