  md: '# 2.4 What Belongs to Java?


    This Java VM must be specially adapted for operating systems such as Windows,
    Linux or MacOS. In other words, there is a special Java VM for Windows, one for
    Linux and one for MacOS. This special Java VM is one of the prerequisites for
    easily transferring Java programs from one operating system such as Windows to
    another such as Linux (Figure 2.7).


    If you take it strictly, Java programs are not platform-independent at all, as
    often claimed. On the contrary: they are platform-dependent. To be more precise:
    they depend on the Java platform together with the Java VM contained therein.
    So that Java programs can be transferred easily from one operating system to another,
    the Java inventor Sun Microsystems resorted to a trick. He simply developed a
    platform for each desired operating system.


    ![](img/292946f2e46e87f1c5153615a652bd5b_44_0.png)


    **Figure 2.7:** Java programs run on various operating systems using the Java
    VM.


    This Java platform protects each Java program from the special peculiarities of
    each operating system. Now you may ask: Who develops this Java platform? In the
    early days of Java, the Java inventor Sun Microsystems did it themselves. Since
    Sun Microsystems was bought by Oracle, Oracle takes care of these different Java
    programs. Since Java is open source, the further development of Java is increasingly
    taken care of the open source community of programmers in addition to Oracle.


    If only a Java platform exists for a certain operating system environment, Java
    programs can be executed on this environment. This is also the reason why you
    have to install Java (and therefore a Java VM) on your computer operating system.
    Chapter 4, section 4.2.2, «Install Java», shows you exactly how to do this.'
