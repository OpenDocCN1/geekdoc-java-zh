    # 22.3.8 Swing


    Since Java 2, another GUI library called Swing exists within Java SE in addition
    to the AWT. You can find out the classes of this library in the package javax.swing.
    For all GUI components there are Swing classes that do adequately replace the
    AWT classes (Figure 22.15).


    Swing draws all interface elements and therefore does not provide a native look-and-feel
    on all platforms, but tries to recreate it using the UIManager class in the package
    javax.swing. This method has the disadvantage that the interface does not always
    look like native programs – and compared to native interfaces– is drawn relatively
    slowly. It has the advantage that the usual problems with graphical user interfaces
    are almost eliminated.


    The problems arise from the different appearance and the different dimensions
    of similar surface components. This is further complicated by the fact that different
    operating systems have different fonts and font systems. For example, a labeled
    button has a different dimension under Windows than MacOS.'
