    Thus, human legs are not viable without a suitable object of the class *Human*.
    When a human object dies, so does its legs.


    # 3.8.2 Inheritance Relationships


    Inheritance relations are also called generalization or specialization. These
    are not sub-types of inheritance, but alternative terms for inheritance relations.
    Which of the two alternative terms you want to use depends on the point of view
    from which you look at the inheritance relation.


    # 3.8.2.1 Generalization


    If you want to look at the base class from the point of view of the derived class,
    generalization is the appropriate term for it. For example, the class being *Human*
    and *Robot*. In other words, class *Creature* is the general term (= generalization)
    for classes *Human* and *Robot*.


    # 3.8.2.2 Specialization


    If you want to look at the derived class from the point of view of the base class,
    specialization is the appropriate term for it. For example, the classes *Human*
    and *Robot* are a specialization of the class *Creature*. In other words, the
    classes *Human* and *robot* are a refinement of the class *Creature*.'
