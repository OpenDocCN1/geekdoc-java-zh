    a better overview of the different workflows, the overall process is divided into
    related subprocess-es. Some companies divide the total of the process into three,
    others into four sections.


    In order not to go beyond the scope of this book, I would like to limit myself
    to a three-part process, which is sufficiently precise for most projects. The
    overall process then consists of the following parts (phases): Planning Phase,
    Design Phase, and Operations Phase (Figure 20.2).


    ![](img/292946f2e46e87f1c5153615a652bd5b_337_0.png)


    **Figure 20.2**: The phases of software development.


    In the planning phase, the focus is on planning what exactly is to be developed.
    In the design phase, the focus is on developing (programming) the software product.
    And in the operation phase, parts of the product or the finished product are installed
    and then operated. At first glance, the overall process appears to be completely
    straightforward. But this is a fallacy.'
