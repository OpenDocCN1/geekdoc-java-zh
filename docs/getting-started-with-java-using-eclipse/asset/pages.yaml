  md: "# 26 Frequent Errors\n\n## 26.1 Introduction\nJava beginners are often frustrated\
    \ because they fail because of errors whose cause they do not understand and which\
    \ they cannot fix as a result. I have therefore compiled the most important error\
    \ messages in this chapter and hope to provide some assistance in fixing these\
    \ errors in your programs. The chapter starts with pure Java programming errors.\
    \ This is followed by errors when using the Eclipse IDE.\n\n# ## 26.2 Java Errors\n\
    \n### 26.2.1 Cannot Make a Static Reference To The Non-Static Field\nEclipse displays\
    \ the error message Cannot make a static reference to the non-static field when\
    \ you try to access an object variable from a static method (class method). An\
