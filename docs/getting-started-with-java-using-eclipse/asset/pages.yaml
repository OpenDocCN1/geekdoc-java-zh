  md: '# 4 Programming Basics


    The students of the programming course think that there are a lot of instructions
    for such a simple program. Anna would like to know from Professor Roth whether
    it could be simpler:


    > Why do computers have to be programmed in such a complicated way? Why can''t
    you tell them what you want, like Alexa and Siri?


    ![](img/292946f2e46e87f1c5153615a652bd5b_29_0.png)


    **Figure 1.2:** Is it still appropriate today to type in programs?


    »Even Alexa, Cortana and Siri», says Professor Roth, «are just computer programs.»
    These programs were developed so that humans can control computers via speech.
    But Alexa & Co. can only do the few tasks for which they were specially programmed.
    If you want the computer to perform other tasks, such as word processing, you
    have to write a special program for it. These programs can be developed in Java,
    for example.


    # 1.2 The Language of the Machine World


    When we speak of computers, we always make digital computers. These machines understand
    only their digital language. Digital means that the computer uses binary code
    for all information. Therefore, the computer''s machine language consists only
    a sequence of zeros and ones.


    However, the computer''s machine language, with its sequences of zeros and ones,
    is extremely difficult for humans to understand. To program computers directly
    in machine code would be completely absurd. It would take a very long time and
    the prob-ility of errors would be high.


    If you want to program the computer close to the machine, use an auxiliary language.
    This auxiliary language is called assembly language or assembler for short. Professor
    Roth presents a simple example to his programming class. Like the Java program
    before, it sim-outputs the string «Hello!» on the screen (Figure 1.3).


    Professor Roth''s programming course finds the assembly language quite difficult
    to understand. How could only programmers learn such a terrible language? The
    answer is simple, because, in the early days of computers there were no high-level
    languages like


    More books: https://t.me/booksforits'
  merge: -1
  pgno: 29
- img_proc: true
  md: 'Java. Programmers had to pay close attention to the computer''s processors
    when they programmed the machine in assembly language.


    ![](img/292946f2e46e87f1c5153615a652bd5b_30_0.png)


    ```

    org 100h

    start:

    mov dx,hallo

    mov ah,09h

    int 21h

    mov al, 0

    mov ah,4Ch

    int 21h

    section .data

    hallo: db ''Hello!'', 13, 10, ''$''

    ```


    **Figure 1.3:** This assembler program also outputs «Hello!».


    Assembler programs are much longer compared to functionally equivalent Java programs.
    They consist of many small-part commands, which are taken, done alone. Therefore,
    one needs many of these commands to write a large program. This program is written
    specifically for one type of computer. It is difficult to transfer to another
    type of computer. Beyond the cost of developing such programs, a major disadvantage
    of the assembly language is that it is difficult to transfer from one type of
    computer to another. However, the small-part instructions do not have only disadvantages.
    They have the advantage that a good programmer can use them to create very lean
    and fast programs. They also often require less main memory than comparable programs
    written in a high-level language.


    # # 1.3 High-Level Programming Languages


    It seems to be somehow bewitched: Computers only understand their specific machine
    language. We, on the other hand, without special programming training, understand
    only'
  merge: -1
  pgno: 30
- img_proc: true
  md: '# 6 Programming Basics


    our native language may be one or two foreign languages. How can we bridge this
    huge gap between the machine world and the human world?


    We can either develop even more powerful programs like Alexa, Cortana and Siri,
    so that the computers execute everything we want. Or we can learn the computer''s
    language if we want to develop special programs for tasks that Alexa & Co can''t
    do – no, those aren''t the only options, because there is, fortunately, a third
    way.


    Programming a complex program in assembler is no longer up-to-date. That''s why
    people started very early to develop programming languages like Java. These languages
    form a bridge between the (for most humans) difficult to understand machine language
    and the (for most machines) difficult to understand human language. These languages
    are called high-level programming languages or high-level languages for short.


    ```

    0101001010110110

    00111101010101101011

    11110011101000011110

    001110101010101011

    ```


    > I am so glad that there are high-level programming languages ...


    ![](img/292946f2e46e87f1c5153615a652bd5b_31_0.png)


    High-level programming languages are much easier for a human to learn and understand
    than the language of the machine world. But how does it work? How do you translate
    a high-level language into the language of the machine world? For this purpose,
    a trick has been thought of. This trick is a special program that translates the
    source code of a high-level language like Java into the language of the machine
    world. This program is called a compiler and is part of a development environment.'
  merge: -1
  pgno: 31
- img_proc: true
  md: '# 1.4 Development Environment


    # 1.4.1 Compiler


    The compiler is one of the core components of a development environment like Eclipse.
    It transfers the source code of a Java program into the language of the machine
    world. The source code is the text that was seen in figures 1.1 and 1.3.


    # 1.4.2 Editor


    In the editor you enter the source code of a program as in word processor. An
    editor also provides program development support, such as advice on how to fix
    the errors that are displayed.


    ![](img/292946f2e46e87f1c5153615a652bd5b_32_0.png)


    Figure 1.5: Editor, compiler and project management of the Eclipse development
    environment.


    # 1.4.3 Project Management


    Java programs usually consist of a large number of files. So that you do not lose
    the overview, the Java development environment has a project management. It shows
    which files belong to a project.'
  merge: -1
  pgno: 32
- img_proc: true
  md: "# 1.5 Runtime Environment\n\nJava programs require a special runtime environment.\
    \ In other words: Java programs only run with an additional program on your computer.\
    \ You don't notice this at first, because the Eclipse development calls this runtime\
    \ environment in the background when you run a Java program. To understand what\
    \ this runtime environment is all about, turn to the next chapter. It shows how\
    \ Java has evolved and why a Java runtime environment is necessary at all.\n\n\
    # 1.6 Summary\n\nProgramming means writing computer programs. Computer programs\
    \ consist of one or more commands in a programming language. These are written\
    \ in the form of a text. In programming, this text is source code. Computers execute\
    \ the commands in machine language. We, on the other hand, speak in our human\
    \ language. To bridge this gap, computer scientists have developed high-level\
    \ languages. Java is one of these high-languages.\n\n![](img/292946f2e46e87f1c5153615a652bd5b_33_0.png)\n\
    \n```\nclass JavaProgram {\n    public static void main(String[] args) {\n   \
    \     System.out.print(\"My name is Robert!\");\n    }\n}\n```\n\n**Figure 1.6:**\
    \ Computer programs consist of commands of a programming language.\n\nTo translate\
    \ a high-level language program into machine language so that the computer can\
    \ execute it, you need an additional program. This translation is called a compiler.\
    \ The compiler is part of the development environment. This consists (among other\
    \ things) still of an editor and project management. With the help of the editor,\
    \ you write the source code of a program. The project administration manages the\
    \ different files, which belong to a project."
  merge: -1
