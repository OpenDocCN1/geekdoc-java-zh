    **Figure 9.4:** Classes must be defined before they can be used.


    Additionally, the visibility of the class can be specified. The third part of
    this book introduces keywords for the visibility of a class (chapter 23, *Rules*).
    At this point just this the keyword *public* means that an object of this class
    is seen by every other object within a program. This is the normal case.


    The implementation of the class contains attributes and methods. The technical
    implementation means the implementation of the program. The implementation of
    the class begins with an opening curly bracket and ends with a closing curly bracket.
    The opening brace can also be on the next line after the class name.


    # 9.2.4 Use of Classes


    Once a class is defined, it *just* needs to be used. Using the class breaks down
    into two steps: Declaration and creation of an object.


    # Declaration


    The declaration is identical to the variable declaration you already know from
    chapter 6, *Variables*. A variable type is used to access an object. When declaring
    it, the *Rules* tell the compiler which data type variable is of. In the case
    of objects, the data type is always the class from which the program creates the
    object. In the declaration, you first specify the type of the variable and then
    the name of the variable (Figure 9.5).


    The declaration is necessary because Java is type-safe. This means that at compile
    time, each variable must have a data type. To avoid programming errors caused
    by assigning an incorrect type, the java compiler takes strict care to avoid type
    violations throughout the program. Part of the stability of Java programs is based
    on the compiler''s strict checking.'
