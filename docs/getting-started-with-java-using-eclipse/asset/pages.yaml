  md: '# # 16 Packages and Modules


    # ## 16.1 Introduction


    In order to structure larger software systems, there are different concepts. In
    Java you solve the division of the programs over Packages and Modules. Packages
    bundle one or several classes, modules summarize one or several packages. While
    the package has been a component since the first version of the Java language,
    the module is very new in the Java area. It has been part of the language only
    since Java 9.


    ![](img/292946f2e46e87f1c5153615a652bd5b_284_0.png)


    **Figure 16.1:** Professor Roth will help you better understand Java packages
    and modules.'
