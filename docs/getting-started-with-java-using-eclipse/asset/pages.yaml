  md: '# 3.8.1.3 Composition


    The strongest form of relations, which are not based on inheritance, is the **composition**.
    As aggregation, there is an «consists-from» relationship, but it is again stronger
    in contrast to aggregation. The dependencies are again stronger.


    An example of a composition is the relationship between a human being and his
    two legs. Here, fortunately, there is a very close relationship, because a leg
    – in contrast to a screw – is completely meaningless as an independent object.
    When a human object is created, it automatically gets two individual legs, which
    cannot be used in connection with other objects.


    ![](img/292946f2e46e87f1c5153615a652bd5b_63_0.png)


