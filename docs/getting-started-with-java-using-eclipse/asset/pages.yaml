  md: '# 22.3.2 Class »System«


    Along with the String class and the wrapper classes, the System class is a linchpin
    of any Java program. It has a variety of tasks, including:


    +   - Character input and output to the console

    - Calling the garbage collector

    - Program termination

    - Setting basic system settings

    - Query basic system settings


    You have already seen the output of characters in many examples in the book. The
    use of the garbage collector was explained in chapter 21, Runtime Environment,
    section 21.4.5, Garbage Collector. What is new, however, is that the program is
    terminated by a method of the class System. The call System.exit(status) is sufficient
    for this.


    You pass the status via the int status null if the program terminates normally.
    You can also output a defined value to indicate that the program terminated at
    a critical state.


    Another very useful function of the System class is to read in or out system settings.
    How reading output information (system properties) works in principle is shown
    in Listing 22.7.


    Listing 22.7: Read some system properties.


    ```

    1 //Examples/Class.Libraries

    2

    3 package programmingcourse;

    4

    5 class SystemInfoDemo {

    6

    7 public static void main(String[] arguments) {

    8

    9 System.out.println(

    10 "Java version: " + System.getProperty("java.version") + " \n" +

    11 "Java home: " + System.getProperty("java.home") + " \n" +

    12 "JVM version: " + System.getProperty("java.vm.version") + " \n" +

    13 "JVM name: " + System.getProperty("java.vm.name") + " \n" +

    14 "Operating system: " + System.getProperty("os.name") + " " + +

    15 System.getProperty("os.version") + " \n" +

    16 "User name: " + System.getProperty("user.name") + " \n" +

    17 "User home: " + System.getProperty("user.home");

    18 }

    ```


    To do this use the access method getProperty(), which you pass a specific string
    as a parameter. These strings are predefined in the Java documentation. For example,
    to find out the name of the operating system your Java program is running, using
    the property os.name. The program produces different output depending on the installed
    Java and operating system version. On my development machine, the output looks
    like:'
