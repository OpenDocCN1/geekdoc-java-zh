    of a programming language. With these methods one starts for example programs,
    accomplishes computations or makes database inquiries. variables, Java distinguishes
    between instance and class methods. Instance methods require an object to be executed.
    Getter and setter methods are examples of instance methods. In contrast, no object
    is necessary to execute class methods. They are introduced by the keyword `static`.
    The best-known static method is `main(...)`, which is used to start a program.


