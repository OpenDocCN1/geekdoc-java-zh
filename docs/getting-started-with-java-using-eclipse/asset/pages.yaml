    # # Border Layout


    The Border Layout aligns the user interface components to the border of the window.
    There are five areas to which a component can be aligned:


    +   * North: upper window border

    * South: lower window border

    * West: left window border

    * East: right window border

    * Center: center of the window


    How these parameters are used within a program is demonstrated by the example
    in Listing 22.9. The program is derived from the AWT base class Frame (Frame 22.9).
    The window contains five text fields. These five text fields are objects of type
    TextField. Each window of type Frame has method add(String name, Component comp).
    The method comes from the base class Container. It expects as parameters the desired
    alignment of the component and the object to be displayed.


