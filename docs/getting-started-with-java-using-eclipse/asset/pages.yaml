    The declaration is concluded with a semicolon. This semicolon is very important.
    If it is missing, the program “runs” into the next line of source code. This continues
    until the program encounters the line for the semicolon. The end of such an instruction
    is therefore not the end of the program, but the semicolon. Here again, the parallels
    between an instruction and a sentence in a natural language become clear. In a
    sentence, too, it is necessary to mark the end of the sentence, because otherwise
    the text would be difficult to understand.


