  md: 'Silvia Lenz tries to find out what the content of the internship work should
    be (Figure 20.5).


    > We would like to get a quick overview of which elective college students have
    taken. I think this is a good internship work that can continue the next semester.


    ![](img/292946f2e46e87f1c5153615a652bd5b_341_0.png)


    If you take an agile approach, you then write down the requirements in the form
    of stories. The stories contain, if possible, all the criteria of the client for
    the deliveries and services of the students of the programming course. In the
    Stories the requirements are described from user view including all boundary conditions.
    In practice, the stories are often only a rough guideline, because many end users
    are not necessarily clear about what they really need.


    # 20.4 Construction Phase


    # 20.4.1 Analysis


    After clarifying the details with the instructor, our quartet of students derives
    a more detailed description in the form of stories. In doing so, they discuss
    the stories with the instructor, clarifying the university''s requirements for
    the program. Anna develops an initial analysis model from the requirements. Anna''s
    proposal consists of three classes: a class Statistics, a class Student and a
    class Course. The course statistics are the main program and displays the statistics
    of the courses. The class Student represents a student with matriculation number,
    first and last name and the course taken. Finally, a class course is necessary
    to capture the course taken with course number and title (Figure 20.6).'
