  md: '# Exceed the Value Range


    You must decide at declaration time whether the reserved value range and precision
    are sufficient for you to use a variable during the course of the program. If
    this is not the case and the variable exceeds its maximum value at some point
    or is too imprecise, program errors will occur. These can manifest themselves
    in different ways.


    In the best case, program errors are noticed by a so-called overflow. In some
    cases, the program may go crazy and produce completely wrong results. In Chapter
    23, »Rules», you will learn exactly in which cases this happens and how you can
    protect your program from such conditions.


    # Data Type Selection


    What does the risk of errors mean for the selection of a data type? First of all,
    it means that a software developer should consider very carefully the programming
    stage which simple data type is suitable for a particular task based on its range
    of values.


    +   * If the developer is too security-conscious and uses too large data types,
    his program will run securely but consume too much memory.

    * If the developer is too economical, his program will consume little memory,
    but it will not properly.


    In all cases of doubt, you should always prefer the first strategy.


    # Program Test


    In any case, the developer must carefully consider which primitive data type is
    best suited for which part of the program, and he must test his program very carefully
    with respect to primitive data types (Chapter 23, »Rules»). How to use the data
    types is shown by small application examples in the following sections.


    Figure 8.6: the digits of the mantissa determine the precision.


    ![](img/292946f2e46e87f1c5153615a652bd5b_152_0.png)'
