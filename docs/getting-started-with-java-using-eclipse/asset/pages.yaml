    # 4.3.7 Build System


    Eclipse''s build system has two core parts: the build monitor and the Java compiler.
    The build monitor detects which classes can be compiled and passes this work to
    the compiler. Unlike a classic build system, the Eclipse compiler compiles the
    source code in the background. The way it works is that the Eclipse compiler starts
    its work the moment you have saved a Java class and it is free of syntactic errors.


    By compiling in the background, the build system ensures that you can almost always
    execute a program immediately. For especially enterprises that consist of hundreds
    of classes and can have long compilation times, this is a plus over traditional
    development environments. So, as a rule, you do not do without this feature. If
    it should be necessary nonetheless, switch it off PROJECT -> Build Automically
    (Figure 4.36).


    Like its JDK counterpart, the Eclipse compiler translates the source code into
    an intermediate formatted bytecode. This bytecode can be executed by all virtual
    machines on Windows, Linux and MacOS. Chapter 20, «Development Processes», goes
    into more about the compiler. Why a separate compiler? In the early days of Java,
    Eclipse''s build system was a key advantage over other development environments.
    Today, computers and the JDK compiler have become so fast that this advantage
    is hardly noticeable.


