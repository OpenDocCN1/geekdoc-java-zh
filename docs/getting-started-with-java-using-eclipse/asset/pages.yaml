  md: '# 7.2.2 Statement Types


    As mentioned at the beginning, you can compare Java statements with commands in
    the form of a sentence. Exactly does this look like in a Java program? Table 7.1
    gives you some examples of different statements.


    Table 7.1: Examples of Java statements.


    | Statement | Java Example |

    | --- | --- |

    | Declaration | String name: |

    | Assignment | name = "Anna"; |

    | Variable call | Person.name; |

    | Methode call | roth.getName(); |

    | Conditional statement | if (height > 171) ... |

    | Loop | for (student = 1; i < 10); student++) {...} |


    # 7.3 Declaration


    You must declare constants and variables in Java before you use them. The structure
    of this instruction has already been briefly mentioned in the previous two chapters.
    How the data is declared is shown again in Figure 7.3. First comes the data type
    and the constant or variable. The declaration is always part of a class, for example
    in the form of an attribute, a parameter or a local variable. This means you can
    never use an attribute like name detached from a class like person.


    ![](img/292946f2e46e87f1c5153615a652bd5b_136_0.png)


    Figure 7.3: General structure of a Java declaration.


    You can assign a value to the constant or variable only after after the declaration.
    Declaring a constant or variable is necessary so that it is clear to the Java
    compiler how much memory it should to allocate to the constant or variable. In
    addition, the declaration enables the compiler to control what may be done within
    the program with this constant or variable.'
