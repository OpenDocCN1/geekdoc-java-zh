  md: '# # 11.2 Overview


    # ## 11.2.1 Purpose of Arrays


    Arrays can be used to store sets of numbers or objects. Unlike some other programming
    languages, Java arrays are objects. Thus, they are created from a corresponding
    class. Arrays contain a fixed number of objects.


    # ## 11.2.2 Types of Arrays


    # ### One-dimensional Arrays


    There are one-dimensional or multi-dimensional arrays. One-dimensional arrays
    are comparable to enumeration types of the last chapter. They start with 0 and
    end at the element n-1 (Figure 11.2).


    ![](img/292946f2e46e87f1c5153615a652bd5b_207_0.png)


    **Figure 11.2:** One-dimensional arrays behave like an enumeration.


    # ## Multidimensional Arrays


    Multidimensional arrays are comparable to multidimensional matrices. They also
    start with 0 in each dimension and end at the element n-1 (Figure 11.3).


    ![](img/292946f2e46e87f1c5153615a652bd5b_207_1.png)


    **Figure 11.3:** Multidimensional arrays behave like n-dimensional matrices.'
  merge: -1
  pgno: 207
- img_proc: true
  md: '# 11.2.3 Usage of Arrays


    Declaration of a One-Dimensional Array

    Like other variables, array variables must also be declared. This declaration
    is very interesting because it does not include the number of elements. For this
    reason, arrays are also called semi-dynamic. So, if you can determine how many
    elements the array should consist of before creating it within the program, you
    do not have to put in the number of elements until. Note the pair of square brackets
    that follows the data type. It is the characteristic of a Java array. The pair
    of brackets is located to the right of the data type in Figure 11.4. In this case,
    the variable name does not contain brackets when the object is created.


    ![](img/292946f2e46e87f1c5153615a652bd5b_208_0.png)


    **Figure 11.4:** In this type of declaration, the pair of brackets is centered.


    There is also another option to place the pair of brackets to the right of the
    variable (Figure 11.5). In this case, the variable name does contain brackets
    when the object is created (Listing 11.7). Which of the two possibilities one
    prefers is a matter of taste. Personally, I find the second way better, because
    it is clear from the variable name with brackets that it is an array.


    ![](img/292946f2e46e87f1c5153615a652bd5b_208_1.png)


    **Figure 11.5:** In this type of declaration, the pair of brackets is right-aligned.'
  merge: -1
