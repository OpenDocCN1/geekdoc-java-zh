  md: '# 2.3 Why Java?


    Java is one of the most successful programming technologies today; it is used
    at many universities and companies. Many private users also program in Java. The
    reasons lie in the features of the Java technology.


    ```

    Java {

    * Easy to read

    * Object-oriented

    * Safe and robust

    * Very powerful

    * Universally usable

    * Free of charge

    * Open Source

    * Easily portable

    * Easily expandable

    * Easy to develop and test

    }

    ```


    Figure 2.5: The features of Java technology.


    # 2.3.1 Easy to Read


    The simple syntax of Java has the advantage that you can learn the language comparatively
    easily and read Java programs easily. The simple syntax also means that you can
    more easily understand the structure and meaning of Java programs that you have
    not developed yourself.


    # 2.3.2 Object-Oriented


    The fact that Java programs are easy to read is not only due to the syntax of
    the programming language, but also because they are structured in an object-oriented
    way. Object orientation is one of the most important reasons for the clear structure
    of Java programs. In the chapter 3, Object-Oriented Programming, you will learn
    everything about the topic.


    # 2.3.3 Safe And Robust


    One of the most important features of the Java programming language is that it
    supports the development of safe and robust programs. Java programs owe part of
    their robustness'
  merge: -1
  pgno: 40
- img_proc: true
  md: '# 2 Technology Overview


    to their object orientation. To make Java programs run more stably than object-oriented
    C++ programs, the developers of the Java language have removed error-prone C++
    constructs. This has ensured that Java programs generally run much more safely
    and do not crash early, as some poorly developed and tested C++ programs do.


    # 2.3.4 Very Powerful


    The Java programming language helps you develop programs that can meet the most
    demanding requirements for commercial applications. With such professionally developed
    Java programs, thousands of users can work efficiently in parallel, safely and
    without interruption.


    # 2.3.5 Universally Useable


    There are programming languages specifically for scientists, others specifically
    for business people. Some are designed specifically for programming graphical
    interfaces, others specifically for database queries. Java is so successful because
    the language can be used universally. The spectrum of Java with small programs
    for private use, continues with tools such as the Eclipse development environment
    and extends to web applications for large companies. Java can even be used for
    such exotic programs as controlling Lego robots.


    # 2.3.6 Free of Charge


    Another advantage of Java is that the technology has been free of charge since
    its beginning. Every professional Java programs can be developed for free.


    # 2.3.7 Open Source


    The Java inventor Sun Microsystems has made Java open as Open (JDK = Java Development
    Kit). This means the source code and the know-how of the JDK is public. The technical
    term for this open source. This ensures that the Java platform can be transferred
    to other operating systems independently of a specific manufacturer. Java programs
    can be run on (almost) any computer system.


    # 2.3.8 Easily Portable


    Forget if you have read or heard somewhere that Java is platform independent.
    The wellknown saying »Write once, run anywhere» is a nice fairy tale that Sun
    Microsystems can make up with to help Java succeed. Large sections of IT management,
    many specialist authors and journalists still believe this story.


    More books: https://t.me/booksforits'
