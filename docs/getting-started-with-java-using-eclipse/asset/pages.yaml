  md: '# 20.2.2 Activities


    In each phase, the team engages in a number of different activities:


    +   - Requirements gathering: a team member discusses new requirements with the
    customer.

    - Analysis & Design: An analyst analyzes existing requirements and puts the pieces
    into a meaningful design.

    - Implementation: Meanwhile, a developer is already programming the software using
    a rough design.

    - Test: Another team member checks whether completed program parts function as
    desired. If the test is successful in the opinion of the team, a team member compiles
    the completed software at the end of each sprint.


    Afterwards one shows the customer in a review at the end of a Sprints already
    finished software. The customer can then accept or reject it (Figure 20.4).


    ![](img/292946f2e46e87f1c5153615a652bd5b_339_0.png)


    Figure 20.4: The sequence of activities during software development


    The processes do not run in a straight line, but rather in a circle, hence the
    way they are represented. All activities must be run through x times until the
    overall product is completed. If you employ an agile approach to Java, you first
    start by recording the requirements in a sprint. Then you derive Java classes
    and bring them into a meaningful design. Then the actual Java programming and
    testing of the Java program begin. These circular processes continue until the
    project is completed.


    The planning, construction, and operation phases summarize certain activities.
    For example, in the planning phase, a team is mainly engaged in planning (hence
    the name of the phase). This means that the focus of this phase is on requirements
    gathering. However, it may also be the case that Java code is already being written
    in the planning phase, for example to complete a prototype.'
  merge: -1
