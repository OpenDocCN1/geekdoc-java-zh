  md: "# 6.6 Class Variables\n\nWhile object variables are private property of objects,\
    \ so to speak, it is different for class variables. Class variables apply to *every*\
    \ object of a class in which they were declared. One declares them by the keyword\
    \ *static*. As with the other variable types, declaration and assignment can also\
    \ be combined (Figure 6.13).\n\n![](img/292946f2e46e87f1c5153615a652bd5b_127_0.png)\n\
    \n**Figure 6.13:** Class variables apply to any object of the class in which they\
    \ are declared.\n\nClass variables are therefore not bound to an object. Therefore,\
    \ they exist from the time a class is loaded until the program terminates. In\
    \ other words, every object created by the class has a variable with exactly the\
    \ **same value**. The following example shows what consequences this has. The\
    \ example consists of the *class person* and the program *class demo*. The *class\
    \ Person* has the attribute *student*. The program initially assigns the initial\
    \ value *false* to this variable. By calling the constructor of the class in line\
    \ 9 of the listing, this initial value is assigned a suitable value for an instance\
    \ of the class **Person**\n\n**Listing 6.5:** The class «Person» with the class\
    \ variable «student».\n\n```\n//Examples/Variables\npackage programmingcourse;\n\
    public class Person {\n    static boolean student = false;\n    public Person(boolean\
    \ student) {\n        student = student;\n    }\n    public static boolean isStudent()\
    \ {\n        return student;\n    }\n```"
