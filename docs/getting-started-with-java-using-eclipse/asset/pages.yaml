    A query method is unnecessary for constants, since constants are generally declared
    as public, in the class Person. Why not, since no one can change the value of
    the constant? So any part of the program can access this immutable *variable*
    unhindered. Consequently, a query method is superfluous for public attributes.
    When you start the program ConstantDemo, it prints the following information on
    the console:


    Persons have 2 legs


    # 6.8 Summary


    In this chapter, you have learned how variables and constants can be used in Java.
    Java distinguishes four types of variables besides the constant: local variables,
    parameters, and object and class variables. Local variables apply only where they
    have been declared. They are locally limited. Parameters, similar to local variables,
    apply only in the block of a method; they are declared in the method header. Object
    variables are different for each object (copy) of a class. In contrast, class
    variables are static, as specified when they are declared. Once set, the value
    of a class variable is the same for all copies of class.


