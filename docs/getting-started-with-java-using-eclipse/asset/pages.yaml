  md: '# 23.8 Summary


    The visibility of classes can be specified in two levels, that of methods and
    variables in four levels. In addition to these visibility levels, the scope of
    variables is affected by blocks. Here an occlusion can occur, which overlaps class
    and object variables. Java, as a typed language, requires an explicit conversion
    of the value range if data types do not match. This explicit conversion can result
    in data loss, so care must be taken here. More insidious than the explicit conversion
    is the automatic (implicit) conversion of the type, where information can also
    be lost. You protect yourself against automatic conversion by converting intermediate
    results explicitly.


