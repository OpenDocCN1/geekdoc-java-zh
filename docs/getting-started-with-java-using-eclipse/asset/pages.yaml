  md: '# 25.6 Deployment 473


    In the dialog that appears, expand the JAVA branch and export the program as RUNNABLE
    JAR (Figure 25.11). On the second page of the dialog, select the Launch Configuration
    of the project and enter as Export Export DESTINATION Swing_Programs/product/CourseStatisticsApp.jar.


    For larger projects with many libraries, it is important to export these libraries
    so that the program can be run without a development environment. Eclipse offers
    three options when exporting:


    +   * Extracted libraries into generated JAR

    * Package required libraries into a sub-folder

    * Copy required libraries into a sub-folder next to the generated JAR


    With the first option, Eclipse resolves the libraries and copies the classes individually
    into the new JAR archive. With the second option, Eclipse packages the libraries
    into the new JAR archive. With the third, it places them separately in the export
    directory.


    ![](img/292946f2e46e87f1c5153615a652bd5b_498_0.png)


    **Figure 25.11:** Export the program as an executable file.


    Since the CourseStatisticsApp doesn''t need any libraries outside of the Java
    Runtime Environment, it doesnt matter which option you choose. I would recommend
    option two for medium sized projects because using a single JAR archive is easier
    to handle. For very large projects, option three is recommended because it keeps
    the Java archive small.


    You can usually start the Java archive now by double-clicking on the executable
    file CourseStatisticsApp.jar.start. To allocate more memory to the program, a
    start script is necessary. Listing 25.18 shows a simple script for Windows. It
    assumes that you have set the search path to the virtual machine correctly.'
