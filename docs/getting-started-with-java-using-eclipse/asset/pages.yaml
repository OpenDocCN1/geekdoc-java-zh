    # Vector<String> = record (consists of String[] dataFields)


    | Student Number; | First Name; Last Name; | Mandatory Subject; Elective Subject|

    |---|---|---||

    | 10010; | Anna; Seitz; | Mathematics I; ...; English |

    | 10011; | Julia; Lippert; | Mathematics I; ...; Biology |

    | 10012; | Lukas; Witte; | Mathematics I; ...; History |

    | 10013; | Florian; Krause; | Mathematics I; ...; Geography |


    Vector<Vector<String>> records


    **Figure 25.6:** The course statistics data model.


    If it is not clear how a table can grow in the x or y direction, you must use
    a dynamic array for the table''s data model. Dynamic arrays can be implemented,
    for example, the Vector class. The class Vector also harmonizes very well with
    swing tables. Each field of such a table is an element of the type String. Together
    they result in a record of type Vector<String> (one-dimensional array). Finally,
    all records result in a variable named datasets, which is of type Vector<Vector<String>>
    – a two-dimensional array.


    # Filtering the Table


    When the CSV file is read in presented as a table, the user wants to get information
    about a particular person or about a particular course in a semester. There are
    two options here: searching and filtering. With a search, the program would simply
    highlight a found text passage, but continue to display the result of the table.
    A filter, on the other hand, hides all rows where there is no hit. For this reason,
    the program CourseStatisticsApp is to be equipped with a filter.


