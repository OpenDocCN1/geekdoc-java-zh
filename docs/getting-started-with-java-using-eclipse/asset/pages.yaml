  md: "# 9.7 Summary\n\nJava has four different types of classes: concrete classes,\
    \ abstract classes, interfaces, and generic classes (generics). Concrete classes\
    \ can be called «normal» classes. Objects can be derived from this type of class\
    \ using the keyword `extends`.\n\n+   Class types {\n* Concrete class\n    * `Natural`\
    \ class\n    * Local class\n    * Inner class\n    * Anonymous class\n* Abstract\
    \ class\n* Interface\n* Generic class }\n\n![](img/292946f2e46e87f1c5153615a652bd5b_192_0.png)\n\
    \nIn contrast, you use interfaces and abstract classes for design reasons. Generic\
    \ classes can be «normal» classes or interfaces. They are universal containers\
    \ for all possible types of objects. The great advantage of generic classes is\
    \ type safety. This means that the program can no longer make a mistake when assigning\
    \ the objects, otherwise the program will not be compiled (Section 9.8, «Literature»).\n\
    \n# 9.8 Literature\n\nType safety: https://de.wikipedia.org/wiki/Typsicherheit\n\
    Oracle tutorials: https://docs.oracle.com/tutorial/java/java/TOC.HTML\nJava Object\
