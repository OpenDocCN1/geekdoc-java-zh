  md: '# 6.3 Local Variables


    Local variables have the task of storing data locally. Local means that the variable
    is only visible in a special section of the class and not globally within the
    class. One always stores data only if a variable is exclusively needed locally.
    This can be, for example, if one receives an intermediate result of a calculation
    or an object is only needed locally. The declaration of a local variable looks
    the same as for other variables. However, the visibility of the variable is limited
    only to the block in which it was declared (Figure 6.7).


    ![](img/292946f2e46e87f1c5153615a652bd5b_122_0.png)


    **Figure 6.7:** Declaration of a local variable.


    An example of a local variable is the object *roth* from the class *LocalVariableDemo*.
    Have a look at the listing of the method *main* from the *LocalVariableDemo* class
    (Listing 6.1).


    **Listing 6.1** The local variable *roth* inside the method *main*.


    ```

    7   public static void main(String[] arguments) {

    8       Person roth;

    9

    10      roth = new Person("Karsten", "Roth");

    ```


    On line 9 of the example, the program declares the variable *roth* of data type
    *person*. The program assigns the object, which is created by the expression *roth
    = new Person("Karsten", "Roth")*. The life of the variable *roth* is limited to
    the method *main()*. Outside of the *main* method in the rest of the class, this
    variable is not visible. This also means that the object is perfectly protected
    from access by other objects in the program, because it has no interface to the
    outside world.'
