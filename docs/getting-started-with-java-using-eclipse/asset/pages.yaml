  md: '![](img/292946f2e46e87f1c5153615a652bd5b_343_0.png)


    # 20.4.3 Implementation


    In implementation, a Java developer implements the design of the software using
    the Java programming language. Which class it makes sense to start the implementation
    with is a matter of task. If you want to minimize conflicts in the Eclipse IDE,
    start with the classes that have the fewest dependencies on other classes.

    The *class* can be implemented easily and without error messages. After that,
    you would implement the class *Student* and finally tackle the class *CourseStatistics*.
    But it works the other way round. But this way, you would provoke Eclipse to create
    the missing classes automatically. This is exactly what I want to show you on
    the next pages.


    # Change Workspace


    Now, to start the implementation, start the Eclipse IDE with the workspace *exercises*.


    # New Project


    To create the classes *Course Statistics*, *Student* and *Course* you need a new
    Java project again. To do this, start the Eclipse wizard using the `FILE` → `NEW`
    → `JAVA PROJECT` menu command of the `NEW` → `JAVA PROJECT` icon on the far left
    of the toolbar. In the dialog that appears, enter the project name *Development_Processes*
    so that you can assign the project to this chapter.'
