  md: '# 15.2 Overview


    # 15.2.1 Purpose of Loops


    Like conditionals, loops belong to the control structures of a programming language.
    They allow one or more statements to be repeated until a termination condition
    is met. Without a termination condition, the instructions would be trapped in
    an infinite loop. Loops combine the branches of the last chapter with the statements
    of chapter [Statements].


    Another day?


    ![](img/292946f2e46e87f1c5153615a652bd5b_277_0.png)


    **Figure 15.2:** This loop outputs the number of Professor Roth''s course participants.


    You can see an example of a loop in figure 15.2. In this loop, the current number
    of the member of our programming course of Professor Roth is number one at the
    beginning. Then the program outputs the number of the current course member. In
    the next step, the program increments the current member number by one. Then,
    as a termination condition, it checks whether the total number of participants
    is greater than the current member number. If it is not, the program returns to
    the beginning and outputs the number of the next course member. Otherwise, the
    program ends.


    # 15.2.2 Types of loops


    Java defines three types of loops, with the for loop existing in two subtypes
    (Table 15.1).


    **Table 15.1:** Types of Loops


    | Type of loop | Description |

    |---|---|n| While loop | Number of runs previously unknown, rejecting |

    | Do loop | Number of runs previously unknown, non-rejecting |

    | Simple for loop | Number of runs known in advance, very fast output, rejecting
    |

    | Extended for loop | Number of runs known in advance, very fast output, rejecting
    |'
