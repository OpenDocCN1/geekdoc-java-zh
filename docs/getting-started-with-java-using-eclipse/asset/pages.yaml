  md: '# From The Inside To The Outside


    In cases 6 and 7, the processing of the expression proceeds from the inside to
    the outside. First the addition is calculated, then the multiplication, and finally
    the division.


    # 23.6 Type Conversion


    Java, unlike some other languages, is strictly typed. If an identifier has been
    declared a certain type, this is valid for the whole life of the program. The
    compiler checks for assignments to see if the data types match. The following
    is not compiled:


    ```

    long a = 1;

    int b = 1;

    b = a; // will not be compiled

    ```


    The compiler checks if a data loss can occur. Since the variable a can occupy
    a larger range of values than b, it refuses to approve the expression. On the
    other hand, the following succeeds:


    ```

    long a = 1;

    int b = 1;

    a = b; // will be compiled

    ```


    However, the fact that an identifier is chained to its type for life does not
    mean that it is not possible to break these shackles temporarily. Type conversion
    allows values to be changed between variables of different types, as the following
    fragment shows:


    ```

    long a = 1;

    int b = 1;

    int c = 1;

    b = (int)a; // will not be compiled

    ```


    As the example shows, the program performs a temporary conversion of a through
    a cast operator to pass the value to b. You can see this arrangement is temporary
    in the line that follows. The program tries again to pass a value of long to a
    variable of type int, and fails again because the compiler rightly prevents it.


    The Java programming language has two types of type conversion. Implicit type
    conversion is done automatically. Here the developer is passive. With the explicit
    conversion, you explicitly perform a conversion.


    # 23.6.1 Implicit Conversion


    The implicit conversion is tricky, where a creeping value conversion takes place.
    The compiler does not indicate when data loss is imminent, as the following examples
    show.'
