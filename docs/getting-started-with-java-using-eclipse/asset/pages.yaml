  md: '# 13 Operators


    # 13.1 Introduction


    Java operators are fixed Java keywords for special functions. So an operator is
    nothing else than the shorthand notation for a method. The keywords are very short,
    mostly only one digit. By operators variables, attributes and objects can be linked
    to expressions. The expressions then become complete statements. This chapter
    will show you again how this works by means of some examples.


    > Operators are the Swiss Army Knife of the programmer, Java has a multitude of
    operators, which I would like to introduce to you in this chapter.


    ![](img/292946f2e46e87f1c5153615a652bd5b_238_0.png)


    Figure 13.1: For Robert, operators are nothing more than a collection of tools.'
