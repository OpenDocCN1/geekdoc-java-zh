  md: '# 22.2 Overview


    Class libraries are collections of proven programming solutions. They consist
    of thematically related classes, for example, for programming graphical interfaces
    or accessing databases. However, class libraries do not contain independent programs,
    but only building blocks for your programs. The similarity to classical libraries
    is obvious: The author of a class makes its solution available like a book to
    other programmers. The programmers «borrow», so to speak, the class for their
    purposes. Not only the borrowing of classical libraries, also the thematic framework.
    Therefore it came to the designation «class libraries.


    ![](img/292946f2e46e87f1c5153615a652bd5b_383_0.png)


    **Figure 22.2:** Class libraries are organized tree-like and thematically.


    The first Java class libraries were very much organized using inheritance. Modern
    class libraries, on the other hand, consist of loosely coupled classes that are
    now thematically related. By the mixture of abstract classes, interfaces and concrete
    as well as generic Java class libraries can be arranged fastidiously. One or several
    interfaces as well as basis classes form the basis for classes derived from it.
    As diagram a class library reminds of a tree standing on the head. Programmers
    therefore refer to such graphics as a class tree (Figure 22.2).'
