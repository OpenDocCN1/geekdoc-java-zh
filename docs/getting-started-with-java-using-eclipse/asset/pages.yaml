  md: 'erating system. The usual characters are Carriage Return and Line Feed, which
    still come from the typewriter era.


    | Table Header | Field Separator | CSV File | Line Break | End of File |

    | :--- | :--- | :--- | :--- | :--- |

    | Records (Rows) | Row 1 | Student Name, Last Name, | Mandatory Subject, | Elective
    Subject |

    | | 100010, | Anna, Seitz, | Mathematics i..., | English... |

    | Row 2 | 100011, | Julia, Lippincott, | Mathematics i..., | Biology |

    | | 100013, | Lukas, Florian, Wittek, Krause, | Mathematics i..., | History |

    | | | Column 1 ... Column n | | |

    | | | Data Fields (Columns) | | |


    **Figure 25.5:** The structure of the CSV file.


    In a program to distinguish the data fields of a record when reading the CSV file,
    they must be separated by a character that is known to the program before reading.
    In principle, many characters such as a comma or semicolon can be used. It is
    only important that the character is not contained in the values of the data fields.
    In the English language area a comma has established itself as a separator. This
    separator also explains the original meaning of the abbreviation CSV, which stands
    for ~~Comma-separated values~~.

    CSV files are often used to exchange numerical values. Unfortunately, in the United
    States, decimal places are separated by a period, whereas in the German-speaking
    world, they are separated by a comma. Numbers according to German formatting will
    not be interpreted correctly with a comma as a separator, which is why we have
    established a semicolon as a separator for data fields. This should also apply
    to the structure of the quote list.

    The reading of a CSV file requires a so-called parser (English: to parse = analyze,
    dissect). A parser breaks down a file into its individual components. To do this,
    the parser reads each line of a file. With the help of the separator for individual
    values, the parser splits each line into its components. By assigning the values,
    the rows and columns of a table are created. The parser repeats the process of
    reading until it reaches the end of the file.


    # Developing the Data Model


    To map the CSV data structure to Java classes, it is useful to develop a data
    model before implementing the Java program. The CSV file consists of an unknown
    number of records, the rows of the later table. Each of these rows in turn consists
    of an unknown number of data fields, the columns of the later table (Figure 25.6).


