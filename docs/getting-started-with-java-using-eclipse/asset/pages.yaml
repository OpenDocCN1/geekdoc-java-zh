  md: 'In my experience, beginners often have the problem that they understand very
    simple example programs, but do not know how to build larger programs. Most of
    the projects you encounter in companies are far too large and poorly documented
    for learning Java.


    > Hey, great - done!

    This is the last part of this Java book.

    It introduces you to the Swing program «CourseStatisticsApp. This is an application
    with a graphical user interface that displays the course load of students in tabular
    form. Have fun with the development!


    ![](img/292946f2e46e87f1c5153615a652bd5b_473_0.png)


    Figure 24.8: CourseStatisticsApp, a program to output the course enrollment of
    a semester.


    The ideal would be a manageable Java project that a Java beginner can understand
    – that''s exactly what this book part presents to you on a single project. The
    book part consists of only one project called «CourseStatisticsApp», which is
