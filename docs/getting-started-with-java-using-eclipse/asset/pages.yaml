    # 22.3.10 Applets


    Applets are small programs that can be embedded in web pages and executed by a
    browser. These mini-programs are no longer state of the art. Oracle has discontinued
    this technology for this reason and has discontinued support for newer versions
    of Java. In other words, you should definitely not use applets anymore. There
    are far better technologies available, for example with HTML 5.


    # 22.3.11 Java Database Connectivity (JDBC)


    Java Database Connectivity (JDBC) provides a unified interface to relational databases.
    In general, relational databases can be programmed via SQL. By means of the database
    language information can be inserted, changed and deleted in relational databases.
    The Java Database Connectivity provides the programmer with various classes for
    this purpose, which are located in the package java.sql. Figure 2.17 shows the
    most important classes.


    The advantage of JDBC is that it frees the developer from programming for a specific
    database, such as DB2, Oracle and HSQLDB. You can program against a standard interface
    and not have to worry about specialties of each relational database.'
