  md: '# 18.4 Block Comments


    In contrast to line-related comments, block-related comments (block comments)
    can be used to hide large parts of the source code for the compiler and mark them
    as comments. As in the C/C++ programming language, they are started with a slash
    followed by an asterisk and in the reverse order (Figure 18.3).


    ![](img/292946f2e46e87f1c5153615a652bd5b_312_0.png)


    Figure 18.3: A block comment can span several lines.


    For this comment, Listing 18.2 shows an example.


    Listing 18.2: An example how to use a block comment.


    ```

    1 /* Block comment

    2 spans

    3 over

    4 several lines */

    ```


    However, the block comment can also be used to insert comments in the middle of
    the source code.


    Listing 18.3: A block comment can also be used to comment a single line.


    ```

    1 (...)

    2 Statements

    3 /* Block comment refers to one line only */

    4 Statements

    5 (...)

    ```


    # 18.5 Documentation Comments


    This interesting comment type is used to create HTML documents from comments inserted
    in the source code. These comments can also span several lines, like the section-related
    comments, but starting with an additional asterisk (18.4).


    Listing 18.4 shows an application based on a comment from the program example
    Course StatisticsApp at the end of this book.'
