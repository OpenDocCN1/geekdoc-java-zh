    algorithm, one should proceed according to a solution procedure. Such a plan could
    for example look like in figure 24.2.


    ![](img/292946f2e46e87f1c5153615a652bd5b_457_0.png)


    Step 1 is usually called «Requirements Capture«. Steps 2 to 5 are called »Analysis
    and Design»,. As you can see, the whole process is constantly repeated with each
    new requirement. The steps are cycled through the following order: Requirements
    Capture – Analysis and Design – Implementation – Test. The picture will surely
    look familiar to you from chapter 20, »Development Processes«. It is nothing else
    the development process presented there. So what I have just presented to you
    here is a process for developing algorithms. In principle, the entire development
    of a program runs like this: What applies to the algorithm on a small scale also
    applies to the program on a large scale.'
