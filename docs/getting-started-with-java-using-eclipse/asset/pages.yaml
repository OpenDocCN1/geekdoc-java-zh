- img_proc: true
  md: '# 10.2 Overview


    # 10.2.1 Purpose of Enums


    The programming language C/C++, from which Java was strongly influenced, did not
    have a special type for enumerations. And this probably explains why the first
    versions of Java did not provide a special data type for enumerations either.
    So Java programmers had no choice but to program each enumeration from scratch
    using their own design patterns. These are particularly successful examples of
    Java classes, which should serve other programmers as a template. Using Listing
    10.1 shows what an implementation of such an enum class looked up to Java 1.4.


    Listing 10.1: Example of an enum pattern up to Java 1.4.


    ```

    1 //Examples/Enumerations


    4 package programmingcourse;

    5 class Weekday {

    6 public final Weekday MONDAY = new Weekday("Monday");

    7 public final Weekday TUESDAY = new Weekday("Tuesday");

    8 public final Weekday WEDNESDAY = new Weekday("Wednesday");

    9 public final Weekday THURSDAY = new Weekday("Thursday");

    10 public final Weekday FRIDAY = new Weekday("Friday");

    11 public final Weekday SATURDAY = new Weekday("Saturday");

    12 public final Weekday SUNDAY = new Weekday("Sunday");

    13

    14 private String name;

    15

    16 //Constructor:

    17 private Weekday(String name) {

    18 this.name = name;

    19 }

    20

    21 public String toString() {

    22 return name;

    23 }

    24 }

    ```


    In lines 6 to 12, you can see the individual elements of the enumeration. They
    are constants of type string. Each constant calls the constructor of the class
    Weekday in line 17 via the statement new Weekday("..."). The constructor is passed
    the name of the element as a parameter of the data type String (i.e. as a string).
    The class Weekday stores this attribute in the object name of type String, which
    is on line 14. The class has one more method, to toString(), which returns the
    name of an element.


    Listing 10.2 shows how to use the Java class we developed. You can address each
    constant directly with a fixed value. As usual with public static final class
    variables (constants), calling an element always follows the class.CONSTANT.'
