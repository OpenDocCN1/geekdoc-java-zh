    # JDBC driver


    The actual connection to the database is provided by a JDBC driver, which is usually
    developed-by the database vendor. It decouples the Java program from the database.
    There are four classes of JDBC drivers:


    +   * type 1: JDBC-ODBC bridge: This is the slowest driver type. It should only
    be used when relational databases that do not have an SQL interface to be used.

    * Native API driver: This driver type converts the JDBC calls to native API calls
    of the database. Therefore, you can communicate directly with the database.

    * Net driver: This driver type converts JDBC calls into database-neutral network
    calls. An intermediary layer between the driver and the database performs the
    final conversion.

    * Thin drivers: This driver is mostly supplied by the database vendors themselves
    and is built directly on top of the database API. It is highly advisable to deal
    with these types in detail during database programming, because the quality of
    the DB connection stands and falls with the drivers. Accordingly, some drivers
    are expensive.


    Which driver should you use? For the reasons mentioned above, driver types 3 and
    4 are preferable.


