  md: "# 14.5 Switch Statement\n\n# 14.5.1 Switch Statement at the Level of Java 6\n\
    \nIf you have a lot of possibilities for a program branch, »If» branches as a\
    \ solution quickly becoming confusing. As a substitute the switch conditional\
    \ offers itself.. However, the variable following the *switch* may only be of\
    \ type *char, byte, short, int, enum* or *string* (Java 7). For example, a true\
    \ value is not allowed.\n\nListing 14.3: The switch statement up to Java 6.\n\n\
    ```\n//Examples/Conditional_Statements\npackage programmingcourse;\npublic class\
    \ JavaSwitchDemo {\n    static String createState(boolean student) {\n       \
    \ int state = student ? 1 : 0;\n        String stateDescription;\n        switch\
    \ (state) {\n            case 0:\n                stateDescription = \" is not\
    \ a student\";n                break;\n            case 1:\n                stateDescription\
    \ = \" is a student\"\n                break;\n            default:\n        \
    \        stateDescription = \"\";\n                break;\n        }\n       \
    \ return stateDescription;\n    }\n\n    public static void main(String[] arguments)\
    \ {\n        // \"Anna\", the object identifier is anna:\n        Person anna\
    \ = new Person(\"Anna\", true);\n        String studentState = createState(anna.isStudent());\n\
    \        System.out.println(anna.getName() + studentState);\n\n        // \"Robert\"\
    , the object identifier is robert:\n        Person robert = new Person(\"Robert\"\
    , false);\n        studentState = createState(robert.isStudent());\n        System.out.println(robert.getName()\
    \ + studentState);\n    }\n}\n```\n\nIf a case is extended to a condition, it\
    \ *must* be terminated with a *break* must be used to terminate it. If this is\
    \ forgotten, the program evaluates the case statement. In this case, all breaks\
    \ are present."
