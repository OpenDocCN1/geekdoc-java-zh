    be to specify the condition, "SOFTWARE", first as follows:


    # SQL Code (More Efficient)


    ```

    PROC SQL STIMER;

    SELECT *

    FROM PRODUCTS

    WHERE UPCASE (PRODYPE) IN (''SOFTWARE'', ''LAPTOP'');


    QUIT;

    ```


    # SAS Log Results


    PROC SQL STIMER;

    SELECT *

    FROM PRODUCTS

    WHERE UPCASE (PRODYPE) IN (''SOFTWARE'', ''LAPTOP'');

    NOTE: SQL Statement used (Total process time):

    real time 0.02 seconds

    cpu time 0.03 seconds


    QUIT;


    # Avoiding UNIONS


    UNIONS are executed by creating internal sets, then merge-sorting the results
    together. Duplicate rows are automatically eliminated from the final results.
    The Venn diagram for a UNION of two sets represents all distinct elements in the
    collection, as illustrated in Figure 10.1.'
