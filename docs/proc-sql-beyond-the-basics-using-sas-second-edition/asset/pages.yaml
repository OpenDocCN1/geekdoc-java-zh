    # Complex Query Applications


    Query applications come in all forms and can typically be classified into three
    distinct categories:


    +   - Production-oriented queries rarely change, are run as needed (e.g., daily,
    weekly, monthly, etc.), and consist of SQL statements, parameter lists, and/or
    action queries.

    - Ad-hoc queries are typically constructed as needed and are often used once or
    in some unpredictable way to solve a particular need or problem.

    - Custom queries are classified as falling somewhere in-between production-oriented
    and ad-hoc queries, where the query is the same time it runs, but conditional,
    parameter, action processing (e.g., create a new table, update one or more rows
    in a table, delete one or more rows in a table, and append one or more rows to
    an existing table), and data differences exist and must be handled.


    In this section, a few complex query applications are presented to show how the
    SQL procedure can be used to satisfy specific processing/or data requirements.
    The applications have been selected, in part, by the needs of many SAS users have,
    the emulation of DATA steps using SQL queries, and to share interesting SQL procedure
    techniques approaches.


    # One-to-One, One-to-Many, Many-to-One, and Many-to-Many Relationships


    Input tables are frequently characterized by the way rows in one table relate
    to one or more rows in another table. This process, referred to as the data relationship
    between two or more tables, consists of four categories:


    +   - one-to-one

    - one-to-many'
