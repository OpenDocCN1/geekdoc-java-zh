    # Deleting Tables


    The SQL standard permits one or more unwanted tables to be removed (or deleted)
    from a database (SAS library). During large process processes, temporary tables
    in the WORK library are frequently created. The creation and build-up of these
    tables can negatively affect memory and storage areas, which can cause potential
    problems due to insufficient resources. It is important from a database management
    perspective to delete any unwanted tables to avoid these types of resource problems.
    Here are a few guidelines to keep in mind.


    Before a table can be deleted, complete ownership of the table (that is, access
    to the table) should be verified. Although some SQL implementations require a
    table to be empty in order to delete it, the SAS implementation permits a table
    to be deleted without any rows of data. After a table is deleted, references to
    that table are no longer recognized and will result in a syntax error. Additionally,
    references to a deleted table in a view will also result in an error (see Chapter
    8, "Working with Views"). Also, indexes that are associated with a deleted table
    are automatically dropped (see Chapter 6, "Modifying and Updating Indexes").


    # Deleting a Single Table


    Deleting a table from the database environment is not the same as making a table.
    Although an empty table contains no data, it still possesses a structure; a deleted
    table contains no data or related structure. Essentially, a deleted table does
    not exist because the table including its data and structure are physically removed
    forever. Deleting a single table from a database environment requires a single
    table to be referenced in a DROP TABLE statement. In the next example, a single
    table called HOT_PRODUCTS located in the WORK library is physically removed using
    a a


    # SQL Code


    ```

    PROC SQL;

    DROP TABLE HOT_PRODUCTS;

    QUIT;

    ```


    Lafler, Kirk Paul. PROC SQL: Beyond the Basics using SAS\®, Second Edition. 2013,
    SAS Institute, Inc.

    Cary, North Carolina, USA. ALL RIGHTS RESERVED. For additional SAS resources,
    visit support.sas.com/bookstore.'
