    # Updating Data in a Table


    Once a table is populated with data, you might need to update values in one or
    more of its rows. Column values in existing rows in a table can be updated with
    the UPDATE statement. The key to successful row updates is the creation of a well-constructed
    SET clause and WHERE expression. If the WHERE expression is not constructed correctly,
    the possibility of an error is great.


    Suppose that all values in the PRODUCTS table have just been discounted by 20
    percent and the new price is to take effect immediately. The update would compute
    the discounted product cost for “Laptop” computers only. For example, the discounted
    price for a laptop computer would be reduced to $2,720.00 from $3,400.00.'
