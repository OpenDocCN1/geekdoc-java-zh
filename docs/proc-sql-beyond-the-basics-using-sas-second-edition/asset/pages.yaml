  md: "# Introduction\n\nPROC SQL is essentially a database language as opposed to\
    \ a procedural or computational language. In addition to having two data types\
    \ available in the SAS implementation of SQL, numerous extensions including operators,\
    \ functions, and predicates are available to PROC SQL programmers.\n\n# Overview\
    \ of Data Types\n\nThe purpose of a database is to store data. A database contains\
    \ one or more tables (and other components). Tables consist of columns and rows\
    \ of data. In the SAS implementation of SQL, the available data types are limited\
    \ to only two possibilities:\n\n+   - numeric\n- character\n\n# Numeric Data\n\
    \nThe SAS implementation of SQL provides programmers with numerous arithmetic,\
    \ statistical, and summary functions. It offers one numeric data type to represent\
    \ numeric data. Columns defined as a numeric data type with the NUMERIC or NUM\
    \ column definition are assigned a default length of 8 bytes, even if the column\
    \ is created with a length of less than 8 bytes. This provides the greatest degree\
    \ of precision allowed by SAS software. In the example, a table PURCHASES is created\
    \ of four numeric components. The resulting table contains no rows of data, as\
    \ illustrated by the SAS results. For more information about the CREATE TABLE\
    \ statement, see Chapter 5, \"Creating, Populating, and Deleting Tables.\"\n\n\
    # SQL Code\n\n```\nPROC SQL;\n  CREATE TABLE PURCHASES\n    CUSTNUM NUM,\n   \
    \ PRODNUM NUM,\n    UNITS NUM,\n    UNITCOST NUM(8,2));\nQUIT;\n```\n\n# SAS Log\
    \ Results\n\n```\nPROC SQL;\n  CREATE TABLE PURCHASES\n    (CUSTNUM NUM,\n   \
    \ PRODNUM NUM,\n    UNITS NUM,\n    UNITCOST NUM(8,2));\nNOTE: Table PURCHASES\
    \ created, with 0 rows and 4 columns.\nQUIT;\n```"
  merge: -1
  pgno: 46
- img_proc: true
  md: "# Results\n\n| # | Variable | Type | Len |\n|---|---|---|--|\n| 1 | CUSTNUM\
    \ | Num | 8 |\n| 2 | PRONUM | Num | 8 |\n| 4 | UNITCOST | Num | 8 |\n| 3 | UNITS\
    \ | Num | 8 |\n\nCreating a numeric column that is less than 8 bytes requires\
    \ the use of the DATA step LENGTH statement. Although it is not necessary to assign\
    \ smaller lengths to numeric columns because it can result in precision issues,\
    \ doing so can make for more efficient use of data storage system resources. The\
    \ example illustrates a DATA step that assigns smaller lengths to the four variables\
    \ in the PURCHASES table: CUSTNUM, PRONUM, UNITS, and UNITCOST. In contrast to\
    \ the SAS log results by the previous PROC SQL code, the CONTENTS output lists\
    \ the creation of a dataset with four user-defined, and shorter, numeric variables.\n\
    \n# DATA Step Code\n\n```\nDATA PURCHASES;\n  LENGTH CUSTNUM 4,\n         PRONUM\
    \ 5,\n         UNITS 3,\n         UNITCOST 4;\nLABEL CUSTNUM = 'Customer Number'\n\
    \       PRONUM = 'Product Purchased'\n       UNITS = '# Units Purchased'\n   \
    \    UNITCOST = 'Unit Cost';\nFORMAT UNITCOST DOLLAR12.;\nRUN;\nPROC CONTENTS\
    \ DATA=PURCHASES;\nRUN;\n```"
  merge: -1
  pgno: 47
