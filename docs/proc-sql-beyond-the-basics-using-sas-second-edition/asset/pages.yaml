    \ for the manufacturer that manufactures the Dream Machine workstation. The following\
    \ subquery (inner query) extracts the product number (PRODNUM) that is associated\
    \ with the Dream Machine, and passes the single value to the outer query for processing.\n\
    \nLafler, Kirk Paul. PROC SQL: Beyond the Basics Using SAS®, Second Edition. Copyright\
