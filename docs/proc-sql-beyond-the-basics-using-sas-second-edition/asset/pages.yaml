  md: "# Results\n\n| AVERAGE_PRODUCT_COST |\n| $324.00 ||\n\n# Summarizing Data Across\
    \ Columns\n\nWhen a computation is needed on two or more columns in a row, the\
    \ SQL procedure can be used to summarize data columns. Suppose you want to know\
    \ the average cost of products in inventory. The next example computes the inventory\
    \ cost for each product without using a summary function, and once computed displays\
    \ the value for each row as AVERAGE_PRICE.\n\n# SQL Code\n\n```\nPROC SQL;\nSELECT\n\
    \  (INPRICE / INVQTY) AS\n  AVERAGE_PRICE\n  FORMAT=DOLLAR.2\nFROM INVOICE;\n\
    QUIT;\n```\n\n# Results\n\n| Product Number | AVERAGE_PRICE |\n| 5001 | $299.00\
    \ |\n| 6001 | $799.00 |\n| 2101 | $35.00 |\n| 1110 | $3200.00 |\n| 5002 | $399.00\
    \ |\n| 6000 | $99.00 |\n| 1200 | $3300.00 |\n\n# Predicates\n\nPredicates are\
    \ used in PROC SQL to perform direct comparisons between two conditions or expressions.\
    \ Six predicates will be looked at:\n\n+   - BETWEEN\n- IN"
  merge: -1
