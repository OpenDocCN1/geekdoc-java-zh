    # Date and Time Column Definitions


    Database processing stores date and time information in the form of a numeric
    data type. Date and time values are represented internally as an offset where
    a SAS date value is stored as the number of days from the fixed date of 01/01/1960
    (January 1, 1960). The SAS date for January 1, 1960, is represented as 0 (zero).
    A earlier date than this is represented as a negative number and a later date
    than this is represented as a positive number. This makes performing calculations
    much easier.


    SAS has integrated a variety of date and time informats and formats with PROC
    SQL. The various informats and formats as input and output templates describe
    how date and time information is to be read or rendered on output. The SAS Language
    Reference: Dictionary for detailed descriptions of the various informats and formats
    and their use. Numeric date and time columns, when combined with informats and/or
    formats, automatically validate values according to the following rules:'
  merge: -1
  pgno: 49
- img_proc: true
  md: '# 28 PROC SQL: Beyond the Basics Using SAS. Second Edition


    +   * Date—Date in: formats enable PROC SQL and SAS to determine the month, and
    year values of a date. The month value handles values from 1 through 12. The day
    value handles values from 1 through 31 and applies additional validations to a
    maximum of 28, 29, or 30 depending on the month in question. The year value handles
    values from 1 through 9999. When you go back to 1582 and ahead to 20,000. When
    you enter a year value of 0001 and specify a format or Centuryof of 1928, the
    returned value would be 2001.

    * Time—Time informats and formats enable PROC SQL to determine the hour, minute,
    and second values of a date. The hour portion handles values from 0 through 23.
    The minute portion handles values from 00 through 59. The second portion handles
    values from 00 through 59.

    * DATETIME—Date and time stamps enable the SQL procedure to determine the month,
    day, and year of a date as well as the hour, minute, and second of a time.


    See Chapter 5, “Creating, Populating, and Deleting Tables” and Chapter 6, “Modifying
    and Updating Tables” for more information about date and time in and formats.


    # Character Data


    PROC SQL provides tools to manage and store data including words, text, and codes
    using the CHARACTER or CHAR data type. The characters handled by this data type
    include the ASCII or EBCDIC character strings. The CHARACTER or CHAR data type
    stores fixed-length strings consisting of a maximum of 32K characters. If a length
    is not specified, defaults to 8 characters.


    The SQL programmer has a variety of array and Base SAS functions that can take
    the task of working with character data considerably. In this chapter, you will
    learn how columns based on the character type are defined, and how strings function,
    pattern matching, phonetic matching techniques, and what of other techniques are
    used with character data.


    # Missing Values and NULL


    Missing values are an important aspect when dealing with data. The concept of
    missing values is familiar to programmers, statisticians, researchers, and SAS
    users. This chapter describes what NULL values are, they aren’t, and how they
    are used.


    Missing or unknown information is handled by PROC SQL in a form known as a null
    value. A null is not the same as a zero value. In SAS, null values are treated
    as a separate category from known values. A value consisting of zero is a known
    value. In contrast, a value of null has an unknown quantity and will never be
    proven. For example, a patient who has an eye exam does not have zero eyesight
    just because the results from the exam have not been received. The correct value
    to assign in a case like this is missing or a null value.


    In another example, say a person declines to provide their age on a survey. This
    person’s age is null, not zero. This person has an age, but it is unknown. Whenever
    an unknown value occurs, you have no choice but to assign an unknown value—null.


    Lafler, Kirk Paul. PROC SQL: Beyond the Basics Using SAS®; Second Edition. Copyright
    2013, SAS Institute, Inc.

    ary, North Carolina, USA. ALL RIGHTS RESERVED. For additional SAS resources, visit
    support.sas.com/bookstore.'
  merge: -1
  pgno: 50
- img_proc: true
  md: "Because the value of null is unknown, any arithmetic calculation using a null\
    \ will return a null. This makes a lot of sense because the results of a calculation\
    \ using a null are not determinable. This is sometimes referred to as the *propagation\
    \ of nulls* when a null value is used in a calculation or an expression, it propagates\
    \ a null value. For example, if a null is added to a known value, then the result\
    \ is a null value.\n\n# Arithmetic and Missing Data\n\nIn SAS, a numeric data\
    \ type containing a null value (absence of any value) is represented with a period\
    \ (.). This representation indicates that the column has not been assigned a value.\
    \ A null value has no value and is not the same as zero. A value consisting of\
    \ zero has a known quantity as opposed to a null value that is not known and will\
    \ never be known.\n\nIf a null value is multiplied with a known value, the result\
    \ is a null value represented with a period (). In the next example, when UNITS\
    \ and UNITCOST both have known values, their product will generate a known value,\
    \ as illustrated below.\n\n# SQL Code\n\n```\nPROC SQL;\n  SELECT CUSTOMN,\n \
    \ PRONUM,\n  UNITS,\n  UNITCOST,\n  UNITS * UNITCOST AS Total FORMAT=DOLLAR12.2\n\
    FROM PURCHASES\nORDER BY Total;\nQUIT;\n```"
  merge: -1
