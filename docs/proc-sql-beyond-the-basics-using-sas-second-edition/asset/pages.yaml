- img_proc: true
  md: '# SQL Code


    ```

    PROC SQL;

    SELECT SUM((UNITS)) * (UNITCOST)

    AS Total_Purchases FORMAT=DOLLAR12.2

    FROM PURCHASES

    WHERE PRODNUM = 1110 OR

    PRODNUM = 1200 OR

    PRODNUM = 1700;


    QUIT;

    ```


    # Results


    | Total_Purchases |

    | $237,500.00 |


    Data can be summarized down rows (observations) as well as across columns (variables).
    This flexibility gives SAS an incredible range of power, and the ability to take
    advantage of several summary functions that are supplied (or built-in) by SAS.
    These techniques permit the average of quantities across the set of all quantities.
    Without the ability to summarize data in PROC SQL, users would be forced to write
    complex formulas and/or routines, even write and test DATA steps to summarize
    data. Two examples will be illustrated to show how SQL can be constructed:


    +   - Summarizing data down rows

    - Summarizing data across columns


    Summarizing Data Down Rows

    The SQL procedure can be used to produce a single aggregate value by summarizing
    data down rows (or observations). The advantages of using a summary function in
    PROC SQL is that it will generally compute the aggregate quicker than if a user-defined
    equation was constructed, and it saves the effort of constructing and testing
    a program containing the user-defined equation in the first place. Suppose you
    want to know the average cost for all software in the PRODUCTS table containing
    a variety of products. The following query computes the average product cost and
    produces a single aggregate value using the AVG function.


    # SQL Code


    ```

    PROC SQL;

    SELECT AVG(PROCOST) AS

    AVERAGE_PRODUCT_COST FORMAT=DOLLAR10.2

    FROM PRODUCTS

    WHERE UPCASE(PROTOTYPE) IN

    ("SOFTWARE");


    QUIT;

    ```'
