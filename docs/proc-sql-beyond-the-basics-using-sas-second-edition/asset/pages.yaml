  md: '# 236 SQL: Beyond the Basics Using SAS, Second Edition


    Note: When you create a join without a WHERE clause, you are creating an internal,
    virtual table called a Cartesian product. This table can be extremely large because
    it represents all possible combinations of rows and columns in the joined table.


    # DATA Step Merges versus PROC SQL Joins


    The purpose of this section is to explain the differences (and similarities) between
    DATA step merges and PROC SQL joins. The reason for addressing this topic is that
    over the years questions have been asked about which approach is superior, inferior,
    faster, slower, worse, easier, harder, more efficient, less efficient, demanding
    on a programmer''s time, more supportable, less supportable, etc. My usual report
    mentions, "Only you and your organization will be able to answer this question
    completely, and here''s why."


    Besides the obvious syntax and implementation methods for the merge using a DATA
    step construct and the join using a procedure supplied by SAS, both approaches
    achieve essentially the same results. In fact, both approaches produce one-to-one,
    one-to-many, many-to-one, and many-to-many matched combinations. Table 7.1 provides
    a few considerations that SAS and SQL user should ask and answer before deciding
    which approach is most appropriate to use.


    # Table 7.1: Merge versus Join Features/Considerations


    | Features / Considerations | DATA Step Merge | PROC SQL Join |

    |---|---|--|\| Is there a limit to the number of data sets (or tables) that can
    be processed, other than disk space? | No | Yes (Limit of 256 tables) |

    | Is the code portable to other database implementations? | No | Yes |

    | Is the approach a standardized method for specifying database requests? | No
    | Yes |

    | Does sort need to be performed for processing BY-groups? | Yes | No |

    | Is a common variable name required when combining data sets (or tables)? | Yes
    | No |

    | When combining data sets (or tables) are the duplicate matching column automatically
    overlaid? | Yes | No |

    | Are the results automatically printed after combining data sets (or tables)?
    | No | Yes |


    # Types of Complex Queries


    The SQL procedure supports a number of complex query constructs (sometimes referred
    to as join types). From inner joins to left, right, and outer joins, this procedure
    provides a comprehensive look at the various forms of SELECT statements that can
    be constructed to manipulate


