  md: '# Summary


    +   1. Views are not tables and consequently do not store data (see the “Views—Windows
    to Your Data” section).


    +   2. Views access one or more underlying tables (base tables) or other views
    (see the “Views—Windows to Your Data” section).


    +   3. Views improve the change control process when constructed as a “common”
    set of routines (see the “Views—Windows to Your Data” section).


    +   4. Views eliminate or reduce data redundancy (see the “Eliminating Redundancy”
    section).


    +   5. Views hide unwanted or sensitive information while displaying specific
    columns and rows (see the “Restricting Data Access—Security” section).


    +   6. Views shield users from making logic and/or data errors (see the “Hiding
    Logic Complexities” section).


    +   7. Nesting views too deeply can produce unnecessary confusion and maintenance
    difficulties (see the “Nesting Views” section).


    +   8. Updatable views add, modify, or delete rows of data (see the “Updatable
    Views” section).


    +   9. Views can be deleted when no longer needed (see the “Deleting Views” section).'
