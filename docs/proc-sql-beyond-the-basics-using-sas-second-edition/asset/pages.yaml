    # Inserting Text and Constants between Columns


    At times, it is useful to be insert text/or constants in query output. This enables
    special characters symbols and comments to be inserted in the output. We can improve
    the output in the previous example by inserting a comma ", and a single blank
    space between the city name and manufacturer state information. The final output
    illustrates an acceptable way to display column data using “free-floating” presentation
    as opposed to fixed columns.


    # SQL Code


    ```

    PROC SQL;

    SELECT trim(manucity) || '' , '' || manustat

    As Headquarters

    FROM MANUFACTURERS;

    QUIT;

    ```'
