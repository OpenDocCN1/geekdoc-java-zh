    # Validating Columns with a CHECK Constraint


    A CHECK constraint validates data against a list of values, minimum and maximum
    values, as well as a range of values before populating a table. Using either CREATE
    or ALTER TABLE statement, you can apply a CHECK constraint to any column that
    requires validation to be performed. In the next example, suppose you want to
    validate data in the PROTOTYPE (Product Type) column in the PRODUCTS table. When
    you specify a CHECK constraint against the PRODTYPE column using the ALTER statement,
    product type values will first need to match the list of defined values or the
    rows will be rejected.


    # SQL Code


    ```

    PROC SQL;

    ALTER TABLE PRODUCTS

    ADD CONSTRAINT CHECK_PRODUCT_TYPE

    ```


