    # Documented PROC SQL Options and Statement


    This section illustrates examples of widely used and documented troubleshooting
    and debugging SQL options along with the RESET statement. A description and a
    working example of each option are presented below.


    # FEEDBACK/NOFEEDBACK Option


    The FEEDBACK option displays additional documentation with SELECT queries. When
    specified, this option expands a SELECT * (wildcard) statement into a list of
    columns that it represents by displaying the names of column in the underlying
    table(s) as well as resolved macro values and variables. The column display of
    a SELECT * statement is determined by the order defined in the table''s record
    descriptor.


    The following example illustrates the FEEDBACK option. Because a SELECT statement
    does not automatically display the columns it represents, it is important to display
    the individual column names by specifying the FEEDBACK option. This becomes particularly
    useful for determining whether a desired column is present in the output and available
    for documentation purposes. The results of the expanded list of columns are displayed
    in the SAS log.


    # SQL Code


    ```

    PROC SQL FEEDBACK;

    SELECT *

    FROM PRODUCTS;

    QUIT;

    ```'
