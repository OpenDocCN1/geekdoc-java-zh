    # Creating a Table using the LIKE Clause


    Referencing an existing table in a CREATE TABLE statement is an effective way
    of creating a new table. In fact, it can be a great time-saver, because it prevents
    having to define each column one at a time with column-definition lists. The LIKE
    clause (in the CREATE TABLE statement) triggers the existing table structure to
    be copied to the new table minus any columns dropped with the KEEP= DROP data
    set (table) option. It copies the column names and attributes from the existing
    table structure to the new structure. To illustrate this method of creating a
    new table, a table called HOT_PRODUCTS will be created with the LIKE clause.


    # SQL Code


    ```

    PROC SQL;

    CREATE TABLE HOT_PRODUCTS

    LIKE PRODUCTS;

    QUIT;

    ```


    # SAS Log Results


    ```

    PROC SQL;

    CREATE TABLE HOT_PRODUCTS

    LIKE PRODUCTS;

    NOTE: Table HOT_PRODUCTS created, with 0 rows and 5 columns.

    QUIT;

    NOTE: PROCEDURE SQL used:

    real time 0.00 seconds

    ```'
