    \ for each product in the PRODUCTS table.\n\n# SQL Code\n\n```\nPROC SQL;\nSELECT\
    \ PRODNUM,\n  P.PRODNUM,\n  CASE WHEN SUBSTR(PUT(P.PRODNUM, 4.),1,1) = '1' THEN\n\
