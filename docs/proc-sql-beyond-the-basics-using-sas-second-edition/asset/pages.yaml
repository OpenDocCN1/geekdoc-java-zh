  md: 'from occurring. Specific types of referential integrity constraints and constraint
    action clauses are used to enforce update and delete operations and consist of
    the following:


    # Referential Integrity Constraints


    +   - Primary key

    - Foreign key


    # Referential Integrity Constraint Action Clauses


    +   - RESTRICT (Default)

    - SET NULL

    - CASCADE


    The action clauses are discussed in the "Establishing a Foreign Key" section in
