  md: '# Introduction


    Previous chapters provided tables in the examples that had already been created
    and populated with data. But if you need to create a table, populate it with data,
    or delete rows of data or tables that are no longer needed or wanted?


    In this chapter, the discussions and examples focus on the way tables are created,
    populated, and deleted. These are important operations and essential elements
    of PROC SQL, especially if you want to increase your understanding of PROC SQL
    processes and improve your understanding of this powerful language.


    # Creating Tables


    An important element in table creation is table design. Table design incorporates
    how tables are structured—how rows and columns are defined, how indexes are created,
    and how columns refer to other columns. If you seek a greater understanding in
    this area, then review the many references identified at the end of this book.
    The following overview should be kept in mind during the table design process.


    When building a table it is important to devote adequate time to planning its
    design as well as understanding the needs that each table needs to satisfy. This
    process involves a number of activities such as requirements and feasibility analysis,
    including cost/benefit of the proposed tables, the development of a logical description
    of the data sources, and physical implementation of the logical model. Once these
    tables are complete, you can assess any special requirements that each table needs
    to provide. A business assessment helps by minimizing the number of changes required
    to a table once it is created.


    Next, determine what tables will be incorporated into your application''s database.
    This requires understanding the value that each table is expected to provide.
    It also prevents a table of little or no importance from being incorporated into
    a database. The final step and one of critical importance is to define each table''s
    columns, attributes, and contents.


    Once the design process is complete, each table is ready to be created with the
    CREATE TABLE statement. The purpose of creating a table is to create an object
    that does not already exist. In the SAS implementation, three variations of the
    CREATE TABLE statement can be specified depending on your needs:


    +   * Creating a table using column-definition lists

    * Creating a table using the LIKE clause

    * Deriving a table and data from an existing table'
