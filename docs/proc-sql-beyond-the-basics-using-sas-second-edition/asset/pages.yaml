    # _METHOD and _TREE Options with MSGLEVEL=I


    As a troubleshooting and debugging tools, PROC SQL supports the _METHOD and _TREE
    options. These are extremely useful for understanding the hierarchy of processing
    methods selected by the SQL optimizer and the internal form of the query plan,
    respectively. To help users understand the specific codes that are generated and
    displayed in the SAS log from the _METHOD option, a table of codes with a brief
    description appears in Table 9.4.


    When combined with the _METHOD and _TREE options, the MSGLEVEL=I system displays
    additional messages in the SAS log that permit to index usage, merge processing,
    and sort utility used.


    Table 9.4: Codes That Are Generated and Displayed in the SAS Log from the _METHOD
    Option


    | Code | Description |

    | --- | --- |

    | SQXCRTA | Create table as Select. |

    | SQXSCT | Select statement or cluset. |

    | SQJXSL | Step loop join (Cartesian). |

    | SQXJM | Merge join operation. |

    | SQXNDX | Index join operation. |

    | SQXJHSH | Hash join operation. |

    | SQSORT | Sort operation. |

    | SQSRC | Source rows from table. |

    | SQXFIL | Rows filtration. |

    | SQXSUMG | Summary stats (aggregates) with GROUP BY clause. |

    | SQXUMN | Summary stats with no GROUP BY clause. |


    # SQL Code


    ```

    OPTIONS MSGLEVEL=I;

    PROC SQL METHOD _TREE;

    SELECT sum(inventory.invqty)

    AS Products_Ordered_Before_09012000

    FROM PRODUCTS

    P,

    INVOICE I,

    CUSTOMERS C,

    INVENTORY I12

    ```'
