    # Nesting Views


    An important feature of views is that they can be based on other views. In fact,
    there isn''t a limit to the number of view layers that can be defined. Because
    of these, views can be a very convenient and flexible way for programmers to retrieve
    information. Although the number of views that can be nested is virtually unlimited,
    programmers should care about nesting views too deeply. Performance-related and
    maintenance-related issues can result, especially if the views are built many
    layers deep.


    To see how views can be based on other views, two views will be created—one view
    references the PRODUCTS table and the other view references the INVOICE table.
    In the first example, WORKSTATION_PRODUCTS_VIEW includes only products that are
    related to workstations and EXCLUDES the manufacturer number. The views produce
    the result displayed


    # SQL Code


    ```

    PROC SQL;

    CREATE VIEW WORKSTATION_PRODUCTS_VIEW AS

    SELECT PRODNUM, PRODNAME, PRODTYPE, PROCOST

    FROM PRODUCTS

    WHERE UPPERCASE(PRODTYPE)="WORKSTATION"

    QUIT;

    ```'
