    # Correlated Subqueries


    In the subexample shown previously, the subquery (inner query) operates independently
    from the main (outer) query. Essentially, the subquery''s results are evaluated
    and used as input to the main (outer) query. This is a common way that subqueries
    execute, it is not the only way SQL allows a subquery to accept one or more values
    from its outer query. Once the results results are then passed to the outer query.
    Subqueries of this variety are called correlated subqueries. The ability to construct
    subqueries in this manner provides a powerful extension to SQL.


    The difference between the subqueries previously discussed and correlated subqueries
    is in the way the WHERE clause is constructed. Correlated subqueries reference
    a column in the subquery with a column in the outer query to determine the rows
    that match or in certain cases don''t match the expression. Suppose, for example,
    that you want to view products in the PRODUCTS table that do not appear in the
    INVOICE table. One way to do this is to construct a correlated subquery.


    In the next example, the subquery compares the product number column in the PRODUCTS
    table with the product number column in the INVOICE table. If at least one is
    found (the product appears in both the PRODUCTS and INVOICE tables), the resulting
    table from the subquery will not be empty, and the NOT EXISTS condition will be
    false. However, if no matches are found, then the subquery returns an empty table
    that results in the NOT EXISTS condition being true, which causes the product
    number, product name, and product type of the current row in the main (outer)
    query to be selected.'
