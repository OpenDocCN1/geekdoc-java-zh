    \ of the results.\n\n# SQL Code\n\n```\nPROC SQL;\nSELECT prodname, prodtype,\
    \ prodcost,\nprodcost * .0775 AS SalesTax\nFORMAT=dollar10.2 LABEL='California\
    \ Sales Tax'\nFROM PRODUCTS P, MANUFACTURER M\nWHERE P.manunum = M.manunum AND\n\
    \    M.manustat = 'CA';\n\t\t\tQUIT;\n```\n\n+   * The ability to perform basic\
