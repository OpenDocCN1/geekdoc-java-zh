    # Adding Data to the Basics Using the Columns in a Row


    It is not uncommon when adding rows to a table to have one or more columns with
    unassigned value. When adding, SQL should be able to handle adding the rows to
    the table as if all of the values were present. But how does SQL handle values
    that are not specified? You will see in the following example that SQL assigns
    values to columns that do not have a value specified. As before, three parameters
    are specified with the INSERT INTO statement: the name of the table, the names
    of the columns in which values are inserted, and the values themselves. Suppose
    that you had to add two rows to the CUSTOMERS table, where two of three columns
    were specified (Customer Number and Customer Name).


