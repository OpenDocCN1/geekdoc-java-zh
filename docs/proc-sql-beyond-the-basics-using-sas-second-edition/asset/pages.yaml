    # Referential Integrity Constraints


    The second type of constraint that is available in the SQL procedure is referred
    to as a referential integrity constraint. Enforced through primary and foreign
    keys between two or more tables, referential integrity constraints are built into
    a database environment to prevent data integrity issues'
