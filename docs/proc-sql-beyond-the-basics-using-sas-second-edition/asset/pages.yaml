  md: '# Integrity Constraints


    The reliability of databases and the data within is essential to every organization.
    Decision-making activities depend on the correctness and accuracy of any and all
    data contained in key applications, information systems, databases, decision support
    and query tools, as well as other critical systems. Even the slightest hint of
    unreliable data can affect decision-making capabilities, accuracy of reports,
    and, in those worst scenarios, loss of user confidence in the database environment.


    Because data should be correct and free of problems, an integral part of every
    database environment is a set of rules that the data should adhere to. These rules,
    often referred to as database-enforced constraints, are applied to the database
    structure itself and determine the type and content of data that is permitted
    in columns and tables.


    By implementing database-enforced integrity constraints, you can dramatically
    reduce data-related problems and additional programming work in applications.
    Instead of coding complex data checks and validations in individual programs,
    you can build database-enforced constraints into the database itself. This can
    eliminate the propagation of column duplication, invalid and missing values, lost
    linkages, and other data-related problems.


    # Defining Integrity Constraints


    You define integrity constraints by specifying column definitions and constraints
    at the time a table is created with the CREATE TABLE statement, or by adding,
    changing, or removing a table''s column definitions with the ALTER TABLE statement.
    The rows in a table are validated against the integrity constraints.


    # Types of Integrity Constraints


    The first type of integrity constraint is referred to as a column and table constraint.
    This type of constraint essentially themselves rules that are applied to a specific
    table or column. The type of constraint is generally specified through one or
    two clauses with their distinct values as follows.


    +   - NOT NULL

    - UNIQUE

    - CHECK


    # Preventing Null Values with a NOT NULL Constraint


    A null value is essentially a missing or unknown value in the data. When unchecked,
    null values can propagate themselves throughout a database. When a NULL appears
    in a mathematical equation, the returned result is also a null or missing value.
    When a NULL is used in a comparison or a logical expression, the returned result
    is unknown. The occurrence of null values presents problems during search, joins,
    and index operations. The ability to prevent the propagation of null'
