  md: "# Complex Comparisons with Searched CASE Expressions\n\nAs described earlier,\
    \ searched CASE expressions provide SQL users with the capability to perform more\
    \ complex comparisons. Combined with logical and comparison operators, CASE expressions\
    \ along with their WHERE clauses provide the capabilities to construct complex\
    \ logic scenarios. In the next example, list of manufacturers and their products\
    \ are displayed using a searched CASE expression to assign a value of 'East' to\
    \ manufacturers in Florida, 'Central' to manufacturers in Texas, 'West' to manufacturers\
    \ in California, and 'Unknown' to all other manufacturers in the MANUFACTURES\
    \ table. Using the manufacturer's state of residence (MANUSTAT) column, a CASE\
    \ expression is constructed to assign the desired value in each row of data. Finally,\
    \ a column heading of Region is assigned to the new column with the AS keyword.\n\
    \n# SQL Code:\n\n```\nSELECT MANUMAME,\n  CASE\n    WHEN MANUSTAT IN ('FL','TX','CA')\
    \ THEN\n      CASE\n        WHEN PROTOTYPE IN ('Laptop', 'Workstation') THEN\n\
    \          'Computer Hardware Manufacturer'\n        ELSE 'Not a Computer Manufacturer'\n\
    \      END\n    ELSE 'Unknown Manufacturer'\n  END AS ManufacturerType,\n  PRODUCT,\n\
    \  PRODUCT\nFROM MANUFACTERS M,\n  PRODUCTS P\nWHERE M.MANUNUM = P.MANUNUM;\n\
    ```\n\nQUIT;"
