    \ time 0.00 seconds\n  system cpu time 0.04 seconds\n  memory 634.09k\nOS Memory\
    \ 6768.00k\nTimestamp 06/03/2012 04:59:57 PM\n```\n\nTo improve UNION performance,\
    \ SQL procedure code can be converted to a single query using OR conditions in\
    \ a WHERE clause. The next example illustrates the previous SQL code being made\
    \ more efficient by converting the UNION to a single query using an OR operator\
    \ in a WHERE clause.\n\n# SQL Code (Efficient)\n\n```\nOPTIONS FULLSTIMER;\nPROC;\n\
    SELECT DISTINCT *\nFROM PRODUCTS\n  WHERE UPCASE (PRODYPE) = 'SOFTWARE' OR\n \
    \ UPCASE (PRODYPE) = 'LAPTOP';\n```\n\nQUIT;\n\n# SAS Log Results\n\n```\nOPTIONS\
    \ FULLSTIMER;\nPROC;\nSELECT DISTINCT *\nFROM PRODUCTS\n  WHERE UPCASE (PRODYPE)\
    \ = 'SOFTWARE' OR\n  UPCASE (PRODYPE) = 'LAPTOP';\n```\n\n```\nQUIT;\nNOTE: PROCEDURE\
