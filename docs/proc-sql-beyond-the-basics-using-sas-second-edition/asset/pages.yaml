    But, what if all the information is not in a single table? And what if the manufacturer
    number for Global Corp is not known? As previously, a join can be constructed
    just as easily as a subquery. A simple inner join is better than a subquery because
    joins can be easier to understand and maintain. In the next example, the manufacturer
