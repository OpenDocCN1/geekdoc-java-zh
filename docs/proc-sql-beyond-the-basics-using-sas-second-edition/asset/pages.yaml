  md: '# Figure 10.1: Venn Diagram


    ![](img/9d3e4d8fa063e50a0c9985e34cf9d6e8_384_0.png)


    For example, the SQL procedure code that represents a UNION first constructs the
    two result sets from each query, merges and sorts the two sets together, and then
    eliminates duplicate rows from the final results.


    # SQL Code (Less Efficient)


    ```

    OPTIONS FULLSTIMER;

    PROC SQL;

    SELECT *

    FROM PRODUCTS

    WHERE UPCASE (PRODYPE) = ''LAPTOP''

    ```


    ```

    UNION

    SELECT *

    FROM PRODUCTS

    WHERE UPCASE (PRODYPE) = ''SOFTWARE'';

    QUIT;

    ```


    # SAS Log Results


    ```

    OPTIONS FULLSTIMER;

    PROC SQL;

    SELECT *

    FROM PRODUCTS

    WHERE UPCASE (PRODYPE) = ''LAPTOP''

    ```


    ```

    UNION

    SELECT *

    FROM PRODUCTS

    WHERE UPCASE (PRODYPE) = ''SOFTWARE'';

    ```'
