    \ |\n| 5004 | 20 | 09/01/2000 |\n| 5001 | 2 | 09/01/2000 |\n\n# Selecting Nonconsecutive\
    \ Valuus\n\nThe IN predicate selects one or more rows on the matching of one or\
    \ more column values in a set of values. The IN predicate creates an OR condition\
    \ between each value and returns a Boolean value of True if column value is equal\
    \ to one or more of the values in the expression list. Although the IN predicate\
    \ can be specified with single column values, it may be less costly to specify\
    \ the \"=\" sign instead. The \"=\" sign is used in the next example rather than\
    \ the IN predicate to select phones from the PRODUCTS table.\n\n# SQL Code\n\n\
    ```\nPROC SQL;\nSELECT\n  PRODNAME,\n  PRODYPE,\n  PROCOST\nFROM PRODUCTS\nWHERE\
    \ UPPERCASE(PRODYPE) = 'PHONE';\nQUIT;\n```\n\n# Results\n\n| Product Name | Product\
    \ Type | Product Cost |\n|---|---|---||\n| AnalogPhone | Phone | $35.00 |\n| DigitalPhone\
    \ | Phone | $175.00 |\n| OfficePhone | Phone | $130.00 |"
