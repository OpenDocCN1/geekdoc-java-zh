    # ERRORSTOP/NOERRORSTOP Option


    The ERRORSTOP option instructs SQL to stop executing statements and continue to
    check syntax in noninteractive or both sessions when an error is encountered.
    Conversely, the NOERRORSTOP option instructs SQL to continue statements when an
    error is encountered and to continue executing. The ERRORSTOP / NOERRORSTOP option
    can be specified as a PROC SQL statement option or in a RESET statement. The next
    example illustrates a CREATE TABLE statement being used incorrectly, and shows
    the SAS log results that are generated when the ERRORSTOP option is specified.


    # SQL Code


    ```

    PROC SQL ERRORSTOP;

    CREATE TABLE SOFTWARE_PRODUCTS AS

    SELECT *

    FROM PRODUCTS

    WHERE PRODTYPE = ''Software'';

    QUIT;

    ```


    As illustrated in the SAS log, the ERRORSTOP option automatically stops executing
    the SQL statements and displays a SAS log message when a syntax error is encountered.'
