    # Delivering Results to the Web


    With the popularity of the Internet, you might find it useful to deploy pieces
    of output on your intranet or website. ODS makes deploying to a web snap. The
    HTML destination creates syntactically correct HTML code to be used with one of
    the leading Internet browsers.


    Four types of files can be produced with the ODS HTML destination:


    +   - body

    - contents

    - page

    - frame


    A unique file name must be assigned to each file that is created with the ODS
    HTML statement. A custom and integrated frame structure is automatically created
    when each file is combined with a frame file. To improve navigation and access
    of information, the web browser automatically places horizontal and vertical scroll
    bars on the generated page if necessary.


    The next example illustrates SQL output being sent to external files using the
    HTML format. The first default listing is closed, and then the HTML format engine
    is opening BODY, CONTENTS, PAGE, and FRAME external files for the routing of SQL
    procedure results. After the SQL procedure executes, the HTML destination is created
    and the default listing is opened.


