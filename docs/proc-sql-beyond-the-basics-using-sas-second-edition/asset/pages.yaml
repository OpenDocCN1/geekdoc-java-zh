    Describing View Definitions

    Because views consist of partially executed instructions, ordinarily you would
    not be able to read the code in a view definition. However, the SQL procedure
    provides a statement to inspect the contents of the executable instructions (stored
    query expression) that are contained within a view definition. Without this capability,
    a view''s underlying instructions (PROC SQL code) would forever remain a mystery
    and would make the ability to modify or customize the query expressions next impossible.
    Whether your job is to maintain or customize a view, the DESCRIBE VIEW statement
    is the way you review the statements that make up a view. Let''s look at how a
    view definition is described.


