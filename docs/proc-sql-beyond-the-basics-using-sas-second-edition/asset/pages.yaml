  md: '# 250 SQL: Beyond the Basics Using SAS, Second Edition


    characters and start with a letter or underscore (see SAS Language Reference:
    Concepts for further details).


    To minimize the number of keystrokes that are needed to reference the tables that
    are specified in a join query, you can assign an alias or temporary table name
    reference to each table. When assigned, arbitrary aliases provide a shortcut method
    to the tables themselves and are in effect for the duration of the query but no
    longer. In the example, the table "P" is assigned to the PRODUCTS table and the
    table "M" is assigned to the MANUFACTERS table in the FROM clause. Table name
    references in the SELECT statement and WHERE clause are made easier as well.


    # SQL Code


    ```

    PROC SQL;

    SELECT prodnum, prodname, prodtype, M.manunum

    FROM PRODUCTS P, MANUFACTERS M

    WHERE P.manum = M.manuman AND nM.maname = ''KPL Enterprises'';


    QUIT;

    ```


    The assignment of the table alias "P" and the table alias "M" in the FROM clause
    provides a shortcut method to refer the longer table names PRODUCTS and MANUFACTERS.


