    Another approach that can improve the way a SET operator performs is to specify
    the ALL key, as long as duplicates are not an issue or the rows in the table are
    all unique. Because the ALL key prevents SQL from processing the data twice and
    does not remove duplicate rows, CPU resources might be improved. The next example
    shows how the UNION coding construct is used to perform what amounts to an append
    operation, bypassing the sort algorithm because the duplicate rows are not removed.


    # SQL Code (Less Efficient)


    ```

    OPTIONS FULLSTIMER;

    PROC SQL;

    SELECT *

    FROM PRODUCTS

    WHERE UPCASE(PRODYPE) = ''LAPTOP''

    ```


    ```

    UNION ALL


    SELECT *

    FROM PRODUCTS

    WHERE UPCASE(PRODYPE) = ''SOFTWARE'';


    QUIT;

    ```


    # SAS Log Results


