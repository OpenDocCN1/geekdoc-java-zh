  md: '# 98 PROC SQL: Beyond the Basics SAS, Second Edition


    the manufacturer city and manufacturer state columns from the MANUFACTERS table
    are concatenated so that the column immediately follows the first. Although the
    two character strings are successfully concatenated, the output illustrates potential
    problems as a result of using the concatenation operator.


    The next example shows that because the first column has a "fixed", lengths are
    automatically padded to the length of the first concatenated column for each row
    of data. As a result of the concatenation operator, the column headers for both
    columns are suppressed. Readers are cautioned that due to the loss of some or
    all of the column header information, a true understanding of the contents of
    the output may be in jeopardy.


