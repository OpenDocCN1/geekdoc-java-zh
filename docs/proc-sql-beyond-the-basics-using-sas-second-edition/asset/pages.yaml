    # Creating and Using Views in SAS


    Views are accessed the same way that tables are accessed. The SQL procedure permits
    views to be used in SELECT queries, subsets, joins, other views, DATA and PROC
    steps. Views can reference other views (as will be described in more detail in
    a later section of this chapter), but the views must ultimately reference one
    or more basing tables.


    The only thing that cannot be done is to create a view from a table that does
    not already exist. When this attempt is attempted, an error message is written
    in the SAS log that indicates the view is being referenced recursively. An error
    occurs because the view that is referenced directly (or indirectly) it cannot
    be located or opened successfully. The next example shows the error that occurs
    when a view called NO_CAN_VIEW is created from a non-existing view by the same
    name in the statement FROM clause.


    # SQL Code


    ```

    PROC SQL;

    CREATE VIEW NO_CAN_DO_VIEW AS

    SELECT *

    FROM NO_CAN_DO_VIEW;

    SELECT *

    FROM NO_CAN_DO_VIEW;

    QUIT;

    ```'
