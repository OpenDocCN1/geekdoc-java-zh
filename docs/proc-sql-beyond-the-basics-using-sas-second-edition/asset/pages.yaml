    # Accessing Rows from the Combination of Two Queries


    The UNION operator preserves all of the unique rows from the combination of queries.
    The result is the same as if an OR operator is used to combine the results of
    each query. Another way, the union of two queries (A and B) represents rows in
    A or in B or both A and B. As illustrated in Figure 7.2, the union represents
    the entire shaded area (A, B, and C).


    # Figure 7.2: Union of Two Queries


    ![](img/9d3e4d8fa063e50a0c9985e34cf9d6e8_296_0.png)


    The UNION operator automatically eliminates duplicate rows from the results, unless
    the ALL keyword is specified as part of the UNION operator. The column names assigned
    to the results are derived from the first query.


    In order for the union of two or more queries, each query must specify the same
    number of columns and same compatible types. Type compatibility means that column
    attributes are defined the same way. Because column names and attributes are derived
    from the first, data types must be of the same type. The data types of the result
    columns are derived from the source table(s).


    To see all products that cost less than $300.00 or products that are classified
    as a workstation, you have a choice between using OR or UNION as shown in the
    next query. As illustrated in the output from both queries, the results are identical
    no matter which query is used.'
