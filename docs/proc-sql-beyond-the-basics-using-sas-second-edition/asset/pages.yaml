  md: "# Finding the Occurrence of a Pattern with INDEX\n\nTo find the occurrence\
    \ of a pattern, the INDEX function can be used. Frequently, requirements allow\
    \ for a column to be searched using a specific character string. The INDEX function\
    \ can be used in the SQL procedure to search for patterns in a character string\
    \ The character string is searched from left to right for the first occurrence\
    \ of the specified value. If the desired string is found, the column position\
    \ of the first character is returned. Otherwise, a value of zero (0) is returned.\
    \ The following arguments are used to search for patterns in a column: the character\
    \ column or expression, and the character string to search for. To find all products\
    \ with the characters \"phone\" in the product name (PRODNAME), the following\
    \ code can be specified:\n\n```\nPROC SQL;\nSELECT PRODNAME,\nPRODTYPE\nFROM PRODUCTS\n\
    WHERE INDEX(PRODNAME, 'phone') > 0;\n\nQUIT;\n```\n\n# SAS Log Results\n\n| PROC\
    \ SQL;\n| SELECT PRODNAME,\n PRODTYPE\n FROM PRODUCTS\n WHERE INDEX(PRODNAME,\
    \ 'phone') > 0; |\n| NOTE: No rows were selected.\n| QUIT; |\n\n# Analysis\n\n\
    As in the DATA step, no rows were selected because the search is case sensitive\
    \ and \"phone\" is specified as lowercase characters.\n\n# Changing the Case in\
    \ a String\n\nSAS provides two functions that enable you to change the case of\
    \ a string's characters: LOWERCASE and UPPERCASE. The LOWERCASE function converts\
    \ all of the characters in a string or expression to lowercase characters. The\
    \ UPPERCASE function converts all of the characters in a string or expression\
    \ to uppercase characters.\n\nGetting back to the previous example, the results\
    \ of the search were negative even though the character string \"phone\" appeared\
    \ multiple times in more than one. In order to make the search recognize all possible\
    \ lower- and uppercase variations of the word \"phone,\" the search criteria in\
    \ the WHERE clause could be made \"smarter\" by combining an UPCASE function with\
    \ the INDEX function as follows."
  merge: -1
