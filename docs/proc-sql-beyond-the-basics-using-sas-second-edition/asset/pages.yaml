    # Creating a Customized List with a Simple CASE Expression


    A customized display and order can be coded using a simple CASE expression in
    the SELECT and ORDER BY clause. The following example illustrates a unique way
    to create a list of products and availability by coding individual CASE logic
    for each product in the PRODUCTS table. The resulting output displays a value
    of "1" to indicate that it contributed to the output list, or a value of "0" to
    indicate that it did not contribute to the output list.


    # SQL Code


    ```

    OPTIONS LS=120;

    PROC SQL;

    SELECT PRONAME,

    PRODCOST,

    CASE PRODTYPE WHEN ''Laptop'' THEN 1 ELSE 0 END

    AS LaptopRequest,

    CASE PRODTYPE WHEN ''Workstation'' THEN 1 ELSE 0 END

    AS WorkstationRequest,

    CASE PRODTYPE WHEN ''Phone'' THEN 1 ELSE 0 END

    AS PhoneRequest,

    CASE PRODTYPE WHEN ''Software'' THEN 1 ELSE 0 END

    AS SoftwareRequest

    FROM PRODUCTS

    ORDER BY CASE PRODTYPE WHEN ''Laptop'' THEN 1 ELSE 0 END,

    CASE PRODTYPE WHEN ''Workstation'' THEN 1 ELSE 0 END,

    CASE PRODTYPE WHEN ''Phone'' THEN 1 ELSE 0 END,

    CASE PRODTYPE WHEN ''Software'' THEN 1 ELSE 0 END;

    QUIT;

    ```'
