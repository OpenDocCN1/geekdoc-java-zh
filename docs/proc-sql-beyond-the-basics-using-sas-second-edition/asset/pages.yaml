    Purchase_Amount < 1000 THEN 'Small Purchase'\nWHEN CALCULATED\nPurchase_Amount\
    \ BETWEEN 1000 AND 7500 THEN 'Average Purchase'\nWHEN CALCULATED\nPurchase_Amount\
