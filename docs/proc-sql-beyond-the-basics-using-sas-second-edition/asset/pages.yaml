    # Producing a Row Number


    A undocumented, unsupported feature for producing a row (observation) count can
    be obtained with the MONOTONIC() function. Similar to the row numbers produced
    and displayed in the PRINT procedure (without the NOBS option specified), the
    MONOTONIC() displays row numbers, too. The MONOTONIC() function automatically
    creates a column (variable) in the output results or a new table. This is an undocumented
    feature and is not supported in the SQL procedure, users are advised to use care
    when using the MONOTONIC() function because it is possible to obtain duplicate
    or missing values. The next example illustrates the creation of a row number using
    the MONOTONIC() function in a SELECT statement.


    # SQL Code


    ```

    PROC SQL;

    SELECT MONOTONIC() AS Row_Number FORMAT=COMMA6,

    PRODNUM,

    UNITS;

    ```


