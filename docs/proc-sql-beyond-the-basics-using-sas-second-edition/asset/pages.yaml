  md: '# Chapter 6: Modifying and Updating Tables and Indexes 227


    A result of 0.4 (4 distinct values / 10 total rows) represents low cardinality
    as well as less good selectivity. Consequently, this column might not be an ideal
    candidate for an index because a sequential table scan can be a more efficient
    way to process rows in a table.


    Note: A column''s selectivity should be recalculated from time-to-time because
    row inserts, updates, and deletions change the selectivity ratio.


    # Defining Indexes


    When defining an index, first understand the purpose the index is to serve. An
    important thing to remember about indexes is that they should be created when
    absolutely necessary. Too many or unnecessary indexes use up compute resources
    and impede performance. Although the typical index takes up less space than required
    by the table itself, it represents a copy of a table, and therefore requires storage
    space to store its contents. For this reason, care should be used when deciding
    when and what to create.


    To determine when indexes are necessary, consider existing data as well as the
    way the table(s) will be used. Accent with queries classified as mission critical
    and/or essential to the success of the organization or process. Then, determine
    how the data is dispersed (or the variability of the data) in the underlying table(s)
    using analytical tools such as the FREQ procedure.


    If an index is used to specify some order within a table, such as manufacturer
    or product number in the PRODUCTS table, you should fully assess what the impact
    of that index will be.


    Sometimes the column making an index is obvious, and others are not. An index
    should provide the greatest flexibility so that every column in a table can be
    accessed and retrieved. Improvements with query results can also be achieved by
    assigning indexes to the most discriminating columns in a table (or columns that
    have many unique values), as well as the columns that are used regularly in queries.


    When an index is specified for one or more tables, a join process might actually
    process faster. The SQL optimizer might decide to use an index when certain conditions
    permit it. Here are a few things to consider prior to creating an index:


    +   - If the table is small, sequential processing might be as fast as, faster,
    than processing with an index.

    - If the page count, as displayed in the CONTENTS procedure, is less than three
    pages, then an index might serve little or no value.

    - Avoiding creating more indexes than are absolutely necessary.

    - If the dataset for the index is large, then sequential access might be more
    efficient than using the index.

    - If the percentage of matches is approximately 15% or less (referred to as the
    15% rule) of the overall population, then index usage might be beneficial.


    Lafler, Kirk Paul. PROC SQL: Beyond the Basics Using SAS[]; Second Edition. Copyright
    2013, SAS Institute, Inc., Cary, North Carolina, USA. ALL RIGHTS RESERVED. For
    additional SAS resources, visit support.sas.com/bookstore.'
  merge: -1
