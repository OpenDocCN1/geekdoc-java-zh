  md: '# Chapter 2: Working with Data in PROC SQL


    # Dictionary.CATALOG


    Detailed information about catalogs and their members is quick and easy with the
    CATALOGS dictionary table. You will be able to capture an ordered list of catalog
    information by member name object type and description, created and last modified,
    and object alias from any SAS library. For example, the following code produces
    a list of the catalog objects in the SASUSER library.


    Note: Because this dictionary table produces a considerable amount of information,
    users are advised to specify a WHERE clause when using.


    # SQL Code


    ```

    PROC SQL;

    SELECT *

    FROM DICTIONARY.CATALOG

    WHERE NAME="SASUSER";

    QUIT;

    ```


