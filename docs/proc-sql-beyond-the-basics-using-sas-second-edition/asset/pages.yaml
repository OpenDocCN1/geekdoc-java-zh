    # Deleting Multiple Tables


    The SQL standard also permits more than one table to be specified in a single
    DROP TABLE statement. The next example and recording log shows two tables (HOT_PRODUCTS
    and NOT_SO_HOT_PRODUCTS) being deleted from the WORK library.


