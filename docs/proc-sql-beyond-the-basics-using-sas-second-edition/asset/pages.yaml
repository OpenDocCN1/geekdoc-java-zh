    \ should be used as a first line of defense against potential problems that result\
    \ from the presence of null values and the interaction of queries processing data.\n\
    \nUsing the CREATE TABLE or ALTER TABLE statement, you can apply a NULL constraint\
    \ to any column where unknown, or inappropriate values appear in the data. Suppose\
    \ that you need to avoid the propagation of missing values in the CUSTCITY (Customer’s\
    \ Home City) column in the CUSTOM_CITY table. By specifying the NOT NULL constraint\
    \ for the CUSTCITY column in the CREATE TABLE statement, you prevent the propagation\
    \ of null values in a table.\n\n# SQL Code\n\n```\nPROC SQL;\n   CREATE TABLE\
    \ CUSTOMER_CITY\n   CUSTNUM NUM,\n   CUSTCITY CHAR(20) NOT NULL);\n\nQUIT;\n```\n\
