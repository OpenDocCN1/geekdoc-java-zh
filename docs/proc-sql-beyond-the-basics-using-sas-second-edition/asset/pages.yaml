  md: '# Chapter 2: Working with Data in PROC SQL 43


    The UPDATE statement does not automatically produce any output except for the
    log messages that are based on the operation results itself. To illustrate the
    use of DATA step functions and operators in the SQL procedure, the next example
    shows a SCAN function that isolates the first piece of information from product
    name (PRONAME), a TRIM function to removing blanks from product type (PRODTYPE),
    and a concatenation operator "|" that concatenates the first character expression
    with the second. It should be noted that care should be exercised when using the
    SCAN function because it returns a 200-byte string.


    # SQL Code


    ```

    PROC SQL;

    UPDATE PRODUCTS

    SET PRONAME = SCAN(PRONAME, 1) || TRIM(PRODTYPE);

    QUIT;

    ```


    # SAS Log Results


    PROC SQL;

    UPDATE PRODUCTS

    SET PRONAME = SCAN(PRONAME, 1) || TRIM(PRODTYPE);

    NOTE: 1 rows were updated in PRODUCTS.

    QUIT;


    Optional WHERE clause can be specified to limit the number of rows to which modifications
    will be applied. The next example illustrates using a WHERE clause to restrict
    the number of rows that are updated in the previous example to "phone," excluding
    all the other rows.


    # SQL Code


    ```

    PROC SQL;

    UPDATE PRODUCTS

    SET PRONAME = SCAN(PRONAME, 1) || TRIM(PRODTYPE)

    WHERE PRODTYPE IN (''Phone'');

    QUIT;

    ```


