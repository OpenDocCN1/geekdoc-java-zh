    # Indexes


    In database systems, an index is a data structure used to locate specific rows
    of data in a table. A keyword or other identifier is used by the index to search
    for specific rows of interest. To better understand what an index is, it is useful
    to make an index that is located at the end of a book. In its pure form, the book''s
    index contains keywords that are listed in alphabetical order along with the corresponding
    page numbers displayed in ascending order, as shown in Figure 6.1.

    An index is typically made to enable readers to skip to different pages or locations
    in a book. It is worth mentioning that the return value has intrinsic value; the
    keyword and page number correctly accesses the desired page(s) of interest. A
    more traditional approach to reading a book is a page-by-page sequential manner.
    These different approaches are often referred to as direct versus sequential access,
    respectively.


    Figure 6.1: Keyword Index in Book


    # Index


    ![](img/9d3e4d8fa063e50a0c9985e34cf9d6e8_244_0.png)


    Lafler, Kirk Paul. PROC SQL: Beyond the Basics Using SAS®; Second Edition. Copyright
    2013, SAS Institute, Inc.–Cary, North Carolina, USA. ALL RIGHTS RESERVED. For
    additional SAS resources, visit support.sas.com/bookstore.'
