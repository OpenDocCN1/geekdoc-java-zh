  md: '# Chapter 1: Designing Database Tables 9


    Applying a set of rules to the database structure and content can ensure the integrity
    of data resources. These rules consist of table and column constraints, and will
    be discussed in detail in Chapter 5, "Creating, Populating, and Deleting Tables."


    # Referential Integrity


    Referential integrity refers to the way in which database tables handle update
    and delete requests. Database tables function a primary key where one or more
    columns have a unique value which rows in a table can be identified and selected.
    Other tables may have one or more columns called a foreign key that are used to
    connect to some other table through it. Database designers frequently apply rules
    to database tables to control what happens when a primary key changes and its
    effect on one more foreign key values in other tables. These referential integrity
    rules apply restrictions on the data that may be updated or deleted in tables.


    Referential integrity ensures that rows in one table have corresponding rows in
    another. This prevents lost linkages to data elements in one table and those of
    enabling the integrity of data to be maintained. Using the 3NF tables defined
    earlier, a foreign key called CUSTOM can be defined in the PURCHASES table that
    corresponds to the primary key CUSTOM column in the CUSTOMERS table. Users are
    referred to Chapter 5, "Creating, Populating, and Deleting Tables" for more details
    on assigning referential integrity constraints.


