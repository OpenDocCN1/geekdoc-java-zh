  md: "PROC SQL: Beyond the Basics Using SAS, Second Edition\n\n# Nesting Simple CASE\
    \ Expressions\n\nMuch has been written on the techniques associated with software\
    \ construction, particularly about aspects related to program and/or code design.\
    \ When discussions of program complexity arise, it is widely accepted that a program's\
    \ degree of complexity can be reduced by dividing its solution into smaller pieces\
    \ or parts. This rule of thumb is perhaps best discussed in Steve McConnell's\
    \ book, Code Complete: A Practical Handbook of Software Construction, Second Edition\
    \ (2004), \"Humans tend to have an easier time comprehending simple pieces of\
    \ information than one complex piece.\"\n\nAlthough many design strategies exist\
    \ to improve the process of program design, one strategy frequently mentioned\
    \ is the process of nesting. Nesting involves converting complex and cumbersome\
    \ logic scenarios into simpler logic conditions. The primary objective is to improve\
    \ a program's maintainability and reliability. This rule of thought is perhaps\
    \ further reinforced by the SQL's procedure for nesting using a CASE expression\
    \ construct.\n\nNesting can be a useful technique that provides SQL users with\
    \ an effective way to handle complex code. By, unnecessary nesting or nesting\
    \ for the sake of nesting can actually make code more difficult to comprehend\
    \ and maintain. It's my experience that nesting should never exceed three or four\
    \ levels deep. Anything more than that and the degree of complexity can increase\
    \ significantly. The general rule is to develop code that's not only easy to understand,\
    \ but hopefully fewer errors. To illustrate the process of nesting, a simple CASE\
    \ expression is nested two levels deep for identifying software products in the\
    \ PRODUCTS table that cost less $300.00.\n\n# SQL Code\n\n```\nPROC SQL;\nSELECT\
    \ PRONAME,\n  PRODTYPE,\n  PROCOST,\n  CASE PRODTYPE\n    WHEN 'Software' THEN\n\
    \      CASE\n        WHEN PROCOST < 300 THEN 'Match'\n        ELSE 'No Match'\n\
    \      END\n    ELSE 'Not Software'\n  END AS Product_Type_Cost\nFROM PRODUCTS;\n\
    ```\n\nQUIT;\n\nLafler, Kirk Paul. PROC SQL: Beyond the Basics Using SAS; Second\
    \ Edition. Copyright 2013, SAS Institute, Inc.\nary, North Carolina, USA. ALL\
    \ RIGHTS RESERVED. For additional SAS resources, visit support.sas.com/bookstore."
