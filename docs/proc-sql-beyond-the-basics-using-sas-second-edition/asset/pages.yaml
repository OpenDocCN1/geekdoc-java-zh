- img_proc: true
  md: '# Grouping and Performance


    As with the ORDER BY clause, processes such the GROUP BY clause can also impact
    the speed of a query. Because the GROUP BY clause can trigger sort processing,
    much of what was discussed with the ORDER BY clause also applies. In addition,
    it is recommended that you avoid redundant columns by keeping the number of columns
    to a minimum.


    # Splitting Tables


    Splitting tables involve moving some of the rows from one table to another table.
    Data is split for the purpose of separating predetermined range of data, such
    as historical data from current data, so that query performance is. This reduces
    the burden imposed on queries which only access current data. The next example
    shows the current year''s data being copied and then removed from a table that
    contains five years of data.


    # SQL Code


    ```

    PROC SQL;

    CREATE TABLE INVENTORY_CURRENT AS

    SELECT *

    FROM INVENTORY

    WHERE YEAR (ORDDATE) = YEAR (TODAY());

    DELETE FROM INVENTORY

    WHERE YEAR (ORDDATE) = YEAR (TODAY());

    QUIT;

    ```


    # Indexes and Performance


    Indexes can be used to allow rapid access to table rows. Rather than physically
    sorting a table (as performed by the ORDER BY clause or PROC SORT), an index is
    designed to set up a logical arrangement for the data without the need to physically
    sort it. This has the advantage of reducing CPU, I/O and memory requirements.
    It also reduces access time when WHERE clause processing (which is discussed in
    the "Optimizing WHERE Processing with Indexes" section).


    Indexes are useful, but they do have drawbacks. As data in a table is inserted,
    modified, or deleted, an index must be updated to address the changes. This automatic
    feature requires additional CPU resources to process any changes to a table. Also,
    as a structure in its own right, an index can consume considerable storage space.
    As a consequence, care should be exercised not to create too many indexes. Here
    are a few suggestions for creating indexes:


    +   - Sort data in ascending order on the key column to create the index.

    - Sort data by the key variable first to achieve the greatest performance improvement.'
