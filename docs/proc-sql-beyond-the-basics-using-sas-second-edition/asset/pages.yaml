  md: '# Summary


    +   1. Data Definition Language (DDL) statements provide programmers a way to
    redefine the definition of one or more existing tables (see the “Modifying Tables”
    section).


    +   2. As one or more columns are added to a table, each is automatically added
    at the end of a table’s descriptor record (see the “Adding New Columns” section).


    +   3. To add one more columns in a designated order, the SQL standard provides
    a couple of choices to choose from (see the “Controlling the Position of Columns
    in a Table” section).


    +   4. PROC enables a character column (but not numeric column) to have its length
    changed (see the “Changing a Column’s Length” section).


    +   5. A column’s format and label information can be modified with a MODIFY clause
    (see the “Changing a Column’s Format” and “Changing a Column’s Label” sections).


    +   6. The RENAME= SAS data set option must be used in the FROM clause to rename
    column names (see the “Renaming a Column” section).


    +   7. The DATASETS procedure is the recommended way to rename tables (see the
    “Renaming a Table” section).


    +   8. An index consists of one or more columns to uniquely identify each row
    within a table (see the “Indexes” section).


    +   9. An understanding of the rules of cardinality and how it affects a database
    application can help determine an optimal query plan (see the “Creating a Simple
    Index” section).


    +   10. An index is most effective when it is highly selective (see the “Creating
    a Composite Index” section).


    +   11. Column values in existing rows in a table can be updated with the UPDATE
    statement (see the “Updating Data in a Table” section).'
