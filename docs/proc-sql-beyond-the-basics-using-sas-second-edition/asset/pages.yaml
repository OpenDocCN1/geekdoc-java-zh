    WHERE UPPERCASE(PRODTYPE) = ''PHONE'';

    NOTE: 3 rows were deleted from WORK.PRODUCTS.

    QUIT;

    NOTE: PROCEDURE SQL used:

    real time 0.05 seconds

    ```


    # Deleting All Rows in a Table


    SQL provides a simple way to delete all rows in a table. The following example
    shows that all rows in the CUSTOMERS table can be removed when the WHERE clause
    is omitted. Care when using this form of the DELETE statement because every row
    in the table is automatically deleted.'
