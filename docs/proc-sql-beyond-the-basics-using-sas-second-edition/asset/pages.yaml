  md: "# 180 PROC SQL: Beyond the Basics Using SAS, Second Edition\n\nThe INSERT INTO\
    \ statement can be used as long as a value is keyed for each and every column\
    \ in the table in the exact order that column names are specified in the table.\
    \ Note: Learning the order of a table's columns may require producing output from\
    \ the CONTENTS procedure, and/or inspection of the metadata column, VARNUM, from\
    \ the Dictionary.columns or SASHELP.VCOL. The following example illustrates the\
    \ absence of the table's column names in the INSERT INTO statement as rows of\
    \ data are added using the VALUES clause.\n\n# SQL Code\n\n```\nPROC SQL;\nINSERT\
    \ INTO CUSTOMERS\nVALUES (402, 'La Jolla Tech Center', 'La Jolla')\nVALUES (502,\
    \ 'Alpine Byte Center', 'Alpine')\nVALUES (1702, 'Rancho San Diego Tech', 'Rancho\
    \ San Diego');\n\nSELECT *\nFROM CUSTOMERS\nORDER BY CUSTOM;\n\nQUIT;\n```\n\n\
