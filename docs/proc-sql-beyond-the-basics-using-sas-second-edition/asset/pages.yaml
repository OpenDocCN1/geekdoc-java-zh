    # Ordering Output by Columns


    By definition, tables are unordered sets of data. The data that comes from a table
    does not automatically appear in any particular order. To offset this behavior,
    the SQL procedure provides the ability to impose order in a table using an ORDER
    BY clause. When used, this clause orders the query results according to the values
    in one or more selected columns; it must be specified after the FROM clause.


    Rows of data can be ordered in ascending (default order) or descending (DESC)
    order for each column specified (ascending is the default order). To illustrate
    how selected columns of data can be ordered, let''s view the PRODUCTS table and
    all its columns arranged in ascending order by product number (PRODNUM).


    # SQL Code


    ```

    PROC SQL;

    SELECT *

    FROM PRODUCTS

    ORDER BY prodnum;

    nQUIT;

    ```'
