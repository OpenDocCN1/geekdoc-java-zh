  md: "# Chapter 10: Tuning for Performance and Efficiency 365\n\n```\nUNION ALL\n\
    SELECT *\nFROM PRODUCTS\nWHERE UPCASE(PRODYPE) = 'SOFTWARE';\n\nQUIT;\nNOTE: PROCEDURE\
    \ SQL used (Total process time):\n  real time 0.06 seconds\n  user cpu time 0.00\
    \ seconds\n  system cpu time 0.04 seconds\nmemory 226.4k\nOS Memory 6768.0k\n\
    Timestamp 06/03/2012 05:22:14 PM\n```\n\n# Summary\n\n+   1. Performance tuning\
    \ involves measuring, evaluating, and modifying a query’s execution to achieve\
    \ an optimal balance between competing computer resources (the “Understanding\
    \ Performance Tuning” section).\n\n+   2. Avoid using ORDER BY when creating a\
    \ table or view (see the “Sorting and Performance” section).\n\n+   3. When sorting\
    \ is necessary, specify the SORTPGM= system option to instruct the SAS System\
    \ to use the best possible sort utility relative to the size of the database (the\
    \ “User-Specified Sorting” section).\n\n+   4. It is recommended to keep the number\
    \ of grouping columns with the GROUP BY clause as small as possible (see the “Splitting\
    \ Tables” section).\n\n+   5. Care should be exercised to assign indexes to only\
    \ those discriminating variables in a table and to avoid creating too many indexes\
    \ (see the “Indexes and Performance” section).\n\n+   6. There is no advantage\
    \ in creating or using an index when a table is relatively small (usually fewer\
    \ than three pages) (see the “Reviewing Contents Output and System Messages” section).\n\
    \n+   7. Setting the MSGLEVEL system to “I” allows SAS to display visual information\
    \ (if available) relative to the presence of one or more indexes for optimization\
    \ of WHERE clause processing (the “Reviewing Contents Output and System Messages”\
    \ section).\n\n+   8. Apply WHERE clause processing to restrict the number of\
    \ rows of the result table (see the “Optimizing WHERE Clause Processing with Indexes”\
    \ section).\n\n+   9. When constructing a chain of AND conditions in a WHERE clause,\
    \ specify the most restrictive conditional values first (see the “Constructing\
    \ Efficient Logic Conditions” section)."
