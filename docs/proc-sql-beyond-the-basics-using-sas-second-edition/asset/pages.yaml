    # Joins with More Than Three Tables


    Occasionally, information needs to be extracted from four, five, or more tables
    (up to a maximum of 256 tables). Joins of four or more tables can be constructed
    just like accessing two or three tables. The only difference is the number of
    table references in the FROM clause and the level of complexity in the WHERE clause
    to restrict what rows are kept. Suppose that you want to know, based on invoices,
    the number of products that were ordered before September 1, 2000. One way to
    find this information is to perform a join with four tables.


    # SQL Code


    ```

