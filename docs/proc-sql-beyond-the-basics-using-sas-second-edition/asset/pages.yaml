    # Views and SAS Procedures


    In cases but not all, views can be used just as input DATA sets to the universe
    of available SAS procedures. In the first example, the INVENTORY_VIEW view is
    used as input to the MEANS procedure to produce simple univariate descriptive
    statistics for numeric variables. Accessing the INVENTORY_VIEW view is different
    from accessing the INVENTORY table because the view''s internal compiled executed
    statements are providing current data from the underlying table to the view itself.
    The view statements and the statements from the MEANS procedure determine what
    information is produced.


    The next example uses the INVENTORY_VIEW view as input to the MEANS procedure
    produce simple univariate descriptive statistics for numeric variables. Accessing
    the INVENTORY_VIEW view is different from accessing the INVENTORY table because
    the view derives and provides current data from the underlying table to the view
    itself. The view statements and the statements from the MEANS procedure determine
    what information is produced.


