  md: '# The World of Bugs


    Since the birth of the software industry, software problems (often referred to
    as buggy) have been created by programmers (and) of all skill levels in virtually
    every conceivable form. A bug is something the software or a program does that
    it is not supposed to do. When the software encounters a bug, it can cause the
    software to cease or to misbehave.


    Bugs come in all forms, shapes, and sizes. A problem that occurs when you''re
    using the SQL procedure incorrectly or directly violating the rules of the language
    is referred to as a usage error. The severity of these types of errors depends
    on the nature of the violation as well as the effect on the user. Generally speaking
    though, a usage error results in a syntax error and the stoppage of the program
    or order.


    Other types of bugs can be problematic, Bugs such as resource problems, data dependencies,
    and implementation errors can cause a program step to stop or produce unreliable
    results, which will then display errors or warnings in the SAS log.


    # The Debugging Process


    The debugging process consists of a number of recommended steps to correct an
    identified problem and verify that it does not repeat. The objective is to identify,
    classify, fix, and verify a problem in a PROC SQL step, program, or application
    as quickly and easily as possible. Not every problem requires the application
    of each step recommended in this chapter. Rather, you can pick and choose from
    the suggestions to effectively correct problems and make sure they do not reappear.
    Adher to a methodical and effective debugging process increases the likelihood
    that problems are identified and fixed correctly, thereby expeding and improving
    the way you handle problems.


    To further explore this topic, Effective Methods for Software Testing by William
    E. Perry (Wiley Publishing, 2006) and The Science of Debugging by Matthew A. Telles
    and Yuan Hieh (The Coriolis Group, 2001).


    The debugging process consists of five steps. See Table 9.1.'
  merge: -1
  pgno: 346
- img_proc: true
  md: '# Chapter 9: Troubleshooting and Debugging 325


    | Table 9.1: Debugging Process Steps and Tasks |

    | Debugging Step | Task Description |

    |--- | --- |

    | Problem Identification | 1. Determine if a bug exists in the code.<br>2. Determine
    what the problem is by playing detective.<br>3. Describe why the problem is a
    bug.<br>4. Determine what the code should do.<br>5. Determine what the code is
    doing. |

    | Information Collection | 1. Collect user comments and feedback.<br>6. Collect
    personal observations and symptoms.<br>7. Review SAS log information.<br>8. Collect
    test case(s) that highlight the problem.<br>9. Capture environmental information
    (for example, system settings, operating environment, external elements, etc.).
    |

    | Problem Assessment & Classification | 1. Develop a theory about what caused
    the problem.<br>10. Review the code.<br>11. Classify the problem into one of the
    following categories:<br>- Requirements problem<br>- Syntax error<br>- CPU problem<br>-
    Memory problem<br>- Storage problem<br>- I/O problem<br>- Logic problem |

    | Problem Resolution | 12. Propose a solution.<br>13. Describe why the solution
    will fix the problem.<br>14. Verify that the solution will not cause additional
    problems.<br>15. Fix the problem by implementing the solution. |

    | Validate Solution | 1. Verify whether the problem still exists. Verify whether
    the problem can be recreated or reproduced.<br>16. Determine whether other methods
    can cause the same problem to occur.<br>17. Verify that the solution does not
    cause other problems. |'
  merge: -1
