  md: "# Chapter 7: Coding Complex Queries 237\n\ntransform multiple tables. The SQL\
    \ procedure supports four categories of data relationships:\none-to-one, one-to-many,\
    \ many-to-one, and many-to-many, where each category is classified by\nhow the\
    \ rows in each table relate to one another.\n\nOne-to-one relationships represent\
    \ the simplest of join operations. It's characterized by the tables\nthat have\
    \ a BY-group column with no repeats of BY-values (a unique BY-column) in any of\
    \ the\ntables. It assumes that the rows of each table are in the exact same relative\
    \ order, where the\ncombined result will comprise row in one table with one row\
    \ in two table, two rows in table\none row with two row in table, three rows in\
    \ table with three row in table, and so on\n\nOne-to-many and many-to-one relationships\
    \ are no more complicated than one-to-one\nrelationships, and are easily represented\
    \ by the SQL procedure. These types of relationships are\ncharacterized by one\
    \ table having no repeats of BY-values and the other table having one or more\n\
    repeats of BY-values.\n\nMany-to-many relationships can be a bit more complicated\
    \ than one-to-one, one-to-many,\none-to-many relationships. Many-to-many relationships\
    \ are characterized by all tables having one\nmore repeats of BY-values. There\
    \ are notable advantages of using the SQL procedure to perform\nthese types of\
    \ joins. First, the column names from the source tables do not have to be identically\n\
    amed. Second, pre-sorting the tables is not necessary because the SQL optimizer\
    \ will determine\n any indexes are available (see Chapter 6, \"Modifying and Updating\
    \ Tables and Indexes\")\nor if ordering the data is necessary using an implied\
    \ ORDER BY clause.\n\nAdditional topics include queries and set operations such\
    \ as UNION,\nINTERSECT, and EXCEPT operators. Table 7.2 presents the various types\
    \ of complex queries that\nare available in the SQL procedure.\n\n# Table 7.2:\
    \ Types of Complex Queries\n\n| Query Type | Description |\n|---|---|\n| Cartesian\
    \ Product or Cross Join | A join creates a table that represents all of the combinations\
    \ of rows and columns from two or more tables. It is represented by the absence\
    \ of a WHERE clause. |\n| Inner Joins | A join only retrieves rows with matching\
    \ values from two or more tables (maximum of 256 tables). This type of join is\
    \ referred to as a conventional type of join |\n| Equijoin | A join with an equality\
    \ condition (for example, equal sign \"=\") specified between columns in two or\
    \ more tables. |\n| Non-Equijoin | A join with an inequality condition (for example,\
    \ NE, >, <) specified between columns in two or more tables. |\n| Reflexive or\
    \ Self Join | A join that combines a table with itself. |"
