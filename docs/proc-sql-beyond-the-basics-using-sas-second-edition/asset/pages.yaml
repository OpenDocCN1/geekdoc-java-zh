  md: "# Adding Data to All of the Columns in a Row\n\nAnother way to populate a table\
    \ with data uses a VALUES clause with an INSERT INTO statement. As described in\
    \ the previous section, three parameters are specified with an INSERT INTO statement\
    \ and a VALUES clause: the name of the table, the names of the columns in which\
    \ values are inserted, and the values themselves. Data values are inserted into\
    \ a table with a VALUES clause. Suppose that you want to insert (or add) a single\
    \ row of data to the CUSTOMERS table, and the row consists of three columns (Customer\
    \ Number, Customer Name, and Home City).\n\n# SQL Code\n\n```\nPROC SQL;\n  INSERT\
    \ INTO CUSTOMERS (CUSTNUM, CUSTOMNAME, CUSTCITY)\n  VALUES (703, 'Sonic Boom Analytics',\
    \ 'Spring Valley');\n;IT;\n```\n\nThe SAS log displays the following message noting\
    \ that one row was inserted into the CUSTOMERS table.\n\n# SAS Log Results\n\n\
    PROC SQL;\nINSERT INTO CUSTOMERS\n  (CUSTNUM, CUSTOMNAME, CUSTCITY)\n  VALUES\
    \ (703, 'Sonic Boom Analytics', 'Spring Valley');\nNOTE: 1 row was inserted into\
    \ WORK.CUSTOMERS.\nNOTE: PROCEDURE SQL used:\n  real time 0.54 seconds"
  merge: -1
