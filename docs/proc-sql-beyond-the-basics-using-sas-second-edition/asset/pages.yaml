    # Controlling the Selection and Population of Macro Variables with a WHERE Clause


    Unlike the previous example where little control allowed the rows that are selected
    for processing, a WHERE clause in SELECT clause provides SQL programmers with
    the control they need to select rows for populating macro variables. This effective
    technique allows population of two or more macro variables using an INTO clause,
    the keyword THROUGH or hyphen, and a WHERE clause to control which rows and values
    are selected and populated as macro variables. Suppose that you want to create
    macro variables for the first four ''Software'' products in the PRODUCTS table.
    The INTO clause creates four macro variables and assigns values from the first
    four rows that match the WHERE clause expression. Any rows that do not match the
    WHERE clause are omitted from the results. The ORDER BY clause specified to perform
    an ascending sort on the product name (PRODNAME), and macro resolution results
    are displayed in the SAS log.


    # SQL Code


    ```

    PROC SQL NOPRINT;

    SELECT PRODNAME,

    PROCOST

    INTO :PRODUCT1 - :PRODUCT4,

    COST1 - :COST4

    FROM PRODUCTS

    WHERE PROTYPE = ''Software''

    ORDER BY PRODNAME;

    ```


    ```

    %PUT &PRODUCT1 &COST1;

    %PUT &PRODUCT2 &COST2;

    %PUT &PRODUCT3 &COST3;

    %PUT &PRODUCT4 &COST4;

    ```'
