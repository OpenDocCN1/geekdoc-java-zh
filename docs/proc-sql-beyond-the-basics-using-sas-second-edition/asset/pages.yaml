  md: "# Reflexive or Self Joins\n\nThe final type of inner join is referred to as\
    \ a reflexive join, which is also known as a self join. As its name implies, a\
    \ self join makes an internal copy of a table, and then joins the copy to itself.\
    \ Essentially, a join of this type joins one copy of a table to itself for the\
    \ purpose of exploiting and illustrating comparisons between table values. For\
    \ example, suppose that you want to compare the prices of products side-by-side\
    \ by product type with the less expensive product appearing first (as shown in\
    \ the first three columns of the example results).\n\n# SQL Code\n\n```\nPROC\
    \ SQL;\nSELECT products.prodname, products.prodtype,\n      products.prodcost,\n\
    \      products_copy.prodname, products_copy.prodtype,\n      products_copy.prodcost\n\
    FROM products, PRODUCTS_COPY\nWHERE products.prodtype = \n      products_copy.prodtype\
    \ AND\n      products_copy.prodcost <\n      products_copy.prodcost;\n```\n\n\
    +   - THE PRODUCTS is the primary table that is specified in the FROM clause.\n\
    - A copy of THE PRODUCTS table called PRODUCTS_COPY is joined with the PRODUCTS\
    \ table.\n- THE WHERE clause requests the same type of product to be compared\
    \ side-by-side with the less expensive product appearing first.\n\n# Results\n\
    \n| Product Name | Product Type | Product Cost | Product Name | Product Type |\
    \ Product Cost |\n|---|---|---|---|---|-|\n| Dream Machine | Workstation | $3,200.00\
    \ | Business Machine | Workstation | $3,300.00 |\n| Analog Cell Phone | Phone\
    \ | $35.00 | Office Phone | Phone | $130.00 |\n| Analog Cell Phone | Phone | $35.00\
    \ | Digital Cell Phone | Phone | $175.00 |\n| Office Phone | Phone | $130.00 |\
    \ Digital Cell Phone | Phone | $175.00 |\n| Spreadsheet | Software | $299.00 |\
    \ Database Software | Software | $399.00 |\n| Wordprocessor | Software | $299.00\
    \ | Database Software | Software | $399.00 |\n| Graphics | Software | $299.00\
    \ | Database Software | Software | $399.00 |"
