    \ |\n| Business Machine | Workstation | $3,300.00 |\n| Travel Laptop | Laptop\
    \ | $3,400.00 |\n| Database Software | Software | $399.00 |\n\nPROC SQL also supports\
    \ the use of truncated string comparison operators. These work by first truncate\
    \ the longer string to the same length as the shorter string, and then perform\
    \ the specified comparison. The result of using any of the comparison operators\
    \ has no permanent effect on the strings themselves. List of truncated string\
    \ comparison operators and their meanings appear below.\n\n| Truncated String\
    \ Comparison Operator | Description |\n|--- | --- |\n| EQT | Equal to |\n| GTT\
    \ | Greater than |\n| LTT | Less than |\n| GET | Greater than or equal to |\n\
    | LET | Less than or equal to |\n| NET | Not equal to |\n\n# Logical Operators\n\
    \nLogical operators are used to connect two or more expressions in a WHERE OR\
    \ HAVING clause. The logical operator consists of AND, OR, and NOT. Suppose you\
    \ want to select only those software products that cost more than $300.00. The\
    \ example illustrates how the AND operator is used to ensure that both conditions\
    \ are true.\n\n# SQL Code\n\n```\nPROC SQL;\n  SELECT PRODNAME,\n    PRODTYPE,\n\
