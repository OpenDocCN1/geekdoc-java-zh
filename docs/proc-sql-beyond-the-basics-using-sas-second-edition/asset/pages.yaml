    # Updatable Views


    Once a view has been created from a physical table, it can then be used to modify
    the view''s data of a single underlying table. Essentially, when a view is updated
    the changes pass through the view to the underlying table. A view that is designed
    in this manner is called an upgradable view and can have INSERT, UPDATE, and DELETE
    operations performed into the single table from which it''s constructed.


    Because views are dependent on their data from a base table and have no physical
    existence of their own, you should exercise care when constructing an updatable
    view. Although useful in modifying the rows in a table, updatable views have a
    few limitations that programmers and users should be aware of.'
  merge: -1
  pgno: 334
- img_proc: true
  md: '# Chapter 8: Working with Views 313


    +   - An updatable view can have only one single base table associated with it.
    This means the underlying table cannot be used in a join operation or with any
    set operators. Because an updatable view has each of its rows associated with
    a single row in an updatable table, any operations that involve two or more tables
    will produce an error and result in update operations not being performed.


    +   - An updatable view cannot contain a subquery. A subquery that consists of
    a SELECT statement that is contained inside another statement. This violates the
    rules for updatable views and is not allowed.


    +   - An updatable view can contain a column using a view''s column alias, but
    cannot contain the DISTINCT keyword, have any aggregate (summary) functions, calculated
    columns, or derived columns associated with it. Because these columns are produced
    by an expression, they are not allowed.


    +   - An updatable view can contain a WHERE clause but cannot contain other clauses
    such as ORDER BY, GROUP BY, or HAVING.


    In the remaining sections, three types of updatable views will be examined:


    +   - Views that insert one or more rows of data

    - Views that update existing rows of data

    - Views that delete one or more rows of data from a single underlying table


    # Inserting New Rows of Data


    You can insert new rows of data in a view using the INSERT INTO statement. Suppose
    that you have a view that consists of only software products, called SOFTWARE_PRODUCTS
    VIEW. The PROC SQL code that is used to create this view consists of a SELECT
    statement with a WHERE clause. There are four defined columns: product number,
    product name, product type, and product cost, in that order. When accessed from
    the SAS Windowing environment, the view produces the results displayed.


    # SQL Code


    ```

    PROC SQL;

    CREATE VIEW SOFTWARE_PRODUCTS_VIEW AS

    SELECT prodnum, prodname, prodtype, prodcost

    FORMAT=$DOLLAR.8

    FROM PRODUCTS

    WHERE UPCASE(PRODYPE) IN (''SOFTWARE'');


    QUIT;

    ```


    Lafler, Kirk Paul. PROC SQL: Beyond the Basics Using SAS®, Second Edition. Copyright
    2013, SAS Institute, Inc. Cary, North Carolina, USA. ALL RIGHTS RESERVED. For
    additional SAS resources, visit support.sas.com/bookstore.'
