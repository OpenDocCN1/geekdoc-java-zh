    You might notice after examining the SAS log in the previous example that the
    SELECT statement extracted all rows from the existing table (PRODUCTS) and copied
    them to the new table (HOT_PRODUCTS). In the absence of a WHERE clause, the resulting
    table (HOT_PRODUCTS) identifies the number of rows as the parent table.


    The power of the CREATE TABLE statement then, is in its ability to create a new
    table from an existing table. This is often overlooked in this definition the
    CREATE TABLE statement''s ability to form a subset of a table. More frequently
    than not, a new table represents a subset of its parent table. For reason, this
    method of creating a table is the most powerful and widely used. Suppose that
    you want to create a table called HOT_PRODUCTS that contains a subset of the "Software"
    and "Phones" product types. The following query-expression would accomplish this.


    # SQL Code


    ```

    PROC SQL;

    CREATE TABLE HOT_PRODUCTS AS

    SELECT *

    FROM PRODUCTS

    WHERE UPCASE(PRODTYPE) IN ("SOFTWARE", "PHONE");


    QUIT;

    ```


