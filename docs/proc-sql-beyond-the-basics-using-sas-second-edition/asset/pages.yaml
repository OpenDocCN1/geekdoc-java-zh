  md: 'Chapter 2: Working with Data in PROC SQL 71


    # Testing for the Existence of a Value


    The EXISTS predicate is used to test for the existence of set values. In the next
    example, a subquery is used to check for the existence of customers in the CUSTOMERS
    table with purchases from the PURCHASES table. More details on subqueries will
    be presented in Chapter 7, “Coding Complex Queries."


    # SQL Code


    ```

    PROC SQL;

    SELECT CUSTNUM,

    CUSTNAME,

    CUSTCITY

    FROM CUSTOMERS C

    WHERE EXISTS

    (SELECT *

    FROM PURCHASES P

    WHERE C.CUSTNUM = P.CUSTNUM);

    ```


