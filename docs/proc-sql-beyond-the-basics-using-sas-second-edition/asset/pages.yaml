    Another way of controlling a table''s order is to create a view or virtual table
    (for more information on views, see Chapter 8, "Working with Views") from an existing
    table by specifying the desired order. Using a CREATE VIEW statement and a SELECT
    query, you can construct a new view so that the columns appear in a specific order.
    Essentially, the view contains only the PROC SQL query''s instructions that were
    used to create it. It does not contain data. The biggest advantage of using a
    view to read the columns defined in a table is that a view not only avoids the
    creation of a physical table, but also hides sensitive data from unauthorized
    viewing. In the next example, a new view called INVENTORY_VIEW is created from
    the INVENTORY table with selected columns appearing in specific order.


