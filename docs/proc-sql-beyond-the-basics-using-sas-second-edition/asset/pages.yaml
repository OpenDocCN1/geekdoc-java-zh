- img_proc: true
  md: '# Introduction


    Programmers want and expect to be able to format output in a variety of ways.
    The SQL procedure has forged innovative ways to enhance the appearance of output
    including double-spacing rows of output, concatenating two or more columns, inserting
    text and constants between selected columns, displaying column headers for derived
    fields, and much more. As a value-added feature, the SQL procedure (not part of
    ANSI-standard SQL—see the “Introduction” section of this book) can be integrated
    with the Output Delivery System to enhance and format output in ways that not
    otherwise be available. As you review the many examples in this chapter, the following
    points should be kept in mind:


    # Formatting Output


    As a language, PROC SQL consists of a standard set of statements and options to
    retrieve, alter, transform, and transfer data regardless of the operating system
    or where the data is located. These features provide tremendous power as well
    as control when integrating information from a variety of sources in a number
    of ways. Because emphasis is placed on PROC SQL’s data manipulation capabilities
    and not on its format and output capabilities, many programmers are unfamiliar
    with the SQL procedure’s output-producing nature. Consequently, programmers resort
    to using report writers or special tools to create the best looking output. To
    illustrate the virtues of PROC SQL in SAS, this chapter presents numerous examples
    of how output can be formatted and produced.


    # Writing a Blank Line between Each Row


    The ability to display a blank line between each row of output is available as
    a procedure option in PROC SQL. With the PRINT procedure, specifying DOUBLE in
    the SQL procedure inserts a blank line between each physical row of output (NODOUBLE
    is the default). Setting this option is especially useful when one or more flowed
    lines spans or wraps in the output because it provides visual separation between
    each row of data. This example illustrates using the DOUBLE option to double-space
    output.


    # SQL Code


    ```

    PROC SQL DOUBLE;

    SELECT *

    FROM INVOICE;

    QUIT;

    ```'
