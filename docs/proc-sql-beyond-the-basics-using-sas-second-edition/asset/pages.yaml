    # Cardinality


    In the context of a database table, cardinality refers to the uniqueness, or lack
    thereof, of values contained in a specific column of a table. The cardinality
    of a set of values refers to the uniqueness of a number of elements in a set.
    For example, the set CUSTOM={101, 201, 301, 401 contains four unique elements,
    and a cardinality of four. In contrast, the set PROTOTYPE={Workstation, Laptop,
    Software} contains four elements, three of which are unique, which results in
    a cardinality of three.


    An understanding of the rules of cardinality and how cardinality affects a database
    application can help determine an optimal query plan. Table 6.1 illustrates and
    describes the types of cardinality: low, normal, and high. The cardinality of
    a set becomes higher as the more unique elements are contained in a column. Conversely,
    the lower the cardinality, the more duplicate elements are contained in a column.


    # Table 6.1: Rules of Cardinality


    | Data Values Contain Large Number of Duplicate Values | Data Values Contain Some
    Unique/Some Duplicate Values | Data Values Contain Large Number of Unique Values
    |

    |---|---|---|n| Low cardinality values, if any, unique. Typical examples of column
    values with low cardinality include flags and switches. Columns of this type typically
    contain a larger number of duplicate values and make for poor indexes. | Normal
    cardinality contains a limited number of values. Typical examples of column values
    with normal cardinality include product type, manufacturer, or customer home city.
    Columns of this type generally contain some unique values as well as some duplicate
    values. | High cardinality contains values that are highly unique. Column values
    with high cardinality are used for identification purposes and include invoice
    numbers, or email addresses. Columns of this type generally consist of large numbers
    of unique values and make the best indexes. |


    # Index Selectivity


    An index is most effective when it is highly selective. This means that a column
    with high cardinality (as presented in the previous section) is most selective
    when the ratio of distinct values divided by the number of rows in the table is
    as close to 1 as possible. The selectivity for an index can be quantified as:


    +   - Selectivity = Unique (Distinct) Rows / Total Number Rows


    Note: Perfect selectivity can only be reached on NOT NULL columns.


    Lafler, Kirk Paul. PROC SQL: Beyond the Basics using SAS*; Second Edition. Copyright
    2013, SAS Institute, Inc.

    ary, North Carolina, USA. ALL RIGHTS RESERVED. For additional SAS resources, visit
    support.sas.com/bookstore.'
