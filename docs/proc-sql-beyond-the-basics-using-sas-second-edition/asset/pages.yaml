    \ Spring Valley |\n| 7 | Lafler | Spring Valley |\n\n# Finding the First Nonmissing\
    \ Value\n\nThe first example provides a way to find the first non-missing value\
    \ in a column or list. Specified in a SELECT statement, the COALESCE function\
    \ inspects the arguments from left to right, and returns the first non-missing\
    \ or null-value. If all values are missing, the result is missing. To take advantage\
    \ of COALESCE function, all arguments must be of the same data type. The next\
    \ example illustrates one approach on computing the total cost for each product\
    \ produced from the number of units and unit costs columns in the PURCHASES table.\
    \ if either the UNITS or the UNITCOST column contains a missing value, a zero\
    \ is assigned by the programmer to prevent the propagation of missing values.\n\
    \n# SQL Code\n\n```\nPROC SQL;\nSELECT CUSTOMER,\n       PRODID,\n       UNITS,\n\
    \       UNITCOST,\n       (COALESCE(UNITS, 0) * COALESCE(UNITCOST, 0))\nAS TOTALCOST\
    \ FORMAT=DOLLAR10.2\nFROM PURCHASES;\n\nQUIT;\n```"
