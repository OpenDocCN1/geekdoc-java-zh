    Supose that a product of a particular manufacturer is no longer available and
    has been taken off the market. To handle this type of situation, data values in
    the INVENTORY table should be set to missing once the product is deleted from
    the PRODUCTS table. The next example establishes a foreign key using the PRODNUM
    column in the INVENTORY table and sets values to null with the ON DELETE clause.


    # SQL Code


    ```

    PROC SQL;

    ALTER TABLE INVENTORY

    ADD CONSTRAINT FOREIGN_MISSING_PRODUCT_KEY FOREIGN KEY (PRODNUM)

    REFERENCES PRODUCTS

    ON DELETE NULL;

