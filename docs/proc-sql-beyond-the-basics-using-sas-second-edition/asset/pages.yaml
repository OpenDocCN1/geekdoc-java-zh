  md: "# PROC SQL: Beyond the Basics Using SAS, Second Edition\n\n+   - The costs\
    \ associated with maintaining an index can outweigh its performance value, as\
    \ an index is updated each time in a table is added, deleted, or modified.\n\n\
    Two types of indexes can be defined and used in PROC SQL: simple and composite.\
    \ When a simple index is created, it references only a single column. In contrast,\
    \ a composite index references two or more columns in a table.\n\n# Creating a\
    \ Simple Index\n\nA simple index is specifically defined for one column in a table\
    \ and must be the same name as the column. Suppose that you want to create an\
    \ index that consists of product type (PRODTYPE) in the PRODUCTS table. Once created,\
    \ the index becomes a separate object located in the SAS library.\n\n# SQL Code\n\
    \n```\nPROC SQL;\n  CREATE INDEX PRODTYPE ON PRODUCTS (PRODTYPE);\n  QUIT;\n```\n\
    \n# SAS Log Results\n\nPROC SQL;\n  CREATE INDEX PRODTYPE ON PRODUCTS (PRODTYPE)\n\
    NOTE: Simple index PRODTYPE has been defined.\n  QUIT;\nNOTE: PROCEDURE SQL used:\n\
    \  real time 0.37 seconds\n\n+   1 The index is assigned a name of PRODTYPE, which\
    \ must be the same as the column name.\n2 The PRODTYPE column in the PRODUCTS\
    \ table is designated as the column to be used by index.\n\n# Creating a Composite\
    \ Index\n\nA composite index is specifically defined for two or more columns in\
    \ a table and must have a different name from the column. Suppose that you want\
    \ to create an index that consists of manufacturer number (MANUNUM) and product\
    \ type (PRODTYPE) located in the PRODUCTS table. You should be aware that only\
    \ one composite index is allowed per set of columns, but more than one composite\
    \ index is allowed. The composite index, as the simple index, becomes a separate\
    \ object located in the SAS library.\n\nLaflier, Kirk Paul. PROC SQL: Beyond the\
    \ Basics Using SAS®, Second Edition. Copyright 2013, SAS Institute, Inc.\nary,\
    \ North Carolina, USA. ALL RIGHTS RESERVED. For additional SAS resources, visit\
    \ support.sas.com/bookstore."
