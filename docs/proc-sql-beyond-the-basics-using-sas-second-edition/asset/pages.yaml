    In the next example, the SUM function is specified to sum numeric data types for
    a selected column. Suppose you want to determine the total costs of all purchases
    by customers who bought workstations (PRONUM=1110 and 1200) and laptops (PRONUM=1700).
    You could construct the following query to sum all non-missing values for customers
    who purchased workstations and laptops in the PURCHASES table.'
