    # Equijoins


    The most common form of inner join, which is often referred to as an equijoin,
    uses an equal sign "=" in the WHERE clause to indicate equality between the columns
    in two or more tables. Suppose you want to match products with their corresponding
    manufacturers so that all products from each manufacturer would be listed. An
    equijoin is performed to equate the manufacturer number from tables PRODUCTS and
    MANUFACTERS.


    # SQL Code


    ```

    PROC SQL;

    SELECT prodname, prodcost,

    manufacturers.manunum, manuname

    FROM PRODUCTS, MANUFACTERS

    WHERE products.manunum = manufacturers.manunum;

    ```


    QUIT;


    +   1. The PRODUCTS table is the first table specified in the FROM clause.

    2. The MANUFACTERS table is the second table specified in the FROM clause.

    3. The specification of an equal sign "=" in a WHERE clause between the columns
    in the tables indicates an equality type of join.


