    # Deleting Rows in a Table


    In world of data management, the ability to delete unwanted rows of data from
    a table is as important as being able to populate a table with data. In fact,
    data management activities would be severely hampered without the ability to delete
    rows of data. The DELETE statement and an optional WHERE clause can remove one
    or more unwanted rows from a table, depending on what is specified in the WHERE
    clause.


    # Deleting a Single Row in a Table


    The DELETE statement can be used to remove a single row of data by constructing
    an explicit WHERE clause on a unique value. The construction of a WHERE clause
    to satisfy this form of deletion may require a complex logic construct. Be sure
    to test the expression before applying it to the table to determine whether it
    performs as expected. The following example illustrates the removal of a single
    customer (CUSTOMER) in the CUSTOMERS table by specifying the customer''s name
    in the WHERE clause.


    Lafler, Kirk Paul. PROC SQL: Beyond the Basics Using SAS®, Second Edition. Copyright
    2013, SAS Institute, Inc. Cary, North Carolina, USA. ALL RIGHTS RESERVED. For
    additional SAS resources, visit support.sas.com/bookstore.'
