    # SQLLOOPS Macro Variable


    The SQLLOOPS macro variable displays the number of times that the inner loop is
    processed by the SAS log. To display the contents of the SQLLOOPS macro variable
    in the SAS log, specify a %PUT statement. The following example retrieves software
    products from the PRODUCTS table and displays SAS output with a SELECT statement.
    The %PUT statement displays the number of times the inner loop is processed as
    15 times even though there are only 10 product rows. As a query becomes more complex,
    the number of times the inner loop of the SQL procedure increases proportionally.


    # SQL Code


    ```

    PROC SQL;

    SELECT *

    FROM PRODUCTS

    WHERE PRODYPE=''Software'';

    %PUT SQLGLOBS = &SQLGLOBS;

    QUIT;

    ```


