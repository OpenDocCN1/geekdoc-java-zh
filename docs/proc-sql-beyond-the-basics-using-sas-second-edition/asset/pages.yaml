    # Adding Data with a SELECT Query


    You can also add data to a table using a SELECT query with an INSERT INTO statement.
    A query essentially executes the enclosed query by creating a table and then inserting
    the contents of the query into the target table In the process of populating the
    target table, any columns omitted from the column list are automatically assigned
    missing values.


    In the next example, a SELECT query is used to add a row of data from the PRODUCTS
    table into the SOFTWARE_PRODUCTS table. The designated query controls the insertion
    of data into the target SOFTWARE_PRODUCTS table using a WHERE clause.


    # SQL Code


    ```

    PROC SQL;

    INSERT INTO SOFTWARE_PRODUCTS

    (PRODNUM, PRONAME, PRODTYPE, PROCOST)

    SELECT PRODNUM, PRONAME, PRODTYPE, PROCOST

    FROM PRODUCTS

    WHERE PRODTYPE IN (''Software'') AND

    PROCOST > 300;

    ;

    ```


    The SAS log shows that one row of data was added to the SOFTWARE_PRODUCTS table.


    Lafler, Kirk Paul. PROC SQL: Beyond the Basics Using SAS®; Second Edition. Copyright
    2013, SAS Institute, Inc.

    Cary, North Carolina, USA. ALL RIGHTS RESERVED. For additional SAS resources,
    visit support.sas.com/bookstore.'
