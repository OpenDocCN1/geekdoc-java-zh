    The BETWEEN predicate and OR operator are used together in the next example to
    select products ordered between 1999 and 2000 or where inventories are greater
    than 15. The YEAR function returns the year portion from a SAS date and is used
    as the range of values in the WHERE clause.


    # SQL Code


    ```

    PROC SQL;

    SELECT PRODN,

    INVENQTY,

    ORDDDATE

    FROM INVENTORY

    WHERE YEAR (ORDDDATE) BETWEEN 1999 AND 2000) OR

    INVENQTY > 15;


    QUIT;

    ```


