    # Constructing Efficient Logic Conditions


    Constructing efficient conditions has a direct effect on processing costs. Because
    the SQL optimizer evaluates a series of AND expressions from left to right, a
    chain of AND in the WHERE clause should be specified with the most restrictive
    expression first. In this way, fewer resources are expended by bypassing rows
    that do not satisfy the first conditional value in the WHERE clause. For, the
    SQL query below expend more resources and run slower because the first condition,
    "SOFTWARE", occurs even when products cost more than $99.00.


    # SQL Code (Less Efficient)


    ```

    PROC SQL;

    SELECT *

    FROM PRODUCTS

    WHERE UPCASE(PRODYPE) = ''SOFTWARE'' AND

    PRODCOST < 100.00;

    ```


    For this data, a more efficient way to produce the results as the previous example,
    while reducing CPU resources, is to code the least likely condition first so that
    it appears as shown here.


    # SQL Code (More Efficient)


    ```

    PROC SQL;

    SELECT *

    FROM PRODUCTS

    WHERE PRODCOST < 100.00 AND

    UPCASE(PRODYPE) = ''SOFTWARE'';

    ```


    Another proper uses a series of OR condition equality tests or the IN predicate
    to select rows that match the multiple conditions. Programmers often specify these
    kinds of lists in order of magnitude or alphabetically to make the lists easy
    to read and/maintain. A better and more efficient way is to construct a list of
    lists in the order of the most frequently occurring value to the least frequently
    occurring value.


