    # Processing First, Last, and Between Rows for BY-groups


    Occasionally, SAS users might find that the SQL procedure falls short in its ability
    to offer out a "box" to a SAS programming technique. As a result and out of frustration,
    users abandon their search for a basic SQL solution turn instead of a familiar
    SAS technique or one of the many procedures (which is often the SQL procedure).


    As a case in point, the ability to perform BY-group using a DATA statement by
    identifying FIRST, LAST, and BETWEEN observations is a popular technique with
    SAS users. Unfortunately, an equivalent process using the SQL procedure either
    not exist, or isn''t easy to find. After years of research and learning unsuccessfully
    for an SQL technique that would'
  merge: -1
  pgno: 307
- img_proc: true
  md: '# 286 PROC SQL: Beyond the Basics Using SAS, Second Edition


    emulate this DATA step processing stalwart, I decided to develop a solution of
    my own. The following SQL code emulates the behavior of the FIRST, LAST, and BETWEEN
    processing.


    # SQL Code


    Lafler, Kirk Paul. PROC SQL: Beyond the Basics Using SAS;8; Second Edition. Copyright
    2013, SAS Institute, Inc. Cary, North Carolina, USA. ALL RIGHTS RESERVED. For
    additional SAS resources, visit support.sas.com/bookstore.'
  merge: -1
