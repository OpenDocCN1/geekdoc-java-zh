    Let''s extend the knowledge of equijoins by identifying how much money is tied
    up with products that are manufactured by KPL Enterprises. To accomplish this,
    you need to do two things. First, you need to sum the product cost (PROCOST) column
    all rows that match the WHERE clause. Because the objective is to compute a total
    amount for products that were manufactured by KPL Enterprises, you need to prevent
    duplicate rows from displaying in the results. To prevent duplicate rows, you
    need to use the DISTINCT keyword.


    # SQL Code


    ```

    PROC SQL;

    SELECT DISTINCT (PROCOST) As Total_Cost

    FORMAT=DATLLAR10.2,

    manufacturers.mananum

    FROM PRODUCTS, MANUFACTERS

    WHERE manufacturers.mananum = AND

    manufacturers.maname = ''KPL Enterprises'';

    ```


    The DISTINCT keyword prevents duplicate rows from appearing in the result.


