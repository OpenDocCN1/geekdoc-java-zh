- img_proc: true
  md: "+   - IS NULL\n- IS MISSING\n- LIKE\n- EXISTS\n\n# Selecting a Range of Values\n\
    \nThe BETWEEN predicate is a way of simplifying a query by selecting column values\
    \ within a designated range of values. BETWEEN is equivalent to an AND combination\
    \ of one LE (less than equal) and one GE (greater than equal) conditions; inclusive\
    \ of both endpoints. It is extremely flexible because it works with character,\
    \ numeric, and date values. Programmers can also combine two or more predicates\
    \ with AND or OR operators for more complicated conditions. In the next example,\
    \ a range of products costing between $200.00 and $500.00 inclusively are selected\
    \ from the PRODUCTS table.\n\n# SQL Code\n\n```\nPROC SQL;\n  SELECT PRONAME,\n\
    \         PRODYPE,\n         PROCOST\n  FROM PRODUCTS\n  WHERE PROCOST BETWEEN\
    \ 200 AND 500;\n```\n\n# Results\n\n| Product Name | Product Type | Product Cost\
    \ |\n| SpreadsheetSoftware | Software | $299.00 |\n| DatabaseSoftware | Software\
    \ | $399.00 |\n| WordprocessorSoftware | Software | $299.00 |\n| GraphicsSoftware\
    \ | Software | $299.00 |\n\nIn the next example, products are selected from the\
    \ INVENTORY table that were ordered the years 1999 and 2000. The YEAR function\
    \ returns the year portion from a SAS date value and is used as the range of values\
    \ in the WHERE clause.\n\n# SQL Code\n\n```\nPROC SQL;\n  SELECT PRODNUM,\n  \
    \       INVENTORY,\n         ORDDATE\n  FROM INVENTORY\n```"
  merge: -1
  pgno: 85
