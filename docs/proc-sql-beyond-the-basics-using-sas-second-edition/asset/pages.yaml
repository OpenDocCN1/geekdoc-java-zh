  md: "# Finding the Length of a String\n\nThe LENGTH function is used to obtain the\
    \ length of a character string column. LENGTH returns a number equal to the number\
    \ of characters in the argument. Note that the computed column (LENGTH(PRODNAME))\
    \ has a column header created for it Length specifying the AS keyword. This example\
    \ illustrates using the LENGTH function to determine the length of data values.\n\
    \n# SQL Code\n\n```\nPROC SQL;\n  SELECT PRODNAME,\n         PRODNAME,\n     \
    \    LENGTH(PRODNAME) AS Length\n  FROM PRODUCTS;\nQUIT;\n```\n\n# Results\n\n\
    | Product Number | Product Name | Length |\n|---|---||\n| 1110 | Dream Machine\
    \ | 13 |\n| 1200 | Business Machine | 16 |\n| 1700 | Travel Laptop | 13 |\n| 2101\
    \ | Analog Cell Phone | 17 |\n| 2102 | Digital Cell Phone | 18 |\n| 2200 | Office\
    \ Phone | 12 |\n| 5001 | Spreadsheet Software | 20 |\n| 5002 | Database Software\
    \ | 17 |\n| 5003 | Wordprocessor Software | 22 |\n| 5004 | Graphics Software |\
    \ 17 |\n\n# Combining Functions and Operators\n\nAs in the DATA step, functions\
    \ can be used in the SQL procedure. To modify one or more existing rows in a table,\
    \ the UPDATE statement is used (see Chapter 6, “Modifying and Updating Tables\
    \ and Indexes,” for more details). The UPDATE statement with the SET clause changes\
    \ the contents of a data value (functioning the same way a DATA step assignment)\
    \ by assigning a new value to the column to the left of the equal sign by a constant\
    \ or expression referred to the right of the equal sign."
