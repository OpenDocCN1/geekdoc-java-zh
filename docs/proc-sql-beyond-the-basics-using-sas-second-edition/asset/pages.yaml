  md: '# 282 PROC SQL: Beyond the Basics Using SAS, Second Edition


    ```

    /** ROUTINE......: MANY-TO-ONE **/

    /** PURPOSE......: Produce a many-to-one data relationship **/

    /** using a LEFT OUTER JOIN. **/

    ********************************************************************/

    ncreate table many_to_one as

    select p2.prodnum,

    pl2.prodname,

    pl2.units,

    pl2.unitcost,

    pl.units * pl.unitcost as Total_Cost format=$dollar1.2

    from purchases pl1

    left join

    produccts p2

    on pl1.prodnum=p2.prodnum;

    ********************************************************************/

    /** ROUTINE......: MANY-TO-MANY **/

    /** PURPOSE......: Produce a many-to-many data relationship **/

    /** using the table with the unique key and a **/

    /** lookup table in an EQUIJOIN construct. **/

    ********************************************************************/

    create table many_to_many as

    select pl1.prodnum,

    pl2.prodname,

    pl2.units,

    pl2.unitcost,

    pl2.units * p2.unitcost as Total_Cost format=$dollar1.2

    from purchases pl1,

    np2

    where pl1.prodnum=p2.prodnum;

    ```


