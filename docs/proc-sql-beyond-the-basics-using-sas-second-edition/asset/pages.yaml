  md: "# Chapter 7: Coding Complex Queries 263\n\nWhen the entry query is executed,\
    \ SQL first evaluates the inner query (or subquery) within the outer query's WHERE\
    \ clause. It executes the inner query the same way as if were a standalone query.\
    \ It searches the MANUFACTurers table for any row where the manufacturer name\
    \ equals the string Global Common Corp, and pulls the MANUMAN values for this\
    \ row. SQL then substitutes the derived MANUMAN value of 210 from the inner query\
    \ inside the predicate of the main query (outer query). As a result of this substitution,\
    \ the SQL query looks identical to the query mentioned previously.\n\n# SQL Code\n\
    \n```\nPROC SQL FREE;\nSELECT innum, INVOICE.mananum, custnum, invqty, invprice,\
    \ prodnum\nFROM INVOICE\n  (SELECT\n    FROM MANUFACTurers\n    WHERE mananum\
    \ = 'Global Common Corp')\nWHERE INVOICE.mananum = MANUFACTurers.mananum;\nQUIT;\n\
    ```\n\n# Result of Inner Query\n\n```\nPROC SQL;\nSELECT *\nFROM INVOICE\nWHERE\
    \ mananum = 210;\nQUIT;\n```\n\n+   - SQL query evaluates the inner query within\
    \ the outer query's WHERE clause to search for the manufacturer number for manufacturer\
    \ Global Common Corp.\n- The resulting query after substituting the derived manufacturer\
    \ number from the inner query evaluates to a single, and is executed by the main\
    \ (outer query).\n\n# Results\n\n| Invoice Number | Manufacturer Number | Customer\
    \ Number | Invoice Quantity - Units Sold | Invoice Unit Price | Product Number\
    \ |\n|---|---|---|---|---|-|\n| 1003 | 210 | 101 | 7 | $245.00 | 2101 |\n\nLet's\
