    # Beyond Normal Form


    In general, database designers are satisfied when their database tables subscribe
    to the rules in 3NF. But, it is not uncommon for others to normalize their database
    tables to fourth normal form (4NF), where independent one-to-many relationships
    between primary key and non-key columns are forbidden. Database purists often
    normalize to fifth normal form (5NF) where tables are split into smaller pieces
    of information in order to eliminate any and all table redundancies. Although,
    it is practice rarely desired by most database practitioners.


    There is no absolute right or wrong reason for database designers to normalize
    beyond 3NF as they have considered all the performance issues that may arise by
    doing so. A common problem that occurs when database tables are normalized 3NF
    is that a large number of small tables are generated. In, an increase in time
    and computer resources frequently occurs because small tables must first be joined
    before a query, report, or statistic can be produced.


