    # Establishing a Primary Key


    A primary key consists of one or more columns with a value that is used to identify
    individual rows in a table. Depending on the number of columns, a single column
    may be all that is necessary to identify specific rows. In other cases, two or
    more columns may be needed to adequately identify a row in a referenced table.
    Suppose that you need to uniquely identify rows in the MANUFACTURES table. By
    establishing the Manufacturer Number (MANUM) as the unique identifier for rows,
    a key is established. The next example specifies the ALTER TABLE statement to
    create a primary key using MANUM in the MANUFACTURES table.


    # SQL Code


    ```

    PROC SQL;

    ALTER TABLE MANUFACTURES

    ADD CONSTRAINT PRIM_KEY PRIMARY KEY (MANUM);

    QUIT;

    ```


    The SAS log shows that the MANUFACTURES table has been modified successfully after
    creating a primary key using the MANUM column.


    # SAS Log Results


    PROC SQL;

    ALTER TABLE MANUFACTURES

    ADD CONSTRAINT PRIM_KEY PRIMARY KEY (MANUM);

    NOTE: TABLE.MANUFACTURES has been modified, with 4 columns.

    QUIT;

    NOTE: PROCEDURE SQL used:

    real time 0.07 seconds

    cpu time 0.01 seconds'
