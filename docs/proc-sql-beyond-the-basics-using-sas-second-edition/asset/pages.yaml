    # Converting Output to Rich Text Format


    Rich Text (RTF) is text that includes codes that represent special formatting
    attributes. Although most frequently associated with a word processing program''s
    ability to read and create encapsulated text fonts and highlighting attributes
    during copy-and-paste operations, the ODS RTF destination permits output that
    is generated by SAS to be pasted as RTF. This enables you to produce output that
    can be shared.


    The next example illustrates SQL output sent to an external RTF file using the
    format engine. First, the default listing is closed, and then the RTF format engine
    is opened with an external file destination to which SQL results will be routed.
    The SQL procedure executes, the RTF destination is closed and the default listing
    destination is opened.


    Note: Opening the RTF file automatically invokes your system''s default processor
    and displays the contents.


    # SQL Code


    ```

    ODS LISTING CLOSE;

    ODS RTF FILE=''c:\SQL_Results.rtf'';

    PROC SQL;

    TITLE Delivering Output to Rich Text Format;

    SELECT prodname, prodtype, prodcost, prodnum

    FROM PRODUCTS

    ORDER BY prodtype;

    QUIT;

    ```


    ```

    ODS RTF CLOSE;

    ODS LISTING;

    ```'
