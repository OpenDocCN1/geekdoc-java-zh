    # Creating a Macro Variable with Aggregate Functions


    Turning data into information and saving the results as macro variables is easy
    with summary (aggregate) functions. The SQL procedure provides a number of useful
    functions to help perform calculations, descriptive statistics, and other aggregating
    computations in a SELECT statement or HAVING clause. These functions are not designed
    to display detail about data. In the example, the MIN function is used to determine
    the least expensive product from the PRODUCTS table with the value stored in the
    macro variable MIN_PROCOST using the INTO clause. The results are displayed in
    the SAS log.


    # SQL Code


    ```

    PROC SQL NOPRINT;

    SELECT MIN(PROCOST) FORMAT=DOLLAR10.2

    INTO :MIN_PROCOST

    FROM PRODUCTS;


    QUIT;

    %PUT &MIN_PROCOST;

    ```'
