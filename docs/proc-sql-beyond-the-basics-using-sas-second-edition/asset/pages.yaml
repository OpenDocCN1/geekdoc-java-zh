  md: "# Chapter 5: Creating, Populating, and Deleting Tables 199\n\nSuppose that\
    \ you also need to uniquely identify rows in the PRODUCTS table. By specifying\
    \ PRODNUM (Product Number) as the primary key, the next example specifies the\
    \ ALTER TABLE statement to create a unique identifier for rows in the table.\n\
    \n# SQL Code\n\n```\nPROC SQL;\n  ALTER TABLE PRODUCTS\n    ADD CONSTRAINT PRIM_PRODUCT_KEY\
    \ PRIMARY KEY (PRODNUM);\nQUIT;\n```\n\nThe SAS log shows that the PRODUCTS table\
    \ has been modified successfully after establishing a primary key using the PRODNUM.\n\
    \n# Sas Log Results\n\n```\nPROC SQL;\n  ALTER TABLE PRODUCTS\n    ADD CONSTRAINT\
    \ PRIM_PRODUCT_KEY PRIMARY KEY (PRODNUM);\nNOTE: Table.PRODUCTS has been modified,\
    \ with 5 columns.\nNOTE: PROCEDURE SQL used:\n  real time      0.03 seconds\n\
    \  cpu time       0.01 seconds\n```\n\n# Establishing a Foreign Key\n\nA foreign\
    \ key consists of one or more columns in a table that references or relates to\
    \ values in another table. The column(s) used as a foreign key must match the\
    \ column(s) in the table that is referenced. The purpose of a foreign key is to\
    \ ensure that data in one table exists in another thereby preventing the possibility\
    \ of loss or missing links between tables. Enforcement of referential integrity\
    \ has a positive and direct effect on data reliability.\n\nSuppose that you want\
    \ to ensure that data in the INVENTORY table have corresponding and matching values\
    \ in the PRODUCTS table. By establishing PRODNUM (Product Number) as a foreign\
    \ key in the INVENTORY table, you ensure a strong level of data integrity between\
    \ the two tables. This essentially verifies that key data in the INVENTORY table\
    \ exists in the PRODUCTS table. In the next example, a foreign key is created\
    \ using the PRODNUM column in the INVENTORY table by specifying the ALTER TABLE\
    \ statement.\n\n# SQL Code\n\n```\nPROC SQL;\n  ALTER TABLE INVENTORY\n    ADD\
    \ CONSTRAINT FOREIGN_PRODUCT_KEY FOREIGN KEY (PRODNUM)\n    REFERENCES PRODUCTS\n\
    \    ON DELETE RESTRICT\n    ON UPDATE RESTRICT;\nQUIT;\n```\n\nLafler, Kirk Paul.\
    \ PROC SQL: The Basics Using SAS®; Second Edition. Copyright 2013, SAS Institute,\
    \ Inc., Cary, North Carolina, USA. ALL RIGHTS RESERVED. For additional SAS resources,\
    \ visit support.sas.com/bookstore."
