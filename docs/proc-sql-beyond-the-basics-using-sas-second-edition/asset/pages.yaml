  md: '# Introduction


    In previous chapters, the examples assumed that each table had a physical existence,
    that is, the data stored in each table occupied storage space. In this chapter,
    let''s turn our attention to a different type of table structure that has no physical
    existence. This structure, known as a virtual table or view, offers users and
    programmers an incredible amount of flexibility and control. This makes views
    an ideal way to look at data from a variety of perspectives and according to different
    users needs. Unlike tables, views store no data and have only a "virtual" existence.
    You will learn to create, access, and delete views as the many examples in this
    chapter.


    # Views—Windows to Your Data


    Views are one of the most powerful features available in the SQL procedure. They
    are commonly referred to as "virtual tables" to distinguish them from base tables.
    The simple difference is that views are not tables, but instead files that consist
    of executable instructions. As a query, a view appears to be a table with one
    difference—it does not store any data. When a referenced view produces up-to-date
    results just like a table does. How does a view get its data? Views access data
    from one or more underlying tables (base tables) or other views, provide you with
    your own personal data, and can be used in DATA steps as well as SAS procedures.


    Views can be made to extend the security capabilities in dynamic environments
    where data duplication or redundancy, logic complexities, and security are issues.
    When properly designed, views can be made to adhere to row-level and column-level
    security requirements by allowing access to only those columns and rows of data
    that carry relevance to the information needed of the application. Any columns
    or rows of data that are deemed "off limits," or are classified as "restricted"
    can be eliminated from the views selection. Consequently, views can be constructed
    to allow access to only portions of an underlying (or tables) that each user is
    permitted to access.


    Another feature of views is that they consistently deliver data by creating (calculated)
    columns that are based on some arithmetic formula (or algorithm). Database pur
    design tables to be free of calculated columns, relying on the view to create
    computed columns. By using views to perform data aggregation, instead of tables
    themselves, processing can be postponed until needed or requested.


    As a means of shielding users from complex logic structures, views can be designed
    to look like though a database designed specifically for a single user as well
    as for a group of users, each having different needs. Data references are created
    once, and when fully tested and ready for production, can be stored in common
    shared libraries for all access. Views ensure that the current input data is used
    without the need for replicating partial or complete copies of the input data.
    They require very little storage space as a view contains only its definition,
    and does not contain a copy of the data that it presents.'
  merge: -1
  pgno: 318
- img_proc: true
  md: '# Chapter 8: Working with Views 297


    Views are also beneficial when queries or subqueries are repeated a number of
    times throughout an application. In these situations, the addition of a view enables
    a change to be made only once, which improves your productivity through a reduction
    in time and resources. The creation of view libraries should be considered so
    that users throughout an organization have an easily accessible array of productivity
    routines as they would a macro.


    # What Views Aren''t


    Views are not tables, because they are constructs that compiled code can access
    one or more underlying tables. Because views do not physically store data, they
    are referred to as "virtual" tables. Unlike tables, views do not physically contain
    or store rows of data. Views, however, have a physical presence and take up space.
    Storage demands for views are minimal because the only portion is saved. Tables,
    on the other hand, store one or more rows of data and their attributes within
    their structure.


    Views are created with the CREATE VIEW statement while tables are created with
    the CREATE TABLE statement. Because you use one or more underlying tables to create
    a virtual (derived) table, view provides you with a powerful method for accessing
    data sources.


    Although views have many unique and powerful features, they also have pitfalls.
    First, views generally take longer to process tables. Each time a view is referenced,
    the current underlying table or tables are accessed and processed. Because a view
    is not physically materialized until it is accessed, higher utilization costs
    can be expected, for larger views. Also, because a view is not a file (table)
    and does not contain data, an index cannot be created for a view. However, if
    a view is created from a table that has a defined index, then the SQL optimizer
    might attempt to use the index when processing its associated WHERE clause. Finally,
    if the results of a view are used several times in the same program, it might
    be more efficient to save and reuse a copy of the results in a table, avoiding
    the re-execution (materialization) of the multiple times.


    # Types of Views


    Views can be designed to achieve a number of objectives:


    +   * Reference a single table

    * Produce summary data across a row

    * Conceal sensitive information

    * Createdatable views

    * Grouped data based on summary functions or a HAVING clause

    * Use set operators

    * Combine two or more tables in join operations

    * Nest one view within another


    Lafler, Kirk Paul. PROC SQL: Beyond the Basics Using SAS®, Second Edition. Copyright
    2013, SAS Institute, Inc., Cary, North Carolina, USA. ALL RIGHTS RESERVED. For
    additional SAS resources, visit support.sas.com/bookstore.'
  merge: -1
  pgno: 319
- img_proc: true
  md: 'As way to distinguish the various types of views, Joe Celko introduced a classification
    system that is based on the type of SELECT statement used. See SQL for Smarties:
    Advanced SQL Programming (Morgan Kaufmann, 1999).


    To help you understand the different view types, this chapter describes and illustrates
    view construction as how they can be used. A view can also have the characteristics
    of one or more views, thereby being classified as a hybrid. A hybrid view, for
    example, could be designed to reference two or more tables, perform updates, and
    contain complex computations. Table 8.1 presents the different view types along
    with a brief description of their purpose.


    # Table 8.1: A Description of the Various View Types


    | Types of Views | Description |

    |---|---|n| Single-table view | A single-table view references a single underlying
    (base) table. It is the most common type of view. Selected columns and rows can
    be displayed or hidden depending on need. |

    | Calculated column views | A calculated column view provides data across a row.
    |

    | Read-only view | A read-only view prevents data from being updated (as opposed
    to updatable views) and is used to display data only. This also service purposes
    for the concealment of sensitive information. |

    | Updatable view | An updatable view adds (inserts), modifies, or deletes rows
    of data. |

    | Grouped view | A grouped view uses query expressions that are based on a query
    with a GROUP BY clause. |

    | Set operation view | A set operation view includes the union of two tables,
    the removal of duplicate rows, the concatenation of results, and the comparison
    of query results. |

    | Joined view | A joined view is based on the joining of two or more base tables.
    This type of view is often used in table-lookup operations to expand (or translate)
    code into text. |

    | Nested view | A nested view is based on one view being dependent on another
    view such as with subqueries. |

    | Hybrid view | An integration of one or more view types for the purpose of handling
    more complex tasks. |'
  merge: -1
  pgno: 320
- img_proc: true
  md: '# Creating Views


    You use the CREATE VIEW statement in the SQL procedure to create a view. When
    the SQL processor reads the words CREATE VIEW, it expects to find a name assigned
    to the newly created view. The SELECT statement defines the names assigned to
    the view''s columns as well as their order.


    Views are often constructed so that the order of the columns is different from
    the base table. In the next example, a view is created with the columns appearing
    in a different order from the original MANUFACTURERS base table. The view''s SELECT
    statement does not execute during this step because its only purpose is to define
    the view in the CREATE VIEW statement.


    # SQL Code


    ```

    SQL

    CREATE VIEW MANUFACTURERS_VIEW AS

    SELECT maname, manum, manuc, manustat

    FROM MANUFACTURERS;

    ```


    # SAS Log Results


    ```

    PROC SQL;

    CREATE VIEW MANUFACTURERS_VIEW AS

    SELECT maname, manum, manucity,

    FROM MANUFACTURERS;

    NOTE: SQL view WORK.MANUFACTURERS_VIEW has been defined.

    NOTE: PROCEDURE SQL used:

    real time                0.44 seconds

    ```


    When you create a view, it is you to create columns that are not from the base
    table from which you build your view. These columns are the result of an operation
    (addition, subtraction, multiplication, etc.) on one or more columns in the base
    tables. You can also build a view using one or more unmodified columns of or more
    base tables. Columns created this are referred to as derived columns or calculated
    columns. In the next example, suppose that you want to create a view that consists
    of the product name, inventory quantity, and inventory cost from the INVENTORY
    base table, and a derived column of average product costs that are stored in inventory.


    # SQL Code


    ```

    SQL

    CREATE VIEW INVENTORY_VIEW AS

    SELECT prodnum, invenqty, invencst,

    inencst/invenqty AS AverageAmount

    FROM INVENTORY;

    ```


    Lafler, Kirk Paul. PROC SQL: Beyond the Basics Using SAS; Second Edition. Copyright
    2013, SAS Institute, Inc.

    Cary, North Carolina, USA. ALL RIGHTS RESERVED. For additional SAS resources,
    visit support.sas.com/bookstore.'
  merge: -1
