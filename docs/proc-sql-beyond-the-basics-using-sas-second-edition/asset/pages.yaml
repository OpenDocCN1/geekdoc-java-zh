    # ERROR 202-322: The option or parameter is not recognized and will be ignored


    # Problem Description


    Sometimes problems occur because of unfamiliarity with the SQL procedure language
    syntax. In the syntax below, an unrecognized option or parameter is encountered,
    which results in the procedure stopping before any processing occurs.


