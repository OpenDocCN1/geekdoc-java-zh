  md: "Chapter 5: Creating, Populating, and Deleting Tables\n\n# Creating a Table\
    \ Using Column-Definition Lists\n\nAlthough part of the SQL standard, the column-definition\
    \ list (like the LENGTH statement in the DATA step) is a laborious and not very\
    \ elegant way to create a table. The disadvantage of creating a table is that\
    \ it requires the definition of each column's attributes including their data\
    \ type, length, and format. This method is frequently used to create columns when\
    \ they are not present in another table. Using this method results in the creation\
    \ of an empty table (without rows). The code used to create the CUSTOMERS table\
    \ appears below. This example illustrates the creation of a table with column-definition\
    \ lists.\n\n# SQL Code\n\n```\nPROC SQL;\n  CREATE TABLE CUSTOMERS\n  (CUSTNUM\
    \ NUM LABEL='Customer Number',\n    CUSTOMER CHAR(25) LABEL='Customer Name',\n\
    \    CUSTCITY CHAR(20) LABEL='Customer''s Home City');\n  QUIT;\n```\n\n# SAS\
    \ Log Results\n\nPROC SQL;\n  CREATE TABLE CUSTOMERS\n  (CUSTNUM NUM LABEL='Customer\
    \ Number',\n    CUSTOMER CHAR(25) LABEL='Customer Name',\n    CUSTCITY CHAR(20)\
    \ LABEL='Customer''s Home City');\nNOTE: TABLE CUSTOMERS created, with 0 rows\
    \ and 3 columns.\n  QUIT;\nNOTE: PROCEDURE SQL used:\n  real 0.81 seconds\n\n\
    You should be aware that the SQL procedure ignores width specifications for numeric\
    \ columns. When a numeric column is defined, it is created with a width of 8 bytes,\
    \ which is the maximum precision allowed by SAS. PROC SQL ignores numeric length\
    \ specifications when the value is less than 8 bytes. To illustrate this point,\
    \ a partial CONTENTS procedure output is displayed for the CUSTOMERS table.\n\n\
    Lafler, Kirk Paul. PROC SQL: Beyond the Basics Using SAS®; Second Edition. Copyright\
    \ 2013, SAS Institute, Inc.. Cary, North Carolina, USA. ALL RIGHTS RESERVED. For\
    \ additional SAS resources, visit support.sas.com/bookstore."
