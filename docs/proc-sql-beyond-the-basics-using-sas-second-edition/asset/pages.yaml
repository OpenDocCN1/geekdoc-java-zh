  md: '# Summary


    +   1. The available data types in SQL are 1) numeric and 2) character (see the
    “Data Types Overview” section).


    +   2. When a table is created with PROC SQL, numeric columns are assigned a default
    length of 8 bytes (see the “Numeric Data” section).


    +   3. SAS tables store date and time information in the form of a numeric data
    type (see the “Date and Time Column Definitions” section).


    +   4. A CHAR column stores a default of 8 characters (see the “Character Data”
    section).


    +   5. Comparison operators are used in the SQL procedure to compare one character
    or numeric value to another (see the “Comparison Operators” section).


    +   6. Logical operators are used in the SQL procedure to connect one or more
    expressions and consist of AND, OR, and NOT (see the “Logical Operators” section).


    +   7. The arithmetic operators used in the SQL procedure are the same as those
    used in the DATA step (see the “Arithmetic Operators” section).


    +   8. Character string operators are typically used with character data (see
    the “Character String Operators and Functions” section).


    +   9. Predicates are used in expressions (the SQL procedure to perform direct
    comparisons between two conditions or expressions (see the “Predicates” section).


    +   10. Missing or unknown information is supported by PROC SQL in a form known
    as null value. A null value is not the same as a zero value (see the “Missing
    Values and Null” section).


    II. Dictionary tables provide information about the SAS environment (see the “Dictionary
    Tables” section).'
