    # Normalization


    The development of an optimal database design is an important element in the life
    cycle of a database. Not only is it critical for achieving maximum performance
    and flexibility while working with tables and data, it is essential to the organization
    of data by reducing or minimizing redundancy in one or more database tables. The
    process of table design is frequently referred to by database developers and administrators
    as normalization.


    The normalization process is used for reducing redundancy in a database by converting
    data structures into simple. It is carried out for the following reasons:


    +   * To organize data to save and eliminate any duplicate or repetition of data.

    * To enable retrieval of data to query and report requests.

    * To simplify data requests as data insertions, updates, and deletions.

    * To reduce the impact associated with reorganizing or restructuring data as new
    application requirements arise.


    The normalization process attempts to simplify the relationship between columns
    in a database by splitting larger multicol tables into two or more smaller tables
    containing fewer columns. The reason for this is contained in a set of data guidelines
    called normal forms. The guidelines provide a set of rules for converting one
    or two large databases containing numerous columns into a normalized database
    consisting of multiple tables and only those that should be included in each table.
    The normalization process carries of multiple steps with each succeeding subscribing
    to the rules of the previous steps.


    Normalization helps to ensure that a database does not contain redundant information
    in or more of its tables. In an application, normalization prevents the destruction
    of data or the creation of incorrect data in a database. What this means is information
    of fact is represented only once in a database, and any possibility of it appearing
    more than once is not should, or should be avoided,


    As database designers and analysts proceed through the normalization process,
    many are not satisfied unless a database is carried out to third normal form (3NF).
    In his popular book SQL for Smarties: Advanced SQL Programming (Morgan Kaufman,
    1999), describes 3NF this way: "Databases are considered to be in3NF when a column
    is dependent on the key, the whole key, and not but the key."


    While the normalization guidelines are extremely useful, some database purists
    go to great lengths to remove any all redundancies at the expense of performance.
    This is in direct contrast to other database experts who follow the guidelines
    less rigidly in an attempt to improve the performance of a database by only going
    as far as third normal form (or 3NF). Whatever your preference, you should keep
    this thought in mind as you normalize database tables. A fully normalized database
    often requires a greater number of joins and can adversely affect the'
