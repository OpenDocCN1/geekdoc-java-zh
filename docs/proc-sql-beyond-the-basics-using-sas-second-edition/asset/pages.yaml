    \nNow that you have how tables are combined with join queries and subqueries,\
    \ let's look at another type of complex query. The SQL procedure provides users\
    \ with several table operators: INTERSECT, UNION, OUTER UNION, and EXCEPT, which\
    \ are commonly referred to as set operators. In contrast to joins and subqueries\
    \ where query results are combined horizontally, the purpose of set operator is\
    \ to combine or concatenate query vertically. Essentially, set operators construct\
    \ compound queries by combining the result sets of two or more queries.\n\n# Rules\
    \ for Set Operators\n\nSet operators adhere to basic rules of operation.\n\n+\
    \   1. If a SELECT statement contains more than one set operator, set operators\
    \ will be applied in the order specified.\n2. By default, duplicate rows are eliminated\
    \ from the results.\n3. To allow duplicates, the ALL option must be specified\
    \ with a set operator.\n4. Arguments are evaluated from left to right.\n5. Set\
    \ operators can be used in\n   a. Queries\n   b. Subqueries\n\nLafler, Kirk Paul.\
    \ PROC SQL: Beyond the Basics Using SAS®, Second Edition. Copyright 2013, SAS\
    \ Institute, Inc., Cary, North Carolina, USA. ALL RIGHTS RESERVED. For additional\
    \ SAS resources, visit support.sas.com/bookstore."
