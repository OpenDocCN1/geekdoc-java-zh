  md: "# PROC SQL: Beyond the Basics SAS, Second Edition\n\nFor example, once a specific\
    \ part number is known, an index can be used to look up the location of the part\
    \ along with its manufacturer, cost, and availability far more efficiently than\
    \ with other methods. For more information about using indexes in SAS, The Complete\
    \ Guide to Using SAS Indexes by Michael Rathel, which is available from the SAS\
    \ Bookstore.\n\n# Designing Indexes\n\nThere is no rule that says a table to have\
    \ an index, but when an index is available it can make information access and\
    \ retrieval more efficient and considerably faster.\n\nWhen a query is executed\
    \ in SAS, the SQL optimizer evaluates the costs associated with the available\
    \ methods and uses the most efficient method to process data. Processing can occur\
    \ using a sequential scan, or with an index if one exists. When a sequential scan\
    \ is performed, SAS starts at the beginning of the table, scan row-by-row through\
    \ all of the rows in the table, and processes (retrieves) rows that match the\
    \ selection criteria that is specified in the WHERE clause of query.\n\nIndexes\
    \ should be designed to provide efficient database processing when triggered (or\
    \ referenced) in a query. To better understand how an index works on a database,\
    \ the following things should be kept in mind:\n\n+   - Indexes can improve the\
    \ performance of queries that do not modify data because the optimizer has many\
    \ choices to select which one in order to determine the fastest way to access\
    \ data.\n- A table with many indexes might actually experience a performance degradation\
    \ when using INSERT, MODIFY, or DELETE operations all indexes must be adjusted\
    \ to correspond to the changes made to the data.\n- A query that specifies an\
    \ exact match comparison can benefit from an index.\n```sql\nWHERE prodnum = 5001;\n\
    \  < or >\nWHERE prodtype = \"Laptop\";\n```\n- A query that specifies a value\
    \ between a range of values can benefit from an index.\n```sql\nWHERE inveqty\
