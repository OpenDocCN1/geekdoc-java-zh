    # Finding Patterns in a String (Pattern Matching % and _)


    Constructing specific search patterns in string expressions is a simple process
    with the LIKE

    predicate. The % (percent) acts as a wildcard character representing any number
    of characters,

    including any combination of upper or lower case characters. Combining the LIKE
    predicate with

    t% permits case-sensitive searches and is a popular technique used by savvy SQL
    programmers

    to find patterns in their data.


    Using the LIKE operator with the % provides a wildcard capability enabling the
    selection of table

    rows that match a specific pattern. The LIKE predicate is case-sensitive and should
    be used with

    care. To find patterns product name (PRONAME) containing the uppercase “A” in

    t first position followed by any number of characters is specified with the following
    WHERE

    clause.


    # SQL Code


    ```

    PROC SQL;

    SELECT PRODNAME

    FROM PRODUCTS

    WHERE PRODNAME LIKE ''%A%'';


    QUIT;

    ```


    # Results


    | Product Cell |

    | Analog Cell Phone |


    The next example illustrates the wildcard character % preceding and following
    the search word

    to select all products name contain the word “Soft” in its name. The resulting
    output

    contains product types such as “Software” and any other products containing the
    word “Soft”.


