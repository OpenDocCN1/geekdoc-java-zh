    | 210 | Global Corp | 1003 | 7 | $245.00 |


    # Passing a Single Value with a Subquery


    Let''s see how a subquery could be constructed to provide the same results as
    the join. As before, suppose you want to pull all of the invoices for the manufacturer
    Global Corp but know only the manufacturer name (MANUNUM), not. The following
    subquery uses an = (equal sign) in its outer query WHERE to accomplish this.


    Because the manufacturer number is not known, a subquery is constructed to search
    for the manufacturer number in the MANUFACTERS table. Actually, the subparagraph
    approach is more versatile than the previous query approach, because it does not
    require a unique manufacturer number, which is often more difficult to remember
    than a manufacturer names. It enables quick searches even if the manufacturer
    number changes for a given manufacturer.'
