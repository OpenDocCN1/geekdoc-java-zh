  md: "# Adding Data to a Table with a SET Clause\n\nChapter 5: Creating, Populating,\
    \ and Deleting Tables 173\n\nYou populate tables with data by using an INSERT\
    \ INTO statement. Three parameters are specified with an INSERT INTO statement:\
    \ the name of the table, the names of the columns in which values are inserted,\
    \ and the values. One or more rows of data are inserted into a table with a SET\
    \ clause. Suppose you want to insert (or add) a single row of data to the CUSTOMERS\
    \ table and the row consists of three columns (Customer Number, Customer Name,\
    \ and Home City).\n\n# SQL Code\n\n```\nPROC SQL;\n  INSERT INTO CUSTOMERS\n \
    \   SET CUSTNUM=702,\n    CNAME='Mission Valley Computing',\n    CUSTCITY='San\
    \ Diego';\n```\n\nQUIT;\n\nThe SAS log displays the following message noting that\
    \ one row was inserted into the CUSTOMERS table.\n\n# SAS Log Results\n\n```\n\
    PROC SQL;\n  INSERT INTO CUSTOMERS\n    SET CUSTNUM=702,\n    CNAME='Mission Valley\
    \ Computing',\n    CUSTCITY='San Diego';\n```\n\nNOTE: 1 row was inserted into\
    \ WORK.CUSTOMERS.\n\nQUIT;\n\nNOTE: PROCEDURE SQL used:\n  real time 0.08 seconds\n\
    \nLafler, Kirk Paul. PROC SQL: Beyond the Basics Using SAS®; Second Edition. Copyright\
    \ 2013, SAS Institute, Inc. Cary, North Carolina, USA. ALL RIGHTS RESERVED. For\
    \ additional SAS resources, visit support.sas.com/bookstore."
