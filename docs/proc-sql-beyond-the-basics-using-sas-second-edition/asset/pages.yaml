  md: "# Results\n\n| Product Name | Product Number | Computer | Hardware | Equipment\
    \ | Software |\n|---|---|---|---|---|---||\n| Database Software | 5002 | | | |\
    \ 3 |\n| Dream Machine | 1110 | | 20 | | |\n| Graphics Software | 5004 | | | |\
    \ 20 |\n| Spreadsheet Software | 5001 | | | | 5 |\n| Spreadsheet Software | 5001\
    \ | | | | 2 |\n| Travel Laptop. | | | 10 | | 10 |\n| WordprocessorSoftware | 5003\
    \ | | | | |\n\n# Case Logic versus COALESCE Expression\n\nA common usage among\
    \ SAS programmers is to COALESCE function in an expression to perform case. As\
    \ described in Chapter 2, \"Working with Data in PROC SQL,\" the COALESCE permits\
    \ a new value to be substituted for one or more column values. By specifying COALESCE\
    \ in an expression, PROC SQL evaluates each argument from left to right for the\
    \ occurrence of a non-missing value. The first non-missing value found in the\
    \ list of arguments is returned; otherwise, a missing value, or assigned value,\
    \ is returned. This approach not saves programming time, making codings simpler\
    \ to maintain.\n\nExpressing logical expressions in one or WHEN-THEN/ELSE conditions\
    \ are frequently easy to code, understand, and maintain. But as the complexities\
    \ with Case logic increase, the amount of coding increases. In the following example,\
    \ a simple CASE expression is presented to illustrate how a value of \"Unknown\"\
    \ is assigned when CUSTCITY is missing.\n\n# SQL Code\n\n```\nPROC SQL;\nSELECT\
    \ CUSTOMNAME,\nCASE\n  WHEN CUSTCITY IS NOT NULL THEN CUSTCITY\n  ELSE 'Unknown'\n\
    END AS Customer_City\nFROM CUSTOMER;\n```\n\nTo illustrate the use of the COALESCE\
    \ function as an alternative to Case logic, the same query can be modified to\
    \ achieve the same results before. By replacing the Case logic with a COALESCE\
    \ expression as follows, the value of CUSTCITY is automatically displayed unless\
    \ it is missing. In cases of character data, a value of \"Unknown\" is displayed.\
    \ This technique makes the COALESCE function very useful and a shorthand approach\
    \ indeed."
