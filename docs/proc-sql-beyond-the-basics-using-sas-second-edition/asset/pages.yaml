    # Performing Computations in Joins


    Join queries, with simpler queries, can take full advantage of the power of the
    SQL procedure. Logical and arithmetic operators, predicates, and summary functions
    are all available for you to use. The join query is an essential component because
    stored information is not always available in the format that you need.


    PROC SQL provides the ability to perform arithmetic operations such as, subtraction,
    multiplication, and division with columns that contain numeric values. Essentially,
    this enables any query to perform column addition, subtraction, multiplication,
    and division. Suppose you want to calculate the sales of 7.75% for all manufactured
    products that are sold in the state of California. In the example, the SELECT
    statement shows the California sales tax'
  merge: -1
  pgno: 272
