    # Exporting Data and Output to Excel


    SAS provides users with an assortment of features and options for exporting data
    and output to Microsoft Excel. One approach enables the transfer of data and output
    to a Comma Separated Values (CSV) file. A CSV file is a widely supported format
    to transfer and store tabular data from databases to a spreadsheet. CSV files
    store text and numbers as plain text that can then be viewed and/or read using
    a text editor. Using the Output Delivery System (ODS) with the SQL procedure,
    data and output can be sent from SAS to a CSV file. In the following example,
    the ODS CSV statement is specified to produce a CSV file that can be opened in
    Microsoft Excel and saved as a Microsoft Excel spreadsheet. The resulting CSV
    file is displayed below in Microsoft Excel.


    # SQL Code


    ```

    ODS CLOSE;

    ODS CSV file=''sas-to-excel.csv'';

    nPROC SQL;

    SELECT *

    FROM PRODUCTS;

    QUIT;

    ```'
