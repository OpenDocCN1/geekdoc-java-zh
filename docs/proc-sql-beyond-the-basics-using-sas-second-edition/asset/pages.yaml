  md: '# Subqueries


    Now that you have seen how two or more tables can be combined in a join query,
    turn your attention to another type of complex query known as a subquery. A subquery
    is a query expression that is nested within another query expression. Its purpose
    is to have the inner query produce a single value or multiple values that can
    be passed to the outer query for processing. You achieve this by embedding a SELECT
    statement inside a WHERE clause of an outer query''s SELECT statement, INSERT
    statement, DELETE statement, or HAVING clause.


    Note: You should avoid nesting more than two subqueries because of the conceptual
    and processing complexities this introduces.


    The typical subquery consists of a (inner) query combined inside the predicate
    of another (outer or main) query. When processed, the inner query passes a Boolean
    value to the outer query consisting of True if it returns a value or False if
    no rows are returned by the subquery. The results of the inner query are stored
    in a temporary table and used as input to the main query. Our exploration of subqueries
    will involve them using comparison operators, the IN predicate, and the AND and
    ALL keywords, and will conclude with a look at a special type of subquery called
    a correlated subquery.


    # Alternate Approaches to Subqueries


    A subquery is a very useful construct, especially when from multiple tables needs
    to be interrelated. Unfortunately, a subquery is not always easy to construct
    and can be even difficult to understand. So before constructing every table with
    a subquery, consider your options carefully.


    When all of the information is available in a single table, a simple query is
    all that needs to be constructed. Suppose that you want to produce a report that
    consists of the inner information for Global Comm Corp. Let''s assume that you
    know the specific manufacturer number for Global Comm Corp. Knowing this means
    that you don''t have to go into the MANUFACTERS table to find it. In the next
    example, a simple query is constructed to retrieve all of the information from
    the INVOICE table.


    # Simple Query


    ```

    PROC SQL;

    SELECT *

    FROM INVOICE

    WHERE manunum = 210;


    QUIT;

    ```'
