    Now, let''s see what happens when a row of data is added through a view that does
    not meet the condition(s) in the WHERE clause of view. Suppose you want to add
    a row of data that contains the value 170 for product number, ''Travel Laptop
    SE'' in product name, ''Laptop'' in product type, and $4200.00 in product cost
    in the SOFTWARE_PRODUCTS_VIEW view.


    # SQL Code


    ```

    PROC SQL;

    INSERT INTO SOFTWARE_PRODUCTS_VIEW

    VALUES(171, ''Travel Laptop SE'', ''Laptop'', 4200.00);

    QUIT;

    ```


    Because the new row''s value for product type is "Laptop", this violates the WHERE
    condition when the view SOFTWARE_PRODUCTS_VIEW was created. As a result, the new
    row of data is rejected and is not added to the tables. The SQL procedure prevents
    the new row from appearing in the view because the base table contains the view.


    The updatable view does exactly what it is designed to do—that is, it validates
    each new row of data as each is added to the base table. Whenever the WHERE condition
    is violated, the view automatically rejects the row and restores the table to
    its pre-updated state by rejecting the row in error and deleting all successful
    inserts before the error occurred. In this example, the following error message
    was issued to the SAS log to confirm that the view was restored to its original
    state before the update took place.


