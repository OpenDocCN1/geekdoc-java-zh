    # Populating Tables


    After a table is created, it can be populated with data. Unless the newly created
    table is defined as a subset of an existing table or its content is to remain
    static, one or more rows of data may eventually need to be added. The SQL standard
    provides the INSERT INTO statement as the vehicle for adding rows of data. In
    fact, the INSERT INTO statement does not insert rows of data at all adds each
    row to the end of the table.


    The examples in this section look at a number of approaches to populate tables.
    New rows of data are added or changed in a table, many things must be kept in-mind
    behind the scenes including the need to carry out or any permanent changes to
    a table. This important step checks each operation for errors, and when one or
    more errors occur, SAS with the ability to completely rollback or undo the changes
    since the last commit. For, before a row insertion is allowed into table under
    assigned integrity constraints, it is first marked as uncommitted, then validated
    against assigned integrity constraints, and if no violations occur, the row insertion
    is committed to the table. The following insertion methods are illustrated:


    +   - adding data to a table with a SET clause

    - adding data to all of the columns in a row

    - adding data to some of the columns in a row

    - adding data with SELECT query

    - bulk loading data with Microsoft Excel


    Lafler, Kirk Paul. PROC SQL: Beyond the Basics Using SAS®,, Second Edition. Copyright
    2013, SAS Institute, Inc.

    ary, North Carolina, USA. ALL RIGHTS RESERVED. For additional SAS resources, visit
    support.sas.com/bookstore.'
