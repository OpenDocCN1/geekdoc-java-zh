    THE INTERSECT approach can be constructed to produce the same results as the previous
    example. The INTERSECT process assumes the tables in each query are structurally
    identical to each other. It overlays the columns from both queries based on position
    in the SELECT statement. Should you intersect two queries with different tables,
    the process might fail due to differing column types, or the results contain data
    integrity issues.


    The most significant distinction between the two approaches, and one might argue
    that the first query example (using the AND operator) takes less time to process:
    0.05 seconds versus 0.17 seconds for the second approach (using the INTERSECTION
    operator). The next example shows how the INTERSECT operator achieves the same
    result less efficiently.


    # SQL Code


    ```

    PROC SQL;

    SELECT *

    FROM PRODUCTS

    WHERE prodcost < 300.00

    INTERSECT

    SELECT *

    FROM PRODUCTS

    WHERE prodtype = "Phone";

    QUIT;

    ```


    +   1 It is assumed that the tables in both queries are structurally identical
    because the wildcard character "*" is specified in the SELECT statement.


    +   2 The INTERSECT operator produces rows that are common to both queries.'
