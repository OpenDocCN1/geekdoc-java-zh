    # Constraints and Change Control


    To preserve change control, SAS prohibits changes or modifications to a table
    that contains a referential integrity constraint. When you attempt to delete,
    rename, or replace a table that contains a referential integrity constraint, an
    error message is generated and processing stops. The next example illustrates
    a table operation that performed against a table that contains a referential integrity
    constraint that generates an error message and stops processing.


    # SAS Log Results


    ```

    PROC COPY IN=SQLBOOK OUT=WORK;

