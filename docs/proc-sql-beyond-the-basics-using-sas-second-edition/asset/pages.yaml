- img_proc: true
  md: 'ODS was first introduced in version 7 as a way to improve the traditional SAS
    output looks. It enables quality looking output to be produced without the need
    to import it into word processors such as Microsoft Word. Since then, many additional
    output formatting features and options are available for SAS users to take advantage
    of. With ODS, users have a powerful and easy way to create and access formatted
    procedure and DATA step output.


    # ODS and Output Formats


    ODS statements are classified as global statements and are processed immediately
    by SAS. With built-in format engines, which are referred to as output destinations,
    ODS prepares output using special formats. Figure 3.1 illustrates the types of
    output that can be produced with ODS.


    Figure 3.1: ODS Output Destinations


    ![](img/9d3e4d8fa063e50a0c9985e34cf9d6e8_135_0.png)


    The PROC step and the DATA step produce output in the form of an output object
    to any and all open destinations. An output destination controls what format engine
    is turned on during a step or until another ODS statement is specified. When a
    destination is open, one or more output objects can be sent to it. Conversely,
    when a destination is closed, output objects are not sent to the destination.'
  merge: -1
  pgno: 135
- img_proc: true
  md: '# PROC SQL: Beyond the Basics Using SAS, Second Edition


    really good ODS books are available for this exciting facility including Output
    Delivery System: The Basics and Beyond, by Lauren Haworth, Cynthia L. Zender,
    and Michele Burelev; and Quick Results with the Output Delivery System, by Sunil
    Kumar Gupta.


    # Sending Output to a SAS Data Set


    Output produced by the SQL procedure can be used as input to another vendor''s
    SQL, or data ODS step. ODS provides an easy and consistent alternative for creating
    a SAS table of results. For users who are already familiar with ODS, this approach
    will consist of a simple process of specifying the OUTPUT destination in an ODS
    statement. For users who prefer a traditional ANSI SQL approach the CREATE TABLE
    statement (see Chapter 5, "Creating, Populating, and Deleting Tables," for more
    details) will be the method of choice. Depending on the method you utilize most,
    the advantage of creating a SAS table of output is a handy feature that all SAS
    users should become familiar.


    Although the CREATE TABLE statement is the standard method of creating a table
    in PROC SQL, the ODS OUTPUT statement can also be specified to produce a table.
    Using the ODS OUTPUT statement, the table is a rectangular structure of one or
    more rows and columns. In this example, the SQL procedure''s results are stored
    in SQL_Results and are then sent to data set SQL_DATA using the ODS OUTPUT destination.
    The resulting data set is displayed using VIEW.


    # SQL Code


    ```

    ODS CLOSE;\NODS OUTPUT Results = SQL_DATA;

    ```


    ```

    PROC SQL;

    TITLE1 ''Delivering Output to a Data Set'';

    SELECT prodname, prodtype, prodcost, prodnum

    FROM PRODUCTS

    ORDER BY prodtype;

    QUIT;

    ```


    ```

    ODS OUTPUT CLOSE;\NODS LISTING;

    ```'
