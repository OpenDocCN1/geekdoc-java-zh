  md: "# SQL Operators and Functions\n\nSQL programmers have a number of ways to accomplish\
    \ their objectives, particularly when the goal is to retrieve and work with data.\
    \ The SELECT statement is an extremely powerful statement in the SQL language.\
    \ Its syntax is somewhat complex because of the number of ways that columns, tables,\
    \ operators, functions, and predicates can be combined into executable statements.\n\
    \nThere are several types of operators and functions in PROC SQL:\n\n+   - comparison\
    \ operators\n- logical operators\n- arithmetic operators\n- character string operators\n\
    - summary functions\n- predicates\n\nOperators and functions provide value-added\
    \ features for PROC SQL programmers. Each will be presented below.\n\n# Comparison\
    \ Operators\n\nComparison operators are used in the SQL procedure to compare one\
    \ character or numeric value to another. In the DATA step, SQL comparison operators,\
    \ mnemonics, and their descriptions appearing in the following table.\n\n| SAS\
    \ Operator | Mnemonic Operators | Description |\n|---|---|---|\n| = | EQ | Equal\
    \ to |\n| != | NE | Not equal to |\n| < | LT | Less than |\n| <= | LE | Less than\
    \ or equal |\n| > | GT | Greater than |\n| >= | GE | Greater than or equal |\n\
    \nSuppose you want to select only products from the PRODUCTS table that cost more\
    \ than $300.00. The example illustrates the use of the greater than (>) in a WHERE\
    \ clause to select products meeting the condition.\n\n# SQL Code\n\n```\nPROC\
    \ SQL;\n  SELECT PRONAME,\n    PRODYPE,\n    PROCOST\n```"
  merge: -1
