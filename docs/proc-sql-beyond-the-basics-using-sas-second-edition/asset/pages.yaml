  md: 'Chapter 2: Working with Data in PROC SQL 83


    # Dictionary.INDEXES


    It is sometimes useful to display the names of existing simple and composite indexes,
    or their SAS tables, that reference a specific column name. The INDEXES dictionary
    table provides important information to help identify indexes that improve a query''s
    performance. For example, to to display indexes that reference the CUSTMANN column
    name in any of the example tables, the following code is specified.


    Note: See Chapter 10, "Tuning for Performance and Efficiency," for performance
    tuning techniques as they relate to indexes.


    # SQL Code


    ```

    PROC SQL;

    SELECT *

    FROM DICTIONARY.INDEXES

    WHERE UPPERCASE(NAME)="CUSTMANN" /* Column Name */

    AND UPPERCASE(LIBNAME)="WORK" /* Library Name */

    QUIT;

    ```


    # Dictionary.MACROS


    The ability to capture macro variable names and their values is available with
    the MACROS dictionary table. The MACROS dictionary table provides information
    for global and automatic macro variables, but not for local macro variables. For
    example, to obtain columns specific to as global macros SQLLOBS, SLLOOPS, SQLXOBS,
    or SQLRC, the following code is specified.


    # SQL Code


    ```

    PROC SQL;

    SELECT *

    FROM DICTIONARY,MACROS

    WHERE UPPERCASE(SCOPE)="GLOBAL";

    QUIT;

    ```


    Lafler, Kirk Paul. PROC SQL: Beyond the Basics Using SAS®; Second Edition. Copyright
    2013, SAS Institute, Inc.. Cary, North Carolina, USA. ALL RIGHTS RESERVED. For
    additional SAS resources, visit support.sas.com/bookstore.'
