    The _TREE_ option, provides a graphical representation of how the query optimizer
    handled the execution of a query. The query execution plan shows how a query was
    interpreted and executed by the optimizer based on the statements, clauses, options,
    keywords, and other coding constructs used.


    When a query is submitted, the optimizer determines the most optimal way to execute
    the query, and consequently constructs an execution plan. Typically, the decision
    about which execution plan cost-based optimizer takes is influenced by the estimated
    CPU and IO processing costs, and the speed in which the query is expected to execute.
    The result is a query execution plan depicting a tree structure of labels, nodes,
