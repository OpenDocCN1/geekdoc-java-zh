  md: "212 PROC SQL: Beyond the Basics Using SAS, Second Edition\n\n# Controlling\
    \ the Position of Columns in a Table\n\nColumn position is not normally important\
    \ in relational database processing. But, there are times when a particular column\
    \ is desired, for example when SELECT * (select all) syntax is specified. To add\
    \ one or more columns in a designated order, the SQL standard provides a couple\
    \ of choices.\n\n+   - You can create a new table with the columns in the desired\
    \ order and load the data into the new table.\n- You can create a view that puts\
    \ the columns in the desired order and the desired order and then access the in\
    \ view of the table (see Chapter 8, \"Working with Views,\" for a detailed explanation).\n\
    \nSuppose that you want to add the INVENTORY STATUS column so that it is inserted\
    \ between the ORDDATE and INVCOST columns and not just added as the last column\
    \ in the table. The following example shows how this can be done. After, begin\
    \ by adding the INVENTORY_STATUS column to the INVENTORY table. Then, create a\
    \ new table called INVENTORY_COPY and load the data from the INVENTORY table in\
    \ the following column order: PRODNUM, INVENQTY, ORDDATE, INVENTORY_STATUS, INVENCST,\
    \ and MANUNUM.\n\n# SQL Code\n\n```\nPROC SQL;\nALTER TABLE INVENTORY\n  ADD INVENTORY_STATUS\
    \ CHAR(12);\nCREATE TABLE INVENTORY_COPY AS\n  SELECT PRODNUM, INVENQTY, ORDDATE,\
    \ INVENTORY_STATUS,\n  INVENCST, MANUNUM\n  FROM INVENTORY;\n\nQUIT;\nPROC CONTENTS\
    \ DATA=INVENTORY_COPY POSITION;\nRUN;\n```\n\nThe PROC CONTENTS output below shows\
    \ the positioning of the columns in the new INVENTORY_COPY table including the\
    \ new INVENTORY_STATUS column that was added."
