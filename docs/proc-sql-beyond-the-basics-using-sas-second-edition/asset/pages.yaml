  md: "# Chapter 7: Coding Complex Queries 257\n\n# Specifying a WHERE Clause\n\n\
    To provide greater subsetting capabilities as well as added flexibility, the SQL\
    \ procedure also permits the specification of an optional WHERE clause in addition\
    \ to an ON clause when constructing outer joins. The ability to specify a WHERE\
    \ clause in conjunction with an ON clause permits greater control over the subsetting\
    \ of rows. An example will help illustrate how a WHERE clause is used in an outer\
    \ join. Suppose that you want to limit the results from the previous left outer\
    \ join to only products that cost less than $300.00. In the example, the left\
    \ outer join syntax uses a WHERE clause to subset results to nonmissing products\
    \ that cost less than $300.00.\n\n# SQL Code\n\n```\nPROC SQL;\nSELECT manum,\
    \ manity, manufacturers.manum,\n      products.prodtype, products.prodcost\nFROM\
    \ MANUFACTERS LEFT JOIN PRODUCTS\n  ON manufacturers.manum =\n      products.manum\n\
    \  WHERE prodcost < 300 AND\n      prodcost NE :;\n\nQUIT;\n```\n\nThe optional\
    \ WHERE clause that is specified in addition to an ON clause in an outer join\
    \ further subsets the joined sets.\n\n# Results\n\n| Manufacturer Name | Manufacturer\
    \ City | Number | Product Type | Product Cost |\n| --- | --- | --- | --- | ---\
    \ |\n| Global Comm Corp | San Diego | 210 | Phone | $175.00 |\n| Global Comm Corp\
    \ | San Diego | 210 | Phone | $35.00 |\n| KPL Enterprises | San Diego | 500 |\
    \ Software | $299.00 |\n| KPL Enterprises | San Diego | 500 | Software | $299.00\
    \ |\n| KPL Enterprises | San Diego | 500 | Software | $299.00 |\n\n# Specifying\
    \ Aggregate Functions\n\nSuppose that you need to produce a monthly report that\
    \ consists of a total invoice amount by manufacturer. An aggregate function can\
    \ be specified with outer join syntax to perform a group computation by GROUP\
    \ BY clause. In the next example, a left join computes the total amount for each\
    \ manufacturer with a SUM function and GROUP BY clause.\n\nLafler, Kirk Paul.\
    \ PROC SQL: Beyond the Basics Using SAS®, Second Edition. Copyright 2013, SAS\
    \ Institute, Inc.\nCary, North Carolina, USA. ALL RIGHTS RESERVED. For additional\
    \ SAS resources, visit support.sas.com/bookstore."
