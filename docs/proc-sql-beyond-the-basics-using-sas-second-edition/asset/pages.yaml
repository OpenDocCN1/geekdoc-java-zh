  md: '# 200 PROC SQL: Beyond the Basics Using SAS, Second Edition


    The SAS log displays the successful creation of the PRODNUM column as a foreign
    key in the INVENTORY table. By specifying the default values ON DELETE RESTRICT
    and ON UPDATE RESTRICT clauses, you restrict the ability to change the values
