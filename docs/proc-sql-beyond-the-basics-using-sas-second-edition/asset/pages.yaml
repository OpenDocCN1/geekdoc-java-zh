  md: "+   c. Derived tables\nd. View definitions\ne. INSERT and/or EXCEPT clause\n\
    \n# Set Operators and Precedence\n\nSet operators adhere to an order of precedence.\
    \ The following precedence rules apply:\n\n+   1. When more than one set operator\
    \ is specified, each is applied in the order specified:\n   a. Top to bottom\n\
    \   b. Left to right\n2. The default order of precedence for processing set operators\
    \ follows:\n   a. INTERSECT\n   b. UNION and/or EXCEPT\nc. When parentheses are\
    \ specified, the default order of precedence can be altered.\n\n# Accessing Rows\
    \ from the Intersection of Two Queries\n\nThe INTERSECT operator creates queries\
    \ that consist of all the unique rows from the intersection of the two queries.\
    \ Put another way, the intersection of two queries (A and B) is represented by\
    \ C, which indicates the rows that are produced occur in both A and in B. As Figure\
    \ 7.1 shows, the intersection of both queries is represented in the shaded area\
    \ (C).\n\n![](img/9d3e4d8fa063e50a0c9985e34cf9d6e8_294_0.png)\n\nTo see all products\
    \ cost less than $300.00 and product types classified as \"phone\", you could\
    \ construct a simple query with a WHERE clause or specify the intersection of\
    \ two separate queries. The next example illustrates a simple query that specifies\
    \ a WHERE clause to display phones that cost less than $300.00."
