    # Creating a List of Values in a Macro Variable


    Concatenating values of a single column into one macro variable enables you to
    create a list of values that can be displayed in the SAS log or output to a SAS
    set. Using the SEPARATED BY keyword creates a list of values. For example, suppose
    that you want to create a blank-delimited list containing manufacturer names (MANUNAME)
    from the MANUFACTORS table. Create a macro variable &MANUNAME and assign the manufacturer
    names to a blank-delimited list with name separated by two blank spaces. The WHERE
    clause restricts the list''s contents to only manufacturers who are located in
    San Diego.


    # SQL Code


    ```

    PROC SQL NOPRINT;

    SELECT MANUNAME

    INTO :MANUNAME SEPARATED BY ''''

    FROM MANUFACTORS

    WHERE UPPERCASE (MANUCITY)=''SAN DIEGO'';

    QUIT;

    %PUT &MANUNAME;

    ```'
