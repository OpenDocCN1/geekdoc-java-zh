    # Outer Joins


    As the previous examples in this chapter have shown, an inner join disreg any
    rows where the search is not met. This differs significantly from the way an outer
    join groups tables. In contrast with an inner join, an outer join keeps rows that
    match the (search) condition, as well as preserving or all of the unmatched data
    from one or both of the tables. Essentially, an outer join retains rows even when
    they do not match rows in the second table. This distinction is critical because
    it is what truly differentiates an inner join from an outer join.


    Next, an outer join is capable of processing a maximum of two tables at a time,
    whereas (under the SAS implementation) an inner join is able to process a maximum
    of 256 tables.


    Another difference is to do with how you specify outer join. The command that
    is used to designate or eliminate one table from the other in the FROM clause
    of inner joins is replaced with one of the following: LEFT JOIN, RIGHT JOIN, or
    FULL JOIN in outer joins. Additionally, the WHERE clause is used to restrict which
    rows are kept in the result table is replaced with the ON condition.


    Finally, an outer join is considered to be asymmetric join (Loric, Raymond A.,
    and Jean-Jacques Saunders, SAS & Ins Publications, page 87). Unlike inner joins,
    an outer join does not select proportionally from its parts or tables.


    # Left Outer Joins


    Let''s look at how a left join is applied in a real-world situation. Suppose that
    you want to see a list of all manufacturers, their city locations, their manufacturer
    types, and their product costs (if available) without leaving out those manufacturers
    that do not have products yet. This means that the MANUFACTERS table (left table)
    acts as the master table having rows preserved while the PRODUCTS table (right
    table) acts as the contributing table (subordinate table). The following left
    outer join example effectively retains matched rows from both tables as well as
    retaining those rows from the left table that have no match in the right table.'
  merge: -1
  pgno: 277
- img_proc: true
  md: "# SQL Code\n\n```\nPROC SQL;\nSELECT maname, manucity, manufacturers.manuman,\n\
    products.prodtype, products.prodcost\nFROM MANUFACTERS LEFT JOIN PRODUCTS\nON\
    \ manufacturers.manuman = \nproducts.manuman;\n\nQUIT;\n```\n\n+   - THE LEFT\
    \ JOIN specification preserves all the rows in the left (MANUFACTURERS) even when\
    \ there are no matching rows in the right table (PRODUCTS).\n- The ON clause acts\
    \ as a WHERE clause to select the desired rows in the join results.\n\nAs the\
