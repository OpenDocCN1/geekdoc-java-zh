- img_proc: true
  md: '252 PROC SQL: Beyond the Basics SAS, Second Edition


    # Understanding Performance Tuning


    Performance tuning is the process of improving the way a program operates. It
    involves taking a program and seeing what can be done to improve performance in
    an intelligent, controlled manner. As you might imagine, a tuned program is one
    that gets the most from the existing hardware and software environment.


    Performance tuning involves measuring, evaluating, and modifying a program until
    it uses the minimum amount of computer resources to complete its execution. The
    biggest problem with the tuning process is that it is difficult to determine the
    amount of computer resources that a program uses. Complicating factors further,
    adequate and complete information about resource utilization is often unavailable.
    In fact, the only way to assess whether a program is efficient is to evaluate
    performance under varying conditions, such as during interactive use or during
    shortages of specific resources memory and storage.


    Performance issues might be difficult to identify. It is possible to have a program
    that operates without any apparent problem, but does not perform as efficiently
    as it could. In fact, a program might perform well in one environment and poorly
    in another. For example, if an organization has a shortage of Direct Access Storage
    Device (DASD), a program that uses excessive amounts of this resource might be
    deemed a poor performer under these circumstances. But if the same program were
    run in an environment that had adequate levels of DASD, it might not be suspected
    or tagged as a poor performer. This distinction demonstrates the subjectivity
    that is frequently used to determine how a program performs and how it is linked
    to the specific needs (related to resource issues) that an organization has at
    any point in time.


    # Sorting and Performance


    Sorting data in the SQL procedure, as in other parts of SAS, involves CPU and
    memory-intensive operations. When the table size is large, and CPU and memory
    resources are in short supply or simply available, the number of sorts must be
    minimized. You can minimize performance by understanding your query''s requirements
    and remembering a few simple guidelines.


    Performance bottlenecks can occur if sorts are performed on disk as opposed to
    in memory because processing on disk is typically slower than processing in memory.
    The most logical and efficient place to perform a sort is in memory. If the sort
    requires more space than can fit in available memory, the sort must be performed
    on disk. The objective is to determine how much space a sort will require as well
    as where the sort will be performed before it is executed.


    The performance of a sort is most influenced by the number of rows in a query.
    To reduce the row count, select specific parts of a table rather than selecting
    the entire table. Another performance consideration is to reduce the number of
    columns that are specified in an ORDER BY clause. The technique of concatenating
    two or more columns as opposed to specifying each column individually can be used.
    Finally, sort performance can be influenced by the number of columns that


    Lafler, Karl Paul. PROC SQL: Beyond the Basics SAS8; Second Edition. Copyright
    2013, SAS Institute, Inc., Cary, North Carolina, USA. ALL RIGHTS RESERVED. For
    additional SAS resources, visit support.sas.com/bookstore.'
