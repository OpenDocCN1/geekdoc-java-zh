    # Creating a Macro Variable from a Table Row


    A macro variable can be created from a column value in the first row of a row
    in PROC SQL by specifying the INTO clause. The macro variable is assigned using
    the value of the column that is specified in the SELECT list from the first row.
    A colon (:) is used in conjunction with the macro variable name defining. In the
    next example, output results are suppressed with the NOPRINT option, while two
    macro variables are created using the INTO clause and their values displayed in
    the SAS log. In the absence of a WHERE clause, the first row in the specified
    table is the one selected for populating macro variables.


    # SQL Code


    ```

    PROC SQL;

    SELECT PRODNAME,

    PRODCOST

    INTO :PRODNAME,

    :PRODCOST

    FROM PRODUCTS;

    nQUIT;

    PUT &PRODNAME &PRODCOST;

    ```


    # SAS Log Results


    ```

    PROC SQL NOPRINT;

    SELECT PRODNAME,

    PRODCOST

    INTO :PRODNAME,

    :PRODCOST

    FROM PRODUCTS;

    QUIT;

    NOTE: PROCEDURE SQL used:

    real time                0.38 seconds


    PUT &PRODNAME &PRODCOST;

    Dream Machine            $3,200.00

    ```


    In the next example, two macro variables are created using the INTO clause and
    a WHERE clause to control what row is used in the assignment of macro variable
    values. Using the WHERE clause enables a row other than the first row to always
    be used in the assignment of macro variables. Their values are displayed in the
    SAS log.'
