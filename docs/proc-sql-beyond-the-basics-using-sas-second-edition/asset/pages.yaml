    # Grouping Data with Summary Functions


    Occasionally we may use to display data in designated groups. A GROUP BY clause
    is used in these situations to aggregate and order groups of data using a designated
    column with the same value. When a GROUP BY clause is used without a summary function,
    SAS issues a warning in the SAS log with the message, "A GROUP BY clause has been
    transformed into an ORDER BY clause because neither the SELECT clause nor the
    HAVING clause of the associated table referenced a summary function." The GROUP
    BY clause is transformed into an ORDER BY clause and then processed.


    When a GROUP BY clause is used without specifying a summary function in the SELECT
    statement, the entry is treated as a single group and is ordered in ascending
    order. The next example illustrates a GROUP BY clause without any summary function
    specifications. Due to the absence of any summary functions, the GROUP BY clause
    is automatically transformed into an ORDER BY clause, with the rows ordered in
    ascending order by product type ''PRODTYPE".'
  merge: -1
  pgno: 129
- img_proc: true
  md: "# SQL Code\n\n```\nPROC SQL;\nSELECT prodtype,\n  prodcost\nFROM PRODUCTS\n\
    GROUP BY prodtype;\nQUIT;\n```\n\n# Log Results\n\nPROC SQL;\nSELECT prodtype,\n\
    \  prodcost\nFROM PRODUCTS\nGROUP BY prodtype;\nWARNING: A GROUP BY clause has\
    \ been transformed into an ORDER BY clause because neither the SELECT clause nor\
    \ the optional HAVING clause of the associated table-expression referenced a summary\
    \ function.\nQUIT;\n\n# Results\n\n# The SAS System\n\n| Product Type | Product\
    \ Cost |\n|---|---|n| Laptop | $3,400.00 |\n| Phone | $130.00 |\n| Phone | $175.00\
    \ |\n| Phone | $35.00 |\n| Software | $299.00 |\n| Software | $299.00 |\n| Software\
    \ | $399.00 |\n| Workstation | $3,200.00 |\n| Workstation | $3,200.00 |"
  merge: -1
  pgno: 130
- img_proc: true
  md: "When a GROUP BY clause is used with a summary function, the rows are aggregated\
    \ in a series of groups. This means that an aggregate function is evaluated on\
    \ a group of rows and not on a single row at a time. Suppose that the least expensive\
    \ product in each product type category (PRODTYPE) needs to be identified. Separate\
    \ query for each product category could be specified using the MIN function to\
    \ determine the cheapest product. This would require separate runs to be executed—not\
    \ a very good approach. A better way to do this is to specify a GROUP BY clause\
    \ in a single statement as:\n\n# SQL Code\n\n```\nPROC SQL;\n  SELECT prodtype,\n\
    \         MIN(prodcost) AS Cheapest\n         Format=dollar9.2 Label='Least Expensive'\n\
    \  FROM PRODUCTS\n  GROUP BY prodtype;\nQUIT;\n```\n\n# Results\n\n| Product Type\
    \ | Least Expensive |\n| --- | --- |\n| Laptop | $3,400.00 |\n| Phone | $35.00\
    \ |\n| Software | $299.00 |\n| Workstation | $3,200.00 |\n\n# Grouping Data and\
    \ Sorting\n\nIn the absence of an ORDER BY clause, the SQL procedure automatically\
    \ sorts the results from a grouped query in the order specified in the GROUP BY\
    \ clause. When both an ORDER BY clause and GROUP BY clause are specified for the\
    \ same column(s) or column order, no additional processing occurs to satisfy the\
    \ request. Because the ORDER BY clause and GROUP BY clause are not mutually exclusive,\
    \ they can be used together. Generally, the GROUP BY clause first sorts the results\
    \ on the grouping column(s) and then aggregates the rows of the query by them\n\
    \nBut what happens when the column(s) specified in the ORDER BY clause and GROUP\
    \ BY clause are not the same? In these situations, additional processing requirements\
    \ are generally required. The additional processing, in a worst-case scenario,\
    \ may require resuming statistics with the original data. In other cases, additional\
    \ sorting may be necessary. Suppose that"
  merge: -1
  pgno: 131
- img_proc: true
  md: "information about the least expensive product in each product category is desired.\
    \ Instead of automatically sorting the results in ascending order by product type,\
    \ as before, the results will be displayed in ascending order by the least expensive\
    \ product for each product type.\n\n# SQL Code\n\n```\nPROC SQL;\n  SELECT prodtype,\n\
    \         MIN(prodcost) AS Cheapest\n         Format=dollar.9 Label='Least Expensive'\n\
    \  FROM PRODUCTS\n  GROUP BY prodtype\n  ORDER BY cheapest;\nQUIT;\n```\n\n# Results\n\
    \n| Product Type | Least Expensive |\n| --- | --- |\n| Phone | $35.00 |\n| Software\
    \ | $299.00 |\n| Workstation | $3,200.00 |\n| Laptop | $3,400.00 |\n\n# Subsetting\
    \ Groups with the HAVING Clause\n\nWhen processing groups of data, it is frequently\
    \ useful subset subset rows (or groups) of data. This way, aggregated data can\
    \ be filtered one group at a time in contrast to filtering one row at a time.\
    \ SQL provides a convenient way to subset (or filter) groups of data by using\
    \ the GROUP clause and the HAVING clause. The HAVING clause is optional, but is\
    \ used in combination with the GROUP clause.\n\nThe HAVING clause is similar to\
    \ the WHERE clause in that it specifies conditions that must be satisfied in order\
    \ to become part of the subset. It differs from WHERE clause in that it can refer\
    \ to the results derived from summary functions after the aggregation of all observations\
    \ for each of the groups. The groups that evaluate to true based on the HAVING\
    \ clause are retained, and the groups that evaluate to false are automatically\
    \ removed from consideration.\n\nSuppose that you wanted to identify only those\
    \ product groups that have an average cost that is less than $400.00 from the\
    \ PRODUCTS table. Your first inclination might be to use a function in a WHERE\
    \ clause. But, this would not be valid a WHERE clause restricts the number of\
    \ rows selected. In contrast, the HAVING clause restricts the number of groups\
    \ selected,"
  merge: -1
  pgno: 132
- img_proc: true
  md: "and is always performed after the GROUP BY clause. For those already familiar\
    \ with subqueries discussed in Chapter 7, \"Coding Complex Queries,\" you could\
    \ also approach the problem as a complex query, there is an easier and more straightforward\
    \ way of identifying and selecting the desired products using the GROUP BY clause\
    \ and HAVING clause, as follows.\n\n# SQL Code\n\n```\nPROC SQL;\n  SELECT prodtype,\n\
    \    AVG (prodcost)\n    FORMAT=DOLLAR9.2 LABEL='Average Product Cost'\n  FROM\
    \ PRODUCTS\n  GROUP BY prodtype\n  HAVING AVG (prodcost) <= 400.00;\n\nQUIT;\n\
    ```\n\n# Results\n\n| Product Type | Average Product Cost |\n|---|---|\n| Phone\
    \ | $113.34 |\n| Software | $324.00 |\n\nTo illustrate the GROUP BY clause and\
    \ the HAVING clause further, suppose you have a $400.00 spending limit and you\
    \ want to identify the least expensive product within each product grouping from\
    \ the PRODUCTS table. The next example returns only product types that are within\
    \ the $400.00 spending limit, as follows.\n\n# SQL Code\n\n```\nPROC SQL;\n  SELECT\
    \ prodtype,\n    MIN(prodcost) AS Cheapest\n    FORMAT=DOLLAR9.2 LABEL='Least\
    \ Expensive'\n  FROM PRODUCTS\n  GROUP BY prodtype\n  HAVING Cheapest <= 400.00;\n\
    \nQUIT;\n```"
  merge: -1
  pgno: 133
- img_proc: true
  md: '# Results


    # The SAS System


    | Product Type | Least Expensive |

    |---|---|

    | Phone | $35.00 |

    | Software | $299.00 |


    The WHERE clause, GROUP BY clause, and HAVING clause are used together in a SELECT
    statement, the WHERE clause is processed first. Then, the rows returned by the
    WHERE clause are grouped in accordance with the GROUP BY clause. Finally, the
    conditions specified in the HAVING clause are applied to the groups before the
    results are produced. The next example returns software and hardware product types
    that are within the $400 spending limit.


    # SQL Code


    ```

    PROC SQL;

    SELECT prodtype,

    AVG(prodcost) AS Average_Product_Cost

    FORMAT=dollar12.2

    FROM PRODUCTS

    WHERE prodtype IN (''Software'', ''Hardware'')

    GROUP BY prodtype

    HAVING Average_Product_Cost < 400;

    ;

    ```


    # Results


    # The SAS System


    | Product Type | Average_Product_Cost |

    |---|---|

    | Software | $324.00 |


    # Formatting Output with the Output Delivery System


    SAS provides users with a familiar and automatic way to look output in a listing
    file. Although easy to use, it is not extremely flexible when it comes to creating
    nice-looking output. The SAS Output Delivery System (ODS) provides many ways to
    format output by controlling the way it is accessed and formatted. Many output
    formats are available with ODS, including traditional SAS monospace font (i.e.,
    Listing).'
