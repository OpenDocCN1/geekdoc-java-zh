  md: '208 PROC SQL: Beyond the Basics Using SAS, Second Edition


    # Summary


    +   1. Creating a table using a column-definition list is similar to defining
    a table''s structure with the LENGTH statement in the DATA step (see the "Creating
    a Table Using Column-Definition Lists section).


    +   2. Using the LIKE clause copies the column names and attributes from the existing
    table structure to the new table structure (see the "Creating a Table Using the
    LIKE Clause section).


    +   3. Deriving a table from an existing table stores the results in a new table
    instead of displaying them as SAS output (see the "Deriving a Table and Data from
    an Existing Table" section).


    +   4. In populating a table, three parameters are specified with an INSERT INTO
    statement: the name of the table, the names of the columns in which values are
    inserted, and the values themselves (see the "Adding Data to All of the Columns
    in a Row" section).


    +   5. Database-enforced constraints can be applied to a database table structure
    to enforce the type and content of data that is permitted (see the "Integrity
    Constraints" section).


    +   6. The DELETE statement combined with WHERE removes one or more rows of data
    from a table (see the "Deleting a Single Row in a Table" section).


    +   7. The SQL standard permits one or more unwanted tables to be removed from
    a database (SAS library) (see the "Deleting Multiple Tables" section).


    Lafler, Kirk Paul. PROC SQL: Beyond the Basics Using SAS®; Second Edition. Copyright
    2013, SAS Institute, Inc.. Cary, North Carolina, USA. ALL RIGHTS RESERVED. For
    additional SAS resources, visit support.sas.com/bookstore.'
