    A value of "Unknown" is assigned to products not matching any of the WHEN-THEN
    logic conditions. Finally, a column heading of Product_Classification is assigned
    to the new column with the AS keyword.


    # SQL Code


    ```

    PROC SQL;

    SELECT PRONAME,

    CASE PRODYPE

    ```'
