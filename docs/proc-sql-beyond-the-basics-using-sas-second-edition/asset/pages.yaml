    # Comparing a Set of Values


    A subquery can have multiple values returned for a single column to the outer
    query. But there are special keywords permit comparison operators to be used in
    subqueries to process multiple values. The special keywords ANY and ALL can be
    used to compare a set of values returned by a subquery. Let''s see how these keywords
    work.


    Suppose you want to view the products whose inventory quantity is greater than
    or equal to the lowest average inventory quantity. The following example illustrates
    a subquery with the ANY keyword specified in the WHERE clause of the main query
    expression. When ANY is specified, the WHERE clause is true if the subquery returns
    at least one value.


    # SQL Code


    ```

    PROC SQL;

    SELECT manum, prodnum, invqty, invprice

    FROM INVOICE

    WHERE invprice GE ANY

    (SELECT invprice

    FROM INVOICE

    WHERE prodnum IN (5001,5002));

    QUIT;

    ```


