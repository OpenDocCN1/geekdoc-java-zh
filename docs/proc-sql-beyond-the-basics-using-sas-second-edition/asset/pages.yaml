  md: 'Chapter 4: Coding PROC SQL Logic 137


    # Searched CASE Expression


    A searched CASE expression provides SQL users with the capability to perform more
    complex comparisons. Although the number of keystrokes can be more than with a
    simple CASE expression, the searched CASE expression offers the greatest flexibility
    and is the primary form used by SQL programmers. The noticeable absence of a column
    name as the CASE expression permits any number of columns to be specified from
    the underlying table(s) in the WHEN-THEN/ELSE scenarios.


    The searched CASE expression evaluates one or more WHEN conditions until it encounters
    one that evaluates to "true." If it assigns the result expression specified by
    the THEN keyword. If none of the WHEN conditions evaluates to "true," then the
    result the specified ELSE evaluates to "true" and an ELSE condition is not specified,
    the searched CASE expression returns a null value. Searched CASE expressions possesses
    the following features:


    +   - Allow arithmetic operators (i.e., +, <, >, etc).

    - Use logical operators (i.e., AND, OR, and NOT) for combining any number of expressions.

    - Evaluate compound expressions in the following default: NOT, AND, or OR, unless
    parentheses are specified to control the order of evaluation.

    - Evaluate the WHEN conditions in the order specified.

    - Evaluate the input-expression for each WHEN condition.

    - Return the result expression of the first input-expression that evaluates to
    "true."

    - Process the ELSE condition if no input-expressions evaluate to "true."


    # Searched CASE Expression in a SELECT clause


    To illustrate how a searched CASE expression works, consider an example that uses
    a calculated dollar amount from the UNITS and UNITCOST columns to assign a value
    of "Small Purchase" for purchases less than $1,000, "Average Purchase" for purchases
    between $1,000 and $7,500, "Large Purchase" for purchases greater than $7,500,
    and "Unknown Purchase" for all other values in the PURCHASES table. Using the
    calculated amount, Price_Amount, from the UNITS and UNITCOST columns, a CASE expression
    is constructed to assign the desired value in each row of data. Finally, a column
    heading of Type_of_Purchase is assigned to the calculated column with the AS keyword.
    Note: THE CASE keyword must be specified with any column created in a SELECT clause
    that does not exist in the table referenced in the FROM clause.


    Lafler, Kirk Paul. PROC SQL: Beyond the Basics Using SAS®, Second Edition. Copyright
    2013, SAS Institute, Inc.

    Cary, North Carolina, USA. ALL RIGHTS RESERVED. For additional SAS resources,
    visit support.sas.com/bookstore.'
