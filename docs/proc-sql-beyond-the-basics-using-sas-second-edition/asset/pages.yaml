    # Building Macro Tools and Applications


    The macro facility, with the capabilities of the SQL procedure, enables the possibility
    of creation of versatile macros for general purposes. A principle design goal
    when developing user-written macros is that they are useful and simple to use.
    It is best to avoid using a macro that does not meet your needs or has a name
    that is complicated and hard to remember.


    As tools, macros should be designed to serve the needs of as many users as possible.
    They contain no ambiguities, consist of distinct macro variables, avoid the possibility
    of naming conflicts between macro variables and set variables, and not try to
    do too many things. The utilitarian approach to macro design gains widespread
    approval and acceptance by users.


    # Creating Simple Macro Tools


    Macro tools can be constructed to perform a variety of tasks. The most effective
    macros are those that are simple and in position. Before embarking on the construction
    of one or more macro tools, explore what processes are currently being performed,
    and identify common users'' needs affected by addressing voids. Once this has
    been accomplished, you will be in a better position to construct simple and useful
    tools that will be accepted by users.


    Suppose that an informal requirements analysis you identify users who, in the
    course of their jobs, use a variety of approaches to create data set and cross-reference
    lists. To prevent unnecessary and wasteful duplication of effort, you decide to
    construct a simple macro tool that can be used by all users to retrieve information
    about the columns in one or more SAS data sets.


    # Cross-Referencing Columns


    Column cross-reference lists are useful when you need to quickly identify all
    of the SAS library data sets that contain a column defined. Using the COLUMNS
    dictionary (for more information, see Chapter 2, "Working with Data in PROC SQL"),
    a macro can be created that captures column level information including column
    name, type, length, position, label, format, indexes, and as a cross-reference
    list that contains the location of a column within a designated SAS library. In
    the next example, the COLUMNS macro consists of a PROC SQL query that accesses
    any single column in a SAS library. If the macro was invoked with a user-request
    consisting of


    ```

    %COLUMNS(WORK,CUSTOM) ;

    ```


