    # Normalization Strategies


    After transforming entities and attributes from the conceptual design into a logical
    design, the tables and columns are created. This is when a process known as normalization
    occurs. Normalization refers to the process of making your database tables subscribe
    to certain rules. Many, if not most, database designers are satisfied when third
    form (3NF) is achieved, and for the objectives of this book, I will stop at 3NF,
    too. To explain the varying normalization steps, an example scenario follows.


    # First Normal Form (INF)


    First normal form (INF) involves the elimination of redundancy or repeating information
    from a table. A table is considered to be in first form when all of its columns
    describe the table and each column in a row has only one value. A table satisfies
    INF when each column in a row has a single value and no repeating group information.
    Essentially, every table illustrates INF as long as a list, array, or other structure
    has not been defined. The following table satisfies the INF because it has only
    one value at each row-column intersection. The table is shown ordered by CUSTOM
    and consists of customers and the purchases they made at an office supply


