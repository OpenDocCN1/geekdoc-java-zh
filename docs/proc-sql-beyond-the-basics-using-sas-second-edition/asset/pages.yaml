    # Simple CASE Expression in a WHERE Clause


    In the previous section, we examined the syntax and application of simple CASE
    expressions in a SELECT clause. In this section, we''ll explore the syntax and
    application of simple CASE expressions in a WHERE clause. Because the SQL procedure
    supports the use of a CASE expression anywhere an expression can be used, we''ll
    learn that a query can benefit from the capabilities of passing a result value
    from a CASE expression directly to a WHERE clause in place of a hardcoded value.


    # SQL Code


    ```

    PROC SQL;

    SELECT MANNAME,

    MANUSAT

    FROM MANUFACTERS

    WHERE CASE MANSTAT

    WHEN ''CA'' THEN 1

    ELSE 0

    END;


    QUIT;

    ```'
