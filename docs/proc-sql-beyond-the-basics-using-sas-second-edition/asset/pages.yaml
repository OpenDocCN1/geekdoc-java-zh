  md: 'Chapter 7: Coding Complex Queries 239


    # Demystifying Join Algorithms


    The SQL procedure contains an optimizer optimizer whose purpose is to use the
    best plan for query execution. A join algorithm locates, for each distinct value
    of the join attributes, an ordered list of elements in each relation that display
    that value. The SQL optimizer uses criteria to determine which join algorithm
    to use to optimize the query. The join construct, the structure of the data, the
    definition of indexes, the availability of real memory, and other factors can
    influence the join algorithm that is selected by the optimizer. The specific details
    of each of the join algorithms are described below.


    # Nested Loop


    A nested loop join algorithm might be selected by the SQL optimizer when processing
    small tables of data where one table is considerably smaller than the other table,
    the join condition does not contain an equality condition, first row matching
    is optimized, or using a sort-merge or hash join has been eliminated. This algorithm
    operates by looping through the smaller of the tables looking for a matching key
    in the larger table. A nested loop join is extremely sensitive to the contents
    of the right table because it processes the right table for each row of the left
    table. For this reason, this join tends to be more CPU intensive than other choices,
    particularly as the table size increases.


    # Sort-Merge


    A sort-merge join algorithm might be selected by the SQL optimizer when the tables
    are small to medium size. This algorithm operates by sorting the tables of data
    (if necessary) using one or more keys, and then, for each row in the left table,
    the algorithm reads all matching rows in the right table. The SQL optimizer considers
    using sort-merge join algorithm when the conditions for using an index or hash
    join have been eliminated from consideration.


    # Index


    An index join algorithm might be selected by the SQL optimizer when indexes created
    on each of the columns participating in the join relationship will improve performance.
    This algorithm operates by looking each row of the smaller table by accessing
    the index of the larger table. The SQL optimizer considers using an index join
    when the larger table has an associated index with all the join keys, the tables
    are related with an equality condition, and/or join conditions use the AND operator
    between expressions.


    # Hash


    A hash join algorithm might be selected by the SQL optimizer when sufficient memory
    is available to the system, and the BUFFERSIZE option is large enough to store
    the smaller of the tables into memory. This algorithm operates by sequentially
    scanning the larger table and performing row-by-row lookup against the smaller
    table. The SQL optimizer considers using a hash join when an index join algorithm
    has been eliminated from consideration.


    # Influencing Joins with a Little Magic


    The SQL procedure supports various options to influence the execution of specific
    join algorithms. The SQL procedure options are available:


