  md: "# 70 PROC SQL: Beyond the Basics Using SAS, Second Edition\n\nWhen a pattern\
    \ search for a specific number of characters is needed, the LIKE predicate with\
    \ the underscore (_) provides a way to pattern character-by-character. Thus, a\
    \ single underscore (_) in a specific position acts as a wildcard placement holder\
    \ for that position only. Two consecutive underscores (__) act as a wildcard placement\
    \ holder for two positions. Three consecutive underscores (___ act as a wildcard\
    \ placement holder for three positions. And so forth. In the next example, the\
    \ first position used to search product type contains the character \"P\", and\
    \ the next five positions (represented with five underscores) act as a placeholder\
    \ for any value.\n\n# SQL Code\n\n```\nPROC SQL;\nSELECT PRODNAME,\n       PRODYPE,\n\
    \       PROCOST\nFROM PRODUCTS\nWHERE UPPERCASE(PRODTYPE) LIKE 'P____';\nQUIT;\n\
    ```\n\n# Results\n\n| Product Name | Product Type | Product Cost |\n|---|---|--|\n\
    | AnalogPhone | Phone | $35.00 |\n| DigitalPhone | Phone | $175.00 |\n| OfficePhone\
    \ | Phone | $130.00 |\n\nThe next example illustrates a pattern search of product\
    \ name (PRODNAME) where the first three positions are represented as a wildcard;\
    \ the fourth position contains the lowercase character “a\", followed by any combination\
    \ of uppercase or lowercase characters.\n\n# SQL Code\n\n```\nPROC SQL;\nSELECT\
    \ PRODNAME\nFROM PRODUCTS\nWHERE PRODNAME LIKE '_a%%';\nQUIT;\n```\n\n# Results\n\
    \n| Product Name |\n|--|\n| Dream Machine |\n| Database Software |\n\nLafler,\
    \ Kirk Paul. PROC SQL: Beyond the Basics Using SAS®, Second Edition. Copyright\
    \ 2013, SAS Institute, Inc. Cary, North Carolina, USA. ALL RIGHTS RESERVED. For\
    \ additional SAS resources, visit support.sas.com/bookstore."
