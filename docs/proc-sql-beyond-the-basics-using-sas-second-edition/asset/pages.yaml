    # Second Normal Form (2NF)


    Second normal form (2NF) addresses the relationships between sets of data. A table
    is to be in second normal form when all the requirements of 1NF are met and a
    primary key is used to link any data in one table which relates to another. The
    very nature of leaving a table in first normal form (1NF) may present problems
    due to the repetition of some information in the table. One problematic problem
    is that Table 1.1 has repetitive information in it. Another problem is there are
    millennials in the customer name. Although repeating information may be permissible
    with hierarchical file structures it does pose a data consistency problem if it
    relates to relational data.


    To describe how data consistency problems occur, let''s say that customer takes
    a new job and moves to a new location. In changing the customer''s city to the
    new location, it would be very easy to miss one or more occurrences of the customer''s
    city resulting in a customer residing incorrectly in


