  md: "# PROC SQL: Beyond the Basics SAS, Second Edition\n\nIn the next example, the\
    \ FORMAT procedure is used to assign temporary formatted values based on a range\
    \ of INVENTORY. The result from executing this simple three-step (non-SQL procedure)\
    \ shows that the actual INVENTQ value is temporarily replaced with the \"matched\"\
    \ value in the user-defined format. The FORMAT statement performs a look-up process\
    \ to determine how the data should be displayed. The actual data value being looked\
    \ up is not changed (or altered) during the process, but a determination is made\
