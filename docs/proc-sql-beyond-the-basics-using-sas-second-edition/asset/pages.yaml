    # Conditionally Updating a Table with a CASE Expression


    A CASE expression can be specified to conditionally update the contents of a table.
    For more information about updating in a table, see Chapter 6, "Modifying and
    Updating Tables and Indexes." The example illustrates the process of conditionally
    updating data in a table using an UPDATE statement and a simple CASE expression
    to add $10.00 the unit cost (UNITCOST) of "Chair" in the PURCHASES table from
    $179.00 to $189.00.


    Note: A table must be open in update mode to be able to update its contents.


    # SQL Code


    ```

    PROC SQL;

    TITLE ''Before Update Operation'';

    SELECT *

    FROM PURCHASES2;

    UPDATE PURCHASES2

    SET UNITCOST = UNITCOST +

    CASE ITEM

    WHEN ''Chair'' THEN 10.00

    ELSE 0

    END;

    TITLE ''After Update Operation'';

    ```'
