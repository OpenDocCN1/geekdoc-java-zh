  md: '# Dictionary Tables


    SAS generates and maintains valuable runtime information (metadata) about SAS
    libraries, data sets, catalogs, indexes, macros, system options, titles, views,
    and other content in a collection of read-only tables called dictionary tables.
    Although called tables, dictionary tables are not real tables at all. Dictionary
    tables and their contents permit a SAS session''s activities to be accessed and
    monitored. Information is automatically produced and the tables are made available
    at time a SAS session begins.


    | Dictionary Table Name | Contents |

    |---|---|

    | DICTIONARY.CATALOGS | SAS catalogs |

    | DICTIONARY.COLUMNS | Data set columns and attributes |

    | DICTIONARY.EXTFILES | Allocated filerefs and external physical path |

    | DICTIONARY.INDEXES | Data set indexes |

    | DICTIONARY.MACROS | Global and automatic macro variables |

    | DICTIONARY.MEMBERS | SAS data sets and other member types |

    | DICTIONARY.OPTIONS | Current SAS system options |

    | DICTIONARY.TABLES | SAS data sets and views |

    | DICTIONARY.TITLES | Title and footnote definitions |

    | DICTIONARY.VIEWS | SAS data views |


    # Dictionary Tables and Metadata


    SAS collects and populates valuable information (“metadata” or data about) on
    SAS libraries, data sets (tables), catalogs, indexes, macros, system options,
    titles, views, and a collection of other read-only tables called dictionary tables.
    Dictionary tables serve a special purpose by providing system-related information
    about the current SAS session''s databases and applications. When a query is requested
    against a dictionary table, SAS automatically launches a discovery process at
    runtime to collect information pertaining to that table. Information is made available
    any time a SAS session is started.


    While earlier versions of SAS software had 22 dictionary tables and SASHELP views,
    there are 29 “known” dictionary views and SASHELP views in SAS 9.2, and 30 “known”
    dictionary tables and SASHELP views in SAS 9.3, with the name of each DICTIONARY
    table and SASHELP view illustrated below.'
