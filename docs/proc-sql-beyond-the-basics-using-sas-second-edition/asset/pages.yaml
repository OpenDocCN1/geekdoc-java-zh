- img_proc: true
  md: '# Chapter 6: Modifying and Updating Tables and Indexes 223


    Indexes provide SAS users with an access method that avoids large-scale scans
    and disks, which are frequently used when the optimizer is not able to find an
    efficient way to service a query. An index consists of one or more columns, representing
    a key, to uniquely identify rows within a table. When an index is used, it finds
    the storage location of the rows requested by the query''s search criteria and
    retrieves these rows of data.


    An index is best represented as an inverted tree structure, which is sometimes
    referred to as a balanced tree (or b-tree), and is displayed in the following
    diagram. As shown in Figure 6.2, an index consists of a single root page level
    (starting point), zero or more intermediate levels (or nodes), and a leaf level
    where the actual rows of data are stored.


    Figure 6.2: Inverted Tree Structure Known as a B-Tree


    ![](img/9d3e4d8fa063e50a0c9985e34cf9d6e8_245_0.png)


    Because indexes are frequently too large to fit completely into primary storage
    (memory), they are stored on a secondary type of storage such as disk. In b-tree
    data structures, records of rows are stored in locations leaves. B-trees are best
    suited to handle situations where some part of the data resides in secondary storage.
    This provides an environment where the number of secondary disk accesses is reduced
    (fewer I/O operations), which results in a more cost-effective process.


    An index used to improve the speed in which subsets of data are accessed and is
    composed of one or more character, or mixed (alphanumeric) types of columns. Rather
    than sequentially accessing rows of data or physically sorting a table (as performed
    with an ORDER clause or a BY statement in PROC SORT), an index is designed to
    set up a logical data arrangement without the need to physically sort it. This
    has a distinct advantage of reducing CPU and memory requirements, as well as reducing
    data access time when using WHERE clause processing.


    Lafler, Kirk Paul. PROC SQL: Beyond the Basics SAS®; Second Edition. Copyright
    2013, SAS Institute, Inc.; Cary, North Carolina, USA. ALL RIGHTS RESERVED. For
    additional SAS resources, visit support.sas.com/bookstore.'
  merge: -1
