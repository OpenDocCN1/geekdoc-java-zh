    The SAS log displays the successful creation of the PRODNUM column as a foreign
    key in the INVENTORY table as well as the effect of the ON DELETE SET NULL clause.
    Specifying this clause will change foreign key values to missing or null for all
    of the rows with matching values found in the primary key. The execution of any
    SQL statement that could violate these referential integrity rules is prevented
    during SQL processing.'
