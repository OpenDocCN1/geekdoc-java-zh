    # RESET Statement


    The RESET statement is used to add, drop, or change one or more PROC SQL options
    without the need to restart the procedure. If an option is specified, it stays
    in effect until it is changed or reset. Being able to change options with RESET
    is a handy debugging technique. The following example turns off the FEEDBACK option
    by resetting it to NOFEEDBACK. By turning off this option, you prevent the expansion
    of a SELECT * (wildcard) statement into a list of columns that it represents.


    # SQL Code


    ```

    PROC SQL;

    SELECT *

    FROM PRODUCTS;

    RESET FEEDBACK;

    SELECT *

    FROM PRODUCTS

    WHERE PRODTYPE=''Software'';

    QUIT;

    ```


    # SAS Log Results


    ```

    SELECT *

    FROM PRODUCTS;

    NOTE: Statement transforms to:

    select PRODUCTS.prodnum, PRODUCTS.prodname, PRODUCTS.manunum,

    PRODUCTS.prodtype, PRODUCTS.prodcost

    from PRODUCTS;

    RESET FEEDBACK;

    SELECT *

    FROM PRODUCTS

    WHERE PROTYPE=''Software'';

    ```


    Multiple options can be reset in a single RESET statement. Options in the PROC
    SQL and RESET statements can be specified in any order. The next example shows
    how, in a single RESET statement, double-spaced output is changed to single-spaced
    output with the NODOUBLE option, row numbers are suppressed with the NONNUMBER
    option, and output rows are changed to the maximum number of rows with the OUTBARS=
    option.'
