    # User-Specified Sorting (SORTPGM= System Options)


    You can control how SAS uses when performing sorts. By specifying the SORTPGM=

    system, you can direct SAS to use the best possible sort utility for the environment
    in question.

    The SORTPGM= system options are displayed in Table 10.1.


    Table 10.1: SORTPGM= System Options

    | Sort | Purpose |

    | --- | --- |

    | BEST | The BEST option uses the sort utility that is best suited to the data.
    |

    | HOST | The HOST option tells SAS to use the host sort utility that is

    available on your host computer. This option might be the

    efficient for large tables that contain many rows of data. |

    | SAS | The SAS option tells SAS to use the sort utility that is supplied with

    SAS.


    The next example illustrates how to use the SORTPGM= option to select the sort
    utility that is

    most suited to the data. Both options use the name that is specified in the SORTNAME=
    option.


    ```

    OPTIONS SORTPGM=BEST;

    <or>

    OPTIONS SORTPGM=HOST;

    ```


    # Automatic Sorting


    Using the DISTINCT clause invokes an internal sort to remove duplicate rows.

    exception is when an index exists. If an index exists, then the index is used
    to eliminate the duplicate

    rows.


    The results of a grouped query are automatically sorted by the grouping columns.
    When the

    SELECT clause contains only the columns that are listed in the GROUP BY clause
    along with any

    summary functions, the duplicates in each group based on the grouping columns
    are removed

    as soon as any defined summary functions are performed. If additional columns
    then appear in the

    SELECT clause, the rows are not collapsed and therefore duplicates are not removed.'
