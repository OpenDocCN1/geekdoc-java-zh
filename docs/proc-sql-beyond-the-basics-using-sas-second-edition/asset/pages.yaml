  md: 'Chapter 7: Coding Complex Queries 235


    Set Operations

    Results are created from two or more separate queries.


    # Joins


    Joining two or more tables of data is a powerful feature in the relational model.
    The SQL procedure enables you to join tables of information quickly and easily.
    Linking one piece of information with another piece of information is made possible
    when at least one column is common to each table. A maximum of 256 tables can
    be combined using conventional (inner) join techniques, as opposed to a maximum
    of two tables at a time using outer join techniques.


    This chapter discusses a number of join topics including why joins are, the differences
    between various join techniques, the importance of the WHERE clause, creating
    and using aliases, joining three or more tables of data, outer (left, right, and
    full) joins, subqueries, and set operations. It is important to recognize that
    many of these techniques can be accomplished using DATA step programming techniques,
    but the simplicity and flexibility found in the SQL procedure makes it equally
    indispensable, as a tool for the practitioner.


    # Why Joins Are Important


    As relational databases continue to grow in popularity, the need to access normalized
    data stored in separate tables becomes increasingly important. By relating matching
    values in columns of one table with columns in the other table(s), you can retrieve
    information as if the data were stored in one file. The results can provide new
    and exciting insights into possible data relationships.


    # Information Retrieval Based on Relationships


    Being able to define relationships between tables and retrieve information based
    on these relationships is a powerful feature of the relational model. A join of
    two or more tables provides a means of gathering and manipulating data in a single
    SELECT statement. You join two or more tables by specifying the table names in
    a SELECT statement. Joins on a minimum of two tables at a time, where column from
    each table is used for the purpose of connecting the two tables. Connecting columns
    should have "like" values and the same column attribute because the join''s success
    depends on these values.


    In a typical join, you name the relevant columns in the SELECT statement, specify
    the tables to be joined in the FROM clause, and in the WHERE clause you specify
    the relationship that you want revealed. In this, you describe the data subset
    that you want to produce. To be of use (and of a manageable size), your join needs
    a WHERE clause to constrain the results and ensure their utility and relevance.


    Lafler, Kirk Paul. PROC SQL: Beyond the Basics Using SAS®, Second Edition. Copyright
    2013, SAS Institute, Inc.. Cary, North Carolina, USA. ALL RIGHTS RESERVED. For
    additional SAS resources, visit support.sas.com/bookstore.'
