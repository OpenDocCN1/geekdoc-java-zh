  md: "# 170 PROC SQL: Beyond the Basics Using SAS, Second Edition\n\nAs a result\
    \ of executing the CREATE TABLE statement and the LIKE clause the new table contains\
    \ zero rows of data but does include all the column definitions without any rows\
    \ of data from an existing table and/or. What this means is that only the metadata\
    \ (data describing data) is copied to the new table. The particular definitions\
    \ that are copied include: column names, \ndata type, length, precision, label,\
    \ import, format, and so on.\n\nThe next example illustrates how to create a new\
    \ table by selecting only the columns that you have an interest in. This method\
    \ is not supported by the SAS ANSI standard. Suppose that you want three columns\
    \ (PRODNAME, PRODYPE, and PRODUCT) from the PRODUCTS table. The following code\
    \ illustrates how the KEEP= data set (table) option can be used to accomplish\
    \ this.\n\nNote: Data sets can also be called tables.\n\n# SQL Code\n\n```\nPROC\
    \ SQL;\nCREATE TABLE HOT_PRODUCTS (KEEP=PRODNAME PRODYPE PROCOST)\nLIKE PRODUCTS;\n\
    QUIT;\n```\n\n# SAS Log Results\n\n```\nPROC SQL;\nCREATE TABLE HOT_PRODUCTS (KEEP=PRODNAME\
    \ PRODYPE PROCOST)\nLIKE PRODUCTS;\nNOTE: Table HOT_PRODUCTS created, with 0 rows\
    \ and 3 columns.\nNOTE: PROCEDURE SQL used:\nreal time                0.00 seconds\n\
    ```\n\n# Deriving a Table and Data from an Existing Table\n\nDeriving a new table\
    \ from an existing table is the most popular and effective way to create a table.\
    \ This method uses a query expression, and the results are stored in a new table\
    \ instead of being displayed as SAS output. This method not only stores the column\
    \ names and their attributes, but also rows of data that satisfy the query expression.\
    \ The next example illustrates creating a new table with a query expression.\n\
    \n# SQL Code\n\n```\nPROC SQL;\nCREATE TABLE HOT_PRODUCTS AS\nSELECT *\nFROM PRODUCTS;\n\
    QUIT;\n```"
