    Users can easily identify all available dictionary tables by accessing the read-only
    DICTIONARIES dictionary table or VDCTNRY SASHELP view. The contents of the DICTIONARIES
    dictionary table and VDCTNRY SASHELP view reveal the names of tables and views.
    The following PROC SQL query specifies the UNIQUE keyword to generate a listing
    of dictionary tables.


    # PROC SQL Code:


    ```

    PROC SQL;

    SELECT UNIQUE MEMNAME

    FROM DICTIONARY.DICTIONARIES;

    ```


    QUIT;


