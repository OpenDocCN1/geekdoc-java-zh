    The next example classifies products (e.g., Laptop/Workstation, Phone, and Software)
    in the PRODUCTS table using a simple CASE expression. A PUT function converts
    the numeric-defined PRODNUM column to a character value, and the SUBSTR function
    then extrapolates the first position in the PRODNUM column for classification
    purposes in the WHEN-THEN logic conditions. Finally, a column heading is assigned
    to the output column with the AS keyword.


    # SQL Code


    ```

    PROC SQL;

    SELECT PRONAME,

    PRODNUM,

    CASE SUBSTR(PUT (PRODNUM, 4.),1,1)

    WHEN ''1'' THEN ''Laptop/Workstation''

    WHEN ''2'' THEN ''Phone''


    ```


