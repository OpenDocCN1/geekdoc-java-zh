    # Deleting More Than One Row in a Table


    Frequently, a row deletion affects more than a single row in a table. In these
    cases, a WHERE clause references a value that occurs multiple times. The following
    example illustrates the removal of a single customer in the PRODUCTS table by
    specifying the product type (PRODTYPE) in the WHERE clause.


    # SQL Code


    ```

    PROC SQL;

    DELETE FROM PRODUCTS

    WHERE UPPERCASE(PRODTYPE) = ''PHONE'';

    QUIT;

    ```


    # SAS Log Results


    ```

    SAS Log Results

