  md: "# Introduction\n\nAfter a table is defined and populated with data, a column\
    \ as well as its structure might need to be modified. The SQL standard provides\
    \ Data Definition Language (DDL) statements to permit changes to a table's structure\
    \ and its data. In this chapter, you will see examples that add and delete columns,\
    \ modify column attributes, add and delete indexes, rename tables, and update\
    \ values in rows of data.\n\n# Modifying Tables\n\nAn important element in PROC\
    \ SQL is its DDL capabilities. From creating and deleting tables (Chapter 5, \"\
    Creating, Populating, and Deleting Tables\") to indexes to altering tables and\
    \ columns, the DDL provides a way to change the definition of one or more tables.\
    \ The ALTER TABLE statement permits columns to be added, modified, or dropped\
    \ in a table with the ADD, MODIFY, or DROP clauses. When a table's attributes\
    \ are modified, the table's structural dynamics also change. The following sections\
    \ examine the various ways tables can be modified in the SQL procedure.\n\n# Adding\
    \ New Columns\n\nAs requirements and needs, a database's initial design might\
    \ require one or more columns to be added. To accomplish this, complete ownership\
    \ of the table must be granted. When you have exclusive access, each new column\
    \ is automatically added at the end of the table's descriptor record. This means\
    \ that the ALTER TABLE statement's ADD clause modifies the table without reading\
    \ or writing data.\n\nSuppose you have a new requirement to improve your ability\
    \ to track the status of inventory levels. It is determined that your organization\
    \ can achieve this new capability by adding a new column to the INVENTORY. The\
    \ ADD clause is used in the ALTER TABLE statement to define the new column, INVENTORY_STATUS,\
    \ and its attributes. The new column's purpose is to identify the following inventory\
    \ status values: \"In-Stock,\"Out-of-Stock,\" and \"Back Ordered.\"\n\n# SQL Code\n\
    \n```\nPROC SQL;\nALTER TABLE INVENTORY\n  ADD inventory_status char(12);\nQUIT;\n\
    ```\n\nOnce the new column is added, the SAS log indicates that 6 columns exist\
    \ in the INVENTORY table."
  merge: -1
  pgno: 232
