    # Changing a Column''s Length


    Column definitions (length, infant, format, and label) can be modified with the
    MODIFY clause in the ALTER TABLE statement. PROC SQL enables a character or numeric
    column to have its length changed. In the next example, suppose that you want
    to reduce the length of the character MANUCITY in the MANUFACTERS table from 20
    bytes to a length of 15 bytes in order to conserve space. The CHAR column-definition
    is used in the MODIFY clause in the ALTER TABLE statement to refine the length
    of the column.


    # SQL Code


    ```

    PROC SQL;

    ALTER TABLE MANUFACTURERS

    MODIFY MANUCITY CHAR(15);

    QUIT;

    ```


    # SAS Log Results


    ```

    PROC SQL;

    ALTER TABLE MANUFACTURERS

    MODIFY MANUCITY CHAR(15);

    NOTE: Table WORK.MANUFACTURERS has been modified, with 4 columns.

    QUIT;

    NOTE: PROCEDURE SQL used:

    real time 0.50 seconds

    ```'
