    # Summarizing Data


    The SQL procedure is a wonderful tool for summarizing (or aggregating) data. It
    provides a number of useful summary (or aggregate) functions to perform calculations,
    descriptive statistics, and other aggregating operations in a SELECT statement
    or HAVING clause. The functions are designed to summarize information and display
    detail about data.


    Without the availability of summary functions, you would have to construct the
    necessary logic using somewhat complicated SQL programming constructs. When using
    a summary function without a GROUP BY clause, (see Chapter 3, "Formatting Output"),
    all the rows in the table are treated as a single group. Consequently, the results
    are often a single row value.


    A number of summary functions are available including functions to count non-missing
    values; determine the minimum and maximum values in specific columns; return the
    range of values; compute the mean, standard deviation, and variance of specific
    values; and other aggregating functions. In the following table, an alphabetical
    list of the available summary functions are'
  merge: -1
  pgno: 80
- img_proc: true
  md: "# Chapter 2: Working with Data in PROC SQL 59\n\ndisplayed and, when multiple\
    \ names for the same function are available, the ANSI-approved name appears first.\n\
    \n| Summary Function | Description |\n| --- | --- |\n| AVG, MEAN | Average or\
    \ mean of values |\n| COUNT, FREQ, N | Aggregate number of non-missing values\
    \ |\n| CSS | Corrected sum of squares |\n| CV | Coefficient of variation |\n|\
    \ MAX | Largest value |\n| MIN | Smallest value |\n| NMISS | Number of missing\
    \ values |\n| PRT | Probability of a greater absolute value of Student's t |\n\
    | RANGE | Difference between the largest and smallest values |\n| STD | Standard\
    \ error of the mean |\n| SUM | Sum of values |\n| SUMWGT | Sum of the weight variable\
    \ values which is 1 |\n| T | Testing the hypothesis that the population mean is\
    \ zero |\n| USS | Uncorrected sum of squares |\n| VAR | Variance |\n\nThe next\
    \ example uses the COUNT function with the (*) argument to produce a total number\
    \ of rows, where data is missing or not. The asterisk (*) is specified as the\
    \ argument to the COUNT function to count all rows in the PURCHASES table.\n\n\
    # SQL Code\n\n```\nPROC SQL;\n  SELECT COUNT(*) AS Row_Count\n  FROM PURCHASES;\n\
    QUIT;\n```"
