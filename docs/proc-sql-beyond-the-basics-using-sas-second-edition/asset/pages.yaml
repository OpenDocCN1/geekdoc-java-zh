  md: "# Chapter 8: Working with Views 307\n\n# Eliminating Redundancy\n\nData redundancy\
    \ commonly occurs when two or more users want to see the same data in different\
    \ ways. To prevent redundancy, organizations should create and maintain a master\
    \ database environment rather than propagate one or more subsets of data among\
    \ their user communities. The latter approach creates an environment that is not\
    \ only problematic for the organization but for its users and customers.\n\nViews\
    \ provide a way to eliminate, or at least, reduce the degree of data redundancy.\
    \ Rather than having the same data in multiple forms, views create a virtual and\
    \ shareable database for all. Problems that are related to accessing and reporting\
    \ outdated information, as well as table and program control, are eliminated.\n\
    \n# Restricting Data Access—Security\n\nAs security issues grow increasingly important\
    \ for organizations around the globe, views offer a powerful alternative in controlling\
    \ or restricting access to sensitive information. Views, like tables, can prevent\
    \ unauthorized users from accessing sensitive portions of data. This is important\
    \ because breaches pose great risk not only to an organization's data resources\
    \ but to the customer as well.\n\nViews can be constructed to show a view of data\
    \ that is different from what physically exists in the underlying base tables.\
    \ Specific columns can be shown while other columns are hidden. This helps prevent\
    \ sensitive information such as salary, medical, or credit card data from getting\
    \ into the wrong rows. Or a view can contain a WHERE clause with any degree of\
    \ complexity to restrict what appears for a group of users while hiding rows.\
    \ In the next example, a view called SOFTWARE_PRODUCTS VIEW displays all columns\
    \ from the original table except the product (PROCOST) column, and restricts all\
    \ rows except “Software” from PRODUCTS table.\n\n# SQL Code\n\n```\nPROC SQL;\n\
    CREATE VIEW SOFTWARE_PRODUCTS_VIEW AS\n  SELECT prodnum, prodname, manum, prodtype\n\
    \  FROM PRODUCTS\n  WHERE UPPERCASE(PRODTYPE) IN ('SOFTWARE');\n\nQUIT;\n```\n\
    \nLafler, Kirk Paul. PROC SQL: Beyond the Basics Using SAS®, Second Edition. Copyright\
    \ 2013, SAS Institute, Inc.\nCary, North Carolina, USA. ALL RIGHTS RESERVED. For\
    \ additional SAS resources, visit support.sas.com/bookstore."
  merge: -1
