  md: '# About The Author


    ![](img/9d3e4d8fa063e50a0c9985e34cf9d6e8_19_0.png)


    Kirk Paul Lafler is consultant and founder of Software Intelligence Corporation
    and has been using SAS since 1979. He is a SAS Certified Professional, provider
    of IT consulting services, trainer to SAS users around the world, and sasCommunity.org
    Advisory Board member. The author of 5 books, Kirk has written more than 500 papers
    and articles, has been an invited speaker and trainer at 400+ SAS users group
    conferences and meetings, and is the recipient of nearly two dozen “Best” contributed
    paper, hands-on workshop (HOW), For more than three decades he has supported the
    SAS users community by chairing the Southern California SAS Users Group (SoCalSAS),
    starting and chairing the San Diego SAS Users Group (SANDS), and co-chairing academic
    sections in-house, local, regional, and SAS Global Forum conferences, mentoring
    users, and contributing to his popular SAS Tips, “Kirk’s Corner of Quick and Simple
    Tips,” which appears regularly in several SAS Users Group newsletters and websites.


    Learn more about Us by visiting his author page http://support.sas.com/lafler.html.
    There you can download free chapters, access example code and data, read the latest
    reviews, get updates, and more.'
