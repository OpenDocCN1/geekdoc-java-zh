- img_proc: true
  md: '# Introduction


    Expressions in the SQL procedure can be simple or complex and are represented
    by a combination of columns, symbols, operators, functions, constants, and literals.
    Specified in SQL statements and clauses, expressions are typically used in conditional
    logic constructs to test or compare a value against another value. The application
    of an expression in a CASE expression allows individual rows of data to be processed
    and grouped using one or more expressions. In particular, data can be decoded
    and reshaped to evaluate the data analysis and processing perspective.


    # Conditional Logic


    As experienced SQL programmers know, it is often necessary to test and evaluate
    conditions as true or false. The evaluation of a condition determines which of
    the alternate paths a program will follow. Conditional logic in the SQL procedure
    is frequently implemented in a WHERE clause to reference constants and relationships
    among columns and values. The SQL procedure also allows the identification and
    assignment of data values in SELECT statement using case-expressions (which are
    described in the next section). To show how constants and relationships are referenced
    in a WHERE clause, a simple example is illustrated.


    The next example shows a WHERE clause subsetting products from the PRODUCTS table
    that cost less than $400.00. During execution, the expression evaluates to true
    when the value of PROCOST is less than $400.00. Otherwise, when the value of PROCOST
    is greater or equal to $400.00, the expression evaluates to false. This is an
    important concept because data rows are only selected when the WHERE clause evaluates
    to true.


    # SQL Code


    ```

    PROC SQL;

    SELECT *

    FROM PRODUCTS

    WHERE PROCOST < 400.00;

    QUIT;

    ```


    In the next example, the following relation evaluates whether the cost of a product
    (PROCOST) is greater than $400.00. When the WHERE clause evaluates to true, which
    means that PROCOST is greater than $400.00, then the rows of data are selected.
    Otherwise, when the value is less or equal to $400.00, the expression evaluates
    to false.


    # SQL Code


    ```

    PROC SQL;

    SELECT *

    FROM PRODUCTS

    WHERE PROCOST > 400.00;

    QUIT;

    ```'
  merge: -1
  pgno: 144
- img_proc: true
  md: 'A relation can also be used with nonnumeric literals and nonnumeric columns.
    In the next example, a case-sensitive expression is constructed to represent the
    type of product (PRODYPE) made by a manufacturer. When evaluated, a condition
    of true or false is produced depending on whether the current value of PROTYPE
    is identical (character-by-character) to the literal value "Software". When a
    condition of true occurs, the rows of data satisfying the expression are selected;
    otherwise, they are not selected.


    # SQL Code


    ```

    PROC SQL;

    SELECT *

    FROM PRODUCTS

    WHERE PRODYPE = "Software";

    QUIT;

    ```


    To ensure a character-by-character match of a character value, the previous expression
    could be specified with the UPCASE function as follows.


    # SQL Code


    ```

    PROC SQL;

    SELECT *

    FROM PRODUCTS

    WHERE UPCASE(PRODYPE) = "SOFTWARE";

    QUIT;

    ```


    When the relations < and > are for nonnumeric values, the issue of implementation-dependent
    collating sequence for characters comes into play. For example, "A < B" is true,
    "Z < A" is true, "B < A" is false. For more information about character collating
    sequences, refer to your operating system documentation.


    # CASE Expressions


    In the SQL procedure, a CASE expression provides a way of determining what the
    resulting value will be from all the rows in a table (or view). Similar to a DATA
    step SELECT statement or IF-THEN/ELSE statement), a CASE expression is based on
    some condition and the condition uses a WHEN-THEN clause to determine what the
    resulting value be. An optional ELSE expression can be specified to handle an
    alternative if none of the expression(s) identified in the WHEN condition(s) is
    satisfied.


    The SQL supports supports forms of CASE expressions: simple and searched. CASE
    expressions can be specified in a SELECT clause, a WHERE clause, an ORDER BY clause,
    a HAVING clause, a join construct, and anywhere an expression can be used. A CASE
    expression must be a valid PROC expression and conform to syntax rules similar
    to DATA step SELECT-WHEN statements. Before specific CASE expression examples
    are shown, it''s important to illustrate the basic syntax, which is shown below.'
  merge: -1
  pgno: 145
- img_proc: true
  md: "# 124 PROC SQL: Beyond the Basics Using SAS, Second Edition\n\n```\nCASE <\
    \ <column-name>\n  WHEN when-condition THEN result-expression\n  <WHEN when-condition\
    \ THEN result-expression> ...\n  <ELSE result-expression>\nEND\n```\n\nThe CASE\
    \ syntax contains everything from CASE to END. A column-name can optionally be\
    \ specified as part of the CASE expression. If present, it is automatically made\
    \ available to each WHEN condition. If it is not specified, the column name must\
    \ be coded in each WHEN condition. Let's examine how a CASE expression works.\n\
    \nOne or more WHEN conditions can be specified in a CASE expression and evaluated\
    \ in the order. If a WHEN condition is satisfied by a row (or view), it is considered\
    \ \"true\" and the result expression following the WHEN is processed. The remaining\
    \ WHEN conditions in the CASE expression are skipped. If the WHEN condition evaluation\
    \ continues until a \"true\" condition is found. Or, in the event that all WHEN\
    \ conditions are \"false\", it executes the ELSE expression and assigns its value\
    \ to the CASE expression. A missing value is assigned to a CASE expression when\
    \ ELSE is not specified and each WHEN condition is \"false\".\n\n# Simple Case\
    \ Expression\n\nAs its name implies, a simple CASE expression provides a useful\
    \ way to perform the simplest of comparisons. The syntax requires a column name\
    \ from an underlying table to be specified as part of the CASE expression. This\
    \ not only eliminates having to continually repeat the column name in each condition,\
    \ it also reduces the number of keystrokes, making the code easier to read (and\
    \ support). CASE expressions possess the following features:\n\n+   * Allows equality\
    \ checks.\n* Evaluates the WHEN conditions in the order specified.\n* Evaluates\
    \ the input-expression for each WHEN condition.\n* Returns the result-expression\
    \ of the first input-expression that evaluates to \"true.\\n* If no input-expression\
    \ evaluates to \"true,\" then the ELSE condition is processed.\n* When an ELSE\
    \ condition is not specified, a NULL value is assigned.\n\n# Simple CASE Expression\
    \ in a SELECT Clause\n\nTo show how a simple CASE expression works, an assignment\
    \ in a SELECT clause is illustrated. The objective calls for the assignment of\
    \ \"East\" to manufacturers in Florida, \"Central\" to manufacturers in Texas,\
    \ \"West\" to manufacturers in California, or \"Unknown\" to manufacturers not\
    \ residing in Florida, Texas, and California. The manufacturer's state of residence\
    \ (MANSTAT) column is specified in the CASE expression along with its associated\
    \ WHEN conditions with assigned values. Finally, a column heading of Region is\
    \ assigned to the derived output using the AS keyword."
  merge: -1
  pgno: 146
- img_proc: true
  md: '# SQL Code


    ```

    PROC SQL;

    SELECT MANNAME,

    MANUSAT,

    CASE MANUSAT

    WHEN ''CA'' THEN ''West''

    WHEN ''FL'' THEN ''East''

    WHEN ''IX'' THEN ''Central''

    ELSE ''Unknown''

    END AS AS Region

    FROM MANUFACTERS;

    QUIT;

    ```


