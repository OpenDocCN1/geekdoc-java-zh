    # Summary


    +   1. A CASE expression is a construct in PROC SQL that is used to evaluate whether
    a particular condition has been met (see the "CASE Expressions" section).

    2. A CASE expression can be used to conditionally process a table’s rows (see
    the "CASE Expressions" section).

    3. A single value is returned from its evaluation of each row in a table (see
    the "CASE Expressions" section).

    4. Logic conditions can be combined using the AND and OR logical operators (see
    "Logic and Nulls" section).

    5. A missing or NULL value is returned when an ELSE expression is not specified
    and WHEN condition is "false" (see the "Logic and Nulls" section).

    6. A missing value is not the same as a value of 0 (zero), or as a blank character
    because it represents a unique value or a lack of value (see the "Logic and Nulls"
    section).

    7. PROC SQL can be used with the SAS macro facility to perform common and repetitive
    tasks (see the "Interfacing PROC SQL with the Macro Language" section).

    8. Simple, but effective, user-defined macros can be created with the SQL procedure
    for all uses to use (see the "Building Macro Tools and Applications" section).

    -value macro variables are defined using the INTO clause (see the "Creating a
    Macro Variable with Aggregate Functions" section).

    10. Value-list macro variables can be defined using the INTO clause and SEPARATED
    BY keyword (see the "Controlling the Selection and Population of Macro Variables
    with a WHERE Clause" section).'
