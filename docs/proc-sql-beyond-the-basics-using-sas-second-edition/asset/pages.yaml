    # Deleting Tables That Contain Integrity Constraints


    As previously discussed in this chapter, to ensure a high-level of data integrity
    in a database environment, the SQL standard permits the creation of one or more
    integrity constraints to be imposed on a table. The SQL standard, a table that
    contains one or more constraints cannot be deleted without first dropping the
    constraints. This behavior further safeguards and prevents the occurrence of unanticipated
    surprises such as the accidental deletion of primary or supporting tables.


    In the next example, the SAS log shows that an error is produced when an attempt
    to drop a table containing an ON DELETE REST referential integrity constraint
    is performed. The referential integrity constraint causes the DROP TABLE statement
    to fail, which results in the INVENTORY table not being deleted.'
