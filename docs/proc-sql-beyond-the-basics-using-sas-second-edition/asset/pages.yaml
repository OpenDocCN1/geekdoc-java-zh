    \  END\nAS OfficeEquipment,\n  CASE WHEN SUBSTR(PUT(P.PRODNUM, 4.),1,1) = '5'\
    \ THEN\n  CASE WHEN INVENQTY > 0 THEN INVENQTY\n  END\nAS ComputerSoftware\nFROM\
    \ PRODUCTS P,\n  INVENTORY I\nWHERE P.PRODNUM = I.PRODNUM\n  ORDER BY PRODNUM;\n\
    \nQUIT;\n```"
