    \ SQL procedure. Four complex query constructs are illustrated in this chapter.\n\
    \n+   Inner Joins\n A maximum of 256 tables can be referenced in a FROM and optional\
    \ WHERE clause of a SELECT statement.\nOuter Joins\n A maximum of two tables are\
