  md: 'The program distinguishes between notes and appointments. A note is any text
    entered for a specific date, and there can be more notes for the same date. An
    appointment is a short message relating to a specific time (clock) and the program
    must be able to automatically notifies the user when the appointment occurs. Notes
    will be saved until the user manual delete them. Appointments should be automatically
    deleted when the time is exceeded, but maybe there should be an option that an
    appointment should be stored after the time is exceeded.


    Regarding appointments it may be able to make an appointment for a specific date
    and for a specific time. There may then be several appointments the same day,
    and an appointment is in principle plain text. An appointment can span multiple
    days. An appointment can also have a start time, an end time, or, if so, the program
    should come with a warning if the timing conflicts. When the time of an appointment
    occurs, the program must come with a warning that must appear in the user interface.
    It is adopted


    +   1. The warning should appear at the day''s start (when the computer is turned
    on)

    2. 1 hour before the appointment occurs

    3. 15 minutes before the appointment occurs

    4. 5 minutes before the appointment occurs

    5. when the appointment occurs, and the appointment should be deleted


    # Functions:


    Navigate the calendar:


    +   - Shift to previous year

    - Shift to previous month

    - Shift to next month

    - Shift to next year

    - Enter year month and the calendar must shift to that month


    The program must be able to save a calendar as a comma delimited text file with
    the following format:


    year; month number; month name; day in month; day name; week number {}; holiday;


    and an example could be


    ```

    2012;4;April;1;Sunday;14;Palm Sunday

    2012;4;April;2;Monday;14;

    2012;4;April;3;Tuesday;14;

    ```'
