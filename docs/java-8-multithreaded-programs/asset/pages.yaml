    \ to obtain permission for the resource, while all licenses are used, is blocked\
    \ until another thread releases the license. A semaphore is an integer whose value\
    \ is not negative and can be counted up or down. If the semaphore can take only\
    \ the values 0 and 1, we speak of a binary semaphore, and may the value be greater\
    \ than 1, it is called a counting semaphore. This means that there is a resource\
    \ controlled with a counting semaphore, there are several threads at a time (determined\
    \ by semaphore) that can access the resource. The following program will show\
    \ how to use a semaphore:\n\n```\npackage thread1;\n\nimport java.util.*;\nimport\
