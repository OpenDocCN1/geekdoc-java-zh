    # # 10 SWING


    If you have a GUI application, threads generally can create problems, where the
    user interface is not updated correctly, and you may even get an exception. In
    this section I will show how to use threads within an application written using
    swing.


    Swing is single-threaded, and if you do nothing else, what is the case in all
    the GUI programs in this book until this place, where it happens all in a single
    thread. The thread that renders the graphics (windows and components), that deal
    with events, is called the event dispatcher thread and is commonly referred to
    as EDT. This thread processes all events that come from the underlying event queue
    and calls the component''s event handlers, so they are performed by EDT. This
    means that everything drawing in the window takes place in this thread. This also
    means that to be sure that a Swing program works correctly, you have to be careful
    how your code interacts with the EDT, and especially pay attention to


    +   1. that it is always EDT, that creates GUI components

    2. that you must not perform code that slows EDT


    Since Swing is single-threaded, should a Swing program always create the GUI part
    in the EDT thread and never create components in another thread, nor in the primary
    thread. Most Swing components and including JFrame is not thread safe, and use
    these components from a different thread than EDT, there is a risk that the user
    interface is not updated correctly.


