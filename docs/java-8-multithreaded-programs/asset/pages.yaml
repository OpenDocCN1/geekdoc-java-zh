    The stack is used to maintain information on the methods being performed, every
    time you call a method the runtime system creates an activation block on the stack,
    that contains local variables, parameters and return value and the operand stack
    used by the runtime system. An activation block is created when a method is called
    and removed again when the method terminates for one reason or another. Each thread
    has its own stack, and for each stack there is only one activation block which
    is active at a time, and it is the block for the method the thread is currently
    performing. Just as for the heaps the specification nothing about how the stack
    must be implemented, and it can be of fixed size or expand dynamically, requires
    a thread more stack than is available, the program will stop with a StackOverflowError
    exception.


    The method area is shared by all threads and are used for information on methods
    and their bytecode, data fields and constructors.


    JVM has registers in the same way as a physical machine, They reflect the virtual
    machine''s current state and are constantly updated, as the code is executed.
    The main register is perhaps the program counter which contains the address of
    the next JVM instruction to be performed. Other data is a pointer to the method
    currently performed, a pointer to the first local variable for the current method,
    and a pointer to the top of the operand stack.


