  md: '# JAVA 8:MULTITHREADED PROGRAMS


    # APPENDIX A


    # JVM IMPLEMENTATIONS


    There are several different implementations of JVM, and the most important is
    probably the JVM from Microsystems, and is often regarded as the reference implementation.
    After Oracle acquired Sun, it is now their JVM, which is regarded as the reference
    implementation, but there are certainly others who have implemented the JVM and
    including IBM, Apple and Hewlett-Packard. However, does the specification of JVM,
    that Java programs will behave the same regardless of which virtual machine they
    run.


    2006 changed Sun strategy to control the standard and reference implementation
    themselves to instead a public open model. This meant several things, including:


