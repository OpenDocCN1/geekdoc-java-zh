  md: "# JAVA 8:MULTITHREADED PROGRAMS SYNCHRONIZATION OF THREADS\n\nConsider the\
    \ following program which initializes a variable to the square root of 2, and\
    \ the print result:\n\n```\npackage thread07;\n\npublic class Thread07\n{\n  \
    \  private static double root = 0;\n\n    public static void main(String[] args)\n\
    {\n        (new Thread(() -> { root = sqrt2(); })).start();\n        System.out.println(root);\n\
    \    }\n\n    private static double sqrt2()\n    {\n        double y = 0;\n  \
    \      for (int i = 0; i < 100000000L; i++) y = Math.sqrt(2);\n        return\
    \ y;\n    }\n```\n\nThe method, which determines the square root of 2 is once\
    \ again a loop whose sole purpose is that the calculation is performed in its\
    \ own thread, and when the primary thread prints the result, the result will be\
    \ 0, of course is wrong. The reason is that the primary thread does not wait for\
    \ the thread that performs the calculation, and the problem could be solved by\
    \ a join(). However, you can solve the problem by synchronized and thus with a\
    \ lock:\n\n```\npackage thread08;\npublic class Thread08\n{\n    private static\
    \ double root = 0;\n    private static final Object lock = new Object();\n\n \
    \   public static void main(String[] args)\n{\n        (new Thread(() -> { synchronized(lock)\
    \ { root = sqrt2(); }) })).start();\n        try { Thread.sleep(10); } catch (Exception\
    \ ex) {}\n        synchronized(lock) { System.out.println(root); }\n    }\n```"
