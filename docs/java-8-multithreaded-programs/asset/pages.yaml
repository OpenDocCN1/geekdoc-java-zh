  md: "# 11.3.3 DESIGN OF THE DAL LAYER\n\nData for notes, appointments and anniversaries\
    \ should be saved persistent, and it is decided to do that by object serialization.\
    \ Since the program is intended as a personal tool it can be cumbersome to install\
    \ the program, if you must first create a database that the program has to connect\
    \ to. If there are relatively few notes and appointments, it is also unnecessary\
    \ to use a database and it is simpler to serialize the data to a file.\n\nThe\
    \ basis is the following interface, and the methods names should explain what\
    \ they are used for:\n\n```\npackage calendar.dal;\n\nimport java.util.List;\n\
    \nimport calendar.models.*;\n\npublic interface Repository {\n    public List<Note>\
    \ getNotes();\n    public List<Note> getNotes(Date date);\n    public List<Note>\
    \ getNotes(Date from, Date to);\n    public boolean addNote(Note note);\n    public\
    \ boolean updateNote(Note note);\n    public boolean deleteNote(int id);\n   \
    \ public boolean deleteNotes(Date date);\n    public boolean deleteNotes(Date\
    \ from, Date to);\n    public List<Anniversary> getAnniversaries();\n    public\
    \ List<Anniversary> getAnniversaries(Date date);\n    public boolean addAnniversary(Anniversary\
    \ anniversary);\n    public boolean updateAnniversary(Anniversary anniversary);\n\
    \    public boolean deleteAnniversary(int id);\n    public boolean deleteAnniversaries(Date\
    \ date);\n    public boolean deleteAnniversaries(Date from, Date to);\n    public\
    \ List<Appointment> getAppointments();\n    public List<Appointment> getAppointments(Date\
    \ date);\n    public List<Appointment> getAppointments(Date from, Date to);\n\
    \    public boolean addAppointment(Appointment appointment);\n    public boolean\
    \ updateAppointment(Appointment appointment);\n    public boolean deleteAppointment(int\
    \ id);\n    public boolean deleteAppointments(Date date);\n    public boolean\
    \ deleteAppointments(Date from, Date to);\n}\n```\n\nThe program must then instantiate\
    \ a concrete repository class, what I will call IORep."
