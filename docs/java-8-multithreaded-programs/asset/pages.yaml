  md: "# JAVA 8:MULTITHREADED PROGRAMS SWING\n\nAfter you've accepted the file, it\
    \ takes a relatively long time before the list box is updated, and in that time\
    \ the program does not respond. You can change the window size, but you will find\
    \ that the window is not redrawn. It happens only when the event handler is completed.\
    \ The program has – at least two problems. First, it is carried out the code that\
    \ creates the window and its components, and the event handler in the two different\
    \ threads. As long as the program does not use other threads, it will probably\
    \ not cause problems, but it is not consistent with how a Swing program should\
    \ be written. Second, the program has a time when it does not respond to user\
    \ actions (unnecessarily long because of the method busy()), but overall it is\
    \ a requirement that a GUI application must react sensitively to the user's interaction\
    \ with the program.\n\nI would start by solving the first problem, and in the\
    \ project Thread30 the main program is in the following:\n\n```\npackage thread30;\n\
    \npublic class Thread30 {\n    public static void main(String[] args) {\n    \
    \    javax.swing.SwingUtilities.invokeLater(() -> new MainView());\n    }\n}\n\
    ```\n\nThis means that the window is now created by the event dispatcher thread\
    \ – the EDT thread. The class MainView is unchanged (except another text in the\
    \ title bar), and if you run the program, you will see that the window is created\
    \ in the same thread that performs the event handler.\n\nThe class SwingUtilities\
    \ has a number of static methods that are used in a variety of contexts in Swing.\
    \ For threads these are basically of three methods:\n\n+   1. invokeAndWait()\
    \ has a Runnable object as a parameter and executes the current run() method in\
    \ the thread EDT. The method is carried out synchronism with EDT, and invokeAndWait()\
    \ blocks the current thread until the EDT has processed all pending events. invokeAndWait()\
    \ is used when the program must update the UI from a different thread than EDT.\
    \ This method should never be called from EDT."
