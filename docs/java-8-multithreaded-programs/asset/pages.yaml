  md: "# 5 STOP A THREAD\n\nThe Thread class has a method stop(), which is used to\
    \ stop a running thread. This method is not secure and is defined deprecated,\
    \ and you should avoid using the method. Instead you must yourself implement the\
    \ necessary logic to stop the thread. There can be many solutions, by the following\
    \ program shows an option:\n\n```\npackage thread10;\n\nimport java.util.*;\n\n\
    public class Thread10\n{\n    public static void main(String[] args)\n{\n    \
    \    ArrayList<AThread> threads = new ArrayList();\n        for (int i = 0; i\
    \ < 5; i++) threads.add(new AThread());\n        for (AThread th : threads) th.start();\n\
    \        try {\n            Thread.sleep(1000);\n        }\n        catch (InterruptedException\
    \ ie) {\n            for (AThread th : threads) th.stopThread();\n        }\n\
    \    }\n}\n\nclass AThread extends Thread\n{\n    private volatile boolean stopped\
    \ = false;\n\n    public void run()\n    {\n        while (!stopped) {\n     \
    \       System.out.println(Thread.currentThread().getId() + \" is running\");\n\
    \        }\n    }\n\n    public void stopThread()\n    {\n        stopped = true;\n\
    \    }\n}\n```"
