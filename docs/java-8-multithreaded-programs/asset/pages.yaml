  md: "# 3 SYNCHRONIZATION OF THREADS\n\nAs shown in the initial examples it is easy\
    \ to create and use threads in a program, and so long that the individual threads\
    \ do not share resources, the use of threads are also without major problems,\
    \ but if threads share common resources, they can cause concurrency problems that\
    \ must be solved by the programmer, and it absolutely not to be simple. The typical\
    \ problem is the so-called race conditions, where the result of a calculation\
    \ depends on the timing of the threads access to a shared resource, and the classic\
    \ example is that two or more threads use a common data element (a variable),\
    \ and at least one change the value of the variable, but without the threads coordinates\
    \ their use of the data item. As an example, consider the following method:\n\n\
    ```\npublic int getId()\n{\n    return counter++;\n}\n```\n\nI joined MITAS because\
