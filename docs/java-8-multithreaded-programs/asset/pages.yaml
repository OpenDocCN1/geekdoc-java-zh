  md: "JAVA 8:MULTITHREADED PROGRAMS WAIT() AND NOTIFY()\n\n# 6 WAIT() AND NOTIFY()\n\
    \nWhen a thread of one reason or another is blocked, it will lose the processor\
    \ and is placed in a queue of waiting threads. A thread is blocked because one\
    \ or other condition occurs (for example because it cannot get a lock) and must\
    \ then be notified again when the blocking condition is no longer there (for example\
    \ another thread releases a lock). An object has two methods, so the thread that\
    \ uses the object, can block itself, and so the thread can give waiting threads\
    \ a message that they must continue. The methods are wait() and notify().\n\n\
    A wait() means that the thread is blocked until another thread performs notify()\
    \ or notifyAll(). There are also versions of wait(), where you enter a time, telling\
    \ how long the thread maximum waits and what is a timeout. notify() reactivates\
    \ (wakes) a waiting thread (a thread waiting on that's lock). If there are multiple\
    \ threads waiting on that object, you cannot assume anything about the thread\
    \ that comes to life. It is determined by the system. The method notifyAll() will\
    \ contrast awaken threads waiting for the current object.\n\nAs a classic example\
    \ of these methods I will look at the so-called producer-consumer problem. The\
    \ idea is that a thread (producer) update a resource while another thread (consumer)\
    \ reads the resource's value. It must be such that the consumer reads all values,\
    \ but only readem them once. This requires that the two threads are synchronized.\n\
    \n```\npackage thread1;\n```\n\n```\npublic class Thread1\n{\n    public static\
    \ void main(String[] args)\n{\n        Shared shared = new Shared(); // the shared\
    \ resource\n        new Producer(shared).start();\n        new Consumer(shared).start();\n\
    \    }\n}\n```\n\n```\n// Represents a shared resource, as an encapsulation of\
    \ a char.\nclass Shared\n{\n    private char value; // the resource\n    // indicates\
    \ where the resourcen must be updated\n    private volatile boolean writeable\
    \ = true;\n```\n\nDownload free eBooks at bookhoon.com"
