  md: "JAVA 8:MULTITHREADED PROGRAMS\n\nINTRODUCTION\n\n# # INTRODUCTION\n\nWhen you\
    \ start a program it creates a thread, as compared to the runtime system is responsible\
    \ for carrying out the program's statements. You can think of a thread as a part\
    \ of the program code that has its own life and can be performed independent of\
    \ the runtime system in competition with other applications or a thread from the\
    \ same program. In order for a thread to run and execute anything, it must have\
    \ a processor to run on, and even though computers today have multiple processors,\
    \ there will always be many more threads than there are processors. A thread has\
    \ only a processor in a very short time, after which it is interrupted by the\
    \ system and in a queue while another thread get the processor. Since all threads\
    \ in this with very short intervals will have a processor available, it seems\
    \ to use us if all threads are running in parallel to each other.\n\nWhen you\
    \ start a program so created, as mentioned a thread to execute the program's instructions.\
    \ This thread is called the primary thread. An application can, however, create\
    \ multiple threads, and many programs do, and a GUI program will at least create\
    \ two threads. The idea of allowing a program to create multiple threads is to\
    \ achieve parallelism, so for users the program is doing several things simultaneously.\
    \ For example word processor can perform a spell checking while the user continues\
    \ entering text. The subject of this book is to show how Java creates a thread\
    \ and the challenges it leads to, but also to show what we can use threads in\
    \ practice. Indeed, from the programmer some challenges are attached to threads\
    \ and the book contains many technical details.\n\n# ## 1.1 CREATE A THREAD\n\n\
    I'll start by showing how a program can create threads, and the following program\
    \ creates four threads beyond the primary thread:\n\n```\npackage thread01;\n\n\
    import java.util.*;\n\npublic class Thread01 {\n    public static void main(String[]\
    \ args) {\n        (new Thread(new Worker1())).start();\n        new Worker2();\n\
    \        (new Thread(new Runnable() {\n            public void run() { Todo.work(2,\
    \ 5); }\n        })).start();\n        (new Thread(() -> Todo.work(2, 5))).start();\n\
    \    }\n```\n\nDownload free eBooks at ebook.com"
