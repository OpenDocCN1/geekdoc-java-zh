  md: "# JAVA 8:MULTITHREADED PROGRAMS SYNCHRONIZATION OF THREADS\n\nwhere counter\
    \ is an instance variable, and such a method is not thread safe. Apparently, thenmethod\
    \ performs only one operation, but there are several\n\n+   1. save a copy of\
    \ the variable counter\n2. add 1 to the value or the variable\n3. save the result\
    \ in counter\n4. returns the value, that has been saved\n\nIf, you example imagine\
    \ that two threads calls this method, and counter has the value\n10, the following\
    \ can happen: The first thread performs the first of the above instructions,\n\
    after which it is interrupted. Comes the second thread and performs the first\
    \ three\noperations. Then, the counter has the value 11. If the second thread\
    \ now is interrupted,\nit will update counter so that it has\nvalue 11 (and thus\
    \ overwrite the changes that the other thread has done). The result\nis that both\
    \ threads will return 11, which is an incorrect result, and the value of counter\n\
    is incorrect. The correction is the need for a mechanism that can control the\
    \ threads\nfinished their work, or at least that thread may not use the method\
    \ before the\n is completed.\n\nTo increase performance using both the Java virtual\
    \ machine (JVM) and the operating\nsystem cache memories, they keep copies of\
    \ variables. This can also cause problems,\neach thread possible has their own\
    \ copy of a variable. If a thread modifies a variable,\nthere is a risk that it\
    \ is merely the copy that is updated, and without the other threads\nbeing aware\
    \ of it, and they updates their own copy. It is also an issue multithreaded\n\
    applications must relate to.\n\nThe solution to these challenges is synchronization\
    \ and locks, which ensures that the two\nor more threads can not simultaneously\
    \ execute a critical region, which is a number of\noperations to be performed.\
    \ Sometimes people talk about mutual exclusion as a\nthread is prevented to perform\
    \ a critical region, as another thread is performing. A critical\nregion is defined\
    \ by the word synchronized, and in addition to ensure that other threads\ncannot\
    \ access the critical region it also ensures that variables are are synchronized\
    \ with\nmemory, when the region ends. Each Java object is associated with a so-called\
    \ monitor,\nwhich has a lock which only one thread may have, and if a thread has\
    \ a lock, other threads\ncannot apply the critical region before the thread that\
    \ has is releasing it. There\nis only one thread which can have the lock, and\
    \ if a different thread attempts to get the\nlock, it will be blocked until the\
    \ first release the lock.\n\nDownload free eBooks at bookhoon.com"
