  md: '# FOREWORD


    This book is the eighth in a series of books on software development. The programming
    language is Java, and the language and its syntax and semantics fills obviously
    much, but the books have also largely focus on the process and how to develop
    good and robust applications. This book deals with threads, and how you Java can
    synchronize threads that share resources. The use of threads is an important issue
    in programming, but it is also a technical area to which many attached details.
    The book has primarily focus on programming and the language Java, and only in
    the final example, there is again focusing on system development and thus the
    process. After reading the book the reader should be able to use threads in practice
    and have an understanding of where threads can be used in practical programming.
    The book requires knowledge of programming and Java corresponding to the content
    of the first four books in this series and in the interests of the final example
    is also assumed knowledge of the contents of the previous book, which deals with
    system development. The book ends with an appendix that gives a general introduction
    to the Java virtual machine JVM and what it is.


    As the title says this series of books deals with software development, and the
    goal is to teach the reader how to develop applications in Java. It can be learned
    by reading about the subject and by studying sample programs, but most importantly
    by yourself to do it and write your own programs from scratch. Therefore an important
    part of the books is exercises and problems, where the reader has to write programs
    that correspond to the substance being treated in the books. All books in the
    series are built around the same skeleton and will consist of test and exercises
    and problems that are placed in the text where they naturally belongs. The difference
    between exercises and problems is that the exercises deals with repetitions of
    the substance that is presented in the text, and furthermore it is relatively
    accurately described what to do. Problems are in turn more loosely described,
    and are typically a little bigger and there is really clear best solution. These
    are books to be read from start to finish, but the many code examples, including
    exercises and problems play a central role, and it is important that the reader
    predict in detail the code to the many examples and also solves the exercises
    and problems or possibly just studying the recommended solutions.


    All books end with one or two larger sample programs, which focus primarily on
    process and an explanation of how the program is written. On the other hand appears
    the code only to a limited extent – if all and the reader should study the finished
    program perhaps while testing the program. In addition to show the development
    of programs that are larger than the examples, which is otherwise presented, the
    main of the concluding examples also is to show program examples from varying
    fields of application.'
