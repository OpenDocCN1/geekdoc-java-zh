  md: "# JAVA 8:MULTITHREADED PROGRAMS INTRODUCTION\n\n```\nprivate static void work()\
    \ {\n{\n    double y;\n    for (int i = 0; i < 1000000L; ++i) y = Math.cos(Math.sqrt(rand.nextDouble()));\n\
    }\n}\n```\n\nI will start with the class ToDo, which in principle do not have\
    \ anything to do. The class represents a work that the computer has to perform,\
    \ and the important thing is that it is a work that takes time, and strains the\
    \ machine's processor. The private method work() performs works without using\
    \ anything but the work which consists of performing one million calculation in\
    \ which a calculation is to perform a mathematical function which uses many CPU\
    \ instructions. The second version of the method work() (the public version) has\
    \ two parameters, and call the private work() a number of times determined by\
    \ these parameters. The method first prints a message on the screen, and after\
    \ the work is completed, it prints another message. For the message you should\
    \ note the statement\n\n```\nlong id = Thread.currentThread().getId();\n```\n\n\
    A thread is identified by an ID, which is an integer and is assigned when the\
    \ thread is created. The primary thread has number 1, while custom threads are\
    \ assigned a number from 10 onwards. When the method work() prints a message (the\
    \ method print()), it prints the current thread ID (the thread that performs the\
    \ method print()).\n\nIn Java a thread is represented by the class Thread. The\
    \ class Worker2 inherits the class Thread and represents as such a thread. The\
    \ class has a method called run() and it is the method that executes when the\
    \ thread is started, and in this case it happens in the constructor of the class\
    \ Worker2. It is the programmer of a Thread that must override the method run()\
    \ and determine what the thread has to perform and the thread runs until the method\
    \ run() terminates. In this case, the thread performs the method work() in the\
    \ class ToDo.\n\nThe class Thread implements the interface Runnable, which alone\
    \ defines the method run(). Another way to define a thread is to transfer a Runnable\
    \ object as a parameter to the Thread class's constructor and in this way tell\
    \ what kind of run() method to be executed. The class Worker1 is a simple class\
    \ that implements Runnable and must implement the method run(), and the class\
    \ defines then Runnable objects. In this case, the method run() performs the same\
    \ as in the thread class Worker2."
