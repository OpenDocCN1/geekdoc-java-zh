  md: "# 8.7 LOCKS\n\nAs seen in the previous chapter, Java allows to synchronize\
    \ threads so that threads can safely updating shared objects, and so that a thread's\
    \ updating of an object is visible to all other threads. This is done by placing\
    \ code in a critical region where you can ensure mutual exclusion using locks.\
    \ Each object is associated with a lock in the form of a monitor, which ensures\
    \ that only one thread at a time, performs the tasks in a critical region. Thread\
    \ can only enter a critical region and obtain the lock if it is not used by another\
    \ thread, and if it is the current thread is blocked until another thread exits\
    \ the critical region and releases the lock. This mechanism will also ensure that\
    \ when a thread locks a critical region, that values of shared variables stored\
    \ in memory also if necessary updates copies in a cache. The opposite happens\
    \ when a thread exits the critical region and releases the lock, the cached values\
    \ are written to memory.\n\nTo facilitate the work synchronization tools defines\
    \ more interfaces and classes that will make it easier to work with locks, and\
    \ as an example uses the following program as a lock:\n\n```\npackage thread21;\n\
    \nimport java.util.concurrent.*;\nimport java.util.concurrent.locks.*;\n\npublic\
    \ class Thread21 {\n    public static void main(String[] args) {\n        ExecutorService\
    \ executor = Executors.newFixedThreadPool(3);\n        final ReentrantLock lock\
    \ = new ReentrantLock();\n        executor.execute(new Worker(\"A\", lock));\n\
    \        executor.execute(new Worker(\"B\", lock));\n        executor.execute(new\
    \ Worker(\"C\", lock));\n        try {\n            executor.awaitTermination(10,\
    \ TimeUnit.SECONDS);\n        } catch (Exception ex) {\n        }\n        executor.shutdownNow();\n\
    \    }\n```"
