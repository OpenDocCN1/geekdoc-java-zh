  md: '# JAVA 8:MULTITHREADED PROGRAMS CALENDAR


    With these classes in place, I can write the code for maintenance of notes. First
    there are changes in the class MainView, so it opens a popup menu if you right-click
    on a day in the calendar. The menu has three options:


    +   1. Create note

    2. Create appointment

    3. Create anniversary


    A popup menu has the type JPopupMenu constructor and the definition of the menu
    is simple and is done by a call of method in the class''s constructor. For each
    of the panels that define a day in the calendar is is assigned an event handler
    for the mouse, and the popup menu opens if you right-click a day in the calendar.
    To maintain notes, I have added the following classes:


    +   - NoteController, which is controller for a dialog box for maintenance of
    a note.

    - NoteEvent defining an event that the above controller can fire if adding a note,
    if a note is changed or if a note is deleted.

    - NoteListener defining a listener for events of type NoteEvent.

    - NoteView as the dialog box for the controller NoteController and is used both
    to to create a note and to edit a note.

    - Filter that defines a filter for a JTable.

    - FilterListener that defines a listener to a filter.

    - NotesTable, which defines a data model to a JTable.

    - Renderer defining a CellRenderer to a JTable.

    - NotesView opens a dialog box with a JTable that shows an overview of all notes.


    Finally is added a class GUI with helper methods for design of the graphical user
    interface.


