  md: "# 8 CONCURRENCY TOOLS\n\nMultithreaded applications can generally lead to concurrency\
    \ issues when multiple threads need access to the same resources, and the order\
    \ of the threads access to the resources plays a role. This requires the threads\
    \ to be synchronized, and may in turn cause other problems like deadlock and starvation\
    \ in which a thread will not be running, since all the time is interrupted. As\
    \ shown in the previous chapter, the basic solution is critical regions defined\
    \ with synchronized code, and the methods wait() and notify(). These operations\
    \ are very basic, and although in principle is simple enough, it's not easy to\
    \ use the synchronization operations and not to use them correctly. Therefore,\
    \ Java has defined some classes, which aims to make it easier to write multithreaded\
    \ applications, and partly to make the programs more effective. In this context\
    \ that the use of synchronized on the one hand ensure critical regions, but also\
    \ easily lead to programs with poor performance, where threads are too often interrupted\
    \ and have to wait.\n\n# 8.1 EXECUTORS\n\nThe concurrency tools include an executor\
    \ as an alternative to starting a thread. It is an object that directly or indirectly\
    \ implements the interface Executor, and the purpose is partly to decoupling a\
    \ task from the execution, and make it more efficient to start a thread and make\
    \ more facilities available for threads. Here is a task an object that implements\
    \ the interface Runnable or the interface Callable. The interface Executor does\
    \ not define all the desired properties regarding threads, and therefore there\
    \ is an extended interface, called ExecutorService. The principle is that you\
    \ start a thread in the following way:\n\n```\nExecutor executor = ...;\nexecutor.execute(new\
    \ RunnableTask());\n```\n\nThe following program will partly show how to use an\
    \ Executor, and partly what a Callable object is:\n\n```\npackage thread15;\n\n\
    import java.math.*;\nimport java.util.concurrent.*;\n\npublic class Thread15\n\
    {\n    public static void main(String[] args)\n    (\n```"
