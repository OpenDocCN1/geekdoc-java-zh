    The last are constant pool and is used for constants.

    The garbage collector. As mentioned Java automatic memory to an object when it
    is created with new, and the allocated memory is again deallocated automatically
    when there are no longer references to the object. Everything is handled by the
    garbage collector, which is a program that constantly runs and will manages the
    heap. This is done using a table of pointers that point to the individual objects
    on the heap. We call these pointers for soft pointers, instead of pointing directly
    at the concrete objects they points to the object''s references. The garbage collector
    runs in the background in its own thread and performs periodically checking the
    object''s state, and when there are no longer references to an object, the space
    which the object has used on the heap is released, and the pointer is removed
    from the table. When the runtime system continuously allocates objects and deallocates
    them again, the heap may be fragmented, and if it happens the garbage collector
    defragments the heap (which means that the objects are move) and thus gather all
    the available space on the heap in a large contiguous area. It is from there the
    garbage collector takes its name.'
