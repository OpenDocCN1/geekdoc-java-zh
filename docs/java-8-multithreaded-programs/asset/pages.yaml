  md: "# JAVA 8:MULTITHREADED PROGRAMS\n\n# CONCURRENCY TOOLS\n\nThe following program\
    \ will show how to apply a CountDownLatch to synchronization of objects. The program\
    \ starts N worker threads, which are unable to continue until a CountDownLatch\
    \ is countdown. After the primary thread has done a work, it is blocked until\
    \ each worker thread has counted the CountDownLatch. This means that the primary\
    \ thread waits for all worker threads to terminate.\n\n```\npackage thread1;\n\
    \nimport java.util.*;\nimport java.util.concurrent.*;\n\npublic class Thread16\
    \ {\n    private final static int N = 5;\n\n    public static void main(String[]\
    \ args) {\n        final CountDownLatch latch = new CountDownLatch(1);\n     \
    \   final CountDownLatch done = new CountDownLatch(N);\n        Runnable worker\
    \ = new Worker(latch, done);\n        ExecutorService executor = Executors.newFixedThreadPool(N);\n\
    \        for (int i = 0; i < N; i++) executor.execute(worker);\n        try {\n\
    \            System.out.println(\"Main working\");\n            Thread.sleep(1000);\n\
    \            latch.countDown();\n            System.out.println(\"Main doing work\"\
    );\n            done.await();\n            executor.shutdownNow();\n        }\
    \ catch (InterruptedException ex) {\n            System.err.println(ex);\n   \
    \     }\n    }\n}\n\nclass Worker implements Runnable {\n    private static final\
    \ Random rand = new Random();\n    private final CountDownLatch start;\n    private\
    \ final CountDownLatch done;\n```\n\nDownload free eBooks at bookoon.com"
