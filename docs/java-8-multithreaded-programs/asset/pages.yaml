  md: '# JAVA 8:MULTITHREADED PROGRAMS


    # INTRODUCTION


    +   - NEW, a thread is created, but not yet started

    - RUNNING, the thread is performed on a processor

    - BLOCKED, a thread is blocked and waiting on a lock

    - WAITING, a thread waits on a notification from another thread

    - TIMED_WAITING, a thread waits on a notification because of a timeout

    - TERMINATED, the thread is terminated


    After these three print statements are executed, the run() method performs a sleep(),
    which means that the thread is suspended for a certain period. The time is specified
    in milliseconds, and in this case it is suspended in 2 seconds. That thread is
    suspended means that in the period it is not active and does not participate in
    the resource allocation. Especially it uses no CPU time. When the thread again
    becomes active and is running, it prints another message with its id and name,
    and then the thread exits.


    The main() starts by printing the number of processors available on the current
    computer. Next, it creates two threads, both defined with a Runnable object of
    type InfoThread as parameter. Note that the two threads at same time are given
    a name. The next is printed of the first thread, at that time it will be NEW.
    Then is defined that the other thread should be a daemon thread. Finally the two
    threads are started, and the main() method prints that the first thread is “live”.
    If you run the program, the result could be the following:


    ```

    Number of processors: 8

    NEW true

    [10] Thread number one is started

    [11] Thread number two is started

    [10] None daemon

    [10] RUNNABLE

    [11] Deamon

    [11] RUNNABLE

    [10] Thread number one is terminated

    [11] Thread number two is terminated

    ```


    You should specifically note that maybe the last thread not writes that it is
    completed. The reason is that it is a daemon thread and as soon as the first thread
    terminates, also the primary thread terminates and also the second thread. In
    the main() method is a comment in front of the thread that defines the first thread
    as a daemon thread. If you remove this comment, the primary thread does not wait
    for the two threads and finish with the same – and the two threads are immediately
    terminated without completing their work.'
