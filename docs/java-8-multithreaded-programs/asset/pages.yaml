  md: "# JAVA 8:MULTITHREADED PROGRAMS\\NATOMIC VARIABLE\n\n+   - DoubleAdder\n- LongAccumulator\n\
    - LongAdder\n\nIf, for example you need to implement a class that generates a\
    \ continuous id, you will typically write something like the following:\n\n```\n\
    class ID {\n    private static volatile long ID = 1;\n\n    public static synchronized\
    \ long getID() {\n        return ID++;\n    }\n}\n```\n\nwhere the method getID()\
    \ is synchronized, since the ++ operation is not thread safe. a solution works\
    \ and will in most contexts will be fine enough, every time you need a new id,\
    \ you set a lock and that is not free. However, you can write the class as follows:\n\
    \n```\nimport java.util.concurrent.atomic.*;\n\nclass ID {\n    private static\
    \ AtomicLong ID = new AtomicLong(1);\n\n    static long getID() {\n        return\
    \ ID.getAndIncrement();\n    }\n}\n```\n\nHere getID() also thread safe, but the\
    \ method is significantly more efficient, as there is not set a lock. AtomicLong\
    \ is a class that encapsulates a long and has a number of methods that perform\
    \ the usual operations on a long, but such they are thread safe."
