    # 8.10 PARALLELISM


    The goal of multithreaded applications is parallelism, where several methods are
    performed at the same time on the machine, or least it seems for us as if it were
    the case when the individual threads in turn is running the CPU in a very short
    period of time. That is the way, at least if the machine only has a single processor,
    but today machines have more processors in the form of CPUs with multiple cores.
    Therefore such machines have the opportunity for true parallelism, where multiple
    threads run at the same time, on their core. The basic primitives for threads,
    and also the concurrency discussed above, however, are not effective to use multiple
    cores or processors. For it really to be possible, the task must be parallels
    and thus could be divided into smaller tasks that can be performed independent
    of each other and to finish be assembling the finished result. This is from everything,
    but there are also tasks that can be easily parallels. To support that Java has
    a framework, called the Fork/Join that exactly supports the resolution of these
    kinds of tasks.


    Fork/Join consists of a special executor service and a thread pool, and each task
    is of the framework split into smaller pieces that are forked to a thread from
    the pool. A task waits until the subtasks are completed and result of each sub-task
    can be merged (joined) for the final result. This process is also recursive, where
    subtasks in turn can be divided into subtasks. The framework basically consists
    of the following classes:


    +   1. ForkJoinPool

    2. ForkJoin Task

    3. ForkJoinWorkerThread

    4. RecursiveAction

    5. RecursiveTask

    6. CountedCompleter.


