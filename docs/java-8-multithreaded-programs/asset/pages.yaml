  md: '# JAVA 8:MULTITHREADED PROGRAMS


    # 10.1 SWINGWORKER


    Sometimes there is need to start a task that takes time (for example to load the
    zip codes from a file), and to reduce the number of updates to the user interface,
    and only update the user interface at once, after the job is done. You can then
    use a class called SwingWorker. It is a generic class, which is parameterized
    with two parameters *SwingWorker<T, V>*. It is an abstract class, and there is
    at least one method to be overridden. The first is


    ```

    protected abstract T doInBackground()

    ```


    which is the method that performs the task for a worker thread, which returns
    a value of the first parameter type (if there is no return, specify the parameter
    type as Void). When this method terminates, the following method is performed:


    ```

    protected void done()

    ```


    but that it is performed in EDT, where you can safely update the user interface.
    The default immeplmnation performs nothing, and you will often override the method.
    While the task is performed, you can, if desired periodically update the user
    interface by overriding and call the method


    ```

    protected void process(List<V> chunks

    ```


    The class SwingWorker have additional two methods that you need to know:


    +   1. execute() starts a worker thread

    2. T get() waits to doInBackground() is terminated and returns the result


    Below is how the program with the zip code must be changed if the list box should
    be updated with a SwingWorker.


    ```

    package thread32;


    import java.awt.*;

    import java.awt.event.*;

    import javax.swing.*;

    import javax.swing.border.*;

    import java.io.*;

    import java.util.*;

    ```'
