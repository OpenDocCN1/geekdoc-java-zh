  md: '# JAVA 8:MULTITHHREADED PROGRAMS SWING


    2. invokeLater() also has a Runnable object as a parameter, and performs the run()
    method in EDT, if it happens asynchronously this time, and the run() method is
    performed only after the EDT has processed pending events. invokeLater() is used
    when an application wants to update the user interface, and the method can be
    called from any thread.


    3. isEventDispatchThread() is a method that returns true, if it is performed in
    EDT.


    Looking at the above, the main() method defines (by means of a lambda expression)
    a Runnable object to instantiate the main window. The object used as a parameter
    to invokeLater(), and the result is that it is the event dispatcher, which creates
    the window. Similar to the above, means all the GUI programs that I have far shown
    are not written correctly, and although the programs have hardly any significance,
    I will continue writing GUI applications as shown in the main() method above.


