  md: '# JAVA 8:MULTITHREADEDPROGRAMS


    # APPENDIX A


    It is also worth noting that Java includes an API called JNI, so you can use software
    modules written in other languages like C and C++. The most important thing with
    JNI is that you can use the system calls, which possibly are not directly accessible
    through Java. Finally, it should be mentioned JNI allows using routines in C or
    C++ to situations where the performance requirements are particularly critical.
    You should be aware that JNI means sacrificing the platform independence and the
    program becomes dependent on the platform that the routines are translated to.


    In order to achieve this platform independence JVM must be precise and well-defined,
    which is done with a JVM specification that dictates the format of the bytecode
    and defines the features and functionality that JVM must have. The specification
    is public and can be found on Oracle’s website, and can in principle write a JVM.


