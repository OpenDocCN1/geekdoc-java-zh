  md: '# 11.2.1 REQUIREMENT SPECIFICATION


    The main application window should primarily show a calendar for a specific month.


    The calendar will cover the period from year 0 to year 9999 and should take account
    of the shift from the Julian to the Gregorian calendar. It is decided that the
    switch from the Julian to the Gregorian calendar is set to 1582, and then the
    4 October is followed by the 15 October.


    For each date, the calendar must display the following information:


    +   - the day''s number in the month

    - the week''s day''s name

    - the week''s number in the year, if it is a monday

    - an indication if it is a public holiday or anniversary

    - a mark when created notes

    - a mark when created appointments

    - a mark when created anniversaries


    For the holidays, the program must be pre-programmed to (know) the following days:


    +   - New Year''s Day

    - Palm Sunday

    - Maudy Thursday

    - Good Friday

    - Easter Sunday

    - Easter Monday

    - Prayer Day

    - Christ''s Ascension

    - Pentecost

    - Whit Monday

    - Christmas Eve

    - Christmas Day

    - Second Christmas Day


    and also the program must be able to show custom anniversaries (for example the
    wife''s birthday). An anniversary falls on a specific date and every year after
    1582 (with the option to specify a start and end year). If an anniversary specifies
    d. 29/2, and it is not a leap year the date 1/3 should be used.'
