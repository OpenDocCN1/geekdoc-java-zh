    After all worker threads performed an await() on the barrier (all threads have
    reached the barrier), the barrier object let the threads continue (which here
    simply means they stop) and carry out its own thread, which here calls the merge()
    method. It does not help much, but it sends a notify() on the lock set by the
    primary thread, and the result is the primary thread continues.


