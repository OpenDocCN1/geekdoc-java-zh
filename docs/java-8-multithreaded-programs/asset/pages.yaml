  md: "```\n[11] 7\n[10] 7\n[11] 8\n[10] 8\n[11] 9\n[10] 9\n```\n\nwhere you can see\
    \ that both threads prints the same value, while other values are ignored.\nThe\
    \ reason is that the two threads are updating a shared resource id, but change\
    \ it without being synchronized. The problem can be solved by modifying the class\
    \ ID as follows, where the method getId() is now synchronized:\n\n```\nclass ID\n\
    \  private int int id = 1;\n\n  public int value() {\n    return id;\n  }\n\n\
    \  public synchronized int getId() {\n    int t = id;\n    for (int i = 0; i <\
    \ 1000000L; ++i) Math.cos(Math.sqrt(2));\n    ++id;\n    return t;\n  }\n```\n\
    \nWhen a method is synchronized, it means that the whole operation is indivisible\
    \ and is viewed as a critical region. If a thread calls the method the method\
    \ is not used by another thread, the thread may get the lock, and if another thread\
    \ attempts to perform the method, it is put in a queue and must wait until the\
    \ first thread completes the work and releases the lock. If the method is synchronized,\
    \ the lock is an instance method, associated with the object on which the method\
    \ is called. If the method on the other hand is a static method the lock is associated\
    \ to the java.lang.Class object for the class where the method belongs."
