  md: 'JAVA 8:MULTITHREADED PROGRAMS


    APPENDIX A


    # # APPENDIX A


    A virtual machine is a program that simulates a physical machine in software and
    the Java runtime system is such a virtual machine. I will in this appendix provide
    a brief introduction to what the Java virtual machine is and how it works.


    Java''s virtual machine is called JVM for Java Virtual Machine, and you can think
    about it as the engine that makes it possible to execute Java programs. It is
    a program (a machine) that interprets and executes compiled Java programs. Other
    programming languages such as C and C++ compiles directly to the specific platform,
    that is to a specific processor''s instruction set and to a particular operating
    system, and the result is executable code that immediately can be carried out
    on the concrete machine without the assistance of a virtual machine. but there
    are also significant drawbacks. The main one is lack of portability, where the
    translated program depends on the machine''s processor and operating system, and
    for the program to run on a different platform, it must be translated again to
    the new environments.


    All this talks of developing a platform independent programming language and was
    one of the main ideas that led to the development of Java. The principle is that
    the Java compiler generates an optimized set of instructions, called bytecode.
    This code can not be directly executed, since it consists of instructions to a
    machine that does not exist – instructions for a virtual machine. For a program
    translated to bytecode to run, there must be running a program on the machine,
    that simulates a machine whose instruction set is bytecode, and such a program
    is exactly what JVM is. Platform independence consists in, that any translated
    Java program can run on any machine that has a JVM running, and the translated
    bytecode knows nothing about the physical machine''s processor or operating system.


    As mentioned, the price of this platform independence and program execution by
    interpretation of a virtual machine is performance. So it was, at initially, Java
    is no longer a purely interpreted language, and most implementations of the JVM
    is today a mixture of interpretation and execution of compiled code. This means
    that Java programs today in practice have the same performance as programs whose
    code is translated into a specific physical platform, also because the runtime
    system can perform a series of checks and optimization, while the program runs.'
