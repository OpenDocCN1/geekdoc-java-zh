  md: '# JAVA 8:MULTITHREADED PROGRAMS CONCURRENCY TOOLS


    It is a counting semaphore, and the first parameter indicates the number of threads
    that can simultaneously use an object of the type Resources. This corresponds
    to the array length, since it is the number of Resource objects that are available.
    The last parameter ensures that threads are blocked on this semaphore, not being
    starved and never ever again. When creating a Resources object it is the semaphore''s
    value N, and there are N threads that can use it. The class also has an array
    of type boolean, and it is used to control which Resource objects are in use.


    The class has two public methods: getResource() and putResource(). The first returns
    an available Resource object, and it starts to count down semaphores with 1:


    ```

    sema.acquire();

    ```


    If the semaphore is 0, the current thread blocked and must wait until another
    thread counts the semaphore up. Otherwise the semaphore is counted down by 1 and
    the method continues. In this case, it means that the method getResource() call
    a synchronized method get(), there must find and returns a Resource object. The
    method get() must at the same time set the actual object used. The method putResource()
    has as a parameter a Resource object, and the method has to release this object.
    To this the method calls a synchronized method unused(), and if the object is
    used, it is marked as unused, and the method returns true. If so, then the method
    putResource() performs


    ```

    sema.release();

    ```


    which means that the semaphore is counted up by 1, and at the same time it indicates
    that a blocked thread can now use the Resource objects.


    The class Worker is a class which defines the threads for performing work by using
    a Resource object. There is not much to explain, but you must note that it is
    essential for the run() method executes putResource() since the semaphore otherwise
    not counted.


    Back in the main() method, which starts a number of worker threads. Here you must
    notice that it starts more threads than can simultaneously use the Resources object
    (twice many). It is to illustrate that some of the threads is blocked by the semaphore,
    and in turn becomes unblocked again.


    # EXERCISE 8


    Create a project that you can call SemaphoreProgram. The program is an example
    of using a binary semaphore and a counting semaphore.'
