    # 11 CALENDAR


    As a final example, I will show the development of a program that can display
    a calendar on the screen, in addition, the program should keep track of appointments
    and the like. There are many such programs for any platform, and the goal of the
    following is primarily to write a program that uses multiple threads. When you
    study the finished program code or test the program also notice that the application
    uses more details on Swing, not mentioned in the previous books.


    # 11.1 TASK FORMULATION


    The task is to write a program in a window can display a calendar. The window
    should show the calendar for a month and it should be possible to navigate in
    the calendar, for next month, next year and so on. It should also be possible
    to enter a specific year and month and then go directly to that month. The program
    should cover the period from year 0 to year 9999, and the program must take account
    of the shift from the Julian calendar to the Gregorian calendar. The program should
    also be able to save a calendar for a selected period to a text file.


    The program should be used as a daily calendar program, and one should therefore
    be able to enter notes and appointments, set alarms and set special (custom) anniversaries
    beyond the days that the calendar was born with (holidays). The calendar must
    give a warning, when the time for an appointments occurs.


    **Remark**


    The result of this first phase is a project library, as preliminary only have
    a subdirectory with this task formulation.


    # 11.2 ANALYSIS


    The analysis will consist of


    +   1. a requirement specification

    2. a prototype for the user interface'
