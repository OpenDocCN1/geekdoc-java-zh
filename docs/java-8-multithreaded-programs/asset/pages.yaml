  md: "JAVA 8:MULTITHREADED PROGRAMS\n\n# 4 DEADLOCK\n\nSynchronization and locks\
    \ means that threads are blocked and put in a waiting position, and it may lead\
    \ to deadlock. It can happen if two threads use two shared resources A and B.\
    \ If one thread puts a lock on A, while the other thread puts a lock on B, and\
    \ if the first thread then tries to get the lock on the B (what it can not), and\
    \ the second thread attempts to get the lock on the A (what it can not), there\
    \ is a deadlock. As an example is below shown a program which provoke deadlock\
    \ and the program \"hang\":\n\n```\npackage thread09;\n\npublic class Thread09\n\
    {\n    private final Object lock1 = new Object();\n    private final Object lock2\
    \ = new Object();\n\n    private static int count = 0;\n\n    public static void\
    \ main(String[] args)\n{\n        final Thread09 instance = new Thread09();\n\
    \        (new Thread(() -> {\n            while(true) { instance.work1(); instance.delay();\
    \ }\n        })).start();\n        (new Thread(() -> {\n            while(true)\
    \ { instance.work2(); instance.delay(); }\n        })).start();\n    }\n\n   \
    \ public void work1()\n{\n        synchronized(lock1) {\n            synchronized(lock2)\
    \ {\n                System.out.println(\"[\" + Thread.currentThread().getId()\
    \ + \"] \" + (++count));\n            }\n        }\n    }\n}\n```"
