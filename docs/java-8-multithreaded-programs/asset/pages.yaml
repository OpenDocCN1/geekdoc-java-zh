    In addition JVM must use memory for code and temporary data as local variables
    and so on. The data are stored within the virtual machine''s address space:


    ![](img/0ed8bd211feab9309d377c7edae120ad_163_1.png)


    The heap is an area of available memory and is used to allocate memory at runtime,
    and it is for objects and arrays. When the program creates an object or an array,
    it allocates the required memory on the heap, and it created when the JVM starts.
    The space that an object or an array uses exist as long as there is a reference
    to the object, and when it is no longer the case, the space is automatically deallocated
    by the garbage collector. The JVM specification does not tell how the heap will
    be implemented, and it is also depends on the implementation where the amount
    of heap is fixed or may change accordance with the demand, but there is not enough
    heap for a program, you get an OutOfMemoryError exception.


