    Java 中的增强型 for 循环也称为“for-each”循环，提供了一种遍历集合、数组或类似数据结构中元素的简化方法。它的语法结构消除了手动管理索引变量的需求。以下是其语法的分解：


    ![](img/img-220a.jpg)


    上一个示例中创建的 `for` 循环可以重写：


    ![](img/img-220b.jpg)


    在这个示例中，`String c` 获取 `coffee` 数组中的每个值，循环体处理每个值而不需要像传统的 `for` 循环那样需要显式索引。


    增强型 for 循环在 Java SE 版本 5 中引入，也称为 for-each 循环。增强型 for 循环主要为集合创建的，但也可以用于数组。两者之间明显的区别是，在传统的
    `for` 循环中，你可以访问控制变量；但在增强型 for 循环中，你不能。


    ## 7.4 复制数组](#07_Contents.xhtml_chhead70)


    如果你需要将一个数组的元素放入另一个数组，有一个方便的方法。我们可以使用 `System.arraycopy()`。


    Java 中的 `System.arraycopy()` 方法是 `System` 类提供的一个实用程序，用于从一个数组复制元素到另一个数组。它允许精确控制复制哪些元素以及它们放置在目标数组的什么位置。


    其语法工作方式如下：


    ```java

    System.arraycopy(sourceArray, sourcePosition, destinationArray, destinationPosition,
    length);

    ```


    - `sourceArray` 是从从中复制元素的数组。

    - `sourcePosition` 是源数组中的起始索引。

    - `destinationArray` 是将元素粘贴的目标数组。

    - `destinationPosition` 是目标数组中放置复制元素的起始索引。

    - `length` 指要复制的元素数量。


    这里有一个示例：


    ![](img/img-222.jpg)


    编译并运行后，将得到如下输出：


    ![](img/img-223a.jpg)


    在第 7 行 `System.arraycopy(orig, 0, temp, 0, orig.length);` 中，我们需要向 `System.arraycopy()`
    方法传递五个参数。第一个参数是 `orig` 数组，然后是源数组的起始位置，第三个参数是 `temp` 数组，第四个参数是目标数组的起始位置，最后一个参数是待复制元素的数量。


