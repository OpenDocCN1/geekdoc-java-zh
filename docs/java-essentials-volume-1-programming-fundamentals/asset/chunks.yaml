- fmt: "\nIn this chapter, we will explore the `String` Object, which represents a\
    \ sequence of characters and is one of the most commonly used objects in Java.\
    \ We’ll dive into various `String` methods that allow manipulation and processing\
    \ of string data, such as concatenation, comparison, and substring extraction.\
    \ Additionally, we will compare the `StringBuffer` and `StringBuilder` classes,\
    \ both of which provide mutable alternatives to `String` objects. While both are\
    \ used to modify string content, `StringBuffer` is thread-safe and synchronized,\
    \ whereas `StringBuilder` is faster but not synchronized, making it ideal for\
    \ single-threaded environments.\n\n## 6.1 The String Class\n\nStrings are a representation\
    \ of character values such as \"abc\". Now, notice that we need to enclose these\
    \ literal values inside a pair of double quotes. Enclosing the `String` literals\
    \ using a pair of single quotes may work in other languages, but not in Java.\n\
    \nWe have several ways to create a `String` object. We can either use one of the\
    \ constructors provided by the `String` class in the API documentation or we can\
    \ do a direct assignment.\n\nStrings are constants; their values cannot be changed\
    \ after they have been created, while `StringBuffer` and `StringBuilder` support\
    \ mutable `Strings`, which basically means that they can be changed.\n\nFor example:\n\
    \n```\nString str = \"abc\";\n```\n\nis equivalent to:\n\n```java\nchar data[]\
    \ = {'a', 'b', 'c'};\nString str = new String(data);\n```\n\n### 6.1.1 Uses of\
    \ the String Data Type\n\nThe `String` data type is used for a string of characters\
    \ such as names, addresses, phone numbers, and so on.\n\nExample:\n\"Lawrence\"\
    \n\"Java Programming\"\n\"1234567890\"\n\n### 6.1.2 String Position vs. Length\n\
    \nIn Java, each character in a `String` has a position, also known as an index,\
    \ which starts at 0 for the first character. This means the last character of\
    \ the `String` will be at the position `length - 1`.\n\nThe `length()` method\
    \ returns the total number of characters in the `String`, starting from 1 (not\
    \ 0). This can sometimes confuse beginners because positions start from 0, but\
    \ `length` starts counting from 1.\n\nLet’s use the name `LAWRENCE` as an example:\n\
    \nIndex (Position): 0 1 2 3 4 5 6 7\nCharacters: L A W R E N C E\nLength Count:\
    \ 1 2 3 4 5 6 7 8\n\n* The first character 'L' is at position 0.\n* The last character\
    \ 'E' is at position 7, but it’s the 8th character in the `String`.\n* The `length()`\
    \ of \"LAWRENCE\" is 8, but the highest valid index is 7.\n\nThe key points here\
    \ are as follows:\n\n* Position (index) starts at 0.\n* `Length` starts counting\
    \ at 1, and is equal to the number of characters in the `String`.\n* The last\
    \ valid position in a `String` is always `length - 1`.\n\nUnderstanding these\
    \ concepts is crucial for tasks such as substring extraction, character comparison,\
    \ and iteration over a `String`. The indices help specify exact positions, while\
    \ the `length` ensures you know the boundaries, preventing errors like `StringIndexOutOfBoundsException`.\n\
    \nIn Java, spaces, blank characters, punctuation, and other special symbols are\
    \ all treated as individual characters. This means they are part of the `String`\
    \ and contribute to its length.\n\nExample:\n\n```java\nSystem.out.println(\"\
    Congratulations! \" + \" You passed this subject.\");\n```\n\nThe `String` inside\
    \ `System.out.println()` is a `String` constant. In an output statement, it is\
    \ possible to concatenate `String` constants and numbers using the `+` operator.\
    \ The number is automatically converted to a `String` once you concatenate it\
    \ to another `String` value.\n\nExample:\n\n```java\nint grade = 70;\nSystem.out.println(\"\
    Your grade is \" + grade);\n```\n\n## 6.2 Commonly Used String Methods\n\nThe\
    \ class `String` includes methods for examining individual characters of the sequence,\
    \ for comparing strings, for searching strings, for extracting substrings, and\
    \ for creating a copy of a `String` with all characters translated to uppercase\
    \ or to lowercase. The commonly used `String` methods are:\n\n* `substring()`\n\
    * `length()`\n* `charAt()`\n* `concat()`\n* `replace()`\n* `toLowerCase()`\n*\
    \ `toUpperCase()`\n* `equals()`\n* `equalsIgnoreCase()`\n* `compareTo()`\n* `trim()`\n\
    * `split()`\n\n### 1. The `substring()` Method\n\nIt is used to extract a portion\
    \ of a `String` object.\n\n**Example 1:**\n\n```java\nString country = \"Philippines\"\
    ;\nSystem.out.println(country.substring(3));\n```\n**Output:**\n`lippines`\n\n\
    The `substring()` method in Java is used to extract a portion of a `String` starting\
    \ from a specific index. For example, in the code\n\n```java\nString country =\
    \ \"Philippines\";\nSystem.out.println(country.substring(3));\n```\n\nThe method\
    \ call `country.substring(3)` tells Java to begin extracting characters starting\
    \ at index 3 and continue to the end of the `String`. Since Java uses zero-based\
    \ indexing, index 3 corresponds to the character 'l' in \"Philippines\". Therefore,\
    \ the output is \"lippines\", which includes all characters from the 'l' onward.\
    \ This method is particularly useful when you want to remove or skip a certain\
    \ number of characters at the beginning of a `String` or extract a specific part\
    \ of it.\n\n**Example 2:**\n\n```java\nString country = \"Philippines\";\nSystem.out.println(country.substring(0,3));\n\
    ```\n**Output:**\n`Phi`\n\nCharacters are printed starting from position number\
    \ 0 up to the number of the length specified.\n\n**Example 3:**\n\n```java\nString\
    \ country = \"Philippines\";\nSystem.out.println(country.substring(9, 12));\n\
    ```\n**Output:**\n`Error` (Produces `StringIndexOutOfBoundsException`)\n\n###\
    \ 2. The `length()` Method\n\nProvides the number of characters in the string.\n\
    \n**Example 1:**\n\n```java\nString country = \"Philippines\";\nSystem.out.println(country.length());\n\
    ```\n**Output:**\n`11`\n\nTo find the last character of the string, we can use\
    \ the `length()` method together with `substring()`. (Wait, usually `charAt(length()-1)`\
    \ is used). \n\n### 3. The `charAt()` Method\n\nIt is used to find the character\
    \ at any position.\n\n**Example 1:**\n\n```java\nString country = \"Philippines\"\
    ;\nSystem.out.println(country.charAt(1));\n```\n**Output:**\n`h`\n\nYou can also\
    \ use the actual `String` value instead of the variable.\n\n**Example 2:**\n\n\
    ```java\nString country = \"Philippines\";\nSystem.out.println(\"Philippines\"\
    .charAt(1));\n```\n**Output:**\n`h`\n\n### Concatenation of Strings\n\nThe concatenation\
    \ operator `+` can be used to join, concatenate, string expressions.\n\n**Example\
    \ 1:**\n\n```java\nString a = \"abc\";\nString b = \"def\";\nString c = a + b;\n\
    System.out.println(c);\nSystem.out.println(c + \"ghi\");\n```\n**Output:**\n`abcdef`\n\
    `abcdefghi`\n\n### 4. The `concat()` Method\n\nAside from using the `+` operator,\
    \ we can also use the `concat()` method to concatenate Strings. Both methods can\
    \ be used to obtain the same result when joining Strings together.\n\n**Example\
    \ 1:**\n\n```java\nString a = \"abc\";\nString b = \"def\";\nString c = a.concat(b);\n\
    System.out.println(c);\nSystem.out.println(c.concat(\"ghi\"));\n```\n**Output:**\n\
    `abcdef`\n`abcdefghi`\n\n### 5. The `replace()` method\n\nReplacing characters\
    \ in a String.\n\n**Example:**\n\n```java\nString a = \"Juan\";\nString b = a.replace('u',\
    \ 'e');\nSystem.out.println(a);\nSystem.out.println(b);\n```\n**Output:**\n`Juan`\n\
    `Jean`\n\n### 6. The `toLowerCase()` and `toUpperCase()` Methods\n\nConverting\
    \ a string from uppercase to lowercase and vice versa.\n\n```java\nString a =\
    \ \"Juan\";\nSystem.out.println(a.toUpperCase());\n```\n**Output:**\n`JUAN`\n\n\
    ```java\nString a = \"Juan\";\nSystem.out.println(a.toLowerCase());\n```\n**Output:**\n\
    `juan`\n\n### 7. The `equals()` Method\n\n`a.equals(b)` is true if `a` and `b`\
    \ are strings of the same length and they have the same characters in the same\
    \ sequence.\n\n```java\nString a = \"Juan\";\nString b = \"Peter\";\nSystem.out.println(a.equals(b));\n\
    ```\n**Output:**\n`false`\n\n```java\nString a = \"Peter\";\nString b = \"Peter\"\
    ;\nSystem.out.println(a.equals(b));\n```\n**Output:**\n`true`\n\n### 8. The `equalsIgnoreCase()`\
    \ Method\n\n```java\nString a = \"Peter\";\nString b = \"peter\";\nSystem.out.println(a.equals(b));\n\
    ```\n**Output:**\n`false`\n\n```java\nString a = \"Peter\";\nString b = \"peter\"\
    ;\nSystem.out.println(a.equalsIgnoreCase(b));\n```\n**Output:**\n`true`\n\n###\
    \ 9. The `compareTo()` Method\n"
