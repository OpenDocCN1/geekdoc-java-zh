    [7.6 Array of Arrays (Two-Dimensional Arrays)](#07_Contents.xhtml_chhead72)


    A two-dimensional array in Java is like a table with rows and columns. You can
    think of it as an array of arrays. Each element in a two-dimensional array is
    accessed using two indices: one for the row and one for the column. You can have
    a rectangular “normal” two-dimensional array or a non-rectangular array.


    7.6.1 Rectangular Two-Dimensional Arrays


    Let’s first take a look at the “normal” two-dimensional array. Consider this example:


    ![](Images/img-227.jpg)


    In this example:


    • numbers[0][0] refers to 10 – This is the element in row 0, column 0.


    • numbers[0][1] refers to 20 – This is the element in row 0, column 1.


    • numbers[0][2] refers to 30 – This is the element in row 0, column 2.


    • numbers[1][0] refers to 40 – This is the element in row 1, column 0.


    • numbers[1][1] refers to 50 – This is the element in row 1, column 1.


    • numbers[1][2] refers to 60 – This is the element in row 1, column 2.


    You can visualize the array like this:


    Row 0 → [10] [20] [30]


    Row 1 → [40] [50] [60]


    Each element is accessed by its row index, followed by its column index, using
    the syntax:


    numbers[row][column].


    Just remember that array indices will always start with 0, even if it is a two-dimensional
    array.


    Here are other practical examples when we can use two-dimensional arrays:


    1. Spreadsheets or Tables


    Think of a program like Microsoft Excel or Google Sheets. Each cell in a spreadsheet
    can be identified by a row and a column. Similarly, a two-dimensional array lets
    you store and access data using two indices.


    **Example:**


    ![](Images/img-228a.jpg)


    • grades[0][0] is “Matthew” (row 0, column 0)


    • grades[0][1] is “85” (row 0, column 1)


    This is useful when storing student names and their scores, or any data structured
    in rows and columns.


    2. Game Boards (e.g., Chess, Tic-Tac-Toe)


    Games that involve grids are a perfect use case for 2D arrays. Each square on
    a chessboard, for instance, can be represented using a row and column.


    **Example:**


    ![](Images/img-228b.jpg)


    You can easily check for a winner by scanning across rows, columns, or diagonals.


    3. Images or Pixels


    In digital images, each pixel can be thought of as a tiny square on a grid with
    a color value. You can represent this with a 2D array where each cell holds a
    color code or intensity level.


    **Example:**


    ![](Images/img-229a.jpg)


    This can be used for image processing, filters, or computer vision tasks where
    you manipulate pixel data.


    4. Seating Charts


    In classrooms, theaters, or airplanes, seats are arranged in rows and columns.
    A 2D array can track which seats are occupied or available.


    **Example:**


    ![](Images/img-229b.jpg)


    This allows your program to manage reservations or availability efficiently.


    A two-dimensional array is a versatile structure for modeling real-world layouts
    where data is arranged in rows and columns. It makes accessing, modifying, and
    organizing this kind of data much more logical and efficient in code. For Java
    beginners, mastering 2D arrays opens the door to more complex problem-solving
    and practical programming projects.


    You can also create and declare a two-dimensional array with default values.


    int[][] arr2d = new int[3][4];


