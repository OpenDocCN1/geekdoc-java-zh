    # 0.5 Linux 环境 JDK 安装器 (#07_Contents.xhtml_chhead6)


    在 Linux 运行环境中，有两种用户：root 用户（超级用户）和普通用户。root 用户可以访问 Linux 机器上的所有文件夹，而普通用户仅可以访问自己的家目录。了解你拥有什么种类型的用户账户将帮助你决定下载哪种类型的
    JDK Linux 安装器。


    你有两种文件类型可供选择：`*.tar.gz` 文件（归包二进制文件）或 `*.rpm` 文件（Red Hat 软件包管理器文件）。对于使用 Linux 发行版的
    Intel 机器，还有一种特殊的安装程序。以下是可用的 Linux 安装器列表。


    图 0.28 Oracle 官网 - Linux JDK 安装器


    ![](img/fig0-28.jpg)


    ## 0.5.1 归包二进制文件 (*.tar.gz)


    归包二进制文件适用于任何种类型的用户，包括普通用户和 root 用户。使用归包文件，你可以自定义解压文件的位置。选择好位置后，可以通过输入以下命令开始解压过程：


    ```

    tar zxvf jdk-<version>u<update>-linux-x64.tar.gz

    ```


    假设你想将 JDK 提取到家目录下，以下是实际命令的示例，假设安装程序是 JDK 23。


    ```bash

    cd <ENTER>

    tar zxvf jdk-23_linux-x64_bin.tar.gz <ENTER>

    ```


    第一条命令确保你当前的工作目录是家目录，第二条命令将 JDK 提取到家目录下。


    此外，通过 `tar` 命令，你可以在家目录内解压该安装器。


    下一步是通过编辑 `.profile` 文件来配置你的 JDK。你可以使用 `vi` 编辑器或任何文本编辑器来编辑 `.profile` 文件。


    添加以下行：


    ```bash

    JAVA_HOME=~/jdk-23

    export JAVA_HOME

    PATH=$JAVA_HOME/bin:$PATH

    export PATH

    ```


    保存你的 `.profile`。


    在机器上注销并重新登录。


    ## 0.5.2 RedHat 软件包管理器 (RPM) 文件


    RPM 文件供 root 用户用于软件包安装。你可以下载扩展名为 `*.rpm` 的 JDK 安装器。


    下载文件后，你需要使用 `su` 命令以 root 用户身份登录。以下是示例命令。


    ```bash

    su –

    <Type in your root password>#

    ```


    以 root 登录后，你现在可以执行 `rpm` 命令开始安装软件包。


    ```bash

    rpm -Uvh jdk-23_linux_x64_bin.rpm <ENTER>

    ```


    安装完成后，你可以从 root 用户注销回到普通用户，操作即完成。不需要重启机器。请记住，安装器名称中包含 x64 值的安装器是用于 Intel 处理器的。对于其他类型的处理器，你可以使用
    ARM64 安装器。


    ![](img/sum.png) 章节总结 (#07_Contents.xhtml_chhead7)


    - 有不同种类型的计算机运行着不同类型的操作系统。第一个关键步骤是了解你操作系统的类型，然后在 Google 上搜索以找到要安装的正确 JDK。

    - 对于 64 位操作系统，建议使用最新版本的 JDK。

    - 对于较旧的操作系统，你可以使用 JDK 8，它可以服务于任何 32 位的 Windows 或 Linux 操作系统。

    - 一旦你正确安装并配置了 JDK，你需要通过输入 `javac -version` 来了解 Java 编译器的版本，输入 `java -version`
    来了解运行时环境的版本。

    - 理想情况下，你的编译器 (`javac`) 和运行时 (`java`) 使用相同的版本更好，但如果由于某些原因它们版本不一致，请确保你的 `javac`
    版本低于你的 `java` 版本。


    ![](img/quiz.png) 测试题 (#07_Contents.xhtml_chhead8)


    1. 下列哪项**不是**一个操作系统？

    a. Windows

    b. Linux

    c. MacOSX

    d. JDK


    2. 下列哪种说法是**不正确**的？

    a. 对于 Mac OS，不需要安装 JDK，所有 Mac OS 版本都预装了 JDK。

    b. 对于较旧的操作系统，JDK 8 是最好的 JDK 版本，因为它仍然提供 32 位和 64 位版本。

    c. 对于现代操作系统，最好使用最新版本的 JDK。

    d. 要获取最新版本的 JDK，只需在 Google 上搜索“JDK download”即可。


    3. 想要了解 Java 编译器的版本，命令是：

    a. javac -version

    b. javac -v

    c. compiler -v

    d. java compiler -v


    4. 想要了解 Java 运行时环境的版本，命令是：

    a. java -runtime

    b. java -r

    c. java -version

    d. java -run


    5. dmg 类型的安装器适用于什么操作系统？

    a. Windows

    b. Linux

    c. MacOSX

    d. 任何操作系统


    6. exe 类型的安装器适用于什么操作系统？

    a. Windows

    b. Linux

    c. MacOSX

    d. 任何操作系统


    7. tar.gz 类型的安装器适用于什么操作系统？

    a. Windows

    b. Linux

    c. MacOSX

    d. 任何操作系统


    8. Linux rpm 文件安装器也是 Linux 机器的另一种类型的安装器。rpm 代表什么？

    a. 每分钟转数

    b. 每分钟旋转数

    c. RedHat 软件包管理器

    d. 每分钟恢复数


    9. 下列哪种说法是**不正确**的？

    a. Linux 安装器最好由 root 用户使用。

    b. 最好知道 CLASATH, JAVA_HOME。

    c. 安装使用 tar.gz。

    d. Mac OS。


    10. 下列哪种说法是**不正确**的？

    a. JDK 可以运行。

    b. Windows 的安装过程。

    c. 安装过程是相同的。

    d. Mac OS 文件。


    答案：

    1 – d | 2 – a | 3 – a | 4 – c | 5 – c

    6 – a | 7 – b | 8 – c | 9 – d | 10 – b


