  trans: "\n它类似于 `equals` 方法，但对字符串进行字典序比较。这允许根据字符的顺序对两个字符串进行比较，类似于字典顺序。“字典序”（lexicographically）指的是根据\
    \ Unicode 字符集中字符顺序比较字符串的方式。这与字典中的字母顺序相似，但由于 Java 使用 Unicode 进行字符编码，它也考虑了数字和特殊字符。\n\
    \n```java\nString a = \"Peter\";\nString b = \"Peter\";\nSystem.out.println(a.compareTo(b));\n\
    ```\n\n**输出：**\n0\n\n- 如果 `a` 和 `b` 相等，值为 0\n- 如果 `a` 小于 `b`，值为负数\n- 如果 `a` 在\
    \ `b` 之后，值为正数\n\n该方法从字符串的开始逐个比较每个字符，使用 Unicode 值来确定哪个字符靠前。如果一个字符串中的字符大于另一个字符串中的对应字符，它将返回一个正值。如果它们相等，则继续比较下一个字符。如果所有字符都匹配，方法返回零。\n\
    \n## 10. `trim()` 方法\n\n它用于移除空白字符。\n\n```java\nString a = \" Lawrence \";\nSystem.out.println(a);\n\
    System.out.println(a.trim());\n```\n\n**输出：**\nLawrence\nLawrence\n\n## 11. `split()`\
    \ 方法\n\n根据给定标记符的匹配项分割此字符串。\n\n![](img/img-199a.jpg)\n\n**输出：**\naaa\nbbb\nccc\n\
    \n## 6.2.1 文本块 (Text Blocks)\n\n文本块是 Java 13 和 Java 14 作为预览特性引入的新功能。它允许将不同行中的多个字符串值组合在一起，并由由三个双引号（`\"\
    \"\"`）组成的粗体分隔符进行分组。\n\n粗体分隔符（`\"\"\"`）用于允许双引号（`\"`）字符在无需转义的情况下出现。它还将文本块与字符串字面量区分开来。文本块是多行字符串字面量，避免了大多数转义序列的需求，并自动格式化字符串值以便于格式。\n\
    \n考虑以下代码片段：\n\n![](img/img-199b.jpg)\n\n**输出：**\nstr1: Hello\nAloha\nHi\nstr2:\
    \ Hello\nAloha\nHi\n\n比较 str1 和 str2: true\n\n第 5 到 9 行显示了文本块的使用。`str1` 和 `str2`\
    \ 的值在打印时产生相同的输出，在第 15 行和第 16 行比较时将将返回 true 值。\n\n由于文本块在 Java 13 和 14 中仅为“预览”特性，编译器需要编译选项\
    \ `--enable-preview` 以允许编译器访问预览特性，随后使用 `-source 13` 来指定编译器的版本。\n\n假设代码片段位于名为 `TextBlock.java`\
    \ 的有效 Java 源代码中，编译方式如下：\n\n```bash\njavac --enable-preview -source 13 TextBlocks.java\n\
    ```\n\n在成功编译 Java 源代码后，还需要虚拟机（VM）选项 `--enable-preview`。要运行，你必须输入此命令：\n\n```bash\n\
    java --enable-preview TextBlocks\n```\n\n从 Java 15 及以上版本开始，你将不再需要编译选项 `--enable-preview\
    \ -source 13` 和运行时选项 `--enable-preview`。\n\n## 6.3 StringBuffer 和 StringBuilder\
    \ 类](#07_Contents.xhtml_chhead62)\n\n### 6.3.1 StringBuffer\n\n`StringBuffer`\
    \ 是一个可变的字符序列，与普通的 String 对象不同，它允许修改。它可以通过各种方法更改长度和内容，在处理动态文本时非常灵活。此外，`StringBuffer`\
    \ 是线程安全的，确保多个线程可以对其进行操作而不会引起同步问题。\n\n`StringBuffers` 对于多线程使用是安全的。在必要时对方法进行了同步处理，以便对任何特定实例上的所有操作都将按照某种串行顺序执行，且该顺序与涉及的每个线程执行的方法调用顺序一致。\n\
    \n`StringBuffer` 的主要操作是 `append` 和 `insert` 方法，这些方法经过重载以接受任何类型的数据。每个方法都会有效地将给定的表达式转换为\
    \ `String`，然后将该 `String` 的字符附加或插入到 `StringBuffer` 中。`append` 方法始终将这些字符添加到缓冲区的末尾；`insert`\
    \ 方法则在指定点处添加字符。\n\n`append()` 方法同时属于 `StringBuffer` 和 `StringBuilder` 类，而 `concat()`\
    \ 方法属于 `String` 类。\n\n### 6.3.2 StringBuilder\n\n`StringBuilder` 是一个可变的字符序列。该类提供了与\
    \ `StringBuffer` 兼容的 API，但不保证同步。该类被设计用于在单线程使用 `StringBuffer` 的地方作为 `StringBuffer`\
    \ 的无缝替换（通常情况下如此）。在可能的情况下，建议使用此类代替 `StringBuffer`，因为它在大多数实现中速度更快。\n\n`StringBuilder`\
    \ 的主要操作是 `append` 和 `insert` 方法，这些方法也经过了重载以接受任何类型的数据。每个方法都会有效地将给定的表达式转换为 `String`，然后将该\
    \ `String` 的字符附加或插入到 `StringBuilder` 中。`append` 方法始终将这些字符添加到构建器的末尾，与 `StringBuffer`\
    \ 相同；`insert` 方法在指定点处添加字符，也与 `StringBuffer` 相同。\n\n### 6.3.3 StringBuffer 的 `append()`\
    \ 和 `insert()` 方法\n\n**示例 1：**\n\n```java\nStringBuffer sb = new StringBuffer(\"\
    abc\");\nsb.append(\"def\");\nSystem.out.println(sb);\n```\n\n**输出：**\nabcdef\n\
    \n**示例 2：**\n\n```java\nStringBuffer sb = new StringBuffer(\"abc\");\nsb.insert(1,\
    \ \"def\");\nSystem.out.println(sb);\n```\n\n**输出：**\nadefbc\n\n这些方法对 `StringBuffer`\
    \ 和 `StringBuilder` 对象具有相同的效果。要获取 `String`、`StringBuffer` 和 `StringBuilder` 的完整方法列表，最好查阅\
    \ API。\n\n## 总结](#07_Contents.xhtml_chhead63)\n\n在 Java 中，`String`、`StringBuffer`\
    \ 和 `StringBuilder` 是用于字符序列的类。以下是三者的共同点：\n\n- 这三个类都属于 `java.lang` 包，这意味着它们会被导入到每个\
    \ Java 程序中\n- 它们用于创建和操作字符序列。\n- 三者都实现了 `CharSequence` 接口，这意味着它们提供了访问字符序列的标准方法。\n\
    - 它们都提供了基本的字符串操作，例如：\n    - 长度：`length()`\n    - 字符访问：`charAt(int index)`\n  \
    \  - 子字符串提取：`substring(int beginIndex, int endIndex)`\n\n区别如下：\n\n- `String` 是不可变的：一旦创建了\
    \ `String` 对象就无法更改。对 `String` 的任何修改都会创建一个新的 `String` 对象。\n- `StringBuffer` 和 `StringBuilder`\
    \ 是可变的：它们可以在创建后进行修改而无需创建新对象。这使得它们在频繁修改字符串的情况下更加高效。\n- 字符串拼接通过 `+` 运算符或 `concat()`\
    \ 方法完成，这会创建一个新的 `String` 对象。\n- 字符串文本块在 Java 13 和 14 中也被引入，使用了粗体分隔符（`\"\"\"`）三双引号。\n\
    - 对于 `StringBuffer` 和 `StringBuilder` 类，它们提供了 `append()` 和 `insert()` 方法来修改现有字符串，使拼接更高效。\n\
    - `StringBuffer` 是线程安全的：它的所有方法都是同步的，这使得它在多线程环境中使用是安全的，但由于同步开销可能会较慢。\n- `String`\
    \ 是不可变的，因此本质上是线程安全的。\n- `StringBuilder` 不是线程安全的，应在单线程上下文中使用。\n\n## 验](#07_Contents.xhtml_chhead64)\n\
