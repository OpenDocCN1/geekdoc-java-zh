    \n在 Java 中，`String` 中的每个字符都有一个位置，也称为索引，第一个字符从 0 开始。这意味着 `String` 的最后一个字符位于位置 `length\
    \ - 1` 处。\n\n`length()` 方法返回 `String` 中字符的总数，从 1 开始（而不是 0）。这有时会困扰初学者，因为位置从 0 开始，但\
