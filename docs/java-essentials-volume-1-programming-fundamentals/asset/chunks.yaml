    The `main` method is a special type of method that tells Java that this is the
    starting point of your application. All Java applications start their execution
    at the `main` method, and its method signature should be `public static void main(String[]
    args)`.


    `String[] args`, this goes inside the parameter list of your `main` method. This
    means that your `main` method should accept an array of `String` objects as its
    parameter. This can also be rewritten as `String args[]`, essentially, both forms
    are the same.


    Within the `main` method, we include a statement that prints text to the console
    using `System.out.println("Hello, World");` in line 4. This line instructs the
    Java runtime to display the words "Hello, World" exactly as written. Every statement
    in Java ends with a semicolon, so be sure to include it. With this, you now have
    a complete Java program, ready to be saved, compiled, and executed.


    ![](Images/rules.png) RULES


    1. Your `public` class name should have the same name as your filename.

    2. There can only be one `public` class inside your `.java` file. Also, a pair
    of braces `{ }` represents a scope. It is used to group related program segments.
    It can be used for control structures, methods, and classes.

    3. In your Java code, there should be an equal number of begin braces (`{`) and
    end braces (` }`).

    4. The execution of any Java Application always starts with your `main` method.
    The signature of your `main` method should be:

    ```

    public static void main(String[] args)

    ```

    5. Everything in Java is Case-Sensitive


    Java is a case-sensitive language, meaning that identifiers such as `Main`, `main`,
    and `MAIN` are considered completely different. This applies to class names, method
    names, and variable names. Therefore, it’s crucial that your file name matches
    the class name exactly, including uppercase and lowercase letters. For example,
    if your class is declared as `public class HelloWorld`, then the file name must
    be `HelloWorld.java`. If the capitalization does not match, the compiler will
    generate an error indicating that the `public` class must be declared in a file
    with the corresponding name. Additionally, Java programs require correct syntax.
    Statements must end with semicolons, and quotation marks, parentheses, and curly
    braces must always come in pairs. Failure to follow these basic rules will result
    in syntax errors during compilation.


    ### 2.1.1 Saving Your Program


    Once you’ve written your program, the next step is to save it correctly. It’s
    best practice to create a dedicated folder to organize your Java source files.
    Using the terminal window (if you’re using a Mac machine or a Linux machine) or
    the Command Prompt (if you are using any Windows Machine), you can create a folder
    named `javacodes` by typing `mkdir javacodes`, and then change into that directory
    with the `cd javacodes` command.


    Figure 2.1 Screenshot of the terminal Window in a Mac OS Machine


    ![](Images/fig2-1.jpg)


    After that, return to your text editor and save your Java file within this folder.
    Make sure the file name matches the class name exactly and ends with a `.java`
    extension. In this case, since the class name is `HelloWorld`, the file must be
    named `HelloWorld.java`. Saving it with a different name or case will result in
    compilation errors. Once saved, you can verify the file’s presence by listing
    the contents of the folder using the `ls` command (on the UNIX system or Mac OS)
    or `dir` on Windows.


    Figure 2.2 Screenshot of the terminal window in a Mac OS Machine using the `ls`
    command


    ![](Images/fig2-2.jpg)


    To compile your Java source code, open your terminal and use the `javac` command,
    which stands for “Java compile.”


    Figure 2.3 Screenshot of the terminal Window in a Mac OS Machine


    ![](Images/fig2-3.jpg


    Congratulations—you have just created your first application!

