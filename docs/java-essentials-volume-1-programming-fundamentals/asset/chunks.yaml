    ## 4.2 优先级


    你刚刚看到的运算符列表在执行时遵循一套特定的规则。这些规则就是我们所说的“优先级”。这些规则将确保，一旦你在特定的表达式或语句中 set 这组运算符，它将首先执行一组运算符，然后是另一组，最后是另一组。


    图 4.1: Java 运算符列表* 中列出的运算符顺序也显示了优先级。列在顶部的运算符比底行的具有更高的优先级。


    这里有一个涉及多个运算符的示例：`++` 递增、`/` 除法、`+` 加法和 `=` 赋值运算符。


