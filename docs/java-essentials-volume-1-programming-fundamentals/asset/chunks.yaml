    [3.7 The Math Class](#07_Contents.xhtml_chhead35)


    The java.lang.Math class is essential in Java programming as it provides a collection
    of methods for performing mathematical operations that are commonly needed in
    development. Its significance lies in the ability to handle tasks like calculations,
    trigonometry, exponential functions, logarithms, and more without having to implement
    complex algorithms manually.


    Knowing about the Math class helps programmers efficiently solve problems, write
    cleaner code, and handle calculations that are integral to many programming tasks.


    The Math class can be found under the java.lang package, and since it’s inside
    the java.lang package is automatically accessible to us. The Math class contains
    the commonly used methods for mathematical computation, and all of these methods
    are static.


    That’s why whenever we access any of these methods, we need to access them by
    the name of the class. So if you want to use the absolute value method abs(),
    you need to prefix it with Math followed by a dot, and then the name of the method,
    and then you could start passing the parameter.


    Below are some of the commonly used Math methods:


    | abs() | - computes for the absolute value |


    | cbrt() | - computes for the cube root value |


    | sqrt() | - computes for the square root value |


    | ceil() | - Rounds a decimal number up to the nearest integer |


    | floor() | - Rounds a decimal number down to the nearest integer |


    | min() | - returns the smaller value between the two parameters |


    | max() | - returns the larger value between the two parameters |


    | pow() | - computes the exponential value of the first parameter raised to the
    value of the second parameter. |


    | random() | - returns a random value from 0.0 up to less than 1.0 |


    | round() | - performs rounding off values. |


    To test these methods, try coding them by using either a text editor, an IDE,
    or even an online compiler.


    Figure 3.4 Set of selected Math Methods with output


    ![](Images/fig3-4.jpg)


    To get the complete list of Math methods, check out the Java API Documentation.


    [3.8 The Scanner Class](#07_Contents.xhtml_chhead36)


    Let’s discuss how to use the Scanner class from the java.util package for handling
    user input in Java. This class simplifies the process of gathering various types
    of input from the keyboard, such as int, double, and String. It provides an easy
    method to read values and allows developers to interact with users in a Java program.


    [Table 3.6](#24_Ch03.xhtml_c3t6) shows the different input methods under the Scanner
    class.


    Table 3.6 Scanner next() methods


    | Data Types | nextXxx methods |


    | --- | --- |


    | byte | nextByte() |


    | short | nextShort() |


    | int | nextInt() |


    | long | nextLong() |


    | float | nextFloat() |


    | double | nextDouble() |


    | char | next().charAt(0) |


    | boolean | nextBoolean() |


    | Single String | next() |


    | Strings with spaces | nextLine() |'
