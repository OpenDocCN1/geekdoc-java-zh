    Welcome to your first steps in learning Java! In this chapter, you’ll learn how
    to write and run a basic Java program that displays text on the screen. You’ll
    be introduced to the System.out.print() and System.out.println()statements, which
    is the standard way to show output in Java. You’ll also discover how to combine
    text and variables using the + operator, and how to format your output using escape
    characters like ''\n'' for new lines and ''\t'' for tab spaces. Along the way,
    you’ll learn how to recognize and fix common errors that can occur during compilation
    or execution.


    Finally, you’ll get hands-on experience with JShell, an interactive Java tool
    that lets you quickly try out code and see what it does. By the end of this chapter,
    you’ll be ready to write simple Java programs with confidence.


