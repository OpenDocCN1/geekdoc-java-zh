    Java is an object-oriented programming language. Object-oriented programming (OOP)
    is a way of writing programs by organizing code into “objects,” which represent
    real-world things like a car, a person, or a bank account. Each object contains
    `data` (called attributes) and `behaviors` (called methods) that define what it
    is and what it can do. This approach makes code easier to understand, reuse, and
    maintain.


    Object-oriented programming languages support three main features: `Encapsulation`,
    `Inheritance`, and `Polymorphism`.


    1. `Encapsulation`: allows you to protect your data from direct access. It also
    provides a common interface that makes it accessible and guards the state of your
    data by checking the correctness of the values assigned before updating the value.
    It also allows you to create methods that can be called later in your code, and
    the users or callers of those methods need not worry about how the method was
    implemented. In getting information, the user will just need to call the `getter`
    methods, whereas, for changing a value or a state of an object, the user just
    needs to call the `setter` methods. These `setter` and `getter` methods, as we
    call them, are responsible for accessing and updating the private variables in
    the class that are protected from any direct access.


    2. `Inheritance`: on the other hand, is a way to reuse objects, carrying over
    what was already created and allowing added methods and attributes to be written
    on top of what you already have. This useful feature allows programmers to reuse
    what was already coded without making them rewrite code and produce redundancies.
    Reusing code can make the runtime of your application faster by eliminating duplicate
    code.


    3. `Polymorphism`: is another process that will allow you to change the method
    implementation during runtime by having a certain declared type of class and implementing
    the methods of the subtype (subclass), also known as Virtual Method Invocation
    (VMI). A discussion on classes and `VMI` will be made available in *Java Essentials
    Volume 2: Object-Oriented Programming and Beyond*.


    An object-oriented programming language must have these three main features. We
    need these features so that we can create programs that are patterned to real-life
    objects, like dates and buttons, and code that we can reuse.


    These objects may interact with other objects, like a `Student` object that can
    interact with a `Teacher` object. Another thing about object-oriented programming
    is its capability to reuse code, not just by using inheritance but also by creating
    independent code (loosely coupled code). You can create an object that will be
    used in a certain project and reuse it in another. For example, if you have a
    `Student` object being used in a desktop application, you can reuse the same object
    for a web application as well.


    Here’s another example. In a banking application, you write code that represents
    a bank customer name in a `Customer` class. This `Customer` class can be reused
    in other applications not related to the said banking project. Say you have an
    `Order` and `Purchasing System`. You don’t have to reinvent the wheel or rewrite
    the `Customer` class code. What you can do is to reuse them in both the `Banking
    System` and the `Order and Purchasing Systems`.


    ### 1.1.2 Java is Simple


    Most of the Java format was based on `C` and `C++`, so if you are a `C` or `C++`
    programmer, migrating to `Java` would be very easy. `C`, `C++`, and `Java` share
    almost all programming formats.


    Java made it easier for `C` and `C++` programmers to absorb the concepts of pointers.
    Instead of pointers, `Java` uses the concept of references. These topics will
    be discussed in.


    ### 1.1.3 Java is Robust


    Java is a strict language. It handles errors and exceptions effectively, making
    it highly reliable.


    ### 1.1.4 Java is Multi-Threaded


    Java applications can run multiple threads concurrently. This allows the application
    to perform several tasks at once, such as updating a database while handling a
    graphical user interface. Java 21 introduces *Virtual Threads* — a groundbreaking
    feature that dramatically simplifies the task of creating and managing threads.


    In older versions, each thread was tied directly to an operating system (OS) thread,
    which meant creating thousands of concurrent threads was resource-intensive. With
    Java 21’s Virtual Threads, Java applications can now create millions of lightweight
    threads that are not bound to OS threads. These virtual threads are managed by
    the Java Virtual Machine (JVM) itself.


    ### 1.1.5 Java is Network Aware


    The Java programming language was created so that users of this language can write
    applications that can share information through most types of networks. Java programmers
    can write client-server applications that can run on most types of networks.


    ### 1.1.6 Java Ensures Cross-Platform Compatibility

