    编译错误发生在代码中存在错误导致程序无法成功编译时，例如缺少分号或语法错误。运行时错误发生在程序成功编译后，但在运行过程中崩溃或表现出异常行为，例如整数除以零或访问无效的数组位置。


    ### 2.3.1 常见的编译错误


    本节讨论了初学者经常遇到的编译错误。考虑以下示例编译错误：


    ```

    HelloWorld.java:5: cannot resolve symbol

    symbol : method printl (java.lang.String)

    location: class java.io.PrintStream

    System.out.printl("Hello, Java World");

    ^

    ```


    `println()` 方法的类型输入错误。以下是导致此类编译错误的几种方式：


    1. **类名和文件命名**：你的 Java 源文件名称必须与 `public class` 的名称相同。如果没有正确遵循这一规则，你将得到类似下面的编译错误：


    ```

    TestHelloWord.java:7: public class TestHelloWorld must be defined in a file called
    "TestHelloWorld.java"

    ```


    2. **Java 源文件中 public 类的数量**：一个 Java 源文件中只能有一个 `public class`。如果你声明了多个 `public`
    顶层类，将会遇到类似的编译错误。你可以在 Java 源文件中定义多个类，只要其中只有一个类被声明为 `public`，且该 Java 源文件的文件名与该 `public
    class` 的名称一致即可。


    一旦遇到这些编译错误，你需要编辑代码、保存并重新编译。在修复所有编译错误后，你现在就可以运行你的示例应用程序了。


    `javac` 命令位于安装的 Java 开发工具包（JDK）目录下的 `\bin` 子目录下。你必须更新你的环境变量，包含 `javac` 可执行文件的路径。如果
    `javac` 命令无法工作，请参考第 0 章。


    ### 2.3.2 常见的运行时错误


    在顺利编译后，现在是时候运行你的示例应用程序了。在运行时，你可能会遇到一些错误。以下是一些常见的运行时错误示例：


    1. **找不到类 TestHelloWorld**


    如果你尝试运行一个不存在的文件或尝试运行一个拼写错误的文件，就会发生这种运行时错误。文件名的拼写必须与 `filename.class` 文件一致。


    2. **线程 "main" 中的异常 java.lang.NoSuchMethodError: main**


    这意味着你的 `main` 方法声明错误。你的 `main` 方法必须是 `public` 的，并且应该是 `static` 的，且返回类型必须为 `void`，方法名也应该是
    `main`，并必须接受一个 `String` 对象数组作为参数列表。


    发生这种运行时错误的另一个可能原因是：你尝试运行一个没有包含 `public static void main(String[] args)` 方法的类文件。`main`
    方法是应用程序执行的入口，因此当你尝试运行 Java 程序时，它必须存在。


    从 Java 11 (JEP 330) 开始，引入了“启动单文件源代码程序”功能。它允许使用 `java` 启动器直接执行 Java 源文件，而无需事先显式地使用
    `javac` 进行编译。


    与其将你的 `.java` 文件编译为 `.class` 文件然后运行 `.class` 文件，你不如使用 `java` 命令直接执行 `.java` 文件。


    当你使用源文件调用 `java` 时，启动器会自动在内存中编译代码然后执行它。这避免了在磁盘上创建中间的 `.class` 文件。


    该要求是：源文件必须包含一个带有 `public static void main(String[] args)` 方法的顶层类，该方法作为执行的入口点。


    现在可以执行此命令：


    ```

    java HelloWorld.java

    ```


    这将进行内存中编译并直接运行源代码，而不会创建外部的 `.class` 文件。


    Java 21 引入了另一个酷功能，称为“简化入口点”。在 Java 的早期版本中，每个程序都需要完整的类声明和特定的 main 方法签名：


    ```

    public static void main(String[] args)

    ```


    该方法作为任何 Java 应用程序的标准入口点，必须放置在类内部。虽然这种结构非常强大，但它引入了大量的模板代码——特别是对于编写“Hello, World!”等简单程序的初学者来说。


    从 Java 21 开始，名为“未命名类和实例 main 方法”（通过 JEP 445 引入）的新预览功能允许你编写更简单的 Java 程序，而不需要显式的类或完整的静态方法声明。例如：


    ![](img/img-70.jpg)


    在这个版本中，没有 `public`，没有 `static`，也没有类名——只有逻辑。这极大地降低了复杂性，帮助新学习者关注编程概念而非语言结构。


    要编译并运行这个简化版本，必须在编译和执行期间都使用 `--enable-preview` 标志：


    编译时：


    ```

    javac --enable-preview --release <jdkVer> HelloWorld.java

    javac --enable-preview --release 21 HelloWorld.java

    ```


    运行时：


    ```

    java --enable-preview HelloWorld

    ```


    Java 21 中的这一增强（预计在未来的 JDK 23 和 JDK 24 版本中也会出现）标志着向让 Java 更易于上手的重要一步，特别是在教育环境和初学者阶段。


    对于较新的 JDK 版本，可以直接编译和运行，无需 `--enable-preview --release 21`。


    以下是表格总结：


    | Java 版本 | 代码 | 编译/运行行为 |

    | --- | --- | --- |

    | Java 8 | 完整的类和静态 | 必须 javac 后 java |

    | Java 11 | 源代码 | 可以 java HelloWorld.java |

    | Java 21 | 只有 main() | java --enable-preview |


    ### 2.4 JShell 简介


    Java 9 的重大进展之一是引入了 JShell，这是一种让语言探索更具交互性的命令行工具。在 JShell 之前，运行即使简单的 Java 代码都需要设置整个类，然后进行编译和执行。这为快速测试代码片段带来了障碍。JShell
    通过启用读取-评估-打印循环（REPL）环境让用户可以执行 Java 代码片段。


    #### 2.4.1 什么是 JShell？


    JShell 是 Java 9 引入的 REPL（读取-评估-打印循环）工具，允许交互式执行 Java 代码，而无需编写完整的类或方法。它提供了一个控制台，可以逐执行语句或表达式。这使得
    JShell 在原型设计、调试和探索 Java 代码时非常有用。


    本质上，JShell 是让 Java 与 Python、Ruby 或 Scala 等许多其他语言提供的 REPL 工具保持一致。它的主要目的是为了实验、学习和验证代码片段。


    #### 2.4.2 它有什么用？


    JShell 的主要用途是提供一个精简的环境，让开发者快速：


    - **测试代码片段**：JShell 是尝试短代码段的好地方，无论是探索新 API 的行为、测试算法还是验证语言特性。

    - **学习和教学 Java**：JShell 是初学者交互式学习 Java 的极佳工具。教师和学习者可以实时执行代码，在获得即时反馈的同时探索语言。

    '
- fmt: '

    - Debug small portions of code: Instead of embedding debug print statements in
    full applications, developers can test smaller pieces of logic directly in `JShell`.

    - Prototype: `JShell` is useful for rapidly prototyping small pieces of functionality
    without the overhead of creating a full project.


    JShell’s REPL nature eliminates the need for writing boilerplate code, compiling,
    and running a program. It helps you focus on the core logic, encouraging experimentation
    and learning.


    ## 2.4.3 How to Use JShell


    Starting `JShell` is straightforward. After installing JDK 9 or later, simply
    open a terminal or command prompt and type:


    ```bash

    jshell <ENTER>

    ```


    Figure 2.5 Jshell sample usage


    ![](Images/fig2-5.jpg)


    This command launches the JShell environment, and you will be greeted with a prompt
    (`jshell>`) where you can start entering Java code.


    For example, to perform a simple arithmetic operation, you can type:


    ```

    5 + 10 <ENTER>

    ```


    Figure 2.6 Jshell sample usage with expression evaluation


    ![](Images/fig2-6.jpg)


    JShell immediately evaluates the expression and prints the result. Similarly,
    you can declare variables, write methods, or even define classes:


    Figure 2.7 Jshell sample usage with method declaration and usage


    ![](Images/fig2-7.jpg)


    You can see that the method `greet()` is defined and invoked immediately, without
    having to compile a class or create a main method.


    JShell can also import classes and libraries as needed, so you can explore third-party
    libraries interactively. For instance, you can easily import utility classes like
    the `java.util.Scanner` or your own classes from other packages using JShell.


    To exit JShell, you have to type `/ex` in the `JShell` prompt. From there, you
    will get a Goodbye message from `JShell`, and you will go back to your OS prompt.


    Figure 2.8 Exiting Jshell


    ![](Images/fig2-8.jpg)


    By now, you’ve written your first Java program, learned how to save it properly,
    compiled it using the `javac` command, and executed it with the `java` command.
    Along the way, you’ve also learned how to identify and fix common errors, including
    both compilation and runtime issues. You’ve seen how important it is to match
    class names with file names, follow Java’s strict syntax rules, and provide a
    properly formatted main method. You’ve also been introduced to the `System.out.print()`
    and `System.out.println()` statements for printing output. These foundational
    skills are essential for all Java programmers, and they will continue to serve
    you well as you progress to more advanced topics.


