    ## 18. The Exactly Equal To (==) and the Not Equal To (!=) Operators


    In Java, when you need to compare two values, you can use relational operators.
    Two common ones are the “exactly equal to” (`==`) operator and the “not equal
    to” (`!=`) operator.


    The `==` operator checks whether two values are the same. If they are equal, it
    returns `true`; otherwise, it returns `false`.


    On the other hand, the `!=` operator checks whether two values are different.
    It returns `true` if the values are not equal, and `false` if they are the same.


    These operators are often used in decision-making structures like `if` statements
    to control the flow of a program based on comparisons.


    ## 19. The Bitwise AND (&) Operator


    Learning about bitwise operators in Java is important because they allow us to
    manipulate data at the bit level, which is essential in scenarios that require
    high performance, low-level operations, or precise control over data.


    This example demonstrates how the bitwise AND (`&`) operator can be used in Java
    to determine whether a number is even or odd by checking the least significant
    bit (LSB) of its binary representation:


    - If the LSB is 0, the number is even.

    - If the LSB is 1, the number is odd.


    We can use the bitwise AND (`&`) operator to check this by performing `num & 1`.
    If the result is 0, the number is even; otherwise, it’s odd.


    ![](Images/img-131.jpg)


    Explanation:


    - The binary representation of 7 is `0111`.

    - Performing `7 & 1` results in `0001` because only the LSB is compared.

    - Since the result is not 0, the program concludes that 7 is odd.


    This is a quick and efficient way to check for even or odd numbers without using
    modulus (`%`).


    Consider another example of how bitwise AND (`&`) works.


    ```java

    int x = 13, y = 9;

    System.out.println(x & y);

    ```

    Output: `9`


    To perform a bitwise AND (`&`) operation, we first convert each operand to its
    binary representation and then compare each pair of corresponding bits from the
    two binary numbers. The rule is simple: the result bit is 1 only if **both** bits
    being compared are 1; otherwise, the result bit is 0.


    Let’s break it down using this example:

    `x = 1101` (which is 13 in decimal)

    `y = 1001` (which is 9 in decimal)


    Now, apply the bitwise AND operation:


    ![](Images/img-132.jpg)


    Here’s how it works, bit by bit:


    - `1 & 1 = 1`

    - `1 & 0 = 0`

    - `0 & 0 = 0`

    - `1 & 1 = 1`


    So, the result is `1001`, which is 9 in decimal.


    The bitwise AND operation compares each bit of the operands and keeps a 1 only
    in the positions where both original bits were 1. In this case, the result of
    `1101 & 1001` is `1001`, or 9 in decimal.


    ## 20. The Bitwise OR (|) Operator


    Just like the bitwise AND (`&`) operator, the bitwise OR operator (`|`) in Java
    is also useful because it allows us to perform operations that manipulate data
    directly at the bit level, enabling more control over how data is processed or
    stored.


    The bitwise OR (`|`) operator can also be used to combine multiple conditions
    in situations like managing permissions or flags. By combining multiple bits,
    you can efficiently represent and check for multiple conditions at once.


    In the UNIX filesystem, there are file permissions, and we can use the bitwise
    OR (`|`) operator to combine permissions.


    ![](Images/img-133.jpg)


    Here, `userPermissions` will enable both read and write permissions.


    Consider another example of how bitwise OR (`|`) works.


    ```java

    int x = 13, y = 9;

    System.out.println(x | y);

    ```


    To perform a bitwise OR (`|`) operation, we first convert each operand into its
    binary form, then compare each pair of corresponding bits. The rule for OR is
    straightforward: the result bit is 1 if at least one of the bits being compared
    is 1; otherwise, the result is 0.


    Let’s break it down using this example:

    `x = 1101` (which is 13 in decimal)

    `y = 1001` (which is 9 in decimal)


    Now, apply the bitwise OR operation:


    ![](Images/img-134.jpg)


    Let’s go through this bit by bit:


    - `1 | 1 = 1`

    - `1 | 0 = 1`

    - `0 | 0 = 0`

    - `1 | 1 = 1`


    So, the result is `1101` in binary, which is 13 in decimal.


    The bitwise OR operation compares each bit of the two operands and produces 1
    in every position where at least one of the bits is 1. In this case, `1101 | 1001`
    gives `1101`, or 13 in decimal, showing that the OR operation keeps all the 1’s
    from both operands.


    ## 21. The Bitwise XOR (^) Operator


    Just like the bitwise AND (`&`) operator and the bitwise OR operator (`|`), the
    bitwise XOR operator (`^`) in Java is important because it provides a powerful
    tool for performing operations that involve toggling or flipping specific bits
    in a binary number. XOR is useful in scenarios where you need to compare or change
    bits in a way that isn’t possible with standard arithmetic or logical operators.


    A clever use of XOR is swapping two values without needing a temporary variable.
    By XORing two numbers twice, you can exchange their values.


    Example: Swapping values without using a temporary variable.


    ```java

    int x = 5, y = 10;

    x = x ^ y;

    y = x ^ y;

    x = x ^ y;

    ```

