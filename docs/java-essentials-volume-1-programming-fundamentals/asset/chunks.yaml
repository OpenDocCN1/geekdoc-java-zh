    ### 14. The Shift Left (<<) Operator


    The shift left operator will shift all significant bits to the left based on the
    value indicated. Consider the given values:


    ```java

    int x = 5;

    System.out.println(x << 2);

    ```


    The binary value of `x` will be shifted 2 binary spaces to the left, giving us
    an output of 20.


    ### 15. The Shift Right (>>) Operator


    This will shift all significant bits to the right.


    ```java

    int x = 5;

    System.out.println(x >> 2);

    ```


    This will give you an output of 1. You have to shift all significant bits two
    spaces to the right; whatever bits go out of bounds are dropped.


    ### 16. The Unsigned Shift Right (>>>) Operators


    Unlike the previous two operators (shift left and shift right), the unsigned shift
    right operator is unique to Java. This is how it works:


    ```java

    int x = 5;

    System.out.println(x >>> 2);

    ```


    Since `x` is declared as an `int`, we will use 32 bits. Then, we will use an unsigned
    shift right to shift all significant bits to the right 5 spaces. Answer is 1.


    So, what’s the difference between the shift right (`>>`) and the unsigned shift
    right (`>>>`) operators? The difference is the treatment of negative numbers.
    In Java, negative binary numbers are represented using the two’s complement. This
    method reserves the leftmost bit as the sign bit, where 0 indicates positive and
    1 indicates negative. To compute the two’s complement of a number, you invert
    all the bits (change 0s to 1s and vice versa) and then add 1 to the inverted value.
    This approach allows for simple binary arithmetic operations and eliminates the
    need for a separate subtraction operation. It also makes it easier for Java to
    handle negative values with the same set of instructions as positive values. For
    example:


    ```java

    int x = -5;

    System.out.println(x >> 2);

    System.out.println(x >>> 2);

    ```


    Notice that even the sign bit moved, thus the name, unsigned shift right.


