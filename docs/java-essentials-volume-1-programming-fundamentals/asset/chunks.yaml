  raw: 'In the industry, Dr. Decamora has collaborated with leading organizations
    like Sun Microsystems Philippines, Phoenix One, and ActiveLearning Inc., providing
    Java training and software development solutions. His expertise spans Java programming,
    enterprise applications, and web technologies.


    Beyond teaching, Dr. Decamora is a sought-after speaker and trainer, having conducted
    seminars and workshops on Java programming, software engineering, and emerging
    technologies. His passion for knowledge sharing is evident in his commitment to
    empowering learners through practical insights and real-world applications.


    This book is a testament to his dedication to making Java accessible to learners
    at all levels. Through clear explanations and hands-on examples, Dr. Decamora
    continues to inspire and guide the next generation of developers.


    ![](Images/img-ix.jpg) **Michelle C. Decamora**, MIT, is a dedicated educator
    and experienced IT professional with a passion for empowering students through
    knowledge and hands-on learning. With a Master''s in Information Technology and
    extensive teaching experience, she has made significant contributions to the field
    of computer science education.


    Michelle has served as an Information Technology Instructor at esteemed institutions,
    including CIIT College of Arts and Technology and De La Salle-College of Saint
    Benilde. Her commitment to academic excellence extends beyond the classroom, having
    previously held leadership roles such as Academic Supervisor and Head at Systems
    Technology Institute (STI), Malabon, where she supervised faculty, developed curricula,
    and ensured academic quality.


    Michelle''s expertise in database management, Java programming, and application
    development has equipped her with a comprehensive understanding of both theoretical
    and practical aspects of IT.


    In addition to her teaching role, Michelle has attended numerous specialized training
    programs, including IBM DB2 Academic Training, AutoCAD with Color Rendering, and
    advanced Macromedia Flash application development. Her dedication to continuous
    learning has earned her recognition, including the IBM Certified Academic Associate
    credential in DB2 Database and Application Fundamentals.


    As a co-author of this book, Michelle shares her wealth of knowledge and practical
    insights to guide learners in their journey into Java programming. Her collaborative
    approach to teaching and passion for fostering student growth make her an invaluable
    contributor to this educational resource.


    What Experts Say About This Book!


    Lawrence Decamora has crafted an exceptionally well-structured introduction to
    Java programming that stands out in the crowded field of programming textbooks.
    As an educator myself, I''m impressed by the book''s thoughtful progression from
    fundamental concepts to practical application.


    What makes this book particularly valuable is its "learning while practicing"
    philosophy. Rather than overwhelming beginners with abstract theory, Lawrence
    guides readers through hands-on experiences that build confidence incrementally.
    The integration of JShell for interactive learning is brilliant and reflects modern
    pedagogical best practices.


    The book''s comprehensive coverage—from JDK installation across multiple operating
    systems to essential programming concepts like control structures, arrays, and
    string manipulation—provides students with a solid foundation. Each chapter''s
    careful construction, complete with exercises, quizzes, and coding tasks, ensures
    that concepts are not merely memorized but truly understood.


    Lawrence''s emphasis on real-world programming practices, including debugging
    techniques and coding conventions, prepares students for actual development work
    rather than just academic exercises. The clear writing style and logical progression
    make complex concepts accessible to beginners while maintaining the depth necessary
    for serious learning.


    This volume effectively sets the stage for more advanced topics to be covered
    in Volume 2, making it an excellent choice for educational institutions and self-directed
    learners alike.


    – David Smith, CEO,


    Silicon Valley High School, Inc.


    As someone who has seen Lawrence’s teaching style up close, especially when we
    worked together on the on-demand Java course for LearningWhilePracticing, I’m
    not at all surprised by how clear, structured, and pedagogically strong this book
    is. That same clarity and hands-on mindset translate beautifully onto the page.
    The explanations are precise without being overwhelming, and the pacing feels
    just right. Concepts are introduced gradually, with each chapter building logically
    on the previous one. The inclusion of chapter summaries, quizzes, and coding tasks
    at the end of each section is a fantastic way to reinforce learning.


    The structure is excellent. From installing the JDK all the way to understanding
    arrays, the content covers exactly what a beginner needs to gain confidence. It
    also goes beyond just “hello world” basics by including crucial real-world elements
    like debugging, JShell, the Scanner class, and string manipulation—all while staying
    accessible. The sections on Java control structures and primitive data types really
    stand out. They strike the perfect balance between theory and application, especially
    with how coding conventions and readability are emphasized. Also, the “learning
    while practicing” approach is more than a philosophy—it’s embedded in the book’s
    DNA.


    – Joe Ghalbouni, Founder,


    Learning While Practicing


