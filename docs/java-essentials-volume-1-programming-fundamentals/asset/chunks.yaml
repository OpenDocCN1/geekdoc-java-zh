    saved, you can verify the file’s presence by listing the contents of the folder
    using the ls command (on the UNIX system or Mac OS) or dir on Windows.


    Figure 2.2 Screenshot of the terminal window in a Mac OS Machine using the ls
    command


    ![](Images/fig2-2.jpg)


    To compile your Java source code, open your terminal and use the javac command,
    which stands for “Java compile.” You need to provide the name of the file you
    want to compile, like so: javac HelloWorld.java. If your code is syntactically
    correct and matches the file name and class name, this command will produce a
    file named HelloWorld.class. This new file contains Java bytecode, which is the
    intermediate form of your program that the Java Virtual Machine (JVM) can execute.
    You can also list the folder contents again to verify that the .class file was
    successfully generated.


    Figure 2.3 Screenshot of the terminal window in a Mac OS Machine after using javac
    to compile and the ls command to display the contents of the folder


    ![](Images/fig2-3.jpg)


    After compiling, you’re now ready to run your program. This time, use the java
    command followed by the name of the class that contains the main method, without
    adding the .class or .java extension. In our case, type java HelloWorld. If everything
    was done correctly, the console will display the message “Hello, World”, confirming
    that your Java program has been successfully written, compiled, and executed.


    For a Windows Machine, instead of opening the terminal window, we open the Command
    Prompt then we can also use the mkdir and the cd commands. But for the ls, we
    use dir instead for displaying the contents of the drive.


