    此程序将被保存为 `HelloWorld.java`，其目的是在屏幕上显示一条简单的消息。在 Java 中，每个应用程序都从类定义开始。对于我们的示例，我们在第
    2 行使用代码 `public class HelloWorld` 声明了一个名为 `HelloWorld` 的类。在这个类内部，我们定义了程序的入口点，即
    `main` 方法。该方法的正确格式是第 3 行的 `public static void main(String[] args)`，它必须按照所示内容完全编写，因为
    Java 是区分大小写的。


    以下是第 3 行的解析**：** `public static void main(String[] args)`


    *   `public` 意味着你的方法可以在任何地方被访问。

    *   `static` 是一种修饰符，意味着你的方法不属于类的特定实例，而是专属所有权归类所有。

    *   `void` 是 `main` 方法的返回类型。它意味着 `main` 方法不返回任何类型的值。

    *   `main` 是方法名。然而，`main` 方法是一种特殊类型的方法，告诉 Java 这是你应用程序的起点。所有 Java 应用程序都从 `main`
    方法开始执行，其方法签名应该是 `public static void main(String[] args)`。

    *   `String[] args`，这位于你的 `main` 方法的参数列表中。这意味着你的 `main` 方法应该接受一个 `String` 对象数组作为其参数。这也可以重写为
    `String args[]`，本质上，两种形式是相同的。


    在 `main` 方法内部，我们在第 4 行包含了一个使用 `System.out.println("Hello, World");` 向控制台打印文本的语句。此行代码指示
    Java 运行时按照编写的内容显示“Hello, World”字样。Java 中的每个语句都以分号结束，因此请务必包含它。至此，你现在有了一个完整的 Java
    程序，准备好保存、编译和执行。


    ![](img/rules.png) 规则


    1. 你的 `public` 类名应与你的文件名相同。

    2. 你的 `.java` 文件中只能有一个 `public` 类。此外，一对大括号 `{ }` 代表一个作用域。它用于将相关的程序段分组。它可以用于控制结构、方法和类。

    3. 在你的 Java 代码中，左大括号（`{`）和右大括号（` }`）的数量相等。

    4. 任何 Java 应用程序的执行始终从你的 `main` 方法开始。你的 `main` 方法的签名应该是：

    ```

    public static void main(String[] args)

    ```

    5. Java 中的所有内容都是区分大小写的


    Java 是一种区分大小写的语言，这意味着像 `Main`、`main` 和 `MAIN` 标识符被认为是完全不同的。这适用于类名、方法名和变量名。因此，文件名与类名完全匹配（包括大小写字母）是关重要的。例如，如果你的类声明为
    `public class HelloWorld`，那么文件名必须是 `HelloWorld.java`。如果大小写不匹配，编译器将生成一个错误，指示 `public`
    类必须在具有对应名称文件中声明。此外，Java 程序需要正确的语法。语句必须以分号结束，且引号、括号和大括号必须始终成对出现。未能遵守这些基本规则将在编译期间产生语法错误。


    ### 2.1.1 保存你的程序


    一旦你写好了程序，下一步是正确地保存它。最佳实践是创建一个专用文件夹来组织你的 Java 源代码文件。使用终端窗口（如果你使用的是 Mac 电脑或 Linux
    电脑）或命令提示符（如果你使用的是任何 Windows 电脑），你可以通过输入 `mkdir javacodes` 创建名为 `javacodes` 的文件夹，然后使用
    `cd javacodes` 命令进入该目录。


    图 2.1 Mac OS 电脑终端窗口截图


    ![](img/fig2-1.jpg)


    之后，返回你的文本编辑器并将你的 Java 文件保存在此文件夹中。确保文件名与类名完全匹配并以 `.java` 扩展结尾。在这种情况下，由于类名为 `HelloWorld`，文件必须命名为
    `HelloWorld.java`。使用不同的名称或大小写保存会导致编译错误。保存后，你可以通过 `ls` 命令（在 UNIX 系统或 Mac OS 上）或
    Windows  `dir` 列出文件夹内容来验证文件是否存在。


    图 2.2 Mac OS 电脑上使用 `ls` 命令的终端窗口截图


