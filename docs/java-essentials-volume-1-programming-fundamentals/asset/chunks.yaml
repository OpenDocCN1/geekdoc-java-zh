    [6.3 The StringBuffer and StringBuilder Classes](#07_Contents.xhtml_chhead62)


    6.3.1 StringBuffer


    StringBuffer is a mutable sequence of characters that allows modifications, unlike
    regular String objects. It can change its length and content through various methods,
    making it flexible for handling dynamic text. Additionally, StringBuffer is thread-safe,
    ensuring that multiple threads can work with it without causing synchronization
    issues.


    StringBuffers are safe for use by multiple threads. The methods are synchronized
    where necessary so that all the operations on any particular instance behave as
    if they occur in some serial order that is consistent with the order of the method
    calls made by each of the individual threads involved.


    The principal operations on a StringBuffer are the append and insert methods,
    which are overloaded so as to accept data of any type. Each effectively converts
    a given expression to a String and then appends or inserts the characters of that
    String to the StringBuffer. The append method always adds these characters at
    the end of the buffer; the insert method adds the characters at a specified point.


    The append() method belongs to both the StringBuffer and StringBuilder classes,
    while the concat() method belongs to the String class.


    6.3.2 StringBuilder


    StringBuilder is a mutable sequence of characters. This class provides an API
    compatible with StringBuffer, but with no guarantee of synchronization. This class
    is designed for use as a drop-in replacement for StringBuffer in places where
    the StringBuffer was being used by a single thread (as is generally the case).
    Where possible, it is recommended that this class be used in preference to StringBuffer
    as it will be faster under most implementations.


    The principal operations on a StringBuilder are the append and insert methods,
    as well, which are also overloaded so as to accept data of any type. Each effectively
    converts a given expression to a String and then appends or inserts the characters
    of that String to the StringBuilder. The append method always adds these characters
    at the end of the builder, same as StringBuffer; the insert method adds the characters
    at a specified point, also the same as StringBuffer.


    6.3.3 The append() and the insert() Methods of the StringBuffer and StringBuilder
    Classes


    **Example1:**


    StringBuffer sb = new StringBuffer("abc");


    sb.append("def");


    System.out.println(sb);


    **Output:**


    abcdef


    **Example2:**


    StringBuffer sb = new StringBuffer("abc");


    sb.insert(1, "def");


    System.out.println(sb);


    **Output:**


    adefbc


    These methods will have the same effect on both StringBuffer and StringBuilder
    objects.


    To get the complete list of methods for String, StringBuffer, and StringBuilder
    classes, it is still best to look them up in the Java API Documentation.


