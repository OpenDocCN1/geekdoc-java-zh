    a. The JDK can run, but it must be properly installed and configured first.


    b. The installation process for a root user for a Linux machine typically uses
    a tar.gz installer.


    c. The installation process in a Windows operating system is almost the same regardless
    of the Windows OS version.


    d. The Mac OS installer uses a dmg file.


    Answers


    | 1 **– d** | 2 **– a** | 3 **– a** | 4 **– c** | 5 **– c** |


    | 6 **– a** | 7 **– b** | 8 **– c** | 9 **– d** | 10 **– b** |


