    An object-oriented programming language must have these three main features. We
    need these features so that we can create programs that are patterned to real-life
    objects, like dates and buttons, and code that we can reuse.


    These objects may interact with other objects, like a Student object that can
    interact with a Teacher object. Another thing about object-oriented programming
    is its capability to reuse code, not just by using inheritance but also by creating
    independent code (loosely coupled code). You can create an object that will be
    used in a certain project and reuse it in another. For example, if you have a
    Student object being used in a desktop application, you can reuse the same object
    for a web application as well.


    Here’s another example. In a banking application, you write code that represents
    a bank customer name in a Customer class. This Customer class can be reused in
    other applications not related to the said banking project. Say you have an Order
    and Purchasing System. You don’t have to reinvent the wheel or rewrite the Customer
    class code. What you can do is to reuse them in both the Banking System and the
    Order and Purchasing Systems.


    1.1.2 Java is Simple


    Most of the Java format was based on C and C++, so if you are a C or C++ programmer,
    migrating to Java would be very easy. C, C++, and Java share almost all programming
    formats.


    Java made it easier for C and C++ programmers to absorb the concepts of pointers.
    Instead of pointers, Java uses the concept of references. These topics will be
    discussed in detail in Volume 2 of this series.


    1.1.3 Java is Robust


    Java is a strict, highly disciplined programming language. It deals with clear
    errors and enables you to trap exceptions, and has no ambiguous structure. Everything
    is clear in Java, including its syntax, rules, and structure. It clearly deals
    with and handles exceptions and displays clear error messages that are beneficial
    to programmers whenever they debug their code.


    1.1.4 Java is Multi-Threaded


    Java applications can run several threads, sometimes called sub-processes or parallel
    processes. A thread is a virtual CPU, which is similar to a virtual machine. It
    contains three things: the virtual CPU, the code, and the data.


    Multi-threading makes use of these three elements and creates its own independent
    runtime process inside a running Java application. It is extremely useful in practice.
    For example, a browser should be able to simultaneously download multiple images
    while accessing other data storage devices or printing a document. Another example
    is a web server. It needs to be able to serve concurrent requests, and each request
    that it serves is another thread process.


    Multithreading and Multitasking are somewhat similar, as both are managed by the
    underlying Operating System (OS). Multi-tasking is the ability of the OS to manage
    multiple concurrent applications that run on top of the OS, while multi-threading
    is the process of managing each smaller process (also known as threads) that runs
    in a single application.


    [Figure 1.1](#16_Ch01.xhtml_c1f1) illustrates Java’s multithreading capability,
    where multiple threads can run concurrently within a single Java program to handle
    different tasks like the graphical user interface, database access, and printing.
    Each thread operates independently, allowing the application to be more responsive
    and efficient by performing tasks in parallel.


    A Java GUI Application can update the database while printing and updating the
    record on the GUI display is an example of a multi-threaded application.


    Figure 1.1 Multithreading diagram on a sample application


    ![](Images/fig1-1.jpg)


    However, Java 21 introduces *Virtual Threads* — a groundbreaking feature that
    dramatically simplifies the task of creating and managing threads, especially
    when compared to the traditional platform threads used in older Java versions.


    In older Java versions, each thread was tied directly to an operating system (OS)
    thread, which meant creating thousands of concurrent threads was resource-intensive
    and could quickly overwhelm the system due to memory and CPU constraints. Managing
    such threads also required careful tuning, the use of thread pools, and asynchronous
    programming models that added complexity to codebases.


    With Java 21’s Virtual Threads, Java applications can now create millions of lightweight
    threads that are not bound to OS threads. These virtual threads are managed by
    the Java Virtual Machine (JVM) itself, allowing them to be suspended and resumed
    efficiently without blocking system resources. As a result, developers can write
    simple, blocking-style code (e.g., using Thread.sleep() or waiting on I/O) without
    the performance penalty traditionally associated with it. This means clearer,
    more maintainable code without the need for complex concurrency frameworks or
    callback hell.


    In summary, Java 21’s virtual threads make concurrent programming far more scalable,
    efficient, and beginner-friendly, offering the simplicity of synchronous code
    with the scalability of asynchronous execution.


    1.1.5 Java is Network Aware


    The Java programming language was created so that users of this language can write
    applications that can share information through most types of networks.


    Java programmers can write client-server applications that can run on most types
    of networks. A Java-based server application can run on one physical machine,
    while another browser-based client can request information and run on a different
    machine. At some point, Java was called the Internet Programming Language, which
    allows developers to create applications that run on the web.


    1.1.6 Java Ensures Cross-Platform Compatibility'
