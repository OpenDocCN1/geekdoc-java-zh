    [![](Images/code.png) Coding Task](#07_Contents.xhtml_chhead75)


    Coding Task 1:


    Create a Java program that will ask the user to input any type of String values
    via a command line. The output should contain the args[i] value, the length of
    the input String, the actual String, and the type of character of the last character
    of the input String. The types of characters are as follows: vowels, consonants,
    numbers, and symbols. The only time you can consider a certain character as a
    symbol is when it is not a vowel, nor a consonant, nor a number.


    **Here’s a sample IO:**


    java ArrayExercise productiveWork 7654321 javajava $$$ <ENTER>


    **Output:**


    args[0] = productiveWork = 14 = consonant


    args[1] = 7654321 = 7 = number


    args[2] = javajava = 8 = vowel


    args[3] = $$$ = 3 = symbol


    Coding Task 2:


    Write a Java program that accepts two positive integer values from the command
    line. The first value represents the number of rows. The second value represents
    the number of columns.


    Use these two values to generate and display a multiplication table, where each
    cell contains the product of its corresponding row and column numbers.


    **Here’s a sample IO:**


    java MultiplicationTable 3 5 <ENTER>


    **Output:**


    ![](Images/img-240.jpg)


    Coding Task 3:


    Write a Java program that takes an array of strings via the command line (e.g.,
    names of fruits), and prints the elements in reverse order.


    **Here’s a sample IO:**


    java ReverseArrayElements Apple Banana Cherry <ENTER>


    Use a for loop that starts from the last index down to the first. Print each element
    on a new line.


    **Output:**


    Original order: Apple, Banana, Cherry


    Reversed order:


    Cherry


    Banana


    Apple


    Coding Task 4:


    Create a Java program that will accept 5 integer values and store them in an array
    of int. The program should identify and print the largest value in the array.


    **Here’s a sample IO:**


    Enter 5 integer values:


    75 <ENTER>


    -3 <ENTER>


    50 <ENTER>


    98 <ENTER>


    1 <ENTER>


    **Output:**


    The highest number in the array is: 98


    ![](Images/more.png) Practice More, Get Better!


    Additional coding tasks for this chapter are available in the exclusive online
    resources that accompany this book.


    [Glossary](#07_Contents.xhtml_chhead76)


    Array: A container object that holds a fixed number of values of a single type.


    Array Limits: The fixed size of an array once it is created; cannot be changed.


    Array of Arrays (Two-dimensional Arrays): Arrays where each element is itself
    an array; used to represent matrices or tables.


    Block: A group of zero or more statements enclosed in braces {}.


    Break Statement: Used to exit a loop or switch statement prematurely.


    Coding Conventions: A set of guidelines for writing code to improve readability
    and maintainability.


    Command Line Arguments: Parameters passed to the main() method when a Java program
    is executed from the terminal.


    Compile-Time Errors: Errors detected by the compiler due to incorrect syntax or
    misuse of Java language rules.


    Continue Statement: Skips the current iteration of a loop and proceeds to the
    next cycle.


    Debugging: The process of identifying and fixing bugs in code.


    do-while Loop: A control flow statement that executes a block of code at least
    once, and then repeatedly based on a condition.


    Enhanced for loop: A simplified loop used to iterate through arrays or collections
    without an index variable.


    for Loop: A control flow statement for executing a block of code a fixed number
    of times.'
