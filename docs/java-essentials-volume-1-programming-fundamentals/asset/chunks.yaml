    In Java, arrays represent one of the most essential and straightforward data structures
    to store fixed-size collections of elements of the same data type. When an array
    is created, its elements are automatically initialized with default values based
    on the type. The size of an array can be determined using the `.length` attribute,
    which is useful for controlling loop execution and avoiding index errors. Java
    provides multiple techniques for working with arrays efficiently. The enhanced
    for loop offers a cleaner and more readable approach to iterating through array
    elements. Additionally, the `System.arraycopy()` method simplifies the task of
    copying data between arrays.


    Java also allows the use of command-line arguments, which are passed as an array
    of strings to the `main` method, providing an alternative way to receive input.


    Furthermore, Java supports both one-dimensional and two-dimensional arrays. Two-dimensional
    arrays are implemented as arrays of single-dimensional arrays, allowing for the
    creation of rectangular and non-rectangular (jagged) array structures.


    ![![](Images/sum.png) Chapter Summary](#07_Contents.xhtml_chhead73)


    - Arrays are the simplest data structure in most programming languages, including
    Java.

    - Arrays have initial values upon creation.

    - Array limits can be determined using the `.length` attribute.

    - The enhanced for-loop can be an alternative way to iterate through an array.

    - The `System.arraycopy()` method is the easiest way to copy the contents of an
    array.

    - Command-line arguments are an alternative way to accept string values in Java.

    - Two-dimensional arrays are treated as an array of single-dimensional arrays.

    - Both rectangular and non-rectangular arrays are features in Java.


    ![![](Images/quiz.png) Quiz](#07_Contents.xhtml_chhead74)


    1. Which of the following statements about arrays in Java is NOT TRUE?


    a. Arrays in Java will have a size once it is created. You can know the size of
    the array by calling the `.length` attribute

    b. The elements in an array are accessed using a non-negative integer index.

    c. The elements of the array are referenced using integer indexes from `0` to
    `n-1`, inclusive.

    d. To get the number of elements of an array, we can use the method `size()`.


    2. If I have an array having 10 elements, what is the legal range of index values?


    a. `1` to `10`

    b. `0` to `9`

    c. `0` to `10`

    d. The index depends on the data type of the arrays


    3. Given the array declaration:


    ```

    int[] myArray = {10, 20, 30, 40, 50};

    ```

    Choose the correct way to get the size of the array.


    a. `myArray[].length`

    b. `myArray.size`

    c. `myArray[].size`

    d. `myArray.length`


    4. Given the code snippet:


    ```java

    int sum = 0;

    int[] myArray = {10, 20, 30, 40, 50};

    ```


    Which enhanced for loop should we use in order to compute the sum of all the elements
    in the array?


    a. `for (int n : myArray) sum =+ n;`

    b. `for (myArray : n) sum += n;`

    c. `for (int n : myArray) sum += n;`

    d. `for (int n : myArray[]) sum += n;`


    5. Given the code body of the class `MyCode`:


    ![![](Images/img-236.jpg)]


    Given the `CommandLine` argument call:


    ```bash

    java MyCode 10 20 30

    ```

    What will be the output?


    a. `102030`

    b. `60`

    c. `10 20 30`

    d. `ArrayIndexOutOfBoundsException` will occur at runtime.


    6. Consider the following sample code snippet:


    ![![](Images/img-237.jpg)]


    Given the command line arguments, executing the file `MyJavaCode`:


    ```bash

    java MyJavaCode apple "bike bike" cat <ENTER>

    ```

    What will be the output during runtime?


    a. An error will occur during runtime.

    b. `applebikecat`

    c. `applebikebike`

    d. `applebike bikecat`


    7. If I have an array having 100 elements, what is the legal range of index values?


    a. `0` to `99`

    b. `1` to `99`

    c. `1` to `100`

    d. The values depend on the operating systems.


    8. Given the following array declaration, which one is the INCORRECT way to declare
    an array?


    a. `char ch[][] = new char[2][3];`

    b. `int[] a[] = new int[][2];`

    c. `boolean [] bool [] = new boolean[1][];`

    d. `byte[][] b = new byte[10][20];`


    9. Given the declaration:


    ```java

    int[][] jaggedArr = {{1, 2}, {3, 4, 5}, {6, 7, 8, 9}};

    ```

    Which of the following options will print the size of the shortest array?


    a. `System.out.println(jaggedArr[2].length);`

    b. `System.out.println(jaggedArr[1].length);`

    c. `System.out.println(jaggedArr[0].length);`

    d. `System.out.println(jaggedArr[3].length);`


    10. Given the following code, what will be the output?


    ![![](Images/img-238.jpg)]


    a. `3`

    b. `1`

    c. `5`

    d. `7`


    Answers


    | 1 – d | 2 – b | 3 – d | 4 – c | 5 – a |

    | --- | --- | --- | --- | --- |

    | 6 – d | 7 – a | 8 – b | 9 – c | 10 – a |

