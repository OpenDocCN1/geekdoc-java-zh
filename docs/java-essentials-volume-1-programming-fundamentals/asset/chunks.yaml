    statements. It simplifies the syntax, allowing code to be cleaner and more expressive.
    With this, cases can return values or execute multiple statements without needing
    a `break` to prevent fall-through, which reduces common errors and makes the code
    easier to read and maintain.


    ![](Images/img-168.jpg)


    Using the arrow operator (`->`), you can also assign a value to a variable from
    a switch-case statement.


