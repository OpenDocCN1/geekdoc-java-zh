    \n## 7.6 Array of Arrays (Two-Dimensional Arrays)\n\nA two-dimensional array in\
    \ `Java` is like a table with rows and columns. You can think of it as an array\
    \ of arrays. Each element in a two-dimensional array is accessed using two indices:\
    \ one for the row and one for the column. You can have a rectangular “normal”\
    \ two-dimensional array or a non-rectangular array.\n\n### 7.6.1 Rectangular Two-Dimensional\
    \ Arrays\n\nLet’s first take a look at the “normal” two-dimensional array. Consider\
    \ this example:\n\n![](Images/img-227.jpg)\n\nIn this example:\n\n* `numbers[0][0]`\
    \ refers to 10 – This is the element in row 0, column 0.\n* `numbers[0][1]` refers\
    \ to 20 – This is the element in row 0, column 1.\n* `numbers[0][2]` refers to\
    \ 30 – This is the element in row 0, column 2.\n* `numbers[1][0]` refers to 40\
    \ – This is the element in row 1, column 0.\n* `numbers[1][1]` refers to 50 –\
    \ This is the element in row 1, column 1.\n* `numbers[1][2]` refers to 60 – This\
    \ is the element in row 1, column 2.\n\nYou can visualize the array like this:\n\
    \nRow 0 → [10] [20] [30]\n\nRow 1 → [40] [50] [60]\n\nEach element is accessed\
    \ by its row index, followed by its column index, using the syntax: `numbers[row][column]`.\n\
    \nJust remember that array indices will always start with 0, even if it is a two-dimensional\
    \ array.\n\nHere are other practical examples when we can use two-dimensional\
    \ arrays:\n\n1. **Spreadsheets or Tables**\n\n   Think of a program like `Microsoft\
    \ Excel` or `Google Sheets`. Each cell in a spreadsheet can be identified by a\
    \ row and a column. Similarly, a two-dimensional array lets you store and access\
    \ data using two indices.\n\n   **Example:**\n\n   ![](Images/img-228a.jpg)\n\n\
    \   * `grades[0][0]` is “Matthew” (row 0, column 0)\n   * `grades[0][1]` is “85”\
    \ (row 0, column 1)\n\n   This is useful when storing student names and their\
    \ scores, or any data structured in rows and columns.\n\n2. **Game Boards (e.g.,\
    \ Chess, Tic-Tac-Toe)**\n\n   Games that involve grids are a perfect use case\
    \ for 2D arrays. Each square on a chessboard, for instance, can be represented\
    \ using a row and column.\n\n   **Example:**\n\n   ![](Images/img-228b.jpg)\n\n\
    \   You can easily check for a winner by scanning across rows, columns, or diagonals.\n\
    \n3. **Images or Pixels**\n\n   In digital images, each pixel can be thought of\
    \ as a tiny square on a grid with a color value. You can represent this with a\
    \ 2D array where each cell holds a color value.\n\n   **Example:**\n\n   ![](Images/img-229a.jpg)\n\
    \n   This can be used for image processing, filters.\n\n4. **Seating Charts**\n\
    \n   In classrooms, theaters, or airplanes, seats are arranged in rows and columns.\n\
    \n   **Example:**\n\n   ![](Images/img-229b.jpg)\n\n   This allows your program\
    \ to manage reservations.\n\nA two-dimensional array is a versatile structure\
    \ for modeling real-world layouts. For Java beginners, mastering 2D arrays opens\
    \ the door to more complex problem-solving.\n\nYou can also create and declare\
    \ a two-dimensional array with default values.\n\n```java\nint[][] arr2d = new\
    \ int[3][4];\n```\n\nWe will use a memory diagram to visualize how the array is\
    \ structured.\n\nFigure 7.3 Two-dimensional array memory allocation\n\n![](Images/fig7-3.jpg)\n\
    \nAll elements are initialized to zero (0) since it is the default value of an\
    \ `int`.\n\nDeclaring and initializing a multidimensional array is also possible\
    \ this way:\n\n![](Images/img-230.jpg)\n\nFigure 7.4 Two-dimensional array memory\
    \ allocation with values\n\n![](Images/fig7-4.jpg)\n\nTake a look at this example:\n\
    \n![](Images/img-231a.jpg)\n\nThis is a sample of the multiplication table having\
    \ 3 rows and 4 columns. As you notice, all the data types in their columns and\
    \ rows are of the same type. Here is its output once you compile and run this:\n\
    \n![](Images/img-231b.jpg)\n\n### 7.6.2 Non-Rectangular Arrays\n\nSince you are\
    \ allowed to declare an array of arrays, you can also create a non-rectangular\
    \ array of arrays. This means you can declare arrays this way.\n\n![](Images/img-232a.jpg)\n\
    \nAs you notice, `irregularArray[0]` can only hold 3 integer values, while `irregularArray[1]`\
    \ can hold up to 5 integer values. Even though it is a non-rectangular array,\
    \ its respective default values will still be assigned upon creation.\n\nFigure\
    \ 7.5 A non-rectangular array with default values\n\n![](Images/fig7-5.jpg)\n\n\
    Here are the commonly encountered errors in declaring a non-rectangular array:\n\
    \n**Incorrect Syntax Example:**\n\n![](Images/img-232b.jpg)\n\nThis code results\
    \ in a compile-time error because you cannot directly assign a block of values\
    \ ({...}) to an already initialized array reference without using the `new` keyword\
    \ properly.\n\n**Corrected Version:**\n\n![](Images/img-233.jpg)\n\nOr if you\
    \ want to do it step-by-step:\n\n```java\nint[][] jaggedArray = new int[3][];\n\
    jaggedArray[0] = new int[]{1, 2};\njaggedArray[1] = new int[]{3, 4, 5};\njaggedArray[2]\
    \ = new int[]{6};\n```\n"
