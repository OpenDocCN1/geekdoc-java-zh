    Here, the array `coffee` is initialized with four string elements: "Barako", "Espresso",
    "Java", and "Mocha chino". Each element is automatically assigned an index starting
    from 0, meaning "Barako" is at index 0, "Espresso" at index 1, and so on.


    This type of array is useful for storing and accessing a fixed set of related
    data items, such as menu options or product names, using indexed access within
    a loop or conditional structure.


    ### Figure 7.2 List of String values per array index


    ![](Images/fig7-2.jpg)


    The index of the array `coffee[]` starts with 0 and ends with 3. So if you want
    to access Java, you would do it like this:


    ```java

    System.out.println ("I love " + coffee[2]);

    ```


    This will give you an output like this:


    I love Java


    How do you access the last element of your array without knowing the exact number
    of elements in your array? Since arrays in Java are objects, they have a `length`
    attribute that returns the actual length of the array.


    In Java, `.length` is a property used in arrays to determine the number of elements.
    It provides the size of the array, meaning how many slots it contains, regardless
    of whether those slots hold meaningful data. This is particularly helpful when
    working with arrays, as their size is fixed upon creation and cannot change dynamically.


    Here’s an example of how `.length` is used:


    ![](Images/img-219a.jpg)


    **Output:**


    Number of coffees I had for the day: 4


    In this example, `.length` returns 4 because there are four elements in the `numbers`
    array.


    You can access the last element of the array `coffee` in the following way:


    ```java

    System.out.println ("My last coffee for the day is a "

    + coffee[coffee.length-1]);

    ```


    The output will be like this:


    My last coffee for the day was a Mocha chino


    `coffee.length` returns the number of elements in the array `coffee`, which is
    4. Therefore, we need to use `coffee.length-1` to access the last element of the
    array `coffee`. Without the -1, it will throw an `ArrayIndexOutOfBoundsException`.
    It means you are attempting to access an element that is beyond the array bounds,
    in this case, beyond 0 to 3.


    But how am I going to print all the elements of the array `coffee`?


    That’s easy. You can use a `for` loop or any type of loop to do it for you.


    ![](Images/img-219b.jpg)


    The output would be like this:


    The coffee lovers'' choices are:


    Barako

    Espresso

    Java

    Mocha chino


    Using an integer variable `i` as an index, you can access all the elements of
    the array `coffee` from the first element until the last element `coffee.length-1`.


    Now drink up and enjoy your coffee!


