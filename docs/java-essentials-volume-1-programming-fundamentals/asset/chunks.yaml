    ## 19. 位按与 (&) 运算符


    学习 Java 中的按位运算符是非常重要的，因为它们允许我们在位级别上操纵数据，这在需要高性能、低级操作或对数据进行精确控制的场景中至关重要。


    此示例演示了如何在 Java 中使用位按与 (`&`) 运算符通过检查二进制表示的最低位（LSB）来判断一个数字是偶数还是奇数：


    -   如果 LSB 为 0，则该数为偶数。

    -   如果 LSB 为 1，则该数为奇数。


    我们可以通过执行 `num & 1` 来使用位按与 (`&`) 运算符进行此检查。如果结果为 0，则该数为偶数；否则为奇数。


    ![](img/img-131.jpg)


    解释：


    -   7 的二进制表示为 `0111`。

    -   执行 `7 & 1` 的结果为 `0001`，因为只比较了 LSB。

    -   由于结果不是 0，程序得出结论 7 是奇数。


    这是一种在不使用取模 (`%`）的情况下检查奇偶数的快速且高效的方法。


    考虑另一个位按与 (`&`) 运行的例子。


    ```java

    int x = 13, y = 9;

    System.out.println(x & y);

    ```

    输出：`9`


    要执行位按与 (`&`) 运算，我们首先将每个操作数转换为其二进制表示，然后比较两个二进制数中每一对对应的位。规则非常简单：只有当被比较的**两个**位均为
    1 时，结果位才为 1；否则，结果位为 0。


    让我们用这个例子来详细拆解：

    `x = 1101`（十进制为 13）

    `y = 1001`（十进制为 9）


    现在，应用位按与操作：


    ![](img/img-132.jpg)


    以下是逐位的工作原理：


    -   `1 & 1 = 1`

    -   `1 & 0 = 0`

    -   `0 & 0 = 0`

    -   `1 & 1 = 1`


    因此，结果是 `1001`，十进制为 9。


    位按与操作比较操作数的每一位，并仅在两个原始位均为 1 的位置保留 1。在这种情况下，`1101 & 1001` 的结果是 `1001`，即十进制的 9。


    ## 20. 位按或 (|) 运算符


    与位按与 (`&`) 运算符一样，Java 中的位按或运算符 (`|`) 同样非常用，因为它允许我们直接在位级别上执行操纵数据的操作，从而对数据的处理或存储方式进行更精控制。


    位按或 (`|`) 运算符还可以用于在管理权限或标志位等情况下组合多个条件。通过组合多个位，你可以高效地同时表示并检查多个条件。


    在 UNIX 文件系统中，有文件权限，我们可以使用位按或 (`|`) 运算符来组合权限。


    ![](img/img-133.jpg)


    在这里，`userPermissions` 将同时启用读取和写入权限。


    考虑另一个位按或 (`|`) 运行的例子。


    ```java

    int x = 13, y = 9;

    System.out.println(x | y);

    ```


    要执行位按或 (`|`) 运算，我们首先将每个操作数转换为二进制形式，然后比较每一对对应的位。“或”运算的规则非常直观：如果被比较的位中至少有一个为 1，则结果位即为
    1；否则，结果为 0。


    让我们用这个例子来详细拆解：

    `x = 1101`（十进制为 13）

    `y = 1001`（十进制为 9）


    现在，应用位按或操作：


    ![](img/img-134.jpg)


    让我们逐位通过：


    -   `1 | 1 = 1`

    -   `1 | 0 = 1`

    -   `0 | 0 = 0`

    -   `1 | 1 = 1`


    因此，结果是二进制 `1101`，十进制为 13。


    位按或操作比较两个操作数的每一位，并在至少有一个位为 1 的位置产生 1。在这种情况下，`1101 | 1001` 得到 `1101`，即十进制的 13，这说明或运算保留了两个操作数所有的
    1。


    ## 21. 位异异 (^) 运算符


    与位按与 (`&`) 运算符和位按或 (`|`) 运算符一样，Java 中的位异异运算符 (`^`) 也非常重要，因为它为执行涉及翻转或切换二进制数中特定位的操作提供了强大的工具。在需要以标准算术或逻辑运算符无法比较或更改位的情况下，异异异非常有用。


    异异的一个巧妙用法是在不使用临时变量的情况下交换两个值。通过对两个数字进行两次异异，你可以交换它们的值。


    示例：不使用临时变量交换值。


    ```java

    int x = 5, y = 10;

    x = x ^ y;

    y = x ^ y;

    x = x ^ y;

    ```

