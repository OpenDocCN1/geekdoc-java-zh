    Now, let’s talk about comments in Java. Comments are used to put a message for
    your future self or for your other teammates so that you don’t have to retrace
    your code every time you go back to it after a few days, a few months, or a few
    years. In the Java programming language, we have three types of comments. We have
    the single-line comment, the multi-line comment, and the Java documentation comments.


    1. **Single line comment**: The single line comment is used to comment out a single
    line of code. You start it off with a pair of forward slash symbols. Any and all
    texts found after the double slash are considered comments.


    ```java

    // Single Line Comment

    ```


    2. **Multi-line comment**: We also have the multi-line comment. Multi-line comments
    are used to comment out multiple lines of code. You start it off with a slash
    (`/`) followed by an asterisk (`*`) symbol, and then you terminate it or end it
    with an asterisk (`*`) followed by a forward slash (`/`).


    ```java

    /*

    Multi Line Comment

    */

    ```


    All texts that you find inside these multi-line comments are considered comments.
    Let’s say you have a piece of code that you would like to remove for testing purposes;
    you do not need to delete it immediately. Instead, you just need to surround it
    with a multi-line comment so that when you want your code back, you simply remove
    the comments surrounding it and do not end up retyping the code block again.


    3. **Java documentation comments**: Java documentation comments, also known as
    javadoc comments, are used to document or to put Java documentation in your source
    code. Here’s how to write Javadoc comments:


    ```java

    /**

    Java Documentation Comment

    */

    ```


    This type of comment is used to provide descriptions of what the structure is
    all about. It is normally placed on top of a class declaration, an attribute declaration,
    or a method declaration so as to provide a description of what the said construct
    can do. After coding the application and putting in the proper Javadoc comments,
    you can now create an HTML file that is very similar to the Java API Documentation
    that can be launched and viewed on your browser.


