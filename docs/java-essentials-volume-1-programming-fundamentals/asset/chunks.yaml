    A nested if condition is an if condition within another if condition. Try to analyze
    the given syntax:


    ![](Images/img-154.jpg)


    As seen in the above case, adding white spaces (spaces, tabs, and enter keys)
    in your code will surely make it more readable.


    The `outer-if-condition` is evaluated first, and then if it returns a true value,
    the `outer-if-block` will be executed, and within that scope, you will encounter
    the `inner-if-condition`. If the `inner-if-condition` also returns a true value,
    then the `inner-if-block` will also be executed. If any condition returns a false
    value, then it is expected that the corresponding `else` statement will be executed.
    Providing indentation within each of the `if` blocks and `else` blocks improves
    the readability of your code.


    ![](Images/img-155.jpg)


    In this example, statement 1 and 2 returns a true value; therefore, statement
    3 will execute. But the more obvious question is this: How will I know which `else`
    statement is connected with which `if`?


    And the answer is … the rule for matching an `else` with an `if` is that an `else`
    always refers to the nearest `if`, which is not associated with another `else`
    clause.


    Consider the following:


    ![](Images/img-156a.jpg)


    How will you know which `else` clause goes with which `if` statement? As the rule
    goes, “an `else` always refers to the nearest `if` which is not associated with
    another `else` clause”. Therefore, the `else` clause goes with line 2.


    Regardless of the indentation, the rule stays the same.


    ![](Images/img-156b.jpg)


    Statement 3 still goes with statement 2. Once you have grouped them, the association
    may change, like in this example:


    ![](Images/img-156c.jpg)


    Now the `else` statement goes with statement 1.


    When the compiler sees an `else` statement, it pairs it with the closest preceding
    `if` statement that does not already have an associated `else`. This rule helps
    avoid ambiguity in nested conditional statements.


    ![](Images/img-157a.jpg)


    The second `if (x < 10)` is the nearest `if` to the `else`. The `else` pairs with
    `if (x < 10)` because the first `if (x > 10)` is already closed and does not affect
    the pairing. When `x = 5`, the output is: “x is less than 10” (from the second
    `if`) because the condition is true. The `else` is ignored because it only runs
    when `if (x < 10)` is false.


    This rule is especially important when dealing with nested or complex conditional
    logic. If you don’t explicitly use braces `{}`, it can become difficult to determine
    which `if` `else` is paired with. To avoid confusion, it’s a good practice to
    always use braces, even for single-statement blocks, or to use proper indentation.


    ![](Images/img-157b.jpg)


    The `else` pairs with the closest unmatched `if`, which is `if (y > 5)`.


    When `y = 15`, the condition `y < 10` is false, so the inner `if` and `else` are
    skipped entirely, and no output occurs.


    By understanding this rule, you can write more predictable and accurate if-else
    constructs in Java.


    ## 5.2.3 The if - else - if Ladder


    The `if - else - if` ladder looks like this:


    ![](Images/img-158.jpg)


    The conditions are evaluated from top downward. The compiler tests each condition
    until a true condition is found. If a true condition is found, then the rest of
    the conditions will be bypassed. If there are no true conditions, then the `else-block`
    will be executed.


    Here is an example of an `if - else - if` ladder:


    ![](Images/img-159.jpg)


    ## 5.3 The switch-case and Its Variants


    ### 5.3.1 The switch-case Statement


    `switch` is a multi-branch decision statement in Java that tests a list of constants.
    When a match is found, a statement block is executed. The general form of a `switch`
    statement is:


    ![](Images/img-160.jpg)


    where the `default` statement is executed if no match is found. The `default`
    is optional and, if not present, no action takes place if all matches fail. When
    a match is found, the statement associated with that `case` is executed until
    the `break` statement is reached or, in the case of the `default` (or last case
    if no default is present), the end of the `switch` statement is encountered. The
    `break` statement is also optional. Without the `break` statement, the code continues
    to execute the next `case(s)` even if they don’t match, this is known as the fall-through
    behavior. This can lead to unintended outcomes if multiple case blocks are executed
    when only one should be.


    Refer to Table 5.1 to know the allowed Java data types that can be used for the
    `switch-case` statement.


    #### Table 5.1 List of data types for the switch-case statement


    | Allowed | byte, short, int, char, enum, String |

    | Not Allowed | boolean, float, double, long, reference types |


    Here is a sample code that uses `switch-case` statements.


    ![](Images/img-161.jpg)


    Notice that there are ten `case` choices to choose from. If the variable `number`
    has other values aside from 0 to 9, then the `default` statement is executed.
    In an event that all the `case` constant fails and the `default` statement is
    not present, then no statement will execute.


    There are a few important things to know about `switch-case`:


    1. The `switch` differs from `if` in that `switch` can only test for equality,
    whereas `if` can evaluate a relational or logical expression.


    Using the `if` condition:


    ![](Images/img-162.jpg)


    2. No two `case` constants in the same `switch` can have identical values. Let
    us consider this:


    ![](Images/img-162b.jpg)


    3. Only `byte, short, int, char, enum`, or `String` data types can be used for
    `switch-case` statements. Integral values must be within the range of their respective
    types. The `boolean, double, float, long, and reference data types can not be
    used as case constants.


    #### Cases That Have Common Statements


    These are `switch-case` statements that have a common statement block but different
    `case` constants:


    ![](Images/img-164.jpg)


    This sample code will test small and capital letters, but will have a common statement.

