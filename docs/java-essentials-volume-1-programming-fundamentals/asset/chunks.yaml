    ### 5.4 The while Statement


    Repeated action is one of the reasons why we need computers. When a large amount
    of data needs to be executed frequently, it is very convenient to have a control
    mechanism for frequent execution. This is why we have the `while` statement. It
    gives us control in executing a large number of instructions repeatedly.


    The general form of the `while` statement is:


    ![](Images/img-171a.jpg)


    Before the `statement block` is executed, the condition is first evaluated. If
    the condition returns a true value, then the `statement block` will be executed.
    But if the condition returned a false value, then the compiler will skip the statement
    block and will execute the statement following the sequence. Here is an example:


    ![](Images/img-171b.jpg)


    With this program segment, it will continually increment the value of `i` by 1
    until the condition of the `while` statement returns false. The first time that
    the loop will execute the value of `sum = 0 + 1`, after the second time through
    the loop the value of `sum` is `1 + 2`, then the third time, `sum` will be `2
    + 3` and so on as long as the condition `i <= 10` returns a true value.


    ### 5.5 The do-while Statement


    The `do-while` statement is considered to be a variant of the `while` statement.
    Here is the general form:


    ![](Images/img-172a.jpg)


    The statement block is first executed, and then the condition is evaluated. If
    the condition returned a true value, the first statement in the `do-while` loop
    will be executed again. The statement block will be executed continuously until
    the condition returns a false value.


    Here is an example of a program segment that uses a `do-while` statement:


    ![](Images/img-172b.jpg)


    As you can see, the statement block is executed first, then checks the condition.
    Unlike the `while` statement, Java checks the condition first, and if the condition
    is true, the `statement block` is executed.


    #### The Difference Between the while and the do-while Statements


    If the `do-while` statement is just a variant of the `while` statement, then what’s
    the difference?


    In the `while` statement, the condition is first checked before executing the
    statement block, unlike in the `do-while` you execute the statement first before
    testing the condition. In the `do-while` statement, the statement block will execute
    at least once regardless of the result of the given condition.


    When working with `while` or `do-while` loops, always ensure the loop has a valid
    exit condition. Forgetting to update the loop variable or writing a condition
    that is always true can cause an infinite loop, which will make your program run
    endlessly and potentially crash your system or freeze your terminal.


    Here’s an example of what not to do:


    ![](Images/img-173.jpg)


    In the example above, the condition `counter < 5` will always be true because
    `counter` is never updated inside the loop. This results in an infinite loop.


    For best practices, always double-check that the loop will eventually reach a
    condition that becomes false.


    ### 5.6 The for Loop


    A `for` loop allows a set of instructions to be performed until a certain condition
    is reached. The general form of the `for` is:


    ![](Images/img-174a.jpg)


    The `for` statement has three expressions: `expr1` initializes andor declares
    the variable/s that will be used, `expr2` is the boolean expression that will
    determine if the loop will execute or not, and `expr3` increments or decrements
    the variable every time the loop repeats. All three of these expressions are optional.


    ![](Images/img-174b.jpg)


    In this program segment, `i` is initialized to `1`. Since `i` is less than `5`,
    `System.out.println()` is called, and `i` is incremented by `1`. This process
    repeats until `i` is greater than `5`, and at this point the loop terminates.
    In this example, `i` is the loop `control variable`, which is changed and checked
    each time the loop repeats.


    The output would be:


    The value of i is: 1


    The value of i is: 2


    The value of i is: 3


    The value of i is: 4


    The value of i is: 5


    The three expressions in the `for` loop are optional. In the absence of the three
    expressions, two semicolons must remain inside the parentheses; this will give
    us an infinite loop.


    ```

    for ( ; )

    ```


    The only way to stop an infinite loop is by terminating the program abnormally,
    by pressing Control Break (`CTRL + C`).


    ### 5.7 The break Statement


    The `break` statement is not only used for `switch-case`, but it is also used
    for `for`, `do-while`, and `while` statements. If the `break` statement is encountered
    inside any looping constructs, the rest of the statement block will be skipped,
    and the statement following the statement block will be executed. Here is an example:


    ![](Images/img-175.jpg)


    The control variable `i` is initialized to `1` and is supposed to execute `5`
    times (from `1` to `5`), but within the loop, there was an `if` condition in line
    1 that tested the control variable `i`. When `i` becomes `3`, line number 2 is
    skipped along with the rest of the loop, thus executing line 3, which is the next
    statement following the statement block. The output will therefore be:


    1


    2


    Outside the loop


    ### 5.8 The continue Statement


    The `continue` statement is used only for looping constructs such as `for`, `do-while`,
    and `while` loops. It allows you to prematurely terminate the current loop body
    and return the program control back to the beginning of the loop for a new iteration.
    Let us take a look at a similar example:


    ![](Images/img-176.jpg)


    In this example, the output will be:


    1


    2


    4


    5


    Out of the loop

