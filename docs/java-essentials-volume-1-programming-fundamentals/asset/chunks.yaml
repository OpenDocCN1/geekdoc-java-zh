    str2: Hello\nAloha\nHi\n\nCompare str1 and str2: true\n\nLines 5 to 9 show the\
    \ use of text blocks. The values of `str1` and `str2` when printed will produce\
    \ the same output, and compared in lines 15 and 16, they will give you a true\
    \ value.\n\nSince text blocks are only “preview” features in Java 13 and 14, the\
