    \ 类，它们都提供了 `String` 对象的可变替代方案。虽然两者都用于修改字符串内容，但 `StringBuffer` 是线程安全的且经过同步的，而 `StringBuilder`\
    \ 速度更快但没有同步，因此它非常适用于单线程环境。\n\n## 6.1 String 类\n\n字符串是字符值（如 \"abc\"）的表示。现在注意，我们需要将这些字面值包含在一对双引号内。在其他语言中，使用单引号包裹\
    \ `String` 字面量可能是可行的，但在 Java 中不可行。\n\n我们有几种方法来创建 `String` 对象。我们可以使用 API 文档中 `String`\
    \ 类提供的构造函数之一，也可以进行直接赋值。\n\n字符串是常量；一旦创建，其值就无法更改，而 `StringBuffer` 和 `StringBuilder`\
    \ 支持可变的 `String`，这基本上意味着它们是可以被改变的。\n\n例如：\n\n```\nString str = \"abc\";\n```\n\
    \n等同于：\n\n```java\nchar data[] = {'a', 'b', 'c'};\nString str = new String(data);\n\
    ```\n\n### 6.1.1 String 数据类型的用途\n\n`String` 数据类型用于字符字符串，如名称、地址、电话号码等。\n\n示例：\n\
    \"Lawrence\"\n\"Java Programming\"\n\"1234567890\"\n\n### 6.1.2 字符串位置 vs. 长度\n\
    \n在 Java 中，`String` 中的每个字符都有一个位置，也称为索引，第一个字符从 0 开始。这意味着 `String` 的最后一个字符位于位置 `length\
    \ - 1` 处。\n\n`length()` 方法返回 `String` 中字符的总数，从 1 开始（而不是 0）。这有时会困扰初学者，因为位置从 0 开始，但\
    \ `length` 从 1 开始计数。\n\n让我们以名称 `LAWRENCE` 为例：\n\n索引（位置）：0 1 2 3 4 5 6 7\n字符：L\
    \ A W R E N C E\n长度计数：1 2 3 4 5 6 7 8\n\n* 第一个字符 'L' 位于位置 0。\n* 最后一个字符 'E' 位于位置\
    \ 7，但它是 `String` 中的第 8 个字符。\n* \"LAWRENCE\" 的 `length()` 是 8，但最大的有效索引是 7。\n\n\
    这里的关键点如下：\n\n* 位置（索引）从 0 开始。\n* `Length`（长度）从 1 开始计数，并等于 `String` 中字符的数量。\n* `String`\
    \ 中的最后一个有效位置始终是 `length - 1`。\n\n理解这些概念对于子字符串提取、字符比较和对 `String` 进行迭代等任务至关重要。索引有助于指定精确位置，而\
    \ `length` 确保你知道边界，防止出现如 `StringIndexOutOfBoundsException` 的错误。\n\n在 Java 中，空格、空白字符、标点符号和其他特殊符号都被视为单个字符。这意味着它们是\
    \ `String` 的一部分，并贡献了它的长度。\n\n示例：\n\n```java\nSystem.out.println(\"Congratulations!\
    \ \" + \" You passed this subject.\");\n```\n\n`System.out.println()` 内部的 `String`\
