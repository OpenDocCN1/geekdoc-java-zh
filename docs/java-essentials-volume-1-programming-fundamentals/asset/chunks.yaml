    ### 3.5 Java Programming Language Coding Conventions\n\n#### 3.5.1 Packages\n\n\
    Packages are normally written in small letters, and it is usually the reverse\
    \ URL of your application. As we have discussed in the previous chapter, the package\
    \ layout is usually your directory structure. Here’s an example of a package:\n\
    \n`com.myapp.domain;`\n\n#### 3.5.2 Classes, Interfaces, and enum Types\n\nAs\
    \ for classes, interfaces, and enum types, we normally use the CLC, or the Capital-Lower-Capital\
    \ naming convention. The identifier name starts with a capital letter, followed\
    \ by lowercase letters. If there is a succeeding word, then you capitalize the\
    \ first letter of the succeeding word. Here are some examples of names of classes,\
    \ interfaces, and enum types:\n\n`TestPerson`, `Flyer`, `BankAccount`, `MonthsOfTheYear`\n\
    \n#### 3.5.3 Methods and Variables\n\nExample of method names:\n`getName()`, `setName()`,\
    \ `addButton()`\n\nExample of variable names:\n`name`, `age`, `finalGrade`\n\n\
    Methods and variables use the camelback naming convention. C/C++ developers normally\
    \ use camelback as a way to write methods and variables alike. You start your\
    \ identifier name with a small letter, and if you need to use another word, you\
    \ capitalize the first letter of the succeeding word. A method should have a pair\
    \ of parentheses at the end, and it may or may not include parameters inside the\
    \ parentheses.\n\n#### 3.5.4 Constants\n\nExamples of constants include:\n`STUDENT_NUMBER`,\
    \ `SPEED_OF_LIGHT`, `PI`, `PULL_OF_GRAVITY`\n\nConstants are declared in ALL CAPS.\
    \ An identifier that is written in all capital letters normally represents a final\
    \ variable, also known as a constant identifier. In the event that your constant\
    \ identifier is composed of multiple words, you separate these words with an underscore\
    \ (`_`) symbol.\n\nHere’s how we write them properly in Java using the `final`\
    \ keyword:\n\n```java\nfinal int STUDENT_NUMBER = 50;\nfinal double SPEED_OF_LIGHT\
    \ = 299792458; // in m/s\nfinal double PI = 3.141592653589793;\nfinal double PULL_OF_GRAVITY\
    \ = 9.80665; // in m/s^2\n```\n\n#### 3.5.5 Control Structures\n\n```java\nfor\
    \ (int i = 0; i < 5; i++) {\n    // do something\n}\n```\n\nControl Structures\
    \ like `if-else`, `switch-case`, `do-while`, and `for-loop` are usually followed\
    \ by curly braces. The actual discussion on these will be in Chapter 5.\n\n####\
    \ 3.5.6 Spacing and Indentations\n\nAs for the spacing of your code, we encourage\
    \ using two to four spaces as an indentation if your code is inside curly braces.\
    \ This way, at one glance, you will have an idea of which lines of code are inside.\
    \ These spaces are used only for readability.\n\nAlso, we encourage using one\
    \ statement per line, terminated by a semicolon (`;`). Semicolons are mandatory\
    \ to end a Java statement. Having multiple statements in a single line, even if\
    \ coded properly, can sometimes cause confusion. To avoid this, a single statement\
    \ per line is the best way.\n\n#### 3.5.7 Comments\n\nPutting the comments described\
    \ in 3.1 in your code is a good programming practice for documentation. Both single-line\
    \ and multi-line comments are beneficial to insert your human-formatted thoughts\
    \ into your Java code.\n\nOn top of that, JavaDoc comments can do much more. After\
    \ including all the descriptions you included in your code, and after the coding\
    \ and testing processes, you can start building your documentation by harnessing\
    \ the power of your IDE and choosing the option “Generate Java Doc” for the NetBeans\
    \ IDE. This will automatically read the JavaDoc comments you placed inside your\
    \ code and translate them into an HTML format that you can also send as technical\
    \ documentation.\n\nFollowing these conventions will allow you and your colleagues\
    \ to work better by allowing you to write code that is readable and well-documented.\n\
    \n### 3.6 The Primitive Data Types\n\nThere are eight primitive data types**.\
    \ Primitive data types** are the most basic types of data that represent simple\
    \ values directly in memory. They are predefined by the language and are not objects.\
    \ These types are the building blocks for data manipulation in Java. The eight\
    \ primitive data types are `byte`, `short`, `int`, `long`, `float`, `double`,\
    \ `char`, and `boolean`.\n\nData types that are not a part of the eight primitive\
    \ data types are considered reference data types. In Java, reference data types\
    \ are types that store references (or memory addresses) to the actual data rather\
    \ than the data itself. They include objects, arrays, and interfaces. Unlike primitive\
    \ data types that hold their values directly, reference types point to locations\
    \ in memory where the data resides.\n"
