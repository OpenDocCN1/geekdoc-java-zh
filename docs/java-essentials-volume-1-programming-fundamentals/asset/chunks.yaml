    ## 7.2 Array Limits](#07_Contents.xhtml_chhead68)


    All arrays begin with index 0. Let’s take a look at this example:


    ![](Images/img-217.jpg)


    The code snippet declares and initializes a one-dimensional array of `String`
    objects named `coffee`, which contains a list of coffee names. In Java, arrays
