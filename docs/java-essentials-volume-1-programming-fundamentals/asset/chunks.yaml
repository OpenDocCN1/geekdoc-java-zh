    sequences of characters. Here are the common things among these three classes:


    • All three classes belong to the java.lang package, which means they are automatically
    imported into every Java program.


    • They are used to create and manipulate sequences of characters (strings).


    • All three classes implement the CharSequence interface, which means they provide
    a standard way to access a sequence of characters.


    • They all provide methods for basic string operations such as:


    ▪ Length: length()


    ▪ Character access: charAt(int index)


    ▪ Substring extraction: substring(int beginIndex, int endIndex)


    The Differences are as follows:


    • String is immutable: Once a String object is created, it cannot be changed.
    Any modification to a String results in the creation of a new String object.


    • StringBuffer and StringBuilder are mutable: They can be modified after creation
    without creating new objects. This makes them more efficient for scenarios where
    frequent modifications to the string are required.


    • String concatenation is done using the + operator or the concat() method, which
    results in the creation of a new String object.


    • String Text block was also introduced in Java 13 and 14, which uses fat delimiters
    (""") triple double quotes.


    • As for both StringBuffer and StringBuilder classes, they provide methods like
    append() and insert() to modify the existing string, making concatenation more
    efficient.


    • StringBuffer is thread-safe: All its methods are synchronized, which makes it
    safe for use by multiple threads, but can be slower due to the overhead of synchronization.


    • StringBuilder is not thread-safe.


    • String is immutable and thus inherently thread-safe.


    • StringBuilder is not synchronized and should be used in single-threaded contexts.


