    \ 中的 `substring()` 方法用于从特定索引开始提取 `String` 的部分。例如，在代码中\n\n```java\nString country\
    \ = \"Philippines\";\nSystem.out.println(country.substring(3));\n```\n\n方法调用 `country.substring(3)`\
    \ 通知 Java 从索引 3 开始提取字符并持续到 `String` 的末尾。由于 Java 使用从零索引，索引 3 对应于 \"Philippines\"\
    \ 中的字符 'l'。因此，输出是 \"lippines\"，它包含了从 'l' 开始的所有字符。此方法在当你想要移除或跳过 `String` 开头的特定数量的字符或提取其特定部分时，特别有用。\n\
