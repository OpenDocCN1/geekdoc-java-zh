    a.equals(b) is true if a and b are strings of the same length and they have the
    same characters in the same sequence.


    String a = "Peter";


    String b = "Peter";


    System.out.println(a.equals(b));


    Output: true


    8. The equalsIgnoreCase() Method


    String a = "Peter";


    String b = "peter";


    System.out.println(a.equals(b));


    **Output:**


    false


    String a = "Peter";


    String b = "peter";


