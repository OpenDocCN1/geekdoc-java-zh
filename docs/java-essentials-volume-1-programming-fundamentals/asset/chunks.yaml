- fmt: '

    Java can run on most popular platforms. This feature is valuable to a lot of customers
    who have invested in hardware like minicomputers, mainframes, or even desktop
    computers. They do not want to do away with these investments when they use another
    set of standards.


    One of the nice things about Java is its capability to run on most platforms once
    you are done with the compilation and archiving. Once you compile your source
    file (`*.java`), it produces a compiled file (`*.class`) which contains your Java
    bytecode. Then you can let your `*.class` run in any Java Runtime Environment
    on any platform. In most instances, a single Java source file can produce several
    class files. In cases like this, having multiple class files is very hard to manage
    and to deliver to clients. This is where a JAR file comes in handy. JAR stands
    for `J`ava `AR`chive. It allows the grouping of related classes together to form
    a single archived file called a JAR File.


    Having a single JAR File will allow users to execute and manage a program more
    easily compared to having multiple, scattered class files.


    As shown in [Figure 1.2](#16_Ch01.xhtml_c1f2), Java source files (`*.java`) are
    compiled into bytecode (`*.class`), which can then be packaged into a `*.jar`
    file and executed by the Java Virtual Machine (JVM). Since the JVM is available
    on various platforms like Windows, Mac OS, Linux OS, and Solaris, the same Java
    program can run seamlessly across all these systems, demonstrating Java’s cross-platform
    capability.


    ### Figure 1.2 Cross-platform diagram on Java Virtual Machine


    ![](Images/fig1-2.jpg)


    Say, you wrote your source file in a Windows Operating System. You then compiled
    and tested it. This Windows-based application that you wrote using Java was used
    for a year or two. Then another set of hardware machines was purchased, but this
    time it was using a better operating system, say the Linux OS. Would you still
    be able to use your Windows-based Java application? The answer is yes! All you
    need to do is install the needed Java Runtime Environment on your Linux machine
    and voila! Your Java Application that used to run on Windows should also be able
    to run on your Linux machine.


    ### 1.1.7 Java is Secure


    Java Applications are secured because they run on top of the Java Virtual Machine
    (JVM). The JVM is one of the components of your Java Runtime Environment (JRE),
    which allows you to run Java bytecodes on your platform. Java bytecodes are inside
    your class files and your JAR files. Once you have installed your JRE, you’re
    all set. You can now run your Java Application on your machine.


    Your JVM interprets the compiled Java code (`*.class`) and runs it. Your JVM sits
    on top of your operating system and acts as its boundary; this means your running
    Java application cannot perform any disruptive actions that are not approved by
    your boundary setter—your JVM. Having this additional layer also means that your
    Java application does not have a direct attachment or a direct contact with your
    underlying operating system; it needs to go through a series of layers before
    it reaches your Operating System. So, whatever transaction you have running on
    top of your JVM (which is your Java App), your underlying Operating System cannot
    directly access it. Java does not allow direct access to memory; this makes it
    impossible to accidentally reference memory that belongs to other programs or
    the kernel.


    [Figure 1.3](#16_Ch01.xhtml_c1f3) shows how a Java application (historically,
    applets embedded in web pages) sent from a server is blocked from executing on
    the client side due to the secure design of the Java Virtual Machine (JVM). The
    JVM acts as a boundary between the Java application and the underlying operating
    system, preventing direct access to system memory and unauthorized actions, which
    enhances security by requiring all operations to go through controlled layers.


    ### Figure 1.3 Applications are not directly installed on the OS Level


    ![](Images/fig1-3.jpg)


    Also, Java SE has its own set of API (Application Program Interfaces) that allow
    programmers to use pre-created code and classes by the Java Developer Community.
    It is also an essential part of the JRE. Java security technology includes tools,
    implementations of commonly used security algorithms, mechanisms, and protocols.
    The Java Security API spans a wide range of areas, including cryptography, public
    key infrastructure, secure communications, authentication, and access control.
    It also provides the user or administrator with a set of tools to securely manage
    applications.


    ### 1.1.8 Java Supports GUI


    Using Java, you can also create Graphical User Interface (GUI) Applications, which
    enable the user to make use of Buttons, Frames, TextFields, and other graphical
    objects that you can use in creating your user interface. Java Foundation Classes
    (JFC) is one of the most popular graphical frameworks used by Java for building
    portable GUI applications. JFC consists of the Abstract Window Toolkit (AWT),
    Swing, and Java 2D, which, in combination, can produce a GUI that can run in most
    types of Operating Systems.


    ### Figure 1.4 Sample output of a simple GUI notepad


    ![](Images/fig1-4.jpg)


    In JFC, you can customize the look and feel of your GUI application, and it has
    a wide range of GUI components that you can choose from. In the sample GUI Notepad
    image provided in [Figure 1.4](#16_Ch01.xhtml_c1f4), you can see that I can create
    my own simple GUI notepad application that Java also supports.


    JavaFX is an open-source, next-generation client application platform for desktop,
    mobile, and embedded systems built on Java.


    ### 1.1.9 Java is Free


    The Java Development Kit (JDK) and the Java Runtime Environment (JRE) installers
    can be downloaded from the Oracle website at no cost. It is free for personal
    and academic use.


    ## [1.2 The Three Flavors of Java](#07_Contents.xhtml_chhead12)


    The term “Three Flavors of Java” refers to the three main editions of the Java
    platform, each tailored to different types of development environments.


    Each of these editions serves a distinct purpose, ensuring that Java can be applied
    across a wide range of development scenarios, from simple desktop applications
    to complex enterprise systems and embedded devices.


    ### Figure 1.5 The Java Technology Family


    ![](Images/fig1-5.jpg)


    In the good old days, it used to be J2ME, J2SE, and J2EE, but as of version 6.0,
    Sun Microsystems (the original developer of Java technology, which is now owned
    by Oracle Corporation) decided to rebrand their technology as Java SE, Java EE,
    and Java ME. Let’s look at each of three technologies in detail.


    ### 1.2.1 Java SE (Standard Edition)


    Java SE contains the standard class libraries that can be used to create applets
    and/or desktop applications. It is the core of all Java-based technology. Applets
    were deprecated starting JDK 9.


    Java SE is the core platform, providing essential libraries and APIs for developing
    general-purpose applications, such as desktop applications and command-line utilities.
    It includes key packages like `java.lang`, `java.util`, and `java.io`, along with
    GUI toolkits like AWT, Swing, and JavaFX.


    ### 1.2.2 Java EE (Enterprise Edition)


    Java EE is a framework that allows developers to use vendor-neutral technologies
    in developing their enterprise applications. Java EE makes use of the standard
    libraries and other extended API’s (Application Programming Interface) in building
    and deploying these applications, and it usually makes use of the browsers as
    its client and can be used by multiple, concurrent users. Java EE is a widely
    used platform for server programming and provides functionality to deploy fault-tolerant,
    multi-tier, distributed Java technology applications based largely on modular
    components running on an application server.


    ### 1.2.3 Java ME (Micro Edition)

