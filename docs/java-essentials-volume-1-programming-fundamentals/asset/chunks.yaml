    ### 1. 转换 `(<data_type>)`


    Java 中的数据类型转换是指将一种数据类型转换为另一种数据类型。这样做是为了使数据与特定操作兼容，或匹配给定语境下预期的数据类型。转换可以应用于原始数据类型，也可以应用于引用类型。在本节中，我们首先将讨论原始类型的转换。引用数据类型的转换将在该系列的第二卷中讨论。


    数据类型转换是将值从一种数据类型转换为另一种数据类型的过程，即扩展或缩小其声明的数据类型。转换有两种方式：可以隐式地，也可以显式地进行。隐式转换意味着让 Java
    为你执行自动转换。而在显式转换中，由你来编写或规定应该如何进行转换。


    隐式转换遵循某些规则。它遵循 `Figure 4.1` 所示的层次结构。


    图 4.1 原始数据类型层次结构


    ![](img/fig4-1.jpg)


    这意味着，一旦原始变量经历了隐式转换，它就会按照数据类型层次结构进行提升（或降级）。例如，`byte` 可以被转换为 `int`。


    这里有一个例子：


    ![](img/img-118a.jpg)


    如果你仔细观察，可能会看到以下错误：


    ![](img/img-118b.jpg)


    注意错误类型了吗？它说是 `possible loss of precision`（可能丢失精度），这意味着这是一个与原始转换相关的错误。如果忽略它，可能会丢失精度。发生错误是因为在
    Java 中，算术运算（如加法 `(b1 + b2)`）即使操作数被声明为 `byte`，也会自动提升或向上转型为 `int`。在第 5 行和第 6 行中，`b1`
    和 `b2` 都被声明为 `byte`。然而，当到达第 7 行时，导致了错误，因为在第 7 行进行加法之前，`b1` 和 `b2` 已经隐式地（自动））转换。此时，你实际上是在将两个
    `int` 相加并尝试将它们存储在 `byte` 中。Java 在任何数学运算中（在本例中为加法运算）都会隐式地将 `byte` 提升为 `int`；因此，发生了“可能丢失精度”的错误。


    所以，而不是按照以下方式：


    ```java

    byte b3 = b1 + b2;

    ```


    而应该这样做：


    ```java

    byte b3 = (byte)(b1 + b2);

    ```


    尝试重新编译并运行这段代码，你应该不再会有问题了。


    显式转换应用在 `byte b3 = (byte) (b1 + b2)` 中。显式转换需要人工干预，因为涉及将较大的数据类型转换为较小的数据类型。由于存在丢失信息或精度的可能性，你必须显式指定想要转换的类型。


    这里发生的情况是 `b1` 和 `b2` 被声明为 `byte`，在你通过算术运算符合并两个变量之前，它们需要处于默认数据类型中。这意味着在 `b1` 加到
    `b2` 之前，作为 `byte` 的 `b1` 将自动向上转型为 `int`。之后，`b2` 也会遵循相同的模式。只有当 `b1` 和 `b2` 都是 `int`
    类型时，你才能将它们的值相加。


    结论，Java 中的数据类型转换是一个基本概念。在运算中（特别是是在较和较大的类型之间）理解隐式和显式转换至关重要，以避免像“丢失精度”之类的错误，这涉及
    `byte`、`short` 或 `int`。


