    # 0.5 JDK Installer for Linux Operating Environment (#07_Contents.xhtml_chhead6)


    In the Linux Operating Environment, there are two types of users: root users and
    regular users. The root users have access to all the folders of your Linux machine,
    while the regular users have access only to their home folder. Knowing what type
    of user account you have will help you decide what type of JDK Linux installer
    you can download.


    There are two file types you can choose from: the `*.tar.gz` file or archive binaries,
    and the `*.rpm` file or the Red Hat package manager file. There is also a special
    installer available for Intel machines that uses the Linux distribution. Below
    is the list of available Linux installers.


    Figure 0.28 Oracle Site - Linux JDK Installers


    ![](Images/fig0-28.jpg)


    ## 0.5.1 The Archive Binaries (*.tar.gz)


    The archive binaries can be used by any type of user, both regular and root users.
    Using the archived binaries, you can choose the location where you can extract
    the files. After choosing where to extract the installer, you may start the extraction
    process by typing:


    ```

    tar zxvf jdk-<version>u<update>-linux-x64.tar.gz

    ```


    Assuming you want to extract your JDK inside the home folder, here is an example
    of the actual command, assuming the installer is JDK 23.


    ```bash

    cd <ENTER>

    tar zxvf jdk-23_linux-x64_bin.tar.gz <ENTER>

    ```


    The first command ensures that your present working directory will be the home
    folder, while the second command extracts the JDK inside your home folder.


    Also, with the `tar` command, you can extract the said installer inside the home
    folder.


    The next step is to configure your JDK by editing the file `.profile`. You can
    use the `vi` editor or any text editor to edit the `.profile` file.


    Add the lines:


    ```bash

    JAVA_HOME=~/jdk-23

    export JAVA_HOME

    PATH=$JAVA_HOME/bin:$PATH

    export PATH

    ```


    Save your `.profile`.


    Log out and log in again on your machine.


    ## 0.5.2 The RedHat Package Manager (RPM) File


    The RPM file is intended to be used by root users for package installation. You
    may download the JDK installer with the `*.rpm` extension name.


    After downloading the file, you need to log in as the root user by using the `su`
    command. Here’s a sample command.


    ```bash

    su –

    <Type in your root password>#

    ```


    After logging in as root, you can now execute your `rpm` command to start installing
    the package.


    ```bash

    rpm -Uvh jdk-23_linux-x64_bin.rpm <ENTER>

    ```


    After the installation, you can log out as root back to a regular user, and you’re
    done. No need to restart your machine. Remember that installers that contain the
    x64 value in the name of the installer are for Intel-based processors. For other
    types of processors, you can use the ARM64 installer.


    ![](Images/sum.png) Chapter Summary (#07_Contents.xhtml_chhead7)


    - There are different types of computers running different types of Operating
    Systems. The first crucial step is to know the type of your operating system,
    and then do a Google search for the right JDK to be installed.

    - For 64-bit operating systems, it is recommended to use the latest JDK version.

    - For older operating systems, you can use JDK 8, available to serve any 32-bit
    Windows or Linux operating system.

    - Once you’ve properly installed and configured your JDK, you need to know what
    version you’re using by typing in `javac -version` to know the Java compiler’s
    version and `java -version` to know the runtime environment’s version.

    - Ideally, it is better to have the same version for your compiler (`javac`) and
    your runtime (`java`), but if for some reason they’re not, be sure that your `javac`
    has a lower version than your `java` version.


    ![](Images/quiz.png) Quiz (#07_Contents.xhtml_chhead8)


    1. Which of the following IS NOT an Operating System?

    a. Windows

    b. Linux

    c. MacOSX

    d. JDK


    2. Which of the following statements is NOT TRUE?

    a. For Mac OS, there’s no need to install the JDK, all Mac OS versions have a
    pre-installed JDK.

    b. For older older OS, JDK 8 is the best JDK version because it still has both
    the 32-bit and 64-bit versions.

    c. For a modern OS, it is best to use the latest JDK version.

    d. To get the latest JDK version, just Google search “JDK download”


    3. To know the Java Compiler’s version, the command is:

    a. javac -version

    b. javac -v

    c. compiler -v

    d. java compiler -v


    4. To know the Java Runtime Environment version, the command is:

    a. java -runtime

    b. java -r

    c. java -version

    d. java -run


    5. A dmg type of installer is for what Operating System?

    a. Windows

    b. Linux

    c. MacOSX

    d. Any OS


    6. An exe type of installer is for what Operating System?

    a. Windows

    b. Linux

    c. MacOSX

    d. Any OS


    7. A tar.gz type of installer is for what Operating System?

    a. Windows

    b. Linux

    c. MacOSX

    d. Any OS


    8. A Linux rpm file installer is also an alternative file type of installer for
    Linux machines. What does rpm stand for?

    a. Revolutions per minute

    b. Rotations per minute

    c. RedHat package manager

    d. Recovery per minute


    9. Which of the following is NOT TRUE?

    a. Linux installers are best used by root users.

    b. It is best to know the CLASATH, JAVA_HOME.

    c. The installation uses tar.gz.

    d. The Mac OS.


    10. Which of the following is NOT TRUE?

    a. The JDK can run.

    b. The installation process for Windows.

    c. The installation process is the same.

    d. The Mac OS file.


    Answers:

    1 – d | 2 – a | 3 – a | 4 – c | 5 – c

    6 – a | 7 – b | 8 – c | 9 – d | 10 – b

    '
