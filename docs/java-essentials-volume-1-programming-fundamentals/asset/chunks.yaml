    Java 是一种面向对象的编程语言。面向对象编程（OOP）是一种通过将代码组织成“对象”来编写程序的方法，这些对象代表现实世界中的事物，如汽车、人或银行账户。每个对象都包含
    `data`（属性）和 `behaviors`（方法），它们定义了对象是什么以及它可以做什么。这种方法使得代码更容易理解、重用和维护。


    面向对象编程语言支持三个主要特性：`Encapsulation`（封装）、`Inheritance`（继承）和 `Polymorphism`（多态）。


    1. `Encapsulation`（封装）：允许你保护数据免受直接访问。它还提供了一个公共接口，通过在更新值之前检查赋值值的正确性，确保数据的可访问性并保护其状态。它还允许你创建稍后在代码中调用的方法，这些方法的用户或调用者不需要担心方法是如何实现的。在获取信息时，用户只需要调用
    `getter` 方法；而在更改对象的值或状态时，用户只需要调用 `setter` 方法。我们所说的这些 `setter` 和 `getter` 方法负责访问和更新类中免受任何直接访问的私有变量。


    2. `Inheritance`（继承）：另一方面，它是重用对象的方法，继承已经创建的内容，并允许在现有基础上编写新增的方法和属性。这一实用的特性允许程序员重用已经编写过的代码，而无需重写代码并产生冗余。重用代码可以通过消除重复代码使你的应用程序运行得更快。


    3. `Polymorphism`（多态）：另一种过程，它允许通过具有特定的声明类类型并实现子类型（子类）的方法，在运行时更改方法的实现，也称为虚方法调用（VMI）。关于类和
    `VMI` 的讨论将在 *Java Essentials Volume 2: Object-Oriented Programming and Beyond*
    中进行。


    一种面向对象的编程语言必须具备这三个主要特性。我们需要这些特性是为了能够创建模式模拟现实世界对象（如日期和按钮）的程序，以及创建我们可以重用的代码。


    这些对象可能与其他对象进行交互，例如 `Student` 对象可以与 `Teacher` 对象进行交互。面向对象编程的另一个特点是其重用代码的能力，不仅通过通过继承，还通过创建独立的代码（松耦合代码）。你可以创建一个在特定项目中使用的对象并在另一个项目中重用它。例如，如果你在桌面应用程序中使用了一个
    `Student` 对象，你也可以在 Web 应用程序重用同一个对象。


    这是另一个例子。在银行应用程序中，你编写了在 `Customer` 类中表示银行客户名称的代码。这个 `Customer` 类可以重用在与该银行项目相关的其他应用程序中。假设你有一个
    `Order` 和 `Purchasing System`。你不需要重新发明轮或重写 `Customer` 类代码。你可以做的是在 `Banking System`
    和 `Order and Purchasing Systems` 中同时重用它们。


    ### 1.1.2 Java 是简单的


    Java 的大部分格式基于 `C` 和 `C++`，所以如果你是 `C` 或 `C++` 程序员，迁移到 `Java` 将非常容易。`C`、`C++` 和
    `Java` 共享几乎所有的编程格式。


    Java 让 `C` 和 `C++` 程序员更容易吸收指针的概念。`Java` 使用引用的概念代替指针。这些主题将在后文中讨论。


    ### 1.1.3 Java 是健壮的


    Java 是一种严谨的语言。它能有效地处理错误和异常，使其具有高度的可靠性。


    ### 1.1.4 Java 是多线程的


    Java 应用程序可以并发运行多个线程。这允许应用程序同时执行多个任务，例如在处理图形用户界面的同时更新数据库。Java 21 引入了 *Virtual Threads*（虚拟线程）——这是一项极大地简化创建和管理线程任务的突破性特性。


    在旧版本中，每个线程直接绑定到操作系统（OS）线程，这意味着创建成千上万并发线程是非常消耗资源的。通过 Java 21 的虚拟线程，Java 应用程序现在可以创建数百万个不绑定操作系统线程的轻量级线程。这些虚拟线程由
    Java 虚拟机（JVM）本身管理。


    ### 1.1.5 Java 感知网络


    Java 编程语言的创建是为了让该语言的用户能够编写可以通过大多数类型网络共享信息的应用程序。Java 程序员可以编写运行在大多数类型网络上的客户端-服务器应用程序。


    ### 1.1.6 Java 确保跨平台兼容性


