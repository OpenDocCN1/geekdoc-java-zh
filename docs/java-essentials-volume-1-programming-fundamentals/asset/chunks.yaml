    - Java 注释有三种（3 种）类型：

    - 单行注释 (`//`)

    - 多行注释 (`/* */`)

    - Javadoc（Java 文档）注释 (`/** */`)

    - 分号用于结束表达式或 Java 语句。

    - 块（Blocks）是成对的大括号 (`{ }`)，用于表示类、方法体或控制结构的体。

    - 空格（White spaces）指的是空格、制表符和回车键。它们在你的 Java 源码中无关，但用于提高代码的可读性。

    - Java 标识符（Identifiers）用于标识类、方法和变量。

    - 目前有 57 个 Java 关键字。

    - 有两个未使用的特殊关键字。`const` 和 `goto`即使在未来的 Java 版本中也无法使用。

    - Java 编程语言中有八 种原始数据类型：`byte`、`short`、`int`、`long`、`float`、`double`、`char` 和 `boolean`。

