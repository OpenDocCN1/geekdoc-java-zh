    [5.1 Introduction to Java Control Structures](#07_Contents.xhtml_chhead47)


    To control the program flow based on certain conditions, logic, and flow, we need
    to use the Java control structures. In this chapter, we will discuss five of them:
    the if-condition, switch-case, do-while, while, and the for loop.


    The if-condition is used to test the given condition and execute a statement block
    based on the result of the condition.


    The switch-case statement is a branching statement that compares the value of
    a certain variable from a list of choices, which are called the case constants.
    If the value of the variable matches the case constant, then a group of statements
    will execute.


    The do-while loop is used to continually execute a statement block while checking
    the result of the condition. The statement block will first execute then the condition
    will be checked, if it yields a true value, then it will again execute the statement
    block until it yields a false value, but in certain cases that the given condition
    gives out an initial value of false, the statement block will execute at least
    once because the condition checking is done at the end of the statement block.


    The while statement, on the other hand, checks the condition first before executing
    the statement block. If the given condition yields a true value, then it executes
    the loop body, but if it yields a false value, then the entire while-statement
    block will be skipped.


    The for-loop is also a looping construct and is ideal to use if you know the exact
    number of times you need to execute a statement block. Detailed discussion for
    each control structure is provided below.


    [5.2 The if Condition and Its Variants](#07_Contents.xhtml_chhead48)


    5.2.1 The if Condition


    The if condition is a conditional statement in Java that is used to test conditions
    and execute a specific statement block. Its general form is:


    ![](Images/img-151.jpg)


    where the statement may either be a single statement or a compound statement (more
    than one statement). If a single statement is used, there is no need to put a
    begin and end brace (**{ }**). If a compound statement follows after the condition,
    it is necessary to enclose the statements in a begin and end brace (**{ }**).
    This is the general form of the if condition with a compound statement:


    ![](Images/img-152a.jpg)


    Where n is the number of statements. If the condition is true, then the statement
    block following the condition (normally called the if-block) will be executed.
    Otherwise, if the given condition returns a false value, the statement block following
    else (normally called the else-block) will be executed. The else block is optional.
    Here is an example of an if condition using a simple statement:


    ![](Images/img-152b.jpg)


    The given condition should yield a boolean value, in this case a true value, and
    therefore the output will be


    I need more sleep


    Here is another example of an if condition:


    Let’s say you are receiving 1000 pesos for your weekly allowance this semester.
    But if you pass all your enrolled subjects this semester, you will be rewarded
    with an additional 500 pesos increase on your allowance next semester. So the
    code will look like this:


    ![](Images/img-153a.jpg)


    This will give us an output of:


    Your allowance next semester is 1000


    Can I have more?


    Notice the if*-block* and the else*-block*, they are enclosed by the begin and
    end braces (**{ }**).


    Let’s take a look at this next program:


    ![](Images/img-153b.jpg)


    This program segment will give us an output of:


    Congratulations!


    Job hunting comes next...


    Learning never ends.


    But if statement 1 is declared as a boolean willGraduate = false; only statement
    3 will be executed. With the absence of the else-block, the statement following
    the if-block, in this case statement 3, will be executed regardless of the result
    of the condition.


