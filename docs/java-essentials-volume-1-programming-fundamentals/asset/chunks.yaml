    ### 5.4 while 语句


    重复操作是我们需要计算机的原因之一。当需要频繁执行大量数据时，拥有一个用于频繁执行的控制机制是非常方便的。这就是为什么我们有 `while` 语句。它让我们能够在能够在重复执行大量指令时进行控制。


    `while` 语句的一般形式为：


    ![](img/img-171a.jpg)


    在执行 `statement block`（语句块）之前，首先评估条件。如果条件返回真值（true），则执行 `statement block`。但如果条件返回假值（false），则编译器将跳过语句块，并执行序列中的后续语句。这里有一个例子：


    ![](img/img-171b.jpg)


    通过这个程序段，它将不断将 `i` 的值加 1，直到 `while` 语句的条件返回假值。循环第一次执行时，值为 `sum = 0 + 1`，第二次通过循环后，`sum`
    的值为 `1 + 2`，然后第三次，`sum` 将是 `2 + 3` 等，只要条件 `i <= 10` 返回真值，就会一直持续下去。


    ### 5.5 do-while 语句


    `do-while` 语句被认为是 `while` 语句的一种变体。其一般形式如下：


    ![](img/img-172a.jpg)


    首先执行语句块，然后评估条件。如果条件返回真值，将再次执行 `do-while` 循环中的第一条语句。语句块将持续执行，直到条件返回假值。


    这是一个使用 `do-while` 语句的程序段示例：


    ![](img/img-172b.jpg)


    如所示，首先执行语句块，然后检查条件。与 `while` 语句不同，Java 先检查条件，如果条件为真，则执行 `statement block`。


    #### while 和 do-while 语句的区别


    如果 `do-while` 语句只是 `while` 语句的变体，那么区别在哪里呢？


    在 `while` 语句中，在执行语句块之前首先检查条件，而在 `do-while` 中不同，你先执行语句，然后再测试条件。在 `do-while` 语句中，无论给定条件的结果如何，语句块都至少执行一次。


    在处理 `while` 或 `do-while` 循环时，务必确保循环有一个有效的退出条件。忘记更新循环变量或编写一个始终为真的条件会导致无限循环，这将使你的程序无休止运行并可能导致系统崩溃或终端冻结。


    这是一个不当做法的示例：


    ![](img/img-173.jpg)


    在上面的示例中，条件 `counter < 5` 将始终为真，因为 `counter` 在循环内部从未被更新。这导致了无限循环。


    ### 5.6 for 循环


    `for` 循环允许在达到特定条件前执行一组指令。`for` 循环的一般形式为：


    ![](img/img-174a.jpg)


    `for` 语句有三个表达式：`expr1` 初始化并声明将使用的变量，`expr2` 是决定循环是否执行的布尔表达式，`expr3` 每次循环时增加或递减变量。所有三个表达式都是可选的。


    ![](img/img-174b.jpg)


    在此程序段中，`i` 初始化为 `1`。由于 `i` 小于 `5`，调用 `System.out.println()`，并且 `i` 加 1。这个过程一直重复直到
    `i` 大于 `5`，此时循环终止。在这个例子中，`i` 是每次循环都会检查的循环变量。


    输出将是：


    i 的值: 1


    i 的值: 2


    i 的值: 3


    i 的值: 4


    i 的值: 5


    `for` 循环中的三个表达式是可选的。如果没有这三个表达式，括号内必须保留两个分号；这将导致无限循环。


    ```

    for ( ; )

    ```


    停止无限循环唯一的方法是通过异常终止程序，按下控制中断（CTRL + C）。


    ### 5.7 break 语句


    `break` 语句不仅用于 `switch-case`，还用于 `for`、`do-while` 和 `while` 语句。如果在任何循环结构内部遇到 `break`
    语句，将跳过语句块的剩余部分，并执行语句块之后的语句。这里有一个例子：


    ![](img/img-175.jpg)


    控制变量 `i` 初始化为 `1`，应该执行 `5` 次（从 `1` 到 `5`），但在循环内部，第 1 行有一个 `if` 条件测试了控制变量 `i`。当
    `i` 变为 `3` 时，将跳过第 2 行以及循环的剩余部分，从而执行第 3 行，即语句块之后的后续语句。因此输出将是：


    1


    2


    循环之外


    ### 5.8 continue 语句


    `continue` 语句仅用于 `for`、`do-while` 和 `while` 循环等循环结构。它允许你提前终止当前循环体，并将程序控制返回到循环开头进行下一次迭代。让我们来看一个类似的示例：


    ![](img/img-176.jpg)


    在这个示例中，输出将是：


    1


    2


    4


    5


    退出循环


