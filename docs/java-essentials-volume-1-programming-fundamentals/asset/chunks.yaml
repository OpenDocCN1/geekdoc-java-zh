    ### 3.1 三种 Java 注


    现在，让我们谈谈 Java 中的注释。注释用于为你未来的自己或你的同事留下信息，这样当你几天几天、几个月或几年后再次查看代码时，就不需要重新追溯代码逻辑。在
    Java 编程语言中，我们有三种类型的注释：单行注释、多行注释和 Java 文档注释（Javadoc）。


    1. **单行注释**：单行注释用于注释掉单行代码。你用一对双斜杠符号开始。双斜杠之后的所有文本都会被视为注释。


    ```java

    // Single Line Comment

    ```


    2. **多行注释**：我们还有多行注释。多行注释用于注释掉多行代码。你用正斜杠（`/`）后跟星号（`*`）符号开始，然后用星号（`*`）后跟正斜杠（`/`）来结束它。


    ```java

    /*

    Multi Line Comment

    */

    ```


    你在这些多行注释内部找到的所有文本都被视为注释。假设你有一段代码为了测试目的想要移除；你不需要立即删除它。相反，你只需要用多行注释将其括起来，这样当你需要这些代码时，只需移除周围的注释，而无需重新输入该代码块。


    3. **Java 文档注释**：Java 文档注释也称为 javadoc 注释，用于在你的源代码中记录或放置 Java 文档。以下是编写 Javadoc
    注释的方法：


    ```java

    /**

    Java Documentation Comment

    */

    ```


    这种类型的注释用于描述该结构的内容。它通常放置在类声明、属性声明或方法声明上方，以描述该构造的功能。在编写完应用程序并放入适当的 Javadoc 注释后，你现在创建一个
    HTML 文件，该文件与 Java API 文档非常相似，可以在浏览器中启动并查看。


    可以通过此链接访问 Java 23 API 文档：[`docs.oracle.com/en/java/javase/23/docs/api/index.html`](https://docs.oracle.com/en/java/javase/23/docs/api/index.html）。（本书的在线资源部分也提供了该链接）。随后你可以在任何
