    ## The short circuit and operator (&&)


    ```java

    int a = 5, b = 10;

    System.out.println((a < 5) && (++b != 10));

    System.out.println("a = " + a + "\tb = " + b);

    ```


    Will give you an output of:


    ```

    false

    a = 5b = 10

    ```


    This operator is smarter—it only evaluates the second condition if the first one
    is true. If the first condition is false, it skips the second one completely.
    That’s why in the second example, `++b` is not executed, and `b` remains unchanged.


    In summary, use `&` when you always want both sides to be evaluated. Use `&&`
    when you want to skip unnecessary evaluation for performance or to avoid side
    effects.


    ## 23. The Logical OR Operator (|) vs. the Short-Circuit OR Operator (||)


    On the other hand, the `||` operator is a short-circuit OR operator that evaluates
    two boolean expressions. It returns true if at least one of the conditions is
    true and utilizes short-circuit evaluation, meaning if the first expression is
    true, the second is not evaluated anymore, while the logical or operator `|` evaluates
    both expressions regardless of the results.


    ### The logical or operator (|)


    ```java

    int a = 5, b = 10;

    System.out.println((a <= 5) | (++b != 10));

    System.out.println("a = " + a + "\tb = " + b);

    ```


    Will give you an output of:


    ```

    true

    a = 5b = 11

    ```


    This operator always evaluates both sides of the expression, even if the first
    condition is already true. In our example, since `a <= 5` is true, Java still
    executes `++b`, increasing `b` from `10` to `11`.


    ### The short circuit or operator (||)


    ```java

    int a = 5, b = 10;

    System.out.println((a <= 5) || (++b != 10));

    System.out.println("a = " + a + "\tb = " + b);

    ```


    Will give you an output of:


    ```

    true

    a = 5b = 10

    ```


    This operator only evaluates the second condition if the first one is false. Since
    `a <= 5` is already true, Java skips the second condition, so `++b` is not executed,
    and `b` remains `10`.


    In summary, use `|` when you always want both sides to run, regardless of the
    first result. Use `||` when you want to skip the second part if the first condition
    is already enough to determine the result.


