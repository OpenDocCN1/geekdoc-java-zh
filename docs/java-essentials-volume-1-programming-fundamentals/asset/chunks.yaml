    ### 5. 二进制取反运算符 `~`


    在许多计算场景中，理解小数是如何用二进制表示的是非常重要的。这对于处理位操作、设置或清除标记以及理解数据如何存储在内存中特别有用。例如，假设我们要取反数字的特定位或只需观察其二进制表示。为了做到这一点，我们首先需要将十进制转换为二进制。


    首先，将十进制转换为等二进制值。在十进制（底 10）格式下，你有：


    1357


    在二进制（底 2）格式下，你有：


    ![](img/img-121a.jpg)


    `~1357` 将取反所有的二进制位，所有的 1 变成 0，所有的 0 变成 1。


    ![](img/img-121b.jpg)


    取反所有二进制位后，将它们转换回十进制格式。


