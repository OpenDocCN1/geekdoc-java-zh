    The enhanced for loop was introduced in Java SE version 5, also called the for-each
    loop. The enhanced for loop was primarily created for Collections, which is another
    data type, but can also be used for arrays. Based on my experience, the enhanced
    for loop runs faster in most cases. We will discuss the Collections framework
    in the next volume of this book, but for now, our focus is on arrays.


    The noticeable difference between the two is that in the traditional for loop,
    you can freely access the control variable (usually it’s the variable i). But
    in the enhanced for loop, you cannot access your control variable.


    Secondly, using the traditional for loop, you can iterate over the array (or over
    the Collections) from the first element down to the last and in reverse. In the
    enhanced for loop, you could only iterate through your array from the first element
    down to the last. A reverse iteration is just not possible.


