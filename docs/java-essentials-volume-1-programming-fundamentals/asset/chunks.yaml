    Java 可以运行在大多数流行的平台上。这一特性对于许多投资了微型计算机、大型主机甚至桌面级电脑等硬件的客户来说非常有价值。他们不希望在在使用另一套标准时舍弃这些投资。


    Java 的优点之一是，一旦你完成了编译和归档，它就具有了在大多数平台上运行的能力。一旦你编译了源文件（`*.java`），它会生成一个编译后的文件（`*.class`），其中包含你的
    Java 字节码。然后，你可以让你的 `*.class` 文件在任何平台上的任何 Java 运行时运行。在大多数情况下，单个 Java 源文件可以产生多个类文件。在这种情况下，管理多个类文件并将其交付给客户非常困难。这时
    JAR 文件就派上用场了。JAR 代表 `J`ava `AR`chive（Java 存档）。它允许将相关的类组合在一起形成一个名为 JAR 文件的单个归档文件。


    与多个分散的类文件相比，拥有单个 JAR 文件将允许用户更容易地执行和管理程序。


    如图 1.2 所示，Java 源文件（`*.java`）被编译成字节码（`*.class`），然后可以打包成 `*.jar` 文件并由 Java 虚拟机（JVM）执行。由于
    JVM 可用于 Windows、Mac OS、Linux OS 和 Solaris 等各种平台，因此同一个 Java 程序可以在所有这些系统上无缝运行，展示了
    Java 的跨平台能力。


    ### 图 1.2 Java 虚拟机的跨平台图


    ![](img/fig1-2.jpg)


    假设你在 Windows 操作系统中编写了源文件。然后你对其进行了编译和测试。你使用 Java 编写的这个基于 Windows 的应用程序已经使用了一两年。然后购买了另一套硬件设备，但这次使用的是更好的操作系统，比如
    Linux OS。你还能继续使用你基于 Windows 的 Java 应用程序吗？答案是肯定的！你只需要在 Linux 机器上安装所需的 Java 运行时环境，然后！你以前在
    Windows 上运行的 Java 应用程序也可以在你的 Linux 机器上运行。


    ### 1.1.7 Java 是安全的


    Java 是安全的，因为它们运行在 Java 虚拟机（JVM）之上。JVM 是你的 Java 运行时环境（JRE）的组件之一，允许你在你的平台上运行 Java
    字节码。Java 字节码包含在你的类文件和 JAR 文件中。一旦安装了 JRE，一切就绪了。你现在可以在你的机器上运行 Java 应用程序。


    你的 JVM 解释编译后的 Java 代码（`*.class`）并运行它。你的 JVM 位于你的操作系统之上并充当它的边界；这意味着运行的 Java 应用程序无法执行任何未经边界设置者（即你的
    JVM）批准的破坏性操作。拥有这一额外层意味着你的 Java 应用程序与底层操作系统没有直接附着或直接接触；它在到达你的操作系统之前需要经过一系列层级。因此，无论你在
    JVM 之上运行什么事务（即你的 Java 应用），你的底层操作系统都无法直接访问它。Java 不允许直接访问内存；这使得意外引用属于其他程序或内核的内存变得不可能。


    图 1.3 显示了从服务器发送的 Java 应用程序（历史上，是嵌入在网页中的小程序）如何由于 Java 虚拟机（JVM）的安全设计而被阻止在客户端执行。JVM
    充当 Java 应用程序与底层操作系统之间的边界，防止对系统内存的直接访问和未经授权的操作，通过要求所有操作通过受控层来增强安全性。


    ### 图 1.3 应用程序未直接安装在操作系统层级


    ![](img/fig1-3.jpg)


    此外，Java SE 拥有一套自己的 API（应用程序接口），允许程序员使用由 Java 开发者社区预创建的代码和类。它也是 JRE 的组成部分。Java
    安全技术包括工具、常用安全算法的实现、机制和协议。Java 安全 API 涵盖了广泛领域，包括密码学、公钥基础设施、安全通信、身份验证和访问控制。它还为用户或管理员提供了一套安全管理应用程序的工具。


    ### 1.1.8 Java 支持 GUI


    使用 Java，你还可以创建图形用户界面（GUI）应用程序，这使用户可以使用按钮、窗口、文本框和其他在创建用户界面时可以使用的图形对象。Java 基础类库（JFC）是
    Java 用于构建可移植 GUI 应用程序的最流行的图形框架之一。JFC 由抽象窗口工具包（AWT）、Swing 和 Java 2D 组成，它们结合可以产生可以在大多数类型操作系统上运行的
    GUI。


    ### 图 1.4 简单 GUI 记事本的示例输出


    ![](img/fig1-4.jpg)


    在 JFC 中，你可以自定义 GUI 应用程序的外观和感受，它有广泛的 GUI 组件供你选择。在图 1.4 提供的示例 GUI 记事本图像中，你可以看到我可以创建一个简单的
    GUI 记事本应用程序，Java 也支持这种程序。


    JavaFX 是一个基于 Java 构建的用于桌面、移动和嵌入式系统的下一代客户端应用程序平台。


    ### 1.1.9 Java 是免费的


    Java 开发工具包（JDK）和 Java 运行时环境（JRE）安装程序可以从 Oracle 网站免费下载，无需费用。个人和学术用途是免费的。


    ## 1.2 Java 的三种口味


    “Java 的三种口味”术语指的是 Java 的三个主要版本，每种版本都为不同的开发环境定制。


    这些每个版本都有独特的用途，确保 Java 可以应用于广泛的开发场景，从简单的桌面应用程序到复杂的企业系统和嵌入式设备。


    ### 图 1.5 Java 技术家族


    ![](img/fig1-5.jpg)


    在过去，曾是 J2ME、J2SE 和 J2EE，但从 6.0 版本开始，Sun Microsystems（Java 技术的原始开发者，现由 Oracle 公司所有）决定将其技术重新命名为
    Java SE、Java EE 和 Java ME。让我们详细查看这三种技术。


    ### 1.2.1 Java SE（标准版）


    Java SE 包含用于创建 applet 和/或桌面应用程序的标准类库。它是所有基于 Java 技术的核心。Applet 从 JDK 9 开始被废弃。


    ### 1.2.2 Java EE（企业版）


    Java EE 是一个框架，允许开发者使用供应商无关的技术来开发其企业应用程序。Java EE 使用标准库和其他扩展的 API（应用程序编程接口）来构建和部署这些应用程序，它通常使用浏览器作为客户端，并可供多个并发用户使用。Java
    EE 是广泛使用的服务器端编程平台，提供了部署基于在应用程序服务器上的模块化组件的容错、多层、分布式 Java 技术应用程序的功能。


    ### 1.2.3 Java ME（微型版）

