    Why did we have `Num3: 3` as the output here? The output that we are expecting
    should be `Num3: 3.333`, right?


    Let’s check the given values of `num1` and `num2`, which are 10 and 3, respectively.
    Since the numerator and the denominator are both integer values, the result will
    also be an integer value. So if you want to get the exact double output, one of
    your operands must be a double. Consider this example:


    ```java

    int num1 = 10;

    int num2 = 3;

    double num3 = (double)num1 / num2;

    System.out.println("Num3: " + num3);

    ```


    Therefore, the output here will be:

    ```

    Num3: 3.3333333333333335

    ```


    Now, that’s the exact double value.


    In the line: `double num3 = (double)num1 / num2`; `num1` was explicitly cast to
    a double, allowing the operation `(double)num1 / num2` to result in a double value.


