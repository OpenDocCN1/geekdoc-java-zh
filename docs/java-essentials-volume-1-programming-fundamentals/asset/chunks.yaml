    In the above code snippet, the expression on line 2 calculates the value of `x`.
    The order of operations (or precedence) dictates that division occurs before addition.


    The pre-increment operator `++c` increases `c` from `4` to `5`.


    Next, `b / c` is evaluated, which is `10 / 5`, yielding `2`.


    Finally, the addition is performed: `a + 2`.


    ![](Images/img-141.jpg)


    ```java

    int a = 2 + 10 / 5;

    int c = 4;

    ++c;

    int b = 10 / c;

    ```


    The order of precedence rules will ensure that once you have this set of operators
    inside a certain expression or statement, it will execute a set of operators first,
    followed by another, and then by another.

