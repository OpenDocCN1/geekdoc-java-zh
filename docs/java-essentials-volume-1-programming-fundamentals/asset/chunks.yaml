    [2.2 The System.out.println() Method](#07_Contents.xhtml_chhead22)


    To print an output, we can use the System.out.println() method to print something
    to the screen with the next line character (‘\n’) at the end. If you do not want
    the next line character included, you can use the System.out.print() method to
    print your output, and the cursor will be placed on the same line.


    The (‘+’) operator is considered to be an overloaded operator, which means it
    can have different functions. It can be used for addition if both operands are
    numeric, and it can be used as a concatenation symbol if one of its operands is
    a String. A String is like a necklace made of letters, numbers, and symbols all
    tied together in a line.


    The System.out.println() method statements in [Table 2.1](#20_Ch02.xhtml_c2t1)
    will demonstrate how to display an output and the use of the plus (‘+’) operator.


    Table 2.1 System.out.println() method statements


    | Java Statement | Output |


    | --- | --- |


    | System.out.println("Hello World"); | Hello World |


    | System.out.println("Hello\tWorld"); | HelloWorld |


    | System.out.println("Hello" + "\t"+ "World"); | HelloWorld |


    | System.out.println("Hello\nWorld"); | Hello World |


    | System.out.print ("Hello World"); | Hello World_ |


    | System.out.print ("Hello World\n"); | Hello World _ |


    | System.out.print ("Hello World" + "\n"); | Hello World _ |


    | int x = 100; |  |


    | System.out.println("x"); | x |


    | System.out.println(x); | 100 |


    | System.out.println("x = " + x); | x = 100 |


    | System.out.println("5" + "10"); | 510 |


    | System.out.println(5 + 10); | 15 |


    | System.out.println(5 + 10 + "abc"); | 15abc |


    | System.out.println("abc" + 5 + 10); | abc510 |


    | System.out.println("abc" + (5 + 10)); | abc15 |


