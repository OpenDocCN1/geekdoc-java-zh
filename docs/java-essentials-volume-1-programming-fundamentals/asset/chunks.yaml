    In this chapter, we will dive into the very basic data structure in Java called
    arrays, exploring their versatility in managing collections of data. You’ll learn
    about the various ways arrays can be used, from their basic creation to handling
    more complex forms like multi-dimensional arrays. We will cover best practices
    for working with arrays, including how to manipulate them efficiently and how
    they can interact with other elements of a Java program, such as command line
    arguments. Additionally, you’ll understand how Java provides different approaches
    to iterate through arrays and deal with more advanced configurations like non-rectangular
    arrays. This will deepen your understanding of how arrays operate within the Java.


    [7.1 Introduction to Arrays](#07_Contents.xhtml_chhead67)


    An array is a data structure in Java that is used to group common data types together.
    It is normally a homogeneous collection, which means that the data type of one
    element is the same data type of the other elements. It has a fixed size, and
    once the size has been set, it cannot be changed to accommodate other


    Let’s understand arrays with the help of an example. Let’s say your instructor
    gave you five short quizzes for your midterms, instead of declaring them as:


    int quiz1, quiz2, quiz3, quiz4, quiz5;


    You may want to declare them as:


    int[] quiz = new int[5];


    This means that you are declaring and creating an array of quizzes of type integers
    that can have 5 integer values. Let us now determine the parts of the given array:


    ![](Images/img-214.jpg)


    Sometimes you might need more than one array. You can use the following statement
    to declare multiple arrays in a single line:


    int quiz[], seatwork[];


    This is also equivalent to:


    int[] quiz, seatwork; // preferred way to write arrays


    Once the [] notation follows the data type declaration, all variables in the declaration
    are arrays; otherwise, the [] must follow after each variable.


    You can declare arrays of any type, either a primitive data type or a reference
    data type. Arrays in Java are treated as objects. Therefore, we can construct
    our arrays by using the new keyword.


    ![](Images/img-215a.jpg)


    You have now created an array of quizzes and an array of seatwork of type integers,
    having 5 and 7 elements respectively.


    Array declaration and array creation can also be done in one statement:


    int[] quiz = new int[5];


    int[] seatwork = new int[7];


    The Java programming language also allows the creation of arrays with initial
    values:


    ![](Images/img-215b.jpg)


    Since Strings are objects, you can also declare them this way:


    ![](Images/img-215c.jpg)


    Another example is the declaration and initialization of an array of int.


    int[] quizzes = {90, 100, 80, 70, 95};


    **Arrays have initial values upon creation.**'
