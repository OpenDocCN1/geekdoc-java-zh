    ### 5.3.3 Language Enhancements for Java 13 and Java 14


    As the newer versions of Java are introduced, so are the new set of language features.
    In Java 13 and Java 14, there are several language enhancements introduced in
    switch-case. Originally a preview feature in Java 12, but was made permanent in
    Java 13 onwards.


