    Ensure that you have installed and configured your JDK on your local machine.


    [Chapter 1](#07_Contents.xhtml_chhead10)


    [Your First Java Cup](#07_Contents.xhtml_chhead10)


    ![](Images/obj.png) Key Learning Objectives


    • Identify the key features that make Java a popular, modern, and powerful programming
    language.


    • Understand the three core technology flavors of Java: Java SE, Java EE (Jakarta
    EE), and Java ME.


    • Differentiate between the Java Development Kit (JDK) and the Java Runtime Environment
    (JRE).


    • Explain the role of Java’s automatic memory management system, the Garbage Collector.


    • Describe how Java helps ensure code security through three built-in protective
    tasks.


    In this chapter, you will take your first sip from the Java cup by getting acquainted
    with the foundational concepts that define the language. Java has remained one
    of the most widely used programming languages in the world, thanks to its reliability,
    versatility, and strong community support. You’ll begin by exploring the key features
    that make Java unique, from platform independence to object-oriented design. Then
    you’ll learn about the different “flavors” of Java that cater to desktop, enterprise,
    and embedded applications. As you move forward in this chapter, you’ll discover
    the critical differences between the JDK and JRE—two essential components in any
    Java programmer’s toolkit. You’ll also be introduced to Java’s automatic memory
    management system, the Garbage Collector, and how it simplifies resource handling.
    Finally, we’ll discuss how Java’s architecture is designed with built-in mechanisms
    that enhance code security. These topics will provide the essential groundwork
    for everything you’ll learn in the rest of the book.


    [1.1 The Key Features of Java](#07_Contents.xhtml_chhead11)


    Have you ever wondered why, in today’s technology and after all these years, we
    still study Java? The following timeless key features are the reason why Java
    is still relevant.


    1.1.1 Java is Object-Oriented'
