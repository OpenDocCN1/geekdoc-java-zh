    A clever use of XOR is swapping two values without needing a temporary variable.
    By XORing two numbers twice, you can exchange their values.


    Example: Swapping values without using a temporary variable.


    int x = 5, y = 10;


    System.out.println("x: " + x + ", y: " + y);


    // Output: x: 5, y: 10


    x = x ^ y; // Step 1


    y = x ^ y; // Step 2


    x = x ^ y; // Step 3


    System.out.println("x: " + x + ", y: " + y);


    // Output: x: 10, y: 5


    Consider another example of how bitwise XOR (^) works.


    int x = 13, y = 9;


    System.out.println(x ^ y);


    To perform a bitwise XOR (^) operation, we begin by converting each operand to
    its binary form, then comparing each pair of corresponding bits. For XOR, the
    result is 1 only if the bits are different; if they’re the same (both 0 or both
    1), the result is 0.


