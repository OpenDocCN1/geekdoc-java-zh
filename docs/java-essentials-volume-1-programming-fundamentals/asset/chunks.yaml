    Will give you an output of:


    true


    a = 5b = 11


    This operator always evaluates both sides of the expression, even if the first
    condition is already true.


    In our example, since a <= 5 is true, Java still executes ++b, increasing b from
    10 to 11.


    The short circuit or operator (||)


    int a = 5, b = 10;


    System.out.println((a <= 5) || (++b != 10));


    System.out.println("a = " + a + "\tb = " + b);


    Will give you an output of:


    true


    a = 5b = 10


    This operator only evaluates the second condition if the first one is false. Since
    a <= 5 is already true, Java skips the second condition, so ++b is not executed,
    and b remains 10.


    In summary, use | when you always want both sides to run, regardless of the first
    result. Use || when you want to skip the second part if the first condition is
    already enough to determine the result.


    24\. The Ternary Operator (e1 ? e2 : e3)


    The ternary operator can be used as a substitute for a simple if-else statement,
    which will be discussed in the next chapter, including all its variations.


    Consider the following sample code snippet:


    ![](Images/img-139.jpg)


    Let’s use the ternary operator to rewrite the code snippet.


    System.out.println((quiz >= 70) ? "Pass" : "Fail");


    25\. Shorthand Operators


    Shorthand operators are used as a substitute for Java assignment operators.


    Table 4.2 List of Longhand and Shorthand Operators


    | Longhand Operators | Equivalent Shorthand Operators |


    | --- | --- |


    | a = a * 2 | a *= 2 |


    | a = a / 2 | a /= 2 |


    | a = a % 2 | a %= 2 |


    | a = a + 2 | a += 2 |


    | a = a - 2 | a -= 2 |


    | a = a << 2 | a <<= 2 |


    | a = a >> 2 | a >>= 2 |


    | a = a >>> 2 | a >>>= 2 |


    | a = a & 2 | a &= 2 |


    | a = a ^ 2 | a ^= 2 |


    | a = a &#124; 2 | a &#124;= 2 |


    [4.2 Order of Precedence](#07_Contents.xhtml_chhead42)


    The list of operators that you have just seen follows a certain set of rules in
    execution. Those rules are what we call the ‘order of precedence’. These rules
    will ensure that once you have this set of operators inside a certain expression
    or statement, it will execute a set of operators first, followed by another, and
    then by another.


    The order in which the operators are stated in *[Figure 4.1](#28_Ch04.xhtml_c4f1):
    List of Java Operators* also shows the order of precedence. The operators listed
    on top have a higher priority compared to the ones on the lower row.


    Here is an example involving several operators: the (++) increment, the ( / )
    division, the ( + ) addition, and the ( = ) assignment operators.


    Say you have the following snippet:


    ![](Images/img-140.jpg)


    Once executed in a valid Java file, you should get an output of: 7.


    In the above code snippet, the expression on line 2 calculates the value of x.
    The order of operations (or precedence) dictates that division occurs before addition.


    The pre-increment operator ++c increases c from 4 to 5.


    Next, b / c is evaluated, which is 10 / 5, yielding 2.


    Finally, the addition is performed: a + 2, or 5 + 2, resulting in 7.


    Thus, the output is 7.


    The order of precedence can be changed by the use of the grouping symbol, a parentheses
    (). Whatever mathematical expression is placed inside the parentheses will be
    the top priority. Consider the same snippet, this time a parenthesis is placed
    in line 2.


    ![](Images/img-141.jpg)


    In this version, the order of operations in line 2 will change. We now evaluate
    (a + b) first, followed by the incrementation of the value of c (++c), then the
    division ( / ) of the sum of a and b with the new value of c (10 / 5), and lastly
    the assignment operator (=). This will then print a value of 3 as the output in
    line 3.


    In an event that the parentheses contain another parenthesis inside, the evaluation
    should be done from the innermost parentheses, followed by the outer parentheses.
    Consider this example:


    int x = ((a + b) - c) / d;


    The first that will be evaluated will be (a + b), followed by subtracting the
    value of c, then whatever value you get will be the numerator, and the value of
    d will be the denominator. Lastly, the result will be assigned to x.


    This chapter introduced you to the full range of Java operators, from fundamental
    arithmetic operations to more advanced bitwise and ternary logic. You learned
    how each operator functions and how they are used in practical code, especially
    when combined within complex expressions. A key focus was understanding operator
    precedence and associativity, which determine how expressions are evaluated when
    multiple operators are involved. Recognizing the natural order in which operations
    occur helps prevent logical errors and improve code clarity. You also discovered
    how parentheses can be used to enforce a specific evaluation order, providing
    better control over expression outcomes. Mastering these concepts equips you with
    the tools to write clear, precise, and bug-free code in Java.


    [![](Images/sum.png) Chapter Summary](#07_Contents.xhtml_chhead43)


    • Java provides a variety of operators, including arithmetic, relational, logical,
    assignment, unary, ternary, and bitwise, each serving a specific purpose in expressions
    and program logic.


    • Operators can be combined in a single statement, and understanding how they
    interact is essential for writing accurate and efficient code.


    • Java follows a well-defined order of precedence, which determines the sequence
    in which operators are evaluated in compound expressions.


    • Associativity defines how operators of the same precedence level are evaluated,
    typically from left to right or right to left.


    • Using parentheses is the most effective way to clarify or override default precedence,
    ensuring that expressions behave as intended.


