  trans: "\n\n```\njava CommandLineArgs1 one \"two two\" three\n```\n\n文件名之后的 `Strings`\
    \ 是命令行参数，它们被传递给 `main` 方法的 `String` 类型参数数组。每个 `String` 都是 `args[]` 数组中的一个元素。你只需要用空格分隔每个\
    \ `String` 即可。但如果你想在 `String` 内部包含空格，可以使用一对双引号将其括起来，就像我们处理参数 \"two two\" 时所做的那样。执行后，你将得到以下输出：\n\
    \none\n\ntwo two\n\nthree\n\n在这个例子中你看到了什么问题？\n\n如果我想传递少于三个参数呢？或者说，传递多于三个参数呢？\n\
    \n```\njava CommandLineArgs1 one \"two two\" three four five\n```\n\n你将得到相同的输出：\n\
    \none\n\ntwo two\n\nthree\n\n在显示命令行中元素数量方面，你的代码并不够动态。它无法适应前三个元素之外的其他 `String`\
    \ 值。\n\n参数列表的数量不是动态接收的。我们需要重写代码，使其能够接受通过命令行传递的任意数量的元素：\n\n![](img/img-225a.jpg)\n\
    \n使用 `args.length` 允许你访问数组的大小，通过在 `for` 循环中使用它，你可以编写一个从第一个元素迭代到最后一个元素的循环。\n\n\
    但使用增强 for 循环（enhanced for loop），也可以这样重写。\n\n![](img/img-225b.jpg)\n\n在这个例子中，我们必须记住，当我们通过命令行传递参数时，传递的是\
    \ `String` 值，即使我们传递的是整数或其他数据类型。按照规则，所有通过命令行传递的参数值都是 `Strings`，因为你的 `main` 方法只能接收\
    \ `String` 值的数组。\n\n所以，假设我们通过命令行传递整数值，然后计算这些整数值的和和平均值。我们该如何做呢？\n\n考虑这段代码：\n\n\
    ![](img/img-226.jpg)\n\n当我们使用以下命令行值编译并运行此代码时，你将得到以下输出：\n\n```\njava CommandLineArgs4\
    \ 1 22 3 4 5 6 7\n```\n\nSum: 48\n\nAve: 6.857142857142857\n\n正如你在第 8 行所示，我们使用\
    \ `Integer` 类中的方法 `Integer.parseInt(arg)` 将 `String` 参数值转换为其等效整数。在 `String` 值被解析后，现在就可以用于任何数学运算，包括加法。\n\
    \n## 7.6 数组的数组（二维数组）\n\n`Java` 中的二维数组就像一个具有行和列的表格。你可以将其想象为“数组的数组”。二维数组中的每个元素都通过两个索引来访问：一个用于行，一个用于列。你可以拥有一个矩形的“普通”二维数组，也可以是非矩形的数组。\n\
    \n### 7.6.1 矩形二维数组\n\n让我们先看一眼“普通”二维数组。考虑这个例子：\n\n![](img/img-227.jpg)\n\n在这个例子中：\n\
    \n* `numbers[0][0]` 指向 10 – 这是第 0 行第 0 列的元素。\n* `numbers[0][1]` 指向 20 – 这是第 0\
    \ 行第 1 列的元素。\n* `numbers[0][2]` 指向 30 – 这是第 0 行第 2 列的元素。\n* `numbers[1][0]` 指向\
    \ 40 – 这是第 1 行第 0 列的元素。\n* `numbers[1][1]` 指向 50 – 这是第 1 行第 1 列的元素。\n* `numbers[1][2]`\
    \ 指向 60 – 这是第 1 行第 2 列的元素。\n\n你可以这样可视化该数组：\n\nRow 0 → [10] [20] [30]\n\nRow 1\
    \ → [40] [50] [60]\n\n每个元素通过其行索引、后跟其列索引来访问，语法为：`numbers[row][column]`。\n\n记住数组索引始终从\
    \ 0 开始，即使是二维数组也是如此。\n\n这里是我们可以使用二维数组的其他实际示例：\n\n1. **电子表格或表格**\n\n   想象像 `Microsoft\
    \ Excel` 或 `Google Sheets` 这样的程序。电子表格中的每个单元格都可以通过行和列识别。同样，二维数组允许你使用两个索引来存储和访问数据。\n\
    \n   **示例：**\n\n   ![](img/img-228a.jpg)\n\n   * `grades[0][0]` 是 “Matthew”（第\
    \ 0 行，第 0 列）\n   * `grades[0][1]` 是 “85”（第 0 行，第 1 列）\n\n   这在存储学生姓名及其分数，或任何以行列结构化的数据时非常有用。\n\
    \n2. **游戏棋盘（例如国际象棋、井井棋）**\n\n   涉及网格的游戏是二维数组的完美用例。例如，国际象棋盘上的每个方格都可以用行和列来表示。\n\n\
    \   **示例：**\n\n   ![](img/img-228b.jpg)\n\n   你可以通过扫描行、列或对角线来轻松检查胜者。\n\n3. **图像或像素**\n\
    \n   在数字图像中，每个像素都可以被视为网格上带有颜色值的微小方格。你可以用二维数组来表示它，每个单元格存储一个颜色值。\n\n   **示例：**\n\
    \n   ![](img/img-229a.jpg)\n\n   这可以用于图像处理、过滤器。\n\n4. **座位图**\n\n   在教室、剧院或飞机上，座位按行和列排列。\n\
    \n   **示例：**\n\n   ![](img/img-229b.jpg)\n\n   这允许你的程序管理预订。\n\n二维数组是建模现实世界布局的一种多功能结构。对于\
    \ Java 初学者来说，掌握二维数组为解决更复杂的问题开启了大门。\n\n你也可以创建并声明带有默认值的二维数组。\n\n```java\nint[][]\
    \ arr2d = new int[3][4];\n```\n\n我们将使用内存图来可视化数组是如何结构化的。\n\n图 7.3 二维数组内存分配\n\n\
    ![](img/fig7-3.jpg)\n\n所有元素都初始化为零 (0)，因为它是 `int` 的默认值。\n\n也可以通过这种方式声明并初始化多维数组：\n\
    \n![](img/img-230.jpg)\n\n图 7.4 带有值的二维数组内存分配\n\n![](img/fig7-4.jpg)\n\n看看这个例子：\n\
