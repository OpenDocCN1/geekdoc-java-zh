    \ `String`。\n\n示例：\n\n```java\nint grade = 70;\nSystem.out.println(\"Your grade\
    \ is \" + grade);\n```\n\n## 6.2 常用 String 方法\n\n`String` 类包含了检查序列中单个字符、比较字符串、搜索字符串、提取子字符串以及创建一个所有字符都转换为大写或小写的\
    \ `String` 副本的方法。通用的 `String` 方法有：\n\n* `substring()`\n* `length()`\n* `charAt()`\n\
    * `concat()`\n* `replace()`\n* `toLowerCase()`\n* `toUpperCase()`\n* `equals()`\n\
