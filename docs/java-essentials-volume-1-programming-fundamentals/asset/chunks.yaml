    We can also do the same feature via command line without the use of any IDE. Java
    provides a built-in tool called javadoc that can be used to generate HTML documentation
    from Java source files containing special comments known as Javadoc comments.
    These comments begin with /** and are commonly used to describe classes, methods,
    constructors, and fields in a format that can be automatically extracted and formatted.


    The basic command (all JDK versions) to generate documentation from a valid Java
    source file, use the following command in your terminal or command prompt:


    javadoc MyClass.java


    This command will produce a set of HTML files in the current directory under a
    doc folder (or wherever the output is directed), representing the public API of
    MyClass.java as documented by the Javadoc comments.


    To specify an output directory explicitly, use:


    javadoc -d docs MyClass.java


    This will generate the documentation in a folder named docs.


    For most use cases, the javadoc command remains consistent across different versions
    of the JDK. However, there are some key considerations when working with newer
    features introduced in recent JDK releases, especially preview features like unnamed
    classes.


    Here’s a summarized table showing the key differences and considerations:


    | Feature / Scenario | Traditional JDK (e.g., JDK 8–17) | Newer JDK (e.g., JDK
    21+) |


    | --- | --- | --- |


    | Standard class with Javadoc comments | Supported | Supported |


    | Use of preview features | Not supported | Requires --enable-preview flag |


    | Modules and advanced structures | Limited support | Better support with --module-path,
    etc. |


    | Unnamed classes | Not recognized | Not currently recognized by javadoc |'
