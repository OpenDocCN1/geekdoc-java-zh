    在 Java 中，数组是存储相同数据类型固定大小元素集合的最基本且最直观的数据结构之一。当数组被创建时，其元素将根据其数据类型自动初始化为默认值。数组的大小可以通过
    `.length` 属性确定，这对于控制循环执行和避免索引错误非常有用。Java 提供了多种高效处理数组的技术。增强型 for 循环为遍历数组元素提供了一种更简洁、可读更高的方法。此外，`System.arraycopy()`
    方法简化了数组之间数据拷贝的任务。


    Java 还允许使用命令行参数，这些参数作为字符串数组传递给 `main` 方法，提供了接收输入的另一种方式。


    此外，Java 支持一维数组和二维数组。二维数组被实现为一维数组的数组，允许创建矩形和非矩形（锯齿）数组结构。


    ![![](img/sum.png) 章节总结](#07_Contents.xhtml_chhead73)


    - 数组是大多数编程语言（包括 Java）中最简单的数据结构。

    - 数组在创建时具有初始值。

    - 数组限制可以使用 `.length` 属性确定。

    - 增强型 for 循环可以作为遍历数组的替代方法。

    - `System.arraycopy()` 方法是拷贝数组内容的最简单方法。

    - 命令行参数是 Java 中接受字符串值的另一种方式。

    - 二维数组被处理为一维数组的数组。

    - 矩形和非矩形数组都是 Java 的特性。


    ![![](img/quiz.png) 测验题](#07_Contents.xhtml_chhead74)


    1. 关于 Java 数组，以下哪种描述是**不正确**的？


    a. Java 数组一旦创建，就会有一个固定的大小。你可以通过调用 `.length` 属性获取数组的大小。

    b. 数组中的元素通过非负整数索引访问。

    c. 数组元素使用从 `0` 到 `n-1` 的整数索引（包含边界）进行引用。

    d. 获取数组的元素个数，我们可以使用 `size()` 方法。


    2. 如果我有一个包含 10 个元素的数组，索引值的合法范围是什么？


    a. `1` 到 `10`

    b. `0` 到 `9`

    c. `0` 到 `10`

    d. 索引取决于数组的数据类型


    3. 给定数组声明：


    ```

    int[] myArray = {10, 20, 30, 40, 50};

    ```

    选择获取数组大小的正确方法。


    a. `myArray[].length`

    b. `myArray.size`

    c. `myArray[].size`

    d. `myArray.length`


    4. 给定代码段：


    ```java

    int sum = 0;

    int[] myArray = {10, 20, 30, 40, 50};

    ```


    我们应该使用哪种增强 for 循环来计算数组所有元素的和？


    a. `for (int n : myArray) sum =+ n;`

    b. `for (myArray : n) sum += n;`

    c. `for (int n : myArray) sum += n;`

    d. `for (int n : myArray[]) sum += n;`


    5. 给定类 `MyCode` 的代码体：


    ![![](img/img-236.jpg)]


    给定 `CommandLine` 参数调用：


    ```bash

    java MyCode 10 20 30

    ```

    输出将是什么？


    a. `102030`

    b. `60`

    c. `10 20 30`

    d. 运行时会发生 `ArrayIndexOutOfBoundsException`。


    6. 考虑以下示例代码段：


    ![![](img/img-237.jpg)]


    给定命令行参数，执行文件 `MyJavaCode`：


    ```bash

    java MyJavaCode apple "bike bike" cat <ENTER>

    ```

    运行期间输出是什么？


    a. 运行时会发生错误。

    b. `applebikecat`

    c. `applebikebike`

    d. `applebike bikecat`


    7. 如果我有一个包含 100 个元素的数组，索引值的合法范围是什么？


    a. `0` 到 `99`

    b. `1` 到 `99`

    c. `1` 到 `100`

    d. 取值取决于操作系统。


    8. 给定以下数组声明，哪一种是声明数组的**错误**方式？


    a. `char ch[][] = new char[2][3];`

    b. `int[] a[] = new int[][2];`

    c. `boolean [] bool [] = new boolean[1][];`

    d. `byte[][] b = new byte[10][20];`


    9. 给定声明：


    ```java

    int[][] jaggedArr = {{1, 2}, {3, 4, 5}, {6, 7, 8, 9}};

    ```

    以下哪个选项将打印最短数组的大小？


    a. `System.out.println(jaggedArr[2].length);`

    b. `System.out.println(jaggedArr[1].length);`

    c. `System.out.println(jaggedArr[0].length);`

    d. `System.out.println(jaggedArr[3].length);`


    10. 给定以下代码，输出将是什么？


    ![![](img/img-238.jpg)]


    a. `3`

    b. `1`

    c. `5`

    d. `7`


    答案


    | 1 – d | 2 – b | 3 – d | 4 – c | 5 – a |

    | --- | --- | --- | --- | --- |

    | 6 – d | 7 – a | 8 – b | 9 – c | 10 – a |


