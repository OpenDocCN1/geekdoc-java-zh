    Mac OS X JDK Installer: The process or software used to install the JDK on macOS
    systems.


    Non-Rectangular Arrays: Also called jagged arrays; two-dimensional arrays with
    rows of varying lengths.


    Order of Precedence: Rules that determine the sequence in which operators are
    evaluated in expressions.


    Primitive Data Types: Basic data types in Java, such as int, char, boolean, double,
    etc.


    Runtime Errors: Errors that occur during the execution of a program, such as division
    by zero.


    Scanner Class: A class used to obtain user input in Java from various input sources,
    including the keyboard.


    Semicolons: Symbols used to terminate statements in Java.


    String Class: Represents sequences of characters and is widely used for text processing.


    String Methods: Built-in functions for manipulating and analyzing strings.


    StringBuffer Class: A mutable sequence of characters that is thread-safe.


    StringBuilder Class: Similar to StringBuffer but not synchronized, offering better
    performance in single-threaded contexts.


    switch-case Statement: A control structure that executes one block of code from
    multiple options based on a variable’s value.


    System.out.println(): A method used to print output to the console, followed by
    a new line.


    Two-dimensional Arrays: See Array of Arrays.


    User Input: Data provided by the user at runtime, commonly collected using the
    Scanner class.


    Variables: Containers for storing data values.


    White Spaces: Non-visible characters (spaces, tabs, line breaks) that help separate
    tokens in code but are ignored by the compiler.


    while Loop: A control structure that repeats a block of code as long as a condition
    remains true.


    Windows JDK Installer: The process or software used to install the JDK on Windows
    operating systems.


