    八种原始数据类型可以进一步分类如下：


    ### 1. 整数数据类型

    这些类型包含整数值，可能包含负值和正值，以及零（`0`）。以下是整数数据类型的类型：


    a. `byte` – 一个 8 位数据类型，合法值范围可能是 -2⁷ 到 +2⁷-1 或 -128 到 +127 之间。


    b. `short` – 一个 16 位数据类型，合法值范围可能是 -2¹⁵ 到 +2¹⁵-1 或 -32,768 到 +32,767 之间。


    c. `int` – 一个 32 位数据类型，合法值范围可能是 -2³¹ 到 +2³¹-1 或 -2,147,483,648 到 2,147,483,647
    之间。


    d. `long` – 一个 64 位数据类型，合法值范围可能是 -2⁶³ 到 +2⁶³-1 或 -9,223,372,036,854,775,808 到
    -9,223,372,036,854,775,807 之间。


    表 3.2 整数数据类型的内存大小


    | 长度 | 名称或类型 | 范围 |

    | --- | --- | --- |

    | 8 bits | `byte` | -2⁷ to 2⁷-1 |

    | 16 bits | `short` | -2¹⁵ to 2¹⁵-1 |

    | 32 bits | `int` | -2³¹ to 2³¹-1 |

    | 64 bits | `long` | -2⁶³ to 2⁶³-1 |


    在这四个中，`int` 是默认的整数数据类型。这意味着如果你看到一个没有声明的整数值（无论是负值还是正值），可以安全地假设它是一个 `int`。


    默认的数字格式是十进制（decimal）。对于其他数字格式，必须遵循以下语法：


    ![](img/img-100.jpg)


    ![](img/note.png) 注意


    Java SE 7 及更高版本提供了以下新增功能：


    - 下划线（`_`）现在可以作为 Java SE 7 字面量值的一部分。

    - Java SE 7 还引入了二进制（base 2）格式。可以通过在一系列二进制数（1 和 0）前加上缀 `0B` 或 `0b` 来编写二进制值，例如 `0b0100`。


    ### 2. 浮点型

    对于小数值，你有两种数据类型。你有 `float` 数据类型和 `double`。


    a. `float` – 32 位

    `1.23f`, `-5.14F`


    b. `double` – 64 位

    `3.14`, `5.10D`, `-0.012d`, `1.23456e-2`


    表 3.3 浮点型数据类型的内存大小


    | 长度 | 名称或类型 |

    | --- | --- |

    | 32 bits | `float` |

    | 64 bits | `double` |


    `double` 数据类型是小数的默认数据类型，这意味着如果你看到一个没有数据类型声明的小数值，可以安全地假设它是一个 `double` 值。`double`
    数据类型占用 64 位内存空间，而 `float` 仅占用 32 位内存空间。小数值末尾必须包含大写的‘F’或小写的‘f’作为后缀。


    表 3.4 浮点型值的示例


    ![](img/tbl3-4.jpg)


    `double` 值也可以包含 ''D'' 或 ''d'' 作为后缀。虽然不是必须的，但如果你只是出于可读性目的而声明它，仍然可以将其放在那里。


    ### 3. 文本类型

    文本数据类型用于存储单个 16 位的 Unicode 字符，使其能够表示各种语言的广泛符号、字母和数字，而不只是 ASCII 集合。


    a. `char` – 16 位

    `''a''`, `''\t''`, `''\u0061''`


    声明字符有三种方法，但无论哪种方法，`char` 必须置在一对单引号内。你可以在单引号内放入任何 Unicode 值、转义序列字符或 Unicode 表示法来表示字符值。Unicode
    表示法以前字符 `\u` 加上十六进制数字。


    表 3.5 `char` 值的示例表示


    ![](img/tbl3-5.jpg)


    ### 4. 逻辑类型

    它用于表示真或假值。这种类型对于程序中的决策至关重要，特别是在条件和控制结构中。


    a. `boolean`


    `boolean` 原始数据类型只有两个可能的值；它可以是真或假值。新手的一个常见错误（特别是当他们有 C 语言背景时）是认为 `boolean` 数据类型有一个数值等值。


    看这段代码片段：


    ```java

    boolean doorIsOpen = false;


    // 我想打开门

    doorIsOpen++; // incompatible types

    ```


    你不能将 `doorIsOpen` 的值加 1。在 C 等其他编程语言中，`boolean` 数据类型被声明为 `int` 并可以递增或减少。在 Java
    中，要切换 `boolean` 值，我们可以使用 `boolean` 取反运算符（`!`），它可以将真值变为假值，反之亦然。这是正确的版本：


    ```java

    boolean doorIsOpen = false;

    ```


