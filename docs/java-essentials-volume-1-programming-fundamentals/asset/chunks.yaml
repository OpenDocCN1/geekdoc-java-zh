    和 `continue` 语句如何管理嵌套循环的流。掌握这些控制结构对于构建响应、逻辑且动态的程序至关重要。


    ## 章总结


    - Java 控制结构允许你的程序根据动态条件做出决策并重复任务。

    - `if`、`if-else` 和 `if-else-if` 语句允许根据布尔表达式条件执行代码。

    - `switch-case` 结构为长 `if` 链提供了一种更整洁的替代方案，特别是当检查单个变量的多个值时。

    - Java 支持三种主要类型的循环——`while`、`do-while` 和 `for`——每种用于在特定条件下重复代码块。

    - `break`、`continue` 及其变体对循环执行提供了细粒度的控制，特别是在嵌套循环场景下。


    ## 测验


