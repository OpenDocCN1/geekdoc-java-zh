    # 前言


    欢迎阅读 *Java Essentials Volume 1: Programming Fundamentals*，这本书专为那些几乎没有经验就进入 Java
    世界的人士精心编写的。无论你是一个有抱负的开发者、自学学者、大一新生，还是渴望学习世界上最强大且多功能的编程语言之一的高中生，这本书都是为你设计的。


    二十年来，Java 一直保持着其作为可靠通用语言的声誉——驱动着 Web 服务器、企业级软件、移动应用程序甚至嵌入式设备。Java 之所以脱，不仅是因为它的面向对象结构，还因为其对可读性、可靠性和移植性的强调。这些正是让
    Java 成为任何学习编程者的理想首语言的品质。


    本书首先将带你完成为操作系统下载、安装和配置 Java 开发包（`JDK`）的实际步骤。从那里开始，你将学习语言的基础——编写第一个程序、使用基础语法、理解原始数据类型、处理用户输入，并探索控制结构、操作符、字符串和数组等核心主题。


    每一章都经过精心设计，在前一章的基础上，整合了理论、带注释的代码示例、实践练习和复习题，以强化你的学习。你还会遇到真实世界的编程实践，例如调试编译时和运行时错误、遵循
    Java 编码规范，甚至使用 `JShell` 等工具进行交互式学习和实验。


    本书与不同之处在于它的教学哲学：*在实践中学习*。每个主题都是逐渐引入的，并通过即时应用进行强化，确保概念不仅仅是被记忆，而是被理解。随着你完成每一章，你将在编写简洁、逻辑清晰且结构良好的
    Java 程序方面更有信心。


    第一卷为更高级的 Java 主题奠定了基础，这些主题将在第二卷中探讨。在本书结束时，你将获得坚实的基础，为学习面向对象设计、异常处理、文件 I/O、集合和
    GUI 编程等主题做好准备——这些都将在 *Java Essentials Volume 2: Object-Oriented Programming and
    Beyond* 中涵盖。


    感谢选择这本书开启你的 Java 旅程。让我们一起开启第一杯 Java 咖啡吧——一次写一行代码开始。


    编码愉快！


    Michelle C. Decamora, 麻理工学院


    Lawrence G. Decamora III, 博士


    # 图书介绍


    *Java Essentials Volume 1: Programming Fundamentals* 是两部系列的第一部分，旨在向新程序员介绍 Java
    编程语言的基础。无论你是学生、有抱负的开发者，还是仅仅对编码好奇的人，本卷都将以清晰且对初学者友的方式带你了解 Java 的核心构建模块。


    在本卷中，我们首先引导你完成为不同操作系统下载、安装和配置 Java 开发包（`JDK`）的过程。随后，你将编写第一个 Java 程序，探索语言的结构和语法，并学习如何处理用户输入。我们涵盖了
    Java 的原始数据类型、操作符、控制结构，甚至深入探讨了字符串和数组——这些对于任何 Java 程序员来说都是关重要的概念。


    我们的目标是确保你通过实践方法和实际示例在 Java 上建立坚实的基础。每一章都建立在前章的基础上，创建一个平滑且逻辑清晰的学习曲线。


    虽然本卷涵盖了广泛的入门主题，但 Java 是一门巨大的语言，还有更多值得探索。*Java Essentials Volume 2: Object-Oriented
    Programming and Beyond* 将接在本书之后。在第二卷中，我们将探索面向对象编程、异常处理、文件操作、图形用户界面（GUI）以及更多将加深你理解的内容。


    感谢选择这本书作为你的学习伙伴。我们很高兴你加入这段旅程，并希望你喜欢编写第一行 Java 代码！


    让我们开始吧！


    # 谁能从这本书中受益？


    本书为完全的初学者编写——不需要任何先前的编程经验。如果你从未写过任何代码，*Java Volume 1: Programming Fundamentals*
    是完美的起点。它采用一种温和、结构化的方法向你介绍 Java，使其易于理解，并有真实示例支持。


    以下是一些能从书中受益最浅的读者：


    - 想要将 Java 作为第一门编程语言学习的有抱负的软件开发者。

    - 对编码好奇并想按自己的节奏探索 Java 的自学者和爱好者。

    - 寻求转型进入科技行业并寻求编程概念坚实基础的职业转行者。

    - 想要为初学者教授 Java 提供清晰且结构化资源的高中或大学教育者。

    - 来自其他领域（如网络、工程或 IT 支持）并希望获得编码技能以补充现有知识的技术专业人士。

    - 参加了介绍性编程课程的学生，他们需要一个全面的、对初学者友好的 Java 参考。


    无论你是在自学、在教室里还是作为培训计划的一部分阅读这本书，它都旨在帮助你像程序员一样思考。示例、练习和解释都是为了让学习体验尽可能亲切和实用。


    如果你准备好构建你的第一个 Java 应用程序并理解代码背后的逻辑，那么这本书就适合你。


