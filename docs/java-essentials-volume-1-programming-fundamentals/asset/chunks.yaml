  trans: "\n\n在行业内，Decamora 博士曾与 Sun Microsystems Philippines、Phoenix One 和 ActiveLearning\
    \ Inc. 等领先机构合作，提供 Java 培训和软件开发解决方案。他的专业知识涵盖 Java 编程、企业级应用和 Web 技术。\n\n除了教学之外，Decamora\
    \ 博士还是备受期待的演讲者和培训师，曾举办过 Java 编程、软件工程和新兴技术的研讨会和工作坊。他对知识分享的热情体现在通过实用的见解和现实应用赋能学习者的承诺中。\n\
    \n这本书证明了他让各水平的学习者都能轻松上手 Java 的心血。通过清晰的解释和实操示例，Decamora 博士继续激励和引导下一代开发者。\n\n![](img/img-ix.jpg)\
    \ \n\n**Michelle C. Decamora**（麻省理工学院）是一位敬业的教育者和丰富的 IT 专业人士，热衷通过知识和实践学习赋能学生。她拥有信息技术硕士学位和丰富的教学经验，在计算机教育领域做出了巨大贡献。\n\
    \nMichelle 曾在多家知名机构担任信息技术教师，包括 CIIT 艺术与技术学院和圣本尼德莱萨尔学院。她对学术卓越的追求延伸至教室之外，此前曾在 Malabon\
    \ 的系统技术学院（STI）担任学术主管和负责人等领导职务，在那里她监督教职员工、开发课程并确保学术质量。\n\nMichelle 在数据库管理、Java\
    \ 编程和应用开发方面的专业知识使她对 IT 的理论和实践方面都有全面的理解。\n\n除了教学工作外，Michelle 还参加了许多专项培训计划，包括 IBM\
    \ DB2 学术培训、带色彩渲染的 AutoCAD 以及高级 Macromedia Flash 应用开发。她对持续学习的执着赢得了广泛认可，包括 DB2 数据库和应用基础的\
    \ IBM 认证学术助理。\n\n作为本书的合著者，Michelle 分享了丰富的知识和实战见解，引导学习者开启 Java 编程之旅。她合作式的教学方法和对促进学生成长的热情使成为这一教育资源不可或缺的贡献者。\n\
    \n# 专家如何评价这本书！\n\nLawrence Decamora 编写了一本结构极其良好的 Java 编程入门书籍，在拥挤的编程教科书中脱颖而出。作为一名教育工作者，这本书从基础概念到实际应用的周全递进给我留下了深刻印象。\n\
    \n这本书的独特价值之处在于其“边学边练”的哲学。Lawrence 并没有用抽象的理论淹没初学者，而是引导读者通过实践经验逐步建立信心。引入 `JShell`\
    \ 进行交互式学习是神来之笔，反映了现代教学的最佳实践。\n\n书涵盖范围非常全面——从跨多个操作系统的 `JDK` 安装到控制结构、数组和字符串处理等核心编程概念——为学生奠定了坚实的基础。每一章的构建都非常仔细，配有练习、测验和编码任务，确保了概念不仅仅是被背诵，而是被真正理解。\n\
    \nLawrence 对现实编程实践（包括调试技术和编码规范）的强调，为学生从事实际开发工作做了准备，而不仅仅是学术练习。清晰的写作风格和逻辑进展使得复杂的概念对初学者来说易懂，同时保持了深度学习所需的深度。\n\
    \n这一卷为第二卷中涵盖的高级主题奠定了基础，对于教育机构和自学者来说都是极佳的选择。\n\n– David Smith，Silicon Valley High\
    \ School, Inc.  执行官\n\n作为一个近距离观察过 Lawrence 教学风格的人（特别是我们一起为 `LearningWhilePracticing`\
    \ 制作按需 Java 课程时），我对这本书如此清晰、结构化且在教学法上如此强大并不感到意外。同样的清晰度和实践思维完美地转化到了纸面上。解释精确且不晦涩，节奏感也恰到好处。概念逐渐引入，每一章都在前一章的基础上逻辑地构建。在每个章节末尾加入章节总结、测验和编码任务是强化学习的绝佳方式。\n\
    \n结构非常棒。从安装 `JDK` 到理解数组，内容准确涵盖了初学者获得信心所需的全部内容。它还超越了简单的“Hello World”基础，包含了至关重要的现实世界元素，如调试、`JShell`、`Scanner`\
    \ 类和字符串处理——同时保持了内容的易读性。关于 Java 控制结构和原始数据类型的章节真的非常引颖。。它们在理论和应用之间取得了完美的平衡，特别是在强调编码规范和可读性方面。此外，“边学边练”的方法不仅是一种哲学——它植根于书的基因之中。\n\
    \n– Joe Ghalbouni，Learning While Practicing 创始人\n\n# 目录\n\n- 0 下载、安装和配置 Java 开发工具包\
