    对于 `null`、`true` 和 `false`，它们**不是** Java 关键字。它们是“字面量值”。


    字面量值是你可以赋值给变量的值。`null` 值可以赋值给引用数据类型变量，而 `true` 和 `false` 是 `boolean` 变量的可能取值。


    ### 3.4.1 两个特殊关键字


    `const` 和 `goto` 关键字被视为“特殊关键字”。这些是 Java 关键字，但不允许在编码中使用。Java 编程语言中没有这些关键字的实现，但
    Java 的创建者决定将它们视为保留关键字，以便在未来的 Java 版本或其他类似技术中，`const` 和 `goto` 可能不再被使用。


    ### 3.5 Java 编程语言编码规范


    #### 3.5.1 包


    包名通常使用小写字母，通常是你的应用程序的反向 URL。正如我们在上一章中讨论的，包的布局通常是你的目录结构。这是一个包的示例：


    `com.myapp.domain;`


    #### 3.5.2 类、接口和枚举类型


    对于类、接口和枚举类型，我们通常使用 CLC，或“大写-小写-大写”命名法。标识符名称以大写字母开头，后跟小写字母。如果有后续单词，则将该后续单词的首字母大写。以下是一些类、接口和枚举类型的名称示例：


    `TestPerson`, `Flyer`, `BankAccount`, `MonthsOfTheYear`


    #### 3.5.3 方法和变量


    方法名示例：

    `getName()`, `setName()`, `addButton()`


    变量名示例：

    `name`, `age`, `finalGrade`


    方法和变量使用驼峰命名命名法（camelback）。C/C++ 开发者通常使用驼峰命名法来编写方法和变量。


