    通过在代码开头导入 `java.util.Scanner`，就可以访问 `Scanner` 类。一旦导入，你就可以创建一个 `Scanner` 对象来读取输入。例如，`sc.next()`
    用于获取单个单词输入，而 `sc.nextLine()` 处理整行文本，适用于读取带有空格的名称。对于数值输入（如 `age`），`sc.nextInt()`
    方法是理想的选择，你可以使用 `System.out.println()` 轻松地显示结果。在输入处理完成后，重要的是使用 `sc.close()` 关闭
    `Scanner` 对象以防止资源泄漏。以下是一个简单的 Java 程序示例，该程序读取用户的姓名和年龄，并打印一条包含其明年年龄（增加一岁）的消息。


