    The eight primitive data types can be further classified as follows:


    ### 1. Integral data types

    These contain whole number values and may have both negative and positive values,
    including zero (`0`). The following are types of integral data types:


    a. `byte` – an 8-bit data type, legal values may range between -2⁷ to +2⁷-1 or
    -128 to +127


    b. `short` – a 16-bit data type, legal values may range between -2¹⁵ to +2¹⁵-1
    or -32,768 to +32,767


    c. `int` – a 32-bit data type, legal values may range between -2³¹ to +2³¹-1 or
    -2,147,483,648 to 2,147,483,647


    d. `long` – a 64-bit data type, legal values may range between -2⁶³ to +2⁶³-1
    or -9,223,372,036,854,775,808 to -9,223,372,036,854,775,807


    Table 3.2 Memory sizes of integral data types


    | Integer Length | Name or Type | Range |

    | --- | --- | --- |

    | 8 bits | `byte` | -2⁷ to 2⁷-1 |

    | 16 bits | `short` | -2^(15) to 2^(15)-1 |

    | 32 bits | `int` | -2^(31) to 2^(31)-1 |

    | 64 bits | `long` | -2^(63) to 2^(63)-1 |


    Among the four, `int` is the default integral data type. This means that if you
    see a whole number value without any declaration, either a negative or a positive
    value, it is safe to assume that it is an `int`.


    The default number format is base 10 (decimal). For other number formats, the
    following syntax must be followed:


    ![](Images/img-100.jpg)


    ![](Images/note.png) Note


    Java SE 7 and newer versions offers the following added features:


    - The underscore (`_`) can now be used as a part of the literal value of Java
    SE 7.

    - The binary (base 2) format was also introduced in Java SE 7. A binary value
    can be written by prefixing a series of binary numbers (1’s and 0’s) with `0B`
    or `0b`, like `0b0100`.


    ### 2. Floating Points

    As for fractional values, you have two data types. You have the `float` data type
    and the `double`.


    a. `float` – 32 bits

    `1.23f`, `-5.14F`


    b. `double` – 64 bits

    `3.14`, `5.10D`, `-0.012d`, `1.23456e-2`


    Table 3.3 Memory sizes of floating-point data types


    | Float Length | Name or Type |

    | --- | --- |

    | 32 bits | `float` |

    | 64 bits | `double` |


    The `double` data type is the default data type for fractional values, which means
    that if you see a fractional value that has no data type declaration, it is safe
    to assume that it is a `double` value. A `double` data type occupies 64 bits of
    memory space, while a `float` only occupies 32 bits of memory space. Either a
    capital ‘F’ or a small ‘f’ at the end of a fractional value must be included as
    a suffix.


    Table 3.4 Sample of floating point values


    ![](Images/tbl3-4.jpg)


    A `double` value can also include a ''D'' or ''d'' as a suffix. Although it’s
    not needed, it can still be placed there if you want to declare it for readability
    purposes only.


    ### 3. Textual Type

    A textual data type is used to store a single 16-bit Unicode character, allowing
    it to represent a wide range of symbols, letters, and digits from various languages,
    not just the ASCII set.


    a. `char` – 16 bits

    `''a''`, `''\t''`, `''\u0061''`


    There are three ways to declare a character, but either way, a `char` must be
    inside a pair of single quotes. You can put any Unicode value, an escape sequence
    character, or a Unicode notation inside a pair of single quotes to represent a
    character value. The Unicode notation is prefixed with `\u` character followed
    by hexadecimal numbers.


    Table 3.5 Sample Representation of `char` Values


    ![](Images/tbl3-5.jpg)


    ### 4. Logical Type

    It is used to represent true or false values. This type is essential for making
    decisions in a program, especially in conditions and control structures.


    a. `boolean`


    A `boolean` primitive data type can only have two possible values; it can either
    have a true or a false value. A common mistake by newbies, especially if they
    have a C programming background, is that they think that a `boolean` data type
    has a numeric equivalent.


    Take a look at this snippet:


    ```java

    boolean doorIsOpen = false;


    // I want to open the door,

    doorIsOpen++; // incompatible types

    ```


    You cannot increment the value of `doorIsOpen` by one. In other programming languages
    like C, a `boolean` data type is declared as an `int` and can be incremented or
    decremented. In Java, to toggle a `boolean` value, we can use the `boolean` toggle
    operator (`!`), which turns a true value into a false one and vice versa. This
    is the correct version:


    ```java

    boolean doorIsOpen = false;

    ```

