      k  = Became reserved or a keyword in the version


    As for null, true, and false, they are **NOT** Java keywords. They are “literal
    values”.


    Literal values are values that you can assign to a variable. A null value can
    be assigned to a reference data type variable, while true and false are possible
    values of a boolean variable.


    3.4.1 Two Special Keywords


    The keywords const and goto are considered “special keywords”. These are Java
    keywords, but are not allowed to be used in coding. There are no implementations
    of these keywords in the Java Programming Language, but the Java creators decided
    to consider them as reserved keywords so that in future releases of Java or other
    similar technologies, const and goto may not be used anymore.


    [3.5 Java Programming Language Coding Conventions](#07_Contents.xhtml_chhead33)


    3.5.1 Packages


    Packages are normally written in small letters, and it is usually the reverse
    URL of your application. As we have discussed in the previous chapter, the package
    layout is usually your directory structure. Here’s an example of a package:


    com.myapp.domain;


    3.5.2 Classes, Interfaces, and enum Types


    As for classes, interfaces, and enum types, we normally use the CLC, or the Capital-Lower-Capital
    naming convention. The identifier name starts with a capital letter, followed
    by lowercase letters. If there is a succeeding word, then you capitalize the first
    letter of the succeeding word. Here are some examples of names of classes, interfaces,
    and enum types.


    TestPerson, Flyer, BankAccount, MonthsOfTheYear


    3.5.3 Methods and Variables


    Example of method names:


    getName(), setName(), addButton()


    Example of variable names:


    name, age, finalGrade


    Methods and variables use the camelback naming convention. C/C++ developers normally
    use camelback as a way to write methods and variables alike. You start your identifier
    name with a small letter, and if you need to use another word, you capitalize
    the first letter of the succeeding word. A method should have a pair of parentheses
    at the end, and it may or may not include parameters inside the parentheses.


    3.5.4 Constants


    Examples of constants include:


    STUDENT_NUMBER, SPEED_OF_LIGHT,


    PI, PULL_OF_GRAVITY


    Constants are declared in ALL CAPS. An identifier that is written in all capital
    letters normally represents a final variable, also known as a constant identifier.
    In the event that your constant identifier is composed of multiple words, you
    separate these words with an underscore (_) symbol.


    Here’s how we write them properly in Java using the final keyword:


    final int STUDENT_NUMBER = 50;


    final double SPEED_OF_LIGHT = 299792458; // in m/s


    final double PI = 3.141592653589793;


    final double PULL_OF_GRAVITY = 9.80665; // in m/s^2


    3.5.5 Control Structures


    for (int i = 0; i < 5; i++){


    // do something


    }


    Control Structures like if-else, switch-case, do-while, while, and for-loop are
    usually followed by a block or a scope that is enclosed in a pair of curly ({})
    braces. We use white spaces such as tabs, spaces, and enter keys to make our control
    structure codes more readable. The actual discussion on these control structures
    will be discussed in [Chapter 5](#32_Ch05.xhtml_ichhead46).


    3.5.6 Spacing and Indentations


    As for the spacing of your code, we encourage using two to four spaces as an indentation
    if your code is inside a pair of curly braces. This way, at one glance, you will
    have an idea of which lines of code are inside the curly braces, which is normally
    called your code block. These spaces are used only for readability, as spaces
    are ignored by Java.


    Also, we encourage using one statement per line, terminated by a semicolon (;).
    Semicolons are mandatory to end a Java statement. Having multiple statements in
    a single line, even if coded properly, can sometimes cause confusion at a glance.
    To avoid this, a single statement terminated by a semicolon per line is always
    the best way to go.


    3.5.7 Comments


    Putting the comments described in section 3.1 in your code is a good programming
    practice for documentation purposes. Both single-line and multi-line comments
    are beneficial to insert your human-formatted thoughts into your Java code.


    On top of that, JavaDoc comments can do much more. After including all the descriptions
    you included in your code, and after the coding and testing processes, you can
    start building your documentation by harnessing the power of your IDE and choosing
    the option “Generate Java Doc” for the NetBeans IDE. This will automatically read
    the JavaDoc comments you placed inside your code and translate them into an HTML
    format that you can also send as technical documentation.


    Following these conventions will allow you and your colleagues to work better
    by allowing you to write code that is readable and well-documented.


    [3.6 The Primitive Data Types](#07_Contents.xhtml_chhead34)


    There are eight primitive data types**. Primitive data types** are the most basic
    types of data that represent simple values directly in memory. They are predefined
    by the language and are not objects. These types are the building blocks for data
    manipulation in Java. The eight primitive data types are as follows: byte, short,
    int, long, float, double, char, and boolean.


    Data types that are not a part of the eight primitive data types are considered
    **reference data types**. In Java, reference data types are types that store references
    (or memory addresses) to the actual data rather than the data itself. They include
    objects, arrays, and interfaces. Unlike primitive data types that hold their values
    directly, reference types point to locations in memory where the data resides.
    More discussion about reference data types will be covered in *Java Essentials
    Volume 2: Object-Oriented Programming and Beyond*.'
