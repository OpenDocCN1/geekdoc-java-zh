    嵌套 if 条件是指位于另一个 if 条件内部的 if 条件。尝试分析以下给定的语法：


    ![](img/img-154.jpg)


    如上例所示，在代码中添加空格（空格、制表符和回车键）无疑会提高代码的可读性。


    首先评估 `outer-if-condition`，如果它返回真值，则执行 `outer-if-block`，在该作用域内，你将遇到 `inner-if-condition`。如果
    `inner-if-condition` 也返回真值，那么 `inner-if-block` 也会被执行。如果任何条件返回假值，则预期将执行对应的 `else`
    语句。在每个 `if` 块和 `else` 块中提供缩进可以提高代码的可读性。


    ![](img/img-155.jpg)


    在这个示例中，语句 1 和 2 返回真值；因此，语句 3 将执行。但更显而易见的问题是：我将如何知道哪个 `else` 语句与哪个 `if` 连接的？


    答案是……`else` 与 `if` 匹配规则是：`else` 总是引用最近的 `if`，且该 `if` 未关联另一个 `else` 子句。


    考虑以下内容：


    ![](img/img-156a.jpg)


    你如何知道哪个 `else` 子句对应哪个 `if` 语句？根据规则，“一个 `else` 总是引用最近的未关联另一个 `else` 子句的 `if`”。因此，`else`
    子句与第 2 行对应。


    无论缩进如何，规则保持不变。


    ![](img/img-156b.jpg)


    语句 3 仍然对应语句 2。一旦你对它们进行了分组，关联关系发生变化，就像在这个示例中：


    ![](img/img-156c.jpg)


    现在 `else` 语句对应语句 1。


    当编译器看到一个 `else` 语句时，它会与离它最近且尚未关联 `else` 的之前的 `if` 语句配对。这一规则有助于避免嵌套条件语句中的歧义。


    ![](img/img-157a.jpg)


    第二个 `if (x < 10)` 是离 `else` 最近的 `if`。`else` 与 `if (x < 10)` 配对，因为第一个 `if (x >
    10)` 已经关闭，不影响配对。当 `x = 5` 时，输出为：“x is less than 10”（来自第二个 `if`），因为该条件为真。`else`
    被忽略，因为它只在 `if (x < 10)` 为假时运行。


    这这条规则在处理嵌套或复杂的条件逻辑时尤为重要。如果你不显式地使用大括号 `{}`，可能很难确定哪个 `if` 和哪个 `else` 配对。为了避免混淆，良好的做法是始终使用大括号（即使是单语句块），或者使用正确的缩进。


    ![](img/img-157b.jpg)


    `else` 与最近的未匹配的 `if` 配对，即 `if (y > 5)`。


    当 `y = 15` 时，条件 `y < 10` 为假，因此内部的 `if` 和 `else` 被完全跳过，没有输出。


    通过理解这一规则，你可以在 Java 中编写更具预测性和更准确的 if-else 结构。


