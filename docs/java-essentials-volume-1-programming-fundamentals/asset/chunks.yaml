    3. Polymorphism: is another process that will allow you to change the method implementation
    during runtime by having a certain declared type of class and implementing the
    methods of the subtype (subclass), also known as Virtual Method Invocation (VMI).
    A discussion on classes and VMI will be made available in *Java Essentials Volume
