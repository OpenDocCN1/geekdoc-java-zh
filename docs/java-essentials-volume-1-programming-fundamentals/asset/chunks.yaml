    弹出一个窗口，显示消息“安装程序正在尝试安装新软件”。你可以输入密码允许继续，或者使用你已注册的指纹（这将自动输入管理员登录名和密码），然后点击 `Install
    Software` 继续安装过程。


    图 0.8 使用密码或 Touch ID 继续安装向导


    ![](img/fig0-8.jpg)


    软件将将进行安装，完成后会弹出一个确认窗口。


    图 0.9 安装成功


    ![](img/fig0-9.jpg)


    安装过程完成后，系统会询问你是否希望将安装程序保留在磁盘上，或者将其移动到废垃圾桶并在稍后永久删除。通过这样做，你可以节省磁盘空间。


    图 0.10 JDK 安装程序 - 保留或移动到废垃圾


    ![](img/fig0-10.jpg)


    要测试你的编译器并检查编译器的版本，请在终端窗口中输入（不包含 % 符号）：`javac -version`。


    图 0.11 Mac OS Finder 窗口 - 检查 javac 命令


    ![](img/fig0-11.jpg)


    要测试你的 Java 运行时命令，请输入（不包含 %）：`java -version`


    图 0.12 Mac OS Finder 窗口 - 检查 Java 命令


    ![](img/fig0-12.jpg)


    这两个命令都将显示 Java 编译器和 Java 运行环境的版本。在 Mac OS 环境下安装 JDK 应该非常简单。在大多数情况下，它很少或不需要配置。


    ## 0.4 为你的 Windows 操作系统安装 JDK


    按照以下步骤为你的 Windows 操作系统安装 JDK。


    ### 0.4.1 检查 Windows 操作系统的 JDK


    要检查 Windows 系统是否已预安装了 JDK，请尝试按下 Windows 键并输入 `CMD` 来打开命令提示符。在命令提示符中，如下所示在提示符处输入
    `javac`。


    图 0.13 Windows 命令提示符 - 检查 javac 命令


    ![](img/fig0-13.jpg)


    如果显示无法识别 `javac` 命令，那么你可能需要在 Windows 系统上启动 JDK 的下载、安装和配置过程。


    ### 0.4.2 下载适用于 Windows 操作系统的 JDK


    在 Google 上搜索：`JDK download`，如下图所示。


    图 0.14 待下载的最新 JDK 安装程序的 Google 截图


    ![](img/fig0-14.jpg)


    Google 和 Google Logo 是 Google LLC 的商标。


    点击与你的搜索相关的第一个 Oracle 网站链接。最好从源头（官方 Oracle 网站）获取 JDK。


    图 0.15 Windows 系统可用的 JDK 安装程序


    ![](img/fig0-15.jpg)


    从选项（Linux, Mac OS, Windows）中选择 `Windows`。如果你使用的是基于 Intel 的机器，请选择 `x64 Installer`。下载的安装程序将保存在
    Downloads 文件夹中，如下所示。


    图 0.16 Downloads 文件夹内的 JDK 23 Windows 安装程序


    ![](img/fig0-16.jpg)


    ### 0.4.3 在 Windows 操作系统中安装 JDK


    下载好 JDK 后，请确保你拥有在 Microsoft Windows 上安装 JDK 的管理员权限。你可以通过双击安装程序来启动安装过程。这将启动 JDK
    安装向导，如下所示。


    图 0.17 JDK 23 Windows 安装程序安装向导


    ![](img/fig0-17.jpg)


    如果这是你第一次安装 JDK，最好按照安装向导提供的默认值，一直点击 `Next` 直到安装完成。安装完成后，你可以检查 `Program Files\Java`
    文件夹，你会发现创建了一个 `jdk-<version>` 文件夹。在这种情况下，由于我们安装的是 JDK 23，你将看到 `jdk-23` 文件夹。


    ### 0.4.4 为 Windows 系统配置 JDK


    安装成功后，下一步是在你的 Windows 操作系统上配置以下环境变量。这些是以下环境变量：`CLASSPATH`、`JAVA_HOME` 和 `Path`。


    Windows 系统中的 `CLASSPATH` 是一个环境变量，告诉 Java 虚拟机 (JVM) 和 Java 编译器在运行 Java 程序时去哪里查找自定义类和包。它指定了包含应用程序所需的编译
    Java 类的目录或 JAR 文件。要开始设置环境变量，打开资源管理器并右键点击左侧面板上的`此电脑`。


    图 0.18 资源管理器


    ![](img/fig0-18.jpg)


    选择 `Properties`（属性）选项。这将打开你 Windows 环境的 `System Properties`（系统属性），如下所示。


    图 0.19 属性窗口


    ![](img/fig0-19.jpg)


    选择 `Advanced system settings`（高级系统设置）。


    图 0.20 系统属性窗口


    ![](img/fig0-20.jpg)


    选择 `Environment Variables`（环境变量）。


    图 0.21 环境变量窗口


    ![](img/fig0-21.jpg)


    点击 `System variables`（系统变量）下的 `New…` 按钮，这样就可以开始添加如 `CLASSPATH` 和 `JAVA_HOME` 等新环境变量。


    在 `Variable Name`（变量名）中输入：`CLASSPATH`，然后在 `Variable Value`（变量值）中输入 `.`（仅有点），如下所示。点击
    OK 关闭窗口。


    图 0.22 环境变量窗口 - 输入 CLASSPATH


    ![](img/fig0-22.jpg)


    接下来，我们将设置 `JAVA_HOME`。按照相同的步骤，在系统变量下点击 `New…` 按钮，添加 `JAVA_HOME`，如下所示。


    图 0.23 环境变量窗口 - 输入 JAVA_HOME


    ![](img/fig0-23.jpg)


    为了减少输入任何值错误的可能性，最好从源处复制它。


    图 0.24 资源管理器 - Java 文件夹


    ![](img/fig0-24.jpg)


    设置 `CLASSPATH` 和 `JAVA_HOME` 后，是时候编辑 `Path` 了。


    这次，在系统变量下，不要选择 `New…`，而是选择 `Edit…`。这将打开环境变量窗口，如下所示。点击窗口左侧的 `New` 按钮，然后输入内容：`%JAVA_HOME%\bin`。确保你输入的文本中没有额外的空格。之后，按
    OK 关闭窗口。


    图 0.25 环境变量 - 编辑 Path


    ![](img/fig0-25.jpg)


    `%JAVA_HOME%\bin` 是 Windows 中用于引用 Java 安装目录下 bin 目录的路径表示。


    - `%JAVA_HOME%`: 这是一个指向 Java 开发工具包 (JDK) 安装根目录的环境变量。它通常包含 Java 安装路径（例如 `C:\Program
    Files\Java\jdk-23`）。

    - `bin`: Java 安装目录下的 bin 文件夹包含重要的 Java 可执行文件，如 `java`（Java 运行时）、`javac`（Java 编译器）以及其他工具如
    `jshell`。


    ### 0.4.5 在你的 Windows 上测试 JDK


    关闭所有现有的命令提示符；你不需要它们。你需要打开一个新的，以便在 Windows 操作系统上新添加的环境变量生效。让我们打开一个新的命令提示符并如下所示输入
    `javac -version`。


    图 0.26 命令提示符 - 检查 javac 命令


    ![](img/fig0-26.jpg)


    这将显示你的编译器工作正常，且你的 Java 编译器版本为 23。接下来，输入 `java -version` 来测试你的 Java 运行环境，如下所示。


    图 0.27 命令提示符 - 测试 Java 命令


    ![](img/fig0-27.jpg)

