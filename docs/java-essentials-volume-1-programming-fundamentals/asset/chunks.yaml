    ## 3.2 Semicolons, Blocks, and White Spaces


    ### 1. Semicolon

    A semicolon is used by Java as a language signal that it is at the end of a statement.
    Deleting a semicolon will tell the Java compiler that the next line of your code
    is a continuation of the current line. This is a common rule for programming languages
    like `C`, `C++`, and `Java`. Other programming languages don’t require semicolons
    like `Python`, `Ruby`, or `Visual Basic`. So, if you have a programming background
    using a different programming language, be sure to include a semicolon in `Java`
    if you want to end a statement.


    ```

    int x = a + b

    + c + d;

    ```


    is the same as:


    ```

    int x = a + b + c + d;

    ```


    ### 2. Blocks

    A block, also known as a scope, is used to group related statements together.
    We use curly braces to represent a block (`{ }`). Curly braces are normally used
    on classes, methods, and control structures like `if-else`, `while` loop, `for`
    loop, etc.


    Having a block also signifies the scope of the variable.


    Consider the following program snippet:


    ![](Images/img-89.jpg)


    The given code snippet will have a compilation error on line 16 for having a duplicate
    declaration of the variable `x` that was declared in line 12. You can only declare
    a variable once inside a specific scope of code. The variable `x` declared in
    line 12 is inside the scope of the method `doSomething()`, so declaring another
    variable `x` in line 16 creates a duplicate variable declaration of the said variable
    `x`.


    But if we rewrite it this way:


    ![](Images/img-90a.jpg)


    The compilation of this sample code snippet will be ok. The first variable `x`,
    declared in line 16, will only have a life span within the `if` curly braces,
    between lines 14 to 17, and it will be destroyed after line 17. Therefore, the
    variable `x` declared on line 18 is valid, as it is treated as a new declaration
    with no duplication.


    ### 3. White spaces

    These are the spaces, tabs, and enter keys (or next line characters) in your code.
    `Java` ignores white spaces, which means any amount of white space in `Java` is
    allowed. White spaces are normally used for formatting so that your code is readable
    in the eyes of a casual reader. For example, the given sample code:


    ```

    for (int i = 0; i < 3; i++) { System.out.println(i); }

    ```


    is the same as:


    ![](Images/img-90b.jpg)


    Both codes are the same, but neither of them is pleasing to the eye. The first
    one occupied a single line of code. It can work, but your co-workers, teammates,
    or anybody who sees your code will not appreciate the way you wrote it.


    The second version is better. It uses tabs and spaces that make the code more
    readable because you can immediately identify the pairing of the begin and end
    curly braces and the code inside them.


    ## 3.3 Java Identifiers


    Identifiers are used to “identify” something. We use names or identifiers to identify
    variables, methods, classes, constant values, file names, and other coding elements.
    Think of it as a label that helps the programmer and the computer refer to specific
    parts of a program. Essentially, they serve as the customizable names we assign
    to various components to make the code readable and logical.


    Creating identifiers in `Java` requires following specific rules to ensure they
    are valid and recognizable by the compiler. These rules include:


    1. **Start with a letter or underscore**: Identifiers must begin with a letter
    (`A-Z` or `a-z`), an underscore (`_`), or a dollar sign (`$`). They cannot start
    with a digit.

    2. **Use only allowed characters**: Identifiers can contain letters, digits (`0-9`),
    underscores, and dollar signs, but no spaces or special symbols like `@`, `#`,
    or `!`.

    3. **Avoid reserved keywords**: Words that `Java` reserves as keywords, like `int`
    or `class`, cannot be used as identifiers.

    4. **Account for case sensitivity**: `Java` identifiers are case-sensitive, so
    `MyVar` and `myvar` would be treated as two different identifiers.

    5. **No length limit**: While `Java` does not impose a specific length limit,
    identifiers should be concise yet descriptive for better readability.


    Here are valid examples of `Java` identifiers:

    `Int`, `$$$`, `___`, `basic_pay`, `OverTime`, `getTaxPayer`, `thisIsAVeryLooooongVariableName`


    Here are examples of invalid `Java` identifiers:

    `int`, `123`, `---`, `gross-Pay`, `over time pay`


    For best practices, while not enforced by the compiler, the following conventions
    are widely adopted in professional `Java` development:

    - Class names: PascalCaseCase (e.g., `StudentInfo`)

    - Method and variable names: `camelCase` (e.g., `calculateSum`, `studentAge`)

    - Constants: `UPPER_CASE_WITH_UNDERSCORES` (e.g., `MAX_VALUE`)

    - Avoid using `$` or `_` unless specifically required (e.g., generated code or
    legacy codebases)


    ## 3.4 The Java Keywords


    The keywords are special reserved words that have predefined meanings and purposes
    in `Java`. They form the core syntax and structure, guiding how the code is written.
    They cannot be used as names for variables, methods, or other identifiers because
    they are essential for `Java` to perform tasks like creating loops, defining classes,
    or handling types while ensuring that code is consistent.


    ### Table 3.1 List of Java keywords added in later versions


    | # | Keyword | Java Version | Notes |

    |---|---|---|---|

    | 1 | abstract | 8 | Class modifier |

    | 2 | assert | 8 | Debugging |

    | 3 | boolean | 8 | Primitive type |

    | 4 | break | 8 | Control flow |

    | 5 | byte | 8 | Primitive type |

    | 6 | case | 8 | Switch case |

    | 7 | catch | 8 | Exception handling |

    | 8 | char | 8 | Primitive type |

    | 9 | class | 8 | Class declaration |

    | 10 | const | 8 | Reserved only |

    | 11 | continue | 8 | Loop control |

    | 12 | default | 8 | Interface/switch |

    | 13 | do | 8 | Loop |

    | 14 | double | 8 | Primitive type |

    | 15 | else | 8 | Conditional |

    | 16 | enum | 8 | Enum type |

    | 17 | extends | 8 | Inheritance |

    | 18 | final | 8 | Constant/modifier |

    | 19 | finally | 8 | Exception cleanup |

