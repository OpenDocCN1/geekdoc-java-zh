    本书旨在帮助你从零开始学习 Java 编程。内容的组织方式支持循序渐进、通过实践来掌握这门语言。以下是充分利用每个章节的方法：


    ### 1. 从基础开始

    从第 0 章开始，该章节将引导你下载并安装适用于你操作系统的 Java 开发工具包 (JDK)。这确保了你的环境从一开始就准备好进行编码。


    ### 2. 在做中学学习

    每个章节循序渐进地引入概念，并提供示例帮助你练习刚刚学的内容。务必亲自输入并运行示例代码——通过实验，理解会得更快！


    ### 3. 参考核心概念

    在整本书中，请关注以下特性：

    • 高效编码和调试技巧

    • 解释逐行逻辑的代码拆解

    • 常见陷阱，帮助你避免典型的初学者错误

    • 性的类比，帮助将抽象概念与实际场景联系


    ### 4. 经常练习

    练习是编程的关键。在进入下一个章节之前，尝试完成每个章节末尾的练习。你还可以通过修改代码示例并观察效果来不断尝试。你也可以尝试回答每个章节末尾的多选题，帮助自己评估所学内容。


    ### 5. 将其作为快速参考

    一旦完成一个章节，可以在需要复习时随时重新查看。章节结构清晰，易于找到特定主题，如原始数据类型、循环或 `Scanner` 类。


    ### 6. 在第 2 卷中进一步探索

    本卷侧重于 Java 的基础构建模块。当你准备好进入更高级的主题（如面向对象编程、异常处理、文件 I/O 和 GUI）时，请通过*Java Essentials
    第 2 卷：面向对象编程及拓展*继续你的学习之旅。


    ### 7. 不要急躁

    Java 是一门强大的语言，有许多概念需要掌握。为每个主题留出时间。重温困难章节，寻求说明并经常练习。学习编码就像学习一种新语言——通过经常接触和使用，它会变得更容易。


    ### 8. 保持好奇心

    编程不仅关乎语法，也关乎解决问题。不要只是硬记——去探索事物为什么是这样工作的。使用 `API 文档` 等外部文档，并在遇到瓶颈时与在线社区互动。


    # 第 0 章


    ## 下载、安装和配置 Java 开发工具包 (JDK)


    ![](img/obj.png) 学习目标

    • 知道哪里下载 Java 开发工具包 (JDK)

    • 安装并配置 JDK

    • 下载并安装你的文本编辑器

    • 使用 `Java Compiler` 编译示例代码

    • 运行示例代码


    在 Java 中，计数通常从零开始，因此我们的章节也从零开始是有意义的。第 0 章 标记了真正的开始：在调用第一个方法之前的准备。本章将概述学习 Java
    所需的关键软件——JDK。你将知道在哪里获取该软件，以及如何在特定的计算机（无论是 Windows 机器、Mac OS X 还是 Linux 机器）上安装和配置它。


    ### 0.1 我从哪里获取 Java 开发工具包 (JDK)](#07_Contents.xhtml_chhead2)

    要下载 Java 开发工具包 (JDK)，你可以使用搜索字符串 `jdk <version> download` 在互联网上搜索。¹ 假设你想安装 JDK
    8 版本，那么可以搜索 `jdk 8 download.`。本书涵盖了最高 JDK 23，但如果你想安装最新版本，只需在 Google 搜索标签中输入 `jdk
    download` 即可。


    对于初学者来说，最好使用最新的 JDK，但对于使用旧电脑的用户，如果你的操作系统仍使用 32 位架构（例如 Windows XP），则应该下载 JDK 1.8。查看图
    0.1 和 0.2 来了解 Google 搜索结果的样子。


    图 0.1 待下载最新 JDK 安装程序的 Google 截图

    ![](img/fig0-1.jpg)


    图 0.2 待下载特定 JDK 安装程序的 Google 截图 - JDK 1.8 安装程序

    ![](img/fig0-2.jpg)


    Google 和 Google 标志是 Google LLC 的商标。


    点击你在结果列表中看到的 Oracle® 软件链接，它会将你重定向到 Oracle 网站上的下载页面。


    对于旧版本的 JDK，你可能会被要求在 Oracle 开发者网站上注册。如果你想下载归档版本的 JDK，可能会被要求接受许可协议。你需要勾选 `Accept
    License Agreement`（接受许可协议）复选框以继续下载 JDK。


    图 0.3 Oracle 二进制代码许可协议

    ![](img/fig0-3.jpg)


    ### 0.2 为你的机器下载正确的 JDK](#07_Contents.xhtml_chhead3)

    点击复选框同意许可协议后，下一步是为你的机器选择正确的安装程序。JDK 安装程序列表遵循特定模式，这有助于帮助你选择正确的安装程序。在下方页面上，你可以选择
    Linux OS、Mac OS 或 Windows OS 的安装程序。


    图 0.4 JDK 安装程序列表

    ![](img/fig0-4.jpg)


    ### 0.3 在 Mac OS 中安装 JDK](#07_Contents.xhtml_chhead4)

    在安装 JDK 之前，你需要检查 Mac OS 的硬件要求。你可以将 JDK 安装在任何 Intel 电脑（如 iMac, MacBook Air, MacBook
    Pro）或较新的 Apple Silicon（M1, M2, M3, M4）。


    要了解你使用的 Mac OS 版本，点击屏幕左上角的 Apple 图标，然后进入“关于本机”菜单。你将看到 Mac OS 版本以及处理器类型（判断是 Intel
    还是 Apple Silicon）。


    在了解 Mac OS 版本后，你还需要确保拥有管理员权限才能安装 JDK。如果你没有安装 Mac OS，可以使用互联网上名为 *soylatte* 的 JDK
    补丁版本，或者升级你的系统。


    当你具备所有条件后，现在可以开始安装 JDK。安装 Java 开发工具包 (JDK) 时，Java 运行时 (JRE) 和 JavaFX SDK 会安装到标准目录结构中


    根据处理器，下载的文件具有以下名称之一：

    • 对于 AMD 处理器，你的 JDK 安装程序名为 `jdk-versionuupdate-macosx-amd64.dmg`。

    • 对于 Intel 处理器，你的 JDK 安装程序名为 `jdk-versionuupdate-macosx-x64.dmg`。

    • 对于 JDK 8 更新 25，安装程序文件名可能为：`jdk-8u25-macosx-amd64.dmg`（AMD）和 `jdk-8u25-macosx-x64.dmg`（Intel）。


    从浏览器的下载窗口或文件浏览器，你现在可以双击 `.dmg` 文件启动安装程序。一个访达窗口将出现，包含一个打开的盒子图标和 `.pkg` 文件名。


    图 0.5 包含 JDK .pkg 文件的 Mac OS 访达窗口

    ![](img/fig0-5.jpg)


    双击包图标启动安装程序。安装程序显示“简介界面”。只需按照说明点击“继续”并使用所有建议默认值。


    图 0.6 Mac OS JDK 安装向导

    ![](img/fig0-6.jpg)


    随后会出现“选择位置”窗口。只需使用安装向导的默认建议并点击“继续”即可。


    图 0.7 JDK 安装向导 - 选择位置部分

    ![](img/fig0-7.jpg)

