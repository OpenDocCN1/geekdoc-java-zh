    目前，`javadoc` 工具尚未完全支持如 `unnamed classes` 等预览特性，即使在 `JDK 21` 中也是如此。因此，在使用这些新的 Java
    源格式时，如果你打算从它们生成 Javadoc，建议将需要文档的代码保留在传统的命名类中。


    如果你的代码使用了模块（`Java 9` 中引入），你也可以包含特定模块的标记，例如：


    ```

    javadoc --module-path mods -d docs my.module.name

    ```


    ## 3.2 分号、块和空白区域


    ### 1. 分号

    Java 使用分号作为语言信号，表示语句的结束。删除分号会告诉 Java 编译器，代码的下一行是当前行的延续。这是 `C`、`C++` 和 `Java` 等编程语言的通用规则。其他编程语言如
    `Python`、`Ruby` 或 `Visual Basic` 则不需要分号。因此，如果你有使用不同语言的编程背景，在结束一个语句时，请务必在 `Java`
    中包含分号。


    ```

    int x = a + b

    + c + d;

    ```


    等同于：


    ```

    int x = a + b + c + d;

    ```


    ### 2. 块

    块（也称为作用域）用于将相关的语句分组。我们使用大括号 `{ }` 来表示一个块。大括号通常用于类、方法和控制结构，如 `if-else`、`while`
    循环、`for` 循环等。


    拥有块也意味着变量的作用域。


    考虑以下代码片段：


    ![](img/img-89.jpg)


    给定的代码片段会在第 16 行产生编译错误，因为重复声明了在第 12 行定义的变量 `x`。在代码特定的作用域内，你只能声明一次变量。第 12 行定义的变量
    `x` 在 `doSomething()` 方法的作用域内，因此在第 16 行声明另一个变量 `x` 会导致该变量 `x` 的重复声明。


    但如果我们这样重写：


    ![](img/img-90a.jpg)


    该示例代码片段的编译将是正常的。第 16 行声明的变量 `x` 的生命周期仅存在于 `if` 大括号内（第 14 行到第 17 行之间），并在第 17 行之后被销毁。因此，第
    18 行声明的变量 `x` 是有效的，因为它被视为一个新的声明，不存在重复。


    ### 3. 空白区域

    这些是代码中的空格、制表符和回车键（或换行符）。`Java` 会忽略空白区域，这意味着 `Java` 中允许任意数量的空白区域。空白区域通常用于格式化，以便你的代码在普通读者眼中具有良好的可读性。例如，给定的示例代码：


    ```

    for (int i = 0; i < 3; i++) { System.out.println(i); }

    ```


    等同于：


    ![](img/img-90b.jpg)


    两段代码是相同的，但它们都不美观。第一种占据了单行代码。它可以运行，但你的同事、团队成员或任何看到你代码的人都不会欣赏你的编写方式。


    第二种版本更好。它使用了制表符和空格，使代码更易读，因为你可以立即识别出起始大括号的配对以及内部的代码。


    ## 3.3 Java 标识符


    标识符用于“标识”某些东西。我们使用名称或标识符来标识变量、方法、类、常量值、文件名和其他编码元素。可以将其看作是一个标签，帮助程序员和计算机引用程序的特定部分。本质上，它们是用于分配给各种组件的可自定义名称，以使代码具有可读性和逻辑性。


    在 `Java` 中创建标识符需要遵循特定规则，以确保它们是有效的且能被编译器识别。这些规则包括：


    1. **以字母或下划线开头**：标识符必须以字母（`A-Z` 或 `a-z`）、下划线（`_`）或美元符号（`$`）开头。不能以数字开头。

    2. **仅使用允许的字符**：标识符可以包含字母、数字（`0-9`）、下划线美元符号，但不能包含空格或特殊符号如 图`、`#` 或 `!`。

    3. **避免保留关键字**：`Java` 保留作为关键字的单词（如 `int` 或 `class`）不能作为标识符。

    4. **考虑大小写敏感**：`Java` 标识符区分大小写，因此 `MyVar` 和 `myvar` 将被视为两个不同的标识符。

    5. **无长度限制**：虽然 `Java` 没有规定长度限制，但标识符应该简洁且具有描述性，以获得更好的可读性。


    以下是有效的 `Java` 标识符示例：

    `Int`、`$$$`、`___`、`basic_pay`、`OverTime`、`getTaxPayer`、`thisIsAVeryLooooongVariableName`


    以下是非效的 `Java` 标识符示例：

    `int`、`123`、`---`、`gross-Pay`、`over time pay`


    尽管编译器没有强制，但在专业的 Java 开发中广泛采用了以下约定：

    - 类名：PascalCase（例如 `StudentInfo`）

    - 方法和变量名：camelCase（例如 `calculateSum`、`studentAge`）

    - 常量：UPPER_CASE_WITH_UNDERSCORES（例如 `MAX_VALUE`）

    - 避免使用 `$` 或 `_` 除非是生成的代码或旧代码库


    ## 3.4 Java 关键字


    关键字是 `Java` 中具有预定义含义和用途的特殊保留字。它们形成了核心语法和结构，引导代码的编写。它们不能作为变量、方法或其他标识符的名称，因为它们对于
    `Java` 执行循环、定义类或处理类型等任务至关重要。


