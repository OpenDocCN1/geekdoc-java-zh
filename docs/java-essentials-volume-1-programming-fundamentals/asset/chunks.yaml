    ![](Images/fig7-3.jpg)


    All elements are initialized to zero (0) since it is the default value of an int.


    Declaring and initializing a multidimensional array is also possible this way:


    ![](Images/img-230.jpg)


    Figure 7.4 Two-dimensional array memory allocation with values


    ![](Images/fig7-4.jpg)


    Take a look at this example:


    ![](Images/img-231a.jpg)


    This is a sample of the multiplication table having 3 rows and 4 columns. As you
