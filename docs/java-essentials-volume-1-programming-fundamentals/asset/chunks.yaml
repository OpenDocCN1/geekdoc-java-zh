    In this chapter, you will explore the full range of operators available in Java,
    from basic arithmetic and assignment to more advanced constructs like logical
    operators and bitwise manipulation. You’ll learn not only how each operator works
    individually but also how multiple operators interact within a single expression.
    A central focus will be understanding Java’s operator precedence — the rules that
    determine the order in which operations are evaluated. Misunderstanding precedence
    is a common source of bugs, so this chapter will help you develop a strong grasp
    of how Java interprets expressions. By the end of this chapter, you’ll be able
    to write cleaner, more accurate code and understand the subtle behaviors of complex
    expressions with confidence.


    ## 4.1 Java Operators


    `Table 4.1` shows the complete list of Java operators. The top row has a higher
    order of precedence than the rows at the bottom.


    ### Table 4.1 List of Java operators


    | Operators | Associativity |

    | --- | --- |

    | `(<data_type>)` `[]` `.` `!` `~` unary- unary`+` `-` `-` `++` | L to R |

    | `*` `/` `%` | L to R |

    | `+` `-` | L to R |

    | `<<` `>>` `>>>` | L to R |

    | `<` `>` `<=` `>=` `instanceof` | L to R |

    | `=` `==` `!=` | L to R |

    | `&` | L to R |

    | `^` | L to R |

    | `|` | L to R |

    | `&&` | L to R |

    | `||` | L to R |

    | `<boolean_exp> ? <value_if_true> : <value_if_false>` | R to L |

    | `=` `=` `/=` `%=` `+=` `-=` `<<=` `>>=` `>>=` `&=` `^=` `|=` | R to L |


    Let us discuss how each operator works.


    ### 1. Casting `(<data_type>)`


    Data type casting in Java refers to converting one data type into another. This
    is done to make data compatible with specific operations or to match the expected
    data type in a given context. Casting can be applied to either primitive data
    types or reference types. In this section, we will first talk about casting for
    primitive types. The casting for reference data types will be discussed in Volume
    2 of this series.


    Data type casting is the process of converting a value from one data type to another,
    i.e., either widening or narrowing its declared data type. There are two ways
    to do a cast. It can be done implicitly or explicitly. Implicit casting means
    you are letting Java do the automatic cast for you. While in explicit casting,
    you are the one writing or dictating how the cast should be done.


    Implicit cast follows a certain rule. It follows the hierarchy shown in `Figure
    4.1`.


    Figure 4.1 Primitive data type hierarchy


    ![](Images/fig4-1.jpg)


    This means that, once a primitive variable undergoes an implicit cast, it gets
    promoted (or demoted) following the data type hierarchy. For example, a `byte`
    can be cast to become an `int`.


    Here’s an example:


    ![](Images/img-118a.jpg)


    If you look closely, you would potentially see the following error:


    ![](Images/img-118b.jpg)


    Notice the type of error? It says, `possible loss of precision`, which means it
    is an error that has something to do with primitive casts. If ignored, it can
    lose its precision. The error occurs because in Java, arithmetic operations like
    addition `(b1 + b2)` are automatically promoted or upcast to an `int` even if
    the operands are declared as `byte`. In line 5 and in line 6, both `b1` and `b2`
    were declared as `byte`. However, when it reached line 7, it caused an error because
    `b1` and `b2` were implicitly (automatically) cast before the addition took place
    in line 7. At this point, you are actually adding an `int` and an `int` and attempting
    to store them inside a `byte`. Java promotes `byte` to `int` implicitly in any
    mathematical operation, in this case, the addition operation; thus, the error
    possible loss of precision occurred.


    So, instead of doing it the following way:


    ```java

    byte b3 = b1 + b2;

    ```


    It should be done this way:


    ```java

    byte b3 = (byte)(b1 + b2);

    ```


    Try recompiling this code and running it, you should have no problems anymore.


    Explicit casting was applied in `byte b3 = (byte) (b1 + b2)`. Explicit casting
    requires manual intervention because it involves converting a larger data type
    into a smaller one. Since there is a possibility of losing information or precision,
    you must explicitly specify the type to which you want to convert.


    What happened here is that `b1` and `b2` were declared as `byte`, and before you
    can join two variables together via a mathematical operator, they need to be in
    their default data type. This means that before `b1` is added to `b2`, `b1`, which
    is a `byte`, will then be upcasted automatically to an `int`. After which, `b2`
    will follow the same pattern. Only when both `b1` and `b2` are of type `int` can
    you add up their values.


    In conclusion, data type casting in Java is a fundamental concept that ensures
    compatibility between data types during operations, especially between smaller
    and larger primitive types. Understanding when and how to use implicit and explicit
    casting is essential to avoid common errors like “possible loss of precision,”
    which often arise during arithmetic operations involving `byte`, `short`, or `int`.


    ### 2. The `[]` Index Operator


    In Java, `[]` is used to access specific elements in an array. For instance, if
    you have an array:


    ```java

    int[] numbers = {10, 20, 30};

    ```


    You can retrieve the second element using `numbers[1]`, which returns `20`. This
    same concept applies to `String[] args`.


    ### 3. The `.` Operator


    The `.` operator is used to call instance members of an object. Let’s say we have
    a `Person`:


    ```java

    Person p = new Person();

    ```


    ![](Images/img-120a.jpg)


    In the example below, we use the dot operator to call instance method.


    ### 4. The boolean `!` Operator


    This operator is used to negate (or toggle) a boolean value. Here’s a sample code
    snippet.


    ```java

    boolean isOpen = true;

    System.out.println(!isOpen);

    ```


    Output:

    false


    ### 5. The Binary Toggle `~` Operator


    In many computing scenarios, it’s important to understand how decimal values are
    represented in binary. This is especially useful when dealing with low-level operations
    such as bitwise manipulation, setting or clearing flags, or understanding how
    data is stored in memory. For example, suppose we want to toggle specific bits
    in a number or simply observe its binary representation. To do that, we first
    need to convert the decimal to binary.


    First, change the decimal value to its binary equivalent. In decimal (base 10)
    format, you have:


    1357


    In binary (base 2) format, you have:


    ![](Images/img-121a.jpg)


    `~1357` will toggle all the binary bits, all 1’s will be 0’s, and all 0’s will
    be 1’s.


    ![](Images/img-121b.jpg)


    After toggling all binary bits, convert them back to their decimal format.


    `~1357 = -1358`


    ### 6. Pre or Post-Increment `++` Operator


    This operator increments the value of the variable by 1, the only difference is
    the timing. Pre increment `(--a)` will increment the value first, then you can
    use the incremented value afterwards, while post increment `(a++)` will allow
    you to use the original value first, after using the original value, you increment
    it by 1.


    ```java

    int a = 0, b = 0;

    System.out.println("a = " + ++a);

    System.out.println("b = " + b++);

    System.out.println("a = " + a);

    System.out.println("b = " + b);

    ```


    Output:

    a = 1

    b = 0

    a = 1

    b = 1


