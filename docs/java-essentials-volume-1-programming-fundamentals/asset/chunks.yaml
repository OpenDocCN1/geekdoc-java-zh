    ## 1.3 JDK 与 JRE


    JDK，或 Java 开发包，是所有 Java 开发者都应该在机器上安装的程序。它包含了 Java 编译器、Java-Doc 创建器、实用软件、性能分析器以及你的
    Java 运行环境 (`JRE`)。


    图 1.8 JDK 和 JRE 的关系


    ![](img/fig1-8.jpg)


    JRE，或 Java 运行环境，是 Java 技术应用程序用户需要安装的解释器。顾顾义，它包含了本质的核心库和其他组件。它还包含了你的 Java 虚拟机接口
    (`JVM`) 和你的应用程序编程接口 (`API`)。它是普通用户为了使用和运行基于 Java 的应用程序可能安装的最小配置。它不支持开发，但对于执行编译后的
    Java 程序已经足够。接下来的章节将详细介绍 JRE。


    ## 1.4 Java 运行环境 (JRE)


    Java 运行环境包含两个主要组件：


    1. Java 虚拟机 (`JVM`) 和

    2. 应用程序编程接口 (`API`)


    在其他编程语言中，`API` 可以被认为一组预创建的代码或库，允许程序员或开发者复用并扩展其功能。


    每当你运行一个应用程序时，你都在执行 Java 运行环境。这意味着你实际上是在操作系统之上启动了 `JVM`，以便你的有效 `*.class` 文件现在可以被解释了。另一方面，你的
    `API` 提供了程序在运行时所需的所有标准库。访问此标准 `API` 的方式在所有平台上都是相同的。


    在下载你的 `JRE` 之前，你需要先知道你正在使用什么类型的操作系统。每个操作系统都有唯一的 `JRE`，但这些 `JRE` 的 `API` 实现是相同的。


    ### 1.4.1 Java 虚拟机 (JVM)


    顾其名，Java 虚拟机是一种用于读取 Java 字节码的虚拟机。该虚拟机位于操作系统之上并解释编译后的 Java 应用。


    Java 虚拟机（也称为 `JVM`）可以读取编译后的字节码，这些字节码嵌入在你的 `*.class` 文件或 `*.jar` 文件（`JAR` 是 Java
    档的缩写）中。你的 Java 字节码确保了你运行的 `*.class` 文件来自有效的编译过程。


    `JVM` 还可以进行自定义。某些公司倾向于定制自己的 `JVM`；Oracle 软件允许这样做，只要该 `JVM` 的实现可以运行任何有效的 `*.class`
    文件并获得 Oracle 软件的批准。


    编译器检查对象的大部分类型，但代码中仍有一些部分应该在运行时进行检查。这使得 Java 具有动态性，能够在运行时检查和评估形式和类型。


    `JVM` 可以在多个运行环境中执行。你只需要为你的操作系统下载正确的 Java 运行环境 (`JRE`) 即可。


    ## 1.5 垃圾回收器


    垃圾回收是在程序运行期间释放程序不再需要的内存空间的过程。在某些其他编程语言中，编写释放内存的代码是程序员的工作。


    垃圾回收或内存释放是垃圾回收器的工作。垃圾回收器 (`GC`) 是一个系统级线程，在 `JRE` 运行期间一直会在后台运行。`GC` 跟踪并监控内存中创建的对象；如果对象不再被引用或不再使用，它现在就准备好进行垃圾回收了。在操作系统的信号下，`GC`
    运行并清理对象占据的内存空间，从而释放其他对象以后可以使用的资源。


    图 1.9 垃圾回收器 (GC)


    ![](img/fig1-9.jpg)


    `GC` 的实现在不同平台上有所不同。由于它是一个系统级线程，操作系统的线程调度程序决定了 `GC` 何时运行。你可以通过执行 `System.gc()`
    方法将 `GC` 设置为可运行，但此方法调用并没有强制 `GC` 运行，它只是让处于可运行状态。


    可运行状态是线程处于就绪的状态；并不意味着它正在运行。


    ## 1.6 Java 处理代码安全执行的三项任务


    Java 通过三个关键步骤确保代码安全：


    1. 类加载：仅从受信任源加载代码，以防止授权或有害代码运行

    2. 字节码验证：检查代码的违规情况或错误

    3. 解释：解释器通过在受控环境中管理来安全地运行代码


    ### 1.6.1 类加载


    类加载器加载应用程序所需的所有类。它通过将本地文件系统（FAT, UFS, NTFS, ZFS）的类与从网络资源导入的类空间分开增加了安全性。由于类加载器的存在，Java
    运行环境不需要了解文件系统。这限制了恶意软件或脚本渗透你的机器，因为本地类总是先加载。在所有类加载之后，内存布局紧随其后。


    ### 1.6.2 字节码验证


    你的 Java 源文件 (`*.java`) 编译后将生成一个包含 Java 字节码的类文件 (`*.class`)。


    `JVM` 让你的类文件通过字节码验证器，以确保你编译的 Java 代码符合 Oracle 软件设置的 JVM 规范。它还确保你的类文件是有效 Java 编译的产物。


    字节码验证器确保你的代码遵守 JVM 规范，并且通过检查常见的导致不可预测行为或有时导致数据损坏编程错误，防止违反系统完整性。字节码验证器正在检查的这些行为包括数组限制、未初始化引用的使用以及代码中可能发生的非法数据转换（例如指针值到整数值以及反之）。


    JVM 在执行之前会验证所有字节码；这种验证由三类检查组成：


