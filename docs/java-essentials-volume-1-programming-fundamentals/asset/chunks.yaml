    那么，右移 `无符号右移 `>>>` 运算符的区别是什么？区别在于对负数的处理。在 Java 中，负二进制数使用补码表示。这种方法保留了最左侧位作为符号位，0
    表示正，1 表示负。要计算数的补码，你需要反转所有位（将 0 变为 1，反之亦然），然后反转后的值加 1。这种方法允许简单的二进制算术运算，消除了对单独减法操作的需求。它让
    Java 能够用相同的指令处理负值。例如：


