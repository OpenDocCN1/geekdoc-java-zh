    Java ME, on the other hand, is a stripped-down version of the standard library
    of Java SE; it is designed for embedded systems for small devices. The target
    device may range from industrial control devices to mobile phones to tablets and
    set-top boxes, and other embedded devices.


    Java ME is a lightweight version of Java, specifically crafted for devices with
    limited resources, such as mobile phones, embedded systems, and IoT (Internet
    of Things) devices. It provides a subset of Java SE and adds APIs for smaller
    devices, making it ideal for developing applications on systems with constrained
    memory, processing power, and screen size.


    [Figure 1.6](#16_Ch01.xhtml_c1f6) shows how Java ME, Java SE, and Java EE interact
    with one another.


    Figure 1.6 The relationship of each Java technology flavor


    ![](Images/fig1-6.jpg)


    Java EE, now known as Jakarta EE, builds on Java SE and is designed for large-scale,
    distributed, multi-tiered enterprise applications. It includes everything from
    Java SE and adds powerful APIs for building web services, handling servlets and
    JSP, managing enterprise beans (`EJB), and working with technologies like `JPA`
    (Java Persistence API) and `JMS` (Java Message Service). Java EE is commonly used
    for web applications and back-end services in enterprise environments.


    [Figure 1.7](#16_Ch01.xhtml_c1f7) shows the relationship between Java SE, sometimes
    called Core Java, and Java EE.


    Figure 1.7 The relationship of Java SE and Java EE


    ![](Images/fig1-7.jpg)


    ## [1.3 JDK vs. JRE](#07_Contents.xhtml_chhead13)


    The JDK, or the Java Development Kit, is the application that all Java Developers
    should install on their machine. It contains the Java Compiler, Java-Doc creator,
    utility software, profilers, and your Java Runtime Environment (`JRE`).


    Figure 1.8 The Relationship of JDK and JRE


    ![](Images/fig1-8.jpg)


    The JRE, or the Java Runtime Environment, is the interpreter that needs to be
    installed by a Java Technology Application user. As the word implies, it contains
    the essential core libraries and other components. It also contains your Java
    Virtual Machine interfaces (`JVM`) and your Application Programming Interfaces
    (`API`). It is the bare minimum that a casual user may install to use and run
    Java-based applications. It does not support development but is sufficient for
    executing compiled Java programs. The following section takes a look at the JRE
    in detail.


    ## [1.4 The Java Runtime Environment (JRE)](#07_Contents.xhtml_chhead14)


    The Java Runtime Environment contains two main components:


    1. The Java Virtual Machine (`JVM`) and the

    2. Application Program Interface (`API`)


    In other programming languages, the `API` can be thought of as a set of pre-created
    code or libraries that allow programmers or developers to reuse and extend its
    capabilities.


    Every time you run an application, you are executing the Java Runtime Environment.
    This means you are actually launching the `JVM` on top of the Operating System
    so that your valid `*.class` can now be interpreted. Your `API`, on the other
    hand, provides all the standard libraries that your program needs during runtime.
    The manner of accessing this standard `API` is the same across all platforms.


    Before downloading your `JRE`, you need to first know what type of operating system
    you are using. There is a unique `JRE` for each operating system, but the implementation
    of the `API` for these `JREs` is the same.


    ### 1.4.1 The Java Virtual Machine (JVM)


    As the name implies, the Java Virtual Machine is a Virtual Machine that is used
    to read Java bytecode. This Virtual Machine sits on top of the operating system
    and interprets compiled Java applications.


    The Java Virtual Machine, also known as the `JVM`, can read compiled byte code,
    which is embedded inside your `*.class` file or `*.jar` file (`JAR`, short for
    Java archive). Your Java byte code ensures that the `*.class` that you’re running
    came from a valid compilation process.


    The `JVM` can also be customized. Certain companies would prefer to customize
    their own `JVM`; this is allowed by the Oracle software as long as the implementation
    of this `JVM` can run any valid `*.class` file and is approved by the Oracle software.


    The compiler is checking the majority of the object’s type, but there are still
    some parts of the code that should be checked during runtime. This enables the
    dynamism of Java, being able to check and evaluate forms and types during runtime.


    The `JVM` can be executed on multiple operating environments. You just need to
    download the correct Java Runtime Environment (`JRE`) for your operating system.


    ## [1.5 The Garbage Collector](#07_Contents.xhtml_chhead15)


    Garbage collection is the process of deallocating memory spaces that are no longer
    needed by your program during runtime. In some other programming languages, writing
    code for memory deallocation is the job of the programmer.


    Garbage collection or memory deallocation, is the job of the Garbage Collector.
    The Garbage Collector (`GC`) is a system-level thread that runs in the background
    all the time the `JRE` is up and running. The `GC` tracks and monitors created
    objects in memory; if the object is dereferenced or is not used any longer, it
    is now ready for garbage collection. With the go signal of the Operating System,
    the `GC` runs and clears up the memory space that the object occupies, thus freeing
    up resources that other objects can use later on.


    Figure 1.9 The Garbage Collector (GC)


    ![](Images/fig1-9.jpg)


    The implementation of the `GC` varies on different platforms. Since it is a system-level
    thread, the thread scheduler of the Operating System decides when the `GC` should
    run. Although you can set the `GC` in a runnable state by executing the method
    `System.gc()`; this method call does not force the `GC` to run, it just puts it
    in a runnable (ready to run) state.


    The runnable state is the state of a thread is isready” to run; it does not mean
    that it is actually running.


    ## [1.6 Three Tasks Performed By Java in Handling Code Security](#07_Contents.xhtml_chhead16)


    Java ensures code security with three key steps.


    1. Class loading: Only loads code from trusted sources to prevent unauthorized
    or harmful code from running

    2. Bytecode verification: Checks the code for any violations or errors

    3. Interpretation: The interpreter safely runs the code by managing it in a controlled
    environment, preventing harmful actions on the system


    ### 1.6.1 Class Loading


    The Class Loader loads all classes needed for the application to run. It also
    adds security by separating the name spaces for the classes of the local file
    system (FAT, UFS, NTFS, ZFS) from those imported from network resources. The Java
    Runtime Environment does not need to know about files and file systems because
    of the class loader. This limits any malicious software or scripts from penetrating
    your machine because local classes are always loaded first. After all the classes
    have been loaded, the memory layout comes after, during runtime.


    ### 1.6.2 Bytecode Verification


    Your Java source file (`*.java`), once compiled, will produce a class file (`*.class`)
    which contains your Java bytecode.


    The `JVM` lets your class file pass through a bytecode verifier to ensure that
    your compiled Java code is in accordance with the JVM specification that was set
    by the Oracle software. It also ensures that your class file is an actual product
    of a valid Java compilation.


    The bytecode verifier ensures that your code adheres to the JVM specification
    and does not violate the system integrity by checking common programming errors
    that often lead to unpredictable behavior or sometimes data corruption. Some of
    these behaviors that are being checked by the bytecode verifier are array limits,
    use of an uninitialized reference, and illegal data conversions that may happen
    in your code (e.g., pointer value to integer value and vice versa).


