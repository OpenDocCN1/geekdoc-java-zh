    which is embedded inside your *.class file or *.jar file (JAR, short for Java
    archive). Your Java byte code ensures that the *.class that you’re running came
    from a valid compilation process.


    The JVM can also be customized. Certain companies would prefer to customize their
    own JVM; this is allowed by the Oracle software as long as the implementation
    of this JVM can run any valid *.class file and is approved by the Oracle software.


    The compiler is checking the majority of the object’s type, but there are still
    some parts of the code that should be checked during runtime. This enables the
    dynamism of Java, being able to check and evaluate forms and types during runtime.


    The JVM can be executed on multiple operating environments. You just need to download
    the correct Java Runtime Environment (JRE) for your operating system.


