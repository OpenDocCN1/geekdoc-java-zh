    控制变量 `i` 初始化为 1。然后执行循环体，从而打印 `i` 的初始值，即 1。循环将从 1 计数到 5，但在 `for` 循环内部存在一个 `if`
    条件。当 `i` 等于 3 时，执行 `continue` 语句，从而将程序控制权返回到第 1 条语句，在该处 `i` 再次增加到 4，从而跳过第 2 条语句。当
    `i` 变为 5 时，打印 `i` 的最后一个值（即 5），然后将其再次增加到 6，循环结束，从而打印第 4 条语句。


    `break` 和 `continue` 语句用于所有类型的循环。然而，`break` 语句也可以用于 `switch-case` 语句。请参考下表。


    ### 表 5.2 `break` 和 `continue` 语句的控制结构列表


    | | if-else | switch-case | while | do-while | for |

    | --- | --- | --- | --- | --- | --- |

    | break | X | ✔ | ✔ | ✔ | ✔ |

    | continue | X | X | ✔ | ✔ | ✔ |


    只有当所述条件位于循环结构内部时，你才能在 `if` 条件内部使用 `break` 和 `continue` 语句。


    ## 5.9. 标签 break 和 continue


    假设你有一个如下所示的嵌套循环：


    ![](img/img-177a.jpg)


    在内部循环的第 1 条语句中遇到了 `break` 语句。这将允许你跳出内部循环并继续执行到第 2 条语句。


    但如果你想在内部循环内部时不仅跳出内部循环，还跳出外部循环 呢？在这种情况下，我们将使用如下所示的标签 `break`：


    ![](img/img-177b.jpg)


    在这个示例中，第 1 条语句将外部 `for` 循环标记为 `outerLoop`，第 2 条语句将内部 `for` 循环标记为 `innerLoop`。第
    3 条语句中的 `break outerLoop` 允许你跳出最外层循环；因此，一旦遇到，执行将直接跳转到第 5 条语句。


    如果第 3 条语句改为 `break` 而不是原始示例中的 `break outerLoop`，则该语句等同于 `break innerLoop`，它允许你只跳出内部循环，之后执行第
    4 条语句。


    如果我们有标签 break，那么也有标签 continue。实现方式相同。查看以下示例代码：


    ![](img/img-178.jpg)


    在内部循环中，遇到了第 3 条语句，它允许你继续执行外部循环，但如果将第 3 条语句替换为 `continue` 或 `continue innerLoop`（两者相同），将只会跳过内部循环中的其他语句并继续执行到第
    2 条语句。这里有一个代码片段：


    ![](img/img-179.jpg)


    该代码段被放在有效的 Java 源文件中时，将打印：


    1, 3


    1, 2


    当 `i` 和 `j` 的值相等时，它将跳出外部循环。


    在本章中，你学习了 Java 控制结构如何控制程序的的执行流。你探索了如何使用 `if`、`if-else`、`嵌套 if` 和 `if-else-if`
    等条件语句来根据逻辑条件做出决策。你还研究了 `switch-case` 语句作为处理多个检查的结构化替代方案，包括其在 Java 语言中的所有语法。本章还向你介绍了
    Java 的核心结构——`while`、`do-while` 和 `for` 循环——允许代码块重复执行。此外，你学习了如何使用 `break` 和 `continue`
    中断或跳过循环部分，以及标签 `break` 和 `continue` 语句如何管理嵌套循环的流。掌握这些控制结构对于构建响应、逻辑且动态的程序至关重要。


    ## 总结


    - Java 控制结构允许你的程序根据动态条件做出决策并重复任务。

    - `if`、`if-else` 和 `if-else-if` 语句允许根据布尔表达式条件执行代码。

    - `switch-case` 结构为长 `if` 链提供了一种更整洁的替代方案，特别是当检查单个变量的多个值时。

    - Java 支持三种主要类型的循环——`while`、`do-while` 和 `for`——每种用于在特定条件下重复代码块。

    - `break`、`continue` 及其变体对循环执行提供了细粒度的控制，特别是在嵌套循环场景下。


