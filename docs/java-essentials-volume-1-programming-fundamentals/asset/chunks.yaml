    A window appears that has the message “Installer is trying to install new software.”
    You can either type your password to allow this to continue, or you can use your
    registered fingerprint, which will automatically enter the administrator login
    and password, and click `Install Software` to continue the installation process.


    Figure 0.8 Password or Touch ID to continue the Installation Wizard


    ![](Images/fig0-8.jpg)


    The software will be installed, and a confirmation window will appear.


    Figure 0.9 Installation Succeeded


    ![](Images/fig0-9.jpg)


    After the installation process is finished, you will be asked if you want to keep
    the installer saved on your disk or if you want to move it to Trash and discard
    it later permanently. By doing this, you will be able to save up on your disk
    space.


    Figure 0.10 JDK installer - To Keep or Move to Trash


    ![](Images/fig0-10.jpg)


    To test your compiler and to check your compiler’s version, in your terminal window,
    type (without the % symbol): `javac -version`.


    Figure 0.11 Mac OS Finder Window - Checking the javac command


    ![](Images/fig0-11.jpg)


    To test your Java Runtime command, type (without the %): `java -version`


    Figure 0.12 Mac OS Finder Window - Checking the Java command


    ![](Images/fig0-12.jpg)


    Both commands will display the versions of both the Java compiler and the Java
    Runtime Environment. It should be fairly easy to install the JDK on a Mac OS Environment.
    It requires minimal to no configuration in most cases.


    ## 0.4 Installing the JDK for your Windows Operating Environment


    Follow the steps below to install the JDK for your Windows Operating Environment.


    ### 0.4.1 Check the JDK for your Windows Operating Environment


    To check if your Windows OS has a pre-installed JDK, try opening your Command
    Prompt by pressing the Windows Key and typing `CMD`. In your command prompt, type
    `javac` in the prompt as shown in the screenshot below.


    Figure 0.13 Windows Command Prompt - checking the javac command


    ![](Images/fig0-13.jpg)


    If it shows that it does not recognize the `javac` command, then you may need
    to start the downloading, installing, and configuration process of your JDK on
    your Windows OS.


    ### 0.4.2 Download the JDK for your Windows Operating Environment


    Do a Google search: `JDK download` as shown in the image below.


    Figure 0.14 Google Screenshot of the latest JDK installer to be downloaded


    ![](Images/fig0-14.jpg)


    Google and the Google logo are trademarks of Google LLC.


    Click the first Oracle website link related to your search. It’s better to get
    the JDK from the source, which is the official Oracle website.


    Figure 0.15 Available JDK Installers for the Windows OS


    ![](Images/fig0-15.jpg)


    Choose `Windows` from the options (Linux, Mac OS, Windows). Choose `x64 Installer`
    if you are using an Intel-based machine. The downloaded installer will be saved
    in the Downloads folder, as shown below.


    Figure 0.16 JDK 23 Windows Installer inside the Downloads Folder


    ![](Images/fig0-16.jpg)


    ### 0.4.3 Install the JDK in your Windows Operating Environment


    After you have downloaded your JDK, be sure that you have administrative permissions
    to install the JDK on Microsoft Windows. You can start the installation process
    by double-clicking the installer. This will start the JDK installation wizard,
    as shown below.


    Figure 0.17 JDK 23 Windows Installer Installation Wizard


    ![](Images/fig0-17.jpg)


    If this is your first time installing the JDK, it is better to follow the default
    values provided by the installation wizard by clicking `Next` until it finishes
    the installation process. After the installation is finished, you can check your
    `Program Files\Java` folder, you will see that a `jdk-<version>` folder is created.
    In this case, since we installed JDK 23, you will see the `jdk-23` folder.


    ### 0.4.4 Configure your JDK for the Windows OS


    After a successful installation, the next step is to configure the following environment
    variables on your Windows Operating System. These are the following environment
    variables: `CLASSPATH`, `JAVA_HOME`, and `Path`.


    The `CLASSPATH` in the Windows OS is an environment variable that tells the Java
    Virtual Machine (JVM) and Java compiler where to look for user-defined classes
    and packages when running Java applications. It specifies the directories or JAR
    files that contain compiled Java classes that are needed by the application. To
    start setting the environment variables, open your File Explorer and right-click
    on `This PC,`, which is found on the left panel.


    Figure 0.18 File Explorer


    ![](Images/fig0-18.jpg)


    Choose the `Properties` option. This will open the `System Properties` of your
    Windows Environment as shown below.


    Figure 0.19 Properties Window


    ![](Images/fig0-19.jpg)


    Choose `Advanced system settings`.


    Figure 0.20 System Property Window


    ![](Images/fig0-20.jpg)


    Choose `Environment Variables`.


    Figure 0.21 Environment Variable Window


    ![](Images/fig0-21.jpg)


    Click the `New…` button under the `System variables` so that you can start adding
    new environment variables like the `CLASSPATH` and the `JAVA_HOME`.


    In the `Variable Name`, type in: `CLASSPATH`, then in `Variable Value` type in
    `.` (period only) as shown below. Click OK to close the window.


    Figure 0.22 Environment Variable Window - Entering CLASSPATH


    ![](Images/fig0-22.jpg)


    Next, we will set the `JAVA_HOME` variable. Follow the same procedure, click the
    `New…` button under the `System variables` so that you can start adding new environment
    variables; this time, we will add the `JAVA_HOME` as shown below.


    Figure 0.23 Environment Variable - Entering JAVA_HOME


    ![](Images/fig0-23.jpg)


    In order to lessen the possibility of mistyping any value, it will be better to
    copy+ it from the source.


    Figure 0.24 File Explorer - Java Folder


    ![](Images/fig0-24.jpg)


    After setting your `CLASSPATH` and your `JAVA_HOME`, it’s time to edit the `Path`.


    This time, under the System Variables, instead of choosing `New…`, choose `Edit…`.
    This will open the `Environment Variables` window as shown below. Click the `New`
    button found on the upper left of the window, then input the following: `%JAVA_HOME%\bin`.
    Be sure there are no extra spaces in the text you entered. After that, press OK
    to close the window.


    Figure 0.25 Environment Variable - Edit Path


    ![](Images/fig0-25.jpg)


    The `%JAVA_HOME%\bin` is a path notation used in Windows to refer to the bin directory
    within the Java installation folder.


    - `%JAVA_HOME%`: This is an environment variable that points to the root directory
    of the Java Development Kit (JDK) installation. It usually contains the path where
    Java is installed (for example, `C:\Program Files\Java\jdk-23`).

    - `bin`: The bin folder inside the Java installation directory contains essential
    Java executables, such as `java` (the Java Runtime), `javac` (the Java compiler),
    and other tools like `jshell`.


    ### 0.4.5 Test JDK on Your Windows Machine


    Close all existing Command Prompts; you don’t need them. You have to open a new
    one so that the newly added environment variables on your Windows Operating System
    will take effect. Let us open a new command prompt and type in `javac -version`
    as shown below.


    Figure 0.26 Command Prompt - Testing the javac command


    ![](Images/fig0-26.jpg)


    This will show that your compiler is working and that the version of your Java
    compiler is version 23. Next, type in `java -version` to test your Java Runtime
    Environment, as shown below.


    Figure 0.27 Command Prompt - Testing the Java command


    ![](Images/fig0-27.jpg)

