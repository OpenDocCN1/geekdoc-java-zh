    Compile-time errors happen when there is a mistake in the code that stops it from
    being successfully compiled, like missing semicolons or incorrect syntax. Runtime
    errors occur after the program is successfully compiled but crash or behave unexpectedly
    when it is running, such as an integer number dividing by zero or accessing an
    invalid array location.


    ### 2.3.1 Common Compile-Time Errors


    This section discusses the common compile-time errors encountered by those who
    are just starting out. Consider this sample compilation error:


    ```

    HelloWorld.java:5: cannot resolve symbol

    symbol : method printl (java.lang.String)

    location: class java.io.PrintStream

    System.out.printl("Hello, Java World");

    ^

    ```


    The `println()` method is typed incorrectly. The following are ways in which you
    can get such compile-time errors:


    1. **Class and file naming**: Your Java source file should have the same name
    as your `public class`. If this rule is not followed correctly, you will have
    a compiler error similar to this:


    ```

    TestHelloWord.java:7: public class TestHelloWorld must be defined in a file called
    "TestHelloWorld.java"

    ```


    2. **Number of public classes in a Java source file**: You can only have one `public
    class` in a Java source file. If you declare more than one public, top-level class,
    you will have a similar compilation error. You can have many class declarations
    inside a Java source file as long as there is only one class that will be declared
    `public`, and the file name of the Java source file should be the same as the
    name of your `public class`.


    Once you’ve encountered these compile-time errors, you need to edit your code,
    save it, and recompile. After fixing all the compile-time errors, you can now
    run your sample application.


    The `javac` command is located under the subdirectory `\bin` of the installed
    Java Development Kit (JDK) directory. You must update your path directory and
    include the location of your `javac` executable file. If your `javac` command
    is not working, please refer back to [Chapter 0](#12_Ch00.xhtml_ichhead1).


    ### 2.3.2 Common Runtime Errors


    After having a clean compile, it’s now time for you to run your sample application.
    During runtime, you may encounter some errors. Here are some examples of common
    runtime errors:


    1. **Can''t find class TestHelloWorld**


    This runtime error will occur if you attempt to run a file that does not exist
    or if you are attempting to run a misspelled file. The filename should have the
    same spelling as the `filename.class` file.


    2. **Exception in thread "main" java.lang.NoSuchMethodError: main**


    This means that your `main` method is incorrectly declared. Your `main` method
    must be `public`, and it should also be `static` and must have a return type of
    `void`, and it should also be called `main` and must accept an array of `String`
    objects as its parameter list.


    Another probable reason why this runtime error occurs is when you attempt to run
    a class file that does not have a `public static void main(String[] args)` method
    in it. The `main` method is the entry point of your application execution, thus,
    it should be present when you try to run your Java application.


    Starting with Java 11 (JEP 330), the “Launch Single-File Source-Code Programs”
    feature was introduced. It allows direct execution of a Java source code file
    using the `java` launcher, without requiring explicit prior compilation with `javac`.


    Instead of compiling your `.java` file into a `.class` file and then running the
    `.class` file, you can directly execute the `.java` file using the `java` command.


    When you invoke `java` with a source file, the launcher automatically compiles
    the code in memory and then executes it. This avoids the creation of intermediate
    `.class` files on disk.


    The requirement is that the source file must contain a top-level class with a
    `public static void main(String[] args)` method, which serves as the entry point
    for execution.


    This command is now possible:


    ```

    java HelloWorld.java

    ```


    This will do an in-memory compilation and will run the source code directly without
    creating an external `.class` file.


    Another cool feature was introduced in Java 21 called “Simplified Entry Point”.
    In earlier versions of Java, every program required a full class declaration and
    a specific main method signature:


    ```

    public static void main(String[] args)

    ```


    This method served as the standard entry point for any Java application and had
    to be placed inside a class. While this structure is powerful, it introduced a
    lot of boilerplate code—especially for beginners writing simple programs like
    "Hello, World!".


    Starting with Java 21, a new preview feature called Unnamed Classes and Instance
    Main Methods (introduced through JEP 445) allows you to write simpler Java programs
    without the need for an explicit class or the full static method declaration.
    For example:


    ![](Images/img-70.jpg)


    In this version, there is no `public`, no `static`, and no class name—just the
    logic. This greatly reduces complexity and helps new learners focus on programming
    concepts rather than language structure.


    To compile and run this simplified version, preview features must be enabled using
    the `--enable-preview` flag during both compilation and execution:


    To compile:


    ```

    javac --enable-preview --release <jdkVer> HelloWorld.java

    javac --enable-preview --release 21 HelloWorld.java

    ```


    To run:


    ```

    java --enable-preview HelloWorld

    ```


    This enhancement in Java 21 (and expected in future versions in both JDK 23 and
    JDK 24) marks a significant step toward making Java more approachable, especially
    in educational settings and beginner-level development.


    For newer JDK versions, it will be acceptable to just compile and run the code
    directly without the `--enable-preview --release 21` and `--enable-preview` options.


    Here’s a summary in table form.


    | Java Version | Code | Compile/Run Behavior |

    | --- | --- | --- |

    | Java 8 | Full class and static | Must javac then java |

    | Java 11 | Same code | Can do java HelloWorld.java |

    | Java 21 | Just main() in source | java --enable-preview |


    ### [2.4 Introduction to JShell](#07_Contents.xhtml_ch24)


    One of the most significant advancements in Java 9 is the introduction of JShell,
    a command-line tool designed to make the exploration of language more interactive.
    Before JShell, running even the simplest Java code required setting up an entire
    class, followed by compilation and execution. This posed a barrier to quickly
    testing and experimenting with snippets. JShell changes this dynamic by loop-enabling
    a Read-Eval-Print-Loop (REPL) environment where users can execute Java code snippets.


    #### 2.4.1 What is JShell?


    JShell is a REPL (Read–Eval–Print Loop) tool introduced in Java 9 that allows
    developers to execute Java code interactively without needing to write a complete
    class or method. It provides a console where code can be typed, evaluated, and
    executed one statement or expression at a time. This makes JShell particularly
    useful for prototyping, debugging, and exploring Java code.


    In essence, JShell is a tool that brings Java in line with the REPL tools available
    in many other languages like Python, Ruby, or Scala. Its primary goal is to facilitate
    quick experimentation, learning, and validation of code fragments.


    #### 2.4.2 What is it For?


    The primary purpose of JShell is to provide a streamlined environment where developers
    can quickly:


    - **Test code snippets**: JShell is a great place to try out short code segments,
    whether you’re exploring the behavior of a new API, testing an algorithm, or verifying
    language features.

    - **Learn and teach Java**: JShell is an excellent tool for beginners to learn
    Java interactively. Instructors and learners can execute lines of code in real
    time, exploring the language with immediate feedback.

