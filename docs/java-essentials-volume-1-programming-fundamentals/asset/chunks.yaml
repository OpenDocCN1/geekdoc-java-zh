    ```


    该运算符始终会评估两个条件，即使第一个条件已经是假。这就是为什么在第一个示例中，`++b` 仍然被执行，并增加了 `b` 的值。


    ## 短路与与运算符 (&&)


    ```java

    int a = 5, b = 10;

    System.out.println((a < 5) && (++b != 10));

    System.out.println("a = " + a + "\tb = " + b);

    ```


    将输出如下：


    ```

    false

    a = 5b = 10

    ```


    该运算符更智能——它只在第一个条件为真时才评估第二个条件。如果第一个条件为假，它会完全跳过第二个条件。这就是为什么在第二个例句示例中，`++b` 没有被执行，`b`
    保持不变。


    总结来说，当你始终希望评估两边时，请使用 `&`。当你想要为了性能或避免副作用而跳过不必要的评估时，请使用 `&&`。


    ## 23. 逻辑或运算符 (|) 与 短路或运算符 (||)


    另一方面，`||` 运算符是一个短路或运算符，用于评估两个布尔表达式。如果条件中至少有一个为真，它将返回真，并利用了短路评估，这意味着如果第一个表达式为真，则第二个表达式将不再被评估；而逻辑或运算符
    `|` 无论结果如何都会评估两个表达式。


    ### 逻辑或运算符 (|)


    ```java

    int a = 5, b = 10;

    System.out.println((a <= 5) | (++b != 10));

    System.out.println("a = " + a + "\tb = " + b);

    ```


    将输出如下：


    ```

    true

    a = 5b = 11

    ```


    该运算符始终评估表达式的两个边，即使第一个条件已经是真。在我们的示例中，由于 `a <= 5` 为真，Java 仍然执行了 `++b`，将 `b` 从 `10`
    增加到 `11`。


    ### 短路或运算符 (||)


    ```java

    int a = 5, b = 10;

    System.out.println((a <= 5) || (++b != 10));

    System.out.println("a = " + a + "\tb = " + b);

    ```


    将输出如下：


    ```

    true

    a = 5b = 10

    ```


    该运算符仅在第一个条件为假时才评估第二个条件。由于 `a <= 5` 已经是真，Java 跳过了第二个条件，因此 `++b` 未被执行，`b` 保持为 `10`。


    总结来说，当你无论第一个结果如何都希望运行两边时，请使用 `|`。当你希望在第一个条件已经足够确定结果时跳过第二部分时，请使用 `||`。


