- - '#'
  - 第 3 章 集合导论 — 栈
- - '##'
  - SRA 3.8 一个 Java 接口定义了一组抽象方法，对于将抽象数据类型的概念与其实现分离非常有帮助。
- - '##'
  - SRA 3.9 不，接口不是类。然而，它类似于抽象类的一种极端情况。接口本质上是一种类型，它允许程序员定义带有接口类型参数的方法。这段代码适用于所有实现接口的类。
- - '##'
  - SRA 3.10 泛型类型（generic type）是一个对象的占位符，直到引用它的类被实例化时，它才具体化。
- - '##'
  - SRA 3.11 多态引用（polymorphic reference）是一种引用变量，可以在不同时间点引用不同类型的对象。继承可以用于创建类层次结构，其中引用变量可以指向任何通过继承与其相关的对象。
- - '##'
  - SRA 3.12 爬行动物（Reile）的子类是蛇（Snake）和蜥蜴（Lizard）。
- - '##'
  - SRA 3.13 是，父类或任何子类的引用变量都可以持有其任一个后代的引用。
- - '##'
  - SRA 3.14 不，子类或子类的引用变量不能持有父类或超类的引用。要完成此赋值，你必须显式地将父类强制转换为子类（`Parrot creature = (Parrot)
    (new Bird());`）。
- - '##'
  - SRA 3.15 在中缀表达式中，运算符位于操作数之间，形式为：`<操作数><运算符><操作数>`；例如表达式 `4 + 5`。而在后缀表达式中，运算符位于两个操作数之后，形式为：`<操作数><操作数><运算符>`。上述后缀符号表示为
    `4 5+`。
- - '##'
  - SRA 3.16 求值后缀表达式的过程可以描述为：从左到右扫描，对紧邻其之前的两个操作数应用每个操作，并将运算符替换为结果。最后，我们得到了表达式的最终值。栈是求值后缀表达式时理想的数据结构。
