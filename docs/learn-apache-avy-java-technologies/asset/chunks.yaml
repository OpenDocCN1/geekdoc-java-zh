    # Resolvers


    Resolvers are used to find locations from where a library is to be downloaded.
    A dependency resolver also handles common tasks. Ivy provides two types of Resolvers.


    *   **Composite**  − A resolver which uses other resolvers to do its tasks.


    *   **Standard**  − A resolver performs the required tasks.


    ## Standard Resolvers


    Following table lists down the standard resolvers and their usage.


    | Sr.No. | Name (Type) & Description |


    | 1 | IvyRep (Standard)Locates Ivy files on ivyrep and artifacts on ibiblio. |


    | 2 | IBiblio (Standard)Locates artifacts on ibiblio. |


    | 3 | BinTray (Standard)Locates artifacts on bintray. |


    | 4 | Packager (Standard)Locates Ivy files and packaging instructions via URLs,
    creates artifacts using instructions. |


    | 5 | FileSystem (Standard)Locates Ivy files and artifacts on local file system.
    |


    | 6 | URL (Standard)Locates Ivy files and artifacts on repositories which can
    be accessed using URLs. |


    | 7 | MirroredURL (Standard)Locates Ivy files and artifacts on repositories which
    can be accessed using URLs from a mirror list. |'
