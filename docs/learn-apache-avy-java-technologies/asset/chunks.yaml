  trans: "\n\n![](img/cover.jpeg)\n\n版权所有 © 保留所有\n\n未经出版者明确书面许可，本书的任何部分不得复制、存储在检索系统中，或以任何形式或通过任何手段（电子、机械、复印、录制或其他）进行传输。\n\
    \n我想将这本书献给将使用这本书的学生们。祝愿你们未来职业成功，并希望你们永不停学习。\n\n# 目录\n\n- 概述\n- 环境搭建\n- 术语\n- 配置文件\n\
    - Eclipse Ivy 插件\n- 解析任务 (Resolve Task)\n- 安装任务 (Install Task)\n- 检索任务 (Retrieve\
    \ Task)\n- 缓存路径任务 (Cachepath Task)\n- 发布任务 (Publish Task)\n- 信息任务 (Info Task)\n\
    - 解析器 (Resolvers)\n- 本地仓库 (Local Repository)\n- 共享仓库 (Shared Repository)\n- 公共仓库\
    \ (Public repository)\n\n# 概述\n\nApache Ivy 是一个非常流行且强大的依赖管理工具，用于以类似于 Apache Maven\
    \ 管理依赖的方式，管理基于 ANT (ANT based projects) 项目的依赖。\n\nApache Ivy 基于 Apache ANT，遵循相同的设计原则，是\
    \ Apache ANT 的子项目，并由 Apache ANT 社区积极管理和支持。\n\n## 特性\n\n以下是 Apache Ivy 的重要特性。\n\
    \n- **基于 ANT** — Apache Ivy 为基于 ANT 的项目提供了依赖管理能力。它用起来非常简单。\n- **依赖报告** — Apache\
    \ Ivy 提供了选项，以 html 格式以及报告格式打印依赖图。\n- **非侵入性** — Apache Ivy 不会作为发行的一部分施加任何限制。即使是构建文件也不依赖于\
    \ Apache Ivy。\n- **高度灵活** — Apache Ivy 提供了许多默认配置，可以根据需要非常容易地配置。\n- **可扩展** — Apache\
    \ Ivy 可以很容易地扩展。你可以定义自己的仓库、冲突解析器和最新策略。\n- **性能** — Apache Ivy 针对性能而构建。它维护了已下载库的缓存。在解析依赖时，首先查找本地仓库，然后查找其他仓库。\n\
    - **传递性依赖** — 如果一个项目或库依赖于另一个库，而后者可能还需要另一个库，Apache Ivy 会自动管理传递性依赖。\n- **Maven 仓库**\
    \ — Apache Ivy 遵循类似于 Maven 仓库的约定。Apache Ivy 可以使用 maven 全局仓库解析依赖。\n- **Maven 2\
    \ POM** — Apache Ivy 可以读取 Maven 2 POMs 作为模块描述符，并将 ivy 设置为模块描述符。因此，将现有项目迁移到 IVY\
    \ 管理的项目变得简单。\n- **发布** — Apache Ivy 提供了发布项目的支持，并简化了多项目环境的部署过程。\n- **免费使用** — Apache\
    \ Ivy 是开源的，可以免费使用。\n- **文档** — Apache Ivy 有非常详细的文档和教程供学习。\n\n# 环境搭建\n\nApache\
    \ Ivy 的唯一要求是在你的机器上安装 Java 和 ANT。\n\nApache Ant 根据 Apache 软件许可分发，这是一种由开源倡议认证的完全开源许可。\n\
    \n最新的 Apache Ant 版本，包括其完整源代码、类文件和文档可以在 `http://ant.apache.org` 找到。\n\n## 安装 Apache\
    \ Ant\n\n假设你已经在计算机上下载并安装了 Java 开发包 (JDK)。如果没有，请遵循此处的说明。\n\n- 确保环境变量 `JAVA_HOME`\
    \ 设置为安装 JDK 的文件夹。\n- 从 `https://ant.apache.org` 下载二进制文件。\n- 使用 Winzip、winRAR、7-zip\
    \ 或类似工具将 zip 文件解压到方便的路径 `c:\\folder`。\n- 创建名为 `ANT_HOME` 的新环境变量，指向 Ant 的安装文件夹，在本例中为\
    \ `c:\\apache-ant-1.9.14-bin` 文件夹。\n- 将 Apache Ant 批处理文件的路径添加到 `PATH` 环境变量。在我们的案例中，这将是\
    \ `c:\\apache-ant-1.9.14-bin` 文件夹。\n\n## 验证 Apache Ant 安装\n\n要验证在计算机上成功安装 Apache\
    \ Ant，请在命令提示符上输入 `ant`。\n\n你应该能看到类似下面的输出 —\n\n```\nC:\\>ant -version\nApache Ant(TM)\
    \ version 1.9.14 compiled on March 12 2019\n```\n\n如果你没有看到上述输出，请验证你是否正确遵循了安装步骤。\n\
    \n## 安装 Apache Ivy\n\n- 从 `https://ant.apache.org/ivy` 下载二进制文件。\n- 使用 Winzip、winRAR、7-zip\
    \ 或类似工具将 zip 文件解压到方便的路径 `c:\\folder`。\n- 将 `ivy-2.5.0.jar` 复制到 `c:\\apache-ant-1.9.14-bin/lib`\
    \ 文件夹。\n\n## 验证 Apache Ivy 安装\n\n要验证在计算机上成功安装 Apache Ivy，请在文件夹 `E: > ivy` 中创建以下构建文件。\n\
    \n```xml\n<project name = \"test ivy installation\" default = \"test\" xmlns:ivy\
    \ = \"antlib:org.apache.ivy.ant\" >\n  <target name = \"test\" description = \"\
    Test ivy installation\" >\n    <ivy:settings />\n  </target>\n</project>\n```\n\
    \n你应该看到类似下面的输出 —\n\n```\nC:\\>ant\nBuildfile: E:\\ivy\\build.xml\ntest:\nBUILD\
    \ SUCCESSFUL\nTotal time: 2 seconds\n```\n\n## 安装 Eclipse\n\n本教程还涵盖了 Ant 与 Eclipse\
    \ 的集成。如果你还没有安装 Eclipse，请下载并安装。\n\n安装 Eclipse —\n\n- 从 `www.eclipse.org` 下载最新的\
    \ 二进制文件。\n- 将二进制文件解压到方便的路径，例如 `c:\\folder`。\n- 运行 `c:\\eclipse\\eclipse.exe`\n\
    \n# 术语\n\n参考以下 `ivy.xml` 示例来理解 Ivy 术语。\n\n```xml\n<?xml version = \"1.0\" encoding\
    \ = \"ISO-8859-1\" ?>\n<ivy-module version = \"2.0\" xmlns:xsi = \"http://www.w3.org/2001/XMLSchema-instance\"\
    \ xsi:noNamespaceLocation = \"http://ant.apache.org/ivy/schemas/ivy.xsd\" >\n\
    \  <info organisation = \"com.tutorialspoint\" module = \"ivy-test\" status =\
    \ \"integration\" >\n  </info>\n  <dependencies>\n    <dependency org = \"commons-lang\"\
    \ name = \"commons-lang\" rev = \"2.6\" />\n  </dependencies>\n</ivy-module>\n\
    ```\n\n## Ivy 术语\n\n以下是 Ivy 生态系统的重要术语。\n\n- **组织 (Organisation)** — 如其名，它指的是创建项目或库的公司、个人开发者或团队名称。例如\
    \ `com.tutorialspoint`。\n- **模块 (Module)** — 如其名，它指的是复用单元或模块。模块通常附有一个版本号。例如 `commons-lang`\
    \ 或 `ivy-test` 等。\n- **模块描述符 (Module Descriptor)** — 模块描述符指的是描述模块的 `ivy.xml` 文件。模块描述符包含标识符、发布的制品、配置和依赖。\n\
    - **制品 (Artifact)** — 制品指的是单个交付文件。例如 `jar` 文件。制品可以是 `zip` 或 `gz` 类型。Jar、Source\
    \ Jar、Javadoc Jar 是模块的各种制品。\n- **类型 (Type)** — 类型识别制品类别，如 `jar`、`war`、`src`、`doc`\
    \ 等。\n- **制品文件名后缀 (Artifact file name extension)** — 品的后缀，如 `.jar`、`.zip`、`.gz`\
    \ 等。\n- **模块修订 (Module Revision)** — 模块唯一修订号或版本号。\n- **修订状态 (Status of Revision)**\
    \ — 修订状态指示修订的稳定性。以下是状态的重要值 —\n  - **集成 (integration)** — 代表持续开发、每日构建等。\n  - **里程碑\
    \ (milestone)** — 代表已发布但尚未最终确定。\n  - **发布 (release)** — 代表测试并完成，主版本。\n\n"
- fmt: "\n*   **Repository** — Similar to Maven repositories, repository represents\
    \ a distribution site where ivy can search a library, artifacts, modules etc.\
    \ A repository can be public, private or shared.\n*   **Ivy Settings** — Apache\
    \ Ivy follows Maven principles and comes with lot of default configurations. Default\
    \ settings can be overridden by defining a `ivysettings.xml` file.\n\n# Settings\
    \ File\n\nApache Ivy follows Maven principles and comes with lot of default configurations.\
    \ Default settings can be overridden by defining a `ivysettings.xml` file.\n\n\
    ```xml\n<ivysettings>\n<properties file = \"${ivy.settings.dir}/ivysettings-file.properties\"\
    \ />\n<settings defaultCache = \"${cache.dir}\" defaultResolver = \"ibiblio\"\
    \ checkUpToDate = \"false\" />\n<resolvers>\n <ibiblio name = \"ibiblio\" />\n\
    \ <filesystem name = \"internal\" >\n  <ivy pattern = \"${repository.dir}/[module]/ivy-[revision].xml\"\
    \ />\n  <artifact pattern = \"${repository.dir}/[module]/[artifact]-[revision].[ext]\"\
    \ />\n </filesystem>\n</resolvers>\n<modules>\n <module organisation = \"tutorialspoint\"\
    \ name = \".*\" resolver = \"internal\" />\n</modules>\n</ivysettings>\n```\n\n\
    ## Tags of Ivy Settings File\n\nFollowing are the important tags of Ivy Setting\
    \ file.\n\n*   **property** — To set an ivy variable. Cardinality: 0..n\n*   **properties**\
    \ — To set an ivy variables using properties file. Cardinality: 0..n\n*   **settings**\
    \ — To configure ivy with default values. Cardinality: 0..1\n*   **include** —\
    \ To include another settings file. Cardinality: 0..n\n*   **classpath** — To\
    \ add a location in the classpath used to load plugins. Cardinality: 0..n\n* \
    \  **typedef** — To define new types in ivy. Cardinality: 0..n\n*   **lock-strategies**\
    \ — To define lock strategies. Cardinality: 0..1\n*   **caches** — To define repository\
    \ cache managers. Cardinality: 0..1\n*   **latest-strategies** — To define latest\
    \ strategies. Cardinality: 0..1\n*   **parsers** — To define module descriptor\
    \ parsers. Cardinality: 0..1\n*   **version-matchers** — To define new version\
    \ matchers. Cardinality: 0..1\n*   **triggers** — To register triggers on ivy\
    \ events. Cardinality: 0..1\n*   **namespaces** — To define new namespaces. Cardinality:\
    \ 0..1\n*   **macrodef** — To define a new macro resolver. Cardinality: 0..n\n\
    *   **resolvers** — To define dependency resolvers. Cardinality: 0..1\n*   **conflict-managers**\
    \ — To define conflicts managers. Cardinality: 0..1\n*   **modules** — To define\
    \ rules between modules and dependency resolvers. Cardinality: 0..1\n*   **outputters**\
    \ — To define the list of available report outputters. Cardinality: 0..1\n*  \
    \ **statuses** — To define the list of available statuses. Cardinality: 0..1\n\
    \n# Eclipse Ivy Plugin\n\nIvyDE is an Eclipse plugin provided by Apache. To install\
    \ IvyDE, start Eclipse and navigate to Help > Install New Software. It displays\
    \ the Available Softwares window. Enter IvyDE update site `http://www.apache.org/dist/ant/ivyde/updatesite/`\
    \ and press enter key. It displays the following plugins.\n\n![Image](OEBPS/Image00000.jpg)\n\
    \nClick Next and you will see the following screen.\n\n![Image](OEBPS/Image00001.jpg)\n\
    \nIf you are facing any error while installing the plugin then just restart the\
    \ process. After successful installation, you will see the plugin in eclipe.\n\
    \n![Image](OEBPS/Image00002.jpg)\n\nNow you can do the dependency management using\
    \ Eclipse and Ivy.\n\n# Resolve Task\n\nResolve task is used to resolve dependencies\
    \ described in ivy.xml, download and put them in ivy cache.\n\nLet's first create\
    \ a java file `Tester.java` in `E: > ivy > src > com > tutorialspoint` folder\
    \ which will act as source folder for ant project.\n\n```java\npackage com . tutorialspoint\
    \ ;\n\nimport org . apache . commons . lang . StringUtils ;\n\npublic class Application\
    \ {\npublic static void main ( String [] args ) {\nString string = StringUtils\
    \ . upperCase ( \"Ivy Beginner Guide\" );\nSystem . out . println ( string );\n\
    }\n}\n```\n\nAbove class is using apache commons lang library to use its class\
    \ `StringUtils`. Ivy should download this library and thus it should be defined\
    \ under dependencies section in ivy.xml. Following is the `ivy.xml` created in\
    \ `E: > ivy` folder.\n\n```xml\n<? xml version = \"1.0\" encoding = \"ISO-8859-1\"\
    \ ?>\n<ivy-module version = \"2.0\" xmlns:xsi = \"http://www.w3.org/2001/XMLSchema-instance\"\
    \nxsi:noNamespaceSchemaLocation = \"http://ant.apache.org/ivy/schemas/ivy.xsd\"\
    \ >\n<info\norganisation = \"com.tutorialspoint\"\nmodule = \"test\"\nstatus =\
    \ \"integration\" >\n</info>\n<dependencies>\n<dependency org = \"org.apache.commons\"\
    \ name = \"commons-lang3\" rev = \"3.9\" />\n</dependencies>\n</ivy-module>\n\
    ```\n\nFollowing are the important terms.\n\n*   **ivy-module** — Root element\
    \ to identify ivy version, namespace etc.\n*   **info** — element to identify\
    \ the project as a unique entity.\n*   **organisation** — name of the organization\n\
    *   **module** — name of the module\n*   **status** — status like release, integration\
    \ or milestone.\n*   **dependencies** — element to contain project dependencies\
    \ as dependency tags which has following attributes.\n*   **org** — name of the\
    \ dependency's organization\n*   **name** — name of the dependency.\n*   **rev**\
    \ — version of the dependency.\n\n```xml\n<project name = \"test\" default = \"\
    resolve\" xmlns:ivy = \"antlib:org.apache.ivy.ant\" >\n<target name = \"resolve\"\
    \ description = \"resolve\" >\n<ivy:resolve />\n</target>\n</project>\n```\n\n\
    Following are the important terms.\n\n*   **project** — Root element to identify\
    \ project name, namespace etc.\n*   **target** — target element to create a new\
    \ task. Its description.\n\n## Building the project\n\nAs we've all the files\
    \ ready. Just go the console. Navigate to `E: > ivy` folder and run the `ant`\
    \ command.\n\n`E:\\ivy > ant`\n will come into action, resolving the dependencies,\
    \ you will see the following result.\n\n```\nBuildfile: E:\\ivy\\build.xml\n[ivy:resolve]\
    \ :: Apache Ivy 2.5.0 - 201910204435 :: https://ant.apache.org/ivy/\n[ivy:resolve]\
    \ :: loading settings :: jar:file:/E:/Apache/ant-1.9.14/lib/ivy-2.5.0.jar!/org/ivy/core/settings/ivysettings.xml\n\
    [ivy:resolve] :: resolving dependencies :: com.tutorialspoint#test;working@Acer\n\
    [ivy:resolve] confs: [default]\n[ivy:resolve] found commons-lang;2.6 in public\n\
    [ivy:resolve] found junit;3.8.1 in public\n[ivy:resolve] :: resolution report\
    \ :: resolve 375ms :: artifacts 79ms\n-----------------------------------------------------\n\
    | | modules || artifacts |\n| conf | number|search|dwnlded|evicted|| number|dwnlded|\n\
    -----------------------------------------------------\n| default | 2 | 2 | 0 |\
    \ 0 || 4 | 0 |\n-----------------------------------------------------\n[ivy:retrieve]\
    \ :: retrieving :: com.tutorialspoint#test [sync]\n[ivy:retrieve] confs: [default]\n\
    [ivy:retrieve] 0 artifacts copied, 2 already retrieved (0kB/101ms)\nBUILD SUCCESSFUL\n\
    Total time: 1 second\nE:\\ivy>\n```\n\n## Resolve Output\n\nFollowing are the\
    \ important terms.\n\n*   **conf** — configuration, in our case we are using default\
    \ configuration.\n*   **modules** — indicates the total number of modules, downloaded\
    \ modules etc.\n*   **artifacts** — indicates the total number of artifacts, downloaded\
    \ artifacts etc.\n\nYou can verify the downloaded files in ivy cache's default\
    \ location in `${ivy.default.ivy.user_dir} > .ivy2 > cache` folder. And `${ivy.default.ivy.user_dir}`\
    \ is by default user home: $HOME.\n\n# Install Task\n\nInstall task is used to\
    \ install a module and its dependencies in a resolver. It is used when a public\
    \ artifact is to be downloaded and used in private repository. By default, a user\
    \ local repository is his/her private repository and is present in ${ivy.default.ivy.user_dir}/local.\n"
