  trans: "\n\n*   **仓库 (Repository)** — 类似于 Maven 仓库，仓库代表一个 ivy 可以在其中搜索库、构件、模块等的分发站点。仓库可以是公共的、私有的或共享的。\n\
    *   **Ivy 设置 (Ivy Settings)** — Apache Ivy 遵循 Maven 原则，并带有许多默认配置。可以通过定义 `ivysettings.xml`\
    \ 文件来覆盖默认设置。\n\n# 设置文件\n\nApache Ivy 遵循 Maven 原则，并带有许多默认配置。可以通过定义 `ivysettings.xml`\
    \ 文件来覆盖默认设置。\n\n```xml\n<ivysettings>\n<properties file = \"${ivy.settings.dir}/ivysettings-file.properties\"\
    \ />\n<settings defaultCache = \"${cache.dir}\" defaultResolver = \"ibiblio\"\
    \ checkUpToDate = \"false\" />\n<resolvers>\n <ibiblio name = \"ibiblio\" />\n\
    \ <filesystem name = \"internal\" >\n  <ivy pattern = \"${repository.dir}/[module]/ivy-[revision].xml\"\
    \ />\n  <artifact pattern = \"${repository.dir}/[module]/[artifact]-[revision].[ext]\"\
    \ />\n </filesystem>\n</resolvers>\n<modules>\n <module organisation = \"tutorialspoint\"\
    \ name = \".*\" resolver = \"internal\" />\n</modules>\n</ivysettings>\n```\n\n\
    ## Ivy 设置文件的标签\n\n以下是 Ivy 设置文件中重要的标签。\n\n*   **property** — 用于设置 ivy 变量。基数：0..n\n\
    *   **properties** — 用于使用属性文件设置 ivy 变量。基数：0..n\n*   **settings** — 使用默认值配置 ivy。基数：0..1\n\
    *   **include** — 包含另一个设置文件。基数：0..n\n*   **classpath** — 在类路径中添加一个用于加载插件的路径。基数：0..n\n\
    *   **typedef** — 在 ivy 中定义新类型。基数：0..n\n*   **lock-strategies** — 定义锁策略。基数：0..1\n\
    *   **caches** — 定义仓库缓存管理器。基数：0..1\n*   **latest-strategies** — 定义最新策略。基数：0..1\n\
    *   **parsers** — 定义模块描述符解析器。基数：0..1\n*   **version-matchers** — 定义新的版本匹配器。基数：0..1\n\
    *   **triggers** — 在 ivy 事件上注册触发器。基数：0..1\n*   **namespaces** — 定义新的命名空间。基数：0..1\n\
    *   **macrodef** — 定义一个新的宏解析器。基数：0..n\n*   **resolvers** — 定义依赖解析器。基数：0..1\n*\
    \   **conflict-managers** — 定义冲突管理器。基数：0..1\n*   **modules** — 定义模块与依赖解析器之间的规则。基数：0..1\n\
    *   **outputters** — 定义可用的报告输出器列表。基数：0..1\n*   **statuses** — 定义可用的状态列表。基数：0..1\n\
    \n# Eclipse Ivy 插件\n\nIvyDE 是由 Apache 提供的 Eclipse 插件。要安装 IvyDE，启动 Eclipse 并导航到\
    \ Help（帮助） > Install New Software（安装新软件）。它会显示可用软件（Available Softwares）窗口。输入 IvyDE\
    \ 更新站点 `http://www.apache.org/dist/ant/ivyde/updatesite/` 并按回车。它将显示以下插件。\n\n![Image](img/Image00000.jpg)\n\
    \n点击 Next（下一步），你将看到以下界面。\n\n![Image](img/Image00001.jpg)\n\n如果在安装插件时遇到任何错误，只需重新开始过程。安装成功后，你将在\
    \ eclipse 中看到该插件。\n\n![Image](img/Image00002.jpg)\n\n现在你可以使用 Eclipse 和 Ivy 进行依赖管理。\n\
    \n# Resolve 任务 (Resolve Task)\n\nResolve 任务用于解析 ivy.xml 中描述的依赖，下载并将它们放入 ivy 缓存。\n\
    \n让我们首先在 `E: > ivy > src > com > tutorialspoint` 文件夹中创建一个 java 文件 `Tester.java`，它将作为\
    \ ant 项目的源代码文件夹。\n\n```java\npackage com . tutorialspoint ;\n\nimport org . apache\
    \ . commons . lang . StringUtils ;\n\npublic class Application {\npublic static\
    \ void main ( String [] args ) {\nString string = StringUtils . upperCase ( \"\
    Ivy Beginner Guide\" );\nSystem . out . println ( string );\n}\n}\n```\n\n上述类使用了\
    \ apache commons lang 库中的其类 `StringUtils`。Ivy 需要下载此库，因此它应该在 ivy.xml 的 dependencies\
    \ 部分下定义。以下是在 `E: > ivy` 文件夹中创建的 `ivy.xml`。\n\n```xml\n<? xml version = \"1.0\"\
    \ encoding = \"ISO-8859-1\" ?>\n<ivy-module version = \"2.0\" xmlns:xsi = \"http://www.w3.org/2001/XMLSchema-instance\"\
    \nxsi:noNamespaceSchemaLocation = \"http://ant.apache.org/ivy/schemas/ivy.xsd\"\
    \ >\n<info\norganisation = \"com.tutorialspoint\"\nmodule = \"test\"\nstatus =\
    \ \"integration\" >\n</info>\n<dependencies>\n<dependency org = \"org.apache.commons\"\
    \ name = \"commons-lang3\" rev = \"3.9\" />\n</dependencies>\n</ivy-module>\n\
    ```\n\n以下是重要的术。\n\n*   **ivy-module** — 识别 ivy 的根元素。\n*   **info** — 包含模块信息的元素。\n\
    *   **organisation** — 组织名称。\n*   **module** — 模块名称。\n*   **status** — 状态。\n*\
    \   **dependencies** — 包含依赖项的部分。\n*   **org** — 依赖的组织。\n*   **name** — 依赖名称。\n\
    *   **rev** — 版本。\n*   **project** — 项目根元素。\n*   **target** — 目标元素。\n\n```xml\n\
    <project name = \"test\" default = \"resolve\" xmlns:ivy=\"antlib:org.apache.ivy\"\
    \ >\n<target name=\"resolve\">\n  ivy:settings defaultCache = \"${cache.dir}\"\
    \ defaultResolver = \"ibiblio\" checkUpToDate = \"false\" />\n  <resolvers>\n\
    \     <ibiblio name = \"ibiblio\" />\n     <filesystem name = \"internal\" >\n\
    \      <ivy pattern = \"${repository.dir}/[module]/ivy-[revision].xml\" />\n \
    \     <artifact pattern = \"${repository.dir}/[module]/[artifact]-[revision].[ext]\"\
    \ />\n     </filesystem>\n  </resolvers>\n  <modules>\n     <module organisation\
    \ = \"tutorialspoint\" name = \".*\" resolver = \"internal\" />\n  </modules>\n\
    \  <ivy:retrieve pattern=\"lib/[artifact]-[revision].[ext]\"/>\n</target>\n</project>\n\
    ```\n\n构建项目 (Building the project)\n\n我们已准备好所有文件。只需进入 `E: > ivy` 文件夹并运行 `ant`\
    \ 命令。\n\n`E: > ivy >` 将执行操作，解析依赖，你将看到以下结果。\n\n```\nBuildfile: E:\\ivy\\build.xml\n\
    [ivy:resolve] Apache Ivy 2.5.0 - 20191024435 :: https://ant.apache.org/ivy/\n\
    [ivy:resolve] :: loading settings :: jar:E:/Apache/ant-1.9.14/lib/ivy-2.5.0.jar!/org/ivy/core/settings/ivysettings.xml\n\
    [ivy:resolve] :: resolving dependencies :: com.tutorialspoint;test@Acer\n[ivy:resolve]\
    \ confs: [default]\n[ivy:resolve] found commons-lang;2.6 in public\n[ivy:resolve]\
    \ found junit;3.8.1 in public\n[ivy:resolve] :: resolution report :: resolve 375ms\
    \ :: artifacts 79ms\n-------------------------------------\n| | modules || artifacts\
    \ |\n| conf | number|search|dwnlded|evicted|| number|dwnlded|\n-------------------------------------\n\
    | default | 2 | 2 | 0 | 0 || 4 | 0 |\n-------------------------------------\n\
    [ivy:retrieve] :: retrieving :: com.tutorialspoint#test [sync]\n[ivy:retrieve]\
    \ confs: [default]\n[ivy:retrieve] 0 artifacts copied, 2 already retrieved (0kB/101ms)\n\
    BUILD SUCCESSFUL\nTotal time: 1 second\nE:\\ivy>\n```\n\n以下是重要的术。\n\n*   **conf**\
    \ — 配置，在我们的案例中我们使用默认配置。\n*   **modules** — 表示模块的总数、下载的模块等。\n*   **artifacts**\
    \ — 表示构件的总数、下载的构件等。\n\n你可以在 ivy 缓存的默认位置验证下载的文件，位于 `${ivy.default.ivy.user_dir}\
    \ > .ivy2 > cache` 文件夹。而 `${ivy.default.ivy.user_dir}` 默认是用户目录：$HOME。\n\n# 安装任务\
    \ (Install Task)\n\nInstall 任务用于将模块及其依赖安装到解析器中。当需要下载公共构件并用于私有仓库时使用它。默认情况下，用户本地仓库是用户的私有仓库，存在于\
    \ ${ivy.default.ivy.user_dir}/local。\n\n"
