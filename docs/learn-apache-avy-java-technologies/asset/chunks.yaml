    # Overview


    Apache Ivy is a very popular and very powerful dependency management tool used
    to manage dependencies in ANT based projects in the same fashion, how Apache Maven
    manages dependencies.


    Apache Ivy is Apache ANT based, follows same design principles, is a subproject
    of Apache ANT and is actively managed and supported by Apache ANT Community.


    ## Features


    Following are the important features of Apache Ivy.


    *   **ANT Based**  − Apache Ivy provides a dependencies management capability
    to ANT based projects. It is very simple to use as well.


    *   **Dependency Reports**  − Apache Ivy provides options to print dependencies
    graph in html as well as in reports format.


    *   **Non-intrusive**  − Apache Ivy don''t impose any restrictions as to be part
    of distribution. Even build files are not dependent on Apache Ivy.


    *   **Highly Flexible**  − Apache Ivy provides lots of default configurations
    and can be configured as per the requirement very easily.


    *   **Extendible**  − Apache Ivy can be extended easily. You can define your own
    repository, conflict resolvers and latest strategy.


    *   **Performance**  − Apache Ivy is built towards performance. It keeps a cache
    of library already downloaded. Looks into local repositories first to resolve
    dependencies than look into other repositories.


    *   **Transitive Dependencies**  − Apache Ivy automatically manages transitive
    dependencies if one project or library depends upon other library which may need
    another library.


    *   **Maven Repository**  − Apache Ivy follows conventions similar to Maven repository
    conventions. Apache Ivy can resolve dependencies using maven global repository.


    *   **Maven 2 POMs**  − Apache Ivy can read Maven 2 POMs as module descriptors,
    can set ivy as module descriptor. Thus it makes easy to migrate existing projects
    to IVY managed projects.


    *   **Publishing**  − Apache Ivy provides supports to publish your project and
    simplifies the multi-project environment deployment process.


    *   **Free to Use**  − Apache Ivy is open source and is free to use.


    *   **Documentation**  − Apache Ivy has a very detailed documentation and tutorials
    available to learn.


    # Environment Setup


    Apache Ivy needs Java and ANT installed on your machine as the only requirement.


    Apache Ant is distributed under the Apache Software License, a fully-fledged open
    source license certified by the open source initiative.


    The latest Apache Ant version, including its full-source code, class files, and
    documentation can be found at **http://ant.apache.org.**


    ## Installing Apache Ant


    It is assumed that you have already downloaded and installed Java Development
    Kit (JDK) on your computer. If not, please follow the instructions **here** .


    *   Ensure that the JAVA_HOME environment variable is set to the folder where
    your JDK is installed.


    *   Download the binaries from **https://ant.apache.org**


    *   Unzip the zip file to a convenient location c:\folder. using Winzip, winRAR,
    7-zip or similar tools.


    *   Create a new environment variable called **ANT_HOME**  that points to the
    Ant installation folder, in this case **c:\apache-ant-1.9.14-bin**  folder.


    *   Append the path to the Apache Ant batch file to the PATH environment variable.
    In our case this would be the **c:\apache-ant-1.9.14-bin\bin**  folder.


    ## Verifying Apache Ant Installation


    To verify the successful installation of Apache Ant on your computer, type ant
    on your command prompt.


    You should see an output similar to −


    C:\>ant -version


    Apache Ant(TM) version 1.9.14 compiled on March 12 2019


    If you do not see the above output, then please verify that you have followed
    the installation steps properly.


    ## Installing Apache Ivy


    *   Download the binaries from **https://ant.apache.org/ivy**


    *   Unzip the zip file to a convenient location c:\folder. using Winzip, winRAR,
    7-zip or similar tools.


    *   Copy the ivy-2.5.0.jar to **c:\apache-ant-1.9.14-bin/lib**  folder.


    ## Verifying Apache Ivy Installation


    To verify the successful installation of Apache Ivy on your computer, create following
    build file in a folder E: > ivy.


    <project name = "test ivy installation"


    default = "test" xmlns:ivy = "antlib:org.apache.ivy.ant" >


    <target name = "test" description = "Test ivy installation" >


    <ivy:settings />


    </target>


    </project>


    You should see an output similar to −


    C:\>ant


    Buildfile: E:\ivy\build.xml


    test:


    BUILD SUCCESSFUL


    Total time: 2 seconds


    ## Installing Eclipse


    This tutorial also covers integration of Ant with Eclipse IDE. Hence, if you have
    not installed Eclipse already, please download and install Eclipse


    To install Eclipse −


    *   Download the latest Eclipse binaries from **www.eclipse.org**


    *   Unzip the Eclipse binaries to a convenient location, say c:\folder


    *   Run Eclipse from c:\eclipse\eclipse.exe


    # Terminology


    Consider the following example ivy.xml to understand Ivy terminology.


    <? xml version = "1.0" encoding = "ISO-8859-1" ?>


    <ivy-module version = "2.0"


    xmlns:xsi = "http://www.w3.org/2001/XMLSchema-instance"


    xsi:noNamespaceSchemaLocation = "http://ant.apache.org/ivy/schemas/ivy.xsd" >


    <info organisation = "com.tutorialspoint" module = "ivy-test" status = "integration"
    >


    </info>


    <dependencies>


    <dependency org = "commons-lang" name = "commons-lang" rev = "2.6" />


    </dependencies>


    </ivy-module>


    ## Ivy Terms


    Following are the important terms of Ivy Eco-System.


    *   **Organisation**  − As name suggests, it refers to the name of the company,
    individual developer or team name who creates the project or library. For example,
    com.tutorialspoint.


    *   **Module**  − As name suggests, it refers to the reusable unit or module.
    A module generally have a version attached to it. For example commons-lang, or
    ivy-test etc.


    *   **Module Descriptor**  − Module descriptor refers to ivy.xml file which describes
    a module. A module descriptor contains the identifier (org, name, branch and version),
    artifacts published, configurations and dependencies.


    *   **Artifact**  − Artifact refers to a single file as deliverable. For example,
    a jar file. Artifact can be of type: zip, gz etc. Jar, Source Jar, Javadoc Jar
    are various artifacts of a module.


    *   **Type**  − Type identifies the artifact category like jar, war , src, doc
    etc.


    *   **Artifact file name extension**  − Artifact extension like .jar, ,zip, .gz
    etc.


    *   **Module Revision**  − A unique revision number of the module or its version
    number.


    *   **Status of Revision**  − Status of revision indicates the stability of the
    revision. Following are the important value of status −


    *   **integration**  − Represents continous development, nightly build etc.


    *   **milestone**  − Represents a distribution but not finalized.


    *   **release**  − Represents tested and completed, a major version.'
