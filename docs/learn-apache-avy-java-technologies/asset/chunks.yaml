    Let''s create Tester.java, build.xml and ivy.xml in a new project under **E: >
    ivy2**  folder similar to as described in **IVY - Resolve Task**  chapter. Create
    a settings folder under **E: > ivy2** . Create the ivysettings.xml in the settings
    folder.


    build.xml


    <project name = "test" default = "resolve" xmlns:ivy = "antlib:org.apache.ivy.ant"
    >


    <property name = "build.dir" value = "build" />


    <property name = "base.dir" value = "" />


    <target name = "resolve" description = "resolve dependencies" >


    <ivy:resolve />


    </target>


    <target name = "compile" depends = "resolve" description = "Compile" >


    <mkdir dir = "build/classes" />


    <javac srcdir = "src" destdir = "build/classes" >


    <classpath refid = "new.classpath" />


    </javac>


    </target>


    </project>


    ivy.xml


    <? xml version = "1.0" encoding = "ISO-8859-1" ?>


    <ivy-module version = "2.0" xmlns:xsi = "http://www.w3.org/2001/XMLSchema-instance"


    xsi:noNamespaceSchemaLocation = "http://ant.apache.org/ivy/schemas/ivy.xsd" >


    <info organisation = "org.apache" module = "chained-resolvers" />


    <dependencies>


    <dependency org = "commons-lang" name = "commons-lang" rev = "2.6" conf = "default"
    />


    <dependency org = "com.tutorialspoint" name = "test" rev = "1.0" />


    </dependencies>


    </ivy-module>


    Here we''ve added two dependencies,one of commons-lang library and another as
    test which we published in **IVY - Publish Task**  chapter.


    ivysettings.xml


    <ivysettings>


    <settings defaultResolver = "multiresolver" />


    <resolvers>


    <chain name = "multiresolver" >


    <filesystem name = "libraries" >


    <artifact pattern = "${ivy.settings.dir}/repository/[artifact]-[revision].[ext]"
    />


    </filesystem>


    <ibiblio name = "ibiblio" m2compatible = "true" />


    </chain>


    </resolvers>


    </ivysettings>


    Here we''ve added created a composite resolver using chain resolver which has
    two resolver, one named libraries to locate libaries on local repository and one
    named ibiblio on maven public repository.


