- fmt: "\n| ID | Name | Description |\n| :--- | :--- | :--- |\n| 8 | VFS (Standard)\
    \ | Locates Ivy files and artifacts on repositories which can be accessed using\
    \ Apache Commons VFS. |\n| 9 | SSH (Standard) | Locates Ivy files and artifacts\
    \ on repositories which can be accessed using SSH. |\n| 10 | SFTP (Standard) |\
    \ Locates Ivy files and artifacts on repositories which can be accessed using\
    \ SFTP. |\n| 11 | Jar (Standard) | Locates Ivy files and artifacts on repositories\
    \ within a jar. |\n| 12 | Chain (Composite) | Delegates the search to a chain\
    \ of sub resolvers. |\n| 13 | Dual (Composite) | Delegates the search to a one\
    \ resolver and artifacts to another. |\n| 14 | OBR (Standard) | Resolves modules\
    \ as OSGi bundles listed by an OSGi `obr.xml`. |\n| 15 | Eclipse updatesite (Standard)\
    \ | Resolves modules as OSGi bundles which are hosted on an Eclipse update site.\
    \ |\n| 16 | OSGi-agg (Composite) | Delegates the search to a chain of sub resolvers\
    \ supporting OSGi bundles. |\n\nLet's create `Tester.java`, `build.xml` and `ivy.xml`\
    \ in a new project under `E: > ivy2` folder similar to as described in the `IVY\
    \ - Resolve Task` chapter. Create a settings folder under `E: > ivy2`. Create\
    \ the `ivysettings.xml` in the settings folder.\n\n### build.xml\n\n```xml\n<project\
    \ name = \"test\" default = \"resolve\" xmlns:ivy = \"antlib:org.apache.ivy.ant\"\
    >\n  <property name = \"build.dir\" value = \"build\" />\n  <property name = \"\
    base.dir\" value = \"\" />\n  <target name = \"resolve\" description = \"resolve\
    \ dependencies\">\n    <ivy:resolve />\n  </target>\n  <target name = \"compile\"\
    \ depends = \"resolve\" description = \"Compile\">\n    <mkdir dir = \"build/classes\"\
    \ />\n    <javac srcdir = \"src\" destdir = \"build/classes\">\n      <classpath\
    \ refid = \"new.classpath\" />\n    </javac>\n  </target>\n</project>\n```\n\n\
    ### ivy.xml\n\n```xml\n<?xml version = \"1.0\" encoding = \"ISO-8859-1\"?>\n<ivy-module\
    \ version = \"2.0\" xmlns:xsi = \"http://www.w3.org/2001/XMLSchema-instance\"\
    \ xsi:noNamespaceSchemaLocation = \"http://ant.apache.org/ivy/schemas/ivy.xsd\"\
    >\n  <info organisation = \"org.apache\" module = \"chained-resolvers\" />\n \
    \ <dependencies>\n    <dependency org = \"commons-lang\" name = \"commons-lang\"\
    \ rev = \"2.6\" conf = \"default\" />\n    <dependency org = \"com.tutorialspoint\"\
    \ name = \"test\" rev = \"1.0\" />\n  </dependencies>\n</ivy-module>\n```\n\n\
    Here we've added two dependencies, one of `commons-lang` library and another as\
