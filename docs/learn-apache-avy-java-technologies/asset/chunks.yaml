    # Retrieve Task


    retrieve task is used to resolve dependencies to a specified location in project
    workspace.


    Let''s create Tester.java, build.xml and ivy.xml as described in **IVY - Resolve
    Task**  chapter.


    Update the build.xml to use the ivy retrieve task.


    build.xml


    <project name = "test" default = "resolve" xmlns:ivy = "antlib:org.apache.ivy.ant"
    >


    <target name = "resolve" description = "resolve dependencies" >


    <ivy:resolve />


    <ivy:retrieve sync = "true" type = "jar" />


    </target>


    </project>


    Following are the important terms.


    *   **sync**  − sync true ensure that lib directory is up-to-date and any extra
    file gets deleted.


    *   **type**  − type directs ivy to copy only specified type of artifacts like
    jar. Source jar, javadoc jar will be ignored. type for source jar is src or source
    and doc or bundle for javadoc jar.


    retrieve tasks copies the resolved dependencies in the lib directory of the project
    by default and can be changed using pattern attribute.


    ## Building the project


    As we''ve all the files ready. Just go the console. Navigate to **E: > ivy **
    folder and run the ant command.


    E:\ivy > ant


    Ivy will come into action, resolving the dependencies, you will see the following
    result.


    Buildfile: E:\ivy\build.xml


    resolve:


    [ivy:resolve] :: Apache Ivy 2.5.0 - 20191020104435 :: https://ant.apache.org/ivy


    / ::


    [ivy:resolve] :: loading settings :: url = jar:file:/E:/Apache/apache-ant-1.9.14


    /lib/ivy-2.5.0.jar!/org/apache/ivy/core/settings/ivysettings.xml


    [ivy:resolve] :: resolving dependencies :: com.tutorialspoint#test;working@Acer-


    PC


