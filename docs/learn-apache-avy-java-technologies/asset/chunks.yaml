    - [Publish Task](#text00012.html_id_Toc68076084)\n- [Info Task](#text00013.html_id_Toc68076085)\n\
    - [Resolvers](#text00014.html_id_Toc68076086)\n- [Local Repository](#text00015.html_id_Toc68076087)\n\
    - [Shared Repository](#text00016.html_id_Toc68076088)\n- [Public repository](#text00017.html_id_Toc68076089)\n\
    \n# Overview\n\nApache Ivy is a very popular and very powerful dependency management\
    \ tool used to manage dependencies in ANT based projects in the same fashion,\
    \ how Apache Maven manages dependencies.\n\nApache Ivy is Apache ANT based, follows\
    \ same design principles, is a subproject of Apache ANT and is actively managed\
    \ and supported by Apache ANT Community.\n\n## Features\n\nFollowing are the important\
    \ features of Apache Ivy.\n\n- **ANT Based** — Apache Ivy provides a dependencies\
    \ management capability to ANT based projects. It is very simple to use as well.\n\
    - **Dependency Reports** — Apache Ivy provides options to print dependencies graph\
    \ in html as well as in reports format.\n- **Non-intrusive** — Apache Ivy don't\
    \ impose any restrictions as to be part of distribution. Even build files are\
    \ not dependent on Apache Ivy.\n- **Highly Flexible** — Apache Ivy provides lots\
    \ of default configurations and can be configured as per the requirement very\
    \ easily.\n- **Extendible** — Apache Ivy can be extended easily. You can define\
    \ your own repository, conflict resolvers and latest strategy.\n- **Performance**\
    \ — Apache Ivy is built towards performance. It keeps a cache of library already\
    \ downloaded. Looks into local repositories first to resolve dependencies than\
    \ look into other repositories.\n- **Transitive Dependencies** — Apache Ivy automatically\
    \ manages transitive dependencies if one project or library depends upon other\
    \ library which may need another library.\n- **Maven Repository** — Apache Ivy\
    \ follows conventions similar to Maven repository conventions. Apache Ivy can\
    \ resolve dependencies using maven global repository.\n- **Maven 2 POMs** — Apache\
    \ Ivy can read Maven 2 POMs as module descriptors, can set ivy as module descriptor.\
    \ Thus it makes easy to migrate existing projects to IVY managed projects.\n-\
    \ **Publishing** — Apache Ivy provides supports to publish your project and simplifies\
    \ the multi-project environment deployment process.\n- **Free to Use** — Apache\
    \ Ivy is open source and is free to use.\n- **Documentation** — Apache Ivy has\
    \ a very detailed documentation and tutorials available to learn.\n\n# Environment\
    \ Setup\n\nApache Ivy needs Java and ANT installed on your machine as the only\
    \ requirement.\n\nApache Ant is distributed under the Apache Software License,\
    \ a fully-fledged open source license certified by the open source initiative.\n\
    \nThe latest Apache Ant version, including its full-source code, class files,\
    \ and documentation can be found at `http://ant.apache.org`.\n\n## Installing\
    \ Apache Ant\n\nIt is assumed that you have already downloaded and installed Java\
    \ Development Kit (JDK) on your computer. If not, please follow the instructions\
    \ here.\n\n- Ensure that the `JAVA_HOME` environment variable is set to the folder\
    \ where your JDK is installed.\n- Download the binaries from `https://ant.apache.org`\n\
    - Unzip the zip file to a convenient location `c:\\folder`. using Winzip, winRAR,\
    \ 7-zip or similar tools.\n- Create a new environment variable called `ANT_HOME`\
    \ that points to the Ant installation folder, in this case `c:\\apache-ant-1.9.14-bin`\
    \ folder.\n- Append the path to the Apache Ant batch file to the `PATH` environment\
    \ variable. In our case this would be the `c:\\apache-ant-1.9.14-bin\\bin` folder.\n\
    \n## Verifying Apache Ant Installation\n\nTo verify the successful installation\
    \ of Apache Ant on your computer, type `ant` on your command prompt.\n\nYou should\
    \ see an output similar to —\n\n```\nC:\\>ant -version\nApache Ant(TM) version\
    \ 1.9.14 compiled on March 12 2019\n```\n\nIf you do not see the above output,\
    \ then please verify that you have followed the installation steps properly.\n\
    \n## Installing Apache Ivy\n\n- Download the binaries from `https://ant.apache.org/ivy`\n\
    - Unzip the zip file to a convenient location `c:\\folder`. using Winzip, winRAR,\
    \ 7-zip or similar tools.\n- Copy the `ivy-2.5.0.jar` to `c:\\apache-ant-1.9.14-bin/lib`\
    \ folder.\n\n## Verifying Apache Ivy Installation\n\nTo verify the successful\
    \ installation of Apache Ivy on your computer, create following build file in\
    \ a folder `E: > ivy`.\n\n```xml\n<project name = \"test ivy installation\" default\
    \ = \"test\" xmlns:ivy = \"antlib:org.apache.ivy.ant\" >\n  <target name = \"\
    test\" description = \"Test ivy installation\" >\n    <ivy:settings />\n  </target>\n\
    </project>\n```\n\nYou should see an output similar to —\n\n```\nC:\\>ant\nBuildfile:\
    \ E:\\ivy\\build.xml\ntest:\nBUILD SUCCESSFUL\nTotal time: 2 seconds\n```\n\n\
    ## Installing Eclipse\n\nThis tutorial also covers integration of Ant with Eclipse\
    \ IDE. Hence, if you have not installed Eclipse already, please download and install\
    \ Eclipse\n\nTo install Eclipse —\n\n- Download the latest Eclipse binaries from\
    \ `www.eclipse.org`\n- Unzip the Eclipse binaries to a convenient location, say\
    \ `c:\\folder`\n- Run Eclipse from `c:\\eclipse\\eclipse.exe`\n\n# Terminology\n\
    \nConsider the following example `ivy.xml` to understand Ivy terminology.\n\n\
    ```xml\n<?xml version = \"1.0\" encoding = \"ISO-8859-1\" ?>\n<ivy-module version\
    \ = \"2.0\" xmlns:xsi = \"http://www.w3.org/2001/XMLSchema-instance\" xsi:noNamespaceSchemaLocation\
    \ = \"http://ant.apache.org/ivy/schemas/ivy.xsd\" >\n  <info organisation = \"\
    com.tutorialspoint\" module = \"ivy-test\" status = \"integration\" >\n  </info>\n\
    \  <dependencies>\n    <dependency org = \"commons-lang\" name = \"commons-lang\"\
    \ rev = \"2.6\" />\n  </dependencies>\n</ivy-module>\n```\n\n## Ivy Terms\n\n\
    Following are the important terms of Ivy Eco-System.\n\n- **Organisation** — As\
    \ name suggests, it refers to the name of the company, individual developer or\
    \ team name who creates the project or library. For example, `com.tutorialspoint`.\n\
    - **Module** — As name suggests, it refers to the reusable unit or module. A module\
    \ generally have a version attached to it. For example `commons-lang`, or `ivy-test`\
    \ etc.\n- **Module Descriptor** — Module descriptor refers to `ivy.xml` file which\
    \ describes a module. A module descriptor contains the identifier (`org`, `name`,\
    \ `branch` and `version`), artifacts published, configurations and dependencies.\n\
    - **Artifact** — Artifact refers to a single file as deliverable. For example,\
    \ a `jar` file. Artifact can be of type: `zip`, `gz`. Jar, Source Jar, Javadoc\
    \ Jar are various artifacts of a module.\n- **Type** — Type identifies the artifact\
    \ category like `jar`, `war`, `src`, `doc` etc.\n- **Artifact file name extension**\
    \ — Artifact extension like `.jar`, `.zip`, `.gz` etc.\n- **Module Revision**\
    \ — A unique revision number of the module or its version number.\n- **Status\
    \ of Revision** — Status of revision indicates the stability of the revision.\
    \ Following are the important value of status —\n  - **integration** — Represents\
    \ continous development, nightly build etc.\n  - **milestone** — Represents a\
    \ distribution but not finalized.\n  - **release** — Represents tested and completed,\
    \ a major version.\n"
