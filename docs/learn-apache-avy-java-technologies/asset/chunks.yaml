    | | modules || artifacts |


    | conf | number| search|dwnlded|evicted|| number|dwnlded|


    ---------------------------------------------------------------------


    | default | 2 | 2 | 0 | 0 || 4 | 0 |


    ---------------------------------------------------------------------


    [ivy:retrieve] :: retrieving :: com.tutorialspoint#test [sync]


    [ivy:retrieve] confs: [default]


    [ivy:retrieve] 0 artifacts copied, 2 already retrieved (0kB/2756ms)


    BUILD SUCCESSFUL


    Total time: 31 seconds


    You can verify the downloaded files in project lib directory.


    # Cachepath Task


    cachepath task is used to create an ANT classpath with resolved artifacts present
    in the cache. As ANT needs jars to be classpath to compile java files, Ivy cachepath
    builds the classpath.


    Let''s create Tester.java, build.xml and ivy.xml as described in **IVY - Resolve
    Task**  chapter.


    Update the build.xml to use the ivy retrieve task.


    build.xml


    <project name = "test" default = "resolve" xmlns:ivy = "antlib:org.apache.ivy.ant"
    >


    <target name = "resolve" description = "resolve dependencies" >


    <ivy:resolve />


    <ivy:cachepath pathid = "new.classpath" />


    </target>


    <target name = "compile" depends = "resolve" description = "Compile" >


    <mkdir dir = "build/classes" />


    <javac srcdir = "src" destdir = "build/classes" >


    <classpath refid = "new.classpath" />


    </javac>


    </target>


    </project>


    Following are the important terms.


    *   **pathid**  − id of the classpath where cached jars are present.


    retrieve tasks copies the resolved dependencies in the lib directory of the project
    by default and can be changed using pattern attribute.


