    ```xml

    <ivysettings>

    <property name = "ivy.shared.default.root" value = "${ivy.default.ivy.user.dir}/shared"
    override = "false" />

    <property name = "ivy.shared.default.ivy.pattern" value = "[organisation]/[module]/[revision]/[type]s/[artifact].[ext]"
    override = "false" />

    <property name = "ivy.shared.default.artifact.pattern" value = "[organisation]/[module]/[revision]/[type]s/[artifact].[ext]"
    override = "false" />

    <resolvers>

    <filesystem name = "shared" >

    <ivy pattern = "${ivy.shared.default.root}/${ivy.shared.default.ivy.pattern}"
    />

    <artifact pattern = "${ivy.shared.default.root}/${ivy.shared.default.artifact.pattern}"
    />

    </filesystem>

    </resolvers>

    </ivysettings>

    ```


    # 公共存储库


    公共存储库是指可以通过互联网访问并包含第三方模块的存储库。默认情况下，m2 兼容模式下的 `ibiblio` 是公共存储库。它也被 maven 2 公共存储库。


    ## 覆盖 ivysettings 默认设置


    默认情况下，Ivy 在 `ivy.jar` 中的 `ivysettings.xml` 中包含配置。


    ### ivysettings.xml

    ```xml

    <ivysettings>

    <settings defaultResolver = "default" />

    <include url = "${ivy.default.settings.dir}/ivysettings-public.xml" />

    <include url = "${ivy.default.settings.dir}/ivysettings-shared.xml" />

    <include url = "${ivy.default.settings.dir}/ivysettings-local.xml" />

    <include url = "${ivy.default.settings.dir}/ivysettings-main-chain.xml" />

    <include url = "${ivy.default.settings.dir}/ivysettings-default-chain.xml" />

    </ivysettings>

    ```


    要覆盖公共存储库设置，请更新 `ivysettings-public.xml` 的内容，或者在项目的设置文件夹中创建 `ivysettings.xml`。


    ### ivysettings.xml

    ```xml

    <ivysettings>

    <settings defaultResolver = "default" />

    <include url = "http://customserver/ivy/ivysettings-public.xml" />

    <include url = "${ivy.default.settings.dir}/ivysettings-shared.xml" />

    <include url = "${ivy.default.settings.dir}/ivysettings-local.xml" />

    <include url = "${ivy.default.settings.dir}/ivysettings-main-chain.xml" />

    <include url = "${ivy.default.settings.dir}/ivysettings-default-chain.xml" />

    </ivysettings>

    ```


    更新默认的 `ivysetting-public.xml` 内容。


    ### 原始 - ivysetting-public.xml

    ```xml

    <ivysettings>

    <resolvers>

    <ibiblio name = "public" m2compatible = "true" />

    </resolvers>

    </ivysettings>

    ```


    ### 更新 - ivysetting-public.xml

    ```xml

    <ivysettings>

    <resolvers>

    <filesystem name = "public" >

    <ivy pattern = "/path/to/my/public/rep/[organisation]/[module]/ivy-[revision].xml"
    />

    <artifact pattern = "/path/to/my/public/rep/[organisation]/[module]/[artifact]-[revision].[ext]"
    />

    </filesystem>

    </resolvers>

    </ivysettings>

    ```


