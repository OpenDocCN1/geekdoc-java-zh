  \n`java.math.BigInteger` 和 `java.math.BigDecimal` 类可以表示任意大的整数和浮点数。\n\n### 计算大整数的算术平均值\
  \ ★\n\n\n\n\n要计算两个数字的算术平均值，将它们相加并除以 2。如果这两个值之和没有超过可以表示的最大数字，这种方法就非常有效。如果发生溢出，结果将是错误的。计算机科学中的某些算法也可以处理这个问题，但我们可以稍微简化一下，在每种情况下采用更高阶的数据类型。例如，如果我们想计算两个\
  \ `int` 变量的平均值，我们将这两个 `int` 转换为 `long`，相加、除法，然后转换回 `int`。对于 `long` 数据类型，已经没有更大的原始数据类型了，但在这种情况下可以很好地使用\
  \ `BigInteger` 类型。\n\n### 任务：\n\n* 计算两个 `long` 值的算术平均值，以确保不会溢出并产生错误结果。结果应仍是一个 `long`。\n\
  \n### 电话中的数字报对 ★\n\nBonny Brain 通过一笔新交易赚了大量的钱。这个数字非常大，你无法直接通过电话播报；它必须分段传达。\n\n![展览展示了一只手拿着一部\
  \ Aye 手机，屏幕上显示着文字 crew，随后是一系列数字。](img/un02_01.jpg)\n\n### 任务：\n\n* 编写一个新方法 `BigInteger\
  \ completeNumber(int... parts)`，它接收变数量的数字并在最后返回巨大的总数。\n\n### 示例：\n\n* `completeNumber(123,\
  \ 22, 989, 77, 9)` 返回一个值为 `12322989779` 的 `BigInteger`。\n\n### 开发用于分数的类并截断分数 ★★\n\
  \nBonny Brain 正在尝试一种朗姆酒 Punch 的新配方。在制作过程中不断出现像“1/4 升葡萄汁”或“1/2 升朗姆”这样的分数。为了派对，她准备了\
  \ 100 份，出现了类似“100/4 升”的分数。这些分数可以被约简，以便 Bonny Brain 知道例如必须购买 25 升葡萄汁。\n\n### 任务：\n\
  \n1. 创建一个新类 `Fraction`。\n2. 有一个构造函数 `Fraction(int numerator, int denominator)`，将分子和分母存储在\
  \ `public final` 变量中。\n    * 考虑是否存在错误的参数，我们应该通过异常报告它们。\n    * 每个创建的分数都应该自动简化。使用\
  \ `BigInteger` 的 `gcd(…)` 方法，该方法计算最大公约数（gcd）。记住：分子和分母的 gcd 是同时整除它们的最大数字。你可以通过将分子和分母除以这个数字来简化分数。\n\
  \    * 分子和分母都可以为负数，但此时你可以翻转符号使两个值都变为正数。\n    * 所有对象都应该是不可变的，因此由于它们在通过构造函数初始化后不应被更改，变量可以是\
  \ `public` 的。句话说，`Fraction` 类不包含任何 setter（set 方法）。\n3. 添加构造函数 `Fraction(int value)`，其中分母自动变为\
  \ `1`。\n4. 实现一个相乘分数的方法并检测溢出。\n5. 实现一个方法 `reciprocal()`，返回分数的倒数，即交换分子和分母。得益于这个方法，可以实现分除法。\n\
  6. `Fraction` 应该扩展 `java.lang.Number` 并实现所有强制方法。\n7. `Fraction` 应该实现 `Comparable`，因为分数可以转换为小数，而小数具有自然顺序。\n\
  8. `Fraction` 应该正确实现 `equals(…)` 和 `hashCode()`。\n9. 实现一个 `toString()` 方法，返回尽可能简洁的字符串。\n\
