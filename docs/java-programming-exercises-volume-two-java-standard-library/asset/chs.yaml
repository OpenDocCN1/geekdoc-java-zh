  \n**图 4.1** `Thread` 类的 UML 图。\n\n### 为挥手和挥旗创建线程 ★\n\n有一场为了庆祝 CiaoCiao 船长举游行。他站在船的甲板上，一只手挥手，另一只手挥着帜。\n\
  \n**练习：**\n\n*   Java 中的线程始终执行 `Runnable` 类型的代码。`Runnable` 是一个函数接口，在 Java 中实现函数接口有两种方法：类和\
  \ lambda 表达式。编写两个 `Runnable` 的实现：一个使用类，另一个使用 lambda 表达式。\n*   在两个 `Runnable` 实现中都放入一个\
  \ 50 次的循环。其中一个 `Runnable` 应该在屏幕上输出“wink”，另一个的输出应该是“wave flag”。\n*   创建一个 `Thread`\
  \ 对象并传入 `Runnable`。然后启动线程。不要启动五十个线程，只启动两个！\n\n**扩展：** 每个线程的 `run()` 方法应该包含语句 `System.out.println(Thread.currentThread());`。屏幕上将显示什么？\n\
  \n假设 CiaoCiao 船长还有几条手臂可以挥动。可以创建多少个线程，直到系统停滞运行？观察 Windows 任务管理器中的内存使用情况。你能估算出一个线程的“成本”是多少吗？\n\
  \n### 不再挥旗：结束线程 ★\n\n可以使用 `stop()` 杀死线程——该方法已被废用（deprecated）几十年，但可能永远不会被删除——或者通过\
  \ `interrupt()` 礼貌地请求它自杀。但要这样做，线程必须配合并通过 `isInterrupted()` 检查是否存在此类终止请求。\n\nCiaoCiao\
  \ 船长站在船上，眨着眼睛并挥着旗帜。当情况变得严重时，他必须为人们停止这种娱乐。\n\n**练习：**\n\n*   编写一个带有两个 `Runnable`\
  \ 实现的程序，原则上它们会无限地眨着眼睛并挥舞旗帜，除非发生中断。因此，`run()` 方法应该使用 `Thread.currentThread().isInterrupted()`\
  \ 来测试是否存在中断，然后退出循环。\n*   在循环中建立延迟。复制以下代码：\n\n```\ntry { Thread.sleep( 2000 ); }\
  \ catch ( InterruptedException e ) { Thread.currentThread().interrupt(); }\n```\n\
  *   主程序应该通过 `JOptionPane.showInputDialog (String)` 对输入做出响应，以便命令 `endw` 停止眨眼，`endf`\
  \ 停止挥舞旗帜。\n\n### 参数化 Runnable ★★\n\n看一眼下面的代码发现，两个 `Runnable` 实现非常相似，仅在于屏幕输出不同：\n\
  \n```\n// Runnable 1\nclass Wink implements Runnable {\n  @Override public void\
  \ run() {\n    for ( int i = 0; i < 50; i++)\n      System.out.printf( \"Wink; %s%n\"\
  , Thread.currentThread() );\n      //                        ^^^^\n  }\n}\nRunnable\
  \ winker = new Wink();\n\n// Runnable 2\nRunnable flagWaver = () -> {\n  for ( int\
  \ i = 0; i < 50; i++)\n    System.out.printf( \"Wave flag; %s%n\", Thread.currentThread()\
  \ );\n    //                      ^^^^^^^^\n};\n```\n\n代码重复很少是，尽管这应该被改变。\n\n**练习：**\n\
  \n*   思考如何向 `Runnable` 传递数据。\n*   实现一个参数化的 `Runnable`，以便在上面的循环中：\n    *   屏幕输出以及\n\
  \    *   重复次数可以自由决定。\n*   重写挥手和挥旗的程序，将参数化的 `Runnable` 传递给线程执行。\n\n## 执行与空闲\n\n看一眼下面的代码发现，两个\
  \ `Runnable` 实现非常相似，仅在于屏幕输出：\n\n（等待，这里的文本在提供的源中似乎重复或合并了。我将继续按照剩余块提供的逻辑）。\n\n###\
  \ 通过睡眠线程实现延迟\n\n*sleep* 程序可以处于以下状态：*运行 (running)*、*等待 (waiting)*、*阻塞 (blocked)*、*已终止\
  \ (terminated)*。\n\n**练习：**\n\n*   在命令行重新实现 `sleep`。它应该接收以下输入：\n\n```\n$java Sleep\
  \ 22\n```\nJava 程序应该睡眠相应的秒数。时长允许后缀：\n\n    *   `s` 秒（默认）。\n    *   `m` 分。\n    *\
  \   `h` 小时。\n    *   `d` 天。\n\n如果传递了多个值，它们将相加得到等待时间。\n\n*   可能会出现各种问题，例如，如果没有传递数字或数字太大。发生错误时，通过\
  \ `System.exit(int)` 退出代码。\n\n**示例：**\n\n*   **合法调用：**\n\n```\n$java Sleep 1m\n\
  $java Sleep 1m 2s\n$java Sleep 1h 3h 999s\n```\n\n*   **不合法调用：**\n\n```\n$java Sleep\n\
  $java Sleep three\n$java Sleep 1y\n$java Sleep 999999999999\n```\n\n**提示：** 构建程序，使得三个核心部分清晰可见：\n\
  \n1.  运行命令行并分析参数。\n2.  将单位转换为秒。\n3.  实际的睡眠部分。\n\n### 监控文件变化的线程 ★\n\n成功掠夺后，所有新宝藏都会系统地添加到清单列表中。这保存在简单的文件中。大大脑希望在文件变化时收到通知。\n\
  \n**练习：**\n\n1.  编写一个类 `FileChangeWatcher`，带有构造函数 `FileChangeWatcher(String filename)`。\n\
  2.  实现 `Runnable`。\n3.  每半秒输出文件名、文件大小和 `Files.getLastModifiedTime(path)`。\n4.  使用\
  \ `getLastModifiedTime(…)` 检查文件是否变化。如果文件变化，则打印消息。这一切应该永远进行；每个新变化都应该报告。\n5.  扩展：我们现在希望更灵活地对变化做出反应。因此，我们希望能够在构造函数中传递一个\
  \ `java.util.function.Consumer` 对象。该消费者应该被 `FileChangeWatcher` 存储，并在发生变化时始终调用 `accept(Path)`\
  \ 方法。\n\n### 捕获异常 ★\n\n检查异常和非检查异常之间的区别很重要，因为如果非检查异常未被捕获，可能会升级到到达执行线程，然后由虚拟机终止。这是由运行时环境自动完成的，我们会在错误通道礼貌地收到消息，但我们无法恢复该线程。\n\
  \n\n\n\n\n在本地线程或全局所有线程中，都可以安装一个 `UncaughtExceptionHandler`，当异常终止线程时，该处理器会收到通知。它可以用于以下四种场景：\n\
  \n1.  可以在单个线程上设置 `UncaughtExceptionHandler`。每当该线程发生未处理的异常时，线程将终止，并向设置的 `UncaughtExceptionHandler`\
  \ 发送通知。\n2.  可以在线程组上设置 `UncaughtExceptionHandler`。\n3.  可以为所有线程全局设置 `UncaughtExceptionHandler`。\n\
  4.  `main` 线程具有特殊性，其特殊之处在于 JVM 会自动创建它并执行主程序。当然，`main` 线程中也可能存在未检查的异常，这些异常可以通过 `UncaughtExceptionHandler`\
  \ 进行报告。然而，这里有一个有趣的特性：在 `main(…)` 方法上可以 `throws`，因此受检异常可以返回 JVM。在发生受检异常的情况下，设置的 `UncaughtExceptionHandler`\
  \ 也会收到通知。\n\n处理过程按级联方式进行：如果存在未检查的异常，JVM 首先查找单个线程上是否设置了 `UncaughtExceptionHandler`。如果没有，它会在线程组中查找\
  \ `UncaughtExceptionHandler`，然后查找全局处理器并发送通知。\n\n### 练习：\n\n* 运行一个因除以 `0` 而被终止的线程。使用你自己的全局\
  \ `UncaughtExceptionHandler` 来记录此异常。\n* 启动第二个线程，该线程拥有一个忽略异常的本地 `UncaughtExceptionHandler`，这样就不会显示任何消息了。\n\
  * 如果 `main(…)` 方法声明 `throws Exception` 且方法体为 `URI.create(\"captain\").toURL()`，全局的\
  \ `UncaughtExceptionHandler` 会被调用吗？\n\n## 线程池与结果\n\n对于 Java 开发者来说，自己创建线程并与程序代码关联并不是最好的方法；将程序代码与物理执行分离通常更合理。这在\
  \ Java 中通过 `Executor` 实现。这使得程序代码与当前线程分离，并允许同一个线程多次用于不同的程序代码。\n\n在 Java 库中，三个三个 `Executor`\
  \ 实现：`ThreadPoolExecutor`、`ScheduledThreadPoolExecutor` 和 `ForkJoinPool`。`ThreadPoolExecutor`\
  \ 和 `ForkJoinPool` 类型实现了线程池，用于一组现有线程，以便将任务传递给现有的空闲线程。\n\nJava 中后台运行的每个操作都由线程执行。这些线程要么是被显式创建并启动的，要么通过\
  \ `Executor` 或内部线程池间接利用。封装并发代码有两个重要的接口：`Runnable` 和 `Callable`。`Runnable` 可以直接传递给\
  \ `Thread` 构造函数，而 `Callable` 不能传递给 `Thread`；对于 `Callable` 需要一个 `Executor`。`Callable`\
  \ 也会返回结果，`Supplier` 也是如此，但它没有参数可以传递。对于 `Runnable` 无法返回也无法传递。`run()` 方法不抛出异常，而 `call()`\
  \ 在方法签名中有 `throws Exception`，因此它可以传递任何异常。\n\n`Runnable` 和 `Callable` 接口的 UML 图\n\
  \n![展示了使用统一建模语言（UML）绘制的可运行（左侧）和可调用（右侧）块。](img/un04_01.jpg)\n\n到目前为止，我们一直都是自己构建线程并只使用\
  \ `Runnable`。接下来的练习将关于线程池以及 `Callable` 的内容。\n\n### 使用线程池 ★★\n\n复活节快快到了，Bonny Brain\
  \ 带着她的团队成员装成温温人来到一家孤儿院派发礼物。\n\n练习：\n\n* 使用 `Executors.newCachedThreadPool()` 创建一个\
  \ `ExecutorService`，这就是线程池。\n* 创建一个包含礼物的字符串数组。\n* Bonny Brain 在 `main` 线程中处理每份礼物，并每隔\
  \ 1–2 秒将其传递给一个团队成员（即线程池中的一个线程）。\n* 团队成员是线程池中的线程。他们执行 Bonny Brain 的命令来分发礼物。完成这一操作需要\
  \ 1 到 4 秒不等。\n* 流程如下：礼物分发由 `Runnable`（即实际操作）实现。从线程池中选择一个空闲线程（团队成员）并执行该 `Runnable`。`Runnable`\
  \ 需要一种方式从 Bonny Brain 处接收礼物。\n\n### 获取网页的最后修改时间 ★★\n\n以下类实现了一个方法，返回网页最后一次修改的时间戳（如果数据不可用，则时间被设置为\
  \ 1970/1/1）。服务器应该发送 UTC ± 0 的时区时间。\n\n```java\nimport java.io.IOException;\nimport\
  \ java.net.HttpURLConnection;\nimport java.net.URL;\nimport java.time.Instant;\n\
  import java.time.ZoneId;\nimport java.time.ZonedDateTime;\n\npublic class WebChecker\
  \ {\n\n    public static void main(String[] args) throws IOException {\n      ZonedDateTime\
  \ urlLastModified = getLastModified(URI.create(\"http://www.tutego.com/index.html\"\
  ).toURL());\n      System.out.println(urlLastModified);\n      ZonedDateTime urlLastModified2\
  \ = getLastModified(new URI.create(\"https://en.wikipedia.org/wiki/Main_Page\").toURL());\n\
  \      System.out.println(urlLastModified2);\n    }\n\n    private static ZonedDateTime\
  \ getLastModified(URL url) {\n    try {\n      HttpURLConnection con = (HttpURLConnection)\
  \ url.openConnection();\n      long dateTime = con.getLastModified();\n      con.disconnect();\n\
  \      return ZonedDateTime.ofInstant(Instant.ofEpochMilli(dateTime), ZoneId.of(\"\
  UTC\"));\n    } catch (IOException e) {\n      throw new IllegalStateException(e);\n\
  \    }\n}\n```\n\n练习：\n\n* 创建一个带有 `url` 组件的记录 `WebModifiedCallable`。\n* 让 `WebModifiedCallable`\
  \ 实现 `Callable<ZonedDateTime>` 接口。将示例中的 `getLastModified(URL)` 实现放入 `call()` 方法中。`call()`\
  \ 需要捕获受检异常吗？\n* 构建 `WebModifiedCallable` 对象并让线程池执行它们。\n    * 让 `Callable` 在无限制的情况下执行一次。\n\
  \    * 给 `Callable` 只有微秒执行时间；结果是什么？\n    * 可选：相对于当前时间网页变化的分钟。\n\n## 保护关键区域\n\n当程序的多个部分同时运行时，它们可能会访问共享资源或内存区域。为了避免错误状态，这些访问必须同步，允许其他一个线程进入该区域。未能协调共享资源的访问会导致错误。\n\
  \nJava 提供了两种机制：\n\n1.  `synchronized` 关键字。\n2.  `Lock` 对象。\n\n`synchronized` 是一个方便的关键字，但功能有限。*Java\
  \ 并发工具类*提供了更强大的数据类型。为了独占执行的程序部分，存在 `java.util.concurrent.locks.Lock` 接口以及多种实现，例如\
  \ `ReentrantLock`、`ReentrantReadWriteLock.ReadLock`、`ReentrantReadWriteLock.WriteLock`。\n\
  \n![展示了一段 Java 代码块，箭头从 ReentrantLock 指向 Lock 和 Serializable 接口。](img/Fig04_02.jpg)\n\
  \n**图 4.2** `Lock` 和 `ReentrantLock` 类型的 UML 图。\n\n### 在诗集中写下记忆 ★\n\n一旦载有珍贵遗忘药的货船成功易手，海盗们就会在诗集里记录他们的记忆。Ciao\
  \ Ciao 长稍会为诗集贴上贴纸。\n\n给定是类中 `main(…)` 方法的程序代码：\n\n\n\n\n\n```java\nclass FriendshipBook\
