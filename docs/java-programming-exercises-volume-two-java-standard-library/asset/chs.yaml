  \ new SecureRandom())` 生成一个大类型的随机 `BigInteger`。\n\n### 任务：\n\n*   编写实现 `Iterator`\
  \ 的自定义类 `SecureRandomIntegerIterator`它可以返回无限数量的 `BigInteger`。\n*   当数字被查询且用尽时，应由后台线程计算一个新的数字。\n\
  \n## 建议解决方案\n\n#### 测验：StringBuilder\n\n程序返回输出\n\n```\ntrue\nfalse\n```\n\n这种解释在于\
  \ `contains(Object)` 方法的实现。它内部回退到返回元素位置的方法，但我们可以从 Java 库的当前实现中读取搜索需要什么条件\n\n**OpenJDK\
  \ 摘录** `java.lang.ArrayList`。\n\n```java\nint indexOfRange(Object o, int start,\
  \ int end) {\n  Object[] es = elementData;\n  if (o == null) {\n    for (int i =\
  \ start; i < end; i++) {\n      if (es[i] == null) {\n        return i;\n      }\n\
  \    }\n  } else {\n    for (int i = start; i < end; i++) {\n      if (o.equals(es[i]))\
  \ {\n        return i;\n      }\n    }\n  }\n  return -1;\n}\n```\n\n\n\n`indexOfRange(…)`\
  \ 方法搜索对象 `o` 的位置，并首先区分要搜索 `null` 引用还是普通对象。在我们的案例中，查询的对象不是 `null`，因此使用了 `equals(…)`\
  \ 方法，也就是说，循环通过 `equals(…)` 方法将列表中的每个元素与我们的值进行比较。相反，这意味着只有当我们也实现了合理的 `equals(…)`\
  \ 方法时，查询才能生效。这正是问题所在：`String` 类提供了一个 `equals(…)` 方法，不是来自 `java.lang.Object` 的那个，而是重写后的方法。然而，`StringBuilder`\
  \ 类没有 `equals(…)` 方法的实现，而是从超类 `Object` 继承了该方法。在父类中，只实现了引用比较，这意味着内容完全不重要。但是，由于我们列表中的\
  \ `StringBuilder` 对象总是不同的，引用比较永远不会返回 `true`。\n\n### 唱歌与烹饪：遍历列表并检查属性\n\n解决此任务有不同的方法。一种变体在一个变量中记录厨师的数量，在另一个变量中记录音乐家的数量。最后比较这两个变量。\n\
  \n建议的解决方案提供了一种不同的方法。它可以比作一个天平，两个物品的数量在两侧必须相同才能达到平衡。惊讶的是，只要达到平衡，每个物品的特定重量并不重要。\n\n\
  `com/tutego/exercise/util/SameNumberOfCooksAndMusicians.java`\n\n```java\npublic\
  \ static boolean areSameNumberOfCooksAndMusicians(List<CrewMember> crewMembers)\
  \ {\n  int weight = 0;\n  for (CrewMember member : crewMembers) {\n    switch (member.profession)\
  \ {\n      case COOK      -> weight++;\n      case MUSICIAN -> weight--;\n    }\n\
  \  }\n  return weight == 0;\n}\n```\n\n这里实现的解决方案变体遍历列表，如果列表中有厨师，则增加变量 `weight` 的计数，如果列表中有音乐家，则减少该变量计数；当然，反过来也可以。如果厨师和音乐家的数量相同，`weight`\
  \ 最终将为 `0`。\n\n关键字 `switch` 可以在另一种变体中作为表达式使用：\n\n`com/tutego/exercise/util/SameNumberOfCooksAndMusicians.java`\n\
  \n```java\nfor (CrewMember member : crewMembers) {\n  weight += switch (member.profession)\
  \ {\n    case COOK      -> +1;\n    case MUSICIAN -> -1;\n    default       -> 0;\n\
  \  };\n}\n```\n\n在这个变体中，我们需要引入一个 `default` 分支。这创建了一行代码，这种写法可能比第一种写法或使用条件运算符的变体那么好看。还有另一种解决的方法。仍然是创建一个天平的想法，将某些元素转移到\
  \ `+1`，另一些元素转移到 `-1`：`com/tutego/exercise/util/SameNumberOfCooksAndMusicians.java`\n\
  \n```java\nint result = 0;\nfor (CrewMember member : crewMembers) {\n  // CAPTAIN\
  \ -+|\n  // NAVIGATOR -+|\n  // CARTER -+|\n  // COOK -+|\n  // MUSICIAN -+|\n \
  \ // v v v v v\n  int zeroOrOneOrTwo = ((1 << member.profession.ordinal()) & 0b_1_0_0_0)\
  \ / 8;\n  int minusOneOrZeroPlusOne = (zeroOrOneOrTwo / 2) - (zeroOrOneOrTwo & 1);\n\
  \  result += minusOneOrZeroPlusOne;\n}\nreturn result == 0;\n```\n\n这种方法初眼看去可能会让人摇头，但曾经见过并理解这种方式是有好的。让我们来推导出这个解决方案。\n\
  \n给定的是一个包含各种元素的枚举，所有这些元素都有一个位置，即所谓的序数（ordinal）。`CrewMember.Profession.CAPTAIN.ordinal()`\
  \ 是 `0`，`CrewMember.Profession.COOK.ordinal()` 是 `3`。如果我们写 `1 << x`，且 `x` 在于 `0`\
  \ 和 `5` 之间，我们得到将 `1` 向左移动 `x` 位并在右侧补零。换句话说，我们在二进制表示中得到数字：\n\n* `0b000001` (`CAPTAIN`)。\n\
  * `0b000010` (`NAVIGATOR`)。\n* `0b000100` (`CARTER`)。\n* `0b001000` (`COOK`)。\n\
  * `0b010000` (`MUSICIAN`)。\n* `0b100000` (`DOCTOR`)。\n\n我们对 `0b00100` (`COOK`) 和\
  \ `0b01000` (`MUSICIAN`) 感感兴趣。要测试数字中的第三或第四位是否被设置，我们将此数字与位模式 `0b1100` 结合。如果两个位中的一个被设置，则该位将保留，所有其他位通过与（AND）操作被设置为\
  \ `0`。最后，因为两个位不能同时被设置，我们留下了 `0`（未命中）、`0b10000` (16) 或 `0b1100` (8)。如果我们将此值除以 `8`（或向右移动三位），我们得到\
  \ `0`、`1` 或 `2`。\n\n如果我们想再次使用天平原理，数字 `1` 和 `2` 并没有帮助。我们必须将 `1` 变为 `-1` 并将 `2` 变为\
  \ `+1`，或者将 `1` 变为 `+1` 并将 `2` 变为 `-1`，而 `0` 必须保持为 `0`。当然，我们可以插入条件语句，但我们费尽力为了避免 `if`\
  \ 语句。让 `x` 为数字 `0`、`1`、`2`，那么表达式 `(x / 2) - (x & 1)` 正好转换为目标 `-1` 和 `+1`。我们可以加上该表达式并以此方式继续。\n\
  \n在正常情况下，没有人应该编写这样的解决方案，除非它们极其关键且性能分析器显示这种变体更快。由于我们在这里有一些数学操作——`/8`、`/2` 也是廉价的——这不应该比一个小的\
  \ `if` 快。条件语句是人们在微优化中尝试重写的内容，但如果你不知道自己在做什么，结果将是开销更大。\n\n### 从列表中过滤注释\n\n`com/tutego/exercise/util/RetainComments.java`\n\
  \n```java\npublic static void reduceToComments(List<String> lines) {\n  if (lines.size()\
  \ % 4 != 0)\n    throw new IllegalArgumentException(\n      \"size %d of list, must\
  \ be divisible by 4\".formatted(lines.size())\n    );\n\n  for (int blockStart =\
  \ lines.size() - 4; blockStart >= 0; blockStart -= 4) {\n    // keep element at\
  \ position blockStart + 3\n    lines.remove(blockStart + 2);\n    lines.remove(blockStart\
  \ + 1);\n    lines.remove(blockStart + 0);\n  }\n}\n```\n\n为了让算法正确工作，列表长度必须是 4 的倍数。因此，第一个条件语句检查长度是否被\
  \ 4 整除；如果不是，则抛出异常。\n\n以下循环以索引 `blockStart` 以四为步长从后往前运行。四个之和 `blockStart + 0`、`blockStart\
  \ + 1`、`blockStart + 2` 和 `blockStart + 3` 代表块中四个元素的索引。`blockStart + 3` 需要被保留，所有其他行我们通过\
  \ `remove(..)` 方法删除。你总是需要对该方法小心，因为它是重载的。\n\n* 第一种变体 `remove(Object)` 从列表中删除 `equals(…)`\
  \ 相等的元素。\n* 第二个 `remove(int)` 方法删除指定位置的项。\n\n在删除元素时，我们从高索引向低索引移动。对于列表（特别是 `ArrayList`），从后面删除总是合理的，这样需要移动的元素较少。如果我们从\
  \ `blockStart + 0` 开始，则索引方的元素被删除，所有其他元素向上移动。解决方案看起来如下：\n\n```java\nlines.remove(blockStart);\n\
  lines.remove(blockStart);\nlines.remove(blockStart);\n```\n\n另一种解决方案由实时视图提供：\n\n\
  ```java\nfor (int blockStart = lines.size() - 4; blockStart >= 0; blockStart -=\
  \ 4)\n  lines.subList(blockStart, blockStart + 3).clear();\n```\n\n\n\n\n\n`subList(…)`\
  \ 方法返回一个子列表，且更改是实时的；如果通过 `clear()` 删除了子列表，底层列表中的元素也会被移除。解决方案也可以在下面的任务中找到。\n\n##\
  \ 因为没有下降，所以缩短列表\n\n`com/tutego/exercise/util/TrimNonGrowingList.java`\n\n```java\n\
  static void trimNonGrowingNumbers( List<Double> numbers ) {\n  if ( numbers.size()\
  \ < 2 )\n    return;\n\n  double previous = numbers.getFirst();\n  for ( int i =\
  \ 1; i < numbers.size(); i++ ) {\n    double current = numbers.get( i );\n    if\
  \ ( current <= previous ) {\n      numbers.subList( i, numbers.size() ).clear();\n\
  \      break;\n    }\n    previous = current;\n  }\n}\n```\n\n乍看之下，任务非常简单：我们遍历列表并检查下一个元素是否更大。如果不是如此，我们就终止操作。现在，特殊之处在于：我们并不将元素存储在一个新列表中，而是必须修改传递给我们的列表。这意味着从元素变小的一点开始，我们必须删除传递的列表中直到末尾。\n\
  \n然而，`List` 接口中并没有这种方法。因此，我们必须手动重新实现该功能。有两种可能的解决方案：\n\n*   有一个 `remove(int)` 方法，我们可以向其传递一个索引，以便在该处删除元素。合理的做法是从右向左开始，调用该方法，直到列表缩短为止。\n\
  *   第二种可能性利用了数据结构的一个特性，即存在实时视图（live views）；建议的解决方案选择了这种方法。`subList(…)` 方法返回列表的视图，但这个视图是实时的，对此子列表的更改会应用到原始列表，即透写过去。如果我们用\
  \ `clear()` 清除这个子列表，原始列表中的所有元素也会消失。\n\n## 与朋友吃饭：比较元素，寻找共同点\n\n`com/tutego/exercise/util/FriendsSittingTogether.java`\n\
  \n```java\npublic record Guest(\n    boolean likesToShoot,\n    boolean likesToGamble,\n\
  \    boolean likesBlackmail\n) {\n  public boolean hasDissimilarInterests( Guest\
  \ other ) {\n    return !(likesToShoot == other.likesToShoot ||\n             likesToGamble\
  \ == other.likesToGamble ||\n             likesBlackmail == other.likesBlackmail);\n\
  \  }\n}\n\npublic static int allGuestsHaveSimilarInterests( List<Guest> guests )\
  \ {\n  for ( int index = 0; index < guests.size(); index++ ) {\n    Guest guest\
  \ = guests.get( index );\n    Guest rightNeighbor = guests.get( (index + 1) % guests.size()\
  \ );\n    if ( guest.hasDissimilarInterests( rightNeighbor ) )\n      return index;\n\
  \  }\n  return -1;\n}\n```\n\n我们想要将客人表示为具有三个属性的对象。这是通过 `Guest` record 实现的，它有一个额外的方法\
  \ `hasDissimilarInterests(Guest)`；它将自己与另一个 `Guest` 进行比较，并检查是否存在共同兴趣。\n\n在 `allGuestsHaveSimilarInterests(…)`\
  \ 方法中，循环遍历所有客人。在此过程中，我们获取客人及其右邻居，列表中的最后一个元素后面没有元素。通过取模运算符，我们回到列表开头，这意味着最后一个元素将与第一个元素进行比较。这是正确的，因为所有客都在圆圈中，每个人都有邻居。\n\
  \n在循环中，`hasDissimilarInterests(…)` 确定两个客人是否有共同兴趣。在这种情况下，我们返回方法的索引。\n\n## 检查列表顺序是否相同\n\
  \n让我们来看两个解决方案。它们都基于相同的原理，即列表被翻倍，或者在最后一个元素处它重新开始。\n\n### 建议的解决方案 1，复制列表\n\n`com/tutego/exercise/util/SameCircle.java`\n\
  \n```java\nList<String> names1 = Arrays.asList(\"Alexandre\", \"Charlie\", \"Anne\"\
  , \"Henry\");\nList<String> names2 = Arrays.asList(\"Anne\", \"Henry\", \"Alexandre\"\
  , \"Charles\");\n\nArrayList<String> duplicatedList = new ArrayList<>(names1);\n\
  duplicatedList.addAll(names1);\nSystem.out.println(Collections.indexOfSubList(duplicatedList,\
  \ names2) >= 0);\n```\n\n对于第一个解决方案，我们将所有名称复制到一个新列表中，因为我们想避免破坏原始列表，并且列表可能会翻倍：“Alexandre\"\
  , \"Charlie\", \"Anne\", \"Henry\"。\n\n### 建议的解决方案 2，虚拟列表\n\n`com/tutego/exercise/util/SameCircle.java`\n\
  \n```java\nprivate static <T> boolean isSameCircle(List<T> list1, List<T> list2)\
  \ {\n  if ( list1.size() != list2.size() )\n    return false;\n\n  AbstractList<Object>\
  \ list1Duplicated = new AbstractList<>() {\n    @Override\n    public int size()\
  \ {\n      return list1.size() * 2;\n    }\n\n    @Override\n    public Object get(int\
  \ index) {\n      return list1.get(index % list1.size());\n    }\n  };\n  return\
  \ Collections.indexOfSubList(list1Duplicated, list2) >= 0;\n}\n```\n\n我们需要一个大小是第一个列表两倍的列表，并且在访问最后一个元素的元素时，它从第一个元素重新开始。\n\
  \n这个解决方案没有在内存中创建新列表，但对外部来说它是虚拟且重复的。当然，修改方法将完全不起，但 `size()` 和 `get(…)` 足够再次使用 `indexOfSubList(…)`。\n\
  \n## 现在来看天气：寻找重复元素\n\n`com/tutego/exercise/util/WeatherOccurrences.java`\n\n\n\n\
  \n\n```java\nrecord WeatherOccurrence( String weather, int occurrences, int startIndex\
  \ ) { }\n\nstatic WeatherOccurrence longestSequenceOfSameWeather( List<String> weather\
  \ )\n{\n  int localMaxOccurrences = 1;\n  int localStartIndex   = 0;\n\n  int globalMaxOccurrences\
  \ = localMaxOccurrences;\n  int globalStartIndex   = localStartIndex;\n\n  String\
  \ recurringElement = weather.getFirst();\n\n  for ( int i = 1; i < weather.size();\
  \ i++ ) {\n    String currentElement = weather.get( i );\n\n    if ( Objects.equals(\
  \ currentElement, recurringElement ) ) {\n      localMaxOccurrences++;\n\n     \
  \ if ( localMaxOccurrences > globalMaxOccurrences ) {\n        globalMaxOccurrences\
  \ = localMaxOccurrences;\n        globalStartIndex   = localStartIndex;\n      }\n\
  \    }\n    else { // currentElement != recurringElement\n      localStartIndex\
  \ = i;\n      localMaxOccurrences = 1;\n      recurringElement = currentElement;\n\
  \    }\n  }\n\n  return new WeatherOccurrence(\n      weather.get( globalStartIndex\
  \ ), globalMaxOccurrences, globalStartIndex );\n}\n```\n\n为了解决这个问题，我们需要考虑两个不同的序列：局部最长序列和全局最长序列。因此，我们需要几个变量来跟踪状态。两个变量存储本地相同元素的最大数量以及该序列的起始索引；另外两个变量存储找到的全局最大元素数量及其位置。\n\
  \n程序必须回答某个元素是否连续出现多次。我们在开始时初始化变量 `recurringElement`，并将其赋值为第一个元素，然后观察该元素是否重复。实际循环可以从索引\
  \ `1` 开始。循环体读取元素并将其与 `recurringElement` 进行比较，以检查是否存在 `recurringElement` 的序列。等价性测试通过\
  \ `Object` 类的静态 `equals(…)` 方法完成，因为这种方法相比在元素上调用 `equals(…)` 具有一个优势，即即使元素为 `null`\
  \ 也不会产生问题。如果元素重复，则 `localMaxOccurrences` 计数器加 `1`，然后通过条件语句检查本地相同元素的数量是否超过了全局最大值。如果是，则\
  \ `if` 块将更新 `globalMaxOccurrences` 和 `globalStartIndex` 变量。我们不需要记住元素本身，因为那只在结束时才变得相关，届时我们可以查询元素，因为我们知道元素在数据结构中的位置。\n\
  \n如果列表中出现不相等的对象，则将起始位置设置为新序列的索引，重复元素的数量设置为 `1`，并为序列剩余部分重新初始化 `recurringElement`。\n\
  \n循环结束时，参数化构造函数构建一个包含三个所需状态的 `WeatherOccurrence`。\n\n### 生成收据输出\n\n**com/tutego/exercise/util/Receipt.java**\n\
  \n```java\npublic class Receipt {\n  public static class Item {\n  public final\
  \ String name;\n  public final int centPrice;\n  public final int occurrence;\n\n\
  \  public Item( String name, int centPrice, int occurrence ) {\n    if ( centPrice\
  \ <= 0 )\n      throw new IllegalArgumentException( \"Price can not be <= 0\" );\n\
  \    if ( occurrence <= 0 )\n        throw new IllegalArgumentException( \"Occurrence\
  \ can not be <= 0\" );\n    this.name = Objects.requireNonNull( name );\n    this.centPrice\
  \ = centPrice;\n    this.occurrence = occurrence;\n  }\n\n  public Item( String\
  \ name, int centPrice ) {\n    this( name, centPrice, 1 );\n  }\n\n  public Item\
  \ incrementOccurrence() {\n    return new Item( name, centPrice, occurrence + 1\
  \ );\n  }\n\n  @Override boolean equals( Object other ) {\n    return other instanceof\
  \ Item\n      && centPrice == item.centPrice\n      && name.equals(item.name );\n\
  \  }\n\n  @Override public int hashCode() {\n    return name;\n  }\n\n  private\
  \ final List<Item> items = new ArrayList<>();\n\n  public void addItem( Item item\
  \ ) {\n    int maybeIndex = items.indexOf( item );\n\n    if ( maybeIndex >= 0 )\n\
  \      items.set(maybeIndex, items.get(maybeIndex ).incrementOccurrence() );\n \
  \   else\n      items.add( item );\n  }\n\n  @Override public String toString()\
  \ {\n    NumberFormat currencyFormatter = NumberFormat.getCurrencyInstance(Locale.GERMANY);\n\
  \    StringBuilder result = new StringBuilder();\n    int sum = 0;\n\n    for (\
  \ Item item : items ) {\n      int itemTotal = item.centPrice * item.occurrence;\n\
  \      String line = \"%dx%-20s%10s\".formatted(\n          item.occurrence,\n \
  \         item.name,\n          currencyFormatter.format(itemTotal) );\n      result.append(\
  \ line );\n      sum += itemTotal;\n    }\n\n    result.append(\"\\nSum: \")\n \
  \     .append( currencyFormatter.format(sum) )\n      .append(\"\\n\");\n\n    return\
  \ result.toString();\n  }\n}\n```\n\n\n\n\n```java\npublic static <T> List<T> asList(\
  \ T... a ) {\n  return new ArrayList<>( a );\n}\n\nprivate static class ArrayList<E>\
  \ extends AbstractList<E>\n    implements RandomAccess, java.io.Serializable {\n\
  \n  private final E[] a;\n  ArrayList( E[] array ) {\n    a = Objects.requireNonNull(\
  \ array );\n  }\n\n  @Override\n  public int size() { return a.length; }\n\n  @Override\n\
  \  public E get( int index ) { return a[ index ]; }\n\n  …\n}\n```\n\n## 来自 OpenJDK\
  \ 对 `java.util.AbstractList` 的实现\n\n```java\npublic void add( int index, E element\
  \ ) {\n  throw new UnsupportedOperationException();\n}\n```\n\n`asList(T... a)`\
  \ 方法创建了一个 `ArrayList` 类型的实例，这里的 `ArrayList` 指的 `java.util.ArrayList`，而是 `Arrays`\
  \ 中的一个嵌套类。很容易看出，读取方法直接传递到数组，但例如，`add(…)` 方法抛出了 `UnsupportedOperationException`。\n\
  \n### 测验：搜索但未找到\n\n输出如下：\n\n```\nfalse\ntrue\ntrue\n```\n\n这里使用的方法声明如下：\n\n```java\n\
  public static <T> List<T> asList(T... a)\n```\n\n参数类型是一个变长参数（vararg），它是一个对象数组。在第一情况下，我们将一个原始类型整数数组传递给\
  \ `asList(…)`，而原始数据类型不是泛型类型变量所处理的引用类型。这意味着类型 `T` 代表引用类型 `int[]`；因此，结果列表类型为 `List<int[]>`，而\
  \ `contains(…)` 方法返回 `false`。\n\n变长参数在 JVM 内部并不存在，它们只是普通的数组。关键区别在于调用时，一系列参数可以直接传递并分组到一个内部数组中。这为变长参数方法提供了两种使用方法：传递多个参数并将它们组装成内部数组，或者直接传递一个数组。这正是我们在这里使用的变体。包装类型\
  \ `Integer` 是类型变量 `T` 的类型参数，创建了一个 `List<Integer>`。`contains(…)` 方法找到了 `1`，因为它通过装箱（boxing）被转换成了\
  \ `Integer` 对象，而包装对象实现了 `equals(…)`。\n\n在第三部分，我们使用了变长参数列表。首先，`int` 元素通过装箱转换为 `Integer`\
  \ 对象，然后放在匿名内部数组中并传递。\n\n### 有了奶酪味道更好：向列表插入元素\n\n在修改数据结构时，我们基本上有两种方法：构建一个具有所需属性的新数据结构，或者修改数据结构本身。所有典型的数据结构如\
  \ `ArrayList`、`HashMap` 和 `TreeSet` 都是可修改的，这个问题的表述——向现有数据结构中插入元素——也是如此。\n\n题目提到了列表，列表中的元素具有位置。如果必须在某个位置引入某些内容，基本上有两种可能：我们可以使用面向索引的方法\
  \ `add(int index, E element)`，或者通过 `ListIterator` 插入元素。面向索引的方法对于 `LinkedList` 有一个缺点，因为它不提供通过索引对元素进行快速的\
  \ `RandomAccess`。由于该方法的通用参数类型为 `List`，我们必须对每种可能的列表进行调整，并且我们想要避免 `LinkedList` 上产生糟糕的性能。对于我们的输出，`ListIterator`\
  \ 是完美的。\n\n**com/tutego/exercise/util/CheeseInserter.java**\n\n```java\nprivate\
  \ static final Pattern vegetables = Pattern.compile(\n    \"zucchini|bell peppers?|onions?|tomat(?:o|oes)\"\
  , Pattern.CASE_INSENSITIVE\n);\n\npublic static void insertCheeseAroundVegetable(\
  \ List<String> ingredients ) {\n  for ( ListIterator<String> iterator = ingredients.listIterator();\n\
  \        iterator.hasNext(); ) {\n  String ingredient = iterator.next();\n  if (\
  \ vegetables.matcher( ingredient ).matches() )\n    // 新元素被插入在隐式光标之前\n      iterator.add(\
  \ \"cheese\" );\n  }\n}\n```\n\n提议的解决方案从列表中获取 `ListIterator`，并像通常一样结合 `hasNext()`\
  \ 和 `next()` 遍历所有元素。在获取元素后，`matches(…)` 询问该元素是否匹配任何预定义的字符串。因此，对于这个检查，我们使用了一个包含不同类型蔬菜的正则表达式，甚至对于选定的类型正确地处理了复数形式\
  \ `s`。如果字符串匹配，则插入 `\"cheese\"`。\n\n你可以将迭代器看作一个站在元素之间的光标。在执行 `next()` 之后，光标位于元素之后。`add(…)`\
  \ 方法将新元素插入到光标当前位置之前，换句话说，紧接 `next()` 返回的元素之后。这意味着光标将留在新插入的元素之后，因此再次调用 `next()` 将不会返回新添加的项\
  \ `\"cheese\"`，而是序列中的下一个项目。\n\n### 测验：只有麻烦\n\n简而言之，没有。但有一个例外：\n\n```\nException\
  \ in thread \"main\" java.util.ConcurrentModificationException\n    at java.util.ArrayList$Itr.checkForComodification(ArrayList.1012)\n\
  \    at java.util.ArrayList$Itr.next(ArrayList.966)\n```\n\n`List` 和 `Iterator`\
  \ 拥有一个状态，在该状态下它们记得修改次数。当 `Iterator` 被创建时，它会根据列表的修改计数器初始化，当列表进行修改时，它会增加修改计数器。随后，当\
  \ `Iterator` 移动到下一个元素时，它会将存储的修改计数器与列表的修改计数器进行比较，如果不相等，就会抛出异常。在代码中，看起来像这样：\n\n**OpenJDK\
  \ 对 `java.util.AbstractList` 的实现**\n\n```java\nclass AbstractList {\n  protected\
  \ transient int modCount = 0;\n\n  public Iterator<E> iterator() {\n    return new\
  \ itr();\n  }\n\n  private class itr implements Iterator<E> {\n    int expectedModCount\
  \ = modCount;\n\n    public E next() {\n      checkForComodification();\n      …\n\
  \    }\n\n    final void checkForComodification() {\n      if (modCount != expectedModCount)\n\
  \        throw new ConcurrentModificationException();\n    }\n    …\n  }\n  …\n\
  }\n```\n\n结果是：我们不能在迭代循环内部对数据结构进行任何更改。过期删除不是这样工作的，此类任务需要其他解决方案。一个不需要循环的解决方案可能像这样：\n\
  \n```java\nnames.removeIf( \"\":equals );\n```\n\n`removeIf(…)` 期望一个谓词，而这个非常优紧凑的方法引用正恰实现了这样一个谓词，测试传入的对象是否\
  \ `equals(…)` 等于空字符串。\n\n### 使用迭代器搜索元素并查找新冠咳嗽\n\n我们得到一个初始化的 `Iterator`，只能向左或向右移动，不能绝对跳跃；像人类一样受到限制。选择正确的策略并不容易，因为我们在这里可以根据概率来，也可以尝试减少最大\
  \ `cost`。\n\n\n\n\n\n## 策略 1\n假设有 100 艘船，Bonny Brain 站在第 90 艘船旁边。这意味着，在一个方向上有 90\
  \ 艘船，而我们要找的那艘船在那里的概率是 90%。尽管如此，仍有 10% 的概率我们要找的船不在该区域，那么 Bonny Brain 必须一路走回整个列表查看剩余部分。因此，在最坏的情况下，需要访问\
  \ 90 + 90 + 10 = 190 艘船。\n\n## 策略 2\nBonny Brain 知道左侧还是右侧的船多。第二种策略是先运行船较少的一侧，从而减少整体的最坏情况成本。对于\
  \ 100 艘船的例子，Bonny Brain 位于第 90 艘船，这意味着最多访问次数为 10 + 10 + 90 = 110 次。\n\n建议的解决方案实现了策略\
  \ 2：\n\n**com/tutego/exercise/util/FindCovidCough.java**\n\n```\nif (iterator.nextIndex()\
  \ >= NUMBER_OF_SHIPS / 2 ) {\n  if (searchRight(iterator))\n    System.out.println(\
  \ \"-> at ship \" + iterator.previousIndex() );\n  else if (searchLeft(iterator))\n\
  \    System.out.println( \"-> <- at ship \" + iterator.nextIndex() );\n  else\n\
  \    System.out.println( \"Not found\" );\n}\nelse {\n  if (searchLeft(iterator))\n\
  \    System.out.println( \"<- at ship \" + iterator.nextIndex() );\n  else if (searchRight(iterator))\n\
  \    System.out.println( \"<- -> at ship \" + iterator.previousIndex() );\n  else\n\
  \    System.out.println( \"Not found\" );\n}\n```\n\n`Iterator` 方法 `nextIndex()`\
  \ 返回绝对位置，我们用它来比较 Bonny Brain 在右半部分还是左半部分。我们的方法 `searchRight(…)` 使用 `Iterator` 遍历整个右侧，如果找到了搜索项则返回\
  \ `true`。如果方法返回 `false`，说明我们没有在右半部分找到搜索的人，但我们必须从那里返回并一直走到左侧。搜索方向由输出中的箭头指示。如果我们到达了左侧且\
  \ `searchLeft(…)` 返回结果 `false`，那么搜索的人在列表中根本不存在！第二个主要的 `else` 分支测试另一种情况，即 CiaoCiao\
  \ 队长位于相对于中心的左侧，并首先完全向左运行。\n\n`searchRight(Iterator<Ship>)` 和 `searchLeft(ListIterator<Ship>)`\
  \ 的实现如下：\n\n**com/tutego/exercise/util/FindCovidCough.java**\n\n```\nstatic final\
  \ String COVID_COUGH = \"Covid Cough\";\n\nprivate static boolean searchRight( Iterator<Ship>\
  \ iterator ) {\n  while (iterator.hasNext())\n    if (iterator.next().contains(COVID_COUGH\
  \ ))\n      return true;\n  return false;\n}\n\nprivate static boolean searchLeft(\
  \ ListIterator<Ship> iterator ) {\n  while (iterator.hasPrevious())\n    if (iterator.previous().contains(COVID_COUGH\
  \ ))\n      return true;\n  return false;\n}\n```\n\n向右搜索的方法不需要 `ListIterator`，因为普通的\
  \ `Iterator` 提供了 `hasNext()` 和 `next()` 方法来向右遍历并提取下一个元素。`searchLeft(…)` 方法需要 `ListIterator`，因为我们必须使用\
  \ `hasPrevious()` 和 `previous()` 方法向左移动。普通的 `Iterator` 不能任意地向左或向右运行。只有通过 `ListIterator`，我们才有在数据结构上多次运行。\n\
  \n### 移动元素，玩椅子游戏\n\n**com/tutego/exercise/util/MusicalChairsGame.java**\n\n```\n\
  class MusicalChairs {\n\n  private final List<String> names;\n\n  public MusicalChairs(\
  \ String... names ) {\n    if (names.length == 0 )\n      throw new IllegalArgumentException(\"\
  No names are given, but names must not be empty\");\n    this.names = new ArrayList<>(Arrays.asList(names));\n\
  \  }\n\n  public void rotate(int distance ) {\n    Collections.rotate(names, distance);\n\
  \  }\n\n  public void rotateAndLast(int distance ) {\n    if (names.isEmpty() )\n\
  \      throw new IllegalStateException(\"Names is empty, no names to remove\");\n\
  \    rotate(distance);\n    names.removeLast();\n  }\n\n  public String play() {\n\
  \    if (names.isEmpty() )\n      throw new IllegalStateException(\"Names is empty,\
  \ no names to play with\");\n    while (names.size() > 1 ) {\n      rotateAndRemoveLast(ThreadRandom.current().nextInt());\n\
  \      System.out.println(names);\n    }\n    return names.getFirst();\n  }\n\n\
  \  @Override String toString() {\n    return String.join(\",\", names);\n  }\n}\n\
  ```\n\n`MusicalChairs` 类有一个类型为 `List` 的实例变量，其中包含名称。虽然在构造函数中传递了一个变长数组，但如果我们想使用 `Collections`\
  \ 类的 `rotate(…)` 方法，使用列表会更灵活。构造函数将数组转换为列表，并提前检查数组是否包含任何元素——否则，构造函数将抛出异常。如果调用构造函数时传入\
  \ `null`，则会出现常见的 `NullPointerException`。\n\n关于这些方法：\n\n- `rotate(…)` 方法使用了 `Collections`\
  \ 方法。该方法是*原地执行*的，因为它修改了列表。我们的列表是内部的，无法从外部访问。\n- `rotateAndLast(…)` 首先执行旋转然后删除最后一个元素。但有一个可能报告错误：如果游戏进行了多轮，反复调用\
  \ `rotateAndLast(…)` 可能会导致列表变空。这种情况通过第一个 `if` 语句进行检查。如果有多个元素，我们旋转列表并删除最后一个元素。`ArrayList`\
  \ 没有删除最后一个元素的专用方法。如果我们使用 `LinkedList` 而不是 `ArrayList`，那么就有 `Deque` 接口的 `removeLast()`\
  \ 方法。\n- `play()` 方法执行游戏。再次，必须确保列表不能为空。`while` 循环执行直到列表元素变为 `1`。如果列表中有多个名称，列表会被旋转并打印。循环结束后，列表恰包含一个元素。我们回退到第一个元素。再次，`List`\
  \ 不提供获取元素的特殊方法。对于实现 `Queue` 接口的数据结构情况不同：这里有 `remove()` 方法。\n- `toString()` 方法回退静态方法\
  \ `String.join(…)`，因为这是创建逗号分隔字符串简单的方法。\n\n### 使用行星编写问题游戏\n\n**com/tutego/exercise/util/PlanetQuiz.java**\n\
  \n```\nList<Planet> shuffledPlanets = new ArrayList<>( Arrays.asList(Planet.values()));\n\
  Collections.shuffle(shuffledPlanets);\n\nfor (Planet question : shuffledPlanets\
  \ ) {\n  System.out.printf(\"行星 %s 的直径是多少（千米）？%n\",\n                    question.name);\n\
  \n  List<Planet> misleadingPlanets = new ArrayList<>( Arrays.asList(Planet.values()));\n\
  \  misleadingPlanets.remove(question);\n  Collections.shuffle(misleadingPlanets);\n\
  \n  List<Planet> choicePlanets = misleadingPlanets.subList(0, 3);\n  choicePlanets.add(question);\n\
  \  Collections.shuffle(choicePlanets);\n  choicePlanets.forEach(\n    planet ->\
  \ System.out.println(planet.diameter + \" km\")\n  );\n  if (new Scanner(System.in).nextInt()\
  \ != question.diameter)\n    System.out.printf(\"错误！%s 的直径是 %d 千米.%n%n\",\n    \
  \                  question.name, question.diameter);\n  else\n    System.out.printf(\"\
  正确！%n%n\" );\n}\n```\n\n建议的解决方案分几个阶段进行。在第一阶段，构建一个新的 `List` 并使用 `shuffle(..)` 方法对其洗乱。现在，我们可以扩展\
  \ `for` 循环来遍历这些洗乱的行星，并为每个行星提出一个需要回答的问题。\n\n\n\n\n下一步是在已知的行星中随机选择三个行星。需要注意的是，随机选择不包含已查询的行星本身。因此，我们构建了另一个列表，并移除问题的答案；枚举元素实现了\
  \ `equals(Object)` 方法，这非常方便。之后，我们对该列表进行随机化，从列表中选择三个行星，将答案添加到列表中，然后再次对该列表进行随机化。这保证了答案不会始终处于相同的位置，并且三个备选答案是不同的。\n\
  \n剩下的工作就是屏幕上的输出和查询。如果行星直径不正确，则显示解决方案。\n\n### 表单子集，寻找公共元素\n\n在任务任务中，我们正在寻找一个无法通过单一操作直接形成的交集。`Collections`、`Set`\
  \ 或其实现类中没有哪一个方法可以返回一个包含两个集合中元素的集合。因此，我们选择了一种变通方法。\n\n`com/tutego/exercise/util/DatingCompatibility.java`\n\
  \n```\nSet<String> hobbies1 = Set.of(\n    \"Candy making\", \"Camping\", \"Billiards\"\
  , \"Fishkeeping\", \"Eating\",\n    \"Action figures\", \"Birdwatching\", \"Axe\
  \ throwing\" );\nSet<String> hobbies2 = Set.of( \"Axe throwing\", \"Candy making\"\
  , \"Camping\",\n  \"Action figures\", \"Case modding\", \"Skiing\", \"Satellite\
  \ watching\" );\n\nSet<String> smallerSet, largerSet;\nif ( hobbies1.size() < hobbies2.size()\
  \ ) {\n  smallerSet = hobbies1; largerSet = hobbies2;\n} else {\n  smallerSet =\
  \ hobbies2; largerSet = hobbies1;\n}\n\nSet<String> intersection = new HashSet<>(\
  \ smallerSet );\nintersection.retainAll( largerSet );\nSystem.out.println( intersection\
  \ );\n\nSystem.out.printf( \"The hobbies of person 1 match those of person 2 by\n\
  %d%%.%n\",\n                      (intersection.size() * 100) / hobbies1.size()\
  \ );\nSystem.out.printf( \"The hobbies of person 2 match those of person 1 by\n\
  %d%%.%n\",\n                      (intersection.size() * 100) / hobbies2.size()\
  \ );\n```\n\n在第一步中，我们构建了两个集合之一的副本。对于功能而言，复制哪个集合并不重要；我们出于某种原因选择了较小的集合，稍后我们会详细说明。复制副本的原因是后续方法会修改集合，而我们绝对不想修改传入的集合；传递给方法的集合也可能是不可变的，这意味着会发生异常。\n\
  \n构建副本后，我们调用了 `Set` 方法 `boolean retainAll(Collection<?>)`。它会修改调用该方法的对象，在自己的集合中仅保留那些也存在于所传集合中的元素。这在实际上形成了一个交集。关于该签名有两点有趣的地方：\n\
  \n1. 参数不是集合，而是任意的 `Collection`。这意味着我们也可以传递一个列表。如果列表中也多次出现元素，这也没有大关系。\n2. 此外，在 `retainAll(Collection<?>)`\
  \ 中，`<?>` 的有趣之处在于所传集合的类型是无关的。在内部，使用 `equals(…)` 对对象进行比较。\n\n`retainAll(…)` 的实现非常简单：\n\
  \n`OpenJDK’s implementation of java.util.AbstractCollection`\n\n```\npublic boolean\
  \ retainAll( Collection<?> c ) {\n  Objects.requireNonNull( c );\n  boolean modified\
  \ = false;\n  Iterator<E> it = iterator();\n  while ( it.hasNext() ) {\n    if (\
  \ !c.contains( it.next() ) ) {\n      it.remove();\n      modified = true;\n   \
  \ }\n  }\n  return modified;\n}\n```\n\n默认实现通过 `Iterator` 遍历自己的集合，并使用 `contains(…)`\
  \ 检查元素是否出现在传递的集合中。如果传递的 `Collection` 是列表，那么 `contains(…)` 方法的平均开销比在 `TreeSet` 或\
  \ `HashSet` 上更高。\n\n知道这一点，我们回到了复制了两个集合中较小的那这一事实。这有两个结果：\n\n1. 首先，复制小型数据结构比复制大集合更快且更节省内存。\n\
  2. 第二，OpenJDK 对 `retainAll(…)` 的实现告诉我们迭代器遍历的是自己的集合，这意味着如果自己的集合较小，访问的元素就越少。有人可能会反驳说，必须与更大的（或同样大的）集合进行测试，但如果总查询次数较少，平均速度会更快。\n\
  \n形成交集后，我们根据两个人的拥有的数量设置大小。如果两个人的爱好数量不同，匹配度就不相等；只有当两人指定的数量相同时，匹配度才会相等。我们示例中的程序输出是：\n\
  \n```\n[Candy making, Axe throwing, Camping, Action figures]\n```\n人 1 的爱好与人 2 的爱好匹配率为\
  \ 50%。\n人 2 的爱好与人 1 的爱好匹配率为 57%。\n\n### 测验：极好的\n\n输出是\n\n```\ntrue false [hand]\n\
  ```\n\n这没有例外。Java 中的元素排序有两种可能：要么对象可以自己比较，在这种情况下类实现了 `Comparable` 接口，要么由 `Comparator`\
  \ 查看两个对象并决定它们之间的顺序。在我们的示例中，该类实现了 `Comparable` 接口以获得自然顺序，但 `compareTo(…)` 方法返回 `0`。这意味着无论状态如何，所有对象都是相同的。赋值的名字没有包含。\n\
  \n在向 `Set` 插入元素时，只有当集合中没有对应元素时才会包含。通常，数据结构会访问 `equals(…)` 方法。`TreeSet` 是一个集合，它是异常，因为它不需要\
  \ `equals(…)` 方法，可以使用 `compareTo(…)` 判断两个对象是否等价。是否实现了 `equals(…)` 方法或抛出异常并不重要，因为场景中没有调用\
  \ `equals(…)`。\n\n`main(…)` 方法输出三个内容：两次 `add(…)` 方法的结果，然后通过 `toString()` 输出集合的内容。`Set`\
  \ 的 `add(…)` 方法返回一个 `boolean` 值，表示元素是否已添加到集合中。在第一情况下，添加了字符串，因此返回 `true`。在第二次调用 `add(…)`\
  \ 方法时，`TreeSet` 根据 `Comparable` 识别第二个字符串与现有元素等价。相等元素不会被覆盖和替换，而是被丢弃。由于没有添加，`add(…)`\
  \ 方法返回 `false`。在集合的 `toString()` 表示中，只会出现插入的元素。\n\n### 获取单词包含的所有单词\n\n`com/tutego/exercise/util/WordSequence.java`\n\
  \n```\nprivate static final int MIN_WORD_LENGTH = 3;\n\nprivate static Collection<String>\
  \ substrings( String string ) {\n  Collection<String> result = new ArrayList<>(\n\
  \    (int)(string.length() * (string.length() - 3L) / 2 + 1)\n  );\n  for ( int\
  \ startIndex = 0; startIndex < string.length(); startIndex++ )\n    for ( int len\
  \ = MIN_WORD_LENGTH;\n          len <= string.length() - startIndex;\n         \
  \ len++ )\n      result.add( string.substring( startIndex, startIndex + len ) );\n\
  \n  return result;\n}\n\npublic static Collection<String> wordList( String string,\n\
  \                                          Collection<String> words ) {\n  Collection<String>\
  \ result = new ArrayList<>();\n\n  for ( String substring : substrings( string.toLowerCase()\
  \ ) )\n    if ( words.contains( substring ) )\n      result.add( substring );\n\n\
  \  return result;\n}\n```\n\n\n\n\n在我们通过字典访问实现 `wordList(…)` 方法之前，我们想实现另一个方法：`substrings(String)`。该方法返回所有可能的子字符串集合。从本质上讲，该方法包含两个嵌套循环。外层循环指定起始位置，内层循环生成从至少三个字符开始、直到字符串最大长度的所有长度。最小长度由一个常量决定，因此可以方便地更改。\n\
  \n结果构建在一个内部列表中。列表的大小是可以计算的。之所以进行奇怪的类型转换，是因为在两个两个大的 `int` 值时，值范围会溢出。与 `3L` 相减会强制转换为\
  \ `long`，稍后通过显式类型转换将 `long` 变回 `int`。\n\n通过 `String` 方法 `substring(…)`，形成一个部分字符串并将其添加到结果集中。作为数据结构，我们选择了\
  \ `ArrayList`，因为它非常节省空间，并且稍后将从头到尾顺序运行。此外，我们可以预先确定期的元素数量，这样在运行时就不需要扩展内部数组。\n\n有了这些准备工作，`wordList(…)`\
  \ 的实现非常短。同样，构建一个 `ArrayList` 作为容器并返回，在循环中，仅当单词出现在传入的字典中时，才将其放入该容器。\n\n### 使用 UniqueIterator\
  \ 排除重复元素\n\n新的迭代器是现有迭代器的装饰器，实际数据源于该迭代器。然而，由于原始迭代器可能会重复提供我们已经传递过的元素，我们需要记住元素之前是否出现过。对于这项任务，集合（set）是最佳选择。像\
  \ `HashSet` 这样的数据结构可以快速回答元素是否存在于集合中。因此，原则上我们在解决方案中的做法必须是：如果我们从新的迭代器中获取了一个元素，我们必须在后台询问内部迭代器，直到交付一个新元素。这本身相对简单，但我们不能忘记\
  \ `hasNext()` 方法的实现。因此，我们需要稍微不同地设置实现，这正是这种方法所示的。\n\n`com/tutego/exercise/util/UniqueIteratorDemo.java`\n\
  \n```java\nclass UniqueIterator<E> implements Iterator<E> {\n\n  private final Iterator<?\
  \ extends E> iterator;\n  private final Set<E> hasSeenSet = new HashSet<>();\n \
  \ private E next;\n\n  public UniqueIterator(Iterator<? extends E> iterator) {\n\
  \    this.iterator = iterator;\n    next = lookahead();\n  }\n\n  private E lookahead()\
  \ {\n    while (iterator.hasNext()) {\n      E next = iterator.next();\n      if\
  \ (!hasSeenSet.contains(next))\n        return next;\n    }\n    return null;\n\
  \  }\n\n  @Override\n  public boolean hasNext() {\n    return next != null;\n  }\n\
  \n  @Override\n  public E next() {\n    E result = next;\n    hasSeenSet.add(result);\n\
  \    next = lookahead();\n    return result;\n  }\n}\n```\n\n该类的构造函数接收原始 `Iterator`\
  \ 并将其引用存储在内部实例变量中。此外，还有两个实例变量：一个用于存储已见元素的集合，另一个引用下一个元素。如果原始 `iterator` 无法再提供更多元素，`next`\
  \ 将为 `null`。构造函数还有第二个任务，即引用第一个元素。这里的重点是 `lookahead()` 方法。\n\n`lookahead()` 方法到达原始的\
  \ `Iterator` 并轮询，直到找到一个不在已见元素集合中的元素。如果 `Iterator` 无法返回更多元素，新的 `UniqueIterator` 也无法返回任何元素，该方法返回\
  \ `null`。如果内部 `Iterator` 找到一个尚未出现在集合中的元素，`lookahead()` 将返回该元素。\n\n总结一下：当调用构造函数时，会立即通过内部\
  \ `iterator` 查询第一个元素并存储在变量 `next` 中。如果 `next` 等于 `null`，则底层的 `Iterator` 中没有元素。\n\
  \n对于 `Iterator`，必须重写两个方法：\n\n1.  `hasNext()` 的实现相应地简单：如果 `next` 不等于 `null`，则存在元素。更新通过\
  \ `next()` 完成。\n\n2.  通过 `next()`，我们首先将 `next` 赋值给 `result`。然后将 `result` 添加到 `hasSeenSet`\
  \ 并通过调用 `lookahead()` 更新 `next`。最后，我们返回 `result`。\n\n### 将二维数组转换为 Map\n\n`com/tutego/exercise/util/ConvertToMap.java`\n\
  \n```java\npublic static Map<String, String> convertToMap(String[][] array) {\n\n\
  \  if (array.length == 0) {\n    return Collections.emptyMap();\n  }\n  if (array.length\
  \ == 1) {\n    return Collections.singletonMap(Objects.requireNonNull(array[0][0]),\
  \ Objects.requireNonNull(array[0][1]));\n  }\n  Map<String, String> result = new\
  \ HashMap<>(Math.max(array.length, 16));\n\n  for (String[] row : array) {\n   \
  \ result.put(Objects.requireNonNull(row[0]), Objects.requireNonNull(row[1]));\n\
  \  }\n\n  return result;\n}\n```\n\n\n\n只有当元素大于一个时，才会构建 `HashMap`；其容量会初始化为数组的行数，但至少为\
  \ 16。但容量是多少呢？容量是一种缓冲区。`HashMap` 有一个默认值为 75% 的 `DEFAULT_LOAD_FACTOR`；如果添加了新元素且关联内存达到了\
  \ 75% 的容量，就会执行所谓的“重哈”（rehashing）。`HashMap` 会扩容，所有元素都将进行重新分类。当然，我们希望降低这种开销。如果我们为\
  \ 16 个元素设置初始容量，`HashMap` 就可以直接容纳 12 个元素而无需重哈。通过此此，我们也可以使用 `array.length / 0.75 +\
  \ 1` 来操作，从而计算出最优大小。但假设我们有一个巨大的数组，那么乘以 1.3 会导致溢出，数字变成负数，随后在 `HashMap` 构造函数中抛出异常。这些已经是极端的特殊情况了，但如果我们想成为卓越的软件开发者，就必须关注这些事情。从\
  \ Java 19 开始，我们可以使用 `HashMap.newHashMap(int)` 方法来创建一个指定初始大小的新空 `HashMap`。该映射使用默认的\
  \ 0.75 负载因子，其初始容量通常足够容纳预期的映射数量而无需调整大小。\n\n我们可以使用 `HashMap`，是因为任务说明了 `equals(…)`\
  \ 和 `hashCode()` 已经实现。如果这两个方法没有被正确实现，我们就会遇到问题。那么数组中所有条目被包含在关联内存中的概率将会很高。如果 `equals(…)`\
  \ 和 `hashCode()` 没有从父类 `Object` 重写，那么每个非身份对象也将无法与另一个对象等价，且哈希码很可能总是不同的，导致对象之间没有任何联系。\n\
  \n因此，如果数组包含多个元素，就会构建一个 `HashMap`，原数组将失效，并将键值对添加到关联存储器中。\n\n返回结果上有一个细微的区别：对于零个或一个元素，返回的是一个不可变的关联存储器。对于两个以上的条目，我们得到的是一个可变的数据结构。\n\
  \n### 将文本转换为摩斯密码及反之\n\n对于字符到摩斯密码的映射，我们可以求助于一个关联映射。由于我们需要双向转换，可以使用两个映射：一个 `Map` 将字符与摩斯密码关联，第二个\
  \ `Map` 将摩斯密码与字符关联。原则上，键值对是相同的，仅方向不同。\n\n本质上，我们需要的是一个双向映射（缩写：BidiMap）。它同时存储了键-值映射和值-键映射。Java\
  \ SE 库中没有对应的实现，但它的实现非常简单：\n\n`com/tutego/exercise/util/MorseDemo.java`\n\n```java\n\
  class BidiMap<K, V> {\n  private final Map<K, V> keyToValue = new HashMap<>();\n\
  \  private final Map<V, K> valueToKey = new HashMap<>();\n\n  void put( K key, V\
  \ value ) {\n    keyToValue.put( Objects.requireNonNull( key ),\n              \
  \     Objects.requireNonNull( value ) );\n    valueToKey.put( value, key );\n  }\n\
  \n  Optional<V> getFromKey( K key ) {\n    return Optional.ofNullable( keyToValue.get(\
  \ key ) );\n  }\n\n  Optional<K> getFromValue( V value ) {\n    return Optional.ofNullable(\
  \ valueToKey.get( value ) );\n  }\n}\n```\n\n每次插入操作都会向两个关联内存中写入一对数据。我们倾向于不接受 `null`\
  \ 值，但它们在我们的程序中并不会发生。如果查询没有返回值，响应不是像 `Map` 方法 `get(…)` 那样的 `null`，而是 `Optional.empty()`。不需要对键进行排序，所以我们不需要\
  \ `TreeMap`，用 `HashMap` 即可。\n\n让我们进入主程序。第一步是填充 BidiMap：\n\n`com/tutego/exercise/util/MorseDemo.java`\n\
  \n```java\nclass Morse {\n  private final BidiMap<Character, String> charToMorse\
  \ = new BidiMap<>();\n\n  Morse() {\n    String encoded = \"a.- b-... c-.- d-..\
  \ e. f..-. g..... i.. j k-. \" +\n                     \"l.. m-. o--- p.-- q.- r.\
  \ s... u- v-... \" +\n                     \"w.-- x-. y-- z.. 1---- 2--- 3.... 4-\
  \ \" +\n                     \"5..... 6.... 7... 8.. 9---- 0-----\";\n    for (String\
  \ token : encoded.split(\" \")) charToMorse.put(token.charAt(0), token.substring(1));\n\
  ```\n\n为了填充 `BidiMap`，我们可以编写类似下面的的代码：\n\n```java\nidiMap.put('a', \"-\");\nidiMap.put('b',\
  \ \"-...\");\n```\n\n然而，这种方法需要大量的代码。建议的解决方案使用了另一种方式，即让字符串由由空格分隔的对组成，在这些对中，第一个符号是键，其后的序列是摩斯字符。\n\
  \n让我们来看 `encode(…)` 和 `decode(…)`：\n\n`com/tutego/exercise/util/MorseDemo.java`\n\
  \n```java\npublic String encode( String string ) {\n  StringJoiner result = new\
  \ StringJoiner(\" \");\n  for (int i = 0; i < string.length(); i++ ) {\n    char\
  \ c = string.charAt(i);\n    if (c == ' ')\n      result.add(\"\");\n    else\n\
  \      charToMorse.getFromKey(Character.toLowerCase(c))\n        .ifPresent(result::add);\n\
  \  }\n  return result.toString();\n}\n\npublic String decode( String string ) {\n\
  \  StringBuilder result = new StringBuilder(string.length() / 4 );\n  final String\
  \ ONE_SPACE = \" \", TWO_SPACES = \" \";\n  for (String word : string.split(TWO_SPACES)\
  \ ) {\n    for (String character : word.split(ONE_SPACE) )\n      Optional.of(character)\n\
  \        .flatMap(charToMorse::getFromValue)\n        .ifPresent(result::append);\n\
  \    result.append(' ');\n  }\n  return result.toString();\n}\n}\n```\n\n\n\n转换为摩斯码的字母和数字通过空格分隔。我们再次依靠\
  \ `split(…)`，尽管 `Scanner` 或 `StringTokenizer` 也会有帮助。通过提取子字符串，`getFromValue(…)` 查询\
  \ `Map`。如果序列不存在，`getFromValue(…)` 将返回 `Optional.empty()`。通过 `Optional` 我们可以很好地表达这一点：\n\
  \n1. 构建一个带有 token 的 `Optional`。\n2. 将 token 映射到 entry。如果 `Map` 没有关联的值， `Optional`\
  \ 将为空。\n3. 如果有关联，则将关联值附加到 `StringBuilder`。\n\n最后，我们将 `StringBuilder` 转换为 `String`\
  \ 并返回。\n\n### 记忆单词频率\n\n`com/tutego/exercise/ImportantGossip.java`\n\n```java\n\
  class ColorNames {\nstatic final int LIMIT = 5;\n\nprivate static Map<String, Integer>\
  \ wordOccurrences(String... words) {\n  Map<String, Integer> wordOccurrences = new\
  \ HashMap<>(words.length);\n  for (String word : words)\n    wordOccurrences.merge(word,\
  \ 1, Integer::sum);\n  return wordOccurrences;\n}\n\npublic static List<String>\
  \ importantGossip(String... words) {\n\n  List<Entry<String, Integer>> wordOccurrenceList\
  \ =\n      new ArrayList<>(wordOccurrences(words).entrySet());\n\n  Comparator<Entry<String,\
  \ Integer>> wordOccurrenceComparator =\n      Entry.<String, Integer>comparingByValue()\n\
  \            .reversed()\n            .thenComparing(Entry::getKey);\n\n  wordOccurrenceList.sort(wordOccurrenceComparator);\n\
  \n  List<String> result = new ArrayList<>(LIMIT);\n  for (Entry<String, Integer>\
  \ entry : wordOccurrenceList) {\n    result.add(entry.getKey());\n    if (result.size()\
  \ >= LIMIT)\n      break;\n  }\n\n  return result;\n}\n```\n\n建议的解决方案包含三个步骤：首先，我们要统计文本中所有单词的频率。第二步，按频率排序。**步骤\
  \ 1**：为了使解决方案更具模块化，`wordOccurrences(String... words)` 帮助我们确定字符串的出现次数。为了计数次数，我们使用一个\
  \ `Map` 将 `String` 与 `Integer`（次数）关联起来。循环遍历所有单词并将其添加到 `Map` 中。为了累加，可以使用方便的 `merge(…)`\
  \ 方法：\n\n```java\ndefault V merge(K key, V value, BiFunction<? super V, ? super\
  \ V, ? extends V> remappingFunction)\n```\n\n通过我们可以为新键设置初始值（在本例中为 `1`），或者为现有键调用\
  \ `BiFunction` 将旧值与合并值（也是 `1`）结合并写回。我们的组合是加法。\n\n进入 `importantGossip(…)` 方法。\n\n\
  **步骤 2**：调用 `wordOccurrences(…)` 后，变量 `wordOccurrences` 存储每个单词及其出现次数，类型为 `Map<String,\
  \ Integer>`。`Map` 是无序的，即使使用 `TreeMap` 也只能按键排序。我们需要将数据复制到允许按次数排序的不同数据结构中。这里有两种考虑：一种以后可以用\
  \ `sort(Comparator)` 排序的 `List`，另一种始终保持元素排序的 `TreeSet(Comparator)`。元素是字符串和次数的元组。`Map`\
  \ 方法 `entrySet()` 非常有用，它返回类型为 `Map.Entry` 的键值对集合。我们可以将这些 `Map.Entry` 对象复制到新的数据结构中，然后按次数对它们排序，次数通过\
  \ `Map.Entry` 的 `getValue()` 获取。\n\n为了排序，我们希望使用比 `TreeSet` 更轻量级的 `List`。因此，一个新的可\
  \ `ArrayList` 被填充了来自 `wordOccurrences(…)` 的 `Map.Entry` 对象。排序通常由 `Comparator` 决定；变量\
  \ `wordOccurrenceComparator` 定义了该 `Comparator`。它必须将次数作为 `Map.Entry` 对象的第一个标准，如果次数相等，则添加单词的字典序。该\
  \ `Comparator` 可以使用静态和 `default` 方法很好地构建。我们有两种开始方式：\n\n* `Entry.comparingByValue()`。`Map.Entry`\
  \ 接口提供了该静态方法，返回一个使用值的自然顺序的 `Comparator`；我们的类型是 `Integer`，给出了自然顺序。（否则，可以使用 `comparingByValue(?\
  \ super V)`）。\n* `Comparator.comparingInt(Entry::getValue)`\n\n由于 Java 泛型在这种情况下无法推断类型，必须是\
  \ `Entry<String, Integer>comparingByValue()`。由于出现次数高的单词排在前面，频率低的单词排在后面，我们需要反转默认顺序，这通过\
  \ `reversed()` 完成。如果次数出现两次，我们使用 `thenComparing(…)` 推送第二个 `Comparator`，它使用单词顺序作为第二个标准。这允许列表进行排序。\n\
  \n**步骤 3**：在最后一步，程序必须从排序后的列表中提取前五个元素。有多种方法可以实现这一点，有两种填充 `List<String> result` 的方法：\n\
  \n1. 一个增强型 `for` 循环遍历排序后的 `Entry<String, Integer>`，从 `Map.Entry` 对象中提取键（单词）并添加到\
  \ `result` 中。如果 `result` 达到五个元素。\n2. 我们可以将 `wordOccurrenceList` 缩减为五个元素，这消除了条件语句和\
  \ `break`：\n\n```java\nwordOccurrenceList = wordOccurrenceList.subList(0, Math.min(wordOccurrenceList.size(),\
  \ LIMIT));\n```\n\n\n\n\n在建议的解决方案中，`Color` 类作为嵌套静态类包含在 `ColorNames` 中。这种依赖是合理的，因为\
  \ `Color` 对象只在 `ColorNames` 的上下文中才有意义。`Color` 对象拥有所需的名称和 RGB 值的实例变量，并提供了一个接收名称和\
  \ RGB 值的构造函数。这些实例变量是私有的，构造函数也是如此——外部类仍然可以使用该私有构造函数，这是 Java 可见性的一个特性。构造函数接收字符串格式的\
  \ RGB 值，这意味着对其进行解码。为了这一点，`Color` 类声明了自己的方法。如果构造函数不是私有的，我们可以使用 `record` 代替类。\n\n\
  `int decodeHexRgb(String)` 首先检查字符串的有效性。如果它不是以 `#` 开头，则规范不成立。此外，如果字符串的长度不是四个或七个字符，则这是一个错误，并将抛出\
  \ `IllegalArgumentException`。虽然文件中的 RGB 值是正确的，但这个公共方法是供所有人使用的，应该注意到错误的字符串。如果字符串仅包含四个符号，则它是简写表示法，红、绿、蓝值将翻倍。对于翻倍操作，我们采用了易于阅读的简单拼接。还有其他可能性，例如在格式化字符串中使用参数索引；一种解决方案是：\n\
  \n```java\n\"#%1$s%1$s%2$s%2$s%3$s%3$s\".formatted(\n    hexRgb.charAt( 1 ), hexRgb.charAt(\
  \ 2 ), hexRgb.charAt( 3 )\n);\n```\n\n由于 `Formatter` 也知道相对索引，它也可以被写为：\n\n```java\n\
  \"#%1$s%<s%2$s%<s%3$s%<s\".formatted( ... );\n```\n\n显而易见，简单的拼接可读性最好。`Integer.decode(…)`\
  \ 然后返回对应的整数类型的 RGB 值。\n\n此外，`ColorNames` 有一个构造函数，该构造函数接收文件名。`Files.readAllLines(…)`\
  \ 读取文件的所有行，扩展的 `for` 循环逐行遍历它们。每行通过 `split(…)` 方法被分化为字符串，我们访问数组中的第二个和第三个元素——即索引 1\
  \ 和 2——并用它们填充构造函数。我们将生成的 `Color` 对象放入 `Map` 中，其中作为整数的 RGB 值是与其关联的 `Color` 对象的键。剩余的方法\
  \ `decode(String)` 查询 `Map`，如果 RGB 值和颜色之间没有关联，则可能返回 `null`。由于我们想避免将 `null` 作为返回值，`Optional.ofNullable(…)`\
  \ 让未知的 RGB 值变为 `Optional.empty()`。\n\n### 读取名称并管理长度\n\n**com/tutego/exercise/util/FamilyNamesByLength.java**\n\
  \n```java\nSortedMap<Integer, List<String>> namesByLength = new TreeMap<>();\n\n\
  InputStream resource = FamilyNamesByLength.class.getResourceAsStream(\"family-names.txt\"\
  );\ntry (Scanner scanner = new Scanner(resource)) {\n  while (scanner.hasNextLine())\
  \ {\n    String name = scanner.nextLine();\n    namesByLength.computeIfAbsent(name.length(),\
  \ __ -> new ArrayList<>())\n                  .add(name);\n  }\n}\n\nnamesByLength.forEach(\n\
  \    (len, names) -> System.out.println(len + \" \" + names)\n);\n\nfor (int len;\
  \ (len = new Scanner(System.in).nextInt()) > 0; ) {\n  int finalLen = len;\n  Optional.ofNullable(namesByLength.get(len))\n\
  \          .ifPresentOrElse(\n              System.out::println,\n             \
  \ () -> System.out.printf(\"No words of length %d%n\", finalLen)\n          );\n\
  }\n```\n\n`SortedMap<Integer, List<String>>` 表示整数与列表的关联。在将字符串添加到列表之前，必须创建列表。程序必须按以下方式进行：\n\
  \n1. 它必须检查该长度是否已经列表，如果是，可以追加字符串。\n2. 如果 `Map` 中没有该长度的条目，则必须与长度关联一个列表，并添加该长度的第一个单词。\n\
  \n在代码中，可以这样表示：\n\n```java\nif (!namesByLength.containsKey(line.length()))\n    namesByLength.put(line.length(),\
  \ new ArrayList<>());\n\nnamesByLength.get(line.length()).add(line);\n```\n\n它使用\
  \ `containsKey(…)` 检查字符串长度是否存在列表，如果没有，则为该长度创建一个新的 `ArrayList`。随后的语句始终通过 `put(…)`\
  \ 成功添加它，因为保证有一个列表。\n\n自 Java 8 以来，我们不需要手动编写此代码，可以使用默认方法 `computeAbsent(…)`。描述有点复杂，在源代码中理解该方法更容易：**OpenJDK\
  \ 对 `java.util.Map` 的实现**\n\n```java\ndefault V computeAbsent(K key, Function<?super\
  \ K, extends V> mappingFunction) {\n  Objects.requireNonNull(mappingFunction);\n\
  \  V v;\n  if ((v = get(key)) == null) {\n    V newValue;\n    if ((newValue = mappingFunction.apply(key))\
  \ != null) {\n      put(key, newValue);\n      return newValue;\n    }\n  }\n  return\
  \ v;\n}\n```\n\n首先，调用 `get(key)` 方法，这里有两种输出：\n\n1. 如果值不是 `null`，直接返回。对于我们的情况，这意味着已经构建了列表。\n\
  2. 如果 `get(…)` 返回 `null`（即键没有关联），则对键的函数被调用，值被存储在键下，至少在不是 `null` 的情况下。在我们的情况下，隐藏了此标识符\
  \ `__`。对于读者的疑问：与其使用 `__ -> new ArrayList<>()`，参数引用 `ArrayList::new` 是否可行？`computeAbsent(…)`\
  \ 在任何情况下都会返回列表，我们可以级联 `add(…)`。\n\n程序逐行读取文件并填充数据结构后，`Map` 方法 `forEach(BiConsumer)`\
  \ 遍历所有条目。我们的 `BiConsumer` 获取键值并输出到屏幕。\n\n程序的最后部分在一个循环中，只有当输入为 0 或负数时才会终止。程序请求一个整数作为长度。然后\
  \ `get(…)` 请求列表，但如果没有对应的列表，结果可能为 `null`。`Optional.ofNullable(…)` 可以可能的 `null` 好地封装到\
  \ `Optional` 中，因为如果键没有关联的值，`Optional.isEmpty()` 为真。`ifPresentOrElse(…)` 类似于控制语句：如果\
  \ `Optional` 包含值，我们的 `Consumer` 打印列表；如果没有关联的值，屏幕上会提示不存在该长度的单词。赋值 `int finalLen =\
  \ len` 的技巧是必要的，因为 Lambda 表达式只能访问最终变量，而计数器 `len` 会改变。复制到中间变量解决了这个问题。\n\n### 查找缺失字符\n\
  \n解决方案由两部分组成：首先，我们构建一个对我们最优的数据结构，在下一步我们查询该数据结构。\n\n**com/tutego/exercise/util/FindMissingLetters.java**\n\
  \n```java\nList<String> words = Arrays.asList(\"house\", \"mouse\", \"horn\", \"\
  cannon\");\n\nMap<String, List<String>> map = new HashMap<>();\n\n// 初始化 map\nfor\
  \ (String word : words) {\n  for (int index = 0; index < word.length(); index++)\n\
  \    map.computeIfAbsent(index + \"-\" + word.charAt(index),\n                 \
  \        __ -> new ArrayList<>()).add(word);\n}\nSystem.out.println(map);\n```\n\
  \n\n\n该任务可以通过多种数据结构和方法来解决。这里选择的版本执行了以下操作：它构建了一个 `Map<String, List<String>>`，其中字母的位置与一个单词列表关联。以\
  \ `house` 和 `mouse` 为例。这两个单词在索引 `1` 处都有一个 `o`。这种索引与字母之间的关联是关联记忆的关键。程序将将输入的 `house`、`mouse`、`horn`\
  \ 和 `cannon` 转换为以下 `map`：\n\n```\n{0-m=[mouse], 2-n=[cannon], 1-o=[house, mouse,\
  \ horn], 3-n=[horn, cannon],\n1-a=[cannon], 5-n=[cannon], 4-o=[cannon], 0-c=[cannon],\
  \ 2-r=[horn],\n3-s=[house, mouse], 2-u=[house, mouse], 0-h=[house, horn], 4-e=[house,\n\
  mouse]}\n```\n\n为了构建这个 `Map`，外层循环遍历所有单词，然后内层循环遍历所选单词的每个字母。索引、减号和位置组成的组合被放入关联记忆中。由于关联记忆并没有直接将此键与单词连接，而是字符串进入列表，因此当第一个单词要放入列表时，必须重新构建列表。对于此类任务，`computeIfAbsent(K\
  \ key, Function mappingFunction)` 是完美的；如果该键下没有关联的列表，则会调用映射函数并返回一个新列表，然后将该列表与键键关联。方法\
  \ `computeIfAbsent(…)` 的结果是关联值，即我们的列表，我们可以在其中添加单词。\n\n在第二部分，我们可以查询该数据结构并解决包含未识别字符的问题。\n\
  \n`com/tutego/exercise/util/FindMissingLetters.java`\n\n```\n// 查询数据结构\nConsumer<String>\
  \ letterFinder = word -> {\n  Set<String> matches = null;\n  for (int index = 0;\
  \ index < word.length(); index++) {\n    // 跳过未知字符\n    if (word.charAt(index) ==\
  \ '_')\n      continue;\n    List<String> wordCandidates = map.get(index + \"-\"\
  \ + word.charAt(index));\n    // 如果没有已知条目则退出循环\n    if (wordCandidates == null)\
  \ {\n      // 为了正确的控制台输出，移除可能的之前的匹配项\n      matches = null;\n      break;\n    }\n\
  \    // 构建副本并移除长度不匹配的单词\n    wordCandidates = new ArrayList<>(wordCandidates);\n\
  \    wordCandidates.removeIf(s -> s.length() != word.length());\n    // 合并所有已知字母的匹配项\n\
  \    if (matches == null)\n      matches = new HashSet<>(wordCandidates);\n    else\n\
  \      matches.retainAll(wordCandidates);\n  }\n  System.out.println(word + \" ->\
  \ \" +\n                      (matches == null || matches.isEmpty() ?\n        \
  \                       \"No results\" : matches));\n};\n\nList<String> missingLettersWords\
  \ =\n    Arrays.asList(\"_ouse\", \"ho__\", \"gun\", \"____e\", \"_____\");\n\n\
  missingLettersWords.forEach(letterFinder);\n```\n\n`Consumer` 是一种子程序，它接收一个带有下划线的单词，查询\
  \ `Map` 并打印匹配的单词。匹配单词存储在一个名为 `matches` 的集合中。该算法的工作原理是：首先搜索与给定单词位置相同的所有单词，将它们添加到集合中，然后与添加的字符取交集。初始状态下，可能有很多第一位为\
  \ `h` 的候选词，但随着额外字符的添加（例如第二位为 `o`），集合会变小。\n\n程序中可以识别出一个大循环。它从前到后遍历单词，并检索位置在 `0`、`1`\
  \ 等处的所有字符。未知字符没有用处（但我们可以接受所有单词），因此程序直接返回。如果字符不是下划线，我们就会根据 `index`、减号和字符生成一个键。通过此键，我们查询\
  \ `Map`，在理想情况下，我们得到一个列表。然而，此键可能没有列表，即源单词中有一个字符但没有匹配项；此时没有解决方案，集合 `matches` 变为 `null`，我们中止循环。\n\
  \n一旦我们为该字符找到了一组匹配单词列表，程序首先创建该列表的副本，并在第二步移除所有与源单词长度不同的单词。现在，我们必须在之前的单词和新单词之间创建一个交集，因为结果必须同时出现在两个集合中。如果没有找到任何单词，`matches`\
  \ 等于 `null`，我们将使用当前候选词构建一个新集合。只有在第一次命中时，不会构建交集；如果已经有了结果且 `matches` 不为 `null`，则 `retainAll(…)`\
  \ 会从 `matches` 中删除所有不在 `wordCandidates` 中的单词。循环结束时，我们已经遍历了所有字符并缩小了 `matches` 集合。如果集合为空，控制台输出将显示集合的内容。\n\
  \n### 计算到三头怪的路径数\n\n用于缓存的数据结构 `WeakHashMap` 使用了弱引用。Java 中基本上有四种类型的引用：\n\n- 强引用（Strong\
  \ references）是 Java 程序员在日常生活中处理的普通引用。垃圾回收器会清理这些引用。\n- `WeakReference`（弱引用）是在垃圾回收阶段执行运行时会被释放的引用。这具体取决于\
  \ JVM 的实现。\n- 使用 `SoftReference`（软引用），JVM 在接近 `OutOfError` 时会尽可能保持对象存活。\n- 使用 `PhantomReference`（虚引用），我们只能知道垃圾器已删除了对象。\n\
  \n`WeakHashMap` 内部使用 `WeakReference`，因此我们不需要直接处理这些清理。对于我们的计算，这是一个很好的选择，因为 `WeakHashMap`\
  \ 在需要计算阶时时填充——但阶乘不需要在内存中留过久，会被清除。\n\n`WeakHashMap` 是一个特殊的 `Map`，这意味着可以使用所有已知方法。\n\
  \n![显示从 WeakHashMap 指向 Map 接口的箭头](img/Fig05_03.jpg)\n\n**图 5.3** 实现 `Map` 的 `WeakHashMap`\
  \ UML 图。\n\n`com/tutego/exercise/util/CachedCatalan.java`\n\n```\nprivate static\
  \ final Map<BigInteger, BigInteger> factorialCache =\n    new WeakHashMap<>();\n\
  \nprivate static BigInteger factorial(BigInteger n) {\n  BigInteger maybeCachedValue\
  \ = factorialCache.get(n);\n\n  if (maybeCachedValue != null)\n    return maybeCachedValue;\n\
  \n  // n < 2 ? 1 : n * factorial(n - 1)\n  BigInteger result = isLessThan(n, TWO)\n\
  \                      ? ONE\n                      : n.multiply(factorial(n.subtract(ONE)));\n\
  \n  factorialCache.put(n, result);\n  return result;\n}\n\nprivate static boolean\
  \ isLessThan(BigInteger a, BigInteger b) {\n  return a.compareTo(b) < 0;\n}\n\n\
  public static BigInteger catalan(BigInteger n) {\n  // (2n)! / (n+1)!n!\n  BigInteger\
  \ numerator = factorial(TWO.multiply(n));\n  BigInteger denominator = factorial(n.add(ONE))\n\
  \                           .multiply(factorial(n));\n  return numerator.divide(denominator);\n\
  }\n```\n\n\n\n2.  如果该值不在缓存中，则对其进行计算并缓存。这需要花费时间。\n\n`factorial(…)` 方法的实现方式相同。它会查询缓存，可能存在结果，也可能没有。我们已经知道\
  \ `Map` 的 `get(…)` 方法的响应行为，如果没有关联的值，它将返回 `null`。这是我们判断缓存中是否存在该值的指标。如果结果不等于 `null`，则说明缓存中已经有了计算好的阶乘结果\
  \ `BigInteger`，我们可以直接返回它。但如果 `get(…)` 返回 `null`，我们就必须计算阶乘，然后将结果放入 `factorialCache`\
  \ 并返回。对于比较一个 `BigInteger` 比另一个大还是小，`BigInteger` 并没有提供特殊的方法，因为 `BigInteger` 具有自然排序，因此它实现了\
  \ `Comparable`。然而，使用 `compareTo(…)` 的可读性并非最优；因此引入了一个独立的方法 `isLessThan(…)`。静态导入了\
  \ `BigInteger` 常量 `ONE` 和 `TWO`，这稍微缩短了代码。\n\n另一种实现方案可以使用 `computeIfAbsent(…)`，但这里展示的代码更易于理解。\n\
  \n`catalan(…)` 方法执行了记录的计算，并访问了三次 `factorial(…)`。许多条目已经在缓存中，因此 `factorial(…)` 可以从缓存提供许多响应。\n\
  \n### 在排序关联存储中管理节假日\n\n**com/tutego/exercise/util/Holidays.java**\n\n```java\nint\
  \ year = 2024;\nNavigableMap<LocalDate, String> dates = new TreeMap<>( Map.of(\n\
  \  LocalDate.of( year, Month.JANUARY, 1 ), \"New Year's Day\",\n  LocalDate.of(\
  \ year, Month.MARCH, 17 ), \"Saint Patrick's Day\",\n  LocalDate.of( year, Month.APRIL,\
  \ 1 ), \"April Fools' Day\",\n  LocalDate.of( year, Month.APRIL, 22 ), \"Earth Day\"\
  ,\n  LocalDate.of( year, Month.MAY, 4 ), \"Star Wars Day\",\n  LocalDate.of( year,\
  \ Month.JUNE, 24 ), \"Eid al-Fitr\",\n  LocalDate.of( year, Month.SEPTEMBER, 19\
  \ ), \"International Talk Like a Pirate Day\",\n  LocalDate.of( year, Month.SEPTEMBER,\
  \ 21 ), \"World Peace Day\",\n  LocalDate.of( year, Month.DECEMBER, 24 ), \"Christmas\
  \ Eve\",\n  LocalDate.of( year+1, Month.JANUARY, 1 ), \"New Year's Day\"\n ) );\n\
  \nSystem.out.println( dates.firstEntry() );\nSystem.out.println( dates.lastEntry()\
  \ );\n\nLocalDate festiveSeasonStart = LocalDate.of( year, Month.DECEMBER, 23 );\n\
  LocalDate festiveSeasonEnd = LocalDate.of( year + 1, Month.JANUARY, 6 );\n\nSystem.out.println(\
  \ dates.higherEntry( festiveSeasonEnd ) );\nSortedMap<LocalDate, String> festiveSeason\
  \ =\n    dates.subMap( festiveSeasonStart, true, festiveSeasonEnd, true );\n\nSystem.out.printf(\
  \ \"%d festivals and holidays in range:%n\", festiveSeason.size() );\nfestiveSeason.forEach(\n\
  \    (date, name) -> System.out.printf( \"%s - %s%n\", name, date )\n);\n\nfestiveSeason.clear();\n\
  \nSystem.out.println( dates );\n```\n\n建议的解决方案使用了描述的 `firstEntry()`、`lastEntry()`、`higherEntry(K)`\
  \ 和 `subMap(K, boolean, K, boolean)` 方法。\n\n`NavigableMap` 的不同方法返回所谓的“视图”（views）。视图不是数据的拷贝，但对视图进行的操作始终会作用于底层数据结构。因此，我们可以通过视图上的\
  \ `clear()` 方法实现子区域的删除。视图的内存高效且性能良好，但也会导致错误，因为你可能会无意中修改底层数据结构，却以为你正在处理一个副本。如果底层数据结构是不可变的（即完全无法修改），但向视图中插入了元素，就会导致问题。\n\
  \n### 测验：HashMap 中的键\n\n程序的输出如下：\n\n```\n{java.awt.Point[x=2,y=1], java.awt.Point[x=1,y=2]}\n\
  null\njava.awt.Point[x=1,y=2]\n```\n\n插入的键必须是不可变的，否则动态计算的哈希值将会改变，导致找不到对象。\n\n###\
  \ 确定共性：集合集与纪念品\n\n**com/tutego/exercise/util/Gifts.java**\n\n```java\nprivate static\
  \ void printGifts(List<Set<String>> families) {\n  class Bag extends HashMap<String,\
  \ Integer> {\n    void add(String key) {\n      merge(key, 1, Integer::sum); \n\
  \    }\n    int getCount(String key) { \n      return getOrDefault(key, 0); \n \
  \   }\n  }\n\n  Bag giftsToCounter = new Bag();\n\n  for (Set<String> gifts : families)\
  \ {\n    for (String gift : gifts) {\n      giftsToCounter.add(gift);\n    }\n \
  \ }\n\n  System.out.println(giftsToCounter);\n\n  giftsToCounter.forEach((gift,\
  \ counter) -> {\n    if (counter > 1)\n      System.out.println(gift);\n  });\n\
  ```\n\n### 开发便捷属性装饰器\n\n**com/tutego/exercise/util/PropertiesConfiguration.java**\n\
  \n```java\npublic class PropertiesConfiguration {\n  private final Properties properties;\n\
  \n  public PropertiesConfiguration(Properties properties) {\n    this.properties\
  \ = properties;\n  }\n\n  public Optional<String> getString(String key) {\n    return\
  \ Optional.ofNullable(properties.getProperty(key));\n  }\n\n  public Optional<Boolean>\
  \ getBoolean(String key) {\n    try {\n      return getString(key).map(Boolean::valueOf);\n\
  \    } catch (Exception e) {\n      return Optional.empty();\n    }\n  }\n\n  public\
  \ Optional<BigInteger> getBigInteger(String key) {\n    try {\n      return getString(key).map(BigInteger::new);\n\
  \    } catch (Exception e) {\n      return Optional.empty();\n    }\n  }\n\n  public\
  \ OptionalDouble getDouble(String key) {\n    try {\n      return OptionalDouble.of(Double.parseDouble(properties.getProperty(key)));\n\
  \    } catch (Exception e) {\n      return OptionalDouble.empty();\n    }\n  }\n\
  \n  public OptionalLong getLong(String key) {\n    try {\n      return OptionalLong.of(Long.parseLong(properties.getProperty(key)));\n\
  \    } catch (Exception e) {\n      return OptionalLong.empty();\n    }\n  }\n\n\
  \  public List<String> getList(String key) {\n    List<String> result = getString(key)\n\
  \      .map(s -> s.split(\"(?<!\\\\\\\\),\\\\s*\"))\n      .map(Arrays::asList)\n\
  \      .orElse(Collections.emptyList());\n    return result;\n  }\n\n  public void\
  \ putBinary(String key, byte[] bytes) {\n    String base64 = Base64.getEncoder().encodeToString(bytes);\n\
  \    properties.setProperty(key, base64);\n  }\n\n  public Optional<byte[]> getBinary(String\
  \ key) {\n    return getString(key)\n      .map(base64 -> Base64.getDecoder().decode(base64));\n\
  \  }\n}\n```\n\n\n\n\n我们的 `PropertiesConfiguration` 类有一个构造函数，用于接收并存储实际的 `Properties`。我们的方法比\
  \ `Properties` 类提供的方法更灵活，但我们的方法内部是基于 `Properties` 类的方法的。也就是说，我们提供的所有方法在某种程度上都依赖于\
  \ `Properties` 类的方法。核心方法是 `getProperty(String)`，而且在设置属性时，我们也使用了 `setProperty(…)`。\n\
  \n*   `Optional<String>` `getString(String)`：属性可能存在，也可能不存在；如果我们使用简单的 `getProperty(String)`\
  \ 方法访问一个不存在的属性，`getProperty(…)` 将返回 `null`。虽然有一个 `getProperty(String key, String\
  \ defaultValue)` 方法，但它并不能防止 `null` 的返回，调用者必须进行 `null` 处理。Java 通过 `Optional` 数据类型提供了一种优雅的方式来表达请求的值并不存在。此外，`Optional`\
  \ 还为我们提供了一种非常棒的方式来表达替代方案，例如使用 `Optional` 方法 `orElse(T other)`、`orElseGet(Supplier<?\
  \ extends T> other)` 甚至 `orElseThrow(Supplier<? extends X> exceptionSupplier)`。\n\
  \n*   `Optional<Boolean>` `getBoolean(String)` 和 `Optional<BigInteger>` `getBigInteger(String)`：如果我们先调用\
  \ `getString(…)`，可以利用 `Optional` 方法 `map(Function)` 将 `String` 转换为 `Boolean` 和 `BigInteger`\
  \ 数据类型，如果 `Optional` 包含值，则将其放入一个新的 `Optional` 中。然而，由于底层 `Properties` 对象中的格式可能是错误的，转换过程中可能会发生异常。我们捕获该异常，并在这种情况下方法返回\
  \ `Optional.empty()`。\n\n*   `OptionalDouble getDouble(String)` 和 `OptionalLong\
  \ getLong(String key)`：对于原始类型 `double` 和 `long`，有特殊的数据类型，即 `OptionalDouble` 和 `OptionalLong`。逻辑类似。\n\
  \n*   `List<String>` `getList(String)`：如果我们返回一个列表，我们使用自己的方法 `getString(…)`，因为它返回一个\
  \ `Optional`，我们可以直接对其设置一个 `map(…)` 来将逗号分隔的各个条目转换为字符串数组。下一次调用 `map(…)` 则将数组转换为列表。如果源方法\
  \ `getString(…)` 返回 `Optional.empty()`，`orElse(…)` 将为我们返回一个空列表。我们有一个约定：逗号必须被 `\\\
  ` 转义，这样它就不会被视为分隔符。其他字符串现在仍然包含 `\\,` 而不是 `,`。我们通过使用 `List` 方法 `replaceAll(…)` 来解决这个问题，它执行一个函数来替换每个元素。\n\
  \n*   `void putBinary(String, byte[])`, `Optional<byte[]>` `getBinary(String)`：之前的方法只是方便读取的方法。通过\
  \ `putBinary(…)`，我们有一个方法可以将 `byte` 数组编码为 `Base64` 并将其放入 `Properties` 对象中。对于 Base64\
  \ 转换，Java 提供了 `Base64` 类。`getEncoder()` 和 `getDecoder()` 方法返回用于将 `byte` 数组转换为字符串以及字符串转换为\
  \ `byte` 数组的对象。字符串到数组的转换由 `getBinary(…)` 方法处理。同样，我们自己的 `getString(…)` 方法返回 `optional`，`map(…)`\
  \ 方法将 `String` 转换为 `byte[]`。\n\n### 程序 RPN 便携计算器\n\n**com/tutego/exercise/util/RPN.java**\n\
  \n```\nString input = \"160 50 30 + /\";\nQueue<Integer> stack = Collections.asLifoQueue(\
  \ new ArrayDeque<>() );\n\nPattern operatorPattern = Pattern.compile(\"[+*/-]\"\
  );\nPattern numericPattern = Pattern.compile(\"\\\\d+\");\nfor (String token : input.split(\"\
  \\\\s+\")) {\n  Matcher operatorMatcher = operatorPattern.matcher(token);\n  Matcher\
  \ numericMatcher = numericPattern.matcher(token);\n  if (numericMatcher.matches())\n\
  \    stack.add(Integer.parseInt(token));\n  else if (operatorMatcher.matches())\
  \ {\n    int operand2 = stack.remove();\n    int operand1 = stack.remove();\n  \
  \  stack.add(switch (token) {\n      case \"+\" -> operand1 + operand2;\n      case\
  \ \"-\" -> operand1 - operand2;\n      case \"*\" -> operand1 * operand2;\n    \
  \  case \"/\" -> operand1 / operand2;\n      default -> throw new IllegalArgumentException(\"\
  Illegal operator \" + token + \" found\");\n    });\n  }\n  else\n    throw new\
  \ IllegalArgumentException(\"Unknown type \" + token);\n}\nSystem.out.printf(\"\
  Result: %d\", stack.remove());\n```\n\nRPN 计算器分两个步骤工作：\n\n1. 将字符串拆分为标记（tokens）。\n\
  2. 处理标记。在这里，我们根据标记是数字还是符号来区分区别。\n\n实际的算法可以通过不同的方式实现。一种方法是将所有数字收集在一个栈中，将所有运算符放在另一个栈中。最后，将运算符栈与数字栈放在一起处理。我们使用了一种带有一个栈的不同方法。\n\
  \nJava 提供了数据结构 `java.util.Stack`，但该数据结构属于 Java 1 中废弃的类型，不应该再被使用。因此，我们使用 LIFO 队列，其中\
  \ `add(…)` 在末尾添加（后进），`remove(…)` 移除项（先出）。\n\n如果标记是整数的字符串表示，则我们将字符串转换为整数并将其放入栈中。此外，我们使用正则表达式检查标记是否为运算符；我们需要注意\
  \ `-` 符号代表范围，这是我们并不想要的。\n\n### 忘记飞船\n\n**com/tutego/exercise/util/CompletedCompetition.java**\n\
  \n```\nstatic void checkForCompletion(int... shipIds) {\n  final int FIRST_SHIP_ID\
  \ = 10;\n  final int LAST_SHIP_ID = 22;\n  BitSet shipsSeen = new BitSet(LAST_SHIP_ID\
  \ - FIRST_SHIP_ID + 1);\n  for (int shipId : shipIds) {\n    if (shipId < FIRST_SHIP_ID\
  \ || shipId > LAST_SHIP_ID)\n      throw new IllegalArgumentException(\"Ship \"\
  \ + shipId + \" is out of bounds\");\n\n    boolean seenBefore = shipsSeen.get(shipId\
  \ - FIRST_SHIP_ID);\n    if (seenBefore)\n      System.out.printf(\"Ship %d appears\
  \ more than one.%n\", shipId);\n    else\n      shipsSeen.set(shipId - FIRST_SHIP_ID);\n\
  \  }\n\n  for (int i = FIRST_SHIP_ID; i <= LAST_SHIP_ID; i++) {\n    if (!shipsSeen.get(i\
  \ - FIRST_SHIP_ID))\n      System.out.printf(\"Ship %d is missing.%n\", i);\n  }\n\
  }\n```\n\n`BitSet` 类型是一种特殊的数据结构，用于将小整数值与真值相关联。这对于解决方案非常有用，因为我们可以将每个飞船的 ID 映射到一个真值（位设置或未设置），从而告诉我们飞船是否出现过。\n\
  \n\n\n\n第一步是构建 `BitSet` 本身。由于在初始化时指定预计的元素数量是一个良好的习惯，因此我们这样做。如果这个数量不精确也没有关系，所有动态数据结构之后都可以调整其内部容量。\n\
  \n接下来的扩展 `for` 循环遍历所有的 ID，测试值范围，并检查该 ID 是否出现过。如果已经出现过，则报告此错误。如果 ID 尚未出现，则在 `BitSet`\
  \ 对应的位置设置位。\n\n最后，运行一个普通的 `for` 循环遍历所有 ID，如果位未被设置，我们就知道哪个船只 ID 没有出现。\n\n位根据起始位置\
  \ 10 进行了偏移。当然，这是一种微小的内存优化——我们本可以留前 10 位未使用。\n\n### 查找重复条目并解决动物混乱\n\n`com/tutego/exercise/util/AnimalMissing.java`\n\
  \n```java\nprivate static String sameSymbols( String string1, String string2 ) {\n\
  \  BitSet bits = new BitSet( 1024 );\n\n  string1.codePoints().forEach( character\
  \ -> bits.set( character ) );\n  int capacity = (int) ((long) string1.length() +\
  \ string2.length()) / 2;\n  StringBuilder result = new StringBuilder( capacity );\n\
  \  string2.codePoints().forEach( character -> {\n    if ( bits.get( character )\
  \ )\n      result.appendCodePoint( character );\n  } );\n\n  return result.toString();\n\
  }\n```\n\n这类任务可以按照如下方法解决：我们获取第一个字符串的第一个字符，并检查该字符是否出现在第二个字符串中。如果是，我们就记录下该字符。然后我们获取第一个字符串的下一个字符，再次测试该字符是否出现在第二个字符串中。然而，运行时间将是二次方的，因为我们必须反复从头到尾遍历第二个字符串。如果我们想避免这种情况，就需要以不同的方式处理该任务。\n\
  \n解决方案：我们跟踪第一个字符串中出现的每个字符。我们可以使用一个集合，即 `Set<Character>`，但这里提供了另一种替代方案。`BitSet` 是一种特殊的关联存储，它将一个整数与一个布尔值关联。整数不应该太大，否则\
  \ `BitSet` 将需要更多内存，但由于我们的 Unicode 字符不会任意大，内存需求也是可控的。我们可以轻松地计算出来。Unicode 15 约有 150,000\
  \ 个字符，因此我们需要那么多位——150,000 位 / 8 = 18,750 字节，小于 20 KiB，大约一张小图片的大小。\n\n语句 `string1.codePoints().forEach(…)`\
  \ 提取第一个字符串的每个单独字符。每个字符由一个代码点表示。代码点变成索引，在该位置，我们在 `BitSet` 中设置一个位进行标记。`codePoints()`\
  \ 返回一个 `IntStream`，这是我们在下一章将更频繁遇到的的特殊数据类型。\n\n对于第二个字符串，我们采取类似的步骤。在这里，我们也获取字符的 `IntStream`，但我们不设置位。相反，我们询问\
  \ `BitSet` 在 `character` 所在的位置是否设置了位。如果是，则相同的字符出现在第一个和第二个字符串中。我们想在 `StringBuilder`\
  \ 中记住这个字符。`StringBuilder` 的大小估算为 `string1` 和 `string2` 长度的算术平均值，我们必须在数据类型 `long`\
  \ 的值范围内进行加法，以避免在相两个 `int` 数字时出现溢出风险。\n\n迭代完成后，我们将 `StringBuilder` 转换为 `String` 并返回它。运行时间是线性的，取决于两个字符串的大小，因为我们只需要遍历一次第一个字符串，然后再遍历一次第二个字符串。\n\
  \n### 加载船只\n\n建议的解决方案由三部分组成：两个记录 `Loader` 和 `Unloader` 的声明以及线程的启动。\n\n数据交换通过 `java.util.concurrent.BlockingQueue`\
  \ 的实现 `ArrayBlockingQueue` 完成。对于我们的应用程序，我们需要阻塞，因此使用 `put(…)` 和 `take()`。\n\n`com/tutego/exercise/thread/LoadingShips.java`\n\
  \n```java\nrecord Loader( BlockingQueue<String> ramp ) implements Runnable {\n \
  \ @Override\n  public void run() {\n    var products = new ArrayList<>(\n      List.of(\
  \ \"rum\", \"wine\", \"salami\", \"beer\", \"cheese\", \"comics\" ) );\n    while\
  \ (! Thread.currentThread().isrupted() ) {\n      try {\n        Collections.shuffle(\
  \ products );\n        String product = products.getFirst() + \":\" + UUID.randomUUID();\n\
  \        ramp.put( product );\n        System.out.printf(\"Product with ID %s placed\
  \ on the ramp%n\", product );\n        MILLISECONDS.sleep( ThreadRandom.current().nextInt(100,\
  \ 2000) );\n      } catch ( InterruptedException e ) { Thread.currentThread().interrupt();\
  \ }\n    }\n}\n```\n\n`Loader` 是一个 `Runnable`，具有所需的构造函数，接收一个 `BlockingQueue`，这是\
  \ `Loader` 和 `Unloader` 交换数据的数据结构。`run()` 方法包含一个循环，如果从外部发送中断，循环将始终终止。在我们的案例中没有给出，但它符合最佳实践。在循环体内，选择一个随机产品并生成一个带有随机标识符的产品名称。该产品被放在码道上。`put(…)`\
  \ 方法会阻塞，因为码道可能是满的。如果线程从 `put(…)` 返回，说明一个产品可以放在码道上。最后，线程延迟执行几毫秒并继续循环。\n\n`com/tutego/exercise/thread/LoadingShips.java`\n\
  \n```java\nrecord Unloader( BlockingQueue<String> ramp ) implements Runnable {\n\
  \  @Override\n  public void run() {\n    while (! Thread.currentThread().isrupted()\
  \ ) {\n      try {\n        String product = ramp.take();\n        System.out.printf(\"\
  Product with ID %s taken off the ramp%n\", product );\n        MILLISECONDS.sleep(\
  \ ThreadRandom.current().nextInt(1000, 2000) );\n      } catch ( InterruptedException\
  \ e ) { Thread.currentThread().interrupt(); }\n    }\n  }\n}\n```\n\n记录 `Unloader`\
  \ 的结构相似。区别仅在于 `while` 循环体中，在那里必须从码道上取一个产品。我们使用 `take()` 方法。由于码道上没有产品，`take()` 方法可能会阻塞。如果\
  \ `take()` 方法返回，则一个产品可以从码道上取下并进行屏幕输出，程序流稍有延迟。\n\n`com/tutego/exercise/thread/LoadingShips.java`\n\
  \n```java\nint RAMP_CAPACITY = 10;\nBlockingQueue<String> ramp = new ArrayBlockingQueue<>(\
  \ RAMP_CAPACITY );\nExecutorService executors = Executors.newCachedThreadPool();\n\
  \nfor ( int i = 0; i < 5; i++ ) executors.execute( new Unloader( ramp ) );\nfor\
  \ (int i = 0; i < 10; i++ ) executors.execute( new Loader( ramp ) );\n```\n\n在最后部分，构建\
  \ `ArrayBlockingQueue`，将其传递给 `Loader` 和 `Unloader` 的实例，然后启动线程。\n\n### 优先处理重要消息\n\
  \n`com/tutego/exercise/util/UrgentMessagesFirst.java`\n\n```java\nString KEYWORD\
  \ = \"Little Canon\";\nComparator<Message> keywordComparator = ( msg1, msg2 ) ->\
  \ {\n  boolean msg1HasKeyword = msg1.message().contains( KEYWORD );\n  boolean msg2HasKeyword\
  \ = msg2.message().contains( KEYWORD );\n  boolean bothMessagesHaveKeywordOrNot\
  \ = msg1HasKeyword == msg2HasKeyword;\n  return bothMessagesHaveKeywordOrNot ? 0\
  \ : msg1HasKeyword ? -1 : +1;\n};\nComparator<Message> messageComparator =\n  keywordComparator.thenComparing(\
  \ Message::timestamp );\nPriorityQueue<Message> tasks = new PriorityQueue<>( messageComparator\
  \ );\n```\n\n\n\n`keywordComparator` 是解决方案的核心。它接收来自 `message` 的两条消息，并检查是否存在情感术语。为了让代码更清晰，`contains(…)`\
  \ 的结果被存储在两个变量中。现在有四种情况：两条消息都包含该情感术语、两条消息都不包含、或者两条消息中只有一个包含搜索的单词。如果两者都包含该术语或都不包含，则\
  \ `Comparator` 返回 `0`；否则，只有两条消息之一包含该字符串。如果情感术语包含在第一条消息中，则根据该 `Comparator`，该消息较小，`Comparator`\
  \ 返回负值。否则，情感术语必然存在于第二条消息中，`Comparator` 返回正值。\n\n在 `keywordComparator` 返回 `0` 的情况下，需要一个位于\
  \ `keywordComparator` 下游的 `Comparator`。在这种情况下，应该将时间视为第二个准则。追加的 `thenComparing(…)`\
  \ 添加了一个考虑时间戳的 `Comparator`。顺序是正确的，因为旧的消息带有较的时间戳。\n\n生成的 `messageComparator` 被传递给\
  \ `PriorityQueue` 的构造函数，并初始化该数据结构。\n\n### 如果用完了，就创建一个一个新的\n\n`com/tutego/exercise/thread/SecureRandomBigIntegerIteratorDemo.java`\n\
  \n```java\nclass SecureRandomBigIntegerIterator implements Iterator<BigInteger>\
  \ {\n\n  private final SynchronousQueue<BigInteger> channel =\n      new SynchronousQueue<>();\n\
  \n  public SecureRandomBigIntegerIterator() {\n    Runnable bigIntegerPutter = ()\
  \ -> {\n      try {\n        while ( true ) {\n          BigInteger bigInteger =\
  \ internalNext();\n          System.out.printf( \"> About to put number %s... into\
  \ the queue%n\",\n                              bigInteger.toString().subSequence(\
  \ 0, 20 ) );\n          channel.put( bigInteger );\n          System.out.println(\
  \ \"> Number was taken\" );\n        }\n      }\n      catch ( InterruptedException\
  \ e ) { throw new IllegalStateException(e); }\n    };\n    ForkJoinPool.commonPool().submit(\
  \ bigIntegerPutter );\n  }\n\n  private BigInteger internalNext() {\n    return\
  \ new BigInteger( 1024, new SecureRandom() );\n  }\n\n  @Override public boolean\
  \ hasNext() {\n    return true;\n  }\n\n  @Override public BigInteger next() {\n\
  \    try {\n      System.out.println( \"< About to take a number\" );\n      BigInteger\
  \ bigInteger = channel.take();\n      System.out.println( \"< Took a number out\"\
  \ );\n      return bigInteger;\n    }\n    catch ( InterruptedException e ) { throw\
  \ new IllegalStateException(e); }\n  }\n}\n```\n\n解决方案的核心是 `SynchronousQueue` 类。它与普通的\
  \ `Queue` 有显著区别，本质上仅用于将元素从一个线程传递到另一个线程。这正是我们使用 `SynchronousQueue` 的背景。\n\n我们的类 `SecureRandomBigIntegerIterator`\
  \ 实现 `Iterator` 接口，可以返回无限大的整数。我们类的构造函数创建一个 `Runnable` 并将其传递给预配置的 `Runnable`。\n\n\
