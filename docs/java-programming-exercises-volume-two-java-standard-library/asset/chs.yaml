  \ ) );\nString newsInJson = news( 24857356 );\nSystem.out.println( newsInJson );\n\
  ```\n\n## Socket 和 ServerSocket\n\n操作系统提供了用于 TCP/UDP 通信的 socket；Java 可以通过以下类使用它们：\n\
  \n*   `java.net.Socket` 和 `java.net.ServerSocket` 用于 TCP，\n*   `java.net.DatagramSocket`\
  \ 用于 UDP。\n\n`Socket` 和 `ServerSocket` 的对象通过构造函数创建，或者更好的是通过工厂 `javax.net.SocketFactory`\
  \ 和 `javax.net.ServerSocketFactory` 创建；对于 UDP 则没有工厂。\n\n### 实现一个脏话服务器和客户端 ★★\n\n\
  Bonny Brain 很快就要参加下一次脏话比赛。她想完美地准备。服务器应该运行一个管理辱性词汇的应用程序，客户端可以连接到这个脏话服务器并搜索句子。\n\n\
  ### 任务：\n\n*   编写一个服务器和客户端。\n*   自定义服务器以接受多个连接；使用线程池。\n*   线程池应使用最大数量的线程以防止拒绝服务（DOS）攻击。如果最大并发连接数耗尽，客户端必须等待直到另一个连接可用。\n\
  \n### 示例：\n\n*   启动服务器和客户端后，交互可能如下：\n\n```\nsir\n你，先生，你是个氧气小偷！\nan\n你，先生，你是个氧气小偷！\n\
  别再装聪明了，你就是个混蛋。\n```\n\n### 实现一个端口扫描器 ★★\n\nBonny Brain 安装了新的 Ay! OS，但缺少重要的分析工具。它需要一个检测并报告被占用的\
  \ TCP/UDP 端口的工具。\n\n### 任务：\n\n*   编写一个程序，尝试在 0 到 49151 的所有 TCP/UDP 端口上注册 `ServerSocket`\
  \ 和 `DatagramSocket`；如果成功，则该端口是空闲的。\n*   在控制台上显示被占用的端口，此外对于已知端口，显示其服务的描述。\n\n###\
  \ 示例：\n\n*   输出可能如下：\n\n```\nProtocol Port    Service\nTCP    135     EMAP\nUPD\
  \    37      NetBIOS Name Service\nUPD    138     NetBIOS Datagram Service\nTCP\
  \    139     NetBIOS Session Service\nTCP    45      Active Directory\nUDP    843\
  \     Flash\nTCP    1900    Simple Discovery Protocol (SSDP)\nUDP    3702    Web\
  \ Services Discovery\nTCP    5040\nUDP    5050\nUDP    533     Multicast DNS\nUDP\
  \    535     Link-Local Name Resolution (LLMNR)\nTCP    5939\nTCP    6463\nTCP \
  \   17500 Dropbox\nUDP    17500 Dropbox\nTCP    17600\nTCP    27017 MongoDB\n```\n\
  \n```\n\n网络接口通过计算机网络连接计算机。在下文中，我们始终假设是 TCP/UDP 接口。网络接口不需要是物理的，也可以通过软件实现。例如环回接口 `127.0.0.1`\
  \ (IPv4) 或 `::1` (IPv6)。典型的网络接口用于 LAN 或 WLAN。操作系统工具可以显示所有接口，例如 Windows 下的 `ipconfig\
  \ /all` 或 Linux 下的 `ip a`。在 Java 中，可以通过 `java.net.NetworkInterface` 获取网络接口。每个网络接口都有自己的\
  \ IP 地址。\n\n![Icon: 垂直放置在表面上的灯泡。](img/Icon_02.jpg) 注册服务器套字有两种可能：要么服务仅接受特定本地 `InetAddress`\
  \ 的请求，要么服务接受所有本地地址的请求。因此，原则上可以在同一个网卡上多次绑定同一个端口，因为一个网卡可以配置多个区分不同的 IP 地址。\n\n任务的解决方案可以进行简单测试并在所有网络接口上注册\
  \ socket；如果失败，则说明某个网络接口上已经运行了服务。这对于我们来说足以判断端口被占用的标准。\n\n## 建议解决方案\n\n### 通过 URL\
  \ 下载远程图像\n\n**com/tutego/exercise/net/ImageDownloader.java**\n\n```\npublic static\
  \ void downloadImage( URL url ) throws IOException {\n  try ( InputStream inputStream\
  \ = url.openStream() ) {\n    String filename = url.toString().replaceAll( \"[^a-zA-Z0-9_.-]\"\
  , \"_\" );\n    Files.copy( inputStream, Paths.get( filename ), StandardCopyOption.REPLACE_EXISTING\
  \ );\n  }\n}\n```\n\n解决方案包含三个步骤。\n\n1.  `URL` 对象通过 `openStream()` 返回资源字节的 `InputStream`。由于你应该关闭你打开的内容，我们将打开流的操作放在\
  \ `try`-with-resources 块中。\n\n\n\n\n2. 目标文件名源自 URL。我们必须对文件名格外小心，因为 URL 中的每个字符并不总是文件名的有效字符。Wikipedia\
  \ 页面 [`en.wikipedia.org/wiki/Filename#Comparison_of_filename_limitations`](https://en.wikipedia.org/wiki/Filename#Comparison_of_filename_limitations)\
  \ 总结了某些文件系统的特殊字符。此外，并不是所有字符都会出现在 URL 中，但即使是简单的路径分隔符 `/` 也会导致问题。因此，我们替换了所有问题字符。解决方案中选择正则表达式\
  \ `[^a-zA-Z0-9_.-]` 将所有不是字母、数字、`_`、`.` 或 `-` 的字符替换为下划线。这为每个文件系统提供了安全文件名。然而，URL 不是唯一的，例如，URL\
  \ [`https://www.penisland.net/?`](https://www.penisland.net/?)`；`;` 和 [`https://www.penisland.net/?`](https://www.penisland.net/?)`，`,`\
  \ 都会变成 `http`___`www.penisland.net`___.\n\n3. 第二步优雅地使用了 `Files` 类的 `copy(…)` 方法。这里有两个方法：一个用于从文件读取并写入\
  \ `OutputStream`，另一个用于从 `InputStream` 读取所有数据并写入文件——这是我们使用的版本。所有字节都从 `InputStream`\
  \ 读取并写入新的目标文件。`copy(…)` 的第三个参数是一个变长参数，表示属性：`StandardCopyOption.REPLACE_EXISTING`\
  \ 表示现有文件将被覆盖，否则在现有文件处会抛出异常。\n\n### 从 URL 读取远程文本文件\n\n**com/tutego/exercise/net/CoronaData.java**\n\
  \n```java\nprivate static final String URL_FORMAT_STRING =\n    \"https://raw.githubusercontent.com/CSSEGISandData/COVID-19/master/\"\
  \n    + \"csse_covid_19_data/csse_covid_19_daily_reports/%s.csv\";\n\npublic static\
  \ String findByDateAndSearchTerm( LocalDate date, String search )\n{\n   DateTimeFormatter\
  \ MMddyyyy = DateTimeFormatter.ofPattern( \"MM-dd-yyyy\" );\n   String url = URL_FORMAT_STRING.formatted(\
  \ date.format( MMddyyyy ) );\n\n   try ( var is = URI.create(url).toURL().openStream();\n\
  \         var isr = new InputStreamReader(is, StandardCharsets.UTF_8);\n       \
  \  var br = new BufferedReader( isr ) ) {\n     return br.lines()\n            \
  \  .filter( line -> line.contains( search ) )\n              . collect( Collectors.joining(\
  \ \"\\n\" ) );\n }\n catch ( MalformedURLException e ) {\n   System.err.println(\
  \ \"Malformed URL format of \" + url );\n }\n catch ( IOException e ) {\n   e.printStackTrace();\n\
  \ }\n return \"\";\n}\n```\n\n第一步是构建 URL。URL 包含了我们作为参数接收的日期。然而，无法直接在 `LocalDate`\
  \ 对象上调用 `toString()` 方法，因为它返回的是根据 ISO 8601 表示法的字符串；系统科学与工程智能中心（Center for Systems\
  \ Science and Engineering）在指定日期段时使用了不同的顺序。因此，程序通过 `DateTimeFormatter` 构建了自身的日期格式，将月份放在第一位，然后是日期和年份。\n\
  \n从这个动态生成的字符串中，构建了一个 `URL` 对象并调用了核心方法 `openStream()`，该方法返回一个 `InputStream`。由于我们需要逐字符读取，因此将此二进制\
  \ `InputStream` 转换为 `Reader`。对于逐行读取，`BufferedReader` 非常适合，特别是 `lines()` 方法非常方便，它返回一个\
  \ `Stream`<`String>`。通过使用过滤器，我们留下了流中包含搜索字符串的行，最后将所有行合并成一个大字符串返回。\n\n可能会发生两种异常：URL\
  \ 可能形成错误，在这种情况下会抛出 `MalformedURLException`，或者在读取过程中出现连接错误。我们捕获了这些异常，在屏幕上打印消息并返回空字符串，因为即使在错误情况下也没有找到任何内容。\n\
  \n### Hacker News 的头条新闻\n\n**com/tutego/exercise/net/HackerNews.java**\n\n```java\n\
  private static final HttpClient client = HttpClient.newHttpClient();\n\npublic static\
  \ long[] hackerNewsTopStories() {\n  String url = \"https://hacker-news.firebaseio.com/v0/topstories.json\"\
  ;\n  HttpRequest request = HttpRequest\n      .newBuilder( URI.create( url ) )\n\
  \      .timeout( Duration.ofSeconds( 5 ) )\n      .build();\n\n try {\n    HttpResponse<InputStream>\
  \ response =\n        client.send(request, BodyHandlers.ofInputStream());\n    var\
  \ scanner = new Scanner(response.body()).useDelimiter(\"\\\\[\\]\");\n    return\
  \ scanner.tokens().mapToLong(Long::parseLong).toArray();\n } catch (IOException\
  \ | InterruptedException e) {\n   e.printStackTrace();\n   return new long[0];\n\
  \ }\n```\n（注：输入中的代码是碎片化的；我根据提供的上下文重构了逻辑并保持了格式。）\n\n\n\n\n```java\npublic class SlangingMatchServer\
  \ {\n\n  private static final int PORT = 10_000;\n\n  public static void main( String[]\
  \ args ) throws IOException {\n  Executor executor = new ThreadPoolExecutor( 0,\
  \ MAXIMUM_POOL_SIZE, 60,\nTimeUnit.SECONDS, new SynchronousQueue<>() );\n    try\
  \ ( ServerSocket serverSocket =\n            ServerSocketFactory.getDefault().createServerSocket(\
  \ PORT ) ) {\n      System.out.println( \"Server running at port \"+serverSocket.\n\
  getLocalPort() );\n\n      while ( ! Thread.currentThread().isInterrupted() ) {\n\
  \        Socket socket = serverSocket.accept();\n        Thread.ofVirtual().start(\
  \ () -> handleConnection( socket ) );\n      }\n    }\n  }\nprivate static void\
  \ handleConnection( Socket socket ) {\n    try ( socket;\n          Scanner requestReader\
  \ =\n              new Scanner( socket.getInputStream(), UTF_8 );\n          PrintWriter\
  \ responseWriter =\n              new PrintWriter( socket.getOutputStream(),\n \
  \                                    true, UTF_8 ) ) {\n      String request = requestReader.nextLine();\n\
  \    responseWriter.println( searchInsult( request ) );\n    }\n    catch ( IOException\
  \ e ) {\n      e.printStackTrace();\n    }\n  }\n\nprivate static String searchInsult(\
  \ String search ) {\n  return Stream.of( \"You, sir, are an oxygen thief!\",\n \
  \                     \"Stop trying to be a smart ass, you’re just an ass.\",\n\
  \                      \"Shock me, say something intelligent.\" )\n            \
  \ .filter( s -> s.toLowerCase().contains( search.toLowerCase()\n) )\n          \
  \   .collect( Collectors.joining( \"\\n\" ) );\n}\n}\n```\n\n`main(…)` 方法在预定义的端口\
  \ 10,000 上准备了一个服务器套接字，进入一个原则上可以通过中断终止的无限循环，并等待传入的连接。线程在 `accept()` 处阻塞，在有客户端接入之前，该区块不会解除阻塞。在这种情况下，一个轻量级的虚拟线程将处理我们的\
  \ `handleConnection(…)` 方法。\n\n如果 `accept()` 返回，其返回是客户端套接字，它将成为 `handleConnection(…)`\
  \ 的参数。我们将 `handleConnection(…)` 的调用移动到 `Runnable` 并将其传递给虚拟线程，从而在后台执行。当线程处理客户端与服务器之间的通信时，无限循环返回\
  \ `accept()` 以为下一个连接提供服务。此时，我们不允许关闭套接字，因此必须是：\n\n```java\ntry (Socket socket=serverSocket.accept())\
  \ {\n  executor.execute(()->handleConnection(socket));\n}\n```\n\n处理过程是异步的！`try`-with-resources\
  \ 中的 `close()` 会在发送 `execute(…)` 之后立即执行，导致 `Socket` 在 `handleConnection(…)` 刚刚开始时就被关闭了。让我们来看\
  \ `handleConnection(…)`：`Socket` 实现了 `AutoClose`，且 `try`-with-resources 会在结束时关闭\
  \ `Socket`。我们这里有一个特殊的情况，即实际上并不需要声明新资源，但从 Java 9 开始允许使用简写符号。在通信中，输入和输出流是必要的。这些也是需要通过\
  \ `try`-with-resources 关闭的资源。从输入中读取一个字符串，搜索侮辱词，并将结果写回。协议要求字符串在网络中传输，因此 `InputStream`\
  \ 和 `OutputStream` 被升级为面向字符的类型。`Scanner` 可以在构造函数中使用 `InputStream` 和编码进行构建，然后通过 `nextLine()`\
  \ 读取一行。我们将输出写入 `PrintWriter`；同样地，构造函数可以接受 `OutputStream` 和编码。第二个参数 `true` 是重要的，因为它控制了在行尾字符出现时刷新缓冲区。`println(…)`\
  \ 将结果写入 `PrintWriter`，行信号指示缓冲区的刷新。`catch` 块结束了 `try`-with-resources，所有资源被关闭，且 `socket`\
  \ 作为原生资源返回给操作系统。实用方法 `searchInsult(…)` 检查搜索词是否包含在给定的字符串中，并用换行符连接所有结果。客户端有类似的逻辑，但它它不需要监听传入的连接，由它来建立连接。\n\
  \ncom/tutego/net/SlangingClient.java\n\n```java\npublic class SlangingMatchClient\
  \ {\n\n  private static final String HOST = \"localhost\";\n  private static final\
  \ int  PORT = 10_000;\n\n  public static void main( String[] args ) throws IOException\
  \ {\n    while ( true ) {\n      String request = new Scanner( System.in ).nextLine();\n\
  \      remoteSearchInsult( request );\n    }\n  }\n\n  private static void remoteSearchInsult(\
  \ String search ) throws IOException\n  {\n    try ( Socket socket=SocketFactory.getDefault().createSocket(\
  \ HOST, PORT );\n          PrintWriter requestWriter =\n              new PrintWriter(\
  \ socket.getOutputStream(), true,\n                              StandardCharsets.UTF_8\
  \ );\n          BufferedReader responseReader = new BufferedReader(\n          \
  \    new InputStreamReader( socket.getInputStream(),\n                         \
  \         StandardCharsets.UTF_8 ) ) ) {\n    requestWriter.println( search );\n\
  \    System.out.println(\n        responseReader.lines().collect( Collectors.joining(\
  \ \"\\n\" ) )\n      );\n    }\n  }\n}\n```\n\n`main(…)` 方法包含一个无限循环，向用户请求一个字符串并将其传递给\
  \ `remoteSearchInsult(String)`。新方法负责与服务器的通信。\n\n在第一步中，套接字工厂为 `localhost` 和目标端口返回一个\
  \ `socket` 对象。套接字是原生资源，在结束时返回给操作系统；关闭操作由 `try`-with-resources 处理。写入字符串再次通过 `PrintWriter`\
  \ 完成。客户端使用 `BufferedReader` 进行读取，因为它无法直接连接到 `InputStream`，因此需要 `InputStreamReader`\
  \ 来启用。\n\n### 实现一个 Scanner\n\n`Scanner` 类访问其 `Protocol` 枚举，包含 `TCP` 和 `UDP` 常量、包可见的方法\
  \ `isAvailable(int)`、抽象方法 `openSocket(int)` 以及静态方法 `serviceName(int)`。\n\ncom/tutego/net/Scanner.java\n\
  \n```java\nenum Protocol {\n  TCP {\n    @Override AutoCloseable openSocket( int\
  \ port ) throws IOException {\n      return ServerSocketFactory.getDefault().createServerSocket(\
  \ port );\n    }\n  },\n  UDP {\n    @Override AutoCloseable openSocket( int port\
  \ ) throws IOException {\n      return new DatagramSocket( port );\n    }\n  }\n\
  }\n\nabstract AutoCloseable openSocket( int port ) throws IOException;\n\nboolean\
  \ isAvailable( int port ) {\n  try ( AutoCloseable __ = openSocket( port ) ) {\n\
  \    return true;\n  } catch ( Exception e ) {\n    return false;\n  }\n}\n\nprivate\
  \ static final Map<Integer, String> SERVICE_NAMES =\n    COMPRESSED_SERVICE_NAMES\n\
  \    .lines()\n    .map(Scanner::new)\n    .collect( Collectors.toMap(Scanner::nextInt,\
  \ Scanner::nextLine) );\n\nstatic String serviceName( int port ) {\n  return SERVICE_NAMES.getOrDefault(\
  \ port, \"\" );\n}\n```\n\n\n\n\n`Protocol` 枚举类型声明了一个抽象方法 `openSocket(int)` 用于打开连接，因为对于\
  \ TCP 和 UDP，代码是不同的；这两个枚举元素分别实现了该抽象方法。在 TCP 的情况下，应用程序通过 `ServerSocketFactory` 构建一个\
  \ `ServerSocket`，或者直接通过 `DatagramSocket` 的构造函数构建一个 `DatagramSocket`。虽然 `ServerSocket`\
  \ 和 `DatagramSocket` 是不同的类型，但它们都实现了 `AutoCloseable` 接口，且 `openSocket(int)` 也返回该类型，因为只有该类型与\
  \ `isAvailable(int)` 有关。\n\n`isAvailable(int)` 的任务是找出端口是否已被占用。为了做到这一点，它调用了 `openSocket(…)`，如果没有异常，则说明端口是空闲，可以立即关闭连接；这正是\
  \ `AutoCloseable` 上的 `try`-with-resources 所处理的。\n\n`serviceName(int)` 访问之前构建的 `Map`。在类内部，有一个常量\
  \ `COMPRESSED_SERVICE_NAMES`，它可以很容易地来自文件。该字符串包含端口号以及用空格分隔的简短描述，描述随后以换行符结束。文本块节省了行尾的换行符。一个\
  \ `Stream` 表达式通过将 `String` 拆分为行来准备 `Map`，这就是 `lines()` 方法用处。`Stream` 然后由行组成，这些行被传递给\
  \ `Scanner` 对象的构造函数，以便 `nextInt()` 返回 `Map` 的键，`nextLine()` 返回与端口号相关的短描述。`serviceName(int)`\
  \ 可以访问此关联存储器 `SERVICE_NAMES`，如果端口号没有关联描述，则返回空字符串。\n\n`main(…)` 方法使用了 `PortScanner`\
  \ 的方法：\n\n**com/tutego/exercise/net/PortScanner.java**\n\n```\nfinal int MIN_SYSTEM_PORT\
  \       = 0;\n//    final int MAX_SYSTEM_PORT       = 1023;\n//    final int MIN_REGISTERED_PORT\
  \ = 1024;\nfinal int MAX_REGISTERED_PORT = 49151;\n\nSystem.out.println(  \"Protocol\
  \    Port            Service\"  );\nfor (  int port = MIN_SYSTEM_PORT; port <= MAX_REGISTERED_PORT;\
  \ port++ ) {\n  for ( Protocol protocol : Protocol.values() )\n    if ( ! protocol.isAvailable(\
  \ port ) )\n      System.out.printf( \"%s            %5d    %s%s%\n\",protocol,\
  \ port, port.serviceName( port ) )\n}\n```\n在这里，我们定义了端口扫描器应该运行的端口范围边界常量。它们代表了端口扫描器应该运行的端口范围边界。在代码示例中，我们成功仅使用两个常量来管理上限和下限，因为在\
  \ `MAX_SYSTEM_PORT` 之后继续使用 `MIN_REGISTERED_PORT`。我们使用 `for` 循环使用从 0 到 49151 的所有注册端口。`Protocol.values()`\
  \ 返回包含两个枚举元素 `TCP` 和 `UDP` 的数组，如果枚举上声明的 `isAvailable(…)` 方法显示端口被阻塞，则会在控制台输出。\n\n\
  # 10 处理 XML、JSON 和其他数据格式\n\nDOI: [10.1201/9781003495550-11](https://doi.org/10.1201/9781003495550-11)\n\
  \n交换文档的重要数据格式是 XML 和 JSON（JavaScript 对象表示）。XML 在历史上是较旧的数据类型，如今我们经常在服务器与 JavaScript\
  \ 应用程序之间的通信中发现 JSON。JSON 文档在配置文件也很流行。\n\n虽然 Java SE 提供了读取和写入 XML 文档的不同类，但 JSON 支持仅在\
  \ Java 企业版或通过补充的开源库可用。因此，本章中的许多任务都求助于外部库。\n\n描述语言构成了文档格式的一个重要类别。它们定义了数据的结构。其中最重要的格式是\
  \ HTML、XML、JSON 和 PDF。\n\nJava 不支持其他数据格式，除了属性文件和处理 ZIP 归档的能力。这对于 CSV（逗号分隔值）文件、PDF\
  \ 或 Office 文档尤其如此。幸运的是，数十个开源库填补了这一空白，所以你不需要自己编写这些功能。\n\n## 前提条件\n\n- 知道如何添加 Maven\
  \ 依赖。\n- 知道 StAX。\n- 能够编写 XML 文档。\n- 能够从 XML 架构文件创建 JAXB (Jakarta Binding) bean。\n\
  - 能够使用 Jakarta Binding 进行对象映射。\n- 对 JSON 库的基础了解。\n- 能够读取 ZIP 归档。\n\n本章使用的的数据类型：\n\
  \n- `javax.xml.stream.OutputFactory`\n- `javax.xml.stream.StreamWriter`\n- `javax.xml.stream.StreamException`\n\
  - `javax.xml.stream.InputFactory`\n- `javax.xml.stream.StreamReader`\n- `jakarta.xml.bind.JAXB`\n\
  \n## 使用 Java 处理 XML\n\n处理 XML 文档有不同的 API。一种方法是在内存中持有完整的对象；另一种方法类似于数据流。StAX 是一种拉取式\
  \ API（pull API），允许从数据流中主动拉取元素并写入。这种处理模型对于不需要在内存中的文档是最佳的。JAXB 提供了一种将 Java 对象转换为 XML\
  \ 文档反之的便捷方法。使用注解或外部文件可以精确控制映射。\n\n### 写入 XML\n\nCaptain Ciao 有许多配方，他需要一个数据库。他有几个系统并想查看是否可以导入。\n\
  \n![展示了 Captain Ciao 一手拿着棒棒糖另一手拿着碗站在壁炉前](img/un10_0.jpg)\n\n他的配方采用 RecipeML 格式，一种松定义的\
  \ XML 格式：[`www.data.com/recipml/`](http://www.data.com/recipml/)。在 [`dsquirrel.tripod.com/recipml/index2.html`](https://dsquirrel.tripod.com/recipml/index2.html)\
  \ 有一个大型数据库。示例：\n\n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<recipml version=\"\
  0.5\">\n<recipe>\n  <head>\n    <title>一分钟草莓酱</title>\n    <categories>\n      <cat>罐装</cat>\n\
  \      <cat>果酱</cat>\n      <cat>果 & jelly</cat>\n    </categories>\n    <yield>8</yield>\n\
  \  </head>\n  <ingredients>\n    <ing>\n      <amt>\n        <qty>3</qty>\n    \
  \    <unit>cups</unit>\n      </amt>\n      <item>草莓</item>\n    </ing>\n    <ing>\n\
  \      <amt>\n        <qty>3</qty>\n        <unit>cups</unit>\n      </amt>\n  \
  \    <item>糖</item>\n    </ing>\n  </ingredients>\n  <directions>\n    <step>将草莓放入锅中。</step>\n\
  \    <step>加入一杯糖。</step>\n    <step>煮沸并煮沸 4 分钟。</step>\n    <step>加入第二杯糖，再次煮沸 4\
  \ 分钟。</step>\n    <step>然后加入第三杯糖，煮沸 3 分钟。</step>\n    <step>移离炉灶，冷却，偶尔搅拌。</step>\n\
  \    <step>倒入罐中并密封。</step>\n  </directions>\n</recipe>\n</recipml>\n```\n\n任务：\n\
  \n- 编写一个输出 RecipeML 格式 XML 文档的程序。\n\n### 检查所有图片是否具有 alt 属性\n\nHTML 文档中的图像应该始终具有\
  \ `alt` 属性。\n\n任务：\n\n- 实现一个 XHTML 器，报告每个 `img` 标签是否设置了 `alt` 属性。\n- 使用 XHTML 文件，例如\
  \ [`tutego.de/download/index.xhtml`](http://tutego.de/download/index.xhtml)。\n\n\
  ### 使用 JAXB 写入 Java 对象\n\nJAXB 通过允许在 Java 对象与 XML 文档之间进行便捷的映射，简化了 XML 文档的访问。\n\n\
  JAXB 包含在 Java 6 的标准版中，并在 Java 11 中被移除。我们需要一个依赖：\n\n\n\n\n```xml\n<dependency>\n\
  \  <groupId>jakarta.xml.bind</groupId>\n  <artifactId>jakarta.xml.bind-api</artifactId>\n\
  \  <version>4.0.2</version>\n</dependency>\n<dependency>\n  <groupId>org.glassfish.jaxb</groupId>\n\
  \  <artifactId>jaxb-runtime</artifactId>\n  <version>4.0.5</version>\n  <scope>runtime</scope>\n\
  </dependency>\n```\n\n## 任务\n\n*   编写 JAXB beans，以便我们生成以下 XML：\n\n    ```xml\n \
  \   <?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"yes\"?>\n    <ingredients>\n\
  \      <ing>\n        <amt>\n          <qty>3</qty>\n          <unit>cups</unit>\n\
  \        </amt>\n        <item>Sugar</item>\n      </ing>\n      <ing>\n       \
  \ <amt>\n          <qty>3</qty>\n          <unit>cups</unit>\n        </amt>\n \
  \     </ing>\n    </ingredients>\n    ```\n\n*   创建类 `Ingredients`、`Ing`、`Amt`。\n\
  *   为类提供相应的实例变量；这些变量可以是 `public` 的。\n*   考虑应该使用哪种注解。\n\n## 读取笑话并开怀大笑 ★★\n\nBonny\
  \ Brain 也会为简单的笑话大笑，她对此百看不厌。她在网上发现了网站 [`https://sv443.net/jokeapi/v2/joke/Any?format=xml`](https://sv443.net/jokeapi/v2/joke/Any?format=xml)，该网站总能给她提供新的笑话。\n\
  \n这种格式是 XML，非常有利于数据传输，但我们是 Java 开发者，我们希望一切都变成对象！通过 JAXB，我们想要读取 XML 文件并转换为 Java 对象，这样我们之后就可以开发自定义输出。\n\
  \n第一步是从 XML 架构（schema）文件自动生成 JAXB beans。笑话页架构如下——别担心，你不需要理解它。\n\n```xml\n<xs:schema\
  \ attributeFormDefault=\"unqualified\" elementFormDefault=\"qualified\"\nxmlns:xs=\"\
  http://www.w3.org/2001/XMLSchema\">\n  <xs:element name=\"data\">\n    <xs:complexType>\n\
  \      <xs:sequence>\n        <xs:element type=\"xs:string\" name=\"category\" />\n\
  \        <xs:element type=\"xs:string\" name=\"type\" />\n        <xs:element name=\"\
  flags\">\n          <xs:complexType>\n            <xs:sequence>\n              <xs:element\
  \ type=\"xs:boolean\" name=\"nsfw\" />\n              <xs:element type=\"xs:boolean\"\
  \ name=\"religious\" />\n              <xs:element type=\"xs:boolean\" name=\"political\"\
  \ />\n              <xs:element type=\"xs:boolean\" name=\"racist\" />\n       \
  \       <xs:element type=\"xs:boolean\" name=\"sexist\" />\n            </xs:sequence>\n\
  \          </xs:complexType>\n        </xs:element>\n        <xs:element type=\"\
  xs:string\" name=\"setup\" />\n        <xs:element type=\"xs:string\" name=\"delivery\"\
  \ />\n        <xs:element type=\"xs:int\" name=\"id\" />\n        <xs:element type=\"\
  xs:string\" name=\"error\" />\n      </xs:sequence>\n    </xs:complexType>\n  </xs:element>\n\
  </xs:schema>\n```\n\n提供者没有提供架构，因此它是从 XML [`https://www.freeformatter.com/xsd-generator.html`](https://www.freeformatter.com/xsd-generator.html)\
  \ 生成的。\n\n## 任务\n\n*   从 [`http://tutego.de/download/jokes.xsd`](http://tutego.de/download/jokes.xsd)\
  \ 加载 XML 架构，并将文件放在 `/src/main/resources/` 下。\n*   在 POM 文件添加以下元素：\n\n```xml\n<build>\n\
  \  <plugins>\n    <plugin>\n      <groupId>org.codehaus.mojo</groupId>\n      <artifactId>jaxb2-maven-plugin</artifactId>\n\
  \      <version>3.1.0</version>\n      <executions>\n        <execution>\n     \
  \     <id>xjc</id>\n          <goals>\n            <goal>xjc</goal>\n          </goals>\n\
  \        </execution>\n      </executions>\n      <configuration>\n        <packageName>com.tutego.exercise.xml.joke</packageName>\n\
  \        <sources>\n          <source>src/main/resources/jokes.xsd</source>\n  \
  \      </sources>\n        <generateEpisode>false</generateEpisode>\n        <outputDirectory>${basedir}/src/main/java</outputDirectory>\n\
  \        <clearOutputDir>false</clearOutputDir>\n        <noGeneratedHeaderComments>true</noGeneratedHeaderComments>\n\
  \        <locale>en</locale>\n      </configuration>\n    </plugin>\n  </plugins>\n\
  </build>\n```\n\n插件部分包含了 `org.codehaus.mojo:jaxb2-maven-plugin` 并对其进行了配置；所有选项可以在\
  \ [`https://www.mojohaus.org/jaxb2-maven-plugin/Documentation/v3.1.0/index.html`](https://www.mojohaus.org/jaxb2-maven-plugin/Documentation/v3.1.0/index.html)\
  \ 中解释。\n\n*   从命令行启动 `mvn generate-sources`。这将在 `com.tutego.exercise.xml.joke` 包中生成两个类：\n\
  \    *   `Data`。\n    *   `ObjectFactory`。\n*   使用 JAXB 从 URL [`https://sv443.net/jokeapi/v2/joke/Any?format=xml`](https://sv443.net/jokeapi/v2/joke/Any?format=xml)\
  \ 获取笑话并转换为对象。\n\n## JSON\n\nJava SE 没有内置对 JSON 的支持，但 Jakarta EE 项目有两个标准提供了这种支持：`Jakarta\
  \ JSON Processing (JSON-P)` ([`jakarta.ee/specifications/jsonp/`](https://jakarta.ee/specifications/jsonp/))\
  \ 和 `Jakarta JSON Binding (JSON-B)` ([`jakarta.ee/specifications/jsonb/`](https://jakarta.ee/specifications/jsonb/))。JSON-B\
  \ 允许 Java 对象与 JSON 之间反向映射，而 JSON-P 提供了处理 JSON 数据的 API。另一个流行的实现是 `Jackson` [`https://github.com/FasterXML/jackson`](https://github.com/FasterXML/jackson)。\n\
  \n为了使用 JSON-B，我们需要在项目中添加 API 和一个实现。参考实现，`Yasson` 是一个不错的选择。\n\n```xml\n<dependency>\n\
  \  <groupId>jakarta.xml.bind</groupId>\n  <artifactId>jakarta.xml.bind-api</artifactId>\n\
  \  <version>4.0.2</version>\n</dependency>\n<dependency>\n  <groupId>org.glassfish.jaxb</groupId>\n\
  \  <artifactId>jaxb-runtime</artifactId>\n  <version>4.0.5</version>\n  <scope>runtime</scope>\n\
  </dependency>\n```\n\n### Hacker News 漏洞\n\n[`https://news.combinator.com/item/2485736`](https://news.combinator.com/item/2485736)\
