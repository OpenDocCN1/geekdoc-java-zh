  \  ByteArrayOutputStream os = new ByteArrayOutputStream();\n  ImageIO.write(screenCapture,\
  \ \"jpeg\", os);\n  return os.toByteArray();\n}\n```\n\n4. 编写一个 Java 程序，每 5 秒截一次屏，持续\
  \ 20 秒，并将图片附加到 Word 文档中。\n\n# 归档\n\n带有元数据的文件被收集在归档中。一种且流行的归档格式是 ZIP，它不仅合并数据还对其进行压缩。许多归档格式还可以加密形式存储文件并存储校验和，以便以后检测传输过程中的错误。\n\
  \nJava 提供了两种压缩可能性：从 Java 7 开始，有一个 ZIP 文件系统提供程序，从 Java 1.0 开始就有了 `ZipFile` 和 `ZipEntry`\
  \ 类。\n\n## 从 ZIP 归档中播放虫鸣 ★★\n\nBonny Brain 喜欢听昆虫的声音，使用了 [`catalog.data.gov/dataset/bug-bytes-sound-library-stored-product-insect-pest-sounds`](https://catalog.data.gov/dataset/bug-bytes-sound-library-stored-product-insect-pest-sounds)\
  \ 的 WAV 集合，那里以 ZIP 格式提供了多种音频文件下载。\n\n![展览展示了 Bonny Brain 坐在桌旁，闭着眼睛，手托下巴听着喇叭发出的音乐。](img/un10_02.jpg)\n\
  \n**任务：**\n\n- 学习 [`christian-schlichtherle.bitbucket.io/truezip/truezip-path/`](https://christian-schlichtherle.bitbucket.io/truezip/truezip-path/)\
  \ 中的文档。\n- 在 Maven POM 中包含两个依赖项：\n\n```xml\n<dependency>\n  <groupId>en.schlichtherle.truezip</groupId>\n\
  \  <artifactId>truezip-path</artifactId>\n  <version>7.7.10</version>\n</dependency>\n\
  <dependency>\n  <groupId>en.schlichtherle.truezip</groupId>\n  <artifactId>truezip-driver-zip</artifactId>\n\
  \  <version>7.7.10</version>\n</dependency>\n```\n\n- 下载包含虫鸣声的 ZIP，但不要解压。\n- 为 ZIP\
  \ 创建一个 `Path` 对象。\n- 从 ZIP 中传输所有文件名：`Files.newDirectoryStream(...)`。\n- 编写一个无限循环并选择一个随机文件。\n\
  - 使用 `Files.newInputStream(...)` 打开文件，用 `BufferedInputStream` 进行装饰并打开 `AudioSystem.getInputStream(...)`。运行以下代码，其中\
  \ `ais` 为：\n\n```java\nClip clip = AudioSystem.getClip();\nclip.open(ais);\nclip.start();\n\
  TimeUnit.SECONDS.sleep(5);\nclip.close();\n```\n\n## 建议解决方案\n\n### 写入 XML 文件\n\n\
  建议的解决方案从 `RecipeDemo.java` 中的两个记录开始：\n\n```java\nrecord Recipe(\n  String title,\n\
  \  List<String> categories,\n  String yield,\n  List<Ingredient> ingredients\n)\
  \ {}\n\nrecord Ingredient(\n  String qty,\n  String unit\n) {}\n```\n\n`Recipe`\
  \ 由类型 `Recipe` 和 `Ingredient` 表示。`Ingredient` 是一个嵌套类型。原则上可以为每个元素声明一个独立的记录或类，但那样太麻烦了。因此变量名表示了层次结构。在我们开始编写程序之前，有一个观察：写入许多元素，涉及到以下类型：\n\
  \n```java\nwriter.element();\n```\n\n对于这类问题，执行模式（execute-around pattern）非常有用。思想实验：\n\
  \n```java\nelement(\"my-tag\", () {});\n```\n\n我们可以传递标签、表示内容的块，并在最后写入结束标签。由于 Java\
  \ 库没有提供此类功能，解决方案引入了一个辅助类 `HierarchicalXmlWriter`，它是 `XMLStreamWriter` 的门面：\n\n**com/tutego/xml/RecipeMLDemo.java**\n\
  \n```java\nclass HierarchicalXmlWriter implements AutoCloseable {\n\n  private final\
  \ OutputStream outputStream;\n\n  interface XMLStreamBlock {\n    void write() throws\
  \ XMLStreamException;\n  }\n\n  private final XMLStreamWriter writer;\n\n  HierarchicalXmlWriter(OutputStream\
  \ outputStream) throws XMLStreamException {\n    this.outputStream = outputStream;\n\
  \    XMLOutputFactory outputFactory = XMLOutputFactory.newFactory();\n    this.writer\
  \ = outputFactory.createXMLStreamWriter(outputStream, StandardCharsets.UTF_8.name());\n\
  \    writer.writeStartDocument(\"utf-8\", \"1.0\");\n  }\n\n  @Override\n  public\
  \ void close() throws XMLStreamException, IOException {\n    try {\n      writer.writeEndDocument();\n\
  \      writer.close();\n    } finally {\n      outputStream.close();\n    }\n  }\n\
  \n  void element(String tag, XMLStreamBlock block) throws XMLStreamException {\n\
  \    writer.writeStartElement(tag);\n    block.write();\n    writer.writeEndElement();\n\
  \  }\n\n  void string(String tag, String text) throws XMLStreamException {\n   \
  \ element(tag, () -> writer.writeCharacters(text));\n  }\n}\n```\n\n\n\n\n\n构造函数接收用于写入\
  \ XML 文档的输出流。传递的 `OutputStream` 被存储在实例变量中，以便后续作为资源关闭。此外，通过 `XMLOutputFactory` 请求并保存了\
  \ `XMLStreamWriter`，以便在 `close()` 中也能关闭 `XMLStreamWriter`。最后，构造函数写入 XML 序言。\n\n\
  `XMLStreamWriterBlock` 实现了 `AutoCloseable` 接口，可以在 `try`-with-resources 中作为资源使用。`close()`\
  \ 方法设置 XML 文档的结束标签，关闭 `XMLStreamWriter` 和 `OutputStream`。注意：`XMLStreamWriter` 不会独立地向底层资源传递\
  \ `close()` 调用，这在输入/输出装饰器中通常是常见的。如果在调用两个 `XMLStreamWriter` 方法时发生异常，也应该关闭 `OutputStream`。\n\
  \n第一个辅助方法 `element(String tag, XMLStreamWriterBlock block)` 设置起始标签，执行该块并写入结束标签。第二个辅助方法\
  \ `string(String tag, String string)` 写入起始标签、内部文本和结束标签。\n\n主类 `RecipeMLwriterDemo`\
  \ 可以访问 `HierarchicalXmlWriter` 并现在可以根据需要构建 XML 块：\n\n**com/tutego/exercise/xml/RecipeMLwriterDemo.java**\n\
  \n```java\nvar ingredient1 = new Recipe.Ingredient(\"30\", \"cups\", \"fat\");\n\
  var ingredient2 = new Recipe.Ingredient(\"1\", \"kg\", \"sugar\");\nvar recipe =\
  \ new Recipe(\"Fat Jam\", List.of(\"Canning\", \"Preserves\"), \"8\",\n        \
  \                 List.of(ingredient1, ingredient2),\n                         List.of(\"\
  Start\", \"End\"));\ntry (var write = new HierarchicalXmlWriter(System.out)) {\n\
  \  write.element(\"recipe\", () -> {\n    write.element(\"head\", () -> {\n    \
  \  write.string(\"title\", recipe.head$title());\n      write.element(\"categories\"\
  , () -> {\n        for (String cat : recipe.head$categories())\n          write.string(\"\
  cat\", cat);\n      } });\n      write.string(\"yield\", recipe.head$yield());\n\
  \    } );\n    write.element(\"ingredients\", () -> {\n      for (Recipe.Ingredient\
  \ ingredient : recipe.ingredients()) {\n        write.element(\"ing\", () -> {\n\
  \          write.element(\"ing\", () -> {\n            write.string(\"qty\", ingredient.ing$amt$qty());\n\
  \            write.string(\"unit\", ingredient.ing$amt$unit());\n          } });\n\
  \          write.string(\"item\", ingredient.ing$item());\n        } });\n     \
  \ }\n    } );\n    write.element(\"directions\", () -> {\n      for (String step\
  \ : recipe.directions())\n        write.string(\"step\", step);\n    } });\n  }\n\
  } catch (XMLStreamException | IOException e) {\n  e.printStackTrace();\n}\n```\n\
  \n对 RecipeML 的 schema 感兴趣可以参考：[`github.com/tranchis/xsdthrift/blob/master/recipml.xsd`](https://github.com/tranchis/xsdthrift/blob/master/recipml.xsd)。然而，该格式已经没有更新了。\n\
  \n### 检查所有图片是否具有 Alt \n\n**com/tutego/exercise/xml/XhtmlImgTagWithAltAttribute.java**\n\
  \n```java\nstatic void reportMissingAlt(Path path) {\n  try (InputStream is = Files.newInputStream(path))\
  \ {\n    XMLInputFactory xmlInputFactory = XMLInputFactory.newInstance();\n    xmlInputFactory.setProperty(XMLConstants.ACCESS_EXTERNAL_DTD,\
  \ \"\");\n    xmlInputFactory.setProperty(XMLConstants.ACCESS_EXTERNAL_SCHEMA, \"\
  \");\n    XMLStreamReader parser = xmlInputFactory.createStreamReader(is);\n   \
  \ while (parser.hasNext()) {\n      parser.next();\n      boolean isStartElement\
  \ = parser.getEventType() == XMLConstants.START_ELEMENT;\n      if (isStartElement)\
  \ {\n        boolean isImgTag = \"img\".equalsIgnoreCase(parser.getLocalName());\n\
  \        if (isImgTag && !containsAltAttribute(parser))\n          System.err.printf(\"\
  img does not contain alt attribute:%s%n\",\n              parser.getLocation());\n\
  \      }\n    }\n  } catch (IOException | XMLStreamException e) {\n    throw new\
  \ RuntimeException(e);\n  }\n}\n\nprivate static boolean containsAltAttribute(XMLStreamReader\
  \ parser) {\n  return IntStream.range(0, parser.getAttributeCount())\n    .mapToObj(parser::getAttributeLocalName)\n\
  \    .anyMatch(\"alt\"::equalsIgnoreCase);\n}\n```\n\n传递给 `createXMLStreamReader(...)`\
  \ 方法的 `Path` 对象是 `InputStream` 的基础，将其传递给 `createXMLStreamReader(...)` 以获取带有该输入流的\
  \ `XMLStreamReader`。遗憾的是，目前（截至 Java 21），`XMLStreamReader` 并不是 `AutoCloseable`，因此不能在\
  \ `try`-with-resources 中关闭。不过，在读取时并不严重；我们通过 `try`-with-resources 很好地关闭了文件的 `InputStream`。\n\
  \n通过 `XMLStreamReader` 传递数据始终是一样的：`hasNext()` 告诉数据流中是否还有标记，如果是则通过 `next()` 获取下一个标记。这类似于\
  \ `Scanner` 和 `Iterator`。调用 `next()` 会改变 `XMLStreamReader` 元素的状态，而 `getEventType()`\
  \ 返回一个整数来标识传入的数据。例如，文档的开始、处理指令、注释。\n\n\n\n\n\n`com/tutego/exercise/xml/JaxbJokeReceiver.java`\n\
  \n```java\ntry {\n  URL url = URI.create( \"https://sv443.net/jokeapi/v2/joke/Any?format=xml\"\
  \n).toURL();\n  Data data = JAXB.unmarshal( url, Data.class );\n  System.out.println(\
  \ data.getSetup() );\n  System.out.println( data.getDelivery() );\n  System.out.printf(\
  \ \"Not Safe for Work? %s%n\", data.getFlags().isNsfw() );\n  System.out.printf(\
  \ \"Religious? %s%n\", data.getFlags().isReligious() );\n  System.out.printf( \"\
  Political? %s%n\", data.getFlags().isPolitical() );\n  System.out.printf( \"Racist?\
  \ %s%n\", data.getFlags().isRacist() );\n  System.out.printf( \"Sexist? %s%n\",\
  \ data.getFlags().isSexist() );\n}\ncatch ( MalformedURLException e ) {\n  System.err.println(\
  \ \"malformed URL has occurred\" );\n  e.printStackTrace();\n}\ncatch ( DataBindingException\
  \ e ) {\n  System.err.println( \"failure in a JAXB operation\" );\n  e.printStackTrace();\n\
  }\n```\n\n`JAXB.unmarshal(…)` 允许从各种数据源（包括 `URL`）的 XML 流构建 Java 对象。因此，如果我们构建一个 `URL`\
  \ 对象并将其放在笑话的端点，`unmarshal(…)` 会直接返回一个 `Data` 对象。随后 `Data` 对象提供不同的 getter 方法，并可以读取数据。可能会发生两种异常：URL\
  \ 格式无效，导致我们获得 `MalformedURLException`；或者 XML 格式无法映射到 JavaBean，在这种情况下，结果为 `DataBindingException`。\n\
  \n### Hacker News JSON 漏洞\n\n你可以使用 `Jsonb` 对象和 `fromJson(…)` 方法将 JSON 文档读取到包含嵌套键值对的\
  \ `Map` 中。以下是两个建议的解决方案：\n\n`com/tutego/exercise/json/HackerNewsJson.java`\n\n```java\n\
  @SuppressWarnings( \"unchecked\" )\npublic static Map<Object, Object> news( long\
  \ id ) {\n  String url = \"https://hacker-news.firebaseio.com/v0/item/%d.json\"\
  ;\n\n  try ( var in = URI.create(url.formatted(id) .toURL()).openStream();\n   \
  \     Jsonb jsonb = JsonbBuilder.create() ) {\n    return jsonb.fromJson( in, Map.class\
  \ );\n  }\n  catch ( Exception e ) {\n    return Collections.emptyMap();\n  }\n\
  }\n```\n\n在此解决方案中，`fromJson(…)` 方法将打开的网络连接的 `InputStream` 作为第一个参数，并将目标类型（即 `Map`）作为第二个参数。`Jsonb`\
  \ 对象实现了 `AutoCloseable`，可以与 `try`-with-resources 块一起使用。程序捕获异常，并在抛出异常时返回一个空 `Map`。由于\
  \ `Class` 对象只能表示原始类型 `Map` 而不能表示泛型，因此隐式类型转换 `Map<String, String>` 是可能的，但编译器会发出警告；使用\
  \ `@SuppressWarnings(\"unchecked\")` 可以停止编译器警告。\n\n下一个解决方案使用了 `HttpClient` API，在配置身份验证器、线程池、代理、SSL\
  \ 上文等方面，它比 `URL` 类的方法更强大。\n\n`com/tutego/exercise/json/HackerNewsJson.java`\n\n\
  ```java\n@SuppressWarnings( \"unchecked\" )\npublic static Map<Object, Object> news(\
  \ long id ) {\n  HttpClient client = HttpClient.newHttpClient();\n\n  String url\
  \ = \"https://hacker-news.firebaseio.com/v0/item/%d.json\";\n  HttpRequest request\
  \ = HttpRequest\n      .newBuilder( URI.create( url.formatted( id ) ) )\n      .timeout(\
  \ Duration.ofSeconds( 5 ) )\n      .build();\n\n  try ( InputStream body = client.send(\
  \ request, BodyHandlers.ofInputStream()).body();\n        Jsonb jsonb = JsonbBuilder.create()\
  \ ) {\n    return jsonb.fromJson( body, Map.class );\n  }\n\n  catch ( Exception\
  \ e ) {\n    return Collections.emptyMap();\n  }\n}\n```\n\n程序在没有额外配置的情况下创建 `Jsonb`\
  \ 对象，并回退到 `HttpClient.newHttpClient()` 的默认配置。`HttpRequest` 设置为 `URL`，然后设置了超时时间。结果应该是\
  \ `fromJson(…)` 可以接受的格式；例如，`InputStream` 或 `String` 都是合适的。`InputStream` 的优势在于它需要的内存最少。\n\
  \n### 作为 JSON 的读写编辑器\n\nJSON 层级结构自动根据 `Settings` 引用 `Editor` 和 `Workbench` 的事实导出。\n\
  \n`com/tutego/exercise/json/Settings.java`\n\n```java\nimport java.util.*;\n\nclass\
  \ Settings {\n\n  enum FontWeight {\n    normal, bold\n  }\n\n  static class Editor\
  \ {\n    String cursorStyle = \"line\";\n    boolean folding = true;\n    List<String>\
  \ fontFamily = Arrays.asList(\"Consolas\", \"Courier New\", \"monospace\");\n  \
  \  int fontSize = 14;\n    FontWeight fontWeight = FontWeight.normal;\n  }\n\n \
  \ static class Workbench {\n    String colorTheme = \"Default Dark\";\n    String\
  \ iconTheme;\n  }\n\n  Editor editor = new Editor();\n  Workbench workbench = new\
  \ Workbench();\n  Map<String, String> terminal = new HashMap<>();\n}\n```\n\nJSON\
  \ 层级结构自动根据 `Settings` 引用 `Editor` 和 `Workbench` 的事实导出。\n\n`com/tutego/exercise/json/Settings.java`\n\
  \n```java\nimport java.util.*;\n\nclass Settings {\n\n  enum FontWeight {\n    normal,\
  \ bold\n  }\n\n  static class Editor {\n    String cursorStyle = \"line\";\n   \
  \ boolean folding = true;\n    List<String> fontFamily = Arrays.asList(\"Consolas\"\
  , \"Courier New\", \"monospace\");\n    int fontSize = 14;\n    FontWeight fontWeight\
  \ = FontWeight.normal;\n  }\n\n  static class Workbench {\n    String colorTheme\
  \ = \"Default Dark\";\n    String iconTheme;\n  }\n\n  Editor editor = new Editor();\n\
  \  Workbench workbench = new Workbench();\n  Map<String, String> terminal = new\
  \ HashMap<>();\n}\n```\n\nJSON 层级结构自动根据 `Settings` 引用 `Editor` 和 `Workbench` 的事实导出。\n\
  \n`com/tutego/exercise/json/Settings.java`\n\n```java\nimport java.util.*;\n\nclass\
  \ Settings {\n\n  enum FontWeight {\n    normal, bold\n  }\n\n  static class Editor\
  \ {\n    String cursorStyle = \"line\";\n    boolean folding = true;\n    List<String>\
  \ fontFamily = Arrays.asList(\"Consolas\", \"Courier New\", \"monospace\");\n  \
  \  int fontSize = 14;\n    FontWeight fontWeight = FontWeight.normal;\n  }\n\n \
  \ static class Workbench {\n    String colorTheme = \"Default Dark\";\n    String\
