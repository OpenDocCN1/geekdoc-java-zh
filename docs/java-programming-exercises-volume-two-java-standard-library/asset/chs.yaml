  \ UML 图。\n\n## 本章使用的类型：\n\n*   `java.util.Collection`\n*   `java.util.Collections`\n\
  *   `java.util.Iterable`\n*   `java.util.List`\n*   `java.util.ArrayList`\n*   `java.util.LinkedList`\n\
  *   `java.util.ListIterator`\n*   `java.util.Set`\n*   `java.util.HasSet`\n*   `java.util.TreeSet`\n\
  *   `java.util.LinkedHashSet`\n*   `java.util.SortedSet`\n*   `java.util.Map`\n\
  *   `java.util.HashMap`\n*   `java.util.TreeMap`\n*   `java.util.SortedMap`\n* \
  \  `java.util.WeakHashMap`\n*   `java.util.Properties`\n*   `java.util.Queue`\n\
  *   `java.util.Deque`\n*   `java.util.BitSet`\n*   `java.util.concurrent.SynchronousQueue`\n\
  *   `java.util.concurrent.ForkJoinPool`\n\n## 先决条件\n\n*   能够区分数据结构、集合和关联内存。\n* \
  \  了解类型 `List`、`ArrayList` 和 `LinkedList`。\n*   了解 `Set`、`HashSet` 和 `TreeSet`。\n\
  *   了解 `Map`、`HashMap` 和 `TreeMap`。\n*   了解队列和双端队列。\n*   了解如何使用 `Comparator` 创建排序。\n\
  *   了解如何使用和实现迭代器。\n*   能够以线程安全的方式使用数据结构。\n*   可选：对用于进一步开发的开源库 Guava 感兴趣。\n\n\n\n\
  某些操作不是与数据类型相关，而是外包到了类 `Collections`。数组也是如此，那里还有一个工具类 `Arrays`。\n\n我们想要为类和接口 `java.util.Set`、`java.util.List`、`java.util.Map`、`java.util.HashSet`、`java.util.TreeSet`、`java.util.Hashtable`\
  \ 和 `java.util.TreeMap` 构建决策树。选择时必须考虑以下因素：\n\n*   通过键访问。\n*   允许重复。\n*   快速访问。\n\
  *   排序迭代。\n*   线程安全。\n\n如果访问是从键到值，这通常是一个关联映射，即 `Map` 的实现。`Map` 的实现类有 `HashMap`、`TreeMap`\
  \ 以及过时的类 `Hashtable`。然而，列表（lists）也是特殊的存储结构，其索引是整数且升序的。任意整数的关联在列表中是不行的。列表允许重复，但集合不允许。确实有要求集合记录元素出现的频率，但这必须通过关联内存来实现，将元素与计数器关联。所有数据结构都允许快速访问。唯一的问题是问什么。列表无法快速回答某个元素是否存在，因为必须从头到尾遍历列表才能做到。使用关联存储或集合，由于数据的内部组织结构，这种查询要快得多。列表可以排序，且遍历会按排序顺序返回元素。`TreeSet`\
  \ 和 `TreeMap` 也根据标准进行排序。具有哈希表的数据结构没有用户定义的顺序。\n\n数据结构可以分为三组：Java 1.0 之后的数据结构、Java\
  \ 1.2 之后的数据结构以及 Java 5 之后的数据结构。在第一个 Java 版本中，引入了 `Vector`、`Hashtable`、`Dictionary`\
  \ 和 `Stack`。这些数据结构都是都是线程安全的，但它们现在已不再被广泛使用。在 Java 1.2 中，引入了 `Collection` API；并不是所有数据结构都是安全的。在\
  \ Java 5 中，引入了新包 `java.util.concurrent`；其中的所有数据结构对于更改都是安全的。\n\n### 测验：搜索 StringBuilder\n\
  \n如果以下程序位于一个类的 `main()` 方法中，输出是什么？\n\n```\nCollection<String> islands1 = new ArrayList<>();\n\
