  139822 km\n6780 km\n2400 km\n49248 km\n…\n```\n\n### 集合 (Sets)\n\n集合只包含一次元素。它们可以是无序的，也可以是有序的。Java\
  \ 提供了 `Set` 接口进行抽象；两个重要的实现是 `HashSet` 和 `TreeSet`。\n\n集合引发了一系列问题：\n\n1. 集合为空吗？\n\
  2. 集合中有哪些元素？\n3. 请求的元素是否在集合中，是或否？\n4. 给定两个集合，它们是否包含相同的元素？\n5. 两个集合合并后的新集合是什么样的？\n\
  6. 一个集合是否完全包含另一个集合，即一个集合是否是另一个的子集？\n7. 两个集合的交集是什么，即同时集合中的元素？\n8. 差集是什么？即从一个集合中删除另一个集合中存在的元素？\n\
  \n这些操作中的一些可以直接使用 `Set` 数据类型回答。例如，有 `isEmpty()` 或 `contains(...)` 方法。特别是集合操作的支持并不完善，程序员必须为它们采取变通方法。例如，子集有一个\
  \ `Collections` 方法 `disjoint(Collection<?>, Collection<?>)`，但它返回一个 `boolean`，表示两个集合是否没有共同元素。让我们通过任务来回答一些问题。\n\
