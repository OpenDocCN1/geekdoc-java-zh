  \n## 建议解决方案\n\n### 获取不同位置的数量（读取文件）\n\n**com/tutego/exercise/io/HammingDistance.java**\n\
  \n```\npublic static long distance(Path file1, Path file2) throws IOException {\n\
  \  long files1 = Files.size(file1);\n  long files2 = Files.size(file2);\n\n  if\
  \ (files1 != files2)\n    throw new IllegalStateException(\n      \"File size is\
  \ not equal, but %d for %s and %d for %s\".formatted(\n        files1, file1, files2,\
  \ file2));\n\n  long result = 0;\n\n  try (Reader input1 = Files.newBufferedReader(file1);\n\
  \      Reader input2 = Files.newBufferedReader(file2)) {\n    for (int i = 0; i\
  \ < files1; i++)\n      if (input1.read() != input2.read())\n        result++;\n\
  \  }\n  return result;\n}\n```\n\n一个要求是大小相等。因此，程序首先获取文件大小并进行比较，如果不匹配，则抛出 `IllegalStateException`。错误信息非常精确，传达了哪个文件的大小是多少。\n\
  \n假设上一步完成，我们将为相应的文件构建资源。我们调用 `Files` 方法 `newBufferedReader(...)` 获取 `Reader`。使用该方法有两个：首先，我们想要处理字符串而不是二进制流，因此使用\
  \ `Reader` 而不是 `InputStream`。其次，缓冲对性能至关重要，`newBufferedReader` 返回一个带有缓冲的 `Reader`。字符是从缓冲区读取的，否则每次都访问文件会导致缓慢。\n\
  \n由于我们已经知道了字符数量，循环运行并从两个流各请求一个符号。如果符号不匹配，我们就增加计数器，最后返回结果。`try`-with-resources 即使发生错误也会关闭两个流。该方法不处理异常而是将其传递给调用者。在请求文件大小、打开文件和读取字符时可能会出错。\n\
  \n### Python 程序转 Java（写入文件）\n\n**com/tutego/exercise/io/XorFractal.java**\n\n```\n\
  final String filename = \"xorpic.html\";\ntry {\n  try (Writer out = Files.newBufferedWriter(Paths.get(filename));\n\
  \      PrintWriter printer = new PrintWriter(out)) {\n\n    printer.println(\"<!DOCTYPE\
  \ html>\");\n    printer.println(\"<html><body><svg width=\\\"256\\\" height=\\\"\
  256\\\">\");\n\n    for (int x = 0; x < 256; x++)\n      for (int y = 0; y < 256;\
  \ y++)\n        printer.printf(\n          \"<rect x=\\\"%d\\\" y=\\\"%d\\\" width=\\\
  \"1\\\" \" +\n          \"height=\\\"1\\\" style=\\\"fill:rgb(0,%d,0);\\\" />\"\
  ,\n          x, y, x ^ y);\n\n    printer.println(\"</svg></body></html>\");\n \
  \ }\n  Desktop.getDesktop().open(new File(filename));\n} catch (IOException e) {\n\
  \  e.printStackTrace();\n}\n}\n```\n\nJava 和 Python 语言完全不同，库文件也各不相同。因此，代码之间几乎没有共同点，几乎一切都不同。\n\
  \n\n\n\n\nJava 中有多种方法写入文件。常用的类有：`FileOutputStream`、`FileWriter`、`PrintWriter` 和\
  \ `Formatter`。省略了基于 `OutputStream` 的类型，因为我们更倾向于写入 Unicode 字符而不是字节。由于格式化字符串非常有用，因此弃用了\
  \ `FileWriter`，而 `Formatter` 则被排除在外，因为它只能写入带格式的字符串，而无法写入不带格式的纯字符串。\n\n由于输入/输出始终可能出现问题，Java\
  \ 方法会抛出我们必须处理的异常。这就是第一个 `try` 块的作用。它捕获了每一个 `IOException`。\n\n文件是需要关闭的资源；因此，资源的创建也被放在了\
  \ `try`-with-resources 语句块中。这个特定的块没有 `catch` 分支，因为它使用 `try`-with-resources 只是为了在结束时再次关闭资源——任何错误处理都由外层的\
  \ `try`-catch` 块处理。\n\n首先，我们构建一个 `BufferedWriter`，然后用 `PrintWriter` 对其进行装饰，这样我们就有了写入格式化字符串的方法。\n\
  \n下一步是写入 HTML 文件的前导言。在两个嵌套循环中，`printf(…)` 将 SVG 矩形写入数据流。Python 中的三个值是 RGB 的颜色值，其中红色和蓝色部分为\
  \ `0`，所以它们未被使用。程序只写入绿色部分，即坐标 `x` 和 `y` 的异或。`x` 和 `y` 的值范围在 `0` 到 `255` 之间，这恰好也是\
  \ 8 位 RGB 颜色值的最大值。\n\n通过两个循环后，`try`-with-resources 块关闭打开的流。两个 `try` 块初看起来嵌套得如此奇怪，是因为在成功写入之后，需要用浏览器打开文件。然而，我们必须考虑两个特殊情况：`try`-with-resources\
  \ 必须在我们允许重新打开文件之前先写入并关闭文件。而且，只有在写入没有错误的情况下我们才允许打开文件。如果在写入过程中发生错误，则不能打开文件。这种逻辑转换了这两个嵌套的写入块。\n\
  \n### 生成目标代码（写文件）\n\n`com/tutego/exercise/io/Zielcode.java`\n\n```java\nprivate\
  \ static final String[] ZELCODE = {\n    \"||||\",    // 0000 = 0\n    \"||| \"\
  ,      // 0001 = 1\n    \"|| |\",      // 0010 = 2\n    \"||  \",      // 0011 =\
  \ 3\n    \"| ||\",      // 0100 = 4\n    \"| | \",      // 0101 = 5\n    \"|  |\"\
  ,      // 0110 = 6\n    \" | |\",      // not 0111 = 7 but 1010 = 10\n    \" |||\"\
  ,      // 1000 = 8\n    \" || \"  };   // 1001 = 9\n\npublic static void writeZielcode(\
  \ String string, Writer writer )\n    throws IOException {\n  for ( int i = 0; i\
  \ < string.length(); i++ ) {\n    int value = Character.getNumericValue( string.charAt(\
  \ i ) );\n    if ( value >= 0 && value <= 9 ) {\n        writer.write( ZIELCODE[\
  \ value ] );\n        if ( i != string.length() - 1 )\n          writer.write( \"\
  \  \" );\n    }\n  }\n}\n```\n\n为了解决这个任务，我们需要逐个字符地遍历 `String` 并字符映射到符号。有不同的方法。例如，我们可以将数字与\
  \ `switch`-case 比较比较，然后将相应的字符串写入 `writer`。另一种解决方案是提供一个映射（map），我们可以预先通过带有目标代码的字符组合来构建它。这里提出的解决方案使用了一个数组，其中的每个条目恰好对应于该位置的目标代码。`switch-case`\
  \ 可以直接在 `char` 上进行分类区分，但对于数组索引，我们需要数值；这里 `Character.getNumericValue(…)` 很有帮助。这种方法的巨大优点是它适用于所有语言中的所有数字。有效的结果位于\
  \ `0` 到 `9` 之间；通过这个数字，你可以访问数组并将值写入 `writer`。如果还没有到达输入中的最后一位数字，则写入两个空格作为分隔符。\n\n\
  代码列表包含了数组的注释，很好地显示了横线和空格原则上仅仅是数字的二进制表示。一个异常是数字 `7`，它没有表示为可预测的位模式 `011`，而是表示为 `110`，即\
  \ `_ |`；然而，`10` 将是数字 `10` 的位模式。如果 `| _` 也代表 `7`，将涉及过多空间，可能会让读者反感——再次，下划线是空间的符号。\n\
  \n如果我们将数字解释为位模式，就可以编写一个稍微不同且不需要数组的解决方案：`com/tutego/exercise/io/Zielcode.java`\n\n\
  ```java\nString string = \"0123456789\";\nfor (int i = 0; i < string.length(); i++)\
  \ {\n  BigInteger v = new BigInteger(\n    string.charAt(i) == '7' ? \"10\"\n  \
  \    : string.substring(i, i + 1) );\n  System.out.print( v.testBit(3) ? ' ' : '|'\
  \ );\n  System.out.print( v.testBit(2) ? ' ' : '|' );\n  System.out.print( v.testBit(1)\
  \ ? ' ' : '|' );\n  System.out.print( v.testBit(0) ? ' ' : '|' );\n  System.out.print(\
  \ \");\n}\n```\n\n按照通常，我们遍历字符串，最初检查每个位置是否存在 `7`。如果找到，将其替换为字符串 `\"10\"`。如果数字不是七，我们使用\
  \ `substring(…)` 提取长度为 1 的字符串。两种情况下的结果都是字符串。该字符串被传递给 `BigInteger` 构造函数进行初始化。`BigInteger`\
  \ 有非常有用的方法 `testBit(…)`，它可以回答某个位是否设置了。为了完成任务，我们只需要获取位 3、2、1 和 0 的值，并根据这些值设置空格或竖线。\n\
  \n### 将文件内容转为小写（读文件和写文件）\n\n`com/tutego/exercise/io/ConvertFileToLowercase.java`\n\
  \n```java\nprivate static final int EOF = -1;\n\nstatic void convertFileToLowercase(\
  \ String source, String target )\n    throws IOException {\n  convertFileToLowercase(Paths.get(source),\
  \ Paths.get(target));\n}\n\nstatic void convertFileToLowercase( Path source, Path\
  \ target )\n    throws IOException {\n  try (BufferedReader reader = Files.newBufferedReader(source);\n\
  \       BufferedWriter writer = Files.newBufferedWriter(target)) {\n    for (int\
  \ c; (c = reader.read()) != EOF; )\n      writer.write(Character.toLowerCase((char)c));\n\
  \  }\n}\n```\n\n\n\n\n\n`for` 循环声明了一个变量 `c` 用于存储待读取的字符。在 `for` 循环的条件表达式中，程序首先读取字符并将结果赋值给变量\
  \ `c`；在下一步中，它将其与 `EOF` 进行比较。只要能够读取到字符，循环就会运行。在循环体中，字符被转换为大写字母并写入 `Writer` 中。\n\n\
  ## 将 PPM 图形转换为 ASCII 灰度\n\n`com/tutego/exercise/io/PPM.java`\n\n```java\nclass PPM\
  \ {\n\n  public interface RgbToGray {\n    RgbToGray DEFAULT = (r, g, b) -> (r +\
  \ g + b) / 3;\n    int toGray( int r, int g, int b );\n  }\n\n  public enum GrayToAscii\
  \ implements IntUnaryOperator {\n    DEFAULT;\n\n    // black = 0, white = 255\n\
  \    private static final char[] ASCII_FOR_SHADE_OF_GRAY =\n        \"@MBENRWDFQASUbehGmLOYkqgnsozCuJcry1v7lit{}?j|()=~!-/<>\\\
  \"^_';,:`. \"\n        .toCharArray();\n    private static final int CHARS_PER_RGB\
  \ =\n        256 / ASCII_FOR_SHADE_OF_GRAY.length;\n    @Override public int applyAsInt(\
  \ int gray ) {\n      return ASCII_FOR_SHADE_OF_GRAY[ gray / CHARS_PER_RGB ];\n\
  \    }\n  }\n\n  private static final String MAGIC_NUMBER = \"P3\";\n\n  private\
  \ PPM() { }\n\n  private static String nextStringOrThrow( Scanner scanner, String\
  \ msg ) {\n    if ( ! scanner.hasNext() )\n      throw new IllegalStateException(\
  \ msg );\n    return scanner.next();\n  }\n\n  private static int nextIntOrThrow(\
  \ Scanner scanner, String msg ) {\n    if ( ! scanner.hasNextInt() )\n      throw\
  \ new IllegalStateException( msg );\n    int number = scanner.nextInt();\n    if\
  \ ( number < 0 )\n      throw new IllegalStateException( \"Value has to be positive\
  \ but was \"\n                                      + number );\n    return number;\n\
  \  }\n\n  public static void renderP3PpmImage( Readable input, RgbToGray rgbToGray,\n\
  \                                      IntUnaryOperator grayToAscii,\n         \
  \                             Appendable output )\n    throws IOException {\n\n\
  \  Scanner scanner = new Scanner( input );\n  // Header P3\n  String magicNumber\
  \ = nextStringOrThrow( scanner, \"End of file, missing header\" );\n  if ( ! magicNumber.equals(\
  \ MAGIC_NUMBER ) )\n    throw new IllegalStateException( \"No P image file, but\
  \ \" + magicNumber );\n\n  // Width and Height\n  int width = nextIntOrThrow( scanner,\
  \ \"End of file or wrong format for width\" );\n  int height = nextIntOrThrow( scanner,\
  \ \"End of file or wrong format for height\" );\n\n  // Max color value\n  int maxVal\
  \ = nextIntOrThrow( scanner, \"End of file or wrong format for max value\" );\n\
  \  if ( maxVal != 255 )\n    throw new IllegalStateException(\n      \"the maximum\
  \ color value 255 is allowed but was \" + maxVal );\n\n  // Matrix\n  for ( int\
  \ y = 0; y < height; y++ ) {\n    for ( int x = 0; x < width; x++ ) {\n      int\
  \ r = nextIntOrThrow( scanner, \"End of file or wrong format for red value\" );\n\
  \      int g = nextIntOrThrow( scanner, \"End of file or wrong format for green\
  \ value\" );\n      int b = nextIntOrThrow( scanner, \"End of file or wrong format\
  \ for blue value\" );\n      int gray = rgbToGray.toGray( r, g, b );\n      output.append(\
  \ (char) grayToAscii.applyAsInt( gray ) );\n    }\n    output.append( '\\n' );\n\
  \  }\n  }\n\n  public static void renderP3PpmImage( Readable input, Appendable output\
  \ )\n    throws IOException {\n  renderP3PpmImage( input, RgbToGray.DEFAULT, GrayToAscii.DEFAULT,\
  \ output);\n  }\n}\n```\n\n由于该类只有静态方法，因此不需要构造函数，它被设置为私有。该类不存储任何状态。对于获取连续的标记，`Scanner`\
  \ 是非常有用的。可能会发生两种错误：流中缺少数据，或者数据类型错误。两个辅助方法 `nextOrThrow(...)` 和 `nextIntOrThrow(...)`\
  \ 分别简化了字符串和整数的读取，并在流中没有标记时抛出异常。读取整数的方法会检查数字是否为负数，在这种情况下会抛出 `IllegalStateException`。从外部可以访问两个重载方法\
  \ `renderP3PpmImage(...)`。让我们从带有四个参数的完整方法开始：\n\n1. 一个 `Readable` 输入。\n2. 用于将 RGB\
  \ 值转换为灰度值的 `RgbToGray` 映射。\n3. 用于将灰度值转换为 ASCII 值的 `IntUnaryOperator` 映射。\n4. 用于写入结果的\
  \ ASCII 艺术画的 `Appendable` 输出。\n\n由于输入/输出操作的固有风险（在读取和写入过程中可能会出错），该方法可能会抛出 `IOException`。`Scanner`\
  \ 连接到 `Readable`，这是它从中读取数据的源头。我们获取一个标记并期望一个特殊的标头 `P3`。这是 `nextOrThrow(...)` 的唯一用途。读取标头后，必须紧跟高度和宽度。它们不能为负数；然而，赋值\
  \ `0` 不会导致错误，我们允许这样做。之后，读取最大的可能值，根据我们的定义，它必须始终是 `255`。原则上，标准允许任意值，但我们简化了这一点。一旦获取了高度和宽度，我们就可以两个嵌套循环，每个循环读取三个色调。原则上，一个循环就足够了，但程序可能需要引用\
  \ x/y 坐标。读取 RGB 值后，会调用转换函数并创建灰度调，然后通过映射变为 ASCII 字符。来自 `IntUnaryOperator` 的结果是一个\
  \ `int`，我们将其转换为 `char` 并写入输出。在行末尾，我们写一个新行。\n\n第二个方法 `renderP3PpmImage(...)` 访问了两个映射的默认实现。该库的用户可以选择使用默认转换器，也可以传递他们自己的转换器。\n\
  \n### 拆分文件（读取和写入文件）\n\n`com/tutego/io/FileSplitter.java`\n\n```java\nprivate static\
  \ final int EOF = -1;\n\nprivate static void splitFile( Path source, int size )\
  \ throws IOException {\n  Objects.requireNonNull( source );\n  Objects.checkIndex(\
  \ size, Integer.MAX_VALUE );\n\n  try ( InputStream fis = Files.newInputStream(\
  \ source ) ) {\n    byte[] buffer = new byte[ size ];\n    for ( int cnt = 1, remaining;\n\
  \          (remaining = fis.read( buffer )) != EOF;\n          cnt++ ) {\n     \
  \ Path path = Paths.get( source + \".\" + cnt );\n      try ( OutputStream fos =\
  \ Files.newOutputStream( path ) ) {\n        fos.write( buffer, 0, remaining );\n\
  \      }\n    }\n  }\n}\n\npublic static void main( String[] args ) {\n\n  if (\
  \ args.length == 0 ) {\n    System.err.println( \"你需要指定一个文件名来拆分文件。\" );\n    return;\n\
  \  }\n  try {\n    String filename = args[ 0 ];\n    splitFile( Paths.get( filename\
  \ ), 1_474_560 );\n  }\n  catch ( IOException e ) {\n    System.err.println( e.getMessage()\
  \ );\n  }\n}\n```\n\n\n\n\n\n在第一步，我们打开文件进行读取。由于文件需要按字节处理，因此我们获取了一个 `InputStream`。这是一个程序无论如何必须在结束时关闭的资源，因此使用了\
  \ `try`-with-resources`。拆分可以通过两种不同的方式实现：一种可能性是打开一个 `OutputStream`，从 `InputStream`\
  \ 读取字节并将其写入 `OutputStream`；这种方式会非常节省内存。这里选择了另一种方案，它节省了一些程序代码，但面临着 `OutOfMemoryError`\
  \ 的风险，因为该方案一次性读取整个字节数组，而该数组的大小与传递的尺寸相同。然而，考虑到软磁盘的预期大小，这种情况并不会发生，而且直接读取到缓冲区并进行写入可以获得良好的性能。\n\
  \n数组的大小是 `size` 字节。我们在循环中反复使用该数组。在循环内部，我们声明两个变量：一个是用于生成文件扩展名的计数器，另一个是变量 `remaining`，用于记录从输入流中实际读取的字节数。实际读取实现在\
  \ `for` 循环的条件部分，读取后，我们得到更新后的 `remaining` 变量，其值为 `-1` 或包含读取的字节数。\n\n在循环体中，字节数组被写入文件。`Files.newOutputStream(…)`\
  \ 返回一个输出流。该方法的第一个参数是一个生成的 `Path` 对象，它接收文件名并在点之后追加一个计数器。使用 `OutputStream` 的方法 `write(byte[],\
  \ int, int)`，将数组的已填充部分写入文件。如果循环运行多次，可以保证字节数组在倒数第二次运行时被填满。在最后一次通过中，读取的字节数可能没有 `size`\
  \ 那么多，因此必须写入较少的数组字节，始终满足 `remaining` <= `size`。\n\n`main(…)` 方法检查是否在命令行传递了参数，如果是，则带上参数调用\
  \ `fileSplit(…)`。我们将异常写入到错误输出通道。\n\n### 测验：DataInputStream 和 DataOutputStream\n\n\
  `FilterInputStream`、`FilterOutputStream`、`FilterReader` 和 `FilterWriter` 类是自定义过滤器的有用超类。这些类提供了双重优势：首先，它们在实例变量中保留了封装的流对象；其次，它们消除了从头重新实现\
  \ `InputStream`、`OutputStream`、`Reader` 或 `Writer` 中每个方法的需求。为了更详细地理解这一点，让我们来看下 `FilterOutputStream`\
  \ 的实现：\n\n#### OpenJDK 对 FilterOutputStream 的实现\n\n```\npackage java.io;\n\npublic\
  \ class FilterOutputStream extends OutputStream {\n   protected OutputStream out;\n\
  \   // 省略某些字段\n\n   public FilterOutputStream(OutputStream out) {\n      this.out\
  \ = out;\n   }\n\n   @Override\n   public void write(int b) throws IOException {\n\
  \       out.write(b);\n   }\n\n   @Override\n   public void write(byte b[]) throws\
  \ IOException {\n      write(b, 0, b.length);\n   }\n\n   @Override\n   public void\
  \ write(byte b[], int off, int len) throws IOException {\n      if ((off | len |\
  \ (b.length - (len + off)) | (off + len)) < 0)\n          throw new IndexOutOfBoundsException();\n\
  \n      for (int i = 0 ; i < len ; i++) {\n          write(b[off + i]);\n      }\n\
  \   }\n\n   // 省略 flush() / close()\n}\n```\n\n代码显示只有 `write(int)` 方法将数据转发到下层流，而另外两个\
  \ `write(…)` 方法仅仅是调用 `write(int)` 方法的包装器。自定义过滤器只有义务重写 `write(int)` 方法。然而，为了性能优化，建议也实现其他方法，因为单次操作写入整个字节数组比为数组中的每个元素执行单独的写入操作要快。\n\
  \n`DataInputStream` 和 `DataOutputStream` 是特殊的过滤器类，正如 UML 图在方法级别更详细展示的 `DataInputStream`\
  \ 那样；此外，它们实现了 `DataInput` 和 `DataOutput`。\n\n![带有对角线注释的展示](img/08_01.jpg)\n**图 8.1**\
  \ 抽象超类 `InputStream` 和 `OutputStream` 只与 `byte` 和 `byte` 数组一起，而超类 `Reader` 和 `Writer`\
  \ 只处理 `char` 和 `char` 数组。`DataInputStream` 和 `DataOutputStream` 的特点在于它们还提供了其他类型的方法。因此可以读写整数或浮点数。这是\
  \ `read()` 工作原理的典型示例：\n\n#### OpenJDK 对 readInt() 的实现\n\n```\npublic int readInt()\
  \ throws IOException {\n   int ch1 = read();\n   int ch2 = read();\n   int ch3 =\
  \ read();\n   int ch4 = read();\n   if ((ch1 | ch2 | ch3 | ch4) < 0)\n      throw\
  \ new EOFException();\n   return (ch1 << 24) | (ch2 << 16) | (ch3 << 8) | ch4;\n\
  }\n```\n\n### 使用 GZIP 压缩数字序列\n\n**com/tutego/io/CompressLotNumbers.java**\n\n```java\n\
  Path tempFile = Files.createTempFile(\"numbers\", \"bin\");\n\nint n = 4;\n\ntry\
  \ (OutputStream fos = Files.newOutputStream(tempFile);\n     OutputStream gos =\
  \ new GZIPOutputStream(fos);\n     DataOutputStream out = new DataOutputStream(gos))\
  \ {\n  for (int i = 0; i < n; i++) {\n    out.writeLong(i);\n  }\n}\n\nSystem.out.println(\"\
  未压缩: \" + n * Long.BYTES);\nSystem.out.println(\"压缩后: \" + Files.size(tempFile));\n\
  \nFiles.delete(tempFile);\n```\n\n例如，我们希望避免在当前目录下创建文件，而是在系统的临时目录中创建。这应该被定期删除，因此我们在\
  \ Java 中程序结束时再次尝试删除临时文件。\n\n\n\n\n在循环中，我们写入了 `n` 个数字。最后，我们计算了如果数据不压缩，文件将有多大。我们不需要创建一个实际的文件来实现这一点；我们可以轻松地计算文件大小。为了获取压缩后的尺寸，我们使用了\
  \ `Files.size(…)` 方法；另一种解决方案是直接计数流过流的字节数——但我们在这里没有这样做。\n\n文件的未压缩大小为 8,000,000 字节，压缩后的大小为\
  \ 2,129,303 字节。由于数据是以 `long` 类型写入的，许多位都是 `0`。生成的位模式如下所示（最后一个数字代表 999999，空格分隔字节块）：\n\
  \n```\n00000000  00000000  00000000  00000000\n00000000  00000000  00000000  00000001\n\
  …\n00000000  00001111  01000010  00111110\n00000000  00001111  01000010  00111111\n\
  ```\n\n压缩后的文件大约只有原始大小的四分之一。对于这种特定的序列，四个或更多 `long` 元素的压缩是值得的。\n\n### 为聊天（反）序列化数据并转换为文本\n\
  \n该解决方案由两部分组成：一个将对象映射到字符串的方法，以及一个将字符串表示映射回对象的映射。让我们从映射到字符串开始：\n\n**com/tutego/exercise/io/ObjectBase64.java**\n\
  \n```java\npublic static String serializeObjectToBase64( Object object ) {\n  ByteArrayOutputStream\
  \ baos = new ByteArrayOutputStream();\n\n  try ( OutputStream b64os   = Base64.getEncoder().wrap(\
  \ baos );\n        OutputStream dos      = new DeflaterOutputStream( b64os );\n\
  \        ObjectOutputStream oos = new ObjectOutputStream( dos ) ) {\n   oos.writeObject(\
  \ object );\n  }\n  catch ( IOException e ) {\n    throw new IllegalStateException(\
  \ e );\n  }\n\n  return baos.toString( StandardCharsets.US_ASCII );\n}\n```\n\n\
  `ObjectOutputStream` 将字节写入 `DeflaterOutputStream`，后者压缩这些字节并将它们传递给 `Base64` 类的 `OutputStream`。该\
  \ API 有些不同，因为通常目标是在类的构造函数中指定的；然而，对于 Base64 编码器和解码器，这是 `wrap(…)` 方法。Base64 转换写入到\
  \ `ByteArrayOutputStream`。总结一下：如果 `writeObject(Object)` 写入到 `ObjectOutputStream`，数据将流向\
  \ `DeflaterOutputStream`，然后进入 `Base64` 编码器，最后到达 `ByteArrayOutputStream`。映射成功，或者会抛出异常，异常会被捕获并作为\
  \ `IllegalStateException`（一种运行时异常）终止处理。如果 `ByteArrayOutputStream` 包含数据，`toString(…)`\
  \ 将返回结果。生成的字符串由纯 ASCII 字符组成，因此可以使用 `US_ASCII` 编码。\n\n反向步骤将字符串转换为对象。\n\n**com/tutego/exercise/io/ObjectBase64.java**\n\
  \n```java\npublic static Object deserializeObjectFromBase64( String string ) {\n\
  \  final byte[] bytes = string.getBytes( StandardCharsets.US_ASCII );\n\n  try (\
  \ ByteArrayInputStream bis = new ByteArrayInputStream( bytes );\n        InputStream\
  \ b64is         = Base64.getDecoder().wrap( bis );\n        InputStream iis    \
  \         = new InflaterInputStream( b64is );\n        ObjectInputStream ois   \
  \  = new ObjectInputStream( iis ) ) {\n   return ois.readObject();\n  }\n  catch\
  \ ( IOException | ClassNotFoundException e ) {\n    throw new IllegalStateException(\
  \ e );\n  }\n}\n```\n\n我们需要从 `String` 生成一个 `InputStream`，以便可以使用 `ObjectInputStream`\
  \ 类。这是一个小问题，因为 Java 并没有提供一种自然的方法将 `String` 作为 `InputStream` 的源。开源库（如 Google Guava\
  \ 或 Apache Commons）提供了解决方案，例如以 Apache 类 `CharSequenceInputStream` 的形式。Java 本身只提供相反的方向，例如通过\
  \ `InputStreamReader`，它将 `InputStream` 适配为 `Reader`，而不是让 `Reader` 表示为 `InputStream`。因此，通常在字符串必须作为\
  \ `Reader` 时使用的 `StringReader` 也对我们没有帮助。\n\n所选的解决方案将字符串转换为 `byte` 数组。这并不令人满意，因为输入运行了两次：一次通过转换，另一次通过从流读取。另一方面，这在实际意义上应该不大，而且额外的内存对于我们的用例来说并不是负担。\n\
  \n转换为 `byte` 数组后，`ByteArrayOutputStream` 创建数据。`InflaterInputStream` 解包数据，`ObjectInputStream`\
  \ 重构 `readObject()`。\n\n### 测验：序列化要求\n\n该实例无法序列化，因为 `Inputs` 没有实现 `Serializable`\
  \ 接口。正确的做法应该是：\n\n```java\nclass Inputs implements Serializable {\n  static class\
  \ Input implements Serializable {\n    String input;\n  }\n  public List<Input>\
  \ inputs = new ArrayList<>();\n}\n```\n\n序列化机制遍历对象图，并且所有元素必须是可序列化的。在我们的示例中：\n\n\
  1.  序列化 `Inputs`。它是 `Serializable` 的吗？如果是，序列化 `ArrayList`。\n2.  序列化 `ArrayList`。它是\
  \ `Serializable` 的吗？如果是，序列化 `inputs` 元素。\n3.  序列化 `Input`。它是 `Serializable` 的吗？如果是，序列化变量\
  \ `input`。\n4.  序列化 `String`。它是 `Serializable` 的吗？如果是，序列化字符串。\n\n基本数据类型会自动序列化，无论其可见性如何。然而，静态变量（包括标记为\
  \ `transient` 的变量）不会被序列化。某些 Java 类型（如 `String`）本身是 `Serializable`。此外，数组和枚举也可以序列化。\n\
  \n### 保存最后的 Inputs\n\n任务由一系列语句组成，但在提出解决方案之前，需要提出并回答问题：当属性类型更改且需要反序列化对象时会发生什么？答案是：\n\
  \n```\njava.io.InvalidClassException: com.tutego.exercise.net.Inputs$Input; local\
  \ class incompatible: stream classdesc serialVersionUID = -8691588030053894297,\
  \ local class serialVersionUID = 6463495757449665144\n```\n\n存在不兼容的 `serialVersionUID`。背景如下：每个类有一个标识符，即\
  \ *serialVersionUID*。这个 UID（唯一标识符）要么在类中静态固定的，要么是动态计算的。由于任务中的类没有定义自己的 UID，序列化器以哈希码的方式计算\
  \ UID，但不是基于分配，而是基于类型。这在读取和写入时都会发生；如果对象被序列化，该 UID 也会被写入数据流。读取时，反序列化器会检查流中的 UID 是否与类的\
  \ UID 匹配。如果发生了结构性变化，动态 UID 就会改变。这正是异常所指示的。这两个值代表数据流中的 UID 和更改后的类的 UID。\n\n如果结构性变化不应导致异常，则必须在代码中手动设置\
  \ UID。\n\n**com/tutego/exercise/io/InputHistory.java**\n\n\n\n\n```java\nclass Inputs\
  \ implements Serializable {\n  @Serial private final long serialVersionUID = 1;\n\
  \n  public static class Input implements Serializable {\n    private static final\
  \ long serialVersionUID = 1;\n    CharSequence input;\n    LocalDateTime localDateTime\
  \ = LocalDateTime.now();\n  }\n\n  public List<Input> inputs = new ArrayList<>();\n\
  }\n```\n\n`Inputs` 类及其嵌套类 `Input` 都包含一个私有的静态 `serialVersionUID`。赋值给此字段的实际值并不重要。JDK\
  \ 自带的 `serialver` 工具即使在缺少 `serialVersionUID` 的情况下，也会生成写入数据流的相同 UID。如果存在 `serialVersionUID`\
  \ 且数据流中的 UID 与类中的 UID 匹配，则反序列化过程会更加宽松：数据流中的未知属性会被忽略，数据类型发生更改的属性也会被跳过。\n\n`CharSequence`\
  \ 是一个接口，接口通常不继承 `Serializable`。由于类型检查发生在运行时，且 `String` 实现了 `Serializable` 接口，因此不会报错。尽管如此，`String`\
  \ 和 `CharSequence` 会导致不同的 UID。\n\n主程序嵌入在 `InputHistory` 类中。该类的构造函数读取文件并反序列化输入。另一个方法\
  \ `addAndSave(…)` 更新 `Inputs` 并将结果序列化到文件中。`main(…)` 方法将一切整合在一起。\n\n### `com/tutego/exercise/io/InputHistory.java`\n\
  \n```java\npublic class InputHistory {\n\n  private final static Path FILENAME =\n\
  \      Paths.get( System.getProperty( \"java.io.tmpdir\" ),\n               \"String2Uppercase.ser\"\
  \ );\n\n  private Inputs inputs;\n\n  InputHistory() {\n    try ( InputStream is\
  \ = Files.newInputStream( FILENAME );\n          ObjectInputStream ois = new ObjectInputStream(\
  \ is ) ) {\n      inputs = (Inputs) ois.readObject();\n      inputs.inputs.forEach(\
  \ input -> System.out.println( input.input ) );\n    }\n    catch ( IOException\
  \ | ClassNotFoundException e ) {\n      inputs = new Inputs();\n      e.printStackTrace();\n\
  \    }\n  }\n\n  void addAndSave( String string ) {\n    Inputs.Input newInput =\
  \ new Inputs.Input();\n    newInput.input = string;\n    inputs.inputs.add( newInput\
  \ );\n\n    try ( OutputStream os = Files.newOutputStream( FILENAME );\n       \
  \   ObjectOutputStream oos = new ObjectOutputStream( os ) ) {\n      oos.writeObject(\
  \ inputs );\n    }\n  catch ( IOException e ) {\n      e.printStackTrace();\n  \
  \  }\n  }\n\n  public static void main( String[] args ) {\n    InputHistory inputHistory\
  \ = new InputHistory();\n    for ( String line;\n          (line = new Scanner(\
  \ System.in ).nextLine()) != null; ) {\n      inputHistory.addAndSave( line );\n\
  \      System.out.println( line.toUpperCase() );\n    }\n  }\n}\n```\n\n该类有两个实例变量：文件名和引用\
  \ `inputs`。构造函数为文件打开一个 `InputStream` 并用它初始化 `ObjectInputStream`。`readObject(…)`\
  \ 开始反序列化，如果发生异常，则会被捕获并构建一个新的 `Inputs` 对象。如果 `Inputs` 能够被重建，所有字符串将通过列表的 `forEach(…)`\
  \ 输出。`addAndSave(String)` 方法创建一个 `Inputs` 对象，将传递的字符串设置到该对象中，并通过 `ObjectOutputStream`\
  \ 将其追加到 `inputs` 列表中。`main(…)` 方法创建一个 `InputHistory` 对象，这会触发反序列化文件的构造函数。在首次启动时，该文件不存在，会抛出一个异常但程序不会终止。在下次程序启动时，反序列化应该可以工作，最后输入的字符串将出现在屏幕上。\n\
  \n# 9 网络编程\n\nDOI: 10.1201/978103495550\n\n如今，访问网络已经很常见，就像访问本地系统一样。从 Java 1.0 开始提供了用于开发客户端-服务器应用程序的网络\
  \ API，并支持超文本传输协议（HTTP）。本章的练习关于如何从 Web 服务器获取资源。\n\n## 前提条件\n\n- 了解 `URI` 和 `URL`\
  \ 类。\n- 了解输入/输出流。\n- 能够使用 `Socket` 和 `ServerSocket` 实现客户端和服务。\n\n## 本章使用的数据类型\n\n\
  - `java.net.URL`\n- `java.net.Socket`\n- `java.net.ServerSocket`\n- `java.net.SocketFactory`\n\
  - `java.net.DatagramSocket`\n\n## URL 和 URLConnection\n\n在 Java 中，显式的 `URL` 类表示一个\
  \ `URL` 和一个 `URI`。可以通过 `URL` 打开 HTTP 连接；这在内部由 `URLConnection` 类处理。这两个类对于现代 HTTP\
  \ 调用来说并不十分方便；只有在 Java 11 中，核心库新增了 `java.net.http` 包并引入了 `HttpClient`。Java 框架有更多的解决方案，开源世界中也有许多替代方案：\n\
  - Jakarta EE 中的 `Client`。\n- Spring 中的 `RestClient`。\n- `OkHttp`。\n- `Feign` 和 `Retrofit`。\n\
  \n### 通过 URL 下载远程图片\n\n`URL` 类提供了一个返回 `InputStream` 的方法以便读取资源的字节。Ciao 喜欢在 shiphub.com\
  \ 上看着形状良好的船的照片来放松。他希望在自己的存储设备上存一些照片，这样他就可以幻想着遥远的航行了。\n\n任务：\n- 对于给定的 `URL`，编写一个程序下载资源并将其存储在本地文件中。\n\
  - 文件名应基于 `URL`。\n\n### 从 URL 读取远程文本\n\n约翰霍普金斯大学系统与工程中心（CSSE）每天在 https://github.com/CSSEGISData/COVID-19/tree/master/csse_covid_19_data\
