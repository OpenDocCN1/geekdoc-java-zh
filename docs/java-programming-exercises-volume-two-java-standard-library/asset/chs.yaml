  unicodeVersion\", \"1\");\npreferences.save();\n```\n\n### 使用 jsoup 下载 Wikipedia\
  \ 图片\n\n`com/tutego/exercise/net/WikipediaImageLoader.java`\n\n```java\nvar url\
  \ = \"https://en.wikipedia.org/wiki/Main_Page\";\nvar tempDir = Files.createTempDirectory(\"\
  wikipedia-images\");\n\nvar document = Jsoup.parse(URI.create(url).toURL(), 1000\
  \ /* ms */);\n\nfor ( var imgElement : document.select(\"img[src~=(?i)\\\\.(png|gif|jpg)]\"\
  )) {\n  String imgUrl = imgElement.absUrl(\"src\");\n  String filename = imgUrl.replaceAll(\"\
  [^a-zA-Z0-9_.-]\", \"_\");\n\n  final int MAX_FILENAME_LENGTH = 128;\n  if (filename.length()\
  \ > MAX_FILENAME_LENGTH) {\n    String suffix = filename.substring(filename.length()\
  \ - 4);\n    filename = filename.substring(0, MAX_FILENAME_LENGTH - 4) + suffix;\n\
  \  }\n  try (var imgStream = URI.create(imgUrl).toURL().openStream()) {\n    Files.copy(imgStream,\
  \ tempDir.resolve(filename), StandardCopyOption.REPLACE_EXISTING);\n  }\n}\nSystem.out.println(\"\
  成功将 Wikipedia 图片下载到 \" + tempDir);\n```\n\n\n\n`Jsoup` 类有一个静态方法 `parse(…)`，它可以从不同的源构建\
  \ HTML 文档。在我们的案例中，我们直接选择了 `URL` 对象。在访问网络时，必须为 `Jsoup` 设置一个超时时间，我们将其设置为 1000 毫秒。`parse(…)`\
  \ 方法返回一个 `org.jsoup.nodes.Document` 对象。有两种方式可以访问此 `Document` 并提取元素：\n\n*   DOM（文档对象模型）方法，如\
  \ `getElementById(String id)` 或 `child(int index)`。\n*   如 CSS 中已知的选择器表达式。\n\n所建议的解决方案通过\
  \ `select(…)` 方法工作。`img[...]` 代表所有的 `img` 标签，而 `src~`= 通过正则表达式指定 `src` 属性应满足的条件，即字符串匹配\
  \ `\\.(png|gif|jpg)`，也就是说具有文件扩展名 `.png`、`.gif` 或 `.jpg`。`(?i)` 标志表示不区分大小写激活搜索。\n\
  \n`select(…)` 方法的结果类型为 `Elements`，它是 `ArrayList` 的子类。`List` 是可迭代的，并且可以使用扩展 `for`\
  \ 循环方便地遍历。此列表中的每个元素类型均为 `Element`。我们可以使用 `attr(\"src\")` 调用获取图像的设置 URL，但更有用的是 `absUrl(…)`\
  \ 方法，它可以解析 URL。\n\n如果我们之后下载图像，那么就不能直接使用此 URL 作为文件名，因为其中包含会导致文件系统产生问题的非法符号。字符串方法\
  \ `replaceAll(…)` 返回一个新的清理过的字符串，我们可以将其作为文件名。由于操作系统对文件名的允许长度可能有限制，代码块将长度缩减到最多 128\
  \ 个字符。下一步是构建 `URL` 对象并打开指向该图像的输入流，通过 `Files.copy(…)` 将其拷贝到本地文件系统；之前在 `ImageDownloader`\
  \ 任务中写过这段代码。然而，这次我们将图像放在临时目录中。\n\n### 生成带截图的 Word 文件\n\n`com/tutego/exercise/fileformat/ScreenCapturesInDocx.java`\n\
  \n```java\nprivate static final int TOTAL_NUMBER_OF_SCREEN_CAPTURES = 3;\nprivate\
  \ static final int DURATION_BETWEEN_SCREEN_CAPTURES = 5;\nprivate static final Rectangle\
  \ SCREEN_SIZE =\n    new Rectangle( Toolkit.getDefaultToolkit().getScreenSize()\
  \ );\n\nprivate static byte[] getScreenCapture() throws AWTException, IOException\
  \ {\n    BufferedImage screenCapture = new Robot().createScreenCapture( SCREEN_SIZE\
  \ );\n    ByteArrayOutputStream os = new ByteArrayOutputStream();\n    ImageIO.write(\
  \ screenCapture, \"jpeg\", os );\n    return os.toByteArray();\n}\n\nprivate static\
  \ void appendImage( XWPFDocument doc, byte[] imageBytes )\n    throws IOException,\
  \ InvalidFormatException {\n  XWPFRun paragraph = doc.createParagraph().createRun();\n\
  \  paragraph.addPicture( new ByteArrayInputStream( imageBytes ),\n             \
  \             Document.PICTURE_TYPE_JPEG,\n                          UUID.randomUUID().toString(),\n\
  \                          Units.toEMU( SCREEN_SIZE.width / 100. * 20 ),\n     \
  \                     Units.toEMU( SCREEN_SIZE.height / 100. * 20 ) );\n    paragraph.addBreak();\n\
  }\n\npublic static void main( String[] args ) throws Exception {\n  try ( XWPFDocument\
  \ xwpfDocument = new XWPFDocument() ) {\n    for ( int i = 0; i < TOTAL_NUMBER_OF_SCREEN_CAPTURES;\
  \ i++ ) {\n      appendImage( xwpfDocument, getScreenCapture() );\n      TimeUnit.SECONDS.sleep(\
  \ DURATION_BETWEEN_SCREEN_CAPTURES );\n    }\n\n    Path tempFile = Files.createTempFile(\
  \ \"screen-captures\", \".docx\" );\n    try ( OutputStream out = Files.newOutputStream(tempFile)\
  \ ) {\n      xwpfDocument.write( out );\n    }\n    System.out.println(\"Written\
  \ to \" + tempFile);\n  }\n}\n```\n\n该解决方案由三个方法组成。第一个方法 `getScreenCapture()` 返回一个带有\
  \ JPEG 格式屏幕内容的 `byte[]`。Java 可以通过 `Robot` 类实现这一点，该类用于自动化。（`Robot` 类可用于移动光标和发送按键）。整个尺寸的\
  \ `createScreenCapture(…)` 结果类型为 `BufferedImage`，一种内部图像格式。为了转换为 JPEG 格式，程序诉助于 `ImageIO.write(…)`\
  \ 方法，该方法首先将 `BufferedImage` 写入 `ByteArrayOutputStream`，然后将其转换为字节数组并返回。\n\n第二个方法是\
  \ `appendImage(…)`；它将图像添加到现有的 `XWPFDocument` 中。由于每个图像都放置在其段落中，因此首先构建 `Paragraph`，然后通过\
  \ `addPicture(…)` 添加图像。该方法期望图像的输入流以及唯一标识符和尺寸信息。图像经过了一定的缩放。\n\n主方法 `main(…)` 打开一个新的\
  \ `XWPFDocument`，然后截屏，将其添加到文档中，等待秒，然后再次截屏，直到达到所需的数量。目前文档仅在内存中。`Files.createTempFile(…)`\
  \ 在临时目录中创建一个文件并将正式文档写入该文件。\n\n### 从 ZIP 播放虫鸣\n\n`com/tutego/io/TrueZipDemo.java`\n\
  \n```java\nPath path = new TPath( filename );\n\nList<Path> wavFiles = new ArrayList<>();\n\
  try ( DirectoryStream<Path> entries = Files.newDirectoryStream( path ) ) {\n  entries.forEach(\
  \ wavFiles::add );\n}\n\nwhile ( true ) {\n\n  int randomIndex = ThreadLocalRandom.current().nextInt(\
  \ wavFiles.size() );\n  Path randomWavFile = wavFiles.get( randomIndex );\n  try\
  \ ( InputStream fis = Files.newInputStream(randomWavFile) ) {\n      //为了支持 mark/reset，我们需要一个\
  \ BufferedInputStream\n      BufferedInputStream bis = new BufferedInputStream(\
  \ fis );\n      AudioInputStream ais = AudioSystem.getAudioInputStream( bis ) )\
  \ {\n      Clip clip = AudioSystem.getClip();\n      clip.open( ais );\n      clip.start();\n\
  \      TimeUnit.MICROSECONDS.sleep( clip.getMicrosecondLength() + 50 );\n      clip.close();\n\
  \  }\n}\n```\n\n该解决方案包含以下部分：\n\n1.  从压缩包 `filename` 读取所有音频文件。\n2.  选择一个随机音频文件。\n\
  3.  播放音频文件。\n\nTrueZIP 使用它自己的 `Path` 实现 `TPath` 来工作。构造函数可以传递 `String`、`Path`、`URI`\
  \ 或 `File` 对象。如果我们使用自己的 ZIP 文件并构建了 `TPath`，`newDirectoryStream(..)` 返回所有目录内容，并将它们缓存在\
  \ `Path` 对象的列表中。\n\n无限循环开始并从列表中选择一个随机文件。打开输入流并用 `BufferedInputStream` 进行装饰。这是必要的，因为音频系统要求输入流具有一种特殊功能，即支持标记（markers）。TrueZIP\
  \ 的输入流不支持这一点，至少目前版本如此。\n\n之后，可以打开 `AudioInputStream` 并播放 `Clip`。Clip 的时长可以通过 `getMicrosecondLength()`\
  \ 查询，这就是我们在开始后等待的时间。在此基础上额外增加了 50 微秒。关闭 clip，进入下一次循环。\n\n\n\n使用 JDBC 进行练习需要一个数据库管理系统、数据库和数据。这些练习可以使用任何关系型数据库管理系统实现，因为所有主要的数据库管理系统都有\
  \ JDBC 驱动程序，且访问方式始终相同。本章使用了紧凑型数据库管理系统 `H2`。\n\n有一些图形化工具可以显示表格并简化 SQL 查询的执行。对于 IDE，通常有插件；例如，`NetBeans`\
  \ 有 SQL 编辑器，`IntelliJ Ultimate` 内置了数据库编辑器，对于免费的社区版，可以使用 [`plugins.jetbrains.com/plugin/1800-database-navigator`](https://plugins.jetbrains.com/plugin/1800-database-navigator)。对于\
  \ `Eclipse`，有不同的插件，可以从 Eclipse 基金会获取 [`www.eclipse.org/datatools/downloads.php`](https://www.eclipse.org/datatools/downloads.php)\
  \ `Eclipse Data Tools Platform (DTP) Project`。\n\n![展示了 Bonny Brain 坐在桌旁，用羽毛笔在纸上写字。她旁边堆着一些信封。](img/un11_01.jpg)\n\
  \n### 准备 H2 数据库 ★\n\nH2 是一个非常紧凑的程序，数据库管理系统、JDBC 驱动程序和一个小型管理界面封装在一个 `JAR`（Java 归档）中。\n\
  \n在 Maven POM 中包含以下依赖：\n\n```xml\n<dependency>\n  <groupId>com.h2database</groupId>\n\
  \  <artifactId>h2</artifactId>\n  <version>2.2.224</version>\n  <scope>runtime</scope>\n\
  </dependency>\n```\n\n## 数据库查询\n\n每个数据库访问都会通过以下阶段：\n\n1. 通过建立连接启动数据库访问。\n2. 发送语句。\n\
  3. 收集结果。\n\n### 查询所有已注册的 JDBC 驱动程序 ★\n\nJava 6 引入了 `Service Provider API`，如果代码在类路径上并列在一个特殊的文本文件中，它就可以自动执行。JDBC\
  \ 驱动程序使用 Service Provider API 自动向 `DriverManager` 注册。\n\n任务：\n\n*   使用 `DriverManager`\
  \ 查询所有已登录的 JDBC 驱动程序，并将类名输出到屏幕上。\n\n### 构建数据库并执行 SQL 脚本 ★\n\nCaptain CiaoCiao 想要在关系数据库中存储关于海盗的信息。初始草稿的结果是存储海盗的昵称、电子邮件地址、军刀长度、出生日期和简短描述。在对数据库建模后，编写一个\
  \ SQL 脚本来创建表：\n\n```sql\nDROP ALL OBJECTS;\n\nCREATE TABLE Pirate (\n  id      \
  \     IDENTITY,\n  nickname    VARCHAR(255) UNIQUE NOT NULL,\n  email        VARCHAR(255)\
  \ UNIQUE NOT NULL,\n  swordlength  INT,\n  birthdate    DATE,\n  description  VARCHAR(4096)\n\
  );\n```\n\n第一个 SQL 语句删除了 H2 数据库中的所有条目。然后 `CREATE TABLE` 创建了一个具有不同列和数据类型的新表。每个海盗都有由数据库分配的唯一\
  \ ID；我们将其称为*自动生成的键*。\n\n![图标：圆内的信息标志。](img/Icon_01.jpg) 书中的 SQL 遵循命名规范：\n\n*   SQL\
  \ 关键字始终使用大写。\n*   表名为单数并以大写字母开头，就像 `Java` 中的类名以大写字母开头一样。\n*   表列名为全小写。\n\n一个 Java\
  \ SE 程序使用 `DriverManager` 通过 `getConnection(…)` 方法建立连接。JDBC URL 包含数据库详细信息和连接详情，例如服务器和端口。在\
  \ `H2` 的情况下，如果不需要连接服务器而是让 RDBMS 成为应用程序的一部分，则 JDBC URL 是简单的：\n\n```java\nString jdbcUrl\
  \ = \"jdbc:h2:./pirates-dating\";\ntry (Connection connection = DriverManager.getConnection(jdbcUrl\
  \ )) {\n  …\n}\n```\n\n如果数据库 `pirates-dating` 不存在，它将会被创建。`getConnection(…)` 随后会返回连接。连接必须始终关闭。`try`-with-resources`\
  \ 处理了关闭操作，如上面的代码所示。\n\n如果整个 RDBMS 作为应用程序的一部分运行，这被称为*嵌入模式*。在嵌入模式下，启动的 Java 应用程序独占使用此数据库，多个\
  \ Java 程序无法连接到此数据库。只有在一个数据库服务器上，可以实现多个连接。`H2` 也可以这样做；感兴趣的人可以从 H2 网站了解详细信息：[`www.h2database.com/html/tutorial.html`](https://www.h2database.com/html/tutorial.html)。\n\
  \n任务：\n\n*   将文件 `create-table.sql` 放在 Maven 项目的 `resources` 目录下。将 SQL 脚本复制到该文件中。\n\
  *   创建一个新的 Java 类，并从类路径加载 SQL 脚本。\n*   建立与数据库的连接并执行加载的 SQL 脚本。\n\n我们可以使用命令行工具在最后查询数据库：\n\
  \n```bash\n$ java -cp h2-2.2.224.jar org.h2.tools.Shell jdbc:h2:./pirates-dating\n\
  Welcome to H2\n2.2.224\nsql> SHOW TABLES\nTABLE_NAME  SCHEMA  TYPE    COMMENT\n\
  PIRATE      PUBLIC  TABLE   \n\nsql> SELECT * FROM Pirate;\nID  NICKNAME  EMAIL\
  \               SWORDLENGTH  BIRTHDATE    DESCRIPTION\n1   CiaoCiao  ciaociao@faith.\
  \      18           1955-11-07  The dream\n2   SweetSushi  sweetsushi@faith.   \
  \   11           1952-04-03  Where are the\n3   Liv Loops  whiletrue@deenavis.camp\
  \ 16           1965-05-11  Great guy\nsql> exit\n```\n*(注：书中的 SQL 遵循命名规范。上面的代码块是重建的)*\n\
  \n![图标：位于表面上的灯泡。](img/Icon_02.jpg) 使用 `Statement` 的 `execute(…)` 方法。\n\n### 插入数据\
  \ ★\n\n到目前为止数据库不包含任何记录。在以下程序中将添加数据记录：\n\n```sql\nINSERT INTO Pirate (nickname, email,\
  \ swordlength, birthdate, description)\nVALUES ('CiaoCiao', 'ciaociao@faith.', 18,\
  \ '1955-11-07', 'The dream')\n```\n\n语句中明确缺少主键 `id`，因为它是自动分配的。\n\n任务：\n\n*   建立数据库的新连接，创建\
  \ `Statement` 对象并向数据库发送 `INSERT`。\n*   生成的键可以由 JDBC 驱动程序提供。添加第二个海盗，可以将生成的键（`long`）输出到屏幕上。调用\
  \ `executeUpdate(…)` 时，它返回一个 `int`。这指示了关于执行语句的一些信息，但是什么？\n\n### 批量向数据库插入数据 ★\n\n\
  如果需要执行多个 SQL 语句，可以将它们收集在*批*中。在第一步中，收集所有的 SQL 语句然后传输到数据库。JDBC 驱动程序通过网络发送每个查询。\n\n\
  任务：\n\n*   创建一个新类并将以下数组放入程序中：\n\n```java\nString[] values = {\n  \"'anygo', 'amiga_anker@cutthroat.adult',\
  \ 11, '2000-05-21', 'Living the dream'\",\n  \"'SweetSushi', 'muffin@berta.bar',\
  \ 11, '1952-04-03', 'Where are all the bad boys?'\",\n  \"'Liv Loops', 'whiletrue@deenavis.camp',\
  \ 16, '1965-05-11', 'Great guy'\"\n};\n```\n\n*   根据数组中的数据创建 SQL `INSERT` 语句，使用\
  \ `addBatch(…)` 将它们添加到 `Statement` 中，并使用 `executeBatch()` 提交语句。\n*   `executeBatch()`\
  \ 返回 `int[]`；里面是什么？\n\n### 使用编译语句插入数据 ★\n\n插入数据的第三种方式在实践中性能最高。它利用了数据库功能，即编译语句。Java\
  \ 使用数据类型 `PreparedStatement` 支持这种。在这里，首先将带有占位符的 SQL 语句发送到数据库，随后单独传输数据。这有两个优点：与数据库通信的数据量更小，且\
  \ SQL 语句通常由数据库解析和准备，因此执行速度更快。\n\n任务：\n\n\n\n\n*   创建一个新类，并在代码中包含以下声明：\n\n```java\n\
  List<String[]> data = Arrays.asList(\n    new String[]{ \"jacky overflow\", \"bullet@jennyblackbeard.red\"\
  , \"17\",\n                  \"1976-12-17\", \"If love a crime\" },\n    new String[]{\
  \ \"IvyIcon\", \"array.field@graceobool.cool\", \"12\",\n                  \"1980-06-12\"\
  , \"U&I\" },\n    new String[]{ \"Lulu De Sea\", \"arielle@dirtyanne.fail\", \"\
  13\",\n                  \"1983-11-24\", \"You can be my prince\" }\n);\n```\n\n\
  *   使用以下 SQL 语句创建一个预处理语句字符串：\n\n```sql\nString preparedSql = \"INSERT INTO Pirate\
  \ \" +\n                      \"(nickname, email, swordlength, birthdate,\ndescription)\
  \ \" +\n                      \"VALUES (?, ?, ?, ?, ?)\";\n```\n\n*   遍历列表 `data`，填充\
  \ `PreparedStatement` 并提交数据。\n*   所有的插入操作都应该在一个大的事务块中完成。\n\n### 请求数据 ★\n\n我们最近的程序在数据库中插入了新行；现在是时候读取它们了！\n\
  \n任务：\n*   使用 `executeQuery(…)` 向数据库发送 SQL 语句：\n\n```sql\nSELECT nickname, swordlength,\
  \ birthdate FROM Pirate\n```\n*   读取结果，并将昵称（nickname）、剑长度和出生日期输出到屏幕上。\n\n### 交互式式滚动\
  \ ResultSet ★\n\n对于许多数据库，`Statement` 可以配置为使得：\n*   `ResultSet` 不仅可以读取，还可以修改，这样数据就可以轻松地写回数据库，并且\n\
  *   结果集上的光标不仅可以通过 `next()` 向下移动，还可以任意定位或相对向上移动。\n\nCiao Ciao 船长想要在一个交互式应用程序中滚动查看数据库中的所有海盗。\n\
  \n任务：\n*   最初，应用程序应该显示记录数。\n*   交互式应用程序监听控制台输入。`d`（向下）或 `n`（下一个）将向 `ResultSet` 填充下一行，`u`（向上）或\
  \ `p`（上一个）将填充上一行。输入后，将输出海盗的呼号（name）；不需要其他细节。\n*   考虑到 `next()` 无法在最后一行之后跳转，且 `previous()`\
  \ 无法在第一行之前跳转。\n\n### 海盗仓库 ★★\n\n每个主要的应用程序都以某种方式依赖外部数据。从领域驱动设计（DDD）的角度来看，有一个 `repository`repository）的概念。仓库提供了\
  \ `CRUD 操作`：创建、读取、更新和删除。仓库是业务逻辑和数据存储之间的中间层。Java 程序应该只与对象交互，而仓库将 Java 对象映射到数据存储，反之，将原生数据（例如关系型数据库中的）转换为\
  \ Java 对象。在理想情况下，业务逻辑完全不知道 Java 对象是以什么格式存储的。Java 术语中的 Entity-Bean。即实体 Bean。\n\n\
  **com/tutego/exercise/jdbc/PirateRepositoryDemo.java**\n\n```java\nrecord Pirate(\n\
  \    Long id,\n    String nickname,\n    String email,\n    int swordLength,\n \
  \   LocalDate birthdate,\n    String description\n) { }\n```\n\n业务逻辑通过仓库检索或写入数据。这些操作中的每一个都由一个方法表示。每个仓库看起来略有不同，因为业务逻辑想要从数据存储中检索或向其写回不同的信息。\n\
  \n任务：在建模应用程序时，发现需要一个 `PirateRepository`，并且必须提供三个方法：\n*   `List<Pirate> findAll()`：返回数据库中所有海盗的列表。\n\
  *   `Optional<Pirate> findById(long id)`：使用 ID 返回海盗，如果没有该 ID 的海盗，则返回 `Optional.empty()`。\n\
  *   `Pirate save(Pirate)`：保存或更新海盗。如果海盗没有主键（即 `id == null`），则应使用 SQL `INSERT` 将海盗写入数据库。如果海盗具有主键，则说明海盗已经存储在数据库中，此时\
  \ `save(…)` 方法必须使用 SQL `UPDATE`。`save(…)` 方法返回一个始终带有键的 `Pirate` 对象。开发完 `PirateRepository`\
  \ 后，应该实现以下操作：\n\n**com/tutego/exercise/jdbc/PirateRepositoryDemo.java**\n\n```java\n\
  PirateRepository pirates = new PirateRepository(\"jdbc:h2:./pirates-dating\");\n\
  pirates.findAll().forEach(System.out::println);\nSystem.out.println(pirates.findById(1L));\n\
  System.out.println(pirates.findById(-11L));\nPirate newPirate = new Pirate(null,\
  \ \"Bachelors Delight\", \"Gleece@Fortune.firm\", 15, LocalDate.of(1972, 8, 13),\
  \ \"Best Sea\");\nPirate savedPirate = pirates.save(newPirate);\nSystem.out.println(savedPirate);\n\
  Pirate updatedPirate = new Pirate(savedPirate.id(), savedPirate.nickname(), savedPirate.email(),\
  \ savedPirate.swordLength() + 1, savedPirate.birthdate(), savedPirate.description());\n\
  pirates.save(updatedPirate);\npirates.findAll().forEach(System.out::println);\n\
  ```\n\n### 查询列 ★\n\n通常，在 Java 程序中，数据库的架构是已知的，查询可以访问列。但在某些查询中列是未知的。执行查询后，JDBC 可以请求\
  \ `ResultSetMetaData`，它提供了关于列的总数和数据类型的信息。\n\n任务：\n*   编写方法 `List<Map<String, Object>>\
  \ findAll()`。列表中的每个 `Map` 对象包含列名与该列内容之间的关联。\n*   执行 SQL `SELECT * FROM Pirate`。\n\
  \n## 解决方案\n\n### 查询所有注册的驱动\n\n**com/tutego/exercise/jdbc/DriverInfo.java**\n\n```java\n\
  Collections.list(DriverManager.getDrivers()).forEach(\n    driver -> System.out.println(driver.getClass().getName())\n\
  );\n```\n\n静态方法 `DriverManager.getDrivers()` 返回一个 `Enumeration<Driver>`。由于我们倾向于手动运行\
  \ `Enumeration`，`Collections.list(…)` 有助于将元素放入列表中。列表是迭代的，因此可以使用 `Consumer` 简洁地遍历所有已安装的驱动并输出类名。\n\
  \n输出将是：\n\n```\norg.h2.Driver\n```\n\n![图标：圆形内的信息符号](img/Icon_01.jpg) 如果此时输出为空，说明存在错误，后续程序无法工作，因为缺少\
  \ H2 驱动。在这种情况下，应重新检查依赖项。\n\n### 构建数据库并执行 SQL 脚本\n\n**com/tutego/exercise/jdbc/CreateTable.java**\n\
  \n```java\nfinal String filename = \"create-table.sql\";\nString sql;\ntry (var\
  \ inputStream = CreateTable.class.getResourceAsStream(filename)) {\n    sql = new\
  \ String(inputStream.readAllBytes(), StandardCharsets.UTF_8);\n} catch (Exception\
  \ e) {\n    return;\n}\n\nString jdbcUrl = \"jdbc:h2:./pirates-dating\";\ntry (Connection\
  \ connection = DriverManager.getConnection(jdbcUrl);\n      Statement statement\
  \ = connection.createStatement()) {\n    statement.execute(sql);\n} catch (SQLException\
  \ e) {\n    e.printStackTrace();\n}\n```\n\n为了让 Java 从类路径加载 SQL 文件，对于任何 Maven 项目，将其放在\
  \ *src/main/resources* 文件夹中。与其将 SQL 文件放在根目录，不如放在与类相同的目录下。在建议的解决方案中，类的全限定名为 `com.tutego.exercise.jdbc.CreateTable`，这意味着\
  \ *create-table.sql* 位于对称目录 *src/main/resources/com/tutego/exercise/jdbc/create-table.sql*。\n\
  \n\n\n\n从类路径访问资源是通过 `.class.getResourceAsStream(…)` 完成的，在我们的案例中，不需要关注类加载器；如果 Java\
  \ 程序以其他方式从类路径加载资源，则可能需要。当使用 `getResourceAsStream(…)` 时，程序将接收一个 `InputStream`，如果未找到资源则返回\
  \ `null`。如果文件不存在，将直接抛出 `NullPointerException`。程序应当相应地处理此。\n\n`InputStream` 类有一个\
  \ `readAllBytes()` 方法，我们可以将字节数组传递给 `String` 的构造函数，从而获取文件内容。\n\n加载 SQL 脚本后，可以对其执行。建立数据库连接并请求一个\
  \ `statement`。`Statement` 对象提供了 `execute(String)` 方法，它可以执行任意的 SQL。该方法很少被使用，因为通常返回值是有相关的，例如修改的行数，或者在\
  \ `SELECT` 语句的情况下的结果。\n\nJDBC API 通过 `SQLException` 报告错误，这是一个受检异常。在建议的解决方案中，捕获了该异常并在命令行上打印错误。JDBC\
  \ 中的异常处理要复杂一些，因为 `SQLException` 对象可能包含链中的其他异常。此外，`SQLException` 对象包含一个记录准确错误的状态码。以下建议的解决方案在某种程度上是简化，因为它们没有处理\
  \ `SQLException` 的 `catch` 块；相反，异常通过 `throws` 传递给方法调用者。\n\n### 向数据库插入数据\n\n**com/tutego/exercise/jdbc/InsertData.java**\n\
  \n```java\nString jdbcUrl = \"jdbc:h2:./pirates-dating\";\ntry ( Connection connection\
  \ = DriverManager.getConnection( jdbc Url );\n      Statement statement = connection.createStatement()\
  \ ) {\n\n  String sql1 =\n      \"INSERT INTO Pirate \" +\n      \"(nickname, email,\
  \ swordlength, birthdate, description) \" +\n      \"VALUES ('CiaoCiao', 'captain@goldenpirate.faith',\
  \ 18, \" +\n      \"DATE '1955-11-07', 'Great guy')\";\n  statement.executeUpdate(\
  \ sql1 );\n\n  String sql2 =\n      \"INSERT INTO Pirate \" +\n      \"(nickname,\
  \ email, swordlength, birthdate, description) \" +\n      \"VALUES ('lolalilith',\
  \ 'mefix@bumblebee.space', 12, \" +\n      \"DATE '1973-07-20', 'I'm 99% perfect')\"\
  ;\n  int rowCount = statement.executeUpdate( sql2, Statement.RETURN_GENERATED_KEYS\
  \ );\n  if ( rowCount != 1 )\n    throw new IllegalStateException( \"INSERT didn't\
  \ return a row count of 1\" );\n\n  ResultSet generatedKeys = statement.getGeneratedKeys();\n\
  \  if ( generatedKeys.next() )\n    System.out.println( generatedKeys.getLong( 1\
  \ ) );\n}\n```\n\n每当执行 `INSERT`、`UPDATE` 或 `DELETE` 等 SQL 语句时都会使用 `executeUpdate(…)`。`executeUpdate(…)`\
  \ 的第一个变体获取 SQL 字符串并执行它。在第二次调用 `executeUpdate(…)` 时，第一个参数是 `Statement.RETURN_GENERATED_KEYS`，它告诉数据库传递生成的键值。\n\
  \n通过第二次 `executeUpdate(…)`，程序还记录了返回值，该值反映了修改记录的数量；如果 SQL 语句没有返回，则为 `0`。如果我们示例中的\
  \ `INSERT` 插入了一条新记录，那么返回值将为 `1`，我们可以将其作为确认。\n\n返回值并不是生成的键。它不可能是键，因为键也可以是字符串（例如），而且\
  \ `executeUpdate(…)` 的返回类型始终只是 `int`。生成的键通过第二个语句 `getGeneratedKeys()` 通过 `Statement`\
  \ 对象获取。该方法返回一个 `ResultSet`，正如我们之后在 `SELECT` 语句中看到的那样。`next()` 方法确定是否有另一行，并用信息填充\
  \ `ResultSet`，其中第一列包含 `long` 类型的生成主键。如果 `next()` 返回 `false`，则没有可查询的键。\n\n### 以批量模式向数据库插入数据\n\
  \n**com/tutego/exercise/jdbc/BatchInsert.java**\n\n```java\nString jdbcUrl = \"\
  jdbc:h2:./pirates-dating\";\ntry ( Connection connection = DriverManager.getConnection(\
  \ jdbcUrl ) ) {\n  connection.setAutoCommit( false );\n\n  String sqlTemplate =\
  \ \"INSERT INTO Pirate \" +\n      \"(nickname, email, swordlength, birthdate, description)\
  \ \" +\n      \"VALUES (%s)\";\n\n  String[] values = {\n    \"anygo\", \"amiga_anker@throat.adult\"\
  , 1,\n    \"DATE '2000-05-21', 'Living the dream'\",\n    \"SweetSushi\", \"muffin@berta.bar\"\
  , 1,\n    \"DATE '1952-04-03', 'Where all the bad boys?\",\n    \"Loops\", \"whiletrue@deavis.camp\"\
  , 16,\n    \"DATE '1965-05-11', 'Great guy'\"\n  };\n\n  try ( Statement statement\
  \ = connection.createStatement() ) {\n    for ( String value : values )\n      statement.addBatch(\
  \ String.format( sqlTemplate, value) );\n\n    int[] updateCounts = statement.executeBatch();\n\
  \    connection.commit();\n    System.out.println( Arrays.toString( updateCounts\
  \ ) );\n  }\n}\n```\n\n变量 `sqlTemplate` 包含一个格式化字符串，稍后可以从中注入任意的 `VALUES`。通过扩展 `for`\
  \ 循环，程序遍历数组条目并将 SQL 模板与数据连接。生成的字符串被传递给 `addBatch(…)`。`executeBatch(…)` 方法执行收集的 SQL，返回值是一个数组，其元素数量与执行的\
  \ SQL 语句数量完全一致。数组中的单元格包含修改的行数，正如我们之前在 `executeUpdate(…)` 方法中看到的那样。\n\n建议的解决方案有所不同；它重置了自动提交模式。默认情况下，JDBC\
  \ 驱动将它发送的每个 SQL 语句放入事务块。对于批量处理，不确定整个批量、部分还是每个 SQL 语句是在事务中进行的。Javadoc 写道：\n\n当发生错误且自动提交为\
  \ true 时，`executeBatch` 的提交行为由实现定义。\n\n在建议的解决方案中，批量应该在事务中。为了实现这一点，必须关闭自动提交。通过 `executeBatch()`\
  \ 提交后通过 `commit()` 完成事务。如果事务成功且没有异常，所有语句都将提交。\n\n### 使用 Prepared Statements 插入\n\
  \n**com/tutego/exercise/jdbc/PreparedInsert.java**\n\n```java\nString preparedSql\
  \ = \"INSERT INTO Pirate \" +\n      \"(nickname, email, swordlength, birthdate,\
  \ description) \" +\n      \"VALUES (?, ?, ?, ?)\";\n\nString jdbcUrl = \"jdbc:h2:./pirates-dating\"\
  ;\ntry ( Connection connection = DriverManager.getConnection( jdbcUrl );\n     \
  \ PreparedStatement stmt = connection.prepareStatement( preparedSql ) ) {\n\n  connection.setAutoCommit(\
  \ false );\n\n  List<String[]> data = Arrays.asList(\n    new String[]{\"jacky overflow\"\
  , \"bullet@jenbeard.red\", \"17\", \"1976-12-17\", \"If love a crime\"},\n    new\
  \ String[]{\"IvyIcon\", \"array.field@graceobool.cool\", \"12\", \"1980-06-12\"\
  , \"U&I\"},\n    new String[]{\"Lulu De Sea\", \"arielle@dirtyanne.fail\", \"13\"\
  , \"1983-11-24\", \"You can be my prince\"}\n  );\n\n  for ( String[] elements :\
  \ data ) {\n    stmt.setString( /* nickname */ 1, elements[0] );\n    stmt.setString(\
  \ /* email */ 2, elements[1] );\n    stmt.setInt( /* swordlength */ 3, Integer.parseInt(elements[2])\
  \ );\n    stmt.setDate( /* birthdate */ 4, Date.valueOf(elements[3]) );\n    stmt.setObject(\
  \ /* description */ 5, elements[4] );\n    stmt.executeUpdate();\n  }\n\n  connection.commit();\n\
  }\n```\n\n\n\n\n使用 `PreparedStatement` 的步骤始终都是相同的：首先构建一个 `PreparedStatement`，后续操作将始终使用它。不同的\
  \ `set(...)` 方法填充预编译 SQL 语句中的占位符。每个 `?` 都通过从 1 开始的索引来标识。例如，`setString(1, …)` 将海盗的代号分配给第一个问号。其顺序完全取决于问号的顺序，而不是列的顺序。在我们的\
  \ SQL 语句中，并没有出现 `id` 列。\n\n在填充完每个 `?` 后，通过 `executeUpdate()` 发送准备好的语句。也可以查询自动生成的键；我们将在稍后的任务中回到这一部分。\n\
  \n所有操作都再次在事务块中执行，因此再次关闭自动提交模式，并在最后通过 `commit()` 确认事务。\n\n## 请求数据\n\n**com/tutego/exercise/jdbc/Select.java**\n\
  \n```java\nString sql = \"SELECT nickname, swordlength, birthdate FROM Pirate\"\
  ;\nString jdbcUrl = \"jdbc:h2:./pirates-dating\";\ntry ( Connection connection =\
  \ DriverManager.getConnection( jdbcUrl );\n      Statement statement = connection.createStatement();\n\
  \      ResultSet resultSet = statement.executeQuery( sql ) ) {\n\nwhile ( resultSet.next()\
  \ ) {\n    String nickname = resultSet.getString( /* nickname column */1 );\n  \
  \  int swordlength = resultSet.getInt( \"swordlength\" );\n    Date birthdate =\
  \ resultSet.getDate( \"birthdate\" );\n    System.out.printf( \"%-20s%-20s%10d%n\"\
  ,\n      nickname,\n      birthdate.toLocalDate().format(\n          DateTimeFormatter.ofLocalizedDate(FormatStyle.LONG)\
  \ ),\n      swordlength );\n  }\n}\n```\n\n`Statement` 对象的 `execute(...)` 方法返回不同的结果类型。在\
  \ `executeQuery(...)` 的情况下，结果是一个 `ResultSet`。该对象允许访问行数据。`ResultSet` 始终只包含一行信息。调用\
  \ `next()` 方法会在结果集的下一行上设置一种游标，并返回一个布尔值（`boolean`，指示是否可以读取下一行。如果 `next()` 返回 `true`，则\
  \ `ResultSet` 包含该行的信息。\n\n可以使用两种不同的方法读取列的内容：使用列索引（SQL 中的索引始终从 1 开始）或使用列名。还有不同的 `get(...)`\
  \ 方法可以进行类型转换。对于所有的 SQL 数据类型，都有相应的 Java 方法为我们相关的 Java 类型。例如，`getString(...)` 方法为文本列返回一个\
  \ `String` 对象。JDBC 驱动程序执行各种转换，因此例如 `getString(...)` 适用于任何 SQL 列类型。Java 在 `java.sql`\
  \ 包中提供了三种用于 SQL 日期和时间值的自有数据类型：`Date`、`Time`（时间）和 `Timestamp`（日期和时间）。这些数据类型允许转换为\
  \ Java Date-Time API 的类型。`getDate(...)` 返回一个 `java.sql.Date` 对象，通过 `toLocalDate()`\
  \ 可以将其转换为已知的 `LocalDate`，并使用常用的 API 进行进行格式化。\n\n## 在 ResultSet 中交互式滚动\n\n**com/tutego/exercise/jdbc/ScrollableResultSet.java**\n\
  \n```java\nint NICKNAME_COLUMN = 2;\nString sql = \"SELECT * FROM Pirate ORDER BY\
  \ nickname\";\nString jdbcUrl = \"jdbc:h2:./pirates-dating\";\ntry ( Connection\
  \ connection = DriverManager.getConnection( jdbcUrl );\n      Statement statement\
  \ = connection.createStatement(\n                              ResultSet.TYPE_SCROLL_SENSITIVE,\n\
  \                              ResultSet.CONCUR_READ_ONLY );\n      ResultSet srs\
  \ = statement.executeQuery( sql ) ) {\n\n  if ( srs.last() )\n    System.out.printf(\
  \ \"%d rows\", srs.getRow() );\n\n  srs.absolute( 1 );\n  System.out.println( srs.getString(\
  \ NICKNAME_COLUMN ) );\n\n  for ( String input;\n      !(input = new Scanner( System.in\
  \ ).next()).equals(\"q\"); ) {\n    switch ( input.toLowerCase() ) {\n      case\
  \ \"u\", \"p\" -> {\n        if ( srs.isFirst() )\n          System.out.println(\
  \ \"Already first\" );\n        else\n          srs.previous();\n      }\n     \
  \ case \"d\", \"n\" -> {\n        if ( srs.isLast() )\n          System.out.println(\
  \ \"Already last\" );\n        else\n          srs.next();\n      }\n    }\n   \
  \ System.out.println( srs.getString( NICKNAME_COLUMN ) );\n }\n```\n\n在移动 `ResultSet`\
  \ 之前，必须正确初始化 `Statement` 对象：\n\n```java\ncreateStatement( ResultSet.TYPE_SCROLL_SENSITIVE,\
  \ ResultSet.CONCUR_READ_ONLY );\n```\n\nJavadoc 将参数命名为 `resultSetType` 和 `resultSetConcurrency`。这些常量源自\
  \ `ResultSet`，其中 `TYPE_SCROLL_SENSITIVE` 配置请求允许在 `ResultSet` 中自由移动游标。并不是每个数据库和数据库驱动都支持此功能，因此可能会抛出\
  \ `SQLFeatureNotSupportedException`。\n\n如果我们成功构建了 `Statement` 对象，就可以使用 `SELECT`\
  \ 语句来构建 `ResultSet`。事实上，关于元素总数的第一个问题就可以通过移动游标来实现。如果我们调用 `ResultSet` 对象的 `last()`\
  \ 方法，它会将游标设置为最后一个元素。`getRow()` 方法随后返回当前行（在我们案例中是即记录的数量）。调用 `absolute(1)` 将游标设置回第一行。`ResultSet`\
  \ 始终填充当前数据；因此，当我们访问列名时，获取的是当前游标所在行的内容。\n\n对于交互式使用，`Scanner` 帮助处理输入。循环执行，直到用户不按下\
  \ `q`（退出）。对于 `u` 或 `p`，用户想要向上移动游标。这可以通过 `isFirst()` 进行检查。对于 `d` 或 `n`，有类似的测试；游标可以通过\
  \ `next()` 移动到下一行，除非已经在最后一行。\n\n## 海盗仓库\n\n在开始实际实现之前，我们应该考虑可能的异常。尽管任何 SQL 查询都应该成功，但通过\
  \ JDBC API 的查询都会返回麻烦的检查异常。此外，仓库应该隐藏存储技术，而 `SQLException` 并不友好。所选解决方案引入了一个新类 `DataAccessException`：\n\
  \n**com/tutego/exercise/jdbc/PirateRepositoryDemo.java**\n\n```java\nclass DataAccessException\
  \ extends RuntimeException {\n  public DataAccessException( Throwable cause ) {\
  \ super(cause); }\n  public DataAccessException( String message ) { super(message);\
  \ }\n}\n```\n\n`DataAccessException` 是一个包装每个异常的运行时异常。在内部，我们的仓库方法将捕获 `SQLException`\
  \ 并将其转换为 `DataAccessException`。\n\n仓库更为复杂，因此我们在第一部分处理类型声明、常量和构造函数，然后在后续步骤中处理具体的方法。\n\
  \n**com/tutego/exercise/jdbc/PirateRepository.java**\n\n```java\nclass PirateRepository\
  \ {\n\n  private static final String SQL_SELECT_ALL =\n    \"SELECT id, nickname,\
  \ email, swordlength, birthdate, description \" +\n    \"FROM Pirate\";\n  private\
  \ static final String SQL_SELECT_BY_ID =\n    \"SELECT id, nickname, email, swordlength,\
  \ birthdate, description \" +\n    \"FROM Pirate WHERE id=?\";\n  private static\
  \ final String SQL_INSERT =\n    \"INSERT INTO Pirate (nickname, email, swordlength,\
  \ birthdate, description) \" +\n    \"VALUES (?, ?, ?, ?, ?)\";\n  private static\
  \ final String SQL_UPDATE =\n    \"UPDATE Pirate \" +\n    \"SET nickname=?, email=?,\
  \ swordlength=?, birthdate=?, description=? \" +\n    \"WHERE id=?\";\n\n  private\
  \ final String jdbcUrl;\n\n  public PirateRepository( String jdbcUrl ) {\n    this.jdbcUrl\
  \ = jdbcUrl;\n  }\n  // ...\n}\n```\n\n\n\n`PirateRepository` 类为 SQL 语句声明了不同的常量。我们需要一个\
  \ SQL 语句分别用于：查询所有海盗、根据给定的 ID 查询特定海盗、插入新海盗以及更新现有的海盗。只有查询所有海盗的第一条 SQL 语句不使用占位符。否则，SQL\
  \ 字符串稍后将在 `PreparedStatement` 中使用。\n\n程序没有为列声明任何常量；每个索引在代码中都有了说明。\n\n构造函数接收 JDBC\
  \ URL 并将其存储在属性中，以便后续各个方法可以到此数据源建立新连接。如果标识符无效，稍后将抛出异常；可以尽早进行 `null` 测试。\n\n我们已经在之前的任务中实现了各个方法的核心部分，因此\
  \ JDBC API 并不陌新。\n\n### 对于第一个方法 `findAll()`：\n\n**com/tutego/exercise/jdbc/PirateRepositoryDemo.java**\n\
  \n```java\npublic List<Pirate> findAll() {\n  try ( Connection connection = DriverManager.getConnection(\
  \ jdbcUrl );\n        Statement  statement = connection.createStatement();\n   \
  \     ResultSet  resultSet = statement.executeQuery( SQL_SELECT_ALL ) ) {\n    List<Pirate>\
  \ result = new ArrayList<>();\n    while ( resultSet.next() )\n      result.add(\
  \ mapRow( resultSet ) );\n    return result;\n  }\n  catch ( SQLException e ) {\n\
  \    throw new DataAccessException( e );\n}\n```\n`Statement` 构建后，选取了所有记录。`while`\
  \ 循环遍历结果集并调用其私有方法 `mapRow(…)`，该方法将 `ResultSet` 中的行转换为 `Pirate` 对象。结果被放入列表中，当游标到达结果集末尾时，返回列表。\n\
  \n**com/tutego/exercise/jdbc/PirateRepositoryDemo.java**\n\n```java\nprivate static\
  \ Pirate mapRow( ResultSet resultSet ) throws SQLException {\n  return new Pirate(\
  \ resultSet.getLong( /* id */              1 ),\n                    resultSet.getString(\
  \ /* nickname */      2 ),\n                    resultSet.getString( /* email */\
  \          3 ),\n                    resultSet.getInt( /* sword */          4 ),\n\
  \                    resultSet.getDate( /* birthdate */      5 ).toLocalDate(),\n\
  \                    resultSet.getString( /* description */  6 );\n}\n```\n\n`mapRow(…)`\
  \ 通过已知方法 `getLong(…)`、`getString(…)`、`getInt(…)` 和 `getDate(…)` 读取列，并将赋值给 `Pirate`\
  \ 构造函数。`Pirate` 不使用 `Date` 类型，因此 `toLocalDate()` 将其转换为 `LocalDate` 对象。`findById(…)`\
  \ 方法也使用了 `mapRow(…)`。\n\n**com/tutego/exercise/jdbc/PirateRepository.java**\n\n\
  ```java\nOptional<Pirate> findById( long id ) {\n  try ( Connection connection =\
  \ DriverManager.getConnection( jdbcUrl );\n        PreparedStatement stmt = connection.prepareStatement(SQL_SELECT_BY_ID)\
  \ ) {\n    stmt.setLong( 1, id );\n    ResultSet resultSet = stmt.executeQuery();\n\
  \    return resultSet.next() ? Optional.of( mapRow( resultSet ) ) : Optional.empty();\n\
  \  }\n  catch ( SQLException e ) {\n    throw new DataAccessException( e );\n  }\n\
  }\n```\n构建 `PreparedStatement` 对象后，发送 SQL 查询并评估 `ResultSet`。有两种情况：`ResultSet` 可能有一个结果，也可能。如果没有结果，说明没有该\
  \ ID 的海盗，返回 `Optional.empty()`。然而，如果 `next()` 返回 `true`，`mapRow(…)` 会从 `ResultSet`\
  \ 构建一个 `Pirate` 对象，该对象进入 `Optional` 并返回。\n\n`save(…)` 方法需要根据已设置的 ID 检测是更新记录还是重新写入。\n\
  \n**com/tutego/exercise/jdbc/PirateRepositoryDemo.java**\n\n```java\npublic Pirate\
  \ save( Pirate pirate ) {\n  try ( Connection connection = DriverManager.getConnection(\
  \ jdbcUrl ) {\n    return pirate.id() == null ? saveInsert( connection, pirate )\
  \ : saveUpdate( connection, pirate );\n  }\n  catch ( SQLException e ) {\n    throw\
  \ new DataAccessException( e );\n  }\n}\n\nprivate Pirate saveInsert( Connection\
  \ connection, Pirate pirate )\n    throws SQLException {\n  try ( PreparedStatement\
  \ stmt = connection.prepareStatement(\n                                        \
  \   SQL_INSERT,\n                                           Statement.RETURN_GENERATED_KEYS\
  \ ) {\n    stmt.setString( 1, pirate.nickname() );\n    stmt.setString( 2, pirate.email()\
  \ );\n    stmt.setInt(  3, pirate.swordLength() );\n    stmt.setDate(  4, Date.valueOf(\
  \ pirate.birthdate() ) );\n    stmt.setObject( 5, pirate.description() );\n    stmt.executeUpdate();\n\
  \n    ResultSet keys = stmt.getGeneratedKeys();\n    if ( keys.next() )\n      return\
  \ new Pirate( keys.getLong( 1 ),pirate.nickname(),\n        pirate.email(), pirate.swordLength(),\n\
  \        pirate.birthdate(), pirate.description() );\n    throw new DataAccessException(\n\
  \      \"Could not retrieve auto-generated key for \" + pirate );\n  }\n}\n\nprivate\
  \ Pirate saveUpdate( Connection connection, Pirate pirate )\n    throws SQLException\
  \ {\n  try ( PreparedStatement stmt = connection.prepareStatement( SQL_UPDATE )\
  \ {\n    stmt.setString( 1, pirate.nickname() );\n    stmt.setString( 2, pirate.email()\
  \ );\n    stmt.setInt(  3, pirate.swordLength() );\n    stmt.setDate(  4, Date.valueOf(\
  \ pirate.birthdate() ) );\n    stmt.setObject( 5, pirate.description() );\n    stmt.setLong(\
  \  6, pirate.id() ); // UPDATE Pirate SET...WHERE id=?\n    stmt.executeUpdate();\n\
  \    return pirate;\n  }\n}\n```\n\n`if` 语句正是在检查此情况。如果 `id` == `null`，内部方法 `saveInsert(…)`\
  \ 负责插入新记录，否则 `saveUpdate(…)` 更新该行。两个方法都返回一个 `Pirate` 对象，这也是 `save()` 的返回值。\n\n`saveInsert(…)`\
  \ 和 `saveUpdate(…)` 都与 `PreparedStatement` 工作，其中 `saveInsert(…)` 需要通过请求生成键来多做一些工作。由于\
  \ `Pirate` 对象是不可变的，因此会创建一个设置了 ID 的新 `Pirate` 对象。`saveUpdate(…)` 返回传入的 `Pirate` 对象。\n\
  \n### 查询列元数据\n\n**com/tutego/exercise/jdbc/QueryForListOfMaps.java**\n\n```java\n\
  public static List<Map<String, Object>> findAllPirates() throws SQLException {\n\
  \  String jdbcUrl = \"jdbc:h2:./pirates-dating\";\n  try ( Connection connection\
  \ = DriverManager.getConnection( jdbcUrl );\n        Statement  statement = connection.createStatement();\n\
  \        ResultSet  resultSet = statement.executeQuery( \"SELECT * FROM Pirate\"\
  \n ) ) {\n    ResultSetMetaData metaData = resultSet.getMetaData();\n\n    List<Map<String,\
  \ Object>> result = new ArrayList<>();\n    while ( resultSet.next() ) {\n     \
  \ LinkedHashMap<String, Object> map = new LinkedHashMap<>();\n      for ( int col\
  \ = 1, columns = metaData.getColumnCount(); col <= columns; col++) {\n        String\
  \ columnName = metaData.getColumnName( col );\n        map.put(columnName, resultSet.getObject(\
  \ col ) );\n      }\n      result.add( map );\n    }\n    return result;\n  }\n\
  }\n```\n\n\n\n\nDOI: [10.1201/9781003495550-13](https://doi.org/10.1201/9781003495550-13)\n\
  \nJava 开发者往往没有意识到 Java 库从操作系统中抽象了多少。几个例子：Java 会自动为路径条目设置正确的路径分隔符（`/` 或 `\\`），并自动设置操作系统的行结束符用于换行。在对控制台输入进行格式化处理和解析时，Java\
  \ 会自动回退到操作系统的设置语言。\n\nJava 库不仅在内部使用这些属性，而且所有人都可以访问它们。这些属性隐藏在许多地方，例如：\n\n*   系统属性（system\
  \ properties）。\n*   平台 MXBeans，例如通过 `getSystemCpuLoad()` 获取的 `OperatingSystemMXBean`。\n\
  *   在 `java.net.NetworkInterface` 中获取网卡和 MAC 地址（介质访问控制地址）。\n*   在 `Toolkit` 中获取屏幕分辨率。\n\
  *   在 `GraphicsEnvironment` 中获取已安装的字体。\n\n如果缺少特殊信息，Java 程序可以调用外部原生程序并与之交互，例如请求更多详细信息。本章的任务重点是系统属性以及如何调用外部程序。\n\
  \n## 前提条件\n\n*   了解如何与命令行交互。\n*   能够评估环境变量。\n*   能够启动外部程序。\n\n本章中使用的数据类型：\n\n* \
  \  `java.lang.System`\n*   `java.util.Properties`\n*   `InputStream`\n*   `Process`\n\
  *   `ProcessBuilder`\n\n## 控制台\n\nJava 程序不仅仅是算法；它们还与我们以及操作系统交互。最开始的两个语句是 `System.out.println(...)`\
  \ 和 `new Scanner(System.in).next()`——屏幕输出和控制台输入是程序与用户之间的典型接口。`System.out` 和 `System.err`\
  \ 属于 `PrintStream`，`System.in` 属于 `InputStream`。`System` 类拥有重定向这三个流的方法，例如重定向到文件。\n\
  \n### 彩色控制台输出\n\n即使在早期程序中，我们也在控制台上输出文本。然而，`System.out` 和 `System.err` 上的文本输出先显示为黑色，然后显示为红色，因此有不同的颜色。在任务中，我们想要处理如何编写彩色输出的问题。背后的解决方案是输出不仅仅是文本。有一些特殊命令可以改变控制台的颜色、移动光标、清除屏幕等。这是通过\
  \ ANSI（美国国家标准）转义序列实现的；它们以控制序列开头，即字符串：\n\n```\n\\u001B[\n```\n\n并以字符串结尾：\n\n```\n\
  m\n```\n\n`\\u001B` 是 ASCII（美国信息交换码）中的 `ESC` 字符，十进制为 27。在 Java 中，可以将转义序列轻松写入 `System.out`\
  \ 或 `System.err`，并且如 [`github.com/fusesource/jansi`](https://github.com/fusesource/jansi)\
  \ 这样的库通过常量和方法简化这一点。唯一的问题是不同的控制台并不识别所有的转义序列。默认，Windows 的 `cmd.exe` 无法识别其中任何一个。然而，其他控制台对某些颜色的支持是常见的：\n\
  \n*   黑色：`\\u001B[30m`\n*   红色：`\\u001B[31m`\n*   绿色：`\\u001B[32m`\n*   黄色：`\\u001B[33m`\n\
  *   蓝色：`\\u001B[34m`\n*   洋红色：`\\u001B[35m`\n*   青色：`\\u001B[36m`\n*   白色：`\\u001B[37m`\n\
  *   重置：`\\u001B[0m`\n\n适用于装饰：\n\n*   粗体：`\\u001B[1m`\n*   下划线：`\\u001B[4m`\n*  \
  \ 反转：`\\u001B[7m`\n\n任务：\n\n*   创建一个新类 `AnsiColorHexDumper`，并在类中放入以下常量：\n    ```\n\
  \    public static final String ANSI_RED = \"\\u001B[31m\";\n    public static final\
  \ String ANSI_GREEN = \"\\u001B[32m\";\n    public static final String ANSI_BLUE\
  \ = \"\\u001B[34m\";\n    public static final String ANSI_PURPLE = \"\\u001B[35m\"\
  ;\n    public static final String ANSI_CYAN = \"\\u001B[36m\";\n    public static\
  \ final String ANSI_RESET = \"\\u001B[0m\";\n    ```\n*   编写一个新方法 `printColorfulHexDump(Path)`，它读取给定文件并以十六进制\
  \ dump 的形式在控制台上打印。十六进制 dump 是文件以十六进制表示形式的输出，即像 `50 4B 03 04 14 00 06 00 08 00` 这样列出的的序列。\n\
  *   扩展程序，使颜色指示文件中某些字节的出现。例如，ASCII 字母可以以一种颜色出现。\n\n## 属性（Properties）\n\nJava 库不仅在内部使用这些属性，它们对所有人都是可见的。属性隐藏在许多地方，例如：\n\
