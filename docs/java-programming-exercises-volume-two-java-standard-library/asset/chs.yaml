  \ `Scanner` 时使用 `useLocale(Locale.ENGLISH)`。\n\n示例：对于上方区块，我们想要创建：\n\n```\n<svg height=\"\
  210\" width=\"500\">\n<polygon points=\"20.091612,-155.676695 23.087301,-73.643472\
  \ 21.305452,-\n71.690421 \" style=\"fill:lime;stroke:purple;stroke-width:1\" />\n\
  </svg>\n```\n\n### 使用行程长度编码进行无损字符串压缩 ★★★\n\n为了减少数据量，文件通常会被压缩。有不同的压缩算法；有些是有损的（如删除元音），另一些则像\
  \ ZIP 那样是无损的。有损压缩出现在图像中，JPEG 是一个很好的例子。根据压缩程度，图像质量会下降。在 JPEG 中，极高压缩会导致图像出现强伪影。\n\n\
  一种简单的无损压缩是行程长度编码（run-length encoding）。其思想是将相同的符号序列组合，使得只写入数字和符号。例如，GIF 图形格式就使用了这种压缩。因此，具有许多单色线的图像比每个像素颜色不同的图像要小。\n\
  \n下一个任务关于行程长度编码的。假设一个字符串由 `.`（点）和 `-`（减号）序列组成，例如：\n\n```\n--....--------..-\n```\n\
  \n为了缩短字符串长度，我们可以先写符号，后跟该符号的数量。包含 17 个字符的字符串可以缩短为以下 9 个字符的字符串：\n\n```\n-2.4-8.2-\n\
  ```\n\n## 任务\n\n1. 创建新类 `SimpleStringCompressor`。\n2. 编写静态方法 `String compress(String)`\
  \ 根据描述的算法对 `.` 和 `-` 序列进行编码：先写字符，后写数字。\n3. 编写解码器 `String decompress(String)` 解压压缩字符串。让\
  \ `decompress(compress(input))` 等于 `input`。\n\n### 扩展\n\n* 程序能够处理非数字。\n* 完善程序，如果字符恰好出现一次，则省略数字。\n\
  \n## 字符编码与 Unicode 排序算法\n\n在网络和文件系统中，一切都以字节的形式存储。一个字节可以有 256 个不同的值，但对于世界上所有的字符来说是不够的。因此，存在字符编码，它们可以用特定方式编码世界上所有的字符。字符编码因此有所不同。有时字符被映射到固定数量的字节，有时映射到不同数量的字节，或者可能某些字符完全无法被识别。Java\
  \ 支持各种字符编码，但今天最重要的字符编码是 UTF-8 编码。\n\n### 验：Unicode 字符的编码 ★\n\nUTF-8 编码的特征是什么？\n\n\
