  max:     434\naverage: 254\n```\n\n### 计算中位数\n\n`SummaryStatistics` 类型通过 `getAverage()`\
  \ 返回算术平均数。算术平均数通过将给定值的和除以值的个数计算得出。还有许多其他平均数，例如几何平均数或调和平均数。平均数在统计中经常使用，但它们存在容易受异常值影响的问题。统计经常处理中位数。中位数是中心值，即排序列表中“中间”的值。太小或太大的数字位于边缘，不包含在中位数中。如果数值个数是奇数，则存在自然的中间值。\n\
  \n* 示例 1：在列表 9, 1, 11, 12 中，中位数是 11。如果个数是偶数，中位数可以定义为两个中间数的算术平均数。\n* 示例 2：在列表 10,\
  \ 10, 12 中，中位数是 10 和 12 的算术平均数。\n\n## 任务\n\n* 给定 `double[]` 数组，编写 `median(double[])`\
  \ 方法计算中位数。\n* 使用 `DoubleStream` 处理偶数个数的数值。\n\n### 计算统计并绘制图表 ★\n\nBonny Brain 擅长数值分析，但对于图表来说，图形化表示要简单得多。她需要可视化温度数据。\n\
