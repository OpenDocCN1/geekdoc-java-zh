  \ 中返回。\n\n*   如果无法解析任何格式，则返回 `Optional.empty()`。\n\n## 建议解决方案\n\n### 应用特定国家/语言的随机数格式化\n\
  \n**com/tutego/exercise/util/RandomInEveryLocalePrinter.java**\n\n```\ndouble random\
  \ = ThreadLocalRandom.current().nextDouble(10000, 20000);\nLocale[] locales = Locale.getAvailableLocales();\n\
  for (Locale locale : locales)\nSystem.out.printf(locale, \"%.2f%n\", random);\n\
  ```\n\n解决方案由四个步骤组成：在第一部分，我们生成随机数；在第二部分，我们获取所有可用的 `Locale`；在第三部分，我们遍历 `Locale`；在第四部分，我们使用\
  \ `System.out.printf` 输出，`%.2f` 表示保留两位小数。\n\n\n\n\n\n```\nLocalDate beaufortBday\
  \ = LocalDate.of(1774, Month.MAY, 27);\n// 1.\nLocalDate beaufortBdayThisYear =\
  \ beaufortBday.withYear(Year.now().getValue());\n// 2.\nLocalDate beaufortBdayThisYear2\
  \ = LocalDate.of(LocalDate.now().getYear(),\n                                  \
  \               beaufortBday.getMonth(),\n                                     \
  \            beaufortBday.getDayOfMonth()\n);\n// 3.\nLocalDate beaufortBdayThisYear3\
  \ = LocalDate.now()\n            .withMonth(beaufortBday.getMonthValue())\n    \
  \        .withDayOfMonth(beaufortBday.getDayOfMonth());\n```\n\n对于 `LocalDate`对象的构造，建议的解决方案展示了三种变体：\n\
  \n1. 在第一种变体中，我们使用“修改方法”（wither），即带有 `with` 前缀而非 `set` 前缀的方法，它返回一个值已更改的新对象。Java 的时间数据类型是不可变的，因此没有\
  \ setter 方法。`withYear(int)` 返回一个年份已更改的 `LocalDate` 对象。对于当前年份，我们可以使用 `Year` 数据类型。静态方法\
  \ `now()` 返回当前年份，由于 `withYear(int)` 需要一个整数，因此需要在 `Year` 对象上调用 `getValue()`。\n\n\
  2. 不使用修改方法（带有 `with` 前缀并返回新对象的方法），而是使用静态工厂方法 `of(…)` 来组合一个新的 `LocalDate` 对象，通过获取当前年份并从\
  \ `beaufortBday` 中提取月份和日期。\n\n3. 在第三种变体中，我们查询 `LocalDate.now()` 获取包含日、月、年的当前日期，但通过两个修改方法先获取设置月份的\
  \ `LocalDate` 对象，然后再获取设置了日的 `LocalDate` 对象。这种变体并不是最优的，因为创建了两个临时 `LocalDate` 对象，这些对象最终会进入自动垃圾回收。\n\
  \n第二部分：\n\n**com/tutego/exercise/time/SirFrancisBeaufortBirthday.java**\n\n```\n\
  DayOfWeek dayOfWeek = beaufortBdayThisYear.getDayOfWeek();\nSystem.out.println(\
  \ dayOfWeek );\nSystem.out.println( dayOfWeek.getValue() );\nSystem.out.println(\
  \ dayOfWeek.getDisplayName( TextStyle.FULL, Locale.GERMANY ) );\n\nDateTimeFormatter\
  \ formatter =\n    DateTimeFormatter.ofPattern( \"EEEE\" /*, Locale.GERMANY */ );\n\
  System.out.println( beaufortBdayThisYear.format( formatter ) );\n```\n\n建议的解决方案展示了输出星期几的各种变体。\n\
  \n1. `LocalDate` 对象提供了各种 getter。`getDayOfWeek()` 返回枚举 `DayOfWeek`，我们得到此周几。`DayOfWeek`\
  \ 是一个枚举类型，由于所有枚举都有 `toString()` 方法，因此输出的结果例如 `WEDNESDAY`。如果需要数值，从 `DayOfWeek` 对应的\
  \ `getValue()` 将返回一个数字，例如星期三返回 `3`。\n\n2. `DayOfWeek` 提供了一个方便的方法 `getDisplayName(TextStyle\
  \ style, Locale locale)`；它返回一个用本地化语言格式化的星期几的字符串。\n\n3. 另一种变体不是通过 `DayOfWeek` 实现的，而是使用\
  \ `LocalDate` 提供的 `format(…)` 方法。这必须传递一个 `DateTimeFormatter`，如果使用模式 `EEEE`，那么它代表星期几。可以可选指定星期几的语言，如果缺失，则采用操作系统的默认语言作为默认。\n\
  \n### 查找所有的 13 号星期五\n\n让我们将解决方案分为两个部分。在开始处，应该是接口 `TemporalAdjuster` 的实现。提个一下：\n\n\
  ```\npackage java.time.temporal;\nimport java.time.DateTimeException;\n\n@FunctionalInterface\n\
  public interface TemporalAdjuster {\n  Temporal adjustInto( Temporal temporal );\n\
  }\n```\n\n通过实现 `TemporalAdjuster` 接口，我们可以提高代码的可复用性。首先，这些实现被应用于各种日期或时间对象；其次，我们可以收集这些实现，就像\
  \ Java SE 在 `TemporalAdjusters` 中提供实用的实现一样。\n\n实现获取一个时间对象（例如 `LocalDate` 或 `LocalDateTime`）并返回一个\
  \ `Temporal` 对象；它看起来像这样：\n\n**com/tutego/exercise/time/NextFridayThe13th.java**\n\
  \n```\nTemporalAdjuster nextFriday13th = date -> {\n  while (true ) {\n    date\
  \ = date.with(DayOfWeek.FRIDAY);\n    if (date.get(ChronoField.DAY_OF_MONTH) ==\
  \ 13)\n      return date;\n  }\n};\n```\n\n该函数式接口由 lambda 表达式实现，因此最后有一个变量 `nextFriday13th`。基本思路是通过\
  \ `TemporalAdjusters.next(…)` 移动到星期五并检查日期是否为 13 号。如果是，则返回日期。用法可能如下：\n\n**com/tutego/exercise/time/NextFridayThe13th.java**\n\
  \n```\nYear thisYear = Year.of(2017);\nfor (LocalDate nextDate = thisYear.atDay(1).with(nextFriday13th);\
  \ thisYear.equals(nextDate)) {\n  System.out.println(nextDate);\n}\n```\n\n它会一直运行到年份结束。详细细节如下：\n\
  - 由于输入始终是 `Year`，`atDay(1)` 将 `Year` 升级为 `LocalDate`，可以使用 `with(nextFriday13th)`，因此\
  \ `nextFriday13th` 初始化。\n- 当 `thisYear` 和 `nextDate` 不再相等时循环终止。\n- `for` 循环返回日期。\n\
  \n### 计算夜时长\n\n**com/tutego/exercise/time/AverageDuration.java**\n\n```java\nString\
  \ input = \"2024-03-12,20:20\\n2024-03-12,23:50\\n2024-04-01,01:30\";\n\nDateTimeFormatter\
  \ formatter = DateTimeFormatter.ofPattern(\"yyyy-MM-dd,HH:mm\");\nScanner scanner\
  \ = new Scanner(input).useDelimiter(\"-|n\");\nDuration totalDuration = Duration.ZERO;\n\
  \nint lines;\nfor (lines = 0; scanner.hasNext(); lines++) {\n  String start = scanner.next();\n\
  \  String end = scanner.next();\n  LocalDateTime startDateTime = LocalDateTime.parse(start,\
  \ formatter);\n  LocalDateTime endDateTime = LocalDateTime.parse(end, formatter);\n\
  \  Duration duration = Duration.between(startDateTime, endDateTime);\n  totalDuration\
  \ = totalDuration.plus(duration);\n}\nDuration averageDuration = totalDuration.dividedBy(lines);\n\
  System.out.printf(\"%d h %02d m\", averageDuration.toHours(), averageDuration.toMinutesPart());\n\
  ```\n\n解决该任务需要几个步骤。首先，程序必须从大字符串中提取所有的开始和结束值。然后，必须将字符串转换为对应的临时类型。然后，计算这些开始和结束时间之间的差并求和。最后，我们将总和除以条目，任务得以解决。\n\
  \n开始和结束时间点的检测可以通过 `Scanner` 完成。`Scanner` 初始化时使用空格作为分隔符。我们更改这一点，并设置减号和换行符作为分隔符。\n\
  \n一旦提取出字符串，将其传递给 `LocalDateTime` 类的 `parse(…)` 方法。由于我们的字符串不符合 ISO 标准，因此必须向 `parse(…)`\
  \ 传递一个 `DateTimeFormatter`。我们之前通过 `ofPattern(…` 方法构建了它，其中传递的字符串与我们用于格式化带有时间信息的模式完全对应。符号字符串\
  \ `YYYY`、`MM`、`dd` 等可以从 Javadoc 中获取。\n\n\n\n\n通过两个 `LocalDateTime` 对象，我们可以确定它们之间的差异——我们并不是手动进行计算，而是求助于\
  \ `Duration` 类。Java 日期时间 API 中有两个类用于处理时间数据类型之间的差异：`Duration` 类以秒的分数形式存储两个时间值之间的间隔，而\
  \ `Period` 则用于日期值并基于天数工作。如果需要在差异中考虑闰日，那么 `Period` 就能很好地工作；而对于 `Duration` 来说，一天正好是\
  \ 24 小时，对应于 86 400 秒。对于我们的计算来说，`Duration` 恰好适用。\n\n方便的是，可以直接使用 `between(…)` 方法构建\
  \ `Duration` 对象，你只需要传入起始值和结束值即可。像所有时间数据类型一样，`Duration` 是不可变的。为了累加差值，我们访问 `plus(…)`\
  \ 方法并将结果存回 `totalDuration` 变量中。最后，我们再增加一个变量来记录日期-时间对的总数，然后返回循环测试，检查是否有后续日期。\n\n\
  程序中可能会发生两种运行时错误：一次是因为 `String` 中的日期-时间数量为奇数，另一个当然是因为日期-时间规范的格式错误。我们没有捕获这些异常；它们会导致程序终止。\n\
  \n如果所有值都是正确的，程序将在计算平均持续时间后结束。`dividedBy(…)` 方法有助于将总累计持续时间除以出现日期-时间对的数量。随后，获取生成的\
  \ `Duration` 类型对象的小时数和分钟数，并对整个结果进行格式化。\n\n### 解析不同的日期格式\n\n该任务的挑战性在于，并没有一个统一的格式来格式每个日期，而是有不同的格式。对于一定数量的不同格式，Java\
  \ 库通过 `DateTimeFormatterBuilder` 提供了支持。通过 `appendPattern(…)` 方法可以指定模式来确定格式。你将格式放在方括号中以表示它是可选的。例如：\n\
  \n```\nDateTimeFormatter formatter = new DateTimeFormatterBuilder()\n    .appendPattern(\
  \ \"[d/M/yyy]\" )\n    .appendPattern( \"[yyyy-MM-dd]\" )\n    .parseDefaulting(\
  \ ChronoField.MONTH_OF_YEAR, YearMonth.now().getMonthValue() )\n    .parseDefaulting(\
  \ ChronoField.DAY_OF_MONTH, LocalDate.now().getDayOfMonth() )\n    .toFormatter();\n\
  ```\n\n在我们的情况下，无法使用这种配置的 `DateTimeFormatter`，因为无法表达“昨天”、“今天”或“明天”等相对信息。原则上，我们可以通过这种配置的\
  \ `DateTimeFormatter` 产生部分，但建议的解决方案采取了不同的方式。\n\n`com/tutego/exercise/time/ParseDatePattern.java`\n\
  \n```java\npublic static Optional<LocalDate> parseDate( String string ) {\n  LocalDate\
  \ now = LocalDate.now();\n\n  Collection<Function<String, LocalDate>> parsers =\
  \ List.of(\n    input -> LocalDate.parse( input, DateTimeFormatter.ofPattern( \"\
  yyyy-M-d\" ) ),\n      input -> LocalDate.parse( input, DateTimeFormatter.ofPattern(\
  \ \"d/M/yyyy\" ) ),\n      input -> LocalDate.parse( input, DateTimeFormatter.ofPattern(\
  \ \"d/M/yy\" ) ),\n      input -> input.equalsIgnoreCase( \"yesterday\" ) ? now.minusDays(\
  \ 1 ) : null,\n      input -> input.equalsIgnoreCase( \"today\" ) ? now : null,\n\
  \      input -> input.equalsIgnoreCase( \"tomorrow\" ) ? now.plusDays( 1 ) : null,\n\
  \      input -> new Scanner( input ).findAll( \"(\\\\d+) days? ago\" )\n       \
  \                       .map( matchResult -> matchResult.group( 1 ) )\n        \
  \                      .mapToInt( Integer::parseInt )\n                        \
  \      .mapToObj( now::minusDays )\n                              .findFirst().orElse(null\
  \ )\n  );\n  for ( Function<String, LocalDate> parser : parsers ) {\n    try {\n\
  \      return Optional.of(parser.apply( string ) );\n    } catch ( Exception e )\
  \ {\n      /* Ignore */\n    }\n  }\n  return Optional.empty();\n}\n```\n\n最终，我们的任务是将\
  \ `String` 转换为 `LocalDate`。但这无非是映射，我们可以在 Java 中通过数据类型 `Function` 来表示这种映射。我们可以编写一个尝试识别特定格式的\
  \ `Function`。在最好的情况下，映射有效，我们可以将 `String` 映射到 `LocalDate`；在最坏的情况下，会发生 `Exception`，或者我们让该\
  \ `Function` 返回 `null`。这种泛化处理乍看起来不寻常，原因在于它允许我们稍后收集所有的 `function` 对象并逐一尝试。在编程中，我们应该始终考虑是否可以进行泛化——从具体到通用。\n\
  \n我们可以识别出三种类型的映射：\n\n- 第一类映射尝试直接识别模式并利用 `DateTimeFormatter`。\n- 第二类函数检测所涉及的是今天、昨天还是明天。我们回退到在方法调用时初始化的局部变量\
  \ `now`。\n- 第三个 `Function` 最复杂，因为它必须检测带有指定天数的相对引用。有几个方法协同工作。`Scanner` 可以识别字符串并简单地返回天数。结果位于\
  \ `MatchResult` 中：我们提取天数规范，将其转换为整数，获取一个减去了这些天数的新 `LocalDate` 对象，并返回结果。这种映射如果模式不匹配，则返回\
  \ `null`。\n\n\n\n\n*   `java.util.concurrent.Future`\n*   `java.util.concurrent.locks.Lock`\n\
  *   `java.util.concurrent.lock.ReentrantLock`\n*   `java.util.concurrent.Semaphore`\n\
  *   `java.util.concurrent.locks.Condition`\n*   `java.util.concurrent.CyclicBarrier`\n\
  *   `java.util.concurrent.CountDownLatch`\n\n# 创建线程\n\n当 Java 虚拟机（JVM）启动时，它创建一个名为\
  \ `main` 的线程。该线程执行 `main(…)` 方法，并在之前所有的练习中都执行了我们的程序。我们想在下一个练习中改变这一点。我们想创建更多线程并让它们执行程序代码。\n\
