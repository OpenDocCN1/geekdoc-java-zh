  ## 建议方案\n\n### 构建 ASCII\n\n`com/tutego/exercise/string/PrintTable.java`\n\n```java\n\
  System.out.println(\"Dec \".repeat(6));\n\nfor (int row = 0; row < 16; row++) {\n\
  \  for (int asciiCode = 32 + row; asciiCode <= 127; asciiCode++) {\n    System.out.printf(\"\
  %3d%2s \", asciiCode, asciiCode == 127 ? \"DEL\" : Character.toString(asciiCode));\n\
  \  }\n  System.out.println();\n}\n```\n\n首先，程序写入表头，它包含 6 列。生成的表有 16 行。原则上，我们可以动态计算列数；但我们知道从\
  \ 32 开始，到 127 结束，内层循环写入所有字符。总之，外层循环在字符时结束。最后，在行尾添加一个换行符。\n\n\n\n\n\n### 对齐的输出\n\n\
  `com/tutego/exercise/string/PaidOrNotPaid.java`\n\n```java\npublic static void printList(\
  \ String[] names, boolean[] paid ) {\n\n  if ( names.length != paid.length )\n \
  \   throw new IllegalArgumentException(\n        \"Number of names and paid entries\
  \ are not the same, but \"\n        +names.length + \" and \" + paid.length );\n\
  \n  int maxColumnLength = 0;\n  for ( String name : names )\n    maxColumnLength\
  \ = Math.max( maxColumnLength, name.length() );\n\n  String format = \"%-\" + maxColumnLength\
  \ + \"s    %sp%n\";\n\n  for ( int i = 0; i < names.length; i++ )\n    System.out.printf(\
  \ format, names[ i ], paid[ i ] ? \"\" : \"not \" );\n}\n```\n\n首先，该方法检查两个数组的元素数量是否相等，如果不相等则抛出一个\
  \ `IllegalArgumentException`。如果数组为 `null`，访问 `length` 将生成预期的 `NullPointerException`。\n\
  \n由于无法预知左侧第一列有多宽，我们必须遍历所有字符串并确定最大长度。使用这个最大长度 `maxColumnLength`，我们可以构建一个格式化字符串。该格式字符串包含一个格式指定符，用于确定字符串的宽度并用空格填充。格式字符串开头有一个负号，因此它产生左对齐的字符串，并在右侧用空格填充到最大长度\
  \ `maxColumnLength`。此外，格式字符串在右侧列包含包含四个空格的间隔。\n\n右列包含 `paid` 或 `not paid`。也就是说，字符串\
  \ `paid` 总是出现，只有 `not` 单词会根据 `boolean` 值进行设置。这是通过条件运算符实现的，该运算符返回一个空字符串或字符串 `not`，作为格式化字符串的格式参数。\n\
  \n### 测验：定义正则表达式\n\n`com/tutego/exercise/string/RegexExamples.java`\n\n```java\n\
  // 正好是 10 位数字的字符串\n\nvar p1 = Pattern.compile( \"\\\\d{10}\" );\nout.println( p1.matcher(\
  \ \"0123456789\" ).matches() );     // true\nout.println( p1.matcher( \"1\" ).matches()\
  \ );              // false\nout.println( p1.matcher( \"sauma ovo\" ).matches() );\
  \      // false\n// 5 到 10 位数字和字母的字符串。\n\nvar p2 = Pattern.compile( \"\\\\w{5,10}\"\
  \ );\nout.println( p2.matcher( \"01234567\" ).matches() );      // true\nout.println(\
  \ p2.matcher( \"0\" ).matches() );              // false\nout.println( p2.matcher(\
  \ \"01234567890123\" ).matches() ); // false\n\n// 以 `.`、`!` 或 `?` 结尾的字符串，类似于句子。\n\
  \nvar p3 = Pattern.compile( \".*[.!?]$\" );\nout.println( p3.matcher( \"jes? jes!\"\
  \ ).matches() );      // true\nout.println( p3.matcher( \"ne?\" ).matches() ); \
  \            // true\nout.println( p3.matcher( \"oke.\" ).matches() );         \
  \   // true\nout.println( p3.matcher( \"sevidation\" ).matches() );      // false\n\
  // 不包含数字的字符串。\n\nvar p4 = Pattern.compile( \"\\\\D*\" );\nout.println( p4.matcher(\
  \ \"Ciao\" ).matches() );             // true\nout.println( p4.matcher( \"ia0\"\
  \ ).matches() );             // false\nout.println( p4.matcher( \"\" ).matches()\
  \ );               // true\n// 包含官方头衔，Prof., Dr., med., Dr. h.\n\nvar p5 = Pattern.compile(\
  \ \"(Prof\\.|Dr\\. med\\.|Dr\\. h\\.)\\s\" );\nout.println( p5.matcher( \"Salut\
  \ Sinjor Dr. Miles\" ).find() ); // true\nout.println( p5.matcher( \"orekta Dr.\
  \ h. Thai.\" ).find());// true\nout.println( p5.matcher( \"Megan Dr.Thai\" ).find()\
  \ );      // false\n```\n\n在最后一个示例中，目标是查找而不是完全匹配，因此使用了 `Matcher` 的 `find()` 方法。原则上，存在性测试也可以通过\
  \ `.*` 和 `matches(...)` 来构建，但与仅仅提供第一个查找相比，匹配对正则表达式引擎来说工作量稍大。\n\n### 社交媒体中的流行度\n\n\
  `com/tutego/exercise/string/Popularity.java`\n\n```java\nString text = \"\"\"\n\
  \    Make a baby #CaptainCiao\n    Hey @CaptainCiao, where is the recruitment test?\n\
  \    What is a hacker's favorite group? The Black IP's.\"\"\n\nvar pattern = Pattern.compile(\
  \ \"[#@]CaptainCiao\" );\nSystem.out.println( pattern.matcher(text).results().count()\
  \ );\n```\n\n这个任务可以用一行代码解决，因为 `Matcher` 方法 `results()` 返回一个 `Stream<MatchResult>`，而对于\
  \ `Stream` 对象，`count()` 方法决定了出现的次数。\n\n### 检测扫描值\n\n`com/tutego/exercise/string/OcrNumbers.java`\n\
  \n```java\nprivate final static String[] searches = {\n  \"000\", \"11\", \"22\"\
  , \"333\", \"44\", \"55555\", \"6\", \"77777\", \"888\", \"9999\" };\n\nprivate\
  \ static int parseOcrNumbers( String string ) {\n  String line = new Scanner(string).nextLine().replaceAll(\
  \ \"\\\\s+\", \"\");\n\n  for ( int i = 0; i < searches.length; i++ )\n    line\
  \ = line.replaceAll(searches[i], \"\" + i );\n\n  return Integer.parseInt(line);\n\
  }\n```\n\n如果我们仔细观察大数字，会很快发现每个大数字包含了数字本身。大零包含 `0`，大一包含 `1`，以此此类推。因此，我们不需要评估多个行，获取第一行即可。\n\
  \n在提取第一行后，我们可以搜索构成单数字数字的子字符串。\n\n### 请安静！消除大喊的文本\n\n`com/tutego/exercise/string/DoNotShout.java`\n\
  \n```java\npublic static String silentShouting( String string ) {\n  return Pattern.compile(\
  \ \"\\\\p{UpperCase}{3,}\" )\n    .matcher(string)\n    .replaceAll(matchResult\
  \ -> matchResult.group().toLowerCase());\n}\n```\n\n建议的解决方案分为三个步骤：构建模式对象、匹配字符串并将匹配组替换为小写字符串。正则表达式字符串必须描述大写字母序列。跨越整个\
  \ Unicode 字母表的大写字母决定了 `\\p{UpperCase}`。我们想要至少三个连续的大写字母，这由 `{3,}` 处理。是否将模式预编译在静态变量中完全取决于方法的调用频率。通常，将\
  \ `Pattern` 对象保留在内存中是一个良好的策略，因为翻译总是会消耗一些执行时间。另一方面，你引用的是一个对象，如果很少使用，就不需要。\n\n\n\n\
  \n\n```java\nprivate static final Pattern AM_PM_PATTERN =\n    Pattern.compile(\
  \ \"(?<hours>\\\\d\\\\d?)\" +    // hours\n                      \"(?::(?<minutes>\\\
  \\d\\\\d))?\"  +// minutes\n                      \"\\\\s?\" +                 \
  \         // optional whitespace\n                      \"(?<ampm>[ap])[.]?m[.]?\"\
  ,   // AM/PM\n    Pattern.CASE_INSENSITIVE );\n\npublic static String convertToMilitaryTime(\
  \ String string ) {\n  Matcher matcher = AM_PM_PATTERN.matcher( string );\n  return\
  \ matcher.replaceAll( matchResult -> {\n    int hours = Integer.parseInt( matcher.group(\
  \ \"hours\" ) );\n    int minutes = matcher.group( \"minutes\" ) == null ?\n   \
  \                   0 :\n                      Integer.parseInt( matcher.group(\
  \ \"minutes\" ) );\n    boolean isTimeInPm = \"pP\".contains( matcher.group( \"\
  ampm\" ) );\n    if ( isTimeInPm && hours < 12 ) hours += 12;\n    else if ( !isTimeInPm\
  \ && hours == 12 ) hours -= 12;\n    return String.format(\"%02d%02d\", hours, minutes);\n\
  \  } );\n}\n```\n\n该程序的核心是一个捕获时间的正则表达式。这个正则表达式由四个部分组成，在代码中也分成了四行。第一部分捕获小时，第二部分捕获分钟，第三部分是时间之间的可选空格，最后部分是\
  \ AM/PM。\n\n1. 小时由至少一个整数组成，如果例如 `1 AM`，则第二个整数是可选的。原则上讲，我们可以把表达式写得更精确一些，以便像 `99 AM`\
  \ 这样的内容不被识别，但我们在这里没有进行该检查。小时部分本身位于圆括号中，是一个名为 `?<hours>` 的组。所有的正则表达式组都可以命名，这样我们以后可以通过该名称更方便地访问它们，而无需使用分组索引。\n\
  \n2. 分钟部分是可选的，也就是说，它被包裹在圆括号中，末尾有一个问号。内部以 `?:` 开头，这是一个小型正则表达式优化，使得该组以后无法通过 API 访问。如果同时指定了小时和分钟，用冒号将它们分隔。分钟本身也是一个命名组，由两个进制数字组成。同样，我们没有对可能的有效范围进行任何检查。\n\
  \n3. 第三部分是空格，它是可选的。\n\n4. 最后部分必须捕获 AM/PM 的不同表示法。两个符号之间可以放置一个点，甚至可能错误地只跟在字母后面，例如\
  \ `A.M` 或 `AM`。为了不需要指定大小写，我们包含了一个特殊的模式标志来独立检查大小写，因此无论写 `AM`、`am`、`Am` 还是 `pM` 都没有影响。\n\
  \n`convertToMilitaryTime(String)` 方法接收带有时间信息的 `string` 作为参数。`Pattern` 对象被存储为常量，`matcher(…)`\
  \ 方法将 `Pattern` 与 `string` 连接。结果是一个 `Matcher`。这种类型可以完成 `replaceAll<MatchResult,\
  \ String> replacer` 的所有工作：该方法为我们遍历所有匹配项，调用我们的 `Function`，我们可以从 `MatchResult` 访问匹配项并将其替换为字符串。\n\
  \n关于 `Function`：首先，我们访问 `hours` 组并将其转换为整数。整数整数不会出异常，因为我们的正则表达式确保了只会出现数字。分钟的特殊之处在于它们可能是缺失的。所以，我们必须回到\
  \ `minute` 组询问它是否存在。如果不存在，我们将变量 `minutes` 赋值为 `0`；否则，我们将分钟字符串转换为整数并将其赋值给变量 `minutes`。\n\
  \n现在我们评估 `ampm` 组并声明变量 `isTimeInPm`，如果给的时间是 PM，则该变量变为 `true`。对于 AM，变量保持为 `false`。这个变量有助于转换。如果\
  \ `isTimeInPm` 为 `true`，则时间是“午后”（即下午），必须加上 12 小时。可能会出现输入 `23 PM`；在这种情况下，我们希望纠正错误而不加\
  \ 12。此外，如果小时等于 12，我们也不进行修正。下一个检查是专门针对 `12:xx` 的，它将变为 `00` 点。因此，如果 `isTimeInPm` 等于\
  \ `false`，那么它就是“上午”（即早上），我们减去 12。在设置好 `hours` 和 `minutes` 两个变量后，我们生成包含小时和分钟的字符串，并使用\
  \ `String.format(…)`，以便我们得到一位数字并用 `0` 填充的时间。这是 `Function` 的返回值。\n\n### 使用 StringTokenizer\
  \ 分割行\n\n**com/tutego/exercise/string/SplitLines.java**\n\n```java\n// String address\
  \ = \"Boots and Bootles\\n21 Pickle Street\\r24242 Douglasrendelle\";\nString address=\"\
  Doofhmirtz Evil Inc.\\nStrudelchel 4427nGimmelsump\";\nStringTokenizer lines = new\
  \ StringTokenizer(address, \"\\n\\r\");\nString name = lines.nextToken();\nString\
  \ street = lines.nextToken();\nString city = lines.nextToken();\nfinal String DEFAULT_COUNTRY\
  \ = \"Drusselstein\";\nString country = lines.hasMoreTokens() ? lines.nextToken()\
  \ : DEFAULT_COUNTRY;\n\nSystem.out.println(name + \";\" + country\n```\n\n任务的核心是\
  \ `StringTokenizer` 类，它在以下情况下非常有用：\n\n1. 需要像 `split(…)` 那样预先提取（所有）标记。\n2. 分隔符由单个字符组成，而不是字符串。\n\
  \n同样，我们创建了 `StringTokenizer` 实例，但注意的是，指定的字符不会被视为组合分隔符；它们被视为可以作为任何组合分隔符的单个字符。\n\n\
  通过 `nextToken()` 方法请求三次，由于我们不知道是否有第四行，我们使用 `hasMoreTokens()` 进行前瞻。如果有标记，我们就获取它。否则，我们选择默认的国家。\n\
  \n由于 `StringTokenizer` 是一个 `Enumeration<Object>`，原则上可以使用 `hasMoreElements()` 和 `nextElement()`，但后者的返回类型\
  \ `Object` 很麻烦。\n\n### 将句子分割单词并反转\n\n让我们从一个打印反转单词的小辅助方法开始：\n\n**com/tutego/exercise/string/PrintReverseWords.java**\n\
  \n```java\nprivate static void printWordReversed(String word) {\n  System.out.print(new\
  \ StringBuilder(word).reverse());\n  System.out.print(' ');\n}\n```\n\n字符串的反转是通过\
  \ `StringBuilder` 的 `reverse(…)` 方法完成的。然后我们将结果输出到屏幕，并用空格分隔。\n\n现在我们必须分割句子并识别单词。\n\
  \n**com/tutego/exercise/string/PrintReverseWords.java**\n\n```java\nString string\
  \ = \"erehW did eht etarap esahcrup sih kooh? tA eht dnah-dnoces pohs!\";\n\nString\
  \ pattern = \"[\\\\p{Punct}\\\\s]+\";\n\nnew Scanner(string)\n    .useDelimiter(pattern)\n\
  \    .forEachRemaining(PrintReverseWords::printWordReversed);\n\nSystem.out.println();\n\
  \nfor (String word : string.split(pattern))\n  printWordReversed(word);\n```\n\n\
  \n\n\nJava 通过 `Pattern`-`Matcher` 组合支持使用正则表达式进行拆分，两种常用的外观是 `Scanner` 和 `split(…)`\
  \ 方法。建议的解决方案中展示了这两种变体。如果匹配项数量很多，`Scanner` 总是更好的选择，因为使用 `split(…)` 方法得到的答案始终是一个包含所有单词的数组。`Scanner`\
  \ 实现了 `Iterable`，在 `forEachRemaining(…)` 中，我们为 `Consumer` 了一个辅助方法 `printWordReversed(…)`\
  \ 的方法引用，该方法会在屏幕上反向打印每个单词。\n\n### 检查数字之间的关系\n\n**com/tutego/exercise/string/RelationChecker.java**\n\
  \n```java\nprivate static boolean isValidRelation( int number1, String operator,\
  \ int number2 ) {\n  return switch ( operator ) {\n    case \">\" -> number1 > number2;\n\
  \    case \"<\" -> number1 < number2;\n    case \"=\" -> number1 == number2;\n \
  \   default -> false;\n  };\n}\n\npublic static boolean isValidRelation( String\
  \ string ) {\n  Scanner scanner = new Scanner( string );\n  int number1 = scanner.nextInt();\n\
  \n  while ( scanner.hasNext() ) {\n    String operator = scanner.next();\n    int\
  \ number2 = scanner.nextInt();\n    if ( isValidRelation( number1, operator, number2\
  \ ) )\n      number1 = number2;\n    else\n      return false;\n  }\n\n  return\
  \ true;\n}\n```\n\n实际方法 `checkRelation(String)` 获取字符串并检查关系。然而，该方法回退到其自己的私有方法 `isValidRelation(int,\
  \ String, int)`，因此我们想从该方法开始。`isValidRelation(…)` 获取一个数字、一个比较运算符和另一个数字。它检查该比较运算符与两个数字的比较是否返回真结果。如果是，则结果为\
  \ `true`；如果比较为假，结果为 `false`，这与符号位置错误的情况一样，因为我们只评估 `<`、`>` 和 `=`。\n\n`checkRelation(…)`\
  \ 方法使用传入的 `String` 构建一个 `Scanner`，现在使用 `nextInt()`、`hasNext()` 和 `next()` 的组合来处理来自\
  \ `Scanner` 的令牌。在开始处必须有一个数字，这意味着我们可以用第一个数字初始化变量 `number1`。此时数据流可能是空的，但如果 `Scanner`\
  \ 还有后续符号，那将是一个比较运算符，我们将引用它。比较运算符之后是第二个整数，我们也将其读取并存储在 `number2` 中。现在我们调用我们的方法 `isValidRelation(…)`，如果比较正常，该方法将返回\
  \ `true`。然后 `number2` 将成为新的 `number1`，因此在下一次循环中，`number2` 将被赋值下一个数字。如果 `isValidRelation(…)`\
  \ 返回 `false`，则我们可以终止该方法，因为在此时比较是虚假的。如果循环没有跳出，则说明所有比较都是正确的，该方法以 `return true` 结束。\n\
  \n### 将 A1 表示法转换为列和行\n\n**com/tutego/exercise/string/A1Notation.java**\n\n```java\n\
  private static final int NUMBER_OF_LETTERS = 26;\n\nprivate static int parseColumnIndex(\
  \ String string ) {\n  int result = 0;\n  for ( int i = 0; i < string.length();\
  \ i++ ) {\n    // 将 A..Z 映射到 1..26\n    int val = Character.getNumericValue( string.charAt(\
  \ i ) ) - 9;\n    result = NUMBER_OF_LETTERS * result + val;\n  }\n  return result;\n\
  }\n\npublic static int[] parseA1Notation( String cell ) {\n  Matcher matcher = Pattern.compile(\
  \ \"([A-Z]+)(\\\\d+)\" ).matcher( cell );\n  if ( !matcher.find() || matcher.groupCount()\
  \ != 2 )\n    return new int[]{0, 0};\n  int column = parseColumnIndex( matcher.group(1)\
  \ );\n  int row = Integer.parseInt( matcher.group(2) );\n  return new int[]{column,\
  \ row};\n}\n```\n\n让我们以任务中提到的单元格 `AA34` 例。在第一步，我们需要将列和行分开。这里的列是 `AA`，行是 `34`。然后我们需要将列\
  \ `AA` 转换为数值表示 `27`。由两个独立的方法处理这些步骤。主方法 `parseA1Notation(String)` 首先提取行和列，然后调用内部方法\
  \ `parseColumnIndex(String)`，该方法将 A1 表示法后的列转换为数值值。\n\n让我们从 `parseColumnIndex(String)`\
  \ 方法开始。我们将选取几个例子来使计算更易读。我们可以看到：\n\n*   每个字母都被转换为一个数字——`A` 到 `1`，`B` 到 `2`，直到最终的\
  \ `Z` 到 `26`。\n*   示例是一个位值系统。它与我们的十进制系统相似，但这里使用因子 `26` 作为乘数。\n\n**表 1.2** A1 表示法\n\
  \n| 符号序列 | 计算过程 | 结果 |\n| --- | --- | --- |\n| A | 1 × 2⁰ | 1 |\n| Z | 26 × 2⁰ |\
  \ 26 |\n| AA | 1 × 2¹ + 1 × 2⁰ | 27 |\n| IV | 9 × 2¹ + 2 × 2⁰ | 26 |\n| AAA | 1\
  \ × 2² + 1 × 2¹ + 1 × 2⁰ | 703 |\n\n为了让计算更易读，我们使用 *Horner 算法*。通过一个例子来说明：`W = ((23\
  \ × 26) + 4) × 26 + 5`。为了将整个内容转换为算法，我们使用 `Scanner`。\n\n### 解析带坐标的 CSV 文件\n\n\n\n\
  \n\n该文件由整数序列组成，这些序列通过分号或换行符分隔，通常由任意空白字符分隔。我们需要找到分词器，并为其提供一个仅代表这些分隔符的正则表达式。由于我们需要从文件中读取内容并使用正则表达式进行处理，`Scanner`\
  \ 类是一个很好的选择。本文建议的解决方案也是这样做的。\n\n`Scanner` 连接到一个输入流，即我们想要读取的文件。字符编码被显式设置为 UTF-8。\n\
  \n然后，使用用于分隔符的正则表达式来初始化 `Scanner`。这些分隔符通过 `Scanner` 方法 `useDelimiter(…)` 进行设置。设置\
  \ `Locale.ENGLISH` 是重要的，因为默认情况下，`Scanner` 会由操作系统预配置 `Locale`，如果该语言例如是德语，那么 `Scanner`\
  \ 将期望以逗号作为分隔符的浮点数。但源码始终是英语格式的数字。\n\n在 `Scanner` 准备就绪后，程序就可以输出。它从 SVG 容器和多形起始标签开始。`Scanner`\
  \ 方法 `hasNext()` 有助于遍历文件。当 `hasNext()` 方法返回一个标记（token）时，我们总是期望成对出现。我们可以读取第一个整数，现在必须有第二个整数。但如果\
  \ `Scanner` 无法提供新标记，则这是一个错误，我们会抛出一个异常。如果第二个数字存在，它也将被读入。该数对可以放在 SVG 容器中。\n\n在循环结束时，我们关闭多形标签并将\
  \ SVG 元素打印到屏幕上。对于输出，我们不需要关注 `append(double)` 的语言，因为 double 的格式自动为英语。\n\n### 使用行程长度编码对字符串进行无损压缩\n\
  \n`com/tutego/exercise/string/SimpleStringCompressor.java`\n\n```java\npublic static\
  \ String compress( String string ) {\n\n  if ( string.isEmpty() )\n    return \"\
  \";\n\n  char lastChar = string.charAt( 0 );\n  int  count = 1;\n  StringBuilder\
  \ result = new StringBuilder( string.length() );\n\n  for ( int i = 1; i < string.length();\
  \ i++ ) {\n    char currentChar = string.charAt( i );\n    if ( currentChar == lastChar\
  \ )\n      count++;\n    else {\n      result.append( lastChar );\n      if ( count\
  \ > 1 )\n        result.append( count );\n      count = 1;\n      lastChar = currentChar;\n\
  \    }\n  }\n\n  result.append( lastChar );\n  if ( count > 1 )\n    result.append(\
  \ count );\n\n  return result.toString();\n}\n\nprivate static CharSequence decodeToken(\
  \ String token ) {\n\n  if ( token.isEmpty() )\n    return \"\";\n\n  if ( token.length()\
  \ == 1 )\n    return token;\n\n  int length = Integer.parseInt( token.substring(\
  \ 1 ) );\n  return String.valueOf( token.charAt( 0 ) ).repeat( Math.max( 0, length\
  \ ) );\n}\n\npublic static String decompress( String string ) {\n  StringBuilder\
  \ result = new StringBuilder( string.length() * 2 );\n  Matcher pattern = Pattern.compile(\
  \ \".-\" ).matcher( string );\n\n  while ( pattern.find() )\n    result.append(\
  \ decodeToken( pattern.group() ) );\n\n  return result.toString();\n}\n```\n\n在第一步中，我们想要压缩字符串。为了实现，我们首先查询字符串是否包含任何文本；如果没有，我们很快完成了任务。\n\
  \n为了查看连续出现了多少个相同的字符，我们使用变量 `lastChar` 存储最后一个字符，以便将新字符与上一个字符进行比较。此外，我们在 `count` 中记录相同字符的数量。由于此结果是新构建的，我们添加了数据类型为\
  \ `StringBuilder` 的变量 `result`。\n\n`for` 循环遍历每个字符并将其存储在辅助变量 `currentChar` 中。现在，可能会发生两种情况：刚读取的字符\
  \ `currentChar` 可能与 `lastChar` 中的之前的字符相同，也可能是一个不同的字符。我们必须处理这种差异。初始检查确定之前观察到的字符是否匹配当前读取的字符。如果是，我们简单地增加计数器并继续循环。然而，如果新读取的字符与上一个字符不同，则压缩过程结束。我们开始将该字符写入缓冲区。然后我们处理\
  \ `count`：如果之前计算了多个相同的字符，我们将 `count` 输入到数据流中。但如果只有一个字符，根据任务要求，我们不会向缓冲区中添加 `1`。在完成字符对的处理后，将计数器重置为\
  \ `1` 是关重要的。循环几乎结束了。一旦发现新字符，我们将 `lastChar` 设置为当前的 `currentChar`。\n\n当我们完成循环时，`lastChar`\
  \ 和 `count` 中仍然有字符。因此，我们执行与之前相同的查询，如果计数器大于 `1`，则将计数器附加字符串。\n\n在解包方法中，我们回助于压缩后产生的模式。总会有字符串和数字的对，特殊情况是数对缺失。为了不让方法变得庞大，我们使用辅助方法\
  \ `decodeToken(String)`，它接收一个数对并展开它。首先，方法必须确定标记是由一个字符还是多个字符组成。如果字符串只由一个字符，它必须包含我们的符号并进入输出。如果字符串长度大于\
  \ `1`，则从第二个位置开始有编码。通过 `substring(1)` 我们提取字符串并将其转换为整数，以便 `String` 的 `repeat(int)`\
  \ 能够生成恰对应数量的字符 `token.charAt(0)`。\n\n### 测验：Unicode 编码\n\n当我们在源码中编写字符串时，我们不需要担心编码，因为可以在引号中编写许多字符。但当这些字符串被写入文件时，例如，编码就是相关的，因为其他方想要读取该文件。\n\
  \nUnicode 字符在完整范围内需要四个字节。然而，如果字符可以用一个字节编码（例如简单的 ASCII 字符），这就是浪费。因此，对 Unicode 进行编码以获得最短的表示。常见的编码是\
  \ `UTF-8` 和 `UTF-16`；它们可以表示所有 Unicode 字符。对于 `Latin-1` 则并非如此，因为 `Latin-1` 只有八字节，数十万个字符无法在\
  \ `Latin-1` 中表示。`UTF-8` 编码尽可能使用一个字节，然后使用两个字节，否则使用三个或四个字节。\n\n### 测验：不使用比较器的字符串排序\n\
  \n输出如下：\n\n`com/tutego/exercise/string/CollatorDemo.java`\n\n```java\nComparator<String>\
  \ comparator = Comparator.naturalOrder();\nSystem.out.println( comparator.compare(\"\
  a\", \"ä\") ); // < 0\nSystem.out.println( comparator.compare(\"ä\", \"z\") ); //\
  \ > 0 !!\nSystem.out.println( comparator.compare(\"n\", \"ñ\") ); // < 0\nSystem.out.println(\
  \ comparator.compare(\"ñ\", \"o\") ); // > 0 !!\n\nComparator<Object> collatorDE\
  \ = Collator.getInstance(Locale.GERMAN);\nSystem.out.println( collatorDE.compare(\"\
  a\", \"ä\") ); // < 0\nSystem.out.println( collatorDE.compare(\"ä\", \"z\") ); //\
  \ < 0\nSystem.out.println( collatorDE.compare(\"n\", \"ñ\") ); // < 0\nSystem.out.println(\
  \ collatorDE.compare(\"ñ\", \"o\") ); // < 0\n```\n\n**表 1.3** UTF8 编码的位分配\n\n|\
  \ 字节数 | 位 | 起始代码点 | 结束代码点 | 字节 1 | 字节 2 | 字节 3 | 字节 4 |\n| --- | --- | --- | ---\
  \ | --- | --- | --- | --- |\n\n\n\n\n\n| 1 | 7 | `U+0000` | `U+007F` | `0*******`\
  \ |  |  |  |\n| 2 | 11 | `U+0080` | `U+07FF` | `110*****` | `10******` |  |  |\n\
  | 3 | 16 | `U+0800` | `U+FFFF` | `1110****` | `10******` | `10******` |  |\n\n表\
  \ 1.4 Unicode 标准中某些字符及其位置\n\n| 字符 | θ | A | a | Ä | ß | ä | ñ |\n| 码点（十进制） | 48\
  \ | 65 | 97 | 196 | 223 | 228 | 241 |\n\n字符串的自然顺序是字典序的，这意味着字符在 Unicode 字母表中的位置很重要。让我们用一些字符来说来说这一点。\n\
  \n从表中可以看出，数字在最前面，接着是大写字母，然后是小写字母。变音符号远在大写字母之后，并且没有排序在大写和小写字母之间。\n\n变音符号是德语中的普通字母，它们在顺序上并不在“Z”之后。标准\
  \ `DIN 5007-1` 在“字符序列排序（ABC 规则）”下描述了两种排序程序：\n\n### DIN 5007，变体 1（用于单词，例如字典中）\n\n\
  * “ä”和“a”是相同的。\n* “ö”和“o”是相同的。\n* “ü”和“u”是相同的。\n* “ß”和“ss”是相同的，\n\n### DIN 5007，变体\
  \ 2（姓名列表的特殊排序，例如电话簿）\n\n* “ä”和“ae”是相同的。\n* “ö”和“oe”是相同的。\n* “ü”和“ue”是相同的。\n* “ß”和“ss”是相同的。\n\
  \n其他语言也有类似的规则。字典序不支持这一点。因此，*Unicode 排序算法（Unicode Collation Algorithm）*描述了不同国家语言的排序方式。欲了解，请参阅\
  \ [`en.wikipedia.org/wiki/Unicode_collation_algorithm`](https://en.wikipedia.org/wiki/Unicode_collation_algorithm)。\n\
  \n在 Java 中提供了 `Collator` 对象。它们用 `Locale` 对象初始化。除了语言之外，还可以传递所谓的“级别”（levels）；Javadoc\
  \ 在“Collator strength value”标题下提供了更多示例。\n\n# 2 数学\n\nDOI: [10.1201/9781003495550-3](https://doi.org/10.1201/9781003495550-3)\n\
  \n整数和浮点数在第一部分练习中已经出现过；我们使用了常用的数学运算符来处理数字。但 Java 并不是对所有东西都有运算符，因此 `Math` 类提供了更多方法和常量；例如，早期我们使用过\
  \ `Math.random()`。在本章接下来的任务中，我们的重点将放在各种舍入技术上，特别是探索 `Math` 类提供的方法。此外，`java.math`\
  \ 包提供了两个可以表示任意大数字的类——这些类也有相应的任务。\n\n## 前提条件\n\n* 了解 `Math` 类的舍入方法。\n* 了解 `BigInteger`\
  \ 和 `BigDecimal`。\n\n本章使用的的数据类型：\n\n* `java.lang.Math`\n* `java.math.BigInteger`\n\
  * `java.math.BigDecimal`\n\n## Math 类\n\n`Math` 类包含了许多数学函数。查看包装类也是重要的，例如，在将数字转换为字符串或解析字符串以便最后再次获得原始类型时，需要查看\
  \ `Scanner` 或 `Formatter`。\n\n### 测验：经验法则 ★\n\n对于数值的舍入，有有不同的处理方法和不同类型的问题：\n\n* 一方面，浮点数可以转换为整数。\n\
  * 另一方面，可以减少浮点数的小位数。\n\nJava 库支持不同的转换和舍入可能性，包括：\n\n* 显式类型转换 `(int) double` → `int`。\n\
  * `Math.floor(double)` → `double`。\n* `Math.ceil(double)` → `double`。\n* `Math.round(double)`\
  \ → `long`。\n* `Math.rint(double)` → `double`。\n* `BigDecimal` 和 `setScale(..)`\
  \ → `BigDecimal`。\n* `NumberFormat` 配置了 `setMaximumFractionDigits(…)`，然后 `format(…)`\
  \ → `String`。\n* `DecimalFormat` 配置了 `setRoundingMode(…)`，然后 `format(…)` → `String`。\n\
  * 带有格式字符串的 `Formatter`，然后 `format(…)` → `String`。\n\n其中四个方法源自 `Math`，但在涉及巨大且精确的浮点数或字符串表示时，涉及到其他类。由于这些方法的结果略有不同，以下任务应该再次这些这些差异。\n\
