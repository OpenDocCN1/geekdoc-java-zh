  \ `Map<String, String>` 中。\n\n# HTML\n\nHTML 是一种重要的标记语言。Java 标准库没有支持 HTML 文档，除了\
  \ `javax.swing.JEditorPane` 提供的功能外（它可以渲染 HTML 3.2 和 CSS 1.0 的子集）。\n\n为了让 Java 程序能够正确且有效地读写\
  \ HTML 文档并读取节点，我们必须求助于（开源）库。\n\n## 使用 jsoup 加载维基百科图片 ★★\n\n流行的开源库 `jsoup` ([`jsoup.org/`](https://jsoup.org/))\
  \ 可以加载网页内容并在内存中以树的形式表示这些内容。\n\n在 POM 中包含以下依赖项：\n\n```xml\n<dependency>\n  <groupId>org.jsoup</groupId>\n\
  \  <artifactId>jsoup</artifactId>\n  <version>1.17.2</version>\n</dependency>\n\
  ```\n\n**任务：**\n\n- 学习 [`jsoup.org/cookbook/extracting-data/dom-navigation`](https://jsoup.org/cookbook/extracting-data/dom-navigation)\
  \ 和 [`jsoup.org/cookbook/extracting-data/selector-syntax`](https://jsoup.org/cookbook/extracting-data/selector-syntax)\
  \ 中的示例。\n- 从维基百科主页获取所有图片并将其保存到你的文件系统中。\n\n# 办公文档\n\n在文字处理和电子表格方面，Microsoft Office\
  \ 处于领先地位。多年来，二进制文件格式已为人知，并且相应的 Java 库用于读写。同时，处理 Microsoft Office 文档变得简单得多，因为这些文档的核心是组合成\
  \ ZIP 归档的 XML 文档。Java 的支持非常好。\n\n## 使用截图生成 Word 文件 ★★\n\n阅读 POI 的维基百科条目：[`de.wikipedia.org/wiki/Apache_POI`](https://de.wikipedia.org/wiki/Apache_POI)。\n\
