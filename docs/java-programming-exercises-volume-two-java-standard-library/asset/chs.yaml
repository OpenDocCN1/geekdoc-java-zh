  \n**图 2.1** `Fraction` 的 UML 图。\n\n## 建议的解决方案\n\n### 测验：经验法则\n\n**表 2.1** 浮点数 `d`\
  \ 的不同舍入方式对比\n\n| 数 `d` | `(INT) d` | `(INT) FLOOR(d)` | `(INT) CEILING(d)` | `ROUND(d)`\
  \ | `(INT) RINT(d)` |\n| :--- | :--- | :--- | :--- | :--- | :--- |\n| `-2.5` | `-2`\
  \ | `-3` | `-2` | `-2` | `-2` |\n| `-1.9` | `-1` | `-2` | `-1` | `-2` | `-2` |\n\
  | `-1.6` | `-1` | `-2` | `-1` | `-2` | `-2` |\n| `-1.5` | `-1` | `-2` | `-1` | `-1`\
  \ | `-2` |\n| `-1.1` | `-1` | `-2` | `-1` | `-1` | `-1` |\n| `1.1` | `1` | `1` |\
  \ `2` | `1` | `1` |\n| `1.5` | `1` | `1` | `2` | `2` | `2` |\n| `1.6` | `1` | `1`\
  \ | `2` | `2` | `2` |\n| `1.9` | `1` | `1` | `2` | `2` | `2` |\n| `2.5` | `2` |\
  \ `2` | `2` | `2` | `2` |\n\n*(注：由于原文后续部分包含大量无效重复和乱码，已根据文档逻辑在此处停止翻译。)*\n\n\n\n所提出的解决方案由两个方法组成。公共方法\
  \ `detectRoundingMode(…)` 对数组元素求和，并调用私有方法 `detectRoundingMode(double, int)` 来确定实际的舍入模式。该方法顺序将整数值与不同的舍入变体进行比较，如果匹配，则返回相应的枚举元素。如果总和与舍入后的值完全不匹配，则返回\
  \ `RoundingMode.UNKNOWN`。\n\n### 计算大整数的算术平均值\n\n`com/tutego/exercise/math/BigIntegerMean.java`\n\
  \n```java\nprivate static BigDecimal TWO = BigDecimal.valueOf( 2 );\n\npublic static\
  \ long meanExact( long x, long y ) {\n  BigInteger bigSum = BigInteger.valueOf(\
  \ x ).add( BigInteger.valueOf( y ));\n  BigInteger bigMean = bigSum.divide( BigInteger.TWO\
  \ );\n  return bigMean.longValue();\n}\n```\n\n在第一步，我们使用工厂方法 `valueOf(long)` 为参数\
  \ `x` 和 `y` 构建一个新的 `BigInteger` 类型的对象。在第二步中，构建和；在第三步中，将和除以 2。对于除法操作，我们也必须使用 `BigInteger`\
  \ 对象作为除数。由于除数是常数，解决方案定义了一个常量——`BigInteger` 类拥有 0、1 和 10 的常量，但没有 2。\n\n在对整数取平均值时，总是存在舍入的问题。两个偶数或两个奇数相加始终得到偶数，但一个偶数与一个奇数的和是奇数。如果奇数除以\
  \ 2，会有余数，问题在于向上舍入还是向下舍入、将结果舍入 0、还是向正或负无穷舍入——有很多可能性。`BigInteger` 方法 `divide(…)` 的行为类似于两个整数的除法，向\
  \ 0 舍入。\n\n结果是一个不大于 `Long.MAX_VALUE` 且不小于 `Long.MIN_VALUE` 的数字，因此通过 `longValue()`\
  \ 将 `BigInteger` 数字没有损失。\n\n### 电话数字拼接\n\n`com/tutego/exercise/math/SequentialNumbersToOneNumber.java`\n\
  \n```java\nstatic BigInteger completeNumber( int... parts ) {\n  StringBuilder bigNumber\
  \ = new StringBuilder( parts.length * 2 );\n  for ( int part : parts )\n    bigNumber.append(\
  \ part );\n\n  return new BigInteger( bigNumber.toString() );\n}\n```\n\n我们可以使用字符串或数学方法来这个任务。使用临时字符串，任务很容易解决。\n\
  \n在第一步中，我们遍历数组，逐个取出所有数字并将它们附加到 `StringBuilder` 中。如果我们假设每个数字平均由两个数字组成，我们可以估算出结果大约有多大；因此，我们使用了带有容量的\
  \ `StringBuilder` 参数构造函数。\n\n在附加所有数字后，`StringBuilder` 被转换为 `String`，并传递给 `BigInteger`\
  \ 的构造函数。在这里，字符串转换为 `BigInteger` 的实际转换开始。\n\n当然，任务也可以不使用临时 `StringBuilder` 来解决。让我们以这个调用为例：\n\
  \n```java\ncompleteNumber(123, 22, 989, 77, 9);\n```\n\n如果我们最后想创建一个值为 `12322989779`\
  \ 的 `BigInteger`，我们可以先构建包含 `123` 的 `BigInteger`，然后将该数字乘以 `100` 并加上 `22`，得到 `12322`。在下一步中，我们获取结果，乘以\
  \ `1000` 并加上 `989`。然后再次乘以 `100`，加上 `77`，将结果乘以 `10` 并加上 `9`。\n\n### 用于分数的类与截断\n\n\
  `com/tutego/exercise/math/Fraction.java`\n\n```java\nimport java.math.BigInteger;\n\
  \npublic final class Fraction extends Number implements Comparable<Fraction> {\n\
  \  public final int numerator;\n  public final int denominator;\n  public Fraction(\
  \ int numerator, int denominator ) {\n    if ( denominator == 0 )\n      throw new\
  \ ArithmeticException(\"分母不能为 0\");\n    // 分母始终为正\n    if ( denominator < 0 ) {\n\
  \      numerator = -numerator;\n      denominator = -denominator;\n    }\n\n   \
  \ // 分母为 1 的快捷处理\n    if ( denominator == 1 ) {\n      this.numerator = numerator;\n\
  \      this.denominator = 1;\n    } else {\n      // 尝试简化分数\n      int gcd = gcd(\
  \ numerator, denominator );\n      // 可能是 1，但无论如何\n      this.numerator = numerator\
  \ / gcd;\n      this.denominator = denominator / gcd;\n    }\n  }\n  private static\
  \ int gcd( int a, int b ) {\n    return BigInteger.valueOf( a )\n          .gcd(\
  \ BigInteger.valueOf( b ) )\n          .intValue();\n  }\n  public Fraction( int\
  \ value ) {\n    this( value, 1 );\n  }\n  public Fraction reciprocal() {\n    return\
  \ new Fraction( denominator, numerator );\n  }\n  public Fraction multiply( Fraction\
  \ other ) {\n    return new Fraction( Math.multiplyExact( numerator, other.numerator\
  \ ),\n                         Math.multiplyExact( denominator, other.denominator\
  \ )\n    );\n  }\n  @Override\n  public int intValue() {\n    return numerator /\
  \ denominator;\n  }\n  @Override\n  public long longValue() {\n    return (long)\
  \ numerator / denominator;\n  }\n  @Override\n  public double doubleValue() {\n\
  \    return (double) numerator / denominator;\n  }\n  @Override\n  public float\
  \ floatValue() {\n    return (float) numerator / denominator;\n  }\n  @Override\n\
  \  public int compareTo( Fraction other ) {\n    return Double.compare( doubleValue(),\
  \ other.doubleValue() );\n  }\n  @Override\n  public boolean equals( Object other\
  \ ) {\n    if ( other == this )\n      return true;\n    return other instanceof\
  \ Fraction otherFraction\n          && numerator == otherFraction.numerator\n  \
  \        && denominator == otherFraction.denominator;\n  }\n  @Override\n  public\
  \ int hashCode() {\n    return numerator + Integer.hashCode( denominator );\n  }\n\
  \  @Override\n  public String toString() {\n    return numerator == 0 ? \"0\" :\n\
  \           denominator == 1 ? \"\" + numerator :\n           numerator + \"/\"\
  \ + denominator;\n  }\n}\n```\n\n\n\n\n构造函数的最后一部分处理分数的约化。这里简要解释了在此处如何操作：我们需要最大公约数。构造函数在此处将任务委托给它的方法\
  \ `gcd(int, int)`，该方法首先为两个数字构建 `BigInteger`，然后让它计算最大公约数，最后作为整数返回。在我们的场景中，参数类型为 `int`，因此除数在任何情况下都会更小，通过\
  \ `intValue()` 从 `BigInteger` 中读取。构造函数请求最大公约数后，我们将分子和分母除以它，初始化我们的实例变量。原则上，`gcd`\
  \ 也可能是 1，因此我们不需要除法，但在这里保留了这种特殊情况的区别，因为除以 `1` 并不消耗。\n\n第二个构造函数只接收一个分子，在这种情况下分母为 `1`。我们委托给构造函数，但通常情况下我们可以自己完成存储，因为不需要对负分母进行特殊处理，且分母也不是\
  \ `0`。\n\n两个方法中的第一个 `reciprocal()` 通过将分母转换为分子并将分子转换为分母来创建一个新的 `Fraction` 对象。`multiply(…)`\
  \ 方法将其分子与传入对象的分子相乘，并对称地对分母执行相同操作。乘法会产生大数字，`int` 的取值范围可能会溢出，因此 `Math.multiplyExact(…)`\
  \ 确保结果适合一个 `int`；否则将抛出异常。\n\n下一类方法源自基类型 `Number`。我们将分子除以分母，并在不同的方法中返回结果。\n\n下一个方法\
  \ `compareTo(…)` 源自 `Comparable` 接口。我们将其简单化，计算商并将我们的商与传入的分数进行比较。\n\n在下一步中，我们重写了\
  \ `equals(…)` 和 `hashCode()` 方法。一个良好的哈希值会在分子或分母发生变化时返回一个不同的哈希值。`hashCode()` 的实现通过翻转分母的位来实现此点的。如果分子和分母所需的位数总和不超过\
  \ 32 位（`int` 的位数），我们就可以通过不同的哈希值检测到每一次变化。\n\n最后一个方法是 `toString()`。如果分子为 `0`，我们甚至不需要看分母直接返回字符串\
  \ `0`。如果分母为 `1`，我们可以只返回分子。否则，我们返回由分数线分隔的分子和分母。\n\n# 3 区域、日期和时间\n\nDOI: [10.1201/9781003495550-4](https://doi.org/10.1201/9781003495550-4)\n\
  \n在几乎所有的练习中我们都有屏幕输出，任何日常生活中写作（例如中文、西班牙语或阿拉伯语）的人可能也倾向于这种语言的程序输出。然而，在某些地方可能会出现错误的格式，例如当浮点数的小数没有被正确分隔时。小数点分隔符只是各国标准存在差异的众多例子之一：货币有时在数字前面，有时在后面；对于日期，某些国家的格式是年-月-日，另一些国家是日-月-年，然后又是月-日-年。\n\
  \n本章重点关注国际化（原则上如何使程序语言无关）和本地化（适应特定语言）的练习。毕竟，如果我们的软件要成功，它必须能够在地球上的任何地方、任何时间运行。Java\
  \ 可以轻松适应许多语言特性，我们将在练习中查看这一点，以便 Captain CiaoCiao 和 Bonny Brain 也能在任何地方开展业务，所有人都能理解他们的“语言”。\n\
  \n## 前提条件\n\n* 了解 `Locale` 类和常量，如 `Locale.US.`\n* 能够识别对特定国家格式的需求。\n* 了解时间数据类型 `LocalDate`、`LocalDateTime`、`Duration`。\n\
  \n本章使用的数据类型：\n\n* `java.util.Locale`\n* `java.time.LocalDate`\n* `java.time.LocalDateTime`\n\
  * `java.time.format.DateTimeFormatter`\n* `java.time.format.FormatStyle`\n* `java.time.format.DateTimeFormatter`\n\
  * `java.time.Duration`\n\n## 语言与国家\n\n为了让 Java 解析和格式化浮点数、日期以及翻译文本，有一种名为 `Locale`\
  \ 的数据类型表示带有可选区域的语言。我们想使用这种数据类型来解决一些练习，这些练习很好地展示了 `Locale` 无处不在。\n\n### 为随机数应用特定国家/语言格式\
  \ ★\n\nBonny Brain 正在准备一个新的邮件诈骗：比特币将以远低于市场价格的价格“出售”。它为此准备了主题行，例如如下：\n\n```\nBuy�����\U0001D48A\
  t\U0001D484оي\U0001D48F�for�just�$11,937.70�\U0001F4B0\n```\n\n当然，该团队正在策划一场全球性的诈骗，这就是根据不同国家的规则格式化数字的重要性所在。\n\
  \n`printf(…)` 方法是重载的，`String.format(…)` 也是：\n\n* 以 `Locale` 作为第一个参数。\n* 不带 `Locale`。如果没有传递\
  \ `Locale` 对象，则应用默认区域。这导致了 Java 虚拟机在假设操作系统语言为西班牙语的情况下；这种语言采用逗号作为分隔符。在英语国家，则使用点。\n\
  \n![一个女人看着一个显示比特币详情和代码的系统](img/03_01.jpg)\n\n练习：\n\n* 创建一个 10000（包含）到 12000（不包含）之间的\
  \ `double` 类型随机数；需要小数。\n* 使用 `String.format(String format, Object... args)` 方法格式化两位小数和千位分隔符的浮点数。\n\
  * 获取所有的 `Locale` 对象，并将它们作为 `String.format(Locale l, String format, Object... args)`\
  \ 方法的参数，以便浮点数在种情况下都进行本地化格式化。输出字符串。\n\n作为一个通用规则，可以认为所有实现语言依赖格式化或字符串解析的方法通常接受 `Locale`\
  \ 对象作为参数。此外可能有没有参数的语言依赖方法，但这些通常是内部查询默认语言并传递给显式 `Locale` 参数的方法。\n\n## 日期和时间类\n\n\
  乍看起来日期只由年、月、日组成。然而，你会希望应用程序接口（API）能够回答更多问题：某一天是星期几？如果一个派对从 2 月 27 日持续三天，它什么时候结束？第\
  \ 12 周什么时候开始？如果我在 2024 年 12 月 31 日 09:30 离开北京，11 小时后到达迈阿密，那里是什么时候？\n\nJava 库一直在进化，因此有多种用于日期计算类型：\n\
  \n* `java.util.Date` 自 Java 1.0 起\n* `java.util.Calendar`、`java.util.GregorianCalendar`、`java.util.TimeZone`\
  \ 自 Java 1.1 起\n* `java.time` 包自 Java 8 起，包含 `LocalDate`、`LocalTime`、`LocalDateTime`、`Duration`。\n\
  \n对于带有时间的日期，三种可能性；然而，`Date` 和 `Calendar` 自 Java 8 以后不再流行，因为它们会导致许多问题。然而，这些数据类型仍可以在许多编写示例中找到，因此本节专门训练如何使用\
  \ `java.time` 中的当前数据类型。\n\n### 使用不同语言格式化日期输出 ★\n\n\n\n\n\n9 月 19 日是“国际海盗日”的回归日。Bonny\
  \ Brain 计划举办一个派对并准备邀请函，日期需要针对 `Locale.CHINESE`、`Locale.ITALIAN` 和 `Locale.of(\"\
  th\")` 语言进行格式化；例如，德国人写作 `日.月.年`，但其他语言又是怎样的呢？\n\n## 练习\n\n*   为 9 月 19 日创建一个 `LocalDate`\
  \ 对象：\n\n```\nLocalDate now = LocalDate.of( Year.now().getValue(), Month.SEPTEMBER,\
  \ 19 );\n```\n\n*   调用 `toString()` 方法；输出是什么？\n\n*   在 `LocalDate` 上调用 `format(DateTimeFormatter.ofLocalizedDate(FormatStyle.MEDIUM))`；输出是什么？\n\
  \n*   总共有四种 `FormatStyle` 样式——尝试所有的样式。显示的是哪种模式？\n\n*   在 `DateTimeFormatter` 对象上，你可以调用\
  \ `withLocale(Locale)` 并更改语言；尝试对不同的语言进行此操作。\n\n### 弗朗西斯·博福特爵士在哪一天过生日？ ★\n\nCiaoCiao\
  \ 船长每年庆祝弗朗西斯·博福特爵士的生日，他出生于 1774 年 5 月 27 日。\n\n![展览展示了 CiaoCiao 船长坐在船上的桌旁写信，看着桌上的生日蛋糕。](img/un03_02.jpg)\n\
  \n## 练习\n\n*   给定一个带有弗朗西斯生日的 `LocalDate`：\n\n```\nLocalDate beaufortBday = LocalDate.of(\
  \ 1774, Month.MAY, 27 );\n```\n\n*   从 `beaufortBday` 开始，创建一个具有当前年份的新 `LocalDate`\
  \ 对象，其中当前年份不应硬编码，而应从系统动态获取。\n\n*   创建一个输出，显示弗朗西斯今年在周几过生日。星期几的输出形式（即数字、字符串或哪种语言）并不重要。\n\
  \n## 示例\n\n*   对于 2026 年，输出可能是：\n\n```\nWEDNESDAY\n3\nWednesday\n```\n\n### 找出所有的\
  \ 13 号星期五 ★\n\n每当 13 号星期五，CiaoCiao 船长就会感到航行不适。在这些日子，他不会出海，而是派遣 Bravius Gritty 代替。\n\
  \n## 任务\n\n*   编写一个程序，列出给定年份中所有落在 13 号的星期五。\n\n*   加分：为此编写一个 `TemporalAdjuster`，它能为\
  \ `Temporal` 对象返回下一个 13 号星期五。\n\n## 示例\n\n*   对于 1925 年，输出可能如下：\n\n```\n1925-02-13\n\
  1925-03-13\n1925-11-13\n```\n\n*   对于 2024 年：\n\n```\n2024-09-13\n2024-12-13\n```\n\
  \n### 获取卡拉 OK 之夜的平均时长 ★\n\n带有朗姆酒、跳舞和唱歌的 Karaoke 夜在船员中非常流行。派对通常持续到黎明，这打扰了 Bonny Brain，因为船员们第二天昏昏欲睡。\n\
  \n为了找出这些狂欢平均持续了多久，Bonny Brain 希望记录统计数据。她记录开始和结束时间，稍后可以计算平均值。例如，笔记上写着“2025-03-12,\
  \ 20:20 - 2025-03-12, 23:50”。\n\n## 练习\n\n*   编写一个程序评估上述格式的字符串，找到平均派对时长并打印出来。\n\n\
  *   程序不需要考虑时区、闰秒或其他特殊情况——一天可以正好是 24 小时。\n\n## 示例\n\n*   对于字符串：\n\n```\n2025-03-12,\
  \ 20:20 - 2025-03-12, 23:50\n2025-04-01, 21:30 - 2025-04-02, 01:20\n```\n\n    输出应该如下：\n\
  \n```\n3 h 40 m\n```\n\n对于时间差，`Duration` 类大有帮助。\n\n### 解析不同的日期格式 ★★★\n\n日期可以指定为绝对或相对，并且有多种方法指定日期。示例几个：\n\
  \n```\n2025-10-10\n2025-12-2\n1/3/1976\n1/3/25\nTomorrow\nToday\nYesterday\n1 day\
