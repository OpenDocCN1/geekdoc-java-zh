  \ 单词中包含的所有单词\n\nCiaoCiao 队长拦截了一封秘密信息，内容由看似无关的单词组成。经过一番思考，他意识到 `words` 中还有其他单词。\n\
  \n程序旨在找出给定单词包含哪些有效单词。可以使用互联网上的单词列表，例如 [`raw.github.com/ullenboom/english-words/master/words_alpha.txt`](https://raw.github.com/ullenboom/english-words/master/words_alpha.txt)。\n\
  \n### 任务：\n\n* 编写一个静态方法 `Collection<String> wordList(String string, Collection<String>\
  \ words)`，生成 `string` 中的所有子字符串，并返回字典 `words` 中至少包含三个字符的单词。\n\n英语字典的示例：\n\n* `wordList(\
  \ \"wristwatches\", words )` → `[wrist, wristwatch, wristwatches, rist, is, twa,\
  \ wat, watch, watches, tch, tche, hes]`\n* `abibliophobia` → `[abib, bib, bibl,\
  \ bibliophobia, pho, phobia, hob, obi, obia]`\n\n![图标: 圆圈内的信息符号。](img/Icon_01.jpg)\
  \ 一个单词文件可以转换为这样的数据结构：\n\n```\nprivate static final String WORD_LIST_URL =\n    \"\
  https://raw.githubusercontent.com/ullenboom/english-words/master/words_alpha.txt\"\
  ;\n\nprivate static Collection<String> readWords() throws IOException {\n  URL url\
  \ = URI.create(WORD_LIST_URL).toURL(); // 370,000 个单词\n  Collection<String> words\
  \ = new HashSet<>( 500_000 );\n  // 在 Java 21 中：... = HashSet.newHashSet( 400_000\
  \ );\n  try ( InputStream is = url.openStream() ) {\n    new Scanner( is ).forEachRemaining(\
  \ s -> words.add( s.toLowerCase() ) );\n  }\n  return words;\n}\n```\n\n\n\n\n\n\
  ```\nList<String> names = …;\nIterator<String> UniqueIterator = new UniqueIterator(\
  \ names.iterator( );\n```\n\n### Map 键值\n\n哈希表将键与值关联。在其他编程语言中，它们也被称为字典。Java 使用 `Map`\
  \ 接口来指定所有实现的操作。两个重要的实现是 `HashMap` 和 `TreeMap`。\n\n## 将二维数组转换为 Map ★\n\n继承自 `Collection`\
  \ 的数据类型在接受数据方面相对灵活；例如，`List` 的元素可以通过 `addAll(Collection)` 复制到 `Set` 中。数组也可以通过 `Arrays.asList(…)`\
  \ 直接作为 `Collection` 使用。\n\n`Map` 数据类型的灵活性较低；无法简单地将数组或其他 `Collection` 集合转换为 `Map`。\n\
  \n### 任务：\n\n* 编写一个方法 `Map<String, String> convertToMap(String[][])`，将一个二维数组转换为\
  \ `java.util.Map`。\n* 数组中的第一个元素应该是键，第二个元素应该是值。\n* 键要正确实现 `hashCode()` 和 `equals(…)`。\n\
  * 如果数组后面再次出现相同的键，该方法将覆盖之前的键对。\n* 键和值不能为 `null`，且必须会导致异常。\n\n### 示例：\n\n```\nString[][]\
  \ array = {\n    { \"red\", \"#FF0000\" },\n    { \"green\", \"#00FF00\" },\n  \
  \  { \"blue\", \"#0000FF\" }\n};\nMap<String, String> colorMap = convertToMap( array\
  \ );\nSystem.out.println( colorMap ); // {red=#FF0000, green=#00FF00, blue=#0000FF}\n\
  ```\n\n## 将文本转换为摩斯密码及反之 ★\n\nCiaoCiao 队长需要使用摩斯密码向远处的岛屿发送信息。摩斯密码信息由短符号长符号组成，由字符 `.`\
  \ 和 `-` 表示。\n\n将以下定义复制到新类 `Morse` 中：\n\n```\n// A .-      N -.      0 -----\n//\
  \ B --...    O ---      1 .----\n// C -.-.    P .--.    2 ..---\n// D -..      Q\
  \ --.-    3 ...—\n// E .        R .-.      4 ....-\n// F ..-.    S ...      5 -----\n\
  // G --.      T -        6 -....\n// H ....    U ..-      7 --...\n// I ..     \
  \   V ...-    8 ---..\n// J .---    W .--      9 ----.\n// K -.-      X -..-\n//\
  \ L ..-..    Y -.—\n// M --        Z --..\n```\n\n### 任务：\n\n* 创建新类 `Morse`。\n*\
  \ 编写两个方法：\n    * `String encode(String string)`。它接受一个字符串并将其转换为摩斯密码。字符串的每个字符都应输出对应的摩斯密码。输出中的每个块之间用空格隔开。未知字符被跳过。小写字母应像大写字母一样处理。单词之间有两个空格。\n\
  \    * `String decode(String string)`。将摩斯密码转换回原始字符串。单词分隔符的两个空格重新变为单空格。\n\n## 使用关联记忆记录词频\
  \ ★★ ★★\n\nGirly Gossip 偷听一群人的甲板对话，这样她以后就可以告诉 CiaoCiao 队长他们正在讨论什么。重要的是经常作为单词或短语提到的内容。\n\
  \n### 任务：\n\n* 编写一个方法 `List<String> importantGossip(String... words)`，从可变参数字符串中返回一个列表中在传入的数组中出现频率最高的五个字符串。\n\
  \n### 示例：\n\n```\nString[] words = {\n    \"Baby Shark\", \"Corona\", \"Baby Yoda\"\
  , \"Corona\", \"Tiger King\",\n    \"David Bowie\", \"Kylie Jenner\", \"Kardashian\"\
  , \"Love Island\",\n    \"Baby Yoda\", \"Tiger King\", \"Billie Eilish\", \"Corona\"\
  \n};\nSystem.out.println(importantGossip( words ));\n```\n输出\n```\nBaby Yoda, Corona,\
  \ Tiger King, Baby Shark, Baby Yoda]\n```\n请记住，关注的不是像 `Baby` 或 `Yoda` 这样的单个单词，而是始终整个字符串，例如\
  \ `Baby Yoda` 或 `Baby Shark`。\n\n## 读取与输出\n\nBonny Brain 得到了一个新的旗帜设计，但设计师们只说乱码：\n\
  \n```\n对于背景，让我们使用 #89cff0 或 #bcd4e6，对于文本，也许是 #fffaf0 或 #f88ff。\n```\n\n她发现像 `#RRGGBB`\
  \ 的规范代表颜色的红、绿、蓝（简称 `RGB`）部分，用十六进制 码。幸运的是，有像 `https://gist.githubusercontent.com/ullenboom/03a7ff2f742fe60752a975b153d0273/raw/colors.csv`\
  \ 这样的“翻译表”，其中包含如下行：\n\n```\namber,\"#ffbf00\",255,191,0\naqua,\"#0ff\",0,255,255\n\
  blush,\"#de5d83\",222,93,131\nwine,\"#722f37\",114,47,55\n```\n\n偶尔，文件中只包含三个符号的颜色值，例如示例\
  \ `aqua` 带有 `0ff`。在这种情况下，颜色值仅有三个符号。\n\n### 任务：\n\n1. 创建一个名为 `Color` 的类，表示颜色的红、绿、蓝（简称\
  \ `RGB`）部分，用十六进制 码。每个颜色有一个名称（`String name`）和一个 RGB 值（`int rgb`）。添加 `toString()`\
  \ 方法。\n2. 创建新类 `ColorNames`。\n    * 给类一个实例变量 `HashMap<Integer, Color> colorMap`，以便\
  \ `ColorNames` 内部可以记住所有的颜色；`Map` 的键是 RGB 值，值对应的 `Color` 对象。\n    * 将文件复制到磁盘。\n \
  \   * 创建一个读取文件的构造函数。我们可以使用 `Scanner`，或者使用 `Files.readAllLines(Path)` 完整读取文件。\n \
  \   * 拆分 CSV 的每一行，提取颜色名称（第二列）和 RGB 值（第三列）。提示：使用 Java 方法 `Integer.decode(\"#722f37\"\
  )` 可以转换为整数 `748311`。将颜色名称和整数值转换为 `Color` 对象，并放入 `Map` 中。\n    * 添加一个方法 `decode(int\
  \ rgb)`，根据 RGB 值返回关联的 `Color` 对象。\n\n### 示例：\n\n* `mapper.decode(748311)` -> `Optional['Wine'\
  \ is RGB #72F37]`\n* `mapper.decode(7)` -> `Optional.empty`\n\n## 读取名称并管理长度 ★\n\n\
  Bonny Brain 喜欢玩字谜游戏，每个条目都是一个名字。有时她很难想出特定长度的名字——这时软件派上用场了！\n\n### 任务：\n\n1. 文件包含姓氏。将文件保存到你的系统中。\n\
  2. 为了读取文件，我们可以利用 `Scanner` 类或 `Files` 方法 `readAllLines(Path)`。\n3. 将名称排序到 `TreeMap<Integer,\
  \ List<String>>` 中：键是名称的长度，列表包含所有相同长度的名称。\n4. 在命令行按长度顺序列出所有名称。\n5. 从命令行请求长度，只要该长度不是\
  \ 0 或负数，就输出所有该长度的名称。\n\n## 查找字符 ★★\n\n诈骗了死海卷（Cumexhopp 卷），目前还没有能够解码这些文本。他想这样做！然而，许多字符不可读，而另一些字符很容易阅读。也很容易看出单词有多少个字符。\n\
  \n### 任务：\n\n* 创建一个带有 `main(...)` 方法的新类，并将两个列表复制到程序中：\n\n```\nList<String> words\
  \ = Arrays.asList(\"house\", \"mouse\", \"horn\", \"cannon\");\nList<String> missingLettersWords\
  \ = Arrays.asList(\"_ouse\", \"ho__\", \"ca__on\", \"gun\", \"__e__\", \"_____\"\
  );\n```\n\n\n\n\n* 将 `missingLettersWords` 中的每个单词与字典 `words` 中的所有可能单词进行匹配，其中下划线\
  \ `_` 代表未知字符。\n* 字典中建议的单词长度必须与 `unreadable` 单词的长度相等。\n* 必须提供一个字符。\n\n### 示例：\n\n\
  * 来自给定列表的可能屏幕输出：\n\n```\n_ouse -> [mouse, house]\nho__ -> [horn]\nca__on -> [cannon]\n\
  gun -> No results\n__e__ -> No results\n_____ -> No results\n```\n\n### 计算前往三头猴的路径数量\
  \ ★★\n\n在曼哈顿喝了一整晚酒后，Ciao 队长（Ciao-`Ciao`-`Ciao`）想念他的三头猴。他一定在途中某个地方丢失了那个毛绒玩具！但它可能在哪里呢？他的团队必须从头到尾走遍所有的街道。Ciao\
  \ 队长唯一记得的是他没有穿过对角线。\n\n![图像展示了十四个四四正方形，箭头指示了从起点到终点的可能路线。](img/Fig05_02.jpg)\n\n\
  **图 5.2** 从起点到终点的可能路线。（来源：Wikipedia。）\n\n图像显示了 4 × 4 的街道区块，共有 14 种可能性。在寻找一段时间后，船员找到了毛绒玩具，他们太幸运了！\n\
  \nCiao 队长思考着：如果有 5 或 10 个区块——那么路径的数量不是大到无法搜索吗？\n\n问题的答案由数学提供。这里正在寻找的是具有 `n` × `n`\
  \ 个单元的正方形*单调路径*。可能路径的数量提供了*卡特兰数*，其计算方法如下：\n\n`C[n]` = (2*n*)! / (n+1)! *n!\n\n###\
  \ 任务：\n\n* 使用方法 `BigInteger catalan(BigInteger n)` 转换公式。使用自己的内部方法 `BigInteger factorial(BigInteger\
  \ n)` 进行阶乘计算。\n* 公式中必须计算三个阶乘：`n!`、`(n+1)!` 和 `(2*n)!`。`(n+1)!` 不仅仅是 `n!` × `(n+1)`，所以\
  \ `n!` 必须计算两次；此外在计算 `(2*n)!` 的过程中会出现中间结果 `(n+1)!`。因此许多乘法需要执行两次，所以乘积应该被缓存：为此请使用数据类型\
  \ `WeakHashMap`。\n* 比较使用相同参数调用两次 `catalan(...)` 方法的时间。使用以下代码作为模板：\n\n```\nlong start\
  \ = System.nanoTime();\nBigInteger catalan1000 = catalan( BigInteger.valueOf( 1000\
  \ ) );\nlong end = System.nanoTime();\nSystem.out.println( catalan1000 );\nSystem.out.println(\
  \ TimeUnit.NANOSECONDS.toMillis( end - start ) );\n```\n\n### 在排序关联存储器中管理假期 ★\n\n\
  `TreeMap` 中的元素是自动排序的。`TreeMap` 实现了 `java.util.NavigableMap`，而 `HashMap` 没有。顺序由外部的\
  \ `Comparator` 决定，或者元素具有自然顺序。\n\n从 API 文档中我们看到 `firstEntry()` 和 `lastEntry()` 分别返回最小和最大的元素。返回类型是\
  \ `Map.Entry<K,V>`。\n\n给定一个键 `key`，以下方法相对于该键返回：\n\n* `ceiling(K key)`：返回一个*大于或等于*此键的结果。\n\
  * `floor(K key)`：返回一个*小于或等于*给定键的结果。\n* `lower(K key)`：返回一个*严格小于*给定键的结果。\n* `higher(K\
  \ key)`：返回一个*严格大于*给定键的结果。\n\n如果问题没有答案，则所有方法都返回 `null`。\n\n对于子集，以下方法非常用：\n\n* `SortedMap<K,V>\
  \ subMap(K fromKey, K toKey)`。\n* `NavigableMap<K,V> subMap(K fromKey, boolean fromInclusive,\
  \ K toKey, boolean toInclusive).`。\n\n在第一种情况下，`fromKey` 是包含的而 `toKey` 是不包含的；这符合\
  \ Java 的通常惯例。第二种方法允许更精确地控制起始或结束元素是否包含。\n\n### 任务：\n\n* 构建一个排序关联内存：\n\n```\nNavigableMap<LocalDate,\
  \ String> dates = new TreeMap<>( Map.of(\n  LocalDate.of( 2024, Month.JANUARY, 1\
  \ ), \"New Year's Day\",\n  ...\n) );\n```\n类型 `<LocalDate, String>` 意味着一个时间 `LocalDate`\
  \ 与一个字符串关联。\n* `LocalDate` 类实现了 `Comparable`，这意味着元素具有顺序。\n* 用一些键值对填充数据结构。\n* 使用\
  \ `NavigableMap` 的适当方法回答以下问题：\n    * 根据数据结构，第一个和最后一个假期是什么？\n    * 圣诞节在 6 号结束。之后的假期是什么？\n\
  \    * 哪些日期落在 12 月份到 6 日（包含 6 日）之间？\n\n### 测验：HashMap 中的键\n\n考虑以下内容：\n\n```\nMap<Point,\
