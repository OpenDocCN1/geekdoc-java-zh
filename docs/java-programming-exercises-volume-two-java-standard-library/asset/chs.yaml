  \ Chart(document.querySelector(\"canvas\").getContext(\"2d\"), cfg);\n</script>\n\
  </body>\n</html>\n```\n\n## 建议解决方案\n\n### Hero 史：使用 Stream API\n\n#### 终止操作 forEach(…)\n\
  \n作为 `Heroes.ALL` 的简称，引入了一个辅助变量：\n\n```\nList<Hero> heroes = Heroes.ALL;\n```\n\n\
  **com/tutego/exercise/stream/LambdaHeroes.java**\n\n```\nConsumer<Hero> csvPrinter\
  \ =\n    hero -> System.out.printf( \"%s,%s,%s%n\",\n                          \
  \    hero.name(), hero.sex(), hero.yearFirstAppearance() );\nheroes.stream().forEach(\
  \ csvPrinter );\n```\n\n为了遍历流的所有元素，可以使用 `forEach(…)` 方法：\n\n```\nvoid forEach(Consumer<?\
  \ super T> action).\n```\n\n该方法期望一个 `Consumer` 类型的消费者。`forEach(Consumer)` 方法对每个元素调用传递的\
  \ `apply(…)` 方法，通过这种方式将流中的元素传递给 `Consumer`。对于仅仅遍历所有元素，我们不需要获取 `Stream`，`Iterable`\
  \ 也提供了 `forEach(…)`。\n\n#### 终止操作 allMatch(…).\n\n**com/tutego/exercise/stream/LambdaHeroes.java**\n\
  \n```\nPredicate<Hero> isAppearanceAfter1900 =\n    hero -> hero.yearFirstAppearance()\
  \ >= 1900;\nSystem.out.println( heroes.stream().allMatch( isAppearanceAfter1900\
  \ ) );\n```\n\n\n\n\n`Stream` 提供了三个方法，用于判断流中的所有元素或某些元素是否具有某个属性：`allMatch(…)`、`anyMatch(…)`\
  \ 和 `noneMatch(…)`。所有方法都接收一个 `Predicate` 来测试该属性。如果我们想知道是否所有英雄都是 1900 年之后引入的，我们使用\
  \ `allMatch(…)` 方法。`allMatch(…)` 方法会遍历流中的所有元素，并调用 `Predicate` 方法 `test(…)`。如果该测试始终返回\
  \ `true`，则流中的所有元素都符合标准，整体响应为 `true`。如果其中一个测试返回了 `false`，那么最终结果已经是 `false` 了。\n\n\
  ## 终端操作 anyMatch(…)\n\n`com/tutego/exercise/stream/LambdaHeroes.java`\n\n```\nPredicate<Hero>\
  \  isFemale = hero -> hero.sex() == Sex.FEMALE;\nPredicate<Hero> isAppearanceAfter1950\
  \ =\n    hero -> hero.yearFirstAppearance() >= 1950;\nSystem.out.println(\n    heroes.stream().anyMatch(\
  \  isFemale.and(  isAppearanceAfter1950  )\n);\n```\n\n`Predicate` 接口确实包含一些 `default`\
  \ 和 `static` 方法，包括 `and(Predicate)`、`or(Predicate)` 和 `negate()`。如果两个标准需要同时为真，可以使用\
  \ `and(…)` 方法将两个谓词连接起来，从而绑定在一起形成一个更大的谓词。如果我们想测试某个英雄是否是女性且在 1950 年之后引入的，我们可以先构建两个单一谓词，然后将它们连接起来。这种方法是合理的，因为首先，谓词变得更小且易于测试；其次，它们易于复用。\n\
  \n## 终端操作 min(…)\n\n`com/tutego/exercise/stream/LambdaHeroes.java`\n\n```\n    Comparator<Hero>\
  \ firstAppearanceComparator =\n        Comparator.comparingInt(  h -> h.yearFirstAppearance()\
  \ );\n//      Comparator.comparingInt(  Hero::yearFirstAppearance );\n    System.out.println(\
  \  heroes.stream().min(  firstAppearanceComparator ) );\n```\n\n`Stream` 提供了 `min(…)`\
  \ 和 `max(…)` 方法，并根据排序标准确定最大和最小元素：\n\n- `Optional`<T>` `min(Comparator`<? `super\
  \ T`> `comparator)`\n- `Optional`<T>` `max(Comparator`<? `super T`> `comparator)`\n\
  \n这两个方法的返回值都是 `Optional`，因为 `Stream` 可能是空的。`min(…)` 和 `max(…)` 方法期望一个 `Comparator`。如果询问哪个英雄最早引入，标准是\
  \ `yearFirstAppearance`。`Comparator.comparingInt(…)` 有助于快速构建 `Comparator`，年份越小，对象越小。`min(…)`\
  \ 方法根据最早的英雄返回答案。\n\n## 终端操作 reduce(…)\n\n`com/tutego/exercise/stream/LambdaHeroes.java`\n\
  \n```\nSystem.out.println(  heroes.stream().reduce(  (hero1, hero2 ) -> {\n  final\
  \ int YEAR = 1960;\n  int diff1 = Math.abs(  YEAR - hero1.yearFirstAppearance()\
  \ );\n  int diff2 = Math.abs(  YEAR - hero2.yearFirstAppearance() );\n  return (diff1\
  \ < diff2) ? hero1 : hero2;\n} ) );\n```\n\n对于在 1960 年左右最早出现的英雄的问题，我们依赖于 `reduce(…)`\
  \ 方法，该方法倾向于选择那些更接近 1960 年的英雄。`reduce(…)` 的声明如下：\n\n```\nOptional<T> reduce(BinaryOperator<T>\
  \ accumulator)\n```\n\n为了执行该操作，必须提供一个 `BinaryOperator`，它接收两个输入元素并返回单个输出元素。在这一特定实现中，计算第一个和第二个英雄与\
  \ 1960 年之间的距离，并返回更接近 1960 年的英雄。如果两个英雄到 1960 年的距离相等，算法可以任意选择两个英雄中的一个。\n\n从原则上说，另一种解法（即使用\
  \ `Comparator` 和 `Stream` 的 `min(…)` 方法）的方案也是可行的，如下所示：\n\n`com/tutego/exercise/stream/LambdaHeroes.java`\n\
  \n```\nOptional<Hero> min = heroes.stream().min(\n  Comparator.comparingInt(  hero\
  \ -> Math.abs(hero.yearFirstAppearance() - 1960) );\n```\n\n## 终端操作 collect(Supplier,\
  \ BiConsumer)\n\n`com/tutego/exercise/stream/LambdaHeroes.java`\n\n```\nStringBuilder\
  \ collectedYears =\n    heroes.stream().collect(\n      StringBuilder::new,\n  \
  \    ( sb, hero ) -> sb.append(sb.isEmpty() ? \"\" : \",\")\n      .append(hero.yearFirstAppearance()),\n\
  \      ( sb1, sb2 ) -> sb1.append(sb2.isEmpty() ? \"\" : \",\" + sb2) );\nSystem.out.println(collectedYears);\n\
  ```\n\n如果我们想要得到一个包含所有值的 `StringBuilder`，我们不会使用 `reduce(…)` 方法，而是使用 `collect(…)`\
  \ 方法。虽然 `reduce(…)` 总是将两个值归约为一个，但 `collect(…)` 会查看所有元素并将它们转换为另一种表示。该方法是重载的，但我们感兴趣的变体是：\n\
  \n```\nR collect(Supplier<R> supplier,\n    BiConsumer<R, ? super T> accumulator,\n\
  \    BiConsumer<R, R> combiner).\n```\n\n第一个参数是结果的生产者。在我们的情况下结果是 `StringBuilder`，`StringBuilder::new`\
  \ 产生了该 `Supplier`。第二个参数是 `BiConsumer`，它将英雄的年份放入 `StringBuilder` 中，如果有需要。最后一个 `BiConsumer`\
  \ 将多个 `StringBuilder`（可能是通过并发处理创建）合并为一个 `StringBuilder`。虽然在我们的情况下这不是必须，但我们也想实现这种功能。与其向\
  \ `collect(…)` 方法传递三个参数，不如构建一个包含 `Supplier` 和两个 `BiConsumer` 的 `Collector` 对象。这如下所示：\n\
  \n`com/tutego/exercise/stream/LambdaHeroes.java`\n\n```\nCollector<Hero, StringBuilder,\
  \ StringBuilder> joiningComma = Collector.of(StringBuilder::new,\n    ( sb, hero\
  \ ) -> sb.append(sb.isEmpty() ? \"\" : \",\")\n    .append(hero.yearFirstAppearance()),\n\
  \    ( sb1, sb2 ) -> sb1.append(sb2.isEmpty() ? \"\" : \",\" + sb2) );\nSystem.out.println(heroes.stream().collect(joiningComma));\n\
  ```\n\n## 终端操作 collect(Collector) with groupingBy(…).\n\n`com/tutego/exercise/stream/LambdaHeroes.java`\n\
  \n```\nMap<Sex, List<Hero>> sexListMap =\n    heroes.stream().collect(Collectors.groupingBy(hero\
  \ -> hero.sex()));\nSystem.out.println(sexListMap);\n```\n\n`collect(…)` 方法参数化如下：\n\
  \n```\n<R, A> R collect(Collector<? super T, A, R> collector).\n```\n\n传入一个 `Collector`。`Collectors`\
  \ 类声明了许多预定义的 `Collector` 实现。这些包括 `toList()`、`toSet()` 等。`Collector` 可用于分组流元素：`Collectors.groupingBy(…)`：\n\
  \n```\n<T, K> Collector<T, ?, Map<K, List<T>>>\ngroupingBy(Function<? super T, ?\
  \ extends K> classifier)\n```\n\n泛型信息很复杂，但方法很简单：`Function` 的工作是提取结果 `Map` 的键。流中具有相同键的所有元素将与该键关联。\n\
  \n因此，如果想要按性别分类的 `Map`，函数就是 `hero -> hero.sex`，并将创建一个 `Map`<Sex, List<Hero>>`，男性或女性英雄的列表将附加在相应的性别下。\n\
  \n## 终端操作 collect(Collector) with partitioningBy().\n\n`com/tutego/exercise/stream/LambdaHeroes.java`\n\
  \n```\nPredicate<Hero> isAppearanceAfter1970 =\n    hero -> hero.yearFirstAppearance()\
  \ >= 1970;\nMap<Boolean, List<Hero>> beforeAndAfter1970Partition =\n    heroes.stream().collect(Collectors.partitioningBy(isAppearanceAfter1970));\n\
  System.out.println(beforeAndAfter1970Partition);\n```\n\n\n\n\n`groupingBy(…)` 的结果始终是一个包含任意数量键的\
  \ `Map`。如果结果集只有两个不同的部分，可以使用方法 `partitioningBy(…)` 方法：\n\n```\nCollector<T, ?, Map<Boolean,\
  \ List<T>>> partitioningBy(Predicate<? super T> predicate).\n```\n\n我们传递一个 `Predicate`\
  \ 进行测试，通过此测试的元素将作为 `Boolean.TRUE` 下的键放入 `Map` 中，其他元素则放入 `Boolean.FALSE` 下。\n\n这回答了哪些英雄是在\
  \ 1970 年之前和之后介绍的这个问题。\n\n### 中间操作 filter(..)\n\n**`com/tutego/exercise/stream/LambdaHeroes.java`**\n\
  \n```\nSystem.out.println(  heroes.stream()\n                               .filter(\
  \  hero -> hero.sex() == Sex.FEMALE  )\n                               .count()\
  \ );\n```\n\n也许最重要的 `Stream` 中间方法是 `filter(…)`：\n\n```\nStream<T> filter(Predicate<?\
  \ super T> predicate);\n```\n\n所有满足谓词的元素都保留在流中。如果问题是关于女性英雄，我们编写一个谓词来提取英雄的性别并测试 `Sex.FEMALE`。会创建一个新的\
  \ `Stream`，但在过滤后，流可能包含更少的元素。`count()` 方法返回元素的数量。\n\n### 中间操作 sorted(…)\n\n**`com/tutego/exercise/stream/LambdaHeroes.java`**\n\
  \n```\nheroes.stream()\n    .sorted( Comparator.comparingInt(  hero -> hero.yearFirstAppearance()\
  \  \n)\n    .forEach(  System.out::println );\n```\n\n`Stream` 类的一些方法是有状态的。这些操作无法在求值时尽可能长时间地等待（它们不是懒惰的），但流的所有元素都必须被读取，以便实现排序或去重重复元素等操作。如果需要按英雄介绍的时间对英雄流进行排序，我们将首先再次使用\
  \ `Comparator.comparingInt(…)` 形成一个 `Comparator` 并将其传递给 `sorted(…)` 方法：\n\n```\n\
  Stream<T> sorted(Comparator<? super T> comparator).\n```\n\n通过 `forEach(…)`，我们消耗掉排序后的流并在屏幕上输出所有英雄。\n\
  \n### 中间操作 map(…) 结合 Collectors.joining(…)\n\n**`com/tutego/exercise/stream/LambdaHeroes.java`**\n\
  \n```\nString femaleNames =  heroes.stream()\n                               .filter(\
  \  hero -> hero.sex() == Sex.FEMALE  )\n                               .map(  hero\
  \ -> hero.name()  )\n                               .collect(  Collectors.joining(\
  \ \", \"  )  );\nSystem.out.println(  femaleNames );\n```\n\n除了 `filter(…)` 之外，`map(…)`\
  \ 方法可能是 `stream` 接口中次第二重要的方法：\n\n```\n<R> Stream<R> map(Function<? super T, ? extends\
  \ R> mapper).\n```\n\n`map(…)` 方法将 `Function` 应用于流中的每个元素，并创建一个新的流（可能是新类型）。因此，我们也可以使用\
  \ `map(…)` 方法来提取所有英雄名称。在执行所需的过滤操作后，名称被提取，然后通过特殊的 `Collector` 绑定在一起，形成用逗号分隔名称的 `String`。\n\
  \n### 中间操作 map(…) 结合 toList()\n\n**`com/tutego/exercise/stream/LambdaHeroes.java`**\n\
  \n```\nFunction<Hero, Hero> nameAnonymizer = hero ->\n    new Hero(hero.name().replaceAll(\"\
  \\\\s*\\\\)$\", \"\"),\n    hero.sex(), hero.yearFirstAppearance());\nSystem.out.println(heroes.stream().map(nameAnonymizer).toList());\n\
  ```\n\n在任务中，我们想要移除括号中的内容。我们再次通过 `map(…)` 方法以及一个替换英雄的特殊函数来实现。该函数获取一个带有普通名称的英雄，并返回一个删除了所有括号内内容的新英雄。除了\
  \ `Function<Hero, Hero>`，你也可以使用 `UnaryOperator<Hero>`。原则上，处理此类链链会修改对象并返回修改后的对象，但创建新对象会更整洁。由于\
  \ `Hero` 对象是不可变的，我们还需要构建新的 `Hero` 对象。我们获取名称，并使用 `replaceAll(…)` 将括号内的所有内容（以及其之前的任何空格序列）替换为空字符串，从而删除该部分。这个新名称连同未改变的性别和年份被传递给构造函数。新创建的\
  \ `Stream<Hero>` 通过 `Stream` 方法 `toList()` 转换为列表。\n\n### 中间操作 mapToInt(…)\n\n**`com/tutego/exercise/stream/LambdaHeroes.java`**\n\
  \n```\nint[] years = heroes.stream()\n    .mapToInt(hero -> hero.yearFirstAppearance())\n\
  \    .distinct()\n    .toArray();\nSystem.out.println(Arrays.toString(years));\n\
  ```\n\n除了 `map(…)` 方法外，还有一些返回特殊流的方法：\n\n* `IntStream mapToInt(ToIntFunction<? super\
  \ T> mapper)`\n* `LongStream mapToLong(LongFunction<? super T> mapper)`\n* `DoubleStream\
  \ mapToDouble(DoubleFunction<? super T> mapper)`\n\n这三个特殊流提供了 `toArray()` 方法，它最后产生一个原始类型数组而不是对象数组。这是收集所有年份的好方法。重复元素通过\
  \ `distinct()` 移除。\n\n### 中间操作 flatMap(…)\n\n**`com/tutego/exercise/stream/LambdaHeroes.java`**\n\
  \n```\nHeroesES.stream()\n    .flatMap(Universe::heroes)\n    .map(hero -> hero.name())\n\
  \    .forEach(System.out::println);\n```\n\n`map(…)` 方法会导致直接映射。这不会创建更多元素，元素只是被交换。使用\
  \ `flatMap(…)` 方法的情况不同：\n\n```\n<R> Stream<R> flatMap(Function<? super T, ? extends\
  \ Stream<R>> mapper).\n```\n\n当 `map(…)` 传递 `Function<? super T, ? extends Stream<R>>`\
  \ 时，`flatMap(…)` 接收的是 `Function<? super T, ? extends Stream<R>>`；也就是说，对于 `flatMap(…)`，该函数必须返回一个\
  \ `Stream`。`flatMap(…)` 运行这些子流并将元素放入结果流。结果流会增长并变得更大。`UNIVERSES` 是一个 `List<Universe>`。如果我们查询流，结果是\
  \ `Stream<Universe>`。`Universe` 拥有 `String name()` 和 `Stream<Hero> heroes()` 方法。如果我们对两个宇宙的所有\
  \ `Hero` 对象感兴趣，`flatMap(Universe::heroes)` 很有帮助，因为它返回 `Stream<Hero>`。相比之下，`map(Universe::heroes)`\
  \ 返回的是 `Stream<Stream<Hero>>`，我们无法进行任何操作。\n\n由于任务只涉及名称，额外的 `map(…)` 产生 `<string>`，而\
  \ `forEach(…)` 输出名称。\n\n### 测验：双输出\n\n如果执行程序，会发生异常：\n\n```\nException in thread\
  \ \"main\" java.lang.IllegalStateException: stream has already been operated upon\
  \ or closed\n```\n\n流对象的中间操作返回新的流对象，我们必须在这些对象上调用其他方法。如果意图让两个流通过 `peek(…)` 和 `forEach(…)`\
  \ 重新开始，则必须重建流。否则，`forEach(…)` 无法从之前由 `peek(…)` 起的流数字开始。\n\n### 从列表中获取喜爱的队长\n\n**`com/tutego/exercise/stream/NameOccurrences.java`**\n\
  \n```java\nString[] names = {\n    \"Anne\", \"Captain CiaoCiao\", \"Balico\", \"\
  Charles\", \"Anne\", \"CiaoCiao\",\n    \"CiaoCiao\", \"Drake\", \"Anne\", \"Balico\"\
  , \"CiaoCiao\"  };\nMap<String, Long> nameOccurrences =\n    Arrays.stream(names)\n\
  \        .map(s -> \"CiaoCiao\".equalsIgnoreCase(s) ? \"Captain CiaoCiao\" : s)\n\
  \        .collect(Collectors.groupingBy(String::toLowerCase,\n            Collectors.counting()));\n\
  System.out.println(nameOccurrences);\n```\n\n如果我们运行程序，输出是：\n\n```\n{captain ciociao=4,\
  \ charles=1, anne=3, drake=1, balico=2}\n```\n\n\n\n起始点是一个包含名称的 `names` 数组。`Arrays.stream(…)`\
  \ 为我们提供了一个字符串的 `Stream`，另一种方案是 `Stream.of(…)`。由于我们的队长可能以不同的格式出现，我们对格式进行了规范化处理，并通过\
  \ `map(…)` 方法让 `Captain CiaoCiao` 始终出现在 `Stream` 中，而不是 `CiaoCiao`。其他字符串则不会被转换。\n\
  \n实际的聚合和计数是由特殊的 `Collector` 完成的：\n\n```\ngroupingBy(  Function<? super T, ? extends\
  \ K> classifier,\n            Collector<? super T, A, D> downstream )\n```\n\n如果我们将这个\
  \ `groupingBy(…)``Collector` 传递给 `collect(…)`，我们将得到一个类型为 `Map<K, D>` 的结果。\n\n所有的\
  \ `groupingBy(…)`收集器都期望第一个参数是一个分类器。这决定了结果关联式内存的键（keys）。如果我们没有为 `downstream` 指定第二个\
  \ `Collector`，则键将与一个列表关联，但我们不需要那样——我们只对与键相关的元素数量感兴趣。`Collectors.counting()` 提供了一个将结果还原为\
  \ `long` 而不是列表的 `Collector`。内部，`counting(…)` 方法实现如下：\n\n### OpenJDK 对 counting(…)\
  \ 的实现\n\n```\npublic static <T> Collector<T, ?, Long> counting() {\n  return summingLong(e\
  \ -> 1L);\n}\n```\n\n`counting()` 返回一个 `Collector<T, ?, Long>`，即一个接收类型为 `T` 的元素并将其还原为\
  \ `Long` 的收集。从代码中可以看出，这只是一个快捷方式，我们完全写成：\n\n```\nCollectors.groupingBy(  String::toLowerCase,\
  \ Collectors.summingLong(  e -> 1L )\n)\n```\n\n一个函数被传递给 `summingLong(ToLongFunction)`，该函数会在流的每个元素上调用一次。由于常量映射\
  \ `e -> 1L`，`summingLong(…)` 只加了 `1`，这实际上是在浪费计算能力。\n\n`groupingBy(Function classifier,\
  \ Collector downstream)` 也是 `groupingBy(classifier, HashMap::new, downstream)` 的快捷方式。\n\
  \n### 边框图 (Frame Pictures)\n\n**com/tutego/exercise/stream/FramePicture.java**\n\
  \n```java\nprivate static String frame( String string ) {\n  if ( string == null\
  \ || string.isBlank() )\n    throw new IllegalArgumentException(\"String to frame\
  \ can’t be null or\nempty\");\n  final String NEW_LINE = \"\\n\";\n  int max = string.lines().mapToInt(\
  \ String::length ).max().getAsInt();\n  String topBottomBorder = '+' + \"-\".repeat(\
  \ max + 4 ) + '+' + NEW_LINE;\n  String emptyRow       = \"|  \" + \" \".repeat(\
  \ max ) + \"  |\" + NEW_LINE;\n\n  return\n      string.lines()\n          .map(s\
  \ -> \"|  \" + s + \" \".repeat( max - s.length() ) + \" |\")\n          .collect(\
  \ Collectors.joining(NEW_LINE,\n                                     topBottomBorder\
  \ + emptyRow,\n                                     NEW_LINE + emptyRow + topBottomBorder)\
  \ );\n}\n```\n\n为了给 ASCII 艺术绘制框，必须解决不同的子问题。首先要是：最长的一有多有多，因为这决定了框的宽度。实际答案由单个流表达式提供。如果我们将每个字符串映射为字符串长度，并从整数流中确定最大值，我们就得到了答案。\n\
  \n我们对这个长度做了两件事：它有助于生成顶部和底部的水平框，它还用空格填充较短的行，以便以后所有行的长度都相同。框以加号开始，后面跟着减号，每页比最长字符串多两个。每边会多出两个，因为这是预留的右侧和左侧边距的内部距离。为了生成减号，我们使用\
  \ `String` 的 `repeat(int)`。除了生成上下边框外，还可以生成一个用于在左右边缘有笔划线、中间是空格的空行的 `String`。这个空行可以放置在顶线和底线之间。\n\
  \n在准备好变量后，将图像实际放置在框中只是一个 `Stream` 表达式。\n\n### 报数 (Look and Say)\n\n让我们看看字符串 `111221`。起初你可能会想到一个计数循环，它总是向后移动索引并检查符号是否改变。但我们可以使用正则表达式。这听起来很奇怪，因为这里应该识别什么呢？从\
  \ `1` 到 `2` 再到 `1` 的变化吗？不！正则表达式可以帮助我们捕捉重复的符号。我们使用以下正则表达式编写普通的重复：\n\n```\n.*\n```\n\
  \n然而，这样我们将匹配到任意字符的序列。但我们需要表达相同字符的重复。为了实现这一点，我们可以利用正则表达式引擎的一个特殊特性：*反向引用* (back-reference)。\n\
  \n```\n(.)1*\n```\n\n`\\1` 是指向第一个组的反向引用，即 `(.)`。点号匹配任何情况下的一个符号，而反向引用匹配任意数量的相同符号。我们必须在这里使用\
  \ `*` 而不是 `+`，因为符号可能只出现一次，也就是说反向引用不是必须的。\n\n序列的实际意义在于我们只需要考虑相同符号的序列。在这个符号中，我们需要的两个信息是：哪个符号出现了几次？如果我们用正则表达式找到所有位置，就可以用字符串长度和符号替换这些位置。这正是所提方案所做的。\n\
  \n在第一步中，中间变量 `sameSymbolsPattern` 存储了 `Pattern`。如果程序多次需要同一个模式，这总是个好主意。在第二步中，我们声明了一个变量\
  \ `lengthAndSymbol` 来将 `MatchResult` 映射到 `String`。包含符号长度的字符串是第一部分，重复的符号是字符串的第二个字符。有趣的是，只有长度\
  \ 1、2、3 会出现，所以始终是两个连接的字符。\n\n**com/tutego/exercise/stream/Say.java**\n\n```java\n\
  Pattern sameSymbolsPattern = Pattern.compile(\"(.)1*\");\nFunction<MatchResult,\
  \ String> lengthAndSymbol = match -> match.group().length() + match.group(1);\n\n\
  Stream.iterate(\"1\", s -> ...)\n  .limit(20)\n  .map(s -> sameSymbolsPattern.matcher(s))\n\
  \  .flatMap(m -> ...)\n  .replaceAll(lengthAndSymbol)\n  .forEach(System.out::println);\n\
  ```\n\n\n\n静态方法 `Stream.iterator(…)` 需要第一个参数作为起始值。这个值是 `\"1\"`。其后是一个 `UnaryOperator`，即一个输入和输出类型相同的\
  \ `Function`。该运算符使用 `iterator(…)` 的最后一个值调用，因此在启动时，它是 `\"1\"`，并可以从那里开始向上递增。总的来说，我们将流限制为\
  \ 20 个元素，并在终端操作中将所有元素输出到屏幕上。在每一步，字符串都会增长约 30%，因此限制迭代次数是有好处的。\n\n### 移除稀有金属重复岛屿\n\
  \n该任务有两个特殊之处，因此我们不能简单地使用：\n\n```\nArrays.stream( s.split( \"\\n\" ) )\n      .distinct()\n\
  \      .collect( Collectors.joining(\"\\n\") )\n```\n\n* 输入不仅可以来自 `String`，还可以通过\
  \ `File`、`InputStream` 或 `Path` 给出。\n* 输入不是单行的，而是始终由两行组成。\n\n然而，这两个要求并不会改变构建 `Stream<String>`\
  \ 并通过 `distinct()` 移除重复项的方法。核心问题在于：我们如何将不同的来源整合到一个 `Stream` 中，以及如何在流中将两行实现为一个字符串？\n\
  \n要将带有任何分隔符的字符串转换为 `Stream<String>`，可以使用非常灵活的 `Scanner` 类。`Scanner` 对象可以用不同的输入源进行初始化，这些源包含了任务所需的\
  \ `String`、`File`、`InputStream` 和 `Path` 类型。\n\n**com/tutego/exercise/stream/RemoveAllEqualPairs.java**\n\
  \n```java\nString lines =\n    \"Balancar\\nErbium\\n\" +\n    \"Benecia\\nYttrium\\\
  n\" +\n    \"Luria\\nThulium\\n\" + // <-\n    \"Kelva\\nNeodym\\n\" +\n    \"Mudd\\\
  nEuropium\\n\" +\n    \"Tamaal\\nErbium\\n\" +\n    \"Varala\\nGadolinium\\n\" +\n\
  \    \"Luria\\nThulium\\n\"; // <-\n// (?m)(^.*$\\n?){2}\nPattern pattern = Pattern.compile(\
  \ \"^.*$\\n)\" + // 一行\n                                  \"{2}\",         // 两行\n\
  \                                  Pattern.MULTILINE );\nString s = new Scanner(\
  \ lines )\n            .findAll( pattern )\n            .map( MatchResult::group\
  \ )\n            .distinct()\n            .collect( Collectors.joining() );\nSystem.out.println(\
  \ s );\n```\n\n`Scanner` 是一个分词器，可以以不同的方式使用：\n\n* 读取由空白符分隔的标记（tokens）。\n* 读取以行符终止的行。\n\
  * 读取原始数据类型。\n* 使用任何确定分隔符的正则表达式来读取标记。\n* 读取匹配正则表达式的标记。\n\n这些 `next*()` 方法没有帮助，因为它们不会产生\
  \ `Stream`。`Scanner` 类有三个方法返回 `Stream`：\n\n* `Stream<MatchResult> findAll(String\
  \ patString)`\n* `Stream<MatchResult> findAll(Pattern pattern)`\n* `Stream<String>\
  \ tokens()`\n\n`findAll(…)` 方法在任务中很有用，因为它返回了匹配项（`Match`）的结果。我们只需要使用正则表达式来确定我们到底想要捕获的什么，即恰好是两行。正则表达式\
  \ `\"(^.*$\\n){2}\"` 由四个核心部分组成：\n\n1. `^`：匹配必须从行的开头开始。\n2. `$`：匹配必须发生在行的末尾。\n  \
  \  * `\\n`：行之后跟着一个新行。\n3. `{2}`：这种行和新行的结构发生两次，以便边界匹配器 `^` 和 `$` 代表本地行而不是整个输入，必须设置标志\
  \ `Pattern.MULTILINE`。建议的选择了这种变体，但也可以将标志直接插入正则表达式中，那时就要写成：`\"(?m)(^.*$\\n?){2}\"\
  `。\n\n如果这个正则表达式进入 `findAll(…)` 方法，就会创建一个 `Stream<MatchResult>`。在流的 `MatchResult`\
  \ 对象中，只有 `group()` 返回的完整匹配是相关的。每个组都是一个双行字符串。`distinct()` 移除了所有重复的双部分字符串，最后收集器（collector）将\
  \ `stream` 中的所有这些字符串合并回一个 `String`。\n\n### 帆在哪里？\n\n在每种情况下，都必须从 `Point` 对象构建 `Stream`，并在最后通过\
  \ `Collectors.toMap(…)` 创建 `Map`。有两种方法可以目标，因为特殊之处在于，当双重元素被传输为 `Map` 时会变成问题，因为在 `Map`\
  \ 中键必须出现一次。\n\n建议的解决方案提供了两个变体。\n\n**变体 1: com/tutego/exercise/stream/DistanceNextStation.java**\n\
  \n```java\nFunction<Double, Integer> distanceTo =\n    coordinate -> distance(coordinate.x,\
  \ coordinate.y, 0.239057, 3.13839);\n\nMap<Double, Integer> map =\n    Arrays.stream(targets)\n\
  \    .distinct()\n    .collect(Collectors.toMap(Function.identity(), distanceTo));\n\
  ```\n\n我们可以通过 `distinct()` 方法轻松移除重复元素。然后 `collect(…)` 使用 `Collectors.toMap(…)` 将元素转换为\
  \ `Map`。提醒一下：\n\n```java\nCollector<T, ?, Map<K,U>> toMap(Function<? super T, ?\
  \ extends K> keyMapper,\n    Function<? super T, ? extends U> valueMapper);\n```\n\
  \n第一个 `Function` 决定键，在本例中是流中的键。第二个函数计算距离，`Function<Double, Integer>` 内部回退到 `distance(…)`。因此\
  \ `toMap(…)` 建立了点与距离之间的关联。如果缺少 `distinct()` 方法，键会出现两次，并导致 `IllegalStateException:\
  \ Duplicate key`。即使没有 `distinct()` 也可以工作。\n\n**变体 2: com/tutego/exercise/stream/DistanceNextStation.java**\n\
  \n```java\nmap = Arrays.stream(targets)\n    .collect(Collectors.toMap(Function.identity(),\
  \ distanceTo, (d,__) -> d));\n```\n\n第二种方法使用了不同的 `toMap(…)` 方法：\n\n```java\nCollector<T,\
  \ ?, Map<K,U>> toMap(Function<? super T, ? extends K> keyMapper,\n    Function<?\
  \ super T, ? extends U> valueMapper,\n    BinaryOperator<U> mergeFunction)\n```\n\
  \n第三个参数是一个 `BinaryOperator`，参数名称已经揭示了它的作用：`mergeFunction` 只在键出现多次时调用以合并结果。由于在本例中，键值对总是相同的，因此我们可以简单地丢弃一对坐标和距离。这是通过\
  \ `(d,__) -> d` 处理的；`BinaryOperator<Integer>` 接收两个距离；第二个值被忽略，因为永远只返回第一个距离。\n\n###\
  \ 购买最热门的汽车\n\nStream API 是 Java 开发者的福音，但人们应该抵抗那种习惯性地将一切写成流表达式的冲动。这个任务就是其中之一。当其他表达式可以在分钟内解决问题时，投入\
  \ 30 分钟编写一个不可读的流表达式是不经济的。因此，以下是建议的解决方案：\n\n**com/tutego/exercise/stream/PopularCar.java**\n\
  \n```java\nMap<String, Long> map1 =\n    Arrays.stream(cars)\n    .collect(Collectors.groupingBy(Function.identity(),\
  \ Collectors.counting()));\n\nmap1.entrySet().removeIf(stringLongEntry -> stringLongEntry.getValue()\
  \ < 2);\n```\n\n解决方案使用了 `groupingBy(…)` 方法，它提供一个函数作为分类器，以及一个用于关联元素的 `Collector`。提醒：\n\
  \n```java\nCollector<T, ?, Map<K,D>> groupingBy(Function<? super T, ? extends K>\
  \ classifier,\n    Collector<? super T, A, D> downstream);\n```\n\n\n\n我们的 `Map<String,\
  \ Long>` 是通过 `Collectors.groupingBy(Function.identity(), Collectors.counting())`\
  \ 形成的。流中的元素形成键，关联的值是该值在流中出现的次数。\n\n`Map` 的方法 `entrySet()` 返回一个 `Set<Entry<String,\
  \ Long>>`，该集合并不包含数据的副本，而是数据的实时视图（live view）。可以调用 `removeIf(Predicate<Entry<String,\
  \ Long>>)`，该方法会遍历整个集合并精确删除所有满足所传谓词的元素。该谓词表示删除出现次数小于 2 次的条目。\n\n另一种解决方案使用了独立的 `Collector`。它不再创建一个\
  \ `Map<String, Long>`，而是创建一个 `Map<String, Boolean>`。\n\n**com/tutego/exercise/stream/PopularCar.java**\n\
  \n```\nCollector<Object, long[], Boolean> collector = Collector.of(\n    // Supplier<A>\
  \ supplier\n    () -> new long[1],\n    // BiConsumer<A,T> accumulator\n    (array,\
  \ string) -> array[0]++,\n    // BinaryOperator<A> combiner\n    (array1, array2\
  \ ) -> { array1[0] += array2[0]; return array1; },\n    // Function<A,R> finisher\n\
  \    array -> array[0] > 1 );\n\nMap<String, Boolean> map2 =\n    Arrays.stream(\
  \ cars ).collect(Collectors.groupingBy(Function.identity(),\n                  \
  \                   collector ));\n```\n\n第二个提出的解决方案也使用了 `groupingBy(Function, Collector)`，但这里程序没有使用预定义的\
  \ `Collector`，而是为返回的 `Map<String, Boolean>` 编写了自己的 Collector。`Collector` 对象可以使用以下静态工厂方法构建：\n\
  \n```\nCollector<T, A, R> of(Supplier<A> supplier,\n                      BiConsumer<A,\
  \ T> accumulator,\n                      BinaryOperator<A> combiner,\n         \
  \             Function<A, R> finisher,\n                      Characteristics...\
  \ characteristics)\n```\n\n对于所需的返回类型 `Map<String, Boolean>`，我们寻找的是一个返回 `Boolean`\
  \ 的 `Collector`，因此泛型参数应该是这样的：`Collector<Object, *, Boolean>`。第一个类型可以保持为 `Object`，因为我们没有访问字符串。类型\
  \ `*` 不出现在流中，是一个内部容器，我们使用 `long` 数组来存储计数；因此正确的声明是：`Collector<Object, long[], Boolean>`。\n\
  \n在 `of(...)` 方法中，我们传递了四个必要的参数；`Characteristics` 是可变参数，在我们的用中无关。\n\n1. `Supplier`\
  \ 返回一个只有一个条目的 `long` 数组。`Collector` 记录了这个数字。`Collector` 拥有一个状态，通过它之后可以判断 `String`\
  \ 是否出现了超过 2 次。\n2. `BiConsumer` 获取 `long` 数组和 `String`，但只进行递增，而不访问 `String`。因此，类型参数也可以是\
  \ `Object` 而不必是 `String`。\n3. `BinaryOperator` 合并两个 `long` 数组。该操作仅在并行流上执行。\n4. `Collector`\
  \ 处的 `Function` 将结果映射为 `boolean`。每当数组中的计数器超过 1 时，结果为 `true`，从而形成与字符串关联的值。\n\n###\
  \ 在数组中检测 NaN\n\n**com/tutego/exercise/stream/ArrayNan.java**\n\n```\nstatic boolean\
  \ containsNan(double[] numbers) {\n  return DoubleStream.of(numbers).anyMatch(Double::isNaN);\n\
  }\n```\n\n普通流和原始类型流中可用的终端方法 `anyMatch(Predicate)` 完成了这项任务。方法引用 `Double::isNaN` 是\
  \ `value -> Double.isNaN(value)` 的缩写。\n\n### 生成年代\n\n**com/tutego/exercise/stream/DecadesArray.java**\n\
  \n```\nstatic int[] decades(int start, int end) {\n  return IntStream.rangeClosed(start\
  \ / 10, end / 10)\n      .map(x -> x * 10)\n      .toArray();\n}\n```\n\n原始类型流 `IntStream`\
  \ 和 `LongStream` 包含了两个用于的静态 `range` 方法：\n\n**IntStream**\n- `IntStream.range(int\
  \ start, int endExclusive)`\n- `IntStream.rangeClosed(int startInclusive, int endInclusive)`\n\
  \n**LongStream**\n- `LongStream.range(long startInclusive, long endExclusive)`\n\
  - `LongStream.rangeClosed(long startInclusive, long endInclusive)`\n\n起始值和结束值可以确定，结束值是否属于流也可以，但步长始终为\
  \ 1。由于在任务中结束值属于结果，因此 `rangeClosed(...)` 是一个很好的选择。为了解决这个问题，我们需要将步长从 1 增加到 10。可以通过以下方式实现：\n\
  1. 将 `rangeClosed(...)` 的起始和结束值除以 10，结果产生一个包含一个元素的流。\n2. 通过 `map(...)` 将元素乘以 10。\n\
  由于目标是数组而不是 `IntStream`，`toArray()` 返回 `int[]`。\n\n### 生成包含常量内容的数组\n\n**com/tutego/exercise/stream/GenerateFillArray.java**\n\
  \n```\nstatic int[] fillArray(int size, int value) {\n  if (size < 0)\n    throw\
  \ new IllegalArgumentException(\"size can not be negative\");\n\n  return IntStream.range(0,\
  \ size).map(__ -> value).toArray();\n}\n```\n\n在第一步中，方法像往常一样检查参数的有效性。size 不能为负，否则将抛出异常。`value`\
  \ 的赋值不需要检查，因为可以分配任何值。`IntStream.range(...)` 生成具有 `size` 多个元素的 `IntStream`。流生成从 0\
  \ 到 `size` 数字这一事实在我们的用例中无关，我们将所有值转换到一个固定值。标识符 `__` 表示 lambda 参数未被使用。这创建了一个具有恒定值的流。`toArray(...)`\
  \ 将流转换为数组。\n\n### 带有字母标记的泰迪\n\n**com/tutego/exercise/stream/StreamPyramid.java**\n\
  \n```\nString text = \"MME\";\nString teddy = \"\"\"\n      _    _\n     (c).(c)\n\
  \     /o_o \\\\\n    __(Y)/__\n    (_/-'-'\\\\._)\n      || %c ||\n     _.'`-; '._\n\
  \    (.-./`-\\\\.-.)\n    `-’     `-’ \"\"\";\nString teddies =\n    teddy.lines()\n\
  \        .map(line -> text.codePoints()\n                      .mapToObj(line::formatted)\n\
  \                      .collect(Collectors.joining()))\n        .collect(Collectors.joining(\"\
  \\n\"));\nSystem.out.println(teddies);\n```\n\n在解决任务时，我们需要记住大局：我们不希望泰迪一个接一个排列，而是并排排列。为了实现这一点，我们需要将模板的行多次放置在一起，这需要一个运行于所有行的外部循环。\n\
  \n流实现了这些循环。`teddy.lines()` 构建了一个所有泰迪行的 `Stream<String>`。对于每一行，都有另一个遍历 `text` 字符的流。`codePoints()`\
  \ 调用返回一个 `IntStream`。原始 `int` 元素通过 `mapToObj(line::formatted)` 转换为 `Stream<Object>`，因此\
  \ `IntStream` 中的 `int` 将进入字符串模板中 `%c` 所在。\n\n这让我们获得了与 `text` 中字符数量相同的泰迪行。第一个 `collect(...)`\
  \ 方法将每个部分行合并为一个大的行字符串。现在这些行只需要用换行符连接起来形成主字符串，这是通过第二次调用 `collect(...)` 完成的。\n\n###\
  \ 绘制金字塔\n\n**com/tutego/exercise/stream/StreamPyramid.java**\n\n```java\nstatic\
  \ void printPyramid(int height) {\n  IntStream.rangeClosed(1, height)\n        .mapToObj(i\
  \ -> \" \".repeat(height - i) + \"/\\\\\".repeat(i))\n        .forEach(System.out::println);\n\
  }\n```\n\n\n\n生成的输出有其特殊之处，即总有两个字符 `/\\` 相邻在一起。在第一行中，有一对；在第二行中有两对，以此此类推。因此，我们需要创建一个从\
  \ 1 到目标高度的 `IntStream`。在前面设置的空格也依赖于这个计数器。对于一个从 1 到 5 生成的流，空格的数量仅为 `5 - i`。该程序被提取到一个方法中，以便对高度进行参数化处理。\n\
  \n### 获取字符串的字符频率\n\n实现 `CharSequence` 接口的类有两个用的方法：`chars()` 和 `codePoints()`。它们返回一个\
  \ `IntStream`，在第一个方法中，流由扩展为 `int` 的 `char` 字符组成，而在第二个方法中，它们等同于 `int`。这种区别主要影响复合代码点，对于我们的情况，我们将坚持使用简单的\
  \ `chars()` 方法。\n\n`com/tutego/exercise/stream/LetterOccurrences.java`\n\n```\n\
  String input = \"eclectic\";\nString output =\n    input.chars()\n          .mapToObj(\
  \ c -> (char) c + \"\"\n                      + input.chars().filter(d -> d == c).count()\
  \ )\n          .collect( Collectors.joining( \"/\" ));\nSystem.out.println( output\
  \ ); // e2/c3/l1/e2/c3/t1/i1/c3\n```\n\n`IntStream` 为我们提供了包含每个字符的流。现在我们需要将这些字符与它们在输入字符串中的相应频率关联起来。为了计算频率，我们可以反复构建\
  \ `IntStream` 并使用 `filter` 方法和 `count()` 来查找流中字符的数量。如果我们将字符和这个计数器连接起来，在下一步中，我们将得到一个\
  \ `Stream<String>`，其中每个字符都已映射到这个对上。最后，这些对必须用斜杠组合在一起。这可以通过 `Collectors.joining(...)`\
  \ 的归约操作完成。\n\n### 从 1 到 0，从 10 到 9\n\n`com/tutego/exercise/stream/DecrementNumbers.java`\n\
  \n```\nprivate static String decrementNumbers( Reader input ) {\n  return new Scanner(\
  \ input )\n        .findAll( \"10|[1-9]\" )           // Stream<MatchResult>\n \
  \       .map( MatchResult::group )       // Stream<String>\n        .mapToInt( Integer::parseInt\
  \ )  // IntStream\n        .map( Math::decrementExact )    // IntStream\n      \
  \  .mapToObj( Integer::toString )  // Stream<String>\n        .collect( Collectors.joining(\
  \ \",\" \" ));\n}\n```\n\n通过巧妙选择的 `Stream`，任务可以通过一个表达式来解决。为了从开始到结束，让我们先看看涉及的步骤：\n\
  \n1. 将字符串拆分为单个数字。\n2. 归约数字。\n3. 将连接后的数字转换为字符串。\n\n第一步是识别数字。寻找部分字符串是正则表达式的任务。正则表达式可以使用\
  \ `Pattern` 类进行处理，但该类对我们的数据流没有帮助。另一个允许我们找到与正则表达式匹配的字符串的类是 `Scanner`。我们可以直接将 `Scanner`\
  \ 于到 `Reader` 上。`Scanner` 通过 `findAll(...)` 方法返回所有匹配项的 `Stream<MatchResult>`。正则表达式必须识别所有可能出现的数字，即\
  \ `10|9|8|…|1`。或逻辑连接可以简写为 `10|[1-9]`，但不能写为 `[1-9]|10`。\n\n匹配项以 `MatchResult` 的形式返回，我们必须通过\
  \ `group()` 回到主分组；这给了我们一个 `String`。对于求和，我们使用 `mapToInt(...)` 先将 `String` 转换为整数。这是通过\
  \ `Integer.parseInt(...)` 完成的。使用方法引用是完美的，因为 `Integer.parseInt(...)` 匹配 `Function`\
  \ 的签名。不会发生解析错误，因为正则表达式只匹配数字。\n\n整数本身必须减去 `1`。我们可以将其写成一个 lambda 表达式，但有一个合适的方法也可以通过方法引用访问：`Math.decrementExact(...)`；如果我们超过了值，它确实会抛出\
  \ `ArithmeticException`，但在我们的情况下不会发生。在减小数字后，一切都必须转换为字符串。这分两部分完成：在第一步中，每个整数单独转换为\
  \ `string`，然后使用一个特殊的 `collector` 将这些字符串组成一个字符串。\n\n### 年度竞赛\n\n如果我们想解决这个任务，必须将每个出现的数值与一个分子关联。这导致了如下流程：`com/tutego/exercise/stream/OctopusCont.java`\n\
  \n```\nint[] values = {1, 1, 2, 3, 4, 2, 3, 2, 1, 7, 3, 2, 2, 1};\nOptionalInt winner\
  \ =\n  IntStream.of(values)\n  .boxed()                          // IntStream\n\
  \  .collect(groupingBy(identity(), counting())) // Map<Integer,Long>\n  .entrySet()\
  \                      // Set<Entry<Integer,Long>>\n  .stream()                \
  \         // Stream<Entry<Integer,Long>>\n  .max(Comparator.comparingLong(Map.Entry::getValue))\
  \ // Optional<Entry<Integer,Long>>\n  .map(Map.Entry::getKey)           // Optional<Integer>\n\
  \  .map(OptionalInt::of).orElse(OptionalInt.empty()); // OptionalInt\nSystem.out.println(\
  \ winner );\n```\n\n* 由于我们想使用 Stream API 完成任务，它从创建一个流开始。首先，从原始类型数组生成一个 `IntStream`。\n\
  * 由于 `IntStream` 没有可以完成任务的有用方法，因此从 `IntStream` 生成一个 `Stream<Integer>`，即生成包装对象。\n\
  * 普通流允许通过 `collect(...)` 方法进行分组，并使用一个特殊的 `Collector` 创建一个 `Map`。键应该是流中的值，而关联值是出现频率。这两个方法都是静态导入的，完全调用为\
  \ `Function.identity()` 和 `Collectors.counting()`。结果是一个 `Map<integer, long>`。通过此，主要工作已经完成。\n\
  * 现在需要从反映频率的关联值中选择最大值。键和值都在 `Map` 中，无法按值排序。然而，集已经排序，因此构建了一个 `Set<Map.Entry<Integer,\
  \ Long>>`。\n* `entrySet()` 方法返回一个 `Set`，但我们无法轻易使用它确定最小或最大。然而，`Stream` 这种能力，因此构建了一个\
  \ `Stream<Map.Entry<Integer, Long>>`。\n\n### 合并三个 int 数组\n\n为了让我们的 `join(...)` 方法灵活，有两种实现。`join(int[]\
  \ numbers1, int[] numbers2, int[] numbers3, int maxSize)` 有一个额外的参数 `maxSize`，它限制了结果数组的元素数量。\n\
  \n\n\n\n\n# com/tutego/exercise/stream/JoinIntArrays.java\n\n```java\npublic static\
  \ final int MAX_ARRAY_LENGTH = Integer.MAX_VALUE - 8;\npublic static int[] join(\
  \ int[] numbers1, int[] numbers2, int[] numbers3,\n                         long\
  \ maxSize ) {\n  if ( maxSize > numbers1.length + numbers2.length + numbers3.length\
  \ )\n    throw new IllegalArgumentException(\n        \"The maximum number of elements\
  \ exceeds the number of total elements\" );\n\n    if ( maxSize > MAX_ARRAY_LENGTH\
  \ )\n      throw new IllegalArgumentException( \"Requested array size exceeds VM\n\
  limit\" );\n\n  return IntStream.concat( IntStream.of( numbers1 ),\n           \
  \               IntStream.concat( IntStream.of( numbers2 ),\n                  \
  \                          IntStream.of( numbers3 ) ) )\n                      \
  \        .limit( maxSize )\n                              .toArray();\n}\npublic\
  \ static int[] join( int[] numbers1, int[] numbers2, int[] numbers3 ) {\n  return\
  \ join( numbers1, numbers2, numbers3,\n              (long) numbers1.length + numbers2.length\
  \ + numbers3.length );\n}\n```\n\n为了让我们的 `join(…)` 方法更加灵活，这里有两种实现方式。`join(int[]\
  \ numbers1, int[] numbers2, int[] numbers3, int maxSize)` 有一个额外的参数 `maxSize`，用于限制结果数组的元素数量。让我们开始吧。\n\
  \n首先，我们运行了两个测试。\n\n1. 第一个测试检查所需的最大元素数量 `maxSize` 是否完全可以通过三个数组实现。如果元素数量较少，则应该抛出一个\
  \ `IllegalArgumentException` 并带上错误信息。\n2. 在目前，数组的大小不能大于 `Integer.MAX_VALUE - 8`，因此在建议的解决方案中有一个常量。因此，第二种分类讨论检查传递的\
  \ `maxSize` 是否超过了 Java 数组的最大限制。即使后续 `numbers1.length` + `numbers2.length > MAX_ARRAY_LENGTH`\
  \ 但只要 `maxSize` 小于 `MAX_ARRAY_LENGTH`，`Stream` 对象的 `limit(maxSize)` 就会让后续数组保持在范围内。\n\
  \nJava 中没有特殊的组合数组的方法，但原始类型流（primitive streams）救了急。`IntStream concat(IntStream a,\
  \ IntStream b)` 方法将两个 `IntStream` 实例合并成一个新的 `IntStream`。由于我们的源是 `int[]` 数组，`IntStream.of(…)`\
  \ 返回了所需的 `IntStream` 实例。由于没有带有三个参数或数据结构的参数化 `concat(…)` 方法，因此必须嵌套 `concat(…)`，要么通过\
  \ `concat(A, concat(B, C))` 或者 `concat(concat(A, B), C)`。紧接着通过 `limit(…)` 进行剪枝，最后通过\
  \ `toArray()` 创建所需的数组。带有三个参数的较简单方法 `join(…)` 计算总长度并委托给带有四个参数的方法。数组长度的类型为 `int`，我们将其扩展为\
  \ `long` 以便总和为 `long`，这样就不会溢出，然后我们可以看到总和并不大于 `MAX_ARRAY_LENGTH`。\n\n## 确定组合\n\n\
  算法方法是：声明一个接收字符串的方法。从这个字符串中删除第一个字符，然后用新字符串递归地调用该方法。然后删除第二个字符，再次递归调用该方法，以此此类推。当字符串没有字符且为空时，递归方法结束。上述方法位于\
  \ `removeLetter(…)`：com/tutego/exercise/stream/RemovingLetters.java\n\n```java\n\
  private static void removeLetter(String word, Set<String> words ) {\n  if ( word.isEmpty()\
  \ )\n    return;\n  words.add( word );\n  IntStream.range( 0, word.length() )\n\
  \      .mapToObj( i -> new StringBuilder(word).deleteCharAt(i).toString() )\n  \
  \    .forEach( substring -> removeLetter(substring, words) );\n}\npublic static\
  \ Set<String> removeLetter(String word ) {\n  Set<String> words = new HashSet<>();\n\
  \  removeLetter(word, words );\n  return words;\n}\n```\n\n结果字符串进入一个集合，重复的字符串会被过滤掉。由于调用者期望得到一个集合且不应向方法传递空容器，因此有第二个公共方法\
  \ `removeLetter(String)`。该方法构建一个 `HashSet`，将其连同单词传递给私有方法 `removeLetter(String, Set<String>)`并在最后返回新集合。\n\
  \n## 最快和最慢的划手\n\n任务的目标是创建一个 `DoubleSummaryStatistics` 对象。该统计对象提供了关于元素数量、最小值和平均值的信息。实现统计对象有两种方法。com/tutego/exercise/stream/PaddleCompetition.java\n\
  \n```java\nDoubleSummaryStatistics statistics =\n  stream.mapToDouble(Result::time).summaryStatistics();\n\
  System.out.printf( \"count: %d%n\", statistics.getCount() );\nSystem.out.printf(\
  \ \"min: %.0f%n\", statistics.getMin() );\nSystem.out.printf( \"max: %.0f%n\", statistics.getMax()\
  \ );\nSystem.out.printf( \"average: %.0f%n\", statistics.getAverage() );\n```\n\n\
  第一种变体是使用 `Stream<Result>` 中的时间创建一个 `DoubleStream`，然后在 `DoubleStream` 上调用 `summaryStatistics()`。第二种可能性是直接使用对应的\
  \ `Collector`：com/tutego/exercise/stream/PaddleCompetition.java\n\n```java\nDoubleSummaryStatistics\
  \ statistics =\n  stream.collect( Collectors.summarizingDouble(Result::time) );\n\
  ```\n\n可以直接向 `Collectors.summarizingDouble()` 提供一个提取函数，这节省了一个中间步骤。\n\n## 计算位数\n\n\
  com/tutego/exercise/stream/DoubleStreamMedian.java\n\n```java\npublic static double\
  \ median( double... values ) {\n  if (values.length < 1 )\n    throw new IllegalArgumentException(\
  \ \"array contains no elements\" );\n\n  int skip = (values.length - 1) / 2;\n \
  \ int limit = 2 - values.length % 2;\n  return Arrays.stream( values ).sorted().skip(\
  \ skip )\n      .limit( limit ).getAsDouble();\n}\n```\n\n按照惯，我们检查输入，如果数组不包含元素，则抛出异常。此外，如果\
  \ `values` 为 `null` 则会自动抛出异常。\n\n在计算位数时，我们需要导航到中间。我们需要考虑一个元素或两个元素。如果构建了 `DoubleStream`\
  \ 并进行排序，`skip(…)` 可以跳过某些元素以到达中间。接下来的 `limit(…)` 将流中的剩余元素减少到一个（数组为奇数）或两个（数组为偶数）。最后，链式调用进行平均值计算，对于一个值没什么可计算的，但对于两个值，`average()`\
  \ 方法提供了算术平均值。由于该方法需要浮点数作为结果，`getAsDouble()` 返回了该数字，由于流中只有一个元素，因此是有效的。\n\n最有趣的部分是偏移（skip）和限制（limit）的计算。为此，程序引入了两个根据长度得出的变量\
  \ `skip` 和 `limit`。两个示例：\n\n变量初始化如下：\n\n**表 6.1** `limit` 和 `skip` 赋值示例，列表中间的数值用加粗显示\n\
  \n| *LIST* | *SKIP* | *LIMIT* |\n| --- | --- | --- |\n| 9, 11, **11**, 11, 12 |\
  \ 2 | 1 |\n| 10, **10, 12**, 12 | 1 | 2 |\n\n```java\nint skip = (values.length\
  \ - 1) / 2;\nint limit = 2 - values.length % 2;\n```\n\n\n\n\n\n这两个变量都取决于数组的长度。中心点是数组长度除以二，这对于元素个数奇数的数组非常合适，但对于元素个数偶数的数组，直接除以二会产生一个问题。因为在这种情况下，我们需要考虑中心点左侧和右侧的两个元素。（这些元素甚至专门的名字，称为上中位数下中位数。）因此，如果在除以二之前将长度减\
  \ 1，我们会在中心点之前得到一个包含一个元素的偶数。为了清楚这一点：\n\n### 表 6.2 计算 `skip` 的示例，列表中间的值用**粗体**显示\n\
  \n| `LIST` | `(VALUES.LENGTH - 1) / 2` | `(VALUES.LENGTH) / 2` |\n| --- | --- |\
  \ --- |\n| 9, 11, **11**, 11, 12 | (5 – 1) / 2 = 2 | 5 / 2 = 2 |\n| 10, **10, 12**,\
  \ 12 | (4 – 1) / 2 = 1 | 4 / 2 = 2 |\n\n对于数组中偶数个元素，限制必须是 `2`，对于奇数个元素是 `1`。`values.length\
  \ % 2` 对于偶数返回 `0`，对于奇数返回 `1`。因此，表达式 `2 - values.length % 2` 对于偶数返回 `2 - 0` = `2`，对于奇数返回\
  \ `2 - 1`，即 `1`。\n\n#### 计算温度统计并绘制图表\n\n该任务分为几个方法。方法 `randomTemperaturesForYear(Year)`\
  \ 为每年的每一天生成一个随机温度。另一个方法 `createRandomTemperatureMap()` 调用五次 `randomTemperaturesForYear(…)`。在命令行上以小表格形式的输出由另一个方法\
  \ `printTemperatureTable(…)` 实现。最后，方法 `writeTemperatureHtmlFile(…)` 将平均值写入文件。\n\n\
  让我们从 `randomTemperaturesForYear(Year)` 开始。\n\n**com/tutego/exercise/stream/TemperatureYearChart.java**\n\
  \n```java\nprivate static int[] randomTemperaturesForYear( Year year ) {\n  int\
  \ daysInYear = year.length();\n  return IntStream.range( 0, daysInYear )\n     \
  \ .mapToDouble( value -> sin( value * PI / daysInYear ) ) // 0..1\n      .map( value\
  \ -> value * 20 ) // 0..20\n      .map( value -> value + 10 ) // 10..30\n      .mapToInt(\
  \ value -> (int) (value + 3 * (random() - 0.5)) )\n      .toArray();\n}\nprivate\
  \ static SortedMap<Year, int[]> createRandomTemperatureMap() {\n  UnaryOperator<Year>\
  \ previousYear = year -> year.minusYears( 1 );\n  return Stream\n      .iterate(\
  \ Year.now(), previousYear )\n      .limit( 5 )\n      .collect( toSortedMap( identity(),\n\
  \                          TemperatureYearChart::randomTemperaturesForYear ) );\n\
  }\n\nprivate static Collector<Year, ?, TreeMap<Year, int[]>>\ntoSortedMap( Function<Year,\
  \ Year> keyMapper,\n            Function<Year, int[]> valueMapper ) {\n  return\
  \ Collectors.toMap( keyMapper,\n                         valueMapper,\n        \
  \                 (y1, y2) -> {throw new RuntimeException(\"Duplicates\");},\n \
  \                        TreeMap::new);\n}\n```\n\n特殊数据类型 `Year` 很有用，因为它通过 `length()`\
  \ 方法返回一年的天数，因为每年都是 365 天。有了这一年的天数，我们可以构建一个 `IntStream`，然后为每年的每一天生成一个随机温度。平均分布出现在曲线上：在年的开始和结束时温度最低，年中最高。这是我们可以用正弦函数很好表达的内容。因此，我们将整数转换为正弦值。年的第一天对应于\
  \ `0` 的正弦值，年的最后一天结果为 `π` 的正弦值，再次为 `0`。之间是山峰。`0` 到 `1` 之间的正弦值很小，`π` 的最大值为 `1`，因此在下一步中将值乘以\
  \ `20`，然后在下一步中加上 `10`。这些值不是随机的，所以最后一个映射引入了一些随机性，使得正弦值上下波动。\n\n`createRandomTemperatureMap()`\
  \ 使用 `randomTemperaturesForYear(…)` 构建一个包含五个元素的 `Stream<Year>`，从当前年份开始，每次移动一年。结果是与每个年份关联的温度值的\
  \ `SortedMap<Year, int[]>`。然而，不应使用带有两个参数 `toMap(keyMapper, valueMapper)`，因为没有对 `Map`\
  \ 的预测——OpenJDK 内部使用 `HashMap`。在我们的情况下，一个按年份排序的 `Map` 是用的。因此，使用了 `toMap(keyMapper,\
  \ valueMapper, mergeFunction, mapFactory)`，以便显式地让数据进入 `TreeMap`。\n\n这可以输出：\n\n**com/tutego/exercise/stream/TemperatureYearChart.java**\n\
  \n```java\nprivate static void printTemperatureTable(SortedMap<Year, int[]> yearTemperatures)\
  \ {\n  yearTemperatures.forEach( (year, temperatures) -> {\n    String temperatureCells\
  \ =\n      Arrays.stream(temperatures)\n      .mapToObj( temperature -> String.format(\"\
  %2d\", temperature) )\n      .collect( Collectors.joining(\"|\", \"|\") );\n   \
  \ System.out.println(\"| \" + year + \" \" + temperatureCells );\n  } );\n}\n```\n\
  \n`printTemperatureTable(…)` 负责打印所有年份的表格。传递的是一个将年份与温度关联的关联存储。`forEach(…)` 方法遍历按年份排序的数据结构并创建一个字符串\
  \ `temperatureCells`。为了构建字符串，第一步是将 `int` 数组转换为 `IntStream`。每个温度值映射为字符串，小于 10 的值带有前导空格，以便输出始终为两位。收集器合并所有单独字符串，结果是\
  \ `temperatureCells`。这个带有温度值的字符串连同之前的年份打印在屏幕上。\n\n让我们继续统计部分：\n\n**com/tutego/exercise/stream/TemperatureYearChart.java**\n\
  \n```java\nIntSummaryStatistics yearStatistics =\n    Arrays.stream(yearTemperatures.get(Year.now())).summaryStatistics();\n\
  System.out.printf(\"max: %d, min: %d%n\", yearStatistics.getMax(), yearStatistics.getMin());\n\
  ```\n\n我们已经使用了几次 `Arrays.stream(…)` 方法，它是 `IntStream.of(…)` 的替代方案，从 `int` 数组创建 `IntStream`。与普通的\
  \ `Stream` 对象相比，三个原始类型流有一个特殊方法 `summaryStatistics()`，提供关于最小值、最大值和平均值的统计对象。我们可以轻松地获取这些信息并输出。\n\
  \n一个独立的方法 `getStatistics(…)` 从 `Map` 中检索一年某月份的 `IntSummaryStatistics`：\n\n**com/tutego/exercise/stream/TemperatureYearChart.java**\n\
  \n```java\nprivate static IntSummaryStatistics getStatistics(YearMonth yearMonth,\
  \ int... temperatures) {\n  int start = yearMonth.atDay(1).getDayOfYear();\n  int\
  \ end = yearMonth.atEndOfMonth().getDayOfYear();\n  return Arrays.stream(temperatures,\
  \ start - 1, end).summaryStatistics();\n}\n```\n\n\n\n\n在传递的 `int` 数组 `temperatures`\
  \ 中，存储了全年的所有温度值。如果我们想计算特定月份的统计数据，必须在适当的位置构建一个子数组。这可以通过 `Arrays.stream(…)` 很好地解决，因为可以提供数组的起始和结束索引。对于大约\
  \ 365 天的一年，出现的问题是：3 月或 12 月这样的月份到底什么时候开始？答案由 `YearMonth` 对象提供。对于起始值，我们通过 `atDay(1)`\
  \ 请求一个新的代表月初的 `YearMonth` 对象，并通过 `getDayOfYear()` 获取该年的第几天。对于月份的最后一天，我们同样的操作，使用\
  \ `atEndOfMonth()` 方法将 `YearMonth` 对象设置为月末。我们将起始和结束值传递给 `Arrays.stream(…)`，月份从 1\
  \ 开始，我们需要将起始值向左移动一位。此外，我们不需要将结束值左移动一位，因为该值是排除性的而非包含性的。\n\n可以如下方式调用方法：\n\n`com/tutego/exercise/stream/TemperatureYearChart.java`\n\
  \n```\nIntSummaryStatistics monthStatistics =\n    getStatistics( YearMonth.of(\
  \ 2020, SEPTEMBER ),\n                   yearToTemperatures.get( Year.now() );\n\
  System.out.printf( \"max: %d, min: %d, average: %.2f%n\", monthStatistics.\ngetMax(),\n\
  \                  monthStatistics.getMin(), monthStatistics.getAverage() );\n```\n\
  \n最后，是写入文件的方法：\n\n`com/tutego/exercise/stream/TemperatureYearChart.java`\n\n```\n\
  \ private static void writeTemperatureHtmlFile(\n     Year year, Map<Year, int[]>\
  \ yearToTemperatures, Path path )\n        throws IOException {\n  String template\
  \ = \"\"\"\n<!DOCTYPE html><html>\n <head><meta charset=\"UTF-8\"></head>\n <body>\n\
  \ <canvas></canvas>\n <script src=\"https://cdn.jsdelivr.net/npm/chart.js@3.3.2/dist/chart.min.js\"\
  >\n </script>\n <script>\n   const cfg = {\n    type: \"bar\",\n    data: {\n  \
  \   labels:\"Jan. Feb. Mar. Apr. May June July Aug. Sept. Oct. Nov.\nDec.\".split(\"\
  \ \"),\n      datasets: [{\n      label: \"Average temperature\",\n      data: [%s],\n\
  \     }]\n     }\n   };\n   window.onload==>new Chart(document.querySelector(\"\
  canvas\").\ngetContext(\"2d\"),cfg);\n </script>\n </body></html>\"\"\";\n  String\
  \ formattedTemperatures =\n      IntStream.rangeClosed( JANUARY.getValue(), DECEMBER.getValue()\
  \ )\n          .mapToObj( Month::of )\n          .map( month -> year.atMonth( month\
  \ ) )\n          .map( yearMonth->getStatistics(yearMonth,yearToTemperatures.\n\
  get(year)) )\n          .map( IntSummaryStatistics::getAverage )\n          .map(\
  \ avgTemperature -> String.format( ENGLISH, \"%.1f\",\navgTemperature ) )\n    \
  \      .collect( Collectors.joining( \",\" ));\n  String html = String.format( template,\
  \ formattedTemperatures );\n  Files.writeString( path, html );\n}\n```\n\nHTML 文档的声明占据了该方法最大的区域。在某处处写着\
  \ `data: [%s]`，这个 `%s` 是格式化字符串中典型的占位符，以便我们稍后可以使用 `String.format(…)` 插入动态计算的值。方法的执行步骤如下：\n\
  \n* `rangeClosed(…)` 返回一个包含 1 到 12 数字的 `IntStream`。\n* `mapToObj(…)` 将这些数字转换为 `Month`\
  \ 对象。\n* 将年份传递给 `writeTemperatureHtmlFile(…)`。`year.atMonth(month)` 将年份与迭代中的月份关联并返回一个新的\
  \ `YearMonth` 对象。Lambda 表达式 `month->year.atMonth(month)` 可以缩写为 `year::atMonth`，但这样更具读性。\n\
  * 生成的 `Stream<YearMonth>` 可以通过 `IntSummaryStatistics` 中的 `getStatistics(…)` 方法进行访问；结果是\
  \ `Stream<IntSummaryStatistics>`。\n* 从 `IntSummaryStatistics` 通过方法引用获取平均值，创建 `Stream<Double>`。\n\
  * 最后，我们对该平均值进行格式化，为该月份创建一个字符串。\n* 对所有月份执行此操作，最后收集字符串并用逗号分隔。\n\n最后，字符串 `formattedTemperatures`\
  \ 包含了结果，该结果必须插入到 HTML 文档中。在创建完整的 HTML 文档后，`write(…)` 创建文件。`writeTemperatureHtmlFile(…)`\
  \ 可以如下所示使用：\n\n`com/tutego/exercise/stream/TemperatureYearChart.java`\n\n```\ntry\
  \ {\n  Path tempFile = Files.createTempFile(\"temperatures\", \".html\");\n  writeTemperatureHtmlFile(Year.now(),\
  \ yearToTemperatures, tempFile);\n  Desktop.getDesktop().browse(tempFile.toUri());\n\
  } catch (IOException e) { e.printStackTrace(); }\n```\n\n# 7 文件、目录和文件访问\n\nDOI:\
  \ [10.1201/978103495550-8](https://doi.org/10.1201/978103495550-8)\n\n尽管一切都移向了云端，且数据库变得流行，但老旧的文件系统对于存储和组织重要文档仍然非常有用。即使是像精通技术的\
  \ Captain Bonny Brain 和 Captain Ciao 这样的人，仍然严重依赖本地存储。你知道的，有些事情是不应该见见光的，对吧？\n\n##\
  \ 前提条件\n\n* 熟悉 `File` 类、`Path` 接口和 `Files` 类的基础。\n* 能够创建临时文件。\n* 能够从文件和目录提取元数据。\n\
  * 能够列出并过滤目录内容。\n* 读写完整文件。\n* 熟悉 `RandomAccessFile`。\n\n本章使用的数据类型：\n\n* `java.io.File`\n\
  * `java.nio.file.Path`\n* `java.nio.file.Paths`\n* `java.nio.file.Files`\n* `java.nio.file.DirectoryStream`\n\
  * `java.nio.file.FileVisitor`\n* `java.io.RandomAccessFile`\n* `java.awt.Desktop`\n\
  \n## Path 和 Files\n\n与 Java 中的许多事情一样，处理文件时有“旧”方法和“新”方法。在许多示例中，你仍然看到使用 `java.io.File`、`FileInputStream`、`FileOutputStream`、`FileReader`\
  \ 和 `FileWriter` 代码。这些类型已经过时，因此在本章中专门处理 `Path` 和 `Files`，因为这些类型允许使用虚拟文件系统（例如 ZIP\
  \ 存档）。`File` 现在只有在实际处理本地文件系统的文件或目录时才需要；例如使用操作系统关联的程序打开文件或重定向数据流。\n\n### 显示每日格言\n\
  \nCaptain Ciao 有时无法获得动力。每天的一句励志或感悟格言能让他产生新想法。任务是编写一个程序生成包含格言的 HTML 文件，然后打开浏览器显示。该练习可以使用\
  \ `java.nio.files.Files` 的两个方法解决。\n\n练习：\n\n* 使用适当的 `files` 方法创建一个以 `.html` 结尾的临时文件。\n\
  * 在新的临时文件中写入 HTML 代码，如下：\n\n```html\n<!DOCTYPE html><html><body>\n'我们偷的东西告诉了我们是谁。'\n\
  - Thomas of Tew\n</body></html>\n```\n\n* 使用 `java.awt.Desktop` 类中的一个方法打开默认浏览器并显示该\
  \ HTML 文件。\n\n### 合并藏身点\n\n使用某些 `Files` 方法，可以到位读取并重写整个文件。\n\nCaptain Ciao 在一个大文本文件中收集潜在的藏身点。但他经常会自发想到更多藏身点，并迅速将它们写入一个新文件。现在他花时间清理并合并一切；将小文件的内容合并到大文件中。重要的是大文件的条目顺序不能发生变化。只有当小文件中的条目不在大文件中时，才包含它们。\n\
  \n\n\n\n- 编写一个方法 `mergeFiles(Path main, Path... temp)`，它打开主文件，添加所有临时内容，然后将其写回主文件。\n\
  \n## 创建文件的副本 ★★\n\n如果你在 Windows 资源管理器中将文件复制到同一个文件夹，就会创建一个副本。该副本会自动获得一个新名称。我们正在寻找一个能够复制这种行为的\
  \ Java 程序。\n\n练习：\n\n- 编写一个 Java 方法 `cloneFile(Path path)`，用于创建文件的副本并系统地生成文件名。假设\
  \ `name` 代表文件名，那么第一个副本将是 `Copy of` `name`，之后的文件应为 `Copy (number) of` `name`。\n\n\
  - 如果在目录上调用该方法或发生其他错误，该方法可能会抛出 `IOException`。\n\n示例：\n\n- 假设一个文件名为 `Top Secret UFO\
  \ Files.txt`。那么新的文件名应该如下：\n    - `Copy of Top Secret UFO Files.txt.`\n    - `Copy\
  \ (2) of from Top Secret UFO Files.txt.`\n    - `Copy (3) of from Top Secret UFO\
  \ Files.txt.`\n\n## 生成目录列表 ★\n\n在命令行中，用户可以显示目录内容和元数据，就像文件选择框向用户显示文件一样。\n\n练习：\n\n\
  - 使用 `Files` 和 `newDirectoryStream(…)` 方法，编写一个程序列出当前目录的目录。\n\n- 在 DOS 下运行 `dir`\
  \ 程序。完全重建目录列表的输出。不需要页眉和页脚\n\n## 搜索大型 GIF 文件 ★\n\nBonny Brain 的硬盘上有一团乱糟，部分是因为她将所有图像都存储在同一个目录中。现在，上一次寻宝活动的图片无从追踪了！她只记得图像被保存为\
  \ GIF（图形交换格式）格式，且宽度超过 1024 像素。\n\n练习：\n\n- 给定任意目录。在此目录中（非递归！）搜索所有 GIF 类型且宽度至少为 1024\
  \ 像素的图像。\n\n访问以下代码以读取宽度并进行 GIF 检查：\n\n```\nprivate static final byte[] GIF87aGIF89a\
  \ = \"GIF87aGIF89a\".getBytes();\nprivate static boolean isGifAndWidthGreaterThan1024(\
  \ Path entry ) {\n  if ( ! Files.isRegularFile( entry ) || ! Files.isReadable( entry\
  \ ) )\n    return false;\n  try ( RandomAccessFile raf = new RandomAccessFile( entry.toFile(),\
  \ \"r\" ) {\n    byte[] bytes = new byte[ 8 ];\n    raf.read( bytes );\n    if (\
  \ ! Arrays.equals( bytes, 0, 6, GIF87aGIF89a, 0, 6 ) &&\n        ! Arrays.equals(\
  \ bytes, 0, 6, GIF87aGIF89a, 6, 12 ) )\n      return false;\n    int width = bytes[\
  \ 6 ] + (bytes[ 7 ] << 8);\n    return width > 1024;\n  }\n  catch ( IOException\
  \ e ) {\n    throw new UncheckedIOException( e );\n  }\n}\n```\n\n该方法读取前几个字节并检查前六个字节是否匹配字符串\
  \ `GIF87a` 或 `GIF89a`。原则上，此测试也可以通过 `new String(bytes, 0, 6).matches(\"GIF87a|GIF89a\"\
  )` 来实现，但这会在内存中产生一些临时对象。\n\n检查后，程序读取 2 个字节获取宽度，并将字节转换为 16 位整数。\n\n## 递归遍历目录并查找空文本文件\
  \ ★\n\nBonny Brain 的硬盘上仍然一团糟。由于某种无法解释的原因，它有很多 0 字节的文本文件。\n\n练习：\n\n- 使用 `FileVisitor`，从选定的起始目录递归运行所有子目录，寻找空文本文件。\n\
  \n- 文本文件是指扩展名为 `*.txt` 的文件（不区分大小写）。\n\n- 如果找到，在控制台上显示该文件的绝对路径。\n\n## 开发自己的文件过滤器工具库\
  \ ★★★\n\n`Files` 类提供了三个静态方法来查询目录中的所有条目：\n\n- `newDirectoryStream(Path dir)`\n- `newDirectoryStream(Path\
  \ dir, glob)`\n- `newDirectoryStream(Path dir, DirectoryStream<?super Path> filter)`\n\
  \n结果始终是一个 `DirectoryStream<Path>`。第一个方法不进行过滤，第二个方法允许诸如 `*.txt` 的通配符，而第三个方法允许任何过滤器。\n\
  \n`java.nio.file.DirectoryStream.Filter<T>` 是过滤器必须实现的接口。`accept(T entry)` 方法类似于谓词。Java\
  \ 库声明了该接口，但没有实现。\n\n练习：\n\n- 编写 `DirectoryStream.Filter` 的各种实现，可以检查文件的：\n    - 属性（如可读、可写）。\n\
  \    - 长度。\n    - 文件扩展名。\n    - 通过正则表达式检查文件名。\n    - 幻数标识（Magic identifiers）。\n\n\
  理想情况下，API 允许所有过滤器进行连接，如下所示：\n\n```\nDirectoryStream.Filter<Path> filter =\n    readable\n\
  \    .largerThan(100)\n    .magicNumber(0x89, 'P', 'G')\n    .globMatches(\"*.png\"\
  )\n    .regexContains(\"[-]\");\ntry(var entries=Files.newDirectoryStream(dir,filter))\
  \ {\n  entries.forEach(System.out::println);\n}\n```\n\n## 文件内容的随机访问\n\n对于文件，可以获取输入/输出流并从头到尾读取或写入。另一种\
  \ API 允许随机访问，即指针。\n\n### 输出文本文件的最后行 ★★\n\n现在 Ciao 对文件的最后一行感兴趣。文本以 UTF-8 写入。由于日志中已经有很多条目，无法完全读取文件。\n\
  \n练习：\n\n- 编写一个返回文本文件最后行的程序。\n- 寻找一个不需要内存的解决方案。\n\n![圆圈内的信息符号](img/Icon_01.jpg)\
  \ 考虑 `([^\\n]*)$` 是否可以有意义地使用。\n\n## 解决方案\n\n### 每日格言\n\ncom/tutego/exercise/io/DailyWisdom.java\n\
  \n```java\ntry {\n  String html = \"\"\"\n<!DOCTYPE html><html><body>\n我们偷的东西告诉我们是谁。\n\
  - Thomas von Tew</body></html>\"\"\";\n  Path tmpPath = Files.createTempFile(\"\
  wisdom\", \".html\");\n  Files.writeString(tmpPath, html);\n  Desktop.getDesktop().open(tmpPath.toFile());\n\
  }\ncatch (IOException e) {\n  System.err.println(\"无法在临时文件夹写入 HTML 文件或打开文件\");\n\
  \  e.printStackTrace();\n}\n```\n\n在建议的解决方案中，我们处理三个核心语句。首先，是在临时目录中创建文件。在 `createTempFile(…)`\
  \ 方法中，我们可以指定文件名的一部分以及后缀，我们选择扩展名 `.html`，以便稍后操作系统可以通过该扩展名选择相应的查看器。它返回 `createTempFile(…)`\
  \ 生成的 `Path`，我们使用它将字符串写入该文件。\n\n`open(…)` 是少数需要 `File` 对象的方法之一。从 `Path` 我们生成 `File`\
  \ 对象并使用它打开浏览器，浏览器应该与渲染 HTML 文件相关。\n\n### 合并隐藏地点\n\ncom/tutego/exercise/io/MergeFiles.java\n\
  \n\n\n\n\n```java\npublic static void mergeFiles(Path main, Path... temp) throws\
  \ IOException\n{\n  Iterable<Path> paths =\n      Stream.concat(Stream.of(main),\
  \ Stream.of(temp))::iterator;\n  Collection<String> words = new LinkedHashSet<>();\n\
  \  for (Path path : paths)\n    try (Stream<String> lines = Files.lines(path)) {\n\
  \      lines.forEach(words::add);\n    }\n  Files.write(main, words);\n}\n```\n\n\
  对于我们的任务，`LinkedHashSet` 数据结构是理想的选择，因为作为一个集合，它只包含一次的元素，并且它考虑了插入元素的顺序。我们只需要确保第一个文件的行首先进入数据结构，然后是剩余文件的行。\n\
  \n在读取行并将其插入数据结构时，第一个文件的处理方式应与其他所有文件相同。但这种统一只能通过一种变通方法（workaround）实现，因为参数列表中的第一个数据类型是单个\
  \ `Path` 变量，随后是一个变长参数（vararg），即 `Path` 数组。建议的解决方案首先将第一个元素放入 `Stream` 中，并将其与变长参数数组中元素的第二个流合并；结果是一个\
  \ `Stream<Path>`。我们只需要运行这个流即可。理论上，这里可以使用 `forEach(…)`，但存在一个问题：输入/输出操作会抛出检查异常，而这些异常与\
  \ lambda 表达式不兼容。因此，`Stream` 被转换为 `Iterable`，以便我们使用扩展的 `for` 循环。`::iterator` 方法引用返回一个\
  \ `Iterable` 类型的表达式；这是一个巧妙的技巧，因为 `Stream` 本身并没有实现 `Iterable`。\n\n扩展 `for` 循环遍历文件，读取所有行，将它们放入数据结构中，最后将所有行写回第一个文件。\n\
  \n### 创建文件的副本\n\n**com/tutego/exercise/io/FileClone.java**\n\n```java\nprivate static\
  \ final String COPY_OF_FORMAT_STRING = \"Copy of %s\";\nprivate static final String\
  \ NUMBERED_COPY_OF_FORMAT_STRING = \"Copy (%d) of %s\";\npublic static void cloneFile(Path\
  \ path) throws IOException {\n  if (Files.isDirectory(path))\n    throw new IllegalArgumentException(\"\
  Path to be a file but was a directory\");\n  Path parent = path.getParent();\n \
  \ Path filename = path.getFileName();\n  Path copyPath = parent.resolve(COPY_OF_FORMAT_STRING.formatted(filename));\n\
  \  for (int i = 2; Files.exists(copyPath); i++)\n    copyPath = parent.resolve(NUMBERED_COPY_OF_FORMAT_STRING.formatted(i,\
  \ filename));\n  Files.copy(path, copyPath);\n}\n```\n\n建议解决方案中的算法通过按顺序生成可能的文件名并测试，直到找到空闲文件名。计数从\
  \ `2` 开始。不存在 `Name` 的 `Copy (1)`。\n\n如果意外传递了目录，`cloneFile(Path)` 方法将启动并在那种情况下抛出异常；它无法克隆目录。如果是文件，我们提取目录和文件名。\n\
  \n新文件名的第一个示例以 `Copy` 开头且不包含计数器。我们可以使用 `Files.exists(…)` 测试此文件名。如果文件存在，我们必须继续使用计数器。因此，我们将这种存在性作为\
  \ `for` 循环中的条件，并使用计数器 `i`，我们在开始时将其初始化为 `2` 以便表示计数器。在循环体中，重新赋值变量 `copyPath`，始终使用循环计数器。我们运行循环直到找到一个不存在的\
  \ `copyPath`。然后循环终止，`Files.copy(…)` 使用 `copyPath` 的路径创建文件的副本。\n\n为了方便为不同的语言更改字符串，它们被提取为常量。\n\
  \n### 生成目录列表\n\n**com/tutego/exercise/io/DosDir.java**\n\n```java\nprivate static\
  \ final DateTimeFormatter ddMyyy_hhmm =\n  DateTimeFormatter.ofPattern(\"dd.MM.yyyy\
  \ hh:mm\");\nstatic void listDirectory(Path dir) throws IOException {\n  try (DirectoryStream<Path>\
  \ entries = Files.newDirectoryStream(dir)) {\n    for (Path path : entries) {\n\
  \      Instant instant = Files.getLastModifiedTime(path).toInstant();\n      LocalDateTime\
  \ dateTime = LocalDateTime.ofInstant(instant,\n          ZoneId.systemDefault());\n\
  \      String formattedDateTime = dateTime.format(ddMyyy_hhmm);\n      String dirLength\
  \ = Files.isDirectory(path)\n          ? \"<DIR>        \"\n          : String.format(\"\
  %,14d\", Files.size(path));\n      String filename = path.getFileName().toString();\n\
  \      System.out.printf(\"%s  %s %s%n\", formattedDateTime, dirLength,\n      \
  \    filename);\n    }\n  }\n}\n```\n\n为了解决此任务，不同的 API 结合在一起。我们需要 `Files` 类、`Path`\
  \ 类型、日期/时间计算以及格式字符串。\n\n由于文件操作可能会抛出潜在异常，但我们无法处理它们，因此我们的 `try`-with-resources 派上了用场——该资源是\
  \ `DirectoryStream`。在任何情况下，你经常会看到 `DirectoryStream` 作为一个 `Iterable`。变量 `path` 现在包含一个路径，我们想要最后访问的时间。尽管\
  \ `Files.getLastModifiedTime(…)` 返回了必要的 `FileTime` 对象，但它首先被转换为 `Instant`，这允许我们使用模式为\
  \ `\"dd.MM.yyyy hh:mm\"` 的 `DateTimeFormatter`，为该格式引入了一个独立的常量。\n\n我们使用 `for` 循环遍历所有项。根据路径是目录还是文件，我们需要设置\
  \ `<DIR>`，或者在文件的情况下，获取文件大小；`String.format(…)` 将字节数格式化为适当长度。在最后一步，我们获取文件或目录名称并将所有内容组合成一行。该行以格式化的日期和时间开始，其他部分在其后。\n\
  \n### 搜索大型 GIF 文件\n\n对于解决方案，我们回到了 `Files` 方法：\n\n```java\nnewDirectoryStream(Path\
  \ dir, DirectoryStream.Filter<?super Path> filter)\n```\n\n对我们来说，`DirectoryStream.Filter`<?\
  \ `super Path`> `filter` 是相关的，因为它可以用于实现限制结果的标准。作为背景，让我们看看 UML 图：\n\n![展示了一个统一建模语言图。Filter\
  \ 接口连接到 directorystream 接口，后者连接到 iterable 和 closeable 接口。](img/Fig07_01.jpg)\n\n\
  **图 7.1** `DirectoryStream` 及其依赖类型的 UML 图\n\n实现可以通过类、lambda 表达式或方法引用完成。“幸运”的是，`boolean\
  \ isGifAndWidthGreaterThan1024(Path entry)` 匹配 `boolean accept(Path entry)`，这暗示可以使用方法引用。\n\
  \n**com/tutego/exercise/io/FindBigGifImages.java**\n\n\n\n\n\n```java\nPath directory\
  \ = Paths.get( name );\ntry {\n  try ( DirectoryStream<Path> files =\n         \
  \ Files.newDirectoryStream( directory,\n                  FindBigGifImages::isGifAndWidthGreaterThan1024\
  \ ) ) {\n    files.forEach( System.out::println );\n  }\n}\ncatch ( IOException\
  \ e ) {\n  e.printStackTrace();\n}\n```\n\n`Files.newDirectoryStream(…)` 方法返回 `DirectoryStream`，它是\
  \ `AutoCloseable` 的，必须在结束时再次关闭。这通过 `try`-with-resources 方便地完成。`DirectoryStream`\
  \ 也是一个 `Iterable`，因此我们可以在扩展的 `for` 循环或配合 `forEach(…)` 以及适当的 `Consumer` 来运行它。\n\n\
  ### 递归遍历目录并查找空文本文件\n\n`com/tutego/exercise/io/EmptyFilesFinder.java`\n\n```java\n\
  public static void findEmptyTextFiles( Path base, Consumer<Path> callback )\n  \
  \  throws IOException {\n  class PrintingFileVisitor extends SimpleFileVisitor<Path>\
  \ {\n    @Override\n    public FileVisitResult visitFile( Path visitedFile,\n  \
  \                                    BasicFileAttributes fileAttributes ) {\n  \
  \    if ( visitedFile.toString().toLowerCase().endsWith( \".txt\" )\n          &&\
  \ fileAttributes.size() == 0L )\n        callback.accept( visitedFile );\n     \
  \ return FileVisitResult.CONTINUE;\n    }\n  }\n  Files.walkFileTree( base, new\
  \ PrintingFileVisitor() );\n}\n```\n\n该解决方案实现了带有两个参数的 `findEmptyTextFiles(…)` 方法：第一个参数用于基础目录，而第二个参数是一个消费者，每当找到路径时就会被调用。\n\
  \n静态方法 `Files.walkFileTree(…)` 会从目录开始按照指定的深度递归遍历文件系统。在我们的案例中，我们没有限制深度，也没有提供任何其他选项。该方法必须作为\
  \ `FileVisitor` 的实现传递。它不是一个函数式接口，而是一个具有四个方法的接口。我们可以自己实现该接口，但 Java 库提供了一个带有 `SimpleFileVisitor`\
  \ 的简单实现。\n\n![一张图展示了统一建模语言（UML）图。SimpleFileVisitor 连接到 FileVisitor 接口，该接口位于 Enumeration:\
  \ FileVisitResult 旁边。](img/Fig07_02.jpg)\n\n**图 7.2** `FileVisitor` 的 UML 图、子类 `SimpleFileVisitor`\
  \ 以及用于返回的枚举 `FileVisitResult`。\n\n我们从该类创建一个子类并重写与我们相关的 `visitFile(…)` 方法，该方法每当 `walkFileTree(…)`\
  \ 找到文件时就会被调用。过滤器不允许 `walkFileTree(…)`，遗憾的是 `newDirectoryStream(…)` 允许过滤器。因此，我们必须自己实现以\
  \ `.txt` 结尾且大小为 0 字节的标准。感谢的是，`visitFile(…)` 为我们提供了：\n\n1. 路径，我们可以检查文件名是否以 `.txt.`\
  \ 结尾。\n2. 属性，我们可以测试文件是否为空。\n\n如果两个标准都正确，我们就调用回调函数并传递文件的路径。然后我们希望继续在目录中搜索，为此方法返回\
  \ `FileVisitResult.CONTINUE`。\n\n### 为你自己的自己的文件过滤器工具库\n\n`com/tutego/exercise/io/FileFiltersDemo.java`\n\
  \n```java\nclass FileFilters {\n  public interface AbstractFilter extends DirectoryStream.Filter<Path>\
  \ {\n    default AbstractFilter and( AbstractFilter other ) {\n      return path\
  \ -> accept( path ) && other.accept( path );\n    }\n    default AbstractFilter\
  \ negate() {\n      return path -> !accept( path );\n    }\n    static AbstractFilter\
  \ not( AbstractFilter target ) {\n      return target.negate();\n    }\n    /**\n\
  \     * 测试 Path 是否可读。\n     */\n    static final AbstractFilter readable = Files::isReadable;\n\
  \    /**\n     * 测试 Path 是否可写。\n     */\n    static final AbstractFilter writable\
  \ = Files::isWritable;\n    /**\n     * 测试 Path 是否为目录。\n     */\n    static final\
  \ AbstractFilter directory = Files::isDirectory;\n    /**\n     * 测试 Path 是否为普通文件。\n\
  \     */\n    static final AbstractFilter regularFile = Files::isRegularFile;\n\
  \    /**\n     * 测试 Path 是否隐藏。\n     */\n    static final AbstractFilter hidden\
  \ = Files::isHidden;\n    /**\n     * 测试 Path 的大小是否为零。\n     */\n    static final\
  \ AbstractFilter empty = path -> Files.size(path ) == 0L;\n    /**\n     * 测试 Path\
  \ 的大小是否大于指定的大小。\n     */\n    static AbstractFilter largerThan( long size ) {\n\
  \      return path -> Files.size(path ) > size;\n    }\n    /**\n     * 测试 Path\
  \ 的大小是否小于指定的大小。\n     */\n    static AbstractFilter smallerThan( long size ) {\n\
  \      return path -> Files.size(path ) < size;\n    }\n    /**\n     * 测试 Path\
  \ 是否比指定的 FileTime 更旧。\n     */\n    static AbstractFilter olderThan( FileTime other\
  \ ) {\n      return path -> Files.getLastModifiedTime( path ).compareTo( other )\
  \ > 0;\n    }\n    /**\n     * 测试 Path 是否具有特定的后缀，忽略大小写，例如 \".txt\"。\n     */\n \
  \   static AbstractFilter suffix( String suffix, String... more ) {\n      return\
  \ path ->\n        Stream.concat( Stream.of( suffix ), Stream.of( more ) )\n   \
  \       .anyMatch( Suffix -> {\n            String filename = path.toString();\n\
  \            int suffixLen = Suffix.length();\n            int suffixOffset = filename.length()\
  \ - suffixLen;\n            return filename.regionMatches( true, suffixOffset, Suffix,\
  \ 0, suffixLen );\n          } );\n    }\n    /**\n     * 测试 Path 的内容是否以指定的字节序列开头。\n\
  \     */\n    static AbstractFilter magicNumber( int... bytes ) {\n      ByteBuffer\
  \ byteBuffer = ByteBuffer.allocate( bytes.length );\n      for ( int b : bytes )\
  \ byteBuffer.put( (byte) b );\n      return magicNumber( byteBuffer.array() );\n\
  \    }\n    /**\n     * 测试 Path 的内容是否以指定的字节序列开头。\n     */\n    static AbstractFilter\
  \ magicNumber( byte... bytes ) {\n      return path -> {\n        try ( InputStream\
  \ in = Files.newInputStream( path ) {\n          byte[] buffer = new byte[ bytes.length\
  \ ];\n          in.read( buffer );\n          // 如果文件比 bytes.length 小，结果为 false\n\
  \          return Arrays.equals( bytes, buffer );\n        }\n      };\n    }\n\
  \    /**\n     * 测试 Path 是否包含指定的正则表达式。\n     */\n    static AbstractFilter regexContains(\
  \ String regex ) {\n      return path -> Pattern.compile( regex ).matcher( path.toString()\
  \ ).find();\n    }\n    /**\n     * 测试 Path 的文件名是否匹配给定的 glob 字符串。\n     */\n   \
  \ static AbstractFilter globMatches( String glob ) {\n      return path -> path.getFileSystem().getPathMatcher(\
  \ \"glob:\" + glob )\n          .matches( path.getFileName() );\n    }\n  }\n}\n\
  ```\n\n`Files.newDirectoryStream(…)` 允许递归遍历目录树。该方法期望函数式接口 `Filter` 的实现以及其 `accept(…)`\
  \ 方法传递：\n\n```\nboolean accept(T entry) throws IOException\n```\n\n\n\n\n\n`FileFilters`\
  \ 类声明了各种常量和方法。每当需要对内容进行参数化时，就会使用方法；如果不需要参数化，使用常量就足够。以下所有常量的数据类型均为 `AbstractFilter`，且方法返回\
  \ `AbstractFilter`。这些常量通过方法引用，使用 `Files` 类中对应的方法进行初始化。\n\n让我们关注一下更有趣的（此处原文为 exciting）方法。\n\
  \n*   `hasSuffix(…)` 将所有可能的扩展扩展名连接到一个 `Stream` 中，然后查询路径是否具有传递的文件扩展名之一。这种实现通过先将路径转换为字符串，然后使用\
  \ `regionMatches(…)` 在不区分大小的情况下检查后缀来实现。在代码中，通过 `regionMatches(…)` 进行检查比使用 `toLowerCase(…)`\
  \ 和 `endsWith(…)` 稍微杂乱一点，但 `regionMatches(…)` 不构建临时对象，性能略高。\n\n*   `magicNumber(byte...)`\
  \ 接收变长数量的字节，如果参数变量为 `null`，则抛出 `NullPointerException`。否则：\n    1. 打开一个输入流。\n   \
  \ 2. 读取的字节数与参数数组的长度完全一致。\n    3. 使用 `Arrays.equals(..)` 比较两个数组。如果文件小于传递的字节数，那么 `equals(…)`\
  \ 方法在任何情况下都会返回 `false`，因为该方法首先检查元素数量是否相同。\n\n*   `magicNumber(int...)` 是 `magicNumber(byte...)`\
  \ 的重载变，因为参数列表中的字节由于值范围 -128 到 +127 而缺乏灵活性；开发者必须写例如：\n    ```\n    magicNumber( (byte)\
  \ 0x89, (byte) 'P', (byte) 'N', (byte) 'G' )\n    ```\n    `int…` 数据类型对调用者更方便；因此可以写：\n\
  \    ```\n    magicNumber( 0x89, 'P', 'N', 'G' )\n    ```\n    因此，`magicNumber(int..)`\
  \ 将 `int...` 转换为 `byte[]` 并委托给主方法。\n\n*   `regexContains(…)` 接收一个正则表达式，编译它，然后将其应用于路径，如果\
  \ `find()` 方法返回 `true`，则文件名匹配该正则表达式。\n\n*   `globMatches(…)` 将文件名与 glob 字符串匹配；这些是简单的表达式，例如\
  \ `*.txt` 或 `??-??-1976`。`getPathMatcher(…)` 返回一个前缀为 `glob:` 或 `regex:` 的 `PathMatcher`。`regexContains(…)`\
  \ 的实现没有退回到带有正则表达式的 `PathMatcher`，因为 `PathMatcher` 测试的是全匹配，而在解决方案中需要的是部分搜索。\n\n###\
  \ 输出文本文件的最后一行\n\n`com/tutego/exercise/io/LastLine.java`\n\n```\nprivate static final\
  \ int MAX_LINE_LENGTH = 100;\nprivate static final int MAX_NUMBER_OF_BYTES_PER_UTF_CHAR\
  \ = 4;\nprivate static void printLastLine(String filename) throws IOException {\n\
  \  try (RandomAccessFile file = new RandomAccessFile(filename, \"r\")) {\n    int\
  \ blockSize = MAX_LINE_LENGTH * MAX_NUMBER_OF_BYTES_PER_UTF_8;\n    file.seek(file.length()\
  \ - blockSize);\n    byte[] bytes = new byte[blockSize];\n    file.read(bytes);\n\
  \    String string = new String(bytes, StandardCharsets.UTF_8);\n    Matcher matcher\
  \ = Pattern.compile(\"([^\\\\r\\\\n]*)$\").matcher(string);\n    if (matcher.find())\
  \ {\n      System.out.println(matcher.group(1));\n    }\n  }\n}\n```\n\n解决方案有两个步骤：首先，在文件末尾读取一个块，然后从该块中提取最后一行。为了确定正确的块大小，我们将任务\
  \ (1) 中已知的最大长度（100）乘以每个 UTF-8 预期的最大字节数；在 UTF-8 编码中，最多四个字符可以编码一个符号。如果行长度未知，任务将变得更加困难，但\
  \ `MAX_LINE_LENGTH * MAX_NUMBER_OF_BYTES_PER_UTF_8` 的乘积告诉我们文件中该大小的最后一个块包含最后一行。\n\
  \n在下一步中，我们将文件指针设置为最后一个块的开头。我们读取一个字节数组并在 UTF-8 编码后将其转换为字符串。如果最后一行没有最大长度，那么读取的块将包含上一行的剩余部分或带有换行符的行以及最后一行。为了提取最后一行，我们可以使用\
  \ `lastIndexOf(…)`，但正则表达式 `([^\\r\\n]*)$` 能更优雅地给出最后一行。该正则表达式构造如下：\n\n1. 结尾的美元符号\
  \ `$` 标志着输入的结束。\n2. 圆括号中的组表示我们想要提取的内容。\n3. 在字符类 `[^\\r\\n]` 中，小帽子符号 `^` 表示否定，我们想要所有非换行符的字符。带有星号的\
  \ `[^\\r\\n]*` 为我们一个这样的非行结束字符的序列。\n\n如果有匹配，我们输出它。否则，没有输出。\n\n# 8 输入/输出流\n\nDOI:\
  \ [10.1201/978103495550-9](https://doi.org/10.1201/978103495550-9)\n\n在之前的章节以及关于异常的章节中，我们已经处理了基础读取和写入。本章关注输入输出流和连续流；它可以写入到目的地或从源读取，通过过滤器。这有助于建模过滤器。\n\
