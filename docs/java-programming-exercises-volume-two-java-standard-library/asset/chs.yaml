  \ `deserialization`（反序列化）。\n\n要将 Java 对象转换为二进制流并反之，可以使用 `ObjectOutputStream` 和 `ObjectInputStream`\
  \ 类；所有需要序列化的对象类型必须实现 `Serializable` 接口。我们将在后续练习中使用这些类型，并查看序列化的实际示例。\n\n这两个类都是典型的装饰器：在序列化时，`ObjectOutputStream`\
  \ 确定数据并将序列化的字节序列写入构造函数指定的 `OutputStream` 中——读取时则反之，这里由 `ObjectInputStream` 从传递的\
  \ `InputStream` 中读取。\n\n### 对聊天数据进行（反）序列化并转换为文本 ★★\n\n聊天程序应该用于传输 Java 对象。然而，聊天程序只能传输\
  \ ASCII 字符。因此，对象不仅必须被（反）序列化，还需要在文本格式之间进行转换。\n\n练习：\n\n- 编写方法 `String objectToBase64(Object)`，对对象进行序列化，然后使用\
  \ `DeflaterOutputStream` 对其压缩并返回 Base64 编码的结果。\n\n- 编写方法 `deserializeObjectFromBase64(String)`，将\
  \ Base64 编码字符串封装为字节流，使用 `InflaterInputStream` 进行解包，并将其作为反序列化的源。\n\n![图标：垂直放置在表面上的灯泡](img/Icon_02.jpg)\
  \ 要将二进制数据转换为字符串及反之，`Base64.Encoder`、`Base64.Decoder` 尤其是 `wrap(...)` 方法非常有帮助。\n\n\
