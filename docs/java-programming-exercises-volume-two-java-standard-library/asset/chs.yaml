  \ 如果 CORONA 数据下降，CSSE 可能会停止发布新文档。旧文档应该保留保留\n\n## HTTP 客户端\n\n虽然可以使用 `URLConnection`\
  \ 来发送 HTTP 请求，并更改 HTTP 方法（GET, POST, PUT …）以及设置请求头，但这并不方便。因此，Java 11 添加了 HTTP 客户端。通过新的\
  \ API，可以更优雅地通过网络获取 HTTP 资源。此外，HTTP 客户端支持 HTTP/1.1 和 HTTP/2 以及同步和异步编程模型。在下一个关于文件格式的章节中，我们将在练习中再次回到\
  \ HTTP 客户端，因为经常交换 JSON 或 XML。\n\n来自 Hacker News 的热门新闻 ★★\n\n`Hacker News` 是一个提供技术趋势最新讨论的网站。可以通过服务访问文章，文档可以在\
