  \    Math.sin(dLng / 2) * Math.sin(dLng / 2);\n  double d = 2 * Math.atan2(Math.sqrt(a),\
  \ Math.sqrt(1 - a));\n  return (int) (earthRadius * d);\n}\n```\n\n### 购买最受欢迎的汽车\
