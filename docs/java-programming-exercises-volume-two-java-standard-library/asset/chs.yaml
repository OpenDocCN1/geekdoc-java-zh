  \ `FriendshipBook` 的无节制访问。请使用一个 `Lock` 对象改进程序，使得 `FriendshipBook` 一时间只能由一个海盗写入。\n\
  \n## 线程协作与同步辅助工具\n\n同步程序代码非常重要，以确保两个线程不会覆盖彼此的数据。我们已经学习过可以通过 `Lock` 对象来实现这一点。然而，`Lock`\
  \ 对象只锁定临界区域，运行时环境会在临界区域被锁定时自动让线程等待。这种方法的增强版是让一个线程（或多个线程）不仅等待进入临界区，还能通过信号被告知它有事情要做。Java\
  \ 提供了不同的同步辅助工具，其内部状态在满足特定条件时会触发其他线程等待或开始执行。\n\n- `Semaphore`（信号量）：`lock` 只允许一个线程进入临界区域，而\
  \ `Semaphore` 允许用户定义数量的线程进入一个块。方法名称也略有不同：`Lock` 声明为 `lock()` 而 `Semaphore` 声明为 `acquire()`。如果\
  \ `acquire()` 达到最大数量，线程必须等待访问，就像 `lock` 一样。最大计数为 1 的信号量类似于 `Lock`。\n- `Condition`（条件）：通过\
  \ `Condition`，线程可以等待并被另一个线程再次唤醒。使用 `Condition` 对象可以编写生产者消费者关系，但在实践中，这种数据并不太需要，因为有基于此的\
  \ Java 类型，它们更简单且更灵活。`Condition` 是一个接口，`Lock` 对象提供了返回 `Condition` 的工厂方法。\n- `CountDownLatch`（倒计时器）：`CountDownLatch`\
  \ 类型的对象初始化一个整数，各种线程递减 `CountDownLatch`，使它们进入等待状态。最后，当 `CountDownLatch` 达到 0 时，所有线程被释放。`CountDownLatch`\
  \ 是将不同线程汇到一个共同点的方法。一旦 `CountDownLatch` 被消耗，它就无法重置。\n- `CyclicBarrier`（循环屏障）：该类是所谓屏障的实现。通过屏障，多个线程可以在一点汇合。例如，如果工作是并行的并且以后需要合并，可以通过屏障实现。在所有线程遇到此屏障后，它们继续运行。`CyclicBarrier`\
  \ 的构造函数可以传递一个 `Runnable`，它会在汇合时调用。与 `CountDownLatch` 不同，`CyclicBarrier` 可以重置和重用。\n\
  - `Exchanger`（交换器）：生产者消费者关系在程序中经常发生，生产者将数据传输给消费者。正因为这种情况，有了 `Exchanger`。它允许两个线程在一点相并交换数据。\n\
  \n## 与船长一起参加宴会——Semaphore\n\nBonny Brain 和 Ciao 长正在策划一场有许多伙伴的宴会。他们坐在一张有六个座子的桌旁接待客人。客人到来，停留一会儿，用餐，然后再次离开桌子。\n\
  \n![一张图片展示了 Bonny Brain 和 Captain Ciao 坐在有客人的桌旁。](img/04_03.jpg)\n\n**练习：**\n\n\
  - 创建具有许多座位的 `Semaphore`，因为桌边可能同时有多个船长和客人。\n- 将客人建模为 `Guest`，它实现了 `Runnable`。所有客人都有名字。\n\
  - 客人正在等待座位。这不需要是“公平的”（fair），所以等待时间最长的客人并不一定先在桌旁。\n- 程序应该对想要来到桌边的客人、已入座的客人以及离开桌子的客人进行屏幕输出。\n\
  \n## 咒骂与侮辱——Condition\n\n现在的海盗不再用弯刀决斗，他们用咒骂决斗。\n\n**练习：**\n\n- 启动两个线程，每个代表一个海盗；给每个线程命名。\n\
  - 某个随机的海盗开始咒骂并进入持续状态。\n- 咒骂应该是随机给出的。\n- 在实际咒骂之前，海盗可以思考一下。\n\n## 从画盒拿画笔——Condition\n\
  \n在幼儿园里，小海盗经常聚在一起画画。不幸的是，只有一个 12 支画笔的盒子。当一个孩子从盒子里拿笔时，另一个孩子需要等待。这个场景可以用线程来实现。\n\n\
  **练习：**\n\n- 创建一个 `Paintbox` 类。该类应该有一个构造函数并接受画笔的最大数量。\n- 在 `Paintbox` 类中放置一个 `acquirePens(int\
  \ numberOfPens)` 方法，孩子们可以通过它请求若干画笔。如果请求的数量大于可用数量，则该方法将阻塞。\n- `Paintbox` 还有一个 `releasePens(int\
  \ numberOfPens)` 方法用于归还画笔。该方法信号画笔再次可用。\n- 创建一个 `Child` 类。\n- 给 `Child` 类一个构造函数，使每个孩子有一个名字并能获取\
  \ `Paintbox` 的引用。\n- `Child` 类实现 `Runnable` 接口。方法应该确定一个 1 到 10 之间的随机数，代表所需的笔数。然后孩子从\
  \ `Paintbox` 请求该数量的笔。孩子使用 1 到 3 秒，然后将所有笔放回 `Paintbox`——不多不少。随后，孩子等待 1 到 5 秒，并再次开始，领取随机数量的笔。\n\
  \n绘画可以通过以下孩子启动：\n\n```java\npublic static void main( String[] args ) {\n  Paintbox\
  \ paintbox = new Paintbox( 12 );\n  ExecutorService executor = Executors.newCachedThreadPool();\n\
  \  executor.submit( new Child( \"Mirjam\", paintbox ) );\n  executor.submit( new\
  \ Child( \"Susanne\", paintbox ) );\n  executor.submit( new Child( \"Serena\", paintbox\
  \ ) );\n  executor.submit( new Child( \"Elm\", paintbox ) );\n}\n```\n\n## 玩剪刀石头布——CyclicBarrier\
  \ ★★★\n\n*剪刀石头布*是一项古老的游戏，早在 17 世纪就开始了。在开始信号后，两个玩家用手比出剪刀、石头或纸的形状。哪个玩家获胜由以下规则决定：\n\
  \n- 剪刀剪破纸（剪刀获胜）。\n- 纸包住石头（纸获胜）。\n\n\n\n\n\n-   石头胜过剪刀（石头赢了）。\n\n所以，每个手势都可以赢或输。\n\
  \n我们想为这个游戏编写一个模拟，并以以下手势枚举作为基础：\n\n```java\nenum HandSign {\n  SCISSORS, ROCK, PAPER;\n\
  \n  static HandSign random() {\n    return values()[ ThreadLocalRandom.current().nextInt(\
  \ 3 ) ];\n  }\n\n  int beats( HandSign other ) {\n    return (this == other) ? 0\
  \ :\n           (this == HandSign.ROCK && other == HandSign.SCISSORS\n         \
  \  || this == HandSign.PAPER && other == HandSign.ROCK\n           || this == HandSign.SCISSORS\
  \ && other == HandSign.PAPER) ? +1 :\n-1;\n  }\n}\n```\n\n`enum HandSign` 声明了剪刀、石头、布布的三个枚举元素。静态方法\
  \ `random()` 返回一个随机的手势。`beats(HandSign)` 方法类似于一个 `comparator` 方法：它比较当前手势与传入的手势，如果两个手势相等则返回\
  \ `0`；如果当前手势大于传入的手势则返回 `+1`；否则返回 `-1`。\n\n![一张图展示了三个部分，其中两手在玩剪刀石头布。在所有情况下，右侧的手都赢了。](img/un04_04.jpg)\n\
  \n### 练习：\n\n-   运行一个启动线程，每秒触发一次剪刀石头布游戏。为了重复执行，可以使用 `ScheduledExecutorService`。\n\
  -   玩家由一个 `Runnable` 表示，它选择一个随机手势并使用 `add(…)` 将选择放入类型为 `ArrayBlockingQueue` 的数据结构中。\n\
  -   在玩家选择手势后，需要在之前构造的 `CyclicBarrier` 上调用 `await()` 方法。\n-   `CyclicBarrier` 的构造函数应获取一个\
  \ `Runnable`，用于在游戏结束时决定胜者。该 `Runnable` 通过 `poll()` 从 `ArrayBlockingQueue` 取出两个手势，对它们进行比较并评估胜负者。数据结构的第一个位置是玩家\
  \ 1，第二个位置是玩家 2。\n\n### 寻找最快跑者——CountDownLatch\n\n对于下一次抢劫，Bonny Brain 需要快速的跑者。为此，她举办了一场比赛并让最优秀的跑者参赛。Bonny\
  \ Brain 站在跑道上，所有人都在等待发令枪。\n\n### 练习：\n\n-   创建十个等待 Bonny Brain 信号的线程。随后，线程开始并花费在随机选择的\
  \ 10 到 20 秒之间进行跑步。最后，线程应该将自己的时间写入一个公共数据结构中，以便线程名称（跑者名称）与运行时间被记录在一起。\n-   Bonny Brain\
  \ 在 `main` 线程中启动跑者，并在最后按升序排列输出所有运行时间以及对应的跑者名称。\n\n![图标：圆形内的信息标志。](img/Icon_01.jpg)\
  \ 如果需要让多个线程在同一处汇合，可以使用 `CountDownLatch` 来实现。`CountDownLatch` 用一个整数（计数器）初始化，并提供两个核心方法：\n\
  \n-   `countDown()` 递减计数器。\n-   `await()` 阻塞直到计数器变为 0。\n\n## 建议的解决方案\n\n#### 创建用于挥手和挥动旗帜的线程\n\
  \n以下是 `main(…)` 方法的一部分：\n\n`com/tutego/exercise/thread/CaptainsParade.java`\n\n\
  ```java\nclass Wink implements Runnable {\n  @Override public void run() {\n   \
  \ for (int i = 0; i < 50; i++ )\n      System.out.printf( \"Wink; %s%n\", Thread.currentThread()\
  \ );\n  }\n}\n\nRunnable winker = new Wink();\nRunnable flagWaver = () -> {\n  for\
  \ (int i = 0; i < 50; i++ )\n    System.out.printf( \"Wave flag; %s%n\", Thread.currentThread()\
  \ );\n};\n\nThread winkerThread  = new Thread(winker);\nThread flagWaverThread =\
  \ new Thread(flagWaver, \"flag\");\n\nwinkerThread.start();\nflagWaverThread.start();\n\
  ```\n\n在 `run()` 方法体和 Lambda 表达式中，我们找到了一个带有预期输出的简单循环。在构建 `Runnable` 实例后，需要将它们连接到线程。为了实现这一点，将\
  \ `Runnable` 对象传递给 `Thread` 的构造函数。构造函数被多次重载；其中一个变体允许设置名称，我们为挥旗者执行了此操作。构建线程实例不会启动线程；这需要调用\
  \ `Thread` 的 `start()` 方法。\n\n```\nWink;Thread-0,main\nWave flag;Thread-flag,main\n\
  Wave flag;Thread-flag,main\nWink;Thread-0,main\n0-1\n...\n```\n\n输出显示了 `Thread`\
  \ 的 `toString()` 表示，它包含线程名称、优先级和组。从输出中可以看到 `thread-0`（自动分配的名称）和 `flag` 交替出现。每当调用它们时，输出都会略有不同——并发程序是非确定性的。\n\
  \n#### 不再挥手：结束线程\n\n`com/tutego/exercise/thread/CaptainsParadeIsInterrupted.java`\n\
  \n```java\nRunnable winker = () -> {\n  while (Thread.currentThread().isInterrupted()\
  \ ) {\n    System.out.printf( \"Wink; %s%n\", Thread.currentThread() );\n    try\
  \ { TimeUnit.SECONDS.sleep( 2 ); }\n    catch (InterruptedException ) { Thread.currentThread().interrupt();\
  \ }\n  }\n};\n\nRunnable flagWaver = () -> {\n  while (Thread.currentThread().isInterrupted()\
  \ ) {\n    System.out.printf( \"Wave flag; %s%n\", Thread.currentThread() );\n \
  \   try { TimeUnit.SECONDS.sleep( 2 ); }\n    catch (InterruptedException ) { Thread.currentThread().interrupt();\
  \ }\n  }\n};\n\nThread winkerThread = new Thread(winker);\nThread flagWaverThread\
  \ = new Thread(flagWaver);\n\nwinkerThread.start();\nflagWaverThread.start();\n\n\
  String message = \"Submit 'endw' or 'endf' to end the threads or cancel to end main\"\
  ;\nfor (String input; (input = JOptionPane.showInputDialog(message)) != null; )\
  \ {\n  if (input.equalsIgnoreCase(\"endw\") )\n    winkerThread.interrupt();\n \
  \ else if (input.equalsIgnoreCase(\"endf\") )\n    flagWaverThread.interrupt();\n\
  }\n```\n\n为了让线程响应中断，必须主动查询中断标志。该查询由 `isInterrupted()` 方法处理。我们将查询放入 `while` 循环中，因为我们要在标志尚未设置时执行操作。在两个循环体中，都是控制台输出和\
  \ 2 秒的等待时间。睡眠时有一个特殊的特性需要注意：如果我们在睡眠时被中断，`sleep(…)` 方法首先抛出 `InterruptedException`，其次会重置中断标志。因此，我们需要在\
  \ `catch` 块中再次设置中断标志。这正是我们在 `main(…)` 方法中用于信号被选线程终止的方法。\n\n通过 `stop()` 杀死线程与设置标志之间存在显著差异：调用\
  \ `stop()` 方法时，线程被强制杀死，且可能处于任何状态。设置中断标志需要线程的积极协作。线程必须独立请求标志并退出 `run()` 方法而不产生任何异常。\n\
  \n### 参数化 Runnable\n\n`run()` 方法没有返回值也没有参数列表。因此，`run()` 方法必须以某种方式获取参数。可以通过使用 `run()`\
  \ 方法可以访问的变量来实现。\n\n两种建议的解决方案：\n\n`com/tutego/exercise/thread/ParameterizedRunnable.java`\n\
  \n```java\nclass PrintingRunnable implements Runnable {\n  private final String\
  \ text;\n  private final int repetitions;\n\n  PrintingRunnable( String text, int\
  \ repetitions) {\n    this.text = text;\n    this.repetitions = repetitions;\n \
  \ }\n\n  @Override public void run() {\n    for (int i = 0; i < repetitions; i++\
  \ )\n      System.out.printf( \"%s; %s%n\", text, Thread.currentThread() );\n  }\n\
  }\n```\n\n\n\n\n如果我们写一个实现 `Runnable` 的新类，可以为它提供一个接收状态的构造函数。我们可以将这些状态存储在实例变量中。如果我们调用构造函数，这些值会在\
  \ `Runnable` 对象构建时设置，如果线程之后调用了 `run()` 方法，`run()` 的实现就可以访问这些值。\n\n`com/tutego/exercise/thread/ParameterizedRunnable.java`\n\
  \n```java\npublic static Runnable getPrintingRunnable( String text, int repetitions\
  \ ) {\n  return () -> {\n    for ( int i = 0; i < repetitions; i++)\n      System.out.printf(\
  \ \"%s; %s%n\", text, Thread.currentThread() );\n\n  };\n}\n```\n\n第二个建议的解决方案使用了工厂方法。提醒一下，工厂是对象创建器，是构造函数的替代方案，在这种情况下，参数化不是通过构造函数完成的，而是通过方法。Lambda\
  \ 表达式可以访问局部变量，参数变量就是其中之一。方法可以在体中返回 Lambda 表达式，由于它可以引用参数，因此我们也就创建了一个参数化的 `Runnable`。\n\
  \n### 通过线程休眠延迟执行\n\n`com/tutego/exercise/thread/Sleep.java`\n\n```java\npublic class\
  \ Sleep {\n  static long parseSleepArgument( String arg ) {\n    Matcher matcher\
  \ = Pattern.compile( \"(\\\\d+)(\\D)?\" ).matcher( arg );\n    boolean anyMatch\
  \ = matcher.find();\n\n    // 检查是否有匹配项或为乱码\n    if ( ! anyMatch ) {\n      System.err.printf(\
  \ \"sleep: invalid time interval '%s'%n\", arg );\n      System.exit( 2 );\n   \
  \ }\n\n    // 至少找到了一个数字，但可能太大而无法解析\n    long seconds = 0;\n    try { seconds = Long.parseLong(\
  \ matcher.group( 1 ) }\n    catch ( NumberFormatException e ) {\n      System.err.printf(\
  \ \"sleep: interval to huge '%s'%n\", arg );\n      System.exit( 3 );\n    }\n\n\
  \    // 还有单位吗？\n    String unit = matcher.group( 2 );\n    if ( unit == null )\n\
  \      return seconds;\n\n    switch ( unit ) {\n      case \"s\": break;\n    \
  \  case \"m\": seconds = TimeUnit.MINUTES.toSeconds( seconds ); break;\n      case\
  \ \"h\": seconds = TimeUnit.HOURS.toSeconds( seconds ); break;\n      case \"d\"\
  : seconds = TimeUnit.DAYS.toSeconds( seconds ); break;\n      default:\n       \
  \ System.err.printf( \"sleep: invalid interval unit '%s'%n\", arg );\n        System.exit(\
  \ 4 );\n    }\n    return seconds;\n  }\n\n  public static void main( String...\
  \ args ) {\n    if ( args.length == 0 ) {\n      System.err.println( \"sleep: missing\
  \ operand\" );\n      System.exit( 1 );\n    }\n    long seconds = 0;\n    for (\
  \ String arg:args )\n      seconds += parseSleepArgument(arg);\n\n    try { TimeUnit.SECONDS.sleep(seconds);\
  \ }\n    catch ( InterruptedException e ) { /* empty }\n  }\n```\n\n解析参数占据了大部分空间。我们将解析移动到\
  \ `parseSleepArgument(String)`，它返回以秒为单位的等待时间。正则表达式有助于识别数字后面跟的非数字字符。这两个部分都包含在括号中，以便我们稍后访问这个数字和单位。\n\
  \n如果正则表达式没有匹配成功，我们会打印错误并使用 `System.exit(int)` 退出。我们通过返回 `0` 表示错误。如果有两个分组，我们就继续执行。我们将第一个匹配项转换为数字。如果数字太大且无法放入\
  \ `long` 中，这可能会导致异常。我们通过选择正则表达式排除了字母，但正则表达式无法限制大小。如果发生错误，`NumberFormatException`\
  \ 会告**我们；此时将会有输出，程序将终止。\n\n数字已被识别，后面跟有单位吗？我们提取第二个匹配项，如果它为 `null`，则我们退出，因为没有指定单位。如果它不为\
  \ `null`，我们就得到了一个字符，并检查它是哪一个。当答案为 `s` 时，我们终止 `switch-case` 不需要进行任何转换。如果是 `m`、`h`\
  \ 或 `d`，`TimeUnit` 中的常量将帮助我们将其转换为秒。当这四个字符都没有被使用时，也会显示错误消息并结束应用程序。在理想情况下，将返回秒数。\n\
  \n`main(...)` 方法还执行了一个测试，以检查是否提供了任何参数。如果没有，将显示错误消息并使用 `System.exit(...)` 以错误码退出程序。这比使用\
  \ `return` 退出 `main(...)` 方法更正确，因为那会导致退出代码为 `0`，这向调用程序传递了信号。\n\n扩展 `for` 循环运行命令行中的所有参数，我们不需要索引。我们将每个字符串传递给\
  \ `parseSleepArgument(...)` 并结果累加到 `seconds` 变量中。最后，`sleep(long)` 方法让主线程睡眠指定的秒数。`sleep(...)`\
  \ 方法抛出一个 `InterruptedException`，这是一个我们必须处理的检查异常；但是我们不需要在 `catch` 中放置任何内容，因为没有外部线程会干扰我们。\n\
  \n### 通过线程监控文件\n\n`com/tutego/exercise/thread/FileChangeWatcher.java`\n\n```java\n\
  public class FileChangeWatcher implements Runnable {\n\n  private final Path path;\n\
  \  private final Consumer<Path> callback;\n\n  public FileChangeWatcher( String\
  \ filename, Consumer<Path> callback ) {\n    this.callback = Objects.requireNonNull(callback\
  \ );\n    path = Paths.get( filename );\n  }\n\n  @Override\n  public void run()\
  \ {\n    try {\n      FileTime oldLastModified = Files.getLastModifiedTime(path\
  \ );\n\n      while ( true ) {\n        TimeUnit.MILLISECONDS.sleep( 500 );\n\n\
  \        FileTime lastModified = Files.getLastModifiedTime(path );\n        if (\
  \ ! oldLastModified.equals( lastModified ) ) {\n          callback.accept( path\
  \ );\n          oldLastModified = lastModified;\n        }\n      }\n    }\n   \
  \ catch ( Exception e ) {\n      // 捕获任何异常并封装在 RuntimeException 中\n      throw new\
  \ RuntimeException(e );\n    }\n  }\n\n  public static void main( String[] args\
  \ ) {\n    Consumer<Path> callback = path ->\n      System.out.println(\"File changed\
  \ \" + path);\n    new Thread(new FileChangeWatcher(\"c:/file.txt\", callback)).start();\n\
  \  }\n}\n```\n\n\n\n在调用消费者（consumer）后，我们将旧日期设置为当前日期，并在循环中重新开始。\n\n`try-catch` 块包裹了循环和初始时间查询，以处理在多个处可能发生的异常。异常可能由输入输出方法和\
  \ `sleep` 抛出。由于设计决定，所有异常都在循环外部被捕获。或者，也可以在无限循环内部捕获异常，这样即使抛出异常，文件更改检查也能继续。然而，如果文件被删除，线程应该停止运行。在发生异常时，它们被封装在\
  \ `RuntimeException` 中并抛出，导致线程终止。通过 `RuntimeException` 终止的线程可以使用 `Thread.UncaughtExceptionHandler`\
  \ 进行检测。下一个练习将涵盖这一主题。\n\n异常的一个较为隐蔽的地方是回调操作，它也可以抛出 `RuntimeException`。如果不处理，它将导致线程死亡；然而，我们没有做其他操作……我们也可以考虑将我们的异常与\
  \ `Consumer` 中的异常分开，或者通过第二个回调对象来报告它们。\n\n### 捕获异常\n\n`com/tutego/exercise/thread/GlobalExceptionHandlerDemo.java`\n\
  \n```\nenum GlobalExceptionHandler implements Thread.UncaughtExceptionHandler {\n\
  \  INSTANCE;\n\n  @Override public void uncaughtException( Thread thread,\n    \
  \                                      Throwable uncaughtException ) {\n    Logger\
  \ logger = Logger.getLogger( getClass().getSimpleName() );\n    logger.log( Level.SEVERE,\
  \ uncaughtException.getMessage()\n                      + \" from thread \" + thread,\
  \ thread );\n  }\n}\n\npublic class GlobalExceptionHandlerDemo {\n  public static\
  \ void main( String[] args ) throws Exception {\n    Locale.setDefault( Locale.US\
  \ );\n    Thread.setDefaultUncaughtExceptionHandler( GlobalExceptionHandler.INSTANCE\
  \ );\n\n    Thread zeroDivisor = new Thread( () -> System.out.println( 1 / 0 ) );\n\
  \    zeroDivisor.start();\n\n    Thread indexOutOfBound =\n        new Thread( ()\
  \ -> System.out.println( (new int[0])[1] ) );\n    indexOutOfBound.setUncaughtExceptionHandler(\
  \ ( t, e ) -> {} );\n    indexOutOfBound.start();\n\n    URI.create( \"captain\"\
  \ ).toURL();\n  }\n}\n```\n\n输出结果：\n\n```\nSep 25, 2023 11:03:31 AM com.tutego.exercise.thread.GlobalExceptionHandler\n\
  uncaughtException\nSEVERE: / by zero from thread Thread[#22,Thread-0,5,main]\nSep\
  \ 25, 2023 11:03:31 AM com.tutego.exercise.thread.GlobalExceptionHandler\nuncaughtException\n\
  SEVERE: URI is not absolute from thread Thread[#1,main,5,main]\n```\n\n一个 `enum`\
  \ 实现了 `UncaughtExceptionHandler`，它结合单一静态变量 `INSTANCE` 构成了一个单例。该枚举元素实现了函数式接口中的 `uncaughtException(…)`\
  \ 方法。当被激活时，JVM 会向该方法传递一个死亡线程的引用和未处理的异常。其类型为 `throwable`，这意味着 `error` 也可以被报告。\n\n\
  `main(…)` 方法全局设置了 `UncaughtExceptionHandler`，因此它适用于所有线程。第一个线程将因为除以 `0` 抛出 `ArithmeticException`，我们全局设置的\
  \ `UncaughtExceptionHandler` 将直接报告它。\n\n第二个线程同样会因异常而终止，但在这里我们通过 Lambda 表达式设置了本地的\
  \ `UncaughtExceptionHandler`，它什么都没有报告。\n\n`main` 线程也引起了麻烦，因为 `URI` 类的构造函数在使用此参数时会抛出异常。我们没有通过\
  \ `try-catch` 块捕获并处理它，但 `main(…)` 方法将其传递给了 JVM。这也激活了设置好的 `UncaughtExceptionHandler`。\n\
  \n### 使用线程池\n\n以下是 `main(…)` 方法的一部分；它声明了一个本地记录 `DistributeGift` 并访问了它：`com/tutego/exercise/thread/GiftsInThephanage.java`\n\
  \n```\nrecord DistributeGift( String gift ) implements Runnable {\n  @Override public\
  \ void run() {\n    try {\n      System.out.println( Thread.currentThread().getName()\n\
  \          + \" gives \" + gift );\n      Thread.sleep( ThreadLocalRandom.current().nextInt(\
  \ 1000, 4000 ) );\n    } catch ( InterruptedException e ) { }\n  }\n\n  Iterator<String>\
  \ names =\n    Arrays.asList( \"Polly Zist\", \"Jo hurt\", \"Lisa bonn\" ).iterator();\n\
  \n  ExecutorService crew = Executors.newCachedThreadPool( runnable -> {\n    ThreadFactory\
  \ threadFactory = Executors.defaultThreadFactory();\n    Thread thread = threadFactory.newThread(\
  \ runnable );\n    thread.setName( names.next() );\n    return thread;\n  } );\n\
  \n  String[] gifts = {\n    \"Dragon\", \"Pomsies\", \"Coat\", \"Tablet\", \"Doll\"\
  , \"Art Station\",\n    \"Bike\", \"Card Game\", \"Slime\", \"Nerf Blaster\"\n \
  \ };\n  for ( String gift : gifts ) {\n    Thread.sleep( ThreadLocalRandom.current().nextInt(\
  \ 1000, 2000 ) );\n    crew.submit( new DistributeGift( gift ) );\n  }\n}\n```\n\
  \n`Runnable` 是线程执行的动作。Java 框架提供了两个接口供程序代码执行：`Runnable` 和 `Callable`，其中 `Callable`\
  \ 只在程序想要在后台返回内容时使用，这在我们案例中并没有必要。\n\n我们可以实现 `Runnable`。在这种情况下，由于 `Runnable` 需要关联一个\
  \ `String`，这是不可能的。我们可以使用 Lambda 表达式来实现 `Runnable`。我们使用一个实现 `Runnable` 的记录，通过其构造函数接受礼物。`Runnable`\
  \ 在屏幕上显示输出，暂停片刻，然后完成执行。\n\n下一步，我们构建一个线程池。`Runnable` 是由新线程还是现有线程运行并不重要。创建线程的成本比普通创建高得多。为了构建线程池，可以使用无参数方法\
  \ `Executors.newCachedThreadPool()` 或允许我们构建并参数化池本身的特殊变体。任务并不需要，但这出于外观原因，因为这样做我们可以设置线程名称。为了尽可能适应基础设施，我们查询\
  \ `defaultThreadFactory()`，通过 `newThread(…)` 创建线程，然后可以使用熟悉的 `Thread` 方法 `setName(…)`。线程成员名称通过\
  \ `Iterator` 获取，由于任务不需要超过三个线程，因此发生异常。\n\n最后一部分是工作包的提交。程序遍历数组并始终创建新的 `Runnable` 对象。`submit(…)`\
  \ 将 `Runnable` 传递给线程池，线程池选择一个空闲线程或创建一个，从而分发礼物。\n\n### 获取网页的修改时间\n\n`com/tutego/exercise/thread/PageLastModifiedDemo.java`\n\
  \n```\nrecord WebResourceLastModifiedCallable(URL url) implements\nCallable<ZonedDateTime>\
  \ {\n  @Override public ZonedDateTime call() throws IOException {\n    HttpURLConnection\
  \ con = (HttpURLConnection) url.openConnection();\n    long dateTime = con.getLastModified();\n\
  \    con.disconnect();\n    return ZonedDateTime.ofInstant( Instant.ofEpochMilli(\
  \ dateTime ),\n        ZoneId.of( \"UTC\" ) );\n  }\n}\n```\n\n`Callable` 接口的实现没有任何惊喜。参数化构造函数接收\
  \ `URL` 对象并将其存储在私有变量中，以便稍后在 `call()` 方法中访问。`call(…)` 方法的实现与模板没有太大区别，在于我们没有捕获异常，而是可以轻松从\
  \ `call()` 方法向上传递。那么，如果发生异常，`get(…)` 将被 `ExecutionException` 中断。\n\n用法可能如下：\n\n\n\
  \n\n\n`com/tutego/exercise/thread/PageLastModifiedCallableDemo.java`\n\n```java\n\
  ExecutorService executor = Executors.newCachedThreadPool();\nURL url = URI.create(\"\
  https://en.wikipedia.org/wiki/Main_Page\").toURL();\nCallable<ZonedDateTime> callable\
  \ = new WebResourceLastModifiedCallable( url );\n\nFuture<ZonedDateTime> dateTimeFuture\
  \ = executor.submit( callable );\n\ntry {\n  System.out.println(\n      executor.submit(\
  \ callable ).get( 1, TimeUnit.MICROSECONDS )\n  );\n}\ncatch ( InterruptedException\
  \ | ExecutionException | TimeoutException e ) {\n  e.printStackTrace();\n}\n\ntry\
  \ {\n  ZonedDateTime wikiChangedDateTime = dateTimeFuture.get();\n  System.out.println(\
  \ wikiChangedDateTime );\n  System.out.println(\n      Duration.between( wikiChangedDateTime,\n\
  \                          ZonedDateTime.now( ZoneId.of( \"UTC\" ) )\n         \
  \             .toMinutes()\n  );\n}\ncatch ( InterruptedException | ExecutionException\
  \ e ) {\n  e.printStackTrace();\n}\n\nexecutor.shutdown();\n```\n\n为了分发 `Callable`\
  \ 实例，我们访问了通过 `newCachedThreadPool()` 获取的线程池。`URL` 对象表示维基百科主页，在使用此 URL 构建了 `WebResourceLastModifiedCallable`\
  \ 后，我们可以使用 `Callable` 对象调用 `submit(..)` 方法。此操作本身不会抛出任何异常（参数化的 `URL` 构造函数除外），异常处理仅在使用\
  \ `get(…)` 获取结果时才需要。\n\n该示例实现了两种场景：第一个 `submit(…)` 让 `Callable` 在线程池中执行，随后在后台运行。第二个\
  \ `submit(…)` 同样将 `Callable` 放入线程池，但只给 `get(…)` 留了 1 微秒的时间完成；这时间够够，因此会抛出 `TimeoutException`。\n\
  \n第二个 `try`-`catch` 块用于第一个发送的 `Callable`。通过阻塞的 `get()` 调用查询 `dateTimeFuture` 的结果，此时可能已经过去了几毫秒，这些时间被运行时环境用于管理之前的请求。当我们检查\
  \ `catch` 块时，发现当存在时间限制时，我们必须处理额外的 `TimeoutException`。然而，当使用不带参数的 `get()` 方法时，我们只需要处理\
  \ `InterruptedException` 和 `ExecutionException`。\n\n对于差值的计算，我们使用了 `Duration` 类的\
  \ `between(…)` 方法。该静态方法获取两个参数：一次来自 `Future` 的时间，另是当前时间。我们必须记住只用 `now()` 请求当前时间，而必须请求\
  \ UTC 时区的当前时间。否则，除非程序本身恰好运行在 UTC ± 0 环境中，否则差值将是不正确的。\n\n### 在诗集中写入记忆\n\n问题在于有两个线程访问同一个共享资源。它们并发访问该资源并弄乱了输出。输出可能像这样：\n\
  \n```\nTWhheen  fyloou  wlearugsh  ,ne  tehd  eysu  nalshli  nlea  uganhd  .I  Wnheeend\
  \  \nCyaoput  acirny  ,C  iyaoouC  icaroy  taloo  nbee  .h\n_,.-'~'-.,__,.-'~'-.,__,.-'~'-.,__,.-'~'-.,__,.-'~'-.,_\n\
  appy\n_,.-'~'-.,__,.-'~'-.,__,.-''-.,__,.-'~'-.,__,.-'~'-.,_\n```\n\n追加字母是一个必须保护的临界区。`synchronized`\
  \ 块已经过时了，我们想要使用 `Lock` 对象。对于我们的用例，`ReentrantLock` 的实现是合适的。\n\n`com/tutego/exercise/thread/WriteInFriendshipBook.java`\n\
  \n```java\n    Lock lock = new ReentrantLock( true );\n\n    class Author implements\
  \ Runnable {\n      private final String text;\n      private final FriendshipBook\
  \ book;\n\n      public Author( String text, FriendshipBook book ) {\n        this.text\
  \ = text;\n        this.book = book;\n      }\n\n      @Override public void run()\
  \ {\n//    lock.lock();\n        try {\n          for ( int i = 0; i < text.length();\
  \ i++ ) {\n            book.appendChar(text.charAt(i) );\n            Thread.sleep(\
  \ 1 );\n          }\n          book.appendDivider();\n      }\n      catch ( InterruptedException\
  \ e ) { /* Ignore */ }\n      finally {\n//        lock.unlock();\n      }\n   \
  \ }\n```\n\n线程通过 `Lock` 对象相互协调。当一个线程进入临界区时，另一个线程将必须等待直到临界区被解锁。要进入和退出代码块，`Lock` 中有两个方法：`lock()`\
  \ 和 `unlock()`。`ReentrantLock` 的构造函数是重载的，参数化版本使用 `boolean` 参数来确定 `Lock` 是否是公平的。在此语境下，公平意味着等待最长的线程被允许首先进入块。否则，行为是非确定性的。这也是与\
  \ `synchronized` 关键字的区别之一，在后者中，虚拟机可以选择任何线程。分配是否公平取决于实现，而且 `synchronized` 中的公平性是不可控的。\n\
  \n所提的解决方案对源代码进行了微调。一处是在 `Author` 类外部，因为 `Lock` 对象必须对所有线程可用，因为这是线程协调的依据。另一个更改在 `run()`\
  \ 方法内部，因为要保存的操作是写入日记。在用 `lock()` 关闭循环之前，会追加字符，最后调用 `unlock()`，这会为下一个线程释放代码块。`unlock()`\
  \ 应该始终放在 `finally` 块中，因为如果请求了 `Lock`，那么即使有退出方法的异常，它也应该被释放。无论是否有异常，`finally` 块始终会被处理。\n\
  \n除了 `lock()` 方法外，还有第二个方法 `lockInterruptibly()`，它可以从外部被中断。`lock()` 不对外部中断做出反应，这意味着\
  \ `InterruptedException` 的 `catch` 仅对 `sleep(…)` 方法有效。\n\n### 使用信号量参加宴会\n\n以下是 `main(…)`\
  \ 方法的一部分：\n\n`com/tutego/exercise/thread/Banquet.java`\n\n```java\nrecord Guest(\
  \ String name, Semaphore seats ) implements Runnable {\n  @Override\n  public void\
  \ run() {\n    try {\n      System.out.printf(\"%s is waiting for a free place%n\"\
  , name );\n      seats.acquire();\n      System.out.printf(\"%s has a seat at the\
  \ table%n\", name );\n      Thread.sleep( ThreadLocalRandom.current().nextInt(2000,\
  \ 5000) );\n    }\n    catch ( InterruptedException e ) { /* Ignore */ }\n    finally\
  \ {\n      System.out.printf(\"%s leaves the table%n\", name );\n      seats.release();\n\
  \    }\n  }\n}\nList<String> names = new ArrayList<>( Arrays.asList(\n  \"Balronoe\"\
  , \"Xidrora\", \"Zobetera\", \"Kuecarro\", \"Bendover\",\n  \"Bane\", \"Cody\",\
  \ \"Djarin\", \"Enfy\"\n) );\nfor ( int i = 0, len = names.size(); i < len; i++)\n\
  \  Collections.addAll( names, \"Admiral\" + names.get( i ),\n                  \
  \    \"Commander\" + names.get( i ) );\nExecutorService executors = Executors.newCachedThreadPool();\n\
  Semaphore seats = new Semaphore( 6 - 2 );\nfor ( String name : names )\n  executors.execute(\
  \ new Guest( name, seats ) );\nexecutors.shutdown();\n```\n\n`Banquet` 类核心由四个部分组成：\n\
  \n1. record 的声明，它实现了 `Runnable` 并访问 `Semaphore`。\n2. 名字的构建。\n3. `Semaphore` 的构建。\n\
  4. `Runnable` 实例的创建以及线程池中的执行。\n\n由于桌上有六个座位，而两个座位已经被 Bonny Brain 和 Captain CiaoCiao\
  \ 占据，因此留下了四个座位让不同的客人们相互切换。\n\n所有客人都有名字，名字存储在对象中。该名字在输出中出现了三次：\n\n\n\n\n\n1. 首先，会打印访客的名字，因为访客正在等待，可能还没有位置。线程必须首先通过\
  \ `acquire()` 从 `Semaphore` 获取权限；如果已经达到四个空座的最大限制，该方法将会被阻塞。每个人在取座位之前都会先等待空闲的座位，而前四个人将立即获得座位，正如控制台输出所示。\n\
  \n2. 如果 `acquire()` 被解除，线程就可以与其他四个线程一起在桌子旁度过时间。\n\n3. 在等待一段时间后，将处理 `finally` 块并再次打印访客的名字，因为此时访客正离开了桌子。调用\
  \ `Semaphore` 的 `release()` 方法非常重要，这样其他等待的访客才能来到桌边。\n\n一个简单的算法生成了演示数据。列表预先填充了一些字符串。现在以原始长度运行该列表，并生成了以\
  \ `Admiral` 开头的新字符串，以及更多以 `Commander` 开头的字符串。\n\n现在只需要创建 `Runnable` 实例，`ExecutorService`\
  \ 就可以启动它们了。\n\n### 辱骂与侮辱——条件\n\n该代码是 `main(…)` 方法的一部分：\n\n`com/tutego/exercise/thread/InsultSwordFighting.java`\n\
  \n```java\nrecord Insulter(\n    String[] insults,\n    Lock lock,\n    Condition\
  \ condition\n) implements Runnable {\n  @Override public void run() {\n    while\
  \ ( ! Thread.currentThread().isInterrupted() ) {\n      lock.lock();\n      try\
  \ {\n          Thread.sleep( ThreadLocalRandom.current().nextInt( 1000 ) );\n  \
  \        String name = Thread.currentThread().getName();\n          int rndInsult\
  \ = ThreadLocalRandom.current().nextInt( insults.length );\n          System.out.println(\
  \ name + \": \" + insults[ rndInsult ] + '!' );\n          condition.signal();\n\
  \          condition.await();\n      }\n\n      catch ( InterruptedException e )\
  \ { Thread.currentThread().interrupt();\n}\n      finally {\n          lock.unlock();\n\
  \      }\n    }\n  }\n}\n\nString[] insults1 = {\n    \"Trollop\", \"You have the\
  \ manners of a trump\",\n    \"You fight like a cow cocky\", \"Prat\",\n    \"Your\
  \ face makes onions cry\",\n    \"You are so full of s**t, the toilet's jealous\"\
  \n};\n\nString[] insults2 = {\n    \"Wazzock\", \"I've spoken with rats more polite\
  \ than you\",\n    \"Chuffer\", \"You make me want to spew\",\n    \"Check your\
  \ lipstick before you come for me\",\n    \"You are more disappointing than an unsalted\
  \ pretzel\"\n};\n\nLock lock = new ReentrantLock();\nCondition condition = lock.newCondition();\n\
  new Thread( new Insulter( insults1, lock, condition ), \"pirate-1\" ).start();\n\
  new Thread( new Insulter( insults2, lock, condition ), \"pirate-2\" ).start();\n\
  ```\n\n解决方案依赖于 `Condition`，它有两个关键方法：用于通知其他等待的线程以及等待通知。\n\n我们场景中的 `Insulter` 记录是一个\
  \ `Runnable`，它通过构造函数接收各种咒骂、一个 `Lock` 对象和一个 `Condition` 对象。`run()` 方法有一个无限循环，可以使用中断来结束，并且每个动作都会触发一个反应。要使用\
  \ `Condition` 对象，必须用 `lock()` 标记临界区域，因为 `Condition` 对象源于 `Lock` 对象。\n\n 思考一段时间后，会选择一个随机咒骂，然后使用\
  \ `signal()` 通知另一个线程。通过随后的 `await()`，我们在线程中再次等待另一个线程。\n\n流程如下：`main(...)` 将启动两个\
  \ `Insulter` 线程，其中两个线程之一将通过 `Lock` 对象进入区域，然后排斥地锁定该块。第二个线程将稍后到达，并挂在 `Lock` 上无法继续。第一个线程随后开始辱骂，并信号另一个线程它已完成。在信号之后，第一个线程也等待一个信号。重要的是，相关的锁会被临时释放，这样另一个线程就可以进入受保护的块，接收信号，然后去执行操作。当一个线程在\
  \ `await()` 中等待时，另一个线程执行其操作并在之后再次设置信号。这会唤醒等待的线程，它重新获取锁并继续操作，而另一个线程等待。\n\n### 从画盒中拿出笔——条件\n\
  \n让我们从 `Paintbox` 类开始。笔的最大数量初始化了实例变量 `freePens`，它在下面会被减少或增加。\n\n`com/tutego/exercise/thread/Kindergarten.java`\n\
  \n```java\nclass Paintbox {\n  private int freePens;\n  private final Lock lock\
  \ = new ReentrantLock();\n  private final Condition condition = lock.newCondition();\n\
  \n  public Paintbox(int maximumNumberOfPens) {\n    freePens = maximumNumberOfPens;\n\
  \    System.out.printf(\"Paintbox equipped with %s pens%n\", freePens);\n  }\n\n\
  \  public void acquirePens(int numberOfPens) {\n    lock.lock();\n    try {\n  \
  \    while ( freePens < numberOfPens ) {\n          System.out.printf(\"%d pens\
  \ from paintbox requested, available only %d, someone has to wait:%n\",\n      \
  \        numberOfPens, freePens);\n\n          condition.await();\n      }\n\n \
  \     freePens -= numberOfPens;\n    }\n    catch ( InterruptedException e ) { Thread.currentThread().interrupt();\
  \ }\n    finally {\n      lock.unlock();\n    }\n  }\n\n  public void releasePens(int\
  \ numberOfPens) {\n    lock.lock();\n    try {\n      freePens += numberOfPens;\n\
  \      condition.signalAll();\n    }\n    finally {\n      lock.unlock();\n    }\n\
  \  }\n```\n\n`acquirePens(int numberOfPens)` 被那些想要从画盒中提取特定数量笔的孩子调用。操作在临界区内进行，因此使用\
  \ `Lock` 来锁定其他线程。循环检查空闲笔的数量是否少于所需的笔数，如果是，则必须等待。如果稍后收到信号，它必须反复询问该条件仍然适用。如果使用 `if`\
  \ 语句而不是循环，将是一个编程错误。在 `while` 循环结束后，空闲笔的数量减少。考虑一下：在等待信号时，锁会被临时释放。\n\n`releasePens(int\
  \ numberOfPens)` 更简单：它增加空闲笔的数量，然后通知其他等待的线程笔可用。`signalAll()` 通知所有等待的线程。信号与等待一样，必须在锁定区域内进行，该区域在\
  \ `finally` 块中 `unlock()` 结束。\n\n记录 `Child` 实现 `Runnable`，并在构造函数中接收孩子的名字和画盒。\n\n\
  `com/tutego/exercise/thread/Kindergarten.java`\n\n```java\nrecord Child( String\
  \ name, Paintbox paintbox ) implements Runnable {\n  @Override\n  public void run()\
  \ {\n    while ( ! Thread.currentThread().isInterrupted() ) {\n      ThreadLocalRandom\
  \ random = ThreadLocalRandom.current();\n      int requiredPens = random.nextInt(1,\
  \ 10 + 1);\n      paintbox.acquirePens(requiredPens);\n      System.out.printf(\"\
  %s got %d pens%n\", name, requiredPens);\n\n      try {\n          TimeUnit.MILLISECONDS.sleep(random.nextInt(1000,\
  \ 3000));\n      }\n      catch ( InterruptedException e ) { Thread.currentThread().interrupt();\
  \ }\n      paintbox.releasePens(requiredPens);\n      System.out.printf(\"%s returned\
  \ %d pens%n\", name, requiredPens);\n\n      try {\n          TimeUnit.SECONDS.sleep(random.nextInt(1,\
  \ 5 + 1));\n      }\n      catch ( InterruptedException e ) { Thread.currentThread().interrupt();\
  \ }\n    }\n  }\n}\n```\n\n\n\n\n2. 在调色板上，调用 `acquirePens(…)` 来获取相应数量的画笔。如果所需的画笔不可用，这里可能会发生等待情况。\n\
  \n3. 如果画笔可用，`acquirePens(…)` 返回并打印出请求的画笔数量。\n\n4. 因为孩子正在画画，所以有了等待。\n\n5. 使用 `releasePens(…)`\
  \ 将画笔归还。归还操作永远不会阻塞。\n\n6. 它再次等待，可以开始一个新的循环周期。\n\n### 玩石头、剪刀、布——CyclicBarrier（循环屏）\n\
  \n代码是 `main(…)` 方法的一部分：\n\n`com/tutego/exercise/thread/RockPaperScissorsHandGame.java`\n\
  \n```java\nQueue<HandSign> handSigns = new ArrayBlockingQueue( 2 );\nRunnable determineWinner\
  \ = () -> {\n  HandSign handSign1 = handSigns.poll();\n  HandSign handSign2 = handSigns.poll();\n\
  \  switch ( handSign1.beats( handSign2 ) ) {\n    case 0 -> System.out.printf( \"\
  Tie, both players choose %s%n\", handSign1 );\n    case +1 -> System.out.printf(\
  \ \"Player 1 wins with %s, player 2 loses with %s%n\",\n                       \
  \         handSign1, handSign2 );\n    case -1 -> System.out.printf( \"Player 2\
  \ wins with %s, player 1 loses with %s%n\",\n                                handSign2,\
  \ handSign1 );\n  }\n};\nCyclicBarrier barrier = new CyclicBarrier( 2, determineWinner\
  \ );\n\nRunnable playScissorsRockPaper = () -> {\n  try {\n    handSigns.add( HandSign.random()\
  \ );\n    barrier.await();\n  }\n  catch ( InterruptedException | BrokenBarrierException\
  \ e ) { /* Ignore */ }\n};\n\nScheduledExecutorService executor = Executors.newScheduledThreadPool(\
  \ 2 );\nexecutor.scheduleAtFixedRate( () -> {\n  System.out.println( \"Schnick,\
  \ Schnack, Schnuck\" );\n  executor.execute( playScissorsRockPaper );\n  executor.execute(\
  \ playScissorsRockPaper );\n}, 0, 1, TimeUnit.SECONDS );\n```\n\n在建议的解决方案中，我们有两种不同的\
  \ `Runnable` 类型。一个 `Runnable` 评估胜负者，另一个 `Runnable` 执行手势信号。`Runnable` 由 lambda 表达式实现，并访问公共数据结构\
  \ `handSigns`。每个玩家做出一个随机手势，将其放入 `Queue` 中，并等待屏障结束。\n\n屏障本身初始化为大小为 2，并使用 `Runnable\
  \ determineWinner` 进行初始化，每当屏障上出现第二次 `await()` 调用时，就会执行该 `Runnable`。`determineWinner`\
  \ 从队列中取出两个手势，使用 `beats(…)` 决定哪位玩家以何种方式得分，并打印关于获胜者、失败者或平局的控制台消息。\n\n`ScheduledExecutorService`\
  \ 帮助每秒重玩一次游戏，并运行两次 `playScissorsRockPaper` 背后的 `Runnable`。\n\n### 寻找最快跑步者——CountDownLatch（倒计时器）\n\
  \n以下代码位于 `main(…)` 方法中：\n\n`com/tutego/exercise/thread/SprintRace.java`\n\n```java\n\
  final int NUMBER_OF_ATHLETES = 10;\nCountDownLatch startLatch = new CountDownLatch(\
  \ 1 );\nCountDownLatch endLatch = new CountDownLatch( NUMBER_OF_ATHLETES );\n\n\
  ConcurrentNavigableMap<Integer, String> records =\n  new ConcurrentSkipListMap<>();\n\
  \nRunnable athlete = () -> {\n  try {\n    startLatch.await();\n    int time = ThreadLocalRandom.current().nextInt(\
  \ 1000, 2000 );\n    TimeUnit.MILLISECONDS.sleep( time );\n    records.put( time,\
  \ Thread.currentThread().getName() );\n    endLatch.countDown();\n  }\n  catch (\
  \ InterruptedException e ) { /* Ignore */ }\n};\n\nfor (int i = 0; i < NUMBER_OF_ATHLETES;\
  \ i++)\n  new Thread( athlete, \"athlete-\" + (i + 1) ).start();\n\n// 开始比赛\nstartLatch.countDown();\n\
  \n// 等待比赛结束\nendLatch.await();\n\nrecords.forEach(\n  (time, name) -> System.out.printf(\
  \ \"%s in %d ms%n\", name, time )\n);\n```\n\n该解决方案使用了两个 `CountDownLatch` 对象。第一个\
  \ `startLatch` 初始化为 `1`，当多个线程启动时，它们会等待这个 `startDownLatch` 变为 `0`。第二个 `endLatch`\
  \ 初始化为 `10`（运动员人数），每当有运动员到达终点时，`endLatch` 就会减一。\n\n为了按时间进行排序，我们求助于关联内存。由于线程并发地写入数据结构，因此该数据结构必须支持这种访问。为此，`java.util.concurrent`\
  \ 包提供了各种数据结构。我们使用 `ConcurrentSkipListMap`，一种可以处理并发写入的关联内存。该类实现了 `ConcurrentNavigableMap`\
  \ 接口。\n\n运动员是线程，通过 `Thread` 类的构造函数赋予一个简单的名称。\n\n# 5 数据结构与算法\n\nDOI: [10.1201/97810349550-6](https://doi.org/10.1201/97810349550-6)\n\
  \n数据结构在应用程序中存储关键信息。它们通过列表、集合和关联映射进行组织。在 Java 中，围绕数据建立的接口和类被称为 `Collection API`。\n\
  \n## Collection API 的类型\n\n在建议的解决方案中，我们有两种不同的 `Runnable` 类型。一个 `Runnable` 评估胜负者，另一个\
  \ `Runnable` 执行手势信号。`Runnable` 由 lambda 表达式实现，并访问公共数据结构 `handSigns`。每个玩家做出一个随机手势，将其放入\
  \ `Queue` 中，并等待屏障结束。\n\n屏障本身初始化为大小为 2，并使用 `Runnable determineWinner` 进行初始化，每当屏障上出现第二次\
  \ `await()` 调用时，就会执行该 `Runnable`。`determineWinner` 从队列中取出两个手势，使用 `beats(…)` 决定哪位玩家以何种方式得分，并打印关于获胜者、失败者或平局的控制台消息。\n\
  \n`ScheduledExecutorService` 帮助每秒重玩一次游戏，并运行两次 `playScissorsRockPaper` 背后的 `Runnable`。\n\
  \n### 寻找最快跑步者——CountDownLatch（倒计时器）\n\n以下代码位于 `main(…)` 方法中：\n\n`com/tutego/exercise/thread/SprintRace.java`\n\
  \n```java\nfinal int NUMBER_OF_ATHLETES = 10;\nCountDownLatch startLatch = new CountDownLatch(\
  \ 1 );\nCountDownLatch endLatch = new CountDownLatch( NUMBER_OF_ATHLETES );\n\n\
  ConcurrentNavigableMap<Integer, String> records =\n  new ConcurrentSkipListMap<>();\n\
  \nRunnable athlete = () -> {\n  try {\n    startLatch.await();\n    int time = ThreadLocalRandom.current().nextInt(\
  \ 1000, 2000 );\n    TimeUnit.MILLISECONDS.sleep( time );\n    records.put( time,\
  \ Thread.currentThread().getName() );\n    endLatch.countDown();\n  }\n  catch (\
  \ InterruptedException e ) { /* Ignore */ }\n};\n\nfor (int i = 0; i < NUMBER_OF_ATHLETES;\
  \ i++)\n  new Thread( athlete, \"athlete-\" + (i + 1) ).start();\n\n// 开始比赛\nstartLatch.countDown();\n\
  \n// 等待比赛结束\nendLatch.await();\n\nrecords.forEach(\n  (time, name) -> System.out.printf(\
  \ \"%s in %d ms%n\", name, time )\n);\n```\n\n该解决方案使用了两个 `CountDownLatch` 对象。第一个\
  \ `startLatch` 初始化为 `1`，当多个线程启动时，它们会等待这个 `startDownLatch` 变为 `0`。第二个 `endLatch`\
  \ 初始化为 `10`（运动员人数），每当有运动员到达终点时，`endLatch` 就会减一。\n\n为了按时间进行排序，我们求助于关联内存。由于线程并发地写入数据结构，因此该数据结构必须支持这种访问。为此，`java.util.concurrent`\
  \ 包提供了各种数据结构。我们使用 `ConcurrentSkipListMap`，一种可以处理并发写入的关联内存。该类实现了 `ConcurrentNavigableMap`\
  \ 接口。\n\n运动员是线程，通过 `Thread` 类的构造函数赋予一个简单的名称。\n\n## Collection API 的类型\n\n用户类型列表这次很长。然而，其设计遵循一个基本原则，所以它其实并不那么复杂：\n\
  \n*   接口描述数据结构的功能，“提供了什么”。\n*   类使用不同的策略来实现接口的规范；它们代表了“它是如何实现的”。\n\n作为开发者，我们需要了解接口和实现，为了回顾，让我们再次查看在本章中更经常遇到的核心类型：\n\
