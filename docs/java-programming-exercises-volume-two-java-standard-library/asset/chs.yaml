  \n# 先备知识与目标读者\n\n本书围绕任务展开，并提供了完整的解决方案，对 Java 的特性、良好的面向对象编程实践、最佳实践和设计模式进行了详细说明。这些练习最好结合教材完成，因为这本练习书并不是传统的教材。一种有效的方法是。\n\
  \n# 使用本书\n\n\n\n\n任务书分为几个不同的章节。第一部分涵盖 Java 语言，随后是 Java 标准库的特定领域，例如数据结构或文件处理。每个领域都配有编程任务和包含惊喜的“测验”问题。每个章节都从主题的简要介绍和描述开始，然后是练习题。对于特别具有挑战性的作业，书中提供了额外的技巧和提示，而其他练习则提供了可选的扩展以便进一步探索。\n\
  \n大多数练习之间是相互独立的，读者可以轻松从任何地方开始。然而，在命令式编程章节中，某些任务层层递进以开发一个更大的程序，面向对象编程章节也是如此。问题定义明确了这一点，而更复杂的程序有助于为理解不同的语言特性提供背景。此外，更复杂的程序可以激励读者继续下去。\n\
  \n练习根据一、二、三星进行评级以表示其复杂性，尽管这种评级是作者主观的。\n\n1. `star ★`: 简单练习，适合初学者。它们应该很容易就能不费力地解决。通常只需要知识的迁移，例如，以不同的方式写下教科中的内容。\n\
  2. `stars ★★`: 这里的投入更高。需要结合不同的技术。需要更大的创造力。\n3. `stars ★★★`: 三星作业更复杂，需要借助更多的先验知识，有时还需要进行研究。经常，任务无法再通过单一方法解决，而是需要多个必须协同工作的类。\n\
  \n## 建议解决方案\n\n任务书为每个问题提供了至少一个建议的解决方案。没有使用“示例解决方案（sample solution）”这一术语，以避免暗示给出的解决方案是最好的，所有其他解决方案都是没用的。鼓励读者将自己的解决方案与建议的进行比较，如果他们的解决方案更优雅，也可以感到满意。所有的建议解决方案都带有注释，便于遵循所有步骤。\n\
  \n建议解决方案汇在每个章节的末尾，以减少在完成任务后直接查看答案的诱惑，这会破坏解决问题的乐趣。建议解决方案可以在网站 [`github.com/ullenboom/captain-ciaociao`](https://github.com/ullenboom/captain-ciaociao)。某些解决方案包含了\
  \ `//tag::solution[]` 类型的注释，标记了书中打印的解决方案部分。\n\n## 本书的使用\n\n要成为软件开发者，你必须掌握将问题转化为代码的艺术，这就是实践和榜样发挥作用的地方。虽然网上有很多练习，但它们通常乱无章、文档不全且过时。这正是本书的闪光之处，它提供了系统化的任务方法和深思熟虑的解决方案。学习这些解决方案以及阅读代码有助于大脑形成模式和解决方案，这些模式可以应用于未来的编码挑战。这就像读圣经一样；你需要阅读来理解和学习。惊讶的是，许多软件开发者在写代码时并不在意阅读他人的代码，这可能导致困惑和误解。阅读良好的代码通过构建我们大脑无意识转移到自己代码中的模式和解决方案，提升了我们的写作水平。我们大脑根据模板独立形成神经元结构，我们接收到的输入质量至关重要。因此，我们应该只给大脑投喂良好的代码，因为糟糕的解决方案会导致糟糕的模型。本书涵盖了异常处理或错误处理等重要主题，讨论了正确的输入值、识别错误状态以及如何处理它们。在软件中，事情可能并且会出错，我们必须准备好应对这个不完美的世界。\n\
  \n开发者很容易陷入自己的写代码习惯中，这就是为什么探索新方法并俗说“扩展我们的词汇量”是重要的。对于 Java 开发者来说，库就是他们的词汇，但太多的企业级\
  \ Java 开发者编写了大量的、非面向对象的代码。解决方案是不断改进面向对象的建模，这正是本书所展示的。它引入了新方法，创建了新的数据类型并将复杂度最小化。此外，函数式编程在\
  \ Java 开发中变得越来越重要，书中所有的解决方案都利用了现代语言特性。\n\n虽然某些解决方案看起来过于复杂，但书中的任务和建议解决方案可以帮助开发者提高专注能力和执行步骤的能力。在实践中，专注和快速理解代码的能力对开发者至关重要。通常，开发者必须加入新团队，并能够理解和修改熟悉的源代码，并可能修复错误。希望扩展现有开源解决方案的人也可以通过这些练习练他们的注意力并从中受益。\n\
  \n除了强调 Java 编程语言、语法、库和面向对象之外，本书还提供了关于算法、编程历史演变与其他编程语言的比较以及数据格式等主题的旁注。这些额外的见解和视角为读者对技术方面之外的软件开发提供了更全面的理解。\n\
  \n如果你在寻找另一个理由把这本书加入你的收藏，它还是一个极佳的助眠工具！\n\n## 所需软件\n\n虽然理论上仅用纸笔解决任务是可能的，但现代软件开发需要恰善使用工具。了解编程语言语法、面向对象建模和库只是冰山一角。理解\
  \ `JVM`、使用 `Maven` 和 `Git` 等工具进行版本管理以及精练使用 `IDE` 都是专业软件开发的关键方面。一些开发者甚至可以在他们的 `IDE`\
  \ 中变魔，自动生成代码并修复错误。\n\n## 书中使用的 Java 版本\n\n虽然 `Java 8` 在企业环境中仍然流行，但对于学习者来说，熟悉最新的语言特性至关重要。因此，只要可行，书中的建议解决方案利用了\
  \ `Java 17`。该版本不仅具有长期支持（LTS），运行时环境提供商还提供广泛的支持，确保该版本在很长时间内保持适用性。\n\n### JVM\n\n\n\
  \n\nJava 源代码只是纯文本，因此从技术上说，你只需要一个简单的文本编辑器即可。然而，仅仅依靠 `Notepad` 或 `vi` 来提高效率就像试图骑三轮车赢得比赛。现代集成开发环境为我们提供了许多任务支持：关键字颜色高亮、自动代码补全、智能纠错、代码块插入、调试器状态的可视化等。因此，建议使用完整的开发环境。四种流行的\
  \ IDE 有：`IntelliJ`、`Eclipse`、`Visual Studio Code` 和 `(Apache) NetBeans`。就像 Java\
  \ 运行时环境一样，IDE 的选择取决于读者。`Eclipse`、`NetBeans` 和 `Visual Studio Code` 都是免费开源的，而 `IntelliJ\
  \ Community Edition` 也是免费的，但更高级的 `IntelliJ Ultimate Edition` 则需要花费一些费用。\n\n在书中途中，我们会在几个地方深入探讨使用\
  \ `Maven` 实现项目依赖。\n\n## 约定\n\n代码使用`等宽字体` 书写，文件名使用*斜体*。为了区分方法和属性，方法总是有一对括号，例如“变量\
  \ `max` 包含最大值”或“它返回 `max()` 最大值”。由于方法可以被重载，要么参数列表是有命名的（如 `equals(Object)`），要么使用省略号缩写，例如“各种\
  \ `println(…)` 方法”。如果提到的是一组标识符，则写 `*`，例如 `print*(...)` 在屏幕上打印某些内容。\n\n在建议的解决方案中，通常只包含相关的代码片段，以免增加书的长度。文件名会在列表标题中提到，如下所示：\n\
  \n`VanillaJava.java`\n\n```\nclass VanillaJava { }\n```\n\n有时，我们需要施展一下终端的“肌肉”，从命令行执行程序（也称为控制台或\
  \ shell）。由于每个命令行程序都有自己的提示符序列，在书中用 `$` 符号表示。用户的输入设为**粗体**。示例如：\n\n```\n$ java -version\n\
  java version \"17.0.5\" 2022-10-18 LTS\nJava(TM) SE Runtime Environment (build 17.0.5+9-LTS-191)\n\
  Java HotSpot(TM) 64-Bit Server VM (build 17.0.5+9-LTS-191, mixed mode,\nsharing)\n\
  ```\n\n如果明确指的是 Windows 命令行，则设置提示符字符 `>`：\n\n```\n> netstat -e\nInterface Statistics\n\
  \n                   Received               Sent\n\nBytes            218927776 \
  \         994180\nUnicast packets             162620          6428\nNon-unicast\
  \ packets             276             68\nDiscards                         0   \
  \            0\nErrors                           0               0\nUnknown protocols\
  \                0\n```\n\n## 帮助 Ciao 船长和 Bonny\n\n哈喽！很久以前，Ciao 船长和 Bonny 为我们某个未提及的事情提供了帮助。现在，你们欠他们一个人情。但不必，因为协助他们最新的冒险是值得的。加入这对组合和他们忠诚的船员，跟随他们航海，处理全球各地的恶徒。他们的藏身之处在\
  \ Baloo 섬，那里的货币是 Liretta。由于船员来自世界各地，所有输出均为英语，伙计们。\n\n![一张展览展示了 Ciao 船长、Bonny 和几名海盗站在一起，快乐地举着手，背景是棕榈树和旗帜。](img/01.jpg)\n\
  \n# 1 高级字符串处理\n\nDOI: [10.1201/97800349550-2](https://doi.org/10.1201/97800349550-2)\n\
  \n在另一个章节处理了围绕字符和字符串的基本类型后，我们现在将讨论高级处理。主题是格式化输出、正则表达式和字符串分割。\n\n## 前提条件\n\n* 能够格式化字符串。\n\
  * 能够使用正则表达式进行匹配、搜索和替换。\n* 能够分割字符串。\n* 理解字符编码和 UTF-8。\n\n本章使用的数据类型：\n\n* `java.util.Formatter`\n\
  * `java.lang.String`\n* `java.util.regex.Pattern`\n* `java.util.regex.Matcher`\n\
  * `java.util.Scanner`\n\n## 格式化字符串\n\n在 Java 中有多种方法可以将字符串、数字和时间数据格式化为字符串。在 `java.text`\
  \ 包中，你可以找到 `MessageFormat`、`DateFormat` 和 `DecimalFormat` 类，以及 `Formatter` 类，在 `String`\
  \ 类中有 `String.format(...)` 方法。可以使用 `Formatter` 中的格式化字符串轻松地解决后续任务。\n\n### 构建 ASCII\
