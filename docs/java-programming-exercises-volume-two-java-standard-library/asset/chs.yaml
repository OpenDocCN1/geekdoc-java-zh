  \n许多编程初学者经常问自己：“我如何增强我的技能？我如何才能成为更好的程序员？”答案是：学习、参加研讨会、进行练习。编程的许多方面是相似的，对语言的使用会循序渐进。你的练习越有效，掌握得越快。本书旨在提供帮助。许多编程初学者经常问自己：“我如何增强我的技能？我如何才能成为更好的程序员？”答案是：学习、参加研讨会、进行练习。编程的许多方面是相似的，对语言的使用会循序渐进。\n\
