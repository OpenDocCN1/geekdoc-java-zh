  \ 写一个方法 `printMultipleGifts(List<String>)` 输出东西被带来了多少次。\n* 哪些被带来过多次？\n\n示例：\n\n\
  * 对于上述赋值的可能输出：\n\n```\n{drinking helmet=2, kneading soap=1, water pistol=1, Money\
  \ box=1, BBQ=1, Vodka=3}\ndrinking helmet\nVodka\n```\n\n## Properties\n\n`Properties`\
  \ 类是一个特殊的关联内存器，其键和值都是字符串。它不仅表示一个数据结构，还可以读写名为 `property files` 的文件。（等等，文本说是 \"property\
  \ files\"，让我重读一遍）。\n\n`Properties` 类是一个特殊的关联内存器，其键和值都是字符串。它不仅表示一个数据结构，还可以读写名为 *property\
  \ files* 的文件。这些文本文件通常用于配置。键值对在文件中通过 `=` 分隔。也可以以 XML 格式读写值，但这并不常见。\n\n### 开发方便的属性装饰器\
  \ ★★\n\n`Properties` 类包含键值对，其键总是字符串。开发者必须自己进行转换，这很不方便。\n\n任务：\n\n编写一个 `PropertiesConfiguration`\
  \ 类来装饰 `Properties` 对象。最通用的方法返回一个 `Optional`，如果键存在则被填充，否则为空：\n\n* `Optional<String>\
  \ getString(String key)`\n\n使用 `Optional` 的优势是可以很容易地确定替代值：`conf.getProperty(\"rank\"\
  ).orElse(\"Captain\")`。\n\n`PropertiesConfiguration` 的其他方法用于执行转换：\n\n* `Optional<Boolean>\
  \ getBoolean(String key)`。\n* `OptionalLong getLong(String key)`。\n* `OptionalDouble\
  \ getDouble(String key)`。\n* `Optional<BigInteger> getBigInteger(String key)`。\n\
  \n如果键没有关联的值，则容器为空。如果转换失败，也会导致一个空容器。\n\nAPI 示例：\n\n\n\n\n```java\nProperties root\
  \ = new Properties();\nroot.setProperty(\"likes-rum\", \"true\");\nroot.setProperty(\"\
  age\", \"55\");\nroot.setProperty(\"income\", \"123456789012\");\nroot.setProperty(\"\
  hobbies\", \"drinking, gambling\\\\, games, swearing competitions\");\nroot.setProperty(\"\
  weakness_of_character\", \"\");\nPropertiesConfiguration conf = new PropertiesConfiguration(root);\n\
  Optional<Boolean> maybeLikesRum = conf.getBoolean(\"likes-rum\");\nOptionalLong\
  \ maybeAge = conf.getLong(\"age\");\nOptional<BigInteger> maybeIncome = conf.getBigInteger(\"\
  income\");\n\nSystem.out.println(maybeLikesRum);          // Optional[true]\nSystem.out.println(maybeAge);\
  \              // OptionalLong[55]\nSystem.out.println(maybeIncome);           \
  \ // Optional[123456789012]\n```\n\n### 可选扩展：查询列表\n\n高级开发者可以实现以下方法：\n\n*   `List<String>\
  \ getList(String key)`。返回一个逗号分隔的字符串列表。逗号本身可以通过 `\\,` 进行转义。\n\n示例：\n\n```java\nList<String>\
  \ hobbies = conf.getList(\"hobbies\");\nList<String> weaknessOfCharacter = conf.getList(\"\
  weakness_of_character\");\n\nSystem.out.println(hobbies);               // [drinking,\
  \ gambling, games, swearing competitions]\nSystem.out.println(hobbies.size()); \
  \        // 3\nSystem.out.println(weaknessOfCharacter);    // []\n```\n\n### 可选扩展：存储二进制值\n\
  \n`java.util.HashMap` 可以关联任意类型，而对于 `Properties`，只有字符串可以与字符串关联。如果需要存储其他数据类型（例如 `byte`\
  \ 数组），必须将其转换为字符串。`byte[]` 可以通过多种方式转换为 ASCII 字符串，例如使用 BASE64 编码；Java 使用 `Base64`\
  \ 类来实现这一点。\n\n由于 `Properties` 是只读而非可写的，到目前为止 `get*(…)` 方法对我们来说已经已经足够了。通过以下扩展，需要编写两个新方法，一个用于设置，一个用于查询：\n\
  \n*   `void putBinary(String key, byte[] bytes)`。\n*   `Optional<byte[]> getBinary(String\
  \ key)`。\n\n使用示例：\n\n```java\nconf.putBinary(\"binary\", new byte[]{ 0, 1, 127,\
  \ (byte) 254, (byte) 255 });\nSystem.out.println(conf.getString(\"binary\")); //\
  \ Optional[AAF//v8=]\nconf.getBinary(\"binary\").ifPresent(binary ->\n  System.out.printf(\"\
  %d %d %d %d %d\",\n                    binary[0], binary[1], binary[2], binary[3],\
  \ binary[4])\n);\n```\n\n### 栈与队列\n\nJava 中的通用列表（List）允许我们通过索引访问元素；我们将这种访问称为随机访问（random\
  \ access），因为我们可以选择请求任何位置的元素。有些数据结构的限制得多，例如只能在开头或结尾插入或删除元素。这些包括：\n\n*   栈（Stack）。\n\
  *   队列（Queues）。\n\n使用栈时，你只能在一端插入元素，并且必须在该端移除元素。这种原理也被称为 LIFO：后进先出（last in, first\
  \ out）。与之相反的是队列。在队列中，最先添加的元素最先被读取。这种原理被称为 FIFO：先入先出（first in, first out）。\n\nJava\
  \ 中不存在纯的栈和队列，只有由列表实现的接口。\n\n### 程序 RPN 口袋计算器 ★\n\n我们通常使用中置表示法（infix notation）编写数学表达式，其中运算符放在操作数之间，例如\
  \ `47 + 11`。相比之下，休尔特-帕卡（HP）计算器使用了一种特殊的符号（RPN），将运算符放在值之后，如 `47 11 +`。这是后缀表示法（postfix\
  \ notation），可以使用栈轻松求值。\n\n任务：\n\n1.  编写一个程序对 RPN 字符串进行分词。使用 `Scanner` 进行分割。\n2.\
  \  分割后，使用栈求表达式的值。\n3.  报告结果。如果表达式无效，向控制台报告错误。\n4.  应该如何处理错误？\n\n## BitSet\n\n当你需要回答\
  \ `boolean` 数组中的某个索引是被设置为 true 还是 false 时，`BitSet` 类非常有用。它是 `boolean[]` 数组的一种节省空间的替代方案。`BitSet`\
  \ 与一个整数关联。由于 `Properties` 是只读而非可写的，到目前为止 `get*(…)` 方法对我们来说已经足够了。通过以下扩展，需要编写两个新方法，一个用于设置，一个用于查询：\n\
  \n*   `void set(int index)`。\n*   `boolean get(int index)`。\n\n### 查找重复项并解决动物混乱\
  \ ★\n\nCiao 队长在睡觉前会喂养他私人动物园里的动物。但因为喝了朗酒得微醉，他忘记关门了。第二天早晨，Finian Fishbone 和 Fritte\
  \ 发现动物丢了。他们冲向 Ciao 队长：“有些动物逃了！”“哪些动物？”队长问道。两人思思着并记录道：\n\n*   \U0001F40F\U0001F434\
  \U0001F98B\n\n*   \U0001F434\U0001F40F\U0001F427\U0001F98B\n\nCiao 队长注意到两人的记忆力不好，只想寻找那些被两人都命名的动物。\n\
  \n任务：\n\n*   编写一个方法 `String sameSymbols(String, String)`，它返回一个包含公共符号的字符串。顺序不重要，所有的\
  \ Unicode 字符都是可能的。\n*   由于我们需要遍历 `string` 的所有字符，且它包含了“高位”Unicode 字符（由两个 `char` 组成），解决方案是使用\
  \ `string.codePoints().forEach(consumer)`。该语句遍历 `String` 的所有字符，并为每个字符调用传递的 `IntConsumer`。\n\
  \n示例：\n\n*   `sameSymbols(\"`\U0001F429\U0001F40F\U0001F98B`\", \"`\U0001F434\U0001F40F\
  \U0001F427\U0001F98B`\")` → `\"\U0001F40F\U0001F434\U0001F98B\"`。\n*   `sameSymbols(\"\
  abcy\", \"bcd\")` → `\"bc\"`。\n*   `sameSymbols(\"abc\", \"def\")` → `\"\"`。\n\n\
  由于结果紧急，请实现该方法使得运行时间与字符串长度成线性，用计算机科学术语来说 O(*N*+*M*)，其中 *N* 和 *M* 是字符串的长度。允许所有的 Unicode\
  \ 字符。\n\n### 检查完成情况\n\n*   创建一个新类，包含一个静态方法 `checkForCompleted(int... shipIds)`。传入船的\
  \ ID。\n*   报告哪些船出现了多次。数量并不重要。\n*   报告哪只船没有被袭击以及是哪只。\n*   以不使用嵌套循环的方式编写程序。换句话说，运行时间不应该是二次方的。\n\
  \n![展示了 Bonny Brain 看着被遗忘的船。](img/05_07.jpg)\n\n\n\n\n对于之前围绕 `ArrayList`、`LinkedList`、`HashSet`、`TreeSet`\
  \ 等数据结构的任务，我们从未需要超过主线程。在后续的任务中，将涉及到更多的线程和并发访问，这时我们需要使用线程安全的数据结构。对于解决方案，我们希望使用来自\
  \ `java.util.concurrent` 包中的数据类型。该包包含了不同的线程安全数据结构，它们即使在任意数量的并行访问也能正常工作，并具有出色的性能。\n\
  \n### 装船 ★★\n\n`CiaoCiao` 队长和船员们正准备在 Gazorpazorp 岛上的下一次大冒险做准备。五名员工将木箱和桶放在装载道上，10\
  \ 名员工将货物装入船内。装载口同时不能超过五个物体。\n\n![一张展示了 CiaoCiao 队长看着放在一起表面上的木箱和桶。](img/un05_08.jpg)\n\
  \n### 任务：\n\n*   为装载道创建一个容量为 5 的 `ArrayBlockingQueue<String>`。\n*   创建两个不同的 `Runnable`\
  \ 实现 `Loader` 和 `Unloader`，它们获取 `ArrayBlockingQueue` 的引用。\n    *   `Loader` 将字符串放在装载道上（来自一组产品名称的随机字符串）。\n\
  \    *   `Unloader` 应从装载道上取字符串并输出到屏幕。\n    *   `Loader` 和 `Unloader` 完成工作的时间随机在\
  \ 1 到 2 秒之间。\n*   应有五个 `Unloader` 线程和 10 个 `Loader` 线程。\n\n添加和移除有不同的方法。它们之间的区别很重要。否则，可能会发生程序错误：\n\
  \n**表 5.1** 用于添加和移除元素的 `BlockingQueue` 方法\n\n| 操作 | 异常 | 返回空 | 阻塞 |\n| --- | ---\
  \ | --- | --- |\n| insert | `add(e)` | `offer(e)` | `put(e)` |\n| remove | `remove()`\
  \ | `poll()` | `take()` |\n\n你无法从方法名中推断出语义；你必须学习它们的区别。对于我们的任务，只有一列，且这些方法是我们需要考虑的。\n\
  \n### 优先处理重要消息 ★★\n\n`PriorityQueue` 具有内部排序，使得优先级更高的项移动到前面。优先级来自于实现 `Comparable`\
  \ 的元素的自然排序，或外部的 `Comparator`。“小”元素具有更高的优先级并移动到 `PriorityQueue` 的前端。队列末尾是优先级最低的元素。（这与接种相同：优先级\
  \ 1 组先获得物资）。\n\n`CiaoCiao` 队长从各方那里获取工作单，但来自 Bonny Brain 的所有内容具有最高优先级。来自 Bonny Brain\
  \ 的每份工作单都包含爱称“小大炮”，这让队长知道该时候立即采取行动了。\n\n### 任务：\n\n*   将以下记录存入项目中：\n```java\nrecord\
  \ Message(String message, LocalDateTime timestamp) {\n  Message(String message)\
  \ {\n    this(Objects.requireNonNull(message), LocalDateTime.now());\n  }\n  @Override\
  \ public String toString() {\n    return \"'%s', %s\".formatted(\n      message,\
  \ timestamp.format(DateTimeFormatter.ofPattern(\"mm:ss.SSSSSSS\"))\n    );\n  }\n\
  }\n```\n*   `toString()` 将消息括在单引号中并仅显示时间戳的分和秒，因为这足够快速地视觉比较哪个消息更新或更旧。\n*   为 `Message`\
  \ 实现一个 `Comparator`，创建一种顺序，使得带有爱称的消息比不带爱称的消息“更小”，这样以后就可以将其评估为更高的优先级。如果两个消息都包含爱称，或者两个消息都不包含爱称，则它们同样重要。\n\
  *   通过另一个比较逻辑扩展 `Comparator`，以便考虑时间戳，并且较早的消息也会被较早处理。\n*   使用消息初始化 `PriorityQueue`，并观察带有爱称的消息如何在队列中移动。\n\
