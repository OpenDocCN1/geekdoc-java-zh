  \n### 通过 Windows 管理体系读取电池状态\n\nBonny Brain 在她的笔记本电脑上玩策略游戏。下一轮将持续 30 分钟，由于她的笔记本仅用电池运行，她想避免在电池耗尽时中止游戏。在\
  \ Windows 上可以使用以下调用来确定剩余运行百分比和当前负载估计的剩余分钟：\n\n```\n> wmic path win32_battery get\
  \ EstimatedChargeRemaining\n10\n> wmic path win32_battery get EstimatedRunTime\n\
  37\n```\n\n如果不是带电池的笔记本，输出为“无可用实例”。如果笔记本已负载，`EstimatedRunTime` 的结果为 71582788（十六进制为\
  \ 444444）。微软提供了详细信息 [`docs.microsoft.com/en-us/windows/32/cimwin32prov/win32-battery`](https://docs.microsoft.com/en-us/windows/32/cimwin32prov/win32-battery)。\n\
  \n任务：\n\n*   在 Java 程序中，使用 `ProcessBuilder` 启动外部程序 `wmic`。读取 `EstimatedChargeRemaining`\
  \ 和 `EstimatedRunTime` 的结果。\n\n\n\n\n\n-   考虑笔记本电脑从电网供电，或者台式电脑没有电池的情况。\n\n![图标:\
  \ 圆圈内的信息符号。](img/Icon_01.jpg) 微软操作系统提供了一个名为 `Windows Management Instrumentation`\
  \ (WMI) 的 API，用于读取并在某些情况下更改计算机的设置。WMI 似于 Java 端的 `JMX`。由于 shell 脚本通常为了自动化而访问此映射，微软创建了一个命令行接口\
  \ `Windows Management Instrumentation Command-line` (`WMIC`)。\n\n`WMI 提供程序`提供关于\
  \ CPU 使用率、主板、网络、电池状态等信息。以下调用提供了一个简要概述：\n\n```\n> wmic /\n```\n\n## 建议的解决方案\n\n###\
  \ 彩色控制台输出\n\n`com/tutego/exercise/os/AnsiColorHexDumper.java`\n\n```\nprivate static\
  \ final int EOF = -1;\nprivate static final int HEX_PER_LINE = 32;\nprivate static\
  \ void printColorfulHexDump( Path path ) throws IOException {\n  try ( InputStream\
  \ is = new BufferedInputStream(Files.newInputStream(path)) )\n{\n    for ( int i\
  \ = 0, b; (b = is.read()) != EOF; i++ ) {\n      String color = b == 0 ? ANSI_GREEN\
  \ :\n                             b == 0xFF ? ANSI_RED :\n                     \
  \        Character.isDigit( b ) ? ANSI_PURPLE :\n                             Character.isLetter(\
  \ b ) ? ANSI_BLUE :\n                             b == ' ' ? ANSI_CYAN :\n     \
  \                        ANSI_RESET;\n      System.out.printf( \"%s%02X \", color,\
  \ b );\n      if ( i % HEX_PER_LINE == (HEX_PER_LINE - 1) )\n      System.out.println();\n\
  \    }\n  }\n}\n```\n\n我们没有使用 `Files.readAllBytes(…)` 一次性读取输入，而是打开一个输入流来逐字节读取。`for`\
  \ 循环声明了两个变量：变量 `i` 控制换行，它应该在每 32 个十六进制字符后进行设置；变量 `b` 包含读取到的字节。只要结果不等于 `-1`（即仍可用字节），就会继续读取\
  \ `InputStream`。\n\n在 `for` 循环体中，会对读取的字节进行测试，并根据赋值将变量 `color` 初始化为 ANSI 转义序列。如果字节不属于这五大类之一，则重置颜色。最后，将转义序列与十六进制代码一起写入，并在每行最多\
  \ 32 个十六进制字符后设置换行。\n\n### Windows, Unix 还是 macOS?\n\n`com/tutego/exercise/os/OS.java`\n\
  \n```\npublic enum OS {\n  WINDOWS,\n  MACOS,\n  UNIX,\n  UNKNOWN;\n  public static\
  \ OS current() {\n    String osName = System.getProperty( \"os.name\" );\n    if\
  \ ( osName == null ) return UNKNOWN;\n    osName = osName.toLowerCase();\n    return\
  \ osName.contains( \"windows\" ) ? OS.WINDOWS :\n      osName.contains( \"mac\"\
  \ ) ? OS.MACOS :\n      osName.contains( \"ix\" || osName.contains( \"ux\" ) ? OS.UNIX\
  \ :\n      UNKNOWN;\n  }\n}\n```\n\n`current()` 方法从属性 `os.name` 中读取操作系统的名称。如果为 `null`，答案就显而易见。否则，该方法将名称转换为小写，并级联地测试各种子字符串。如果没有匹配到任何情况，则说明操作系统的名称是未。\n\
  \n### 合并命令行属性和文件\n\n由于所有参数（无论如何呈现）都是字符串，因此有一个独立的方法 `parseInt(String)`，它会尝试将字符串转换为数字：\n\
  \n`com/tutego/exercise/os/PortConfiguration.java`\n\n```\nprivate static final String\
  \ PORT = \"port\";\nprivate static final int DEFAULT_PORT = 8080;\nprivate static\
  \ OptionalInt parseInt( String value ) {\n  try {\n    return OptionalInt.of( Integer.parseInt(value)\
  \ );\n  }\n  catch( NumberFormatException e ) {\n    return OptionalInt.empty();\n\
  \  }\n}\n```\n\n`parseInt(String)` 方法访问 `Integer.parseInt(…)` 并在字符串无法转换为数字时捕获异常。我们的方法捕获该异常并返回\
  \ `OptionalInt.empty()`，否则返回一个包含解析后数字的 `OptionalInt`。\n\n后面是两个辅助方法：\n\n`com/tutego/exercise/os/PortConfiguration.java`\n\
  \n```\nprivate static OptionalInt portFromCommandLine( String[] args ) {\n  for\
  \ ( String arg : args )\n    if ( arg.startsWith(\"--\" + PORT + \"=\") )\n    \
  \  return parseInt( arg.substring(\"--\" + PORT + \"=\").length() ) );\n  return\
  \ OptionalInt.empty();\n}\nprivate static OptionalInt portFromPropertyFile() {\n\
  \  String filename = \"/application.properties\";\n  try ( InputStream is = PortConfiguration.class.getResourceAsStream(filename)\
  \ ) {\n    Properties properties = new Properties();\n    properties.load( is );\n\
  \    return parseInt( properties.getProperty( PORT ) );\n  }\n  catch( IOException\
  \ e ) { /* Ignore */ }\n  return OptionalInt.empty();\n}\n```\n\n`portFromCommandLine(…)`\
  \ 获取命令行参数作为参数进行评估。由于原则上可以向程序传递多个命令行参数，该方法会遍历所有控制传递并检查是否存在 `--port=`。如果是，则截取前部分并返回\
  \ `parseInt(String)` 的结果。如果没有找到，则 `OptionInt` 为 `empty()`。\n\n`portFromPropertyFile(…)`\
  \ 评估类路径下的 `application.properties` 文件。类路径中的内容通过 `Class` 方法 `getResourceAsStream(…)`\
  \ 读取，因为这支持封装在 JAR 存档中的资源。我们首先构建一个 `Properties` 对象，然后调用 `load(…)` 方法并传入 `InputStream`。如果文件不存在，`InputStream`\
  \ 将为空，这将抛出异常，但 `catch` 会捕获它以及加载过程中可能的错误。如果 `Properties` 对象被填充，我们获取 `port` 属性并通过我们自己的方法将其转换为\
  \ `OptionalInt`；如果已填充，则返回该值。\n\n最后一个方法 `port(…)` 将所有内容整合在一起。\n\n`com/tutego/exercise/os/PortConfiguration.java`\n\
  \n```\nstatic int port( String[] args ) {\n  // Step 1\n  OptionalInt maybePort\
  \ = portFromCommandLine( args );\n  if ( maybePort.isPresent() )\n    return maybePort.getAsInt();\n\
  \  // Step 2\n  OptionalInt maybePortProperty = parseInt( System.getProperty( PORT\
  \ ) );\n  if ( maybePortProperty.isPresent() )\n    return maybePortProperty.getAsInt();\n\
  \  // Step 3\n  OptionalInt maybePortApplicationProperty = portFromPropertyFile();\n\
  \  if ( maybePortApplicationProperty.isPresent() )\n    return maybePortApplicationProperty.getAsInt();\n\
  \  // Step 4\n  return DEFAULT_PORT;\n}\n```\n\n### 通过 Windows Management Instrumentation\
  \ 读取电池状态\n\n`com/tutego/exercise/os/WmicBattery.java`\n\n\n\n\n\n```java\nstatic\
  \ OptionalInt wmicBattery( String name ) {\n  try {\n    String[] command = { \"\
  CMD\", \"/C\",\n                        \"wmic\", \"path\", \"win32_battery\", \"\
  get\", name };\n    Process process = new ProcessBuilder( command ).start();\n \
  \   try ( InputStream is = process.getInputStream();\n          Reader isr = new\
  \ InputStreamReader( is );\n          Stream<String> stream = new BufferedReader(\
  \ isr ).lines() ) {\n      return stream.map( String::trim )\n              .filter(\
  \ s -> s.matches( \"\\\\d+\" )\n              .mapToInt( Integer::parseInt )\n \
  \             .findFirst();\n    }\n  }\n  catch ( IOException e ) {\n    Logger.getLogger(\
  \ WmicBattery.class.getName() ).info( e.toString() );\n    return OptionalInt.empty();\n\
  \  }\n}\n```\n\n由于我们的程序使用不同的参数两次调用 WMIC，建议的引入了一个新方法 `wmicBattery(…)`，在我们的案例中它可以传递\
  \ `EstimatedChargeRemaining` 和 `EstimatedRunTime`。这种效果很好，因为这两个查询总是期望一个数值值。\n\n`wmicBattery(…)`\
  \ 声明了一个新数组并将其传递给 `ProcessBuilder` 的构造函数，以便可以使用 `start()` 进程。返回的是 `Process` 对象，我们从下一步中从中获取输出，即我们的\
  \ `InputStream`。我们不需要自己向进程写入任何内容，因此不需要单独的 `OutputStream`。我们也不需要等待进程完成，它会自动完成。\n\n\
  从输入中提取相关部分有不同的方法。此建议的解决方案将 `InputStream` 转换为 `BufferedReader`，以便可以使用 `lines()` 方法，该方法返回包含所有行的\
  \ `Stream`。我们首先删除每行开头和结尾的空格，然后只查找包含数字的行。如果某行包含数字，则会进行转换，产生一个 `IntStream`，其中 `findFirst()`\
  \ 为我们提供一个 `OptionalInt`，该值可能为空（例如，由于电池缺失，进程输出中没有数字），或者包含该数字。处理过程中可能发生的错误会被捕获；返回结果为\
  \ `OptionalInt.empty()`。\n\n在使用时，该方法可以这样调用：`com/tutego/os/WmicBattery.java`\n\n\
  ```java\nwmicBattery(\"EstimatedChargeRemaining\").ifOrElse(\n  value -> System.out.printf(\"\
  Estimated charge remaining: %d%%%n\", value),\n  () -> System.out.println(\"No instances.\"\
  ) );\nwmicBattery(\"EstimatedRunTime\").ifOrElse(\n  minutes -> System.out.printf(minutes\
  \ == 044444 ? \"Charging\" : \"Estimated run time: %d:%02d (%d minutes)%n\", minutes/60,\
  \ minutes),\n  () -> System.out.println(\"No instances.\") );\n```\n\n对于 `EstimatedChargeRemaining`，没有需要解释的值。如果\
  \ `OptionalInt` 为空，则执行的操作应与 `OptionalInt` 包含内容时不同。这正是 `OptionalInt` 方法 `ifOrElse(IntConsumer\
  \ action, RunnableAction)` 有用的地方。\n\n对于 `EstimatedRunTime`，有一个特殊情况，即电池当前正在充电，因此没有剩余时间的估算。代码测试了这种情况，然后返回一个不同的字符串。参数始终传递给\
  \ `printf(…)` 方法，当然，在充电情况下这些参数是被忽略的。\n\n属性的输出可能会很快变得困惑，例如：\n\n```\n> wmic diskdrive\
  \ get Availability BytesPerSector CapabilityDescriptions Caption\nCompressionMethod\
  \ ConfigManagerErrorCode ConfigUserConfig\nCreationClassName DefaultBlockSize Description\
  \ DeviceID ErrorCleared\nErrorDescription Errorology FirmwareRevision Index InstallDate\n\
  InterfaceType LastErrorCode Manufacturer MaxBlockSize MaxMediaSize\nMediaLoaded\
  \ MediaType MinBlockSize Name NeedsCleaning\nNumberOfMediaSupported Partitions PNPDeviceID\
  \ PowerManagementCapabilities\nPowerManagementSupported SCSIBus LogicalUnit CSIPort\
  \ CSITargetId\nSectorsPerTrack Signature Size Status StatusInfo\nSystemCreationClassName\
  \ SystemName TotalCylinders TotalHeads TotalSectors\nTotalTracks TracksPerCylinder\n\
  512 {3, 4} {\"Random Access\", \"Supports Writing\"} MZVLB1T0HALR-00000 0\nFALSE\
  \ Win32_DiskDrive Laufwerk \\PHYSICALDRIVE1 EXA7201Q 1 SCSI (Standardlaufwerke)\
  \ TRUE Fixed hard disk media MZVLB1T0HALR-00000\n.\\PHYSICALDRIVE1 3 SCSI\\DISK&VEN_NVME&PROD_SAMSUNG_MZVLB1T0\\\
  5&1E3CE74&0&000000 0 0 1 0 63 0025_3886_81B2_A1AD.```\n\n``` 这种格式很难解析，这就是为什么 WMIC\
  \ 提供了不同的格式。在命令末尾附加 `/format:csv` 可以使输出变得更容易。\n\n```\nwmic diskdrive get /format:csv\n\
  ```\n\n第一行包含列名，后面是逗号分隔的值。\n\n如果只请求特定的键，它们将列在 `get` 之后，例如：\n\n```\n> wmic diskdrive\
  \ get Model,Size,SerialNumber /format:csv\nNode,Model,SerialNumber,Size\nDESKTOP-0P7C7G,SAMSUNG\
  \ MZVLB1T0HALR-00000,0025_3886_81B2_A1AD.,1024203640320\nDESKTOP-0P7C7G,WDC WD40EZRX-22SPEB0,WD-WCC4E2SHPE5N,400078441728\n\
  ```\n\n此外，`/format:list` 适用于解析，因为它产生了 Java 中常见的属性格式，这在有结果时非常方便。还有许多其他格式。\n\n\n\n\
  \n\n`Reflection`（反射）赋予我们观察运行中的 Java 程序的能力。我们可以查询一个类拥有哪些属性，随后可以在任意对象上调用方法，并读取和修改对象或类变量。许多框架都使用了反射\
  \ API，例如用于对象关系映射的 `JPA` (Jakarta Persistence API) 或用于将 Java 对象映射到 XML 结构的 `Jakarta\
  \ XML Binding` (JAXB)。我们将亲自编写一些示例，这些示例如果没有反射是无法实现的。\n\n注解（Annotations）是一种自编程的修饰符。它们允许我们向源代码中添加元数据，这些元数据之后可以通过反射或其他工具进行读取。通常情况下，我们只是他人注解的使用者，在本章中，我们还将练习如何编写自己的注解类型。\n\
  \n## 前提条件\n\n* 了解 `Class` 类型。\n* 能够在运行时读取类型关系。\n* 能够在运行时处理对象属性。\n* 能够读取注解。\n* 能够声明新的注解类型。\n\
  \n本章中使用的数据类型：\n\n* `java.lang.Class`\n* `java.lang.reflect.Field`\n* `java.lang.reflect.Method`\n\
  * `java.lang.reflect.Constructor`\n* `java.lang.reflect.Modifier`\n\n## 反射 API\n\
  \n反射 API 可用于检查任意对象，以下任务将利用这一点生成任意数据类型的 UML（统一建模语言）图。这些任务侧重于实际应用；你也可以用反射 API 做很多无意义的事情，例如修改不可变字符串中的字符，但那是很愚蠢的，我们不想这样做。\n\
  \n### 创建带有继承关系的 UML 类图 ★\n\nUML 图在系统文档记录中非常有用。某些 UML 图也可以由工具自动生成。我们想从零开始编写这样一个工具。起点是一个任意类，通过反射对其进行检查。我们可以读取该类的所有属性并生成\
  \ UML 图。\n\n由于 UML 图是图形化的，自然产生了一个如何在 Java 中绘制图形的问题。我们不想解决这个问题，而是使用描述语言 `PlantUML`\
  \ ([`plantuml.com/`](https://plantuml.com/))。PlantUML 之于 UML 图就像 HTML 之于网页、SVG 之于矢量图形。例如：\n\
  \n```\ninterface Serializable <<interface>>\nSerializable <|-- ElectronicDevice\n\
  ElectronicDevice <|.. Radio\n```\n\n箭头 `--|>` 或 `<|-- 用实线表示，`..|>` 或 `<|..` 用虚线表示。\n\
  \nPlantUML 根据这些文本文档生成以下类型的表示：\n\n![一张图片显示了纯文本 UML（统一建模语言）编辑器的屏幕截图，默认界面显示了 Serializable、Electronic\
  \ Device 和 Radio 类。](img/Fig13_01.jpg)\n\n**图 13.1** 在 [www.planttext.com](http://www.planttext.com)\
  \ 上以图形表示的 PlantUML 语法。\n\nPlantUML 是开源的，你可以安装一个命令行程序，将文本描述转换为带有 UML 图的图表。还有像 [`www.planttext.com`](https://www.planttext.com)\
  \ 这样的网站，可以显示实时 UML 图。\n\n任务：\n\n* 对于任意一个仅给出全限定名的类，生成一个 PlantUML 图文本，并将该文本输出到控制台。\n\
  \    * 图表应显示该类型及其基类型（父类和实现的接口）。\n    * 图表还应递归地列出所有父类的类型。\n\n示例：\n\n* 对于 `Class.forName(\"\
  java.awt.Point\")`，输出可能如下：\n\n```\nPoint2D <|-- Point\nObject <|-- Point2D\ninterface\
  \ Cloneable <<interface>>\nCloneable <|.. Point2D\ninterface Serializable <<interface>>\n\
  Serializable <|.. Point\nhide members\n```\n\n### 创建带有属性的 UML 类图 ★\n\n在 PlantUML\
  \ 中，不仅可以描述类型关系（如继承、接口实现关联），还可以描述对象/静态变量和方法：\n\n```\nclass Radio {\nisOn: Boolean\n\
  isOn() : Boolean\n{static} format(number: int): String\n}\n```\n\n结果看起来像这样：\n\n\
  ![一张图片显示了在矩形框内作为 radio 类的 Plant 统一建模语言语法的图形表示。](img/Fig13_02.jpg)\n\n**图 13.2**\
  \ 图形表示的 PlantUML 语法。\n\n任务：\n\n* 编写一个方法，获取任意 `Class` 对象并返回一个 PlantUML 语法的多行字符串作为结果。\n\
  * 仅包含对象/静态变量、构造函数和方法就足够了，不需要包含类型关系。\n\n示例：\n\n* 对于类型 `java.awt.Dimension`，输出可能如下：\n\
  \n```\n@startuml\nclass Dimension {\n  + width: int\n  + height: int\n    - serialVersionUID:\
  \ long\n  + Dimension(arg0: Dimension)\n  + Dimension()\n  + Dimension(arg0: Dimension,\
  \ arg1: int)\n  + equals(arg0: Object)\n  + toString()\n  + getSize(arg0: int)\n\
  \  + hashCode()\n  + getWidth()\n  + getHeight()\n}\n@enduml\n```\n\n### 从列表生成 CSV\
  \ 文件\n\n在 CSV（逗号分隔值）文件中，条目由逗号分隔，如下：\n\n```\n1;2;3\n4;5;6\n```\n\n任务：\n\n* 编写一个静态方法\
  \ `writeAsCsv(List<?> objects, Appendable out)`，遍历列表中的所有对象，通过反射提取所有信息，然后将结果以 CSV\
  \ 格式写入输出流。\n* CSV 列的分隔符默认为 `';'`，但应该能够通过 `delimiter(char)` 方法更改。\n\n示例用法：\n\n```\n\
  Point p = new Point(1, 2);\nPoint q = new Point(3, 4);\nList<?> list = Arrays.asList(p,\
  \ q);\nWriter out = new StringWriter();\nwriteAsCsv(list, out);\nSystem.out.println(out);\n\
  ```\n\n加分：如果你访问实例变量，则标记为 `transient` 的实例变量不应被写入。\n\n## 注解\n\n注解允许我们在 Java 代码中引入元数据，稍后可以被读取（通常通过反射）。注解已变得至关重要，因为许多开发者以声明的方式表达配置，并将实际执行交给框架。\n\
  \n### 从带注解的实例变量创建 CSV 文档\n\n给定一个带有注解的类：\n\n```\n@Csv\nclass Pirate {\n  @CsvColumn\
  \ String name;\n  @CsvColumn String profession;\n  @CsvColumn int height;\n  @CsvColumn(format=\"\
  ### €\") double income;\n  @CsvColumn(format=\"###.00\") Object weight;\n  String\
  \ secrets;\n}\n```\n\n任务：\n\n* 声明注解 `@Csv`，它只能应用于类型声明。\n* 声明注解 `@CsvColumn`，它只能应用于实例变量。\n\
  * `@CsvColumn` 允许一个字符串属性 `format`，用于使用 `DecimalFormat` 模式控制数字的格式化。\n* 创建类 `CsvWriter`，其构造函数存储一个\
  \ `Class` 对象作为类型令牌，以及一个 `Writer`，稍后将写入 CSV 行。`CsvWriter` 类可以实现 `AutoCloseable`。\n\
  * 创建泛型类型 `CsvWriter<T>`。\n* 编写两个新方法：\n    * `void writeObject(T object)`：写入一个对象。\n\
  \    * `void write(Iterable<? extends T> iterable)`：写入多个对象。\n* 考虑可能发生的错误情况并作为未检异常报告它们。\n\
  \n\n\n\n\n```java\nPirate p1 = new Pirate();\np1.name = \"Hotzenplotz\";\np1.profession\
  \ = null;\np1.height = 192;\np1.income = 124234.3234;\np1.weight = 89.10;\np1.secrets\
  \ = \"kinky\";\n\nStringWriter writer = new StringWriter();\ntry ( CsvWriter<Pirate>\
  \ csvWriter =\n          new CsvWriter<>( Pirate.class, writer ).delimiter( ','\
  \ ) ) {\n  csvWriter.writeObject( p1 );\n  csvWriter.writeObject( p1 );\n}\nSystem.out.println(\
  \ writer );\n```\n\n## 建议解决方案\n\n## 创建继承关系的 UML 类图\n\n**com/tutego/exercise/lang/reflect/PlantUmlTypeHierarchy.java**\n\
  \n```java\n public static void visitType( Class<?> clazz ) {\n\n  if ( clazz.getSuperclass()\
  \ != null ) {\n    System.out.printf( \"%s <|-- %s%n\",\n                      clazz.getSuperclass().getSimpleName(),\n\
  \                      clazz.getSimpleName() );\n    visitType( clazz.getSuperclass()\
  \ );\n   }\n\n  for ( Class<?> interfaze : clazz.getInterfaces() ) {\n    System.out.printf(\
  \ \"interface %s <<interface>>%n\", interfaze.\ngetSimpleName() );\n      System.out.printf(\
  \ \"%s <|.. %s%n\",\n                          interfaze.getSimpleName(),\n    \
  \                      clazz.getSimpleName() );\n    visitType( interfaze ); }\n\
  \  }\n\n  public static void main( String[] args ) throws ClassNotFoundException\
  \ {\n//    Class<?> clazz = Class.forName( \"javax.swing.JButton\" );\n    Class<?>\
  \ clazz = Class.forName( \"java.awt.Point\" );\n    visitType( clazz );\n    System.out.println(\
  \ \"hide members\" );\n  }\n```\n\n该解决方案的核心是自定义方法 `visitType(Class<?> clazz)`，它是被递归调用的。我们不需要关心对象/类变量、方法和构造函数，只需要关注可能的父类和实现的接口。\n\
  \n第一个分支判断处理了可能的父类。这些类中最多只有一个。在 `Class` 对象上，我们调用 `getSuperclass()`，如果我们在继承层次中已经到达了\
  \ `java.lang.Object`，则返回 `null`，否则返回父类本身。如果有父类，程序会生成一个箭头。\n\n如果我们找到了父类，它可能也会有父类，因此我们再次递归地调用\
  \ `visitType(…)` 方法。\n\n第二部分为实现的接口生成箭头。扩展的 `for` 循环遍历所有接口。如果类没有实现某个接口，则循环不会执行。如果存在接口，我们会获取该接口的名称以及我们自己的类名称并生成箭头。由于该接口可以扩展其他接口，我们再次递归地调用\
  \ `visitType(…)`。\n\n## 创建带有属性的 UML 类图\n\n**com/tutego/exercise/lang/PlantUmlClassMembers.java**\n\
  \n```java\nprivate static String plantUml( Class<?> clazz ) {\n\n  StringWriter\
  \ result = new StringWriter( 124 );\n  PrintWriter body = new PrintWriter( result\
  \ );\n  body.printf( \"@uml\\nclass %s\\n\", clazz.getSimpleName() );\n\n  for (\
  \ Field field : clazz.getDeclaredFields() ) {\n    String visibility = formatUmlVisibility(\
  \ field );\n    String type = field.getType().getSimpleName();\n    body.printf(\
  \ \"  %s %s: %s\\n\", visibility, field.getName(), type );\n  }\n\n  for ( Constructor<?>\
  \ method : clazz.getConstructors() ) {\n    body.printf( \"  %s %s(%s)\\n\",\n \
  \               formatUmlVisibility( method ),\n                clazz.getSimpleName(),\n\
  \                formatParameters( method.getParameters() );\n  }\n\n  for ( Method\
  \ method : clazz.getDeclaredMethods() ) {\n    String visibility = formatUmlVisibility(\
  \ method );\n    String parameters = formatParameters( method.getParameters() );\n\
  \    String returnType = method.getReturnType().getSimpleName();\n    body.printf(\
  \ \"  %s %s(%s): %s\\n\",\n                visibility, method.getName(), parameters,\
  \ returnType );\n  }\n\n  body.println( \"}\\enduml\" );\n  return result.toString();\n\
  }\n\nprivate static String formatParameters( Parameter[] parameters ) {\n  return\
  \ Arrays.stream( parameters )\n      .map( p -> p.getName() + \": \" + p.getType().getSimpleName()\
  \ )\n      .collect( Collectors.joining( \", \" ) );\n}\n\nprivate static String\
  \ formatUmlVisibility( Member field ) {\n  return Modifier.isPrivate( field.getModifiers()\
  \ ) ? \"-\" :\n         Modifier.isPublic( field.getModifiers() ) ? \"+\" :\n  \
  \       Modifier.isProtected( field.getModifiers() ) ? \"#\" :\n         \"~\";\n\
  }\n```\n\n重点在于 `plantUml(Class)` 方法；它为 `Class` 对象生成用于 UML 图的文本。由于我们需要构建一个字符串，我们有多种选择。我们可以使用\
  \ `+` 运算符拼接字符串，或者使用 `StringBuilder` 并使用 `append(…)` 方法。然而，如果能使用格式化字符串将会很方便。在这里我们可以使用\
  \ `PrintWriter` 类，我们已经通过 `System.out` 以类似 API 的形式了解了它。`PrintWriter` 为我们提供了良好的 `print(…)`、`println(…)`\
  \ 和 `printf(…)` 方法。`PrintWriter` 是一个适配器，需要一个目标来写入生成的字符串。我们希望将结果收集在 `StringWriter`\
  \ 中。\n\n然后我们开始写入 UML 图的各个部分。首先是类名，然后是对象/类变量，接着是构造函数，最后是方法。`Class` 对象通过相应的方法为我们提供数据。对象/类变量、构造函数和方法有一个共同点，就是它们的可见性。这可以通过基础类型\
  \ `Member` 进行查询。`formatUmlVisibility(Member)` 将修饰符转换为字符串。\n\n## 从列表生成 CSV 文件\n\n\
  **com/tutego/exercise/lang/reflect/ReflectionExporter.java**\n\n```java\npublic\
  \ static void writeAsCsv( List<?> objects, Appendable out )\n  throws IOException\
  \ {\n  for (Object object : objects ) {\n    String line = Arrays.stream(object.getClass().getFields())\n\
  \      .filter(f -> !Modifier.isTransient(f.getModifiers()))\n      .map(f -> accessField(f,\
  \ object))\n      .collect( Collectors.joining(\";\"));\n    out.append(line).append(\"\
  \\n\");\n  }\n}\n\nprivate static String accessField(Field field, Object object\
  \ ) {\n  try {\n    return field.get(object).toString();\n  } catch ( IllegalAccessException\
  \ e ) {\n    throw new RuntimeException(e);\n  }\n}\n```\n\n该解决方案由所需的 `writeAsCsv(List<?>\
  \ objects, Appendable out)` 方法和一个辅助方法 `accessField(…)` 组成。\n\n\n\n\n在下一步，我们需要读取实例变量。为了这一点，我们依赖于一个独立的方法。其之所以是\
  \ lambda 表达式和检查异常会导致语法变得杂乱，因为检查异常必须在 lambda 表达式内部被捕获。然而，反射 API（Reflection API）频繁使用检查异常。自定义方法\
  \ `String accessField(Field, Object)` 的目的是读取给定对象的实例变量，并将其转换为字符串。该方法捕获可能的检查异常并将其封装为未检查异常。流的终端操作会收集所有部分字符串并用分号将它们连接起来。最后，将包含换行符在内的行写入\
  \ `writer` 中。\n\n### 从带注解的实例变量创建 CSV 文档\n\n解决方案需要声明两种注解类型。第一类型 `Csv` 使用 `@Target(ElementType.TYPE)`，因为它只允许用在类型声明上，而且当然，此注解必须在运行时读取，因此使用了\
  \ `RetentionPolicy.RUNTIME`：\n\n```\ncom/tutego/exercise/annotation/Csv.java\nimport\
  \ java.lang.annotation.ElementType;\nimport java.lang.annotation.Retention;\nimport\
  \ java.lang.annotation.RetentionPolicy;\nimport java.lang.annotation.Target;\n\n\
  @Retention( RetentionPolicy.RUNTIME )\n@Target( ElementType.TYPE )\npublic @interface\
  \ Csv {\n}\n```\n\n第二种注解类型 `CsvColumn` 仅附加到类/实例变量上，因此使用 `@Target(ElementType.FIELD)`。然而，无法将应用仅限于实例变量。此注解同样在运行时读取。`CsvColumn`\
  \ 拥有一个用于格式化字符串的 `format` 属性，默认为空。我们稍后不会评估空字符串。\n\n```\ncom/tutego/exercise/annotation/CsvColumn.java\n\
  import java.lang.annotation.ElementType;\nimport java.lang.annotation.Retention;\n\
  import java.lang.annotation.RetentionPolicy;\nimport java.lang.annotation.Target;\n\
  \n@Retention( RetentionPolicy.RUNTIME )\n@Target( ElementType.FIELD )\npublic @interface\
  \ CsvColumn {\n  String format() default \"\";\n}\n```\n\n让我们继续查看 `CsvWriter`：\n\
  \n```\ncom/tutego/exercise/annotation/CsvWriter.java\npublic class CsvWriter<T>\
  \ implements AutoCloseable {\n\n  private final List<Field> fields;\n  private final\
  \ Class<?> clazz;\n  private final Writer writer;\n  private char delimiter = ';';\n\
  \n  public CsvWriter( Class<T> clazz, Writer writer ) {\n    if ( ! clazz.isAnnotationPresent(\
  \ Csv.class ) )\n      throw new IllegalArgumentException(\n          \"Given class\
  \ is not annotated with @Csv\" );\n\n    fields = Arrays.stream( clazz.getDeclaredFields()\
  \ )\n                      .filter( field -> field.isAnnotationPresent( CsvColumn.class\
  \ ) )\n                      .toList();\n\n    if ( fields.isEmpty() )\n      throw\
  \ new IllegalArgumentException(\n          \"Class does not contain any @CsvColumn\"\
  \ );\n    this.clazz = clazz;\n      this.writer = Objects.requireNonNull( writer\
  \ );\n    }\n\n    public CsvWriter<T> delimiter( char delimiter ) {\n      this.delimiter\
  \ = delimiter;\n      return this;\n    }\n\n    public void write( Iterable<? extends\
  \ T> iterable ) {\n      iterable.forEach( this::writeObject );\n    }\n\n    public\
  \ void writeObject( T object ) {\n\n      if ( ! clazz.isInstance( object ) )\n\
  \        throw new IllegalArgumentException(\n          \"Argument is of type \"\
  \ + object.getClass().getSimpleName()\n          \" but must be of type \" + clazz.getSimpleName()\
  \ );\n      String line = fields.stream()\n              .map( field -> getFieldValue(\
  \ object, field ) )\n              .collect( Collectors.joining(\n             \
  \ Character.toString( delimiter ), \"\", \"\\n\" );\n      try {\n        writer.write(\
  \ line );\n      }\n      catch ( IOException e ) {\n        throw new UncheckedIOException(\
  \ e );\n      }\n    \n\n    private String getFieldValue( Object object, Field\
  \ field ) {\n      try {\n        Object fieldValue = field.get( object );\n\n \
  \       if ( fieldValue == null )\n          return \"\";\n\n      String format\
  \ = field.getAnnotation( CsvColumn.class ).format();\n\n      if ( format.isBlank()\
  \ )\n        return Objects.toString( fieldValue );\n      if ( isNumericType( fieldValue\
  \ ) )\n        return new DecimalFormat( format ).format( fieldValue );\n\n    \
  \  throw new IllegalStateException( \"Only numeric types can be formatted,\n   \
  \       but type was \"\n                                     + fieldValue.getClass().\n\
  getSimpleName() );\n      }\n    catch ( IllegalAccessException e ) {\n      throw\
  \ new RuntimeException( e );\n      }\n    }\n\n    private static boolean isNumericType(\
  \ Object value ) {\n      return Stream.of( Integer.class, Long.class, Double.class,\n\
  \            BigInteger.class, BigDecimal.class )\n          .anyMatch(value::isInstance);\n\
  \    }\n\n    @Override\n    public void close() {\n      try {\n        writer.close();\n\
  \      }\n      catch ( IOException e ) {\n        throw new UncheckedIOException(\
  \ e );\n      }\n    }\n}\n```\n\n\n\n\n- 如果没有格式模式，或者格式仅由空格组成，则返回值的字符串表示。\n- 如果存在格式模式，`isNumericType(…)`\
  \ 会检查属性中的值是否为数值类型。该属性本可以在构造函数中已经进行测试，但这样做会有一个缺点：例如，如果类型是 `Object`，而在运行时其背后是一个 `Double`，那么这样做是完全没问题的。这种测试只能在运行时进行。对于数值属性，`DecimalFormat`\
  \ 的 `format(…)` 方法会返回字符串表示。如果给定了格式模式但类型不是数值型，则会抛出 `IllegalStateException`。\n\n`DecimalFormat`\
  \ 可以自动格式化不同类型。有效类型通过自有的方法 `isNumericType(…)` 进行测试。这些类型包括 `Integer`、`Long`、`Double`、`BigInteger`\
  \ 和 `BigDecimal`。\n\n# 结语\n\n向那些坚持完成任务、深入建议解决方案并到达终点的人致敬。这段旅程可能很长，但现在为成功的 Java 生涯奠定了基础。但坦率地说，这仅仅是一个开始。真正取得成功的人始终始终遵循以下三个步骤：\n\
  \n1. 阅读书籍、学习博客文章、观看学习视频。\n2. 编写代码、尝试，并用批判性的眼光审视自己的解决方案。\n3. 阅读并学习他人的源代码，识别模式并学习新技术。\n\
  \n此外，还有一些网站和论坛定期发布新任务。一些免费网站包括：\n\n## Code Golf Stack Exchange\n\n根据官方介绍，“Code Golf\
  \ Stack Exchange 是一个用于娱乐性编程竞赛的网站”。有些任务是用 Java 解决的，许多任务使用了仅为了紧凑表示而发明的非常晦涩的编程语言 ([`codegolf.stackexchange.com/questions`](https://codegolf.stackexchange.com/questions))。\n\
  \n## Project Euler\n\n来自该网站：“Project Euler 是一系列具有挑战性的数学/编程问题，解决这些问题需要不仅仅是数学洞察力。”其中许多问题源自数学，但开发者还必须使用复杂的算法来解决它们\
  \ ([`projecteuler.net/`](https://projecteuler.net/))。\n\n## Daily Programmer\n\n\
  Reddit 自称为“互联网的首页”，由大量被称为“subreddits”的论坛组成。其中一个子论坛是 Daily Programmer，它致力于通过每周编程挑战来各种技能水平的程序员。难度各不等\
  \ ([`www.reddit.com/r/dailyprogrammer/`](https://www.reddit.com/r/dailyprogrammer/))。\n\
  \n## Rosetta Code\n\nRosetta Code 的魅力在于编程语言的多样性。在 800 多种编程语言中有超过 1000 个编程任务和建议解决方案。作为\
  \ Java 开发者，也可以从其他编程语言的解决方案中学习；可能从 COBOL 这样的恐古语言中中学较少，但从函数式编程语言中受益巨大 ([`rosettacode.org/wiki/Rosetta_Code`](https://rosettacode.org/wiki/Rosetta_Code))。\n\
  \n一些公司还将任务视为招聘流程的一部分。这产生了一种商业模式，商业供应商提供供申请者完成的封闭任务，人力资源部门和首席开发人员评估提出的解决方案并提取指标。\n\
  \n另一个发展是 `Competitive Programming`（竞赛编程），其目标是开发解决方案，完成任务即可积分，得分最高的人被宣布为胜者。\n\n***\n\
