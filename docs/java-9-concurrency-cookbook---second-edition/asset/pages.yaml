    Follow these steps to implement the example:


    +   1. Create a class named MyPriorityTask that implements the Runnable and Comparable
    interfaces parameterized by the MyPriorityTask class interface:


    ```

    public class MyPriorityTask implements Runnable,

    Comparable<MyPriorityTask> {

    ```


    +   2. Declare a private int attribute named priority:


    ```

    private int priority;

    ```'
