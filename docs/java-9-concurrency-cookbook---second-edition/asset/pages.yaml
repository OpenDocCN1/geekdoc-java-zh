  md: '# There''s more...


    You can also use the Runnable interface to implement the tasks because the schedule()
    method of the ScheduledThreadPoolExecutor class accepts both types of tasks.


    Although the ScheduledThreadPoolExecutor class is a child class of the ThreadPoolExecutor
    class (and therefore inherits its features), Java recommends that you use ScheduledThreadPoolExecutor
    only for scheduled tasks.


    Finally, you can configure the behavior of the ScheduledThreadPoolExecutor class
    when you call the shutdown() and there are pending tasks waiting for the end of
    your delay time. The default behavior is that these tasks will be executed despite
    the finalization of the executor. You can change this behavior using setExecuteExistingDelayedTasksAfterShutdownPolicy()
    method of the ScheduledThreadPoolExecutor class. If you call theExecuteExistingDelayedTasksAfterShutdownPolicy()
    passing the false value as parameter, pending tasks won''t be executed after you
    call the shutdown() method.


    # See also


    +   * The Executing tasks in an executor that returns a result recipe in this
    chapter


    # Running a task in an executor periodically


    The Executor framework provides the ThreadPoolExecutor class to execute concurrent
    tasks using a pool of threads that helps you avoid thread creation operations.
    When you send a task to the executor, it executes the task as soon as possible
    according to its configuration. When it ends, the task is deleted from the executor,
    and if you want to execute it again, you have to send it to the executor again.


    However, the Executor framework provides the possibility of executing periodic
    tasks through the ScheduledThreadPoolExecutor class. In this recipe, you will
    learn how to use this functionality of the class to schedule a periodic task.'
