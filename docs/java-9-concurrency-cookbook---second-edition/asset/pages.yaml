    +   - Acquire control over the lock in one of the previous modes. If the methods
    (`tryOptimisticRead()`, `tryReadLock()`, `tryWriteLock()`) are unable to get control
    of the lock, they return a special value to indicate this circumstance.

    - Convert one mode into another, if possible. If not, the methods (`asReadLock()`,
    `asWriteLock()`, `asReadLock()`) return a special value.

    - Release the lock.


    +   - All these methods return a long value called stamp that we need to use with
    the lock. If a method returns zero, it means it tried to get a lock but couldn''t.

    - A `StampedLock` is not a reentrant lock, such as the `Lock` and `ReadWriteLock`https://en.wikipedia.org/wiki/Reentrant_lock)
    interfaces. If you call a method that tries to get the lock again, it may be blocked
    and you''ll get a deadlock.

    - It does not have the notion of ownership. They can be acquired by one thread
    and released by another.

    - Finally, it doesn''t have any policy about the next thread that will get control
    of the lock.


