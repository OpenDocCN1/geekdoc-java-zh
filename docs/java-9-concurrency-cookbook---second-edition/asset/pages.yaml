  md: '# Testing Concurrent Applications


    Internally, when the MultithreadedTC library has to execute a test, first it executes
    the initialize() method. It creates a thread per method that starts with the thread
    keyword (in your example, the methods thread1(), thread2(), and thread3()). When
    all the threads have finished their execution, it executes the finish() method.
    To execute the test, you used the runOnce() method of the TestFramework class.


    # There''s more...


    If the MultithreadedTC library detects that all the threads of the test are blocked
    except in the waitForTick() method, the test is declared to be in a deadlock state
    and a java.lang.IllegalStateException exception is thrown.


