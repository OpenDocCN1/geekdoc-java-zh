    Server: Completed Tasks: 0

    Server: New task has arrived

    Server Pool Size: 4

    Server: Active Count: 4

    Server: Task Count: 9

    Server: Completed Tasks: 0

    Main: Shutting down the executor.

    Server: New task has arrived

    RejectedExecutionException: The task com.packhub.java.concurrent.ThreadPoolExecutor$1.chapter.04.task$62fef95
    has been rejected

    RejectedExecutionHandler: java.util.concurrent.ThreadPoolExecutor@3e6af64c(Shutting
    down, pool size = 4, active threads = 4, queued tasks = 9, completed tasks = 0)

    RejectedExecutionHandler: terminated: false

    ```


    See that when the last task arrives at the executor, both the number of threads
    in the pool and the number of cores of the PC on which the example was executed,
    are represented by 4. This refers to the number of cores... is the number returned
    by the availableProcessors() method. Once this is done, we shut down the executor
    and the next task is rejected. RejectedTaskController writes information about
    the task and the executor in the console.


