    # How it works...


    When you run this program, you would understand how both the thread objects start
    their execution. First, the DataSourcesLoader thread finishes its execution. Then,
    the NetworkConnectionsLoader class finishes its execution. At this moment, the
    main thread continues its execution and writes the final message.


    # There''s more...


    Java provides two additional forms of the join() method:


    +   - join (long milliseconds)

    - join (long milliseconds, long nanos)


    In the first version of the join() method, instead of indefinitely waiting for
    the finalization of the thread called, the calling thread waits for the milliseconds
    specified as the parameter of the method. For example, if this object thread1
    has thread2.join(1000), thread1 suspends its execution until one of these two
    conditions are met:


    +   - thread2 has finished its execution

    - 1,000 milliseconds has passed


    When one of these two conditions is true, the join() method returns. You can check
    the status of the thread to know whether the join() method was returned because
    it finished its execution or because the specified time had passed.


    The second version of the join() method is similar to the first one, but it receives
    the number of milliseconds and nanoseconds as parameters.


    # Creating and running a daemon thread


    Java has a special kind of thread called daemon thread. When daemon threads are
    the only threads running in a program, the JVM ends the program after finishing
    these threads.


    With these characteristics, daemon threads are normally used as service providers
    for normal (also called user) running in the same program. They usually have an
    infinite loop that waits for the service request or performs the tasks of a thread.
    A typical example of these kinds of threads is the Java garbage collector.


