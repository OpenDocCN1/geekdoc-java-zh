  md: '# Processing uncontrolled exceptions in a ForkJoinPool


    The fork/join framework gives you the possibility to set a handler for the exceptions
    thrown by the worker threads of a ForkJoinPool class. When you work with a ForkJoinPool
    class, you should understand the difference between tasks and worker threads.


    To work with the fork/join framework, you implement a task extending the ForkJoinTask
    class or, usually, the RecursiveAction or RecursiveTask classes. The task implements
    the actions you want to execute concurrently with the tasks. They are executed
    in the ForkJoinPool class by the worker threads. A worker thread will execute
    various tasks in the work-stealing algorithm implemented by the ForkJoinPool class,
    a worker thread looks for a new task when the task it was finishes its execution
    or it is waiting for the completion of another task.


    In this recipe, you will learn how to process the exceptions by a worker thread.
    You''ll have to implement two additional elements for it to work as described
    in the following items:


    +   - The first element is an extended class of the ForkJoinWorkerThread class.
    This class implements the worker thread of a ForkJoinPool class. You will implement
    a basic child class that will throw an exception.

    - The second element is a factory to create worker threads of your own custom
    type. The ForkJoinPool class uses a factory to create its worker threads. You
    will have to implement a class that implements the ForkJoinWorkerThread interface
    and uses an object of that class in the constructor of the ForkJoinPool class.
    The ForkJoinPool object created will use that factory to create worker threads.


