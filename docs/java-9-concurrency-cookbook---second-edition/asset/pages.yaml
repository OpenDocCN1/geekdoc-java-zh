  md: "# Parallel and Reactive Streams\n\nThrough the recipes of this chapter, you\
    \ will learn how to effectively use streams in your application, but before that\
    \ let's see the most important characteristics of streams:\n\n+   - A stream is\
    \ a sequence of data, not a data structure. Elements of data are processed by\
    \ the stream but not stored in it.\n- You can create streams from different sources,\
    \ such as collections (lists, arrays and so on), files, strings, or by creating\
    \ a class that provides the elements of the stream.\n- You can't access an individual\
    \ element of the streams. You define the source of the stream and the operations\
    \ you want to apply to it elements. Stream operations are defined in a functional\
    \ way, and you can use lambda expressions in intermediate and terminal operations\
    \ to define the actions you want to execute.\n- You can't modify the source of\
    \ the stream. If, for example, you filter elements of the stream, you are skipping\
    \ the elements on the stream and not in its source.\n- Streams define two kinds\
    \ of operations:\n    - Intermediate operations: These operations always produce\
    \ a new stream with their results. They can be used to transform, filter, and\
    \ sort the elements of the stream.\n    - Terminal operations: These operations\
    \ process all the elements of the stream to generate a result or a side-effect.\
    \ After their execution, the stream can't be used again.\n\n+   - A stream pipeline\
    \ is formed by zero or more intermediate operations and a final operation.\n-\
    \ Intermediate operations can be as follows:\n    - Stateless: Processing an element\
    \ of the stream is independent of the other elements. For example, filtering an\
    \ element based on a condition.\n    - Stateful: Processing an element of the\
    \ stream depends on the other elements of the stream. For example, sorting the\
    \ elements of the stream."
