    # Synchronizing tasks in a common point


    The Java concurrency API provides a synchronizing utility that allows the synchronization
    of two or more threads at a determined point. It''s the CyclicBarrier class. This
    class is similar to the CountDownLatch class explained in the Waiting for multiple
    concurrent events recipe in this chapter, but it presents some differences that
    make it a more powerful class.'
