  md: '# See also


    Now that you have created a stream, you have to process its elements. All the
    recipes in this chapter give you information about how to go about processing
    the elements of a stream.


    # Reducing the elements of a stream


    MapReduce is a programming model used to process very large datasets in distributed
    environments using a lot of machines working in a cluster. This programming model
    has the following two operations:


    +   * **Map**: This operation filters and transforms the original elements into
    a form more suitable to the reduction operation

    * **Reduce**: This operation generates a summary result from all the elements,
    for example, the sum or the average of numerical values


    This programming model has been commonly used in the functional programming world.
    In the Java ecosystem, the Hadoop project of the Apache Software Foundation provides
    an implementation of this model. The Stream class implements two different reduce
    operations:


    +   * The pure reduce operation, implemented in the different versions of the
    `reduce()` method that processes a stream of elements to obtain a value

    * The mutable reduction implemented in the different versions of the `collect()`
    method that processes a stream of elements to generate a mutable data structure,
    such as `Collection` or a `StringBuilder`.


    In this recipe, you will learn how to use the `reduce()` method to generate a
    result from a stream of values. As you may have already imagined, the `reduce()`
    method is a terminal operation in a `Stream`.


    # Getting ready


    The example of this recipe has been implemented using the Eclipse IDE. If you
    use Eclipse or other IDE such as NetBeans, open it and create a new Java project.'
