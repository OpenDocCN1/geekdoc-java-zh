    # Configuring Eclipse for debugging concurrency code


    Nowadays, almost every programmer, regardless of the programming language in use,
    create their applications with an IDE. They provide lots of interesting functionalities
    integrated in the same application, such as:


    +   * Project management

    * Automatic code generation

    * Automatic documentation generation

    * Integration with control version systems

    * A debugger to test applications

    * Different wizards to create projects and elements of the applications


    One of the most helpful features of an IDE is a debugger. Using it, you can execute
    your application step by step and analyze the values of all the objects and variables
    of your program.


    If you work with Java, Eclipse is one of the most popular IDEs. It has an integrated
    debugger that allows you to test your applications. By default, when you debug
    a concurrent application and the debugger finds a breakpoint, it only stops the
    thread that has the breakpoint while it allows the rest of the threads to continue
    with their execution. In this recipe, you will learn how to change this configuration
    to help you test concurrent applications.


    # Getting ready


    You must have installed the Eclipse IDE. Open it and select a project with a concurrent
    application implemented, for example, one of the recipes implemented in the book.'
