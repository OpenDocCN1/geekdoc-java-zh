  md: '# Synchronizing a block of code with a lock


    Java provides another mechanism for synchronizing blocks of code. It''s a more
    powerful and flexible mechanism than the synchronized keyword. It''s based on
    the Lock (of the java.util.concurrent.locks package) interface and classes that
    implement it (as ReentrantLock). This mechanism presents some advantages, which
    are as follows:


    +   - It allows you to structure synchronized blocks in a more flexible way. With
    the synchronized keyword, you only have control over a synchronized block of code
    in a structured way. However, the Lock interface allows you to get more complex
    structures to implement your critical section.

    - The Lock interface provides additional functionalities over the synchronized
    keyword. One of the new functionalities is implemented by the tryLock() method.
    This method tries to get control of the lock, and if it can''t, because it''s
    used by another thread, it returns false. With the synchronized keyword, if thread
    (A) tries to execute a synchronized block of code when thread (B) finishes the
    execution of the synchronized block. With lock, you can execute the tryLock()
    method. This method returns a Boolean value indicating whether there is another
    thread running protected by this lock.

    - The ReadWriteLock interface allows a separation of read and write operations
    with multiple readers and one modifier.

    - The Lock interface offers better performance than the synchronized keyword.


    The ReentrantLock class admits a boolean parameter fair; this allows you to control
    its thread. The value false is the default value and it''s called the non-fair
    mode. In this mode, if some threads are waiting for a lock and the lock has to
    select one of these to get access to the critical section, it randomly selects
    any of them. The true value is called the fair mode. In this mode, if some threads
    are waiting for a lock and the lock has to select one to get access to a critical
    section, it selects the thread that has been waiting for the longest period of
    time. Take into account that the behavior previously is only used in the lock()
    and unlock() methods. As the tryLock() method doesn''t put the thread to sleep
    if the Lock interface is used, the fair attribute doesn''t affect its functionality.


    In this recipe, you will learn how to use locks to synchronize a block of code
    and create a critical section using the Lock interface and the ReentrantLock class
    that implements it, implementing a program that simulates a print queue. You will
    also learn how the fair parameter affects the behavior of Lock.'
