  md: '# Thread Synchronization Utilities


    The CyclicBarrier class is initialized with an integer number, which is the number
    of threads that will be synchronized at a determined point. When one of these
    threads arrives at the determined point, it calls the await() method to wait for
    the other threads. When the thread calls this method, the CyclicBarrier class
    blocks the thread that is sleeping until the other threads arrive. When the last
    thread calls the await() method of the CyclicBarrier object, it wakes up all threads
    that were waiting and continues with its job.


    One interesting advantage of the CyclicBarrier class is that you can pass an additional
    Runnable object as an initialization parameter, and the CyclicBarrier class executes
    this object as all the threads arrive at the common point. This characteristic
    makes this class adequate for parallelization of tasks using the divide and conquer
    programming technique.


    In this recipe, you will learn how to use the CyclicBarrier class to synchronize
    a set of threads at a determined point. You will also use a Runnable object that
    will be executed after all the threads arrive at this point. In the example, you
    will look for a number in a matrix of numbers. The matrix will be divided into
    subsets (using the divide and conquer technique), so each thread will look for
    the number in one subset. Once all the threads have finished their respective
    jobs, a final task will unify their results.


    # Getting ready


    The example of this recipe has been implemented using Eclipse IDE. If you use
    Eclipse or a different IDE, such as NetBeans, open it and create a new Java project.


