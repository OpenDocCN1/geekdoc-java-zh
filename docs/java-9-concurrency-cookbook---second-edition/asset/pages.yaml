  md: '# Thread Management


    A Java program ends when all its threads finish (more specifically, when all its
    non-daemon threads finish). The initial thread (the one that executes the main()
    method) ends, the rest of the threads will continue with their execution until
    they finish. If one of the threads uses the System.exit() instruction to end the
    execution of the program, all the threads will end their respective execution.


    Creating an object of the Thread class doesn''t create a new execution thread.
    Also, calling the run() method of a class that implements the Runnable interface
    doesn''t create a new execution thread. Only when you call the start() method,
    a new execution thread is created.


    # There''s more...


    As mentioned in the introduction of this recipe, there is another way of creating
    a new execution thread. You can implement a class that extends the Thread class
    and overrides the run() method of this class. Then, you can create an object of
    this class and call the start() method to have a new execution thread.


    You can use the static method currentThread() of the Thread class to access the
    thread object that is running the current object.


    You have to take into account that the setPriority() method can throw an IllegalArgumentException
    if you try to establish priority that isn''t between 1 and 10.


    # See also


    +   - The Creating threads through a factory recipe of this chapter


    [ 15 ]'
