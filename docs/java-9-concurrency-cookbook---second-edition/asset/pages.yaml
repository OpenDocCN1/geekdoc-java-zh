- img_proc: true
  md: '# About the Reviewer


    Piotr Bzdyl is focused on Java concurrency topics, including other JVM languages
    and their libraries, aimed at helping in creating highly concurrent applications
    (async IO, non-blocking APIs, Scala, Akka, and Clojure). He has been helping teams
    with JVM tuning and troubleshooting.


    He has also created a training course for Java concurrency topics, covering core
    JDK multithreading concepts as well as those from external libraries and languages
    (actors, STM, parallel collections, and functional languages).


    You can connect with Piotr on LinkedIn at https://www.linkedin.com/in/piotrbzdyl
    and on GitHub at https://github.com/pbzdyl. You can follow him on Stack Overflow
    at http://stackoverflow.com/cv/piotrekbzdyl.'
