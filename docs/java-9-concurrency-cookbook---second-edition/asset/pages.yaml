  md: '# Parallel and Reactive Streams


    +   - anyMatch(): This method is a terminal operation that receives as parameter
    an implementation of the Predicate interface expressed as a lambda expression
    or as an object that implements it and returns a Boolean value. It returns true
    if the Predicate introduced is true for at least one of the elements of the Stream
    and false otherwise.


    +   - noneMatch(): This method is a terminal operation that receives as parameter
    a Predicate expressed as a lambda expression or as an implementation of interface
    and returns a Boolean value. It returns true if false for all the elements of
    the Stream and false otherwise.


    We also used two methods to obtain the elements of Stream:


    +   - findAny(): This method is a terminal operation that doesn''t receive parameters
    and returns an Optional object parameterized with the class of the elements of
    Stream with some element of Stream. There''s no guarantee about the element returned
    by this method. If Stream has no elements, the Optional object will be empty.


    +   - findFirst(): This method is a terminal operation that doesn''t receive parameters
    and returns an Optional parameterized with the class of the elements of Stream.
    It returns the first element of the Stream if the stream has a determined encounter
    order or any element if the stream has no elements, the Optional returned will
    be empty.


    # There''s more...


    In this we used an interface and a class provided by the Java API. The Predicate
    interface is a functional interface that is usually expressed as a lambda expression.
    This expression will receive an element of Stream and return a Boolean value.
    If you want to implement a class that implements this interface, you only have
    to implement the test() method that receives an object of the parameterized type
    and returns a Boolean value. The interface defines more methods, but they have
    a default implementation.


    The Optional class is used when a terminal operation of Stream may or may not
    return a value. In this way, java guarantees that the operation will always return
    a value, the Optional object, that may have a value we obtain using the get()
    method or may be an empty object, the condition we can check with the isPresent()
    method. If you use the get() method with an empty Optional object, a NoSuchElementException
    will be thrown.'
