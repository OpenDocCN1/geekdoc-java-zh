  md: '# There''s more...


    The stream class also has two other methods that can be used to filter the elements
    of a stream:


    +   * dropWhile(): This method receives a Predicate expression as the parameter.
    It has a different behavior with ordered and unordered streams. With ordered streams,
    the method deletes the first elements that match the predicate from the stream.
    It deletes elements when the elements match the predicate. When it finds an element
    that doesn''t match the predicate, it stops deleting elements and returns the
    rest of the stream. With unordered streams, its behavior is not deterministic.
    It deletes a subset of elements that match the predicate but not specified what
    subset of elements it will delete. As with the other methods, it may have a bad
    performance with parallel ordered streams.

    * takeWhile(): This method is equivalent to the previous one, but it takes the
    elements instead of deleting them.


