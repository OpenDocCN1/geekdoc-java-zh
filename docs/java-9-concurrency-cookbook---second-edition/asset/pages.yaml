  md: '# Basic Thread Synchronization


    As mentioned previously, the ReentrantReadWriteLock class has two locks: one for
    read operations and one for write operations. The lock used in read operations
    is obtained with the readLock() method declared in the ReadWriteLock interface.
    This lock is an object that implements the Lock interface, so we can use the lock(),
    unlock(), and tryLock() methods. The lock used in write operations is obtained
    with the writeLock() method declared in the ReadWriteLock interface. This lock
    is also an object that implements the Lock interface, so we can use the lock(),
    unlock(), and tryLock() methods. It is the responsibility of the programmer to
    ensure correct use of these locks, using them for the same purposes for which
    they were designed. When you get the read lock of a Lock interface, you cannot
    modify the value of the variable. Otherwise, you probably will have data errors
    related to inconsistency.


    # See also


    +   - The Synchronizing a block of code with a lock recipe in this chapter

    - The Monitoring a Lock interface recipe in Chapter 9, Testing Concurrent Applications


    # Using multiple conditions in a lock


    A lock may be associated with one or more conditions. The purpose of these conditions
    is to allow threads to have control of a lock and check whether a condition is
    true or not. If it''s false, the thread will be suspended until another thread
    wakes up. The Condition interface provides the mechanisms to suspend a thread
    and wake up a suspended thread.


    A classic problem in concurrent programming is the producer-consumer problem.
    We data buffer, one or more producers of data that save it in the buffer, and
    one or more consumers of data that take it from the buffer, as explained earlier
    in this chapter.


    In this recipe, you will learn how to implement the producer-consumer problem
    using locks and conditions.'
