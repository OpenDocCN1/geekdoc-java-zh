  md: "# Parallel and Reactive Streams\n\nThe reactive streams in Java are based on\
    \ three interfaces:\n\n+   - Flow.Publisher: This interface has only one method:\n\
    \  - subscribe(): This method receives a Subscriber object as parameter. The publisher\
    \ should take this subscriber into account when it publishes an Item.\n- Flow.Subscriber:\
    \ This interface has four methods:\n  - onComplete(): This method will be called\
    \ when the Publisher has finished its execution\n  - onError(): This method will\
    \ be called when there is an error that must be notified to the subscribers\n\
    \  - onNext(): This method will be called when the Publisher has a new element\n\
    \  - onSubscribe(): This method will be called when the publisher has added the\
    \ subscriber with the subscribe() method\n- Flow.Subscription: This interface\
    \ has one method:\n  - request(): This method is used by the Subscriber to request\
    \ an element from the publisher\n\nTake into account that these are only interfaces\
    \ and you can implement them and use them as you want. The proposed flow is as\
    \ follows:\n\n+   1. Someone calls the subscribe() method of a Publisher, sending\
    \ it a Subscriber.\n2. The Publisher creates a Subscription object and sends it\
    \ to the onSubscribe() method of the Subscriber.\n3. The Subscriber uses the request()\
    \ method of the Subscription to request elements to the Publisher.\n4. When the\
    \ publisher has an element to publish, it sends them to all Subscribers that have\
    \ requested elements, calling their onNext() method.\n5. When the publisher ends\
    \ its execution, it calls the onComplete() method of the subscribers.\n\nJava\
    \ API provides the SubmissionPublisher class that implements the Publisher interface\
    \ and implements this behavior."
