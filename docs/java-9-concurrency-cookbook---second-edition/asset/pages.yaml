    To write the number of elements of the buffer, you have the size() method. You
    have to take into account its return value is not real, if you use them when there
    are threads adding or deleting data in the list. The method has to traverse the
    entire list to count the elements and contents of the list can change for this
    operation. Only if you use them when there aren''t any threads modifying the list,
    you will have the guarantee that the returned value is correct.


    # There''s more...


    The LinkedTransferqueue class provides other useful methods. The following are
    some of them:


    +   - getWaitingConsumerCount(): This method returns the number of consumers that
    are blocked in the take() method or poll (long timeout, TimeUnit unit) because
    the LinkedTransferQueue object is empty.

    - hasWaitingConsumer(): This method returns true if the LinkedTransferQueue object
    has consumers waiting, or false otherwise.

    - offer (E e): This method adds the element passed as a parameter at the end of
    the LinkedTransferQueue object and returns the true value. E represents the class
    used to parameterize the declaration of the LinkedTransferQueue class as a subclass
    of it.'
