  md: '# 7 Concurrent Collections


    In this chapter, we will cover the following topics:


    +   * Using non-blocking thread-safe deques

    * Using blocking thread-safe deques

    * Using blocking thread-safe queue ordered by priority

    * Using thread-safe lists with delayed elements

    * Using thread-safe navigable maps

    * Using thread-safe HashMaps

    * Using atomic variables

    * Using atomic arrays

    * Using the volatile keyword

    * Using variable handles


    # Introduction


    **Data structure** is a basic element of programming. Almost every program uses
    one or more types of data structure to store and manage data. The Java API provides
    the **Collections framework**. It contains interfaces, classes, and algorithms
    that implement a lot of different data structures that you can use in your programs.


    When you need to work with data collections in a concurrent program, you must
    be careful with the implementation you choose. Most collection classes do not
    work with concurrent applications because they cannot control concurrent access
    to their data. If a concurrent task shares a data structure that is unable to
    work with another concurrent task, you might have data inconsistency errors that
    will affect the operation of the program. One example of this kind of data structure
    is the `ArrayList` class.'
  merge: -1
