    # How it works...


    In this recipe, we implemented our custom executor by extending the ThreadExecutor
    class and overriding four of its methods. The `beforeExecute()` and `afterExecute()`
    methods were used to calculate the execution time of a task. The `beforeExecute()`
    method is executed before the execution of a task; in this case, we used HashMap
    to start the start date of the task in it. The `afterExecute()` method is executed
    after the execution of the task. You got `startTime` of the task that had finished
    after HashMap and then calculate the difference between the actual date and the
    `startTime` of the execution time of the task. You also override the `shutdown()`
    and `shutdownNow()` methods to write statistics about the tasks executed in the
    executor. These tasks included:


    +   - The executed tasks, using the `getCompletedCount()` method

    - The tasks that were running at the current time, using the `getActiveCount()`
    method

    - The pending tasks, using the `size()` method of the blocking queue where the
    executor stores the pending tasks


    The `SleepTwoSecondsTask` class implements the `Callable` interface puts its execution
    thread to sleep for 2 seconds and the `Main` class, where we use 10 tasks to your
    executor, uses it and the other classes to demo its features.


    Execute the program and you will see how the program shows the span of each task
    that is running and the statistics of the executor upon calling the `shutdown()`
    method.


    # See also


    +   - The `Creating a thread executor and controlling its rejected tasks` recipe
    in `Chapter 4, Thread Executors`

    - The `Using our ThreadFactory` in an `Executor object` recipe in this chapter'
