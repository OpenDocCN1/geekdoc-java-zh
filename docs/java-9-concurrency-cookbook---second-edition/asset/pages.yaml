  md: '# Thread Synchronization Utilities


    +   - awaitAdvance(int phase): This method puts the current thread to sleep until
    all the participants of the phaser have finished the current phase, is, if the
    number as the parameter is equal to the actual phase of phaser. If the parameter
    and the actual phase of phaser aren''t equal, the method ends its execution.

    - awaitAdvanceInterruptibly(int phaser): This method is equal to the method explained
    earlier, but it throws an InterruptedException exception if the thread is sleeping
    in this method is interrupted.


    # Registering participants in Phaser


    When you create a Phaser object, you indicate how many participants will have
    that phaser. The Phaser class has two methods to increment the number of participants
    of phaser. These methods are as follows:


    +   - register(): This method adds a new participant to Phaser. This participant
    will be considered unarrived to the actual phase.

    - bulkRegister(int Parties): This method adds the specified number of participants
    to phaser. These new participants will be considered unarrived to the actual phase.


    The only method provided by the Phaser class to decrement the number of participants
    is the arriveAndDeregister() method that notifies phaser that the thread has finished
    the actual phase and it doesn''t want to continue with the phase operation.


    # Forcing the termination of Phaser


    When phaser has zero participants, it enters a state denoted by termination. The
    Phaser class provides forceTermination() to change the status of phaser and makes
    it enter the termination state independently of the participants registered in
    phaser. This mechanism may be useful when one of the participants has an error
    status, where the best thing to do would be to terminate phaser.


    When phaser is in the termination state, the awaitAdvance() and arriveAndAwaitAdvance()
    methods immediately return a negative number, instead of a positive one that is
    returned normally. If you know that your phaser could be terminated, you should
    verify the return value of those methods (awaitAdvance() and arriveAndAwaitAdvance())
    to know whether phaser has been terminated.'
