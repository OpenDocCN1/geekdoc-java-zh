    It shows the first two phases of the execution. You can see how the Apps finishes
    its execution in phase two because its results list is empty. When you execute
    the example, you will see how some threads finish a phase before the rest and
    how they wait until all finished one phase continuing with the rest.


    # There''s more...


    The Phaser class provides other methods related to the change of phase. These
    methods are as follows:


    +   * arrive(): This method notifies the Phaser class that one participant has
    finished the actual phase but it should not wait for the rest of the participants
    to continue with their execution. Be careful with the utilization of this method
    because other threads.'
