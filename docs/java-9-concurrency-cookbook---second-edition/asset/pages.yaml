    \ in this chapter\n\n# ## Advanced locking with the StampedLock class\n\nThe StampedLock\
    \ class provides a special kind of lock that is different from the ones provided\
    \ by the Lock or ReadWriteLock interfaces. In fact, this class doesn't implement\
    \ these interfaces, but the functionality it provides is very similar.\n\nThe\
    \ first point to note about this kind of lock is that its main purpose is to be\
    \ a helper class to implement thread-safe components, so its use will not be very\
    \ common in normal applications.\n\nThe most important features of StampedLock\
    \ locks are as follows:\n\n+   - You can obtain control of the lock in three different\
    \ modes:\n    - **Write**: In this mode, you get exclusive access to the lock.\
    \ No other thread can have control of the lock in this mode.\n    - **Read**:\
    \ In this mode, you have non-exclusive access to the lock. There can be other\
    \ threads that have access to the lock in this mode or the Optimistic Read mode.\n\
    \    - **Optimistic Read**: Here, the thread doesn't have control over the block.\
    \ Other threads can get control of the lock in write mode. When you get a lock\
    \ in the Optimistic Read mode and you will want to check the shared data protected\
    \ by it, you will have to check whether you can access them or not using the `validate()`\
    \ method.\n\n+   - The StampedLock class provides methods to:\n    - Acquire control\
    \ over the lock in one of the previous modes. If the methods `readLock()`, `writeLock()`,\
    \ `readLockInterruptibly()` are unable to get control of the lock, the current\
    \ thread is suspended until it gets the lock.\n\n[ 87 ]"
