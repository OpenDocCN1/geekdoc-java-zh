  md: '# 2 Basic Thread Synchronization


    In this chapter, we will cover the following topics:


    +   * Synchronizing a method

    * Using conditions in synchronized code

    * Synchronizing a block of code with a lock

    * Synchronizing data access with read/write locks

    * Using multiple conditions in a lock

    * Advanced locking with the StampedLock class


    # Introduction


    One of the most common situations in concurrent programming occurs when more than
    one execution thread shares a resource. In a concurrent application, it is normal
    for multiple threads to read or write the same data structure or have access to
    the same file or database connection. These shared resources can provoke error
    situations or data inconsistency, and we have to implement mechanisms to avoid
    these errors. These situations are called race conditions and they occur when
    different threads have access to the same shared resource at the same time. The
    final result depends on the order of execution of threads, and most of the time,
    it is incorrect. You can also have problems with change visibility. So if a thread
    changes the value of a shared variable, the changes would only be written in the
    local cache of that thread; other threads will not have access to the change (they
    will only be able to see the old value).


    The solution for these problems lies in the concept of critical section. A critical
    section is a block of code that accesses a shared resource and can''t be executed
    by more than one thread at the same time.'
  merge: -1
  pgno: 73
- img_proc: true
  md: '# Basic Thread Synchronization


    To help programmers implement critical sections, Java (and almost all programming
    languages) offers synchronization mechanisms. When a thread wants a critical section,
    it uses one of these synchronization mechanisms to find out whether there is any
    other thread executing the critical section. If not, the thread enters the critical
    section. If yes, the thread is suspended by the synchronization mechanism until
    the thread that is currently executing the critical section ends. When more than
    one thread is waiting for a thread to finish the execution of a critical section,
    JVM chooses one of them and the rest wait for their turn. This chapter presents
    a number of recipes that will teach you how to use the two basic synchronization
    mechanisms offered by the Java language:


    +   - The synchronized keyword

    - The Lock interface and its implementations


    # Synchronizing a method


    In this recipe, you will learn how to use one of the most basic methods of synchronization
    in Java, that is, the use of the synchronized keyword to control concurrent access
    to a method or a block of code. All the synchronized sentences (used on methods
    or blocks of code) use an object reference. Only one thread can execute a method
    or block of code protected by the same object reference.


    When you use the synchronized keyword with a method, the object reference is implicit.
    When you use the synchronized keyword in one or more methods of an object, only
    one execution thread will have access to all these methods. If another thread
    tries to access any method declared with the synchronized keyword of the same
    object, it will be suspended until the first thread finishes the execution of
    the method. In other words, every method declared with the synchronized keyword
    is a critical section, and Java only allows the execution of one of the critical
    sections of an object at a time. In this case, the object reference used is the
    own object, represented by this keyword. Static methods have a different behavior.
    Only one execution thread will have access to one of the static methods declared
    with the synchronized keyword, but a different thread can access other static
    methods of an object class. Two threads can access two different synchronized
    methods if one is static and the other is not. If both methods change the same
    data, you can have data inconsistency errors. In this case, the object reference
    used is the class object.


    [ 51 ]'
