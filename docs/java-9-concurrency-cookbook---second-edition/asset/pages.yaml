    that can be executed on a ScheduledThreadPoolExecutor executor. This class extends
    the Future class and implements the RunnableScheduledFuture interface. It implements
    the RunnableScheduledFuture interface because all the tasks executed in a scheduled
    executor must implement this interface and extend the FutureTask class. This is
