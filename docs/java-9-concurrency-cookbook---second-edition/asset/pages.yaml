    # There''s more...


    The ForkJoinTask class provides another method to finish the execution of a task
    and return a result, that is, the complete() method. This method accepts an object
    of the type used in the parameterization of the RecursiveTask class and returns
    that object as a result of the task when the join() method is called. It is recommended
    to provide results for asynchronous tasks.


    Since the RecursiveTask class implements the Future interface, there''s another
    version of the get() method:


    +   - (long timeout, TimeUnit unit): This version of the get() method, if the
    result of the task isn''t available, waits the specified for it. If the specified
    period of time passes and the result isn''t yielded, the method returns a null
    value. The TimeUnit class is an enumeration with these constants: DAYS, HOURS,
    MICROSECONDS, MILLISECONDS, MINUTES, NANOSECONDS, and SECONDS.'
