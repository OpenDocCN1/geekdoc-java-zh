- img_proc: true
  md: '# Thread Synchronization Utilities


    Chapter 2, Basic Thread Synchronization, taught you about the following basic
    synchronization mechanisms:


    +   - The synchronized keyword

    - The Lock interface and its implementation classes: ReentrantLock, ReentrantReadWriteLock.ReadLock,
    and ReentrantReadWriteLock.WriteLock

    - The StampedLock class


    In this chapter, you will learn how to use high-level mechanisms to synchronize
    multiple threads. These high-level mechanisms are as follows:


    +   - Semaphores: A semaphore is a counter that controls access to one or more
    shared resources. This mechanism is one of the basic tools of concurrent programming
    and is provided by most programming languages.

    - CountDownLatch: The CountDownLatch class is another mechanism provided by the
    Java language that allows a thread to wait for the synchronization of multiple
    operations.

    - CyclicBarrier: The CyclicBarrier class is another mechanism provided by the
    Java language that allows the synchronization of multiple threads at a common
    point.

    - Phaser: The Phaser is another mechanism provided by the Java language that controls
    the execution of concurrent tasks in phases. All the threads must finish one phase
    before they can continue with the next one.

    - Exchanger: The Exchanger class is another mechanism provided by the Java language
    that provides a point of data interchange between two threads.

    - CompletableFuture: The CompletableFuture class provides a mechanism where one
    or more tasks can wait for the finalization of another task that will be explicitly
    completed in an asynchronous way in future. This class was introduced in Java
    8 and has introduced new methods in Java 9.


    Semaphores are generic synchronization mechanisms that you can use to protect
    any critical section in any problem. Other mechanisms are thought to be used in
    applications with specific features, as described previously. Be sure to select
    the appropriate mechanism according to the characteristics of your application.


    This chapter presents several recipes that will show you how to use the mechanisms
    described.'
