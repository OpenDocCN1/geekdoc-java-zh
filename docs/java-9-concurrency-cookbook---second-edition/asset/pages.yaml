  md: '# 4

    Thread Executors


    In this chapter, we will cover the following topics:


    +   * Creating a thread executor and controlling its rejected tasks

    * Executing tasks in an executor that returns a result

    * Running multiple tasks and processing the first result

    * Running multiple tasks and processing all the tasks

    * Running a task in an executor after a delay

    * Running a task in an executor periodically

    * Canceling a task in an executor

    * Controlling a task finishing in an executor

    * Separating the launching of tasks and the processing of their results in an
    executor


    # Introduction


    Usually, you develop a simple, concurrent programming application in Java, first
    you create Runnable objects and then the corresponding Thread objects to execute
    them. If you have to develop a program that runs a lot of concurrent tasks, this
    approach will present the following disadvantages:


    +   * You will have to implement all of the code-related information to manage
    Thread objects (creating, ending, and obtaining results).

    * You will have to create a Thread object per task. Executing a huge number of
    tasks can affect the throughput of the application.

    * You will have to control and manage the resources of the computer efficiently.
    If you create too many threads, you could saturate the system.'
  merge: -1
  pgno: 174
- img_proc: true
  md: 'Since Java 5, the Java concurrency API provides a mechanism that aims to resolve
    these problems. This mechanism is called the Executor framework and is around
    the Executor interface, its subinterface ExecutorService, and the ThreadPoolExecutor
    class that implements these interfaces.


    This mechanism separates task creation and execution. With an executor, you only
    have to implement Runnable or Callable objects and send them to the executor.
    It is responsible for their execution, running them with the necessary threads.
    It goes beyond it; improves performance using a pool of threads. When you send
    a task to the executor, it tries to use a pooled thread for the execution of the
    task. It does so to avoid the continuous spawning of threads. Another important
    advantage of the Executor framework is the Callable interface. It is similar to
    the Runnable interface but offers two improvements, as we are as follows:


    +   - The main method of this interface, named call(), may return a result.

    - When you send a Callable object to an executor, you get an object that implements
    the Future interface. You can use this to control the status and the result of
    the Callable object.


    This chapter presents recipes that show you how to work with the Executor framework
    using the classes mentioned earlier and other variants provided by the Java Concurrency
    API.


    # Creating a thread executor and controlling its rejected tasks


    The first step toward working with the Executor framework is to create an object
    of the ThreadPoolExecutor class. You can use the four constructors provided by
    this class or a factory class method Executors, which creates ThreadPoolExecutor.
    Once you have an executor, you can send Runnable or Callable objects to be executed.


    When you want to finish the execution of an executor, use the shutdown() method.
    The executor waits for the completion of tasks that are either running or waiting
    for their execution. Then, it finishes the execution.


    If you send a task to an executor between the shutdown() method and the end of
    its execution, the task will be rejected. This is because the executor no longer
    accepts new tasks. The ThreadPoolExecutor class provides a mechanism, which is
    called when a task is rejected.'
