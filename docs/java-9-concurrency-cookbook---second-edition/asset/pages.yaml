    +   - getQueueLength(): This method returns the number of threads that are waiting
    for a resource protected by a semaphore.


    +   - isFair(): This method returns a Boolean value indicating if a semaphore
    has the fair mode activated. When the fair mode is active (this method returns
    the true value), the lock has to select another thread to give to it the access
    to the shared resource, it selects the longest-waiting thread. If the fair mode
    is inactive (this method returns the false value), there is no guarantee about
    the order in which threads are selected to get the access to the shared resource.


