  md: '# There''s more...


    The Thread class has another method to check whether a thread has been interrupted
    or not. It''s the static method, interrupted(), that checks whether the current
    thread has been interrupted or not.


    There is an important difference between the isInterrupted() and interrupted methods.
    The first doesn''t change the value of the interrupted attribute, but the second
    sets it to false.


    As mentioned earlier, a thread object can ignore its interruption, but this is
    not the expected behavior.


    # Controlling the interruption of a thread


    In the previous recipe, you learned how you can interrupt the execution of a thread
    and what you have to do to control this interruption in the thread object. The
    mechanism shown in the previous example can be used if the thread that can be
    interrupted is simple. But if the thread implements a complex algorithm divided
    into some methods or it has methods with recursive calls, you will need to use
    a better mechanism to control the interruption of the thread. Java provides the
    InterruptedException exception for this purpose. You can throw this exception
    when you detect the interruption of a thread and catch it in the run() method.


    In this recipe, we will implement a task that will look for files with a determined
    name in a folder and in all its subfolders. This is to show how you can use the
    InterruptedException exception to control the interruption of a thread.


    # Getting ready


    The example for this recipe has been implemented using the Eclipse IDE. If you
    use Eclipse or a different IDE, such as NetBeans, open it and create a new Java
    project.'
