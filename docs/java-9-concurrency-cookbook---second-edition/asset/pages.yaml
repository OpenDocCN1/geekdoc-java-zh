  md: '# Basic Thread Synchronization


    Finally, we also synchronized the getNumberCars() and getNumberMotorcycles() methods.
    Using the synchronized keyword, we can guarantee correct access to shared data
    in concurrent applications.


    As mentioned at the introduction of this recipe, only one thread can access the
    methods of an object that uses the synchronized keyword in its declaration. If
    thread (A) is executing a synchronized method and thread (B) wants to execute
    another synchronized method of the same object, it will be blocked until thread
    (A) is finished. But if thread (B) has access to different objects of the same
    class, none of them will be blocked.


    When we use the synchronized keyword to protect a block of code, you can use an
    object as a parameter. JVM guarantees that only one thread can have access to
    all the blocks of code protected with this object (note that we always talk objects,
    not classes).


    We use the TimeUnit class as well. The TimeUnit class is an enumeration with the
    following constants: DAYS, HOURS, MICROSECONDS, MILLISECONDS, MINUTES, NANOSECONDS,
    and SECONDS. These indicate the units of time we pass to the sleep method. In
    our case, we let the thread sleep for 50 milliseconds.


    # There''s more...


    The synchronized keyword penalizes the performance of the application, so you
    must only use it on methods that modify shared data in a concurrent environment.
    If you have multiple threads calling a synchronized method, only one will execute
    it at a time while the others will remain waiting. If the operation doesn''t use
    the synchronized keyword, all threads can execute the operation at the same time,
    reducing the total execution time. If you know that a method will not be called
    by more than one thread, don''t use the synchronized keyword. Anyway, if the class
    is designed for multithreading, access should always be locked. You must promote
    correctness over performance. Also, you should include documentation in methods
    and classes in relation to thread safety.


    You can use recursive calls with synchronized methods. As the thread has access
    to the synchronized methods of an object, you can call other synchronized methods
    of that object, including the method that is being executed. It won''t have to
    get access to the synchronized methods again.'
