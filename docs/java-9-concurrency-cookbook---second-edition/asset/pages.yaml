  md: 'Let''s analyze the preceding code. If a thread calls the operation1() method
    and

    another thread calls the operation2() method, you can have a deadlock. If both

    operation1() and operation2() execute their respective first sentences at the

    time, you will have the operation1() method waiting to get control of

    lock2 and the operation2() method waiting to get control of lock1. Now you

    have a deadlock situation.


    To solve this situation, you can follow this rule:


    +   * If you have to get control of more than one lock in different operations,
    try to lock them in the same order in all methods.

    * Release, them in inverse order and encapsulate the locks and their unlocks in
    a single class. This is so that you don''t have synchronization-related code distributed
    throughout the code.


    # How it...


    Using this rule, you will avoid deadlock situations. For example, in the case
    presented

    erlier, you can change operation2() to first get lock1 and then lock2. If both

    operation1() and operation2() execute their respective first sentences, one of
    them will

    be blocked waiting for lock1 and the other will get lock1 and lock2 and they will
    do their\operations. After this, the blocked thread will get lock1 and lock2 locks
    and it will do

    it its operation.


    # There''s more...


    You can find a situation where a requirement prevents you from getting the

    same order in all the operations. In this situation, you can use the tryLock()
    method of the

    Lock class. This method returns a Boolean value to indicate whether you have control
    of

    t lock. You can try to get all the locks that you need to do the operation using
    the

    tryLock() method. If you can''t get control of one of the locks, you must release
    all

    locks that you may have had and start the operation again.


    # See also


    +   * The Holding locks for as short time period as possible recipe in this chapter'
