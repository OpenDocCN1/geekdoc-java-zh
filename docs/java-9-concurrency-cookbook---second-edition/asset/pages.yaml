    \ of the counter variable and write a message in the console. Finally, use the\
    \ forEach() method to write all numbers and the value of the counter variable\
    \ in the console.\n\n```\ncounter.set(0);\nrandom.doubles(1000).parallel().peek(number\
    \ -> {\n    long actual-counter.incrementAndGet();\n    System.out.printf(\"Peek:\
    \ %d - %f\\n\", actual, number);\n}).forEach(number -> {\n    System.out.printf(\"\
    For Each: %f\\n\", number);\n});\n\nSystem.out.printf(\"Counter: %d\\n\", counter.get());\n\
    ```\n\n# How it works...\n\nIn this example, we used the peek() method in two\
    \ different situations to count the number of elements that pass by this of the\
    \ stream and write a message in the console.\n\nAs described in Chapter 6, Parallel\
    \ and Reactive Streams, Stream has a source, zero or more intermediate operations,\
    \ and a final operation. In the first case, our final operation is the count()\
    \ method. This method doesn't need to process the elements to calculate the returned\
    \ value, so the peek() method will not be executed. You won't see any of the messages\
    \ of the peek method in the console, and the value of the counter variable will\
    \ be 0.\n\nThe second case is different. The final operation is the forEach()\
    \ method, and in this case, all the elements of the stream will be processed.\
    \ In the console, you will see messages of both peek() and forEach() methods.\
    \ The final value of the counter variable will be 1,000."
