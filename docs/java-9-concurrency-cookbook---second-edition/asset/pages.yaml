  md: "# Basic Thread Synchronization\n\nWe can use the synchronized keyword to protect\
    \ access to a block of code instead of an entire method. We should use the synchronized\
    \ keyword in this way to protect access to shared data, leaving the rest of the\
    \ operations out of this block and obtaining better performance of the application.\
    \ The objective is to have the critical section (the block of code that can be\
    \ accessed only by one thread at a time) as short as possible. Also, avoid calling\
    \ blocking operations (for example, I/O operations) inside a critical section.\
    \ We have used the synchronized keyword to protect access to the instruction that\
    \ updates the number of persons in the building, leaving out the long operations\
    \ of the block that don't use shared data. When you use the synchronized keyword\
    \ in this way, you must pass an object reference as a parameter. Only one thread\
    \ can access the synchronized code (blocks or methods) of that object. Normally,\
    \ we will use the this keyword to reference the object that is executing the method:\n\
    \n```\nsynchronized (this) {\n  // Java code\n}\n```\n\n# See also\n\n+   * The\
    \ Using conditions in synchronized code recipe in this chapter\n\n# Using conditions\
    \ in synchronized code\n\nA classic problem in concurrent programming is the producer-consumer\
    \ problem. We have a data buffer, one or more producers of data save it in the\
    \ buffer, and one or more consumers of data that take it from the buffer.\n\n\
    As the buffer is a shared data structure, we have to control access to it using\
    \ a synchronization mechanism, such as the synchronized keyword, but here we have\
    \ more limitations. A producer can't save data in the buffer if it's full, and\
    \ a consumer can't take data from the buffer if it's empty."
