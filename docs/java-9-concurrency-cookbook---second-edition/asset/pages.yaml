    # Implementing the ThreadFactory interface to generate custom threads for the
    fork/join framework


    One of the most interesting features of Java 9 is the fork/join framework. It''s
    an implementation of the Executor and ExecutorService interfaces that allows you
    to execute the Callable and Runnable tasks without managing the threads that execute
    them.


    This executor is oriented to execute tasks that can be divided into smaller parts.
    Its main components are as follows:


    +   - It''s a special kind of task, which is implemented by the ForkJoinTask class.

    - It provides two operations for dividing a task into subtasks (the fork operation)
    and to wait for the finalization of these subtasks (the join operation).

    - It''s an algorithm, denominating the work-stealing algorithm, which optimizes
    the use of threads of the pool. When a task waits for its subtasks, the thread
    that was executing it proceeds to execute another thread.


    The main class of the fork/join framework is the ForkJoinPool class. Internally,
    it has the following two elements:


    +   - A queue of tasks that are waiting to be executed

    - A pool of threads that execute the tasks'
