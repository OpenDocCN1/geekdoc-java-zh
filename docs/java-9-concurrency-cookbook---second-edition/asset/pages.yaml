    Every program has at least one execution thread. When you run the program, JVM

    runs the execution thread that calls the main() method of the program.


    When we call the start() method of a Thread object, we are creating another execution

    thread. Our program will have as many execution threads as the number of calls
    to make

    t start() method.


    The Thread class has attributes to store all the information of a thread. The
    OS scheduler

    uses the priority of threads to select the one that the CPU at each moment and

    actualizes the status of every thread according to its situation.


    If you don''t specify a name for a thread, JVM automatically assigns it one in
    this format:

    Thread-XX, where XX is a number. You cannot modify the ID or status of a thread.

    Thread class doesn''t implement the setID() and setStatus() methods as these methods

    introduce modifications in the code.'
