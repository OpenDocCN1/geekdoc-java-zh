  md: '# How it works...


    If you execute the example, you will see a big difference between the execution
    time of the two approaches. The task that has all the operations inside the critical
    section takes longer than the other task.


    When you need to implement a block of code protected by a lock, analyze carefully
    to only include necessary instructions. Split the method into various critical
    sections, and use more than one lock if necessary to get the best performance
    of your application.


    # See also


    +   - The Avoiding deadlocks by ordering locks recipe in this chapter


    # Delegating the management of threads to executors


    Before Java 5, the Java Concurrency API, when we wanted to implement a concurrent
    application, we had to manage the threads by ourselves. First we used to implement
    the Runnable interface or an extension of the Thread class. Then, we used to create
    a thread object and start its execution using its start() method. We also had
    to control its status to know whether the thread had finished its execution or
    was still running.


    In Java 5, the concept of executor as a provider of a pool of execution threads
    appeared. This mechanism, implemented by the Executor and ExecutorService interfaces
    and ScheduledThreadPoolExecutor classes, allows you to concentrate on the implementation
    of the logic of the task. You implement the task and send it to the executor.
    It has a pool of threads, and this is this pool that is responsible for the creation,
    management, and finalization of the threads. In Java version 7, another implementation
    of the executor mechanism in the fork/join framework, specialized in problems
    that can be broken into smaller subproblems, appeared. This approach has numerous
    advantages, as follows:


    +   - We don''t have to create threads for all the tasks. When we send a task
    to the executor and it''s executed by a thread of the pool, we save the time used
    in creating a new thread. If our application has to execute a lot of tasks, the
    saved time will be significant and the performance of the application will be
    better.'
