  md: '# Basic Thread Synchronization


    At the end of the critical section, we have to use the lock() method to free the
    control of the lock and allow other threads to run the critical section. If you
    don''t call the lock() method at the end of the critical section, other threads
    that are waiting for the block will wait forever, causing a deadlock. If you use
    try-catch blocks in your critical section, don''t forget to put the sentence containing
    the lock() method inside the finally section.


    The other topic we tested in this example was fair mode. We had two critical sections
    in every job. In the previous screenshot, you saw how all jobs execute the second
    part immediately after the first one. This is the usual case, but there are exceptions.
    This occurs when we have non-fair mode, that is to say, we pass a false value
    to the constructor of the ReentrantLock class.


    On the contrary, when we establish fair mode by passing the true value to the
    constructor of the Lock class, the behavior is different. The first thread that
    requests control of the lock Thread 0, then Thread 1. While Thread 0 is running
    the first block of code protected by the lock, we have nine threads waiting to
    execute the same block of code. When Thread 0 releases the lock, it immediately
    requests the lock again, so we have 10 threads trying to get the lock. As the
    fair mode is, the Interface will choose Thread 1, as it''s the thread that has
    been waiting for more time for the lock. Then, it chooses Thread 2, then Thread
    3, and so on. Until all the threads have passed the first block protected by the
    lock, none of them will execute the second block protected by the lock. Once will
    be the turn of Thread 0 again, then Thread 1, and so on. The following screenshot
    shows the:


    ```

