    # Running tasks asynchronously


    When you execute ForkJoinTask in ForkJoinPool, you can do it in a synchronous
    or an asynchronous way. When you do it in a synchronous way, the method that sends
    the task to the pool doesn''t return until the task finishes its execution. When
    you do it in an asynchronous way, the method that sends the task to the executor
    returns immediately, so the task can continue with its execution.


    You should be aware of a big difference between the two methods. When you use
    the synchronous methods, the task that calls one of these methods (for example,
    the invokeAll() method) is suspended until the task it sent to the pool finish
    its execution. This allows the ForkJoinPool class to use the work-stealing algorithm
    to assign a new task to the worker thread that executed the sleeping task. On
    the contrary, when you use the asynchronous methods (for example, the fork() method),
    the task continues with its execution, so the ForkJoinPool can''t use the work-stealing
    algorithm to increase the performance of the application. In this case, only when
    you call the join() or get() methods to wait for the finalization of a task, the
    ForkJoinPool class can use that


    In addition to the RecursiveAction and RecursiveTask classes, Java8 introduced
    a new ForkJoinTask class with the CountedCompleter class. With this kind of tasks,
    you can include a completion action that will be executed when it is launched
    and there is no pending task. This mechanism is based on a method included in
    the class (the onCompletion() method) and a counter of pending tasks.


    This counter is initialized to zero by default and you can increment it when you
    need in an atomic way. Normally, you will increment this counter by one as and
    when you launch a child task. Finally, when a task has finished its execution
    and consequently execute the onCompletion() method. If the pending count is greater
    than zero, it is decremented by one. If it''s zero, the onCompletion() method
    is executed and then the parent task is tried to be completed.'
