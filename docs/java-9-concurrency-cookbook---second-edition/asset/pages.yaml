- img_proc: true
  md: '# Preface


    When you work with a computer, you can do several things at once. You can listen
    to music while you edit a document in a word processor and read your e-mails.
    This can be done because your operating system allows the concurrency of tasks.
    Concurrent programming is about the elements and mechanisms a platform offers
    to have multiple tasks or programs running at once and communicating with each
    other, to exchange data or to synchronize with each other. Java is a concurrent
    platform, and it offers a lot of classes to execute concurrent tasks inside a
    Java framework. With each version, Java increases the functionalities offered
    to programmers to facilitate the development of concurrent programs. This book
    covers the most important and useful mechanisms included in version 9 of the Java
    concurrency API, so you will be able to use them directly in your applications.
    The mechanisms are as follows:


    +   * Basic thread management

    * Thread synchronization mechanisms

    * Thread creation and management delegation with executors

    * Fork/join framework to enhance the performance of your application

    * Parallel streams to process big sets of data in a parallel way, including the
    Java 9 reactive streams

    * Data structures for concurrent programs

    * Adapting the default behavior of some concurrency classes to your needs

    * Testing Java concurrency applications


    # What this book covers


    Chapter 1, Thread Management, teaches you how to make basic operations with threads.
    The creation, execution, and status management of threads are explained through
    basic examples.


    Chapter 2, Basic Thread Synchronization, covers how to use low-level Java mechanisms
    to synchronize code. Locks and the synchronized keyword are explained in detail.


    Chapter 3, Thread Synchronization Utilities, covers how to use the high-level
    Java utilities to manage the synchronization between threads in Java. It includes
    an explanation of how to use the Phaser class to synchronize tasks divided into
    phases.'
  merge: -1
  pgno: 24
- img_proc: true
  md: '# Preface


    Chapter 4, Thread Executors, explores the delegation of thread management to executors.
    They allow running, managing, and getting the results of concurrent tasks.


    Chapter 5, Fork/Join Framework, covers the use of the Fork/Join framework. It''s
    a special kind of executor oriented to execute tasks that will be divided into
    smaller ones using the divide and conquer technique.


    Chapter 6, Parallel and Reactive Streams, teaches you how to create streams and
    use all its intermediate and terminal operations to process big collections of
    data in a parallel and functional way. Streams were introduced in Java 8. Java
    9 has some new interfaces to implement reactive streams.


    Chapter 7, Concurrent Collections, explains how to use concurrent data structures
    provided by the Java language. These data structures must be used in concurrent
    programs to avoid the use of synchronized blocks of code in their implementation.


    Chapter 8, Customizing Concurrency Classes, teaches you how to adapt some of the
    most useful classes of the Java concurrency API to your needs.


    Chapter 9, Testing Concurrent Applications, covers how to obtain information about
    the status of the most useful structures of the Java 7 concurrency API. You will
    also learn how to use some free tools to debug concurrent applications, such as
    the Eclipse, NetBeans IDE, or FindBugs to detect possible bugs in your applications.


    Chapter 10, Additional Information, explores the notions of synchronization, the
    executor, the Fork/Join framework, concurrent data structures, and the monitoring
    of concurrent objects, which were not included in the respective chapters.


    Chapter 11, Concurrent Programming Design, provides some tips that every programmer
    should consider when they develop a concurrent application.


    # What you need for this book


    To follow this book, you will need some basic knowledge of the Java programming
    language. You should know how to use an IDE, such as Eclipse or NetBeans, but
    this is not a necessary prerequisite.'
