  md: '# How it works...


    As we mentioned in the introduction of this recipe, the collect () method allows
    you to do a mutable reduction of the elements of a Stream. We call it a mutable
    reduction because the final result of the stream will be a mutable data structure,
    such as Map or List. The Stream class of the Java Concurrency API provides two
    versions of the collect () method.


    The first one receives only one parameter that is an implementation of the Collector
    interface. This interface has seven methods, which you normally wouldn''t implement
    your own collectors. Instead of this, you will use the utility class Collectors,
    which has a lot of methods that return ready-to-use Collector objects for your
    reduce operations. In our example, we have used the following methods of the Collectors:


    +   groupingConcurrent(): This method returns a Collector object that implements
    a group by operating with the elements of Stream in a concurrent way, generating
    Map as the resultant data structure. It receives as parameter expression to obtain
    the value of the key used in the map from the element of the stream. It generates
    Map where the keys are by the type returned by the parameter expression and the
    value will be a List of elements of the stream.

    joining(): This method returns Collector that concatenates the elements of the
    stream into String. You can specify three CharSequence objects with a separator
    for the elements, a prefix of the final String, and a suffix of the final String.

    partitioningBy(): This method returns Collector similar to the first one. It receives
    as parameter Boolean expression with the elements of Stream and organizes the
    elements of the stream in two groups: the ones that don''t. The final result will
    be a Map with Boolean key and List of the type of elements of the stream as value.

    toConcurrentMap(): This method returns Collector that generates ConcurrentMap
    in a concurrent way. It receives three parameters:

    - An expression to generate the key from an element of the stream

    - An expression to generate the value from an element of the stream

    - An expression to generate a value from two values when there are two or more
    elements with the same key'
