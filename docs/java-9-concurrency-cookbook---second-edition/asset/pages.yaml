    # There''s more...


    When you use the unordered() method, you''re not executing any code that internally
    changes the order of the elements in the data structure. You''re only deleting
    a condition that would be taken into account for some methods otherwise. It''s
    possible that the results of a stream with the unordered() method and the results
    of the same stream without the method are equal. Its use may have consequences
    in possibly different processing results for parallel streams. For example, if
    you try example using a List of Person objects instead of personSet TreeSet, you
    will always obtain the same result in both the cases.


    As we mentioned before, the main purpose of the unordered() method is to delete
    a constraint that limits the performance of parallel streams.'
