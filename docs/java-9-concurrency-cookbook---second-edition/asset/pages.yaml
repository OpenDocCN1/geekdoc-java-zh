  md: '# Thread Management


    The program starts with four WriterTask threads. Each thread writes an event and
    sleeps for 1 second. After the first 10 seconds, we have 40 events in the queue.
    During these 10 seconds, CleanerTask are executed whereas the four WriterTask
    threads sleep; however, it doesn''t delete any event because all them were generated
    less than 10 seconds ago. During the rest of the execution, CleanerTask deletes
    events every second and the four WriterTask threads write another four; therefore,
    the size of the queue varies around 40 events it has grown up to. Remember that
    the execution of this example depends on the number available cores to the JVM
    of your computer. Normally, this number is equal to the number of cores of your
    CPU.


    You can play with time until the WriterTask threads are sleeping. If you use a
    smaller value, you will see that CleanerTask has CPU time and the size of the
    queue increase because CleanerTask doesn''t delete any event.


    # There''s more...


    You can only call the setDaemon() method before you call the start() method. Once
    the thread is running, you can''t modify its daemon status calling the setDaemon()
    method. If you call it, you will get an IllegalThreadStateException exception.


    You can use the isDaemon() method to check whether a thread is a daemon thread
    (the method returns true) or a non-daemon thread (the method returns false).


    # Processing uncontrolled exceptions in a thread


