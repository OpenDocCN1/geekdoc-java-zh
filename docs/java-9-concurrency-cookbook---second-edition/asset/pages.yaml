  md: '# Concurrent Programming Design


    The more critical deprecated operations are those that are provided by the Thread
    class.

    These operations are:


    +   - destroy(): In the past, this method destroyed thread. Actually, it throws
    a NoSuchMethod exception.

    - suspend(): This method suspends the execution of the thread until it''s resumed.

    - stop(): This method forces the thread to finish its execution.

    - resume(): This method resumes the execution of the thread.


    The ThreadGroup class also has some deprecated methods, which are as follows:


    +   - suspend(): This method suspends the execution of all the threads that belong
    to this thread group until they resume

    - stop(): This method forces the execution of all the threads of this thread group
    to finish

    - resume(): This method resumes the execution of all the threads of this thread
    group


    The stop() operation has been deprecated because it can provoke inconsistent errors.
    As it forces the thread to finish its execution, you can have a thread that finishes
    its execution before the completion of an operation and can leave the data in
    an inconsistent status. For example, if you have a thread that is modifying a
    bank account and it''s stopped before it is finished, the bank account will probably
    have erroneous data.


    The stop() operation can also cause a deadlock situation. If this operation is
    called when the thread is executing a critical section protected by a synchronization
    mechanism (for example, a lock), this synchronization mechanism will continue
    to block and no thread will be able to enter the critical section. This is why
    the suspend() and resume() operations have been deprecated.


    If you need an alternative to these operations, you can use an internal attribute
    to store the status of the thread. This attribute must be protected with synchronized
    access, or use an atomic variable. You must check the value of this attribute
    and take actions according to it. Take into account that you have to avoid data
    inconsistency and deadlock situations to guarantee the correct operation of your
    application.'
