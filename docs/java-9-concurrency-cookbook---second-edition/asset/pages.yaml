  md: '# Thread Executors


    One critical aspect of the ThreadPoolExecutor class, and of executors in general,
    is that you have to end them explicitly. If you do not do this, the executor will
    continue its execution and the program won''t end. If the executor doesn''t have
    tasks to execute, it continues waiting for new tasks and doesn''t end its execution.
    A Java application runs until its non-daemon threads finish their execution. So,
    if you don''t terminate the executor, your application will never end.


    To indicate to the executor that you want to finish, use the shutdown() method
    of the ThreadPoolExecutor class. When the executor finishes the execution of all
    the pending tasks, it finishes its execution. After well the shutdown() method,
    if you try to send another task to the executor, it will be rejected and the executor
    will throw a RejectedExecutionException unless you have implemented a manager
    for rejected tasks, as in our case. To manage the rejected tasks of the executor,
    you need to create a class that implements the RejectedExecutionHandler interface.
    This interface has a method rejectedExecution() with two parameters:


    +   - A Runnable object stores the task that has been rejected

    - An Executor object stores the executor that rejected the task


    This method is called for every task that is rejected by the executor. You need
    to establish the handler of the rejected tasks using the setRejectedExecutionHandler()
    method of the ThreadPoolExecutor class.


    The following screenshot shows part of an execution of this example:


    ```

