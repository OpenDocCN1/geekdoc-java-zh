  md: "# Interrupting a thread\n\nA program with more than one execution thread only\
    \ finishes when the execution of all of its threads end (more specifically, when\
    \ all its non-daemon threads end their execution or when one of the threads uses\
    \ the System.exit() method). Sometimes, you may need to finish a thread because\
    \ you want to terminate a program or when a user of the program wants to cancel\
    \ the tasks that a thread is doing.\n\nJava provides an interruption mechanism\
    \ that indicates to a thread that you want to finish it. One peculiarity of this\
    \ mechanism is that thread objects have to check whether they have been interrupted\
    \ or not, and they can decide whether they respond to the finalization request\
    \ or not. A thread object can ignore it and continue with its execution.\n\nIn\
    \ this recipe, we will develop a program that creates a thread and forces its\
    \ finalization after 5 seconds, using the interruption mechanism.\n\n# Getting\
    \ ready\n\nThe example for this recipe has been implemented using the Eclipse\
    \ IDE. If you use Eclipse or a different IDE, such as NetBeans, open it and create\
    \ a new Java project.\n\n# How to do it...\n\nFollow these steps to implement\
    \ the example:\n\n+   1. Create a class called PrimeGenerator that extends the\
    \ Thread class:\n\npublic class PrimeGenerator extends Thread{\n\n2. Override\
    \ the run() method including a loop that will run indefinitely. In this loop,\
    \ process consecutive numbers beginning from one. For each number, calculate whether\
    \ it's a prime number; if yes, as in this case, write it to the console:\n\n@Override\n\
    public void run() {\n\tlong number=1L;\n\twhile (true) {\n\t\tif (isPrime(number))\
    \ {\n\t\t\tSystem.out.printf(\"Number %d is Prime\\n\",number);\n\t\t}\n\t}"
