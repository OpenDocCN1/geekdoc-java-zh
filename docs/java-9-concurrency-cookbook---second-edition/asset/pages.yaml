  md: '# Additional Information


    +   1. First, execute the Runnable object (in this case, a FileSearch object).

    2. Second, return the results that this task generates. To achieve this, you have
    overridden the set () method of the Task class. Internally, the FutureTask class
    controls when the task has finished. At that moment, it makes a call to the set
    () method to establish the return value of the task. When you are executing a
    Callable object, this call is made with the value returned by the call() method,
    but when you are executing a Runnable object, this call is made with the null
    value. You have changed this null value with the list of results generated by
    the FileSearch object. The set () method will only effect the first time it is
    called. When it''s called for the first time, it marks the task as finished and
    the rest of the calls will not modify the return value of the task.


    In the Main class, instead of sending the FutureTasks objects to the Callable
    or Runnable objects, you can send it to the executor object. The main difference
    is that you use the FutureTasks objects to get the results of the task instead
    of the Future object returned by the submit () method.


