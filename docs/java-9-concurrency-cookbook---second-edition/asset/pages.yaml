  md: '# Thread Synchronization Utilities


    In this example, we use paths of the Windows operating system. If you work with
    another operating system, modify the paths to adapt them to existing paths in
    your environment, such as /var/log, or similar.


    The first instruction in the run() method of the FileSearch object is a call to
    the arriveAwaitAdvance() method of the Phaser. As mentioned earlier, Phaser knows
    the number of threads that we need to synchronize. When a thread calls this method,
    Phaser decreases the number of threads that to finalize the actual phase and puts
    this thread to sleep until all the remaining threads finish this phase. Calling
    this method at the beginning of the run() method ensures that none of the FileSearch
    threads begin their job until all threads are created.


    At the end of phase one and phase two, we check whether the phase has generated
    results and the list with the results elements or the phase generated results
    and the list is empty. In the first case, the checkResults() method arriveAwaitAdvance()
    as explained earlier. In the second case, if the list is empty, there is no point
    in the thread continuing with its execution, so it ends its execution. But you
    have to notify the Phaser object that there will be one less participant. For
    this, we use arriveDeregister(). This notifies phaser that the thread has finished
    the actual phase, but it won''t participate in future phases, therefore, phaser
    won''t wait for it to continue.


    At the end of the phase three implemented in the showInfo() method, there is a
    call to the arriveAwaitAdvance() method of phaser. With this call, we guarantee
    that all the threads finish at the same time. When this method ends its execution,
    there is a call to the arriveDeregister() method of phaser. With this call, we
    deregister the threads of phaser, as explained before, so when all the threads
    finish, phaser will have zero participants.


    Finally, the main() method waits for the completion of the three threads and calls
    the isTerminated() method of phaser. When phaser has zero participants, it enters
    the called termination state, and this method returns true. As we deregister all
    the threads of phaser, it will be in the termination state, and this call will
    print true to the console.


    A Phaser object can be in two states:


    +   * Active: Phaser enters this state when it accepts the registration of new
    participants and its synchronization at the end of each phase. In this state,
    Phaser works as it has been explained in this recipe. This state is not mentioned
    in the Java concurrency API.'
