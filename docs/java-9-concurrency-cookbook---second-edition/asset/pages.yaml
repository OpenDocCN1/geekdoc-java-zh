  md: '# Concurrent Programming Design


    +   * LinkedTransferQueue: This is a blocking queue that provides operations to
    work in situations that can be implemented as a producer/consumer problem. It
    provides operations that, if not done because the queue is either full or empty,
    puts the thread to sleep until you are able to do the operation.


    +   * PriorityBlockingQueue: This is a blocking queue that orders its elements
    based on priority. All the elements inserted in this queue must implement the
    Comparable interface. The value returned by the compareTo() method will determine
    the position of the element in the queue. Just like all the blocking data structures,
    provides operations that, if done immediately, puts the thread to sleep until
    you are able to do the operation.


    +   * SynchronousQueue: This is a blocking queue where every insert operation
    must wait for a remove operation for the other thread. The two operations must
    be done at the same time.


    +   * ConcurrentHashMap: This is a HashMap that allows concurrent operations.
    It''s a non-blocking data structure.


    +   * ConcurrentSkipListMap: This data structure associates keys with values.
    Every key can have only one value. It stores the keys in an ordered way and provides
    a method to find elements and get some elements from the map. It''s a non-blocking
    data structure.


    # There''s more...


    If you need to use a data structure in your concurrent application, look in the
    Java API documentation to find the data structure that fits your needs. Implement
    your own concurrent data structure that has some problems, which are as follows:


    +   * They have a complex internal structure


    +   * You have to take into account a lot of different situations


    +   * You have to design a lot of tests to guarantee that it works correctly


    If you don''t find a data structure that fits your needs completely, try to extend
    one of the existing concurrent data structures to implement one adequately to
    your problem.


    # See also


    +   * The recipes in Chapter 7, Concurrent Collections'
