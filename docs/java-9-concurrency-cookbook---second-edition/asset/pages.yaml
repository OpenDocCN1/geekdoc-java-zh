  md: '# There''s more...


    ConcurrentHashMap has more methods than was specified in the previous section.
    We enumerate some of them in the following list:


    +   * forEach() and forEachValue(): These methods are similar to the forEach(),
    but in this case, the expression processes the keys and values stored in ConcurrentHashMap,
    respectively.

    * searchEntries(), searchKeys(), and searchValues(): These methods are similar
    to the search() method explained before. However, in this case, the expression
    passed as a parameter receives an Entry object, a key, or a value of the elements
    stored in ConcurrentHashMap.

    * reduceEntries(), reduceKeys(), and reduceValues(): These methods are similar
    to the reduce() method explained before. However, in this case, the expression
    passed as a parameter receives an Entry object, a key, or a value of the elements
    stored in ConcurrentHashMap.

    * reduceXXToDouble(), reduceXXToLong(), and reduceXXToInt(): These methods allow
    you to make a reduction of the elements of ConcurrentHashMap by generating a double,
    long, or int value, respectively.

    * computeIf(): This method complements the computeAbsent() in this case, it receives
    a key and an implementation of the BiFunction interface that can be expressed
    as a lambda expression. If the key exists in the HashMap, the method applies the
    expression to calculate the new value of the key. The BiFunction interface receives
    the key and the actual value of that key as parameters, and it returns the new
    value.

    * merge(): This method receives a key, value, and implementation of the BiFunction
    interface that can be expressed as a lambda expression; they are received as parameters.
    If the key does not exist in ConcurrentHashMap, it inserts it and associates the
    value parameter with it. If it exists, execute BiFunction to calculate the new
    value associated with the key.

    BiFunction interface receives the key and actual value as parameters and returns
    the new value associated with the key.

    * getOrDefault(): This method receives a key and a default value as parameters.
    If the key exists in ConcurrentHashMap, it returns its associated value. Otherwise,
    it returns the default value.'
