  md: '# How it works...


    In this recipe, you implemented a test for the LinkedTransferQueue class using
    the MultithreadedTC library. You can implement a test in any concurrent application
    or class using this library and its metronome. In the example, you implemented
    the classical producer/consumer problem with two consumers and a producer. You
    wanted to test that the first String object introduced in the buffer is consumed
    by the first consumer that arrives at the buffer, and the second String object
    introduced in the buffer is consumed by the second consumer that arrives at the
    buffer.


    The MultithreadedTC library is based on the JUnit library, which is the most often
    used library to implement unit tests in Java. To implement a basic test using
    the MultithreadedTC library, you have to extend the MultithreadedTestCase class.
    This class extends the junit.framework.AssertJUnit class that includes all the
    methods to check the results of the test. Use junit.framework.TestCase class,
    so you can''t integrate MultithreadedTC tests with other JUnit tests.


    Then, you can implement the following methods:


    +   - initialize(): The implementation of this method is optional. It''s executed
    when you start the test, so you can use it to initialize objects that are using
    the test.

    - finish(): The implementation of this method is optional. It''s executed when
    the test has finished. You can use it to close or release resources used during
    the test or to check the results of the test.

    - Methods that implement the test: These methods have the main logic of the test
    you implement. They have start with the thread keyword, followed by a string,
    for example, thread().


    To control the order of execution of threads, use the waitFirstFit() method. This
    method receives an integer value as a parameter and puts the thread that is executing
    the method to sleep until all the threads are running in the test are blocked.
    When they are blocked, the MultithreadedTC library resumes the threads that are
    blocked by a call to the waitFirstFit() method.


    The integer you pass as a parameter of the waitFirstFit() method is used to control
    the order of execution. The metronome of the MultithreadedTC library has an internal
    counter. When all the threads are blocked, the library increments this counter
    to the next number specified in the waitFirstFit() calls that are blocked.'
