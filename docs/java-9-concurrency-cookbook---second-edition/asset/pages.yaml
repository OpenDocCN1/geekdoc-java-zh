  md: '# Customizing Concurrency Classes


    To use a MyScheduledTask in a scheduled executor, you override the decorateTask()
    method in the MyScheduledThreadPoolExecutor class. This class extends the ScheduledThreadPoolExecutor
    executor, and the method provides a mechanism to convert the default scheduled
    tasks by the ScheduledThreadPoolExecutor executor into MyScheduledTask. So, when
    you implement your own version of scheduled tasks, you have to implement your
    version of a scheduled executor.


    The decorateTask() method simply creates a new MyScheduledTask object with four
    parameters. The first one is a Runnable object that is going to be executed in
    the task. The second one is the object that is going to be returned by the task.
    In this case, the task will not return a result, so you used the null value. The
    third one is the task that the new object is going to replace in the pool and
    the latest is the executor that will execute the task. In this case, you use this
    keyword to reference the executor that is creating the task.


    ![](img/7344934473186973cf892ad92ac824d9_400_0.png)


    MyScheduledTask class can execute delayed and periodic tasks. You implemented
    two methods with all of the necessary logic to execute both kinds of tasks. They
    are the getDelay() and run() methods.


    the getDelay() method is called by the executor to know whether it has to execute
    a task. The behavior of this method changes in delayed and periodic tasks. As
    mentioned earlier, the constructor of the MyScheduledClass receives the original
    ScheduledRunnableFuture object that was going to execute the Runnable object and
    stores it as an attribute of the class to have access to its methods and data.
    When we execute a delayed task, the getDelay() method returns the delay of the
    original task; however, in the case of a periodic task, the getDelay() method
    returns the difference between the startDate and the actual date.


    The run() method is the one that executes the task. One peculiarity of periodic
    tasks is that you have to put the next execution of the task in the queue of the
    executor as a new task if you want the task to be executed again. So, if you''re
    executing a periodic task, you establish the startDate value and add it to the
    actual date and period of the execution of the task and store that again in the
    queue of the executor. The startDate attribute stores the date when the next execution
    of the task will begin. Then, you execute the task using the runAndReset() method
    provided by the FutureTask class. In the case of delayed tasks, you don''t have
    to put them in the queue of the executor because they can be executed once.'
