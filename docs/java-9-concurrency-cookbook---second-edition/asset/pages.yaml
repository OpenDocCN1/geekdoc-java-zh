    # How it works...


    Converting a regular executor to a priority-based executor is simple. You only
    have to pass a PriorityBlockingQueue object, parameterized by the Runnable interface,
    as a parameter. With the executor, you should know that all the objects stored
    in a priority queue have to implement the Comparable interface.


    You implemented the PriorityTask class that implements the Runnable interface,
    which will act as a task, and the Comparable attribute to be stored in the priority
    queue. If a class has a higher value for this attribute, it will be executed earlier.
    The compareTo() method determines the order of the tasks in the priority queue.
    In the Main class, you send 20 tasks with different priorities. The first tasks
    you sent to the executor were the first to be executed. As the executor was waiting
    for the tasks, it executed the first tasks immediately, as soon as they arrived.
    You created the executor with four threads, so the first four tasks will be the
    first ones that are executed. The rest of the tasks will be executed on their
    priority.


