  md: '# Additional Information


    +   - peek(): This method returns the first element in the LinkedTransferQueue
    object, it doesn''t delete it from the list. If the queue is empty, the method
    returns the null value.


    +   - poll(long timeout, TimeUnit unit): This version of the poll method, if the
    LinkedTransferQueue buffer is empty, waits for it a specified period of time.
    If the specified period of time passes and the buffer is still empty, the method
    returns a null value. The TimeUnit class is an enumeration with the following
    constants-DAYS, HOURS, MICROSECONDS, MILLISECONDS, MINUTES, SECONDS.


    # See also


    +   - The Using conditions in synchronized code recipe in Chapter 2, Basic Thread
    Synchronization


    +   - The Exchanging data between concurrent tasks recipe in Chapter 3, Thread
    Synchronization Utilities


    # Monitoring a Thread class


    Threads are the most basic element of the Java Concurrency API. Every Java program
    has at least one thread that executes the main() method, which, in turn, starts
    the execution of the application. When you launch a new Thread class, it''s executed
    in parallel with the other threads of the application and with the other processes
    on an operating system. There is a critical difference between process and thread.
    A process is an instance of an application that is running (for example, you''re
    editing a document in a text processor). This process has one or more threads
    that execute the tasks that makes the process. You can be running more than one
    process of the same application, for example, two instances of the text processor.
    Threads inside a process share the memory while processes of the same OS don''t.


    All kinds of Java tasks that you can execute (Runnable, Callable, or fork/join
    tasks) are executed in threads, and all the advanced Java concurrency mechanisms,
    such as the Executor framework and the fork/join framework, are based on pools
    of threads.


    In this recipe, you will learn what information you can obtain about the status
    of a Thread class and how to obtain it.'
