    # How it works...


    The main element of this example is Spliterator. This interface defines methods
    that can be used to process and partition a source of elements to be used, for
    example, the source of a Stream object. You will rarely need to use a Spliterator
    object directly. Only if you want a different behavior-that-is, if you want to
    implement your own data structure and create Stream from-use a Spliterator object.


    Spliterator has a set of characteristics that defines its behavior. They are as
    follows:


    +   * CONCURRENT: The data source can be modified concurrently

    * DISTINCT: All the elements of the data source are distinct

    * IMMUTABLE: Elements can be added, deleted, or replaced in the data source

    * NONNULL: There''s no null element in the data source

    * ORDERED: There''s an encounter ordered in the elements of the data source

    * SIZE: The value returned by the estimateSize() method is the exact size of the
    Spliterator

    * SORTED: The elements of Spliterator are sorted

    * SUBSIZ: After you call the trySplit() method, you can obtain the exact size
    of both the parts of Spliterator'
