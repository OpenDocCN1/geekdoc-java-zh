  md: '# Customizing Concurrency Classes


    The cycle of the communication starts when a subscriber calls the subscribe()
    method of a publisher. The publisher has to create the subscription between them
    and send that subscription to the subscriber using the onSubscribe() method. The
    subscriber must use the request() method to indicate that it is ready to process
    more elements from the publisher. When the publisher publishes an item, it will
    send it to all subscribers who have requested elements from the publisher using
    the subscription between.


