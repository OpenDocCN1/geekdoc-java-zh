    # Using atomic variables


    Atomic variables were introduced in Java version 5 to provide atomic operations
    on single variables. When you work with a normal variable, each operation that
    you implement in Java is transformed into several instructions of Java code that
    is understandable by the JVM when you compile the program. For example, when you
    assign a value to a variable, you use only one instruction in java; however, when
    you compile this program, it is transformed into various instructions in the JVM
    language. This can lead to inconsistency errors when you work with multiple threads
    that share a variable.


    To avoid these problems, Java introduced atomic variables. When a thread is doing
    an operation with an atomic variable and if other threads try to do an operation
    with the same variable, the implementation of the class includes a mechanism to
    check that the operation is done atomically. Basically, the operation gets the
    value of the variable, changes the value to a local variable, and then tries to
    change the value with the new one. If the old value is still the same, it is substituted;
    not, the method begins the operation again. **Compare and Set**. It implements
    the modification of the value of a variable in the following three steps:


    +   1. You get the value of the variable, which is the old value of the variable.

    2. You change the value of the variable in a temporal variable, which is the new
    value of the variable.

    3. You substitute the old value with the new value if the old value is equal to
    the actual value of the variable. The old value may be different from the actual
    value if other threads change the value of the variable.


    Some these variables, for example, the `LongAccumulator` class, receive an operation
    as a parameter that could be executed inside some of its methods. These operations
    must be free from any side effects, as they might get multiple times in every
    value update.


    Atomic variables don''t use locks or synchronization mechanisms to protect access
    to their values. All their operations are based on Compare and Set. It''s guaranteed
    that several threads can work with an atomic variable at a time without generating
    inconsistency errors; plus, they simplify the implementation.'
