  md: '# Concurrent Programming Design


    When you want to use a data structure in your concurrent application, you have
    to review the documentation of the class that implements that data structure to
    check that it supports concurrent operations. Java provides the following two
    kinds of concurrent data structures:


    +   - **Non-blocking data structures**: All the operations provided by these data
    structures to either insert in or take off elements from the data structure return
    a null value if they can''t be currently because the data structure is full or
    empty respectively.

    - **Blocking data structures**: These data structures provide the same operations
    that are provided by non-blocking data structures. However, they also provide
    operations to insert and take off data that, if not done immediately, would block
    the thread until you''re able to do the operations.


    These are some data structures provided by the Java API that you can use in your
    concurrent applications:


    +   - **ConcurrentDeque**: This is a non-blocking data structure based on linked
    nodes that allow you to insert data at the beginning or end of the structure.

    - **LinkedBlockingDeque**: This is a blocking data structure based on linked nodes.
    It has fixed capacity. You can insert elements at the beginning or end of the
    structure. It provides operations that, if not done immediately, block the thread
    until you''re able to do the operation.

    - **ConcurrentLinkedQueue**: This is a non-blocking queue that allows you to insert
    elements at the end of the queue and take elements from its beginning.

    - **ArrayBlockingQueue**: This is a blocking queue with fixed size. You insert
    elements at the end of the queue and take elements from its beginning. It provides
    operations that, if not done because the queue is either full or empty, puts the
    thread to sleep until you''re able to do the operation.

    - **LinkedBlockingQueue**: This is a blocking queue that allows you to insert
    elements at the end of the queue and take off elements from its beginning. It
    provides operations that, if not done because the queue is either full or empty,
    puts the thread to sleep until you''re able to do the operation.

    - **DelayQueue**: This is a *LinkedBlockingQueue* queue with delayed elements.
    Every element inserted in this queue must implement the *Delayed* interface. An
    element can''t be taken off the list until its delay is 0.


    [ 531 ]'
