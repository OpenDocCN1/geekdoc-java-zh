    unchecked

    exception), the JVM checks whether the thread has an uncaught exception handler
    set by

    the corresponding method. If it does, the JVM invokes this method with the Thread
    object

    and Exception as arguments.


    If the thread doesn''t have an uncaught exception handler, the JVM prints the
    stack trace in

    t console and ends the execution of the thread that had thrown the exception.


    # There''s more...


    The Thread class has another method related to the process of uncaught exceptions.
    It''s the

    static method setDefaultUncaughtExceptionHandler() that establishes an exception

    handler for all the thread objects in the application.


    When an uncaught exception is thrown in the thread, the JVM looks for three possible

    handlers for this exception.'
