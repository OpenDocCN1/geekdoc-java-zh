  md: '# Implementing your own asynchronous stream


    Reactive streams (http://www.reactive-streams.org/) defines a mechanism to provide
    asynchronous stream processing with non-blocking back pressure.


    Reactive streams are based on three elements:


    +   - It is a publisher of information

    - It has one or more subscribers of this information

    - It provides subscription between the publisher and a consumer


    Java 9 has included three interfaces--Flow.Publisher, Flow.Subscriber, and Flow.Subscription--and
    a utility class, SubmissionPublisher, to allows us to implement reactive streams.


    In this recipe, you will learn how to implement your reactive application using
    only three interfaces. Take into account that we will implement the expected behavior
    between the three elements. The publisher will only send elements to those subscribers
    who have requested them, and it will do this in a concurrent way. You can modify
    this behavior easily by modifying the implementation of the methods.


    # Getting ready


    The example of this recipe has been implemented using the Eclipse IDE. If you
    use Eclipse or another IDE, such as NetBeans, open it and create a new Java project.


    # How to do it...


