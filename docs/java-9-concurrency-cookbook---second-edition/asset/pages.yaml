  md: '# See also


    +   - The Monitoring a Phaser class recipe in Chapter 9, Testing Concurrent Applications


    # Controlling phase change in concurrent-phased tasks


    The Phaser class provides a method that is executed each time phaser changes the
    phase. It''s the onAdvance() method. It receives two parameters: the number of
    the current phases and the number of registered participants. It returns a Boolean
    value false if Phaser has finished and has to enter the termination state.


    The default implementation of this method returns true if the number of registered
    participants is zero, and false otherwise. But you can modify this behavior if
    you extend the Phaser class and override this method. Normally, you will be interested
    in doing this when you have to execute some actions from one phase to the next.


    In this recipe, you will learn how to control phase change in a phaser that is
    implementing your own version of the Phaser class that overrides the onAdvance()
    method to execute some actions in every phase change. You are going to implement
    a simulation of an exam, where there will be some students who have to do three
    exercises. All the students have to finish one exercise before they proceed with
    the next one.


    # Getting ready


    The example of this recipe has been implemented using the Eclipse IDE. If you
    use Eclipse or a different IDE, such as NetBeans, open it and create a new Java
    project.'
