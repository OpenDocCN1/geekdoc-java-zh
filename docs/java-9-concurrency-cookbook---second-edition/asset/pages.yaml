  md: "# Basic Thread Synchronization\n\nFor these types of situations, Java provides\
    \ the wait(), notify(), and notifyAll() methods implemented in the Object class.\
    \ A thread can call the wait() method inside a synchronized block of code. If\
    \ it calls the wait() method outside a synchronized block of code, JVM throws\
    \ an IllegalMonitorStateException. When the thread calls the wait() method, puts\
    \ to sleep and releases the object that controls the synchronized block of code\
    \ that its executing and allows other threads to execute other blocks of synchronized\
    \ code protected by it. To wake up the thread, you must call the notify() or notifyAll()\
    \ methods inside a block of code protected by the same object.\n\nIn this recipe,\
    \ you will learn how to implement the producer-consumer problem using the synchronized\
    \ keyword and the wait(), notify(), and notifyAll() methods.\n\n# Getting ready\n\
    \nThe example of this recipe has been implemented using the Eclipse IDE. If you\
