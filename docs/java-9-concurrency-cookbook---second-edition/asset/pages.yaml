    # Monitoring an Executor framework


    Executor framework provides a mechanism that separates the implementation of tasks
    from thread creation and management to execute the tasks. If you use an executor,
    you only have to implement Runnable objects and send them to the executor. It
    is the responsibility of an executor to manage threads. When you send a task to
    an executor, it tries to use a pooled thread for executing the task in order to
    avoid the creation of new threads. This is offered by the Executor interface and
