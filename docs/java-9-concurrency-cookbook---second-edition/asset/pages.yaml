  md: "# Basic Thread Synchronization\n\nWhen a thread calls the signal() or signalAll()\
    \ methods of a condition, one or all of the threads that were waiting for condition\
    \ are woken up, but this doesn't guarantee that the condition that made them sleep\
    \ is now true. So you must put the await() calls inside a while loop. You can't\
    \ leave this loop until the condition is true. When the condition is false, you\
    \ must call await() again.\n\nYou must be careful with the use of await() and\
    \ signal(). If you call the await() method in the condition and never call the\
    \ signal() method in the same condition, the thread will sleep forever.\n\nA thread\
    \ can be interrupted while it is sleeping, after a call to the await() method,\
    \ so you have to process the InterruptedException exception.\n\n# There's more...\n\
    \nThe Condition interface has other versions of the await() method, which are\
    \ as follows:\n\n+   - await(long time, TimeUnit unit): Here, the thread will\
    \ sleep until:\n  - It's interrupted\n  - Another thread calls the signal() or\
    \ signalAll() methods in the condition\n  - The specified time passes\n  - The\
    \ TimeUnit class is an enumeration with the following constants: DAYS, HOURS,\
    \ MICROSECONDS, MILLISECONDS, MINUTES, NANOSECONDS, and SECONDS\n\n+   - awaitUninterruptibly():\
    \ The thread will sleep until another thread calls the signal() or signalAll()\
    \ methods, which can't be interrupted\n- awaitUntil(Date date): The thread will\
    \ sleep until:\n  - It's interrupted\n  - Another thread calls the signal() or\
    \ signalAll() methods in the condition\n  - The specified date arrives\n\nYou\
    \ can use conditions with the ReadLock and WriteLock locks of a read/write lock."
