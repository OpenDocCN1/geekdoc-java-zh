  md: '# There''s more...


    In the example of this recipe, we use the complete(), get(), join(), supplyAsync(),

    thenApplyAsync(), thenAcceptAsync(), and allOf() methods of the

    CompletableFuture class. However, this class has a lot of useful methods that

    increase the power and flexibility of this class. These are the most interesting
    ones:


    +   Methods to complete a CompletableFuture object: In addition to the

    complete() method, the CompletableFuture class provides the following

