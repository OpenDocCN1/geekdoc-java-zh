  md: '# Thread Management


    In this example, we use Java exceptions to control the interruption of a thread.
    When you run the example, the program starts going through folders by checking
    whether they have the file or not. For example, if you enter in the \b\c\d folder,
    the program will have three recursive calls to the directoryProcess() method.
    When it detects that it has been interrupted, it throws an InterruptedException
    and continues the execution in the run() method, no how many recursive calls have
    been made.


    # There''s more...


    The InterruptedException exception is thrown by some Java methods related to a
    concurrency API, such as sleep(). In this case, this exception is thrown if the
    thread is interrupted (with the interrupt() method) when it''s sleeping.


    # See also


    +   - The Interrupting a thread recipe of this chapter


    # Sleeping and resuming a thread


    Sometimes, you may be interested in pausing the execution of a thread during a
    determined period of time. For example, a thread in a program checks the sensor
    state once per minute. The rest of the time, it does nothing. During this time,
    the thread doesn''t use any resources of the computer. After this period is over,
    the thread will be ready to continue with its execution when the operating system
    scheduler chooses it to be executed. You can use the sleep() method of the Thread
    class for this purpose. This method receives a long number as a parameter that
    indicates the number of milliseconds during which the thread will suspend its
    execution. After that, the thread continues with its execution in the next instruction
    to the sleep() one when the JVM assigns CPU time.


    Another possibility is to use the sleep() method of an element of the TimeUnit
    enumeration. This method uses the sleep() method of the Thread class to put the
    current thread to sleep, but it receives the parameter in the unit that it represents
    and converts it into milliseconds.


    In this recipe, we will develop a program that uses the sleep() method to write
    the actual date every second.'
