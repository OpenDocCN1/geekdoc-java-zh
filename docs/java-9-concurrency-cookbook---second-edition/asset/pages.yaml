  md: '# Customizing tasks running in a scheduled thread pool


    Scheduled thread pool is an extension of the basic thread pool of the Executor
    framework that allows you to schedule the execution of tasks to be executed after
    a period of time. It''s implemented by the ScheduledThreadPoolExecutor class,
    and it permits the execution of the two kinds of tasks:


    +   - **Delayed tasks:** These kinds of tasks are executed only once after a period
    of time

    - **Periodic tasks:** These kinds of tasks are executed after a delay and periodically,
    ever so often


    Delayed tasks can execute both Callable and Runnable objects, but periodic tasks
    can only execute Runnable objects. All the tasks executed by a scheduled pool
    are implementation of the RunnableScheduledFuture interface. In this recipe, you
    will learn how to implement your own implementation of the RunnableScheduledFuture
    interface.


    # Getting ready


    The example of this recipe has been implemented using the Eclipse IDE. If you
    use Eclipse or a different IDE, such as NetBeans, open it and create a new Java
    project.


