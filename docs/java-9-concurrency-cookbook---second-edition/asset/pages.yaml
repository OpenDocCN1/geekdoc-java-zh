  md: "# Taking precautions using lazy initialization\n\n**Lazy initialization** is\
    \ a common programming technique that delays object creation until it is needed\
    \ for the first time. This normally causes the initialization of the objects to\
    \ be made in the implementation of the operations, instead of the constructor\
    \ of the classes. The main advantage of this technique is that you can save memory.\
    \ This is because you only create the indispensable objects needed for the execution\
    \ of your applications. You could have declared a lot of objects in one class,\
    \ but you do not use every object in every execution of your program; therefore,\
    \ your application doesn't use the memory for the objects that you not use in\
    \ an execution of the program. This advantage can be very useful for applications\
    \ that run in environments with limited resources.\n\nBy contrast, this technique\
    \ has the disadvantage of having performance issues in your application, as you\
    \ create objects the first time they are used inside an operation.\n\nThis technique\
    \ can also provoke problems if you use it in concurrent applications. As more\
    \ than one thread can be executing an operation at a time, they can be creating\
    \ an object at the same time, and this situation can be problematic. A singleton\
    \ classes has a special importance with mentioned earlier, an application has\
    \ only one object of these classes, and as mentioned, a concurrent application\
    \ can create more than one object. Consider the following code:\n\n```\npublic\
    \ static DBConnection getConnection() {\n    if (connection=null) {\n        connection=new\
    \ DBConnection();\n    }\n    return connection;\nn}\n```\n\nThis is the typical\
    \ method in a singleton class to obtain the reference of the unique object of\
    \ that class existing in the application, using lazy initialization. If the object\
    \ hasn't been created yet, it creates the object. Finally, it always returns it.\n\
    \nIf two or more threads execute at the same time the comparison of the first\
    \ sentence (connection == null), all of them will create a Connection object.\
    \ This isn't a desirable situation.\n\nIn this recipe, you will implement an elegant\
    \ solution to the lazy initialization problem."
