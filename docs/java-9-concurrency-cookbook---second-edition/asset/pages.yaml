  md: '# There''s more...


    The Lock interface (and the ReentrantLock class) includes another method to get
    control of the lock. it the tryLock() method. The biggest difference with the
    lock() method is that this method, if the thread uses it can''t get control of
    the Lock interface, returns immediately and doesn''t put the thread to sleep.
    It returns the boolean value true if thread gets control of the lock and false
    if not. You can also pass a time and a TimeUnit object to indicate the maximum
    amount of time the thread will wait to get the lock. If the time expires and the
    thread doesn''t get the lock, the method will return the false value. The TimeUnit
    class is an enumeration with the following constants: DAYS, HOURS, MICROSECONDS,
    MINUTES, NANOSECONDS, and SECONDS; these indicate the units of time we pass to
    a method.


    +   Take into consideration that it is the responsibility of the programmer to
    take into account the result of this method and returns false, it apparent that
    your program is unable to execute the critical section. If it does, you will probably
    have wrong results in your application.


    ![](img/7344934473186973cf892ad92ac824d9_95_0.png)


    The ReentrantLock class also allows the use of recursive calls. When a thread
    has control of a lock and makes a recursive call, it continues with the control
    of the lock, so the calling to the lock() method will return immediately and the
    thread will continue with the execution of the recursive call. Moreover, we can
    also call other methods. You should call the unlock() method as many times as
    you called the lock() method in your code.


    # Avoiding deadlocks


    You have to be very careful with the use of locks to avoid deadlocks. This situation
    occurs when two or more threads are blocked while waiting for locks that will
    never be unlocked. For example, thread (A) locks Lock (X) and thread (B) locks
    Lock (Y). Now, if thread (A) tries to lock Lock (Y) and thread (B) simultaneously
    tries to lock Lock (X), both the threads will be blocked indefinitely because
    they are waiting for locks that will never be liberated. Note that the problem
    occurs because both threads try to get the locks in the opposite order. The Appendix,
    Concurrent Programming Design, provides some good tips to design concurrent applications
    adequately and avoid these deadlock problems.'
