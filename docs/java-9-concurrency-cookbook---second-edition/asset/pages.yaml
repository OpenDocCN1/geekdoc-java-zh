  md: '# About the Author


    Javier Fernández González is a software architect with almost 15 years of experience
    in Java technologies. He has worked as a teacher, researcher, programmer, analyst,
    and writer, and he now works as an architect in all types of projects related
    to Java, especially J2EE. As a teacher, he has taken over 1,000 hours of training
    in basic Java, J2EE, and the Struts framework. As a researcher, he has worked
    in the field of information retrieval, developing applications for processing
    large amounts of data in Java, and has participated as a coauthor in several journal
    articles and conference presentations. Recently, he worked on developing J2EE
    web applications for various clients from different sectors (public administration,
    insurance, healthcare, transportation, and so on). Currently, he works as a software
    architect. He is the author of the book, Java 7 Concurrency Cookbook and Mastering
    Concurrency Programming with Java 8 by Packt.'
