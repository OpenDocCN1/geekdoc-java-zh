  md: '# How it works...


    The key point of this example is the Main class and the management of ScheduledThreadPoolExecutor.
    As with the ThreadPoolExecutor class


    To execute a task in this scheduled executor after a period of time, you have
    to use the schedule() method. This method receives the following three parameters:


    +   - The task you want to execute

    - The period of time you want the task to wait before its execution

    - The unit of the period of time, specified as a constant of the TimeUnit class


    In this case, each task will wait for a number of seconds (TimeUnit.SECONDS) equal
    to its position in the array of tasks plus one.


    > If you want to execute a task at a given time, calculate the difference between
    that date and the current date and use the difference as the delay of the task.


    The following screenshot shows the output of this example:


    ![](img/7344934473186973cf892ad92ac824d9_201_0.png)


    You can see how the tasks start their execution, one per second. All tasks are
    sent to the executor at the same time with a delay of 1 second later than the
    previous task.'
