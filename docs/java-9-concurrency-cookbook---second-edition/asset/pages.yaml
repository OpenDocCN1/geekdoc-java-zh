    This method receives a key and an implementation of the Function interface that
    can be expressed as a lambda expression; the key and implementation are received
    as parameters. If the key exists, the method returns the value associated with
    the key. If it doesn''t, the method executes the Function object and adds the
    key and value returned by Function to the HashMap. In our case, the key didn''t
    exist, so we created a new instance of the ConcurrentLinkedDeque class. The main
    advantage of this method is that it''s executed atomically; so, if another thread
    tries to do the same operation, it will be blocked until this operation is finished.


    Then, in the main() method, we used other methods of ConcurrentHashMap to process
    the information stored in the hash. We used the following methods:


    +   * forEach(): This method receives an implementation of the BiConsumer interface
    that can be expressed as a lambda expression; it is received as a parameter. The
    other two parameters represent the key and value of the element we''re processing.
    This method applies the expression to all the elements stored in ConcurrentHashMap.

    * forEach(): This method is equivalent to the previous one, but here the expression
    is an implementation of the Consumer interface. It receives an Entry object that
    stores the key and value of the entry we''re processing as a parameter. This is
    another way to express the functionality.

    * search(): This method receives the implementation of the BiFunction interface
    that can be expressed as a lambda expression; it is received as a parameter. This
    function also receives the key and value of the entry of the ConcurrentHashMap
    object we''re processing as parameters. It returns the first non-null value returned
    by Function.

    * reduce(): This method receives two BiFunction interfaces to reduce the elements
    of ConcurrentHashMap to a unique value. This allows you to implement Reduce operation
    with the Map of ConcurrentHashMap. The first BiFunction interface allows you to
    transform the key and value of the elements into a unique value, and the second
    BiFunction interface allows you to aggregate the values of two different elements.


    All the methods described so far have a first parameter named parallelismThreshold.
    This parameter is described as ...(theestimated) number of elements needed for
    this operation to be executed in parallel..., that is to say, if ConcurrentHashMap
    has fewer elements than the value specified in the parameter, the method is executed
    in a sequential way. On the contrary (as in our case), the method is executed
    in a parallel way.


