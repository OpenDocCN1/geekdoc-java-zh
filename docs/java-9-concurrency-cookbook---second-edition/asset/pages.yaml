  md: '# There''s more...


    When you work with a log system, you have to take that information into consideration
    two important points:


    +   - **Write the necessary information:** If you write too little information,
    the logger won''t be useful because it won''t fulfil its purpose. If you write
    a lot of information, you will generate large unmanageable log files; this will
    make it difficult to get the necessary information.

    - **Use the adequate level for messages:** If you write high level information
    messages or low level error messages, you will confuse the user who will look
    at the log files. This will make it more difficult to know what happened in an
    error situation; alternatively, you will have too much of information making it
    difficult to know the main cause of the error.


    There are other libraries that provide a more complete than the `java.util.logging`
    package, such as the `Log4j` or `slf4j` libraries. But the `java.util.logging`
    package is part of the Java API, and all its methods are multithread safe; therefore,
    we can use it in concurrent applications without problems.


    # See also


    +   - The Using non-blocking thread-safe deques, Using blocking thread-safe deques,
    Using blocking thread-safe queues ordered by priority, Using thread-safe lists
    with delayed elements and Using thread-safe navigable maps recipes in Chapter
    7, Concurrent Collections


    # Analyzing concurrent code with FindBugs


    **Static code tools** are a set of tools that analyze the source code of an application
    while looking for potential errors. These tools, such as Checkstyle, PMD, or FindBugs,
    have a set of predefined rules of good practices and parse the source code for
    violations of these rules. The objective is to find errors or places that cause
    poor performance at an early stage, before they are executed in production. Programming
    languages usually use such tools, and Java is not an exception. One of the tools
    that helps analyze Java code is FindBugs. It''s an open source tool that includes
    a series of rules to analyze Java-concurrent code.'
