  md: '# How it works...


    The key to this example is the set() and get() methods of the EventStorage class.
    First of all, the set() method checks whether there is free space in the storage
    attribute. If it''s full, it calls the wait() method to wait for free space. When
    the other thread calls the notify() method, this thread wakes up and checks the
    condition again. The notify() method doesn''t guarantee that the condition is
    met. This process is repeated until there is free space in storage and it can
    generate a new event and store it.


    The behavior of the get() method is similar. First, it checks whether there are
    events on the storage attribute. If the EventStorage is empty, it calls the wait()
    method to wait for events. When the other thread calls the notify() method, this
    thread wakes up and checks the condition again until there are some events in
    storage.


    > You have to keep checking the conditions and calling the wait() method in a
    while loop. You will not be able to continue until the condition is true.


    If you run this example, you will find that although the producer and consumer
    are setting and getting events, storage never has the capacity to include more
    than 10 events.


    # There''s more...


    There are other important uses of the synchronized keyword. See the See also section
    of this recipes that explain the use of this keyword.


    # See also


    +   - The Synchronizing a method recipe in this chapter'
