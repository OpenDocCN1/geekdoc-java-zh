  md: "# Thread Management\n\nIn this recipe, we will use the second approach to create\
    \ threads. Then, we will learn how to change some attributes of the threads. The\
    \ Thread class saves some information attributes that can help us identify a thread,\
    \ its status, or control its priority. These attributes are:\n\n+   - **ID**:\
    \ This attribute stores a unique identifier for each thread.\n- **Name**: This\
    \ attribute stores the name of the thread.\n- **Priority**: This attribute stores\
    \ the priority of the Thread objects. In Java 9, threads can have priority between\
    \ 1 and 10, where 1 is the lowest and 10 is the highest. It's not recommended\
    \ that you change the priority of the threads. It's only a hint to the underlying\
    \ operating system and it doesn't guarantee anything, but it's a possibility that\
    \ you can use if you want.\n- **Status**: This attribute stores the status of\
    \ a thread. In Java, a thread can be one of the six states defined in the Thread.State\
    \ enumeration: NEW, RUNNABLE, BLOCKED, WAITING, TIMED_WAITING, or TERMINATED.\
    \ The following is a list specifying what each of these states means:\n    - **NEW**:\
    \ The thread has been created and it has not yet started\n    - **RUNNABLE**:\
    \ The thread is being executed in the JVM\n    - **BLOCKED**: The thread is blocked\
    \ and it is waiting for a monitor\n    - **WAITING**: The thread is waiting for\
    \ another thread\n    - **TIMED_WAITING**: The thread is waiting for another thread\
    \ with a specified waiting time\n    - **TERMINATED**: The thread has finished\
    \ its execution\n\nIn this recipe, we will implement an example that will create\
    \ and run 10 threads that would calculate the prime numbers within the first 20,000\
    \ numbers.\n\n# Getting ready\n\nThe example for this recipe has been implemented\
    \ using the Eclipse IDE. If you use Eclipse or a different IDE, such as NetBeans,\
    \ open it and create a new Java project."
