  md: "# Testing Concurrent Applications\n\nIf you double-click on one of the bugs,\
    \ you will see detailed information about it. As you have the source code reference\
    \ in the configuration of the project, you will also see the source code where\
    \ the bug was detected. The following screenshot shows you an example of this:\n\
    \n```\nTask.java in com.package.java8.concurrency.cookbook.chapter09.recipe07.Task\n\
    public Task(ReentrantLock lock) {\n    lock.lock();\n}\n\n    // Main method of\
    \ the task.\n@Override\npublic void run() {\n    lock.lock();\n\n    TimeUnit.SECONDS.sleep(1);\n\
    \    * There is a problem with this lock: If the thread is interrupted\n    *\
    \ while it is sleeping, the lock won't be unlocked and will cause\n    * the threads\
    \ that are waiting to detect this block will be blocked and\n    * never get the\
    \ control of the lock.\n}\n```\n\n# Method does not release lock on all exception\
    \ paths\n\nThis method acquires a JSR-166 (java.util.concurrent) lock, but does\
    \ not release it on all exception paths out of the method. In general, the correct-idiom\
    \ for using a JSR-166 lock is:\n\n```\ntry {\n    lock.lock();\n} catch (Throwable\
    \ e) {\n    // do something\n} finally {\n    lock.unlock();\n}\n```\n\nBug kind\
    \ and pattern: UL_UNRELEASED_LOCK_EXCEPTION_PATH\n\n# There's more...\n\nBe aware\
    \ that FindBugs can only detect some problematic situations (related or not to\
    \ concurrency code). For example, if you delete the unlock() call in the run()\
    \ method of the Task class and repeat the analysis, FindBugs won't alert you that\
    \ you will get the lock in the task but will never be able to free it.\n\nUse\
    \ the tools of the static code analysis as a form of assistance to improve the\
    \ quality of your code, but do not expect it to detect all the bugs."
