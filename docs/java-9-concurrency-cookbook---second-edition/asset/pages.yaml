    To write the number of elements in the deque, use the size() method. You take
    into account that this method can return a value that is not real, especially
    if you use it when there are threads adding to or deleting data from the list.
    The method has to traverse the entire deque to count the elements, and the contents
    of the list can change with this operation. Only if you use it when there aren''t
    any threads modifying the deque, you will have the guarantee that the returned
    result would be correct.


    # There''s more...


    The ConcurrentLinkedDeque class provides more methods to get elements from the
    deque:


    +   - getFirst() and getLast(): These methods return the first and last element
    from the deque, respectively. If the deque is empty, they throw a NoSuchElementExceptioncep
    exception.

    - peek(), peekFirst(), and peekLast(): These methods return the first and the
    last element of the deque, respectively. If the deque is empty, they return a
    null value.

    - remove(), removeFirst(), and removeLast(): These methods return the first and
    last element of the deque, respectively. They remove the returned element as well.
    If the deque is empty, they throw a NoSuchElementException exception.'
