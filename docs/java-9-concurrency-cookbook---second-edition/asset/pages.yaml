  md: '# Thread Synchronization Utilities


    In the case of the acquire(), acquireUninterruptibly(), and tryAcquire() methods,
    if the value of the counter is less than the number passed as parameter value,
    the thread will be blocked until the counter gets the same value or a greater
    one.


    # Fairness in semaphores


    The concept of fairness is used by the Java language in all classes that can have
    various threads blocked and are waiting for the release of a synchronization resource
    (for example, a semaphore). The default mode is called non-fair mode. In this
    mode, when the synchronization resource is released, one of the waiting threads
    is selected and is given this resource; however, it is selected without any criteria.
    Fair mode, on the other hand, changes this behavior and selects the thread that
    was waiting for the longest period of time.


    As with other classes, the Semaphore class admits a second parameter in its constructor.
    This parameter must take a Boolean value. If you give it a false value, you are
    creating a semaphore that will work in non-fair mode. You will get the same behavior
    if you don''t use this parameter. If you give it a true value, you are creating
    a semaphore that will work in fair mode.


