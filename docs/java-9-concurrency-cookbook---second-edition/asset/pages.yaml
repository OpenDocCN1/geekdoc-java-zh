  md: '# There''s more...


    The CyclicBarrier class has another version of the await() method:


    +   - await(long time, TimeUnit unit): In this method, the thread will continue
    to sleep until it''s interrupted, or either the internal counter of CyclicBarrier
    arrives at 0 or the specified time passes. The TimeUnit class is an enumeration
    with the following constants: DAYS, HOURS, MICROSECONDS, MILLISECONDS, MINUTES,
    NANOSECONDS, and SECONDS.


    This class also provides the getNumberWaiting() method that returns the number
    of threads that are blocked in the await() method and the getParties() method
    that returns the number of tasks that are going to be synchronized with CyclicBarrier.


    # Resetting a CyclicBarrier object


    The CyclicBarrier has some points in common with the CountDownLatch class, but
    they also have some differences. One of the most important differences is that
    the CyclicBarrier can be reset to its initial state, assigning to its internal
    counter the value with which it was initialized.


    This reset operation can be done using the reset() method of the CyclicBarrier
    class. When this occurs, all the threads that were waiting in the await() method
    receive a BrokenBarrierException exception. This exception was processed in the
    example presented in this riche by printing the stack trace; however, in a more
    complex application, it could perform some other operation, such as restarting
    the execution or recovering the operation at the point it was interrupted.


    # Broken CyclicBarrier objects


    A CyclicBarrier object can be in a special state denoted by the broken state.
    When there are various threads waiting in the await() method and one of them is
    interrupted, the one that is interrupted receives an InterruptedException, but
    other threads receive a BrokenBarrierException exception; CyclicBarrier is placed
    in the broken state.


    The CyclicBarrier class provides the isBroken() method. It returns true if the
    object is in the broken state; otherwise, it returns false.'
