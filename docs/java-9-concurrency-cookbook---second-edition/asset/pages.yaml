  md: '# Thread Synchronization Utilities


    +   * **Termination**: By default, Phaser enters this state when all the participants
    in Phaser have been deregistered, which means it has zero participants. Further,
    Phaser is in the termination state when the method onAdvance() returns true. If
    you override this method, you can change the behavior. When Phaser is in this
    state, the synchronization method arriveAndAwait() returns immediately without
    doing any synchronization operation.


    A notable feature of the Phaser class is that you haven''t had to control any
    exception from the methods related to phaser. Unlike other synchronization utilities,
    threads that are sleeping in phaser don''t respond to interruption events and
    won''t throw InterruptedException. There is only one exception, which is explained
    in the next section.


    The following screenshot shows the results of one execution of the example:


    ```

