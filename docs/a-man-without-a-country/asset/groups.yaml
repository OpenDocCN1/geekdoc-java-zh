    when they were still in slavery was a gift so great that it is now almost the
    only reason few foreigners still like us at least a little bit. That specific
    remedy for the worldwide epidemic of depression is a gift called the blues. All
    pop music today—jazz, swing, be-bop, Elvis Presley, the Beatles, the Stones, rock-and-roll,
    hip-hop, and on and on on—is derived from the blues.


    A gift to the world? One of the best rhythm-and-blues combos I ever heard was
    three guys and a girl from Finland playing in a club in Krakow, Poland.


    The wonderful writer Albert Murray, who is a jazz historian and a friend of mine
    among other things, told me that during the era of slavery in this country—an
    atrocity from which we can never recover—the suicide rate per capita among slave
    owners was much higher than the suicide rate among slaves.


    Murray thinks this was because slaves had a way of dealing with depression, which
    white owners did not: They could shoot away Old Man Suicide by playing and singing
    the Blues. He says something else also sounds right to me. He says the blues can''t
    drive depression out of a house, but can drive it into the corners of any room
    where it''s being played. Please remember that.


    Foreigners love us for our jazz. And they don''t hate us for our purported liberty
    and justice for all. They have us now for our arrogance.


    ## When I went to grade school in Indianapolis, the James Whitcomb Riley School
    #43, we used to draw pictures of houses of tomorrow, boats of tomorrow, airplanes
    of tomorrow, and there were all these dreams for the future. Of course at that
    time everything had come to a stop. The magic word was Prosperity. Sometime Prosperity
    will come. We were preparing for it. We were dreaming of the sorts of houses human
    beings should inhabit—ideal dwellings, ideal forms of transportation.


    What is radically new today is that my daughter, Lily, who has just turned twenty-one,
    finds herself, as your children, as George W. Bush, himself a kid, and Saddam
    Hussein and on and on, heir to a shockingly recent history of human slavery, to
    an AIDS epidemic, and to nuclear submarines slumbering on the floors of fjords
    in Iceland and elsewhere, crews prepared at a moment’s notice to turn industrial
    quantities of men, women, and children into radioactive soot and bone meal by
    means of rockets and H-bomb warheads. Our children have inherited technologies
    whose byproducts, whether in war or peace, are rapidly destroying the whole planet
    as a breathable, drinkable system for supporting life of any kind.


    Anyone who has studied science and talks to scientists notices that we are in
    terrible danger now. Human beings, past and present, have trashed the joint.


    The biggest truth to face now—what is probably making me funny for the remainder
    of my life—is that I don’t think people give a damn whether the planet goes or
    not. It seems to me as if everyone is living as members of Alcoholics Anonymous
    do, day by day. And a few more days will be enough. I know of very few people
    who are dreaming of a world for their grandchildren.


    Many years ago I was so innocent I still considered possible that we could become
    the humane and reasonable America so many members of my generation used to dream
    of it. We dreamed of such an America during the Great Depression, when there were
    no jobs. And then we fought and died for that dream during the Second World War,
    when there was no peace.


    But I know now that there is not a chance in hell of America becoming humane and
    reasonable. Because power corrupts us, and absolute power corrupts us absolutely.
    Human beings are chimpanzees who get drunk on power. By saying that our leaders
    are power-drunk chimpanzees, am I wrecking the morale of our soldiers fighting
    and dying in the Middle East? Their morale, like many lifeless bodies, is already
    shot to pieces. They are being treated, as I never was, like toys a rich kid got
    for Christmas.


    The most intelligent and decent prayer ever uttered by a famous American, addressed
    To Whom It May Concern, and following an an enormous man-made calamity, were those
    of Abraham Lincoln at Gettysburg, Pennsylvania, back when battlefields were small.
    They could be seen in their entirety by men on horseback atop a hill. Cause and
    effect were simple. Cause was gunpowder, a mixture of potassium nitrate, charcoal,
    and sulfur. Effect was flying metal. Or a bayonet. Or a rifle butt. Abraham Lincoln
    said this about the silenced killing grounds at Gettysburg:


    > We cannot dedicate—we cannot consecrate—we cannot hallow this ground.

    > The brave men, living and dead, who struggled here have consecrated it far above
    our poor power to add or detract.


    Poetry! It was still possible to make horror and grief in wartime seem almost
    beautiful. Americans could still have illusions of honor and dignity when they
    thought of war. The illusion of human you-know-what. That is what I call it: "The
    you-know-what."


    And may I note parenthetically that I have already in this section exceeded by
    a hundred words or more the whole of Lincoln’s Gettysburg Address. I am windy.


    Killing industrial quantities of defenseless human families, whether by old-fashioned
    apparatus or by newfangled contraptions from universities, in the expectation
    of gaining military or diplomatic advantage thereby, may not be such a hot idea
    after all.


    Does it work?

    Its enthusiasts, its fans, if I may call them, assume that leaders of political
    entities we find inconvenient or are capable of pity for their own people. If
    they see or at least hear about frightened women and children and old people who
    looked and talked like themselves, maybe even relatives, they will be incapacitated
    by weepness. So goes the theory, as I understand it.


    Anyone who believes that might well go all the way and make Santa Claus and the
    tooth fairy icons of our foreign policy.


    Where are Mark Twain and Abraham Lincoln now when we need them? They were country
    boys from Middle America, and both of them made the American people laugh at themselves
    and appreciate really important, really moral jokes. Imagine what they would have
    to say today.


    One of the most humiliated and heartbroken pieces Mark Twain ever wrote was about
    the slaughter of six hundred Moro men, women, and children by our soldiers during
