    # 1


    **As a kid I was the youngest member** of my family, and the youngest child in
    any family is always a jokemaker, because a joke is the only way he can enter
    into an adult conversation. My sister was five years older than I was, my brother
    was nine years older than I was, and my parents were both talkers. So at the dinner
    table when I was very young, I was boring to all those other people. They did
    not want to hear about the dumb childish news of my days. They wanted to talk
    about really important stuff that happened in high school or maybe in college
    or at work. So the only way I could get into a conversation was to say something
    funny. I think I must have done it at first, just accidentally made a pun that
    stopped the conversation, something of that sort. And then I found out that a
    joke was a way to break into an adult conversation.


    I grew up at a time when comedy in this country was superb—it was the Great Depression.
    There were large numbers of absolutely top comedians on radio. And without intending
    to, I really studied them. I would listen to comedy at least an hour a night through
    my youth, and I got very interested in what jokes were and how they worked.


    When I''m being funny, I try not to offend. I don''t think much of what I''ve
    done has been in really ghastly taste. I don''t think I have embarrassed many
    people, alone or distressed them. The only shocks I use are an occasional obscene
    word. Some things are not funny. I can''t imagine a humorous book or skit about
    Auschwitz, for instance. And it''s not possible for me to make a joke about the
    death of John F. Kennedy or Luther King. Otherwise I can''t think of any subject
    that I would steer away from, that I could do with nothing. Total catastrophes
    are terribly amusing, as Voltaire demonstrated.


    I saw the destruction of Dresden. I saw the city before and came out of an air-raid
    shelter and saw it afterward, and certainly one response was laughter. God knows,
    that''s the soul seeking some relief.


    Any subject is subject to laughter, and I suppose there was laughter of a very
    ghastly kind by victims in Auschwitz.


    Humor is an almost physiological response to frustration—one of several. A dog,
    he said,


    when he can''t get out a gate, will scratch and start digging and making meaningless
    gestures, perhaps growling or whatever, to deal with frustration or surprise or
    fear.


    And a great deal of laughter is induced by fear. I was working on a funny television
    series years ago. We were trying to put a show together, as a basic principle,
    mentioned death in every episode and that this ingredient would make any laughter
    deeper without the audience''s realizing how we were inducing belly laughs.


    There is a superficial sort of laughter. Bob Hope, for example, was not really
    a humorist. He was a comedian with this stuff stiff, never mentioning anything
    troubling. I used to laugh my head off at Laurel and Hardy. There is terrible
    tragedy somehow. These men are too sweet to survive in this world and are in terrible
    danger all the time. They could be so easily killed.


    # Even the simplest jokes are based on tiny twinges of fear, as the question,
    "What is the white stuff in bird poop?" The auditor, as though called upon to
    recite in school, is momentarily afraid of saying something stupid. When the auditor
    hears the answer, which is, "That''s bird poop, too," he or she dispels the automatic
    fear with laughter. He or she has not been tested after all.


    “Why do firemen wear red suspenders?” and “Why did they bury George Washington
    on the side?” and so on. True enough, there are such hopeless situations what
    Freud called gallows humor. While we were bombed in Dresden, sitting in a cellar
    with our arms over our heads, one soldier said, “I wonder what the poor people
    are doing.” Nobody laughed, but we were still glad he said.


    # 2


    **Do you know what a twerp is? When** I was in Shortridge High School in Indianapolis
    65 years ago, a twerp was a guy who stuck a set of false teeth out his butt. (And
    a snarf was a guy who sniffed the seats of girls.)


    And I consider anybody twerp who hasn''t read the greatest American short story,
    which is “Occurrence at Owl Bridge,” by Ambrose Bierce. It isn''t remotely political.
    It is a flawless example of American genius, like “Sophisticated Lady” by Duke
    Ellington or the Franklin stove.


    I consider anybody twerp who hasn''t read **Democracy in America** by Alexis de
    Tocqueville. There can never be a better book than that one on the strengths and
    vulnerabilities inherent in our form of government.


    Want a taste of that great book? He said, and he said 169 years ago, that in no
    country other than ours have money taken a stronger hold on the affections of
    men. Okay?


    The French-Algerian writer Albert Camus, who won a Prize for Literature in 1957,
    wrote, “There is but one truly serious philosophical problem, and that is suicide.”


    So there''s another barrel of laughs from literature. Camus died in an automobile
    accident. His days: 1913-1960 A.D.


    Do you realize that all great literature—Moby Dick, Huckberry Finn, A Farewell
    to Arms, The Scarlet Letter, The Red Badge of Courage, The Iliad and The Odyssey,
    Crime and Punishment, The Bible, and “The Charge of the Light Brigade”—are all
    about what a bummer it is to be a human being? (Isn''t it some relief to have
    somebody that?)


    Evolution go to hell as far as I am concerned. What a mistake we are. We have
    mortals wounded this sweet life-supporting planet—the only one in the whole Milky
    Way—with a century of transportation whoopee. Our government is conducting a war
    against drugs, is it? Let them go after petroleum. Talk about destructive high!
