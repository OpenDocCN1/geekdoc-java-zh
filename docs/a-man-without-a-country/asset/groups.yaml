    # 12


    I used to be the owner and manager of an automobile dealership in West Barnstable,
    Massachusetts, called Saab Cape Cod. It I went out of business thirty-three years
    ago. The Saab then, as now, was a Swedish car, and I now believe my failure as
    a dealer so long ago explains what would otherwise remain a deep mystery: Why
    the Sweden have never given me a Nobel Prize for Literature. Old Norwegian proverb:
    “Swedes have short dicks but long memories.”


    Listen: The Saab then had only one model, a bug like a VW, but with the engine
    in front. Unlike all other cars, but like your lawnmower opening into the slipstream
    and your outboard, it had a two-stroke rather than a four-stroke engine. Every
    time you filled the tank with gas, you had to pour in a can of oil as well. For
    whatever reason, straight women did not want to do this.


    The chief selling point was that a Saab could drag a VW at a stoplight. But if
    you or your significant other had failed to add oil to the last tank of gas, and
    the car would then become fireworks. It also had frontwheel drive, of some help
    on slippery pavements or when accelerating into curves. These had this as well:
    As one prospective customer said to me, “They make the best watches. Why wouldn’t
    they make the best cars, too?” I was bound to agree.


    The Saab back then was a far cry from the sleek, powerful, four-stroke yuppie
    uniform it is today. It was the wet dream, if you like, engineers in an airplane
    factory who’d never made a car before. Wet dream, did I say? Get a load of this:
    There was a ring on the dashboard, connected to a chain running over pulleys in
    the engine compartment. Pull on it, and the far end would raise a sort of window
    shade on a spring-loaded roller behind the front grill. That was to keep the engine
    warm when you went off somewhere. So, when you came back, if you hadn’t stayed
    away too long, the engine would start up again.


    But if you stayed away too long, window shade or not, the oil would separate from
    the gas and sink like molasses to the bottom of the tank. So when you started
    up again, you would lay down a smokescreen like a destroyer in a naval engagement.
    And I actually blacked out the'
  - '[PAGE 80]


    whole town of Woods Hole at high noon that way, having left a Saab in a parking
    lot there for about a week. I am told old timers there still wonder out loud about
    where all that smoke could have come from. I came to speak ill of Swedish engineering,
    and so diddled myself out of a Nobel Prize.


    **It’s damn hard** to make jokes work. In *Cat’s Cradle*, for instance, there
    are very short chapters. Each one of them represents one day’s work, and each
    one is a joke. If I were writing about a tragic situation, it wouldn''t be necessary
    to make sure the things work. You can''t really misfire with a tragic scene. It''s
    bound to be moving if all the right elements are present. A joke is like building
    a mousetrap from scratch. You have to work pretty hard to make the thing snap
    when it is supposed to snap.


    I still listen to comedy, and there''s not much of that sort around. The closest
    thing is the reruns of Grouch Marx''s quiz, Who Bet Your Life. I''ve known funny
    writers who stopped being funny, who became serious persons and could longer make
    more jokes. I''m thinking of Michael Frayn, the British author who wrote *The
    Ten Men*. He became a very serious person. Something happened in his head.


    Humor is a way of holding off how awful life can be, to protect yourself. Finally,
    you get too tired, and the news is too awful, and humor doesn''t work anymore.
    Somebody like Mark Twain thought life was quite awful but held the awfulness at
    bay with jokes and so forth, but finally he couldn''t do it anymore. His wife,
    his best friend, and two of his daughters died. If you live enough, a lot of people
    close to you are going to die.


    It may be that I am no longer able to joke—that it is no longer a satisfactory
    defense mechanism. Some people are funny, and some are not. I used to be funny,
    and perhaps I''m not anymore. There may have been many shocks and disappointments
    that the defense of humor no longer works. It may be that I have become rather
    grumpy because I''ve seen many things that have offended me that I cannot deal
    with in terms of laughter.


    This may have happened already. I really don''t know what I''m going to become
    from now on. I''m simply along for the ride to see what happens to this body and
    this brain of mine. I started that I became'
