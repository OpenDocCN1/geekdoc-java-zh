  - '[PAGE 74]


    Its working title—or actually, its nonworking title—is God Were Alive Today. And
    hey, listen, it is time we thanked God that we are in a country where even the
    poor people are overweight. But the Bush diet could change that.


    And about the novel I can never finish, If God Were Alive Today, the hero, the
    stand-up comedian of Doomsday, not only does he denounce our addiction to fossil
    fuels and the pushers in the White House, because of overpopulation he is also
    against sexual intercourse. Gil Berman tells us allegiance:


    > I have become a flaming neuter. I am as celibate as at fifty percent of the
    heterosexual Roman Catholic clergy. And celibacy is no root canal. It''s so cheap
    and convenient. Talk about safe sex! You don''t have to do anything afterwards,
    because there is no afterward.


    > And when my tantrum, which is what I call my TV set, flashes boobs and smiles
    in my face, and says everybody but me is going to get laid tonight, and this is
    a national emergency, I''ve got to run out and buy a car or polls, or a folding
    gymnasium that I can hide under my bed, I laugh like a hyena. I know and you know
    that millions and millions of good Americans, present company not excepted, are
    not going to get laid tonight.


    > And we flaming neuters vote! I look forward to a day when the President of the
    United States, no less, probably isn''t going to get laid tonight either, decrees
    a National Neutral Pride Day. Out of our closets we''ll come by the millions.
    Shoulders squared, chins held high, we''ll go marching up Main Streets all over
    this boob-crazed democracy of ours, laughing like hyenas.


    What about God? If He were alive today? Gil Berman says, “God would have to be
    an atheist, because the excrement has hit the air-conditioning big time, big time.”'
  - '[PAGE 75]


    I think one of the biggest mistakes we’re making, second only to being people,
    has to do with what time really is. We have all these instruments for slicing
    it up like a salami, clocks and calendars, and we name the slices as though we
    own them, and they can never change—“11:00 AM, November 11, 1918,” for example—when
    in fact they are as likely to break into pieces or go scampering off as dollops
    of mercury.


    Might not be possible, then, that the Second World War was a cause of the first
    one? Otherwise, the first remains inexplicable nonsense of the most gruesome kind.
    Or try this: Is it possible that seemingly incredible geniuses like Bach and Shakespeare
    and Einstein were not in fact superhuman, but simply plagiarists, copying great
    stuff from the future?


    On Tuesday, January 20, 2004, I sent Joel Bleifuss, my editor at In Times, this
    fax:


    ON ORANGE ALERT HERE. ECONOMIC TERRORIST ATTACK EXPECTED AT 8 PM EST. KV


    Worried, he called, asking what was up. I said I would tell him when I had more
    complete information on the bombs George Bush set to deliver in his State of the
    Union address.


    That night I got a call from my friend, the out-of-print-science-fiction writer
    Kilgore Trout. He asked me, “Did you watch the State of the Union address?”


    “Yes, and it certainly helped to remember what the great British socialist George
    Bernard Shaw said about this planet."


    “Which was?”


    “He said, ‘I don’t know if there are men on the moon, but if there are, they must
    be using the earth as their lunatic asylum.’ And he wasn’t talking about the germs
    or the elephants. He meant we the people."


    “Okay."


    “You don’t think this is the Lunatic Asylum of the Universe?”


    “Kurt, I don’t think I expressed an opinion one way or the other.”'
  - '[PAGE 76]


    “We are killing this planet as a life-support system with the poisons from all
    the thermodynamic whoopee we’re making with atomic energy and fossil fuels, and
    everybody knows it, and practically nobody cares. This is how crazy we are. I
    think the planet’s immune system is trying to get rid of us with AIDS and new
    strains of flu and tuberculosis, and so on on. I think the planet should get rid
    of us. We’re really awful animals. I mean, that dumb Barbra Streisand song, ‘People
    who need people are the luckiest people in the world’—she’s talking about cannibals.
    Lots to eat. Yes, the planet is trying to get rid of us, but I think it’s too
    late.”


    And I said good-bye to my friend, hung up the phone, sat down and wrote this epitaph:
    “The good Earth—we could have saved it, but we were too damn cheap and lazy.”'
