    \n# I apologize to all of you who are the same age as my grandchildren. And many\
    \ of you reading this is probably the same age as my grandchildren. They, like\
    \ you, being royally shafted and lied to by our Baby Boomer corporations and government.\n\
    \nYes\n\nDan, that was my bad uncle, who said a male cant be a man unless he’d\
    \ gone to war.\n\nBut I had a good uncle, my late Uncle Alex. He was my father’s\
    \ kid brother, a childish graduate of Harvard who was an honest life-insurance\
    \ salesman in Indianapolis. He was well-read and wise. And his principal complaint\
    \ about other human beings was that they seldom noticed when they were happy.\
    \ So when we were drinking lemonade under an apple tree in the summer, say, and\
    \ talking lazily about this and that, almost buzzing like honeybees, Uncle Alex\
    \ would suddenly interrupt the agreeable blather to reclaim, “If this isn’t nice,\
    \ I don’t know what is.”\n\nSo I do the same now, and so do my kids and grandkids.\
    \ And I urge you to please notice when you are happy, and exclaim or murmur at\
    \ some point, “If this isn’t nice, I don’t know what is.”\n\n**We are not born\
    \ with imagination.** It has to be developed by teachers, by parents. There was\
    \ a time when imagination was very important because it was the major source of\
    \ entertainment. In 1892 if you were a seven-year-old, you read a story—just a\
    \ very simple one—about a girl whose dog had died. Doesn't that make you want\
    \ to cry? Don't you know how little girls feel? And you'd read another story about\
    \ a rich man slipping on a banana peel? Doesn't make you want to laugh? And this\
    \ imagination circuit is being built in your head. If you go to an art gallery,\
    \ here's just a square with daubts of paint on it that haven't moved in hundreds\
    \ of years. No sound comes out of it.\n\nThe imagination circuit is taught to\
    \ respond to the most minimal of cues. A book is an arrangement of twenty-six\
    \ phonetic symbols, ten numerals and each punctuation mark, people can cast their\
    \ eyes over these and envision the eruption of Mount Vesuvius or the Battle of\
    \ Waterloo. But it's no longer necessary for teachers and parents to build these\
    \ circuits. Now there are professionally produced shows with great actors, very\
    \ convincing sets, sound, music. Now there's the information highway. We don't\
    \ need the circuits more than we need to know how to ride horses. Those of us\
    \ who had imagination circuits built can look in someone's face and see stories\
    \ there; to everyone else, a face will just be a face.\n\nAnd there, I've just\
    \ used a semi-colon, which at the outset told you never to use. It is to make\
    \ a point that I did it. The point is: Rules only take us so far, even good rules.\n\
    \n**Who was the wisest person I ever met in my entire life?** It was a man, of\
    \ course it needn't have been. It was the graphic artist Saul Steinberg, who like\
    \ everybody else I know, I could ask him anything, and six seconds would pass,\
    \ and then he would give me a perfect answer, gruffly, almost a growl. He was\
    \ born in Romania, in a house where, according to him, “the geese looked in the\
    \ windows.”\n\nI said, “Saul, how should I feel about Picasso?”\n\nSix seconds\
    \ passed, and then he said, “God put him on Earth to show what it's like to be\
    \ really rich.”\n\nI said, “Saul, I am a novelist, and many of my friends are\
    \ novelists and good ones, but when we talk I keep feeling we are in two very\
    \ different businesses. What makes me feel that way?”\n\nSix seconds passed, and\
    \ then he said, “It's very simple. There are two sorts of artists, one not being\
    \ in the least superior to the other. But one responds to the history of his or\
    \ her art so far, and the other responds to life itself.”\n\nI said, “Saul, are\
    \ you gifted?”\n\nSix seconds passed, and then he growled, “No, but what you respond\
    \ to in any work of art is the artist’s struggle against his or her limitations.”\n\
    \n> The crucified planet Earth,\nshould it find a voice\nand a sense of irony,\n\
    might now well say\nof abuse of it,\n“Forgive them, Father,\nThey know not what\
    \ they do.”\n\nThe irony would be\nthat we know what\nwe are doing.\n\nWhen the\
    \ last living thing\nhas died on account of us,\nhow poetical it would be\nif\
    \ Earth floating up\nin a voice floating up\nperhaps\nfrom the floor\nof the Grand\
    \ Canyon,\n“It is done.”\nPeople did not like it here.\n\n# AUTHOR'S NOTE\n\n\
    The full-page, hand-lettered statements scattered throughout this book, “samplers\
    \ suitable for framing” if you like, are pictures of products of Origami Express,\
    \ a business partnership between myself and Joe Petro III, with headquarters in\
    \ Joe’s painting and silk-screening studio in Lexington, Kentucky, I paint or\
    \ draw pictures, and Joe makes prints of them, one by one, color by color, by\
    \ means of the time-consuming, archaic silk process, practiced by almost nobody\
    \ else any more: squeegee inks through cloths and onto paper. This process is\
    \ so painstaking and tactile, almost balletic, that each print Joe makes is a\
    \ painting in its own right.\n\nOur partnership’s name, Origami Express, is my\
    \ tribute to the many-layered packages Joe makes for prints he sends for me to\
    \ sign and number. The logo for Origami, made by Joe, isn't his picture of a picture\
    \ I sent him, but of a picture by me that he found in my novel Champions. It is\
    \ of a bomb in air, on its way down, with these words written on its side:\n\n\
    # GOODBYE\nBLUE\nMONDAY\n\nI have to have one of the luckiest persons alive, since\
    \ I have for four score and two years now. I can’t count all the times I should\
    \ have been dead or wished I were. But one of the best things that ever happened\
    \ to me, a one-in-a-billion opportunity to enjoy myself in perfect innocence,\
    \ was my meeting Joe. \n\nHere’s the thing: Back in 1993, almost eleven years\
    \ ago now, I was scheduled to lecture on November 1 at Midway College, a women’s\
    \ school on the edge of Lexington. Well in advance of my appearance, a Kentucky\
    \ artist, Joe Petro III, son of the Kentucky artist Joe Petro II, asked me to\
    \ do a black-and-white self-portrait, which he could use in silk-screen posters\
    \ to be used by the school. So I did and he did. Joe was only thirty-seven back\
    \ then, and I was a mere spring chicken of only seventy-one, not even twice his\
    \ age.\n\nWhen I got down there to speak, and was so happy about the posters,\
    \ I learned from Joe himself that he painted romantic but scientifically precise\
    \ pictures of wildlife, from which he made silk screen images. He had majored\
    \ in zoology at the University of Tennessee. Yes, and some of his pictures were\
    \ so appealing and informative that they had been used as propaganda by Greenpeace,\
    \ an organization trying, with scant success far, to prevent the murder of species,\
    \ even our own, by the way we live. And Joe, having shown me the poster and his\
    \ own work, said to me in effect, “Why don’t we keep going?”\n\nAnd so we have,\
    \ and it seems quite poetic in retrospective that Joe Petro III saved my life.\
    \ I will not explain. I will let it go at. We have collaborated on more than two\
    \ hundred different images, with Joe making editions, signed and numbered by me,\
    \ ten or more of each of them. The “samplers” in this book are not at all representative\
    \ of our total oeuvre, but are simply recent jeux d’esprit. Most of our stuff\
    \ has been knockoffs of Paul Klee and Marcel Duchamp and so on. And since we first\
    \ met, Joe has beguiled others into sending him pictures for him to do with what\
    \ he so loves to do. Among them is the comedian Jonathan Winters, an art student\
    \ long ago, and the English artist Ralph Steadman, whose accomplishments include\
    \ the appropriately harrowing illustrations for Hunter Thompson’s Fear and Loathing\
    \ books. And Steadman and I have come to know and like each other on account of\
    \ Joe. Yes, and last July (2004) there was an exhibition of Joe’s and my stuff,\
    \ arranged by Joe, at the Indianapolis Art Center in the town of my birth. There\
    \ was also a painting by my architect and painter grandfather Vonnegut, and two\
    \ by my architect and painter father Kurt Vonnegut, and six apiece by my daughter\
    \ Edith and my son doctor Mark.\n\nRalph Steadman heard about this family show\
    \ from Joe and sent me a note of congratulation. I wrote him back as follows:\
    \ “Joe Petro III staged a reunion of four generations of my family in Indianapolis,\
    \ and he had made you and me feel like first cousins. Is it possible that he is\
    \ God? We could do worse.”\n\nOnly kidding, of course.\n"
  mdcn: '

    作家。我不认为我能控制我的生活或我的写作。我所认识的每一位作家都觉得自己是在掌握自己的航向，而我没有那种感觉。我没有那种控制力。我只是在“生成”。


    我所想做的只是给人们带来大笑的解脱。幽默可以是一种解脱，就像一片阿司林片。如果百年后人们仍然在大笑，我一定会感到欣慰。


    # 我向所有与我孙子同龄的人道歉。读到这里的的你们许多人可能也和我孙子一个年纪了。他们和你们一样，正被我们婴儿潮一代的公司和政府狠狠地剥削和欺骗。


    是的


    丹，那是我那个糟糕的叔叔，他说一个男人如果没有打过仗，就不能算真正的男人。


    但我有一个很好的叔叔，我已故的阿克斯叔叔。他是我父亲的弟弟，一个哈佛大学的长大的毕业生，在印第安纳利斯是一名诚实的人寿保险销售员。他博学而睿智。他对其他人类主要的抱怨是，人们很少注意到自己快乐的时刻。所以，当我们夏天在苹果树下喝着柠檬水，懒洋洋地聊着这个那个，像蜜蜂一样嗡嗡作响时，阿克斯叔叔会突然断欢快的闲谈，抢话道：“如果这都不算好，我不知道什么才好。”


    所以我现在也这样做，我的孩子和孙辈也是如此。我敦促你们，请在快乐时注意，并在某一点大喊或低语：“如果这都不算好，我不知道什么才好。”


    **我们出生时并没有想象力。** 它必须由老师、父母来培养。曾几何时想象力非常重要，因为它是主要的娱乐来源。在1892年，如果你七岁，你会读一个故事——一个非常简单的故事——关于一个狗死的女孩。这难道不想让你哭吗？你不知道小女孩的感受吗？你还会读另一个关于一个富翁滑到香蕉皮上的故事吗？这难道不想让你笑吗？这种想象力电路正在你的脑海中建立。如果你去画廊，那里只有一个涂着油漆的正方形，那已经几百年没动过了。它没有发出任何声音。


    想象力电路被教会对最细微的暗示做出反应。一本书是二十六个语音符号、十个数字和每个标点符号的排列，人们可以扫视这些，想象出维苏威火山的爆发或沃卢战战。但老师和父母不再需要建立这些电路了。现在有专业制作的节目，有伟大的演员、极具说服力的布景、声音、音乐。现在有了信息高速。我们对电路的需求并不比对知道如何骑马的需求更迫。我们这些建立了想象力电路的人，可以看着某人的脸看到里面的故事；而对其他人来说，一张脸只是一张脸。


    在这里，我刚刚用了一个分号，而我在开头时告诉过你们永远不要用。这样做是为了说明我确实这么做了。要点是：规则只能带我们走多远，即使是好的规则也是如此。


    **我一生中见过的最智慧的人是谁？** 当然是一个男人，虽然其实不必是。他是平面艺术家索尔·斯坦伯格（Saul Steinberg），他像我认识的其他人一样，我可以问他任何问题，六秒钟过去，然后他会给我一个完美的答案，语气粗鲁，几乎像是在咆哮。他出生在罗马尼亚的一栋房子里，根据他的说法，“鹅子正盯着窗户往里看。”


    我说：“索尔，我应该对毕加索什么感觉？”


    六秒钟过去，然后他说：“上帝把他放在地球上，是为了让我们看看真正有钱是什么样子。”


    我说：“索尔，我是一个小说家，我的很多朋友也是小说家，而且是很优秀的，但当我们交谈时，我总觉得我们处于两个完全不同的行业中。是什么让我产生了这种感觉？”


    六秒钟过去，然后他说：“非常简单。艺术家有两种，其中一种并不比另一种优越。但一种回应的是其艺术到目前的历史，而另一种回应的是生命本身。”


    我说：“索尔，你天有异禀吗？”


    六秒钟过去，然后他低吼道：“不，但你在任何艺术作品中感应到的，是艺术家与其局限性的斗争。”


    > 被钉在十字架上的地球，

    > 如果它能找到声音

    > 和一种讽刺感，

    > 现在也许完全可以

    > 说它遭受的对待：

    > “父啊，原恕他们吧，

    > 他们不知道他们所为的。”


    这种讽刺在于

    > 我们知道自己

    > 正在做什么。


    当最后一个的生物

    > 因为我们而死去时，

    > 那将多么诗意

    > 如果地球漂浮起来

    > 伴随着一个浮起的声音

    > 也许

    > 来自大峡谷

    > 的谷底

    > “大成了。”

    > 人们不喜欢这里。


    # 作者注记


    散落在书中的各处的满页手写声明，如果你愿意，可以称它们为“适合装框的样本”，是折纸快递公司（Origami Express）产品的图片，这是我和乔·彼特罗三世（Joe
    Petro III）的一项业务伙伴关系，总部位于肯塔基州莱克星顿乔的绘画和丝网印刷工作室。我画画或画画，乔则对它们制作印品，一张一张，一种颜色一个颜色，通过这种耗时的、过时的丝网工艺——现在几乎没有人再使用这种工艺了：用刮板将墨水透过布挤在纸上。这个过程是如此艰辛且富有触感，几乎像芭蕾一样。


    所以我现在也这样做，我的孩子和孙辈也是如此。我敦促你们，请在快乐时注意，并在某一点大喊或低语：“如果这都不算好，我不知道什么才好。”

