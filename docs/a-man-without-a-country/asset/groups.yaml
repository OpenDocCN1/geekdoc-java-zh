    I got to know one socialist of their generation—Hapgood of Indianapolis. He was
    a typical Hoosier idealist. Socialism is idealistic. Hapgood, like Debs, was a
    middle-class person who thought there could be more economic justice in this country.
    He wanted a better country, that''s all.


    After graduating from Harvard, he went to work as a coal miner, urging his working-class
    brothers to organize in to get better pay and safer working conditions. He also
    led protesters at the execution of the anarchists Nicola Sacco and Bartolomeo
    Vanzetti in Massachusetts in 1927.


    Hapgood''s family owned a successful cannery in Indianapolis, and when Powers
    Hapgood inherited it, he turned it over to the employees, who ruined it.'
