    **Do you know what a twerp is? When** I was in Shortridge High School in Indianapolis
    65 years ago, a twerp was a guy who stuck a set of false teeth out his butt and
    bit the buttons off the back seats of taxicabs. (And a snarf was a guy who sniffed
    the seats of girls'' bicycles.)


    And I consider anybody twerp who hasn''t read the greatest American short story,
    which is “Occurrence at Owl Creek Bridge,” by Ambrose Bierce. It isn''t remotely
    political. It is a flawless example of American genius, like “Sophisticated Lady”
    by Duke Ellington or the Franklin stove.


    I consider anybody twerp who hasn''t read **Democracy in America** by Alexis de
    Tocqueville. There can never be a better book than that one on the strengths and
    vulnerabilities inherent in our form of government.


    Want a taste of that great book? He said, and he said 169 years ago, that in no
    country other than ours have of money taken a stronger hold on the affections
    of men. Okay?


    The French-Algerian writer Albert Camus, who won a Prize for Literature in 1957,
    wrote, “There is but one truly serious philosophical problem, and that is suicide.”


    So there''s another barrel of laughs from literature. Camus died in an automobile
    accident. His days: 1913-1960 A.D.


