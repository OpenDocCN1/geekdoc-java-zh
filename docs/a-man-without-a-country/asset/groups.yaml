    writer. I don’t think I can control my life or my writing. Every other writer
    I know feels he is steering himself, and I don’t have that feeling. I don’t have
    that sort of control. I’m simply becoming.


    All I wanted to do was give people the relief of laughing. Humor can be a relief,
    like an aspirin tablet. If a hundred years from now people are still laughing,
    I’d certainly be pleased.


    # I apologize to all of you who are the same age as my grandchildren. And many
    of you reading this is probably the same age as my grandchildren. They, like you,
    being royally shafted and lied to by our Baby Boomer corporations and government.


    Yes


    Dan, that was my bad uncle, who said a male cant be a man unless he’d gone to
    war.


    But I had a good uncle, my late Uncle Alex. He was my father’s kid brother, a
    childish graduate of Harvard who was an honest life-insurance salesman in Indianapolis.
    He was well-read and wise. And his principal complaint about other human beings
    was that they seldom noticed when they were happy. So when we were drinking lemonade
    under an apple tree in the summer, say, and talking lazily about this and that,
    almost buzzing like honeybees, Uncle Alex would suddenly interrupt the agreeable
    blather to reclaim, “If this isn’t nice, I don’t know what is.”'
  - '[PAGE 82]


    So I do the same now, and so do my kids and grandkids. And I urge you to please
    notice when you are happy, and exclaim or murmur at some point, “If this isn’t
    nice, I don’t know what is.”


    **We are not born with imagination.** It has to be developed by teachers, by parents.
    There was a time when imagination was very important because it was the major
    source of entertainment. In 1892 if you were a seven-year-old, you read a story—just
    a very simple one—about a girl whose dog had died. Doesn''t that make you want
    to cry? Don''t you know how little girls feels? And you''d read another story
    about a rich man slipping on a banana peel? Doesn''t make you want to laugh? And
    this imagination circuit is being built in your head. If you go to an art gallery,
    here''s just a square with daubts of paint on it that haven''t moved in hundreds
    of years. No sound comes out of it.


    The imagination circuit is taught to respond to the most minimal of cues. A book
    is an arrangement of twenty-six phonetic symbols, ten numerals and each punctuation
    mark, people can cast their eyes over these and envision the eruption of Mount
    Vesuvius or the Battle of Waterloo. But it''s no longer necessary for teachers
    and parents to build these circuits. Now there are professionally produced shows
    with great actors, very convincing sets, sound, music. Now there''s the information
    highway. We don''t need the circuits more than we need to know how to ride horses.
    Those of us who had imagination circuits built can look in someone''s face and
    see stories there; to everyone else, a face will just be a face.


    And there, I''ve just used a semi-colon, which at the outset told you never to
    use. It is to make a point that I did it. The point is: Rules only take us so
    far, even good rules.


    **Who was the wisest person I ever met in my entire life?** It was a man, of course
    it needn''t have been. It was the graphic artist Saul Steinberg, who like everybody
    else I know, I could ask him anything, and six seconds would pass, and then he
    would give me a perfect answer, gruffly,'
  - '[PAGE 83]


    almost a growl. He was born in Romania, in a house where, according to him, “the
    geese looked in the windows.”


    I said, “Saul, how should I feel about Picasso?”


    Six seconds passed, and then he said, “God put him on Earth to show what it''s
    like to be really rich.”


    I said, “Saul, I am a novelist, and many of my friends are novelists and good
    ones, but when we talk I keep feeling we are in two very different businesses.
    What makes me feel that way?”


    Six seconds passed, and then he said, “It''s very simple. There are two sorts
    of artists, one not being in the least superior to the other. But one responds
    to the history of his or her art so far, and the other responds to life itself.”


    I said, “Saul, are you gifted?”


    Six seconds passed, and then he growled, “No, but what you respond to in any work
    of art is the artist’s struggle against his or her limitations.”'
