    We met in Indianapolis after the end of the Second World War. He had become an
    official in the CIO. There had been some sort of dust-up on a picket line, and
    he was testifying about it in court, and the judge stops everything and asks him,
    “Mr. Hapgood, here you are, you''re a graduate of Harvard. But would anyone want
    with your advantages choose to live as you have?” Hapgood answered the judge:
    “Why, because of the Sermon on the Mount, sir.”


    And again: Hooraj for our team.


    I am from a family of artists. Here I am, making a living in the arts. It has
    not been a rebellion. It''s as though I had taken over the family Esso station.
    My ancestors were all in the arts, so I''m simply making my living in the customary
    way.


    But my father, who was a painter and an architect, was so hurt by the Depression,
    he was unable to make a living, that he thought I should have nothing to do with
    the arts. He warned me away from the arts because he found them so useless as
    a way of producing money. He told me I could go to college only if I studied something
    serious, something practical.


    As an undergraduate at Cornell I was a chemistry major because my brother was
    a big-shot chemist. Critics feel that a person cannot be a serious artist and
    also had a technical education, which I had. I know that customarily English departments
    in universities, without knowing what they''re doing, teach dread of the engineering
    department, the physics department, and the chemistry department. And this fear,
    I think, is carried over into criticism. Most of our critics are products of English
    departments and are very suspicious of anyone who takes an interest in technology.
    So, anyway I was a chemistry major, but I''m always winding up as a teacher in
    English departments, so I brought scientific thinking to literature. There''s
    very little gratitude for this.


    I became a so-called science fiction writer when someone decreed that I was a
    science fiction writer. I did not want to be classified as one, so I wondered
    in what way I''d offended that I would not get credit for being a serious writer.
