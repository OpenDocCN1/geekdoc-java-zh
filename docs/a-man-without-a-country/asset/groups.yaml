    在他们还在奴隶时代时，这是一份巨大的礼物，以至于现在几乎是少数外国人仍然稍微喜欢我们的唯一原因了。这种针对全球抑郁症流行的特定良方，是一种被称为“蓝调”（the
    blues）的礼物。今天所有的流行音乐——爵士、摇摆、比波、埃尔维斯·普雷斯利、披士、滚石乐队、摇滚、嘻哈等等——都源自蓝调。


    送给世界的礼物？我听过的最好的节奏蓝调组合之一，是来自芬兰的三个男人和一个女孩在波兰克拉科夫的一个俱乐部里表演。


    伟大的作家阿尔伯特·默里（Albert Murray）是一位爵士历史学家，也是我的朋友。他告诉我，在这个国家的奴隶时代——一段我们永远无法恢复回的暴行——奴隶主的人均自杀率远高于奴隶。


    默里认为这是因为奴隶有一种应对抑郁症的方法，而白人主主们没有：他们可以通过演奏和歌唱蓝调来击退“自杀老头子”。他说还有一句话听起来也对。他说蓝调不能把抑郁症赶出房子，但可以把它赶进任何播放蓝调的房间角落。请记住这一点。


    外国人因为我们的爵士乐而爱我们。他们并没有因为我们所谓的“人人享有正义”而恨我们。他们现在恨我们是因为我们的傲慢。


    ## 当我在印第安纳利斯上小学，在詹姆斯·惠特康布·莱利43号学校时，我们过去经常画未来的房子、未来的船、未来的飞机，那里到处有所有对未来的梦想。当然，在当时一切都停滞了。那个魔咒是“繁荣”。繁荣终会来的。我们正在为此做准备。我们梦想着人类应该居住的那种房子——理想的居所，理想的交通工具。


    今天根本性的变化在于，我的女儿莉莉（Lily）刚满二十一岁，她发现自己（作为你们的孩子，作为小小的乔治·W·布什，以及萨达姆·侯赛因等等）正继承了一段令人震惊的近期的人类奴隶史，了一场艾滋病流行病，以及沉睡在冰岛等地峡湾底的核潜艇，这些潜艇的人员随时待命，通过火箭和氢弹弹头，将工业数量的男女老变成放射性烟灰和骨粉。我们的孩子继承了这些技术，这些技术的副产品，无论是在战争还是和平时期，都在迅速破坏整个地球作为一个支持任何生命的可呼吸、饮用水系统。


    任何学过科学并与科学家交流过的人注意到，我们现在正处于极危险之中。人类，过去和现在，都把这个地方搞砸了。


    现在必须面对的最大事实——这可能会让我余生都显得很幽默——是我认为人们根本不在乎地球是否毁灭。在我看来，每个人似乎就像酒精成者互助会的成员一样，日复一日地生活。再过几天就足够了。我认识极少有人在为他们的孙辈梦想一个世界。


    许多年前，我曾如此天真，甚至仍然认为我们可能成为我那一代许多人曾经梦想过的那种充满人性化且理性的美国。在大萧条期间，在没有工作的时候，我们梦想着这样的美国。然后在第二次世界大战期间，在没有和平的时候，我们为了那个梦想战斗并牺牲。


    但现在我知道，美国变得人性化和理性的机会根本没有。因为权力腐蚀我们，绝对的权力绝对地腐蚀我们。人类是醉于权力的黑猩猩。说我们的领导人是醉于权力的黑猩猩，会破坏我们在中东战斗和死去的士兵的士气吗？他们的士气，就像许多没有生命的躯体一样，已经支离破碎。他们被对待的方式，正如我从未被对待过那样，就像富孩子圣诞节收到的玩具一样。


    一位著名的美国人说过的最聪明、最有体面的祈祷，写给“有关人士”的，且发生在一场巨大的人造灾难之后，那是亚伯拉罕·林肯在宾夕法尼亚州格蒂斯堡的演说，那时的战场还很小。站在山顶马背上的男们可以看清全貌。因果关系很简单。因是火药，一种硝酸钾、木炭和硫磺的混合物。果是飞行的金属。或者是刺刀。或者是步枪枪托。亚伯拉罕·林肯对格蒂斯堡那片沉默的杀戮场说道：


    > 我们无法奉献——我们无法祝圣——我们无法神圣这片土地。

    > 在此奋斗的生死的勇士，已经神圣了它，这远超了我们增加或减少的微薄力量。


    诗意！在战争时期仍然可能让恐怖和悲伤看起来几乎是美丽的。美国人在想到战争时，仍然可以对荣誉和尊严产生幻觉。人类那种……你懂的那个东西的幻觉。我称其为：“那个东西”。


    允许我顺带提一句，我在这一节写的字数已经超过了林肯《格蒂斯堡演说》全文的一百多个字。我说话啰嗦。


    无论是通过老式的设备还是来自大学的新奇装置，杀害工业数量毫无防备的人类家庭，以期望获得军事或外交优势，这终究可能并不是个好主意。


    这灵验吗？

    它的追随者、它的粉丝（如果我可以这样称他们的话）假设，我们认为不便的政治实体领导人，或者对自己的人民感到怜悯。如果他们看到或至少听到看起来、说话起来像他们自己的、恐惧的妇女、孩子和老人，甚至可能是亲属，他们会被哭泣所击垮。据我理解，这个理论是这样的。


    任何相信这些的人完全可以进一步，把圣诞老人和牙仙变成我们外交政策的图腾。


    当我们我们需要他们时，马克·吐温和亚伯拉罕·林肯现在在哪里？他们是来自乡下的男孩，他们都曾让美国人嘲笑自己并欣赏真正重要的东西。想象一下他们今天会说什么。


