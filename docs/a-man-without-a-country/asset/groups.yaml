    # 1


    **小时候我是我家里最小的成员**，而且任何家庭里的最小的孩子总是是个笑话制造者，因为笑话是他进入成人对话的唯一方式。我姐姐比我大五岁，哥哥比我大九岁，我的父母都是健谈的人。所以当我很小时，在餐桌旁，我对其他人来说是很无聊的。我很小时，在餐桌旁，我对所有人来说都很无聊。他们不想听我关于学校或大学时的那些无聊的话。我进入对话的唯一方式就是说点幽默。当我试图表现得幽默一点时，我发现，进入成人对话的唯一方式就是说点幽默。


    我是在幽默感很棒的时代长大的。在那个时代，幽默是极佳的。我并不是在试图去冒犯任何人。我听了很多幽默。当我试图表现得幽默一点时，我发现，进入成人对话的唯一方式就是说点幽默。


