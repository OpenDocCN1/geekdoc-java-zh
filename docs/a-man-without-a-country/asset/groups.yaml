    迈克尔·摩尔电影《华氏温度911》（*Fahrenheit 9/11*）标题模仿了雷·布拉德伯里伟大科幻小说《华氏温度451》（*Fahrenheit 451*）的标题。华度四百五十一度是燃点。


    谈到焚书的话题，我想向图书员们表示祝贺。他们并非因体力出、强大的政治关系或巨额财富而闻名，但在全国范围内，他们坚定地抵制了反民主的霸凌者。这些霸凌者试图从书架上移除某些书籍，图书员们宁愿毁记录也不愿向思想警察透露借阅这些书目的人员。


    因此，我所爱的美国依然存在，尽管它不在白宫、最高法院、参议院、众议院或媒体中。我所爱的美国依然存在于我们公共图书馆的前台。


    还是回到书的话题：我们的日常新闻来源，报纸和电视，现在是如此懦弱、对美国人民如此警觉、如此匮乏信息，以至于只有在书中，我们才能得知究竟发生了什么。


    我举一个例子：克雷格·昂格（Craig Unger）在2004年初出版的《布什家族，沙特家族》（*House of Bush, House of Saud*），那是令人羞辱、可耻且血流成河的一年。关于任何事情的好消息都结束了。我们星球的免疫系统试图清除人类。这确实是这样做的方法。KV

    04年11月3日 晨6点


    # 10


    几年前，一位来自伊普西兰蒂（Ypsilanti）的感性女人给我写了信。她知道我也很快，也就是说，我是弗兰克林·德拉诺·罗斯福传统的终身北方民主党人，是工人阶级的朋友。她快要生孩子了——不是我的——她想知道把这样一个甜美纯洁的生物带到这样一个糟糕的世界里是否是一件坏事。


    她写道：“我很想听听一个43岁女性的想法，她终于要妈妈了，但又对在这个如此可怕的世界带入新生命感到戒备。”


    别这么做！我想这样告诉她。那可能是另一个乔治·W·布什或卢克雷齐亚·波尔吉亚。这孩子出生在一个即使是穷人都肥胖的社会里是幸运的，但出生在一个没有全民医疗计划，或没有为大多数人提供体面公共教育的社会——在那里死刑和战争是娱乐的形式，而上大学要花掉一层层肉——那是不幸的。如果这孩子是加拿人、瑞典人、英国人、法国人或德国人，情况就不此了。所以要么继续采取安全的性行为，要么移民。


    但我回复说，除了音乐之外，让我觉得活着几乎有意义的，是我遇到的所有圣人，他们可能无处不在。通过我遇到的圣人，我看到了在一个格格不入的社会里表现得体面的人。


    来自匹兹堡堡（Pittsburg）的年轻人乔走到我面前，提了一个请求：“请告诉我一切都会好的。”


    “欢迎来到地球，年轻人，”我说，“夏天热，冬天冷。它是圆的、潮湿的、拥挤的。从表面上看，乔，你在这里大约能活一百。我只知道一条规则：见鬼，乔，你必须善良！”


    西雅图的一位年轻人最近给我写了信：


    前几天，我被要求在机场安检处执行现在已很常见的脱鞋动作。当我把鞋子放在托盘里时，一种彻底荒诞的感觉席卷了我。我必须脱掉鞋并让X光机扫描，因为某个古怪的家伙试图用他的运动鞋炸掉一架客机。我想，我觉得自己身处一个连库特·冯内格特（Kurt
    Vonnegut）无法想象的世界里。既然我发现我可以向你问这样的问题，告诉我，你能想象到吗？（如果有人发现如何制造爆炸裤子，我们就真的大麻烦了。）


