    为了开拓吗？这些人也没有被迫参与过任何大屠杀和种族灭绝，而正是这些行为为他们开辟了这片处女大陆。而这些毫无罪感的人，在工作时说英语，家里说德语，不仅建立了成功的企业（最引人注目的是在印第安波利斯、密尔沃基、芝加哥和辛辛那），还建立了自己的银行、音乐厅、社交俱乐部、健身房、餐厅、豪宅和夏别墅，让盎格鲁人不禁怀疑——而且理理由充分，我必须说，“这地方到底是谁的国家？”


    我们来到地球就是为了胡乱玩耍。不要让任何人告诉你说不同的说法。


    # 6


    我曾被称为鲁德分子。

    我欢迎这个称呼。


    你知道什么是鲁德分子吗？就是一个讨厌新奇玩意儿的人。内德·鲁德（Ned Ludd）是19世纪初英国的一纺织工人，他破坏了许多新机器——那些将让他失业的机械织布机，那些让他无法凭借自己的特殊技能为家庭提供食物、衣物和住所的机器。1813年，英国政府以“破坏机器”（当时是这么说的）为名，处刑了十七名男子，这是一项死罪。


    今天，我们有诸如装备了波神导弹、弹头装有氢弹的核潜艇之类的玩意儿。我们还有诸如电脑欺骗你让你成功的玩意儿。比尔·盖斯说：“等你能看到你的电脑能变成什么吧。”但你应该应该是那个“变成”的人，你天生要成为那个奇迹，通过你所做的工作成就你天生要成就。


    进步带走了我身上的热气。它带走了两年前对内德·鲁德来说，一台织布机可能意味着什么。我的意思是，打字机。现在任何地方再也没有这种东西了。顺便说一下，《哈克贝瑞·芬》是第一个用打字机打印的作品。


    在很久以前，就在不久前，我以前还打字。当我写完大约二十页后，我会用铅笔在上面做标记并进行修改。然后我会给卡罗尔·阿特金斯（Carol Atkins），她是一个打字员。你能想象吗？她住在纽约州的伍德斯托克，你知道那里是60年代著名的“性与毒品时代”的得名地（实际上发生在附近的贝塞尔镇，任何说记得住在那儿的人都是）。所以我会给卡罗尔打电话，说：“卡罗尔，你好吗？背还好吗？抓到鸟了吗？”我们会来回聊天——我喜欢和人聊天。


    她和她的丈夫一直试图吸引蓝鸟，如你所知，如果你尝试吸引蓝鸟，你会把蓝鸟巢放在离地面三英尺的地方，通常在物业边界的栅栏上。为什么那里会有蓝鸟我不知道，那是运气，我在乡下的房子里在那里也不知道。总之，我们聊着聊，最后我说：“嘿，你知道我这儿有几页纸了。你还在打字吗？”她很肯定：“而且我知道它会非常整洁，看起来就像是电脑做的一样。”我说：“我希望它们不会在邮寄过程中丢失。”她说：“邮件里从不会丢失任何东西。”事实这确实是我的经历。我从未丢过任何东西。所以，她现在成了一个内德·鲁德分子。她的打字一文不值。


    总之，我拿了那些纸，我手里有一个用钢制成的东西，叫订书针，我把纸张装在一起，当然还仔细地给它们了了号。所以我下楼脱衣服，遇到了我的妻子，摄影记者吉尔·克雷门茨（Jill
    Krementz），她当时正醉得很厉害，现在技术含量更高了。她大声问：“你要去哪儿？”她小时候最喜欢的读物是《南西·侦探》系列，你知道的，那个女孩侦探。所以她忍不住问道：“你要去哪儿？”我说：“我要出去买个信封。”她说：“好吧，你又不穷。你为什么不买一千个封呢？他们会送货，你可以把它们放进衣柜里。”我说：“闭嘴。”


    于是我走下楼梯，在纽约市第48街，位于第二大道和第三大道之间，我走到街对面的那家报刊亭，那里卖杂志、彩票和文具。我对他们的存货非常熟悉，于是我拿了一个信封，一个牛皮封。就好像制作那个信封的人知道我用的是什么尺寸的纸一样。我排了队，因为有人在买彩票、糖果之类的东西，我和他们聊天。我说：“你们认识有人中彩票吗？”“你的脚怎么了？”


    最后我走到了队首。这家店的主人是印度教徒。柜台后的女人额头间点着一颗宝石。这难道不很奇特吗？我问她：“最近有大额彩票奖主吗？”然后我付了信封的钱。我把手稿放进去。信封有两个小金属插销，用来穿过封口上的孔。对于那些没见过的人来说，封牛皮封有两种方法。我两种都用了。首先，我舔了润胶水——这种感觉很性感。我把薄金属片穿过孔——我从不知道他们管那叫什么。然后我把封口粘好。


