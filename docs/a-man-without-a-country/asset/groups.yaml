    Yes, and Ignaz Semmelweis also believed that germs could cause diseases. He was
    horrified when he went to work for a maternity hospital in Vienna, Austria, to
    find out that one mother in ten was dying of child fever.


    These poor people—rich people still had their babies at home. Semmelweis observed
    hospital routines, and began to suspect that doctors were bringing the infection
    to the patients. He noticed that the doctors often went directly from dissecting
    corpses in the morgue to examining mothers in the maternity ward. He suggested
    as an experiment that the doctors wash their hands before touching the mothers.


    What could be more insulting? How dare he make such a suggestion to his social
    superiors? He was a nobody, he realized. He was out of town, with no friends and
    protectors among the Austrian nobility. But all that dying went on and on, and
    Semmelweis, having far less sense about how to get along with others in this world
    than I would have, kept on asking his colleagues to wash their hands.


    They at least agreed to do this in a spirit of lampoonery, of satire, of scorn.
    They must have lathered and scrubbed and cleaned under their fingernails.


    The dying stopped—imagine that! The dying stopped. He saved all those lives.


    Subsequently, it might be said that he saved millions of lives—including, yours
    and mine. What did Semmelweis get from the leaders of his profession in Viennese
    society, guessers all? He was forced out of the hospital and out of Austria itself,
    whose people he had served so well. He finished his career in a provincial hospital
