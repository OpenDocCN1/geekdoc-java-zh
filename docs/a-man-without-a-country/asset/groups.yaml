    “看了，这确实帮我记起了伟大的英国社会主义思想者乔治·伯纳德·肖（George Bernard Shaw）关于这个星球的话。”


    “他说什么？”


    “他说：‘我不知道月球上有没有人，但如果有，他们一定把地球当作了疯人院。’他指的不是细菌或大象。他指的是我们人类。”


