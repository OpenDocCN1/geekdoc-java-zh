    Are Origami’s pictures any good? Well, I asked the now regrettably dead painter
    Syd Solomon, a most agreeable neighbor on Long Island for many summertimes, how
    to tell a good picture from a bad one. He gave me the most satisfactory answer
    I ever expect to hear. He said, “Look at a million pictures, and you can never
    be mistaken.”


    I passed this on to my daughter Edith, a professional painter, and she too thought
    it was pretty good. She said she “could rollerskate through the Louvre, saying,
    ‘Yes, no, no, yes, no, yes,’ and so on.”


    Okay?


    KURT VONNEGUT is among the few grandmasters of American letters, one without whom
    the very term American literature would mean much less than it does. He was born
    in Indianapolis, Indiana, on November 11, 1922. Vonnegut lives in New York City
    and Bridgehampton, New York, with his wife, the author and photographer Jill Krementz.


    To see more of Kurt Vonnegut''s original art, visit www.vonnegut.com.


