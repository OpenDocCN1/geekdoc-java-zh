    那些对宁愿听他们而不听自己的人感到愤怒的权力臆测者。


    是的，伊格纳斯·塞梅尔维斯（Ignaz Semmelweis）也相信细菌会导致疾病。当他去奥地利维也纳的一家产医院工作时，他发现十个母亲中就有一个死于产产热。


    这些可怜的人——富人还在家里生孩子。塞梅尔维斯观察了医院的日常流程，开始怀疑医生将感染带给了病人。他注意到，医生们往往在从停尸间解剖尸体后，直接去产室检查产妇。他建议进行一项实验，让医生在接触产妇之前洗手。


    还有比这更侮辱人的吗？他怎么敢向他的社会地位上级提出这样的建议？他意识到自己是个无名小卒。他身在外地，在奥地利贵族中没有朋友或保护者。但那些死亡仍在持续，而塞梅尔维斯在如何与这个世界的他人相处方面远没有我精明得多，他继续要求同事们洗手。


    他们至少在一种嘲弄、讽刺和轻蔑的精神下同意这样做。他们一定搓了泡沫，反复擦洗，并清理了指甲缝。


