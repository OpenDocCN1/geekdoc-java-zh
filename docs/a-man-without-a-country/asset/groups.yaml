    I am one of America’s Great Lakes people, her freshwater people, not oceanic but
    a continental people. Whenever I swim in an ocean, I feel as though I am swimming
    in chicken soup.


    Like me, many American socialists were freshwater people. Most Americans don’t
    know what the socialists did during the first half of the past century with art,
    with eloquence, with organizing skills, to elevate the self-respect, the dignity
    and political acumen of American wage earners, of our working class.


    That wage earners, without social position or higher education or wealth, are
    of inferior intellect is surely relied by the fact that two of the most splendid
    writers and speakers on the deepest subjects in American history were self-taught
    workmen. I speak, of course, of Carl Sandburg the poet from Illinois, and Abraham
    Lincoln of Kentucky, then Indiana, and finally Illinois. Both, may I say, were
    continental, freshwater people like me. Another freshwater person and splendid
    speaker was the Socialist Party candidate Eugene Victor Debs, a former fireman
    who had been born to a middle class family in Terre Haute, Indiana.


    Hooray for our team!


    “Socialism” is no more an evil word than “Christianity.” Socialism no more prescribed
    Joseph Stalin and his secret police and shattered churches than Christianity prescribed
    the Spanish Inquisition. Christianity and socialism alike, in fact, prescribe
    a society dedicated to the proposition that all men, women, and children are created
    equal and shall not starve.


    Adolf Hitler, incidentally, was a two-fer. He named his party National Socialists,
    the Nazis, Hitler''s swastika wasn''t a pagan symbol, as so many people believe.
    It was a working person''s Christian cross, made of axes, of tools.


    About Stalin''s shattered churches, and in China today: Such suppression of religion
    was supposedly justified by Karl Marx''s statement that "religion is the opium
    of the people." Marx said that back in 1844, when opium and opium derivatives
    were the only effective painkillers anyone could take. Marx himself had taken
    them. He was grateful for the temporary relief they had given him. He was simply
    noticing, and surely not condemning, the fact that religion could also be comforting
    to those in economic or social distress. It was a casual truism, not a dictum.


    When Marx wrote those words, by the way, we hadn''t freed our slaves yet. Who
    do you imagine was more pleasing in the eyes of a merciful God back then, Karl
    Marx or the United States of America?


    Stalin was happy to take Marx''s truism as a decree, and Chinese tyrants as well,
    since seemingly empowered them to put preachers out of business who might speak
    ill of them or their goals.


    The statement also entailed many in this country to say that socialists are antireligion,
