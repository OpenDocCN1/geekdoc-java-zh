    好了，现在让我们开心一下吧。聊聊性爱。聊聊女性。弗洛伊德说他不知道女性想要什么。我知道女性想要什么：有一堆可以聊天。她们想聊什么？她们想聊一切。


    男人想要什么？他们有很多朋友，希望女性不要对他们发气。


    为什么今天有这么多人在离婚？因为我们大多数人不再拥有大家庭了。过去，当男人和女性结婚时，新娘有更多的人可以聊天。新郎有更多朋友可以讲笑话。


    少数美国人，但极少数，仍然拥有大家庭。纳瓦霍人。肯尼迪家族。


    但我们大多数人，如果现在结婚，他们只是给对方多了一个人。新郎多了一个伴侣，但那是一个男人。女性多了一个可以聊一切的人，但那是一个男人。


    现在一对夫妇发生争吵时，他们可能认为是为了金钱、权力或如何养孩子之类的问题。尽管他们没有察觉，他们实际上在对彼此说：“你们的人数不够！”


    一个丈夫、一个妻子和几个孩子并不是一个家庭。这是一个极其脆弱的生存单位。


    我曾在尼日利亚遇到过一个人，那是一个伊拉霍人，他有六百个非常熟悉的亲戚。他的妻子刚生了一个宝宝，这是任何家庭中最好的消息。


    他们打算带宝宝去看所有的亲戚，各种年龄、大小和形状的伊拉霍人。它还会见到更多比它大不了婴儿。每个人都足够大、足够稳定，去抱它、逗它、对它咯咯，并说它是多么漂亮或帅气。


    你不想成为那个婴儿吗？


    我希望我能挥挥手，给每个人一个家庭，让你变成伊拉霍人或纳瓦霍人——或者肯尼迪。


    现在，看看乔治和劳拉·布什，他们认为自己是一对勇敢、干练的小夫妻。他们被巨大的大家庭包围，那是我们人都应该拥有的——法官、参议员、报纸编辑、律师、银行家。他们并不孤单。作为大家庭成员是他们如此舒适的原因之一。从长期来看，我真的希望美国能找到办法为所有公民提供大家庭——一个他们可以依靠的大群体。


    我是一个德国裔美国人，一个追溯到德国人仍然内部通婚时期的纯正血统。1945年当我请求英裔美国人简·考克斯嫁给我时，她的一个叔舅问过她是否真的“想和那些德国人混在一起”。是的，即使在今天，德国裔美国人和英语裔之间也存在着某种类似于圣安德亚斯断层的线条，但随着时间推移变得微弱了。


