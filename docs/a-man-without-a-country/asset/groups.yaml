    这是 B-E 轴。B 代表开始，E 代表熵。好的。不是每个故事都有那种非常、非常漂亮的形状，甚至连计算机都能理解的这种形状[从 G-I 轴的中间画出一条水平线]。


    现在给你们一个营销建议。那些买得起书、杂志和去看电影的人不喜欢听关于贫穷或生病的人的故事，所以让你的故事从这里开始[指向 G-I 轴的顶部]。你会反复看到这个故事。人们喜欢它，而且它没有版权保护。这个故事是“洞中人”，但故事不必非关于一个男人或一个洞。它是：某人陷入了麻烦，然后又脱了出来[画出线条
    A]。线条终点比起点高并不是偶然的。这对读者来说是鼓舞的。


    另一个被称为“男孩遇女孩”，但这不必非关于男孩遇到女孩[开始画线 [开始画线 B]]。它是：某人，一个普通人，在普普通通的一天，遇到了一件完美的事情：“噢，天，今天是我最幸运的一天！”……[线条向下画]。“妈！”……[线条再次向上画]。然后再次站了起来。


    历史上讲述过最受欢迎的故事之一从这里开始[在 B-E 轴下方开始线条 C]。这个沮丧的人是谁？她是一个十五一六岁的女孩，母亲去世了，所以她为什么不会低落呢？她的父亲几乎立刻嫁给了一个可怕的老太，还有两个刻薄的女儿。你们听过吗？


    皇宫要举办一个派对。她必须帮助她的两个继妹和她可怕的继母准备出发，但她自己必须留在家。她现在不是更难过了吗？不，她已经是一个心碎的小女孩了。母亲的去世已经足够了。事情不会比那更糟了。所以，他们都去参加派对了。她的仙女母出现了[画出阶进式的上升]，给了她丝袜、睫毛膏和一种去派对的交通工具。


    当她出现时，她是全场的焦点[线条向上画]。她化了如此浓的妆，以至于她的亲戚甚至认不出她了。然后时钟响了十二声，正如约好的那样，一切都被夺走了[线条向下画]。时钟敲十二下没花多久，所以她跌了下去。她跌到了同样的水平吗？见鬼，绝不。无论之后发生了什么，她都会记得王子曾爱过她，她是全场的焦点。所以她以她显著提高的水平继续往前走，无论发生什么。


