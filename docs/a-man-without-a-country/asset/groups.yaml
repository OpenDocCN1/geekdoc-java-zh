    # 8


    ### 你知道什么是人文主义者吗？


    我的父母和祖父母都是人文主义者，也就是过去所谓的“自由思想者”。因此，作为一名人文主义者，我是在尊重我的祖先，《圣经》说这是一件好事。我们人文主义者努力尽可能表现得体面、公正且富有荣誉，而无对来世的奖励或惩罚任何期待。我的兄弟和姐姐不认为有来世，我的父母和祖父母也不认为有。他们只要活着就足够了。我们人文主义者尽我们所能的努力，通过我们拥有的唯一真正熟悉的抽象概念来服务，那就是我们的社区。


    顺便提一下，我是美国人文主义协会的名誉主席，继承了已故伟大的科幻小说作家艾萨克·阿西莫夫，一个完全没有实权的职位。几年前，我们为艾萨克举行了追悼活动，我在会上发言时，在一个时刻说：“艾萨克现在在天堂上。”这是我对一群人文主义者观众能说的最幽默的话。我逗得他们在过道里笑翻了。几分钟后才恢复秩序。如果我真的去世了（上帝保佑），我希望你们会：“库特现在在天堂上。”这是我最喜欢的笑话。


    人文主义者对耶稣怎么看？如果我说耶稣，像所有人文主义者那样所说：“如果他说的话是好的，而且其中许多内容是绝对美丽的，那么他是不是上帝又如何？”


    但如果基督没有传讲《山上之道》，传递慈悲和怜悯的信息，我将不想做人类了。


    我宁愿当一条响蛇。


    在过去的一百万年里，人类对几乎所有事情都不得不进行猜测。我们历史书中的主要人物是我们最引入胜、有时也最令人恐惧的猜测者。


    我可以列举其中两个吗？


    亚里士多德和希特勒。


    一个是优秀的猜测者，另一个是糟糕的。


    古往来的人类大众，感到自己受教育像我们现在一样不足（而且确实如此），他们几乎没有选择去相信这个猜测者或那一个。


    例如，那些不看好伊凡大帝猜测的俄罗斯人，很可能会被帽子钉在头上。


    我们必须承认，有说服力的猜测者，即使是作为苏联新英雄伊凡大帝，有时也给了我们勇气去忍受我们无法理解的非凡磨难。歉收、瘟疫、火山爆发、死产婴儿——猜测者往往给了我们一种幻觉，即运气好坏是是可以理解的，并且可以以某种智能且有效的方式处理。如果没有那种幻觉，我们可能早就就放弃了。


    但事实上，这些猜测者知道的并不比平民多，有时甚至更少，尤其是当他们给我们一种幻觉，认为我们掌控着自己的命运时。


    长期以来，有说服力的猜测一直一直是领导力的核心，对于到目前的所有人类经验而言如此，因此这个地球上大多数的猜测者尽管突然拥有了所有信息，却希望猜测继续下去，这完全令人惊讶惊讶。现在是他们猜测并被倾听的时间了。今天世界上最响亮、最自傲的无知猜测正发生在华盛顿。我们的领导人已经厌倦了由研究、学术和调查报道投掷给人类的所有坚实信息。他们认为整个国家都厌倦了这些，而他们可能是的。他们想要重新恢复的不是金本位。他们想要更基础的东西。他们想让我们回到“蛇油”本位。


    装好子弹的手枪对监狱或疯人院里的病人以外的每个人都有好处。


    这没错。


    在公共卫生上花费的数百万具有通胀性。


    这没错。


    在武器上花费的数十亿将降低通胀。


    这没错。


    右翼独裁政比左翼独裁政更接近美国理想。


    这没错。


    我们拥有的氢弹弹头越多，随时准备爆炸，人类越安全，后代将继承的世界越好。


