    can without any expectation of rewards or punishments in an afterlife. My brother
    and sister didn''t think there was one, my parents and grandparents didn''t think
    there was one. It was enough that they were alive. We humanists serve as best
    we can with the only abstraction with which we have any real familiarity, which
    is our community.


    I am, incidentally, Honorary President of the American Humanist Association, having
    succeeded the late, great science fiction writer Isaac Asimov in totally functionless
    capacity. We had a memorial service for Isaac a few years back, and I spoke and
    said at one point, "Isaac is up in heaven now." It was the funniest thing I could
    have said to an audience of humanists. I rolled them in the aisles. It was several
    minutes before order could be restored. And if I should ever die, God forbid,
    I hope you will say, "Kurt is up in heaven now." That''s my favorite joke.


    How do humanists feel about Jesus? If I say of Jesus, as all humanists do, "If
    what he says is good, and so much of it is absolutely beautiful, what does it
    matter if he was God or not?


    But if Christ hadn''t delivered the Sermon on the Mount, with its message of mercy
    and pity, I wouldn''t want to be a human being.


