    ![](img/b9aaef9547cb298d0506e23f6f6ee647_34_0.png)


    我刚刚向你们证明了，莎士比亚讲故事的能力和任何阿拉拉帕霍人一样糟糕。


    但《哈姆雷特》被称为杰作是有理由的：因为莎士比亚告诉了我们真相，而在当下的起伏波动中[指着黑板]，人们很少这样告诉我们真相。事实是，我们对生活的了解是如此少，以至于我们根本不知道什么是好消息，什么是坏消息。


    如果我死了——愿上帝保佑——我想去天堂问问上面的某个管家：“嘿，什么是好消息，什么是坏消息？”


    ![](img/b9aaef9547cb298d0506e23f6f6ee647_35_0.png)


    # 4


    我要告诉你们一些消息。


    不，我并没有打算竞选总统，尽管我知道一个句子如果要完整，必须同时有主语和谓语。


    我也不会承认我和孩子睡过觉。但我会说这一点：我的妻子是我睡过的人中老老的一个。


    这里是消息：我要去见布朗和威廉姆森烟草公司（帕尔梅香烟的制造商），开价是十亿美元！从我只有十二岁开始，我就从未抽过除了未过滤帕尔梅香烟以外的任何东西。在包装上，布朗和威廉姆森承诺过会杀了我。


    但我八十二岁了。谢谢你们，你们这群脏老鼠。我最不希望的事情就是在当整个地球最有力的三个人是布什、迪克和科尔森时还活着。


    我们的政府正在进行禁毒战争。这确实比完全没有毒品要好。当年关于禁酒令也是这么说的。你们有没有意识到，从1919年到1933年，制造、运输或销售酒精饮料是绝对违法的，印第安纳州的报纸幽默作家肯·哈巴德曾说：“禁酒令比完全没有酒要好。”


    但听好了：世界上两种最受滥用且破坏性最强的物质都是完全合法的。


    一种，当然是乙醇。而且不是别人，正是乔治·W·布什总统，根据他自己的承认，从他十六岁到四十岁的这段时间里，有很多时候他醉得烂醉如、摇摇欲坠。他说在他四十一岁那年，耶稣出现在他面前，让他戒了酒，停止了灌鼻酒精。


    其他的饮料也让他见过“粉红大象”。


    关于我滥用外国物质的历史，我对海毒因和柯因、LSD之类的一直很胆小，害怕它们会让我彻底崩溃。为了社交合群，我曾和杰里·加西亚以及感恩之死乐队的人一起抽过一次大麻。它似乎并没有产生什么影响，所以我再也没有抽过了。在上帝或什么力量的恩典下，我并不是一个酒鬼，这很大程度上是基因问题。我现在偶尔喝几杯，今晚还会喝。但两杯是我的极限。没问题。


    当然，我是烟烟成瘾而臭名昭著。我一直希望这些东西能杀了我。一头是火，另一头是傻瓜。


    但我可以告诉你们一个：我曾有过一次甚至海毒柯因都无法比拟的快感。那是我拿到第一个驾照的时候——看那边，库特·冯内格特来了！


    我那时的车，一辆斯德贝克，就像今天几乎所有的交通工具和其他机器一样，是由最受滥用、最令人成瘾且破坏性最大的药物驱动的：化石燃料。


    当你到达这里时，甚至当我到达这里时，工业化世界已经无可救药地依赖化石燃料了，而且很快就什么都不剩下了。


    我可以告诉你们真相吗？这就是消息。事实是：我们都是化石燃料的成瘾者，正处于一种否认状态。正如许多即将面临崩溃的成瘾者一样，我们的领导人现在通过犯罪来获取我们剩下的一点东西。


    ## 终结的开始是什么？有些人可能是亚当和夏娃以及苹果，这是一个明显的陷阱。我认为是普罗米修斯，一个神之子，他从宙斯那里偷了火并把它给了人类。神灵非常愤怒，将他链在一块岩石上，让他的背部暴露，让老鹰啄食他的肝脏。“严父无教。”


    事实证明，神灵的做法是正确的。我们的亲属——那些猩猩、橘猴和长臂猿——一直以来相处良好，吃着植物物质，在不到两百年的时间里，主要通过化石燃料维持着健康的生命系统。


    英国人迈克尔·法拉第制造了第一台发电机，七十二年前。


    德国人卡尔·本斯制造了第一辆内燃机汽车，十九年前。


    美国第一口油井是在宾夕法尼亚州的提卢斯维尔，由埃德温·L·德雷克在四十五年前钻的。


    莱特兄弟制造并飞行了第一架飞机，一百一年前。它是汽油驱动的。


    你们想聊聊不可抗拒的快乐吗？


    这是一个陷阱。化石燃料如此容易熄灭！是的，我们现在正触及最后的氧气。所有的光芒即将停止，地球很快将剩下一层头骨和骨架，没有任何机器。


    而且对此无能为力。已经太晚了。


    别破坏气氛，但事实是：我们浪费了地球的资源，包括空气和水，仿佛没有明天一样，所以现在不会有明天了。


