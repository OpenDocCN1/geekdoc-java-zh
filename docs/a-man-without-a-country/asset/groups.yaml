    它的暂定名——或者确切地说，它的非工作标题——是《上帝今天活着》（God Were Alive Today）。嘿，听着，我们是时候感谢上帝了，因为我们处在一个即使是穷人也超重的国家。但布什式的饮食可能会改变这一点。


    关于我那部永远无法完成的小说《上帝今天活着》，主角——一位末日时的单口喜剧演员——不仅谴责了我们对化石燃料的沉迷以及白宫里的那些推波者，还因为人口过剩而反对性交行为。吉尔·伯尔曼（Gil
    Berman）告诉我们：


    > 我已经变成了一个燃烧的阉人。我的节制程度就像那百分之五十的异性恋罗马天教神职人员一样。而且禁欲不是根管治疗。它是太廉价、太方便了。谈谈安全性吧！你之后什么什么都不用做，因为根本没有“以后”。


    > 而当我的脾气——我对我那电视机的称呼——在我面前闪烁着乳房和微笑，并说除了我以外的每一个人今晚都会睡床，这是一场国家紧急情况时，我不得不跑出去买辆车或选民票，或者买一个我可以躲在床下的折叠健身房，我像鬣狗一样大笑。我知道你也知道，成千上万的优秀美国人，包括在座各位在内，今晚都睡不上床。


    > 而我们这些燃烧的阉人还会投票！我期待着那么一天，美国总统——这可不是小人物——可能今晚也睡不上床，从而宣布为“国家中立自豪日”。我们将数以百万计地从自己的衣橱里走出来。挺直肩膀，高昂抬头，在我们在这个对乳房痴迷的民主国家的每一条大街上游行，像鬣狗一样大笑。


    那上帝呢？如果祂今天活着的话？吉尔·伯尔曼说：“上帝将不得不是一个无神论者，因为排泄物已经严重地影响了空调系统，太严重了。”


    我想我们所犯的最严重的错误之一（仅次于作为人本身）可能与时间究竟是什么有关。我们拥有所有工具来把时间像切萨米肠一样切开，时钟和日历，我们给这些切片命名，仿佛我们拥有它们，而且它们永远不会改变——例如，“1918年11月11日上午11:00”——但事实上，它们破碎成碎片或四溜而去的可能性和汞滴一样大。


    那么，第二次世界大战可能不是第一次世界大战的原因吗？否则，第一次大战仍然是极其残忍的、无法解释的荒谬。或者试想一下：有没有可能像巴赫、莎士比亚和爱因斯坦这样看似不可思议的天才，实际上并非超人类，而仅仅是抄袭者，从未来抄袭伟大的作品？


