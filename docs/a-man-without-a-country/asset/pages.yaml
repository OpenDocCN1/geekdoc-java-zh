  md: 'When I got down there to speak, and was so happy about the posters, I learned
    from Joe himself that he painted romantic but scientifically precise pictures
    of wildlife, from which he made silk screen images. He had majored in zoology
    at the University of Tennessee. Yes, and some of his pictures were so appealing
    and informative that they had been used as propaganda by Greenpeace, an organization
    trying, with scant success far, to prevent the murder of species, even our own,
    by the way we live now. And Joe, having shown me the poster and his own work and
    his studio, said to me in effect, “Why don’t we keep going?”


    And so we have, and it seems quite poetic in retrospective that Joe Petro III
    saved my life. I will not explain. I will let it go at.


    We have collaborated on more than two hundred different images, with Joe making
    editions, signed and numbered by me, of ten or more of each of them. The “samplers”
    in this book are not at all representative of our total oeuvre, but are simply
    recent jeux d’esprit. Most of our stuff has been knockoffs of Paul Klee and Marcel
    Duchamp and so on.


    And since we first met, Joe has beguiled others into sending him pictures for
    him to do with what he so loves to do. Among them is the comedian Jonathan Winters,
    an art student long ago, and the English artist Ralph Steadman, whose accomplishments
    include the appropriately harrowing illustrations for Hunter Thompson’s Fear and
    Loathing books. And Steadman and I have come to know and like each other on account
    of Joe.


    Yes, and last July (2004) there was an exhibition of Joe’s and my stuff, arranged
    by Joe, at the Indianapolis Art Center in the town of my birth. There was also
    a painting by my architect and painter grandfather Vonnegut, and two by my architect
    and painter father Kurt Vonnegut, and six apiece by my daughter Edith and my son
    doctor Mark.


    Ralph Steadman heard about this family show from Joe and sent me a note of congratulation.
    I wrote him back as follows: “Joe Petro III staged a reunion of four generations
    of my family in Indianapolis, and he had made you and me feel like first cousins.
    Is it possible that he is God? We could do worse.”


    Only kidding, of course.'
