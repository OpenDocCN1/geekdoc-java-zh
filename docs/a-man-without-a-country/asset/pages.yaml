    **It’s damn hard** to make jokes work. In *Cat’s Cradle*, for instance, there
    are very short chapters. Each one of them represents one day’s work, and each
    one is a joke. If I were writing about a tragic situation, it wouldn''t be necessary
    to make sure the things work. You can''t really misfire with a tragic scene. It''s
    bound to be moving if all the right elements are present. A joke is like building
    a mousetrap from scratch. You have to work pretty hard to make the thing snap
    when it is supposed to snap.


    I still listen to comedy, and there''s not much of that sort around. The closest
    thing is the reruns of Grouch Marx''s quiz, Who Bet Your Life. I''ve known funny
    writers who stopped being funny, who became serious persons and could longer make
    more jokes. I''m thinking of Michael Frayn, the British author who wrote *The
    Ten Men*. He became a very serious person. Something happened in his head.


    Humor is a way of holding off how awful life can be, to protect yourself. Finally,
    you get too tired, and the news is too awful, and humor doesn''t work anymore.
    Somebody like Mark Twain thought life was quite awful but held the awfulness at
    bay with jokes and so forth, but finally he couldn''t do it anymore. His wife,
    his best friend, and two of his daughters died. If you live enough, a lot of people
    close to you are going to die.


    It may be that I am no longer able to joke—that it is no longer a satisfactory
