    Here is a lesson in creative writing.


    First rule: Do not use semicolons. They are transvestite hermaphrodites representing
    absolutely nothing. All they do is show you''ve been to college.


    And I realize some of you may be having trouble deciding whether I am kidding
    or not. So from now on I will tell you when I''m kidding.


    For instance, join the National Guard or the Marines and teach democracy. I''m
    kidding.


    We are about to be attacked by Al Qaeda. Wave flags if you have them. That always
    seems to scare them away, I''m kidding.\nIf you want to really hurt your parents,
    and you don''t have the nerve to be gay, the least you can do is go into the arts.
    I''m not kidding. The arts are not a way to make life. They are a human way of
    making life more bearable. Practicing an art, no matter how well or badly, is
    a way to make your soul grow, for heaven''s sake. Sing in the singer. Dance to
    the radio. Tell stories. Write a poem to a friend, even a lousy poem. Do it as
    well as you possibly can. You will get an enormous reward. You will have created
    something.


    I want to share with something I''ve learned. I''ll draw on the blackboard behind
    me so you can follow more easily [draws a vertical line on the blackboard]. This
