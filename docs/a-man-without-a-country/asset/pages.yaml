  md: '# AUTHOR''S NOTE


    The full-page, hand-lettered statements scattered throughout this book, “samplers
    suitable for framing” if you like, are pictures of products of Origami Express,
    a business partnership between myself and Joe Petro III, with headquarters in
    Joe’s painting and silk-screening studio in Lexington, Kentucky, I paint or draw
    pictures, and Joe makes prints of them, one by one, color by color, by means of
    the time-consuming, archaic silk process, practiced by almost nobody else any
    more: squeegee inks through cloths and onto paper. This process is so painstaking
    and tactile, almost balletic, that each print Joe makes is a painting in its own
    right.


    Our partnership’s name, Origami Express, is my tribute to the many-layered packages
    Joe makes for prints he sends for me to sign and number. The logo for Origami,
    made by Joe, isn''t his picture of a picture I sent him, but of a picture by me
    that he found in my novel Champions. It is of a bomb in air, on its way down,
    with these words written on its side:


    # GOODBYE

    BLUE

    MONDAY


    I have to have one of the luckiest persons alive, since I have for four score
    and two years now. I can’t count all the times I should have been dead or wished
    I were. But one of the best things that ever happened to me, a one-in-a-billion
    opportunity to enjoy myself in perfect innocence, was my meeting Joe.


    Here’s the thing: Back in 1993, almost eleven years ago now, I was scheduled to
    lecture on November 1 at Midway College, a women’s school on the edge of Lexington.
    Well in advance of my appearance, a Kentucky artist, Joe Petro III, son of the
    Kentucky artist Joe Petro II, asked me to do a black-and-white self-portrait,
    which he could use in silk-screen posters to be used by the school. So I did and
    he did. Joe was only thirty-seven back then, and I was a mere spring chicken of
    only seventy-one, not even twice his age.'
