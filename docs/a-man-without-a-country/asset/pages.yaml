  md: 'I think one of the biggest mistakes we’re making, second only to being people,
    has to do with what time really is. We have all these instruments for slicing
    it up like a salami, clocks and calendars, and we name the slices as though we
    own them, and they can never change—“11:00 AM, November 11, 1918,” for example—when
    in fact they are as likely to break into pieces or go scampering off as dollops
    of mercury.


    Might not be possible, then, that the Second World War was a cause of the first
    one? Otherwise, the first remains inexplicable nonsense of the most gruesome kind.
    Or try this: Is it possible that seemingly incredible geniuses like Bach and Shakespeare
    and Einstein were not in fact superhuman, but simply plagiarists, copying great
    stuff from the future?


    On Tuesday, January 20, 2004, I sent Joel Bleifuss, my editor at In Times, this
    fax:


    ON ORANGE ALERT HERE. ECONOMIC TERRORIST ATTACK EXPECTED AT 8 PM EST. KV


    Worried, he called, asking what was up. I said I would tell him when I had more
    complete information on the bombs George Bush set to deliver in his State of the
    Union address.


    That night I got a call from my friend, the out-of-print-science-fiction writer
    Kilgore Trout. He asked me, “Did you watch the State of the Union address?”


    “Yes, and it certainly helped to remember what the great British socialist George
    Bernard Shaw said about this planet."


    “Which was?”


    “He said, ‘I don’t know if there are men on the moon, but if there are, they must
    be using the earth as their lunatic asylum.’ And he wasn’t talking about the germs
    or the elephants. He meant we the people."


    “Okay."


    “You don’t think this is the Lunatic Asylum of the Universe?”


    “Kurt, I don’t think I expressed an opinion one way or the other.”'
