    I used to be the owner and manager of an automobile dealership in West Barnstable,
    Massachusetts, called Saab Cape Cod. It I went out of business thirty-three years
    ago. The Saab then, as now, was a Swedish car, and I now believe my failure as
    a dealer so long ago explains what would otherwise remain a deep mystery: Why
    the Sweden have never given me a Nobel Prize for Literature. Old Norwegian proverb:
    “Swedes have short dicks but long memories.”


    Listen: The Saab then had only one model, a bug like a VW, but with the engine
    in front. Unlike all other cars, but like your lawnmower opening into the slipstream
    and your outboard, it had a two-stroke rather than a four-stroke engine. Every
    time you filled the tank with gas, you had to pour in a can of oil as well. For
    whatever reason, straight women did not want to do this.


    The chief selling point was that a Saab could drag a VW at a stoplight. But if
    you or your significant other had failed to add oil to the last tank of gas, and
    the car would then become fireworks. It also had frontwheel drive, of some help
    on slippery pavements or when accelerating into curves. These had this as well:
    As one prospective customer said to me, “They make the best watches. Why wouldn’t
    they make the best cars, too?” I was bound to agree.


    The Saab back then was a far cry from the sleek, powerful, four-stroke yuppie
    uniform it is today. It was the wet dream, if you like, engineers in an airplane
    factory who’d never made a car before. Wet dream, did I say? Get a load of this:
    There was a ring on the dashboard, connected to a chain running over pulleys in
    the engine compartment. Pull on it, and the far end would raise a sort of window
    shade on a spring-loaded roller behind the front grill. That was to keep the engine
    warm when you went off somewhere. So, when you came back, if you hadn’t stayed
    away too long, the engine would start up again.


    But if you stayed away too long, window shade or not, the oil would separate from
    the gas and sink like molasses to the bottom of the tank. So when you started
    up again, you would lay down a smokescreen like a destroyer in a naval engagement.
    And I actually blacked out the'
