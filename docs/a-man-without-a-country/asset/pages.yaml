    I think that novels that leave out technology misrepresent life as badly as Victorians
    misrepresented life by leaving out sex.


    **In 1968, the year I wrote** *Slaughterhouse Five*, I finally became grown up
    enough to write about the bombing of Dresden. It was the largest massacre in European
    history. I, of course, know about Auschwitz, a massacre is something that happens
    suddenly, the killing of a whole lot of people in a very short time. In Dresden,
    on February 13, 1945, at least 135,000 people were killed by British firebombing
    in one night.


    It was pure nonsense, pointless destruction. The whole city burned down, and it
    was a British atrocity, not ours. They sent in night bombers, and they came and
    set the whole town on fire with a new incendiary bomb. And so everything organic,
    except my little POW group, was consumed by fire. It was a military experiment
    to find out if you could burn down a city by scattering incendiaries over it.


    Of course, as prisoners of war, we dealt-on with dead Germans, digging them out
    of basements because they had suffocated there, and taking them to a huge funeral
    pyre. And I heard—I didn''t see it done—that they gave up this procedure because
    it was too slow and, of course, the city was starting to smell pretty bad. And
    sent in guys with flamethrowers.


    Why my fellow prisoners of war and I weren''t killed I know.


    I was a writer in 1968. I was a hack. I''d write anything to make money, you know.
