    down here—great prosperity, wonderful health up there. Your average state of affairs
    is in the middle [points to bottom, top, and middle of line respectively].


    This is the B-E axis. B for beginning, E for entropy. Okay. Not every story has
    that very, very pretty shape that even a computer can understand [draws horizontal
    line extending from middle of G-I axis].


