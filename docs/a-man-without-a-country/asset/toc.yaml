  - '### 终结的开始是什么？有些人可能是亚当和夏娃以及苹果，这是一个明显的陷阱。我认为是普罗米修斯，一个神之子，他从宙斯那里偷了火并把它给了人类。神灵非常愤怒，将他链在一块岩石上，让他的背部暴露，让老鹰啄食他的肝脏。“严父无教。”'
