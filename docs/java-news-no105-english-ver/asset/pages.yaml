    Seibu Shodoku''s trap that was set on the premises of the apartment


    # The wall of the laid that stands in the way


    Seibu Shodoku is a company that manages the hygiene of facilities and equipment,
    and also exterminates cockroaches, termites, rats, masked palm civets, raccoons,
    etc. that have been regarded as pests and vermin. It is the convenience of human
    beings to treat them as pests and vermin, and of course, the animals are not guilty
    of anything. JAVA aspires to eliminate the sacrifice of any creature. However,
    legally, it is not illegal to extermin the above-mentioned types of animals (the
    extermination of masked palm civet and raccoon requires permission under the law
    regarding wildlife). Therefore, unfortunately, Regrettably JAVA cannot stop Seibu
    Shodoku from doing the business of exterminating these animals.


    # Problems with cat capture


    But when it is catching cats, it is different. If you catch a cat that belongs
    to someone, you are guilty of theft. It is clear that catching a cat violated
    the Act on Welfare and Management of Animals. Furthermore, if it is a domestic
    cat of another person, it is a criminal damage to property. It is said that there
    is a possibility of being considered an “abuse” if the stray cats are caught not
    for the purpose of protection but for the purpose of extermination. Therefore,
    if Seibu Shodoku rents or installs a catcher, Seibu is responsible for taking
    sufficient measures to prevent its client from illegally catching cats.


    # Request to stop entering traps


    JAVA pointed out the problem of catching cats asked Seibu Shodoku to stop the
    rental service of traps. However, Seibu Shodoku responded, “We rent traps for
    the purpose of catching wild animals as permitted by law. We cannot stop the renting
    service of traps.” Therefore, JAVA requested the following measures and improvements
    when renting and installing traps.


    +   1. Do not rent or install traps for any purpose other than catching wild animals
    with legal permission.

    2. Make sure that the purpose of the renter’s use of the trap is not to exterminate,
    abuse or abandon cats before


    JAVA NEWS No. 105 English ver.'
  merge: -1
  pgno: 8
- img_proc: true
  md: 'renting it out.


    +   3. Make all employees aware of the illegality of trapping cats.


    +   4. Before renting the traps, make sure the renter promises to monitor at all
    times when installing and trapping, and not to leave the trap unattended.


    +   5. State the following on the leaflet distributed to the renter.


    +   - Killing, abusing, and abandoning cats are crimes that violate the Act on
    Welfare and Management of Animals.


    +   - Capturing cats may be a violation of the Act on Welfare and Management of
    Animals, or may be considered theft.


    +   - If one accidentally catches a cat, he/she must immediately release it.


    # Response from Seibu Shodoku


    JAVA received a response from Seibu Shodoku promising the above five points.


    It is sad and frustrating to have animals that cannot be prevented. It is difficult
    for our activities to be 100% successful, but we believe we must do what we can
    do to reduce the sacrifices of animals as much as possible.


