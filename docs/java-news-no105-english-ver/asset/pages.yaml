    # Traps being set by a pest extermination company JAVA calls for prevention of
    cat extermination


    In March, residents of Ota Ward, Tokyo, reported to JAVA the following that Seibu
    Shodoku, Ltd. (hereafter referred to as Seibu Shodoku) installed a trap for small
    animals such as weasels on the premises of an apartment in their neighborhood.


    +   - A trap is being placed on the premises of an apartment in their neighborhood
    for a long time.

    - The company name “Seibu Shodoku” and their contact information are written on
    the trap.

    - There are several stray cats living around the apartment, so residents are concerned
    that the trap may be to catch these stray cats.

    - In response to the residents’ inquiry, Seibu Shodoku stated that they do not
    undertake capturing animals, but they do lease traps.'
