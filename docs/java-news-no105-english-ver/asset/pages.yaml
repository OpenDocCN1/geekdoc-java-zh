  md: '# Revised Act on Welfare and Management of Animals went into effect

    “The standards for the appropriate care and management” is currently in development


    Since the fall of 2016, JAVA, Animal Rights Center Japan, and PEACE have engaged
    in activities in

    operation with each other to revise the Act on Welfare and Management of Animals.
    The revised Act on Welfare

    and Management of Animals was enacted on June 12, 2019 and enforced on June 1st
    this year. (Some part

    it is enforced in 2021 or 2022).


    Accordingly, part of the previous regulations became greatly stricter, like “a
    person who was destroyed or

    injured, without animal shall be punished by imprisonment with work for not more
    than

    five years or a fine of not more than five million yen.” instead of “imprisonment
    with work for not more

    two years or a fine of not more than two million yen., and penalty for neglect,
    abuse, or abandonment is

    also stricter like “imprisonment with work for not more than one year or a fine
    of not more than one million

    yen” instead of “a fine of not more than one million yen.” The requirements of
    registration for

    animal handling business became stricter, and regarding specified animals, so-called
    savage beasts, we are not

    allow to keep such dangerous animals as pets any more.


    We announced on the last JAVA NEWS that after the Act on Welfare and Management
    of Animals was

    revised, the related standards and other things also have to be revised or developed,
    and some of them

    already been revised.


    Present discussion and negotiation have been under way in the Ministry of the
    Environment to develop

    “The standards for the appropriate care and management” that animal handling businesses
    needs to

    comply, with the revised Act on Welfare and Management of Animals newly stipulates
    to define.


    This is standard drawing attention. Because, in regard to rearing animal handling
    dealings with

    dogs or cats as such cafes and non-profit organizations as well pet stores and
    breeders, it includes

    rules that regulate the size of animal facilities

    like cages, the number of care-workers and the

    number of births in a lifetime with concrete

    figures. The three organizations, JAVA, Animal

    Rights Center Japan, and PEACE, have been

    working for “the standards for the appropriate

    care and management”, by stating our opinions

    in meetings hosted by political parties or the

    ition of diet members for zero disposal of

    dogs and cats, appealing to the Ministry of

    Environment, and so on.


    ![](img/79c3b76be7dd74cf400d823b4880f024_5_0.png)


    JAVA NEWS No. 105 English ver. 6'
