  md: '# Food and Beverages


    +   - do not conduct animal testing for Food for Specified Health Uses (FOSHU)
    and Food with Functional Claims (FFC) throughout the entire process, from planning
    and designing to search for materials, development, application for permission/notification,
    manufacturing, sales, in some cases, patent application.


    +   - do not conduct animal testing for checking, both functionality and safety.


    +   - do not conduct any animal testing including preliminary experiments.


    +   - do not conduct animal testing in-house, nor outsource to external organizations,
    nor fund for animal testing.


    +   - do not conduct animal testing in basic research and joint research.


    # Cosmetics


    +   - do not conduct animal testing for cosmetics and quasi-drugs throughout the
    entire process, from planning and designing, to searching for ingredients, development,
    making application for approval, manufacturing, sales, in some cases, patent application.


    +   - do not conduct animal testing on manufacturing and marketing approval of
    quasi-drugs, and request to review cosmetics standards.


    +   - do not conduct animal testing in-house, nor outsource to external organizations,
    nor fund for animal testing.


    +   - do not conduct animal testing in basic research and joint research.


    +   - All animal testing mentioned above were totally banned on June 30, 2020.


    *The details of this campaign are posted on the following site.


    https://www.java-animal.org/asahi2020-English/


    Good News!

    The frog dissection class in Setagaya City will be cancelled!


    "Frog dissection" was planned as a summer program for junior high school students,
    hosted by the Education Center in Setagaya city, Tokyo. Parents of students in
    junior high schools asked JAVA to help this frog dissection class.


    # About the Dissection Class


    +   - The science experiment classes are planned as one of the summer programs
    for students of junior high in Setagaya City. The classes take place at the Education
    Center in the city.


    +   - Junior high school teachers in the district give guidance to every class.


    +   - The announcement flyer says:


    JAVA NEWS No. 105 English ver.'
