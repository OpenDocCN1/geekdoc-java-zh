  - '[PAGE 3]


    “Frogs are amphibians, humans are mammals, but we are both vertebrates. Let’s
    learn about the structure and mechanism of the human body from many similarities
    between amphibians and mammals.” “Learn the importance of life and mystery through
    the dissection of frogs.”


    # The Issues of Dissection and Pros of Alternative Method


    It is ethically unacceptable to chop up animal bodies. We cannot learn “the importance
    of life” with cruel acts. As adolescent students attend the dissection classes
    planned by the city, it is possible that they will think chopping up animal bodies
    and killing them are good things.


    There are various ways to learn the mechanism of the animal body without sacrificing
    animals, such as computer simulation, video, elaborate 3D models, and so on. There
    are many advantages of using an alternative method; students can learn the process
    of dissection over and over again; they can proceed at their own pace. Some papers
    suggest that students who learned by methods are superior to students who have
    learned by a dissection.


    By learning the method without the use of animals, students learn ethical attitude:
    such as “Don’t take the living’s life.” “Life is precious.” In other words, in
    order to make students gain knowledge and develop an attitude of respect for life,
    alternative methods instead of dissection should be used.


    # Response: Setagaya’s Decision to Cancel the Dissection Class


    JAVA pointed out the issue of dissection to Mayor, Setagaya City submitted a document
    requesting the cancellation of the dissection class. The members of JAVA and parents
    of junior high students in Setagaya conveyed their opinions to the Mayor.


    On July 31, the Setagaya Board of Education replied to JAVA that they decided
    to cancel the Frog dissection class.


    ![](img/79c3b76be7dd74cf400d823b4880f024_3_0.png)


    # Letters submitted in joint names with overseas groups


    JAVA often tackles issues with overseas animal rights groups. We report here on
    two letters submitted in joint names.


    # Letter about reducing animal testing in drug development


    In June, JAVA and British-based Cruelty Free International (CFI) sent a letter
    titled “Recent report on two-species regulatory toxicology studies, by the UK
    National Centre for the 3Rs (NC3Rs)” to Japan Pharmaceutical Manufacturers Association
    (JPMA) and Pharmaceuticals and Medical Devices Agency (PMDA).


    JAVA and CFI are members of “International Council on Animal Protection in Pharmaceutical
    Programmes (ICAPP) to push forward 3Rs in drug development.'
- md: '

    We sent it because of the contents of the paper “Opportunities for use of one
    species for longer-term toxicology testing during drug development: A cross-industry
    evaluation”, which was issued by UK NC3Rs in February.


    The study in the paper was conducted based on the evaluation of 172 drug candidates
    and an important fact was found that two-thirds of the drug candidates could have
    been developed using just one, instead of two, animal species in longer-term toxicology
    testing.


    So JAVA and CFI gave the information of the paper to both organizations that are
    responsible for the pharmaceutical industry and approval review for newly developed
    drugs in Japan, and we requested them to plan, tackle, argue and develop tests
    by use of one species instead of two and also claimed which would lead to the
    drastic reduction of animal testing before too long.


    ## Letter asking for encouraging animal welfare in the context of EU-Japan Economic
    Partnership Agreement (EPA)


    In July, JAVA, Animal Rights Center Japan, and Eurogroup for Animals, which is
    an animal right group in Belgium, submitted “A Call to Do More for Animals in
    the context of the EU-Japan Economic Partnership Agreement” in their joint names
    to the European Commission and the Ministry of Foreign Affairs of Japan.


    JAVA NEWS No. 104 English ver. already reported that the three groups participated
    the symposium on the EPA hosted by the EU.


    The EPA entered into on February 1, 2019. This agreement provides the EU and Japan
    with the possibility to set up a working group on animal welfare, and to adopt
    a working plan to define priorities in this area of cooperation (Article 18.17.2).
    In the ‘Trade and Sustainable Development’ chapter, parties shall also implement
    effective measures to combat illegal trades in endangered species of wild fauna,
    and exchange information on this topic (Article 16.6.2(b) and (d)).


    As of today, however, the EU and Japan have made no progress in this field. There,
    the three organizations submitted this call, which is one of our efforts to improve
    animal welfare making good use of the EPA.


    ![](img/79c3b76be7dd74cf400d823b4880f024_4_0.png)


    ## Revised Act on Welfare and Management of Animals went into effect

    ### “The standards for the appropriate care and management” is currently in development


    Since the fall of 2016, JAVA, Animal Rights Center Japan, and PEACE have engaged
    in activities in operation with each other to revise the Act on Welfare and Management
    of Animals. The revised Act on Welfare and Management of Animals was enacted on
    June 12, 2019 and enforced on June 1st this year. (Some part it is enforced in
    2021 or 2022).


    Accordingly, part of the previous regulations became greatly stricter, like “a
    person who was killed or injured, without animal shall be punished by imprisonment
    with work for not more than five years or a fine of not more than five million
    yen.” instead of “imprisonment with work for not more two years or a fine of not
    more than two million yen., and penalty for neglect, abuse, or abandonment is
    also stricter like “imprisonment with work for not more than one year or a fine
    of not more than one million yen” instead of “a fine of not more than one million
    yen.” The requirements of registration for animal handling business became stricter,
    and regarding specified animals, so-called savage beasts, we are not allowed to
    keep such dangerous animals as pets any more.


    We announced on the last JAVA NEWS that after the Act on Welfare and Management
    of Animals was revised, the related standards and other things also have to be
    revised or developed, and some of them already been revised.


    Present discussion and negotiation have been under way in the Ministry of the
    Environment to develop “The standards for the appropriate care and management”
    that animal handling businesses needs to comply, with the revised Act on Welfare
    and Management of Animals newly stipulates to define.


    This is standard drawing attention. Because, in regard to rearing animal handling
    dealings with dogs or cats as such cafes and non-profit organizations as well
    pet stores and breeders, it includes rules that regulate the size of animal facilities
    like cages, the number of care-workers and the number of births in a lifetime
    with concrete figures. The three organizations, JAVA, Animal Rights Center Japan,
    and PEACE, have been working for “the standards for the appropriate care and management”,
    by stating our opinions in meetings hosted by political parties or the petition
    of diet members for zero disposal of dogs and cats, appealing to the Ministry
    of Environment.


    ![](img/79c3b76be7dd74cf400d823b4880f024_5_0.png)


    JAVA NEWS No. 105 English ver. 6


    ## Introduction of two videos

    ### We posted a video which doctors and scientists in Germany made with Japanese
    subtitles


    We posted a video “Mini organs and multi-organ-chips Scientific progress without
    animal experiments” made by Doctors Against Experiments on YouTube. They support
    the immediate abolition of all animal experiments. This animated video shows some
    of the possibilities of innovative research based on cells of human origin that
    are scientifically sound. This video is originally written in English. Therefore,
    JAVA translated it to Japanese and put Japanese subtitles on it with the permission
    of Doctors Against Experiments.


    https://youtu.be/ok5Y7thGn


    ![](img/79c3b76be7dd74cf400d823b4880f024_6_0.png)


    ![](img/79c3b76be7dd74cf400d823b4880_1.png)


    ## JAVA’s original videos

    ### The third story is now available


    We have been posting original videos which show problems of animal testing and
    activity of JAVA on YouTube since 2019. The first and second videos are now available
    and the third one is completed in October. The third story “How to do animal testing?
    Examples around us” explains how animal testing is done specifically and appeals
    to unethical animal testing.


    https://youtu.be/CD306Biho


    ![](img/79c3b76be7dd74cf400d823b4880f024_6_2.png)


    ![](img/79c3b76be7dd74cf400d823b4880f024_6_3.png)


    JAVA NEWS No. 105 English ver. 7


    ## Distribution of PR goods


    In November 2018, collaborated with fashion brand “JAMMIN” we sold charity-shirts
    just for one week from which we collected 50,260 Yen (about $530). With money
    we made thousands of pocket tissues with advertisement of JAVA and animal testing.
    In order for people to know about it. gave gave pocket tissues away in front of
    stations, sightseeing areas all over Japan. Although some are left due to the
    postponement and cancellation of events by influence of COVID-19, we managed to
    distribute more than 8,000 pocket tissues.


    Thank you for your cooperation. We really appreciate it.


    ![](img/79c3b76be7dd74cf400d823b4880f024_7_0.png)


    ![](img/79c3b76be7dd74cf400d823b4880f024_7_1.png)


    ![](img/79c3b76be7dd74cf400d823b4880f024_7_2.png)


    ## Traps being set by pest extermination company JAVA calls for prevention of
    cat extermination


    In March, residents of Ota Ward, Tokyo, reported to JAVA the following that Seibu
    Environment Ltd. (hereafter referred to as Seibu Environment) installed a trap
    for small animals such as weasels on the premises of an apartment in their neighborhood.


    - A trap is being placed on the premises of an apartment in their neighborhood
    for long time.

    - The company name “Seibu Environment” and their contact information are written
    on the trap.

    - There are several stray cats living around the apartment, so residents are concerned
    that the trap may be to catch these stray cats.

    - In response to the residents’ inquiry, Seibu Environment stated that they do
    not undertake capturing animals, but they do lease traps.


    ![](img/79c3b76be7dd74cf400d823b4880f024_8_0.png)


    Seibu Environment''s trap that was set on the premises of the apartment


    ## The wall of law that stands in the way


    Seibu Environment is a company that manages the hygiene of facilities and equipment,
    and also exterminates cockroaches, termites, rats, palm civets, raccoons, etc.
    that have been regarded as pests and vermin. It is the convenience of human beings
    to treat them as pests and vermin, and of course the animals are not guilty of
    anything. JAVA aspires to eliminate the sacrifice of any creature. However, legally,
    it is not illegal to exterminate the above-mentioned types of animals (the extermination
    of palm civet and raccoon requires permission under the law regarding wildlife).
    Therefore, unfortunately, regrettably JAVA cannot stop Seibu Environment from
    doing the business of exterminating these animals.


    ## Problems with cat capture


    But when it is catching cats, it is different. If you catch a cat that belongs
    to someone, you are guilty of theft. It is clear that catching a cat violated
    the Act on Welfare and Management of Animals. Furthermore, if it is a domestic
    cat of another person, it is a criminal damage to property. It is said that there
    is a possibility of being considered an “abuse” if the stray cats are caught not
    for the purpose of protection but for the purpose of extermination. Therefore,
    if Seibu Environment rents or installs a catcher, Seibu is responsible for taking
    sufficient measures to prevent its client from illegally catching cats.


    ## Request to stop entering traps


    JAVA pointed out the problem of catching cats asked Seibu Environment to stop
    the rental service of traps. However, Seibu Environment responded, “We rent traps
    for the purpose of catching wild animals as permitted by law. We cannot stop the
    rental service of traps.” Therefore, JAVA requested the following measures and
    improvements:


    1. Do not rent or install traps for any purpose other than catching wild animals
    with legal permission.

    2. Make sure that the purpose of the renter’s use of the trap is not to exterminate,
    abuse or abandon cats.

