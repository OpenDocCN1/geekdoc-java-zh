    我们之所以发送此内容，是因为英国 NC3Rs 在 2 月发布了题为《药物开发过程中利用单一物种进行长期毒理学测试的机会：跨行业评估》的论文内容。


    该论文中的研究基于对 172 种候选药物的评估，并发现了一个重要事实：三分之二的候选药物在长期毒理学测试中可以仅使用一种动物物种而非两种物种进行开发。


    因此，JAVA 和 CFI 将该论文的信息提供给了日本负责制药行业和新开发药物审批审查的两个相关机构，并要求他们计划、应对、辩论并开发使用单一物种而非两种物种的测试方案，同时声称这将在不久后大幅减少动物实验。


    ## 在欧日经济伙伴关系协定（EPA）背景下鼓励动物福利的信函


    7 月，日本动物协会（JAVA）、日本动物权利中心（Animal Rights Center Japan）以及比利时动物权利团体欧洲动物小组（Eurogroup
    for Animals）向欧盟委员会和日本外务省共同名义提交了《在欧日经济伙伴关系协定背景下为动物做更多努力的呼吁》。


    JAVA NEWS 第 104 期英文版已报道，这三个小组参加了由欧盟举办的 EPA 研讨会。


    EPA 已于 2019 年 2 月 1 日生效。该协议为欧盟和日本提供了建立动物福利工作组的可能性，并通过通过工作计划来定义这一合作领域的优先事项（第 18.17.2
    条）。在“贸易与可持续发展”章节中，双方还应采取有效措施打击野生动物濒危物种的非法贸易，并就此主题交换信息（第 16.6.2(b) 和 (d) 条）。


    然而，截至今日，欧盟和日本在该领域尚未取得进展。因此，这三个机构提交了这一呼吁，这是我们利用 EPA 改善动物福利的努力之一。


    ![](img/79c3b76be7dd74cf400d823b4880f024_4_0.png)


    ## 修改后的动物福利管理法已生效

    ### “适当饲养与管理标准”正在制定中


    自 2016 年秋季以来，JAVA、日本动物权利中心和 PEACE 一直开展合作活动以修订《动物福利管理法》。修订后的《动物福利管理法》于 2019 年 6
    月 12 日颁布，并于今年 6 月 1 日施行（部分内容于 2021 年或 2022 年实施）。


    因此，旧法规的部分内容变得严格得多，例如，“杀害或伤害动物的，处五年以下有期徒刑或五万日以下罚款”取代了“处两年以下有期徒刑或两万日以下罚款”；对于忽视、虐待或遗弃的处罚也更加严格，例如“处一年以下有期徒刑或万日以下罚款”取代了“处万日以下罚款”。动物处理业务的注册要求变得更加严格，对于特定动物（即所谓的猛兽），我们不再允许将此类危险动物作为宠物饲养。


    我们在上期 JAVA NEWS 中宣布，《动物福利管理法》修订后，相关的标准和其他内容也必须进行修订或制定，其中一些已经完成。


    目前，环境省正在进行讨论和谈判，以制定动物处理业务需要遵守的“适当饲养与管理标准”，这是新修订的《动物福利管理法》中新规定的。


    这一标准引起了关注。因为对于涉及猫狗的饲养业务（如猫咖啡馆、非营利组织以及宠物店和育种场），标准包含了笼具尺寸、饲养人员人数以及寿命内的数字等具体规定。JAVA、日本动物权利中心和
    PEACE 这三个机构通过在政党举办的会议上发表意见，向议员递请，要求制定“适当饲养与管理标准”。


    ![](img/79c3b76be7dd74cf400d823b4880f024_5_0.png)


    JAVA NEWS 第 105 期英文版 6


    ## 两个视频的介绍

    ### 我们发布了德国医生制作的日语字幕视频


    我们在 YouTube 上发布了由德国医生制作的带有日语字幕的视频《微器官与芯片：动物实验的进展》，他们支持立即废除动物实验。这段动画展示了基于人类细胞的创新研究可能性。该视频原本为英文，因此我们在获得“反对动物实验”组织许可后将其翻译成日语并添加了字幕。


    https://youtu.be/ok5Y7Gn


    ![](img/79c3b76be7dd74cf400d823b4880f024_6_0.png)


    ![](img/823b4880_1.png)


    ## JAVA 的原创视频

    ### 第三集现已上线


    自 2019 年以来，我们一直在 YouTube 上发布展示动物实验问题和 JAVA 活动的原创视频。第一集和第二集已可观看，第三集于 10 月完成。第三集《如何进行动物实验？》解释了动物实验的具体操作，并呼吁停止不伦理的动物实验。


    https://youtu.be/CD306Biho


    ![](img/823b4880_6_2.png)


    ![](img/48806_3.png)


    JAVA NEWS 第 105 期英文版 7


    ## 宣传品的发放


    2018 年 11 月，我们与时尚品牌“JAMMIN”合作销售了一周慈善 T恤，筹集了 50,260 日元（约 530 美元）。用这笔钱，我们制作了印有 JAVA
    和动物实验广告的数千张纸巾让人们了解。我们在日本各地的车站和景点发放了纸巾。尽管受 COVID-19 影响部分活动推迟或取消，我们还是成功发放了 8,000
    张纸巾。


    感谢配合。非常感谢。


    ![](img/79c3b76be7dd74cf400d823b4880f024_7_0.png)


    ![](img/48807_1.png)


    ![](img/48807_2.png)


    ## 灭虫公司设置的陷阱，JAVA 呼吁防止捕猫


    3 月，东京东区的居民向 JAVA 反映，西环境有限公司（以下简称“西环境”）在其公寓区域安装了用于捕鼬等小型动物的陷阱。


    - 陷阱在公寓区域已放置长时间。

    - 陷阱上写有“西环境”的公司名称及其联系方式。

    - 公寓周围有几只流浪猫，居民担心陷阱是为了捕捉这些流浪猫。

    - 针对居民的询问，西环境表示他们不从事捕捕业务，但租赁陷阱。


    ![](img/79c3b76be7dd74cf400d823b4880f024_8_0.png)


    设置在公寓区域的西环境陷阱


    ## 阻碍我们的法律之墙


    西环境是一家管理设施设备卫生的公司，同时也消灭蟑螂、白蚁、老鼠、果子、浣等被视为害虫的动物。将它们视为害虫是人类的便利，当然动物本身没有错。JAVA 渴望消除任何生命的牺牲。然而，从法律上讲，消灭上述动物并不违法（消灭果子和浣需要野生动物保护法的许可）。因此，遗憾的是，JAVA
    无法阻止西环境从事这些动物的消灭业务。


    ## 捕猫的问题


    但捕猫时情况不同。如果你抓了属于别人的猫，就犯盗窃罪。显然，捕猫违反了《动物福利管理法》。此外，如果是他人的宠物猫，则构成刑事破坏财产罪。据称，如果捕流浪猫不是为了保护而是为了消灭，则可能被视为“虐待”。因此，如果西环境租赁或安装了捕捕器，西环境有责任采取充分措施防止客户非法捕猫。


    ## 请求停止陷阱的请求


    JAVA 指出了捕猫问题，要求西环境停止陷阱租赁服务。然而，西环境回应道：“租赁陷阱是为了法律允许的捕猎野生动物。我们无法停止陷阱租赁服务。”因此，JAVA
    要求采取以下改进措施：


    1. 不要出于法律允许捕猎野生动物以外的目的租赁或安装陷阱。

    2. 确保租赁者使用陷阱的目的不是为了消灭、虐待或遗弃猫。

