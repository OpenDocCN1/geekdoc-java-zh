    # Victory!

    Asahi Group will ban animal testing for Food & Beverages by the end of 2021

    Asahi Group will ban animal testing for cosmetics immediately


    JAVA has been requesting Asahi Group Holding, Ltd. (hereafter referred to as Asahi
    Group) to ban animals testing since January 2020. Asahi Group clarified in their
    answering paper to JAVA that they will ban animal testing for food and beverages
    by the end of 2021, and will stop animal testing for cosmetics and quasi-drugs
    immediately.


    ![](img/79c3b76be7dd74cf400d823b4880f024_1_0.png)


    As a result, the Asahi Group''s animal testing policies are as follows:

    Asahi Group clarified:


    +   1) will ban animal testing completely in the field of food and beverages by
    the end of 2021.

    2) banned animal testing completely in the field of cosmetics on June 30, 2020.

    3) banned animal testing completely in the field of daily use items in February
    2020.

    4) will strengthen human investment and financial investment for the development
    and spread of Alternatives to Animal Experiments: making the human investment
    more than three times than before, increasing RD expenses, and becoming a member
    of the Japanese Society for Alternatives to Animal Experiments on May, 2020, etc.


    *However, there is a possibility of animal testing as exceptions below.

    1. In case of public health accountability such as accidents after marketing.

    2. In case of legally required by the system of other countries.


    Although there are a year until the end of 2021, JAVA welcomes the decisive measure
    of Asahi Group to take the voice of consumers who do not want animal testing seriously
    and decide ban a full of animal testing.

    Within a short period about five months from the meeting of JAVA on February 21
    of this year with Asahi Group, we were able to draw out the Asahi Group''s decision
    to ban animal testing completely including Food for Specified Health Uses (FOSHU)
    and Food with Function Claims (FFC). Thanks to everyone who cooperated with the
    campaign. Thank you for your support!


    # Supplementary confirmation


    In addition to the contents of the response, JAVA confirmed the following points
    by e-mail from the person in-charge on July 14, 2020.'
