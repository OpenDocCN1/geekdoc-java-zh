- md: "\n[content]\n# JAVA NEWS No.105 English ver.\n\nThis \"JAVA NEWS No.105 English\
    \ ver.\" is a summary of JAVA NEWS No.105 published in Japanese on October 30,\
    \ 2020.\n\n![](img/79c3b76be7dd74cf400d823b4880f024_0_0.png)\n\n# CONTENTS\n\n\
    - - Asahi Group decided to ban animal testing for Food & Beverages and Cosmetics!\
    \ ................ 2\n- The frog dissection class in Setagaya City will be cancelled!\
    \ ................ 3\n- Letters submitted in joint names with overseas groups\
    \ ................................ 4\n- Enforcement of Revised Act on Welfare\
    \ and Management of Animals ................. 6\n  “The standards for the appropriate\
    \ care and management” is currently in development\n- Introduction of two videos\
    \ ................................................................... 7\n- Distribution\
    \ of PR goods ................................................................\
    \ 8\n- Traps being set by a pest extermination group .................................\
    \ 8\n  JAVA calls for prevention of cat extermination\n- Fur News ................................................................................\
    \ 10\n- News from other countries ............................................................\
    \ 12\n\n# Victory!\nAsahi Group will ban animal testing for Food & Beverages by\
    \ the end of 2021\nAsahi Group will ban animal testing for cosmetics immediately\n\
    \nJAVA has been requesting Asahi Group Holding, Ltd. (hereafter referred to as\
    \ Asahi Group) to ban animals testing since January 2020. Asahi Group clarified\
    \ in their answering paper to JAVA that they will ban animal testing for food\
    \ and beverages by the end of 2021, and will stop animal testing for cosmetics\
    \ and quasi-drugs immediately.\n\n![](img/79c3b76be7dd74cf400d823b4880f024_1_0.png)\n\
    \nAs a result, the Asahi Group's animal testing policies are as follows:\nAsahi\
    \ Group clarified:\n\n- 1) will ban animal testing completely in the field of\
    \ food and beverages by the end of 2021.\n- 2) banned animal testing completely\
    \ in the field of cosmetics on June 30, 2020.\n- 3) banned animal testing completely\
    \ in the field of daily use items in February 2020.\n- 4) will strengthen human\
    \ investment and financial investment for the development and spread of Alternatives\
    \ to Animal Experiments: making the human investment more than three times than\
    \ before, increasing R&D expenses, and becoming a member of the Japanese Society\
    \ for Alternatives to Animal Experiments on May, 2020, etc.\n\nHowever, there\
    \ is a possibility of animal testing as exceptions below.\n1. In case of public\
    \ health accountability such as accidents after marketing.\n2. In case of legally\
    \ required by the system of other countries.\n\nAlthough there are a year until\
    \ the end of 2021, JAVA welcomes the decisive measure of Asahi Group to take the\
    \ voice of consumers who do not want animal testing seriously and decide ban a\
    \ full of animal testing.\nWithin a short period about five months from the meeting\
    \ of JAVA on February 21 of this year with Asahi Group, we were able to draw out\
    \ the Asahi Group's decision to ban animal testing completely including Food for\
    \ Specified Health Uses (FOSHU) and Food with Function Claims (FFC). Thanks to\
    \ everyone who cooperated with the campaign. Thank you for your support!\n\n#\
    \ Supplementary confirmation\n\nIn addition to the contents of the response, JAVA\
    \ confirmed the following points by e-mail from the person in-charge on July 14,\
    \ 2020.\n\n# Food and Beverages\n\n- do not conduct animal testing for Food for\
    \ Specified Health Uses (FOSHU) and Food with Functional Claims (FFC) throughout\
    \ the entire process, from planning and designing to search for materials, development,\
    \ application for permission/notification, manufacturing, sales, in some cases,\
    \ patent application.\n- do not conduct animal testing for checking, both functionality\
    \ and safety.\n- do not conduct any animal testing including preliminary experiments.\n\
    - do not conduct animal testing in-house, nor outsource to external organizations,\
    \ nor fund for animal testing.\n- do not conduct animal testing in basic research\
    \ and joint research.\n\n# Cosmetics\n\n- do not conduct animal testing for cosmetics\
    \ and quasi-drugs throughout the entire process, from planning and designing,\
    \ to searching for ingredients, development, making application for approval,\
    \ manufacturing, sales, in some cases, patent application.\n- do not conduct animal\
    \ testing on manufacturing and marketing approval of quasi-drugs, and request\
    \ to review cosmetics standards.\n- do not conduct animal testing in-house, nor\
    \ outsource to external organizations, nor fund for animal testing.\n- do not\
    \ conduct animal testing in basic research and joint research.\n- All animal testing\
    \ mentioned above were totally banned on June 30, 2020.\n\n*The details of this\
    \ campaign are posted on the following site.\n\nhttps://www.java-animal.org/asahi2020-English/\n\
    \nGood News!\nThe frog dissection class in Setagaya City will be cancelled!\n\n\
    \"Frog dissection\" was planned as a summer program for junior high school students,\
    \ hosted by the Education Center in Setagaya city, Tokyo. Parents of students\
    \ in junior high schools asked JAVA to help this frog dissection class.\n\n# About\
    \ the Dissection Class\n\n- The science experiment classes are planned as one\
    \ of the summer programs for students of junior high in Setagaya City. The classes\
    \ take place at the Education Center in the city.\n- Junior high school teachers\
    \ in the district give guidance to every class.\n- The announcement flyer says:\n\
    \nJAVA NEWS No. 105 English ver.\n\n“Frogs are amphibians, humans are mammals,\
    \ but we are both vertebrates. Let’s learn about the structure and mechanism of\
    \ the human body from many similarities between amphibians and mammals.” “Learn\
    \ the importance of life and mystery through the dissection of frogs.”\n\n# The\
    \ Issues of Dissection and Pros of Alternative Method\n\nIt is ethically unacceptable\
    \ to chop up animal bodies. We cannot learn “the importance of life” with cruel\
    \ acts. As adolescent students attend the dissection classes planned by the city,\
    \ it is possible that they will think chopping up animal bodies and killing them\
    \ are good things.\n\nThere are various ways to learn the mechanism of the animal\
    \ body without sacrificing animals, such as computer simulation, video, elaborate\
    \ 3D models, and so on. There are many advantages of using an alternative method;\
    \ students can learn the process of dissection over and over again; they can proceed\
    \ at their own pace. Some papers suggest that students who learned by methods\
    \ are superior to students who have learned by a dissection.\n\nBy learning the\
    \ method without the use of animals, students learn ethical attitude: such as\
    \ “Don’t take the living’s life.” “Life is precious.” In other words, in order\
    \ to make students gain knowledge and develop an attitude of respect for life,\
    \ alternative methods instead of dissection should be used.\n\n# Response: Setagaya’s\
    \ Decision to Cancel the Dissection Class\n\nJAVA pointed out the issue of dissection\
    \ to Mayor, Setagaya City submitted a document requesting the cancellation of\
    \ the dissection class. The members of JAVA and parents of junior high students\
    \ in Setagaya conveyed their opinions to the Mayor.\n\nOn July 31, the Setagaya\
    \ Board of Education replied to JAVA that they decided to cancel the Frog dissection\
    \ class.\n\n![](img/79c3b76be7dd74cf400d823b4880f024_3_0.png)\n\n# Letters submitted\
    \ in joint names with overseas groups\n\nJAVA often tackles issues with overseas\
    \ animal rights groups. We report here on two letters submitted in joint names.\n\
    \n# Letter about reducing animal testing in drug development\n\nIn June, JAVA\
    \ and British-based Cruelty Free International (CFI) sent a letter titled “Recent\
    \ report on two-species regulatory toxicology studies, by the UK National Centre\
    \ for the 3Rs (NC3Rs)” to Japan Pharmaceutical Manufacturers Association (JPMA)\
    \ and Pharmaceuticals and Medical Devices Agency (PMDA).\n\nJAVA and CFI are members\
    \ of “International Council on Animal Protection in Pharmaceutical Programmes\
    \ (ICAPP) to push forward 3Rs in drug development.\n[/content]\n"
  mdcn: "\n[content]\n# JAVA NEWS No.105 英文版\n\n本“JAVA NEWS No.105 英文版”是于2020年10月30日发布的日语版JAVA\
    \ NEWS No.105的摘要。\n\n![](img/79c3b76be7dd74cf400d823b4880f024_0_0.png)\n\n# 目录\n\
    \n- - 旭酒集团已决定禁止食品饮料和化妆品领域的动物实验！............................... 2\n- 世田谷市的青蛙解剖课将取消！...............................\
    \ 3\n- 与海外团体联名提交的信函 ................................ 4\n- 修订后的《动物福利及管理法》的实施 .................\
    \ 6\n  “适当饲养与管理标准”正在开发中\n- 两个视频的介绍 ...................................................................\
    \ 7\n- 宣传品的发放 ................................................................\
    \ 8\n- 某害虫防治小组设置的陷阱 ................................. 8\n  JAVA 呼吁防止杀猫行为\n- 毛皮类新闻\
    \ ................................................................................\
    \ 10\n- 其他国家的消息 ............................................................ 12\n\
    \n# 胜利！\n旭酒集团将于2021年底前禁止食品饮料动物实验\n旭酒集团将立即停止化妆品动物实验\n\n自2020年1月起，JAVA一直要求旭酒集团控股有限公司（以下简称“旭酒集团”）禁止动物实验。旭酒集团在给JAVA的回复书中明确表示，他们将在2021年底前禁止食品饮料的动物实验，并立即停止化妆品和准药品的动物实验。\n\
    \n![](img/79c3b76be7dd74cf400d823b4880f024_1_0.png)\n\n结果，旭酒集团的动物实验政策如下：\n旭酒集团明确：\n\
    \n- 1) 将在2021年底前完全禁止食品饮料领域的动物实验。\n- 2) 已于2020年6月30日完全禁止化妆品领域的动物实验。\n- 3) 已于2020年2月完全禁止日用品领域的动物实验。\n\
    - 4) 将加强对替代动物实验开发与推广的人力及资金投入：将人力投入增加到以前的三倍以上，增加研发费用，并于2020年5月加入日本替代动物实验学会等。\n\n\
    然而，在以下例外情况下仍可能进行动物实验：\n1. 如上市后的事故等涉及公共卫生责任的情况。\n2. 受其他国家法律体系强制要求的情况。\n\n尽管距离2021年底还有一年时间，但JAVA欢迎旭酒集团采取这一果断措施，这表明他们认真对待了不希望动物实验的消费者声音，并决定全面禁止动物实验。\n\
    在今年2月21日JAVA与旭酒集团会议后的短短约五个月内，我们成功促成了旭酒集团完全禁止动物实验的决定，包括针对健康保健用食品（FOSHU）和功能性标识食品（FFC）的实验。感谢所有参与此次活动的人。感谢你们的支持！\n\
    \n# 补充确认\n\n除了回复内容外，JAVA还于2020年7月14日通过邮件向负责人确认了以下点。\n\n# 食品与饮料\n\n- 从规划设计、材料寻找、开发、许可/申报申请、制造、销售，在某些情况下包括专利申请的整个过程中，不对健康保健用食品（FOSHU）和功能性标识食品（FFC）进行动物实验。\n\
    - 不为了检查功能和安全性而进行动物实验。\n- 不进行任何形式的检查性动物实验。\n- 加强替代动物实验开发与推广的人力及资金投入。\n\n# 化妆品\n\
    \n- 从规划设计、材料寻找、开发、许可/申报申请、制造、销售，在某些情况下包括专利申请的整个过程中，不对化妆品进行动物实验。\n- 针对化妆品和准药品的制造、销售、许可申请进行动物实验。\n\
    - 不在实验中进行动物实验。\n- 上述动物实验已于2020年6月30日完全禁止。\n\n*关于此活动的详情请见以下网站：\n\nhttps://www.java-animal.org/asahi2020-English/\n\
    \n好消息！\n世田谷市的青蛙解剖课将取消！\n\n“青蛙解剖”原本是世田谷市教育中心为初中学生计划的暑期活动。\n\n# 关于解剖课\n\n- 世田谷市教育中心计划作为初中生的暑期活动开展科学实验课。\n\
    - 该地区的教师将对课程进行指导。\n- 通知单上写道：\n\nJAVA NEWS No.105 版\n\n“青蛙是两栖动物，人类是哺乳动物，但我们都是脊椎动物。让我们从两栖类和哺乳类的相似性中学习结构。“通过解剖青蛙学习生命的重要性。”\n\
    \n# 解剖的问题与替代方法的优点\n\n切开动物身体在伦理上是不可接受的。我们无法通过残酷的行为学习“生命的重要性”。当青少年参加市里计划的解剖课时，他们可能会认为切开并杀掉它们是好事。\n\
    \n有很多方法可以学习动物机制，例如计算机模拟、视频、精密的3D模型等。使用替代方法有许多优点：学生可以反复学习实验过程；可以按照自己的进度进行。一些论文表明，通过方法学习的学生优于通过解剖学习的学生。\n\
    \n通过不使用动物的方法，学生学习了伦理态度：例如“不要夺走生命”、“生命是宝贵的”。换句话说，为了让学生获得知识并培养尊重生命的态度，应该使用替代方法而非解剖。\n\
    \n# 回复：世田谷市取消解剖课的决定\n\nJAVA向世田谷市提出了解剖问题，世田谷市提交了请求取消解剖课的方案。JAVA成员和世田谷初中学生的家长向市长表达了意见。\n\
    \n7月31日，世田谷教育委员会回复JAVA，决定取消青蛙解剖课。\n"
