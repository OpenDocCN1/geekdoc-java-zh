    \ Minecraft 模组\n\n步骤 3：找到文本块，将其拖入，并在其中填写消息“Hello, World!”。\n\n```\nfunction main()\
    \ {\n    Send message \"Hello, World!\" to\n}\n```\n\n步骤 4：找到“me\" 块，并将其拖入缺失的位置。\n\
    \n```\nfunction main() {\n    Send message \"Hello, World!\" to me\n}\n```\n\n\
    在模拟器中测试：运行模拟器\n\n你卡住了吗？点击此处访问课程帮助论坛...\n\n图 1-28\n\n![](img/19c5471683adbccca3dbd246857a25f8_38_0.png)\n\
    \n图 1-29\n\n# 第一部分：制作你的第一个 Minecraft 模组\n\n![](img/19c5471683adbccca3dbd246857a25f8_39_0.png)\n\
    \n图 1-30\n\n你可以选择顶部进度条上的链接，或者通过点击屏幕右上角的链接提问，如图 1-31 所示。\n\n| | ... | ... |\n|---|---|---|\n\
    | n | ... | ... |\n\n图 1-31\n\n# 在 Minecraft 中运行你的第一个模组\n\n在你写完第一个模组后，下一个任务是在\
