    \n图 8-25 所示，`give_wand` 函数创建一个你作为参数传递的材质物品（在本例中为 `light_green wand`）。然后它给该物品一个你作为参数传递的名称。最后，它将其添加到玩家的背包中。\n\
    \nimg/19c5471683adbccca3dbd246857a25f8_1.png)\n\n## 为法杖准备魔法\n\n在本节中，当玩家与法杖交互时调用一个函数。请遵循以下步骤：\n\
