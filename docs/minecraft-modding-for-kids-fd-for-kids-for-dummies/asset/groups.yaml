  mdcn: "\n\n# 项目 9：使用现有游戏迭代游戏玩法\n\n- 在你带有竞技场的游戏中加入 Spleef 规则（参考项目 4）。这种方法会增加你死亡的概率——即使你的对手没有攻击你也是如此，因为你可能会直接掉下地板。\n\
    - 设置一个计时器。设置一个计时器来限制你隐藏旗帜的时间，然后设置另一个计时器来限制你寻找荧光石旗帜的时间。\n\n你对玩法有什么想法？务必在 forum.learntomod.com\
    \ 的 LearnToMod 论坛上分享。\n\n## 第 4 部分\n## 构建你自己的 Minecraft 小游戏\n\n![](img/19c5471683adbccca3dbd246857a25f8_290_0.png)\n\
    \n## 本周你将构建：\n\n- 一个你可以在 Minecraft 中玩玩的、具有创意且充满挑战的游戏......................281\n\
    \n## 构建你自己的游戏\n\n在本书中，我描述了许多编程概念和游戏设计策略。然而，在这个项目中，我将引导你完成创建自己的 Minecraft 模的步骤。是时候将你学到的新技能应用到你自己构思的全新创意性项目中了。\n\
    \n构思新的模点子本身就是一个有趣的过程。我们会和朋友聚在一起，询问他们想在 Minecraft 中做些什么，或者观看 YouTube 视频寻找灵感。\n\n\
    ![](img/19c5471683adbccca3dbd246857a25f8_292_0.png)\n\n## 第 4 部分：构建你自己的 Minecraft\
    \ 小游戏\n\n### 草拟你的模\n\n设计新模时的首要工作是草拟你想要的结果。在草拟你的模时，请记住这些指南：\n\n- 使用网格纸。在网格纸上草拟你的模比在空白纸上更准确。图\
    \ 10-1 显示了网格纸的样子。你可以将网格纸上的每个格子看作 Minecraft 中的一个单方块。\n\n![](img/19c5471683adbccca3dbd246857a25f8_293_0.png)\n\
    \n图 10-1\n\n- 数学块甚至比网格纸更有用。你可以创建 3D 效果，让你感觉自己就像行走在你正在设计的模中。\n- 使用空白纸也有它的用处。有时你只需要对你的模看起来像什么样或将做什么有一个大致的想法，因此不需要添加很多细节。\n\
    \n## 项目 10：构建你自己的游戏\n\n- 先在 Minecraft 中构建它。如果你正在设计一个包含过山车等结构的模，请先在 Minecraft 中手动构建该结构，以形成对其构造方式的认识。\n\
    - 随身备好纸和铅笔。即使在草拟完模之后，你可能仍需要记录主意或解决模中的某个问题。\n\n### 规划你的模\n\n在草拟完你的模后，你可以规划需要的函数，例如一个用于设置模场景的函数。你不需要非常精确，但至少应该对你将拥有的函数有个想法。\n\
    \n这里是关于规划你的模的一些建议：\n\n- 在结构（甚至是结构的一部分）周围画圈，并为它们命名。\n- 对于模中非结构的部分（例如事件），画一个包含以下部分的框：\n\
    \    - 顶部：函数的名称\n    - 框内：该函数应该执行的操作操作列表\n    - 问问自己数据如何在函数之间传递。它会有参数吗？哪些变量应该是局部的，哪些应该是全局的（参见项目\
    \ 7）？\n\n当你理解了想要编写的代码后，就可以前往 LearnToMod 网站开始列大纲，正如本项目后面“勾勒你的模”章节中描述的那样。\n\n##\
    \ 第 4 部分：构建你自己的 Minecraft 小游戏\n\n### 绘制游戏循环\n\n如果你正在制作一个小游戏，请记住绘制项目 4 中详细描述过的游戏循环。你可以使用图\
    \ 10-2 中的图作为游戏循环的模板。\n\n![](img/19c5471683adbccca3dbd246857a25f8_295_0.png)\n\n\
    图 10-2\n\n这里是规划游戏循环的一些策略：\n\n- 为循环的每次迭代制作单独的图。这样，你就知道在制作出一个可以玩的游戏之前需要完成多少工作了。\n\
    - 每次迭代都应该产生一个你可以玩的游戏。第一次迭代可能不好玩，但它仍然是一个游戏。\n- 随时更改主意。如果你觉得你有三次迭代，而第三次看起来比第二次更容易完成，就把它们调换一下。\n\
    \n## 项目 10：构建你自己的游戏\n\n游戏循环也可以用于其他情况，作为通用指南。\n\n### 勾勒你的模\n\n当你理解了想要编写的代码后，就可以前往\
    \ LearnToMod 网站开始列大纲，正如本项目后面“勾勒你的模”章节中描述的那样。\n\n遵循以下步骤：\n\n1. 访问 mod.learntomod.com\
    \ 并找到一个模。\n2. 创建新模。\n3. 点击 Code 按钮。\n4. 勾勒你的模。\n\n## 第 4 部分：构建你自己的 Minecraft 小游戏\n\
    \n### 重构你的模\n\n如果一个模变得大到让你无法记忆，就会引起很多问题。\n\n当你的模变得很大时，务要考虑重构。重构模的一种有效方法是将其转换为库，然后将其导入一个新的模中。在开始重构之前，保存一份模的副本，以便始终回到可以运行的版本。\n\
    \n### 测试你的代码\n\n测试并在测试。如果你一直有可以测试的代码，并且在测试期间只进行微小的更改，你更有可能创建出令自豪的、正确的代码。\n\n在\
    \ LearnToMod 中编写模最好的部分之一是可以与朋友分享它们。任何拥有 LearnToMod 账号的人不仅可以看到你编写的代码，还可以进行混改！\n\
    \n想要分享你的模的最佳方式，请遵循以下步骤：\n\n- 给它起一个酷炫的名字，例如“爆炸过山车”。\n- 正如图 10-3 所示，在页面左侧添加一张截图，在右侧添加描述。\n\
    - 将其发布到公共模中，例如 mod.learntomod.com/program_profiles 中的模。\n\n你甚至可以邀请朋友进入你的 Minecraft\
    \ 私有服务器，向他们展示模的效果并与他们交流体验。\n\n### 混改他人的模\n\n在主页上，点击 Find a Mod 按钮，如图 10-4 所示。\n\
    \n来自世界各地的千上万的人每天分享他们的模。其中一些在图 10-5 中所示。\n\n"
