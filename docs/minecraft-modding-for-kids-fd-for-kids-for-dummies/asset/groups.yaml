    ![](img/19c5471683adbccca3dbd246857a25f8_116_0.png)


    Figure 3-65


    Rather than three different functions, you can write one square function that
    takes a parameter named size.


    A parameter is a kind of variable that can be used in a function to make it do
    something different every time it''s called. For example, if you have a function
    named jump, you could add a parameter named how_many_times. Then every time you
    call the jump function, you specify how many times it should make the character
    jump. The function still does the same thing (makes a player jump), but the slight
    change is that it jumps a different number of times (depending on what you specify).
    I tell you more about parameters when you reach the Parameters challenges in the
    LearnToMod software.


    To make the square function, follow these steps:


    +   1. Bring in a new function, name it square, and click on the blue star in
    the upper left corner, as shown in Figure 3-66.


    +   2. Drag a new input into the square function, as shown in Figure 3-67.


    +   3. Rename the input to become size, as shown in Figure 3-68.


    +   4. Click on the blue star again to close the input dialog box, as shown in
    Figure 3-69.'
