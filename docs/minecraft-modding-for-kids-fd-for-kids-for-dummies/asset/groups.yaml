    \ info'Type\n  set local block_location to info'Location\n  set local player to\
    \ info'Player\n  set local player_name to player'sDisplayName\n```\n图 8-61\n\n\
    - 4. 检查放置的方块是否是 `flag_type` 类型的方块，如图 8-62 所示。\n\n- 5. 创建一个名为 `player_respawn_list`\
    \ 的局部变量，并从你在 `give_flag` 函数中创建的对象获取放置方块玩家的实际列表，如图 8-63 所示。\n\n- 6. 检查该列表是否存在，如图\
    \ 8-64 所示。如果不存在，则该玩家不是游戏中的玩家之一。\n\n![](img/19c5471683adbccca3dbd246857a25f8_267_0.png)\n\
    图 8-62\n\n![](img/19c5471683adbccca3dbd246857a25f8_267_1.png)\n图 8-63\n\n![](img/19c5471683adbccca3dbd246857a25f8_267_2.png)\n\
    图 8-64\n\n- 7. 如果列表存在，使用 JavaScript 将方块的位置添加到列表中，如图 8-65 所示。\n\n![](img/19c5471683adbccca3dbd246857a25f8_268_0.png)\n\
    图 8-65\n\n## 在玩家的旗帜位置重生\n\n夺旗战模组（CaptureFlag Mod）版本的最后一步是让玩家在他们的旗帜位置重生。按照以下步骤操作：\n\
    \n- 创建一个名为 `respawn_player` 的函数，参数为 `info`，如图 8-66 所示。\n\n![](img/19c5471683adbccca3dbd246857a25f8_268_1.png)\n\
    图 8-66\n\n- 当发生 `respawn_event` 时，添加对 `respawn_player` 的调用。使用 JavaScript 块来实现，如图\
    \ 8-67 所示。\n\n![](img/19c5471683adbccca3dbd246857a25f8_268_2.png)\n图 8-67\n\n\
    - 3. 创建三个局部变量来从 `info` 参数和重生位置列表中获取数据，如图 8-68 所示。\n\n![](img/19c5471683adbccca3dbd246857a25f8_269_0.png)\n\
    图 8-68\n\n- 4. 检查该玩家是否存在重生位置，如图 8-69 所示。\n\n![](img/19c5471683adbccca3dbd246857a25f8_269_1.png)\n\
    图 8-69\n\n- 5. 如果位置存在，创建一个局部变量来表示旗帜的位置，如图 8-70 所示。\n\n![](img/19c5471683adbccca3dbd246857a25f8_269_2.png)\n\
    图 8-70\n\n- 6. 在玩家重生两秒（2000 毫秒）后，将其传送到旗帜的位置，如图 8-71 所示。\n\n![](img/19c5471683adbccca3dbd246857a25f8_270_0.png)\n\
    图 8-71\n\n## 测试 1\n\n恭喜！你现在应该有一个相当大的模组了，可以在图 8-72 中看到它的代码。\n\n![](img/19c5471683adbccca3dbd246857a25f8_270_1.png)\n\
    图 8-72\n\n现在是测试模组的时候了。当你运行它时会发生以下情况：\n\n- 物品栏中添加了一个光亮石（glowstone）和一个魔杖，你进入了生存模式。\n\
    - 当你使用魔杖时，会创建一个爆炸物。\n- 放置光亮石然后死亡。当你重生时，会被传送到光亮石位置。\n\n![](img/19c5471683adbccca3dbd246857a25f8_271_0.png)\n\
    在移动项目 9 之前，确保你的代码可以正常工作。\n\n## 对现有游戏进行迭代：夺旗战\n\n在这个项目中，我将向你展示如何将单版的夺旗战转换为多人版。自己玩夺旗战没意思——你需要另一个玩家。在阅读此项目之前，完成项目\
    \ 8 的所有代码。你的代码应该像图 8-73 所示。在开始更改之前，始终测试项目 8 的代码。\n\n首先，我将向你展示如何修改游戏循环以包含第二个玩家，以及如何在每个函数中添加第二个玩家。这确保了第二个\n\
    \n```\nfunction CastSpell with info & Player:\n  set local WandPlayer to info_copy_item_in_hand\n\
    \  set local Wand to\n  if Wand == ExplosionWand:\n    Send message Casting the\
    \ Exploding Wand to WandPlayer\n  if Wand == TeleportationWand:\n    Send message\
    \ Casting the Teleportation Wand to WandPlayer\n```\n也能获取魔杖、获取重生位置并在重生位置重生。查看图\
    \ 9-1 所示（在项目 8 中定义）：它显示你已完成开始阶段的所有步骤，正面临一个新的挑战——向游戏添加玩家 2。\n\n![](img/19c5471683adbccca3dbd246857a25f8_273_0.png)\n\
    图 9-1\n\n## 挑战：第二个玩家\n\n添加第二个玩家后，你需要一种赢得游戏的方法在这个项目中，我将引导你完成游戏循环的最后两次迭代：添加玩家二并获奖。\n\
    \n## 迭代 2：添加玩家 2\n\n在接下来的章节中，我将引导你完成夺旗战游戏添加第二个玩家的步骤。你在项目 8 中编写的代码是为了方便添加玩家。\n\n\
    ## 项目 9：使用现有游戏对游戏进行迭代\n\n### 将新玩家添加到你的列表\n\n要添加第二个玩家，你必须先将人添加到代码中的玩家列表中。按照以下步骤操作：\n\
    \n- 1. 点击 `SetupPlayer` 函数中名称列表上的星号，如图 9-2 所示。\n\n![](img/19c5471683adbccca3dbd246857a25f8_274_0.png)\n\
    图 9-2\n\n- 2. 将你朋友的 Minecraft 用户名添加到列表中，如图 9-3 所示。为了避免错误，请正确拼写你朋友的 Minecraft 用户名。\n\
    \n![](img/19c5471683adbccca3dbd246857a25f8_274_1.png)\n图 9-3\n\n- 3. 在玩家命令块周围放置一个循环，以便将所有玩家设置为生存模式，如图\
    \ 9-4 所示。\n\n![](img/19c5471683adbccca3dbd246857a25f8_275_0.png)\n图 9-4\n\n###\
    \ 给所有玩家魔杖\n\n要给所有玩家魔杖，请遵循以下步骤：\n\n- 1. 在浏览器的新标签页中，访问 `mod.learntomod.com/programs/examples-magic_wands`\
    \ 并点击“复制此模组”（Copy This Mod），如图 9-5 所示。\n\n![](img/19c5471683adbccca3dbd246857a25f8_275_1.png)\n\
    图 9-5\n\n- 2. 访问：mod.learntomod.com/book/mod 并点击“示例魔杖”（Examples Magic Wands）模组，如图\
    \ 9-6 所示。\n\n- 3. 点击右下角的代码框，如图 9-7 所示。\n\n现在你可以领取自己的魔杖勋章副本，并且可以编辑它给超过一个人发放魔杖。\n\
    \n"
