    Test cases (as described in Project 3), are the different ways to test your mod
    to check whether it''s behaving correctly.


    Before you write a test case, make two lists that spell out


    +   - What you will test: For example: Break the melon block.


    +   - What you expect to happen: For example, the gamemode switches to Survival,
    and blocks below you disappear after one second.


    If your test cases pass, you know that the mod is correct.


