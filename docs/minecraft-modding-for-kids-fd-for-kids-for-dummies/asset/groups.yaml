  mdcn: "\n\n# 第一部分：制作你的第一个 Minecraft Mod\n\n使用 Blockly 语言创建一个名为 Tower（塔）的新新 Mod。\n\
    \n（项目 1 描述了如何创建一个不是勋章的自定义 Mod。如果你忘记了如何创建一个新 Mod，请重新查看“编写你自己的 Minecraft Mod”章节。）\n\
    \n在开始此步骤列表之前，请阅读之前的章节“使用无人机在 Minecraft 中建造结构”，并确保你已经获得了第一个无人机（Drones）勋章。要建造并测试塔，请按照以下步骤操作：\n\
