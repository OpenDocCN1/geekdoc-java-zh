    Figure 7-22\n\nWhen you test the mod, you see an explosion, and the bedrock block\
    \ disappears, as shown in Figure 7-23.\n\n# Iteration 4: Refactor and check the\
    \ state-machine\n\nEven though you have now finished writing the code for this\
