    # Minecraft 模组开发


    # 专为


    # 儿童设计


    - 使用模组增强 Minecraft

    - 使用拖拽式编写代码

    - 使用 JavaScript 修改游戏


    Sarah Guthals 博士

    Stephen Foster 博士

    Lindsey Handley 博士


    ![](img/19c5471683adbccca3dbd246857a25f8_0_0.png)


    # 刮擦（Scratch）以显示您的 LearnToMod 试用激活密钥：


    请按照以下步骤访问您的 LearnToMod 新账户：


    - 1. 访问 http://mod.learntomod.com。第一次登录时，您将被重定向到 ThoughtSTEM 的登录页面创建账户。


    - 2. 使用“注册”（Sign Up）窗口（位于“登录”Log In 窗口下方）创建 LearnToMod 账户。


    如果孩子有邮箱地址，建议使用他们的邮箱，这样如果他们需要，可以直接联系 LearnToMod 支持人员。

    您可以为账户设置任何您喜欢的密码。

    密码**不需要**是激活密钥。


    - 3. 创建 LearnToMod 账户后，您将被重定向到询问激活密钥的页面。复制并粘贴上方激活密钥。


    - 4. 接下来，选择一个 LearnToMod 昵称。任何您喜欢的名字！

    现在您可以开始解锁勋章来学习模组开发了！


    ![](img/19c5471683adbccca3dbd246857a25f8_1_0.png)


    代码无法运行？

    请发送邮件至：learntomod@thoughtstem.com


    ![](img/19c5471683adbccca3dbd246857a25f8_2_0.png)


