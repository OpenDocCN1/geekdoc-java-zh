    \n图 8-12\n\n7. 在 Minecraft 中测试游戏。\n\n你将看到图 8-13 所示的场景。\n\n## 添加法杖\n\n在本节中，我将教你如何向背包中添加一个法杖物品。这个法杖并没有*任何功能*；它仅仅是一个带有新皮肤的物品——法杖皮肤。在接下来的章节中，我将教你如何为法杖添加魔法。\n\
