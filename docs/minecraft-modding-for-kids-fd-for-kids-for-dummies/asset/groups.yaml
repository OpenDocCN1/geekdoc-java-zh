    # 引言


    ## 本书中使用的图标


    ![](img/19c5471683adbccca3dbd246857a25f8_14_0.png)


    提示（Tip）图标标记了可以让你模组制作（modding）更简单的建议和快捷方法。


    ![](img/19c5471683adbccca3dbd246857a25f8_14_1.png)


    记忆（Remember）图标标记了你应该记住的概念，以使模组更加更加。


    ![](img/19c5471683adbccca3dbd246857a25f8_14_2.png)


    代码连接（Coding Connections）图标描述了你正在进行的模组制作与编程宏观概念之间的关系。


    ![](img/19c5471683adbccca3dbd246857a25f8_14_3.png)


    数学连接（Math Connections）图标描述了模组制作中使用的数学知识。


    ![](img/19c5471683adbccca3dbd246857a25f8_14_4.png)


    注意！此图标标记了重要信息，可以帮助你避免模组制作者有时必须忍的常见难题。


    ## 获取 LearnToMod 软件


    要访问 LearnToMod 软件，请使用书封上的访问密钥（access key）。然后你只需要按照以下步骤访问你的新 LearnToMod 账户：


    - 1. 访问 http://mod.learntomod.com。第一次登录时，网站会将你重定向到 ThoughtSTEM 的登录页面以创建账户。

    - 2. 使用注册（Sign Up）窗口（位于登录窗口下方）创建你的 LearnToMod 账户。

    - 3. 创建 LearnToMod 账户后，将被重定向到一个要求输入访问密钥的页面。复制并粘贴书中内侧封页上显示的访问密钥。

    - 4. 选择一个 LearnToMod 昵称——你喜欢的任何名字！

    现在你可以开始解锁勋章来学习如何制作模组了！


    ## 少少 Minecraft 模组制作


    LearnToMod 的开发旨在引导像你这样的学生应对 Minecraft 模组制作的挑战，介绍编程概念，并展示开始制作模组有多有趣。LearnToMod
    拥有超过 200 多个勋章，引导你创建简单的模组；然而，你也可以制作自己的创意模组。


    本书的前几个章节非常简单，但后期的模组更大、更复杂、也更难。它们旨在按顺序完成，有时它们会相互为基础——欢迎你跳跃着先尝试更具挑战性的项目。在本书的帮助下制作几个模组后，有数百万个模组在等待你。你可以前往
    LearnToMod 网站继续获取勋章，或与其他模组制作者继续创建并分享模组。更如此，你正在学习编程！你还可以去寻找其他编程的语言和应用程序。编程是令人兴奋的，我很高兴你不仅选择学习代码，还改变你和朋友玩
    Minecraft 的方式！


    ## 书籍之外


    我制作了一些书中没有的额外内容。可以在网上找到这些项目：


    - LearnToMod 和基础模组制作的在线快速备忘页（Cheat Sheet）可以在 www.dummies.com/cheatsheet/minecraftmodding
    获取。基础技能的描述被浓缩在备忘页中，展示了设计和编程的基础。

    - 涵盖额外主题的在线文章可以在 www.dummies.com/extras/minecraftmodding 获取。

    - 如果需要，你可以在 www.dummies.com/updates/minecraftmodding 本书的更新。


    ## 接下来去哪里


    ### 第一部分 制作你的第一个模组


    本周你将：


    - 注册 LearnToMod 并制作你的第一个模组。

    - 学习 LearnToMod 中不同的勋章类型，并开始获取勋章。

    - 使用隐形人在 Minecraft 内部构建结构并用闪电保护它们。


    ## 入门


    在书中，我向你展示如何编写小游戏类 Minecraft 模组。小游戏 Minecraft 模组是在 Minecraft 内部玩的游戏。你可以看到如何制作几个小游戏，并获得完善自己创作的小游戏所需的技能。


    LearnToMod 在线软件教你如何制作可以在 Minecraft 多人版本中运行的修改。通过数百个勋章引导你学习各种编程概念和模组，你将获得制作自己的创意模组所需的技能。你应该对玩
    Minecraft 有一些基础了解，但不需要成为专家。你只需要电脑版本的 Minecraft 和互联网连接。


    | 首页 | 模组 | 学习 | 社交 | 登出 |

    | :--- | :--- | :--- | :--- | :--- |

    | 入门 (1/6) | 学习编程 (0/178) | 动物园 (0/8) | 魔法魔棒 (0/10) | 实验性 (0/3) |


