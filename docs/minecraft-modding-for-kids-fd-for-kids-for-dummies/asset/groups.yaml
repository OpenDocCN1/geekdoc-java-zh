    # Part 3: Designing and Building a Multiplayer Minigame


    ![](img/19c5471683adbccca3dbd246857a25f8_213_0.png)


    Figure 7-15


    Velocity is the speed of an object plus the direction in which it is moving. Speed
    is calculated as how far you go in a certain amount of time, such as moving 20
    miles in 1 hour. That means you''re moving at “20 miles per hour.” Velocity is
    the difference in your position in a certain amount of time, so you''ll also know
    which direction the object is moving.


    After you''ve ensured that the only blocks you have are the ones shown in Figure
    7-15 (all others should be disabled), test your mod.


    When you run your mod, you see a bedrock block thrown from you in the direction
    that you''re looking, as shown in Figure 7-16.


    ![](img/19c5471683adbccca3dbd246857a25f8_213_1.png)


