    \nFigure 1-32\n\nWhen you click on it, you see a message, shown in Figure 1-33,\
    \ letting you know that the mod was successfully sent to your Minecraft account.\n\
    \n![](img/19c5471683adbccca3dbd246857a25f8_40_1.png)\n\nFigure 1-33\n\n- 2. Click\
    \ the Minecraft icon on the taskbar of your computer, as shown in Figure 1-34.\n\
    \nYou're still in the world, so you see the mod chest in the inventory, as shown\
    \ in Figure 1-35.\n\nIf you aren't in this world, go back to the Connect badge\
    \ and reconnect, as described in \"Connect mods to Minecraft.\"\n\n![](img/19c5471683adbccca3dbd246857a25f8_41_0.png)\n\
    \nFigure 1-34\n\n![](img/19c5471683adbccca3dbd246857a25f8_41_1.png)\n\nFigure\
    \ 1-35\n\n- 3. To equip your mod and use it in Minecraft, follow these steps while\
    \ you're in Minecraft:\n- Open the mod chest by pressing M, and then right-click\
    \ the mouse button.\n- b. Choose the mod you want to run, and drag it from the\
    \ mod chest to the inventory. Hover the mouse cursor over different mods to see\
    \ their names.\n- c. Press the Esc key to exit the mod chest and return to playing.\n\
    - d. Run your mod by pressing the number that corresponds with the position of\
    \ the mod in the inventory.\n\nFor example, if you place the mod all the way to\
    \ the left, as shown in Figure 1-36, you press the 1 key and right-click the mouse\
    \ button to run the mod.\n\n![](img/19c5471683adbccca3dbd246857a25f8_42_0.png)\n\
    \nFigure 1-36\n\nReturn to the LearnToMod website and see that you have earned\
    \ the third badge. You should then complete the next three challenges, which are\
    \ quiz badges. I don't walk you through these three badges, because you should\
    \ be testing your knowledge and earn them on your own.\n\n# Part 1: Making Your\
    \ First Minecraft Mod\n\n# Write Your Own Mods\n\nIn Chapter 2, I walk you through\
    \ the next set of badges on the Learning to Program tab. After you have earned\
    \ at least ten badges, you might have an idea for your own creative mod that you\
    \ want to write. Follow these steps:\n\n- 1. Scroll to the top of the LearnToMod\
    \ online software and click on the Mod tab, shown in Figure 1-37.\n- 2. The new\
    \ page, shown in Figure 1-38, on this page you can type a title for your mod,\
    \ such as Say_Hello.\n\n![](img/19c5471683adbccca3dbd246857a25f8_43_0.png)\n\n\
    Figure 1-38\n\n- 3. Click the Blockly (Multiplayer) button to create a server-side\
    \ mod. This book shows you how to make server-side mods, which means that they’re\
    \ multiplayer.\n\nA new mod block appears, as shown in Figure 1-39.\n\n![](img/19c5471683adbccca3dbd246857a25f8_44_0.png)\n\
    \nFigure 1-39\n\n- 4. Click on the new mod block to show the mod's description\
    \ page (see Figure 1-40).\n\n![](img/19c5471683adbccca3dbd246857a25f8_44_1.png)\n\
    \nFigure 1-40\n\n- 5. Click the Code button,\nYou see the programming environment,\
    \ as shown in Figure 1-41.\n\nNow you can try writing a new mod — for example,\
    \ one that says hello to you personally (see Figure 1-42).\n\n![](img/19c5471683adbccca3dbd246857a25f8_45_0.png)\n\
    \nFigure 1-41\n\n![](img/19c5471683adbccca3dbd246857a25f8_45_1.png)\n\nFigure\
    \ 1-42\n\n# Share Your Mods with Friends\n\nWriting mods and testing them in Minecraft\
    \ is fun, but being able to have your friends test them in their Minecraft worlds\
    \ can help you and your friends come up with creative mods, because you can get\
    \ new ideas.\n\nAfter you write some code, have your friends test it for you —\
    \ it's a good way to find bugs and become a better modder.\n\nSharing a mod with\
    \ your fellow LearnToMod modders is easy. Just follow these steps:\n\n- 1. Click\
    \ on the Back button in your mod (refer to Figure 1-41).\n- 2. Click on the image\
    \ box on the top left, as shown in Figure 1-43.\n- 3. Add a screenshot and description\
    \ for the mod, by following the steps as shown in Figure 1-44.\n\n# Project 1:\
    \ Getting Started on Modding Minecraft\n\n# Say Hello\n\nNOTE: This is an unpublished\
    \ mod. Others cannot see this page. (Edit)\n\n![](img/19c5471683adbccca3dbd246857a25f8_46_0.png)\n\
    \n# Say Hello\n\nMake mod viewable to the public?\n\n![](img/19c5471683adbccca3dbd246857a25f8_46_1.png)\n\
