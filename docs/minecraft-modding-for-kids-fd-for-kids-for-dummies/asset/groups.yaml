    ### 第一部分 制作你的第一个模组


    在本章中，我解释了什么是模组，描述了如何使用 LearnToMod 在线软件以及如何连接到 LearnToMod 多人服务器，并说明了如何使用隐形人等基础工具来制作你有趣的模组。


    ## 了解什么是模组制作


    视频游戏是由成千上万行代码组成的。代码让你这样的玩家能够探索新世界、与角色互动并获得乐趣。


    像 Minecraft 这样的游戏允许玩家添加代码来创建新世界、挑战甚至角色。在书中，我向你展示如何制作这些修改。模组可以包含任何任务：


    - 纹理：通过应用纹理包改变外观。

    - 方块交互：当玩家破坏木块时引发爆炸。

    - 新区块：创建新的区块。

    - 小游戏：在 Minecraft 内部创建一个小游戏。

    - 大型结构：创建手动制作需要很长时间但用代码只需很短就能的巨大结构。


    ### 项目 1：开始模组制作


    LearnToMod 在线软件引导你完成一系列挑战以获取勋章。这些挑战将帮助你展示基础技能以及如何制作模组。我向你展示如何登录 LearnToMod 软件（可在
    learntomod.com 获取），创建并运行你的第一个模组，并与其他模组制作者分享该模组。


    注册 LearnToMod 在线软件快速简单。只需 5 分钟即可完成注册流程并开始获取勋章。


