    \n- 2. 然后创建一个名为 `CastSpell` 的新函数，它由事件调用。\n\n该函数唯一需要做的是发送一条显示魔法已释放的消息，如图 8-27 所示。\n\
    \nimg/19c5471683adbccca3dbd246857a25f8_250_1.png)\n\n- 3. 测试模组。\n\n注意当运行模组时，背包中会出现法杖（如上一节所示）。当你尝试使用法杖时，你会看到“正在释放法杖”的消息。\n\
    \n问题在于当你尝试使用任何物品时都会看到“正在释放法杖”的消息。\n\n要将 `CastSpell` 函数与法杖关联，请遵循以下步骤：\n\n- 1. 识别哪个玩家触发了事件，并将信息保存到名为\
    \ `WandPlayer` 的局部变量中，如图 8-28 所示。\n\n```\nfunction CastSpell with info\n  set\
    \ local WandPlayer to info.Player\n  send message Casting the Exploding Wand\n\
