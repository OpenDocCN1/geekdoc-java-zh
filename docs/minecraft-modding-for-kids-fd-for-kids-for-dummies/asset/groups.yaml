    # Communicate with your computer


    Writing code is the way that programmers communicate with their computers, and
    the way that you communicate with Minecraft. The problem, however, is that computers
    do exactly what you tell them to do, not what you think they should do. For example,
    in the Saying Hello (Scramble) challenge, you may have noticed that the answer
    looks strange if you expected the messages to be sent in numbered order, like
    this:


    +   - One Mississippi


    +   - Two Mississippi


    +   - Three Mississippi


    and instead they''re sent out of order, like this:


    +   - Two Mississippi


    +   - One Mississippi


    +   - Three Mississippi


    If you were told, "Go to your shoes and put on your room," you would probably
    figure out that what you should do is go to your room and put on your shoes. If
    you told a computer, "Go to your shoes and put on your room," the computer would
    literally go to its shoes and then try to put on its room, which is impossible,
    so it would probably display an error message.


    You must be precise when you write code, and — more importantly — you should test
    your code often and in small increments to catch mistakes.


