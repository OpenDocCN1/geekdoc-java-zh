    ![](img/19c5471683adbccca3dbd246857a25f8_280_1.png)


    Figure 9-18


    ### Test your game


    At this point, your entire mod should be able to handle multiple players. CaptureTheFlag
    should look like Figure 9-19.


    To test your game, invite a friend to join your server. Follow these steps:


    - 1. On your LearnToMod private server, type `/open`. A message appears, showing
    your server number.


    - 2. After your friend is on her own LearnToMod private server, have her type
    `/join` where ## is the number of your server.


    After your friend has joined, find each other in the Minecraft world and run your
    mod. You should each get a light green mod and a glowstone flag. If one of you
    dies, you respawn to your glowstone block, not to your opponent’s.


    ## Part 3: Designing and Building a Multiplayer Minigame


    ![](img/19c5471683adbccca3dbd246857a25f8_281_0.png)


    Figure 9-19


    ### Iteration 3: Make Someone Win


    The final iteration I describe in this project is how to announce when someone
    loses. To lose, the player must die and not have a flag to spawn back to. The
    goal of the game, then, is to destroy your opponent’s flag so he cannot respawn.
    In Minecraft, you can’t capture anything without destroying it, so maybe we should
    name this mod DestroyFlag. The only changes you need to make are to the respawn_player
    function. Follow these steps:


    - 1. Add a loop that loops through all of the players'' respawn_locations, and
    remove the data that were originally setting to the respawn_location variable.
    The function looks like Figure 9-20.


    ## Project 9: Iterating on Gameplay Using an Existing Game


    ![](img/19c5471683adbccca3dbd246857a25f8_282_0.png)


    Figure 9-20


    - 2. Set the respawn_location variable to k, which is one of the respawn locations
    for the player who is respawning, as shown in Figure 9-21.


    ![](img/19c5471683adbccca3dbd246857a25f8_282_1.png)


    Figure 9-21


    - 3. Create a local variable named block, which is the block that''s at the location
    of respawn location, as shown in Figure 9-22.


    ![](img/19c5471683adbccca3dbd246857a25f8_282_2.png)


    Figure 9-22


    ## Part 3: Designing and Building a Multiplayer Minigame


    - 4. Check to see whether the block at that location is glowstone. If it is glowstone,
    the flag is still there; if it isn''t glowstone, the opponent has destroyed the
    flag. The function looks like Figure 9-23.


    ![](img/19c5471683adbccca3dbd246857a25f8_283_0.png)


    Figure 9-23


    - 5. If the flag is no longer there, loop through all players in the game, as
    shown in Figure 9-24.


    ![](img/19c5471683adbccca3dbd246857a25f8_283_1.png)


    Figure 9-24


    - 6. Send a message to everyone saying that the player has lost, as shown in Figure
    9-25.


    ## Project 9: Iterating on Gameplay Using an Existing Game


    ![](img/19c5471683adbccca3dbd246857a25f8_284_0.png)


    Figure 9-25


    Whew — now you have a multiplayer Capture the Flag game!


    ### Make the game your own


    Using the powerful Capture the Flag game described in this project, you can continue
    iterating on the gameplay loop. Here are some ideas on how to enhance the game:


    - Add flags for each player.

    - Add new kinds of wands for each player.

    - Give each player different wands.


    What are your ideas? Be sure to share them on the LearnToMod forums at forum.learntomod.com.


    ### Give players teleportation wands


    After you have tested your game, edit your code to give each player a teleportation
    wand:


    - 1. Add a second call to the `give_wand` function inside the SetupPlayer function,
    as shown in Figure 9-26.


    ![](img/195471683adbccca3dbd246857a25f8_285_0.png)


    Figure 9-26


    - 2. In the CastSpell, click on the star on the if statement and add an else-if
    statement, as shown in Figure 9-27.


    ![](img/19c5471683adbccca3dbd246857a25f8_285_1.png)


    Figure 9-27


    - 3. Compare Wand with TeleportationWand so that you can call the teleportation
    function only if the TeleportationWand was used, as shown in Figure 9-28.


    - 4. Go to the Exploding Projectile mod and make a copy of it. Open the copied
    mod and rename it to TeleportationWand. Then import TeleportationWand to your
    CaptureTheFlag mod, as shown in Figure 9-29.


    ## Project 9: Iterating on Gameplay Using an Existing Game


    ![](img/19c5471683adbccca3dbd246857a25f8_286_0.png)


    Figure 9-28


    - 5. Change the on_land function in the Teleportation Wand mod to teleport the
    player rather than explode the block, as shown in Figure 9-30.


    ![](img/19c5471683adbccca3dbd246857a25f8_286_1.png)


    Figure 9-30


    - 6. Call the launch function from the CastSpell function, and send a message
    that you''re teleporting the player, as shown in Figure 9-31.


    ## Part 3: Designing and Building a Multiplayer Minigame


    ![](img/19c5471683adbccca3dbd246857a25f8_287_0.png)


