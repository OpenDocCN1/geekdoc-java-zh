    # 项目 9：使用现有游戏进行游戏性迭代


    ![](img/19c5471683adbccca3dbd246857a25f8_276_0.png)


    图 9-6


    ![](img/19c5471683adbccca3dbd246857a25f8_276_1.png)


    图 9-7


    - 4. 在 `init` 函数中添加一个名为 `player_names` 的新参数，如图 9-8 所示。


    ![](img/19c5471683adbccca3dbd246857a25f8_276_2.png)


    图 9-8


    - 5. 创建一个名为 `players` 的全局变量。全局变量是该 mod 中所有函数都能可见的变量。它们与局部变量相反（参见项目 7）。


    它是游戏中所有玩家的列表（参见图 9-9）。


    ## 第 3 部分：设计和构建多人小游戏


    ![](img/19c5471683adbccca3dbd246857a25f8_277_0.png)


    图 9-9


    - 6. 在纹理包更改周围添加一个循环，如图 9-10 所示。


    ![](img/19c5471683adbccca3dbd246857a25f8_277_1.png)


    图 9-10


    - 7. 创建一个名为 `player` 的局部变量。


    当你遍历玩家列表时，该变量将持有每个玩家的名字，如图 9-11 所示。


    ![](img/19c5471683adbccca3dbd246857a25f8_277_2.png)


    图 9-11


    - 8. 将玩家添加到你在第 5 步中创建的 `players` 列表中，如图 9-12 所示。


    - 9. 将 `me` 块替换为 `player` 块，如图 9-13 所示。


    ## 项目 9：使用现有游戏进行游戏性迭代


    ![](img/19c5471683adbccca3dbd246857a25f8_278_0.png)


    图 9-12


    ![](img/19c5471683adbccca3dbd246857a25f8_278_1.png)


    图 9-13


    10. 在 `give_wand` 函数中，在 `give_item` 块周围添加一个循环，以便你可以将物品发给每个玩家，如图 9-14 所示。


    ![](img/19c5471683adbccca3dbd246857a25f8_278_2.png)


    图 9-14


    ## 第 3 部分：设计和构建多人小游戏


    11. 对 `give_all` 函数执行与第 10 步相同的的操作，如图 9-15 所示。


    ![](img/19c5471683adbccca3dbd246857a25f8_279_0.png)


    9-15


    ### 导入你自己的魔法杖库


    在你的 CaptureTheFlag mod 中，你需要导入 Magic Wands 库（我在上一节中向你展示了如何修改的那个）。


    - 1. 更改 import 语句以导入你的魔法杖库，如图 9-16 所示。


    ![](img/19c5471683adbccca3dbd246857a25f8_279_1.png)


    9-16


    - 2. 删除所有对 `example-magic-wands` 函数的调用，并将它们替换为对你的 `magic_wands` 库函数的调用，就像你在项目
    8 中做的那样。将对 `magic_wands.init` 函数的调用移动到 `SetupPlayer` 函数中，并确保对 `give_wands` 和 `light_green`
    魔法杖的调用来自你的库，而不是示例库。你的 `SetupPlayer` 函数看起来应该像图 9-17。


    - 3. 将 `CastSpell` 函数中对 `item_in_hand` 函数的调用更改为你的库而不是示例库，如图 9-18 所示。


    ## 项目 9：使用现有游戏进行游戏性迭代


    ![](img/19c5471683adbccca3dbd246857a25f8_280_0.png)


    图 9-17


    ![](img/19c5471683adbccca3dbd246857a25f8_280_1.png)


    图 9-18


    ### 测试你的游戏


    到此时，你的整个 mod 应该能够处理多个玩家。CaptureTheFlag 看起来像图 9-19。


    要测试你的游戏，请一个朋友加入你的服务器。遵循以下步骤：


    - 1. 在你的 LearnToMod 私有服务器上，输入 `/open`。会出现一条消息，显示你的服务器编号。


    - 2. 在朋友进入她自己的 LearnToMod 私有服务器后，让她输入 `/join ##`，其中 ## 是你的服务器编号。


    在朋友加入后，在 Minecraft 世界中找到彼此并运行你的 mod。你们每个人都应该得到一个浅绿色的 mod 和一面荧光石旗。如果你们其中一人死了，你将重生在自己的荧光石块上，而不是对手的旁边。


    ## 第 3 部分：设计和构建多人小游戏


    ![](img/19c5471683adbccca3dbd246857a25f8_281_0.png)


    图 9-19


    ### 迭代 3：让某人获胜


    我在项目中描述的最后迭代是如何宣布某人失败了。要失败，玩家必须死亡且没有旗帜可以重生。那么，游戏的目标就是摧毁对手的旗帜，让他无法重生。在 Minecraft
    中，如果不摧毁就无法捕捉任何东西，所以也许我们应该把这个 mod 命名 DestroyFlag。你只需要修改 `respawn_player` 函数。遵循以下步骤：


    - 1. 添加一个循环遍历所有玩家的 `respawn_locations`，并移除原始数据。该函数看起来像图 9-20。


    项目 9：使用现有游戏进行游戏性迭代


    ![](img/19c5471683adbccca3dbd246857a25f8_282_0.png)


    图 9-20


    - 2. 将 `respawn_location` 变量设置为 k，它是重生的位置之一，如图 9-21 所示。


    ![](img/19c5471683adbccca3dbd246857a25f8_282_1.png)


    图 9-21


    - 3. 创建一个名为 `block` 的局部变量，它是重生位置块，如图 9-22 所示。


    ![](img/19c5471683adbccca3dbd246857a25f8_282_2.png)


    图 9-22


    第 3 部分：设计和构建多人小游戏


    - 4. 检查位置的块是否为荧光石。如果是荧光石，则旗帜仍在；如果不是，则对手摧毁了旗帜。该函数看起来像图 9-23。


    ![](img/19c5471683adbccca3dbd246857a25f8_283_0.png)


    图 9-23


    - 5. 如果旗帜不再存在，遍历所有玩家，如图 9-24 所示。


    ![](img/19c5471683adbccca3dbd246857a25f8_283_1.png)


    图 9-24


    - 6. 向所有人发送玩家已失败的消息，如图 9-25 所示。


    项目 9：使用现有游戏进行游戏性迭代


    ![](img/19c5471683adbccca3dbd246857a25f8_284_0.png)


    图 9-25


    哇 —— 现在你有了一个多人 Capture the Flag 游戏！


    ### 让游戏属于自己


    使用这个项目中的 Capture the Flag 游戏，你可以对游戏进行迭代。这里有一些增强游戏的想法：


    - 为玩家添加旗帜。

    - 为玩家添加不同类型的魔法杖。

    - 给玩家不同的魔法杖。


    你有什么想法？请确保在 LearnToMod 论坛分享它们。


    ### 给玩家传送魔法杖


    在你测试过游戏后，修改代码给每个玩家一个传送魔法杖：


    - 1. 在 `SetupPlayer` 函数内部对 `give_wand` 的第二次调用，如图 9-26 所示。


    ![](img/19c5471683adbccca3dbd246857a25f8_285_0.png)


    图 9-26


    - 2. 在 `CastSpell` 中，点击 `if` 语句并添加一个 `else-if` 语句，如图 9-27 所示。


    ![](img/19c5471683adbccca3dbd246857a25f8_285_1.png)


    图 9-27


    - 3. 将 Wand 与 `TeleportWand` 进行比较，以便只有在使用了 `TeleportWand` 时才调用传送函数，如图 9-28 所示。


    - 4. 转到 `ExplodingProjectile` mod 并创建一个副本。打开复制的 mod 并重命名为 `TeleportWand`。然后将 `TeleportWand`
    导入你的 CaptureTheFlag mod 中，如图 9-29 所示。


    - 5. 修改 `Teleportation Wand` mod 中的 `on_land` 函数，让传送玩家而不是爆炸块，如图 9-30 所示。


    - 6. 从 `CastSpell` 函数中调用 `launch` 函数，并发送一条你正在传送玩家的消息，如图 9-31 所示。


    第 3 部分：设计和构建多人小游戏


    ![](img/19c5471683adbccca3dbd246857a25f8_287_0.png)


    图 9-31


    ![](img/19c5471683adbccca3dbd246857a25f8_287_1.png)


    图 9-32


    ### 以替代方式玩游戏


    这里是玩 Capture the Flag 游戏的一些替代方式：


    - 创建一个更小的竞技场。与其在 Minecraft 的无限世界中隐藏荧光石旗帜，不如创建一个更小的竞技场，以便你面对新的挑战。


    [/content]

