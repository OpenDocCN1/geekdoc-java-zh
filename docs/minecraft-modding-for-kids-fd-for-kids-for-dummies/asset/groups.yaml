    - 4. 给列表中的每个玩家一个类型为 `flag_type` 的物品，如图 8-53 所示。


    # 252 第3部分：设计和构建多人迷你游戏


    ![](img/19c5471683adbccca3dbd246857a25f8_263_0.png)


    图 5-53


    - 5. 从 `SetupPlayer` 函数中调用新函数，如图 5-54 所示。


    ![](img/19c5471683adbccca3dbd246857a25f8_263_1.png)


    图 5-54


    测试模块。


    现在你得到了一个浅绿色魔杖和一个要放置的荧光石。


    # 存储玩家的旗帜位置


    现在你需要设置玩家在旗帜处重生的能力。你需要存储旗帜的位置并将其与放置它的玩家相关联。


    这可能很复杂。图 5-55 概述了要做什么，如下列表所示：


    - `respawn_locations` 是一个包含其他对象的对象。它包含的对象是与玩家名称关联的列表。


    - "smes" 是第一个玩家的名字，但这意味着我必须在游戏中。将其更改为你的 Minecraft 名字。


    - `players_respawn_list` 是重生位置的列表，它最初应该是空的。


