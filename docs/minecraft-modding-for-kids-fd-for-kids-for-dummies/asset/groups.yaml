  mdcn: '


    ## 项目 6：与好友一起制作 Minecraft 模组


    为什么要通过替换“我”而不是同时也包含 Player2 来让你的游戏变成多人模式呢？当你对代码进行大量修改，通过名称来引用玩家，而不是使用 `me` 模块时，你可以在添加多个玩家带来的更多复杂性之前，先测试你所做的更改。在迭代
    2 中，你将添加 Player2。


    首先，你需要确定 Player1 的 Minecraft 用户名，并将该信息放入你的模组中。按照以下步骤操作：


    - 1. 创建一个名为 `Setuppplayer` 的新函数，并在 `main` 中调用它，如图 6-7 所示（并在项目 2 中描述）。


    ![](img/19c5471683adbccca3dbd246857a25f8_184_0.png)


    图 6-7


    `main` 函数已经包含了其他模块，因为你这是从我在项目 4 中教你构建的 Spleef 游戏开始的。


    - 2. 创建一个名为 `Player1` 的新变量，并设置为第一个玩家的 Minecraft 用户名，如图 6-8 中的示例所示。在这个示例中，我使用 `thoughtstem`
    作为 Player1。


    ![](img/19c5471683adbccca3dbd246857a25f8_184_1.png)


    图 6-8


    - 3. 检查你的模组，并将任何对 `me` 的引用替换为对名为 `Player1` 变量玩家的引用。


    例如，如果你的 Minecraft 名称是 `thoughtstem`，图 6-9 显示了你在 Minecraft 中引用玩家的三种方式。


    ## 第二部分：制作你的第一个 Minecraft 迷你游戏


    ![](img/19c5471683adbccca3dbd246857a25f8_185_0.png)


    图 6-9


    从 `main` 开始（如图 6-10 所示）并逐行执行。这意味着当这些函数从 `main` 被调用时，你会查看它们。


    ![](img/19c5471683adbccca3dbd246857a25f8_185_1.png)


    图 6-10


    - a. 由于 `main` 中的第一个函数调用是 `SetupMultiplayer`，请查看该函数。


    `SetupMultiplayer` 如图 6-8 所示，是我为我的多人版本制作的，所以不需要任何更改。


    - b. `main` 中的第二行是调用 `arena` 函数。图 6-11 显示了 `arena` 函数。


    - c. `arena` 函数只构建竞技场。它没有关于游戏中玩家的指示，所以这里也不需要更改。


    - d. `main` 中的下一行是方块被破坏时触发的事件。当任何玩家破坏方块时，就会调用 `StartGame` 函数。


    - e. 在你的 `StartGame` 函数中，将 `me` 模块更改为名为 `Player1` 的 Player 模块，如图 6-12 中的黄色框所示。


    ![](img/19c5471683adbccca3dbd246857a25f8_186_0.png)


    图 6-11


    ![](img/19c5471683adbccca3dbd246857a25f8_186_1.png)


    图 6-12


    - f. 事件中的下一行是当玩家重生时触发的事件。当任何玩家重生时，就会调用 `Setup-Player` 函数。


    - g. 在 `SetupPlayer` 函数中，将两个 `me` 模块替换为名为 `Player1` 的 Player 模块，如图 6-13 所示。


    ![](img/19c5471683adbccca3dbd246857a25f8_187_0.png)


    图 6-14


    添加一个 `if` 语句以确保重生的玩家是 Player1 而不是 Minecraft 世界中的任何其他玩家（见图 6-14）。这是为了给该项目的稍后部分做准备，到时候我将向你展示如何向你的
    Minecraft 世界添加其他玩家。


    ![](img/19c5471683adbccca3dbd246857a25f8_187_1.png)


    图 6-14


    在 `main` 的重生事件行中（见图 6-15）有一个对 `me` 的引用。它不需要更改，因为 `me` 是启动模组的玩家。无论是谁在玩多人 Spleef
    游戏，游戏启动器（`me`）是唯一发现任何人何时重生的人（这也被描述为 `me` 接收了事件）。


    ```

    events.when("player.PlayerRespawnEvent",SetupPlayer,me,false)

    ```


    图 6-15


    `main` 的最后一行是玩家移动时触发的事件。


    图 6-13


    - j. 修改最后一行，让 Player1（而不是 `me`）触发此事件。


    图 6-16 显示了你对 `main` 所做的的更改。


    ![](img/19c5471683adbccca3dbd246857a25f8_188_0.png)


    图 6-16


    - k. 当任何玩家移动时，会调用 `removeBlockStep` 函数。


    将 `removeBlockStep` 函数更改为确保是 Player1 触发了它，如图 6-17 所示。


    首先为确保是 Player1 移动添加一个 `if` 语句。


    ![](img/19c5471683adbccca3dbd246857a25f8_188_1.png)


    图 6-17


    - l. `removeBlockStep` 函数调用 `removeBlock`。在这个函数中，你发送了 `me`，但你需要发送移动玩家的名称。


    添加一个名为 `p_name` 的参数。图 6-18 显示了 `removeBlockStep`。


    ![](img/19c5471683adbccca3dbd246857a25f8_189_0.png)


    图 6-18


    - m. 在 `removeBlock` 函数中，重命名 `blocksDestroyed` 变量以更针对 Player1，然后添加另一个针对 Player2
    的破坏方块变量。


    图 6-19 显示了 `removeBlock`。


    > 提示：确保使用所有正确的变量，否则当 Player1 重生时，它会将 Player2 传回竞技场。


    '
