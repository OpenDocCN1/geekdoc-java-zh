    ```\n本周你将制作：\n- 落地时引发爆炸的掷物调制\n- Flag 的部分\n- 可以和朋友一起玩的多人版 Flag\n\n# 使用掷物调制\n\n\
    能够构建物体、发送无人或触发事件是有趣的；能够将调制投放到世界并让它们影响落的区域是非常强大的。在这个项目中，我将向你展示如何制作并运行将区块投放到世界并在落地时引发爆炸的调制。\n\
