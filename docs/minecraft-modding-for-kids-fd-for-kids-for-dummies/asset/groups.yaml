    # Make and Call New Functions


    A function is a way to group a lot of code and then name it. You make a new function
    (or define or write a new function) when you drag a function block, change its
    name, and add code inside it. You call a function when you drag the specific function
    block into another function, like the main function.


    Here are the primary characteristics of the main function:


    +   - Each mod has exactly one main function. Your mod starts at the main function,
    so you need to have at least one. If you had two or more, your mod wouldn''t know
    which one to start with. In fact, to avoid this type of confusion, each function
    must have a name that''s different from any other function in that mod.'
