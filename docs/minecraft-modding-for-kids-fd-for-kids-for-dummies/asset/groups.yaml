  - '[PAGE 153]


    # Making a Multilevel Minecraft Minigame: Monster Arena


    **Monster Arena is** a multilevel Minecraft minigame in which the player is placed
    in a large arena with monsters that spawn around a melon block. The player''s
    goal is to reach the melon cube without being attacked by the monsters. Every
    time the player reaches the melon cube, the moves on to the next level, with more
    monsters that are harder to defeat. The goal of the game is to reach the highest
    level possible before defeated by the monsters.


    In this project, I explain how to make a Minecraft mod that creates this game
    within Minecraft. Then you and your friends can play Monster Arena and see who
    can defeat the most monsters! Figure 5-1 shows you how the final game will look,
    with five creepers standing between you and the melon block.


    ![](img/19c5471683adbccca3dbd246857a25f8_153_0.png)'
  - '[PAGE 154]


    # Project 5: Making a Multilevel Minecraft Minigame


    ![](img/19c5471683adbccca3dbd246857a25f8_154_0.png)


    Figure 5-1


    # # Draw the Gameplay Loop


    Before you begin coding your game, you must draw the gameplay loop for the Monster
    Arena game. Figure 5-2 shows the first iteration of the loop, as described in
    this list:


    +   - Start: Build the arena

    - Goal: Break the melon block

    - Challenge: Add monsters

    - Reward: Level up


    In each iteration of the gameplay loop, you enhance each piece. To start out with,
    though, you have a simple arena with melon block, 1 monster, and 1 level.


    Iterate is a term from computer science that means “Do something over and over.”
    And, more importantly, every time you do that something, you make progress. For
    example, if you iterate on the gameplay loop, you should add a feature, such as
    add a new challenge or a new reward, to your game in at least one place in the
    loop.'
