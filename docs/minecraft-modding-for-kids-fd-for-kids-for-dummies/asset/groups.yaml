    # 项目 10：构建你的游戏


    浏览模组（mods）列表，点击你感兴趣的模组。你可以阅读它的描述以获取更多信息，然后点击 `Code` 按钮在你自己的 LearnToMod 账户中复制一份。


    给你的额外挑战是思考如何向别人制作的模组中添加一些有趣的内容。按照以下步骤操作：


    1. 测试该模组看看它的作用，并将其与预期功能进行比较。


    2. 阅读代码并将其画出来。（这某种程度上是设计代码的逆向步骤。）


    3. 为代码设计一个添加功能，并确定它应该放在哪里（例如，在它自己的函数中或另一个函数内部）。


    4. 在添加代码时，不断测试、测试、测试、测试！


    在你重混（remix）该模组后，将其分享给 LearnToMod 网站上的其他人，看看其他程序员如何将其进一步完善。


    # 与你的社区互动


    如果你在本书中一直遵循了我的说明，那么你现在是一个 LearnToMod Minecraft 模组开发者了！那里有一个庞大的程序员社区供大家学习和分享——他们和你一样热爱制作模组。如果你遇到困难并无法解决某个编程问题，请访问
    LearnToMod 论坛并提问。你甚至发现自己也可以为他人回答问题。


    永远不要不要提。学习的有效方法之一是无惧失败，这样你就能从错误中学习。


