    # 将你的模组连接到 Minecraft


    要开始之前，请点击第一个勋章“Minecraft Connect”（Minecraft 连接）。在这枚勋章中，你可以找到所有帮助你将模组连接到 Minecraft
    的指令，这样你就能在游戏中看到它们的效果。在本节中，我为你总结了这些步骤。


    要在 Minecraft 中运行你的模组，你应该拥有最新版本的 Minecraft。随着时间的推移，Minecraft 会通过更新不断改进，你应该始终使用最新版本，以便可以使用最新的
    LearnToMod 功能。如需查看你运行的是哪个版本的 Minecraft，请遵循以下步骤：


    - 1. 点击 Minecraft 启动界面左下角的“Edit Profile”（编辑配置）按钮，如图 1-6 所示。

    - 2. 在“Profile Name”（配置名称）文本框中创建一个新配置（参见图 1-7）。


    # 项目 1：开始 Minecraft 模组制作


    ![](img/19c5471683adbccca3dbd246857a25f8_26_0.png)


    3. 查看“Version Selection”（版本选择）部分（如图 1-8 所示），查看你正在使用的是哪个版本。它在“Version”（版本）文本框中。你应该使用列表顶部版本。在这种情况下，它是
    1.8 版本。


    # 第一部分：制作你的第一个 Minecraft 模组


    版本选择

    - 启用实验性开发版本（快照）

    - 允许使用旧的“Beta”Minecraft 版本（来自 2010-2011 年）

    - 允许使用旧的“Alpha”Minecraft 版本（来自 2010 年）

    使用版本：release 1.8


    图 1-8


    4. 点击屏幕底部的“Save Profile”（保存配置）按钮（参见图 1-7）。


    如果你使用的是较早的版本（例如 1.7 版本），你应该完成以下操作之一：


    - 将其更改为最新版本。

    - 创建一个新配置并将版本设置为最新版本。


    5. 在勋章上的文本框中输入你的 Minecraft 用户名，将其添加到 LearnToMod 账户，如图 1-9 所示。


    ![](img/19c5471683adbccca3dbd246857a25f8_27_0.png)


    图 1-9


    Minecraft 用户名必须与你创建时完全相同（包括大小写），这样你的模组才能连接到你的 Minecraft 账户。如果拼写不同，你就无法在 Minecraft
    中看到你的模组。


    6. 点击“Connect”（连接）按钮。


    弹出 Minecraft Connect 勋章，如图 1-10 所示。


    在 Minecraft Connect 勋章的文本框下方，你看到了“Success!”（成功！）字样，如图 1-11 所示。


