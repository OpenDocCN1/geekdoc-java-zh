- md: "\n## Project 8: Making a Multiplayer Minigame: Capture the Flag\n\n![](img/19c5471683adbccca3dbd246857a25f8_264_0.png)\n\
    \nYou should set up this object in the give_flag function. Follow these steps:\n\
    \n- 1. Create a new object named respawn_locations, as shown in Figure 8-56.\n\
    \n![](img/19c5471683adbccca3dbd246857a25f8_264_1.png)\n\n- 2. For each player,\
    \ create an empty list named players_respawn_locations, as shown in Figure 8-57.\n\
    \n![](img/19c5471683adbccca3dbd246857a25f8_265_0.png)\nFigure 8-57\n\n- 3. Place\
    \ the empty list in the new object you just created, with the name of the player\
    \ as the way to access the list, as shown in Figure 8-58.\n\n![](img/19c5471683adbccca3dbd246857a25f8_265_1.png)\n\
    Figure 8-58\n\nWhen the player places the flag, you add the location to her specific\
    \ list. Follow these steps:\n\n- 1. Create a function named setup_respawn_locations\
    \ with the parameter info, as shown in Figure 8-59.\n\n![](img/19c5471683adbccca3dbd246857a25f8_265_2.png)\n\
    Figure 8-59\n\n- 2. Call the setup_respawn_locations function from main when a\
    \ block_placed event happens, as shown in Figure 8-60.\n\n![](img/19c5471683adbccca3dbd246857a25f8_266_0.png)\n\
    Figure 8-60\n\n- 3. Create six new, local variables to gather the information\
    \ about who placed the block, as shown in Figure 8-61.\n\n```\nfunction setup_respawn_locations\
    \ with info:\n  set local block to info'BlockPlaced\n  set local block_type to\
    \ info'Type\n  set local block_location to info'Location\n  set local player to\
    \ info'Player\n  set local player_name to player'sDisplayName\n```\nFigure 8-61\n\
    \n- 4. Check to see whether the block that was placed is a flag_type block, as\
    \ shown in Figure 8-62.\n\n- 5. Create a local variable named player_respawn_list,\
    \ and get the actual list for the player who placed the block from the object\
    \ you created in the give_flag function, as shown in Figure 8-63.\n\n- 6. Check\
    \ to see whether the list exists, as shown in Figure 8-64. If it doesn't, the\
    \ player isn't one of the players in the game.\n\n![](img/19c5471683adbccca3dbd246857a25f8_267_0.png)\n\
    Figure 8-62\n\n![](img/19c5471683adbccca3dbd246857a25f8_267_1.png)\nFigure 8-63\n\
    \n![](img/19c5471683adbccca3dbd246857a25f8_267_2.png)\nFigure 8-64\n\n- 7. If\
    \ the list exists, add the block's location to the list using JavaScript, as shown\
    \ in Figure 8-65.\n\n![](img/19c5471683adbccca3dbd246857a25f8_268_0.png)\nFigure\
    \ 8-65\n\n## Respawn players at their flag locations\n\nThe final step to this\
    \ iteration of the CaptureFlag Mod is to make the players respawn at their flag's\
    \ location. Follow these steps:\n\n- Create a function named respawn_player with\
    \ the parameter info, as shown in Figure 8-66.\n\n![](img/19c5471683adbccca3dbd246857a25f8_268_1.png)\n\
    Figure 8-66\n\n- Add a call to respawn_player when a respawn_event happens. Use\
    \ the JavaScript block to do this, as shown in Figure 8-67.\n\n![](img/19c5471683adbccca3dbd246857a25f8_268_2.png)\n\
    Figure 8-67\n\n- 3. Create three local variables to get the data from the info\
    \ parameter and the list of respawn locations, as shown in Figure 8-68.\n\n![](img/19c5471683adbccca3dbd246857a25f8_269_0.png)\n\
    Figure 8-68\n\n- 4. Check to see whether respawn location exists for that player,\
    \ as shown in Figure 8-69.\n\n![](img/19c5471683adbccca3dbd246857a25f8_269_1.png)\n\
    Figure 8-69\n\n- 5. If a location exists, create a local variable to represent\
    \ the location of the flag, as shown in Figure 8-70.\n\n![](img/19c5471683adbccca3dbd246857a25f8_269_2.png)\n\
    Figure 8-70\n\n- 6. Two seconds (2000 milliseconds) after the player respawns,\
    \ teleport her to the location of the flag, as shown in Figure 8-71.\n\n![](img/19c5471683adbccca3dbd246857a25f8_270_0.png)\n\
    Figure 8-71\n\n## Testation 1\n\nCongratulations! You should have a pretty large\
    \ mod at this point, and you can see all of its code in Figure 8-72.\n\n![](img/19c5471683adbccca3dbd246857a25f8_270_1.png)\n\
    Figure 8-72\n\nNow it's time to test the mod. When you run it, these things happen:\n\
    \n- One glowstone and one light magic wand are added to inventory, and you go\
    \ into Survival mode.\n- When you use the magic wand, the exploding projectile\
    \ gets created.\n- Place the glowstone somewhere and then die. When you respawn,\
    \ you're taken to your glowstone.\n\n![](img/19c5471683adbccca3dbd246857a25f8_271_0.png)\n\
    Make sure that your code is working before you move on to Project 9.\n\n## Iterating\
    \ on an Existing Game: Capture the Flag\n\nIn this project, I show you how to\
    \ convert the single-player version of Capture the Flag to multiplayer. Playing\
    \ Capture Flag by yourself isn't much fun — you need to have at least one other\
    \ player. Before reading this project, complete all the code from Project 8. Your\
    \ code should look like Figure 8-73. Then test all the code you wrote in Project\
    \ 8. Always test the code before you start changes.\n\nFirst I show you how to\
    \ change the gameplay loop to include the second player and how to iterate over\
    \ the code to add the second player to each function. This ensures that the second\n\
    \n```\nfunction CastSpell with info & Player:\n  set local WandPlayer to info_copy_item_in_hand\n\
    \  set local Wand to\n  if Wand == ExplosionWand:\n    Send message Casting the\
    \ Exploding Wand to WandPlayer\n  if Wand == TeleportationWand:\n    Send message\
    \ Casting the Teleportation Wand to WandPlayer\n```\nis also getting a wand, getting\
    \ respawn locations, and being able to respawn at the respawn location. Look at\
    \ the gameplay loop shown in Figure 9-1 (and defined in Project 8): It shows that\
    \ you have completed all steps in the Start phase and you're facing a new challenge\
    \ — adding Player 2 to the game.\n\n![](img/19c5471683adbccca3dbd246857a25f8_273_0.png)\n\
    Figure 9-1\n\n## CHALLENGES: Second Player\n\nAfter you add a second player, you\
    \ need to add a way to beat the game. In this project, I walk you through the\
    \ last two iterations of the gameplay loop: adding player two and making someone\
    \ win.\n\n## Iteration 2: Add Player 2\n\nIn the following sections, I walk you\
    \ through the steps to add a second player to your Capture the Flag game. The\
    \ code you wrote in Project 8 was designed to make it easy to add players.\n\n\
    ## Project 9: Iterating on Gameplay Using an Existing Game\n\n### Add the new\
    \ player to your list\n\nTo add a second player, you first have to add the person\
    \ to the list of players in your code. Follow these steps:\n\n- 1. Click on the\
    \ star on the names list in the SetupPlayer function, as shown in Figure 9-2.\n\
    \n![](img/19c5471683adbccca3dbd246857a25f8_274_0.png)\nFigure 9-2\n\n- 2. Add\
    \ your friend's Minecraft username to the list, as shown in Figure 9-3. To avoid\
    \ getting errors, spell your friend's Minecraft username correctly.\n\n![](img/19c5471683adbccca3dbd246857a25f8_274_1.png)\n\
    Figure 9-3\n\n- 3. Put a loop around the player command block so that you're setting\
    \ all players to Survival mode, as shown in Figure 9-4.\n\n![](img/19c5471683adbccca3dbd246857a25f8_275_0.png)\n\
    Figure 9-4\n\n### Give all players wands\n\nTo give all players a wand, follow\
    \ these steps:\n\n- 1. In a new tab in your browser, go to mod.learntomod.com/programs/examples-magic_wands\
    \ and click Copy This Mod, as shown in Figure 9-5.\n\n![](img/19c5471683adbccca3dbd246857a25f8_275_1.png)\n\
    Figure 9-5\n\n- 2. Go to: mod.learntomod.com/book/mod and click on the Examples\
    \ Magic Wands mod, shown in Figure 9-6.\n\n- 3. Click on the Code box in the lower-right\
    \ corner, as shown in Figure 9-7.\n\nNow you can claim your own copy of the Magic\
    \ Wands badge, and you can edit it to give wands to more than one person.\n"
