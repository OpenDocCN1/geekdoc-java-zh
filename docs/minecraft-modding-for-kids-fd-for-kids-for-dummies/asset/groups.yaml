    The new gameplay loop should be simple and not have a lot. After you successfully
    make the multiplayer game, you can always revisit the gameplay loop and make it
    more interesting, such as making the arena bigger.


    # Iteration 1: Refactor the Single-Player Version


    Before you add a second player to the game, you need to do a bit of refactoring.
    Instead of referring to me, you should refer to a specific player who is defined
    in your mod. In this section, I walk you through the steps to do it — while setting
    up for the multi-player version.'
