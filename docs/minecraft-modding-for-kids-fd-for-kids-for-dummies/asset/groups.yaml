- md: "\n# Project 9: Iterating on Gameplay Using an Existing Game\n\n- Add the rules\
    \ of Spleef (see Project 4) to your game with an arena. This method makes it more\
    \ likely that you'll die — even without your opponent attacking, because you could\
    \ simply fall through the floor.\n- Set a timer. Set one timer to limit how much\
    \ time you can take to hide flags, and then set another timer to limit how long\
    \ you have to find the glowstone flags.\n\nWhat are your ideas for playing? Be\
    \ sure to share them on the LearnToMod forums at forum.learntomod.com.\n\n## Part\
    \ 4\n## Building Your Own Minecraft Minigame\n\n![](img/19c5471683adbccca3dbd246857a25f8_290_0.png)\n\
    \n## This week you'll build:\n\n- Your own creative and challenging game to play\
    \ inside Minecraft......................281\n\n## Building Your Own Game\n\nThroughout\
    \ this book, I describe lots of coding concepts and game design strategies. In\
    \ this project, however, I guide you through the steps to create your own Minecraft\
    \ mod. It's time to put your new skills to use in a new and creative project that\
    \ you come up with on your own.\n\nComing up with new mod ideas can be a fun process\
    \ all on its own. We get together with friends and ask them what they wish they\
    \ could do in Minecraft, or watch YouTube videos for inspiration.\n\n![](img/19c5471683adbccca3dbd246857a25f8_292_0.png)\n\
    \n## Part 4: Building Your Own Minecraft Minigame\n\n### Sketch Out Your Mod\n\
    \nThe first thing to do when designing a new mod is to sketch out the result you\
    \ want. Keep these guidelines in mind when you're sketching out your mod:\n\n\
    - Use graph paper. You can sketch out your mod more accurately on graph paper\
    \ than on blank paper. Figure 10-1 shows what graph paper looks like. You can\
    \ look at each box on the graph paper as a single block in Minecraft.\n\n![](img/19c5471683adbccca3dbd246857a25f8_293_0.png)\n\
    \nFigure 10-1\n\n- Math blocks can be even more useful than graph paper. You can\
    \ create the 3D effect, where you almost feel like you're walking around in the\
    \ mod you're designing.\n- Using blank paper has its place, too. Sometimes you\
    \ just need to get a general idea of what your mod will look like or what it will\
    \ do, so you don't need to add lots of detail.\n\n## Project 10: Building Your\
    \ Own Game\n\n- Build it in Minecraft first. If you’re designing a mod in which\
    \ you build a structure such as a roller coaster, build the structure by hand\
    \ in Minecraft first, to form an idea of its construction.\n- Keep paper and a\
    \ pencil hand. Even after you sketch your mod, you may need to jot down ideas\
    \ or work through a problem in your mod.\n\n### Plan Your Mod\n\nAfter you sketch\
    \ your mod, you can plan what functions you need, such as one for setting up the\
    \ mod’s scene. You don’t have to be precisely correct, but you should at least\
    \ have an idea of what functions you will have.\n\nHere are a few suggestions\
    \ for planning your mod:\n\n- Draw circles around structures, or even parts of\
    \ structures, and name them.\n- For parts of your mod that aren’t structures,\
    \ like events, draw a box with the following parts in it:\n    - At the top: The\
    \ name of the function\n    - Inside the box: a list of actions the function should\
    \ perform\n    - Ask yourself how data will be passed around your functions. Will\
    \ it have parameters? Which variables should be local, and which should be global\
    \ (see Project 7)?\n\nAfter you have an understanding of the code you want to\
    \ write, you can head to the LearnToMod site and start outlining, as described\
    \ later in this project, in the section “Outline Your Mod.\"\n\n## Part 4: Building\
    \ Your Own Minecraft Minigame\n\n### Draw the Gameplay Loop\n\nIf you're making\
    \ a minigame, remember to draw the gameplay loop, described fully in Project 4.\
    \ You can use the drawing in Figure 10-2 as a template for the gameplay loop.\n\
    \n![](img/19c5471683adbccca3dbd246857a25f8_295_0.png)\n\nFigure 10-2\n\nHere are\
