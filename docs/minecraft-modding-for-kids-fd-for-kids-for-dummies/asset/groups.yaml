    # 关于作者


    Sarah Guth, Ph.D, 是一位计算机科学家和教育者，曾在微软、NASA-JPL 和 ViaSat 工作。她现在是 ThoughtSTEM 的首席技术官
    (CTO) 和联合创始人，在那里通过 Minecraft 模组教授计算机科学。


    Stephen Foster, Ph.D, 是一位教育者和软件工程师，职业生涯一直在开发用于教学的软件。他是 ThoughtSTEM 的 CEO，并担任其技术的首席开发者（包括
    LearnToMod）。他为孩子们通过编程学习铺平了道路。


    Lindsey Handley, Ph.D, 是一位教育者，对 K-12 STEM 教育充满热情。她目前是 ThoughtSTEM 的首席运营官，管理跨 25
    个地的课后课程和营地。Lindsey 还为想要使用 LearnToMod 软件进行课堂教学的老师提供支持。


    # 献辞


    我们将这本书献给我们的亲密朋友和家人，他们不仅在我们写作期间支持了我们，也成就了今天的我们。我们特别将这本书献给 Adrian Guth，他在深夜与 Sarah
    在 Spleef、怪物竞技场和夺旗赛中战斗。如果没有 Adrian，这些游戏将毫无意义。


    # 作者致谢


    感谢在制作 Minecraft 时付出的所有努力，这是一款全球范围内数百万玩家喜爱的有趣且开放的游戏。没有 Minecraft，我们就无法制作 LearnToMod，也无法编写这本书。我们还要感谢协助
    LearnToMod 的努力工作者——通过他们快速且创造性的解决问题能力，我们能够帮助孩子们用 Minecraft 创造更多可能。当然，我们要感谢全球范围内玩
    Minecraft 的孩子们，你们启发了我们通过 Minecraft 进行教学。


    # 出版社致谢


