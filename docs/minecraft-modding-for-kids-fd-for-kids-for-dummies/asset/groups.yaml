    ## Accessing the LearnToMod Software


    To access LearnToMod software, use the access key located on the front cover of
    this book. Then all you need to do is follow these steps to access your new LearnToMod
    account:


    - 1. Go to http://mod.learntomod.com. The first time you log in, the site redirects
    you to ThoughtSTEM''s login page to create your account.

    - 2. Use the Sign Up window (located below the Log In window) to create your LearnToMod
    account.

    - 3. After you create your LearnToMod account, you are redirected to a page that
    asks for your access key. Copy and paste the access key that appears in the inside
    front cover of this book.

    - 4. Choose a LearnToMod nickname — any name you want!

    - Now you can start unlocking badges to learn how to mod!


    ## Minecraft Modding For Kids


    LearnToMod was developed to guide students just like you through the challenges
    of Minecraft modding, to present coding concepts and demonstrate how much fun
    it can be to start making mods. LearnToMod has over 200 badges to guide you in
    the creation of simple mods; however, you can also make your own creative mods.


    The earlier chapters of this book are pretty simple, but later mods are larger,
    more complex, and more difficult. They are intended to be completed sequentially,
    and sometimes they build on each other — you''re welcome to jump around and try
    harder projects first. After you have made a few mods with the help of this book,
    millions of mods are waiting for you. You can go to the LearnToMod site and continue
    earning badges, or continue creating and sharing mods with other modders. Even
    more, you''re learning how to code! You can also go out and find other languages
    and applications which to code. Coding is exciting, and I''m glad that you have
    chosen to not only learn code but also transform the way you and your friends
    play Minecraft!


    ## Beyond the Book


    I''m making some extra content that you won''t find in this book. Go online to
    find these items:


    - An online Cheat Sheet for LearnToMod and basic modding is available at www.dummies.com/cheatsheet/minecraftmodding.
    The description of basic skills is condensed into the Cheat Sheet shows the fundamentals
    of design and coding.

    - Online articles covering additional topics are available at www.dummies.com/extras/minecraftmodding.

    - You can find updates to this book, if necessary, www.dummies.com/updates/minecraftmodding.


    ## Where to Go from Here


    ### Part 1 Making Your First Mod


    This week you''ll:


    - Sign up for LearnToMod and make your first mod.

    - Learn about the different badge types in LearnToMod, and start earning badges.

    - Use invisible robots to build structures inside Minecraft and protect them with
    lightning.


    ## Getting Started


    In this book, I show you how to write minigame Minecraft mods. A minigame Minecraft
    mod is a game that you play inside Minecraft. You can see how to make several
    minigames and gain the skills you need to perfect a minigame of your own creation.


    The LearnToMod online software teaches you how to make modifications that you
    can run in the multiplayer version of Minecraft. With hundreds of badges to guide
    you through various programming concepts and mods, you''ll gain the skills necessary
    to make creative mods of your own. You should have some basic familiarity with
    playing Minecraft, but you don''t need to be an expert. All you need is the computer
    version of Minecraft and an Internet connection.


