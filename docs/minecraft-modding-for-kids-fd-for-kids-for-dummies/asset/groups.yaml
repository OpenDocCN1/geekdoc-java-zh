    # Make More Iterations: Be Creative and Unique


    After you have created a fully functional, multilevel Monster Arena minigame,
    you can continue iterating on the gameplay loop to make even more challenges and
    rewards and to set different goals.


    # Project 5: Making a Multilevel Minecraft Minigame


    You can even make the arena more unique, such as adding patterns to the platform,
    as you can see in Figure 5-1.


    A more challenging enhancement is to add random monsters at each level. For example,
    at Level 1 you add 5 creepers, and at Level 2 you add a total of 10 monsters that
    are (randomly) creepers or zombies. At Level 3, you add a total of 15 monsters
    that are (randomly) creepers, zombies, or spiders. Figure 5-40 shows how to add
