    ## 在 Minecraft 中制作单人游戏：Spleef


    你可以制作的最复杂（但也有趣！）的 Minecraft 模之一是 Minecraft 内部的一个小游戏。在这个项目中，我将引导你制作 Spleef，这是一种玩家在平台上行走并通过踩踏方块让方块消失的游戏。使用这个简单的想法，你可以制作出
    Spleef 的许多变体——例如：


    - 玩家必须避免掉入你在平台下方放置的岩浆。

    - 在你在平台下方放置岩浆并在竞技场内放置其他实体后，玩家尝试让其他实体掉入岩浆。

    - 在游戏中，你可以添加玩家必须收集才能生存的物品。

    - 在多人版本中，玩家可以尝试让互相掉落。


    ![](img/19c5471683adbccca3dbd246857a25f8_122_0.png)


    ## 112 第二部分：制作你的第一个小游戏


    在这个项目中，我将引导你制作 Spleef，这是一种玩家在平台上行走并通过踩踏方块让方块消失的游戏。使用这个简单的想法，你可以制作出 Spleef 的许多变体——例如：


    - 玩家必须避免掉入你在平台下方放置的岩浆。

    - 在你在平台下方放置岩浆并在竞技场内放置其他实体后，玩家尝试让其他实体掉入岩浆。

    - 在游戏中，你可以添加玩家必须收集才能生存的物品。

    - 在多人版本中，玩家可以尝试让互相掉落。


    ### 引入游戏循环


    在跳入像 Spleef 这样的游戏之前，你应该理解游戏循环。游戏循环是玩家重复执行的动作循环。在 Spleef 中，循环是：在平台上移动、点击方块、并避免掉入岩浆。随着游戏的进行，随着更多的方块被破坏，平台会不断缩小，玩家面临的挑战也越来越大。


    图 4-1 显示了游戏循环。


    ![](img/19c5471683adbccca3dbd246857a25f8_123_0.png)


    ## 项目 4：在 Minecraft 中制作单人游戏


    - 目标：添加获胜和失败的方法- 挑战：让获胜变得困难。

    - 奖励：让玩家想要赢。

    - 开始：创建基础场景


    要开始制作 Spleef，你首先需要创建一个平台。这可以通过放置方块网格来实现。一旦创建了平台，你需要编写代码允许玩家在点击方块时将其破坏。这可以通过使用
    `onBlockBreak` 事件来实现。最后，你需要添加逻辑来检查玩家是否掉入了岩浆。这可以通过检查玩家的坐标来实现。如果他们接触了岩浆，玩家就会失去生命。


    为了让游戏变得困难，你可以添加更多挑战。例如，你可以随着时间的推移让平台变小，或者添加玩家必须通过的移动障碍。


    ![](img/19c5471683adbccca3dbd246857a25f8_124_0.png)


    ## 114 第二部分：制作你的第一个小游戏


    你为游戏添加最简单的功能：生命值。你会在游戏中添加逻辑，当玩家生命值耗尽时询问他们是否想要重生。再次，在这一点游戏可能不好玩，但当你到达下一个步骤（挑战后的奖励）时，你开始添加敌人以及玩家赢回生命值的方法。


    ### 挑战：让获胜变得困难


    当你开始让玩家难以赢得时，你的游戏就会变得有趣。起初，你可能想提供一个小挑战。别担心：随着你循环游戏循环，你可以迭代到更困难的挑战。


    例如，在上一节中描述的简化 Minecraft 游戏中，你可能添加的第一个挑战是一个苦力怕。你会在世界中放入一个看到玩家后就会尝试攻击的苦力怕。这个挑战让游戏比以前变得困难了。这个游戏可能不是很好玩，因为玩家只会受伤而无法防御，但随着你循环游戏循环，你可以开始添加苦力怕——甚至其他生物，以及玩家用于防御的物品。


    '
