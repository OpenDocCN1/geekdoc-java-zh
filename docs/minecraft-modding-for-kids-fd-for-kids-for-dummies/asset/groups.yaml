    # Use Drones to Build Structures in Minecraft


    Building structures is made much easier when you can use drones. A drone is an
    invisible robot that can move around and place blocks and entities at its location.
    In this section, you start building structures in Minecraft using drones — knowledge
    that comes in handy when you need to build large structures.


    For example, in Project 4, I show you how to make the game of Spleef, which requires
