    # Share Your Mods with Friends


    Writing mods and testing them in Minecraft is fun, but being able to have your
    friends test them in their Minecraft worlds can help you and your friends come
    up with creative mods, because you can get new ideas.


    After you write some code, have your friends test it for you — it''s a good way
