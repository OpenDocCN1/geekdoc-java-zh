    and the melon block are on opposite sides of the arena. Now test your mod. Figure
    5-15 shows the scene you see when you run the mod, and Figure 5-16 gives you the
    bird''s-eye view.'
- md: "\n# Project 5: Making a Multilevel Minecraft Minigame\n\n![](img/19c5471683adbccca3dbd246857a25f8_164_0.png)\n\
    Figure 5-15\n\n![](img/19c5471683adbccca3dbd246857a25f8_164_1.png)\nFigure 5-16\n\
    \n## Challenge: Add monsters to the arena\n\nAfter you have your game all set\
    \ up, you can start making it playable. On the first iteration of the gameplay\
    \ loop, you should add one monster for the player to defeat, or to at least get\
    \ around. This time, write the code to spawn the monster in a separate function\
    \ from the beginning.\n\n## Part 2: Making Your First Minecraft Minigame\n\nFigure\
    \ 5-17 shows the code you need to add to make 1 monster spawn near the melon block.\
    \ Note that before you spawn the creeper, you move the drone 1 block away from\
    \ the melon block so that the creeper doesn't spawn inside the block and immediately.\n\
    \n![](img/19c5471683adbccca3dbd246857a25f8_165_0.png)\nFigure 5-17\n\nNow when\
    \ you test your game, you see a screen similar to Figure 5-18.\n\n![](img/19c5471683adbccca3dbd246857a25f8_165_1.png)\n\
    Figure 5-18\n\n## Reward: Replay the first level!\n\nIn future iterations of the\
    \ gameplay loop, you reward players with levels that are more difficult to complete.\
    \ For this first iteration, however, let people replay the first level.\n\nTo\
    \ do this, you have to make an event (as described in Project 4) that calls the\
    \ function `block_break` whenever the player breaks any block. Figure 5-19 shows\
    \ how to add this `event` call into the main function.\n\n![](img/19c5471683adbccca3dbd246857a25f8_166_0.png)\n\
    Figure 5-19\n\nThe `on_block_break` function checks to see whether the melon block\
    \ was broken. If it was, you see the message \"Yay! You broke the Melon Block!\"\
    \ Figure 5-20 shows the `on_block_break` function.\n\n![](img/19c5471683adbccca3dbd246857a25f8_166_1.png)\n\
    Figure 5-20\n\nIn addition to congratulating the player for breaking the block,\
    \ you want that person to restart the level. To do this, you add two variables\
    \ to the `SetupGame` function: one that keeps track of where the player should\
    \ start out and one that indicates where the melon block should be placed. Figure\
    \ 5-21 shows how to add these two variables.\n\n![](img/19c5471683adbccca3dbd246857a25f8_167_0.png)\n\
    \n```\nfunction SetupGame():\n  for d in direction backward distance 18\n    Move\
    \ Drone d\n  for d in direction up distance 2\n    Teleport player to location\
    \ d\n  for PlayerStartLocation to d's location\n    for d in direction forward\
    \ distance 33\n      Drone d places block of type MELON_BLOCK\n  for MelonLocation\
    \ to d's location\n    spawn_monster\n```\n5-21\n\nNow you can write a ResetGame\
    \ function that:\n\n- Destroys all monsters in the arena\n- Teleports the player\
    \ back to the starting position\n- Moves Drone d back to the melon block's starting\
    \ position\n- Places a new melon block\n- Spawns monsters again\n\n5-22 shows\
    \ this new function, and Figure 5-23 shows how to call it from the on_block_break\
    \ function.\n\n## Test: Iteration 1 completed\n\nAfter you have completed the\
    \ four parts of Iteration 1, you can test your game and make sure that everything\
    \ is working correctly. Your code should look just like Figure 5-24.\n\n![](img/19c5471683adbccca3dbd246857a25f8_168_0.png)\n\
    Figure 5-22\n\n![](img/19c5471683adbccca3dbd246857a25f8_168_1.png)\nFigure 5-23\n\
    \n![](img/19c5471683adbccca3dbd246857a25f8_168_2.png)\nFigure 5-24\n\n> REMEMBER\n\
    > When testing, develop a series of test cases and predictions so you can make\
    \ sure everything that you've written has been tested (see Project 4, the section\
    \ about planning).\n\n## Iteration 2: Add Levels\n\nOn the second iteration of\
    \ the gameplay loop, you can add more levels to your game. You can also take this\
    \ time to make the arena unique or change the item you make the player break to\
    \ go to the next level.\n\n### Start: Make the arena unique\n\nAdd some designs\
    \ to the arena floor. In Figure 5-25, you can see where I used WorldEdit commands\
    \ to make one hollow cylinder of glass and one of diamond. You can see the changed\
    \ arena in Figure 5-26. Take the time to be creative and make your own design\
    \ in either the platform or the fences. You might even want to add a ceiling to\
    \ the arena!\n\n![](img/19c5471683adbccca3dbd246857a25f8_169_0.png)\n\n![](img/19c5471683adbccca3dbd246857a25f8_170_0.png)\n\
    Figure 5-26\n\nIf you add a ceiling, start your player inside the arena. Otherwise,\
    \ they will get locked out.\n\n### Goal: Wait until later iteration\n\nSometimes,\
    \ when you're iterating through the gameplay loop, you don't want to make a change\
    \ in one of the sections, such as when your goal is still the same (to break a\
    \ melon block). On Iteration 2, you still want the goal to be to break the melon\
    \ block so you don't have to make any changes to the goal.\n\n### Challenge: Add\
    \ monsters\n\nManeuvering around one creeper isn't too difficult. On Iteration\
    \ 2, you should add more monsters that the player has to avoid and still break\
    \ the melon block. By making one small change to spawn_monster (see Figure 5-27),\
    \ you can spawn 5 creepers instead of 1.\n\n![](img/19c5471683adbccca3dbd246857a25f8_170_1.png)\n\
    Figure 5-27\n\nFigure 5-28 shows how the game becomes more challenging with more\
    \ creepers blocking the melon block.\n\n![](img/19c5471683adbccca3dbd246857a25f8_171_0.png)\n\
    Figure 5-28\n\n## Reward: Add a second level\n\nIn Monster Arena, levels are differentiated\
    \ by which monsters the player faces. To add a second level, the first thing you\
    \ have to do is create a variable named Level that keeps track of which level\
    \ the player is on. This variable should start at 1 because the player starts\
    \ on the first level.\n\nYou should also create a list of monsters. Name the list\
    \ Monsters and add two types of monsters: creepers and zombies.\n\n Figure 5-29\
    \ shows how to create these two variables in the SetupGame function.\n\nNow that\
    \ you have a list of monsters to choose from, you can change the spawn_monster\
    \ function to choose which monsters to spawn based on the level the player is\
    \ on. Figure 5-30 shows how to choose the correct item from the list. Finally,\
    \ you have to increase the level variable every time the player breaks the melon\
    \ block. If the player reaches the final level (which is now Level 2), notify\
    \ them that the game is finished; otherwise, the game should reset with the new\
    \ monsters.\n\n```\nfunction SetupGame() {\n  set Drone to new Drone\n  Move Drone\
    \ in direction backward distance 15\n  Move Drone in direction up distance 20\n\
    \  Teleport player to location of d\n  set PlayerStart.location to d location\n\
    \  Move Drone in direction forward distance 33\n  set d to MELON_BLOCK\n  set\
    \ MelonBlock.location to d\n  set Level to 1\n  set Monsters to create flat with\
    \ EntityType creeper\n  set EntityType zombie\n  spawn_monster()\n}\n```\nFigure\
    \ 5-29\n\n```\nfunction spawn_monster() {\n  move in direction backward distance\
    \ 2\n  set Monster to in at Monsters\n  set Level to Level\n  say \"SPAWN\"\n\
    \  spawn cree at types Monster\n}\n```\nFigure 5-30\n\nFigure 5-31 shows the changes\
    \ to on_block_break that need to happen to start the new level.\n\n## Test: Make\
    \ sure both levels work\n\nAfter you have added the changes to the spawn_monster\
    \ function, test your mod. When you start the test, you should see five creepers,\
    \ as shown in Figure 5-32.\n\n![](img/19c5471683adbccca3dbd246857a25f8_173_0.png)\n\
    Figure 5-31\n\n![](img/19c5471683adbccca3dbd246857a25f8_173_1.png)\nFigure 5-32\n\
    \nIf you break the melon block, the game resets and you see five zombies, as shown\
    \ in Figure 5-33.\n\nIf you break the melon block again, the game doesn't change,\
    \ but you see the message \"Yay! You beat all of the levels! Good Job! (see Figure\
    \ 5-34).\n"
  mdcn: "\n\n# 项目 5：制作一个多级 Minecraft 小游戏\n\n![](img/19c5471683adbccca3dbd246857a25f8_164_0.png)\n\
    图 5-15\n\n![](img/19c5471683adbccca3dbd246857a25f8_164_1.png)\n图 5-16\n\n## 挑战：在竞技场中添加怪物\n\
    \n在你设置好所有游戏后，就可以开始让它变得可玩了。在游戏循环的第一次迭代中，你应该添加一个怪物让玩家击败，或者至少让玩家可以避开。这一次，从一开始就编写代码，在一个单独的函数中生成怪物。\n\
    \n## 第 2 部分：制作你的第一个 Minecraft 小游戏\n\n图 5-17 显示了你需要添加的代码，以便让 1 个怪物在西瓜块附近生成。注意，在生成苦力怕（creeper）之前，你将无人机移动到距离西瓜块\
    \ 1 个块的地方，这样苦力怕就不会生成在块内部并立即爆炸。\n\n![](img/19c5471683adbccca3dbd246857a25f8_165_0.png)\n\
    图 5-17\n\n现在当你测试游戏时，你会看到一个类似于图 5-18 的屏幕。\n\n![](img/19c5471683adbccca3dbd246857a25f8_165_1.png)\n\
    图 5-18\n\n## 奖励：重玩第一关！\n\n在游戏循环的后续迭代中，你将通过更难完成的关卡来奖励玩家。但对于第一次迭代，让玩家重玩第一关。\n\n\
    要做到这一点，你需要创建一个事件（如项目 4 中所述），每当玩家破坏任何块时，它都会调用 `block_break` 函数。图 5-19 显示了如何将此 `event`\
    \ 调用添加到主函数中。\n\n![](img/19c5471683adbccca3dbd246857a25f8_166_0.png)\n图 5-19\n\n\
    `on_block_break` 函数会检查西瓜块是否被破坏。如果是，你就会看到消息“耶！你破坏了西瓜块！”。图 5-20 显示了 `on_block_break`\
    \ 函数。\n\n![](img/19c5471683adbccca3dbd246857a25f8_166_1.png)\n图 5-20\n\n除了祝贺玩家破坏块之外，你还希望该玩家重启关卡。要做到这一点，向\
    \ `SetupGame` 函数中添加两个变量：一个用于跟踪玩家应该开始的位置，另一个用于指示西瓜块应该放置的位置。图 5-21 显示了如何添加这两个变量。\n\
    \n![](img/19c5471683adbccca3dbd246857a25f8_167_0.png)\n\n```\nfunction SetupGame():\n\
    \  for d in direction backward distance 18\n    Move Drone d\n  for d in direction\
    \ up distance 2\n    Teleport player to location d\n  for PlayerStartLocation\
    \ to d's location\n    for d in direction forward distance 33\n      Drone d places\
    \ block of type MELON_BLOCK\n  for MelonLocation to d's location\n    spawn_monster\n\
    ```\n5-21\n\n现在，你可以写一个 `ResetGame` 函数，该函数可以：\n\n- 破坏竞技场中的所有怪物\n- 将玩家传回起始位置\n-\
    \ 将无人机 d 移回西瓜块的起始位置\n- 放置一个新的西瓜块\n- 再次生成怪物\n\n5-22 显示了这个新函数，图 5-23 显示了如何从 `on_block_break`\
    \ 函数中调用它。\n\n## 测试：迭代 1 完成\n\n在你完成迭代 1 的四个部分后，你就可以测试你的游戏并确保一切都运行正常。你的代码看起来应该就像图\
    \ 5-24一样。\n\n![](img/19c5471683adbccca3dbd246857a25f8_168_0.png)\n图 5-22\n\n![](img/19c5471683adbccca3dbd246857a25f8_168_1.png)\n\
    图 5-23\n\n![](img/19c5471683adbccca3dbd246857a25f8_168_2.png)\n图 5-24\n\n> 记住\n\
    > 在测试时，开发一系列测试用例和预测，这样你就可以确保你所写的所有内容都经过了测试（参见项目 4 中关于计划的章节）。\n\n## 迭代 2：添加关卡\n\
    \n在游戏循环的第二次迭代中，你可以为你的游戏添加更多关卡。你也可以利用这段时间让竞技场变得独特性，或者改变玩家破坏以进入下一关的物品。\n\n### 开始：让竞技场具有独特性\n\
    \n在竞技场地板上添加一些设计。在图 5-25 中，你可以看到我如何使用 WorldEdit 命令制作了一个空心玻璃圆柱和一个钻石圆柱。你可以在图 5-26\
    \ 中看到改变后的竞技场。你可以花时间为竞技场添加你自己的设计。\n\n![](img/19c5471683adbccca3dbd246857a25f8_169_0.png)\n\
    \n![](img/19c5471683adbccca3dbd246857a25f8_170_0.png)\n图 5-26\n\n### 目标：等待关卡\n\
    \n有时，当你处于游戏循环时，你需要等待西瓜块被破坏。在迭代 2 中，你应该让游戏变得更有挑战。\n\n### 挑战：添加怪物\n\n避免苦力怕并不困难。在迭代\
    \ 2 中，你应该在破坏西瓜块时生成更多怪物。图 5-27 显示了由于怪物的存在游戏如何变得更具挑战性。\n\n![](img/19c5471683adbccca3dbd246857a25f8_171_0.png)\n\
    图 5-27\n\n### 奖励：添加第二个关卡\n\n在竞技场中，关卡是通过玩家面对的怪物来区分的。为了添加第二个关，你需要做的第一件事是创建一个名为 `Level`\
    \ 的变量来跟踪玩家处于哪一关。该变量应该从 1 开始，因为玩家处于第一关。\n\n你应该创建一个怪物列表。将列表命名为 `Monsters` 并添加两种怪物。图\
    \ 5-29 显示了如何在 `SetupGame` 函数中创建这些变量。\n\n现在你有了可以选择的怪物列表，可以修改 `spawn_monster` 函数，根据玩家所在的关卡来选择怪物。最后，每当玩家破坏西瓜块时，你必须增加\
    \ `Level` 变量。如果玩家达到了最终关卡（现在是 Level 2），则通知他们游戏结束；否则，游戏将带有新的怪物重置。\n\n图 5-28 显示了由于怪物的存在游戏如何变化。\n\
    \n![](img/19c5471683adbccca3dbd246857a25f8_170_0.png)\n图 5-28\n\n图 5-31 显示了为了开启新关卡需要对\
    \ `on_block_break` 进行的。\n\n### 测试：确保两个关卡都正常工作\n\n在你对 `spawn_monster` 函数进行修改后，测试你的模组。当你开始测试时，你应该看到五个苦力怕，如图\
    \ 5-32 所示。\n\n如果你破坏了西瓜块，游戏将重置，你会看到五个僵尸，如图 5-33 所示。\n\n如果你再次破坏西瓜块，游戏不会发生变化，但你会看到消息“耶！你赢得了所有关卡！干得好！（参见图\
    \ 5-34）”。\n\n"
