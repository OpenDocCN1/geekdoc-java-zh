    # Making Multiplayer Minigame: Capture the Flag


    In Project 7, I show you how to create a Projectile library, which you can use
    to create a mod that causes an explosion and create a mod that teleports you to
    another location. With only one, you can create a big effect! In this project,
    I show you how to create a Capture the Flag game where you use these wands to
    defend your flags.


    In the early 1980s, Scholastic released a Capture the Flag-style game on one of
    the first home computers. Since then, many games have used this as a reference
    for their games (Call of Duty, Halo, and Team Fortress 2 are just a few) because
    of the competition it inspires. In this project, I show you how to turn Minecraft
    into a Capture the Flag game and how to craft however you like!


    ![](img/19c5471683adbccca3dbd246857a25f8_237_0.png)


    # Project 8: Making a Multiplayer Minigame: Capture the Flag


    ## Plan the Capture-Flag Game


    Before you start coding, you should plan your two-player Capture the Flag game
    on paper. To plan, think about the game in layers. Layer 1 is where you set up
    the game for Capture the Flag. Layer 2 is where you set up your libraries to use
    during Capture the Flag. Figure 8-1 shows what happens at each layer, and the
    rest of this project walks you through the steps to build the Capture the Flag
    minigame.


    ![](img/19c5471683adbccca3dbd246857a25f8_238_0.png)


    Figure 8-1


    ## Prepare the Capture-the-Flag Mod


    First, prepare the Capture the Flag mod on Layer 1:


    - 1. Select Mod from the menu at the top of the homepage.


    # 228 Part 3: Designing and Building a Multiplayer Minigame


    - 2. Create a new mod named CaptureFlag, as shown in Figure 8-2.


    ![](img/19c5471683adbccca3dbd246857a25f8_239_0.png)


    - 3. Click the arrow (as shown in Figure 8-3) to enter the newly created mod,
    as shown in Figure 8-3.


    ![](img/19c5471683adbccca3dbd246857a25f8_239_1.png)


    - 4. Click the Code box, as shown in Figure 8-4.


    Now outline the mod that you want to create. Start out with a single player so
    that you can test the mod on your own.


    # Project 8: Making a Multiplayer Minigame: Capture the Flag


    ![](img/19c5471683adbccca3dbd246857a25f8_240_0.png)


    Figure 8-4


    ## Make the gameplay loop


    Imagine a gameplay loop for this iteration of the Capture the Flag mod. Figure
    8-5 shows a simple gameplay loop with four iterations:


    - **Start:** Make 1 player with 1 flag and 1 wand. A player who dies should respawn
    at their flag.

    - **Challenge:** Add a second player with the same capabilities as Player 1.


    ![](img/19c5471683adbccca3dbd246857a25f8_240_1.png)


    Figure 8-5


    # Part 3: Designing and Building a Multiplayer Minigame


    - **Goal**: The goal is to destroy the other person''s flag.

    - **Rewards**: A player who destroys all of their opponent''s flag wins the game.


