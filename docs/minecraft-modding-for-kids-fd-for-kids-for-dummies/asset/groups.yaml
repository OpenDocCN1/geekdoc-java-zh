    # Build a One-Click House in Minecraft


    In this section, I describe how to make a mod that builds a house. I like to refer
    to this process as building a one-click house, because whenever you''re in Minecraft
    with one-click capability, you can have a house.


    The following sections describe how to build a house in Minecraft. In the same
    way I show you how to build the tower, I tell you how to design, and then build,
    the house. This house can serve as a starting point for building a castle.


    Start a new mod titled Simple_House, as shown in Figure 3-44.'
