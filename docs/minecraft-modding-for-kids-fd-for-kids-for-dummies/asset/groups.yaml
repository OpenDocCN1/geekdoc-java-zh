    the function calls to your magic_wands library functions, like you did in Project
    8. Move the call to the magic_wands.init function to the SetupPlayer function,
    and make sure that your call to give_wands and the light_green wand is from your
    library, not from the examples library. Your SetupPlayer function should look
    like Figure 9-17.


    - 3. Change the call to the item_in_hand function in the CastSpell function to
    your library instead of to the examples library, as shown in Figure 9-18.


    ## Project 9: Iterating on Gameplay Using an Existing Game


    ![](img/19c5471683adbccca3dbd246857a25f8_280_0.png)


