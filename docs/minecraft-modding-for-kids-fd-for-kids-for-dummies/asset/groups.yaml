    # 项目 8：制作一个多人迷你游戏：抢夺旗帜


    ## 给玩家一个旗帜


    在玩家拥有可以施术的魔杖后，你应该给她一个旗帜来保护。按照以下步骤操作：


    - 1. 创建一个名为 `give_flag` 的函数，接受一个名为 `flag_type` 的参数，如图 8-50 所示。


