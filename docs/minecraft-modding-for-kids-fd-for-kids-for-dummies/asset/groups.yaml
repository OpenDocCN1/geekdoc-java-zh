    ## 获取“说 Hello”勋章：缺失版


    点击勋章打开“Saying Hello（缺失）”挑战。当你获得该勋章时，代码会将 Cat Stevens 一首歌的歌歌词内容打印到屏幕上（见图 2-11）。


    ![](img/19c5471683adbccca3dbd246857a25f8_57_1.png)


    图 2-11


