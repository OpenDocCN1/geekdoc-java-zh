    ### Part 1: Making Your First Minecraft Mod


    In this chapter, I explain what a mod is, describe how to use the LearnToMod online
    software and how to connect to the LearnToMod multiplayer Minecraft Server, and
    spell out how to use the basic tools, such as invisible robots, that you need
    in order to make your own, fun-filled mods.


    ## Know What Minecraft Modding Is


    Video games are made up of thousands of lines of code. Code makes players (like
    you) able to explore new worlds, interact with characters, and have fun.


    Some games, like Minecraft, allow players to add their own code to the games to
    create new worlds, challenges, or even characters. Throughout this book, I show
    you how to make these modifications. Mods can consist of almost any task:


    - Texture: Change the way the world looks by applying a texture pack.

    - Block interaction: Cause an explosion whenever the player destroys a block of
    wood.

    - New block: Create new blocks.

    - Minigame: Create a minigame within Minecraft.

    - Large structure: Create huge structures that would take a long time to make
    by hand but only a short time to make with code.


    ### Project 1: Getting Started on Modding


    The LearnToMod online software walks you through a series of challenges that you
    complete in order to earn badges. These challenges help show you basic skills
    and how to make mods. I show you how to log in to the LearnToMod software (available
    at learntomod.com), create and run your first mod, and share that mod with other
    modders.


    Signing up for the LearnToMod online software is quick and easy. It takes only
    5 minutes to complete the sign-up process and start earning badges.


    Find your access key for LearnToMod on the inside front cover of this book, and
    then follow these steps to access your new LearnToMod account:


    - 1. Go to http://mod.learntomod.com. The first time you log in, the site redirects
    you to ThoughtSTEM''s login page to create your account.

    - 2. Use the Sign Up window (located below the Log In window) to create your LearnToMod
    account.

    - 3. After you create your LearnToMod account, you are redirected to a page that
    asks for your access key. Copy and paste the access key that appears in the inside
    front cover of this book.

