  - '[PAGE 292]


    # Building Your Own Game


    Throughout this book, I describe lots of coding concepts and game design strategies.
    In this project, however, I guide you through the steps to create your own Minecraft
    mod. It''s time to put your new skills to use in a new and creative project that
    you come up with on your own.


    Coming up with new mod ideas can be a fun process all on its own. We get together
    with friends and ask them what they wish they could do in Minecraft, or watch
    YouTube videos for inspiration.


    ![](img/19c5471683adbccca3dbd246857a25f8_292_0.png)'
  - '[PAGE 293]


    # 282 Part 4: Building Your Own Minecraft Minigame


    # Sketch Out Your Mod


    The first thing to do when designing a new mod is to sketch out the result you
    want. Keep these guidelines in mind when you''re sketching out your mod:


    +   Use graph paper. You can sketch out your mod more accurately on graph paper
    than on blank paper. Figure 10-1 shows what graph paper looks like. You can look
    at each box on the graph paper as a single block in Minecraft.


    ![](img/19c5471683adbccca3dbd246857a25f8_293_0.png)


    Figure 10-1


    +   Math blocks can be even more useful than graph paper. You can create the 3D
    effect, where you almost feel like you''re walking around in the mod you''re designing.


    +   Using blank paper has its place, too. Sometimes you just need to get a general
    idea of what your mod will look like or what it will do, so you don''t need to
    add lots of detail.'
  - '[PAGE 294]


    # Project 10: Building Your Own Game 283


    +   - Build it in Minecraft first. If you’re designing a mod in which you build
    a structure such as a roller coaster, build the structure by hand in Minecraft
    first, to form an idea of its construction.


    +   - Keep paper and a pencil hand. Even after you sketch your mod, you may need
    to jot down ideas or work through a problem in your mod.


    # Plan Your Mod


    After you sketch your mod, you can plan what functions you need, such as one for
    setting up the mod’s scene. You don’t have to be precisely correct, but you should
    at least have an idea of what functions you will have.


    Here are a few suggestions for planning your mod:


    +   - Draw circles around structures, or even parts of structures, and name them.


    +   - For parts of your mod that aren’t structures, like events, draw a box with
    the following parts in it:


    +   - At the top: The name of the function


    +   - Inside the box: A list of actions the function should perform


    +   - Ask yourself how data will be passed around your functions. Will it have
    parameters? Which variables should be local, and which should be global (see Project
    7)?


    After you have an understanding of the code you want to write, you can head to
    the LearnToMod site and start outlining, as described later in this project, in
    the section “Outline Your Mod."'
  - '[PAGE 295]


    # Part 4: Building Your Own Minecraft Minigame


    # Draw the Gameplay Loop


    If you''re making a minigame, remember to draw the gameplay loop, described fully
    in Project 4. You can use the drawing in Figure 10-2 as a template for the gameplay
    loop.


    ![](img/19c5471683adbccca3dbd246857a25f8_295_0.png)


    Figure 10-2


    Here are some strategies for planning the gameplay loop:


    +   - Make a separate drawing for each iteration of the loop. That way, you know
    how much you need to get done before you have a game that you can play.


    +   - Each iteration should result in a game that you can play. It may not be
    a lot of fun in the first iteration, but it''s still a game.


    +   - Feel free to change your mind. If you think you have three iterations and
    the third one seems easier to complete than the second one, just swap them around.'
  - '[PAGE 296]


    # Project 10: Building Your Own Game


    The gameplay loop can be used in other situations too, as a general guideline,
    but it is most effective when you have a challenge — a goal you''re trying to
    reach when you''re playing in the mod that you made.


    # Outline Your Mod


    After you understand the structure of your mod and how you want to approach breaking
    it into functions, you can outline it in LearnToMod.


    Follow these steps:


    +   1. Go to mod.learntomod.com and click on Mod at the top of the screen.

    2. Create a new mod and choose Blockly (Multiplayer) as the language.

    3. Click the Code button to go to the coding environment.

    4. Create all the functions that you outlined earlier, in the “Plan Your Mod”
    section, but don''t fill them in yet.


    Just let the functions sit in your mod, empty, with names and parameters.


    Though these functions may end changing as you iterate over your gameplay loop,
    it''s important to start piecing together the code early on so that you don''t
    miss any crucial actions.


    +   Call the functions from the other functions as you think you would need to.
    For example: You will have a main function, and it might be that the main function
    calls all the other functions. If that is the case, put a call to each function
    inside of main.


    This step list helps you visualize your code!'
  - '[PAGE 297]


    # 286 Part 4: Building Your Own Minecraft Minigame


    # # Refactor Your Mods


    A mod that starts to grow too big for you to remember it all can cause a lot of
    problems because if you try to make changes, you might make changes in the wrong
    function.


    Always consider refactoring your mods when they become large to understand easily.


    An effective way to refactor your mod is to turn it into a library and then import
    it into a new mod, where you have more control. I show you how to do this in Project
    7 with the projectile library.


    Another form of refactoring occurs when you simply change how your functions interact,
    or even which functions you have.


    Before starting to refactor, save a copy of your mod so that you can always return
    to a working version.


    Sometimes, when you''re making simple refactoring changes, you can break your
    code. Be sure to continually test your code as you build it.


    # # Test Your Code


    Test, and test often. Avoid the situation where you spend hours writing code that
    doesn''t even work and then have to rewrite it. That''s when designing on paper
    and using a gameplay loop is helpful.


    If you always have code that can be tested and you only make small changes between
    testing periods, you''re more likely to create correct, working code that you
    can be proud of.


    # # Share Your Mod with Friends


    One of the best parts about writing mods in LearnToMod is that you can share them
    with friends. Anyone with a LearnToMod'
