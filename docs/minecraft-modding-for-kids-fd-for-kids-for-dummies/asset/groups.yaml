    # 第 3 部分：设计与构建多人小游戏


    ![](img/19c5471683adbccca3dbd246857a25f8_205_0.png)


    图 7-2


    ![](img/19c5471683adbccca3dbd246857a25f8_205_1.png)


    图 7-3


    ## 项目 7：使用投影物进行模组开发


    ![](img/19c5471683adbccca3dbd246857a25f8_206_0.png)


    即使不编写代码，你也可以通过向你可能使用的编程环境中拖入方块来规划最终代码，如图 7-5 所示。


    ## 规划方块爆炸


    一旦按照上一节所述启动了你的方块，你应该让它在撞击地面时发生爆炸。你可以查看 LearnToMod 方块，在 `Minecraft: World`（世界）类别下找到爆炸方块，如图
    7-6 所示，你可以用它让方块在撞击地面时爆炸。


    与我在上一节中的指令类似，你可以按照图 7-7 所示规划爆炸函数。


    ![](img/19c5471683adbccca3dbd246857a25f8_207_0.png)


    图 7-5


    ![](img/19c5471683adbccca3dbd246857a25f8_207_1.png)


    图 7-6


    ![](img/19c5471683adbccca3dbd246857a25f8_207_2.png)


    图 7-7


    ### 跟踪状态


    在爆炸性投影物模组中，需要跟踪的一个重要方面是方块的**状态**（state）。状态描述了方块在此时正在做什么。为了查看示例，你可以跟踪自己一整天的状态，并使用状态机（一种跟踪世界中事件数据的图表）来记录它，如图
    7-8 所示。


    ![](img/19c5471683adbccca3dbd246857a25f8_208_0.png)


    图 7-8


    在这个模组中，跟踪状态非常重要，因为你不希望方块在发射之前或在着陆之前就爆炸了。如果它爆炸得太早，就无法破坏你的目标（它落下的地方）。状态机是世界上所有可能状态（或至少是你关心的状态）的有效表示方式。图
    7-8 展示了你如何创建一个关于你真实生活的状态机，并将其应用于玩 Minecraft。


    正如你在图 7-8 中所示，你可能处于以下四种状态之一（在现实生活中）：


    -   睡觉

    -   吃饭

    -   开发模组

    -   玩 Minecraft


    如果你遵循图中所示从“睡觉”状态出发的箭头，你可以发现当你离开该状态时——或者当你醒来时——唯一可以采取的动作就是吃饭（可能是早餐）。再次遵循箭头的方向，你可以看到在吃饭之后，你可以开发模组，也可以玩
    Minecraft。你可以随心所欲在吃饭、开发模组和玩 Minecraft 之间切换。但如果你想再次睡觉，你必须先吃饭（可能是晚餐）。


    你方块的状态机看起来类似于图 7-9。线中的线条表示了如果上一个事件发生，则*必须*发生的动作，一旦方块被毁，模组即结束，你可以再次运行它。


    ![](img/19c5471683adbccca3dbd246857a25f8_209.png)


    图 7-9


    图 7-9 中的状态机比图 7-8 更简单，因为你的方块只有一条路径：一旦它被创建，*必须*发射，然后*必须*爆炸，最后被毁。一旦它被毁，模组就完成了。


    运行模组会初始化状态，这有助于跟踪方块是否已经发射以及已经爆炸。图 7-10 显示了你需要跟踪方块状态的变量。


    ![](img/19c5471683adbccca3dbd246857a25f8_210.png)


    图 7-10


    ## 迭代 1：设置发射循环


    虽然这个模组还没有游戏性（如项目 4、5、6 所示），但你应该迭代地编写这个模组。在第一次迭代中，在你运行模组时让方块发射。遵循以下步骤：


    -   创建一个发射方块的函数。

    -   将发射变量设置为 `true`。

    -   使用方块的速度和方向。


    ![](img/19c5471683adbccca3dbd246857a25f8_211.png)


    图 7-11


    2. 在发射函数中，根据玩家看向的方向设置方块的速度和方向。


    ![](img/19c5471683adbccca3dbd246857a25f8_212.png)


    图 7-12


    3. 在主循环中，检查方块是否已经发射。如果是，则让方块向前移动。


    4. 如果方块撞击地面，触发爆炸并将发射变量设置为 `false`。


    ### 项目 7：使用投影物进行模组开发


    ![](img/19c5471683adbccca3dbd246857a25f8_213.png)


    图 7-13


    ![](img/19c5471683adbccca3dbd246857a25f8_214.png)


    图 7-14


    ![](img/19c5471683adbccca3dbd246857a25f8_215.png)


    图 7-15


    ![](img/19c5471683adbccca3dbd246857a25f8_216.png)


    图 7-16


    ## 迭代 2：设置爆炸事件


    当你确定方块可以发射后，你需要注册它着陆的时间，因为那正是它应该爆炸的时候。要设置爆炸事件，请遵循以下步骤：


    -   创建一个处理爆炸的事件监听器。

    -   使用 `info` 参数获取碰撞的位置。

    -   在该位置产生爆炸。

    -   将发射变量设置为 `false`。


    3. 将 `info` 参数添加到爆炸函数中，并用它获取触发事件的方块信息。


    '
