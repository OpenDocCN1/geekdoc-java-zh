    # Part 3: Designing and Building a Multiplayer Minigame\n\n```\nfunction on\n\
    if sarah-Project1_Library.check_launched then\n  do\n    set Exploding to player\n\
    \    create clone that destroys block\n    sarah-Project1_Library\n```\nThis week\
    \ you'll build:\n- Mods that throw projectiles that cause explosions when they\
    \ land\n- The first part of Capture the Flag\n- A multiplayer version of Capture\
    \ the Flag so you can play with friends\n\n# Modding with Projectiles\n\nAble\
    \ to build objects, send drones out, or trigger events can be fun; being able\
    \ to cast mods into the world and how they affect the area around they land is\
    \ powerful. In this project, I show you how to make and run a mod that projects\
    \ a block into the world and causes an explosion when it lands.\n\n![](img/19c5471683adbccca3dbd246857a25f8_202_0.png)\n\
    \n# Part 3: Designing and Building a Multiplayer Minigame## Design and Build an\
    \ Exploding Projectile\n\nIn this section, I show you how to write a mod that,\
    \ when run in Minecraft, causes a block to be thrown from your location. When\
    \ the block lands, it causes an explosion, destroying anything around it. You\
    \ can later modify this to have it do other things, such as teleport you where\
    \ it landed.\n\n### Design\n\nBefore you start coding, plan your strategy. Writing\
    \ this exploding projectile isn't as complex as a minigame, but you need to design\
    \ its complex pieces (such as where it should be thrown from and what should happen\
    \ when it lands). For starters, you will need to define these two actions to make\
    \ the block:\n- Launch when the mod is run\n- Explode when it lands\n\n### Plan\
    \ the block launch\n\nWhen you run your mod, make a block (maybe bedrock) to start\
    \ from your position and move up and away from you. Designing the code for a three-dimensional\
    \ (3D) mod is kind of tricky because you can't draw it easily on paper (3D involves\
    \ six directions: up, down, left, right, forward, and backward). To write this\
    \ 3D mod, use x-, y-, and z-coordinates to plan out where the block will start\
    \ and how it will move. Check out the following Math Connections paragraph for\
    \ an explanation of x-, y-, and z-coordinates, if you don't already know them.\n\
    \nWhen you draw something on paper, you're making a 2D drawing. You know that\
    \ something is 2D because it has only four directions (up, down, left, and right).\
    \ In math, the y-axis (a higher value for y is up and a lower value for y is down).\
    \ Left and right are represented by the x-axis (a higher value for x is right,\
    \ and a lower value for x is left). This makes x-coordinate and y-coordinate easy\
    \ to see in 2D space.\n\n![](img/19c5471683adbccca3dbd246857a25f8_203_0.png)\n\
    Figure 7-1 shows a 2D x-y plane with a dot at the position x=1 and y=3, which\
    \ can also be represented as (1,3).\n\n![](img/19c5471683adbccca3dbd246857a25f8_204_0.png)\n\
    \nTo understand the 3D world, you have to introduce another direction (forward\
    \ and backward), and in math, this is represented by a third coordinate: z. Figure\
    \ 7-2 shows a third line that represents the z-plane moving into the screen. The\
    \ green dot is the same dot from Figure 7-1; it's at (1,3,0). The red dot is at\
    \ (1, 3, 4) and is actually deep into the screen.\n\nFigure 7-3 shows how a cube\
    \ would look on the x, y, z-planes. The green dot from Figure 7-2 would be on\
    \ the blue side, flat up against the screen, and the red dot would be along the\
    \ red side, deep into the screen.\n\nOne way to make the block launch is to teleport\
    \ (move) the block to a specific location using the teleport block in LearnToMod.\
    \ You can teleport the block to (1,1,1) then (2,2,2) then (3,3,3) then (4,4,4)\
    \ and this could work, but if you search through your Minecraft will find some\
    \ useful blocks in the LearnToMod Block category, as you can see in Figure 7-4.\n"
