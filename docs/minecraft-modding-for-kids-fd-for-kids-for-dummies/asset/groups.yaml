    ## Project 5: Making a Multilevel Minecraft Minigame


    Ask your friends to test your game now. They''ll probably say that it isn''t much
    of a challenge to play, but you can gain insight into the kinds of challenges
    your players are looking for, such as more monsters or a bigger arena.


    - 4. Reward: Replay the first level.


    In the first iteration of Monster Arena, the user breaking the melon block is
    the one who gets to play Level 1 again. In later iterations, you add more levels
    that the player gets to play.


    After you plan out the gameplay loop in Steps 1–4, it''s time to build Monster
    Arena.


    - 5. Make a new mod, and name it Monster_Arena. Choose Blockly (Multiplayer) as
    the language.


    ## Start: Create a basic arena with a fence


    When you build any game, the first thing you need is a basic scene for the game.
    For Monster Arena, you need a large, enclosed area. Figure 5-3 shows the kind
    of arena you build — a large, circular platform that has a radius of 20 blocks.
    Surrounding the arena is a fence, reinforced with stone. The fence is required
    so that neither the monsters nor the player can leave the arena throughout the
    game.


    ![](img/19c5471683adbccca3dbd246857a25f8_156_0.png)


    Figure 5-3


    ## 146 Part 2: Making Your First Minigame


    As you may have already learned in geometry class, the radius is the line from
    the circle''s center point to any point on the circle''s edge. Because everything
    in Minecraft is made with blocks, you count the blocks between the center and
    the edge of the circle, and that is the radius.


    The initial scene is not the final version. You can always iterate on the design.
    The purpose of making the initial scene is to have a functional area to play the
    game and to keep gameplay inside this area. In Monster Arena, the player needs:


    - A place for the player and monster to run around

    - A way to ensure that the monsters and player can''t leave the area


    For this basic scene, you create:


    - A platform

    - a fence


    In Project 4, in the section about making the first iteration of Spleef, I show
    you how to make an arena using the LearnToMod library named sarah-ArenaBuilder.
    This library makes square arenas, and this time you need to make a round one.
    Luckily, you can use WorldEdit commands to make the arena in LearnToMod!


    A WorldEdit command is one that you can run in Minecraft to edit the world, such
    as making thousands of blocks appear at once. You can explore lots of WorldEdit
    commands online — search for the term minecraft worldedit commands using your
    favorite search engine.


    Visit http://wiki.sk89q.com/wiki/WorldEdit (the official WorldEdit wiki) to see
    a list of all WorldEdit commands for Minecraft. Just click on one of the links
    to a category, like Filling Pits under Utilities to find the WorldEdit commands
    associated with filling pits.


    ## Project 5: Making a Multilevel Minecraft Minigame


    To make the circular arena, you need to make a cylinder and a circle, which you
    can find under the Generation category on the wiki (it''s towards the bottom).


    Figure 5-4 shows how to use the WorldEdit commands in Minecraft. The WorldEdit
    commands use algorithms (another way of saying lists) to create the effect in
    the Minecraft world. The figure is from the wiki page about WorldEdit commands,
    found at


    http://wiki.sk89q.com/wiki/WorldEdit/Generation#Cylinders_and_circles


    Cylinders and circles


    | Command |

    | :--- |

    | /fill <radius> <height> |

    | /hollow <radius> <height> |


    WorldEdit is capable of producing both hollow and filled cylinders as well as
    hollow and filled circles. It uses a fast algorithm to generate the objects and
    algorithms for vertical and conical edges. The cylinders are created at height
    and extend upwards. If you are creating a circle, you simply need to create a
    cylinder of height 1.


    Example: Creating a filled glass cylinder of radius 5 and height 10

    `/fill glass 5 10`


    Example: Creating a hollow glass circle of radius 5

    `/hollow glass 5 1`


    Figure 5-4


