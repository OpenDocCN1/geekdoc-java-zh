    ### Import your own Magic Wands library


    In your CaptureTheFlag mod, you need to import the Magic Wands library (the one
    I show you how to change in the previous section).


    - 1. Change the import statement to import your Magic Wands library, as shown
    in Figure 9-16.


    ![](img/19c5471683adbccca3dbd246857a25f8_279_1.png)


    9-16


