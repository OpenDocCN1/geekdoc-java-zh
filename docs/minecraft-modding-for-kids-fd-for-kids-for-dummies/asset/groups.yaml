    \n图 1-32\n\n当你点击它时，你会看到图 1-33 所示的消息，告知模组已成功发送到你的账号。\n\n![](img/19c5471683adbccca3dbd246857a25f8_40_1.png)\n\
    \n图 1-33\n\n- 2. 点击任务栏上的 Minecraft 图标，如图 1-34 所示。\n\n如果你仍在游戏中，你会看到图 1-35 所示的物品栏中的模组。\n\
    \n如果你不在游戏中，回到 Connect（连接）勋章，按照“Connect mods to Minecraft”中的描述操作。\n\n![](img/19c5471683adbccca3dbd246857a25f8_41_0.png)\n\
    \n图 1-34\n\n![](img/19c5471683adbccca3dbd246857a25f8_41_1.png)\n\n图 1-35\n\n-\
    \ 3. 在 Minecraft 中装备并使用你的模组，请遵循以下步骤：\na. 按下 M 打开模组列表，然后右键点击鼠标。\nb. 选择你想运行的模组，将其从模组列表拖到物品栏。将鼠标悬停在不同模组上查看它们的名称。\n\
    c. 按 Esc 键退出模组列表并返回游戏。\nd. 按与物品栏中模组位置对应的数字来运行模组。\n例如，如果你将模组放在最左侧，如图 1-36 所示，按下\
    \ 1 键并右键点击鼠标来运行模组。\n\n![](img/19c5471683adbccca3dbd246857a25f8_42_0.png)\n\n图\
    \ 1-36\n\n返回 LearnToMod 网站查看你已获得第三个勋章。然后你应该完成接下来的三个挑战，它们是测试题。我不会引导你完成这三个勋章，因为你应该自己测试并获得它们。\n\
    \n# 第一部分：制作你的第一个 Minecraft 模组\n\n# 编写自己的模组\n\n在第 2 章中，我会引导你完成 Learning to Program\
    \ 标签下的下一组勋章。在你获得至少十个勋章后，你可能会有一个想写的创意模组想法。请遵循以下步骤：\n\n- 1. 滚动到 LearnToMod 软件顶部并点击图\
    \ 1-37 所示的 Mod 标签。\n- 2. 在图 1-38 所示的新页面上，你可以为你的模组输入标题，例如 Say_Hello。\n\n![](img/19c5471683adbccca3dbd246857a25f8_43_0.png)\n\
    \n图 1-38\n\n- 3. 点击 Blockly（多人）按钮创建一个服务器端模组。这本书将教你如何制作服务器端模组，这意味着它们是多人模式的。出现一个新的模组块，如图\
    \ 1-39 所示。\n\n![](img/19c5471683adbccca3dbd246857a25f8_44_0.png)\n\n图 1-39\n\n\
    - 4. 点击新的模组块显示模组的描述页（见图 1-40）。\n\n![](img/19c5471683adbccca3dbd246857a25f8_44_1.png)\n\
    \n图 1-40\n\n- 5. 点击 Code 按钮，\n你会看到图 1-41 所示的编程环境。\n\n现在你可以尝试写一个新模组——例如一个对你个人打招呼的模组（见图\
    \ 1-42）。\n\n![](img/19c5471683adbccca3dbd246857a25f8_45_0.png)\n\n图 1-41\n\n![](img/19c5471683adbccca3dbd246857a25f8_45_1.png)\n\
    \n图 1-42\n\n# 与朋友分享你的模组\n\n编写模组并在 Minecraft 中测试它们很有趣，但让朋友在他们的 Minecraft 世界中测试可以帮助你和朋友想出创意模组，因为你可以获得新点。\n\
    \n在你写了一些代码后，让你的朋友为你测试——这是发现 Bug 并成为更好的模组开发者的好方法。\n\n与你的 LearnToMod 同伴们分享模组很容易。只需遵循以下步骤：\n\
    \n- 1. 点击模组中的 Back（返回）按钮（参考图 1-41）。\n- 2. 点击左上角的图像框，如图 1-43 所示。\n- 3. 按照图 1-44\
    \ 所示的步骤为模组添加截图和描述。\n\n# 项目 1：开始 Minecraft 模组\n\n# Say Hello\n\n注意：这是一个未发表的模组。其他人无法看到此页面。（编辑）\n\
    \n![](img/19c5471683adbccca3dbd246857a25f8_46_0.png)\n\n# Say Hello\n\n让模组对公众可见吗？\n\
    \n![](img/19c5471683adbccca3dbd246857a25f8_46_1.png)\n\n- 4. 点击指示器使模组公开，如图 1-45\
    \ 所示，然后点击 Save（保存）按钮。\n\n![](img/19c5471683adbccca3dbd246857a25f8_46_2.png)\n\n"
