    # # 和朋友一起进行 Minecraft 整合：Spleef 的多人版本


    制作 Minecraft 小游戏非常有趣，因为在你制作完成后，你可以在 Minecraft 里面玩几个小时，但更有趣的是制作可以和你朋友们一起玩的小游戏。在这个项目中，我将向你展示如何将单机游戏（只有一个玩家的游戏）转换为多人游戏（有多个玩家的游戏）。我还会解释如何更改游戏循环（针对项目
    3 中的单机 Spleef 游戏），以便你能够从头开始设计多人游戏。


    # 项目 6：和朋友一起进行 Minecraft 整合


    # 从单机 Spleef游戏 开始


    与其重做整个 Spleef 游戏，你可以从单机版本开始转换为多人版本。


    注意：在开始此部分之前，你应该已经制作了 Spleef。如果你还没有，请回到项目 4 并制作单机 Spleef。


    要从单机开始，请遵循以下步骤：


    - 1. 打开单机 Spleef（见项目 4），点击 `Actions` 选项卡，然后从菜单中选择 `Copy`，如图 6-1 所示。


