    # Project 10: Building Your Game


    Browse the list of mods, and click on a mod that you find interesting. You can
    read its description to find out more and then click the Code button to make a
    copy of it in your own LearnToMod account.


    An extra challenge for you is to figure out how to add something neat to a mod
    that someone else has made. Follow these steps:


    +   1. Test the mod to see what it does, and compare that to what it is supposed
    to do.


    +   2. Read the code, and draw it out. (It''s sort of the reverse step of designing
    code.)


    +   3. Design one addition to the code and figure out where it should go (for
    example, in its own function or inside another function).


    +   4. As you add code, test, test, test, test!


    After you have remixed the mod, share it with everyone else on the LearnToMod
    site to see how other coders can take it even further.


    # Engage with Your Community


    If you''ve followed along with my instructions throughout this book, you''re now
    a LearnToMod Minecraft modder! And a large community of coders are out there to
    learn from and share — people who love to mod, just like you. If you get stuck
    and can''t figure out a coding problem, visit the LearnToMod forums and ask questions.
    You might even find that you can answer questions for other people.


    Never hesitate to ask questions. One helpful way to learn is to fail without fear
    so that you can learn from your mistakes.'
