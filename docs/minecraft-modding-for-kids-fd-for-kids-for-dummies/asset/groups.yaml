    \ `examples-magic_wands.init` 函数（如图 8-17 所示）并从 `main` 调用它，如图 8-18 所示。\n\n![](img/19c5471683adbccca3dbd246857a25f8_246_0.png)\n\
    \n![](img/19c5471683adbccca3dbd246857a25f8_246_1.png)\n\n5. 在 Functions（函数）分类下，获取\
