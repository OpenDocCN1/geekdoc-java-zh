    - 使用计算机。特别是对于“缺失（Missing）”勋章，这是追踪代码的一种极佳方法。首先，运行你的代码（或正确版本）并观察发生了什么。然后再次运行代码，但这次在代码执行时指向每一行代码。例如，当你看到“Hello,
    World!” 消息时，指向图 2-10 所示的代码行。这样，当你的代码缺少某个区块时，你就能找出正确代码中发生了什么。

    - 使用铅笔和纸。如果你写了一个模但它没有按照你的预期运行，请在纸上画出每行代码执行后的情况。例如，图 2-10 所示的代码 `Send Message "Hello,
    World!" to me` 将打印到屏幕上，所以你应该把它写在纸上。


