    # Part 3: Designing and Building a Multiplayer Minigame


    2. You need to get your location so that the block launches from that spot. You
    also need to know the direction you are facing so that the block doesn''t launch
    behind you. (Ouch!)


    To find this location information, add the two lines shown in Figure 7-12 to the
    launch function.


    ![](img/19c5471683adbccca3dbd246857a25f8_211_0.png)


    Figure 7-12


    Local variables are visible only to the function they''re in — and this step uses
    local variables instead of regular variables. If you make the local variable location
    in the launch function, main and explode won''t even know that location variable
    exists. Local variables are useful when you''re creating a large mod, because
    then you can have a local variable in five different functions. Each function
    will be able to see only its specific location variable, so if you change the
    value in one function, the other functions don''t accidentally use that new value.
    They don''t even know it exists.


