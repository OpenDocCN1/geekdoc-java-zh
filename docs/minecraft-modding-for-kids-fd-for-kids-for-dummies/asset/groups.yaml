    \n图 8-23\n\n如图 8-24 所示，`light_green` 函数简单的返回 10。在 Minecraft 中，每个材质都有一个 ID，例如 13，而我们使用的代表法杖的\
    \ ID 为 3-12。要访问它们必须使用关键字。因此，要使用绿色法杖，你需要用 10 来访问它。`init` 函数中的纹理包基本上是加载一个法杖模型来替换材质。LearnToMod\
