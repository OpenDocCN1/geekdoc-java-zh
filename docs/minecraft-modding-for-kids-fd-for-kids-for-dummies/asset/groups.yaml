    Your block should explode only if you have already launched it. When it''s exploding,
    it''s no longer launching. Figure 7-17 shows how the explode function updates
    the state of your mod using the launching and exploding variables.


    ![](img/19c5471683adbccca3dbd246857a25f8_214_0.png)


