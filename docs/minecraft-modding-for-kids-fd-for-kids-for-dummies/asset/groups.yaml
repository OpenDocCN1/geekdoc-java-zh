    ## 项目 5：制作一个多级 Minecraft 迷你游戏


    现在邀请你的朋友来测试你的游戏吧。他们可能会说玩起来挑战性不大，但你可以借此洞察玩家正在寻找什么样的挑战，例如更多的怪物或更大的竞技场。


    - 4. 奖励：重新玩第一关。


    在“怪物竞技场”（Monster Arena）的第一次迭代中，破坏西瓜块的用户将可以再次玩第 1 层。在随后的迭代中，你将添加更多玩家可以玩的关卡。


    在你完成步骤 1-4 并规划好游戏循环后，是时候构建“怪物竞技场”了。


    - 5. 创建一个新 mod，并将其命名为 Monster_Arena。选择 Blockly（多人游戏）作为语言。


    ## 开始：用围栏创建一个基础竞技场


    当你构建任何游戏时，首先需要一个游戏的基础场景。对于“怪物竞技场”，你需要一个大型且封闭的区域。图 5-3 显示了你要构建的竞技场类型——一个半径为 20
    格块的大圆平台。竞技场周围围着一圈用石头加固的围栏。设置围栏是为了确保在整个游戏过程中，无论是怪物还是玩家都不会离开竞技场。


    ![](img/19c5471683adbccca3dbd246857a25f8_156_0.png)


    图 5-3


    ## 146 第 2 部分：制作你的第一个迷你游戏


    正如你可能已经在几何课上学过的那样，半径是从圆心点到圆边缘任意一点的直线。因为 Minecraft 中的所有东西都是由方块组成的，所以你只需要计算圆心到圆边缘之间的方块数量，这就是半径。


    初始场景并不是最终版本。你可以对设计进行迭代。创建初始场景的目的是提供一个功能性区域来玩游戏，并将游戏限制在这个区域内。在“怪物竞技场”中，玩家需要：


    - 一个玩家和怪物跑动的地方

    - 一种确保怪物和玩家不会离开区域的方法


    对于这个基础场景，你创建了：


    - 一个平台

    - 一个围栏


    在项目 4 关于制作 Spleef 第一次迭代的章节中，我向你展示了如何使用名为 `sarah-ArenaBuilder` 的 LearnToMod 库来制作竞技场。该库可以制作方形竞技场，而这次你需要制作一个圆形的。幸运的是，你可以使用
    WorldEdit 命令在 LearnToMod 中制作竞技场！


    WorldEdit 命令是你可以在 Minecraft 中运行用以编辑世界的命令，例如一次生成数千个方块。你可以在网上探索大量的 WorldEdit 命令——使用你喜欢的搜索引擎搜索术词
    `minecraft worldedit commands`。


    访问 http://wiki.sk89q.com/wiki/WorldEdit（WorldEdit 官方百科）查看 Minecraft 所有的 WorldEdit
    命令列表。只需点击类别中的一个链接，例如 Utilities 下的 Filling Pits（填充坑），即可找到与填充坑洞相关的 WorldEdit 命令。


    ## 项目 5：制作一个多级 Minecraft 迷你游戏


    要制作圆形竞技场，你需要创建一个圆柱体和一个圆，你可以在百科的 Generation（生成）分类下找到它们（位于靠底部）。


    图 5-4 显示了如何在 Minecraft 中使用 WorldEdit 命令。WorldEdit 命令使用算法（列表的另一种说法）在 Minecraft
    世界中创建效果。该图来自关于 WorldEdit 命令的百科页面，地址为：


    http://wiki.sk89q.com/wiki/WorldEdit/Generation#Cylinders_and_circles


    圆柱体和圆


    | 命令 |

    | :--- |

    | /fill <radius> <height> |

    | /hollow <radius> <height> |


    WorldEdit 能够生成空心和实心的圆柱体，以及空心和实心的圆。它使用快速算法生成对象，以及垂直和锥形边缘的算法。圆柱体在指定高度创建并向上延伸。如果你正在创建一个圆，只需要创建一个高度为
    1 的圆柱体。


    示例：创建一个半径为 5、高度为 10 的实心玻璃圆柱

    `/fill glass 5 10`


    示例：创建一个半径为 5 的空心玻璃圆

    `/hollow glass 5 1`


    图 5-4


    ## 在 Minecraft 中测试 WorldEdit 命令


    在编写制作竞技场的代码之前，先在 Minecraft 中测试 WorldEdit 命令。


    图 5-5 显示了如何创建一个半径为 20 的石头平台，图 5-6 显示了生成的平台。


    ```

    //cyl ... stone 20

    ```


    图 5-5


    ## 148 第 2 部分：制作你的第一个 Minecraft 迷你游戏


    ![](img/19c5471683adbccca3dbd246857a25f8_159_0.png)


    > 记住

    > 当你尝试构建一个大型结构时，双击空格键进行悬停，然后按并住空格键移动到空中，然后再运行你的 mod。此操作会在空中创建一个大型平台，并使其更容易观察。


    你也可以测试制作围栏。图 5-7 显示了如何制作石头围栏。如果你保持不动，可以输入图 5-8 所示的命令在石头围栏内部创建一个木制围栏。它看起来就像图 5-9。


    > 警告

    > 如果你在创建平台之后、创建围栏之前移动了位置，你的竞技场将无法匹配。你可以使用图 5-5 和图 5-7 所示的命令来制作竞技场。你可以使用图 5-8 所示的命令在石头围栏内部制作木制围栏。


    ```

    //cyl ... stone 20

    ```


