    # # Minecraft Modding with Friends: The Multiplayer Version of Spleef


    Making Minecraft minigames can be a lot of fun because after you make it you can
    play games inside Minecraft for hours, but what is even more fun is making minigames
    that you can play with your friends. In this project, I show you how to convert
    single-player games (games that only have player) into multiplayer games (games
    that have more than one player). I also explain how to change the gameplay loop
    (for the single-player Spleef game from Project 3) so that you can design a multiplayer
    game from the ground up.


    ![](img/19c5471683adbccca3dbd246857a25f8_179_0.png)


    # Project 6: Minecraft Modding with Friends


    # Start from the Single-Player Spleef Game


    Rather than remake the entire Spleef game, you can start from the single-player
    version and turn it into a multiplayer version.


    Note: Before you begin this section, you should have already built Spleef. If
    you haven''t built it yet, go back to Project 4 and build a single-player Spleef
    game.


    To start from single-player, follow these steps:


    - 1. Open the completed single-player Spleef mod (described in Project 4), click
    the Actions tab, and then choose Copy from the menu, as shown in Figure 6-1.


    ![](img/19c5471683adbccca3dbd246857a25f8_180_0.png)


    Figure 6-1


    - 2. Select the copied version of Spleef, shown in Figure 6-2, and then click
    Code to go into the programming environment.


    ![](img/19c5471683adbccca3dbd246857a25f8_180_1.png)


    Figure 6-2


    # 170 Part 2: Making Your First Minigame


    - 3. At the top of the screen, click the Actions tab and choose Rename from the
    menu, as shown in Figure 6-3.


    ![](img/19c5471683adbccca3dbd246857a25f8_181_0.png)


    Figure 6-3


    - 4. Rename the mod to Sleef_Multiplayer, as shown in Figure 6-4.


    ![](img/19c5471683adbccca3dbd246857a25f8_181_1.png)


    Figure 6-4


    - 5. After the page reloads, click on Sleef multiplayer again, as shown in Figure
    6-5.


    # 171 Project 6: Minecraft Modding with Friends


    ![](img/19c5471683adbccca3dbd246857a25f8_182_0.png)


    Figure 6-5


    When an expert modder decides to use an earlier version of a chunk of code, it''s
    called *reverting*. This is why you should always test your code as you''re writing
    it, to avoid making a tiny mistake just before finishing your multiplayer game
    and then being unable to figure out how to undo it. On top of all that, you have
    to revert to the single-player version and start over.


    # Summarize the Gameplay Loop


    Even though you''re making a multiplayer game, you can still use the gameplay
    loop to guide you in making small changes. At each iteration, you can test to
    ensure that you haven''t made any mistakes. This makes reverting to earlier versions
    easier because you''re making small, incremental changes, and because they''re
    small, they''re easier to undo.


    The gameplay loop (Project 4) is shown in Figure 6-6.


    Before you start iterating on the loop loop, summarize on paper the changes you
    plan to make, like this:


    - Start: No changes need to be made to the scene yet, unless you want to enlarge
    the arena to make the games last longer.


    - Goal: The new goal is to break 200 blocks before your opponent does.


