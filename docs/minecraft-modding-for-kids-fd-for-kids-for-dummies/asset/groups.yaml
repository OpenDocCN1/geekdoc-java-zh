    # 项目 4：在 Minecraft 中制作单人游戏：跳垫大战 (Spleef)


    ![](img/19c5471683adbccca3dbd246857a25f8_136_0.png)


    图 4-18


    如图 4-18所示，`StartGame` 函数仅在玩家破坏方块时被调用。因此，每当你破坏一个方块时，该函数就会运行。


    然而，只有当玩家破坏的方块是西瓜块时，你应该将玩家设置为生存模式（Survival mode）。幸运的是，`info` 参数代表了你破坏的方块。


    变量由包含两个部分的框表示：名称和数据，如图 4-19 所示。有些变量是简单的。作为证据，图 4-20 显示了一个名为 `num`、数据为 `5` 的变量。图
    4-21 显示了一个名为 `name`、数据为 `Sarah` 的变量。


    ![](img/19c5471683adbccca3dbd246857a25f8_136_1.png)


    图 4-19


    ![](img/19c5471683adbccca3dbd246857a25f8_137_0.png)


    图 4-20


    ![](img/19c5471683adbccca3dbd246857a25f8_137_1.png)


    图 4-21


    # 项目 4：在 Minecraft 中制作单人游戏：跳垫大战 (Spleef)


    另一方面，另一些变量则更为复杂。例如，图 4-22 显示了与方块相关的事件函数（即 `block_break` 事件）的 `info` 参数。在图 4-22
    中，你可以看到 `info` 参数的数据包含一个方块，而该方块有一个类型，其类型数据是“西瓜块”（Melon Block）。


    `StartGame` 函数中的前两行代码遵循图 4-22 所示的逻辑，用于寻找被破坏的西瓜块类型。然后你检查被破坏的类型是否为西瓜块；如果是，你就将玩家的游戏模式设置为生存模式，这样他们就必须踩在方块上，如果他们掉下平台，可能会失去所有生命值。


    - 3. 在 Minecraft 中运行该模组。当你破坏西瓜块时，玩家将进入生存模式。在继续之前，请确保模组运行正常。

    - 4. 设置重生事件。


    ```

    function StartGame with: info

    set block to info block

    set block type to block type

    ```


    ![](img/19c5471683adbccca3dbd246857a25f8_138_0.png)


    # 第二部分：制作你的第一个 Minecraft 小游戏


    击死亡的玩家会重生在竞技场的中心。这一步比较棘手：图 4-23 显示了 `SetupPlayer` 函数，它在玩家重生时被调用；图 4-24 显示了在玩家重生时调用
    `SetupPlayer` 函数的一种方法。


    ![](img/19c5471683adbccca3dbd246857a25f8_139_0.png)


    图 4-23


    ![](img/19c5471683adbccca3dbd246857a25f8_139_1.png)


    图 4-24


    再次观察图 4-23。该 JavaScript 代码块被用于调用 `PlayerRespawnEvent` 事件，它需要三个参数：


    - 玩家重生时调用的函数。

    - 正在重生的玩家。

    - 一个真或假的值，指示这是否为床点重生（BedSpawn）。使用 `false` 值，因为你不想被传回回床。


    `SetupPlayer` 函数从 `info` 参数中获取数据（参考图 4-22），但这次 `info` 参数是一个玩家，而不是方块。


    图 4-25 显示了如何检索这些数据，图 4-26 显示了获取相同数据的另一种方法。


    # 项目 4：在 Minecraft 中制作单人游戏：跳垫大战 (Spleef)


    ![](img/19c5471683adbccca3dbd246857a25f8_140_0.png)


    图 4-25


    获取玩家的名称后，你可以设置一个事件将玩家传送到竞技场中心，但仅在玩家重生两秒（2,000 毫秒）后进行，如图 4-26 所示。


    事件可能会很复杂。但如果你需要帮助，可以随时查看已获得的勋章，或在 LearnToMod 论坛上提问。


    ![](img/19c5471683adbccca3dbd246857a25f8_140_1.png)


    图 4-26


    # 第二部分：制作你的第一个 Minecraft 小游戏


    5. 测试模组，运行它并破坏西瓜块。当你这样做时，游戏模式会切换到生存模式。获取玩家的名称后，你可以设置一个事件将玩家传送到竞技场中心，但仅在玩家重生两秒（2,000
    毫秒）后进行，如图 4-26 所示。


    事件可能会很复杂。但如果你需要帮助，可以随时查看已获得的勋章，或在 LearnToMod 论坛上提问。


    *(注：原文后续存在大量重复段落，已按要求处理并翻译)*


