    ## 第一部分：制作你的第一个 Minecraft 模


    ## 在 Minecraft 中构建一座塔


    了解如何创建无人机、移动它们以及使用它们放置区块可以让你构建你想象的任何东西。然而，构建复杂的结构需要大量的代码。在制作大型结构之前，探索如何使用无人机来构建较小结构。


    编码是一个复杂的过程，但它可以分为三个主要阶段：


    - **设计 (Design)**：在这个阶段，你（编码者）评估你试图解决的问题，例如在 Minecraft 中建造一座塔。这个阶段需要使用纸和笔。


    有时，你会重构你的代码而不改变其功能——这被称为*重构*（refactoring）。图 14（在项目 2 中）是一个很长的函数。


    - **开发 (Develop)**：在这个阶段，你按照计划编写代码。


    - **测试 (Test)**：在这个阶段，你测试代码以确保它符合你的要求。


    # 项目 3：构建与保护结构


    ### 设计：勾勒出塔


    你可以以许多不同的方式设计塔。在本节中，我将向你展示如何通过纸上绘图或使用真实的区块来设计它：


    1. 勾勒或构建在 Minecraft 中出现那样的塔。如果你在纸上画图，这一步可能会困难，因为纸是二维的 (2D)，而 Minecraft 是三维的 (3D)。绘图不需要完美，你只需要形成想法（例如有多少个区块或什么类型的区块）。图
    3-13 显示了塔的两个面。


    ![](img/19c5471683adbccca3dbd246857a25f8_83_0.png)


    图 3-13


    2. 在纸上，将你的设计拆解成可以管理的部分。图 3-14 显示了一种方法：


    - 一行区块：指示无人机移动的位置。

    - 两行区块：显示你需要如何为每一行重置无人机。这意味着无人机必须返回一行的开头，然后向上移动。

    - 一个完整的正方形区块：指示整个正方形，需要 16 个区块。塔由 8 个堆叠在一起的正方形组成。

    - 两行正方形：显示你需要如何为每一列重置无人机。

    - 四行正方形：确保你仍然处于正确的轨道上。

    - 八行正方形：塔。


