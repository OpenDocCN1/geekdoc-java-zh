    \nFigure 1-29\n\n# Part 1: Making Your First Minecraft Mod\n\n![](img/19c5471683adbccca3dbd246857a25f8_39_0.png)\n\
    \nFigure 1-30\n\nYou can select the link on the progress bar at the top or ask\
