    Read each mod to be sure that you understand the purpose of each mod:


    - CaptureTheFlag: In this mod, you know who the players are, and you know which
    wands you want to give each player. You need to be able to associate a certain
    type of wand (like Exploding Projectile) with the wand, and you need to have the
    exploding projectile start from the player using the wand.


    # Project 8: Making a Multiplayer Minigame: Capture the Flag


    - ExplodingProjectile: The exploding projectile sends a message, which needs to
    go to the player who has cast the spell, not me, so a parameter needs to be passed
    into this mod.


    - ProjectileLibrary: The projectile library needs to know from where to originate
    the projectile so that it doesn''t always start at the location of me. A parameter
    needs to be passed to this mod as well.


