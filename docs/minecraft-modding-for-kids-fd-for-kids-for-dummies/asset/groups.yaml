    # 第一部分：制作你的第一个 Minecraft 模组


    ## 记住


    ![](img/19c5471683adbccca3dbd246857a25f8_99_0.png)


    如果你想制作多个结构，能够制作多个无人机也会很有帮助。每个无人机都可以负责制作不同的结构，而且你不需要在制作新东西之前重置其中一个。


    ## 调试复杂的模组


    当你的模组代码没有按照你想要的方式运行时时（例如，当你制作了一行八块砖而不是两行四块砖时），你可能遇到了一个错误，或者说 *bug（漏洞）*。如果你的代码中有
    bug，你必须对它进行*调试（debug）*，即修复它。编写大型、复杂的模组更容易遇到难以发现的错误。


    在这一节中，我为你提供了四种调试代码的策略：


    - *离开一下。* 当你的代码不再合逻辑时，直接离开一下去看看视频或看电视节目，然后回到手头的任务。有时，当你长时间专注于一个问题时，你会错过那些如果只是休息一下就能容易发现的错误。像微软、谷歌和
    Facebook 等科技公司通常都配有 Xbox、PlayStation、足球和乒乓球游戏室，以便他们的成员在遇到棘手的 bug 时可以休息。

    - *用纸笔画图。* 编程中很棒的一点是，你可以追踪代码并将其画在纸上。逐行查看并像无人机一样移动你的笔，每当无人机放置一个区块时，就画一个区块。这将帮助你发现任何出错的地方。

    - *禁用代码块。* 在这种实用的技术中，你一个接一个地将代码块添加到你的模组中。你不需要删除代码，只需要禁用可能引起问题的特定行。图 3-38 和图 3-39
    向你展示了如何禁用代码块。


    ## 项目 3：构建与保护结构


    当你有一个找不到的 bug 时，禁用主函数和主函数中的第一个代码块之外的所有代码块。然后运行你的模组。接着启用下一个代码块，再次运行模组。继续这样做直到找到
    bug 为止。


    ![](img/19c5471683adbccca3dbd246857a25f8_100_0.png)


    图 3-38


