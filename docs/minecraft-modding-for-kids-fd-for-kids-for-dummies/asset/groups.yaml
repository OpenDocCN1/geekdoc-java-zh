    ## Part 1: Making Your First Minecraft Mod


    ## Build a Tower in Minecraft By Breaking Coding into Phases


    Knowing how to create drones, move them, and use them to place blocks allows you
    to build anything you can imagine. Building large, complex structures, however,
    requires lots of code, and the whole process can get confusing.


    Before making a large, complex structure, explore how to make a smaller structure
    so that you can understand the mechanics of building with drones. The following
    sections spell out how to create a tower using drones.


    Coding is a complicated process, but it can be broken up into three main segments:
    design, develop, test. Expert coders cycle through these three stages throughout
    the coding experience:


    - **Design**: In this phase, you (the coder) evaluate the problem that you''re
    trying to solve, such as building a tower in Minecraft. You research different
    ways of solving the problem and come up with a plan of action. This phase requires
    using paper and pencil. You draw a tower on paper and make notes on how many blocks
    high the tower is, and what material it is made of, like brick.


    Sometimes, you restructure your code without changing what it does—that''s known
    as *refactoring*. Figure 2-14 (over in Project 2) is quite a long main function
    with multiple functions.


    - **Develop**: In this phase, you write the code that follows the plan.


    - **Test**: In this phase, you test the code to make sure it does what you want.


    # Project 3: Building and Protecting Structures


    ### Design: Sketch out the tower


    You can design the tower in many different ways. In this section, I show you how
    to design it by drawing it on paper or using real-life blocks to build it:


    1. Sketch or build the tower as it would appear in Minecraft. If you''re drawing
    it on paper, this step can be difficult because paper is two-dimensional (2D)
    and Minecraft is three-dimensional (3D). The drawing doesn''t have to be perfect,
    you just need to form an idea of what it takes (such as how many blocks or what
    type of block). Figure 3-13 shows two sides of a tower.


    ![](img/19c5471683adbccca3dbd246857a25f8_83_0.png)


    Figure 3-13


    2. On a piece of paper, break your design into manageable pieces.


    Figure 3-14 shows one way to do it:


    - One row of blocks: Indicates where the drone is moving.

    - Two rows of blocks: Show how you need to reset the drone for each row. That
    means the drone will have to move back to the beginning of the row, before moving
    up.

    - One full square of blocks: Indicates an entire square, which requires 16 blocks.
    The tower consists of 8 squares arranged on top of each.

    - Two rows of squares: Show how you need to reset the drone for each column.

    - Four rows of squares: Ensure that you''re still on the right track.

    - Eight rows of squares: The Tower.


    ![](img/19c5471683adbccca3dbd246857a25f8_84_0.png)


    Figure 3-14

