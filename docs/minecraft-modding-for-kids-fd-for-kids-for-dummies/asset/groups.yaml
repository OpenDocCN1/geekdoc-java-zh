    ## Part 2

    Making Your First Minecraft Minigame


    ![](img/19c5471683adbccca3dbd246857a25f8_120_0.png)


    ### This week you''ll build:


    - The game Spleef inside Minecraft ............... 111

    - The multilevel game Monster Arena inside Minecraft .............. 142

    - A multiplayer Spleef game so that you can play with friends .......................
    168


    ## Making a Single-Player Game in Minecraft: Spleef


    One of the most complex (but also fun!) Minecraft mods that you can make is a
    minigame inside of Minecraft. In this project, I guide you in making Spleef, a
    game in which a player walks around a platform and makes a block disappear by
    stepping on it. Using this simple idea, you can make a lot of variations of Spleef
    — for example:


    - Players have to try to not fall into the lava that you have placed underneath
    the platform.

    - After you put lava underneath the platform and other entities in the arena,
    players try to make the other entities fall into the lava.

    - In the game, you can add items that players must collect to survive.

    - In a multiplayer version, players can try to make each other fall.


    ![](img/19c5471683adbccca3dbd246857a25f8_122_0.png)


    ## 112 Part 2: Making Your First Minigame


    In this project, I guide you in making Spleef, a game in which a player walks
    around a platform and makes a block disappear by stepping on it. Using this simple
    idea, you can make a lot of variations of Spleef — for example:


    - Players have to try to not fall into the lava that you have placed underneath
    the platform.

    - After you put lava underneath the platform and other entities in the arena,
    players try to make the other entities fall into the lava.

    - In the game, you can add items that players must collect to survive.

    - In a multiplayer version, players can try to make each other fall.


    ### Introduce the Gameplay Loop


    Before you jump into a game, like Spleef, you should understand the gameplay loop.
    The gameplay loop is the cycle of actions that the player performs repeatedly.
    In Spleef, the loop is: move around the platform, click a block, and avoid falling
    into the lava. As the game progresses, the platform shrinks as more blocks are
    broken, and the player is increasingly challenged.


    Figure 4-1 shows the gameplay loop.


    ![](img/19c5471683adbccca3dbd246857a25f8_123_0.png)


    ## Project 4: Making a Single-Player Game in Minecraft


    - Goal: Add a way to win and lose own- Challenge: Make winning more difficult.

    - Reward: Make players want to win.

    - Start: Create a basic scene


    To start making Spleef, you first need to create the platform. This can be done
    by placing a grid of blocks. Once the platform is created, you need to write code
    that allows players to break blocks when they click on them. This can be done
    using the `onBlockBreak` event. Finally, you need to add logic that checks if
    the player has fallen into the lava. This can be done by checking the player''s
    coordinates. If they are touching the lava, the player loses a life.


    To make the game more difficult, you can add more challenges. For example, you
    could make the platform smaller as time passes, or you could add moving obstacles
    that the player must navigate.


    ![](img/19c5471683adbccca3dbd246857a25f8_124_0.png)


    ## 114 Part 2: Making Your First Minigame


    You would add the simplest feature to your game: hearts. And you would add logic
    to the game to ask players they want to respawn whenever they run out of hearts.
    Again, at this point the game might not be fun, but when you reach the next step
    (the challenge, followed by the reward), you start to add enemies and ways that
    players can earn back hearts.


    ### Challenge: Make winning difficult


    Your game gets interesting when you start making it difficult for players to beat.
    At first, you might want to offer a small challenge. Don''t worry: You can iterate
    up to the more difficult challenges as you cycle through the gameplay loop.


    For example, in the simplified Minecraft game that I describe in the preceding
    section, the first challenge you might add is one creeper. You would put into
    the world one creeper that, upon seeing the player, tries to attack. This challenge
    makes the game more difficult than before now the player can get hurt and lose
    a. This game might not be lots of fun, because players can only get hurt and can''t
    defend themselves, but as you iterate through the gameplay loop, you can start
    adding creepers — and even other creatures, and items for the player to use to
    defend themselves.

