    \n图 1-24\n\n![](img/19c5471683adbccca3dbd246857a25f8_36_1.png)\n\n图 1-25\n\n-\
    \ 8. 点击 Minecraft 类别并点击 Players，如图 1-26 所示。然后找到 me 块。\n\n- 9. 拖动 me 块并连接到 send\
    \ message 块的第二个空间，如图 1-27 所示。\n\n- 10. 在此挑战的四个步骤的底部，点击 Test In Simulator（在模拟器中测试）按钮，如图\
