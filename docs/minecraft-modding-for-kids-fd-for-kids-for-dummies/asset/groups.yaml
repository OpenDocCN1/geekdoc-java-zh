    - 2. 选择 Spleef 的副本版本（如图 6-2 所示），然后点击 `Code` 进入编程环境。


    # 170 第2 部分：制作你的第一个 Minecraft 小游戏


    - 3 在 在顶部点击 `Actions` 选项卡并从菜单中选择 `Rename`，如图 6-3 所示。


    ![](img/19c5471683adbccca3dbd246857a25f8_180_0.png)


    - 4 将整合包重命名为 `Spleef_Multiplayer`，如图 6-4 所示。


    ![](img/19c5471683adbccca3dbd246857a25f8_181_0.png)


    - 5 页面加载后，再次点击 Spleef 多人版本，如图 6-5 所示。


    # 171 171 171 页（和朋友一起进行 Minecraft 整合）


    # 11 项目 6：和朋友一起进行 Minecraft 整合


    当一个高级整合开发者决定使用某段代码的早期版本时，这被称为*回滚*（reverting）。这就是为什么你应该在编写代码时始终进行测试，以避免在完成多人游戏的最后出现微小错误，然后又不知道如何撤销。更糟糕的是，你必须回滚到单机版本并重新开始。


    # 总结游戏循环


    即使你正在制作多人游戏，你仍然可以使用游戏循环来引导你进行细小的更改。在每次迭代中，你都可以进行测试以确保没有犯任何错误。这使得回滚到之前的版本变得更容易，因为你是在进行小的增量更改，而且因为这些更改很小，所以更容易撤销。


    # 如下：


    - 开始：目前不需要对场景进行更改，除非你想扩大竞技场以让游戏持续更久。


    - 目标：新目标是在对手之前破坏 200 个方块。


    游戏循环（项目 4）如图 6-6 所示。


