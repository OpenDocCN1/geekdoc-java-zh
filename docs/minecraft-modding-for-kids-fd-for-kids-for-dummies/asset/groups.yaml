    ![](img/19c5471683adbccca3dbd246857a25f8_0_0.png)


    # Scratch to reveal your access key for your LearnToMod trial:


    Please follow these directions to access your new LearnToMod account:


    - 1. Go to http://mod.learntomod.com. The first time you login, you’ll be redirected
    to ThoughtSTEM’s login page to create your account.


    - 2. Use the “Sign Up” window (below the “Log In” window) to create your LearnToMod
    account.


    You may want to use the kid''s e-mail address if they have one, so that they can
    directly contact the LearnToMod Support Staff if they need to.

    You can choose whatever password you want for your account.

    It does NOT have to be the access key.


    - 3. After you create your LearnToMod account, you’ll be redirected to a page
    that asks for your access key. Copy & paste the access key above.


    - 4. Next, choose a LearnToMod nickname. Any name you want!

    Now you can start unlocking badges to learn how to mod!


    ![](img/19c5471683adbccca3dbd246857a25f8_1_0.png)


    Code not working?

    E-mail us at learntomod@thoughtstem.com


