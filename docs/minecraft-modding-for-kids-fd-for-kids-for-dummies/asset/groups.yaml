    \n### 设计\n\n在开始编写代码之前，规划你的策略。编写这个爆炸掷物没有迷你游戏那么，但你需要设计它的复杂部分（例如它应该从哪里抛出以及落地时会发生什么）。起初，你需要定义这两个动作来制作区块：\n\
    - 运行调制时发射\n- 落地时爆炸\n\n### 规划区块发射\n\n当你运行调制时，让一个区块（可能是基岩）从你的位置开始并向上远离你移动。设计三维（3D）调制的代码有点棘手，因为你无法在纸上轻松画出来（3D\
    \ 涉及六个方向：上、下、左、右、前、后）。编写这个 3D 调制时，使用 `x`、`y` 和 `z` 坐标来规划区块从哪里开始以及如何移动。如果你还不知道它们，请查看以下“数学连接”段落关于\
    \ `x`、`y` 和 `z` 坐标的解释。\n\n当你在纸上画东西时，你是在画一张 2D 图。你知道某物是 2D 的因为它只有四个方向（上、下、左、右）。在数学中，`y`\
    \ 轴（`y` 值越大越上，`y` 值越小越下）。左和右由 `x` 轴表示（`x` 值越大越右，`x` 值越小越左）。这使得 `x` 坐标和 `y` 坐标在\
    \ 2D 空间中一目可见。\n\n![](img/19c5471683adbccca3dbd246857a25f8_203_0.png)\n图 7-1 显示了一个\
    \ 2D x-y 平在 x=1 和 y=3 的位置有一个点，它也可以表示为 (1,3)。\n\n![](img/19c5471683adbccca3dbd246857a25f8_204_0.png)\n\
    \n要理解 3D 世界，你必须引入另一个方向（向前向后），在数学中，这由第三个坐标表示：`z`。图 7-2 显示了一条代表进入屏幕的 `z` 平面的线。绿点是图\
    \ 7-1 中的同一个点；它位于 (1,3,0)。红点位于 (1, 3, 4)，实际上深在屏幕内部。\n\n图 7-3 显示了立方体在 x, y, z 平面上看起来是什么样的。图\
    \ 7-2 中的绿点将位于蓝色侧，紧贴屏幕，而红点将位于红色侧，深入屏幕内部。\n\n让区块发射的某种方法是使用 LearnToMod 中的传送块将区块传送到（移动到）特定位置。你可以将区块传送到\
    \ (1,1,1)，然后是 (2,2,2)，再是 (3,3,3)，最后是 (4,4,4)，这可能可行，但如果你在 Minecraft 中搜索，会在 LearnToMod\
    \ 块分类中找到一些实用的区块，如图 7-4 所示。\n\n"
