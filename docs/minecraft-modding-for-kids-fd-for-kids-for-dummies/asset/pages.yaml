  md: '# Making a Single-Player Game in Minecraft: Spleef


    One of the most complex (but also fun!) Minecraft mods that you can make is a
    minigame inside of Minecraft. In this project, I guide you in making Spleef, a
    game in which a player walks around a platform and makes a block disappear by
    stepping on it. Using this simple idea, you can make a lot of variations of Spleef
    — for example:


    +   - Players have to try to not fall into the lava that you have placed underneath
    the platform.


    +   - After you put lava underneath the platform and other entities in the arena,
    players try to make the other entities fall into the lava before they do.


    +   - In a game in which you''ve made multiple levels of platforms, players have
    to collect items on each level before they fall through to the level beneath them.


    +   - In a multiplayer game, players have to try not to fall before the opposing
    player falls.


    ![](img/19c5471683adbccca3dbd246857a25f8_122_0.png)'
  merge: -1
  pgno: 122
- img_proc: true
  md: '# 112 Part 2: Making Your First Minecraft Minigame


    In this project, I show you how to make a simple Spleef game, and I give you tips
    on how to extend Spleef to make it your own.


    # Introduce the Gameplay Loop


    Before you jump into making a game, even a simple one like Spleef, spend some
    time designing it so that you can prevent major errors when you go to develop
    it. As I mention in Project 3, you should always design your code before writing
    it. When you have a program that is complex, like a game, this rule becomes critical
    because it has so many pieces of code that could introduce errors. In this section
    1 introduce you to the design technique known as the gameplay loop.


    Figure 4-1 shows the basic gameplay loop with these four parts (described in the
    following four sections):


    +   - Start: Create a basic scene (the place where your game takes place).


    # CHALLENGES


    ![](img/19c5471683adbccca3dbd246857a25f8_123_0.png)


    Figure 4-1'
  merge: -1
  pgno: 123
- img_proc: true
  md: '# Project 4: Making a Single-Player Game in Minecraft Spleef


    +   - Goal: Add a way to win and lose.

    - Challenge: Make winning increasingly difficult.

    - Reward: Make players want to win.


    # Start: Create a basic scene


    Start by creating a basic scene for your game. You can begin by sketching out
    an idea on paper or building it in Minecraft, with-mods. The purpose of this step
    is to help you start thinking about the constraints the scene will place on the
    players, and therefore on how the game will play out.


    For example, making a game where you use the normal Minecraft world is much different
    from making a game where you''re in a 20 x 20 arena with walls, because in the
    Minecraft world you have infinite space to play, while in the 20 x 20 arena you
    can only play in a 20 x 20 area. As you build and define the scene, you can change
    the scene, such as make the arena bigger or add details. The design process is
    iterative, which means that you repeat each step multiple times. If you were building
    Minecraft from the ground up, you might start by creating a small world, but as
    you iterate through the gameplay loop, you make the world larger — eventually
    making it infinitely large, as it is today.


    Coding takes iterations, so if you make a decision early on in design, you can
    always make a change later.


    # Goal: Add a way to win and lose


    Some of the adds that you will want to make may be truly complicated, but if you
    break up the parts of the game according to the four gameplay loop pieces, you
    start to see that you can make a simple version of the game by creating only a
    basic scene and a way to win (or lose).


    For example, if you were playing a super-simple version of Minecraft in Survival
    mode, the goal would be to not die at night. With only the Minecraft world and
    the goal to survive, it wouldn''t be hard to survive, because there are no enemies.
    But at this point


    ![](img/19c5471683adbccca3dbd246857a25f8_124_0.png)'
  merge: -1
  pgno: 124
- img_proc: true
  md: '# 114 Part 2: Making Your First Minecraft Minigame


    you would add the simplest feature to your game: the hearts. And you would add
    logic to the game to ask players they want to respawn whenever they run out of
    hearts. Again, at this point the game might not be fun, but when you reach the
    next step (the challenge, followed by the reward), you start to add enemies and
    ways that players can earn back hearts.


    # Challenge: Make winning more difficult


    Your game gets interesting when you start making it difficult for players to beat.
    At first, you might want to offer a small challenge. Don''t worry: You can iterate
    up to the more difficult challenges as you cycle through the gameplay loop.


    For example, in the simplified Minecraft game that I describe in the preceding
    section, the first challenge you might add is one creeper. You would put into
    the world one creeper that, upon seeing the player, tries to attack. This challenge
    makes the game more difficult than before now the player can get hurt and lose
    a heart. This game might not be lots of fun, because players can only get hurt
    and can''t defend themselves, but as you iterate through the gameplay loop, you
    can start adding more creepers — and even other creatures, and items for the player
    to use to defend themselves.


    # Reward: Make players want to win


    Rewarding your players makes your game fun for them. Rewards can come in many
    forms, such as allowing players to move on to the next level or awarding them
    items such as stars and coins. Some games even take coins to another level, by
    allowing players to use coins to purchase items that can help them beat other
    levels.


    In the example of a simplified Minecraft game (from the earlier "Goal" section),
    a player is rewarded with full health after finding an Instant Health potion.
    Similarly, if the player is playing Minecraft at the Peaceful difficulty level,
    simply staying alive and uninjured is rewarded with health.'
