  md: '# About the Author


    Sarah Guthals, Ph.D, is a computer scientist and an educator who has worked as
    a programmer at Microsoft, NASA-JPL, and ViaSat. She has also taught hundreds
    of teachers from around the world how to teach computer science to students as
    young as 7. Sarah now the chief technical officer (CTO) and cofounder of ThoughtSTEM,
    where she develops curriculum and training for teaching computer science through
    Minecraft modding.


    Stephen Foster, Ph.D, is an educator and software engineer who has been developing
    educational software for teaching coding throughout his career. Stephen is the
    CEO of ThoughtSTEM and acts as Lead Developer for ThoughtSTEM''s educational technologies,
    which include LearnToMod and CodeSpells. Stephen paved the way for teaching kids
    coding through modding Minecraft.


    Lindsey Handley, Ph.D, is a scientist and educator with a passion for high quality
    STEM education for K-12 students. Lindsey is currently the COO of ThoughtSTEM
    and manages its coding after-school programs and camps in over 25 locations across
    San Diego. Lindsey also provides support to teachers across the world who want
    to teach coding in their classrooms using the LearnToMod software.


    # Dedication


    We dedicate this book to our close friends, and to our families, who have supported
    us not only in writing this book but also in becoming who we are today. We specifically
    dedicate this book to Adrian Guthals, who stayed up late at night to battle Sarah
    in Spleef, Monster Arena, and Capture the Flag. Those games wouldn''t have been
    much if Adrian hadn''t been there to play-test them.'
  merge: -1
