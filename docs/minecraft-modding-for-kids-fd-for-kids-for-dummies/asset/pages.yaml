  md: '# Iteration 2: Set up the explode event


    After you''re sure that your block can launch, you need to register when it lands,
    because that''s when it should explode. To set up the explode event, follow these
    steps:


    +   1. Revisit the state-machine shown earlier, in Figure 7-9.


    Your block should explode only if you have already launched it. When it''s exploding,
    it''s no longer launching. Figure 7-17 shows how the explode function updates
    the state of your mod using the launching and exploding variables.


    ![](img/19c5471683adbccca3dbd246857a25f8_214_0.png)


    Figure 7-17


    +   2. Test the mod.


    You see a scene like the one shown in Figure 7-18. When the block hits something,
    you see the message Now Exploding!


    +   3. Add the info parameter to the explode function and use it to get information
    about the block that triggered the event.


    Because this function is being called from an event, a certain block (the bedrock
    block that you launched) triggers the event. You can use the info parameter to
    get the location where the bedrock landed and cause an explosion around that location.
    Then set the exploding variable to false, because it is no longer exploding. Figure
    7-19 shows the code for these changes.


    +   4. Test your code.


    You see a scene like the one shown in Figure 7-20, where an explosion takes place
    on the spot where the bedrock block lands.'
