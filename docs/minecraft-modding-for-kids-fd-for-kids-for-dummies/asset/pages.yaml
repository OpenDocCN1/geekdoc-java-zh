  md: '# Making a Multiplayer Minigame: Capture the Flag


    In Project 7, I show you how to create a Projectile library, which you can use
    to create a mod that causes an explosion and create a mod that teleports you to
    another location.

    I like to call these mods magic wands because, with only one motion, you can create
    a big effect! In this project, I explain how to create a Capture the Flag game
    where you use these wands to defend your flags, while you seek out your opponent''s
    flags.


    In the early 1980s, Scholastic released a Capture the Flag-style game on one of
    the first home computers. Since then, many games have used this as a reference
    for their games (Call of Duty, Halo, and Team Fortress 2 are just a few) because
    of the competition that Capture the Flag inspires. In this project, I show you
    how to turn Minecraft into a Capture the Flag game and how to craft the competition
    however you like!


    ![](img/19c5471683adbccca3dbd246857a25f8_237_0.png)'
  merge: -1
  pgno: 237
- img_proc: true
