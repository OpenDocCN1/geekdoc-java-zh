    # Debug: Fix bugs related to events


    In Minecraft, you have no way to indicate that you no longer want to trigger events.


    To trigger an event means that Minecraft recognizes the event has happened and
    then calls the function that was set up in the event call. For example, earlier
    in this project, Figure 4-26 shows the SetupPlayer function, which has an event
    setup block in it. This event is triggered after two seconds, and it teleports
    the player to the center of the arena.


    Because you don''t always want events to be triggered, testing your code can be
    difficult. For example, in Spleef you replace only the block below you with air
    if you''re walking on diamond blocks (the arena).


    If you run the Spleef mod and play it and then decide to explore a cave instead,
    you start to fall through the ground. That''s because, as you can see in Figure
    4-29, every 1 second the removeBlock-AfterStep function is called and the block
    below you is replaced with an air block.'
