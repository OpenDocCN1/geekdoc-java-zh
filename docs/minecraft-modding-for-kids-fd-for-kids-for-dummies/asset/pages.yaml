  md: '# Project 1: Getting Started on Modding Minecraft


    # Use the LearnToMod Online Software


    The LearnToMod online software walks you through a series of challenges that you
    complete in order to earn badges. These challenges help show you basic programming
    skills and how to make Minecraft mods.


    In this section, I show you how to log in to the LearnToMod software (available
    at mod.learntomod.com), create and run your first mod, and share that mod with
    other modders.


    # Sign up for the LearnToMod online software


    Signing up for the LearnToMod online software is quick and easy. It takes only
    about 5 minutes to complete the sign-up process and start earning badges.


    Find your access key for LearnToMod on the inside front cover of this book, and
    then follow these steps to access your new LearnToMod account:


    +   1. **Go to http://mod.learntomod.com.**


    The first time you log in, the site redirects you to ThoughtSTEM''s login page
    to create your account.


    +   2. **Use the Sign Up window (located below the Log In window, as shown in
    Figure 1-1) to create your LearnToMod account.**


    If you need to, you can contact the LearnToMod customer service team at learntomod@thoughtstem.com.


    You can choose whatever password you want for your account. It does not have to
    be the access key.


    +   3. **After you create your LearnToMod account, you are redirected to a page
    that asks for your access key. Copy and paste the access key that appears in the
    inside front cover of this book, as shown in Figure 1-2.**'
