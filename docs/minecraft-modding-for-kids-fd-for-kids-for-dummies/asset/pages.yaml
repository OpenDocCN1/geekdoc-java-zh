  md: "# Iterating on Gameplay Using an Existing Game: Capture the Flag\n\nIn this\
    \ project, I show you how to convert the single-player version of Capture the\
    \ Flag to multiplayer. Playing Capture the Flag by yourself isn't much fun — you\
    \ need to have at least one other player. Before reading this project, complete\
    \ all the code instructions from Project 8. Your code example should look like\
    \ Figure 8-73. Then test all the code you wrote in Project 8.\n\nAlways test the\
    \ code before you start making changes.\n\nFirst I show you how to change the\
    \ gameplay loop to include the second player and how to iterate over the code\
    \ to add the second player to each function. This ensures that the second\n\n\
    ```\nfunction CastSpell with: info & Player\nset local WandPlayer to info\\sarah-examples_magic_copy_item_in_hand\n\
    set local Wand to\nif Wand == ExplosionWand\nd    Send message Casting the Exploding\
    \ Wand to WandPlayer\nsarah-Exploding_Projectile_launch\n    casting_player\n\
    \    TeleportationWand\nif Wand == TeleportationWand\nd    Send message Casting\
    \ the Teleportation Wand to WandPlayer\nsarah-TeleportationWand_launch\n    casting_player\n\
    TeleportationWand\n```"
  merge: -1
