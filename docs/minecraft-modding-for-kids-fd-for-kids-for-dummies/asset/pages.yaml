  md: '# Part 1: Making Your First Minecraft Mod


    # REMEMBER


    ![](img/19c5471683adbccca3dbd246857a25f8_99_0.png)


    Being able to make multiple drones can also come in handy if you

    want to make multiple structures. Each drone can be in charge of

    making a different structure, and you don''t have to reset one

    before making something new.


    # Debug Complex Mods


    When the code in your mod isn''t working the way you want, such

    as when you make a row of eight bricks instead of two rows of

    four bricks, you may have an error, or *bug*. If your code has a bug in

    it, you have to *debug* it, or fix it. Writing large, complex mods

    makes it even even more likely that you''ll run into mistakes that are

    hard to find.


    In this section, I give you four strategies for debugging your code:


    +   * Walk away. When your code stops making sense, just walk

    away and watch a video or TV show, and then get back to the

    task at hand. Sometimes, when you work on one problem for a

    long time, you miss the error that would be easy to find if you

    were to simply take a break. Tech companies such as

    Microsoft, Google, and Facebook often have game rooms with

    Xbox, PlayStation, football, and ping-pong set up so that their

    mers can take breaks when they run into tricky bugs.


    +   * Draw using pencil and paper. The great thing about program-

    mthing you can see is that you can trace your code

    and draw it out on paper. Go line by line and move your pencil

    just like the drone, and draw a block whenever the drone

    places a block. That will help you see anything that is going

    wrong.


    +   * Disable blocks. In this helpful technique, you add the blocks

    into your mod 1 block by 1 block. Rather than delete your

    code, you can just disable specific lines that may be causing

    trouble. Figures 3-38 and 3-39 show you how to disable blocks.'
  merge: -1
  pgno: 99
