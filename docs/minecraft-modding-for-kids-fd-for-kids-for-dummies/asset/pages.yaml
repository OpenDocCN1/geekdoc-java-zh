  md: '70 Part 1: Making Your First Minecraft Mod


    # # Build a Tower in Minecraft By Breaking Coding into Phases


    Knowing how to create drones, move them, and use them to place blocks allows you
    to build anything you can imagine. Building large, complex structures, however,
    requires lots of code, and the whole process can get confusing.


    Before making a large, complex structure, explore how to make a smaller structure
    so that you can understand the mechanics of building with drones. The following
    sections spell out how to create a tower using drones.


    Coding is a complicated process, but it can be broken up into three main segments:
    design, develop, test. Expert coders cycle through these three stages throughout
    the coding experience:


    +   **Design**: In this phase, you (the coder) evaluate the problem that you''re
    trying to solve, such as building a tower in Minecraft. You research different
    ways of solving the problem and come up with a plan of action. This phase requires
    using paper and pencil. You draw a tower on paper and make notes on how many blocks
    high the tower is, and what material it is made of, like brick.


    Sometimes, you restructure your code without changing what it does—that''s known
    as *refactoring*. Figure 2-14 (over in Project 2) is quite a long main function
    with multiple stories being told. To make the code easier to see without changing
    the stories, you *refactor* the code so that it looks like Figure 2-16. The code
    changes, but what it does (tell two stories) doesn''t change.


    +   **Develop**: In this phase, you write the code that follows the plan of action
    from the design phase. Sometimes you hit a roadblock (you didn''t think about
    how wide the tower should be, for example) and you have to return to the design
    phase to redesign some or all of the solution.'
  merge: -1
  pgno: 81
- img_proc: true
  md: '# Project 3: Building and Protecting Structures


    **Test:** In this phase, you test the code you wrote to make sure it does what
    you want in all cases. Testing can be complicated, so coders write test cases.


    For example, if your program is supposed to add two numbers, test to make sure
    that all the following test cases pass (examples are included):


    +   - Two positive numbers should make a positive number:

    - 2+5 = 7.


    +   - Two negative numbers should make a negative number:

    - -5 + -3 = -8.


    +   - A positive number and a negative number results in subtracting the negative
    number from the positive number: -9 + 5 = -4.


    +   - A letter and a number should return an error.


    +   - Two letters should return an error: a + b = ERROR.


    +   - Large numbers should add together: 500 + 289 = 789.


    +   - A mixture of numbers, letters, or any other symbols (@, for example) should
    return an error: h7w + 9 = ERROR.


    Consider all the ways the code should work, and all the ways it shouldn''t. You''ll
    have to return to the development or design phase. Finding and fixing bugs is
    one of the most time-consuming areas of coding, but if you find the bugs in early
    cycles, coding becomes much faster.


    Sometimes the code you write is simple, so cycling through these phases isn''t
    complicated. But as you start writing larger and more complex code, it becomes
    more important to make sure you''re completing all three phases. If you go straight
    to coding and don''t design or test, you will definitely have bugs in your code
    and your program won''t work how you expect it to.'
