    # Design a simple house on paper


    First, sketch out the house on paper. (Figure 3-45 shows an example of how to
    do it.) Though this process is slightly more complicated than building the tower
    earlier in this project, in the "Build a Tower in Minecraft By Breaking Coding
    into Phases" section, the same principles of design apply, such as drawing at
    the house from multiple angles. As with the tower, you should figure out what
    functions are needed to build the house (see Figure 3-45).


    In the Tower mod (described in the earlier section "Build a Tower in Minecraft,"
    you move code into functions as you write the mod; in this mod, you should decide
    what functions you want to create as you design the code. This alternative design
    strategy requires further refactoring iterations (the number of times you have
    to refactor your code) because you already know the functions, and you don''t
    have to move code into functions after you write it. Figure 3-45 shows the functions
    labeled and defined on paper.


