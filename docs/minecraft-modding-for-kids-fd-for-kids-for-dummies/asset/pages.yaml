  md: '# # Minecraft Modding with Friends: The Multiplayer Version of Spleef


    Making Minecraft minigames can be a lot of fun because after you make it you can
    play games inside Minecraft for hours, but what is even more fun is making minigames
    that you can play with your friends. In this project, I show you how to convert
    single-player games (games that only have player) into multiplayer games (games
    that have more than one player). I also explain how to change the gameplay loop
    (for the single-player Spleef game from Project 3) so that you can design a multiplayer
    game from the ground up.


    ![](img/19c5471683adbccca3dbd246857a25f8_179_0.png)'
  merge: -1
  pgno: 179
- img_proc: true
  md: '# Project 6: Minecraft Modding with Friends


    # Start from the Single-Player Spleef Game


    Rather than remake the entire Spleef game, you can start from the single-player
    version and turn it into a multiplayer version.


    Note: Before you begin this section, you should have already built Spleef. If
    you haven''t built it yet, go back to Project 4 and build a single-player Spleef
    game.


    To start from single-player, follow these steps:


    +   1. Open the completed single-player Spleef mod (described in Project 4), click
    the Actions tab, and then choose Copy from the menu, as shown in Figure 6-1.


    ![](img/19c5471683adbccca3dbd246857a25f8_180_0.png)


    Figure 6-1


    +   2. Click to select the copied version of Spleef, shown in Figure 6-2, and
    then click on Code to go into the programming environment.


    ![](img/19c5471683adbccca3dbd246857a25f8_180_1.png)


    Figure 6-2'
  merge: -1
  pgno: 180
- img_proc: true
  md: '# 170 Part 2: Making Your First Minecraft Minigame


    3. At the top of the screen, click the Actions tab and choose Rename from the
    menu, as shown in Figure 6-3.


    ![](img/19c5471683adbccca3dbd246857a25f8_181_0.png)


    Figure 6-3


    4. Rename the mod to Sleef_Multiplayer, as shown in Figure 6-4.


    ![](img/19c5471683adbccca3dbd246857a25f8_181_1.png)


    Figure 6-4


    5. After the page reloads, click on the Sleef multiplayer mod again, as shown
    in Figure 6-5, and then click the code button to go into the programming environment.


    You''re ready to start modifying your single-player version of Sleef to make it
    multiplayer.


    If you make a mistake at any point, you can always go back and make another copy
    of your single-player version.'
  merge: -1
