  md: '# Write Mods with Functions


    In Project 1, I describe how to write a mod that has a function named main (refer
    to Figure 1-27, over in Project 1). From now on, I''ll call it the main function.
    When you run a mod in Minecraft, your mod always starts running from the main
    function.

    Notice that the Saying Hello badge is similar to the Your First badge, except
    that it has three messages instead of two. Figure 2-1 shows the code you should
    write to complete the Saying Hello badge.


    ```

    main

    Send message "Hello" to me

    Send message "How are you?" to me

    Send message "My name is Steve." to me

    ```


