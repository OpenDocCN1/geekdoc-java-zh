  md: '# 210 Part 3: Designing and Building a Multiplayer Minigame


    # Make a Projectile Library


    You can make lots of projectile effects in addition to exploding. Rather than
    rebuild all the projectile code from scratch, you can abstract the projectile
    state-machine (make it a projectile state-machine for any effect, not just exploding)
    and create a library that helps you build a lot of different projectiles.


    A library is a mod that lets you call functions from other mods. In Project 4,
    I show you how to use the ArenaBuilder library to call the arena function to build
    an arena.


    # Set up the projectile mods


    To set up the projectile mod, copy the projectile mod that I explain how to make
    in the preceding section. Follow these steps:


    +   1. Click the Actions tab and then choose the Copy command, as shown in Figure
    7-31.


    You see two versions of the projectile mod, as shown in Figure 7-32.


    ![](img/19c5471683adbccca3dbd246857a25f8_221_0.png)


    ![](img/19c5471683adbccca3dbd246857a25f8_221_1.png)


    +   2. Open one mod and rename it Projectile_Library, as shown in Figure 7-33.'
