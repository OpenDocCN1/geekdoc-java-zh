  md: '# Project 7: Modding with Projectiles


    TIP Make one more copy of your mod and name it Original_Explosion_Projectile,
    just in case you mess up and need to get back to a working mod.


    # Change the main and launch functions


    The first list in the previous section specifies the information that the Projectile_Library
    should handle. In this section, however, I tell you how to actually make the changes
    in your code.


    To make changes to the main function, follow these steps:


    +   1. Rename the main function init.


