  md: '# Part 1: Making Your First Minecraft Mod


    In this chapter, I explain what a mod is, describe how to use the LearnToMod online
    software and how to connect to the LearnToMod multiplayer Minecraft Server, and
    spell out how to use the basic tools, such as invisible robots, that you need
    in order to make your own, fun-filled mods.


    # Know What Minecraft Modding Is


    Video games are made up of thousands of lines of code. Code makes players (like
    you) able to explore new worlds, interact with characters, and have fun.


    Some games, like Minecraft, allow players to add their own code to the games to
    create new worlds, challenges, or even characters. Throughout this book, I show
    you how to write these game modifications — or *mods* — and you can then see how
    to write code.


    Perhaps you have already begun to explore the world of Minecraft mods. Programmers
    all around the world have created their own mods and shared them with Minecraft
    players — for free.


    Mods can consist of almost any task; this list describes a few tasks that you
    can accomplish by using mods:


    +   - **Texture**: Change the way the Minecraft world looks by applying a new
    texture pack.


    +   - **Block interaction**: Cause an explosion whenever the player destroys a
    block of type wood.


    +   - **New block**: Create new blocks.


    +   - **Minigame**: Create a minigame to play *within* a Minecraft world.


    +   - **Large structure**: Create huge structures to explore and personalize —
    ones that would take a long time to make by hand but take only a short time to
    make with code.'
  merge: -1
