    dot would be along the red side, deep into the screen.


    One way to make the block launch is to teleport (move) the block to a specific
    location using the teleport block in LearnToMod. You can teleport the block to
    (1,1,1) then (2,2,2) then (3,3,3) then (4,4,4) and this could work, but if you
    search through your Minecraft will find some useful blocks in the LearnToMod Block
    category, as you can see in Figure 7-4.'
