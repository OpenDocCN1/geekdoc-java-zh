  md: '# # Getting Started on Modding Minecraft


    **In this book, I** show you how to write minigame Minecraft mods. A minigame
    Minecraft mod is a game that you play *inside* of Minecraft. You can see how to
    make several minigames and gain the skills you need to perfect a minigame of your
    own creation.


    The LearnToMod online software teaches you how to make modifications, that you
    can run in the multiplayer version of Minecraft. With hundreds of badges to guide
    you through various programming concepts and mods, you''ll gain the skills necessary
    to make creative mods of your own. You should have some basic familiarity with
    playing Minecraft, but you don''t need to be an expert. All you need is the computer
    version of Minecraft and an Internet connection.


