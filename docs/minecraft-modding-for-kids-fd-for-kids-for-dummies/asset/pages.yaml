  md: '# Project 5: Making a Multilevel Minecraft Minigame


    To make the circular arena, you need to make a cylinder and a circle, which you
    can find under the Generation category on the wiki (it''s towards the bottom).


    Figure 5-4 shows how to use the WorldEdit commands in Minecraft. The WorldEdit
    commands use algorithms (another way of saying lists) to create the effect in
    the Minecraft world. The figure is from the wiki page about WorldEdit commands,
    found at


    http://wiki.sk89q.com/wiki/WorldEdit/Generation#Cylinders_and_circles


    Cylinders and circles

    | /fill <radius> <height>

    | /hollow <radius> <height>

    WorldEdit is capable of producing both hollow and filled cylinders as well as
    hollow and filled circles. It uses a fast algorithm to generate the objects and
    algorithms for vertical and conical edges. The cylinders are created at height
    and extend upwards. If you are creating a circle, you simply need to create a
    cylinder of height 1.


    Example: Creating a filled glass cylinder of radius 5 and height 10

    /fill glass 5 10


    Example: Creating a hollow glass circle of radius 5

    /hollow glass 5 1


    Figure 5-4


