  md: '# Authors'' Acknowledgments


    We would like to acknowledge all of the hard work that went into making Minecraft,
    an incredibly fun and open-ended game played by millions around the world. Without
    Minecraft, we couldn''t have made LearnToMod, and we couldn''t have written this
    book. We also want to thank the hard-working coders who helped with LearnToMod
    — using their fast and creative problem-solving skills, we can help teach kids
    how to make even more with Minecraft. And, of course, we want to thank the millions
    of kids around the world who play Minecraft. You inspired us to teach coding through
    Minecraft!


