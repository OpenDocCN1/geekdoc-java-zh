  md: '# Keep track of state


    An important aspect to keep track of in the exploding projectile mod is the state
    of the block. State describes what the block is doing at this moment. To see an
    example, you can track your own state for an entire day, and you can use a state-machine
    (a diagramat that tracks data about the events in the world) to keep track of
    it, as shown in Figure 7-8.


    ![](img/19c5471683adbccca3dbd246857a25f8_208_0.png)


    Figure 7-8


    In this mod, state is important to keep track of because you don''t want the block
    to explode before you launched it, or before it lands. If it explodes too soon,
    it won''t destroy your target (the place where it lands). State-machines are useful
    representations of all possible states in the world (or at least the ones you
    care about). Figure 7-8 shows you how to make a state-machine about your real
    life, as it applies to playing Minecraft.


    As you can see in Figure 7-8, you might be in one of these four states (in real-life):


    +   - Asleep


    +   - Eating


    +   - Modding


    +   - Playing Minecraft'
  merge: -1
  pgno: 208
- img_proc: true
  md: '# 198 Part 3: Designing and Building a Multiplayer Minigame


    If you follow the direction of the arrow from the Asleep state shown in the figure,
    you can see that the only action you can take when you leave that state — or when
    you wake up — is to eat (probably breakfast). By following the directions of the
    arrows again, you can see that after you eat, you can either mod or play Minecraft.
    You can rotate between eating, modding, and playing Minecraft all you want. But
    if you want to go to sleep again, you have to eat first (probably dinner).


    The state-machine for your block looks something like Figure 7-9. The lines show
    actions that *must* happen if the previous hap-pens, and once the block is destroyed,
    the mod is over and you can run it again.


    ![](img/19c5471683adbccca3dbd246857a25f8_209_0.png)


    Figure 7-9


    The state-machine in Figure 7-9 is simpler than your Minecraft day state-machine
    in Figure 7-8 because your block can take only one path through it. Once it is
    created, it *must* be launched, then it *must* explode, then it *must* be destroyed.
    Once it has been destroyed, the mod is completed.


    Running the mod initiates the create state, but it is useful to keep track of
    whether the block has been launched and whether it has been exploded. Figure 7-10
    shows the two variables you should add to keep track of the state of the block.'
