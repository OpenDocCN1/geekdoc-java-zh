  md: '# Iteration 3: End the Game at 200 Blocks


    You should have the multiplayer version of Spleef whenever one player reaches
    200 blocks. Before doing this, however, revisit your scene. Only 400 blocks are
    on the platform, so it might be difficult to achieve the goal of destroying 200
    blocks because it would mean that a player would have to destroy exactly half
    of the blocks to win, minimizing the number of strategies (like destroying blocks
    on opposite sides of the arena) that the players can use. An easy fix is to double
    the size of the arena.


    Here''s a quick fix: in the Arena function, change PlatformSize from 20 to 40
    for both the lava platform and the diamond arena, as shown in Figure 6-34.


    ```

    function Arena

    sarah-ArenaBuilder.init

    sarah-ArenaBuilder.ArenaWithFence

    FenceHeight 1

