  md: '# Modding with Projectiles


    Being able to build objects, send drones out, or trigger events can be fun; being
    able to cast mods into the world and how they affect the area around where they
    land is powerful. In this project, I show you how to make and run a mod that projects
    a block into the world and causes an explosion when it lands.


    ![](img/19c5471683adbccca3dbd246857a25f8_202_0.png)'
  merge: -1
  pgno: 202
- img_proc: true
  md: '# Part 3: Designing and Building a Multiplayer Minigame


    # Design and Build an Exploding Projectile


    In this section, I show you how to write a mod that, when run in Minecraft, causes
    a block to be thrown from your location. When the block lands, it causes an explosion,
    destroying anything around it. You can later modify this fun, powerful mod to
    have it other things also, such as teleport you where it landed.


    # Design the launch and explosion


    Before you start coding, plan your strategy. Writing this exploding projectile
    mod isn''t as complex as a minigame mod, but you need to design its complex pieces
    still (such as where it should be thrown from and what what should happen when
    it lands).


    For starters, you will need to define these two actions to make the block


    +   - Launch when the mod is run

    - Explode when it lands


    # Plan the block launch


    When you run your mod, make a block (maybe bedrock) to start from your position
    and move up and away from you. Designing the code for a three-dimensional (3D)
    mod is kind of tricky because you can''t draw it easily on paper. (3D involves
    six directions: up, down, left, right, forward, and backward). To write this 3D
    mod, use x-, y-, and z-coordinates to plan out where the block will start and
    how it will move. Check out the following Math Connections paragraph for an explanation
    of x-, y-, and z-coordinates, if you don''t already know about them.


    When you draw something on paper, you''re making a 2D drawing. You know that something
    is 2D because it has only four directions (up, down, left, and right). In math,
    the y-axis (a higher value for y is up and a lower value for y is down). Left
    and right are represented by the x-axis (a higher value for x is right, and a
    lower value for y is left). This makes x-coordinate and y-coordinate easy to see
    in 2D space.


    ![](img/19c5471683adbccca3dbd246857a25f8_203_0.png)'
  merge: -1
  pgno: 203
- img_proc: true
  md: 'Figure 7-1 shows a 2D x-y plane with a dot at the position x=1 and y=3, which
    can also be represented as (1,3).


    ![](img/19c5471683adbccca3dbd246857a25f8_204_0.png)


    To understand the 3D world, you have to introduce another direction (forward and
    backward), and in math, this is represented by a third coordinate: z. Figure 7-2
    shows a third line that represents the z-plane moving into the screen. The green
    dot is the same dot from Figure 7-1; it''s at (1,3,0). The red dot is at (1, 3,
    4) and is actually deep into the screen.


    Figure 7-3 shows how a cube would look on the x, y, z-planes. The green dot from
