  md: '# Project 8: Making a Multiplayer Minigame: Capture the Flag


    +   ExplodingProjectile: The exploding projectile sends a message, which needs
    to go to the player who has cast the spell, not me, so a parameter needs to be
    passed into this mod.


    +   ProjectileLibrary: The projectile library needs to know from where to originate
    the projectile so that it doesn''t always start at the location of me. A parameter
    needs to be passed to this mod as well.


    Change the Projectile Library mod


    You should start by changing the projectile library:


    +   1. Add a parameter to the init function named casting_player, as shown in
    Figure 8-34.


    ![](img/19c5471683adbccca3dbd246857a25f8_254_0.png)


    +   2. Create a new global variable named player, and set its value to casting_player,
    as shown in Figure 8-35.


