  \     ❸\n      <version>2.0.15</version>\n      <scope>test</scope>\n    </dependency>\n\
  \  </dependencies>\n```\n\n❶ 因为我们自定义的文件约定，我们必须告诉 Maven 要运行哪些内容。\n\n❷ 使用 JUnit 的断言\
  \ API\n\n❸ 使用 Spek 与 JUnit 测试运行器的集成\n\n在 Gradle 中，我们挂载到标准的 `test` 任务，并向 `JUnit`\
  \ 平台通知 Spek 引擎，如下代码段所示。你可能会发现，命令行测试即使在没有引擎行的情况下也能看到我们的规范，但像我们的 IDE 这样的系统可能会漏掉它们：\n\
