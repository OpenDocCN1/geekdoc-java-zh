  \ 附录 B Java 8 流（Streams）复习\n\n本附录是对 Java 8 流以及与之相关的基础函数式编程方面的进行复习。如果你不熟悉 Java 8\
  \ lambda 表达式的基本语法，或者其设计背后的哲学，你应该先读读基础文本来熟悉这些概念，例如 [*Modern Java in Action: Lambdas,\
  \ Streams, Functional and Reactive Programming*, 2nd ed.](https://livebook.manning.com/book/modern-java-in-action)，由\
  \ Raoul-Gabriel Urma、Mario Fusco 和 Alan Mycroft 编写（Manning, 2018）。Java 8 作为 `Project\
  \ Lambda` 的一部分引入了 lambda 表达式，其总体目标可以总结如下：\n\n* 允许开发者编写更整洁、更简洁的代码。\n* 为 Java 集合库提供现代化的升级。\n\
  * 引入一种允许方便使用基本函数式惯用法的抽象。\n\n在本附录中，我们讨论了集合库的升级、默认方法以及作为数据元素函数式容器类型的 `Stream` 抽象。\n\
  \n### B.1 向后兼容\n\nJava 平台最重要的概念之一是向后兼容。其指导哲学始终是：为平台早期版本编写或编译的代码在平台的后续发布中必须继续运行。这一原则让开发者有更大的信心认为\
  \ Java 平台软件的升级不会影响当前运行的应用程序。\n\n由于向后兼容，平台演进的方式存在限制——这些限制影响了开发者。\n\n注意：为了向后兼容，Java\
  \ 平台可能不会向 JDK 中的现有接口添加额外方法\n\n为了理解为什么如此，请考虑：如果平台新版本 `N` 添加了一个新方法，所有使用平台 `N–1` 编译的\
  \ `IFoo` 实现都将缺少该方法。\n\n### B.2 默认方法\n\n为了解决这个问题，需要一种全新的机制。目标是允许通过默认方法升级接口。\n\n注意：从\
  \ Java 8 开始，可以向任何接口添加默认方法（有时称为可选方法）。它必须包含一个实现，称为*默认实现*，并内联在接口定义中。这种变化代表了接口定义的演进，且不会破坏向后兼容性。\n\
  \n默认方法的规则如下：\n\n* 接口的任何实现*可以*（但不是必须）实现默认方法。\n* 如果实现类实现了默认方法，则使用类中的实现。\n* 如果实现类*没有*实现默认方法，则使用（接口的）默认实现。\n\
  \n让我们看一个例子。JDK 8 添加到 `List` 的默认方法之一是 `sort()` 方法。其定义如下：\n\n```\npublic default void\
  \ sort(Comparator<? super E> c) {\n    Collections.<E>sort(this, c);\n}\n```\n\n\
  这意味着任何 `List` 对象都拥有一个实例方法 `sort()`，可以使用适当的 `Comparator` 对列表进行原地排序。任何 `List` 的实现都可以提供其对\
  \ `sort()` 行为的重写，但如果没有提供，则回退到 `Collections` 工具类中提供的默认实现将可用。\n\n默认方法机制通过类加载工作。当加载接口的实现类时，会检查类文件查看是否存在所有可选方法。如果是，则正常加载类；如果否，则将对实现类的字节码进行补丁，以添加缺失方法的默认实现。\n\
  \n\n\n\n\n开发者应该理解默认方法工作原理的一个细节：`default implementation clash`（默认实现冲突）的可能性，它包含两个部分。首先，如果实现类已经有了一个与新默认方法名称和签名相同的方法，则将始终优先使用现有的实现，而不是默认实现。\n\
  \n其次，如果一个类实现了两个接口，而这两个接口都包含相同名称和签名的默认方法，则该类必须实现该方法（它可以选择委托给接口的默认实现，也可以执行完全不同的操作）。这引发了这种可能性：即向接口中添加默认方法可能会破坏客户端代码，因为如果客户端代码已经实现了另一个带有默认方法的接口，就可能存在实现冲突。然而在实践中，这种情况非常罕见，与默认方法带来的其他好处相比，这种可能性被认为是付出的微小代价。\n\
  \n## B.3 Streams（流）\n\n回想起 Project Lambda 的目标之一是为 Java 语言提供轻松表达函数式编程技术的能力。例如，这意味着\
  \ Java 获得了编写 `map()` 和 `filter()` 惯用法的简单方法。\n\n在 Java 8 的原始设计草图中，这些惯用法是通过直接将这些方法作为额外的默认方法添加到经典的\
  \ Java Collections 接口中来实现。然而，这种方法出于几个原因是不尽如意的。\n\n其一，因为 `map()` 和 `filter()` 是相对常见的名称，人们认为现有实现的风险太高——许多用户编写的\
  \ Collections 实现可能已经存在的方法，这些方法不会遵循新方法的预期语义。\n\n相反，发明了一种名为 `Stream` 的新抽象。`Stream`\
  \ 是一种容器类型，在某些方面它类似于处理集合和聚合数据的更函数式的方法的迭代器。\n\n`Stream` 接口是放置所有新 `functionally orientated`（面向函数）方法的地方，例如\
  \ `map()`、`filter()`、`reduce()`、`forEach()` 和 `flatMap()`。`Stream`上的方法大量使用了函数接口类型，例如将\
  \ lambda 表达式作为参数。\n\n`Stream` 最好被视为可以消费的元素序列。这意味着从 `Stream` 中取出元素后，它将不再可用，这与 `Iterator`\
  \ 非常相似。\n\n注意 由于 `Stream` 对象是可消费的，它们不应该被重用或存储在临时变量中。将 `Stream` 值赋值给局部变量几乎总是代码异味（code\
  \ smell）。\n\n原始的 Collections 类（如 `List` 和 `Set`）被赋予了一个新的默认方法，称为 `stream()`。它返回该集合的\
  \ `Stream` 对象，其方式与在使用经典集合的代码中使用 `iterator()` 的方式类似。\n\n### B.3.1 示例\n\n这段代码展示了我们如何使用\
  \ `Stream` 和 lambda 表达式来实现一个过滤惯用法：\n\n```\nList<String> myStrings = getSomeStrings();\n\
  String search = getSearchString();\n\nSystem.out.println(myStrings.stream()\n  \
  \                          .filter(s -> s.equals(search))\n                    \
  \        .collect(Collectors.toList()));\n```\n\n注意我们还需要调用 `collect()`——这是因为 `filter()`\
  \ 返回另一个 `Stream`。为了在我们的过滤操作后返回一个集合类型，我们需要执行某些操作来主动将 `Stream` 转换为 `Collection`。\n\
  \n整体方法如下：\n\n```\n stream()  filter()   map()   collect()\nCollection -> Stream\
  \ -> Stream -> Stream -> Collection\n```\n\n这个想法是让开发者构建一个需要应用于流的操作“流水线”。每个操作的实际内容将使用针对每个操作的\
  \ lambda 表达式来表示。在流水线的末端，结果需要被实体化回集合，因此使用了 `collect()` 方法。\n\n让我们看看 `Stream` 接口定义的定义（定义了\
  \ `map()` 和 `filter()` 方法）：\n\n```\npublic interface Stream<T> extends BaseStream<T,\
  \ Stream<T>> {\n    Stream<T> filter(Predicate<? super T> predicate);\n\n    <R>\
  \ Stream<R> map(Function<? super T, ? extends R> mapper);\n\n    // ...\n}\n```\n\
  \n注意 不要担心这些定义中看起来很吓人的泛型。所有的 `? super` 和 `? extends` 子句的意思都是：“当流中的对象具有子类时，执行正确的操作。”\n\
  \n这些定义涉及两个新接口：`Predicate` 和 `Function`。这两个都可以在 `java.util.function` 包中找到。这两个接口都只有一个方法，且该方法没有默认实现。因此，我们可以为它们编写\
  \ lambda 表达式，它会自动转换为正确类型的实例。\n\n注意 记住（通过类型推断）转换为正确的 `functional interface`（函数接口）类型是\
  \ Java 平台在遇到 lambda 表达式时总是会做的。\n\n让我们来看一个代码示例。假设我们正在对水獭种群建模。一些是野生的，另一些在野生动物公园里。我们想知道有多少圈养的水獭是由实习动物饲养员照顾的。使用\
  \ lambda 表达式和流，这很容易做到，如下所示：\n\n```\nSet<Otter> ots = getOtters();\nSystem.out.println(ots.stream()\n\
  \    .filter(o -> !o.isWild())\n    .map(o -> o.getKeeper())\n    .filter(k -> k.isTrainee())\n\
  \    .collect(Collectors.toList())\n    .size());\n```\n\n首先，我们过滤流，只处理圈养的水獭。然后，我们执行\
  \ `map()` 来获取饲养员流，而不是水獭的流（注意此流的类型已从 `Stream<Otter>` 变为 `Stream<Keeper>`）。然后，我们再次进行过滤，选择出实习饲养员，然后使用静态方法\
  \ `Collectors.toList()` 将其实体化。最后，我们使用熟悉的 `size()` 方法返回计数。\n\n在这个示例中，我们将水獭转换成了负责它们的饲养员。为此此，我们没有修改任何水獭的状态——这有时被称为无副作用（side-effect\
  \ free）。\n\n注意 在 Java 中，惯例是 `map()` 和 `filter()` 表达式中的代码始终应该是无副作用的。然而，这个“规则”并不由\
  \ Java 运行时强制，因此请小心。你在自己的代码中应该始终遵循这一惯例。\n\n如果我们的用意味着我们需要修改某些外部状态，我们可以使用两种方法之一，取决于我们想要实现什么。首先，如果我们想构建聚合状态（例如水獭年龄的运行总和），可以使用\
  \ `reduce()`。或者，如果我们想执行更通用的状态转换（例如当旧饲养员离开时将水獭转移给新饲养员），`forEach()` 更合适。\n\n让我们在下一个代码片段中检查如何使用\
  \ `reduce()` 方法计算水獭的平均年龄：\n\n```\nvar kate = new Keeper();\nvar bob = new Keeper();\n\
  var splash = new Otter();\nsplash.incAge();\nsplash.setKeeper(kate);\nSet<Otter>\
  \ ots = Set.of(splash);\n\ndouble aveAge = ((double) ots.stream()\n    .map(o ->\
  \ o.getAge())\n    .reduce(0, (x, y) -> {return x + y;} )) / ots.size();\nSystem.out.println(\"\
  Average age: \"+aveAge);\n```\n\n\n\n\n\n注意 `reduce()` 的第二个参数是一个两个参数的 lambda 表达式。对此的简单思考方法是：这两个参数中的第一个是聚合操作的“运行总和”（running\
  \ total），而第二个参数实际上是我们在迭代集合时的循环变量。\n\n最后，让我们转向想要更改状态的情况。为了实现这一点，我们将使用 `forEach()`\
  \ 操作。在我们的示例中，我们想模拟饲养员 Kate 去度假的情况，因此目前她所有的水獭都应该移交给 Bob。这可以通过这样轻松地完成：\n\n```\nots.stream()\n\
  .filter(o -> !o.isWild())\n.filter(o -> o.getKeeper().equals(kate))\n.forEach(o\
  \ -> o.setKeeper(bob));\n```\n\n注意 `reduce()` 和 `forEach()` 都没有使用 `collect()`。`reduce()`\
  \ 在遍历流时会收集状态，而 `forEach()` 仅仅是对比流上的所有元素应用一个操作。因此，在两种情况下，都不需要重新实例化化流。\n\n## B.4 集合的局限性\n\
  \nJava 的 `Collections` 为这种语言提供了极佳的服务。然而，它们基于这样一个观点：集合中的所有元素都存在于内存中并在某处被表示。这意味着它们无法表示更通用的数据，例如无限集合。\n\
  \n例如，考虑所有素数的集合。这不能被建模为 `Set<Integer>`，因为我们不知道所有的素数是什么，而且我们显然没有足够的堆空间来表示它们。在 Java\
  \ 的早期版本中，在标准集合内解决这个问题将是非常困难的。\n\n可以构建一种主要通过迭代器（iterators）工作的数据视图，并将底层集合置于辅助角色。然而，这需要自律，而且对于\
  \ Java `Collections` 来说这并不是一种显而易见的方法。在过去，如果开发者想使用这种方法，他们通常会依赖于为该功能提供更好支持的外部库。\n\n\
  幸运的是，Java `Stream` 通过引入 `Stream` 接口解决了这一用例问题，该接口作为一种抽象，比基础的有限集合更适合处理更通用的数据结构。这意味着\
  \ `Stream` 可以被认为比 `Iterator` 或 `Collection` 更通用。\n\n注意 `Stream` 不管理元素的存储，也不提供直接从流访问单个元素的方法。\n\
  \n然而，`Stream` 实际上上并不是一种数据结构——相反，它是一个用于处理数据的抽象，尽管这两种之间的区别有些微妙。\n\n## B.5 无限流\n\n\
  让我们深入研究一下建模无限数字序列的概念。这会导致以下结果：\n\n* 我们无法将整个流物化为集合，因此像 `collect()` 这样的方法是不可能的。\n\
  * 我们必须通过从流中拉取元素来操作。\n* 我们需要一些代码，在我们需要时返回下一个元素。\n\n这种方法也意味着表达式的值在被需要之前不会被计算。\n\n\
  在 Java 8 之前，表达式的值一旦绑定到变量或传递给函数，就会立即被计算。这被称为*急切求值*（eager evaluation），而且它自然是是大多数主流编程语言中表达式求值的默认行为。\n\
  \n注意从第 8 版本开始，Java 引入了一种新的编程范式——`Stream` 在尽可能的情况下使用*惰性求值*（lazy evaluation）。\n\n\
  这是一个非常强大的新功能，确实需要一点时间适应。我们将在第 15 章中更详细地讨论惰性求值。Java 中 lambda 表达式目的是简化普通程序员的生活，即使这需要平台增加额外的复杂度。\n\
  \n## B.6 处理原始类型\n\nStream API 中我们到为止一直忽略的一个重要方面是处理处理原始类型（primitive types）。Java 的泛型（generics）不允许将原始类型用类型参数，所以我们不能写\
  \ `Stream<int>`。幸运的是，`Streams` 库带了一些技巧来帮助我们绕过这个问题。让我们来看例子：\n\n```\ndouble totalAge\
  \ = ((double) ots.stream()\n                             .map(o -> o.getAge())\n\
  \                             .reduce(0, (x, y) -> {return x + y;} ));\n\ndouble\
  \ aveAge = totalAge / ots.size();\nSystem.out.println(\"Average age: \"+aveAge);\n\
  ```\n\n这实际上在管道的大部分使用了原始类型，所以让我们稍微拆解一下，看看这类代码中是如何使用原始类型的。\n\n首先，不要被转换为 `double` 的转换所困惑。这只是为了确保\
  \ Java 执行正确的平均计算，而不是执行整数除法。\n\n`map()` 的参数是一个 lambda 表达式，它接收一个 `Otter` 并返回一个 `int`。如果我们能使用\
  \ Java 的泛型来编写它，该 lambda 表达式将转换为一个实现 `Function<Otter, int>` 的对象。然而，由于 Java 泛型不允许这样做，我们需要以不同的方式编码返回类型为\
  \ `int` 的事实——通过将其放在类型名称中。\n\n由于我们使用了 `IntStream`，我们实际上的是原始类型，推断断是 `ToIntter>`。这种类型是函数类型的特化形式（specialization），以避免装箱和拆箱。\n\
  \n让我们进一步拆解平均值的计算。为了获取每个水獭的年龄，我们使用这个表达式：\n\n```\nots.stream().map(o -> o.getAge())\n\
  ```\n\n让我们看看被调用的 `map()` 方法的定义：\n\n```\nIntStream map(ToIntFunction<? super T> mapper);\n\
  ```\n\n从这里看到我们正在使用 `ToIntFunction`，并且我们实际上使用 `Stream` 的特化形式表示 int 流。\n\n之后传递 `reduce()`，它的定义如下：\n\
  \n```\nint reduce(int identity, IntBinaryOperator op);\n```\n\n这也是一个特化形式，纯针对 int\
  \ 操作，并接收两个参数的 lambda（两个参数都是 int）来执行还原。\n\n`reduce()` 是收集操作（因此是急切的），所以管道在这一点被求值并返回单个值，然后该值被转换为\
  \ double 并得到平均值。\n\n如果你错过了所有关于原始类型的细节，不用担心——这是类型推断的好处之一：在大多数情况下，这些差异可以对开发者隐藏。\n\n\
  让我们最后讨论一个经常被开发者误解的话题：流并行操作的支持。\n\n## B.7 并行操作？\n\n在 Java 的旧版本（7 及以前）中，所有集合的操作都是串行的。无论被操作的集合有多大，只会使用一个\
  \ CPU 核心执行操作。随着数据集的增大，这可能会造成巨大的浪费，Project Lambda 的一个可能目标是升级 Java 对集合的支持，以便有效利用多核处理器。\n\
  \n注意 流的惰性求值方法允许 lambda 表达式框架提供并行操作的支持。\n\nStream API 的主要假设是创建流对象（无论是从集合还是通过其他方式）应该是便宜的，但管道中的某些操作可能是昂贵的。这种假设允许我们这样描述并行管道：\n\
  \n`parallel()` 方法将串流转换为并行操作。其意图是让普通开发者依赖 `parallel()` 作为透明并行化的入口，并将提供并行支持的负担交给库编写者，而不是终端用户。\n\
  \n\n\n\n这在理论上听起来很棒，但在实践中，实现和其他细节最终削减了 `parallel()` 机制的实用性。第 16 章将对此进行更深入讨论。\n\n\
  由于这些局限性，强烈建议你避免使用并行流，除非你能证明（使用第 7 章的方法）你的应用程序将从添加并行流中受益。在实践中，作者在真实环境中看到的不到六个并行流真正有效的案例。\n\
