  \n### 4.4.1 反汇编类\n\n使用 `javap` 配合 `-c` 选项，你可以反汇编类。首先是类头。这里没有什么意想不到或有趣的内容：\n\n```\n\
  $ javap -c -p wgjd/ch04/ScratchImpl.class\n\nCompiled from \"ScratchImpl.java\"\n\
  \npublic class wgjd.ch04.ScratchImpl extends java.lang.Object {\n  private static\
  \ wgjd.ch04.inst;\n}\n```\n\n接下来是静态块。这是放置变量初始化的地方，因此表示将 `inst` 初始化为 `null`。\n\n\
  ```\nstatic {};\n\nCode:\n  0: aconst_null\n  1: putstatic #10 // Field inst:Lwgjd/ch04/ScratchImpl;\n\
  \  4: return\n```\n\n代码中的数字表示从方法开始的字节偏移量。因此字节 1 是 `putstatic` 操作码，而字节 2 和 3 表示常量池的\
  \ 16 位索引。在这种情况下，16 位索引的值为 10，这意味着值（在此例中 `null`）将存储在常量池条目 #10 所向的字段中。\n\n接下来是构造函数：\n\
  \n```\nprivate wgjd.ch04.ScratchImpl();\n\nCode:\n  0: aload_0\n  1: invokespecial\
  \ #15 // Method java/lang/Object.\"<init>\":()V\n  4: return\n```\n\n记住，在 Java 中，空构造函数总是隐式地调用父类的构造函数。在这里你可以从字节码看到这一点——它是\
  \ `invokespecial` 指令。\n\n构造函数的调用需要一个目标，由 `aload_0` 指令提供。该指令加载引用并使用快捷形式加载第 0 个局部变量，这正是\
  \ `this`，即当前对象。\n\n\n\n\n`run()` 方法中基本上没有代码，因为它只是一个用于测试代码的草稿类。该方法会立即返回给调用者，并且不返回任何值（这是正确的，因为方法返回类型\
  \ `void`）：\n\n```\nprivate void run();\n\nCode:\n  0: return\n```\n\n在 `main` 方法中，我们初始化了\
  \ `inst` 并进行了一些对象创建。这展示了一些非常常见的基础字节码模式，我们可以学习识别这些模式：\n\n```\npublic static void\
  \ main(java.lang.String[]);\n\nCode:\n  0: new #1 // class wgjd/ch04/ScratchImpl\n\
  \  3: dup\n  4: invokespecial #21 // Method \"<init>\":()V\n```\n\n这种由三个字节码指令组成的模式——`new`、`dup`\
  \ 以及对名为 `<init>` 方法的 `invokespecial`——始终代表着新实例的创建。\n\n`new` 操作码为新实例分配内存，并将其引用放在栈顶。`dup`\
  \ 操作码复制栈顶的引用（因此现在有两个副本）。要完全完成创建的创建，我们需要调用构造函数的体。`<init>` 方法包含构造函数体的代码，因此我们使用 `invokespecial`\
  \ 调用该代码块。\n\n当方法被调用时，接收者对象的引用（如果有的话）以及方法的任何参数都会从栈中被消耗。这就是为什么我们需要先执行 `dup` 的原因——如果没有它，新分配对象的唯一引用将被\
  \ `invoke` 消耗，并在此之后将无法再访问。\n\n让我们来看 `main` 方法剩余的字节码：\n\n```\n 7: putstatic #10 //\
  \ Field inst:Lwgjd/ch04/ScratchImpl;\n 10: getstatic #10 // Field inst:Lwgjd/ch04/ScratchImpl;\n\
  \ 13: invokevirtual #22 // Method run:()V\n 16: return\n```\n\n指令 7 保存了已创建的单例实例的地址。指令\
  \ 10 将其放回栈顶，以便指令 13 可以其调用其上的方法。这是通过 `invokevirtual` 操作码实现的，它执行了 Java 对实例方法的“标准”分发。\n\
  \n注意：通常情况下，`javac` 产生的字节码是一个简单的表示——它并没有经过高度优化。整体策略是让即时编译（JIT）编译器完成大量的优化工作，因此如果它们有一个相对纯粹且简单的起点，将会有帮助。“字节码应该是愚笨的”这一表达式描述了\
  \ JVM 实现者对源语言生成的字节码的普遍感受。\n\n`invokevirtual` 操作码包含了对对象继承体系中方法是否被重写的检查。你可能会发现这有点奇怪，因为私有方法是无法被重写的。你可能会猜源码编译器实际上可以为私有方法发射\
  \ `invokespecial` 而不是 `invokevirtual`。事实上，以前是这样的，而且直到最近的 Java 版本才发生了更改。详情请参阅第 17\
  \ 章关于嵌套类成员（nestmates）的章节。\n\n让我们继续讨论字节码所需的运行时环境。之后，我们将介绍用于描述大类字节码指令家族的表格——加载/存储、算术、执行控制、方法调用和平台操作。然后，在进入另一个示例之前，我们还会讨论操作码可能的快捷形式。\n\
  \n### 4.4.2 运行时环境\n\n理解 JVM 使用的栈机的工作对于理解字节码至关重要。JVM 看起来不像硬件 CPU（如 x64 或 ARM 芯片）最明显的一点之一是，JVM\
  \ 没有处理器寄存器，而是使用栈进行所有的计算和操作。这被称为 `评估栈`（evaluation stack）（在 VM 规范中正式称为 `操作数栈`（operand\
  \ stack），我们将交替使用这两个术语）。\n\n评估栈是方法私有的，当一个方法被调用时，会创建一个新的评估栈。当然，JVM 还为每个 Java 线程拥有一个\
  \ `调用栈`（call stack），用于记录执行了哪些方法（这成了 Java 中堆栈轨迹的基础）。区分每个线程的调用栈和每个方法的评估栈是非常关重要的。\n\
  \n图 4.4 显示了如何使用评估栈对两个 int 常数执行加法操作。我们在每个步骤下方展示了等效的 JVM 字节码——我们将在章后面的部分遇到这些字节码，所以如果现在还不完全理解请不要担心。\n\
  \n![](img/CH04_F04_Evans2.png)\n\n图 4.4 使用栈进行数值计算\n\n正如在本章前面讨论过的，当类被链接到运行时，它的字节码将通过检查，其中许多验证归结为分析栈上的类型模式。\n\
  \n注意：只有当栈上的值具有正确类型时，对栈上值的操作才有效。例如，如果我们向栈推入一个对象引用，然后尝试将其视为 int 并对其进行算术运算，可能会发生未定义或错误的情况。\n\
  \n类加载的验证阶段执行广泛的检查，以确保新加载类中的方法不会尝试滥用栈。这防止了畸形（或蓄意恶意的）类被系统接受并导致问题。\n\n随着方法的运行，它需要一个内存区域作为评估栈，用于计算新值。此外，每个运行的线程都需要一个调用栈来记录正在执行的方法。这两种栈在某些情况下会相互作用。考虑这段代码：\n\
  \n```\nvar numPets = 3 + petRecords.getNumberOfPets(\"Ben\");\n```\n\n为了评估这个，JVM\
  \ 将 `3` 放在操作栈上。然后它需要调用一个方法来计算有多少宠物。为了这样做，它将接收者对象（在本例中为 `petRecords`）推入评估栈，随后是调用参数。\n\
  \n然后使用 `invoke` 操作码之一调用 `getNumberOfPets()`，这将导致控制转移到调用方法，并将进入的方法出现在调用栈中。但是，当 JVM\
  \ 进入新方法时，它会使用一个新的操作数栈，因此调用者操作栈上的值不可能影响被调用方法的结果。\n\n当 `getNumberOfPets()` 完成时，返回值将被放在调用者的操作栈上，这是\
  \ `getNumberOfPets()` 从调用栈中移除的过程的一部分。然后，加法操作获取两个值并将它们相加。\n\n\n\n\n- `Name`—这是操作码（opcode）类型的通用名称。在许多情况下，几个相关的操作码会执行相似的操作。\n\
  - `Args`—操作码接受的参数。以 `i` 开头的参数是（无符号）字节，用于在常量池或局部变量表中形成查找索引。\n  注意：为了生成更长的索引，多个字节会被组合在一起。因此，通过\
  \ `i1,` `i2` 意味着通过位移和加法“通过这两个字节创建一个 16 位的索引”：`((i1` `<<` `8)` `+` `i2)`。\n  如果参数显示在括号中，则意味着并非所有操作码的形式都会使用它。\n\
  - `Stack layout`—这显示了操作码执行前和后的栈状态。括号中的元素表示并非所有操作码的形式都会使用它们，或者这些元素是可选的（例如对于调用类操作码）。\n\
  - `Description`—操作码的功能。\n\n让我们通过检查 `getfield` 操作码的条目，查看表 4.3 中的某行示例。它用于从对象的字段中读取值。\n\
  \n| getfield | i1, i2 | [obj] -> [val] | 从栈顶的对象获取指定的常量池索引处的字段。 |\n\n第一列给出操作码的名称——`getfield`。下一列表示字节码流中有两个跟在操作码后面的参数。这些参数被组合在一起形成一个\
  \ 16 位的值，并在常量池中查找，以确定需要哪个字段（记住常量池索引始终是 16 位的）。栈布局列显示，对象的引用被字段的值所替换。\n\n这种作为操作一部分移除对象实例的模式只是为了让字节码更加紧凑，而避免了大量繁琐的清理，也不需要记住移除已处理的对象实例。\n\
  \n### 4.4.4 加载和存储操作码\n\n加载和存储操作码族涉及将值加载到栈上或从栈中检索它们。表 4.3 显示了加载/存储族中的主要操作。\n\n####\
  \ 表 4.3 加载和存储操作码\n\n| Name | Args | Stack layout | Description |\n| --- | --- |\
  \ --- | --- |\n| load | (i1) | [] -> [val] | 从局部变量将值（原始类型或引用）加载到栈上。有快捷形式和特定类型的变体。\
  \ |\n| ldc | i1 | [] -> [val] | 将池中的常量加载到栈上。有特定类型和宽（wide）变体。 |\n| store | (i1) |\
  \ [val] -> [] | 将值（原始类型或引用）存储在局部变量中，在此过程中从栈中移除。有快捷形式和特定类型的变体。 |\n| dup | | [val]\
  \ -> [val, val] | 复制栈顶的值。有变体形式。 |\n| getfield | i1, i2 | [obj] -> [val] | 从栈顶的对象获取指定的常量池索引处的字段。\
  \ |\n| putfield | i1, i2 | [obj, val] -> [] | 将值放入对象指定索引字段中。 |\n| getstatic | i1,\
  \ i2 | [] -> [val] | 获取指定索引静态字段的值。 |\n| putstatic | i1, i2 | [val] -> [] | 将值放入指定索引静态字段中。\
  \ |\n\n正如我们所注意的，存在许多不同形式的加载和存储指令。例如，`dload` 将双精度（double）加载到栈上，而 `astore` 将对象引用从栈上弹出并存局部变量。让我们快速看一个\
  \ `getfield` 和 `putfield` 的示例。\n\n```\npublic class Scratch {\n    private int i;\n\
  \n    public Scratch() {\n        i = 0;\n    }\n\n    public int getI() {\n   \
  \     return i;\n    }\n\n    public void setI(int i) {\n        this.i = i;\n \
  \   }\n}\n```\n\n会将 getter 和 setter 反反编译为：\n\n```\npublic int getI();\n    Code:\n\
  \       0: aload_0\n       1: getfield      #7                  // Field:i\n   \
  \    4: ireturn\n\npublic void setI(int i);\n    Code:\n       0: aload_0\n    \
  \   1: iload_1\n       2: putfield      #7                  // Field:i\n       5:\
  \ return\n```\n\n这显示了如何使用栈保存临时变量，然后将其转移到堆存储。\n\n### 4.4.5 算术操作码\n\n这些操作码在栈上执行算术运算。它们从栈顶获取参数并执行所需的计算。参数（始终是原始类型）必须匹配，但平台提供了丰富的操作码来将一种原始类型转换为另一种。表\
  \ 4.4 显示了基础操作。\n\n#### 表 4.4 算术操作码\n\n| Name | Args | Stack layout | Description\
  \ |\n| --- | --- | --- | --- |\n| add | | [val1, val2] -> [res] | 相加栈顶的两个值（必须是同种原始类型）并将结果存储在栈上。有快捷形式和特定类型的变体。\
  \ |\n| sub | | [val1, val2] -> [res] | 减去栈顶的两个值（相同原始类型）。有快捷形式和特定类型的变体。 |\n| div\
  \ | | [val1, val2] -> [res] | 除以栈顶的两个值（相同原始类型）。有快捷形式和特定类型的变体。 |\n| mul | | [val1,\
  \ val2] -> [res] | 乘以栈顶的两个值（相同原始类型）。有快捷形式和特定类型的变体。 |\n| (cast) | | [value] -> [res]\
  \ | 将值从一种原始类型转换为另一种。有与每个转换对应的形式。 |\n\n转换操作码的名称非常短，例如用于 `int` 到 `double` 转换的 `i2d`。特别是，`cast`\
  \ 这个词没有出现在名称中，这就是为什么它在表中。\n\n### 4.4.6 执行控制操作码\n\n如之前所述，高级语言的控制结构并不存在于 JVM 字节码中。相反，流控制由少数原语指令处理，如表\
  \ 4.5 所示。\n\n#### 表 4.5 执行控制操作码\n\n| Name | Args | Stack layout | Description |\n\
  | --- | --- | --- | --- |\n| if | b1, b2 | [val1, val2] -> [] or [val1] -> [] |\
  \ 如果满足特定条件，跳转到分支偏移量。 |\n| goto | b1, b2 | [] -> [] | 无条件跳转到偏移量。有宽（wide）变体。 |\n|\
  \ tableswitch | {depends} | [index] -> [] | 实现 switch。 |\n| lookupswitch | {depends}\
  \ | [key] -> [] | 实现 switch。 |\n\n与用于查找常量的索引类似，`b1, b2` 参数用于构造方法内部字节码位置。它们不能跳转到方法外部——这在类加载时检查并会导致类验证失败。\n\
  \n`if` 操作码族比你想象的要大——它有 15 多个指令来处理各种源码可能性（例如数值比较、引用相等性）。\n\n注意：`if` 操作码族还包含两个弃用的指令\
  \ `jsr` 和 `ret`，它们不再由 `javac` 生成且在现代 Java 版本中是非法的。\n\n`goto` 指令的宽形式（`goto_w`）接受\
  \ 4 字节参数并构造一个大于 64 KB 的偏移量。这通常不需要，因为它只适用于非常大的方法（此类方法还有其他问题，例如无法被 JIT 编译）。还有 `ldc_w`，它可以用于处理大型常量池。\n\
  \n### 4.4.7 调用操作码\n\n调用操作码包含了处理通用方法调用的四个操作码，加上 Java 7 中引入的异常的 `invokedynamic` 操作码。我们将在第\
  \ 17 章详细讨论这种特殊情况。五种方法调用操作码见表 4.6。\n\n#### 表 4.6 调用操作码\n\n| Name | Args | Stack layout\
  \ | Description |\n| --- | --- | --- | --- |\n| invokestatic | i1, i2 | [(val1,\
  \ ...)] -> [] | 调用静态方法。 |\n| invokevirtual | i1, i2 | [obj, (val1, ...)] -> [] |\
  \ 调用“普通”实例方法。 |\n\n\n\n\n\n| invokeinterface | i1, i2, count, 0 | [obj, (val1, ...)]\
  \ -> [] | 调用接口方法。 |\n| invokespecial | i1, i2 | [obj, (val1, ...)] -> [] | 调用“特殊”实例方法，例如构造函数。\
  \ |\n| invokedynamic | i1, i2, 0, 0 | [val1, ...] -> [] | 动态调用；参见第 17 章。 |\n\n通过这里显示的扩展示例可以很容易地看出这些操作码（opcodes）之间的区别：\n\
  \n```\nlong time = System.currentTimeMillis();\n\n// 这种显式类型声明是有刻意的……请继续阅读\nHashMap<String,\
  \ String> hm = new HashMap<>();\nhm.put(\"now\", \"bar\");\n\nMap<String, String>\
  \ m = hm;\nm.put(\"foo\", \"baz\");\n```\n\n让我们使用 `javap -c` 来查看这段代码的字节码：\n\n```\n\
  Code:\n       0: invokestatic  #2  // Method java/lang/System.currentTimeMillis:()J\n\
  \       3: lstore_1\n       4: new           #3 // class java/util/HashMap\n   \
  \    7: dup\n       8: invokespecial #4 // Method java/util/HashMap.\"<init>\":()V\n\
  \      11: astore_3\n      12: aload_3\n      13: ldc           #5 // String now\n\
  \      15: ldc           #6 // String bar\n      17: invokevirtual #7 // Method\
  \ java/util/HashMap.put:(\n                           //Ljava/lang/Object;Ljava/lang/Object;)\n\
  \                           //Ljava/lang/Object;\n      20: pop\n      21: aload_3\n\
  \      22: astore        4\n      24: aload         4\n      26: ldc           #8\
  \ // String foo\n      28: ldc           #9 // String baz\n      30: invokeinterface\
  \ #10,  3 // InterfaceMethod java/util/Map.put:(\n                             \
  \     //Ljava/lang/Object;Ljava/lang/Object;)\n                                \
  \  //Ljava/lang/Object;\n      35: pop\n```\n\n正如我们之前讨论过的，Java 方法调用实际上被转换为几种可能的\
  \ `invoke*` 字节码之一。让我们仔细观察一下：\n\n```\n 0: invokestatic  #2 // Method java/lang/System.currentTimeMillis:()J\n\
  \       3: lstore_1\n```\n\n对 `System.currentTimeMillis()` 的静态调用被转换为 `invokestatic`，它出现在字节码的第\
  \ 0 个位置。该方法没有参数，因此在分发调用之前，不需要将任何内容加载到操作栈上。\n\n接下来，字节流中出现了两个字节 `00 02`。它们被组合成一个 16\
  \ 位数字，用作常量池的偏移量。\n\n反编译器贴心地包含了一条注释，让用户知道偏移量 `#2` 对应于哪个方法。在这种情况下，正如预期的，它就是 `System.currentTimeMillis()`\
  \ 方法。\n\n返回时，调用的结果被放在栈上，在偏移量 3 处，我们看到了单个的无参数的操作码 `lstore_1`，它将此返回值保存到局部变量 1 中。\n\
  \n人类读者显然能够看到变量 `time` 不再被使用。然而，`javac` 的设计目标之一是尽可能真实地表示 Java 源代码的内容，无论其是否有意义。因此，`System.currentTimeMillis()`\
  \ 的返回值被存储了，尽管它在程序的此点之后没有被使用。\n\n这就是“愚笨字节码”的体现：请记住，从平台的角度来看，类文件格式才是真正的编译器（即 JIT 编译器）的输入格式：\n\
  \n```\n 4: new           #3 // class java/util/HashMap\n       7: dup\n       8:\
  \ invokespecial #4 // Method java/util/HashMap.\"<init>\":()V\n      11: astore_3\n\
  \      12: aload_3\n      13: ldc           #5 // String now\n      15: ldc    \
  \       #6 // String bar\n      17: invokevirtual #7 // Method java/util/HashMap.put:(\n\
  \                          //Ljava/lang/Object;Ljava/lang/Object;)\n           \
  \               //Ljava/lang/Object;\n      20: pop\n```\n\n字节码 4 到 10 创建了一个新的 `HashMap`\
  \ 实例，在指令 11 将其副本保存到局部变量之前。接下来，指令 12 到 16 在栈上准备好 `HashMap` 对象和调用 `put()` 方法的参数。`put()`\
  \ 方法的实际调用由指令 17 到 19 执行。\n\n这次使用的 invoke 操作码是 `invokevirtual`，因为局部变量的静态类型被声明为 `HashMap`——这是一个类类型。我们稍后将看到如果局部变量声明为\
  \ `Map` 会发生什么。\n\n实例方法调用与静态方法调用的区别在于，静态调用没有可以调用方法的实例（有时称为接收者对象）。\n\n注意：在字节码中，实例调用必须通过将接收者和任何调用参数放在操作栈上，然后发布\
  \ invoke 指令来实现。\n\n在这种情况下，`put()` 的返回值没有被使用，因此指令 20 丢弃了它：\n\n```\n21: aload_3\n\
  22: astore        4\n24: aload         4\n26: ldc           #8 // String foo\n28:\
  \ ldc           #9 // String baz\n30: invokeinterface #10,  3 // InterfaceMethod\
  \ java/util/Map.put:(\n                              //Ljava/lang/Object;Ljava/lang/Object;)\n\
  \                              //Ljava/lang/Object;\n35: pop\n```\n\n\n\n\n\n平台操作码（opcodes）用于控制对象生命周期的某些方面，例如创建新对象和对其锁定。需要注意的是，新的操作码仅分配存储。对象构造的高层概念还包括运行构造函数内部的代码。\n\
  \n在字节码级别，构造函数被转换为一个具有特殊名称——`<init>` 的方法。它不能从用户 Java 代码中调用，但可以通过字节码调用。这导致了独特的字节码模式，直接对应于对象创建——正如我们之前看到的，先是\
  \ `new`，接着是 `dup`，然后通过 `invokespecial` 来调用 `<init>` 方法。\n\n`monitorenter` 和 `monitorexit`\
  \ 字节码对应同步块（synchronized block）的开始和结束。\n\n### 4.4.9 快捷操作码形式\n\n许多操作码都有快捷形式，以节省各处的几个字节。通用模式是：某些局部变量的访问频率远高于其他变量，因此，拥有一个特殊的操作码来表示“直接在局部变量上执行通用操作”，比将局部变量作为参数指定要有意义。这在加载/存储族中产生了诸如\
  \ `aload_0` 和 `dstore_2` 等操作码，它们比等效的字节序列 `aload 00` 或 `dstore` `02` 短 1 个字节。\n\n\
  注意，节省一个字节听起来可能不多，但在整个类中累积起来是巨大的。Java 的原始用例是 applet，它们通常通过拨号调制调器下载，速度为每秒 28.8 千比特。在当时的带宽速度下，尽可能节省字节是非常重要的。\n\
  \n为了成为一个真正基础扎实的 Java 开发者，你应该对你自己的一些类运行 `javap` 并学会识别常见的字节码模式。现在，在我们掌握了这些字节码的简要介绍之后，让我们转向下一个主题——反射。\n\
  \n## 4.5 反射\n\n基础扎实的 Java 开发者应该掌握的关键技术之一是 `reflection`（反射）。这是一项极其强大的能力，但许多开发者起初对其感到很困难，因为它看起来对于大多数\
  \ Java 开发者思考代码的方式来说很陌生。\n\n反射是在运行时对对象进行查询或自省并发现（以及使用）它们的能力。根据上下文，它可以被视为几种不同的东西：\n\
  \n* 一种编程语言 API\n* 一种编程风格或技术\n* 实现该技术的运行时机制\n* 语言类型系统的一个属性\n\n面向对象系统中的反射本质上是：编程环境可以将程序的类型和方法表示为对象。这在具有支持此点的运行时的语言中才是可能的，而且它是语言的一个从根本上动态方面。\n\
  \n当使用反射编程风格时，可以在完全不使用对象静态类型的情况下操作对象。这看起来似乎是退了一步，但如果我们可以在不需要知道其静态类型的情况下与对象工作，那么意味着我们可以构建可以处理任何类型的库、框架和工具——包括那些在我们的代码编写时甚至不存在的类型。\n\
  \n当 Java 还是一个年轻语言时，反射是它带给主流的关键技术创新之一。尽管其他语言（特别是 Smalltalk）要早得多地引入了它，但在 Java 发布时的那个时代，它并不是许多语言的共同部分。\n\
  \n### 4.5.1 引入反射\n\n反射的抽象描述往往看起来很令人困惑或难以理解。让我们看看 JShell 中的一些简单示例，尝试对反射到底是什么获得一个更直观的视图：\n\
  \n```\njshell> Object o = new Object();\no ==> java.lang.Object@a67c67e\n\njshell>\
  \ Class<?> clz = o.getClass();\nclz ==> class java.lang.Object\n```\n\n这是我们对反射的第一瞥——一个用于\
  \ `Object` 类型的类对象。事实上，`clz` 的实际类型是 `Class<Object>`，但当我们从类加载或 `getClass()` 获取类对象时，我们必须使用泛型中的未知类型\
  \ `?` 来处理它，如下：\n\n```\njshell> Class<Object> clz = Object.class;\nclz ==> class\
  \ java.lang.Object\n\njshell> Class<Object> clz = o.getClass();\n|  Error:\n|  incompatible\
  \ types: java.lang.Class<capture#1 of ? extends\n  java.lang.Object> cannot be converted\
  \ to java.lang.Class<java.lang.Object>\n|  Class<Object> clz = o.getClass();\n|\
  \                      ^----------^\n```\n\n这是因为反射是一种动态的运行时机制，而真实的类型 `Class<Object>`\
  \ 对源代码编译器是不可知的。这一过程引入了不可减少的额外复杂性，因为我们无法依赖 Java 类型系统来提供很大帮助。另一方面，这种动态性是反射的核心点——如果我们无法编译时知道某个东西类型并且必须以非常通的方式处理它，我们可以利用这种灵活性来构建一个开放、可扩展的系统。\n\
  \n注意，反射产生了一个根本上开放的系统，正如我们在第 2 章中看到的，这可能与 Java 模块试图引入平台的更封装的系统产生冲突。\n\n许多熟悉的框架和开发者工具（如调试器和代码浏览器）严重依赖反射来实现其功能。插件架构、交互式环境和\
  \ REPL 也广泛使用反射。事实上，JShell 本身无法在没有反射子系统的语言中构建。让我们利用这一点并使用 JShell 探索反射的一些关键特征，如下：\n\
  \n```\njshell> class Pet {\n   ...>   public void feed() {\n   ...>     System.out.println(\"\
  Feed the pet\");\n   ...>   }\n   ...> }\n|  created class Pet\n\njshell> var clz\
  \ = Pet.class;\nclz ==> class Pet\n```\n\n现在我们有了一个代表 `Pet` 类类型的对象，可以用它执行其他操作，例如创建一个新实例，如下：\n\
  \n```\njshell> Object o = clz.newInstance();\no ==> Pet@66480dd7\n```\n\n我们面临的问题是\
  \ `newInstance()` 返回 `Object`，这并不是一个非常有用的类型。当然，我们可以将 `o` 强制转换 `Pet`，但这需要我们提前知道正在处理的类型，这在很大程度上抵消了反射动态特性的意义。所以让我们尝试其他的：\n\
  \n```\njshell> import java.lang.reflect.Method;\n\njshell> Method m = clz.getMethod(\"\
  feed\", new Class[0]);\nm ==> public void Pet.feed()\n```\n\n现在我们有了一个代表方法 `feed()`\
  \ 的对象，但它是作为抽象元数据表示的——它没有附加到任何实例。\n\n对代表方法的对象的自然做法是调用它。`java.lang.reflect.Method`\
  \ 类定义了一个 `invoke()` 方法，其效果是调用 `Method` 对象代表的方法。\n\n注意在 JShell 中工作时，我们避免了大量的异常处理代码。在编写使用反射的普通\
  \ Java 代码时，必须以某种方式处理可能的异常类型。\n\n为了让这次调用成功，我们必须提供正确数量和类型的参数。参数列表必须包含反射调用该方法的接收对象（假设该方法是实例方法）。在我们的简单示例中，它看起来是这样：\n\
  \n```\njshell> Object ret = m.invoke(o);\nFeed the pet\nret ==> null\n```\n\n调用返回\
  \ null 是因为 `feed()` 方法实际上是 `void`。\n\n除了 `Method` 对象外，反射还提供了代表 Java 类型系统和语言中其他基本概念的对象，例如字段、注解和构造函数。这些类可以在\
  \ `java.lang.reflect` 包中找到，其中一些（如 `Constructor`）是泛型类型。\n\n\n\n\n反射子系统也必须升级以处理模块。正如类和方法可以被反射处理一样，也需要一个反射式\
  \ API 来处理模块。关键类可能出乎意料是 `java.lang.Module`，我们可以如下从 `Class` 对象直接访问它：\n\n```java\n\
  var module = String.class.getModule();\nvar descriptor = module.getDescriptor();\n\
  ```\n\n模块的描述符类型为 `ModuleDescriptor`，它提供了关于模块元数据的只读视图——基本上等同于 `module-info.class`\
  \ 的内容。\n\n新的反射式 API 还支持动态能力，例如模块的发现。这是通过 `ModuleFinder` 等接口实现的的，但关于如何通过反射方式操作模块系统的详细描述超出了本书的范畴——感兴趣的读者应该参阅\
  \ Nicolai Parlog 的著作 *The Java Module System*（Manning, 2019），[`mng.bz/gwGG`](http://mng.bz/gwGG)。\n\
  \n### 4.5.2 结合类加载与反射\n\n让我们来看一个结合了类加载和反射的示例。我们不需要一个遵循通常 `findClass()` 和 `loadClass()`\
  \ 协议的全类加载器。相反，我们只需要对 `ClassLoader` 进行子类以访问受保护的 `defineClass()` 方法。\n\n主方法接收一个文件名列表，如果它们是\
  \ Java 类，它将使用反射逐个访问每个方法并检测其是否为原生方法（native method），如下：\n\n```java\npublic class NativeMethodChecker\
  \ {\n\n    public static class EasyLoader extends ClassLoader {\n        public\
  \ EasyLoader() {\n            super(EasyLoader.class.getClassLoader());\n      \
  \  }\n\n        public Class<?> loadFromDisk(String fName) throws IOException {\n\
  \            var b = Files.readAllBytes(Path.of(fName));\n            return defineClass(null,\
  \ b, 0, b.length);\n        }\n    }\n\n    public static void main(String[] args)\
  \ {\n        if (args.length > 0) {\n            var loader = new EasyLoader();\n\
  \            for (var file : args) {\n                System.out.println(file +\"\
  \ ::\");\n                try {\n                    var clazz = loader.loadFromDisk(file);\n\
  \                    for (var m : clazz.getMethods()) {\n                      \
  \  if (Modifier.isNative(m.getModifiers())) {\n                            System.out.println(m.getName());\n\
  \                        }\n                    }\n                } catch (IOException\
  \ | ClassFormatError x) {\n                    System.out.println(\"Not a class\
  \ file\");\n                }\n            }\n        }\n    }\n}\n```\n\n这类示例对于探索\
  \ Java 平台的动态特性以及学习反射 API 的工作原理会很有趣。然而，对于一个基础扎实的 Java 开发者来说，意识到在进行反射操作时可能出现的局限性和偶尔的挫败感是非常重要的。\n\
  \n### 4.5.3 反射的问题\n\n反射 API 自 1.1 版本（1996 年）以来一直是 Java 平台的一部分，在面世 25 年里，暴露了一些问题和缺点。其中一些不便之处如下：\n\
  \n*   这是一个非常老老的 API，到处都是数组类型（它早于 Java 集合框架）。\n*   确定要调用哪个方法重载是非常痛苦的。\n*   API 提供了两个不同的方法\
  \ `getMethod()` 和 `getDeclaredMethod()` 来通过反射访问方法。\n*   API 提供了 `setAccessible()`\
  \ 方法，可以用它来忽略访问控制。\n*   反射调用的异常处理非常复杂——受检异常被提升为运行时异常。\n*   为了进行传递或返回基本类型的反射调用，装箱和拆箱是必不可的。\n\
  *   基本类型需要占位符类对象，例如 `int.class`，其实际类型是 `Class<Integer>`。\n*   `void` 方法需要引入 `java.lang.Void`\
  \ 类型。\n\n除了 API 中各种别扭的角落外，Java 反射由于几个原因一直存在性能低下的问题，包括对 JVM 的 JIT 编译器不友好。\n\n注意：解决反射调用性能问题是增加\
  \ Method Handles API 的主要原因之一，我们将在第 17 章中遇到它。\n\n反射还有一个最后的问题，这可能更像是一个哲学问题（或反模式）：开发者在\
  \ Java 进阶之路上，经常会遇到反射作为他们接触的第一个真正的高级技术之一。结果是，它可能会被过度使用，或者变成一种*金刚锤*（Golden Hammer）技术——被用于实现过度灵活的系统，或显示出并不真正需要的内部微框架的系统（有时被称为\
  \ *Inner Framework* 反模式）。这类系统通常具有很高的可配置性，但代价是将领域模型编码到配置中，而不是直接编码在领域类型中。\n\n反射是一项很棒的技术，也是基础扎实的\
  \ Java 开发者工具箱中应该有的，但它并不适用于每一种，大多数开发者只需要少量使用。\n\n## 总结\n\n*   类文件格式和类加载是 JVM 操作的核心。对于任何想要运行在\
  \ VM 上的语言来说都是至关重要的。\n*   类加载的各个阶段在运行时实现了安全性和性能特性。\n*   JVM 字节码组织成具有相关功能的族。\n*  \
  \ 使用 `javap` 反编译类文件可以帮助你理解底层原理。\n*   反射是一个大功能且极其强大。\n\n# 5 Java 并发基础\n\n本章涵盖了：\n\
  \n*   并发理论\n*   块结构并发\n*   同步\n*   Java 内存模型 (JMM)\n*   字节码中的并发支持\n\nJava 有两个主要的并发\
  \ API：旧的 API，通常被称为*块结构并发*或*基于同步的并发*甚至“经典并发”，以及新的 API，通常以其 Java 包名 `java.util.concurrent`\
  \ 称为呼。\n\n在书中，我们将讨论这两种方法。在本章中，我们将从这两种方法中的第一个开始之旅。在下一章中，我们将介绍 `java.util.concurrent`。在后期，我们将在第\
  \ 16 章“高级并发编程”返回并发主题，讨论高级技术、非 Java 语言的并发以及并发与函数式编程之间的相互作用。\n\n\n\n\n一个重要的章节（也是本章最长的部分）是块结构化并发的细节，以及对底层线程\
  \ API 的探索。我们将通过讨论 Java 内存模型 (`JMM`) 来结束本章，然后利用我们在第 4 章中学的字节码技术来理解 Java 并发编程中一些常见复杂性的真实来源。\n\
  \n## 5.1 并发理论入门\n\n在接触基础理论之前，让我们先从一个警示故事开始这段并发之旅。\n\n### 5.1.1 但我已经了解过 Thread 了\n\
  \n这是开发者可能犯的最常见（且可能是致命的）错误之一：假设只要熟悉 `Thread`、`Runnable` 以及 Java 并发机制的语言级基本原语，就足以成为胜任的并发代码开发者了。事实上，并发是一个巨大的课题，良好的多线程开发是非常困难的，即使对于拥有多年经验的顶尖开发者来说，它持续持续带来问题。\n\
  \n事实上的，并发领域目前正经历着大量的活跃研究——这种现象在过去的 5 到 10 年一直在持续，并且没有任何减缓的迹象。这些创新可能会对 Java 以及你在职业生涯中使用的其他语言产生影响。\n\
  \n在本书的第一版中，我们曾给出这样一个断言：“如果我们选出一个计算基础领域，在未来五年内行业实践方面可能发生根本性变化，那将并发。”历史不仅证明了这一断言，而且我们有信心将这一预测延续下去——未来五年将继续强调目前已成为编程格局一部分的不同并发方法。\n\
  \n因此，本章的目的并不是试图成为并发编程每个方面的权威指南，而是让你意识到底层的平台机制，这些机制解释了为什么 Java 的并发机制是这样工作的。我们还将涵盖足够的通用并发理论，以提供你理解相关问题的词汇，并教你实现正确并发的必要性和困难性。首先，我们将讨论每个资深\
  \ Java 开发者应该了解的硬件知识，以及并发最重要的理论限制之一。\n\n### 5.1.2 硬件\n\n让我们从关于并发和多线程的一些事实开始：\n\n\
  * 并发编程本质上是关于性能的。\n* 如果运行的系统性能足以让串行算法工作，那么基本上没有理由去实现并发算法。\n* 现代计算机系统拥有多个处理器核心——即使是手机今天也有二或四个核心。\n\
  * 所有的 Java 程序都是多线程的，即使是那些只有一个应用程序线程的程序也是如此。\n\n最后一点是正确的，因为 `JVM` 本身是一个多线程二进制文件，可以使用多个核心（例如，用于\
  \ `JIT compilation` 或 `garbage collection`）。此外，标准库还包含了使用 `runtime-managed concurrency`\
  \ 为某些执行任务实现多线程算法的 API。\n\n注意 Java 应用可能仅仅通过升级运行的 `JVM` 运行得更快，这是由于运行时性能的改进。\n\n关于硬件的更充分讨论将在第\
  \ 7 章进行，但这些基本事实如此基础且与并发编程密切相关，以至于我们想要立即介绍。\n\n现在，让我们认识 `Amdahl’s law`，它以早期 IBM 计算机科学家\
  \ Gene Amdahl（吉·阿达尔，有时被称为“大型机之父”）的名字命名。\n\n### 5.1.3 阿姆达尔定律\n\n这是一个用于推理在多个执行单元上共享工作效率的简单、快速的模型。在模型中，执行单元是抽象的，你可以将它们视为线程，但它们也可以是进程，或任何能够执行工作的实体。\n\
  \n注意 阿姆达尔定律的任何设置或结果都不依赖于工作执行的细节、执行单元的精确性质，或计算系统的实现方式。\n\n基本前提是，我们有一个单一任务，它可以被细分为更小的单元进行处理。这允许我们使用多个执行单元来缩短完成工作所需的时间。\n\
  \n因此，如果我们有 `N` 个处理器（或执行工作的线程），那么我们可能天真地预期通过时间为 `T1 / N`（如果 `T1` 是作业在单个处理器上所需的时间）。在这个模型中，我们可以通过只需增加执行单元并因此增加\
  \ `N` 来尽可能快地完成任务。\n\n然而，拆分工作不是免费的！在任务的细分和重新组合中涉及到一个（希望是很小的）开销。让我们假设这个 `communication\
  \ overhead`（有时被称为计算的 `serial part`）是一个占百分比的开销，我们可以用数字 `s` (0 < `s` < 1) 来表示它。因此，`s`\
  \ 的典型值可能是 `0.05`（或 5%，取决于你倾向于哪种表达方式）。这意味着任务完成始终至少需要 `s * T1` 时间——无论我们投入多少个处理单元。\n\
  \n当然，这假设 `s` 不依赖于 `N`，但在实践中，随着 `N` 的增加，`s` 所代表的工作拆分可能会变得更加复杂并需要更多时间。要想象一个 `s` 随着\
  \ `N` 增加而减小的系统架构是非常困难的。因此，“`s` 是常数”的简单假设通常被理解为理想情况。\n\n所以，思考阿姆达尔定律最简单的方法是：如果 `s`\
  \ 在于 0 和 1 之间，那么可以实现的最大加速是 `1 / s`。这个结果有点令人沮丧——这意味着如果通信开销仅为 2%，所能达到的最大加速（即使有数千个处理器以全速运行）也只有\
  \ 50 倍。\n\n阿姆达尔定律有一个稍微复杂的公式，表示如下：\n\n```\nT(N) = s + (1/N) * (T1 - s)\n```\n\n这在图\
  \ 5.1 中可以直观地看到这一点。注意 x 轴是对数刻度——在比例表示中，向 `1 / s` 的收敛将很难看到。\n\n![](img/CH05_F01_Evans2.png)\n\
  \n图 5.1 阿姆达尔定律\n\n在用硬件和第一个非常简单的并发模型铺垫背景后，让我们深入探讨 Java 处理线程的细节。\n\n### 5.1.4 解释 Java\
  \ 的线程模型\n\nJava 的线程模型基于以下两个基本概念：\n\n* 默认可见的共享可变状态\n* 操作系统的抢占式线程调度\n\n让我们考虑这些想法的以下最重要的方面：\n\
  \n* 对象可以很容易地在进程内的所有线程之间共享。\n* 对象可以被任何拥有其引用的线程“更改（变异）”。\n* 线程调度器（操作系统）可以在任何时间、或或或少地在核心之间切换线程。\n\
  * 方法必须能够在其运行期间被切换出（否则，带有无限循环的方法将永远夺占 CPU）。\n* 然而，这存在着不可预测的线程切换风险，导致方法处于“半完成”状态且对象处于不一致状态。\n\
  * 对象可以被锁定以保护脆弱的数据。\n\n最后一点绝对至关重要——如果没有它，存在在一个线程中做的更改可能在其他线程中无法正确看到的巨大风险。在 Java 中，锁定对象的能力由核心语言中的\
  \ `synchronized` 关键字提供。\n\n注意 从技术上说，Java 为其每个对象提供了监视器（monitors），监视器将锁（即互斥）与等待特定条件变为真的的能力结合在一起。\n\
  \n\n\n\nJava 基于线程和锁的并发机制非常底层，且通常难以处理。为了应对这个问题，Java 5 引入了一组并发库，并命名为 `java.util.concurrent`（以这些新类所在的\
  \ Java 包名命名）。这为编写并发代码提供了一系列工具，许多程序员认为这些工具比经典的块结构化并发原语更容易使用。我们将在下一章讨论 `java.util.concurrent`，现在将重点关注语言层面的\
  \ API。\n\n### 5.1.5 经验总结\n\nJava 是第一个内置多线程编程支持的主流编程语言。这在当时代表了巨大的进步，但 15 年后的今天，我们对如何编写并发代码有了更深入的理解。\n\
  \n事实证明，Java 初始的一些设计决策对于大多数程序员来说相当难以处理。这很遗憾，因为硬件日益增长的趋势是向多核心处理器发展，而利用这些核心的唯一良好方法就是使用并发代码。我们将在本章中讨论并发代码的一些困难。关于现代处理器天生需要并发编程的主题，将在第\
  \ 7 章讨论性能时进行详细介绍。\n\n随着开发者在编写并发代码方面的经验越来越丰富，他们发现自己不断遇到对系统至关重要的问题。我们将这些问题称为 `设计力`（design\
  \ forces）。它们是存在于实际并发对象设计中（且经常冲突）的高级概念。我们将在接下来的几个章节中花一点时间研究这些最重要的一些力。\n\n## 5.2 设计概念\n\
  \n接下来列出的最重要的设计力是由 Doug Lea 在完成 `java.util.concurrent` 的里程碑式工作时分类的：\n\n*   安全性（Safety，也称为\
  \ `并发类型安全`）\n*   活跃性（Liveness）\n*   性能（Performance）\n*   可重用性（Reusability）\n\n现在让我们来看每一个设计力。\n\
  \n### 5.2.1 安全性与并发类型安全\n\n安全性关于确保对象实例保持自洽性，无论同时可能在发生任何其他操作。如果一个对象系统具有这一属性，则被称为 `safe`\
  \ 或 `concurrently typesafe`。\n\n正如你可能从名称中猜到的那样，思考并发的一种方式是将其视为对象建模和类型安全常规概念的扩展。在非并发代码中，你希望确保无论调用了对象的什么公共方法，它在方法结束时都处于一个定义良好且一致的状态。通常实现此点的方法是保持对象的所有状态为私有，并暴露一组公共方法\
  \ API，这些方法仅以符合设计领域逻辑的方式改变对象的状态。\n\n并发类型安全与对象的类型安全具有相同的基本概念，但它应用于一个复杂得多的世界——在这个世界里，其他线程可能在不同的\
  \ CPU 核心上同时操作相同的对象。例如，考虑这个简单的类：\n\n```java\npublic class StringStack {\n    private\
  \ String[] values = new String[16];\n    private int current = 0;\n\n    public\
  \ boolean push(String s) {\n        // 异常处理省略\n        if (current < values.length)\
  \ {\n            values[current] = s;\n            current = current + 1;\n    \
  \        return true;\n        }\n        return false;\n    }\n\n    public String\
  \ pop() {\n        if (current < 1) {\n            return null;\n        }\n   \
  \     current = current - 1;\n        return values[current];\n    }\n}\n```\n\n\
  当被单线程客户端代码使用时，这是没问题的。然而，抢占式线程调度会导致问题。例如，在代码的这一点可能会发生执行线程之间的上下文切换：\n\n```java\npublic\
  \ boolean push(String s) {\n        if (current < values.length) {\n           \
  \ values[current] = s;\n            // .... 此处发生切换     ❶\n            current =\
  \ current + 1;\n            return true;\n        }\n        return false;\n   \
  \ }\n```\n\n❶ 对象被留在了一个不一致且错误的状态中。\n\n如果此时从另一个线程查看该对象，状态的一个部分（`values`）已经更新，但另一部分（`current`）则没有。探索并解决这个问题是本章的主题。\n\
  \n通常情况下，安全性的某种策略是：永远不要在不一致的状态从非私有方法返回，并且在不一致的状态下永远不要调用任何非私有方法（更不用调用任何其他对象的方法）。如果将这种做法与在不一致时保护对象的方法（如同步锁或临界区）相结合，就可以保证系统是安全的。\n\
  \n### 5.2.2 活跃性\n\n活跃的系统是指每一个尝试的活动最终都能进展或失败的系统。不活跃的系统基本上是卡住了——它既不会向成功进展，也不会失败。\n\
  \n定义中的关键词是 `eventually`（最终）——暂性的进展失败（孤立来看这并不糟糕，尽管不理想）与永久性失败是有区别的。暂性失败可能由许多底层问题引起，例如：\n\
  \n*   锁定或等待获取锁\n*   等待输入（例如网络 I/O）\n*   资源的临时故障\n*   没有足够的 CPU 时间运行该线程\n\n永久性失败可能由于多种原因引起。最常见的包括：\n\
  \n*   死锁\n*   不可恢复的资源问题（例如网络文件系统 [NFS] 丢失）\n*   错过的信号\n\n我们将在本章的晚些部分讨论锁以及这些其他几个问题，尽管你可能已经熟悉其中一些或全部。\n\
  \n### 5.2.3 性能\n\n系统的性能可以通过多种不同的方式进行量化。在第 7 章中，我们将讨论性能分析和调优技术，并介绍其他你应该了解的指标。现在，请将性能考虑为系统在给定资源范围内能完成多少工作的衡量。\n\
  \n### 5.2.4 可重用性\n\n可重用性构成了第四种设计力，因为它并没有真正被任何其他考虑因素涵盖。一个设计为易于重用的并发系统有时是非常理想的，尽管这并不总是易于实现的。一种方法是使用可重用的工具箱（如\
  \ `java.util.concurrent`）并在此之上构建不可重用的应用程序代码。\n\n### 5.2.5 这些力是如何以及为何冲突的？\n\n设计力之间通常是对立的，这种紧张关系可以被视为设计良好的并发系统之所以困难的核心原因，如下点所示：\n\
  \n*   安全性与活跃性是对立的——安全性是为了确保坏事不发生，而活跃性则要求进展的实现。\n*   可重用系统倾向于暴露其内部实现，这会给安全性带来问题。\n\
  *   一个朴素编写的安全系统通常性能不会很好，因为它们通常诉诸大量使用锁来提供安全保障。\n\n你最终应该尝试实现的平衡是：让代码既足够灵活以解决广泛的问题，又足够封闭以保证安全，同时仍保持合理的活跃性和性能。这虽然是一个艰巨的任务，但幸运的是，一些实用的技术可以对此有所帮助。以下是一些常见的技巧，按用用程度粗略排序：\n\
  \n1.  尽可能地限制每个子系统的外部通信。数据隐藏是辅助安全性的强大工具。\n2.  尽可能使子系统的内部结构具有确定性。例如，在设计时静态了解每个子系统中的线程和对象，即使这些子系统将以并发、非确定的方式进行交互。\n\
  \n\n\n\n\n3. 应用客户端应用程序必须遵守的策略方法。这种技术非常强大，但依赖于用户程序的配合，如果一个行为不规范的程序不遵守规则，可能很难调试。\n\
  \n4. 记录所需的行为。这是所有替代方案中最弱的一种，但如果代码要在非常通用的语境下部署，这有时是必要的。\n\n开发者应该意识到这些每一个可能的安全机制，并尽可能使用最强大的技术，同时也要意识到在某些情况下，只能使用较弱的机制。\n\
  \n### 5.2.6 开销的来源\n\n并发系统的许多方面都会导致固有的开销：\n\n* 监视器（即锁和条件变量）\n* 上文切换的次数\n* 线程数量\n\
  * 调度\n* 内存局部性\n* 算法设计\n\n这应该是你脑海中检查清单的基础。在开发并发代码时，你应该确保自己已经考虑了此列表上的所有内容。\n\n特别是其中的最后一项——算法设计，这是一个开发者可以真正让自己脱颖而出的领域，因为学习算法设计将让你在任何语言中都成为更出色的程序员。\n\
  \n两本标准教材（作者强烈推荐）是 Cormen 等人编写的 *Introduction to Algorithms*（MIT, 2009）——不要被标题误导；这是一部严肃的作品——以及\
  \ Skiena 编写的 *The Algorithm Design Manual*（第 3 版，Springer-Verlag, 2020）。对于单线程和并发算法，这些书都是进一步阅读的极佳选择。\n\
  \n我们在本章及后续章节（特别是关于性能的第 7 章）中会提到许多开销来源，但现在让我们转向下一个主题：回顾 Java 的“经典”并发，并仔细观察为什么用它进行编程可能会很困难。\n\
  \n## 5.3 块结构并发（Java 5 之前）\n\n我们对 Java 并发的大部分内容都是关于讨论语言级（又说是基于块同步的、又说是内置的）并发的替代方案。但为了从替代方案的讨论中获得最大的收益，牢牢掌握经典并发的优缺点至关重要。\n\
  \n为此，在本章的剩余部分中，我们将讨论使用 Java 的并发关键字——`synchronized`、`volatile` 等来处理多线程编程的原始且相当低层的方法。这种讨论将在设计驱动力的背景下进行，并兼顾之后的内容。\n\
  \n紧接着，我们将简要考虑线程的生命周期，然后讨论并发代码的常见技巧（以及陷阱），例如完全同步对象、死锁、`volatile` 关键字和不可变性。让我们从同步的概述开始。\n\
  \n### 5.3.1 同步与锁\n\n正如你可能已经知道的，`synchronized` 关键字可以应用于代码块，也可以应用于方法。它表示在进入块或方法之前，线程必须获取相应的锁。例如，让我们考虑一个从银行账户取款的方法，如下所示：\n\
  \n```\npublic synchronized boolean withdraw(int amount) { ❶\n    // 检查金额是否大于 0，否则则抛出异常\n\
  \    if (balance >= amount) {\n        balance = balance - amount;\n        return\
  \ true;\n    }\n\n    return false;\n}\n```\n\n❶ 只有一个线程可以同时尝试从此账户取款。\n\n该方法必须获取属于对象实例的锁（对于\
  \ `static synchronized` 方法，则属于 `Class` 对象的锁）。对于代码块，程序员应该指定要获取哪个对象的锁。\n\n同一时间只有一个线程可以在该对象的任何同步块或方法中执行；如果其他线程尝试进入，它们会被\
  \ JVM 挂起。无论其他线程尝试进入同一对象上的相同还是不同的同步块，情况都是如此。在并发理论中，这种结构有时被称为关键区域（critical section），但这个术语在\
  \ C++ 中比在 Java 中常用。\n\n注意：你是否想过为什么 Java 用于关键区域的关键字是 `synchronized`？为什么不是“critical”或“locked”？被同步的到底是什么？我们将在\
  \ 5.3.5 节中回到这个问题，但如果你不知道或从未考虑过它，你可能想在继续之前花几分钟思考一下。\n\n让我们来看关于 Java 中同步和锁的一些基本事实。希望你已经掌握了其中大部分（或全部）内容：\n\
  \n* 只有对象——而不是原始数据类型——可以被锁定。\n* 锁定对象数组并不会锁定单个对象。\n* 同步方法可以被等同于覆盖整个方法的 `synchronized\
  \ (this) { ... }` 块（但注意，它们在字节码中的表示方式不同）。\n* `static synchronized` 方法锁定 `Class` 对象，因为没有实例对象可以锁定。\n\
  * 如果你需要锁定一个 `Class` 对象，请仔细考虑你是需要显式地这样做，还是通过使用 `getClass()`，因为这两种方法在子类中的行为将不同。\n\
  * 内部类中的同步与外部类是独立的（要明白为什么这样，请记住内部类是如何实现的）。\n* `synchronized` 不属于方法签名的一部分，因此它不能出现在接口的方法声明中。\n\
  * 未同步的方法不查看也不在乎任何锁的状态，并且它们可以在同步方法运行时继续执行。\n* Java 的锁是可重入的——持有锁的线程如果遇到针对同一把锁的同步点（例如一个\
  \ `synchronized` 方法调用同一对象上的另一个 `synchronized` 方法），将允许其继续执行。\n\n注意：其他语言中确实存在非重入锁方案（在\
  \ Java 中也可以实现——如果你想了解底层细节，请查看 `java.util.concurrent.locks` 中 `ReentrantLock` 的 Javadoc\
  \ 详细信息），但它们通常处理起来非常痛苦，除非你真的知道自己在做什么，否则最好避免使用。\n\n关于 Java 同步的回顾就足够了。现在让我们来讨论线程在其生命周期内所经历的状态。\n\
  \n### 5.3.2 线程的状态模型\n\n在图 5.2 中，你可以看到 Java 线程的状态模型。它决定了 Java 线程如何在其生命周期中进展。\n\n\
  ![](img/CH05_F02_Evans2.png)\n\n图 5.2 Java 线程的状态模型\n\nJava 有一个名为 `Thread.State`\
  \ 的枚举，它对应于上述状态模型中的状态，是操作系统线程状态视图之上的一层抽象。\n\n注意：每个操作系统都有其自己的线程版本，它们在精确细节上可能有所不同。在大多数情况下，现代操作系统的线程和调度实现相当相似，但并非总是如此（例如\
  \ Solaris 或 Windows XP）。\n\nJava 线程对象最初创建在 `NEW` 状态。此时，OS 线程尚未存在（并且可能永远不存在）。要创建执行线程，必须调用\
  \ `Thread.start()`。这会通知操作系统实际创建一个线程。\n\n调度器会将新线程放入运行队列，并在之后的某个时间点为它找到一个可以运行的核心（如果机器负载过重，可能会涉及一些等待时间）。从那里开始，线程可以通过消耗其分配的时间来继续运行，并被放回队列等待等待处理器时间片。这就是我们在\
  \ 5.1.1 节中提到的强制性线程调度行为。\n\n\n\n\n在整个调度过程中，无论是被分配到核心上运行，还是被放回运行队列，Java 的 `Thread`\
  \ 对象都保持在 `RUNNABLE` 状态。除了这些调度动作，线程本身也可以表示它当前无法使用该核心。这可以通过两种不同的方式实现：\n\n1. 程序代码通过调用\
  \ `Thread.sleep()` 表明线程在继续之前应该等待一段固定的时间。\n2. 线程意识到它必须等待某些外部条件的满足，并调用了 `Object.wait()`。\n\
  \n在这两种情况下，操作系统都会立即将线程从核心上移除。然而，在之后点的行为在每种情况下是不同的。\n\n在第一种情况下，线程请求睡眠一段特定的时间。Java\
  \ 线程转换到 `TIMED_WAITING` 状态，操作系统会设置一个计时器。当计时过期时，睡眠的线程会被唤醒并准备好再次运行，然后放回运行队列。\n\n第二种情况略有不同。它使用了\
  \ Java 每个对象监视器（monitors）的条件 Aspect。线程将转换到 `WAITING` 状态并无限等待。在操作系统信号条件可能满足之前，它通常不会唤醒——这通常是由其他线程对当前对象调用\
  \ `Object.notify()` 实现的。\n\n除了这两个受线程控制的可能外，线程还可能因为等待 I/O 或获取另一个线程持有的锁而转换到 `BLOCKED`\
  \ 状态。最后，如果对应于 Java `Thread` 的操作系统线程已停止执行，那么该线程对象将转换到 `TERMINATED` 状态。让我们来讨论解决同步问题的一种常用方法：全同步对象的思想。\n\
  \n### 5.3.3 全同步对象\n\n在本章的早期，我们引入了并发类型安全的概念，并提到了实现这一目标的一种策略。让我们来看看该策略的更完整的描述，它通常被称为`全同步对象`（fully\
  \ synchronized objects）。如果遵守了以下所有规则，该类被认为是线程安全的，并且是活跃的（live）。\n\n全同步类是指满足以下所有条件的类：\n\
  \n* 所有字段在每个构造函数中始终被初始化为一致的状态。\n* 没有公共字段。\n* 保证从任何非私有方法返回后，对象实例都是是一致的（假设在调用该方法时状态是一致的）。\n\
  * 所有方法都能证明在界限时间内终止。\n* 所有方法都是同步的（synchronized）。\n* 在不一致状态下，方法不会调用另一个实例的方法。\n* 在不一致状态下，方法不会调用当前实例的任何非私有方法。\n\
  \n列表 5.1 显示了银行系统后端此类类的示例。`FSOAccount` 类模拟了一个账户。FSO 前缀是为了清楚地表示此实现使用了全同步对象。\n\n这种情况提供了存款、取款和余额查询——这是读写操作之间经典的冲突——因此使用同步来防止不一致性。\n\
  \n列表 5.1 全同步类\n\n```java\npublic class FSOAccount {\n    private double balance;\
  \                                   ❶\n\n    public FSOAccount(double openingBalance)\
  \ {\n        // 检查 openingBalance > 0，如果不满足则抛出异常\n        balance = openingBalance;\
  \                             ❷\n    }\n\n    public synchronized boolean withdraw(int\
  \ amount) {        ❸\n        // 检查 amount > 0，如果不满足则抛出异常\n        if (balance >=\
  \ amount) {\n            balance = balance - amount;\n            return true;\n\
  \        }\n\n        return false;\n    }\n\n    public synchronized void deposit(int\
  \ amount) {            ❸\n        // 检查 amount > 0，如果不满足则抛出异常\n        balance =\
  \ balance + amount;\n    }\n\n    public synchronized double getBalance() {    \
  \             ❸\n        return balance;\n    }\n}\n```\n\n❶ 没有公共字段\n❷ 所有字段都在构造函数中初始化。\n\
  ❸ 所有方法都是同步的。\n\n这乍看似乎非常完美——该类既安全又活跃。问题出现在性能上。仅仅因为某物是安全且活跃的，并不意味着它一定非常快。你必须使用 `synchronized`\
  \ 来协调对 `balance` 的所有访问（包括获取和设置），而这种锁定最终会减慢你的速度。这是这种处理并发方式的核心问题。\n\n除了性能问题外，列表 5.1\
  \ 中的代码相当脆弱。你可以看到，你永远不会在同步方法之外触碰 `balance`，但由于代码量较小，这只能通过肉眼检查来可能实现。\n\n在真实的大型系统中，由于代码量巨大，这种手动验证是不可能的。在使用这种方法的大型代码库中很容易潜入\
  \ Bug，这是 Java 社区开始寻找更健壮方法的另一个原因。\n\n### 5.3.4 死锁\n\n并发的另一个经典问题（不仅仅是 Java 的处理方式）是`死锁`（deadlock）。考虑列表\
  \ 5.2，它是上一个示例的稍微扩展的形式。在这个版本中，除了模拟账户余额外，我们还有一个 `transferTo()` 方法，可以将资金从一个账户转移到另一个账户。\n\
  \n注意 这是一个构建多线程事务系统的原始尝试。它设计用于演示死锁——你不应该将其作为实际代码的基础。\n\n在下一个列表中，让我们添加一个在两个 `FSOAccount`\
  \ 对象之间转移资金的方法，如下所示。\n\n列表 5.2 死锁示例\n\n```java\npublic synchronized boolean transferTo(FSOAccount\
  \ other, int amount) {\n        // 检查 amount > 0，如果不满足则抛出异常\n        // 模拟需要发生的某些其他检查\n\
  \        try {\n            Thread.sleep(10);\n        } catch (InterruptedException\
  \ e) {\n            Thread.currentThread().interrupt();\n        }\n        if (balance\
  \ >= amount) {\n            balance = balance - amount;\n            other.deposit(amount);\n\
  \            return true;\n        }\n\n        return false;\n    }\n```\n\n现在，让我们在主类中实际引入一些并发：\n\
  \n```java\npublic class FSOMain {\n    private static final int MAX_TRANSFERS =\
  \ 1_000;\n\n    public static void main(String[] args) throws InterruptedException\
  \ {\n        FSOAccount a = new FSOAccount(10_000);\n        FSOAccount b = new\
  \ FSOAccount(10_000);\n        Thread tA = new Thread(() -> {\n            for (int\
  \ i = 0; i < MAX_TRANSFERS; i = i + 1) {\n                boolean ok = a.transferTo(b,\
  \ 1);\n                if (!ok) {\n                    System.out.println(\"Thread\
  \ A failed at \"+ i);\n                }\n            }\n        });\n        Thread\
  \ tB = new Thread(() -> {\n            for (int i = 0; i < MAX_TRANSFERS; i = i\
  \ + 1) {\n                boolean ok = b.transferTo(a, 1);\n                if (!ok)\
  \ {\n                    System.out.println(\"Thread B failed at \"+ i);\n     \
  \           }\n            }\n        });\n        tA.start();\n        tB.start();\n\
  \        tA.join();\n        tB.join();\n\n        System.out.println(\"End: \"\
  + a.getBalance() + \" : \"+ b.getBalance());\n    }\n}\n```\n\n乍看，这段代码看起来很合理。你有两个由独立线程执行的事务。这种设计并不太荒唐——只是线程在两个账户之间发送资金——而且所有方法都是\
  \ `synchronized` 的。\n\n注意我们在 `transferTo()` 方法中引入了一个小的睡眠。这是为了允许线程调度器运行两个线程并导致死锁的可能性。\n\
  \n注意 睡眠是为了演示目的，而不是因为你在编写银行转账代码时真的会这样做。它是为了模拟在实践中实际存在的代码——由于调用数据库或授权检查导致的延迟。\n\n\n\
  \n\n如果你运行这段代码，通常会看到一个死锁示例——两个线程都会运行一段时间，并最终卡住。原因是每个线程都需要另一个线程释放它所持有的锁，传输方法才能继续进行。这在图\
  \ 5.3 中所示。\n\n![](img/CH05_F03_Evans2.png)\n\n图 5.3 锁定的线程\n\n另一种观察方法可以看图 5.4，在图中我们展示了来自\
  \ JDK Mission Control 工具的线程转储（Thread Dump）视图（我们将在第 7 章中详细讨论该工具，并在时向你展示如何找到这个非常有用的视图）。\n\
  \n![](img/CH05_F04_Evans2.png)\n\n图 5.4 锁定的线程\n\n这两个线程被创建为 `Thread-0` 和 `Thread-1`，我们可以看到\
  \ `Thread-0` 锁定了一个引用并处于 `BLOCKED`（阻塞）状态，等待锁定另一个引用。`Thread-1` 对应的线程转储将显示相反的锁配置，从而导致了死锁。\n\
  \n注意 从全同步对象的方法来看，这种死锁的发生是因为违反了“界限时间”原则。当代码调用 `other.deposit()` 时，我们无法保证代码将运行多久，因为\
  \ Java 内存模型并没有保证被阻塞的监视器（monitor）何时会被释放。\n\n为了处理死锁，一种技术是在每个线程中始终以相同的顺序获取锁。在前面的示例中，第一个启动的线程按照\
  \ `A`、`B` 的顺序获取锁，而第二个线程按照 `B`、`A` 的顺序获取。如果两个线程都坚持按照 `A`、`B` 的顺序获取锁，就可以避免死锁，因为在第一个线程完成并释放其锁之前，第二个线程将被阻塞无法运行。在本文章节的后半部分，我们将展示一种简单的方法来安排所有锁都按相同的顺序获取，并验证这种方法是否确实被满足。\n\
  \n接下来，我们将回到之前提出的一个问题：为什么 Java 用于关键区域的关键字被命名为 `synchronized`。这将引导我们进入 `volatile`\
  \ 关键字的讨论。\n\n### 5.3.5 为什么用 synchronized？\n\n并发编程的一个简单概念模型是 CPU 的时间分片——即线程在单个核心上来来切换。这个经典观点见图\
  \ 5.5。\n\n![](img/CH05_F05_Evans2.png)\n\n图 5.5 关于并发和线程的单核（左）和多核（右）思考\n\n然而，多年来这并不是对现代硬件的准确描述。二十年前，一名工作的程序员可以多年不遇到具有一个或最多两个处理核心的系统。现在情况不再如此了。\n\
  \n今天，任何像手机或更大的设备都有多个核心，因此心理模型也应该不同，涵盖在同一物理时刻运行在不同核心上的多个线程（并可能在操作共享数据）。你可以在图 5.5\
  \ 中看到这一点。为了效率考虑，每个同时运行的线程都可能有其自己正在操作的数据缓存副本。\n\n注意 我们仍然会展示执行的理论模型，其中假设的计算机只有一个核心。这纯粹是为了让你看到我们正在讨论的非确定性并发问题是固有的，而不是由硬件设计的特定方面引起的。\n\
  \n带着这个背景，让我们转向选择用于表示锁定区域或方法的关键字这一问题。\n\n我们之前问过，列表 5.1 代码中被同步化的是什么？答案是：被锁对象在不同线程中的内存表示。也就是说，在\
  \ `synchronized` 方法（或块）完成后，对被锁对象所做的任何所有更改在释放锁之前都会刷回主内存，如图 5.6 所示。\n\n![](img/CH05_F06_Evans2.png)\n\
  \n图 5.6 对象的更改通过主内存会在线程之间传播。\n\n此外，当进入 `synchronized` 块并在获取锁后，对被锁对象的任何更改都会从主内存中读取，因此持有锁的线程在锁定区域的代码开始执行之前，已经与主内存中对象的视图完成了同步。\n\
  \n### 5.3.6 volatile 关键字\n\nJava 自远古时代（Java 1.0）就有 `volatile` 关键字，它被用作处理对象字段（包括基本类型）并发的简单方法。以下规则规范了\
  \ `volatile` 字段：\n\n* 线程看到的值在使用之前始终会从主内存中重新读取。\n* 线程写入的任何值在字节码指令完成之前始终会刷到主内存。\n\n\
  这有时被描述为在单次操作周围“像一个微小的同步块”，但这是误导性的，因为 `volatile` 不涉及任何锁定。`synchronized` 的作用是使用对象上的互斥锁，以确保只有一个线程可以执行该对象上的\
  \ `synchronized` 方法。`synchronized` 方法可以包含对对象的许多读写操作，并且将作为一个不可分割的单元（从其他线程的角度来看）执行，因为在对对象上执行的方法退出且对象刷回主内存之前，是看不到该方法执行结果的。\n\
  \n`volatile` 的关键在于它允许对内存位置进行一次操作，该操作将立即刷入内存。这意味着要么是单次读取，要么是单次写入，而不更多。我们在图 5.6 中看到了这两类操作。\n\
  \n`volatile` 变量应该用于模型变量，且对变量的写入不取决于变量的当前状态（读取状态）。这是 `volatile` 仅保证单次操作的结果。\n\n例如，`++`\
  \ 和 `--` 运算符在 `volatile` 上是不安全的，因为它们等同于 `v = v + 1` 或 `v = v - 1`。增量示例是状态依赖更新典型例子。\n\
  \n对于状态状态的情况，你必须引入锁来确保安全。因此，`volatile` 允许程序员在某些情况下简化代码，但代价是每次访问的额外刷新。同时注意，由于 `volatile`\
  \ 机制没有引入任何锁，你无法通过 `volatile` 导致死锁——只能通过同步。在章节后半部分，我们将遇到 `volatile` 的其他应用并详细讨论该机制。\n\
  \n### 5.3.7 线程状态与方法\n\n`java.lang.Thread` 对象仅仅是：一个位于堆中的 Java 对象，包含了关于一个存在、曾经存在或未来可能存在的操作系统线程的元数据。\n\
  \nJava 为线程对象定义了以下状态，对应于主流操作系统的线程状态。它们与我们在图 5.2 中看到的状态模型密切相关：\n\n* `NEW`——`Thread`\
  \ 对象已创建，但实际的操作系统线程尚未创建。\n* `RUNNABLE`——线程就绪。操作系统负责调度它。\n* `BLOCKED`——线程未运行；它需要获取锁或处于系统调用。\n\
  * `WAITING`——线程未运行；它调用了 `Object.wait()` 或 `Thread.join()`。\n* `TIMED_WAITING`——线程未运行；它调用了\
  \ `Thread.sleep()`。\n* `TERMINATED`——线程未运行；它已完成执行。\n\n所有线程都从 `NEW` 状态开始，并以 `TERMINATED`\
  \ 状态结束，无论线程的 `run()` 方法是正常退出还是抛出异常。\n\n注意 Java 线程状态模型不区分 `RUNNABLE` 线程是在精确的某一时刻物理执行，还是在运行队列中等待。\n\
  \n\n\n线程的实际创建是通过 `start()` 方法完成的，该方法调用原生代码来实际执行相关的系统调用（例如 Linux 上的 `clone()`），从而创建线程并在线程的\
  \ `run()` 方法中开始代码执行。\n\nJava 的标准 `Thread` API 分为三组方法。我们不会为每个方法包含大量冗长的 Javadoc 描述，而是将它们列出来，并让读者查阅\
  \ API 文档以获取更多细节。\n\n第一组是用于读取线程元数据的方法：\n\n* `getId()`\n* `getName()`\n* `getState()`\n\
  * `getPriority()`\n* `isAlive()`\n* `isDaemon()`\n* `isInterrupted()`\n\n这些元数据中的某些（例如通过\
  \ `getId()` 获取的线程 ID）在线程的生命周期内是固定不变的。有些部分（例如线程状态和中断状态）会随着线程的运行而自然改变，而另一部分（例如名称和守护线程状态）可以由程序员设置。这引出了我们的第二组方法：\n\
  \n* `setDaemon()`\n* `setName()`\n* `setPriority()`\n* `setUncaughtExceptionHandler()`\n\
  \n通常情况下，程序员在启动线程之前为线程配置任何适当的属性更好。\n\n最后，以下一组线程控制方法用于启动新线程并与其他运行中的线程交互：\n\n* `start()`\n\
  * `interrupt()`\n* `join()`\n\n注意 `Thread.sleep()` 不在此列表中，因为它是一个只针对当前线程的静态方法。\n\n\
  注意 某些带有超时时间的线程方法（例如带有超时参数的 `Thread.join()`）实际上可能会导致线程进入 `TIMED_WAITING` 状态而不是 `WAITING`。\n\
  \n让我们来看一个在简单多线程应用程序典型生命周期如何这些线程方法的示例：\n\n```\nRunnable r = () -> {\n    var start\
  \ = System.currentTimeMillis();\n    try {\n        Thread.sleep(1000);\n    } catch\
  \ (InterruptedException e) {\n        e.printStackTrace();\n    }\n    var thisThread\
  \ = Thread.currentThread();\n    System.out.println(thisThread.getName() +\n   \
  \     \" slept for \"+ (System.currentTimeMillis() - start));\n};\n\nvar t = new\
  \ Thread(r);            ❶\nt.setName(\"Worker\");\nt.start();                  \
  \      ❷\nThread.sleep(100);\nt.join();                         ❸\nSystem.out.println(\"\
  Exiting\");\n```\n\n❶ 线程的元数据对象被创建。\n❷ 操作系统创建了一个实际的线程。\n❸ 主线程暂停并等待工作线程退出后继续。\n\n\
  这些是非常简单的内容：主线程创建工作线程并启动它，然后在到达 `join()` 调用之前至少等待 100 毫秒（给调度器一个运行的机会），这会导致主线程暂停，直到工作线程退出为止。在此期间，工作线程完成睡眠，再次醒来，并打印出消息。\n\
  \n注意 睡眠的持续时间很可能不会恰好是 1000 毫秒。操作系统调度器是非确定的，因此所提供的最佳保证是操作系统会尝试确保线程睡眠请求的时间，除非被唤醒。然而，多线程编程通常涉及处理意料之外的情况，正如我们将在下一节中看到的那样。\n\
  \n### 中断线程\n\n在处理线程时，想要安全地中断线程正在执行的工作是比较常见的，`Thread` 对象提供了相关方法来实现这一点。然而，它们的行为可能与我们最初预期的不同。让我们运行以下代码，该代码创建一个正在忙碌工作的线程，然后尝试中断它：\n\
  \n```\nvar t = new Thread(() -> { while (true); });    ❶\nt.start();           \
  \                           ❶\n\nt.interrupt();                                \
  \  ❷\nt.join();                                       ❸\n```\n\n❶ 创建并启动一个将无限运行的新线程\n\
  ❷ 请求线程中断自身（即停止执行）\n❸ 在我们的主线程中等待另一个线程完成\n\n如果你运行这段代码，你可能会惊讶地发现我们的 `join()` 会无限阻塞。这里发生的情况是线程中断是“可选且自愿的”——在线程中调用的方法必须显式地检查中断状态并做出响应，而我们幼稚的\
  \ `while` 循环从未进行过此类检查。我们可以在循环中通过执行预期检查来修复此，如下：\n\n```\nvar t = new Thread(() ->\
  \ { while (!Thread.interrupted()); });   ❶\nt.start();                         \
  \                             ❶\n\nt.interrupt();\nt.join();\n```\n\n❶ 检查我们当前线程的中断状态，而不是在\
  \ true 上循环\n\n现在，我们的循环会在请求时退出，我们的 `join()` 不再无限阻塞了。\n\nJDK 中常见的阻塞阻塞方法（无论是基于 IO、等待锁还是其他场景）都会检查线程中断状态。惯例是这些方法将抛出\
  \ `InterruptedException`，这是一个受检异常。这解释了为什么例如 `Thread.sleep()` 要求你将 `InterruptedException`\
  \ 添加到方法签名中或处理它。\n\n让我们修改上一节的示例，看看 `Thread.sleep()` 在被中断时的行为：\n\n```\nRunnable r\
  \ = () -> {\n    var start = System.currentTimeMillis();\n    try {\n        Thread.sleep(1000);\n\
  \    } catch (InterruptedException e) {    ❶\n        e.printStackTrace();\n   \
  \ }\n    var thisThread = Thread.currentThread();\n    System.out.println(thisThread.getName()\
  \ +\n        \" slept for \"+ (System.currentTimeMillis() - start));\n    if (thisThread.isInterrupted())\
  \ {\n        System.out.println(\"Thread \"+ thisThread.getName() +\" interrupted\"\
  );\n    }\n};\n\nvar t = new Thread(r);\nt.setName(\"Worker\");\nt.start();    \
  \                            ❷\nThread.sleep(100);\nt.interrupt();             \
  \               ❸\nt.join();\nSystem.out.println(\"Exiting\");\n```\n\n❶ 我们的 Runnable\
  \ 必须处理受检异常 InterruptedException。当我们中断时，它打印堆栈，然后从这里继续。\n❷ 创建工作线程\n❸ 主线程中断工作线程并唤醒它。\n\
  \n当我们运行这段代码时，我们会看到类似的输出：\n\n```\njava.lang.InterruptedException: sleep interrupted\n\
  \    at java.base/java.lang.Thread.sleep(Native Method)\n    at examples.LifecycleWithInterrupt.lambda$main$0\n\
  \     (LifecycleWithInterrupt.java:9)\n    at java.base/java.lang.Thread.run(Thread.java:832)\n\
  Worker slept for 101\nExiting\n```\n\n如果你仔细观察，你会发现 `\"Thread Worker interrupted\"\
  ` 并没有出现。这揭示了处理处理中断的一个重要事实：对中断状态的检查实际上重置了状态。抛出标准 `InterruptedException` 的代码清除了中断，因为它在异常抛出时被认为已处理。\n\
  \n注意 如果我们想要保留线程被中断的信息，我们必须自己手动处理它。对于我们在线程代码稍后需要该状态的简单示例中，这样做就可以：\n\n\n\n\n\n```\n\
  Runnable r = () -> {\n    var start = System.currentTimeMillis();\n    var wasInterrupted\
  \ = false;              ❶\n    try {\n        Thread.sleep(1000);\n    } catch (InterruptedException\
  \ e) {\n        wasInterrupted = true;               ❷\n        e.printStackTrace();\n\
  \    }\n    var thisThread = Thread.currentThread();\n    System.out.println(thisThread.getName()\
  \ +\n        \" slept for \"+ (System.currentTimeMillis() - start));\n    if (wasInterrupted)\
  \ {\n        System.out.println(\"Thread \"+ thisThread.getName() +\" interrupted\"\
  );\n    }\n};\n\nvar t = new Thread(r);\nt.setName(\"Worker\");\nt.start();\nThread.sleep(100);\n\
  t.interrupt();\nt.join();\nSystem.out.println(\"Exiting\");\n```\n\n❶ 设置状态以记录可能的中断\n\
  \n❷ 记录中断\n\n在更复杂的情况下，你可能希望确保将 `InterruptedException` 重新抛出给调用者、抛出某种自定义异常、执行你自己的自定义逻辑，甚至将中断状态恢复到该线程上。根据你的具体需求，所有这些都是可能的。\n\
  \n### 异常与线程处理\n\n多线程编程的另一个问题是如何处理可能从线程内部抛出的异常。例如，假设我们正在执行一个来源未知的 `Runnable`。如果它抛出异常并终止，那么其他代码可能无法感知这一点。幸运的是，`Thread`\
  \ API 提供了在启动线程之前为线程添加未捕获异常处理器的功能，如下例所示：\n\n```\nvar badThread = new Thread(() ->\
  \ {\n    throw new UnsupportedOperationException(); });\n\n// 在启动线程之前设置名称\nbadThread.setName(\"\
  An Exceptional Thread\");\n\n// 设置处理器\nbadThread.setUncaughtExceptionHandler((t,\
  \ e) -> {\n    System.err.printf(\"Thread %d '%s' has thrown exception \" +\n  \
  \                  \"%s at line %d of %s\",\n            t.getId(),\n          \
  \  t.getName(),\n            e.toString(),\n            e.getStackTrace()[0].getLineNumber(),\n\
  \            e.getStackTrace()[0].getFileName()); });\n\nbadThread.start();\n```\n\
  \n该处理器是 `UncaughtExceptionHandler` 的实例，它是一个函数式接口，定义如下：\n\n```\npublic interface\
  \ UncaughtExceptionHandler {\n    void uncaughtException(Thread t, Throwable e);\n\
  }\n```\n\n此方法提供了一个简单的回调，允许线程控制代码根据观察到的异常采取行动——例如，线程池可能会重启以这种方式退出的线程，以维持池的大小。\n\n\
  **注意**：由 `uncaughtException()` 抛出的任何异常都将被 `JVM` 忽略。\n\n在继续之前，我们需要讨论 `Thread` 的一些其他已废弃的控制方法，这些方法不应该被应用程序开发人员使用。\n\
  \n### 已废弃的线程方法\n\nJava 是第一个箱原生支持多线程编程的主流语言。然而，这种“先发”优势也有其阴暗面——并发编程中存在的许多固有问题是那些在\
  \ Java 中工作的程序员首次遇到的。\n\n这其中一个方面是一个令人遗憾的事实：原始 `Thread` API 中的某些方法根本是不安全且不适合使用的，特别是\
  \ `Thread.stop()`。该方法本质上无法安全地使用——它在没有任何警告的情况下杀掉另一个线程，并且被杀死的线程无法确保任何已锁定的对象处于安全状态。\n\
  \n`stop()` 的废弃紧随其在 Java 早期活跃使用之后，因为停止另一个线程需要向另一个线程的执行过程中注入一个异常。然而，无法精确地知道另一个线程在执行的*什么位置*。也许线程在开发者认为会完全执行完的\
  \ `finally` 块中间被杀掉，导致程序处于损坏状态。\n\n其机机制是在被杀掉的线程上触发一个未检查的 `ThreadDeath` 异常。代码无法通过\
  \ `try` 块来防御这种异常（就像无法可靠地防御 `OutOfMemoryError` 一样），因此该异常会立即开始回溯被杀掉线程的堆栈，所有的监视器都会被解锁。这立即让可能受损的对象对其他线程可见，因此\
  \ `stop()` 使用起来是不安全的。\n\n除了 `stop()` 广为人知的问题外，其他几个方法也有严重问题。例如，`suspend()` 不会导致任何监视器释放，因此任何尝试访问被挂起线程锁定的同步代码的线程将被永久阻塞，直到被挂起的线程重新激活。这代表了一个重大的活性危险，因此永远不应该使用\
  \ `suspend()` 和 `resume()`。`destroy()` 方法从未实现过，但如果实现过，它也会遭受同样的问题。\n\n**注意**：这些危险的线程方法自\
  \ Java 1.2 以来（20 多年前）起就被废弃了，并且最近被标记为移除（这将是一个破坏性变更，以此让你了解他们对此问题的重视程度）。\n\n从其他线程可靠地控制线程的真正解决方案，通过我们在本章稍后将遇到的*易变关机*（Volatile\
  \ Shutdown）模式得到最好的说明。现在让我们转向在并发风格编程时，处理必须安全共享的数据时最实用的技术之一。\n\n### 5.3.8 不可变性\n\n\
  一种非常有价值的技巧是使用不可变对象。这些对象要么没有状态，要么只有 `final` 字段（因此这些字段必须在对象的构造函数中填充）。这些对象总是安全且活跃的，因为它们的状态不能被改变，所以它们永远不会处于不状态。\n\
  \n一个问题是，初始化特定对象所需的值必须传入构造函数。这可能导致构造函数调用非常臃肿。结果，许多程序员使用*工厂方法*（factory method）。这可以简单地为使用类上的静态方法而不是构造函数来产生新对象。构造函数通常被设置为保护或私有，以便静态工厂方法成为实例化的唯一方式。例如，考虑我们可能在银行系统中看到的简单存款类，如下所示：\n\
  \n```\npublic final class Deposit {\n    private final double amount;\n    private\
  \ final LocalDate date;\n    private final Account payee;\n\n    private Deposit(double\
  \ amount, LocalDate date, Account payee) {\n        this.amount = amount;\n    \
  \    this.date = date;\n        this.payee = payee;\n    }\n\n    public static\
  \ Deposit of(double amount, LocalDate date, Account payee) {\n        return new\
  \ Deposit(amount, date, payee);\n    }\n\n    public static Deposit of(double amount,\
  \ Account payee) {\n        return new Deposit(amount, LocalDate.now(), payee);\n\
  \    }\n}\n```\n\n这包含了类的字段、私有构造函数和两个工厂方法，其中一个是创建今天存款的便利方法。接下来是字段的访问器方法：\n\n```\n\
  \ public double amount() {\n        return amount;\n    }\n\n    public LocalDate\
  \ date() {\n        return date;\n    }\n\n    public Account payee() {\n      \
  \  return payee;\n    }\n```\n\n**注意**，在我们的示例中，这些呈现为*记录风格*（record style），访问器方法的名称与字段名称匹配。这与*豆包风格*（bean\
  \ style）相反，在那种风格中，getter 方法带有 `get` 前缀，setter 方法（针对非 final 字段）带有 `set` 前缀。\n\n不可变对象显然不能更改，那么当我们想要更改其中一个时会发生什么？例如，非常常见的情况是如果存款或其他交易无法在特定日期发生，该交易将“滚动”到第二天。我们可以通过在类型上拥有一个实例方法来实现，该方法返回一个几乎相同但某些字段已修改的对象，如下所示：\n\
  \n\n\n\n\n```java\n public Deposit roll() {\n        // Log audit event for rolling\
  \ the date\n        return new Deposit(amount, date.plusDays(1), payee);\n    }\n\
  \n    public Deposit amend(double newAmount) {\n        // Log audit event for amending\
  \ the amount\n        return new Deposit(newAmount, date, payee);\n    }\n```\n\n\
  不可变对象可能存在的一个问题是它们可能需要向工厂方法传递许多参数。这并不总是非常方便，特别是当你创建新的不可变对象之前，可能需要从多个源累积状态时。\n\n为了解决这个问题，我们可以使用`Builder`模式。这是两种构造的结合：实现泛型构建器接口的静态内部类，以及不可变类自身的私有构造函数。\n\
  \n该静态内部类是不可变类的构建器，它提供了开发者获取该不可变类型新实例的唯一方法。一种常见的实现方式是让 `Builder` 类拥有与不可变类完全字段，但允许对字段进行修改。此列表展示了你可以如何利用这一点来建模更复杂的存款视图。\n\
  \n### 列表 5.3 不可变对象与构建器\n\n```java\n public static class DepositBuilder implements\
  \ Builder<Deposit> {\n        private double amount;\n        private LocalDate\
  \ date;\n        private Account payee;\n\n        public DepositBuilder amount(double\
  \ amount) {\n            this.amount = amount;\n            return this;\n     \
  \   }\n\n        public DepositBuilder date(LocalDate date) {\n            this.date\
  \ = date;\n            return this;\n        }\n\n        public DepositBuilder\
  \ payee(Account payee) {\n            this.payee = payee;\n            return this;\n\
  \        }\n\n        @Override\n        public Deposit build() {\n            return\
  \ new Deposit(amount, date, payee);\n        }\n    }\n```\n\n构建器是一个泛型顶层接口，通常定义如下：\n\
  \n```java\npublic interface Builder<T> {\n    T build();\n}\n```\n\n我们应该注意关于构建器的几点。。首先，它是一个所谓的\
  \ SAM 类型（用于“单抽象方法”），从技术上说，它可以被用作 lambda 表达式的目标类型。然而，构建器的目的是产生不可变实例——它是为了收集状态，而不是表示函数或回调。这意味着尽管构建器*可以*被用作函数式接口，但在实践中，这样做永远没有任何用处。\n\
  \n出于这个原因，我们*没有*在接口上加上 `@FunctionalInterface` 注解——这是另一个“仅仅因为你可以做某事，并不意味着你应该这样做”的良好例子。\n\
  \n其次，我们应该注意到构建器不是线程安全的。该设计隐含地假设用户知道不要在线程之间共享构建器。相反，`Builder` API 的正确用法是由一个线程使用构建器来聚合所有需要的状态，然后产生一个*可以*与其他线程轻松共享的不可变对象。\n\
  \n**注意** 如果你发现自己想要在线程之间共享构建器，请停下来重新考虑你的设计以及你的领域模型是否需要重构。\n\n不可变性是一种非常常见的模式（不仅在 Java\
  \ 中，在其他语言中也是如此，尤其是函数式语言），并且具有广泛的适用性。\n\n关于不可变对象的最后一点：`final` 关键字仅适用于直接指向的对象。如图 5.7\
  \ 所示，主对象的引用不能赋值指向对象 3，但在对象内部，指向对象 1 的引用可以更新指向对象 2。另一种说法是，`final` 引用可以指向具有非 final\
  \ 字段的对象。这有时被称为*浅不可变性*。\n\n![](img/CH05_F07_Evans2.png)\n\n图 5.7 值与引用的不可变性\n\n另一种看待此问题的方法是完全可以编写以下代码：\n\
  \n```java\nfinal var numbers = new LinkedList<Integer>();\n```\n\n在该语句中，引用 `numbers`\
  \ 和列表中包含的整数对象都是不可变的。然而，列表对象本身仍然是变的，因为整数对象仍然可以被列表添加、删除和替换。\n\n不可变性是一项非常强大的技术，你应该在可行的情况下使用它。然而，有时仅凭不可变对象无法进行高效开发，因为对对象状态的任何更改都需要创建一个新对象。因此，我们有时不得不处理可变对象。\n\
  \n在下一节中，我们将讨论经常被误解的 Java 内存模型（JMM）细节。许多 Java 程序员都意识到 JMM，并且根据他们自己的理解编写代码，而从未被正式介绍过它。如果这听起来像你，那么这种新的理解将基于你的非正式认知并将其建立在坚实的基础上。JMM\
  \ 是一个相当高级的主题，如果你急于进入下一章，可以跳过它。\n\n## 5.4 Java 内存模型 (JMM)\n\nJMM 在《Java 语言规范》（JLS）的第\
  \ 17.4 节中描述。这是规范的正式部分，它通过同步操作和一些相当数学化的概念来描述 JMM，例如操作的*偏序*。\n\n从语言理论家和 Java 规范实现者（编译器和\
  \ JVM 制造者）的角度来看，这是非常好的，但对于需要理解多线程代码如何执行细节的应用程序开发者来说，情况更糟。\n\n我们不再重复正式细节，而在这里通过几个基本概念列出最重要的规则：代码块之间的*同步*（Synchronizes-With）和*先于*（Happens-Before）关系\n\
  \n*   *先于*——这种关系表示一个代码块在另一个代码块执行之前完全完成。\n*   *同步*——一个操作在继续之前会同步其主内存视图。\n\n如果你学习过面向对象的编程正式方法，你可能听过使用包含（Has-A）和是（Is-A）表达式来描述面向对象的构建块。一些开发者发现将\
  \ `Happens-Before` 和 `Synchronizes-With` 视为类似的构建块，用于理解 Java 并发而非面向对象。然而，我们应该强调，这两组概念之间不存在直接的技术联系。在图\
  \ 5.8 中，你可以看到一个 volatile 写同步于后续读取（用于 `println()`）的示例。\n\nJMM 有这些主要规则：\n\n*   监视器上的解锁操作同步于后续锁定操作。\n\
  *   对 volatile 变量的写入同步于该变量的读取。\n*   如果操作 A 同步操作 B，那么 A 先于 B。\n*   如果 A 在线程内的程序顺序在\
  \ B 之前，那么 A 先于 B。\n\n![](img/CH05_F08_Evans2.png)\n\n图 5.8 同步示例\n\n额外的规则（实际上是关于合理的行为）如下：\n\
  \n*   构造函数的完成先于该对象的终结器的运行（对象在完全构造之前就可以被终结）。\n*   启动线程的操作同步于新线程的第一个操作。\n*   `Thread.join()`\
  \ 同于被连接线程的最后一个（以及所有其他）操作。\n\n\n\n\n\n*   如果 `X` 先于 `Y` 且 `Y` 先于 `Z`，则 `X` 先于 `Z`（传递性）。\n\
  \n这些简单的规则定义了该平台对内存和同步工作原理的完整视图。图 5.9 展示了传递性规则。\n\n![](img/CH05_F09_Evans2.png)\n\
  \n图 5.9 Happens-Before 的传递性\n\n注意 在实践中，这些规则是 `JMM` 提供的最小保证。实际的 `JVM` 在实际运行中的表现可能比这些保证所暗示的好得多。这对于开发者来说可能是一个巨大的陷阱，因为特定\
  \ `JVM` 行为带来的虚假安全感，可能只是隐藏了底层并发 bug 的特性。\n\n从这些最小保证中，很容易看出为什么不可变性（immutability）是并发\
  \ Java 编程中一个重要概念。如果对象不能被更改，就不会存在于确保更改对所有线程可见的问题。\n\n## 5.5 通过字节码理解并发\n\n让我们通过一个经典例子：银行账户来讨论并发。假设客户的账户如下所示，并且可以通过调用方法进行取款和存款。我们为关键方法提供了同步和未同步的实现：\n\
  \n```java\npublic class Account {\n    private double balance;\n\n    public Account(int\
  \ openingBalance) {\n        balance = openingBalance;\n    }\n\n    public boolean\
  \ rawWithdraw(int amount) {\n        // 检查 amount > 0，如果不是则抛异常\n        if (balance\
  \ >= amount) {\n            balance = balance - amount;\n            return true;\n\
  \        }\n        return false;\n    }\n\n    public void rawDeposit(int amount)\
  \ {\n        // 检查 amount > 0，如果不是则抛异常\n        balance = balance + amount;\n  \
  \  }\n\n    public double getRawBalance() {\n        return balance;\n    }\n\n\
  \    public boolean safeWithdraw(final int amount) {\n        // 检查 amount > 0，如果不是则抛异常\n\
  \        synchronized (this) {\n            if (balance >= amount) {\n         \
  \       balance = balance - amount;\n                return true;\n            }\n\
  \        }\n        return false;\n    }\n\n    public void safeDeposit(final int\
  \ amount) {\n        // 检查 amount > 0，如果不是则抛异常\n        synchronized (this) {\n\
  \            balance = balance + amount;\n        }\n    }\n\n    public double\
  \ getSafeBalance() {\n        synchronized (this) {\n            return balance;\n\
  \        }\n    }\n}\n```\n\n这组方法允许我们探索 Java 中许多常见的并发问题。\n\n注意 我们在现阶段使用同步块的形式，而不是\
  \ `synchronized` 方法修饰符——我们将在章节稍后后解释原因。\n\n我们还可能假设，如果需要，该类有两个如下的双参数辅助方法：\n\n```java\n\
  \ public boolean withdraw(int amount, boolean safe) {\n        if (safe) {\n   \
  \         return safeWithdraw(amount);\n        } else {\n            return rawWithdraw(amount);\n\
  \        }\n    }\n```\n\n让我们从多线程系统显示的一个基本问题开始，这个问题要求我们引入某种保护机制。\n\n### 5.5.1 丢失更新\
  \ (Lost Update)\n\n为了演示这个被称为 `Lost Update` 的常见问题（或反模式），来看 `rawDeposit()` 方法的字节码：\n\
  \n```\npublic void rawDeposit(int);\n    Code:\n       0: aload_0\n       1: aload_0\n\
  \       2: getfield      #2  // Field balance:D   ❶\n       5: iload_1\n       6:\
  \ i2d\n       7: dadd                                   ❷\n       8: putfield  \
  \    #2  // Field balance:D   ❸\n      11: return\n```\n\n❶ 从对象中读取余额\n\n❷ 存款金额\n\
  \n❸ 将新余额写入对象\n\n注意 记住，某些字节码指令具有在流中跟随其后的参数，这会导致指令编号偶尔出现“跳跃”。\n\n`Lost Update` 是指这样一个问题：由于应用程序线程的非确定性调度，可能会导致出现如下的读写操作字节码序列：\n\
  \n```\nA0: aload_0\n     A1: aload_0\n     A2: getfield      #2  // Field balance:D\
  \       ❶\n     A5: iload_1\n     A6: i2d\n     A7: dadd\n\n// ....           上下文切换\
  \ A -> B\n\n         B0: aload_0\n         B1: aload_0\n         B2: getfield  \
  \    #2  // Field balance:D   ❷\n         B5: iload_1\n         B6: i2d\n      \
  \   B7: dadd\n         B8: putfield      #2  // Field balance:D   ❸\n        B11:\
  \ return\n\n// ....           上下文切换 B -> A\n\n     A8: putfield      #2  // Field\
  \ balance:D       ❹\n    A11: return\n```\n\n❶ 线程 A 从余额中读取一个值。\n\n❷ 线程 B 从余额中读取与\
  \ A 相同的值。\n\n❸ 线程 B 将新值写回余额。\n\n❹ 线程 A 覆盖余额————B 的更新丢失了。\n\n更新后的余额是由每个线程使用操作栈计算的。`dadd`\
  \ 操作码是将更新后的余额放在栈上的点，但请记住每个方法调用都有自己的私有操作栈。因此，在上述流程的 `B7` 点，有*两个*更新后的余额副本：一个在 `A`\
  \ 的操作栈中，另一个在 `B` 的操作栈中。随后执行 `B8` 和 `A8` 的两个 `putfield` 操作，但 `A8` 覆盖了放置在 `B8` 处的值。这导致了虽然两次存款似乎都成功了，但实际上只有一个显示出来的情况。\n\
  \n账户余额会记录一笔存款，但代码仍会导致资金从账户消失，因为 `balance` 字段被读取了两次（通过 `getfield`），然后写入并覆盖（通过两次 `putfield`\
  \ 操作）。例如，在某些代码中：\n\n```java\nAccount acc = new Account(0);\nThread tA = new Thread(()\
  \ -> acc.rawDeposit(70));\nThread tB = new Thread(() -> acc.rawDeposit(50));\ntA.start();\n\
  tB.start();\ntA.join();\ntB.join();\n\nSystem.out.println(acc.getRawBalance());\n\
  ```\n\n最终余额可能是 50 或 70——但两个线程都“成功”地存了钱。代码存入了 120 但丢失了部分——这是错误多线程代码的典型示例。\n\n小心此处所示的简单代码。在这样的示例中，完整的非确定性可能性可能不会出现。不要被这种形式欺骗——当这些代码组合进大型程序时，错误性将不可避免。假设你的代码因为“太简单”而没问题，或者试图欺骗并发模型，最终将导致糟糕的后果。\n\
  \n注意 源码库中有一个示例（`AtmLoop`）展示了这种效果，但它依赖于我们尚未遇到的类（`AtomicInteger`），因此我们在此不再完整展示。因此，如果你需要被说服，请去检查该示例的行为。\n\
  \n### 5.5.2 字节码中的同步\n\n\n\n\n在第 4 章中，我们引入了 `JVM` 字节码，并简要地遇到了 `monitorenter` 和 `monitorexit`。一个\
  \ `synchronized` 块会被转换为这些操作码（我们稍后会再讨论同步方法）。让我们通过之前看过的一个示例来观察它们的运行情况（我们正在重现 Java\
  \ 代码，以便方便查看）：\n\n```java\n public boolean safeWithdraw(final int amount) {\n   \
  \     // 检查金额是否 > 0，若则抛出异常\n        synchronized (this) {\n            if (balance\
  \ >= amount) {\n                balance = balance - amount;\n                return\
  \ true;\n            }\n        }\n        return false;\n    }\n```\n\n这被转换为 40\
  \ 字节的 JVM 字节码：\n\n```\npublic boolean safeWithdraw(int);\n    Code:\n       0: aload_0\n\
  \       1: dup\n       2: astore_2\n       3: monitorenter                     \
  \      ❶\n       4: aload_0\n       5: getfield      #2  // Field balance:D\n  \
  \     8: iload_1\n       9: i2d\n      10: dcmpl\n      11: iflt          29   \
  \                    ❷\n      14: aload_0\n      15: aload_0\n      16: getfield\
  \      #2  // Field balance:D\n      19: iload_1\n      20: i2d\n      21: dsub\n\
  \      22: putfield      #2  // Field balance:D   ❸\n      25: iconst_1\n      26:\
  \ aload_2\n      27: monitorexit                            ❹\n      28: ireturn\
  \                                ❺\n      29: aload_2\n      30: monitorexit   \
  \                         ❹\n      31: goto          39\n      34: astore_3\n  \
  \    35: aload_2\n      36: monitorexit                            ❹\n      37:\
  \ aload_3\n      38: athrow\n      39: iconst_0\n      40: ireturn             \
  \                   ❺\n```\n\n❶ 同步块的开始\n\n❷ 检查余额的 `if` 语句\n\n❸ 将新值写入 `balance` 字段\n\
  \n❹ 同步块的结束\n\n❺ 从方法返回\n\n眼尖的读者可能会在字节码中发现几处奇常之处。首先，让我们看看代码执行路径。如果 `balance` 检查成功，则执行字节码\
  \ `0–28` 且没有跳转。如果检查失败，则执行字节码 `0–11`，然后跳转到 `29–31`，再跳转到 `39–40`。\n\n从初看，没有任何情况会导致执行字节码\
  \ `34–38`。这种表面上的不一致实际上是由异常处理来解释的——某些字节码指令（包括 `monitorenter`）可能会抛出异常，因此需要一条异常处理代码路径。\n\
  \n第二个谜团是方法的返回类型。在 Java 代码中，它被声明为 `boolean`，但我们可以看到返回指令是 `ireturn`，它是返回操作码的整数变体。事实上，不存在针对\
  \ `byte`、`short`、`char` 或 `boolean` 的变体指令。这些类型在编译过程中被替换为 `int`。这是 `类型擦除`（type erasure）的一种形式，它是\
  \ Java 类型系统中容易被误解的方面之一（特别是当应用于泛型和类型参数时）。\n\n总的来说，之前的字节码序列比非同步情况更复杂，但是可以追踪的：我们将要锁的对象加载到求值栈上，然后执行\
  \ `monitorenter` 来获取锁。假设获取锁成功。\n\n现在，如果任何其他线程尝试对同一个对象执行 `monitorenter`，该线程将阻塞，直到持有锁的线程执行\
  \ `monitorexit` 并释放锁，第二个 `monitorenter` 指令才会完成。这就是我们处理“丢失更新”（Lost Update）的方式——`monitor`\
  \ 指令强制了以下顺序：\n\n```\n...\nA: monitorenter\nA: getfield\nA: putfield\nA: monitorexit\n\
  ...\nB: monitorenter\nB: getfield\nB: putfield\nB: monitorexit\n...\n```\n\n这在同步块之间提供了\
  \ `Happens-Before`（发生于）关系：一个同步块的结束 `Happens-Before` 同一对象上任何其他同步块的开始，这由 `JMM`（Java\
  \ 内存模型）保证。\n\n我们还应该注意，Java 源码编译器确保通过包含 `monitorenter` 的方法的每条代码路径在方法终止之前都会执行 `monitorexit`。不仅如此，在类加载时，类文件验证器将拒绝任何试图绕过此规则的类。\n\
  \n现在我们现在了“同步机制是 Java 中的一种协作机制”这一说法的依据。让我们看看当线程 `A` 调用 `safeWithdraw()` 且线程 `B` 调用\
  \ `rawDeposit()` 时会发生什么：\n\n```java\n public boolean safeWithdraw(final int amount)\
  \ {\n        // 检查金额是否 > 0，若则抛出异常\n        synchronized (this) {\n            if\
  \ (balance >= amount) {\n                balance = balance - amount;\n         \
  \       return true;\n            }\n        }\n        return false;\n    }\n```\n\
  \n为了方便比较，我们再次重现了 Java 代码：\n\n```\npublic boolean safeWithdraw(int);\n    Code:\n\
  \       0: aload_0\n       1: dup\n       2: astore_2\n       3: monitorenter  \
  \                         ❶\n       4: aload_0\n       5: getfield      #2  // Field\
  \ balance:D\n       8: iload_1\n       9: i2d\n      10: dcmpl\n      11: iflt \
  \         29                       ❷\n      14: aload_0\n      15: aload_0\n   \
  \   16: getfield      #2  // Field balance:D\n      19: iload_1\n      20: i2d\n\
  \      21: dsub\n      22: putfield      #2  // Field balance:D   ❸\n      25: iconst_1\n\
  \      26: aload_2\n      27: monitorexit                            ❹\n      28:\
  \ ireturn                                ❺\n      29: aload_2\n      30: monitorexit\
  \                            ❹\n      31: goto          39\n      34: astore_3\n\
  \      35: aload_2\n      36: monitorexit                            ❹\n      37:\
  \ aload_3\n      38: athrow\n      39: iconst_0\n      40: ireturn             \
  \                   ❺\n```\n\n存款代码非常简单：\n\n```java\npublic void rawDeposit(int amount)\
  \ {\n        // 检查金额是否 > 0，若则抛出异常\n        balance = balance + amount;\n    }\n\
  ```\n\n字节码看起来更复杂但其实并非：\n\n```\npublic void rawDeposit(int);\n    Code:\n       0:\
  \ aload_0\n       1: dup\n       2: astore_2\n       3: aload_0\n       4: getfield\
  \      #2  // Field balance:D\n       5: iload_1\n       6: i2d\n       7: dadd\n\
  \       8: putfield      #2  // Field balance:D\n       9: ireturn\n```\n\n注意 `rawDeposit`\
  \ 代码不包含任何 `monitor` 指令——因此没有锁。在线程 `A` 和 `B` 之间发生这种顺序是完全可能的，如下所示：\n\n```\n // ...\n\
  \       A3: monitorenter\n      // ...\n      A14: aload_0\n      A15: aload_0\n\
  \      A16: getfield      #2  // Field balance:D\n\n      // ... 切换到线程 B\n\n   \
  \    B0: aload_0\n       B1: aload_0\n       B2: getfield      #2  // Field balance:D\n\
  \       B5: iload_1\n       B6: i2d\n       B7: dadd\n       B8: putfield      #2\
  \  // Field balance:D    ❶\n\n      // ... 切换到线程 A\n\n       B11: return\n     \
  \ A19: iload_1\n      A20: i2d\n      A21: dsub\n      A22: putfield      #2  //\
  \ Field balance:D    ❷\n      A25: iconst_1\n      A26: aload_2\n      A27: monitorexit\n\
  \      A28: ireturn\n```\n\n❶ 通过非同步方法写入余额\n\n❷ 第二次写入余额（通过同步方法）\n\n这就是我们的老朋友“丢失更新”，但现在它发生在其中一个方法使用同步而另一个没有使用的情况下。存款的金额丢失了——这对银行有利，但对客户并不友好。不可避免的结论是：为了获得同步提供的保护，*所有*方法都必须正确使用它。\n\
  \n### 5.5.3 同步方法\n\n到为止，我们讨论的是同步块的情况，但同步*方法*的情况呢？我们可能会猜编译器会插入合成的 `monitor` 字节码，但事实如此，正如我们把安全方法修改为如下所示：\n\
  \n```java\n public synchronized boolean safeWithdraw(final int amount) {\n     \
  \   // 检查金额是否 > 0，若则抛出异常\n        if (balance >= amount) {\n            balance\
  \ = balance - amount;\n            return true;\n        }\n        return false;\n\
  \    }\n\n    // 以及其他方法...\n```\n\n\n\n并不是直接出现在字节码序列中，方法的 `synchronized` 修饰符实际上显示在方法的标志（flags）中，以\
  \ `ACC_SYNCHRONIZED` 的形式存在。我们可以通过重新编译该方法并注意到 `monitor` 指令已经消失，如下所示：\n\n```\n public\
  \ synchronized boolean safeWithdraw(int);\n    Code:\n       0: aload_0\n      \
  \ 1: getfield      #2  // Field balance:D\n       4: iload_1\n       5: i2d\n  \
  \     6: dcmpl\n       7: iflt          23\n      10: aload_0\n      // ... 没有 monitor\
  \ 指令\n```\n\n在执行 `invoke` 指令时，字节码解释器首先检查的内容之一就是该方法是否是 `synchronized` 的。如果是，解释器将进入另一不同的代码路径——首先尝试获取相应的锁。如果该方法没有\
  \ `ACC_SYNCHRONIZED` 标记，则不会进行此类检查。\n\n这意味着，正如我们预期的那样，一个非同步的方法可以与同步的方法同时执行，因为只有其中一个会执行对锁的检查。\n\
  \n### 5.5.4 未同步读取\n\nJava 并发中一个非常常见的初错误是假设“只有写入数据的方法需要同步；读取是安全的”。正如我们将证明的那样，这绝对不是真的。\n\
  \n这种对读取的虚假安全感有时发生，是因为用于推理的代码示例太简单了。如果我们在这个示例中引入一个很小的 ATM 手续费——比如，取款金额的 1%——会发生什么？\n\
  \n```\n private final double atmFeePercent = 0.01;\n\n    public boolean safeWithdraw(final\
  \ int amount, final boolean withFee) {\n        // 检查金额是否 > 0，如果不是则抛异常\n       \
  \ synchronized (this) {\n            if (balance >= amount) {\n                balance\
  \ = balance - amount;\n                if (withFee) {\n                    balance\
  \ = balance - amount * atmFeePercent;\n                }\n                return\
  \ true;\n            }\n        }\n        return false;\n    }\n```\n\n该方法的字节码现在变得稍微复杂了一些：\n\
  \n```\npublic boolean safeWithdraw(int, boolean);\n    Code:\n       0: aload_0\n\
  \       1: dup\n       2: astore_3\n       3: monitorenter\n       4: aload_0\n\
  \       5: getfield      #2  // Field balance:D\n       8: iload_1\n       9: i2d\n\
  \      10: dcmpl\n      11: iflt          49                            ❶\n    \
  \  14: aload_0\n      15: aload_0\n      16: getfield      #2  // Field balance:D\n\
  \      19: iload_1\n      20: i2d\n      21: dsub\n      22: putfield      #2  //\
  \ Field balance:D        ❷\n      25: iload_2\n      26: ifeq          45\n    \
  \  29: aload_0\n      30: aload_0\n      31: getfield      #2  // Field balance:D\n\
  \      34: iload_1\n      35: i2d\n      36: aload_0\n      37: getfield      #5\
  \  // Field atmFeePercent:D\n      40: dmul\n      41: dsub\n      42: putfield\
  \      #2  // Field balance:D        ❸\n      45: iconst_1\n      46: aload_3\n\
  \      47: monitorexit\n      48: ireturn\n      49: aload_3\n      50: monitorexit\n\
  \      51: goto          61\n      54: astore        4\n      56: aload_3\n    \
  \  57: monitorexit\n      58: aload         4\n      60: athrow\n      61: iconst_0\n\
  \      62: ireturn\n```\n\n❶ 比较 `balance` 和 `amount`\n\n❷ 账户余额被更新。\n\n❸ 应用手续费并再次更新余额。\n\
  \n注意，现在有两个 `putfield` 指令，因为 `safeWithdraw()` 接收一个 `boolean` 参数，用于决定是否应该收取手续费。发生了两次独立的更新这一事实导致了并发漏洞的产生。\n\
  \n读取原始余额的代码非常简单：\n\n```\npublic double getRawBalance();\n    Code:\n       0: aload_0\n\
  \       1: getfield      #2  // Field balance:D\n       4: dreturn\n```\n\n然而，它可以与带手续费的取款代码交错执行如下：\n\
  \n```\n A14: aload_0\n      A15: aload_0\n      A16: getfield      #2  // Field\
  \ balance:D\n      A19: iload_1\n      A20: i2d\n      A21: dsub\n      A22: putfield\
  \      #2  // Field balance:D   ❶\n      A25: iload_2\n      A26: ifeq         \
  \ 45\n      A29: aload_0\n      A30: aload_0\n      A31: getfield      #2  // Field\
  \ balance:D\n\n      // ... 上下文切换 A -> B\n\n       B0: aload_0\n       B1: getfield\
  \      #2  // Field balance:D   ❷\n       B4: dreturn\n\n      // ... 上下文切换 B ->\
  \ A\n\n      A34: iload_1\n      A35: i2d\n      A36: aload_0\n      A37: getfield\
  \      #5  // Field atmFeePercent:D\n      A40: dmul\n      A41: dsub\n      A42:\
  \ putfield      #2  // Field balance:D\n```\n\n### 5.5.5 重温死锁\n\n假设银行想要添加账户间转账的功能。一个初始版本可能如下：\n\
  \n```java\npublic boolean safeTransferTo(Account other, int amount) {\n    // 检查金额\
  \ > 0，如果不是则抛异常\n    synchronized (this) {\n        if (balance >= amount) {\n  \
  \          balance = balance - amount;\n            synchronized (other) {\n   \
  \             other.rawDeposit(amount);\n            }\n            return true;\n\
  \        }\n    }\n    return false;\n}\n```\n\n这产生了一个长的字节码列表，所以我们省略了熟悉的序列。注意有两个账户对象，每个对象都有锁。为了安全，我们需要协调两个锁——属于\
  \ `this` 的锁和属于 `other` 的锁。\n\n我们需要处理两对 `monitor` 指令，每对处理一个不同对象的锁：\n\n```\npublic\
  \ boolean naiveTransferTo(Account, int);\n    Code:\n       0: aload_0\n       1:\
  \ dup\n       2: astore_3\n       3: monitorenter                              \
  \   ❶\n\n      // 省略常规检查字节码\n\n      14: aload_0\n      15: aload_0\n      16: getfield\
  \      #2  // Field balance:D\n      19: iload_2\n      20: i2d\n      21: dsub\n\
  \      22: putfield      #2  // Field balance:D\n      25: aload_1\n      26: dup\n\
  \      27: astore        4\n      29: monitorenter                             \
  \    ❷\n      30: aload_1\n      31: iload_2\n      32: invokevirtual #6  // Method\
  \ rawDeposit:(I)V\n      35: aload_4\n      37: monitorexit                    \
  \             ❸\n      38: goto          49\n\n      49: iconst_1\n      50: aload_3\n\
  \      51: monitorexit                                  ❹\n      52: ireturn\n```\n\
  \n❶ 获取此对象的锁\n\n❷ 获取另一个对象的锁\n\n❸ 另一个对象的锁\n\n❹ 此对象的锁\n\n想象两个线程试图在两个账户之间转账——我们称这些线程为\
  \ `A` 和 `B`。进一步假设这些线程正在执行由发送账户标记的交易，因此线程 `A` 尝试从对象 `A` 向对象 `B` 转账，反之亦然：\n\n\n\n\n\
  \n```\n A0: aload_0\n       A1: dup\n       A2: astore_3\n       A3: monitorenter\
  \                            ❶\n\n       // 省略常规余额检查字节码\n\n       B0: aload_0\n\
  \       B1: dup\n       B2: astore_3\n       B3: monitorenter                  \
  \          ❷\n\n       // 省略常规余额检查字节码\n\n      B14: aload_0\n      B15: aload_0\n\
  \      B16: getfield      #2  // Field balance:D\n      B19: iload_2\n      B20:\
  \ i2d\n      B21: dsub\n      B22: putfield      #2  // Field balance:D\n      B25:\
  \ aload_1\n      B26: dup\n      B27: astore        4\n      B29: ...          \
  \                           ❸\n      A14: aload_0\n      A15: aload_0\n      A16:\
  \ getfield      #2  // Field balance:D\n      A19: iload_2\n      A20: i2d\n   \
  \   A21: dsub\n      A22: putfield      #2  // Field balance:D\n      A25: aload_1\n\
  \      A26: dup\n      A27: astore        4\n      A29: ...                    \
  \                 ❹\n```\n\n❶ 线程 `A` 在账户对象 `A` 上获取的锁\n\n❷ 线程 `B` 在账户对象 `B` 上获取的锁\n\
  \n❸ 线程 B 尝试获取对象 A 的锁。它获取失败了并进入阻塞状态。\n\n❹ 线程 A 尝试获取对象 B 的锁。它获取失败了并进入阻塞状态。\n\n执行完这一序列操作后，两个线程都无法进展。糟糕的是，只有线程\
  \ `A` 可以释放对象 `A` 上的锁，只有线程 `B` 可以释放对象 `B` 上的锁，因此这两个线程被同步机制永久地阻塞，这些方法调用将永远不会完成。通过在字节码级别查看死锁反模式，我们可以清晰地看到导致它的真正原因。\n\
  \n### 5.5.6 解决死锁，重新审视\n\n为了解决这个问题，正如我们之前讨论的，我们需要确保每个线程始终按照相同的顺序获取锁。实现这一点的方法是为线程建立一种排序——例如，通过引入唯一的账户编号并执行以下规则：“先获取账户\
  \ ID 最小对应的锁”。\n\n注意：对于没有数字 ID 的对象，我们需要采取不同的方法，但使用无歧的 `全序`（total order）的通用原则仍然适用。\n\
  \n这种方法会产生额外的复杂性，为了完全正确地实现，我们需要保证账户 ID 不会被重用。我们可以通过引入一个 `static int` 字段来实现，该字段持有下一个分配的账户\
  \ ID，并且仅在 `synchronized` 方法中更新它，如下所示：\n\n```\n private static int nextAccountId\
  \ = 1;\n\n    private final int accountId;\n\n    private static synchronized int\
  \ getAndIncrementNextAccountId() {\n        int result = nextAccountId;\n      \
  \  nextAccountId = nextAccountId + 1;\n        return result;\n    }\n\n    public\
  \ Account(int openingBalance) {\n        balance = openingBalance;\n        atmFeePercent\
  \ = 0.01;\n        accountId = getAndIncrementNextAccountId();\n    }\n\n    public\
  \ int getAccountId() {\n        return accountId;\n    }\n```\n\n我们不需要同步 `getAccountId()`\
  \ 方法，因为该字段是 `final` 且不可更改，此处所示：\n\n```\n public boolean safeTransferTo(final Account\
  \ other, final int amount) {\n        // 检查金额是否 > 0，如果不是则抛异常\n        if (accountId\
  \ == other.getAccountId()) {\n            // 不能向自己的账户转账\n            return false;\n\
  \        }\n\n        if (accountId < other.getAccountId()) {\n            synchronized\
  \ (this) {\n                if (balance >= amount) {\n                    balance\
  \ = balance - amount;\n                    synchronized (other) {\n            \
  \            other.rawDeposit(amount);\n                    }\n                \
  \    return true;\n                }\n            }\n            return false;\n\
  \        } else {\n            synchronized (other) {\n                synchronized\
  \ (this) {\n                    if (balance >= amount) {\n                     \
  \   balance = balance - amount;\n                        other.rawDeposit(amount);\n\
  \                        return true;\n                    }\n                }\n\
  \            }\n            return false;\n        }\n    }\n```\n\n生成的 Java 代码自然是有不对称的。\n\
  \n注意：通过避免持有任何超过必要的锁，可以清楚地看出代码的哪些部分实际上需要锁。\n\n之前的代码生成了非常长的字节码列表，但让我们分部分拆解。首先，我们检查账户\
  \ ID 的顺序：\n\n```\n // 省略余额和账户相等性检查\n      13: aload_0\n      14: getfield      #8\
  \   // Field accountId:I\n      17: aload_1\n      18: invokevirtual #10  // Method\
  \ getAccountId:()I\n      21: if_icmpge     91\n```\n\n如果 `A < B`（事实如此），则我们移动到指令\
  \ 24；否则，我们跳转到 91，如下：\n\n```\n 24: aload_0\n      25: dup\n      26: astore_3\n \
  \     27: monitorenter                                ❶\n      28: aload_0\n   \
  \   29: getfield      #3   // Field balance:D\n      32: iload_2\n      33: i2d\n\
  \      34: dcmpl\n      35: iflt         77                             ❷\n```\n\
  \n❶ `synchronized (this)` { 的开始\n\n❷ 如果资金不足，跳转到 77（后续）\n\n让我们跟随发送账户资金的情况，进入 38，即\
  \ Java 代码中的 `balance = balance - amount;` 语句：\n\n```\n 38: aload_0\n      39: aload_0\n\
  \      40: getfield      #3   // Field balance:D\n      43: iload_2\n      44: i2d\n\
  \      45: dsub\n      46: putfield      #3   // Field balance:D\n      49: aload_1\n\
  \      50: dup\n      51: astore        4\n      53: monitorenter              \
  \                   ❶\n      54: aload_1\n      55: iload_2\n      56: invokirtual\
  \ #9   // Method rawDeposit:(I)V\n      59: aload_4\n      61: monitxit        \
  \                          ❷\n      62: goto          73\n      // 省略异常处理代码\n  \
  \    73: iconst_1\n      74: aload_3\n      75: monitxit                       \
  \           ❸\n      76: ireturn\n```\n\n❶ `synchronized (other)` { 的开始\n\n❷ `synchronized\
  \ (other)` { 的结束\n\n❸ `synchronized (this)` { 的结束\n\n为了完整性，让我们展示发送账户资金不足时的路径。我们基本上只是释放\
  \ `this` 锁并返回：\n\n```\n 77: aload_3\n      78: monitxit                    ❶\n \
  \     79: goto          89\n      // 省略异常处理代码\n      89: iconst_0\n      90: ireturn\n\
  ```\n\n❶ `synchronized (this)` { 的结束\n\n注意某些指令（如 `invoke` 和 `monitor` 指令）可能会抛出异常，因此我们像往常一样忽略这些异常处理器。方法的其余部分如下：\n\
  \n```\n 91: aload_1\n      // ...\n      // 针对另一个分支\n```\n\n让我们看看两个线程的情况下会发生什么，记住账户\
  \ ID `A < B`。\n\n\n\n\n\n```\n A24: aload_A0\n      A25: dup\n      A26: astore_A3\n\
  \      A27: monitorenter                                        ❶\n\n      // 省略余额检查\n\
  \n      A38: aload_A0\n      A39: aload_A0\n      A40: getfield      #3   // Field\
  \ balance:D\n\n// ....           上下文切换 A -> B\n\n      B91: aload_B1\n      B92:\
  \ dup\n      B93: astore_B3\n      B94: monitorenter                           \
  \             ❷\n\n// ....           上下文切换 B -> A\n\n      A43: iload_A2\n     \
  \ A44: i2d\n      A45: dsub\n      A46: putfield      #3   // Field balance:D\n\
  \      A49: aload_A1\n      A50: dup\n      A51: astore        A4\n      A53: monitorenter\
  \                                        ❸\n      A54: aload_A1\n      A55: iload_A2\n\
  \      A56: invokevirtual #9   // Method rawDeposit:(I)V\n      A59: aload     \
  \    A4\n      A61: monitorexit                                         ❹\n    \
  \  A62: goto          73\n\n      // 省略异常处理代码\n\n      A73: iconst_A1\n      A74:\
  \ aload_A3\n      A75: monitorexit                                         ❺\n\n\
  // ....           上下文切换 A -> B\n\n      B95: aload_B0\n      B96: dup\n      B97:\
  \ astore        B4\n      B99: monitorenter\n      // ...\n     B132: ireturn\n\n\
  // ....           上下文切换 B -> A\n\n      A76: ireturn\n```\n\n❶ 线程 `A` 获取了对象 `A`\
  \ 的锁\n\n❷ 线程 `B` 尝试获取对象 `A` 的锁：阻塞\n\n❸ 线程 `A` 获取了对象 `B` 的锁\n\n❹ 线程 `A` 释放了对象 `B`\
  \ 的锁\n\n❺ 线程 `A` 释放了对象 `A` 的锁：线程 `B` 可以恢复\n\n这毫无疑问是一个复杂的列表。关键的洞察是 `A0 == B1`，因此锁定这两个对象始终会导致第二个线程发生阻塞调用。`A\
  \ < B` 的不变性确保了线程 `B` 被发送到交替分支。\n\n### 5.5.7 volatile 访问\n\n`volatile` 在字节码中看起来是什么样的？让我们来看一个重要的模式——Volatile\
  \ Shutdown（波动关机），来帮助回答这个问题。\n\n我们在之前遇到危险且过时的 `stop()` 方法时提到过线程间通信问题，Volatile Shutdown\
  \ 模式可以帮助解决该问题。我们考虑一个负责执行某些工作的简单类。在简单的情况下，我们假设工作是以离散单元的形式输入的，并且每个单元都有定义良好的“完成”状态，如下所示：\n\
  \n```\npublic class TaskManager implements Runnable {\n    private volatile boolean\
  \ shutdown = false;\n\n    public void shutdown() {\n        shutdown = true;\n\
  \    }\n\n    @Override\n    public void run() {\n        while (!shutdown) {\n\
  \            // 执行某些工作 - 例如，处理一个工作单元\n        }\n    }\n}\n```\n\n该模式的意图应该是清晰的。只要\
  \ `shutdown` 标志为 `false`，工作单元就会继续被处理。如果它一旦变为 `true`，那么 `TaskManager` 在完成当前工作单元后，将退出\
  \ `while` 循环，线程将干净地退出，实现“优雅关机”。\n\n更微妙的点源于 Java 内存模型：对 volatile 变量的任何写操作发生在对该变量的所有后续读取之前（Happens-Before）。一旦另一个线程在\
  \ `TaskManager` 对象上调用 `shutdown()`，标志就会变为 `true`，并且该更改的效果保证在下一次读取标志时是可见的——在接受下一个工作单元之前。\n\
  \nVolatile Shutdown 模式产生的字节码如下所示：\n\n```\npublic class TaskManager implements java.lang.Runnable\
  \ {\n  private volatile boolean shutdown;\n\n  public TaskManager();\n    Code:\n\
  \       0: aload_0\n       1: invokespecial #1          // Method java/lang/Object.\"\
  <init>\":()V\n       4: aload_0\n       5: iconst_0\n       6: putfield      #2\
  \          // Field shutdown:Z\n       9: return\n\n  public void shutdown();\n\
  \    Code:\n       0: aload_0\n       1: iconst_1\n       2: putfield      #2  \
  \        // Field shutdown:Z\n       5: return\n\n  public void run();\n    Code:\n\
  \       0: aload_0\n       1: getfield      #2          // Field shutdown:Z\n  \
  \     4: ifne          10\n       7: goto          0\n      10: return\n}\n```\n\
  \n如果你仔细观察，你会发现 `shutdown` 的 volatile 特性除了字段定义之外没有出现在任何地方。操作码（opcodes）上没有额外的线索——而且它是使用标准的\
  \ `getfield` 和 `putfield` 操作码访问的。\n\n注意，`volatile` 是一种硬件访问模式，它产生一条 CPU 指令，指示忽略缓存硬件，而是直接从主内存读取或写入。\n\
  \n唯一的区别在于 `putfield` 和 `getfield` 的行为——字节码解释器的实现将为 volatile 字段和标准字段拥有单独的代码路径。\n\n\
  事实上，任何物理内存都可以以 volatile 方式访问，并且——正如我们稍后看到的，这并不是唯一的访问模式。volatile 案例仅仅是访问语义的一种常见情况，James\
  \ Gosling 和 Java 的原始设计者选择将其编码在语言的核心，通过使其成为可以应用于字段的关键字。\n\n并发是 Java 平台最重要的特性之一，一个优秀的开发者将越来越需要对它有坚实的理解。我们已经回顾了\
  \ Java 并发的底层原理以及多线程系统中发生的设计驱动力。我们讨论了 Java 内存模型以及平台实现并发的低级细节。\n\n这一章并不是为了对你关于并发可能需要的所有知识进行完整陈述——它足以让你入门，并让你对需要进一步学习的内容有一个良好的认识，同时防止你在编写并发代码时产生危险。但如果你想成为一个真正一流的多线程代码开发者，你需要了解比我们在这里涵盖的更多内容。市上有许多专门关于\
  \ Java 并发的优秀书籍。其中最好的之一是 Brian Goetz 等人写的《Java Concurrency Practice》（Addison-Wesley,\
  \ 2006）。\n\n## 总结\n\n*   Java 线程是一种低级抽象。\n*   多线程存在于字节码中。\n*   Java 内存模型非常灵活，但提供的保证很少。\n\
  *   同步是一种协作机制——所有线程必须参与才能确保安全。\n*   永远不要使用 `Thread.stop()` 或 `Thread.suspend()`。\n\
  \n## 6 JDK 并发库\n\n本章涵盖\n\n*   Atomic 类\n*   Locks 类\n*   并发数据结构\n*   BlockingQueue（阻塞队列）\n\
  *   Futures 和 CompletableFuture\n*   Executors\n\n在本章中，我们将涵盖每个良好的开发者都应该了解 `java.util.concurrent`\
  \ 以及如何使用它提供的并发构建工具箱。\n\n## 6.1 现代并发应用程序的构建块\n\n正如我们在上一章看到的，Java 从一开始就支持并发。然而，随着\
  \ Java 5 的出现（那是 15 年以前了），出现了一种新的 Java 并发思维方式。这是由 `java.util.concurrent` 包引领的，它包含了一个用于处理多线程的丰富新工具箱。\n\
  \n注意 该工具箱随 Java 更新得到了增强，但 Java 5 引入的类和包工作方式保持不变，并且对工作的开发者来说仍然非常有价值。\n\n\n\n\n我们将遍历\
  \ `java.util.concurrent` 中的一些核心类以及相关包，例如 `atomic` 和 `locks` 包。我们将带你开始使用这些类，并查看它们用例的示例。\n\
  \n你还应该阅读这些类的 Javadoc，并尝试建立起对整个包的熟悉程度。大多数开发者发现，这些包提供的更高层次的抽象使得并发编程变得简单得多。\n\n## 6.2\
  \ 原子类\n\n`java.util.concurrent.atomic` 包包含几个名称以 `Atomic` 开头的类，例如 `AtomicBoolean`、`AtomicInteger`、`AtomicLong`\
  \ 和 `AtomicReference`。这些类是`并发原语`（concurrency primitive）最简单的示例之一——一种可以用于构建可行、安全的并发应用程序的类。\n\
  \n警告 `Atomic` 类没有继承自同名的类，因此 `AtomicBoolean` 不能替代 `Boolean`，且 `AtomicInteger` 也不是\
  \ `Integer`（但它确实继承了 `Number`）。\n\n原子类的作用是提供线程安全的可变变量。这四个类中的每一个都提供了对相应类型单个变量的访问。\n\
  \n注意：原子操作的实现利用了现代处理器的特性，因此如果硬件和操作系统支持，它们可以是非阻塞（无锁）的，而几乎所有现代系统都支持这一点。\n\n提供的访问在几乎所有现代硬件上都是无锁的，因此原子类的行为与\
  \ `volatile` 字段类似。然而，它们被封装在一个类 API 中，其功能比 `volatile` 能够实现的更进一步。该 API 包含了适用于适当操作的原子（即全有全无）方法——包括依赖状态的更新（在不使用锁的情况下，`volatile`\
  \ 变量无法实现）。结果是，原子类可以是开发者避免共享数据竞态条件的一种非常简单的方法。\n\n注意：如果你对原子操作如何实现感兴趣，我们将在第 17 章讨论细节，届时我们会讨论内部原理和\
  \ `sun.misc.Unsafe` 类。\n\n原子类的一个常见用例是实现类似于序列号的功能，就像你在 SQL 数据库中找到的那样。这种能力通过使用 `AtomicInteger`\
  \ 或 `AtomicLong` 类上的原子 `getAndIncrement()` 方法来访问。让我们看看重写第 5 章中的 `Account` 示例来使用原子类：\n\
  \n```java\nprivate static AtomicInteger nextAccountId = new AtomicInteger(1);\n\n\
  \    private final int accountId;\n    private double balance;\n\n    public Account(int\
  \ openingBalance) {\n        balance = openingBalance;\n        accountId = nextAccountId.getAndIncrement();\n\
  \    }\n```\n\n当创建每个对象时，我们对 `AtomicInteger` 的静态实例调用 `getAndIncrement()`，它向我们返回一个\
  \ int 值并原子地递增可变变量。这种原子性保证了两个对象不可能共享同一个 `accountId`，这正是我们想要的属性（就像数据库序列号一样）。\n\n注意：我们可以为原子变量添加\
  \ `final` 修饰符，但没有必要，因为该字段是 `static` 的，且类没有提供任何修改该字段的方法。\n\n另一个示例，这里是我们如何重写 `volatile`\
  \ 停机示例来使用 `AtomicBoolean`：\n\n```java\npublic class TaskManager implements Runnable\
  \ {\n    private final AtomicBoolean shutdown = new AtomicBoolean(false);\n\n  \
  \  public void shutdown() {\n        shutdown.set(true);\n    }\n\n    @Override\n\
  \    public void run() {\n        while (!shutdown.get()) {\n            // 执行一些工作\
  \ - 例如处理一个工作单元\n        }\n    }\n}\n```\n\n除了这些示例外，`AtomicReference` 也用于实现对对象的原子更改。通用模式是乐观地构建某些被修改的（可能是不可变的）状态，然后通过对\
  \ `AtomicReference` 使用使用 `比较并交换`（CAS）操作将其“交换入”。\n\n接下来，让我们检查 `java.util.concurrent`\
  \ 如何建模经典同步方法的核心——`Lock` 接口。\n\n## 6.3 Lock 类\n\n块结构的同步方法基于对什么是锁的简单概念。这种方法有许多缺点，如下：\n\
  \n*   仅存在一种类型的锁。\n*   它同样适用于锁定对象上的所有同步操作。\n*   锁在同步块或方法的开始时获取。\n*   锁在块或方法结束时释放。\n\
  *   要么获取锁，要么线程无限阻塞——没有其他可能的结果。\n\n如果我们重新重新设计对锁的支持，我们可能从以下几个方面进行改进：\n\n*   添加不同类型的锁（例如读/写锁）。\n\
  *   不将锁限制在块中（允许在一个方法中锁定，在另一个方法中解锁）。\n*   如果线程无法获取锁（例如，如果另一个线程持有锁），允许线程退出或继续或做其他事情——`tryLock()`。\n\
  *   允许线程尝试获取锁并在一定时间后放弃。\n\n实现所有这些可能性的关键是 `java.util.concurrent.locks` 中的 `Lock`\
  \ 接口。该接口带有以下实现：\n\n*   `ReentrantLock`——这本质上等同于 Java synchronized 块中使用的熟悉的锁，但更灵活。\n\
  *   `ReentrantReadWriteLock`——在有很多读者但很少有写者的情况下，它可以提供更好的性能。\n\n注意：还存在其他实现，包括 JDK\
  \ 内部的以及第三方编写的实现，但它们目前是最常见的。\n\n`Lock` 接口可以完全复制块结构并发所提供的任何功能。例如，列表 6.1 显示了第 5 章中避免死锁的示例重写为使用\
  \ `ReentrantLock`。\n\n我们需要将一个锁对象作为字段添加到类中，因为我们不再依赖对象上的内在锁。我们还需要维护锁始终以相同顺序获取的原则。在我们的示例中，我们维护的简单协议是先获取账户\
  \ ID 最小对象的锁。\n\n列表 6.1 使用 `ReentrantLock` 重写死锁示例\n\n```java\nprivate final Lock\
  \ lock = new ReentrantLock();\n\n    public boolean transferTo(SafeAccount other,\
  \ int amount) {\n        // 我们也需要代码检查 amount > 0，如果不满足则抛异常\n        // ...\n\n \
  \       if (accountId == other.getAccountId()) {\n            // 无法向自己的账户转移\n  \
  \          return false;\n        }\n\n        var firstLock = accountId < other.getAccountId()\
  \ ?\n                lock : other.lock;\n        var secondLock = firstLock == lock\
  \ ? other.lock : lock;\n\n        firstLock.lock();             ❶\n        try {\n\
  \            secondLock.lock();        ❷\n            try {\n                if\
  \ (balance >= amount) {\n                    balance = balance - amount;\n     \
  \               other.deposit(amount);\n                    return true;\n     \
  \           }\n                return false;\n            } finally {\n        \
  \        secondLock.unlock();\n            }\n        } finally {\n            firstLock.unlock();\n\
  \        }\n    }\n```\n\n❶ `firstLock` 对象的账户 ID 较低。\n\n❷ `secondLock` 对象的账户 ID\
  \ 较高。\n\n初始调用 `lock()` 结合 `try ... finally` 块（在 `finally` 中释放锁）的模式，是你工具箱中的极佳补充。\n\
  \n注意：锁和 `java.util.concurrent` 的许多部分一样，依赖于名为 `AbstractQueuedSynchronizer` 的类来实现其功能。\n\
  \n\n\n\n\n如果你正在复制一个与你曾使用的块结构并发（block-structured concurrency）相似的场景，那么这种模式的效果会非常好。另一方面，如果你需要传递\
  \ `Lock` 对象（例如通过从方法返回它），则无法使用这种模式。\n\n### 6.3.1 Condition 对象\n\n`java.util.concurrent`\
  \ 提供的 API 另一个方面是条件对象（condition objects）。这些对象在 API 中扮演的角色与原始内式 API 中的 `wait()` 和\
  \ `notify()` 相同，但它们更加灵活。它们提供了让线程无限期等待某些条件、并在该条件变为真时被唤醒的能力。\n\n然而，与内式 API（对象监视器只有一个用于信号的单一条件）不同，`Lock`\
  \ 接口允许程序员根据需要创建任意数量的条件对象。这实现了关注点分离——例如，锁可以拥有多个互不相交的方法组，这些方法组可以使用不同的条件。\n\n条件对象（实现\
  \ `Condition` 接口）是通过通过在锁对象（实现 `Lock` 接口的实例）上的 `newCondition()` 方法创建的。除了条件对象外，API\
  \ 还提供了许多锁（latches）和栅障（barriers）作为并发原语，它们在某些情况下可能非常有用。\n\n### 6.4 CountDownLatch\n\
  \n`CountDownLatch` 是一种简单的并发原语，提供了一个共识栅障（consensus barrier）——它允许多个线程到达协调点并等待栅障释放。这是通过在构造新的\
  \ `CountDownLatch` 实例时提供一个 int 值（`count`）来实现的。此之后，使用两个方法来控制锁：`countDown()` 和 `await()`。前者将计数减\
  \ 1，后者导致调用线程阻塞，直到计数达到 0（如果计数已经是 0 或更小，则它什么都不做）。在接下来的列表中，每个 `Runnable` 都使用该锁来指示它何时完成了分配的任务。\n\
  \n列表 6.2 使用锁在线程之间传递信号\n\n```\n public static class Counter implements Runnable {\n\
  \        private final CountDownLatch latch;\n        private final int value;\n\
  \        private final AtomicInteger count;\n\n        public Counter(CountDownLatch\
  \ l, int v, AtomicInteger c) {\n            this.latch = l;\n            this.value\
  \ = v;\n            this.count = c;\n        }\n\n        @Override\n        public\
  \ void run() {\n            try {\n                Thread.sleep(100);\n        \
  \    } catch (InterruptedException e) {\n                Thread.currentThread().interrupt();\n\
  \            }\n            count.addAndGet(value);   ❶\n            latch.countDown();\
  \        ❷\n        }\n    }\n```\n\n❶ 原子性地更新计数值\n\n❷ 递减锁\n\n注意 `countDown()` 方法是非阻塞的，因此一旦锁被递减，运行\
  \ `Counter` 代码的线程就会退出。\n\n我们还需要一些驱动代码，如下所示（省略了异常）：\n\n```\nvar latch = new CountDownLatch(5);\n\
  var count = new AtomicInteger();\nfor (int i = 0; i < 5; i = i + 1) {\n    var r\
  \  = new Counter(latch, i, count);\n    new Thread(r).start();\n}\n\nlatch.await();\n\
  System.out.println(\"Total: \"+ count.get());\n```\n\n在代码中，锁被设置了一个法定值（在图 6.1 中，该值为\
  \ 2）。接下来，创建并初始化了相同数量的线程，以便开始处理。主线程等待锁并阻塞，直到它释放。每个工作线程将在完成后执行睡眠并调用一次 `countDown()`。在两个线程都完成处理之前，主线程不会继续执行。这种情况在图\
  \ 6.1 所示。\n\n![](img/CH06_F01_Evans2.png)\n\n图 6.1 使用 `CountDownLatch`\n\n为了提供 `CountDownLatch`\
  \ 良好用例的另一个示例，考虑一个在服务器准备好接收传入请求之前需要用引用数据填充多个缓存的应用程序。我们可以轻松通过使用共享锁来实现这一点，每个缓存填充线程都持有该锁的引用。\n\
  \n当每个缓存加载完成时，填充它的 `Runnable` 会递减锁并退出。当所有缓存都加载完成后，主线程（一直在等待锁打开）就可以继续执行，并准备标记服务为启动并开始处理请求。\n\
  \n我们将讨论的下一个类是多线程开发者工具箱中最用的类之一：`ConcurrentHashMap`。\n\n### 6.5 ConcurrentHashMap\n\
  \n`ConcurrentHashMap` 类提供了标准 `HashMap` 的并发版本。通常情况下，映射 是构建并发应用程序非常有用（且常见）的数据结构。这至少部分是因为底层数据结构的形状。让我们仔细查看基础的\
  \ `HashMap` 来理解为什么。\n\n### 6.5.1 理解简化的 HashMap\n\n如图 6.2 所示，经典的 Java `HashMap` 使用一个函数（哈希函数）来决定它将键值对存储在哪个桶中。这就是该类名称中“hash”（哈希）部分的来源。\n\
  \n![](img/CH06_F02_Evans2.png)\n\n图 6.2 `HashMap` 的经典视图\n\n键值对实际上存储在链表（称为哈希链）中，该链表从通过哈希键获取的索引对应的桶开始。\n\
  \n在随本书的 GitHub 项目中有一个 `Map<String, String>` 的简化实现——`Dictionary` 类。该类实际上基于 Java 7\
  \ 发布的 `HashMap` 形式。\n\n注意现代 Java 版本提供的 `HashMap` 实现要复杂得多，因此在解释中，我们关注设计概念更清晰的版本。\n\
  \n基础类只有两个字段：数据结构和 `size` 字段，后者为了性能缓存了映射的大小，如下所示：\n\n```\npublic class Dictionary\
  \ implements Map<String, String> {\n    private Node[] table = new Node[8];\n  \
  \  private int size;\n\n    @Override\n    public int size() {\n        return size;\n\
  \    }\n\n    @Override\n    public boolean isEmpty() {\n        return size ==\
  \ 0;\n    }\n```\n\n这些依赖于一个辅助类，称为 `Node`，它代表一个键值对并实现 `Map.Entry` 接口如下：\n\n```\n\
  \ static class Node implements Map.Entry<String,String> {\n        final int hash;\n\
  \        final String key;\n        String value;\n        Node next;\n\n      \
  \  Node(int hash, String key, String value, Node next) {\n            this.hash\
  \ = hash;\n            this.key = key;\n            this.value = value;\n      \
  \      this.next = next;\n        }\n\n        public final String getKey()    \
  \    { return key; }\n        public final String getValue()      { return value;\
  \ }\n        public final String toString() { return key + \"=\" + value; }\n\n\
  \        public final int hashCode() {\n            return Objects.hashCode(key)\
  \ ^ Objects.hashCode(value);\n        }\n\n        public final String setValue(String\
  \ newValue) {\n            String oldValue = value;\n            value = newValue;\n\
  \            return oldValue;\n        }\n\n        public final boolean equals(Object\
  \ o) {\n            if (o == this)\n                return true;\n            if\
  \ (o instanceof Node) {\n                Node e = (Node)o;\n                if (Objects.equals(key,\
  \ e.getKey()) &&\n                        Objects.equals(value, e.getValue()))\n\
  \                    return true;\n            }\n            return false;\n  \
  \      }\n    }\n```\n\n要在映射中查找值，我们使用 `get()` 方法，它依赖于两个辅助方法，`hash()` 和 `indexFor()`，如下：\n\
  \n\n\n\n\n```java\n @Override\n    public String get(Object key) {\n        if (key\
  \ == null)\n            return null;\n        int hash = hash(key);\n        for\
  \ (Node e = table[indexFor(hash, table.length)];\n             e != null;\n    \
  \         e = e.next) {\n            Object k = e.key;\n            if (e.hash ==\
  \ hash && (k == key || key.equals(k)))\n                return e.value;\n      \
  \  }\n        return null;\n    }\n\n    static final int hash(Object key) {\n \
  \       int h = key.hashCode();\n        return h ^ (h >>> 16);                ❶\n\
  \    }\n\n    static int indexFor(int h, int length) {\n        return h & (length\
  \ - 1);              ❷\n    }\n```\n\n❶ 一位运算，用于确保哈希值为正数\n\n❷ 一位运算，用于确保索引在表格的大小范围内\n\
  \n首先，`get()` 方法处理了讨厌的 `null` 情况。接下来，我们使用键对象的哈希码来构造进入数组 `table` 的索引。有一个隐含的假设是 `table`\
  \ 的大小是 2 的幂，因此 `indexFor()` 的操作基本上是一个取模操作，这确保了返回值是 `table` 的有效索引。\n\n注意：这是一个经典的例子，人类大脑可以判断永远不会抛出异常（在此例中为\
  \ `ArrayIndexOutOfBoundsException`），但编译器无法做到。\n\n现在我们已经有了进入 `table` 的索引，可以使用它为我们的查找操作选择相关的哈希链。我们从表头开始，沿着哈希链向下遍历。在每一步中，我们都会评估是否找到了键对象，如下所示：\n\
  \n```\n if (e.hash == hash && ((k = e.key) == key || key.equals(k)))\n        return\
  \ e.value;\n```\n\n如果找到了，我们就返回对应的值。我们将键和值作为对进行存储（实际上是 `Node` 实例），以便采用这种方法。\n\n`put()`\
  \ 方法与之前的代码有些相似之处：\n\n```java\n @Override\n    public String put(String key, String\
  \ value) {\n        if (key == null)\n            return null;\n\n        int hash\
  \ = hash(key.hashCode());\n        int i = indexFor(hash, table.length);\n     \
  \   for (Node e = table[i]; e != null; e = e.next) {\n            Object k = e.key;\n\
  \            if (e.hash == hash && (k == key || key.equals(k))) {\n            \
  \    String oldValue = e.value;\n                e.value = value;\n            \
  \    return oldValue;\n            }\n        }\n\n        Node e = table[i];\n\
  \        table[i] = new Node(hash, key, value, e);\n\n        return null;\n   \
  \ }\n```\n\n这个版本的哈希数据结构并不是 100% 的生产级质量，但它的目的是演示该问题的基本行为和方法，以便理解并发情况。\n\n### 6.5.2\
  \ Dictionary 的局限性\n\n在我们继续并发情况之前，我们应该提到 `Map` 中的某些方法并不由我们的玩具实现类 `Dictionary` 支持。具体来说，`putAll()`、`keySet()`、`values()`\
  \ 或 `entrySet()`（因为该类实现了 `Map`，这些需要定义）将直接抛出 `new UnsupportedOperationException()`。\n\
  \n我们不支持这些方法完全是因为复杂性。正如我们在书中多次看到的，Java 集合接口是庞大且功能丰富的。这对终端用户是好事，因为他们拥有很多权力，但这意味着实现者必须提供更多的方法。\n\
  \n特别是，像 `keySet()` 这样的方法要求 `Map` 的实现要提供 `Set` 实例，这经常导致需要编写整个整个 `Set` 接口的实现作为内部类。对于我们的示例来说，这额外复杂度太大了，所以我们只是在玩具实现中不支持了那些方法。\n\
  \n注意：正如我们以后在书中看到的，集合接口单体式的、复杂的、命令式的设计在我们开始详细考虑函数式编程时，会产生各种问题。\n\n简单的 `Dictionary`\
  \ 类在它的局限性内运行良好。然而，它没有防止以下两种情况：\n\n- 随着所存储元素数量的增加，需要调整 `table` 的大小\n- 防御实现了某种病态形式\
  \ `hashCode()` 的键\n\n其中第一个是一个严的局限性。哈希数据结构的一个主要大点是将预期的操作复杂度从 `O(N)` 降低到 `O(log N)`，例如对于值的检索。如果\
  \ map 中持有的元素数量增加时不调整表格大小，那么这种复杂度的提升就会消失。真实的实现必须处理随着 map 增长而需要调整表格的需求。\n\n### 6.5.3\
  \ 并发 Dictionary 的方法\n\n目前，`Dictionary` 显然不是线程安全的。考虑两个线程——一个试图删除某个键，另一个试图更新与该键关联的值。根据操作的顺序，完全可能删除和更新都报告成功，而实际上实际上只有其中一个成功了。为了解决这个问题，我们有两个相当显而易见的（尽管是简单的）方法来使\
  \ `Dictionary`（推此类推，通用的 Java `Map` 实现）并发。\n\n首先是全同步方法，我们在第 5 章中遇到过。结果并不难预测：由于性能开销，这种方法对于大多数实际系统来说是不可行的。不过，花一点点时间看看我们可能如何实现它是有值得的。\n\
  \n在这里，我们有两种简单的方法可以来实现简单的线程安全。第一种是复制 `Dictionary` 类——我们称之为 `ThreadSafeDictionary`，然后将它的所有方法都标记为\
  \ `synchronized`。这种方法行得通，但涉及大量重复的、剪切粘贴的代码。\n\n或者，我们可以使用同步包装器来提供委托——即转发——给一个实际上存放字典的底层对象。我们可以这样做：\n\
  \n```java\npublic final class SynchronizedDictionary extends Dictionary {\n    private\
  \ final Dictionary d;\n\n    private SynchronizedDictionary(Dictionary delegate)\
  \ {\n        d = delegate;\n    }\n\n    public static SynchronizedDictionary of(Dictionary\
  \ delegate) {\n        return new SynchronizedDictionary(delegate);\n    }\n\n \
  \   @Override\n    public synchronized int size() {\n        return d.size();\n\
  \    }\n\n    @Override\n    public synchronized boolean isEmpty() {\n        return\
  \ d.isEmpty();\n    }\n\n    // ... 其他方法\n\n}\n```\n\n这个示例有很多问题，最重要的一点是对象 `d` 已经存在且没有同步。这是在让我们陷入失败——其他代码可以在同步块或方法之外修改\
  \ `d`，我们又陷入了在上一章中讨论过的境地。这并不是并发数据结构的正确方法。\n\n我们应该提到，事实上 JDK 提供了这样一个实现——`Collections`\
  \ 类提供的 `synchronizedMap()` 方法。它的工作效果正如你预期的那样良好，使用也非常广泛。\n\n第二种方法是诉诸不可变性。正如我们所说，再次强调的，Java\
  \ 集合是大型且复杂的接口。可变性的假设通过各种方式渗透在集合中。某些实现选择或不选择表达可变性并不是一个可以分离的关注点——所有的 `Map` 和 `List`\
  \ 实现都必须实现变异方法。\n\n由于这种限制，看起来我们似乎没有办法在 Java 中建模一个既不可变又符合 Java 集合 API 的结构——如果符合 API，该类也必须提供变异方法的实现。然而，存在一个深度令人不满意的后门。接口的实现始终可以在未实现某个特定方法时抛出\
  \ `UnsupportedOperationException`。从语言设计的角度来看，这显然是糟糕的。\n\n\n\n\n遗憾的是，这种机制和约定早于 Java\
  \ `8`（以及默认方法的出现），因此它代表了在 Java 语言中尝试编码“强制性”方法与“可选”方法之间的差异，而当时 Java 语言中实际上并不存在这种区分。\n\
  \n这是一种糟糕的机制和做法（尤其是 `UnsupportedOperationException` 是一个运行时异常），但我们可以这样使用它：\n\n```java\n\
  public final class ImmutableDictionary extends Dictionary {\n    private final Dictionary\
  \ d;\n\n    private ImmutableDictionary(Dictionary delegate) {\n        d = delegate;\n\
  \    }\n\n    public static ImmutableDictionary of(Dictionary delegate) {\n    \
  \    return new ImmutableDictionary(delegate);\n    }\n\n    @Override\n    public\
  \ int size() {\n        return d.size();\n    }\n\n    @Override\n    public String\
  \ get(Object key) {\n        return d.get(key);\n    }\n\n    @Override\n    public\
  \ String put(String key, String value) {\n        throw new UnsupportedOperationException();\n\
  \    }\n\n    // 其他变异方法也会抛出 UnsupportedOperationException\n\n}\n```\n\n可以认为，这在某种程度上违反了面向对象的原则——用户的预期是它是\
  \ `Map<String, String>` 的有效实现，然而，如果用户尝试修改实例，就会抛出一个未检查的异常。这可以被合理地视为一种安全隐患。\n\n注意：这基本上是\
  \ `Map.of()` 必须做的妥协：它需要完全实现接口，因此必须在调用变异方法时抛出异常。\n\n这并不是这种方法的唯一问题。另一个缺点是，它当然会受到我们在同步案例中看到的相同基本缺陷的影响——一个可变对象仍然存在，并且可以通过该路径被引用（并修改），这违反了我们试图实现的的基本标准。让我们终结这些尝试，并尝试寻找更好的方案。\n\
  \n### 6.5.4 使用 ConcurrentHashMap\n\n在展示了一个简单的 map 实现并讨论了我们可以用来使其并发的方法后，现在是时候认识 `ConcurrentHashMap`\
  \ 了。在某些方面，这部分是容易的：它是一个非常易用的类，在大多数情况下，它是 `HashMap` 的无缝替换品。\n\n`ConcurrentHashMap`\
  \ 的关键点在于，多个线程同时更新它是安全的。为了理解为什么我们需要它，让我们看看两个线程同时向 `HashMap` 添加条目时会发生什么（省略了异常处理）：\n\
  \n```java\nvar map = new HashMap<String, String>();\nvar SIZE = 10_000;\n\nRunnable\
  \ r1 = () -> {\n    for (int i = 0; i < SIZE; i = i + 1) {\n        map.put(\"t1\"\
  \ + i, \"0\");\n    }\n    System.out.println(\"Thread 1 done\");\n};\nRunnable\
  \ r2 = () -> {\n    for (int i = 0; i < SIZE; i = i + 1) {\n        map.put(\"t2\"\
  \ + i, \"0\");\n    }\n    System.out.println(\"Thread 2 done\");\n};\nThread t1\
  \ = new Thread(r1);\nThread t2 = new Thread(r2);\nt1.start();\nt2.start();\n\nt1.join();\n\
  t2.join();\nSystem.out.println(\"Count: \"+ map.size());\n```\n\n如果我们运行这段代码，我们将看到我们的老朋友“丢失更新”（Lost\
  \ Update）反模式的另一种表现——`Count` 的输出值将小于 `2 * SIZE`。然而，在并发访问 map 的情况下，情况实际上要糟糕得多。\n\n\
  `HashMap` 在并发修改下最危险的行为并不总是会在规模较小时显现。但是，如果如果我们增加 `SIZE` 的值，它最终会表现出来。\n\n如果我们将 `SIZE`\
  \ 增加到例如 `1_000_000`，那么我们很可能会看到这种行为。正在对 `map` 进行更新的线程之一将无法完成执行。没错——其中一个线程可能会（并且将会）陷入一个真正的无限循环中。这使得\
  \ `HashMap` 在多线程应用中使用是完全不安全的（我们的示例类 `Dictionary` 也是如此）。\n\n另一方面，如果我们将 `HashMap`\
  \ 替换为 `ConcurrentHashMap`，那么我们可以看到并发版本的行为正常——没有无限循环，也没有丢失更新的情况。它还有一个很棒的属性，无论你对它做什么，map\
  \ 操作永远不会抛出 `ConcurrentModificationException`。\n\n让我们简要地看看这是如何实现的。事实证明，显示 `Dictionary`\
  \ 实现的图 6.2 也为实用的 `Map` 多线程泛化指明了方向，这比我们之前的两个尝试都要好得多。它基于以下见解：在进行更改时不需要锁定整个结构，只需要锁定正在被更改或读取的哈希链（即桶）。\n\
  \n我们可以在图 6.3 中看到它是如何工作的。实现将锁移动到了单个哈希链上。这种技术被称为“分段锁”（lock striping），它允许多个线程访问 map，只要它们操作的是不同的链。\n\
  \n![](img/CH06_F03_Evans2.png)\n\n图 6.3 分段锁\n\n当然，如果两个线程需要在同一条链上进行操作，那么它们仍然会互相排斥，但通常情况下，这比同步整个\
  \ map 提供了更高的吞吐量。\n\n注意：记住，随着 map 中元素数量的增加，桶表会调整大小，这意味着当更多的元素被添加到 `ConcurrentHashMap`\
  \ 时，它能够高效地处理更多线程。\n\n`ConcurrentHashMap` 实现了这种行为，但存在一些开发者通常不需要关注的底层细节。事实上，在 Java\
  \ `8` 中 `ConcurrentHashMap` 的实现发生了巨大变化，现在比我们这里描述的要复杂。\n\n使用 `ConcurrentHashMap`\
  \ 几乎太简单了。在许多情况下，如果你有一个 `Map` 可能被多个线程修改，那么请始终使用 `Map` 并让其实现为 `ConcurrentHashMap`。它确实比普通的\
  \ `HashMap` 使用更多资源，并且由于某些操作的同步会导致性能较差。然而，正如我们在第 7 章将讨论的，这些这些与竞态条件导致丢失更新或无限循环的可能性相比是不足道的。\n\
  \n最后，我们还应该注意到 `ConcurrentHashMap` 实际上实现了 `ConcurrentMap` 接口，该接口自 `Map`。它最初包含以下新方法以提供线程安全的修改：\n\
  \n*   `putIfAbsent()`——如果键不存在，则将键值对添加到 `HashMap` 中。\n\n*   `remove()`——如果键存在，则安全地移除键值对。\n\
  \n*   `replace()`——该实现提供了这种方法的两种形式，用于安全替换。\n\n然而，通过 Java `8`，这些方法中的一些作为默认方法重构到了\
  \ `Map` 接口，例如：\n\n```java\ndefault V putIfAbsent(K key, V value) {\n    V v = get(key);\n\
  \    if (v == null) {\n        v = put(key, value);\n    }\n\n    return v;\n}\n\
  ```\n\n\n\n当然，我们也可以将上一节中看到的两种令人不满意的并发模式应用于 `List`。编写完全同步且不可变（但带有会抛出运行时异常的变动方法）的列表与编写\
  \ map 一样简单，而且它们运行的效果并不比在 map 上时更好。\n\n我们能做得更好吗？遗憾的是，列表的线性本质在这里并没有帮助。即使在链表的情况下，多个线程尝试修改列表也会引发竞争的可能性，例如在包含大量比例添加操作的负载负载中。\n\
  \n确实存在另一种替代方案，即 `CopyOnWriteArrayList` 类。正如其名所示，这种类型是标准 `ArrayList` 类的替代者，通过添加**写时复制语义**（copy-on-write\
  \ semantics）实现了线程安全。这意味着任何修改列表的操作都会为支持列表的数组创建一个新副本（如图 6.4 所示）。这也意味着任何创建的迭代器都不必担心发生它们意料之外的任何修改。\n\
  \n![](img/CH06_F04_Evans2.png)\n\n图 6.4 写时复制数组\n\n迭代器保证不会抛出 `ConcurrentModificationException`，并且不会反映自迭代器创建以来对列表进行的任何添加、删除或更改——当然（正如\
  \ Java 的惯常做法），列表元素仍然可以发生变。只有列表本身不能变。\n\n这种实现对于通用用途通常太昂贵了，但当遍历操作远多于修改操作，且程序员不想处理同步带来的头恼，又想排除线程相互干扰的可能性时，它可能是一个很好的选择。\n\
  \n让我们快速看看核心思想是如何实现的。关键方法是 `iterator()`，它始终返回一个新的 `COWIterator` 对象：\n\n```\n public\
  \ Iterator<E> iterator() {\n        return new COWIterator<E>(getArray(), 0);\n\
  }\n```\n\n以及 `add()`、`remove()` 和其他变动方法。变动方法总是将委托数组替换为新的、克隆的且修改后的副本。对数组的保护必须在同步块内进行，因此\
  \ `CopyOnWriteArrayList` 类有一个内部锁仅用作监视器（注意其上的注释），如下所示：\n\n```\n /**\n     * 保护所有变动器的锁。（当两者可用时，\n\
  \     * 我们稍微倾向于使用内置监视器而不是 ReentrantLock。）\n     */\n    final transient Object lock\
  \ = new Object();\n\n    private transient volatile Object[] array;\n```\n\n然后，像\
  \ `add()` 等操作可以这样保护：\n\n```\n public boolean add(E e) {\n        synchronized (lock)\
  \ {\n            Object[] es = getArray();\n            int len = es.length;\n \
  \           es = Arrays.copyOf(es, len + 1);\n            es[len] = e;\n       \
  \     setArray(es);\n            return true;\n        }\n    }\n```\n\n由于以下几个原因，这使得\
  \ `CopyOnWriteArrayList` 在通用操作上的效率比 `ArrayList` 低：\n\n*   变动操作的同步。\n*   volatile\
  \ 存储（即 `array`）。\n*   `ArrayList` 仅在需要调整底层数组大时才会分配内存；而 `CopyOnWriteArrayList` 都会分配内存。\n\
  \n\n\n\n\n-   当尝试从队列中 `take()` 操作时，如果队列为空，会导致获取数据的线程阻塞。\n\n这两个属性非常有用，因为如果一个线程（或线程池）的速度超过了另一个线程的跟进能力，较快的线程将被强制等待，从而调节整个系统。这如图\
  \ 6.5 所示。\n\n![](img/CH06_F05_Evans2.png)\n\n图 6.5 `BlockingQueue`\n\nJava 提供了 `BlockingQueue`\
  \ 接口的两种基本实现：`LinkedBlockingQueue` 和 `ArrayBlockingQueue`。它们提供了略有不同的属性；例如，当已知队列大小的确切边界时，数组实现非常高效；而在某些情况下，链表实现可能会快一些。\n\
  \n然而，这些实现之间真正的区别在于隐含的语义。虽然链表变体可以带大小限制构造，但它通常在没有限制的情况下创建，这会导致创建一个队列大小为 `Integer.MAX_VALUE`\
  \ 的对象。这在实际上是无限的——实际应用程序永远无法从队列中超过两个亿个项目的积压中恢复过来。\n\n因此，尽管在理论上 `LinkedBlockingQueue`\
  \ 的 `put()` 方法可能会阻塞，但在实践中，它从不会阻塞。这意味着写入队列的线程实际上可以以无限的速度进行。\n\n相比之下，`ArrayBlockingQueue`\
  \ 的队列有一个固定的大小——即支持它的数组的大小。如果生产者线程将对象放入队列的速度快于接收者处理的速度，那么在某个点队列将完全充满，进一步尝试调用 `put()`\
  \ 将阻塞，生产者线程将被迫降低其任务生产速率。\n\n`ArrayBlockingQueue` 的这种属性是所谓的 `back pressure`（背压）的一种形式，这是并发和分布式系统工程中的一个重要方面。\n\
  \n让我们通过示例来看 `BlockingQueue` 的运行：修改账户示例以使用队列和线程。该示例旨在消除对两个账户对象锁定的需求。应用程序的基本架构如图 6.6\
  \ 所示。\n\n![](img/CH06_F06_Evans2.png)\n\n图 6.6 使用队列处理账户\n\n我们首先引入一个带有这些字段的 `AccountManager`\
  \ 类，如下一个列表所示。\n\n列表 6.4 `AccountManager` 类\n\n```\npublic class AccountManager {\n\
  \    private ConcurrentHashMap<Integer, Account> accounts =\n        new ConcurrentHashMap<>();\n\
  \    private volatile boolean shutdown = false;\n\n    private BlockingQueue<TransferTask>\
  \ pending =\n        new LinkedBlockingQueue<>();\n    private BlockingQueue<TransferTask>\
  \ forDeposit =\n        new LinkedBlockingQueue<>();\n    private BlockingQueue<TransferTask>\
  \ failed =\n        new LinkedBlockingQueue<>();\n\n    private Thread withdrawals;\n\
  \    private Thread deposits;\n```\n\n阻塞队列包含 `TransferTask` 对象，它们是简单的数据载体，用于表示要进行的传输，如下所示：\n\
  \n```\npublic class TransferTask {\n    private final Account sender;\n    private\
  \ final Account receiver;\n    private final int amount;\n\n    public TransferTask(Account\
  \ sender, Account receiver, int amount) {\n        this.sender = sender;\n     \
  \   this.receiver = receiver;\n        this.amount = amount;\n    }\n\n    public\
  \ Account sender() {\n        return sender;\n    }\n\n    public int amount() {\n\
  \        return amount;\n    }\n\n    public Account receiver() {\n        return\
  \ receiver;\n    }\n\n    // 其他方法省略\n}\n```\n\n传输本身没有额外的语义——该类只是一个简单的 `data carrier`（数据载体）类型。\n\
  \n注意 `TransferTask` 类型非常简单，在 Java 17 中，它可以写为 record 类型（我们在第 3 章中遇到过）。\n\n`AccountManager`\
  \ 类提供了创建账户和提交传输任务的功能，如下所示：\n\n```\n public Account createAccount(int balance) {\n\
  \        var out = new Account(balance);\n        accounts.put(out.getAccountId(),\
  \ out);\n        return out;\n    }\n\n    public void submit(TransferTask transfer)\
  \ {\n        if (shutdown) {\n            return false;\n        }\n        return\
  \ pending.add(transfer);\n    }\n```\n\n`AccountManager` 的实际工作由两个管理队列之间传输任务的线程处理。让我们先看取款操作：\n\
  \n```\n public void init() {\n        Runnable withdraw = () -> {\n            boolean\
  \ interrupted = false;\n            while (!interrupted || !pending.isEmpty()) {\n\
  \                try {\n                    var task = pending.take();\n       \
  \             var sender = task.sender();\n                    if (sender.withdraw(task.amount()))\
  \ {\n                        forDeposit.add(task);\n                    } else {\n\
  \                        failed.add(task);\n                    }\n            \
  \    } catch (InterruptedException e) {\n                    interrupted = true;\n\
  \                }\n            }\n            deposits.interrupt();\n        };\n\
  ```\n\n存款操作定义类似，然后我们用任务初始化账户管理器：\n\n```\n Runnable deposit = () -> {\n         \
  \   boolean interrupted = false;\n            while (!interrupted || !forDeposit.isEmpty())\
  \ {\n                try {\n                    var task = forDeposit.take();\n\
  \                    var receiver = task.receiver();\n                    receiver.deposit(task.amount());\n\
  \                } catch (InterruptedException e) {\n                    interrupted\
  \ = true;\n                }\n            }\n        };\n\n        init(withdraw,\
  \ deposit);\n    }\n```\n\n`init()` 方法的包私重载用于用于启动后台线程。它作为一个独立方法存在，如下：\n\n```\n void\
  \ init(Runnable withdraw, Runnable deposit) {\n        withdrawals = new Thread(withdraw);\n\
  \        deposits = new Thread(deposit);\n        withdrawals.start();\n       \
  \ deposits.start();\n    }\n```\n\n我们需要一些代码来驱动它：\n\n```\n var manager = new AccountManager();\n\
  \        manager.init();\n        var acc1 = manager.createAccount(1000);\n    \
  \    var acc2 = manager.createAccount(20000);\n\n        var transfer = new TransferTask(acc1,\
  \ acc2, 100);\n        manager.submit(transfer);                           ❶ 提交从\
  \ acc1 到 acc2 的传输\n        Thread.sleep(5000);                                 ❷\
  \ 休睡眠以便留出执行传输\n        System.out.println(acc1);\n        System.out.println(acc2);\n\
  \        manager.shutdown();\n        manager.await();\n```\n\n这产生的输出如下：\n\n```\n\
  Account{accountId=1, balance=900.0,\n    lock=java.util.concurrent.locks.ReentrantLock@58372a00[Unlocked]}\n\
  Account{accountId=2, balance=20100.0,\n    lock=java.util.concurrent.locks.ReentrantLock@4dd8dc3[Unlocked]}\n\
  ```\n\n然而，尽管调用了 `shutdown()` 和 `await()`，但由于所用调用的阻塞性质，编写的代码并没有干净地执行。让我们看看图 6.7 了解为什么。\n\
  \n![](img/CH06_F07_Evans2.png)\n\n图 6.7 错误的关闭序列\n\n当主代码调用 `shutdown()` 时，`volatile`\
  \ 布尔标志被翻转为 true，因此后续对该布尔值的读取都将看到值为 true。遗憾的是，取款和存款线程都阻塞在 `take()` 调用上，因为队列是空的。如果对象以某种方式被放入\
  \ `pending` 队列，那么取款线程将处理它，并将对象放入 `forDeposit` 队列（假设取款成功）。此时，取款线程将退出 `while` 循环，线程将正常终止。\n\
  \n\n\n\n反之，存款线程现在会看到 `forDeposit` 队列中的对象并唤醒，获取它，处理它，然后退出自己的 `while` 循环并正常终止。然而，这种整洁的终止过程取决于队列中仍然有任务。在队列为空的边缘情况下，线程将永远阻塞在它们的\
  \ `take()` 调用中。为了解决这个问题，让我们探索一下阻塞队列实现所提供的全方法。\n\n### 6.7.1 使用 BlockingQueue API\n\
  \n`BlockingQueue` 接口实际上提供了三种与之交互的独立策略。为了理解这些策略之间的区别，考虑 API 在以下场景中可能显示的行为：一个线程尝试向具有容量限制的队列插入一个项，而队列当前无法容纳该项（即队列已满）。\n\
  \n逻辑上，我们有以下三种可能性。插入调用可能会：\n\n* 阻塞直到队列空间释放\n* 返回一个值（可能是 `Boolean` false`）表示失败\n*\
  \ 抛出一个异常\n\n当然，这三种可能性也同样出现在相反的情况下（尝试从空队列中获取项）。这些可能性中的第一种通过我们已经见过的 `take()` 和 `put()`\
  \ 方法实现。\n\n注意：第二种和第三种是 `Queue` 接口提供的选项，它是 `BlockingQueue` 的父接口。\n\n第二种选项提供了一个非阻塞\
  \ API，返回特殊值，并体现在 `offer()` 和 `poll()` 方法中。如果无法完成向队列插入，`offer()` 将快速失败并返回 `false`。程序员必须检查返回代码并采取适当行动。\n\
  \n同样，`poll()` 在从队列检索失败时会立即返回 `null`。在一个显式命名为 `BlockingQueue` 的类上拥有非阻塞 API 似乎有点奇怪，但它实际上是有用的（而且也是由于\
  \ `BlockingQueue` 和 `Queue` 之间的继承关系要求的）。\n\n事实上，`BlockingQueue` 提供了非阻塞方法的额外重载。这些方法提供了带超时的轮询或提供的能力，允许遇到问题的线程从与队列的交互中退出，转而做其他事情。\n\
  \n我们可以修改列表 6.4 中的 `AccountManager` 以使用带超时的非阻塞 API，如下所示：\n\n```\n Runnable withdraw\
  \ = () -> {\n      LOOP:\n      while (!shutdown) {\n          try {\n         \
  \     var task = pending.poll(5,                 ❶\n                           \
  \           TimeUnit.SECONDS);\n              if (task == null) {\n            \
  \      continue LOOP;                         ❷\n              }\n             \
  \ var sender = task.sender();\n              if (sender.withdraw(task.amount()))\
  \ {\n                  forDeposit.put(task);\n              } else {\n         \
  \         failed.put(task);\n              }\n          } catch (InterruptedException\
  \ e) {\n              // Log at critical and proceed to next item\n          }\n\
  \      }\n      // Drain pending queue to failed or log\n  };\n```\n\n❶ 如果计时器过期，`poll()`\
  \ 返回 `null`。\n\n❷ 显式使用 Java 循环标签以明确正在继续执行的内容。\n\n存款线程也应该进行类似的修改。\n\n这解决了我们在上一个节中概述的关闭问题，因为现在线程无法在检索方法中无限阻塞。相反，如果在超时之前没有到达任何对象，`poll`\
  \ 仍然返回并提供值 `null`。测试随后继续循环，但 `volatile Boolean` 的可见性保证了 `while` 循环条件现在已满足，循环退出且线程整洁地关闭。这意味着总体而言，一旦调用了\
  \ `shutdown()` 方法，`AccountManager` 将在边界时间内关闭，这是我们想要的行为。\n\n在结束对 `BlockingQueue`\
  \ API 的讨论时，我们应该看看之前提到的第三种方法：如果队列操作无法立即完成则抛出异常的方法。这些方法 `add()` 和 `remove()` 坦率地说由于几个原因是有问题的，其中最重要的因素是它们在失败时抛出的异常（分别为\
  \ `IllegalStateException` 和 `NoSuchElementException`）是运行时异常，因此不需要显式处理。\n\n不过，抛出异常的\
  \ API 的问题深于此。Java 的通用原则规定，异常应用于处理异常情况，即程序通常不认为是正常操作一部分的情况。然而，队列为空是一种完全可能的情况。因此，针对这种情况抛出异常违反了有时被表为“不要使用异常进行流程控制”的原则。\n\
  \n通常情况下，使用异常是非常贵的，因为在实例化异常时需要构建堆栈轨迹，并且在抛出期间需要进行栈回溯。除非将立即抛出，否则不创建异常是良好的做法。出于这些原因，我们不建议使用抛出异常形式的\
  \ `BlockingQueue` API。\n\n### 6.7.2 使用 WorkUnit\n\n`Queue` 接口都是泛型的：它们是 `Queue<E>`、`BlockingQueue<E>`\
  \ 等。尽管这看起来很奇怪，但有时利用这一点并引入一个人工容器类来封装工作项将是明智的。\n\n例如，如果你有一个名为 `MyAwesomeClass` 的类，它代表你想在多线程应用程序中处理的工作单元，那么与其拥有这个：\n\
  \n```\nBlockingQueue<MyAwesomeClass>\n```\n\n不如拥有这个：\n\n```\nBlockingQueue<WorkUnit<MyAwesomeClass>>\n\
  ```\n\n其中 `WorkUnit`（或 `QueueObject`，或者你喜欢的任何容器类名称）是一个包装类，它看起来可能如下：\n\n```java\n\
  public class WorkUnit<T> {\n    private final T workUnit;\n\n    public T getWork()\
  \ {\n        return workUnit;\n    }\n\n    public WorkUnit(T workUnit) {\n    \
  \    this.workUnit = workUnit;\n    }\n\n    // ... 其他方法\n}\n```\n\n这样做的理由是为了提供了一个添加额外元数据的地方，而不影响包含类型的概念完整性（在本例中为\
  \ `MyAwesomeClass`）。在图 6.8 中，我们可以看到外部元数据封装器是如何工作的。\n\n![](img/CH06_F08_Evans2.png)\n\
  \n图 6.8 使用工作单元作为元数据封装\n\n这异常地有用。需要额外元数据的用例随处可见。这里是一些例子：\n\n* 测试（例如显示对象的更改历史）\n*\
  \ 性能指标（例如到达时间或服务质量）\n* 运行时系统信息（例如此 `MyAwesomeClass` 实例是如何路由的）\n\n事后添加这种间接要困难得多。如果你以后发现在某些情况下需要更多元数据，那么为了实现在\
  \ `WorkUnit` 类中简单的更改将是一项重大的重构工作。让我们继续讨论 Future，它是 Java 中表示异步任务占位符的方式。`java.util.concurrent`\
  \ 中的 `Future` 接口是异步任务的简单表示：它是一个持有可能尚未完成的任务的、、但在未来某个时刻可能产生结果的类型。`Future` 的主要方法如下：\n\
  \n* `get()`—获取结果。如果结果尚未可用，将阻塞直到结果可用。\n* `isDone()`—允许调用者确定计算是否已完成。它是非阻塞的。\n* `cancel()`—允许在完成前取消计算。\n\
  \n\n\n\n还有一个 `get()` 方法的版本接受一个超时时间，它不会永久阻塞，这与我们之前遇到的带有超时机制的 `BlockingQueue` 方法类似。接下来的列表展示了在质数查找器中\
  \ `Future` 的一个示例用法。\n\n### 列表 6.5 使用 `Future` 寻找质数\n\n```\nFuture<Long> fut = getNthPrime(1_000_000_000);\n\
  try {\n    long result = fut.get(1, TimeUnit.MINUTES);\n    System.out.println(\"\
  Found it: \" + result);\n} catch (TimeoutException tox) {\n    // 超时 - 直接取消任务\n\
  \    System.err.println(\"Task timed out, cancelling\");\n    fut.cancel(true);\n\
  } catch (InterruptedException e) {\n    fut.cancel(true);\n    throw e;\n} catch\
  \ (ExecutionException e) {\n    fut.cancel(true);\n    e.getCause().printStackTrace();\n\
  }\n```\n\n在这一段代码中，你应该想象 `getNthPrime()` 返回了一个在某个后台线程（甚至在多个线程上）执行的 `Future`——也许是在我们本节后面将讨论的执行器框架之一。\n\
  \n运行这段代码的线程进入了带超时的获取模式，并阻塞最多 60 秒以等待响应。如果没有收到响应，该线程将进行循环并进入另一个阻塞等待。即使在现代硬件上，这种计算也可能运行很长时间，因此你可能仍然需要使用\
  \ `cancel()` 方法（尽管代码代码本身没有提供任何取消我们请求的机制）。\n\n作为第二个例子，让我们考虑非阻塞 I/O。图 6.9 显示了 `Future`\
  \ 的实际应用，允许我们使用后台线程进行 I/O。\n\n![](img/CH06_F09_Evans2.png)\n\n### 图 6.9 在 Java 中使用\
  \ `Future`\n\n这个 API 已经存在了一段时间——它是在 Java 7 中引入的——它允许用户像所示进行非阻塞并发：\n\n```\ntry {\n\
  \    Path file = Paths.get(\"/Users/karianna/foobar.txt\");\n\n    var channel =\
  \ AsynchronousFileChannel.open(file);        ❶\n\n    var buffer = ByteBuffer.allocate(1_000_000);\
  \             ❷\n    Future<Integer> result = channel.read(buffer, 0);        ❷\n\
  \n    BusinessProcess.doSomethingElse();                       ❸\n\n    var bytesRead\
  \ = result.get();                            ❹\n    System.out.println(\"Bytes read\
  \ [\" + bytesRead + \"]\");\n} catch (IOException | ExecutionException | InterruptedException\
  \ e) {\n    e.printStackTrace();\n}\n```\n\n❶ 异步打开文件\n❷ 请求读取多达一百万字节\n❸ 执行其他事情\n\
  ❹ 当结果准备就绪时获取结果\n\n这种结构允许主线程在 I/O 操作在另一个线程（由 Java 运行时管理的线程）上进行时执行 `doSomethingElse()`。这是一个非常有用的方法，但它需要提供该功能的库提供支持。这可能会有一定的局限性——如果我们想创建自己的异步工作流该呢？\n\
  \n### 6.8.1 CompletableFuture\n\nJava 的 `Future` 类型被定义为一个接口，而不是一个具体的类。任何想要使用基于 `Future`\
  \ 风格的 API 都必须提供 `Future` 的具体实现。\n\n对于某些开发者来说，编写这些实现可能具有挑战性，代表了工具包中的明显空白，因此从 Java\
  \ 8 开始，JDK 中包含了一种新的处理 future 的方法——一个 `Future` 的具体实现，它增强了功能，并在某些方面与其它语言（例如 Kotlin\
  \ 和 Scala）中的 future 更相似。\n\n该类被称为 `CompletableFuture`——它是一个实现了 `Future` 接口的具体类型，并提供了额外的功能，旨在作为构建异步应用程序的简单构建模块。核心思想是我们可以创建\
  \ `CompletableFuture<T>` 类型的实例（它对将返回的数值类型是泛型的），并且创建的对象代表了处于*未完成*（或“未履行”）状态的 `Future`。\n\
  \n稍后，任何持有该可完成 `Future` 引用的线程都可以对其调用 `complete()` 方法并提供一个值——这就完成（或“履行”了）该 future。完成的值将立即对所有阻塞在\
  \ `get()` 调用上的线程可见。在完成之后，任何进一步的 `complete()` 调用都将被忽略。\n\n`CompletableFuture` 不会导致不同线程看到不同的值。`Future`\
  \ 要么是未完成，要么是已完成，如果它已完成，它所持的值是由第一个调用 `complete()` 的线程提供的值。\n\n这显然不是不可变性——`CompletableFuture`\
  \ 的状态确实随时间改变。然而，它只改变*一次*——从未完成变为已完成。不存在不同线程看到不一致状态的可能性。\n\n注意 Java 的 `CompletableFuture`\
  \ 类似于在其他语言（如 JavaScript）中看到的 *promise*（承诺），这就是为什么我们也会提到“履行承诺”（fulfilling a promise）以及“完成\
  \ future”（completing a future）这些术语。\n\n让我们看一个示例并实现之前提到的 `getNthPrime()`：\n\n```\n\
  public static Future<Long> getNthPrime(int n) {\n    var numF = new CompletableFuture<Long>();\
  \     ❶\n\n    new Thread( () -> {                           ❷\n        long num\
  \ = NumberService.findPrime(n);    ❸\n        numF.complete(num);\n    } ).start();\n\
  \n    return numF;\n}\n```\n\n❶ 创建处于未完成状态的可完成 Future\n❷ 创建并启动一个新线程来完成 Future\n❸\
  \ 质数的实际计算\n\n`getNthPrime()` 方法创建一个未完成状态的可完成 `Future`，并将此对象返回给调用者。为了驱动这一点，我们需要列表\
  \ 6.5 中的代码。\n\n理解 `CompletableFuture` 的一种方式是类比客户端/服务器系统。`Future` 接口只提供了查询方法——`isDone()`\
  \ 和阻塞的 `get()`。这扮演了客户端的角色。`CompletableFuture` 的实例扮演了服务器的角色——它对履行 future 代码提供了完全控制。\n\
  \n在示例中，`getNthPrime()` 在单独的线程中评估对服务的调用。当此调用返回时，我们完成了 future。\n\n另一种稍微简洁的方法是使用 `CompletableFuture.supplyAsync()`\
  \ 方法，传递一个表示要执行任务的 `Callable<T>` 对象。此调用使用了由库管理的应用程序范围线程池，如下：\n\n```\npublic static\
  \ Future<Long> getNthPrime(int n) {\n    return CompletableFuture.supplyAsync(\n\
  \        () -> NumberService.findPrime(n));\n}\n```\n\n这结束了对并发数据结构的探索是开发稳健多线程应用程序的主要原材料。\n\
  \n注意 我们将在书的后面部分更多讨论 `CompletableFuture`，特别是在讨论高级并发以及函数式编程交互的章节。\n\n接下来，我们将引入执行器（executors）和线程池，它们提供了一种比基于\
  \ `Thread` 的原始 API 更高级、更方便的执行处理方式。\n\n\n\n\n在这种情况下，我们的直接目标是拥有可以执行的任务（或工作单元），而无需为每个任务都启动一个新线程。根结底，这意味着任务必须被建模为可以调用的代码，而不是直接表示为线程。\n\
  \n然后，这些任务可以调度到一个共享资源上——一个线程池——该线程池执行一个任务直到完成，然后处理下一个任务。让我们来看看是如何对这些任务建模的。\n\n##\
  \ 6.9.1 任务建模\n\n在本节中，我们将介绍两种不同的任务建模方式：`Callable` 接口和 `FutureTask` 类。我们也可以考虑 `Runnable`，但它并不总是那么有用，因为\
  \ `run()` 方法没有返回值，因此，它只能通过副作用来执行工作。\n\n任务建模的另一个方面虽然重要，但可能并不显而易见——即这种观点：如果我们假设线程容量是有限的，那么任务必须在有界时间内完成。\n\
  \n如果我们存在无限循环的可能性，某些任务可能会从池中“偷走”一个执行器线程，这将从那时起减少所有任务的总体容量。随着时间的推移，这最终可能导致线程池资源耗尽，并无法进行任何后续工作。因此，我们必须小心确保构建的任何任务确实符合“在有限时间内终止”的原则。\n\
  \n### Callable 接口\n\n`Callable` 接口表示了一种非常常见的抽象。它代表一段可以被调用并返回结果的代码。尽管这个想法很简单，但它实际上是一个微妙且强大的概念，可以导致一些非常有用的模式。\n\
  \n`Callable` 的一个典型用法是 lambda 表达式（或匿名实现）。此代码段的最后一行将 `s` 设置为 `out.toString()` 的值：\n\
  \n```\nvar out = getSampleObject();\nCallable<String> cb = () -> out.toString();\n\
  \nString s = cb.call();\n```\n\n将 `Callable` 视为对单个方法 `call()` 的延迟调用，该方法由 lambda\
  \ 提供。\n\n### FutureTask 类\n\n`FutureTask` 类是 `Future` 接口的常用实现之一，它也实现了 `Runnable`。正如我们将看到的，这意味着\
  \ `FutureTask` 可以被传递给执行器。`FutureTask` 的 API 基本上是 `Future` 和 `Runnable` 的结合：`get()`、`cancel()`、`isDone()`、`isCancelled()`\
  \ 和 `run()`，尽管最后一个——即执行实际工作的那个——将由执行器调用，而不是由客户端代码直接调用。\n\n`FutureTask` 两个便利构造函数：一个接受\
  \ `Callable`，另一个接受 `Runnable`（它使用 `Executors.callable()` 将 `Runnable` 转换为 `Callable`）。这表明任务处理的方法非常灵活，允许将作业写为\
  \ `Callable`，然后封装成 `FutureTask`，由于由于 `FutureTask` 的 `Runnable` 特性，可以在执行器上对其调度（并在必要时取消）。\n\
  \n该类为任务提供了一个简单的状态模型，并通过该模型对任务进行管理。可能的状态转换如图 6.10 所示。\n\n![](img/CH06_F10_Evans2.png)\n\
  \n图 6.10 任务的状态模型\n\n这对于大量的普通执行可能性已经足够了。让我们来看看 JDK 提供的标准执行器。\n\n## 6.9.2 Executors\n\
  \n使用了几个标准接口来描述 JDK 中存在的线程池。第一个是 `Executor`，它非常简单，定义如下：\n\n```\npublic interface\
  \ Executor {\n\n    /**\n     * 在未来的某个时刻执行指定的命令。该命令\n     * 可以在新线程中执行、在池线程中执行或在调用线程中执行，\n\
  \     * 取决于 {@code Executor} 实现的。\n     *\n     * @param command 可运行的任务\n     *\
  \ @throws RejectedExecutionException 如果此任务无法被接受执行则抛出此异常\n     * @throws NullPointerException\
  \ 如果 command 为空则抛出此异常\n     */\n    void execute(Runnable command);\n}\n```\n\n\
  你应该注意，尽管这个接口只有一个抽象方法（即它是一个所谓的 SAM 类型），但它**并没有**标记 `@FunctionalInterface` 注解。它仍然可以作为\
  \ lambda 表达式的目标类型，但它并不是用于函数式编程。\n\n事实上，`Executor` 并不广泛使用——常见的是 `ExecutorService`\
  \ 接口，它扩展了 `Executor` 并添加了 `submit()` 以及几个*生命周期*方法，如 `shutdown()`。\n\n为了帮助开发者实例化和使用一些标准线程池，JDK\
  \ 提供了 `Executors` 类，它是静态辅助方法的集合（大部分是工厂方法）。以下是四个最常用的方法：\n\n```\nnewSingleThreadExecutor()\n\
  newFixedThreadPool(int nThreads)\nnewCachedThreadPool()\nnewScheduledThreadPool(int\
  \ corePoolSize)\n```\n\n让我们逐一查看这些方法。在书的后面部分，我们将深入探讨提供的其他一些更复杂的可能性。\n\n## 6.9.3 单线程执行器\n\
  \n执行器中最简单的是单线程执行器。这本质上是单个线程和任务队列（一个阻塞队列）的封装组合。\n\n客户端代码通过 `submit()` 将可执行任务放入队列中。单执行线程随后会一个接一个地获取任务，并在运行每个任务直到完成之前，不会获取下一个任务。\n\
  \n注意：执行器并没有实现为不同的类型，而是代表了构建线程池时不同的参数选择。\n\n在执行线程忙碌时提交的任何任务将排队，直到线程可用。由于此执行器由单个线程支持，如果违反了前面提到的“有限时间内终止”条件，意味着后续的作业永远不会运行。\n\
  \n注意：这种版本的执行器通常对测试很有用，因为它可以更具确定性。\n\n这是一个使用单线程执行器的非常简单的示例：\n\n```\nvar pool = Executors.newSingleThreadExecutor();\n\
  Runnable hello = () -> System.out.println(\"Hello world\"); pool.submit(hello);\n\
  ```\n\n`submit()` 调用通过将可运行任务置于执行器的任务队列中来移交任务。该任务提交是非阻塞的（除非任务队列已满）。\n\n然而，仍然必须小心——例如，如果主线程立即退出，提交的任务可能还没有来得及被池线程收集并运行。与其直接退出，不如先调用执行器的\
  \ `shutdown()` 方法是明智的。\n\n细节可以在 `ThreadPoolExecutor` 类中找到，但基本上该方法启动了一个*有序关闭*，其中之前提交的任务将执行执行，但不再接受新任务。这有效地解决了我们在列表\
  \ 6.4 中看到的清空等待队列的问题。\n\n注意：无限循环任务与有序关闭请求的组合将产生糟糕交互，导致线程池永远不会关闭。\n\n当然，如果只需要单线程执行器，那么就不需要深入理解并发编程及其挑战了。因此，我们应该查看利用多个执行器线程的替代方案。\n\
  \n## 6.9.4 固定线程池\n\n固定线程池通过 `Executors.newFixedThreadPool()` 的一个变体获得，它本质上是单线程执行器的多线程泛化。在创建时，用户提供显式的线程数量，池将创建相应数量的线程。\n\
  \n这些线程将被复用以运行多个任务，一个接一个。这种设计防止了用户承担线程创建的成本。与单线程变体一样，当所有线程都在被使用时，新任务将存储在阻塞队列中，直到线程空闲。\n\
  \n\n\n这种版本的线程池在任务流稳定且已知的，并且所有提交的任务在计算持续时间上大致相同时，特别有用。它再次最容易通过适当的工厂方法来创建，如下所示：\n\n\
  ```\nvar pool = Executors.newFixedThreadPool(2);\n```\n\n这将创建一个由两个执行器线程支持的显式线程池。这两个线程将以非确定的方式轮流从队列中接收任务。即使任务的提交具有严格的时间（基于时间）顺序，也无法保证哪个线程将处理特定的任务。\n\
  \n这的一个结果是，在如图 6.11 所示的情况下，即使上游队列中的任务是按时间排序的，下游队列中的任务也无法保证是准确的时间顺序排序。\n\n![](img/CH06_F11_Evans2.png)\n\
  \n图 6.11 线程池和两个队列\n\n固定线程池有其用途，但它并不是唯一的选择。首先，如果其中的执行器线程挂了，它们不会被替换。如果提交的任务存在抛出运行时异常的可能性，这会导致线程池饥饿。让我们看看另一种替代方案，它虽然有不同的权衡，但可以避免这种可能性。\n\
  \n### 6.9.5 缓存线程池\n\n当负载的活动模式已知且相当稳定时，通常使用固定线程池。然而，如果输入的工作更加不均匀或具有突发性，那么具有固定线程数量的池可能是次优的。\n\
  \n`CachedThreadPool` 是一个无界池，如果线程可用它将重用它们，否则将根据需要创建新线程来处理入入的任务，如下所示：\n\n```\nvar\
  \ pool = Executors.newCachedThreadPool();\n```\n\n线程会在空闲缓存中保留 60 秒，如果在该时期结束时它们仍然存在，它们将从缓存中移除并销毁。\n\
  \n当然，任务实际上终止仍然非常重要。如果不是，线程池将随着时间的推移创建越来越多的线程，消耗越来越多的机器资源，并最终崩溃或变得无响应。\n\n通常来说，固定大小线程池和缓存线程池之间的权衡在很大程度上关于重用线程与创建和销毁线程以实现不同的效果。`CachedThreadPool`\
  \ 的设计在处理小型异步任务时，应该比从固定大小池实现的性能更好。然而，一如既往，如果认为效果是显著的，则必须进行适当的性能测试。\n\n### 6.9.6 定时线程执行器\n\
  \n我们将看到的最后一个执行器示例有点不同。这是 `ScheduledThreadPoolExecutor`，有时被称为 STPE，如下所示：\n\n```\n\
  ScheduledExecutorService pool = Executors.newScheduledThreadPool(4);\n```\n\n注意返回类型（我们在这里明确指出了它）是\
  \ `ScheduledExecutorService`。这与返回 `ExecutorService` 的其他工厂方法不同。\n\n注意 `ScheduledThreadPoolExecutor`\
  \ 是一个出人意料的强大的执行器选择，可以适用于各种情况。\n\n定时服务扩展了通常的执行器服务并增加了一少量新功能：`schedule()`，它在指定的延迟后运行一个一次性任务，以及两个用于调度周期性任务（即重复任务）的方法——`scheduleAtFixedRate()`\
  \ 和 `scheduleWithFixedDelay()`。\n\n这两个方法的行为略有不同。`scheduleAtFixedRate()` 会按照固定的时间表激活任务的一个新副本（无论之前的副本是否已完成，它都会执行此操作），而\
  \ `scheduleWithFixedDelay()` 则只有在在上一个实例完成并经过了指定的延迟后，才会激活任务的一个新副本。\n\n除了 `ScheduledThreadPoolExecutor`\
  \ 之外，我们遇到的所有其他池都是通过对非常通用的 `Thread-PoolExecutor` 类选择稍微不同的参数而获得的。例如，让我们看看 `Executors.newFixedThreadPool()`\
  \ 的以下定义：\n\n```\n public static ExecutorService newFixedThreadPool(int nThreads)\
  \ {\n        return new ThreadPoolExecutor(nThreads, nThreads,\n               \
  \                       0L, TimeUnit.MILLISECONDS,\n                           \
  \           new LinkedBlockingQueue<Runnable>());\n    }\n```\n\n这正是这些辅助方法的目的：提供一种方便的方法来访问线程池的一些标准选择，而无需处理\
  \ `ThreadPoolExecutor` 的完整复杂性。除了 JDK 之外，许多其他 `Executors.newFixedThreadPool()` 的示例。\n\
  \n## 总结\n\n*   `FixedThreadPool`\n*   `CachedThreadPool`\n*   `ScheduledThreadPoolExecutor`\n\
  *   `ExecutorService`\n*   `ScheduledExecutorService`\n*   `Thread-PoolExecutor`\n\
  *   `ThreadPoolExecutor`\n*   `Atomic integers`\n*   `ConcurrentHashMap`\n*   `Blocking\
  \ queues`\n*   `synchronized`\n*   `locks`\n*   `LinkedBlockingQueue`\n\n# 7 理解\
  \ Java 性能\n\n本章涵盖了\n\n*   为什么性能很重要\n*   G1 垃圾回收器\n*   即时编译 (JIT)\n*   JFR—JDK 飞行员记录器\n\
  \n糟糕的性能会杀死应用程序——这对你的客户是有利的。除非你拥有完全垄断的市场，否则你的客户会用脚投票——他们会直接走掉。为了防止糟糕的性能损害你的项目，你需要理解性能分析以及如何让它为你工作。\n\
  \n性能分析和调优是一个巨大的课题，太多的处理方法关注了错误的地方。因此，我们将首先告诉你性能调优的大秘密。这就是：*必须测量。没有测量，你就无法进行适当的调优。*\n\
  \n这是因为：在猜测系统的哪些部分缓慢时，人类大脑几乎总是错的。每个人都是如此。你的、我的、James Gosling 的——我们都受潜意识偏差的影响，并倾向于看到可能并不存在的模式。事实上，“我的\
  \ Java 代码中哪部分需要优化？”这个问题的答案往往是“哪部分都不需要”。\n\n考虑一个典型的（尽管相当保守）电子商务 Web 应用程序，它为一组注册客户提供服务。它有一个\
  \ SQL 数据库、位于 Java 服务面前的 Web 服务器，以及一个连接所有内容的相当标准的网络配置。通常情况下，系统的非 Java 部分（数据库、文件系统、网络）是真正的瓶颈，但如果没有测量，Java\
  \ 开发者永远不会知道。开发者可能没有发现并修复真实问题，而是浪费时间在对问题没有贡献的代码层面的微优化上。\n\n你希望能够回答的根本性问题是这些：\n\n\
  *   如果你有一个销售驱动，并且突然增加了 10 倍客户，系统会有足够的内存来应对吗？\n*   你的客户从你的应用程序看到的平均响应时间是多少？\n*  \
  \ 这与你的竞争对手相比如何？\n\n注意，所有这些示例问题都是关于与你的客户——系统用户直接相关的系统方面。这里没有关于此类主题的话题\n\n*   Lambda\
  \ 和流比 `for` 循环快吗？\n*   普通方法（虚方法）比接口方法快吗？\n\n\n\n\n# `hashcode()` 的最快实现是什么？\n\n缺乏经验的性能工程师往往会犯一个错误，假设用户可见的性能强依赖于，或与第二组问题所涉及的微性能方面密切相关。\n\
  \n这种假设——本质上是一种还原论的观点——在实践中实际上并不成立。相反，现代软件系统的复杂性使得整体性能成为系统及其所有层的一种*涌现*属性。特定的微影响几乎不可能被隔离，而微基准测试（microbenchmarking）对大多数应用程序程序员来说用处非常有限。\n\
  \n相反，要进行性能调优，你必须跳出猜测导致系统变慢的领域——而*慢*意味着“影响了客户的体验”。你必须开始去认知，而唯一能够确定之的方法就是进行测量。\n\n\
  你还需要理解性能调优*不是*什么。它不是以下内容：\n\n*   技巧和窍门的集合\n*   秘制配方\n*   项目结束时撒上的仙女粉末\n\n要格外小心“技巧和窍门”的方法。事实是，`JVM`\
  \ 是一个非常复杂且经过高度调优的环境，在没有适当上下文的情况下，这些技巧大多数都是没用的（实际上可能有害的）。随着 `JVM` 在优化代码方面变得越来越聪明，这些技巧也会很快过时。\n\
  \n性能分析实际上是一种实验科学。你可以将你的代码视为一种科学实验，它有输入并产生“输出”——性能指标，指示了系统执行所要求工作的效率。性能工程师的工作是研究这些输出并寻找模式。这使得性能调优成为应用统计学的一个分支，而不是老太婆的传言和应用民间传说的集合。\n\
  \n本章的目的是帮助你起步。它是对 Java 性能调优实践的介绍。但这是一个大课题，我们的空间仅够为你提供一些基本理论的入门介绍和一些路标。我们将尝试回答以下几个最根本的问题：\n\
  \n*   为什么性能很重要？\n*   为什么性能分析很困难？\n*   `JVM` 的哪些方面使其调优可能具有复杂性？\n*   应该如何构思和处理性能调优？\n\
  *   导致变慢的最常见根本原因是什么？\n\n我们还将向你介绍 `JVM` 中的以下两个子系统，它们在涉及性能相关问题时是最重要的：\n\n*   垃圾收集子系统\n\
  *   `JIT` 编译器\n\n这些应该足够让你开始，并帮助你将这些（诚然理论性很大）知识应用到代码中面临的现实问题。让我们通过快速查看一些基础词汇开始，这将使你能够描述和构建你的性能问题和目标。\n\
  \n## 7.1 性能术语：一些基本定义\n\n为了从本章的讨论中获得最大的收益，我们需要将你可能熟悉的某些性能概念形式化。我们将首先定义性能工程师词汇中的一些重要术语：\n\
  \n*   延迟 (Latency)\n*   吞吐量 (Throughput)\n*   利用率 (Utilization)\n*   效率 (Efficiency)\n\
  *   容量 (Capacity)\n*   可扩展性 (Scalability)\n*   退化 (Degradation)\n\n`Doug Lea` 在多线程代码的范围内讨论了其中术语，但我们在这里考虑的是更广泛的背景。当我们谈论性能时，可能指的是从单个多线程进程到托管在云端的整个服务集群的任何内容。\n\
  \n### 7.1.1 延迟\n\n*延迟*是在给定工作负载下处理单个工作单元所需的端到端时间。通常，延迟仅针对“正常”工作负载给出，但一个非常有用的性能衡量标准是显示延迟随工作负载增加而变化的图表。\n\
  \n图 7.1 中的图显示了随着工作负载的增加，性能指标（例如延迟）出现突然的非线性退化。这通常被称为性能拐点（或“曲棍球形”）。\n\n![](img/CH07_F01_Evans2.png)\n\
  \n图 7.1 性能拐点\n\n### 7.1.2 吞吐量\n\n*吞吐量*是系统在给定资源下、某段时间内可以执行的工作单元数量。一个常用的引用的数字是某些参考平台上的每秒交易数（例如具有特定硬件、操作系统和软件栈的特定品牌服务器）。\n\
  \n### 7.1.3 利用率\n\n*利用率*代表用于处理工作单元的可用资源百分比，而不是用于管理任务（或仅仅处于空置状态）。人们通常会引用服务器的利用率为（例如）\
  \ 10%。这指的是在正常处理期间 CPU 处理工作单元的百分比。注意，不同资源（如 CPU 和内存）之间的利用率差异可能非常大。\n\n### 7.1.4 效率\n\
  \n系统的*效率*等于吞吐量除以所使用的资源。需要更多资源来产生相同吞吐量的系统效率较低。\n\n例如，考虑比较两个集群解决方案。如果方案 A 在产生相同吞吐量时需要比方案\
  \ B 多倍的服务器，那么它的效率只有一半。\n\n记住，资源也可以从成本的角度考虑——如果方案 A 的成本是方案 B 的两倍（或需要两倍的人员运行生产环境），那么它的效率只有一半。\n\
  \n### 7.1.5 容量\n\n*容量*是任何时候在系统中同时运行的工作单元（如交易）的数量。也就是说，它是在指定延迟或吞吐量下可用的并行处理量。\n\n\
  ### 7.1.6 可扩展性\n\n随着向系统添加资源，吐量（或延迟）会发生变化。吞吐量或延迟的变化就是系统的*可扩展性*。\n\n如果池中可用服务器翻倍时，方案\
  \ A 的吞吐量也翻倍，那么它是以完美的线性方式扩展的。在大多数情况下，完美的线性扩展是非常困难的——记住阿姆达尔定律。\n\n你还应该注意，系统的可扩展性取决于许多因素，它不是恒定的。系统在某一点之前可以接近线性扩展，然后开始严重退化。这是另一种性能拐点。\n\
  \n### 7.1.7 退化\n\n如果你向网络系统中添加更多工作单元（或客户端）而不增加资源，你通常会看到观测到的延迟或吞吐量变化。这就是系统在额外负载下的*退化*。\n\
  \n\n\n\n\n许多开发者在面对性能分析任务时，往往并没有对通过分析想要实现的目标有一个清晰的认识。当工作开始时，开发者或经理通常只拥有一种代码“本应该运行得更快”的模糊感觉。\n\
  \n但这种做法完全是本末倒置的。要进行真正有效的性能调优，在开始任何技术工作之前，你应该先考虑一些关键领域。你应该了解以下内容：\n\n* 你正在测量代码的哪些可观测侧面\n\
  * 如何测量这些可观测指标\n* 这些可观测指标的目标是什么\n* 你将如何判断性能调优何时已完成\n* 性能调优的最大接受成本是什么（就投入投入的时间和代码额外复杂性而言）\n\
  * 在优化过程中，哪些内容是不能牺牲的\n\n最重要的是，正如我们在本章中反复提到的，你`必须`进行测量。如果没有对至少一个可观测指标进行测量，你就不是在进行性能分析。\n\
  \n当你开始测量代码时，一种常见的情况是：你会发现时间并没有花费在你所认为的地方。缺失的数据库索引或竞争的文件系统锁可能是许多性能问题的根源。在考虑优化代码时，你应该始终记住，代码本身可能并不是问题所在。为了量化问题所在，你首先需要知道你正在测量什么。\n\
  \n### 7.2.1 清楚你正在测量什么\n\n在性能调优中，你必须始终测量某些东西。如果你没有测量可观测指标，你就没有在进行性能调优。坐在那里盯着代码希望更快的解决问题的方法突然灵现而出，这并不是性能分析。\n\
  \n提示：要成为一名优秀的性能工程师，你应该理解诸如`平均值、中位数、众数、方差、百分位数、标准差、样本量`和`正态分布`等术语。如果你不熟悉这些概念，应该从快速网络搜索开始，并在需要时进行阅读。Leonard\
  \ Apeltsin 的《Data Science Bookcamp》（Manning, 2021.[`mng.bz/e7Oq`](http://mng.bz/e7Oq)）第\
  \ 5 章是一个很好的起点。\n\n在进行性能分析时，确切知道我们在上一节中描述的可观测指标中哪些对你来说是重要的。你应该始终将测量结果、目标和结论与我们介绍的一个或多个基础可观测指标联系起来。以下是一些适合作为性能调优目标的典型可观测指标：\n\
  \n* `handleRequest()` 方法运行（预热后）的平均时间\n* 在 10 个并发客户端下系统端到端延迟的第 90 百分位数\n* 当并发用户从\
  \ 1 增加到 1,000 个时，响应时间的退化情况\n\n所有这些都代表了工程师可能想要测量并可能进行调优的量。为了获得准确且的数字，统计学基础知识至关重要。\n\
  \n清楚你在测量什么并对你的数字准确性有信心是第一步。但模糊或开放的目标通常不会产生良好的结果，性能调优也不例外。相反，你的性能目标应该是所谓的 SMART 目标（即`具体的、可衡量的、达成一致的、相关的以及有时间限制的`）。\n\
  \n### 7.2.2 清楚如何进行测量\n\n我们只有只有两种方法可以精确确定一个方法或其他 Java 代码运行需要多长时间：\n\n* 直接测量：通过在源类中插入测量代码。\n\
  * 转换类：在类加载时对被测量的类进行转换。\n\n这两种方法分别称为`manual`（手动）和`automatic`（自动）插桩。所有常用的性能测量技术都将依赖于这两种技术中的一种（或两种）。\n\
  \n注意：还存在 JVM 工具接口 (`JVMTI`)，它可以用于创建非常复杂的性能工具，但它有缺点，特别是它要求使用原生代码，这会影响使用它编写的工具的复杂性和。\n\
  \n#### 直接测量\n\n直接测量是最容易理解的技术，但它具有侵入性。在最形式的形式，它如下：\n\n```\nlong t0 = System.currentTimeMillis();\n\
  methodToBeMeasured();\nlong t1 = System.currentTimeMillis();\n\nlong elapsed = t1\
  \ - t0;\nSystem.out.println(\"methodToBeMeasured took \"+ elapsed +\" millis\");\n\
  ```\n\n这将产生一行输出，提供一个毫秒级的视图，显示 `methodToBeMeasured()` 运行了多久。不方便的地方在于，这种代码必须添加到整个代码库中，随着测量次数的增加，很难避免被数据淹没。\n\
  \n还有其他问题——例如，如果 `methodToBeMeasured()`运行时间小于一毫秒会怎样？正如我们在本章稍后看到的，还有冷启动效应需要担心：JIT\
  \ 编译意味着该方法的后续运行可能比早期的运行更快。\n\n还有更微妙的问题：调用 `currentTimeMillis()` 需要调用原生方法并进行系统调用以读取系统时。这不仅耗时，还会清空执行流水线中的代码，导致在没有测量代码的情况下不会发生的额外性能退化。\n\
  \n#### 通过类加载进行自动插桩\n\n在第 1 章和第 4 章中，我们讨论了类是如何被组装成执行程序的。经常被忽视的关键步骤之一是在加载时对字节码进行转换。这是非常强大的功能，它是\
  \ Java 平台许多现代技术的核心。\n\n它的一个例子是方法的自动插桩。在这种方法中，`methodToBeMeasured()` 由特殊的类加载器加载，加载器在方法的开始和结束处添加字节码以记录进入和退出方法的时间。这些时间通常被写入共享数据结构，由其他线程访问。这些线程对数据进行操作，通常是将输出写入日志文件或连接到处理数据的服务器。\n\
  \n这种技术是许多专业级 Java 性能监控工具（如 New Relic）的核心，但活跃维护的开源工具一直稀缺。随着 OpenTelemetry OSS 库和标准及其\
  \ Java 自动插桩子项目的出现，这种情况现在可能会发生变化。\n\n注意：正如我们稍后讨论的，Java 方法从解释模式开始，然后切换到编译模式。对于真实的性能数据，你必须丢弃在解释模式下产生的时间，因为它们会严重偏差结果。稍后我们将更详细地讨论如何知道方法何时切换到编译模式。\n\
  \n使用其中一种或两种技术将允许你产生关于给定方法执行速度的数字。下一个问题是，当你完成调优后，你希望数字变成什么样？\n\n### 7.2.3 清楚你的性能目标是什么\n\
  \n明确的目标最能集中注意力，因此，清楚测量什么同样重要的是清楚并传达调优的目标。在大多数情况下，这应该是一个简单且表述精确的目标，例如：\n\n* 在 10\
  \ 个并发用户下，将第 90 百分位的端到端延迟降低 20%\n* 将 `handleRequest()` 的平均延迟降低 40%\n\n在更复杂的情况下，目标可能是同时达到多个相关的性能目标。你应该意识到，测量和尝试调优的独立观测指标越多，性能练习就变得越复杂。优化一个性能目标可能会另一个目标产生负面影响。\n\
  \n\n\n\n有时候，在设定目标（例如让程序运行得更快）之前，必须进行一些初始分析，例如确定哪些是重要的方法。这没有问题，但在初步探索之后，几乎总是在尝试实现目标之前先停下来并明确你的目标会更好。开发者往往会埋头苦干进行分析，而不会停下来阐明他们的目标。\n\
  \n## 7.2.4 适适时停止\n\n在理论上，知道何时该停止优化很容易的——当你实现了目标时，你就完成了。然而，在实践中，很容易陷入性能调优的泥潭。如果进展顺利，继续推力并争取做得更好的诱惑力可能非常大。相反，如果你正为实现目标而挣扎，就很难忍制住尝试不同的策略以试图命中目标。\n\
  \n知道何时停止不仅需要对目标有意识，还需要对这些目标的价值有所感悟。通常达到性能目标的 90% 往往就足够了，工程师的时间花在其他地方可能会花得更有价值。\n\
  \n另一个重要的考虑因素是在很少使用的代码路径上花费了多少精力。优化占程序运行时间 1% 或更少的代码几乎总是浪费时间，然而，数量令人惊讶的开发者会从事这种行为。\n\
  \n这里有一组关于知道优化什么的非常简单准则。你可能需要根据具体情况对这些进行调整，但它们在许多情况下都运行良好：\n\n*   优化重要的，而不是易于优化的。\n\
  *   首先处理最重要的（通常是调用频率最高的）方法。\n*   随手解决触手可及的果实（容易解决的问题），但要注意其所代表的代码被调用的频率。\n\n最后，再进行一次测量。如果你还没有达到性能目标，请总结一下。看看你离这些目标还有多远，以及你所获得的收益是否对整体性能产生了预期的影响。\n\
  \n## 7.2.5 知晓获得更高性能的代价\n\n所有的性能微调都标有价格，例如：\n\n*   有进行分析和开发改进所需的时间（要记住，开发者的时间成本几乎是任何软件项目中最大的开支）。\n\
  *   该修复程序可能引入了额外的技术复杂性。（有些性能改进也会简化代码，但它们并不是大多数情况。）\n*   可能引入了额外的线程来执行辅助任务，以便主处理线程运行得更快，而这些线程在高负载下可能会对整个系统产生不可预见的影响。\n\
  \n无论价格如何，都要关注它，并尝试在完成一轮优化之前识别出它。\n\n对获得更高性能的最大可接受代价有一个大致的想法通常会有帮助。这可以设定为执行调优的开发者的时间限制，或者设定为额外的类或代码行数。例如，开发者可以决定优化花费的时间不应超过一周，或者优化后的类增长不应超过\
  \ 100%（其原始大小的两倍）。\n\n## 7.2.6 知晓过早优化的危险\n\n关于优化的最著名的引言之一来自唐纳德·高纳（Donald Knuth）（《Structured\
  \ Programming with go to Statements》，*Computing Surveys*, 6, no. 4 [December 1974]）：\n\
  \n```\nProgrammers waste enormous amounts of time thinking about, or worrying about,\
  \ the speed of noncritical parts of their programs, and these attempts at efficiency\
  \ actually have a strong negative impact ... premature optimization is the root\
  \ of all evil.\n```\n\n这段话在社区中引起了广泛讨论，在很多情况下，人们只记得后半部分。这出于几个原因来说是遗憾的：\n\n*   在引言的第一部分，高纳隐含地提醒了我们测量的必要性，否则我们无法确定程序的关键部分。\n\
  *   我们需要再次记住，导致延迟的可能不是代码——它可能是环境中的其他东西。\n*   在完整的引言中，很容易看出高纳说的是一种通过意识的、协同努力而形成的优化。\n\
  *   引言的简短形式导致它被用作对糟糕设计或执行选择的廉价借口。\n\n某些优化，特别是以下这些，确实是良好风格的一部分：\n\n*   不要分配你不需要的对象。\n\
  *   如果你永远不需要某个调试日志消息，就将其移除。\n\n在接下来的代码段中，我们添加了一个检查，查看日志对象是否会对调试日志消息进行任何操作。这种检查被称为*日志记录保护检查*（loggability\
  \ guard）。如果日志子系统没有配置调试日志，这段代码将永远不会构建日志消息，从而节省调用 `currentTimeMillis()` 和构建用于日志消息的\
  \ `StringBuilder` 对象的代价：\n\n```\nif (log.isDebugEnabled()) {\n  log.debug(\"Useless\
  \ log at: \"+ System.currentTimeMillis());\n}\n```\n\n但如果调试日志消息确实没用，我们可以通过删除代码来节省几个处理器周期（日志记录保护的代价）。这种代价是微不足道的，会消失在其他性能剖析的噪音中，但如果确实不需要，就把它删掉。\n\
  \n性能调优的一个方面是首先写出良好的、高性能的代码。获得对平台及其在底层如何运行的更好的认知（例如，理解两个字符串拼接产生的隐式对象分配），并在编写过程中思考性能的方面。\n\
  \n## 7.3 出了什么问题？我们为什么必须关心？\n\n在 21 世纪中期之前的许多美好岁月里，性能并不是一个真正的问题。主频率不断提高，似乎软件工程师只需要等待几个月，改进的\
  \ CPU 速度就会给编写糟糕的代码带来提升。\n\n那么，情况到底出了什么问题？为什么主频率不再提高了？更令人担忧的是，配备 3 GHz 芯片的电脑似乎并不比\
  \ 2 GHz 的电脑快多少？整个行业软件工程师关注性能的这一趋势从何而来？\n\n在这一节中，我们将讨论推动这一趋势的力量，以及为什么即使是最纯粹的软件开发者也需要关注硬件。我们将为本章的其他主题奠定基础，并提供真正理解\
  \ JIT 编译以及我们一些深度示例所需的概念。\n\n### 7.3.1 摩尔定律\n\n摩尔定律是以英特尔创始人之一戈登·摩尔命名的。他的定律最常见的公式之一：*芯片上经济生产的最大晶体管数量大约每两年翻一倍。*\n\
  \n该定律实际上是对计算机处理器（CPU）趋势的观察，基于他在 1965 年写的一篇论文，他最初预测了 10 年——即直到 1975 年。它能持续如此之久确实令人惊叹。\n\
  \n\n\n\n\n在图 7.2 中，我们绘制了来自不同系列（主要是 `Intel x86` 系列）的跨越从 1980 年到最新的（2021 年）Apple Silicon\
  \ 的多个真实 CPU（图表数据源自 Wikipedia，为了清晰起见经过微调）。该图显示了晶体管数量与发布日期之间的关系。\n\n![](img/CH07_F02_Evans2.png)\n\
  \n图 7.2 晶体管数量随时间的对数线性图\n\n这是一个对数线性图，因此 `y`轴上的每次增量都是前一次的 10 倍。如你所见，直线基本上是直的，大约需要六或七年跨越每个垂直层级。这证明了摩尔定律，因为花费六或七年增加十倍等同于大约每两年翻一倍。\n\
  \n请记住，图中的 `y`轴是对数刻度——这意味着 2005 年生产的主流 `Intel` 芯片大约有 1 亿个晶体管。这是 1990 年生产芯片的 `100\
  \ 倍`。\n\n重要的是，摩尔定律特指晶体管数量。这是必须理解的基本点，以便帮助我们理解为什么仅凭摩尔定律不足以让软件工程师继续从硬件工程师那里获得“免费午餐”（参见\
  \ Herb Sutter, “The Free Lunch Is Over: A Fundamental Turn Toward Concurrency in\
  \ Software,” 发表于 `Dr. Dobb’s Journal` 30 (2005): 202–210）。\n\n摩尔定律在过去是一个很好的指南，但它是根据晶体管数量定义的，这对于开发者应该从其代码中预期的性能并不是一个很好的指南。正如我们将看到的，现实情况更为复杂。\n\
  \n**注意**：晶体管数量不等同于时钟频率，即使是更高时钟频率意味着更好的性能这种仍然常见的观点也是极大的过度简化。\n\n事实是，现实世界的性能取决于许多因素，所有这些因素都非常重要。然而，如果我们必须只选一个，那将是：与后续指令相关的数据能定位得有多快？这一概念对性能如此重要，以至于我们应该对其进行深入研究。\n\
  \n### 7.3.2 理解内存延迟层次结构\n\n计算机处理器需要数据来工作。如果无法获取要处理的数据，那么无论 CPU 周期有多快都没用——它必须等待，执行无操作（`NOP`）并基本上处于停顿状态，直到数据可用。\n\
  \n这意味着在处理延迟时，两个最根本的问题是：“CPU 核心工作所需的数据的最近副本在哪里？”以及“到达核心可以使用它的地方需要多长时间？”主要的可能性如下（在最常用的所谓`冯·诺依曼架构`中）：\n\
  \n*   `Registers`（寄存器）——位于 CPU 上并准备好立即使用的内存位置。这是指令直接操作的内存部分。\n*   `Main memory`（主内存）——通常是\
  \ `DRAM`。其访问时间约为 50 ns（有关如何使用处理器缓存避免这种延迟的细节，请见后文）。\n*   `Solid-state drive (SSD)`（固态硬盘）——访问这些磁盘需要\
  \ 0.1 ms 或更短，但与传统硬盘相比通常更贵。\n*   `Hard disk`（硬盘）——访问磁盘需要大约 5 ms 将所需数据加载到主内存。\n\n\
  摩尔定律描述了晶体管数量的指数级增长，内存也从中受益——内存访问速度也呈指数级增长。但这两者的指数并不相同。内存速度的提高比 CPU 增加晶体管的速度慢，这意味着处理核心可能会因为没有可用的相关数据进行处理而处于空闲状态。\n\
  \n为了解决这个问题，引入了缓存——一小部分快速内存（`SRAM`，而非 `DRAM`）——位于寄存器和主内存之间。缓存被称为 `L1` 和 `L2`（某些机器还有\
  \ `L3`），这取决于它们离核心有多近。我们将在 7.6 节中更多地讨论缓存，以及 `L1` 和 `L2` 对运行代码有多重要。\n\n![](img/CH07_F03_Evans.png)\n\
  \n图 7.3 寄存器、处理器缓存和主内存的访问时间（以时钟周期为单位）\n\n除了添加缓存，90 年代和 21 年代初使用的另一种技术是增加日益复杂的处理器特性以尝试绕内存延迟。复杂的硬件技术，如指令级并行\
  \ `ILP`）和同步多线程 `CMT`，被用来尝试保持 CPU 处理数据。\n\n这些技术占据了 CPU 晶体管预算的大部分，而且它们对实际性能的影响遵循递减收益。这一趋势导致了这种观点：CPU\
  \ 设计的未来在于多核心（或许多核心）芯片。现代处理器基本上都是多核心的——事实上，这是摩尔定律的二阶后果之一：核心数量不断增加。\n\n### 7.4 为什么\
  \ Java 性能调优如此困难？\n\n在 `JVM`（或者说，任何其他托管运行时）上进行性能调优，本质上比运行未托管的代码困难。在托管系统中，整个要点是允许运行时接管部分环境，这样开发者就不需要处理每个细节。这在很大程度上提高了程序员的生产力，但也意味着必须放弃一些控制。\n\
  \n这种重点的转移使得整个系统更难理解，因为托管运行时对开发者来说是一个黑盒。替代方案是放弃托管运行时带来的所有优势，迫使例如 `C/C++` 程序员几乎自己完成一切。在这种情况下，操作系统仅提供最少的服务，例如基础的线程调度，这通常比性能调优所需的额外投入要高得多。\n\
  \nJava 平台导致调优困难的某些重要方面如下：\n\n这些方面可能会以微妙的方式相互作用。例如，编译子系统使用计时器来决定编译哪些方法。作为编译候选的方法集受到调度和\
  \ `GC` 等关注因素的影响。编译的方法在每次运行之间可能不同。\n\n\n\n\n正如你在本节中所看到的，准确的测量是性能分析决策过程的关键。因此，如果你想认真对待性能调优，那么理解\
  \ Java 平台处理时间的细节（以及局限性）将是非常有用的。\n\n### 7.4.1 时间在性能调优中的作用\n\n性能调优要求你理解如何解释代码执行期间记录的测量结果，这意味着你还需要理解平台对任何时间测量中固有的局限性。\n\
  \n#### 精度 (Precision)\n\n时间量通常被引用为某个刻度上最近的单位。这被称为测量的 `precision`。例如，时间通常是以毫秒级精度进行测量的。如果重复测量得到的数值在相同值附近呈现出窄的分布，则该计时是精确的。\n\
  \n`precision` 是给定测量中包含的随机噪声量的度。我们假设对某段代码的测量服从正态分布。在这种情况下，引用 `precision` 的常用方法是引用\
  \ 95% 置信间的宽度。\n\n#### 准确性 (Accuracy)\n\n测量（在本例中是时间）的 `accuracy` 是获得接近真实值的能力。在现实中，你通常不知道真实值，因此确定\
  \ `accuracy` 可能比确定 `precision` 更困难。\n\n`accuracy` 衡量测量中的系统误差。可能存在准确但不十分精确的测量（因此基础读数是正确的，但存在随机环境噪声）。也可能存在精确但不准确的结果。\n\
  \n#### 理解测量结果\n\n一个以纳秒精度引用为 `5945 ns` 的间隔，如果它来自一个精度为 `1 *μs` 的计时器，那么它实际上位于 `3945–7945\
  \ ns` 之间（概率为 95%）。注意那些看似过于精确的性能数字；始终务必检查测量的 `precision` 和 `accuracy`。\n\n#### 粒度\
  \ (Granularity)\n\n系统的真实 `granularity` 是最快计时器的频率——可能是中断计时器，在 10 ns 范围内。这有时被称为 `distinguishability`（区分度），即两个事件可以明确说是发生在“非常接近但时间不同”的最短间隔。\n\
  \n随着我们深入操作系统、JVM 和库代码的层级，这些极短时间的解析度变得基本上是不可能的。在大多数情况下，应用程序开发者无法获得这些非常短的时间。\n\n####\
  \ 网络分布式计时\n\n我们对性能调优的大部分讨论集中在所有处理都在单机上进行的系统上。但你应该意识到，在对跨越网络的系统进行性能调优时，可能会出现许多特殊问题。网络上的同步和计时远非易事，不仅是在互联网上——即使是以太网网络也会出现这些问题。\n\
  \n关于网络分布式时的样的讨论超出了本书的范围，但你应该意识到，通常情况下，对于跨越多个节点的工作流获取准确的计时是很的。此外，即使是如 `NTP` 等标准协议对于高精度工作来说也太不准确了。\n\
  \n让我们回顾一下关于 Java 计时系统最重要的几点：\n\n*   大多数系统内部有几个不同的时钟。\n*   毫秒计时是安全可靠的。\n*   高精度的时间需要仔细处理以避免漂移。\n\
  *   你需要意识到计时测量的 `precision` 和 `accuracy`。\n\n在继续讨论垃圾收集之前，让我们看看之前提到过的一个示例——内存缓存对代码性能的影响。\n\
  \n### 7.4.2 理解缓存缺失\n\n对于许多高吞吐量的代码，降低性能的主要因素之一是执行应用程序代码时涉及的 L1 缓存缺失数量。列表 7.1 遍历一个\
  \ 2 MiB 的数组，并打印执行两个循环之一所需的时间。第一个循环在 `int[]` 的每 16 个条目中增加 `1`。几乎每个 64 字节都在一个 L1 缓存行中（Java\
  \ 的 `int` 宽度为 4 字节），这意味着只需接触每个缓存行一次。\n\n注意，在获得准确结果之前，我们需要对代码进行热身，以便 JVM 编译你感兴趣的方法。我们将在章节的稍后部分详细讨论\
  \ JIT 热身。\n\n#### 列表 7.1 理解缓存缺失\n\n```\npublic class Caching {\n    private final\
  \ int ARR_SIZE = 2 * 1024 * 1024;\n    private final int[] testData = new int[ARR_SIZE];\n\
  \n    private void touchEveryItem() {\n        for (int i = 0; i < testData.length;\
  \ i = i + 1) {\n            testData[i] = testData[i] + 1;                    ❶\n\
  \        }\n    }\n\n    private void touchEveryLine() {\n        for (int i = 0;\
  \ i < testData.length; i = i + 16) {\n            testData[i] = testData[i] + 1;\
  \                    ❷\n        }\n    }\n\n    private void run() {\n        for\
  \ (int i = 0; i < 10_000; i = i + 1) {              ❸\n            touchEveryLine();\n\
  \            touchEveryItem();\n        }\n        System.out.println(\"Line   \
  \  Item\");\n        for (int i = 0; i < 100; i = i + 1) {\n            long t0\
  \ = System.nanoTime();\n            touchEveryLine();\n            long t1 = System.nanoTime();\n\
  \            touchEveryItem();\n            long t2 = System.nanoTime();\n     \
  \       long el1 = t1 - t0;\n            long el2 = t2 - t1;\n            System.out.println(\"\
  Line: \"+ el1 +\" ns ; Item: \"+ el2);\n        }\n    }\n\n    public static void\
  \ main(String[] args) {\n        Caching c = new Caching();\n        c.run();\n\
  \    }\n}\n```\n❶ 接触每个项目\n❷ 接触每一行\n❸ 热身代码\n\n第二个函数 `touchEveryItem()` 增加了数组中的每个字节，因此它的工作量是\
  \ `touchEveryLine()` 的 16 倍。但这里是典型笔记本的一些示例结果：\n\n```\nLine: 487481 ns ; Item: 452421\n\
  Line: 425039 ns ; Item: 428397\nLine: 415447 ns ; Item: 395332\nLine: 372815 ns\
  \ ; Item: 397519\nLine: 366305 ns ; Item: 375376\nLine: 332249 ns ; Item: 330512\n\
  ```\n\n代码的结果显示，`touchEveryItem()` 的运行时间并不是 `touchEveryLine()` 的 16 倍。内存传输时间（从主内存到\
  \ CPU 缓存）主导了整体性能特征。\n\n注意 这说明了一个关键点：我们需要对 CPU 如何花费时间建立至少基本的工作理解（或心理模型）。\n\n我们的下一个话题是关于平台垃圾收集子系统的讨论。这是性能图中最最重要的部分之一，它具有可以调优的部分，对于进行性能分析的开发者来说非常重要。\n\
  \n### 7.5 垃圾收集\n\n自动内存管理是 Java 平台最重要的部分之一。在像 Java 和 .NET 托管平台出现之前，开发者可以预计职业生涯中会有相当比例的时间用来寻找由于内存处理不当导致的错误。\n\
  \n然而，近年来，自动分配技术已经变得非常先进且可靠，以至于已经成为了环境的一部分——大量的 Java 开发者不知道平台的内存管理功能是如何工作的，开发者拥有哪些选项，以及如何在框架的限制内进行优化。\n\
  \n\n\n那么，当你处于需要进行某些调优的情况时，可以做什么呢？首先，你需要了解 `JVM` 实际上是如何为你管理内存的。因此，在本节中，我们将涵盖基础理论，包括：\n\
  \n* 运行中的 Java 进程如何处理内存\n* 标记-清除（mark-and-sweep）收集的基础知识\n* Garbage First (G1) 收集器，自\
  \ `Java 9` 以来它一直是 Java 的默认收集器\n\n让我们从基础开始。\n\n## 7.5.1 基础\n\n标准的 Java 进程同时拥有 `stack`（栈）和\
  \ `heap`（堆）。`stack` 是存储局部变量的地方。直接持有基本类型的局部变量将基本类型值存储在 `stack` 中。\n\n注意，基本类型持有位模式，这些将根据其类型进行解释，因此两个字节\
  \ `00000000 01100001` 如果类型为 `char` 将会被解释为 `a`，如果类型为 `short` 则会被解释为 97。\n\n另一方面，引用类型的局部变量将指向\
  \ Java `heap` 中的某个位置，那里才是实际创建对象的地方。图 7.4 显示了各种类型变量存储的位置。\n\n![](img/CH07_F04_Evans2.png)\n\
  \n图 7.4 栈和堆中的变量\n\n注意，对象的原始字段仍然分配在 `heap` 内的地址上。随着 Java 程序的运行，新对象会在 `heap` 中创建，对象之间的关系发生变化（随着字段的更新）。最终，`heap`\
  \ 将没有空间创建新对象。然而，已创建的许多对象将不再需要（例如，在一个方法中创建且没有传递给任何其他方法，也没有返回给调用者的临时对象）。\n\n因此，`heap`\
  \ 中的空间可以被，程序可以继续运行。平台恢复并重用不再被应用程序使用的堆内存的机制被称为 `garbage collection`（垃圾收集）。\n\n##\
  \ 7.5.2 标记清除\n\n简单垃圾收集算法的一个极佳例子是 `mark and sweep`（标记清除），事实上，它是第一个被开发的（在 1965 年发布的\
  \ `LISP 1.5` 中）。\n\n注意，还存在其他自动内存管理技术，例如 `Perl` 等语言使用的引用计数法，这些技术可以说更简单（至少从表面上来说），但它们并不是真正的垃圾收集（根据\
  \ Guy L. Steele 的“Multiprocessing Compactifying Garbage Collection，”*Communications\
  \ of the ACM* 18, no. 9 [September 1975]）。\n\n在最简单的形式下，`mark-and-sweep` 算法暂停所有运行的程序线程，并从已知为“活跃”的对象集开始——即在任何用户线程的任何\
  \ `stack frame` 中引用（无论该引用是局部变量的内容、方法参数、临时变量还是某些罕见的情况）的对象。然后它遍历从活跃对象的引用树，将沿途发现的任何对象标记为活跃。当完成后，剩下的所有内容都是垃圾并可以被收集（清除）。注意，被清除的内存是返回给\
  \ `JVM`，而不一定返回给 `OS`。\n\n### 非确定性暂停怎么办？\n\n对 `Java`（以及 `.NET` 等环境）经常提出的批评之一是 `mark-and-sweep`\
  \ 形式的垃圾收集不可避免地会导致 `Stop-the-World`（通常称为 `STW`，即停世界）。这些是所有用户线程必须短暂停止的状态，这会导致持续一段时间不确定时间的暂停。\n\
  \n这个问题经常被夸大。对于服务器软件，极少数应用程序需要关心现代版本 `Java` 垃圾收集器显示的暂停时间。例如，在 `Java 11` 及更高版本中，默认的垃圾收集器是一个并发收集器，它与应用程序线程一起完成大部分工作并将暂停时间最小化。\n\
  \n注意，开发者有时会想出复杂的方案来避免暂停或全内存收集。在几乎所有情况下，这些应该被避免，因为它们通常弊大于利。\n\n`Java` 平台对基础的 `mark-and-sweep`\
  \ 方法提供了许多增强。最简单之一是添加了 `generational GC`（分代垃圾收集）。在这种方法中，`heap` 不是一个均匀的内存区域——多个不同的堆内存区域参与\
  \ `Java` 对象的生命周期。\n\n取决于对象的存活多久，它可以在收集期间从一个区域移动到另一个区域。在对象的寿命期间，对它的引用指向指向不同的内存区域（如图\
  \ 7.5 所示）。\n\n![](img/CH07_F05_Evans2.png)\n\n图 7.5 内存区域\n\n这种安排（以及对象的移动）的原因是，对运行系统的分析表明，对象倾向于短命或非常长寿。不同的堆内存区域旨在允许平台通过将长寿对象与其他部分分离来利用这一特性。\n\
  \n请注意，图 7.5 是一个堆的简单示意图，用于说明分代区域的概念。真实 `Java heap` 的情况要复杂得多，并且取决于所使用的收集器，我们将在本章稍后部分解释。\n\
  \n## 7.5.3 内存区域\n\n`JVM` 具有以下不同的内存区域，用于在对象的生命周期期间存储对象：\n\n* `Eden`——`Eden` 是 `heap`\
  \ 中初始分配所有对象的区域，对于许多对象来说，这将是它们唯一过的内存部分。\n* `Survivor`——这些空间是存活垃圾收集周期（因此得名）的对象移动的地方。它们最初从\
  \ `Eden` 移动，但也可能在 `survivor spaces` 之间移动。\n* `Tenured`——`tenured space`（又名老年代）是被认为“足够老”的存活对象移动的地方（逃离\
  \ survivor 空间）。`Tenured memory` 在年轻代收集期间不被收集。\n\n另外，这些内存区域还以不同的方式参与收集。例如，`survivor\
  \ spaces` 实际上是作为兜底机制，以便在收集之前立即创建的短命对象得到妥善处理。\n\n如果不存在 survivor 空间，那么最近创建的（但短命的）对象将被提升到\
  \ `Tenured`。它们随后会死亡，但会继续占用 `Tenured` 中的空间，直到下一次收集。由于对实际上是短命的对象进行了不当提升，下一次收集也会比预期的更早发生。从理论角度来看，分代假设还引导我们产生了两种类型的收集：年轻代收集和全量收集。\n\
  \n## 7.5.4 年轻代收集\n\n`young collection`（年轻代收集）尝试清除“年轻”空间（Eden 和 survivor）。该过程相对简单，如下所示：\n\
  \n* 标记阶段发现的所有活跃年轻对象都会被移动。\n* 足够老的对象（经历了足够多次 GC 运行）进入 `Tenured`。\n* 所有其他年轻的活跃对象进入空的\
  \ `survivor space`。\n* 结束后，`Eden` 和任何最近释放的 `surviv spaces` 都可以被覆盖和重用，因为它们只有垃圾。\n\
  \n当 `Eden` 满时会触发 `young collection`。注意，标记阶段必须遍历整个活跃对象图。如果年轻对象持有 `Tenured` 对象的引用，那么\
  \ `Tenured` 对象持有的引用也必须被扫描和标记。否则，可能会出现这种情况：一个 `Tenured` 对象持有指向 `Eden` 中对象的引用，但没有其他地方引用它。如果标记阶段没有完全遍历，这个\
  \ Eden 对象将永远不会发现且无法被正确处理。在实践中，使用一些性能技巧（例如 `card tables`）来降低全量标记遍历的高昂成本。\n\n## 7.5.5\
  \ 全量收集\n\n\n\n当年轻代收集（Young collection）由于空间不足无法将对象提升到老年代（Tenured）时，就会触发全堆收集（Full\
  \ collection）。根据所使用的收集器，这可能涉及在老年代内部移动对象。这样做是为了确保老年代在需要时有足够的空间分配大对象。这被称为 `compacting`（压缩）。\n\
  \n### 7.5.6 安全点 (Safepoints)\n\n如果没有所有应用线程至少短时间的停顿，垃圾回收无法进行。然而，线程不能在任意时间停止以进行 GC，因为应用代码可能会修改堆的内容。相反，会发生某些特定的时刻，此时\
  \ JVM 可以确定堆处于一致状态，并且可以进行垃圾回收——这些时刻被称为 `safepoints`（安全点）。\n\n安全点最简单的例子之一是“字节码指令之间”。JVM\
  \ 解释器一次执行一个字节码，然后循环从流中获取下一个字节码。在循环之前，该解释器线程必须完成对堆的所有修改（例如，通过 `putfield` 修改），因此，如果线程在该处停止，它就是“安全”的。一旦所有应用线程都到达安全点，垃圾回收就可以进行。\n\
  \n这是一个简单的安全点示例，但还有其他示例。关于安全点以及它们如何影响某些 JIT 编译技术的更完整讨论，可以参考这里：[`mng.bz/Oo8a`](http://mng.bz/Oo8a)。让我们结束理论讨论，来见见\
  \ JVM 中的一些垃圾回收算法。\n\n### 7.5.7 G1：Java 的默认收集器\n\nG1 是 Java 平台一个相对较新的收集器。它在 Java\
  \ 8u40 中达到了生产级水平，并在 Java 9（2017 年）中成为默认收集器。它最初的设计意图是作为一个 `low-pause`（低停顿）收集器，但在实践中它已经演变成一个通用型收集器（因此具有了默认地位）。\n\
  \n它不仅是一个分代垃圾收集器，还是 `regionalized`（区域化的），这意味着 G1 Java 堆将堆划分为等大小的区域（例如每个 1MB、2MB 或\
  \ 4MB）。分代仍然存在，但它们现在在内存中不再不再是连续的。堆中等大小区域的新布局如图 7.6 所示。\n\n![](img/CH07_F06_Evans2.png)\n\
  \n图 7.6 G1 如何划分堆\n\n引入区域化是为了支持 GC 停顿可预测的理念。较旧的收集器（如 Parallel）存在一个问题：一旦 GC 周期开始，它必须运行到完成，无论花费多久（即它们是\
  \ `all-or-nothing`，全或全无）。\n\nG1 提供了一种收集策略，不会因为堆大而导致更长的停顿时间。它的设计是为了避免“全或全无”的行为，其一个关键概念是\
  \ `pause goal`（停顿目标）。这是程序在恢复执行之前为了 GC 允许的停顿时间。G1 会在合理范围内尽一切达到你的停顿目标。在停顿期间，存活的对象会被转移到另一个区域（类似于\
  \ Eden 对象被移动到幸存区），然后该区域被放回空区域的 `free list`（空闲列表）中。\n\nG1 中的年轻代收集是完全 STW（停世界）且会运行完成。这避免了收集线程和分配线程之间的竞态条件（如果年轻代收集与应用线程并发运行，就会发生这种情况）。\n\
  \n注意 分代假设是指，在年轻代收集期间遇到的对象中只有一小部分仍然存活的。因此，年轻代收集花费的时间应该非常短，远小于停顿目标。\n\n老年代对象的收集与年轻代收集不同——首先，因为一旦对象进入老年代，它们往往会存活很久。其次，为老年代提供的空间通常比年轻代大得多。\n\
  \nG1 跟踪移动到老年代的对象，当填充了足够的老年代空间时（由 `InitiatingHeapOccupancyPercent` 或 IHOP 控制，默认值为\
  \ 45%），就会启动一次老年代收集。这是一个 `concurrent`（并发）收集，因为它是（尽可能地）与应用线程并发运行的。\n\n这次老年代收集的第一部分是并发标记阶段。这是基于\
  \ Dijkstra 和 Lamport 在 1978 年首次描述的算法（参见 [`dl.acm.org/doi/10.1145/359642.359655`](https://dl.acm.org/doi/10.1145/359642.359655)）。一旦此完成，就会立即触发年轻代收集。随后是\
  \ `mixed collection`（混合收集），根据老区域中垃圾的多少来收集老区域（这可以从并发标记期间收集的统计中推断出来）。老区域中的存活对象会被转移到新的老区域（并进行压缩）。\n\
  \nG1 收集策略的性质还允许平台收集单个区域收集需要多长时间（平均）的统计数据。这就是停顿目标的实现方式——G1 只收集它有时间收集的区域（尽管如果最后一个区域的收集时间比预想的要，可能会出现超时情况）。\n\
  \n整个老年代的收集可能无法在单个 GC 周期内完成。在这种情况下，G1 只收集一组区域然后完成收集，释放被用于 GC 的 CPU 核心。只要在持续的一段时间内，长生命周期对象的创建没有超过\
  \ GC 回收它们的能力，那么一切都都是正常的。\n\n可以分配比单个区域更大的对象。在实践中，这意味着大数组（通常是字节或其他原始类型）。此类对象需要一种特殊的区域——`humongous\
  \ region`（巨型区域）。这些对象需要 GC 的特殊处理，因为为大数组分配的空间必须是连续的。如果足够的空闲区域相邻，可以将它们转换为单个巨型区域并进行分配。\n\
  \n如果内存中没有地方可以分配数组（即使在年轻代收集之后），则称内存碎片（`fragmented`）。GC 必须执行完全 STW 压缩收集以尝试释放出足够的空间。\n\
  \n注意 虽然可以人工构造一个拥有大量字段的类，以至于单个实例大于 1MB，但在实际系统中永远不会这样做。\n\n### 7.5.8 Parallel 收集器\n\
  \nParallel 收集器在 Java 8 之前是默认收集器，直到今天它仍然可以作为 G1 的替代方案使用。Parallel 这个名字需要稍微解释，因为 `concurrent`\
  \ 和 `parallel` 都被用于描述 GC 算法的属性。它们听起来应该是一个意思，但实际上有两个完全不同的含义，如下所示：\n\n*   `concurrent`——GC\
  \ 线程可以与应用线程同时运行。\n*   `parallel`——GC 算法是多线程的，可以使用多个核心。\n\n这些术语并不等同。相反，最好将它们想成另外两个\
  \ GC 术语的对立面——`concurrent` 是 STW 的对立面，而 `parallel` 是 `single-threaded`（单线程）的对立面。\n\
  \n\n\n\n在某些收集器（包括 `Parallel`）中，堆并不是区域化的。相反，代代是连续的内存区域，它们有足够的空间根据需要进行增长或收缩。在这种堆配置中，有两个幸存区（survivor\
  \ spaces）。它们有时被称为 `From` 和 `To`，除非正在进行垃圾，否则其中一个幸存区始终是空的。\n\n**注意**：非常旧版本的 `Java`\
  \ 还有一个名为 `PermGen`（或永久代，Permanent Generation）的空间。这是为 `JVM` 的内部结构分配内存的地方，例如 `classes`\
  \ 和 `methods` 的定义。`PermGen` 在 `Java` 8 中被移除，因此如果你发现任何引用它的资源，那么它们是旧的，很可能已经过时了。\n\n\
  `Parallel` 是一个非常高效的收集器——是主流 `Java` 中可用效率最高的一个——但它也有一个缺点：它没有真正的停顿目标能力，并且老年代收集（是 `STW`\
  \ 的）无论花费多长时间都必须运行完成。\n\n一些开发者有时会询问关于 GC 算法的复杂度（即“大 O”行为）的问题。然而，这并不是一个真正有用的问题。GC\
  \ 算法是非常通用的，它们要求在整个可能的工作负载范围内表现出可接受的行为。仅关注它们的渐近行为并不十分有用，而且它绝对不是它们通用情况性能的合适替代指标。\n\
  \n垃圾回收始终关乎权衡，而 `G1` 所做出的权衡对于大多数工作负载来说都是非常好的（以至于许多开发者可以直接忽略它们）。然而，权衡始终存在着，无论开发者是否意识到它们。某些应用程序无法忽略这些权衡，必须选择关注\
  \ GC 子系统的细节，要么通过更改收集算法，要么通过使用 GC 参数进行调优。\n\n### 7.5.9 GC 配置参数\n\n`JVM` 自带了极其大量的有用参数（至少有一百个），这些参数可以用于自定义\
  \ `JVM` 运行时行为的许多方面。在本节中，我们将讨论一些与垃圾回收相关的字节开关。\n\n如果开关以 `-X:` 开头，则它是非标准的，并且可能无法在不同的\
  \ JVM 实现（如 `HotSpot` 或 `Eclipse OpenJ9`）之间具有移植性。如果它以 `-XX:` 开头，则是一个扩展开关，不建议常规使用。许多与性能相关的开关都是扩展开关。\n\
  \n某些开关在效果上是布尔，在它们前面加上 `+` 或 `-` 来开启或关闭它们。其他开关接受参数，例如 `-XX:CompileThreshold=20000`（这会将方法在被考虑\
  \ JIT 编译之前需要被调用的次数设置为 20000）。表 7.1 列出了基础 GC 开关并显示了开关的默认值（如果有）。\n\n#### 表 7.1 基础垃圾回收开关\n\
  \n| 开关 | 效果 |\n| --- | --- |\n| `-Xms<size in MB>m` | 堆的初始大小（默认物理内存的 1/64） |\n|\
  \ `-Xmx<size in MB>m` | 堆的最大大小（默认物理内存的 1/4） |\n| `-Xmn<size in MB>m` | 堆中年轻代的大小\
  \ |\n| `-XX:-DisableExplicitGC` | 防止对 `System.gc()` 的调用产生任何影响 |\n\n一种常见的技巧是将 `-Xms`\
  \ 的大小设置为与 `-Xmx` 相同。这意味着进程将以恰好的堆大小运行，并在执行期间不会调整大小。表面上，这是有意义的，并且给开发者带来了控制的错。然而，在实践中，这种方法是一种反模式。现代\
  \ GC 具有良好的动态调整算法，人为地限制它们几乎总是弊大于利。\n\n**注意**：在 2022 年，在没有任何其他证据的情况下，大多数工作负载的最佳实践是设置\
  \ `Xmx` 而完全不设置 `Xms`。\n\n同样值得注意的是 `JVM` 在容器中的行为。对于 `Java` 11 和 17，“物理内存”意味着容器限制，因此堆的最大大小必须适合任何容器限制，并留出非\
  \ Java 堆内存以及 `JVM` 之外任何其他进程的空间。早期版本的 `Java` 8 并不遵循容器限制，因此如果你在容器中运行应用程序，始终总是升级到 `Java`\
  \ 11。对于 `G1` 收集器，两个设置在调优过程中可能有用——它们在表 7.2 中。\n\n#### 表 7.2 G1 收集器标志\n\n| 开关 | 效果\
  \ |\n| --- | --- |\n| `-XX:MaxGCPauseMillis=50` | 通知 `G1` 在一次收集期间尝试停顿不超过 50 毫 |\n\
  | `-XX:GCPauseIntervalMillis=200` | 通知 `G1` 在两次收集之间尝试至少运行 200 毫 | |这些开关可以组合使用，例如设置\
  \ 50 ms 的最大停顿目标，且停顿发生的间隔不小于 200 ms。当然，GC 系统能被推到有多程度是有限制。必须有足够的停顿时间来清理垃圾。每 100 年停顿\
  \ 1 毫秒目标显然是无法实现或被遵守的。\n\n在下一节中，我们将查看 JIT 编译。对于许多程序来说，这是产生高性能代码的主要因素之一。我们将查看 JIT\
  \ 编译的一些基础知识，并在节末尾，我们将解释如何开启 JIT 编译日志，以便你能够判断哪些方法正在被编译。\n\n### 7.6 使用 HotSpot 进行\
  \ JIT 编译\n\n正如我们在第 1 章中讨论的，`Java` 平台最好被认为是“动态编译的”。某些应用程序和框架类在运行时经过进一步编译，以将它们转换为可以直接执行的机器码。\n\
  \n这个过程被称为 `just-in-time (JIT) compilation`，或简称为 JITing，它通常一次处理一个方法。理解这个过程通常是识别任何大型代码库中重要部分的关键。\n\
  \n让我们来看关于 JIT 编译的一些良好的基本事实实：\n\n*   几乎所有现代 `JVMs` 都会有某种 JIT 编译器。\n*   相比之下，纯解释的\
  \ `JVMs` 非常慢。\n*   编译后的方法运行速度比解释执行的代码快得多。\n*   先编译使用最频繁的方法是有意义的。\n*   在进行 JIT 编译时，先处理“易于摘取的果实”总是是重要的。\n\
  \n最后一点意味着我们应该首先查看编译后的代码，因为在正常情况下，任何仍处于解释状态的方法运行频率都低于已编译的方法。（偶尔方法会编译失败，但这非常罕见。）\n\
  \n方法开始从其字节码表示进行解释，同时 `JVM` 会跟踪方法被调用的次数（以及其他统计数据）。当达到阈值时，如果方法符合条件，一个 JVM 线程会在后台将字节码编译为机器码。如果编译成功，对方法的后续调用都将使用编译形式，除非发生了导致失效或导致去优化的情况。\n\
  \n取决于方法中代码的具体性质，编译后的方法可能比解释模式相同方法快得多。有时会给出“快 100 倍”的数字，但这是一个极其粗略的经验法则。JIT 编译的性质改变了执行的代码，以至于任何单一数字都是误导性的。理解程序中哪些方法很重要以及哪些重要方法正在编译，通常是提高性能的主要技术之一。\n\
  \n#### 7.6.1 为什么要动态编译？\n\n经常被问的问题是，`Java` 平台为什么要动态编译？为什么不预先完成所有编译（如 C++）？第一个答案通常是，将平台无关的制品（.jar\
  \ 和 .class 文件）作为基本的部署单元，比尝试为每个目标平台处理不同的编译二进制文件要方便得多。\n\n\n\n\n\n另一种更具野心的答案是：使用动态编译的语言为其编译器提供了更多可用信息。具体而言，提前编译（AOT）编译的语言无法访问任何运行时信息，例如某些指令的可用性或其他硬件细节，或者关于代码运行情况的任何统计数据。这开启了一个有趣的可能性：像\
  \ `Java` 这样动态编译的语言，其运行速度实际上可能比 AOT 编译的语言更快。\n\n注意：将 `Java` 字节码直接编译为机器码（又称“静态 Java”）是\
  \ `Java` 社区中的一个活跃研究领域，遗憾的是，它超出了本书的讨论范围。\n\n在关于 JIT 编译机制的后续讨论中，我们将专门讨论名为 `HotSpot`\
  \ 的 `JVM`。许多通用讨论适用于其他虚拟机，但具体细节可能会很大不同。\n\n我们将首先介绍随 `HotSpot` 一带的各种 JIT 编译器，然后解释\
  \ `HotSpot` 提供的两种最强大的优化：内联（`inlining`）和单态分发（`monomorphic dispatch`）。最后，我们将通过展示如何开启方法编译日志来结束本节，这样你就可以确切看到哪些方法正在被编译。让我们从介绍\
  \ `HotSpot` 开始。\n\n### 7.6.2 HotSpot 简介\n\n`HotSpot` 是 Oracle 在收购 Sun Microsystems\
  \ 时获得的 `JVM`（当时已经拥有一个名为 `JRockit` 的 `JVM`，该内核最初由 BEA Systems 开发）。`HotSpot` 是构成 `OpenJDK`\
  \ 的 `JVM`。它能够以两种独立的模式运行：客户端（client）和服务器（server）。\n\n在过去，可以通过启动 `JVM` 时指定 `-client`\
  \ 或 `-server` 开关来选择模式。这些模式都有各自倾向的应用程序。\n\n#### C1（又名客户端编译器）\n\n`C1` 编译器最初设计用于 GUI\
  \ 应用程序。在这个领域，操作的一致性备受重视，因此 `C1`（有时被称为客户端编译器）在编译时倾向于做出更保守的决策。当它撤回一个证明错误或基于错误假设的优化决策时，它不会意外暂停。它的编译阈值较低——一个方法必须执行\
  \ 1500 次才有资格被编译——因此它的预热期相对较短。\n\n#### C2（又名服务器编译器）\n\n相比之下，服务器编译器（`C2`）在编译时会做出激进假设。为了确保运行的代码始终正确，`C2`\
  \ 会添加一个快速的运行时检查（通常称为 `guard condition`）来验证其所做的假设是否有效。如果无效，它会撤回激进编译并尝试其他方法。这种激进的方法可以产生比相当规避的客户端编译器好多的性能。\n\
  \n`C2` 的内联阈值远高于 `C1`。默认情况下，一个方法在调用次数达到 10,000 次之前没有资格进行 `C2` 编译，这意味着更长的预热时间。\n\n\
  #### 实时 Java\n\n历史上，开发了一种名为实时 Java（real-time Java）的 `Java` 形式，一些开发者疑惑为什么对高性能需求的代码不直接使用这个平台（这是一个独立的\
  \ `JVM`，而不是 `HotSpot` 的选项）。答案是，尽管有一个常见的误解，但实时系统并不一定是最快的系统。\n\n实时编程实际上关乎可以提供的保证。从统计学角度来说，实时系统寻求的是减少执行某些操作所需时间的方差，并准备为此牺牲一定的平均延迟。为了获得更一致的运行，可能会稍微牺牲整体性能。追求更高性能的团队通常在寻找更低的平均延迟，即使是以更高方差为代价，因此服务器编译器的激进优化特别适用。\n\
  \n在现代 `JVMs` 中，客户端和服务器编译器都被使用——客户端编译器在早期使用，而在应用程序预热后使用高级服务器级优化。这种双重使用被称为分层编译（`tiered\
  \ compilation`）。我们的下一个主题是所有 JIT 编译器广泛使用的内容。\n\n### 7.6.3 方法内联\n\n内联（Inlining）是 `HotSpot`\
  \ 可用的最强大的技术之一。它通过消除对被内联方法的调用，而是将被调用方法的代码放置在调用者内部。\n\n```\nMyActualClassNotInterface\
  \ obj = getInstance();\n\nobj.callMyMethod();\n```\n\n该平台的优势之一是，编译器可以根据关于方法调用频率和其他因素的运行时统计数据做出内联决策（例如：它是否会导致调用者方法变得过大并可能影响代码缓存）。`HotSpot`\
  \ 编译器在内联方面可以比提前编译器做出明智得决策。\n\n访问器方法（accessor methods）呢？\n\n一些开发者错误地假设访问器方法（访问私有成员变量的公共\
  \ getter）不能被 `HotSpot` 内联。他们的理由是，因为变量是私有的，所以方法调用无法被优化掉，因为类外部禁止对其进行访问。这是错误的。\n\n\
  `HotSpot` 在将方法编译为机器码时可以并且将会忽略访问控制，并将访问器方法替换为对私有字段的直接访问。这不会损害 `Java` 的安全模型，因为所有的访问控制在类加载或链接时已经检查过了。\n\
  \n方法的内联完全是自动的，在几乎所有情况下，默认参数值都是没问题的。可以使用开关来控制多大大小的方法会被内联，以及方法在成为候选之前需要被调用多少次。\n\n\
  这些开关对于好奇的程序员更好地理解内部的内联部分如何工作非常有用。它们对于生产代码来说并不常用，并且应该被视为性能技术上的某种最后手段，因为它们可能对运行时系统的性能产生其他不可预测的影响。\n\
  \n### 7.6.4 动态编译与单态调用\n\n这种激进优化的一个例子是单态调用（`monomorphic call`）。这种优化基于这样一种观察：在大多数情况下，对对象的方法调用如下：\n\
  \n```\nMyActualClassNotInterface obj = getInstance();\n\nobj.callMyMethod();\n```\n\
  \n只会被一种类型的对象调用。另一种说法是，调用点 `obj.callMyMethod()` 永远不会同时遇到类及其子类。在这种情况下，Java 方法查找可以替换为对\
  \ `callMyMethod()` 对应的编译代码的直接调用。\n\n注意：单态分发（Monomorphic dispatch）提供了 JVM 运行时分析的示例，允许平台执行\
  \ C++ 这样的 AOT 语言无法实现的优化。\n\n没有技术原因说明 `getInstance()` 方法在某些情况下不能返回 `MyActualClassNotInterface`\
  \ 类型的对象，而在另一些情况下返回某个子类的对象。为了防止发生这种情况，除非在调用点每次都看到完全相同的类型，直到达到编译阈值，否则 `getInstance()`\
  \ 不会被提交进行单态优化。在编译后的代码中还会插入一个检查 `obj` 类型的运行时测试，以供后续调用。如果这一预期被违反，运行时将撤回优化，程序完全不会察觉，也不会执行任何错误操作。\n\
  \n这是一种相当激进的优化，只由服务器编译器执行。客户端编译器不这样做。\n\n### 7.6.5 读取编译日志\n\n\n\n\n让我们通过一个示例来阐明如何使用\
  \ JIT 编译器输出的日志消息。希帕科斯（Hipparcos）星表列出了从地球上观测到的恒星详细信息。我们的示例应用程序处理该星表，为特定日期、特定位置生成可见星星的星图。\n\
  \n让我们来看一些示例输出，显示了在我们运行星图应用程序时，哪些方法正在被编译。我们使用的关键 JVM 标志是 `-XX:+PrintCompilation`。这是我们之前简要讨论过的扩展开关之一。在用于启动\
  \ JVM 的命令行中添加此开关，会告诉 JIT 编译线程向标准日志中添加消息。这些消息指示了方法何时通过编译阈值并被转换为机器码，如下所示：\n\n```\n\
  1 java.lang.String::hashCode (64 bytes)\n2 java.math.BigInteger::mulAdd (81 bytes)\n\
  3 java.math.BigInteger::multiplyToLen (219 bytes)\n4 java.math.BigInteger::addOne\
  \ (77 bytes)\n5 java.math.BigInteger::squareToLen (172 bytes)\n6 java.math.BigInteger::primitiveLeftShift\
  \ (79 bytes)\n7 java.math.BigInteger::montReduce (99 bytes)\n8 sun.security.provider.SHA::implCompress\
  \ (491 bytes)\n9 java.lang.String::charAt (33 bytes)\n1% ! sun.nio.cs.SingleByteDecoder::decodeArrayLoop\
  \ @ 129 (308 bytes)\n...\n39 sun.misc.FloatingDecimal::doubleValue (1289 bytes)\n\
  40 org.camelot.hipparcos.DelimitedLine::getNextString (5 bytes)\n41 ! org.camelot.hipparcos.Star::parseStar\
  \ (301 bytes)\n...\n2% ! org.camelot.CamelotStarter::populateStarStore @ 25 (106\
  \ bytes)\n65 s java.lang.StringBuffer::append (8 bytes)\n```\n\n这是 `PrintCompilation`\
  \ 的非常典型的输出。这些行指示了哪些方法被认为足够“热”而可以被编译。正如你预期的那样，第一个被编译的方法可能是平台方法（例如 `String::hashCode()`）。随着时间的推移，应用程序方法（例如示例中用于从天文学目录解析记录的\
  \ `org.camelot.hipparcos.Star::parseStar()` 方法）也会被编译。\n\n输出行包含一个数字，表示方法在本次运行中的编译顺序。请注意，由于平台的动态性质，此顺序在不同运行之间可能会略有变化。其他字段如下：\n\
  \n* `s`—表示该方法是同步的（synchronized）\n* `!`—表示该方法具有异常处理器\n* `%`—栈上替换（OSR）\n\nOSR 意味着该方法已被编译并替换了运行代码中的解释版本。请注意，OSR\
  \ 方法有它们自己的编号方案，从 1 开始。\n\n### 警惕“僵尸方法”（zombie）\n\n在查看使用服务器编译器 (C2) 运行的代码示例输出日志时，偶尔会看到类似“made\
  \ not entrant”（不再进入入口）和“made zombie”（变为僵尸）的行。这些行意味着某个已经被编译的特定方法现在失效了，通常是因为类加载操作导致的。\n\
  \n### 7.6.6 去优化（Deoptimization）\n\nHotSpot 能够对基于事实错误的假设的代码进行去优化。在许多情况下，它会重新考虑并尝试另一种优化方案。因此，同一个方法可能会被去优化并重新编译多次。\n\
  \n随着时间的推移，你会发现编译方法的数量趋于稳定。代码进入一个稳定的编译状态，并在很大程度上保持在那里。哪些方法被编译的准确细节取决于所使用的具体 JVM 版本和操作系统平台。假设所有平台都会产生相同的一组编译方法，并且给定方法的编译代码在不同平台上的大小大致相同，这是错误的。正如性能领域的许多其他许多方面一样，这应该通过测量来确定，结果可能会让你惊讶。即使是一个看起来非常无害的\
  \ Java 方法，事实证明在 JIT 编译生成的机器码方面，Mac 和 Linux 之间存在五倍的差异。\n\n测量始终是必要的。幸运的是，现代 JVM 提供了一些优秀的工具来方便深度性能分析。让我们来看看这些工具。\n\
  \n## 7.7 JDK Flight Recorder（飞行记录器）\n\n从历史上看，Flight Recorder 和 Mission Control 工具（通常称为\
  \ `JFR` 和 `JMC`）是 Oracle 在 2008 年收购 BEA Systems 时获得的。这两个组件协同工作——``JFR` 是一个低开销、基于事件的剖析引擎，具有高性能后端，可以二进制格式写入事件；而\
  \ `JMC` 是一个 GUI 工具，用于检查由 `JFR` 根据单个 JVM 的遥测数据创建的文件。\n\n这些工具最初是 BEA JRockit JVM 工具包的一部分，在合并\
  \ JRockit 与 HotSpot 的过程中移动到了 Oracle JDK 的商业版本中。在 JDK 9 发布后，Oracle 更改了 Java 的发布模型，并宣布\
  \ `JFR` 和 `JMC` 将成为开源工具。`JFR` 被贡献给 OpenJDK 并在 JDK 11 中作为 `JEP 328` 交付。`JMC` 被拆分为一个独立的开源项目，现在作为一个单独的下载项存在。\n\
  \n注意 Java 14 为 `JFR` 引入了一个新功能：`JFR` 能够产生连续的事件流。此更改提供了一个回调 API，允许事件被立即处理，而不是在事后解析文件。\n\
  \n然而，一个问题是，由于 `JFR` 和 `JMC` 最近才开源，许多 Java 开发者并不知道它们的强大功能。让我们借此机会从头介绍 `JMC` 和 `JFR`。\n\
  \n### 7.7.1 Flight Recorder（飞行记录器）\n\n`JFR` 最初作为 OpenJDK 11 的一部分开源，因此要使用它需要运行该版本或更高版本）。该技术也回移植到了\
  \ OpenJDK 8，并适用于 8u262 及以上版本。\n\n创建 `JFR` 记录有多种方法，我们将特别查看两种：启动 JVM 时的命令行参数以及使用 `jcmd`。\n\
  \n首先，让我们看看启动 JFR 需要的命令行开关。关键开关如下：\n\n```\n-XX:StartFlightRecording:<options>\n```\n\
  \n这可以作为一个一次性的转储文件，也可以作为一个连续环形缓冲区，并且大量的命令行选项控制着捕获的数据。\n\n此外，`JFR` 可以捕获一百多个不同的指标。其中大多数指标的影响很小，但某些确实会产生开销。单独管理所有指标的配置将是一项巨大的任务。\n\
  \n相反，为了简化过程，`JFR` 使用剖析配置文件。这些是简单的 XML 文件，包含了每个指标的配置以及是否应该捕获。标准 JDK 下载包含两个基础文件：`default.jfc`\
  \ 和 `profile.jfc`。\n\n默认记录级别设计为具有极低的开销，并适用于几乎 Java 进程。`profile.jfc` 配置包含了更详细的信息，但当然，这以更高的运行时成本为代价。\n\
  \n注意除了提供的两个文件外，还可以创建一个包含所需数据点的自定义配置文件。`JMC` 工具有一个模板管理器，可以方便地创建这些文件。\n\n除了设置文件外，可以传递的其他选项还包括用于存储记录数据的文件名以及保留多少数据（根据数据点的年龄）。例如，一个整体\
  \ JFR 命令行可能如下所示（在单行给出）：\n\n```\n-XX:StartFlightRecording:disk=true,filename=svc/sandbox/service.jfr,\n\
  \                         maxage=12h,settings=profile\n```\n\n\n\n\n\n注意：当 JFR 是商业版本的一部分时，它是通过\
  \ `-XX:+UnlockCommercialFeatures` 开关解锁的。然而，Oracle JDK 11+ 在使用 `-XX:+UnlockCommercialFeatures`\
  \ 选项时会发出警告。这是因为所有商业特性已经开源，而且由于该标志从未是 OpenJDK 的一部分，因此继续使用它已经没有意义。在 OpenJDK 构建版本中，使用商业特性标志会导致错误。\n\
  \nJFR 的强大特性之一是它不需要在进程启动时进行配置。相反，可以使用 `jcmd` 命令从命令行进行控制，如画所示所示：\n\n```\n$ jcmd <pid>\
  \ JFR.start name=Recording1 settings=default\n$ jcmd <pid> JFR.dump filename=recording.jfr\n\
  $ jcmd <pid> JFR.stop\n```\n\nJFR 还提供了一个 JMX API，用于控制 JFR 录制。然而，无论如何激活 JFR，结果都是相同的——每个\
  \ JVM 的每次性能分析运行都会生成一个文件。该文件包含大量的二进制数据，且不是人类可读的，因此我们需要某种工具来提取和可视化这些数据。\n\n### 7.7.2\
  \ Mission Control\n\nJDK Mission Control (JMC) 是一种用于显示 JFR 输出文件中数据的图形化工具。它通过 `jmc`\
  \ 命令启动。该程序以前包含在 Oracle JDK 下载包中，但现在可以从 [`jdk.java.net/jmc/`](https://jdk.java.net/jmc/)\
  \ 独立获取。\n\nMission Control 的启动界面见图 7.7。加载文件后，JMC 会对其进行某些自动分析，以识别录制运行中存在的任何明显问题。\n\
  \n![](img/CH07_F07_Evans2.png)\n\n图 7.7 JMC 启动界面\n\n注意：要进行性能分析，必须在目标应用程序上启用 Flight\
  \ Recorder。除了使用之前创建的文件，还可以在应用程序启动后动态附加它。对于后一种选项，JMC 在顶部面板左侧提供了一个标记为 `JVM Browser`\
  \ 的标签页，用于动态附加本地应用程序。\n\n在 JMC 中遇到的第一个屏幕之一是概览遥测屏幕，它显示了 JVM 整体健康状况的仪表板。可以在图 7.8 中看到。\n\
  \n![](img/CH07_F08_Evans2.png)\n\n图 7.8 JMC 仪表板\n\nJVM 的主要子系统都有专门的屏幕来启用深度分析。例如，垃圾回收有一个概览屏幕，显示\
  \ JFR 文件整个生命周期内的 GC 事件。底部的“最长停顿”（Longest Pause）显示允许用户查看时间轴上何时发生过异常长时间的 GC 事件，如图\
  \ 7.9 所示。\n\n![](img/CH07_F09_Evans2.png)\n\n图 7.9 JMC 垃圾回收\n\n在详细的性能分析配置中，还可以看到分配新的分配缓冲区（TLABs）给应用程序线程的单个事件。我们可以看到进程内分配的更准确的视图。该视图类似于图\
  \ 7.10 所示。此视图允许开发者轻松查看哪些线程分配了最多的内存——在本例中，是一个从 Apache Kafka 主题消耗数据的线程。\n\n![](img/CH07_F10_Evans2.png)\n\
  \n图 7.10 JMC TLAB 分配\n\nJVM 的另一个主要子系统是 JIT 编译器，JMC 允许我们深入研究编译器的工作细节，如图 7.11 所示。\n\
  \n![](img/CH07_F11_Evans2.png)\n\n图 7.11 JMC JIT 编译\n\n关键资源是 JIT 编译器代码缓存（code cache）中的可用内存。这是存储方法的编译版本的内存区域。代码缓存的使用可以在\
  \ JMC 中可视化——图 7.12 所示了一个示例。\n\n![](img/CH07_F12_Evans2.png)\n\n图 7.12 JMC JIT 代码缓存\n\
  \n对于拥有许多编译方法的进程，此内存区域可能会耗尽，导致进程无法达到峰性能。\n\nJMC 还包含一个方法级性能分析器，其工作方式与 VisualVM 或 JProfiler、YourKit\
  \ 等商业工具中找到的非常相似。图 7.13 显示了一个典型结果。\n\n![](img/CH07_F13_Evans2.png)\n\n图 7.13 JMC\
  \ 方法性能分析\n\nJMC 内部较高级的屏幕之一是虚拟机操作（VM Operations）视图，它显示了 JVM 执行的一些内部操作以及所需的时间。这并不是我们预计在每次分析中都需要的视图，但对于检测某些类型的较常见问题可能很有有用。我们可以在图\
  \ 7.14 中看到典型的用法。\n\n![](img/CH07_F14_Evans2.png)\n\n图 7.14 JMC JVM 操作\n\nJMC 可用于诊断单个\
  \ JVM，这是一个非常强大的功能。然而，这种用例无法扩展到检查整个集群（或整个应用程序）。此外，现代系统通常还需要监控或 `observability`（观测性）解决方案，以及深度分析能力。\n\
  \n经典的 JFR 录制文件模型（以及单文件 JVM）并没有让这变得容易。它不适合通过网络传递给 SaaS 商或内部工具的遥测流。幸运的是，Java 14 引入的\
  \ JFR Streaming API 为观测性用例以及深度分析提供了极佳的构建模块。某些供应商（例如 New Relic 和 DataDog）确实提供了 JFR\
  \ 能力，但整个社区倾向于不采用非 LTS 的 Java 版本。这意味着只有当 Java 17（LTS 版本）出现，我们才会看到支持流式 JFR 版本的 Java\
  \ 版本被广泛采用。\n\n\n\n\n事实证明，未来需要的许多新思想已经存在于如今的其他 JVM 语言中，例如函数式编程。通过学习一种新的 JVM 语言，你可以窥见另一个世界——那个世界可能与你未来的某些项目相似。探索一个陌生的视角也能帮助你以全新的光芒审视现有的知识。这开启了一种可能性：通过学习一种新语言，你可能会发现自己未曾察觉的天赋，并增加未来被证明非常有用的新技能。\n\
  \n在第 9 章中，我们将介绍 `Kotlin`，这是一种相对年轻的语言，它在不从根本上改变基础的情况下解决了对 Java 的许多批评。它的目标是简洁和安全，同时开启了以往更倾向于动态脚本语言的用用例。\n\
  \n近年来，函数式编程继续受到关注，作为 Java 所表达的典型面向对象视角的替代方案。为了体验这个不同的世界，你将看到 `Clojure`，它是 JVM 上的函数式语言之一，与\
  \ Java 思维偏离最远。\n\n第 4 部分和第 5 部分将频繁回到这些语言，展示它们如何应用于你的整个项目之中——从构建和测试，到深层次的并发和程序结构问题。所以，让我们暂时离开\
  \ Java 的舒适区，看看可用的替代方案。\n\n# 8 替代 JVM 语言\n\n本章涵盖了：\n\n*   语言分类学\n*   为什么你应该使用替代 JVM\
  \ 语言\n*   替代语言的选择标准\n*   JVM 如何处理替代语言\n\n如果你曾用 Java 做过相当规模的工作，你可能已经注意到它有时会变得有些冗长和笨拙。你甚至发现自己希望事情能不同——以某种方式变得更容易。\n\
  \n幸运的是，正如你在最后几章中看到的，JVM 是极棒的——事实上，它是如此棒，以至于为 Java 以外的编程语言提供了一个自然的家园。在本章中，我们将向你展示为什么以及你可能想开始在项目中混合另一种\
  \ JVM 编程语言。\n\n在本章中，我们将介绍描述不同语言类型（例如静态与动态类型）的方法、你为什么可能想使用替代语言，以及选择它们时应该寻找哪些标准。你还将接触两种语言（`Kotlin`\
  \ 和 `Clojure`），我们将在书的剩余部分对它们进行深入介绍。\n\n## 8.1 语言分类学\n\n编程语言有许多不同的风格和分类。另一种说法是，各种编程风格和方法都体现在不同的语言中。当你理解如何分类语言之间的差异时，掌握这些不同风格通常会更容易。\n\
  \n注意：这些分类有助于思考语言的多样性。这些划分中，有些比其他的更清晰，但没有任何一种分类方案是完美的。不同的人对于分类应该如何布局有不同的想法。\n\n近年来，存在一种趋势，即语言会跨越可能性的谱系添加功能。将一个给定的语言认为比另一种语言“更不函数式”，或者“是动态类型但在需要时具有可选的静态类型”，通常很有帮助。\n\
  \n我们将涵盖的分类有“解释型与编译型”、“动态与静态”、“命令式与函数式”，以及语言的重新实现与原版对比。总的来说，这些分类是思考该领域的工具，而不是完整且精确的学术方案。\n\
  \n例如，我们可以说 `Java` 是一种运行时编译的、静态类型的、命令式语言，带有一些函数式特征。它强调安全、代码清晰度、后兼容性和性能，并且为了实现这些目标，它乐意接受一定程度冗长和“仪式”（例如部署时）。\n\
  \n注意：不同的语言可能有不同的优先事项；例如，动态类型语言可能更强调部署速度。\n\n让我们从解释型与编译型的分类开始。\n\n### 8.1.1 解释型 vs\
  \ 编译型语言\n\n*解释型语言*是指源代码的每一步都按原执行的语言，而不是在执行开始之前将整个程序转换为机器码。这与编译语言形成对比，编译语言使用编译器作为初始任务将人类可读的源代码转换为二进制形式。\n\
  \n这种区别最近变得不那么明显了。在 90 年代初，这种划分相当清晰：`C/C++`、`FORTRAN` 及其同类语言是编译型语言，而 `Perl` 和 `Python`\
  \ 是解释型语言。但正如我们在第 1 章中提到的，`Java` 同时具有编译和解释型语言的特征。`bytecode` 的使用进一步模糊了这个问题。`bytecode`\
  \ 显然不是人类可读的，但也不是机器码。\n\n对于我们在书中部分学习的 JVM 语言，我们所做的区分是该语言是否从源代码生成 `class file` 并执行它——或者不是。在后一种情况下，使用解释器（可能是用\
  \ `Java` 编写的）逐行执行源代码。某些语言同时提供编译器和解释器，而某些语言提供解释器和一个即时（`JIT`）编译器，后者会产生 `JVM bytecode`。\n\
  \n### 8.1.2 动态 vs 静态类型\n\n在动态类型语言中，变量在程序执行的不同阶段可以包含不同的类型。作为一个例子，让我们看看著名的动态语言 `JavaScript`\
  \ 中的一段简单代码。即使你不详细了解这种语言，这个示例也应该如愿是易于理解的：\n\n```\nvar answer = 40;\nanswer = answer\
  \ + 2;\nanswer = \"What is the answer? \" + answer;\n```\n\n这里使用的 `var` 关键字创建一个新变量。在\
  \ `JavaScript` 的动态类型系统中，这个变量可以包含任何类型的值。这个变量初始设为 `40`，显然这是一个数值值。我们我们对其加上 `2`。然后我们稍微改变一下，让\
  \ `answer` 持有一个字符串值。这在动态语言中是一种常见技术，且不会引起语法错误。\n\nJavaScript 解释器能够区分 `+` 运算符的两种用法。第一次是数值加法——将\
  \ `2` 加到 `40 上——而在下一行中，解释器根据上下文判断出开发者指的是字符串拼接。\n\n让我们使用 `JShell` 在 `Java` 中再次尝试这个技巧：\n\
  \n```\njshell> var answer = 40;\nanswer ==> 40\n\njshell> answer = answer + 2;\n\
  answer ==> 42\n\njshell> answer = \"What is the answer? \" + answer;\n|  Error:\n\
  |  incompatible types: java.lang.String cannot be converted to int\n|  answer =\
  \ \"What is the answer? \" + answer;\n|           -----------------------------^\n\
  ```\n\n砰。尽管完全相同的源代码在两种语言中看起来都是合法的，但 Java 的*静态类型系统*阻止了最后行的运行。Java 的 `var` 关键字不仅仅是创建了变量\
  \ `answer`。正如我们在 1.3 节中学到的，Java 的 `var` 还从表达式的右侧推断出新变量的类型。我们没有显式指定 `answer` 的类型，但\
  \ Java 的静态类型系统分配了一个之后不再改变的类型。\n\n注意：这里的关键点，动态类型通过变量包含的值跟踪类型信息（例如数字或字符串），而静态类型则通过变量定义跟踪类型。\n\
  \n静态类型与编译语言有很好的契合点，因为类型信息完全是变量的，而不是它们包含的值。这允许在代码运行之前，在编译时对潜在的类型系统违规进行推理。\n\n\n\n\
  \n动态类型语言在变量持有的值上带有类型信息。这提供了极大的活性，但也意味着类型违规（例如，“我以为这是一个数字，但它其实是个字符串”）会在执行期间发生。这可能导致更多的运行时错误，而运行时错误往往比编译时错误更难调试且成本更高。\n\
  \n### 8.1.3 命令式语言与函数式语言\n\n`Java` 是命令式语言的经典示例。命令式语言可以被看作是将程序的运行状态建模为可变数据，并发布一组指令来转换该状态的语言。因此，程序状态是命令式语言中的核心概念。\n\
  \n命令式语言存在两个主要的子类。过程化语言（如 `BASIC` 和 `FORTRAN`）将代码和数据视为完全分离的整体，并具有简单的“代码操作数据”的范式。另一个子类是面向对象（OO）语言，数据和代码（以方法的形式）被封装在对象中。在面向对象的系统中，程序状态是程序中所有对象的状态。在面向对象的语言中，元数据（如类信息）在不同程度上对其施加了额外的结构。然而，这些子类之间的区别并不总是清晰的。例如，`C++`\
  \ 明确旨在同时支持面向对象和过程化编程，而一些后期的 `BASIC` 版本也具备了面向对象的特性。\n\n函数式语言认为计算本身是最重要的概念。函数在值上进行操作（类似于过程化语言），但函数不是改变其输入，而是被视为像数学函数一样运行并返回新值。以新颖的方式将不同的函数组合在一起也是这种模型的基础。\n\
  \n如图 8.1 所示，函数被视为“小型处理机器”，它们接收值并输出新值。它们没有自己的任何状态，将它们与任何外部状态封装在一起并没有真正意义。这种以对象为中心的世界观与函数式语言的自然观点有些矛盾。\n\
  \n!![](img/CH08_F01_Evans2.png)\n\n图 8.1 命令式与函数式语言\n\n函数式语言的一个关键特性是一等函数——能够将函数视为值的能力，将其赋值给变量，将其传递给其他函数，甚至从其他函数返回函数。\n\
  \n这是我们之前讨论的特性谱谱的一个极佳例子，因为 `Java 8` 添加了 lambda 表达式语法，使 Java 程序员能够将函数视为值。然而，由于是最近添加的特性，该特性并未在平台所有可以使用的地方使用，而获取类似行为的旧技术（如\
  \ `Runnable` 和 `Callable` 接口）仍然在使用中。\n\n在接下来的两个章节中，我们将学习不同的语言，重点将是它们如何支持函数式编程方法。通过\
  \ `Kotlin`，我们将看到即使是命令式语言也可以设计成平滑地支持函数式思想。然后我们将查看 `Clojure`，这是一种纯粹得多的函数式语言，它完全不再以面向对象为中心。\n\
  \n### 8.1.4 重新实现与原生\n\nJVM 语言之间的另一个重要区别是，它们被分为现有语言的重新实现版本与专门针对 JVM 编写的语言。通常情况下，专门为目标\
  \ JVM 编写的语言其类型系统与 JVM 原生类型之间提供了更紧密的的绑定。\n\n以下三种语言是现有语言的 JVM 重新实现：\n\n- `JRuby` 是\
  \ `Ruby` 编程语言的 JVM 重新实现。`Ruby` 是一种带有某些函数式特性的动态类型面向对象语言。它基本上在 JVM 上被解释执行，但最近的版本包含了一个运行时\
  \ JIT 编译器，在良好的条件下生成 JVM 字节码。\n- `Jython` 由 Jim Hugunin 在 1997 年启动，目的是为了让 `Python`\
  \ 使用高性能的 Java 库。它是 `Python` 在 JVM 上的重新实现，因此是一个动态的、大部分面向对象的语言。它通过生成内部 Python 字节码然后将其转换为\
  \ JVM 字节码来运行。遗憾的是，该项目自 2015 年以来几乎没有活动，仅支持 `Python 2.7`，不支持当前的 `Python 3`。\n- `Rhino`\
  \ 最初由 Netscape 开发，后由 Mozilla 项目开发。它提供了 JVM 上的 `JavaScript` 实现并随 `JDK` 发布。\n    -\
  \ `JDK 8` 包含了一个新的 JavaScript 引擎 `Nashorn`（“Nashorn”这个名字是一个双关语——它是德语中“犀牛”的意思），但 JavaScript\
  \ 语言变化的日益加快迫使其在 `JDK 11` 中被废弃并在 `JDK 15` 中被移除。尽管未来的 JDK 将不再直接发布任何 JavaScript 实现，但这两者仍然可以独立地找到。（来自\
  \ Mozilla 的 `Rhino` ([`github.com/mozilla/rhino`](https://github.com/mozilla/rhino))\
  \ 和 `Nashorn` ([`openjdk.java.net/projects/nashorn/`](https://openjdk.java.net/projects/nashorn/))\
  \ 作为一个独立的 OpenJDK 项目，它们打算继续存在并并在未来的 JDK 上得到支持。）\n\n注意 最早的 JVM 语言？最早的非 Java JVM 语言很难确定。无疑，`Lisp`\
  \ 的实现 `Kawa` 可以追溯到 1997 年左右。在之后的这些年里，我们看到了语言的爆炸式增长，至于几乎无法追踪所有的语言。\n\n在写作时一个合理的估计是至少有\
  \ 200 种语言针对 JVM。并不是所有语言都能被认为是活跃或广泛使用的（有些确实非常小众），但大量的语言表明 JVM 是一个非常活跃的语言开发和实现平台。\n\
  \n注意 从 Java 7 开始的语言和虚拟机规范版本中，已经删除了所有对 Java 的直接引用。Java 现在只是运行在 JVM 上的许多语言之一。\n\n\
  ## 8.2 JVM 上的多语言编程\n\n*JVM 上的多语言编程*这一术语被用来描述使用一种或多种非 Java 语言以及 Java 代码核心的项目。考虑多语言编程的一种常见方式是将其视为关注点分离的形式。如图\
  \ 8.2 所示，可能存在三层，非 Java 技术可以在其中发挥作用。这张图有时被称为多语言编程金字塔，它最初源于 Ola Bini 的工作 ([`olabini.com/blog/tag/polyglot/`](https://olabini.com/blog/tag/polyglot/))。\n\
  \n!![](img/CH08_F02_Evans2.png)\n\n图 8.2 多语言编程金字塔\n\n金字塔内部，依赖关系单向运行——稳定层相对独立，动态层使用稳定层，而领域特定代码可以引入下面。\n\
  \n在给定系统中定义这些层并不总是容易；存在灰色区域，而且并非所有系统都完美契。然而，它是识别缝隙的有用工具，系统的不同部分有不同的需求并可以从不同的语言中受益。\n\
  \n稳定层包含系统的核心 API 和抽象。类型安全、彻底测试和性能都至关重要。\n\n\n\n\n动态层利用稳定层的抽象来创建一个运行系统。这可能包括一些代码，例如系统如何通过\
  \ HTTP 暴露自身或与其他后端系统交互。编译时间、灵活性等问题可能使得在动态层考虑不同的语言是值得的。\n\n领域特定层处理与应用程序特定的关注点，如表示层、规则和处理的自定义或\
  \ CI/CD。这些代码完全围绕于应用领域的特定方面，并可能从那些在其他层中被认为具有局限性的语言选择中获益。\n\n**注意**：混合语言编程（Polyglot\
  \ programming）是有意义的，因为不同的代码具有不同的生命周期。银行的风险计算引擎可能持续五年或更久。网站的 JSP 页面可能持续几个月。初创公司最短的代码可能只运行几天。代码的寿命越长，它就越接近金字塔的稳定层。见表\
  \ 8.1。\n\n### 表 8.1 混合语言编程金字塔的三层\n\n| 名称 | 描述 | 示例 |\n| --- | --- | --- |\n| 领域特定\
  \ (Domain-specific) | 领域特定语言。与应用领域的特定部分紧密耦合 | Apache Camel, DSLs, Drools, web 模板\
  \ |\n| 动态 (Dynamic) | 功能的快速、高效、灵活的开发 | Clojure, Groovy, JRuby |\n| 稳定 (Stable) |\
  \ 核心功能、稳定、经过良好测试、高性能 | Java, Kotlin, Scala |\n\n如你所见，层之间会出现模式——静态类型语言倾向于稳定层中的任务。相反，旨在用于更具体目的的技术往往更适合位于金字塔顶端的角色。\n\
  \n让我们深入探讨一下，为什么 Java 并不是金字塔中所有内容的最佳选择。我们将首先讨论为什么你应该考虑非 Java 语言，然后我们将涵盖在为你的项目选择非\
  \ Java 语言时需要考虑的一些主要标准。\n\n#### 8.2.1 为什么要使用非 Java 语言？\n\nJava 作为一种通用的、静态类型的、编译型语言的本质提供了许多优势。这些特性使其成为实现稳定层功能的极佳选择。但正如此处描述的，这些相同的属性在金字塔的上层会变成负担：\n\
  \n- 重新编译耗时费力。\n- 静态类型可能缺乏灵活性。\n- 部署是一个重量级过程。\n- Java 的语法可能很生硬，并且不自然适合生成 DSL。\n\n\
  Java 项目的重新编译和重新构建时间通常达到 90 秒到两分钟的关口。这段时间足以严重中断开发者的心流，而且对于开发可能在生产环境中只运行几周的代码来说并不合适。\n\
  \n##### Java 生硬的语法\n\nJava 语言具有非常生硬的语法。基础语言组件是提供的关键字。你不能“发明新语法”或创建任何可能被误认为是关键字的新形式。\n\
  \n程序员可以创建新类，而这些类的能力包括在字段中存储状态以及在类或对象上调用方法。然而，这仅此于此了——程序员无法创建任何类似于控制结构的结构。换句话说，字段访问始终看起来如下所示：\n\
  \n```\nanObject.someField\nAClass.someStaticField\n```\n\n而方法调用始终像这样：\n\n```\nanObject.someMethod(params)\n\
  AClass.someStaticMethod(params)\n```\n\n在 Java 中，方法参数永远不是可选的（不像 Kotlin 等其他一些语言），因此即使是字段访问和方法调用之间的区别也无法模糊。例如，我们无法创建看起来像关键字的构造。例如，我们希望能够创建一个像这样的\
  \ `when`：\n\n```\nwhen(value) {\n  // 要执行的操作\n}\n```\n\n但我们能做的最好的是类似这样的东西：\n\n```\n\
  import static when.When.when;\n\n...\n\nwhen(value, () -> {\n  // 要执行的操作\n});\n\
  ```\n\n这种对可重定义语法的缺乏在尝试使用 Java 制作 DSL 时也显现出来。我们将在接下来的两个章节中看到我们的非 Java 语言是如何处理这个问题的。\n\
  \n总的来说，一种务实的解决方案是发挥 Java 的优势。利用其丰富的 API 和库支持，为稳定层中的应用程序完成繁重工作。\n\n即使在稳定层内部，你可能发现由于某些原因使得除\
  \ Java 之外的语言可能是理想的，例如：\n\n- Java 的冗长可能会让某些开发者感到反感，并且它可能会隐藏某些类的 bug。\n- 虽然 Java 越来越多地支持函数式编程，但在应用某些模式的易用性方面存在限制。\n\
  - 其他语言提供了 Java 中不具备的并发替代方案（Kotlin 的协程，Clojure 的代理）。\n\n**注意**：即使你为了某些支持的特性在稳定层选择另一种语言，你也不应该为了让语言匹配而丢弃正在运行的代码。考虑将新语言用于新功能，或用于我们在本章稍后将识别的低风险领域。\n\
  \n到此，你可能会问自己：什么类型的编程挑战适合这些层？我应该选择哪些语言？一个基础扎实的 Java 开发者知道没有万能灵药，但在评估你的选择时，我们确实有需要考虑的标准。\n\
  \n#### 8.2.2 兴起的语言\n\n在书的剩余部分，我们挑选了两种我们认为具有巨大潜力寿命和影响力的语言。这些是 JVM 上的两种语言（Kotlin 和\
  \ Clojure），它们在混合语言编程师中已经建立了良好的心理认同。为什么这些语言正在受到关注？让我们逐一查看。\n\n##### Kotlin\n\nKotlin\
  \ 是由 JetBrains（IntelliJ IDEA 的制作者）的一种命令式、静态类型、面向对象的语言。它旨在解决对 Java 最常见的抱怨，同时保持熟悉的开发环境。Kotlin\
  \ 是一种编译语言，除了仅运行在 JVM 上提供的基础功能外，它具有高度的兼容性。\n\nKotlin 的关键特性包括简洁的语法、`null` 安全、与 Java\
  \ 代码极强的互操作性以及协程——一种相对于 Java 传统线程模型的替代并发机制。Kotlin 的许多功能已经在最近的发布中回到了 Java，证实了这些变化为开发者带来的价值。\n\
  \n尽管它已经在多个领域确立了其作为关键 JVM 语言的地位，但 Kotlin 在移动领域取得了特别成功，Android 平台在 2019 年将其采用为推荐语言。Kotlin\
  \ 在 Gradle 构建脚本方面的支持也与 Groovy 同级。它还被许多其他框架（如 Spring）所采用。无论你的 JVM 在何处运行，开发者都会考虑这些广泛的便利性和安全性改进。第\
  \ 9 章将介绍 Kotlin。\n\nKotlin 将在第 11 章用作 Gradle 构建的主要脚本语言。我们还将在第 15 章重新回到它，以演示函数式编程的一些独特方法，并在第\
  \ 16 章演示并发编程（协程）。\n\n##### Clojure\n\nClojure 由 Rich Hickey 设计，是 Lisp 家族的一种语言。它从该传统继承了许多语法特征（以及大量的括号）。它是一种动态类型的函数式语言，正如\
  \ Lisp 一样如此。它是一种编译语言，但由于我们稍后看到的原因，通常以源码形式分发代码。它还在其 Lisp 核心增加了大量的新功能（特别是在并发领域）。\n\
  \n\n\n\nLisp 语言通常被视为专家专用的语言。Clojure 比其他 Lisp 稍微容易学习，但它仍然为开发者提供了强大的力量（而且非常适合测试驱动开发风格）。但是，它可能仍然停留在主流之外，主要由爱好者使用，并用于专门的工作（例如，某些金融应用程序发现其特性的组合非常有吸引力）。\n\
  \nClojure 最好被看作是处于动态层中，但由于其对并发的支持以及其他特性，它可以被认为能够胜任稳定层语言的许多角色。第 10 章提供了 Clojure 的介绍。\n\
  \n在第 15 章中，我们将大量使用 Clojure 来学习超越 Java 能力范围的函数式编程。在第 16 章中，它将用于引入 Actor 模型，这是并发编程中一种强大的替代方案。\n\
  \n## 8.2.3 我们可以选择但没有选择的语言\n\n如前所述，存在许多语言供我们研究。这里是对其他几个竞争者的更多介绍，这些语言可能对你亲自深入研究具有实际价值。\n\
  \n### Groovy\nGroovy 语言由 James Strachan 在 2003 年发明。它是一种动态的编译语言，语法与 Java 非常相似但更灵活。它被广泛用于脚本编写和测试。它是\
  \ `Gradle` 构建工具最初使用的语言，并用于配置 `Jenkins`（一种极其常见的 CI/CD 工具）。它通常是开发者或团队在 JVM 上研究的首种非\
  \ Java 语言。Groovy 可以被看作是位于动态层，并且也以擅长构建 DSL（领域特定语言）而闻名。\n\n我们选择不详细介绍 Groovy，是因为面对框架和其他语言的不断改进，它在原型设计和应用用例中的关注度正在下降。\n\
  \n### Scala\nScala 是一种面向对象（OO）语言，同时也支持函数编程的许多方面。它的起源可以追溯到 2003 年，当时 Martin Odersky\
  \ 在学术环境中开始研究它，在此之前他进行过与 Java 泛型相关的项目。它像 Java 一样是静态类型编译语言，并且执行了大量的类型推断，因此它通常具有动态语言的感觉。\n\
  \nScala 从 Java 中学习了很多，它的语言设计“修复”了 Java 的几个常见烦恼。然而，Scala 最终拥有非常庞大的特性集，并且与 Java 相比拥有更先进的类型系统。\n\
  \n它的编程可能很复杂，而且并不容易彻底学会。因此，我们选择为只想改进 Java 语言状态的开发者关注 Kotlin。\n\n### GraalVM\nOracle\
  \ Labs 生产了 GraalVM ([`www.graalvm.org/`](https://www.graalvm.org/))，他们将其描述为一种多语言虚拟机和平台，部分源自\
  \ Java 和 JVM 代码库。当前版本包含了运行 Java 和其他 JVM 语言（作为字节码）的能力，并支持 JavaScript 和 LLVM 字节码（来自流行的\
  \ LLVM 编译器的中间表示），以及对 Ruby、Python、R 和 WASM 的 Beta 版支持。\n\n整个平台包含以下组件：\n*   Java HotSpot\
  \ VM\n*   `Node.js` JavaScript 运行时环境\n*   执行 `LLVM` 字节码的 `LLVM` 运行时\n*   `Graal`——一个用\
  \ Java 编写的 JIT 编译器\n*   `Truffle`——用于构建语言解释器的工具箱和 API\n*   `SubstrateVM`——用于原生镜像的轻量级执行容器\n\
  \n在 GraalVM 项目中，语言可以非常自由地相互桥接，目标是允许在不同技术上实现的组件组合并在单个应用程序进程中使用。这是一种非常不同的多语言编程方法，但它与感兴趣的主题足够接近，以至于我们至少提到它。\n\
  \n### 非 JVM 语言\n本章关注运行在 JVM 上的替代语言。但必须承认，有时多语言编程人员可能有理由让其系统的部分部分完全离开 JVM。\n\n以下是\
  \ JVM 之外有更广泛支持的技术示例：\n*   原生系统代码 (C, Go 或 Rust)\n*   机器学习 (Python)\n*   运行在用户的 Web\
  \ 浏览器中 (JavaScript)\n\n尽管对于这些许多领域存在基于 JVM 的方法，但在尝试将每行代码完全保留在 JVM 上之前，评估替代方案的成熟度和我们团队的组成是值得的。\n\
  \n现在我们已经概述了一些可能的选择，让我们讨论一下应该驱动你选择何种语言的问题。\n\n## 8.3 如何为你的项目选择非 Java 语言\n\n一旦你决定在项目中使用尝试非\
  \ Java 语言，你就需要确定项目的哪些部分自然适合稳定层、动态层或领域特定层。表 8.2 列出了可能适用于每一层的任务。\n\n表 8.2 适用于领域特定、动态和稳定层的项目区域\n\
  \n| 名称 | 示例问题领域 |\n| --- | --- |\n| 领域特定 | 领域特定区域通常受益于可能不知道 Java 的专家提供的可读性。软件生命周期工具也经常具有领域特定语言和配置。\
  \ | 构建、持续集成、持续部署 Dev-ops 业务规则建模 |\n| 动态 | 系统的动态层可能受益于其他语言提供的更大灵活性开发速度。这对于内部面对的工具（测试和管理）可能尤为真实。\
  \ | 快速 Web 开发 原型设计 交互式管理和用户控制台 脚本编写 测试 |\n| 稳定 | 稳定层代码表达系统的核心抽象。更严谨的类型安全和测试值得额外的开发投入。\
  \ | 并发代码 容器 核心业务功能 |\n\n正如你所见，替代语言的应用场景广泛。但识别出可以使用替代语言解决的任务仅仅是开始。接下来你需要评估使用替代语言是否合适。以下是我们在考虑技术栈时会考虑的一些有用标准：\n\
  *   项目区域风险低吗？\n*   该语言与 Java 的互操作性如何？\n*   该语言有多少种工具支持（例如 IDE 支持）？\n*   该语言的学习曲线有多陡？\n\
  *   招聘具有该语言经验的开发者有多容易？\n\n让我们深入这些这些领域，以便你了解需要问的问题类型。\n\n### 8.3.1 项目区域风险低吗？\n\n\
  假设你有一个核心支付处理规则引擎，每天处理数百万次交易。这是一个运行了七年的稳定 Java 软件，但没有很多测试，代码中存在许多“黑角”。支付处理引擎的核心显然是一个引入新语言的高风险区域，特别是当它运行良好，但缺乏测试覆盖和充分理解它的开发人员时。\n\
  \n但一个系统不仅仅是核心处理。例如，在这种情况下，更好的测试显然会有帮助。Kotlin 有许多很好的选择，包括 `Spek` 框架 ([`www.spekframework.org/`](https://www.spekframework.org/))\
  \ 和 `Kotest` ([`kotest.io`](https://kotest.io))，它们利用语言实现了清晰、可读的规范，而无需典型的 JUnit 样板代码。或者你的规则引擎可能受益于属性测试，即编写测试来对生成的输入进行验证条件，而\
  \ Clojure 的 `test.check` ([`clojure.org/guides/test_check_beginner`](https://clojure.org/guides/test_check_beginner))\
  \ 将是其中非常有价值的工具。\n\n\n\n\n或者假设你需要构建一个 Web 控制台，以便运维用户管理支付处理系统后的一些非关键静态数据。开发团队的成员已经熟悉\
  \ `Struts` 和 `JSF`，但对这两种技术都不感兴趣。这是另一个可以尝试新语言和新技术栈的低风险领域。使用带有 `Kotlin` 的 `Spring\
  \ Boot` 是显而易见的选择之一。\n\n通过低风险领域专注于进行小范围试点，如果新技术栈不合适，始终可以选择终止项目并迁移到不同的交付技术，而不会产生太大的扰动。\n\
  \n### 8.3.2 该语言与 Java 的互操作性好吗？\n\n你可不想丢失已经写过的那些极佳 Java 代码的价值！这是组织不愿向其技术栈中引入新编程语言的主要原因之一。但通过运行在\
  \ `JVM` 上的替代语言，你可以扭转这一局面，使其变为最大化现有代码库的现有价值，而不是丢弃正在运行的代码。\n\n`JVM` 上的替代语言能够与 `Java`\
  \ 进行整洁的互操作，并且当然可以部署在现有的环境中。这对于避免影响部署的所有者尤为重要，无论是生产管理团队还是你自己团队的 DevOps 人员。通过将非 Java\
  \ `JVM` 语言作为系统的一部分，你保留了组织的运营专业知识，这有助于缓解对支持新解决方案的担忧并降低风险。\n\n注意 DSL（领域特定语言）通常使用动态（或在某些情况下是稳定的）层语言构建，因此许多\
  \ DSL 是通过其构建时所使用的语言运行在 `JVM` 上。\n\n某些语言与 `Java` 的互操作比其他语言更容易。我们发现，大多数流行的 `JVM` 替代方案（如\
  \ `Kotlin`、`Clojure`、`JRuby`、`Groovy` 和 `Scala`）都与 `Java` 具有良好的互操作性（对于某些语言来说，集成非常出色，几乎完全无缝）。如果你是一家非常谨慎的机构，先运行几次实验是快速且容易的，以确保你理解这种集成如何为你提供服务。\n\
  \n以 `Kotlin` 为例。你可以通过熟悉的 `import` 语句直接在代码中导入 `Java` 包。从这里，你可以轻松地编写一个小的 `Kotlin`\
  \ 脚本，甚至使用交互式 `Kotlin` shell 来探测你的 `Java` 模型对象，并查看互操作界面的样子。我们将在接下来的语言章节中专门讨论与 Java\
  \ 的互操作性。\n\n### 8.3.3 该语言是否有良好的工具链和测试支持？\n\n大多数开发者都低估了一旦他们熟悉了环境后所节省的时间。他们强大的 IDE\
  \ 以及构建和测试工具帮助他们快速产出高质量的软件。`Java` 开发者多年来一直受益于出色的工具支持，因此记住其他语言的成熟度可能尚未达到同一水平是很重要的。\n\
  \n某些语言（如 `Kotlin`）长期以来一直拥有编译、测试和部署最终结果的 IDE 支持。其他语言可能拥有但尚未完全成熟的工具链。\n\n一个相关问题是，当一种替代语言为自身使用开发了强大的工具时（例如\
  \ `Clojure` 极佳的 `Leiningen` 构建工具），该工具可能不恰好于处理其他语言。因此，团队将需要仔细考虑如何划分项目，特别是对于独立但相关的组件的部署。\n\
  \n### 8.3.4 该语言学习困难吗？\n\n学习一种新语言总是需要时间的，如果该语言的范式不是开发团队所熟悉的，那么这段时间只会增加。大多数 `Java`\
  \ 开发团队如果发现语言是具有类 C 语法的面向对象语言（如 `Kotlin`），将很轻松地上手一种新语言。\n\n随着 `Java` 开发者远离这种范式越远，学习就变得越困难。在流行替代语言的极端，像\
  \ `Clojure` 这样的语言可以带来极其强大的益处，但它对开发团队来说也代表了重大的再培训需求，因为他们需要学习 `Clojure` 的函数式特性和 Lisp\
  \ 语法。\n\n另一种方案是查看对现有语言重新实现的 `JVM` 语言。`Ruby` 和 `Python` 是成熟的语言，有大量的材料供开发者使用来自学。这些语言的\
  \ `JVM` 版本可以为你的团队提供一个切入点，让他们开始使用一种易于学习的非 Java 语言。\n\n### 8.3.5 是否有大量开发者在使用这种语言？\n\
  \n组织必须务实；他们并不能总是聘到顶前 2% 的人才（尽管他们的广告可能是这么说的），而且他们的开发团队在一年之中会变化。某些语言（如 `Kotlin` 或\
  \ `Scala`）已经变得足够成熟，有可以招聘的人才池。但像 `Clojure` 这样的语言可能会带来更多困难。经理可能会因为担心创建难以维护且难以招聘相关人员的代码库，而反对使用这种不寻常的东西。\n\
  \n注意，有一条关于重新实现语言的警告：例如，许多用 `Ruby` 编写的现有包和应用程序仅针对原始的 C 实现进行了测试。当尝试在 `JVM` 之上使用它们时可能会出现问题。在做出平台决策时，如果你计划利用用重新实现的语言编写的整个堆栈，你应该考虑额外的测试时间。\n\
  \n再次，重新实现的语言（`JRuby`、`Jython` 等）可能在此处提供帮助。很少有开发者简历上会有 `JRuby`，但因为只是运行在 `JVM` 上的\
  \ `Ruby`，所以实际上有一个庞大的人才池可以招聘——熟悉 C 版本的 `Ruby` 开发者可以非常容易地学习运行在 `JVM` 上所引起的差异。\n\n\
  我们现在有一系列在选择替代语言时要问的问题，以及对一些可用选项的概述。此时，深入理解 `JVM` 如何支持多种语言是值得的。这一视角揭示了替代语言中某些设计选择和局限性的根源。\n\
  \n## 8.4 JVM 如何支持替代语言\n\n语言可以通过两种方式运行在 `JVM` 上：\n\n* 拥有一个产生类文件的源代码编译器。`Kotlin` 和\
  \ `Clojure` 都是以这种方式工作的。\n* 拥有一个用 JVM 字节码实现的解释器。`JRuby` 是通过这种方式实现的。\n\n在这两种情况下，通常都会有一个提供执行程序特定语言支持的运行时环境。图\
  \ 8.3 显示了 `Java` 和典型的非 Java 语言的运行时环境栈。\n\n这些运行时支持系统的复杂性各异，取决于给定的非 Java 语言在运行时需要多少“引导”。在几乎所有情况下，运行时将实现为一组\
  \ `JAR` 包或模块，执行中的程序需要在类路径中拥有这些模块。在解释器的情况下，解释器将在程序执行启动时引导，然后读取要执行的源码。\n\n### 8.4.1\
  \ 性能\n\n开发者经常问关于不同语言的问题是：它们之间的性能如何？虽然这个问题表面上很有吸引力，但它并不容易回答，事实上，它并没有真正的意义。\n\n正如我们在第\
  \ 7 章所看到的，基础良好的开发者知道性能是由测量驱动的。测量是针对单个程序进行的，而不是针对编程语言的抽象概念。对于任何声称语言 X 性能优于 Y 但没有附带可靠数据的的说法，都应持怀疑态度。\n\
  \n\n\n\n然而，在实践中，JVM 语言的某些整体性能特征很大程度上可以通过该语言的实现方式来确定。编译型语言在运行时仅仅是字节码，并且会像 Java 一样被\
  \ JIT 编译。解释型语言的性能行为会有非常大的不同，因为被 JIT 编译的代码是解释器，而不是程序本身。\n\n注意：某些语言（例如 `JRuby`）采用了混合策略——它们拥有用于脚本的解释器，但也可以动态地将单个源方法编译为\
  \ JVM `bytecode`，然后这些字节码可以由 JVM 的 JIT 编译器编译为机器码。\n\n在本书中，我们的重点是编译型语言。提到解释型语言（如 `Rhino`）是为了保持描述的完备性，但我们不会在它们上花费太多时间。因此，我们预计我们所考虑的语言之间的性能大致是相似的。要获得更详细的答案，您应该对特定的程序或工作负载进行详细的分析。\n\
  \n在本节的剩余部分中，我们将讨论对替代语言（即使是编译型语言）运行时支持的需求，然后讨论编译器虚构（compiler fictions）——即由编译器合成的特定语言特性，这些特性可能不会出现在底层字节码中。\n\
  \n### 8.4.2 非 Java 语言的运行时环境\n\n衡量特定语言所需的运行时环境复杂性的一种简单方法，是查看提供运行时运行的 `JAR` 文件的大小。以此作为指标，我们可以看到\
  \ `Clojure` 是一个相对轻量级的运行时，而 `JRuby` 是一个需要更多支持的语言。\n\n这并不是一个完全公平的测试，因为某些语言在其标准分发中包含了比其他语言大得多的标准库和其他功能。然而，这可以作为一个有用的（尽管是粗略的）法则。\n\
  \n通常，运行时环境的目的是帮助类型系统和非 Java 语言的其他方面实现预期的语义。替代语言对基本编程概念的看法并不总是与 Java 完全相同。\n\n例如，Java\
  \ 处理面向对象（OO）的方法并不被其他语言所普遍认同。在 Java 中，所有作为特定 `class` 实例的对象都具有 set 完全相同的方法集合，并且该集合在编译时就已经固定了。相比之下，在\
  \ `Ruby` 中，单个对象实例可以在运行时为其附加额外的方法，这些方法在定义 `class` 时是未知的，而且并不一定定义在同一 `class` 的其他实例上。\n\
  \n注意：`invokedynamic` 字节码实际上最初被添加到 JVM 中，是为了便于高效实现这些类型的语言特性。\n\n这种动态添加方法的能力（某种程度上混淆地称为“开放类”）需要通过\
  \ `JRuby` 实现来实现。这只有在 `JRuby` 运行时的一些高级支持下才是可能的。\n\n### 8.4.3 编译器虚构\n\n某些语言特性由编程环境和高级语言合成，并不存在于底层的\
  \ JVM 实现中。这些被称为编译器虚构（compiler fictions）。\n\n注意：了解这些特性如何实现会有帮助，由于某些语言特性在 Java 引入\
  \ lambda 表达式之前通过编译器虚构实现了，例如在 8.2 节所示。如果你在 `JAR` 文件中看到带有 `$` 符号的类，它们是内部类转换而普通类。\n\
  \n![](img/CH08_04.png) 图 8.4 内部类作为编译器虚构\n\n替代语言也使用了 `invokedynamic` 来实现某些编译器虚构。这是编译器虚构影响平台现实的一个有趣案例。\n\
  \n另一个例子，在下一章我们将遇到 Kotlin 的数据类——这种语言特性有助于减少声明仅仅是字段集合的类时所需的类型工作和仪式感。在目前的 Kotlin 中，这是一个编译器虚构，但\
  \ Java 17 引入了名为 `record` 的特性，这可能会为 Kotlin 构建数据类提供另一种基础。\n\n总结\n\n* JVM 上的替代语言已经取得了进步，为某些问题提供了比\
  \ Java 更好的解决方案。\n* 语言可以通过多种方式分类（静态与动态、命令式与函数式、以及编译与解释），这有助于为特定任务选择合适的语言。Java 和 Kotlin\
  \ 最适用于软件开发的稳定层。Clojure 可能更适合动态或特定领域的任务。\n* 团队和项目具有独特的特性，这将影响语言选择。这里没有通用的正确答案。\n\
  * 在现有应用程序的核心业务功能中引入新语言几乎不是正确的地方。选择一个低风险区域作为替代语言首次部署。\n\n# Kotlin\n\n本章涵盖\n\n* 为什么使用\
  \ Kotlin？\n* 方便与简洁\n* 安全\n* 并发\n* 与 Java 的互操作性\n\nKotlin 是由 JetBrains ([`jetbrains.com`](https://jetbrains.com))\
  \ 创建的语言，它是流行的 IntelliJ IDEA 的开发者。Kotlin 于 2011 年公开发布，旨在解决他们在开发 Java 时感受到的语言缺陷，同时避免了他们在其他现有\
  \ JVM 语言上看到的摩擦。\n\n\n\nKotlin 在次年开源，并在 2016 年达到了 1.0 版本——由 JetBrains 提供保证级别的支持和维护。从那时起，它成为了\
  \ Android 平台的推荐语言，并在其他 JVM 编码圈中聚集了大量的忠实粉丝。2018 年宣布的 Kotlin Foundation 为该语言提供了来自\
  \ JetBrains 和 Google 的长期支持。Kotlin 甚至扩展到了 JVM 之外，支持 JavaScript 和原生后端。\n\n## 9. 为什么使用\
  \ Kotlin？\n\n作为替代语言，Kotlin 与 Java 相比提供了许多生活质量的改进，同时没有从根本上改变整个世界。它对便利性、安全性和稳健互操作性的关注，使其在现有\
  \ Java 项目中进行增量使用时具有极佳的表现。由于 `IntelliJ IDEA` 的原生支持，将文件从 Java 转换为 Kotlin 通常只需要点击一下即可。\n\
  \n值得注意的是，某些最初仅在 Kotlin 中可用的特性已经回到了 Java。一个很好的例子是 Kotlin 脚本（Kotlin script）——Kotlin\
  \ 可以直接运行源文件（通常带有 `kts` 扩展名），无需开发者请求进行编译。如果这听起来像我们在第 1 章中展示的 Java 11 单文件功能，那么你没有没错！\n\
  \n在本章之后，我们将在第 11 章利用对 Kotlin 的新熟悉，将其作为 `Gradle` 构建的主要脚本语言。我们将在第 15 章再次回到它，那里我们将研究\
  \ JVM 上的函数编程；在第 16 章，Kotlin 内置的协程机制为 Java 的经典多线程提供了极具竞争力的替代方案。让我们来看看 Kotlin 能为我们提供什么。\n\
  \n### 9.1. 安装\n\n如果你使用 `IntelliJ IDEA`，Kotlin 是通过插件提供的。安装后，你就可以直接开始编写 Kotlin 代码，就像使用\
  \ IDE 中任何其他支持的语言一样。\n\n对于那些更倾向于精简配置的人来说，Kotlin 还提供了一个命令行编译器 `kotlinc`（参见 [`mng.bz/YGoa`](http://mng.bz/YGoa)）和交互式外壳\
  \ `kotlin`。\n\n将 Kotlin 添加到现有项目需要更新你的构建脚本。第 11 章将让你更熟悉这些系统，但目前，你可以参考 Kotlin 出色的文档来开始使用\
  \ `Maven` ([`mng.bz/GEYJ`](http://mng.bz/GEYJ)) 或 `Gradle` ([`mng.bz/z4vA`](http://mng.bz/z4vA))。准备好运行\
  \ Kotlin 后，探索的好起点是了解它的基本特性是如何工作并改进 Java 的。\n\n## 9.2. 便利与简洁\n\nJava 有着冗长的声誉。尽管它保留了与\
  \ Java 许多视觉上的相似性，但 Kotlin 不断精简了你必须编写的代码。\n\n### 9.2.1. 从更少开始\n\n其精简特性的一个例子是简单的字符：分号。Kotlin\
  \ 不需要在行尾使用分号，允许用典型的换行符来代之。分号是被允许的——事实上，如果你想将多个语句放在同一行，它是必须的——但大多数情况下，是不需要的。\n\n\
  Kotlin 利用它的空白改变了其他在 Java 中难以更改的默认设置。尽管 Java 默认只导入 `java.lang`，但 Kotlin 在任何地方都提供以下包：\n\
  \n* `java.lang.*`\n* `kotlin.*`\n* `kotlin.annotation.*`\n* `kotlin.collections.*`\n\
  * `kotlin.comparisons.*`\n* `kotlin.io.*`\n* `kotlin.ranges.*`\n* `kotlin.sequences.*`\n\
  * `kotlin.text.*`\n* `kotlin.jvm.*`\n\n很少有程序不需要集合、文本或 IO，因此这些包含项节省了许多不必要的导入。\n\n\
  Java 的冗长经常出现的一个地方是类型——我们在第 1 章中已经看到 `var` 关键字如何减少了类型信息的重复。Kotlin 从一开始就具有这种类型推断风格，尽管这远非是该想法的唯一来源。\n\
  \n### 9.2.2. 变量\n\n在引入变量时，Kotlin 甚至使用了与较新 Java 版本相同的关键字：`var`。它将根据右侧的表达式推断变量应该使用什么类型，如下：\n\
  \n```\nvar i = 1          ❶\nvar s = \"String\"   ❷\n```\n\n❶ `i` 的类型是 `kotlin.Int`。\n\
  \n❷ `s` 的类型是 `kotlin.String`。\n\n与 Java 不同，在 Kotlin 中 `var` 不仅仅是一个快捷方式。如果你想显式指定变量的类型，`var`\
  \ 仍然存在，但类型位于变量名之后，如下一个代码段所示。这有时被称为类型提示：\n\n```\nvar i: Int = 1\nvar s: String =\
  \ \"String\"\nvar n: Int = \"error\"        ❶\n```\n\n❶ 此次赋值将导致编译错误，错误：类型不匹配：推断类型为\
  \ String 但期望为 Int。\n\n在 Kotlin 中，`var` 有一个伙伴 `val` 关键字。用 `val` 声明的变量是不可变的，赋值后无法写入。它等同于\
  \ Java 中的 `final var`——对于任何预期不会重新赋值的变量，这是一个高度推荐的默认设置。Kotlin 巧妙地让这种安全设置变得与可变选项一样简洁，如下所示：\n\
  \n```\nvar i = 1\ni = 2              ❶\n\nval s = \"String\"\ns = \"boom\"     \
  \    ❷\n```\n\n❶ `var` 变量允许重新赋值。\n\n❷ 编译错误，错误：val 不能重新赋值。\n\n`var` 和 `val` 在 Kotlin\
  \ 中一贯地用于变量和参数。这种默认偏于不可变性的主题也是 Kotlin 的一个关键设计因素，我们将在整个语言中反复看到。\n\n一旦我们有了变量，自然想要比较它们。Kotlin\
  \ 在相等性方面为我们提供了一些值得了解的新帮助。\n\n### 9.2.3. 等于\n\n许多 Java 程序中的一个常见错误在如下代码所示：\n\n```java\n\
  // Java\nString s = retrieveString();   ❶\nif (s == \"A value\") {\n    // ... \
  \                    ❷\n}\n```\n\n❶ 从某处接收一个字符串。注意，字符串字面量实际上可能会被池（interned）到同一个对象，这为错误的比较提供了虚假的安全感。\n\
  \n❷ 即使使用了相同的值但不同的引用也不会到达这里\n\n我们很快学会了 Java 中的 `==` 比较的是引用而不是值，所以它并不像你在许多其他语言中预期的那样工作。\n\
  \nKotlin 消除了这一特性，并在 `String` 等常见类型上将 `==` 视为值等价。实际上，调用 `==` 等同于对 `equals` 进行空安全的调用。这针对更常见的编程情况进行了优化，并避免了\
  \ Java 编程中巨大的错误来源，如下：\n\n```kotlin\n// Kotlin\nvar s: String = retrieveString()\n\
  if (s == \"A value\") {\n    // ...                        ❶\n}\n```\n\n❶ 如果 s 的值是“A\
  \ value”，则会到达这里\n\n在少数情况下，你可能仍理由比较引用。当这些情况出现时，Kotlin 的 `===`（以及它的组合 `!==`）提供了 Java\
  \ 用于 `==` 和 `!=` 的行为。比较变量是重要的，但如果你不需要调用其他代码或定义自己的子程序，你就不会走远。\n\n### 9.2.4. 函数\n\n\
  有时在说话时，我们交替使用“函数”（function）和“方法”（method）这两个术语，但事实上，Java 只有方法——你不能在类的上下文之外定义可重用的代码块。尽管\
  \ Kotlin 支持 Java 的所有面向对象特性——我们将在接后的章节中看到——它也意识到有时你只是想要一个独立的函数。\n\n遵循 Kotlin 的简洁原则，一个最简的函数定义如下：\n\
  \n```kotlin\nfun doTheThing() {    ❶\n  println(\"Done!\")\n}\n```\n\n❶ `fun` 在\
  \ Kotlin 中定义函数。当我们定义附加到类的方法时，将再次看到它。\n\n\n\n这看起来和 Java 的做法略有不同，但仍然非常容易识别。除了用于开始声明的\
  \ `fun` 关键字外，最大的区别在于缺少返回类型。在 Kotlin 中，如果你的函数不返回任何内容，与其显式地声明 `void`，你可以什么都不写，此时返回类型被视为\
  \ `Unit`（Kotlin 表达“无返回值”的方式）。\n\n如果我们确实想返回一个值，我们必须直接声明，如下所示：\n\n```kotlin\nfun doTheThing():\
  \ Boolean {   ❶\n  println(\"Done!\")\n  return true                 ❷\n}\n```\n\
  \n❶ 声明我们的函数返回类型 `Boolean`\n\n❷ 返回我们的成功结果\n\n如果不接受参数，函数的用处不大。Kotlin 处理此点的语法看起来非常像变量声明，如下所示：\n\
  \n```kotlin\nfun doTheThing(value: Int): Boolean {   ❶\n  println(\"Done $value!\"\
  )               ❷\n  return true\n}\n```\n\n❶ 我们的函数现在接受一个 `Int` 类型的单一参数。\n\n❷ 参数像局部定义的变量一样出现在函数内部。在这里，我们在\
  \ Kotlin 方便的字符串插值中使用了一个参数。\n\n尽管如此，Kotlin 中简单的函数定义也包含了一些小技巧。有时，函数的参数顺序可能不清楚，特别是当参数之间的类型匹配时，如下例所示：\n\
  \n```kotlin\nfun coordinates(x: Int, y: Int) {\n  // ...\n}\n```\n\n当我们调用这个函数时，我们必须记住参数的顺序——`x`\
  \ 在于 `y` 之前——否则可能会产生 bug。Kotlin 通过`命名参数`解决了这个问题，如下所示：\n\n```kotlin\nfun coordinates(x:\
  \ Int, y: Int) {\n  // ...\n}\n\ncoordinates(10, 20)           ❶\ncoordinates(y\
  \ = 20, x = 10)   ❷\n```\n\n❶ 对函数的普通位置调用\n\n❷ 尽管重新调整了参数顺序，此调用的结果相同。\n\n在调用 Java\
  \ 函数时，或者相反，当从 Java 调用 Kotlin 函数时，不能使用命名参数。为了这一点，字节码中并没有保留参数名称。此外，在 Kotlin 中修改参数名可能被视为破坏性变更（breaking\
  \ change），而在 Java 中，只有类型或参数顺序的变化才会引起问题。\n\n有时候不需要向函数传递所有参数——因为存在合理的默认值。在 Java 中，我们通过方法重载来实现这一点。在\
  \ Kotlin 中，我们可以使用更直接的方法处理默认值，如下所示：\n\n```kotlin\nfun callOtherServices(value: Int,\
  \ retry: Boolean = false) {\n  // ...\n}\n\ncallOtherServices(10)   ❶\n```\n\n❶\
  \ 得益于默认值，函数中的 `retry` 为 `false`。\n\n我们不需要为 `callOtherServices` 提供多个定义（一个单参数，另一个双参数），而是可以将所有相关部分保持在一个函数中，而无需编写样板代码。Kotlin\
  \ 另一种常见的语法支持是单行函数，如下文所示：\n\n```kotlin\nfun checkCondition(n: Int) = n == 42\n```\n\
  \n这种格式之所以更短，不仅是因为使用 `=` 取代了大括号，还因为有了类型推断。返回类型可以省略，Kotlin 将自动推断表达式的类型。\n\n`一等函数`\
  \ 在 Kotlin 中的函数可以作为参数传递、存储在变量中，并从其他函数返回。尽管 Kotlin 不被认为是函数式语言，但对一等函数的支持让 Kotlin 能够受益函数式编程中的许多常见模式。\n\
  \n将函数赋值给变量有几种形式，取决于函数的来源。如果我们之前已经声明了该函数，可以使用 `::` 运算符通过名称引用它：\n\n```kotlin\nfun\
  \ checkCondition(n: Int) = n == 42\nval check = ::checkCondition\n```\n\nKotlin\
  \ 还有 `lambda 表达式` 语法来动态创建匿名函数：\n\n```kotlin\nval anotherCheck = { n: Int -> n >\
  \ 100 }\n```\n\n无论如何赋值，对函数的引用都可以像变量名本身就是函数名一样被调用。或者，也可以可以使用 `invoke` 函数，如下所示，这样更清晰：\n\
  \n```kotlin\nprintln(check(42))                 ❶\nprintln(anotherCheck.invoke(42))\
  \   ❷\n```\n\n❶ 运行我们之前声明并捕获在变量 `check` 中的 `checkCondition` 并打印 true\n\n❷ 运行我们的 lambda\
  \ 检查是否大于 100 并打印 false\n\n我们并不局限于将函数赋值给局部变量。我们可以像传递任何其他值一样将其传递给其他函数。这是一等函数语言的关键属性之一。\n\
  \n正如我们之前看到的，Kotlin 要求在声明参数时指定类型。函数也不例外，有特定的语法来表示函数类型，如下所示：\n\n```kotlin\nfun callsAnother(funky:\
  \ (Int) -> Unit) {        ❶\n  funky(42)                                     \n\
  }\n\ncallsAnother({ n: Int -> println(\"Got $n\") })   ❸\n```\n\n❶ `callsAnother`\
  \ 接受一个参数，该参数是一个接收 `Int` 不返回内容的函数。\n\n❷ `callsAnother` 调用传递它的函数。\n\n❸ 我们可以调用 `callsAnother`\
  \ 并传递一个函数类型匹配的 lambda。\n\n函数类型由 `->` 分隔的两个部分组成——()` 中的参数列表和返回类型。参数类型列表为空，但返回类型不能省略。如果你传递的函数不返回任何内容，则其类型必须指定为\
  \ `Unit`。\n\n注意：当 lambda 接收单个参数且类型可以推断时，可以使用标识符 `it`，从而消除了对特定名称以及 lambda 头部 `->`\
  \ 的需要。\n\n函数参数必须声明它们的类型，但 Kotlin 通过对 lambda 应用类型推断为调用者节省了一些输入。以下是早期 `callsAnother`\
  \ 调用逐步减少显式类型的所有允许形式：\n\n```kotlin\ncallsAnother({ n: Int -> println(\"Got $n\")\
  \ })   ❶\ncallsAnother({ n -> println(\"Got $n\") })        ❷\ncallsAnother({ println(\"\
  Got $it\") })            ❸\n```\n\n❶ `callsAnother` 的原始调用，lambda 类型完全指定\n\n❷ Kotlin\
  \ 可以推断出 `n` 必须是 `Int`，因为这是 `callsAnother` 需要的\n\n❸ 传递单个参数给 lambda 的模式非常常见，因此 Kotlin\
  \ 提供了隐式 `it` 参数的特殊支持。\n\n\n\n自然地，Kotlin 从这些错误中汲取了教训，从第一天起就拥有无缝的集合体验。标准函数在 Kotlin\
  \ 中一直存在，用于创建常见的集合类型——这一功能 Java 直到第 9 版本才引入：\n\n```\nval readOnlyList = listOf(\"\
  a\", \"b\", \"c\")                  ❶\nval mutableList  = mutableListOf(\"a\", \"\
  b\", \"c\")           ❶\n\nval readOnlyMap = mapOf(\"a\" to 1, \"b\" to 2, \"c\"\
  \ to 3)     ❷\nval mutMap = mutableMapOf(\"a\" to 1, \"b\" to 2, \"c\" to 3)   ❷\n\
  \nval readOnlySet = setOf(0, 1, 2)                          ❸\nval mutableMap  =\
  \ mutableSetOf(1, 2, 3)                   ❸\n```\n\n❶ 使用推断类型 `kotlin.collections.List<String>`\
  \ 和 `kotlin.collections.MutableList<String>` 创建列表。\n\n❷ 使用推断类型 `kotlin.collections.Map<String,\
  \ Int>` 和 `kotlin.collections.MutableMap<String, Int>` 创建映射。注意使用 `to` 关键字定义映射的内置语法。\n\
  \n❸ 使用推断类型 `kotlin.collections.Set<String>` 和 `kotlin.collections.MutableSet<String>`\
  \ 创建集合。\n\n默认函数返回其集合的只读拷贝——这是性能和正确性极佳的默认选择。你必须显式请求 `mutable` 变以获取带有修改接口的集合。Kotlin\
  \ 再次通过将你的代码引导不可变性（作为更简单、更短的选项）来保护你免受整类漏洞的影响。\n\n你可能注意到，这些集合的推断类型与标准的 Java 对应不同——尽管名称相似，但它们位于\
  \ `kotlin.collections` 包中。Kotlin 定义了它自己的集合接口层次结构（如图 9.1 所示），但在底层，它重用了 JDK 的实现。这使得\
  \ `kotlin.collections` 接口拥有更整洁的 API，同时保留了将我们的集合传递给 Java 代码的能力，因为这些实现也支持 `java.util`\
  \ 集合接口。\n\n![](img/CH09_F02_Evans2.png)\n\n图 9.1 Kotlin 集合层次结构\n\n这些集合参与了所有标准的 Java\
  \ 接口和模式。你可以像下面使用 `for ... in` 遍历它们：\n\n```\nval l = listOf(\"a\", \"b\", \"c\")\n\
  \nfor (s in l) {\n  println(s)\n}\n```\n\n然而，遍历集合的 `for` 循环是语言中唯一直接的操作。集合上的许多其他工作都在重复进行，而\
  \ Kotlin 集合拥有大量使用我们在上一节中看到的一等函数的功能。这些功能几乎总是返回一个新的集合，而不是修改被调用的集合。自从 lambda 和流发布以来，你可能在\
  \ Java 中遇到过这种风格的集合代码，它们共享许多共同理念。\n\n我们通常从一个集合中取一个值并根据某些计算将每个元素转换为不同的值。`map` 正通过我们传递的函数执行此操作，如下：\n\
  \n```\nval l = listOf(\"a\", \"b\", \"c\")\nval result = l.map { it.toUpperCase()\
  \ }   ❶\n```\n\n❶ `result` 包含一个由“A”、“B”、“C”组成的列表。\n\n另一个常见操作是在进行进一步处理之前从集合中删除某些值。`filter`\
  \ 期望一个返回 `Boolean` 的 lambda。这个 lambda 被称为*谓词*（predicate），`filter` 重复调用该谓词以决定在新集合中返回哪些元素，如下所示：\n\
  \n```\nval l = listOf(\"a\", \"b\", \"c\")\nval result = l.filter { it != \"b\"\
  \ }   ❶\n```\n\n❶ `result` 包含一个由“a”、“c”组成的列表。\n\n如果你只关心集合是否满足某些条件但不需要元素，那么 `all`、`any`\
  \ 和 `none` 函数正是你需要的。这些函数避免了数据拷贝，并在可能的情况下早返回（例如在 `all()` 遇到第一个 `false` 后），如下所示：\n\
  \n```\nval l = listOf(\"a\", \"b\", \"c\")\nval all  = l.all  { it.length == 1 }\
  \   ❶\nval any  = l.any  { it.length == 2 }   ❷\nval none = l.none { it == \"a\"\
  \ }        ❸\n```\n\n❶ `all == true`\n\n❷ `any == false`\n\n❸ `none == false`\n\n\
  你可以使用 `associateWith` 和 `associateBy` 函数从列表构建映射。`associateWith` 期望集合元素是结果映射中的键。而\
  \ `associateBy` 则假设集合元素是映射中的值。如果在使用这些任一函数时遇到重复，则最后一个计算的值胜出，如下一个代码段所示：\n\n```\nval\
  \ l = listOf(\"!\", \"-\", \"--\", \"---\")\n\nval resultWith = l.associateWith\
  \ { it.length }   ❶\nval resultBy   = l.associateBy   { it.length }   ❷\n```\n\n\
  ❶ `resultWith` 包含 `mapOf(“!” to 1, “-” to 1, “--” to 2, “---” to 3)`。\n\n❷ `resultBy`\
  \ 包含 `mapOf(1 to “-”, 2 to “--”, 3 to “---”)`。\n\n这只是 Kotlin 处理集合丰富函数集的一角。这些函数可以链在一起，允许对集合的操作进行表达性、简洁的描述。文档非常优秀，并带有示例引导通过其他主题。\n\
  \n\n\n\n### 范围\n`..` 语法定义了一个闭区间范围，因此这段代码与之前的基于列表的示例等效。\n\n值得注意的是，`when` 的左侧条件可以是任何有效表达式，只要类型匹配即可。例如，可以使用函数调用，这是一种阐明复杂条件的巧妙技巧，如下所示：\n\
  \n```kotlin\nfun theBest() = 1\nfun okValues() = listOf(2, 3)\n\nval message = when\
  \ (incoming) {\n  theBest()     -> \"best!\"        ❶\n  in okValues() -> \"ok!\"\
  \          ❷\n  else          -> \"nope\"\n}\n```\n\n❶ 因为 `theBest` 的返回值被直接使用，它必须返回一个\
  \ `Int` 才能与 `incoming` 进行比较。\n\n❷ 因为 `okValues` 的返回值与 `in` 配合使用，它必须是一个 `Collection`（集合）。\n\
  \n关于 `when` 的最后一点，如果你还没有被它的超能力说服，那它的安全性。我们所有的示例都提供了一个 `else` 情况。移除其中任何一个 `else`\
  \ 都会导致编译错误，提示我们没有处理所有情况，所示：\n\n```text\nerror: 'when' expression must be exhaustive,\
  \ add necessary 'else' branch\n```\n\nKotlin 还有另一个技巧可以将 Java 中的语句结构替换为表达式——使用 `try\
  \ catch` 进行错误处理，如下所示代码所示：\n\n```kotlin\nval message = try {\n  dangerousCall() \
  \           ❶\n  \"fine\"                     ❷\n} catch (e: Exception) {\n  \"\
  oops\"                     ❸\n}\n```\n\n❶ 一个可能会失败的函数调用\n\n❷ 如果我们通过了 `dangerousCall`，`message`\
  \ 将被赋值为“fine”。\n\n❸ 如果我们的 `dangerousCall` 抛出异常，`message` 将被赋值为“oops”。\n\n这避免了在 `try\
  \ catch` 外部声明变量的尴尬结构（在内部的所有路径都必须记得正确设置该变量）。这不仅写起来更短，而且更安全，因为编译器可以保证赋值是有效的。\n\n尽管\
  \ Kotlin 和 Java 都采用了函数式编程的某些特性，但它们本质上都是面向对象的语言。接下来，我们将检查如何在 Kotlin 中定义类和对象。\n\n\
  ## 9.3 类和对象的不同视角\n\nKotlin 的类提供了与 Java 非常相似的功能，从 `class` 关键字开始。但是，正如我们在其他地方看到的那样，代码是不同的，强调的是简洁和方便。\n\
  \n首先，Kotlin 不使用 `new` 关键字来创建类的实例。相反，它的语法更像使用类名调用函数，如下所示：\n\n```kotlin\nval person\
  \ = Person()\n```\n\nKotlin 并没有像 Java 那样真正拥有字段（fields）。相反，在类中声明*属性*（properties）时，我们的朋友\
  \ `val` 和 `var` 会出现。这些属性可以像 Java 字段一样进行内联初始化，所示：\n\n```kotlin\nimport java.time.LocalDate\n\
  \nclass Person {\n  val birthdate = LocalDate.of(1996, 1, 23)     ❶\n  var name\
  \ = \"Name Here\"                        ❷\n}\n```\n\n❶ 只读属性 `birthdate`\n\n❷ 可变属性\
  \ `name`\n\n注意：正如我们在第 4 章中看到的，字段在 JVM 层级是存在的，因此 Kotlin 的属性在字节码中实际上被转换为字段访问。然而，在语言层面，最好从属性的角度来考虑。\n\
  \nJava 类中样板代码的主要来源是字段的 getter 和 setter 方法。Kotlin 通过默认自动为属性提供访问器（accessors）解决了此问题。更进一步，Kotlin\
  \ 还允许我们像访问 Java 字段一样使用这些访问器方法，所示：\n\n```kotlin\nprintln(\"Hi ${person.name}. \"\
  \ +                    ❶\n        \"You were born on ${person.birthdate}\")\nperson.name\
  \ = \"Somebody Else\"                      ❷\n// person.birthdate = LocalDate.of(2000,\
  \ 1, 1)     ❸\n```\n\n❶ 打印 Hi Name here. You were born on 1996-01-23.\n\n❷ `var`\
  \ 属性也会获得 setter，可以使用 `=` 使用。\n\n❸ `val` 属性无法设置。\n\n类设计中的一个大话题是状态数据的可见性，特别是涉及*封装*时。Kotlin\
  \ 采取了一个略有争议的动作，将默认可见性设置为 `public`，这与 Java 的*包保护*（package-protected）默认值不同。自由暴露所有属性并不被认为是良好的做法，但\
  \ Kotlin 的设计者发现，实际代码中必须频繁地声明 `public`，因此将其作为默认值具有重大的瘦身效果。\n\nKotlin 支持以下四个级别的可见性，大多数与其对应的\
  \ Java 版本一致：\n\n* `private`——仅在当前类内或对于顶层函数的文件中可见\n* `protected`——在类和子类中可见\n* `internal`——对你一起编译的代码集可见\n\
  * `public`——对所有人可见\n\n例如，如果我们想让 `birthdate` 变为私有，它看起来像这样：\n\n```kotlin\nclass Person\
  \ {\n  private val birthdate = LocalDate.of(1996, 1, 23)\n  var name = \"Name Here\"\
  \n}\n```\n\n由于 Kotlin 仅向程序员暴露属性而非字段，这为*委托属性*（delegated properties）开启了可能。当配合 `by`\
  \ 关键字使用时，属性可以为其获取和设置行为提供自定义的实现。这种做法将在后续章节的许多高级技术中出现。\n\n标准库带有几个实用的委托（delegates）。例如，在调试时，想要知道值何时变化并不罕见。`Delegates.observable`\
  \ 提供了这样一个钩子，所示：\n\n```kotlin\nimport kotlin.properties.Delegates\n\nclass Person\
  \ {\n  var name: String by Delegates.observable(\"Name Here\") {\n      prop, old,\
  \ new -> println(\"Name changed from $old to $new\")\n  }\n}\n```\n\n传递给 `Delegates.observable`\
  \ 的值是属性的初始值。传递给 `Delegates.observable` 的 lambda 在属性值改变后被调用。\n\n就像 Java 一样，Kotlin\
  \ 支持用于创建实例的构造函数，事实上，Kotlin 有几种不同的构造形式。其中第一种是在最顶部使用类名声明*主构造函数*（primary constructor），所示。Kotlin\
  \ 将其作为指定属性的替代位置：\n\n```kotlin\nclass Person(\n  val birthdate: LocalDate,      \
  \                ❶\n  var name: String) {                            ❶\n}\n\nval\
  \ person = Person(LocalDate.of(1996, 1, 23),   ❷\n                \"Somebody Else\"\
  )             ❷\n```\n\n❶ 主构造函数中的 `val` 和 `var` 创建属性\n\n❷ 因为我们没有提供默认值，构造时必须传递参数。\n\
  \n如果构造函数需要可见性修饰符或注解，可以使用 `constructor` 关键字使用较长的语法。例如，如果我们想向世界隐藏我们的构造函数，可以这样做：\n\n\
  ```kotlin\nclass Person private constructor(\n  val birthdate: LocalDate,\n  var\
  \ name: String) {\n}\n```\n\n如果我们要在所有对象构造期间运行其他逻辑，Kotlin 使用 `init` 关键字，所示：\n\n```kotlin\n\
  class Person(\n  val birthdate: LocalDate,\n  var name: String) {\n\n  init {\n\
  \    if (birthdate.year < 2000) {    ❶\n      println(\"So last century\")\n   \
  \ }\n  }\n}\n```\n\n❶ `init` 在构造函数赋值属性后运行，因此可以在代码中访问它们。\n\n类可以有多个 `init` 块，它们按照在类定义的顺序执行，所示。类体中定义的属性只有在定义之后对\
  \ `init` 块可见：\n\n```kotlin\nclass Person(\n  val birthdate: LocalDate,\n  var name:\
  \ String) {\n\n  init {\n    // println(nameParts)                         ❶\n \
  \ }\n\n  val nameParts: List<String> = name.split(\" \")\n\n  init {\n    println(nameParts)\
  \                            ❷\n  }\n}\n```\n\n❶ 编译失败，错误为：变量 `nameParts` 必须初始化\n\
  \n❷ 按照预期工作，并打印出列表\n\n\n\n\n如果我们需要额外的构造函数，可以在类体中使用 `constructor` 关键字定义它们，如下所示。这些被称为`辅助构造函数`（secondary\
  \ constructors）：\n\n```\nclass Person(\n  val birthdate: LocalDate,\n  var name:\
  \ String) {\n\n  constructor(name: String)\n    : this(LocalDate.of(0, 1, 1), name)\
  \ {   ❶\n  }\n}\n```\n\n❶ 当一个类有一个主构造函数时，辅助构造函数必须通过 `this`（直接调用或通过其他辅助构造函数）调用它。\n\
  \n注意：在 Java 中，许多为了提供默认值而存在多个构造函数重载的情况，在 Kotlin 中可以使用默认参数值来替代处理。\n\n虽然只包含属性的类可能很有用，但大多数时候，我们的类还有其他功能。接下来的代码示例使用了我们在章节开头已经见过的熟悉的函数语法，为类添加了一个方法：\n\
  \n```\nclass Person(\n  val birthdate: LocalDate,\n  var name: String) {\n\n  fun\
  \ isBirthday(): Boolean {\n    val today = LocalDateTime.now().toLocalDate()\n \
  \   return today == birthdate\n  }\n}\n```\n\n如前所述，Kotlin 中的函数默认可见性为 `public`。如果我们想隐藏一个函数，可以在它前面加上所需的访问修饰符，如下所示：\n\
  \n```\nclass Person(\n  val birthdate: LocalDate,\n  var name: String) {\n\n  fun\
  \ isBirthday(): Boolean {                   ❶\n    return today() == birthdate\n\
  \  }\n\n  private fun today(): LocalDate {              ❷\n    return LocalDateTime.now().toLocalDate()\n\
  \  }\n}\n```\n\n❶ `isBirthday` 对于任何能看到 `Person` 类的人都是可见。\n\n❷ `today` 仅在 `Person`\
  \ 类内部可用。\n\n面向对象编程的另一个关键部分是`继承`（inheritance）。Kotlin 没有 `extends` 关键字，而是通过我们之前在类型声明中看到的、并在下方展示的熟悉的\
  \ `:` 语法来表达继承：\n\n```\nclass Child(birthdate: LocalDate, name: String)   ❶\n  :\
  \ Person(birthdate, name) {                     ❷\n}\n```\n\n❶ `Child` 构造函数的参数。注意这些参数没有被标记为\
  \ `val` 或 `var`，因此它们不会与父类属性冲突，但可以作为局部变量传递给父类构造函数。\n\n❷ 调用父类构造函数。\n\n继承需要对 `Parent`\
  \ 类进行另一个更改。为了鼓励只在我们预意和计划的地方进行子类化，Kotlin 类默认是 `closed`（关闭）的。如果一个类可以被子类化，它必须使用 `open`\
  \ 关键字，如下一个代码示例所示。这与 Java 的情况相反，Java 中的类默认是开放的，并使用 `final` 来表示它们可能不能被子类化：\n\n```\n\
  open class Person(             ❶\n  val birthdate: LocalDate,\n  var name: String)\
  \ {\n  //...\n}\n```\n\n❶ `open` 与可见性修饰符一起位于类关键字之前。\n\n同样的默认关闭原则适用于方法。父类必须将要重写的方法声明为\
  \ `open`，而子类中的重写方法必须标记为 `override`，如下所示：\n\n```\nopen class Person(\n  val birthdate:\
  \ LocalDate,\n  var name: String) {\n\n  open fun isBirthday(): Boolean {      \
  \         ❶\n    return today() == birthdate\n  }\n\n  private fun today() : LocalDate\
  \ {\n    return LocalDateTime.now().toLocalDate()\n  }\n}\n\nclass Child(birthdate:\
  \ LocalDate, name: String)\n  : Person(birthdate, name) {\n\n  override fun isBirthday():\
  \ Boolean {           ❷\n    val itsToday = super.isBirthday()            ❸\n  \
  \  if (itsToday) {\n      println(\"YIPPY!!\")\n    }\n    return itsToday\n  }\n\
  }\n```\n\n❶ `Person` 类声明了 `isBirthday` 函数可以在子类中被重写。\n\n❷ `Child` 类必须显式地将其方法标记为 `override`。\n\
  \n❸ `Child` 可以通过 `super` 调用父类的 `isBirthday` 实现。\n\n与 Java 类似，Kotlin 仅允许单个基类，但类可以继承多个接口，如下面的代码所示。Kotlin\
  \ 的接口允许函数的默认实现，就像 Java 从第 8 版本以来那样：\n\n```kotlin\ninterface Greetable {\n  fun greet():\
  \ String              ❶\n}\n\nopen class Person constructor(\n  val birthdate: LocalDate,\n\
  \  var name: String): Greetable {   ❷\n\n  override fun greet(): String {   ❸\n\
  \    return \"Hello there\"\n  }\n}\n```\n\n❶ 定义了我们具有一个返回问候信息的接口。\n\n❷ `Person`\
  \ 声明它实现了 `Greetable`。\n\n❸ 接口函数是开放的，所以它们的实现必须指定 `override`。\n\n在典型的 Kotlin 中，实现接口使用一种简洁的形式，看起来非常像我们已经用于扩展基类的形式——不再需要像在\
  \ Java 中那样去记忆要用 `extends` 还是 `implements` 了。\n\n### 9.3.1 数据类 (Data classes)\n\n\
  尽管这些基础结构允许我们在 Kotlin 中构建丰富的对象模型，但有时你只需要一个容器来传递数据。Kotlin 通过 `data classes` 来支持这一点。\n\
  \n注意：我们在第 3 章遇到过 Java 的新 `record` 能力，Kotlin 数据类在某些方面与它们非常相似。\n\nKotlin 已经让属性这一侧变得无缝的，但标准类的\
  \ `equals` 和 `hashCode` 实现是基于对象引用的，而不是属性值。\n\n当我们把一个类型声明为 `data class` 时，Kotlin\
  \ 会创建我们需要的等性函数，如下所示：\n\n```\nclass PlainPoint(val x: Int, val y: Int)\n\nval pl1\
  \ = PlainPoint(1, 1)\nval pl2 = PlainPoint(1, 1)\n\nprintln(pl1 == pl2)        \
  \                   ❶\n\ndata class DataPoint(val x: Int, val y: Int)\n\nval pd1\
  \ = DataPoint(1, 1)\nval pd2 = DataPoint(1, 1)\n\nprintln(pd1 == pd2)          \
  \                 ❷\n```\n\n❶ 默认的 `equals` 比较的是引用，所以输出 false。\n\n❷ 通过 Kotlin 数据类的实现，输出\
  \ true。\n\n数据类必须有一个带有 `val` 或 `var` 的主构造函数。它们不能是 `open`，因为如果存在子类，Kotlin 在编译时无法正确生成等性函数。数据类也不允许作为内部类。除了这些一些奇特的限制外，它们是普通的类，你可以在上面随心所欲实现函数或接口。\n\
  \n来自 Java 的人们可能在类中寻找的最后一个特性是声明一个不属于实例而属于整个类的函数。但 Kotlin 并没有支持 `static`——函数要么是浮动的，要么是类型的成员。\n\
  \n然而，将函数与类关联的便利是不可否认的，Kotlin 通过其 `companion object` 提供了类似的功能。这种语法声明了一个存于类内的单例对象。Kotlin\
  \ 中的 `object` 声明是具有典型属性和函数的完整对象。这避免了 Java 中 `static` 方法遭受的边缘问题（例如测试困难），同时保留了将功能与类关联的便利。\n\
  \n这些函数的一个常见用例是工厂方法，你想让对象的构造函数私有，但通过更具特定名称的方法允许受控创建，如下所示：\n\n```\nclass ShyObject\
  \ private constructor(val name: String) {   ❶\n\n  companion object {\n    fun create(name:\
  \ String): ShyObject {                 ❷\n      return ShyObject(name)\n    }\n\
  \  }\n}\n\nShyObject.create(\"The Thing\")                             ❸\n```\n\n\
  ❶ `ShyObject` 将构造函数声明为私有，因此类外部无法使用它。\n\n❷ 伴随对象内部的工厂方法是 `ShyObject` 类的一部分，因此访问私有构造函数。\n\
  \n❸ 在类外部，`ShyObject` 伴随对象的函数可以通过类名直接调用。\n\n\n\nKotlin 构建在 JVM 之上，因此它不得不受限于某些设计约束，而这些约束实际上源于虚拟机的设计。例如，JVM\
  \ 规范将 `null` 定义为可以赋值给任何引用类型变量的值。\n\n尽管存在这些问题，Kotlin 语言试图解决一些常见的代码安全问题，以尽可能减少继承来的痛苦和折磨。这通过将许多\
  \ Java 代码模式提升为语言特性来实现，使你的代码默认更加安全。\n\n### 9.4.1 空指针安全\n\nJava 最常见的异常之一是 `NullPointerException`（空指针异常）。当我们尝试访问一个应该包含对象但实际上为\
  \ `null` 的变量或字段时就会发生这种情况。快速排序算法的创始人 own 霍尔（Tony Hoare）将 `null` 称为他的“十亿美元错误”（参见 [`qconlondon.com/london-2009/qconlondon.com/london-2009/speaker/Tony+Hoare.html`](https://qconlondon.com/london-2009/qconlondon.com/london-2009/speaker/Tony+Hoare.html)），考虑到他在\
  \ ALGOL 中引入 `null` 引用的作用。\n\n在发展过程中，Java 已经了多种不同的方法来提供对 `null` 的保护。`Optional` 类型让你始终拥有一个具体的对象，同时在不求\
  \ `null` 的情况下指示“缺失”的值。许多不同的验证和序列化框架支持的 `@NotNull` 和 `@Nullable` 注解可以确保值在应用程序的关键点不会意外地为\
  \ `null`。\n\n正如你所预期的，Kotlin 取了这些常见模式并将它们直接内置到了语言中。让我们回顾一下之前赋值变量的示例。它们在与 `null` 结合时表现如何？\n\
  \n```kotlin\nval i: Int = null      ❶\nval s: String = null   ❶\n```\n\n❶ 尝试为这些类型分配\
  \ `null` 将导致编译失败。\n\n这两个赋值都会导致编译错误，`error: null can not be a value of a non-null\
  \ type Int`。尽管这些 `Int` 和 `String` 类型的声明看起来和 Java 相似，但它们实际上不允许 `null` 值。\n\n注意：Kotlin\
  \ 将可空性作为了其类型系统的一部分。Kotlin 类型 `String` *实际上并不*等同于允许 `null` 的 Java 类型 `String`。\n\n\
  为了让 Kotlin 变量允许 `null`，我们必须通过在类型后添加 `?` 后缀显式说明：\n\n```kotlin\nval i: Int? = null\
  \      ❶\nval s: String? = null   ❶\n```\n\n❶ 将我们的类型改为 `Int?` 和 `String?` 会告诉 Kotlin\
  \ 允许空。\n\n注意：尽可能使用非空类型声明你的变量和参数。你可以放心，Kotlin 正在保护你免受那些 `NullPointerException` 带来的头疼。\n\
  \n然而，我们并总是避免 `null`。也许我们正在与 Java 代码交互，或者我们的类在设计时没有考虑空安全。即使我们接触了可空性的危险，Kotlin 仍然尽力告知我们风险，如下：\n\
  \n```kotlin\nval s: String? = null   ❶\nprintln(s.length)       ❷\n```\n\n❶ 创建一个空变量\n\
  \n❷ 尝试访问该变量的属性\n\nKotlin 识别出调用 `s.length` 中的解引用可能是不安全的，并拒绝编译，报错 `error: only safe\
  \ (?.) or non-null asserted (!!.) calls are allowed on a nullable receiver of type\
  \ String?`。\n\nKotlin 建议的第一个选项是将此修正为安全操作符 `?.`。该运算符检查它所应用的对象。如果对象是 `null`，它将返回 `null`\
  \ 而不是执行进一步的调用，如下：\n\n```kotlin\nval s: String? = null\nprintln(s?.length)      \
  \ ❶\n```\n\n❶ `?.` 导致打印值 `null`。\n\n安全操作符会提前返回，因此即使在嵌套的调用链中也能正常工作。在我们接下来的示例中，路径上的任何一点都可以安全地返回\
  \ `null`，整个表达式将变为 `null`，如下所示：\n\n```kotlin\ndata class Node(val parent: Node?,\
  \ val value: String)   ❶\n\nval node = getNode()                               \
  \     ❷\nnode.parent?.parent?.parent                             ❸\n```\n\n❶ 一个允许可选父节点的数据类\n\
  \n❷ 从某处获取一个 `Node`\n\n❸ 检查 node 是否有曾祖父节点\n\n这可能很方便，但 `?.` 可能会隐藏数据问题。如果我们在之前的曾祖父检查中得到了\
  \ `null`，在不进行进一步检查的情况下，我们无法确定它来自层次结构中的哪一层。\n\n对于我们编译失败的第二个选项（`error: only safe (?.)\
  \ or non-null asserted (!!.) calls are allowed on a nullable receiver of type String?`。），是在变量上使用\
  \ `!!`。该运算符强制 Kotlin 检查对象是否为 `null`，如果值为 `null`，则会抛出熟悉的 `NullPointerException`，如下所示：\n\
  \n```kotlin\nval s: String? = null\nprintln(s!!.length)      ❶\n```\n\n❶ 抛出 `NullPointerException`\n\
  \n虽然通常不需要频繁这样做，但我们仍然可以检查变量是否为 `null`。事实上，Kotlin 经常能注意到此类检查并让我们避免进一步的 `?.` 或 `!!`，如下：\n\
  \n```kotlin\nval s: String? = null\n\nif (s != null) {        ❶\n  println(s.length)\
  \     ❷\n}\n```\n\n❶ 在所有情况下检查空\n\n❷ 因为我们知道 `s` 不是 `null`，所以可以安全地引用。\n\n我们并不能总是避免\
  \ `null`。我们在这里看到的实际上 Kotlin 的一个更深层的特性，称为智能转换（smart casting），它值得仔细观察。\n\n### 9.4.2\
  \ 智能转换\n\n尽管良好的对象设计试图避免直接检查类型，但有时这是必要的。Kotlin 拥抱了这种需求并更进一步。首先，Kotlin 使用 `is` 运算符检查对象的类型，如下：\n\
  \n```kotlin\nval s: Any = \"Hello\"         ❶\nif (s is String) {           ❷\n\
  \  println(s.toUpperCase())❸\n}\n```\n\n❶ `Any` 等于 Java 的 `Object` 类型——所有对象的基类型\n\
  \n❷ 检查 s 是否为 String\n\n❸ 作为 String 使用 s。如果将其视为 `Any`，`toUpperCase()` 将不可用。\n\n如果你熟悉\
  \ Java 的 `instanceof` 结构，这段代码似乎缺少了一个关键步骤——我们需要查看 s 是否为 `String`。幸运的是 Kotlin 覆盖了我们。在\
  \ `if` 块中，当编译器确保我们拥有 `String` 时，我们可以在不显式转换的情况下将 s 作为 String。这被称为智能转换。（等等，我重复了）这被称为智能转换。）\n\
  \n注意：Java 有一项名为模式匹配（pattern matching）的新功能正在作为 Project Amber 的一部分逐步推出。第一部分适用于 `instanceof`\
  \ 并提供了与智能转换相似的益处。我们将在第 18 章详细讨论模式匹配。\n\n\n\n\n当我们使用 `as` 时，我们就回到了与 Java 中进行类型转换时相同的状态。如果类型实际上不兼容，我们将看到\
  \ `ClassCastException`。Kotlin 提供了以下替代方案，如果我们更倾向于允许可空性而不是异常的话：\n\n```\nval cast:\
  \ String? = s as? String   ❶\nif (cast != null) {                ❷\n  println(cast.toUpperCase())\n\
  }\n```\n\n❶ `as?` 尝试转换但不会抛出异常。同时请注意，结果类型是 `String?` 而不是 `String`。\n\n❷ 如果 `s` 无法转换，变量将变为\
  \ `null`。\n\nKotlin 的许多强大之处源于对 Java 开发者多年来一直在做的常用实用代码进行重新审视。然而，该语言提供不仅仅是润色和保护的一个领域是并发。Kotlin\
  \ 提供了一种名为 `coroutines`（协程）的技术，它可以被认为是 Java 中最广泛使用的经典线程方法的替代方案。\n\n## 9.5 并发\n\n\
  正如我们在第 5 章中讨论的，JVM 从其极早期版本开始就支持 `Thread` 类作为操作系统管理线程的模型。线程模型是广为人知的，但它也带来了许多问题。\n\
  \n注意：尽管线程已深根于 Java 语言和生态系统中，以至于几乎不可能移除它们，但迁移到新的非 Java 语言允许我们可能重新构该语言可能使用的并发原语。\n\
  \n尽管 Kotlin 作为一种 JVM 语言仍然暴露了线程，但它引入了另一个名为 `coroutines` 的结构。在最简单的层次，协程可以被看作更轻量级的线程。它们在运行时内部实现和调度，而不是在操作系统层面，这使得它们消耗的资源少得多。启动数千个协程完全不是问题，而相同数量的线程则会让系统停顿。\n\
  \n注意：我们将在第 18 章讨论 Project Loom 时，遇到 Java 对协程的处理。\n\nKotlin 对协程的支持部分直接包含在语言中（`suspend`\
  \ 函数），但要实际使用协程，需要一个额外的库：`kotlin-coroutine-core`。我们将在第 11 章中看到更多关于引入此类依赖项的内容，但目前在\
  \ Maven 中的添加方式如下：\n\n```\n<dependency>\n    <groupId>org.jetbrains.kotlinx</groupId>\n\
  \    <artifactId>kotlinx-coroutines-core</artifactId>\n    <version>1.6.0</version>\n\
  </dependency>\n```\n\nKotlin 风格的 Gradle 等写法如下：\n\n```\ndependencies {\n    implementation(\"\
  org.jetbrains.kotlinx:kotlinx-coroutines-core:1.6.0\")\n}\n```\n\n在 Java 中，线程通过传递一个实现\
  \ `Runnable` 接口的对象来启动。Kotlin 中的协程也需要一种接收要运行代码的方法，但它们使用的是语言的 lambda 语法。\n\n协程始终在\
  \ `scope`（作用域）中启动，它控制协程如何被调度和运行。我们将从简单的选项开始，即 `GlobalScope`，这是一个在应用程序持续期间存在的作用域。`GlobalScope`\
  \ 有一个 `launch` 函数，我们通过 lambda 调用它来启动，如下所示：\n\n```\nimport kotlinx.coroutines.GlobalScope\
  \   ❶\nimport kotlinx.coroutines.launch        ❶\n\nfun main() {\n    GlobalScope.launch\
  \ {                ❷\n       println(\"Inside!\")\n    }\n    println(\"Outside\"\
  )                  ❸\n}\n```\n\n❶ 我们将要使用的协程函数和对象的导入\n\n❷ 在 `GlobalScope` 中启动一个新的协程，它的生命周期与程序一样长\n\
  \n❸ 回到协程外部，我们将打印内容以确认 `main` 仍在运行。\n\n当我们运行这个示例时，大多数情况下你只会看到输出以下内容：\n\n```\nOutside\n\
  ```\n\n为什么我们的协程没有工作呢？我们期望在某个点也能看到打印出 `Inside`。然而，仔细观察，如果我们考虑到事件发生的顺序，就能发现问题。`main`\
  \ 启动了我们的程序。然后我们启动了协程异步运行。随后，我们打印了 `Outside` 消息，然后程序结束了。当 `main` 完成时，程序就会退出，无论是否有何协程在等待运行。\n\
  \n为了得到我们想要的结果，我们需要在程序结束之前引入暂停。这可以通过循环或在控制台请求用户输入来实现。我们将直接使用 `Thread.sleep(1000)`\
  \ 来留足够的时间让一切稳定下来，如下：\n\n```\nimport kotlinx.coroutines.GlobalScope\nimport kotlinx.coroutines.launch\n\
  \nfun main() {\n    GlobalScope.launch {    ❶\n       println(\"Inside!\")\n   \
  \ }\n    println(\"Outside\")\n    Thread.sleep(1000)      ❷\n}\n```\n\n❶ 再次启动我们的协程\n\
  \n❷ 给协程留出运行时间\n\n现在我们将看到两个消息的输出，尽管顺序可能是不确定的，取决于协程启动的快慢以及主线程在做什么。\n\n从高层次来看，这与使用线程来实现代码的类似并发执行并没有太大区别。但底层实现需要更少的操作系统资源（每个协程没有自己的执行堆栈和本地存储），并允许诸如取消协程等操作的安全性。\n\
  \n为了看到这一操作过程，我们可以通过 `launch` 的返回值捕获协程句柄。此协程对象提供了一个 `cancel` 函数，如果我们想，可以立即调用它，如下所示：\n\
  \n```\nimport kotlinx.coroutines.GlobalScope\nimport kotlinx.coroutines.delay\n\
  import kotlinx.coroutines.launch\n\nfun main() {\n    val co = GlobalScope.launch\
  \ {   ❶\n        delay(1000)                 ❷\n        println(\"Inside!\")\n \
  \   }\n    co.cancel()                     ❸\n    println(\"Outside\")\n    Thread.sleep(2000)\
  \              ❹\n}\n```\n\n❶ 捕获 `launch` 返回的协程对象\n\n❷ 在协程内部，我们可以调用 `delay` 来等待一段时间。\n\
  \n❸ 立即取消协程\n\n❹ 在这里随你喜欢等待多久——你永远看不到协程的输出。\n\n这段代码将安全地停止协程并只打印 `Outside`。这与 `java.lang.Thread`\
  \  `stop()` 方法形成了鲜明对比，正如我们在第 5 章中讨论的，后者由于极不安全很久以前就被废弃了。\n\n为什么协程可以安全地做到这一点，而线程不能？关键在于\
  \ `delay` 函数。它的声明标记了一个特殊的修饰符：`suspend`。Kotlin 知道将 `suspend` 函数视为协程执行中的安全点，用于切换到另一个任务或查找取消操作等操作。这被称为*协作式多任务*，正因为我们的协程代码在调用\
  \ `suspend` 函数时进行了“协作”，它才能被取消。\n\n这种协作带来的好处不仅仅是安全取消的能力。例如，Kotlin 理解一个协程（父程）启动另一个协程（子程）。取消父协程会自动取消子协程，无需我们额外的管理，如下所示：\n\
  \n```\nimport kotlinx.coroutines.GlobalScope\nimport kotlinx.coroutines.coroutineScope\n\
  import kotlinx.coroutines.delay\nimport kotlinx.coroutines.launch\n\nfun main()\
  \ {\n    val co = GlobalScope.launch {  ❶\n       coroutineScope {            ❷\n\
  \          delay(1000)\n          println(\"First\")\n       }\n       coroutineScope\
  \ {            ❸\n          delay(1000)\n          println(\"Second\")\n       }\n\
  \    }\n    co.cancel()                    ❹\n    Thread.sleep(2000)           \
  \  ❺\n}\n```\n\n❶ 像之前一样启动父协程\n\n❷ 启动两个子协程。`coroutineScope` 将它们关联到闭包作用域，在这里是全局作用域。\n\
  \n❸ 启动两个子协程。`coroutineScope` 将它们关联到闭包作用域，在这里是全局作用域。\n\n❹ 取消父协程\n\n❺ 再次，我们可以在这里等待，但看不到任何输出。\n\
  \n如果你见过在 Java 中实现这种协作所需要的代码，Kotlin 在这里带来的价值就显而易见了。\n\n\n\n\n协程是 Kotlin 如何利用其作为拥有独立编译器的语言的优势，通过与库协作来简洁地完成许多复杂行为的绝示例。事实上，关于协程的内容非常多，我们将在第\
  \ 16 章中进行更深入的调查。\n\n但没有任何语言是孤立存在的，尤其是在 JVM 上。Kotlin 之所以取得巨大成功并广泛采用，是因为它非常关注与庞大的\
  \ Java 代码世界的互操作性。\n\n# 9.6 Java 互操作性\n\n正如我们在第 4 章中学到的，类文件是 JVM 执行模型的核心。Kotlin 编译器\
  \ `kotlinc` 产生的类文件与 `javac` 为 Java 生成的类文件相似，这并不令人意外，如图 9.2 所示。\n\n![](img/CH09_F01_Evans2.png)\n\
  \n图 9.2 Kotlin 和 Java 并行工作生成类文件\n\n两种语言之间的基本类定义最终看起来很相似，但当 Kotlin 提供 Java 不支持的功能时，我们会在生成的类文件中看到更多有趣的差异。这些是“编译器虚构”（compiler\
  \ fictions）的证据，我们在第 8 章讨论过这些。\n\n一个例子是 Kotlin 类之外的顶层函数。这在 JVM 类文件格式中甚至没有直接支持。Kotlin\
  \ 通过生成一个带有 `Kt` 后缀的类（以其编译文件命名）来弥补这一差距。该文件内部的任何顶层函数都会出现在 `Kt` 类中。\n\n注意：你可以在 `.kt`\
  \ 文件中使用 `@file:JvmName(\"AlternateClassName\")` 注解来更改生成的类名。\n\n例如：\n\n```kotlin\n\
  // Main.kt                         ❶\npackage com.wellgrounded.kotlin    ❷\n\nfun\
  \ shout() {\n  println(\"No classes in sight!\")\n}\n```\n\n❶ 文件名默认影响了生成的包装类名。\n\
  \n❷ 函数的使用者需要像往一样从我们的包中导入。\n\n编译后，这将产生一个包含我们函数的 `MainKt.class` 类文件。因为 Java 本身不提供顶层函数，从\
  \ Java 中使用该函数必须通过如下中间类来实现：\n\n```java\n// Help.java\nimport com.wellgrounded.kotlin.MainKt;\
  \       ❶\n\npublic class Help {\n  public static void main(String[] args) {\n \
  \   MainKt.shout();                          ❷\n  }\n}\n```\n\n❶ 导入 Kotlin 创建的用于封装函数的类\n\
  \n❷ 通过 Java 的静态方法语法调用函数\n\nKotlin 的另一个关键便利之处是它对属性的内置处理。通过使用少量的 `val` 和 `var`，我们永远不需要编写满屏幕的样板代码\
  \ getter 和 setter。从 Java 中使用 Kotlin 类可以发现，在底层，这些方法一直都在——Kotlin 只是为了我们的方便对它们进行了封装，如下所示：\n\
  \n```kotlin\n// Person.kt\nclass Person(var name: String)               ❶\n\n//\
  \ App.java\npublic class App {\n  public static void main(String[] args) {\n   \
  \ Person p = new Person(\"Some Body\");      ❷\n    System.out.println(p.getName());\
  \         ❸\n\n    p.setName(\"Somebody Else\");              ❹\n    System.out.println(p.getName());\n\
  \  }\n}\n```\n\n❶ 我们的属性是 `var`，所以它是可变的。\n\n❷ 从 Java 使用时，Kotlin 类仍使用 `new` 实例化。\n\
  \n❸ 在 Kotlin 中访问 `Person.name`，在 Java 中是 `Person.getName()`。\n\n❹ 在 Kotlin 中访问 `Person.name\
  \ = “...”`，在 Java 中是 `Person.setName(“...”)`。注意，这个访问器的存在是因为 `Person` 类将 `name` 属性声明为\
  \ `var`（即可变）。如果 `name` 声明为 `val`，则只会生成 `getName()` 访问器。\n\n注意：这个示例揭示了在底层，Kotlin\
  \ 一直在使用创建私有字段并封装字段访问的标准模式。Kotlin 允许我们使用更自然的属性访问形式，而没有直接暴露字段的风险。\n\nKotlin 中的许多其他便利功能在从其他\
  \ JVM 语言使用时并不会体现在生成的代码中。命名参数就是一个例子——Java 根本没有通过名称指定参数的方法，因此这种便利只保留在 Kotlin 代码中。\n\
  \n在表面上，默认值似乎会遭遇同样的命运——毕竟，从 Java 调用要求你显式地将所有参数传递给函数，如下所示：\n\n```kotlin\n// Person.kt\n\
  class Person(var name: String) {\n  fun greet(words: String = \"Hi there\") {  \
  \   ❶\n    println(words)\n  }\n}\n\n// App.java\npublic class App {\n  public static\
  \ void main(String[] args) {\n    Person p = new Person(\"Some Body\");\n    //\
  \ p.greet();                             ❷\n    p.greet(\"Howdy\");            \
  \             ❸\n  }\n}\n```\n\n❶ 参数 `words` 的标准 Kotlin 默认值\n\n❷ 我们无法使用默认值调用，否则会得到编译错误，原因：实际参数列表和形式参数列表的长度不同。\n\
  \n❸ 我们可以传递自己的值。\n\n然而，存在一个逃口，这意味着我们不需要放弃 Kotlin 的整洁。`@JvmOverloads` 注解告诉 Kotlin\
  \ 显式生成函数的必要变体，这样从其他 JVM 语言调用它时看起来就一样：\n\n```kotlin\n// Person.kt\nclass Person(var\
  \ name: String) {\n  @JvmOverloads                              ❶\n  fun greet(words:\
  \ String = \"Hi there\") {    ❶\n    println(words)\n  }\n}\n\n// App.java\npublic\
  \ class App {\n  public static void main(String[] args) {\n    Person p = new Person(\"\
  Some Body\");\n    p.greet();                             ❷\n    p.greet(\"Howdy\"\
  );                         ❸\n  }\n}\n```\n\n❶ 注解了我们的函数并提供了默认值\n\n❷ 正常工作并打印“Hi there”\n\
  \n❸ 如前工作并打印我们的问候\n\n许多其他注解允许控制 Kotlin 代码在 JVM 中的表现形式。我们在另一个上下文中见过的一个是 `@JvmName`。它也适用于函数。`@JvmField`\
  \ 允许我们在需要时避免属性包装并暴露裸露字段。\n\n最后，但同样重要的是 `@JvmStatic`。正如我们之前看到的，Kotlin 会将顶层函数封装在命名的类中，可以通过静态方法访问。所有\
  \ Java 应用程序中都有静态方法：启动应用程序的 `main` 方法。\n\n如果我们想在 Kotlin 中创建一个应用程序，可以使用 `@JvmStatic`\
  \ 定义其 `main` 方法，以避免如下的需要：\n\n```kotlin\nclass App {                            \
  \          \n  companion object {\n    @JvmStatic fun main(args: Array<String>)\
  \ {   ❷\n      println(\"Hello from Kotlin\")\n    }\n  }\n}\n```\n\n❶ 我们指定为启动类的\
  \ App 类\n\n❷ `@JvmStatic` 意味着该函数作为类上的静态方法存在，而不仅仅是在\n\n在项目中更改语言通常是一个巨大的步骤。然而，Kotlin\
  \ 通过依赖 JVM 多语言项目的标准模式减轻了这种负担。意料之的是，如果你使用 IntelliJ IDEA，还有额外的工具。我们将在第 11 章查看标准的项目布局，但现在只需要知道项目通常按如下目录布局嵌入使用的语言：\n\
  \n```\n.\n└── src\n     └── main\n          ├── java\n          │      └── JavaCode.java\n\
  \          └── kotlin\n               └── KotlinCode.kt\n```\n\n这种分离使得构建工具能够轻松找到它们需要的所有内容。\n\
  \n\n\nIDE 将根据需要引导你完成额外的步骤，但转换过程确实比切换一些源文件要复杂一些。你的构建工具需要了解 Kotlin 才能将其与你现代码一起编译。此外，Kotlin\
  \ 标准库 `kotlin-stdlib` 需要作为依赖包含在你的项目中。我们将在第 11 章中介绍更多关于管理此类依赖的内容。\n\n**注意**：IntelliJ\
  \ IDEA 提供了 Java 到 Kotlin 的翻译功能，但不支持反向翻译。它的翻译结果也可能不是编写 Kotlin 代码的理想方式。在开始大型转换时，请像往常一样准备好你的版本控制。\n\
  \nKotlin 编译为类文件（class files）并通过库提供许多额外功能，这一事实意味着，即使在项目中引入这种新语言，也不会改变你仅仅运行在老旧的 JVM\
  \ 上的这一事实。\n\n## 总结\n\n*   Kotlin 是 JVM 上一种务实且具有吸引力的替代语言。\n*   Kotlin 汲取了多年 Java\
  \ 生产环境使用的经验，并作为一种新语言，进行了 Java 由于向后兼容性可能永远无法实现的改进。\n*   Kotlin 非常看重简洁性。Java 中熟悉的结构在\
  \ Kotlin 中几乎总是可以用更少的代码实现。\n*   安全是 Kotlin 的关键，`null` 安全性直接内置在语言中，以减少生产环境中的 `NullPointerException`。\n\
  *   协程（Coroutines）为 Java 经典的线程模型提供了一个极具竞争力的并发替代方案。\n*   Kotlin 脚本 (`kts`) 使得以前属于动态语言或\
  \ shell 领域的脚本成为可能。\n*   即使是构建脚本也可以使用 Kotlin 编写，我们将在第 11 章讨论 Gradle 时详细介绍。\n\n# 10\
  \ Clojure：编程的不同视角\n\n本章涵盖\n\n*   Clojure 的身份（identity）与状态（state）概念\n*   Clojure\
  \ REPL\n*   Clojure 语法、数据结构和序列\n*   Clojure 与 Java 的互操作\n*   Clojure 宏\n\nClojure\
  \ 与 Java 以及我们目前为止学过的其他语言相比，是一种风格完全不同的语言。Clojure 是最古老的编程语言之一——Lisp 在 JVM 上的重启。如果你不熟悉\
  \ Lisp，不要担心。我们将教你所有关于 Lisp 语言族所需的知识，帮助你开始学习 Clojure。\n\n**注意**：由于 Clojure 是一种如此不同的语言，在阅读本章时，参考额外的针对\
  \ Clojure 的资源可能会有所帮助。两本优秀的书籍是 *Clojure in Action*（Manning, 2011; [https://livebook.manning.com/book/clojure-in-action]）和\
  \ *The Joy of Clojure*（Manning, 2014; [https://livebook.manning.com/book/the-joy-of-clojure-second-edition]）。\n\
  \n除了经典 Lisp 强大的编程技术传统外，Clojure 还增加了对现代 Java 开发者非常有意义的尖端技术。这种结合使得 Clojure 成为 JVM\
  \ 上脱颖出的语言，也是应用开发中极吸引力的选择。Clojure 新技术的具体示例包括它的并发工具包（我们将在第 16 章遇到）和数据结构（我们将在这里介绍并在第\
  \ 15 章进行扩展）。\n\n对于等不及看后面内容的狂热读者，我们只需说：并发抽象让程序员能够编写出比在 Java 中安全得多的多线程代码。这些抽象可以与 Clojure\
  \ 的 `seq` 概念（对集合和数据结构的不同处理方式）相结合，提供强大的强大的开发者工具箱。\n\n为了使用这些力量，一些重要的语言概念采用了与 Java\
  \ 从根本上不同的处理方法。这种方法上的差异使得学习 Clojure 变得有趣，它可能还会改变你思考编程的方式。\n\n**注意**：学习 Clojure 将帮助你在任何语言中都成为更好的程序员。函数式编程至关重要。\n\
  \n我们将从讨论 Clojure 处理状态和变量的方法开始。在一些简单的示例之后，我们将介绍该语言的基础词汇——*特殊形式*（special forms），它们等同于\
  \ Java 等语言中的关键字。其中少数几个形式用于构建语言的其余部分。\n\n我们还将深入探讨 Clojure 用于数据结构、循环和函数的语法。这将允许我们引入序列（sequences），它是\
  \ Clojure 最强大的抽象之一。\n\n我们将通过两个非常有吸引力的特性结束本章：紧密的 Java 集成和 Clojure 惊人的宏支持（这是 Lisp\
  \ 非常灵活语法的关键）。在书的后面，当我们讨论高级函数式编程（第 15 章）和高级并发（第 16 章）时，我们将遇到更多 Clojure 的优秀特性（以及 Kotlin\
  \ 和 Java 的示例）。\n\n## 10.1 介绍 Clojure\n\nLisp 语法的基本单元是由待求值的表达式组成的。这些表达式通常表示为被括号包围的零或多个符号。如果评估成功且没有错误，该表达式被称为*形式*（form）。\n\
  \n**注意**：Clojure 是编译的，而不是解释执行的，但编译器非常简单。还要记住，Clojure 是动态类型语言，因此不会有许多类型检查错误来帮助你——它们将以运行时异常的形式出现。\n\
  \n形式简单示例包括：\n\n```\n0\n(+ 3 4)\n(list 42)\n(quote (a b c))\n```\n\n语言真正的核心内置（特殊形式）很少，请注意以下几点：\n\
  \n1.  Clojure 对 *keyword*（关键字）有不同的含义，我们稍后会遇到。\n2.  Clojure（像所有 Lisp 一样）允许与库函数无法区分的构造。\n\
  \n在使用 Clojure 时，你使用的是特殊形式还是由它们构建的库函数并不重要。通过观察 Clojure 与 Java 最重要的区别之一来开始形式。这是对状态、变量和存储的处理。正如图\
  \ 10.1 所示，Java（以及 Kotlin）的状态模型涉及变量是一个“盒子”（实际上是内存位置），其内容随时间变化。\n\n(Images/CH10_F01_Evans2.png)\n\
  图 10.1 命令式语言使用\n\n像 Java 这样的编程语言默认是*可变的*，因为我们试图修改程序状态，而 Java 的状态是由对象组成的。遵循这种模型的语言通常被称为命令式语言，我们在第\
  \ 8 章讨论过。\n\nClojure 有不同。重要的概念是“值”。值可以是数字、字符串、向量、映射、集合或其他许多东西。一旦创建，值永远不会改变。这非常重要，所以我们再说一遍：*一旦创建，Clojure\
  \ 的值无法被更改*——它们是*不可变的*（immutable）。\n\n**注意**：不可变性是用于函数式编程语言的共同属性，因为它允许对函数属性的数学推理技术（例如相同的输入始终产生相同的输出）。\n\
  \n命令式语言的内容变化的盒子模型并不是 Clojure 的工作方式。图 10.2 显示了 Clojure 如何处理状态和内存。它在名称和值之间建立关联。\n\n\
  (Images/CH10_F02_Evans2.png)\n图 10.2 Clojure 内存使用\n\n这被称为*绑定*（binding），它是使用 `def`\
  \ 特殊形式完成的。让我们在这里认识 `(def)` 的语法：\n\n```\n(def <name> <value>)\n```\n\n不要担心看起来很奇怪——这在\
  \ Lisp 语法中完全正常，你很快就会习惯的。现在你可以假装括号的排列略有不同，并且你正在这样调用一个方法：\n\n```\ndef(<name>, <value>)\n\
  ```\n\n\n\n\n让我们通过一个经典的 Clojure 交互环境示例来演示 `(def)`。\n\n### 10.1.1 Clojure 中的 Hello\
  \ World\n\n如果你还没有安装 Clojure，可以在 Mac 上运行此命令进行安装：\n\n```\nbrew install clojure/tools/clojure\n\
  ```\n\n这将会通过 `brew` 从 `clojure/tools` tap 仓库安装命令行工具。对于其他操作系统，可以在 [clojure.org](https://clojure.org/)\
  \ 网站上找到相关说明。\n\n注意，Clojure 对 Windows 的支持并不完美完美。例如，`clj` 仍然处于 alpha 阶段。请务必仔细遵循官方网站上的说明进行操作。\n\
  \n安装完成后，你可以使用 `clj` 命令启动 Clojure 交互式会话。或者，如果你是从源码编译的 Clojure，请进入你安装 Clojure 的目录并运行此命令：\n\
  \n```\njava -cp clojure.jar clojure.main\n```\n\n无论哪种方式，这都会调出 Clojure 读取-求值打印循环（REPL）的用户提示符。这是一个交互式会话，你通常会在开发\
  \ Clojure 代码时在这里花费大量时间。它看起来如下：\n\n```\n$ clj\nClojure 1.10.1\nuser=>\n```\n\n`user=>`\
  \ 部分是 Clojure 会话的提示符，可以将其看作是类似于高级调试器或命令行界面。要退出会话（这将导致会话中所有积累的状态丢失），请使用传统的 Unix 组合键\
  \ `Ctrl-D`。让我们在 Clojure 中写一个“Hello World”程序：\n\n```\nuser=> (def hello (fn [] \"\
  Hello world\"))\n#'user/hello\n\nuser=> (hello)\n\"Hello world\"\nuser=>\n```\n\n\
  在这段代码中，你首先将标识符 `hello` 绑定到一个值。`(def)` 总是将标识符（Clojure 称之为 *symbols*，符号）绑定到 *values*（值）上。在背后，它还会创建一个名为\
  \ *var*（变量）的对象，用来表示这种绑定关系（以及符号的名字），如下所示：\n\n```\n(def hello (fn [] \"Hello world\"\
  ))\n --- ----- ---------------------\n  |    |             |\n  |    |         \
  \  value\n  |  symbol\n  |\nspecial form\n```\n\n你将 `hello` 绑定的值是什么？它是这个值：\n\n```\n\
  (fn [] \"Hello world\")\n```\n\n这是一个函数，在 Clojure 中，函数是一个真正的值（因此，它是不可变的）。这是一个不接受任何参数并返回字符串“Hello\
  \ world”的函数。空参数列表由 `[]` 表示。\n\n注意：在 Clojure 中（但在其他 Lisp 中不是），方括号表示一种名为 *vector*（向量）的线性数据结构——在本例中，它是函数参数的向量。\n\
  \n在绑定之后，你通过 `(hello)` 执行它。这会导致 Clojure 运行时打印函数求值的结果，即“Hello world”。\n\n记住，在 Lisp\
  \ 语言中，圆括号意味着“函数求值”，因此这个示例基本上由以下部分组成：\n\n* 创建一个函数，并将其绑定到符号 `hello`。\n* 调用绑定到符号 `hello`\
  \ 的函数。\n\n此时，你应该输入 Hello World 示例（如果你还没有输入的话），并看到它的行为如描述的那样。完成之后，我们就可以进一步探索了。\n\n\
  ### 10.1.2 开始使用 REPL\n\nREPL 允许你输入 Clojure 代码并执行 Clojure 函数。它是一个交互式环境，之前的求值结果仍然存在。这实现了一种被称为*探索性编程*（exploratory\
  \ programming）的，基本上意味着你可以对代码进行实验。在很多情况下，正确的方法是在 REPL 中尝试，一旦构建块正确，就可以构建出更大的函数。\n\n\
  注意：分解（Subdivision）是函数式编程中的关键技术——将问题分解成更小的部分，直到它变得可以解决或适用于重用模式（该模式可能已经存在于标准库中）。\n\
  \n让我们看看更多的 Clojure 语法。首先要指出的一点是，符号对值的绑定可以通过另一个 `(def)` 调用来更改，所以让我们在 REPL 中实际观察一下。我们实际上使用\
  \ `(def)` 的一个微变体 `(defn)`，如下：\n\n```\nuser=> (hello)\n\"Hello world\"\n\nuser=>\
  \ (defn hello [] \"Goodnight Moon\")\n#'user/hello\n\nuser=> (hello)\n\"Goodnight\
  \ Moon\"\n```\n\n注意，在你更改它之前，`hello` 的原始绑定仍然有效——这是 REPL 的一个关键特性。在“哪些符号绑定到了哪些值”这方面，仍然存在状态，并且这种状态在用户输入的行之间持续存在。\n\
  \n![](img/CH10_F03_Evans2.png)\n\n图 10.3 随时间变化的 Clojure 绑定。\n\n更改符号所绑定值的能力是 Clojure\
  \ 替代可变状态的方案。Clojure 并不是允许存储位置（或“内存盒”）的内容随时间改变，而是允许符号在不同时间点绑定到不同的不可变值。另一种说法是，`var`\
  \ 在程序的生命周期内可以指向不同的值。可以在图 10.3 中看到示例。\n\n注意：可变状态与不同时间的不同绑定之间的区别是微妙的，但这是一个非常重要的概念。\n\
  \n### 10.1.3 犯错\n\n如果你犯了错会怎样？假设你想要声明一个函数，但不小心 `def` 了一个值，如下：\n\n```\nuser=> (def\
  \ hello \"Goodnight Moon\")\n#'user/hello\n\nuser=> (hello)\nExecution error (ClassCastException)\
  \ at user/eval137 (REPL:1).\nclass java.lang.String cannot be cast to class clojure.lang.IFn\n\
  (java.lang.String is in module java.base of loader 'bootstrap';\nclojure.lang.IFn\
  \ is in unnamed module of loader 'app')\n```\n\n这里有几点注意。首先，错误是运行时异常。这意味着 `(hello)`\
  \ 形式编译正常；它只是在运行时失败了。用等值的 Java 代码表示，它看起来像这样（为了方便熟悉 Clojure 或语言实现的人理解，我们进行了一些简化）：\n\
  \n```java\n// (def hello \"Goodnight Moon\")\nvar helloSym = Symbol.of(\"user\"\
  , \"hello\");\nvar hello = Var.of(helloSym, \"Goodnight Moon\");\n\n// 或者\nvar hello\
  \ = Var.of(Symbol.of(\"user\", \"hello\"), \"Goodnight Moon\");\n\n// #'user/hello\n\
  \n// (hello)\nhello.invoke();\n```\n\n\n\n\n其中 `Symbol` 和 `Var` 是 `clojure.lang`\
  \ 包中的类，该包提供了 Clojure 运行时的核心。它们看起来类似于这些基础实现，我们在这里对它们进行了简化：\n\n```java\npublic class\
  \ Symbol {\n    private final String ns;\n    private final String name;\n\n   \
  \ private Symbol(String ns, String name) {\n        this.ns = ns;\n        this.name\
  \ = name;\n    }\n    // toString() etc\n}\n\npublic class Var implements IFn {\n\
  \    private volatile Object root;\n\n    public final Symbol sym;\n    public final\
  \ Namespace ns;\n\n    private Var(Symbol sym, Namespace ns, Object root) {\n  \
  \      this.sym = sym;\n        this.ns = ns;\n        this.root = root;\n    }\n\
  \n    public static Var of(Symbol sym, Object root){\n        return new Var(sym,\
  \ Namespace.of(sym), root);\n    }\n\n    static public class Unbound implements\
  \ IFn {\n        final public Var v;\n        public Unbound(Var v){\n         \
  \   this.v = v;\n        }\n\n        @Override\n        public String toString(){\n\
  \            return \"Unbound: \" + v;\n        }\n    }\n\n    public synchronized\
  \ void bindRoot(Object root) {\n        this.root = root;\n    }\n\n    public synchronized\
  \ void unBindRoot(Object root) {\n        this.root = new Unbound(this);\n    }\n\
  \n    @Override\n    public Object invoke() {\n        return ((IFn)root).invoke();\n\
  \    }\n\n    @Override\n    public Object invoke(Object o1) {\n        return ((IFn)root).invoke(o1);\n\
  \    }\n\n    @Override\n    public Object invoke(Object o1, Object o2) {\n    \
  \    return ((IFn)root).invoke(o1, o2);\n    }\n\n    @Override\n    public Object\
  \ invoke(Object o1, Object o2, Object o3) {\n        return ((IFn)root).invoke(o1,\
  \ o2, o3);\n    }\n    // ...\n}\n```\n\n至关重要的接口 `IFn` 看起来如下如下：\n\n```java\npublic\
  \ interface IFn {\n    default Object invoke() {\n        return throwArity();\n\
  \    }\n    default Object invoke(Object o1) {\n        return throwArity();\n \
  \   }\n    default Object invoke(Object o1, Object o2) {\n        return throwArity();\n\
  \    }\n    default Object invoke(Object o1, Object o2, Object o3) {\n        return\
  \ throwArity();\n    }\n\n    // ... 许多其他的，包括最后的变长形式\n\n    default Object throwArity(){\n\
  \        throw new IllegalArgumentException(\"Wrong number of args passed: \"\n\
  \                + toString());\n    }\n}\n```\n\n`IFn` 是 Clojure 表达式工作机制的关键——表达式中的第一个元素被视为一个函数，或者是一个待调用的函数名。剩余的元素是函数的参数，并会调用具有相应参数数量（元数）的\
  \ `invoke()` 方法。\n\n如果 Clojure `var` 没有绑定到实现 `IFn` 的值，则在运行时会抛出 `ClassCastException`。如果该值是一个\
  \ `IFn`，但表达式尝试用错误的参数数量调用它，则会抛出 `IllegalArgumentException`（实际上是一个名为 `ArityException`\
  \ 的子类型）。\n\n注意：记住 Clojure 是动态类型的，正如你在多个地方看到的，例如，`IFn` 中所有方法的参数和返回类型都是 `Object`，而且\
  \ `IFn` *不是* Java 风格的 `@FunctionalInterface`，相反，它上面定义了多个方法来处理许多不同的元数。\n\n这种对内部机制的窥视应该有助于理清一部分\
  \ Clojure 的语法以及所有这些是如何整合在一起的。然而，我们仍然有一些坏代码需要修复——但幸运的是，这并不难！\n\n发生这一切仅仅是你将 `hello`\
  \ 标识符绑定到了一个不是函数的内容上，因此它无法被调用。在 REPL 中，你可以通过简单地重新绑定来修复这个问题：\n\n```clojure\nuser=>\
  \ (defn hello [] (println \"Dydh da an Nor\")) ; 康沃尔沃尔语中的“Hello World”\n#'user/hello\n\
  \nuser=> (hello)\nDydh da an Nor\nnil\n```\n\n正如你从前面的代码段中猜的那样，分号（`;`）字符意味着到行尾的所有都是注释，而\
  \ `(println)` 是打印字符串的函数。注意，`(println)` 与所有函数一样都会返回一个值，该值会在函数执行结束时回显到 REPL。\n\nClojure\
  \ 没有像 Java 那样的语句，只有表达式，因此所有函数必须返回一个值。如果没有值可以返回，则使用 `nil`，它基本上是 Java `null` 的 Clojure\
  \ 等价物。在 Java 中 `void` 的函数在 Clojure 中将返回 `nil`。\n\n### 10.1.4 学习喜欢括号\n\n程序员文化一直带有大量的俏皮和幽默元素。最老的笑话之一是，Lisp\
  \ 是 *Lots of Irritating Silly Parentheses*（许多烦人的愚蠢括号）的缩写（而不是更平实的真相——即它是 *list processing*（列表处理）的缩写）。这种带有自嘲的玩笑在某些\
  \ Lisp 程序员中很流行，部分是因为它指出了一个不幸的事实：Lisp 语法以难学闻名。\n\n事实上，这种障碍被夸大了。Lisp 语法与大多数人的习惯不同，但它并不像被描述的那样是一个障碍。此外，Clojure\
  \ 有几项创新进一步降低了门槛。\n\n让我们再次看看 Hello World 例子。为了调用返回“Hello World”的函数，我们写了：\n\n```clojure\n\
  (hello)\n```\n\n如果我们想要带参数的函数，而不是 `myFunction(someObj)`，在 Clojure 中我们写 `(myFunction\
  \ someObj)`。这种语法被称为波兰式，因为它是由 20 世纪的波兰数学家开发的（也被称为前缀表示法）。\n\n如果你学习过编译器理论，你可能会怀疑这里与抽象语法树（AST）的概念是否有联系。短答案是肯定的。一个\
  \ Clojure（或其他 Lisp）程序以波兰式（通常被 Lisp 程序员称为 s-表达式）编写，可以证明它是程序 AST 的非常简单直接的表示。\n\n注意：这再次回到了\
  \ Clojure 编译器的简单性。Lisp 代码的编译是非常廉价的操作，因为其结构非常接近 AST。\n\n你可以认为 Lisp 程序是根据其 AST 直接编写的。表示\
  \ Lisp 程序的数据结构与代码之间没有真正的区别，因此代码和数据可以交换。这就是这种奇怪符号的原因：Lisp 语言利用它来模糊内置原语与用户代码之间的区别。这种力量对于新来的\
  \ Java 程序员来说，远大于语法的细微差异。让我们深入研究一些语法，并开始使用 Clojure 构建程序。\n\n## 10.2 寻找 Clojure：语法与语义\n\
  \n在上一节中，你学习了 `(def)` 和 `(fn)` 特殊形式（我们也遇到了 `(defn)`，但它是一个宏，而不是特殊形式）。你只需要掌握少量其他特殊形式就能为语言提供基础词汇。此外，Clojure\
  \ 提供了大量实用的形式和宏，随着练习，你会对它们更加了解。\n\nClojure 拥有许多实用的函数来完成各种可能的任务。不要被它们吓倒——拥抱它们。高兴对于你在\
  \ Clojure 中可能面临许多实际编程任务，已经有人为你完成了大部分工作。\n\n在这一节中，我们将涵盖基础特殊形式，然后进入 Clojure 的原生数据类型（Java\
  \ 集合的等价物）。之后，我们将进入编写 Clojure 的自然风格——即函数而非变量的核心。JVM 的面向对象特性仍然存在于底层，但 Clojure 对函数的强调这种力量在纯面向对象的语言中并不明显，而且远超\
  \ `map()`、`filter()` 和 `reduce()` 的基础。\n\n### 10.2.1 特殊形式训练营\n\n\n\n\n表 10.1 涵盖了\
  \ Clojure 中常用的特殊形式（special forms）的定义。为了充分利用此表，请现在先快速浏览一遍，并在阅读 10.3 节及之后的示例时，根据需要随时查阅。该表使用了传统的正则表达式语法符号，其中\
  \ `?` 表示单个可选值，而 `*` 表示零或多个值。\n\n这并不是特殊形式的详尽列表，而且很大一部分形式有多种使用方式。表 10.1 是基础用例的入门集合，并非详尽内容。\n\
  \n### 表 10.1 Clojure 的一些基础特殊形式\n\n| 特殊形式 | 含义 |\n| --- | --- |\n| `(def <symbol>\
  \ <value?>)` | 将符号绑定到一个值（如果提供了的话）；必要时为该符号创建一个相应的 `var` |\n| `(fn <name>? [<arg>*]\
  \ <expr>*)` | 返回一个函数值，该函数接受指定的 args 并将其应用于 exprs；通常与 `(def)` 组合成如 `(defn)` 等形式 |\n\
  | `(if <test> <then> <else>?)` | 如果 test 求值为逻辑真，则求值并返回 then；否则，如果存在 else，则求值并返回\
  \ |\n| `(do <expr>*)` | 从左到右顺序求值 exprs 并返回最后一个的值 |\n| `(let [<binding>*] <expr>*)`\
  \ | 将值别名为局部名称并隐式定义作用域；使别名在 let 作用域内的所有 exprs 中均可用 |\n| `(quote <form>)` | 原样返回形式而不求值任何内容；接受单个形式并忽略所有其他参数\
  \ |\n| `(var <symbol>)` | 返回与符号对应的 `var`（返回的是一个 Clojure JVM 对象，而不是值） |\n\n有几点需要进一步解释，因为\
  \ Clojure 代码的结构初看可能与 Java 代码非常不同。首先，`(do)` 形式是构建 Java 中语句块（block of statements）的最简单方法之一。\n\
  \n其次，我们需要更深入地理解 `var`、值（value）以及值所（临时）绑定的符号（symbol）之间的区别。这段代码创建了一个名为 `hi` 的 Clojure\
  \ `var`。这是一个 JVM 对象（类型为 `clojure.lang.Var` 的实例），它存在堆内存中——像所有对象一样——并将其绑定到包含“hello”的\
  \ `java.lang.String` 对象：\n\n```\nuser=> (def hi \"Hello\")\n#'user/hi\n```\n\n该\
  \ `var` 拥有符号 `hi`，并且还有一个 Clojure 用于组织程序的命名空间 `user`——类似于 Java 包。如果我们在 REPL 中直接使用该装饰符号，它将求值为其当前绑定的值，如下：\n\
  \n```\nuser=> hi\n\"Hello\"\n```\n\n在 `(def)` 形式中，我们将一个新符号绑定到一个值，因此在下面的代码中：\n\n\
  ```\nuser=> (def bye hi)\n#'user/bye\n```\n\n符号 `bye` 被绑定到 `hi` 当前绑定的值上，如下：\n\n\
  ```\nuser=> bye\n\"Hello\"\n```\n\n实际上，在这个简单的形式中，`hi` 被求值，并且符号被替换为产生的结果值。\n\n然而，Clojure\
  \ 提供的可能性远不止于此。例如，符号所绑定的值可以是任何 JVM 值。因此，我们可以符号绑定到我们创建的 `var` 上，因为 `var` 本身就是一个 JVM\
  \ 对象。这通过如下所示的 `(var)` 特殊形式实现：\n\n```\nuser=> (def bye (var hi))\n#'user/bye\n\n\
  user=> bye\n#'user/hi\n```\n\n这利用了 Java/JVM 对象始终通过引用处理的这一事实，如图 10.4 所示。\n\n![](img/CH10_F04_Evans2.png)\n\
  \n图 10.4 按引用作用的 Clojure var\n\n要获取 `var` 中包含的值，我们可以使用 `(deref)` 形式（“dereference”的缩写），如下：\n\
  \n```\nuser=> (deref bye)\n\"Hello\"\n```\n\n还有一个 `(ref)` 形式，用于 Clojure 中的安全并发编程——我们将在第\
  \ 16 节遇到它。\n\n理解了 `var` 与其当前绑定的值之间的区别后，`(quote)` 形式应该更容易理解了。它不是求值传递的形式，而是简单的返回一个由未求值符号组成的形式。\n\
  \n现在你已经熟悉了一些基础特殊形式的语法，让我们转向 Clojure 的数据结构，开始观察这些形式如何作用于数据。\n\n### 10.2.2 列表、向量、映射和集合\n\
  \nClojure 有几种原生数据结构。最熟悉的是列表（list），它在 Clojure 中是单链表。\n\n注意：在某些方面，Clojure 列表类似于 Java\
  \ 中的 `LinkedList`，区别在于 `LinkedList` 是双向链表，每个元素都有指向下一个元素和上一个元素的引用。\n\n列表通常被括号包围，这似乎带来了一个微小的语法障碍，因为圆括号也用于通用形式。特别是，圆括号用于函数调用的求值。这导致了以下常见的学者语法错误：\n\
  \n```\nuser=> (1 2 3)\nExecution error (ClassCastException) at user/eval1 (REPL:1).\n\
  class java.lang.Long cannot be cast to class clojure.lang.IFn\n(java.lang.Long is\
  \ in module java.base of loader 'bootstrap';\nclojure.lang.IFn is in unnamed module\
  \ of loader 'app')\n```\n\n问题在于，由于 Clojure 对值的处理非常灵活，它期望第一个参数是一个函数值（或解析为函数的符号），以便它可以调用该函数并将\
  \ 2 和 3 作为参数；1 并不是函数值，所以 Clojure 无法求值该形式。我们称这种 s 表达式（s-expression）是非法的，并记住只有有效的\
  \ s 表达式才是 Clojure 形式。\n\n解决方案是使用我们在上一节见过的 `(quote)` 形式。它有一个方便的简写 `'`。这为我们提供了两种编写该列表的等效方式，该列表由数字\
  \ 1、2 和 3 这三个元素组成的不可变列表组成：\n\n```\nuser=> '(1 2 3)\n(1 2 3)\n\nuser=> (quote (1\
  \ 2 3))\n(1 2 3)\n```\n\n注意，`(quote)` 以特殊方式处理其参数。特别是，它不会尝试对参数进行求值，因此不会因为第一个槽位缺少函数值而产生错误。\n\
  \nClojure 有向量（vectors），它们类似于数组（事实上，将列表基本看作 Java 的 `LinkedList`，将向量看作 Java 的 `ArrayList`\
  \ 并不荒谱）。它们有种方便的字面量形式，使用方括号，因此以下所有内容都是等价的：\n\n```\nuser=> (vector 1 2 3)\n[1 2 3]\n\
  \nuser=> (vec '(1 2 3))\n[1 2 3]\n\nuser=> [1 2 3]\n[1 2 3]\n```\n\n我们已经见过向量了。当我们声明\
  \ Hello World 函数和其他函数时，我们使用向量来指示所声明函数接受的参数。注意，`(vec)` 形式接受列表并从中创建一个向量，而 `(vector)`\
  \ 是一个接受多个符号并返回它们的向量的形式。\n\n`(nth)` 函数用于集合接收两个参数：一个集合和一个索引。它可以被认为类似于 Java `List`\
  \ 接口中的 `get()` 方法。它可以用于向量和列表，也可以用于 Java 集合甚至字符串（字符串被视为字符集合）。这是一个示例：\n\n```\nuser=>\
  \ (nth '(1 2 3) 1)\n2\n```\n\nClojure 还支持映射（你可以认为它们非常类似于 Java 的 `HashMap`——它们实际上也实现了\
  \ `Map` 接口），具有这种简单的字面量语法：\n\n```\n{key1 value1 key2 value2}\n```\n\n要从映射中获取值，下文所示的语法非常简单：\n\
  \n```\nuser=> (def foo {\"aaa\" \"111\" \"bbb\" \"2222\"})\n#'user/foo\n\nuser=>\
  \ foo\n{\"aaa\" \"111\", \"bbb\" \"2222\"}\n\nuser=> (foo \"aaa\")\n\"111\"\n```\n\
  \n这种语法等同于 Java 中 get 方法的使用。\n\n除了 `Map` 接口外，Clojure 映射还实现了 `IFn` 接口，这就是为什么可以使用 `(foo\
  \ \"aaa\")` 形式而不产生运行时异常。\n\n一个非常有用的风格技巧是使用带有冒号前缀的键。Clojure 将这些称为关键字（keywords）。\n\
  \n\n\n\n\n注意：Clojure 中“keyword”（关键字）的用法显然与其他语言（包括 Java）中的术语含义不同，在那些语言中，该术语指的是语言语法中保留的、不能作为标识符的部分。\n\
  \n以下是一些关于关键字和 map（映射）需要记住的有用用点：\n\n*   Clojure 中的 keyword 是一个接受一个参数的函数，该参数必须是一个\
  \ map。\n*   在 map 上调用关键字函数会返回 map 中与该关键字函数对应的值。\n*   使用关键字时，语法上有一个非常有用的对称性，例如 `(my-map\
  \ :key)` 和 `(:key my-map)` 都是合法的。\n*   作为值时，keyword 返回它本身。\n*   keyword 在使用前不需要声明或\
  \ `def`。\n*   记住 Clojure 函数是值，因此它们可以被用作 map 的键。\n*   可以使用逗号来分隔键值对（但并非必须），因为 Clojure\
  \ 将其视为空白字符。\n*   关键字之外的符号（symbols）也可以作为 Clojure map 的键，但关键字语法非常有用，值得作为你代码中的一种风格来强调。\n\
  \n让我们在这里看看这些点的实际应用：\n\n```\nuser=> (def martijn {:name \"Martijn Verburg\", :city\
  \ \"London\",\n:area \"Finsbury Park\"})\n#'user/martijn\n\nuser=> (:name martijn)\
  \   ❶\n\"Martijn Verburg\"\n\nuser=> (martijn :area)   ❷\n\"Finsbury Park\"\n\n\
  user=> :area             ❸\n:area\n\nuser=> :foo              ❸\n:foo\n```\n\n❶\
  \ 在 map 上调用关键字函数\n❷ 在 map 中查找与关键字关联的值\n❸ 显示了当关键字作为值进行求值时，它返回它本身\n\n除了 map 字面量（literals）外，Clojure\
  \ 还有一个 `(map)` 函数。但不要被误导。与 `(list)` 不同，`(map)` 函数不会产生一个 map。相反，`(map)` 将提供的函数依次应用到集合中的每个元素，并根据返回的新值构建一个新集合（实际上是一个\
  \ Clojure 序列，你将在 10.4 节中详细接触）。这当然是 Clojure 等同于你已经在 Java Streams API 中见过的 `map()`\
  \ 方法，如下所示：\n\n```\nuser=> (def ben {:name \"Ben Evans\", :city \"Barcelona\", :area\n\
  \"El Born\"})\n#'user/ben\n\nuser=> (def authors [ben martijn])          ❶\n#'user/authors\n\
  \nuser=> (defn get-name [y] (:name y))\n#'user/get-name\n\nuser=> (map get-name\
  \ authors)               ❷\n(\"Ben Evans\" \"Martijn Verburg\")\n\nuser=> (map (fn\
  \ [y] (:name y)) authors)     ❸\n(\"Ben Evans\" \"Martijn Verburg\")\n```\n\n❶ 创建一个包含作者数据\
  \ map 的向量\n❷ 在数据上 映射 `get-name` 函数\n❸ 使用内联函数字面量交替使用的形式\n\n`(map)` 还有其他形式，可以同时处理多个集合，但接受单个集合作为输入的形式是最常见的。\n\
  \nClojure 还支持 set（集合），它们与 Java 的 `HashSet` 非常相似。它们有一种数据结构字面量的短格式形式，不支持重复的键（与 `HashSet`\
  \ 不同），所示：\n\n```\nuser=> #{\"a\" \"b\" \"c\"}\n#{\"a\" \"b\" \"c\"}\n\nuser=> #{\"\
  a\" \"b\" \"a\"}\nSyntax error reading source at (REPL:15:15).\nDuplicate key: a\n\
  ```\n\n这些数据结构为构建 Clojure 程序提供了基础。\n\n一个让 Java 原生用户感到惊讶的是，文中没有提到将对象作为一等公民。这并不是说 Clojure\
  \ 不是面向对象的，但它看待面向对象（OO）的方式与 Java 完全不同。Java 选择通过静态类型的数据和代码包来观察世界，这些包位于用户定义数据类型的显式类定义中。Clojure\
  \ 则而强调函数和形式，尽管这些在 JVM 后在这些上是作为对象实现的。\n\nClojure 和 Java 之间这种哲学上的区别体现在这两种语言的代码编写方式上。为了完全理解\
  \ Clojure 的观点，有必要用 Clojure 编写程序，并理解弱化 Java OO 结构带来的某些优势。\n\n### 10.2.3 算术、等价和其他操作\n\
  \nClojure 没有你可能在 Java 中预期的那种意义上的运算符。那么，例如，你如何相加两个数字呢？在 Java 中这很容易：\n\n```\n3 + 4\n\
  ```\n\n但 Clojure 没有运算符。我们必须使用函数，如下：\n\n```\n(add 3 4)   ❶\n```\n\n❶ 这段代码目前无法工作，除非我们提供一个\
  \ `add` 函数。\n\n这些都固然很好，但我们可以做得更好。因为 Clojure 中没有运算符，我们不需要预留键盘上的任何字符来表示它们。这意味着我们的函数名可以比\
  \ Java 更加奇特，我们可以这样写：\n\n```\n(+ 3 4)   ❶\n```\n\n❶ 这字面上就是我们之前讨论过的波兰表示法。\n\nClojure\
  \ 的函数在很多情况下是变变的（它们接受可数量的输入），所以例如，你可以写：\n\n```\n(+ 1 2 3)\n```\n\n这会得到 6。\n\n对于等价形式（相当于\
  \ Java 中的 `equals()` 和 `==`），情况有点复杂。Clojure 有两个主要的形式：`=` 和 `identical?`。\n\n```\n\
  user=> (def list-int '(1 2 3))\n#'user/list-int\n\nuser=> (def vect-int (vec 1 2\
  \ 3))\n#'user/vect-int\n\nuser=> (= vect-int list-int)\ntrue\n\nuser=> (identical?\
  \ vect-int list-int)\nfalse\n```\n\n关键点在于 `=` 检查集合是否包含相同的对象（对于 `list-int` 和 `vect-int`\
  \ 为真），而 `identical?` 检查它们是否真的是同一个。\n\n你可能还会注意到符号名称没有使用驼峰命名。这是 Clojure 的习惯。符号通常全小写，单词间使用连字符（称为\
  \ kebab case）。\n\nClojure 中的真与假\n\nClojure 提供了两个逻辑假的值：`false` 和 `nil`。其他任何都是逻辑真（包括字面量\
  \ `true`）。这与许多语言（例如 JavaScript）相似，但对于第一次接触它的 Java 程序员来说有点奇怪。\n\n在掌握了基础数据结构和运算符之后，让我们结合见过的特殊形式和函数编写稍微复杂的\
  \ Clojure 函数。\n\n### 10.2.4 在 Clojure 中处理函数\n\n在本节中，我们将开始处理 Clojure 编程的核心内容。我们将开始编写处理数据的函数，并让\
  \ Clojure 对函数的关注成为重点。接下来是 Clojure 的循环结构，然后是读取器宏（reader macros）和分发形式。我们最后通过讨论 Clojure\
  \ 的函数式编程方法及其对闭包（closures）的处理来结束本节。\n\n开始这一切最好的方法是通过示例，让我们从简单的示例开始，构建 Clojure 提供的强大的函数式编程技术。\n\
  \n简单的 Clojure 函数\n\n下一个列表定义了三个函数，其中两个是非常简单的单参数函数；第三个稍微复杂。\n\n列表 10.1 定义简单的 Clojure\
  \ 函数\n\n```\n(defn const-fun1 [y] 1)\n\n(defn ident-fun [y] y)\n\n(defn list-maker-fun\
  \ [x f]      ❶\n   (map (fn [z] (let [w z]      ❷\n       (list w (f w))       \
  \    ❸\n   )) x))\n```\n\n❶ 列表生成接受两个参数，第二个是函数。\n❷ 一个内联匿名函数\n❸ 创建包含两个元素的列表：值和应用 f\
  \ 于该值的结果。\n\n\n\n\n\n在这一项列表中，`(const-fun1)` 接收一个值并返回 1，而 `(ident-fun)` 接收一个值并返回该值本身。数学家会将这些称为`常量函数`（constant\
  \ function）和`恒等函数`（identity function）。你还可以看到，函数的定义使用了向量字面量来表示函数的参数以及 `(let)` 形式。\n\
  \n第三个函数更为复杂。函数 `(list-maker-fun)` 接收两个参数：首先是一个要操作的值向量，称为 `x`；其次是一个函数（称为 `f`）。如果我们用\
  \ Java 来编写它，它看起来可能像这样：\n\n```java\n public List<Object> listMakerFun(List<Object>\
  \ x,\n                                     Function<Object, Object> f) {\n     \
  \   return x.stream()\n                .map(o -> List.of(o, f.apply(o)))\n     \
  \           .collect(toList());\n    }\n```\n\n在 Clojure 中内联匿名函数的作用由 Java 代码中的 lambda\
  \ 表达式承担。然而，重要的是不要夸大这两个代码列表之间的等效性——Clojure 和 Java 是两种`非常`不同的语言。\n\n**注意**：将其他函数作为参数的函数被称为高阶函数。我们将在第\
  \ 15 章详细介绍它们。\n\n让我们来看 `(list-maker-fun)` 是如何工作的。\n\n#### 列表 10.2 使用函数\n\n```clojure\n\
  user=> (list-maker-fun [\"a\"] const-fun1)\n((\"a\" 1))\n\nuser=> (list-maker-fun\
  \ [\"a\" \"b\"] const-fun1)\n((\"a\" 1) (\"b\" 1))\n\nuser=> (list-maker-fun [2\
  \ 1 3] ident-fun)\n((2 2) (1 1) (3 3))\n\nuser=> (list-maker-fun [2 1 3] \"a\")\n\
  java.lang.ClassCastException: java.lang.String cannot be cast to\n  clojure.lang.IFn\n\
  ```\n\n请注意，当你向 REPL 这些这些表达式时，你是在与 Clojure 编译器交互。表达式 `(list-maker-fun [2 1 3] \"\
  a\")` 无法运行（尽管它可以通过编译），因为 `(list-maker-fun)` 期望其第二个参数是一个函数，而字符串不是。所以，尽管 Clojure 编译器为该形式输出了字节码，但它会在运行时因异常失败。\n\
  \n**注意**：在 Java 中，我们可以编写出有效的代码，如 `Integer.parseInt(\"foo\")`，它可以正常编译，但在运行时始终会失败。Clojure\
  \ 的情况也是类似的。\n\n这个示例表明，在与 REPL 交互时，你仍然处于某种静态类型的作用中，因为 Clojure 并不是解释型语言。即使在 REPL 中，每个带有类型的\
  \ Clojure 形式都会被编译为 JVM 字节码并链接到运行系统中。Clojure 函数在定义时就会被编译为 JVM 字节码，因此 `ClassCastException`\
  \ 的发生是因为 JVM 中的静态类型违反。\n\n列表 10.3 显示了一段较长的 Clojure 代码，`施瓦茨变换`（Schwartzian transform）。这是编程史的一部分，由\
  \ 20 世纪 90 年代的 Perl 编程语言推广。其思想是对向量进行排序操作，但不是基于提供的向量，而是基于向量元素的某些属性。用于排序的属性值通过对元素调用`键值函数`找到。\n\
  \n列表 10.3 中施瓦茨变换的定义调用了键值函数 `key-fn`。当你实际上调用 `(schwartz)` 函数时，你需要提供一个用于键值的函数。在这段代码示例中，我们使用了老朋友、来自列表\
  \ 10.1 的 `(ident-fun)`。\n\n#### 列表 10.3 施瓦茨变换\n\n```clojure\nuser=> (defn schwartz\
  \ [x key-fn]\n  (map (fn [y] (nth y 0))             ❶\n    (sort-by (fn [t] (nth\
  \ t 1))       ❷\n      (map (fn [z] (let [w z]         ❸\n        (list w (key-fn\
  \ w))\n      )) x))))\n#'user/schwartz\n\nuser=> (schwartz [2 3 1 5 4] ident-fun)\n\
  (1 2 3 4 5)\n\nuser=> (apply schwartz [[2 3 1 5 4] ident-fun])\n(1 2 3 4 5)\n```\n\
  \n❶ 使用键值函数创建一个由键对组成的列表\n\n❷ 根据键值函数的值对键对进行排序\n\n❸ 通过还原构造新列表——从每个对中只取原始值\n\n这段代码正在执行三个独立的步骤，乍看之下可能显得有点反倒。这些步骤如图\
  \ 10.5 所示。\n\n![](img/CH10_F05_Evans2.png)\n\n图 10.5 施瓦茨变换\n\n注意，在列表 10.3 中，我们引入了一个新形式：`(sort-by)`。这是一个接收两个参数的函数：一个用于排序的函数和一个要排序的向量。我们还展示了\
  \ `(apply)` 形式，它接收两个参数：要调用的函数和一个传递给它的参数向量。\n\n施瓦茨变换的一个有趣方面是，以它的名字命名的人在想出 Perl 版本时刻意在模仿\
  \ Lisp。在此处的 Clojure 代码中表示它，意味着我们绕了一圈——又回到了 Lisp 上！\n\n施瓦茨变换是一个非常有用的例子，我们以后会再次提到。它包含了足够的复杂性来演示许多非常有用的概念。现在让我们继续讨论\
  \ Clojure 中的循环，它们的工作方式与你可能习惯的有所。\n\n### 10.2.5 Clojure 中的循环\n\nJava 中的循环是一个相当直接的命题：开发者可以从\
  \ `for`、`while` 和其他几种循环类型中选择。通常的核心概念是重复一组语句，直到满足条件（通常用可变变量表示）。\n\n这在 Clojure 中为我们带来了一个轻微的困境：当没有可变变量作为循环索引时，我们该如何表达\
  \ `for` 循环？在更传统的 Lisp 中，这种情况通常通过将迭代循环重写为使用递归的形式来解决。\n\n然而， JVM 并不保证优化尾递归（Scheme\
  \ 和其他 Lisp 所要求的），因此天真地使用递归会导致栈溢出。我们将在第 15 章对此进行更多说明。\n\n相反，Clojure 提供了一些实用的构造，允许在不增加栈的情况下循环。最常见的之一是\
  \ `loop-recur`。接下来的片段展示了如何使用 `loop-recur` 构建一个简单的结构：\n\n```clojure\n(defn like-for\
  \ [counter]\n  (loop [ctr counter]      ❶\n    (println ctr)\n    (if (< ctr 10)\n\
  \      (recur (inc ctr))    ❷\n      ctr))\n```\n\n❶ 循环入口点\n\n❷ 向后跳转的 recur 点\n\n\
  `(loop)` 形式接收一个带有局部符号符号名称的参数向量——效果等同于 `(let)` 的别名。然后，当执行到达 `(recur)` 形式时（在本示例中，只有当\
  \ `ctr` 小于 10 时才会执行），`(recur)` 会控制跳转回 `(loop)` 形式，但使用指定的新值。这类似于一种相当原始的循环构造形式，如下：\n\
  \n```java\npublic int likeFor(int ctr) {\n        LOOP: while (true) {\n       \
  \     System.out.println(ctr);\n            if (ctr < 10) {\n                ctr\
  \ = ctr + 1;\n                continue LOOP;\n            } else {\n           \
  \     return ctr;\n            }\n        }\n    }\n```\n\n然而，对于函数式程序员来说，提前返回的唯一常见原因是满足了某些条件。然而函数返回最后一个执行的形式的结果，而\
  \ `(if)` 基本为我们做了这一点。\n\n在我们的示例中，我们将 `(recur)` 放在了 `if` 的主体中，并将计数器放在了 `else` 位置。这允许我们构建迭代式的结构（例如\
  \ Java `for` 和 `while` 循环的等价物），但仍保持函数的风格。现在我们转向下一个主题，查看 Clojure 语法中实用的简写，以帮助你的程序更短、更简洁。\n\
  \n### 10.2.6 读器宏和分发\n\nClojure 具有一些令 Java 程序员惊讶的语法特征。其中之一就是缺乏运算符。这带来的副作用放宽了 Java\
  \ 对函数名可用字符的限制。你已经遇到过如 `(identical?)` 这样的函数，这在 Java 中是非法的，但我们还没有讨论过关于哪些字符允许或不允许用于符号的问题。\n\
  \n\n\n\n表 10.2 列出了 Clojure 符号中不允许使用的字符。这些字符都是被 Clojure 解析器为自身使用而保留的字符。它们通常被称为*读取器宏（reader\
  \ macros）*，本质上是一种特殊的字符序列，当读取器（Clojure 编译器的第一部分）看到它们时，会改变读取器的行为。\n\n例如，`;` 读取器宏是\
  \ Clojure 实现单行注释的方式。当读取器看到 `;` 时，它会立即忽略该行中剩余的所有字符，然后重置以读取下一行输入。\n\n注意：稍后我们将会遇到 Clojure\
  \ 的通用（或称普通）宏（regular macros）。不要将读取器宏与普通宏混淆，这是重要的。\n\n读取器宏的存在仅仅是为了语法的简洁和方便，而不是为了提供完全的通用型元编程能力。\n\
  \n### 表 10.2 读取器宏\n\n| 字符 | 名称 | 含义 |\n| --- | --- | --- |\n| `'` | Quote (引用) |\
  \ 展开为 `(quote)`；产生未求值的形式 |\n| `;` | Comment (注释) | 标记注释到行尾；类似于 Java 中的 `//` |\n\
  | `\\` | Character (字符) | 产生字面量字符，例如 `\\n` 表示换行 |\n| `@` | Deref (解引用) | 展开为 `(deref)`，它接收一个\
  \ var 对象并返回该对象中的值（与 `(var)` 形式的操作相反）；在事务内存上下文中具有额外含义（参见第 15 章） |\n| `^` | Metadata\
  \ (元数据) | 为对象附加一个元数据映射；详情请参阅 Clojure 文档 |\n| `` ` `` | Syntax-quote (语法引用) | 经常用于宏定义中的\
  \ quote 形式；详情见宏章节 |\n| `#` | Dispatch (分发) | 有若干种不同的子形式；参见表 10.3 |\n\n分发读取器宏有几种不同的子形式，取决于\
  \ `#` 字符后面紧跟的内容。表 10.3 显示了不同的可能形式。\n\n### 表 10.3 分发读取器宏的子形式\n\n| 分发形式 | 含义 |\n|\
  \ --- | --- |\n| `#'` | 展开为 `(var)` |\n| `#{}` | 创建一个集合字面量，如 10.2.2 节所示 |\n| `#()`\
  \ | 创建一个匿名函数字面量；对于 `(fn)` 太啰嗦的单次使用场景非常有用 |\n| `#_` | 跳过下一个形式；可以通过 `#_ ( ... multiline\
  \ ...)` 产生多行注释 |\n| `#\"<pattern>\"` | 创建一个正则表达式字面量（作为 `java.util.regex.Pattern`\
  \ 对象） |\n\n关于分发形式还有几点补充说明。接下来显示的 var-quote（`#'`）形式解释了为什么在执行 `(def)` 之后 REPL 的行为表现是那样的：\n\
  \n```\nuser=> (def someSymbol)\n\n#'user/someSymbol\n```\n\n`(def)` 形式返回新创建的名为 `someSymbol`\
  \ 的 var 对象，它位于当前命名空间（在 REPL 中为 `user`），因此 `#'user/someSymbol` 就是从 `(def)` 返回的完整值。\n\
  \n匿名函数字面量 `#()` 还有一个减少冗余的重大创新——它省略了参数向量，而是使用一种特殊的语法，允许 Clojure 读取器推断函数字面量需要多少参数。该语法是\
  \ `%N`，其中 N 是函数的参数编号。\n\n让我们回到早期的例子，看看如何与匿名函数一起使用它。记得 `(list-maker-fun)` 它接收两个参数（一个列表和一个函数），并通过依次将函数应用到每个元素上来创建一个新列表：\n\
  \n```\n(defn list-maker-fun [x f]\n   (map (fn [z] (let [w z]\n       (list w (f\
  \ w))\n   )) x))\n```\n\n与其费力定义一个单独的符号，不如如下所示使用内联函数调用此函数：\n\n```\nuser=> (list-maker-fun\
  \ [\"a\" \"b\"] (fn [x] x))\n((\"a\" \"a\") (\"b\" \"b\"))\n```\n\n但我们可以更进一步，像这样使用更紧凑的\
  \ `#()` 语法：\n\n```\nuser=> (list-maker-fun [\"a\" \"b\"] #(do %1))\n((\"a\" \"a\"\
  ) (\"b\" \"b\"))\n```\n\n这个例子有点不常，因为我们使用了在基础特殊形式表中遇到的 `(do)` 形式，但它是可以的。现在，让我们使用\
  \ `#()` 形式简化 `(list-maker-fun)` 自身：\n\n```\n(defn list-maker-fun [x f]\n   (map\
  \ #(list %1 (f %1)) x))\n```\n\nSchwartzian transform（施瓦茨变换）也是一个极佳的用例，可以展示如何在更复杂的示例中使用这种语法，如下一个代码样本所示。\n\
  \n### 列表 10.4 重写的 Schwartzian 变换\n\n```\n(defn schwartz [x key-fn]\n  (map #(nth\
  \ %1 0)               ❶\n    (sort-by #(nth %1 1)         ❶\n      (map #(let [w\
  \ %1]          ❶\n        (list w (key-fn w))\n      ) x))))\n```\n\n❶ 对应三个步骤的匿名函数字面量\n\
  \n使用 `%1` 作为函数字面量参数的占位符（后续参数使用 `%2`、`%3` 等）使得用法非常显著，并让代码变得易读很多。这种视觉线索对程序员来说非常有帮助，类似于\
  \ Java lambda 表达式中使用的箭头符号。\n\n正如你所看到的，Clojure 极度依赖函数作为计算的基本单位的概念，而不是像 Java 等语言那样依赖于对象。这种方法的自然环境是函数式编程，这正是我们下一个的话题。\n\
  \n## 10.3 函数式编程与闭包\n\n我们现在将转向 Clojure 中令人生畏的函数式编程世界。或者准确地说，我们*并没有*，因为其实并没有那么可怕。事实上，在整个章节中我们一直在进行函数式编程；我们只是没没告诉你，以免让你望而却步。\n\
  \n正如我们在 8.1.3 节中提到的，函数式编程是一个有些模糊的概念——它唯一可以依靠的意思就是函数是一个值。函数可以像 `2` 或 `\"hello.\"\
  ` 一样被到处传递、放在变量中并进行操作。但那又怎样？我们在第一个例子中就做过这一点：`(def hello (fn [] \"Hello world\"))`。我们创建了一个函数（一个不接受任何参数并返回\
  \ `\"Hello world\"` 的函数）。\n\n在列表 10.3 中，我们引入了 Schwartzian 变换作为一个接收另一个函数的示例。它唯有不同之处在于它接收的类型是函数。\n\
  \n现在可能是时候引入 `(filter)` 形式了，如下所示，它应该让你想起 Java 中同名的方法：\n\n```\nuser=> (defn gt4 [x]\
  \ (> x 4))\n#'user/gt4\nuser=> (filter gt4 [1 2 3 4 5 6])\n(5 6)\n```\n\n还有 `(reduce)`\
  \ 形式，以完成 filter-map-reduce 操作。它最常见有两种变体：一个接收初始值（有时称为“零”），另一个不接受：\n\n```\nuser=>\
  \ (reduce + 1 [2 3 4 5])\n15\nuser=> (reduce + [1 2 3 4 5])\n15\n```\n\n闭包呢？它们一定很可怕吧？其实不然。让我们来看一个简单的例子，希望它能让你想起第\
  \ 9 章为 Kotlin 所做的某些示例：\n\n```\nuser=> (defn adder [constToAdd] #(+ constToAdd %1))\n\
  #'user/adder\n\nuser=> (def plus2 (adder 2))\n#'user/plus2\n\nuser=> (plus2 3)\n\
  5\n\nuser=> 1:9 user=> (plus2 5)\n7\n```\n\n你首先设置了一个名为 `(adder)` 的函数。这是一个产生函数的函数。如果你熟悉\
  \ Java 中的工厂方法模式，可以将其理解为某种 Clojure 的等价物。返回其他函数的函数并没有什么奇怪——这是函数是普通值这一概念的核心部分。\n\n\
  注意这个例子使用了匿名函数字面量的简化形式 `#()`。`(adder)` 函数接收一个数字并返回一个函数。\n\n\n\n\n```\nuser=> (def\
  \ plus3 (adder 3))\n#'user/plus3\n\nuser=> (plus3 4)\n7\n\nuser=> (plus2 4)\n6\n\
  ```\n\n这表明你可以创建一个不同的函数 `(plus3)`，它在 `constToAdd` 上绑定了不同的值。我们称这些函数 `(plus3)` 和 `(plus2)`\
  \ 从它们的环境中“捕获”（captured）或“闭包了”（closed over）了一个值。请注意，`((plus3)` 和 `(plus2)` 捕获的值是不同的，并且定义\
  \ `(plus3)`不会影响 `(plus2)` 捕获的值。\n\n闭包了其环境中某些值的函数被称为 `closures`（闭包）；`(plus2)` 和 `(plus3)`\
  \ 就是闭包的示例。这种由创建函数的函数返回另一个更简单的、且闭包了某些内容的函数的模式，在支持闭包的语言中非常常见。\n\n**注意** 请记住，尽管 Clojure\
  \ 会编译任何语法上有效的形式，但如果调用函数时参数数量错误，程序将抛出运行时异常。两个参数的函数不能在期望单参数函数的地方使用。\n\n我们将在第 15 章结合上下文更多关于函数式编程的内容。现在，让我们转向一个强大的\
  \ Clojure 特性——序列（sequences）。\n\n## 10.4 介绍 Clojure 序列\n\nClojure 有一个强大的核心抽象称为 `sequence`，或者更常用的\
  \ `seq`。\n\n**注意** 序列是编写利用语言优势的 Clojure 代码的一部分，它们将与 Java 处理类似概念的方式形成有趣的对比。\n\n`seq`\
  \ 类型大致对应于 Java 中的集合（collections）和迭代器（iterators），但 `seqs` 具有不同的属性。基本思想是 `seqs` 本质上是将\
  \ Java 这两种类型的一些特性合并到了一个概念中。这样做是为了实现以下三点：\n\n* 不可变性（Immutability），允许 `seqs` 在不同的函数（以及线程）之间传递而不会产生问题\n\
  * 更健壮的类迭代器抽象，特别是对于多路算法（multipass algorithms）\n* 惰性序列（lazy sequences）的可能性（稍后会详细介绍）\n\
  \n在这三点中，Java 程序员有时最头疼的是不可变性。Java 的迭代器概念本质上是可变的，部分是因为它没有提供清晰分离的接口。事实上，Java 的 `Iterator`\
  \ 违反了单一职责原则，因为调用 `next()` 时执行了以下**两个**逻辑上不同的事情：\n\n* 它返回当前指向的元素。\n* 通过移动元素指针来改变迭代器的状态。\n\
  \n`seq` 基于函数式思想，通过以不同的方式划分 `hasNext()` 和 `next()` 的功能来避免变异。让我们来看看 Clojure 最重要的接口之一\
  \ `clojure.lang.ISeq` 的稍微简化版本：\n\n```\ninterface ISeq {\n    Object first();   \
  \   ❶\n    ISeq rest();         ❷\n}\n```\n\n❶ 返回 `seq` 中的第一个对象\n\n❷ 返回一个包含旧 `seq`\
  \ 所有元素（除第一个元素外）的新 `seq`\n\n现在，`seq` 永远永远被变异的。相反，每当我们调用 `rest()` 时，都会创建一个新的 `seq`\
  \ 值，而这正是我们本该移动迭代器到下一个值的地方。让我们看一些代码，展示如何在 Java 中实现它：\n\n```\npublic class ArraySeq\
  \ implements ISeq {\n    private final int index;                            ❶\n\
  \    private final Object[] values;                      ❶\n\n    private ArraySeq(int\
  \ index, Object[] values) {\n        this.index = index;\n        this.values =\
  \ values;\n    }\n\n    public static ArraySeq of(List<Object> objects) {   ❷\n\
  \        if (objects == null || objects.size() == 0) {\n            return Empty.of();\n\
  \        }\n        return new ArraySeq(0, objects.toArray());\n    }\n\n    @Override\n\
  \    public Object first() {\n        return values[index];\n    }\n\n    @Override\n\
  \    public ISeq rest() {\n        if (index >= values.length - 1) {\n         \
  \   return Empty.of();                          ❸\n        }\n        return new\
  \ ArraySeq(index + 1, values);\n    }\n\n    public int count() {\n        return\
  \ values.length - index;\n    }\n}\n```\n\n❶ 最终字段 (Final fields)\n\n❷ 接收 List 的工厂方法\n\
  \n❸ 需要一个空实现\n\n如你所见，我们需要为序列的结尾提供一个特殊的 `seq`。让我们将其表示为 `ArraySeq` 内部的一个类，如下：\n\n```\n\
  \ public static class Empty extends ArraySeq {\n        private static Empty EMPTY\
  \ = new Empty(-1, null);\n\n        private Empty(int index, Object[] values) {\n\
  \            super(index, values);\n        }\n\n        public static Empty of()\
  \ {\n            return EMPTY;\n        }\n\n        @Override\n        public Object\
  \ first() {\n            return null;\n        }\n\n        @Override\n        public\
  \ ISeq rest() {\n            return of();\n        }\n\n        public int count()\
  \ {\n            return 0;\n        }\n    }\n```\n\n让我们来看看它的运行情况：\n\n```\nISeq\
  \ seq = ArraySeq.of(List.of(10000,20000,30000));\nvar o1 = seq.first();\nvar o2\
  \ = seq.first();\nSystem.out.println(o1 == o2);\n```\n\n正如预期的，对 `first()` 的调用是**幂等的**（idempotent）——它们不会改变\
  \ `seq` 并会反复返回相同的值。让我们看看如何在 Java 中写循环：\n\n```java\nwhile (seq.first() != null) {\n\
  \    System.out.println(seq.first());\n    seq = seq.rest();\n}\n```\n\n**注意** 尽管\
  \ Clojure 会编译任何语法上有效的形式，但如果调用函数时参数数量错误，程序将抛出运行时异常。两个参数的函数不能在期望单参数函数的地方使用。\n\n下面展示了一些与序列相关的核心函数。所有序列所实现的真实\
  \ `ISeq` 接口比我们目前看到的过的要复杂一点，但基本意图是相同的。\n\n表 10.4 基础序列函数\n\n| 函数 | 效果 |\n| --- | ---\
  \ |\n| `(seq <coll>)` | 返回一个作为集合“视图”的 `seq` |\n| `(first <coll>)` | 返回集合的第一个元素，必要时对其调用\
  \ `(seq)`；如果集合为 nil，则返回 nil |\n| `(rest <coll>)` | 返回一个由集合制成的新 seq，去除了第一个元素 |\n\
  | `(seq? <o>)` | 如果 `o` 是一个 seq 则返回 true（意味着它实现了 `ISeq`） |\n| `(cons <elt> <coll>)`\
  \ | 返回一个由集合制成的 seq，并在前面添加额外的元素 |\n| `(conj <coll> <elt>)` | 返回一个新集合，并将新元素添加到适当的末尾——对于向量是末尾，对于列表是头部\
  \ |\n| `(every? <pred-fn> <coll>)` | 如果 `(pred-fn)` 对集合中的每项项都返回逻辑上的真，则返回 true |\n\
  \nClojure 与其他 Lisp 不同之处在于 `(cons)` 要求第二个参数必须是集合（实际上是 `ISeq`）。通常情况下，很多 Clojure 程序员倾向于使用\
  \ `(conj)` 而不是 `(cons)`。以下是几个示例：\n\n```\nuser=> (rest '(1 2 3))\n(2 3)\n\nuser=>\
  \ (first '(1 2 3))\n1\n\nuser=> (rest [1 2 3])\n(2 3)\n\nuser=> (seq ())\nnil\n\n\
  user=> (seq [])\nnil\n\nuser=> (cons 1 [2 3])\n(1 2 3)\n\nuser=> (every? is-prime\
  \ [2 3 5 7 11])\ntrue\n```\n\n\n\n\n\n需要注意的一点是，Clojure 的列表（lists）它们自己的序列（seqs），但向量（vectors）不是。在理论上，你不应该能够对向量调用\
  \ `(rest)`。你之所以能够这样做是因为 `(rest)` 在对向量进行操作之前，会先对其调用 `(seq)`。\n\n注意：许多序列函数接受的类型比 seq\
  \ 更具通用性，并且它们在开始执行之前会对这些对象调用 `(seq)`。\n\n在下一节中，我们将探索 `seq` 抽象的一些基本属性和用法，并特别关注变长参数函数（variadic\
  \ functions）。稍后在第 15 章，我们将遇到惰性序列（lazy sequences）——一种非常重要的函数式技术。\n\n### 10.4.1 序列与变长参数函数\n\
  \n我们直到现在才延迟讨论 Clojure 函数处理方法中一个强大的特性。这就是能够轻松让函数接收任意数量参数的自然能力，有时被称为函数的“元数”（arity）。接受任意数量参数的函数被称为“变长参数函数”（variadic），它们在处理序列时经常被频繁使用。\n\
  \n注意：Java 支持变长方法，其语法在方法的最后一个参数上通过类型后面显示 `...`，表示在参数列表末尾允许任意数量的该类型的参数。\n\n举一个简单的例子，考虑我们在代码列表\
  \ 10.1 中讨论的常量函数 `(const-fun1)`。该函数接受一个单一参数并丢弃它，始终返回值 1。但考虑一下当你这样给 `(const-fun1)`\
  \ 传递多个一个参数时会发生什么：\n\n```\nuser=> (const-fun1 2 3)\njava.lang.IllegalArgumentException:\n\
  \  Wrong number of args (2) passed to: user$const-fun1 (repl-1:32)\n```\n\nClojure\
  \ 编译器无法对传递给 `(const-fun1)` 的参数数量（以及类型）强制执行编译静态检查，相反，我们必须承担运行时异常的风险。\n\n这似乎过于限制了，特别是对于一个简单丢弃所有参数并返回常值的函数来说。一个可以接受任意数量参数的函数在\
  \ Clojure 中看起来是什么样呢？\n\n下面的列表显示了如何对本章前面的 `(const-fun1)` 常量函数实现这一点。我们将其命名为 `(const-fun-arity1)`，表示具有变长*元数*的*常量函数\
  \ 1*。\n\n注意：这实际上是 Clojure 标准函数库提供的 `(constantly)` 函数的一个自定义版本。\n\n#### 列表 10.5 变长元数函数\n\
  \n```\nuser=> (defn const-fun-arity1\n  ([] 1)                        ❶\n  ([x]\
  \ 1)                       ❶\n  ([x & more] 1)                ❶\n)\n#'user/const-fun-arity1\n\
  \nuser=> (const-fun-arity1)\n1\n\nuser=> (const-fun-arity1 2)\n1\n\nuser=> (const-fun-arity1\
  \ 2 3 4)\n1\n```\n\n❶ 具有不同签名的多个函数定义\n\n关键在于，函数定义后面跟的不是一个函数参数向量然后是一个定义函数行为的表达式。相反，是一个元对的列表，每个元对由一个参数向量（实际上是该版本函数的签名）和该版本的实现组成。\n\
  \n这可以被认为类似于 Java 中方法重载（method overloading）的概念。或者，它也可以被视为与模式匹配（我们在第 3 章中遇到过）有关。然而，因为\
  \ Clojure 是一种动态类型语言，没有等同的类型模式，因此这种联系并没有想象中那么强。\n\n通常的惯例是定义几个特殊情况的形式（接受零、一个或两个参数）以及一个额外的、以\
  \ seq 作为最后一个参数的形式。在列表 10.5 中，这种形式就是具有参数向量 `[x & more]` 的形式。`&` 符号表示这是函数的变长版本。\n\n\
  序列是 Clojure 的一项强大创新。事实上，学习用 Clojure 方式思考的很大一部分是开始思考如何利用 `seq` 抽象来解决你特定的编码问题。Clojure\
  \ 的另一个重要创新是 Clojure 与 Java 之间的集成，这是下一节的主题。\n\n## 10.5 Clojure 与 Java 的互操作\n\nClojure\
  \ 的设计从底层开始就是为了成为一种 JVM 语言，并且并不试图完全向程序员隐藏 JVM 的特性。这些特定的设计选择在许多地方都是显而易见的。例如，在类型系统层面，Clojure\
  \ 的列表和向量都实现了 `List`——这是 Java 集合库的标准接口。此外，在 Clojure 中使用 Java 库反之亦然也非常容易。这些属性非常有用，因为\
  \ Clojure 程序员可以利用丰富的 Java 库和工具链，以及 JVM 的性能和其他特性。\n\n在这一节中，我们将涵盖这一互操作性决策的多个方面，具体来说：\n\
  \n*   从 Clojure 调用 Java\n*   Java 如何看待 Clojure 函数的类型\n*   Clojure 代理（proxies）\n\
  *   使用 REPL 进行探索编程\n*   从 Java 调用 Clojure\n\n让我们通过查看如何从 Clojure 访问 Java 方法开始探索这种集成。\n\
  \n### 10.5.1 从 Clojure 调用 Java\n\n考虑这段在 REPL 中求求的 Clojure 代码：\n\n```\nuser=> (defn\
  \ lenStr [y] (.length (toString y)))\n#'user/lenStr\n\nuser=> (sort-by lenStr [\"\
  bab\" \"dgfw\" \"droopy\"])\n(\"aa\" \"bab\" \"dgfw\")\n```\n\n在这一段代码中，我们使用了 Schwartzian\
  \ 变换（Schwartzian transform）根据长度对字符串向量进行排序。为了这一点，我们使用了 `(.toString)` 和 `(.length)`，它们是\
  \ Java 方法。符号开头的点意味着应该在后续参数上调用该方法。这是通过我们尚未遇到的另一个宏 `(.)` 实现的。\n\n回想所有通过 `(def)` 或其变体定义的\
  \ Clojure 值都被放置在 `clojure.lang.Var` 实例中，因此任何可以在 `java.lang.Object` 上调用的方法可以在 Clojure\
  \ 值上调用。与 Java 交互的其他形式包括：\n\n```\n(System/getProperty \"java.version\")\n\"17\"\n\
  ```\n\n用于调用静态方法（在本例中为 `System.getProperty()` 方法），以及\n\n```\nBoolean/TRUE\n```\n\n\
  用于访问静态变量（例如常量）。\n\n熟悉的“Hello World”示例所示：\n\n```\nuser=> (.println System/out \"\
  Hello World\")\nHello World\nnil\n```\n\n注意，最后的 `nil` 是因为当然，所有的 Clojure 形式必须返回一个值，即使它们调用的是\
  \ `void` Java Java 方法。\n\n在这三个例子中，我们隐式地使用了 Clojure 的命名空间（namespaces）概念，这类似于 Java\
  \ 的包（packages），并且为常见情况提供了简写形式到 Java 包名的映射，如前面的例子。\n\n### 10.5.2 Clojure 调用的本质\n\n\
  Clojure 中的函数调用被编译为 JVM 方法调用。JVM 并不保证优化尾递归，而 Lisp（特别是 Scheme 实现）通常会这样做。JVM 上的其他 Lisp\
  \ 方言认为他们想要真正的尾递归，因此准备让 Lisp 函数调用在任何情况下都不完全等同于 JVM 方法调用。然而，Clojure 完全拥抱 JVM 平台，即使以牺牲完全符合\
  \ Lisp 习惯为代价。\n\n如果你想创建一个 Java 对象的新实例并在 Clojure 中操作它，你可以通过 `(new)` 形式轻松实现。它有另一种快捷形式，即类名后面加上句点，这归结为\
  \ `(.)` 宏的另一种用法，如下：\n\n```\n(import '(java.util.concurrent CountDownLatch LinkedBlockingQueue))\n\
  \n(def cdl (new CountDownLatch 2))\n\n(def lbq (LinkedBlockingQueue.))\n```\n\n\
  在这里我们还使用了 `(import)` 形式，它允许在一行内从单个包导入多个 Java 类。\n\n\n\n\n我们之前提到过，Clojure 的类型系统与\
  \ Java 的类型系统之间存在某种程度的对齐。让我们更详细地查看这个概念。\n\n### 10.5.3 Clojure 值的 Java 类型\n\n在 REPL\
  \ 中，可以很容易通过以下方式查看某些 Clojure 值的 Java 类型：\n\n```\nuser=> (.getClass \"foo\")\njava.lang.String\n\
  \nuser=> (.getClass 2.3)\njava.lang.Double\n\nuser=> (.getClass [1 2 3])\nclojure.lang.PersistentVector\n\
  \nuser=> (.getClass '(1 2 3))\nclojure.lang.PersistentList\n\nuser=> (.getClass\
  \ (fn [] \"Hello world!\"))\nuser$eval110$fn__111\n```\n\n首先注意到的是，所有的 Clojure 值都是对象；JVM\
  \ 的原始类型默认是不暴露的（尽管有方法可以为关注性能的开发者获取原始类型）。正如你预期的，字符串和数值值直接映射到对应的 Java 引用类型（`java.lang.String`、`java.lang.Double`\
  \ 等）。\n\n匿名函数“Hello world!”有一个名称，表明它是动态生成类的一个实例。该类将实现 `IFn` 接口，这是 Clojure 用来指示一个值是函数的重要接口。\n\
  \n正如我们之前讨论过的，序列（seqs）实现了 `ISeq` 接口。它们通常是抽象类 `ASeq` 的具体子类之一，或者是延迟实现 `LazySeq`（我们在第\
  \ 15 章讨论高级函数编程时会遇到懒性加载）。\n\n我们查看了各种值的类型，但这些值的存储方式怎样的呢？正如在本章开头提到的，`(def)` 将符号绑定到一个值，并在此过程中创建一个变量（var）。这些变量是\
  \ `clojure.lang.Var` 类型的对象（它实现了 `IFn` 等其他接口）。\n\n### 10.5.4 使用 Clojure 代理（proxies）\n\
  \nClojure 有一个名为 `(proxy)` 的强大宏，它允许你创建一个扩展 Java 类（或实现接口）的真正的 Clojure 对象。例如，接下来的列表回顾了早之前的一个示例（使用了第\
  \ 6 章中的 `ScheduledThreadPoolExecutor`），但由于 Clojure 更紧凑的语法，执行示例的核心现在只需一部分代码就完成了。\n\
  \n列表 10.6 回顾调度执行器\n\n```\n(import '(java.util.concurrent Executors LinkedBlockingQueue\
  \ TimeUnit))\n\n(def stpe (Executors/newScheduledThreadPool 2))            ❶\n\n\
  (def lbq (LinkedBlockingQueue.))\n\n(def msgRdr (proxy [Runnable] []           \
  \                ❷\n  (run [] (.println System/out (.toString (.poll lbq))))\n))\n\
  \n(def rdrHndl\n  (.scheduleAtFixedRate stpe msgRdr 10 10 TimeUnit/MILLISECONDS))\n\
  ```\n\n❶ 创建执行器的工厂方法\n\n❷ 定义了 Runnable 的匿名实现\n\n`(proxy)` 的通用形式如下：\n\n```\n(proxy\
  \ [<superclass/interfaces>] [<args>] <impls of named functions>+)\n```\n\n第一个向量参数持有该代理类应该实现的接口。如果代理还应该扩展一个\
  \ Java 类（当然，它只能扩展一个 Java 类），那么该类名必须是向量的第一个元素。\n\n第二个向量参数组了要传递给父类构造函数的参数。这通常是一个空向量，并且在所有\
  \ `(proxy)` 形式仅实现 Java 接口的情况下，它一定将是空的。\n\n在这两个参数之后，是表示各个方法实现的形式，如指定的接口或父类所要求的。在我们的示例中，代理只需要实现\
  \ `Runnable`，因此它是第一个参数向量中的唯一符号。不需要父类参数，所以第二个向量是空的（正如它通常是的那样）。\n\n在两个向量之后，是一个定义代理将实现的方法的形式列表。在我们的案例中，那只是\
  \ `run()`，我们给它提供了定义 `(run [] (.println System/out (.toString (.poll lbq))))`。当然，这只是\
  \ Clojure 编写这部分 Java 代码的方式：\n\n```\npublic void run() {\n    System.out.println(lbq.poll().toString());\n\
  }\n```\n\n`(proxy)` 形式允许对任何 Java 接口进行简单实现。这导致了一个有趣的可能性——即将 Clojure REPL 作为一个扩展的实验场，用来尝试\
  \ Java 和 JVM 代码。\n\n### 10.5.5 使用 REPL 进行探索性编程\n\n探索性编程的核心概念是，由于 Clojure 语法使得编写的代码更少，加上\
  \ REPL 提供的实时交互环境，REPL 不仅可以是探索 Clojure 编程的极佳环境，也是学习 Java 库的良好环境。\n\n让我们考虑 Java 的列表实现。它们有一个\
  \ `iterator()` 方法，返回一个类型为 `Iterator` 的对象。但 `Iterator` 是接口，所以你可能对真正的实现类型好奇。使用 REPL，可以像这样很容易发现：\n\
  \n```\nuser=> (import '(java.util ArrayList LinkedList))\njava.util.LinkedList\n\
  \nuser=> (.getClass (.iterator (ArrayList.)))\njava.util.ArrayList$Itr\n\nuser=>\
  \ (.getClass (.iterator (LinkedList.)))\njava.util.LinkedList$ListItr\n```\n\n`iterator()`\
  \ 方法返回一个类型为 `Iterator` 的对象。但 `Iterator` 是接口，所以你可能对真正的实现类型好奇。使用 REPL，可以像这样很容易发现……（此处省略重复的说明性文本，已按指令要求处理）\n\
  \n\n\n\n在第 8 章中，我们讨论了 `Java` 语言语法的僵硬性。相比之下，`Cloj` 提供并积极鼓励使用宏（macros）作为提供更灵活方法的机制，允许程序员编写更多或较少“普通”的程序代码，其行为与内置语言语法相同。\n\
  \n注意：许多语言都拥有宏（包括 `C++`），它们的工作方式大多相似——通过提供源代码编译的一个特殊阶段（通常是最开始的阶段）。\n\n例如，在 `C` 语言中，第一步是\
  \ `preprocessing`（预处理），它会移除注释、内联包含的文件并展开宏，宏即不同类型的 `preprocessor directives`（预处理器指令），例如\
  \ `#include` 和 `#define`。\n\n然而，尽管 `C` 宏非常强大，但它们也让工程师产生一些非常微妙且令人混乱的代码，难以理解和调试。为了避免这种复杂性，`Java`\
  \ 语言从没有实现过宏系统或预处理器。\n\n`C` 宏的工作原理是在预处理阶段提供非常简单的文本替换功能。Clojure 宏则更安全，因为它们运行在 Clojure\
  \ 自身的语法内。实际上，它们允许程序员创建一种特殊的函数，该函数在编译时以（特殊方式）进行求值。宏可以在编译过程中所谓的 `macro expansion time`（宏展开时间）转换源代码。\n\
  \n注意：宏的力量之关键在于，Clojure 代码被写成了一个有效的 Clojure 数据结构——具体来说，是一个形式（forms）的列表（list）。\n\n\
  我们说 Clojure 与其他 Lisp（以及少数其他语言）一样是 `homoiconic`（同质的），这意味着程序的表示方式与数据相同。其他编程语言（如 `Java`）将它们的源代码写为字符串，在没有\
  \ `Java` 编译器解析该字符串的情况下，无法确定程序的结构。\n\n回想一下，Clojure 在遇到源代码时会对其进行编译。许多 Lisp 是解释型语言，但\
  \ Clojure 不是。相反，当 Clojure 源代码加载时，它会被动态编译成 `JVM bytecode`（JVM 字节码）。这可能会给人表面印象，认为\
  \ Clojure 是解释性的，但一个（非常简单的）Clojure 编译器就隐藏在表面之下。\n\n注意：一个 Clojure 形式（form）是一个列表，而宏本质上是一个不求值其参数的函数，而是通过操作参数来返回另一个列表，该列表随后将被编译为\
  \ Clojure 形式。\n\n为了演示这一点，让我们尝试写一个像 `(if)` 反向操作的宏形式。在某些语言中，这会用 `unless` 关键字表示，因此在\
  \ Clojure 中它将是一个 `(unless)` 形式。我们想要一个看起来像 `(if)` 但行为在逻辑上相反的形式，如下：\n\n```\nuser=>\
  \ (def test-me false)\n#'user/test-me\n\nuser=> (unless test-me \"yes\")\n\"yes\"\
  \n\nuser=> (def test-me true)\n#'user/test-me\n\nuser=> (unless test-me \"yes\"\
  )\nnil\n```\n\n注意，我们没有提供等价的 `else` 条件。这在某种程度上简化了示例，而且 “unless ... else” 听起来也很奇怪。在我们的示例中，如果\
  \ `unless` 逻辑测试失败，该形式将求值为 `nil`。\n\n如果我们尝试使用 `(defn)` 来编写它，可以写出如下的简单的第一次尝试（剧透：它实际上并无法正常工作）：\n\
  \n```\nuser=> (defn unless [p t]\n  (if (not p) t))\n#'user/unless\n\nuser=> (def\
  \ test-me false)\n#'user/test-me\n\nuser=> (unless test-me \"yes\")\n\"yes\"\n\n\
  user=> (def test-me true)\n#'user/test-me\n\nuser=> (unless test-me \"yes\")\nnil\n\
  ```\n\n这看起来没问题。然而，考虑到我们希望 `(unless)` 的工作方式与 `(if)` 相同——特别是 `then` 形式应该在布尔谓词条件为真时才进行求值。换句话说，对于\
  \ `(if)`，我们看到了这种行为：\n\n```\nuser=> (def test-me true)\n#'user/test-me\n\nuser=>\
  \ (if test-me (do (println \"Test passed\") true))\nTest passed\ntrue\n\nuser=>\
  \ (def test-me false)\n#'user/test-me\n\nuser=> (if test-me (do (println \"Test\
  \ passed\") true))\nnil\n```\n\n当我们尝试以相同的方式使用我们的 `(unless)` 函数时，问题变得显而易见了，如下所示：\n\
  \n```\nuser=> (def test-me false)\n#'user/test-me\n\nuser=> (unless test-me (do\
  \ (println \"Test passed\") true))\nTest passed\ntrue\n\nuser=> (def test-me true)\n\
  #'user/test-me\n\nuser=> (unless test-me (do (println \"Test passed\") true))\n\
  Test passed\nnil\n```\n\n无论谓词是真是假，`then` 形式仍然被求值，由于在我们的示例中它是 `(println)`，它产生了输出，这为我们提供了知道求值正在发生的线索。要解决这个问题，我们需要在*不对传递的形式求值*的情况下处理这些形式。这本质上是（略有不同的）一种惰性（laziness）概念，该概念在函数式编程中非常重要（我们将在第\
  \ 15 章详细描述它）。特殊形式 `(defmacro)` 用于声明一个新宏，如下：\n\n```\n(defmacro unless [p t]\n  (list\
  \ 'if (list 'not p) t))\n```\n\n让我们看看它是否能正确工作：\n\n```\nuser=> (def test-me true)\n\
  #'user/test-me\n\nuser=> (unless test-me (do (println \"Test passed\") true))\n\
  nil\n\nuser=> (def test-me false)\n#'user/test-me\n\nuser=> (unless test-me (do\
  \ (println \"Test passed\") true))\nTest passed\ntrue\n```\n\n现在它的行为符合我们的预期了：`(unless)`\
  \ 形式现在看起来像内置的 `(if)` 特殊形式。正如你所见，编写宏的一个缺点是涉及大量的引用（quoting）。我们可以做得更好吗？\n\n```\n(defmacro\
  \ unless [p t]\n  `(if (not ~p) ~t))\n```\n\n这种形式现在清晰得多，并且更接近宏展开时看到的形式。`~` 字符提供了一个很好的视觉线索，让我们知道这些符号在宏展开时会被替换。这与宏作为编译时代码模板的思想契合。\n\
  \n除了 `syntax-quote`（语法引号）和 `-unquote`（反引号）之外，宏定义中还会使用一些重要的特殊变量。其中，最常用的两个如下：\n\n\
  -   `&form`——被调用的表达式\n-   `&env`——宏展开处的局部绑定映射\n\n\n\n\n从每个特殊变量可以获取的完整详细信息可以在 Clojure\
  \ 文档中找到。\n\n我们还应该注意，在编写 Clojure 宏时需要小心。例如，可能会创建出产生递归展开的宏，这些展开不会终止而是会“发散”（diverge），如下例所示：\n\
  \n```\n(defmacro diverge [t]\n  `((diverge ~t) (diverge ~t)))\n#'user/diverge\n\n\
  user=> (diverge true)\nSyntax error (StackOverflowError) compiling at (REPL:1:1).\n\
  null\n```\n\n作为最后一个例子，让我们通过构建一个宏来确认宏确实在编译时运行。这个宏本质上充当了连接编译和运行时的闭包，如下：\n\n```\nuser=>\
  \ (defmacro print-msg-with-compile []\n  (let [num (System/currentTimeMillis)]\n\
  \    `(fn [t#] (println t# \" \" ~num))))\n#'user/print-msg-with-compile\n\nuser=>\
  \ (def p1 (print-msg-with-compile))\n#'user/p1\n\nuser=> (p1 \"aaa\")\naaa   1603437421852\n\
  nil\n\nuser=> (p1 \"bbb\")\nbbb   1603437421852\nnil\n```\n\n注意 `(let)` 形式是在编译时求值的，因此\
  \ `(System/currentTimeMillis)` 的值在宏被求值时被捕获，绑定到符号 `num`，然后在展开的形式中被替换为绑定的值——这实际上是一个在编译时确定的常量。\n\
  \n尽管我们在本章的最末尾引入了宏，但宏在 Clojure 中实际上无处不在。事实上，Clojure 标准库的大部分都是作为宏实现的。基础扎实的开发者可以通过花时间阅读标准库的源码，并观察其关键部分是如何编写的，从中中学到很多东西。\n\
  \n此时，给出一个警告也恰当：宏是一项强大的技术，存在一种诱惑（就像其他能够“提升”程序员思维的技术一样），一些开发者可能会掉入这种陷阱——即在并不严格需要时也倾向于过度使用该技术的倾向。\n\
  \n为了防止这种情况，我们强烈建议你在使用 Clojure 宏时记住以下简单的通用规则：\n\n*   当目标可以通过函数完成时，永远不要编写宏。\n*   编写宏是为了实现语言或标准库中尚未具备的功能、能力或模式。\n\
  \n第一条当然只是老格言的另一种变体：“仅仅因为你*可以*做某事，并不意味着你*应该*做某事”。\n\n第二条则是提醒我们，宏的存在是有原因的：有些事情你可以用宏完成，但实际上无法通过任何其他方式完成。一个精通的\
  \ Clojure 程序员能够在恰当的地方发挥宏的巨大威力。\n\n除了宏，关于 Clojure 还有更多需要学习，例如该语言处理动态运行时行为的方法。在 Java\
  \ 中，这通常使用类和接口继承以及虚分发来处理，但这些从根本上说都是面向对象的概念，并不特别适合 Clojure。\n\n相反，Clojure 使用 `protocols`\
  \ 和 `datatypes`——以及我们已经过的代理（proxies）——来提供这种灵活性。还有更多的可能性，例如使用 `multimethods` 的自定义分发方案。这些也是非常强大的技术，但遗憾的是，它们稍微超出了本书对\
  \ Clojure 的介绍性范围。\n\n作为一种语言，Clojure 可能是我们看过的语言中与 Java 最不同的。它的 Lisp 遗传、对不可变性的强调以及不同的方法似乎使其变成了一门完全不同的语言。但它与\
  \ JVM 的紧密集成、类型系统的对齐（即使它提供了替代方案，如 `seqs`）以及探索性编程的力量，使其成为 Java 的一种非常互补的语言。\n\n我们在这一部分学习的语言之间的差异清楚地展示了\
  \ Java 平台演进的能力以及继续作为应用开发可行目的地的实力。这也是 JVM 灵活性和能力的证明。\n\n## 总结\n\n*   Clojure 是动态类型语言，Java\
  \ 程序员需要注意运行时异常。\n*   探索性以及基于 REPL 的开发与 Java IDE 的感觉截然不同。\n*   Clojure 提供并促进了一种非常不可变的编程风格。\n\
  *   函数式编程贯穿 Clojure 之中——远超 Java 或 Kotlin。\n*   `Seqs` 是 Java 迭代器和集合的函数等价物。\n*  \
  \ 宏定义了 Clojure 源码的编译时转换。\n\n# 第 4 部分 构建与部署\n\n书的这部分完全关于如何有效地利用工具来构建、测试和部署我们的 Java\
  \ 应用程序。尽管构建工具在 Java 出现很久以前存在了，但该领域仍在进步。在第 11 章中，你将查看两个流行的 Java 构建工具——`Maven` 和 `Gradle`，并学习它们的异同。除了基本命令，你将看到它们如何对世界建模，以及这些模型在何处允许良好的开发者进行扩展和自定义。\n\
  \n在过去的几年里，容器化席卷了行业。从作为某种小众的 Linux 原语开始，`Docker` 和 `Kubernetes` 将这些技术推向了主流。你将查看 Java\
  \ 应用程序环境与容器规范集成的细节，哪些需要改变，哪些又保持不变。\n\n在部署应用程序之前，你需要对它们进行测试。测试的精确含义差异很大，取决于你和项目需求。一个基础扎实的开发者知道并非一刀切的，因此我们将应对多种测试方法及其优缺点，并为更精确的测试建立词汇。你还将看到\
  \ `JUnit` 最新版本的重大变化，并运用你一直以来来学到的许多 `JDK` 特性。\n\n（注：此处提供的原始文本似乎包含了第 11 章的开头，已根据要求完整翻译。以下是待翻译的后续部分）\n\
  \n# 11 使用 Gradle 和 Maven 构建\n\n本章涵盖\n\n*   为什么构建工具对基础良好的开发者很重要\n*   `Maven`\n* \
  \  `Gradle`\n\n`JDK` 自带编译器来将 Java 源码编译为类文件，正如我们在第 4 章看到的那样。尽管如此，很少有任何规模的项目仅依赖 `javac`。让我们先看看为什么基础扎实的开发者应该投入精力熟悉这一层工具。\n\
  \n\n\n\n\n```text\n.\n└── src\n    ├── main                                    \
  \   ❶\n    │      └── java                                  ❷\n    │           \
  \    └── com                              ❸\n    │                       └── wellgrounded\n\
  \    │                               └── Main.java\n    └── test\n        └── java\n\
  \            └── com\n                └── wellgrounded\n                    └──\
  \ MainTest.java\n```\n\n❶ `main` 和 `test` 将我们的生产代码与测试代码分开。\n\n❷ 这种结构使得多种语言可以轻松地在一个项目中共存。\n\
  \n❸ 目录结构通常会镜像你的包层级结构。\n\n如你所见，测试已经深度融入到我们的代码布局中了。自从人们过去还在纠结是否真的需要为代码编写测试以来，Java\
  \ 已经取得了巨大的进步。构建工具是确保任何地方都能以一致方式进行测试的关键部分。\n\n**注意**：你可能已经知道如何使用 `JUnit` 或库在 Java\
  \ 中进行单元测试。我们将在第 14 章讨论其他形式的测试。\n\n虽然编译成类文件是 Java 程序存在的起点，但通常情况下，这并不是终点。幸运的是，构建工具还支持将你的类文件打包成\
  \ `JAR` 或格式，以便于发布。\n\n### 11.1.2 管理依赖\n\n在 Java 早期，如果你想使用一个库，必须在某处找到它的 `JAR`，下载该文件并将其放入应用程序的\
  \ `classpath` 中。这导致了几个问题——特别是缺乏一个针对所有库的中央权威来源，意味着有时需要进行“寻宝”才能找到不常用依赖的 `JAR`。\n\n\
  这显然并不理想，因此 `Maven`（以及其他项目）为 Java 生态系统提供了仓库，工具可以在其中查找并为我们安装依赖。直到今天，`Maven Central`\
  \ 仍然是互联网上常用的 Java 依赖注册表之一。公共公共注册，如托管在 `Google` 或在 `GitHub` 上共享的，以及通过 `Artifactory`\
  \ 等产品进行的私有安装。\n\n下载所有代码可能非常耗时，因此构建工具标准化了几种方法，通过在项目之间共享组件来减轻痛苦。通过本地仓库进行缓存，如果第二个项目需要相同的库，就不需要再次下载，如图\
  \ 11.1 所示。当然，这种方法也节省了磁盘空间，但组件的单一来源才是真正的胜利。\n\n![](img/CH11_F01_Evans2.png)\n\n图\
  \ 11.1 `Maven` 的本地仓库不仅有助于在线查找依赖，还能在本地高效管理它们。\n\n**注意**：你可能在想模块在这个依赖图中处于什么位置。正如我们在第\
  \ 2 章看到的，模块化库是以带有 `module-info.class` 文件的 `JAR` 文件形式分发的。模块化的 `JAR` 可以从标准仓库下载。真正的差异出现在你开始使用模块进行编译和运行时，而不是打包和发布阶段。\n\
  \n然而，注册表不仅提供了一个查找和下载依赖的中心位置，还更好地管理*传递性依赖*开启了大门。在 Java 中，我们经常看到这种情况：我们项目使用的某个库本身依赖于*另一个*库。我们实际上在第\
  \ 2 章就已经遇到过模块的传递性依赖，但这个问题在 Java 模块出现很久以前存在了。事实上，在模块之前，问题要严重得多。\n\n记得 `JAR` 文件只是压缩文件——它们没有任何描述\
  \ `JAR` 依赖关系的元数据。这意味着一个 `JAR` 的依赖只是该 `JAR` 中所有类的所有依赖的并集。\n\n更糟糕的是，类文件格式没有描述哪个版本的类来满足依赖关系——我们拥有的只是类在链接时所需的类或方法名称的符号描述符（正如我们在第\
  \ 4 章中看到的）。这意味着以下两点：\n\n1. 需要一个外部的依赖信息源。\n2. 随着项目的变大，传递性依赖图将变得越来越复杂。\n\n随着支持开发者的开源库和框架爆炸式，真实项目中典型的传递性依赖树变得越来越大。\n\
  \n一个潜在的好消息是，`JVM` 生态系统的情况比例如 JavaScript 的要好一些。JavaScript 缺乏一个保证始终存在的、丰富的中央运行时库，因此许多基本功能必须作为外部依赖来管理。这引入了诸许多问题，例如多个不兼容的库各自提供公共功能的某个版本，以及脆弱的生态系统，其中错误和恶意攻击可能对公共资源产生不成比例的影响（例如\
  \ 2016 年的“left-pad”事件 [参见 [`mng.bz/5Q64`](http://mng.bz/5Q64)]）。\n\n另一方面，Java 有一个运行时库（`JRE`），其中包含许多需要的类，并且在每个\
  \ Java 环境中都是可用的。然而，真正的生产应用程序将需要 `JRE` 之外的能力，并且几乎总会有太多的依赖层无法舒适地手动管理。唯一的解决方案是自动化。\n\
  \n### 冲突的出现\n\n这种自动化对于在丰富的开源代码生态系统构建构建的开发者来说是一个福音，但升级依赖往往也会暴露问题。例如，图 11.2 显示了一个可能会让我们陷入麻烦的依赖树。\n\
  \n![](img/CH11_F02_Evans2.png)\n\n图 11.2 冲突的传递依赖\n\n我们显式请求 `lib-a` 的 2.0 版本，但我们的依赖\
  \ `lib-b` 请求了较旧的 1.0 版本。这被称为*依赖冲突*，取决于如何解决它，可能会导致各种其他问题。\n\n库版本不匹配会导致什么种类型的损坏？这取决于版本之间变化的性质。变化分为几类，如下所示：\n\
  \n1. 稳定的 API：版本之间仅行为发生了变化。\n2. 新增的 API：版本之间出现了新的类或方法。\n3. 更改的 API：版本之间方法签名或接口发生了扩展。\n\
  4. 移除的 API：版本之间删除了类或方法。\n\n在 a) 或 b) 的情况下，你可能甚至不会注意到你的构建工具选择了哪个版本的依赖。c) 最常见的情况是库版本之间方法签名的更改。在我们之前的的示例中，如果\
  \ `lib-a` 2.0 更改了 `lib-b` 依赖的方法签名，当 `lib-b` 尝试调用该方法时，它将收到 `NoSuchMethodError` 异常。\n\
  \nd) 情况中的移除方法会导致相同类型的 `NoSuchMethodError`。这包括“重命名”方法，在字节码层面，这与删除一个方法并添加一个恰好具有相同实现的方法没有区别。\n\
  \n类也容易受到 d) 的影响（删除或重命名），会导致 `NoClassDefFoundError`。此外，从类中移除接口可能会导致你遇到糟糕的 `ClassCastException`。\n\
  \n这个关于传递依赖冲突问题的列表并非详尽的。这一切都归结为同一包的两个版本之间实际上发生了什么。\n\n事实上，关于版本之间变化性质的通信是跨语言的共同问题。处理该问题最广泛的方法之一是*语义化版本*（参见\
  \ [`semver.org/`](https://semver.org/)）。语义化版本为我们陈述传递依赖的需求提供了词汇，反过来让机器能够帮助我们解决这些问题。\n\
  \n在使用语义化版本时，请记住以下几点：\n\n\n\n\n\n- `MAJOR` 版本号增加（1.x -> 2.x），表示 API 发生了破坏性变更，如上述情况\
  \ c) 和 d) 所示。\n- `MINOR` 版本号增加（1.1 -> 1.2），表示向后兼容的特性，如情况 b) 所示。\n- `PATCH` 增加表示修复\
  \ Bug（1.1.0 -> 1.1.1）。\n\n尽管这并非万无一失，但它至少对版本更新带来的变更程度提供了一个预期，并在开源社区被广泛使用。\n\n既然你已经体会到了依赖管理并不简单，请放心，`Maven`\
  \ 和 `Gradle` 都提供了相应的工具来帮助。在章的稍后部分，我们将详细查看每个工具在您遇到依赖冲突时提供了哪些功能来解决问题。\n\n### 11.1.3\
  \ 确保开发者之间的一性\n\n随着项目代码量和参与开发者的增加，它们通常会变得更加复杂且难以维护。不过，你的构建工具可以减轻这种痛苦。内置功能（如确保每个人都在编译并运行相同的测试）是一个开始。但我们还应该考虑基础功能之外的许多扩展。\n\
  \n测试是好的，但你有多大把握你的*所有*代码都经过了测试？代码覆盖率工具是检测哪些代码被测试命中、哪些没有命中的关键。尽管互联网上关于代码覆盖率的正确目标存在争议，但覆盖率工具提供的行级输出可以防止你遗漏某一个额外特殊的条件分支测试。\n\
  \nJava 作为一种语言，也非常适合各种静态分析工具。从检测常见模式（例如重写了 `equals` 但没有重写 `hashCode`）到嗅出未使用的变量，静态分析允许计算机验证代码中那些虽然合法但在生产环境中会产生问题的部分。\n\
  \n然而，在正确性之外，还有样式和格式工具。你是否曾为了语句中大括号应该放在哪里与人争论过？如何对代码进行缩进？一旦同意了一 set 规则（即使它们并不完全符合你的审美），就能让你在随后的项目开发中专注于实际工作，而不是在关于代码外观的细节上钻牛角尖。\n\
  \n最后，也是至关的一点，你的构建工具是提供自定义功能的关键中心。你的项目是否有人们需要定期运行的特殊设置或操作命令？你的项目在构建之后、部署之前应该运行的验证？这些都非常适合集成到构建工具中，以便所有处理代码的人都能使用。`Maven`\
  \ 和 `Gradle` 都提供了许多扩展方式来满足你自己的逻辑和需求。\n\n希望你现在已经相信，构建工具不仅仅是可以在项目中配置一次的东西，而是值得投入精力去理解的。让我们从最常用的工具之一开始：`Maven`。\n\
  \n## 11.2 Maven\n\n在 Java 历史早期，`Ant` 框架是默认的构建工具。通过在 XML 中描述任务，它提供了一种比 `Make` 等工具更符合\
  \ Java 习惯的构建脚本方式。但 `Ant` 在如何配置构建方面缺乏结构——即有哪些步骤、它们如何相互关联以及如何管理依赖。`Maven` 通过其标准化的*构建生命周期*（build\
  \ lifecycle）概念和一致处理依赖的方法填补了这些许多空白。\n\n### 11.2.1 构建生命周期\n\n`Maven` 是一个带有“主见”（opinionated）的工具。这些主见体现得最大的领域之一就是它的构建生命周期。`Maven`\
  \ 并不是让用户定义自己的任务并决定顺序，而是拥有一个包含通常步骤的*默认生命周期*，这些步骤被称为*阶段*（phases），是你在构建中会预期的。尽管并不详尽，但以下阶段捕捉了默认生命周期中的核心要点：\n\
  \n- `Validate`——检查项目配置是否正确并可以构建\n- `Compile`——编译源代码\n- `Test`——运行单元测试\n- `Package`——生成产物，如\
  \ JAR 文件\n- `Verify`——运行集成测试\n- `Install`——将包安装到本地仓库\n- `Deploy`——将包结果发布供他人使用，通常从\
  \ CI 环境中运行\n\n这些阶段很可能对应你从源码到部署应用程序或库时会采取的大部分步骤。这是 `Maven` 这种带有“主见”的方法的一个大优势——任何\
  \ `Maven` 项目都共享相同的生命周期。你对如何运行构建的知识比以前更具迁移性。\n\n这些阶段在 `Maven` 中定义得很明确，但每个项目在细节上都需要一些特殊。在\
  \ `Maven` 的模型中，各种*插件*（plugins）将*目标*（goals）挂载到这些阶段上。一个目标是一个具体的任务，包含了如何执行它的实现方式。\n\
  \n除了默认生命周期外，`Maven` 还包含了 `clean` 和 `site` 生命周期。`clean` 生命周期用于清理（例如移除中间构建结果），而 `site`\
  \ 生命周期则用于生成文档。\n\n我们稍后在讨论扩展 `Maven` 时会详细查看如何接入生命周期，但如果你确实需要重新定义一切，`Maven` 确实支持编写完全自定义的生命周期。不过，这是一个非常高级的话题，超本书的范围。\n\
  \n### 11.2.2 命令/POM 简介\n\n`Maven` 是 Apache 软件基金会的项目，它是开源的。可以在项目网站 [`maven.apache.org/install.html`](https://maven.apache.org/install.html)\
  \ 上找到安装说明。\n\n通常，`Maven` 全局安装在开发者的工作站上，适用于任何非古老的 JVM（JDK 7 或更高版本）。一旦安装完成，调用它会得到如下输出：\n\
  \n```\n~: mvn\n\n  [INFO] Scanning for projects...\n  [INFO] ------------------------------------------------------------------\n\
  \  [INFO] BUILD FAILURE\n  [INFO] ------------------------------------------------------------------\n\
  \  [INFO] Total time:  0.06 s\n  [INFO] Finished at: 2020-07-05T21:28:22+02:00\n\
  \  [INFO] ------------------------------------------------------------------\n \
  \ [ERROR] No goals have been specified for this build. You must specify a\n  valid\
  \ lifecycle phase or a goal in the format <plugin-prefix>:<goal> or\n  <plugin-group-id>:<plugin-artifact-id>[:<plugin-version>]:<goal>.\n\
  \  Available lifecycle phases are: validate, initialize, ....\n```\n\n特别令人感兴趣的是信息\
  \ `No goals have been specified for this build.`。这表明 `Maven` 对我们的项目一无所知。我们在 `pom.xml`\
  \ 文件中提供这些信息，它是 `Maven` 项目的宇宙中心。\n\n注意 `POM` 代表项目对象模型（Project Object Model）。\n\n\
  尽管一个完整的 `pom.xml` 文件可能长且复杂得令人生生畏，但你可以从极少的内容开始。例如，一个大致极简的 `pom.xml` 文件如下：\n\n```xml\n\
  <project>\n  <modelVersion>4.0.0</modelVersion>\n  <groupId>com.wellgrounded</groupId>❶\n\
  \  <artifactId>example</artifactId>❶\n  <version>1.0-SNAPSHOT</version>\n  <name>example</name>\n\
  \n  <properties>\n    <maven.compiler.source>11</maven.compiler.source>❷\n    <maven.compiler.target>11</maven.compiler.target>\n\
  \  </properties>\n</project>\n```\n\n❶ 标识我们的项目\n\n❷ Maven 插件默认使用 Java 1.6。我们显然想要更高的版本。\n\
  \n\n\n\n\n这些坐标不仅对于本地配置项目至关重要。坐标充当依赖项的地址，这样我们的构建工具就能找到它们。接下来的章节将详细探讨我们如何表达这些依赖项的机制。\n\
  \n就像 Maven 标准了构建生命周期一样，它还普及了我们在第 11.1.1 节以及下文所示的标准布局。如果你遵循这些约定，无需告诉 Maven 任何关于你项目的信息，它就能完成编译：\n\
  \n```\n.\n├── pom.xml\n└── src\n     ├── main\n     │      └── java\n     │    \
  \          └── com\n     │                      └── wellgrounded\n     │       \
  \                        └── Main.java\n     └── test\n         └── java\n     \
  \         └── com\n                   └── wellgrounded\n                       \
  \ └── MainTest.java\n```\n\n注意这些并行结构——`src/main/java` 和 `src/test/java`，相同的目录映射到我们的包层次结构。这种约定将测试代码与主程序代码分离，简化了我们为主代码进行部署打包的过程，排除了包用户通常不需要或使用的测试代码。\n\
  \n除了这两个目录，还存在其他标准目录。例如，`src/main/resources` 是包含在 JAR 包中的额外非代码文件的典型位置。请查看 [`mng.bz/6XoG`](http://mng.bz/6XoG)\
  \ 文档获取 Maven 标准布局的完整列表。\n\n在你熟悉 Maven 的期间，遵循 Maven 提供的约定、标准布局和其他默认设置是一个好主意。正如我们提到的，它是一个带有主见（opinionated）的工具，因此在学习期间，最好留在它提供的防护范围内。丰富的\
  \ Maven 开发者可以（并且确实会）离开约定并打破规则，但我们不要操之先行。\n\n### 11.2.3 构建\n\n我们之前看到，仅在命令行中运行 `mvn`\
  \ 会警告我们需要选择一个生命周期阶段（phase）或目标（goal）来采取实际行动。我们通常想要运行一个阶段，该阶段可能包含许多目标。\n\n最简单的入门方法是通过请求\
  \ `compile` 阶段来编译我们的代码：\n\n```\n~: mvn compile\n\n  [INFO] Scanning for projects...\n\
  \  [INFO]\n  [INFO] -------------------< com.wellgrounded:example >---------------\n\
  \  [INFO] Building example 1.0-SNAPSHOT\n  [INFO] -----------------------------[\
  \ jar ]--------------------------\n  [INFO]\n  [INFO] -- maven-resources-plugin:2.6:resources\
  \ (default-resources) --\n  [INFO] Using 'UTF-8' to copy filtered resources.   \
  \                      ❶\n  [INFO] Copying 0 resource\n  [INFO]\n  [INFO] -----\
  \ maven-compiler-plugin:3.1:compile (default-compile) ----\n  [INFO] Changes detected\
  \ - recompiling the module!                        ❷\n  [INFO] Compiling 1 source\
  \ file to ./maven-example/target/classes\n  [INFO] --------------------------------------------------------------\n\
  \  [INFO] BUILD SUCCESS\n  [INFO] --------------------------------------------------------------\n\
  \  [INFO] Total time:  0.940 s\n  [INFO] Finished at: 2020-07-05T21:46:25+02:00\n\
  \  [INFO] --------------------------------------------------------------\n```\n\n\
  ❶ 尽管我们的项目中没有资源，但默认生命周期的 `maven-resources-plugin` 会替我们进行检查。\n\n❷ 我们实际编译是由 `maven-compiler-plugin`\
  \ 提供的。\n\nMaven 默认将输出到 `target` 目录。在执行 `mvn compile` 后，我们可以在 `target/classes` 下找到类文件。仔细检查会发现，我们只构建了\
  \ `main` 目录下的代码。如果我们想编译测试，可以使用 `test-compile` 阶段。\n\n默认生命周期不仅包含编译。例如，对之前的项目运行 `mvn\
  \ package` 将在 `target/example-1.0-SNAPSHOT.jar` 生成一个 JAR 文件。\n\n虽然可以使用此 JAR 作为库，但如果我们尝试通过\
  \ `java -jar target/example-1.0-SNAPSHOT.jar` 运行它，我们会发现 Java 抱怨找不到主类。为了看到我们如何开始构建\
  \ Maven 构建，让我们修改它，使生成的 JAR 成为可运行的应用程序。\n\n### 11.2.4 控制 manifest\n\nMaven 通过 `mvn\
  \ package` 生成的 JAR 缺少一个清单（manifest），用来告诉 JVM 在启动时哪里寻找 `main` 方法。幸运的是，Maven 自带了一个用于构建\
  \ JAR 的插件，它知道如何编写清单。该插件通过 `pom.xml` 中 `properties` 元素之后、`project` 元素内部暴露配置，如下所示：\n\
  \n```\n <build>\n    <plugins>\n      <plugin>\n        <groupId>org.apache.maven.plugins</groupId>\n\
  \        <artifactId>maven-jar-plugin</artifactId>            ❶\n        <version>2.4</version>\n\
  \        <configuration>                                      ❷\n          <archive>\n\
  \            <manifest>                                       ❸\n              <addClasspath>true</addClasspath>\n\
  \              <mainClass>com.wellgrounded.Main</mainClass>\n              <Automatic-Module-Name>\n\
  \                com.wellgrounded\n              </Automatic-Module-Name>      \
  \                 ❹\n            </manifest>\n          </archive>\n        </configuration>\n\
  \      </plugin>\n    </plugins>\n  </build>\n```\n\n❶ `maven-jar-plugin` 是插件名称。在运行\
  \ `mvn package` 命令的输出中很容易发现它。\n\n❷ 每个插件都有自己带有不同属性的专门配置。\n\n❸ `manifest` 配置结果 JAR\
  \ 内容。\n\n❹ 配置我们的模块名称，以便 `java` 启动器知道如何执行 JAR。我们还添加了模块名称——这是为了在模块化世界做一个良好的公民。正如我们在第\
  \ 2 章中讨论过的，即使我们写的代码不是模块化的（如本例所示），提供显式的模块名称也是有意义的。\n\n在 `plugin` 元素下设置配置的模式在 Maven\
  \ 中非常标准。为了简化起见，如果你使用不支持或意外之外的属性，大多数默认插件都会友善地警告你。\n\n### 11.2.5 添加另一种语言\n\n正如我们在第\
  \ 8 章中讨论的，JVM 作为一个平台的优势是可以在同一个项目中使用多种语言。当特定语言对你应用程序的某部分具有更好的支持时，或者为了允许将应用程序从一种语言逐渐转换为另一种语言时，这种特性可能很有用。\n\
  \n让我们看看如何配置我们的简单 Maven 项目，以从 Kotlin 而不是 Java 构建一些类。遗憾的是，我们的标准布局已经设置好可以方便地添加语言，如下所示：\n\
  \n```\n.\n├── pom.xml\n└── src\n     ├── main\n     │      ├── java\n     │    \
  \  │      └── com\n     │      │              └── wellgrounded\n     │      │  \
  \                     └── Main.java\n     │      └── kotlin                    \
  \              ❶\n     │               └── com\n     │                       └──\
  \ wellgrounded                  ❷\n     │                                └── MessageFromKotlin.kt\n\
  \     └── test\n          └── java\n               └── com\n                   \
  \ └── wellgrounded\n                         └── MainTest.java\n```\n\n❶ 我们将 Kotlin\
  \ 代码放在自己的子目录，以便识别哪些路径使用哪个编译器来生成类文件。\n\n❷ 包可以在语言之间混合，因为生成的类文件并并不知道它们是由什么语言生成的。\n\n\
  \n\n\n\n如果一个项目完全用 Kotlin 编写，编译只需要添加插件并附加到 `compile` 目标即可：\n\n```xml\n <build>\n\
  \    <plugins>\n      <plugin>\n        <groupId>org.jetbrains.kotlin</groupId>\n\
  \        <artifactId>kotlin-maven-plugin</artifactId>\n        <version>1.6.10</version>\
  \                      ❶\n        <executions>\n          <execution>\n        \
  \    <id>compile</id>\n            <goals>                                    ❷\n\
  \              <goal>compile</goal>\n            </goals>\n          </execution>\n\
  \          <execution>\n            <id>test-compile</id>\n            <goals> \
  \                                   ❷\n              <goal>test-compile</goal>\n\
  \            </goals>\n          </execution>\n        </executions>\n      </plugin>\n\
  \    </plugins>\n  </build>\n```\n\n❶ 编写本章时 Kotlin 的当前版本。\n\n❷ 将此添加到编译主代码和测试代码的目标中。\n\
  \n当混合使用 Kotlin 和 Java 时，情况会变得复杂。Maven 默认用于为我们编译 Java 的 `maven-compiler-plugin` 需要被覆盖，以便让\
  \ Kotlin 先编译，如下所示，否则我们的 Java 代码将无法使用 Kotlin 类：\n\n```xml\n <build>\n    <plugins>\n\
  \      <plugin>\n        <groupId>org.jetbrains.kotlin</groupId>\n        <artifactId>kotlin-maven-plugin</artifactId>\
  \                       ❶\n        <version>1.6.10</version>\n        <executions>\n\
  \          <execution>\n            <id>compile</id>\n            <goals>\n    \
  \          <goal>compile</goal>\n            </goals>\n            <configuration>\n\
  \              <sourceDirs>                                                 ❷\n\
  \                <sourceDir>${project.basedir}/src/main/kotlin</sourceDir>\n   \
  \             <sourceDir>${project.basedir}/src/main/java</sourceDir>\n        \
  \      </sourceDirs>\n            </configuration>\n          </execution>\n   \
  \       <execution>\n            <id>test-compile</id>\n            <goals>\n  \
  \            <goal>test-compile</goal>\n            </goals>\n            <configuration>\n\
  \              <sourceDirs>                                                 ❷\n\
  \                <sourceDir>${project.basedir}/src/test/kotlin</sourceDir>\n   \
  \             <sourceDir>${project.basedir}/src/test/java</sourceDir>\n        \
  \      </sourceDirs>\n            </configuration>\n          </execution>\n   \
  \     </executions>\n      </plugin>\n      <plugin>\n        <groupId>org.apache.maven.plugins</groupId>\n\
  \        <artifactId>maven-compiler-plugin</artifactId>\n        <version>3.8.1</version>\n\
  \        <executions>\n          <execution>\n            <id>default-compile</id>\
  \                                       ❸\n            <phase>none</phase>\n   \
  \       </execution>\n          <execution>\n            <id>default-testCompile</id>\
  \                                   ❸\n            <phase>none</phase>\n       \
  \   </execution>\n          <execution>\n            <id>java-compile</id>     \
  \                                     ❹\n            <phase>compile</phase>\n  \
  \          <goals>\n              <goal>compile</goal>\n            </goals>\n \
  \         </execution>\n          <execution>\n            <id>java-test-compile</id>\
  \                                     ❹\n            <phase>test-compile</phase>\n\
  \            <goals>\n              <goal>testCompile</goal>\n            </goals>\n\
  \          </execution>\n        </executions>\n      </plugin>\n    </plugins>\n\
  \  </build>\n```\n\n❶ 添加 `kotlin-maven-plugin` 主要与之前相同，但现在确保它能同时感知 Java 和 Kotlin\
  \ 路径。\n\n❷ Kotlin 编译器需要知道我们 Kotlin 和 Java 代码的位置。\n\n❸ 禁用了 `maven-compiler-plugin`\
  \ 构建 Java 的默认设置，因为这些设置会强制它先运行。\n\n❹ 将 `maven-compiler-plugin` 重新应用到 `compile` 和\
  \ `test-compile` 阶段。这些阶段现在会被添加到 `kotlin-maven-plugin` 之后。\n\n注意：当使用父项目等 Maven 特性时，上述覆盖可能会变得复杂，额外的\
  \ POM 定义可能会产生冲突。我们很快就会看到在出现这些问题时的一些调试策略。\n\n你的项目需要至少对 Kotlin 标准库有依赖，因此我们如下显式添加：\n\
  \n```xml\n<dependencies>\n    <dependency>\n        <groupId>org.jetbrains.kotlin</groupId>\n\
  \        <artifactId>kotlin-stdlib</artifactId>\n        <version>1.6.10</version>\n\
  \    </dependency>\n</dependencies>\n```\n\n准备好后，我们的多语言项目将像以前一样构建和运行。\n\n### 11.2.6\
  \ 测试\n\n一旦代码编译完成，下一步就是对其进行测试。Maven 将测试深度集成到它的生命周期中。事实上，主代码的编译只有一个阶段，而 Maven 原生支持两个独立的测试阶段：`test`\
  \ 和 `integration-test`。`test` 用于典型的单元测试，而 `integration-test` 阶段在构建 JAR 等制品之后运行，旨在对最终输出进行端到端验证。\n\
  \n注意：集成测试也可以使用 `JUnit` ，因为尽管名字如此，`JUnit` 是一个非常强大的测试运行器，不仅仅用于单元测试。不要掉入认为任何由 `JUnit`\
  \ 执行的测试都是单元测试的阱！我们将在第 13 章详细检查不同类型的测试。\n\n几乎任何项目都会受益于测试。正如你从 Maven 鲜明的立场所预期的那样，测试默认是使用无处不在的\
  \ `JUnit` 框架进行的。其他框架只需一个插件即可。\n\n虽然标准插件知道如何运行 `JUnit`，但我们必须将该库声明为依赖，以便 Maven 知道如何编译我们的测试。你可以在\
  \ `<project>` 元素下使用如下代码片段添加库：\n\n```xml\n <dependencies>\n    <dependency>\n   \
  \   <groupId>org.junit.jupiter</groupId>\n      <artifactId>junit-jupiter-api</artifactId>\n\
  \      <version>5.8.1</version>\n      <scope>test</scope>                     \
  \         ❶\n    </dependency>\n    <dependency>\n      <groupId>org.junit.jupiter</groupId>\n\
  \      <artifactId>junit-jupiter-engine</artifactId>\n      <version>5.8.1</version>\n\
  \      <scope>test</scope>                              ❶\n    </dependency>\n \
  \ </dependencies>\n```\n\n❶ `scope` 表示此库仅用于 `test-compile` 阶段。\n\n准备好后，我们可以尝试运行单元测试。取决于你的\
  \ Maven 版本，即使是最新的版本也可能给我们带来这个奇怪的结果：\n\n```bash\n~:mvn test\n\n  [INFO] Scanning\
  \ for projects...\n  [INFO]\n  [INFO] -------------------< com.wellgrounded:example\
  \ >----------------\n  [INFO] Building example 1.0-SNAPSHOT\n  [INFO] --------------------------------[\
  \ jar ]------------------------\n  [INFO]\n  [INFO] .....\n  [INFO]\n  [INFO] --\
  \ maven-surefire-plugin:2.12.4:test (default-test) @ example -\n  [INFO] Surefire\
  \ report dir: ./target/surefire-reports                    ❶\n\n  -------------------------------------------------------\n\
  \   T E S T S\n  -------------------------------------------------------\n  Running\
  \ com.wellgrounded.MainTest\n  Tests run: 0, Failures: 0, Errors: 0, Skipped: 0,\
  \ Time elapsed: 0.001 sec\n\n  Results :\n\n  Tests run: 0, Failures: 0, Errors:\
  \ 0, Skipped: 0         ❷\n\n  [INFO] ------------------------------------------------\n\
  \  [INFO] BUILD SUCCESS\n  [INFO] ------------------------------------------------\n\
  \  [INFO] Total time:  5.605 s\n  [INFO] Finished at: 2021-11-29T09:41:06+01:00\n\
  \  [INFO] ------------------------------------------------\n```\n\n❶ Maven 运行 JUnit\
  \ 测试的默认插件是 `maven-surefire-plugin`。\n\n❷ 没有测试运行？这不对！\n\n由于兼容性原因，默认安装的 `maven-surefire-plugin`（即使在\
  \ Maven 3.8.4 版本中）也无法感知 JUnit 5。我们将在第 13 章深入探讨这些转换问题，但目前我们只需将插件版本升级到较新的版本，如下所示：\n\
  \n\n\n\n\n```\n <plugin>\n      <groupId>org.apache.maven.plugins</groupId>\n  \
  \    <artifactId>maven-surefire-plugin</artifactId>\n      <version>3.0.0-M5</version>\n\
  \    </plugin>\n```\n\n❶ 在 2.12 之后的版本中，插件可以直接理解 `JUnit 5`。\n\n在这些基础上，我们看到了如下更令人安心的输出：\n\
  \n```\n~:mvn test\n\n  [INFO] .....\n\n  -------------------------------------------------------\n\
  \   T E S T S\n  -------------------------------------------------------\n  Running\
  \ com.wellgrounded.MainTest\n  Tests run: 1, Failures: 0, Errors: 0, Skipped: 0,\
  \ Time elapsed: 0.04 sec\n\n  Results :\n\n  Tests run: 1, Failures: 0, Errors:\
  \ 0, Skipped: 0\n\n  [INFO] ------------------------------------------------\n \
  \ [INFO] BUILD SUCCESS\n  [INFO] ------------------------------------------------\n\
  \  [INFO] Total time:  1.010 s\n  [INFO] Finished at: 2020-07-06T15:45:22+02:00\n\
  \  [INFO] -------------------------------------------------------------\n```\n\n\
  默认情况下，Surefire 插件会在 `test` 阶段的标准位置 `src/test/*` 运行所有单元测试。如果我们想利用 `integration-test`（集成测试）阶段，建议使用独立的插件，例如\
  \ `maven-failsafe-plugin`。Failsafe 由制作 `maven-surefire-plugin` 的同一组人员维护，专门针对集成测试用例。我们在之前用于配置\
  \ manifest 时使用的 `<build><plugins>` 部分中添加了该插件，如下所示：\n\n```\n <plugin>\n    <groupId>org.apache.maven.plugins</groupId>\n\
  \    <artifactId>maven-failsafe-plugin</artifactId>\n    <version>3.0.0-M5</version>\n\
  \    <executions>\n      <execution>\n        <goals>\n          <goal>integration-test</goal>\n\
  \          <goal>verify</goal>\n        </goals>\n      </execution>\n    </executions>\n\
  \  </plugin>\n```\n\nFailsafe 将以下文件名模式视为集成测试，尽管它们可以被重新配置：\n\n- `**/IT*.java`\n-\
  \ `**/*IT.java`\n- `**/*ITCase.java`\n\n因为它是同一套插件的一部分，Surefire 也能感知这一约定，并将这些测试从\
  \ `test` 阶段中排除。\n\n建议通过 `mvn verify` 运行集成测试（如下所示），而不是使用 `mvn integration-test`。`verify`\
  \ 包含了 `post-integration-test`，这是插件挂载任何测试后清理工作（所需的）的典型位置：\n\n```\n~: mvn verify\n\
  \n  [INFO] ... compilation output omitted for length ...\n\n  [INFO] --- maven-failsafe-plugin:3.0.0-M5:integration-test\
  \ @ example ---\n  [INFO]\n  [INFO] -------------------------------------------------------\n\
  \  [INFO]  T E S T S\n  [INFO] -------------------------------------------------------\n\
  \  [INFO] Running com.wellgrounded.LongRunningIT\n  [INFO] Tests run: 1, Failures:\
  \ 0, Errors: 0, Skipped: 0,\n  [INFO] Time elapsed: 0.032 s - in com.wellgrounded.LongRunningIT\n\
  \  [INFO]\n  [INFO] Results:\n  [INFO]\n  [INFO] Tests run: 1, Failures: 0, Errors:\
  \ 0, Skipped: 0\n  [INFO]\n  [INFO]\n  [INFO] --- maven-failsafe-plugin:3.0.0-M5:verify\
  \ (default) @ example ---\n  [INFO] -----------------------------------------------------------------\n\
  \  [INFO] BUILD SUCCESS\n  [INFO] -----------------------------------------------------------------\n\
  ```\n\n### 11.2.7 依赖管理\n\nMaven 为生态系统带来的一个关键功能是通过 `pom.xml` 文件表达依赖管理信息的标准格式。Maven\
  \ 还为库建立了一个中央仓库。Maven 可以遍历你的 `pom.xml` 以及依赖项的 `pom.xml` 文件，以确定应用程序所需的整个传递性依赖集。\n\n\
  这种遍历树并寻找所有必要库的过程被称为依赖解析（dependency resolution）。尽管这对管理现代应用程序至关重要，但这个过程确实存在棘手的地方。\n\
  \n为了看到问题出现在何处，让我们回顾一下在第 11.1.2 节中看到的项目设置。回想项目的依赖导致了如图 11.3 所示的树。\n\n![](img/CH11_F03_Evans2.png)\n\
  \n图 11.3 冲突的传递依赖，其中依赖请求了旧版本\n\n在这里我们显式请求 `lib-a` 的 2.0 版本，但我们的依赖 `lib-b` 请求了旧的 1.0\
  \ 版本。Maven 的依赖解析算法倾向于距离根最近的库版本。图 11.3 所示配置的最终结果是在应用程序中使用 `lib-a` 2.0。正如我们在 11.1.2\
  \ 节中概述的，这可能运行良好，也可能导致毁灭性的破坏。\n\n另一种可能导致问题的常见场景是相反的情况，即距离根最近的依赖比预期的旧。\n\n在这种情况下，`lib-d`\
  \ 完全可能依赖 3.0 版本的 `lib-c`，因此向项目添加 `lib-d` 将导致异常。\n\n在解决依赖问题之前，了解我们的依赖是非常重要的。Maven\
  \ 通过 `mvn dependency:tree` 显示了如下：\n\n```\n~:mvn dependency:tree\n  [INFO] Scanning\
  \ for projects...\n  [INFO]\n  [INFO] -------------------------------------------------------------\n\
  \  [INFO] com.wellgrounded:example:jar:1.0-SNAPSHOT\n  [INFO] \\-\n  [INFO] +- org.junit.jupiter:junit-jupiter-api:jar:5.8.1:test\n\
  \  [INFO] |  +- org.opentest4j:opentest4j:jar:1.2.0:test\n  [INFO] |  +- org.junit.platform:junit-platform-commons:jar:1.8.1:test\n\
  \  [INFO] |  \\- org.apiguardian:apiguardian-api:jar:1.1.2:test\n  [INFO] +- org.junit.jupiter:junit-jupiter-engine:jar:5.8.1:test\n\
  \  [INFO] |  \\- org.junit.platform:junit-platform-engine:jar:1.8.1:test\n  [INFO]\
  \ -------------------------------------------------------------\n  [INFO] Total\
  \ time:  0.790 s\n  [INFO] Finished at: 2020-08-13T23:02:10+02:00\n```\n\n该命令的树显示了我们在\
  \ `pom` 文件中第一层的直接依赖，随后是 JUnit 自身的依赖。\n\nJUnit 携带的依赖非常少，为了进一步探索依赖问题，假设我们的团队想要使用公司的两个内部库来支持断言。这两个库都使用\
  \ `assert` 库构建，但遗憾的是版本不同，如下所示：\n\n```\n [INFO] com.wellgrounded:example:jar:1.0-SNAPSHOT\n\
  \  [INFO] \\-\n  [INFO] +- org.junit.jupiter:junit-jupiter-api:jar:5.8.1:test\n\
  \  [INFO] |  +- org.opentest4j:opentest4j:jar:1.2.0:test\n  [INFO] |  +- org.junit.platform:junit-platform-commons:jar:1.8.1:test\n\
  \  [INFO] |  \\- org.apiguardian:apiguardian-api:jar:1.1.2:test\n  [INFO] +- org.junit.jupiter:junit-jupiter-engine:jar:5.8.1:test\n\
  \  [INFO] |  \\- org.junit.platform:junit-platform-engine:jar:1.8.1:test\n  [INFO]\
  \ +- com.wellgrounded:first-test-helper:1.0.0:test\n  [INFO] |  \\- org.assertj:assertj-core:3.21.0:test\
  \            ❶\n  [INFO] \\- com.wellgrounded:second-test-helper:2.0.0:test\n  [INFO]\
  \    \\- org.assertj:assertj-core:2.9.1:test             ❷\n```\n\n❶ 我们的第一个辅助库带来了\
  \ 3.21.0 版本的 `assertj-core`。\n\n❷ 我们的第二个辅助库想要 2.9.1 版本的 `assertj-core`。\n\n\n\n\n\
  \n最好的方法是寻找依赖项的新版本，使它们对彼此的依赖达成一致。作为内部库，这显然是可能的。即使在更广泛的开源世界中，这通常也是可能的。尽管如此，有时库会失去维护者并变得过时，因此完全可能陷入一种难以获取我们所需要的更新的境地。\n\
  \n这使我们寻找其他处理冲突的方法。如果我们无法找到自然的解决办法，就会有两种主要方法发挥作用。请注意，这两种解决方案都需要找到一个能够满足你依赖的兼容版本。\n\
  \n如果你的某一个依赖项指定了一个大家都能接受的版本，但该版本没有被 Maven 的解析算法选中，你可以告诉 Maven 在解析时排除树的某些部分。如果我们的两个辅助库都能与较新的\
  \ `assertj-core` 正常工作，我们可以直接忽略由第二个库引入的旧版本，如下所示：\n\n```\n<dependencies>\n    <dependency>\n\
  \      <groupId>com.wellgrounded</groupId>\n      <artifactId>second-test-helper</artifactId>\n\
  \      <version>2.0.0</version>\n      <scope>test</scope>\n      <exclusions> \
  \                                ❶\n        <exclusion>\n          <groupId>org.assertj</groupId>\n\
  \          <artifactId>assertj-core</artifactId>\n        </exclusion>\n      </exclusions>\n\
  \    </dependency>\n    <dependency>\n      <groupId>com.wellgrounded</groupId>\
  \          ❷\n      <artifactId>first-test-helper</artifactId>\n      <version>1.0.0</version>\n\
  \      <scope>test</scope>\n    </dependency>\n  </dependencies>\n```\n\n❶ 排除 `second-test-helper`\
  \ 引入的旧版本 `assertj-core`\n\n❷ 允许来自 `first-test-helper` 的传递依赖正常进行\n\n在最坏的情况下，也许两个库都没有表达兼容的版本。为了处理这种情况，我们将精确的版本作为直接依赖项指定在我们的项目中，如下面的代码示例所示。\n\
  \n```\n<dependencies>\n    <dependency>\n      <groupId>com.wellgrounded</groupId>\n\
  \      <artifactId>second-test-helper</artifactId>   ❶\n      <version>2.0.0</version>\n\
  \      <scope>test</scope>\n    </dependency>\n    <dependency>\n      <groupId>com.wellgrounded</groupId>\n\
  \      <artifactId>first-test-helper</artifactId>    ❷\n      <version>1.0.0</version>\n\
  \      <scope>test</scope>\n    </dependency>\n    <dependency>\n      <groupId>org.assertj</groupId>\n\
  \      <artifactId>org.assertj</artifactId>\n      <version>3.1.0</version>    \
  \                  ❸\n      <scope>test</scope>\n    </dependency>\n  </dependencies>\n\
  ```\n\n❶ 我们的依赖项会请求不同版本的 `assertj-core`。\n\n❷ 我们的依赖项会请求不同版本的 `assertj-core`。\n\n\
  ❸ 但我们强制将 `assertj-core` 解析为我们想要的精确版本。\n\n根据解析规则，Maven 将选择该版本，因为它离项目根部。。尽管说服了工具去执行我们想要的操作，但我们也承担了混合库版本导致运行时错误的风险，因此彻底测试这些相互作用是至关重要的：\n\
  \n最后，值得注意的是，`maven-enforcer-plugin` 可以配置为在发现任何不匹配的依赖项时构建失败，这样我们就可以避免依赖糟糕的运行时行为来暴露问题。（参见\
  \ [`mng.bz/o2WN`](http://mng.bz/o2WN)）。这些构建失败可以使用我们之前讨论的技术来解决。\n\n### 11.2.8 评审\n\
  \n我们的构建过程是接入额外工具和检查的绝佳时机。一个关键信息是代码覆盖率，它告诉我们测试执行了代码的哪些部分。\n\nJava 生态系统中代码覆盖率的领先选项是\
  \ JaCoCo ([`mng.bz/nNjv`](http://mng.bz/nNjv))）。JaCoCo 可以配置为在测试期间强制某些覆盖水平，并输出报告告诉你哪些已覆盖，哪些未被覆盖。\n\
  \n启用 JaCoCo 只需在 `pom.xml` 文件的 `<build><plugins>` 部分添加一个插件。它默认不会启用，所以你必须告诉它何时应该执行。在示例中，我们将其绑定到\
  \ `test` 阶段，如下所示：\n\n```\n <build>\n    <plugins>\n      <plugin>\n        <groupId>org.jacoco</groupId>\n\
  \        <artifactId>jacoco-maven-plugin</artifactId>\n        <version>0.8.5</version>\n\
  \        <executions>\n          <execution>                      ❶\n          \
  \  <goals>\n              <goal>prepare-agent</goal>\n            </goals>\n   \
  \       </execution>\n          <execution>                      ❷\n           \
  \ <id>report</id>\n            <phase>test</phase>\n            <goals>\n      \
  \        <goal>report</goal>\n            </goals>\n          </execution>\n   \
  \     </executions>\n      </plugin>\n    </plugins>\n  </build>\n```\n\n❶ JaCoCo\
  \ 需要在过程早期开始运行。这将其添加到了 initialize 阶段。\n\n❷ 告诉 JaCoCo 在 test 阶段生成报告\n\n这默认会在 `target/site/jacoco`\
  \ 中生成你所有类的报告，如图 11.5 所示，并在 `index.html` 处有一个完整的 HTML 版本。\n\n![](img/11_05.png)\n\
  \n图 11.5 JaCoCo 报告\n\n### 11.2.9 跨越 Java 8\n\n在章节中，我们记录了以下属于 Java 版但存在于核心 JDK 中的模块：\n\
  \n* `java.activation`\n* `java.corba`\n* `java.transaction`\n* `java.xml.bind`\n\
  * `java.xml.ws`\n* `java.xml.annotation`\n\n如果你的项目依赖于任何这些模块，当你迁移到较新的 JDK 时，构建可能会崩溃。幸运的是，在你的\
  \ `pom.xml` 中添加几个简单的依赖即可解决此：\n\n```\n<dependencies>\n  <dependency>\n    <groupId>com.sun.activation</groupId>\
  \               ❶\n    <artifactId>jakarta.activation</artifactId>\n    <version>1.2.2</version>\n\
  \  </dependency>\n  <dependency>\n    <groupId>org.glassfish.corba</groupId>   \
  \           ❷\n    <artifactId>glassfish-corba-omgapi</artifactId>\n    <version>4.2.1</version>\n\
  \  </dependency>\n  <dependency>\n    <groupId>javax.transaction</groupId>     \
  \           ❸\n    <artifactId>javax.transaction-api</artifactId>\n    <version>1.3</version>\n\
  \  </dependency>\n  <dependency>\n    <groupId>jakarta.xml.bind</groupId>      \
  \           ❹\n    <artifactId>jakarta.xml.bind-api</artifactId>\n    <version>2.3.3</version>\n\
  \  </dependency>\n  <dependency>\n    <groupId>jakarta.xml.ws</groupId>        \
  \           ❺\n    <artifactId>jakarta.xml.ws-api</artifactId>\n    <version>2.3.3</version>\n\
  \  </dependency>\n  <dependency>\n    <groupId>jakarta.annotation</groupId>    \
  \           ❻\n    <artifactId>jakarta.annotation-api</artifactId>\n    <version>1.3.5</version>\n\
  \  </dependency>\n</dependencies>\n```\n\n❶ `java.activation` (JAF)\n\n❷ `java.corba`\
  \ (CORBA)\n\n❸ `java.transaction` (JTA)\n\n❹ `java.xml.bind` (JAXB)\n\n❺ `java.xml.ws`\
  \ (JAX-WS，以及一些相关技术)\n\n❻ `java.xml.ws.annotation` (通用注解)\n\n### 11.2.10 Maven 中的多版本\
  \ JAR\n\nJDK 9 引入的一项特性是允许针对不同 JDK 封装不同代码的 JAR。这允许我们利用平台的新功能，同时支持运行在旧版本上的代码客户端。\n\
  \n在第 2 章，我们研究了该特性并手动构建了启用此功能所需的特定 JAR 格式。该布局将版本目录放置在 JAR 内部的 `META-INF/versions`\
  \ 下，从 9 开始的 JVM 在加载期间会检查是否存在类的类的新版本，如下所示：\n\n```\n.\n├── META-INF\n│   ├── MANIFEST.MF\n\
  │   └── versions\n│       └── 11\n│           └── wgjd2ed\n│                   └──\
  \ GetPID.class\n└── wgjd2ed\n     ├── GetPID.class\n     └── Main.class\n```\n\n\
  \n\n在此结构中，`wgjd2ed` 中的类将具有一个类文件版本，代表该 JAR 可能被用于的最旧 JVM 版本。（在我们的稍后的示例中，这将是 JDK 8。）然而，`META-INF/versions/11`\
  \ 下的类可以使用较新版本的 JDK 进行编译，并具有较新的类文件版本。由于旧版本的 JDK 会忽略 `META-INF/versions` 目录（而从 9 开始的版本能够理解它们被允许使用的版本），因此我们可以在\
  \ JAR 中混合较新的代码，同时让所有内容在旧版本的 JVM 上运行。这正是 Maven 旨在为了自动化的这种繁琐过程。\n\n尽管 JAR 中的输出格式是启用多版本发布（multirelease）功能的唯一真正关键，但为了清晰起见，我们将在代码布局中模拟这种结构。所示，`src`\
  \ 中的代码是任何 JDK 默认看到的基线功能。`versions` 下的代码则可选地用备用实现替换特定的类：\n\n```\n.\n├── pom.xml\n\
  ├── src\n│      └── main\n              └── java\n                      └── wgjd2ed\n\
  \                               └── GetPID.java\n                              \
  \         └── Main.java\n└── versions\n    └── 11\n         └── src\n          \
  \    └── wgjd2ed\n                   └── GetPID.java\n```\n\nMaven 的默认设置将找到并编译 `src/main`\
  \ 中的代码，但我们有两个需要解决的复杂情况：\n\n* Maven 还需要找到 `versions` 目录中的代码。\n* 此外，Maven 需要将该源码的目标指向与主项目不同的\
  \ JDK 进行编译。\n\n这两个目标都可以通过配置构建我们 Java 类文件的 `maven-compiler-plugin` 来完成。在下一个代码段中，我们引入了两个独立的\
  \ `<execution>` 步骤——一个用于针对 JDK 8 编译基础代码，第二个阶段用于针对 JDK 11 编译对应版本的代码。\n\n注意：我们编译时使用的\
  \ JDK 版本至少要与你针对的最新版本一样。然而，我们将显式地指示某些构建步骤针对比编译器能力更低的版本。\n\n```xml\n <plugins>\n \
  \   <plugin>\n      <groupId>org.apache.maven.plugins</groupId>\n      <artifactId>maven-compiler-plugin</artifactId>\n\
  \      <version>3.8.1</version>\n      <executions>\n        <execution>\n     \
  \     <id>compile-java-8</id>                     ❶\n          <goals>\n       \
  \     <goal>compile</goal>\n          </goals>\n          <configuration>\n    \
  \        <source>1.8</source>                      ❷\n            <target>1.8</target>\n\
  \          </configuration>\n        </execution>\n        <execution>\n       \
  \   <id>compile-java-11</id>                    ❸\n          <phase>compile</phase>\n\
  \          <goals>\n            <goal>compile</goal>\n          </goals>\n     \
  \     <configuration>\n            <compileSourceRoots>                      ❹\n\
  \              <compileSourceRoot>\n                ${project.basedir}/versions/11/src\n\
  \              </compileSourceRoot>\n            </compileSourceRoots>\n       \
  \     <release>11</release>                     ❺\n            <multiReleaseOutput>\
  \                      ❺\n              true\n            </multiReleaseOutput>\n\
  \          </configuration>\n        </execution>\n      </executions>\n    </plugin>\n\
  \  </plugins>\n```\n\n❶ 针对 JDK 8 编译的执行步骤\n\n❷ 我们使用 JDK 11 进行编译，因此我们将此步骤的输出指向 JDK\
  \ 8。\n\n❸ 针对 JDK 11 的第二个执行步骤\n\n❹ 告诉 Maven 我们特定版本代码的备用位置\n\n❺ 设置 `release` 和 `multiReleaseOutput`\
  \ 告诉 Maven 该版本代码是为哪个 JDK 设计的，并要求将类放在输出中正确的多版本位置。\n\n这使得我们的 JAR 以正确的布局进行构建和打包。还有一个步骤，即将清单（manifest）标记为多版本。这在\
  \ `maven-jar-plugin` 中配置，如下所示，位于第 11.2.4 节中将应用程序 JAR 设置为可执行文件的附近：\n\n```xml\n <plugin>\n\
  \    <groupId>org.apache.maven.plugins</groupId>\n    <artifactId>maven-jar-plugin</artifactId>\n\
  \    <version>3.2.0</version>\n    <configuration>\n      <archive>\n        <manifest>\n\
  \          <addClasspath>true</addClasspath>\n          <mainClass>wgjd2ed.Main</mainClass>\n\
  \        </manifest>\n        <manifestEntries>                          ❶\n   \
  \       <Multi-Release>true</Multi-Release>\n        </manifestEntries>\n      </archive>\n\
  \    </configuration>\n  </plugin>\n```\n\n❶ 标记 JAR 为多版本的属性\n\n完成此后，我们可以针对不同的 JDK\
  \ 运行我们的代码并看到它按预期行为运行。在我们的示例应用中，JDK 8 的基础实现将输出额外的版本消息，如下所示，这样我们可以看到它正在工作：\n\n```bash\n\
  ~:mvn clean compile package\n[INFO] Scanning for projects...\n[INFO]\n[INFO] ----------------<\
  \ wgjd2ed:maven-multi-release >-------------------\n[INFO] Building maven-multi-release\
  \ 1.0-SNAPSHOT\n[INFO] ----------------------------[ jar ]-------------------------------\n\
  [INFO]\n[INFO] .... Lots of additional steps\n[INFO]\n[INFO] - maven-jar-plugin:3.2.0:jar\
  \ (default-jar) @ maven-multi-release -\n[INFO] Building jar: ~/target/maven-multi-release-1.0-SNAPSHOT.jar\n\
  [INFO] -------------------------------------------------------------\n[INFO] BUILD\
  \ SUCCESS\n[INFO] --------------------------------------------------------\n[INFO]\
  \ Total time:  1.83 s\n[INFO] Finished at: 2021-03-05T09:39:16Z\n[INFO] -------------------------------------------------------------\n\
  ```\n*(注：由于原文日志部分显示不全或存在重复，此处已根据标准 Maven 输出格式进行了对齐)*\n\n这样我们的 JAR 就以正确的布局构建并打包了。\n\
  \n\n\n\n注意：JDK 的模块系统是关于构建和运行时的访问控制，而不是打包。模块化库可以作为一个普通的 JAR 文件共享，只需包含额外的 `module-info.class`\
  \ 文件，以告诉模块化应用如何与其交互即可。\n\n现在我们已经有了一个模块化库，让我们构建一个模块化应用来使用它吧。\n\n## 模块化应用\n\n我们的模块化应用的布局与我们为库使用的布局相似，如下所示：\n\
  \n```\n.\n├── pom.xml\n└── src\n     └── com.wellgrounded.modapp\n          └──\
  \ java\n               ├── com\n               │   └── wellgrounded\n          \
  \     │           └── Main.java\n               └── module-info.java\n```\n\n应用程序的\
  \ `module-info.java` 声明了我们的名称，并说明我们需要库导出的包，如下：\n\n```\nmodule com.wellgrounded.modapp\
  \ {\n    requires com.wellgrounded.modlib;\n}\n```\n\n尽管如此，这本身并没有告诉 Maven 去哪里寻找我们的库\
  \ JAR，因此我们像这样将其作为一个普通的 `<dependency>` 包含进来：\n\n```\n<dependencies>\n    <dependency>\n\
  \      <groupId>com.wellgrounded</groupId>   ❶\n      <artifactId>modlib</artifactId>\n\
  \      <version>2.0</version>\n    </dependency>\n  </dependencies>\n```\n\n❶ 我们来自上一节的库，已安装到本地\
  \ Maven 仓库\n\n当我们编译并在随后运行时，将此依赖置于模块路径（module path）而不是类路径（classpath）是非常重要的。Maven\
  \ 如何做到这一点的？幸运的是，`maven-compiler-plugin` 的最新版本足够注意到：1) 我们的应用拥有 `module-info.java`，所以它是模块化的；2)\
  \ 依赖包含了 `module-info.class`，因此它也是一个模块。只要你使用的是较新版本的 `maven-compiler-plugin`（编写本文时\
  \ 3.8 版本效果非常好），Maven 就会为你处理好。\n\n我们的应用程序代码是完全正常的 Java 代码，我们可以按照预期方式使用模块化库的功能：\n\n\
  ```java\npackage com.wellgrounded.modapp;\n\nimport com.wellgrounded.modlib.visible.UseThis;\
  \   ❶\n\npublic class Main {\n  public static void main(String[] args) {\n    System.out.println(UseThis.getMessage());\
  \     ❷\n  }\n}\n```\n\n❶ 从模块中导入，就像从任何其他包一样。\n\n❷ 使用我们模块中的类来获取消息\n\n你可能记得我们在库中还有另一个没有提供访问权限的包。如果我们修改应用程序尝试引入那个包（如下），会发生什么：\n\
  \n```java\npackage com.wellgrounded.modapp;\n\nimport com.wellgrounded.modlib.visible.UseThis;\n\
  import com.wellgrounded.modlib.hidden.CantTouchThis;   ❶\n\npublic class Main {\n\
  \  public static void main(String[] args) {\n    System.out.println(UseThis.getMessage());\n\
  \  }\n}\n```\n\n❶ `com.wellgrounded.modlib.hidden` 未列在库的导出列表中。\n\n编译此代码将立即得到以下错误：\n\
  \n```\n[INFO] - maven-compiler-plugin:3.8.1:compile @ modapp ---\n  [INFO] Changes\
  \ detected - recompiling the module!\n  [INFO] Compiling 2 source files to /mod-app/target/classes\n\
  \  [INFO] -------------------------------------------------------------\n  [INFO]\
  \ COMPILATION ERROR :\n  [INFO] -------------------------------------------------------------\n\
  \  [ERROR]                                                                 ❶\n \
  \   src/com.wellgrounded.modapp/java/com/wellgrounded/Main.java:[4,31]\n      package\
  \ com.wellgrounded.modlib.hidden is not visible (package\n      com.wellgrounded.modlib.hidden\
  \ is declared in module\n      com.wellgrounded.modlib, which does not export it)\n\
  \n  [INFO] 1 error\n  [INFO] ------------------------------------------------------------\n\
  \  [INFO] BUILD FAILURE\n  [INFO] ------------------------------------------------------------\n\
  ```\n\n❶ `javac` 和模块系统甚至不会让我们尝试触碰未导出的内容！\n\n自 JDK 9 发布模块以来，Maven 的工具已经取得了巨大的进步。所有的标准场景都得到了很好的覆盖，且所需的额外配置极少。\n\
  \n在我们继续之前，让我们先做一个简短的插题。在整个章节中，`module-info.class` 经常作为 Maven 应该开始应用模块规则的信号。但模块是\
  \ JDK 中的一个可选性功能（opt-in），以保持与大量的非模块代码的兼容性。\n\n如果我们使用模块化库构建同一个应用，但该应用没有通过包含 `module-info.java`\
  \ 文件来标记自己使用模块，会发生什么？在这种情况下，库虽然是模块化的，但将通过类路径包含。这会将它与应用自身的代码一起放入未命名模块（unnamed module）中，我们在库中定义的所有访问限制实际上都被忽略了。补充录中包含了一个示例应用以及一个通过类路径使用我们库的模块化应用，这样你就可以更清楚地看到加入或退出模块是如何工作的。\n\
  \n到此，我们对 Maven 默认功能的介绍就结束了。但如果我们需要扩展系统，超出我们在网上能找到的海量插件范围，我们该怎么办？\n\n### 11.2.12\
  \ 编写 Maven 插件\n\n即使是 Maven 中最基本的默认设置也是作为插件提供的，当我们需要更多功能时，没有理由不写一个插件。正如我们所见，引用插件就像引入依赖库一样。\n\
  \n对于我们的示例，我们从 `pom.xml` 文件开始，这里有几处小的添加：\n\n```xml\n<project>\n  <modelVersion>4.0.0</modelVersion>\n\
  \n  <name>A Well-Grounded Maven Plugin</name>\n  <groupId>com.wellgrounded</groupId>\n\
  \  <artifactId>wellgrounded-maven-plugin</artifactId>\n  <packaging>maven-plugin</packaging>\
  \                               ❶\n  <version>1.0-SNAPSHOT</version>           \
  \                            ❷\n\n  <properties>\n    <project.build.sourceEncoding>UTF-8</project.build.sourceEncoding>\n\
  \    <maven.compiler.source>11</maven.compiler.source>\n    <maven.compiler.target>11</maven.compiler.target>\n\
  \  </properties>\n\n  <dependencies>                                           \
  \             ❸\n    <dependency>\n      <groupId>org.apache.maven</groupId>\n \
  \     <artifactId>maven-plugin-api</artifactId>\n      <version>3.0</version>\n\
  \    </dependency>\n\n    <dependency>\n      <groupId>org.apache.maven-plugin-tools</groupId>\n\
  \      <artifactId>maven-plugin-annotations</artifactId>\n      <version>3.4</version>\n\
  \      <scope>provided</scope>\n    </dependency>\n  </dependencies>\n</project>\n\
  ```\n\n❶ 让 Maven 知道我们想要构建插件包\n\n❷ `-SNAPSHOT` 是添加到尚未发布的库版本中的典型后缀。在引入库时会出现它，因为在请求依赖时必须指定完整的字符串，例如\
  \ `1.0-SNAPSHOT`。\n\n❸ 我们实现所需的 Maven 依赖\n\n这让我们准备好添加代码。在标准布局位置放置 Java 文件，我们实现了一个被称为\
  \ `Mojo` 的东西——实际上 Maven 目标（goal），如下：\n\n```java\npackage com.wellgrounded;\n\nimport\
  \ org.apache.maven.plugin.AbstractMojo;\nimport org.apache.maven.plugin.MojoExecutionException;\n\
  import org.apache.maven.plugins.annotations.Mojo;\n\n@Mojo(name = \"wellgrounded\"\
  )\npublic class WellGroundedMojo extends AbstractMojo\n{\n    public void execute()\
  \ throws MojoExecutionException\n    {\n        getLog().info(\"Extending Maven\
  \ for fun and profit.\");\n    }\n}\n```\n\n我们的类自自 `AbstractMojo`并通过 `@Mojo` 注解告诉\
  \ Maven 我们的目标名称。方法体处理我们想要的任何任务。在这种情况下，我们只是记录一些文本，但在此时你已经可以使用完整的 Java 语言和生态系统来实现你的目标。\n\
  \n\n\n\n\n要在另一个项目中测试该插件，我们需要对其执行 `mvn install`，这会将我们的 JAR 包放入本地缓存仓库中。一旦进入该仓库，我们就可以像在本章之前看到的其他所有“真实”插件一样，将插件引入到另一个项目中，如下所示：\n\
  \n```\n <build>\n    <plugins>\n      <plugin>\n        <groupId>com.wellgrounded</groupId>\
  \                  ❶\n        <artifactId>wellgrounded-maven-plugin</artifactId>\n\
  \        <version>1.0-SNAPSHOT</version>\n        <executions>\n          <execution>\
  \                                        ❷\n            <phase>compile</phase>\n\
  \            <goals>\n              <goal>wellgrounded</goal>\n            </goals>\n\
  \          </execution>\n        </executions>\n      </plugin>\n    </plugins>\n\
  \  </build>\n```\n\n❶ 通过 `groupId` 和 `artifactId` 引用插件坐标\n\n❷ 将我们的目标（goal）绑定到 `compile`\
  \ 阶段\n\n完成配置后，我们可以在编译时看到插件的运行情况，如下：\n\n```\n~: mvn compile\n  [INFO] Scanning for\
  \ projects...\n  [INFO]\n  [INFO] ------------------< com.wellgrounded:example >--------------\n\
  \  [INFO] Building example 1.0-SNAPSHOT\n  [INFO] ----------------------------[\
  \ jar ]-------------------------\n  [INFO]\n  [INFO] - maven-resources-plugin:2.6:resources\
  \ (default-resources) -\n  [INFO] Using 'UTF-8' encoding to copy filtered resources.\n\
  \  [INFO] skip non existing resourceDirectory /src/main/resources\n  [INFO]\n  [INFO]\
  \ --- maven-compiler-plugin:3.1:compile (default-compile)  ---\n  [INFO] Nothing\
  \ to compile - all classes are up to date\n  [INFO]\n  [INFO] --- wellgrounded-maven-plugin:1.0-SNAPSHOT:wellgrounded\
  \  ---\n  [INFO] Extending Maven for fun and profit.                           \
  \ ❶\n  [INFO] ------------------------------------------------------------\n  [INFO]\
  \ BUILD SUCCESS\n  [INFO] ------------------------------------------------------------\n\
  \  [INFO] Total time:  0.872 s\n  [INFO] Finished at: 2020-08-16T22:26:20+02:00\n\
  \  [INFO] ------------------------------------------------------------\n```\n\n\
  ❶ 我们的插件作为 `compile` 阶段的一部分运行\n\n值得注意的是，如果我们简单地包含插件而不使用 `<executions>` 元素，我们不会在项目的任何地方看到该插件。自定义插件必须通过\
  \ `pom.xml` 文件在生命周期中声明它们所需的阶段。\n\n了解生命周期以及哪些目标绑定到了哪些阶段可能会很困难，但幸的是有一个插件可以提供帮助。`buildplan-maven-plugin`\
  \ 可以让你的当前任务变得清晰。\n\n尽管它可以像其他插件一样被包含在 `pom.xml` 中，但避免重复的一种有效方法是将其放在用户的 `~/.m2/settings.xml`\
  \ 文件中，如下：\n\n```\n<settings xmlns=\"http://maven.apache.org/SETTINGS/1.0.0\"\n \
  \ xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\"\n  xsi:schemaLocation=\"\
  http://maven.apache.org/SETTINGS/1.0.0\n                      https://maven.apache.org/xsd/settings-1.0.0.xsd\"\
  >\n  <pluginGroups>\n    <pluginGroup>fr.jcgay.maven.plugins</pluginGroup>\n  </pluginGroups>\n\
  </settings>\n```\n\n一旦配置完成，你可以在任何使用 Maven 构建的项目中像这样调用它：\n\n```\n~: mvn buildplan:list\n\
  \n  [INFO] Scanning for projects...\n  [INFO]\n  [INFO] --------------------< com.wellgrounded:example\
  \ >-----------------\n  [INFO] Building example 1.0-SNAPSHOT\n  [INFO] ------------------------------[\
  \ jar ]----------------------------\n  [INFO]\n  [INFO] ---- buildplan-maven-plugin:1.3:list\
  \ (default-cli) @ example ----\n  [INFO] Build Plan for example:\n  ------------------------------------------------------------------------\n\
  \  PLUGIN               | PHASE           | ID                 | GOAL\n  ------------------------------------------------------------------------\n\
  \  jacoco-maven-plugin  | initialize      | default            | prep-agent\n  maven-compiler-plugin|\
  \ compile         | default-compile    | compile\n  maven-compiler-plugin| test-compile\
  \    | default-testCompile| testCompile\n  maven-surefire-plugin| test         \
  \   | default-test       | test\n  jacoco-maven-plugin  | test            | report\
  \             | report\n  maven-jar-plugin     | package         | default-jar \
  \       | jar\n  maven-failsafe-plugin| integration-test| default            | int-test\n\
  \  maven-failsafe-plugin| verify          | default            | verify\n  maven-install-plugin\
  \ | install         | default-install    | install\n  maven-deploy-plugin  | deploy\
  \          | default-deploy     | deploy\n  [INFO] -----------------------------------------------------------------\n\
  \  [INFO] BUILD SUCCESS\n  [INFO] -----------------------------------------------------------------\n\
  \  [INFO] Total time:  0.461 s\n  [INFO] Finished at: 2020-08-30T15:54:30+02:00\n\
  ```\n\n\n\n\n\n注意：建议你将 wrapper 的 `gradle` 和 `gradlew` 结果包含在源码控制中，但排除 `.gradle` 的本地缓存。\n\
  \n一旦提交了 wrapper，任何下载项目的人都可以获得版本正确的构建工具，而无需进行任何额外安装。\n\n### 11.3.2 任务 (Tasks)\n\n\
  Gradle 的核心概念是 `task`（任务）。任务定义了一个可以被调用的工作。任务可以依赖其他任务，可以通过脚本进行配置，并通过 Gradle 的插件系统添加。这些任务类似于\
  \ Maven 的目标（goals），但在概念上更像函数。它们具有定义良好的输入和输出，并且可以组合和链。。Maven 必须与构建生命周期的特定阶段相关，而 Gradle\
  \ 任务可以以你任何方便的方式进行调用和使用。\n\nGradle 提供了优秀的内省功能。其中关键的是 `./gradlew tasks` 元任务，它会列出你项目中当前可用的任务。在你声明任何内容之前，运行\
  \ `tasks` 就会显示以下任务列表：\n\n```\n~: ./gradlew tasks\n\n  > Task :tasks\n\n  ------------------------------------------------------------\n\
  \  可从根项目运行的任务\n  ------------------------------------------------------------\n\n\
  \  构建设置任务\n  -----------------\n  init - 初始化一个新的 Gradle 构建。\n  wrapper - 生成 Gradle\
  \ wrapper 文件。\n\n  帮助任务\n   ----------\n  buildEnvironment - 显示根项目中的所有构建脚本依赖。\n\
  \  components - 显示根项目产生的组件。\n  dependencies - 显示根项目中声明的所有依赖项。\n  dependencyInsight\
  \ - 显示根项目中依赖项的洞察。\n  dependentComponents - 显示根项目中的依赖组件。\n  help - 显示帮助信息。\n  model\
  \ - 显示根项目的配置模型。[孵化中]\n  outgoingVariants - 显示根项目的输出变体。\n  projects - 显示根项目的子项目。\n\
  \  properties - 显示根项目的属性。\n  tasks - 显示可从根项目运行的任务。\n```\n\n向任何任务提供 `--dry-run` 标志将显示\
  \ Gradle 本将运行的任务，而不会执行这些操作。这对于理解你的构建系统的流程或调试行为异常的插件或自定义任务非常有帮助。\n\n### 11.3.3 脚本中包含什么？\n\
  \nGradle 构建的核心是其 `buildscript`。这是 Gradle 和 Maven 之间的关键区别——不仅格式不同，整个哲学也不同。Maven 的\
  \ POM 文件基于 XML，而在 Gradle 中，构建脚本是一个用编程语言编写的可执行脚本——这通常被称为 `领域特定语言` 或 `DSL`。现代版本的 Gradle\
  \ 同时支持 Groovy 和 Kotlin。\n\n#### Groovy 与 Kotlin\n\nGradle 的 DSL 方法是从 Groovy 开始的。正如我们在第\
  \ 8 章简要接触它时学到的，Groovy 是 JVM 上的动态语言，它非常符合灵活和简洁构建脚本的目标。然而，从 Gradle 5.0 开始，另一个选项也可用了：Kotlin，我们在第\
  \ 9 章中详细介绍过它。\n\n注意，Kotlin 构建脚本使用扩展名 `.gradle.kts` 而不是 `.gradle`。\n\n这非常有意义，因为 Kotlin\
  \ 已是 Android 开发的主流语言，而 Gradle 正是该平台的官方构建工具。在你的项目的所有部分共享相同的语言可以是一个极大的简化因素。\n\n对于我们的用途来说，Kotlin\
  \ 也比 Groovy 更像 Java。\n\n### 11.3.4 使用插件 (Plugins)\n\n`base` 插件默认应用于每个 Gradle 项目中。它提供了如\
  \ `clean`、`build` 和 `assemble` 等基本任务。然而，它不知道如何编译 Java 代码或创建 JAR 文件。为了添加这些功能，我们使用其他插件。\n\
  \n```\nplugins {\n  base\n}\n```\n\n应用 `base` 插件会为你的项目添加多个任务。你可以通过运行 `./gradlew\
  \ tasks` 查看。\n\n### 11.3.5 构建 (Building)\n\n为了构建 Java 库，我们需要 `java-library` 插件。该插件基于\
  \ `base` 构建，并增加了对 Java 编译和打包的支持。\n\n```kotlin\nplugins {\n  `java-library`\n}\n\
  ```\n\n应用 `java-library` 插件后，Gradle 拥有了编译位于 `src/main/java` 中的 Java 源码的能力。Java 项目的标准目录结构如下：\n\
  \n```\nsrc\n └── main\n      └── java\n             └── com\n                  └──\
  \ wellgrounded\n                       └── AwesomeLib.java\n```\n\n运行 `./gradlew\
  \ assemble` 将编译代码并将其打包成位于 `build/libs` 目录下的 JAR 文件。\n\n\n\n\n一个普通的 JAR 包是一个很好的开始，但最终你想要运行一个应用程序。这需要更多的配置，但同样，这些组件默认都是可用的。\n\
  \n我们将更改插件，并告诉 Gradle 我们的应用程序的主类是什么。通过这段简短的代码片段，我们还能看到 Kotlin 带来的几个非常棒的特性：\n\n```\n\
  plugins {                                                 ❶\n  application     \
  \                                        ❷\n}\n\napplication {\n  mainClass.set(\"\
  wgjd.Main\")\n}\n\ntasks.jar {                                               ❸\n\
  \  manifest {\n    attributes(\"Main-Class\" to application.mainClass)     ❹\n \
  \ }\n}\n```\n\n❶ 当最后一个参数是 lambda 表达式时，Kotlin 允许省略括号。\n\n❷ 知道如何编译和运行 Java 程序的插件。\n\
  \n❸ 用于构建修改后的清单（manifest）的 JAR 包的任务。\n\n❹ Kotlin 使用 `to` 语法在原地声明一个哈希映射（也称为哈希字面量）。\n\
  \n使用 `./gradlew build` 进行构建会得到与之前相同的 JAR 输出，但如果我们执行 `java -jar build/libs/wellgrounded.jar`，我们的测试程序将会运行。或者，`application`\
  \ 插件还支持 `./gradlew run`，直接为你加载并执行你的主类。\n\n注意：`application` 插件只需要设置 `mainClass`，但排除\
  \ `tasks.jar` 配置将产生一个 `./gradlew run` 知道如何启动但 `java -jar` 无法启动的 JAR。绝对不建议这样做！\n\n\
  我们现在有了所需的组件，来检查 Gradle 的另一个关键特性：它避免重复工作并减少构建时间的能力。\n\n### 11.3.6 工作避免\n\n为了尽可能快速运行构建，Gradle\
  \ 尝试避免重复不必要的工作。策略之一是增量构建。Gradle 中的每个任务都声明了它的输入和输出。Gradle 使用这些信息来检查自上次构建以来是否有任何变化。如果没有变化，Gradle\
  \ 将跳过该任务并重用上一次构建的输出。\n\n注意：在使用 Gradle 时，你不应该经常运行 `clean`，因为 Gradle 会确保执行必要的——且仅必要的——工作来生成构建结果。\n\
  \n我们可以通过查看完整运行一次（强制 clean）和第二次运行后的构建时间来观察到这一点，如下所示：\n\n```\n~: ./gradlew clean build\n\
  \n  BUILD SUCCESSFUL in 2s\n  13 actionable tasks: 13 executed\n\n  ~: ./gradlew\
  \ build\n\n  BUILD SUCCESSFUL in 804ms\n  12 actionable tasks: 12 up-to-date\n```\n\
  \n增量构建只能重用在该计算机上相同位置的任务上一次执行的输出。Gradle 的做得更好：构建缓存（Build Cache）允许重用来自任何更早构建——甚至是在其他地方运行的构建的任务输出。\n\
  \n你可以通过 `--build-cache` 命令行标志属性在项目中启用此功能。我们可以看到即使是随后的 `clean` 构建也更快，因为它可以重用之前执行的缓存输出：\n\
  \n```\n~: ./gradlew clean build --build-cache\n\n  BUILD SUCCESSFUL in 2s\n  13\
  \ actionable tasks: 13 executed\n\n  ~: ./gradlew clean build --build-cache\n\n\
  \  BUILD SUCCESSFUL in 1s\n  13 actionable tasks: 6 executed, 7 from cache\n```\n\
  \n性能是 Gradle 的一个关键特性，即使随着代码规模增长也能保持项目构建时间的缩短。还有其他我们没有时间涵盖的能力，例如增量 Java 编译、Gradle\
  \ Daemon（守护进程）以及并行任务和测试执行。\n\n人不是孤岛。同样，很少有应用程序可以在引入其他库依赖的情况下运行得远。这是 Gradle 中的一个主要课题，也是与\
  \ Maven 有很大区别的一点。\n\n### 11.3.7 Gradle 中的依赖\n\n要引入依赖，我们必须首先告诉 Gradle 可以从哪些仓库下载。这里有\
  \ `mavenCentral`（下所示）和 `google` 的内置函数。你可以使用更详细的 API 来配置其他仓库，包括自己的私有实例：\n\n```\n\
  repositories {\n  mavenCentral()\n}\n```\n\n然后我们后可以通过 Maven 流行的标准坐标格式引入依赖。就像 Maven\
  \ 使用 `<scope>` 元素来控制给定依赖的使用位置一样，Gradle 通过*依赖配置*（dependency configurations）来表达这一点。每个配置都跟踪一组特定的依赖。你的插件定义了哪些配置是可用的，你通过函数调用向配置的列表添加项。例如，为了拉取\
  \ SLF4J 库 ([`www.slf4j.org/`](http://www.slf4j.org/)) 来帮助日志，我们将使用以下配置：\n\n```\n\
  dependencies {\n    implementation(\"org.slf4j:slf4j-api:1.7.30\")\n    runtimeOnly(\"\
  org.slf4j:slf4j-simple:1.7.30\")\n  }\n```\n\n在这个示例中，我们的代码直接调用了 `slf4j-api` 中的类和方法，因此它通过\
  \ `implementation` 配置包含。这使得它在编译和运行应用程序期间可用。不过，我们的应用程序永远不直接调用 `slf4j-simple` 中的方法——那完全通过\
  \ `slf4j-api` 完成的——因此将 `slf4j-simple` 请求为 `runtimeOnly` 可以确保代码在编译期间不可用，防止我们误用该库。这达到了与\
  \ Maven 中依赖的 `<scope>` 元素相同的目的。\n\n我们直接使用的依赖与仅在运行时类路径中需要的依赖之间的区别并不是区分依赖差异的唯一方法。对于库作者来说，我们使用的库与作为公共\
  \ API 的库之间也存在区别。如果一个依赖是公共 API 的一部分，我们可以用 `api` 标记它。在以下示例中，我们声明 Guava 是公共 API 的一部分：\n\
  \n```\ndependencies {\n    api(\"com.google.guava:guava:31.0-jre\")\n}\n```\n\n\
  配置可以像派生基类一样相互扩展。Gradle 在许多区域应用了此特性。例如在创建类路径时，Gradle 使用 `compileClasspath` 和 `runtimeClasspath`，后者扩展了\
  \ `implementation`。你不应该直接向 `Classpath` 配置添加项——我们添加到基础配置的依赖构建了最终的类路径，如图 11.6 所示。\n\
  \n图 11.6 Gradle 配置的层级结构\n\n表 11.1 显示了使用带 Gradle Java 插件的一些主要配置，以及每个配置扩展的其他配置指示。完整列表可以在\
  \ Java 插件文档 [`mng.bz/445B`](http://mng.bz/445B) 中找到。\n\n注意 Gradle 7 移除许多长期弃用的配置，例如\
  \ `compile` 和 `runtime`。如果你在网上阅读，可能仍然发现对这些内容的引用，但应该迁移到新的选项：`implementation`（或 `api`）和\
  \ `runtimeOnly`。\n\n表 11.1 典型的 Gradle 依赖配置\n\n| 名称 | 目的 | 扩展 |\n| --- | --- | ---\
  \ |\n| `api` | 作为项目外部公共 API 部分的主要依赖 | |\n| `implementation` | 编译和运行期间使用的依赖 | |\n\
  | `compileOnly` | 仅编译期间需要的依赖 | |\n| `compileClasspath` | Gradle 用于查找编译类路径的配置 | `compileOnly`,\
  \ `implementation` |\n| `runtimeOnly` | 仅运行时需要的依赖 | |\n| `runtimeClasspath` | Gradle\
  \ 用于查找运行时类路径的配置 | `runtimeOnly`, `implementation` |\n| `testImplementation` | 编译和运行测试期间使用的依赖\
  \ | `implementation` |\n| `testCompileOnly` | 仅编译测试期间需要的依赖 | |\n| `testCompileClasspath`\
  \ | Gradle 用于查找测试编译类路径的配置 | `testCompileOnly`, `testImplementation` |\n| `testRuntimeOnly`\
  \ | 仅运行时需要的依赖 | `runtimeOnly` |\n\n\n\n\n| `testRuntimeClasspath` | Gradle 用于查找测试运行时类路径的配置\
  \ | `testRuntimeOnly`, `testImplementation` |\n\n| `archives` | 项目输出的 JAR 列表 | \
  \ |\n\n与 Maven 类似，Gradle 使用包信息来创建传递依赖树。然而，Gradle 处理版本冲突的默认算法与 Maven 的“根节点最近优先”策略不同。在解析时，Gradle\
  \ 会遍历整个依赖树，以确定任何给定包的所有请求版本。从所有请求的版本集中，Gradle 默认选择 `highest`（最高）可用版本。\n\n这种方法避免了\
  \ Maven 方法中的某些意外行为——例如，包的顺序或深度的变化可能会导致不同的解析结果。Gradle 还可以使用额外信息（如富丰富的版本约束）来定制解析过程。更进一步，如果\
  \ Gradle 无法满足定义的约束，它将带有清晰的错误失败构建，而不是选择一个可能问题的版本。\n\n鉴于此，Gradle 提供了丰富的 API 来覆盖并控制其解析行为。它还内置了强大的检查工具，在出现问题时进行溯源。当传递依赖问题出现时，一个关键命令是\
  \ `./gradlew dependencies`，如下所示：\n\n```\n~: ./gradlew dependencies\n\ntestImplementation\
  \ - 编译 'test' 的实现依赖\n\\--- org.junit.jupiter:junit-jupiter-api:5.8.1 (n)\n\n...\
  \ 其他配置已跳过\n\ntestRuntimeClasspath - 编译 'test' 的运行时类路径\n+--- org.junit.jupiter:junit-jupiter-api:5.8.1\n\
  |    +--- org.junit:junit-bom:5.8.1\n|    |    +--- org.junit.jupiter:junit-jupiter-api:5.8.1\
  \ (c)\n|    |    +--- org.junit.jupiter:junit-jupiter-engine:5.8.1 (c)\n|    | \
  \   +--- org.junit.platform:junit-platform-commons:1.8.1 (c)\n|    |    \\--- org.junit.platform:junit-platform-engine:1.8.1\
  \ (c)\n|    +--- org.opentest4j:opentest4j:1.2.0\n|    \\--- org.junit.platform:junit-platform-commons:1.8.1\n\
  |         \\--- org.junit:junit-bom:5.8.1 (*)\n\\--- org.junit.jupiter:junit-jupiter-engine:5.8.1\n\
  \     +--- org.junit:junit-bom:5.8.1 (*)\n     +--- org.junit.platform:junit-platform-engine:1.8.1\n\
  \     |    +--- org.junit:junit-bom:5.8.1 (*)\n     |    +--- org.opentest4j:opentest4j:1.2.0\n\
  \     |    \\--- org.junit.platform:junit-platform-commons:1.8.1 (*)\n     \\---\
  \ org.junit.jupiter:junit-jupiter-api:5.8.1 (*)\n\ntestRuntimeOnly - 编译 'test' 的仅运行时依赖\n\
  \\--- org.junit.jupiter:junit-jupiter-engine:5.8.1 (n)\n```\n\n在大型项目中，此输出可能会让人无从下手，因此\
  \ `dependencyInsight` 可以让你像这样关注你关心的特定依赖：\n\n```\n~: ./gradlew dependencyInsight\
  \ \\\n       --configuration testRuntimeClasspath \\\n       --dependency junit-jupiter-api\n\
  \n> Task :dependencyInsight\norg.junit.jupiter:junit-jupiter-api:5.8.1 (by constraint)\n\
  \   variant \"runtimeElements\" [\n      org.gradle.category                 = library\n\
  \      org.gradle.dependency.bundling      = external\n      org.gradle.jvm.version\
  \              = 8 (compatible with: 11)\n      org.gradle.libraryelements     \
  \     = jar\n      org.gradle.usage                    = java-runtime\n      org.jetbrains.kotlin.localToProject\
  \ = public (not requested)\n      org.jetbrains.kotlin.platform.type  = jvm\n  \
  \    org.gradle.status                   = release (not requested)\n   ]\n\norg.junit.jupiter:junit-jupiter-api:5.8.1\n\
  +--- testRuntimeClasspath\n+--- org.junit:junit-bom:5.8.1\n|    +--- org.junit.platform:junit-platform-engine:1.8.1\n\
  |    |    +--- org.junit:junit-bom:5.8.1 (*)\n|    |    \\--- org.junit.jupiter:junit-jupiter-engine:5.8.1\n\
  |    |         +--- testRuntimeClasspath\n|    |         \\--- org.junit:junit-bom:5.8.1\
  \ (*)\n|    +--- org.junit.platform:junit-platform-commons:1.8.1\n|    |    +---\
  \ org.junit.platform:junit-platform-engine:1.8.1 (*)\n|    |    +--- org.junit:junit-bom:5.8.1\
  \ (*)\n|    |    \\--- org.junit.jupiter:junit-jupiter-api:5.8.1 (*)\n|    +---\
  \ org.junit.jupiter:junit-jupiter-engine:5.8.1 (*)\n|    \\--- org.junit.jupiter:junit-jupiter-api:5.8.1\
  \ (*)\n\\--- org.junit.jupiter:junit-jupiter-engine:5.8.1 (*)\n\n(*) - 依赖已省略（之前已列出）\n\
  ```\n\n\n\n\n```\n.\n├── build.gradle.kts\n├── gradle\n│      └── wrapper\n│   \
  \           ├── gradle-wrapper.jar\n│              └── gradle-wrapper.properties\n\
  ├── gradlew\n├── gradlew.bat\n├── settings.gradle.kts\n└── src\n     ├── main\n\
  \     │      ├── java\n     │      │      └── com\n     │      │              └──\
  \ wellgrounded\n     │      │                      └── Main.java\n     │      └──\
  \ kotlin                                ❶\n     │              └── com\n     │ \
  \                     └── wellgrounded\n     │                                 \
  \              └── MessageFromKotlin.kt\n     └── test\n          └── java\n   \
  \            └── com\n                    └── wellgrounded\n                   \
  \      └── MainTest.java\n```\n\n❶ 我们额外的 Kotlin 代码出现在 `kotlin` 子目录下。\n\n我们在 `build.gradle.kts`\
  \ 中通过 Gradle 插件启用了 Kotlin 支持：\n\n```\n plugins {\n     application\n     id(\"org.jetbrains.kotlin.jvm\"\
  ) version \"1.6.10\"\n  }\n```\n\n就这些了。由于 Gradle 的灵活性，该插件能够更改构建顺序并添加必要的 `kotlin-stdlib`\
  \ 依赖，而无需我们采取额外的步骤。\n\n### 11.3.9 测试\n\n我们首先讨论的 `assemble` 任务将编译并打包你的主代码，但我们还需要编译并运行测试。`build`\
  \ 任务默认配置就是为此的，所示：\n\n```\n./gradlew build --dry-run\n  :compileJava SKIPPED\n  :processResources\
  \ SKIPPED\n  :classes SKIPPED\n  :jar SKIPPED\n  :assemble SKIPPED\n  :compileTestJava\
  \ SKIPPED\n  :processTestResources SKIPPED\n  :testClasses SKIPPED\n  :test SKIPPED\n\
  \  :check SKIPPED\n  :build SKIPPED\n```\n\n我们将按照如下标准位置添加一个测试用例：\n\n```\nsrc\n \
  \ └── test\n       └── java\n            └── com\n                 └── wellgrounded\n\
  \                      └── MainTest.java\n```\n\n接下来，我们需要将测试框架添加到正确的依赖配置中，以便我们的代码可以使用它。我们还让\
  \ Gradle 知道在运行测试任务时应该使用 `JUnit`，如下所示：\n\n```\ndependencies {\n  ....\n  testImplementation(\"\
  org.junit.jupiter:junit-jupiter-api:5.8.1\")\n  testRuntimeOnly(\"org.junit.jupiter:junit-jupiter-engine:5.8.1\"\
  )\n}\n\ntasks.named<Test>(\"test\") {\n  useJUnitPlatform()\n}\n```\n\n`testImplementation`\
  \ 配置使得构建和执行测试（而非主）代码时可以使用 `org.junit.jupiter`。当我们下次运行 `./gradlew build` 时，你会发现如果该库不存在，它将下载到我们的本地缓存中。\n\
  \n包含 HTML 报告在内的完整列表生成在 `build/reports/test` 下。\n\n### 11.3.10 自动化静态分析\n\n构建是添加保护项目功能的好地方。除了单元测试之外的一种检查类型是静态分析。该类别中有许多工具，但\
  \ SpotBugs ([`spotbugs.github.io/`](https://spotbugs.github.io/))（FindBugs 的继者）是一个很容易上手的工具。注意，大多数此类工具都有\
  \ Maven 和 Gradle 插件，因此这里展示的方法只是为了让你了解一下可能性：\n\n```\n plugins {\n    application\n\
  \    id(\"com.github.spotbugs\") version \"4.3.0\"\n  }\n```\n\n如果我们故意在代码中引入一个问题（例如，在类中实现实现\
  \ `equals` 但没有同时重写 `hashCode`），典型的 `./gradlew check` 将告诉我们存在问题，如下所示：\n\n```\n~:./gradlew\
  \ check\n\n  > Task :spotbugsTest FAILED\n\n  FAILURE: Build failed with an exception.\n\
  \n  * What went wrong:\n  Execution failed for task ':spotbugsTest'.\n  > A failure\
  \ occurred while executing SpotBugsRunnerForWorker\n     > Verification failed:\
  \ SpotBugs violation found:\n       2\\. SpotBugs report can be found in build/reports/spotbugs/test.xml\n\
  \n  * Try:\n  Run with --stacktrace option to get the stack trace.\n  Run with --info\
  \ or --debug option to get more log output.\n  Run with --scan to get full insights.\n\
  \n  * Get more help at https://help.gradle.org\n\n  BUILD FAILED in 1s\n  5 actionable\
  \ tasks: 3 executed, 2 up-to-date\n```\n\n与单元测试失败一样，报告文件位于 `build/reports/spotbugs`。默认情况下，SpotBugs\
  \ 可能只生成一个 XML 文件，虽然这对计算机很有用，但对大多数人来说用处不大。我们可以如下所示配置插件为我们输出 HTML：\n\n```\ntasks.withType<com.github.spotbugs.snom.SpotBugsTask>()\
  \    ❶\n  .configureEach {                                         ❷\n    reports.create(\"\
  html\") {                               ❸\n      isEnabled = true\n      setStylesheet(\"\
  fancy-hist.xsl\")\n    }\n}\n```\n\n❶ `tasks.withType` 以类型安全的方式为我们查找任务。\n\n❷ `configureEach`\
  \ 运行该块，就像我们编写了 `tasks.spotbugsMain { }` 然后是 `tasks.spotbugsTest { }` 并使用相同的代码。\n\
  \n❸ 剩余的配置来自项目的 README。\n\n### 11.3.12 在模块中使用 Gradle\n\n像 Maven 一样，Gradle 完全支持模块系统。让我们分解在使用模块项目时需要更改的内容。\n\
  \n#### 模块化库\n\n模块化库通常有两个主要区别：`src` 下的目录从 `main` 变为模块名称，并在根目录下添加了 `module-info.java`\
  \ 文件，所示：\n\n```\n.\n├── build.gradle.kts\n├── gradle\n│      └── wrapper\n│    \
  \          ├── gradle-wrapper.jar\n│              └── gradle-wrapper.properties\n\
  ├── gradlew\n├── gradlew.bat\n├── settings.gradle.kts\n└── src\n     └── com.wellgrounded.modlib\
  \                    ❶\n          └── java\n               ├── com\n           \
  \    │    wellgrounded\n               │       ├── hidden                      ❷\n\
  \               │       │      CantTouchThis.java\n               │       └── visible\
  \                     ❸\n               │               └── UseThis.java\n     \
  \          └── module-info.java                 ❹\n```\n\n❶ 与我们的模块对应的目录名称\n\n❷ 我们打算隐藏此包。\n\
  \n❸ 此包将导出供外部使用。\n\n❹ 模块的 `module-info.java` 定义\n\nGradle 不会自动找到我们更改的源位置，因此我们需要在\
  \ `build.gradle.kts` 中给它一个提示，去哪里查找：\n\n```\nsourceSets {\n  main {\n    java {\n\
  \      setSrcDirs(listOf(\"src/com.wellgrounded.modlib/java\"))\n    }\n  }\n}\n\
  ```\n\n`module-info.java` 文件包含了我们在本章和第 2 章中之前看到的典型声明。我们将模块模块命名并选择一个（而不是全部）包进行导出，如下所示：\n\
  \n```\nmodule com.wellgrounded.modlib {\n    exports com.wellgrounded.modlib.visible;\n\
  }\n```\n\n这就是使我们的库可以作为模块消费所需的全部内容。接下来我们将从模块化应用中使用该库。\n\n\n\n\n\n一个模块化应用\n\n当我们着手在\
  \ Maven 下测试我们的模块化应用时，将创建的库共享给应用的最简单方法是将其安装到本地 Maven 仓库。Gradle 也可以通过 `maven-publish`\
  \ 插件支持此操作，但我们还有另一个值得理解其机制的选项。\n\n我们的模块化应用具有如下所示的标准布局。为了方便测试，我们将确保顶层目录彼此相邻：\n\n```\n\
  mod-lib                                              ❶\n└── ...\n\nmod-app\n├──\
  \ build.gradle.kts\n├── gradle\n│      └── wrapper\n│              ├── gradle-wrapper.jar\n\
  │              └── gradle-wrapper.properties\n├── gradlew\n├── gradlew.bat\n├──\
  \ settings.gradle.kts\n└── src\n     └── com.wellgrounded.modapp               \
  \      ❷\n          └── java\n               ├── com\n               |      └──\
  \ wellgrounded\n               |              └── Main.java\n               └──\
  \ module-info.java                  ❸\n```\n\n❶ `mod-lib` 库源码与我们的 `mod-app` 应用处于同一级。\n\
  \n❷ 目录名称与模块名称一致。\n\n❸ 我们使用 `module-info.java` 来声明这是一个模块化应用。\n\n我们的 `module-info.java`\
  \ 文件告知了我们的名称和模块需求，如下：\n\n```\nmodule com.wellgrounded.modapp {        ❶\n    requires\
  \ com.wellgrounded.modlib;   ❷\n}\n```\n\n❶ 我们的模块名称\n\n❷ 我们对库导出包的依赖\n\n为了测试本地库，我们目前不会安装它，而是在本地引用它，如下一个代码段所示。这可以在之前提供依赖项\
  \ GAV 坐标的地方使用 `files` 函数来实现。显然，当我们准备开始共享和部署时，这种方法将不起作用，但它是启动本地测试的快速手段：\n\n```\n\
  dependencies {\n  implementation(files(\"../mod-lib/build/libs/gradle-mod-lib.jar\"\
  ))\n}\n```\n\n接下来，当前版本的 Gradle 需要一个提示，告诉我们希望它检测哪些依赖是模块化的，以便正确地将它们放在模块路径（module path）而不是类路径（classpath）。这最终可能会成为默认，但在本文写作时（Gradle\
  \ 7.3），它仍然需要手动开启：\n\n```\njava {\n  modularity.inferModulePath.set(true)\n}\n```\n\
  \n最后也是最平凡的一点，和我们的库一样，我们需要按照如下让 Gradle 知道我们非 Maven 标准的文件位置：\n\n```\nsourceSets {\
  \ \n  main {\n    java {\n      setSrcDirs(listOf(\"src/com.wellgrounded.modapp/java\"\
  ))\n    }\n  }\n}\n```\n\n完成所有这些设置后，执行 `./gradlew build run` 将得到预期的结果。如果我们尝试使用库中未导出的包，我们将在编译时遇到错误，如下：\n\
  \n```\n> Task :compileJava FAILED\n/mod-app/src/com.wellgrounded.modapp/java/com/wellgrounded/Main.java:4:\n\
  error: package com.wellgrounded.modlib.hidden is not visible\n\nimport com.wellgrounded.modlib.hidden.CantTouchThis;\n\
  \                              ^\n  (package com.wellgrounded.modlib.hidden is declared\
  \ in module\n   com.wellgrounded.modlib, which does not export it)\n1 error\n```\n\
  \n# JLink\n\n我们在第 2 章中看到的模块解锁的一项能力是：为应用创建一个精简的运行环境，只包含它所需的依赖。这是可能的，因为模块系统为我们的代码使用了哪些模块提供了具体的保证，因此工具可以构建必要的、最小的模块集。\n\
  \n注意 `JLink` 只能与完全模块化的应用一起工作。如果应用仍然通过类路径加载某些代码，`JLink` 将无法成功创建安全、完整的镜像。\n\n这一功能通过\
  \ `jlink` 工具体现得明显。对于模块化应用，JLink 可以生成一个完全功能的 JVM 镜像，可以在无需系统安装的 JVM 的情况下运行。\n\n让我们回到第\
  \ 2 章中我们演示 JLink 的应用，看看 Gradle 插件是如何简化管理的。示例应用程序可在附件中找到，它使用 JDK 类附加到机器上所有运行的 JVM\
  \ 进程，并显示关于它们的各种信息。\n\n在我们要打包的模块化应用中，需要审查的重要部分是应用自身的 `module-info.java` 声明。如下所示，这些告诉我们\
  \ JLink 需要拉入哪些自定义镜像以使我们的构建工作：\n\n```\nmodule wgjd.discovery {\n  exports wgjd.discovery;\n\
  \n  requires java.instrument;\n  requires java.logging;\n  requires jdk.attach;\n\
  \  requires jdk.internal.jvmstat;   ❶\n}\n```\n\n❶ 红色警报：注意我们正在深入的 `jdk.internal`\
  \ 包！\n\n在我们开始使用 JLink 之前，从手动编译迁移到 Gradle 构建需要一些额外的配置。我们首先需要按照如下方式应用上一节中解释的相同模块化更改。但即使这些已就绪，我们也无法成功编译：\n\
  \n```\n~:./gradlew build\n\n> Task :compileJava FAILED\n/gradle-jlink/src/wgjd.discovery/wgjd/discovery/VMIntrospector.java:4:\n\
  error: package sun.jvmstat.monitor is not visible\n  import sun.jvmstat.monitor.MonitorException;\n\
  \                    ^\n  (package sun.jvmstat.monitor is declared in module\n \
  \  com.wellgrounded.modlib, which does not export it) -> 修正为：\n/gradle-jlink/src/wgjd.discovery/wgjd/discovery/VMIntrospector.java:4:\n\
  error: package sun.jvmstat.monitor is not visible\n  import sun.jvmstat.monitor.MonitorException;\n\
  \                    ^\n  (package sun.jvmstat.monitor is declared in module\n \
  \  jdk.internal.jvmstat, which does not export it)\n```\n*(注：原文错误信息中的模块名可能有差异，此处根据上下文逻辑翻译)*\n\
  ```\n/gradle-jlink/src/wgjd.discovery/wgjd/discovery/VMIntrospector.java:4:\nerror:\
  \ package sun.jvmstat.monitor is not visible\n  import sun.jvmstat.monitor.MonitorException;\n\
  \                    ^\n  (package sun.jvmstat.monitor is declared in module\n \
  \  jdk.internal.jvmstat, which does not export it)\n/gradle-jlink/src/wgjd.discovery/wgjd/discovery/VMIntrospector.java:5:\n\
  error: package sun.jvmstat.monitor is not visible\n  import sun.jvmstat.monitor.MonoredHost;\n\
  \                    ^\n  (package sun.jvmstat.monitor is declared in module\n \
  \  jdk.internal.jvmstat, which does not export it)\n/gradle-jlink/src/wgjd.discovery/wgjd/discovery/VMIntrospector.java:6:\n\
  error: package sun.jvmstat.monitor is not visible\n  import sun.jvmstat.monitor.MonoredUtil;\n\
  \                    ^\n  (package sun.jvmstat.monitor is declared in module\n \
  \  jdk.internal.jvmstat, which does not export it)\n/gradle-jlink/src/wgjd.discovery/wgjd/discovery/VMIntrospector.java:7:\n\
  error: package sun.jvmstat.monitor is not visible\n  import sun.jvmstat.monitor.VmIdentifier;\n\
  \                    ^\n  (package sun.jvmstat.monitor is declared in module\n \
  \  jdk.internal.jvmstat, which does not export it)\n\n4 errors\n\nFAILURE: Build\
  \ failed with an exception.\n```\n\n模块系统正在告诉我们，由于尝试使用 `jdk.internal` 中的类，我们正在违反规则。我们的模块\
  \ `wgjd.discovery` 不在 `jdk.internal.jvmstat` 的允许列表中。在了解规则和我们正在承担的风险后，可以使用 `--add-exports`\
  \ 将我们的模块强制列表中。这是通过编译器标志实现的，在我们的 Gradle 配置中如下：\n\n```java\ntasks.withType<JavaCompile>\
  \ {\n  options.compilerArgs = listOf(\n      \"--add-exports\",\n      \"jdk.internal.jvmstat/sun.jvmstat.monitor=wgjd.discovery\"\
  )\n}\n```\n\n至此，我们得到了干净的编译，并可以转向使用 JLink 进行打包。关注度最高的插件是 `org.beryx.jlink`，在文档中被称为“Badass\
  \ JLink Plugin)”。我们通过插件行将其添加到 Gradle 项目中。\n\n```kotlin\nplugins {\n  id(\"org.beryx.jlink\"\
  ) version(\"2.23.3\")   ❶\n}\n```\n\n❶ 该插件自动为我们应用应用，因此我们不需要重复该声明。\n\n添加之后，我们将在列表中看到\
  \ `jlink` 任务，可以直接运行它。结果将显示在 `build/image` 目录，如下：\n\n```\nbuild/image/\n├── bin\n\
  │      ├── gradle-jlink\n│      ├── gradle-jlink.bat\n│      ├── java\n│      └──\
  \ keytool\n├── conf\n│      └── ...各种配置文件\n├── include\n│      └── ... 需要的头文件\n\
  ├── legal\n│      └── ... 所有包含模块的许可和法律信息\n├── lib\n│      └── ... 镜像的库文件和依赖项\n└──\
  \ release\n```\n\n\n\n\n`build/image/bin/java` 是我们自定义的 JVM，它仅包含我们应用程序的模块依赖。你可以像在终端中运行普通的\
  \ `java` 命令一样运行它，如下：\n\n```\n~:build/image/bin/java -version\nopenjdk version \"\
  11.0.6\" 2020-01-14\nOpenJDK Runtime Environment AdoptOpenJDK (build 11.0.6+10)\n\
  OpenJDK 64-Bit Server VM AdoptOpenJDK (build 11.0.6+10, mixed mode)\n```\n\n我们可以将模块传递给\
  \ `build/image/bin/java` 来启动，但插件已经在 `build/image/bin/gradle-jlink` 处优雅地生成了一个启动脚本（以我们的项目命名，如下所示），我们可以直接使用它。不过，我们新生成的镜像并非一事完美：\n\
  \n```\n~:build/image/bin/gradle-jlink\n\nJava processes:\nPID    Display Name  \
  \  VM Version    Attachable\nException in thread \"main\" java.lang.IllegalAccessError:\n\
  \ class wgjd.discovery.VMIntrospector (in module wgjd.discovery) cannot\n   access\
  \ class sun.jvmstat.monitor.MonitorException (in module\n   jdk.internal.jvmstat)\
  \ because module jdk.internal.jvmstat does not\n   export sun.jvmstat.monitor to\
  \ module wgjd.discovery\n wgjd.discovery/wgjd.discovery.VMIntrospector.accept(VMIntrospector.java:19)\n\
  \ wgjd.discovery/wgjd.discovery.Discovery.main(Discovery.java:26)\n```\n\n这不是一个完全陌生的错误信息——它是之前通过编译器选项解决的相同访问问题的另一种形式。显然，我们需要在应用程序启动时也告知我们的“模块越径”需求。幸运的是，插件对运行\
  \ `jlink` 的参数以及为我们生成的脚本提供了详尽的配置，如下：\n\n```\njlink {\n  launcher{\n    jvmArgs =\
  \ listOf(\n                \"--add-exports\",\n                \"jdk.internal.jvmstat/sun.jvmstat.monitor=wgjd.discovery\"\
  )\n  }\n}\n```\n\n添加该配置后，启动脚本就能正常运行了：\n\n```\n~:build/image/bin/gradle-jlink\nJava\
  \ processes:\nPID    Display Name    VM Version    Attachable\n833 wgjd.discovery/wgjd.discovery.Discovery\
  \    11.0.6+10    true\n276 org.jetbrains.jps.cmdline.Launcher /Applications/IntelliJ\
  \ IDEA CE.app...\n```\n\n值得注意的是，我们在这里生成的镜像默认目标是运行 JLink 时的相同操作系统，如下一个代码示例所示。然而这并不是强制要求的——支持跨平台支持。首要要求是你拥有目标平台\
  \ JDK 安装所需的文件。这些文件可以从 [`adoptium.net/`](https://adoptium.net/) 等 Eclipse Adoptium\
  \ 网站等轻松获取：\n\n```\njlink {\n  targetPlatform(\"local\",\n                  System.getProperty(\"\
  java.home\"))    ❶\n  targetPlatform(\"linux-x64\",\n                  \"/linux_jdk-11.0.10+9\"\
  )             ❷\n\n  launcher{\n    jvmArgs = listOf(\n                \"--add-exports\"\
  ,\n                \"jdk.internal.jvmstat/sun.jvmstat.monitor=wgjd.discovery\")\n\
  \  }\n}\n```\n\n❶ 根据本地 JDK 构建镜像\n\n❷ 构建一个指向我们下载的 Linux JDK 的镜像\n\n一旦你开始针对特定平台，插件会在\
  \ `build/image` 结果中放置额外的目录。显然，你必须将这些结果带到匹配的系统中进行测试。\n\n在使用 JLink 时可能会遇到的最后一个障碍是它对**自动命名模块**的限制。虽然这种只需在\
  \ JAR 清单中添加一个名称即可获得参与模块化世界基本能力的功能对于迁移来说非常棒，但遗憾的是 JLink 不支持它。\n\n不过，Badass JLink\
  \ 插件可以为你解决后忧。它会将任何自动命名的模块重新封装为 JLink 可以消费的正式模块。文档（可在 [`mng.bz/XZ2Y`](http://mng.bz/XZ2Y)\
  \ 找到）对该功能提供了全面覆盖，取决于你的应用程序依赖，这可能是 JLink 能否正常工作的关键。\n\n### 11.3.13 定制\n\nGradle 最大的优势之一是其开放的活性。在不引入插件的情况下，它甚至没有构建生命周期的概念。你可以带有极少的限制添加任务并重新配置现有任务。你不需要在项目中保留一个带有随机工具的\
  \ `scripts` 目录——你的自定义需求可以直接集成到日常构建和测试工具中。\n\n#### 自定义任务\n\n可以直接像这样在 `build.gradle.kts`\
  \ 文件中定义自定义任务：\n\n```\n tasks.register(\"wellgrounded\") {\n    println(\"configuring\"\
  )\n    doLast {\n      println(\"Hello from Gradle\")\n    }\n  }\n```\n\n运行此将产生以下输出：\n\
  \n```\n~: ./gradlew wellgrounded\n  configuring...\n\n  > Task :wellgrounded\n \
  \ Hello from Gradle\n```\n\n`println(\"configuring\")` 这一行在任务设置期间执行，但 `doLast` 块的内容在任务实际运行时执行。我们可以通过对对任务进行干运行（dry-run）来确认这一点：\n\
  \n```\n~: ./gradlew wellgrounded --dry-run\n  configuring...\n  :wellgrounded SKIPPED\n\
  ```\n\n任务可以配置为依赖于其他任务，如下：\n\n```\n tasks.register(\"wellgrounded\") {\n    println(\"\
  configuring...\")\n    dependsOn(\"assemble\")\n    doLast {\n      println(\"Hello\
  \ from Gradle\")\n    }\n  }\n```\n\n这种技术同样适用于你没有编写的任务——你可以像这样查找它们并添加你的任务作为依赖：\n\
  \n```\n tasks {\n    named<Task>(\"help\") {\n      dependsOn(\"wellgrounded\")\n\
  \    }\n  }\n~: ./gradlew help\n  configuring...\n\n  > Task :wellgrounded\n  Hello\
  \ from Gradle\n\n  > Task :help\n\n  Welcome to Gradle 7.3.3.\n\n  To run a build,\
  \ run gradlew <task> ...\n\n  To see a list of available tasks, run gradlew tasks\n\
  \n  To see more detail about a task, run gradlew help --task <task>\n\n  To see\
  \ a list of command-line options, run gradlew --help\n\n  For more detail on using\
  \ Gradle, see\n    https://docs.gradle.org/7.3.3/userguide/command_line_interface.html\n\
  \n  For troubleshooting, visit https://help.gradle.org\n```\n\n直接在构建文件中编写自定义任务是非常强大的。然而，将它们放在\
  \ `build.gradle.kts` 有相当严重的局限性：它们无法在项目之间轻松共享，而且很难针对它们编写自动化测试。Gradle 插件正是为了解决这些问题而生的。\n\
  \n#### 创建自定义插件\n\nGradle 插件是用 JVM 代码实现的。它们可以直接作为源文件提供在你的项目中，也可以作为库引入。许多插件是用 Groovy\
  \ 编写的（Gradle 支持的原始脚本语言），但你可以使用任何 JVM 语言来编写。为了最大的兼容性并尽量减少特定语言习惯引起的问题，如果你计划共享你的插件，用\
  \ Java 编写是一个好主意。\n\n插件可以直接直接在构建脚本中编写，我们将使用该技术演示主要的 API。当你准备好共享时，可以将代码提取到独立的项目中。以下是之前\
  \ `wellgrounded` 任务的等效实现：\n\n```\n class WellgroundedPlugin : Plugin<Project> {\
  \   ❶\n      override fun apply(project: Project) {\n          project.task(\"wellgrounded\"\
  ) {           ❷\n              doLast {\n                  println(\"Hello from\
  \ Gradle\")\n              }\n          }\n      }\n  }\n\n  apply<WellgroundedPlugin>()\
  \                      ❸\n```\n\n❶ 继承 Plugin\n\n❷ 使用熟悉的项目级 API 和任务实现\n\n❸ 使用 apply\
  \ 来实际使用插件——它不像我们之前的任务定义那样自动调用。\n\n除了共享，将任务编写为插件允许我们有更能力来定制配置。代表我们 `Project` 的标准\
  \ Gradle 对象有一个特定的位置，插件配置存储在 `extensions` 属性下。我们可以通过自己的 `Extension` 对象向这些扩展添加内容，如下：\n\
  \n\n\n\n\n```\n open class WellgroundedExtensions {\n    var count: Int = 1\n  }\n\
  \n  class WellgroundedPlugin : Plugin<Project> {\n    override fun apply(proj: Project)\
  \ {\n      val extensions = proj.extensions\n      val ext = extensions.create<WellgroundedExtensions>(\"\
  wellgrounded\")\n      proj.task(\"wellgrounded\") {\n        doLast {\n       \
  \   repeat(ext.count) {\n            println(\"Hello from Gradle\")\n          }\n\
  \        }\n      }\n    }\n  }\n\n  apply<WellgroundedPlugin>()\n\n  configure<WellgroundedExtensions>\
  \ {\n    count = 4\n  }\n```\n\n我们编程语言的所有功能在我们的插件中可用。\n\n如果你将一个插件提取到另一个库，你可以通过之前看到的包含\
  \ `SpotBugs` 插件的相同机制将其包含在构建中，如下所示：\n\n```\n plugins {\n    id(\"com.wellgrounded.gradle\"\
  ) version \"1000.0\"\n  }\n\n  apply<WellgroundedPlugin>()\n\n  configure<WellgroundedExtensions>\
  \ {\n    count = 4\n  }\n```\n\n## 总结\n\n- 构建工具是现实世界中构建 Java 软件的核心。它们自动化了繁琐的操作，帮助管理依赖，确保开发者工作的一致性，并且关键的是，确保在不同机器上构建的同一个项目获得相同的结果。\n\
  -   `Maven` 和 `Gradle` 是 Java 生态中最常用的两种构建工具，大多数任务可以在其中任何一个中完成。\n    - `Maven` 采用通过\
  \ XML 配置结合用 JVM 代码编写的插件的方法。\n    - `Gradle` 提供了一种使用实际编程语言（`Kotlin` 或 `Groovy`）的声明式构建语言，为简单情况提供了简洁的构建逻辑，并为复杂用例提供了灵活性。\n\
  - 无论使用何种构建工具，处理依赖冲突都是一个大话题。`Maven` 和 `Gradle` 都提供了处理冲突库版本的方法。`Gradle` 提供了许多更高级的功能来处理常见的依赖管理问题。\n\
  -   `Gradle` 提供了工作规避功能，例如增量构建，从而实现了更快的构建。\n-   如第 2 章所示，模块需要对我们的构建脚本和源代码布局进行一些更改，但这些都得到了工具的良好支持。\n\
  \n# 12 在容器中运行 Java\n\n本章涵盖：\n\n- 为什么容器驱动的开发对于资深 Java 开发者至关重要\n- 操作系统、`VM`、容器和编排之间的区别\n\
  -   `Docker`\n-   `Kubernetes`\n- 在容器中运行 Java 工作负载的实践指南\n- 容器中的性能和可观测性\n\n`Docker`\
  \ ([`www.docker.com/`](https://www.docker.com/)) 容器已成为部署 Java 应用的事实标准，而 `Kubernetes`\
  \ ([`kubernetes.io/`](https://kubernetes.io/)) (`k8s`) 是编排这些容器的最流行的选项。特别是如果你部署到任何主要的云服务提供商，你将了解这些技术，更重要的是\
  \ Java 在这些技术上的表现。\n\n**注意**：尽管存在其他容器和容器编排技术，但 `Docker` 和 `Kubernetes` 分别主导了容器和编排市场。\n\
  \n## 12.1 为什么容器对资深开发者很重要\n\n为了更好地理解什么是容器以及为什么它们对资深 Java 开发者很重要，我们将查看以下内容：\n\n- 主机操作系统、虚拟机与容器的对比\n\
  - 容器的优点\n- 容器的缺点\n\n### 12.1.1 主机操作系统 vs. 虚拟机 vs 容器\n\n从计算早期开始，我们就在软件与其运行的硬件之间引入了抽象层。容器是这一演进过程中的自然步骤。让我们简要浏览这些层，看看容器是如何融入的。\n\
  \n#### 裸机\n\n让我们从最基础的开始——没有安装主机操作系统的“裸机”（`bare metal machine`）。这台裸机代表了可能安装在其上的任何软件的一组有限资源，包括\
  \ `CPU`、`RAM`、硬盘、网络等。\n\n**注意**：这种有限资源的概念是必须牢在脑中的。开发者经常被欺骗，认为容器以某种方式给了他们魔法般的无限资源！\n\
  \n始终记住，在主机操作系统、`虚拟机`或容器之下，是具有`有限资源`的裸机。\n\n#### 主机操作系统或第 1 型虚拟机程序\n\n在现代数据中心中，裸机安装了主机操作系统（例如\
  \ `Linux`）或`第 1 型虚拟机程序`（例如 `VMWare ESXi`、`Microsoft Hyper-V`）。`Hypervisor`（虚拟机程序）是用于创建和管理虚拟机的软件的术语。`Hypervisors`\
  \ 可以存在于栈的多个层。`第 1 型虚拟机程序`安装在裸机上，作为一个轻量级操作系统，将机器的大部分资源分配给它运行的虚拟机。\n\n无论运行传统的操作系统还是虚拟机程序，这一层通常是轻量级的，所做的无多只是维护安全保障，并允许在上方安装更高层级的抽象。尽管如此，主机操作系统确实需要一些\
  \ `CPU`、`RAM` 和网络来运行。\n\n#### 第 2 型虚拟机程序\n\n如果我们的裸机安装了如 `Linux` 等传统的操作系统，那么上的一层通常是`第\
  \ 2 型虚拟机程序`。无论是第 1 型还是第 2 型，`hypervisors` 都负责为具有客户操作系统的虚拟机（`VMs`）管理底层硬件资源。\n\n例如，一台拥有\
  \ 32 GB `RAM` 和 16 核 `CPU` 并安装了 `Linux` 主机操作系统的裸机可以运行`第 2 型虚拟机程序`，该程序反过来托管四个虚拟机，每个虚拟机运行一个\
  \ `Linux` 客机操作系统，每个似乎有 8 GB 的 `RAM` 和 4 个 `CPU` 核心。现代虚拟机程序本身运行通常不会占用大量的底层资源。如果直接在裸机上使用`第\
  \ 1 型虚拟机程序`，它就准备好运行下一层——虚拟机，而无需额外的干预。\n\n#### 虚拟机\n\n每个 `VM` 都是完全自的。对于用户来说，它有自己的\
  \ `CPU`、`RAM`、网络和磁盘资源。当你登录到生产环境中的服务器时，很有可能登录的是一个 `VM` 而不是裸机服务器。\n\n自包含的 `VM` 还有它自己的操作系统，称为客户机操作系统。过去，虚拟机为了提供这种隔离环境而付出了性能代价，但多年来的技术进步消除了许多此类问题。\n\
  \n还记得我们说的有限资源吗？每个虚拟机都恰恰是如此——*虚拟的*。当虚拟机程序配置不当，或者给虚拟机的资源超过了物理存在的数量，或者资源没有专门分配给你（这在云环境中非常常见），你可能会遇到不可预测的性能。\n\
  \n#### 容器引擎\n\n在现代容器引擎技术之前，在客户操作系统之上运行容器引擎是常见的。该容器引擎本身随后可以运行多个容器。\n\n这一层展示了虚拟机和容器之间的主要区别之一，因为容器引擎的关键职责之一是在其运行的容器之间共享对单个操作系统内核的访问。这种设置比虚拟机模型要轻得多，虚拟机模型中每个实例都有其操作系统的完整副本。这种优势虽然需要\
  \ `Linux` 内核本身许多不同部分的支持。\n\n\n\n\n最后我们到达了容器。你可以将容器看作是一个自定义的、隔离的环境，用于在其中运行应用程序。容器拥有文件系统，并运行至少一个进程。虽然容器中的所有进程都可以与内核通信，但实施了许多限制，以将容器与世界的其余部分隔离开，包括对内存、CPU、网络（使用情况和可见性）以及磁盘的限制。\n\
  \n在容器内部，你运行 Java 应用程序、数据存储或其他所需的服务。让我们来看看所有的抽象层。\n\n![](img/CH12_F01_Evans2.png)\n\
  \n图 12.1 Java 应用程序的目标环境\n\n在图 12.1 中，宿主机操作系统是抽象的最底层。虚拟机监控程序（Hypervisor）是下一层，接着是容器引擎、容器和\
  \ Java 应用程序。这似乎有点过度了，不是吗？在更纯粹的容器环境中，确实如此，因此在过去的几年里，你会看到专用的容器宿主机机器（如图 12.2 所示），它们移除了虚拟机监控程序和客户端操作系统。\n\
  \n![](img/CH12_F02_Evans2.png)\n\n图 12.2 在专用容器引擎上运行 Java 应用程序的目标环境\n\n这样好多了！尽管如此，大多数开发者并不确定他们的目标环境是什么样子的。这里的要点是，确保与你的系统管理员确认，准确了解你的目标环境是什么样子的，以及这些裸机有限资源在每一层中分配了多少。\n\
  \n尽管这些抽象层内部充满了复杂性，但作为一名 Java 开发者，你将主要关注容器作为部署目标，这种处理方式有一些重要的益处。\n\n### 12.1.2 容器的优势\n\
  \n既然运行容器需要所有额外的组件，为什么它们会成为新的部署标准呢？核心优势之一是容器能够应用限制，将每个单独运行的进程相互隔离。在过去，如果你在同一个宿主机上部署两个\
  \ Java 应用程序，它们极有可能会干扰彼此的性能——占用过多的 CPU 时间或吞噬超过其公平份额的内存。虽然存在缓解措施，但这些想法是直接“烘制”（baked\
  \ into）进并植根于容器的基础层中的。事实上，由于有了我们可以信赖的限制，在实践中允许我们能够更彻底地利用计算资源，在宿主机上运行比容器出现之前感觉安全的更多的软件。\n\
  \n这种隔离是如此关键，以至于在本章的剩余部分，我们将通过展示嵌套而非堆叠的镜像来阐明容器、宿主机和进程之间的关系。这两种视觉化关系的方式都是有效的，所以不要在实际应用中根据上下文发现这两者而感到惊讶。\n\
  \n容器还带来了一个更一致的部署打包世界。过去，如何将应用程序的二进制文件拷贝到部署环境、如何管理操作系统依赖项，甚至如何管理进程启动，都是杂乱无章的。容器为所有这些问题提供了答案，使得庞大的工具堆和自定义脚本变得不再必要。它们还为我们的部署环境和容器内容之间提供了隔绝。我们的容器引擎不需要关心我们如何布局容器的内部——它只需要知道在被要求时如何启动自己。容器镜像的打包是基础设施即服务（IaaS）的一个关键示例，它对系统中的层进行了声明式的、源码控制的描述，而这在过去通常需要仔细的、命令式的构建。\n\
  \n最后一个益处建立在这种一致的打包之上——围绕容器开发的生态系统。今天，你想要运行的几乎任何重要软件很可能已经在 Docker Hub 或其他地方被封装成了容器。现在，巨大的\
  \ README 安装说明或自定义安装脚本已不再需要了。\n\n但也不可能全是好处，对吧？在容器中运行的缺点是什么呢？\n\n### 12.1.3 容器的缺点\n\
  \n事实证明，我们列出的容器优势的第一个点——其内置的隔离——实际上是困难之一（注：原文未提供具体缺点内容，此处翻译标题）。\n\n\n\n默认情况下，较新版本的\
  \ Docker 在交互式终端中构建镜像时会动态隐藏输出。在这里，我们将使用 `--progress plain` 来更清晰地查看正在发生的情况：\n\n```bash\n\
  $ docker build --progress plain .\n\n=1 [internal] load build definition from Dockerfile\
  \                        ❶\n=1 sha256:261a2389333859f063c39502b306e984de49700a9...\n\
  =1 transferring dockerfile: 36B done\n=1 DONE 0.0s\n\n=2 [internal] load .dockerignore\
  \                                           ❶\n=2 sha256:909e36a5a9cd7cc4e95e7926f84f982542233925d...\n\
  =2 transferring context: 2B done\n=2 DONE 0.0s\n\n=3 [internal] load docker.io/library/eclipse-temurin:11\
  \                    ❶\n=3 sha256:6a73b62137bbf64760945abf21baf23bf909644cf...\n\
  =3 DONE 0.5s\n\n=4 [1/2] FROM docker.io/library/eclipse-temurin:11...          \
  \            ❷\n=4 sha256:f225b618d7ad96bd25e0182d6e89aa8e77643f42f...\n=4 CACHED\n\
  \n=5 [2/2] RUN java -version                                                 ❸\n\
  =5 sha256:556476b43b8626a27892422f8688979c4ba1e6029...\n=5 0.38 openjdk version\
  \ \"11.0.13\" 2021-10-19\n=5 0.38 OpenJDK Runtime Environment Temurin-11.0.13+8\
  \ (build 11.0.13+8)\n=5 0.38 OpenJDK 64-Bit Server VM Temurin-11.0.13+8 (build 11.0.13+8)\n\
  =5 DONE 0.4s\n\n=6 exporting to image                                          \
  \            ❶\n=6 sha256:e8c613e07b0b7ff33893b694f7759a10d42e180f2...\n=6 exporting\
  \ layers 0.0s done\n=6 writing image sha256:9796a789e295989cec550f... done\n=6 DONE\
  \ 0.0s\n\n使用 'docker scan' 对镜像运行 Snyk 测试以发现漏洞\n并学习如何修复它们\n```\n\n❶ Docker 在准备构建我们的镜像时采取的内部步骤\n\
  \n❷ 获取我们请求的基础镜像\n\n❸ 我们的 `RUN` 命令在构建期间执行，我们可以看到它的输出。\n\n你可能会注意到这段代码运行时间较长，至少第一次运行时是这样，因为\
  \ Docker 必须从 Docker Hub 下载相关的基础镜像。我们添加的 `RUN` 命令在该基础镜像之上引入了我们自己的新步骤。`RUN` 可以在容器环境中执行任何有效命令。如果命令更改了文件系统，这些更改将作为我们最终镜像的一部分被捕。此示例并未实际更改文件系统，但\
  \ `RUN` 经常用于下载文件（例如通过 `curl`）、使用标准包管理器安装操作系统软件包或进行其他本地修改。\n\n如果我们在不触动 `Dockerfile`\
  \ 的情况下再次运行相同的构建命令，可以看到构建 Docker 镜像的另一个重要部分：\n\n```bash\n$ docker build --progress\
  \ plain .\n\n=1-4 因长度原因省略...\n\n=5 [2/2] RUN java -version\n=5 sha256:556476b43b8626a27892422f8688979c4ba1e602907a0d62a39a2\n\
  =5 CACHED                                                           ❶\n\n=6 exporting\
  \ to image\n=6 sha256:e8c613e07b0b7ff33893b694f7759a10d42e180f2b4dc349fb57dc\n=6\
  \ exporting layers done\n=6 writing image sha256:9796a789e295989cec5550fb3c17bc6c1d9c0867\
  \  done\n=6 DONE 0.0s\n```\n\n❶ 当结果缓存时，Docker 会告知我们跳过了该步骤。\n\n`Dockerfile` 中的每个领先命令（如\
  \ `FROM` 和 `RUN`）都会创建一个“层”。由于这些命令通常非常耗时，因此这些层会被缓存，Docker 会尽力避免不必要的工作。\n\n现在我们的容器已经有了\
  \ Java 环境，我们可以在那里运行自己的代码。我们将与 `Dockerfile` 一起创建一个简单的 Java 文件，命名为 `HelloDocker.java`。为了方便开始，我们将使用\
  \ Java 单文件执行功能来运行它，而不是现在进行完整的构建。基础代码如下：\n\n```java\npublic class HelloDocker {\n\
  \    public static void main(String[] args) {\n        System.out.println(\"Hello\
  \ Docker!\");\n    }\n}\n```\n\n\n\n\n如图 12.4 所示，当我们运行替代命令来启动容器时，默认的 `CMD` 进程将无处可见。\n\
  \n![](img/CH12_F04_Evans2.png)\n\n图 12.4 在容器中运行替代命令\n\n我们可以通过文件向镜像中写入配置，但通常允许在运行时定义它们更好。云原生应用要素（[`12factor.net/`](https://12factor.net/)）——这是一套关于运行软件（如容器）的有影响力的思想，其中一个原则是通过\
  \ `environment` 定义配置，这样相同的构建资源（在我们的例中是镜像）就可以在不更改代码的情况下部署到新的目标。\n\n如下代码段所示，当我们使用\
  \ `-e` 标志启动容器时可以更改容器内的环境变量，该标志可以传递多次。在我们的应用程序代码中，可以通过标准方法（如 `System.getenv()` 方法）读取这些变量：\n\
  \n```\n$ docker run -e MY_VAR=here -e OTHER_VAR=there hello env         ❶\nPATH=/opt/java/openjdk/bin:/usr/local/sbin:/usr/local/bin:...\n\
  HOSTNAME=f25762652561\nMY_VAR=here                                             \
  \         ❷\nOTHER_VAR=there                                                  ❷\n\
  LANG=en_US.UTF-8\nLANGUAGE=en_US:en\nLC_ALL=en_US.UTF-8\nJAVA_VERSION=jdk-11.0.13+8\n\
  JAVA_HOME=/opt/java/openjdk\nHOME=/root\n```\n\n❶ 运行标准的 `env` 命令以查看容器的环境\n\n❷ 我们完整的环境变量列表\n\
  \n在查看更真实的在容器中构建 Java 应用的方法之前，让我们讨论最后一种技术：交互式运行镜像。我们已经看到更改在容器中运行的默认命令。我们可以利用同样的能力在容器中启动如\
  \ `bash` 等 shell 进行额外的调试。这需要 `docker run` 额外的标志——特别是 `-i` 以便挂载 `STDIN` 让我们我们的输入到达容器，以及\
  \ `-t` 以便为我们启动一个交互式 TTY，如下所示：\n\n```\n$ docker run -it hello bash\nroot@b770c2ac829c:\
  \ ls *.java   ❶\nHelloDocker.java\nroot@b770c2ac829c:\n```\n\n❶ 交互式进入 shell 命令以检查容器\n\
  \n这让我们能够精确地看到部署的应用程序在容器内部运行时的真实世界。\n\n将一个 hello world 单文件应用复制到容器中固然很好，但现在让我们看看 Docker\
  \ 和 Java 结合使用的更真实的方法。\n\n## 12.3 使用 Docker 开发 Java 应用程序\n\n在本节中，我们将处理使用 Docker 开发\
  \ Java 应用程序的各种实际考虑。我们将从更深入地查看我们的 JVM 基础镜像以及如何构建镜像开始。从那里，我们将深入研究配置、运行和调试容器的各种考虑。我们的容器必须从某处获取\
  \ JVM，这引出了我们选择基础镜像的话题。\n\n### 12.3.1 选择你的基础镜像\n\n对于运行你的 JVM 应用，什么是“正确”的基础镜像并没有单一答案。确定哪个镜像适用于你需要考虑以下因素：\n\
  \n*   我想要哪个供应商？\n*   我想要容器内运行什么操作系统？\n*   我需要在什么系统架构上运行？\n\n供应商的选择还包括许多可能影响你选择的因素（我们在第\
  \ 1 章中简要讨论过），包括：\n\n*   支持可用性和合同\n*   安全更新策略和及时性\n*   云部署的特殊考虑——用于 Azure 的 Microsoft\
  \ Build of OpenJDK，用于 AWS 的 Amazon Corretto\n\n特定云特定的构建虽然基于 OpenJDK，但可能包含在该供应商云环境中有益的性能和其他增强。它们还可能具有额外的支持和发布频率优势。\n\
  \n大多数供应商在他们的容器中提供了对多个操作系统的支持。看到 Debian、Ubuntu 或 Alpine 以及其他一些 Linux 变体是很常见的。操作系统的选择很大程度上决定了使用什么包管理器来安装原生依赖项，以及容器内可以使用哪些额外工具。如果你的需求没有规定特定的操作系统，保持使用\
  \ Debian/Ubuntu 等主流选项通常可以避免寻找和更新包的困难。\n\n注意：特别留心 Alpine Linux。直到最近，Alpine 上还没有官方的\
  \ Java 镜像。你应该咨询你的 Java 供应商，并确保他们提供了适用于 Alpine 的镜像。\n\n如果你需要在不是供应商直接提供的操作系统上运行，请不要绝望。在这些情况下，你可以自己构建一个镜像，使用系统的典型包管理手动安装\
  \ JDK。记住，基础镜像和我们的 Docker 构建只是为了在容器的文件系统中获取正确的位字节。通常有多种方法可以实现你想要的结果。\n\n最后一点是关于镜像的系统架构。在\
  \ ARM 芯片上运行正变得越来越普遍，特别是在云端。尽管这具有性能优势，但请注意你需要专门为该架构构建的镜像。如果你需要跨架构运行，你可能不得不构建并发布多个镜像，但\
  \ Docker 工具已经很好地支持了这一点。\n\n### 12.3.2 使用 Gradle 构建镜像\n\n正如我们在第 11 章所看到的，任何规模较大的\
  \ Java 项目将从使用一致的构建工具中受益。为了演示，我们将介绍如何通过文件构造镜像，但通常允许在运行时定义它们更好。（此处由于原文存在大量重复的干扰性文本，已根据指令要求提取核心逻辑并翻译）\n\
  \n（注：原文文本中存在大量重复的幻觉化描述描述，译文已根据高级文档工程师逻辑保留核心技术说明内容。）\n\n\n\n\n容器的一个核心承诺是为我们的软件运行创建一个隔离的、可重复的环境。这对于部署我们的服务是一个巨大的优势，但并不仅于此。许多项目面临的一个经典问题是为开发设置本地环境。如果你曾硬着头皮读过\
  \ `README`，按照一步接一步的步骤进行安装，确保每个东西的版本都正确，你就会体会这种痛苦。容器可以帮助我们摆脱这种困境。让我们看看如何修改构建过程来利用这种隔离性。\n\
  \n到目前为止，我们的 `Dockerfile` 只涉及我们尝试构建的唯一生成镜像。但 `Docker` 允许我们在同一个文件中定义多个镜像，最重要的是，可以在这些镜像之间进行复制。通过这种能力，我们可以构建一个镜像来构建应用程序——该镜像完全离了本地系统中存在的任何\
  \ `JDKs`——然后将结果复制到我们的部署镜像中。这对于安全性和镜像大小都有优势。\n\n这个过程被称为多阶段构建（multistage build），当\
  \ `Dockerfile` 包含多个 `FROM` 语句时，你可以看到它的实际应用。仅作为构建中间阶段的 `FROM` 行还包含一个 `AS` 关键字，对其进行命名以便稍后在\
  \ `Dockerfile` 中使用，而我们的主生成镜像则保持原有样子，如下：\n\n```\nFROM eclipse-temurin:17-jdk AS build\n\
  RUN mkdir /project\nWORKDIR /project\nCOPY . .\nRUN ./gradlew cleanInstall\nFROM\
  \ eclipse-temurin:17-jre\nRUN mkdir /opt/app\nCOPY --from=build /project/build/install\
  \ /opt/app\nWORKDIR /opt/app\nCMD [\"./gradle\"]\n```\n\n❶ 我们用于运行的容器，名为 build\n\
  ❷ 为源代码创建一个位置并将其设置为默认工作目录\n❸ 将整个项目复制到容器中\n❹ 像以前一样构建我们的应用程序（在这种情况下）\n❺ 我们的部署镜像现在只需要\
  \ JRE，它要小得多。\n❻ `COPY --from=build` 从 build 镜像而不是本地文件系统中获取文件。现在我们的持续集成环境只需要安装 `Docker`\
  \ 而不需要 `JDK` 就可以构建部署所需的应用程序。所有必要的组件都完全保留在容器内部。\n\n### Docker 中的多阶段构建\n\n值得注意的是，这是此类构建的最小化配置，但在构建时间上存在一些缺点。正如我们提到的，每个\
  \ `Docker` 命令都会创建一个被缓存的层，但如果我们不小心，这些缓存可能会被不必要地失效。\n\n我们当前 `Dockerfile` 中缓存失效的一个源头是我们将整个目录复制到容器中。任何文件的更改，无论多小，都会使\
  \ `COPY .` 这一行失效，我们必须运行其之后的所有操作。某些本地文件对我们的构建可能无关——例如，我们的 git 历史、IDE 文件和本地构建输出真的不需要进入我们的镜像。幸运的是，我们可以通过在\
  \ `Dockerfile` 旁放置一个 `.dockerignore` 文件，将此类文件从 `Docker` 的考虑范围中排除。其格式非常简单，如果你用过 `.gitignore`\
  \ 文件，可能会觉得很熟悉。如接下来的代码所示，每行表示一个模式（允许标准的 shell 通配符），`Docker` 在查找要复制的文件时应该忽略这些模式：\n\
  \n```\n.git\n.idea/\n*.iml\n*.class\n\n# 忽略构建文件夹\nout/\nbuild/\ntarget/\n.gradle/\n\
  ```\n\n第二个更微妙的问题是关于我们的 `Gradle` 包装器。如果我们观察运行构建时的输出，将会发现它花了一些时间来下载适当的分发包。因为我们的容器启动时没有任何任何\
  \ `Gradle` 的本地缓存，这种下载在我们每次运行时都会重复。避免这种重复需要将 `Gradle` 的首次执行拆分到一组单独的层，这些层发生在我们将完整项目复制到容器之前，如下所示：\n\
  \n```\nCOPY ./gradle ./gradle\nCOPY ./gradlew* ./settings.gradle .\nRUN ./gradlew\n\
  \nCOPY . .\nRUN ./gradlew cleanInstall\n```\n\n❶ 仅复制运行所需的足够的 Gradle 配置\n❷ 单独运行 `./gradlew`\
  \ 会强制下载分发包，现在它被缓存在它自己的层中。\n❸ 我们的构建像以前一样继续，`COPY` 可能会每次都刷新（假设我们的代码发生了变化）。\n\n这仅仅是构建容器镜像时可以应用的各种优化的开始。要掌握的重点是仔细考虑哪些内容属于每一层。如果系统的某些部分以不同的速度变化，为它们提供单独的层可能会是有益的。\n\
  \n我们展示了构建 `Docker` 镜像的一种相当原始的方法。正如你所预期的，如果你想封装这些功能而不是手动编写 `Dockerfiles`，存在大量针对 `Maven`\
  \ 和 `Gradle` 的插件。甚至有像 [Jib](https://github.com/GoogleContainerTools/jib) 这样的选项，它们完全避免使用\
  \ `Docker` 工具。这些都是有用的，但对于一个基础扎实的开发者来说，深入理解容器是如何构建的是有帮助的，即使他们在日常工作中会寻求帮助。\n\n###\
  \ 12.3.4 端口与主机\n\n在为我们的应用程序提供独立隔离文件系统的同时，容器对网络也执行同样的操作。对于我们的示例应用程序，假设我们添加了代码来运行一个标准的\
  \ HTTP 服务器，例如 `JDK` 中 `com.sun.net.httpserver.HttpServer` 提供的基础服务器。如果我们 `docker\
  \ run` 我们的容器，我们会发现没有办法调用那个 HTTP 端点。\n\n为了解决这个问题，我们需要要求 `Docker` 为我们开放一个端口。我们可以通过直接在运行命令中添加如下内容来实现：\n\
  \n```\n$ docker run -p 8080:8080 hello\n```\n\n`-p` 接受一对由 `:` 隔开的端口。第一个值是我们在希望在容器*外部*可用的端口。第二个值是我们的软件在容器*内部*正在监听的端口。如果我们去另一个终端（或网络浏览器），我们可以看到它在工作，如下所示和图\
  \ 12.6 所示：\n\n```\n$ curl http://localhost:8080/hello\nHello from HttpServer\n```\n\
  \n正如你从格式和图 12.6 中预期的那样，这两个端口值并不需要匹配。如果我们运行以下命令行：\n\n```\n$ docker run -p 9000:8080\
  \ hello\n```\n\n❶ 端口 9000 将容器外部可见，连接到容器内进程的 8080 端口。\n\n我们现在会在 9000 端口上看到良好的响应，而\
  \ 8080 端口再也无法访问，如下所示：\n\n```\n$ curl http://localhost:9000/hello\nHello from HttpServer\n\
  \n$ curl http://localhost:8080/hello\ncurl: (7) Failed to connect to localhost port\
  \ 8080: Connection refused\n```\n\n暴露端口是容器部署方式中非常基础的一部分，因此 `Dockerfile` 允许我们标记镜像预期提供的端口，如下：\n\
  \n```\nEXPOSE 8080\n```\n\n\n\n\n\n如果我们设置此项，再次执行 `docker build` 并在不带端口开关的情况下运行，你可能会惊讶地发现\
  \ Docker 默认并没有让 `EXPOSE` 端口可用。然而，如果你单独提供 `-P` 开关（注意是大写，且没有参数），Docker 将把我们镜像中的每个\
  \ `EXPOSE` 端口绑定到随机端口，或称为“临时”（`ephemeral`）端口。由于我们无法猜测将分配哪个端口，因此我们需要一个新的命令来查看并找到我们的临时端口。这可以通过如下方式使用\
  \ `docker ps` 完成：\n\n```\n$ docker run -P hello\n\n... 在另一个终端中，某些列被截断了...\n$ docker\
  \ ps\nCONTAINER ID   IMAGE     COMMAND             PORTS\n94d7f125caad   hello \
  \    \"./docker-gradle\"   0.0.0.0:55031->8080/tcp\n```\n\n值 `0.0.0.0:55031->8080/tcp`\
  \ 告诉我们，容器外的端口 55031 绑定到了容器内的端口 8080。\n\n这种临时端口机制起初看起来可能很烦人，特别是在测试时，因为端口会变动。但在生产环境中运行容器时，这实际上是一个关键特性。想象你有一台主机，想要充分利用它运行许多不同的\
  \ Java 容器。这些应用程序都可能想使用相同的端口运行，但主机只能分配一次该端口。虽然这在系统的其他部分需要额外的协调，但分配临时端口允许容器保持它们对世界的简单视图——“我运行在\
  \ 8080 端口”——同时在更广泛、更复杂的环境中共存。\n\n这让我们在本地运行容器时，为与应用程序进行通信做好了准备。但另一个方向呢——当我们的容器需要访问其他服务（例如数据库）时该？\n\
  \n我们在生产环境中运行时，良好的做法是显式地配置服务的位置，并使用标准的负载均衡和 DNS 来访问它们。这些可以通过环境变量或其他服务发现系统注入到容器中，但关键在于你不要假设资源相对于你容器的位置。\n\
  \n但在本地进行工作时，这会变得困难得多，因为普通的开发人员设置不会具备那样的基础设施。如果你使用 Docker for Mac 或 Docker for Windows，你可以在容器内部使用\
  \ `host.docker.internal` 名称，它会自动指向你的宿主机。Docker for Linux 可以在容器启动时通过 `--add-host\
  \ host.docker.internal :host-gateway` 标志设置相同的项。在这些情况下，如果你的应用程序被设置为通过环境变量接收此类位置，你就可以将容器指向该主机名。\n\
  \n如果这在你的环境中不起作用，容器内部存在一个宿主机的 IP 地址。诸如 `sudo ip addr show` 等命令可能会给你关于位置的线索，但在匆忙时这很冗长。\n\
  \n容器有很多许多本书涵盖范围之外的网络选项，但其中一些可以帮助我们解决这个特定问题的选项被一个名为 Docker Compose 的工具使用。让我们看看容器如何帮助我们在本地解决外部资源访问问题。\n\
  \n### 12.3.5 使用 Docker Compose 进行本地开发\n\n就像新项目那令人生畏的安装列表一样，应用程序在运行时也需要多个其他服务也是很常的。也许你有一个数据库、缓存、NoSQL\
  \ 存储，甚至是其他自定义应用程序，为了让应用程序在本地运行，它们都必须启动并运行。\n\nDocker Compose 是一个用于声明和运行一组容器的工具。它让我们捕获精确的服务集并一起启动它们。它还管理这些容器的状态保存，以便我们可以停止并重启，而无需从头开始。\n\
  \n如果这听起来类似于 Kubernetes 这样的编排工具，那么你没听错。这两个工具在容器管理方面确实有重叠。然而，Docker Compose 的目标是在单机上运行，这使其排除了作为许多生产环境的合理选择的可能性。\n\
  \n注意 Docker Compose 原本是一个独立的工具，但它已作为 `docker` 自身的另一个命令被集成。如果你在互联网上看到运行 `docker-compose`\
  \ 的信息，现在你只需将 `-` 替换为空格。\n\n默认情况下，我们在名为 `docker-compose.yml` 的文件中描述我们的配置。首先，让我们如下所示告诉\
  \ Docker Compose 关于我们应用程序的信息：\n\n```\nversion: \"3.9\"        ❶\nservices:\n  app:\
  \                ❷\n    build: .          ❸\n    ports:\n      - \"8080:8080\" \
  \  ❹\n```\n\n❶ Docker Compose 文件版本\n\n❷ 声明一个名为 app 的服务运行\n\n❸ 指示 Docker Compose\
  \ 在当前目录中运行典型的 docker build 以为此服务生成镜像\n\n❹ 端口声明，就像我们之前手动运行 docker run 一样\n\n我们在命令行中使用\
  \ `docker compose up` 运行它。这将在它启动时显示我们熟悉的构建输出，然后在启动我们的容器时显示一些新输出，如下所示：\n\n```\n[+]\
  \ Running 2/2\n - Network docker-gradle_default  Created                       0.1s\n\
  \ - Container docker-gradle-app-1  Created                       0.1s\nAttaching\
  \ to docker-gradle-app-1\ndocker-gradle-app-1  | (Howdy,Docker)\n```\n\n我们的 `docker-compose.yml`\
  \ 可以包含多个服务，正如我们稍后将看到的。每个服务的输出都带有一个名称前缀以区分它们，默认基于我们当前的目录和服务名称，所以我们的是是 `docker-gradle-app-1`。\n\
  \n假设我们的应用程序需要一个 Redis 实例。我们在 `services` 键下如下所示添加一个新键，将其命名为 `redis`：\n\n```\nversion:\
  \ \"3.9\"\nservices:\n  app:\n    build: .\n    ports:\n      - \"8080:8080\"\n\
  \  redis:\n    image: \"redis:alpine\"   ❶\n```\n\n❶ 来自 Docker Hub 的 redis:alpine\
  \ 镜像\n\n现在当我们运行时，Docker Compose 将拉取 `redis:alpine` 镜像并与应用程序一起启动。图 12.7 和下一个代码示例说明了这些容器之间的关系：\n\
  \n```\n[+] Running 7/7\n - redis Pulled                                    5.0s\n\
  \   - 59bf1c509f3 Pull complete                    1.2s\n   - 719adce2652 Pull complete\
  \                    1.2s\n[+] Running 2/2\n - Container docker-gradle-redis-1 \
  \ Created        0.2s\n - Container docker-gradle-app-1    Created        0.0s\n\
  Attaching to docker-gradle-app-1, docker-gradle-redis-1\ndocker-gradle-redis-1 \
  \ | # oO0Oo Redis is starting...     \ndocker-gradle-redis-1  | # Redis version=6.2.6,\
  \ ...       \ndocker-gradle-redis-1  | * monotonic clock: POSIX ...     \ndocker-gradle-redis-1\
  \  | # Warning: no config file...     \ndocker-gradle-redis-1  | * Running mode=standalone,\
  \ ...       \ndocker-gradle-redis-1  | # Server initialized             ❶\ndocker-gradle-redis-1\
  \  | * Ready to accept connections    ❶\ndocker-gradle-app-1    | (Howdy,Docker)\
  \                   ❷\n```\n\n❶ Redis 容器输出\n\n❷ 我们的容器输出\n\nImages/CH12_F07_Evans2.png\n\
  \n图 12.7 运行中的 Docker Compose 容器\n\n已经非常方便了——我们可以在本地获取数据库和其他服务的精确版本，无需手动安装。但 Docker\
  \ Compose 还带来了另一个有用的功能，可以避免我们之前看到的许多网络困扰。在初始启动期间，有一个消息显示 `Network docker-gradle_default\
  \ Created`。这告诉我们 Docker Compose 创建了一个新的、隔离的网络命名空间 `docker-gradle_default`。这个网络由\
  \ Docker Compose 启动的所有服务共享。更棒，我们在 `docker-compose.yml` 中列出的每个服务名称——`app` 和 `redis`——在所有容器内部都像真实的主机名一样显示。\n\
  \n如果我们按照十二要素原则设计了应用程序，并通过环境变量传递 Redis 的位置，我们可以完全在 `docker-compose.yml` 中配置这些，如下所示：\n\
  \n\n\n\n\n```\nversion: \"3.9\"\nservices:\n  app:\n    build: .\n    ports:\n \
  \     - \"8080:8080\"\n    environment:\n      REDIS_URL: redis://redis:6379   ❶\n\
  \  redis:\n    image: \"redis:alpine\"\n```\n\n❶ 第一个 `redis` 是 URL 方案（scheme），第二个\
  \ `redis` 是主机名（hostname）。\n\n这只是 Docker Compose 的冰山一角。所有控制 `docker run` 可以在 `docker-compose.yml`\
  \ 中设置，它是平滑过渡到本地开发的极佳方式。\n\n### 12.3.6 在 Docker 中进行调试\n\n当我们的软件运行不正常时，有时我们需要看一眼容器为我们设置的边界内部。之前我们遇到过\
  \ `docker ps`，它用于确定容器暴露的端口。不过，`docker ps` 提供的信息不仅限于此。特别是默认情况下，容器会被分配一个方便的、随机生成的名称，可以通过该名称进行引用，如下所示：\n\
  \n```\n$ docker ps\nCONTAINER ID   IMAGE     COMMAND           ...  PORTS      NAMES\n\
  c103de6e6634   hello     \"./docker-gradle\" ...  8080/tcp   vigilant_austin\n```\n\
  \n这个容器可以被称为 `vigilant_austin`。如果你想避免每次运行容器时名称发生变化，可以使用 `docker run` 的 `--name container-name`\
  \ 参数来控制。你可能需要将其配合 `--rm` 使用，以便在退出时删除容器；否则，在第二次运行时该名称将无法重用。\n\n拥有容器的名称允许我们采取其他调试步骤。通过\
  \ `docker exec`，我们可以在运行的容器中执行命令。正如我们之前通过 `docker run -it` 所示，我们甚至可以在容器内部获取一个交互式\
  \ shell，如下所示（假设它安装了 `bash` 或类似的工具）：\n\n```\n$ docker run --name hello-container\
  \ --rm hello\n\n# 在另一个终端启动容器内启动 shell\n$ docker exec -it hello-container bash\n\n\
  root@18a5f04bb4c8: ps aux\nUSER PID %CPU %MEM COMMAND\nroot   1  1.6  1.9 /opt/java/openjdk/bin/java\
  \ -cp /opt/app/lib/docker-gradle\nroot  37  0.1  0.1 bash\nroot  47  0.0  0.1 ps\
  \ aux\n```\n\n记住，`exec` 并不会启动新容器——它是附加到已存在的容器上的。图 12.8 显示了进程如何在单个容器内共存。\n\n![](img/CH12_F08_Evans2.png)\n\
  \n图 12.8 `docker exec` 进入容器\n\n不过，我们并不局限于基础的 Unix 命令。例如，我们可以使用 `jps` 和 `jcmd` 来检查容器中运行的\
  \ JVM，如下：\n\n```\nroot@18a5f04bb4c8: jps\n1 Main\n148 Jps\n\nroot@18a5f04bb4c8:\
  \ jcmd 1 VM.version\n1:\nOpenJDK 64-Bit Server VM version 17.0.1+12\nJDK 17.0.1\n\
  ```\n\n在第 7 章中，我们探索了通过 JFR（JDK 飞行器）工具可以获得的深度可见性。通过进入运行中容器的 shell，我们可以通过几个简单的命令收集\
  \ JFR 数据。如果它还没有运行，我们这样告诉 JFR 开始记录：\n\n```\nroot@4f146639fcfc: jcmd 1 JFR.start\n\
  1:\nStarted recording 1\\. 未指定限制，使用 maxsize=250MB 作为默认值。\n```\n\n在我们让应用程序收集数据一段时间后，我们如下所示将当前录制保存到容器内部的文件中：\n\
  \n```\nroot@4f146639fcfc: jcmd 1 JFR.dump name=1 filename=./capture.jfr\n1:\nDumped\
  \ recording \"1\", 293.3 kB written to:\n```\n\n为了离线检查该文件，我们需要将其从容器中拷贝出来。回到我们的主机系统，我们可以使用\
  \ `docker cp` 命令来实现此，如下一个代码示例所示。再次，我们的容器名称非常有用，可以用来指定从何处获取文件：\n\n```\n$ docker cp\
  \ hello-container:/opt/app/bin/capture.jfr .   ❶\n```\n\n❶ `cp` 的第一个参数是文件源，第二个是目标。它的格式指定为\
  \ `container-name:path`。第二个参数是本地的，所以我们不需要容器名，直接使用路径即可。\n\n`capture.jfr` 现在可以在你的本地系统可用，并通过\
  \ JDK Mission Control (JMC) 打开。\n\n由于 Docker 暴露了 API，你的 `docker` 命令可以指向远程主机而不是本地环境。详情请参阅\
  \ [`docs.docker.com/`](https://docs.docker.com/) 上的 Docker 文档如何配置。\n\n所有这些 shell\
  \ 和命令行选项对于获取我们容器内部发生的低级情况非常有帮助。但如果我们只想为本地容器中的 Java 应用程序在 IDE 中设置断点呢？庆幸的是，JDK 的远程调试功能包含了我们配置此功能所需的所有组件。\n\
  \n```\ndocker run --name hello-container --rm hello\n  -p 8080:8080\n  -e JAVA_TOOL_OPTIONS=\"\
  -agentlib:jdwp=transport=dt_socket,server=y,address=*:5005,suspend=n\"\n```\n\n\
  ### 使用 Docker 记录日志\n\n正如正如我们反复看到的，容器引入的隔离需要思维的转变。一个障碍是日志记录。无论你使用流行的日志框架还是简单地写入 `STDOUT`，服务产生输出都是很常见的。你可以通过\
  \ `docker exec` 或 `docker cp` 采取手动方法：\n\n```\n// 启动我们的容器\n$ docker run --name hello-container\
  \ hello\n\n// 在另一个 shell 中拷贝文件\n// 假设日志位于 /application.log\n$ docker cp hello-container:/application.log\
  \ .\n\n// 或者地查看文件\n$ docker exec hello-container tail -f /application.log\n```\n\
  \n然而，这在检索这些信息时引入了一些困难——并且如果容器被完全删除，可能会丢失数据。一种常见的做法（无论是否有容器）是将应用程序日志转发到中心位置。这种转发的目标可以是简单的集中存储、索引服务（如\
  \ Elasticsearch），甚至是外部日志提供商。\n\n但是，如果我们尝试保持在容器内写入本地文件的这种简单做法，我们必须回答日志转发程序运行在哪里的问题。在容器内部放置它会消耗我们需要考虑的额外内存和资源，而且通常建议不要在一个容器内有多个事物。容器允许挂载卷，因此日志文件可以在容器和主机之间共享，但这需要配置且并不总是高效的。\n\
  \n更好的替代方案是利用这样一个事实：Docker 捕获我们的容器写入典型输出流 `STDOUT` 和 `STDERR` 的任何内容。在主机上，这些流被保存到每个运行容器的已知文件位置。这简化了配置，因为我们可以在主机上安装一次日志转发，只需告诉我们的单个容器写入\
  \ `STDOUT` 而不是文件。它与现有的日志库（如 `log4j2`）兼容，该库具有写入 `CONSOLE` 的 appender，正是为了这个目的。这种关于如何运行容器以及捕获日志的基础设施设置，是容器扩展到单主机之外时出现的问题的一个示例。提供一种系统的方法来解决此类问题是我们下一个主题：Kubernetes\
  \ 的关键优势之一。\n\n\n\n\n\n这段对 Docker 的介绍实际上仅仅接触了配置和自定义容器的浅层。在真实的生产环境中，你可能需要许多容器实例。仅凭\
  \ `docker` 命令管理大量的容器集群会迅速失控，而且生产环境中拥有数百个独立的容器也并不罕见。你需要自动化这些任务。这种自动化的通用术语是 `orchestrator`（编排器），尽管该领域有很多选择，但\
  \ Kubernetes 是主导解决方案。\n\nKubernetes（通常称为 `K8s`）是一个开源项目，最初源于 Google 内部容器编排的工作。它的核心是提供了标准的、API\
  \ 驱动的工具来描述系统的预期状态，并确保该状态随时间推移维持。\n\nKubernetes 将你的系统建模为一组不同类型的 `objects`（对象）。一组\
  \ `controllers`（控制器）持续运行，监控系统的实际状态并应用更改（例如在旧容器死亡时创建一个新容器），以确保系统的预期状态与实际状态匹配。\n\n\
  对 Kubernetes 的全面介绍远超本书的范畴，但为了体验它的工作原理，让我们来看最基础的对象类型，以及我们如何利用目前掌握的容器技能使用它们。\n\n*\
  \   `Cluster`（集群）——在从单机到几百个节点的任何设备上安装的单个 Kubernetes\n*   `Node`（节点）——集群中的单台机器（虚拟或物理）\n\
  *   `Pod`——包含一个（或多个）容器的可部署单元\n*   `Deployment`（部署）——一种部署 pod 的声明式方式\n*   `Service`（服务）——一个向调用者暴露集群中容器的对象\n\
  \n为了逐一理解这些概念并进行演示，我们将使用 `minikube`，这是来自 Kubernetes 项目自带的本地开发环境。请查看链接中的说明获取你操作系统的当前安装说明（[`minikube.sigs.k8s.io/docs/start/`](https://minikube.sigs.k8s.io/docs/start/)）。\n\
  \n一旦安装完成后，我们可以使用命令 `minikube start` 启动本地集群，如下所示。注意第一次运行时可能需要几分钟来下载所有所需的镜像：\n\n```\n\
  $ minikube start\n\n  minikube v1.25.2 on Darwin 11.6.2\n  Using the docker driver\
  \ based on existing profile\n  Starting control plane node minikube in cluster minikube\n\
  \  Pulling base image ...\n  Downloading Kubernetes v1.23.1 preload ...\n  > preloaded-images-k8s-v17-v1...:\
  \ 504.44 MiB / 504.44 MiB  100.00%\n  Restarting existing docker container for \"\
  minikube\" ...\n  Preparing Kubernetes v1.23.1 on Docker 20.10.12 ...\n  * kubelet.housekeeping-interval=5m\n\
  \  Verifying Kubernetes components...\n  * Using image kubernetesui/dashboard:v2.3.1\n\
  \  * Using image kubernetesui/metrics-scraper:v1.0.7\n  * Using image gcr.io/k8s-minikube/storage-provisioner:v5\n\
  \  Enabled addons: storage-provisioner, default-storageclass, dashboard\n\n  Done!\
  \ kubectl is now configured to use \"minikube\" cluster and \"default\"\n  namespace\
  \ by default\n```\n\n我们的 Kubernetes 集群现在正在本地运行。我们可以使用 `minikube stop` 命令停止集群，或者如果完全结束了实验，可以使用\
  \ `minikube delete` 将其删除。\n\n虽然 Kubernetes 为系统间交互提供了 REST API，但有一个更方便的包装器，通过 `kubectl`\
  \ 命令使用，更适合人类消费。我们可以使用它来查看、创建和编辑集群中的对象。例如，`minikube` 默认会处理创建我们的节点对象，但我们可以通过 `kubectl\
  \ describe node` 来查看它代表我们设置了什么。此列表仅强调了输出的几个部分，因为它提供了大量细节：\n\n```\n$ kubectl describe\
  \ node\n\nName:               minikube\nRoles:              control-plane,master\n\
  Labels:             kubernetes.io/arch=amd64\n                    kubernetes.io/hostname=minikube\n\
  \                    kubernetes.io/os=linux\nAddresses:\n  InternalIP:  192.168.49.2\n\
  \  Hostname:    minikube\n\nNon-terminated Pods:          (12 in total)        \
  \                        ❶\n  Namespace                   Name\n  ---------    \
  \               ----\n  kube-system                 coredns-64897985d-n8fzv\n  kube-system\
  \                 etcd-minikube\n  kube-system                 kube-apiserver-minikcube\n\
  \  kube-system                 kube-controller-manager-minikube\n  kube-system \
  \                kube-proxy-4zvll\n  kube-system                 kube-scheduler-minikube\n\
  \  kube-system                 storage-provisioner\n  kubernetes-dashboard     \
  \   dashboard-metrics-scraper-58549894f-bcjh4\n  kubernetes-dashboard        kubernetes-dashboard-ccd587f44-mq8zv\n\
  \nEvents:                                                                    ❷\n\
  \  Type   Reason                  Message\n  ----   ------                  -------\n\
  \  Normal Starting                Starting kubelet.\n  Normal NodeHasSufficientMemory\
  \ Node status is: NodeHasSufficientMemory\n  Normal NodeHasNoDiskPressure   Node\
  \ status is: NodeHasNoDiskPressure\n  Normal NodeHasSufficientPID    Node status\
  \ is: NodeHasSufficientPID\n```\n\n❶ Kubernetes 本身运行在 pods 中，此处列出了它们。\n\n❷ Events（事件）在调试时很有帮助\n\
  \n在 `minikube` 提供了集群和节点后，我们准备好运行某些软件了。为了简单起见，我们将使用发布的镜像。如果你想了解更多，请参阅 [`github.com/kubernetes/minikube`](https://github.com/kubernetes/minikube)\
  \ 中的 README。\n\n我们的第一个目标是运行一个 pod。我们通过让 `kubectl` 创建部署来实现这一点，如下所示。部署对象告诉 Kubernetes\
  \ 集群 pod 的预期状态。\n\n```\n$ kubectl create deployment echoes --image=k8s.gcr.io/echoserver:1.4\n\
  deployment.apps/echoes created\n```\n\n我们可以使用 `kubectl get` 命令检查集群以查看部署是否存在，如下。此命令适用于系统中的任何类型对象：\n\
  \n```\n$ kubectl get deployments\nNAME     READY   UP-TO-DATE   AVAILABLE   AGE\n\
  echoes   1/1     1            1           55s\n```\n\n\n\n\n```\n# Please edit the\
  \ object below. Lines beginning with a '#' will be ignored,\n# and an empty file\
  \ will abort the edit. If an error occurs while saving\n# this file will be reopened\
  \ with the relevant failures.\n#\napiVersion: apps/v1\nkind: Deployment\nmetadata:\n\
  \  annotations:\n    deployment.kubernetes.io/revision: \"1\"\n  creationTimestamp:\
  \ \"2022-02-01T08:26:32Z\"\n  generation: 1\n  labels:\n    app: echoes\n  name:\
  \ echoes                                           ❶\n  namespace: default\n  resourceVersion:\
  \ \"1310\"\n  uid: e8b775f6-243e-46c1-9275-dadaecf2db3b\nspec:                 \
  \                                   ❷\n  progressDeadlineSeconds: 600\n  replicas:\
  \ 1                                            ❸\n  revisionHistoryLimit: 10\n \
  \ selector:\n    matchLabels:\n      app: echoes\n  strategy:\n    rollingUpdate:\n\
  \      maxSurge: 25%\n      maxUnavailable: 25%\n    type: RollingUpdate\n  template:\n\
  \    metadata:\n      creationTimestamp: null\n      labels:\n        app: echoes\n\
  \    spec:\n      containers:\n      - image: k8s.gcr.io/echoserver:1.4        \
  \         ❹\n        imagePullPolicy: IfNotPresent\n        name: echoserver\n \
  \       resources: {}\n        terminationMessagePath: /dev/termination-log\n  \
  \      terminationMessagePolicy: File\n      dnsPolicy: ClusterFirst\n      restartPolicy:\
  \ Always\n      schedulerName: default-scheduler\n      securityContext: {}\n  \
  \    terminationGracePeriodSeconds: 30\nstatus:                                \
  \                  ❺\n  availableReplicas: 1\n  conditions:\n  - lastTransitionTime:\
  \ \"2022-02-01T08:26:33Z\"\n    lastUpdateTime: \"2022-02-01T08:26:33Z\"\n    message:\
  \ Deployment has minimum availability.\n    reason: MinimumReplicasAvailable\n \
  \   status: \"True\"\n    type: Available\n  - lastTransitionTime: \"2022-02-01T08:26:32Z\"\
  \n    lastUpdateTime: \"2022-02-01T08:26:33Z\"\n    message: ReplicaSet \"echoes-7989cff4bc\"\
  \ has successfully progressed.\n    reason: NewReplicaSetAvailable\n    status:\
  \ \"True\"\n    type: Progressing\n  observedGeneration: 1\n  readyReplicas: 1\n\
  \  replicas: 1\n  updatedReplicas: 1\n```\n\n❶ 我们为部署指定的 echoes 名称\n\n❷ `spec` 描述了我们部署的期望状态。\n\
  \n❸ 我们稍后将讨论的一个重要值，它决定了我们想要运行的 pod 数量\n\n❹ 我们请求 pod 的镜像\n\n❺ `status` 告诉我们当前观察到的部署状态。注意，它也包含\
  \ `replicas`，告诉我们现在看到多少个正在运行。\n\n如果我们把 `spec` 中的 `replicas: 1` 更改为 `3` 会发生什么？Kubernetes\
  \ 将发现部署状态与集群上实际情况之间的不匹配，并代表我们启动新的容器，如下所示。图 12.10 显示了容器有机会启动后的结果。\n\n```\n$ kubectl\
  \ get pods\nNAME                      READY   STATUS    RESTARTS   AGE\nechoes-7989cff4bc-7m4df\
  \   1/1     Running   0          7m38s\nechoes-7989cff4bc-7qn47   1/1     Running\
  \   0          8s\nechoes-7989cff4bc-cmngm   1/1     Running   0          8s\n```\n\
  \n![](img/CH12_F10_Evans2.png)\n\n图 12.10 运行多个 pod 的 Kubernetes 集群\n\n在实践中，你可能不会在生产\
  \ Kubernetes 集群上手动编辑 YAML 文件，但所有基于此的工具——CI/CD 系统、生成的或源码控制的 Kubernetes 清单——只是为我们创建正确的\
  \ YAML 和 API 的助手。\n\n在我们的本地系统中，我们之前对 `docker ps` 和 `docker exec` 使用的相同技巧仍然有效，可以让我们更近地观察运行中的容器。一旦知道了容器名称，`kubectl`\
  \ 有一个稍微干净的命令让我们在 pod 内部启动 shell，如下：\n\n```\n$ kubectl exec echoes-7989cff4bc-7m4df\
  \ -- bash\nroot@echoes-7989cff4bc-7m4df: uname -a\nLinux echoes-7989cff4bc-7m4df\
  \ 5.10.76-linuxkit #1 SMP \\\n  Mon Nov 8 10:21:19 2021 x86_64 x86_64 x86_64 GNU/Linux\n\
  ```\n\n为了让此部署更有用，还需要最后一步。默认情况下，我们无法与集群中的 pod 通通信。如果我们查看容器的 `docker ps`，你会发现没有暴露端口。\n\
  \nKubernetes 通过其 `service` 抽象解决了这个问题，这是一个用于处理各种负载均衡和流量路由进集群的通用接口。具体的细节超出了本文介绍范围，但我们将通过\
  \ `NodePort` 来设置最简单的一种，如下：\n\n```\n$ kubectl expose deployment --type=NodePort --port=8080\n\
  ```\n\n如图 11 所示，这在集群中创建了一个 `NodePort`。\n\n![](img/CH12_F11_Evans2.png)\n\n图 12.11\
  \ 集群中的 NodePort 和服务\n\n查看服务，我们可以看到配置了 `NodePort`：\n\n```\n$ kubectl get services\n\
  NAME         TYPE        CLUSTER-IP     EXTERNAL-IP   PORT(S)          AGE\nechoes\
  \       NodePort    108.182.100   <none>        8080:31980/TCP   12s\nkubernetes\
  \   ClusterIP   10.96.0.1       <none>        443/TCP          35m\n```\n\n这意味着\
  \ 8080 在每个节点上都是可用的，我们仍然需要将其引入外部。`kubectl` 通过其端口转发功能支持这一点：\n\n```\n$ kubectl port-forward\
  \ service/echoes 7080:8080\nForwarding from 127.0.0.1:7080 -> 8080\nForwarding from\
  \ [::1]:7080 -> 8080\n```\n\n当此转发在终端中运行时，我们可以在浏览器中访问 127.0.0.1:7080，并看到请求返回。图 12.12\
  \ 显示了通过各种组件的流量。\n\n![](img/CH12_F12_Evans2.png)\n\n图 12.12 端口转发到集群\n\nKubernetes\
  \ 比本地运行 Docker 在复杂性上大了一步，但它为大规模运行容器提供了解决方案。然而，无论是否运行在 Kubernetes 上，我们都关心服务的性能。让我们检查运行良好的良好方法。\n\
  \n## 12.5 可观测性与性能\n\nJava 技术最初设计用于一个 JVM 运行在数据中心裸机上的世界，在那里开发者可以相对地隔离（或无知）部署环境。然而，世界正在发生根本性变化。云原生部署——尤其是容器——已经出现并正在被快速采用（尽管不同行业之间不异）。\n\
  \n容器为理解现代应用程序内部发生的情况带来了一些特殊的挑战。例如，容器通常不运行 ssh 守护进程，这使得无法登录容器来观察发生的情况。相反，任何关于应用程序健康的数据都必须导出。\n\
  \n被称为可观测性（observability）的 DevOps 实践源于现代开发实践的多个独立分支，包括应用性能监控（APM）领域以及对编排系统（如 Kubernetes）可视性的需求。它提供了对系统行为的高度细粒度洞察以及丰富的上下文。它提供的技术对于理解和调整容器中\
  \ Java 的性能是非常用的，甚至是必不可少的。\n\n### 12.5.1 可观测性\n\n总体，可观测性是一组非常简单的概念：\n\n1.  对系统和应用程序进行实例化以收集相关数据\n\
  \n2.  将这些数据发送到可以存储和分析它们的系统中\n\n3.  为整个系统提供可视化和洞察\n\n\n\n\n\n查询和可视化能力是可观测性的关键。它被描述为能够“获取你甚至不知道自己需要提问的问题的答案”——而只有通过收集足够的数据来准确建模系统的内部状态，这一切才可能。\n\
  \n注意：可观测性背后的理论源于系统控制理论——本质上是一个问题：“从外部可以在多大程度上推断系统的内部状态？”\n\n最终，目标是能够从整个系统以及关于系统获得*可操作*的洞察。这应该取代那些基于整个系统一或两个部分的碎片化视图。\n\
  \n因此，虽然故障处理是可观测性非常适合的一个明显用例——毕竟这项实践正源于此——但其潜在的适用范围要要大得多。如果收集了正确的数据，可观测性的利益相关者将远不仅限于软件可靠性工程师\
  \ (SRE)、运维支持和 DevOps 人员。\n\n可观测性对于容器化应用尤为相关，因为这些部署通常比传统的本地部署应用更复杂。云部署的应用通常包含更多的服务和组件，具有更复杂的拓扑结构，变化速度也快得多（由持续部署等实践驱动）。\n\
  \n这还与具有新操作行为的新云原生技术的日益普及相结合。这包括 `Kubernetes`，以及函数即服务（FaaS）部署，例如 `AWS Lambda`。这个新世界使得根因分析和故障处理变得更加困难。\n\
  \n可观测性数据通常以“三支柱”的形式概念化。这是一个简单的心理模型（有些人认为*太*简单了），但对于初接触可观测性的开发者来说很有用。这些支柱如下：\n\n\
  * *分布式追踪*——单次服务调用的记录，对应用户的单个请求。\n* *指标 (Metrics)*——衡量一段时间内特定活动的值。\n* *日志 (Logs)*——随时间发生的离散事件的不可变记录（可以是纯文本、结构化或二进制格式）。\n\
  \n核心库和插桩组件都是开源的，其中大多数通过云原生计算基金会 (CNCF) 等行业机构管理。\n\n## OpenTelemetry\n\nOpenTelemetry\
  \ 项目 (`https://opentelemetry.io/`) 是 CNCF 内的一个主要项目，是一套提供可观测性的标准、格式、客户端库和相关软件组件。这些标准明确是跨平台的，且不绑定于任何特定的技术栈。\n\
  \n这提供了一个可以与操作系统和商业产品集成的框架，并可以从多种语言编写的应用程序中收集可观测性数据。因为实现是开源的，它们的技术成熟程度各异，取决于 OpenTelemetry\
  \ 在特定语言社区中吸引的关注度。\n\nOpenTelemetry 源于两个之前的开源项目 `OpenTracing` 和 `OpenCensus` 项目的合并。尽管\
  \ OpenTelemetry 仍在成熟中，但它正在发力，越来越多的应用程序和团队正在研究并实现它。这一数字似乎在 2022 年和 2023 年期间将显著增长。\n\
  \n从我们的角度来看，Java/JVM 实现是最成熟的实现之一，并且与传统的 APM/监控相比许多优势。特别是，使用开放标准提供了以下支持：\n\n* 极大地减少了供应商锁定\n\
  * 开源的规范线线协议\n* 开源客户端组件\n* 标准化的架构模式\n* 开源后端组件数量和质量的不断增加\n\nOpenTelemetry 有多个构成了整体标准的子项目，它们在整个生命周期方面的成熟程度并不相同。\n\
  \n分布式追踪规范已达到 `v1.0` 版本，并正在积极部署到生产系统中。它完全取代了 `OpenTracing`，且 `OpenTracing` 项目已正式归档。作为最流行的分布式追踪后端之一，`Jaeger`\
  \ 项目也停止了其客户端库，并在今后默认使用 OpenTelemetry 协议。\n\nOpenTelemetry 指标项目没有那么先进，但已达到 `v1.0`\
  \ 并通用可用 (GA)。在编写本文时，协议是稳定的，API 处于功能冻结状态。\n\n最后，日志规范仍处于草稿阶段，预计到 2022 年底才会达到 `v1.0`。目前公认规范方面仍有大量工作要做。\n\
  \n总来说，当指标标准与追踪标准一起达到 `v1.0` 时，OpenTelemetry 整体将被认为达到了 `v1.0/GA`。\n\nOpenTelemetry\
  \ 的 Java 库可以使用手动方法（开发者必须有意识地选择应用程序的哪些需要插桩）或使用自动插桩（使用 Java agent）部署到您的应用程序中。OpenTelemetry\
  \ 的 Java 组件可以在 GitHub 上找到，并存在于多个项目中，包括 `http://mng.bz/aJyJ`。\n\n关于如何实现完整的可观测性解决方案（无论基于\
  \ OpenTelemetry 还是其他栈）的充分讨论超本书的范围，但基础扎实的 Java 开发者应该充分探索这一领域。\n\n与可观测性相关的，是非 Java/VM\
  \ 专家可能没有意识到的某些性能细微差别。让我们仔细观察。\n\n### 12.5.2 容器中的性能\n\n许多开发者在将 Java 应用程序迁移到容器时，会尝试使用尽可能小的容器。这看起来是有道理的，因为云应用程序通常根据使用的\
  \ RAM 和 CPU 数量计费。\n\n然而，JVM 是一个非常动态的平台，某些重要参数会在 JVM 启动时根据 JVM 运行机器的观察到的属性自动确定。\n\
  \n这些属性包括 CPU 的类型和数量以及物理内存。在不同大小的机器上运行时，运行应用程序的行为可能会并且会有所不同——这包含了容器。其中一些动态属性如下：\n\
  \n* JVM 内置 (Intrinsics)——一种可以利用特定 CPU 特性的 JIT 技术（例如向量支持）\n* 内部线程池的大小（例如“公共池”）\n\
  * 用于 GC 的线程数\n\n仅从这个列表就可以看出，错误选择容器的大小会导致与 GC 或通用操作相关的问题。然而，问题从根本上比这深。\n\n当前的 Java\
  \ 版本（包括 Java 17）在未显式指定 GC 的情况下，会执行某些动态检查并*工程化*（自动）决定使用的 GC。如果你没有指定收集器，那么逻辑如下：\n\n\
  * 如果机器是“服务器级”，则选择 G1（Java 8 使用 Parallel）。\n* 如果机器不是“服务器级”，则选择 Serial。\n\n服务器级机器的工作定义是：>=\
  \ 两个物理 CPU 且 >= 2 GB 内存\n\n这意味着，如果 Java 应用程序运行在看起来少于两个 CPU 和 2 GB 内存的机器上，除非显式选择了特定的收集器算法，否则将使用\
  \ Serial 算法。这通常不是团队想要的——并导致了以下最佳实践：\n\n> tip 始终在至少拥有两个 CPU 和 2 GB 内存的容器中运行 Java\
  \ 应用程序。\n\n\n\n\n同样重要的是，传统的 Java 应用生命周期包含多个阶段：引导、密集的类加载、预热（带有 JIT 编译），然后是长期的稳定状态（持续几天或几周），此时类加载和\
  \ JIT 相对较少。这种模型面临着云部署的挑战，因为在云环境中容器的生命周期可能短得多，且集群规模可能会被动态调整。\n\n在这个新世界中，Java 必须确保其在以下几个关键维度上保持竞争力，包括：\n\
  \n* 内存占用（Footprint）\n* 部署密度（Density）\n* 启动时间（Startup time）\n\n幸运的是，目前正有针对这些特性的持续优化工作工作和研究——我们将在第\
  \ 18 章详细介绍。\n\n## 总结\n\n* 容器从根本上改变了我们打包和部署应用程序的方式，并需要一些新技术和新。\n* 容器代表了在过去经典的操作系统、虚拟机管理程序和虚拟机（VM）之上的另一层抽象。\n\
  * Docker 是构建、发布和运行容器镜像最常用的工具。\n* 我们通过 `Dockerfile` 指定容器镜像。生成的镜像包含了我们的应用程序以及运行它所需的完整环境，包括\
  \ JVM、原生依赖项和额外工具。\n* 容器为网络引入了额外的层。在最基本的形式中，我们必须管理容器暴露的端口，以便它们被外部访问。\n* 大规模运行容器集群需要处理大量工作，因此使用编排器来系统地完成这些工作。最流行的选择是\
  \ `Kubernetes`。\n* Kubernetes 提供了一个丰富且可扩展的 API，用于声明系统的预期状态并在运行时将其实现。它可以通过命令行和 REST\
  \ API 访问，并且周围拥有庞大的支持工具生态系统。\n* 容器的一个关键特性是强制执行资源限制。这些对内存和 CPU 的限制会对运行在容器中的应用程序产生性能影响。\n\
  \n# 13 测试基础\n\n本章涵盖\n\n* 为什么要测试\n* 我们如何测试\n* 测试驱动开发（Test-driven development）\n*\
  \ 测试双胞（Test doubles）\n* 从 `JUnit 4` 到 5\n\n在近年的编程领域，自动化测试作为开发过程中的不可或缺的一部分已得到广泛的接受。开发者不仅在本地运行测试，还在构建和持续集成环境中运行测试，以确保我们的系统运行正常。随之而来的是各种工具、方法和理念的爆炸式增长。\n\
  \n与任何技术一样，没有万灵药——没有哪种测试方法可以涵盖所有可能的情况。因此，理解*为什么*要测试至关重要，以便你确定最好的*如何*进行测试。\n\n## 13.1\
  \ 为什么要测试\n\n事实上，“测试”（*test*）这个词隐藏了我们检查代码行为的多种可能原因。以下是一个待考虑的非详尽（且有时会重叠）的列表：\n\n*\
  \ 确认单个方法的逻辑是否正确\n* 确认代码中两个对象之间的交互性\n* 确认库或其他外部依赖项的行为符合预期\n* 确认系统部分产生或消耗的数据是有效的\n\
  * 确认系统与外部组件（如数据库）能够正常工作\n* 确认系统的端到端行为符合重要的业务场景\n* 为后来的维护者记录假设（因为测试不会像注释和文档那样出现不同步）\n\
  * 通过暴露紧耦合和对象职责来影响你的系统设计\n* 自动化发布后的检查清单（否则这些清单将由人工执行）\n* 通过随机输入发现代码中意外之外的边界情况\n\n\
  即使是这个简短的测试动机列表也说明，“测试你的代码”这一简单的想法并不一定简单。因此，当我们进行测试时，需要问自己以下问题：\n\n* 我测试这段代码的动机是什么？\n\
  * 哪些技术能让我最准确、干净地实现该目标？\n\n## 13.2 我们如何测试\n\n讨论不同类型测试时最常用的工具之一是测试金字塔（Testing Pyramid），如图\
  \ 13.1 所示。它源于 Mike Cohn 的书籍《敏捷成功》（Addison-Wesley Professional, 2009），金字塔表达了平衡不同类型测试成本的一种方法，以最大化它们对我们的帮助。\n\
  \n```\n![](img/CH13_F01_Evans2.png)\n```\n\n图 13.1 测试金字塔\n\n尽管网上对于这些类型测试之间的确切边界争论激烈，但核心思想是非常用的。\n\
  \n注意，这些类型的测试*不是*由你使用的工具定义的——你并不是仅仅因为在使用 `JUnit` 就在编写单元测试，而使用规范库并不能保证你确实创建了让利益相关者受益的可用验收测试。这些类型的测试关注的是我们想要执行和证明的内容。\n\
  \n*单元测试（*Unit tests*）构成了金字塔的基础。这些是专注于系统某个方面的重点测试。然而，我们所说的“一个方面”是指什么？最简单部分是被测代码与外部依赖项的关系。如果你的测试在对结果进行某些逻辑处理之前调用了数据库，那么你就不是在测试“一个”东西了——你现在既在测试数据库检索，又测试你的逻辑是否有效。此类外部依赖项通常还包括网络服务或文件。\n\
  \n避免违反这种单一关注点的常用方法是使用*测试双胞（*test doubles*）——例如，让我们的单元测试与伪对象通信而不是真实的数据库。我们将在下一节详细讨论这一点，但基本思想是，这种伪造有很多种类型，如果想要做好，我们需要考虑许多必要的事项。\n\
  \n单元测试由于许多原因而具有吸引力，因此在测试金字塔中传统上占据最大的部分。这些原因包括：\n\n* 快速（*Fast*）——如果一个测试没有外部依赖项，执行它不应该花费长时间。\n\
  * 聚焦（*Focused*）——通过只谈论代码的某个“单元”，测试表达的内容通常比更大、设置更复杂的测试更清晰。\n* 可靠的失败（*Reliable failure*）——减少外部依赖项（特别是对外部状态的依赖）有助于使单元测试更具确定性。\n\
  \n这一切听起来都很棒，那么为什么我们不一直只写单元测试呢？事实是，单元测试具有局限性，使其无法在我们需要测试的每个规模上发挥作用。这些问题包括：\n\n* 紧耦合（*Tight\
  \ coupling*）——因为单元测试从定义上与其实现密切相关，它们也容易过紧地绑定到这些实现选择。当底层实现发生变化时，整个单元测试套失效并不常见。\n*\
  \ 缺失意义的交互（*Missing meaningful interactions*）——虽然将我们的代码想象成一群各忙各的对象很有吸引力，但现实是程序的真实工作包含了这些依赖部分之间的交互，而单元测试会遗漏这些。\n\
  * 内部聚焦（*Inwardly focused*）——测试的目标通常是证明我们软件的终端用户获得正确的结果。单个方法的正确性很少能真正转化为用户的满意。\n\n\
  *集成测试（*Integration tests*）*位于金字塔上方的下一级，打破了单元测试中关于与依赖项通信的限制。集成测试跨越了这些边界，实际上可能专注于确保系统不同部分之间的无缝集成。\n\
  \n\n\n\n\n与单元测试一样，集成测试也可能只选择系统的部分部分进行测试。某些依赖（例如外部服务）仍然可以用测试双胞（test doubles）替换，而另一些依赖（例如数据库）则在测试范围内。关键在于，这些测试在范围上超出了单一的代码“单元”。\n\
  \n单元测试和集成测试之间的确切界限可能是模糊的。不过，这里有一些例子清楚地跨越了界限，进入了集成测试领域：\n\n* 你需要一个数据库实例并对你的数据访问代码进行调用。\n\
  * 你启动了一个特殊的进程内 HTTP 服务器，并对其发送请求进行测试。\n* 你对另一个服务进行实际调用（无论是否在测试环境中）。\n\n集成测试具有许多优点，如下所示：\n\
  \n* `更广泛的覆盖范围`——集成测试无疑会运行你更多的代码以及你所依赖的库的代码。\n* `更多验证`——某些类型的错误可能只有在使用真实依赖项时才能被检测到。例如，如果不调用实际数据库，`SQL`\
  \ 语句中的语法错误将很难发现。\n\n当然，任何选择都是存在权衡的。如果管理不当，集成测试可能会成为巨大痛苦的源头，原因如下：\n\n* `测试运行缓慢`——访问真实数据库而不是从内存中读取值要慢得多。将这种差异乘以数百或数千次测试，你可能会发现自己一直在等待……非常久。\n\
  * `非确定性结果`——外部依赖增加了重要状态在测试运行之间发生改变的概率。例如，留在数据库中的记录可能会改变 `SQL` 语句返回的结果。\n* `虚假的安全感`——集成测试有时使用的依赖与主系统的依赖存在细微差异。例如，如果测试数据库的版本与生产环境不同，集成测试可能会在实际上并不正常的情况下错误地暗示一切正常好。\n\
  \n尽管有这些困难，集成测试仍然是测试版图中至关重要的部分。\n\n`端到端测试`（End-to-end tests）超越了集成测试，旨在复制系统的完整用户体验。这可能意味着通过程序驱动网络浏览器或其他应用程序，或者在测试环境中运行完全部署的服务实例。端到端测试带来了以下优势，这些优势在系统的较低层次是难以实现的：\n\
  \n* `“真实的”用户体验`——一个良好的端到端测试接近用户看到的内容。这让我们能够直接验证用户的高层预期。\n* `“真实的”环境`——许多端到端测试在测试环境、分阶段环境甚至生产环境中运行。这验证了我们的代码在舒适的、精心管理的构建环境之外能够工作。\n\
  * `UI 可用`——许多端到端测试方法（如驱动网络浏览器的方法）可以看到系统的某些方面（例如，按钮是否已渲染以便可以点击），这些方面在其他地方都可能难以验证。\n\
  \n但我们端到端测试中这种更高的现实也伴随着以下一系列严峻的困难：\n\n* `更慢的测试`——许多单元测试几乎是瞬间完成，即使集成测试通常也能在亚秒内完成，而一个控制网络浏览器遍历网站的端到端测试运行必然需要长得的时间。\n\
  * `不稳定测试（Flaky tests）`——从历史上看，端到端测试工具（特别是 UI 的工具）容易不稳定，需要重试和长时间超时以避免不必要的失败。\n* `脆弱测试（Brittle\
  \ tests）`——由于端到端测试位于金字塔顶端，下方任何层的更改都可能导致失败。看似无害的文本更改可能会无意中破坏这些庞大的测试。\n* `更难调试`——因为端到端测试通常引入了另一个驱动测试的层，所以弄清楚哪里出了问题通常是一件差事。\n\
  \n有了这个金字塔，你可能想问：“层与层之间测试的正确比例是多少？”事实并没有单一的答案。每个项目和系统的需求都是不同的。但金字塔可以帮助你指导在如何选择测试系统中的每项功能时的其优缺点。\n\
  \n虽然这无疑不是唯一的方法，但基础扎实的开发者可能会发现，测试驱动开发有助于在系统演进过程中保持这些不同层次测试的清晰。\n\n## 13.3 测试驱动开发\n\
  \n测试驱动开发（`TDD`）在软件开发行业已经存在很长时间了。它的基本前提是在实现过程中编写测试，而不是在之后编写，而且这些测试会影响代码的设计。一种通常推荐的\
  \ `TDD` 方法被称为“测试先行”（test first），即实际上在提供实现之前实际上编写一个会失败的测试，然后根据需要进行重构。例如，为了编写一个连接两个字符串对象（`\"\
  foo\"` 和 `\"bar\"`）的实现，你会先写测试（测试结果必须等于 `\"foobar\"`），以确保你知道你的实现是正确的。虽然许多开发者都会编写测试，但通常情况下，他们是在实现之后编写测试的，从而丢失了\
  \ `TDD` 的一些主要优势。\n\n尽管表面上无处不在，但许多开发者并不理解为什么要进行 `TDD`。对许多开发者来说的问题仍然是：“为什么要写测试驱动的代码？有什么好处？”\n\
  \n我们认为`消除恐惧和不确定性`是你应该编写测试驱动代码的首要原因。Kent Beck（`JUnit` 测试框架的共同发明者）在他的书《Test-Driven\
  \ Development: By Example》（Addison-Wesley Professional, 2002）中也对此总结得非常到位：\n\n* 恐惧让你畏首畏尾。\n\
  * 恐惧让你变得不愿交流。\n* 恐惧让你逃避反馈。\n* 恐惧让你变得暴躁。\n\n`TDD` 消除了恐惧，让基础扎实的 `Java` 开发者成为更有信心、更愿意交流、更乐于接受且更快乐的开发者。\n\
  \n\n\n\n# 注意\n\n处理测试很少或没有测试的现有代码是一项艰巨的任务。几乎不可能事后地补全所有测试。相反，你应该为你添加的每个新功能简单添加测试。需要更多帮助，请参考\
  \ Michael Feathers 的优秀著作《重构 legacy 代码》（*Working Effectively with Legacy Code*，Prentice\
  \ Hall, 2004）。\n\n我们将简要介绍 TDD 背后的“红-绿-重构”假设，使用 `JUnit` 为计算剧院门票收入的代码编写驱动测试。如果你对 `JUnit`\
  \ 框架熟悉，我们建议查看在线用户指南（参见 [`junit.org/junit5/docs/current/user-guide`](https://junit.org/junit5/docs/current/user-guide)），或者为了更多细节，可以参考\
  \ Cătălin Tudose 写的《JUnit 实战》（*JUnit in Action*, Manning, 2020; [`mng.bz/gwOR`](http://mng.bz/gwOR)）。让我们通过计算剧院门票收入，从\
  \ TDD 三个基本步骤——红-绿-重构循环的运行示例开始。\n\n## 13.3.2 单用例例的 TDD 示例\n\n如果你是一个丰富的 TDD 实践者，可能想跳过这个小示例，尽管我们会提供一些新的见解。假设你被要求编写一个健壮的方法来计算销售剧院门票产生的收入。来自剧院会计的初始业务规则非常简单，如下：\n\
  \n*   门票基价为 30 美元。\n*   总收入 = 售票数量 * 价格。\n*   剧院座位数 = 100 人。\n\n由于剧院没有良好的销售点软件，用户目前必须手动输入售票数量。\n\
  \n如果你练习过 TDD，你将熟悉 TDD 的三个基本步骤：红、绿、重构。如果你是 TDD 的初学者，或者想要简单复习一下，让我们看看 Kent Beck 在《测试驱动开发：实例》（*Test-Driven\
  \ Development: By Example*）中对这些步骤的定义：\n\n*   *红（Red）*——编写一个不起的小测试（失败的测试）。\n*   *绿（Green）*——尽快让该测试通过（通过的测试）。\n\
  *   *重构（Refactor）*——消除重复（精炼的通过测试）。\n\n为了让你对我们尝试实现的 `TicketRevenue` 实现有个直观的，这里是你脑海中可能存在的伪代码：\n\
  \n```\nestimateRevenue(int numberOfTicketsSold)\n  if (numberOfTicketsSold is less\
  \ than 0 OR greater than 100)\n    Deal with error and exit\n  else\n    revenue\
  \ = 30 * numberOfTicketsSold;\n    return revenue;\n  endif\n```\n\n注意，不要对这一点想得太深。测试最终将引导你的设计并部分引导你的实现。\n\
  \n### 编写失败的测试（红）\n\n这一步的重点是从一个失败的测试开始。事实上，该测试甚至无法编译，因为你甚至还没有编写 `TicketRevenue` 类！\n\
  \n\n\n\n```java\nimport java.math.BigDecimal;\n\npublic class TicketRevenue {\n\n\
  \  private final static int TICKET_PRICE = 30;                          ❶\n\n  public\
  \ BigDecimal estimateTotalRevenue(int numberOfTicketsSold) {\n    BigDecimal totalRevenue\
  \ = BigDecimal.ZERO;\n\n    if (numberOfTicketsSold == 1) {\n      totalRevenue\
  \ = new BigDecimal(TICKET_PRICE *                     ❷\n                      \
  \              numberOfTicketsSold);\n    }\n\n    return totalRevenue;\n  }\n}\n\
  ```\n\n❶ 无魔法数字\n\n❷ 重构后的计算\n\n重构改进了代码，但显然它还没有涵盖所有潜在的用例（例如：负数、`0`、`2–100` 以及 `> 100`\
  \ 票销量）。\n\n与其试图猜测其他用例的实现应该什么样，你应该让进一步的测试来驱动设计和实现。下一节将通过这个票务收入示例中的更多用例，继续介绍测试驱动设计。\n\
  \n## 一个包含多个用例的 TDD 示例\n\n一种特定的 TDD 风格是针对我们之前提出的负数、`0`、`2–100` 和 `> 100` 票销量用例，一次添加一个测试。但预先写一组测试用例也是完全有效的，特别是当它们与原始测试相关时。\n\
  \n请注意，在这里遵循“红-绿-重构”（red-green-refactor）周期仍然非常重要。在添加了所有这些用例后，你可能会得到一个带有失败测试（红色）的测试类，如下：\n\
  \n```java\nimport org.junit.jupiter.api.BeforeEach;\nimport org.junit.jupiter.api.Test;\n\
  \nimport java.math.BigDecimal;\n\nimport static org.junit.jupiter.api.Assertions.*;\n\
  \npublic class TicketRevenueTest {\n\n  private TicketRevenue venueRevenue;\n  private\
  \ BigDecimal expectedRevenue;\n\n  @BeforeEach\n  public void setUp() {\n    venueRevenue\
  \ = new TicketRevenue();\n  }\n\n  @Test\n  public void failIfLessThanZeroTicketsAreSold()\
  \ {                         ❶\n    assertThrows(IllegalArgumentException.class,\n\
  \                 () -> venueRevenue.estimateTotalRevenue(-1));\n  }\n\n  @Test\n\
  \  public void zeroSalesEqualsZeroRevenue() {                               ❷\n\
  \    assertEquals(BigDecimal.ZERO, venueRevenue.estimateTotalRevenue(0));\n  }\n\
  \n  @Test\n  public void oneTicketSoldIsThirtyInRevenue() {                    \
  \       ❸\n    expectedRevenue = new BigDecimal(\"30\");\n    assertEquals(expectedRevenue,\
  \ venueRevenue.estimateTotalRevenue(1));\n  }\n\n  @Test\n  public void tenTicketsSoldIsThreeHundredInRevenue()\
  \ {                    ❹\n    expectedRevenue = new BigDecimal(\"300\");\n    assertEquals(expectedRevenue,\
  \ venueRevenue.estimateTotalRevenue(10));\n  }\n\n  @Test\n  public void failIfMoreThanOneHundredTicketsAreSold()\
  \ {                   ❺\n    assertThrows(IllegalArgumentException.class,\n    \
  \             () -> venueRevenue.estimateTotalRevenue(101));\n  }\n}\n```\n\n❶ 负数销量用例\n\
  \n❷ 0 销量用例\n\n❸ 1 销量用例\n\n❹ N 销量用例\n\n❺ > 100 销量用例\n\n通过所有测试（绿色）的初始基础实现看起来如下：\n\n\
  ```java\nimport java.math.BigDecimal;\n\npublic class TicketRevenue {\n  public\
  \ BigDecimal estimateTotalRevenue(int numberOfTicketsSold)\n    throws IllegalArgumentException\
  \ {\n\n    if (numberOfTicketsSold < 0) {\n      throw new IllegalArgumentException(\
  \                   ❶\n                  \"Must be > -1\");\n    }\n\n    if (numberOfTicketsSold\
  \ == 0) {\n      return BigDecimal.ZERO;\n    }\n\n    if (numberOfTicketsSold ==\
  \ 1) {\n      return new BigDecimal(\"30\");\n    }\n\n    if (numberOfTicketsSold\
  \ == 101) {\n      throw new IllegalArgumentException(                   ❷\n   \
  \               \"Must be < 101\");\n    }\n\n    return new BigDecimal(30 * numberOfTicketsSold);\
  \        ❸\n  }\n}\n```\n\n❶ 异常情况\n\n❷ 异常情况\n\n❸ N 销量用例\n\n完成实现后，你现在有了通过测试的测试。\n\
  \n同样，通过遵循 TDD 周期，你现在将重构该实现。例如，你可以将非法的 `numberOfTicketsSold` 情况（< 0 或 > 100）合并到一个\
  \ `if` 语句中，并使用公式（`TICKET_PRICE * numberOfTicketsSold`）返回所有其他情况的收入。\n\n```java\n\
  import java.math.BigDecimal;\n\npublic class TicketRevenue {\n\n  private final\
  \ static int TICKET_PRICE = 30;\n\n  public BigDecimal estimateTotalRevenue(int\
  \ numberOfTicketsSold)\n    throws IllegalArgumentException {\n\n    if (numberOfTicketsSold\
  \ < 0 || numberOfTicketsSold > 100) {\n      throw new IllegalArgumentException(\"\
  Must be between 0 and 100\");\n    }\n\n    return new BigDecimal(TICKET_PRICE *\
  \ numberOfTicketsSold);\n  }\n}\n```\n\n❶ 异常情况\n\n❷ 所有其他情况\n\n`TicketRevenue` 类现在更加紧凑，而且通过了所有测试！\n\
  \n## 13.4 测试替体（Test doubles）\n\n当你继续编写代码时，很快就会遇到引用某些依赖的情况。在这种情况下，你通常希望测试尽可能运行，特别是当你的目标是单元测试时。调用第三方依赖或子系统（例如数据库）可能会花费大量时间，这意味着你失去了\
  \ TDD 的反馈优势。*测试替体*（Test doubles）是解决问题的方案。\n\n在本节中，你将学习测试替体如何帮助你有效地隔离依赖和子系统。你将通过使用四种类型（代理\
  \ dummy、存桩 stub、假实现 fake、模拟 mock）的示例。我们还将查看测试替体带来的一些危险和困难。\n\n我们喜欢 Gerard Meszaros\
  \ 在他的书籍 *xUnit Test Patterns*（Addison-Wesley, 2007）中对测试替体的简单解释，所以我们乐意引用他的话：“*测试替体*（想象成替身\
  \ Stunt Double）是用于测试目的而替代真实对象的任何虚假对象的通用术语。”\n\nMeszaros 定义了四种测试替体，如表 13.1 所示。\n\n\
  表 13.1 四种类型的测试替体\n\n| 类型 | 描述 |\n| --- | --- |\n| Dummy (代理) | 一个被传递但从不被使用的对象；通常用于填充方法的参数列表\
  \ |\n| Stub (存桩) | 一个始终返回相同固定预设响应的对象；也可能包含一些虚拟状态 |\n| Fake (假实现) | 一个真实的运行实现（但不是生产环境质量或配置），可以替换真实的实现\
  \ |\n| Mock (模拟) | 一个表示一系列期望并提供预设响应的对象 |\n\n当你通过使用它们的代码示例时，这四种测试替体要容易理解得多。让我们现在就开始吧，从\
  \ dummy 对象开始。\n\n### 13.4.1 Dummy 对象\n\nDummy 对象是四种测试替体类型中最容易使用的一种。记住，它的设计是为了帮助填充参数列表，或满足你已知该对象永远不会被使用的强制性字段要求。在许多情况下，你甚至可以传递空对象（甚至是\
  \ `null`，尽管这不能保证安全）。\n\n回到剧院门票场景。对单个售票处的收入进行估计很好，但剧院的所有者已经开始考虑得更远了。需要对售出的票和预期的收入进行更好的建模，你听到会有更多的需求和复杂性即将到来。\n\
  \n\n\n\n你被要求跟踪售票情况，并允许某些票务提供 10% 的折扣价。看起来你需要一个 `Ticket` 类来提供一个计算折扣价的方法。你从熟悉的 TDD\
  \ 循环开始，编写一个失败的测试，重点关注一个新的 `getDiscountPrice()` 方法。你还知道需要两个构造函数：一个用于普通价格的票务，另一个用于票务面值可能变化的票务。`Ticket`\
  \ 对象最终将接收以下两个参数：\n\n- 客户名称——一个 `String`，在本次测试中完全不会被引用\n- 原始价格——一个在本次测试中将使用的 `BigDecimal`\n\
  \n你确定客户名称不会在 `getDiscountPrice()` 方法中被引用。这意味着你可以向构造函数传递一个虚拟对象（在这种情况下，是一个任意字符串 `\"\
  Riley\"`），如下代码所示：\n\n```\nimport org.junit.jupiter.api.Test;\n\nimport java.math.BigDecimal;\n\
  \nimport static org.junit.jupiter.api.Assertions.*;\n\npublic class TicketTest {\n\
  \n  private static String dummyName = \"Riley\";                   ❶\n\n  @Test\n\
  \  public void tenPercentDiscount() {\n    Ticket ticket = new Ticket(dummyName,\
  \                      ❷\n                                new BigDecimal(\"10\"\
  ));\n\n    assertEquals(new BigDecimal(\"9.0\"), ticket.getDiscountPrice());\n \
  \ }\n}\n```\n\n❶ 创建一个虚拟对象\n❷ 传入一个虚拟对象\n\n如你所见，虚拟对象（dummy object）的概念简单。\n\n为了让这个概念变得极其清晰，下面片段中的代码是\
  \ `Ticket` 类的部分实现：\n\n```\nimport java.math.BigDecimal;\n\npublic class Ticket {\n\
  \n  public static final int BASIC_TICKET_PRICE = 30;              ❶\n  private static\
  \ final BigDecimal DISCOUNT_RATE =               ❷\n                           \
  \           new BigDecimal(\"0.9\");\n\n  private final BigDecimal price;\n  private\
  \ final String clientName;\n\n  public Ticket(String clientName) {\n    this.clientName\
  \ = clientName;\n    price = new BigDecimal(BASIC_TICKET_PRICE);\n  }\n\n  public\
  \ Ticket(String clientName, BigDecimal price) {\n    this.clientName = clientName;\n\
  \    this.price = price;\n  }\n\n  public BigDecimal getPrice() {\n    return price;\n\
  \  }\n\n  public BigDecimal getDiscountPrice() {\n    return price.multiply(DISCOUNT_RATE);\n\
  \  }\n}\n```\n\n❶ 默认价格\n❷ 默认折扣率\n\n一些开发者会被虚拟对象搞糊涂——他们寻找并不存在的复杂性。虚拟对象非常直观：它们是任何为了避免\
  \ `NullPointerException` 并让代码运行而使用的旧对象。\n\n让我们转向下一种测试双胞（test double）。下一步（从复杂性角度考虑）是桩对象（stub\
  \ object）。\n\n### 13.4.2 桩对象 (Stub object)\n\n当你想要用每次都返回相同响应的对象替换真实实现时，通常会使用 `stub`\
  \ 对象。让我们回到电影票定价示例来看看实际操作。\n\n在实现 `Ticket` 类后，你从一个应得的假期回来，收件箱里的第一封邮件就是一个错误报告，指出你的\
  \ `tenPercentDiscount()` 测试现在间歇性失败。当你查看代码库时，你发现 `Ticket` 类现在使用一个具体的 `HttpPrice`\
  \ 类，该类实现了新引入的 `Price` 接口。正如名称所示，`HttpPrice` 会连接外部网站并可以在任何时候返回不同的值——或失败。\n\n这导致了测试失败，并且进一步污染了我们测试的目的。记住，你想要的只是对\
  \ 10% 折扣的计算进行单元测试！\n\n注意：调用第三方定价网站显然不是此测试的职责范围。独立的集成测试应该覆盖 `HttpPrice` 类及其第三方 `HttpPricingService`。\n\
  \n为了让我们的测试回到一个一致、稳定的状态，我们将使用桩（stub）来替换 `HttpPrice` 类。首先，让我们看看代码当前的状态，如下面的三个代码片段所示：\n\
  \n```\nimport org.junit.jupiter.api.Test;\n\nimport java.math.BigDecimal;\n\nimport\
  \ static org.junit.jupiter.api.Assertions.*;\n\npublic class TicketTest {\n\n  private\
  \ static String dummyName = \"Riley\";\n\n  @Test\n  public void tenPercentDiscount()\
  \ {\n    Price price = new HttpPrice();                    ❶\n    Ticket ticket\
  \ = new Ticket(dummyName, price);     ❷\n    assertEquals(new BigDecimal(\"9.0\"\
  ),               ❸\n                  ticket.getDiscountPrice());\n  }\n}\n```\n\
  \n❶ `HttpPrice`实现了 `Price`。\n❷ 创建 `Ticket`\n❸ 测试可能会失败。\n\n下一个片段显示了 `Ticket` 的新实现：\n\
  \n```\nimport java.math.BigDecimal;\n\npublic class Ticket {\n  private final String\
  \ clientName;\n  private final Price priceSource;\n  private final BigDecimal discountRate;\n\
  \n  private BigDecimal faceValue = null;\n\n  public Ticket(String clientName,\n\
  \                Price price,\n                BigDecimal discountRate) {      \
  \    ❶\n    this.clientName = clientName;\n    this.priceSource = price;\n    this.discountRate\
  \ = discountRate;\n  }\n\n  public BigDecimal getPrice() {\n    if (faceValue ==\
  \ null) {\n      faceValue = priceSource.getInitialPrice();    ❷\n    }\n\n    return\
  \ faceValue;\n  }\n\n  public BigDecimal getDiscountPrice() {\n    return faceValue.multiply(discountRate);\
  \        ❸\n  }\n}\n```\n\n❶ 更改后的构造函数\n❷ `getInitialPrice()` 调用\n❸ 未改变的计算\n\n为 `HttpPrice`\
  \ 提供完整实现会让我们走得太远，所以假设它调用了另一个类 `HttpPricingService`，如下所示：\n\n```\nimport java.math.BigDecimal;\n\
  \npublic interface Price {\n  BigDecimal getInitialPrice();\n}\n\npublic class HttpPrice\
  \ implements Price {\n  @Override\n  public BigDecimal getInitialPrice() {\n   \
  \ return HttpPricingService.getInitialPrice();    ❶\n  }\n}\n```\n\n❶ 返回随机结果\n\n\
  现在我们已经评估了损失，让我们思考一下想要测试的内容。我们的目标是证明 `Ticket` 类的 `getDiscountPrice()` 方法按预期工作。这不需要外部网站。\n\
  \n`Price` 接口为我们提供了缝隙，使我们将不稳定的 `HttpPrice` 实例替换为一致的 `StubPrice` 实现，如下：\n\n```\nimport\
  \ org.junit.jupiter.api.Test;\n\nimport java.math.BigDecimal;\n\nimport static org.junit.jupiter.api.Assertions.*;\n\
  \npublic class TicketTest {\n  @Test\n  public void tenPercentDiscount() {\n   \
  \ Price price = new StubPrice();               ❶\n    Ticket ticket = new Ticket(price);\
  \           ❷\n    assertEquals(new BigDecimal(\"9.0\"),          ❸\n          \
  \        ticket.getDiscountPrice());\n  }\n}\n```\n\n❶ `StubPrice` 桩\n❷ 创建 `Ticket`\n\
  ❸ 检查价格\n\n`StubPrice` 类是一个简单的类，它一致地返回 10 的初始价格，如下所示：\n\n```\nimport java.math.BigDecimal;\n\
  \npublic class StubPrice implements Price {\n  @Override\n  public BigDecimal getInitialPrice()\
  \ {\n    return new BigDecimal(\"10\");               ❶\n  }\n}\n```\n\n❶ 返回一致的价格\n\
  \n呼！现在测试再次通过了，同样重要的是，你可以无担心地重构剩余的实现细节。\n\n桩（stub）是一种实用的测试双胞，但有时你希望桩执行一些更接近生产系统的真实工作。为此，你使用假对象（fake\
  \ object）作为你的测试双胞。\n\n对于我们的票务应用程序，让我们假设数据库层为我们提供了一个处理票务的简单接口，如下：\n\n\n\n\n\n```java\n\
  package com.wellgrounded;\n\npublic interface TicketDatabase {\n    Ticket findById(int\
  \ id);\n    Ticket findByName(String name);\n    int count();\n\n    void insert(Ticket\
  \ ticket);\n    void delete(int id);\n}\n```\n\n我们管理单个演目的类需要与此数据库接口交互，并管理如检查是否溢卖等功能：\n\
  \n```java\npackage com.wellgrounded;\n\nimport java.math.BigDecimal;\n\npublic class\
  \ Show {\n    private TicketDatabase db;\n    private int capacity;\n\n    public\
  \ Show(TicketDatabase db, int capacity) {\n        this.db = db;\n        this.capacity\
  \ = capacity;\n    }\n\n    public void addTicket(String name, BigDecimal amount)\
  \ {\n        if (db.count() < capacity) {\n            var ticket = new Ticket(name,\
  \ amount);\n            db.insert(ticket);\n        } else {\n          throw new\
  \ RuntimeException(\"Oversold\");\n        }\n    }\n}\n```\n\n我们希望在不依赖关系型数据库完整实例的情况下对\
  \ `addTicket` 进行单元测试。这样的测试可能如下所示：\n\n```java\npackage com.wellgrounded;\n\nimport\
  \ org.junit.jupiter.api.Test;\nimport java.math.BigDecimal;\nimport static org.junit.jupiter.api.Assertions.*;\n\
  \npublic class ShowTest {\n    @Test\n    public void plentyOfSpace() {\n      \
  \  var db = new FakeTicketDatabase();     ❶\n        var show = new Show(db, 5);\n\
  \n        var name = \"New One\";\n        show.addTicket(name, BigDecimal.ONE);\n\
  \n        var mine = db.findByName(name);\n        assertEquals(name, mine.getName());\n\
  \        assertEquals(BigDecimal.ONE, mine.getAmount());\n    }\n}\n```\n\n❶ `FakeTicketDatabase`\
  \ 并不存在，但本着 TDD（测试驱动开发）的精神，我们将编写想要通过测试的代码。\n\n虽然我们可以通过存桩（stubbing）来实现这一点，但它会有巨大的缺点。我们必须对数据库上的\
  \ `count` 和 `insert` 方法进行存桩，而这些方法在测试中甚至是不可见的，这会使测试充斥着底层细节，并分散对实际目的的注意力。但困难远于此——每个测试都必须确保\
  \ `count` 与调用 `insert` 的次数之间是一致的。更糟糕的是，我们最后 `findByName` 的调用（旨在确保数据已保存）也需要存桩。但这种存桩本身就意味着断言是没用的——无论我们的实现代码是否正确，断言都会通过！存桩无法让我们准确地验证这一组紧密相关的动作。\n\
  \n伪造对象（fake object）提供了一个替代方案，它具有真实但简化的实现。下面所示的接口很容易通过对简单 `HashMap` 的包装器来提供：\n\n\
  ```java\npackage com.wellgrounded;\n\nimport java.util.HashMap;\n\nclass FakeTicketDatabase\
  \ implements TicketDatabase {\n    private HashMap<Integer, Ticket> tickets =  \
  \            ❶\n                                      new HashMap<>();\n    private\
  \ Integer nextId = 1;                             ❷\n\n    @Override\n    public\
  \ Ticket findByName(String name) {\n        var found = tickets.values()\n     \
  \           .stream()\n                .filter(ticket -> ticket.getName().equals(name))\n\
  \                .findFirst();\n        return found.orElse(null);\n    }\n\n  \
  \  @Override\n    public int count() {\n        return tickets.size();\n    }\n\n\
  \    @Override\n    public void insert(Ticket ticket) {\n        tickets.put(nextId,\
  \ ticket);\n        nextId++;\n    }\n\n    // 剩余方法可用资源文件\n}\n```\n\n❶ 我们的 map 在单元测试的生命周期内替代了数据库。\n\
  \n❷ 我们必须复制如数据库自动递增 ID 等功能。\n\n伪造对象，特别是当它们在具有强接口的项目共享时，可以作为支持单元测试的良好解决方案。它们并不适用于所有地方——如果我们的数据库接口允许我们传递\
  \ SQL 子句进行额外的过滤，这很快就会超出伪造对象的处理能力——但它们是一个很有用的工具。只需留意实现不要变得太大或太复杂，因为我们编写的每一行代码都可能是\
  \ Bug 的根源。\n\n### 13.4.4 Mock 对象（模拟对象）\n\n`Mock` 对象与你已经过的存桩测试副本（stub test doubles）有关，但存桩对象通常是非常笨拙的。例如，存桩通常通过伪造方法来始终返回相同的结果。这没有提供任何建模依赖状态行为的方法。\n\
  \n例如：你正尝试遵循 TDD，并编写一个文本分析系统。你的其中一个单元测试指示文本分析类统计特定博客文章“Java11”短语出现的次数。但由于该博客文章是第三方资源，存在许多可能的失败场景，这些场景与你正在编写的计数算法几乎无关。换句话说，被测试的代码不是隔离的，而且调用第三方资源可能非常耗时。以下是一些常见的失败场景：\n\
  \n*   由于组织防火墙的限制，你的代码可能无法访问互联网查询博客文章。\n*   博客文章可能已经移动且没有重定向。\n*   博客文章可能被编辑以增加或减少“Java11”出现的次数。\n\
  \n使用存桩，这种测试几乎无法编写，而且对于每个测试用例来说都极其冗长。这时 `mock 对象` 登场了。这是一种特殊的测试副本，你可以将其认为是一个可编程的存桩。使用\
  \ mock 对象非常简单：你告诉它期望哪些调用以及它应该如何响应。\n\n让我们通过一个使用 Mockito 的简单示例来看其实效果：\n\n```java\n\
  import org.junit.jupiter.api.Test;\nimport java.math.BigDecimal;\nimport static\
  \ org.junit.jupiter.api.Assertions.*;\nimport static org.mockito.Mockito.*;\n\n\
  public class TicketTest {\n  @Test\n  public void tenPercentDiscount() {\n    Price\
  \ price = mock(Price.class);       ❶\n\n    when(price.getInitialPrice())\n    \
  \  .thenReturn(new BigDecimal(\"10\"));   ❷\n\n    Ticket ticket = new Ticket(price,\
  \ new BigDecimal(\"0.9\"));\n    assertEquals(new BigDecimal(\"9.0\"), ticket.getDiscountPrice());\n\
  \n    verify(price).getInitialPrice();\n  }\n}\n```\n\n❶ 创建一个 mock\n\n❷ 为测试配置 mock\n\
  \n这种验证（verify）捕捉了存桩和 mock 之间的巨大区别。对于存桩，你的主要关注点是返回预设值。对于 mock，意图是*验证行为*，例如确切的调用。在实践中，Mockito\
  \ 功能丰富的 `mock()` 方法可以很容易地用于创建存桩（如果我们忽略验证），但对于程序员你来说，清楚你想要测试什么是非常重要的。\n\n你可以像使用普通对象一样使用\
  \ mock，并将其传递给 `Ticket` 构造函数的调用，无需任何额外的仪式。这使得 mock 对象成为 TDD 非常强大的工具。一些从业者并不真正使用其他类型的测试副本，而是倾向于几乎使用\
  \ mock 完成一切工作。但正如许多强大的工具一样，mock 也伴随着需要注意的锐边缘。\n\n### 13.4.5 Mock 的问题\n\n测试副本最大的困难之一恰恰在于它们是伪造的，因此它们的行为可能会偏离实际的生产系统。遗憾的是，这种情况在发生时，仍然让你感到一种温暖、安慰的感觉，认为你的测试已经完全覆盖了风险——直到现实的重击。\n\
  \n\n\n\n\n这些行为差异可能有多种形式。常见的包括：\n\n- 返回的负载（payloads）差异，特别是对于复杂的嵌套对象\n- 来自测试数据的序列化/反序列化差异\n\
  - 集合中项的顺序\n- 对错误条件的响应——要么没有抛出异常，要么抛出了不同类型的异常\n\n虽然没有万能的解决方案，但当我们将测试提升到集成测试层级时，往往可以发现这些问题。再次，如果我们牢牢记住在每组测试中测试的是*什么*，就可以将单元测试集中在局部逻辑上，并在其他地方使用集成测试来涵盖与依赖的交互。\n\
  \n接口的良好设计也有助于我们的测试替身（test doubles）。与其让服务类从 HTTP 调用返回原始内容字符串，不如返回特定的对象，这增加了测试替身的变化空间。为你的类抛出的异常定义精确的子类（包装更原始的异常类型），不仅能让你的代码更具表现力，而且更容易准确地进行\
  \ mock（模拟）。\n\nmock（模拟）如果随处使用，也会导致我们的测试过于模拟生产代码。当这种情况发生时，你实际代码中的每一行在测试配置中都有一行镜像代码，重新陈述了精确的预期调用。这种测试是非常脆弱的，在修改代码时往往会导致大量看似不相关的变动。\n\
  \nmock 时的这种脆弱性延伸到了单个参数的级别。虽然框架使得对传递的值可以做到极其精确，但请考虑你的测试是否真的需要验证该参数。正如我们在虚拟对象中看到的，对于某些测试用例，给定的值可能并不重要。mock\
  \ 框架提供了有效机制，允许像“任何整数”之类的语句存在，如果值不重要，这样的语句既明确了你的测试关注什么，又为生产代码的演进留出了空间。给你的测试留出呼吸的空间！\n\
  \n当测试在运行之前需要大量复杂的设置时，也会暴露问题。mock，特别是与依赖注入结合用时，可以让你在不经意间在类中堆积依赖项。如果你的测试设置比执行和验证结果所需的代码还要长，这提示你的类可能过于复杂，已经该重构了。测试设置也是观察违反“德特法则”（Law\
  \ of Demeter）的绝佳方法，该法则建议对象应该只与其直接邻居保持交互。如果你的测试设置需要处理与自己隔了许多层的对象，那么你的对象可能触及得太远了。\n\
  \n测试替身对于基础扎实的开发者来说是有价值的工具。在之前的讨论中我们展示了一点 `JUnit`，但我们还没有深入探索它。让我们仔细观察一下，并借此机会看看最新大版本\
  \ `JUnit 5` 的变化。\n\n## 13.5 从 JUnit 4 到 5\n\n`JUnit` 是一个基于 JVM 的 xUnit 风格测试框架实现，最初由\
  \ Kent Beck 和 Erich Gamma 开发。这种风格的单元测试被证明是通用且易用的，使 `JUnit` 成为 JVM 生态中最常用的库之一。\n\n\
  这种悠久的历史和广泛的使用带来了许多限制。`JUnit 4` 最初于 2006 年发布，在不破坏兼容性的情况下无法 lambda 表达式等功能。2017 年，`JUnit\
  \ 5` 发布，利用大版本更新的机会引入了重大变更。\n\n注意：下一章将花费大量时间关注其他工具和技术，但基础扎实的 Java 开发者几乎会遇到值得迁移到最新版本的\
  \ `JUnit` 代码。\n\n`JUnit 5` 最大的变化之一是它的打包方式。之前的版本是单体的，包含了用于编写测试的 API 以及运行和报告这些测试的支持，而\
  \ `JUnit 5` 将其拆分为更集中的包。`JUnit 5` 还放弃了对 `JUnit 4` 中自带的 Hamcrest 的外部依赖。\n\n`JUnit\
  \ 5` 位于完全全新的包——`org.junit.jupiter` 中，这意味着在迁移期间两个版本可以共存。稍后我们将更详细查看其机制。\n\n`JUnit\
  \ 5` 的两个主要依赖如下：\n\n- `org.junit.jupiter.junit-jupiter-api`——在你的测试代码中引用，提供编写测试所需的所有注解和辅助类。\n\
  - `org.junit.jupiter.junit-jupiter-engine`——这是运行 `JUnit 5` 测试的默认引擎。它只需要作为运行时而非编译时依赖，并且可以扩展或更换其他测试运行器。\n\
  \n在 `Gradle` 中，它看起来像这样，还有一个提示告诉 `Gradle` 在运行运行时使用新的 JUnit 部分：\n\n```\ndependencies\
  \ {\n  testImplementation(\"org.junit.jupiter:junit-jupiter-api:5.7.1\")\n  testRuntimeOnly(\"\
  org.junit.jupiter:junit-jupiter-engine:5.7.1\")\n}\n\ntasks.named<Test>(\"test\"\
  ) {\n  useJUnitPlatform()\n}\n```\n\n`Maven` 的等效写法如下。`Maven` 的 `surefire` 和 `failsafe`\
  \ 插件知道如何自动与 `JUnit 5` 工作，只要你的版本足够新（建议 2.22 或更高）：\n\n```xml\n<project>\n  <dependencies>\n\
  \    <dependency>\n      <groupId>org.junit.jupiter</groupId>\n      <artifactId>junit-jupiter-api</artifactId>\n\
  \      <version>5.7.1</version>\n      <scope>test</scope>\n    </dependency>\n\
  \    <dependency>\n      <groupId>org.junit.jupiter</groupId>\n      <artifactId>junit-jupiter-engine</artifactId>\n\
  \      <version>5.7.1</version>\n      <scope>test</scope>\n    </dependency>\n\
  \  </dependencies>\n</project>\n```\n\n如果你将这些项添加到 `JUnit 4` 项目并简单运行测试，你会发现一个奇怪的结果——套件可能会通过——但*实际上没有运行任何测试！*这是因为\
  \ `JUnit 5` 带有它自己的 `@Test` 注解。它默认不会识别使用旧 `org.junit` 版本的 `@Test` 标记的用例。\n\n从这里开始有两种路径。第一种是将所有导入旧注解的地方改为新版本。逐类地，你的测试套件将开始在\
  \ `JUnit 5` 下运行。这些转换可能我们需要稍后讨论。\n\n另一种方法是引入 `junit-vintage-engine` 的额外运行时依赖。该包利用\
  \ `JUnit 5` 更强大的插件能力，允许与 `JUnit 4`（甚至是 3）测试向后兼容。\n\n在 `Gradle` 中：\n\n```\ndependencies\
  \ {\n  testImplementation(\"org.junit.jupiter:junit-jupiter-api:5.7.1\")\n  testRuntimeOnly(\"\
  org.junit.jupiter:junit-jupiter-engine:5.7.1\")\n\n  testRuntimeOnly(\"org.junit.vintage:junit-vintage-engine:5.7.1\"\
  )\n}\n```\n\n在 `Maven` 中：\n\n```xml\n<project>\n  <dependencies>\n    <dependency>\
  \ <!-- ❶ -->\n      <groupId>junit</groupId>\n      <artifactId>junit</artifactId>\n\
  \      <version>4.13</version>\n      <scope>test</scope>\n    </dependency>\n \
  \   <dependency>\n      <groupId>org.junit.vintage</groupId>\n      <artifactId>junit-vintage-engine</artifactId>\n\
  \      <version>5.7.1</version>\n      <scope>test</scope>\n    </dependency>\n\
  \    <dependency> <!-- ❷ -->\n      <groupId>org.junit.jupiter</groupId>\n     \
  \ <artifactId>junit-jupiter-api</artifactId>\n      <version>5.7.1</version>\n \
  \     <scope>test</scope>\n    </dependency>\n    <dependency>\n      <groupId>org.junit.jupiter</groupId>\n\
  \      <artifactId>junit-jupiter-engine</artifactId>\n      <version>5.7.1</version>\n\
  \      <scope>test</scope>\n    </dependency>\n  </dependencies>\n</project>\n```\n\
  \n❶ 支持与 JUnit 5 并行运行 JUnit 4 测试\n\n❷ 我们的主要 JUnit 5 依赖，api 和 engine\n\n\n\n\n\n这种支持允许更平滑的过渡，因为你可以启用\
  \ `JUnit 5`，然后随着时间的推移逐个转换测试，而不是要求一次性迁移所有内容。不过值得注意的是，旧版本的支持确实有一些局限性，这些限制在 JUnit 用户指南\
  \ [`mng.bz/5Q61`](http://mng.bz/5Q61) 中有详细记录。\n\n随着新的包结构，许多类被重命名，以使其用法更加清晰和准确，显示如下：\n\
  \n*   `@Before` 更改为 `@BeforeEach`。\n*   `@After` 更改为 `@AfterEach`。\n*   `@BeforeClass`\
  \ 更改为 `@BeforeAll`。\n*   `@AfterClass` 更改为 `@AfterAll`。\n*   `@Category` 更改为 `@Tag`。\n\
  *   `@Ignored` 更改为 `@Disabled`（或者可以使用新的扩展模型 `ExecutionCondition` 处理）。\n*   `@RunWith`,\
  \ `@Rule 和 `@ClassRule` 被新的扩展模型取代。\n\n正如最后几点提到的，`JUnit 5` 的一个大特性是新的扩展模型，它涵盖了 JUnit\
  \ 早期版本中的许多独立功能。这些功能允许你在类之间共享行为——如测试设置、拆卸和期望设置等步骤——但它们以前无法紧密地结合在一起。\n\n例如，这里有一个基本的\
  \ `JUnit 4` 测试，它在测试运行之前需要启动服务器。它使用了 `ExternalResource` 类以及 `@Rule` 注解来要求在生命周期中的正确点调用它：\n\
  \n```\npackage com.wellgrounded;\n\nimport org.junit.Rule;\nimport org.junit.Test;\n\
  import org.junit.rules.ExpectedException;\nimport org.junit.rules.ExternalResource;\n\
  \nimport static org.junit.Assert.*;\n\npublic class PasswordCheckerTest {\n    private\
  \ PasswordChecker checker = new PasswordChecker();\n\n    @Rule                \
  \                                ❶\n    public ExternalResource passwordServer =\n\
  \                              new ExternalResource() {   ❷\n        @Override\n\
  \        protected void before() throws Throwable {\n            super.before();\n\
  \            checker.reset();\n            checker.start();\n        }\n\n     \
  \   @Override\n        protected void after() {\n            super.after();\n  \
  \          checker.stop();\n        }\n    };\n\n    @Test\n    public void ok()\
  \ {\n        assertTrue(checker.isOk(\"abcd1234!\"));\n    }\n}\n```\n\n❶ `@Rule`\
  \ 请求在每个测试之前/之后应用此规则。\n\n❷ `ExternalResource` 是 `JUnit` 专门为此类自定义设置/拆卸场景提供的。\n\n我们对\
  \ `ExternalResource` 的重写可以很容易地提取到另一个位置并在测试之间共享。\n\n`JUnit 5` 而是将测试生命周期拆分为由你实现的更小的接口。这些扩展随后可以应用于类级或测试方法级别，如下所示：\n\
  \n```\npackage com.wellgrounded;\n\nimport org.junit.jupiter.api.extension.AfterEachCallback;\n\
  import org.junit.jupiter.api.extension.BeforeEachCallback;\nimport org.junit.jupiter.api.extension.ExtensionContext;\n\
  \npublic class PasswordCheckerExtension\n    implements AfterEachCallback, BeforeEachCallback\
  \ {                     ❶\n\n    private PasswordChecker checker;\n\n    PasswordCheckerExtension(PasswordChecker\
  \ checker) {                    ❷\n        this.checker = checker;\n    }\n\n  \
  \  @Override\n    public void beforeEach(ExtensionContext context) {           \
  \          ❸\n        checker.reset();\n        checker.start();\n    }\n\n    @Override\n\
  \    public void afterEach(ExtensionContext context) {                      ❸\n\
  \        checker.stop();\n    }\n}\n```\n\n❶ 我们实现了 `AfterEachCallback` 和 `BeforeEachCallback`，以便像以前对每个测试方法执行那样被调用。`AfterAllCallback`\
  \ 和 `BeforeAllCallback` 也存在，用于替换 `@ClassRule` 功能。\n\n❷ 因为我们的扩展与测试类上的字段一起工作，所以我们需要在构造时将其传递。\n\
  \n❸ 回调像以前一样继续执行设置/拆卸工作。\n\n有了这个类，我们可以按照如下方式在测试中使用它：\n\n```\npackage com.wellgrounded;\n\
  \nimport org.junit.jupiter.api.Test;\nimport org.junit.jupiter.api.extension.RegisterExtension;\n\
  \nimport static org.junit.Assert.*;\n\npublic class PasswordCheckerTest {\n    private\
  \ static PasswordChecker checker = new PasswordChecker();\n\n    @RegisterExtension\
  \                                                     ❶\n    static PasswordCheckerExtension\
  \ ext =\n              new PasswordCheckerExtension(checker);                  \
  \     ❷\n\n    @Test\n    public void ok() {\n        assertTrue(checker.isOk(\"\
  abcd1234!\"));\n    }\n}\n```\n\n❶ `@RegisterExtension` 允许我们为测试实例化扩展。\n\n❷ 测试类上的字段必须是公共的才能与\
  \ `@RegisterExtension` 工作。\n\n如果扩展在构造时不需要参数，也可以使用 `@ExtendWith` 应用于类或方法定义，如下所示：\n\
  \n```\n@ExtendWith(CustomConfigurationExtension.class)\npublic class PasswordCheckerTest\
  \ {\n    // ....\n}\n```\n\n`JUnit 5` 对更高版本 JDK 的要求也清理了一些过去规则曾作为标准做法的角落。在 `JUnit\
  \ 4` 及更早版本中，检查测试方法是否抛出异常可以采取两种形式：\n\n```\npackage com.wellgrounded;\n\nimport org.junit.Rule;\n\
  import org.junit.Test;\nimport org.junit.rules.ExpectedException;\n\nimport static\
  \ org.junit.Assert.*;\n\npublic class PasswordCheckerTest {\n    private PasswordChecker\
  \ checker = new PasswordChecker();\n\n    @Rule\n    public ExpectedException ex\
  \ = ExpectedException.none();\n\n    @Test\n    public void nullThrows() {\n   \
  \     ex.expect(IllegalArgumentException.class);     ❶\n        checker.isOk(null);\n\
  \    }\n\n    @Test(expected = IllegalArgumentException.class) ❷\n    public void\
  \ alsoThrows() {\n        checker.isOk(null);\n    }\n}\n```\n\n❶ 测试方法上的基于规则的异常\n\
  \n❷ `@Test` 注解对期望异常的配置\n\n```\npackage com.wellgrounded;\n\nimport org.junit.jupiter.api.Test;\n\
  \nimport static org.junit.Assert.*;\n\npublic class PasswordCheckerTest {\n    private\
  \ static PasswordChecker checker = new PasswordChecker();\n\n    @Test\n    public\
  \ void nullThrows() {\n        assertThrows(IllegalArgumentException.class, () ->\
  \ {\n            checker.isOk(null);\n        });\n    }\n}\n```\n\n\n\n\n# 使用 Clojure\
  \ 进行基于属性测试\n\n在上一章节中，我们查看了指导测试的通用原则。现在，我们将深入探讨某些特定方法，以改进针对不同场景的测试。无论我们的目标是更清晰地测试依赖项、在测试代码中进行更好的通信，还是发现我们未曾考虑过的边界情况，JVM\
  \ 生态系统都提供了许多工具来帮助我们，我们将重点介绍其中几个。让我们从那个一直存在的难题开始：在编写集成测试时，如何有效地处理外部依赖项。\n\n## 14.1\
  \ 使用 Testcontainers 进行集成测试\n\n当我们从孤立的单元测试向金字塔上方移动时，会遇到各种障碍。针对真实数据库进行集成测试要求我们必须有一个可用的真实数据库！获得这种真实测试的益处意味着设置复杂性的巨大增加。这些外部系统的状态性也增加了测试失败的概率，这往往不是因为我们的代码有问题，而是因为测试之间留下了意料之外的状态。\n\
  \n多年来，这个问题已经通过许多方法得到了解决，从内存数据库到完全在事务中运行测试并进行自清理的框架。但这些解决方案通常会带来它们自己的边界情况和困难。\n\n\
  正如第 12 章讨论过的样，容器化技术为该问题提供了一个有趣的新方法。因为容器是瞬态的，它们非常适合为特定的测试运行而启动。由于它们封装了我们想要交互的真实数据库和其他服务，它们避免了内存数据库容易出现的细微替代不匹配问题。\n\
  \n### 14.1.1 安装 testcontainers\n\n在测试中利用容器的最简单方法之一是通过 `testcontainers` 库（请参见 [`www.testcontainers.org/`](https://www.testcontainers.org/)）。它它提供了一个\
  \ API，可以直接从我们的测试代码控制容器，并为常见依赖项提供了多种支持模块。核心功能通过 Maven 中的 `org.testcontainers.testcontainers`\
  \ JAR 包提供：\n\n```\n<dependency>\n  <groupId>org.testcontainers</groupId>\n  <artifactId>testcontainers</artifactId>\n\
  \  <version>1.15.3</version>\n  <scope>test</scope>\n</dependency>\n```\n\n或者 Gradle：\n\
  \n```test\ntestImplementation \"org.testcontainers:testcontainers:1.15.3\"\n```\n\
  \n### 14.1.2 一个使用 Redis 的示例\n\n如果你还记得，我们之前让剧院应用从 HTTP 服务下载价格。我们想为这些值引入一个缓存。虽然适当的缓存本身就是一个独立的课题，但假设我们决定将缓存外部化，而不是仅仅将值放在内存中。此处的典型数据存储器是\
  \ Redis（[`redis.io/`](https://redis.io/)））。Redis 暴露了极快的访问接口，用于获取、设置和删除键值对以及其他更复杂的数据结构。\n\
  \n我们已经为从 HTTP 服务查找数据而引入了 `Price` 接口（所示），它让我们能够灵活地将缓存作为一个独立的关注点添加：\n\n```java\npackage\
  \ com.wellgrounded;\n\nimport redis.clients.jedis.Jedis;\n\nimport java.math.BigDecimal;\n\
  \npublic class CachedPrice implements Price {\n    private final Price priceLookup;\n\
  \    private final Jedis cacheClient;\n\n    private static final String priceKey\
  \ = \"price\";       ❶\n\n    CachedPrice(Price priceLookup, Jedis cacheClient)\
  \ {   ❷\n        this.priceLookup = priceLookup;\n        this.cacheClient = cacheClient;\n\
  \    }\n\n    @Override\n    public BigDecimal getInitialPrice() {\n        String\
  \ cachedPrice = cacheClient.get(priceKey);   ❸\n        if (cachedPrice != null)\
  \ {\n            return new BigDecimal(cachedPrice);\n        }\n\n        BigDecimal\
  \ price =\n            priceLookup.getInitialPrice();                ❹\n       \
  \ cacheClient.set(priceKey,\n                        price.toPlainString());   \
  \        ❺\n        return price;\n    }\n}\n```\n\n❶ 我们将在 Redis 中缓存价格的键的名称\n❷ 我们使用\
  \ `Jedis` ([`github.com/redis/jedis`](https://github.com/redis/jedis)) 库来访问 Redis。\n\
  ❸ 检查缓存是否已经有了此价格\n❹ 如果我们没有价格，则使用提供的查找方法\n❺ 缓存我们刚刚获取的值\n\n在此时，值得停下来考虑我们想要测试系统的哪个方面。`CachedPrice`\
  \ 类的核心点是 Redis 和我们底层价格查找之间的交互。我们如何与 Redis 工作是关键，而 Testcontainers 让我们能够如下所示针对真实对象进行测试：\n\
  \n```java\npackage com.wellgrounded;\n\nimport org.junit.jupiter.api.Test;\nimport\
  \ org.testcontainers.containers.GenericContainer;\nimport org.testcontainers.junit.jupiter.*;\n\
  import org.testcontainers.utility.DockerImageName;\nimport redis.clients.jedis.*;\n\
  \nimport java.math.BigDecimal;\n\nimport static org.junit.jupiter.api.Assertions.assertEquals;\n\
  \n@Testcontainers\npublic class CachedPriceTest {\n    private static final DockerImageName\
  \ imageName =\n            DockerImageName.parse(\"redis:6.2.3-alpine\");\n\n  \
  \  @Container\n    public static GenericContainer redis = new GenericContainer(imageName)\n\
  \            .withExposedPorts(6379);\n\n    // 后续将测试...\n}\n```\n\n在测试的起始部分，我们看到了与\
  \ Testcontainers 连接的最基本形式。我们对整个测试类应用了 `@Testcontainers` 注解，让库知道它应该监控测试执行期间我们需要的容器。标记为\
  \ `@Container` 的字段随后请求我们的容器镜像 `\"redis:6.2.3-alpine\"` ，使用标准的 Redis 端口 6379。\n\n\
  当此测试类执行时（如图 14.1 所示），Testcontainers 会启动我们请求的容器。Testcontainers 将等待默认超时时间（60 秒）直到第一个映射端口可用，因此我们可以确信容器已准备好进行通信。`redis`\
  \ 字段允许我们获取主机名和端口等信息供后续使用。\n\n![](img/CH14_F01_Evans2.png)\n\n图 14.1 Testcontainers\
  \ 执行\n\n在我们容器 Redis 运行之后，我们可以进入实际测试。由于关键点是 Redis 与查找之间的交互——而不是底层查找的实际实现——我们可以重用先前的\
  \ `StubPrice`，它始终返回 10 以简化测试，如下所示：\n\n```java\n@Test\n    public void cached() {\n\
  \        var jedis = getJedisConnection();\n        jedis.set(\"price\", \"20\"\
  );                                          ❶\n\n        CachedPrice price =\n \
  \           new CachedPrice(new StubPrice(), jedis);                       ❷\n \
  \       BigDecimal result = price.getInitialPrice();\n\n        assertEquals(new\
  \ BigDecimal(\"20\"), result);                        ❸\n    }\n\n    @Test\n  \
  \  public void noCache() {\n        var jedis = getJedisConnection();\n        jedis.del(\"\
  price\");                                                ❹\n\n        CachedPrice\
  \ price = new CachedPrice(new StubPrice(), jedis);\n        BigDecimal result =\
  \ price.getInitialPrice();\n\n        assertEquals(new BigDecimal(\"10\"), result);\n\
  \    }\n\n    private Jedis getJedisConnection() {                             \
  \      ❺\n        HostAndPort hostAndPort = new HostAndPort(\n                 \
  \                       redis.getHost(),\n                                     \
  \   redis.getFirstMappedPort());\n        return new Jedis(hostAndPort);\n    }\n\
  ```\n\n❶ 设置一个与我们的 stub 价格不同的价格\n❷ 将 StubPrice 作为我们的查找方法，它将返回 10 而不是 20\n❸ 断言我们得到了缓存值\n\
  ❹ 删除 Redis 中任何先前的缓存值\n❺ 用于设置我们 Jedis 实例的辅助方法。\n\n\n\n\n\n需要注意的是，`getJedisConnection`\
  \ 方法是如何使用 Testcontainers 的配置来连接 Redis 的。虽然你可能观察到 `redis.getHost()` 的常见值（如 `localhost`），但在每个环境中这并不一定能保证。更好的做法向\
  \ Testcontainers 请求此类值，并保护我们未来这些值发生意外变化。\n\n虽然此处的自动启动容器非常方便，但了解如何更直接地控制它也是值得的。如果你的容器需要时间启动，这一点尤为重要，正如我们在稍后的示例（如需要特定\
  \ schema 的关系型数据库）中看到的那样。\n\n`@Container` 注解会识别它被应用于静态字段还是实例字段，如图 14.2 所示。当它被应用于静态字段时，容器将在整个测试类执行期间只启动一次。如果你将字段留在实例级别，那么每个单独的测试都将启动并停止容器。\n\
  \n![](img/CH14_F02_Evans2.png)\n\n图 14.2 字段与 `@Container`\n\n这指向了管理容器生命线的另一种潜在方法：如果我们想在整个测试套件中只运行一次容器呢？为了实现这一点，我们必须放弃\
  \ `@Container` 注解，并直接使用 `GenericContainer` 对象本身暴露的 API，如下：\n\n```\n private static\
  \ final DockerImageName imageName =\n            DockerImageName.parse(\"redis:6.2.3-alpine\"\
  );\n\n    public static GenericContainer redis = new GenericContainer(imageName)\n\
  \            .withExposedPorts(6379);\n\n    @BeforeAll\n    public void setUp()\
  \ {\n        redis.start();        ❶\n    }\n```\n\n❶ `start` 在实例上可以安全地调用多次——它只会为每个对象启动一次容器。\n\
  \n我们不需要提供 `tearDown` 来显式停止容器，因为 `testcontainers` 库会自动为我们处理这一点。\n\n虽然上一个示例为每个测试调用了\
  \ `start`，但 `redis` 对象可以移动到一个位置，以便在多个测试类之间安全地共享。\n\n### 14.1.3 收集容器日志\n\n如果你在命令行或\
  \ IDE 中运行这些测试，你可能会发现默认情况下容器没有输出。对于我们简单的 Redis 案例来说，这不是问题，但更复杂的设置或调试可能会让你希望对这些容器有更高的可见性。为了帮助这一点，Testcontainers\
  \ 允许访问其启动的容器的 `STDOUT` 和 `STDERR`。\n\n这种支持基于 JDK 的 `Consumer<>` 接口，该库自带了几个实现。你可以连接到标准日志提供程序，或者如我们将演示的那样，直接获取原始日志。\n\
  \n你可能会发现容器日志溢到你的主输出中很不方便，但当你需要它们时却必须做自定义处理也很痛苦。一种解决方案是接入支持以始终将它们捕到一个单独的位置，例如构建输出中的文件，如下所示：\n\
  \n```\n @Container                                                ❶\n    public\
  \ static GenericContainer redis =\n        new GenericContainer(imageName)\n   \
  \         .withExposedPorts(6379);\n\n    public static ToStringConsumer consumer\
  \ =                 ❷\n                                    new ToStringConsumer();\n\
  \n    @BeforeAll\n    public static void setUp() {\n        redis.followOutput(consumer,\n\
  \                           OutputType.STDOUT,\n                           OutputType.STDERR);\
  \                ❸\n    }\n\n    @AfterAll\n    public static void tearDown() throws\
  \ IOException {\n        Path log = Path.of(\"./build/tc.log\");               \
  \  ❹\n        byte[] bytes = consumer.toUtf8String().getBytes();\n        Files.write(log,\
  \ bytes,\n                    StandardOpenOption.CREATE);               ❺\n    }\n\
  ```\n\n❶ 我们再次使用 `@Container` 注解进行启动，因为它非常简单。\n\n❷ 我们的 `consumer` 实例将在测试期间收集日志。\n\
  \n❸ 将 consumer 挂载到我们的容器，同时请求 `STDOUT` 和 `STDERR`\n\n❹ 写入到方便的位置\n\n❺ 使用 `java.nio.Files`\
  \ 方便地写入文件内容\n\n### 14.1.4 一个 Postgres 示例\n\nRedis 由于其缺乏依赖、通常存储在那里的数据具有临时性以及容器启动速度快，提供了一个简单的示例。但传统集成测试中的那个棘手问题：关系型数据库呢？通常我们放入关系型存储中的数据对应用程序的真实功能最关键，但对其进行测试充满了过时数据、尴尬的模拟（mocking）和假阳性。\n\
  \nTestcontainers 支持各种不同的数据存储。这些封装在单独的模块中，必须引入。我们将演示使用 Postgres，但在 Testcontainers\
  \ 网站（[`www.testcontainers.org/modules/databases/`](https://www.testcontainers.org/modules/databases/））上，你会找到长长的其他选项列表。\n\
  \n我们在 Maven 中包含 Postgres 模块作为测试依赖，并包含主 Postgres 驱动，以便连接到我们的新数据库：\n\n```xml\n<dependency>\n\
  \  <groupId>org.postgresql</groupId>\n  <artifactId>postgresql</artifactId>\n  <version>42.2.1</version>\n\
  </dependency>\n<dependency>\n  <groupId>org.testcontainers</groupId>\n  <artifactId>postgresql</artifactId>\n\
  \  <version>1.15.3</version>\n  <scope>test</scope>\n</dependency>\n```\n\n或者 Gradle：\n\
  \n```\n implementation(\"org.postgresql:postgresql:42.2.1\")\n  testImplementation(\"\
  org.testcontainers:postgresql:1.15.3\")\n```\n\n重要的是此版本要与你正在使用的基础 `org.testcontainers:testcontainers`\
  \ 库匹配。\n\n特定的类封装了我们对 Postgres 容器的访问。它包含用于配置数据库名称和凭据等信息的辅助方法，如下：\n\n```java\npublic\
  \ static DockerImageName imageName =\n            DockerImageName.parse(\"postgres:9.6.12\"\
  ));\n\n    @Container\n    public static PostgreSQLContainer postgres =\n      \
  \  new PostgreSQLContainer<>(imageName)\n            .withDatabaseName(\"theater_db\"\
  )\n            .withUsername(\"theater\")\n            .withPassword(\"password\"\
  );\n```\n\n所有的生命周期管理考虑都适用于这里，额外的问题是关系型数据库在可以使用之前需要应用 schema。许多常见的数据库迁移项目可以从代码运行，但我们将仅演示直接使用\
  \ `JDBC`，以展示并没有发生任何神奇的魔法。\n\n首先，我们需要一个到容器实例的连接。使用 `JDBC` 类，我们如下使用来自 `postgres` Testcontainer\
  \ 对象的参数来设置它：\n\n```java\n private static Connection getConnection() throws SQLException\
  \ {\n        String url = String.format(\n                \"jdbc:postgresql://%s:%s/%s\"\
  ,\n                postgres.getHost(),\n                postgres.getFirstMappedPort(),\n\
  \                postgres.getDatabaseName());\n\n        return DriverManager.getConnection(url,\n\
  \                                            postgres.getUsername(),\n         \
  \                                   postgres.getPassword());\n    }\n```\n\n\n\n\
  \n\n```\n @BeforeAll\n    public static void setup() throws SQLException, IOException\
  \ {\n        var path = Path.of(\"src/main/resources/init.sql\");\n        var sql\
  \ = Files.readString(path);                    ❶\n        try (Connection conn =\
  \ getConnection()) {\n            conn.createStatement().execute(sql);         \
  \    ❷\n        }\n    }\n```\n\n❶ 在我们的示例中，一个 SQL 文件包含了我们的架构定义。\n\n❷ 应用 SQL\n\n\
  在架构就绪后，我们现在可以针对这个完整的、空的 Postgres 数据库运行测试，如下所示：\n\n```\n @Test\n    public void emptyDatabase()\
  \ throws SQLException {\n        try (Connection conn = getConnection()) {\n   \
  \         Statement st = conn.createStatement();\n            ResultSet result =\
  \ st.executeQuery(\"SELECT * FROM prices\");\n            assertEquals(0, result.getFetchSize());\n\
  \        }\n    }\n```\n\n如果你有其他抽象层，例如 `DAO`（数据访问对象）、`repositories` 或其他读取数据库的方法，它们与容器的连接都应该可以正常工作。\n\
  \n## 14.1.5 使用 Selenium 进行端到端测试的示例\n\n在容器中使用外部资源是集成测试的自然契合。类似的技术也适用于端到端测试。尽管这取决于你具体的系统，但端到端测试通常需要运行浏览器以确保\
  \ Web 应用程序按预期运行。\n\n从历史角度来看，通过代码驱动 Web 浏览器是一个敏感的问题。这些技术仍然脆弱且缓慢，但 `Testcontainers`\
  \ 通过让您在容器内部启动浏览器并在那里进行远程控制，消除了安装和配置的痛苦。\n\n与我们的 Postgres 示例一样，我们需要引入依赖项。在这种情况下，在\
  \ Maven 中，有一个用于支持 `Testcontainers` 的模块，以及我们的测试用于远程控制浏览器实例所需的库：\n\n```\n<dependency>\n\
  \  <groupId>org.testcontainers</groupId>\n  <artifactId>selenium</artifactId>\n\
  \  <version>1.15.3</version>\n  <scope>test</scope>\n</dependency>\n<dependency>\n\
  \  <groupId>org.seleniumhq.selenium</groupId>\n  <artifactId>selenium-remote-driver</artifactId>\n\
  \  <version>3.141.59</version>\n  <scope>test</scope>\n</dependency>\n<dependency>\n\
  \  <groupId>org.seleniumhq.selenium</groupId>\n  <artifactId>selenium-chrome-driver</artifactId>\n\
  \  <version>3.141.59</version>\n  <scope>test</scope>\n</dependency>\n```\n\n或 Gradle：\n\
  \n```\n testImplementation(\"org.testcontainers:selenium:1.15.3\")\n  testImplementation(\n\
  \    \"org.seleniumhq.selenium:selenium-remote-driver:3.141.59\")\n  testImplementation(\
  \                                                ❶\n    \"org.seleniumhq.selenium:selenium-chrome-driver:3.141.59\"\
  )\n```\n\n❶ 同样命名的包中也存在对其他 Web 浏览器的支持。特定的类用于配置浏览器实例。我们在这里传入 `ChromeOptions` 来表示我们正在启动特定的浏览器：\n\
  \n```\n @Container\n    public static BrowserWebDriverContainer<?> chrome =\n  \
  \      new BrowserWebDriverContainer<>()\n            .withCapabilities(new ChromeOptions());\n\
  ```\n\n有了这个实例，我们现在可以编写访问网页并检查结果的测试，如下所示：\n\n```\n @Test\n    public void checkTheSiteOut()\
  \ {\n        var url = \"https://github.com/well-grounded-java\";\n        RemoteWebDriver\
  \ driver = chrome.getWebDriver();\n        driver.get(url);                    \
  \                    ❶\n\n        WebElement title =\n                    driver.findElementByTagName(\"\
  h1\");          ❷\n        assertEquals(\"well-grounded-java\", title.getText());\n\
  \    }\n```\n\n❶ 导航到 well-grounded-java 的 GitHub 组织\n\n❷ 页面加载后，检查第一个 `<h1>` 的内容\n\
  \n这个简单的示例已经展示了端到端测试容易出现的脆弱性。如果 GitHub 重新设计了并决定在页面中添加另一个 `<h1>` 怎么办？如果他们以某种微妙的方式更改了标题文本呢？如果你在测试自己的应用程序，这可能不是什么大问题，但与表现层的紧密耦合仍然是一个问题。\n\
  \n在容器内运行时，如果情况不符合我们的，可能很难理解为什么。幸运的是，我们可以通过两种方式获得视觉反馈。\n\n首先，我们可以像这样在特定时间点截图：\n\n\
  ```\n @Test\n    public void checkTheSiteOut() {\n        RemoteWebDriver driver\
  \ = chrome.getWebDriver();\n        driver.get(\"https://github.com/well-grounded-java\"\
  );\n\n        File screen = driver.getScreenshotAs(OutputType.FILE);\n    }\n```\n\
  \n返回的文件是临时的，将在测试结束时删除，但你可以在创建后将其复制到代码的其他地方。\n\n看到不仅仅是一个时间点是很常见的。你也可以像下面请求自动录制会话视频：\n\
  \n```\n private static final File tmpDirectory = new File(\"build\");\n\n    @Container\n\
  \    public static BrowserWebDriverContainer<?> chrome =\n        new BrowserWebDriverContainer<>()\n\
  \            .withCapabilities(new ChromeOptions())\n            .withRecordingMode(RECORD_ALL,\n\
  \                                tmpDirectory,\n                               \
  \ VncRecordingFormat.MP4);\n```\n\n正如我们处理容器日志一样，这将在每次运行测试在我们的构建输出中生成录制。一旦出现问题，我们调试所需的一切已经在那里了。\n\
  \n这仅仅触及 `Testcontainers` 能让你实现的功能的一角。现在，让我们看看抛弃 JUnit，用一种不同的、可能更具读性的形式来编写我们的测试。\n\
  \n## 14.2 使用 Spek 和 Kotlin 进行规范风格测试\n\n`JUnit` 使用方法、类和注解的方式对于 Java 开发者来说非常自然。但无论我们是否意识到，它塑造了我们表达和分组测试的方式。虽然不是强制要求的，但我们通常会得到一个测试类对应一个生产类，并为每个实现方法配备一组松散的测试方法。\n\
  \n另一种想法是所谓的编写 `specifications.*`。这源于 `RSpec` 和 `Cucumber` 等框架，它并不关注我们代码的形状，而是旨在支持在更高层次上指定系统是如何工作的，这更符合人类讨论需求的方式。\n\
  \n这种测试的示例可以通过 Kotlin 里的 `Spek` 框架获得（参见 [`www.spekframework.org/`](https://www.spekframework.org/)\
  \ ）。正如我们将看到的，Kotlin 的许多内置功能允许我们的规范具有非常不同的组织形式和感觉。\n\n安装 Spek 遵循典型的依赖项处理流程。`Spek`\
  \ 完全关注我们如何组织规范，并依赖生态系统提供断言和测试运行等功能。为了简单起见，我们将使用 `JUnit 5` 的断言和测试运行器进行演示，但如果你有其他偏好的库，并不要求使用它们。\n\
  \n在 Maven 中，来自 11.2.6 节的 `maven-surefire-plugin` 只需要被告知我们的规范文件，我们将通过在文件名中包含 `Spek`\
  \ 来标记它们，如下所示。我们还需要 11.2.5 节描述的 Kotlin 支持（由于长度限制在此不再重复）：\n\n\n\n\n\n```xml\n <build>\n\
