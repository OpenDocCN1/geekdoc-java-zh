  \            <include>/*Spek.*</include>            ❶\n          </includes>\n \
  \       </configuration>\n      </plugin>\n    </plugins>\n  </build>\n\n  <dependencies>\n\
  \    <dependency>\n      <groupId>org.junit.jupiter</groupId>\n      <artifactId>junit-jupiter-api</artifactId>\
  \      ❷\n      <version>5.7.1</version>\n      <scope>test</scope>\n    </dependency>\n\
  \    <dependency>\n      <groupId>org.spekframework.spek2</groupId>\n      <artifactId>spek-dsl-jvm</artifactId>\n\
