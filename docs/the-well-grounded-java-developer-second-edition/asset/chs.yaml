  \ `MutableCallSite`（甚至是 `VolatileCallSite`），这些允许重新链接调用点的可能，使其能够随着时间的推移指向不同的目标方法。\n\
  \n非常数调用点在程序的生命周期内可以有许多不同的方法句柄作为目标。事实上，能够更改特定调用点调用的方法对于非 Java 语言来说是一项重要的技术。\n\n例如，在\
  \ JavaScript 或 Ruby 中，特定类型的单个对象可以定义方法，而这些方法在类的其他实例上不存在。这在 Java 中是不可能的——类定义了一组方法，在类加载时用于用于构造\
  \ vtable，且所有实例共享同一个 vtable。通过使用可变调用点的 `invokedynamic`，可以高效地实现这种非 Java 特性。\n\n我们应该指出，你无法让\
  \ `javac` 从普通方法调用中产生 `invokedynamic`——Java 方法调用始终会被转换为我们在第 4 章中遇到过的四种“常规”invoke\
  \ 字节码之一。相反， Java 框架和库（包括 JDK 中的内容）出于多种目的使用 `invokedynamic`。Lambda 表达式提供了其中这些目的之一的绝佳案例。让我们仔细观察一下。\n\
  \n### 17.4.1 实现 lambda 表达式\n\nLambda 已经渗透到 Java 编程中，但许多 Java 程序员并不真正知道它们是如何实现的。让我们从以下简单示例开始探索：\n\
  \n```java\npublic class LambdaExample {\n    private static final String HELLO =\
  \ \"World!\";\n\n    public static void main(String[] args) throws Exception {\n\
  \        Runnable r = () -> System.out.println(HELLO);\n        Thread t = new Thread(r);\n\
  \        t.start();\n        t.join();\n    }\n}\n```\n\n为了实现这种灵活性，`invokedynamic`\
  \ 字节码指令指向类常量池中的特殊区域，该区域包含了支持调用动态特性的扩展条目——即 BSMs。这些 BSM 是 `invokedynamic` 的关键部分，并且所有的\
  \ `invokedynamic` 调用点都有一个与 BSM 对应的常量池条目。\n\n[content]\n\n注意：为了允许将 BSM 与特定的 `invokedynamic`\
  \ 调用点关联，类文件格式中了一种新的常量池条目类型，也称为 `InvokeDynamic`。\n\n`invokedynamic` 指令的调用点在类加载时被认为是“未织入”的。这意味着调用点尚未关联任何目标方法，直到到达该调用点为止（即\
  \ JVM 尝试链接并执行该特定的 `invokedynamic` 指令时）。\n\n在此时，将会调用 BSM 来确定实际上应该调用哪种方法。BSM 总是返回一个\
  \ `CallSite` 对象（包含一个 `MethodHandle`），它会被“织入”到调用点中。一旦 `CallSite` 链接，就可以进行实际的方法调用——即指向\
  \ `CallSite` 持有的 `MethodHandle`。\n\n在最简单的情况下，当使用 `ConstantCallSite` 时，一旦完成一次查找将不再重复。相反，调用点的目标将在未来的所有调用中直接被执行，无需任何额外工作。它的行为类似于\
  \ `CompletableFuture<CallSite>`。在实践中，这意味着该调用点现在是稳定的，因此对其他 JVM 子系统（如 JIT 编译器）是友好的。也可以进行更复杂的选择，例如\
  \ `MutableCallSite`（甚至是 `VolatileCallSite`），这些允许重新链接调用点的可能，使其能够随着时间的推移指向不同的目标方法。\n\
  \n非常数调用点在程序的生命周期内可以有许多不同的方法句柄作为目标。事实上，能够更改特定调用点调用的方法对于非 Java 语言来说是一项重要的技术。\n\n例如，在\
  \ JavaScript 或 Ruby 中，特定类型的单个对象可以定义方法，而这些方法在类的其他实例上不存在。这在 Java 中是不可能的——类定义了一组方法，在类加载时用于用于构造\
  \ vtable，且所有实例共享同一个 vtable。通过使用可变调用点的 `invokedynamic`，可以高效地实现这种非 Java 特性。\n\n我们应该指出，你无法让\
  \ `javac` 从普通方法调用中产生 `invokedynamic`——Java 方法调用始终会被转换为我们在第 4 章中遇到过的四种“常规”invoke\
  \ 字节码之一。相反， Java 框架和库（包括 JDK 中的内容）出于多种目的使用 `invokedynamic`。Lambda 表达式提供了其中这些目的之一的绝佳案例。让我们仔细观察一下。\n\
  \n### 17.4.1 实现 lambda 表达式\n\nLambda 已经渗透到 Java 编程中，但许多 Java 程序员并不真正知道它们是如何实现的。让我们从以下简单示例开始探索：\n\
  \n\n\n\n\n`metafactory` 方法的源代码相对简单，如下所示：\n\n```\npublic static CallSite metafactory(MethodHandles.Lookup\
  \ caller,\n                                       String invokedName,\n        \
  \                               MethodType invokedType,\n                      \
  \                 MethodType samMethodType,\n                                  \
  \     MethodHandle implMethod,\n                                       MethodType\
  \ instantiatedMethodType)\n            throws LambdaConversionException {\n    \
  \    AbstractValidatingLambdaMetafactory mf;\n        mf = new InnerClassLambdaMetafactory(caller,\
  \ invokedType,\n                                             invokedName, samMethodType,\n\
  \                                             implMethod,\n                    \
  \                         instantiatedMethodType,\n                            \
  \                 false, EMPTY_CLASS_ARRAY,\n                                  \
  \           EMPTY_MT_ARRAY);\n        mf.validateMetafactoryArgs();\n        return\
  \ mf.buildCallSite();\n    }\n```\n\n`lookup` 对象对应于 `invokedynamic` 指令所在的上下文。在我们的情况下，它是定义\
  \ lambda 的同一个类，因此查找上下文将具有正确的权限来访问 lambda 体编译入的私有方法。\n\n`invoked name`（调用名称）和类型由\
  \ JVM 提供，属于实现细节。最后三个参数是来自 BSM（引导方法）的额外静态参数。\n\n在当前的 lambda 实现中，`metafactory` 委托给使用内部混淆过的\
  \ ASM 字节码库副本的代码，以启动一个实现目标类型的内部类。这在未来可能会发生变化。\n\n最后，我们应该注意，完全可以创建一个使用 `invokedynamic`\
  \ 执行特殊操作的自定义类，但要构造这样一个类，你必须使用一个字节码操作库来生成一个包含 `invokedynamic` 指令的 .class 文件。这的一个良好选择是\
  \ ASM 库（参见 [`asm.ow2.org/`](http://asm.ow2.org/)）。我们已经提到过这个库几次，它是广泛用于知名 Java 框架的工业级库（包括前面提到的\
  \ JDK 本体）。这意味着我们对 `invokedynamic` 的讨论结束，是时候开始讨论一些较小但仍然重要的内部变化了。\n\n## 17.5 小的内部变化\n\
  \n有时，小的变化会对语言产生巨大影响。在本节中，我们将遇到三个实现上的小内部变化，它们要么有助于性能，要么纠正了平台中的某些旧代码残留。让我们从字符串开始。\n\
  \n### 17.5.1 字符串拼接\n\n记住在 Java 中，`String` 的实例实际上是不可变的。那么，当你用 `+` 运算符拼接两个字符串时会发生什么？JVM\
  \ 必须创建一个新的 `String` 对象，但这里发生的情况比表面上看起来要多。\n\n考虑一个带有 `main()` 方法的简单类，如下：\n\n```\n\
  public static void main(String[] args) {\n  String str = \"foo\";\n  if (args.length\
  \ > 0) {\n    str = args[0];\n  }\n  System.out.println(\"this is my string: \"\
  \ + str);\n}\n```\n\n对应于这个相对简单方法的 Java 8 字节码如下：\n\n```\npublic static void main(java.lang.String[]);\n\
  Code:\n  0: ldc #17            // String foo\n  2: astore_2\n  3: aload_1\n  4:\
  \ arraylength\n  5: ifle 12                                                    \
  \           ❶\n  8: aload_1\n  9: iconst_0\n 10: aaload\n 11: astore_2\n  12: getstatic\
  \ #19      // Field java/lang/System.out:                     ❷\n              \
  \          // Ljava/io/PrintStream;                           ❷\n 15: new #25  \
  \          // class java/lang/StringBuilder                   ❸\n 18: dup      \
  \                                                             ❸\n 19: ldc #27  \
  \          // String this is my string:                       ❸\n 21: invokespecial\
  \ #29  // Method java/lang/                               ❸\n                  \
  \      // StringBuilder.\"<init>\"                          ❸\n                \
  \        // :(Ljava/lang/String;)V                          ❸\n 24: aload_2\n  25:\
  \ invokevirtual #32  // Method java/lang/StringBuilder.append\n                \
  \        // (Ljava/lang/String;)Ljava/lang/StringBuilder;\n 28: invokevirtual #36\
  \  // Method java/lang/                               ❹\n                      \
  \  // StringBuilder.toString:                         ❹\n                      \
  \  // ()Ljava/lang/String;                            ❹\n 31: invokevirtual #40\
  \  // Method java/io/                                 ❺\n                      \
  \  // PrintStream.println:                            ❺\n                      \
  \  // (Ljava/lang/String;)V                           ❺\n 34: return\n```\n\n❶ 如果数组为空，则跳转到指令\
  \ 12。\n\n❷ 将 `System.out` 加载到栈上\n\n❸ 设置 `StringBuilder`\n\n❹ 从 `StringBuilder` 创建字符串\n\
  \n❺ 打印字符串\n\n在这段字节码中，我们有几点需要注意。特别是 `StringBuilder` 的出现可能会让人有点惊讶——我们请求拼接某些字符串，但字节码告诉我们我们实际上在创建额外的对象，然后对它们调用\
  \ `append()`，然后调用 `toString()`。\n\n指令 15–23 显示了临时 `StringBuilder` 对象的创建模式（`new`、`dup`、`invokespecial`），但在这种情况下，构造还包括在\
  \ `dup` 之后的一个 `ldc`（加载常量）。这种变体模式表示你正在调用一个非空构造函数——`StringBuilder(String)`。\n\n这一切的原因是\
  \ Java 字符串（实质上）是不可变的。我们无法通过拼接来修改字符串内容，因此必须创建一个新对象，而 `StringBuilder` 只是实现这一点的一种方便方法。\n\
  \n然而，Java 11 的字节码形状完全不同：\n\n```\npublic static void main(java.lang.String[]);\n\
  Code:\n  0: ldc #2            // String foo\n  2: astore_2\n  3: aload_1\n  4: arraylength\n\
  \  5: ifle 12\n  8: aload_1\n  9: iconst_0\n 10: aaload\n 11: astore_2\n  12: getstatic\
  \ #3      // Field java/lang/System.out:\n                           // Ljava/io/PrintStream;\n\
  \ 15: aload_1\n  16: invokedynamic #4,  0  // InvokeDynamic #0:makeConcatConstants:\n\
  \                           // (Ljava/lang/String;)Ljava/lang/String;\n 21: invokevirtual\
  \ #5      // Method java/io/PrintStream.println:\n                           //\
  \ (Ljava/lang/String;)V\n 24: return\n```\n\n前 12 条指令与 Java 8 的情况相同，但之后开始变化。一个明显的变化是临时\
  \ `StringBuilder` 完全消失了。相反，在指令 16 处有一个 `invokedynamic`。这当然需要一个引导方法：\n\n```\nBootstrapMethods:\n\
  \  0: #23 REF_invokeStatic java/lang/invoke/StringConcatFactory.\n      makeConcatConstants:(Ljava/lang/invoke/MethodHandles$Lookup;\n\
  \      Ljava/lang/String;Ljava/lang/invoke/MethodType;\n      Ljava/lang/String;[Ljava/lang/Object;)Ljava/lang/invoke/CallSite;\n\
  \    Method arguments:\n      #24 this is my string: \\u0001\n```\n\n这是位于 `java.lang.invoke`\
  \ 包中的 `StringConcatFactory` 类的静态工厂方法 `makeConcatConstants()` 的动态调用。该工厂方法接收一个字符串——这些特定参数的拼接*配方*——并产生一个\
  \ `CallSite`，该位链接到此特定例的自定义方法。\n\n通常，这些是 JVM 实现代码深的机制。大多数普通的 Java 代码永远不会调用这些方法，而是依赖于调用它们的\
  \ JDK 代码以及库/框架。\n\n\n\n\n\n注意：引导方法的静态参数包含字符 `\\u0001`（Unicode 码 0001），它表示一个要插值到拼接配方中的普通参数。\n\
  \n`invokedynamic` 调用点可以重用，如果需要可以动态创建实现类。实现还可以访问私有 API——例如零拷贝 `String` 构造函数——这些 API\
  \ 是无法作为 `StringBuilder` 的一部分暴露的\n\n## 17.5.2 紧凑字符串 (Compact strings)\n\n当你初学 Java\
  \ 时，会接触基本类型，并了解到在 Java 中 `char` 占用两个字节。这并不难猜到，在底层，Java 字符串是使用 `char[]` 来存储字符串的单个字符。\n\
  \n然而，事实并非完全如此。在 Java 8 及更早版本中，`String` 的内容确实是用 `char[]` 表示的。但是，这种表示方式导致了可能不显而见的效率低下，让我们深入研究一下。\n\
  \nJava 的双字节 `char`（代表 UTF-16 字符）对于任何包含西欧语言字符的字符串来说都是浪费的，因为对于此类字符串，每个 `char` 的第一个字节始终为零。这浪费了这些语言近\
  \ 50% 的存储空间，而这些语言非常常见。\n\n为了解决这个问题，Java 9 引入了一种性能优化：它允许对每个字符串在（目前）两种表示之间进行选择。每个字符串可以被编码为\
  \ Latin-1（用于西欧语言）或 UTF-16（原始表示方式）。\n\n注意，Latin-1 也以标准编号 ISO-8859-1 知。尽量不要与 ISO-8851\
  \ 混淆，它是确定黄油含量的国际标准。\n\n在内部，字符串的表示已更改为 `byte[]`。如果包含 `n` 个字符的字符串是 Latin-1，则占用 `n`\
  \ 个字节；否则，占用 `n * 2` 个字节。`java.lang.String` 中的代码如下：\n\n```\nprivate final byte[]\
  \ value;\n\n/**\n * 用于编码 {@code value} 中字节的编码标识符。\n * 此实现中支持的值有：\n *\n * LATIN1\n\
  \ * UTF16\n *\n * @implNote 此字段受 VM 信任，如果 String 实例是常量，则会被\n * 常量折叠。在构造后重写此字段会导致问题。\n\
  \ */\nprivate final byte coder;\n\nstatic final byte LATIN1 = 0;\nstatic final byte\
  \ UTF16  = 1;\n```\n\n根据工作负载的性质，这在常见的 Latin-1 情况下会导致显著节省。另一方面，主要处理文本（例如某种 CJKV 语言：中文、日语、韩语和越南语）的应用将无法从这种内部变化中获得任何空间节省。\n\
  \n在实践中，使用西欧语言的应用从 Java 8 迁移到 11 时，仅通过此项变化就能节省高达 30% 甚至 40% 的堆内存。更小的堆内存意味着更小的容器，这可以转化为应用程序云计算成本的明显节约。\n\
  \n结束讨论之前，简要说明这一变化对性能的影响：它提供了一个极好的例子，说明了为什么我们必须将性能视为一种实验科学并从上到下进行测量。引入两种不同的 `String`\
  \ 表示确实涉及更多代码的执行，因为字符串操作现在需要两个独立的实现——一个用于 Latin-1，一个用于 UTF-16——因此代码需要检查 `coder` 并根据结果进行分支。\n\
  \n然而，关键的性能问题是：“额外的代码重要吗？”——即，收益是否超过了这种额外“复杂性税”的成本？该变化带来的收益包括：\n\n*   更小的堆内存\n* \
  \  潜在更快的 GC 时间\n*   对 Latin-1 字符串具有更好的缓存局部性\n\n我们还可以质疑，额外的比较和分支操作到底在多大程度上影响了实际执行的代码量——记住\
  \ JIT 编译器会进行许多显而易见的优化，并可以利用等待缓存未命中的时间，因此紧凑字符串所需的额外指令实际上可能是“免费”的。\n\n注意：在通常情况下，“计算执行的指令数”不是推断\
  \ Java 性能的良好方法。\n\n这种相互制的力量与权衡的图景（其影响只能通过对大规模观测值的测量来确定），正是我们在第 7 章中讨论的性能模型。在这种特定情况下，较小的堆内存可能直接转化为云托管的降低，因为可以使用更小的容器。\n\
  \n## 17.5.3 嵌套类成员 (Nestmates)\n\n嵌套类成员在 JEP 181：基于嵌套的访问控制中规范，该更改本质上纠正了一个追溯到 Java\
  \ 1.1 的关于内部类的实现黑科技。让我们来看一个示例，看看为了支持嵌套类成员对字节码做了更改：\n\n```\npublic class Outer {\n\
  \    private int i = 0;\n\n    public class Inner {\n        public int i() {\n\
  \            return i;\n        }\n    }\n}\n```\n\n如果我们编译这段代码，无论用 Java 8 还是 17\
  \ 编译，都会得到两个独立的类文件。然而，字节的字节码是不同的。我们可以使用 `javap` 查看两种情况之间的差异。这里是 Java 8 的：\n\n```\n\
  Compiled from \"Outer.java\"\npublic class Outer {\n  private int i;\n\n  public\
  \ Outer();\n    Code:\n       0: aload_0\n       1: invokespecial #2       // Method\
  \ java/lang/Object.\"<init>\":()V\n       4: aload_0\n       5: iconst_0\n     \
  \  6: putfield      #1       // Field i:I\n       9: return\n\n  static int access$000(Outer);\
  \           ❶\n    Code:\n       0: aload_0\n       1: getfield      #1       //\
  \ Field i:I\n       4: ireturn\n}\n```\n\n❶ 编译器插入了此“桥接”方法。\n\n带有内部类的独立类文件：\n\n```\n\
  Compiled from \"Outer.java\"\npublic class Outer$Inner {\n  final Outer this$0;\n\
  \n  public Outer$Inner(Outer);\n    Code:\n       0: aload_0\n       1: aload_1\n\
  \       2: putfield      #1    // Field this$0:LOuter;\n       5: aload_0\n    \
  \   6: invokespecial #2    // Method java/lang/Object.\"<init>\":()V\n       9:\
  \ return\n\n  public int i();\n    Code:\n       0: aload_0\n       1: getfield\
  \      #1    // Field this$0:LOuter;\n       4: invokestatic  #3    // Method  \
  \               ❶\n                              // Outer.access$000:(Outer;)I\n\
  \       7: ireturn\n}\n```\n\n❶ 使用此处\n\n注意合成访问方法（或桥接方法）`access$000()` 如何被添加到外部类中，以供内部类访问私有字段。现在让我们看看如果在\
  \ Java 17（或 11）下重新编译，字节码会发生什么：\n\n```\nCompiled from \"Outer.java\"\npublic class\
  \ Outer {\n  private int i;\n\n  public Outer();\n    Code:\n       0: aload_0\n\
  \       1: invokespecial #2         // Method java/lang/Object.\"<init>\":()V\n\
  \       4: aload_0\n       5: iconst_0\n       6: putfield      #1         // Field\
  \ i:I\n       9: return\n}\n```\n\n合成访问器完全消失了。相反，看这里的内部类：\n\n```\nCompiled from\
  \ \"Outer.java\"\npublic class Outer$Inner {\n  final Outer this$0;\n\n  public\
  \ Outer$Inner(Outer);\n    Code:\n       0: aload_0\n       1: aload_1\n       2:\
  \ putfield      #1      // Field this$0:LOuter;\n       5: aload_0\n       6: invokespecial\
  \ #2      // Method java/lang/Object.\"<init>\":()V\n       9: return\n\n  public\
  \ int i();\n    Code:\n       0: aload_0\n       1: getfield      #1      // Field\
  \ this$0:LOuter;\n       4: getfield      #3      // Field Outer.i:I\n       7:\
  \ ireturn\n}\n```\n\n现在现在对私有字段的直接访问，如下所示：\n\n```\nSourceFile: \"Outer.java\"\nNestMembers:\n\
  \  Outer$Inner\nInnerClasses:\n  public #6= #5 of #3;            // Inner=class\
  \ Outer$Inner of class Outer\n```\n\n\n\n\nJava 11 引入了 `nest`（嵌套类）的概念，这实际上是现有嵌套类概念的泛化。在\
  \ Java 之前的版本中，为了共享相同的访问控制上下文，一个类的源代码在物理上必须位于另一个类的源代码内部。在新概念中，一组类文件可以形成一个嵌套结构，其中\
  \ `nestmates`（嵌套类成员）共享通用的访问控制机制，并对彼此拥有无限制的直接（以及反射）访问——包括对私有成员的访问。\n\n注意：`nestmates`\
  \ 的出现微妙地改变了 `private` 的含义，正如我们之前讨论 `invokespecial` 时看到的那样。\n\n这个变化虽然很小，但它不仅消除了了一些不完美的实现杂质，而且平台未来的变化也必不可少。让我们跳过这些微小变化，讨论\
  \ JVM 内部的一个主要的（也是最臭名昭著的？）方面：`Unsafe` 类。\n\n## 17.6 Unsafe\n\n在 Java 平台上，如果某些功能或行为看起来很“神奇”，它通常是通过使用三种主要机制之一实现的：反射、类加载（包括相关的字节码转换）或\
  \ `Unsafe`。\n\nJava 的高级用户会寻求理解这三种技术，即使他们只在必要时才求助于它们。“仅仅因为你 `can` 做某事，并不意味着你 `should`\
  \ 这样做”这一原则在软件设计中与在地方一样适用。\n\n在这者中，`Unsafe` 是最有危险（也最强大）的，因为它提供了一种其他无法实现的方法，并且破坏了平台良好的规则。例如，`Unsafe`\
  \ 允许 Java 代码执行以下操作：\n\n* 直接访问硬件 CPU 特性\n* 创建对象但不运行其构造函数\n* 创建一个不经过常规验证的真正匿名类\n*\
  \ 手动管理堆外内存\n* 执行许多其他“不可能”的事情\n\nJava 8 的 `Unsafe` 类 `sun.misc.Unsafe` 立即通过其本质警告了我们——这不仅体现在类名中，还体现在它所在的包中。`sun.misc`\
  \ 包是一个内部的、特定于实现的位置，并不是 Java 代码应该直接触碰的东西。\n\n注意：在 Java 9 及更高版本中，`Unsafe` 的危险性更加明确，因为其功能已移动到名为\
  \ `jdk.unsupported` 的模块中。\n\n当然，Java 库不应该直接与这些类型的实现细节耦合。为了强化这一观点，Java 平台维护者长期以来的态度是：破坏规则并链接到内部细节的终端用户需自担风险。\n\
  \n然而，不方便的事实是，这个 API 尽管不受支持，但被库作者广泛使用。它不是 Java 的官方标准，但已成为各种不同安全性的非标准但必要的平台功能的“垃圾场”。\n\
  \n为了说明这一点，让我们来看 `Unsafe` 的一个经典用法：使用被称为“比较并交换”（compare and swap，简称 CAS）的硬件特性。这种能力存在于几乎所有现代\
  \ CPU 中，但众所周知的是它并不是 Java 内存模型（JMM）的一部分。\n\n在示例中，我们将回溯第 5 章见过的 `Account` 类。由于技术原因，在本节中我们假设余额是\
  \ `int` 而不是 `double`。`Account` 接口定义如下：\n\n```java\npublic interface Account {\n\
  \    boolean withdraw(int amount);\n\n    void deposit(int amount);\n\n    int getBalance();\n\
  \n    boolean transferTo(Account other, int amount);\n}\n```\n\n我们将用两种不同的方式来实现它。首先，我们将遵守规则并使用同步（synchronized）。`SynchronizedAccount`\
  \ 中接口上的两个方法看起来如下所示：\n\n```java\npublic class SynchronizedAccount implements Account\
  \ {\n    private int balance;\n\n    public SynchronizedAccount(int openingBalance)\
  \ {\n        balance = openingBalance;\n    }\n\n    @Override\n    public int getBalance()\
  \ {\n        synchronized (this) {\n            return balance;\n        }\n   \
  \ }\n\n    @Override\n    public void deposit(int amount) {\n        // 检查金额 > 0，如果不是则抛异常\n\
  \        synchronized (this) {\n            balance = balance + amount;\n      \
  \  }\n    }\n}\n```\n\n现在让我们将其与原子的 `Unsafe` 实现进行对比，由于需要通过反射访问 `Unsafe` 类，它包含了大量的样板代码：\n\
  \n```java\npublic class AtomicAccount implements Account {\n    private static final\
  \ Unsafe unsafe;                                    ❶\n    private static final\
  \ long balanceOffset;                               ❷\n\n    private volatile int\
  \ balance = 0;                                      ❸\n\n    static {\n        try\
  \ {\n            Field f = Unsafe.class.getDeclaredField(\"theUnsafe\");\n     \
  \       f.setAccessible(true);\n            unsafe = (Unsafe) f.get(null);     \
  \                            ❹\n            balanceOffset = unsafe.objectFieldOffset(\
  \                      \n                                AtomicAccount.class\n \
  \                                 .getDeclaredField(\"balance\"));\n        } catch\
  \ (Exception ex) { throw new Error(ex); }\n    }\n\n    public AtomicAccount(int\
  \ openingBalance) {\n        balance = openingBalance;\n    }\n\n    @Override\n\
  \    public double getBalance() {\n        return balance;                     \
  \                               ❻\n    }\n\n    @Override\n    public void deposit(int\
  \ amount) {\n        // 检查金额 > 0，如果不是则抛异常\n        unsafe.getAndAddInt(this,\n \
  \                           balanceOffset, amount);                        ❼\n \
  \   }\n\n    // ...\n}\n```\n\n❶ 我们拷贝的 `Unsafe` 对象\n❷ 指针偏移量的数值值\n❸ 实际的 `balance`\
  \ 字段\n❹ 反射获取 `Unsafe` 对象\n❺ 计算偏移量\n❻ 对 `balance` 的 volatile 读\n❼ 使用 CAS 操作更新余额\n\
  \n在例示例中，我们正在做一些在 Java 中认为是不可能的的事情。首先，我们正在计算一个指针偏移量（`balance` 字段相对于对象位置的偏移）。没有 JVM\
  \ 字节码指令可以提供这一点——只有直接访问 JVM 内部数据的原生代码可以。`Unsafe` 对象的 `objectFieldOffset()` 方法这一点。\n\
  \n其次，我们对余额进行无锁原子加法。这在 JMM 中是不可能的，因为 `volatile` 只允许我们一次操作（读或写），而加法同时需要读和写。让我们看看 `Unsafe`\
  \ 中 `getAndAddInt()` 方法的代码，看看是如何实现的：\n\n```java\npublic final int getAndAddInt(Object\
  \ o, long offset, int delta) {\n    int v;\n    do {\n        v = getIntVolatile(o,\
  \ offset);                      ❶\n    } while (!compareAndSetInt(o, offset, v,\
  \ v + delta));   ❷\n    return v;\n}\n```\n\n❶ 程序化的 volatile 访问\n❷ 底层 CAS 操作\n\n\
  \n\n替换可能会失败，因为在另一个 CPU 上活跃运行的线程在挥性读取（volatile read）和 CAS 之间更新了内存位置。在这种情况下，方法 `compareAndSetInt()`\
  \ 返回 `false`，`do-while` 循环会让我们重试一次尝试。\n\n因此，这类操作是无锁（lock-free）但**不是**无循环（loop-free）。被许多线程操作的高竞争字段可能需要我们在原子加法最终成功之前在循环中自旋一段时间，但不存在`丢失更新`（Lost\
  \ Update）的可能性。\n\n> **注意**：如果我们追踪到 JDK 中的代码，可以看到这种实现与 JDK 实际上对 `AtomicInteger` 所执行的操作非常接近。\n\
  \n为了完整起见，让我们来看 `withdraw()` 的实现：\n\n```\n @Override\n    public boolean withdraw(int\
  \ amount) {\n        // 检查金额是否 > 0，如果不是则抛异常\n        var currBal = balance;    \
  \                             ❶\n        var newBal = currBal - amount;\n      \
  \  if (newBal >= 0) {\n            if (unsafe.compareAndSwapInt(this,          \
  \       ❷\n                                         balanceOffset,\n           \
  \                              currBal, newBal)) {\n                return true;\n\
  \            }\n        }\n        return false;\n    }\n```\n\n❶ 对 balance 进行挥性读取\n\
  \n❷ 尝试通过低级 CAS 更新 balance\n\n这种情况稍有不同，因为我们直接使用了低级 API 来更新余额。这是必要的，因为我们必须维护“账户余额不能为负”的约束条件。这需要额外的操作，例如对\
  \ `newBal` 进行比较。\n\n对于存款操作，我们可以使用高级别的 API，它会一直循环直到成功。然而，这是因为无论账户状态如何，钱总是可以存入账户。如果我们在这里使用相同的技术，这种取款可能会无限自旋，因为账户中可能没有足够的资金满足需求。\n\
  \n相反，我们采取的策略是尝试一次，如果 CAS 操作失败则取款失败。这消除了两个取款操作尝试获取相同资金的竞态条件，但副作用是，原本*应该*成功的取款可能会因为另一个线程发生的存款操作（在挥性读取后更改了余额）而导致虚假失败。\n\
  \n> **注意**：我们可以在取款代码中引入 `for` 循环来减少虚假失败的概率，但它必须是一个可证明的有限循环。\n\n在基准测试中，这两种方法之间的性能差异非常显著——在现代硬件上，`Unsafe`实现的速度大约快两到三倍。然而，你不应该在用户代码中使用此类技术。正如已经讨论的，许多（几乎是所有？）现代框架已经使用了\
  \ `Unsafe`。直接针对 `Unsafe` 编写代码而不是使用你所选框架提供的功能，不太会有任何性能上的收益。\n\n更重要的是，你这样做违反了 Java\
  \ 规范的规则：使用了并不一定按照用户代码预期方式遵循规则的内部能力。在下一节中，我们将讨论 Java 新版本如何尝试减少这种不支持的 API，并用完全支持的替代方案来替换。\n\
  \n## 17.7 用支持的 API 替换 Unsafe\n\n回想第 2 章，我们接触了 Java 模块。这种封装机制提供了严格的导出能力，并消除了调用内部包中代码的能力。这是如何影响\
  \ `Unsafe` 的？在下一节中，我们将讨论 Java 新版本如何尝试减少这种不支持的 API，并用完全支持的替代方案来替换。\n\n从反射转向方法和字段句柄（method\
  \ and field handles）意味着 Java 8 中 `Unsafe` 里的许多方法现在可以从不支持的 API 中移除，包括：\n\n*   `compareAndSwapInt()`\n\
  \n*   `compareAndSwapLong()`\n\n### 17.7.1 VarHandles\n\nVarHandles API 引入自 Java\
  \ 9，旨在扩展方法句（Method Handles）的概念，为字段提供类似的功能。回想第 5 章所讨论的，在 JMM 中只提供了两种访问模式：普通。VarHandles\
  \ 的一个重要目标是允许访问内存的新方式，即为 `Unsafe` 提供一个受支持的替代方案。为了看到其实效果，让我们来看一个快速示例，展示我们如何尝试使用 VarHandles\
  \ 来替换账户类中的 `Unsafe`：\n\n```\npublic class VHAccount implements Account {\n    private\
  \ static VarHandle vh;\n    private volatile int balance = 0;\n\n    static {\n\
  \        try {\n            var l = MethodHandles.lookup();                  ❶\n\
  \            vh = l.findVarHandle(VHAccount.class,            ❷\n              \
  \                \"balance\", int.class);\n        } catch (Exception ex) { throw\
  \ new Error(ex); }\n    }\n\n    @Override\n    public void deposit(int amount)\
  \ {\n        // 检查金额是否 > 0，如果不是则抛异常\n        vh.getAndAdd(this, amount);       \
  \                   ❸\n    }\n\n    // ...\n}\n```\n\n❶ 创建一个 Lookup 对象\n\n❷ 获取 balance\
  \ 的 VarHandle 并将其缓存\n\n❸ 使用 VarHandle 访问字段，并使用挥性内存语义\n\n这在功能上与使用 `Unsafe` 的版本等同，但它现在仅使用完全支持的\
  \ API。`MethodHandles.Lookup` 的使用是一项重大的改变。与依赖于 `setAccessible()` 来访问私有字段的反射不同，查找对象具有调用上下文所拥有的任何权限，其中就包含了对私有字段\
  \ `balance` 的访问权限。\n\n\n\n\n*   `compareAndSwapObject()`\n\n这些方法的等效实现可以在 `VarHandle`\
  \ 中找到，此外还有实用的访问方法。对于原始类型和对象，还有用于普通和 volatile 访问模式的 `get` 和 `put` 方法，以及用于构建高效累加器的方法，例如：\n\
  \n*   `getAndAddInt()`\n*   `getAndAddLong()`\n*   `getAndSetInt()`\n*   `getAndSetLong()`\n\
  *   `getAndSetObject()`\n\n`VarHandles` 的另一个关键目标是允许对 JDK 9 及更高版本中新的内存排序模式进行底层访问。Java\
  \ 9 的这些新并发屏模式也对 JMM（内存模型）进行了一些相当小的更新。\n\n总体而言，在创建 `Unsafe` 事实标准 API 的替代方案方面取得了确定性进展。例如，除了\
  \ `VarHandles` 之外，`Unsafe` 的 `getCallerClass()` 功能现在已在 JEP 259 定义的栈遍历 API 中（参见 [`openjdk.java.net/jeps/259`](https://openjdk.java.net/jeps/259)）。然而，仍有工作要做。\n\
  \n### 17.7.2 隐藏类 (Hidden classes)\n\n`Hidden classes` 在 JEP 371 中描述（参见 [`openjdk.java.net/jeps/371`](https://openjdk.java.net/jeps/371)）。这一内部特性是为平台和框架的作者设计的。该\
  \ JEP 旨在为 `Unsafe` 最常用的用法之一提供受支持的 API：即创建无法被其他类直接使用（但可以间接处理）的动态类。\n\n这些类有时被称为 `anonymous\
  \ classes`，而 `Unsafe` 中的对应方法被称为 `defineAnonymousClass()`。然而，这个术语对开发者来说容易混淆，因为在普通\
  \ Java 应用代码的上下文中，它意味着某个接口的嵌套实现，该实现将其静态类型声明为该接口，如下：\n\n```\npublic class Scratch\
  \ {\n    public void foo() {\n        Runnable r = new Runnable() {\n          \
  \  @Override\n            public void run() {\n                System.out.println(\"\
  Only way possible before lambdas!\");\n            }\n        };\n    }\n}\n```\n\
  \n这通常被称为“`Runnable` 的匿名实现”；然而，这样的类并不是真正的匿名——相反，编译器将生成一个命名类似于 `Scratch$1` 的类，这是一个真实且可用的\
  \ Java 类。虽然 Java 源码无法获取类名，但可以使用该名称找到该类，并通过反射进行访问，然后像使用任何其他类一样使用它。\n\n隐藏类也不是真正匿名的——它也有一个名称，可以通过直接在其类\
  \ `Class` 对象上调用 `getName()` 来获取。此名称也可能出现在其他几个地方，包括诊断、JVM 工具接口 (JVMTI) 或 JDK 飞行记录器\
  \ (JFR) 事件中。然而，隐藏类无法通过类加载器找到，无法以任何普通类被发现的方式找到，包括使用反射（例如通过 `Class.forName()`）。\n\n\
  其意图是让隐藏类的命名方式显式地将其放在与普通类不同的命名空间中——名称具有足够异常的形式，有效地使得该类对所有其他类不可见。\n\n这种命名方案利用了这样一个事实：在\
  \ JVM 中，类通常有两种形式：二进制名（`com.acme.Gadget`），通过调用类对象上的 `getName()` 返回；以及内部形式（`com/acme/Gadget`）。隐藏类的命名方式不符合这种模式。相反，对隐藏类的类对象调用\
  \ `getName()` 将返回一个类似 `com.acme.Gadget/1234` 的名称。这既不是二进制名也不是内部形式，任何尝试匹配此名称的普通类尝试都将失败。让我们快速看一个创建隐藏类的示例：\n\
  \n```\nvar fName = \"/Users/ben/projects/books/resources/Ch15/ch15/Concat.class\"\
  ;\nvar buffy = Files.readAllBytes(Path.of(fName));\nvar lookup = MethodHandles.lookup();\n\
  var hiddenLookup = lookup.defineHiddenClass(buffy, true);\nvar klazz = hiddenLookup.lookupClass();\n\
  System.out.println(klazz.getName());\n```\n\n这种命名方案（以及通过这种方式区分隐藏类）的优势在于，它们需要\n\n\
  ## 总结\n\n*   `Unsafe`\n*   `Reflection`\n*   `Method handles`\n*   `invokedynamic`\n\
  *   `Unsafe`\n\n# 18 未来的 Java\n\n本章涵盖了\n\n*   Project Amber\n*   Project Panama\n\
  *   Project Loom\n*   Project Valhalla\n*   Java 18\n\n本章涵盖了自 17 版本发布以来语言和平台的进展，由尚未到来的未来更新组成。语言和平台的新方向由\
  \ JEP 规范，但那些是对特定特性的描述。在更高层次上，OpenJDK 内部有几个正在进行的大型项目，将在未来几年内交付。\n\n我们将逐一介绍每个项目，然后是\
  \ Java 18。我们将从 Project Amber 开始，我们将听到更多关于模式匹配的故事。\n\n## 18.1 Project Amber\n\n在\
  \ OpenJDK 当前的主要项目中，Amber 是最接近完成的。它还受益于其在开发者的日常工作方面相对易于理解。根据项目的章程：\n\nProject Amber\
  \ 的目标是探索和孵化更小、更面向生产力的语言特性……——Project Amber, [`openjdk.java.net/projects/amber/`](https://openjdk.java.net/projects/amber/)\n\
  \n该项目的主要目标是\n\n*   局部变量类型推断（已发布）\n*   Switch 表达式（已发布）\n*   记录（已发布）\n*   密封类型（已发布）\n\
  *   模式匹配\n\n正如你所看到的，许多特性在 Java 17 中已经发布——而且它们非常有用！\n\nAmber 尚未完成的最后一个主要部分是模式匹配。正如我们在第\
  \ 3 章所看到的，它是增量式引入的，第一次是在 `instanceof` 中使用类型模式。我们还遇到了了 `switch` 中模式的预览版本。\n\n可以预见\
  \ `switch` 中的模式将遵循其他 Project Amber 特性经历过的生命周期：第一次预览，然后第二次预览，最后作为标准特性交付。\n\n展望未来，计划了更多的\
  \ JEP。确定模式匹配的基础形式并不是唯一的目标——还有额外的模式形式需要添加。这告诉我们，由于发布周期向“每两年一次 LTS”模式的改变，任何在 Java\
  \ 18 或 19 中最初预览的特性，都有时间在 2023 年 9 月的下一个 LTS 版本 Java 21 中完全毕业。\n\n\n\n\n例如，我们已经看到\
  \ `Sealed Types`（密封类型）在当前的预览版 `Pattern Matching`（模式匹配）中如何发挥巨大的作用。没有了 `Sealed Types`，即使是我们现有的\
  \ `Pattern Matching` 形式也不会如此实用。类似地，`Records`（记录）在模式中一些最重要的用例尚未交付。特别地，`deconstruction\
  \ patterns`（解构模式）将允许 `Record` 作为模式的一部分被拆解为它的组成部分。\n\n注意：如果你编写过 Python 或 JS 或其他语言，你可能熟悉\
  \ `destructuring`（解构）。Java 中解构的想法相似，但它是受 Java 的名义类型系统的指导的。\n\n这之所以可能，是因为 Records\
  \ 是根据其语义定义的——一个 `Record` 字面上仅仅是它所有组成部分之和。因此，如果一个 `Record` 只能通过组合它的组成部分来构建，那么推导出它可以在不产生语义后果的情况下还原为它的组成部分。\n\
  \n在编写本文时，该功能尚未进入 JDK 主线开发，甚至还没有进入针对 Amber 的特定 JDK 仓库。然而，其语法预计如下所示：\n\n```\nFXOrder\
  \ order = // ...\n\n// WARNING 这是是初步语法!!!\n\nvar isMarket = switch (order) {\n \
  \   case MarketOrder(int units, CurrencyPair pair, Side side,\n                \
  \     LocalDateTime sent, boolean allOrNothing) -> true;\n    case LimitOrder(int\
  \ units, CurrencyPair pair, Side side,\n                    LocalDateTime sent double\
  \ price, int ttl) -> false;\n};\n```\n\n注意，此代码包含了 `Record` 组成部分的显式类型。预计编译器也可以推断出这些类型，这也是合理的。\n\
  \n解构数组也是可能的，因为它们也充当了没有额外语义的元素容器。该功能的语法可能如下所示：\n\n```\n// WARNING 这是是初步语法!!!\n\n\
  if (o instanceof String[] { String s1, String s2, ... }){\n    System.out.println(s1\
  \ + s2);\n}\n```\n\n注意，在两个例子中，我们都没有为元素容器（无论是 `Record` 还是数组）声明绑定。\n\n这里应该提到的一点是 Java\
  \ 序列化是如何影响这一特性的。通常情况下，Java 序列化是一个问题，因为它违反了 Java 中封装本应工作的一些基本规则。\n\n序列化构成了一个不可见但公共的构造函数，以及一组针对你内部状态的不可见但公共的访问器。\n\
  \n—Brian Goetz\n\n幸运的是，Records 和数组都非常简单：它们只是其内容的透明载体，因此无需调用序列化机制细节中的奇特性。相反，我们始终可以使用公共\
  \ API 和规范构造函数来序列化和反序列化记录。在这一基础之上，甚至有一些非常深远的建议，例如部分或完全地移除序列化机制，并将解构扩展到某些（甚至所有）Java\
  \ 类。\n\n总的来说，Amber 传递的信息是：如果你熟悉其他编程语言中的这些功能，那么太好了。但如果你不熟悉，不要担心——它们的设计是为了适应你已经熟悉的\
  \ Java 语言，并易于在你的代码中开始使用。\n\n尽管某些功能很小，另一些较大，但它们都能对你的代码产生积极影响，这种影响与其更改的大小不成比例。一旦你开始使用它们，你可能会发现它们为你的程序带来了真正的收益。现在让我们转向下一个主要项目，代号为\
  \ Panama。\n\n## 18.2 Project Panama\n\nProject Panama 用其项目页面的说法，完全关于\n\n> 改进和丰富\
  \ Java 虚拟机与定义良好但“外部”（非 Java）API 之间的连接，包括 C 程序员常用的许多接口。\n\n> —Project Panama, [`openjdk.org/projects/panama/`](https://openjdk.org/projects/panama/)\n\
  \n“Panama”这个名字来源于 `isthmus`（地峡）的概念——一条连接两个较大陆地的狭窄陆带——在这一类比中，它们被理解为 JVM 和原生代码。它包含两个主要领域的\
  \ JEPs：\n\n*   Foreign Function and Memory API（外部函数和内存 API）\n*   Vector API\n\n\
  在这些内容中，我们在本节仅讨论 Foreign API。Vector API 尚未准备好进行充分处理，原因我们将在章节稍后部分解释。\n\n### 18.2.1\
  \ Foreign Function and Memory API\n\n自 Java 1.1 以来，Java 就有了 Java Native Interface\
  \ (`JNI`) 来用于调用原生代码，但长期以来，人们认为它存在以下主要问题：\n\n*   `JNI` 有大量的仪式感和额外产物。\n*   `JNI` 实际上只能与\
  \ C/C++ 库进行良好的交互。\n*   `JNI` 无法自动将 Java 类型系统映射到 C 类型系统。\n\n额外产物这一点被开发者充分理解：`JNI`\
  \ 需要一个从 Java API 派生的 C 头文件 (`.h`) 以及 C 实现文件，以调用与 JVM 构建时使用的调用约定不同的函数。\n\n在 `JNI`\
  \ 首次出现后的几年里，人们曾尝试提供更好的替代方案，例如 `JNA`。然而，其他（非 JVM）语言在原生代码交互方面明显更好。例如，Python 作为机器学习语言的声誉很大程度上取决于对原生库的封装。\n\
  \nPanama Foreign API 试图弥补这一差距，允许 Java 直接支持以下内容：\n\n*   外部内存分配\n*   结构化内存操作\n*  \
  \ 资源的生命周期管理\n*   调用外部函数\n\n该 API 位于 `jdk.incubator.foreign` 模块的 `jdk.incubator.foreign`\
  \ 包中。它基于 `MethodHandles` 和 `VarHandles`，我们在之前已经遇到过它们。\n\n注意：Foreign API 在 Java 17\
  \ 中包含在一个孵化模块中。我们在第一章中讨论过孵化模块及其重要性。为了运行本节中的代码示例，你需要显式地将孵化模块添加到 modulepath。\n\n该 API\
  \ 的第一部分依赖于 `MemorySegment`、`MemoryAddress` 和 `SegmentAllocator` 等类。这提供了对堆外内存的分配和处理。目标是为\
  \ `ByteBuffer` API 和 `Unsafe` 提供更好的替代方案。Foreign API 旨在避免 `ByteBuffer` 的局限性，例如性能、段大小限制以及未专门为堆外使用设计。同时，它应该比\
  \ `Unsafe` 安全，后者允许无限制的内存访问，很容易导致 JVM 崩溃。\n\n注意：在本节剩余部分，我们假设你熟悉 C 语言概念，熟悉从源码构建 C/C++\
  \ 程序并理解 C 编译、链接等阶段。\n\n让我们来看看实际效果。要开始，你需要从 [`jdk.java.net/panama/`](https://jdk.java.net/panama/)\
  \ 下载 Panama 的早期访问构建。虽然 JDK 17 包含了孵化模块，但还没有重要的 `jextract` 工具，而我们在示例中需要它。\n\n一旦设置好\
  \ Panama 早期访问安装，用 `jextract -h` 进行测试。你应该看到类似下面的输出：\n\n\n\n\n\n```\nWARNING: Using\
  \ incubator modules:\n         jdk.incubator.jextract, jdk.incubator.foreign\nNon-option\
  \ arguments:\n[String] -- header file\n\nOption                         Description\n\
  ------                         -----------\n-?, -h, --help                 print\
  \ help\n-C <String>                    pass through argument for clang\n-I <String>\
  \                    specify include files path\n-d <String>                   \
  \ specify where to place generated files\n--dump-includes <String>       dump included\
  \ symbols into specified file\n--header-class-name <String>   name of the header\
  \ class\n--include-function <String>    name of function to include\n--include-macro\
  \ <String>       name of constant macro to include\n--include-struct <String>  \
  \    name of struct definition to include\n--include-typedef <String>     name of\
  \ type definition to include\n--include-union <String>       name of union definition\
  \ to include\n--include-var <String>         name of global variable to include\n\
  -l <String>                    specify a library\n--source                     \
  \  generate java sources\n-t, --target-package <String>  target package for specified\
  \ header files\n```\n\n对于我们的示例，我们将使用一个用 C 编写的简单 PNG 库：`LibSPNG` ([`libspng.org/`](https://libspng.org/))。\n\
  \n## 示例：LibSPNG\n\n我们将开始使用 `jextract` 工具获取一组我们可以使用的基础 Java 包。语法如下：\n\n```\n$ jextract\
  \ --source -t <target Java package> -l <library name> \\\n    -I <path to /usr/include>\
  \ <path to header file>\n```\n\n在 Mac 上，这最终看起来类似于下面的内容：\n\n```\n$ jextract --source\
  \ -t org.libspng \\\n  -I /Applications/Xcode.app/Contents/Developer/Platforms/MacOSX.platform/\
  \ \\\n      Developer/SDKs/MacOSX.sdk/usr/include \\\n  -l spng /Users/ben/projects/libspng/spng/spng.h\n\
  ```\n\n这可能会产生一些警告，具体取决于我们从中哪个版本的头文件生成，但只要执行成功，它将在当前目录下创建一个目录结构。该结构将包含一个名为 `org.libspng`\
  \ 的包中的许多 Java 类，我们稍后可以在 Java 程序内部使用它们。\n\n我们还需要构建一个共享对象以便在运行程序时进行链接。最好的方法是按照 [`mng.bz/v6dJ`](http://mng.bz/v6dJ)\
  \ 中的项目构建说明进行。\n\n安装过程会在项目本地生成 `libspng.dylib` 并将其安装到系统共享位置。运行项目时，你需要确保该文件位于系统属性\
  \ `java.library.path` 列出的路径之一，或者直接设置该属性以包含你的位置。Mac 上的示例默认目录是 `~/Library/Java/Extensions/`。代码生成完成且库安装后，我们就可以进行\
  \ Java 编程了。\n\nPanama 的目标是提供 Java 静态方法，这些方法与我们要链接的 C 库中的符号名称（以及参数类型的 Java 版本）相。因此，生成的\
  \ Java 代码中的符号将遵循 C 的命名规范，看起来并不像 Java 命名。\n\n对于 Java 程序员来说，整体印象是我们正在直接调用 C 函数（尽可能地）。实际上，底层正在发生某种\
  \ Panama 魔术，使用如方法句柄（method handles）等技术来隐藏复杂性。在正常情况下，大多数开发者不需要担心 Panama 确切工作原理细节。\n\
  \n让我们来看一个示例：一个使用 C 库从 PNG 文件读取某些基本数据的程序。我们将此代码设置为一个适当的模块化构建。模块描述符 `module-info.java`\
  \ 如下所示：\n\n```\nmodule wgjd.png {\n  exports wgjd.png;\n\n  requires jdk.incubator.foreign;\n\
  }\n```\n\n代码包含了 `org.libspng` 包（我们从 C 代码自动生成的）以及单个导出的包 `wgjd.png`。它包含一个文件，我们将完整地展示它，因为导入等内容对于理解正在发生的情况非常重要：\n\
  \n```java\npackage wgjd.png;\n\nimport jdk.incubator.foreign.MemoryAddress;    \
  \                            ❶\nimport jdk.incubator.foreign.MemorySegment;    \
  \                            ❶\nimport jdk.incubator.foreign.SegmentAllocator; \
  \                              ❶\nimport org.libspng.spng_ihdr;\n\nimport static\
  \ jdk.incubator.foreign.CLinker.toCString;\nimport static jdk.incubator.foreign.ResourceScope.newConfinedScope;\n\
  import static org.libspng.spng_h.*;\n\npublic class PngReader {\n    public static\
  \ void main(String[] args) {\n        if (args.length < 1) {\n            System.err.println(\"\
  Usage: pngreader <fname>\");\n            System.exit(1);\n        }\n\n       \
  \ try (var scope = newConfinedScope()) {\n            var allocator = SegmentAllocator.ofScope(scope);\n\
  \n            MemoryAddress ctx = spng_ctx_new(0);                           ❷\n\
  \            MemorySegment ihdr = allocator.allocate(spng_ihdr.$LAYOUT());\n\n \
  \           spng_set_crc_action(ctx, SPNG_CRC_USE(),                       ❸\n \
  \                                    SPNG_CRC_USE());\n\n            int limit =\
  \ 1024 * 1024 * 64;                               ❹\n            spng_set_limits(ctx,\
  \ limit);\n\n            var cFname = toCString(args[0], scope);               \
  \         ❺\n            var cMode = toCString(\"rb\", scope);                 \
  \           ❺\n            var png = fopen(cFname, cMode);                     \
  \          ❻\n            spng_set_file(ctx, png);                             \
  \          ❷\n\n            int ret = spng_get_ihdr(ctx, ihdr);                \
  \             ❷\n\n            if (ret != 0) {\n                System.out.println(\"\
  ihdr error: \" + spng_strerror(ret));\n                System.exit(2);\n       \
  \     }\n\n            final String colorTypeMsg;\n            final byte colorType\
  \ = spng_ihdr.color_type(ihdr);\n\n            if (colorType == SPNG_COLOR_GRAYSCALE())\
  \ {                           ❸\n                colorTypeMsg = \"grayscale\";\n\
  \            } else if (colorType == SPNG_COLOR_TRUECOLOR()) {                 \
  \          ❼\n                colorTypeMsg = \"truecolor\";\n            } else\
  \ if (colorType == SPNG_COLOR_INDEXED()) {                             ❼\n     \
  \           colorTypeMsg = \"indexed color\";\n            } else if (colorType\
  \ == SPNG_COLOR_GRAYSCALE_ALPHA()) {                           ❼\n             \
  \   colorTypeMsg = \"grayscale with alpha\";\n            } else {\n           \
  \     colorTypeMsg = \"truecolor with alpha\";\n            }\n\n            System.out.println(\"\
  File type: \" + colorTypeMsg);\n        }\n    }\n}\n```\n\n❶ Panama 用于处理 C 风格内存的类\n\
  ❷ spng.h 中函数的 Java 封装\n❸ 常量的 Java 封装\n❹ 以 64 M 块读取数据\n❺ 将 Java 字符串的内容复制到 C 字符串\n\
  ❻ C 库函数的 Java 封装\n❼ 常量的 Java 封装\n\n该程序使用 Gradle 构建脚本构建，显示在此处：\n\n```gradle\nplugins\
  \ {\n  id(\"org.beryx.jlink\") version(\"2.24.2\")\n}\n\nrepositories {\n  mavenCentral()\n\
  }\n\napplication {\n  mainModule.set(\"wgjd.png\")\n  mainClass.set(\"wgjd.png.PngReader\"\
  )\n}\n\njava {\n    modularity.inferModulePath.set(true)\n}\n\nsourceSets {\n  main\
  \ {\n    java {\n      setSrcDirs(listOf(\"src/main/java/org\",\n              \
  \          \"src/main/java/wgjd.png\"))\n    }\n  }\n}\n\ntasks.withType<JavaCompile>\
  \ {\n  options.compilerArgs = listOf()\n}\n\ntasks.jar {\n  manifest {\n    attributes(\"\
  Main-Class\" to application.mainClassName)\n  }\n}\n```\n\n并且可以像这样执行：\n\n```\n$\
  \ java --add-modules jdk.incubator.foreign \\\n    --enable-native-access=ALL-UNNAMED\
  \ \\\n    -jar build/libs/Panama.jar <FILENAME>.png\n```\n\n这应该产生一些关于我们图像文件的基本数据的输出。\n\
  \n在 Panama 中处理原生内存\n\n\n\n\n处理内存的一个关键方面是原生内存的生命周期问题。C 语言没有垃圾回收器，因此所有内存都必须手动分配和释放。当然，这极易出错，而且对于\
  \ Java 程序员来说也并不符合直觉。\n\n为了解决这个问题，Panama 提供了几个类用作 C 内存管理操作的 Java 句柄。关键在于 `ResourceScope`\
  \ 类，它可以用于提供确定性的清理。这是通过通常的 Java 方式（即 `try`-with-resources）来处理的。例如，之前的代码对原生内存处理使用了词法作用域周期：\n\
  \n```\ntry (var scope = newConfinedScope()) {\n    var allocator = SegmentAllocator.ofScope(scope);\n\
  \n    // ...\n\n}\n```\n\n`allocator` 对象是 `SegmentAllocator` 接口实现类的一个实例。它通过工厂方法从\
  \ scope 中创建，反之，我们也可以从 `allocator` 创建 `MemorySegment` 对象。\n\n实现 `MemorySegment` 接口的对象表示连续的内存块。通常，这些对象将由原生内存块支持，但也可以使用堆内数组来支持内存段。这类似于\
  \ Java NIO API 中 `ByteBuffer` 的情况。\n\n注意：Panama API 还包含 `MemoryAddress`，它实际上是 C\
  \ 指针（表示为 `long` 值）的 Java 包装器。\n\n当 scope 自动关闭时，会回调 allocator 以确定性地卸释放并释放它所持有的任何资源。这就是*资源获取初始化*（RAII）模式（在\
  \ Java 中通过 `try`-with-resources 实现）是如何引入原生代码的。scope 和 allocator 对象持有原生资源的引用，并在 TWR\
  \ 块退出时自动释放它们。\n\n或者，也可以隐式地处理，即当 `MemorySegment` 对象被垃圾回收时，清理原生内存。当然，这意味着清理工作是非确定性的，会在\
  \ GC 运行的随时发生。通常情况下，建议使用显式的 scope，特别是当你不熟悉处理堆外内存的潜在陷阱时。\n\n在编写时，`jextract` 仅能理解 C\
  \ 头文件。这意味着，目前若要从其他原生语言（例如 Rust）使用它，你必须先生成一个 C 头文件。理想情况下，应该有一个自动工具来生成这些文件，它的工作原理类似于\
  \ `rust-bindgen` 工具，但方向相反。\n\n更广泛地说，随着时间的推移，`jextract` 可能会对其他语言提供更多支持。该工具基于 LLVM，而\
  \ LLVM 已经是语言无关的，因此从理论上讲，它可以扩展到任何 LLVM 已知且能够处理 C 函数调用约约的语言。\n\nForeign API 即将作为 Java\
  \ 18 的一部分以“孵化”（Incubating）特性的第二次版本发布（参阅第 1 章关于孵化和预览特性的描述）。希望它能在 2022 年 9 月作为 Java\
  \ 19 的一部分成为一个最终的、标准的特性。\n\nVector API 的进展较后，主要是因为 API 设计者决定倾向于等待 Project Valhalla\
  \ 的功能（见本章节后后部分）可用。因此，在 Valhalla 成为标准功能可用之前，该 API 将不会移出孵化状态。\n\n## 18.3 Project Loom\n\
  \n用它自己的话说，OpenJDK 的 *Project Loom* 关于\n\n在 Java 平台上提供易于使用的、高吞吐量的轻量级并发以及新的编程模型。\n\
  \n—Project Loom, [`wiki.openjdk.org/display/loom/Main`](https://wiki.openjdk.org/display/loom/Main)\n\
  \n为什么需要这种新的并发方法？让我们从更有历史视角的角度来看 Java。\n\n思考 Java 的一种有趣方式是，它是 20 世纪 90 年代后期的语言和平台，对软件演进的方向做出了许多带有见解的战略性赌注。从\
  \ 2022 年的角度来看，这些赌注很大程度上取得了成功（至于是运气还是判断力仍有待商榷）。\n\n作为一个例子考虑线程。Java 是第一个将线程引入核心语言的主流平台。在线程出现之前，主流做法是使用多个进程以及各种不完善的机制（共享内存等？）在它们之间进行通信。\n\
  \n不仅如此，在操作系统层面上，线程是属于进程的独立执行单元。每个线程都有自己的执行计数器和调用栈，但与进程中的其他线程共享堆。\n\n线程的概念自然地引向了轻量级上下文切换。在同一个进程内切换两个线程比其他方式要便宜。这主要是因为从虚拟内存地址到物理地址的映射表对于同一进程中的线程是相同的。\n\
  \n注意：创建一个线程比创建一个进程更便宜。这种方法的准确程度取决于所具体的操作系统。\n\n在我们情况下，Java 规范并没有规定 Java 线程与操作系统（OS）线程之间存在任何特定的映射（假设主机具有相应的线程概念，而这并非总是如此）。事实上，在非常期的\
  \ Java 版本中，JVM 线程被复用在所谓的*绿色线程*（green threads）或 *M:1 线程*上（因为实现实际上只使用一个平台线程）。\n\n\
  然而，这种做法在 Java 1.2/1.3 时代消失了（在 Sun Solaris 上更早），运行主流操作系统的现代 Java 版本改为实现“一个 Java 线程等于一个操作系统线程”的规则。调用\
  \ `Thread.start()` 会调用系统调用（例如 Linux 上的 `clone()`）并实际上创建一个操作系统线程。\n\nProject Loom\
  \ 的主要目标是允许创建不需要对应专用线程的新 `Thread` 对象，换句话说，创建一种表示执行上下文的对象不再是需要由操作系统调度的内容。\n\n所以从某些方面来说，Loom\
  \ 是对绿色线程的回归。然而，在中间几年里世界发生了巨大变化，有时在计算领域，有些想法是超前的。\n\n例如，可以将企业级 Bean (EJBs) 视为一种虚拟化/限制的环境，它们野心地地试图将环境虚拟化。它们是否可以被视为后来在现代\
  \ PaaS 系统中受到青睐的想法的原型——并在较小程度上在 Docker/K8s 中也是？\n\n所以，如果 Loom 是对绿色线程想法的（部分）回归，处理这一问题的一种方法可能是通过查询：“环境发生了什么变化，使得回到一个过去未被发现有效的旧想法变得有趣？”\n\
  \n\n\n\n\n```java\n//\n// Do actually run this code... it may crash your JVM or\
  \ laptop\n//\npublic class CrashTheVM {\n    private static void looper(int count)\
  \ {\n        var tid = Thread.currentThread().getId();\n        if (count > 500)\
  \ {\n            return;\n        }\n        try {\n            Thread.sleep(10);\n\
  \            if (count % 100 == 0) {\n                System.out.println(\"Thread\
  \ id: \"+ tid +\" : \"+ count);\n            }\n        } catch (InterruptedException\
  \ e) {\n            e.printStackTrace();\n        }\n        looper(count + 1);\n\
  \    }\n\n    public static Thread makeThread(Runnable r) {\n        return new\
  \ Thread(r);\n    }\n\n    public static void main(String[] args) {\n        var\
  \ threads = new ArrayList<Thread>();\n        for (int i = 0; i < 20_000; i = i\
  \ + 1) {\n            var t = makeThread(() -> looper(1));\n            t.start();\n\
  \            threads.add(t);\n            if (i % 1_000 == 0) {\n              \
  \  System.out.println(i + \" thread started\");\n            }\n        }\n    \
  \    // Join all the threads\n        threads.forEach(t -> {\n            try {\n\
  \                t.join();\n            } catch (InterruptedException e) {\n   \
  \             e.printStackTrace();\n            }\n        });\n    }\n}\n```\n\n\
  这段代码启动了 20,000 个线程，并在每个线程中进行极少量的处理——或者尝试这样做。在实践中，在达到这种稳定状态之前，它通常会崩溃或导致机器锁定。\n\n\
  **注意**：如果机器或操作系统受到节流，无法足够快地创建线程以至于导致资源饥饿，那么可能让该示例运行完成。\n\n虽然这个示例显然不完全代表性，但它旨在标示例如在一个每个连接对应一个线程的\
  \ Web 服务环境中会发生什么。期望一个现代高性能 Web 服务器能够处理 20,000 个并发连接是完全合理的，但这个示例清楚地展示了“每个连接一个线程”架构在这种情况下的失败。\n\
  \n**注意**：思考 Loom 的另一种方式是，现代 Java 程序可能需要跟踪比它能创建的线程多得多的执行上下文。\n\n另一个启示可能是，线程的成本可能比我们想象的要昂得多，并且代表了现代\
  \ JVM 的扩展瓶颈。开发者多年来一直试图解决这个问题，要么通过降低线程成本，要么通过使用非线程的执行上下文表示。\n\n尝试实现这一目标的方法之一是 SEDA\
  \ 方法（分阶段事件驱动架构）——简单来说，这是一个系统，领域对象沿着多阶段流水线从 A 移动到 Z，在此过程中发生了各种不同的转换。这可以在分布式系统中使用消息系统实现，也可以在单进程中使用用于每个阶段的阻塞队列和线程池来实现。\n\
  \n在每一步中，领域对象的处理都由一个 Java 对象描述，该对象包含实现该步骤转换的代码。为了让这些代码正常工作，必须保证代码会终止——没有无限循环——而这一点无法由框架强制执行。\n\
  \n这种方法有一些显著的缺点——特别是程序员为了有效使用该架构所需要的纪律。让我们来看一个更好的替代方案。\n\n### 18.3.1 虚拟线程\n\nProject\
  \ Loom 旨在通过向 JVM 添加以下新构造结构，为今天的大规模应用提供更好的体验：\n\n*   虚拟线程\n*   界限延续（Delimited continuations）\n\
  *   尾调用消除\n\n这里的关键方面是 `virtual threads`。它们被设计成在程序员看来就是“普通的线程”。然而，它们由 Java 运行时管理，而不是对操作系统线程的、对一的轻量级封装。相反，它们由\
  \ Java 运行时在用户空间中实现。虚拟线程意图带来的主要优势包括：\n\n*   创建和阻塞它们的开销很小。\n*   可以使用标准的 Java 执行调度器（线程池）。\n\
  *   栈不需要操作系统层的数据结构。\n\n移除了操作系统在虚拟线程生命周期中的参与，这消除了扩展性瓶颈。我们的 JVM 应用可以处理数百万甚至数十亿个对象——那么为什么我们被局限于几千个操作系统可调度的对象（这是理解线程的一种方式）呢？打破这一限制并解锁新的并发编程风格是\
  \ Project Loom 的主要目标。\n\n让我们看看虚拟线程的运行情况。下载 Loom 测试版（`https://jdk.java.net/loom/`），并这样启动\
  \ `jshell`（启用预览模式以激活 Loom 功能）：\n\n```bash\n$ jshell --enable-preview\n|  Welcome\
  \ to JShell -- Version 18-loom\n|  For an introduction type: /help intro\n\njshell>\
  \ Thread.startVirtualThread(() -> {\n   ...>     System.out.println(\"Hello World\"\
  );\n   ...> });\nHello World\n$1 ==> VirtualThread[<unnamed>,<no carrier thread>]\n\
  \njshell>\n```\n\n我们可以直接在输出中看到虚拟线程构造。我们还使用了一个新的静态方法 `startVirtualThread()` 在新的执行上下文中启动\
  \ lambda，这是一个虚拟线程。简单！！\n\n通用规则必须是，现有的代码库在 Loom 出现之前必须继续以以前完全相同的方式运行。或者换句话说，使用虚拟线程必须是可选的（opt-in）。我们必须做出保守假设，所有现有的\
  \ Java 代码确实需要对操作系统线程的轻量级封装，而到目前为止这是唯一的选择。\n\n虚拟线程的到来在其他方面开启了新视线。直到现在，Java 语言提供了创建新线程的两种主要方式：\n\
  \n*   子类 `java.lang.Thread` 并调用继承的 `start()` 方法。\n*   创建 `Runnable` 实例并将其传递给 `Thread`\
  \ 构造函数，然后启动结果对象。\n\n如果关于线程*是什么*的定义发生变化，那么重新检查我们用于创建线程的方法也是有意义的。我们已经认识了用于发后即忘型虚拟线程的新静态工厂方法，但现有的线程\
  \ API 还需要在其他方面进行改进。\n\n### 18.3.2 线程构建器\n\n一个重要的新概念是 `Thread.Builder` 类，它是作为 `Thread`\
  \ 的内部类添加的。`Thread` 添加了两个新的工厂方法来访问平台线程和虚拟线程的构建器，如下：\n\n```bash\njshell> var tb =\
  \ Thread.ofPlatform();\ntb ==> java.lang.ThreadBuilders$PlatformThreadBuilder@312b1dae\n\
  \njshell> var tb = Thread.ofVirtual();\ntb ==> java.lang.ThreadBuilders$VirtualThreadBuilder@506e1b77\n\
  ```\n\n让我们通过以下代码替换示例中的 `makeThread()` 方法来看构建器的用法：\n\n```java\n // Loom 代码\n    public\
  \ static Thread makeThread(Runnable r) {\n        return Thread.ofVirtual().unstarted(r);\n\
  \    }\n```\n\n这调用了 `ofVirtual()` 方法来显式创建一个执行我们的 `Runnable` 的虚拟线程。我们当然可以使用 `ofPlatform()`\
  \ 方法代替，得到一个传统的、操作系统可调度的线程对象。但那样有什么趣呢？\n\n如果我们用虚拟版本替换 `makeThread()`，并使用支持 Loom 的\
  \ Java 版本重新编译我们的示例，我们就可以执行生成的代码。这次，程序顺利运行完成，没有问题。这是 Loom 哲学在行动中的良好示例——将应用程序所需的更改局部化到创建线程的代码位置。\n\
  \n新线程库鼓励开发者放弃旧范式的方法之一是 `Thread` 的子类不能是虚拟的。因此，子类 `Thread` 的代码将继续使用传统的操作系统线程创建。\n\n\
  \n\n\n\n注意：随着时间的推移，虚拟线程变得越来越常见，开发者不再关心虚拟线程和操作系统线程之间的区别，这应该抑制使用子类化机制，因为这始终创建一个可以由操作系统调度的线程。\n\
  \n此举意图是保护使用 `Thread` 子类的现有代码，并遵循最小惊讶原则。\n\n线程库的许多其他部分也需要升级，以更好地支持 Loom。例如，`ThreadBuilder`\
  \ 还可以构建 `ThreadFactory` 实例，并像如下所示传递给各种 `Executors`：\n\n```\njshell> var tb = Thread.ofVirtual();\n\
  tb ==> java.lang.ThreadBuilders$VirtualThreadBuilder@312b1dae\n\njshell> var tf\
  \ = tb.factory();\ntf ==> java.lang.ThreadBuilders$VirtualThreadFactory@506e1b77\n\
  \njshell> var tb = Thread.ofPlatform();\ntb ==> java.lang.ThreadBuilders$PlatformThreadBuilder@1ddc4ec2\n\
  \njshell> var tf = tb.factory();\ntf ==> java.lang.ThreadBuilders$PlatformThreadFactory@b1bc7ed\n\
  ```\n\n虚拟线程需要附加到实际的操作系统线程上执行。这些虚拟线程执行的操作系统线程被称为 `carrier threads`（载线程）。我们在之前的一个示例的某些\
  \ `jshell` 输出中已经见过载线程了。然而，在生命周期内，单个虚拟线程可能会运行在多个不同的载线程上。这在某种程度上类似于普通线程随着时间推在不同的物理\
  \ CPU 核心上执行的方式——两者都是执行调度的示例。\n\n### 18.3.3 使用虚拟线程编程\n\n虚拟线程的到来带来了思维方式的转变。编写了目前 Java\
  \ 并发应用程序的程序员已经习惯了（有意识或无意识地）处理线程固有的扩展性局限性。\n\n我们习惯于创建任务对象（通常基于 `Runnable` 或 `Callable`），并将它们交给由线程池支持的执行器（executors），线程池的存在是为了节省我们宝贵的线程资源。如果这一切突然发生了变化呢？\n\
  \n从本质上说，Project Loom 尝试引入一种比现有概念更廉价且不直接映射到操作系统线程的新线程概念，来解决线程的扩展性局限。然而，这种新能力看起来和行为上仍然像\
  \ Java 程序员已经理解的线程。\n\nLoom 并不是要求开发者学习一种全新的编程风格（例如延续传递风格、Promise/Future 方法或回调函数），而是\
  \ Loom 运行时为虚拟线程保留了我们从当今线程中熟悉的相同编程模型；对于程序员来说，虚拟线程至少就是线程。\n\n虚拟线程是 `preemptive`（抢占式）的，因为用户代码不需要显式地让出（yield）。调度点取决于虚拟调度器和\
  \ JDK。用户不必对这些调度点何时发生做任何假设，因为这纯粹是实现细节。然而，理解调度背后的操作系统理论基础，有助于理解虚拟线程的何不同之处。\n\n当操作系统调度平台线程时，它会为线程分配一个\
  \ `timeslice`（时间片）CPU 时间。当时间片用完时，会产生硬件中断，内核能够重新接控制，移除正在执行的平台（用户）线程并将其替换为另一个。\n\n\
  注意这种机制是 Unix（以及其他各种操作系统）能够在不同任务之间实现处理器时间分片的方式——即使在几十年前计算机只有一个处理核心的时代也是如此。\n\n然而，虚拟线程的处理方式与平台线程不同。现有的虚拟线程调度器中没有一个使用时间片来抢占虚拟线程。\n\
  \n注意：使用时间片来抢占虚拟线程是可能的，而且虚拟机已经能够控制执行中的 Java 线程——例如它在 JVM 安全点（safepoints）处就会这样做。\n\
  \n相反，当进行阻塞调用（如 I/O）时，虚拟线程会自动放弃（或 `yield`）它们的载线程。这由库和运行时处理，而不处于程序员的显式控制之下。\n\n因此，Loom\
  \ 并不是强迫程序员显式地管理让出，也不依赖于非阻塞或基于回调的操作的复杂性，而是允许 Java 程序员以传统的线程顺序风格编写代码。这具有额外的优势，例如允许调试器和性能剖析器以通常的方式工作。工具制作者和运行时工程师需要为虚拟线程做一些额外工作，但这比强迫终端用户\
  \ Java 开发者承担额外的认知负担要好。特别是，这种方法与其他某些编程语言采用的 `async`/`await` 方法不同。\n\nLoom 的设计者预计，由于虚拟线程永远不需要池化，它们永远不应该被池化，相反，模型是无限制地创建虚拟线程。为了这个目的，增加了一个\
  \ `unbounded executor`（无界执行器）。可以通过新的工厂方法 `Executors.newVirtualThreadPerTaskExecutor()`\
  \ 访问它。虚拟线程的默认调度器是引入到 `ForkJoinPool` 中的工作窃取调度器。\n\n注意：Fork/Join 的工作窃取方面变得比任务的递归分解重要得多，这很有趣趣。\n\
  \nLoom 目前的设计是基于开发者理解其应用程序中不同线程上将存在的计算开销。简单来说，如果大量线程都需要持续大量的 CPU 时间，那么你的应用程序就面临资源瓶颈，巧妙的调度也无法帮助。另一方面，如果预计只有少数线程会变成\
  \ CPU 密集型，这些应该被放在单独的池中配置平台线程。\n\n虚拟线程还旨在适用于许多线程仅偶尔是 CPU 密集型的情况。其意图是工作窃取调度器将平滑 CPU\
  \ 利用率，而现实代码最终会调用通过让出点（如阻塞 I/O）的操作。\n\n### 18.3.4 Project Loom 何时到达？\n\nLoom 的开发在一个独立的仓库中进行，而不是在\
  \ JDK 主线中。提供了早期访问的二进制文件，但这些仍然存在一些粗糙之处——崩溃仍然发生，但变得越来越少。基础 API 正在成型，但几乎肯定还没有完全确定。\n\
  \nJEP 425 ([`openjdk.java.net/jeps/425`](https://openjdk.java.net/jeps/425)) 已提交将虚拟线程作为预览功能集成，但在编写期间，该\
  \ JEP 尚未针对任何发布版本。可以合理地假设，如果它没有作为预览功能包含在 Java 19 中，那么该功能的最终版本将不会作为 Java 21（这很可能是\
  \ Java 的下一个 LTS 版本）的一部分可用。对于构建在虚拟线程之 API（例如结构化并发和其他更高级的功能），仍然有大量工作要做。\n\n开发者一直有的关键问题是关于性能，但在新技术的开发早期，回答这个问题总是很困难。对于\
  \ Loom，我们还没有达到可以进行意义比较的阶段，目前的性能并不被认为能代表最终版本。\n\n18.4 Project Valhalla\n\n为了使 JVM\
  \ 内存布局行为与现代硬件的成本模型对齐。\n\n—Brian Goetz\n\n\n\n\n为了理解当前 Java 内存布局模型在何处达到极限并开始崩溃，让我们从一个示例开始。在图\
  \ 18.1 中，我们可以看到一个原始类型 `int` 数组。由于这些值是原始类型而不是对象，它们被排列在相邻的内存位置。\n\n![](img/CH18_F01_Evans2.png)\n\
  \n图 18.1 原始 int 数组\n\n为了看到与对象数组的区别，让我们将其与包装整数（boxed integer）进行对比。`Integer` 对象的数组将是一个引用数组，如图\
  \ 18.2 所示。\n\n![](img/CH18_F02_Evans2.png)\n\n图 18.2 `Integer` 对象的数组\n\n由于每个 `Integer`\
  \ 都是一个对象，正如我们在上一章中解释的那样，它需要一个对象头（object header）。我们有时说，每个对象都必须支付作为 Java 对象所付的“标头税”（header\
  \ tax）。\n\n20 多年来，这种内存布局模式一直是 Java 平台运行的方式。它的优点是简单，但在性能上有所权衡：处理对象数组涉及不可避免的指针间接引用和随之而来的缓存失效（cache\
  \ misses）。\n\n例如，考虑一个表示三维空间点的类，`Point3D` 类型。它实际上只包含三个空间坐标，在 Java 17 中，它可以被表示为一个具有三个字段的对象类型（或等效的\
  \ record），如下：\n\n```\npublic final class Point3D {\n    private final double x;\n\
  \    private final double y;\n    private final double z;\n\n    public Point3D(double\
  \ a, double b, double c) {\n        x = a;\n        y = b;\n        c = z;\n   \
  \ }\n\n    // 额外方法，例如 getters, toString() 等\n}\n```\n\n在 HotSpot 中，这些点对象的数组在内存中的布局如图图\
  \ 18.3 所示。\n\n![](img/CH18_F03_Evans2.png)\n\n图 18.3 `Point3D` 数组\n\n在处理此数组时，每个元素都需要通过额外的间接引用来获取每个点的坐标。这会导致数组中的每个点都发生缓存失效，无故地降低性能。\n\
  \n对于非常关注性能的程序员来说，能够定义在内存中布局更有效的类型将是非常用的。我们还应该注意，在处理 `Point3D` 值时，对象标识性（object identity）对程序员来说没有实际收益，因为当且仅当所有字段都相等时，两个点才相等。\n\
  \n这个示例展示了两个由移除对象标识性而实现的独立编程概念：\n\n* `Heap flattening`（堆扁平化）——消除无标识对象的指针间接引用，从而提高了内存密度。\n\
  * `Scalarization`（标量化）——将无标识对象拆分为字段的能力，并在需要时在其他地方重新构造它。\n\n这些独立的属性将对无标识对象的标识用户模型产生影响。\n\
  \n注意：事实证明，标量化——虚拟机随心意欲拆分并重构值对象的能力——出奇地有用。JVM 包含一种名为 `escape analysis`（逃逸分析）的 JIT\
  \ 技术，它可以从将值对象拆分为各个字段并在代码中单独流过的自由中极大获益。\n\n记住这些属性，我们也可以从以下问题来思考 Valhalla：“我们可以避免支付标头税吗？”广泛来说，答案是肯定的，前提是满足以下条件：\n\
  \n* 对象不需要身份标识概念。\n* 类是 `final` 的，因此所有方法调的目标在类加载时即可已知。\n\n基本上，第一个属性消除了对标头标记字（mark\
  \ word）的需求，第二个属性极大地减少了对 `klass` 字的需求（关于 `klass` 字的更多信息见第 4 和第 17 章）。\n\n对象在堆上时仍然需要\
  \ `klass` 字，除非它作为另一个对象的实例字段被扁平，或者作为数组元素被扁平，因为对象字段布局可能需要描述——例如，以便 GC 遍历对象图。然而，当对象被标量化后，我们可以丢弃头部。\n\
  \n从开发者的角度来看，Valhalla 的主要结果之一 Java 生态系统中出现了新形式的值，被称为 `value objects`（值对象），它们 `value\
  \ classes` 的实例。这些新类型被理解为（通常是）小的、不可变的、无标识的类型。\n\n注意：值类在开发过程中曾有几个不同的名称，包括 `primitive\
  \ classes`（原始类）和 `inline types`（内联类型）。命名是困难的，尤其在一个成熟的语言中，该语言可能已经对语言概念使用了许多常用名称。\n\
  \n值类的示例用例包括：\n\n* 新种类的数值类型，例如无符号字节、128 位整数和半精度浮点数\n* 复数、颜色、向量和其他多维数值\n* 带单位的数字：尺寸、温度、速度、现金流等\n\
  * Map 条目、数据库行和多返回值返回的类型\n* 不可变的游标、子数组、中间流和其他数据结构视图抽象\n\n还存在某些现有类型可以被重构并演变为表示为值类的可能性。例如，`Optional`\
  \ 和 `java.time` 的大部分是显而易见的候选者，如果证明可行，它们在未来的发布中可能会成为值类。\n\n注意：`Records` 本身与值类没有直接关系，但许多\
  \ `Records` 很有可能成为不需要标识的聚合体，因此 `value record`（值记录）的概念可能是非常有用的。\n\n如果这种新形式的值可以在 JVM\
  \ 上实现，那么对于我们讨论的空间点类，如图 18.4 所示的扁平化布局将高效得多。\n\n![](img/CH18_F04_Evans2.png)\n\n图\
  \ 18.4 内联点的数组\n\n这种内存布局将类似于 C 程序员识别的 `struct` 数组，但没有暴露底层访问的危险。扁平化布局不仅减少了内存占用，还减轻了垃圾收集器的负担。\n\
  \n### 18.4.1 修改语言模型\n\n需要的最重大更改是修改 `java.lang.Object` 作为通用父类的概念，因为它包含了 `wait()`\
  \ 和 `notify()` 等方法，这些方法与对象标识性内在相关。没有了对象头，就没有存储显示器的标记字，也没有可以等待的对象。对象也没有真正定义的生命周期，因为它可以被自由复制且生成的副本不可区分的。相反，在\
  \ `java.lang` 中定义了两个接口：`IdentityObject` 和 `ValueObject`。JEP 401（见 [`openjdk.org/jeps/401`](https://openjdk.org/jeps/401））详细描述了值对象，但基本上所有的值类都隐式实现\
  \ `ValueObject`。\n\n所有标识类将隐式实现 `IdentityObject`，并且所有现有的具体类都作为标识类。现有的接口和（大多数）抽象类没有扩展这两个新接口之一。如果\
  \ API 设计者的功能与新语义不兼容，他们可能希望更新其接口以显式扩展 `IdentityObject`。\n\n值类是 `final` 的且不能是 `abstract`。它们不能（直接或间接地）实现\
  \ `IdentityObject`。可以使用 `instanceof` 测试来检查对象是否为值对象。\n\n注意：除了不能在值对象上进行 `wait()` 或\
  \ `notify()` 之外，无法拥有同步方法或块，因为值对象没有显示器。\n\n此类代码：\n\n```\nvar o = new Object();\n\
  ```\n\n\n\n也将改变含义——预计 `o` 将包含 `Object` 的某个匿名子类的实例，出于后兼容性考虑，它将被理解为一个等标识类（identity\
  \ class）。\n\n尽管值类（value classes）最初的目标似乎很明确，但事实证明它具有深远的影响。为了确保项目的成功，必须考虑引入第三种形式数值的逻辑结论。\n\
  \n#### 18.4.2 值对象的后果\n\n值对象的赋值具有非常直观的语义：位被复制，就像原始类型一样（引用的赋值也会复制位，但在那种情况下，我们得到的是指向同一个堆位置的引用）。然而，如果我们需要构造一个与原始对象不完全相同但是修改后的副本的值对象，会发生什么呢？\n\
  \n记住值对象是不可变的——它们只有 `final` 字段。这意味着它们的状态不能通过 `putfield` 操作来改变。相反，需要另一种机制来产生一个与原始对象状态不同的值对象。为了实现这一点，需要一些新的字节码，如下所示：\n\
  \n* `aconst_init`\n* `withfield`\n\n新的 `withfield` 指令本质上在字节码层级等同于使用 wither 方法（我们在第\
  \ 15 章中讨论过）。\n\n另一个新指令 `aconst_init` 为值类实例提供默认值。让我们仔细看看为什么需要它。\n\n在到目前的 Java 中，原始类型和对象引用都被认为具有一个对应于“所有位为零”的默认值，其中\
  \ `null` 被理解为引用在零位时的含义。然而，当我们尝试将这些语义扩展到处理值对象时，我们发现了两个相关问题：\n\n* 某些值类没有理想的默认值选择。\n\
  * “值撕裂”（value tearing）的可能性。\n\n“糟糕的默认值”（no-good-default）问题实际上源于想要能够表示该值对象还不是真正的数值，但\
  \ Java 已经有一种处理方法了：`null`。此外，用户在面对未初始化的值时，已经习惯了处理 `null` 指针异常（NPE）。\n\n第二个问题“撕裂”实际上是换汤不药的老问题。在\
  \ Java 的旧版本中，在 32 位硬件上运行时，处理 64 位值（如 `long`）时会有一些微妙的潜在问题。特别是，对 `long` 的写入是作为两个独立的（32\
  \ 位）写入执行的，读取线程可能会观察到只有其中一个 32 位写入已完成的状态。这将允许读取线程观察到一个被“撕裂”的 `long` 值——它既不是之前的状态，也不是之后后的状态。\n\
  \n值类型（Value types）有可能重新引入这一问题。如果值可以被标量化（scalarized），那么我们如何保证写入的原子性呢？\n\n解决方案是意识到值类代表的不是一种新的数据形式，而是*两种*。如果我们想避免避免撕裂，我们需要使用引用。这是一个广为人知的想法：使用间接层（layer\
  \ of indirection）允许我们在更新值时不产生撕裂。\n\n此外，考虑到某些类没有可以对应于零位的合理默认值。例如，`LocalDate` 在迁移到值类后，其默认值是什么？有人可能认为零位应该被解释为相对于纪元（epoch）的零偏移（即\
  \ 1970 年 1 月 1 日），但这看起来极易出错。\n\n这引出了我们“无标识引用”（identity-free references）的概念——基本上，就是我们去除了标识性的对象。在底层，这仍然允许\
  \ JIT 中进行调用约定优化（例如值的标量化传递）以及 JIT 代码中的标量化，但放弃了堆上的内存改进。这些对象始终通过引用处理，就像等标识对象一样，并且它们有一个直接的默认值\
  \ `null`。为对象设置非平凡的默认值则由构造函数或工厂方法处理，正如它们应该做的那样。\n\n此外，对于高级用例，还有“原始值类型”（primitive\
  \ value types）。它们的作用更像内置的“真正的原始类型”，允许在堆中扁平化，以及值对象所允许的标量化。然而，额外的收益也伴随着代价——必须接受零位作为默认值，以及在可能发生数据态的更新下可能出现撕裂。\n\
  \n注意：意图是原始值类型实际上仅用于小型数值（在今天的硬件上为 64–128 位或更少），在使用它们时需要额外的小心。\n\n撕裂确实会让用户暴露在潜在的安全问题中，尽管人们很想说这只是具有数据态的“糟糕”程序才的问题。无论如何，这都是一种新形式的可能并发漏洞，需要通过锁来适当防御。\n\
  \n原始值类的另一个方面是运行时需要知道如何在内存中布局它们。因此，无法创建一个引用（直接或间接）声明类的原始值类字段。换句话说，原始值类的实例不能包含原始值类的循环数据结构——它们必须具有固定大小布局，以便在堆中扁平化。总体而言，预期是大多数用户将希望使用无标识值对象，而扩展的原始类型的使用频率会少得多。\n\
  \n总结本节，让我们看看值类在字节码中表示的另一个方面。回想起第 4 章，我们遇到了类型描述符（type descriptor）的概念。标识引用类型在字节码中通过\
  \ `L-type 符` 表示，例如字符串的 `Ljava/lang/String;`。\n\n为了描述原始类的值，正在添加一种新的基本类型 `Q-type 符`。以\
  \ `Q` 开头的描述符与 L 描述符具有相同的结构（例如类 `Point3D` 的 `QPoint3D;`）。Q 和 L 值都由相同的字节码操作，即以 `a`\
  \ 开头的指令，如 `aload` 或 `astore`。\n\n\n\n\n幸运的是，`Object` 的角色在 `Valhalla` 中发生了微妙的变化——它被追溯性地修改为值对象和标识性对象的超类。这使得我们能够将值对象包含在现有的泛型范围内。然而，将原始类型集成到这一模型中也是非常理想的。\n\
  \n长期的意图是能够扩展泛型——允许对所有类型（包括值类和现有的原始类型（以及 `void`））进行抽象。如果这个项目要取得成功，我们需要能够兼容地演进现有的库——特别是\
  \ `JDK` 库——以充分利用这些特性。\n\n部分地，这项工作还涉及更新基础值类型（`int`、`boolean` 等）使其成为原始值类，从而使基础原始值变成原始对象。这意味着包装类也将被重新利用，以适应原始类模型。\n\
  \n这种对泛型的扩展将为原始类型产生一种泛型特化（generic specialization）。这引入了类似于其他语言（如 `C++` 中的模板）的泛型编程系统的特性。在此时，泛型工作仍处于早期阶段，所有与其相关的\
  \ `JEPs` 均处于 `Draft`（草案）状态。\n\n## 18.5 Java 18\n\n任何试图前瞻性的文本，其本质决定了它们在阅读时不可避免地会过时。此时，`Java\
  \ 17` 已发布，`Java 18` 已于 2022 年 3 月发布。以下 `JEPs` 针对 `Java 18` 并构成了新版本的内容：\n\n*   `JEP\
  \ 400` 默认 UTF-8\n*   `JEP 408` 简单 Web 服务器\n*   `JEP 413` Java API 文档中的代码片段\n*  \
  \ `JEP 416` 使用 Method Handles 重实现核心反射\n*   `JEP 417` Vector API（第三个孵化器）\n*   `JEP\
  \ 418` 互联网地址解析 SPI\n*   `JEP 419` 外部函数和内存 API（第二个孵化器）\n*   `JEP 420` `switch` 模式匹配（第二次预览）\n\
  *   `JEP 421` 弃用 Finalization 以待移除\n\n在这些内容中，UTF-8 的更改、对核心反射的更改以及 finalization 的弃用属于内部更改，它们对内部进行了一些清理和简化，可以在未来的发布中在此基础上构建。\n\
  \nVector 和 Foreign API 的更新是通往 `Panama` 之旅的下一个里程碑，而模式匹配的下次迭代是 `Amber` 的下一步。`Java\
  \ 18` 不包含任何交付 `Loom` 或 `Valhalla` 部分内容的 `JEPs`。此时尚未确认任何，但据传 `Loom` 的第一个版本将作为预览功能在\
  \ `Java 19` 中发布（预计 2022 年 9 月）。\n\n## Summary\n\nJava 的原始设计原则之一是语言应该谨慎演进——在充分理解某项特性对语言整体的影响之前，不应实现它。其他语言可以并且比\
  \ `Java` 移动得更快，这有时会导致开发者抱怨“Java 需要更快演进”。然而，硬币另一面是其他语言可能会“快速前进，随后后悔”。一个缺陷的设计一旦集成到语言中，本质上就会永远存在。\n\
  \n相反，Java 的方法是谨慎演进，确保在实施之前充分理解该特性的影响。\n\n## Appendix A. 选择您的 Java\n\n随着 `Oracle\
