  ### 类加载与反射的结合\n### 反射的问题\n\n# 5 Java 并发基础\n## 5.1 并发理论入门\n#### 解释 Java 线程模型\n####\
  \ 经验总结\n\n## 5.2 设计概念\n\n\n\n### volatile 访问\n\n## 6 JDK 并发库\n\n\n\n\n\n\n\n\n\n\
  \n\n\n\n\n\n\n\n\n\n### 闭包\n### 柯里化与偏应用\n\n## 16 高级并发编程\n### Agents (代理)\n\n## 17\
  \ 现代内部机制\n\n\n\n\n# VarHandles\n# 隐藏类\n\n\n## 前言\n\n基础扎实（Well-grounded）吗？你是说“多面手（well-rounded）”吗？两年的大流行就足以让你做到这一点，还不需要书。\n\
  \n韦伯-韦斯特词典将 well-grounded 定义为“拥有坚实的基础”。我喜欢这个词。我们希望在 Java 上拥有一个坚实的基础——即为了自诩为 Java\
  \ 专家而需要掌握的实用知识。这本书接续了 `Effective Java` 结束的地方。\n\n这是一本伟大著作的第二版。第一版教会了我们学习 `Java 7`\
  \ 所需的所有知识。那似乎是很久以前的事了。`Java 7` 属于另一个时代，那个时代语言最多每三年才添加新功能。在那个时候，区分版本很容易。`Java 5`？泛型和枚举。`Java\
  \ 7`？`try-with-resource`。`Java 8`？`Streams` 和 `lambdas`。那些轻松的日子在 Oracle 引入六个月发布周期后结束了。Records——这些是\
  \ `Java 14`、`15` 还是 `17`？增强型 Switch？那已经在 `Java 11` 中了吗？\n\n快速的发布周期对于在冒险型公司工作的程序员来说是非常棒的。每六个月，他们就有新玩具可以玩。他们甚至可以尝试未来功能的预览版。无数新功能对程序员来说很奇妙，但对作者来说并不友好。在墨水还没干透之前，新功能的发布就会让很多内容过时。\n\
  \nBen、Jason 和 Martijn 对这本新的 Java 书做出了非常出色的工作。基本假设保持不变。用我的话来说：“如果你想雇佣一名专业的 Java 程序员，你期望他们已经知道什么？他们需要什么技能来证明自己基础扎实？”\n\
  \n这个新版本在六个月一次的发布节奏下已经尽可能跟时了。同时，作者们并没有用新事物淹没我们。残酷的现实是，大多数企业仍然停留在旧版本的 `Java` 上。即使发布了\
  \ `Java 18`，许多银行、保险公司和政府部门在使用 `Java 8`。\n\n这本书比上一版多大约 200 页。字体大了一点——好吧，大家都老了九岁，不是吗？但页边缩小了。许多章节拥有全新的内容。这是一个新版没有让旧版过时的案例。两者都应该出现在严肃\
  \ Java 程序员的书架上。\n\nBenjamin J. Evans、Jason R. Clark 和 Martijn Verburg 是 Java 专家。他们在\
  \ Red Hat、New Relic 和微软担任高级 Java 职位。让我们利用他们的集体智慧。这本书将帮助我们发现薄弱领域并进行改进。最终，通过足够的努力，我们可以自称为`基础扎实的\
  \ Java 程序员`。\n\nHeinz Kabutz\n\nJava 专家通讯报\n\n## 序言\n\n这本书的第一版最初是为银行外汇部门的新毕业开发者编写的一组培训笔记。我们中的其中一人（Ben）在查看市场上的现有书籍时，发现缺乏针对想要提升水平的\
  \ Java 开发者的最新材料。在编写这些材料的过程中，他发现自己正在写那本空缺的书，并邀请了 Martijn 帮助。\n\n那是 10 多年前的事了——当时我们正在\
  \ `Java 7` 开发期间进行编写——现在世界已经完全不同了。作为回应，这本书自第一版以来发生了巨大的变化。尽管我们最初的首要目标是介绍以下主题：\n\n\
  *   多语言编程（Polyglot programming）\n*   依赖注入\n*   多线程编程\n*   健全的构建和 CI 实践\n*   Java\
  \ 的新特性\n\n当我们制作第二版时，我们发现需要进行一些更改，包括：\n\n*   精简多语言编程\n*   增加对函数式编程关注\n*   增强对多线程的讨论\n\
  *   对构建和部署提供不同的视角\n*   讨论 Java 的新特性\n\n然而，从那时起世界向前了。`Java 8` 和 `11` 变得占据主导地位，而 `Scala`\
  \ 群体大多在写 `Kotlin`。这对于那些想要那样的人来说是棒的，但也付出了代价，例如运行时变得越来越复杂，而且语言随着时间的推移与 `Java` 的共同点越来越少。\n\
  \n\n\n\n\n开发者在职业生涯中的持续动力源于他们对技术的投入以及对持续学习的热情。在本书书中，我们希望突出一些能够点燃这种热情的课题。这是一场观光之旅，而非百科全书式的研究，但这正是我们的意图——让你入门，然后让你根据自己的兴趣去探索那些激发你想象力的话题。\n\
  \n我们将带你从 `Java` 近期版本的新功能，一直延伸到现代软件开发的最佳实践以及该平台的未来。在此途中，我们将向你展示了一些在我们作为 Java 技术人员的历程中与我们深相关的亮点。\n\
  \n并发、性能、字节码和类加载是我们最令我们着迷的一些核心技术。我们还谈论了 `JVM` 上崭新的非 Java 语言，原因基于以下两点：\n\n*   非 Java\
  \ 语言在整个 `Java` 生态系统中的重要性日益增加。\n*   理解不同语言带来的不同视角，会让你在编写任何语言时都成为一名更出色的程序员。\n\n最重要的是，这是一场前瞻性的之旅，将你和你的兴趣置于中心。我们认为，成为一名扎实的\
  \ `Java` 开发者将帮助你保持投入并掌控自己的开发进程，并将帮助你更多地了解不断变化的 `Java` 世界及其周围的生态系统。我们希望你手中这些提炼的经验对你是有用且有趣的，并且阅读过程能引发你的思考并充满乐趣。编写这本书的过程无疑也同样有趣！\n\
