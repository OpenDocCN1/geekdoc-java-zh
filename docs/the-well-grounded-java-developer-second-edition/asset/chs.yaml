  \n## 关于本书\n\n\n欢迎阅读《全能 Java 开发者》（The Well-rounded Java Developer）。本书旨在培养你成为未来十年的\
  \ `Java` 开发者，重新点燃你对这种语言和平台的热情。途中，你将发现新的 `Java` 特性，确保熟悉必要的现代软件技术（如测试驱动开发和基于容器的部署），并开始探索\
  \ `JVM` 上非 Java 语言的世界。\n\n首先，让我们看看 James Iry 在一篇精彩的博客中对 `Java` 语言的描述，文章名为《编程语言的简短、不完整且大部分错误的历史》，地址为\
  \ `http://mng.bz/2rz9`：\n\n1996—James Gosling 发明了 Java。`Java` 是一种相对冗长的、带垃圾收集的、基于类的、静态类型的、单分发的面向对象的语言，具有单实现继承和多接口继承。太阳威视公司大声宣布了\
  \ Java 的新颖性。\n\n尽管 Java 引入的重点大多是为了设定一个让 `C#` 获得同样描述的笑话，但作为对语言的描述，这并不糟糕。整篇博客还包含了许多其他亮点，非常值得在空闲时读一读。\n\
  \n这提出了一个非常现实的问题：为什么我们还在讨论一个已经超过 26 年的语言？难道它已经很稳定了，关于它没有什么新奇或有趣的事情可以说的了吗？\n\n如果是那样的话，这本书将会很短。我们之所以还在讨论它，是因为\
  \ Java 的最大优势之一是它能够在几个核心设计决策的基础上进行构建，而这些决策在市场上被证明是非常成功的：\n\n*   运行时环境的自动管理（例如垃圾回收、即时编译）\n\
  \n\n\n\n\n* 核心语言语法简单，概念相对较\n* 语言演进方式保守\n* 库提供了额外的功能和复杂性\n* 广阔、开放的生态系统\n\n这些设计决策让\
  \ Java 世界保持了创新——简单的核心保持了加入开发者社区的低门槛，而广阔的生态系统让新成员能够轻松找到符合其需求的现有组件。这些特性使 Java 平台和语言保持了强大和充满活力——尽管该语言在历史上倾向于缓慢变化。事实证明，强一致性与演进式变化的结合在软件开发者中赢得了许多追随者。\n\
  \n### 如何使用本书\n\n书中的内容设计上倾向于从头到尾阅读，但我们理解某些读者可能希望直接深入特定主题，因此我们也尽力兼顾了这种阅读风格。\n\n我们坚信实践学习，因此建议读者在阅读文本时尝试书中随附的示例代码。本节的其余部分将介绍如果你更倾向于阅读独立章节的风格，该如何阅读此书。\n\
  \n\n\n第 1 部分（第 1–3 章）包含了关于 Java 最新版本的三个章节。全书统一使用 Java `11` 语法和语义，并特别标注了 11 版本之后语法的特定用法。\n\
  \n第 2 部分（第 4–7 章）首次探讨了幕后世界。艺术领域有一个真理：人们必须在了解规则之前才能有信誉地打破规则。这些章节概述了如何首先弯曲然后打破 Java\
  \ 编程语言的规则。\n\n\n\n\n第 5 部分（第 15–18 章）在之前介绍的主题基础上，深入探讨函数式编程、并发和平台内部。虽然这些章节可以独立阅读，但在某些章节中，我们假设你阅读了之前的章节和/或已经熟悉某些主题。\n\
  \n本书坚定地针对 Java。\n\n### 其他在线资源\n\n[`github.com/well-grounded-java/resources`](https://github.com/well-grounded-java/resources)\n\
  \n## 关于作者\n\nBen Evans 是 Java 军师（Java Champion），红帽公司（Red Hat）高级首席软件工程师。他曾担任 New\
  \ Relic 仪表首席架构师，并共同创立了 jClarity（这是一家被微软收购的性能工具初创公司）。他还曾在德意志银行担任列式衍生品首席架构师，并在摩根士丹担任高级技术导师。他在\
  \ Java 社区进程（JCP）执行委员会担任过六年，帮助定义了新的 Java 标准。\n\n\n\n\nBen 编写了六本书，包括 `Optimizing Java`\
  \ 以及 `Java in a Nutshell` 的新版，他的技术文章每月有数千名开发者阅读。Ben 还是全球各大公司和会议的常驻演讲者和教育者，主题涵盖 Java\
  \ 平台、系统架构、性能和并发等领域。\n\n\nJason Clark 是 New Relic 的首席工程师兼架构师，在那里他负责过从 Ruby 桩化库到容器编排平台的所有工作。在此之前，他在\
  \ WebMD 担任架构师，构建基于 `.Net` 的 Web 服务。\n\n作为一名经常参加会议的演讲，Jason 为开源项目 `Shoes` 做出贡献，旨在让初学者和学生的\
  \ GUI 编程变得简单且有趣。\n\n\nMartijn Verburg 是微软 Java 工程组的首席 SWE 组经理。他是伦敦 Java 用户组（又称 LJC）的共同领导者，在该小组共同创立了\
  \ `AdoptOpenJDK`（现为 `Eclipse Adoptium`），这是全球领先的（非 Oracle 版）OpenJDK 发行版。Martijn 是《The\
  \ Well-Grounded Java Developer, 1st edition》的合著者，并担任多个 Java 标准机构（`JCP`、`Jakarta\
  \ EE` 等）的成员。\n\n《The Well-Grounded Java Developer》封面上的图片名为“花贩”（A Posy Seller），摘自\
  \ Sylvain Maréchal 十九世纪在法国出版的地区服装习俗汇编。\n\n在那个时代，仅通过服装就能识别出人们居住的地方以及他们的职业或地位。Manning\
  \ 通过基于几个世纪前丰富的地区文化多样性的书籍封面，赞扬了计算机业务的创造性和主动性，而这些文化通过此类收藏中的图片被焕发了活力。\n\n\n前三个章将介绍如何向\
  \ Java 17 迈进。你将从一个介绍章节开始，该章节涵盖了 Java 11 引入的一些便利性改进。你将看到自 Java 8 以来 Java 生态系统和发布周期发生了哪些变化，包括以下内容以及这对开发者意味着什么：\n\
  \n从那里开始，你将深入探讨 Java 领域多年来的最大变化之一——添加完整的模块系统。你将看到为什么这种巨大的变化是必要的。它是为了增量采用而精心设计的，在理解这些概念的同时，你将学会如何在你的应用程序和库中开始利用它。\n\
  \n在新的发布周期下，Java 17 带来了一系列新的语言特性，包括\n\n\n到第一部分的结束，你将能够自然地用 Java 17 进行思考和编写，准备在书的剩余部分使用这些新知识。\n\
  \n# 1. 介绍现代 Java\n\n* 语言的变化\n* Java 11 中的小型语言变化\n\n欢迎来到 2022 年的 Java。这是一个令人兴奋的时代。Java\
  \ 17 是 2021 年 9 月发布的最新长期支持（LTS）版本，第一批最具有冒险精神的团队已经开始向它迁移。\n\n在写作此时，除了少数先驱者外，Java\
  \ 应用几乎平均分布在运行 Java 11（2018 年 9 月发布）和老得多的 Java 8（2014 年）之间。Java 11 提供了很多推荐内容，特别是对于在云端部署的团队，但有些团队的采用速度较慢。\n\
  \n因此，在本书的第一部分，我们将花费一些时间介绍 Java 11 和 17 中引入的一些新特性。希望这些讨论能帮助说服一些不愿从 Java 8 升级的团队和经理，让他们相信新版本比以往任何时候都好。\n\
  \n我们本章的重点是 Java 11，因为 a) 它是市场份额最大的 LTS 版本，b) 目前还没有出现明显的 Java 17 采用现象。然而，在第 3 章，我们将引入\
  \ Java 17 的新特性，以让你跟上最新进展。\n\n让我们从处于现代 Java 内的“语言与平台”二元性开始讨论。这是一个至关重要的点，我们在整书中会多次回到这一点，因此在开始时掌握它至关重要。\n\
  \n## 1.1 语言与平台\n\n`Java` 这个术语可以指几个相关概念之一。特别是，它既可以指人类可读的编程语言，也可以指更广泛的“Java 平台”。\n\
  \n惊讶的是，不同的作者有时对什么是语言和平台给出略有不同的定义。这可能导致缺乏清晰性，并对两者之间的差异以及哪个提供了应用程序代码所使用的各种编程特性产生一些困惑。\n\
  \n让我们现在就明确这种区别，因为它触及了书中许多主题的核心。以下是我们的定义：\n\n* `Java 语言`（The Java language）——Java\
  \ 语言是一种静态类型、面向对象的语言，我们在“关于本书”部分轻微调侃过它。希望它对你来说已经非常熟悉了。用 Java 语言编写的源代码有一个明显的一点是它是人类可读的（或应该是应该是！）。\n\
  * `Java 平台`（The Java platform）——平台是提供运行时环境的软件。是 `JVM` 以（非人类可读的）类文件接收并执行你的代码。它不直接解释源文件，而是要求将其转换为类文件。\n\
  \nJava 作为软件系统成功的巨大原因之一是它是标准。这意味着它有描述其如何工作的规范。标准化允许不同的供应商和项目组产生理论上运行相同的实现。规范不对不同实现在处理相同任务时的性能做出保证，但可以对结果的正确性提供保证。\n\
  \n几个独立的规范管理着 Java 系统——最重要的 Java 语言规范 (`JLS`）和 JVM 规范 (`VMSpec`）。这种分离在现代 Java 中被非常重视；事实上，`VMSpec`\
  \ 不再直接引用任何 `JLS`。我们将在书后对这些规范之间的差异进行更多说明。\n\n注意 如今 `JVM` 实际上是一个非常通用的与语言无关的环境。这是规范分离的原因之一。\n\
  \n当你面对描述的二元性时，一个明显的问题是：“它们之间的联系是什么？”如果它们现在是分开的，它们是如何结合形成 Java 系统的？\n\n语言和平台之间的联系是类文件格式的共享定义（`.class`\
  \ 文件）。认真研究类文件定义将会有回报（我们在第 4 章提供了研究）——事实上，这是优秀的 Java 程序员开始成为伟大程序员的途径之一。在图 1.1 中，你可以看到\
  \ Java 代码生成和使用的完整过程。\n\n```\n![](img/CH01_F01_Evans2.png)\n```\n\n图 1.1 Java 源代码转换为\
  \ .class 文件，在加载加载期间进行处理，然后进行 JIT 编译。\n\n\n\n\n如如图所示，Java 代码的生命始于人类可读的 Java 源码，然后通过\
  \ `javac` 编译成 `.class` 文件并加载到 `JVM` 中。在加载过程中，对类进行操纵和修改是常见操作。许多流行的 Java 框架会在类加载时对其进行转换，以注入动态行为，例如类的插桩（instrumentation）或针对类加载的替代查找。\n\
  \n注意：类加载是 Java 平台的一项核心特性，我们将在第 4 章学习更多相关内容。\n\nJava 是编译型语言还是解释型语言？\n\nJava 的标准形象是在在\
  \ `JVM` 上运行之前会被编译成 `.class` 文件的语言。如果被追问，许多开发者也可以解释说字节码最初由 `JVM` 解释，但在稍后的某个点会经过即时编译（JIT\
  \ 编译）。然而，许多人的理解会陷入对字节码的一种相当模糊的概念中，认为字节码基本上是针对某种虚拟或简化版 CPU 的机器码。\n\n事实上，`JVM` 字节码更像是人类可读源码与机器码之间的中间地带。用编译器理论的技术术语来说，字节码实际上是中间语言（IL）的一种形式，而非真正的机器码。这意味着将\
  \ Java 源码转换为字节码的过程并不是 C++ 或 Go 程序员所理解的那种意义编译，而 `javac` 也并不是 `gcc` 意义上的编译器——它实际上是\
  \ Java 源码的类文件生成器。Java 生态系统中真正的编译器是 JIT 编译器，如图 1.1 所示。\n\n有些人将 Java 系统描述为“动态编译的”。这强调了重要的编译是运行时的\
  \ JIT 编译，而不是构建过程中类文件的创建。\n\n注意：源码编译器 `javac` 的存在导致许多开发者将 Java 认为一种静态的、编译型语言。其中一个大秘密是，在运行时，Java\
  \ 环境实际上非常动态——它只是稍微隐藏在表面之下。\n\n所以，对于“Java 是编译型语言还是解释型语言？”的真实答案是“两者兼有”。现在语言与平台之间的区别已经更加清晰，让我们来讨论新的\
  \ Java 发布模型。\n\n## 1.2 新的 Java 发布模型\n\nJava 并非一直是开源语言，但在 2006 年 JavaOne 大会上发布公告后，Java\
  \ 本身的源码（除掉 Sun 公司不拥有源码的少量部分外）已根据 `GPLv2+CE` 许可证发布([`openjdk.java.net/legal/gplv2+ce.html`](https://openjdk.java.net/legal/gplv2+ce.html))）。\n\
  \n这大约是 Java 6 发布，因此 Java 7 是第一个在开源软件（OSS）许可证下开发的 Java 版本。从那时起，Java 平台开源开发的重点一直是\
  \ `OpenJDK` 项目（[`openjdk.java.net`](https://openjdk.java.net)），并且这种状态持续至今。\n\n许多项目讨论在涵盖整个代码库各个方面的邮件列表上进行。有诸如\
  \ `core-libs`（核心库）之类的“永久”列表，也有作为特定 `OpenJDK` 项目组成而形成的临时性列表，例如 `lambda-dev`（lambdas），这些列表在特定项目完成后就会变为非活跃状态。通常情况下，发布是基于这些列表的。\n\
  \n注意：源码编译器 `javac` 的存在导致许多开发者将 Java 认为一种静态的、编译型语言。其中一个大秘密是，在运行时，Java 环境实际上非常动态——它只是稍微隐藏在表面之下。\n\
  \n所以，对于“Java 是编译型语言还是解释型语言？”的真实答案是“两者兼有”。现在语言与平台之间的区别已经更加清晰，让我们来讨论新的 Java 发布模型。\n\
  \n\n\n尽管 Java 的发布模型已改为使用定时发布，但绝大多数团队仍然运行在 `JDK 8` 或 `11` 上。这些 LTS 版本由社区（包括主要供应商）维护，并仍然接收定期的安全更新和错误修复。对\
  \ LTS 版本所做的更改范围刻意非常小，属于“维护性更新”。除了安全和细小的错误修复外，仅允许极少数的更改。这些包括为了确保 LTS 版本在其预期生命周期内继续正常运行所需的修复，包括以下内容：\n\
  \n\n另一个必要的更改是，mac 的构建脚本需要更新，以适配最新版本的 Apple `Xcode` 工具，以便它们在 Apple 操作系统的新发布版本中继续工作。\n\
  \n在维护 `JDK 8` 和 `11` 的项目（有时称为“更新”项目）中，仍然存在一些可以回回新特性的潜在范围，但范围非常极小。例如，指导性规则之一是新回回的功能不能改变程序语义。允许的更改示例包括支持\
  \ `TLS 1.3` 或将 `Java Flight Recorder` 回回到 `Java 8u272`。\n\n现在我们已经通过澄清语言与平台之间的区别并解释新的发布模型设定了背景，让我们接触现代\
  \ Java 的第一个技术特性。我们要学习的新特性是开发者们几乎从 Java 第一次发布起就一直要求的——一种减少编写 Java 程序时所需输入量的方法。\n\n\
  ## 1.3 增强的类型推断 (var 关键字)\n\nJava 在历史上一直以冗长著称。然而，在最近的版本中，该语言已经演进到越来越多地使用类型推断。源码编译器的这项功能允许编译器自动推导出程序中的某些类型信息。因此，它不需要被显式告知一切。\n\
  \n注意 类型推断的目标是减少样板内容、消除重复，并允许编写更简洁、易读的代码。\n\n这种趋势从 `Java 5` 开始，当时引入了泛型方法。泛型方法允许对泛型类型参数进行非常有限的类型推断，因此不需要显式提供所需的精确类型，如下所示：\n\
  \n```\nList<Integer> empty = Collections.<Integer>emptyList();\n```\n\n泛型类型参数可以在右侧省略，如下：\n\
  \n```\nList<Integer> empty = Collections.emptyList();\n```\n\n这种调用泛型方法的方式是如此熟悉，以至于许多开发者可能很难记起带有显式类型参数的写法。这是一件好事——意味着类型推断正在发挥作用，并消多余的样板内容，使得代码的含义清晰可见。\n\
  \nJava 类型推断的下一次重大增强随版本 `7` 到来，它在处理泛型时引入了更改。在 `Java 7` 之前，经常看到这样的代码：\n\n```\nMap<Integer,\
  \ Map<String, String>> usersLists =\n                        new HashMap<Integer,\
  \ Map<String, String>>();\n```\n\n这种声明你拥有某些用户的方式真的非常冗长，你通过 `userid`（这是一个整数）来识别用户，并且每个用户拥有一组特定于用户的属性（建模为字符串到字符串的映射）。\n\
  \n事实上，源码中几乎一半是重复的字符，它们并没有告诉我们任何信息。因此，从 `Java 7` 开始，我们可以写成\n\n```\nMap<Integer, Map<String,\
  \ String>> usersLists = new HashMap<>();\n```\n\n并让编译器推算出右侧的类型信息。编译器正在推算出右侧表达式的正确类型——它不仅仅是替换定义完整类型的文本。\n\
  \n注意 由于缩短的类型声明看起来像一个菱形，这种形式被称为“钻石语法”。\n\n在 `Java 8` 中，增加了更多的类型推断以支持 lambda 表达式的引入，如下例所示，类型推断算法可以得出\
  \ `s` 的类型为 `String`：\n\n```\nFunction<String, Integer> lengthFn = s -> s.length();\n\
  ```\n\n在现代 Java 中，类型推断更进了一步，局部变量类型推断（LVTI）的到来，也被称为 `var`。这项特性在 `Java 10` 中添加，允许开发者推断变量的类型而不是值的类型，如下：\n\
  \n```\nvar names = new ArrayList<String>();\n```\n\n这是通过将 `var` 变为一个保留的、“魔术”类型名称而不是语言关键字来实现的。理论上，开发者仍然可以使用\
  \ `var` 作为变量、方法或包的名字。\n\n注意适当使用 `var` 的一个重要副作用是，你的代码领域再次处于中心位置（相对于类型信息而言）。但力量越大，责任越大！确保你仔细命名变量，以帮助代码的未来读者。\n\
  \n另一方面，之前使用 `var` 作为类型名称的代码必须重新编译。然而，几乎所有的 Java 开发者都遵循类型名称以大写字母开头的惯例，因此名为 `var`\
  \ 的预存类型实例微乎其微。这意味着编写像下一个列表所示的代码是完全合法的。\n\n列表 1.1 坏代码\n\n```\npackage var;\n\npublic\
  \ class Var {\n  private static Var var = null;\n\n  public static Var var() {\n\
  \    return var;\n  }\n\n  public static void var(Var var) {\n}\n```\n\n然后这样调用它：\n\
  \n```\nvar var = var();\nif (var == null) {\n  var(new Var());\n}\n```\n\n然而，仅仅某些事是合法的并不意味着它是合理的。像上面那样写代码不会让你赢得任何朋友，而且无法通过代码审查！\n\
  \n\n\n编译器无法解决这个问题，因为 `null` 值可以赋值给任何引用类型的变量，因此没有关于 `n` 可能是什么类型的信息。在这种情况下，我们称推断器需要求解的类型约束方程是“欠定的”（underdetermined）的——这是一个数学术语，将需要求解的方程数量与变量数量联系起来。\n\
  \n```\nvar n = null;\nString.format(n);\n```\n\n更复杂的推断算法（或人类）可能得出结论 `n` 的类型实际上是\
  \ `String`，因为 `format()` 方法接受字符串作为第一个参数。\n\n这看起来可能很有吸引力，但正如软件中的其他任何事情一样，它代表了一种权衡。更复杂性意味着更长的编译时间以及推断失败的方式更多。这反过来意味着程序员必须培养出更复杂的直觉，才能正确使用非局部类型推断。\n\
  \n其他语言可能会选择不同的权衡，但 Java 的立场很明确：仅使用声明来推断类型。局部变量类型推断（LVTI）旨在成为一种减少模板代码和冗长的有益技术。然而，它应该只在为了使代码更清晰而必要时使用，而不是作为一种随处可用的笨器（“金大锤”反模式）。\n\
  \n以下是关于何时使用 LVTI 的一些快速指南：\n\n*   在简单的初始化器中，如果右侧是对构造函数或静态工厂方法的调用\n*   如果删除显式类型会删除重复或冗余信息\n\
  *   如果变量的名称已经指示了它们的类型\n*   如果局部变量的作用范围和用法很短且简单\n\nJava 语言核心开发者之一 Stuart Marks 在其关于\
  \ LVTI 使用的风格指南中（[`mng.bz/RvPK`](http://mng.bz/RvPK)）提供了一套完整的适用经验准则。\n\n在结束本节之前，让我们来看\
  \ `var` 的另一种更高级的用法——所谓的“不可点符号类型”（nondotable types）。这些类型在 Java 中是合法的，但它们不能作为变量的类型。相反，它们必须被推断为被赋值表达式的类型。让我们来看一个使用\
  \ Java 9 引入的 `jshell` 交互式环境的简单示例：\n\n```\njshell> var duck = new Object() {\n  \
  \ ...>     void quack() {\n   ...>         System.out.println(\"Quack!\");\n   ...>\
  \     }\n   ...> }\nduck ==> $0@5910e440\n\njshell> duck.quack();\nQuack!\n```\n\
  \n变量 `duck` 拥有一种特殊的类型——它实际上是 `Object`，但扩展了一个名为 `quack()` 方法。虽然该对象可能像鸭子一样叫，但它的类型没有名称，因此我们无法将该类型作为方法的参数或返回类型。\n\
  \n通过 LVTI，我们可以将其作为局部变量的推断类型。这允许我们在方法内部使用该类型。当然，该类型无法在该紧局部作用范围之外使用，因此这一语言特性的整体用途非常有限。它更多是一个好奇点，而不是其他。\n\
  \n尽管有这些限制，这确实代表了 Java 对某些其他语言中存在的特性的看法——这种特性在静态类型语言中被称为结构化类型（structural typing），在动态类型语言（特别是\
  \ Python）中被称为鸭子类型（duck typing）。\n\n## 1.4 改变语言和平台\n\n我们认为，解释语言变化的“为什么”与解释“是什么”一样本质重要。在\
  \ Java 新版本的开发过程中，人们对新语言特性通常表现出极大兴趣，但社区并不总是理解为了让这些变更完全工程化并准备好上线需要多大的工作。\n\n你可能已经注意到，在\
  \ Java 这样成熟的运行时，语言特性倾向于从其他语言或库演变，进入流行的框架，然后才被添加到语言或运行时本身中。我们希望在这个领域提供一些见解，并希望在此过程中消除一些迷思。但如果你对\
  \ Java 如何演进不感兴趣，请随时跳到第 1.5 节，直接进入语言变化。\n\n改变 Java 语言涉及一条努力曲线——某些可能的实现所需的工程努力比其他要少。在图\
  \ 1.3 中，我们尝试表示不同的路线并展示每种路线所需的相对努力。\n\n![](img/CH01_F03_Evans2.png)\n\n图 1.3 以不同方式实现新功能的相对努力\n\
  \n通常情况下，采取努力最少的路线是更好的。这意味着，如果可以作为库的形式实现新特性，你通常应该这样做。但并不是所有特性都容易在库或 IDE 能力中实现，甚至是不可能的。某些特性必须在平台更深处实现。以下是某些特性如何适应我们的新语言特性复杂度尺度：\n\
  \n*   库的变更——集合工厂方法（Java 9）\n*   语法糖——数字中的下划线（Java 7）\n*   小型新语言特性——try-with-resources（Java\
  \ 7）\n*   类文件格式变更——注解（Java 5）\n*   新 JVM 特性——嵌套类（Java 11）\n*   重大新特性——Lambda 表达式（Java\
  \ 8）\n\n让我们仔细观察跨越复杂度尺度的变化是如何实现的。\n\n### 1.4.1 洒上一些糖\n\n有时用来描述语言特性的短语是“语法糖”（syntactic\
  \ sugar）。也就是说，提供语法糖的形式是为了让人类更容易工作，尽管该功能已经存在。\n\n根据经验，被称为语法糖的特性在编译过程早期就会从编译器的表示中移除——它被“脱糖”（desugared）为基础表示。\n\
  \n这使得语法糖的变化变得更容易实现，因为它们通常涉及较少的工作，并且只涉及编译器（对于 Java 来说是 `javac`）。\n\n在此可能会问一个问题：“什么是小变化？”Java\
  \ 7 中一个最直接的变化之一是在 JLS 第 14.11 中添加了一个单词——“String”，允许在 switch 语句中使用字符串。作为变更，你无法比这更小了，尽管这个变更触及了规范的多个方面。\n\
  \n### 1.4.2 改变语言\n\n任何变更必须执行（或至少调查）的完整操作如下：\n\n*   更新 JLS。\n*   在源码编译器中实现原型。\n*\
  \   添加变更必需的库支持。\n*   编写测试和示例。\n*   更新文档。\n\n此外，如果变更涉及 JVM 或平台，必须发生以下操作：\n\n*   更新\
  \ VMSpec。\n*   实现 JVM 变更。\n*   在类文件和 JVM 工具中添加支持。\n*   考虑反射的影响。\n*   考虑序列化的影响。\n\
  *   思考对原生代码组件（如 Java Native Interface JNI）的任何影响。\n\n这并不是一项小工作，而且是在考虑了变更对整个语言规范的影响之后。\n\
  \n在进行变更时，一个棘手领域是类型系统。这并不是因为 Java 的类型系统糟糕。相反，拥有丰富静态类型系统的语言，其类型系统的不同部分之间可能存在许多交互点。对它们进行更改很容易产生意料之外的惊喜。\n\
  \n### 1.4.3 JSRs 和 JEPs\n\n\n\n\n修改 Java 平台主要使用两种机制。第一种是 `Java 规范请求`（JSR），它由 `Java\
  \ 社区进程`（JCP）规范。它被用于确定标准 API——包括外部库和主要的内部平台 API。\n\n在历史上，这是修改 Java 平台的唯一方式，并且最适合用于对已经成熟技术的共识进行法化。然而，近年来，人们希望更快（且以更小的单元）实现更改的愿望导致了\
  \ `JDK 增强提案`（JEP）的产生，作为一种更轻量级的替代方案。平台（又称伞形型）JSR 现在由针对 Java 下一版本的 JEP 组成。JSR 过程则用于为整个生态系统提供额外的知识产权保护。\n\
  \n在讨论新的 Java 特性时，通过其 JEP 编号来引用即将发布或最近的特性性通常非常有帮助。所有 JEP 的完整列表（包括已交付或撤回的 JEP）可以在\
  \ [`openjdk.java.net/jeps/0`](https://openjdk.java.net/jeps/0) 处找到。\n\n### 1.4.4\
  \ 孵化特性与预览特性\n\n在新的发布模型中，Java 有两种机制可以在稍后的发布中最终确定之前尝试提议的特性。这些机制的目的是通过从更广泛的用户群体中收集反馈，提供更好的特性，并在该特性成为\
  \ Java 的永久部分之前可能对其进行更改或撤回。\n\n`孵化特性`（Incubating features）是新的 API 及其实现，在最简单的形式下，它们实际上只是作为自包含模块发布的新\
  \ API（我们将在第 2 章介绍 Java 模块的细节）。模块名称的选择是为了清楚地表明该 API 是临时的，并在特性定型时发生更改。\n\n注意：这意味着任何依赖于未定型的孵化特性版本的代码，在特性变为定型时都必须进行更改。\n\
  \n孵化特性的一个非常直观的例子是对 HTTP 协议版本 2 的新支持，通常称为 HTTP/2。在 Java 9 中，它以孵化模块 `jdk.incubator.http`\
  \ 的形式发布。该模块的命名以及使用 `jdk.incubator` 命名空间而非 `java` 命名空间清晰地标记了该特性是非标准的且可能会发生更改。该特性在\
  \ Java 11 中被标准化，当时它被移动到了 `java` 命名空间部分的 `java.net.http` 模块。\n\n注意：我们在第 18 章讨论 Foreign\
  \ Access API 时将遇到另一个孵化特性，它是代号为 Panama 的 OpenJDK 项目的一部分。这种方法的主要优势是孵化特性可以隔离在单个命名空间中。开发者可以快速尝试该特性，甚至在生产代码中使用，前提是他们愿意在特性标准化时修改某些代码并重新编译和重新链接。\n\
  \n`预览特性`（Preview features）是最近几个 Java 版本提供的用于发布未定型特性的另一种机制。它们比孵化特性更具侵入性，因为它们作为语言本身的一部分在更深层次上实现。这些特性可能需要以下项的支持：\n\
  \n- `javac` 编译器\n- 字节码格式\n- 类文件和类加载\n\n只有在向编译器和运行时传递特定标志（flags）时它们才可用。在未启用标志的情况下尝试使用预览特性错误的，无论是在编译时还是运行时都是如此。\n\
  \n这使得处理它们变得复杂得多（与孵化特性相比）。因此，预览特性无法真正用于生产环境。其中之一是它们由未定型的类文件格式版本表示，并且可能永远不会被 Java\
  \ 的任何生产版本支持。\n\n这意味着预览特性适用于实验、开发者测试和熟悉。遗憾的是，在几乎所有的部署中，只有完全定型的特性才能用于目标为生产的代码。\n\n\
  Java 11 不包含任何预览特性（尽管 `switch 表达式` 的第一个预览版本在 Java 12 中出现），因此在本节中很难给出一个很好的例子。不过，我们将在第\
  \ 3 章讨论 Java 17 时进一步深入探讨预览版本。\n\n## 1.5 Java 11 中的微小更改\n\n自 Java 8 以来，在连续的发布中出现了相当数量的新型微小特性。让我们快速浏览一下其中最重要的几个特性——尽管这绝不是所有的更改。你最可能在迁移到\
  \ Java 11 时首次看到这些特性。\n\n### 1.5.1 集合工厂方法 (JEP 213)\n\n一个经常被请求的增强是扩展 Java 以支持一种简单的方法来声明`集合字面量`（collection\
  \ literals）——对象的简单集合（例如列表或映射）。这看起来很有吸引力，因为许多其他语言都支持某种形式的内容，而且 Java 本身一直拥有数组字面量，如下所示：\n\
  \n```\njshell> int[] numbers = {1, 2, 3};\nnumbers ==> int[3] { 1, 2, 3 }\n```\n\
  \n然而，尽管表面上很有吸引力，但在语言层面引入此特性有一些重大的缺点。例如，尽管 `ArrayList`、`HashMap` 和 `HashSet` 是开发者最熟悉的实现，但\
  \ Java 集合的一个设计原则是它们以接口的形式表示，而不是类。其他实现也是可用且广泛使用的。\n\n这意味着，如果创建一个直接耦合到特定实现的新语法，无论该实现多么常见，都将违背设计意图。相反，设计决定是在相关接口上添加简单的工厂方法，利用\
  \ Java 8 添加了在接口上拥有静态方法的功能。生成的代码如下：\n\n```\nSet<String> set = Set.of(\"a\", \"b\"\
  , \"c\");\n\nvar list = List.of(\"x\", \"y\");\n```\n（注：此处原文为“这种方法在语言层面稍微更琐碎，但实现上的复杂性大大减少。这些新方法通过如下重载实现：）\n\
  \n```\nSet<String> Set.of(\"a\", \"b\", \"c\");\n```\n（注：此处原文为“常见情况（最多 10 个元素）已提供，并带有一个用于需要超过\
  \ 10 个元素的罕用用例的可变参数形式（varargs））\n\n```\nList<E> List.of()\nList<E> List.of(E1)\n\
  List<E> List.of(E1, E2)\nList<E> List.of(E1, E2, E3)\nList<E> List.of(E1, E2, E3,\
  \ E4)\nList<E> List.of(E1, E2, E3, E4, E5)\nList<E> List.of(E1, E2, E3, E4, E5,\
  \ E6)\nList<E> List.of(E1, E2, E3, E4, E5, E6, E7)\nList<E> List.of(E1, E2, E3,\
  \ E4, E5, E6, E7, E8)\nList<E> List.of(E1, E2, E3, E4, E5, E6, E7, E8, E9)\nList<E>\
  \ List.of(E1, E2, E3, E4, E5, E6, E7, E8, E9, E10)\nList<E> List.of(E... elements)\n\
  ```\n\n对于映射（maps），情况稍微复杂，因为映射有两个泛型参数（键的类型和值的类型），所以虽然简单的情况可以这样写：\n\n```\nvar m1 =\
  \ Map.of(k1, v1);\nvar m2 = Map.of(k1, v1, k2, v2);\n```\n\n但没有简单的方法可以编写映射的可变参数形式。相反，使用了一个不同的工厂方法\
  \ `ofEntries()`，配合静态辅助方法 `entry()` 来提供可变参数形式的等效方法，如下：\n\n```\nMap.ofEntries(\n \
  \   entry(k1, v1),\n    entry(k2, v2),\n    // ...\n    entry(kn, vn));\n```\n\n\
  开发者应该注意的最后一点：工厂方法产生的是不可变类型的实例，如下：\n\n```\njshell> var ints = List.of(2, 3, 5, 7);\n\
  ints ==> [2, 3, 5, 7]\n\njshell> ints.getClass();\n$2 ==> class java.util.ImmutableCollections$ListN\n\
  ```\n\n\n\n\n这些类是 Java Collections 接口的新实现，它们是不可变的——它们不是那些熟悉的、可变的类（例如 `ArrayList`\
  \ 和 `HashMap`）。尝试修改这些类型的实例将导致抛出异常。\n\n### 1.5.2 移除企业级模块 (JEP 320)\n\n随着时间的推移，Java\
  \ 标准版（又称 Java SE）添加了一些实际上属于 Java 企业级版（Java EE）的模块，例如：\n\n* `JAXB`\n* `JAX-WS`\n\
  * `CORBA`\n* `JTA`\n\n在 Java 9 中，实现这些技术的以下包被移动到了非核心模块，并标记为废弃（准备移除）：\n\n* `java.activation`\
  \ (JAF)\n* `java.corba` (CORBA)\n* `java.transaction` (JTA)\n* `java.xml.bind` (JAXB)\n\
  * `java.xml.ws` (JAX-WS，以及一些相关技术)\n* `java.xml.ws.annotation` (通用注解)\n\n作为简化平台工作的一部分，这些模块在\
  \ Java 11 中被移除了。用于工具和聚合的以下三个相关模块也从核心 SE 分发版中移除：\n\n* `java.se.ee`（上述六个模块的聚合模块）\n\
  * `jdk.xml.ws`（用于 JAX-WS 的工具）\n* `jdk.xml.bind`（用于 JAXB 的工具）\n\n基于 Java 11 及更高版本构建的项目如果想要使用这些功能，现在需要包含显式的外部依赖。这意味着某些依赖这些\
  \ API 的程序在 Java 8 下可以顺利构建，但在 Java 11 下构建需要修改其构建脚本。我们将在第 11 章更深入调查这一特定问题。\n\n###\
  \ 1.5.3 HTTP/2 (Java 11)\n\n在现代，一个新版本的 HTTP 标准已经发布——HTTP/2。我们将探讨最终更新古老的 HTTP 1.1\
  \ 规范（追溯到 1997 年！）的原因。然后我们将看到 Java 11 如何让基础丰富的开发者访问 HTTP/2 的新功能和性能。\n\n正如你对 1997\
  \ 年的技术所预期那样，HTTP 1.1 已经表现出它的过时，特别是在现代 Web 应用程序性能方面。局限性包括此类问题：\n\n* 头部阻塞 (Head-of-line\
  \ blocking)\n* 对单个站点的连接限制\n* HTTP 控制标头的性能开销\n\nHTTP/2 是协议的 `transport` 级更新，专注于修复这些不符合现代网络工作方式的底层性能问题。由于其性能重点在于客户端和服务器之间的字节流，HTTP/2\
  \ 实际上并没有改变许多熟悉的 HTTP 概念——请求/响应、标头、状态码、响应体——所有这些在 HTTP/2 与 HTTP 1.1 的语义上仍然保持相同。\n\
  \n#### 头部阻塞\n\nHTTP 通信在 TCP socket 之上进行。尽管 HTTP 1.1 默认重用单个 socket 以避免重复不必要的设置开销，但协议规定请求必须按顺序返回，即使多个请求共享一个\
  \ socket（被称为管道化；见图 1.4）。这意味着来自服务器的慢响应会阻塞后续请求，而从理论上讲，这些请求是可以更早返回的。这些影响在浏览器渲染下载资源时停滞等处显而易见。这种“一次连接只处理一个响应”的行为也会限制与基于\
  \ HTTP 服务通信的 JVM 应用。\n\n![](img/CH01_F04_Evans2.png)\n\n图 1.4 HTTP 1.1 传输\n\nHTTP/2\
  \ 从底层开始设计为在同一连接上多路复用请求，如图 1.5 所示。客户端和服务器之间支持多个 `streams`。它甚至允许分开接收单个请求的标头正体。\n\n\
  ![](img/CH01_F05_Evans2.png)\n\n图 1.5 HTTP/2 传输\n\n这从根本上改变了数十年来 HTTP 1.1 让许多开发者认为习成常的假设。例如，长期以来人们认为，在网站上返回许多小资源的性能，不如制作较大的包。JavaScript、CSS\
  \ 和图像都有通用的技术和工具来将许多小文件合并在一起，以更高效的方式返回。在 HTTP/2 中，多路复用响应意味着你的资源不会被阻塞在其他慢请求之后，较小的响应可能会被更准确地缓存，从而带来更好的整体体验。\n\
  \n#### 连接限制\n\nHTTP 1.1 规范建议将到服务器的连接同时限制在两个。这被列为 `should`（应该）而非 `must`（必须），现代 Web\
  \ 浏览器通常允许每个域名 6 到 8 个连接。这种对站点并发下载的限制经常导致开发者从多个域名提供站点，或实现之前提到的那种打包处理。\n\nHTTP/2 解决了这种状况：每个连接都可以被有效地用于发送任意数量的并发请求。浏览器对给定域名只打开一个连接，但可以在该相同连接上同时执行许多请求。\n\
  \n在我们的 JVM 应用中，我们可能会对 HTTP 1.1 连接建立池以允许更多的并发活动，HTTP/2 为我们提供了另一种内置方式来挤出更多请求。\n\n\
  #### HTTP 标头性能\n\nHTTP 的一个重要特性是在发送请求的同时发送 `headers`。标头是 HTTP 协议本身保持无状态的关键部分，但我们的应用程序可以在请求之间保持状态（例如你的用户已登录）。\n\
  \n尽管 HTTP 1.1 负载的主体可以在客户端和服务器达成算法一致（通常为 `gzip`）的情况下进行压缩，但标头不参与。随着日益丰富的 Web 应用程序发出越来越多的请求，不断重复的标头可能会成为问题，特别是对于较大的网站。\n\
  \nHTTP/2 使用一种新的标头二进制格式解决了这个问题。作为协议的用户，你不需要思考太多——它只是内置在客户端和服务器之间传输标头的方式中。\n\n####\
  \ TLS 全方位\n\n在 1997 年，HTTP 1.1 进入的是与我们今天看到的完全不同的互联网。互联网商业才开始兴起，安全在早期协议设计中并不总是首要考虑。计算系统也非常慢，使得加密等实践通常成本太高。\n\
  \nHTTP/2 在 2015 年正式进入一个安全意识远强的世界。此外，通过 TLS 对 Web 请求进行普及加密的需求已经低，实际上，HTTP/2 仅在 TLS\
  \ 加密下支持（该协议理论上允许明文传输，但没有主要的实现提供这种支持）。\n\n这对部署 HTTP/2 具有操作上的影响，因为需要一个具有过期和续期周期的证书。对于企业来说，这增加了证书管理的需求。Let’s\
  \ Encrypt ([`www.letsencrypt.org``](https://www.letsencrypt.org)) 以及其他私有选项正在应对这一需求而增长。\n\
  \n#### 其他考虑\n\n尽管未来倾向于采用 HTTP/2，但它在 Web 上的部署并不快速。除了加密需求（这甚至影响了本地开发）外，这种延迟可能归因于以下粗糙之处和额外的复杂性：\n\
  \n* HTTP/2 仅为二进制；与不透明格式交互具有挑战性。\n* HTTP 层产品（如负载均衡、防火墙和调试工具）需要更新以支持 HTTP/2。\n* 性能收益主要面向浏览器的\
  \ HTTP 使用。通过 HTTP 工作的后端服务更新的收益较小。\n\n\n\n\n\n在多年之后，新 HTTP 版本的到来促成了 `JEP 110` 引入了一个全新的\
  \ API。在 JDK 内部，它替换了（但并未移除）`HttpURLConnection`，目标是让一个可用的 HTTP API “开箱即用”，因为许多开发者已经转向外部库来满足他们\
  \ HTTP 相关的需求。\n\n生成的兼容 HTTP/2 和 web socket 的 API 首先在 Java 9 中作为孵化特性（Incubating feature）引入。`JEP\
  \ 321` 将其移动到 Java 11 `java.net.http` 包下的永久归属地。新 API 支持 HTTP 1.1 以及 HTTP/2，并且当调用的服务器不支持\
  \ HTTP/2 时，它可以回退到 HTTP 1.1。\n\n与新 API 的交互从 `HttpRequest` 和 `HttpClient` 类型开始。这些类型通过构建器实例化，在发出实际\
  \ HTTP 调用之前设置配置，如下所示：\n\n```\nvar client = HttpClient.newBuilder().build();    \
  \       ❶\n\nvar uri = new URI(\"https://google.com\");\nvar request = HttpRequest.newBuilder(uri).build();\
  \      ❷\n\nvar response = client.send(                             ❸\n    request,\n\
  \    HttpResponse.BodyHandlers.ofString(                 ❹\n        Charset.defaultCharset());\n\
  \nSystem.out.println(response.body());\n```\n\n❶ 构造一个我们可以用于发送请求的 `HttpClient` 实例\n\
  \n❷ 使用 `HttpRequest` 实例构造一个发往 Google 的特定请求\n\n❸ 同步发送 HTTP 请求并保存其响应。此行代码会阻塞，直到整个请求完成。\n\
  \n❹ `send` 方法需要一个处理器来告诉它如何处理响应体。在此处，我们使用一个标准处理器将响应体作为 `String` 返回。\n\n这演示了该 API\
  \ 的同步用法。在构建好请求和客户端之后，我们使用 `send` 方法发出 HTTP 调用。在整个 HTTP 调用完成之前，我们不会收到返回的 `response`\
  \ 对象，这与 JDK 中旧的 HTTP API 类似。\n\n第一个参数是我们设置的请求，但第二个参数值得仔细观察。`send` 方法并不总是期望返回一个单一类型，而是期望我们提供一个\
  \ `HttpResponse.BodyHandler<T>` 接口的实现，以告诉它如何处理响应。`HttpResponse.BodyHandlers` 提供了一些实用的基础处理器，可以将您的响应作为字节数组、字符串或文件接收。但自定义这种行为只是\
  \ `BodyHandler` 的一种实现。所有这些工作都是基于 `java.util.concurrent.Flow` 发布者和订阅者机制，这是一种响应式流（reactive\
  \ streams）的编程形式。\n\nHTTP/2 最显著的优势之一是内置的多路复用（multiplexing）。仅使用同步 `send` 并无法真正获得这些优势，因此\
  \ `HttpClient` 也支持 `sendAsync` 方法并不意外。`sendAsync` 返回一个封装了 `HttpResponse` 的 `CompletableFuture`，提供了一系列丰富的功能，这些功能在平台的其他部分可能很熟悉，所示：\n\
  \n```\nvar client = HttpClient.newBuilder().build();\n\nvar uri = new URI(\"https://google.com\"\
  );\nvar request = HttpRequest.newBuilder(uri).build();           ❶\n\nvar handler\
  \ = HttpResponse.BodyHandlers.ofString();\nCompletableFuture.allOf(            \
  \                         ❷\n    client.sendAsync(request, handler)            \
  \           ❸\n        .thenAccept((resp) ->                                ❹\n\
  \                      System.out.println(resp.body()),\n    client.sendAsync(request,\
  \ handler)                       ❺\n        .thenAccept((resp) ->              \
  \                  ❺\n                      System.out.println(resp.body()),   \
  \    ❺\n    client.sendAsync(request, handler)                       ❺\n       \
  \ .thenAccept((resp) ->\n                      System.out.println(resp.body())\n\
  ).join();\n```\n\n❶ 像之前一样创建客户端和请求\n\n❷ 使用 `CompletableFuture.allOf` 等待所有请求完成\n\n\
  ❸ `sendAsync` 启动一个 HTTP 请求但返回一个 future 且不阻塞。\n\n❹ 当 future 完成时，我们使用 `thenAccept`\
  \ 接收响应。\n\n❺ 我们可以重用同一个客户端来同时发送多个请求。\n\n在这里我们再次设置了请求和客户端，但随后异步地重复了三次调用。`CompletableFuture.allOf`\
  \ 组合了这三个 future，因此我们可以通过单个 `join` 等待它们全部完成。\n\n这仅仅触及了该 API 的两个主要入口。它提供了海量的功能和定制，从超时和\
  \ TLS 配置，到高级的异步功能，如通过 `HttpResponse.PushPromiseHandler` 接收 HTTP/2 服务器推送（server pushes）。\n\
  \n在 future 和响应式流的基础上，JDK 中新的 HTTP API 为在 HTTP 领域占据主导地位的大型库提供了一个极具吸引力的替代方案。它以现代异步编程为核心设计，`java.net.http`\
  \ 让 Java 在未来 Web 的发展中处于极佳的位置。\n\n### 1.5.4 单文件源程序程序 (JEP 330)\n\nJava 通常执行方式是将源代码编译为类文件，然后启动一个虚拟机进程，该进程充当执行容器来解释类的字节码。\n\
  \n这与 Python、Ruby 和 Perl 等语言非常不同，在这些语言中，程序的源代码是直接被解释的。Unix 环境对这类脚本语言有悠久的历史，但 Java\
  \ 传统上并不被归为此类。\n\n随着 `JEP 330` 的到来，Java 11 了一种了一种执行程序的新方法。源代码可以在内存中编译，然后由解释器执行，而无需在磁盘上产生\
  \ `.class` 文件，如图 1.6 所示。\n\n![](img/CH01_F06_Evans2.png)\n\n图 1.6 单文件执行\n\n这提供了类似于\
  \ Python 和其他脚本语言的用户体验。\n\n该特性有一些局限性，包括以下内容：\n\n- 它局限于单个源文件。\n- 它无法在运行期间编译额外的源文件。\n\
  - 它可以在源文件中包含任意数量的类。\n- 它必须将源文件的第一个类作为入口点。\n- 它必须在入口点定义 `main` 方法。\n\n该特性还使用 `--source`\
  \ 标志来指示源代码兼容模式——脚本的语言级别。\n\n执行必须遵循 Java 文件命名规范，因此类名应与文件名匹配。但是不应使用 `.java` 扩展名，因为这会误启动器。\n\
  \n这类 Java 脚本也可以包含 shebang 行，如下：\n\n```#!/usr/bin/java --source 11\n\npublic final\
  \ class HTTP2Check {\n    public static void main(String[] args) {\n        if (args.length\
  \ < 1) {\n            usage();\n        }\n        // 我们 HTTP 调用实现      ❶\n    }\n\
  }\n```\n\n❶ `HTTP2Check` 的完整代码位于项目资源。\n\nshebang 行提供了必要的参数，以便文件可以被标记为可执行并直接调用，如下：\n\
  \n```\n$ ./HTTP2Check https://www.google.com\nhttps://www.google.com: HTTP_2\n```\n\
  \n尽管该特性并没有为 Java 带来脚本语言的完整体验，但它可以是在 Unix 传统中编写简单实用工具的一种有效方法，而无需引入另一种编程语言。\n\n##\
  \ 总结\n\n- Java 语言和平台是 Java 生态系统中两个独立（尽管密切相关）的组件。平台支持除 Java 外的许多语言。\n- 在 Java 8 之后，Java\
  \ 平台采用了新的定期发布流程。每六个月发布一个新版本，每两年或三年发布一个长期支持（LTS）版本。\n- 当前的 LTS 版本是 11 和 17，Java 8\
  \ 目前仍受支持。\n\n\n\n\n\n-   由于 Java 关注向下兼容性，对其进行更改往往非常困难。仅限于库或编译器的更改通常比需要同时更新虚拟机的更改要简单得多。\n\
  -   Java 11 引入了许多值得升级的特性：\n    *   用于简化变量定义的 `var` 关键字\n    *   用于简化创建列表、映射和其他集合的工厂方法\n\
  \    *   一个具有完整 HTTP/2 支持的新型 `HttpClient` 实现\n    *   可以直接运行而无需编译为类文件的单文件程序\n\n\
  # 2 Java 模块\n\n本章涵盖了以下内容：\n\n*   Java 平台模块\n*   访问控制语义的变更\n*   编写模块化应用\n*   多版本\
  \ JAR (Multi-release JARs)\n\n如第 1 章所述，直到包括 Java 9 在内的 Java 版本都是根据功能驱动的发布计划交付的，通常包含一个定义了发布或与发布强密相关的重大新功能。\n\
  \n对于 Java 9 来说，这一特性是 `Java 平台模块`（也称为 `JPMS`、`Jigsaw` 或简单的“模块”）。这是 Java 平台的一项讨论了多年的重大增强和变更——它最初被构想在\
  \ 2009/2010 年作为 Java 7 的一部分可能发布。\n\n在本章中，我们将解释需要模块的原因，以及用于表述模块化概念的新语法，以及如何在应用程序中使用它们。这将使你能够在构建中使用\
  \ `JDK` 和第三方模块，并能将应用或库打包为模块。\n\n**注意**：模块代表了打包和部署代码的新新方式，采用它们将使你的应用程序变得更好。然而，如果你只想开始使用现代\
  \ Java 特性（11 或 17），除非你主意如此，否则没有必要立即采用模块。\n\n模块的到来对应用程序架构产生了深远影响，对于关注进程内存占用、启动成本和预热时间等方面的现代项目，模块具有许多益处。模块还可以帮助解决困扰具有复杂依赖关系的\
  \ Java 的所谓“JAR 地狱”。让我们了解它们吧。\n\n## 2.1 背景介绍\n\n`module`（模块）是 Java 语言中一个本质全新的概念（从\
  \ Java 9 开始）。它是应用部署和依赖的单元，对运行时具有语义意义。这与 Java 现有概念不同，原因如下：\n\n*   JAR 文件对运行时是不可见的——它们本质上只是包含类文件的压缩目录。\n\
  *   包（Packages）实际上只是为了访问控制而将类分组在一起的命名空间。\n*   依赖关系仅在类级别上定义。\n*   访问控制和反射的结合方式产生了一个本质上开放的系统，没有清晰的部署单元边界，且执行力极低。\n\
  \n相比之下，模块：\n\n*   定义了模块之间的依赖信息，因此可以在编译时或应用程序启动时检测到各种解析和链接问题\n*   提供了恰当的封装，使得内部包和类可以免受可能想要摆弄它们的烦扰用户的干扰\n\
  *   是一个正式的部署单元，带有元数据，这些元数据可以被现代 Java 运行时理解和消费，并在 Java 类型系统中表示（例如，通过反射）\n\n**注意**：在模块出现之前，在核心语言和运行时环境中没有聚合的依赖元数据。相反，这些数据只定义在如\
  \ `Maven` 之类的构建系统或第三方模块系统（如 `OSGI` 或 `JBoss modules`）中，而 `JVM` 既不知道也不关心。\n\nJava\
  \ 平台模块代表了 Java 8 时代 Java 世界中缺失概念的一种实现。\n\n**注意**：Java 模块通常被打包为特殊的 JAR 文件，但它们并不限于该格式（我们稍后会看到其他可能的格式）。\n\
  \n模块系统的目的是让部署单元（模块）之间尽可能独立。该想法是模块能够被单独加载和链接，尽管在实践中，实际应用程序可能依赖于一组提供相关能力（如安全性）的模块。\n\
  \n### 2.1.1 Project Jigsaw\n\n`OpenJDK` 中交付模块特性的项目被称为 `Project Jigsaw`。其目的是交付一个功能全模块化解决方案，包括以下目标：\n\
  \n*   `JDK` 平台源码模块化\n*   减少进程内存占用\n*   提高应用程序启动时间\n*   让 `JDK` 和应用代码均可使用模块\n*  \
  \ 在 Java 历史上首次允许真正的严格封装\n*   为 Java 语言添加新的、以前无法访问控制模式\n\n这些目标反过来由以下其他目标驱动，这些目标更密切地关注\
  \ `JDK` 和 Java 运行时：\n\n*   结束单一、单体式的运行时 JAR (`rt.jar`) 时代\n*   恰当地封装和保护 `JDK` 内部实现\n\
  *   允许进行重大的内部更改（包括会破坏未经授权的非 JDK 使用的更改）\n*   将模块作为“超级包”引入\n\n这些辅助目标可能需要更多的解释，因为它们与平台的内部和实现方面联系密切。\n\
  \n#### 模块化而非单体的 Java 运行时\n\n旧的 JAR 格式本质上只是一个包含类的 zip 文件。它可以追溯到平台最早时期，完全没有针对 Java\
  \ 类和应用程序进行优化。在平台类上放弃 JAR 格式可以在许多方面提供帮助——例如，实现许多更好的启动性能。\n\n模块提供了两种新格式——`JMOD` 和\
  \ `JIMAGE`——它们分别在程序生命周期不同阶段（编译/链接时和运行时）使用。\n\n`JMOD` 格式与现有的 JAR 格式相似，但它经过修改，允许将原生代码作为单个文件的一部分包含（而不是像\
  \ Java 8 那样必须交付单独的共享对象文件）。对于大多数开发者需求，包括发布到 `Maven`，最好将自己的模块打包为模块化 JAR 而不是 `JMOD`。\n\
  \n`JIMAGE` 格式用于表示 Java 镜像。在 Java 8 之前，只有两种运行时镜像（JDK 和 JRE），但这在很大程度上是历史的偶然。Oracle\
  \ 在 Java 8 中引入了 *Server JRE*（以及 *Compact Profiles*）作为通向完全模块化的基石。这些镜像基本上移除了一些功能（例如\
  \ GUI 框架），以专门针对服务端应用程序的需求提供更小的内存占用。\n\n模块化应用程序拥有足够的元数据，可以在程序启动之前确定确切的依赖集。这使得只需加载需要的内容，这要高效得多。甚至可以进一步进一步定义一个*自定义运行时镜像*，它可以与应用程序一起发布，且不包含完整的、通用的\
  \ Java 安装，只包含应用程序所需的内容。我们将在本章末尾通过 `jlink` 工具遇到最后的可能性。\n\n现在，让我们认识 `jimage` 工具，它可以显示\
  \ Java 运行时镜像的细节。例如，对于 Java 15 完整运行时（即以前包含在 JDK 中的内容），请参考以下示例：\n\n```\n$ jimage info\
  \ $JAVA_HOME/lib/modules\nMajor Version:  1\nMinor Version:  0\nFlags:         \
  \ 0\nResource Count: 32780\nTable Length:   32780\nOffsets Size:   131120\nRedirects\
  \ Size: 131120\nLocations Size: 680101\nStrings Size:   746471\nIndex Size:    \
  \ 1688840\n```\n\n\n\n\n\n```\n$ jimage list $JAVA_HOME/lib/modules\njimage: /Library/Java/JavaVirtualMachines/java15/Contents/Home/lib/modules\n\
  \nModule: java.base\n    META-INF/services/java.nio.file.spi.FileSystemProvider\n\
  \    apple/security/AppleProvider$1.class\n    apple/security/AppleProvider$ProviderService.class\n\
  \    apple/security/AppleProvider.class\n    apple/security/KeychainStore$CertKeychainItemPair.class\n\
  \    apple/security/KeychainStore$KeyEntry.class\n    apple/security/KeychainStore$TrustedCertEntry.class\n\
  \    apple/security/KeychainStore.class\n    com/sun/crypto/provider/AESCipher$AES128_CBC_NoPadding.class\n\
  \    ... many, many lines of output\n```\n\n摒弃 `rt.jar` 能够获得更好的启动性能，并针对应用程序仅需的部分进行优化。新格式的设计对开发者来说是不透明的，并且取决于具体实现。现在不再可能通过简单解压\
  \ `rt.jar` 来获取 JDK 的类库。然而，这只是降低平台内部实现对 Java 程序员可访问性的一步，而这正是模块系统的目标之一。\n\n## 封装内部实现\n\
  \nJava 平台与其用户之间的约定一直旨在设计为 API 合约——即向后兼容将在接口层面维持，*而不是*在实现的细节中维持。\n\n然而，Java 开发者并没有履行他们的承诺，相反，随着时间的推移，他们倾向于使用从未打算供公开使用的平台实现部分。\n\
  \n这是一个问题，因为 OpenJDK 平台开发者希望拥有修改 JVM 和平台类实现以自由，以使其面向未来并实现现代化——在提供新功能和更好性能的同时，而不必担心破坏用户应用程序。\n\
  \n对平台内部进行破坏性更改的一个主要障碍是 Java 8 中现有的访问控制方法。Java 仅定义了 `public`、`private`、`protected`\
  \ 和 `package-private` 作为访问控制级别，且这些修符仅应用于类级别及更细粒度的级别。\n\n我们可以通过许多方式绕过这些限制（例如反射或在相关包中创建额外的类），而且没有任何万无一失（或防范专家）的方法可以完全保护内部实现。\n\
  \n从历史上看，使用绕过方案访问内部实现通常是有正当理由的。但随着平台的趋成熟，已经增加了一种访问几乎所有所需功能的官方方式。因此，不受保护的内部实现对未来的平台而言代表着一种负担，而没有相应的收益——而模块化正是消除这一遗留问题的方法之一。\n\
  \n总结来说，Project Jigsaw 是一种同时解决多个问题的方法——主要是减少运行时大小、提高启动时间并清理内部包之间的依赖关系。这些问题是很难（或无法）通过增量方式解决的。这类“非局部”改进的机会并不经常出现，尤其是在成熟的软件平台中，因此\
  \ Jigsaw 团队希望利用他们的时机。\n\n## JVM 现在是模块化的\n\n为了理解这一点，请考虑以下非常简单的程序：\n\n```\npublic\
  \ class StackTraceDemo {\n    public static void main(String[] args) {\n       \
  \ var i = Integer.parseInt(\"Fail\");\n    }\n}\n```\n\n编译并运行这段代码会产生一个运行时异常，所示：\n\
  \n```\n$ java StackTraceDemo\nException in thread \"main\" java.lang.NumberFormatException:\n\
  \  For input string: \"Fail\"\n    at java.base/java.lang.NumberFormatException.forInputString(\n\
  \    NumberFormatException.java:65)\n    at java.base/java.lang.Integer.parseInt(Integer.java:652)\n\
  \    at java.base/java.lang.Integer.parseInt(Integer.java:770)\n    at StackTraceDemo.main(StackTraceDemo.java:3)\n\
  ```\n\n然而，我们可以清楚地看到堆栈轨迹的格式与 Java 8 中使用的形式有所不同。特别是，堆栈帧现在由模块名（`java.base`）以及包名、类名和行号共同限定。这清楚地表明平台的模块化是无处不在的，即使对于最简单的程序也是如此。\n\
  \n### 2.1 模块图\n\n所有模块化的关键在于*模块图*，它是模块之间相互依赖关系的表示。模块通过一些新语法显式声明它们的依赖关系，这些依赖是编译器和运行时可以依赖的硬保证。一个非常重要的概念是，模块图必须是一个*有向无环图*（DAG），因此在数学术语中，不能存在任何循环依赖。\n\
  \n注意：重要的是，在现代 Java 环境中，所有应用程序都运行在模块化的 JRE 之上；不存在所谓的“模块模式”和“遗留类路径模式”。\n\n尽管并不是每个开发者都需要成为模块系统的专家，但对于一个基础良好的\
  \ Java 开发者来说，掌握这一新子系统的知识是有意义的，因为该系统改变了所有程序在 JVM 上的执行方式。让我们看看图 2.1 所示的模块系统的初步视图，这是大多数开发者遇到它时的样子。\n\
  \n![](img/CH02_F01_Evans2.png)\n\n图 2.1 JDK 系统模块（简化视图）\n\n在图 2.1 中，我们可以看到 JDK 中一些主要模块的简化视图。注意，`java.base`\
  \ 模块始终是每个模块的依赖项。在绘制模块图时，通常会消除对 `java.base` 的隐式依赖，以减少视觉杂乱。\n\n我们在图 2.1 中看到的整洁且相对简单的模块边界，需要与\
  \ Java 8 时 JDK 的状态进行对比。遗憾的是，在模块出现之前，Java 的顶层代码单元是包——而 Java 8 几乎有 1000 个包。这在本质上是不可能画出来的，而且图中的依赖关系会复杂到人类无法理解。\n\
  \n### 2.1.2 保护内部实现\n\n模块需要解决的主要问题之一是用户 Java 框架与内部实现细节的过度耦合。例如，这段 Java 8 代码扩展了一个内部类，以访问底层的\
  \ *URL 规范化器*。\n\n以下代码仅用于演示之目的，以便我们有一个具体的示例来讨论模块和访问控制——你的代码永远不应该直接访问内部类：\n\n```\n\
  import sun.net.URLCanonicalizer;\n\npublic class MyURLHandler extends URLCanonicalizer\
  \ {\n\n    public boolean isSimple(String url) {\n        return isSimpleHostName(url);\n\
  \    }\n}\n```\n\n\n\n\nURL 规范化器（URL canonicalizer）是一段代码，它将 URL 标准允许的各种形式之一的 URL\
  \ 转换为标准（规范化）形式。其意图是让规范化的 URL 可以作为通过多个不同可能的 URL 访问的内容位置的“单一事实来源”。如果我们尝试使用 Java 8\
  \ 编译它，`javac` 会警告我们正在访问一个内部 API，如下所示：\n\n```\n$ javac MyURLHandler.java\nMyURLHandler.java:1:\
  \ warning: URLCanonicalizer is internal proprietary API\n  and may be removed in\
  \ a future release\n\nimport sun.net.URLCanonicalizer;\n              ^\nMyURLHandler.java:3:\
  \ warning: URLCanonicalizer is internal proprietary API\n  and may be removed in\
  \ a future release\n\npublic class MyURLHandler extends URLCanonicalizer {\n   \
  \                               ^\n2 warnings\n```\n\n然而，默认情况下，编译器仍然允许访问，结果是产生了一个与\
  \ JDK 内部实现紧耦合的用户类。这种连接是脆弱的，如果被调用的代码移动或替换，这种连接就会中断。\n\n如果有足够的开发者滥用这种开放性，就会导致一种局面：对内部进行更改变得困难或不可能，因为这样做会破坏已部署的库和应用程序。\n\
  \n注意：`URLCanonicalizer` 类需要从几个不同的包进行调用，而不只是它自己的包，因此它必须是一个公共类（public class）——不能是包私有的（package-private）——这意味着任何人都可以访问它。\n\
  \n这个非常通用问题的解决方案是对 Java 的访问控制模型进行一次性的更改。此更改既适用于调用 JDK 的用户代码，也适用于调用第三方库的应用程序。\n\n\
  ### 2.1.4 新的访问控制语义\n\n模块（Modules）为 Java 的访问控制模型引入了一个新概念：*导出*（exporting）包。在 Java\
  \ 8 及更早版本中，任何包中的代码都可以调用任何包中任何公共类上的公共方法。这有时被称为“散弹枪隐私”（shotgun privacy），源于对另一种编程语言的一句名言：\n\
  \n> Perl 对强制隐私并没有执之痴迷。它更倾向于让你待在它的客厅外，是因为你没有被邀请，而不是因为它有一把散弹枪。 —Larry Wall\n\n然而，对于\
  \ Java 来说，散弹枪隐私代表了一个大问题。越来越多的库在使用内部 API 来提供其他方式难以或无法提供的能力，这威胁到了平台的长期健康。\n\n从 Java\
  \ 8 开始，没有方法可以跨整个包强制执行访问控制。这意味着 JDK 团队无法定义一个公共 API，并确切知道该 API 的客户端不会破坏它或直接链接到内部实现。\n\
  \n这种约定——包中任何以 `java` 或 `javax` 开头的包都是公共 API，而其他所有都是内部的——这仅仅是一个约定。正如我们已经看到的，没有任何虚拟机（VM）或类加载机制强制执行这一点。\n\
  \n然而，有了模块，情况发生了变化。引入了 `exports` 关键字来指示哪些包被模块的公共 API。在模块化的 JDK 中，`sun.net` 包没有导出，因此之前的\
  \ Java 8 URL 规范化代码将无法编译。当我们用 Java 11 尝试时，会发生这种情况：\n\n```\n$ javac src/ch02/MyURLHandler.java\n\
  src/ch02/MyURLHandler.java:3: error: package sun.net is not visible\nimport sun.net.URLCanonicalizer;\n\
  \          ^\n  (package sun.net is declared in module java.base, which does not\
  \ export\n     it to the unnamed module)\nsrc/ch02/MyURLHandler.java:8: error: cannot\
  \ find symbol\n        return isSimpleHostName(url);\n               ^\n  symbol:\
  \   method isSimpleHostName(String)\n  location: class MyURLHandler\n2 errors\n\
  ```\n\n注意，错误信息的形式明确指出 `sun.net` 包现在是不可见的——编译器甚至看不到该符号。这是 Java 访问控制方式的一种根本性变化。只有导出的包上的方法是可访问的。不再是公共类上的公共方法对到处代码自动可见。\n\
  \n然而，这种变化对许多开发者可能是不可见的。如果你是一个遵守规则的 Java 开发者，你从未直接调用过内部包中的 API。但是，你可能会使用这样做此的库或框架，因此了解实际发生了什么变化并避免恐惧、不确定和怀疑（FUD）是有好的。\n\
  \n注意：良好的封装并不是免费的，模块化之前的 Java 实际上是一个非常开放的系统。当面对模块提供的更有结构性的系统时，许多 Java 开发者发现一些额外的保护具有限制性或令人沮丧，也许是自然的。让我们来看看编码这些\
  \ Java 模块新语义的语法。\n\n## 2.2 基础模块语法\n\nJava 平台模块被定义为一个概念单元，它是被声明和加载为单个实体的包和类的集合。每个模块必须声明一个新文件，称为*模块描述符*（module\
  \ descriptor），表示为 `module-info.java` 文件，包含以下内容：\n\n* 模块名称\n* 模块依赖\n* 公共 API（导出的包）\n\
  * 反射访问权限\n* 提供的服务\n* 消耗的服务\n\n此文件必须放在源代码层次结构的合适位置。例如，在 Maven 风格的布局中，全模块名 `wgjd.discovery`\
  \ 直接出现在 `src/main/java` 之后并包含 `module-info.java` 和包根目录，如下：\n\n```\nsrc\n  └── main\n\
  \       └── java\n            └── wgjd.discovery\n                 ├── wgjd\n  \
  \               │      └── discovery\n                 │              ├── internal\n\
  \                 │              │      ├── AttachOutput.java\n                \
  \ │              │      ├── PlainAttachOutput.java\n                 │         \
  \     │              └── Introspector.java\n                 │              └──\
  \ Discovery.java\n                 └── module-info.java\n```\n\n这与非模块化的 Java 项目不同，后者通常将\
  \ `src/main/java` 指定为包目录的根。然而，模块根目录下的包层次结构仍然可见。\n\n注意：当构建模块化项目时，模块描述符将被编译成类文件 `module-info.class`，但该文件（尽管命名如此）实际上与我们在\
  \ Java 平台上看到的类文件大不同。\n\n在本章中，我们将处理描述符的基本指令，但不会深入探讨模块提供的所有功能。特别是，我们将讨论模块的服务方面。\n\n\
  模块描述符的一个简单示例如下：\n\n```\nmodule wgjd.discovery {\n  exports wgjd.discovery;\n\n \
  \ requires java.instrument;\n  requires jdk.attach;\n  requires jdk.internal.jvmstat;\n\
  }\n```\n\n这包含了三个新关键字——`module`、`exports` 和 `requires`，其语法对大多数 Java 程序员来说应该是暗示性的。`module`\
  \ 关键字简单地声明了声明的作用范围。\n\n注意：`module-info.java` 的名字让人想起 `package-info.java`，它们之间有些关联。因为包在运行时并不是真正可见，因此需要一个变通方案（黑科技？）为旨在适用于整个包的注解元数据提供一个钩子。这个黑科技就是\
  \ `package-info.java`。在模块化世界中，可以与模块关联更多的元数据，因此选择了类似的名称。新语法实际上由*受限制关键字*组成，它们在 Java\
  \ 语言规范中的描述如下：\n\n另外十个字符序列是受限制关键字：`open`, `module`, `requires`, `transitive`, `exports`,\
  \ `opens`, `to`, `uses`, `provides` 和 `with`。这些字符序列仅在作为 `ModuleDeclaration` 和 `ModuleDirective`\
  \ 产生式的终结出现时才标记为关键字。\n\n\n\n\n\n用通俗的话说，这意味着这些新关键字只会出现在模块元数据的描述符中，而不会被视为通用 Java 源代码中的关键字。然而，即使在技术上可以使用这些词，但避免将它们用作\
  \ Java 标识符仍然是一个良好的习惯。这与我们在第 1 章中看到的 `var` 的情况相同，在书的剩余部分，我们将使用更宽松的语言并称它们为“关键字”。\n\
  \n### 2.2.1 导出与要求\n\n`exports` 关键字需要一个参数，即包名。在我们的示例中\n\n```\nexports wgjd.discovery;\n\
  ```\n\n意味着我们的示例模块 discovery 导出了 `wgjd.discovery` 包，但由于描述符中没有提到任何其他包，因此 `wgjd.discovery\
  \ .internal` 没有被导出，并且通常无法从 discovery 模块之外的代码访问。\n\n模块描述符中可以存在多行 `exports`，而且实际上这非常常见。通过\
  \ `exports ... to ...` 语法还可以实现更细粒度的控制，该语法指示只有特定的外部模块可以访问此模块中的指定包。\n\n注意 单个模块 `exports`\
  \ 一个或多个包，这些包构成了模块的公共 API，并且除非使用了覆盖（例如命令行开关），否则它们是其他模块中的代码可以访问的唯一包。\n\n`requires`\
  \ 关键字声明当前模块的依赖关系，并且始终需要一个参数，该参数是一个*模块*名称，而不是包名。`java.base` 模块包含了 Java 运行时基础基础包和类。我们可以使用\
  \ `jmod` 命令来查看，如下：\n\n```\n$ jmod describe $JAVA_HOME/jmods/java.base.jmod\njava.base@11.0.3\n\
  exports java.io\nexports java.lang\nexports java.lang.annotation\nexports java.lang.invoke\n\
  exports java.lang.module\nexports java.lang.ref\nexports java.lang.reflect\nexports\
  \ java.math\nexports java.net\nexports java.net.spi\nexports java.nio\n// ... 更多很多行输出\n\
  ```\n\n这些包被每个 Java 程序使用，因此 `java.base` 始终是每个模块的隐式依赖，不需要在 `module-info.java` 中显式声明。这与\
  \ `java.lang` 是每个 Java 类的隐式 `import` 的方式非常相似。\n\n关于模块名称的一些基本规则和约定如下：\n\n* 模块存在于全局命名空间中。\n\
  * 模块名称必须是唯一的。\n* 如果合适，使用标准的 `com.company.project` 约定。\n\n一个重要的基本模块概念是*传递性*（transitivity）。让我们仔细研究一下这个概念，因为它不仅出现在模块的上下文中，也出现在\
  \ Java 更熟悉的库（即 JAR 文件）依赖中（我们将在第 11 章中遇到它们）。\n\n### 2.2.2 传递性\n\n*传递性*是一个非常通用的计算术语，完全不是针对\
  \ Java，它描述了这样的情况：一个代码单元需要其他单元才能正常运行，而这些单元本身又可能需要其他单元。我们的原始代码可能根本不会提到这些“隔一层”的代码单元，但它们仍然需要存在，否则我们的应用程序无法工作。\n\
  \n为了理解为什么会这样——以及为什么很重要——请考虑两个模块 `A` 和 `B`，其中 `A` 要求 `B`。有两种不同的可能情况：\n\n* `A` 没有导出任何直接提到\
  \ `B` 中类型的方法。\n* `A` 将 `B` 的类型作为其 API 的一部分包含进来。\n\n在 `A` 导出返回在 `B` 中定义的类型的情况下，这将导致除非\
  \ `A` 的客户端（那些要求 `A` 的模块）也要求 `B`，否则 `A` 是不可用的。这对于 `A` 的客户端来说是完全没开销。\n\n模块系统提供了一些简单的语法来解决这个问题：`requires\
  \ transitive`。如果模块 `A` 传递性地要求另一个模块，那么任何依赖于 `A` 的代码也将隐式地获取这些传递依赖。\n\n尽管在某些用例中，使用\
  \ `requires transitive` 是不可避免的，但通常情况下，在编写模块时，尽量减少传递性的使用被认为是一种最佳实践。当我们在第 11 章讨论构建工具时，我们将对传递依赖进行更多说明。\n\
  \n## 2.3 加载模块\n\n如果你第一次遇到 Java 类加载是在我们在第 1 章中简要提到它时，并且你对此没有其他经验，请不要担心。现在需要的最重要的是存在以下四种模块，其中某些模块在加载时的行为略有不同：\n\
  \n* 平台模块 (Platform modules)\n* 应用模块 (Application modules)\n* 自动模块 (Automatic modules)\n\
  * 未命名模块 (Unnamed module)\n\n另一方面，如果你已经熟悉类加载，你应该知道模块的出现改变了类加载运行的某些细节。\n\n现代 JVM 具有感知模块的类加载器，JRE\
  \ 类的加载方式与 Java 8 完全不同。一个核心概念是*模块路径*（module path），它是指向模块（或包含模块的目录）的路径序列。这与传统的 Java\
  \ classpath 类似，但又是相互独立的。\n\n注意 我们将在第 4 章正式学习类加载，并为新读者和经验丰富的读者介绍现代的处理方法。\n\n模块化类加载的基本原理如下：\n\
  \n* 模块是从模块路径解析的，而不是从旧式的 classpath。\n* 在启动时，JVM 解析一个模块图，该图必须是无环的。\n* 一个模块是图的根，也是执行的开始点。它包含了作为入口的\
  \ main 方法。\n\n已经模块化的依赖被称为*应用模块*，并且它们被放在模块路径上。模块解析使用深度优先，由于图必须是无的，算法将终止（并且在线性时间内）。让我们深入探讨这四种类型的模块。\n\
  \n### 2.3.1 平台模块\n\n这些是来自 JDK 自身的模块。它们在 Java 8 中是单体运行时 (`rt.jar`) 的一部分（可能是辅助 JAR，如\
  \ `tools.jar`）。我们可以从 `--list-modules` 获取平台模块列表，如下：\n\n```\n$ java --list-modules\n\
  java.base@11.0.6\njava.compiler@11.0.6\n...\njava.xml@11.0.6\njava.xml.crypto@11.0.6\n\
  jdk.accessibility@11.0.6\n...\njdk.unsupported@11.0.6\n...\n```\n\n此代码将提供完整列表，而不是我们在图\
  \ 2.1 中看到的部分集。\n\n注意 准确的模块列表及其名称取决于使用的 Java 版本。例如，在 Oracle 的 GraalVM 实现中，某些额外的模块如\
  \ `com.oracle.graal.graal_enterprise`、`org.graalvm.jsengine` 和 `org.graalvm.sdk`\
  \ 可能存在。\n\n平台模块大量使用了限定导出（qualified exporting）机制，某些包只导出给指定的模块列表，而不全局可用。\n\n发行中最重要的模块是\
  \ `java.base`，它是每个其他模块的隐式依赖。它包含了 `java.lang`、`java.util`、`java.io` 以及其他各种基础包。该模块基本上对应于应用程序可以需要且运行的最小\
  \ Java 运行时。\n\n在光谱的另一端是*聚合模块*（aggregator modules），它们不包含任何代码，但作为快捷机制，允许应用程序传递性地引入非常广泛的依赖。例如，`java.se`\
  \ 模块引入了整个 Java SE 平台。\n\n### 2.3.2 应用模块\n\n这些类型的模块是应用程序的模块化依赖，或者应用程序本身。这种类型的模块有时被称为*库模块*（library\
  \ module）。\n\n\n\n\n注意：平台模块（platform modules）与应用模块（application modules）之间没有技术上的区别——区别完全是哲学上的——以及使用哪个类加载器来加载它们，我们将在第\
  \ 4 章中讨论。\n\n应用程序依赖的第三方库将应用模块。例如，用于处理 JSON 的 `Jackson` 库从 2.10 版本开始已经模块化，并被视为应用模块（又称为库模块）。\n\
  \n应用模块通常同时依赖于平台模块和其他应用模块。尽可能限制这些模块的依赖关系是一个好主意，并避免将 `java.se` 作为依赖项。\n\n### 2.3.3\
  \ 自动模块（Automatic modules）\n\n模块系统的一个刻意设计特性是：你不能从模块中引用类路径（classpath）。这种限制似乎可能产生问题——如果一个模块需要依赖某些尚未模块化的代码，该怎么办？\n\
  \n解决方案是将非模块化的 `JAR` 文件移动到模块路径（module path）（并将其从类路径中移除）。这样做之后，该 `JAR` 就变成了一个`自动模块`（automatic\
  \ module）。模块系统会自动为你的模块生成一个名称，该名称源自 JAR 的名称。\n\n自动模块会导出它包含的每个包，并自动依赖模块路径中的所有其他模块。自动模块没有正确的模块依赖信息，因为它们既没有显式声明其依赖项，也没有公开其\
  \ API。这意味着它们在模块系统中不是一等公民，提供的保证也不与真正的 Java 模块处于同一水平。\n\n通过在 `JAR` 中的 `MANIFEST.MF`\
  \ 文件中添加 `Automatic-Module-Name` 条目，可以显式声明名称。这通常是迁移到 Java 模块时的中间步骤，因为它允许开发者预留模块名称，并开始获得一些与模块化代码互操作的益处。\n\
  \n例如，Apache Commons Lang 库尚未完全模块化，但它提供了 `org.apache.commons.lang3` 作为自动模块名。其他模块随后可以声明它们依赖于这个自动模块，即使它的维护者尚未完成其向完全模块化的过渡。\n\
  \n### 2.3.4 未命名模块（Unnamed module）\n\n类路径上的所有类和 `JARs` 都会被添加到单个模块中，即未命名模块，或称 `UNNAMED`。这样做是为了向后兼容，但代价是如果某些代码仍留在未命名模块中，模块系统的有效性可能无法一直达到理想状态。\n\
  \n对于完全非模块化的应用（例如运行在 Java 11 运行时上的 Java 8 应用），类路径的内容会被转储到未命名模块，并且根模块被视为 `java.se`。\n\
  \n模块化代码不能依赖未命名模块，因此在实践中，模块不能依赖类路径中的任何内容。自动模块通常用于帮助解决这种情况。从形式上说，未命名模块依赖 `JDK` 中的所有模块以及模块路径，因为它复制了模块化之前的行为。\n\
  \n## 2.4 构建第一个模块化应用\n\n让我们构建第一个模块化应用程序示例。为了实现这一点，我们需要构建模块图（当然，这是一个有向无图 DAG）。图必须有一个`根模块`（root\
  \ module），在我们案例中，它是包含应用程序入口类的模块。应用程序的模块图是根模块所有模块化依赖的传递闭包。\n\n对于我们的示例，我们将把第 1 章末尾创建的\
  \ HTTP 站点检查工具改编为一个模块化应用。文件布局如下：\n\n```\n.\n└── wgjd.sitecheck\n     ├── wgjd\n \
  \    │      └── sitecheck\n     │              ├── concurrent\n     │          \
  \    │      └── ParallelHTTPChecker.java\n     │              ├── internal\n   \
  \  │              │      └── TrustEveryone.java\n     │              ├── HTTPChecker.java\n\
  \     │              └── SiteCheck.java\n     └── module-info.java\n```\n\n我们将某些关注点（例如\
  \ `TrustEveryone` 提供者）拆分到它们自己的类中，而不是将它们表示为静态内部类，正如我们在所有代码都需要存在于单个文件时所做的那样。我们还设置了单独的包，并且导出所有的包。模块文件与我们之前见过的非常相似，如下所示：\n\
  \n```\nmodule wgjd.sitecheck {\n  requires java.net.http;\n  exports wgjd.sitecheck;\n\
  \  exports wgjd.sitecheck.concurrent;\n}\n```\n\n注意对模块 `java.net.http` 的依赖。为了调查缺失依赖时会发生什么，让我们注释掉对\
  \ HTTP 模块的依赖，并尝试使用 `javac` 如下编译项目：\n\n```\n$ javac -d out wgjd.sitecheck/module-info.java\
  \ \\\n    wgjd.sitecheck/wgjd/sitecheck/*.java \\\n    wgjd.sitecheck/wgjd/sitecheck/*/*.java\n\
  wgjd.sitecheck/wgjd/sitecheck/SiteCheck.java:8: error:\n  package java.net.http\
  \ is not visible\nimport java.net.http.*;\n               ^\n  (package java.net.http\
  \ is declared in module java.net.http, but\n      module wgjd.sitecheck does not\
  \ read it)\nwgjd.sitecheck/wgjd/sitecheck/concurrent/ParallelHTTPChecker.java:4:\n\
  \  error: package java.net.http is not visible\nimport java.net.http.*;\n      \
  \         ^\n\n// 几个类似的错误\n```\n\n这次失败表明，模块的简单问题可以很容易解决。模块系统检测到了缺失的模块，并尝试通过建议添加该模块来提供帮助。如果我们这样做，正如预期的，模块构建成功。然而，更复杂的问题可能需要修改编译步骤或通过开关进行干预。\n\
  \n### 2.4.1 模块的命令行开关\n\n编译模块时，可以使用许多命令行开关来控制模块的编译（以及稍后的执行）。最常用的开关如下：\n\n- `list-modules`——打印所有模块的列表\n\
  - `module-path`——指定包含模块的目录或目录\n- `add-reads`——在解析时添加额外的 `requires`\n- `add-exports`——在编译时添加额外的\
  \ `exports`\n- `add-opens`——在运行时启用对所有类型的反射访问\n- `add-modules`——将模块列表添加到默认集合\n- `illegal-access=permit|warn|deny`——更改反射访问规则\n\
  \n我们已经接触过大部分这些概念——与反射相关的限定符除外，我们将在 2.4.3 节中详细讨论。\n\n让我们看看其中一个开关的作用。这将展示一个模块打包中的常见问题，并作为许多开发者在开始在自己的代码中使用模块时可能遇到的真实世界问题示例。\n\
  \n在开始使用模块时，我们有时发现我们需要打破封装。例如，从 Java 8 迁移的应用程序可能期望访问一个不再导出的内部包。\n\n例如，考虑一个具有简单结构的项目，它使用\
  \ `Attach API` 动态连接到主机上的其他 JVM 并报告它们的一些基本信息。它在磁盘上的布局如下，正如我们在之前的示例中所示：\n\n编译项目会产生以下系列错误：\n\
  \n\n\n\n\n```\n$ javac -d out/wgjd.discovery wgjd.discovery/module-info.java \\\n\
  \  wgjd.discovery/wgjd/discovery/*.java \\\n  wgjd.discovery/wgjd/discovery/internal/*\n\
  \nwgjd.discovery/wgjd/discovery/VMIntrospector.java:4: error: package\n  sun.jvmstat.monitor\
  \ is not visible\nimport sun.jvmstat.monitor.MonitorException;\n               \
  \   ^\n  (package sun.jvmstat.monitor is declared in module jdk.internal.jvmstat,\n\
  \    which does not export it to module wgjd.discovery)\nwgjd.discovery/wgjd/discovery/VMIntrospector.java:5:\
  \ error: package\n  sun.jvmstat.monitor is not visible\nimport sun.jvmstat.monitor.MonitoredHost;\n\
  \                  ^\n  (package sun.jvmstat.monitor is declared in module jdk.internal.jvmstat,\n\
  \    which does not export it to module wgjd.discovery)\n```\n\n这些问题是由项目中使用内部 API\
  \ 的代码引起的，如下所示：\n\n```java\npublic class VMIntrospector implements Consumer<VirtualMachineDescriptor>\
  \ {\n\n    @Override\n    public void accept(VirtualMachineDescriptor vmd) {\n \
  \       var isAttachable = false;\n        var vmVersion = \"\";\n        try {\n\
  \            var vmId = new VmIdentifier(vmd.id());\n            var monitoredHost\
  \ = MonitoredHost.getMonitoredHost(vmId);\n            var monitoredVm = monitoredHost.getMonitoredVm(vmId,\
  \ -1);\n            try {\n                isAttachable = MonitoredVmUtil.isAttachable(monitoredVm);\n\
  \                vmVersion = MonitoredVmUtil.vmVersion(monitoredVm);\n         \
  \   } finally {\n                monitoredHost.detach(monitoredVm);\n          \
  \  }\n        } catch (URISyntaxException | MonitorException e) {\n            e.printStackTrace();\n\
  \        }\n\n        System.out.println(\n                vmd.id() + '\\t' + vmd.displayName()\
  \ + '\\t' + vmVersion +\n                  '\\t' + isAttachable);\n    }\n}\n```\n\
  \n虽然像 `VirtualMachineDescriptor`这样的类是 `jdk.attach` 模块导出接口的一部分（因为该类位于导出包 `com.sun\
  \ .tools.attach` 中），但我们依赖的其他类（例如 `sun .jvmstat.monitor` 中的 `MonitoredVmUtil`）是不可访问的。幸运的是，工具了一种软化模块边界并提供对非导出包访问的方法。\n\
  \n为了实现这一点，我们需要添加一个开关——`--add-exports`——来强制访问 `jdk.internal.jvmstat` 模块的内部实现，这意味着通过这样做我们确实打破了封装性。生成的编译命令行如下：\n\
  \n```\n$ javac -d out/wgjd.discovery \\\n  --add-exports=jdk.internal.jvmstat/sun.jvmstat.monitor=wgjd.discovery\
  \ \\\n  wgjd.discovery/module-info.java \\\n  wgjd.discovery/wgjd/discovery/*.java\
  \ \\\n  wgjd.discovery/wgjd/discovery/internal/*\n```\n\n`--add-exports` 的语法要求是：我们必须提供想要访问的模块和包名，以及哪个模块被授予了访问权限。\n\
  \n### 2.4.2 运行模块化应用\n\n在模块出现之前，只有以下两种方法可以启动 Java 应用：\n\n```\njava -cp classes wgjd.Hello\n\
  java -jar my-app.jar\n```\n\n这两个方法对 Java 程序员来说都是很熟悉的，分别是启动一个类和从 JAR 文件内部启动主类。在现代\
  \ Java 中，又增加了两种启动程序的方法。我们在 1.5.4 节中遇到了一种启动单源文件程序的新方法，现在我们将遇到第四种模式：启动模块的主类。其语法如下：\n\
  \n```\njava --module-path mods -m my.module/my.module.Main\n```\n\n然而，就像编译一样，我们可能需要额外的命令行开关。例如，参考我们之前的内省检查示例：\n\
  \n```\n$ java --module-path out -m wgjd.discovery/wgjd.discovery.Discovery\nException\
  \ in thread \"main\" java.lang.IllegalAccessError:\n  class wgjd.discovery.VMIntrospector\
  \ (in module wgjd.discovery) cannot\n    access class sun.jvmstat.monitor.MonitorException\
  \ (in module\n      jdk.internal.jvmstat) because module jdk.internal.jvmstat does\
  \ not\n        export sun.jvmstat.monitor to module wgjd.discovery\n    at wgjd.discovery/wgjd.discovery.VMIntrospector.accept(\n\
  \    VMIntrospector.java:19)\n    at wgjd.discovery/wgjd.discovery.Discovery.main(Discovery.java:26)\n\
  ```\n\n为了防止此错误，我们必须在实际程序执行时也提供打破封装的开关，如下：\n\n```\n$ java --module-path out \\\n\
  \  --add-exports=jdk.internal.jvmstat/sun.jvmstat.monitor=wgjd.discovery \\\n  -m\
  \ wgjd.discovery/wgjd.discovery.Discovery\n\nJava processes:\nPID    Display Name\
  \    VM Version    Attachable\n53407    wgjd.discovery/wgjd.discovery.Discovery\
  \    15-ea+24-1168    true\n```\n\n如果运行时系统找不到我们请求的根模块，我们预计会看到这样的异常：\n\n```\n$ java\
  \ --module-path mods -m hello/HelloWorld\nError occurred during initialization of\
  \ boot layer\njava.module.FindException: Module not found\n```\n\n即使是这个简单的错误信息也向我们展示了模块具有新的方面，包括：\n\
  \n* 包 `java.module`\n* 异常 `FindException`\n\n在下一节中，我们将简要介绍模块与反射的交互。我们假设你已经熟悉反射，如果不熟悉，可以跳过本节，在阅读第四章后再回来。\n\
  \n### 2.4.3 模块与反射\n\n在 Java 8 中，可以使用反射访问运行时的几乎任何内容。甚至可以通过所谓的 `setAccessible()` 黑科技来绕过访问检查。\n\
  \n正如我们已经看到的，模块改变了访问控制规则。这同样适用于反射——目标是默认情况下只有导出包可以被反射访问。\n\n然而，模块的创建者意识到有时开发者需要反射访问（而不是直接访问）。这需要显式许可，并且可以通过\
  \ `opens` 关键字对内部包提供反射访问。开发者还可以通过 `opens ... to ...` 语法允许特定的包对特定的模块进行开放。\n\n之前的讨论似乎意味着这些反射技巧现在被排除了。事实情况要复杂得多，最好通过讨论命令行开关\
  \ `--illegal-access` 来解释。该开关有三个设置——`permit|warn|deny`，用于控制反射检查的严格程度。\n\n模块系统的意图一直是，随着时间的推移，整个\
  \ Java 生态系统应该转向良好的封装（包括反射），并在某些时刻开关将默认设置为 `deny`（并最终被移除）。这种变化显然不能一夜之间——如果反射开关突然设置为\
  \ `deny`，大片 Java 生态系统将会崩溃，没有人会升级。\n\n然而，随着 Java 17 的发布，距离 Java 9 发布以及这种警告首次出现已经过去四年了。这无疑是足够的时间且公平的警告。因此，在\
  \ Java 16 中决定将 `--illegal-access` 的默认选项改为 `deny`，并在 Java 17 中完全移除该选项的作用。\n\n注意：反射封装语义的变化是为什么一个直接从\
  \ 8 迁移到 17 的应用程序可能比执行两次升级（8 到 11，然后 11 到 17）的应用程序遇到更多麻烦的原因。\n\n\n\n\n仍然可以使用 `--add-opens`\
  \ 命令行选项或 `Add-Opens` JAR 清单属性来打开特定的包。对于某些一直使用反射且尚未完全模块化的特定库或框架，可能需要这种用法。然而，在 `Java\
  \ 17` 中，全局重新启用访问的暴力选项已被移除。\n\n有助于这一过渡的另一个额外用概念是 `open modules`（开放模块）。这种简单的的声明被用于允许完全开放的反射访问——它开放了模块的所有包以供反射，但无法用于编译时访问。这与现有代码和框架提供了简单的兼容性，但它是更松散的封装形式。出于如此，最好避免使用开放模块，或仅在迁移到模块化构建时作为过渡形式使用。在第\
  \ 17 章中，我们将讨论 `Unsafe` 的特定案例，它是说明模块化世界中反射某些问题的极佳示例。\n\n## 2.5 模块化架构\n\n模块代表了代码打包和部署的一种根本性的方式。团队确实需要采用一些新实践，以充分利用新功能和架构优势。然而，好消息是，不需要为了开始使用现代\
  \ Java 而立即开始这些工作。使用 classpath 和 JAR 文件的传统老旧方法将继续有效，直到团队准备好完全采用模块。\n\n事实上，Mark Reinhold（Oracle\
  \ Java 首席架构师）对于应用程序采用模块化的“必要性”是这样说的：\n\n没有必要切换到模块。\n\n从来有过切换到模块的必要。\n\n`Java 9`\
  \ 及更高后的版本通过“未命名模块”（unnamed module）的概念，支持在传统的类路径（class path）上的传统 JAR 文件，并且可能会一直支持到宇宙热寂。\n\
  \n是否开始使用模块完全取决于你。\n\n如果你维护着一个变化不大的大型遗留项目，那么可能不值得投入。\n\n—Mark Reinhold，[`stackoverflow.com/a/62959016`](https://stackoverflow.com/a/62959016)\n\
  \n在理想的世界中，模块应该是所有新字段应用（greenfield apps）的默认选项，但这在实践中证明是复杂的，因此作为替代方案，在迁移时请遵循以下流程：\n\
  \n1. 升级到 `Java 11`（仅 classpath）。\n2. 设置自动模块名称。\n3. 引入一个由所有代码组成的 `monolithic module`（单体模块）。\n\
  4. 根据需要拆分为各个模块。\n\n通常，在第 3 步，暴露了过多的实现代码。这意味着经常，第 4 步的工作部分是创建额外的包来容纳内部和实现代码，并将代码重构到这些包中。\n\
  \n如果你仍在使用 `Java 8` 尚未准备好迁移到模块化构建，你仍然可以执行以下操作来为迁移做准备：\n\n* 在 `MANIFEST.MF` 中引入自动模块名称。\n\
  * 从你的部署制品中移除拆分包（split packages）。\n* 使用 `jdeps` 和紧凑配置（Compact Profiles）来减少不必要的依赖的占用。\n\
  \n为了实现第一点，使用显式的自动模块名称（正如我们在本章稍早讨论的）将有助于过渡。所有不支持模块的 `Java` 版本都会忽略该自动模块名称，但它仍然允许为你的库预留一个稳定的名称，并将某些代码从未命名模块中移出。它还有一个优势是，你库的消费者已经为迁移到模块做好了准备，因为你已经公布了该模块将使用的名称。让我们仔细地查看另外两个具体的建议。\n\
  \n### 2.5.1 拆分包 (Split packages)\n\n开发者在开始使用模块时遇到的一个常见问题是拆分包（split packages）——当两个或多个独立的\
  \ JAR 包含同一个包的类时。在非模块应用中，拆分包没有问题，因为 JAR 文件或包对运行时都没有特殊的意义。然而，在模块化世界中，一个包只能属于一个模块且不能被拆分。\n\
  \n如果一个现有应用程序升级为使用模块，并且具有包含拆分包的依赖，那么将必须进行修复——这是避免的。对于团队控制的代码，这是额外的工作，但并不困难。一种技术是生成一个特定的制品（通常带有\
  \ `-all` 后缀），由构建系统在生成非模块版本的同时生成它，其中一个单一的 JAR 包含了拆分包的所有部分。\n\n对于外部依赖，修复可能会更复杂。可能需要将第三方开源代码重新封装到可以作为自动模块消费的\
  \ JAR 中。\n\n### 2.5.2 Java 8 紧凑配置 (Compact Profiles)\n\n紧凑配置是 `Java 8` 的一项特性。它们是经过精简的运行时环境，必须同时实现\
  \ JVM 和 Java 语言规范。它们在 `Java 8` 中被引入，作为通往 `Java 9` 模块化故事的有用跳石。\n\n紧凑配置必须包含 Java 语言规范中显式提到的所有类和包。配置是包的列表，它们通常与全\
  \ Java SE 平台中同名的包相同。虽然存在极少数异常，但它们被明确指出了。\n\n配置的主要用例之一是作为服务器应用程序或其他环境的基础，在这些环境中，部署不必要的功能是不受欢迎的。例如，在历史上，大量的安全漏洞与\
  \ Java 的 GUI 特性有关，特别是在 `Swing` 和 `AWT` 中。通过选择在不需要的应用中部署实现这些功能的包，我们可以获得适量的额外安全性，特别是对于服务器应用程序等。\n\
  \n注意：曾几何时，Oracle 发布过一个精简的 JRE（“服务器 JRE”），其作用与紧凑配置 1 非常相似。\n\n紧凑配置 1 是部署应用程序可能的最小包集。它包含了\
  \ 50 个包，从熟悉的\n\n* `java.io`\n* `java.lang`\n* `java.math`\n* `java.net`\n* `java.text`\n\
  * `java.util`\n\n到一些可能意料之外但为现代应用程序提供核心类的包：\n\n* `java.util.concurrent.atomic`\n\
  * `java.util.function`\n* `javax.crypto.interfaces`\n* `javax.net.ssl`\n* `javax.security.auth.x500`\n\
  \n紧凑配置 2 大得多，包含了如 XML、SQL、RMI 和安全所需的包。紧凑配置 3 更大，基本上由整个 JRE 组成除了窗口和 GUI 组件——类似于 `java.se`\
  \ 模块。\n\n注意：所有配置都包含 `Object` 引用的类型以及语言规范中提到的所有类型的传递闭。\n\n紧凑配置 1 最接近最小运行时，因此在某些方面它类似于\
  \ `java.base` 模块的原型。理想情况下，如果你的应用程序或库可以在仅依赖紧凑配置 1 的情况下运行，那么就应该这样做。\n\n为了帮助判断你的应用是否可以使用紧凑配置\
  \ 1 或其他配置，JDK 提供了 `jdeps`。这是一个随 `Java 8` 和 11 提供的静态分析工具，用于检查包或类的依赖关系。该工具可以以多种方式使用，从识别应用程序运行所需的配置，到识别调用未记录的内部\
  \ JDK API（如 `sun.misc` 类）的开发者代码，再到帮助追踪传递依赖。它对于从 `Java 8` 迁移到 `11` 非常帮助，并支持 JAR 和模块。在最简单的形式下，`jdeps`\
  \ 接收一个类或包并提供依赖包的简要列表。例如，对于发现示例：\n\n\n\n\n\n```\n$ jdeps Discovery.class\nDiscovery.class\
  \ -> java.base\nDiscovery.class -> jdk.attach\nDiscovery.class -> not found\n  \
  \ wgjd.discovery              -> com.sun.tools.attach      jdk.attach\n   wgjd.discovery\
  \              -> java.io                   java.base\n   wgjd.discovery       \
  \       -> java.lang                 java.base\n   wgjd.discovery              ->\
  \ java.util                 java.base\n   wgjd.discovery              -> wgjd.discovery.internal\
  \   not found\n```\n\n`-P` 参数显示了类（或包）运行所需的模块配置方案（profile），当然，这仅适用于 Java 8 运行时。\n\
  \n让我们快速看看另一种迁移技术，任何基础扎实的 Java 开发者应该了解这种技术——使用`多版本 JAR 包（multi-release JARs）`。\n\n\
  ### 2.5.3 多版本 JAR 包\n\n#### 什么是多版本 JAR 包？\n\n这项新能力允许构建一个 `JAR` 文件，该文件可以包含可以同时在 Java\
  \ 8 和现代模块化 JVM 上运行的库和组件。例如，你可以依赖仅在较新版本中可用的库类，但通过使用回退和存根（fallback and stubbing）方法，仍然可以在早期版本上运行。\n\
  \n要制作一个多版本 `JAR`，必须在 `JAR` 的清单文件中包含以下条目：\n\n```\nMulti-Release: true\n```\n\n此条目仅对版本\
  \ 9 及以上的 JVM 才有意义，因此如果该 `JAR` 在 Java 8（或更早）VM 上使用，多版本特性将会被忽略。\n\n针对 Java 8 之后版本的类被称为`变体代码（variant\
  \ code）`，它们存储在 `JAR` 中 `META-INF` 下的特殊目录下，如下：\n\n```\nMETA-INF/versions/<版本号>\n\
  ```\n\n#### 该机制是如何运作的\n\n该机制通过按类进行覆盖来实现。Java 9 及更高版本的 Java 会在 `versions` 目录中查找与主内容根目录名称完全相同的类。如果找到了，则使用被覆盖的版本来替换内容根目录中的类。\n\
  \n注意，Java 类文件被加盖了创建它们的 Java 编译器的版本号——`类文件版本号`，在较后 Java 版本上创建的代码将无法在旧版 JVM 上运行。\n\
  \n`META-INF/versions` 位置会被 Java 8 及更早版本忽略，因此这提供了一个巧妙的技巧，来绕过多版本 `JAR` 中某些代码由于类文件版本过高而无法在\
  \ Java 8 上运行的问题。\n\n然而，这意味着内容根目录中的类以及任何被覆盖的变体的 API 必须相同，因为它们在两种情况下都以完全相同的方式进行链接。\n\
  \n## 示例：构建多版本 JAR 包\n\n让我们来看一个功能示例：获取运行中 JVM 的进程 ID（PID）。遗憾的是，在 Java 9 之前的版本中，这相当繁琐，并且需要在\
  \ `java.lang.management` 包中进行一些底层的破解。\n\nJava 11 确实提供了从 `Process` API 获取 PID 的 API，因此我们想设置一个简单的多版本\
  \ `JAR`，在 API 可用时使用简单的 API，仅在必要时才回退到基于 JMX 的方法。\n\n主类看起来如下：\n\n```\npublic class\
  \ Main {\n    public static void main(String[] args) {\n        System.out.println(GetPID.getPid());\n\
  \    }\n}\n```\n\n注意，具有版本相关实现的功能已隔离到一个单独的类 `GetPID` 中。Java 8 版本的代码有些冗长，如下：\n\n```java\n\
  public class GetPID {\n  public static long getPid() {\n    System.out.println(\"\
  Java 8 version...\"); ❶\n    // ManagementFactory.getRuntimeMXBean().getName() 返回代表\n\
  \    // 当前运行的 JVM 的名称。在 Sun 和 Oracle JVM 上，\n    // 该名称格式为 <pid>@<hostname>。\n\n\
  \    final var jvmName = ManagementFactory.getRuntimeMXBean().getName();\n    final\
  \ var index = jvmName.indexOf('@');\n    if (index < 1) {\n        return 0;\n \
  \   }\n\n    try {\n        return Long.parseLong(jvmName.substring(0, index));\n\
  \    } catch (NumberFormatException e) {\n        return 0;\n    }\n  }\n}\n```\n\
  \n❶ 我们包含这一行是为了可以看到这是 Java 8 版本。\n\n这要求我们从 JMX 方法中解析字符串——即便如此，我们的解决方案也无法保证在不同的 JVM\
  \ 实现之间具有可移植性。相比之下，Java 9 及更高版本在 API 中提供了一个简单得的标准方法，如下代码段所示：\n\n```java\npublic class\
  \ GetPID {\n    public static long getPid() {\n        // 使用 Java 9 中新增的 ProcessHandle\
  \ API ...\n        var ph = ProcessHandle.current();\n        return ph.pid();\n\
  \    }\n}\n```\n\n由于 `ProcessHandle` 类位于 `java.lang` 包中，我们甚至不需要 `import` 语句。\n\n\
  现在，我们需要安排多版本 `JAR`，使得 Java 11 代码被包含在 `JAR` 中，并且如果 JVM 版本足够高，则优先于回退版本使用。一种合适的代码布局如下：\n\
  \n```\n.\n└── src\n     ├── main\n     │      └── java\n     │              └──\
  \ wgjd2ed\n     │                      ├── Main.java\n     │                   \
  \   └── GetPID.java\n     └── versions\n          └── 11\n               └── java\n\
  \                    └── wgjd2\n                         └── GetPID.java\n```\n\
  （注：此处示例路径在原文中略有微调，保持逻辑一致）\n*纠正：根据原文结构，布局应为：*\n```\n.\n└── src\n     ├── main\n \
  \    │      └── java\n     │              └── wgjd2ed\n     │                  \
  \    ├── Main.java\n     │                      └── GetPID.java\n     └── versions\n\
  \          └── 11\n               └── java\n                    └── wgjd2ed\n  \
  \                       └── GetPID.java\n```\n（注：原文示例中结构如下，此处遵循原文翻译）\n\n主代码库需要使用\
  \ Java 8 进行编译，然后是 Java 8 之后的代码。\n\n### 编译步骤\n\n1. 目标 Java 8 编译主代码库：\n```bash\n$\
  \ javac --release 8 -d out src/main/java/*.java\n```\n\n2. 将目标 Java 11 代码编译到独立的目录：\n\
  ```bash\n$ javac --release 11 -d out-11 versions/11/java/*.java\n```\n\n3. 使用 `jar`\
  \ 工具构建多版本 `JAR`：\n```bash\n$ jar --create --release 11 \\\n      --file pid.jar\
  \ --main-class=wgjd2ed.Main\n      -C out/ \\\n      -C out-11/\n```\n\n这创建了一个多版本\
  \ `JAR`，它是可运行的（以 `Main` 为入口点）。在 Java 11 上运行 JAR 会得到如下输出：\n\n```bash\n$ java -version\n\
  openjdk version \"11.0.3\" 2019-04-16\nOpenJDK Runtime Environment AdoptOpenJDK\
  \ (build 11.0.3+7)\nOpenJDK 64-Bit Server VM AdoptOpenJDK (build 11.0.3+7, mixed\
  \ mode)\n\n$ java -jar pid.jar\n13855\n```\n\n在 Java 8 上运行：\n\n```bash\n$ java -version\n\
  openjdk version \"1.8.0_212\"\nOpenJDK Runtime Environment (AdoptOpenJDK)(build\
  \ 1.8.0_212-b03)\nOpenJDK 64-Bit Server VM (AdoptOpenJDK)(build 25.212-b03, mixed\
  \ mode)\n\n$ java -jar pid.jar\nJava 8 version...\n13860\n```\n\n注意我们在 Java 8 版本中添加的额外标识，以便区分情况并确保运行的是不同的版本。对于多版本\
  \ JAR 的实际应用场景，我们希望代码在两种情况下都能执行相同操作（如果我们为 Java 8 补全功能），或者在在不支持该功能的 JVM 上运行时以优雅或可预测的方式失败。\n\
  \n我们建议遵循的一个重要架构模式是将 JDK 版本相关的代码隔离到单独的包或包组中，取决于功能的扩展程度。\n\n该项目遵循的一些基本准则和原则：\n\n*\
  \   主代码库必须能够使用 Java 8 编译。\n*   Java 11 部分必须使用 Java 11 编译。\n*   Java 11 部分必须在独立的代码根目录中，与主构建隔离。\n\
  *   最终结果应该是单个 `JAR` 文件。\n*   保持构建配置尽可能简单。\n*   考虑让多版本 `JAR` 也实现模块化。\n\n\n\n\n最后一点尤为重要，对于更复杂的项目来说，也是如此，因为这些项目不可避免地需要适当构建工具，而不仅仅是\
  \ `javac` 和 `jar`。\n\n## 2.6 模块之外\n\n在结束本章之前，让我们快速看一眼模块之外的内容。回顾一下，模块的核心意义在于为 Java\
  \ 语言引入了一种缺失的抽象：即具有依赖保证的部署单元概念，而这些保证可以被源代码编译器和运行时所信赖。\n\n这种可以信赖的模块化依赖信息理念，对于现代可部署软件世界有许多应用。在\
  \ Java 中，随着工具和生态系统提供完全支持，以及对它们所带来的收益得到更好的理解，模块的采用率正在缓慢但稳步地增长。\n\n让我们通过介绍一个与模块一同引入平台的新功能——`JLink`\
  \ 来结束本章。它能够将精简的 Java 运行时与应用程序一起打包。这为使用该功能的应用程序提供了以下好处：\n\n* 将应用程序和 JVM 打包进单一的、自包含的目录。\n\
  * 减小应用程序和 JRE 包的占用空间和整体下载大小。\n* 减少支持开销，因为不需要调试 Java 应用程序与主机安装的 JVM 之间的交互。\n\n`jlink`\
  \ 生成自包含目录可以很容易地封装为部署产物（例如 Linux 的 `.rpm` 或 `.deb`、Mac 的 `.dmg` 或 Windows 的 `.msi`），为现代\
  \ Java 应用程序提供简单的安装体验。\n\n在某些方面，Java 8 中的紧凑配置（Compact Profiles）技术提供了 JLink 的早期版本，但随模块引入的版本要有用且全面得多。例如，我们将复用本章早些时候发现示例。它包含一个简单的\
  \ `module-info.java`：\n\n```java\nmodule wgjd.discovery {\n  exports wgjd.discovery;\n\
  \n  requires java.instrument;\n  requires java.logging;\n  requires jdk.attach;\n\
  \  requires jdk.internal.jvmstat;\n}\n```\n\n可以通过如下命令将其构建为 JLink 包：\n\n```bash\n\
  $ jlink --module-path $JAVA_HOME/jmods/:out  --output bundle/ --add-modules\n  wgjd.discovery\n\
  ```\n\n在我们简单的示例中，我们产生了一个可以以 TAR 包形式交付或封装成 Linux 软件包（如 .deb 或 .rpm）的 JLink 包。我们实际上可以更进一步，使用静态编译将此类包转换为原生可执行文件，但对这的充分讨论超出了本书的范围。\n\
  \n我们应该提个醒：JLink 是一项很棒的技术，但它有一些你应该注意的重要局限性：\n\n* 它仅对具有完全模块化依赖的应用程序有效。\n* 它对非模块化代码不起。\n\
  * 即使是自动模块（automatic modules）也是不够的。\n\n这是因为，为了绝对确保 JRE 的所有必要部分都包含在包中，JLink 依赖于模块图中强声明性的信息，因此每个依赖项都需要一个\
  \ `module-info.class`。没有这些信息，构建精简 JRE 极可能是不安全的。\n\n遗憾的是，在现实世界中，应用程序许多许多库仍然没有完全模块化。这大大降低了\
  \ JLink 的实用性。为了解决这个问题，工具开发者开发了插件，从未模块化的库重新打包并合成“真正的”模块。我们将在第 11 章讨论这些内容。然而，使用这些工具需要使用构建系统。这意味着我们将\
  \ JLink 的真实世界示例推迟到后面，等我们在第 11 章遇到构建工具时。\n\n## 总结\n\n* 模块是 Java 中的一个新概念。它们将包分组并提供关于整个单元、其依赖项及其公共接口的元数据。这些约束由编译器和运行时强制。\n\
  * 模块不是一种部署结构（例如，一种不同的文件格式）。模块化的库和应用程序仍然可以通过 JAR 文件分发并通过标准构建工具下载。\n* 迁移到模块需要改变我们开发\
  \ Java 应用程序的方式。\n    * `module-info.java` 文件中的新语法控制类和方法在模块系统内部的暴露方式。\n    * 类加载器能够感知模块定义的限制，并处理非模块化代码的加载。\n\
  \    * 使用模块进行构建需要新的命令行标记，并对 Java 项目的标准布局进行更改。\n* 模块作为这些工作的回报许多收益。\n    * 因为有了更细粒度的控制，模块是为现代部署和未来可维护性构建应用程序的一种根本上更好的方式。\n\
  \    * 模块是减少占用空间的关键，特别是在容器中。\n    * 模块为其他新功能（如静态编译）铺平了道路。\n* 迁移到模块可能具有挑战性，特别是对于遗留的单体应用程序。即使在第一个模块化运行时发布三年后，其采用率仍然零散且不完整。\n\
  * 诸如多版本 JAR 和紧凑配置等工具可以帮助现有的 Java 8 项目准备好与模块生态系统集成，即使它们现在无法迁移。\n\n# 3 Java 17\n\n\
  本章涵盖：\n\n* 文本块（Text blocks）\n* Switch 表达式（Switch Expressions）\n* 记录（Records）\n*\
  \ 密封类型（Sealed Types）\n\n这些代表了自 Java 11 发布以来（包含 Java 17）Java 语言和平台新增的主要特性。\n\n注意：要理解自\
  \ Java 8 以来 Java 发布方法论的变化，回顾第 1 章或附录 A 中的讨论可能是一个好主意。\n\n除了主要的用户可见的语言升级外，Java 17\
  \ 还包含许多内部改进（特别是性能提升）。然而，本章重点关注我们认为将改变你（开发者）编写 Java 方式的主要特性。\n\n## 3.1 文本块\n\n从 Java\
  \ 1.0 版本开始，开发者一直在抱怨 Java 的字符串。与其他编程语言（如 Groovy、Scala 或 Kotlin）相比，Java 的字符串有时显得有些原始。\n\
  \nJava 历史上只提供了一种字符串类型——简单的双引号字符串，其中某些字符（特别是 `\"` 和 `\\`）必须转义才能安全使用。\n\n文本块项目经过多次迭代作为一项特性引入（我们在第\
  \ 1 章中简要预览了预览特性），现在是 Java 17 的一项特性。它的目标通过允许跨行的字符串字面量来扩展 Java 语法中字符串的概念。反之，这应该避免大多数\
  \ Java 开发者历史上发现的转义序列的需求。\n\n注意：与各种编程语言不同，Java 文本块目前不支持插值，尽管该功能正被考虑包含在未来的版本中。\n\n\
  除了帮助 Java 开发者从处理过度转义字符的痛苦中解放出来，文本块的一个特定目标是允许在 Java 程序中嵌入不是 Java 的可读代码字符串。毕竟，你多经常需要在\
  \ Java 程序中包含 SQL 或 JSON（甚至是 XML）呢？\n\n在 Java 17 之前，这个过程可能是痛苦的，事实上，许多团队转而使用带有其所有额外复杂性的外部模板库。\n\
  \n\n\n\n让我们通过考虑一个 SQL 查询来看看它们是如何运作的。在本章中，我们将使用一些来自金融交易的示例——特别是外汇交易（FX）。可能我们的客户订单存储在一个\
  \ SQL 数据库中，我们将通过如下所示查询来访问它们：\n\n```\nString query = \"\"\"\n        SELECT \"ORDER_ID\"\
  , \"QUANTITY\", \"CURRENCY_PAIR\" FROM \"ORDERS\"\n        WHERE \"CLIENT_ID\" =\
  \ ?\n        ORDER BY \"DATE_TIME\", \"STATUS\" LIMIT 100;\n        \"\"\";\n```\n\
  \n你应该注意到两点。首先，文本块（Text Block）以 `\"\"\"` 序列开始并结束，这在 Java 15 之前是不合法的。其次，文本块可以在每行的开头使用空白字符进行缩进——而这些空白字符将被忽略。\n\
  \n如果我们打印出 `query` 变量，我们将得到完全我们构建的字符串，如下所示：\n\n```\nSELECT \"ORDER_ID\", \"QUANTITY\"\
  , \"CURRENCY_PAIR\" FROM \"ORDERS\"\nWHERE \"CLIENT_ID\" = ?\nORDER BY \"DATE_TIME\"\
  , \"STATUS\" LIMIT 100;\n```\n\n发生这种情况是因为文本块是一个常量表达式（类型为 `String`），与字符串字面量一样。区别在于，`javac`\
  \ 在向类文件中记录常量之前，会对文本块进行处理，如下所示：\n\n1. 行终止符字符会被转换为 LF (`\\u000A`)，即 Unix 换行规范。\n2.\
  \ 移除块周围多余的空白，以便允许 Java 源代码进行额外的缩进（正如我们的示例）。\n3. 块中的任何转义序列都会被解释。\n\n这些步骤按照上述顺序是有原因的。具体来说，最后解释转义序列意味着块可以包含字面转义序列（如\
  \ `\\n`），而它们不会被之前的步骤修改或删除。\n\n注意：运行时，从字面量获取的字符串常量与从文本块获取的完全没有区别。类文件不会以任何方式记录常量的原始来源。\n\
  \n有关文本块的更多细节，请参阅 JEP 378 ([`openjdk.java.net/jeps/378`](https://openjdk.java.net/jeps/378))。让我们继续介绍新的\
  \ Switch 表达式（Switch Expressions）功能。\n\n## 3.2 Switch 表达式\n\n从最早版本开始，Java 就支持 switch\
  \ 语句。Java 在语法上从 C 和 C++ 的形式中汲取了灵感，`switch` 语句也不例外，如下所示：\n\n```\nswitch(month) {\n\
  \  case 1:\n    System.out.println(\"January\");\n    break;\n  case 2:\n    System.out.println(\"\
  February\");\n    break;\n  // ... 等此类推\n}\n```\n\n特别是，Java 的 switch 语句继承了一个属性：如果\
  \ `case` 不以 `break` 结尾，执行将在下一个 `case` 之后继续。这一规则允许对需要相同处理的 `case` 进行分组，如下：\n\n```\n\
  switch(month) {\n  case 12:\n  case 1:\n  case 2:\n    System.out.println(\"Winter,\
  \ brrrr\");\n    break;\n  case 3:\n  case 4:\n  case 5:\n    System.out.println(\"\
  Spring has sprung!\");\n    break;\n  // ... 等此类推\n}\n```\n\n然而，这种情况的便利性也带来了一个黑暗且充满\
  \ Bug 的侧面。漏掉一个 `break` 对新老程序员来说都是一个容易的错误，并且经常引入错误。在我们的示例中，我们会得到错误的答案，因为排除第一个 `break`\
  \ 会导致同时输出冬季和春天的消息。\n\n在尝试捕获值供以后使用时，switch 语句也很笨拙。例如，如果我们想获取该消息并在其他地方使用而不是打印它，我们必须在\
  \ `switch` 之外设置变量，在每个分支中正确设置它，并可能在 `switch` 之后确保我们确实设置了该值；类似于：\n\n```\nString message\
  \ = null;\nswitch(month) {\n  case 12:\n  case 1:\n  case 2:\n    message = \"Winter,\
  \ brrrr\";\n    break;\n  case 3:\n  case 4:\n  case 5:\n    message = \"Spring\
  \ has sprung!\";\n    break;\n  // ... 等此类推\n}\n```\n\n就像漏掉 `break` 一样，我们现在必须确保每个\
  \ `case` 都正确设置了 `message` 变量，否则将来可能会面临 报告。显然，我们可以做得更好。\n\n在 Java 14 中引入的 Switch\
  \ 表达式（JEP 361）提供了解决这些缺陷的替代方案，同时也开启了未来的语言前沿。这一目标包括帮助缩小与更多具函数导向特征的语言（例如 Haskell、Scala\
  \ 或 Kotlin）之间的语言差距。Switch 表达式的第一版本更加简洁，如下所示：\n\n```\nString message = switch(month)\
  \ {\n  case 12:\n  case 1:\n  case 2:\n    yield \"Winter, brrrr\";\n  case 3:\n\
  \  case 4:\n  case 5:\n    yield \"Spring has sprung!\";\n  // ... 等此类推\n}\n```\n\
  \n在这种改进后的形式中，我们不再在每个分支中设置变量。相反，每个 `case` 都使用新的 `yield` 关键字将所需的值返回并赋值给 `String` 变量，而整个表达式会产生一个值——从一个\
  \ case 分支或另一个。\n\n\n\n然而，对于接收接收 `int` 的 Switch 表达式（Switch Expressions），我们必须包含一个\
  \ `default` 子句，因为无法列出所有约四十亿可能的值。\n\nSwitch 表达式也是 Java 未来某个版本中一项重大特性——模式匹配（Pattern\
  \ Matching）的垫脚石，我们将在本章后半部分以及本书的后续部分讨论它。现在，让我们来认识下一个新特性：`Records`。\n\n## 3.3 Records\n\
  \nRecords 是 Java 类的一种新形式，旨在实现以下功能：\n\n*   为纯数据聚合类型提供一等公民的建模手段\n* 填补 Java 类型系统中可能存在的空白\n\
  *   为常见的编程模式提供语言级语法\n* 减少类的样板代码（boilerplate）\n\n这些要点的顺序非常重要，事实上，`Records` 更多地关乎语言语义，而不是减少样板代码和语法（尽管许多开发者倾向于关注后者）。让我们先从\
  \ Java `record` 的基本概念说起。\n\n`Records` 的理念是扩展 Java 语言，创建一种方式来声明一个类是“字段，仅仅是字段，别无别的字段”。通过对我们的类做出这样的声明，编译器可以帮助我们自动创建所有方法，并让所有字段参与到\
  \ `hashCode()` 等方法中。\n\n注意：语义“record 是字段的透明载体”正是定义语法的所在：“访问器方法和其他样板代码是根据 record\
  \ 定义自动派生的。”\n\n为了看到它在日常编程中是如何体现的，请记住对 Java 最常见的抱怨之一是，为了让一个类变得有用，你需要编写大量的代码。我们经常需要编写：\n\
  \n*   `toString()`\n*   `hashCode()` 和 `equals()`\n*   Getter 方法\n*   公共构造函数\n*\
  \   以及等等。\n\n对于简单的领域类（domain classes），这些方法通常是无聊且重复的，属于那种可以轻松机械生成的代码（IDE 通常提供这种功能），但在我们拥有\
  \ `Records` 之前，语言并没有提供任何直接这样做的方法。当我们阅读他人的代码时，这种令人沮丧的差距实际上更加糟糕。例如，作者看起来可能在使用 IDE\
  \ 生成的 `hashCode()` 和 `equals()`，这些方法使用了类中的所有字段，但如果不检查实现的的每一行代码，我们如何能确定呢？如果在重构期间增加了一个字段，而方法没有重新生成，会怎样？\n\
  \n`Records` 解决了这些问题。如果一个类型被声明为 `record`，它就做出了强有声明，编译器和运行时将进行相应的处理。让我们来看看它的实际运行。\n\
  \n为了充分解释这一特性，我们需要一个非平凡的领域示例，因此让我们继续使用外汇交易（FX currency trading）。如果你不熟悉该领域使用的概念，请不要担心——我们将在学习过程中解释你所需要的知识。在书的后半部分，我们将继续以金融示例为主题，所以这是一个开始的好地方。\n\
  \n让我们通过一下如何使用 `Records` 以及其他一些特性来改进我们对领域的建模，从而获得更整洁、不冗余且更简单的代码。考虑一个我们在外汇交易时想要下单的订单。基础订单类型可能包含以下内容：\n\
  \n*   我买入或卖出的单位数量（以百万货币单位为单位）\n*   “方向”——我是买入还是卖（通常称为 `Bid` 和 `Ask`）\n*   我正在交换的货币（货币对\
  \ `currency pair`）\n*   我下单的时间\n*   我的订单在超时前有效多久（存活时间或 `TTL`）\n\n所以，如果我有 100 万英镑，想在下一秒内将其卖出美元，并且我希望每英镑换\
  \ 1.25 美元，那么我就是“现在以 1.25 的价格买入 GBP/USD 比率，有效期 1 秒”。在 Java 中，我们可能会这样声明一个领域类（我们称之为“经典”版，以强调我们目前必须使用类来这样做——更好的方法正在来的路上）：\n\
  \n```java\npublic final class FXOrderClassic {\n    private final int units;\n \
  \   private final CurrencyPair pair;\n    private final Side side;\n    private\
  \ final double price;\n    private final LocalDateTime sentAt;\n    private final\
  \ int ttl;\n\n    public FXOrderClassic(int units, CurrencyPair pair, Side side,\n\
  \                          double price, LocalDateTime sentAt, int ttl) {\n    \
  \    this.units = units;\n        this.pair = pair; // CurrencyPair 是一个简单的枚举\n \
  \       this.side = side; // Side 是一个简单的枚举\n        this.price = price;\n      \
  \  this.sentAt = sentAt;\n        this.ttl = ttl;\n    }\n\n    public int units()\
  \ {\n        return units;\n    }\n\n    public CurrencyPair pair() {\n        return\
  \ pair;\n    }\n\n    public Side side() {\n        return side;\n    }\n\n    public\
  \ double price() {\n        return price;\n    }\n\n    public LocalDateTime sentAt()\
  \ {\n        return sentAt;\n    }\n\n    public int ttl() {\n        return ttl;\n\
  \    }\n\n    @Override\n    public boolean equals(Object o) {\n        if (this\
  \ == o) return true;\n        if (o == null || getClass() != o.getClass()) return\
  \ false;\n\n        FXOrderClassic that = (FXOrderClassic) o;\n\n        if (units\
  \ != that.units) return false;\n        if (Double.compare(that.price, price) !=\
  \ 0) return false;\n        if (ttl != that.ttl) return false;\n        if (pair\
  \ != that.pair) return false;\n        if (side != that.side) return false;\n  \
  \      return sentAt == that.sentAt;\n    }\n\n    @Override\n    public int hashCode()\
  \ {\n        int result;\n        long temp;\n        result = units;\n        result\
  \ = 31 * result + (pair != null ? pair.hashCode() : 0);\n        result = 31 * result\
  \ + (side != null ? side.hashCode() : 0);\n        temp = Double.doubleToBits(price);\n\
  \        result = 31 * result + (int) (temp >>> 32);\n        result = 31 * result\
  \ + (sentAt != null ? sentAt.hashCode() : 0);\n        result = 31 * result + ttl;\n\
  \        return result;\n    }\n\n    @Override\n    public String toString() {\n\
  \        return \"FXOrderClassic{\" +\n                \"units=\" + units +\n  \
  \              \", pair=\" + pair +\n                \", side=\" + side +\n    \
  \            \", price=\" + price +\n                \", sentAt=\" + sentAt +\n\
  \                \", ttl=\" + ttl +\n                '}';\n    }\n}\n```\n\n这是大量的代码，但这意味着我们可以这样创建订单：\n\
  \n```java\nvar order = new FXOrderClassic(1, CurrencyPair.GBPUSD, Side.Bid, 1.25,\
  \ LocalDateTime.now(), 1000);\n```\n\n但声明这个类的代码到底需要多少？在旧的 Java 版本中，大多数开发者可能只会声明字段，然后使用\
  \ IDE 自动生成所有方法。让我们看看 Records 是如何改进这种情况的。\n\n注意：Java 没有提供除定义类之外的任何方式来讨论数据聚合，因此任何包含“仅仅是字段”的类型将是一个类。\n\
  \n新概念是 *record 类*（通常直接称为 record）。它是一个不可变的（在 Java 通常的“所有字段均为 final”意义上）固定一组值的透明载体，这些值被称为\
  \ record 组件（components）。每个组件都会产生一个持有所提供值的 final 字段和一个用于检索该值的访问器方法。字段名和访问器名与组件名称相同。\n\
  \n字段列表提供了 record 的状态描述。在普通类中，字段 `x`、构造函数参数 `x` 和访问器 `x()` 之间可能没有关系，但在 record 中，它们*根据定义*讨论的是同一个东西——record\
  \ *就是*它的状态。\n\n\n\n为了允许我们创建 record 类的新实例，系统还会生成一个构造函数——称为`规范构造函数`（canonical constructor）——它的参数列表与声明的状态描述完全匹配。Java\
  \ 语言现在还提供了用于声明 Record 的简洁语法，其中程序员只需要声明组成 record 的组件名称和类型，如下所示：\n\n```\npublic record\
  \ FXOrder(int units,\n                      CurrencyPair pair,\n               \
  \       Side side,\n                      double price,\n                      LocalDateTime\
  \ sentAt,\n                      int ttl) {}\n```\n\n通过编写这个 record 声明，我们不仅节省了某些输入工作，还做了一个更强大、更语义化的声明。`FXOrder`\
  \ 类型*就是*所提供的状态，而任何实例*仅仅*是字段值的透明聚合。\n\n如果现在我们用 `javap` 检查类文件（我们将在第 4 章详细介绍它），我们可以看到编译器为我们自动生成了一系列样板代码：\n\
  \n```\n$ javap FXOrder.class\nCompiled from \"FXOrder.java\"\npublic final class\
  \ FXOrder extends java.lang.Record {\n  public FXOrder(int, CurrencyPair, Side,\n\
  \                 double, java.time.LocalDateTime, int);\n\n  public java.lang.String\
  \ toString();\n  public final int hashCode();\n  public final boolean equals(java.lang.Object);\n\
  \  public int units();\n  public CurrencyPair pair();\n  public Side side();\n \
  \ public double price();\n  public java.time.LocalDateTime sentAt();\n  public int\
  \ ttl();\n}\n```\n\n这看起来与我们在基于类的实现中必须手动编写的那组方法非常相似。事实上，构造函数和访问器方法的行为与之前完全相同。然而，`toString()`\
  \ 和 `equals()` 等方法使用了一种可能会让某些开发者感到意外的实现，如下：\n\n```\npublic java.lang.String toString();\n\
  \    Code:\n       0: aload_0\n       1: invokedynamic #51,  0            // InvokeDynamic\
  \ #0:toString:\n                                           // (LFXOrder;)Ljava/lang/String;\n\
  \       6: arereturn\n```\n\n也就是说，`toString()` 方法（以及 `equals()` 和 `hashCode()`）是通过基于\
  \ `invokedynamic` 的机制实现的。这是一种强大的技术，我们将在本书后面会遇到（第 4 章和第 16 章）。\n\n我们还可以看到有一个新类 `java.lang.Record`，它将作为所有\
  \ record 类的类型。它是抽象的，并声明 `equals()`、`hashCode()` 和 `toString()` 为抽象方法。`java.lang.Record`\
  \ 类不能被直接扩展，我们可以通过尝试编译下面的代码看到：\n\n```\npublic final class FXOrderClassic extends\
  \ Record {\n    private final int units;\n    private final CurrencyPair pair;\n\
  \    private final Side side;\n    private final double price;\n    private final\
  \ LocalDateTime sentAt;\n    private final int ttl;\n\n    // ... 其他代码省略\n}\n```\n\
  \n编译器将拒绝这种尝试：\n\n```\n$ javac FXOrderClassic.java\nFXOrderClassic.java:3: error:\
  \ records cannot directly extend Record\npublic final class FXOrderClassic extends\
  \ Record {\n             ^\n1 error\n```\n\n获取 record 的唯一方法是显式地声明它并让 `javac` 创建类文件。这也确保了所有的\
  \ record 类都被创建为 `final` 类。\n\n除了方法的自动生成和样板代码的减少，其他几个核心 Java 特性在应用于 Records 时也具有特殊性质。首先，Records\
  \ 必须遵守关于 `equals()` 方法的特殊约定：如果一个 record `R` 具有组件 `c1`、`c2`...`cn`，并且如果 record 实例如下被拷贝：\n\
  \n```\nR copy = new R(r.c1(), r.c2(), ..., r.cn());\n```\n\n那么 `r.equals(copy)`\
  \ 必须为 `true`。注意，这个不变性是在通常关于 `equals()` 和 `hashCode()` 的熟悉约定之外的额外——它并没有取代它。\n\n现在，让我们谈谈\
  \ Records 功能的一些更多设计层面的方面。为了这一点，回顾 Java 中枚举（enum）的工作原理很有帮助。Java 中的枚举是一种特殊形式的类，它实现了一种设计模式（*有限数量的类型安全实例*），但语法开销极小——编译器为我们生成了大量代码。\n\
  \n同样，Java 中的 record 是一种特殊形式的类，它以最小的语法实现了一种模式（*数据载体*，又*仅持有字段*）。我们预期的所有样板代码都由编译器为我们自动生成。然而，尽管仅仅持有字段的数据载体类的简单概念在直觉上是合理的，但它在细节上意味着什么呢？\n\
  \n在最初讨论 Records 时，考虑了许多可能的不同设计。例如：\n\n*   POJO 的样板代码减少\n*   Java Beans 2.0\n*  \
  \ 命名元组（Named tuples）\n*   积类型（*代数数据类型*的一种形式）\n\nBrian Goetz 在最初的设计草稿（[`mng.bz/M5j8`](http://mng.bz/M5j8)）中详细讨论了这些可能性。每个设计选项都随着\
  \ Records 设计中心选择而产生的额外次要问题，例如：\n\n*   Hibernate 能够代理它们吗？\n*   它们与经典的 Java Beans\
  \ 完全兼容吗？\n*   它们支持名称擦除/“形状可变性”吗？\n*   它们会带有模式匹配和解构吗？\n\n基于上述任何一种方法来构建 Records 功能都是合理的——每种方法都有优缺点。然而，最终的设计决策是\
  \ Records 是*命名元组*。这一决定部分源于 Java 类型系统中的一个核心思想——*命名类型*。\n\n### 3.3.1 命名类型\n\n静态类型的命名方法观点是：每个\
  \ Java 存储单元（变量、字段）都有确定的类型，并且每个类型都有一个（至少是对人类有意义的）名称。即使在匿名类的情况下，类型仍然名称——只是编译器分配了名称，而这些名称在\
  \ Java 语言中无效（但在 JVM 内部有效）。例如，我们可以在 jshell 中看到这一点：\n\n```\njshell> var o = new Object()\
  \ {\n   ...>   public void bar() { System.out.println(\"bar!\"); }\n   ...> }\n\
  o ==> $0@37f8bb67\n\njshell> var o2 = new Object() {\n   ...>   public void bar()\
  \ { System.out.println(\"bar!\"); }\n   ...> }\no2 ==> $1@31cefde0\n\njshell> o\
  \ = o2;\n|  Error:\n|  ...\n```\n\n注意，尽管匿名类的声明方式完全相同，编译器仍然生成了两个不同的匿名类，`$0` 和 `$1`，并且不允许赋值，因为在\
  \ Java 类型系统中，变量的类型不同。\n\n注意，在其他（非 Java）语言中，类的整体形状（例如它拥有哪些字段和方法）可以作为类型（而不是显式的类型名称）。这被称为*结构化类型*。如果\
  \ Records 破坏了 Java 的传统并引入了结构化类型，那将是一个巨大的变化。结果，“Records 是命名元组”的设计选择意味着，我们预计 Records\
  \ 在我们可能在其他语言中使用元组的地方效果最好。这包括诸如复合映射键或模拟方法返回多个值等用例。一个复合映射键的可能如下所示：\n\n```\nrecord\
  \ OrderPartition(CurrencyPair pair, Side side) {}\n```\n\n相反，Records 不一定能很好作为当前使用\
  \ Java Beans 的代码的替代方案。有许多原因，特别是 Java Beans 是可变的而 Records 不是，并且它们的访问器命名规范也不同。\n\n\
  \n\n记录（Records）确实允许在简单的单行声明形式之外提供额外的灵活性，因为它们是真正的类。具体而言，开发者可以在自动生成的默认项之外定义额外的方法、构造函数和静态字段。然而，这些功能应当谨慎使用。请记住，`Records`\
  \ 的设计意图是允许开发者将相关的字段分组为一个单一的不可变数据项。\n\n记录可能会创建的额外方法的一个示例是：使用静态工厂方法来为某些记录参数模拟默认值。另一个示例可能是一个\
  \ `Person` 类（带有不可变的出生日期），它可能会定义一个 `currentAge()` 方法。\n\n一个通用的经验法是：越想向基础数据载体（Data\
  \ Carrier）中添加大量额外方法等（或让它实现多个接口）这种诱惑越大，那么就越可能应该使用完整类，而不是记录。\n\n### 3.3.2 紧凑记录构造函数\
  \ (Compact record constructors)\n\n“简单性/完整类”经验法则中一个重要的例外是使用`紧凑构造函数`（compact constructors），语言规范对其描述如下：\n\
  \n> 记录类紧凑构造函数的的形式化参数是隐式声明的。它们由记录类的派生形式参数列表提供。\n>\n> 紧凑构造函数声明的意图是：规范构造函数的体内仅提供验证和/或归一化代码；其余初始化代码由编译器提供。\n\
  > —Java 语言规范\n\n例如，我们可能想要对订单进行验证，确保它们不会尝试购买或出售负数量，或设置无效的生存时间，如下所示：\n\n```\npublic\
  \ record FXOrder(int units, CurrencyPair pair, Side side,\n                    \
  \  double price, LocalDateTime sentAt, int ttl) {\n    public FXOrder {\n      \
  \  if (units < 1) {\n            throw new IllegalArgumentException(\n         \
  \           \"FXOrder units must be positive\");\n        }\n        if (ttl < 0)\
  \ {\n            throw new IllegalArgumentException(\n                    \"FXOrder\
  \ TTL must be positive, or 0 for market orders\");\n        }\n        if (price\
  \ <= 0.0) {\n            throw new IllegalArgumentException(\n                 \
  \   \"FXOrder price must be positive\");\n        }\n    }\n}\n```\n\nJava `Records`\
  \ 相比其他语言中的匿名元组（tuples）的一个优势是，记录的构造函数体允许在创建 `Records` 时运行代码。这允许进行验证（并在传递了无效状态时抛出异常）。这在纯结构化的元组中是不行的。\n\
  \n在记录体内部使用静态工厂方法可能也是意义的，例如为了绕过 Java 缺乏默认参数值的问题。在我们的交易示例中，我们可能会包含这样一个静态工厂：\n\n```\n\
  public static FXOrder of(CurrencyPair pair, Side side, double price) {\n    var\
  \ now = LocalDateTime.now();\n    return new FXOrder(1, pair, side, price, now,\
  \ 1000);\n}\n```\n\n以便声明一种使用默认参数创建订单的快速方法。当然，这也可以声明为一种替代构造函数。开发者应该根据具体情况选择哪种方法更合理。\n\
  \n替代构造函数的另一个用途是创建用于复合 map 键的 `Records`，如下例：\n\n```\nrecord OrderPartition(CurrencyPair\
  \ pair, Side side) {\n    public OrderPartition(FXOrder order) {\n        this(order.pair(),\
  \ order.side());\n    }\n}\n```\n\n类型 `OrderPartition` 然后可以轻松地用作 map 键。例如，我们可能想为我们的交易撮合引擎构建一个订单簿，如下所示：\n\
  \n```\npublic final class MatchingEngine {\n    private final Map<OrderPartition,\
  \ RankedOrderBook> orderBooks =\n                                              \
  \              new TreeMap<>();\n\n    public void addOrder(final FXOrder o) {\n\
  \        orderBooks.get(new OrderPartition(o)).addAndRank(o);\n        checkForCrosses(o.pair());\n\
  \    }\n\n    public void checkForCrosses(final CurrencyPair pair) {\n        //\
  \ 现在是否有买单与卖单匹配？\n    }\n\n    // ...\n}\n```\n\n现在，当接收到新订单时，`addOrder()` 方法会提取出相应的订单分区（由货币对和买/卖边的元组组成），并使用它将新订单添加到按价格排序的订单簿中。新订单可能会与簿中已有的订单匹配（这被称为订单“撮合”），因此我们需要在\
  \ `checkForCrosses()` 方法中检查是否发生。\n\n有时我们可能不想使用紧凑构造函数，而是使用一个完整的、显式的规范构造函数。这标志着我们需要在构造函数执行实际工作——而对于简单的数据载体类来说，这种需求的用例很少。然而，对于某些情况，例如需要对传入参数进行防御性拷贝（defensive\
  \ copies），这是必要的。因此，编译器允许显式规范构造函数的可能性——但在使用这种方法之前请务必仔细考虑。\n\n`Records` 被设计为简单的数据载体，它是元组的一种版本，以逻辑且一致的方式融入\
  \ Java 现有的类型系统中。这将有助于许多应用程序使领域类更加清晰、更精简。它还将帮助团队消除许多底层模式的手写实现。它还应该减少或消除对如 `Lombok`\
  \ 等库的需求。\n\n许多开发者在开始使用 `Records` 时已经报告了显著的改进。它们与 Java 17 引入的另一个新特性——密封类型（Sealed\
  \ Types）结合得非常好。\n\n## 3.4 密封类型 (Sealed Types)\n\nJava 的 `enums` 是一个广为人知的语言特性。它们允许程序员建模有限的替代方案，代表类型所有可能的值——实际上是类型安全的常量。\n\
  \n为了继续我们的交易示例，让我们考虑一个 `OrderType` 枚举来表示不同类型的订单：\n\n```\nenum OrderType {\n    MARKET,\n\
  \    LIMIT\n}\n```\n\n这代表了两种可能的交易订单类型：一种以任何价格成交的*市价*订单，另一种是在特定价格可用时才执行的*限价*订单。平台通过让\
  \ Java 编译器自动生成一种特殊的类类型来实现枚举。\n\n注意 运行时处理库类型 `java.lang.Enum`（所有枚举类直接继承自它）的方式与其他类相比略有不同，但这些细节在这里不需要考虑。\n\
  \n让我们反编译这个枚举，看看编译器生成了什么：\n\n```\n$ javap -c -p OrderType.class\nfinal class OrderType\
  \ extends java.lang.Enum<OrderType> {\n  public static final OrderType MARKET;\n\
  \n  public static final OrderType LIMIT;\n\n  ...\n  // 私有构造函数\n}\n```\n\n在类文件中，枚举的所有可能值都被定义为\
  \ `public` `static final` 变量，且构造函数是私有的，因此无法构造额外的实例。\n\n实际上，枚举类似于单例模式的泛化，区别在于它不是类中只有一个实例，而是有有限数量的实例。这种模式非常有用，特别是因为它给了我们一个*完备性*（exhaustiveness）的概念——给定一个非空的\
  \ `OrderType` 对象，我们可以确定它要么是 `MARKET` 实例，要么是 `LIMIT` 实例。\n\n\n\n然而，假设我们想在 `Java 11`\
  \ 中模拟许多不同的订单。我们必须在两个并不理想的方案之间进行选择。首先，我们可以选择一个单一的实现类（或记录）`FXOrder`，并带有一个持有实际类型的状态字段。这种模式之所以有效，是因为状态字段的类型是\
  \ `enum`，它提供了指示该特定对象实际是指哪种类型的位。这显然不是最优解，因为这要求应用程序程序员去跟踪本该属于类型系统关注范围的位。另一种方案是声明一个抽象基类\
  \ `BaseOrder`，并让具体类型 `MarketOrder` 和 `LimitOrder` 派生于它。\n\n这里的问题在于，Java 一直以来被设计为一种默认可扩展的开放语言。类是在某一次被编译的，而子类可以在几年（甚至几十年）后才被编译。到\
  \ `Java 11` 为止，Java 语言中允许的唯一类继承结构只有开放式继承（默认）和不继承（`final`）。\n\n类可以声明包私有有构造函数，这实际上意味着“只能被同包内的类扩展”，但运行时没有任何机制阻止用户在不属于平台的包中创建新类，因此这充其量是不完全的保护。\n\
  \n如果我们定义了一个 `BaseOrder` 类，那么没有任何能阻止第三方创建一个继承自 `BaseOrder` 的 `EvilOrder` 类。更糟糕的是，这种意外的扩展可以在\
  \ `BaseOrder` 类型编译后的几年（甚至几十年）之后发生，这是非常不受欢迎的。\n\n结论是，直到目前，开发者一直受到限制，如果他们想要面向未来，就必须使用一个字段来持有\
  \ `BaseOrder` 的实际类型。`Java 17` 改变了局面，允许通过一种更细粒度控制继承的方法：**密封类型（sealed type）**。\n\n\
  注意：这种能力在其他几种编程语言中以各种形式存在，并且在近年来变得有些流行，尽管它实际上是一个非常老老的想法。\n\n在 Java 的实现中，“密封”表达的概念是：一个类型可以被扩展，但只能由已知的子类型列表扩展，不能有其他类型。让我们通过一个简单的\
  \ `Pet` 类示例来看这种新语法（我们稍后会回到 FX 示例）：\n\n```\npublic abstract sealed class Pet {\n\
  \    private final String name;\n\n    protected Pet(String name) {\n        this.name\
  \ = name;\n    }\n\n    public String name() {\n        return name;\n    }\n\n\
  \    public static final class Cat extends Pet {\n        public Cat(String name)\
  \ {\n            super(name);\n        }\n\n        void meow() {\n            System.out.println(name()\
  \ +\" meows\");\n        }\n    }\n\n    public static final class Dog extends Pet\
  \ {\n        public Dog(String name) {\n            super(name);\n        }\n\n\
  \        void bark() {\n            System.out.println(name() +\" barks\");\n  \
  \      }\n    }\n}\n```\n\n类 `Pet` 被声明为 `sealed`，这在之前的 Java 中并不是一个被允许的关键字。在没有限定的情况下，`sealed`\
  \ 意味着该类只能在当前的编译单元内扩展。因此，子类必须嵌套在当前类内部，或者在源文件中是非公开的。我们还将 `Pet` 声明为 `abstract`，因为我们不需要任何通用的\
  \ `Pet` 实例，只需要 `Pet.Cat` 和 `Pet.Dog` 对象。这为我们提供了一种很好的方式来来实现我们之前描述的面向对象（OO）建模模式，而没有具有我们讨论过的那些缺点。\n\
  \n密封也可以用于接口，而且接口形式在实践中的应用可能比类形式更广泛。让我们看看当我们想要使用密封来帮助建模不同类型的 FX 订单会发生什么：\n\n```\n\
  public sealed interface FXOrder permits MarketOrder, LimitOrder {\n    int units();\n\
  \    CurrencyPair pair();\n    Side side();\n    LocalDateTime sentAt();\n}\n\n\
  public record MarketOrder(int units,\n                          CurrencyPair pair,\n\
  \                          Side side,\n                          LocalDateTime sentAt,\n\
  \                          boolean allOrNothing) implements FXOrder {\n\n    //\
  \ 省略构造函数和工厂方法\n}\n\npublic record LimitOrder(int units,\n                      \
  \   CurrencyPair pair,\n                         Side side,\n                  \
  \       LocalDateTime sentAt,\n                         double price,\n        \
  \                 int ttl) implements FXOrder {\n\n    // 省略构造函数和工厂方法\n}\n```\n\n\
  这里有几点需要注意。首先，`FXOrder` 现在是一个 `sealed` 接口。其次，我们可以看到另一个新关键字 `permits`，它允许开发者列出该密封接口允许的实现——而我们的实现是\
  \ Records。\n\n注意：当你使用 `permits` 时，实现类不必存在于同一个文件中，可以是相互独立的编译单元。\n\n最后，我们得到了一个很棒的奖励——因为\
  \ `MarketOrder` 和 `LimitOrder` 是真正的类，它们可以拥有特定于其类型的行为。例如，市价订单只需立即获取可用的最佳价格，不需要指定价格。另一方面，限价订单需要指定订单接受的价格，以及它准备等待多久来尝试实现该价格（存活时间或\
  \ `TTL`）。如果我们使用一个字段来指示对象的“真实类型”，这将变得不再直观，因为所有子类型的所有方法都必须存在于基类型中，或者将迫使我们使用丑陋的向下转型。\n\
  \n如果我们现在用这些类型进行编程，我们知道所遇到的任何 `FXOrder` 实例要么是 `MarketOrder`，要么是 `LimitOrder`。此外，编译器可以使用此信息。库代码现在可以安全地假设这一点，而且这不会被客户端代码违反。\n\
  \nJava 的 OO 模型表示了类型之间的两个基本概念。具体来说，`\"Type` `X IS-A Y\"` 和 `\"Type` `X HAS-A Y\"\
  `密封类型表示了一个在 Java 中无法建模的面向对象概念：`\"Type` `X IS-EITHER-A Y OR Z\"`。或者，它们也可以被认为是：\n\n\
  *   `final` 和 `open` 类之间的折中方案\n*   应用于类型而非实例的枚举模式\n\n从面向对象理论的角度来看，它们表示了一种新的正式关系，因为\
  \ `o` 可能类型的集合是 `Y` 和 `Z` 的并集。因此，这在各种语言中被称为联合类型（union type）或和类型（sum type），但不要混淆——它们与\
  \ C 语言的 `union` 不同。\n\n例如，Scala 程序员可以使用 case 类和自己的 `sealed` 关键字来实现类似的想法（我们稍后会遇到\
  \ Kotlin 对这一点的看法）。\n\n除了 JVM 之外，Rust 语言也提供了不交联合（disjoint union）类型的概念，尽管它使用 `enum`\
  \ 关键字引用它们，这对于 Java 程序员来说可能是*极其*困惑的。在函数式编程世界，某些语言（如 Haskell）提供了一种名为代数数据类型（algebraic\
  \ data types）的功能，其中和类型是一个特例。事实上，密封类型和记录的组合为 Java 17 提供了该功能的版本。\n\n从表面上看，这些类型似乎是\
  \ Java 中一个全新的概念，但它们与枚举的深度相似性为许多 Java 程序员提供了一个良好的起点。事实上，类似于这些类型的东西已经存在于一个地方：多重 catch\
  \ 子句中异常参数的类型。\n\n来自 Java 语言规范（JLS 11，第 14.20 节）：\n\n```\n异常参数的声明类型，如果将其类型标记为与选项\
  \ D1 | D2 | ... | Dn 的联合，则是 lub(D1, D2, ..., Dn)。\n```\n\n\n\n然而，在多捕（multicatch）的情况下，真实的联合类型无法写为局部变量的类型——它是不可表示的（`nondenotable`）。在多捕获的情况下，我们无法创建一个类型为真实联合类型的局部变量。\n\
  \n关于 Java 的密封类型（Sealed Types），我们还需要说明最后一点：它们必须有一个所有允许类型都继承的基类（或所有允许类型都必须实现的公共接口）。无法表示一个“是\
  \ String 或 Integer”的类型，因为 `String` 和 `Integer` 类型除 `Object` 之外没有共同的继承关系。\n\n注意：某些其他语言允许构建通用联合类型，但在\
  \ Java 中这是无法行的。\n\n让我们继续讨论 Java 17 交付的另一个新语言特性——`instanceof` 关键字的新形式。\n\n## 3.5\
  \ instanceof 的新形式\n\n尽管 `instanceof` 自从 Java 1.0 以来就是语言的一部分，但它有时会受到一些 Java 开发者的负面评价。在它最简单的形式中，它提供了一个简单的测试：如果值\
  \ `x` 可以赋值给类型为 `Y` 的变量，则 `x` `instanceof` `Y` 返回 `true`，否则返回 `false`（尽管 `null` `instanceof`\
  \ `Y` 对于任何 `Y` 都是 `false`）。\n\n这种定义被嘲笑为破坏了面向对象的设计，因为它意味着对象类型以及可能的参数类型选择上缺乏精确性。然而，在实践中，在某些场景下，开发者必须面对一个在编译时类型完全类型的对象。例如，考虑一个通过反射获取的、且对其几乎一无所知的对象。\n\
  \n在这种情况下，适当的做法是使用 `instanceof` 检查类型是否符合预期，然后执行向下转型。`instanceof` 测试提供了一个守器条件，确保强制转换在运行时不会导致\
  \ `ClassCastException`。生成的代码如下所示：\n\n```\nObject o = // ...\nif (o instanceof String)\
  \ {\n    String s = (String)o;\n    System.out.println(s.length());\n} else {\n\
  \    System.out.println(\"Not a String\");\n}\n```\n\n从开发者的角度来看，Java 17 中提供的新 `instanceof`\
  \ 能力非常简单——它仅仅提供了一种避免强制转换的方法，如下所示：\n\n```\nif (o instanceof String s) {\n    System.out.println(s.length());\
  \                           ❶\n} else {\n    System.out.println(\"Not a String\"\
  );                       ❷\n}\n\n// 正 其他代码                                     \
  \         ❸\n```\n\n❶ s 在此分支的作用域内。\n\n❷ s 在“else”分支上不在作用域内。\n\n❸ 一旦 if 语句结束，s 不在作用域内。\n\
  \n然而，尽管这看起来并不重要，但从该特性的 JEP 命名中我们获得了一个重要的线索。JEP 394 的标题为“instanceof 的模式匹配（Pattern\
  \ Matching for instanceof）”，它引入了一个新概念——模式（`pattern`）。\n\n注意：非常重要的一点是，理解这种*模式匹配*的用法与文本处理和正则表达式中的用法不同。\n\
  \n在这种语境下，模式是以下两者的结合：\n\n1. 应用于值的谓词（又称测试）\n2. 一组局部变量，称为*模式变量*（pattern variables），它们将从值中被提取出来\n\
  \n关键点在于，只有当谓词成功应用于值时，模式变量才会被提取。\n\n在 Java 17 中，`instanceof` 运算符已扩展为可以接受类型或`类型模式`（`type\
  \ pattern`），其中类型模式由一个指定类型的谓词以及单个模式变量组成。\n\n注意：我们将在下一节更详细地介绍类型模式。\n\n目前来看，升级后的 `instanceof`\
  \ 似乎并不十分重大，但这是 Java 语言中首次看到模式，而且正如我们将看到的，还会有更多用法出现！这仅仅是第一步。\n\n在完成对 Java 17 新语言特性的巡检后，是时候展望未来并回到预览特性（preview\
  \ features）的主题了。\n\n## 3.6 模式匹配与预览特性\n\n在第 1 章中，我们介绍了预览特性的概念，但我们无法提供一个好的例子，因为 Java\
  \ 11 没有任何预览特性！现在我们谈论 Java 17，可以继续讨论了。\n\n事实上，我们在本章中遇到的所有新语言特性，包括 Switch 表达式（Switch\
  \ Expressions）、Records 和密封类型（Sealed Types），都经历了相同的生命周期。它们最初作为预览特性开始，经过一轮或多轮公开预览，最后作为最终特性交付。例如，密封类在\
  \ Java 15 中进行过预览，在 16 中再次预览，最后在 Java 17 LTS 中作为最终特性交付。\n\n在本节中，我们将遇到一个预览特性，该特性将模式匹配从\
  \ `instanceof` 扩展到 `switch`。Java 17 包含了该特性的版本，但仅作为第一个预览版本（关于预览特性的更多细节请参见第 1 章）。语法在最终发布之前可能会发生变化（该特性可能被撤销，尽管对于模式匹配来说这极不可能）。\n\
  \n看看如何在简单案例中使用模式匹配来改进某些处理未知类型对象的代码。我们可以使用 `instanceof` 的新形式来编写如下的安全代码：\n\n```\n\
  Object o = // ...\n\nif (o instanceof String) {\n    String s = (String)o;\n   \
  \ System.out.println(s.length());\n} else {\n    System.out.println(\"Not a String\"\
  );\n}\n```\n\n但这样做很快就会变得臃肿且冗长。相反，我们可以将类型模式引入 `switch` 表达式，正如我们已有的简单 `instanceof`\
  \ 表达式。在当前（Java 17）预览特性的语法中，我们可以将之前的代码重写为简单形式：\n\n```\nvar msg = switch (o) {\n \
  \   case String s      -> \"String of length:\"+ s.length();\n    case Integer i\
  \     -> \"Integer:\"+ i;\n    case null, default -> \"Not a String\";         \
  \    ❶\n};\nSystem.out.println(msg);\n```\n\n❶ Null 现在可以作为标签以防止出现 NullPointerException。\n\
  \n对于想要尝试此类代码的开发者，我们应该解释如何使用预览特性构建和运行。如果我们尝试编译使用预览特性的示例代码，将得到如下所示错误：\n\n```\n$ javac\
  \ ch3/Java17Examples.java\nch3/Java17Examples.java:68: error: switch 中的模式是\n  预览特性且默认禁用。\n\
  \n            case String s -> \"String of length:\"+ s.length();\n            \
  \     ^\n  (使用 --enable-preview 来启用 switch 中的模式)\n1 error\n```\n\n编译器友好地提示可能需要启用预览特性，因此我们在启用标志后重试：\n\
  \n```\n$ javac --enable-preview -source 17 ch3/Java17Examples.java\nNote: ch3/Java17Examples.java\
  \ 使用 Java SE 17 的预览特性。\nNote: 编译时使用 -Xlint:preview 查看详情。\n```\n\n运行时的情况也类似：\n\n\
  ```\n$ java ch3.Java17Examples\nError: 加载主类 ch3.Java17Examples 时发生错误\n    java.lang.UnsupportedClassVersionError:\
  \ 未启用预览特性\n  对于 ch16/Java17Examples (类文件版本 61.65535)。尝试运行\n  '--enable-preview'\n\
  ```\n\n最后如果我们包含了预览标志，代码最终就可以运行了：\n\n```\n$ java --enable-preview ch13.Java17Examples\n\
  ```\n\n\n\n需要不断启用预览功能（preview features）是一件令人痛苦的事，但其设计是为了防止开发者将使用未完成功能的代码泄露到生产环境并引发问题。同样，重要的是，当我们尝试在不带运行时标志的情况下运行包含预览功能的类时，会出现关于类文件版本的提示信息。如果我们显式地使用预览功能进行编译，我们得到的将不是标准的类文件，而大多数团队都不应该在生产环境中运行此类代码。\n\
  \nJava 17 中模式匹配（Pattern Matching）的预览版还具有与密封类型（Sealed Types）紧密集成的功能。具体来说，模式可以利用密封类型提供的可能类型具有排他性的事实。例如，在处理\
  \ FX 订单响应时，我们可能会有如下基础类型：\n\n```java\npublic sealed interface FXOrderResponse\n \
  \       permits FXAccepted, FXFill, FXReject, FXCancelled {\n    LocalDateTime timestamp();\n\
  \    long orderId();\n}\n```\n\n我们可以将其与 switch 表达式和类型模式结合，编写出如下代码：\n\n```java\n\
  FXOrderResponse resp = // ... 来自市场的响应\nvar msg = switch (resp) {\n    case FXAccepted\
  \ a  -> a.orderId() + \" Accepted\";\n    case FXFill f      -> f.orderId() + \"\
  \ Filled \"+ f.units();\n    case FXReject r    -> r.orderId() + \" Rejected: \"\
  + r.reason();\n    case FXCancelled c -> c.orderId() + \" Cancelled\";\n    case\
  \ null          -> \"Order is null\";\n};\nSystem.out.println(msg);\n```\n\n请注意\
  \ a) 我们显式地包含了一个 `case null` 以确保这段代码是空安全的（且不会抛出 `NullPointerException`），以及 b) 我们不需要\
  \ `default` 分支。第二点的原因是编译器可以检查 `FXOrderResponse` 的所有允许的子类型，并得出该模式匹配是“全备的”（total），它涵盖了可能发生的每一种情况，因此在任何情况下\
  \ `default` 分支都是死代码。在匹配不全备且某些情况未被覆盖的情况下，则需要 `default` 分支。\n\n第一个预览特性还包含了*守卫模式*（guarded\
  \ patterns），它允许为模式装饰上一个布尔守卫条件，因此只有当模式谓词和守卫条件都为真时，整体模式才会匹配。例如，假设我们只想查看大额成交订单的详情。我们可以将上一个示例中的\
  \ `fill` 情况更改为如下代码：\n\n```java\ncase FXFill f && f.units() < 100 -> f.orderId()\
  \ + \" Small Fill\";\ncase FXFill f                    -> f.orderId() + \" Fill\
  \ \"+ f.units();\n```\n\n请注意，更具体的情况（小于 100 个单位的小订单）会先测试，只有当它测试失败时，匹配才会尝试下一个情况，即未加守卫的成交匹配。模式变量在任何守卫条件下也已经处于作用域内。我们将在第\
  \ 18 章讨论 Java 的未来时回到模式匹配话题，并讨论一些没能及时赶上 Java 17 发布的功能。\n\n## 总结\n\n*   Java 17 引入了许多新功能，开发者可以在自己的代码中利用这些功能：\n\
  \    *   用于多行字符串的文本块（Text Blocks）。\n    *   用于更现代 switch 体验的 switch 表达式（Switch Expressions）。\n\
  \    *   作为数据透明载体的记录（Records）。\n    *   密封类型（Sealed Types）——一个重要的全新面向对象建模概念。\n \
  \   *   模式匹配（Pattern Matching）——尽管在 Java 17 时尚未完全交付，但它清晰地展示了该语言在未来版本的发展方向。\n\n#\
  \ 第二部分。底层原理\n\n书的这部分关于探索 JVM *实际上*是如何工作的。你将从检查类加载开始。许多 Java 开发者并不真正理解 JVM 它是如何加载、链接和验证类的。这导致由于某种类加载器冲突而执行了“错误”版本的类时，会产生挫败感并浪费时间。\n\
  \n能够深入研究 Java 类文件及其包含的字节码是一项强大的调试技能。你将看到如何使用 `javap` 来导航并理解字节码的含义。\n\n接下来，你将应对硬件领域正在发生的多核\
  \ CPU 革命。一个基础扎实的 Java 开发者需要意识到 Java 的并发能力。第 5 章和第 6 章将教你如何充分利用现代处理器的性能。首先，你将查看并发理论以及\
  \ Java 自 2006 年（Java 5）以来用于并发编程的构建模块。你将学习到 Java 内存模型（Java Memory Model）以及线程和并发在该模型中是如何实现的。\n\
  \n一旦你掌握了一些理论，我们将引导你学习 `java.util.concurrent` 包的特性，该包为并发 Java 的实际开发提供了现代化的数据结构。\n\
  \n性能调优通常被视为门艺术而非科学，追踪并修复性能问题通常需要开发团队花费额外的时间和精力。在第 7 章（本部分的最后一章）中，我们将教你去测量而不是猜测，并告诉你“根据经验进行调优”是错误的。你将学习一种科学的方法，能够快速带你直达性能问题的核心。\n\
  \n特别地，我们关注垃圾回收（GC）和即时编译（JIT）编译器，这是影响 JVM 的两个主要部分。除了其他性能知识外，你还将学习如何读取 GC 日志并使用免费的\
  \ Java VisualVM (`jvisualvm`) 工具分析内存使用情况。\n\n到第二部分结束时，你将不再是一个只考虑 IDE 中源代码的开发者。你将了解\
  \ Java 和 JVM 在底层是如何工作的。\n\n\n\n\n\n让我们从讨论 `class loading`（类加载）开始——这是新类整合到运行中的 JVM\
  \ 进程的过程。在本节中，我们将首先讨论“经典”类加载的基础知识，即 Java 8 及更早版本中的实现方式。在章节的后部分，我们将讨论模块化 JVM 的出现如何为类加载引入了一些（微小的）变化。\n\
  \n## 4.1 类加载与类对象\n\n`.class` 文件为 `JVM` 定义了一个类型，其中包含了字段、方法、继承信息、注释和其他元数据。类文件格式在标准中有详细描述，任何想要在\
  \ `JVM` 上运行的语言都必须遵循该标准。\n\n注意，类是 Java 平台理解、接受和执行程序代码的基本单元。\n\n从初级 Java 开发者的角度来看，很多类加载机制都是隐藏的。开发者只需提供一个可执行的\
  \ JAR 文件或主应用程序类的名称（该类必须存在于 classpath 上），由 `JVM` 找到并执行该类。\n\n任何应用程序依赖（例如除 `JDK` 以外的库）也必须在\
  \ classpath 上，`JVM` 也会找到并加载它们。然而，Java 规范并没有说明这是在应用程序启动时完成，还是在以后需要时完成。\n\n注意，Java\
  \ 类加载系统向用户提供的 API 相当简单——许多复杂性被刻意隐藏了，我们将在章节的后部分讨论开发者可用的 API。\n\n让我们从一个非常简单的示例开始：\n\
  \n```\nClass<?> clazz = Class.forName(\"MyClass\");\n```\n\n这段代码将一个类 `MyClass` 加载到当前执行状态中。从\
  \ `JVM` 的角度来看，为了实现这一点必须执行若干步骤。首先，必须找到与名称 `MyClass` 对应的类文件，然后解析它包含的类。这些步骤是在原生代码中执行的——在\
  \ `HotSpot` 中，该原生方法被称为 `JVM_DefineClass()`。\n\n从高层次来说，实际过程是原生代码构建 `JVM` 的内部表示（称为\
  \ `klass`，它不是一个 Java 对象——我们将在第 17 章中详细介绍它）。然后，只要能够成功从类文件中提取出 `klass`，`JVM` 就会构建一个\
  \ `klass` 的 Java “镜像”，并将其作为 `Class` 对象传给 Java 代码。\n\n之后，代表该类型的 `Class` 对象即可供运行系统使用，并可以创建它的新实例。在之前的示例中，`clazz`\
  \ 最终持有与类型 `MyClass` 对应的 `Class` 对象。它不能持有 `klass`，因为 `klass` 是 `JVM` 内部对象，而不是 Java\
  \ 对象。\n\n注意，相同的过程也用于主应用程序类、其所有依赖项以及程序启动后可能需要的任何其他类。\n\n在本节中，我们将从 `JVM` 的视角更详细地涵盖这些步骤，并介绍类加载器（class\
  \ loaders），类加载器是控制整个整个过程的对象。\n\n### 4.1.1 加载与链接\n\n看待 `JVM` 的一种方式将其视为一个执行容器。在这种观点下，`JVM`\
  \ 的目的是消耗类文件并执行它们包含的字节码。为了实现这一点，`JVM` 必须将类文件的内容作为字节数据流检索出来，将其转换为可用的形式，并将其添加到运行状态中。这在本质上就是我们在这里描述的过程。\n\
  \n这个相当复杂的过程可以以多种方式进行划分，但我们将其称为 `loading`（加载）和 `linking`（链接）。\n\n注意，我们对加载和链接的讨论涉及某些特定于\
  \ `HotSpot` 代码的细节，但其他实现应该执行类似的操作。\n\n第一步是获取构成类文件的字节数据流。这个过程从一个字节数组开始，该数组通常从文件系统读取（但其他替代方案绝对是）。\n\
  \n一旦有了流，就必须对其进行解析以检查它是否包含有效的类文件结构（这有时称为 `format checking` 格式检查）。如果是，则创建一个候选的 `klass`。在这个阶段，当候选的\
  \ `klass` 被填充时，会进行一些基本检查（例如：正在加载的类是否真的可以访问其声明的父类？它是否尝试重写任何 `final` 方法？）。\n\n然而，在加载过程结束时，对应于类的数据结构尚未被其他代码使用，特别是，我们还没有一个功能完整的\
  \ `klass`。\n\n为了达到这一目标，类现在必须经过链接，然后初始化才能被使用。从逻辑上讲，这一步分为三个子阶段：验证（verification）、准备（preparation）和解析（resolution）。然而，在实际实现中，代码可能没有分得很干净，因此如果你计划阅读源码，应该意识到这里提供的描述是对该过程的高层次或概念性描述，与实际实现代码没有精确的对应关系。\n\
  \n考虑到这一点，验证可以理解为确认该类符合 Java 规范的要求，且不会为运行系统引起运行时错误或其他问题的阶段。链接的各个阶段之间的关系如图 4.1 所示。\n\
  \n![](img/CH04_F01_Evans2.png)\n\n图 4.1 加载与链接（带有链接的子阶段）\n\n让我们逐个认识每个阶段。\n\n####\
  \ 验证\n\n验证是一个复杂的过程，由几个独立的关注点组成。例如，`JVM` 需要检查常量池中的符号信息（在 4.3.3 节中详细讨论）是自洽的并遵守常量规则。\n\
  \n另一个主要的关注点，也是验证中最复杂的部分，是检查方法的字节码。这涉及确保字节码是良好的并且没有尝试绕过 `JVM` 的环境控制。\n\n执行的一些主要检查如下：\n\
  \n- 确保字节码不会以不允许或恶意的方式操纵栈。\n- 确保每个分支指令（例如来自 `if` 或循环）都有正确的目的指令。\n- 检查调用方法时的参数数量和静态类型是否正确。\n\
  - 检查局部变量仅赋值相应类型的值。\n- 检查每个可能抛出的异常是否有合法的 catch 处理器。\n\n出于多种原因进行这些检查，包括性能。这些检查允许跳过运行时检查，从而使解释代码运行得更快。某些检查还可以简化运行时将字节码编译为机器码（`即时编译`，我们将在第\
  \ 6 章中介绍）。\n\n#### 准备\n\n准备类涉及分配内存并为类中的静态变量初始化做好就绪，但它不会初始化变量或执行任何 JVM 字节码。\n\n####\
  \ 解析\n\n解析是链接的一个部分，`JVM` 在此阶段检查被链接的类的超类型（以及它实现的任何接口）是否已经链接，如果没有，则在继续该类的链接之前对它们进行链接。这可能会导致任何未见过的新类型产生递归链接过程。\n\
  \n注意，与类加载这方面相关的关键术语是类型的 `transitive closure`（传递闭包）。不仅是类直接继承的类型，所有间接引用的类型都必须经过链接。\n\
  \n#### 初始化\n\n在最后一个阶段，任何静态变量都将被初始化，并运行任何静态初始化块。这是一个重要的点，因为直到现在，`JVM` 才终于开始运行新加载类的字节码。\n\
  \n\n\n\n当此步骤完成后，该类已完全加载并准备就绪。该类对运行时是可用的，并且可以创建它的新实例。任何引用此类的后续类加载操作现在都将看到它已加载并可用。\n\
  \n### 4.1.2 类对象\n\n链接和加载过程的最终结果是一个 `Class` 对象，它代表了新加载并链接的类型。它现在在 JVM 中已经具有了完整的功能，尽管出于性能考虑，`Class`\
  \ 对象的某些方面仅在需要时初始化。\n\n注意 `Class` 对象是普通的 Java 对象。它们存在于 Java 堆中，就像任何其他对象一样。\n\n你的代码现在可以继续使用该新类型并创建新实例。此外，一个类型的\
  \ `Class` 对象提供了许多有用方法，例如 `getSuperclass()`，它返回与超类型对应的 `Class` 对象。\n\n类对象可以配合反射 API（Reflection\
  \ API）使用，对方法、字段、构造函数等进行间接访问。`Class` 对象拥有对 `Method`、`Field` 以及其他与类成员对应的对象的引用。这些对象可以在反射\
  \ API 中使用，提供对类能力的间接访问，正如我们在本章稍后看到的。。你可以在图 4.2 中看到这种高层结构。\n\n![](img/CH04_F02_Evans2.png)\n\
  \n图 4.2 `Class` 对象和 `Method` 引用\n\n到为止，我们还没有讨论运行时具体哪个部分负责定位和链接将成为新加载类的字节流。这由类加载器（class\
  \ loaders）处理——它们是抽象类 `ClassLoader` 的子类，它们是我们的下一个学习主题。\n\n## 4.2 类加载器\n\nJava 是一个具有动态运行时的基本面向对象系统。一个方面是\
  \ Java 的类型在运行时是活跃的，运行中的 Java 平台的类型系统是可以被修改的——特别是通过添加新类型。构成 Java 程序的类型对运行时未知类型的扩展开放（除非它们是\
  \ `final` 或新的 `sealed` 类之一）。类加载能力暴露给用户。类加载器只是扩展了 `ClassLoader` 的 Java 类——它们本身就是\
  \ Java 类型。\n\n注意在现代 Java 环境中，所有的类加载器都是模块化的。加载类总是在模块的上下文中完成的。\n\n`ClassLoader` 类具有一些原生方法，包括加载和链接方面，这些部分负责对类文件的低级解析，但用户类加载器无法重写类加载的这一方面。无法使用原生代码编写类加载器。\n\
  \n平台带了以下典型的类加载器，它们在平台启动和正常运行期间执行不同的工作：\n\n* `BootstrapClassLoader`（或 `primordial`\
  \ 类加载器）——它在 JVM 启动过程的非常早阶段就被实例化，因此最好将其认为是 JVM 的一部分。它通常用于加载最基础的系统——本质上是 `java.base`。\n\
  * `PlatformClassLoader`——在启动最基本的系统后，平台类加载器加载应用程序依赖的其余平台模块。该类加载器是访问任何平台类的主要接口，无论该类实际上是由此加载器还是引导加载器加载的。它是一个内部类的实例。\n\
  * `AppClassLoader`——应用程序类加载器——这是最广泛使用的类加载器。它加载应用程序类并在大多数现代 Java 环境中承担大部分工作。在模块化\
  \ JVM 中，应用程序类加载器不再是 `URLClassLoader` 的实例（在 Java 8 及之前的版本中是），而是一个内部类的实例。\n\n让我们通过向第\
  \ 2 章 `wgjd.sitecheck` 模块中的 `SiteCheck` 类的 `main` 方法顶部添加一些代码来看看这些新类加载器的运行情况：\n\n\
  ```\n...\nvar clThis = SiteCheck.class.getClassLoader();\nSystem.out.println(clThis);\n\
  var clObj = Object.class.getClassLoader();\nSystem.out.println(clObj);\nvar clHttp\
  \ = HttpClient.class.getClassLoader();\nSystem.out.println(clHttp);\n....\n```\n\
  \n我们使用以下命令重新编译它：\n\n```\n$ javac -d out wgjd.sitecheck/module-info.java \\\n   \
  \     wgjd.sitecheck/wgjd/sitecheck/*.java \\\n        wgjd.sitecheck/wgjd/sitecheck/*/*.java\n\
  ```\n\n并这样运行它：\n\n```\n$ java -cp out wgjd.sitecheck.SiteCheck http://github.com/well-grounded-java\n\
  ```\n\n注意这里使用了“启动模块”语法而不是显式的启动类。\n\n这产生了以下输出：\n\n```\njdk.internal.loader.ClassLoaders$AppClassLoader@277050dc\n\
  null\njdk.internal.loader.ClassLoaders$PlatformClassLoader@12bb4df8\nhttp://github.com/well-grounded-java:\
  \ HTTP_1_1\n```\n\n`Object` 的类加载器（位于 `java.base` 中）报告为 `null`。这是一个安全特性——引导加载器不进行任何验证，并对其加载的每个类提供完全的安全访问。由于由于原因，在\
  \ Java 运行时中表示并提供该类加载器是没有意义的——潜在的错误或滥用风险太大。\n\n除了核心作用外，类加载器还经常用于从 JAR 文件或类路径上的其他位置加载资源（不是类的文件，如图像或配置文件）。这通常与\
  \ try-with-resources 模式结合，产生如下代码：\n\n```\ntry (var is = TestMain.class.getResourceAsStream(\"\
  /resource.csv\");\n     var br = new BufferedReader(new InputStreamReader(is));)\
  \ {\n     // ...\n}\n// 省略异常处理\n```\n\n类加载器以两种不同的形式提供这种机制，返回 `URL` 或 `InputStream`。\n\
  \n### 4.2.1 自定义类加载\n\n复杂的环境通常会有许多额外的*自定义类加载器*——子类 `java.lang.ClassLoader` 的类（直接或间接）。这是因为类加载器类不是\
  \ `final` 的，事实上开发者被鼓励编写针对其特定需求的类加载器。\n\n自定义类加载器被表示为 Java 类型，因此它们需要被类加载器加载，通常被称为它们的*父类加载器*。这不应与类继承和父类混淆。相反，类加载器通过*委托*的形式相关。\n\
  \n在图 4.3 中，你可以看到类加载器的委托层级以及不同加载器之间的相互关系。\n\n![](img/CH04_F03_Evans2.png)\n\n图 4.3\
  \ 类加载器层级\n\n自定义机制的关键位于 `ClassLoader` 中定义的 `loadClass()` 和 `findClass()` 方法中。主入口点是\
  \ `loadClass()`，以下是 `ClassLoader` 中相关代码的简化形式：\n\n\n\n\n\n```java\nprotected Class<?>\
  \ loadClass(String name, boolean resolve)\n        throws ClassNotFoundException\n\
  \    {\n        synchronized (getClassLoadingLock(name)) {\n            // 首先，检查类是否已经加载加载\n\
  \            Class<?> c = findLoadedClass(name);\n            if (c == null) {\n\
  \                // ...\n                try {\n                    if (parent !=\
  \ null) {\n                        c = parent.loadClass(name, false);\n        \
  \            } else {\n                        c = findBootstrapClassOrNull(name);\n\
  \                    }\n                } catch (ClassNotFoundException e) {\n \
  \                   // 如果从非空父类加载器中未找到类，\n                    // 则抛出 ClassNotFoundException\n\
  \                }\n\n                if (c == null) {\n                    // 如果仍然没有，则依次调用\
  \ findClass\n                    // 来查找该类。\n                    // ...\n       \
  \             c = findClass(name);\n\n                    // ...\n             \
  \   }\n            }\n            // ...\n\n            return c;\n        }\n \
  \   }\n```\n\n从根本上说，`loadClass()` 机制会检查类是否已经加载，然后询问它的父类加载器。如果该类加载失败（注意对 `parent.loadClass(name,\
  \ false)` 调用周围的 try-catch 块），则加载过程将委托给 `findClass()`。`java.lang.ClassLoader` 中 `findClass()`\
  \ 的定义非常简单——它只是抛出一个 `ClassNotFoundException`。\n\n此时，让我们回到在章节开头提出的一个问题，并探索一下在类加载过程中可能会遇到的一些异常和错误类型。\n\
  \n### 类加载异常\n\n`ClassNotFoundException` 的含义相对简单：类加载器尝试加载指定的类，但未能成功。也就是说，在请求加载的点上，JVM\
  \ 不知道该类的存在，且 JVM 无法找到它。\n\n接下来是 `NoClassDefFoundError`。注意，这是一个错误（error）而不是异常（exception）。该错误表明\
  \ JVM 确实知道请求的类的存在，但在其内部元数据中没有找到该类的定义。让我们快速看一眼一个例子：\n\n```java\npublic class ExampleNoClassDef\
  \ {\n\n    public static class BadInit {\n        private static int thisIsFine\
  \ = 1 / 0;\n    }\n\n    public static void main(String[] args) {\n        try {\n\
  \            var init = new BadInit();\n        } catch (Throwable t) {\n      \
  \      System.out.println(t);\n        }\n        var init2 = new BadInit();\n \
  \       System.out.println(init2.thisIsFine);\n    }\n}\n```\n\n当此程序运行时，我们会得到类似下面的输出：\n\
  \n```\n$ java ExampleNoClassDef\njava.lang.ExceptionInInitializerError\nException\
  \ in thread \"main\" java.lang.NoClassDefFoundError: Could\n  not initialize class\
  \ ExampleNoClassDef$BadInit\n    at ExampleNoClassDef.main(ExampleNoClassDef.java:13)\n\
  ```\n\n这表明 JVM 尝试加载 `BadInit` 类但失败了。尽管如此，程序捕获了异常并尝试继续运行。然而，当第二次遇到该类时，JVM 的内部元数据表显示该类已被见过，但没有加载有效的类。\n\
  \nJVM 实际上对失败的类加载尝试实现了*负向缓存*（negative caching）——加载过程不会被重试，而是抛出一个错误（`NoClassDefFoundError`）。\n\
  \n另一个常见的错误是 `UnsupportedClassVersionError`，当类加载操作尝试加载一个比运行时支持的 Java 源码更高版本编译的类文件时就会触发。例如，考虑一个用\
  \ Java 11 编译的类，我们尝试在 Java 8 上运行它，如下所示：\n\n```\n$ java ScratchImpl\nError: A JNI\
  \ error has occurred please check your installation and try again\nException in\
  \ thread \"main\" java.lang.UnsupportedClassVersionError:\n  ScratchImpl has been\
  \ compiled by a more recent version of the Java\n    Runtime (class file version\
  \ 55.0), this version of the Java Runtime\n    only recognizes class file versions\
  \ up to 52.0\n    at java.lang.ClassLoader.defineClass1(Native Method)\n    at java.lang.ClassLoader.defineClass(ClassLoader.java:763)\n\
  \    at java.security.SecureClassLoader.defineClass(SecureClassLoader.java:142)\n\
  \    at java.net.URLClassLoader.defineClass(URLClassLoader.java:468)\n    at java.net.URLClassLoader.access$100(URLClassLoader.java:74)\n\
  \    at java.net.URLClassLoader$1.run(URLClassLoader.java:369)\n    at java.net.URLClassLoader$1.run(URLClassLoader.java:363)\n\
  \    at java.security.AccessController.doPrivileged(Native Method)\n    at java.net.URLClassLoader.findClass(URLClassLoader.java:362)\n\
  \    at java.lang.ClassLoader.loadClass(ClassLoader.java:424)\n    at sun.misc.Launcher$AppClassLoader.loadClass(Launcher.java:349)\n\
  \    at java.lang.ClassLoader.loadClass(ClassLoader.java:357)\n    at sun.launcher.LauncherHelper.checkAndLoadMain(LauncherHelper.java:495)\n\
  ```\n\nJava 11 格式的字节码可能包含运行时不支持的特性，因此继续尝试加载它是不安全的。注意，因为这是 Java 8 运行时，它不包含模块化条目（modular\
  \ entries）。\n\n最后，我们还应该提到 `LinkageError`，它是 `NoClassDefFoundError`、`VerifyError`\
  \ 和 `UnsatisfiedLinkError` 的基类，以及其他几种可能性。\n\n### 一个自定义类加载器\n\n自定义类加载最简单的形式就是简单子类化\
  \ `ClassLoader` 并重写 `findClass()`。这允许我们重用之前讨论的 `loadClass()` 逻辑，并减少类加载器的复杂度。\n\n\
  我们的第一个示例是后续代码所示的 `SadClassLoader`。它实际上并没有做任何事情，但它确保你知道它参与了该过程，并祝你顺利：\n\n```java\n\
  public class LoadSomeClasses {\n\n    public static class SadClassloader extends\
  \ ClassLoader {\n        public SadClassloader() {\n            super(SadClassloader.class.getClassLoader());\n\
  \        }\n\n        public Class<?> findClass(String name) throws\n          ClassNotFoundException\
  \ {\n            System.out.println(\"我非常担心我没找到这个类\");\n            throw new ClassNotFoundException(name);\n\
  \        }\n    }\n\n    public static void main(String[] args) {\n        if (args.length\
  \ > 0) {\n            var loader = new SadClassloader();\n            for (var name\
  \ : args) {\n                System.out.println(name +\" ::\");\n              \
  \  try {\n                    var clazz = loader.loadClass(name);\n            \
  \        System.out.println(clazz);\n                } catch (ClassNotFoundException\
  \ x) {\n                    x.printStackTrace();\n                }\n          \
  \  }\n        }\n    }\n}\n```\n\n在我们的示例中，我们设置了一个非常简单的类加载器以及使用它来尝试加载可能已加载或未加载的类。\n\
  \n自定义加载器的一种常见约定是提供一个无参数构造函数，该函数调用父类构造函数并将类加载器作为参数传递（以成为父类）。\n\n许多自定义加载器并没有比我们的示例复杂得多——它们只是重写\
  \ `findClass()` 以提供所需的特定功能。这可能包括通过网络查找类。例如在一个难忘的案例中，自定义类加载器通过 JDBC 连接到数据库并访问加密二进制列来获取将使用的字节。这是为了满足高度监管环境中对非常敏感代码的静态加密要求。\n\
  \n然而，可以做的不仅仅是重写 `findClass()`。例如，`loadClass()` 不是 `final` 方法，因此可以被重写，而且事实上，某些自定义类加载器确实重写了它，恰恰是为了改变我们之前遇到的通用逻辑。\n\
  \n\n\n\n最后，我们还有一个定义在 `ClassLoader` 上的 `defineClass()` 方法。该方法是类加载的关键，因为它是用户可访问的方法，执行了我们在本章之前描述的“加载与链接”过程。它接收一个字节数组并将其转换为类对象。这是在运行时加载类类路径（classpath）中不存在的新类的主要机制。\n\
  \n只有当传递给 `defineClass()` 的一个符合正确 JVM 类文件格式的字节缓冲区时，该调用才能生效。否则，它将加载失败，因为加载步骤或验证步骤的某一个会失败。\n\
  \n**注意**：此方法可以用于高级技术，例如加载运行时生成且没有源代码表示的类。这种技术正是 Java Lambda 表达式机制的工作原理。我们将在第 17\
  \ 章对这一主题进行更多讨论。\n\n`defineClass()` 方法既是 `protected`（保护的）又是 `final`（最终的），并且定义在 `java.lang.ClassLoader`\
  \ 中，因此它只能由 `ClassLoader` 的子类访问。因此，自定义类加载器始终可以访问 `defineClass()` 的基本功能，但不能篡改验证或其他底层的类加载逻辑。最后一点非常重要：无法更改验证算法是一个非常有用的安全特性——编写糟糕的自定义类加载器无法破坏\
  \ JVM 提供的基础平台安全性。\n\n在 HotSpot 虚拟机（这是目前最常见的 JVM 实现）中，`defineClass()` 会委托给原生方法 `defineClass1()`，该方法会进行一些基础检查，然后调用名为\
  \ `JVM_DefineClassWithSource()` 的 C 函数。\n\n该函数是进入 JVM 的入口，并提供了对 HotSpot C 代码的访问权限。HotSpot\
  \ 使用 C `SystemDictionary` 通过 C++ 方法 `ClassFileParser::parseClassFile()` 加载新类。这段代码实际上运行了大部分的链接过程，特别是验证算法。\n\
  \n一旦类加载完成，方法的字节码就会放置在代表方法的 HotSpot 元数据对象中（它们被称为 `methodOops`）。然后，它们就可以供字节码解释器使用了。从概念上来说，这可以被视为方法缓存，尽管出于性能考虑，字节码实际上由\
  \ `methodOops` 持有。\n\n我们已经遇到过 `SadClassloader` 了。现在让我们来看其他自定义类加载器的示例，首先从查看如何使用类加载来实现依赖注入开始。\n\
  \n## 示例：依赖注入框架\n\n我们想要强调以下两个与 DI（依赖注入）高度相关的核心概念：\n\n*   系统中的功能单元具有依赖关系和配置信息，它们依赖这些信息才能正常运行。\n\
  *   许多对象系统具有在代码中难以或笨拙表达的依赖关系。\n\n你应该脑海中形成的画面是：类包含了行为、配置，以及外部于对象本身的依赖关系。后这部分通常被称为对象的\
  \ `runtime wiring`（运行时接线/连接）。在这个示例中，我们将讨论假设的 DI 框架如何使用类加载器来实现运行时接线。\n\n**注意**：我们将采用的方法类似于\
  \ Spring 框架原始实现的简化版本。然而，现代生产环境中的 DI 框架具有更高的复杂度。我们的示例仅供演示。\n\n让我们先看看如何在我们想象的 DI 框架下启动应用程序，如下所示：\n\
  \n```\njava -cp <CLASSPATH> org.wgjd.DIMain /path/to/config.xml\n```\n\n`DIMain`\
  \ 类是 DI 框架的入口类。它将读取配置文件、创建对象系统，并将它们连接在一起（“接线”）。注意，`DIMain` 类不是一个应用程序类——它来自框架并且是完全通用的。\n\
  \n我们还可以看到应用程序的 `CLASSPATH` 必须包含三部分：a) DI 框架的 JAR 文件，b) `config.xml` 文件中引用的应用程序类，c)\
  \ 应用程序拥有的任何其他（非 DI）依赖项。让我们来看下面的示例配置文件：\n\n```xml\n<beans>\n\n <bean id=\"dao\" class=\"\
  app.ch04.PaymentsDAO\">\n  <constructor-arg index=\"0\" value=\"jdbc:postgresql://db.wgjd.org/payments\"\
  />\n  <constructor-arg index=\"1\" value=\"org.postgresql.Driver\"/>\n </bean>\n\
  \n  <bean id=\"service\" class=\"app.ch04.PaymentService\">\n    <constructor-arg\
  \ index=\"0\" ref=\"dao\"/>\n  </bean>\n\n</beans>\n```\n\nDI 框架使用配置文件来确定构造哪些对象。这个示例需要创建\
  \ `dao` 和 `service` bean，框架将需要调用每个 bean 的构造函数并传入指定的参数。\n\n类加载分两个独立的阶段进行。第一阶段（由应用程序类加载器处理）加载\
  \ `DIMain` 类以及它引用的任何框架类。然后 `DIMain` 开始运行，并接收配置文件的位置作为 `main()` 方法的参数。\n\n此时，框架已经在\
  \ JVM 中启动运行，但 `config.xml` 中指定的用户类尚未被触及。事实上，在 `DIMain` 检查配置文件之前，框架没有办法知道要加载哪些类。\n\
  \n为了启动 `config.xml` 中指定的应用程序配置，需要第二阶段的类加载。在我们的示例中，这使用了自定义类加载器。\n\n首先，检查 `config.xml`\
  \ 文件的一致性并确保其无错误。然后，如果一切正常，自定义类加载器将尝试从 `CLASSPATH` 加载这些类型。如果其中任何一个操作失败，整个过程将终止。\n\
  \n如果成功，DI 框架就可以按照正确的顺序实例化对象（带有它们的构造参数）。最后，如果这一切正确完成，应用程序上下文就就绪并可以开始运行。\n\n值得再次强调的是，这个示例是假设且说明性的。完全可以构建一个这样运行的简单\
  \ DI 框架。然而，现实 DI 系统的实现要复杂得多。让我们来看另一个示例。\n\n## 示例：插桩类加载器\n\n考虑一种在加载类时修改其字节码以添加额外插桩信息的类加载器。当针对转换代码运行测试用例时，插桩代码会记录哪些方法和代码分支被实际测试过。通过这一点，开发者可以看到一个类的单元测试有多彻底。\n\
  \n这种方法是 EMMA 测试覆盖率工具的基础，该工具仍然可以在 `http://emma.sourceforge.net/` 获取，尽管它现在已经过时了，并且没有针对现代\
  \ Java 版本进行更新。尽管如此，经常会遇到使用特殊类加载器在加载时转换字节码的框架或其他代码。\n\n**注意**：加载时修改字节码的技术在 `java\
  \ agent`（Java 代理）方法中也可见，New Relic 等工具用于性能监控、可观测性等目标。\n\n我们简要提到了自定义类加载的几个用例。Java\
  \ 技术领域的许多其他领域都是类加载器及相关技术的巨大用户。是一些广为人知的例子：\n\n*   插件架构\n*   框架（无论是供应商提供的还是自有的）\n\
  *   从异常位置（非文件系统或 URL）检索类文件\n*   Java EE\n*   任何在 JVM 进程已经运行后可能需要添加新的未知代码的情况\n\n\
  让我们继续讨论模块系统如何影响类加载，并修改我们刚刚解释的经典模型。\n\n\n\n\n## 4.2.2 模块与类加载\n\n模块系统的设计运行层级与类加载不同，类加载是平台内一种相对底层的机制。模块涉及程序单元之间的大规模依赖，而类加载涉及的是小规模的依赖。然而，理解这两个机制是如何交汇的，以及模块的引入对程序启动带来的变化是非常重要的。\n\
  \n回想一下，在模块化 JVM 上运行时，为了执行程序，运行时会计算一个模块图，并尝试作为第一步来满足它。这被称为 `module resolution`（模块解析），它推导出根模块及其依赖项的传递闭包。\n\
  \n在此过程中，会进行额外的检查（例如：没有重名的模块，没有拆分包/split packages）。模块图的存在意味着预期的运行时类加载问题会更少，因为现在在进程完全启动之前，就可以检测到模块路径上缺失的\
  \ JAR 文件。\n\n除此之外，在大多数情况下，模块系统并没有大幅改变类加载。存在一些高级的可能性（例如通过反射动态加载服务提供者接口的模块化实现），但大多数开发者可能不会遇到这些情况。\n\
  \n## 4.3 检查类文件\n\n类文件是二进制大对象（binary blobs），因此它们不容易直接处理。但在许多情况下，你会发现调查类文件是有必要的。\n\
  \n假设你的应用程序需要将额外的方法设为公有，以便进行更好的运行时监控（例如通过 `JMX`）。重新编译和重新部署似乎完成顺利，但当检查管理 API 时，这些方法并不存在。额外的重新构建和重新部署也没有效果。\n\
  \n为了调试部署问题，你可能需要检查 `javac` 是否生成了你认为它应该生成的类文件。或者，你可能需要调查一个你没有源码且你怀疑文档描述不正确的类。\n\n\
  对于这些及类似的任务，你必须利用工具来检查类文件的内容。幸运的是，标准的 Oracle JVM 自带了一个名为 `javap` 的工具，它对于查看类文件内部并进行反汇编非常有用。\n\
  \n我们将首先介绍 `javap` 以及它提供的一些用于检查类文件属性的基本开关（switches）。然后，我们将讨论 JVM 内部使用的方法名和类型的一些表示形式。我们将查看常量池（constant\
  \ pool）——JVM 的“工具百宝箱”——它在理解字节码如何工作方面起着重要作用。\n\n### 4.3.1 介绍 javap\n\n从查看类声明的方法到打印字节码，`javap`\
  \ 可用于许多有用任务。让我们看看 `javap` 使用的最简单形式，并将其应用于本章早之前的类加载示例：\n\n```\n$ javap LoadSomeClasses.class\n\
  Compiled from \"LoadSomeClasses.java\"\npublic class LoadSomeClasses {\n  public\
  \ LoadSomeClasses();\n  public static void main(java.lang.String[]);\n}\n```\n\n\
  内部类已被编译成一个独立的类，因此我们需要也看看那个类：\n\n```\n$ javap LoadSomeClasses\\$SadClassloader.class\n\
  Compiled from \"LoadSomeClasses.java\"\npublic class LoadSomeClasses$SadClassloader\
  \ extends java.lang.ClassLoader {\n  public LoadSomeClasses$SadClassloader();\n\
  \  public java.lang.Class<?> findClass(java.lang.String) throws\n    java.lang.ClassNotFoundException;\n\
  }\n```\n\n默认情况下，`javap` 显示公有的（public）、受保护的（protected）和默认的包保护可见性方法。`-p` 开关还会显示私有的（private）方法和字段。\n\
  \n### 4.3.2 方法签名的内部形式\n\n JVM 内部使用的方法签名形式与 `javap` 显示的人类读形式略有不同。当我们深入研究 JVM 时，你会更频繁地看到这些内部名称。如果你想继续往下看，可以跳过去，但请记住这一节在这里——你可能在随后的章节和内容需要引用它。\n\
  \n在紧凑形式中，类型名称被压缩了。例如，`int` 用 `I` 表示。这些紧凑形式有时被称为 `type descriptors`（类型描述符）。表 4.1\
  \ 提供了一个完整的列表（包含了 `void`，它不是一种类型但确实出现在方法签名中）。\n\n表 4.1 类型描述符\n\n|  | | 类型 |\n| ---\
  \ | --- |\n| B | Byte |\n| C | Char (一个 16 位的 Unicode 字符) |\n| D | Double |\n| F\
  \ | Float |\n| I | Int |\n| J | Long |\n| L<type name>; | 引用类型（例如字符串使用 Ljava/lang/String;）\
  \ |\n| S | Short |\n| V | Void |\n| Z | Boolean |\n| [ | Array-of |\n\n在某些情况下，类型描述符可能比源代码中出现的类型名称更长（例如，`Ljava/lang/Object;`\
  \ 比 `Object` 长，但类型描述符总是完全限定的，因此它们可以直接被解析）。\n\n`javap` 提供了一个非常有用的开关 `-s`，它会为你输出签名的类型描述符，这样你就不需要通过表格来推算它们。你可以使用稍微高级的\
  \ `javap` 调用方式来显示我们之前查看的某些方法的签名，如下所示：\n\n```\n$ javap -s LoadSomeClasses.class\n\
  Compiled from \"LoadSomeClasses.java\"\npublic class LoadSomeClasses {\n  public\
  \ LoadSomeClasses();\n    descriptor: ()V\n\n  public static void main(java.lang.String[]);\n\
  \    descriptor: ([Ljava/lang/String;)V\n}\n```\n\n以及对于内部类：\n\n```\n$ javap -s LoadSomeClasses\\\
  $SadClassloader.class\nCompiled from \"LoadSomeClasses.java\"\npublic class LoadSomeClasses$SadClassloader\
  \ extends java.lang.ClassLoader {\n  public LoadSomeClasses$SadClassloader();\n\
  \    descriptor: ()V\n\n  public java.lang.Class<?> findClass(java.lang.String)\
  \ throws\n    java.lang.ClassNotFoundException;\n    descriptor: (Ljava/lang/String;)Ljava/Class;\n\
  }\n```\n\n可以看出，方法签名中的每个类型都由类型描述符表示。\n\n在下一节中，我们将看到类型描述符的另一个用法。这位于类文件中非常重要的部分——常量池。\n\
  \n### 4.3.3 常量池\n\n常量池是一个提供类文件其他（常量）元素快捷方式的区域。如果你学习过显式使用符号表的 C 或 Perl 等语言，你可以将常量池理解为类似的\
  \ JVM 概念。\n\n让我们在下一个列表中使用非常简单的示例来演示常量池，以免被细节淹没。下一个列表显示了一个简单的“实验场”类。这提供了一种快速测试 Java\
  \ 语法特性或库的方法，通过在 `run()` 中编写少量代码来实现。\n\n列表 4.1 示例类类\n\n```\npackage wgjd.ch04;\n\n\
  public class ScratchImpl {\n\n    private static ScratchImpl inst = null;\n\n  \
  \  private ScratchImpl() {\n\n    }\n\n    private void run() {\n\n    }\n\n   \
  \ public static void main(String[] args) {\n        inst = new ScratchImpl();\n\
  \        inst.run();\n    }\n}\n```\n\n为了查看常量池中的信息，你可以使用 `javap -v`。这会打印大量的额外信息——远不止是常量池——但让我们关注实验场类的常量池项，如下所示：\n\
  \n\n\n\n\n```java\n#1 = Class #2 // wgjd/ch04/ScratchImpl\n\n#2 = Utf8 wgjd/ch04/ScratchImpl\n\
  \n#3 = Class #4 // java/lang/Object\n\n#4 = Utf8 java/lang/Object\n\n#5 = Utf8 inst\n\
  \n#6 = Utf8 Lwgjd/ch04/ScratchImpl;\n\n#7 = Utf8 <clinit>\n\n#8 = Utf8 ()V\n\n#9\
  \ = Utf8 Code\n\n#10 = Fieldref #1.#11 // wgjd/ch04/ScratchImpl.inst:Lwgjd/ch04/ScratchImpl;\n\
  \n#11 = NameAndType #5:#6 // instance:Lwgjd/ch04/ScratchImpl;\n\n#12 = Utf8 LineNumberTable\n\
  \n#13 = Utf8 LocalVariableTable\n\n#14 = Utf8 <init>\n\n#15 = Methodref #3.#16 //\
  \ java/lang/Object.\"<init>\":()V\n\n#16 = NameAndType #14:#8 // \"<init>\":()V\n\
  \n#17 = Utf8 this\n\n#18 = Utf8 run\n\n#19 = Utf8 ([Ljava/lang/String;)V\n\n#20\
  \ = Methodref #1.#21 // wgjd/ch04/ScratchImpl.run:()V\n\n#21 = NameAndType #18:#8\
  \ // run:()V\n\n#22 = Utf8 args\n\n#23 = Utf8 [Ljava/lang/String;\n\n#24 = Utf8\
  \ main\n\n#25 = Methodref #1.#16 // wgjd/ch04/ScratchImpl.\"<init>\":()V\n\n#26\
  \ = Methodref #1.#27 // wgjd/ch04/ScratchImpl.run:([Ljava/lang/String;)V\n\n#27\
  \ = NameAndType #18:#19 // run:([Ljava/lang/String;)V\n\n#28 = Utf8 SourceFile\n\
  \n#29 = Utf8 ScratchImpl.java\n```\n\n如所示，常量池条目是有类型的。它们也相互引用，例如，类型为 `Class` 的条目会引用类型为\
  \ `Utf8` 的条目。`Utf8` 条目意味着一个字符串，因此 `Class` 条目指向的 `Utf8` 条目就是类名。\n\n表 4.2 显示了常量池条目的各种可能性。常量池中的条目有时带有\
  \ `CONSTANT_` 前缀进行讨论，例如 `CONSTANT_Class`。这是为了在可能产生混淆的情况下，明确它们不是 Java 类型。\n\n####\
  \ 表格 4.2 常量池条目\n\n| 名称 | 描述 |\n| --- | --- |\n| `Class` | 类常量。指向类名（作为 `Utf8` 条目）。\
  \ |\n| `Fieldref` | 定义字段。指向该字段所属的 `Class` 和 `NameAndType`。 |\n| `Methodref` | 定义方法。指向该方法的\
  \ `Class` 和 `NameAndType`。 |\n| `InterfaceMethodref` | 定义接口方法。指向该方法的 `Class` 和 `NameAndType`。\
  \ |\n| `String` | 字符串常量。指向持有字符的 `Utf8` 条目。 |\n| `Integer` | 整数常量（4 字节）。 |\n| `Float`\
  \ | 浮点常量（4 字节）。 |\n| `Long` | 长整型常量（8 字节）。 |\n| `Double` | 双精度浮点常量（8 字节）。 |\n| `NameAndType`\
  \ | 描述名称和类型对。类型部分指向持有该类型描述符的 `Utf8`。 |\n| `Utf8` | 表示 `Utf8` 编码字符的字节流。 |\n| `InvokeDynamic`\
  \ | `invokedynamic` 机制的一部分——参见第 17 章。 |\n| `MethodHandle` | `invokedynamic` 机制的一部分——参见第\
  \ 17 章。 |\n| `MethodType` | `invokedynamic` 机制的一部分——参见第 17 章。 |\n\n使用此表，你可以查看练习场中常量池中的一个常量解析示例。考虑条目\
  \ #10 处的 `Fieldref`。要解析一个字段，你需要一个名称、类型以及它所属的类：#10 的值为 #1.#11，这意味着来自类 #1 的常量 #11。很容易检查出\
  \ #1 确实是类型为 `Class` 的常量，而 #11 是一个 `NameAndType`。#1 指向 `ScratchImpl` Java 类本身，而 #11\
  \ 指向 #5:#6——一个类型为 `ScratchImpl` 的名为 `inst` 的变量。因此，总体而言，#10 指 ScratchImpl 类本身的静态变量\
  \ `inst`（你可能已经从上面的输出猜到了）。\n\n在类加载的验证步骤中，有一个步骤是检查类文件中的静态信息是否一致。先前的示例展示了运行时在加载新类时将执行的这种完整性检查。\n\
  \n我们已经讨论了类文件的一些基本结构。让我们进入下一个主题，在其中我们将深入字节码的世界。理解源代码如何转换为字节码，将帮助你更好地理解你的代码是如何运行的。\n\
  \n## 4.4 字节码\n\n字节码是源代码和机器码之间的中间表示。理解源代码如何转换为字节码，将帮助你更好地理解你的代码是如何运行的。\n\n* 字节码是源代码和机器码之间的中间表示。\n\
