    being since a human being has an inherent capacity to be represented (i.e. is


    circumscribed and thus ‘circumscribable’).³⁶ What is interesting is that Theo-


    dore immediately relates this argument to Mary: Christ must have an artiﬁcial


    image since he is ‘the natural image \[εἰκῶν φυσική\] of the mother who bore


    him’, even if he is concurrently the natural image of God the Father. He hinges


    his argument, in other words, on Mary’s role as the source of Christ’s


    humanity. What applies to her also applies to him, and thus if she, as a


    human being, is subject to circumscription (making her depictable), then


    this must also apply to Christ in his humanity. Given that possession of


    human nature always entails circumscribability and thus depictability, Christ


    cannot possess human nature from his mother and simultaneously be un-


    depictable. There is an implicit argument from Theodore here that for the


    iconoclast arguments to make sense, Mary would have to be undepictable, or


