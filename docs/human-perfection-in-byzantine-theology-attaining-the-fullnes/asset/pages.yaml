    and defends the monastic estate in itself, but his priorities in doing so. The


    monasticism that Theodore cherishes is by no means the life of the solitary,


    free from human community and human labour. It is the monastic commu-


    nity in its fully coenobitic form that he has in mind, with communal meals,


    communal work, communal prayer, and even common clothing and perhaps


    communal dormitories.⁹¹ Theodore is at pains to emphasize the coenobitic


    form of monasticism—of which he is both advocate and in some ways


    architect—as constituting the apogee of Christian existence. This way of life


    can of course be linked, and often was, to the famous passage in Acts 2:44,


    where the early believers ‘had all things in common’. Yet interestingly, and in


    tune with his concern to ﬁnd in the incarnate Christ his supreme model,


    Theodore lays emphasis on the submission of Christ to others in service as the


    real inauguration of the coenobitic form of monastic life. More than this, he


    puts this in contrast to other forms of monastic living:


    Know this, my beloved and much desired, that our Lord Jesus Christ himself, the


    giver of inscrutable good things, when he came to earth, did not embrace the


    eremitical life, nor that of a stylite, nor any of the others we mentioned, but
    the


