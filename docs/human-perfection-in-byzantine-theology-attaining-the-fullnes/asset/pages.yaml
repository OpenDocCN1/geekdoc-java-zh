  md: '**Personalism and Orthodox Theology**


    The broad philosophical (and theological) movement in the West known as


    ‘personalism’ is difﬁcult to pin down with any degree of real coherence as a


    thoroughgoing school of thought. As the name suggests, the concept of the


    person is generally given primacy among personalist thinkers as that which is


    of ultimate ontological value. The precise meaning of ‘person’, ‘personality’,
    or


    ‘personhood’, however, differs substantially among personalists, and only on


    occasion (even in the case of Christian personalists) do their deﬁnitions of the


    person coincide in a strong and recognizable manner with Orthodox thought.


    Although personalism is usually associated with either the so-called Boston


    school with Borden Parker Bowne (1847–1910) at its head, or the French


    School connected primarily with the names of Emmanuel Mounier (1905–50)


    and Jacques Maritain (1882–1973), its conceptual beginnings, on the philo-


    sophical level, reach back further. Recent work by Jan Olof Bengtsson has


    demonstrated that many of the chief themes and terminology that characterize


    twentieth-century personalism have their roots in earlier intellectual debates


    in continental Europe.³¹ In particular, the ﬁgures of F. H. Jacobi (1743–1819)


    and Friedrich Schelling (1775–1854) as well as the movement known as


    Speculative Theism (represented, for instance, by J. G. Fichte and H. Lotze),


    are upheld as the true architects of modern personalism. Needless to say, the


    Enlightenment ‘turn to the subject’ is seen as the larger canvas for these


    developments, as are the insights and debates surrounding Kantian and


    Hegelian philosophy. Immanuel Kant’s philosophy, in particular his ethical


    theory (tied to his ‘categorical imperative’) that called for each human being
    to


