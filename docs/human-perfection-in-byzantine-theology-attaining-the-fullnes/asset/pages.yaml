    at, beginning with the controversial theologian Sergius Bulgakov (1871–1944).


    Interest in the person and work of Bulgakov has experienced a resurgence of


    late.⁵⁹ A powerful and creative theologian, he courted much controversy


    during his lifetime. Regardless of where one stands on the particularities of


    his thought, the themes that preoccupied him and the manner in which he


    approached them had a profound impact on the shape of subsequent Ortho-


    dox theology, among both his defenders and detractors. An important theme


    in Bulgakov’s thought is that of personhood and hypostasis, already a matter


    of signiﬁcant reﬂection in his 1917 work The Unfading Light. In 1925 he


    published the text Hypostasis and Hypostaticity that emphasizes among others


    the themes of tri-personal or tri-hypostatic communion and mutual, self-


    giving love as constitutive of divine life: ‘Unihypostatic Absolute, possessing


    itself and everything unconditionally, would be not only a contradiction in


    adiecto, but also an expression of metaphysical egoism, absolute limitedness,


    Satanism’.⁶⁰ We have here the stark contrast perceived by Bulgakov between


    theological individualism and true personalism. It is a contrast that carries


    over directly into his conception of the human being made in the image of


    God and summoned to deiﬁcation. The emphasis on the concepts of ‘hypos-


    tasis’ and ‘deiﬁcation’ as indicative (if not explanatory) terms for an Orthodox


    approach to human perfection is a phenomenon that really begins in earnest,


    in the modern period, with Bulgakov’s theology.


