  md: 'In proposing the methodological paradigm of neo-patristic synthesis, Flor-


    ovsky was mainly attempting to counter two perceived threats to Orthodox


    theology (and theology more broadly). The ﬁrst was the risk of mere patristic


    ‘archaeology’, a mechanical parroting and repetition of the sources without


    sensitivity or care for the current context. The second threat was from a hyper-


    contextualized theology that felt free to divest itself of (or at least modify)
    the


    dogmatic norms of Scripture and tradition in its conversation with the world,


    setting aside a sense of reverence for the testimony of the forbears of the


    Orthodox tradition, and questioning in this way any real sense of the inner,


    unbroken, and ‘organic’ continuity of the faith down the ages (often described


    by Florovksy in terms of the ‘mind’ or phronema of the Fathers).


    It is not without irony that despite Florovsky’s attempt at a delicate balance


    between the historical and the systematic concerns of theology, neo-patristic


    synthesis has become virtually synonymous for many contemporary Ortho-


    dox theologians with a form of patristic ‘excavation’ that uncovers or repeats


    the sources without genuinely informing or edifying the modern context. As


    Gallaher puts it: ‘a re-envisioning of neo-patristic synthesis is \[ . . . \]
    certainly


    needed. As it stands, it is a blind alley from which there is no escape from a


    theology of repetition or, worse, the degeneration of Orthodox theology into


    patristic archaeology. Neo-patristic theology has become a theology of repe-


    tition’.⁴ Similarly, although Florovsky envisioned this ‘synthesis’ as showing
    a


    path forward in the ecumenical arena towards the substantial theological


    ‘reintegration’ of diverse Christian culture, it is commonly branded a ﬁercely


    and intrinsically anti-Western approach.⁵ A growing dissatisfaction with such


    alleged shortcomings in Florovsky’s programme and its heirs, combined with


    a strong revival of theological interest in Florovsky’s theological adversary


    Sergius Bulgakov (and other representatives of the Russian Religious Renais-


    sance), has led several Orthodox theologians to push for new models and


    paradigms by which to conduct theological work, whether John Behr’s pro-


    posal of ‘symphony’ and patristic text as ‘icon’ or Aristotle Papanikolaou’s


    advocating of ‘the logic of divine–human communion’ to address contextual


    issues (such as political theology).⁶ There is clearly a desire among a growing


