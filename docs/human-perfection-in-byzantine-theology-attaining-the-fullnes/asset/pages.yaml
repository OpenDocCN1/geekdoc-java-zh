    the


    doctrine of divine energies.


    Each of these areas (alone or in combination) has become virtually deﬁni-


    tive of contemporary Orthodox theological anthropology, encompassing


    the concerns of Vladimir Lossky, John Zizioulas, and Christos Yannaras, to


    name only a few pioneering ﬁgures. These themes are inescapable in modern


    Orthodox theology, which is widely known and celebrated for its richly


    Trinitarian focus on God as persons in communion; its vision of Christ as


    not only restoring humanity to its pre-fallen state, but raising it up beyond


    Eden to the heights of deiﬁcation, a reality to which all are called by the


    uncreated power and energy of the Holy Spirit; and as well as this, its emphasis


    on the apophatic, the continuing mystery and ineffability of God who remains


    always transcendently ‘beyond’ and ‘above’ us in his essence, even when


    sharing with us his life.


    The themes of personhood and communion, deiﬁcation, and the distinction


    between the essence and energy of God are not only to be found in modern


    Orthodox theology, having likewise each received broader systematic as well


    as historical treatment. Work in these areas has yielded exciting but sometimes


    conﬂicting results. Thus, in debates surrounding personhood, an impasse of


    sorts has been reached between the historian who simply does not see any-


    thing like a developed theological personalism in the sources (whereby the


    doctrine of the Trinity as persons in communion serves as a straightforward


    ‘model’ for anthropology and human relationships), and the systematician


    who insists it is there. Similarly, while the doctrine of human deiﬁcation (or


    theosis) is upheld by all as a sine qua non of Orthodox theology, its precise


    meaning is diffusely and sometimes confusingly expressed, especially when it


    is tightly combined, with little discussion, with concepts of continual growth


    and development for all eternity. One cannot fault the casual or even


    seasoned observer from wondering how theosis is really ever reached if, in


    fact, it is inherently unattainable as such: in what way, from this perspective,


    is deiﬁcation a ‘doctrine’ regarding human destiny? Should the doctrine, in


    order to be truer to its content, be re-named one of ‘perpetually deferred


    deiﬁcation’? This is not to say that Orthodox theology must necessarily


    do away with one or the other (that is, theosis or epektasis), but it must at


    least treat the connection between the two as less than obvious and in need of


    far more careful attention than it has hitherto received. Finally, the doctrine


    of the distinction between God’s unknowable essence or nature and his


    knowable energy/energies (which includes within itself the ‘apophatic turn’


    also characteristic of much modern Orthodox theology) is repeatedly and


    understandably championed as the Orthodox solution to the problems of


    human knowledge of and communion with God. But this is often done either


    in an unhelpfully acerbic anti-Western key and/or in a way that potentially


