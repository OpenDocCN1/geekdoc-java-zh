    The second issue, the driving force behind the ﬁrst treatise in the second of


    Palamas’s Triads,¹² is Barlaam’s devotion to the idea of the unicity of truth.¹³


    What might strike many as an eminently reasonable and laudable position—


    namely that ‘truth is one’ and thus the search for truth wherever it is to be


    found (especially through philosophical and scientiﬁc inquiry) has a common


    goal and somehow puts one in contact with divine truth—was fervently


    opposed by Palamas. At stake for him, as we shall see in more detail later,


    was the Christian revelation itself that ‘makes foolish’ the wisdom of this


    world. To afﬁrm the unicity of truth in the way proposed by Barlaam was


    ultimately to make natural knowledge about the world obtainable through


    rational inquiry continuous with the knowledge of God received by supernat-


    ural grace.¹⁴ It was to place all knowledge and ‘truth’ on a continuum that


    made a mockery of the tension if not opposition clearly articulated by Paul


    (and James) between ‘the wisdom of this world’ and ‘the wisdom of God’.¹⁵


