    issue of using Aristotelian logic (speciﬁcally demonstrative syllogism) when


    discussing God. Barlaam had deployed an argument against the Latins on the


    basis of his understanding of apophaticism that since God is utterly unknow-


    able and indemonstrable, the procession of the Holy Spirit is likewise un-


    knowable and indemonstrable.⁷ This was ostensibly an argument against the


    Filioque (the procession of the Holy Spirit from the Father ‘and the Son’), but


    Palamas saw it as a weak argument that misused the logic of apophaticism,


    resulting in a doctrine of God that was devoid of any positive, demonstrable


    bearings in reality. Whether or not Barlaam or Palamas was the superior


    disciple of Aristotle in this debate need not concern us (though Sinkewicz


    makes a strong case that it is Barlaam⁸); what is important is that it launches
    a


    larger discussion about human knowledge of, and access to, God, and thus


    about human sanctiﬁcation and the human ideal.


    The precise contours of Barlaam’s theological position are harder to recon-


    struct, certainly as they are developed in several lost anti-Hesychast treatises


    (fragments of which are preserved in Palamas’s writings). We do, however,


    have several of his letters related to the Hesychast Controversy, edited with
    an


    invaluable introduction and discussion by Fyrigos.⁹ While Palamas, in good


    Byzantine rhetorical style, may well have exaggerated and caricatured Bar-


    laam’s approach, there are at least three substantial points of conﬂict for the


    purposes of our discussion that should be highlighted. The ﬁrst has to do with


    the nature of apophaticism, and thus with the reception and interpretation of


    Dionysius the Areopagite, the champion of apophatic theology. Barlaam


    seems to hold to a rather intellectualist view of what negative or apophatic


    theology entails: a way of denial that not only protects divine transcendence


    but makes any direct apprehension of God an a priori impossibility.¹⁰ Palamas


    reacts strongly against this, arguing that the way of negation in the sense


    employed by Barlaam is only a preliminary step that does not preclude the gift


    of true knowledge and apprehension of God (even if, from a human perspec-


    tive, such knowledge is indeed unattainable). For him, knowledge of God is


    certainly beyond knowledge or afﬁrmation, but it is also beyond unknowing or


    negation.¹¹ Furthermore, Palamas’s reading of Dionysius’s theology in general


