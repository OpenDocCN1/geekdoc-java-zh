  md: 'In the case of Christ, the union of divine and human occurs in his very


    person, but as we saw especially in Maximus and Symeon, this union is


    repeated to the extent of ‘fullness’ in the deiﬁed by grace. Using scriptural


    imagery, we might say that the distinction between Christ and the saints is like


    that between a head and its bodily members, or a vine and its branches. The


    saints can only ever receive the gift of their perfection and deiﬁcation: they


    cannot manufacture, let alone bestow, it themselves. But the true distinction


    between the giver and the receiver should not be ampliﬁed into a distinction of


    lives or inheritance. The uncreated divine life bestowed upon the saints from


    the Father in the Holy Spirit is one, and it comes to us solely through the


    humanity of the Son. That humanity, then, must not be forgotten in any


    Christian theological endeavour, not least for the articulation of a theological


    anthropology. For modern Orthodox thought, as intimated in Chapter 1, this


    principle is under threat, even if it has consistently had its champions. The


    desire among some Orthodox theologians (and some non-Orthodox partly


    under their inspiration) to emphasize the human ideal primarily through the


    lens of the apophatic, or on the basis of a personalism crudely emanating from


    Trinitarian doctrine with only passing reference to Christ, or via the theology


    of divine energies, or the concept of Sophia/Godmanhood, or again through a


    ﬁxation on epektasis, risks in each case falsifying the core tenets of the doctrine


    of human perfection and deiﬁcation espoused and developed in the Byzantine


    theological tradition. There should be no such thing as a Christian approach to


    theological anthropology that is alienated, in however slight a manner, from


    the doctrine of Christ. This should especially be the case for the Orthodox,


    some of whose rich heritage on this matter in the Byzantine period I have tried


    to elaborate.


    Happily, there are several Orthodox theologians (some of whom were


    discussed in Chapter 1) who take seriously the question of carefully starting


    with the doctrine of Christ in order to develop a doctrine of the human being


    and human perfection. In the contemporary Western theological academy,


    perhaps the chief representative of this approach is the patrologist and theo-


    logian John Behr. For the ﬁnal section of this Conclusion I will therefore


    engage with Behr’s thought, ﬁnding points of harmony but also points of


