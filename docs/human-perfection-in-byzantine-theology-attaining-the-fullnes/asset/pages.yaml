  md: 'On the basis of Christological dogmatic precedent, Symeon gives the notion
    of


    ‘duality’ a constitutive role in his understanding of human perfection in a


    manner not seen to the same extent elsewhere. To be perfect is to be ‘double’,


    human by nature but God by grace. It is signiﬁcant that Symeon does not shy


    away from the idea that the deiﬁed human being somehow possesses ‘two


    essences’ and ‘two natures’. He clearly intends this to be understood in a


    qualiﬁed sense (‘by grace’), and does not directly espouse the position here


    that deiﬁcation entails becoming God ‘by nature’ (he even tacitly rejects it).


    What drives his Chalcedonian poetic ﬂourish when describing the human


    ideal is rather the idea that perfection involves participation in, and union


    with, the person of Christ. Since this union is with the God-man, who is dual


    in nature, energy, and will, the perfected human being ‘inherits’ these same


    traits by virtue of Christ. Symeon’s tactic in using such language is not to claim


    to be another Christ, but to constantly refocus the notion of deiﬁcation and the


    human ideal on the Christ of Byzantine orthodoxy. His doctrinal conscious-


    ness whereby the one person Jesus Christ is perfect God and perfect man, ever


    abiding as both from the moment of his incarnation, ‘without confusion,


    without change, without division, without separation’, serves as the control-


    ling lens through which Symeon understands the human ideal.


    In one of his most famous and controversial texts, Hymn 15, he narrows in


    on the abiding and sanctiﬁed humanity of Christ, speciﬁcally Christ’s bodily


