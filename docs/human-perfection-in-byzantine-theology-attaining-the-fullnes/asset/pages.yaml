    hymn. It is interesting that the divine ﬁre and light described by Symeon here


    is associated in the ﬁrst instance with Christ, whose presence in the soul is


    inseparably accompanied by that of ‘the Father and the Spirit’. The process of


    deiﬁcation, while often described elsewhere in the corpus as occurring ‘by the


    Holy Spirit’, is still always conﬁgured by Symeon in a Christocentric manner.


    As we saw in a passage from Epistle 4 cited earlier (in the section ‘The threat
    of


    a mediocre ideal’), the work of the Holy Spirit is to make human beings into


    ‘christs’.


    In all this we can observe a marked eclipsing of angelic imagery for the life


    of perfection in favour of a ‘full-bodied’ Christocentric approach. This ap-


    proach has its roots in the New Testament, where the superiority of Christ to


    the angels is a frequent theme, and where the disciples of Christ are described


    as being privy to things that even ‘the angels desire to look into’ (1 Peter 1:12).


    Symeon’s unabashed pursuit and development of this theme as it relates to


    human potential and the human ideal, however, is noteworthy. In particular,


    he offers a thoroughgoing application of the logic of the doctrine of Christ’s


    incarnation to anthropology as a whole, whereby the glory of the angelic ideal


    fades before what the human being is called to achieve by virtue of Christ. It
    is


    precisely this transfer of theological dogma to anthropology that characterizes


    Symeon’s bold and poetic understanding of human perfection, and which, at


    least on the level of methodology, is not so far removed from the Orthodox


