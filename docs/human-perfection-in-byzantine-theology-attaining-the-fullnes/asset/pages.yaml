    A core theme for much of modern Orthodox theology is the essence–energies


    distinction, which has been deployed as a hermeneutical key to solve all


    manner of theological and philosophical puzzles, from the concept of deiﬁca-


    tion to the threat of secularization.¹ According to this distinction, God in


    his nature or essence is utterly incomprehensible and unattainable, yet his


    natural—and thus uncreated—energies or activities can be experienced in the


    created world through divine condescension: thus God is truly knowable in his


    energy/activity even if he can never be known or ‘grasped’ in his essence.


    Maintaining this distinction, it is argued, is necessary to safeguard the notion


    of real sanctiﬁcation and deiﬁcation, whereby the human being, in the process


    of being sanctiﬁed, truly encounters and knows the uncreated God himself


    rather than a created (and thus non-divine) reality. A key implication of this


    distinction is that God’s sanctifying and deifying grace, as a manifestation of


    divine energy or activity, is uncreated.


    The torchbearer for this distinction and its detailed defence is the late


    Byzantine theologian St Gregory Palamas (c.1296–1357). In fact, the modern


    Orthodox emphasis on the essence–energies distinction is so intertwined with


    the retrieval of Palamas that the Orthodox ﬁgures who appeal to this distinc-


    tion in articulating their theological vision—Vladimir Lossky, Dimitru


