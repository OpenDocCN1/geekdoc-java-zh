    When examining and illustrating Symeon’s vision of perfection, an ongoing


    process can be observed whereby what is creedal and dogmatic is rendered


    existential and living. The formulae and terminology that govern the Byzan-


    tine Church’s teachings on the person of Christ, the Trinity, and even the


    person of Mary are constantly being redeployed by Symeon for existential


    ends. He considers these formulae and terms to have a true and even non-


    negotiable importance and meaning as they pertain to Christ, the Trinity, and


    Mary, but that meaning counts for little, according to him, if they do not in


    turn directly affect and govern the shape and content of Christian life. His


    whole approach to the human ideal can be seen in terms of this concern:


