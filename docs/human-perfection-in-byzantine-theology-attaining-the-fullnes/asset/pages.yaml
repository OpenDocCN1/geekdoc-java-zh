    **The Hesychast Controversy**


    The basic biography of Gregory Palamas has been set out by others, notably in


    the seminal but in some ways controversial study by John Meyendorff, and


    more recently by Robert Sinkewicz.⁴ Born in c.1296 to a noble family in


    Constantinople, Palamas received a good education before deciding to espouse


    the monastic life on Mount Athos at a young age in around 1314. By the


    beginnings of the Hesychast Controversy in 1335, Palamas had been labouring


    as a monk in a variety of locations on Athos and Verroia (near Thessaloniki)


    in both eremitical and coenobitic contexts, serving brieﬂy as abbot of the


    Athonite monastery of Esphigmenou. From 1335 and for the next twenty-two


    years until his death as Metropolitan of Thessaloniki in 1357, he would be


    embroiled in a theological debate which, while in an important sense was


    settled by the imperial Church in his favour during his lifetime, nevertheless


    persisted beyond his death.


    The controversy in question is sometimes termed the Hesychast Contro-


    versy, sometimes the Palamite Controversy. Meyendorff tends to identify or


    equate the two, while others, such as Rigo and Nadal Cañellas, insist on


    distinguishing them.⁵ The main reason in favour of distinguishing them lies


    in the fact that several adversaries of Palamas following his initial conﬂict
    over


    Hesychasm with Barlaam of Calabria (c.1290–1348) professed themselves to


    be defenders if not practitioners of Hesychasm itself, but enemies of Palamas’s


    way of explaining it, not least among them the monk Gregory Akindynos


    (1300–48). At the same time, to speak of a Palamite Controversy as strictly


    distinct from the Hesychast Controversy is also somewhat misleading, since


    from the outset the controversy was always tied to a debate regarding the


    knowledge and experience of God—not simply monastic practices—a thread


    that remains unbroken for Palamas throughout the course of the controversy.


    In any event, it is at least worth highlighting this potential distinction between


    debating Hesychastic practice/experience and its dogmatic underpinnings,


