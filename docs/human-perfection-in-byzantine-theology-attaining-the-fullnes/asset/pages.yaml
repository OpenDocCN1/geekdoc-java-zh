    A BYZANTINE CHRISTOLOGICAL SYNTHESIS:


    SUMMARY OF FINDINGS THROUGH A


    TWELFTH-CENTURY LENS


    In 1166 the emperor Manuel I Komnenos (reigned 1143–80) installed four


    large marble slabs on the left (north) wall of the nave of the cathedral of Agia


    Sophia in Constantinople. These slabs—together measuring just over 4 metres


    high by 4.5 metres wide—bore a running inscription laying out the doctrinal


    decisions which had recently been taken that same year at a council convened


    by Manuel in order to resolve a dispute about the interpretation of Christ’s


    words, ‘my Father is greater than I’ (John 14:28). This unusual act caused a


    stir, and two successive emperors (Andronikos I and Isaac II) were pressured


    by certain ofﬁcials to take them down. When Isaac II apparently came close to


    doing so, the threat of an uprising from the clergy and people led to a change


    of heart, and instead of removing them he ﬂanked the slabs with images of


    Peter and Paul. The lapidary inscription remained in place for 400 years,


    removed only in 1567 when the slabs were repurposed for the building of


    Suleiman I’s mausoleum. Mercifully, the inscription itself was largely


    preserved.¹


    What was the signiﬁcance of this monumental inscription and the doctrinal


    debate it accompanied? Most historians and theologians pay it little attention,


    ¹ For this description, and for the transcription of the contents of the slabs
    (which is also


    preserved in other documentary sources), see Mango (1963).


    Human Perfection in Byzantine Theology: Attaining the Fullness of Christ. Alexis
    Torrance, Oxford University Press (2020).


