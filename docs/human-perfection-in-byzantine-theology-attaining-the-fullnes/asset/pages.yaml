    Symeon is often dubbed a Byzantine ‘mystic’ because of the emphasis on


    mystical and contemplative experience throughout his writings. This is accur-


    ate up to a point, but if by ‘mystic’ we mean someone who eschews or passes


    over ecclesiastical dogma and practice in favour of a supra-institutional


    ‘spirituality’ (as many do), Symeon hardly qualiﬁes. Far from bypassing the


    trappings of intricate Christian doctrine, Symeon makes them the basis and


    cornerstone of his vision. Moreover, his mysticism has a distinctly Eucharistic


    content that emerges from his consummate devotion to the ecclesial institu-


    tion. His conﬂict with institutional authorities (notably Stephen of Nikome-


    dia) serves in his mind to underscore rather than to question his devotion to


    the ecclesiastical institution as such. An ofﬁcial ‘softening’ of the church’s


    stance on the goal and accessibility of perfection would be tantamount, for


    Symeon, to the loss of ecclesiastical identity itself. If the human ideal shown


    and given in Christ is not the unobscured goal for all the church’s members,


    then the meaning of the church as an institution collapses, and the meaning of


    the Christianity of its members is likewise called into question.


    It might be tempting simply to dismiss Symeon’s approach as wildly


    puritanical, heartless, even tyrannical. Yet Symeon himself would identify


    the veiling of the Christian ideal as a far greater tyranny than its unremittingly


    forceful proclamation. For to veil the ideal is to attempt to obscure the face
    of


    Christ, and to excuse one’s failure in achieving it is to stunt the Gospel and


    refashion its message after a different image. Symeon stands adamantine in his


    refusal to allow such a clouding of the human ideal to capture the church (and


    thereby, in his mind, subvert Christianity itself). This stance renders his


    corpus at once lofty and also highly ‘pressurized’. The absolute need for the


    conscious experience of Christocentric perfection by the Holy Spirit is a


    concern found around every corner, practically on every page of his extensive


    writings. Symeon rarely appears directly concerned with the possibility of


    discouragement among his audience before these expectations. That said,


