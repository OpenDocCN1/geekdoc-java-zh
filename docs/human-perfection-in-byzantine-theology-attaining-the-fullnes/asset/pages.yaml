    and supra-powerful activity of God . . . unmediated, inﬁnite and unto


    inﬁnity’.¹¹⁶


    Maximus’s use of ‘ever-moving rest’ here, while an important qualiﬁer, is


    nevertheless more peripheral than central to his literary portrait of salvation.


    The climax of his description is not—as we might expect given the term’s


    popularity in scholarship—ever-moving rest, but a deiﬁed state of union


    without interval or dimension that is the unmediated and inﬁnite operation


    of God in the saved. Certainly, ever-moving rest provides an important


    clariﬁcation of Maximus’s position, but it should not be treated as a simple


    equivalent to epektasis. The emphasis falls sharply on the completed and


    ‘unintervaled’ nature of the deiﬁed state, on stasis rather than movement.


    But Maximus’s use of movement as a qualiﬁer for stasis does indicate


    an apophatic reticence regarding the inexpressibility of the eschatological


    state. In Ambiguum 15, Maximus insists that ‘God neither moves nor is


    stationary . . . He is beyond all motion and rest’.¹¹⁷ While this distinguishes


    God’s nature from that of creatures, the logic of deiﬁcation in Maximus clearly


    leads him to posit the sharing of the saints by grace in this divine state beyond


    motion and even rest. Our impoverished human language can only indicate


    this with something like ever-moving rest: we could perhaps rephrase it


