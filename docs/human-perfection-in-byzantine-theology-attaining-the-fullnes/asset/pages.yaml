    that for which our personhood yearns—our innate thirst for authentic


    and eternal life—remains unfulﬁlled and unachievable.


    This is not an exhaustive list, but is presented merely to give a sense to readers


    of the general framework and approach of much contemporary Orthodox


    personalist thought represented by Lossky, Zizioulas, Sakharov, Yannaras, and


    others. As can be seen, there is a strong desire to connect Trinitarian and


    Christological dogma to human life, destiny, and perfection, something de-


    veloped through emphasis on the image of God in humanity, the efﬁcacy of


    the sacraments, and the keeping of Christ’s commandments. There is a


    presupposition that to fulﬁl one’s vocation as a human person or hypostasis


    is to be a deiﬁed human being: personhood and deiﬁcation go hand in hand.


    Taken together, points (2), (3), and (4) regarding individuality, relation, and


    irreducibility to nature form an implicit or sometimes explicit critique of the


    Boethian formulation of the person as ‘an individual substance of a rational


    nature’, a deﬁnition that was to have a tremendous impact on Western


    thought. In that sense, Orthodox personalist theology can legitimately be


    understood as resistant to ‘substantialist’ (often viewed as ‘impersonalist’)


    readings of the human being: the category of personhood enjoys a measure


    of logical primacy vis-à-vis nature in a way not readily seen in the Boethian


    deﬁnition.


    The reader accustomed to a wider range of theological and philosophical


    sources of the nineteenth and twentieth centuries will doubtless recognize


    several terms and concerns that are present beyond the bounds of Orthodox


    theology. Moreover, the relationship between this personalist theology and


    the patristic and Byzantine sources of the Orthodox tradition is still a hotly


    contested topic, and will be touched on below in the section on John


    Zizioulas. First, however, some of the intellectual roots of the personalist


    concerns and ideas conveyed above need to be discussed.


