  md: 'anthropology is an impressive feat full of creativity and ﬂair. His work on


    anthropology can be seen as a large-scale rendering of Paul’s striking desire
    to


    know nothing except ‘Jesus Christ and him cruciﬁed’ (1 Cor. 2:2). But Behr’s


    consistency in bypassing questions of historicity through an absolute concen-


    tration on the event and signiﬁcance of Christ’s death (at the expense of all


    other events) leaves him with essentially only one tool for the work of theology


    and anthropology: literary analysis.⁵¹ To be sure, it is a literary analysis


    ordered around the Cross and Scripture’s proclamation of Christ Cruciﬁed


    (especially as this is recorded in the New Testament and the ﬁrst Christian


    centuries), but the resulting content remains distinctly literary precisely be-


    cause ‘history’ and any ‘sequence of events’ in Christ’s life or ours is sidelined


    or redeﬁned beyond recognition. As a consequence, the deﬁnition of true and


    perfect humanity as articulated in Byzantine theology (and centred on the


    person and work of Christ also before and after the climactic event of his


    Passion) is called into question. If Christian existence prior to death is


    positively made up only of the ‘practice of death’, and if becoming a human


    being in the eschatological sense completely coincides with physical death,


    then we are faced with a rather different concept of human perfection than


    that which has been unearthed in the preceding chapters here.


    Confronted with the thought of Maximus, Theodore, Symeon, and Gregory


    Palamas, we are certainly not faced with a homogenous monolith. Their


    thought also does not offer us an obvious or ready-made personalism to


    take as a point of departure for theological discourse. But the in-depth studies


    of their approach to questions of human perfection through the humanity of


    Christ have at least demonstrated an elegant harmony that taken together


    should lay to rest any suspicions or reservations regarding the Byzantine


    theological tradition as somehow taken up with a cloudy mysticism that


    forgets its Christological roots and bearings. Human perfection, the human


    ideal, is always conﬁgured Christocentrically in these authors, towards the


    acquisition of ‘the stature of the fullness of Christ’ (Eph. 4:13). The concept
    of


    ‘fullness’ contains several radical afﬁrmations: ﬁrst, from the chapter on


    Maximus, the reception by the deiﬁed of the fullness of God (to the point of


    calling into question the standard ‘epektatic’ narrative of Byzantine and


    Orthodox spirituality); second, from the chapter on Theodore, in that recep-


    tion, the safeguarding and fulﬁlment of created human identity (down to the


    continuity of all natural human properties no longer subject to corruption);


    third, from the chapter on Symeon, the potential to participate proleptically


    but truly (‘in knowledge, action, and contemplation’) in this gift here and now


    in the life of the Church; and fourth, from the chapter on Gregory Palamas, the


    ⁵¹ I am grateful to the late Fr Matthew Baker who ﬁrst alerted me to the strongly
