    perfection.


    But this note on inclusivity must receive its qualiﬁcation. The doctrinal


    decisions of 1170 make this qualiﬁcation by underscoring the issue of apparent


    human properties and characteristics that are in fact ‘false’ and non-existent


    (anhypostatic). The two that are singled out are ‘ignorance’ and ‘slavery’, but


    these themselves could be analysed in more depth and the list could doubtless


    be expanded. Just as our chosen authors could meditate on the positive


    implications of retaining one’s humanity in deiﬁcation (as Christ retains


    his), so too could they meditate on the negation of those properties which,


    while often embraced by many as truly human, turn out to be false and


    delusory props that serve as stumbling blocks to deiﬁed life in Christ. These


    are the deceptive yet pervasive characteristics so often tied to sin that demand


    nothing less than to be sloughed off and rejected for the sake of the kingdom.


    Thus Maximus could speak of the absence or surrender of gnomē in Christ and


    the deiﬁed; Theodore would rail against disobedience and self-will as inimical


    to the path of Christ; Symeon turns in general against self-justiﬁcation and any


    ‘human’ excuse we might make to ignore Christ’s high calling for us; and


    Gregory Palamas warns of the dangers that come with idolizing the scholarly


    pursuit of knowledge as a self-sufﬁcient way of healing human ignorance in


    the quest for truth.


    The framework sketched out in the councils of 1166 and 1170 is just that: a


    kind of scaffold upon which to build an Orthodox understanding of anthro-


    pology. It is not a ﬁnal word, but provides scope for development; it is an


    invitation to elaborate further the meaning and deﬁnition of what is truly


    human and what is falsely so from an Orthodox theological perspective. The


    gauge that is offered for bringing these two facets of the human ideal together


    and discerning their speciﬁc content (whether the included human properties


    or the excluded falsities we so easily cherish) is ﬁrst and foremost the person


    and work of Christ incarnate and ascended in glory. By conceiving the purpose


    of human life as the orientation of the human being with all its natural


    properties towards the supranatural goal of deiﬁcation in Christ, the Byzantine


    theological tradition underlines the preciousness of humanity but also the


    seriousness and even intrinsic unattainability of its goal. According to this


    tradition, to be perfected necessarily means that our human characteristics


    (natural and hypostatic/personal) are retained in their integrity, and thus have


    a permanent value and worth. But that permanence is only truly enacted when


    those same characteristics are also ‘clothed upon’ from on high: natural


    human mortality must be robed with immortality, our circumscribed human-


    ity must feed on the uncircumscribable, and our creatureliness must be


    suffused with the uncreated God, daringly expressed in the sources as occur-


    ring even, in some sense, to the point of equality.


