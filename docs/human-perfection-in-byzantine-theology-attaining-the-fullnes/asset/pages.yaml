  md: 'immutable centrality of Christ’s ‘worshipped body’ as the locus of divine life


    and energy for all, both now and forever.


    To proceed, Orthodox theological anthropology must hold fast to this


    vision of Christ’s fullness, the abiding icon of the God-man, made known


    and imparted to us by the goodwill of the Father and the descent of the Holy


    Spirit. This does not mean a wholesale discarding or discrediting of the many


    creative and inﬂuential contributions made to Orthodox theological anthro-


    pology over the past century—not least the efforts of Orthodox theologians of


    the stature of Lossky, Florovsky, and Zizioulas. But it represents a call to keep


    the attention of such work going forward carefully and unapologetically on the


    person of Jesus Christ as the living author, anchor, and ﬁnisher of the faith.
    As


    Sakharov put it, ‘I cannot know myself if I do not have before me his holy


    image’, that is, the image of the fullness of Christ.⁵² To realize one’s humanity


    involves (as Behr rightly insists) self-denial, dying daily before the image of


    perfection that Christ has depicted for us in the frailty of our nature. If his


    image is distorted, set aside, or somehow superseded in Orthodox discourse on


    human perfection, then the path that Orthodox theological anthropology


    takes might indeed progress ad inﬁnitum, but it will be a progression that


    leads nowhere. If the yearning of the human heart and mind for divine and


    ineffable rest is not a hopeless ﬁction, and if the desire to taste a repose ‘not
    of


    this world’ yet experienced in this world (and even in this body) is not a simple


    ﬂight of the imagination, then the fulﬁlment of this yearning and desire,


    according to the Byzantine theological tradition, lies solely in and through


    the humanity of the Son of God, to whose blessed estate all are summoned,


    receiving the divine glory by becoming ‘members of his body, of his ﬂesh, and


    of his bones’ (Eph. 5:30).


    ⁵² Sophrony (1988), p. 117.


    Conclusion


    215'
