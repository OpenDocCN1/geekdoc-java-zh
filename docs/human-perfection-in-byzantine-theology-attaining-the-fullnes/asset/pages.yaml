  md: '1


    Human perfection in Orthodox theological


    anthropology


    Retrieving the Christological imperative


    By one offering he hath perfected for ever them that are sanctiﬁed.


    Hebrews 10:14


    I should have been considering not so much the words used


    as their meaning.


    St Gregory the Theologian, Oration 31:24


    Theological anthropology is a gift of Christology. While the hope of theo-


    logical anthropology is divinely inscribed, via the image of God, in the heart
    of


    every human being, it is only truly revealed, known, and given in Christ. This


    is the guiding premise of the present volume, that from the perspective of


    Orthodox theology, to understand and expound the doctrine of the human


    being as fundamentally conditioned by the doctrine of God, one must do so in


    the ﬁrst instance through careful attention to the doctrine of Christ as God


    Incarnate. It is only in and through the humanity of the Son of God that


    human beings both behold and partake, by the Holy Spirit, of their high calling


    to be perfect even as the Father is perfect. At root, theological anthropology
    is


    concerned with the question of the human ideal, an ideal uniquely to be found


    in and through the person of Jesus Christ. It is the contention of this study
    that


    several tendencies in modern Orthodox theology have risked unmooring their


    claims about anthropology from this primary Christological imperative, there-


    by leaving open the possibility of theological shipwreck. It is in the service
    of


    warding off this possibility that the present study has been written. As such,
    it


    is a call for a paradigm shift in the manner in which key areas of Orthodox


    theological anthropology are approached and examined on the scholarly


    plane. These interrelated areas are the following: (1) the concepts of person-


    hood and communion; (2) the doctrine of deiﬁcation (including its frequent


