  md: 'Preface


    Till we all come . . . unto a perfect man,


    unto the measure of the stature of


    the fullness of Christ.


    Ephesians 4:13


    Orthodox Christianity is impossible to understand without reference to its


    vast Byzantine theological heritage. This volume is an exercise in coming to


    terms with this heritage as it relates to the questions of human sanctity and


    perfection. As such, this book can be considered a contribution to theological


    anthropology. It is bookended by discussions of certain aspects and ﬁgures in


    modern Orthodox theology, but the core chapters are devoted to the thought


    of seminal Byzantine theologians on the matter of human perfection. The ﬁrst


    chapter includes ample discussion of the scope and methodology of the work,


    thus a separate introduction was deemed unnecessary.


    When combining systematic and historical theology, there is always the


    danger of falling between two stools. I am of the opinion, however, that we


    separate systematic and historical theology at our peril, not least in the case
    of


    Orthodox Christian theology; the two must be treated together. The main


    thesis proposed herein emerges from this combined look at Orthodox system-


    atics and the Byzantine theological tradition, namely that for Orthodox theo-


    logical anthropology to develop positively and in keeping with its theological


    inheritance, it must keep its focus unwaveringly on the person of Christ as the


    source and touchstone of all human perfection. In particular, I argue that the


    doctrine of the humanity of Christ is sometimes overlooked, underplayed, or


    misunderstood in modern Orthodox theology, whereas its central presence and


    importance in the Byzantine theological tradition is unmistakable.


    Discussing the thought of those still living is a happy task when we reserve


    ourselves to praise alone: it becomes more delicate when we feel critique is


    necessary. Judging from reactions given by colleagues to drafts of the following


    chapters, the reader may well ﬁnd the critical discussion of certain living


    theologians either too weak, too harsh, or simply unfounded. I look forward


    to any scholarly debate and disagreement generated by my tentative argu-


    ments. The point of this work, however, is not to engage in academic skir-


    mishes with fellow travellers on the path of Orthodox theology, but to proceed


    positively and constructively by proposing an overarching vision for the study


    of theological anthropology, grounded and settled on the person of Christ.


    Alexis Torrance


    Feast of St Porphyrios of Athens


    2 December 2019'
