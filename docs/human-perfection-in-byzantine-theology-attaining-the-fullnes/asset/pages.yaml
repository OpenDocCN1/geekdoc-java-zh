  md: 'What is worth underscoring is Palamas’s framework here: knowledge of


    God through uncreated divine energy is a thoroughly Christ-centred affair. It


    is belief in the coming of Christ that unlocks the knowledge of God, and the


    real encounter with this knowledge is none other than the experience of the


    glory of Christ and the process of being conformed to him, a process in turn


    inseparable from keeping Christ’s commandments. The deployment of divine


    energy as a concept is in this sense rather narrow, and certainly not conceiv-


    able by Palamas as a ‘substitute’ for Christ, or as an alternative cosmological,


    epistemological, or metaphysical framework to what has come before him.


    However, his debate with Barlaam does stimulate a great deal of reﬂection and


    ampliﬁcation on the issue of divine knowledge and communion that should


    not be ignored.


    The case for the importance of Christ to Palamas’s broader understanding


    of sanctiﬁcation, deiﬁcation, and the essence–energies distinction has been


    made in a preliminary way but requires closer scrutiny, especially given the


    widespread opinion among detractors of Palamas, summed up by Clucas, that


    ‘whatever its attempt to repeatedly emphasize the person of Christ as the agent


    of deiﬁcation’, Palamas’s thought remains essentially non-Christian.⁸² To do


    so, we will turn ﬁrst to Palamas’s approach to apophaticism in the Triads


    before broadening out the enquiry to Palamas’s later works.


    Apophaticism is intimately connected with the theory of knowledge, in this


    case knowledge through ‘unknowing’ or negation. Apophaticism has strongly


    shaped Orthodox theological self-identity in the modern period, particularly


    through the work of Lossky and Yannaras. As has brieﬂy been discussed,


    apophaticism, or at least a form of it, likewise strongly shaped Barlaam’s


    arguments against Palamas. In countering the intellectualist form of apophati-


    cism espoused by Barlaam, Palamas shows a reticence towards the importance


    of the concept in general, just as he showed reticence towards the ‘knowledge/


    ignorance’ dichotomy to appropriately explain the goal of human life. Prop-


    erly speaking, apophatic or negative theology is ‘suffered’ or ‘undergone’ by


    the saints in their supra-rational contemplation of God, ‘not conceived’


    (πάσχοντες . . . ἀλλ᾽οὐδιανοούμενοι): ‘just as to suffer and behold the divine


    things is other than, and superior to, cataphatic theology’, he continues, ‘so
    too


    to suffer negation in the spiritual vision, a negation connected to the tran-


    scendence of that which is beheld, is other than, and superior to, negative


    theology’.⁸³ If apophaticism is not understood in this way, then its signiﬁcance


    is negligible.


