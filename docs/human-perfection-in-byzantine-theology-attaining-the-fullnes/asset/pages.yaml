  md: 'CHANGING PARADIGMS IN HISTORICAL


    AND SYSTEMATIC THEOLOGY


    General Editors


    Sarah Coakley


    Richard Cross


    This series sets out to reconsider the modern distinction between ‘historical’
    and


    ‘systematic’ theology. The scholarship represented in the series is marked by


    attention to the way in which historiographic and theological presumptions


    (‘paradigms’) necessarily inform the work of historians of Christian thought,
    and


    thus affect their application to contemporary concerns. At certain key junctures


    such paradigms are recast, causing a reconsideration of the methods, hermeneutics,


    geographical boundaries, or chronological caesuras which have previously guided
    the


    theological narrative. The beginning of the twenty-ﬁrst century marks a period
    of such


    notable reassessment of the Christian doctrinal heritage, and involves a questioning
    of


    the paradigms that have sustained the classic ‘history-of-ideas’ textbook accounts
    of


    the modern era. Each of the volumes in this series brings such contemporary


    methodological and historiographical concerns to conscious consideration. Each


    tackles a period or key ﬁgure whose signiﬁcance is ripe for reconsideration, and
    each


    analyses the implicit historiography that has sustained existing scholarship on
    the


    topic. A variety of fresh methodological concerns are considered, without reducing
    the


    theological to other categories. The emphasis is on an awareness of the history
    of


    ‘reception’: the possibilities for contemporary theology are bound up with a careful


    rewriting of the historical narrative. In this sense, ‘historical’ and ‘systematic’
    theology


    are necessarily conjoined, yet also closely connected to a discerning interdisciplinary


    engagement.


    This monograph series accompanies the project of The Oxford Handbook of the


    Reception of Christian Theology (Oxford University Press, in progress), also edited


    by Sarah Coakley and Richard Cross.'
