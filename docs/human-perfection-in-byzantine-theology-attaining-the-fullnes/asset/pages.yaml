    These three areas are not, of course, the only concerns of modern Orthodox


    theology (one could add, for instance, the signiﬁcance of Eucharistic ecclesi-


    ology), but they are nonetheless representative, and importantly they provide
    a


    summons to engage with the ﬁrst principles and fundamental tenets of


    theological anthropology writ large. Thanks in particular to work in these


    areas, Orthodox theology has proved rich and inﬂuential in the Western


    theological academy over the course of the twentieth century and into the


    twenty-ﬁrst, and this inﬂuence will doubtless continue. As alluded to, how-


    ever, various levels of historical and theological debate and even confusion


    surrounding these areas have arisen, a state of affairs that calls for scholarly


    treatment and, it is argued, a fresh Christocentric paradigm.


    1\. METHOD


    **A defence of**** ‘****neo-patristic synthesis****’**


    The methodology most often associated with Orthodox theology is ‘neo-


    patristic synthesis’, a term coined by a true titan of the modern Orthodox


    intellectual tradition, Georges Florovsky (1893–1979).² To Florovsky, the term


    implied a certain balance between the duty of paying close attention to the


    historical sources of the tradition combined with that of relating these sources


    creatively and afresh to the problems and concerns of each generation. He


    summarizes his understanding of this method in his ‘theological will’ as


    follows:


    I was led quite early to the idea of what I am calling now ‘the Neo-Patristic


    Synthesis’. It should be more than just a collection of Patristic sayings or


    statements. It must be a synthesis, a creative reassessment of those insights


    which were granted to the Holy Men of old. It must be Patristic, faithful to the


    spirit and vision of the Fathers, ad mentem Patrum. Yet, it must also be Neo\-


    Patristic, since it is to be addressed to the new age, with its own problems and


    queries.³


