    ## In the beginning 17


    received a deep training in processual theory, and poststructuralism was a vague
    revolution on the horizon – this was the mid-late 1980s; I immersed myself in
    studies by philosophers and anthropologists, with a scattering of other stuff
    from sociology, technology studies and art history. Philosophically, I was deep
    into post-structuralism – Derrida especially but apart from a few works, was not
    specifically useful for thinking about time. In the end, it was phenomenology
    and hermeneutics: Levinas de Heidegger and Ricoeur, were my main influences. What
    is interesting though how these thinkers took me far away from my studies of clocks
    and the temporality of form that we were just discussing. In the end, I was thinking
    about the relation between history and narrative that time and form. And I think
    this shift in some ways because of my discussions with Hodder who was all into
    Hayden White at this time.


    Laurent: It would be nice if you could tell me more about what you learnt at that
    time from philosophy, in relation to your first work on archaeological time through
    the study of modern objects. Could you elaborate a bit?


    Gavin: Well, all the philosophers I was reading at that time, I think without
    doubt Husserl had the greatest impact, at least in relation to this study of objects.
    For me, the key problem was how to make continuity and change in a way that did
    not force them apart into opposites. So you had periods of continuity followed
    by abrupt months of change. I wanted to explore ways in which continuity and change
    could be expressed together, not apart and Husserl provided the best way for me
    to visualize this. He used the example of a musical note ringing in the air; like
    Bergson, he wanted to understand how time could incorporate both the idea of a
    present moment passing, and of the past persisting into the present. How can time
    flow and yet we still have sense of past, present and future as distinct temporalities?
    Although I had grown to appreciate Bergson more in subsequent years, at the time
    I felt Husserl offered a far more useful way to tackle this, especially for archaeology.
    So with Husserl’s time diagrams, I found a way to think about design and form
    of objects as temporally layered or stratified.


    ## 18 In the beginning


    ![Husserl''s Diagram](img/97e9b797cf473816012daed7863bbe_26_0.png)

    **Figure 1.2 Husserl’s Diagram of time consciousness (after Lucas 2005, fig. 1.5).
    Basically, what this diagram tells me is to represent continuity and change in
    the same breath, I need to give time a depth, a stratigraphy; not in the conventional
    sense, but rather to show that the time of object design or form is layered and
    that any change takes place against continuity and vice versa. So for any one
    dated object, like your miner’s lamp or my clock, we should always think of it
    almost as a vertical slice or cross section through one of Husserl’s time diagrams
    where it incorporates elements of variously older or recent traits. This was what
    Kubler was also telling me in his discussion that all forms comprise a blend of
    convention and invention, the old and new. It seems to me that when we combine
    this with your vector analysis of the minds, it tells us that this combination
    of invention and convention is never equalized but sometimes you have more of
    one, sometimes more of the other, creating that snakes line.


    *But what about you? Who were your influences*


    Laurent: I came to Cambridge to Sander van der Leeuw, who offered to be my PhD
    supervisor, and Alain Schannapp, who helped me to get a grant from the CNRS (the
    French National Centre of Scientific Research) to support my university fees.
    At that time, the CNRS was funding French scholars to study in British universities.
    Alain had been my professor at the University of Paris-Sorbonne, when I was a
    Master’s student.

