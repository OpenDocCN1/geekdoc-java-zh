    ## 起初 15


    这对你的研究来说一定是一个伟大的发现吧？


    洛朗（Laurent）：说实话，这确实很不错，但对我为了写博士论文所寻找的东西来说并没有什么帮助……我意识到我在之前的挖掘项目中彻底失败了。你说我困在自己那的一块后结构主义的领地里，我也困在我自己的世界里。那时，我们有一位活着的上帝，统治着法国史前史。他的名字是安德烈·勒罗·古尔（André
    Leroi-Gourhan）。周围的人习惯称这位先知为“le patron”——老板。在某种意义上，他是他自己的后结构主义者，因为他完全改变了我们在上世纪70年代实践和解释史前考古学的方式。粗地说，之前的史前考古是一项关于洞穴和岩体中观察到的地层学和考古序列的问题；说来说，它是基于对过去的垂直研究方法。勒罗·古尔将其转变为水平研究：他开发了对“史前地面”的细致剥离，重构了生活在那里的人们的手势、实践和习惯，无论他们在地面上留下了多么卑微的遗骸。他的方法确实是革命性的：一种“民族学挖掘”试图首次并根据最基础的考古证据，去解读人们是如何行为的、做过什么，也许他们想过和感受过什么？


    我是他的信者之一。我以为我可以对其他历史时期做同样的事，例如铁器时代的凯尔特考古学。比如，在墓丘上。在史前地面上，人们在同胞的坟墓周围举行仪式，他们进行祭奠，他们他们对对那些埋在土里的物质产品遵循了某些仪式。然后，他们用巨大的土堆或石堆密封了这些“葬礼地面”，覆盖了数百、上千平方米的面积。如果我能像勒罗·古尔的团队在潘斯文特（Pencevent）那样仔细地挖掘，我就可以发展出一种有趣得多的铁器时代考古学：一种关注人而非对象的学科。


    这是一个绝妙的计划，但问题在于，我从未发现过任何“葬礼地面”。我挖掘了数十个墓丘，得到的并不是我所预期的。那里根本没有地面，有时只是模糊的地层，厚度约10厘米，包含细小的、散落的陶片，在某些地方是燧石片或风蚀的碎块……


