    ## 66 当下


    历史。我们的想法是汇聚许多从事当代过去考古工作的学者，看看他们对这种特殊的时间性（temporality）有何看法，与更传统、更常规的考古过去方法相比。但你是对的——我当时并没有意识到这一点——梅斯（Metz）的研讨会已经导向了哈特格（Hartog）的“当下主义”（Presentism）问题，将其视为人类世这一时代时间性的一种征候。


    但你呢？你是如何看待这种作为时间性的“考古学当下”的？


    Gavin：老实说，这并不是一个我深入接触过的话题。自2014年以来，我已经在写作和演讲中关注过并稍微用过哈特格的观点，但总是带着一种几乎是不信者的姿态，或者说用不可论者更合适。为什么呢？我想从内心深处，我对任何主张我们时代例外性的理论都持怀疑态度。尽管哈特格的论点在某种意义上是莱因哈德·科泽莱克（Reinhard
    Koselleck）早期历史性理论的延续——即当下主义作为紧随现代性或“新时代”（Neuzeit）之后的时代，但现代性始终是时间例外性的原始时代，当下是独特的。当下主义只是现代性这一修辞的另一个转折点，通过它来阅读哈特格可以明显看出，当下主义与现代性之间的唯一区别在于，对于科泽莱克来说，当下仍与未来挂钩（但与过去无关），而在当下主义下，现在也被放逐了。当然，这忽略了科泽莱克和哈特格在分析这些时间制度时的许多差异，但更大的观点在于，在这两种情况下，当下都具有历史中一个特殊时期的地位。


    当我说我对时间例外性表示怀疑时（它与现代性或当下主义等概念不同），这并不是说我不赞赏当下的“差异”。全球化、人类世、金融资本——正如你提到的，这些无疑是我们时代的独特特征，也是品质。无疑，我们也生活在一个人类灭绝威胁也是新事物的时代。但这一切仅仅说明，当代时代确实有与以往时代不同之处——但这适用于任何时代，这意味着从某种意义上说，这仅仅是一个时期划分（periodization）的问题。这也让我想到了考古学以及


    ## 67 当下


    当代过去的考古学。如你所知，这在21世纪初由维多尔·布赫里（Victor Buchli）参与了塑造，从那以后我在这个领域的工作其实很少，尽管我的历史考古学确实延伸到了20世纪。我是如何看它的？老实说，我想当时我只是将其视为历史考古学的简单延伸，作为一种时期划分，我主要的关注的是将其与纯粹的方法论计划区分来，例如民族考古学或中介考古学（middle
    range），这些计划曾损害了20世纪80年代由拉蒂耶（Ratye）和希弗（Schiffer）试图建立这一领域的早期尝试。但当代过去的考古学仅仅是另一个时期划分吗——就像铁器时代考古学或中世纪考古学一样？我有一部分想说不是，但我找不到支持这一论点的理由，除非回到当下的例外性。无疑，每个时代都有其独特和特殊的特质，为什么要对当前的时代大做特做呢？


    现在我还有其他定义当代过去考古学的方法——一种认为它是考古学向某种非常类似于遗产研究的转型。但另一种是将其定义为一个时期——但一个与众不同的时期，即例外时期。例如，我们的同事阿尔弗雷多·戈萨莱斯-鲁伊斯斯（Alfredo
    González-Ruiz）就是定义的，特别是在超现代性（supermodernity）和大规模毁灭的时代。根据我读过的内容以及你之前的说法，这也是你的一种观点。再次，我承认我们面对的是当代独特的方面，在规模和速度上——这些是晚现代性长期承认的修辞（我想起了大卫·哈维
    David Harvey 或保罗·维里约 Paul Virilio 的著作），但也认为这确实是一个提升当下的案例，因为这正是戈萨莱斯-鲁伊斯斯所生活的时代。这又回到了时期划分的问题。在某种程度上，当你生活在一个时期时，你倾向于将其看作是特殊的，与之前的任何事物都不同。但这难道仅仅是生活在这些时代的产物，而不是拥有历史距离吗？


    乔治奥·阿甘本（Giorgio Agamben）曾写道，要真正与一个时代同时，你必须生活在其之外。我想甚至是你第一个指给我看阿甘本的这篇短文。也许我在这里误解了阿甘本，但对我来说，理解当代性（contemporaneity）的本质，以及当代考古学非常重要。它要求我们以某种方式尝试将自己放在当下之外——无论是在之后、过去还是未来，而不是在某个无限的当下。如果非要说的话，我把哈特格对当下的描述看作是一个觉醒：停止沉溺，去想象吧！


    ## 68 当下


    所以，你问的关于我如何看待考古学当下作为时间性的问题；我认为这是一个红��鱼（误导）。在很多方面，这里的深层问题是，当我们正经历一个时期时，如何可能定义一个时期或时间？在某些方面，这是一个古老的历史问题，这就是为什么对于许多历史学家来说，当代史是不可能的。我不同意这一观点，但危险在于，你会走向另一个极端，并发现它是如何地完全无法逃避。对我来说，这正是哈特格的当下似乎指向的地方。相反，我需要更深入探讨时期划分、当代性以及考古学作用的问题。


    洛朗（Laurent）：我同意你的观点，即我们的当下与任何时期相比并不一定是例外的。在某些方面，当我们正经历一个时期时，如何可能定义一个时期或时间？在某些方面，这是一个古老的历史问题，这就是为什么对于许多历史学家来说，当代是不是不。我不同意这一观点，但危险在于，你会走向另一个极端，并发现它是如何地完全无法逃避。对我来说，这正是哈特格的当下似乎指向的地方。相反，我需要更深入探讨时期划分、当代性以及考古学作用的问题。


