    Gavin: This throws up an interesting issue. In purely formal or design terms,
    there is no difference between Roman pottery and clocks. We can study both and
    look at how technology, materials, design intertwine. But in temporal terms there
    is an important difference. With modern objects like clocks we often have better
    information on dates as with your miner''s lamps we can start with time under
    control, to speak. Conventionally with archaeological objects, the situation is
    not like this — in fact it is the opposite: you are often using form or design
    to elicit chronology, that is your goal, not your starting point. The advantage
    of modern objects is you can re-examine time without worrying about chronology.
