    ## 86 未来


    将保护延续到未来未定义的时期，以及我们希望我们的工作对未来学者以及学科本身所产生的影响。这一切向我暗示，这里一个联结过去与未来的关键问题在于“继承”，即从过去将事物传递或传传给未来。因此，现在与时间的关系也变得更加清晰：这种“传递”在多大程度上与时间的流逝有关？


    未来当然可以从许多方式来构想，但我认为，作为考古学家，正是在这种过去与未来的关系中，我们才最能做出贡献。在人类活动世时代，现在有很多关于考古学可以扮演的角色的讨论，即将挖掘我们的过去视为一个收集生活方式、应对环境变化、韧性形式等的过程。将过去视为思想的宝库、生活的解决方案，这些方案可能帮助我们规划意料之外的未来。这些听起来很好，但这也是一个非常古老的观点，即历史作为***magister
    vitae*****生命的导师**），人们可以从中获得模型或范例。而从过去的错误和缺失中学习，在这里是了某种更具体、更具物质性、更具时间性的东西，而“继承”这一概念涵盖了这些。因为继承作为一种物质过程，正是一切发生的地方；可以说，时间本身的流逝就是由多样的“传递”过程构成的。其中一些正在通过新的研究解决，例如罗德尼·哈森（Rodney
    Harrison）、康尼利·霍洛夫（Cornelius Holorf）等人管理的遗产项目，将遗产和保护视为一种未来的装配实践.¹种子库、核废物仓库等，都是这种继承物质性的很好的例子。但保护财富的政府和机构结构也是如此；几年前当我阅读托马斯·皮凯凯（Thomas
    Piketty）的书《资本》时，真正令我震撼的是，继承在创造财富不平等中确实起了核心作用.¹。我认为通过挖掘继承结构，考古学家可以对理解和改变我们的未来提供最有用的贡献。


    但既然你问了这个问题，你一定也有你自己的回答。那是什么呢？


    洛朗（Laurent）：我必须说，这看起来像是一个关于未来的奇异问题，因为考古学理上应该主要关注过去的痕迹。但正如你所说，做考古学家是一项面向未来的传输工作：我们尽力将现在的考古遗产以及关于它的积累知识传递给下一代。


    但更深层地，正如你所暗示的，任何物质创造都是发给未来的信息。例如，人们并不指他们自己去世时父母的坟墓会被抹除，这就是为什么他们要维护破损的墓室。所以，我们现在的物质创造将成为未来的考古遗产：我们的加油站、我们的机场、我们的超市……嗯；正如英语里说过的，*this
    is interesting*（这很有趣）——意思是“为什么不此呢”，但实际上并不是这样一个令人兴奋的想法！


    如果遗产项目是在传统的历史视角内构想的，它们其实是一个相当无味的想法：历史学家雅克·勒戈夫（Jacques Le Goff）写道；³**将历史切成切片**”，也就是说，仅仅将我们现在物质文化的创造视为下一个历史切片。你问到时间性何何时对于理解阿甘本（Agamben）意义上的“临场性”如此关重要（指的是我们现在中未来的迸发）？正是因为这个原因：因为如果不是这样，它将缺乏任何考古学兴趣。


    这让我们再次回到了物质性。如果我们认为考古学基本上是研究人类活动创造的物质转化，那么我们的现在就是有以来最具有考古学的时代。我们对景观的物质影响、我们每天生产的文物的多样性和数量，远大于人类历史任何其他时期。同样，与过去相比，我们建筑和产品的耐用性也超越了任何规模；就想想核废物吧，其中一些将在数十万年甚至数百万年内保持高度放射性。


    有些人将这种前所未有的状况称为人类活动世。新奇的处不在于人类影响的本质，而在于它的规模。问题不在于知道人类活动世是否是一个新的地质时代——或一个新的考古时代。它既不是测定它的开始，也不是在想它是否是一个富有成效的概念，或者是自战后以来加速的现象的标签。而是要评估它对考古学产生了什么影响。


    所谓的人类活动世的“大加速”对考古学科的影响是巨大的。预防性考古学的发展——在英美世界被称为商业考古学——是人类活动世对居住景观压力的直接影响。我们在项目将要抹除其目标地点的物质记忆的地方进行挖掘，挖掘巨大的表面，其中有些涵盖了数百公顷。我们不再仅仅研究考古遗址，而是主要是考古景观。我们必须挖掘所有受这些开发项目威胁的东西——即使是最近历史时期的遗迹。在欧洲大陆——两次世界大战的遗迹高度集中的地区——当代考古学的发展与预防性挖掘直接相关。我们可以说这是人类活动世对考古实践的间接影响。


    但我并不想在这个问题上花费太多时间，所以我想问你，如何看待人类活动世对考古学影响这个问题？


    加文（Gavin）：嗯，正如被生动地指出的，商业或开发驱动的考古学的大规模兴起是人类活动世对居住景观的直接产物……（注：原文此处存在大量重复和错误，翻译已根据逻辑要求进行整合）。


