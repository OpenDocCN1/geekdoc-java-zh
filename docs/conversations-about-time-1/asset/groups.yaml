    这是愚蠢的，因为，没有任何一种方法是真正有效的。效果最好的方法在结果上最模糊、最不准确，而那些我们通常认为效率最低的。我开始理解为什么它不起作用。正如你所指出的，每一件器物、每一种材料创造都是新旧的复合体。这确实是一个分层的结构，我们的“层”在这里是你的钟表形状的类型学细节，或者是我矿灯中的技术部件。但，与任何遗址一样，这些“层”的沉积并不是规律的：它们在任何地方、每一个物体上、同一个时间都不是相同的序列。


    # 12 起初


    很多时候，“新”的东西会提前出现。大多数时候，这只是在某处发明或添加的一个细节。它在后来会变得“流行”，但并不一定。有时它出现了，然后消失了。


    那么在这种情况下，测序法意味着什么呢？它们将属性归类；它们对相似的进行排序，推开不相似的。它们将这些与“新”的早期出现相关的零散属性，与属于最后一个“常态”的大多数属性挤压在一起。这就是为什么你经常在考古年代学中得到这种“手风琴效应”的原因：第一个类型年代学时期非常长且相对空虚——从类型学属性来说——然后突然是一个较短的、相当充实的实的时期，接着又是一个漫长而乏味的序列……这也是为什么我们在考古学中有许多“过渡期”的原因：它们基本上是旧事物与新事物的混合物，无法进行分类。这一切从未在“真实时间”中存在过；这一切只是我们对过去进行测年传统方法的副作用。


    **Gavin：** 这真的非常有趣。我完全明白你说的手风琴效应——但我一直认为它在某种程度上反映了创新实际上是如何发展的。这也是你在技术故事中也会听到的，我也听过同样的观点应用于达尔文进化论中的新物种。每当你得到某种新事物时，就会出现变异和实验的洪流，但最终，大部分都消失了，只有一两个生存下来成为规范。但你似乎在说，这仅仅是我们年代学方法的结果，并没有真正捕捉到事物的发展方式。


    **Laurent：** 你描述的这个通用过程确实发生在我那些矿灯上，在时间的真实过程中。我在这里说的是，当它们试图按照理想的线性时间进行排序时，测序法对这些个体的年代顺序做了什么。问题从这里开始。我的意思是，这些统计方法切断了属性出现和消失的这种持续流动，创造了人为的类型学分组。当然，你可以发现，只有当你拥有特权，能够比较所发生的“真实时间”与通过统计重构的“人工时间”时。


    # 起初 13


    我们在考古学中常用的测序法是基于对属性首次出现的寻找。在我们提供的标准组合中，它们寻找看起来是先出现的，然后是其次，以此类推……并重新排列矩阵以获得对角效果，这种效果被认为翻译为跨时间的移动。换句话说，这些测序法基于这样一个原则：规律且不连续的变化可以作为时间的直接测量值。


    这很有道理，但通过这样做，这些方法实际上扭曲了器物在“真实时间”中的顺序。测序法无法处理在早期属性首次出现（它们突然在某处出现）与后来被大多数人接受之间，往往存在一个潜期的事实。

