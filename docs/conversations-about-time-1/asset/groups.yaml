    # Epilogue


    The conversation presented in the pages of this book took place over three months.
    It is a record of two archaeologists who knew each other''s work well, yet still
    felt compelled to reach a closer understanding. As should be abundantly clear
    after reading this conversation, we constantly circle around an issue, sometimes
    getting very close and sharing the same views, sometimes to separate again. As
    Laurent put it, we are like two planets in orbit, sometimes our paths converge,
    at other times we are on opposite sides. So what is it that we both seem to agree
    upon and where do we differ?


    Many of the differences derive simply from our personal and cultural intellectual
    backgrounds. For Laurent, Freud on memory and the unconscious as well as the work
    of Walter Benjamin in Paris and the Arcades Project have provided fruitful ways
    to explore time in archaeology, for Gavin, philosophy is almost always the first
    port of call, although in some ways he is also like a magpie, picking up anything
    that looks useful. Indeed, this may reflect a broader cultural difference between
    anglophone and francophone methods of scholarship. For Gavin, philosophy became
    a way to see archaeological problems he could not see before; it helped to generate
    questions and problems. In contrast, for Laurent it is always the archaeology
    that first shows us the problems, while the philosophy comes later as in some
    ways, these different ways of working often acted to obscure underlying commonalities
    as our conversation flows. Indeed, if we focus primarily on the matters of concern
    – the nature of time and archaeology – ultimately, we feel there is more agreement
    than disagreement. Three issues in particular stand out: the distinctness of archaeological
    time; the relation between the past and the present; and the nature of past time.'
