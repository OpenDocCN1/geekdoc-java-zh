    # 起初 19


    我对考古思想史的兴趣直接源于他的教学。11 在剑桥，Sander 与 Anick Coudart 在一起，当他们开始在艾恩谷挖掘新石器时代定居点时，她一直是让保·德穆尔（Jean-Paul
    Demoule）的女友。在我还是学生时，让保和 Anick 也在教考古学，还有一位非常不错的人——遗憾的是他去世了。我叫 Serge Clerizou，他在阿曼担任考古学家工作。Pierre
    Lemonnier 曾是 Anick 的男朋友之一——也在那里。作为一名人类学家，他在巴布亚新几内与 Maurice Godelier 一起工作。


    这样说起来，听起来像是克劳德·索泰（Claude Sautet）的法国电影……但私下里是一群朋友，彼此关系亲密，多年来我一直与他们保持联系。我喜欢他们，因为与“省外”（即巴黎以外的地方）那些非常讨厌他们的“传统”考古学家相比，他们更具原创性、明智且开明。他们有理由：“巴黎人”站在了英美“新考古学家”的一边。1980年，他们出版了一本书《今日考古学》（*Archaeology
    Today*），对我来说是一次启示：12 在那里，我发现了拉特奇的垃圾工程（Rathjie''s Garbage Project）、哈里斯矩阵和测序法的使用、等级规模分析以及英国和西班牙考古学，当然还有正在进行的过程考古学（process
    archaeology）的辩论。


    因此，我从这个知识分子在20世纪90年代搬到了剑桥。在那里，我与 Sander van der Leeuw 说了很多，特别是关于创新与环境；与 Michael
    Shanks 谈了摄影与记忆；与 James McGlade 谈了很多，但都是关于历史的……和你一样，我也阅读。我尽所阅读，把所有时间花在哈登图书馆（Haddon）和大学图书馆。我试图读所有我没读过且应该知道的书。当然还有“经典之”：Binford、Renfrew、Clarke……
    死亡考古学和社会考古学，这是必然的：Chapman、Rowlands、Binham…… 但越来越多的人在研究考古记录的本质；我是它记录了什么，以及是如何记录的：Binford、William
    Rathjie、Michael Schiffer13


    因为我正在远离 Leroi-Gourhan 的方法论影响——正如我意识到的，正如 François Bordes 所说，史前地层确实是“一个信仰问题”14——我没有读过多少后过程主义者（postprocessualists）。我感觉以那种方式接近考古证据有点像追逐彩虹：


    # 20 起初


    看到它，你认为你可以抓住它；但当你向它走去时，它却在后退。但我也没有回到过程主义；我正在寻找另一种道路，一种能够捕捉考古记录特殊性的不同方法。


    **Gavin:** 法国考古学家看起来和英国考古学家一样无害！但听起来我们来到剑桥时都怀着极大的求知欲和阅读渴望，想要阅读并发现当时考古学界发生了什么。但你谈了很多考古学的影响；那么其他影响呢，也许是哲学方面的？我认为英国学术界一直有点羡慕法国哲学更融入通智知识生活的方式；但同时，令我惊讶的是，法国考古学家似乎很少引用或参考哲学家，而在英国，这在20世纪80年代和90年代几乎成了一种常态。


    那么，哲学当时是如何融入你的考古学的呢？或者融入过吗？


    **Laurent:** 就像你和我从同一座山的两边挖掘隧道：在你的英式走廊里，你阅读哲学著作是为了提供一些理论框架，让你能够对你的考古数据进行思考；而在我的法国这边，我试图先从我的考古材料中提取这个框架，然后去印证那些思想家的著作。这绝对是两种不同的视角，这也是为什么我们有时很难从相反的两面理解彼此。


    显然，你走在我的前面！我直到剑桥生活的后期才接触哲学，看着柏格森（Bergson）的《物质与记忆》（*Matter and Memory*）、胡塞尔（Husser）以及海德格尔（Heidegger）。基本上，我们是一样的人。


