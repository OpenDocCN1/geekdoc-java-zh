    # 前言


    我们其中一人（Gavin）刚刚完成了一本关于考古学时间的书籍草稿，并询问另一位（Laurent）是否愿意在出版前审阅并提供一些评论。他友好地答应了，但并没有寄回文件，而是通过一系列邮件发送了他的想法，Gavin
    有时予以回复。在交流过程中产生了一种对我们立场的讨论，当 Laurent 正在完成 Gavin 的手稿时，他建议我们也许应该将这种交流发展成一场长时间的对话：“因此，也许我们应该把写书看作是一种对话……讨论我们所知的和未知的，我们如何处理事情……如何思考……”那是
    2020 年 9 月初。三个月后，我们写了大约 4 万字的对话，这成了本书的基础。


    毫无疑问，本书写作期间世界所处的处境对这一过程是有利的。2020 年初袭击我们的新冠肺炎疫情改变了我们的生活，而且我们在 2021 年初写此时，它仍在持续；很难预测它将产生什么长期影响。但在此期间，我们许多人发现协作写作——这本应该是网络和在线平台理想的活动——变成了一个机会。讽刺的是，正是将我们困在家中的情况让我们最终聚在了一起。正如我们后来在对话中所述的，我们从
    90 年代初在剑桥读博士时起就彼此了。我们都在研究时间课题，尽管我们关注对方的工作，但直到现在我们从未合作过。


    # 2 前言


    然而，也许这种合作不可避免。2014 年，Laurent 在法国梅斯举办了一场研讨会并邀请 Gavin 参加。三年后，Gavin 邀请 Laurent 来冰岛雷雅雅未担任博士研讨会的客座讲师。机会虽然罕见，但让我们得以见面交流思想，更好地了解对方在做什么、想什么。我们双方都很清楚，我们围绕相似的问题旋转，但往往处于不同的角度和立场。我们还来自非常不同的知识背景；尽管都曾在剑桥学习过，但此时我们大部分的知识框架早已建立，我们之间的差异证明是令人沮丧的，导致我们误读或未能完全理解对方的话。


    可能正是这种挫败感，以及对共同关注点的认可，促使我们开始了这段对话。与其分别撰写论文和书籍，我们都看到了参与一场长时间且深度对话的益处，这可以解开挫败的结，并使我们能够探索困扰我们双方的问题。事实上，这不仅是一个讨论时间的机会，也是复兴一种古代科学写作体裁的机会：书信体（epistolary
    correspondence）。众周知，考古发现的早期出版通常采取信的形式，但在许多方面，这些出版的通信可以追溯到 17 世纪及更早。在飞机火车出现之前的，长途旅行仍然是一项巨大的投入，与同事交流思想很大程度上通过写信进行。生活在全球流行病中，我们今天在
    21 世纪发现自己处于类似的境地——尽管这种通信的速度在三个月内完成（而这在 17 世纪可能需要三年），这提醒了我们时间不仅是我们对话的话题，它还构建了我们对话的性质。


