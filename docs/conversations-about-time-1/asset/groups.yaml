    archaeological sites’. Well to me, this just reads, again, like a definition of
    middle range theory. But I don''t want to be obtuse so I am going to try and understand
    this in terms of what else you have said, specifically this issue of critique.
    Part of the problem relates to general — how I am using the middle range theory
    and indeed, in theory — which is a please reason so maybe this is what I need
    to address next.


    You are right about one thing — perhaps especially in the U.S. (and to a lesser
    extent in Britain), archaeologists expect to offer some kind of system or paradigm:
    a tool for how to address the many interpretive problems we face when encountering
    archaeological remains. You say that all you are trying to offer critique and
    this results in all kinds of misunderstandings and false expectations. I think
    there is definitely an important point here about theory in general and how it
    is viewed by Anglo-American archaeologists and many European ones; I agree that
    the paradigm or system model is very problematic, even if it does occasionally
    seem very pragmatic (There is probably a connection here to the American philosophy
    of pragmatism, but not in the obvious way. But that another). Yet for an Anglo-American
    ear (or my ear at least!), critique is always half the story; critique is vital
    and has been a part of Anglo-American archaeology all along, especially political
    critique which was central to post-processualism and its connection to feminism
    and postcolonialism. But critique is like saying — ‘hey’, I just point out the
    problem, it’s not my job to build on critique to find ways to address disciplinary
    problems, to discourse forward. But I am guessing your conception of critique
    might include a broader remit, so howite you will expand on this.


    Moreover, that’s why I find Millie''s Camp such a strange example for you to stick
    with; a cautionary tale, a critique, reminding us of where we went wrong. I see
    it as a precursor to middle range theory which tried to pick up the warnings offered
    by cases like Millie''s Camp and turn them into something that we can use — to
    help us find solutions, not just point out the problems. Now for Middle Range
    Theory got way too ahead of itself, believing it could come up with the Rosetta
    stone for material traces; but in the attempt, we learned an awful lot and still
    are. I don''t see MRT pointless, rather we just need to accept it for what it
    really is: old fashioned analogy, despite attempts to make it otherwise. It is
    never going to give us laws or rules, but it gives us ideas. Of course we should
    not call my version of the MRT, as the term conjures up very specific processual
    agendas, let''s not worry about that. But the point is, we need to always find
    a balance between theory and critique which offers no solutions, and theory as
    a pure tool or system that pretends to solve all our problems.


    So let finely try and answer your question and tell you I stand. As already hinted,
    I find it hard to think of the archaeology of the present in terms other than
    either a period designation or a kind of middle range (which I take in very broad
