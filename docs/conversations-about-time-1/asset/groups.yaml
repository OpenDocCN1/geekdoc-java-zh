    # 关于时间的对话


    Gavin Lucas 与 Laurent Olivier


    本书呈现了两位著名考古学家的对话，他们几十年来一直在自己的学科领域内探索“时间”这一概念。这是一场讨论通过他们独特的视角，对考古学中时间的关键问题进行了探讨，这些视角有时会交汇，有时会产生碰撞。


    核心内容包括：对考古记录中变化与时间本质的讨论、现在与过去的关系、时间与人类世考古学目标以及学科实践之间的联系。对话置于作者本人在职业生涯中对时间主题观点如何演变的背景之上，为了解这两位顶尖学者如何思考和辩论一个对该学科具有至关重要的话题，提供了一个亲切且具个人化的见解。


    所有对当代理论和时间话题感兴趣的考古学家都会发现这本书具有价值。对于想要坐在第一排观看关于该主题现场辩论的学生来说，这本书是比传统教科书更极具价值的补充。


    Gavin Lucas 是冰岛大学考古学教授。他的主要研究方向是考古方法与理论以及现代世界考古学。他最近的著作包括《书写过去》（Writing the Past,
    2019）和《制造时间》（Making Time, 2021），这两本书均由 Routledge 出版。


    Laurent Olivier 是法国圣日曼（Saint-Germain-en-Laye）国立考古博物馆凯尔特与高卢部门首席策员。他的主要研究方向是考古历史与理论以及铁器时代考古学。他最近的著作包括《凯尔特之地：高卢的回忆》（Le
    Pays des Celtes: mémoires de la Gaulle, 2018）和《凯撒对抗维西甘布托克斯》（César contre Vercingetorix,
    2019）。


    2022年首版

    由 Routledge 出版

