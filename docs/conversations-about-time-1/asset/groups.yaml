    # 6 Time out


    In this last chapter, we pause and look back over all we have said - not to sum
    up but rather to reflect on what was not said. What did we omit from our discussion
    that our readers might have expected or liked to hear about? Why did we omit them:
    did we forget, did we deliberately avoid them, or were we just too blinked to
    notice matters that are of major concern to our colleagues?


    **Laurent:** Surely, Gavin, a lot of people are not going to be very happy about
    what we have said here. Here are going to say that our perception of archaeology
    is outdated because we do not acknowledge the latest developments in archaeological
    dating, ignore recent approaches like deep history and underestimate the role
    of time in other fields within the Human Sciences. How would you answer such critiques?


    **Gavin:** You are right Laurent, there is a lot we don''t discuss. This after
    all, was a dialogue exploring the intersections of our interests and inevitably
    will get left out, things which lie outside our interests. And yes, we are both
    getting old and no longer the young scholars who met in Cambridge more than quarter
    of a century ago! But I think there are good reasons why we ignore some of these
    things you mention.


    Let’s take the issues of recent developments in absolute dating, specifically
    Bayesian modelling of C14 dates on the one hand and deep history on the other.¹
    In some ways, the two are diametrically opposed: where deep history reveals in
    the long term, the Bayesian methods are all about bringing the resolution down
    to human generational scales. If deep history is about making history more like
    archaeology in its long-term view, Bayesian dating is all about making archaeology
    more like history with its tracing of events at the human scale. But of course,
    in the end, share the same view of time and the past as a sequential, linear flow.
    In this sense, while I think Bayesian methods are marvellous and will enable us
    to produce far more sophisticated narratives, they don''t really change anything
    when it comes to our understanding of time. These developments are being described
    as revolutionary and in some ways, they are; but it all depends on what kind of
    revolution you are talking about. This is a revolution in'
