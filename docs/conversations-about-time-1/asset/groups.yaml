    # In the beginning 23


    ![](img/97e9b797cfbc473816012daed7863bbe_31_0.png)


    Figure 1.5 Cross-section of the Tell at Troy, as excavated by Heinrich Schliemann
    (after Geißler, 1902, fig. 6).


    We were still here but they meant something slightly different. So, in a way,
    the path was still acting across the accumulation of what had come after, which
    bore its distinctive imprint. The past constrains the future by its presence.
    And it is still present, although transformed and sometimes not recognizable anymore.
    To put it in another way, the past is pointing towards the future, perhaps merely
    as an effect of the course of time as a product of its reinterpretation. When
    reinterpretation stops, the past gets frozen. And we can dig it.


    You know this other figure (Figure 1.5), this is the section of the Tell of Troy,
    reproduced in Troja et Ilion, published by Wilhelm Dörpfeld in 1902.¹18 Freud
    had this book in his library. This is a sketch, but look at the succession of
    ramparts, one on top of the other: as in the Hochdorf grave, they are maintaining
    and ‘re-interpreting’ a feature belonging to a vanished past, whose presence exists
    only in its remembrance: an ancient fortified city, deeply buried in the ground.


    And all of this happens in the ‘present’: the different presents that have come
    afterwards, during which these old remains been reactivated, and our present,
    now, in which the site of Troy is still standing. It is Freud who helped me to
    understand that the key question of archaeology is not the past se, but the memory
    of the past – since the past had been reined by the process of memory itself.
    And again it was Freud who convinced me that the location of the past in this
    different approach wasn’t so an imaginary place in the past – as we are used to
    considering it in archaeology: the Neolithic, the Iron Age, the Middle age ...
    but the present itself, or more precisely what may be called the ‘après-coup’
    of the past.


    Gavin: Freud’s sketch is incredible and makes me wonder the extent to which Husserl
    and Freud may have been aware of others work or whether there is another connecting
    link. Husser''s diagrams from 1905-7 so somewhat later than the Freud diagram
    you showed, but both thinkers drew on the work of Brentano and possibly there
    is a common source here as Brentano was using similar diagrams from 1873. But
    whatever the story behind these diagrams, the way we came to similar conclusions
    from two different directions is very interesting. Of course the interest of Freud
    in archaeology is well known and as you pointed out, the past carries over into
    the present archaeology does share many affinities with Freud''s notion of memory
    and the unconscious. Although I was also reading Freud at the time, I did not
    make any of the connections you did. My closest brush to your concerns was in
    a paper I published just after my PhD called ''Forgetting the Post'' where I basically
    said archaeology was nothing like memory as Freud discussed; that deep past, prehistory
    comprised a radical forgetting, that it is a past that was ours to remember. I
    am not sure how I feel about this paper today – there are some nice poetic moments
    in it, but my main argument was more about prehistory as an alien past and how
    we confront that fact. This was in part, the influence of Ricoeur, Heidegger and
    Levinas and the connection between alterity and time. What escaped me completely
    was the deeper mechanisms of time and memory that Freud was using and which you
    picked up on.


