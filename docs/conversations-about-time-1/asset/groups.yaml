    # Life after Cambridge


    **Laurent:** Oh yes indeed, we! When you were deconstructing the notion of archaeological
    record, I was, at that moment, looking for echoes of what I had seen about archaeological
    time in the works of people who had already encountered this strange behavior
    of materiality. I had already read them separately, but for the first time I was
    able to see how complementary these people were; their works forming some sort
    of abstract constellation.


    The brightest star, for me, was obviously Walter Benjamin and his *Theses on the
    Philosophy of History*. In his powerful and poetic language, he put words on the
    weird trajectories of the archaeological record I had been observing. Focusing
    his attention on the materiality of history—exploring the many covered streets
    or arcades (the *passes*), by his contemporary Benjamin of the 1920s, as a fossilized
    product of the 19th century—Benjamin rejected the conventional approach of history,
    in which each new event wipes out the previous one.¹ Above all, he presented this
    rejection of historicism as a fight against conservatism. According to Benjamin,
    the past isn''t only defined by its encapsulation in the past—as the historicists
    claim—but it emerges within the present, as a kind of active memory. I cannot
    resist saying that his 18th century can be read as a manifesto for anti-historicism:
    archaeology itself with establishing a causal connection between various moments
