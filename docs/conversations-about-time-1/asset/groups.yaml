    such an exciting idea!


    Heritage projects are rather a dull idea if they are conceived within the traditional
    perspective of history: the historian Jacques Le Goff wrote;³ cutting history
    into slices'', that is to say, merely considering these creations of our present
    material culture as the next historical slice. You asked when temporality is so
    crucial for the apprehension of the presence in Agamben''s sense (I mean the burst
    of the future in our present time)? Precisely for this reason: because it is lacking
    any archaeological interest if it isn''t.


    This brings us back to materiality again. If we consider that archaeology is basically
    the study of material transformation created by human activity, therefore our
    present time is the most archaeological that has ever existed. Our material impact
    on the landscape, the diversity and number of artefacts we produce daily, are
    far greater than that of any other period of human history. Similarly, the durability
    of our constructions and products is also beyond any scale, compared to those
    of the past; just think about nuclear waste, for instance, some of which is going
    to remain highly radioactive for hundreds of millennia, or even millions of years.


    Some people call this unprecedented situation the Anthropocene. What is new is
    not the nature of the human impact, it''s its scale. The question is not about
    knowing if the Anthropocene is, or is not, a new geological era – or a new archaeological
    age. It is not either dating its beginning or wondering if it is a fruitful concept,
    or the labelling for what has been accelerating since the Post-War period. It
    is to assess what it does to archaeology.


    And the impact of the so-called Great Acceleration of the Anthropocene on the
    archaeological discipline is huge. The development of preventative archaeology
    – which is called commercial archaeology in the Anglo-American world – is a direct
    effect of the pressure of the Anthropocene on the inhabited landscape. We dig
