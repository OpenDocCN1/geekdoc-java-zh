    The issue of the past remaining in the present that was raised in the previous
    chapter is explored further here, specifically in relation to the larger goals
    of what it is, that archaeology is trying to do and the kind of stories it writes.
    The traditional goal of archaeology as ''the reconstruction of the past'' is questioned
    because it possesses a notion of the past as a time before and separate from the
    present. Even if archaeology acknowledges that this past only comes to us through
    the remains nonetheless tries to filter out this property of ''remaining'' or
    what Laurent calls ''post-history'', to try and get back to some pure past, ''it
    once was''. This is the basic premise of formation theory, for example. But there
    is no such thing as pure or original past, any more than pure or original present.
    Materially, time is always a conjunction of past and present, a polychronic or
    heterochromic ensemble and the property of ''remaining'' and post-history need
    to be central, not treated as a methodological constraint. The key problem we
    try to grapple with this is how to talk and write about this hybrid mix of past
    and present, of multiple temporalities in a way that respects ''remaining''. Can
    we still tell stories as we used to – stories about the past as if it was a once-lived
    present? And what about history and historical change? Is conventional, linear
