    the same purpose: reconstructing, in more detail, the life of the agro-pastoral
    communities of Bronze Age Wessex. I realize now that in time, we were all encountering,
    in each of our corners, some kind of wormhole, opening onto real and new universes,
    a widening hole in the net of archaeological methods and theories. But we were
    blind at that time — at least I.


    And what about you, what were your feelings at that time? There were people who
    had a strong intellectual influence on you, or who helped you to go deeper into
    time? How did you manage?


    Gavin: I was very close to my supervisor Ian Hodder for the first year or 18 months;
    we had regular meetings and would debate back and forth; he was almost my only
    intellectual soundboard, though I was talking with some of the other PhD students,
    but mostly those who were Ian''s students. It all sounds very cliquey now, but
    at time it just seemed natural; I think it was just a case of Ian''s students
    were the ones I tended to meet. I certainly don''t recall this ever being intentional...
    but maybe that''s how Cambridge was back then. But as I mentioned earlier, there
