    # 起初 11


    从听起来确实如此。然而你是对的——在所做的工作中，我们在某些方面非常接近，尽管我们奇怪地处于孤立状态下工作。我最近一直在反思这一点；当时的剑桥是时间研究的热点，不仅有我们，还有
    20 世纪 90 年代的其他人，如 McGlade、Tim Murray 和 Geoff Bailey。也许你接触得比我多得多，但由于某种原因，我并没有真正利用这种环境；我当时困在后结构主义的一个角落里，追求着自己的思想道路。直到多年以后，我才真正开始欣赏这些考古学家的工作，尤其是你的工作。


    但也许你可以告诉我你的实验，就是那些关于矿灯的实验。和我的钟一样，它们有日期标记；但当你把考古学方法应用于它们时，你发现了什么？发生了什么？


