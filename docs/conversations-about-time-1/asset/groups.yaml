    # 112 Time out


    Gavin: I don''t know that I could clarify, but then this will probably depend
    on the reader. We are no doubt aware that this conversation might sometimes have
    become too introverted, as if it were a private conversation to which a reader,
    especially one not familiar with our work, may feel excluded. This is a risk that
    comes with the territory. We have discussed some of these issues may lack clarity
    even to us. We have a lot of concepts here and are not only trying to understand
    each other, also trying to understand these concepts. So I have no doubt we did
    not do justice to issues as entropy, emergence, survival or persistence, and if
    the reader finds our discussion sometimes unclear, I think in this part will be
    due to the fact that we are still struggling with these ideas too – or at least
    I am!


    Another risk of our discussion is that because of the conversational format, one
    inevitably relaxes certain rules of etiquette or even scholarly expression so
    that one may not always express something in the most appropriate manner. It is
    easy to stereotype or generalize in such a situation, and probably we are both
    guilty of this. For example, I am sure my treatment of time perspectivism was
    too abridged and didn''t reflect the diversity and complexity of work out there,
    especially as I engage with this in my other writings in a more respectful way
    (I hope!).


    Another stereotype is perhaps the difference between Continental and Anglo-American
    styles of thinking that dogged our whole correspondence; do we give it too much
    weight? Perhaps you should answer this, especially as I feel this may be something
    you feel more strongly.


    Laurent: Oh yes, I sincerely apologize if anyone could feel offended by anything
    I have said – as this wasn''t all at the point of our discussion. We spoke freely
    – like the old friends we are. But we think and feel differently and this isn''t
    just a question of personality. When living abroad for a long time, you discover
    how you are also the product of your own culture. I realized I was French at Cambridge,
    although I thought earlier I had no special cultural or ‘national’ identity. And
    by the way, this was precisely the reason why I wanted to connect with Anglo-American
    research. This doesn''t mean I'
  - '[PAGE 121]


    # Time out 113


    am proud of my identity – not at all! – but I know in which way I am different.


    You don''t feel the same as an Anglo-American tradition, because it is also a
    matter of cultural hegemony. There have been times, around the end of the 19th
    Century and the beginning of the 20th, when everything French was desirable, distinctive
    and prestigious. It was classy to wear French clothes, to speak French – in a
    word to affect being French. In such a situation, you don''t realize, from the
    inside, what that seems to be universal to you is in fact basically provincial.
    You just wonder why everyone on earth isn''t French or doesn''t behave as a Frenchman
    does...


    This French cultural hegemony has passed away for nearly a century now – and this
    is not for the world. Another one has taken its place: American culture.¹10 And
    again, one sees the process occurring: from inside culture, it is hard to understand
    how and why people from different cultures should think and act differently. The
    very instance race or feminist issues are grasped by movements such as Black Lives
    Matter or #MeToo is basically American. It doesn''t mean it''s wrong; it is peculiar.
    But conversely, it doesn''t mean other ways, other sensibilities, are wrong –
    they are just different.


    I believe that, if anything should be concluded from our conversation about time,
    it is this: mutual differences enrich us. It is more important to disagree than
    to agree, since it makes you think and search. It makes you discover, at the end
    the day. Agreement doesn''t do this; it just convinces you to believe that you
    are basically right. I have been deeply happy when you agreed with what I had
    discovered or observed, since we were, at that time, in harmony, although coming
    from two different directions. But I have been equally satisfied when you disagreed,
    since I knew you weren''t thinking I was wrong or stupid. You were just wondering
    how I had come to this point. And it was the same for me.


    This book was a journey we made across archaeological time. It has changed us;
    we aren''t the same people we were at the beginning. I believe it has made us
    more tolerant and patient, more thoughtful toward each other. I speak for both
    of us when I say that writing this book has been a great joy and we are quite
    sad to put down these last lines and go our separate ways again. But first and
    last, we thank you, readers, for providing us with this wonderful opportunity
    to make such a journey in your company.'
