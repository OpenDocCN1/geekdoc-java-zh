    range research）的方法论练习。这正是维多·布奇里（Victor Buchli）和我研究当代考古学时试图脱离的。这可能是我想象力有限，我似乎无法在这两种可能性之外思考：当下考古学要么是程研究，要么是时期主义（periodism）。但显然你正在这里引出第三种选择，既不是这些，而是某种不同的东西。然而，阿甘本的考古哲学似乎太遥远了，没有任何关联，你提供的例子——米莉营地（Millie''s
    Camp）、你的硬币研究——对我来说，这些只是中程理论或民族考古学的例子。你能解释解释区别吗？


    **Laurent：**


    区别在于它们并非基于相同的理论基础，这可能就是你觉得这种方法很难想象的原因。正如维多·布奇里在《当代过去的考古学》引言中所强调的，过程（processual）和后过程（post-processual）考古学都共同关注“物质文化与人类活动或行为之间关系的阐明”。³
    对于欧洲考古学家来说，这两个理论学派都浸透了英美的行为哲学，正如保罗·库尔宾（Paul Courbin）在一本关于新考古学的非常糟糕的书中所指出的¹⁴


