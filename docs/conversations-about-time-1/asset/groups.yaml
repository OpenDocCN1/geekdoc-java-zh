    awful lot and still are. I don''t see MRT pointless, rather we just need to accept
    it for what it really is: old fashioned analogy, despite attempts to make it otherwise.
    It is never going to give us laws or rules, but it gives us ideas. Of course we
    should not call my version of the MRT, as the term conjures up very specific processual
    agendas, let''s not worry about that. But the point is, we need to always find
    a balance between theory and critique which offers no solutions, and theory as
    a pure tool or system that pretends to solve all our problems.


    So let finely try and answer your question and tell you I stand. As already hinted,
    I find it hard to think of the archaeology of the present in terms other than
    either a period designation or a kind of middle range (which I take in very broad
    terms as a context good to think with old-fashioned analogy, necessarily as a
    rule-seeking system as originally devised under processual). I suspect this second
    definition is probably much closer to yours. At the same time, I feel like this
    discussion had really moved away from being about an archaeology of the way, I
    feel the issue of temporality has been lost. Because it seems to me, what we are
    really talking about here is simply how our experience of living, right here,
    right now, should somehow be connected to what it is we are doing when we try
    and understand archaeological means. To me, this issue is more about the general
    fact that as an archaeologist studying what remains of the past, we are situated
    in the present which is temporal, but also political, cultural, material, etc.
    All of which have been a key part of (Anglo-American) theory for decades. Why
    is temporality so crucial?


    As to your question: where am I, in relation to Anglo-American and European research?
    I was raised in, but with a desire to re-connect to the latter, which I think
    I am doing, especially through thinking about the role of theory. This is something
    Americans probably have to do in the wake of what has been called the end of paradigms
    signed by the 1999 EAA conference in Bern. For me, I am certainly close to the
    Anglo-American tradition, but I also see it as is in great need of reconstruction
    and in part, by talking more closely with (not at!) my European colleagues as
    we are doing here. I agree with you that theory cannot be thought of as a system
