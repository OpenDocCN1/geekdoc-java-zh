    different from ‘real time’ or ethnographic time. I wanted to understand rather
    archaeological time was possible at all because one took the arguments of perspective
    to the extreme, it suggested the archaeological record should not really make
    any sense at all. It should be random noise. Yet we do discern pattern and order;
