    这归结底就是时间的物质性，或者换句话说，是时间作为物质性的一种属性的问题。我不想表现得傲慢，但我觉得你正试图挽救那些旧东西，它们的年代可以追溯到那个人们尚未意识到这些问题，或尚未完全理解其意义的时期（如果这是可能话）！


    所以我的问题是：考古学时间——这种关于物质遗存的时间——是如何挑战（或没有挑战）我们讲述过去故事的？


    Gavin: 语言可能再次在制造阻碍，但我看不出我们如何将阐释与时间的物质性这一问题隔离开来。然而，既然你明确提出了这个时间作为物质性属性的问题，我将保持我的关注。考古学时间是如何挑战（或没有挑战）我们讲述的过去故事的？嗯，我们说的考古学时间指的是什么？当然，我们在某些方面通过过去的两个章节已经讨论了这一点，并在多程度上涉及了许多内容。首先，它被定义为过去在当下的持续性；正如你所说，这是本雅明“档案计划”的起点，它强调了弗洛伊德关于记忆和无意识的观点，并已成为许多从事当代过去研究的考古学家的特征。其次，这种持续性不是完全的，而是总是局部的且处于转化之中，正如你通过关于“米莉营地”的思想实验所展示的那样。第二点当然不是新观点，但它一直是考古学方法论的核心元素，伴随着来源批判和成因理论。


    第二点在这里也许也不太重要；即使意识到这一点，也从未阻止过考古学家用“老办法”讲述关于过去的故事。第一点显然是最重要的。如果说第二个问题在很大程度上被视为一个方法论问题，那么第一个问题可能被描述为更具本体论色彩的——也就是说，承认过去只能存在于当下，这种我们所谈论的“效应”究竟是如何产生的？


    我想我要说的第一点是，我不确定这是否是一个如此近期的认知。我在早之前的一篇论文中论证过，反古董主义者和19世纪末的考古学家惯常以这种方式看待考古遗存，这是因为考古遗迹与民族学家所说的“遗存”（survivals）之间存在紧密联系——即延续到现在的旧习俗或习惯，尽管它们可能已经失去了所有的现实功能（就像生物进化中的退化器官——我们的阑指就是一个经典例子）。通过这种方式，考古学时间与一种“时代错乱”的概念联系在一起：那些已经过时但仍在徘徊的东西，并因此为我们提供了关于以前状态的线索。在整个20世纪，我们当然抛弃了这个观点（并不是因为它往往带有进化论和种族主义的色彩），并将时代错的负担从事物转移到了思想上。现在，不是物体背负了过时的罪名，而是我们对过去的观念或阐释染了“现时主义”的罪孽——即通过当代意识形态的文化偏见和过滤来解释过去的情感。但这种做法是以物体属于某个时代（过去）为代价的，并锻造了一种比古董主义者更为尖锐的过去与现在的分离。


    现在，我想我们以及其他人——争论的是，是时候将这种时间断层重新置于物体之上了。我想这可能正当我转向阐释问题时你所想要捕捉到的，而当时你想留在时间的物质性上。在将时间重新置于物体时，我们并没有回到一种将过去与现在并置视为时代错的古董主义观点，而是某种别的。但那是别的什么？我承认我不知道，但通常我喜欢看到对时间多重性的反映，即“多时性”（polychronism）。但我知道，危险在于，它被简单地用来加强阐释中对现时主义的焦虑。我们永远无法讲述过去的故事，所以我们最终在解构我们的故事，或者讲述关于这些故事的故事——我之前提到的关于考古学作为一种历史形式的观点。我们如何避免那样？我想，在没有明确替代方案的情况下，我宁愿承担风险，像它们是真实的一样讲述过去。因为现在，我无法真正看到即使有了“过去只存在于当下”这种认知，改变了什么。几乎改变了一切。


    这里有一个问题让我脱颖而出，这可能是我对原始问题最好的回答——如果我花了很长时间才走到这里请原谅！当我们谈论重新呈现过去时，在读小说或看电影时那种平行的当下，当你沉浸其中时，你存在于另一个时间，一个平行的时间。当这些故事涉及考古材料时，我们称之为“考古学当下”，它是那个更熟悉的术语“民族学当下”的近亲。现在从某种意义上说，这种叙述可以被称为一种“古民族学”——尽管是一种独特的类型，带有所有方法论上的保留，以及不完美的存存。我认为这种“故事”并没有真正受到我们关于考古学时间所言论的影响。然而，受到影响的是我们所说的不是“考古学当下”，而是“考古学历史”；一种随时间推移的事件过程的叙述（通常是很久的，至少按人类尺度而言）。更令人担忧的问题是，我们如何写历史，或者更准确地说，在这些认知之后如何描写变化。


    也许考古学家学来都不擅长写历史。也许我们提供的仅仅是一串“古历史学”（palaeoographies），像项子一样串成项链（借用本雅明的隐喻）。这不是历史。这只是系列被粘贴在一起的“过去的当下”，我们可能从中抽象出通用的趋势或模式。与此同时。


