    # 1. The distinctiveness of archaeological time


    Time as it is manifest in archaeological remains has a rather special character.
    Whereas our common, everyday sense of time is that of a relentlessly forward-moving
    flow from past to future, a time which passes, archaeological or material time
    has different speed settings, stop, erase, reverse or fast forward. Archaeological
    objects are selective aggregations of multiple times, they incorporate various
    and disparate traces of past events, they erase such events as much as they preserve
    them. The archaeological record is this hybrid of preservation and transformation
    captured by the neologism ''transformation’. Archaeological time is the time made
    by things.


    On this matter, we are in complete agreement.


    # 2. The past only exists in the present


    As a material presence, the past only exists in the present – whenever we might
    choose to situate that present. Archaeology always has to approach the past as
    a trace in the present. An archaeology of the past (distinct from the archaeology
    of the contemporary) is a critical reflection on this condition and what it means
    for our interpretation of archaeological remains. It is both a methodological
    and theoretical exercise which requires that we look at how the persistence of
    the past in the present affects the stories we tell. Although it has some overlap
    with source criticism and formation theory, it is not reducible to these fields,
    but occupies a rather more open, less systematic space and one moreover, focused
    primarily on time and temporality.


    On this issue, we are more or less in complete agreement again. The differences
    between us here relate to our distinct backgrounds and especially our different
    conceptions of theory; we Gavin would see an archaeology of the present as part
    of a wider tradition of source criticism and middle-range theory, Laurent views
    it as a more distinct and unique critique.


