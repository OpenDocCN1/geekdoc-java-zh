    How do you feel about this though? Since you brought it up ...


    Laurent: I believe you made the right point: something new is not the same as
    a novelty. A true novelty changes your way of seeing and thinking. There haven''t
    been that many actual novelties in our field in the last fifty years; in this
    sense, processualism and postprocessualism were real novelties – they created
    a paradigm change, as Thomas Kuhn would have said². But expanding the scale of
    chronology in both directions – ‘deep time’ on one hand and ‘micro-events’ on
    the other – doesn’t changing the way chronology remains considered: basically
    as the expression of historical change. That is to say, as the frame of history.


