    # 44 Life after Cambridge


    Roman period, every generation of historians has been re-inventing its past, adding
    details or changing the meaning of the original events. So, just like on an archaeological
    site, where deposit after deposit, you see the identity of the place is both transmitted
    and transformed, you see Vingetorix''s personality evolving through time. He is
    a dangerous enemy and an aggressor in Caesar''s text; he is then a victim of Caesar''s
    inflexibility in the course of the Roman period, an invisible man during the Middle
    Age, a courageous defender of the people and the nation between the Renaissance
    and the French Revolution, a brave fighter who accepts his defeat during the Second
    Empire, a patriot defending his land and his people at the time of the French-Prussian
    War of 1870-71 and the Great War, again a well-intentioned defeated man under
    the Vichy Regime and the German occupation of France, a resistant after 1944 and
    finally a Guerriller after the time of the decolonization of French Indochina
    and Algeria ...


    Of course, all these Vercingetor – which are, by the way, completely contradictory
    with each other have been invented, since it is not at all what the primary historical
    sources say, which is Caesar''s text. But, very curiously, it is invented from
    nothing either: it is carefully interpreted from the data contained in Caesar''s
    accounts. So it is plausible. And perhaps importantly, it may be untrue, regarding
    the past itself, but it is revealing a powerful truth about the present: when
    your country is suddenly invaded and conquered – as happened in France in 1871,
    1914-1918 or 1940-1945 – you realize what imagination and domination mean, and
    so at the time when Vercetorix was fighting against the Romans You are finding
    new, unexpected meanings within the past. And so, depending on the historical
    context of the present, this ‘reading of the past’ takes a peculiar color. It
    is not random, indeed, that the interpretation of the Second Empire re-emerges
    amidst the propaganda of the Vichy Regime: they both to justify the legitimacy
    of the Romanization of Gaul, on one side, and of the ‘Germanization’ of France
    on the other.


    You said ''re-presenting'' the past. This is what it is about; Ricoeur called
    this the ‘représentation’ of the past – a composite concept bringing together
    memory and representation.24 And this is also the approach shared by the German
    historian Jan Assmann, who coined as Mnemo-history.25 Perhaps what we are painstakingly
    building is basically some sort of Mnemo-archaeology?


    In talking and exchanging our memories, we have seen that we have been following
    similar lines from different perspectives,'
