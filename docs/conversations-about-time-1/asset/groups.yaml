  - '[PAGE 106]


    # 98 The future


    Laurent: What you said about scales is amazing, since this is exactly the problem
    we have been facing in the course of our Briquetage de la Selle project. It was
    not only a question of times scales, but simultaneously of spatial ones; I mean
    it was not only about encompassing different processes occurring along various
    durations, as you mentioned, these processes were also displaying features along
    various spatial units within the valley. For instance, the same phenomenon – the
    artificial filling of the river channels around the Iron Age saltworks, for example
    – had different results, depending on whether we were observing the immediate
    surroundings of the workshops, or larger areas of the floodplain downstream. So
    we soon realized we were confronted by an entanglement of many spatial and temporal
    scales; the key question becoming how these processes were ‘infusing’ and ‘percolating’
    from one scale to another simultaneously at different scales, in fact. Historical
    time was dissolving into a multiplicity of interactions, just as you said. So
    I would say, to paraphrase your last definition of archaeology, that it is not
    really non-scalar, when, on the contrary, is basically scalar: archaeology is
    rather multi-scalar; this multiplicity of interactions occurring at a diversity
    of scales ‘nullifying’ indeed historical time.


    So, in this sense, archaeology is fundamentally ‘anti-historicist’, to reframe
    Benjamin’s thought, since it is based on temporality – again the multi-scalar
    time of things and beings. Are we on the same page, now?


    Gavin: Yes and no. Yes, there is a multiplicity of archaeological time which is
    at odds with the singularity of chronology or metrological time. And for sure,
    it is anti-historicist in the sense that most history tends to adopt a singular
    time (again, we should not forget Braudel who argued for multiple time scales
    – even if, in the end, he seemed to privilege the longue durée). And yet no. For
    I have a deep problem with this notion of multi-scalar time because it conflates
    an analytical tool for an ontology. Time is not multi-scalar our metaphysics.
    Now at one level, using the term multi-scalar to refer to this multiplicity of
    time is understandable – it does capture something of the fact that different
    processes, events or causalities seem to operate longer or shorter spans of'
  - '[PAGE 107]


    # The future 99


    chronological time, as in your example of the briquetage sites. But the problem
    with using the concept of scale to capture this multiplicity that it mixes together
    at least two different kinds of multiplicity: duration and speed. We say something
    is long-term if it lasts a long time, but we also say it''s long-term if it changes
    slowly. But they are not the same thing. Using one term to cover two very different
    phenomena lands us in all kinds of problems, not least the problem of how to integrate
    or talk about the interaction of things which have different temporalities.


    Summing this up best I can, scale is a property of our metrology which allows
    us to articulate the multiplicity of time, but we must not confuse it for multiplicity.
    To understand the multiplicity of time, we need to pay much closer attention to
    the nature of change, to its forms, its different manifestations which are deeply
    connected to different materialities. My feeling is adopting the concept of scale
    to address multiplicity has distracted us from this more important issue of the
    multiplicity of change. But I am not sure if any archaeologists would agree with
    me with an entrenched and normal part of our disciplinary vocabulary now, and
    the concept of multi-scalar time is such hard to see past it. But I would argue
    that we need to build a new vocabulary nonetheless.


    But perhaps you can tell me more how you see temporal multiplicity in your Briquetage
    de la Seille project; do you think, given what I have said, there is a way to
    talk about this multiplicity without invoking scale?


    Laurent: Again, I believe we address these questions from two opposite ends: yours
    is rather theoretical and philosophical — is perhaps a bit too rigid. I guess
    — mine comes directly from my field experience and is certainly lacking any solid
    theoretical framework.


    In the Seille valley, we began looking at the salt production techniques of the
    Iron Age, but we quickly realized it was unproductive: we had to look at the archaeology
    of the valley, from the beginning of the Holocene to the contemporary period,
    and to study not only these prehistoric workshops but also their immediate environment
    and beyond the area of the valley at large.


    The Seille valley project was truly an open-air methodological lab. We had a team
    digging archaeological test-trenches and open'
  - '[PAGE 108]


    # 100 The future


    excavations of the course, but also people studying micromorphology, some others
    bio-stratigraphy and geo-archaeology through systematic coring. More broadly,
    we also had a team of geophysicists surveying the valley, looking for all kinds
    of features, both natural and anthropic. A first challenge was to correlate all
    these observations in time and space, since we were addressing different processes
    occurring at different places, different durations and different speeds. Archaeological
    dating was not enough, since we chose to prioritize OMS and C14 dating, wherever
    this was possible. This provided us with a metrological framework, which was,
    essentially probabilistic. And of course, it was a problem to reconstruct an accurate
    ''history'', since this was impossible with such a fuzzy chronology, to precisely
    identify changes of causes and effects. We just had the material result of changes,
    always already transformed by its post-history.


    So we recognized that, as you have stressed, we had to focus on this absent history
    but these present material products of change. And here, again, metrological time
    was very useful to reveal both duration and speed, since the nature of the remains
    had a strong impact on the behaviour of these changes and their manifestation.
    To give you a few examples, the tossing of industrial waste around the workshops
    immediately created a significant ''chronological dilation'' through a rapid accumulation
    of deposits. But, further on, it was releasing a longterm dynamic, whose effect
    was delayed: the alluvial filling of the valley did did not really begin until
    a few centuries later and was dramatically accelerating towards the end of the
    Middle Ages, obviously fed by external processes – such as wood clearing, as was
    obvious from the pollen records. On the other hand, in response to the gradual
    filling of the valley, the Seille river was cutting channels and meanders around
    this accumulation of alluvial deposits, while on the slopes around it, erosion
    was badly cutting any prior archaeological formations.


    In a word, it was complicated. But it became clear that our old historical tools
    were ineffective to encompass what we were dealing with: it was impossible to
    describe this complexity within some linear history. We were only faced with a
    diversity of interactive changes, displaying transforming effects over time. It
    was obvious that the ‘historical lenses’ – I mean seeing the past as a sequence
    of events, each one taking the place of the previous one – was particularly wrong:
    the material stuff that had been created, or transformed before was still there
    in subsequent periods of time, still constraining or shaping future trajectories.'
  - '[PAGE 109]


    # The future 101


    In other words, at each moment, the past was still present, as a persistent and
    active material presence. To put it clearly, we had to turn the traditional archaeological
    approach upside down: I mean we had to stop trying to use archaeological data
    to feed a reconstruction of an artificial history, but rather exploit the metrological
    tools at our disposal to try to encompass these archaeological processes of change
    and transformation in themselves. So, I agree with you that we have to implement
    another vocabulary, but, more deeply, we have to develop another way of thinking
    these archaeological dynamics.


    But how? I believe by looking at other disciplines in the Human Sciences which
    are dealing with the same kind of problematic. Psychoanalysis, for instance, which
    primarily deals with memory – that is to say with the persistence of the past,
    which has never passed. It deals with a different time, which is not a historical
    one: again, this is the time of temporality, in other words the time of the past
    within the present: archaeological time par excellence.


    Gavin: Well here it is; you I am coming at this from a more philosophical and
    too rigid angle while you are dealing with more concrete, empirical problems.
    But my point is not abstract or rigid at all; it is simply that we use abstract,
    philosophical concepts all the time to come to terms with our archaeology and
    we just need to be vigilant about those, especially the ones that seem so straightforward
    like scale. Maybe this is the influence of Anglophone analytical philosophy and
    especially the Oxford school of Ordinary Language philosophy which saw most philosophical
    problems as illusions created by the words we used (in my twenties, I was deeply
    into Wittgenstein). If I seemed too abstract, it was simply a provocation to go
    back to our concrete problems and re-think them using one word. So what happens
    when you describe the Iron Age production project using the word ''scale?'' You
    talk about dilation, delay, acceleration, persistence – terms which capture the
    subtleties of your material. We don''t need to align them under a single concept
    like multi-scalar; I would argue that is what is rigid here. Rather let''s just
    stick with these terms and explore what they mean and how they intersect. This
    is ultimately my goal here, and I think, you too.'
