    ## Life after Cambridge 39


    for their kilns, these people had produced a combination of severe floods and
    strong erosion, gradually filling the valley, which was rapidly transformed into
    a huge marsh.


    The Iron Age people responded to this by increasing the accumulation of industrial
    waste above the level of the floodplain, creating artificial mounds several meters
    high. The situation became clearly catastrophic in the course of the 5th century
    BC: they had to abandon most of their production sites scattered in the valley,
    and concentrate their production onto a few major mounds, some of those reaching
    today up to 12 meters high and around 500 meters in diameter. They were the only
    ones to resist this irresistible degradation of the local environment and so they
    were transformed into urban agglomerations during the Roman period, then medieval
    cities and modern hamlets.


    I apologize for this long introduction, but this research pushed me to approach
    a different way to the usual sites of this period. They experienced what might
    be called a critical ‘post-history’, which imposed a series of constraints on
    subsequent archaeological settlements: in other words, the structure of the Roman
    or medieval cities built upon these major Iron Age mounds had to be understood
    as an effect of the Iron Age impact on the landscape. In the same way, the immense
    marsh that you can see on the maps of those places in the 17th and 18th centuries
    has to be seen as a resilient product of the disturbance of the river environment
    created more than two millennia earlier.


    There are some more puzzling facts, when you are aware of this very long history
    of the valley, that we have been to reconstruct since the beginning of the Holocene,
    around 10,000 BC. In the 1780s, the social and economic situation of France was
    so that everywhere, in every village and every city, people gathered their complaints
    in notebooks, called cahiers de doléances, which were sent to the king. Everywhere,
    people complained about taxes and the privileges of the lords, except in this
    part of the Seine valley. There, people complained about the marsh, which was
    maintained by the Army as a natural defence to protect the fortified places where
    salt is produced, on the very same places as the Late Iron Age.


    The inhabitants said that the maintenance of the marsh affected the poorest people
    of their communities, throwing them into misery: cows had no grass to eat, people
    were getting sick with ‘marsh fever’ and died quickly, every year; there was no
    wood to heat their houses – since it was requisitioned for the salterns – babies
    had died from coldness in their beds... All of that because of the marsh; so they
    urged the authorities to drain the valley, for the benefit of everyone. From an
    archaeological point of view, this is fascinating: an artificial disturbance of
    the natural environment created from the 6th century BC is contributing to a social
    and economic order at the end of the 18th century AD, feeding a pre-revolutionary
    situation, which is enhanced by two previous years of a climatic depression and
    bad harvests.


    So I became interested in the ''masked effects'' of the past, a lasting presence.
    It is a major feature in landscape geography, as the French school of ''archaeo-geography''
    has demonstrated, especially through Gérard Choquer''s works. They have coined
    a strange word to describe this phenomenon: *transmission*, which is a combination
    of transmission and transformation – meaning that the features of the past are
    transmitted while being transformed. Very interestingly, transmission is also
    a recurrent pattern observed by psychoanalysis, which deals with memory and the
    unconscious. So does it mean that common mechanisms operate both in the construction
    of the psychic memory of the unconscious and in the material memory of the landscape
    – that is to say in archaeological matter?


    But there is another important lesson the Briquetage de Seine taught me. As archaeologists,
    we are not outside of this process: we are directly engaged with it. Indeed, we
    were able to survey and excavate those sites that had been abandoned in the 5th
    century BC – since they were never re-occupied afterwards. But this wasn''t the
    case with the major mounds of the Iron Age, which were covered by several meters
    of urban stratigraphic layers and located under the present villages, where it
    was just impossible to conduct large-scale excavation. So, our research project
    itself was also modelled by constraints inherited over time, from the remote past
    of the Iron Age. We were part of this construction, which was also providing the
    conditions for the creation of a narrative of this history.


    So you see, following different lines, I came across similar issues: the ''resilient
    past''; irreversibility and the question of archaeological contemporaneity, the
    interpretation and fiction of the past ...


    Could you develop these ideas you were exploring in 2010?


    Gavin: Your project sounds quite astounding – both in terms of the spatial scale
    of the impact of these saltworks, but also their temporal reach, the long-term
    reverberations they have had on local communities ever since, even up to, as you
    say, the choices facing archaeologists on where to dig. These reverberations are
    exactly how I have always interpreted Husserl’s time diagrams that I mentioned
    in the last chapter in relation to archaeology; how events from the deep past
    can still impact and shape people centuries, even millennia later. But you are
