    # 剑桥之后的生活


    **洛伦特：** 噢确实如此，我们！当你正在解构考古记录的概念时，我在那一刻，正试图在那些已经遇到过这种奇异物质性行为的人的作品中，寻找我在考古时间上观察到的现象的回响。我此前已经分别读过他们的著作，但这是我第一次看到这些人人之间是如何互补的；他们的作品构成了某种抽象的星群。


    对我而言，最亮的一颗星显然是沃尔特·本雅明和他的《历史哲学论》。在他有力且富有诗意的语言中，他为我一直在观察的考古记录的奇特轨迹赋予了文字。他将注意力放在历史的物质性上——探索由他同时代的20世纪20年代本雅明所描述的许多被覆盖的街道或长廊（*passages*），将其视为19世纪的化石化产物——本雅明拒绝了传统的历史学方法，即每一个新事件都会抹除前一个事件¹。最重要的是，他将这种对历史主义的拒绝视为一场反对保守主义的战斗。根据本雅明的观点，过去并不仅仅由它在过去中的封装来定义——正如历史主义者所声称的那样——而是在当下浮现，作为一种活跃的记忆。我禁不住说，他的18世纪可以被读作一份反历史主义的宣言：考古学本身试图在历史的不同时刻之间建立因果联系。但没有任何事实是真正与它隔绝了数千年。一个认为以此为论点的历史学家就不再像讲故事一样讲述事件序列了。相反，他抓住了他用以建立的星群，将现在构想为一种“此时的时间”，而这种时间正在与弥赛亚时间抗争。


    为什么事物会不断后退？瓦尔堡写道，这是“本能与逻辑之间”的“生物学必然性”。瓦尔堡与我们之前提到的法国历史学家亨利·福西龙之间存在着秘密的联系。在研究中世纪雕塑时，福西龙注意到：


    **加文：** 真正对考古记录的兴趣让我重新回了时间，正如我之前提到的，特别是通过重新参与理论和视角。在我写完那本关于时间的书后，我曾在各种出版物中反复围绕这些不可逆性和熵的问题转转，但它们似乎总是逃避我的掌握。在某种程度上，我想说，那些生存或持续到现在的的事物，考古记录甚至是我们日常世界中的事物，它们之所以能够存在是因为偶然，因为它们具有深远的意义。持续性不仅是一种物理属性，更是一种历史属性。这是对钱德理解过去社会观点的注脚，他认为我们无法理解的仅仅是那些失败的思想；成功的思想已经传下去并依然与我们在一起，这是过去心态的一个方面，我们仍然可以与我们的史前祖先一起捕捉到。这种观点受到意识形态受自然选择影响的进化论观点的影响，但也受到真意识与虚假意识（科学与意识形态）的马克思主义观点的影响，这显然是极具问题的，但在拒绝其进化论和马克思主义的色彩时，我失去了相信它的任何理由。我想，我最终的动机是证明，我们不应该为考古记录的碎片化本质而哀叹。那是它的本质，它的部分保存归功于一种“自然”选择过程，但与其说是一种受适应或适应度或“真理”启发的选择，不如说是一种受社会历史对熵的抵抗启发的选择。无论如何，头最后我放弃了这种幻象，它仍然感觉相当武断，坦率说是不真实的。相反，我转向另一个问题，即当代性。在某程度上，这也解决了过去持续到当下的问题，但我不再像以前从熵和不可逆性的历史角度来看待它，而是从过去与现在的并置以及这种并置可能被表达的不同方式来看待。我在2015年的《考古对话》（*Archaeological
    Dialogues*）上发表了一篇关于此的文章，你当然是评论员之一¹⁶。在那里，我反思了我们如何将当代性视为一种描写过去的不同方式；并不是指我们当下的现在（考古学实际上被简化为了遗产），而是作为任何现在——无论是公元前4000年还是17世纪的现在。这种表述方式是有问题的。也许更好的词是重现。这并不是回到过去去创造一个想象的（但虚假的）“现在”，它与其说是对过去的进行时间机器，不如关于一种社会历史对熵的抵抗。无论如何，当我们在处理17世纪时，这会发生什么？我所想做的只是这样的考古，对我而言，写作最好只能做到。


    但我现在有些想得太过了，因为自从在2015年重新审视写作和叙事的主题（这些是我博士论文的核心部分）以来，我才这样看到它⁷。这是一个缓慢的过程。但同时，令人高兴的是，我发现自己回到了25年前我博士研究关注的叙事和时间问题。也正是这段时间，我们的道路终于交汇了。你首先在2014年邀请我参加梅斯的工作坊，2017年我邀请你去雷雅未克参加一个关于时间的研究生研讨会。这两个场合足以重燃一段旧情谊，至少对我而言，你最近关于时间的著作继续在启发和刺激我。但是，你如何总结自剑桥以来，尤其是你2008年著作之后的思想？


    **洛伦特：** 我的《时间的黑暗深渊》试图回应本雅明放弃历史主义的号召；它是对旨在进入“真实过去”的传统时间方法的反叛。在写这本书时，我充满了愤怒和不满，意识到考古学基本上建立在一种反革命性的方法之上。因此，我尽力拆毁它，直到地基。有些人人说：“好吧，你把它毁了，但你打算在上面建造什么？”顺便说一句，这正是你所指出的。但你知道，事情以它们自己的方式发生，有时在你的意识之外。几年前，我非常幸运被邀请在法国东部建立一个野外研究项目，针对一系列铁器时代的制盐厂（*Briquetage
    of the Seille*）¹⁹。我获得了了相当充足的资金，来自国家和摩泽尔省，每年更新。它持续了15年多，直到2017年我的研究项目结束时才停止——这在今天是相当难以想象的情况。我们很快发现的完全出乎意料：这些制盐厂有时延伸几公里，在这个小山谷中倾倒了数百万立方米的工业垃圾²⁰
    但它们在几个世纪内剧烈地改变了自然环境；将盐堆和炉子的碎片废物直接排入小塞尔河的河道中。


