    ## 102 未来


    如果说有任何差异，那在于我们反思自己的语言和问题时汲取的灵感来源；对你来说，心理分析显然是一个主要来源，我看到它对你成效极丰。对我来说，它可能更多是哲学。但这种差异是件好事。我认为我们能进行这样富有成效的讨论，原因之一是因为有不同的灵感来源——我们得以看到彼此的个人历程，以及对这些大多共同关注的话题的观点。结果，我们从不同的角度审视了自己的立场；我们相互相互学习。


