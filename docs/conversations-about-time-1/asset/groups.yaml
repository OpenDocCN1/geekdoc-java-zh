    ## Life after Cambridge 43


    would make us imagine a completely different history of this region: but what
    if I hadn''t seen what I had observed in the post-history of these places; how
    would I encompass this Iron Age past? And how about all the data that I haven''t
    seen or been able to find yet; isn''t it the case of the time, since, as archaeologists,
    we all have this odd habit to cut the path into slices, looking only at the period,
    and the objects we think are interesting? At this point, I began to realize that
    we basically approach the path through the features of its post-history; in fact
    that the path makes sense to us not really in itself, but its later transformation
    – just like memories in our mind.


    This gave me the core idea of a book, which I published in 2019 on Vercingétrix,
    the Gallic chief who fought against the Roman by Julius Caesar in 52 BC. Since
    the 19th century, Vercingétrix was a national hero, the first person of French
    history in fact. But this is not what the book is about: it is an attempt to apply
    an archaeological approach to the historical sources, seen as a stratification
    of information and interpretation developed over two millennia this character
    and the events surrounding his life.


    The conventional approach, from a regular historical point of view, would have
    been if you do that, dig out all these parasitic and subsequent layers, in order
    to uncover the ‘true’ historical bedrock, containing the ‘authentic’ data, or
    at least the ones closest to the ‘historic reality’ of this time. But if you do
    that, you end up with just a handful of sand – a few words about Vercingétrix’s
    family and the fate of his father, who was executed for having tried to reintroduce
    monarchy over the Arverni people. Caesar’s text allows you to find the young Gallic
    chief for about 9 months, from the winter of 53-52 BC to the fate of 52 BC … and
    that’s it. Of course, all these events are seen from a Roman point of view and
    by a man, Caesar, who is trying to justify his personal behavior, which was totally
    illegal in Roman law: even as a governor of a province, you were not allowed to
    declare war on your own and to use the army of the State to fight allies of the
    Roman people. So what to do, in this situation? Just historians have been repeatedly
    doing: you have to reconstruct a complete world around these tiny bits of data,
    developing very risky and fragile global assumptions: in a word, you have to create
    a whole fictitious past.


    On the other hand, if you look at what came afterwards in the historical record,
    you find a very rich and diverse body of data. Since the Roman period, every generation
    of historians has been re-inventing its past, adding details or changing the meaning
    of the original events. So, just like on an archaeological site, where deposit
    after deposit, you see the identity of the place is both transmitted and transformed,
    you see Vercingetorix''s personality evolving through time. He is a dangerous
    enemy and an aggressor in Caesar''s text; he is then a victim of Caesar''s inflexibility
    in the course of the Roman period, an invisible man during the Middle Age, a courageous
    defender of the people and the nation between the Renaissance and the French Revolution,
    a brave fighter who accepts his defeat during the Second Empire, a patriot defending
    his land and his people at the time of the French-Prussian War of 1870-71 and
    the Great War, again a well-intentioned defeated man under the Vichy Regime and
    the German occupation of France, a resistant after 1944 and finally a Guerriller
    after the time of the decolonization of French Indochina and Algeria ...


    Of course, all these Vercingetor – which are, by the way, completely contradictory
    with each other have been invented, since it is not at all what the primary historical
    sources say, which is Caesar''s text. But, very curiously, it is invented from
    nothing either: it is carefully interpreted from the data contained in Caesar''s
    accounts. So it is plausible. And perhaps importantly, it may be untrue, regarding
    the past itself, but it is revealing a powerful truth about the present: when
    your country is suddenly invaded and conquered – as happened in France in 1871,
    1914-1918 or 1940-1945 – you realize what imagination and domination mean, and
    so at the time when Vercingetorix was fighting against the Romans You are finding
    new, unexpected meanings within the past. And so, depending on the historical
    context of the present, this ‘reading of the past’ takes a peculiar color. It
    is not random, indeed, that the interpretation of the Second Empire re-emerges
    amidst the propaganda of the Vichy Regime: they both to justify the legitimacy
    of the Romanization of Gaul, on one side, and of the ‘Germanization’ of France
    on the other.


    You said ''re-presenting'' the past. This is what it is about; Ricoeur called
    this the ‘représentation’ of the past – a composite concept bringing together
    memory and representation.24 And this is also the approach shared by the German
    historian Jan Assmann, who coined as Mnemo-history.25 Perhaps what we are painstakingly
    building is basically some sort of Mnemo-archaeology?


    In talking and exchanging our memories, we have seen that we have been following
    similar lines from different perspectives, meeting the same question on our way.
    Maybe it is now to explore our differences and to explain why and why they make
