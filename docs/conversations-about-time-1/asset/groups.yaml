    ![](img/97e9b797cfbc473816012daed7863bbe_39_0.png)


    **图 2.1** 序时时间与类型时间之间的区别（参考 Lucas 2005，图 4.4）。


    你的书是如何产生的？它是如何与你的博士研究产生联系或脱离的？


    **Laurent：** 像你一样，我花了大约十年的时间才开始将考古学中的时间问题整合在一起，因为这并不是我博士论文的主要课题，我的博士课题更多是铁器时代的墓葬组合。无论是在区域考古服务部门还是在圣日曼博物馆，我都沉浸在其他任务中：整理藏品、组织展览、对我们的系列进行研究研究——并深入研究国家古代博物馆（*Musée
    des Antiquités national*）极其精彩的19世纪档案，后来更名为国家考古博物馆（*Musée d’Archéologie nationale*）。


    当时，“巴黎人”这个小团体对桑德有一个计划：让他来到巴黎在巴黎索尔邦大学教学，并围绕他重新构建考古学的教学。这个想法还包括招募他的一些博士学生为这一新教学大纲做出贡献——例如考古认识论，那本将是我的科目。坦率地说，这是一场行动。而我完全失败了，导致桑德和阿尼克离开了美国。


    但在那时，我仍然需要获得最终的资质以便以教授的身份指导博士生：即法国学术体系中的“研究导师资格”（Habilitation à Diriger des Recherches，HDR）。这是一篇短文，大约50,000字，在其中你总结自己的研究历史：你来自哪里，做了什么，以及你目前计划为未来发展哪些视角。于是我在2004年写了它。⁶
    这篇论文的简短版本后来于2008年由 Seuil 出版社出版，与保罗·利科尔、康内利乌斯·卡斯托拉迪斯和斯拉沃杰·齐泽之前出版的作品处于同一丛书。⁷


    那么，在这本书里你能读到什么？基本上是对考古遗存与时间之间关系的研究，基于我博士研究结果的综合以及一些新想法。我们已经谈过了在剑桥的时光，但那段时间里浮现出的正是我们共同关注的这个问题，就像两颗不同的小行星：考古时间和序时时间是两个不同的维度，一个是真实的，另一个是抽象的。真实的并不是我们所想的那种：它是考古时间，作为物质性的产物。


    这是真实的时间；另一个仅仅是一种约定，一种测量模式，换句话说，一种尺度。这就是为什么将注意力集中在考古遗存上，并观察它们在考古时间中的行为至关重要：它们的堆积实际上构建了一个关于过去的物质记忆，而这正是考古学的真正课题。这一点在我早先在剑桥撰写的博士论文《时间的形状》（*Shapes
    of  -of-Time*）中已经以某种形式存在了。


    但在15多年后重读这篇 HDR 作品时，我也看到那里出现了一个新概念：当下作为过去的所在地。我知道这听起来很愚蠢，因为对我们来说，对时间的直接感知是序时的——因为必然在当下之前；它在当下发生时已经发生了。然而，正如柏格森所强调的那样，这种感知是时间的两个维度之一；另一个是时长（duration）——即我们的考古时间³
    如果你认真对待“真实时间是考古遗存的物质时间”这一观察，那么当下——我指的是当下，此时，此处——并不是此刻正在发生的任何地方：它是留在了那一刻，在我们周围，在脚下的土地里，在我们头顶的星空里。它是过去所有的时长——从宇宙的诞生到你紧邻的物质环境：你所坐的椅子，你的衣服，甚至你本人，作为一个身体。这一切在物理上是共存的，这正是我们能够挖掘过去的原因：它仍然在那里，作为一种物质存在。它已经停止了，但它并没有停止存在。


    ## 32 剑桥之后的生活


    与我早期的《时间的形状》相比，另一个新想法是认识论；在某种意义上，这与你对过去社会对时间感知的兴趣并不远。它基于这个非常简单的想法：如果过去是物质上留存在当下的东西，那么从史前时代到现代，它一直是人们一直在经历的一种现象。在这方面，考古学的历史基本上就是考古学的历史。（此处原文重复多次，略）


