    ## 剑桥之后的生活


    考古学通常被描述为一门处理过去的学科，但正如其他考古学家所指出的，我们无法直接接触过去——只有留下的**遗存**。但对这种认识比我们通常认为的意义重大得多。相反地，过去以任何形式或状态实际上存在于当下，正如Laurent在最后一章中提到的。这种“遗存”的属性对于考古学至关重要，不仅是一个方法论问题，更是一个关于写作和解释的问题。过去的遗存又是如何影响我们的考古描述的？这不仅关乎我们如何从遗存中解释过去，更重要的是过程本身是如何被遗存的物质性所塑造的。在博士学位后的几年里，Laurent通过沃尔特·本雅明的著作探讨了这些问题；在一段时间后，加文也开始关注这些问题，通过对时间视角和考古记录的批判性参与。


    加文：在很多方面，完成博士学位后，我把时间放了一了十年左右，写了一本关于考古学的短期教科书，于2005年出版，但这很大程度上基于我读博士期间的背景阅读，除了关于时间视角和重写本（palimpsests）的一点额外材料外，并没有特别新颖的东西——至少对我来说是这样。直到这本书出版后我才在学术上回到这个问题，那是我博士后12或13年后。相反，我对考古野外工作和考古过程产生了更大的兴趣。可能在博士后，在几次尝试学术职位失败后，我回到了商业考古。我记得有一个特别沮丧的时刻，当时我在伦敦贝贝克学院（Birkbeck
    College）成人教育部门找了一份兼职。我拼命准备讲义，第一个晚上去时发现只有一个学生报名了。他们不得不取消课程。事实是，我决定学术职位不适合我，在伦敦的考古部门做了一些短期工作后，我回到剑桥为Chris
    Evans工作。


    我很喜欢那里。无论是在社交还是智力上，那里都是一个极佳的环境，我发现自己在做商业考古的同时仍然写论文。这是一个特别的地方，可能现在也是。对我来说，回到现实生活也很困难。夏天从剑桥回来后，我的母亲被诊断出癌症。六个月后她去世了，当时我只有37岁，我的妻子怀着我们的第一个孩子雷米（Rémi）。这给我的影响比我当时意识到的深得多。所以，我必须对我所能留下的那几件事做每个人都必须做。但最终，我幸运地在圣日耳（Saint-Germain-en-LAY）的国家考古博物馆找到了一个职位，我至今仍在那里。由于我的前任离开了，凯尔特和高尔考古学策展人的职位空缺。这家博物馆是由破仑三世于1862年建立的，拥有极其丰富的收藏；它也是研究该学科历史的绝佳之地。


    那么你呢？你是如何重新接触时间的？你能解释一下在你2005年的书中，与你博士期间发展的观点相比，加入了哪些新元素吗？从那个点起你是如何前进的？


    加文：这是一个漫长的过程。我在商业考古领域做了大约六年，但不可避免地，工作的兴奋感和快乐逐渐消失了。这并不是因为我厌倦了野外工作或同事，更多是因为我开始感到需要更多研究和写作的时间和空间。正如我提到的，剑桥部门在提供自由方面是一个非凡的地方，但不可避免地存在限制；归根结底，完成工作、写报告是首位的。这意味着我仍然必须花费晚上和周末时间来我的项目。起初，我请了无假来满足这种渴望；获得了资金在南非开展一个为期三年的项目，因此在三个夏天我去那里发掘遗址（我应该在这里说，这在我的兴趣从史前转向历史考古之前）。我也通过我的前导师伊恩·霍德（Ian
    Hodder）参与了在土丘遗（Çatalhöük）项目中的两个夏天，然后去冰岛管理一个考古学校，那是我大学时期的老朋友。

    '
