    ## 2 Life after Cambridge


    Archaeology is often described as a discipline that deals with the past, yet as
    other archaeologists have noted, we don''t have access to the past – only what
    remains of the past in the present. But recognition of this has much more serious
    implications than we often give credit for. The present is, paradoxically, the
    only place the past – in whatever shape or form – actually exists as Laurent touched
    on in the last chapter. This property of ‘remaining’ is critical to archaeology,
    not just as a methodological issue, but as a substantial matter of writing and
    interpretation. What does survive or remain, affect the shape of our archaeological
    accounts of the past? This is not about how we interpret the past from what survives,
    but more importantly, how the historical process itself is shaped by the materiality
    of ‘remaining’. In the years after his PhD, Laurent explored these issues both
    through the writings of Walter Benjamin who suggests a different way to write
    about the past to conventional history, and through the work of the French school
    of archaeogeography. After a hiatus, Gavin too began to engage with the same issues,
    but through a critical engagement with the work of time perspectivism and exploring
    the temporal structure of the archaeological record.


    Gavin:


    In many ways, after I finished my PhD I put time aside for the next decade or
    so wrote a short textbook on archaeology which came out in 2005, but this drew
    heavily on the background reading I had done for my PhD and apart from a little
    additional material on time perspectivism and palimpsests, there was nothing exceptionally
    novel in it – for me at least.¹ I did not intellectually return to time until
    after this book came out, so 12 or 13 years after my PhD. Instead, I became more
    interested in the nature of archaeological fieldwork and the archaeological process,
    probably after my PhD, a few half-hearted and failed attempts to get an academic
    post, I returned to commercial archaeology. I remember one particularly dismal
    moment when I got a part-time job in adult education at London’s Birkbeck College
    outreach department. I slaved away preparing my lectures and turned up for my
    first evening to find one student had enrolled. They had to cancel the course
    and the truth is, I much decided an academic post was not for me and after some
    short-term work for the archaeology units in London, I returned to Cambridge to
    work for Chris Evans.


    And I loved it. It was both socially and intellectually a great environment and
    I found I could still write papers while doing commercial archaeology. This was
    a special place and possibly still. The return to real life was difficult for
    me as well. I had been back from Cambridge since the summer, my mother was diagnosed
    with cancer. Six months later she was dead, and I was only 37, when my wife was
    pregnant with our first child, Rémi. This deeply affected me more than I realized
    at the time. So I had to do what everyone had to do with the few things I was
    able to retain. But finally I was lucky enough to find a position at the National
    Museum of Archaeology in Saint-Germain-en-LAY where I am still working today.
    The position of curator for Celtic and Gallic Archaeology had become available
    as my predecessor had left. This museum was created in 1862 by Napoleon III and
    holds truly extraordinary collections; it is also an amazing place to study the
    history of the discipline.


    And what about you; how did you reconnect with time? Could you explain which new
    elements you put into your 2005 book, compared to the ideas you had developed
    in your PhD? And how did you move forward from that point?


    Gavin: It was a long process. I was in commercial archaeology for around six years,
    but inevitably the excitement and pleasure of my job gradually wore off. It wasn''t
    that I got tired of fieldwork or my colleagues, it was more that I was starting
    to feel the need for more time and space for research and writing. As I mentioned,
    the Cambridge Unit was an exceptional place in giving one freedom, but necessarily
    there were limits; at the end of the day, finishing a job, writing the report
    came first. I meant I had still to spend evenings and weekends working on my projects.
    At first, I took unpaid leave to quench this thirst; got funding to run a three-year
    project in South Africa so for three summers I went there to excavate sites (I
    should say here also before my interests were turning away from prehistory and
    into historical archaeology). I also went to join my former supervisor Ian Hodder
    on the Çatalhöük project for two summers and then to Iceland to run a field school
    for an old friend from my undergraduate days. But all this did accumulate more
    work outside my ‘day job’. Then, a larger opportunity opened up in Iceland: come
    and run a large excavation in the summer and so long as the post-excavation work
    was maintained, I could spend the rest of the year doing my own research. This
    was like a golden ticket and even though it meant a major move, I don''t think
    there was any question of turning it down. I was single, having just split up
    from my girlfriend and had no ties to keep me in England.


    So I ended up in Iceland in 2002 and there, I suddenly had time to write. I wrote
    two books in a fairly short span; one was based on my work in South Africa, the
    other though was this book on time. So now I finally get to answering your question.
    I must admit I had to flick through this book to remind myself what I had written
    and in places, I was quite surprised. As I mentioned, lot drawn on background
    reading and thinking for my PhD, but this was not an edited version of my PhD
    by any sense. I was commissioned to write a general textbook, introducing students
    and scholars to the issues and debates around the topic. So what I did was structure
    around a simple idea: that the problem of time was not as straightforward as simply
    trying to improve our dating techniques. Each chapter tried to explore a different
    facet of time, but the two chapters revolved around time in the archaeological
    record and time as it was perceived or experienced in past societies. In a way,
    both of these were new elements formed a core part of my PhD research, although
    elements of both were incorporated into it. Of these two themes though, it was
    the former that took on greater importance and in fact my interest in time perception
    quickly receded.


    The key thing though how all this seemed to readily connect with my early studies
    of design and form, and how the same issues which beset my study of artefact typologies
    – the articulation of continuity and change and the persistence of the past into
    later presents – were also at sites and in landscapes. Indeed, looking in that
    book, am even struck by a discussion I made on Roman pottery which exactly mirrors
    what you were saying about the miner’s lamps; how our typological dating was off
    and not calibrating to make it align with conventional dates (Figure 2.1). How
    one forgets!


    In fact, it was in part because of increasing contacts and meetings with Tim Murray
    that I was taken in this direction. And only while I was doing commercial archaeology
    for the Cambridge Unit that I got to know Tim through Evans (director of the Unit),
    and ironically, largely because of our common interest in historical archaeology
    not time. Perversely, I was never aware of its earlier incarnation in the Archaeological
    Review from Cambridge, underlining how compartmentalized I was.


