    # 34 Life after Cambridge


    perspectivism, didn’t ring true to me. Yes, ethnographers worked in real time
    with subjects who lived in real time, but their ethnographies were mere abstractions,
    attempts to understand the deeper cultural logic of a society, whether this was
    through the structuralism of Lévi-Strauss or the functionalism of Malinowski and
    Radcliffe-Brown. What they produced were route maps for understanding a culture
    that transcended the time in which they were constructed. Yes, this also resulted
