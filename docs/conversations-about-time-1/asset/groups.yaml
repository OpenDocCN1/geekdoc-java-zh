    ## In the beginning 15


    This must have been a great discovery for your research?


    Laurent: To tell you the truth, this was nice but not very helpful with regard
    to what I was looking for in order to write my PhD ... I came to realize that
    I had deeply failed in my previous excavation projects. You said I were stuck
    in your corner of poststructuralism and so I was in my own world. At that time,
    we had a living God, who reigned over French prehistory. His name was André Leroi-Gourhan.
    People around him were used to call this prophet ‘le patron’ – the boss. He was
    in a sense a poststructuralist in his own way, since he completely changed the
    way we practiced and interpreted prehistoric archaeology in the 1970s. To put
    it crudely, before prehistoric archaeology was a matter of stratigraphy and archaeological
    sequences observed in caves and rock shelters; it was based on a vertical approach
    of the past, to speak. Leroi-Gourhan made it horizontal: he developed meticulous
    stripping of ‘prehistoric floors’, reconstructing the gestures, practices and
    habits of the people who lived there what humble remains they had left on the
    ground. His approach was truly revolutionary: an ‘ethnographic excavation’ was
    striving to read, for the very first time and on very basic archaeological evidence,
    how people had been behaving, what they had done and maybe what they had thought
    and felt?


    I was one of his believers. I thought that I could do the same for other periods
    of the past such as Iron Age Celtic archaeology. On burial mounds, for instance.
    With prehistoric floors, people had been performing ceremonies around the graves
    of their people, they had made offerings, surely they had followed some rituals
    with their material products that had been deposited in the ground. Then, they
    had sealed these ‘funerary floors’ with huge piles of soil or stones, over hundreds,
    thousands of square meters. If I could excavate this as carefully as Leroi-Gourhan’s
    team did at Pencevent, then I could develop a far more interesting Iron Age archaeology:
    one focused on people rather than objects.


    This was a brilliant plan, but the trouble was that I never found any of ‘funerary
    floors’. I excavated dozens of mounds and what I got was not what I had expected.
    There was no floor at all, but sometimes a vague horizon, about 10 cm thick, containing
    tiny, scattered pieces of pottery, and in some places flint flakes or eroded fragments
    of


    ## 16 In the beginning


    grindstones... How to be sure this was related to the building of the burial mound,
    and if it was really the case, how to be sure that all these remains were the
    result of the same sequence of events, associated with the burial of the dead?
    And what about unidentified shards, the ordinary pieces of stone; were they already
    when the Iron Age people came, centuries millennia later?


    I was alarmed and in fact worried; I was realizing how much I had had to write
    a PhD under his supervision. The more I was trying to fix this mess with time
    in my archaeological data, the worse it got... You are right, looking back to
    the 1990s, Cambridge was the place where we were already exploring new perspectives
    on time. But in my case, we were with anguish and loneliness; we were all in our
