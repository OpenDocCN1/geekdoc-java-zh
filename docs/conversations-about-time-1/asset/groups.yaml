    Olivier 1994).


    **Gavin:** This is a really important point and I think this figure show of the
    ''lamp time'' snaking around chronological time is incredible. Every archaeologist
    needs to see it as it gives us an immediate and visual kick up the backside. What
    it shows is that change is not regular, but sometimes ahead of itself (spurts
    of innovation when the line snakes to the right of the straight vector), sometimes
    holding back (a conservatism that keeps the line to the left). More crucially,
    it shows how the in-built assumptions about regular change behind seriation need
    to be corrected.'
