    ## In the beginning


    Archaeology has always had a problem with time. At its very core, dating is a
    fundamental part of what we do and before the advent of scientific techniques
    like C14, archaeologists relied heavily on methods such as stratigraphy, typology
    and seriation. In this chapter, we talk about our earliest research on time as
    part of our doctoral studies, where both of us dealt with later methods, typology
    and seriation. Although scientific methods of dating dominate today, the legacy
    of typology and seriation is still strong in what they subtly inform our perception
    of time and change. We expect change to be sequential, linear and regular. What
    we found through experimental work on modern, well-dated objects did not obey
    the temporal assumptions and principles which guided the traditional methods.
    That time looked very different from an artefact''s point of view. These empirical
    observations found theoretical support for Laurent, the work of Freud on memory
