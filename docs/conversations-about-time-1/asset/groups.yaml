    Is it human intentionality, or could it be the case that the transformation of
    artefacts enjoys, somehow, its own dynamic? Isn''t it in fact a combination of
    these two different forces?


    Survival is indeed one of the most fascinating phenomena we can observe in archaeology.
    I also read about this amazing story with Stonehenge. It is unsettling news, since
    it is about the transmission of a very ancient inheritance which is reincorporated
    into a different present, although nearly 5000 years old. This is the kind of
    information that is provided excellence by archaeology. One of my other interests
    is Early Celtic Art, and the time and space are expressed in these creations of
    the European Iron Age. By that, I mean that I look at the structure of visual
    space in which shapes are projected and the succession of temporal sequences through
    which they are built; I don''t care about the usual questions of time, symbolism
    and so on – I just focus on planes of visual projection and succession of layouts.
    And like Stonehenge, you see that out, if shapes may change over time and appear
    in distant places, their inner structure tends to remain.


    ## Time out 111


    I have been working for instance at the Pilier de Nautes, a stone pillar found
    scattered in several pieces beneath Notre-Dame''s in 1711. It depicts a combination
    of Celtic and Roman gods, organized on different levels, translating under Tiberius''
    reign the structure of the Celtic pantheon by incorporating Roman equivalents.
    These gods are projected onto a spatial distribution, ordering the hierarchy of
    the different ''worlds'' they belong to and their place in the annual cycle according
    to their orientation towards cardinal directions. You here see a specifically
    Celtic structure surviving in the early Roman period, under some sort of Roman
    disguise. The monument and gods look Roman, but they remain Celtic. You even find
    that this Celtic ''iconological structure'' has been integrated into much more
    distant creations, both in time and space: for instance, in the early Christian
    stones crosses of the Irish Early Middle Ages, more than a thousand years later...
    There are indeed the very same schemes of spatial distribution in the figures,
    which are now applied to the depiction of Old and the New Testament characters
    and events.


    As you said, archaeological time is not just about a broader time-span than sources
    of the human past: it reveals unexpected processes, which otherwise literally
    jump over time and space. They obviously take place beyond our little bubble of
    ''conscious time'' – this or less immediate time of history, ethnography or sociology.
    I would rather call this vast ''unconscious time'' – the time specifically revealed
    by archaeology. It is unconscious, indeed, since it is clear, for instance, that
    the Irish priests had absolutely no idea of Gaulish pre-Roman culture; but they
    nevertheless reproduced some of their distinctive features. Therefore, this archaeological
    time is obscure and hard to figure out, within our conventional categories of
    things. But we try to do it.


    Thinking back to what you said at the beginning of this chapter, I believe we
    have to ask for some indulgence from our readers. There are a lot of things we
    haven''t talked about, both because we didn''t have them in mind and also because
    we are less familiar with some of these fields of knowledge or works – at least
    in my case. But I would also add, that to this dialogue, we have both (re)discovered,
    through the other''s eye, aspects we have previously neglected or underestimated.
    This book truly has to be taken as a ''work in progress''. Are there issues, within
    what you talked about, that you would like to make clearer for our readers before
    we finish this conversation?


