    \ we were observing the immediate surroundings of the workshops, or larger areas\
    \ of the floodplain downstream. So we soon realized we were confronted by an entanglement\
    \ of many spatial and temporal scales; the key question becoming how these processes\
    \ were ‘infusing’ and ‘percolating’ from one scale to another simultaneously at\
    \ different scales, in fact. Historical time was dissolving into a multiplicity\
    \ of interactions, just as you said. So I would say, to paraphrase your last definition\
    \ of archaeology, that it is not really non-scalar, when, on the contrary, is\
    \ basically scalar: archaeology is rather multi-scalar; this multiplicity of interactions\
    \ occurring at a diversity of scales ‘nullifying’ indeed historical time.\n\n\
    So, in this sense, archaeology is fundamentally ‘anti-historicist’, to reframe\
    \ Benjamin’s thought, since it is based on temporality – again the multi-scalar\
    \ time of things and beings. Are we on the same page, now?\n\nGavin: Yes and no.\
    \ Yes, there is a multiplicity of archaeological time which is at odds with the\
    \ singularity of chronology or metrological time. And for sure, it is anti-historicist\
    \ in the sense that most history tends to adopt a singular time (again, we should\
    \ not forget Braudel who argued for multiple time scales – even if, in the end,\
    \ he seemed to privilege the longue durée). And yet no. For I have a deep problem\
    \ with this notion of multi-scalar time because it conflates an analytical tool\
    \ for an ontology. Time is not multi-scalar in our metaphysics. Now at one level,\
    \ using the term multi-scalar to refer to this multiplicity of time is understandable\
    \ – it does capture something of the fact that different processes, events or\
    \ causalities seem to operate longer or shorter spans of chronological time, as\
    \ in your example of the briquetage sites.\n\nBut the problem with using the concept\
    \ of scale to capture this multiplicity is that it mixes together at least two\
    \ different kinds of multiplicity: duration and speed. We say something is long-term\
    \ if it lasts a long time, but we also say it's long-term if it changes slowly.\
    \ But they are not the same thing. Using one term to cover two very different\
    \ phenomena lands us in all kinds of problems, not least the problem of how to\
    \ integrate or talk about the interaction of things which have different temporalities.\n\
    \nSumming this up best I can, scale is a property of our metrology which allows\
    \ us to articulate the multiplicity of time, but we must not confuse it for multiplicity.\
    \ To understand the multiplicity of time, we need to pay much closer attention\
    \ to the nature of change, to its forms, its different manifestations which are\
    \ deeply connected to different materialities. My feeling is adopting the concept\
    \ of scale to address multiplicity has distracted us from this more important\
    \ issue of the multiplicity of change. But I am not sure if any archaeologists\
    \ would agree with me with an entrenched and normal part of our disciplinary vocabulary\
    \ now, and the concept of multi-scalar time is such hard to see past it. But I\
    \ would argue that we need to build a new vocabulary nonetheless.\n\nBut perhaps\
    \ you can tell me more how you see temporal multiplicity in your Briquetage de\
    \ la Seille project; do you think, given what I have said, there is a way to talk\
    \ about this multiplicity without invoking scale?\n\nLaurent: Again, I believe\
    \ we address these questions from two opposite ends: yours is rather theoretical\
    \ and philosophical — and is perhaps a bit too rigid. I guess — mine comes directly\
    \ from my field experience and is certainly lacking any solid theoretical framework.\n\
    \nIn the Seille valley, we began looking at the salt production techniques of\
    \ the Iron Age, but we quickly realized it was unproductive: we had to look at\
    \ the archaeology of the valley, from the beginning of the Holocene to the contemporary\
    \ period, and to study not only these prehistoric workshops but also their immediate\
    \ environment and beyond the area of the valley at large.\n\nThe Seille valley\
    \ project was truly an open-air methodological lab. We had a team digging archaeological\
    \ test-trenches and open excavations of the course, but also people studying micromorphology,\
    \ some others bio-stratigraphy and geo-archaeology through systematic coring.\
    \ More broadly, we also had a team of geophysicists surveying the valley, looking\
    \ for all kinds of features, both natural and anthropic. A first challenge was\
    \ to correlate all these observations in time and space, since we were addressing\
    \ different processes occurring at different places, different durations and different\
    \ speeds. Archaeological dating was not enough, since we chose to prioritize AMS\
    \ and C14 dating, wherever this was possible. This provided us with a metrological\
    \ framework, which was, essentially probabilistic. And of course, it was a problem\
    \ to reconstruct an accurate 'history', since this was impossible with such a\
    \ fuzzy chronology, to precisely identify changes of causes and effects. We just\
    \ had the material result of changes, always already transformed by its post-history.\n\
    \nSo we recognized that, as you have stressed, we had to focus on this absent\
    \ history but these present material products of change. And here, again, metrological\
    \ time was very useful to reveal both duration and speed, since the nature of\
    \ the remains had a strong impact on the behaviour of these changes and their\
    \ manifestation. To give you a few examples, the tossing of industrial waste around\
    \ the workshops immediately created a significant 'chronological dilation' through\
    \ a rapid accumulation of deposits. But, further on, the long-term effects were\
    \ different. We were looking at the gradual sedimentation of the floodplain, the\
    \ slow shifts of the river channel, and the transformation of the landscape over\
    \ centuries. These are processes that de de de de de de de de de de de de de de\
