    # 92 The future


    adopting a historicization of the present in the first place. How can you ever
    define an epoch or period within which you are living? Older generations of historians
    like Humboldt long warned of follies, which we now ignore them.9


    One way to look at this is to suggest there are two ways of understanding ourselves
    in time and history; one is historical, and one that adopts periods and requires
    we adopt a position outside of history, after it, beyond it. In this view, contemporary
    history is an oxymoron. It is impossible. The other is archaeological in the broad,
    philosophical sense of the term; it requires we adopt a position inside history,
    where there is no outside, and therefore before or after. Time bends back on itself.
    For the present, this is essential—we cannot otherwise simply believe the present
    never ends. We never catch up with it and go ahead of, except in some imaginary
    state. But we can stretch this never-ending present backwards quite a long time,
    though with the end, origins are equally impossible to pin down. Modernity is
    archaeology not history because it reaches back to 1850, 1879 or 1550 depending
    on your perspective. The Anthropocene too is archaeology not history, though here
    we are dealing with much more temporal elasticity, which it starts early as 12,000
    years ago or as recently as 150 years ago.


    So all this discussion of the historicization of the Anthropocene will me seem
    to conflate a historical with an archaeological understanding of what it is. I
    don''t believe it is helpful to see the Anthropocene as historical, as a period,
    though we can of course. The same applies to Modernity. This is a different dilemma
    and conflation to that raised by Chakrabartie and also to how you framed it above.
    So if we think the Anthropocene as archaeological, not historical, then the point
    is precisely not to think outside of it or beyond but rather to untangle it from
