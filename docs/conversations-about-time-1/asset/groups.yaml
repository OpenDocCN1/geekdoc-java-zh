    Instead, the chronological distribution of the coins drew a very bell-shaped curve,
    whose peak was clearly shifted towards the past, by about 20 years. There were
    even coins minted 50 years ago, which were still in use, every day. Such a picture
    provides us with a chronological distribution of probability dating the present
    (at least this present moment of December 2001): if we would find a random sample
    of this assemblage of coins (as happens all the time in archaeology), this one
    rather date back to an earlier period of time, located decades ago.


    How should we interpret this? We can''t really see the present in archaeological
    materiality; again, we only see the past in the present, which is the basic definition
    of the contemporary, by Agamben stressed. But then again, where has archaeology
    gone to, as an event of the present? The archaeological event is what ''comes
    behind''; it is pure futurity—and, by this, the reason why it has nothing to do
    with routine.


    I imagine you shaking your head; but look, just try to create an archaeological
    event in this instant! Everything around you is more or less — your house, your
    furniture, your books, your computer... and even the newspaper that I have got
    in my mailbox this morning was printed last night. So dig a hole in the garden
    and fill it with stuff; or just create a pile of things on your table, in each
    case making something which has never existed before: you cannot escape rearranging
    in another way, materials which were already there. This is precisely how Agamben
