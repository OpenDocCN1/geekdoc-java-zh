    # 118 Epilogue


    usually experienced as a relatively short duration. This does not mean the past
    was not actual – but the past only ever exists as a ‘once-present’ too. History
    is, construction based on stitching together multiple past-pasts into an extended
    period. In other words, ‘history’ (including archaeology) is grounded in temporality,
    not historicity.


    On this issue, we both agree though its implications are even more hazy than the
    last. Moreover, we differ perhaps is the implications this has for how we do archaeology,
    particularly the kind of narratives and stories we write and their relation to
    history. Gavin does not view the rejection of historicity as necessarily leading
    to a rejection of archaeology as history, Laurent is drawn to the idea of an archaeology
    very different to history. However, the differences are perhaps more one of degree
    kind than possibly solely terminological.


    This last point is, in many ways also the most important as it pertains to the
    wider goals and ambitions of archaeology. What is it we are trying to do? In the
    spirit of co-operation, let us end this book with a joint proposal, a provocation
    for what archaeology does.


    # Three theses on archaeology


    # Thesis 1. We can never go back. Only forward


    Since the past only exists in the present, and the present is always changing,
    the past will also always change too. To be clear though; we are not arguing that
    the past will always be re-interpreted differently by different generations. This
    is not a gloss on postmodernism. This may be the case, but that is not our point.
    Our argument concerns the materiality of the past-in-the-present, not its meaning;
    the persistence of the past within the present is always transforming. This is
    about Nachwirken, the après-coup or ‘post-history’ – the posthumous afterlives
    of things as they are entangled in later presents. The impact of the spatial layout
    of a Roman town creates one effect on its medieval successor, another on the city
    in the 21st century; Roman urbanism is filtered through later centuries of medieval
    and postmedieval urbanism and at each moment, the character of that Roman past
    is altered, because it intersects with a different present. Each present makes
    its own past visible – but renders others invisible. A Neolithic pit cluster lying
    inert and forgotten beneath a farmer’s field for thousands of years, only erupting
    into the present by archaeologists that field is converted'
