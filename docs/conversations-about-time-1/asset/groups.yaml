    # The present 81


    But what choice did I have? One option was to leave completely and try to get
    closer to the heart of Anglo-American archaeology; I mean the US. This is what
    many of our colleagues did as Michael Shanks, Ian Hodder or Sander van de Leeuw.
    But I knew I was never going to become an American, remaining forever what you
    call an alien – which is, in the English language, the word used to name extra-terrestrial
    beings! The other option was to go back home and rediscover where I had tried
    to escape from. This is what I finally chose to do. Not only because I already
    had a job in France waiting for also because I thought – and I still sincerely
    do that we are indeed different but moreover are complementary. If we could trust
    each other, the French, the British and the Germans, and work together like brothers,
    we could achieve great things. This is the reason why I maintained the dialogue
    with my Anglo-American friends and colleagues: yourself in Reykjavik, Matthew
    Reilly and Chris Witmore in the US, Chris Gosden at Oxford – and many others.


    The context is different and has shaped the direction I have followed. Surely,
    there is no coincidence that my intellectual influences are directly derived from
    the German-Jewish thinkers of the pre-Nazi Sigmund Freud, Walter Benjamin, Aby
    Warburg. This wasn''t on purpose but this is how it happened: in fact, I realize
    that I am just trying to heal the wound which had been inflicted by fascism and
    Nazism on the European intellectual tradition. I understand this could not be
    your primary concern. You belong to a different history.


    But we know each other well enough, to be able to talk frankly to each other,
    without fear of hurting each other: it was already clear, from an outsider''s
    point of view, that poststructural archaeology wasn''t going anywhere. Similarly,
    you don''t need to have second sight to see actually that the post-war Anglo-American
    domination is over and has already begun to crumble. Brexit is a British suicide.
    So what to do? What is going to come next?


