    Laurent: “当下主义”（Presentism）这个词是由法国历史学家弗朗索瓦·哈特在2003年创造的，这非常遗憾，因为它可能与另一个同名的不同概念混淆。对于英美世界的大多数人来说，他们通过一种显然当代的、在过去绝不存在的政治或意识形态视角来解释过去；在某种意义上，这是现在对过去的投射，这无疑是许多批评的对象。但哈特用这个词指的是什么呢？他发展了这一基本观察：在处理过去时，当代历史学家对待它们的方式与19世纪末或20世纪初的前辈完全相同。改变了什么？他们与时间（包括过去、现在和未来）的关系。我们认为，存在一种新的“历史性政权”（regime
    of historicity）；意味着我们不再认为现在是过去的自然延续。因此，现在同时从过去和未来中切离开，在这种情况下，我们生活在某种“全球性现在”中——可以说是处于当下主义的绝对统治之下。什么时候改变的？这很难说，显然是在20世纪后期，可能在20世纪80年代末到90年代初之间。这基本上就是哈特论证的观点。


    这个观点对于欧洲历史学家来说是一个理论关注点，还是说哈特察觉到了正如法语所说的“某种东西在空气中浮动”？令人惊讶的是，在同一时期——20世纪90年代初——我们各地方都开始转向时间与物质性的问题？难道真的巧合吗，当时人类学中也发生了现在所谓的“本体论转向”，这与替代时间方法也是相关的？换句话说，哈特是否察觉到了人类科学内部对时间理解的全球性本体论转型？


