    ## 86 The future


    preservation into an undefined period of the future to the impact we hope our
    work will make on future scholars and the discipline itself. All of which suggests
    to me a key issue here ties the past and future together is one of inheritance,
    passing on or passing down things from the past, to the future. And so the relation
    to time now also becomes clearer: to what extent does this ‘passing on’ relate
    to the passage of time?


    The future of course can be conceived in many ways but I do think, as archaeologists,
    it is in this relation of the past to the future that we have something most to
    contribute. In the age of the Anthropocene, there is a lot of talk now of the
    role archaeology can play, digging into our past as a process of gathering ways
    of living, coping with environmental change, forms of resilience and so on. Treating
    the past as a library of ideas, life-solutions which may help us plan for unexpected
    futures. This is all good and well, but it is also a very old idea, history as
    *magister vitae*, a life instructor from which one can obtain models or exemplars.
    To learn from past mistakes and what is missing is here something more concrete,
    more material, more temporal which the idea of inheritance encompasses. Because
    inheritance as a material process is where it all happens; arguably, the very
    passage of time is constituted by the multifarious processes of ‘passing on’.
    Some of this is being addressed by new research such as the heritage projects
    run by Rodney Harrison, Cornelius Holorf and others, exploring heritage and conservation
    as a future-assembling practice.¹ Seed banks, nuclear waste repositories and so
    on, are really good examples of this materiality of inheritance. But then so are
    governmetal and institutional structures for the preservation of wealth; what
    really struck me when I read Thomas Piketty’s book *Capital* a few years ago was
    how inheritance really played the central role in the creation of wealth inequality.¹
    It is by digging into inheritance structures that I think archaeologists can offer
    the most useful contributions to both understanding and transforming our future.


    But since you asked the question, you must have your own response too. What is
    that?


    Laurent: I must say this looks like a weird question wondering about the future
    since archaeology is supposed to be primarily concerned with the traces of the
    past. But as you say, working as an archaeologist is a transmission job which
    targets the future: we do our best to pass on the present archaeological heritage,
    as well as the knowledge which has been accumulated about it, to the next generation.


    But more deeply, as you suggest, any material creation is a message addressed
    to the future. People don''t expect their parents'' grave to be wiped out when
    they die themselves for instance, and this is the reason why they maintain faulty
    vaults. So our present material creations will become the archaeological heritage
    of the future: our gas stations, our airports, our supermarkets ... Well; this
    is interesting, as one says in English – meaning why not, but it is in fact not
    such an exciting idea!


    Heritage projects are rather a dull idea if they are conceived within the traditional
    perspective of history: the historian Jacques Le Goff wrote;³ cutting history
    into slices'', that is to say, merely considering these creations of our present
    material culture as the next historical slice. You asked when temporality is so
    crucial for the apprehension of the presence in Agamben''s sense (I mean the burst
    of the future in our present time)? Precisely for this reason: because it is lacking
    any archaeological interest if it isn''t.


    This brings us back to materiality again. If we consider that archaeology is basically
    the study of material transformation created by human activity, therefore our
    present time is the most archaeological that has ever existed. Our material impact
    on the landscape, the diversity and number of artefacts we produce daily, are
    far greater than that of any other period of human history. Similarly, the durability
    of our constructions and products is also beyond any scale, compared to those
    of the past; just think about nuclear waste, for instance, some of which is going
    to remain highly radioactive for hundreds of millennia, or even millions of years.


    Some people call this unprecedented situation the Anthropocene. What is new is
    not the nature of the human impact, it''s its scale. The question is not about
    knowing if the Anthropocene is, or is not, a new geological era – or a new archaeological
    age. It is not either dating its beginning or wondering if it is a fruitful concept,
    or the labelling for what has been accelerating since the Post-War period. It
    is to assess what it does to archaeology.


    And the impact of the so-called Great Acceleration of the Anthropocene on the
    archaeological discipline is huge. The development of preventative archaeology
    – which is called commercial archaeology in the Anglo-American world – is a direct
    effect of the pressure of the Anthropocene on the inhabited landscape. We dig
    where projects are going to erase the material memory of the places they target,
    excavating huge surfaces, some of them covering hundreds of hectares. We don''t
    just study archaeological sites anymore mainly archaeological landscapes. And
    we have to dig everything that is threatened by these development projects – even
    those vestiges of the most recent historical periods. In Continental Europe –
    where remains of the two World Wars are highly concentrated – the development
    of the archaeology of the contemporary part is directly related to preventative
    excavations. We may say this is an indirect effect of the Anthropocene on the
    practice of archaeology.


