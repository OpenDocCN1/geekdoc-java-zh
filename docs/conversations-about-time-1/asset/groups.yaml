    and not imported from elsewhere — like philosophy,

    sociology or anthropology... and this may be a point of

    disagreement between us. You''ll tell me.


    So yes, Millie''s Camp is one of my favourite examples, since it

    clearly shows the discrepancy that necessarily occurs between the ar-

    chaeological interpretation and the historic or ethnographic reality,

    when we are compare the ''lived past'' that people have experi-

    ced or remembered, and the ''archaeological past'' that you re-

    construct from its material remains. And here again comes the

    puzzling question of archaeological time, which, as we have seen,

    independent of the so-called ''real time'' — the time of people, clocks and

    history. Yes of course Bonnichsen''s team did a good job and they got

    things right in their interpretation of the past, surely even in the best

    way that was possible. But this is precisely the reason why they also

    failed with specific details, since it was clearly unavoidable to do so.

    They were unable to distinguish between episodic and regular events

    took place on the site, there was no difference in the

    archaeological record. And they were incapable of sorting the remains

    that belonged to prior or posterior occupations, since, at this scale of

    chronological resolution, it was truly invisible. You can''t overcome

    that by being more cautious or careful.


    So I dont that interpreting past occupations like this one

    at Millieie''s Camp is a ''pipe-dream'' I say that, when carrying out such

    kind of work, we have to take account these uneasy and quite

    offnoticeable constraints brought in by archaeological time,

    which are attached to the materiality of the archaeological record. I

    believe we both agree that. The difficult question is how to

    do that.


    When I say that archaeological remains are present residues of an

    absent past, I just mean this: these vestiges are coming down to us

    they are now now, already transformed by their post-history as *fossils*. The

    trouble is that, most of the time, we just ignore what their post-history

    (their transformission if you prefer) has been. What is nice about

    Millie''s Camp is that the recording of the remains has been so well

    done that you can use it to set up some sort of a ''mental experiment''.'
