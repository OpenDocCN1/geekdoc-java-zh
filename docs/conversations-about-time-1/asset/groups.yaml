    # 起初 23


    ![](img/97e9b797cfbc473816012daed7863bbe_31_0.png)


    图 1.5 由海因里希·施莱曼挖掘的特洛伊丘（Tell at Troy）横面图（参考 Geißler, 1902, 图 6）。


    我们仍然在这里，但它们的含义略有不同。因此，在某种意义上，这条路径仍然作用于随后的积层，这些积层留下了其独特的印记。过去通过它的存在限制着未来。它依然存在，尽管已经发生了转化，有时甚至变得无法识别。换句话说，过去指向未来，也许仅仅是时间流逝的一种结果，是重新解释产物。当重新解释停止时，过去就被冻结了。我们就可以挖掘它。


    你知道另一幅图（图 1.5），这是特洛伊遗址的剖面，收录于威廉·德尔普费尔德于1902年出版的《特洛伊与伊利翁》中.¹¹18 弗洛伊德的图书馆里就有这本书。这是一幅草图，但看那些连续的防御墙，一叠一叠的：就像在霍赫多夫（Hochdorf）墓中一样，它们维持并“重新解释”着一种属于已消失的过去的特征，这种特征的存在仅存在于记忆之中：一座深埋于地下的古代要塞城市。


    而这一切都发生在“现在”：即随之而来的不同现在，在期间，这些古老的遗迹被重新激活；以及我们现在的现在，特洛伊遗址依然屹立在那里。是弗洛伊德帮助我理解了考古学的关键问题不是过去，而是对过去的记忆——因为过去已经被记忆过程本身所束缚了。同样是弗洛伊德说服了我，在这一不同的方法中，过去所在的位置并非过去中一个虚构的地方——正如我们在考古学中习惯于考虑的那样：新石器时代、铁器时代、中世纪……而是现在本身，或者更准确地说，可以被称为过去的“事后性”（après-coup）的东西。


    加文：弗洛伊德的草图令人不可思议，这让我思考胡塞尔和弗洛伊德在多大程度上意识到过对方的工作，或者是否存在另一种联系纽带。胡塞尔1905-7年的图表比你展示的弗洛伊德图表稍晚一些，但这两位思想家都借鉴了布伦塔诺（Brentano）的作品，这里可能存在共同源，因为布伦塔诺在1873年就使用过类似的图表。但无论这些图表背后的故事如何，我们从两个不同的方向得出相似的结论，是非常有趣的。当然，弗洛伊德对考古学的兴趣是众所周知的，正如你指出的，过去延续到了现在，考古学确实与弗洛伊德的记忆和无意识概念有许多相似之处。尽管我当时也在读弗洛伊德，但我并没有像你那样建立起任何这种联系。我与你关注的问题最接近的接触是在我博士毕业后刚发表的一篇名为《忘记遗迹》（Forgetting
    the Post''）的论文中，在其中我基本上说考古学完全不像弗洛伊德所讨论的那种记忆；那种深远的过去、史前时代构成了一种激进的遗忘，那是我们属于我们去记忆的过去。我不确定今天如何看待这篇论文——它里面有一些优美的诗意，但我的主要论点更多关于史前时代作为一种异质的过去以及我们如何面对这一事实。这在部分受到了里科尔、海德格尔和列维纳的影响，以及异质性与时间之间的联系。我完全忽略了弗洛伊德所使用的时间与记忆的深层机制，而你捕捉到了这些。


