    # The future 89


    time is ostensibly our main matter of concern in these discussions, let bring
    us back to that. I recently read an interesting paper by one of the more perceptive
    commentators on the Anthropocene, Dipesh Chakraborty who talked about the deep
    schism in this discourse around the geological time scales of change and the human
    time scales of political action and response. It is as if these two discourses
    run side by side without aware of the deep incompatibility in their temporal register.
    What makes this particularly interesting for archaeology is that it operates on
    the same illusion. It has always lauded its attachment to deep time or the long
    term, yet at the same time, in a similar way, also cleaved to the role as the
    study of human life. And how has archaeology tried to resolve this paradox for
    itself? Of course many of us just ignore it. Only focus on long-term processes,
    others on the scale of lived experiences. But do we try and mediate these scales,
    drawing on Braudel (who didn''t actually mediate them at all) or some other means.
    Frankly, I have not been convinced by any of these attempts. What makes me suspicious
    of the concept of scale in the first place.


    All of which means to bring me to a place where, instead of agreeing with your
    diagnoses about the impact of the Anthropocene – it''s all about scale – I find
    becoming suspicious of it. That focusing on scale will just increase our sense
    of helplessness and inability to resolve this paradox outlined by Chakraborty.
    Perhaps we can examine this concept of scale a bit more closely; how do you stand
    on this, especially when it is used as a temporal concept?


    Laurent: You are raising here a deep and major question, which we shall have to
    return to more closely. In relation to scale, I wasn''t thinking, at this stage
    of our discussion, about time per se, but the intensity of present material creations
    and disturbances of existing material memory, which is preserved within the ground.
    As Bruno Latour and most point out, these processes of transformation of our natural
    environment are, compared to the previous ones of our human history, simply beyond
    any normality – they are cosmocolossal writes Latour, hypanthropical says Witmore.
    But let''s put aside, for the moment, this question of a geo-archaeological/logical
    time, which is addressed in Chakraborty''s paper; I''ll come back to it very soon.
    My first concern, as I said, is what this anthropocentric situation does to the
    practice of archaeology.'
- md: "\n## 90 The future\n\nI believe it terminates archaeology, as we have known\
    \ it. As you have pointed out, the flow of new data is so thick and rapid now\
    \ that it has become impossible to integrate them into the usual archaeological\
    \ discourse: they are far too numerous, continuously accumulating, making synthesis\
    \ an impossible task. For the first time, as you said, theory-building can't keep\
    \ up with the flood of data. So scholars retreat into more speculative work, far\
    \ away from the noise and the trouble of the field: in the Anglo-American world,\
    \ the archaeology of the contemporary past is a good example of such an archaeology\
    \ which is generally not based on excavations and extensive data: an above-ground\
    \ archaeology, as Latour would say, for which you just need to get a camera and\
    \ a notebook.⁷\n\nBut the advent of the Anthropocene is also putting the archaeology\
    \ in a deep crisis. It has become impossible to dig these ‘anthropogenic’ sites\
    \ – such as airports, highways, infrastructures, suburbs… They are far too large,\
    \ far too uniform, repetitive. But above all, they are entirely made by machines,\
    \ and I believe that archaeology has relatively little to say about machine-made\
    \ creations, since archaeology is basically the human: everything made, or experienced,\
    \ by humans. And it is quite revealing, I guess, when surveys or excavations are\
    \ carried out on sites of the contemporary past, it is always about human-scale\
    \ features: a few rooms of a flat, a pit in the ground containing stuff, and always\
    \ graves – as in any other period of traditional archaeology.\n\nBut I see your\
    \ point, which is: let’s be very careful about this concept of ‘over-scale’, since\
    \ it tends to freeze any kind of thinking, when confronted by the enormity of\
    \ this new anthropogenic situation; so I fully agree with you. On the other hand,\
    \ I believe the damage is so big that we can't fix it anymore with our old conceptual\
    \ tools: we can't bring the situation back to normal, or just rearrange it to\
    \ keep it bearable.\n\nWhat Chakrabarty points out in that paper is quite disturbing\
    \ indeed: to put the times of ‘natural’ geology and ‘anthropocentric’ history\
    \ are incompatible and we lack any good historical framework to really encompass\
    \ the nature of the Anthropocene. In other words, we don’t know how to deal with\
    \ a global history of the Earth, which would not necessarily be grasped from our\
    \ own human perspective, especially when it is about us. In fact, the ‘historicization’\
    \ of the Anthropocene leads us into an aporia: either we try to integrate the\
    \ Anthropocene into a human history of the planet looking for the realization\
    \ of some sustainable future – but in this case we completely miss the specificity\
    \ of the Anthropocene. Or we don't, looking instead for a long-term history of\
    \ the ‘Earth system’ – but again we miss in this case the peculiarity of the Anthropocene.\
    \ In fact, we are facing a hybrid monster: both natural and cultural – and the\
    \ trouble is we don't know how to think chimeras.\n\nThe trick about the Anthropocene\
    \ is that, in order to think the Anthropocene, we have to think *beyond* the Anthropocene:\
    \ This place could be the future (after the cataclysm of the Anthropocene, somehow),\
    \ but it could also be beside our post-industrial world. Whereabouts, but might\
    \ ask? With indigenous cultures which are still here today, according to Baschet:\
    \ after all, the advent of the Anthropocene is nothing other than the revelation\
    \ of the lethal nature of Capitalism. Following this unsure path, Baschet aims\
    \ to break from this tyranny of the present imposed upon us by the spread of the\
    \ Anthropocene. He looks for alternative models of time in Amerindian cultures,\
    \ such as those of Chiapas, in Mexico.\n\n*But I will send you the same question:\
    \ what do you think about this issue of the ‘historicization’ of the Anthropocene?*\n\
    \n**Gavin:** Perhaps I am misunderstanding you but this question of the historicization\
    \ of the Anthropocene to me is reminiscent of our earlier discussion about presentism\
    \ as a historical phenomenon, as a period. And to think the Anthropocene then,\
    \ like any period, and think outside of it, which is I suppose you also mean by\
    \ thinking always after it – to be ahead of it, to project ourselves into a future\
    \ when the Anthropocene is over. This reverses the normal order of things though;\
    \ periodization is usually conducted with *hindsight*, but when defining the period\
    \ of the present – whether that is the Anthropocene, Presentism or simply Modernity\
    \ – requires *foresight* not always is – think of Postmodernism which proclaimed\
    \ the end of Modernity from yet turned out to really just another version of Modernity.\
    \ And I suppose the evidence of such failures is why Fukushima proclaimed the\
    \ end of history, there is nothing after Capitalism, we have reached the end of\
    \ the road. Hartog elevated this to a wider regime of historicity, which Baschet\
    \ contends we need to shatter, although I should say I have not read Baschet.\
