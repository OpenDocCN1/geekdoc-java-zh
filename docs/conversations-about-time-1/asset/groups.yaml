    在上一章艰难的交流之后，我们在这里决定采取不同的方法处理这个问题。我们关注“当下主义”（presentism）概念及其对当代学的意义。这两个术语都不应被视为所当然。“当下主义”有很多含义，但最近被法国历史学家弗朗索瓦·哈特（François
