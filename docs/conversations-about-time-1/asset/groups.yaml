    in the last decade has been the concept of the Anthropocene as a defining feature
    of contemporary times. The Anthropocene is important because it connects the past
    to the future through the phenomenon of human impact at a planetary scale; it
    forces us to see how past actions are shaping future possibilities. In this chapter,
    we devote most of our discussion to thinking about the implications of the Anthropocene
    for archaeology. For scholars wanting to research the archaeology of the Anthropocene,
    especially of the last century, the scale and nature of the archaeological record
    test our current methodologies and approaches. How do you study vast, hybrid formations
