- md: '

    ## 94 The future


    not only a problem of contemporary times or Modernity, if you prefer, but indeed
    of all times in our human history. As archaeologists, we are standing on this
    side of temporality and not of historicity – which is an artificial concept, fabricated
    by our cultural tradition. Archaeological time – the time of objects and material
    remains – clearly demonstrates that historical time is nothing else than a dangerous
    illusion.


    For sure, if we keep thinking that the archaeological task is about historicizing
    the past, we are actually in big trouble. But the spread of the Anthropocene also
    brings us some good news. This never-ending present, with its specific temporality,
    gives us access to still completely explored areas of knowledge about the relationship
    between past, present, and future. In this sense, we may use the temporality of
    the Anthropocene as a weapon to overcome the pressure imposed on us by the Anthropocene.


    I don''t know if we understand each other well enough yet, could you explain how
    you would answer this question?


    Gavin: I fear we don''t understand each other right now. To what question are
    you referring? If it is the one I asked, then there is no question to answer in
    my mind. The historicization of the Anthropocene is not a problem, because I don''t
    think it makes sense to see the Anthropocene as a historical period like the Holocene
    or the Neolithic. The temporality of the Anthropocene is another matter however
    and again, for me this is a problem because it entangles time with the metrological
    concept of scale. From what I can gather, we both seem to stress the temporality
    over the historicity of the Anthropocene as the important thing; but where I want
    to talk about scale, you want to talk about the present. If so, the question becomes
    how do we bridge these two concepts so we can start again? Because I fear – and
    you sensed it too – we now seem to be talking past each other. So I guess we need
    to slow down. How do we build a bridge – or have even identified the right places
    on each side where there is any divide?


    Laurent: I don''t believe there is any divide between us; but to take an image,
    we are travelling on different planets, but sometimes very close, sometimes far
    away... So yes we both agree about the importance of temporality versus the historicization
    of the Anthropocene. However, I don''t think the metrological concept of time
    is a problem in itself if you take it for what it is: just a means of measurement.
    And I would add this metrological measurement of time is valuable for revealing
    the true time of temporality – when it makes sense for history – is a necessary
    dialectical lordship.


    The trouble, as Chakrabarty stresses, is what we put on this metrological time,
    considering cultures and civilizations. This is deeply paradoxical since the existence
    of periods and eras is obvious – as we are particularly aware – but the trick
    is that this has nothing to do with historical memory. You are working in Iceland
    where the human occupation dates back to the early Middle Ages: does this mean
    there was nothing before that? You have also been working overseas: if material
    culture lacks any clear trend of transformation over tens of years, does this
    mean it is deprived of history? So what does this mean precisely, isn''t it projecting
    our understanding of history – moving from primitivity to civilization onto a
    world that never worked like that?


    Yes, you are right. I am fascinated by the present, seen here as the place of
    the future – its transformation into a period, I would say. Tell me a little story.
    A very good friend of mine called Jérôme Prieur is a writer and a filmaker. For
    the last 15 years, he has been making a series of documentaries about Nazi Germany
    and WWII using all kinds of images that were produced during these times – propaganda
    films as well as amateur ones. Within this huge mass of pictures, he has found
    no recording of historical events. The Wannsee conference was not filmed, for
    instance; and in most cases, other images have been used to illustrate events:
    German troops marching along the Champs-Élysées to illustrate the invasion of
    France. Most of the images shot during these years display something else: daily
    life everywhere. Of course the shooting of these pictures is the result of a choice
    but regardless, they have recorded the temporality of WWII – and this is what
    is deeply fascinating about these pieces of films.


    What is the problem with scale, you ask? Seen from within a truly archaeological
    way, any period lacks historical time. History has never existed, as it has been
    reconstructed. The Anthropocene is digging out this paradox: history is both real
    – it happened once; it is really happening now and simultaneously only a perception,
    a way of seeing the past. The only real time is that of temporality, the sense
    of archaeology, archaeology of things and beings. Physicists actually say: time
    is not describable in terms of entities. We should think about that.


    But what do I mean with scale in this discussion? It is maybe my fault since I
    perhaps don''t see clearly what I mean by that...


    Gavin: What I mean by scale is perhaps a little different from how you framed
    it but not much. Yes, it is a metrology, a tool for measuring time. But as I see
    it, a temporal metrology has two facets. One is simply measuring duration using
    a regular unit such as years. This is what we mean by chronology, which I think
    is what you were referring to. The other facet involves interchanging the unit
    of measure (e.g. years for centuries), that is, a tool for zooming in or out,
    making larger or shorter spans of time focus. This specific aspect is what I mean
    by scale. Archaeologists and historians have invoked it to signify the importance
    of historical distance – that the more you zoom out, the larger and longer-term
    processes come into focus. Come too close and you see nothing. Humboldt’s analogy
    of viewing a picture is a classic example; come too close and it’s all a swirl
    of colours. Now since Braudel (if not before), we have qualified this to say that
    what you see, depends on your scale of analysis. Zooming out certainly makes things
    visible that were before invisible, the converse is equally true. Zoom out too
    far and you miss little details. For an art historian studying technique, coming
    up close to observe swirls of colour reveals other things besides what the painting
    depicts – brush strokes, blending, layering etc. Now this is all very good until
    you suddenly want to talk about how two (or more) scales relate. If we leave the
    analogy of Humboldt’s painting behind and come back to Chakraborty, the problem
    is, one scale reveals one thing climate change, global warming etc., another scale
    reveals human decisions, policy actions, consumer choice. How to bridge two vastly
    different scales? Ever since Braudel, we have been grappling with this problem,
    unsuccessfully, I think.


    The reason I wanted to talk about scale is to underline that the problem here
    is part of our own making. We have mistaken a historical operation – scaling,
    zooming in and out – for historical process. Listen to how archaeologists talk
    about this; they talk about different processes operating at different scales,
    unfolding over longer or shorter durations, etc. Now although the Anthropocene
    is perhaps testing our abilities to stretch this present to an extent previously
    unimaginable, essentially I don’t think there is otherwise anything unique about
    this ‘epoch’ in relation to archaeology or our understanding of time. Possibly
    you and I personally ascribe a different weight in our ‘philosophies of time’,
    and that may also have distracted me from seeing the deeper commonalities of our
    positions. So let me focus on these commonalities.


    This notion of the extended present is of course something I have borrowed from
    physicists, where it has a different meaning. But you also drew a connection to
    physicists where ‘time’ is not describable in terms of entities, but interactions.
    We should think about ‘that’. Yes we should, because this is what history as an
    extended present is ultimately about; the way interactions between things creates,
    shapes or nullifies time. But how would you think about this?

