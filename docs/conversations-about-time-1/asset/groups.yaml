    ‘snaking’ up and around the ‘ideal time’ (after Olivier 1994) 14

    - 1.2 Husserl’s Diagram of consciousness (after Lucas 2005) 18

    - 1.3 A sketch of the stratification of attributes of the funerary chamber in
    the Hochdorf “princely” grave (after Olivier 1999) 22

