    to gender-related or age-related activities 52

    - 3.2 ‘Old style’ and ‘New style’ archaeological stories (adapted from Olivier
    2020) 62


    # Prologue


    One of us (Gavin) had just finished a draft of a new book about time in archaeology¹
    and had asked the other (Laurent) if he would be willing to read it over and offer
    some commentary before publication. He kindly did but rather than send an file
    back, Laurent sent his thoughts in a series of emails which Gavin would occasionally
    respond. In the course of this exchange, a discussion emerged exploring some of
    our positions and Laurent was finishing Gavin''s manuscript, he suggested that
    maybe we should develop this exchange into an extended conversation: ''So, perhaps
    we should think about writing a book as a dialogue ... to discuss what we know
    and what we don''t, how we approach things ... how we think ...''. That was at
    the beginning of September 2020. Three months later, we had written around 40,000
    words of conversation which forms the basis of this book.


    There is no doubt the current situation the world finds itself over the period
    this book was written was conducive to this process. The coronavirus pandemic
    that hit us at the beginning of 2020 changed our lives and is still ongoing as
    we write this at the beginning of 2021; it is hard to predict what long-term impact
    it will have. But in the midst of, many of us have found that collaborative writing
    — which was always an activity that web-based and online platforms were supposed
    to be ideal for — became an opportunity ironic that it took a situation which
    locked us into our homes to bring us finally together. Because as we later relate
    in our conversation, we have known each other since the early 1990s when we were
    both doctoral students at Cambridge. Both of us were working on the topic of time
    and although we paid attention to each other’s work, we have never collaborated
    until now.


    # 2 Prologue


    Yet perhaps such collaboration was inevitable. In 2014, Laurent hosted a workshop
    in Metz, France and invited Gavin to participate. Three years later, Gavin invited
    Laurent to Reykjavik in Iceland as a guest lecturer at a PhD seminar. Opportunities,
    though rare, enabled us to meet and exchange ideas, get a better sense of what
    the other was doing and thinking. It was clear to both of us that we were circling
    around similar questions but often from different angles and positions. We also
    came from very different intellectual backgrounds; even though both studied at
    Cambridge, by this time much of our intellectual framework had long been established
    and the differences between us had proven frustrating, leading us to misread or
    not fully understand what the other was saying.


    Possibly it was this frustration as much as the recognition of sharing the same
    matters of concern led us to the point of starting this dialogue. Rather than
    writing separate papers and books, we both saw the benefit of engaging in an extended
    and deep conversation that could untangle the knots of frustration and enable
    us to explore questions that bothered both of us. Indeed, as much as it was a
    chance to talk about time, it also an opportunity to resuscitate an old genre
    of scientific writing: epistolary correspondence. Early publications of archaeological
    findings often took the form of a letter is well known, but in many ways, these
    published correspondence goes back to the 17th century and earlier. In an age
    before planes and trains, when long-distance travel was still a major commitment,
    exchanging ideas with colleagues largely took place through letter-writing. Living
    amidst a global pandemic, we find ourselves in a similar situation today in the
    21st century – although the speed, at which such correspondence takes place tempers
    in three months which in the 17th century, may have taken three years, alerts
    us to the fact that time was not only our topic of conversation, it also structures
    the nature of our conversation.

