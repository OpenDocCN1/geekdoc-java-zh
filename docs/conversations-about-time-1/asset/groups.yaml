    # 5 The future


    While in the last chapter we tried to avoid thinking about the present or contemporary
    as an historical period, one of the biggest issues that has emerged within academia
    in the last decade has been the concept of the Anthropocene as a defining feature
    of contemporary times. The Anthropocene is important because it connects the past
    to the future through the phenomenon of human impact at a planetary scale; it
    forces us to see how past actions are shaping future possibilities. In this chapter,
    we devote most of our discussion to thinking about the implications of the Anthropocene
    for archaeology. For scholars wanting to research the archaeology of the Anthropocene,
    especially of the last century, the scale and nature of the archaeological record
    test our current methodologies and approaches. How do you study vast, hybrid formations
    like the Great Pacific Garbage Patch, a gyre of marine debris (composed mostly
    of micro-plastics) in the northern Pacific which covers an area of thousands of
    kilometres? Such ''hyperobjects'' challenge both traditional notions of human
    and earth history. We each approach this problem from slightly different angles;
    for Laurent, the issue is about the hybrid nature of these materialities, the
    conflation of human and natural processes; for Gavin, the issue is about scale,
    specifically the language of scale as it is applied to time. For both of us, it
    is clear that new vocabularies, new ways of thinking about these vast materialities
    are needed, and this is something to which archaeology can make a great contribution.


    +   Laurent: We have been talking extensively about the past and present, which
    are our main topics as archaeologists, for reasons given in our discussions of
    these previous pages. But what about the future? I mean how could archaeology
    provide some useful tools for grasping the transformations of the future? And
    how may our understanding of time continue to this?


