    right hands it also created some very insightful work. But really, what we need
    is to think of theory less as a tool, more as a space for thinking, part of which
    is critique, part of which may lead to novel ways of interpreting or engaging
    with archaeological remains. Theory remains pragmatic, without being instrumental.
    What matters the dialogue we have, with others and with our material. But I have
    said enough now. Perhaps we can address some of the questions raised – and if
    you are not happy with my response to your question, by all means press me further!


    Laurent: This exchange of ideas between us is fascinating – and I hope it is for
    our readers too: it not reveals us to each other, but it reveals us to ourselves
    as well. You know this silly joke says: ‘Hell is when the police are German, the
    lovers Swiss, the mechanics French, the chefs British and it is all organized
    by Italians’. Of course, it is a stupid cliché, but there is a bit of truth in
    it and this is why it is funny. We are not good, as a nation, in mechanics or
    in building systems and theories in the field of the Human sciences. Guess who
    are? The Germans. We are at our best when it is a matter of fighting against any
    kind of dominant discourse. We are creative and imaginative, but we are also superficial,
    sometimes inconsistent. Not all of us, naturally, but this is a global tendency
    among us. As English, you are creative and imaginative too, but also pragmatic
    and more rigorous than we tend to be. Your weakness is intolerance, a defect you
    have in common with Germans and Americans: you tend to consider that there is
    only one right way to do something and all the others are wrong. And this is why
    you are attracted to systems and theories. Not personally of course, but this
    is as well a general cultural trait among Anglo-American people.


    Processural and postprocess archeologies were Anglo-American offensives against
    traditional European archaeology. It was fair, because continental archaeology
    had been deeply infected by fascism and Nazism during the 1930s and 1940s.¹18
    And German archaeologists, who had been ideologically working for the Nazi regime,
    had a strong influence on the rebuilding of French archaeology after WW2, up to
    the end of the 1980s. This tacit inheritance was one of the reasons that I came
    to Cambridge: to breathe some fresh air.'
