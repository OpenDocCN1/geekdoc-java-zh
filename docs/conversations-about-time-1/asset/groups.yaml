    range theory）的定义。但我不想表现得太迟钝，所以我将尝试根据你所说的其他内容来理解这一点，特别是关于这个批判问题。问题的部分在于与普遍性有关——即我是如何使用中程理论的，实际上在理论上也是——这是一个很好的理由，也许这正是我接下来需要解决的。


    你这一点上是正确的——也许特别在美国（在英国则程度较小），考古学家期望提供某种系统或范式：一种用以处理我们在遇到考古遗存时面临的许多解释性问题的工具。你说你所尝试做的只是提供批判，而这导致了各种误解和错误的预期。我认为关于广义的理论以及英美考古学家和许多欧洲考古学家如何看待理论，这里确实有一个重要的点；我同意范式或系统模型是非常问题的，尽管它们偶尔看起来非常务实（这可能与美国的实用主义哲学有联系，但并非以显而易见的方式。那是另一回事）。但对于英美的耳朵（至少对我的耳朵来说！），批判总是故事的一半；批判是至关重要的，而且一直是英美考古学的一部分，特别是政治批判，它是后过程主义的核心，以及它与女性主义和后殖民主义的联系。但批判就像是在说——“嘿”，我只是指出了问题，我的工作不是在批判的基础上建立解决学科问题的方法，推动话语向前发展。但我猜你对批判的理解可能包含更广泛的职责范围，所以你将如何阐述这一点。


    此外，这就是为什么我发现“米莉营地”（Millie''s Camp）对你来说是一个非常奇怪的例子；它是一个警示故事，一个批判，提醒我们我们在哪里犯了错。我将其视为中程理论的前驱，它试图捕捉到像米莉营地这样的案例所提供的警告，并将其转化为我们可以使用的东西——帮助我们找到解决方案，而不仅仅是指出问题。现在中程理论走得太快了，认为它能为物质痕迹找到破罗塔石；但在尝试的过程中，我们学到了非常多，并且仍在学习。我不认为中程理论（MRT）是没有意义的，相反，我们只需要接受它的本质：过时的类比，尽管试图让它变得不同。它永远不会给我们定律或规则，但它带给了我们思想。当然，我们不应该称我版本的
    MRT，因为这个术语会唤起非常特定的过程主义议程，我们不用担心那个。但点在于，我们需要始终在理论与不提供解决方案的批判，以及作为假装解决我们所有问题的纯工具或系统的理论之间找到平衡。


    所以，让我们尝试回答你的问题并告诉我的立场。正如之前所暗示的，我很难从时期代称或某种中程的其他角度来考虑现状的考古学（我将其非常宽泛地理解为一种适合用过时类比思考的背景，必然是最初在过程主义下设计的那种寻求规则的系统）。我怀疑第二个定义可能更接近你的观点。同时，我觉得这个讨论已经真正偏离了关于“一种方式的考古学”，我觉得时间性（temporality）的问题丢失了。因为对我来说，我们在这里真正讨论的仅仅是，我们此时此地的生活经验，应该如何与我们在尝试理解考古手段时所做的事情联系起来。对我来说，这个问题更多是关于一个普遍事实：作为一名研究过去遗存的考古学家，我们处于现状之中，而现状是时间的，也是政治的、文化的、物质的等等。所有这些几十年来一直是（英美）理论的关键部分。为什么时间性如此至关重要？


    关于你的问题：相对于英美和欧洲的研究，我在什么位置？我在前者中长大，但渴望与后者重新建立联系，我认为我正在这样做，特别是通过思考理论的作用。对于美国人来说，这可能是他们在1999年伯恩的欧洲考古学会（EAA）会议签署了所谓的“范式终结”之后必须做的事情。对我来说，我确实接近英美传统，但也看到它非常需要重建，并在某种程度上，通过像我们在这里这样与我的（而非针对对我的）欧洲同事进行更紧密的交流。我同意你的观点，理论不能被认为是一种应用于一组数据的系统或工具；这样想它真的没有帮助，并因此产生了一些最糟糕的垃圾和胡说，但也产生了许多失败的预期。不过它也不是全坏的——它开阔了视野，事实上在某些方面，它恰恰是在作为批判时效果最好。正如此，它也创造了一些非常有见地的工作。但实际上，我们需要的是少少把理论看作工具，更多地将其看作一个思考空间，部分是批判，部分可能导致解释或接触考古遗存的新颖方法。理论保持务实性，但不具有工具性。重要的是我们与他人以及与我们的物质之间进行的对话。但我已经说足够了。也许我们可以解决一些提出的问题——如果你对我对你问题的回答不满意，务必继续追问我！


    劳伦特：我们之间的这种思想交流非常迷人——我希望对我们的读者也是如此：它不仅让我们彼此了解，也让我们了解了自己。你知道那个愚蠢的笑话：“地狱就是警察是德国人、情人是瑞士人、机械法国人、厨师英国人，而这一切是由意大利人组织的”。当然，这是一个愚蠢的陈调，但它确实有一点事实，这就是为什么它好笑。我们作为一个国家，在机械或在人文科学领域建立系统和理论方面并不擅长。猜是谁？德国人。我们在面对任何主导性话语时表现最好。


