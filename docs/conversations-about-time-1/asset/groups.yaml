    # The past 53


    What would happen, instead of 1968, we would study this site right now, more than
    50 years later, in the 2020''s? (Table 3.1)


    All the organic components – such as fabric, cardboard, paper, skin or leather
    ... would surely have disappeared, reducing remains by up to 70% in some areas
    of the site. More durable materials – such as metal, glass or plastic – would
    remain in situ, dramatically transforming the picture of the site. So what would
    we get? Most of the vestiges on the interpretation of Millie''s Cap based on what
    would have gone, selectively withdrawing the evidence suggesting male activity,
    such as tobacco consumption and hunting practices. What would remain be anecdotal
    pieces, compared to the original assemblage garbage abandoned on the site: they
    would give greater importance to the presence of female and juvenile activity,
    through pieces of cosmetics and plastic toys for instance. We would surely interpret
    this in a completely different way, perhaps as a place of female feasting and
    playing with children.


    We have known all of this for a long time you would say agree with you. What I
    am trying to stress with this example is that the archaeological past – as an
    assemblage of material remains – unstable and therefore this instability has a
    direct impact on the way we interpret the lived past which has produced these
    archaeological remains: we tend to believe that, depending on this loss of material
    evidence, we would say more or less about this one, when in fact we would reconstruct
    different worlds.


    But this is just half of what is going on in the ‘archaeologization’ process,
    since we don’t look at it, focusing our attention on the ‘past in its own terms’,
    as you said. As some of the original information is quickly vanishing over time,
    another part of what may be called ‘secondary information’ is accumulating in
    the course of the ‘post-history’ of an archaeological past. To put it otherwise,
    we know far more about the past than the people of the past would have known themselves.
    Imagine for a second that you would be able to visit your ancestors who were living
    three centuries ago: probably you would be unable to fully understand their language,
    to grasp their habits and figure out their concerns, but surely you would have
    plenty to observe in their house and their environment – addressing questions
    which have been shaped by what has happened afterwards. You would problematize
    this past in some unique way, which depends on the posterior ‘historization’,
    so to speak, of this moment.


    This is, I believe, the very essence of archaeological interpretation, and surely
    not, as you have put it, some sort of archaeography. This'
- md: "\n## The past\n\nbrings me to your second point, which is about this very fundamental\
    \ question of reaching the past. I have mentioned Benjamin as a major influence\
    \ on my work, which is equally important as Sigmund Freud. Contrary to most of\
    \ the commentators of his work – who in the many comparisons are made of psychic\
    \ memory with archaeology a simple ‘metaphor’ – I am convinced that Freud intuitively\
    \ discovered some patterns of archaeological timeline, reading and observing the\
    \ finds of the archaeologists of his time. It is surprising to see the evidence\
    \ of archaeological stratigraphy – that Freud discovered in Schliemann’s publication\
    \ of the excavations at Troy; the profile I showed earlier – contributed to changing\
    \ Freud’s practice and understanding of the new discipline he was building. Obviously\
    \ realized that stratification is not a simple process of accumulation – one layer\
    \ replacing the previous one – but also of transformation and transmission (again!);\
    \ the ghost memory of the past is continuously repeated and reinterpreted, always\
    \ ‘at present’ in the many presents of its history; it goes across them. This\
    \ is what I mean when I say that archaeology is necessarily an archaeology of\
    \ the present.\n\nI must confess that I have undergone psychoanalysis for some\
    \ seven years, which has probably made me much more familiar with these strange\
    \ things. What you realize – to your surprise – is that you have been ‘inventing’\
    \ your own biography, interpreting events and relationships with people and relatives\
    \ in a way that was feeding your imaginary construction of yourself and your personal\
    \ history. You realize precisely when you begin to discover what you thought were\
    \ facts, rather your own interpretation of them, which you made in a particular\
    \ context. With this psychic context evolving from now, you discover that there\
    \ are other interpretations which you have completely missed, of what happened\
    \ in your past.\n\nThis long detour is to stress two important points, I believe:\n\
    \n- 1. Yes, past events or situations have left double traces, which bear witness\
    \ to what they were about; there is no doubt about that.\n- 2. But we only get\
    \ access to them through an interpretation in the ‘afterwards’ (in its ‘après-coup’),\
    \ which depends on the present context of this interpretation, which is enlightened\
    \ by their ‘posthistory’.\n\nSo it doesn’t mean, of course, that we have to stop\
    \ ourselves ‘telling stories’ about the past: in this matter, we are essentially\
    \ story-tellers, since this is the only thing we are able to do. But we have to\
    \ be aware of that: we are not reconstructing the past; we are just, as you put\
    \ it, re-presenting it for ourselves.\n\nBut we have been talking a lot about\
    \ interpreting the past. If you don't feel like commenting on what I have said,\
    \ I would like to come back to the archaeological evidence and its relationship\
    \ with the patterns of archaeological time. My position is that we have to change\
    \ our traditional understanding of archaeology, since it is largely based – as\
    \ Benjamin would advocate – on some historicist approach of time. Exchanging ideas\
    \ with you, I don't feel that you are as demanding as I tend to be. Am I right?\n\
    \nGavin: I know what you mean about being a blind man in a cave – I often have\
    \ been feeling too. I also think we share the commitment to trying to understand\
    \ archaeological time from within, rather than simply imposing philosophical ideas\
    \ from outside. We may differ in how we approach this; I tend to use philosophy\
    \ and social theory not as a search for analogs or models to apply to archaeology,\
    \ but rather as a foil, to think through archaeological problems or expand my\
    \ imagination. I suspect my differences in writing and rhetoric are greater than\
    \ the actual processes of thinking here.\n\nSimilarly, perhaps you are right in\
    \ that I have attributed to you a stronger rejection of the traditional goal of\
    \ archaeology of telling stories about the past that you actually hold. As you\
    \ make clear here, you still see this as viable, albeit qualified by an awareness\
    \ of this posthistory. In this sense, we are it seems in agreement. On the other\
    \ hand, you feel I am not as demanding as you are about changing our traditional\
    \ understanding of archaeology based on this common understanding, and maybe you\
    \ are right. Although again, it may depend on what the demands are and how much\
    \ change is needed. It is vital we talk across purposes as this has been a recent\
    \ work of mine, especially when reading your work: how much ground we share and\
    \ differ. I think it all comes down to this issue of posthistory and also what\
    \ you mean when you invoke Benjamin's critique of historicism and what historicism\
    \ is. Let me confess I am not as enamoured of Benjamin as you are. He is very\
    \ popular and I have read his work, found it stimulating. But I have always felt\
    \ it lacked something, but maybe this says more about me than Benjamin. For example,\
    \ my understanding of historicism is that he was arguing against a naïve view\
    \ of history as a linear succession of events leading somewhere. It is difficult\
    \ to be excited by this, especially in the 1920s or even in the 1980s when I first\
    \ read him as proclaiming the death of God to a secular age. But I am sure I am\
    \ missing something else here; for example I agree that you would problematize\
    \ this differently to me, because you came after them, like an anthropologist\
    \ trying to understand. How do we understand the past better than themselves;\
    \ this is also about historical distance or what?\n\nA list of questions here\
    \ I can try and bundle into two:\n\na) what you understand by Benjamin's notion\
    \ of historicism – what does it involve?\nb) what it is posthistory for you that\
    \ changes how we tell stories about the past (beyond the obvious, methodological\
    \ processes, source criticism, etc.)\n\nLaurent: Walter Benjamin is a bizarre\
    \ and eccentric character, who was not at ease in his body or time. He was not\
    \ really a historian, not really a philosopher, not really a writer, but a bit\
    \ of all three. To be perfectly clear, he is not really an enthusiastic voice\
    \ for our discipline. I am not about his aspiration for Marxist revolution and\
    \ obsessive attraction for Judaism. What I enjoy is his approach towards the past,\
    \ as he says, a materialistic perspective – which is fundamentally archaeological.\
    \ This was invented by an 'outsider', as he considered himself. The Arcades project,\
    \ that he never achieved, is such a crazy enterprise: studying the cultural spirit\
    \ of the 19th century from this material remains. Of course he never saw this\
    \ as some sort of archaeology of the contemporary past, but rather as literary\
    \ wandering in a city full of memories, portraying himself as a dreamer. What\
    \ strikes me in this ‘Benjaminian’ approach is that it immediately makes time\
    \ a problem, and therefore history as a challenge – requiring us to reconsider\
    \ the relationship of history with the time and the past.\n\nIn short, Benjamin's\
    \ critique claims that the past, in order to be truly the past (in its own terms\
    \ as you would say), has to be recognized by the present, by some sort of revelation.\
    \ This is what we do when you say that in telling stories about the past, we are\
    \ importing its presence into our present, ‘representing’ the past so to speak.\
    \ And so this reappearing of the past becomes like a tiger, according to Benjamin:\
    \ in fact he may jump over centuries and even millennia. The past comes back through\
    \ its *Nachleben* as Warburg said.\n\nWe come to the second part of your question,\
    \ since, as you stress, this is not just about uncovering the past. This is about\
    \ recognizing it in the present. An example immediately comes to my mind, Camille\
    \ Jacob, who was the greatest historian of Gaul at the beginning of the 20th century\
    \ in France. The First World War had just started when he was teaching at the\
    \ College de France. During these four years, we were confronted by the bombing\
    \ of cities, endless trench war, atrocities and misery in his own country... and\
    \ he said: I understand now. Understand why, in the historical texts of Antiquity,\
    \ people have such a relationship with the ramparts of their cities, which they\
    \ saw as almost sacred. I understand the shock of invasion, how it troubles the\
    \ entire society, from the bottom to the top, in many different ways – as it did\
    \ when Caesar’s army invaded Gaul. I hadn’t perceived that before the war; in\
    \ fact, I was unable to get it. But now, I can read those texts in a different\
    \ way, feeling and being closer to their inner truth.\n\n you see, this is not\
    \ just interpretation, or re-reading the past. It is, as Benjamin argued, about\
    \ the *meeting* of past and present, in which the aura of the past is revealed\
    \ within the present and by the past, to speak. It doesn’t change the way we tell\
    \ stories about the past, but it transforms their identity. I believe that they\
    \ of – layman memories or scientific works – are fictitious, as our personal memories\
    \ are also fictitious. Fictions in the best way: I mean they carry a powerful\
    \ truth. They create an effect of veracity, like when you are reading a very good\
    \ novel, you feel it’s real; it could be the very description of reality. I think\
    \ that, like writers, this is what we are trying to achieve, as archaeologists\
    \ or historians, but with different means.\n\nBut you are pulling me towards interpretation,\
    \ when I would like to talk with you about material evidence and this enormous\
    \ discovery\n"
