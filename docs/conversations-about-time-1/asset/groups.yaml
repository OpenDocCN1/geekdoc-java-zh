    # In the beginning 13


    The serations we commonly use in archaeology are based on the search for the first
    appearance of attributes. Within the combinations of criteria we offer them, they
    look for what seems to come first, then second and so forth... and rearrange the
    matrix in order to get a diagonal effect, which is supposed to translate into
    a movement across time. To put it in another way, these serations are based on
    the principle that regular and uninterrupted change may be exploited as a direct
    measurement of time.


    That''s fair enough, but in doing so, these methods are in fact distorting the
    order that the artefacts had in ''real time''. Seriations cannot deal with the
    fact that there is often a period of latency between the first appearance of early
    attributes – which suddenly pop up somewhere – and their later adoption by most
    of the population. So the method groups together all the individuals bearing these
    peculiar attributes, no matter what their respective position is in ''real time''.


    And there is a symmetrical problem when change is slowing down or just not happening.
    It happens when types become ''popular'' or ''successful'': they are standardized.
    For seriation, which is blindly looking for repeated changes, time has just stopped
    moving. Seriations had no way to distinguish, for instance, these miner''s lamps
    produced in Western Europe in the 1880''s from those made in Poland in the 1970''s,
    since they are basically alike.


    When you look at the speed and intensity of these sequences of change, projecting
    these trajectories across ''real time'' onto the ideal linear ''real time'' –
    you observe a strange phenomenon: the archaeological ''real time'' – the time
    of objects, as it has happened – is snaking up and down the ideal axis of pure
    line time. The initial periods of innovation are clearly ''in advance'' of regular
    time – they are lying in their future while those of standardization are late,
    in the past of what should be the situation if time was regular. This is, I believe,
    the expression of the ''accordion effect'' you were talking about (Figure 1.1).


    But here something quite disturbing is occurring: ''real time'', the time of things
    that have actually happened, is not the ''ideal time'', the irreversible time
    of clocks on which any chronology is based. In other words, dates and dating belong
    to different universes, which are irreconcilable. This is bad news for archaeology,
    but this is also very bad news for our understanding of time in archaeology: common
    time (the time of chronology) cannot deal with the ''real time'' of the artefacts,
    which should correlate with the true ''archaeological time''.'
  - '[PAGE 22]


