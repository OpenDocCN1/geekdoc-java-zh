    ## 过去


    这引我进入你的第二个观点，即关于通往过去的这一非常基础的问题。我曾提到过本雅明对我工作的重大影响，这与西格蒙德·弗洛伊德同样重要。与大多数研究他作品的评论者不同——他们在许多比较中，将心理记忆与考古学等同起来，并认为这仅仅是一个简单的“隐喻”——我深信弗洛伊德通过阅读和观察他时代考古学家的发现，直觉地发现了某些考古时间轴的模式。令人惊讶的是，考古地层学的证据——即弗洛伊德在施莱曼出版的特洛发掘报告中发现的；正如我之前展示的那个剖面——极大地改变了弗洛伊德对他正在建立的新兴学科的实践和理解。他显然意识到，地层化并不是一个简单的堆积过程——即一层取代另一层——而是一种转化与传递（再次强调！）；过去的幽灵记忆不断地被重复和重新诠释，它在历史的许多时刻中始终处于“当下”；它贯穿了这些时刻。当我说考古学必然是一场当下的考古学时，我就是这个意思。


    我必须承认，我接受过大约七年的精神分析，这可能让我更熟悉这些奇怪的事情了。你所意识到的（令你惊讶的是）是你一直都在“发明”自己的传记，以某种方式解释与他人及亲属的关系，这种方式喂养了你对自身及个人历史的想象性构建。当你开始发现你曾认为是事实的事，其实是你在特定语境下对它们的诠释时，你便意识到了这一点。随着这种心理语境从现在演变，你发现对于过去发生的事情，还有你完全遗漏的其他诠释。


    我认为这段长长的弯路是为了强调两个重要的点：


    - 1. 是的，过去的事件或情况留下了双重痕迹，见证了它们的本相；这一点毫无疑义。

    - 2. 但我们只有通过“事后”的解释（在其“事后作用”après-coup）才能接触它们，而这种解释取决于解释时的当下语境，这种语境又被它们的“后历史”所启迪。


    所以，这并不意味着我们必须停止对过去“讲述故事”：在这一点上，我们本质上是讲故事的人，因为这是我们唯一能做的事。但我们必须意识到这一点：我们并不是在重建过去；我们只是像你所说的，为我们自己重新呈现（re-presenting）它。


    但我们讨论了很多解释过去。如果你不想对我说过的话发表评论，我想回到考古证据与它的关系。我的立场是，我们必须改变对考古学的传统理解，因为它在很大程度上——正如本雅明所主张的——基于某种历史主义的时间观。与你交流观点，我并不觉得自己像你那样投入。


    加文：我明白你所说的像在洞穴里的盲人——我经常也有这种感觉。我们也共同这一点，即试图从内部去理解考古时间，而不是简单地从外部施加哲学观点。我们在如何处理这一点上可能存在分歧；我倾向于将哲学和社会理论不作为应用于考古学的类比或模型，而是作为一种衬托，扩展我的想象。同样，你可能是对的，我将对考古学的传统目标归结为一种强烈的拒绝。正如你所明确的，我认为这是可行的。在这一意义上，我们似乎是共识。另一方面，你觉得我并不像你那样投入，这取决于需求以及需要多少改变。这对于我们讨论过去至关重要，尤其是在阅读他的著作时：我读过他的作品，发现它很有启发性。但我一直觉得它缺少了某些东西，也许这比本雅明本身更多是关于我的。让我承认，我并没有你那样痴迷于本雅明对历史主义的批判，以及历史主义究竟是什么。我确定我在这里遗漏了什么；因为你以不同的方式对我化这个问题，特别是在1920年代甚至80年代当我第一次读到他宣告世俗时代的死亡。在战争之前我没有察觉到这一点；事实上，我无法理解。但现在，我可以用一种不同的方式阅读那些文本，感受并更接近它们的内在真实。


    这里有一系列问题可以尝试归纳为：


    a) 你对本雅明的历史主义概念如何理解——它包含了什么？

    b) 对你来说，后历史是什么，它如何改变了我们讲述过去的方式（除了显而易见的方法论过程等）？


    朗特：沃尔特·本雅明是一个离奇且古怪的人物，他在身体或时间中并不自在。他不是一个真正的历史学家，不是真正的哲学家，也不是真正的作家，而是这三者的结合体。清楚地说，他并不是我们学科的狂热支持者。我并不是他对马克思主义革命的渴望或对犹太教的痴迷。我享受的是他对过去的态度，正如他所说的，一种唯物的视角——这本质上是考古学的。这是由一个局外人（他自己）发明的。他从未完成的《拱廊计划》（Arcades
    project）是一个如此疯狂的尝试：从物质残留研究19世纪的文化精神。当然，他从未将其视为某种当代考古学，而是在一个充满记忆的城市中漫游，将自己描绘为一个梦想家。这种“本雅明式”的方法令我震惊的是立即让时间成为了问题，因此历史成为了一个挑战——要求我们重新考虑历史与时间以及过去的关系。


    简而言之，本雅明的批判认为，过去为了成为真正的过去（正如你说的，用它自身的术），必须被当下的某种启示所承认。当我们说在讲述过去时，我们是将它的存在引入到我们的当下，可以说是在“呈现”过去。因此，这种过去的重新出现根据本雅明的说法，就像一只老虎：事实上，它可能跨越世纪甚至数千年。正如瓦尔堡堡所说的，过去通过它的“生命延续”（Nachleben）回来。


    我们来到你问题的第二部分，因为正如你所强调的，这不仅仅关乎发现过去。这是关于在当下承认它。一个例子立刻出现在我脑海：卡米尔·雅各布（Camille Jacob），20世纪初法国高卢最伟的历史学家。他在法兰西学院教学时第一次世界大战刚刚开始。在这四年里，我们面对了城市的轰炸、无休止的壕战，他母国的暴行与苦难……他说：“我现在理解了。”理解为什么在古代历史文献中，人们对城市的城墙有着这样的关系，他们认为那几乎是神圣的。我理解了入侵的冲击，它是如何以许多不同的方式从底层到顶层扰乱整个社会的——正如凯撒的军队入侵高卢时一样。在战争之前我没有察觉到这一点；事实上，我无法理解。但现在，我可以用不同的方式阅读那些文本，感受并更接近它们的内在真实。


    '
