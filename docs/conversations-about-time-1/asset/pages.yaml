  md: '# 4 Prologue


    The following conversations all take place through email but by cumulatively adding
    to a document. In all, we exchanged this document 60 times and although it has
    undergone some minor editing, what you will read is more or less what we wrote
    to each other. We divided the conversations into five chapters but otherwise the
    manuscript was then reviewed by two anonymous referees who provided, critical
    distance; it is hard to make changes to a dialogue after it has been written,
    much harder than a regular text and the reviewers acknowledged this. However,
    we wanted to take on board some of their comments so we added a final, dialogue
    at the end (chapter 6), which uses these reviews as a basis for responding to
    some of the issues we imagined some of our readers might want to know more about
    – especially issues which did not address in the main conversation.


    So what should the reader expect? This is not an introduction to theoretical debate
    around time in archaeology; for that, there are other books and texts available,
    including one written by one of us. We don''t survey ''the state of the art''
    and some readers will probably be disappointed by omissions or uneven coverage.
    For readers familiar with the works and for students, this may be off-putting.
    And yet because of the conversational and personal style in which this is written,
    we feel that even a reader with little familiarity with our positions should be
    able to follow the dialogue. We situate the topics and problems we discuss within
    concrete contexts and to help the reader, we provide short outlines at the head
    of each chapter. These are part traditional abstracts/summaries, part guides to
    reading.


    The first two chapters catch the chronological development of our thinking, starting
    at Cambridge where we first met while doing our doctoral research in the 1990s
    and then how our developed thereafter. The last three chapters go on to explore
    various issues around time that have occupied us since and are roughly organized
    around three concepts: the past, present and future. The final chapter, as already
    mentioned, provides a short attempt to anticipate readers misgivings over major
    omissions in the previous chapters; it is inevitably truncated and selective but
    hopefully it at least acknowledges some the gaps in our main discussion. Rather
    than offer any further summary of what is discussed in these chapters, we invite
    the reader to simply start reading; after all, the point lies in the process.
    At the end of this book however, we offer some general reflections on the conversation
    and try to draw out the key points'
