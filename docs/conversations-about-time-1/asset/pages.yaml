- img_proc: true
  md: 'In the beginning 7


    had to be solved first wasn’t how to interpret archaeological evidence;

    I mean how to use material remains to understand past practices and past beliefs
    or past cultural representations. It was time. Not time in general, not time abstract;
    but time in the archaeological record: that is to say, time is recorded within
    archaeological matter.


    It was obvious, for instance, that there were different chronological dynamics
    at work within our archaeological data: clearly, the traditions of building graves
    and funerary monuments were not moving at the same speed as those attached to
    the place of grace gives as offerings, and similar discrepancies were also visible
    according to differences among the deceased: men and women, adults and children,
    rich and poor people ... And perhaps more worrying, the flow of time was running
    at the same pace within the different periods of time reconstructed by archaeology:
    sometimes it was very slow, or very quick on the contrary; sometimes it was running
    over very long periods of time, and then suddenly short ones. I was facing a complete
    mess: how to put together any coherent narrative about the past in this situation?


    So I began to realize there was a problem with time in archaeology. Because time
    was differently recorded according to the various ways that immaterial practices
    were materially translated into the archaeological record, I suspected the problem
    lay in this material recording. In other words, I began to understand that I had
    to think of time as attached to matter. As something relative — being related
    to materiality — and not as an absolute measurement, independent of everything.


    Put like that, it sounds abstract. To get a clearer idea of what was going on,
    I constructed an experiment. What would happen if, for instance, we tried to date
    contemporary artefacts as a series of miner’s lamps — already perfectly dated
    to within a year and distributed over nearly two centuries — according to archaeological
    methods of dating, specifically ser? To put otherwise, what would happen if we
    projected these material productions into a perfect mathematical linear time,
    in which time is measured by uninterrupted change? Would it disturb the ordering
    of ‘real time’, which was marked by the dates of production of these artefacts?
    In other words, would archaeological matter behave in its own way, independently
    of this absolute and abstract time of clocks?


    Of course it did. It even did so spectacularly. Each part of these technical objects
    was travelling time at its own speed, sometimes alone, sometimes in synchrony
    with some of the others. Some of them are like shooting stars, suddenly expanding
    and then'
