  md: '# 10 In the beginning


    Gavin: This throws up an interesting issue. In purely formal or design terms,
    there is no difference between Roman pottery and clocks. We can study both and
    look at how technology, materials, design intertwine. But in temporal terms there
    is an important difference. With modern objects like clocks we often have better
    information on dates as with your miner''s lamps we can start with time under
    control, to speak. Conventionally with archaeological objects, the situation is
    not like this — in fact it is the opposite: you are often using form or design
    to elicit chronology, that is your goal, not your starting point. The advantage
    of modern objects is you can re-examine time without worrying about chronology.
    Of course not all modern objects are necessarily easy to date and some older ones
    do come with dates — here I am thinking for example of Deetz and Dethlefsen''s
    famous analysis of New England gravestones to demonstrate popularity curves of
    design. This story is often mistakenly given as an example of seriation, but in
    fact it is nothing of the sort; seriation has no dates, you are using the assumption
    of popularity curves to chronologically order pottery for example. Again, time
    is your goal, not your starting point.


    This difference is important and also liberating. Because if you have dated objects
    already, you can start to explore the relation between time and form in a different
    way. And what I tried to show is how object — even one with a single date stamp
    — was always a composite of the old and the new. It has temporal layers, some
    of these layers stretched back very far, some more recent. In a way, I was trying
    to stratify design and form, but the superposition of strata was not like deposits
    in the ground but more like time-lines bundled together, imbricated or overlapping.
    I think one of my main goals was to make us think about the relation of time to
    typology in a different way. Instead of seeing types succeeding one another or
    even overlapping in popularity curves as with the gravestone stone of Deetz, I
    wanted to argue that a type itself was a composite of overlapping layers or elements.
    Once we see types as stratified like this, we can then take this method and apply
    it to archaeological objects and focus on their temporal layers rather than types
    — which is what I tried to do with my PhD material, which dealt with later prehistory
    of northern England.


    I am not sure I was successful however! Indeed, I think you were taking a far
    more sophisticated approach to time than I was back'
