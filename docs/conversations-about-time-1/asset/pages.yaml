  md: '# 2 Life after Cambridge


    Archaeology is often described as a discipline that deals with the past, yet as
    other archaeologists have noted, we don''t have access to the past – only what
    remains of the past in the present. But recognition of this has much more serious
    implications that we often give credit for. The present is, para-doxically, the
    only place the past – in whatever shape or form – actually exists as Laurent touched
    on in the last chapter. This property of ‘remaining’ is critical to archaeology,
    not just as a methodological issue, but as a substantial matter of writing and
    interpretation. What does survive or remain, affect the shape of our archaeological
    accounts of the past? This is not about how we interpret the past from what survives,
    but more importantly, how the historical process itself is shaped by the materiality
    of ‘remaining’. In the years after his PhD, Laurent explored these issues both
    through the writings of Walter Benjamin who suggests a different way to write
    about the past to conventional history, and through the work of the French school
    of ar-chaogeography. After a hiatus, Gavin too began to engage with the same issues,
    but through a critical engagement with the work of time perspectivism and exploring
    the temporal structure of the archaeological record.


    Gavin:


    In many ways, after I finished my PhD I put time aside for the next decade or
    so wrote a short textbook on archaeology which came out in 2005, but this drew
    heavily on the background reading I had done for my PhD and apart from a little
    additional material on time perspectivism and palimpsests, there was nothing exceptionally
    novel in it – for me at least.¹ I did not intellectually return to time until
    after this book came out, so 12 or 13 years after my PhD. Instead, I became more
    interested in the nature of archaeological fieldwork and the archaeological process,
    probably after my PhD, a few half-hearted and failed attempts to get an academic
    post, I returned to commercial archaeology. I remember one particularly dismal
    moment when I got a part time job in adult education at London’s Birkbeck College
    outreach department. I slaved away preparing my lectures and turned up for my
    first evening to find one student had enrolled. They had to cancel the course
    and the truth is, I pretty much decided an academic post was not for me and after
    some short-term work for archaeological units in London, I returned to Cambridge
    to work for Chris Evans and the departmental archaeology unit.


