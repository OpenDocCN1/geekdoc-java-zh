  md: '# In the beginning


    Archaeology has always had a problem with time. At its very core, dating is a
    fundamental part of what we do and before the advent of scientific techniques
    like C14, archaeologists relied heavily on methods such as stratigraphy, typology
    and seriation. In this chapter, we talk about our earliest research on time as
    part of our doctoral studies, where both of us dealt with problems later two methods,
    typology and seriation. Although scientific methods of dating dominate today,
    the legacy of typology and seriation is still strong in what they subtly inform
    our perception of time and change in the archaeological record. We expect change
    to be sequential, linear and regular. What we found through experimental work
    on modern, well-dated objects did not obey the temporal assumptions and principles
    which guided the traditional methods of typological progression or seriation.
    That time looked very different from an artefact''s point of view. These empirical
    observations found theoretical support for Laurent, the work of Freud on memory
    was the key, while for Gavin, it was the philosopher Husserl and phenomenological
    studies of time consciousness that were most productive. For both of us though,
    this was the beginning of a journey that drew us deeper and deeper into the complexities
    of time archaeology.


    Both of us have written a lot about time in archaeology and is a topic we share
    a deep interest in. Moreover, despite knowing each other for more than a quarter
    of a century, we have never really had an opportunity to explore this mutual interest.
    Perhaps it is only fitting to begin at the beginning. How and why did you get
    interested in time?


    Do you remember? We met at Cambridge in the 90''s, we were writing our PhD''s.
    I was a bit older than the other guys, as I had already been working as a professional
    archaeologist in France for ten years. I had come to Cambridge because I was attracted
    by the anthropological and sociological perspective brought by Anglo-American
    research on archaeology – something which was completely lacking at that time
    in French research, at least in my field: Iron Age archaeology.


    I went to Cambridge, thinking of writing a piece of research about the mortuary
    practices of Celtic cultures in Eastern France in the last millennium BC. But
    very soon, I realized that the key question that


    DOI: 10.4324/97810031836000-1'
