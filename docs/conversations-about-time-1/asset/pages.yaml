    So what do you get inside this book? Basically a study of the relationship between
    archaeological remains and time, based on a synthesis of the results I obtained
    from my PhD as well as a couple of new ideas. We already talked about Cambridge
    years, but what emerged from this time is this issue we were both gravitating
    around, like two different asteroids: archaeological time and chronological time
    are two different dimensions, one is real and the other abstract. The real is
    not the one we would think of: it is archaeological time, as a product of materiality.


    This is the real time; the other being just a convention, a mode of measurement,
    a scale in other words. So this is the reason why it is fundamentally important
    to focus your attention onto archaeological remains and look at their behavior
    in archaeological time: how their accumulation constructs in fact a material memory
    of the past which is the true subject of archaeology. This point was already present
    in some form in my earlier doctoral dissertation Shapes of Time, written at Cambridge.


    But re-reading this HDR work more than 15 years later, I also see a new concept
    emerging there: the present as being the location of the past. I know that this
    sounds foolish, for us, the immediate perception of time is chronological – for
    is necessarily before the present; it has happened while the present is happening.
    As stressed by Bergson though, this perception is one of the two dimensions of
    time; the other being of duration – that is to say our archaeological time.³ If
    you take seriously enough this observation that real time is the material time
    of archaeological remains, the present – I mean the present, just now, here –
    isn’t anywhere what is happening at the moment: it is remaining at the moment,
    around us, in the ground under our feet, and above us, in the starry sky. It is
    all the durations of the past – from the birth of the universe to your immediate
    material environment: the chair on which you are seated, your clothes, and even
    yourself, as a body. All of that is physically co-present, and this is the very
    reason why we can dig into the past: it is still there, as a material presence.
    It has ceased to be but it hasn’t ceased to exist.'
