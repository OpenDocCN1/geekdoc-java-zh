  md: '# Prologue


    The writing of this book was something of an accident, yet perhaps also inevitable.
    One of us (Gavin) had just finished a draft of a new book about time in archaeology¹
    and had asked the other (Laurent) if he would be willing to read it over and offer
    some useful commentary and critique before publication. He kindly did but rather
    than send an annotated file back, Laurent sent his thoughts in a series of emails
    to which Gavin would occasionally respond. In the course of this exchange, a discussion
    emerged exploring some of the differences of our positions and Laurent was finishing
    Gavin''s manuscript, he suggested that maybe we should develop this exchange into
    an extended conversation: ''So, perhaps we should think about writing a book as
    a dialogue ... to discuss what we know and what we don''t, how we approach things
    ... It could be a book ... showing we think, how we doubt ...''. That was at the
    beginning of September 2020. Three months later, we had written around 40,000
    words of conversation which forms the basis of this book.


    There is no doubt the current situation the world finds itself over the period
    this book was written was conducive to this process. The coronavirus pandemic
    that hit us at the beginning of 2020 changed our lives and is still ongoing as
    we write this at the beginning of 2021; it is hard to predict what long-term impact
    it will have. But in the midst of, many of us have found that collaborative writing
    — which was always an activity that web-based and online platforms were supposed
    to be ideal for promoting — became an opportunity to good to miss. It is ironic
    that it took a situation which locked us into our home countries, ever our homes,
    to bring us finally together. Because as we later relate in our conversation,
    have have known each other since the early 1990s when we were both doctoral students
    at Cambridge. Both of us were working on the topic of time and although we paid
    attention to each other’s work, we have never collaborated until now.'
