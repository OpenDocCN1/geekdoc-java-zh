  md: '# 2 Prologue


    Yet perhaps such collaboration was inevitable. In 2014, Laurent hosted a workshop
    in Metz in France and invited Gavin to participate. Three years later, Gavin invited
    Laurent to Reykjavik in Iceland as a guest lecturer at a PhD seminar. Occasions,
    though rare, enabled us to meet and exchange ideas, get a better sense of what
    the other was doing and thinking. It was clear to both of us that we were circling
    around similar questions but often from different angles and positions. We also
    came from very different intellectual backgrounds; even though both studied at
    Cambridge, by this time much of our intellectual framework had long been established
    and the differences between us had proven frustrating, leading us to misread or
    not fully understand what the other was saying.


    Possibly it was this frustration as much as the recognition of sharing the same
    matters of concern led us to the point of starting this dialogue. Rather than
    writing separate papers and books, we both saw the benefit of engaging in an extended
    and deep conversation that could untangle the knots of frustration and enable
    us to explore questions that bothered both of us. Indeed, as much as it was a
    chance to talk about time, it also an opportunity to resuscitate an old genre
    of scientific writing: epistolary correspondence. Early publications of archaeological
    findings often took the form of a letter is well known, but in many ways, these
    published correspondence goes back to the 17th century and earlier. In an age
    before planes and trains, when long-distance travel was still a major commitment,
    exchanging ideas with colleagues largely took place through letter-writing. Living
    amidst a global pandemic, we find ourselves in a similar situation today in the
    21st century – although the speed, at which such correspondence takes place tempers
    in three months which in the 17th century, may have taken three years, alerts
    us to the fact that time was not only our topic of conversation, it also structures
    the nature of our conversation.


    Dialogues are new to archaeology and e-mails have certainly facilitated their
    production, whether this is acknowledged or not. The dialogic format has also
    been promoted as an intellectual alternative to the traditional scholarly paper.
    But while the inspiration for such format is often attributed to Plato''s Socratic
    dialogues and its medieval imitators, our role model has been the letter-writing
    of the new science of natural philosophy that emerged in 17th century Europe.
    Indeed, the fact that this book was written, not spoken, that it took the form
    of an epistolary correspondence through email, is an important'
  merge: -1
  pgno: 10
- img_proc: true
  md: '# Prologue 3


    quality. Unlike dialogue, letter-writing allows one to pause and reflect, to take
    time to compose an answer; despite the speed of emails over traditional post,
    there is still a shared temporality in composition. and even if email still accelerate
    this process relative to hand-written correspondence, it is important to acknowledge
    that this is still a written conversation, not a transcript of a spoken one. Moreover,
    it was also a deliberate decision to write this conversation through email rather
    than online multi-user word processing formats like Google Docs, as it preserved
    something of the letter-writing spirit.


    For us, this has been a very exciting and stimulating exercise, continuously bringing
    new insights, discovering that we were sometimes much closer in our thinking as
    we thought, but then at other times, far apart. The process has helped us understand
    each other''s approach in a deeper manner and in so doing, understand ourselves
    better. Especially when talking with a colleague from a different cultural and
    intellectual background, one becomes more aware of the peculiarities of one''s
    own position – but the unacknow prejudices one has towards others. Moreover, such
    differences blinded us to the fact that we were ultimately addressing the same
    issues, the concerns and often making the same observations but simply expressing
    them in different terms. The desire to understand what the other is saying is
    important here; even in close engagements as this, there is the danger one strives
    to proselytize, preach, proclaim one''s own position. Stating your position is
    important but so is listening. At the end of the day, the primary motivation for
    this conversation was to listen and learn from each other. After all, our individual
    positions are clearly staked out in other publications.


    It is also for this reason that we regard this conversation as worthy of publication;
    although beneficial for us, we believe and hope the reader will also get some
    stimulation from reading this. For we address issues which concern the whole discipline
    and we do so in a manner that ideally, shows how important debate and discussion
    is to working through such issues. There are more than enough books out there
    which give summaries of concepts and issues, which present an author''s own particular
    take on a subject. Archaeology, any discipline, is a communal social activity
    and especially when it comes to issues of theoretical concern, conversation is
    surely one of the most appropriate genres to adopt. Its archaeological thinking
    as alive, as a process, something one often only observes at conferences or seminars.
    At the end of the day, we hope our readers will get much pleasure from reading
    this as we did in writing it.'
