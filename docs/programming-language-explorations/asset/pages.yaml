  md: '# 266 Programming Language Explorations


    +   - All types in Swift belong to one of six kinds: structures, enumerations,
    classes, protocols, tuples, and functions. Structures and enumerations have value
    semantics (copied if necessary when assigned or as arguments); while classes have
    reference semantics.


    +   - Arrays, sets, dictionaries, and optionals are defined as generic types in
    the standard library, a good deal of syntactic sugar makes them pleasant to use.


    +   - Classes can have inheritance and inherit properties and methods. Enumerations
    can specify a raw type. Classes, structs and enumerations can adopt protocols.


    +   - Extensions allow us to add new properties, methods, initializers, subscripts,
    and nested types without modifying the source code of the existing type.


    +   - It is possible to extend a protocol, but only with implemented methods.


    +   - Swift’s approach to garbage collection is by automatic reference counting.
    The programmer does not have to insert free to memory, but must code in such a
    way that heap-allocated memory eventually becomes unreachable and thus freed.
    Weak and unowned pointers must be employed when objects appear in reference cycles.


    To continue your study of Swift beyond the introductory material of this chapter,
