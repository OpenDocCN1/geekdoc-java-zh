  md: "# Programming Language Explorations\n\n```\nimport ElmTest exposing (runSuite,\
    \ suite, defaultTest, assertEqual)\nimport Shapes exposing (Shape,Circle, Rectangle),\
    \ area, perimeter\n\nmain =\nrunSuite <| \"Test shape functions\"\n  [ defaultTest\
    \ <| (100*pi) `assertEqual` area (Circle 10)\n    defaultTest <| (2*pi) `assertEqual`\
    \ perimeter (Circle 10)\n    defaultTest <| 16 `assertEqual` area (Rectangle 2\
    \ 8)\n    defaultTest <| 20 `assertEqual` perimeter (Rectangle 2 8)\n  ]\n```\n\
    \nElm's List and Maybe types are tagged unions, too. Because a list is empty,\
    \ or an element (the head) connected to its (tail), we have two constructors:\
    \ [] for the empty list and (:) for lists with a head and tail. We'll illustrate\
    \ pattern matching on lists with a simple example:\n\n```\nimport ElmTest exposing\
    \ (suite, defaultTest, runSuite, assertEqual)\n\ndouble : List a -> Double\ndouble\
    \ list =\ncase list of\n  [] -> 0\n  x :: xs -> x :: x :: double xs\n\nmain =\n\
    runSuite <| \"Test the doubler\" `assertEqual` []\n  [ defaultTest <| [5, 5, 5,\
    \ 5] `assertEqual` double [5, 5]\n    defaultTest <| [2, 2, 5, 5, 3, 3] `assertEqual`\
    \ double [2, 5]\n  ]\n```\n\nA maybe wraps a value or it doesn't. Maybe is Elm's\
    \ option type. We first presented option types in the Java chapter as alternative\
    \ to the \"Billion Dollar Mist,\" a.k.a. null references. Elm has no null references,\
    \ so you'll see maybe often. Set and dictionary retrieving the head, tail, minimum\
    \ and maximum of a list employ may. Maybe defines the type as a tagged union:\n\
    \n```\ntype Maybe a = Just a | Nothing\n```\n\nWhile you may need to unwrap, which\
    \ unwraps a value while yielding if it is not wrapped. use one of the convenience\
    \ methods from the Maybe object, such as:\n\n+   * withDefault we used in the\
    \ chapter to use a dictionary to count words: insert word (withDefault 0 (get\
    \ counts)) + 1 counts\n* map, which safely operates on the wrapped value; e.g.,\
    \ map abs (Just -8) == (Just 8) while map Nothing == Nothing\n* andThen, which\
    \ safely performs a maybe-producing-callback on the wrapped value only if present,\
    \ e.g., ([1,2,3,4] | tail) andThen tail == Just [3,4]. andThen when you need to\
    \ chain callbacks by a Nothing can be produced at any point on the chain."
