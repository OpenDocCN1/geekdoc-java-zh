    Here a is written in Julia [10,20,30,40] and a one-dimensional array, or vector,
    of type Array(Int64,1). Array b is written [5 3 7] (note spaces instead of commas),
    and is a 1 ×3 (one row, three columns) two-dimensional array, or matrix, of type
    Array(Int64,2). Array a is a 2 x3 array with type Array(Int64,2), and is written
    [1 0 9; 0 1 6]. Higher dimensional arrays have no special syntax, though they
    can be constructed with comprehensions, e.g.,[i+j+k for i:4, j:3, k:5].


