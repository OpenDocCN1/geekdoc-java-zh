  md: "Classes, unlike structures, can inherit from each other creating superclass-subclass\
    \ relationships. Both properties and methods can be overridden. Our common animal\
    \ example illustrates how this looks in Swift:\n\n```\nclass Animal {\n    let\
    \ name: String\n\n    init(name: String) {\n        self.name = name\n    }\n\n\
    \    func sound() -> String {\n        preconditionFailure(\"This method must\
    \ be overridden\")\n    }\n\n    func speak() -> String {\n        return \"\\\
    (self.name) says \\(self.sound())\"\n    }\n}\n\nclass Cow: Animal {\n    override\
    \ init(name: String) {\n        super.init(name: name)\n    }\n\n    override\
    \ func sound() -> String {\n        return \"moooo\"\n    }\n}\n\nclass Horse:\
    \ Animal {\n    override init(name: String) {\n        super.init(name: name)\n\
    \    }\n\n    override func sound() -> String {\n        return \"neigh\"\n  \
    \  }\n}\n\nclass Sheep: Animal {\n    override init(name: String) {\n        super.init(name:\
