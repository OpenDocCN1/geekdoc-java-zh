  md: '# 150 Programming Language Explorations


    Because symbols need contain only alphanumeric characters, addition, subtraction,
    multiplication and friends are not special operators, but rather regular functions.
    Thanks to Clojure''s syntax, each accept a variable number of arguments:


    ```

    (use ''clojure.test)

    (is (= 8 3 2 8)) ; sum a lot of numbers

    (is (= (+ 8))) ; yes we can sum just one

    (is (= (+ 0))) ; 0 is the identity for +

    (is (= 3 5 7 12)) ; a convenient sort test

    (is not (< 8 9 10 22 80))

    (is (= max 8 7 14 2 8)))

    ```


    The division operator produces longs, doubles, or ratios intelligently:


    ```

    (use ''clojure.test)

    (is (= (type / 3 9)) clojure.lang.Ratio))

    (is (= (type / 8)) Long)

    (is (= (type / 3.0 9)) Double))

    ```


    The functions +, -, *, inc, and dec on longs may overflow, throwing an ArithmeticException;
    use ''+ ''*'', inc, and dec to auto-promote to BigInt


    ```

    (use ''clojure.test)

    (let x [(long IE16) max-long Long/MAX_VALUE]

    (is thrown ArithmeticException (* x x))

    (is (= (* x x) (bigint IE30)))

    (is thrown ArithmeticException (inc max-long))

    (is (= inc max-long) (+ 1 max-long)))

    ```


    Collections are immutable and implement equality with value--reference-semantics.
    Many common operations apply to all collections, as count, empty?, not-empty,
    and conj, short for conj. Joining a collection and an element returns a new collection
    with all the elements together with e.


    ```

    (use ''clojure.test)

    (let a-list [1 2 3] a-set #{1 2 3} a-map {1 2 3 4}

    (is (= (empty a-set) false))

    (is (not-empty a-set))

    (is (= (map [a-list a-set]) [3 3 3]))

    (is (= (count a-map) 4))

    (is (= conj a-list) ''(4 1 2 3)) ; list: conj to front

    (is (= conj a-vec) [1 2 3 4]) ; vec: conj adds to end

    (is (= conj a-set) #{3 2 1 4}) ; order is irrelevant

    (is (= conj a-map) [1 2 5 6 3 4])) ; adds a new pair

    ```


    These functions, and dozens like more, operate by internally turning the collection
    into a sequence, a logical list of elements, usually (but not always) lazy. Recall
    that a lazy sequence produces its elements on demand, a non-lazy sequence stores
    each element in memory). You can produce a sequence directly from a collection
    c by evaluating (seq c). Let''s look at a few more functions:'
