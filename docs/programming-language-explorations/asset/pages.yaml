  md: "# Elm 173\n\nBut wait! None of the examples in the opening section of this\
    \ chapter used appeared to take \"multiple arguments.\" They looked quite different,\
    \ like the example on the right below:\n\n```\nplus: (Int, Int) -> Int\nplus (x,\
    \ y) =\n  x + y\n```\n\n```\nplus: Int -> Int -> Int\nplus x y =\n  x + y\n```\n\
    \nThe example on the left returns the sum of its two tuple, but what of the example\
    \ on the right? What is the type Int -> Int -> Int? The function type operator\
    \ is right-associative, so actually have Int -> (Int -> Int). The function accepts\
    \ an integer and returns a function from integers to integers. And although it\
    \ appears to take two parameters, the definition on the right simply the \"one\
    \ parameter\" definition that returns a function:\n\n+   - Desugared definition\n\
    plus: Int -> Int -> Int\nplus x y =\n  x + y\n\nThe act of rewriting a function\
    \ of type (a,b)->c into an equivalent of type a->(b->c) is called currying; the\
    \ reverse process is called unrying. Curried functions allow something called\
    \ partial application. For example, although we normally write\n\nplus 3 4\n\n\
    we can just easily write\n\nplus 3\n\nto obtain the function that adds three to\
    \ its argument. We are free to apply this function at later time to obtain essentially\
    \ one of two integers.\n\nElm provides two forms of sugar for curried functions.\
    \ A function of type (b->c) can be written between its two \"arguments\" enclosed\
    \ in brackets. We saw this in our previous example with the function assertEqual:\
    \ The expression x 'assertEqual' y asserts isEqual x y.\n\nSimilarly a function\
    \ defined to appear in the infix position can be used as prefix by enclosing in\
    \ parentheses, for example (+) 5 8 evaluates to 13. This feature was not made\
    \ to make Clojure programmers happy; rather it gives us a way to use the function\
    \ in our own right. The study shows examples in the\n\n```\nElmTest exposing (runState,\
    \ suite, test, assertEqual)\n\nmain =\n  let (input, expected) = ([10, 20, 30],\
    \ [15, 25, 35]) in\n    runState <| \"Use + in prefix position\"\n    [ test \"\
    Arrow\" (List.map (\\->x+5) input assertEqual)\n    , test \"Prefix\" (List.map\
    \ (+5) input assertEqual)\n    ]\n```\n\nTo define an infix function, supply a\
    \ function definition with in parentheses (as if it a prefix function). But note\
    \ that using functions as infix introduces questions of precedence and associativity.\
    \ In Elm, precedence are integers from 0 (lowest) to 9 (highest), and associativities\
    \ are left, right, or none The common functions from the packages\n\nBasics and\
    \ List (from the Elm core library) follow."
