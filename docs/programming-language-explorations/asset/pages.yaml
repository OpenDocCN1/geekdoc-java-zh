    duck typing, namely allowing types to implement interfaces without mentioning
    the interface name in the type declaration, but simply by virtue of the interface''s
    method, means that every type in Go implements (the empty interface). There is
    no need to implement a complex supertype, a type (or class) from which all other
    types derive, as Java''s Object or Ruby''s Basic.interface is the perfect type
    for a parameter that truly accepts any value at all. You can find many of these
    types in the source code of the Go Standard Packages. We''ve seen at least one:


    ```

    func Println(a ...interface{}) (int, error)

    ```


    And now we easily add Go to the list of languages that can pack a variable number
    of arguments into a single parameter.


    # 11.6 PANICS


    We''ve seen that idiomatic Go makes use of multiple return values for handling
    errors that might occur—opening or reading from files, formatting data, or decoding
    streams. After all, it''s perfectly reasonable that someone might make for a non-existent
    file to be read, or supply a malformed byte stream to be decoded. These are not
    "exceptional conditions," so handling them by throwing and catching exceptions
    is arguably a misuse of the exception facility. This kind of programming is encouraged
    by JavaScript, Java, and similar languages, that even allow try-catch blocks in
    the middle of a function body.


    Go doesn''t have exceptions, but it does have a way to handle the truly exceptional
    cases—the ones that really shouldn''t happen or the ones you don''t expect to
    recover from. When something truly exceptional, the program—technically, the currently
    executing routine panics. A panic stops the current function, runs any deferred
    operations, then returns. In the caller, the process is repeated until some deferred
    operation is able to recover, or the entire chain of calls has been "unwound"
    and the panic crashes (with a non-zero return code).


    To see the mechanism in action, we''ve built a little contrived demo in the function
    Example calls f calls g, which panics, will run its deferred operation but will
    not recover from the panic, so f panics runs its deferred operation recovers,
    and returns normally to Example.


    > ¹"duck typing" gained popularity in programming languages due to the off-head
    phrase "if it looks like a duck, walks like a duck and acts like a duck, then
    it''s a duck." Rather than declaring that something is a (in the Java-esque class
    D implements Duck), a duck-typed language ensures the objects in question can
    do the things they can do, they implement the corresponding methods. The term
    "duck typing" is not precisely defined, however, you sometimes hear the argument
    that duck typing applies only to dynamically typed languages. Following this line,
    we would describe Go as having "structural typing" or "implicitly implemented
    interfaces." The intent, though, is the same as: the interface name does not appear.'
