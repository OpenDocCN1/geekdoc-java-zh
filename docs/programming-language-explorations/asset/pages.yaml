    # Haskell


    Haskell arose from an effort to build an open standard bringing various ideas
    and contributions from some twenty or closely-related functional languages that
    grew up in the 1980s. It has since become the most popular functional language
    in use today, with many fans both in academia and industry.


    +   * First introduced 1990

    Notable versions 1.0 (1990) • 98 (1998) • 2010

    Recognized for Pure functions, non-strict semantics, type classes, monads

    Notable uses Academia, Software validation and verification, Modeling, Compilers

    Non-strict, Lazy, Functional


    Haskell sports its ML-style features such as higher-order functions, static Hindley-Milner
    tuple types, pattern matching, and modules. But Haskell is different in at least
    three ways from its relatives, and, indeed, from every language we encountered
    so far: Haskell has a non-strict semantics, categorizes types via type classes,
    and meets each of the requirements to be known as a pure functional language.
    We’ll discuss these language attributes in the remainder of this section.


    A non-strict semantics means that expressions can produce a valid value even when
    subexpressions have no value. For example, if we define the function zero:


    ```

    zero x = 0

    ```


    then the Haskell expression zero 1 (“mod” 0) has the value 0, while evaluating
    the expression zero (1 % 0) in Elm, which strict, produces a division by zero


    > ⁴An expression without value is one whose evaluation would enter an infinite
    loop or fail. In formal semantics, the meaning assigned to a “valueless” expression
    is ⊥, pronounced “bottom.” A semantics is strict if the meaning of f(l) is ⊥ for
    all operators, and constructors f.'
