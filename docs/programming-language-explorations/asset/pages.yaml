    \ our object, reducing the reference count to 1:\n\n![](img/2cd8452ff5a372a7459559ad1d0834e4_280_2.png)\n\
    \nWhen main returns, the object count goes to zero and the object is deinitialized.\n\
    \nIn return for avoiding the significant complexity and potential unpredictability\
