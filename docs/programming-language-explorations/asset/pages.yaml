    \ customers may create orders only via the static method take, which may time\
    \ out. Cooks grab an order from the queue in a blocking fashion, and when finished\
    \ cooking, take credit for the work by updating the order and delivering it to\
    \ the customer. We've chosen the size of this queue to be small, relative to the\
    \ number of customers, so in running the simulation, you'll likely to see customers\
    \ getting frustrated (threads will time out) and leaving the restaurant temporarily.\n\
    \n```\nimport java.util.concurrent.BlockingQueue;\nimport java.util.concurrent.ArrayBlockingQueue;\n\
    import java.util.concurrent.TimeUnit;\n\npublic class Order {\n  private static\
    \ BlockingQueue<Order> orders = \n    new ArrayBlockingQueue<>(5);\n\n  private\
    \ String content;\n  private Customer customer;\n  private Cook cook;\n\n  private\
    \ Order(Customer customer, String content) {\n    this.customer = customer;\n\
    \    this.content = content;\n  }\n```"
