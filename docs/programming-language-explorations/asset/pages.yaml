  md: '# CHAPTER 2


    # CoffeeScript


    CoffeeScript attempts to “expose the good parts of JavaScript in a simple way.”
    [10]


    | First appeared 2009 |

    | Creator Jeremy Ashkenas |

    | Notable versions 1.0 (2010) • 1.10 (2015) |

    | Recognized for Transpiling to JavaScript, Expressiveness |

    | Notable uses Web application clients |

    | Tags Functional, Expression-Oriented, Dynamic |

    | Six words or lessIt’s Just JavaScript” |


    CoffeeScript appeared in late 2009 with the goal of making application clients
    easier to write. CoffeeScript code is universally translated into JavaScript for
    execution. In fact the **golden rule of CoffeeScript** is “It’s JavaScript.


    CoffeeScript exposes JavaScript’s Good Parts only, and introduces a handful of
    features that were not present in JavaScript when CoffeeScript was first written,
    among them structuring assignment, default parameter values, splats, and the `class`
    syntax for constructors and assigning prototype properties. It also features a
    few concepts not (yet!) in JavaScript, including the existential operators, the
    `do` construct, and comprehensions. In an **expression-oriented language** where
    JavaScript has `while, for,` and `if` statements, these constructs are *expressions*
    in CoffeeScript.


    CoffeeScript, by design, removes a lot of the noise in JavaScript. It does away
    with curly braces for parentheses in function calls (though you can use them if
    you like), and allows object literals to forgo braces and use indented lines for
    each property. Many of the messy parts of JavaScript have no translation at all.
    It wisely throws out CoffeeScript’s `==` completely: writing `==`, or its synonym
    is, **transpiles** (translates at the source level) to JavaScript’s `===`.


    In this chapter, we will treat CoffeeScript as a language in its own right, but
    because of its golden rule, we’ll make extensive comparisons with the language
    of the previous chapter.'
