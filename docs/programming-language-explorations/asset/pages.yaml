    # 2.5 DESTRUCTURING


    How do names take on values in a program? For many novice programmers, the answer
    “Assignment statement!” is the first thing to pop into their heads. With a little
    thought, passing arguments to function calls may come up. But assignment parameter
    is binding. Once you begin to think in generalized terms, you may combine these
    two questions and realize that “Why assignment go to right (x=3) instead of left-to-right
    (3=x)?” Or “Why can’t assign multiple values at once?” binding might be carried
    out via a generalized pattern match. Consider the following expression, from a
    hypothetical language:


    ```

    {x:1, y: z, "hello"} => {y: 2, q: q], x: p}

    ```


    The idea is to map a value (on one side) with the corresponding value on the other.
    Our example would be 1 to p (at the values of the x on both sides), 2 to z (first
    element of the y-arrays), and “hello” to q. CoffeeScript doesn’t go so far as
    binding variables on both sides, but it does allow expressive patterns on the
    left. The right-hand side is evaluated first (as is the case in classic assignment),
    the variables on the left become bound. Some examples:


    ```

    [x,y] = [10,20]

    # x gets 10 and y gets 20

    [x,y] = [y,x]

    # yes, a swap!

    {a, b} = {a: 5, b: 3}

    # a nice idiom

    ```


    ```

    {place: {name: location, loc: [lat, lon]] = {

    place: {name: ''Everest'', loc: [27.9881,86.9253]}}

    ```


    ```

    assert = require ''assert''

    assert.deepStrictEqual [x, y, a, b, mountain, lat, lon],

    [20, 10, 5, 3, ''Everest'', 27.9881, 86.9253]

    ```'
