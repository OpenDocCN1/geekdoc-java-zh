  md: "# 54  Programming Language Explorations\n\n```\nnextSquare = coroutine.create(function\
    \ ()\nfor value = 1, 5 do\n  coroutine.yield(value * value)\nend\nreturn \"Thank\
    \ you\"\\end)\n\nfor i = 1, 8 do\n  local status = coroutine.status(nextSquare)\n\
    \  local success, values = coroutine.resume(nextSquare)\n  print(status, success,\
    \ values)\nend\n```\n\nNote that coroutine.resume returns a success flag (whether\
    \ the coroutine yielded or returned without error) followed by the values that\
    \ were yielded or returned. The script produces:\n\n+   - suspended true 1\nsuspended\
    \ true 4\nsuspended true 9\nsuspended true 16\nsuspended true 25\nsuspended true\
    \ Thank you resume dead coroutine\ndead false cannot resume dead coroutine\ndead\
    \ false cannot resume dead\n\nA coroutine's status is one of\n\n+   - suspended:\
    \ if it has not yet started running or is waiting to be resumed,\n- running: if\
    \ it's running (the caller is waiting for status)\n- normal: if it has resumed\
    \ another coroutine and is waiting to be resumed itself, and\n- dead: if it has\
    \ terminated via a return or unprotected error.\n\nCoroutines allow us to structure\
    \ an application to include concurrent activities, written independently of each\
    \ other. A game might contain coroutines for players, volcanoes, tornadoes, waterfalls,\
    \ and an event manager for user input. Only one coroutine runs at a time (this\
    \ concurrency is without parallelism), so each must contain explicit yield and\
    \ resume calls, and not execute too long between these calls. This architecture\
    \ is known as cooperative multitasking, where the operating system can prevent\
    \ a thread at anytime and give control to another thread.\n\n# 3.7 LUA WRAP UP\n\
    \nIn this chapter we introduced Lua, a high-performance, embeddable, lightweight\
    \ scripting language. We learned that:\n\n+   - Lua is a relatively small language,\
    \ with only a few statements, operators, types, and only one data structure.\n\
    - The only false values are false and nil.\n- In Lua, unlike many other languages,\
    \ assignment is a statement and not an expression."
