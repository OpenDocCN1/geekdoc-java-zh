    \ p)\n\tfmt.Println(z)\n\t// Output: [0 0 0 0 0]\n}\n```\n\nCopying the entire\
    \ array or struct can carry a significant performance overhead, compared to the\
    \ assignment and passing of references. While you can pass references in Go, just\
    \ as you can create copies in other languages. Our previous languages copied and\
    \ passed references implicitly and required explicit function invocation to make\
    \ copies, Go implicitly makes copies but gives you a way to explicitly make references.\
    \ Go's explicit references are called pointers.\n\nPointer values have types.\
    \ The type of pointers that reference objects of type t is denoted *. To make\
    \ a pointer to an object x, write &x; to dereference a pointer p, write *p. Figure\
    \ 11.1 should help to clarify.\n\n![](img/2cd8452ff5a372a7459559ad1d0834e4_238_0.png)\n\
    \nFigure 11.1 Pointers in Go\n\nPassing pointers as arguments gives us efficiency,\
    \ but for better or worse allows mutations through parameters to affect the corresponding\
    \ arguments:\n\n```\npackage main\n\nimport \"fmt\"\n```"
