    Julia takes care that writable variables in a macro''s result expression not modify
    variables of the same name in the context of caller. In typical terms, Julia macros
    are hygienic. In the following example, the macro''s local y does not overwrite
    the caller''s y:


    ```

    macro tenTimesX()

    :(y = 10; x * y)

    end

    ```


    ```

    function ()

    x = 2; # Will this y be changed?

    y = 3;

    z@tenTimesX() # Changed to 10 perhaps?

    @assert y == 3 && z == 20 # No, y will not change

    end()

    ```


    We can use the function macroexpand in the REPL to see why no change occurs:


    ```

    julia> macro tenTimesX()

    :(y = 10; x * y)


