    \ a simple name (letters, digits and underscores, not beginning with a digit).\
    \ Unspecified keys are auto-generated the integers 1, 2, 3, and so on.\n\nKeys\
    \ are not restricted to strings and numbers, but they cannot be nil. Values can't\
    \ be nil, either nil turns out to be the response to a request for a nonexistent\
    \ value. This treatment of nil is consistent with Lua's evaluation of an undeclared\
    \ variable as nil. A table of nil would be indistinguishable from the key present\
    \ in the table. Therefore, to remove an element from a table, set the value at\
    \ the desired key to nil.\n\n```\ncolors = {'red', 'blue', 'green'}\ndog = {name\
    \ = 'Lischika', breed = 'G-SHEP', age = 13}\n\n-- Length operator counts number\
    \ of integer keys\nasert(#colors) == 3\nasert(colors[1]) == 'red'\n\n-- Need our\
    \ own function to count all pairs!\nfunction number_of_pairs(t)\n  local count\
    \ = 0\n  for _, _ in pairs(t) do count = count + 1\n  return count\nend\n\n--\
    \ Assignment of nil removes a key pair\nasert(number_of_pairs(dog) == 3)\ndog.age\
    \ = nil\nasert(number_of_pairs(dog) == 2)\n```\n\nGlobal variables are actually\
    \ kept in a table called the global environment. This table contains\n\n+   *\
