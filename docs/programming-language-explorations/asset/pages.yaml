  md: "While tagged union (e.g., PrimaryColor in the example script), do introduce\n\
    new, distinct, named types, we can only name record types via aliasing. In the\
    \ lingo of\nprogramming languages, record types live in a structural typing rather\
    \ than\nnative typing. Only the record-structure—the names and types of its fields—is\n\
    used to determine its type. We can, however, use tagged unions with a single variant\
    \ to\nmake the distinction.9\n\n```\ntype Person\n  Person = { name: String, id\
    \ : Int }\ntype Widget\n  Widget = { name: String, id : Int }\n\np : Person\n\
    \  p = Person { name = \"Alice\", id = 239 }\n  -- w: Widget, w = would be a syntax\
    \ error now.\n```\n\nWe can use alias to describe a record type that need only\
    \ certain fields:\n\n```\nimport ElmTest exposing (runSuite, suite, defaultTest,\
    \ assertEqual)\n\ntype alias Positioned = { x : Float, y : Float, z : Float }\n\
    \nmove : Positioned a -> Float -> Float -> Positioned a\nmove object dx dz =\n\
    \  { x = object.x + dx, y = object.y + dy, z = object.z + dz }\n\nmain =\n  let\n\
    \    robotStart = { name = \"Mari\", x = 3, y = -2 }\n    robotEnd = move robotStart\
    \ 7 -2 9\n    expectedEnd = { name = \"Mari\", x = 10, y = 6, z = 7 }\n  in\n\
    \    runSuite |\n      defaultTest(expectedEnd `assertEqual robotEnd)\n```\n\n\
    We just moved a robot. But we can, move anything that has x, y, and fields,\n\
    without the need to include some kind of position field within the object, or\
    \ derive our\nobject from a position object or class.\n\n# 9.6 EFFECTS\n\nOne\
    \ of the more useful dimensions on which to characterize and compare programming\n\
    languages is the extent to which the language's design, and its culture, encourage,\
    \ dis-\\ourage, contain, or to eliminate side-effects. Roughly, a side effect\
    \ occurs when a\nfunction changes a program's state in any way other than producing\
    \ an return value.\nSide-effects, and side-causes—entities manipulated by a function\
    \ other than its explicit pa-\n\n> 9This technique also applies when you need\
    \ to avoid recursive records, which you'll have an opportunity to explore the\
    \ end-of-chapter exercises."
