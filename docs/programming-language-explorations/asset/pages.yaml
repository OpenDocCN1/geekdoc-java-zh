    #  5.2 THE BASICS


    Ruby has variables, assignments, the usual control structures, and even exceptions.
    As in Python, there are no primitives, only objects; you can find the unique identifier
    of any object with x.object_id. Every object has a unique class, which can be
    found with x.class.


    ```

    fail nil class == NilClass

    fail false.class == FalseClass

    fail true.class == TrueClass

    fail 3.class == Fixum

    fail (2**1000) == Bignum

    fail 2.0.class == Float

    fail :dog.class == Symbol

    fail "dog".class == String

    fail (1..5).class == Range

    fail [1,2,3,4,5].class == Array

    fail {x: 1, y: 2}.class == Hash

    fail {''x'' => 1, ''y'' => 2}.class == Hash

    ```


    Ruby features a large number of built-in classes. A class can have at most one
    superclass. Superclasses allow us to express IS- relationships: each of the expressions
    5.is_a Fixum, 5.is_a Integer, 5.is_a Numeric, 5.is_a Object, and 5.is_a BasicObject
    evaluate to true. Figure 5.1 shows part of this hierarchy.


    BasicObject

    Object


    ![](img/2cd8452ff5a372a7459559ad1d0834e4_98_0.png)


    Figure 5.1 Part of the class hierarchy in Ruby


    Like Python, Ruby classifies floating point numbers differently than integers,
    unlike Python, it classifies smaller integers differently than being. In practice,
    the difference is not too noticeable: raising the 2 to the power 100 happily results
    in the bignum 1267650600028229401496730253576. But not all types are so easily
    coerced. You can, for example, add strings and numbers. But everything can be
    coerced to a boolean. Like Lua, the only expressions that are false and nil.'
