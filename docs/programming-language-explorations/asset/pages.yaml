    \ cooked queue between the cook and the customer employs a synchronous queue.\
    \ A synchronous queue has no capacity: \"head\" is the object the cook is inserting,\
    \ items are \"removed\" only when an attempt is in. The methods put and take both\
    \ indefinitely, a less-than-ideal situation one party to disappear while the other\
    \ was waiting.\n\nFinally we come to the order class. We maintain a single queue\
