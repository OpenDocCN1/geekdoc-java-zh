  md: '# 8 Programming Language Explorations


    But we may end up choosing a language for other, “softer,” reasons:


    +   - It might be the only language suitable for a specific problem.


    +   - You just like it. We all have our preferences. As they say, “there’s no
    accounting for taste."


    +   - You need to hire people that already know it. Face it, some languages are
    very popular: some are not.


    +   - There is a wealth of development tools (IDEs, fact compilers), or resources
    (books, blog posts, activity on programming Q&A sites) for it.


    +   - A big government, or a big company, created or mocked by either that (IBM
    created PL/I, Sun—Java, Google—Go, Facebook—Mozilla—Rust, and Apple—Swift).


    +   - Everyone is using it. There’s an old saying that: “No manager ever got tired
    for choosing Java."


    +   - Your company invested too much in it, and it’s too expensive to change.


    +   - You’re sticking with it because you’re too tired, or you don’t have enough
    time, to learn nothing.


    When you finally go out on a limb and proclaim your love of language A, or that
    your team should use language B for task C, you should be ready with an informed
    rationale, perhaps informed from the criteria above. If your decision is less
    than popular, you may be challenged with questions as to *why* your preferred
    language *X* does not have feature *Y*. The answer may be “because it has feature
    Z instead.” For instance:


    +   - The expressive power of dynamic typing, persistent data structures, functions
    as first-class values, higher-order functions, and closures (all topics we’ll
    introduce in the book) saves development time and makes it easier to reason about
    program behavior, but may negatively impact runtime performance.


    +   - Automatic garbage collection, where unreachable memory is automatically
    freed without direct programmer intervention, but should not be used in embedded,
    life-critical, real-time systems. A collector might decide to free up space while
    your code is performing a time-sensitive maneuver in a fighter plane or delivering
    radiation to a patient.


    These tradeoffs, and others like them, tell us why there cannot be a best language
    for all situations. But this makes life better, because we get so many choices.
    The next twelve chapters will take you through twelve modern languages and the
    choices made by their designers. We’ll design tradeoffs and time and again. Have
    fun.'
