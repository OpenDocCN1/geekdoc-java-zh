  md: "# Clojure ■ 155\n\ncreates 10 threads, each of which prints a list of asterisks,\
    \ in a completely unsynchronized,\nfree-all fashion:\n\n```\n(dotimes [i 10]\n\
    (.start Thread. (fn [] (repeat i \"*\"))))\n```\n\nThis script's output may vary\
    \ each time you run it; one output was:\n\n```\n(** ** *** ** ** (**)**)\n(*)\n\
    \  ** ** )\n))\n*** ** *** ** ** )\n\n*** ** ** **)\n** )\n```\n\nWe can apply\
    \ a simple fix, using the locking macro to print only while the current thread\n\
    holds the intrinsic lock for the standard output object:\n\n```\n(dotimes [i 10]\n\
    (.start Thread. (fn []\n(locking *out* (println (repeat i \"*\"))))))\n```\n\n\
    This produces, on one run:\n\n```\n()\n(** *******)\n( *******)\n(*******)\n*****)\n\
    ****)\n(***)\n***)\n(**)\n(*)\n```\n\nClojure offers much sophisticated concurrency\
    \ support that makes explicit use of threads and\nlocks very rare. In this section\
    \ we'll explore software transactional memory, STM,\nand co agents in the next\
    \ section. Transactional memory is implemented in Clojure with\nrefs, mutable\
    \ storage locations that can only be updated inside a transaction, specified\n\
    in Clojure with dosync. Transactions prevent concurrent updates of references\
    \ from other\nthreads.\n\nSTM solves one of the classic problems in concurrency—transferring\
    \ money between\naccounts—quite nicely. First, let's note that saying, 100 units\
    \ of currency from a\nsavings account to a checking account generally requires\
    \ at 6 steps:\n\n+   1. Read the balance of the savings account (suppose it is\
    \ 10000), to a machine register\n2. Decrement the register by 100\n3. Write the\
    \ decremented value (99900) back to memory\n4. Read the balance of the checking\
    \ account (suppose it is 500), into a machine register\n5. Increment the register\
    \ by 100\n6. Write the incremented value (600) back to memory"
