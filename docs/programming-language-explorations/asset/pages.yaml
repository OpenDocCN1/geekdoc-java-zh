  md: "# Programming Language Explorations\n\n# 12.3 OPTIONALS\n\nWe've seen optional\
    \ in previous chapters, let's cut right to some examples. To unwrap an optional,\
    \ use an if, while, or guard statement with let-bindings in the condition, or\
    \ one of several operators. For a illustration of if-let, let's convert strings\
    \ to integers.\n\n```\nfor s in [\"42\", \"dog\", \"3xy\", \"-2E3\", \"-1\"] {\n\
    \  if let i = Int(s) {\n    print(\"\\s\\ parsed as an integer is \\i\")\n  }\
    \ else {\n    print(\"\\s\\ can't be parsed to an integer\")\n  }\n}\n```\n\n\
    The expression Int() produces an optional Int. If the optional wraps an actual\
    \ integer, we bind to the variable i of type Int and take the true branch. If\
    \ nil, the false branch executes.\n\nWe encountered the while-let and guard-else\
    \ forms in the word count example in the opening section of this chapter; each\
    \ binds the unwrapped value, if present, to a new variable, or takes an alternative\
    \ path through the code on nil. The else-branch of guard statements must transfer\
    \ control out of the guard-statement's scope, via break, continue, return, throw,\
    \ or calling a noreturn function. Guard statements are interesting for at least\
    \ two reasons:\n\n+   - The early exit (\"if something is wrong, abandon everything\"\
    ) avoids excessive indentation of the rest of the function within false-branch\
    \ of an if-let. The code stays focused on the \"happy-path.\" [88]\n- Unlike let-bindings\
    \ in if and while conditions, guard condition bound variables are scoped until\
    \ the end of the scope containing the guard statement.\n\nIn cases where you need\
    \ the unwrapped value of an optional but have a default value in mind, use the\
    \ (short-circuit) nil-coalescing operator:\n\n```\nlet x: Int? = 5\nlet y: Int?\
    \ = nil\nnasert(x ?? 3 == 5)\nasert(y ?? 3 == 3)\nasert(x ?? [1,2,3] == [100])\
    \ // short circuit\n```\n\nWe can also unwrap optional values during indexing,\
    \ and optional functions in calls:\n\n```\nvar a: [Int]? = [10, 20, 30]\nvar b:\
    \ [Int]? = nil\nvar f: ((Int)->Int)? = {$0 * 3}\nasert(a[2] == 30)\nasert(b[2]\
    \ == nil)\nasert(f?(100) == 300)\n```\n\nand optional instances in a similar fashion:"
