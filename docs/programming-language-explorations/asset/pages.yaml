    \ our coverage with Ruby’s metaprogramming facilities.\n\n# 5.1 HELLO RUBY\n\n\
    We begin with our familiar script to list small triangle measurements:\n\n```\n\
    upto(40) do |c|\n  upto(c - 1) do |b|\n    upto(b - 1) do |a|\n      puts \"#{a},\
    \ #{b}, #{c}\" if a * a + b * b == c * c\n    end\n  end\n```\n\nRuby sports some\
    \ features we first saw in CoffeeScript—string interpolation with {} and a trailing\
    \ if-clause—but this script is definitely not using a traditional for-statement.\
    \ Instead, we start the script by sending the message upto to the object 1. The\
    \ message sent with argument 40 and a block executes its block for each value\
    \ in the range from its receiver up to, and including, its argument.\n\nNext,\
    \ let’s translate our running anagrams example—the one using Heap’s Algorithm—into\
    \ Ruby:\n\n```\ndef generatePermutations(a, n)\n  if n == 0\n    puts a.join\n\
    \  else\n    upto(n-1) do |i|\n      generatePermutations(a, n-1)\n      j = n.even?\
    \ ? 0 : i\n      a[j], a[n] = a[n], a[j]\n    end\n    generatePermutations(a,\
    \ n-1)\nend\n```"
