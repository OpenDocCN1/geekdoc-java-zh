    # 1.2 THE BASICS


    A JavaScript program is made up of scripts and modules, each containing a sequence
    of functions and declarations. Statements include variable declarations, assignments,
    function calls, conditionals and loops, among others. Values have one of exactly
    7 types:


    +   - The type containing the value undefined.

    - The type containing the value null.

    - Boolean, containing the two values true and false.

    - Number, the type of all numbers, –98.88, 22.7 ×10¹⁰, Infinity,-Infinity, and
    strangely enough, NaN, representing “not a number.

    - String, the type of character, but technically the sequence of UTF-16 code points.
