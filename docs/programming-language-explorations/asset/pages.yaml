    led to some array (e.g., [10, 20, 30]) and object (e.g., {x:3, y}) literals. Yet
    the attempt to keep the language simple led to several features as well. **Weak
    typing**, where errors of the wrong type are automatically coerced to “something
    that works,” and **automatic semicolon insertion**, where the language will figure
    out where statements begin and when you are not explicit, typing but sometimes
    produce utterly surprising behavior. Douglas Crockford [20] has argued these as
