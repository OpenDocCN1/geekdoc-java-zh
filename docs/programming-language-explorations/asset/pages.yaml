  md: 'Note Cloj''s agent-based programming exhibits strong philosophical differences
    from ''object-oriented'' programming. In OOP, we focus on objects with internal
    state and behavior deined for that object in particular or objects of a certain
    type. Agents, on the other hand, have state but no behavior! Restrictions are
    placed on the functions you can send to the agent. Indeed, the actions are the
    center of attention.


    Emphasizing functions over objects does not mean we can''t model iconic object-oriented
    tasks. In the next section we take a look at what Clojure offers.


    # 8.8 THE EXPRESSION PROBLEM


    In previous chapters we''ve seen various implementations of cows, horses, and
    sheep, making their own type-specific sound. Generally the animals were defined
    with classes, with a common superclass Animal specifying that each animal should
    have a name and speak by returning a message saying the animal (noted by its name)
    makes its sound. In the following script we create these animal classes in Clojure,
    and rather than inheriting from a superclass, we define a protocol for sound-making
    that each class will implement. Unlike Java, however, but using Python, each "method"
    requires an explicit parameter for the receiver. Protocols specify behavior and
    no state, methods that would ordinarily belong to a superclass, in Clojure, just
    functions:


    ```

    (protocol Sounder

    (sound [sound-maker]))

    ```


    ```

    (derecord Horse [name] Sounder

    (sound [this] "neigh")

    (derecord Cow [name] Sounder

    (sound [this] "mooo")

    (derecord Sheep [name] Sounder

    (sound [this] "baaaa")

    ```


    ```

    (def speak [animal]

    (str .name animal) "says" (sound animal)))

    ```


    The derecord macro accepts a class name, fields, protocols that it should implement,
    and the bodies of any methods it needs. Assuming a Clojure installation running
    on a JVM, Clojure records are real classes (instances of java.lang.Class), obeying
    the universal refer syntax for construction, e.g. (Horse "CJ"), and for field
    access, e.g. (. name). Let''s verify this:


    ```

    (use clojure.test)

    (def h (Horse "CJ")

    (is (= (speak h) "CJ says neigh

    ```


    ```

    (is (= (type h) user.Horse))

    (is (= (type Horse) java.lang.Class))

    ```'
