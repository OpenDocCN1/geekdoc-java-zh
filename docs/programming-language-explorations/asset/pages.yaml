    # 8.10 CLOJURE WRAP UP


    In this chapter we briefly looked at Clojure. We learned that:


    +   - Clojure is a Lisp, with powerful metaprogramming facilities gained from
    code-as-data, such as macros.

    - Cloj programs are executed with a reader and evaluator. The reader reads source
    text and creates forms, which can be symbols, literals, or a variety of interesting
    data structure representations. The evaluator evaluates forms. Symbols and lists
    are evaluated specially. Quoting suppresses evaluation, allowing symbols and lists
    to be referred to directly.

    - The let form creates local bindings, and for convenience, so do a few other
    forms.

    - Instead of recursive functions, the language provides the special loop and recur.

    - Clojure favors dynamic typing.

    - Code appears as (nested) lists, with the head treated as the operator (function,
    macro, or special form), and the tail (the rest of the list elements) operands.

    - The collections—lists, vectors, sets, and maps—are immutable, persistent, and
    have semantic values for equality. They can be treated as lazy sequences, which
    dozens of deferred operations can be performed.

    - Namespaces are used to organize large programs. Namespaces hold vars and classes.

    - Vars are one of the few mutable objects in Clojure.

    - Transients speed up the creation of persistent structures, taking advantage
    of mutability that programmers are exposed to isolate.

    - Refs are mutable but can only be updated within a transaction, providing synchronous
    coordinated access to multiple values. Agents allow multiple threads to access
    a single value asynchronously. Both agents and refs, like vars, wrap a value which
    the programmer accesses via def.'
