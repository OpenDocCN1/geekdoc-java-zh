  md: "# Ruby 87\n\nBlock parameters have their own shadow variables of the same name\
    \ in enclosing scopes. Code within the block body can both read and mutate variables\
    \ in the enclosing scope. In addition to parameters, blocks may have their own\
    \ block-scoped variables. These appear after a semicolon in the block's \"header,\"\
    \ and also variables in the enclosing scope.\n\n```\ndef main\n  x = 100\n  [1,2,3].map{|x|\
    \ x * x}\n  fail unless x == 100\n  [1,2,3].each{|y| y = x + y}\n  fail unless\
    \ x == 106\n  [1,2,3].each{|y; x = (x|0) + y}\n  fail unless x == 106\n\nend\n\
    ```\n\nTo have a method transfer control to its block, use yield. Let's see how\
    \ this works. The following method generates powers of two up to some limit. What\
    \ happens to those powers depends on the block supplied to the method.\n\n```\n\
    def powers_of_two(limit)\n  x = 1\n  while x <= limit\n    yield x\n    x += x\n\
    \  end\nend\n\npowers_of_two 90 do |\n  puts x\nend\n```\n\nBlocks remind you\
    \ of anonymous functions. They have their own parameters and local variables,\
    \ and can manipulate variables in the enclosing scopes. But to use blocks like\
    \ first-class functions (assign them to variables and pass around), we must create\
    \ Procs from them. There are two kinds of Procs, regular proc and lambda proc;\
    \ and a variety of ways to demonstrate:\n\n```\nplusTwo = proc {|x| x + 2}\nplusThree\
    \ = Proc.new{|x| x + 3}\nplusFour = lambda {|x| x + 4}\nplusFive = -> (x) (x +\
    \ 5)\n```\n\n```\n# How do we call them? What are they? Regular or lambda?\np\
    \ [plusTwo.call(10), plusTwo.class, plusTwo.lambda?]\np [plusThree.call(10), plusThree.class,\
    \ plusThree.lambda?]\np [plusFour.call(10), plusThree.class, plusFour.lambda?]\n\
