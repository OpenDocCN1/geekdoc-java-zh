  md: '# # Preface


    Much has happened since the question “Why would you want more than machine language?”
    was answered.


    +   - 1950s-60s: Several computing professionals, most notably Grace Hopper, John
    McCarthy, and John Backus, create high-level, machine-independent programming
    languages. We have seen Fortran for scientific computing, COBOL for business,
    Algol for computing research, and Lisp for artificial intelligence. In the mid-1960s,
    PL/I and Algol 68 emerged for multi-purpose computing.

    - 1960s-70s: Industry learns that hard-to-read code prevents many projects from
    achieving success. The structured programming revolution begins. Languages providing
    information hiding, as Modula, CLU, Simula, Mesa, and Euclid attempt to address
    the “soft crisis.” Structured and modern features are bolted on earlier languages.

    - 1980s: Object-orientation (OO) takes the world. Though begun in the 1960s with
    Simula and refined in the 1970s at Xerox PARC with Smalltalk, OO–or approximations–it-odes
    in the 1980s with Classes (since renamed C++), Objective-C, Eiffel, and Self.
    Early languages such as Lisp and Pascal gain OO features, becoming Common Lisp
    and Object Pascal, respectively.

    - 1990s: The Wide Web expands and Perl become popular. Java, JavaScript, and PHP
    are created with web applications.

    - 2000s: With machines increasing, interest in established dynamic languages such
    as Ruby takes off. Scala shows that static languages can feel dynamic. Clojure
    is a dynamic, modern Lisp, leveraging Java’s virtual machine.


    2010s: Old things become new again. Multicore processors and “Big Data” revive
    interest in functional programming. Older languages such as Python and R, and
    the newer Julia, use data in science. Net-centric computing and performance concerns
    mean static typing popular again as Go, Rust, Swift challenge and C++ for native
    applications.


    Each of the two languages we’ve mentioned, the tens of those we did not, was created
    for some purpose. New creations may address a particular problem, improve upon
    old languages, or help express solutions in a more efficient manner. Some introduce
    ideas give us new ways to think about programming. There’s no single best language
    for all possible tasks, so we learn of them.


    This book will acquaint you with a number of programming languages in use today.
    For each, we will provide a brief tour of the language’s base and advanced features
    augmented with dozens of multiple languages. In doing, we will provide a foundation
    for more effectively using your current favorite languages–and for learning new
    ones, too.'
  merge: -1
