    \ features in future sections.\n\nThe standard library includes the signed integer\
    \ types **Int8**, **Int16**, **Int32**, and **Int**; unsigned integer types **UInt8**,\
    \ **UInt16**, **UInt32**, **UInt64**, and **UInt**; floating-point types **Float**\
    \ (32-bits) and **Double** (64-bits). The types **Bool**, **Character**, and **String**\
    \ should be familiar, though unlike Go, Swift's character and string understand\
