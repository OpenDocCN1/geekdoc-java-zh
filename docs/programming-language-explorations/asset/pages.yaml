    The instruction on the line labeled "30" is a computed goto. It evaluates a conditional
    expression and transfers control to one of (up to) three instructions whether
    the condition is negative, zero, or positive.

    Fortran has evolved a great deal throughout the years. Line numbers, fixed formatting
    (did you notice that all instructions were started in column 7?), and the computed
    goto are part of the language''s past. Today''s Fortran sports many features including
    support for object-oriented and parallel computing. The language remains used
    in the areas of numerical and scientific computing where high performance is a
    major concern. Modern dialects of Fortran include support for parallel computing
    through distribution of data processors.


