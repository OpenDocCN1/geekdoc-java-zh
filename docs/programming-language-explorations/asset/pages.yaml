  md: "# Erlang 203\n\nNow let's look at the order pool. The pool can accept an order\
    \ from a customer at any time, and \"adds\" the order to the pool. Erlang is a\
    \ functional language, so \"adding\" means recursing with a new pool just like\
    \ the original with the new order appended. The pool will also accept requests\
    \ from cooks to take orders, but only when orders exist, so use a guard. If an\
    \ order is ready, the pool messages the cook with the food to prepare, \"dequeuing\"\
    \ the oldest order.\n\n```\n-module(order_pool).\n-export([run/1]).\n\nrun(Orders)\
    \ ->\n  receive\n    {place, Order} ->\n      lists:append(Orders, [Order]);\n\
    \    {ready, Cook} when length(Orders) > 0 ->\n      Cook ! prepare, hp(Orders),\n\
    \      run(tl(Orders))\n```\n\nCooks repeatedly message the pool when ready to\
    \ cook then immediately wait to be messaged with the order. The cook passes its\
    \ own pid via the built-in function self. The cook receives the order as a tuple\
    \ containing both the food and the pid of the customer who placed the order. After\
    \ cooking, the cook sends the prepared meal directly to the customer and loops\
    \ back to being ready to prepare the next order.\n\n```\n-module(cook).\n-export([run/2]).\n\
    \nrun(Name, Orders) ->\n  Orders ! {ready, self()} ->\n    receive\n      {prepare,\
