  md: "deliver the finished meal directly to the customer. Customers leave after eating\
    \ 10 meals. When all customers have finished, the simulation ends gracefully.\n\
    \nLet's start with the order type and the global order queue:\n\n```\npackage\
    \ main\n\ntype Order struct {\n    food string\n    customer string\n    reply\
    \ chan *Order\n    preparedBy string\n}\n```\n\n```\nvar Orders = make(chan *Order,\
    \ 5)\n```\n\nEach order holds the item that was ordered, the name of the customer\
    \ placing the order, and a channel through which to send the order back to the\
    \ customer. The global (to package) variable Orders is the queue to which cooks\
    \ will place, and retrieve. Our channels contain pointers to orders, allowing\
    \ the orders themselves to be modified.\n\nCooks are goroutines that never terminate\
    \ (call these daemons if you wish). Not explicitly terminating is no problem;\
    \ the entire program will end when the main goroutine finishes. A cook repeatedly\
    \ retrieves an order from the global queue, prepares the meal, signs it in the\
    \ preparedBy field, and sends the order back through the reply channel:\n\n```\n\
    package main\n\nfunc Cook(name string) {\nreport(name, \"starting work\")\nfor\
    \ {\n    order := <-Orders\n    do(name, \"cooking for \" + order.customer, 12E9)\n\
    \    order.preparedBy = name\n    order.reply <- order\n}\n}\n\n```\n\nOur utility\
    \ function report logs a simple message, while the function do logs a message\
    \ and sleeps, simulating an action such as cooking, eating, or shopping. Since\
    \ multiple cooks will log messages, we require a synchronized logging mechanism\
    \ so that messages do not become interleaved. Fortunately, Go's log package contains\
    \ a number of functions, println, that are protected against interleaving.\n\n\
    ```\npackage main\n\nimport (\n    \"time\"\n    \"log\"\n    \"math/rand\"\n\
    )\n```"
