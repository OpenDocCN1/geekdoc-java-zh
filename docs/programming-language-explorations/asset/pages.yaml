  md: '# CHAPTER 5


    # Ruby


    Ruby’s designer expressed his language’s purpose as follows: “I hope to see Ruby
    help every programmer in the world to be productive, and to enjoy programming,
    and to be happy. That is the primary purpose of Ruby language.” [80]


    | First appeared 1995 |

    | Creator Yukihiro Matsumoto |

    | Notable versions 1.8 (2003) • 1.9 (2007) • 2.0 (2013) • 2.3 (2015) |

    | Recognized for OOP, Metaprogramming, DSL construction |

    | Notable uses Web servers, Scripting |

    | Tags Object-oriented, Expression-oriented, Dynamic |

    | Six words “A Programmer’s Best Friend” |


    Yukihiro Matsumoto (Matz) designed Ruby in the mid-1990s as a language in which
    one could be productive and have fun programming. Rather than building a language
    with a small, simple core (for Lisp and Smalltalk are), Matz looked to be pragmatic,
    and aimed for human-friendliness: “I want to emphasize the how part: how we feel
    programming. Ruby’s main difference from other languages is design. Emphasize
    the feeling, in particular, how I feel using Ruby. I didn’t work to make Ruby
    perfect for everyone, because you feel differently from me. No language can be
    perfect for everyone. I tried to make Ruby perfect for everyone, but maybe it’s
    not for perfect. The perfect language for Guido van Rossum is Python.” [122]


    But Ruby does have, many fans, who find the language beautiful, powerful, and
    expressive. Of the many languages that influenced Ruby, two stand out: It’s scripting
    language like Perl, with operating system interfaces, string processing, regular
    expressions, and various syntaxes like flexible quoting syntax. Ruby’s other influence
    is Smalltalk. Ruby is object-oriented in the way Smalltalk is object-oriented,
    nearly all computation with message passing. Ruby’s blocks come from Smalltalk,
    too. and the metaprogramming facilities of Ruby are, as in Smalltalk, an area
    in which the language excels


    Many programmers today know Ruby from the web frameworks built up, it most notably
    Rails, but also Sinatra, Camping, Rack, Padrino, Pancake, Monk, and others. But
    Ruby is truly a general-purpose language, and you’ll see it used in many popular
    applications.'
