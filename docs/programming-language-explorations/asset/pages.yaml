    Steve McConnell articulates these benefits as well as anyone [82]:


    ...Mastering more than one language is a watershed in the career of a professional
    programmer. Once a programmer realizes that programming transcends the syntax
    of any specific language, the doors swing open to knowledge that truly makes a
