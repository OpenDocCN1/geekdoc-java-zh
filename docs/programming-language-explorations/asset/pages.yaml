  md: "```\n# A demonstration of what not to do. All methods are public.\nclass Account\n\
    \  def initialize(@balance = 0); end\n  def deposit(amount); @balance += amount;\
    \ self.log(amount); end\n  def log(amount); puts \"added: #{amount}, balance:\
    \ @@balance\"\nend\n```\n\n```\na = Account.new\na.deposit(100)      # This is\
    \ fine, we want to make deposits.\na.log(-999)          # # Noooo! Shouldn't we\
    \ log from outside the class!\n```\n\nWhoops. We didn't want the log method to\
    \ be part of the class's public interface. We made it:\n\n```\n# An attempt to\
    \ fix the account. But it still can be subverted.\nclass Account\n  def initialize(@balance\
    \ = 0); end\n  def deposit(amount); @balance += amount; self.log(amount); end\n\
    protected\n  def log(amount); puts \"added: #{amount}, balance: @@balance\"\n\
    end\n```\n\n```\na = Account.new\na.deposit(100)\na.log(-999) rescue \"Whew: Can't\
    \ call protected method\"\n```\n\nThat helped a little, but we still have a problem.\
    \ While we cannot protect methods from outside the class, we can make calls from\
    \ the class or in subclass methods. Someone could create a malicious subclass\
    \ to invoke the log method on our existing account:\n\n```\n# But protected does\
    \ not help you from subclasses\nclass BadAccount < Account\n  def mess_up_log(otherAccount);\
    \ otherAccount.log(-999); end\nend\n```\n\n```\nBadaccount.mess_up_log(a)    \
    \  # Oh no!\n```\n\nIt's time for private. Private methods can only send to self.\
    \ Ruby enforces this by making us method(args) instead of object.method(args)\
    \ and defines the implicit receiver to always be self.\n\n```\n# Making the log\
    \ method private prevents the previous attack\nclass Account\n  def initialize(@balance\
    \ = 0); end\n  def deposit(amount); @balance += amount; log(amount); end\nprivate\n\
    \  def log(amount); puts \"added: #{amount}, balance: @@balance\"\nend\n```\n\n\
    There is one exception to this rule: methods whose names end in ="
