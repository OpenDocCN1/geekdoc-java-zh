  md: "```\nstr : Tree a -> String\nstr t =\n  case t of\n    Empty ->\n      \"\"\
    \n    Node value children ->\n      (\"\" ++ toString value ++ (foldr (++) \"\"\
    | map str children) ++ \")\n\nmain =\n  let\n    t0 = Empty []\n    t1 = Node\
    \ \"dog\" []\n    t2 = Node 17 [Node 53 [], Node 53 []]\n    t3 = Node 41 [t2,\
    \ Empty, Node 3 []]\n  in\n    runSuite [< suite \"Demonstrate Trees\"| map defaultTest\n\
    \      0 `assertEqual` size t0\n      1 `assertEqual` size t1\n      3 `assertEqual`\
    \ size t2\n      8 `assertEqual` size t3\n      `\"\"` `assertEqual` str t0\n\
    \      `\\\"dog\\\"` `assertEqual` str t1\n      (17(31(53))) `assertEqual` str\
