  md: 'Operator Overloading The allowance for a single named operator to have different
    implementations depending on their arguments. For example, the name * can overload
    integer multiplication, floating-point multiplication, string repetition, vector
    dot product, or vector scalar.


    Option Type A type whose values are wrappers that either contain or do not contain
