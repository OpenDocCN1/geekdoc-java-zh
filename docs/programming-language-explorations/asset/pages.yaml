    \ count) ->\n                System.out.printf(\"%s %d\\n\", word, count));\n\
    \    }\n}\n```\n\nOur InputStream transforms the byte sequence from standard input\
    \ into a character sequence. This reader then decorated by a BufferedReader, which\
    \ buffers the characters for efficiency. The lines method produces a stream of\
    \ lines, which flatMap not only splits individual words but gathers the words\
    \ across all lines into a single stream word.\n\n> 1 Notice the emphasis on patterns,\
    \ matches, scanners, etc. Steve Yegge has written a humorous take on this part\
    \ of Java programming culture in [141].\n\n> 2 Java's standard TreeMap is traditionally\
    \ implemented with a Red-Black tree [137"
