    \ values may be tagged—the string \"x\" does not belong to our token type; Token.identifier(\"\
    x\") does. Processing enumerations often occurs when destructuring in switch statements:\n\
    \n```\nenum Token {\n    case plus\n    case minus\n    case number(Double)\n\
    \    case identifier(String)\n\nfunc lexeme() -> String {\n    switch self {\n\
    \        case .plus: return \"+\"\n        case .minus: return \"-\"\n       \
    \ case .number(let value): return String(value)\n        case .identifier(let\
    \ name): return name\n    }\n}\n```\n\n```\nlet expression: [Token] = [.number(4.0),\
    \ .plus, .identifier(\"x\")]\nlet text = expression.map{\\$0.lexeme()}.joined(separator:\
    \ \" \")\nassert(text == \"4.0 + x\")\n```\n\nValues of an enumeration type may\
    \ be assigned raw values, from the enumeration's underlying raw type. This allows\
    \ additional information to be associated with each enum value (not wholly, but\
    \ not the same as, structure field tags in Go). Raw types may be strings, numbers,\
    \ or characters.\n\n```\nenum Suit: String {\n    case spades, hearts, diamonds,\
