    $M\alpha \rightarrow (M\beta) \rightarrow M\beta$).


    Monitor An object or module providing mutually exclusive access among its clients
    to achieve safety.


    Object 1. An entity in a program intended to be stored in memory. 2. (OOP) An
    instance of class.


    Operator A function, generally, though not necessarily, named with non-alphanumeric
    symbols that computes well-known (often algebraic) and widely applicable operations.'
