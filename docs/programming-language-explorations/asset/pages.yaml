  md: "# 202 Programming Language Explorations\n\nErlang values the receive expression\
    \ as follows. It examines the first message in the mailbox (messages are queued\
    \ in the order they arrive), and attempts to match the message against each receive\
    \ pattern. Just as with cases expressions and functions, receive patterns may\
    \ have guards. If a matching pattern with a true guard is found, the corresponding\
    \ body is evaluated to produce the result of the receive expression. If no match\
    \ is found, the second message in the mailbox is considered and so on until the\
    \ entire mailbox. If no message arrives, the receive expression blocks until a\
    \ good message arrives—or until a timeout expires, which is one we will see soon).\n\
    \nLet's revisit our cooks and customers simulation from the Java chapter, with\
    \ couple modifications for variety. Each customer serves ten times and leaves.\
    \ Customers place an order in an order pool; cooks fetch orders from the pool.\
    \ Cooks prepare orders and deliver the prepared meals directly to the customer's\
    \ table. If customers do not get timely service, they go shopping and return later,\
    \ where they will find, and cold food.\n\nIn our simulation, the pool is not a\
    \ shared data structure but is itself a process. A customer places an order by\
    \ sending to the pool message {place, pid}, where pid is the id of the customer.\
    \ Processes frequently send their own pid so they can be called back. A cook who\
    \ is ready to work sends to the pool the message {ready, pid}; if any orders have\
    \ been placed, the pool sends the cook message {prepare, {customerpid, food}},\
    \ instructing the cook to prepare a meal for the given customer. After preparing\
    \ the meal, the cook cooks the customer with {serve, meal}. Figure 10.1 describes\
    \ the scenario in picture-form.\n\n![](img/2cd8452ff5a372a7459559ad1d0834e4_220_0.png)\n\
    \nFigure 10.1 Message passing in the Erlang restaurant simulation\n\nOur script\
    \ creates the order pool and passes its pid to each of the customer and cook processes\
    \ upon their creation. After each of the processes are spawned, the script sleeps\
    \ for three minutes, simulating the amount of time the restaurant stays in business.\
    \ Instead of waiting for completion processes, our simulation uses the fact that\
    \ when the main processes are in an script application, the entire process stops.\
    \ No business lasts forever.\n\n```\n% First line is ignored when running with\
    \ script\n```\n\n```\nmain() - \nOrders <- spawn(order_pool, run, []),\n[spawn(cook,\
    \ run, [Name, Orders]) || Name <- [\"Aly\",\"Rob\",\"Chi\"],\n[spawn(customer,\
    \ run, [Name, Orders]) || Name <- [\"Xia\",\"Ann\",\"Bo\",\"n\"Rai\",\"Ali\",\"\
    Kat\",\"Esche\",\"Sen\",\"Ami\",\"Lina\",\"Ara\",\"Zuri\"]]],\ntimer:sleep(180000).\n\
    ```\n\n> Clauses without guards as if they have a true guard."
