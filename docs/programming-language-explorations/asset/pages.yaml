  md: '# Go


    Go is “an open source programming language that makes it easy to build simple,
    reliable, and efficient software.” [37]


    | First appeared 2009

    | Designers Robert Griesemer, Rob Pike, Ken Thompson

    | Notable versions 1 (2012) • 1.5 (2015)

    | Recognized for Being simpler than C++, Goroutines

    | Notable uses Servers

    | Tags Statically Typed, Concurrent, Channel-Oriented

    | Six words or less Google''s language for Google-sized problems


    Go was conceived, designed, and first implemented at Google to address Google-sized
    problems. It powers light, scalable, distributed systems running on thousands
    of machines. With a garbage-collected language, it targets applications traditionally
    written in languages such as C++. Implementations are known for fast compilation
    and lightweight processes.


    Go is statically typed, but lighter than Java. You’ll find a good deal of type
    inference—not much as in Elm—but plenty nevertheless. You create programs with
    **goroutines, channels**, and a powerful select statement; not with threads, semaphores,
    polling, or over low-level constructs. Go feels like a dynamic language. Your
    types conform to **interfaces** without explicit **implements** clauses, but simply
    by defining the methods. You have easy access to run-time type information needed.


    Go’s designers strive to keep the language simple, not omitting only threads but
    implementation inheritance, compile-time generics, conditional expressions, and
    operator overloading. You won’t encounter objects in Go: operations that can fail
    return two values, one which signals an error. You can **panic**, though, when
    you deem an error condition unwieldy to handle immediately, and recover from elsewhere.
    You get safety, too: simply use **deferred operations** to ensure resources are
    cleaned up even during panics.


    Our tour of Go begins with a look at our three traditional scripts and coverage
    of the basics. Go is intentionally a small language, so we won’t have a great
    deal to discuss here.'
