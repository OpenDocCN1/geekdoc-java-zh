    We begin by creating a (presumably new) namespace named library, and在你 two vars.
    We then modify the contents of (mutate) the var. The symbol x remains mapped to
    the same var; only the contents of the var changes. See Figure 8.2. We then switch
    to a new namespace application: to access the objects in the other namespaces
    we use a qualified symbol. After invoking it, however, the symbol mappings within
    the library namespace become available without qualification.


    ![](img/2cd8452ff5a372a7459559ad1d0834e4_170_0.png)


    Figure 8.2 Symbols, vars, and values

    Vars denote the var object mapped to the symbol x by #''x, or equivalently, (var
    x). Evaluating the symbol produces the value held in the mapped var. To get the
    value from the var object, we use deref, the shorthand notation with the prefix.
    Study the following carefully:


    ```

    (use ''clojure.test) ; create a Var, map x to it

    (def x 100) ; the actual Var that x maps to

    (def y #''x) ; the Var is an object with a type

    (is (= (type y) clojure.lang.Var)) ; the value is in the Var

    (is (= (deref y) 100)) ; deref is shorthand for deref y

    (is (= x 100)) ; Update the directly

    (def x 200) ; Update the var through the symbol

    (is (= (deref y) 200)) ; See the change directly

    (is (identical #''x (var x))) ; #''x is shorthand for (var x)

    ```


    Prior to encountering, all of the Cloj objects we''ve seen, in collections, were
    immutable. Immutability is certainly the norm in Cloj; the only mutable objects
    are vars, refs, agents, and Java fields (inters with Java nicely). Immutability
    made threaded programming easier by removing race conditions and other concurrent
    problems arising from shared state. However, threads need to cooperate via the
    changing state of a system. Fortunately, vars, refs, and agents have been carefully
    designed to manage this cooperation well. We''ll get to refs and agents shortly,
    but first, we have an important question to answer. If collections are immutable,
    with add, remove, and update operations generating new collection objects, how
    such operations possibly be efficient?'
