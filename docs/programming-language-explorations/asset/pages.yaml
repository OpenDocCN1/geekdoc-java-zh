    # 13.7 THE WEB


    The ubiquity of the World Wide Web, it''s not at all surprising that programming
    languages specifically targeted to the web would arise. The web is a client-server
    system, where multiple clients interact asynchronously with a stateless server
    using a protocol with a limited number of verbs, namely GET, POST, PUT, PATCH,
    DELETE, OPTIONS, and TRACE.


    While just any language can—has been—used on the server side of the web (e.g.,
    Python, Ruby, Java, and many others come to mind), PHP owes its existence to its
    creator''s desire for a server-side web application scripting program. We''ll
    look at PHP, and a successor language, Hack. On the client-side, there is just
    one choice: JavaScript. Hundreds of others! These other, compile-to-JavaScript,
    languages include JavaScript (a Clojure dialect), PureScript (which looks suspiciously
    like Haskell), and CoffeeScript (from Chapter 2). You can find a list of these
    languages at [9]. We''ll give a mention in this section to TypeScript and Dart.


    # PHP


    PHP is a server-side scripting language developed by Rasmus Lendorf, originally
    built to maintain his personal home page.


    First appeared 1994

    Designed by Rasmus Lendorf

    Notable versions 4.0.0 (2000) • 5.0.0 (2004) • 7.0.0 (2015)

    Recognized for Server-side web applications

    Notable uses E-commerce, Powering many of the world''s web servers

    Tags Imperative, Weakly typed, Web scripting


    PHP stands for PHP Hypertext Processor and is an today, general-purpose programming
    language with plenty of features, including closures, null-coalescing, exception
    handling, and variadic functions.


    PHP does, however, remain dogged by some less-than-stellar design choices in its
    somewhat organic evolution. Some ample-natured criticisms of these design choices
    are documented in [29] and [126] among others. The language has years, yet some
    of the early problematic features, but even with its remaining issues is able
    to stay high on the list of the world''s most popular languages.


    > ⁶For example: inconsistent spelling: gettype vs. get_class; the left-associative
    conditional: TRUE ? 1 : FALSE ? 2 : 3 is 2, and strangely named methods: DateTimeImmutable::modify().'
