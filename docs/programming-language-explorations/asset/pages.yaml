  md: "# Java ■ 133\n\nString and Person respectively, and check the name field for\
    \ null, and let the boss be null if necessary. Expressions such as p.getBoss().getName()\
    \ may fail at run-time. But we'd like the compiler to type check expressions,\
    \ so we bring in Optional<T> from the package java.util. Think of an optional\
    \ as a wrapper: an optional either wraps a person, or is empty (see Figure 7.2).\n\
    \n![](img/2cd8452ff5a372a7459559ad1d0834e4_151_0.png)\n\nFigure 7.2 Optionals\n\
    \n```\nimport java.util.Optional;\nimport java.util.Objects;\n\nclass Person {\n\
    \    private String name;\n    private Optional<Person> boss;\n\n    private Person(String\
    \ name, Optional<Person> boss) {\n        this.name = Objects.requireNonNullNull(name);\n\
    \        this.boss = boss;\n    }\n\n    public Person(String name) {\n      \
    \  this(name, Optional.empty());\n    }\n\n    public Person(String name, Person\
    \ boss) {\n        this(name, Optional.of(boss));\n    }\n\n    public String\
    \ getName() {return name;}\n    public Optional<Person> getBoss() {return boss;}\n\
    }\n```\n\nThe field and constructor definitions express our intent quite well:\
    \ name is required, boss is optional. The static factory methods Objects.requireNonNullNull\
    \ and Optional.of prevent being constructed with unwanted values. And the expression\
    \ p.getBoss().getName() fails to compile: you'll have to deal with the no-boss\
    \ case, but you won't be surprised by it. The compiler forces you to deal with\
    \ it.\n\nThe most common usage patterns for optionals are as follows. Let o be\
    \ optional, and x its value, if present. Then:\n\n+   - o.isPresent() returns\
    \ whether or not o wraps a value.\n- o.isPresent(f) invokes f(x) if present and\
    \ does nothing otherwise."
