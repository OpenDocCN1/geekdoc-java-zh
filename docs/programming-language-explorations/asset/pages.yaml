    prior to a call, but rather within the function (essentially) the text of the
    argument expression.


    Pass-Reference An argument passing mechanism in which a reference to the argument
    is passed to the parameter, so that mutations through the parameter are immediately
    applied to the argument.


    Pass-Sharing An argument passing mechanism in which only (a copy) of the object
    identifier of the argument is passed.


    Pass-Value An argument passing mechanism in which an argument is evaluated and
    then (a copy) is passed to the parameter.


    Pass-Value Result An argument passing mechanism in which an argument is evaluated
    before the callee, passed by value to the corresponding parameter, and after execution
    of the callee, any changes to the parameter are copied to the result argument.


    Persistent Data Structure A data structure that retains the previous version of
    itself when modified.


    Pointer An object that refers to a location in memory.


    Polymorphism The allowance for a single name to be bound to multiple entities
    at the same time, generally with the understanding that any invocation of the
    name will refer to the desired entity based on context.


    Promise Roughly a placeholder for an (initially) unfinished computation. A promise
