  md: "# Introduction\n\nHello! It appears that you might be interested in languages\
    \ of the programming kind. Whether you are certain that you are, or not so sure\
    \ that you are, we'll try, in this chapter, to pique your interest and make the\
    \ study of programming languages look not only fun, but worthwhile.\n\n# 0.1 WHY\
    \ STUDY PROGRAMMING LANGUAGES\n\nLearning new programming languages will enable\
    \ you to think about, and solve, problems in new and sometimes surprising ways.\n\
    \nHow so? Try writing a function to sum the squares of the even numbers in an\
    \ array. If all you know is C, you might think through this exercise as follows:\n\
    \n```\nint sum_of_even_squares(int* a, unsigned int length) {\n    int total =\
    \ 0;\n    for (unsigned int i = 0; i < length; i++) {\n        if (a[i] % 2 ==\
    \ 0) {\n            total += a[i] * a[i];\n        }\n    }\n    return total;\n\
    }\n```\n\nBut this is unsatisfactory: why is the variable i there? Why do we care\
    \ about the indexes of the array? In Swift, we can iterate over the array elements\
    \ directly.\n\n```\nfunc sumOfEvenSquares(_ a: [Int]) -> Int {\n    var sum =\
    \ 0\n    for x in a {\n        if x % 2 == 0 {\n            sum += x * x\n   \
    \     }\n    }\n    return sum\n}\n```"
  merge: -1
  pgno: 19
- img_proc: true
  md: "# 2 Programming Language Explorations\n\nSlightly better, perhaps, but we can\
    \ express a solution in a completely different way. Rather than the for-loop and\
    \ its nested if-statement putting each individual element in charge of the overall\
    \ computation, we can let the array work, by:\n\n+   1. Selecting, or filtering,\
    \ by its elements,\n2. Mapping the square operation over the selected elements,\
