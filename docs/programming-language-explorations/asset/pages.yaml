  md: '**Class** An entity from which objects are created. Objects instantiated from
    a class have the structure and behavior defined by the class, though in some languages
    instances are allowed to be customized.


    **Class Variable** A property that belongs to a class, rather than to the instances
    of the class.


    **Closure** A block or function with free variables that takes values from the
    environment which it is defined.


    **Code Point** The unique, nonnegative integer value assigned to a character in
    a character set.


    **Coercion** An implicitly applied type cast.


    **Comprehension** A composite value defined by means of an expression that generates
    the components.


    **Concrete** A class that is allowed to have instances.


    **Concurrency** The methodology and coordination of independent and distinct computing
    activities whose execution may overlap in time.


    **Continuation** Roughly, a representation of "the rest of the program."


    **Coroutine** A line of execution that, under explicit programmer control, can
    yield to other coroutines and be resumed. Coroutines share a processing unit in
    the state that only one coroutine is executing at a time.


    **Covariance** The existence of a subtype relationship between T<U> and T<V>,
    where T is a parameterized type and U is a subtype of V.


    **Curried Function** A function of one parameter that returns a function of one
    parameter, in contrast to a function that takes two parameters (or a pair of objects).


    **Dangling Pointer** An in-scope pointer variable whose referenced memory has
    been freed, waiting for the other to finish.


    **Deadlock** A situation where two or more competing threads are blocked forever,
    each waiting for the other to finish.


    **Decimal Type** A datatype that stores the decimal digits of numeric quantities.


    **Decorator** An object providing additional behavior to another object.


    **Deferred Execution** A block of code executed at some point in the future, generally
    in response to a triggering event.


    **Deep Copy** A copy which recurses through an object graph, copying all referenced
    values.


    **Dependent Type** A type that depends on a value or constraint, such as the type
    of trees with height 8, or the type of sorted lists.


    **Dereference** The evaluation of the object referenced by a (pointer) variable.


    **Destructor** A code of (key-values function) executed when an object is destroyed.


    **Dictionary** A set of key-values, with unique keys. Also known as a *map*.


    **Discriminated Union** See *tagged union*.


    Dynamic Language** A language in which tasks such as modifying code and adding
    types can be done at run time.'
