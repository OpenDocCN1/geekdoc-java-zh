  md: "```\nfunc Example() {\n  ch := make(chan int)\n  go func() {\n    ch <- 100\n\
    \    close(ch)\n  }\n  value, ok := <-ch\n  fmt.Println(value, ok) // This will\
    \ be ready\n  value, ok = <-ch\n  fmt.Println(value, ok) // This won't, but it\
    \ won't block!\n  // Output: 100 true\n  // 0 false\n}\n```\n\nMany concurrent\
    \ programming scenarios involve goroutines reads and writes that timed out; or\
    \ reads and writes that back off if the other side is not immediately ready. Go's\
    \ powerful select statement handles all of these concerns. It consists of zero\
    \ or more cases, each of which is a channel read or write (or at most one) default\
    \ case:\n\n```\nselect {\ncase v1 := <-c1:\n  statement_list_1\ncase v2, x2 :=\
    \ <-c2:\n  statement_list_2\n// more cases...\ncase cn := <-xn:\n  statement_list_n\
    \      // The default case is optional\ndefault:\n  statement_list_n+1\n}\n```\n\
    \nGo evaluates, in order, of the channel expressions and send-expressions. If\
    \ none of the communications is ready and there is no default case, the statement\
    \ blocks until a case can proceed, or if ever never becomes ready. If Go is ready\
    \ and a default is present, the default statement executes. If ready cases do\
    \ exist, Go selects one at random to proceed, and returns the corresponding statement.\n\
    \nThe expression time(d), for some Duration¹ value d produces a channel that blocks\
    \ for the given duration, and when read from, yields the current time. This gives\
    \ a convenient mechanism for timing out sends and receives—simply receive this\
    \ channel from a select statement. If either communication will happen within\
    \ the duration specified, or the channel will unblock the select when the delay\
    \ expires. Here we see an example momentarily:\n\nNow we're ready to build the\
    \ Go version of the runtime simulation we saw in the Java andlang chapters. Recall\
    \ the scenario: three chefs serve customers. Customers place their order in a\
    \ bounded order queue of capacity 5. A customer unable to get an order placed\
    \ in 7 seconds leaves for a shopping trip and returns later. Cooks prepare the\
    \ order and\n\n> The duration is defined as type Duration int64 in the package\
    \ time, and represents the length of time between two instants in nanoseconds.\
    \ Durations, therefore, have a range of approximately ±292 years."
