  md: "# 230 Programming Language Explorations\n\n```\npackage main\n\nimport \"fmt\"\
    \n\nfunc g() {\n\tdefer fmt.Println(\"Cleaning up g\")\n\tpanic(\"Oh no\")\n\t\
    fmt.Println(\"This message will not be displayed\")\n}\n\nfunc f() {\n\tdefer\
    \ func() {\n\t\tfmt.Println(\"Cleaning up f\")\n\t\tif r := recover(f); r != nil\
    \ {\n\t\t\tfmt.Println(\"Recovered the panic value\", r)\n\t\t}\n\t}()\n\tfmt.Println(\"\
    This message will not be displayed\")\n}\n\nfunc Example() {\n\tdefer fmt.Println(\"\
    Cleaning up main\")\n\tf()\n\tfmt.Println(\"f completed normally\")\n// Output:\
    \ Cleaning up g\n// Cleaning up f\n// Recovered the panic value Oh no\n// f completed\
    \ normally\n// Cleaning up main\n}\n```\n\nIf called during a panic, recover returns\
    \ the value passed to panic. Otherwise, if panic is in progress, recover returns\
    \ nil.\n\nThe accepted convention in Go libraries is to limit panicking and recover\
    \ the internals of a library, while returning error values to clients of the library.\
    \ [35] Such a design leads to a simpler interface between callers and servicers.\n\
    \n# 11.7 GOROUTINES\n\nThe preceding sections have not covered the best part of\
    \ Go.\n\nGo is a concurrent language. This is a good thing, because the world\
    \ is concurrent, i.e., made of independent, interacting actors. Concurrent programming\
    \ is the art of structuring software systems by composing and coordinating these\
    \ independent computations. Concurrency is not the same as parallelism. Parallelism\
    \ is the state of things happening at the same time; concurrency is about managing\
    \ activities that overlap in time, whether or not these activities interleave\
    \ execution on a single processor or run in parallel on distinct processors. [98]"
