    \ A generator for a sequence of squares would produce 0 on its first, 1 on its\
    \ second, then 4, 9, 16, and so on. A function that increments a global variable,\
    \ returning its square is insecure because other parts of the code could change\
    \ the global variable, dispatching future calls to the generator! Fortunately,\
    \ we can use the fact that a function's locals are completely hidden from the\
    \ outside:\n\n```\nconst nextSquare = (() => {\n  let previous = -1;\n  return\
