  md: "# 192 Programming Language Explorations\n\n# 10.1 HELLO ERLANG\n\nOur traditional\
    \ first program. We've set it up to run as a command line script, admittedly not\
    \ the common use case for Erlang—telecom and messaging networks don't usually\
    \ write to standard output. The standard distribution comes with a little utility\
    \ called escript, which runs the script through last lines of a file:\n\n```\n\
    % First line is ignored when running with escript\nmain() ->\n  lists:foreach(fun\
    \ (C) ->\n    lists:foreach(fun (B) ->\n      lists:foreach(fun (A) ->\n     \
    \   if\n          A*A + B*B == C*C -> format(\"-p\", -p, \"-pn\", [A,B,C]);\n\
    \          true -> ok\n        end\n      end, lists:seq(1,B))\n    end, seq(1,C))\n\
    \  end, seq(1,40)).\n```\n\nThis script should appear too unusual. Defining a\
    \ main function is not odd (we saw that in Java), nor the foreach-with-callback\
    \ of nested loops (we saw that in Ruby). We qualify items from external modules\
    \ with a colon: seq and come from the lists module and format comes from the module\
    \ i. The if-expression must produce a value for all possible clauses, even though\
    \ we ignore the result of the second clause. Formatting differs with: -p values\
    \ in their standard form, and -n produces a new line. Commas separate small items\
    \ (e.g., parameters in a function call), semicolons separate medium things (classes\
    \ in a case expression) and periods end things (such as top-level declarations).\
    \ Variables, interestingly, begin with a capital letter or underscore; we'll tell\
