  md: "# Java 137\n\n+   * Concurrent data structures. Java's BlockingQueue and ConcurrentMap\
    \ implementations simplify writing some concurrent applications. In a blocking\
    \ queue, for example, use put to block until the queue has free space before inserting,\
    \ and offer to attempt an insertion either immediately or within a given duration\
    \ (returning true on insertion and false if capacity was not available). When\
    \ removing, take blocks until the queue is non-empty, and poll expects to removal\
    \ immediately or within a time frame, returning when an element was able to be\
    \ removed.\n\nThe classic examples of concurrent programming include Readers and\
    \ Writers, the Producer-Consumer Bounded Buffer, and Dijkstra's Dining Philosophers\
    \ [59]. We'll build with a little simulation, with food as in Dijkstra, but without\
    \ shared utensils.\n\nFifty customers spend their time placing orders. The orders\
    \ are placed in a queue holding only five orders at a time. A customer will wait\
    \ until 7 seconds to get an order into the queue, going home for a bit waiting\
    \ too long. The cooks prepare the order then deliver the finished meal to the\
    \ customer, until the customer takes the meal. The simulation runs until each\
    \ customer has 10 meals.\n\nOur simulation provides an abstract base class for\
    \ active threads with methods to report output: log a message, and act which logs\
    \ a message and sleeps for a random number of milliseconds (bounded above) to\
    \ simulate an action (such as cooking or eating). The runner's thread—the application's\
    \ main thread—creates 18 new threads to simulate the customers and cooks.\n\n\
    # public class Restaurant {\n\n```\nclass Agent extends Thread {\n    Agent(String\
    \ name) {\n        super(name);\n    }\n    void log(String action) {\n      \
    \  synchronized (System.out) {\n            System.out.println(getName() + \"\
    \ \" + action);\n        }\n    }\n    void act(String action, int time) throws\
    \ InterruptedException {\n        log(action);\n        Thread.sleep((int)(Math.random())\
    \ * time/2 + time/2));\n    }\n\n    public static void main(String[] args) {\n\
    \        for (int i = 0; i < 3; i++) {\n            new Cook(\"Cook-\" + i).start();\n\
    \        }\n        for (int i = 0; i < 15; i++) {\n            new Customer(\"\
    Customer-\" + i).start();\n        }\n    }\n}\n```"
