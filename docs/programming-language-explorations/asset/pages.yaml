    Let''s learn now to functions and consider the following problem: how can we write
    a function whose behavior depends on the types of its arguments? For example,
    consider a function called times such that:


    +   * If x and y are numbers, the function multiplies, e.g., times(8,3) -> 24

    * If x is a string and y is an unsigned integer, we have repetition, e.g., times("ho",3)
    => "hohoho"


    +   * If x is a vector and y is a number, we have element-wise multiplication,
    e.g., times([1,2,3]),3) -> [3,6,9]

    * If x is a number and y is a vector, we also have element-wise multiplication,
    e.g., times(5,[1,2,3]) -> [5,10,15]'
