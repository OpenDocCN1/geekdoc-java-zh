  md: '# A ON THE SELECTED LANGUAGES


    No of choices can possibly satisfy everyone; you will undoubtedly see your favorite
    languages missing, or wonder why the great influencers—Algol, Lisp, Smalltalk,
    Prolog, ML, etc.—do not appear. Our goal is to focus on modern languages in use
    today. After all, the influencers have modern descendants: Cloure is a modern
    Lisp; Ruby borrows from Smalltalk; Elm is the venerable ML family, with a Haskell
    influence. Python, Ruby, and Java, each over 20 years old, continue to evolve
    many of the best ideas of the last fifty years; we selected them as to illustrate
    the breadth of the field.


    Notice our emphasis on ideas rather than features. Alan Kay [71] has written:


    Programming languages can be categorized in a number of ways: imperative, applicative,
    logic-based, problem-oriented. But all seem to be an "agglutination of features"
    or a "crystallization of style." COBOL, PL/I, Ada, etc., belong to the first kind;
    LISP, AP—Smalltalk are the second kind.


    We haven''t selected only languages of the second kind, but we will try to emphasize
    big ideas, insights, and styles in addition to features. And we focus on today''s
    languages, many of the great classics, along with a few other modern languages,
    are discussed in a later chapter.


    # AUDIENCE


    This book is targeted both to professionals and advanced college undergraduates
    looking to expand the range of languages and programming patterns they can apply
    in work and studies. We''ve paid attention to modern programming practice, covered
    some cutting-edge languages and patterns, and provided many runnable examples,
    so readers will discover how to skills in their craft. In addition, we''ve slipped
    in a bit of academic terminology because foundational principles are required
    to grow from a hobbyist to a professional to build large, scalable, efficient
    systems. However, the book remains unapologetically an exploration of high-level
    language practice, rather than a theoretical treatise based on formal syntax and
    semantics. The exploration style places this book between a tutorial and a reference:
    we make no attempt to teach any particular language from scratch, not to provide
    complete descriptions of any language. In, we''ve kept the focus on the concepts
    and practices utilizing programming language design and usage, and you will find
    complete coverage of these within the context of the different languages used.


    If you are an instructor looking for material to supplement a programming languages
    or software engineering course, you will find our approach unconventional, but
    we, hope, a lot fun. The traditional topics—binding, expressions, control flow,
    types, modularity, concurrency, and metaprogramming—all appear, but show up repeatedly
    within the context of whole-language overviews. Students have a chance to explore
    the various features in a given language together, rather than focusing too much
    on how a feature is expressed in,, different language fragments. You also find
    that we''ve chosen not to visit the same themes in every chapter. We instead highlight
    (say) only in those chapters with interesting scoping issues, and dito types,
    coroutines, metaprogramming, and so on. Don''t go looking for any unifying themes
    across all languages; rather, look for themes appearing across several languages,
    and note which themes each language favors over others. In other words, we''ve
    targeted many, but not all, of the squares in a grid similar to the following:'
  merge: -1
