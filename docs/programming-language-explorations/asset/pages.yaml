    # 2.6 EXISTENTIAL OPERATORS


    CoffeeScript, again like JavaScript, uses null for the intentional absence of
    information, and undefined when no information is known. All other values are
    known values, and can act like objects—in fact, trying to access properties of
    null and undefined are among the few places a TypeError can occur when:


    ```

    assert = require ''assert''

    assert 4.toFixed(2) is ''4.00''

    assert true.toString() is ''true''

    assert ''abcd''.length is 5

    assert [5,3,9,4,6].indexof(3) is 1

    assert.throws((--> null.toString()), TypeError)

    assert.throws((--> undefined.toString()), TypeError)

    ```


    The postfix operator ? reports whether an expression is known, that is not null
    and not undefined:


    ```

    assert = require ''assert''


    assert 78.8? is true

    assert false? is true

    assert []? is true

    assert undefined? is false

    assert null? is false

    x = 9;

    assert x? is true

    ```


    The question mark combines with several operators to do some slick things. The
    most common use is


    ```

    c = employee?.supervisor?.city?.name

    which is a much nicer way to write:

    ```'
