    Two important predefined methods:


    +   * Comparable, which defines <, >, ==, and between. Each of these are implemented
    to invoke the receiver''s <= method, which is intended to work as follows: a <=>
    b should produce -1, 0, +1 or nil when a is less than, greater than, or not comparable
    to, b. It is mixed into numeric, string, and classes.

    * Kernel, which defines dozens of useful methods, object_id, ==, send, is_a?,
    chop, rand, exit, puts, require, and lambda. This module is mixed into Object,
    which is an ancestor of every class (except BasicObject), so these methods are
    universally available.


    Modules become "parents" of a class, just like the superclass, for the purpose
    of method lookup. So Ruby looks up methods, deal with the potential complexity
    ordering of its ancestors when looking up methods. Ruby looks up methods in this
    order:


    +   1. The object''s singleton class.

    2. The modules mixed into the singleton class. Later include statements take precedence
    over earlier ones, but in the construct A,B, A takes precedence over B.

    3. The object''s class.

    4. The modules mixed into the class.

    5. The class''s superclass.


    These rules are applied recursively.


    # 5.6 ACCESS CONTROL


    With the exception of control structures (e.g., while, break, retry) and certain
    special operators (&, |, ..., ?, and, or, defined?), the assignment operators,
    all computation in Ruby is carried out by sending messages to objects.


    When applications become complex, we find it have to control over and how methods
    can be invoked. In Ruby, public methods (the default visibility) can be invoked
    on an object from anywhere. Protected methods can only be invoked within methods
    of the object''s class or its subclasses. Private methods can only be invoked
    without an explicit receiver. We''ll explain.


    Let''s consider a simple account class that logs deposits and withdrawals. (For
    simplicity, we will stick to deposits only with puts.). We can send a deposit
    message to an account, which adjusts the balance and sends a log message to itself.
    The expression self refers to the object currently executing the method, here
    is our first pass:


    > By now, you''ve seen a few method names ending in a question mark. Generally,
    methods returning true or false were named this way; similarly, methods that mutate
    a receiver will often have names ending in an exclamation mark. Alas, these are
    conventions, and not enforced by the language.'
