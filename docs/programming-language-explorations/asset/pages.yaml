  md: '# 116 Programming Language Explorations


    +   - Scopes coincide with function bodies, while for loops, and blocks introduced
    with try, catch, finally, let, and type. The construct begin..end in particular,
    is not a scope. Variables introduced in a comprehension are scoped to each iteration.


    +   - All types reside in a single supertype hierarchy with Any at the top. Each
    type can have at most one subtype. Types can be abstract or concrete. Only abstract
    types have subtypes. Types are first-class objects, and the system is easy to
    introspect via methods such as super, subtypes, isa, typeof, and the operator
    <:


    +   - Types can be parameterized. Parameterized collection types in Julia are
    invariant.


    +   - Julia features sum (Union) and product (Tuple) types. Types are covariant.


    +   - Type annotations provide the foundation for multiple-dispatch, in which
    methods are selected based on the types of all of a function''s arguments. Annotations
    are also frequently employed to improve performance.


    +   - Julia expressions can be manipulated and modified before evaluation, enabling
    sophisticated forms of metaprogramming.


    +   - Macros are executed when code is parsed, that is, before it run. Macros
    return expressions which are called in the context of the call. Macros take their
    arguments in unevaluated form, without the need to explicitly quote them.


    +   - Julia provides many features for parallel and concurrent programming. Processes
    can be created to take advantage of multiple cores on a processor or multiple
    processors in a cluster.


    +   - The low-level constructs for parallel programming are remote calls and refer
    references. Various macros, such as @spawn, @fetch, and @parallel provide a high-level
    programming model.


    To continue your journey into Julia, you may wish to find and research the following:


    +   - Language features not covered in this chapter. Modules, constructors, networking,
    vararg types, coroutines, channels, interfacing with C, Python, and Fortran, the
    standard library, and the powerful package system.


    +   - Open source projects using Julia. Studying, and contributing to, open source
    projects is excellent way to improve your proficiency in Julia. You may enjoy
    the following projects written in Julia: Gadfly (https://github.com/djones/Gadfly.jl),
    Compose (https://github.com/djones/Compose.jl), Morsel (https://github.com/JuliaWeb/Morsel.jl),
    and of course, the language implementation itself (https://github.com/Julia/julia).


    +   - Reference manuals, tutorials, and books. Julia is http://juliaang.org/.
    The docs, http://docs.juliaang.org/, links to a Language Manual and the Standard
    Library Reference. Julia programmers should not miss the Performance Tips section
    of the official documentation. Online resources for learning the language and
    exploring advanced features are plentiful; curated learning resources at http://juliaang.org/learning/
    and advanced publications at http://juliaang.org/publications/. Leah Hanson in
    particular has a wealth of good tutorials and presentations.'
