  md: '# 52 Programming Language Explorations


    To attach metavar to a table, invoke setmetatable(t,m).⁴ The metavar will contain
    zero or more of the properties, which define how t behaves:


    ```

    __add__sub__mul__div__mod__pow__unm__idiv__band__bor__bxor

    __bnot__shl__shr__concat__len__eq__lt__le__index__newindex

    __call__tostring____metatable__gc

    ```


    When evaluating x.y, Lua checks if it has a metavar m with an __add entry, and
    so, produces m.__add(x,y). If not, y is called in a similar fashion. The next
    18 properties work in the same way: __sub for subtraction, __unm for unary minus,
    __concat

    for ..., __len for # and so on.⁵


    The __index property allows delegation of lookup: such a value can be a function
    that returns the value of a property, or table the missing property. Let''s recreate
    our Javascript example from Chapter 1 in Lua:


    ```

    unitCircle = {x = 0, y = 0, radius = 1, color = "black"}

    c = {x = 4, color = "green"}

    setmetatable(c, {_index = unitCircle})

    asert(c.x == 4 and c.radius == 1)

    ```


    Let''s create a "type" of two-dimensional vector useful in graphics applications,
    vector addition, vector dot product, a magnitude function, and a conversion to
    string. Here is one

    implementation (illustrated in Figure 3.1):


    ```

    Vector = (function (class, meta, prototype)

    class.new = function (i, j)

    return setmetatable({i = i, j = j}, meta)

    end


    prototype.magnitude = function (self)

    return math.sqrt(self.i * self.i + self.j * self.j)

    end


    meta.__index = prototype

    meta.__add = function (self, v)

    return class.new(self.i + v.i, self.j + v.j)

    end

    meta.__mul = function (self, v)

    return self.i * v.i + self.j * v.j

    end

    meta.__tostring = function (self)

    return string.format(''<%g,%g>'', self.i, self.j)

    end

    return class

    end({}, {}, {})

    ```


    > ⁴Actually, in Lua every value, not just every table, can have a metavar. However,
    setting the metavar

    for non-tables requires the C API, which is beyond the scope of our coverage.


    > ⁵There are some restrictions here and there for some of the operator stands-ins;
    details are in the Lua

    Reference Manual.'
