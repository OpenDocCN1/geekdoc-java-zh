    +   - In Go, objects satisfy interfaces by virtue of defining methods in the interface.
    There is no need for an explicit implements clause as in Java.


    +   - Go does not have exceptions, but there is a panic and recover mechanism
    for systems where unexpected or semi-expected problems occur for which recovery
    is possible.


