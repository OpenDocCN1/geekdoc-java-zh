  md: "# Swift ■ 261\n\nThe last feature facilitating safe code that we'll mention\
    \ here is Swift's defer statement. As in Go, this statement arranges to run code\
    \ when the scope exits, for any reason, whether cleanly or to an error.\n\n# 12.8\
    \ AUTOMATIC REFERENCE COUNTING\n\nSafety in programming practice is not concerned\
    \ only with the lack of ambiguity, but also with the lack of surprises. Certain\
    \ software systems often have time and space constraints, requiring events to\
    \ happen at predictable instances or complete within a predictable duration. Software\
    \ controlling vehicles or medical equipment, should not be interrupted. Each of\
    \ the languages of the previous chapters assumed the existence of a tracing garbage\
    \ collector—that fully collects heap objects reachable from “active” (global and\
    \ stack) by tracing chains of references) and reclaims all unreachable objects.\
    \ Collection in these systems usually happens on a background thread, to preempt\
    \ the running program at any time.\n\nSwift takes a different approach. Heap-allocated\
    \ object (class instance) is given a reference count, starting at 1 when created.\
    \ Each time a reference to the object is assigned to a new variable, or passed\
    \ to a parameter, the reference count is incremented. The count is decremented\
    \ when one of the referencing variables goes out of scope. When the count reaches\
    \ zero, the deinitializer method is invoked and the object is reclaimed. This\
    \ mechanism, automatic reference counting, ARC, requires no garbage collection\
    \ thread. Since allocation and deallocation occurs at identifiable points in execution,\
    \ there is no need for a preemptive garbage collector. The following brief example\
    \ shows an object being allocated and deallocated at identifiable points in a\
    \ script's execution:\n\nvar history: [String] = []\n\n```\nclass C {\n    init(){history.append(\"\
    init\")}\n    deinit{history.append(\"deinit\")}\n}\n\nfunc f(_ c: C) { // 3.\
    \ count=2\n    history.append(\"f\")\n    print(c)\n    history.append(\"f\")\n\
    } // 4. c out of scope, count == 1\n\nfunc main() {\n    history.append(\"main\"\
    )\n    let x = C() // 1. object created, count=1\n    f(x) // 2. reference passed\n\
    \    history.append(\"main\")\n} // 5. x out of scope, count == 0\n\nmain()\n\
    asnasert(history == [\"main\", \"init\", \"f\", \"f\", \"main\", \"deinit\\])\n\
    ```"
