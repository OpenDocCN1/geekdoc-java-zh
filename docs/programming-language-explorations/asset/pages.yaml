    A variable is a name that refers to a value. Do not confuse variables and values:
    variables either for or hold values, they are not themselves values. In some languages,
    a variable is simply a name to a value; in others, a variable is a container into
    which different values can be placed at different times during program execution.
    Variables of the latter kind are properly assigned. [49] Regardless of the kind
    of variable, please note a value never changes (five is always five), but which
    value is bound to or held by a particular variable.


    An expression is a combination of literals, variables, and operators that is evaluated
    to produce a value. Some expressions, like the popular && ("and then") and ||
    ("or else") require all of their operands to be evaluated; do not. An example
    of expression evaluation, as s holds the string "car", holds the value 100, and
