    # 1.8 JAVASCRIPT WRAP UP


    In this chapter we were introduced to JavaScript. We learned that:


    +   All web browsers run JavaScript; in addition, engines such as Node.js JavaScript
    on the command line or server.


    +   JavaScript expressions manipulate values of seven types: Undefined, Null,
    Boolean, Number, String, and Object. The first six are primitive types; Object
    is a reference type. Arrays and functions are objects. Values of reference types
    are actually pointers, so assignment of these values creates aliasing, or sharing.


    +   JavaScript is weakly-typed, meaning that in most situations a value e of type
    t can be used in a context in which a value of type t'' expects. The runtime will
    find a coercion of e to type t''.


    +   Values that fail to coerce are false; all other values are considered true.
    The only values in JavaScript are undefined, 0, NaN, the empty string, and the
    empty object.


    +   When calling functions, arguments are fully evaluated and then passed to parameters
    by copying values. Extra arguments are ignored; extra parameters are assigned
    undefined, or a default value if specified. Parameters and local variables live
    only during the function activation and are invisible to outer scopes.


    +   When free functions are passed into, or copied into, different scopes, the
    free variables refer to the values in their originally enclosing scopes. Functions
    taking advantage of this ability are called closures.


    +   JavaScript is statically scoped and uses deep binding. It supports both function-scoped
    (var) and block-scoped (let, const) entities.


    +   Object properties are either own or inherited properties. Property lookup
    traverses the prototype chain, if required.


    +   The value of this expression is context-dependent. It refers to (1) the global
    object when used in a global context, (2) the receiver of a method in a method
    call, provided the method is not defined with the fat arrow, (3) the newly created
    object with operator new, or (4) an object designated by the programmer in certain
    methods, such as call, and bind.


    +   The keyword class provides for defining a constructor function and methods
    that populate a prototype object.


    +   The design of JavaScript facilitates asynchronous, event-driven programming
    with callbacks. The standard library provides promises, which can be used instead
    of callbacks in many situations.


