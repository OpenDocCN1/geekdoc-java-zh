  md: "# Elm 175\n\nThe implementation of floating point division will execute fast\
    \ the Elm compiler can access lower-level code through its Native.Basics module.³\
    \ but the point is that you won't see operators appearing in the syntax definition\
    \ for the language; they are simply functions.\n\nA final note on precedence:\
    \ prefix function application always binds tighter than infix application. While\
    \ very simple, the rule leads to a few gotchas the programmer coming to Elm from\
    \ other languages might want to keep in mind:\n\n```\nnegate 3 ^ 4 parses as (negate\
    \ 3) ^ 4\nshow x * y parses as (show x) * y + z\n```\n\nYou can, of course, parse\
    \ as expected, or make use of the function operator | from precedence 0:\n\n```\n\
    negate <|3 ^ 4 parses as negate(3 ^ 4)\nshow <| x * y parses as show(x * y + z)\n\
    ```\n\nSurprisingly, that covers most of the basics. In the remainder of the chapter\
    \ we will cover two fascinating matters that are characteristic of the ML family,\
    \ powerful type inference facility and tagged unions; one characteristic of modern\
    \ ML languages, extensible records; and Elm's approach to interactivity (subscriptions\
    \ and commands).\n\n# 9.3 TYPE INFERENCE\n\nElm performs typing: it checks the\
    \ types of expressions at compile time and refuses to execute programs that may\
    \ have type errors. It is the second language in this text; Java was the first.⁴\
    \ In order to typecheck prior to execution, the compiler must be given information\
    \ about the intended types of expressions or be smart enough to infer types. Elm\
    \ is capable of relatively little type inference, requiring type annotations on\
    \ nearly all variables, method parameters and return values, fields in classes\
    \ and interfaces, etc. Elm can infer the type of nearly every expression. The\
    \ three other statically-typed languages⁵ in this book, Go, Swift, and Rust, fall\
    \ somewhere in the middle of this spectrum.\n\nElm's inference ability, like that\
    \ of all ML-family languages, has its theoretical roots in the Hindley-Milner\
    \ type system [135, 86, 22]. Elm's compiler computes (or deduces), the least general\
    \ type of expression not already explicitly annotated. Let's start with a very\
    \ simple example. Consider the Elm:\n\n```\nimport String exposing (repeat)\n\
    mystery x s =\n  repeat (round (sqrt s)) s\n```\n\n> ³Needless to say, Elm programs\
    \ will never touch Native.Basics, or its cousins as Native.Utils, Native.String,\
    \ and Native.Time.\n\n> ⁴Though technically, Java leaves a tiny amount of type\
    \ checking to runtime in cases.\n\n> ⁵Colloquially, we say a language is statically-typed\
    \ if it performs the majority of type checking prior to execution."
