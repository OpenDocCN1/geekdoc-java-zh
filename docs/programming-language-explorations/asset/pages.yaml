    +   * 7 * indexOf(''r'') + Math.sqrt(y) / 2 <= 0 || !found

    * 7 + 2 + Math.sqrt(y) / 2 <= 0 || !found

    * 14 + Math.sqrt(y) / 2 <= 0 || !found

    * 14 + Math.sqrt(100) / 2 <= 0 || !found

    * 14 + 10 / 2 <= 0 || !found

    * 14 + 5 <= 0 || !found

    * 19 <= 0 || !found

    * false || !found

    * !found

    * !true

    * !false


    A routine is a (generally parameterized) unit of code. Routines can only start
    from the beginning when known as subroutines; those able to resume from where
    they yielded when called are coroutines. Some languages use the term function
    in place of subroutine; others use the term only for subroutines returning no
    values. Coroutines interleave execution on a single sequence of instructions,
    explicitly yielding control to each other, while threads and processes run independently,
    preempted by the operating system when their number exceeds the number of available
    hardware execution units. Generally, we speak of threads sharing memory, processes
    maintain their own local memory and communicate exclusively via messages.


    A type, determines a collection of values with some prescribed behavior. That
    a value has type T means that only expressions of "type" in programming language
    theory are deep, has filled entire books, for example [97]. Typing is central
    to the study of languages, as the point of a language''s type system is to provide
    (meaningful) constraints on what we can and cannot do.


    We have an intuitive sense that values belong to type—true to the boolean type,
    0.3 to some kind of numeric type, and "Hello" to the string type—but how these
    types can vary significantly by language. Some languages use different types for
    integer and non-integer numeric values. Some arrange types into supertype-subtype
    relationships, where a value of a subtype is used wherever a value of a supertype
    is expected. Some languages group all functions into a single type, while others
    type their functions based on the types of arguments or returned values:'
