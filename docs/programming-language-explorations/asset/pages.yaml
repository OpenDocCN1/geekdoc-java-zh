  md: '# Programming Language Explorations


    If another thread were able to access and mutate either of these account balances
    during the sequence of transfer instructions, new money could be gained or lost.
    Suppose thread $t_1$ is currently executing this six-statement sequence. Further
    suppose $t_2$, deposits lottery winnings into the savings account between $t_1$''s
    steps 1 and 3. Step 3 (on $t_1$) overwrites the huge deposit. Placing the entire
    transfer in a transaction prevents such situations from happening:


    ```

    (use ''clojure.test)

    n(def savings (ref 10000))

    (def checking (ref 500))


    (is (and (= @savings 10000) (= @checking 500)))


    (dosync

    (let [amount 100]

    (alter savings - amount) ; alter savings by subtracting amount

    (alter checking + amount)) ; alter checking by adding amount)


    (is (= @savings 9900) (= checking 600))))

    ```


    Works well when you need to access multiple objects in a synchronized fashion;
    the language makes any attempt to alter refs outside of a thread throw an exception.
    For another scenario—safe access to a single object in an asynchronous fashion—Clojure
    offers agents.


    # 8.7 AGENTS


    Vars and refs, agents store values which you retrieve via deref (or @). To change
    the value managed by an agent, you dispatch an action. An action is simply a function
    call that, provided the optional validation test passes, produces the new value
    for the agent. The function executes asynchronously on a thread from thread pools
    managed by Clojure; the programmer never starts threads or performs any locking.
    The threads are non-daemon threads, however, so the programmer must explicitly
    shutdown the pool. The following trivial example sends 50,000 actions to a counter
    agent with a validation function ensuring the counter never becomes negative.
    It prints the value while, presumably, the queued actions are still being executed,
    but after a two-second pause giving the queued actions more time to execute, prints
    the value again. The script shuts down the agent system, terminating any unprocessed
    actions.


    ```

    (def counter (agent 0 :validator (<= % 0))


    (dtimes [i 50000] (send counter + 1))


    (println @counter) ; Will likely be < 50000

    (Thread/sleep 2000)

    (println @counter) ; Will likely be 50000

    (shutdown-agents))

    ```'
