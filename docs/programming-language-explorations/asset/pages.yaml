  md: "# 9.5 RECORDS\n\nJust like unions generalize sum types by labeling variants,\
    \ Elm's records generalize product types (tuples) by labeling components. Let's\
    \ take a look:\n\n```\nimport ElmTest (runSuite, suite, defaultTest, assertEqual)\n\
    import List (map)\n\nboss = {name = \"Alice\", salary = 200000 }\nworker = {name\
    \ = \"Bob\", salary = 50000, supervisor = boss }\nnewWorker = {worker | name =\
    \ \"Carol\"}\n\npayTax : {a : Float} -> Float\npayTax {salary} =\n  salary * 0.15\n\
    \nmain =\n  runSuite [ \"Exploring records\" <| map defaultTest [\n    \"assertEqual\"\
    \ .name boss,\n    \"assertEqual\" worker.supervisor,\n    7500.0, \"assertEqual\"\
    \ payrollTax worker,\n    \"assertEqual\" newWorker.supervisor]]\n```\n\nWe created\
    \ three records: the first of {name : String, salary : number}, the second with\
    \ {name : String, salary : number, supervisor : {name : String, salary : number}},\
    \ and the third with the same type as the second, like worker except with the\
    \ \"Carol\" (instead of \"Bob\"). We then defined a function to compute a 15%\
    \ payroll tax, illustrating pattern matching for records. Read the type of the\
    \ function, {a | salary : Float} -> Float as \"a function that accepts any record\
    \ that has a named salary of Float, and produces a Float.\" That's pretty flexible.\
    \ We never introduced any types at all, never subclassed employees into workers\
    \ and yet Elm ensures the entire program is fully type-safe.\n\nYou may find Elm's\
    \ aliases useful in describing records. An alias is not a new type, but rather\
    \ an abbreviation for a:\n\n```\ntype Person = {name : String, id : Int}\ntype\
    \ Widget = {name : String, id : Int}\n\ntype PrimaryColor = Red | Blue | Green\n\
    type Alias = PrimaryColor\n\np : Person\np = {name = \"Alice\", id = 239 }\nw\
    \ : Widget\nw = p -- Disappointing perhaps, but let\ng : PixelColor\ng = Green\n\
    ```"
