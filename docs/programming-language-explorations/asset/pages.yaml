    \ b == c {\n        print(\"\\(a), \\(b), \\(c)\")\n      }\n    }\n  }\n}\n```\n\
    \nSwift uses ... for inclusive ranges and .. for ranges exclusive at the upper\
    \ end. String interpolation uses \\(). The function print comes from the standard\
    \ library which need not be explicitly imported.\n\nOur second traditional script,\
    \ Heap's algorithm for string permutations, illustrates a fair number of Swift\
    \ features and idioms:\n\nimport Foundation\n\n```\nfunc generatePermutations(of\
    \ a: inout [Character], upTo n: Int) {\n  if n == 0 {\n    print(String(a))\n\
    \  } else {\n    for i in 0..<n {\n      generatePermutations(of: &a, upTo: n-1)\n\
    \      swap(&a[n % 2 == 0 ? i], &a[n])\n    }\n    generatePermutations(of: &a,\
    \ upTo: n-1)\n  }\n}\n```\n\n```\nif Process.arguments.count != 2 {\n  puts(\"\
    Exactly one argument is required\\n\", _stderr)\n  exit(1)\n}\nlet word = Process.arguments[1]\n\
    var charArray = Array(word.characters)\ngeneratePermutations(of: charArray, upTo:\
    \ charArray.count-1)\n```\n\nSwift is statically typed. In Go, we must specify\
    \ parameter types, but local variables can usually be inferred. We introduce variables\
    \ with var and immutable ones with let. For parameters, the modifier inout means\
    \ that the parameter is referenced in the passed argument, which we mark with\
    \ the &. In function declaration, parameters can be given both a local name (inside\
    \ the function) and an external name, used to make readable function calls. Accessing\
    \ standard error requires a bit of work: Swift is more often used for interactive\
    \ applications, so it's no real surprise that support for command line applications\
    \ looks a little \"different.\""
