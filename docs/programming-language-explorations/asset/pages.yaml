  md: 'Our animal system has three classes and one class-specific method. But we can
    imagine extending our project with both new kinds of animals—dogs, perhaps—or
    new kinds of functionality, such as producing an emoji character. See Figure 8.5.
    The **expression problem** refers to the situation in some languages where extending
    a system in one direction is easy but extending in the other requires touching
    code. Languages with classes clearly have no trouble extending a system with new
    classes; Clojure is no exception:


    # Add a new class


    ```

