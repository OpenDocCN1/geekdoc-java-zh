  md: "# Go ■ 231\n\nGo and Erlang share a bit of concurrent programming philosophy:\
    \ they do not generally rely on shared memory and locks. The concurrent execution\
    \ units called processes in Erlang and goroutines in Go, are just functions, with\
    \ their own local variables, which communicate with other via message passing.\
    \ Implementations of both languages support tens of concurrent processes or goroutines.\
    \ While Erlang's processes send messages by naming the receiving process, Go's\
    \ goroutines communicate via channels.\n\nLet's start with a (literal) hello world\
    \ example. We will create a channel that can send and receive strings. We'll launch\
    \ a goroutine that writes \"Hello world\" to the channel. The main goroutine will\
    \ read the channel and print the value received:\n\n```\nimport \"fmt\"\n\nfunc\
    \ Example() {\n\tch := make(chan string)\n\tgo func() {\n\t\tch <- \"Hello, world\"\
    \n\t\tfmt.Println(ch)\n\t}// Output: Hello, world\n}\n```\n\nHere we see that\
    \ goroutines are launched by prefixing the go keyword to a function call; (e.g.\
    \ the type chan string can send and receive strings only); channels are created\
    \ with make; ch <- x writes x to channel ch; the expression <-ch reads from channel\
    \ ch. Two more facts about channel communication are essential to know:\n\n+ \
    \  - Channels created with make(chan T) are synchronous. A sender will block until\
    \ a receiver is ready to consume a message; and conversely, a receiver will block\
    \ until a sender sends a message.\n\n+   - In Erlang, when the main goroutine\
    \ finishes, the application finishes, even if other goroutines are still running.\n\
    \nLet's dial up the complexity ever so slightly. Here's a famous example in which\
    \ two goroutines sum each half of an array—note the use of a slice parameter here\
    \ to avoid copying the entire array—and write their half-sums to a channel. The\
    \ main goroutine reads the half-sums from the channel, adds them, and prints the\
    \ result:\n\n```\nimport \"fmt\"\n\nfunc sum(a []int, ch chan<- int) {\n\tresult\
    \ := 0\n\tfor _, value := range a {\n\t\tresult += value\n\t}\n\tch <- result\n\
    }\n```\n\n> ⁹The saying in Go is: \"Don't communicate by sharing memory, share\
    \ memory by communicating.\" [36]"
