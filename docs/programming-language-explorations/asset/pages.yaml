    \ body illustrates element access for a tuple *t: t.0, t.1, t.2*.\n\nTo extract\
    \ words from a line, we use `enumerateSubstrings` from a string extension in the\
    \ **Framework**. The method takes a range (rather than a string), from an enumeration\
