  md: "# 128 Programming Language Explorations\n\n```\ninterface Drawable {\n  void\
    \ outline(Color color);\n  void fill(Color color);\n  default void render(Color\
    \ outlineColor, Color fillColor) {\n    fill(fillColor);\n    outline(outlineColor);\n\
    \  }\n}\n```\n\nJava restricts extension to at most a single superclass, though\
    \ it allows classes to implement any number of interfaces. Restricting extension\
    \ to a single superclass nicely prevents a class from inheriting two or more (instance)\
    \ fields with the same name and type, or two or more methods with the same name\
    \ and different signatures—a situation known as multiple inheritance. A wise move,\
    \ perhaps, multiple inheritance leads to questions. Are both fields inherited\
    \ or only the first one? Are both methods inherited? or only one? If so, is there\
    \ a method resolution order, as we saw in Python?\n\nBut Java allows the implementation\
    \ of multiple interfaces. Does this lead to multiple inheritance with all of its\
    \ requirements for disambiguation? Let's see. Given:\n\n```\ninterface A {\n \
    \ int X = 1; // implicitly public static final\n  default void f() {} // implicitly\
    \ public\n}\n\ninterface B {\n  int X = 2; // implicitly public static final\n\
    \  default void f() {} // implicitly public\n}\n```\n\nCan we define the class\n\
    class C implements A, B {\n\nJava prohibits this class definition with the compile\
    \ time error\nclass C inherits unrelated defaults for types A and B\n\nJava simply\
    \ does not allow multiple inheritance at all.\nAn interface with exactly one abstract\
    \ method is called a functional interface. Java\nprovides nice syntactic sugar\
    \ for instances of classes that implement a functional interface:\nYou can define\
    \ interfaces directly without ever specifying the implementing class!\n\n```\n\
    @FunctionalInterface\ninterface Function {\n  double apply(double x);\n}\n```"
