  md: "The built-in function spawn(module, function, args) creates a process to run\
    \ module: function(args) asynchronously, immediately returning the pid of this\
    \ new process. We pass to each of the prime checking processes, at construction,\
    \ the pid of the printer. Each prime checker checks the printer number to print\
    \ prime, and false if composite. We construct the printer process with the pid\
    \ of the main process, so the printer can send a message to main after handling\
    \ each case. main waits for 999 messages from the printer before finishing.\n\n\
    The prime checkers are interesting in their own right, as we have an opportunity\
    \ to illustrate recursion.\n\n```\n-module(prime_checker).\n-export([is_prime/2]).\n\
    ```\n\n```\nis_prime(N, Observer) ->\n  fun Check(D) ->\n    if\n      D * D >\
    \ N % No more divisors\n        Observer ! N;\n      N D == 0 -> % Composite\n\
    \        Observer ! false;\n      true -> % Keep looking\n        Check(D+1)\n\
    \    end\n  end(2).\n```\n\nThe prime checking function illustrates the typical\
    \ implementation of \"loops\" with tail recursion. Check possible divisors from\
    \ 2...N, notifying an observing process of our value (if prime) or an indication\
    \ of non-primeness(false). Our printing process repeats integers to standard output,\
    \ notifying its observer whether or not it printed a value.\n\n```\n-module(printer).\n\
    -export([print_server/1]).\n```\n\n```\nprint_server(Observer) ->\n  receive\n\
    \    N when is_integer(N) ->\n      io:format(\"-p\", [N]);\n      Observer !\
    \ true;\n    ->\n      Observer ! false\n  end,\n  print_server(Observer).\n```\n\
    \nDon't rely on the order in which processes will finish: one run of this script\
    \ began: 23 179 181 191 193 197 31 71 73 217 223 227 229 239 241 43 251 61 257\
    \ 263 269 271 277 281 282 79 101 103 83 289 307 311 313 317 107 109 33 5 7 13\
    \ 17 19 113 2 ... and other runs just as scrambled.\n\n> ⁴We're not very picky\
    \ about which messages are being sent; cleaning this code is a good exercise for\
    \ the reader, as is research additional, more idiomatic ways to wait for a group\
    \ of processes to finish!\n\n> ⁵Because the closed-over inner function Check is\
    \ recursive, we had to give it a name."
