  md: '# 246 Programming Language Explorations


    rather than just code points. For example, the Swift literal \u{301} is formed
    from the two code points U+0078 (LATIN SMALL LETTER E) and U+0301 (COMBINING ACUTE
    ACCENT), in which sequence represents a character. Swift also knows that Unicode
    has provided a precomposed character for this combination, namely U+00E9 (LATIN
    SMALL LETTER E WITH ACUTE) and will equate the precomposed character with the
    two-code point sequence:


    ```

    // e with acute accent

    let s1 = "\u{301}" // + combining acute accent

    let s2 = "\ue9" // // the precomposed character

    assert(s1.characters.count == 1) // Swift combines to count

    assert(s1 == s2) // == compares the character


    // x in a circle

    let s = "\u20dd" // + combining circle

    assert(s.characters.count == 1) // one actual character

    assert(s.utf8.count == 2) // 00 78 20 DD

    assert(s.utf8.count == 4) // 78 E2 83 9D

    ```


    Interestingly, none of these types are primitive built-in. They are defined in
    the standard library with well over hundred other types. All types belong to one
    of six kinds:


    +   * Structures, with value semantics;

    * Classes, with reference semantics;

    * Enumerations, Swift''s sum type, also with value semantics;

    * Protocols, sets of requirements adopted by structures, classes, and enumerations;

    * Tuple types, Swift''s product type;

    * Function types, containing the parameter and return types for functions.


    Under value semantics, assignment and argument passing act as if they create copies,
    while under reference semantics, this act as if takes place:


    ```

    struct S {var x = 0} // structs have value semantics

    var s1 = S(); // create an *instance* of type S

    var s2 = s1; // copy, by value

    s1.x = 5 // mutate through s1

    assert(s2.x == 0) // // s2 unchanged


    class C {var x = 0} // classes have value semantics

    var c1 = C(); // create an *instance* of type C

    var c2 = c1; // reference copy

    c1.x = 5 // mutate through c1

    assert(c2.x == 5) // // c2 sees change

    ```


    The numeric types, Bool, Character, and String are all structures. So are are:


    +   * [T], Arrays of elements of type T;

    * Set<T>, elements of type T; and

    * [K:V], dictionaries with key K and value type V.'
