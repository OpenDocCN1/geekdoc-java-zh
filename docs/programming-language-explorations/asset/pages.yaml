    Lua (as version 5.3) has 25 operators across 12 precedence levels. From highest
    to lowest precedence, they are:


    | Operator | Associativity | Description |

    |---|---|---|

    | not # | R | exponentiation |

    | | L | logical negation, length, numeric negation, bit complement |

    | * // % | L | multiplication, division, floor division, modulo |

    | + | L | addition, subtraction |

    | - | R | concatenation |

    | << >> | L | left shift, right shift |

    | & | L | bit and |

    | | | L | bit xor |

    | <= == | L | bit or |

    | < >= | L | comparison operators |

    | - = > | L | (short-circuit) return first operand if falsy, else second |

    | or | L | (short-circuit) return first operand if truthy, else second


    There are a few differences from JavaScript. Lua adds an exponentiation operator,
    a length operator, and uses different operators for string concatenation and negation.
    This means Lua avoids the classic surprise in which "The answer is " + y returns
    an "answer" of 22 when x and y have a numeric value of 2. Lua does not have a
    conditional operator (e.g., ?:), nor any assignment operator! Assignment in Lua
    is a statement, not an expression. This might be a good thing: Assignment has
    side-effects, and its appearance in the middle of an expression may be confused
    (by some) with an equality test.


    In an assignment statement such as x, y = 0 we have a list on the left and an
    expression list on the right. An expression list isn''t an actual object, nor
    is it tuple. It''s simply a list of expressions that can be evaluated and assigned
    to the variables on the left side. "Extra" expressions on the right are ignored;
    extra names on the left become nil. Expression lists also allow in function return
    statements, since a function may return multiple values:


    > Floor division applies the floor operator to the quotient: 5 // 2 = 2 but 5
    / 2 = 2.5.'
