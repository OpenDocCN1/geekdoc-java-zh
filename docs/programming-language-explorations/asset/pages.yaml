  md: "# Programming Language Explorations\n\nClojure in that it generates expressions\
    \ objects, but Closure's generated code looks exactly like the code you'd write\
    \ yourself. Clojure is a homoiconic language.\n\nAs in Julia, a macro accepts\
    \ unvaluated expressions, performs some computations, and evaluates the result\
    \ of these computations. Three classic examples can come to mind here. The first\
    \ \"evaluates\" is an expression written in infix form:\n\n```\n```clojure\n(defmacro\
    \ eval-infix [form]\n (list (second form) (first form) (second (rest form))))\n\
    \n(use 'clojure.test)\n(is (= (eval-infix (20 * 7)) 140)\\macroexpand 'eval-infix\
    \ (20 * 7)) (* 20))))\n```\n```\n\nBecause macros do not evaluate arguments before\
    \ the call, invoking eval-infix (20 * 7) passes a 3-list to the macro. The macro\
    \ returns a three-element list, specifically (* 20), which is immediately evaluated\
    \ to produce 140. The macroexpand function will show you the results produced\
    \ by the macro without evaluation.\n\nThe second popular example, highlights the\
    \ use of macros to \"extend the syntax\" of the language. We define a new form,\
    \ called unless:\n\n```\n```clojure\n(defmacro unless [condition this]\n (list\
    \ 'if (list 'not condition) this that))\n\n(use 'clojure.test)\n(is (= (unless\
    \ (< 1 2) 10) 7))\n(is (= (unless (< 2 1) 10) 10))\n(is (= (macroexpand 'unless\
    \ (< 1 2) 10)) (if (not (< 1 2)) 10))))\n```\n```\n\nWe can write this macro,\
    \ using the syntax (:):\n\n```\n```clojure\n(defmacro unless [condition this]\n\
    \ (if (not condition) -this -that))\n```\n```\n\nThe syntax is similar to the\
    \ regular quote except that (1) symbols inside syntax quotes are fully-qualified,\
    \ e.g. unless 1 2 3), and (2) we can unquote syntax quoted forms. Unquoting simply\
    \ tells Clojure to evaluate forms inside of a quote form. The use of syntax quoting\
    \ tends to produce more readable macros, constructing the resulting forms from\
    \ patterns rather than complex pieces together.\n\nThe third popular example comes\
    \ from the Clojure core library—the or macro. Closure's or evaluates from left-to-right,\
    \ returning the first value encountered, or where no truth operates, returning\
    \ the last argument or nil if no wants. This means the expression (or false \"\
    hello\" (/ 1 0)) \"hello\", without evaluating the fourth argument.2 Here's the\
    \ code:\n\n> Right here we have several answers to why do we have macros? We can't\
    \ easily write circuit-or as a function since evaluate their arguments before\
    \ a call. Granted we could explicitly pass in quoted forms and invoke eval, but\
    \ such a mechanism does not integrate nicely with the rest of the language."
