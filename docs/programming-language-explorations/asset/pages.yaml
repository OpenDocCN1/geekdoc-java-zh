  md: '# 11.4 SLICES


    So we can build a dynamic collection of structs wired together with pointers.
    But what about dynamic arrays? If an array''s length is part of its type (i.e.,
    [10]int), how can we write a function that accepts an integer array of any size?
    Go''s notion of the array-of-any-size is a slice. A slice is a range of elements
    from an underlying physical array.


    Figure 11.3 shows array a and slices s = a[2:8] and t = a[6:9]. We form slices
    with the inclusive start index of the array and the exclusive end index. The slices
    contain (1) a pointer to the starting element, (2) the number of elements in the
    slice, len, and (3) the capacity of the slice, cap, derived from the length of
    the underlying array.6


    | s | a |

    |---|---|

    | len 6 | 0 |

    | cap 8 | 1 |

    | type int | 2 |

    | | 3 |

    | | 4 |

    | | 5 |

    | t len 3 | 6 |

    | cap 4 | 7 |

    | | 8 |

    | type int | [10]int |


    Figure 11.3 Go Slices


    Because slices contain pointers, they share storage with the underlying array
    and a slices that happen to overlap. For example, in Figure 11.3, s[4], t[0] and
    a[6] are aliases of each other.7 And like a pointer, a slice can have the value
    nil. A nil slice has zero length and zero capacity...and is the zero value of
    slice variables.


    In practice, we generally construct slices via literals or the built-in function
    make. Evaluating the slice literal []int, 1, 2, 3, 5, 8, 13] builds a 7-element
    array and a slice that covers the entire array (a slice of length 7 and capacity
    7). Evaluating make([]int, 5, 8) creates an 8-element array and a slice of length
    5 and capacity 8 overlaying indices 0 through 4 of array. You can also write make([]T,
    n) to make a new slice whose length and capacity are n. And as you''d probably
    expect, make will initialize the slice elements to their zero value.


    You can add elements to the end of a slice with the built-in append, which will
    continue to use the underlying array if the capacity exists, otherwise a new array
    will be allocated and the elements copied prior to appending. If you''d like to
    copy elements between slices, use the built-in copy function.


    This is a lot to take in, we''ll provide an annotated example to clear out this
    section.


    > 6The capacity is the length of the underlying array minus the start index of
    the slice plus.

    7 Go shares slice syntax in Python, including the shorthands a[:n] and a[k:n]
    for a[k:len(a)].'
