  md: "# 9.4 TAGGED UNIONS\n\nYou've undoubtedly run across situations in which values\
    \ of a type looked different: responses to a query could be successful (with an\
    \ answer or an error code); trees can be empty or nonempty; users can be logged\
    \ in (with credentials) or anonymous; shapes can be circles or rectangles; entities\
    \ in a program representation could be numbers, identifiers, or operators. Java,\
    \ Python, Ruby and other models simulate these situations using Elm uses types\
    \ in which the variants in the sum are each labeled, or tagged. In the literature,\
    \ you'll see these types called tagged unions, discriminated sums, and disjoint\
    \ sums.\n\nWe'll explore via examples. First we see how to define a type node\
    \ and what the tags play the role of constructor functions:\n\n```\nimport ElmTest\
    \ exposing (runSuite, suite, defaultTest, assertEqual)\n\ntype Response a\n  =\
    \ Ok a\n  | Error String\n\nsquareRoot : number -> Response number\nsquareRoot\
    \ x =\n  if x < 0 then Error \"negative\" else Ok (sqrt x)\n\nmain =\n  runSuite\
    \ <| \"Demonstrate Response tagged union\"\n    [ defaultTest <| squareRoot 9\
    \ `assertEqual` Ok 3\n    , defaultTest <| squareRoot 100.0 `assertEqual` Ok 10.0\n\
    \    , defaultTest <| squareRoot -4 `assertEqual` Error \"negative\"\n    ]\n\
    ```\n\nNext, we build a tree type and show that functions processing unions use\
    \ pattern matching on the variants. Our trees are either empty, a node containing\
    \ a value and a list of trees as its children.\n\n```\nimport List exposing (map,\
    \ sum, foldr)\nimport ElmTest exposing (runSuite, suite, defaultTest, assertEqual)\n\
    \ntype Tree a\n  = Empty\n  | Node a (List (Tree a))\n\nsize : Tree a -> Int\n\
    size t =\n  case t of\n    Empty -> 0\n    Node _ children ->\n      1 + (sum\
    \ <| map size children)\n```"
