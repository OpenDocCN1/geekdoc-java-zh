  md: "Decorators give us nice solution to cross-cutting concerns such as logging,\
    \ transaction maintenance in databases, persistence, authentication, and so on.\
    \ These concerns are called “cross-cutting” because one does not organize a system\
    \ around authenticated vs. persistent objects; instead these concerns can apply\
    \ anywhere. You will often see Python code with decorators as @persistent, @transactional,\
    \ and @authenticated. Here's yet another. It's well known that the naive application\
    \ of the definition\n\n```\nF(n) = \\begin{cases} n & n \\le 1 \\ F(n-1) + F(n-2)\
    \ & \\text{otherwise} \\end{cases}\n```\n\nleads to horrific performance: computing\
    \ F(40) results in 331,160,281 calls to the function. Over 40 trillion calls are\
    \ needed for F(50), and a septillion (10^{21}) calls for F(100). The problem is\
    \ that many calls are repeated, as we can see from the evaluation:\n\n```\nF(40)\
    \ = F(39) + F(38)\\n(F(38) + F(37)) + F(38)\n```\n\nAs F(38) is called twice,\
    \ we should record its value after the first call and then simply reuse this value\
    \ rather than making the repeated call twice. This trick of reusing results, known\
    \ as memoization, is also applied to F(37), F(36), and so on, reducing the number\
    \ of calls from over 331 million to 41.\n\nPerforming memoization within the fib\
    \ function would violate the separation of concerns principle, so we write a decorator:\n\
    \n```\n@memoized(f):\n    cache = {}\ndef wrapper(*args):\n    if args in cache:\n\
    \        return cache[args]\n    cache[args] = f(*args)\n    return cache[args]\n\
    return wrapper\n\n@memoized\ndef fib(n):\n    return n if n <= 1 else fib(n-1)\
    \ + fib(n-2)\n\nprint(fib(100))\n```\n\nPython decorators can also be parameterized,\
    \ constructed with a class syntax (any __call__ method becomes a decorator) and\
    \ even applied to classes and methods. We'll leave to explore these additional\
    \ forms on your own.\n\n# 4.8 PYTHON WRAP UP\n\nIn this chapter we were introduced\
    \ to Python. We learned that:\n\n+   - Python is a mature, general-purpose language\
    \ popular in scripting, web frameworks, and data science. It was created and is\
    \ still overseen by Guido van Rossum."
