  md: "# Programming Language Explorations\n\nThere are a few similarities with the\
    \ Lua code (the use of special methods for one), but a few differences. Perhaps\
    \ the most significant is that Python does not require explicit metam or prototypes.\
    \ An object's attribute comes from its class and all of the class's ancestors.\
    \ We say Python therefore classical inheritance, JavaScript, CoffeeScript, and\
    \ Lua feature prototypal inheritance. We encourage you to compare and contrast\
    \ the Python and Lua solutions in detail over as many dimensions as you discover.\n\
    \n# 4.6 ITERATORS AND GENERATORS\n\nAn iterable is an object that produces a sequence\
    \ of values. Tuples, lists, dictionaries, and objects of other built-in types\
    \ are iterables. They can be used for statements and a number of built-in functions,\
    \ including min, max, sum, all, filter, sorted, and zip.\n\n```\nfor x in (1,2,3):\
    \ print(x)      # elements of a tuple\nfor x in [1,2,3]: print(x)            \
    \  # elements of a list\nfor x in {1,2,3}: print(x)              # elements of\
    \ a set\nfor c in 'hello': print(c)             # characters of a string\n```\n\
    \n```\nfor k in {'x':1, 'y':2, 'z':3}:\n    print(k)                         \
    \  # keys of a dict\n```\n\n```\nwith open('colors') as f:\n    for line in f:\n\
    \        print(line.strip())                # lines of a file\n```\n\nWhen you\
    \ need to iterate an iterable, it applies the built-in function to iterate, producing\
    \ (via a call to the iterable's __iter__ method—remember Table 4.1?) an iterator.\
    \ The iterator's __next__ method yields the next element of the sequence or raises\
    \ a StopIteration exception when no elements remain. This means you define your\
    \ own iterable:\n\n```\nclass OneTwoThree:\n    def __iter__(self):\n        value\
    \ = 0\n        class OneTwoThreeIterator:\n            def __next__(self):\n \
    \               nonlocal value\n                value += 1\n                if\
    \ value > 3:\n                    raise StopIteration()\n                return\
    \ value\n        return OneTwoThreeIterator()\n```\n\n```\nx = OneTwoThree()\n\
    for i in x:\n    print(i)                           # prints 1 then 2 then 3\n\
    ```"
