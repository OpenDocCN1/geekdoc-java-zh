  md: '# Additional Languages ■ 299


    First appeared 2003

    Designers Slava Pestov

    Notable versions 0.97 (2014)

    Recognized for Flexibility, Large standard library

    Notable uses Optimization technique research

    Tags Stack-based, Concatenative


    In Factor, as other stack-based languages, each operation takes its implicit operands
    from a stack. Stack arithmetic has a postfix flow:


    ```

    9 * 7 + 2 + 13 neg /

    ```


    Operators generate push. Operators pop values, compute then push results:


    +   1. Push 9, Stack = (9)

    2. Push 7, Stack = (97)

    3. Pop operands, push product, Stack = (63)

    4. Push 2, Stack = (62)

    5. Add, Stack = (65)

    6. Push 13, Stack = (65 13)

    7. Negate, Stack = (63 -13)

    8. Divide, Stack = (-5)


    The stack can hold code blocks, too, as in:


    ```

    3 [ "Hello, world" print ]

    ```


    Developers and students of computer science will do to study stack-based execution.
    There is a long history of virtual machines using stack execution, including the
    very popular Java Virtual Machine (JVM).


    # 13.9 ESOTERIC LANGUAGES


    No tour of programming languages should omit the ever-growing family of esoteric
    languages, with members such as Okl!, Malbolge, Befunge, LOLCODE, Shakespeare,
    Chef, Chicken, Whitespace, and GOTO++. You won''t see any of these powering real-world
    applications; instead, their designers work outside the box to produce artistic,
    crazy, funny, themed (we''ll see LOLCODE momentarily), weird, or insightful creations
    that may push the boundaries of minimalistic computing models, look at computing
    in a whole new way, or simply amuse.


    # Brain**k


    Brain**k is one of the better known of the esoteric languages and one of the earliest.
    Urban Müller''s creation grew out of an effort to design a Turing-complete programming
    language implementable with the smallest possible compiler (296 bytes at the time,
    with smaller compilers created since).


    > Formally, as powerful as a Turing Machine; informally, capable of doing anything
    a Python can do assuming infinite memory.'
