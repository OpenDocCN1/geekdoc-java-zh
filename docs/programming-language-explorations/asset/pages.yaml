    scripting language embedded into a web browser. The syntax of the language was
    strongly influenced by C, with curly braces, assignment statements, and the ubiquitous
    *if*, *while*, and *for* statements. Semantically, JavaScript and C are worlds
    apart. JavaScript''s influence here was the lesser-known Scheme. Functions are
    **first-class values**: they can be assigned to variables, passed to functions,
    and returned from functions.


