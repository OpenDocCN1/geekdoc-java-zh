    # ParaSail


    ParaSail, or Parallel Specification and Implementation Language, is “a new parallel
    programming language designed to support the development of inherently safe and
    secure, highly parallel applications that can be mapped to multicore, manycore,
    heterogeneous, or distributed architectures.” [116] The language has a familiar
    syntax and traditional object-oriented associates as classes, interfaces, and
    parameterized modules. Safety features are designed into the language itself and
    enforced by the compiler; there are no pointers, global variables, parameter aliasing,
    exceptions, or explicit locking.


    First appeared 2009

    Designed by Tucker Taft

    Notable versions 4.7 (2013) • 5.2 (2014) • 6.3 (2015)

    Recognized for Parallel processing, Compile-time enforcement of safe parallelism

    Notable uses Parallel processing for multicore processors

    Tags Safe, Static, Parallel


    # Chapel


    Chapel, developed at Cray Inc. and originating as part of DARPA’s High Productivity
    Computing Systems (HPCS) program, aims to improve the programmability of parallel
    computers. It is strongly influenced by classical languages such as (High-Performance)
    Fortran, C, and C++ with associated libraries, which have the look and feel of
    more modern, expressive languages like Python. An important design goal was to
    make the language expressive enough to formulate parallel tasks without the need
    to drop into a library. Architecturally, writes Brad Chamberlain, Chapel’s principal
    engineer, “Chapel supports parallelism (‘These things run concurrently’) from
    locality (‘This should be placed here; that should be placed over’). This is in
    sharp contrast to conventional approaches that conflate the two concepts or ignore
    locality altogether.” [18]


    First appeared 2009

    Designed by Cray Inc.

    Notable versions 1.7 (2013) • 1.13 (2016)

    Recognized for Separation of parallelism and locality

    Notable uses High Performance Computing

    Tags Parallel, Portable, Scalable


    # Elixir


    Elixir was created by José Valim in 2012. Running on the Erlang virtual machine
    (EVM), with all of Erlang’s process capabilities, but with a syntax influenced
    by Ruby. It uses Erlang powerful metaprogramming facilities, with hygienic macros
    (operating on abstract syntax in Julia and Closure), protocols, and reducers.
    You’ll also find working with strings to be much nicer than in Erlang (recall
    those lists of integers), and enjoy the | operator we use in Elm. The Ruby-style
    syntax makes the authoring of domain-specific languages within Elixir quite pleasant.'
