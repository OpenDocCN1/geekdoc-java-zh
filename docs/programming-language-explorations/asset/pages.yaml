    of a language more than that of implementing it. The implementation itself exposes
    you to a new number of questions: how do you, for example, manage thousands of
    lightweight concurrent processes on a machine that, well, doesn''t look very parallel?
    Implementation also increases your understanding of virtual and real machines,
    and the need to manage resources wisely.'
