    Swift errors represent recoverable situations; throwing and catching them serve
    as syntactic sugar for making result objects. Errors must belong to a type conforming
    to the protocol ErrorProtocol. Functions that may throw errors—known as throwing
    functions—must declare this by placing the keyword throws (see second and third
    in the example) above its parameter list. Calls to throwing functions must be
    marked with try. Catch errors in a do-catch statement. Swift propagates any uncaught
    errors to the surrounding scope.


    In addition to catching or propagating errors, you "convert an error to an optional"
    by invoking, for some throwing function f, try f(), producing the (wrapped) result
    of the call, if any, or nil if the function.


    # 12.4 OPERATORS


    Just as Swift does not bake in its basic types but defines them as regular functions
    within the library, the standard library defines a rich set of operators, including
    the prefix operators ! (logical), - (bitwise not), + (unary plus), and - (unary
    negation). The binary operators, from highest to lowest precedence:


    | Operator | Prec | Assoc | Description |

    |---|---|---|---|

    | << | 160 | | left shift, right shift |

    | * / % | 150 | L | multiply, divide, remainder, multiply with overflow, bit-and
    |

    | + - &+ - & | | 140 | L | add, subtract, add with overflow, bit-or, bit-xor |

    | . < . | 135 | None | half-open range, closed range |

    | is as? as? | 132 | L | type check, cast, as optional, unwrap cast |

    | ! | None | R | less, less or equal, greater, greater or equal, equal, not equal,
    identical, not identical, pattern match |

    | < > == != != | 130 | None | |

    | && | 120 | L | (short-circuit) logical and |

    | || | 110 | L | (short-circuit) logical or |

    | ?: | 100 | R | conditional |

    | * = /= += -= <= >= | 90 | R | assignment |


