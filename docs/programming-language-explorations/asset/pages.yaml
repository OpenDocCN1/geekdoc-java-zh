    # 6.3.5 Covariance, Contravariance, and Invariance


    We''ve seen subtype-subtype relationships among simple, nonparameterized types,
    for example Int64 <: Number (i., a 64-bit integer is a number). But what about
    parameterized, union, and types? Can we say anything about their subtype-supertype
    status based on the types of their components? For example, how are Set{Int64}
    and Set{Number} related, if at all? First, terminology:


    +   * If Set{Int64} <: Set{Number}, sets would be covariant

    * If Set{Number} <: Set{Int64}, sets would be contravariant

    * If neither holds, sets would be invariant

    * If both hold, sets would be bivariant


    It turns out that Julia Julia, sets invariant. Why are they not covariant? If
    they were, we would be able to declare a variable with declared type "set of animals"
    and assign it to a value of "set of dogs". Since a dog is declared as a set of
    animals, it would appear to be a add to a cat. But the underlying value of the
    variable is a set of dogs, which cannot hold a cat. Invariance avoids this pitfalls.


    Tuples, on the other hand, are covariant:


    ```

    t = (3, "hello")

    @assert typeof(t) == Tuple{Int64, ASCIIString}

    @assert isinstance(t, Tuple{Real, ASCIIString>)

    @assert isinstance(t, Tuple{Integer, AbstractString>)

    @assert isinstance(t, Tuple{Number, Any})

    @assert Tuple{Symbol, Float16, Union{}} <: Tuple{Any, Real, Any}

    ```


    The previous problem with sets does not arise because tuples are immutable.


