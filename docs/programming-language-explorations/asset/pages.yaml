    +   - Concurrency-related statements: go to launch a goroutine, to send a value
    to a channel, and select, for coordinating sends and receives. We''ll cover concurrency
    in Section 11.7.


    The designers miss a while statement? Not at all. Look at what the **for** statement
    can do:


    +   - `for {body}` — executes body “forever.”

    - `for condition {body}` — executes body while condition is true.

    - `for init; condition; after {body}` functions as the classic for-statement in
    Java, JavaScript, and the C family of languages.

    - `for x := range e {body}` iterates through the indices of array, slice, string
    e; or through the keys of map, or the elements of receive channel.

    - `for i, x := range e {body}` iterates with the index and value (or key, for
    maps) of array, slice, map or e. Use `_` for the index to iterate only with the
    values.


    Any statement may be labelled, also to be referenced by a **break**, **continue**,
    or **goto**. We seen break and continue before, but what if a goto? *The Go Programming
    Language Specification states*: “A goto statement transfers control to the statement
    with the corresponding label within the same function” and furthermore prohibits
    the transfer of control causing any variables to come into scope that are not
    already in scope at the point of the goto.” [30] In other words, a goto must''t
    leave its jump over the declaration of any new variables.


    So can''t we use **goto** to transfer control to **anywhere**. Long ago, in other
    languages, we could, and did. This prompted Dijkstra to, in his famous 1968 letter,
    *Go To Statement Considered Harmful*:


    > For many years I have been familiar with the observation that the quality of
    programmers is a decreasing function of the density of **goto** statements in
    the programs they produce. More recently I discovered that the use of the **goto**
    to statement has such disastrous effects, and I became convinced that the **goto**
    to statement should be abolished from all ‘higher level’ programming languages
    (i.e. everything except, perhaps, main code).


    > ...The goto to statement as it is too punitive; it is too much an invitation
    to make a mess of one’s program. One can regard and appreciate the clauses caused
    by brittling its use. [25]


    **Bridling** unrestricted control flow means that program flow should be expressed
    wholly in terms of high level structured statements as **if** and **for** (the
    genesis of the **structured programming**), and permits the limited control through
    **break** and continue. Dijkstra''s word was influential: goto statements are
    not quite rare, and languages that permit them to tend place significant restrictions
    on their use.


    This concludes our brief coverage of the basics. We now turn to some of the characteristic
    features of the language, beginning with new: pointers.


