  md: "# 64 Programming Language Explorations\n\n![](img/2cd8452ff5a372a7459559ad1d0834e4_82_0.png)\n\
    \nFigure 4.1 Python variables and objects\n\nIf you know something about computer\
    \ architecture, you might worry that dealing with integers (and floats and booleans\
    \ and similar things) as objects might be painfully slow. They are dynamically\
    \ allocated at runtime? Are they accessed via an indirect memory lookup? Maybe,\
    \ but not necessarily so. Because these values are immutable, an implementation\
    \ is free to implement them efficiently, as long as it returns a uniquely identifying\
    \ value from the built-in id function. By treating everything as objects at the\
    \ conceptual level, Python makes the programmer's mental model of values a bit\
    \ simpler!\n\nDIFFERENCE #5: Python types have subtypes and subtypes. JavaScript,\
    \ CoffeeScript, and Lua require the programmer to set up prototype chains to simulate\
    \ IS-A relationships between types. Python models this relationship directly;\
    \ simply state the supertype(s) in the class definition:\n\n```\nclass Animal:\n\
    \    def __init__(self, name):\n        self.name = name\n    def speak(self):\n\
    \        return '{} says {}'.format(self.name, self.sound())\n\nclass Cow(Animal):\n\
    \    def sound(self):\n        return 'moooo'\n\nclass Horse(Animal):\n    def\
    \ sound(self):\n        return 'neigh'\n\nclass Sheep(Animal):\n    def sound(self):\n\
    \        return 'baaaa'\n```"
