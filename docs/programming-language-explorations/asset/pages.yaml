  md: '# Erlang ■ 205


    do, and not littered with error-checking if er or case catch exceptions. We are
    told to

    “Let it crash”.


    The “Let it crash” philosophy says that error detection and recovery take place
    outside the

    process, after a crash. In Erlang, we link processes together; when one process
    in

    group of linked processes crashes, it sends an exit signal to all the others.
    By default

    this will cause the linked processes to exit as well, but a process may declare
    its intent

    to trap exit signals. In this case the monitoring process will get the exit reason
    from

    crashed process, and may then take corrective action, including restarting the

    rocess! Here are some possible reasons:


    +   - If the processes run all, the exit reason is the atom normal. This is not
    a crash.

    - If an error occurs, the exit reason is a tuple {r,s}. r is either (1) an atom
    such as

    badagar, bad_function, clause_if, undef, noproc, or (2) a tuple such as

    {badmatch, V} or {case_clause, V} where V is the value that did not match).

    s is the stack trace from the beginning of the process to the exit location.

    - The process can terminate itself by calling exit(r), where r is any type. The
    exit

    reason is the term.


    Let''s go over a simple case of monitoring and recovering after a crash. We

    have a number of minesweepers (Erlang processes) that work trying to clear minefields

    ocasionally fail–blow up. Each mineseper is launched by a process that traps

    it signals and establishes a link to the mineseper. When the sweeper dies, the

    launcher receives an exit message in its mailbox, together with the exit reason.
    The launcher

    will announce the sweeper and then launch a new sweeper. Here is the code:


    ```

    % First line ignored when running with script

    sweep(42) ->

    io:format("BAM-%n")

    exit(destroyed) ->

    sweep(_) ->

    io:format(".")

    timer:sleep(10),

    sweep(rand:uniform(100)).

    launch() ->

    process_flag(trap_exit, true),

    receive ->

    start ->

    register(sweeper, spawn_link(fun () -> sweep(0) end));

    {''EXIT'', From, Reason} ->

    io:format("Sweeper -p, starting new one-n", [From, Reason])

    self() ! start

    end,

    launch().

    ```


    ¹ A stack trace, or traceback, is a list of representations of the active frames
    in the current process, useful

    in debugging.'
