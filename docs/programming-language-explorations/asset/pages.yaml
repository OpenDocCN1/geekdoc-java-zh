  md: "# 236 Programming Language Explorations\n\nThe customer loops until ten meals\
    \ have been consumed. Each loop begins by placing a new order. We place the order\
    \ in a select statement with a seven second time out. Each order will contain\
    \ the customer's personal channel for receiving prepared meals. During each iteration\
    \ the customer either eats a meal or gives up on placing the order. After eating\
    \ all the meals, the customer reports being finished, and the deferred operation\
    \ notifies the wait group.\n\n```\npackage main\n\nimport (\n    \"sync\"\n  \
    \  \"time\"\n)\n\nfunc Customer(name string, wg *sync.WaitGroup) {\n    defer\
    \ wg.Done()\n    ch := make(chan *Order)\n    for mealsE := 0; mealsE < 10; {\n\
    \        select {\n        case Orders <- &Order{food: \"soup\", customer: name,\
    \ reply: ch}:\n            meal := <-ch\n            do(name, \"eating \" + meal.food\
    \ + \" prepared by \" + \n                meal.preparedBy, 10E9)\n           \
    \ mealsE += 1\n        case <-time.After(time.Second * 7):\n            do(name,\
    \ \"waiting too long, going shopping\", 5E9)\n        }\n    }\n    report(name,\
    \ \"going home\")\n}\n```\n\nAdmittedly, that a customer will give up if unable\
    \ to place an order in a given amount of time but will happily wait forever for\
    \ a meal to be prepared may not be the best model of reality, but it keeps the\
    \ example simpler than it would have been otherwise, leaving while a meal is being\
    \ prepared would force us to deal with throwing prepared meals (e.g., draining\
    \ channels).\n\nWe managed to introduce many of the concurrency primitives available\
    \ in Go, and looked at a few different usage patterns. Clearly we scratched the\
    \ surface. A next step in your study of Go might be to write a server capable\
    \ of dispatching goroutines to work on behalf of clients. Web servers, chat servers,\
    \ search servers, and load balancers are all quite fine to write in Go.\n\nOne\
    \ final note: while high-level communication between goroutines via channels will\
    \ make up the majority of your concurrent programs' architectures, there are times\
    \ when a channel is overkill and simple lock, condition variable, or atomic counter\
    \ is best. Go’s sync/atomic packages will likely have what you need. A few end-of-chapter\
    \ exercises will give you scenarios to employ a few of these objects."
