  md: '# ORGANIZATION


    In order become proficient in multiple languages, you must learn fundamental language
    concepts. Conversely, mastering concepts requires that you learn multiple languages.
    While both directions of influence are important, we''ve chosen to proceed language-by-language,
    rather than concept-by-concept, so as to convey each language''s unique style
    and familiar ones. As we present each chapter, we will introduce new concepts
    as they appear, and revisit their implementation from languages we''ve seen in
    previous chapters. Our goal is to present and explain theoretical concepts of
    language design and usage, illustrated in the context of practical language overviews.


    After the obligatory introductory chapter outlining the book''s goals and objectives,
    we present 12 chapters covering 12 languages. We introduce each with a common
    trio of example programs, take a brief tour of its basic elements, and touch on
    its type system, functional forms, scoping rules, concurrency patterns, and sometimes,
    metaprogramming facilities.


    We''ve carefully chosen the order of languages to make a story out of the book.
    With JavaScript because it is extremely popular and full of interesting features,
    including first-class functions, prototypes, and promises. It has influenced hundreds
    of successors, including our second language, CoffeeScript.


    The next three chapters, Lua, Python, and Ruby, are general-scripting languages.
    They are followed by Julia, whose treatment of dynamic polymorphism over generic
    functions and multimethods contrasts with Ruby''s classes.


    We then take a look at Java, a popular language in the enterprise computing space,
    and our statically-typed language. Java was introduced with the Java platform,
    which includes a virtual machine and a very extensive set of libraries for just
    computing task imaginable. Hundreds of languages are targeted to this platform,
    including our next language, Closure. Closure will introduce us to a mostly-functional
    view of the world, with persistent data structures and software transactional
    memory. Next is Elm, which like Java, is typically typed, but with an incredibly
    powerful inference mechanism. We continue with Erlang, a functional language like
    Elm, specifically designed for building large-scale, highly reliable systems.


    Our last two require a bit of memory management knowledge on the part of the programmer.
    First we visit Go, a language with explicit pointers, and Erlang, with highly
    concurrent and distributed applications in mind. We close with Swift, which exemplifies
    many of the modern trends in programming design—it is static, safe, and expressive—and
    introduces us to a different model of garbage collection (reference counting)
    than all of our previous languages.


    Each chapter ends with a summary, pointers to open source projects featuring the
    language, references to materials for further study, and a collection of exercises,
    designed for explorations. We''ve added the exercises to motivate you to find
    the language''s online playground or downloadable installation, and to try out
    interesting snippets of code—and muse on what they say about language. Occasionally
    we''ll suggest that you write many substantial scripts, research various aspects
    of the language not covered in the chapter proper, or ask you to do some comparisons
    between languages.


    Following our twelve featured chapters, we provide a brief tour of a couple or
    additional languages, and a summary chapter bringing together many of the questions
    explored throughout the text.'
  merge: -1
