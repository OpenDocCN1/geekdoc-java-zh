  md: "# 168 Programming Language Explorations\n\nWe'll spend time with advanced types\
    \ as tagged unions and a particularly interesting record type with some new syntax\
    \ for its associated operations. We'll close with an overview of subscriptions\
    \ and their role in interactive programs.\n\n# 9.1 HELLO ELM\n\nLet's get right\
    \ to the traditional first program:\n\n```\nimport Html exposing (text, ul, li)\n\
    import List exposing (map, concatMap, filterMap, repeat)\n\nmain =\n  [..40] |\
    \ concatMap (\\c ->\n    [..c-1] | concatMap (\\b ->\n      [..b-1] | filterMap\
    \ (\\a ->\n        if a*b==c then Just (a,b) else Nothing)))\n    | map (toString\
    \ >>) >> repeat 1 >> li []))\n  | ul\n```\n\nThere are no for-loops in Elm (nor\
    \ statements that matter), so we generate right-triangles via mapping and filtering.\
    \ Rather than writing standard output, we build an HTML unordered list to display\
    \ in a web browser.\n\nDespite its size, this little program highlights quite\
    \ a few areas that benefit from some explanation:\n\n+   - Function application\
    \ does not require parentheses, so f x means f(x). Unlike JavaScript, Elm's application\
    \ is left-associative, so f x y means f(x)(y).\n\n+   - x | f means f(x). Similarly,\
    \ x | f | l | g | h means h(g(f(x)).\n\n+   - Anonymous functions employ a backpack\
    \ and a thin arrow, so x \\ e denotes the function with parameter x and body e.\n\
    \n+   - g >> f is the function that allows q then f, i.e., (g >> f) means f(g).\n\
    \n+   - concatMap maps a list-producing function over a list, and keeps only the\
    \ (\"Just\") values. Elm's optional are *maybes*. If-expressions always have both\
    \ then and else parts, so we have to combine with filtering in order to get the\
    \ appropriate types.\n\n+   - The ul and li produce HTML <ul> and <li>. Functions\
