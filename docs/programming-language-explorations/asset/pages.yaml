  md: "# 250 Programming Language Explorations\n\n```\nlet h: Animal = Horse(name:\
    \ \"CJ\")\nassert(h.speak()) == \"CJ says neigh\"\nlet c: Animal = Cow(name: \"\
    Bessie\")\nassert(c.speak()) == \"Bessie says mooo\"\nassert(Sheep(name: \"Little\
