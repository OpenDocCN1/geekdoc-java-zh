  md: "process.stdin is a file stream representing standard input. In Node, streams\
    \ are event emitters stdin fires a line event when a line is ready to read, and\
    \ a close event when there is no more data to read. We call the on method on the\
    \ reader to register the callback to invoke the event fires.\n\nNode.js comes\
    \ with a number of built-in modules that can event emitters, such as stream, fs\
    \ (for file system), networking, and http. Events are fired at all the expected\
    \ times: when streams files are opened or closed, when data from a file, stream,\
    \ socket becomes ready, or upon timeouts or errors.\n\nAs an alternative to asynchronous\
    \ functions that take callbacks as parameters, you can write functions that return\
    \ promises. A JavaScript promise is built from the Promise constructor of the\
    \ standard library with a single argument, called the executor. The executor has\
    \ two parameters, resolve and reject, running asynchronously, eventually calling\
    \ resolve to indicate failure. You can build a series of asynchronous calls by\
    \ chaining promises with then (to capture successful resolutions) and catch (to\
    \ capture rejections). The following example simulates a chain of three long running\
    \ (three seconds each) asynchronous tasks. For simplicity, we illustrate potential\
    \ 'failure' only for the first\n\n```\nfunction initialize(configuration) {\n\
    \  console.log('Initializing ' + configuration);\n  return new Promise(resolve,\
    \ reject) => {\n    if (configuration) {\n      reject('Empty configuration');\n\
    \    } else {\n      setTimeout(() => resolve('the initialized data'), 3000);\n\
    \    }\n  };\n}\n\nfunction process(initialData) {\n  console.log('Processing\
    \ ' + initialData);\n  return new Promise(resolve, reject) => {\n    setTimeout(()\
    \ => resolve('the processed data'), 3000);\n  };\n}\n\nfunction report(output)\
    \ {\n  console.log('Reporting ' + output);\n  return new Promise(resolve, reject)\
    \ => {\n    setTimeout(() => resolve('the reported data'), 3000);\n  };\n}\n\n\
    initialize('the configuration data')\n  .then(text => process(text))\n  .then(value\
    \ => console.log('Success: ' + value))\n  .catch(reason => console.log('Error:\
    \ ' + reason));\n```"
