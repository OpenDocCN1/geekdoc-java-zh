  md: '# Swift ■ 265


    +   - Memory is not allocated (for example, pointer is null, memory has been deallocated
    previously).


    +   - Memory is allocated, but [the] value has not been initialized.


    +   - Memory is allocated and [the] value is initialized.


    Obviously, we require great discipline in using these unsafe features. Managing
    memory is itself hard, but indeed error-prone, is generally expected of programmers
    who write drivers, operating systems, and the virtual machines (on which our high-level
    languages run). Low-level languages, like assembly and the venerable C programming
    language, are entirely unmanaged: strings and arrays are simple things that require
    the programmer to perform manual allocation and deallocation of memory. To read
    files the programmer must manually allocate chunks of just the right size.


    But just as C free most programmers from having to drop into assembly language,
    modern languages free many systems programmers from dropping into C++ [133] features
    constructors and destructors which the programmer can encapsulate memory allocation
    and deallocation where, though does not have to prevent memory leaks. The [105]
    language is also unmanaged but uses concepts such as ownership and borrowing of
    pointers to eliminate nearly all memory leaks. Swift has a data type for automatically
    referenced pointers, which Swift, as we''ve seen here, applies ARC throughout.
    These modern languages lose a little bit of flexibility and a bit of performance
    when compared to C, but they gain a great deal in terms of safety and expressiveness.


    # 12.9 SWIFT WRAP UP


    In this chapter we looked at Swift. We learned that:


    +   - Apple freed Swift in 2014 with iOS applications in mind, though the language
    is modern, comprehensive, and general-purpose.


    +   - Swift is known for its safety features. It checks types at compile time,
    ensures that all variables are initialized before use, manages memory with ARC,
    and provides let declarations to prohibit reassignment of a variable to make the
    variable''s object immutable. Integer arithmetic does not "wrap around" by default.
    Types, other than optional, do not include nil values.


    +   - Though statically typed, Swift uses type inference, but not as extensively
    as possible—function parameters, for one, require explicit annotations.


    +   - Swift''s treatment of characters has both local (used inside the function)
    and external (used in calls) names.


    +   - Functions are considered a type of closure. There are two syntactic forms
    for anonymous closures, {$0 * $0} and {x in x * x}.


    +   - Rather than being wired into the language, the “basic types”—numbers, strings,
    characters, booleans—are defined as structures in the standard library. The same
    is true for operators, which are defined as old functions.'
