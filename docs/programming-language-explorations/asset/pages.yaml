  md: "# 134 Programming Language Explorations\n\n+   * o.orElse(y) returns x present\
    \ and y otherwise.\n* o.filter(p) returns o present and p(x) true; it returns\
    \ an empty optional.\n* o.map(f) returns f(x) wrapped if, and an empty optional.\n\
    * o.flatMap(f) returns itself; we'll have this one for the exercises.\n\nLet's\
    \ get a feel for these methods with a small example:\n\n```\nimport java.util.Optional;\n\
    public class OptionalDemo {\n    public static void main(String[] args) {\n  \
    \      Person alice = new Person(\"Alice\");\n        Person bob = new Person(\"\
    Bob\");\n\n        bob.get().isPresent(p -> { assert alice == alice});\n     \
    \   alice.get().isPresent(p -> { assert false;});\n        assert alice.get().orElse(bob)\
    \ == bob;\n        assert bob.get().orElse(alice) == alice;\n\n        Optional<Person>\
    \ b = bob.get();\n        assert b.filter(p -> p.getName().startsWith(\"A\"))\
    \ == b;\n        assert b.filter(p -> p.getName().startsWith(\"B\")).isPresent();\n\
    \        assert b.map(p -> p.getName()).orElse(\"Alice\").equals(\"Alice\");\n\
    \        assert alice.get().map(p -> p.getName()).orElse(\"Alice\").equals(\"\
    Alice\");\n    }\n}\n```\n\nFor reference, the methods of the class Optional<>\
    \ (excluding overrides from superclasses) follow this. In relatively small code,\
    \ we see both upper and lower wildcards, as well as a few functional interfaces¹⁰\n\
    \n```\nstatic Optional<T> empty()\nstatic Optional<T> of(T value)\nstatic Optional<T>\
    \ ofNullable(T value)\nT get()\nboolean isPresent()\nvoid ifPresent(Consumer<?\
    \ super T> consumer)\nOptional<T> filter(Predicate<? super T> predicate)\nOptional<U>\
    \ Optional<U> map(Function<? super T, ? extends U> mapper)\nOptional<U> Optional<U>\
    \ flatMap(Function<? super T, Optional<U>> mapper)\nT orElse(T other)\nT orElseGet(Supplier<?\
    \ extends T> other)\n<X extends Throwable> X throw(Supplier<? extends X> excSupplier)\n\
    ```\n\nIn this section, we've briefly sketched the surface of the world of Java\
    \ generics. We've not had space to cover unbounded wildcards, reification, or\
    \ capture. To continue exploring this area of the Java language, visit the Generics\
    \ in the Java Tutorial [91] or Angelica Langer's Generics FAQ [74]. And stayed\
    \ for further discussion of generics in the book we cover with Rust.\n\n> ¹⁰Briefly,\
    \ the functional interfaces are: Consumer<T>, a function on T returning nothing;\
    \ Predicate<T>, a function from T to bool; Function<T,U>, a function from T to\
