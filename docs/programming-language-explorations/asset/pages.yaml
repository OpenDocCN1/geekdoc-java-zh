  md: "Let's take a brief look at lower bounded generics, with a trivial example.\
    \ We can add sheep to sets of sheep, sets of animals, or even sets of objects:\n\
    \n```\nimport java.util.Set;\nimport java.util.HashSet;\n\npublic class SheepAdder\
    \ {\n    public static void main(String[] args) {\n        Set<? super Sheep>\
    \ s1 = new HashSet<Object>();\n        Set<? super Sheep> s2 = new HashSet<Animal>\\\
    n        Set<? super Sheep> s3 = new HashSet<Sheep>();\n        Sheep sheep =\
    \ new Sheep(\"Rafe\");\n        s1.add(sheep);\n        s2.add(sheep);\n     \
    \   s3.add(sheep);\n    }\n}\n```\n\nWildcards cannot be used to instantiate objects;\
    \ however, bounded type parameters exist for this purpose. Bounded type parameters\
    \ can only have upper bounds. We'll illustrate their usage with an example:\n\n\
    ```\nimport java.util.List;\nimport java.util.Arrays;\n\npublic class MinMax<C\
    \ extends Comparable<C>> {\n    private C min;\n    private C max;\n    public\
    \ MinMax(C x, C y) {\n        min = x.compareTo(y) < 0 ? x : y;\n        max =\
    \ x.compareTo(y) > 0 ? x : y;\n    }\n    public C getMin() {return min;}\n  \
    \  public C getMax() {return max;}\n}\n```\n\nNote that both fields have the type\
    \ C, restricted to classes implementing interface Comparable. Only by using the\
    \ same type variable for fields could we state that both fields have the same\
    \ type. A wildcard cannot express this constraint.\n\nWhy not null values exist?\
    \ Null expresses the absence of a value. Considering a person with a required\
    \ name, but optional bonus. We could type the name and bound fields\n\n> Comparable's\
    \ sole method compareTo should be implemented as follows: return a negative integer\
    \ from x.compareTo(y) if x < y, if x = y, and a positive integer if x > y."
