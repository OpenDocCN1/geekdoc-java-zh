  md: 'None of the identifiers have type annotations, but Elm can infer them. How?
    Roughly, we proceed as follows:


    +   1. Working from left-to-right, we start by assigning type variables: x gets
    type α, s gets β, and therefore mystery gets α → β → γ.

    2. We know the type of repeat is Int -> String -> String, so the type of round
    (sqrt x) must be Int.

    3. We know the type of round is Float -> Int, so the type of sqrt must be Float.

    4. We know type of sqrt is Float -> Float, so the type of x must be Float. Since
    we had previously assigned the variable α to x we can now unify α and Float.

    5. The second argument of repeat (s) must be a string, we unify β with String.

    6. Because repeat produces a string, we unify γ with String.

    7. Therefore, the type of mystery is Float -> String -> String.


    Let''s look at a more interesting case:


    ```

    mystery (x, y) z =

    (y / 2.0, [x, x, x])

    ```


    Here we begin by mapping the type variable α to x, β to y, γ to z, and thus (α,β)
    → δ to mystery. We know the type of division (/) in case y has type Float and
    unify with Float. We can''t get any information for x or z, but we can determine
    the return type of the function: (Float, List α). While it is custom to use Greek
    letters for type variables when choosing inference, Elm sticks to lowercase letters
    for its variables, and reports the type of mystery as (a, Float) -> b -> (Float,
    b, List a).


    Generally, type variables are unified with any type, but Elm has special type
    variables that unify only with particular types:


    +   - append, which unifies only with Int and Float, to support functions as (+),
    (-), and (*);

    - comparable, which unifies only with Int, Float, Char, String, tuple types containing
    comparables, and list types containing comparables, to support (<), (<=), (>),
    (>=), min, max, and compare;

    - appendable, which unifies only with String, and list types, to support.


    Examples of these special types from Elm''s package include:


    ```

    -- From Basics

    (:) -> comparable comparable -> Bool

    abs : number -> number

    (++) : appendable appendable -> appendable

    ```


    > In this case unification appears to be simple instantiation of a type variable
    with a concrete type; however, in complex cases, we might discover two distinct
    type variables refer to the same name, and need to be "unified" into one.


    > Though strangely, a fourth variable, compound, arises inherently when checking
    expressions that must both be comparable and appendable. You may see it "leaked"
    into your own when the compiler tells you it has inferred the type of f in x y
    = if (x < y) then (x ++ y) else (x ++ x) to be compound -> compound; however,
    the compiler will not respect your use of this variable. You will carry out further
    explorations in the exercises.'
