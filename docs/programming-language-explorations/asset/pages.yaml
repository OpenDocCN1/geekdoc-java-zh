    continue, retry, throw, return, yield) for changing the "normal" control flow.


    Many languages provide a means for throwing or raising an exception when something
    has gone wrong, and a means to catch, or handle, then exceptions. Languages without
    an exception facility often have a means to allow certain operations to return
    two values, indicating success or failure, and for the expected value on success.
    You may encounter option values, where the value is tagged with an indication
    of it being a proper value or an error (or missing) value.


    Modern languages support the notion of programming-in-large via modules or packages,
    which encapsulate strongly related entities of a library or application. The programmer
    may export some of the entities to the rest of the program, leaving the others
    to the module. Languages may import (sometimes load or require) entities from
    other modules. Often, not always, modules correspond to files.


