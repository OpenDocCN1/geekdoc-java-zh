    assert result is 80

    ```


    Similarly, arguments are passed by value, extra arguments are ignored, and extra
    parameters start off undefined. It''s also possible to specify a default value
    for a parameter when no corresponding argument is supplied:


    ```

    f = (x, y=1, z=0) -> x * y + z


    assert = require ''assert''

    assert f(2) is 2 # 2*1+0 = 2

    assert f(3, 5) is 15 # 3*5+0 = 15

    assert f(2, 8, 1) is 17 # 2*8+1 = 17

    ```


