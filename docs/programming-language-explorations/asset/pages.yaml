    # PREREQUISITES


    **This book is not for beginning programmers.** We''re assuming you know at least
    two languages perfectly well, You should know the basic concepts surrounding variables,
    expressions, operators, functions, and basic data structures, and have experience
    writing nontrivial applications—this book is a tour, not a tutorial. We will be
    covering many interesting (and often powerful) features, and purposely to do with
    code that is **often dense**, and sometimes **cryptic**, even when presenting
    unfamiliar paradigms for the first time. Be on the lookout for new concepts that
    are introduced within the code examples themselves, rather than in the surrounding
    text.


    You should also know your way around your file system and be skilled in using
    a command interface to create and delete files, manage directories, and launch
    programs. You should also be pretty good with a text editor. Finally, you should
    be able to find and install software as needed to build and run the examples,
    and use a REPL or playground to practice.


    # SUPPLEMENTARY MATERIAL


    All of the code from the book, with tests that show how to run the examples, can
    be found in the online repository at https://github.com/rtoal/ple. We''ve also
    included notes in the repository for installing and working with the languages
    featured in the text, since this information changes frequently to be mentioned
    in print. The repository also contains additional code of interest, which will
    grow and be updated as the programming languages evolve. Errata, additional exercises,
    and bonus material can be found at the companion website at http://rtoal.github.io/ple/.'
