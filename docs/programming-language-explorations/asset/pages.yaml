  md: '# Programming Language Explorations


    +   - Like Lua and JavaScript, Java has primitive and reference types, though
    conversion between the two autoboxing and unboxing is not difficult.


    +   - A Java class can extend only one class but implement multiple interfaces.


    +   - Interfaces can contain only constants or methods. Interface methods can
    be abstract, static, or default. Language rules prevent confusion or ambiguity
    surrounding multiple inheritance.


    +   - Interestingly, Java arrays are covariant but collections (from the standard
    library) are invariant.


    +   - Because of static typing, the language features generic types and methods,
    allowing parameterization by type. Parameters sometimes require wildcards to enable
    certain operations to work on objects that can be parameterized by any type, or
    any type family.


    +   - Java null belongs to every reference type, so programmers often use optionals
    from the standard library to get around the "billion dollar mistake."


    +   - Java uses threads for concurrency, and provides a large set of in-language
    and standard library for synchronization and thread management.


    +   - Java''s rich metaprogramming features include support for introspection
    and code generation. While indispensable in frameworks and libraries, typical
    applications use these techniques rarely.


    Continue your study of Java beyond the introductory material of this chapter,
    you may wish to find and research the following:


    +   - Language features not covered in this chapter. Packages, serialization,
    processes, volatiles, checked vs. unchecked exceptions, scoping details, type
    erasure and reification, native members, and static initializers, nested classes,
    enumerations, annotations, and classloaders.


    +   - Open source projects using Java. Studying, and contributing to, open source
    projects is an excellent way to improve your proficiency in any language. You
    may enjoy the following projects written in Java: Elasticsearch (https://github.com/elastic/elasticsearch),
    Retrofit (https://github.com/square/retrofit), Spring Framework (https://github.com/spring-projects/spring-framework),
    and Guava (https://github.com/google/guava).


    +   - Reference manuals, tutorials, and books. Both Java and the Java Virtual
    Machine are defined in specifications found at docs.oracle.com/java/specs/; Oracle''s
    Java Tutorials at https://docs.oracle.com/java/tutorial/ are quite complete. Regarding
    standard libraries, note that multiple Java Platforms exist, including the Standard
    Edition, the Enterprise Edition, and a Micro Edition, each with navigable online
    documentation. Online resources for learning the language and exploring advanced
    features are plentiful and perhaps numerous to mention.


    # EXERCISES


    Now it''s your turn. Continue exploring Java with the activities and research
    questions below, and feel free to branch out on your own.'
