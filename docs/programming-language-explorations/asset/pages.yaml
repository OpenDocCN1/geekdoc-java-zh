    # 14.2 WHERE TO GO NEXT


    We hope you are able to use this book''s exploration of various programming language
    concepts and to further your academic and professional development along multiple
    directions. We offer three roads for you to take here:


    +   **Professional Practice.** We hope you will discover, and be able to employ,
    a wide variety of programming styles. Style tends to be informed by language,
    but not tied to any particular language. Cristina Lopes provides an excellent
    and comprehensive account of 37 programming styles, and their implementation,
    in [76].


    +   **Formal Syntax and Semantics.** Our observations have potentially informal.
    But research in the field of programming languages is ongoing and intense. We
    hope many readers will go to discover and work on formal (mathematically rigorous
    and unambiguous) mechanisms for defining languages. Your ability to read and write
    formal syntax (e.g., EBNF, ABNF) and semantics (e.g., Denotational, Operational,
