    # 13.10 ASSEMBLY LANGUAGES


    An assembly language describes a machine''s execution, with commands that map

    one-to-one to machine instructions. Even if you use only high-level languages,
    something\about machines—of the past, and future—may be relevant to you. Uncle

    Bob tells us why: [79]


    Did you know, for example, that the ++ operator in C, C++, Java, and C#nderived
    from the fact that there were special registers in early computers that

