  md: "# APL\n\nKenneth Iverson's work on a mathematical notation to manipulate arrays\
    \ culminated in a 1962 publication at Harvard called A Programming Language. By\
    \ 1964 by IBM, Iverson adapted this notation into a programming language, APL.\n\
    \n| First appeared 1962\nDesigners Kenneth Iverson\nRecognized for Arrays, conciseness,\
    \ symbolic alphabet\nNotable uses Finance, Scientific research\nTags Array-based,\
    \ Dynamic |\n\nFew languages can match APL for conciseness. APL programs are expressions\
    \ in which operators are (successively) applied to arrays. APL features dozens\
    \ of operators, which often have different meanings when used in a unary (monadic)⁷\
    \ versus binary (dyadic) context. We can get a feel for array processing in the\
    \ famous expression for producing an array of prime numbers less than or equal\
    \ to R:\n\n```\n(~ R ∈ R × R)/R ← 1↓R\n```\n\nFor concreteness, R is 8. In APL,\
    \ all operators associate to the right, so we first evaluate it⁸ which produces\
    \ [1 2 3 4 5 6 7 8]. We apply the binary (↓) operator to remove one element from\
    \ the front, resulting in [2 3 4 5 6 7 8]. We then assign (←) this to R. On the\
    \ left side of the compress operator (/), we have Ro × R which builds a two-dimensional\
    \ array containing the outer product, or multiplication table, of R with itself:\n\
    \n| 4 6 8 10 12 14 16 |\n| 6 9 12 15 18 21 24 |\n| 8 12 16 20 24 28 32 |\n| 10\
    \ 15 20 25 30 36 40 |\n| 12 18 24 30 36 42 48 |\n| 14 21 28 35 42 49 56 |\n| 16\
    \ 24 32 40 48 56 64 |\n\nNext we apply ∈ to R and this table, producing the array\
    \ containing 1 for each element of R in the table and 0 where not, resulting in\
    \ [0 0 1 0 1 0].⁸ Applying the ~ (not) operator over each element [1 1 0 1 0].\
    \ Now we apply the compression operator which selects those elements of the right\
    \ operand having a 1 in the left:\n\n```\n1 1 0 1 0 0\n↓ ↓ ↓ ↓ ↓\n2 3 4 5 6 7\
    \ 8\n↓ ↓ ↓\n2 3 5\n↓\n 7\n```\n\nThe prime numbers up to 8 are thus: [2 3 5 7].\n\
    \n> ⁷Don't confuse APL's use of the term monadic with Haskell; the two meanings\
    \ are wholly distinct.\n⁸Read this result as saying that the values 2.8. Only\
    \ 4, 6, and 8 were found in the table."
