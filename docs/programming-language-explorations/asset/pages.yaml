    \ =\n  ({x = 0, y = 0, image = \"js\"}, Cmd.none)\n\nsubscriptions : Model ->\
    \ Sub Msg\nsubscriptions model =\n  Sub.batch\n    [ Mouse.moves {x, y} -> MoveTo\
