  md: '# Afterword


    Hello again! If you''ve made it this far, you''ve been introduced to programming
    language practice through chapter-length overviews and brief glances at dozen
    more. The intent was not to provide a comprehensive tutorial for any of the languages,
    but rather to use the overviews as a vehicle to introduce important *concepts*
    of programming language design and practice. Our treatment was non-mathematical
    and introductory; for an in-depth study and coverage of the theoretical foundations
    that will enable you to design the languages of the future, we recommend the works
    by Turbak [119], Pierce [97], and Harper [49].


    Let''s take a look at where we''ve been and where you can go.


    # 14.1 WHERE WE''VE BEEN


    The primary takeaway from this book is: The study of multiple languages frees
    us from getting stuck on particular approaches to solving particular problems,
    making us question how things can be different, and...better.


    # 14.1 Functions


    Take the well-known function, for example. What could be simpler to understand
    passing arguments to a function and waiting for the result to be computed? Quite
    a lot, it turns out! Knowing a handful of languages enables us to ask any reasonable
    questions:


    +   1. Must a function be called with a specific number of arguments? If we pass
    too few arguments? Too many? Can we roll up many arguments into a single parameter?

    2. Can we (or we must, or we not) specify the names of the parameters in the call?

    3. Can we arrange that certain parameters accept only arguments of specific types?

    4. Can we change the value of a parameter within the function? If so, does this
    action also change the variable holding the argument (if any)? If it does, is
    the change made immediately or only at the point the function returns?'
