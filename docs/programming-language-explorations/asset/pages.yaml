  md: '# Programming Language Explorations


    +   - Python has a large number of built-in types, including many different numeric
    types and a dozen collection types.


    +   - Python has no primitives. All values are objects. All objects have an id
    and a type. Types are objects.


    +   - New types are created by defining a class. (Contrast this with JavaScript
    and Coffee, where the class keyword defines a function.)


    +   - Classes, as well as types in Python, are objects. (Contrast this with JavaScript,
    CoffeeScript, and Lua, where the type of an object produces the name of the type
    as a string.)


    +   - Types in Python can have supertypes and subtypes. Paths through the chain
    of super-subtype relations are used in attribute lookup. Subtypes inherit attributes
    from their supertypes.


    +   - Because Python can have multiple types, the language enforces a linear order
    in which ancestor types must be searched to find inherited attributes. This is
    called the method resolution order, or MRO.


    +   - Python local variables are introduced by assignment in a local scope. Non-local
    variables enabling lexical scopes can be read; to write to non-locals nonlocal
    must be used.


    +   - Many standard operators and functions can be overloaded by defining methods
    in a class. These special methods have names such as __add__, __eq__, and __contains__.


    +   - Python supports delayed evaluation through iterators and generators. Generators
    can be created using a yield statement, or via generator expressions.


    +   - Decorators enable ways to enhance the behavior of functions and classes,
    without actually adding any code directly inside the function.


    To continue your study of Python beyond the introductory material of this chapter,
    you may wish to find the following:


    +   - Language features not covered in this chapter. Exceptions, packages, chained
    comparisons, set and dictionary comprehensions, a large number of built-in functions,
    the full sequence of types, the pass, del, and with statements, interactive input,
    the incredibly extensive standard library, and the massive ecosystem of third-party
    libraries and frameworks.


    +   - Open source projects using Python. Studying, and contributing to, open source
    projects is an excellent way to improve your proficiency in any language. Requests
