    # Befunge


    While an average programmer can write a Brainf** compiler without much trouble,
    self-modifying code happens is, by design, notoriously difficult. In this two-dimensional
    language,


    | First appeared 1993 |

    | Designer Chris Pressey |

    | Notable versions 93 • 98 |

    | Recognized for Being multi-dimensional |

    | Notable uses Challenge to be built-compiler writers |

    | Tags Funge, Stack-based, Self-modifying |

    |


    Befunge programs are written in a two-dimensional grid of instructions. Some instructions
    manipulate the data stack in the usual way (as In), some do input and output (from/the
    stack), and some instructions—<, >, and v change the direction in the program
    is read. Even better, or worse, the p instruction: pops from the stack three values
    y, x, and v, then replaces the character at position (x,y) in the code grid with
    v. So the grid contains both instructions and data, allowing you to change code
    on the fly.


    Here''s a factorial function in Befunge (can you see the loop?):


    ```

    &:-1:v v *:_.

    _$+:~

    ```


    The full instruction set and semantics for Befunge are available at [17], and
    you''ll be writing an interpreter to be quite possible. Compilers can and have
    been written, utilizing some very interesting techniques you wish to look into.


