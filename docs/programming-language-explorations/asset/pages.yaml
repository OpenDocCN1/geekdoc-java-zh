    \ write it after parenthesized arguments—a syntax reminiscent of Ruby. The callback\
    \ to the substring enumerator returns an optional string, which we must unwrap\
    \ before using. We' used a guard statement for this purpose; we will explain its\
    \ semantics, and alternatives to it, later in the chapter.\n\n# 12.2 THE BASICS\n\
    \nSwift is a modern language, sporting default parameters, parameter packing and\
    \ unpacking, static typing with first-class functions and closures, extensive\
    \ pattern matching and binding capabilities, option types in lieu of null references,\
    \ and generics. We'll hit basics very quickly, introducing new features and terms\
