  md: "# Programming Language Explorations\n\nThe module itertools from the standard\
    \ library includes a number of functions for constructing and manipulating generators,\
    \ including permutations, which builds a generator that produces permutations\
    \ of a sequence as tuples. Let's use this to rewrite our anagrams script from\
    \ the beginning of the chapter:\n\n```\nimport sys\nfrom itertools import permutations\n\
    \nif len(sys.argv) != 2:\n    sys.stderr.write('Exactly one argument is required\\\
    n')\n    sys.exit(1)\n\nfor word in ('.join(p) for p in permutations(sys.argv[1])):\n\
    \    print(word)\n```\n\nIf called with the string \"rat\", the call produces\
    \ a generator that delivers the tuples ('r','a','t'), ('r','t','a'), ('a','r','t')\
    \ and so on. We wrap that generator with a generator producing the (joined) string\
    \ for each tuple, iterating over the new generator with a statement to print each\
    \ string.\n\n# DECORATORS\n\nTime for some magic. We're going to change the behavior\
    \ of a function without ever rewriting its source code. In Python, functions (and\
    \ hence methods) can be decorated, allowing us to do some extra work when the\
    \ function is called. Here is one of the simplest decorators: it prints the time\
    \ the function is called as well as the duration taken by the call:\n\n```\nimport\
    \ datetime\n\ndef logged(*args, **kwargs):\n    start = datetime.datetime.now()\n\
    \    print('{{} started at {} {}'.format(f.__name__, str(start)))\n    f'{{} =={}'.format(**kwargs))\n\
    \    duration = datetime.datetime.now() - start\n    print('{{} took {} seconds}'.format(f.__name__,\
    \ duration))\n    return wrapper\n\n@logged\ndef say_hello(name):\n    print('Hellooooooooooooooo,\
    \ {} {}'.format(name))\n\nsay_hello('Alice')\n```\n\nPrefixing the definition\
    \ of say_hello with the @logged decorator is equivalent to its definition with\
    \ say_hello = logged(say_hello). The decorator syntax is not essential, but it\
    \ adds a great deal of expressiveness: all of the logging code is isolated from\
    \ the mainline code, to see at a glance (without clutter) what our application\
    \ should be doing, and knowing it will be logged."
