  md: "# 300 Programming Language Explorations\n\nFirst appeared 1993\nDesigner Urban\
    \ Müller\nRecognized for Minimalism\nNotable uses Research into small compilers\n\
    Tags Esoteric, Imperative\n\nA Brain** program is a sequence of one-character\
    \ commands operating on a infinite array of bytes (indexed from zero) and two\
    \ byte streams, standard input and output. The current memory cell is initially\
    \ the leftmost. The eight commands are:\n\n+   - Read the byte from stdin into\
    \ the current cell\n- Write the byte in the current cell to stdout\n- Move the\
    \ current cell pointer left\n- Move the current cell pointer right\n- Increment\
    \ the byte in the current cell\n- Decrement the byte in the current cell\n- [\
    \ If the byte in the current cell is zero, jump ahead the matching ]\n- If the\
    \ byte in the current cell is nonzero, jump backwards to just beyond the matching\
    \ ]\n\nThe following program:\n\n```\n++++[++++>+++++<<-]++.\n```\n\nprints the\
    \ Hi to standard output. As all cells have an initial value of zero, the program\
    \ first increases the first cell to 7, then the second to 5, then the next cells\
    \ to 2 and 3, with the fourth cell as our current:\n\n```\n7 5 2 3\n```\n\nWe\
    \ are inside a doubly-nested \"loop\" here. Our next instruction says to go back\
    \ two cells and decrement the value. If not yet zero, we will continue our inner\
    \ loop of incrementing the third and fourth cells by 2 and 3 respectively. After\
    \ this is done five times, our memory becomes:\n\n```\n7 0 10 15\n```\n\nWe are\
    \ back in an \"outer loop\" now, and we're supposed to go back one cell to the\
    \ left and decrement..we're being told to do what we did seven times. This takes\
    \ us to the following state:\n\n```\n0 0 70 105\n```\n\nWe need to move two cells\
    \ to the right, bump the value by 2 to 72, the code point for LATIN CAPITAL LETTER\
    \ H and print it with the .command. Moving one cell to the right we find, 105,\
    \ the code point of LATIN SMALL LETTER I, and we're done. \n\nYou might want to\
    \ work through the classic Hello world program, as found on [132]:\n\n```\n++++++[++++>++++++>>+++<<<<]->>++->->+[+<-]>>.\n\
    ---.++++.+.>>..<,+.+.--------,>>.++.\n```"
