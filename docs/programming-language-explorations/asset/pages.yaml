    # 13.3 THE ENTERPRISE


    An important domain targeted by some languages is the so-called enterprise, a
    term roughly meaning “a large collection of applications, custom and third-party
    libraries, and scripts for managing the mission-critical operations of a business
    or organization.” In this business world, enterprise software manages data stores,
    processes data from partner companies (often called feeds), serves customers’
    browsers and mobile applications, and generates massive amounts of usage data,
    or analytics. In other domains, enterprise software may refer to the millions
    of lines of code running sophisticated aircraft or spaceships. Regardless of the
    domain, building systems with hundreds of thousands, or millions of lines of code
    require language support for writing correct, reliable, robust, scalable, efficient
    code that is easy to maintain and extend.


