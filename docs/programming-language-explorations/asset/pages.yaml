    In this appendix, we provide a few details behind text representation and manipulation,
    concentrating on the Unicode character set.


    # ## B.1  CHARACTERS, GLYPHS, AND GRAPHEME CLUSTERS


    A **character** is a named symbol, e.g., CYRILLIC CAPITAL LETTER TSE or MUSICAL
    SYMBOL F CLEF. A **glyph** is a picture of a character. Different characters may
    share the same glyph; for example, Ø ø LATIN CAPITAL LETTER O WITH STROKE, DIAMETER
    SIGN, or EMPTY SET. Similarly, a single character can be rendered by many glyphs:
    LATIN CAPITAL LETTER A can be rendered as A, Ā, Ã.

    Acharacter set** is a particular selection of characters, each assigned a unique
    **code point**. The very popular **Unicode** character set includes several hundred
    thousand characters, with a code range of 0...114111 (although 62 of the code
    points are explicitly disallowed). It is customary to decorate the code points
    in hexadecimal, prefixed with U+. Here is a sampling of Unicode characters:


    ```

    U+002C  COMMA

    U+071d  SYRIAC LETTER YUDH

    U+13EA  CHEROKEE LETTER WE

    U+20B4  HRVNIA SIGN

    U+2248  ALMOST EQUAL TO

    U+30FE  KATAKANA VOICED ITERATION MARK

    U+AAB9  TAI VIET VOWEL AE

    U+120IF CUNEIF SIGN AK TIMES SHITA GISH

    U+1FOCE PLAYING CARD KING OF DIAMONDS

    U+1F363 STRAWBERRY

    ```


    A character with an assigned code point is called an **encoded character**, but
    it may be more than one encoded character to make up a “user-perceived” character;
    we call the encoded character sequence a **grapheme cluster** [23], which will
    often be rendered with its own glyph. Examples include:'
