    CoffeeScript expressions, types, and variables mimic their JavaScript counterparts.
    Functions do too: function values can be assigned to variables, passed as parameters
    to other functions, and even called directly without being named:


    ```

    square = (x) -> x ** 2

    squares = [[...5] -> x * 5) 16 # pass function by name

    result = ((x) -> x) # call anonymous function

    ```


    ```

    assert = require ''assert''

