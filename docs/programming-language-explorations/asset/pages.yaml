  md: "# Java 127\n\nThe version of the animal hierarchy differs dramatically from\
    \ those in previous chapters. A superclass expecting subclasses to implement a\
    \ particular method—in our case sound—must explicitly declare that method abstract.\
    \ A class extending an abstract class must either implement all abstract methods\
    \ of its superclass or declare itself abstract. None of the previous chapters\
    \ was such a declaration necessary. Were we to call the speak on a subclass in\
    \ CoffeeScript, Python, Ruby, or Java did not implement the sound method, a run-time\
    \ error would occur. In Java, such a subclass could not exist—attempting to create\
    \ a concrete subclass without overriding an abstract method generates a compile-time\
    \ error.\n\nInheritance applies to fields and methods. Subclasses do not inherit\
    \ constructors from superclasses; they can, however, refer to the superclass constructor\
    \ within their own constructors via the super keyword. A subclass that redefines\
    \ a method from a concrete subclass, or provides an implementation of an abstract\
    \ method from an abstract superclass, is said to override the method. Programmers\
    \ may use the @Override annotation to mark method overrides.\n\n# 7.3 INTERFACES\n\
    \nJava interfaces define a set of related constants and methods that provide a\
    \ contract, or application program interface (API), implementing classes must\
    \ conform to. An interface acts (very!) much like an abstract class; it defines\
    \ a new reference type, it can contain abstract methods, and cannot be instantiated.\
    \ While abstract classes can define both (non-static) fields that belong to instances\
    \ of concrete subclasses, and define non-public methods, interfaces cannot. Interfaces\
    \ are always public, and final (whether these modifiers are used or not), and\
    \ all interface methods are public abstract. Methods not marked default or static\
    \ are abstract.\n\nThe following interface defines two abstract methods:\n\n```\n\
    interface Drawable {\n    void outline(Color color);\n    void fill(Color color);\n\
    }\n```\n\nOriginally, Java interfaces could only contain abstract methods. An\
    \ interface would thus mean breaking existing classes implementing the interface.\
    \ Modern Java allows interfaces to define default methods and static methods,\
    \ both with implementations, so library maintainers can add these methods to interfaces.\
    \ Let’s add a default method to our previous interface:\n\n> While the @Override\
    \ annotation is optional, it is considered a best practice. Even without the annotation,\
    \ a method that will override will however, a typo in either the method name or\
    \ signature will result in a new method in the subclass, leading to difficult-to-debug\
    \ errors at run time. The presence of the annotation requires the compiler to\
    \ ensure the overriding method actually exists in a superclass with an \"override-equivalent\"\
    \ method signature.\n\n> Until at least all implementations were tracked down\
    \ and given their new overriding"
