  md: '# Lua 55


    +   • Lua has no conditional operator.


    +   • Lua functions can return zero or more values. There is no tuple type in
    Lua, functions can actually return multiple values.


    +   • Lua variables can have global scope or local scope. Local variables are
    introduced with the keyword `local`. Their scope begins after their declaration
    and runs until the end of the block. While this is simple, it does mean the programmer
    must take care in creating local recursive functions.


    +   • Tables are used for both classic arrays (1-based sequences of numerically
    indexed values) and dictionaries (sets of key-value pairs). Both numeric and non-indexed
    values can be mixed in a single table; this is up to the language implementation
    to keep the "array-part" access efficient.


    +   • Like JavaScript, Lua''s standard library is actually a collection of objects
    (e.g., `io`, `os`, `math`, etc.).


    +   • Aatable can be attached to a table. The metatable can customize the manner
    in which fields are read and written, and redefine the meaning of 19 of operators.
    In addition, metatables can be used to build the same prototypal inheritance mechanism
    found in JavaScript.


    +   • Lua supports coroutines: calling `coroutine.create` on a function object
    produces a coroutine (of thread). Coroutines can be yielded and resumed, and their
    status queried.


    To continue your study of Lua beyond the introductory material of this chapter,
    you may wish to find and research the following:


    +   • Language features not covered (Chunks, environment variables, garbage collection
    metethods, weak tables, the auxiliary library, standard library, and interoperability
    with C (the API).


    +   • Open source projects using Lua. Studying and contributing to open source
    projects is an excellent way to improve your proficiency in any language. Of the
    many projects using Lua, you may enjoy Luigi (https://github.com/luvit/luvit),
    LuaIT (https://github.com/corsisIT/LuaIT), termis (https://github.com/tylernorm/termis),
    and PacMac (https://github.com/tylernorm/pacmac).


    +   • Reference manuals, tutorials, and books. Lua''s home page is http://www.lua.org/.
    The Reference Manual (as of Version 5.3) is freely available at http://www.lua.org/manual/5.3/.
    A good selection of Lua books can be found at http://www.lua.org/doc.html#books.
    We recommend the most recent version of Programming in Lua by its creator, Roberto
    Iusalcu. You may also like one of the few books covering Lua''s use in Game Programming.


