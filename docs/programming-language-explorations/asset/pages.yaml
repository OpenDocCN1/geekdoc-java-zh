    # Idris


    Our last ML-influenced language is one to watch: Idris debuted in 2009 as a language
    featuring dependent types. Dependent types allow many aspects of a program’s behavior
    to be specified within the system itself. Common examples of dependent types include
    "the type of all vectors of length n", "the type of all pairs of integers in which
    the element is greater than the first," and "the type of all functions returning
    the value seven".


    +   First appeared 2009

    Designed by Edwin Brady

    Notable versions 0.10 (2016) • 0.11 (2016)

    Recognized for Dependent Types

    Notable uses Research, Mechanical Theorem Proving

    Tags Pure, Functional


    A system with dependent types allows computations to be performed within the type
    checker, at compile-time. The programmer can set guarantees that a program, when
    executed, will meet certain specifications. In fact, Idris borrows a number of
    features from interactive proof assistants such as Coq and Agda. While Idris can
    be used for proving, its development has focused on general purpose computation,
    and it is actively being developed as such today.


    Syntactically, Idris looks a great deal like Haskell, but with superficial differences
    beyond those forms required to express dependent typing. On the semantic side,
    Idris is, like Haskell, a functional language with additional machinery for managing
    side effects, using algebraic effects in addition to monads. Idris’s creator,
    Edwin Brady, describes the theory and implementation of algebraic effects, and
    the methods by which they solve various shortcomings of Haskell’s monadic approach,
    in [13].


    # 13.6 CONCURRENCY MATTERS


    Modern languages feature some concurrency support, but experienced developers
    working on mission-critical applications require a deep understanding of the principles
    of concurrent and distributed systems. This knowledge comes not only from day-to-day
    practice but also from seminal work such as Hoare’s CSP and Milner’s CCS, and
    the experimental and research languages (featuring named channels, as adopted
    by Go), SR, and Linda (supporting a unique means of process coordination through
    a “tuple space”).


    Naturally, research in concurrent and distributed systems remains extremely active.
    We’ve spent time in previous chapters on a few principles of concurrency (especially
    in our tours of Clojure, Erlang, and Go), and should note that a few languages
    in this chapter (Rust, Ada, Scala, and C# for instance) feature many capabilities
    for concurrent and distributed computing. Still, a few languages created in recent
    years are worth a brief mention.'
