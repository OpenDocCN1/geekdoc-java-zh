  md: '# 320 Programming Language Explorations


    # B.3 CHARACTER ENCODING


    A character encoding specifies the representation of code points in 4 bytes. For
    Unicode, the UTF-32 encoding presents the code point directly in 4 bytes. UTF-32
    is a fixed-length encoding every character is represented in the same number of
    bytes. The variable-length encoding UTF-16 encodes the characters U+0000 through
    U+FFFF in two bytes, and U+10000 through U+1FFFF in four bytes. The length of
    code is encoded by subtracting 0x10000 from the code point and representing the
    20-bit value $x_{19}x_{18}...x_0$ into a 32-bit word as follows:


    For example, the character U+F6A1 TRAMWAY has the UTF-16 encoding 68D3 DEA1.


    Perhaps most popular encoding scheme is the variable-length UTF-8. We spread the
    code points $x_7x_6...-x_0$ across 1-4 bytes as follows:


    | 0...7 | Encoding |

    |---|---|

    | 80..7ff | $x_7...x_0$ |

    | 800...ffff | $110x_{14}...x_{10}$ $10x_5...x_0$ |

    | 10000...1ffff | $1110x_{21}...x_{17}$ $10x_{15}...x_{11}$ $10x_6...x_0$ |


    Character counting varies between languages. Some languages explicitly count encoded
    characters; some understand and count grapheme clusters as a single character.
    Some may even count UTF-16 code units. For example, the Lebanese flag emoji:


    +   - A single grapheme cluster, or character,

    - composed of two encoded characters (U+1F1F1 U+1F1E7)

    - encoded in UTF-16 code units, and

    - encoded in 8 bytes in UTF-8.


    JavaScript''s length method on strings counts in UTF-16:


    ```

    // One that characters counts as 4

    const assert = require(''assert'');

    assert("\u{f1f1}\u{f1e7}".length == 4);

    ```


    Swift, in contrast, does understand grapheme clusters, and can provide UTF-8 and
    UTF-16 views into a string as:


    ```

    // Swift understands grapheme clusters and encodings

    let s = "\u{f1f1}\u{f1e7}"

    assert(s.characters.count == 1)

    assert(s.utf16.count == 4)

    assert(s.utf8.count == 8)

    ```'
