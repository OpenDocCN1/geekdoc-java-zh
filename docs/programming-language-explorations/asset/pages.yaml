    Interpolation The process of evaluating a string or object literal to yield a
    result in which placeholders are replaced with computed values.


    Iterator An object that provides the capability to access the elements of a container
    in some order.


    Keyword Argument An argument that is matched to a corresponding parameter using
    the parameter''s name, rather than by its position in a call.


    Lazy Evaluation An evaluation strategy for expressions in which evaluation of
    subexpressions is delayed until an actual value is needed.


    Lifetime The time between objects'' creation and destruction.


    Literal A representation of a value in source code.


    Lvalue A storage location in which values can be assigned.


    Macro A rule or pattern that specifies how an input should be mapped to a replacement
    output. Often used in the context of rewriting source code prior to compilation.


    Mailbox A container for data in which one process writes data for another process
    to read (in an asynchronous fashion).


    Match An object storing information regarding the successful location of a pattern
    in data.


    Memoization An optimization technique for repeatedly-called functions that caches
    results, and returns cached results when the inputs occur.


