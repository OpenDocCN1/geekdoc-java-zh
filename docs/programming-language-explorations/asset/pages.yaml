    \ graphics, and other computationally intensive tasks.\n\nHere is our recursing\
    \ count example in Dart:\n\n```\nimport 'dart:io';\nimport 'dart:convert';\nimport\
    \ 'dart:collection';\n\nfinal words = new SplayTreeMap<String, int>();\n\nvoid\
    \ main() {\n  stdin.transform(UTF8.decoder)\n    .transform(LineSplitter())\n\
    \    .listen(addLines, onDone: printWords);\n}\n\nvoid addLines(String data) {\n\
