  md: "# 200 Programming Language Explorations\n\ntheir own memory and cooperate with\
    \ message passing. Processes send messages asynchronously (the mailboxes of) other\
    \ processes; there are no locks. Because processes have no memory, they can crash\
    \ without leaving the system in an inconsistent state; there are no locks, no\
    \ process can wait indefinitely for a lock to be released by a crashed process.\
    \ Without locks enables the designers of Erlang, and their virtual machine, BEAM,\
    \ implement extremely lightweight processes, easy to start and shutdown, extending\
    \ tens thousands of processes—more to run concurrently.\n\nOur first look at Erlang\
    \ features two processes. The main process spawns a new process immediately waits\
    \ for a message. The spawned process eventually sends the string \"Hello\" to\
    \ the main process. The built-in spawn() returns the process identifier, or pid\
    \ of the currently executing process. The main process captures its pid into a\
    \ variable, which the spawned process uses to send the message:\n\n```\n% First\
    \ list is ignored when running with escript\nmain() ->\n Main = spawn(\n  spawn()\
    \ -> Main ! \"Hello\" end,\n  receive\n    S -> io:format(\"-s\\n\", [S])\n end.\n\
    ```\n\nThis script illustrates four basic elements of Erlang's process design:\n\
    \n+   * As p spawns q, q runs concurrently with the rest of p.\n* When p spawns\
    \ x to q (qx), p simply drops the message in q's mailbox waiting for q to receive\
    \ it.\n* Evaluating receive expression blocks until a matching message is in the\
    \ mailbox.\n* An Erlang application terminates as soon as the main process terminates,\
    \ even if hundreds of others are active; therefore, it is quite common to see\
    \ the main process end with a receive expression waiting for some kind of \"done\"\
    \ signal.\n\nOur next script illustrates this last item. It starts 1,000 processes—999\
    \ to each check whether a specific number in the range 2..1000 is prime and one\
    \ responsible for printing to standard output:3\n\n```\n% First list is ignored\
    \ when running with escript\nmain() ->\n Max = 1000,\n Printer = spawn(printer_server,\
    \ print_server, [self()]),\n lists:foreach ->\n fun (N) ->\n spawn(prime_checker,\
    \ is_prime, [N, Printer])\n end,\n  lists:seq(2, Max),\n  wait(Max-1).\nwait()\
    \ -> io:format(\"-n\\n\");\nwait(N) -> receive _ -> wait(N-1) end.\n```\n\n> Prime\
    \ finding is a fun exploration of concurrency, but in practice, more appropriate\
    \ sequential solutions exist for this task. This particular solution is es naive\
    \ and inefficient."
