    \ The run type aliases uint32.\n* Numeric types with implementation-specific sizes:\
    \ int, and uintptr, designed to correspond to the underlying machine's size and\
    \ address bits. These do not have any other type.\n* The string, for sequences\
    \ of bytes: The operation len(s) produces the byte length, not the character length.\
    \ The byte sequence of s representing will generally be a UTF-8 byte sequence,\
