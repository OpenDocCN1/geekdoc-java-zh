    Io


    Steve Dekorte''s Io is another simple, "pure" language, whose programs consist
    entirely of objects sending messages. Dekorte created Io in 2002 "to refocus on
    expressiveness by exploring higher level dynamic programming features with greater
    levels of runtime flexibility and simplified programming syntax and semantics.
    [114]


    +   **First appeared** 2002

    **Designers** Steve Dekorte

    **Recognized** for Simplicity of design

    **Notable uses** Exploratory software development

    **Tags** Prototypal


    Like JavaScript and Lua, Io is a prototype-based language. In Io, all computation,
    including assignment, conditionals, and loops, proceeds by sending messages. All
    objects are run-time accessible, as the source code tree (yes, metaprogramming
    opportunities around). The language provides actors, futures, and coroutines for
    concurrency. Io has much to offer and we can''t do the language justice in this
    short section, but we''ll leave you with a look at our right triangle measurement
    script:


    ```

    for(c, 1, 40,

    for(b, 1, c-1,

    for(a, 1, b-1,

    if(a*a+b*b == c*c,

    (list(a, b, c) print("")) println

    nil)))

    ```


    # Factor


    Although this book''s main tour managed to visit a number of programming paradigms,
    we''re up to now missed concatenative programming. Concatenative programming languages
    build subroutines for evaluation by composing functions. Concatenative programming
    is generally differentiated from applicative programming in which functions are
    applied to arguments. Factor is a modern concatenative language—PostScript is
    another and like many, but not all, concatenative languages, it is also stack-based.'
