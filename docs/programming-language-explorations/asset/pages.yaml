    +   3. subscriptions: model -> Msg produces, for a given model, a subscription
    to sources that can produce messages (of type msg) that will be routed to the
    update function.


    +   4. update: model -> model -> (model, Cmd msg) produces a model and message,
    the new model (next state) and a command to invoke.


    Elm provides functions for creating subscriptions on windows, keyboards, mice,
    web sockets, geolocation changes, timers, and the browser''s refresh cycle. You''ll
