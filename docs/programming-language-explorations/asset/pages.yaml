    We should mention in closing that although ARC does all the work of reclaiming
    memory for you (as long as you manage your cycles), Swift is still able to interoperate
    with code written in Objective-C or C, languages intending unsafe features. You
    can recognize these features by name; the language designers endowed Swift with
    the power of *unsafe features*. The standard library gives you the types `UnsafePointer<T>`
    and `UnsafeMutablePointer<T>` among others, which serve as a standin for pointer
    types in C. Instances of these pointers are to objects of type `T` and provide
    *no* automatic memory management whatsoever. You must both allocate and deactivate
    them. They even lack the safety features of guaranteed initialization. You are
    responsible.


    The following script illustrates the lifecycle of a typical unsafe pointer:


    ```

    var p: UnsafeMutablePointer<Int>

    // p is not allocated yet, using here it would be an error

    p = UnsafeMutablePointer<Int>(allocatingCapacity: 1)

    // allocated but not initialized, p.memory is an arbitrary integer

    p.pointee = 8

    // now p is initialized

    assert(p.pointee == 8)

    p.deinitialize(count: 1)

    // at this point, the memory p points to is "garbage"

    p.deallocateCapacity(1)

    // now the memory is freed for up

    ```


