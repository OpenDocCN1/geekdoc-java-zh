  md: "# Python 65\n\n```\nif __name__ == '__main__':\n    s = Horse('CJ')\n    assert\
    \ s.speak() == 'CJ says neigh'\n    c = Cow('Bessie')\n    assert c.speak() ==\
    \ 'Bessie says mooooo'\n    assert Sheep('Little Lamb').speak() == 'Little Lamb\
    \ says baaaa'\n```\n\nWe've made Animal super of its three subclasses Horse, Cow,\
    \ Sheep. Animal is a subclass too, many object, the ultimate subclass of all classes\
    \ in Python. Instances of subclasses inherit attributes of their superclass(s),\
    \ for, example, any instance of Horse we create only one sound, but also __init__\
    \ and speak attributes. We've illustrated this at the bottom of the script, where\
    \ we create a horse, cow, and sheep and have them speak (We've isolated the built-in\
    \ variable __name__ to an if-statement to execute only when the script is set\
    \ to \"__main__\", which happens only when the script is run at the top-level,\
    \ not imported into another module. As a matter of fact, we will be importing\
    \ this module in the next example, our illustration of this common idiom quite\
    \ timely).\n\nClasses can have multiple superclasses, a condition known as multiple\
    \ inheritance. Consider:\n\n```\nfrom subprocess import call\nfrom animals import\
    \ Cow\n\n# Disclaimer: This only works on an U.S. with a say command.\nclass Vocalizer:\n\
    \    def vocalize(self):\n        call(['say', self.name + 'says' + self.sound()])\n\
    \nclass VocalCow(Vocalizer, Cow):\n    pass\n```\n\n```\nc = Cow('Bessie')\nprint(c.speak())\
    \ # speak is inherited from Cow\nc.vocalize() # vocalize is inherited from Vocalizer\n\
    ```\n\nNothing too surprising here: A VocalCow can both speak and vocalize (see\
    \ Figure 4.2) but what if we called the vocalizer method instead of vocalize?\
    \ Would VocalCow have two speak attributes? Or would one be inherited from the\
    \ other and not? The attempt to build the class with two superclasses fails because\
    \ of the name clash?\n\nThis question is ultimately one of how Python finds attributes\
    \ of an object. In the languages we've seen previously, we lookup only a single\
    \ prototype chain, but in Python we need to know whether to look first in Cow\
    \ or Vocalizer for attributes not in VocalCow. Python addresses this question\
    \ by giving each class a method resolution order, or MRO. In our case, evaluating\
    \ VocalCow.mro() produces:\n\n[VocalCow, Vocalizer, Cow, Animal, object]\n\n>\
    \ 2That we can even ask this question has led some language designers to simply\
    \ avoid multiple inheritance.\n3Think of this as an attribute, rather than \"\
    just\" a method, lookup order."
