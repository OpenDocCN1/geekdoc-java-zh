  md: '# 8.4 PERSISTENT DATA STRUCTURES


    Consider a 1000-element list, referred to by the symbol *a*. The expression (conj
    a x) creates a new 1001-element list, whose first element is the value of *x*.
    Should the new list contain copies of each of the elements of *a*, or the two
    lists share structure, in Figure 8.3? While conjoining by sharing is as efficient
    as possible, the downside is that changes to one list (surprisingly) affect the
    other. However, as long as the lists are immutable, sharing works! No surprises
    are ever.


    ![](img/2cd8452ff5a372a7459559ad1d0834e4_171_0.png)


    Figure 8.3 Conjoining to a Persistent List


    We can verify that Clojure does indeed share:


    ```

    (def a (list (repeat 1000 :dog))) ; 1000-dog list

    (def b (conj a :cat)) ; new list, cat at front

    ```


    ```

    (use ''clojure.test)

    (is (identical? a (rest b))

    (is (= (type a) clojure.lang.PersistentList))

    ```


    The expression (rest b) refers to the sequence of elements except the first element
    of *b*, which our script tells us is indeed identical to (the same internal object
    as) *a*. Since the list *a* remains, and was not destroyed by modification, but
    remains accessible, we call it a persistent list.


    Adding to the front of a list poses no efficiency concerns, but how can we add
    to the rear, as vector joining requires? Copying each of the vector elements appears
    to be necessary, but we can get by with a logarithmic number of copies if we use
    the vector elements using a tree structure. In Figure 8.4 our vector has the value
    [1 2 3 4 5 6]. To (conj 7), we walk the path to the node at the end of the vector,
    copying internal nodes as we go, sharing structure where we can. This technique
    of path copying also applies to functions like assoc, which we encountered in
    our examples at the beginning of the chapter.


    ![](img/2cd8452ff5a372a7459559ad1d0834e4_171_1.png)


    Figure 8.4 Conjoining to a Persistent Vector'
