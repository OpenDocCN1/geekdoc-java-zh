  md: '# Elm ■ 177


    ```

    -- From List

    sum : List number -> Maybe number

    maximum : List comparable -> Maybe comparable

    sort : List comparable -> List comparable

    sortBy (a -> comparable) -> List a -> List a

    ```


    ```

    -- From Set (note that elements must be comparable)

    insert : comparable -> Set comparable -> Set comparable

    member : comparable -> Set comparable -> Bool

    ```


    ```

    -- From Dict (note that dictionary keys are comparable)

    insert : comparable -> v -> Dict comparable v -> Dict v

    member : comparable -> Dict comparable v -> Bool

    get : comparable -> Dict comparable v -> Maybe v

    ```


    Whenever one of the special type variables appears more than once in a type expression,
    all occurrences unify together, so (comparable, comparable) does not unify with
    (Int, String). However, the latter does not unify with (comparable, comparable'')
    since the variables comparable and comparable'' are distinct.


    It is tempting to think of four special variables as interfaces, this view is
    completely wrong. Defining your type and overloading (++) does not make your type
    appendable, nor overloading any particular set of functions ever make your new
    type comparable. So don''t go looking to place values of your own types in or
    use them as dictionary keys.


    You can do things in Haskell, another member of the ML family of languages. introduced
    the notion of type classes. Type values can belong to zero or more type classes.
    A dozen of these classes exist, including Ord, Enum, Integral, Real, Functional,
    Reading, and Monad. Each class specifies certain operations (equality for Eq,
    comparison for Ord, conversion to strings for Show) and you can, when defining
    your own types, specify which type classes they belong to, provided of course,
    that you provide implementations for the functions required by the type class.


    Other ML-families take a different approach. Rather than type classes, Standard
    ML and OCaml feature relatively sophisticated systems, which ultimately allow
    you to carry out the kind of generic programming supported by Haskell''s type
    classes and Java interfaces. As a young language, Elm may well evolve type classes
    or other features, with academic-sounding names like higher-kinded polymorphism
    [49, Ch. 18] and Rank-N types [52]. You may find Elm''s choice of fixed type variables
    (in lieu of type classes or SMC-style modules) limiting its simplicity and pragmatism.
    Either way, the use of type variables and type inference based on Hindley-Milner
    types give Elm a great deal of expressivity. Now we turn to two of the language''s
    powerful mechanisms for defining new types: tagged unions and records


    > *Technically, Elm provides an infinite number of special type variables; the
    names simply need to start with number, comparable, or appendable. This number
    ''number'', number1, number2, and numberphrase behave as number.'
