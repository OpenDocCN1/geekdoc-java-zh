  md: "```\nimport java.util.Arrays;\nimport java.util.List;\nimport java.util.Set;\n\
    import java.util.HashSet;\n\npublic class ListAndSetExample {\n    public static\
    \ void main(String[] args) {\n        List<String> words = Arrays.asList(\"do\"\
    , \"while\", \"if\", \"a\");\n        Set<Integer> sizes = new HashSet<>();\n\
    \        for (String word : words) {\n            sizes.add(word.length());\n\
    \        }\n        assert sizes.equals(new HashSet<Integer>(Arrays.asList(5,2,1)));\n\
    \    }\n}\n```\n\nWe've created two variables, types of list-strings, and types\
    \ of set-integers. Both List<E> and Set<E> are interfaces in the package java.util.\
    \ We initialized sizes with an object of class HashSet<Integer> (note that the\
    \ type argument Integer is inferred). The variable words is initialized by an\
    \ object of class implementing the list interface; we don't exactly know, nor\
    \ care, which class this is—we access the object through methods defined by the\
    \ interface.\n\nJava collections are invariant, so a list of cows may not be assigned\
    \ to a list of animals. To orient a method that operates on a list of animals,\
    \ while accepting as an argument a list of sheep or list of horses, we use a wildcard\
    \ (?:).\n\n```\nimport java.util.List;\nimport java.util.Arrays;\n```\n\n```\n\
    public class AnimalChorus {\n    public static void chorus(List<? extends Animal>\
    \ animals) {\n        for (Animal animal : animals) {\n            System.out.println(animal.speak());\n\
    \        }\n    }\n\n    public static void main(String[] args) {\n        List<Cow>\
    \ cows = Arrays.asList(new Cow(\"Bessie\"));\n        List<Sheep> sheep = Arrays.asList(new\
    \ Sheep(\"Woolly\"));\n        chorus(cows);\n        chorus(sheep);\n    }\n\
    }\n```\n\nJava's <? extends Animal> is analogous to Julia's {T:<Animal}. The extends\
    \ keyword signals a upper bounded wildcard, meaning the type parameter can be\
    \ instantiated only with a type argument class Animal or any Animal subclass (direct\
    \ or indirect).\n\n> *HashSet<E> is one of eight implementations of the set interface\
    \ in the Java standard library include TreeSet<E>, EnumSet<E>, and ConcurrentSkipListSet<E>."
