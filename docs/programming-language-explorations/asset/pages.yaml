  md: '# Clojure


    Clojure is a “dynamic—general-purpose language, combining the approachability
    and interactive development of a scripting language with an efficient and robust
    infrastructure for multithreaded programming.” [56]


    +   - First appeared 2007

    - Creator Rich Hickey

    - Notable versions 1.0 (2009) • 1.7 (2015)

    - Recognized for Macros, Lisp-ness, Concurrency support, Java interoperability

    - Notable uses Data mining, Concurrent, Artificial intelligence

    - Tags Functional, Dynamic, Homoiconic

    - Six words or A Lisp for the JVM


    In the 1950s John McCarthy created Lisp. In doing so, he had to say “[done] for
    computing something like Euclid [had done] for geometry,” [46] written the “Maxwell’s
    Equations of software,” [34] and given the world “the greatest single programming
    language ever designed.” [113] Lisp, remarked Edsger Dijkstra, has “assisted a
    number of our most gifted humans in thinking previously impossible thoughts.”[26]


    This introduces Clojure. Clojure is a Lisp—a modern Lisp. It does a better job
    than (if not) all other Lisp dialects in isolating side effects and implementing
    concurrent features. Clojure interoperates with Java, so your Clojure program
    has access to the entire Java platform. Your Clojure can call Java libraries.
    Your Java code can execute Clojure-written code.


    After presenting our three introductory sections, we will cover the basic data
    types of Clojure (there are quite a few of these) and devote some time to persistent
    data structures, and the use of transients to isolate mutable operations. We’ll
    then look at Clojure’s various approaches to concurrency (one of the language’s
    greatest strengths) visiting refs, agents, and software transactional memory.


    We’ll close our tour with a look at the macro system, which takes advantage of
    Clojure’s representation of code as data, and is considered by many to be the
    essential ingredient of any Lisp dialect.'
