  md: "```\nfunc generatePermutations(a []string, n int) {\n  if n == 0 {\n    fmt.Println(strings.Join(a,\
    \ \"\"))\n  } else {\n    for i := 0; i < n; i++ {\n      generatePermutations(a,\
    \ n-1)\n      if n % 2 == 0 {\n        a[0], a[n] = a[n], a[0]\n      } else {\n\
    \        a[i], a[n] = a[n], a[i]\n      }\n    }\n    generatePermutations(a,\
    \ n-1)\n  }\n}\n```\n\nSplit and Join are functions from the strings package,\
    \ rather than methods on string objects. The os package provides access to command\
    \ line arguments and an exit function, as in Python. We must declare types for\
    \ parameters, but the types of local variables (like i and word) can be inferred.\
    \ Type names come after variables, and complex expressions have prefix operators:\
    \ slice of strings. The := symbol introduces Go’s short variable declaration.\
    \ We see a verbose if-statement because Go lacks a conditional exception. Thankfully,\
    \ parallel assignment keeps the script from getting too long!\n\nNow let's count\
    \ words from standard input:\n\n```\npackage main\n\nimport (\n  \"fmt\"\n  \"\
    bufio\"\n  \"os\"\n  \"regexp\"\n  \"sort\"\n  \"strings\"\n)\n\nfunc main() {\n\
    \  counts := make(map[string]int)\n  scanner := bufio.NewScanner(os.Stdin)\n \
    \ r := regexp.Compile(`[a-z\\']+`)\n  for scanner.Scan() {\n    line := strings.ToLower(scanner.Text())\n\
    \    for _, word := range r.FindAllString(line, -1) {\n      counts[word] += 1\n\
    \    }\n  }\n  report(counts)\n}\n```"
