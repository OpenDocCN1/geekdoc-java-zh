  trans: "\n\n![Remember](img/remember.png) 当然，Java 类名必须符合 Java 对命名的通用要求。因此，类名必须以字母或下划线开头，不能包含空格或下划线、美元符号以外的特殊字符，不能与任何关键字或其他保留字（如\
    \ `var`、`true`、`false` 或 `null`）相同。\n\n## 了解类体\n\n类的 `class body` 是类声明末尾大括号内的所有内容。类声明的\
    \ `public class ClassName` 部分只占一行，但类声明的主体可能占据几百行（如果你写得过头，可能是几千行）。\n\n类体可以包含以下元素：\n\
    \n* **字段 (Fields):** 变量声明定义了类的公共或私有字段。\n* **方法 (Methods):** 方法声明定义类的方法。\n* **构造方法\
    \ (Constructors):** `constructor` 是一个与方法相似的代码块，它在创建实例时运行以初始化对象。构造方法的名称必须与类本身相同，尽管它看起来像方法，但它没有返回类型。\n\
    * **初始化器 (Initializers):** 这些独立代码块仅在类初始化时运行一次。实际上有两种类型，分别称为 `static initializers`\
    \ 和 `instance initializers`。\n* **其他类和接口:** 类可以包含另一个类，该类被称为 `inner class` 或 `nested\
    \ class`。类也可以包含接口。\n\n![Tip](img/tip.png) 与某些编程语言不同，Java 并不在乎项在类体中出现的顺序。尽管如此，在类中放置项的顺序上保持一致是一个好主意。这样你就知道去哪里找它们。我们通常在类的开头将所有字段写在一起，然后是构造方法，最后是方法。\n\
    \n有些程序员喜欢将字段放在类的末尾而不是开头。任何能给你带来快乐的方法对我们来说都可以。\n\n![Remember](img/remember.png)\
    \ 类中包含的字段、方法、类和接口被称为类的 `members`（成员）。构造方法和初始化器不被视为成员。\n\n## 了解类所在的位置\n\n公共类必须写在一个与类名相同且扩展名为\
    \ `java` 的源文件中。例如，一个名为 `Greeter` 的公共类必须存放在名为 `Greeter.java` 的文件中。\n\n因此，你不能在同一个文件中放置两个公共类。以下源文件（命名为\
    \ `DiceGame.java`）无法编译：\n\n```\npublic class DiceGame\n{\n    public static void\
    \ main(String[] args)\n    {\n        Dice d = new Dice();\n        d.roll();\n\
    \    }\n}\npublic class Dice\n{\n    public void roll()\n    {\n        // 掷骰子的代码写在这里\n\
    \    }\n}\n```\n\n编译器会抛出消息，指示 `Dice` 是一个公共类，必须在名为 `Dice.java` 的文件中声明。\n\n这个问题有两个可能的解决方案。第一个是从\
    \ `Dice` 类中移除 `public` 关键字：\n\n```\npublic class DiceGame\n{\n    public static\
    \ void main(String[] args)\n    {\n        Dice d = new Dice();\n        d.roll();\n\
    \    }\n}\nclass Dice\n{\n    public void roll()\n    {\n        // 掷骰子的代码写在这里\n\
    \    }\n}\n```\n\n编译器会乐意地接受这个程序。\n\n![Remember](img/remember.png) 当你在单个源文件中编写多个类时，Java\
    \ 仍然会为每个类创建一个单独类文件。因此，当你编译 `DiceGame.java` 文件时，Java 编译器会创建两个类文件：`DiceGame.class`\
    \ 和 `Dice.class`。\n\n对于较小的程序，移除类的 `public` 关键字是可以的，但它的局限性是 `Dice` 类仅对 `DiceGame.java`\
    \ 文件中定义的类可见。如果你希望 `Dice` 类更广泛可用，请选择第二种解决方案：将其带有 `public` 关键字存放在名为 `Dice.java`\
    \ 的独立文件中。\n\n![Tip](img/tip.png) 如果你打算创建一个包含多个公共类的应用程序，请为该应用程序创建一个单独文件夹。然后将应用程序的所有类文件保存到此文件夹中。如果你将类文件一起放在同一个文件夹中，Java\
    \ 编译器就能找到它们。如果你将它们放在不同的文件夹中，你可能需要调整 `ClassPath` 环境变量来帮助编译器找到这些类。\n\n## 使用成员\n\n\
    类的 `members` 是在类体中定义的字段和方法。（从技术上讲，类内部定义的类和接口也是成员。不过，我们在这书中书中讨论它们，所以你可以忽略它们。）\n\
    \n接下来的章节将描述在类中使用字段和方法的基础知识。\n\n### 理解字段\n\n`field` 是定义在类体中、类任何方法之外的变量。字段对类的所有方法都可见。此外，如果字段指定了\
    \ `public` 关键字，则该字段在类外可见。如果你不想让字段在类外可见，请改用 `private` 关键字。\n\n字段的定义方式与其他任何 Java\
    \ 变量相同，但它也可以有一个修饰符来指定字段的可见性——即其他类是否可以访问你定义的类的字段。目前，我们只使用两种基础的可见性：public 和 private。关于可见性的更完整讨论，请参见本章后面的“可见性”。\n\
    \n要创建一个供其他类访问的公共字段，使用 `public` 修饰符：\n\n```\npublic int trajectory = 0;\npublic\
    \ String name;\npublic Player;\n```\n\n要创建一个私有字段，用 `private` 代替 `public`：\n\n\
    ```\nprivate int x_position = 0;\nprivate int y_position = 0;\nprivate String\
    \ error_message = \"\";\n```\n\n字段还可以被声明为 `final`：\n\n```\npublic final int MAX_SCORE\
    \ = 1000;\n```\n\n`final` 字段的值在初始化后无法更改。***注意：*** 将 `final` 字段命名为全大写是一种习惯，但并非强制要求。\n\
    \n### 理解实例方法\n\n你通过第 8 章描述的技术为类定义方法。要声明一个供类用户使用的方法，在方法声明中添加 `public` 关键字：\n\n\
    ```java\npublic boolean isActive()\n{\n    return this.isActive;\n}\n```\n\n要创建一个在类内部可以使用但在类外不可见的私有方法，使用\
    \ `private` 关键字：\n\n```java\nprivate void calculateLunarTrajectory()\n{\n    //\
    \ 获取计算出的轨迹的代码\n}\n```\n\n### 理解可见性\n\n在前面的章节中，我们提到字段和方法都可以使用 `public` 或 `private`\
    \ 关键字来指示字段或方法是否可以从类外访问。这被称为字段或方法的 `visibility`（可见性）。\n\n实际上你有四种可以使用的可见性级别：\n\n\
    * `private`: 适用于对任何其他类都见的字段——也就是说，完全属于类内部的字段。\n* `public`: 适用于所有其他 Java 类（包括当前包之外的类）都可见的字段。\n\
    * `protected`: 适用于仅对当前类的子类可见的字段——也就是说，对子类或内部类可见。\n* `package-private`: 适用于对当前包内任何其他类都可见的字段。（注意\
    \ Java 中没有 `package-private` 关键字；如果你没有指定 `private`、`public` 或 `protected`，那就是默认可见性。）\n\
    \n"
- fmt: "\nThe combination of all the members that have `public` access is sometimes\
    \ called the `public interface` of your class. These members are the only means\
    \ that other objects have to communicate with objects created from your class.\
    \ As a result, carefully consider which public fields and methods your class declares.\
    \ (Again, we use the term `interface` here in a general sense, not to be confused\
    \ with the specific Java feature called `interface`.)\n\nThe term `expose` is\
    \ sometimes used to refer to the creation of public fields and methods. If a class\
    \ has a public method named `isActive`, for example, you could say that the class\
    \ exposes the `isActive` method. That simply means the method is available to\
    \ other classes.\n\n![Warning](images/warning.png) You can use private fields\
    \ and methods within a class — but not from other classes. Private fields and\
    \ methods provide implementation details that may be crucial to the operation\
    \ of your class but that shouldn’t be exposed to the outside world. Private fields\
    \ and methods are sometimes called `internal members` because they’re available\
    \ only from within the class.\n\n## Using Getters and Setters\n\nOne of the basic\
    \ goals of object-oriented programming is to hide the implementation details of\
    \ a class inside the class while carefully controlling what aspects of the class\
    \ are exposed to the outside world. This is often referred to as `encapsulation.`\
    \ As a general rule, you hide as many of the details of your implementation from\
    \ the outside world as you possibly can.\n\nOne way to do that is to avoid creating\
    \ public fields. Instead, make your fields private. Then, selectively grant access\
    \ to the data those fields contain by adding to the class special methods called\
    \ `accessors.`\n\nThere are two types of accessors. A `get` accessor (also called\
    \ a `getter`) is a method that retrieves a field value, whereas a `set` accessor\
    \ (setter) is a method that sets a field value. These methods are usually named\
    \ `getFieldName` and `setFieldName`, respectively. If the field is named `count`,\
    \ for example, the getter and setter methods are named `getCount` and `setCount`.\n\
    \n![Tip](images/tip.png) For `boolean` values, it’s common to use the name `isFieldName`\
    \ for the getter method. For example, if a field is named `Enabled`, the corresponding\
    \ getter method would be named `isEnabled`.\n\nHere’s a class that uses a private\
    \ field named `Health` to indicate the health of a player in a game program:\n\
    \n```\npublic class Player\n{\n  private int health;\n  public int getHealth()\n\
    \  {\n    return health;\n  }\n  public void setHealth(int h)\n  {\n    health\
    \ = h;\n  }\n}\n```\n\nHere the `health` field itself is declared as `private`,\
    \ so it can’t be accessed directly. Instead, it can be accessed only through the\
    \ methods `getHealth` and `setHealth`.\n\nCreating classes with accessors rather\
    \ than simple public fields offers several benefits:\n\n*   You can create a read-only\
    \ property by providing a `get` accessor but not a `set` accessor. Then other\
    \ classes can retrieve the property value — but can’t change it.\n*   Instead\
    \ of storing the property value in a private field, you can calculate it each\
    \ time the `get` accessor method is called. Suppose you have a class named `Order`\
    \ that includes fields named `unitPrice` and `quantityOrdered`. This class might\
    \ also contain a `getOrderTotal` method that looks like this:\n\n```java\npublic\
    \ double getOrderTotal()\n{\n  return unitPrice * quantityOrdered;\n}\n```\n\n\
    Here, instead of returning the value of a class field, the `get` accessor calculates\
    \ the value to be returned.\n*   You can protect the class from bad data by validating\
    \ data in a property `set` accessor and either ignoring invalid data or throwing\
    \ an exception if invalid data is passed to the method. Suppose that you have\
    \ a `set` accessor for an `int` property named `Health` whose value can range\
    \ from `0` to `100`. Here’s a `set` accessor that prevents the `Health` property\
    \ from being set to an incorrect value:\n\n```java\npublic void setHealth(int\
    \ h)\n{\n  if (h < 0)\n    health = 0;\n  else if (h > 100)\n    health = 100;\n\
    \  else\n    health = h;\n}\n```\n\nHere, if the `setHealth` method is called\
    \ with a value less than `0`, `health` is set to `0`. Likewise, if the value is\
    \ greater than `100`, `health` is set to `100`.\n\n## Creating Constructors\n\n\
    A `constructor` is a block of code that’s called when an instance of an object\
    \ is created. In many ways, a constructor is similar to a method, but a few differences\
    \ exist:\n\n*   A constructor doesn’t have a return type.\n*   The name of the\
    \ constructor must be the same as the name of the class.\n*   Unlike methods,\
    \ constructors are not considered to be members of a class. (That’s important\
    \ only when it comes to inheritance, which is covered in Chapter 11.)\n*   A constructor\
    \ is called when a new instance of an object is created. In fact, it’s the `new`\
    \ keyword that calls the constructor. After creating the object, you can’t call\
    \ the constructor again.\n\nHere’s the basic format for coding a constructor:\n\
    \n```java\npublic ClassName(parameter-list) throws exception...\n{\n  statements...\n\
    }\n```\n\nThe `public` keyword indicates that other classes can access the constructor.\
    \ That’s usually what you want, although in the next chapter, you see why you\
    \ might want to create a `private` constructor. `ClassName` must be the same as\
    \ the name of the class that contains the constructor. You code the parameter\
    \ list the same way that you code it for a method.\n\nNotice also that a constructor\
    \ can throw exceptions if it encounters situations that it can’t recover from.\
    \ (For more information about throwing exceptions, refer to Chapter 9.)\n\n###\
    \ Creating basic constructors\n\nProbably the most common reason for coding a\
    \ constructor is to provide initial values for class fields when you create the\
    \ object. Suppose that you have a class named `Actor` that has fields named `firstName`\
    \ and `lastName`. You can create a constructor for the `Actor` class:\n\n```java\n\
    public Actor(String first, String last)\n{\n  firstName = first;\n  lastName =\
    \ last;\n}\n```\n\nThen you create an instance of the `Actor` class by calling\
    \ this constructor:\n\n```java\nActor a = new Actor(\"Arnold\", \"Schwarzenegger\"\
    );\n```\n\nA new `Actor` object for Schwarzenegger is created.\n\nLike methods,\
    \ constructors can be overloaded. In other words, you can provide more than one\
    \ constructor for a class, provided that each constructor has a unique signature.\
    \ Here’s another constructor for the `Actor` class:\n\n```java\npublic Actor(String\
    \ first, String last, boolean good)\n{\n  firstName = first;\n  lastName = last;\n\
    \  goodActor = good;\n}\n```\n\nThis constructor lets you create an `Actor` object\
    \ with information besides the actor’s name:\n\n```java\nActor a = new Actor(\"\
    Arnold\", \"Schwarzenegger\", false);\n```\n\n### Creating default constructors\n\
    \nWe grew up watching *Dragnet.* We can still hear Joe Friday reading some thug\
    \ his rights: “You have the right to an attorney during questioning. If you desire\
    \ an attorney and cannot afford one, an attorney will be appointed to you free\
    \ of charge.”\n\nJava constructors are like that. Every class has a right to a\
    \ constructor. If you don’t provide a constructor, Java appoints one for you,\
    \ free of charge. This free constructor is called the `default constructor.` It\
    \ doesn’t accept any parameters and doesn’t do anything, but it does allow your\
    \ class to be instantiated.\n\nThus, the following two classes are identical:\n\
    \n```java\npublic class Class1\n{\n  public Class1() { }\n}\n```\n\n```java\n\
    public class Class1 { }\n```\n\nIn the first example, the class explicitly declares\
    \ a constructor that doesn’t accept any parameters and has no statements in its\
    \ body. In the second example, Java creates a default constructor that works just\
    \ like the constructor shown in the first example.\n"
