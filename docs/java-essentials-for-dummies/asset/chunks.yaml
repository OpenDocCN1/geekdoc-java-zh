  trans: "\n\n为什么必须列出两次类名？第一次，你是在为变量提供 `type`（类型）。换句话说，你是在表示在这里创建的变量可以用于存放从 `Class1`\
    \ 类创建的对象。当你第二次列出类名时，你正在从该类创建一个对象。`new` 关键字告诉 Java 创建一个对象，而类名则提供了创建对象时所需的类名。\n\n\
    ![Tip](img/tip.png) 你可能已经注意到在变量名 `myClass1Object` 中，我们将名称中的 `Class1` 和 `Object`\
    \ 单词大写，但没有将名称的首字母大写。这种大小写方式被称为 `camel case`（驼峰命名法），因为单词大写的部分看起来就像驼背上的驼峰。驼峰命名法在\
    \ Java 中常用于变量名。\n\n等号 `=` 是一个`assignment operator`。它仅仅表示获取 `new` 关键字创建的对象并赋值给变量。因此，这条语句实际上完成了\
    \ `three` 件事：\n\n*   它创建了一个名为 `myClass1Object` 的变量，可以用于存放从 `Class1` 类创建的对象。此时，尚未创建任何对象——只是一个可以存储对象的变量。\n\
    *   它在内存中从 `Class1` 类创建一个新对象。\n*   它将这个新创建的对象赋值给 `myClass1Object` 变量。这样，你就可以使用\
    \ `myClassObject` 变量来引用所创建的对象。\n\n#### 查看对象的程序\n\n为了让你尽早了解面向对象编程的真实面，Listing 3-2\
    \ 和 Listing 3-3 显示了 `HelloApp` 程序的另一个版本——这次使用了两个类，其中一个在程序运行时实际上被转换为了对象。第一个类名为\
    \ `HelloApp2`，显示在 Listing 3-2 中。该类与 Listing 3-1 显示的 `HelloApp` 类相似，但它使用一个从第二个类（名为\
    \ `Greeter`）创建的对象，在控制台上实际上显示 `\"Hello, World!\"` 消息。`Greeter` 类显示在 Listing 3-3\
    \ 中。它定义了一个名为 `sayHello` 的方法来显示该消息。\n\n![Remember](img/remember.png) `HelloApp`\
    \ 和 `Greeter` 类都是公共类。Java 要求每个公共类必须存储在与类名相同的单独文件中；文件名以 `.java` 结尾。因此，`HelloApp2`\
    \ 类存储在名为 `HelloApp2.java` 的文件中，而 `Greeter` 类存储在名为 `Greeter.java` 的文件中。\n\n#####\
    \ HelloApp2 类\n\n`HelloApp2` 类显示在 Listing 3-2 中。\n\nLISTING 3-2 HelloApp2 类\n\n\
    ```\n// 此应用程序通过创建 Greeter \n// 类的实例并调用 Greeter \n// 对象的 sayHello 方法，在控制台上\n//\
    \ 显示 hello 消息。\npublic class HelloApp2\n{\n    public static void main(String[]\
    \ args)\n    {\n        Greeter myGreeterObject = new Greeter();\n        myGreeterObject.sayHello();\n\
    \    }\n}\n```\n\n接下来的段落描述了关键点：\n\n1.  →1 该类以一系列注释行开头，标识了程序的功能。对于这些注释，我们使用了简单的行尾注释而不是传统的注释。（有关注释的更多信息，请参阅本章节前面的“[Crafting\
    \ Comments””部分。）\n2.  →5 `HelloApp2` 类从第 5 行的 `public` 类声明开始。由于使用了 `public` 关键字，名为\
    \ `HelloApp2.java` 的文件必须包含该类。\n3.  →7 声明了 `main` 方法，使用的签名与该程序第一个版本中的 `main` 方法相同（Listing\
    \ 3-1）。请习惯这种形式，因为*所有* Java 都必须包含一个以此方式声明的 `main` 方法。\n4.  →9 `main` 方法体的第一行创建了一个名为\
    \ `myGreeterObject` 的变量，它可以持有从 `Greeter` 类创建的对象。然后它使用 `Greeter` 类创建一个新对象，并将该对象赋值给\
    \ `myGreeterObject` 变量。\n5.  →10 `main` 方法体的第二行调用了 `myGreeterObject` 对象的 `sayHello`\
    \ 方法。正如你稍后看到的，此方法只是在控制台上显示消息 `\"Hello, World!\"`。\n\n##### Greeter 类\n\n`Greeter`\
    \ 类显示在 Listing 3-3 中。\n\nLISTING 3-3 Greeter 类\n\n```\n// 此类代表一个在控制台上\n// 显示 hello\
    \ 消息的 Greeter 对象。\npublic class Greeter\n{\n    public void sayHello()\n    {\n\
    \        System.out.println(\"Hello, World!\");\n    }\n}\n```\n\n接下来的段落描述了关键点：\n\
    \n1.  →1 该类同样以一系列注释行开头，标识了程序的功能。\n2.  →3 类声明从该行开始。类被声明为 `public`，以便其他类可以使用它。严格来说，这里的公共声明并不是必须的；HelloApp\
    \ 因为它们在同一个包中。\n3.  →5 `sayHello` 方法使用 `public` 关键字声明，以便类可用。`void` 关键字表示此方法不向调用它的语句返回任何数据。\n\
    4.  →7 该方法的体仅包含一行显示 `\"Hello, World!\"`。\n\n### 所以有什么区别？\n\n你可能注意到在 `HelloApp2`\
    \ 程序中，真正执行工作的行只有 `Greeter` 类中的 Listing 3-3 第 7 行。除了第二个版本的代码量是第一个版本的倍之外，这两个应用程序到底有什么区别？\n\
    \n简单来说，第一个版本是过程化的，而第二个版本是面向对象的。在程序的第一个版本中，应用程序的 `main` 方法独立完成了所有工作：它只是打了招呼。第二个版本定义了一个知道如何招呼的类。应用程序本身不知道问候语是什么、用什么语言显示，甚至不知道如何显示它。\n\
    \n为了说明这一点，考虑一下如果你使用 Listing 3-4 显示的 `Greeter` 类而不是 Listing 3-3 中的类会发生什么。这个版本的\
    \ `Greeter` 类使用一个 Java 库类 `JOptionPane` 在对话框而不是控制台窗口显示消息。（我们不会在列表中解释此代码是如何工作的，但你可以在下一章找到更多信息。）如果你使用这个版本的\
    \ `Greeter` 类运行 `HelloApp2` 应用程序，你将得到 Figure 3-1 所示的对话框。\n\nLISTING 3-4 Greeter\
    \ 类的另一个版本\n\n```\n// 此类创建一个在对话框中\n// 显示 hello 消息的 Greeter 对象。\nimport javax.swing.JOptionPane;\n\
    public class Greeter\n{\n    public void sayHello()\n    {\n        JOptionPane.showMessageDialog(null,\n\
    \        \"Hello, World!\", \"Greeter\",\n        JOptionPane.INFORMATION_MESSAGE);\n\
    \    }\n}\n```\n\n"
- fmt: "\n![The image depicts a simple computer dialog box titled “Greeter.” The title\
    \ at the top of the dialog box is “Greeter.” Inside the dialog box, there’s an\
    \ information icon on the left side. The centered text within the dialog box reads\
    \ “Hello, World!” Below the text, there’s an “OK” button.](images/9781394296972-fg0301.png)\n\
    \n[FIGURE 3-1:](#c03.xhtml_rc03-fig-0001) The class in [Listing 3-4](#c03.xhtml_c03-fea-0004)\
    \ displays this dialog box.\n\n![Remember](images/remember.png) The important\
    \ point to realize here is that the `HelloApp2` class doesn’t have to be changed\
    \ to use this new version of the `Greeter` class. Instead, all you have to do\
    \ is replace the old `Greeter` class with the new one, recompile the `Greeter`\
    \ class, and the `HelloApp2` class won’t know the difference. That’s one of the\
    \ main benefits of object-oriented programming.\n\n## Importing Java API Classes\n\
    \nYou may have noticed that the `Greeter` class in [Listing 3-4](#c03.xhtml_c03-fea-0004)\
    \ includes this statement:\n\n```\nimport javax.swing.JOptionPane;\n```\n\nThe\
    \ purpose of the `import` statement is to let the compiler know that the program\
    \ is using a class that’s defined by the Java API called `JOptionPane`.\n\nBecause\
    \ the Java API contains literally thousands of classes, some form of organization\
    \ is needed to make the classes easier to access. Java does this by grouping classes\
    \ into manageable groups called `packages`. In the previous example, the package\
    \ that contains the `JOptionPane` class is named `javax.swing`.\n\nStrictly speaking,\
    \ `import` statements are never required. But if you don’t use `import` statements\
    \ to import the API classes your program uses, you must *fully qualify* the names\
    \ of the classes when you use them by listing the package name in front of the\
    \ class name. So if the class in [Listing 3-4](#c03.xhtml_c03-fea-0004) didn’t\
    \ include the `import` statement in line 4, you’d have to code line 11 like this:\n\
    \n```\njavax.swing.JOptionPane.showMessageDialog(null,\n\"Hello, World!\", \"\
    Greeter\",\njavax.swing.JOptionPane.INFORMATION_MESSAGE);\n```\n\nIn other words,\
    \ you’d have to specify `javax.swing.JOptionPane` instead of just `JOptionPane`\
    \ whenever you referred to this class.\n\n![Tip](images/tip.png) Here are some\
    \ additional rules for working with `import` statements:\n\n*   `import` statements\
    \ must appear at the beginning of the class file, before any class declarations.\n\
    *   You can include as many `import` statements as are necessary to import all\
    \ the classes used by your program.\n*   You can import all the classes in a particular\
    \ package by listing the package name followed by an asterisk wildcard, like this:\n\
    \    ```\n    import javax.swing.*;\n    ```\n*   Because many programs use the\
    \ classes that are contained in the `java.lang` package, you don’t have to import\
    \ that package. Instead, those classes are automatically available to all programs.\
    \ The `System` class is defined in the `java.lang` package. As a result, you don’t\
    \ have to provide an `import` statement to use this class.\n\n## Chapter 4\n\n\
    # Working with Variables and Data Types\n\n## IN THIS CHAPTER\n\n![Bullet](images/check.png)\
    \ **Creating proper variable declarations**\n![Bullet](images/check.png) **Discovering\
    \ the difference between primitive and reference types**\n![Bullet](images/check.png)\
    \ **Looking at Java’s built-in data types**\n![Bullet](images/check.png) **Introducing\
    \ strings**\n\nIn this chapter, you find out the basics of working with variables\
    \ in Java. Variables are the key to making Java programs general purpose. Variables\
    \ are also the key to creating programs that can perform calculations. Suppose\
    \ that you want to create a program that calculates the area of a circle, given\
    \ the circle’s radius. Such a program uses two variables: one to represent the\
    \ radius of the circle and the other to represent the circle’s area. The program\
    \ asks the user to enter a value for the first variable. Then it calculates the\
    \ value of the second variable.\n\n## Declaring Variables\n\nIn Java, you must\
    \ explicitly declare all variables before using them. This rule is in contrast\
    \ to some languages — most notably Python, which lets you use variables that haven’t\
    \ been explicitly declared.\n\n![Warning](images/warning.png) Allowing you to\
    \ use variables that you haven’t explicitly declared might seem a pretty good\
    \ idea at first glance, but it’s a common source of bugs that result from misspelled\
    \ variable names. Java requires that you explicitly declare variables so that\
    \ if you misspell a variable name, the compiler can detect your mistake and display\
    \ a compiler error.\n\nThe basic form of a variable declaration is this:\n\n`type\
    \ name;`\n\nHere are some examples:\n\n```\nint x;\nString lastName;\ndouble radius;\n\
    ```\n\nIn these examples, variables named `x`, `lastName`, and `radius` are declared.\
    \ The `x` variable holds integer values, the `lastName` variable holds `String`\
    \ values, and the `radius` variable holds double values. For more information\
    \ about what these types mean, see the section “[Working with Primitive Data Types](#c04.xhtml_c04-sec-0011)”\
    \ later in this chapter. Until then, just realize that `int` variables can hold\
    \ whole numbers.\n"
