    # Introduction


    Welcome to *Java Essentials For Dummies.* This book contains all the basic information
    you need to know to get going with Java programming, starting with writing statements
    and using variables and ending with techniques for using Java features such as
    arrays. Along the way, you find plenty of not-so-basic information about working
    with classes and objects, handling exceptions, and working from the command line.


    The basic idea here is that we’ve tried to wring out the not-quite-200-or-so most
    useful pages of information on the most important Java programming topics: setup
    and configuration, basic programming, and object-oriented programming. Thus, you
    get a nice, trim book with just the Java you need to know.


    So, whether you’re just getting started with Java programming or you’re a seasoned
    pro, you’ve found the right book.


    ## About This Book


    In *Java Essentials For Dummies,* all the information you need is conveniently
    packaged for you in-between one set of covers. And all the information is current
    for a recent release of Java, known as JDK 19\. This book doesn’t pretend to be
    a comprehensive reference for every detail on every possible topic related to
    Java programming. Instead, it shows you how to get up and running fast so that
    you have more time to do the things you really want to do. Designed using the
    easy-to-follow *For Dummies* format, this book helps you get the information you
    need without laboring to find it.


    ## Foolish Assumptions


    We’ve never met, so it’s difficult for us to make any assumptions about why you’re
    interested in this book. However, let’s start with a few basic assumptions:


    *   **You own or have access to a relatively modern computer.** The examples were
    created on a Windows computer, but you can learn to program in Java just as easily
    on a Mac or Linux computer.


    *   **You’re an experienced computer user.** In other words, we assume that you
    know the basics of using your computer, such as starting programs and working
    with the file system.


    *   **You’re interested in learning how to write programs in the Java language.**
    That’s what this book is about, so it’s a fair assumption.


    We do *not* assume you have any previous programming experience in Java or in
    any other programming language.


