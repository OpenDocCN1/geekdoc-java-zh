    \ compile the method again. It turns out that the compiler is smart, but not very\
    \ smart. It doesn’t catch the fact that the condition in the `do-while` loop is\
    \ the opposite of the condition in the `if` statement, meaning that the only way\
    \ out of this loop is through the `return` statement in the `if` statement. So\
    \ the compiler whines `missing return statement` again.\n\nAfter thinking about\
    \ it for a while, you come up with this solution:\n\n`public static int getRandomNumber()`\n\
    \n`{`\n\n`int num;`\n\n`while (true)`\n\n`{`\n\n`num = (int)(Math.random() * 20)\
    \ + 1;`\n\n`if (num != 12)`\n\n`return num;`\n\n`}`\n\n`}`\n\nNow everyone’s happy.\
    \ The compiler knows that the only way out of the loop is through the `return`\
    \ statement, your dodecaphobic user doesn’t have to worry about seeing the number\
    \ 12, and you know that the random number isn’t twice as likely to be 11 as any\
    \ other number. Life is good, and you can move on to the next topic.\n\n## Methods\
    \ That Take Parameters\n\nA *parameter* is a value that you can pass to a method.\
    \ Then the method can use the parameter as though it were a local variable initialized\
    \ with the value of the variable passed to it by the calling method.\n\nHere’s\
    \ a method named `getRandomNumber` that returns a random number between 1 and\
    \ 10:\n\n`public static int getRandomNumber()`\n\n`{`\n\n`return (int)(Math.random()\
    \ * 10) + 1;`\n\n`}`\n\nThis method is useful, but it would be even more useful\
    \ if you could tell it the range of numbers you want the random number to fall\
    \ in. It would be nice to call the method like this to get a random number between\
    \ 1 and 10:\n\n`int number = getRandomNumber(1, 10);`\n\nThen, if your program\
    \ needs to roll dice, you could call the same method:\n\n`int number = getRandomNumber(1,\
    \ 6);`\n\nOr, to pick a random card from a deck of 52 cards, you could call it\
    \ like this:\n\n`int number = getRandomNumber(1, 52);`\n\nYou wouldn’t have to\
    \ start with 1, either. To get a random number between 50 and 100, you’d call\
    \ the method like this:\n\n`int number = getRandomNumber(50, 100);`\n\nA method\
    \ that accepts parameters must list the parameters in the method declaration.\
    \ The parameters are placed in a *parameter list* inside the parentheses that\
    \ follow the method name. For each parameter used by the method, you list the\
    \ parameter type followed by the parameter name. If you need more than one parameter,\
    \ you separate the parameters with commas.\n\nHere’s a version of the `getRandomNumber`\
    \ method that accepts parameters:\n\n`public static int getRandomNumber(int min,\
    \ int max)`\n\n`{`\n\n`return (int)(Math.random() * (max - min + 1)) + min;`\n\
    \n`}`\n\nHere the method uses two parameters, both of type `int`, named `min`\
    \ and `max`. Then, within the body of the method, these parameters can be used\
    \ as though they were local variables.\n\nChapter 9\n\n# Handling Exceptions\n\
    \nIN THIS CHAPTER\n\n![Bullet](images/check.png) **Seeing what to do when bad\
    \ things happen to good programs**\n\n![Bullet](images/check.png) **Finding out\
    \ all about exceptions**\n\n![Bullet](images/check.png) **Using try, catch, and\
    \ finally**\n\nThis chapter is about what happens when Java encounters an error\
    \ situation that it can’t deal with. Being an object-oriented programming language,\
    \ Java handles errors by using special *exception objects* that are created when\
    \ an error occurs. In addition, Java has a special statement called the `try`\
    \ statement that you must use to deal with exception objects. In this chapter,\
    \ you find all the gory details of working with exception objects and `try` statements.\n\
    \n## Understanding Exceptions\n\nAn *exception* is an object that’s created when\
    \ an error occurs in a Java program and Java can’t automatically fix the error.\
    \ The exception object contains information about the type of error that occurred.\
    \ The most important information — the cause of the error — is indicated by the\
    \ name of the exception class used to create the exception. You usually don’t\
    \ have to do anything with an exception object other than figure out which one\
    \ you have.\n\nEach type of exception that can occur is represented by a different\
    \ exception class. Here are some typical exceptions:\n\n*   `IllegalArgumentException`:\
    \ You passed an incorrect argument to a method.\n\n*   `InputMismatchException`:\
    \ The console input doesn’t match the data type expected by a method of the `Scanner`\
    \ class.\n\n*   `ArithmeticException`: You tried an illegal type of arithmetic\
    \ operation, such as dividing an integer by zero.\n\n*   `IOException`: A method\
    \ that performs I/O encountered an unrecoverable I/O error.\n\n*   `ClassNotFoundException`:\
    \ A necessary class couldn’t be found.\n\nThere are many other types of exceptions,\
    \ and you find out about many of them later in this book.\n\nYou need to know\
    \ a few other things about exceptions:\n\n*   When an error occurs and an exception\
    \ object is created, Java is said to have *thrown an exception.* Java has a pretty\
    \ good throwing arm, so the exception is always thrown right back to the statement\
    \ that caused it to be created.\n\n*   When an exception happens, your program\
    \ can *catch* the exception it wants to, but it doesn’t have to catch the exception\
    \ if it doesn’t want it. Instead, it can duck and let someone else catch the exception.\
    \ That someone else is the statement that called the method that’s currently executing.\n\
    \n*   If everyone ducks and the exception is never caught by the program, the\
    \ program ends abruptly and displays a nasty-looking exception message on the\
    \ console.\n\n*   Two basic types of exceptions in Java are checked exceptions\
    \ and unchecked exceptions:\n\n    *   A *checked exception* is an exception that\
    \ the compiler requires you to provide for it one way or another. If you don’t,\
    \ your program doesn’t compile.\n\n    *   An *unchecked exception* is an exception\
    \ that you can provide for, but you don’t have to.\n\n## Catching Exceptions\n\
    \nWhenever you use a statement that might throw an exception, you should write\
    \ special code to anticipate and catch the exception. That way, your program won’t\
    \ crash if the exception occurs.\n\nYou catch an exception by using a `try` statement,\
    \ which usually follows this general form:\n\n`try`\n\n`{`\n\n*`statements that\
    \ can throw exceptions`*\n\n`}`\n\n`catch (`*`exception-type identifier`*`)`\n\
    \n`{`\n\n*`statements executed when exception is thrown`*\n\n`}`\n\nHere, you\
    \ place the statements that might throw an exception within a *try block*. Then\
    \ you catch the exception with a *catch block*.\n\nHere are a few things to note\
    \ about `try` statements:\n\n*   You can code more than one `catch` block. That\
    \ way, if the statements in the `try` block might throw more than one type of\
    \ exception, you can catch each type of exception in a separate `catch` block.\n\
    \n*   You can catch more than one exception in a single catch block."
