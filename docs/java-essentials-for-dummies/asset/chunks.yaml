    `+ list);`


    `}`


    `}`


    Here are the highlights of how this program works:


    1.  →6: This line sets up an array of Booleans with 1,001 elements. We created
    one more element than we needed so we could ignore element `0`.


    2.  →9: This `for` loop closes all the lockers. This step isn’t really necessary
    because Booleans initialize to `false`, but being explicit about initialization
    is good.


    3.  →11: Every iteration of this loop represents one complete trip through the
    hallways opening and closing lockers. The `skip` variable represents how many
    lockers Bobo skips on each trip. First he does every locker, then every second
    locker, and then every third locker. So this loop simply counts from 1 to 1,000.


    4.  →15: Every iteration of this loop represents one stop at a locker on a trip
    through the hallways. This third expression in the `for` statement (on the next
    line) adds the `skip` variable to the index variable so that Bobo can access every
    *n*th locker on each trip through the hallways.


    5.  →16: This statement uses the not operator (`!`) to reverse the setting of
    each locker. Thus, if the locker is open (`true`), it’s set to closed (`false`),
    and vice versa.


    6.  →23: Yet another `for` loop spins through all the lockers and counts the ones
    that are open. It also adds the locker number for each open locker to the end
    of a string so that all the open lockers can be printed.


    This program produces more than 1,000 lines of output, but only the last few lines
    are important. Here they are:


    `Bobo is bored now so he''s going home.`


    `Bobo left 31 lockers open.`


    `The open lockers are: 1 4 9 16 25 36 49 64 81 100 121 144 169 196 225 256 289
    324 361 400 441 484 529 576 625 676 729 784 841 900 961`


    So, there’s the answer: 31 lockers are left open.


    ![Tip](images/tip.png) By the way, did you notice that the lockers that were left
    open were the ones whose numbers are perfect squares? Or that 31 is the largest
    number whose square is less than 1,000?


    ### Using the enhanced for loop


    You can often eliminate the tedium of working with indexes in `for` loops by using
    a special type of `for` loop called an *enhanced*`for`*loop.* Enhanced `for` loops
    are often called `for-each` loops because they automatically retrieve each element
    in a iterable object. Using a `for-each` loop eliminates the need to create and
    initialize an index, increment the index, test for the last item in the array,
    and access each array item using the index.


    When it’s used with an array, the enhanced `for` loop has this format:


    `for (`*`type identifier`* `:` *`array`*`)`


    `{`


    *`Statements`*`…`


    `}`


    The *`type`* identifies the type of the elements in the array, and the *`identifier`*
    provides a name for a local variable that is used to access each element. The
    colon operator (often read as “in”) is then followed by the name of the array
    you want to process.


    Here’s an example:


    `String[] days = { "Sunday", "Monday", "Tuesday",`


    `"Wednesday", "Thursday",`


    `"Friday", "Saturday" };`


    `for (String day : days)`


    `{`


    `System.out.println(day);`


    `}`


    This loop prints the following lines to the console:


    `Sunday`


    `Monday`


    `Tuesday`


    `Wednesday`


    `Thursday`


    `Friday`


    `Saturday`


    In other words, it prints each of the strings in the array on a separate line.


    It’s important to note that the `for-each` loop gives you a copy of each item
    in the array, not the item itself. So, you can’t alter the contents of an array
    by using a `for-each` loop. Consider this code snippet:


    `int[] nums = {1, 2, 3, 4, 5};`


    `for (int n : nums)`


    `n = n * 2;`


    `for (int n : nums)`


    `System.out.println(n);`


    You may expect this code to print the values 2, 4, 6, 8, and 10 because you multiplied
    `n` by 2 in the `for-each` loop. But instead, the code prints 1, 2, 3, 4, and
    5\. That’s because `n` holds a copy of each array item, not the array item itself.


    ## Using Arrays with Methods


    You can write methods that accept arrays as parameters and return arrays as return
    values. You just use an empty set of brackets to indicate that the parameter type
    or return type is an array. You’ve already seen this in the familiar `main` method
    declaration:


    `public static void main(String[] args)`


    Here’s a static method that creates and returns a `String` array with the names
    of the days of the week:


    `public static String[] getDaysOfWeek()`


    `{`


    `String[] days = { "Sunday", "Monday", "Tuesday",`


    `"Wednesday", "Thursday",`


    `"Friday", "Saturday" };`


    `return days;`


    `}`


    And here’s a static method that prints the contents of any `String` array to the
    console, one string per line:


    `public static void printStringArray(String[] strings)`


    `{`


    `for (String s : strings)`


    `System.out.println(s);`


    `}`


    Finally, here are two lines of code that call these methods:


    `String[] days = getDaysOfWeek();`


    `printStringArray(days);`


    The first statement declares a `String` array and then calls `getDaysOfWeek` to
    create the array. The second statement passes the array to the `printStringArray`
    method as a parameter.


    ## Using Varargs


    *Varargs* provides a convenient way to create a method that accepts a variable
    number of arguments. When you use varargs, the last argument in the method signature
    uses ellipses to indicate that the caller can provide one or more arguments of
    the given type.


    Here’s an example:


    `public static void PrintSomeWords(String… words)`


    `{`


    `for (String word : words)`


    `System.out.println(word);`


    `}`


    Here, the `PrintSomeWords` method specifies that the caller can pass any number
    of String arguments to the method (including none at all) and that the arguments
    will be gathered up in an array named `words`.


    Here’s a snippet of code that calls the `PrintSomeWords` methods using various
    numbers of arguments to prove the point:


    `PrintSomeWords();`


    `PrintSomeWords("I");`


    `PrintSomeWords("Am", "Not");`


    `PrintSomeWords("Throwing", "Away", "My", "Shot");`


    The resulting console output looks like this:


    `I`


    `Am`


    `Not`


    `Throwing`


    `Away`


    `My`


    `Shot`


    An important caveat about using varargs is that the variable argument must always
    be the last argument in the argument list. This makes sense when you consider
    that, otherwise, the compiler wouldn’t be able to keep track of the arguments
    if any other than the last argument had a variable number. So, the following won’t
    compile:


    `public static void PrintSomeWords(String head, String… words, string tail)`


    `{`


    `}`


    You’ll get a warning that says, “Varargs parameter must be the last parameter.”


    ## Using Two-Dimensional Arrays


    The elements of an array can be any type of object you want, including another
    array. In the latter case, you have a *two-dimensional array,* sometimes called
    an *array of arrays.*'
