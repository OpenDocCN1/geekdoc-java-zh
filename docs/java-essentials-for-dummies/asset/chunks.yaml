  raw: "This method actually compares the value of the string object referenced by\
    \ the variable with the string you pass as a parameter and returns a Boolean result\
    \ to indicate whether the strings have the same value.\n\nThe `String` class has\
    \ another method, `equalsIgnoreCase`, that’s also useful for comparing strings.\
    \ It compares strings but ignores case.\n\n## Nesting Your Loops\n\nA *nested\
    \ loop* is a loop that is completely contained inside another loop. The loop that’s\
    \ inside is called the *inner loop,* and the loop that’s outside is called the\
    \ *outer loop.*\n\nTo demonstrate the basics of nesting, here’s a simple little\
    \ program that uses a pair of nested `for` loops:\n\n`public class NestedLoop`\n\
    \n`{`\n\n`public static void main(String[] args)`\n\n`{`\n\n`for(int x = 1; x\
    \ < 10; x++)`\n\n`{`\n\n`for (int y = 1; y < 10; y++)`\n\n`System.out.print(x\
    \ + \"-\" + y + \" \");`\n\n`System.out.println();`\n\n`}`\n\n`}`\n\n`}`\n\nThis\
    \ program consists of two `for` loops. The outer loop uses `x` as its counter\
    \ variable, and the inner loop uses `y`. For each execution of the outer loop,\
    \ the inner loop executes 10 times and prints a line that shows the value of `x`\
    \ and `y` for each pass through the inner loop. When the inner loop finishes,\
    \ a call to `System.out.println` with no parameters forces a line break, thus\
    \ starting a new line. Then the outer loop cycles so that the next line is printed.\n\
    \nWhen you run this program, the console displays this text:\n\n`1-1 1-2 1-3 1-4\
