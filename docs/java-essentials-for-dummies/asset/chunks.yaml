    \ `Math` 类进行高级计算，以及在显示数字时对其进行格式化的技术。\n\n## 使用算术运算符\n\n`operator`（运算符）是一个特殊的符号或关键字，用于指定可以在一个或多个值（称为\
    \ `operands` 操作数）上执行的数学运算或其他类型的操作。Java 共有 40 个运算符。本章专注于执行算术运算的运算符。这些`算术运算符`总共七种，在表\
    \ 5-1 Java 的算术运算符\n\n下面的代码段可以帮助理清这些运算符如何作用于 `int` 类型：\n\n```java\nint a = 32,\
    \ b = 5;\nint c = a + b; // c 是 37\nint d = a - b; // d 是 27\nint e = a * b; //\
    \ e 是 160\nint f = a / b; // f 是 6 (32 / 5 等于 6 余 2)\nint g = a % b; // g 是 2\
    \ (32 / 5 等于 6 余 2)\na++; // a 现在是 33\nb--; // b 现在是 4\n```\n\n请注意，对于除法，结果会被截断。因此\
    \ `32 / 5` 返回 `6`，而不是 `6.4`。\n\n以下是运算符对 `double` 值的作用方式：\n\n```java\ndouble x\
    \ = 5.5, y = 2.0;\ndouble m = x + y; // m 是 7.5\ndouble n = x - y; // n 是 3.5\n\
    double o = x * y; // o 是 11.0\ndouble p = x / y; // p 是 2.75\ndouble q = x % y;\
    \ // q 是 1.5\nx++; // x 现在是 6.5\ny--; // y 现在是 1.0\n```\n\n## 使用复合赋值运算符\n\n`compound\
    \ assignment operator`（复合赋值运算符）是一种同时执行计算和赋值的运算符。Java 的所有二算术运算符（即作用于两个操作数的运算符）都有等价的复合赋值运算符，表\
    \ 5-2 复合赋值运算符\n\n语句\n\n`a += 10;`\n\n等于\n\n`a = a + 10;`\n\n同样，语句\n\n`z *=2;`\n\
    \n等于\n\n`z = z * 2;`\n\n## 使用 Math 类\n\nJava 内置的运算符很有用，但它们远不能满足大多数 Java 程序员的所有数学需求。这正是\
    \ `Math` 类派上用场的地方。它包含了许多内置方法，可以执行各种数学计算，从计算绝对值或平方根等基本函数，到如 `sin` 和 `cos`（正弦和余弦）等三角函数，再到舍入数字或生成随机数等实用函数。\n\
    \n后续章节描述了 `Math` 类中最有用的方法。\n\n### 使用 Math 类的常量\n\n`Math` 类定义了两个对许多计算非常有用的常量。表\
