  trans: "\n\n二维数组通常用于以行和列的形式跟踪数据，就像电子表格的工作方式一样。假设你正在编写一个程序，跟踪公司五年的销售额（2022 年至 2026\
    \ 年），且数据按四个销售区域（北、南、东、西）进行细分。你可以创建 20 个独立的变量，命名为 `sales2022North`、`sales2022South`、`sales2022East`\
    \ 等。但那样会有点繁琐。\n\n另一种方法，你可以创建一个包含 20 个元素的数组，如下所示：\n\n```java\ndouble[] sales =\
    \ new sales[20];\n```\n\n但这时，你该如何组织这个数组中的数据，以便知道每个元素对应的年份和销售区域呢？\n\n使用二维数组，你可以创建一个每个年份对应一个元素的数组。其中的每个元素反过来又是另一个数组，每个区域对应一个元素。\n\
    \n将二维数组想象成表格或电子表格是很常见的，如下所示：\n\n| 年份 | 北 | 南 | 东 | 西 |\n| --- | --- | --- | ---\
    \ | --- |\n| 2022 | 23,853 | 22,838 | 36,483 | 31,352 |\n| 2023 | 25,483 | 22,943\
    \ | 38,274 | 33,294 |\n| 2024 | 24,872 | 23,049 | 39,002 | 36,888 |\n| 2025 |\
    \ 28,492 | 23,784 | 42,374 | 39,573 |\n| 2026 | 31,932 | 23,732 | 42,943 | 41,734\
    \ |\n\n### 创建二维数组\n\n要为这些销售数据声明二维数组，你只需要列出两个空括号，如下：\n\n```java\ndouble sales[][];\n\
    ```\n\n这里 `sales` 是一个 `double` 类型的二维数组。换句话说，`sales` 是一个 `double` 数组的数组。\n\n要创建该数组，你使用\
    \ `new` 关键字并为每组括号提供长度，如示例所示：\n\n```java\nsales = new double[5][4];\n```\n\n这里，第一个维度指定\
    \ `sales` 数组有五个元素。该数组代表表格中的行。第二个维度指定这些元素中的每一个元素都是一个具有四个元素的 `double` 类型数组。该数组代表表格中的列。\n\
    \n![Tip](img/tip.png) 这里的关键处需要掌握的关键点是：一个实例是第一个数组的，而第一个数组中的每个元素对应一个第二个数组的独立实例。因此，此语句实际上创建了五个各包含四个元素的\
    \ `double` 数组。然后，这五个数组被用作第一个数组的元素。\n\n注意，和一维数组一样，你可以在一个语句中声明并创建二维数组，如下：\n\n```java\n\
    double[][] sales = new double[5][4];\n```\n\n在这里，`sales` 数组在一个语句中完成了声明和创建。\n\n\
    ### 访问二维数组元素\n\n要访问二维数组的元素，你需要使用两个索引。此语句设置了 2022 年北地区的销售额：\n\n```java\nsales[0][0]\
    \ = 23853.0;\n```\n\n正如你所想象的，通过硬编码每个索引值来访问二维数组中的数据可能会非常繁琐。难怪通常使用 `for` 循环来代替。接这段代码使用\
    \ `for` 循环将 `sales` 数组的内容打印到控制台，并用制表符分隔。每年单独打印一行，年份位于行开头。此外，在打印销售数据之前，会打印出一行销售区域的标题。代码如下：\n\
    \n```java\nNumberFormat cf = NumberFormat.getCurrencyInstance();\nSystem.out.println(\"\
    \\tNorth\\t\\tSouth\\t\\tEast\\t\\tWest\");\nint year = 2022;\nfor (int y = 0;\
    \ y < 5; y++)\n{\n    System.out.print(year + \"\\t\");\n    for (int region =\
    \ 0; region < 4; region++)\n    {\n        System.out.print(cf.format(sales[y][region]));\n\
    \        System.out.print(\"\\t\");\n    }\n    year++;\n    System.out.println();\n\
    }\n```\n\n假设 `sales` 数组已经初始化，这段代码会在控制台上产生以下输出：\n\n```\nNorth South East West\n\
    2022 $23,853.00 $22,838.00 $36,483.00 $31,352.00\n2023 $25,483.00 $22,943.00 $38,274.00\
    \ $33,294.00\n2024 $24,872.00 $23,049.00 $39,002.00 $36,888.00\n2025 $28,492.00\
    \ $23,784.00 $42,374.00 $39,573.00\n2026 $31,932.00 $23,732.00 $42,943.00 $41,734.00\n\
    ```\n\n![Warning](img/warning.png) 访问二维数组每个索引的 `for` 循环顺序至关重要！之前的示例是按每年列出销售额，按列排列。你可以通过反转\
    \ `for` 循环的顺序来按每个区域列出销售额，按行排列：\n\n```java\nfor (int region = 0; region < 4; region++)\n\
    {\n    for (int y = 0; y < 5; y++)\n    {\n        System.out.print(cf.format(sales[y][region]));\n\
    \        System.out.print(\" \");\n    }\n    System.out.println();\n}\n```\n\n\
    在这里，外层循环索引区域，内层循环索引年份：\n\n```\n$23,853.00 $25,483.00 $24,872.00 $28,492.00 $31,932.00\n\
    $22,838.00 $22,943.00 $23,049.00 $23,784.00 $23,732.00\n$36,483.00 $38,274.00\
    \ $39,002.00 $42,374.00 $42,943.00\n$31,352.00 $33,294.00 $36,888.00 $39,573.00\
    \ $41,734.00\n```\n\n### 初始化二维数组\n\n通过在大括号内编码数组来初始化的方法也适用于二维数组。你只需要记住主数组的每个元素都是另一个数组。因此，你需要嵌套初始化器。以下是初始化\
    \ `sales` 数组的示例：\n\n```java\ndouble[][] sales = {\n    {23853.0, 22838.0, 36483.0,\
    \ 31352.0}, // 2022\n    {25483.0, 22943.0, 38274.0, 33294.0}, // 2023\n    {24872.0,\
    \ 23049.0, 39002.0, 36888.0}, // 2024\n    {28492.0, 23784.0, 42374.0, 39573.0},\
    \ // 2025\n    {31932.0, 23732.0, 42943.0, 41734.0}  // 2026\n};\n```\n\n在这里我们在每行末尾添加了注释，说明该行初始化的年份。注意整个初始化器的左括号位于第二行开头，关闭整个初始化器的右括号位于最后一行。每年的初始化包含在自己的括号中。\n\
    \n### 使用锯齿数组（Jagged Arrays）\n\n当你使用如 `new int[5][3]` 的表达式创建数组时，你指定主数组的每个元素实际上都是具有三个元素的\
    \ `int` 类型数组。然而，Java 允许你创建二维数组，其中主数组每个元素的长度不同。这有时被称为*锯齿数组*（jagged array），因为数组并没有形成整齐的矩形。相反，它的边缘是锯齿状的。\n\
    \n假设你需要跟踪四个团队，每个团队由二三个人组成。团队如下：\n\n| 团队 | 成员 |\n| --- | --- |\n| A | Henry Blake,\
    \ Johnny Mulcahy |\n| B | Benjamin Pierce, John McIntyre, Jonathan Tuttle |\n\
    | C | Margaret Houlihan, Frank Burns |\n| D | Max Klinger, Radar O’Reilly, Igor\
    \ Straminsky |\n\n以下代码为这些团队创建一个锯齿数组：\n\n```java\nString[][] teams = {\n    {\"\
    Henry Blake\", \"Johnny Mulcahy\"},\n    {\"Benjamin Pierce\", \"John McIntyre\"\
    , \"Jonathan Tuttle\"},\n    {\"Margaret Houlihan\", \"Frank Burns\"},\n    {\"\
    Max Klinger\", \"Radar O'Reilly\", \"Igor Straminsky\"}\n};\n```\n\n每个嵌套数组初始化器表示每个子数组字符串的数量。第一个子数组有两个字符串，第二个三个，以此类推。\n\
    \n你可以使用嵌套的 `for` 循环来访问锯齿数组中的单个元素。对于主数组的每个元素，你可以使用 `length` 属性来确定该元素子数组中有多少项。例如：\n\
    \n```java\nfor (int i = 0; i < teams.length; i++)\n{\n    for (int j = 0; j <\
    \ teams[i].length; j++)\n    {\n        System.out.println(teams[i][j]);\n   \
    \ }\n    System.out.println();\n}\n```\n\n注意每个子数组的长度是通过表达式 `teams[i].length`确定的。这个\
    \ `for` 循环每行打印一个名字，团队之间留有一个空行，如下：\n\n```\nMargaret Houlihan\nFrank Burns\nMax\
    \ Klinger\nRadar O'Reilly\nIgor Straminsky\nHenry Blake\nJohnny Mulcahy\nBenjamin\
    \ Pierce\nJohn McIntyre\nJonathan Tuttle\n```\n\n"
- fmt: "\nIf you don’t want to fuss with keeping track of the indexes yourself, you\
    \ can use an enhanced `for` loop and let Java take care of the indexes. For example:\n\
    \n```java\nfor (String[] team : teams)\n{\n    for (String player : team)\n  \
    \  {\n        System.out.println(player);\n        System.out.println();\n   \
    \ }\n}\n```\n\nHere the first enhanced `for` statement specifies that the type\
    \ for the `team` variable is `String[]`. As a result, each cycle of this loop\
    \ sets `team` to one of the subarrays in the main `teams` array. Then the second\
    \ enhanced `for` loop accesses the individual strings in each subarray.\n\n# Chapter\
    \ 13 Ten Techniques for Easier Java Coding\n\n### IN THIS CHAPTER\n\n- Compiling\
    \ and running Java programs from the command line\n- Getting input from the user\n\
    - Learning more Java operators\n- Comparing strings, nesting loops, and more\n\
    \nJava is a huge, sprawling language, and we've tried to do it justice in the\
    \ previous chapters. But to really offer a complete look at Java would result\
    \ in a book ten times this size, and who has the time or the patience to wade\
    \ through such a tome? The goal of this book is to just give you the essentials\
    \ of Java, and now we're tantalizingly close to achieving that goal. All that's\
    \ left is to take you through a few techniques that will make your Java coding\
    \ sessions easier and your Java programs more efficient.\n\n## Compiling a Java\
    \ Program from the Command Line\n\nYou can compile a program from a command prompt\
    \ by using the `javac` command. Before you can do that, however, you need a program\
    \ to compile. Follow these steps:\n\n1. Using any text editor (Notepad will do),\
    \ type the following text in a file, and save it as `HelloApp.java`:\n\n```java\n\
    public class HelloApp\n{\n    public static void main(String[] args)\n    {\n\
    \        System.out.println(\"Hello, World!\");\n    }\n}\n```\n\n2. Save the\
    \ file in any directory you want.\n\n3. Open a command prompt, use a `cd` command\
    \ to change to the directory you saved the program file in, and then enter the\
    \ command `javac HelloApp.java`.\n\nThis command compiles the program (`javac`)\
    \ and creates a class file named `HelloApp.class`.\n\n## Running a Java Program\
    \ from the Command Line\n\nWhen you successfully compile a Java program, you can\
    \ run the program by typing the `java` command followed by the name of the class\
    \ that contains the program’s `main` method. To run the `HelloApp` program, for\
    \ example, type this command:\n\n```\nC:\\java\\samples>java HelloApp\n```\n\n\
    The program responds by displaying the message \"Hello, World!\".\n\n## Casting\
    \ Numeric Data\n\nFrom time to time, you need to convert numeric data of one type\
    \ to another. You may need to convert a double value to an integer, or vice versa.\
    \ Some conversions can be done automatically; others are done using a technique\
    \ called casting.\n\nTo cast a primitive value from one type to another, you use\
    \ a cast operator, which is simply the name of a primitive type in parentheses\
    \ placed before the value you want to cast. For example:\n\n```java\ndouble pi\
    \ = 3.1314;\nint iPi;\niPi = (int) pi;\n```\n\n## Printing Data with System.out\n\
    \nStandard output is a stream designed to display text output onscreen. When you\
    \ run a Java program under Windows, a special console window opens, and the standard\
    \ output stream is connected to it. Then any text you send to standard output\
    \ is displayed in that window. This stream is available to every Java program\
    \ via the `System.out` field of the `System` class.\n\n`System.out` is an instance\
    \ of a class called `PrintStream`, which defines the `print` and `println` methods\
    \ used to write data to the console. The only difference between the `print` and\
    \ `println` methods is that the `println` method adds a line-break character to\
    \ the end of the output, so the output from the next call to `print` or `println`\
    \ begins on a new line.\n\nBecause it doesn’t start a new line, the `print` method\
    \ is useful when you want to print two or more items on the same line. Here’s\
    \ an example:\n\n```java\nint i = 64;\nint j = 23;\nSystem.out.print(i);\nSystem.out.print(\"\
    \ and \");\nSystem.out.println(j);\n```\n\nThe console output produced by these\
    \ lines is:\n`64 and 23`\n\n## Getting Input with the JOptionPane Class\n\nThe\
    \ `JOptionPane` class displays a simple dialog box to get text input from the\
    \ user. Then you can use the `parse` methods of the primitive-type wrapper classes\
    \ to convert the text entered by the user to the appropriate primitive type.\n\
    \nAlthough the `JOptionPane` class has many methods, the only one you need to\
    \ use to get simple text input is the `showInputDialog` method. This method uses\
    \ a single parameter that specifies the prompting message that’s displayed in\
    \ the dialog box. It returns a string value that you can then parse to the proper\
    \ type.\n\nThe `JOptionPane` class is a part of the `javax.swing` package, so\
    \ you need to add an `import javax.swing.JOptionPane` statement to the beginning\
    \ of any program that uses this class.\n\nHere's a simple program that uses the\
    \ `JOptionPane` to get an integer:\n\n```java\nimport javax.swing.JOptionPane;\n\
    public class DialogApp\n{\n    public static void main(String[] args)\n    {\n\
    \        String s;\n        s = JOptionPane.showInputDialog(\"Enter an integer:\"\
    );\n        int x = Integer.parseInt(s);\n        System.out.println(\"You entered\
    \ \" + x + \".\");\n    }\n}\n```\n\n## Using the Unary Plus and Minus Operators\n\
    \nThe unary plus and minus operators let you change the sign of an operand. The\
    \ unary minus operator doesn’t necessarily make an have a negative value. Instead,\
    \ it changes whatever sign the operand has. Thus, if the operand starts with a\
    \ positive value, the unary operator changes it to negative. But if the operand\
    \ starts with a negative value, the unary operator makes it positive. The following\
    \ examples illustrate this:\n\n```java\nint a = 5; // a is 5\nint b = -a; // b\
    \ is -5\nint c = -b; // c is +5\n```\n\n## Using the Increment and Decrement Operators\n\
    \nOne of the most common operations in computer programming is adding or subtracting\
    \ 1 from a variable. Adding 1 to a variable is called incrementing the variable.\
    \ Subtracting 1 is called decrementing. The traditional way to increment a variable\
    \ is this:\n\n```java\na = a + 1;\n```\n\nHere the expression `a + 1` is calculated,\
    \ and the result is assigned to the variable `a`.\n\nJava provides an easier way\
    \ to do this type of calculation: the increment (`++`) and decrement (`--`) operators.\
    \ Thus, to increment the variable `a`, you can code just this:\n\n```java\na++;\n\
    ```\n\nNote that you can use an increment or decrement operator in an assignment\
    \ statement. Here’s an example:\n\n```java\nint a = 5;\nint b = a--; // b is set\
    \ to 5, a is set to 4\n```\n\nWhen the second statement is executed, the assignment\
    \ is performed first, so b is set to 5. Then, a is decremented to 4.\n\n## Using\
    \ the Conditional Operator\n\nJava has a special operator called the conditional\
    \ operator that’s designed to eliminate the need for `if` statements in certain\
    \ situations. The general form for using the conditional operator is this:\n\n\
    `boolean-expression` `?` `expression-1` `:` `expression-2`\n\nThe Boolean expression\
    \ is evaluated first. If it evaluates to `true`, `expression-1` is evaluated,\
    \ and the result of this expression becomes the result of the whole expression.\
    \ If the expression is `false`, `expression-2` is evaluated, and its results are\
    \ used instead. \n\nSuppose that you want to assign a value of `0` to an integer\
    \ variable named `salesTier` if total sales are less than $10,000 and a value\
    \ of `1` if the sales are $10,000 or more. You could do that with this statement:\n\
    \n```java\nint salesTier = salesTotal < 10000.0 ? 0 : 1;\n```\n\n## Comparing\
    \ Strings\n\nThe correct way to test a string for a given value is to use the\
    \ `equals` method of the `String` class:\n\n```java\nif (answer.equals(\"Yes\"\
    ))\n    System.out.println(\"The answer is Yes.\");\n```\n"
