    \        System.out.println(\"欢迎来到面积计算器。\");\n        System.out.print(\"请输入半径：\"\
    );\n        double r = sc.nextDouble();\n        double area = Math.PI * r * r;\n\
    \        System.out.println(\"面积为 \" + area);\n    }\n}\n```\n\n### 使用数学函数\n\n\
    表 5-4 列出了 `Math` 类提供的基本数学函数。如你所示，你可以使用这些函数计算诸如绝对值、两个值的最小值和最大值、平方根、幂和对数。\n\n| 方法\
    \ | 解释 |\n| --- | --- |\n| `abs(argument)` | 返回参数的绝对值。参数可以是 `int`、`long`、`float`\
