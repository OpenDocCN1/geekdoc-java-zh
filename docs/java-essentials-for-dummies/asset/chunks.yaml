  trans: "\n\n所有具有 `public` 访问权限的成员组合有时被称为类的 `public interface`（公共接口）。这些成员是其他对象与由你的类创建的对象进行通信的唯一手段。因此，请仔细考虑你的类声明了哪些公共字段和方法。（再次，我们在这里使用的\
    \ `interface` 一词是泛义的，不要与 Java 中名为 `interface` 的特定特性相混淆。）\n\n`expose`（暴露）一词有时被用来描述创建公共字段和方法。例如，如果一个类有一个名为\
    \ `isActive` 的公共方法，你可以说该类暴露了 `isActive` 方法。这仅仅意味着该方法对其他类可用。\n\n![Warning](img/warning.png)\
    \ 你可以在类内部使用私有字段和方法——但不能从其他类使用。私有字段和方法提供了实现细节，这些细节对你类的运行可能至关重要，但不应该被暴露给外部世界。私有字段和方法有时被称为\
    \ `internal members`（内部成员），因为它们只能在类内部可用。\n\n## 使用 Getter 和 Setter (Getters and\
    \ Setters)\n\n面向对象编程的基本目标之一是将类的实现细节隐藏在类内部，同时仔细控制类的哪些方面被暴露到外部。这通常被称为 `encapsulation`（封装）。作为一个一般原则，你应该尽可能向外部隐藏你的实现细节。\n\
    \n实现这一点的一种方法是避免创建公共字段。相反，将你的字段设为私有。然后，通过向类添加特殊的 `accessors`（访问器）特殊方法，选择性地授予对这些字段包含的数据的访问权限。\n\
    \n访问器有两种类型。`get` 访问器（也称为 getter）是获取字段值的方法，而 `set` 访问器（setter）是设置字段值的方法。这些方法通常分别命名为\
    \ `getFieldName` 和 `setFieldName`。例如，如果字段名为 `count`， getter 和 setter 方法分别命名为 `getCount`\
    \ 和 `setCount`。\n\n![Tip](img/tip.png) 对于 `boolean` 值，通常使用 `isFieldName` 作为 getter\
    \ 方法的名字。例如，如果字段名为 `Enabled`，则对应的 getter 方法将命名为 `isEnabled`。\n\n这是一个类，它使用名为 `Health`\
    \ 的私有字段来指示游戏程序中玩家的健康状况：\n\n```\npublic class Player\n{\n  private int health;\n\
    \  public int getHealth()\n  {\n    return health;\n  }\n  public void setHealth(int\
    \ h)\n  {\n    health = h;\n  }\n}\n```\n\n在这里，`health` 字段本身被声明为 `private`，因此不能被直接访问。相反，它只能通过\
    \ `getHealth` 和 `setHealth` 方法访问。\n\n使用访问器而不是简单的公共字段来创建类有几个优点：\n\n*   你可以通过提供\
    \ `get` 访问器但不提供 `set` 访问器来创建一个只读属性。这样，其他类就可以获取属性值——但不能更改它。\n*   与其其将属性值存储在私有字段中，你你可以在每次调用\
    \ `get` 访问器方法时计算它。假设你有一个名为 `Order` 的类，它包含了名为 `unitPrice` 和 `quantityOrdered` 的字段。该类可能还包含一个像这样的\
    \ `getOrderTotal` 方法：\n\n```java\npublic double getOrderTotal()\n{\n  return unitPrice\
    \ * quantityOrdered;\n}\n```\n\n在这里，`get` 访问器不是返回类字段的值，而是计算出要返回的值。\n*   你可以通过在属性\
    \ `set` 访问器中验证数据来保护类免受错误数据的影响，如果传递给方法的是无效数据，则忽略或抛出异常。假设你有一个名为 `Health` 的 `int`\
    \ 属性的 `set` 访问器，其值范围从 `0` 到 `100`。这里有一个防止 `Health` 属性出现错误的 `set` 访问器：\n\n```java\n\
    public void setHealth(int h)\n{\n  if (h >= 0 && h <= 100)\n  {\n    health =\
    \ h;\n  }\n  else\n  {\n    // 忽略无效数据或抛出异常\n  }\n}\n```\n\n在这里，如果 `Health` 属性的值超出范围，该\
    \ `set` 访问器可以防止 `Health` 属性出现错误。\n\n## 创建构造函数 (Creating Constructors)\n\n构造函数是在创建类实例时执行的\
    \ own 块。在许多方面，构造函数与方法相似，但有几点不同：\n\n*   构造函数没有返回类型。\n*   构造函数的名称必须与类相同。\n*   与方法不同，构造函数不被视为成员。（有关继承的内容将在第\
    \ 11 章讨论。）\n*   在调用 `new` 关键字时调用构造函数。\n\n这是编写构造函数的基本格式：\n\n```java\npublic ClassName(parameter-list)\n\
    {\n  statements...\n}\n```\n\n`public` 关键字表示其他类可以访问该构造函数。这通常是你想要的，尽管构造可以在遇到无法恢复的情况时抛出异常。（有关抛出异常的更多信息，请参见第\
    \ 9 章。）\n\n### 创建基本构造函数 (Creating basic constructors)\n\n编写构造函数最常见的原因是在创建对象时为字段提供初始值。假设你有一个名为\
    \ `Actor` 的类，它拥有字段 `firstName` 和 `lastName`。你可以为 `Actor` 类创建一个构造函数：\n\n```java\n\
    public Actor(String first, String last)\n{\n  firstName = first;\n  lastName =\
    \ last;\n}\n```\n\n然后通过调用此构造函数创建 `Actor` 类的实例：\n\n```java\nActor a = new Actor(\"\
    Arnold\", \"Schwarzenegger\");\n```\n\n创建一个新的 `Actor` 对象。\n\n就像方法一样，构造函数也可以被重载。也就是说，你可以为类提供多个构造函数，只要每个构造函数都有唯一的签名。这里是\
    \ `Actor`类的另一个构造函数：\n\n```java\npublic Actor(String first, String last, boolean\
    \ good)\n{\n  firstName = first;\n  lastName = last;\n  goodActor = good;\n}\n\
    ```\n\n此构造函数允许你根据演员名称之外的信息创建 `Actor` 对象：\n\n```java\nActor a = new Actor(\"Arnold\"\
    , \"Schwarzenegger\", false);\n```\n\n### 创建默认构造函数 (Creating default constructors)\n\
    \n我们是在看《警网》长大的。我们还能听到 Joe Friday 为某些罪犯宣读权利：“你在审问期间有权获得律师。如果你需要律师但付不起费用，将免费为你指定律师。”\n\
    \nJava 构造函数就像这样。每个类都有权拥有构造函数。如果你不提供构造函数，Java 会免费为你指定一个。这个免费构造函数被称为 `default constructor`（默认构造函数）。它不接受任何参数也不执行操作，但它允许你的类被实例化。\n\
    \n因此，以下两个类是相同的：\n\n```java\npublic class Class1\n{\n  public Class1() { }\n}\n\
    ```\n\n```java\npublic class Class1 { }\n```\n\n在第一个示例中，类显式声明了一个不接受任何参数且其体内没有语句的构造函数。在第二个示例中，Java\
    \ 创建了一个默认构造函数，其工作方式与第一个示例所示的构造函数完全一样。\n"
- fmt: "\n![Warning](images/warning.png) The default constructor is not created if\
    \ you declare any constructors for the class. As a result, if you declare a constructor\
    \ that accepts parameters and still want to have an empty constructor (with no\
    \ parameters and no body), you must explicitly declare an empty constructor for\
    \ the class.\n\nAn example might clear this point up. The following code does\
    \ not compile:\n\n```java\npublic class BadActorApp\n{\n    public static void\
    \ main(String[] args)\n    {\n        Actor a = new Actor(); // error: won't compile\n\
    \    }\n}\nclass Actor\n{\n    private String lastName;\n    private String firstName;\n\
    \    private boolean goodActor;\n    public Actor(String last, String first)\n\
    \    {\n        lastName = last;\n        firstName = first;\n    }\n    public\
    \ Actor(String last, String first, boolean good)\n    {\n        lastName = last;\n\
    \        firstName = first;\n        goodActor = good;\n    }\n}\n```\n\nThis\
    \ program won’t compile because it doesn’t explicitly provide a default constructor\
    \ for the `Actor` class; because it does provide other constructors, the default\
    \ constructor isn’t generated automatically.\n\n### Calling other constructors\n\
    \nA constructor can call another constructor of the same class by using the special\
    \ keyword `this` as a method call. This technique is commonly used when you have\
    \ several constructors that build on one another.\n\nConsider this class:\n\n\
    ```java\npublic class Actor\n{\n    private String lastName;\n    private String\
    \ firstName;\n    private boolean goodActor;\n    public Actor(String last, String\
    \ first)\n    {\n        lastName = last;\n        firstName = first;\n    }\n\
    \    public Actor(String last, String first, boolean good)\n    {\n        this(last,\
    \ first);\n        goodActor = good;\n    }\n}\n```\n\nHere the second constructor\
    \ calls the first constructor to set the `lastName` and `firstName` fields. Then\
    \ it sets the `goodActor` field. Writing constructors like this is helpful because\
    \ it avoids the need for duplicate code.\n\nYou have a few restrictions in using\
    \ the `this` keyword as a constructor call:\n\n- You can call another constructor\
    \ only in the very first statement of a constructor. Thus, the following code\
    \ won’t compile:\n\n```java\npublic Actor(String last, String first, boolean good)\n\
    {\n    goodActor = good;\n    this(last, first); // error: won't compile\n}\n\
    ```\n\nIf you try to compile a class with this constructor, you get a message\
    \ saying `call to this must be first statement in constructor`.\n\n- Each constructor\
    \ can call only one other constructor, but you can chain constructors. If a class\
    \ has three constructors, the first constructor can call the second one, which\
    \ in turn calls the third one.\n\n- You can’t create loops in which constructors\
    \ call one another. Here’s a class that won’t compile:\n\n```java\nclass CrazyClass\n\
    {\n    private String firstString;\n    private String secondString;\n    public\
    \ CrazyClass(String first, String second)\n    {\n        this(first);\n     \
    \   secondString = second;\n    }\n    public CrazyClass(String first)\n    {\n\
    \        this(first, \"DEFAULT\"); // error: won't compile\n    }\n}\n```\n\n\
    The first constructor starts by calling the second constructor, which calls the\
    \ first constructor. The compiler complains that this error is a `recursive constructor\
    \ invocation` and politely refuses to compile the class.\n\nChapter 11\n\n# Using\
    \ Subclasses and Inheritance\n\n## IN THIS CHAPTER\n\n- ![Bullet](images/check.png)\
    \ **Explaining inheritance**\n- ![Bullet](images/check.png) **Creating subclasses**\n\
    - ![Bullet](images/check.png) **Using protected access**\n- ![Bullet](images/check.png)\
    \ **Creating final classes**\n\nA Java class can be based on another class. Then\
    \ the class becomes like a child to the parent class: It inherits all the characteristics\
    \ of the parent class, good and bad. All the visible fields and methods of the\
    \ parent class are passed on to the child class. The child class can use these\
    \ fields or methods as they are, or it can override them to provide its own versions.\
    \ In addition, the child class can add fields or methods of its own.\n\nIn this\
    \ chapter, you discover how this magic works, along with the basics of creating\
    \ and using Java classes that inherit other classes. You also find out a few fancy\
    \ tricks that help you get the most out of inheritance.\n\n## Introducing Inheritance\n\
    \nThe word inheritance conjures up several noncomputer meanings:\n\n- Children\
    \ inherit certain characteristics from the parents.\n- Children can also inherit\
    \ behavior from their parents. As they say, the apple doesn’t fall far from the\
    \ tree.\n- When someone dies, their heirs get their stuff. Some of it is good\
    \ stuff, but some of it may not be.\n- You can inherit rights as well as possessions.\
    \ You may be a citizen of a country by virtue of being born to parents who are\
    \ citizens of that country.\n\nIn Java, inheritance refers to a feature of object-oriented\
    \ programming that lets you create classes that are derived from other classes.\
    \ A class that’s based on another class is said to inherit the other class. The\
    \ class that is inherited is called the `parent class`, the `base class`, or the\
    \ `superclass`. The class that is the inheriting is called the `child class`,\
    \ the `derived class`, or the `subclass`.\n\n![Tip](images/tip.png) The terms\
    \ `subclass` and `superclass` seem to be the preferred terms among Java gurus.\
    \ So if you want to look like you know what you’re talking about, use these terms.\
    \ Also, be aware that the term `subclass` can be used as a verb. When you create\
    \ a subclass that inherits a base class, for example, you are subclassing the\
    \ base class.\n\nYou need to know a few important things about inheritance:\n\n\
    - A derived class automatically takes on all the behavior and attributes of its\
    \ base class. Thus, if you need to create several classes to describe types that\
    \ aren’t identical but have many features in common, you can create a base class\
    \ that defines all the common features. Then you can create several derived classes\
    \ that inherit the common features.\n- A derived class can add features to the\
    \ base class it inherits by defining its own methods and fields. This is one way\
    \ that a derived class distinguishes itself from its base class.\n- A derived\
    \ class can also change the behavior provided by the base class. A base class\
    \ may provide that all classes derived from it have a method named `play`, for\
    \ example, but each class is free to provide its own implementation of the `play`\
    \ method. In this case, any class that extends the base class can provide its\
    \ own implementation of the `play` method.\n- ![Tip](image-src:images/tip.png)\
    \ Inheritance is best used to implement *is-a-type-of* relationships. Here are\
    \ a few examples: Solitaire is a type of game; a truck is a type of vehicle; an\
    \ invoice is a type of transaction. In each case, a particular kind of object\
    \ is a specific type of more general category of objects.\n\nThe following sections\
    \ provide more examples that help illustrate these points.\n\n### Motorcycles,\
    \ trains, and automobiles\n\nInheritance is often explained in terms of real-world\
    \ objects such as cars and motorcycles or birds and reptiles. Consider various\
    \ types of vehicles. Cars and motorcycles are two distinct types of vehicles.\
    \ If you’re writing software that represents vehicles, you could start by creating\
    \ a class called `Vehicle` that would describe the features that are common to\
    \ all types of vehicles, such as wheels; a driver; the ability to carry passengers;\
    \ and the ability to perform actions such as driving, stopping, turning, and crashing.\n\
    \nA motorcycle is a type of vehicle that further refines the `Vehicle` class.\
    \ The `Motorcycle` class would inherit the `Vehicle` class, so it would have wheels;\
    \ a driver; possibly passengers; and the ability to drive, stop, turn, and crash.\
    \ In addition, it would have features that differentiate it from other types of\
    \ vehicles, such as two wheels and handlebars used for steering control.\n"
