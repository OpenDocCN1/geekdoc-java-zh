- fmt: "\n`HelloApp`: A `name` that identifies the class being defined here. Whereas\
    \ keywords, such as `public` and `class`, are words that are defined by the Java\
    \ programming language, names are words that you create to identify various elements\
    \ you use in your program. In this case, the name `HelloApp` identifies the public\
    \ class being defined here. (Although `name` is the technically correct term,\
    \ sometimes names are called `identifiers`. Technically, a name is a type of identifier,\
    \ but not all identifiers are names.)\n\n2. →2 ` {`: The opening brace on line\
    \ 2 marks the beginning of the `body` of the class. The end of the body is marked\
    \ by the closing brace on line 7. Everything that appears within these braces\
    \ belongs to the class. As you work with Java, you’ll find that it uses these\
    \ braces a lot. Pretty soon the third and fourth fingers on your right hand will\
    \ know exactly where they are on the keyboard.\n\nLines 3 through 7 define a `method`\
    \ of the `HelloApp` class named `main`:\n\n1. →3 `public`: The `public` keyword\
    \ is used again, this time to indicate that a method being declared here should\
    \ have public access. That means classes other than the `HelloApp` class can use\
    \ it. All Java programs must have a class that declares a public method named\
    \ `main`. The `main` method contains the statements that are executed when you\
    \ run the program.\n\n    `static`: The Java language requires that you specify\
    \ `static` when you declare the `main` method.\n\n    `void`: In Java, a `method`\
    \ is a unit of code that can calculate and return a value. For example, you could\
    \ create a method that calculates a sales total. Then the sales total would be\
    \ the return value of the method. If a method doesn’t need to return a value,\
    \ you must use the `void` keyword to indicate that no value is returned. Because\
    \ Java requires that the `main` method not return a value, you must specify `void`\
    \ when you declare the `main` method.\n\n    `main`: Finally, here’s the `identifier`\
    \ that provides the name for this method. As we’ve already mentioned, Java requires\
    \ that this method be named `main`. Besides the `main` method, you can create\
    \ additional methods with whatever names you want to use. You discover how to\
    \ create additional methods in [Chapter 8](#c08.xhtml). Until then, the programs\
    \ consist of just one method named `main`.\n\n    `(String[] args)`: Oh, boy.\
    \ This Java element is too advanced to thoroughly explain just yet. It’s called\
    \ a `parameter list`, and it’s used to pass data to a method. Java requires that\
    \ the `main` method must receive a single parameter that’s an array of `String`\
    \ objects. By convention, this parameter is named `args`. If you don’t know what\
    \ a parameter, a `String`, or an array is, don’t worry about it. You can find\
    \ out what a `String` is in the next chapter, and parameters are in [Chapter 8](#c08.xhtml);\
    \ arrays are in [Chapter 12](#c12.xhtml). In the meantime, realize that you have\
    \ to code(`String[] args`) on the declaration for the `main` methods in all your\
    \ programs.\n\n2. →4 Another `{`: Another set of braces begins at line 4 and ends\
    \ at line 6. These braces mark the body of the `main` method. Notice that the\
    \ closing brace in line 6 is paired with the opening brace in line 4, whereas\
    \ the closing brace in line 7 is paired with the one in line 2. This type of pairing\
    \ is commonplace in Java. In short, whenever you come to a closing brace, it’s\
    \ paired with the most recent opening brace that hasn’t already been closed —\
    \ that is, that hasn’t already been paired with a closing brace.\n\n3. →5 `System.out.println(\"\
    Hello, World!\");`: This is the only statement in the entire program. It calls\
    \ a method named `println` that belongs to the `System.out` object. The `println`\
    \ method displays a line of text on the console. The text to be displayed is passed\
    \ to the `println` method as a parameter in parentheses following the word `println`.\
    \ In this case, the text is the string literal `Hello, World!` enclosed in a set\
    \ of quotation marks. As a result, this statement displays the text `Hello, World!`\
    \ on the console.\n\n    Note that in Java, most (but not all) statements must\
    \ end with a semicolon. Because this statement is the only one in the program,\
    \ this line is the only one that requires a semicolon.\n\n4. →6 `}`: Line 6 contains\
    \ the closing brace that marks the end of the `main` method body that was begun\
    \ by the brace on line 4.\n\n5. →7 Another `}`: Line 7 contains the closing brace\
    \ that marks the end of the `HelloApp` class body that was begun by the brace\
    \ on line 2. Because this program consists of just one class, this line also marks\
    \ the end of the program.\n\nTo run this program, you must first use a text editor\
    \ such as Notepad or TextPad to enter it — exactly as it appears in [Listing 3-1](#c03.xhtml_c03-fea-0001)\
    \ — in a text file named `HelloApp.java`. Then you can compile it by running the\
    \ following command at a command prompt (refer to [Chapter 13](#c13.xhtml)):\n\
    \n```bash\njavac HelloApp.java\n```\n\nThis command creates a class file named\
    \ `HelloApp.class` that contains the Java bytecode compiled for the `HelloApp`\
    \ class.\n\nYou can run the program by entering this command (again, check out\
    \ [Chapter 13](#c13.xhtml)):\n\n```bash\njava HelloApp\n```\n\nNow that you’ve\
    \ seen what a Java program looks like, you’re in a better position to understand\
    \ exactly what this does. The rest of this chapter describes some of the basic\
    \ elements of the Java language in greater detail.\n\n## Dealing with Keywords\n\
    \nA `keyword` is a word that has special meaning defined by the Java programming\
    \ language. The program shown earlier uses four keywords: `public`, `class`, `static`,\
    \ and `void`. In all, Java has 53 keywords. They’re listed in alphabetical order\
    \ in [Table 3-1](#c03.xhtml_rc03-tbl-0001).\n\nLike everything else in Java, keywords\
    \ are case-sensitive. Thus, if you type `If` instead of `if` or `For` instead\
    \ of `for`, the compiler complains about your error. Because Visual Basic keywords\
    \ begin with capital letters, you’ll make this mistake frequently.\n"
