  raw: '*   For scoping purposes, the `try` block is its own self-contained block,
    separate from the `catch` block. As a result, any variables you declare in the
    `try` block are not visible to the `catch` block. If you want them to be, declare
    them immediately before the `try` statement.


    *   You can also code a special block (called a *finally block*) after all the
    `catch` blocks. For more information about coding `finally` blocks, see the section
    “[Using a `finally` Block](#c09.xhtml_c09-sec-0010),” later in this chapter.


    *   The various exception classes in the Java API are defined in different packages.
    If you use an exception class that isn’t defined in the standard `java.lang` package
    that’s always available, you need to provide an `import` statement for the package
    that defines the exception class.


    ### A simple example


    To illustrate how to provide for an exception, here’s a program that divides two
    numbers and uses a `try`/`catch` statement to catch an exception if the second
    number turns out to be zero:


    `public class DivideByZero`


    `{`


    `public static void main(String[] args)`


    `{`


    `int a = 5;`


    `int b = 0; // you know this won''t work!`


    `try`


    `{`


    `int c = a / b; // but you try it anyway`


    `}`


    `catch (ArithmeticException e)`


    `{`


    `System.out.println("Oops, you can''t divide by zero.");`


    `}`


    `}`


    `}`


    Here, the division occurs within a `try` block, and a `catch` block handles `ArithmeticException`.
    `ArithmethicException` is defined by `java.lang`, so an `import` statement for
    it isn’t necessary.


    When you run this program, the following is displayed on the console:


    `Oops, you can''t divide by zero.`


    There’s nothing else to see here. The next section shows a more complicated example,
    though.


    ### Another example


    [Listing 9-1](#c09.xhtml_c09-fea-0001) shows a simple example of a program that
    uses a method to get a valid integer from the user. If the user enters a value
    that isn’t a valid integer, the `catch` block catches the error and forces the
    loop to repeat.


    [LISTING 9-1](#c09.xhtml_rc09-fea-0001) Getting a Valid Integer


    `import java.util.*;`


    `public class GetInteger`


    `{`


    `static Scanner sc = new Scanner(System.in);`


    `public static void main(String[] args)`


    `{`


    `System.out.print("Enter an integer: ");`


    `int i = GetAnInteger();`


    `System.out.println("You entered " + i);`


    `}`


    `public static int GetAnInteger()`


    `{`


    `while (true)`


    `{`


    `try`


    `{`


    `return sc.nextInt();`


    `}`


    `catch (InputMismatchException e)`


    `{`


    `sc.next();`


    `System.out.print("That''s not "`


    `+ "an integer. Try again: ");`


    `}`


    `}`


    `}`


    `}`


    Here the statement that gets the input from the user and returns it to the calling
    method is coded within the `try` block. If the user enters a valid integer, this
    statement is the only one in this method that gets executed.


    If the user enters data that can’t be converted to an integer, however, the `nextInt`
    method throws an `InputMismatchException`. Then this exception is intercepted
    by the `catch` block — which disposes of the user’s incorrect input by calling
    the `next` method and then displays an error message. Then the `while` loop repeats.


    Here’s what the console might look like for a typical execution of this program:


    `Enter an integer:` **`three`**


    `That''s not an integer. Try again:` **`3.001`**


    `That''s not an integer. Try again:` **`3`**


    `You entered 3`


    Here are a couple other things to note about this program:


    *   The `import` statement specifies `java.util.*` to import all the classes from
    the `java.util` package. That way, the `InputMismatchException` class is imported.


    *   The `next` method must be called in the `catch` block to dispose of the user’s
    invalid input because the `nextInt` method leaves the input value in the `Scanner`’s
    input stream if an `InputMismatchException` is thrown. If you omit the statement
    that calls `next`, the `while` loop keeps reading it, throws an exception, and
    displays an error message in an infinite loop. If you don’t believe us, look at
    [Figure 9-1](#c09.xhtml_c09-fig-0001). We found this error out the hard way. (The
    only way to make it stop is to close the console window.)


    ![Screenshot shows the repeated lines of text indicate that a user is encountering
    an error while trying to input an integer value.](images/9781394296972-fg0901.png)


    [FIGURE 9-1:](#c09.xhtml_rc09-fig-0001) Why you have to call next to discard the
    invalid input.


    ## Handling Exceptions with a Preemptive Strike


    The `try` statement is a useful and necessary tool in any Java programmer’s arsenal.
    The best way to handle exceptions, however, is to prevent them from happening
    in the first place. That’s not possible all the time, but in many cases it is.
    The key is to test your data before performing the operation that can lead to
    an exception and then skipping or bypassing the operation of the data that is
    problematic. (One thing we really hate is problematic data.)


    For example, you can usually avoid the `ArithmethicException` that results from
    dividing integer data by zero by checking the data before performing the division:


    `if (b != 0)`


    `c = a / b;`


    This eliminates the need to enclose the division in a `try` block, because you
    know that the division by zero won’t happen.


    You can apply this same technique to input validation by using the `hasNextInt`
    method of the `Scanner` class. This method checks the next input value to make
    sure it’s a valid integer. (The `Scanner` class calls the next input value a *token,*
    but that won’t be on the test.) You can do this technique in several ways, and
    we’ve been encouraging you to ponder the problem since [Chapter 4](#c04.xhtml).
    Now behold the long-awaited answer: [Listing 9-2](#c09.xhtml_c09-fea-0002) shows
    a version of the `GetInteger` method that uses a `while` loop to avoid the exception.


    [LISTING 9-2](#c09.xhtml_rc09-fea-0002) Another Version of the GetInteger Method


    `import java.util.*;`


    `public class GetInteger2`


    `{`


    `static Scanner sc = new Scanner(System.in);`


    `public static void main(String[] args)`


    `{`


    `System.out.print("Enter an integer: ");`


    `int i = GetAnInteger();`


    `System.out.println("You entered " + i);`


    `}`


    `public static int GetAnInteger()`


    `{`


    `while (!sc.hasNextInt())`


    `{`


    `sc.next();`


    `System.out.print("That''s not an integer. Try again: ");`


    `}`


    `return sc.nextInt();`


    `}`


    `}`


    This is a clever little bit of programming, don’t you think? The conditional expression
    in the `while` statement calls the `hasNextInt` method of the `Scanner` to see
    whether the next value is an integer. The `while` loop repeats as long as this
    call returns `false`, indicating that the next value is not a valid integer. The
    body of the loop calls `nextLine` to discard the bad data and then displays an
    error message. The loop ends only when you know that you have good data in the
    input stream, so the `return` statement calls `nextInt` to parse the data to an
    integer and return the resulting value.


    ## Catching All Exceptions at Once


    Java provides a catch-all exception class called `Exception` that all other types
    of exceptions are based on. (Don’t worry about the details of what we mean by
    that. When you read [Chapter 11](#c11.xhtml), it makes more sense.)


    If you don’t want to be too specific in a `catch` block, you can specify `Exception`
    instead of a more specific exception class. For example:


    `try`


    `{`


    `int c = a / b;`


    `}`


    `catch (Exception e)`


    `{`


    `System.out.println("Oops, you can''t divide by zero.");`


    `}`


    In this example, the `catch` block specifies `Exception` rather than `ArithmeticException`.


    If you have some code that might throw several types of exceptions, and you want
    to provide specific processing for some types but general processing for all the
    others, code the `try` statement this way:


    `try`


    `{`


    `// statements that might throw several types of exceptions`


    `}`


    `catch (InputMismatchException e)`


    `{`


    `// statements that process InputMismatchException`


    `}`


    `catch (IOException e)`


    `{`'
