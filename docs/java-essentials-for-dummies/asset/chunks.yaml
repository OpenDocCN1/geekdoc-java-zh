    # 引言


    欢迎阅读 *Java Essentials For Dummies*。本书包含了你入门所需的所有信息，从变量开始到异常结束。这里的核心思想是，我们提炼了最重要的主题：设置与配置、基础编程、面向对象、类和对象、异常处理以及数组的使用。


    因此，无论你是新手还是资深人士，你都找到了这本书。本书采用易于理解的 *For Dummies* 格式设计，帮助你获取所需信息，而无需费力寻找。


    ## 关于本书


    在 *Java Essentials For Dummies* 中，你所需的信息都经过了方便的包装。所有信息适用于 Java 的一个近期版本。本书并未自称是所有可能主题的参考书。相反，它教你如何快速上手，以便你有更多时间去做真正想做的事。


    ## 盲目假设


    我们从未见过，因此很难对你为什么这本书感兴趣做出任何假设。然而，让我们从几个基本假设开始：


    - 你拥有或可以使用一台相对现代电脑。示例是在 Windows 电脑上创建的，但你可以在 Mac 或 Linux 电脑上同样轻松学习编程。

    - 你是丰富的电脑用户。换句话说，我们假设你电脑的基本操作，例如启动程序和处理文件系统。

    - 你对学习使用 Java 语言编程感兴趣。这是本书的主题，所以这是一个合理的假设。


    我们*并不*假设你有任何 Java 或其他语言的编程经验。


    ## 本书中使用的图标


    与任何 *For Dummies* 书一样，本书充满了实用的图标，引导你注意特别重要的事项。你会在书中看到以下图标：


