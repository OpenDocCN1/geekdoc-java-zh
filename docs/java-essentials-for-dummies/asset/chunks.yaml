    \ an entry that begins with `C:\\Program Files\\Java`. If you find such an entry,\
    \ select it and then click Delete.\n\n### 10. Click the New button.\n\nThis opens\
    \ a line for you to create a new path entry.\n\n![Screenshot of the “Edit environment\
