    \n# 第 7 章\n# 转圈圈（或者，使用循环）\n\n## 本章内容\n\n- `while` 循环的魅力\n- `do` 循环的精妙\n- `for`\
    \ 循环的奇妙\n\n在本章，你将学会如何使用`loops` 来编写让程序运行的程序，这允许它们多次执行相同的语句。\n\n循环是编写最常见程序之一的关键：从用户处获取输入，进行处理，从用户处获取更多输入并进行处理，并持续下去，直到用户满意为止。\n\
    \n换句话说，循环就像洗发水瓶上的说明：揉泡沫。冲洗。*重复。*\n\n## 使用你的基础 while 循环\n\nJava 中所有循环语句中最基础的是 `while`。`while`\
