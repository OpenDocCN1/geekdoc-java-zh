    | `i == j - 5` | `true` | `i` is `5`, and `j – 5` is `5`. |\n| `i > 1` | `true`\
    \ | `i` is `5`, which is greater than `1`. |\n| `j == i * 2` | `true` | `j` is\
    \ `10`, and `i` is `5`, so `i * 2` is also `10`. |\n| `x == i` | `true` | Casting\
    \ allows the comparison, and `5.0` is equal to `5`. |\n| `k < z` | `false` | Casting\
    \ allows the comparison, and `15` is greater than `12.3`. |\n| `i * 2 < y` | `false`\
    \ | `i * 2` is `10`, which is not less than `7.5`. |\n\n![Warning](images/warning.png)\
