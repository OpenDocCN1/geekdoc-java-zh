    \ none of the other `if` statements are evaluated.\n\n## Using Mr. Spock’s Favorite\
    \ Operators (Logical Ones, of Course)\n\nA *logical operator* (sometimes called\
    \ a *Boolean operator)* is an operator that returns a Boolean result that’s based\
    \ on the Boolean result of one or two expressions. Expressions that use logical\
    \ operators are sometimes called *compound expressions* because the effect of\
    \ the logical operators is to let you combine two or more condition tests into\
    \ a single expression. [Table 6-2](#c06.xhtml_c06-tbl-0002) lists the logical\
    \ operators.\n\nThe following sections describe most of these operators in excruciating\
    \ detail.\n\n### Using the ! operator\n\nThe simplest of the logical operators\
    \ is *Not* (`!`). Technically, it’s a *unary* prefix operator, which means that\
    \ you use it with one operand, and you code it immediately in front of that operand.\
    \ (Technically, this operator is called the *complement operator*, not the *Not\
