    \ extends Ball\n{\n  public BaseballBall()\n  {\n    setWeight(5.125);\n  }\n\
    }\n```\n\n在这里，`getWeight` 和 `setWeight` 方法被声明为 `protected` 访问，这意味着它们在子类 `BaseballBall`\
    \ 中可见。然而，这些方法对于没有扩展 `Ball` 的类是不可见的。\n\n## 在子类中使用 `this` 和 `super` 关键字\n\n`this`\
    \ 关键字提供了一种引用当前对象实例的方法。它通常用于区分局部变量或参数与同名的类字段。例如：\n\n```java\npublic class Ball\n\
    {\n  private int velocity;\n  public void setVelocity(int velocity)\n  {\n   \
    \ this.velocity = velocity;\n  }\n}\n```\n\n在这里，`this` 关键字表示赋值语句左侧引用的 `velocity`\
    \ 变量是名为 `velocity` 的类字段，而不是同名的参数。\n\n但如果你需要引用属于基类的字段或方法怎么办？要做到这一点，你需使用 `super`\
    \ 关键字。它的工作方式与 `this` 类似，但引用的是基类的实例，而不是当前类的实例。\n\n考虑这两个类：\n\n```java\npublic class\
    \ Ball\n{\n  public void hit()\n  {\n    System.out.println(\"You hit it a mile!\"\
    );\n  }\n}\n\nclass BaseballBall extends Ball\n{\n  public void hit()\n  {\n \
    \   System.out.println(\"You tore the cover off!\");\n    super.hit();\n  }\n\
    }\n```\n\n在这里，`BaseballBall` 类中的 `hit` 方法调用了其基类对象的 `hit` 方法。因此，如果你调用 `BaseballBall`\
    \ 对象的 `hit` 方法，控制台上将显示以下两行：\n\n```\nYou tore the cover off!\nYou hit it a mile!\n\
    ```\n\n你可以在子类的构造函数中使用 `super` 关键字来显式地调用父类的构造函数。更多信息请参见下一节。\n\n## 理解继承和构造函数\n\n\
    当你创建一个子类的实例时，Java 在执行子类构造函数之前会自动调用基类的默认构造函数。考虑以下类：\n\n```java\npublic class Ball\n\
    {\n  public Ball()\n  {\n    System.out.println(\"Hello from the Ball constructor\"\
    );\n  }\n}\n\npublic class BaseballBall extends Ball\n{\n  public BaseBall()\n\
    \  {\n    System.out.println(\"Hello from the BaseballBall constructor\");\n \
    \ }\n}\n```\n\n如果你创建一个 `BaseballBall` 类的实例，控制台上将显示以下两行：\n\n```\nHello from the\
    \ Ball constructor\nHello from the BaseballBall constructor\n```\n\n如果你愿意，可以使用\
    \ `super` 关键字从子类显式地调用基类构造函数。由于 Java 会自动为你调用无参构造函数，你这么唯一理由是为了调用带参数的基类构造函数。这里是 `Ball`\
    \ 和 `BaseballBall` 类的版本，其中 `BaseballBall` 构造函数调用了带参数的 `Ball` 构造函数：\n\n```java\n\
    public class Ball\n{\n  private double weight;\n  public Ball(double weight)\n\
    \  {\n    this.weight = weight;\n  }\n}\n\npublic class BaseballBall extends Ball\n\
    {\n  public BaseballBall()\n  {\n    super(5.125);\n  }\n}\n```\n\n在这里，`BaseballBall`\
    \ 构造函数调用 `Ball` 构造函数为球提供默认重量。\n\n![Remember](img/remember.png) 处理父类构造函数时，你需要遵守一些规则和规定：\n\
    \n- 如果你使用 `super` 调用父类构造函数，必须在构造函数的第一条语句中这样做。\n- ![Warning](img/warning.png) 如果你没有显式调用\
    \ `super`，编译器会插入对基类无参构造函数的调用。在这种情况下，基类必须有一个无参构造函数。如果基类没有无参构造函数，编译器将拒绝编译程序。\n-\
    \ 如果父类本身也是子类，则其父类的构造函数的调用方式相同。这会一直持续到继承层次结构的顶部，即 `Object` 类，因为它没有父类。\n\n## 使用\
    \ `final` 关键字\n\nJava 有一个 `final` 关键字，具有三个用途。当你对变量使用 `final` 时，它会创建一个常量，其值在初始化后无法更改。常量将在第\
    \ 4 章中介绍，因此我们在这里不描述 `final` 关键字的这种用法。`final` 的另外两个用途是创建最终方法和最终类。\n\n### 最终方法\n\
    \n*最终方法*不能被子类重写的方法。要创建最终方法，只需将 `final` 关键字添加到方法声明中。例如：\n\n```java\npublic class\
    \ SpaceShip\n{\n  int velocity = 0;\n  public final int getVelocity()\n  {\n \
    \   return this.velocity;\n  }\n}\n```\n\n在这里，`getVelocity` 方法被声明为 `final`。因此，任何使用\
    \ `SpaceShip` 作为基类的类都不能重写 `getVelocity` 方法。如果尝试，编译器会发出错误 `overridden method is\
    \ final`。\n\n### 最终类\n\n*最终类*是一个不能作为基类的类。要声明一个类为最终类，只需将 `final` 关键字添加到类声明中：\n\n\
    ```java\npublic final class BaseballBall extends Ball\n{\n  // BaseballBall 类的成员放在这里\n\
    }\n```\n\n那么没有人可以使用 `BaseballBall` 类作为基类。\n\n当你声明一个类为最终的时，它的所有方法也都都被视为最终的。当你考虑到这个问题时，这是合理的。因为你不能将最终类作为基类，所以没有任何类可能处于可以重写任何方法的位置。\n\
    \n"
- fmt: "\nThe index number is written after the variable name and enclosed in brackets.\
    \ So if the variable name is `x`, you could access a specific element with an\
    \ expression like `x[5]`.\n\n![Tip](images/tip.png) You might think that `x[5]`\
    \ would refer to the fifth element in the array. But index numbers start with\
    \ zero for the first element, so `x[5]` actually refers to the sixth element.\
    \ This little detail is one of the chief causes of problems when working with\
    \ arrays — especially if you cut your array-programming teeth in a language in\
    \ which arrays are indexed from one instead of from zero. So, in Java, get used\
    \ to counting from zero instead of from one.\n\nThe real power of arrays comes\
    \ from the simple fact that you can use a variable or even a complete expression\
    \ as an array index. So (for example) instead of coding `x[5]`to refer to a specific\
    \ array element, you can code `x[i]`-to refer to the element indicated by the\
    \ index variable `i`. You see plenty of examples of index variables throughout\
    \ this chapter.\n\nHere are a few additional tidbits of array information to ponder\
    \ before you get into the details of creating and using arrays:\n\n*   Even though\
    \ an array has no corresponding class file, an array is still an object. You can\
    \ refer to the array object as a whole, rather than to a specific element of the\
    \ array, by using the array’s variable name without an index. Thus, if `x[5]`refers\
    \ to an element of an array, `x` refers to the array itself.\n\n*   An array has\
    \ a fixed length that’s set when the array is created. This length determines\
    \ the number of elements that can be stored in the array. The maximum index value\
    \ you can use with any array is one less than the array’s length. Thus, if you\
    \ create an array of ten elements, you can use index values from `0` to `9`.\n\
    \n*   You can’t change the length of an array after you create the array.\n\n\
    *   You can access the length of an array by using the `length` field of the array\
    \ variable. `x.length`, for example, returns the length of the array `x`.\n\n\
    ## Creating Arrays\n\nBefore you can create an array, you must declare a variable\
    \ that refers to the array. This `variable declaration` should indicate the type\
    \ of elements that are stored by the array followed by a set of empty brackets,\
    \ like this:\n\n```java\nString[] names;\n```\n\nHere a variable named `names`\
    \ is declared. Its type is an array of `String` objects.\n\n![Tip](images/tip.png)\
    \ Both of these statements have exactly the same effect. Most Java programmers\
    \ prefer to put the brackets on the type rather than on the variable name.\n\n\
    By itself, that statement doesn’t create an array; it merely declares a variable\
    \ that can refer to an array. You can actually create the array in two ways:\n\
    \n*   Use the `new` keyword followed by the array type, this time with the brackets\
    \ filled in to indicate how many elements the array can hold. For example:\n\n\
    \    ```java\n    String[] names;\n    names = new String[10];\n    ```\n\n  \
    \  Here, an array of `String` objects that can hold ten strings is created. Each\
    \ of the strings in this array is initialized to an empty string.\n\n*   As with\
    \ any other variable, you can combine the declaration and the creation into one\
    \ statement:\n\n    ```java\n    String[] names = new String[10];\n    ```\n\n\
    \    The array variable is declared and an array is created in one statement.\n\
    \n*   Use a special shortcut that lets you create an array and populate it with\
    \ values in one swoop:\n\n    ```java\n    String[] names = {\"One\", \"Two\"\
    , \"Three\"};\n    ```\n\n![Tip](images/tip.png) If you don’t know how many elements\
    \ the array needs at compile time, you can use a variable or an expression for\
    \ the array length. Here’s a routine from a method that stores player names in\
    \ an array of strings. It starts by asking the user how many players are on the\
    \ team. Then it creates an array of the correct size:\n\n    ```java\n    System.out.print(\"\
    How many players? \");\n    int count = sc.nextInt(); // sc is a Scanner\n   \
    \ String[] players = new String[count];\n    ```\n\n## Initializing an Array\n\
    \nOne way to initialize the values in an array is to simply assign them one by\
    \ one:\n\n```java\nString[] days = new String[7];\ndays[0] = \"Sunday\";\ndays[1]\
    \ = \"Monday\";\ndays[2] = \"Tuesday\";\ndays[3] = \"Wednesday\";\ndays[4] = \"\
    Thursday\";\ndays[5] = \"Friday\";\ndays[6] = \"Saturday\";\n```\n\nJava has a\
    \ shorthand way to create an array and initialize it with values:\n\n```java\n\
    String[] days = { \"Sunday\", \"Monday\", \"Tuesday\",\n\"Wednesday\", \"Thursday\"\
    ,\n\"Friday\", \"Saturday\" };\n```\n\nHere each element to be assigned to the\
    \ array is listed in an `array initializer`. Here’s an example of an array initializer\
    \ for an `int` array:\n\n```java\nint[] primes = { 2, 3, 5, 7, 11, 13, 17 };\n\
    ```\n\n**Note:** The length of an array created with an initializer is determined\
    \ by the number of values listed in the initializer.\n\nAn alternative way to\
    \ code an initializer is this:\n\n```java\nint[] primes = new int[] { 2, 3, 5,\
    \ 7, 11, 13, 17 };\n```\n\nTo use this type of initializer, you use the `new`\
    \ keyword followed by the array type and a set of empty brackets.\n\n## Using\
    \ for Loops with Arrays\n\nOne of the most common ways to process an array is\
    \ with a `for` loop. In fact, `for` loops were invented specifically to deal with\
    \ arrays. Here’s a `for` loop that creates an array of 100 numbers, with values\
    \ ranging from `1` to `100`:\n\n```java\nint[] numbers = new int[100];\nfor (int\
    \ i = 0; i < 100; i++)\n    numbers[i] = (int)(Math.random() * 100) + 1;\n```\n\
    \nAnd here’s a loop that fills an array with strings entered by the user:\n\n\
    ```java\nScanner sc = new Scanner();\nint count = 5;\nString[] players = new String[count];\n\
    for (int i = 0; i < count; i++)\n{\n    System.out.print(\"Enter player name:\
    \ \");\n    players[i] = sc.nextLine(); // sc is a Scanner\n}\n```\n\nThe preceding\
    \ example assumes that the length was stored in a variable before the loop was\
    \ executed. If you don’t have the array length handy, you can get it from the\
    \ array’s `length`:\n\n```java\nfor (int i = 0; i < players.length; i++)\n   \
    \ System.out.println(players[i]);\n```\n\n### Solving a homework problem with\
    \ an array\n\nEvery once in a while, an array and a `for` loop or two can help\
    \ you solve your kids’ homework problems for them. One of us once helped a daughter\
    \ solve a tough homework assignment for a seventh-grade math class. The problem\
    \ was stated something like this:\n\nBobo (these problems always had a character\
    \ named Bobo) visits the local high school on a Saturday and finds that all the\
    \ school’s 1000 lockers are neatly closed. So he starts at one end of the school\
    \ and opens them all. Then he goes back to the start and closes every other locker\
    \ (lockers 2, 4, 6, and so on). Then he goes back to the start and hits every\
    \ third locker: If it’s open, he closes it; if it’s closed, he opens it. Then\
    \ he hits every fourth locker, every fifth locker, and so on. He keeps doing this\
    \ all long long, walking the hallways opening and closing lockers 1000 times.\
    \ Then he gets bored and goes home. How many of the school’s 1000 lockers are\
    \ left open, and which ones are they?\n\nSheesh!\n\nThis problem presented a challenge,\
    \ but also a great opportunity to learn about `for` loops and arrays. We wrote\
    \ a little program that sets up an array of 1000 Booleans. Each represents a locker:\
    \ `true` meant open, and `false` meant closed. The program uses a pair of nested\
    \ `for` loops to do the calculation.\n\nHowever, the lockers are numbered 1 to\
    \ 1000, but the elements in the array are numbered `0` to `999`, so that discrepancy\
    \ is going to cause problems.\n\nOur solution was to create the array with 1001\
    \ elements and ignore the first one. That way, the indexes corresponded nicely\
    \ to the locker numbers.\n"
