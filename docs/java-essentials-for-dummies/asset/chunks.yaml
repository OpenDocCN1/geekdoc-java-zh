    # Introduction


    Welcome to *Java Essentials For Dummies.* This book contains all the information
    you need to get going, starting with variables and ending with exceptions. The
    basic idea here is that we’ve tried to wring out the most important topics: setup
    and configuration, basic programming, object-oriented programming, classes and
    objects, handling exceptions, and using arrays.


    So, whether you’re just getting started or you’re a seasoned pro, you’ve found
    the right book. Designed using the easy-to-follow *For Dummies* format, this book
    helps you get the information you need without laboring to find it.


    ## About This Book


    In *Java Essentials For Dummies,* all the information you need is conveniently
    packaged for you. All information is current for a recent release of Java. This
    book doesn’t pretend to be a comprehensive reference for every possible topic.
    Instead, it shows you how to get up and running fast so that you have more time
    to do the things you really want to.


    ## Foolish Assumptions


    We’ve never met, so it’s difficult for us to make any assumptions about why you’re
    interested in this book. However, let’s start with a few basic assumptions:


    - You own or have access to a relatively modern computer. The examples were created
    on a Windows computer, but you can learn to program in Java just as easily on
    a Mac or Linux computer.

    - You’re an experienced computer user. In other words, we assume that you know
    the basics of using your computer, such as starting programs and working with
    the file system.

    - You’re interested in learning how to write programs in the Java language. That’s
    what this book is about, so it’s a fair assumption.


    We do *not* assume you have any previous programming experience in Java or in
    any other programming language.


    ## Icons Used in This Book


    Like any *For Dummies* book, this book is chock-full of helpful icons that draw
    your attention to items of particular importance. You find the following icons
    throughout this book:


    - **Warning:** Danger, Will Robinson! This icon highlights information that may
    help you avert disaster.

    - **Remember:** Did we tell you about the memory course we took?

    - **Tip:** Pay special attention to this icon; it lets you know that some particularly
    useful tidbit is at hand.


