    \n`import javax.swing.JOptionPane;`\n\n`public class DialogApp`\n\n`{`\n\n`public\
    \ static void main(String[] args)`\n\n`{`\n\n`String s;`\n\n`s = JOptionPane.showInputDialog`\n\
    \n`(\"Enter an integer:\");`\n\n`int x = Integer.parseInt(s);`\n\n`System.out.println(\"\
    You entered \" + x + \".\");`\n\n`}`\n\n`}`\n\n## Using the Unary Plus and Minus\
    \ Operators\n\nThe unary plus (+) and minus (-) operators let you change the sign\
    \ of an operand. The unary minus operator doesn’t necessarily make an operand\
    \ have a negative value. Instead, it changes whatever sign the operand has to\
    \ start with. Thus, if the operand starts with a positive value, the unary minus\
    \ operator changes it to negative. But if the operand starts with a negative value,\
    \ the unary minus operator makes it positive. The following examples illustrate\
    \ this point:\n\n`int a = 5; // a is 5`\n\n`int b = -a; // b is -5`\n\n`int c\
    \ = -b; // c is +5`\n\n## Using the Increment and Decrement Operators\n\nOne of\
    \ the most common operations in computer programming is adding or subtracting\
    \ 1 from a variable. Adding 1 to a variable is called *incrementing* the variable.\
    \ Subtracting 1 is called *decrementing.* The traditional way to increment a variable\
    \ is this:\n\n`a = a + 1;`\n\nHere the expression `a + 1` is calculated, and the\
    \ result is assigned to the variable `a`.\n\nJava provides an easier way to do\
    \ this type of calculation: the increment (`++`) and decrement (`--`) operators.\
    \ Thus, to increment the variable `a`, you can code just this:\n\n`a++;`\n\nNote\
    \ that you can use an increment or decrement operator in an assignment statement.\
    \ Here’s an example:\n\n`int a = 5;`\n\n`int b = a--; // b is set to 4, a is set\
    \ to 5`\n\nWhen the second statement is executed, the assignment is performed\
    \ first, so b is set to 5\\. Then, a is decremented to 4.\n\n## Using the Conditional\
    \ Operator\n\nJava has a special operator called the *conditional operator* that’s\
    \ designed to eliminate the need for `if` statements in certain situations. The\
    \ general form for using the conditional operator is this:\n\n*`boolean-expression`*\
    \ `?` *`expression-1`* `:` *`expression-2`*\n\nThe Boolean expression is evaluated\
    \ first. If it evaluates to `true`, *`expression-1`* is evaluated, and the result\
    \ of this expression becomes the result of the whole expression. If the expression\
    \ is `false`, *`expression-2`* is evaluated, and its results are used instead.\n\
    \nSuppose that you want to assign a value of `0` to an integer variable named\
    \ `salesTier` if total sales are less than $10,000 and a value of `1` if the sales\
    \ are $10,000 or more. You could do that with this statement:\n\n`int salesTier\
    \ = salesTotal < 10000.0 ? 0 : 1;`\n\n## Comparing Strings\n\nThe correct way\
    \ to test a string for a given value is to use the `equals` method of the `String`\
    \ class:\n\n`if (answer.equals(\"Yes\"))`\n\n`System.out.println(\"The answer\
    \ is Yes.\");`"
