  trans: "\n\n![Warning](img/warning.png) 如果你在类中声明了任何构造函数，则将不会创建默认构造函数。因此，如果你声明了一个接受参数的构造函数，但仍然希望有一个空构造函数（无参数且无方法体），你必须为该类显式声明一个空构造函数。\n\
    \n下面的示例可以说明这一点：\n\n```java\npublic class BadActorApp\n{\n    public static void\
    \ main(String[] args)\n    {\n        Actor a = new Actor(); // error：无法编译\n \
    \   }\n}\nclass Actor\n{\n    private String lastName;\n    private String firstName;\n\
    \    private boolean goodActor;\n    public Actor(String last, String first)\n\
    \    {\n        lastName = last;\n        firstName = first;\n    }\n    public\
    \ Actor(String last, String first, boolean good)\n    {\n        lastName = last;\n\
    \        firstName = first;\n        goodActor = good;\n    }\n}\n```\n\n该程序无法编译，因为它没有为\
    \ `Actor` 类显式提供默认构造函数；由于它提供了其他构造函数，所以不会自动生成默认构造函数。\n\n### 调用其他构造函数\n\n构造函数可以通过使用特殊关键字\
    \ `this` 作为方法调用来调用同一类的另一个构造函数。这种技术在你有多个相互构建的构造函数时非常常用。\n\n考虑下面这个类：\n\n```java\n\
    public class Actor\n{\n    private String lastName;\n    private String firstName;\n\
    \    private boolean goodActor;\n    public Actor(String last, String first)\n\
    \    {\n        lastName = last;\n        firstName = first;\n    }\n    public\
    \ Actor(String last, String first, boolean good)\n    {\n        this(last, first);\n\
    \        goodActor = good;\n    }\n}\n```\n\n在这里，第二个构造函数调用第一个构造函数来设置 `lastName`\
    \ 和 `firstName` 字段。然后它设置了 `goodActor` 字段。这样编写构造函数是有帮助的，因为避免了重复代码。\n\n在使用 `this`\
    \ 关键字作为构造函数调用时，你有几个限制：\n\n- 你只能在构造函数的第一个语句中调用另一个构造函数。因此，以下代码无法编译：\n\n```java\n\
    public Actor(String last, String first, boolean good)\n{\n    goodActor = good;\n\
    \    this(last, first); // error：无法编译\n}\n```\n\n如果你尝试编译带有此构造函数的类，你会收到一条消息，显示\
    \ `call to this must be first statement in constructor`。\n\n- 每个构造函数只能调用另一个构造函数，但你可以对构造函数进行链式。如果一个类有三个构造函数，第一个构造函数可以调用第二个，而第二个又可以调用第三个。\n\
    \n- 你不能创建构造函数相互调用的循环。这是一个无法编译的类：\n\n```java\nclass CrazyClass\n{\n    private\
    \ String firstString;\n    private String secondString;\n    public CrazyClass(String\
    \ first, String second)\n    {\n        this(first);\n        secondString = second;\n\
    \    }\n    public CrazyClass(String first)\n    {\n        this(first, \"DEFAULT\"\
    ); // error：无法编译\n    }\n}\n```\n\n第一个构造函数开始调用第二个构造函数，而第二个构造函数又调用第一个构造函数。编译器抱怨该错误是\
    \ `recursive constructor invocation`（递归构造函数调用），并礼貌地拒绝编译该类。\n\n第 11 章\n\n# 使用子类与继承\n\
    \n## 本章内容\n\n- ![Bullet](img/check.png) **解释继承**\n- ![Bullet](img/check.png) **创建子类**\n\
    - ![Bullet](img/check.png) **使用 protected 访问权限**\n- ![Bullet](img/check.png) **创建\
    \ final 类**\n\n一个 Java 类可以基于另一个类。这时，该类就像父类的孩子：它继承了父类所有的特征，包括好的和坏的。父类所有可见的字段和方法都会传递给子类。子类可以直接使用这些字段或方法，也可以重写它们以提供它们自己的版本。此外，子类还可以添加自己的字段或方法。\n\
    \n在本章中，你将发现这种魔法是如何运作的，以及创建和使用继承其他类的 Java 类的基础。你还会发现一些帮助你充分利用继承的高技巧。\n\n## 介绍继承\n\
    \n“继承”（inheritance）一词会让人想到几种非计算机的含义：\n\n- 孩子从父母那里继承特征。\n- 孩子也可以从父母那里继承行为。正如人们所说，果不离树。\n\
    - 当某人去世时，他们的继承人获得他们的财产。其中一些是好东西，但另一些可能不是。\n- 你可以继承权利，也可以继承财产。你可能因为父母是该国家的公民而成为该国家的公民。\n\
    \n在 Java 中，继承是指面向对象编程的一项特性，它允许你创建派自其他类的类。基于另一个类的类被称为继承了另一个类。被继承的类称为 `parent class`（父类）、`base\
    \ class`（基类）或 `superclass`（超类）。继承的类称为 `child class`（子类）、`derived class`（派生类）或\
    \ `subclass`。\n\n![Tip](img/tip.png) `subclass` 和 `superclass` 似乎是 Java 大师们首选的术语。所以，如果你想看起来很专业，请使用这些术语。此外，注意\
    \ `subclass` 一词也可以用作动词。例如，当你创建一个继承基类的子类时，你正在对基类进行 `subclass` 操作。\n\n关于继承，你需要了解以下几点：\n\
    \n- 派生类自动拥有基类的所有行为和属性。因此，如果你需要创建多个描述具有共同特征但不完全相同的类，你可以创建一个定义所有共同特征的基类。\n- 派生类可以通过定义自己的方法和字段来为其继承的基类添加特征。这是派生类区分于基类的一种方式。\n\
    - 派生类还可以更改基类提供的行为。基类可以提供所有派生它的类都有一个名为 `play` 的方法（例如），但每个类都可以自由提供该方法的自己的实现。在这种情况下，任何扩展基类的类都可以提供\
    \ `play` 方法的自己的实现。\n- ![Tip](img/tip.png) 继承最适用于“是一种”（is-a-type-of）的关系。这里有一些例子：纸牌牌是一种游戏；卡车是一种车辆；发票是一种交易。在每种情况下，特定类型的对象都是更广泛的特定类型。\n\
    \n接下来的章节将提供更多示例来说明这些观点。\n\n### 摩托车、火车与汽车\n\n继承通常用现实世界的物体（如汽车和摩托车或鸟和爬行动）来解释。考虑各种车辆。汽车和摩托车是两种不同的车辆。如果你正在编写表示车辆的软件，可以从创建一个名为\
    \ `Vehicle` 的类开始，描述所有类型共有的特征，例如轮子、驾驶员、携带乘客以及执行驾驶、停止、转弯和碰撞等操作的能力。\n\n摩托车是一种进一步细化\
    \ `Vehicle` 类的车辆。`Motorcycle` 类继承 `Vehicle` 类，因此它拥有轮子、驾驶员、可能的乘客以及驾驶、停止、转弯和碰撞的能力。此外，它还有区别于其他类型车辆的特征，例如两个轮子和用于转向控制的手把。\n\
    \n"
- fmt: "\nA car is also a type of vehicle. The `Car` class would inherit the `Vehicle`\
    \ class, so it too would have wheels; a driver (usually); possibly some passengers;\
    \ and the ability to drive, stop, turn, and crash. Also, it would have some features\
    \ of its own, such as four wheels, a steering wheel, seat belts and air bags,\
    \ and an optional automatic transmission.\n\n### Game play\n\nBecause you’re unlikely\
    \ ever to write a program that simulates cars, motorcycles, and other vehicles,\
    \ take a look at a more common example: games. Suppose that you want to develop\
    \ a series of board games such as Life, Sorry!, and Monopoly. Most board games\
    \ have certain features in common:\n\n* They have a playing board with locations\
    \ that players can occupy.\n* They have players that are represented by tokens.\n\
    * The game is played by each player taking a turn, one after the other. When the\
    \ game starts, it keeps going until someone wins. (If you don’t believe us, ask\
    \ the kids who tried to stop a game of Jumanji before someone won.)\n\nEach specific\
    \ type of game has these basic characteristics but adds features of its own. The\
    \ game Life adds features such as money, insurance policies, spouses, children,\
    \ and a fancy spinner in the middle of the board. Sorry! has cards that you draw\
    \ to determine each move and safety zones within which other players can’t attack\
    \ you. Monopoly has dice that determine movement, Chance and Community Chest cards,\
    \ properties, houses, hotels, and money.\n\nIf you were designing classes for\
    \ these games, you might create a generic `BoardGame` class that defines the basic\
    \ features common to all board games and then use it as the base class for classes\
    \ that represent specific board games, such as `LifeGame`, `SorryGame`, and `MonopolyGame`.\n\
    \n### A businesslike example\n\nIf vehicles or games don’t make the point clear\
    \ enough, here’s an example from the world of business. Suppose that you’re designing\
    \ a payroll system, and you’re working on the classes that represent the employees.\
    \ You realize that the payroll includes two types of employees: salaried employees\
    \ and hourly employees. So you decide to create two classes, sensibly named `SalariedEmployee`\
    \ and `HourlyEmployee`.\n\nYou quickly discover that most of the work done by\
    \ these two classes is identical. Both types of employees have names, addresses,\
    \ Social Security numbers, totals for how much they’ve been paid for the year,\
    \ how much tax has been withheld, and so on.\n\nThe employee types also have important\
    \ differences. The most obvious one is that the salaried employees have an annual\
    \ salary, and the hourly employees have an hourly pay rate. Also, hourly employees\
    \ have a schedule that changes week to week, and salaried employees may have a\
    \ benefit plan that isn’t offered to hourly employees.\n\nThus you decide to create\
    \ three classes instead of just two. A class named `Employee` handles all the\
    \ features that are common to both types of employees; then this class is the\
    \ base class for the `SalariedEmployee` and `HourlyEmployee` classes. These classes\
    \ provide the additional features that distinguish salaried employees from hourly\
    \ employees.\n\n### Inheritance hierarchies\n\nOne of the most important aspects\
    \ of inheritance is that a class derived from a base class can in turn be used\
    \ as the base class for another derived class. Thus you can use inheritance to\
    \ form a hierarchy of classes.\n\nYou’ve already seen how an `Employee` class\
    \ can be used as a base class to create two types of subclasses: a `SalariedEmployee`\
    \ class for salaried employees and an `HourlyEmployee` class for hourly employees.\
    \ Suppose that salaried employees fall into two categories: management and sales.\
    \ Then you could use the `SalariedEmployee` class as the base class for two more\
    \ classes: `Manager` and `SalesPerson`.\n\nThus, a `Manager` is a type of `SalariedEmployee`.\
    \ Because a `SalariedEmployee` is a type of `Employee`, a `Manager` is also a\
    \ type of `Employee`.\n\n### Creating Subclasses\n\nThe basic procedure for creating\
    \ a subclass is simple: You just use the `extends` keyword on the declaration\
    \ for the subclass. The basic format of a class declaration for a class that inherits\
    \ a base class is this:\n\n```\npublic class ClassName extends BaseClass\n{\n\
    \    // class body goes here\n}\n```\n\nSuppose that you have a class named `Ball`\
    \ that defines a basic ball, and you want to create a subclass named `BouncingBall`\
    \ that adds the ability to bounce:\n\n```\npublic class BouncingBall extends Ball\n\
    {\n  // methods and fields that add the ability to bounce to a basic Ball object:\n\
    \  public void bounce()\n  {\n    // the bounce method\n  }\n}\n```\n\nHere we’re\
    \ creating a class named `BouncingBall` that extends the `Ball` class. (`Extends`\
    \ is Java’s word for *inherits.*)\n\nThe subclass automatically has all the methods\
    \ and fields of the class it extends. Thus, if the `Ball` class has fields named\
    \ `size` and `weight`, the `BouncingBall` class has those fields too. Likewise,\
    \ if the `Ball` class has a method named `throw`, the `BouncingBall` class gets\
    \ that method too.\n\nYou need to know some important details to use inheritance\
    \ properly:\n\n* A subclass inherits all the visible members from its base class.\
    \ Constructors are *not* considered to be members, however. As a result, a subclass\
    \ does *not* inherit constructors from its base class. And a subclass does not\
    \ inherit members that are not visible to it (that is, `private` members).\n*\
    \ You can *override* a method by declaring a new member with the same signature\
    \ in the subclass. For more information, see the next section.\n* A special type\
    \ of visibility called `protected` hides fields and methods from classes outside\
    \ the package but makes them available to subclasses and other classes within\
    \ the package. For more information, see the section.\n* You can add more methods\
    \ or fields with any level of visibility to a subclass. The `BouncingBall` class\
    \ shown earlier in this section, for example, adds a public method `bounce`.\n\
    \n### Overriding Methods\n\nIf a subclass declares a method that has the same\
    \ signature as a public method of the base class, the subclass version of the\
    \ method *overrides* the base class version of the method. This technique lets\
    \ you modify the behavior of a base class to suit the needs of the subclass.\n\
    \nSuppose you have a base class named `Game` that has a method named `play`. The\
    \ base class, which doesn’t represent any game, implements this method:\n\n```\n\
    public class Game\n{\n    public void play()\n    {\n    }\n}\n```\n\nThen you\
    \ declare a class named `Chess` that extends the `Game` class but also provides\
    \ an implementation for the `play` method:\n\n```\npublic class Chess extends\
    \ Game\n{\n  public void play()\n  {\n    System.out.println(\"I give up. You\
    \ win.\");\n  }\n}\n```\n\nHere, when you call the `play` method of a `Chess`\
    \ object, the game announces that it gives up. (We were going to provide a complete\
    \ implementation of an actual chess program for this example, but it would have\
    \ made this chapter about 600 pages long. So we opted for the simpler version\
    \ here.)\n\nNote that to override a method, several conditions have to be met:\n\
    \n* The class must extend the class that defines the method you want to override.\n\
    * The method must be visible to the subclass — you can’t override a `private`\
    \ method.\n* The method in the subclass must have the same signature as the method\
    \ in the base class. In other words, the name of the method, the parameter types,\
    \ and the return type must be the same. (Actually, the return type can be a more\
    \ specific variant of the parent method’s return type. For example, you can override\
    \ a method that returns a `Shape` with a method that returns a `Circle`, because\
    \ `Circle` is a subtype of `Shape`. This type of override is called a *covariant\
    \ return type.*)\n"
  raw: 'A car is also a type of vehicle. The `Car` class would inherit the `Vehicle`
    class, so it too would have wheels; a driver (usually); possibly some passengers;
    and the ability to drive, stop, turn, and crash. Also, it would have some features
    of its own, such as four wheels, a steering wheel, seat belts and air bags, and
    an optional automatic transmission.


    ### Game play


    Because you’re unlikely ever to write a program that simulates cars, motorcycles,
    and other vehicles, take a look at a more common example: games. Suppose that
    you want to develop a series of board games such as Life, Sorry!, and Monopoly.
    Most board games have certain features in common:


    *   They have a playing board with locations that players can occupy.


    *   They have players that are represented by tokens.


    *   The game is played by each player taking a turn, one after the other. When
    the game starts, it keeps going until someone wins. (If you don’t believe us,
    ask the kids who tried to stop a game of Jumanji before someone won.)


    Each specific type of game has these basic characteristics but adds features of
    its own. The game Life adds features such as money, insurance policies, spouses,
    children, and a fancy spinner in the middle of the board. Sorry! has cards that
    you draw to determine each move and safety zones within which other players can’t
    attack you. Monopoly has dice that determine movement, Chance and Community Chest
    cards, properties, houses, hotels, and money.


    If you were designing classes for these games, you might create a generic `BoardGame`
    class that defines the basic features common to all board games and then use it
    as the base class for classes that represent specific board games, such as `LifeGame`,
    `SorryGame`, and `MonopolyGame`.


    ### A businesslike example


    If vehicles or games don’t make the point clear enough, here’s an example from
    the world of business. Suppose that you’re designing a payroll system, and you’re
    working on the classes that represent the employees. You realize that the payroll
    includes two types of employees: salaried employees and hourly employees. So you
    decide to create two classes, sensibly named `SalariedEmployee` and `HourlyEmployee`.


    You quickly discover that most of the work done by these two classes is identical.
    Both types of employees have names, addresses, Social Security numbers, totals
    for how much they’ve been paid for the year, how much tax has been withheld, and
    so on.


    The employee types also have important differences. The most obvious one is that
    the salaried employees have an annual salary, and the hourly employees have an
    hourly pay rate. Also, hourly employees have a schedule that changes week to week,
    and salaried employees may have a benefit plan that isn’t offered to hourly employees.


    Thus you decide to create three classes instead of just two. A class named `Employee`
    handles all the features that are common to both types of employees; then this
    class is the base class for the `SalariedEmployee` and `HourlyEmployee` classes.
    These classes provide the additional features that distinguish salaried employees
    from hourly employees.


    ### Inheritance hierarchies


    One of the most important aspects of inheritance is that a class derived from
    a base class can in turn be used as the base class for another derived class.
    Thus you can use inheritance to form a hierarchy of classes.


    You’ve already seen how an `Employee` class can be used as a base class to create
    two types of subclasses: a `SalariedEmployee` class for salaried employees and
    an `HourlyEmployee` class for hourly employees. Suppose that salaried employees
    fall into two categories: management and sales. Then you could use the `SalariedEmployee`
    class as the base class for two more classes: `Manager` and `SalesPerson`.


    Thus, a `Manager` is a type of `SalariedEmployee`. Because a `SalariedEmployee`
    is a type of `Employee`, a `Manager` is also a type of `Employee`.


    ## Creating Subclasses


    The basic procedure for creating a subclass is simple: You just use the `extends`
    keyword on the declaration for the subclass. The basic format of a class declaration
    for a class that inherits a base class is this:


    `public class` *`ClassName`* `extends` *`BaseClass`*


    `{`


    `// class body goes here`


    `}`


    Suppose that you have a class named `Ball` that defines a basic ball, and you
    want to create a subclass named `BouncingBall` that adds the ability to bounce:


    `public class BouncingBall extends Ball`


    `{`


    `// methods and fields that add the ability to bounce to a basic Ball object:`


    `public void bounce()`


    `{`


    `// the bounce method`


    `}`


    `}`


    Here we’re creating a class named `BouncingBall` that extends the `Ball` class.
    (*Extends* is Java’s word for *inherits.*)


    The subclass automatically has all the methods and fields of the class it extends.
    Thus, if the `Ball` class has fields named `size` and `weight`, the `BouncingBall`
    class has those fields too. Likewise, if the `Ball` class has a method named `throw`,
    the `BouncingBall` class gets that method too.


    You need to know some important details to use inheritance properly:


    *   ![Remember](images/remember.png) A subclass inherits all the visible members
    from its base class. Constructors are *not* considered to be members, however.
    As a result, a subclass does *not* inherit constructors from its base class. And
    a subclass does not inherit members that are not visible to it (that is, `private`
    members).


    *   You can *override* a method by declaring a new member with the same signature
    in the subclass. For more information, see the next section.


    *   A special type of visibility called `protected` hides fields and methods from
    classes outside of the current package but makes them available to subclasses
    and other classes within the current package. For more information, see the section
    “[Protecting Your Members](#c11.xhtml_c11-sec-0009),” later in this chapter.


    *   You can add more methods or fields with any level of visibility to a subclass.
    The `BouncingBall` class shown earlier in this section, for example, adds a public
    method named `bounce`.


    ## Overriding Methods


    If a subclass declares a method that has the same signature as a public method
    of the base class, the subclass version of the method *overrides* the base class
    version of the method. This technique lets you modify the behavior of a base class
    to suit the needs of the subclass.


    Suppose you have a base class named `Game` that has a method named `play`. The
    base class, which doesn’t represent any particular game, implements this method:


    `public class Game`


    `{`


    `public void play()`


    `{`


    `}`


    `}`


    Then you declare a class named `Chess` that extends the `Game` class but also
    provides an implementation for the `play` method:


    `public class Chess extends Game`


    `{`


    `public void play()`


    `{`


    `System.out.println("I give up. You win.");`


    `}`


    `}`


    Here, when you call the `play` method of a `Chess` object, the game announces
    that it gives up. (We were going to provide a complete implementation of an actual
    chess game program for this example, but it would have made this chapter about
    600 pages long. So we opted for the simpler version here.)


    Note that to override a method, several conditions have to be met:


    *   The class must extend the class that defines the method you want to override.


    *   The method must be visible to the subclass — you can’t override a `private`
    method.


    *   The method in the subclass must have the same signature as the method in the
    base class. In other words, the name of the method, the parameter types, and the
    return type must be the same. (Actually, the return type can be a more specific
    variant of the parent method’s return type. For example, you can override a method
    that returns a `Shape` with a method that returns a `Circle`, because `Circle`
    is a subtype of `Shape`. This type of override is called a *covariant return type.*)'
