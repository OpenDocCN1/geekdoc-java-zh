    \nTo cast a primitive value from one type to another, you use a *cast operator,*\
    \ which is simply the name of a primitive type in parentheses placed before the\
    \ value you want to cast. For example:\n\n`double pi = 3.1314;`\n\n`int iPi;`\n\
    \n`iPi = (int) pi;`\n\n## Printing Data with System.out\n\nStandard output is\
    \ a stream designed to display text output onscreen. When you run a Java program\
    \ under Windows, a special console window opens, and the standard output stream\
    \ is connected to it. Then any text you send to standard output is displayed in\
    \ that window. This stream is available to every Java program via the `System.out`\
    \ field of the `System` class.\n\n`System.out` is an instance of a class called\
    \ `PrintStream`, which defines the `print` and `println` methods used to write\
