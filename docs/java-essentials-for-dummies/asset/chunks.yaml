    以下章节将介绍字符串操作的基本知识，以便你将简单的字符串整合到你的程序中。


    ## 字符串的声明与初始化


    字符串的声明和初始化与基本类型非常相似。事实上，你最初注意到的唯一区别是 `String` 单词的首字母是大写的，这与 `int` 和 `double` 等基本类型的关键字不同。这是因为
    `String` 不是关键字。相反，它是提供字符串对象的 Java API 类 `String` 的名称。


    以下语句定义并初始化了一个字符串变量：


    ```java

    String s;

    s = "Hello, World!";

    ```


    这里声明了一个类型为 `String` 的变量 `s`，并用字符串字面量 `"Hello, World!"` 进行了初始化。注意，字符串字面量是用双引号括的，而不是单引号。单引号用于字符字面量，它与字符串字面量不同。


    与任何变量声明一样，字符串声明可以包含初始化器。因此你可以在一个语句中声明并初始化字符串变量，例如：


    ```java

    String s = "Hello, World!";

    ```


    ![Tip](img/tip.png) 类变量和实例变量会自动初始化为空字符串，但局部变量则不会。要将局部字符串变量初始化为空字符串，请使用如下语句：


    ```java

    String s = "";

    ```


    ## 合并字符串


    使用加号 (`+`) 作为 `拼接运算符` 来合并两个字符串。（在 Java 术语中，合并字符串被称为 `concatenation`。）以下语句将两个字符串变量的值合并以创建第三个字符串：


    ```java

    String hello = "Hello, ";

    String world = "World!";

    String greeting = hello + world;

    ```


    变量 `greeting` 的最终值为 `"Hello, World!"`。


    ![Tip](img/tip.png) 当 Java 拼接字符串时，它并不会在字符串之间插入任何空格。因此，如果你想合并两个字符串并让它们之间出现空格，请确保第一个字符串以空格结尾，或者第二个字符串以空格开头。（在之前的示例中，第一个字符串以空格结尾。）


    或者，你可以将字符串字面量与字符串变量拼接。例如：


    ```java

    String hello = "Hello";

    String world = "World!";

    String greeting = hello + ", " + world;

    ```


    在这里，出现在单词 `Hello` 和 `World` 之间的逗号和空格是作为字符串字面量插入的。


    拼接是最常用的字符串处理技术之一，因此你在书中会看到很多示例。事实上，我们在本章中已经使用过一次拼接。早些时候，我们为你展示了一个包含以下行的程序：


    ```java

    System.out.println("The value of i is " + i);

    ```


    在这里，`System.out` 对象的 `println` 方法打印了当字面量 `"The value of i is "` 与变量 `i` 的拼接时生成的字符串。


    ## 将基本类型转换为字符串


    由于字符串拼接允许你合并两个或多个字符串值，而且由于 `int` 和 `double` 等基本类型不是字符串类型，你可能会奇怪上一节的最后一个示例是如何工作的。换句话说，Java
    如何在该语句中将字符串字面量 `"The value of i is "` 与整数值 `i` 拼接？


    ```java

    System.out.println("The value of i is " + i);

    ```


    答案是，每你在拼接中使用基本值时，Java 会自动将基本值转换为字符串值。


    ![Warning](img/warning.png) 注意这里：在评估整个表达式的过程中，Java 可能会让你混淆数字是在何时转换为字符串的。考虑这个确实有些牵强的的例子：


    ```java

    int i = 2;

    System.out.println(i + i + " equals four.");

    ```


    这会在控制台上打印出以下内容：


    `4 equals four.`


    在这里，第一个加号表示两个 `int` 变量相加，而不是拼接。对于第二个加号，得到的 `int` 结果被转换为字符串，并与 `" equals four."`
    拼接。


    ![Tip](img/tip.png) 你可以通过使用基本类型包装类的 `toString` 方法显式地将基本值转换为字符串。例如，要将 `int` 变量
    `x` 转换为字符串，你可以使用此语句：


    ```java

    String s = Integer.toString(x);

    ```


    在下一章中，你将发现如何使用一个名为 `NumberFormat` 的特殊类将基本类型转换为字符串，同时对值应用各种类型的格式化，例如添加逗号、货币符号或百分比标记。


    ## 将字符串转换为基本类型


    将基本值转换为字符串值非常简单。反过来——将字符串值转换为基本类型——要稍微复杂一些，因为并不总是有效。例如，如果字符串包含值 `10`，你可以轻松地将其转换为整数。但如果字符串包含
    `thirty-two`，你就做不到。


    要将字符串转换为基本类型，你需要使用相应包装类的 `parse` 方法，如表 4-4 所示。要将字符串值转换为整数，你使用如下语句：


    ```java

    String s = "10";

    int x = Integer.parseInt(s);

    ```


    | **Wrapper** | **parse Method** | **Example** |

    | --- | --- | --- |

    | `Integer` | `parseInt(String)` | `int x = Integer.parseInt("100");` |

    | `Short` | `parseShort(String)` | `short x = Short.parseShort("100");` |

    | `Long` | `parseLong(String)` | `long x = Long.parseLong("100");` |

    | `Byte` | `parseByte(String)` | `byte x = Byte.parseByte("100");` |

    | `Float` | `parseFloat(String)` | `float x = Float.parseFloat("19.95");` |

    | `Double` | `parseDouble(String)` | `double x = Double.parseDouble("19.95");`
    |

    | `Character` | `(none)` | |

    | `Boolean` | `parseBoolean(String)` | `boolean x = Boolean.parseBoolean("true");`
    |


