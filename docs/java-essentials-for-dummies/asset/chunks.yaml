  trans: "\n\n```java\n// 处理 IOException 的语句\n}\ncatch (Exception e)\n{\n    // 处理所有其他异常类型的语句\n\
    }\n```\n\n在这个示例中，假设 `try` 块中的代码可能会抛出 `InputMismatchException`、`IOException`，以及可能的其他类型未预料的异常。这里的三个\
    \ `catch` 块为这些每种可能性提供了处理。\n\n如果需要捕获的某些异常需要相同的处理方式，可以将它们合并到单个 `catch` 子句中。只需用竖线\
    \ `|` 分隔异常类型，如下：\n\n```java\ntry\n{\n    // 可能会抛出多种类型异常的语句\n}\ncatch (InputMismatchException\
    \ | IOException e)\n{\n    // 处理 InputMismatchException 或 IOException 的语句\n}\n\
    catch (Exception e)\n{\n    // 处理所有其他异常类型的语句\n}\n```\n\n![Tip](img/tip.png) 如果为同一个\
    \ `try` 语句编写了多个 `catch` 块，Java 将按照你列出的顺序捕获异常。因此，如果你在一个 `try` 语句上使用多个 `catch` 块，请务必始终列出更具体的异常。如果你包含一个捕获\
    \ `Exception` 的 `catch` 块，请将其放在最后。\n\n## 使用 finally 块\n\n`finally` 块是一个出现在语句的任何\
    \ `catch` 块之后的代码块。无论 `try` 块是否抛出异常或是否被任何 `catch` 块捕获，它都会执行；如果你的代码使用 `return` 语句提前退出，它也会执行。它的目的是让你清理异常可能留下的任何垃圾，例如打开的文件或数据库连接。\n\
    \n带有 `finally` 块的 `try` 语句的基本框架如下：\n\n```java\ntry\n{\n    // 可能抛出异常的语句\n}\ncatch\
    \ (exception-type identifier)\n{\n    // 抛出异常时执行的语句\n}\nfinally\n{\n    // 无论是否发生异常都会执行的语句\n\
    }\n```\n\nListing 9-3 显示了一个人工但帮助的示例，演示了如何使用 `finally` 子句。在这个示例中，名为 `divideTheseNumbers`\
    \ 的方法尝试两次除法。如果第一次除法失败（由于除零异常），它会再次尝试除法。我们知道，这完全不理智。但像青少年一样执着。\n\nLISTING 9-3 使用\
    \ finally 子句的程序\n\n```java\npublic class CrazyWithZeros\n{\n    public static\
    \ void main(String[] args)\n    {\n        try\n        {\n            int answer\
    \ = divideTheseNumbers(5, 0); //→7\n        }\n        catch (Exception e) //→9\n\
    \        {\n            System.out.println(\"Tried twice, \" + \"still didn't\
    \ work!\");\n        }\n    }\n    public static int divideTheseNumbers(int a,\
    \ int b) //→16\n    {\n        int c;\n        try\n        {\n            c =\
    \ a / b; //→21\n            System.out.println(\"It worked!\"); //→22\n      \
    \  }\n        catch (Exception e)\n        {\n            System.out.println(\"\
    Didn't work the first time.\"); //→26\n            c = a / b; //→27\n        \
    \    System.out.println(\"It worked the second time!\"); //→28\n        }\n  \
    \      finally\n        {\n            System.out.println(\"Better clean up my\
    \ mess.\"); //→32\n        }\n        System.out.println(\"It worked after all.\"\
    ); //→34\n        return c; //→35\n    }\n}\n```\n\n以下是程序的控制台输出：\n\n```\nDidn't\
    \ work the first time.\nBetter clean up my mess.\nTried twice, still didn't work!\n\
    ```\n\n接下来的段落逐步解释了发生了什么：\n\n1. →7: `main` 方法调用 `divideTheseNumbers` 方法，并将 `5`\
    \ 和 `0` 作为参数传递。你已经知道这个方法不起作用。\n2. →9: `catch` 子句捕获了第 7 行抛出的任何异常。\n3. →16: `divideTheseNumbers`\
    \ 方法对作为参数的两个数字进行除法。\n4. →21: 这一行是第一次尝试除数字。\n5. →22: 如果第一次尝试成功，则执行此行并打印消息 `\"It\
    \ worked!\"`。遗憾的是，除法抛出了异常，所以这一行从未被执行。\n6. →26: 相反，`catch` 子句捕获了异常，并显示消息 `\"Didn't\
    \ work the first time.\"`。这是控制台输出的第一行。\n7. →27: `divideTheseNumbers` 方法固执地再次尝试除相同的两个数字。这次没有\
    \ `try` 语句来捕获错误。\n8. →28: 然而，由于第二次除法抛出了另一个异常，此行从未未被执行。因此你没有看到消息 `\"It worked the\
    \ second time.\"`。\n9. →32: `finally` 块执行，打印清理消息。\n10. →34: 打印消息 `\"It worked\
    \ after all.\"`。\n11. →35: 方法返回 `c`。\n\n"
- fmt: "\n![Remember](images/remember.png) A Java class name must, of course, conform\
    \ to Java’s requirements for names in general. So, the name must begin with a\
    \ letter or underscore, cannot contain white space or special characters other\
    \ than underscores or dollar signs, and cannot be the same as any keyword or other\
    \ reserved word such as `var`, `true`, `false`, or `null`.\n\n## Knowing what\
    \ goes in the class body\n\nThe `class body` of a class is everything that goes\
    \ within the braces at the end of the class declaration. The `public class ClassName`\
    \ part of a class declaration takes just one line, but the body of the class declaration\
    \ may take hundreds of lines (or thousands, if you get carried away).\n\nThe class\
    \ body can contain the following elements:\n\n* **Fields:** Variable declarations\
    \ define the public or private fields of a class.\n* **Methods:** Method declarations\
    \ define the methods of a class.\n* **Constructors:** A `constructor` is a block\
    \ of code that’s similar to a method but is run to initialize an object when an\
    \ instance is created. A constructor must have the same name as the class itself,\
    \ and although it resembles a method, it doesn’t have a return type.\n* **Initializers:**\
    \ These stand-alone blocks of code are run only once, when the class is initialized.\
    \ There are actually two types, called `static initializers` and `instance initializers`.\n\
    * **Other classes and interfaces:** A class can include another class, which is\
    \ then called an `inner class` or a `nested class`. Classes can also contain interfaces.\n\
    \n![Tip](images/tip.png) Unlike some programming languages, Java doesn’t care\
    \ about the order in which items appear in the class body. Still, being consistent\
    \ about the order in which you place things in your classes is a good idea. That\
    \ way you know where to find them. We usually code all the fields together at\
    \ the start of the class, followed by constructors and then methods.\n\nSome programmers\
    \ like to place the fields at the end of the class rather than at the beginning.\
    \ Whatever brings you happiness is fine with us.\n\n![Remember](images/remember.png)\
    \ The fields, methods, classes, and interfaces contained within a class are called\
    \ the `members` of the class. Constructors and initializers aren’t considered\
    \ to be members.\n\n## Seeing where classes live\n\nA public class must be written\
    \ in a source file that has the same name as the class, with the extension `java`.\
    \ A public class named `Greeter`, for example, must be placed in a file named\
    \ `Greeter.java`.\n\nAs a result, you can’t place two public classes in the same\
    \ file. The following source file (named `DiceGame.java`) won’t compile:\n\n```\n\
    public class DiceGame\n{\n    public static void main(String[] args)\n    {\n\
    \        Dice d = new Dice();\n        d.roll();\n    }\n}\npublic class Dice\n\
    {\n    public void roll()\n    {\n        // code that rolls the dice goes here\n\
    \    }\n}\n```\n\nThe compiler coughs up a message indicating that `Dice` is a\
    \ public class and must be declared in a file named `Dice.java`.\n\nThis problem\
    \ has two possible solutions. The first is to remove the `public` keyword from\
    \ the `Dice` class:\n\n```\npublic class DiceGame\n{\n    public static void main(String[]\
    \ args)\n    {\n        Dice d = new Dice();\n        d.roll();\n    }\n}\nclass\
    \ Dice\n{\n    public void roll()\n    {\n        // code that rolls the dice\
    \ goes here\n    }\n}\n```\n\nThe compiler gladly accepts this program.\n\n![Remember](images/remember.png)\
    \ When you code more than one class in a single source file, Java still creates\
    \ a separate class file for each class. Thus, when you compile the `DiceGame.java`\
    \ file, the Java compiler creates two class files: `DiceGame.class` and `Dice.class`.\n\
    \nRemoving the `public` keyword from a class is acceptable for relatively small\
    \ programs, but its limitation is that the `Dice` class is available only to the\
    \ classes defined within the `DiceGame.java` file. If you want the `Dice` class\
    \ to be more widely available, opt for the second solution: Place it, with the\
    \ `public` keyword, in a separate file named `Dice.java`.\n\n![Tip](images/tip.png)\
    \ If you’re going to create an application that has several public classes, create\
    \ a separate folder for the application. Then save all the class files for the\
    \ application to this folder. If you keep your class files together in the same\
    \ folder, the Java compiler can find them. If you place them in separate folders,\
    \ you may need to adjust your `ClassPath` environment variable to help the compiler\
    \ find the classes.\n\n## Working with Members\n\nThe `members` of a class are\
    \ the fields and methods defined in the class body. (Technically, classes and\
    \ interfaces defined within a class are members too. We don’t discuss them in\
    \ this book, though, so you can ignore them.)\n\nThe following sections describe\
    \ the basics of working with fields and methods in your classes.\n\n### Understanding\
    \ fields\n\nA `field` is a variable that’s defined in the body of a class, outside\
    \ any of the class’s methods. Fields are available to all the methods of a class.\
    \ In addition, if the field specifies the `public` keyword, the field is visible\
    \ outside the class. If you don’t want the field to be visible outside the class,\
    \ use the `private` keyword instead.\n\nA field is defined the same as any other\
    \ Java variable, but it can also have a modifier that specifies the visibility\
    \ of the field — that is, whether other classes can access the fields of the class\
    \ you’re defining. For now, we’ll just use two basic forms of visibility: public\
    \ and private. For a more complete discussion of visibility, see the section “[Understanding\
    \ visibility](#c10.xhtml_c10-sec-0009),” later in this chapter.\n\nTo create a\
    \ public field that can be accessed by other classes, use the `public` modifier:\n\
    \n```\npublic int trajectory = 0;\npublic String name;\npublic Player player;\n\
    ```\n\nTo create a private field, specify `private` instead of `public`:\n\n```\n\
    private int x_position = 0;\nprivate int y_position = 0;\nprivate String error_message\
    \ = \"\";\n```\n\nFields can also be declared as `final`:\n\n```\npublic final\
    \ int MAX_SCORE = 1000;\n```\n\nThe value of a `final` field can’t be changed\
    \ after it has been initialized. ***Note:*** Spelling `final` field names with\
    \ all capital letters is customary, but not required.\n\n### Understanding instance\
    \ methods\n\nYou define methods for a class by using the same techniques that\
    \ we describe in [Chapter 8](#08.xhtml). To declare a method that’s available\
    \ to users of your class, add the `public` keyword to the method declaration:\n\
    \n```\npublic boolean isActive()\n{\n    return this.isActive;\n}\n```\n\nTo create\
    \ a private method that can be used within the class but isn’t visible outside\
    \ the class, use the `private` keyword:\n\n```\nprivate void calculateLunarTrajectory()\n\
    {\n    // code to get the calculated lunar trajectory\n}\n```\n\n### Understanding\
    \ visibility\n\nIn the preceding sections, we mention that both fields and methods\
    \ can use the `public` or `private` keyword to indicate whether the field or method\
    \ can be accessed from outside the class. This is called the `visibility` of the\
    \ field or method.\n\nThere are actually four distinct levels of visibility you\
    \ can use:\n\n* `private`: For fields that shouldn’t be visible to any other classes\
    \ — in other words, fields that are completely internal to the class.\n* `public`:\
    \ For fields that should be visible to every other Java class, including classes\
    \ that are outside of the current package.\n* `protected`: For fields that should\
    \ be visible only to subclasses of the current class — that is, to subclasses\
    \ or inner classes.\n* `package-private`: Use this visibility for fields that\
    \ should be visible to any other class within the current package. (Note that\
    \ there is no `package-private` keyword in Java; that’s just the default visibility\
    \ if you don’t specify `private`, `public`, or `protected`.)\n"
