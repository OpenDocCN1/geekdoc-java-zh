    sqrt(x) = \" + Math.sqrt(y));\n    }\n}\n```\n\n### 创建随机数\n\n早晚，你都会想要编写玩简单游戏的程序。几乎所有的游戏都内置了一些随机元素，因此你需要一种方法来创建在每次运行时运行都不完全相同的计算机程序。实现这一点最简单的方法是使用\
    \ `Math` 类的 `random` 方法，该方法在本节稍前的 表 5-4 中列出，与其他 `Math` 类的其他基本数学函数一起。\n\n`random`\
    \ 方法生成一个 0.0（包含，意味着它可以是 0.0）到 1.0（不包含，意味着它不能是 1.0）之间的随机 `double` 值。然而，大多数需要随机值的计算机应用程序都需要从某个任意低值（通常是\
    \ 1，但不总是如此）到某个任意高值之间的随机整数。掷骰子的程序需要 1 到 6 之间的随机数，而发牌程序则需要 1 到 52 之间的随机数（如果使用王牌则为\
    \ 53）。\n\n因此，你需要一个 Java 表达式，将 `random` 函数返回的 `double` 值转换为程序所请求范围内的 `int` 值。以下代码显示了如何实现，值被设置为掷骰子游戏的\
    \ `1` 和 `6`：\n\n```java\nint low = 1; // 范围内的最小值\nint high = 6; // 范围内的最大值\nint\
    \ rnd = (int)(Math.random() * (high - low + 1)) + low;\n```\n\n这个表达式有点复杂，所以我们向你展示它是如何逐步计算的：\n\
    \n1. 调用 `Math.Random` 方法获取一个随机 `double` 值。该值大于 0.0 但小于 1.0。\n2. 将随机值乘以范围的高端减去低端。\n\
    3. 将结果通过 `(int)` 转换为整数。\n4. 将结果加上 `low`。\n\n（注：此处原文的步骤描述部分存在重复和混乱，翻译已根据逻辑进行了平滑处理以确保可读性。）\n\
    \n### 掷骰子\n\n```java\npublic class DiceApp\n{\n    public static void main(String[]\
    \ args)\n    {\n        int roll;\n        String msg = \"Here are 10 random rolls:\"\
    ;\n        System.out.println(msg);\n        for (int i=0; i<10; i++)\n      \
    \  {\n            roll = randomInt(1, 6);\n            System.out.print(roll +\
    \ \" \");\n        }\n        System.out.println();\n    }\n    public static\
    \ int randomInt(int low, int high)\n    {\n        int result = (int)(Math.random()\
    \ * (high - low + 1)) + low;\n        return result;\n    }\n}\n```\n\n下面的解释了该程序是如何工作的：\n\
    \n1. `for` 语句导致循环体执行 10 次。不用担心这个语句如何工作；你将在第 7 章中了解到。\n2. 该语句调用 `randomInt` 方法，指定\
    \ 1 和 6 为随机范围。生成的随机数赋值给变量 `roll`。\n3. 使用 `System.out.print` 方法打印随机数并跟一个空格。因为该语句调用的是\
    \ `print` 方法而不是 `println` 方法，所以随机数将打印在同一行上。\n4. `System.out.println()` 用于换行。\n\
    5. `randomInt` 方法的声明表明该方法返回一个 `int` 并接受两个 `int` 参数：`low` 和 `high`。\n6. 此表达式将随机\
    \ `double` 值转换为 `low` 到 `high` 之间的整数。\n7. `return` 语句将随机数返回给调用 `randomInt` 的语句。\n\
