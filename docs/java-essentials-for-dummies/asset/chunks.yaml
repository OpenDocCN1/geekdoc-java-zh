    `char` 类型代表 Unicode 字符集中的单个字符。需要注意的是，字符不等同于 `String`；你将在本章稍后的章节“处理字符串”中学习到有关字符串的知识。现在，只需意识到
    `char` 变量只能存储一个字符，而不能像 `String` 那样存储字符序列。


    要给 `char` 变量赋值，你需要使用字符字面量，它始终被包裹在单引号中，而不是双引号。这里有一个用例：


    ```java

    char code = ''X'';

    ```


    在这里，字符 `X` 被赋值给名为 `code` 的变量。


    以下语句将无法编译：


    ```java

    char code = "X"; // error -- 应该使用单引号，而不是双引号

    ```

    ```


    这是因为双引号用于标记 `Strings`，而不是字符常量。


    你也可以给 `char` 变量赋值 0 到 255 之间的整数值，如下所示：


    ```java

    char cr = 013;

    ```


    在这里，十进制值 13（代表回车符）被赋值给名为 `cr` 的变量。


    Java 使用一种名为 `UTF-16` 的 16 位固定长度编码方案，这是最常用的 Unicode 编码方案。Unicode 字符集前 256 个字符与
    ASCII 字符集的字符相同，ASCII 是使用西方语言计算机最常用的字符集。（严格来说，UTF-16 可以通过使用一对 16 位序列来编码 32 位字符。但
    Java 的 `char` 类型只能处理 16 位的 UTF-16 代码。）


    ![Tip](img/tip.png) 有需更多关于 Unicode 字符集的信息，请访问 Unicode 官方网站：[`https://home.unicode.org`](https://home.unicode.org/)。


    字符字面量还可以使用特殊的转义序列来表示特殊字符。表 4-2 列出了允许的转义序列。这些转义序列允许你为无法在字符常量中直接输入的字符创建字面量。


    | 转义序列 | 解释 |

    | --- | --- |

    | `\b` | 退格键 (Backspace) |

    | `\t` | 水平制表符 (Horizontal tab) |

    | `\n` | 换行符 (Line feed) |

    | `\f` | 分页符 (Form feed) |

    | `\r` | 回车 (Carriage return) |

    | `\"` | 双引号 |

    | `\''` | 单引号 |

    | `\\` | 反斜杠 |


    表 4-2 字符常量的转义序列


    ### Boolean 类型


    Boolean 类型可以有两个值之一：`true` 或 `false`。布尔值用于执行逻辑操作，最常见的是判断某些条件是否为真。例如：


    ```java

    boolean enrolled = true;

    boolean credited = false;

    ```


    在这里，声明了一个类型为 `boolean` 的变量 `enrolled` 并将其初始化为 `true`，并声明了另一个类型为 `boolean` 的变量
    `credited` 并将其初始化为 `false`。


    ![Warning](img/warning.png) 在某些语言（如 C 或 C++）中，整数值可以被视为布尔值，其中 `0` 等于 `false`，任何其他值都于
    `true`。Java 则不然。在 Java 中，你不能在 `integer` 类型和 `boolean` 类型之间进行转换。


    ### 使用包装类


    每个基本类型在 Java API 类库中都有一个对应的类。这个类有时被称为包装类（wrapper class），因为它用面向对象的等价物——精美的包装纸和丝带将基本值包装起来，使得基本类型看起来和行为上都像一个对象。表
    4-3 列出了基本类型及其包装类。


    | 基本类型 | 包装类 |

    | --- | --- |

    | `int` | `Integer` |

    | `short` | `Short` |

    | `long` | `Long` |

    | `byte` | `Byte` |

    | `float` | `Float` |

    | `double` | `Double` |

    | `char` | `Character` |

    | `boolean` | `Boolean` |


    表 4-3 基本类型的包装类


