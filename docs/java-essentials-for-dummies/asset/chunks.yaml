    \ that the error messages generated when you capitalize keywords aren’t more insulting.\
    \ Accidentally capitalizing a keyword in Visual Basic style can really throw the\
    \ Java compiler for a loop. Consider this program, which contains the single error\
    \ of capitalizing the word `For`:\n\n```\npublic class CaseApp {\n    public static\
    \ void main(String[] args) {\n        For (int i = 0; i<5; i++)\n            System.out.println(\"\
    Hi\");\n    }\n}\n```\n\nWhen you try to compile this program, the compiler generates\
    \ a total of four error messages for this mistake:\n\n```\nC:\\Users\\doug\\Documents\\\
    CaseApp.java:5: error: '.class' expected\nFor (int i = 0; i<5; i++)\n^\n```\n\n\
    ```\nC:\\Users\\doug\\Documents\\CaseApp.java:5: error: illegal start of type\n\
    For (int i = 0; i<5; i++)\n^\n```\n```\nC:\\Users\\doug\\Documents\\CaseApp.java:5:\
    \ error: not a statement\nFor (int i = 0; i<5; i++)\n^\n```\n```\nC:\\Users\\\
    doug\\Documents\\CaseApp.java:5: error: ';' expected\nFor (int i = 0; i<5; i++)\n\
    ^\n```\n4 errors\n\nEven though this single mistake generates four error messages,\
    \ not one of the messages actually points to the problem. The little arrow beneath\
    \ the source line indicates what part of the line is error, and none of these\
    \ error messages has the arrow anywhere near the word `For`! The compiler isn’t\
    \ smart enough to realize you meant `for` instead of `For`. So it treats `For`\
    \ as a legitimate identifier and then complains about everything else on the line\
    \ that follows. It would be much more helpful if the compiler generated an error\
    \ message like this:\n\n```\nC:\\Users\\Java Essentials\\CaseApp.java:5: error:\
    \ 'For' is not a keyword\nFor (int i = 0; i<5; i++)\n```\n\nBetter yet, for those\
    \ of us old enough to remember:\n\n```\nC:\\Users\\doug\\Documents\\CaseApp.java:5:\
    \ Theese Java! do not capitalize keywords here!\nFor (int i = 0; i<5; i++)\n```\n\
    ![Remember](images/remember.png) The moral of the story is that Java is case-sensitive,\
    \ and if your program won’t compile and the error messages don’t make any sense,\
    \ check for keywords you’ve mistakenly capitalized.\n\n## Working with Statements\n\
    \nLike most programming languages, Java uses statements to build programs. Unlike\
    \ most programming languages, Java doesn’t use statements as its fundamental unit—the\
