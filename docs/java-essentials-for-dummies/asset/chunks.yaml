    \ and assignment statements can be combined into a single statement, like this:\n\
    \n```\nint i = 42;\nString name = \"Jackie Robinson\";\n```\n\nAnother common\
    \ type of statement is an `expression statement`, which performs calculations\
    \ or other operations. For example:\n\n```\nSystem.out.println(\"Hello, World!\"\
    );\n```\n\nNotice that this statement is the same as line 5 in [Listing 3-1](#c03.xhtml_c03-fea-0001).\
    \ Thus the single statement in the `HelloApp` program is an expression statement.\n\
    \nThere are many kinds of statements besides these two. `if` statements, for example,\
    \ execute other statements only if a particular condition has been met, and statements\
    \ such as `for`, `while`, and `do` execute whole groups of statements repeatedly.\n\
    \n![Tip](images/tip.png) It’s often said that every Java statement must end with\
