    \n```\nif ( a==1 && b==2 || c==3 )\n```\n\n```\nSystem.out.println(\"It's true!\"\
    );\nelse\nSystem.out.println(\"No it isn't!\");\n```\n\n假设 `a` 为 `5`，`b` 为 `7`，且\
    \ `c = 3`，你认为这个 `if` 语句会做什么？答案是该表达式为 `true`，并打印 `\"It's true!\"`。这是因为 Java 从左到右应用运算符。因此，`&&`\
    \ 运算符应用于 `a==1`（为 `false`）和 `b==2`（同样为 `false`，但并不重要，因为该评估被跳过了）。因此，`&&` 运算符返回\
    \ `false`。然后 `||` 运算符应用于该 `false` 结果和 `c==3` 的结果（结果为 `true`）。因此，整个表达式返回 `true`。\n\
