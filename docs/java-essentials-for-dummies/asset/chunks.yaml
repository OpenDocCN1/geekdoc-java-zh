    *   参数：将数据值传递给方法


    ![Remember](img/remember.png) 在创建标识符时，你必须遵循几个简单的规则：


    *   标识符是区分大小写的。因此，`SalesTax` 和 `salesTax` 是不同的标识符。

    *   标识符可以由大写字母、小写字母、数字、下划线（`_`）和美元符号（`$`）组成。因此，标识符名称可以是 `Port1`、`SalesTax$` 和
    `Total_Sales`。

    *   所有标识符必须以字母开头。因此，`a15` 是有效的标识符，但 `13Unlucky` 不是（因为它以数字开头）。

    *   标识符不能与表 3-1 中**粗体**列出的任何 Java 关键字相同。因此，你不能创建一个名为 `for` 的变量或名为 `public` 的类。（为了避免混淆，我们还建议你避免使用上下文关键字——即在表
    3-1 中没有粗体显示的关键字——）

    *   Java 语言规范建议避免在你创建的名称中使用美元符号，因为代码生成器使用美元符号来创建标识符。因此，避免美元符号可以帮助你避免创建与生成的名称的名称。


    ## 编写注释


    `comment`（注释）是提供代码说明的文本。编译器会忽略注释，因此你可以在注释中放置任何文本。在程序中使用大量的注释是解释程序功能及其工作原理的良好方法。


    Java 有两种基本的注释类型：*行尾注释*和*传统注释*。关于这些的更多内容即将出现。


    ### 行尾注释


    `end-of-line comment` 注释以序列 `//`（两个连续的斜杠）开始，并在行尾结束。你可以在任何行的末尾放置行尾注释。你在 `//` 之后输入的所有内容都会被编译器忽略。例如：


    ```

    total = total * discountPercent; // 计算折扣后的总额

    ```


    如果你愿意，也可以将行尾注释放在单独的行中，如下：


    ```

    // 计算折扣后的总额

    total = total * discountPercent;

    ```


    你可以在跨越两行或更多的语句中间放置行尾注释。例如：


    ```

    total = (total * discountPercent) // 先应用折扣

    + salesTax; // 然后加上销售税

    ```


    ### 传统注释


    `traditional comment` 注释以序列 `/*` 开始，以序列 `*/` 结束，并可以跨越多行。这是一个示例：


    ```

    /* HelloApp 示例程序。

    此程序演示了

    所有 Java 程序必须遵循的基本结构。 */

    ```


    传统注释可以在行的任何地方开始和结束。如果你愿意，甚至可以将注释夹在其他 Java 编程元素之间，如下：


    ```

    x = (y + /* 放置注释的奇怪位置 */ 5) / z;

    ```


    通常情况下，传统注释出现在单独的行中。传统注释的一个常见用途是在类的开头放置块注释行，以指示关于该类的信息——例如该类的功能、谁编写的等。然而，那种类型的注释通常被认为编写为
    JavaDoc 注释更好，正如下一节所描述。


    ## 介绍面向对象编程


    在介绍了 Java 编程语言的一些最基本元素之后，大多数 Java 书接下来将转向变量和数据类型这些重要主题。然而，由于 Java 本质上是一种面向对象的编程语言，而且类是面向对象编程的核心，我们接下来查看类，以探索它们在创建对象方面扮演的重要角色。我们将在下一章首先介绍变量和数据类型。


    ### 理解类和对象


    正如我们已经提到的，`class`（类）是定义名为“对象”的 Java 编程元素行为的代码。`object`（对象）是一个具有状态和行为的实体。对象的`state`（状态）由对象可能跟踪的任何数据组成，`behavior`（行为）由对象可以执行的`actions`（动作）组成。行为在类中通过一个或多个可以调用以执行的方法表示。


    类和对象的区别类似于蓝图和房子的区别。蓝图是房子的计划。房子是蓝图的实现。一套蓝图可以用来建造许多房子。同样，类是对象的计划，而对象——在 Java 术语中——是类的
    `instance`（实例）。你可以使用单个类创建多个对象。


    当对象被创建时， Java 会分配出一块计算机内存空间，足以存储对象存储的所有数据。因此，类的每个实例都有自己的数据，与同类其他实例使用的数据相互独立。


    ### 理解静态方法


    你不一定需要创建类的实例来使用类的方法。如果你用 `static` 关键字声明一个方法，你可以在不先创建实例的情况下调用该方法，因为 `static` 方法是从类调用的，而不是从对象调用的。


    Java 程序的 `main` 方法必须用 `static` 关键字声明，因为当你从命令行提示符 `java` 命令启动 Java 程序时，Java 不创建应用程序类的实例。相反，它简单地调用程序的静态
    `main` 方法。


    静态方法和非静态方法的区别在第 10 章和第 11 章中深入研究面向对象编程时变得更加明显。但现在，请考虑这个类比：房子的蓝图包含了完工房屋中实际运行系统的细节，例如电气和水水系统。要使用这些系统，你必须实际建造一座房子。换句话说，你不能仅凭蓝图打开热水；你必须有一个带有实际加热装置的实际房子。


    然而，蓝图确实包含了房屋尺寸的详细测量数据。因此，你*可以*使用蓝图来确定客厅的面积。


    现在想象一下，蓝图中实际上有一个内置的计算器，如果你按下“客厅”按钮，它就会显示客厅的大小。那个按钮就像类中的 `static` 方法：你并不需要实际建造房子来使用该按钮；你仅凭蓝图就可以激活它。


    许多 Java 程序完全由 `static` 方法组成。然而，大多数现实中的程序都需要在执行时创建一个或多个对象。因此，了解如何创建简单的类以及如何从这些类创建对象是
    Java 编程的基本技能。


    ### 从类创建对象


    在 Java 中，你可以通过多种方法从类创建对象。最直接的方法是创建一个变量，提供一个你可以用来引用对象的名称，使用 `new` 关键字创建类的实例，然后将生成的对象赋值给该变量。执行这一魔法操作的语句通用形式如下：


    ```

    ClassName variableName = new ClassName();

    ```


    要创建一个名为 `Class1` 的类的对象实例并将其赋值给名为 `myClass1Object` 的变量，编写如下语句：


    ```

    Class1 myClass1Object = new Class1();

    ```


