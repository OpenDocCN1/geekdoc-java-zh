  trans: "\n然而，编译器并没有被你的小花招欺骗。它知道如果数字是 12，`return` 语句就不会执行，因此它发出了 `missing return\
    \ statement`（缺少返回语句）的消息并拒绝编译你的程序。\n\n你的下一个想法是每当出现 12 时就将其替换为 11：\n\n```java\n\
    public static int getRandomNumber()\n{\n    int num = (int)(Math.random() * 20)\
    \ + 1;\n    if (num != 12)\n    return num;\n    else\n    return 11;\n}\n```\n\
    \n当天晚晚些时候，你意识到这个解决方案并不是好主意，因为数字不再是真正的随机了。良好的随机数生成器的要求之一是，任何数字出现的概率应该与任何其他数字相等。但因为你把所有的\
    \ 12 都变成了 11，你让 11 出现的概率变成了其他数字的两倍。\n\n为了修复这个错误，你决定将随机数生成器放在一个循环中，只有当随机数不是 12\
    \ 时，循环才会结束：\n\n```java\npublic static int getRandomNumber()\n{\n    int num;\n\
    \    do\n    {\n        num = (int)(Math.random() * 20) + 1;\n        if (num\
    \ != 12)\n        return num;\n    } while (num == 12);\n}\n```\n\n但编译器再次拒绝编译该方法。事实证明编译器很聪明，但并不十分聪明。它没有发现\
    \ `do-while` 循环中的条件与 `if` 语句中的条件是相反，这意味着离开这个循环的唯一方法就是通过 `if` 语句中的 `return` 语句。所以编译器再次抱怨\
    \ `missing return statement`。\n\n在思考了一会儿后，你想出了解决方案：\n\n```java\npublic static\
    \ int getRandomNumber()\n{\n    int num;\n    while (true)\n    {\n        num\
    \ = (int)(Math.random() * 20) + 1;\n        if (num != 12)\n        return num;\n\
    \    }\n}\n```\n\n现在大家都开心了。编译器知道离开循环的唯一方法是通过执行 `return` 语句，你那个恐数字 12 症的用户不需要担心看到数字\
    \ 12，而你也知道随机数变成 11 的概率并不是其他数字的两倍。生活很美好，你可以继续下一个主题了。\n\n## 带参数的方法\n\n`parameter`（参数）是你可以传递给方法的值。然后方法就可以像使用局部变量一样使用参数，其初始值为调用方法传递给它的变量值。\n\
    \n这里有一个名为 `getRandomNumber` 的方法，它返回一个 1 到 10 之间的随机数：\n\n```java\npublic static\
    \ int getRandomNumber()\n{\n    return (int)(Math.random() * 10) + 1;\n}\n```\n\
    \n这个方法很有用，但如果你能告诉它随机随机数落在哪个范围内，它会更有用。如果能这样调用方法来获取 1 到 10 之间的随机数就太棒了：\n\n```java\n\
    int number = getRandomNumber(1, 10);\n```\n\n那么，如果你的程序需要掷骰子，你可以调用同一个方法：\n\n```java\n\
    int number = getRandomNumber(1, 6);\n```\n\n或者，从 52 张扑牌中随机抽取一张牌，你可以这样调用它：\n\n\
    ```java\nint number = getRandomNumber(1, 52);\n```\n\n你也不一定得从 1 开始。要获取 50 到 100\
    \ 之间的随机数，你可以这样调用方法：\n\n```java\nint number = getRandomNumber(50, 100);\n```\n\n\
    接受参数的方法必须在方法声明中列出参数。参数放置在方法名后面括号内的 `parameter list` 中。对于方法使用的每个参数，你列出参数类型，然后是参数名称。如果你需要多个参数，用逗号分隔参数。\n\
    \n这里是接受参数的 `getRandomNumber` 方法版本：\n\n```java\npublic static int getRandomNumber(int\
    \ min, int max)\n{\n    return (int)(Math.random() * (max - min + 1)) + min;\n\
    }\n```\n\n这里该方法使用了两个参数，类型均为 `int`，名为 `min` 和 `max`。然后，在方法体内，这些参数可以像局部变量一样被使用。\n\
    \n# 第 9 章\n\n# 异常处理\n\n本章内容\n\n- 当良好的程序发生糟糕情况时该怎么办\n- 了解关于异常的所有信息\n- 使用 try、 catch\
    \ 和 finally\n\n本章介绍的是当 Java 遇到它无法处理的错误情况时发生的情况。作为一种面向对象的编程语言，Java 通过错误发生时创建的特殊\
    \ `exception objects`（异常对象）来处理错误。此外，Java 还有一种特殊的 `try` 语句，你必须使用它来处理异常对象。在本章中，你将找到处理异常对象和\
    \ `try` 语句的所有细节。\n\n理解异常\n\n`exception`（异常）是在 Java 程序中发生错误且 Java 无法自动修复错误时创建的对象。异常对象包含了关于发生错误类型的信息。最重要的信息——错误原因——由异常类名称指示。你通常根据异常类来处理异常。\n\
    \n每种可能发生的异常类型都由不同的异常类表示。这里有一些典型的异常：\n\n- `IllegalArgumentException`: 你向方法传递了错误的参数。\n\
    - `InputMismatchException`: 输入与 `Scanner` 方法期望的数据类型不匹配。\n- `ArithmeticException`:\
    \ 你尝试了非法的算术操作，例如除以零。\n- `IOException`: 执行 I/O 时遇到了不可恢复的 I/O 错误。\n- `ClassNotFoundException`:\
    \ 找不到必要的类。\n\n还有许多其他类型的异常，你将在后面的章节中学习。\n\n关于异常你还需要了解以下几点：\n\n- 当错误发生并创建异常对象时，Java\
    \ 被认为**抛出了异常**。Java 有一套良好的抛出机制，因此异常总是抛回给导致它的语句。\n- 当异常发生时，你的程序可以 `catch` 它想要的异常，但如果不想捕捉，也可以躲让其他人捕捉。那个其他人是调用当前执行方法的语句。\n\
    - 如果大家都躲且异常没有被程序捕获，程序将意外终止并在控制台上显示难看的异常信息。\n- Java 中的两种基本异常类型是检查异常和未检查异常：\n  \
    \  - `checked exception`（检查异常）是编译器要求你必须以某种方式提供的异常。如果不提供，程序将无法编译。\n    - `unchecked\
    \ exception`（未检查异常）是可以提供但不必提供的异常。\n\n捕获异常\n\n每使用可能抛出异常的语句时，都应该编写特殊代码来预测并捕获异常。这样当异常发生时，程序就不会崩溃。\n\
    \n你通过使用 `try` 语句来捕获异常，它通常遵循以下形式：\n\n```java\ntry\n{\n    // 可能抛出异常的语句\n}\ncatch\
    \ (exception-type identifier)\n{\n    // 抛出异常时执行的语句\n}\n```\n\n在这里，你将可能抛出异常的语句放在\
    \ `try` 块中。然后你用 `catch` 块捕获异常。\n\n关于 `try` 语句有几点注意：\n\n- 你可以使用多个 `catch` 块。这样，如果\
    \ `try` 块中的语句可能抛出多种类型的异常，你可以在单独的 `catch` 块中捕获每种异常。\n- 你可以在单个 `catch` 块中捕获多个异常。\n"
- fmt: "\n* For scoping purposes, the `try` block is its own self-contained block,\
    \ separate from the `catch` block. As a result, any variables you declare in the\
    \ `try` block are not visible to the `catch` block. If you want them to be, declare\
    \ them immediately before the `try` statement.\n* You can also code a special\
    \ block (called a `finally block`) after all the `catch` blocks. For more information\
    \ about coding `finally` blocks, see the section “[Using a `finally` Block](#c09.xhtml_c09-sec-0010),”\
    \ later in this chapter.\n* The various exception classes in the `Java` API are\
    \ defined in different packages. If you use an exception class that isn’t defined\
    \ in the standard `java.lang` package that’s always available, you need to provide\
    \ an `import` statement for the package that defines the exception class.\n\n\
    ### A simple example\n\nTo illustrate how to provide for an exception, here’s\
    \ a program that divides two numbers and uses a `try`/`catch` statement to catch\
    \ an exception if the second number turns out to be zero:\n\n```java\npublic class\
    \ DivideByZero\n{\n    public static void main(String[] args)\n    {\n       \
    \ int a = 5;\n        int b = 0; // you know this won't work!\n        try\n \
    \       {\n            int c = a / b; // but you try it anyway\n        }\n  \
    \      catch (ArithmeticException e)\n        {\n            System.out.println(\"\
    Oops, you can't divide by zero.\");\n        }\n    }\n}\n```\n\nHere, the division\
    \ occurs within a `try` block, and a `catch` block handles `ArithmeticException`.\
    \ `ArithmeticException` is defined by `java.lang`, so an `import` statement for\
    \ it isn’t necessary.\n\nWhen you run this program, the following is displayed\
    \ on the console:\n\n```\nOops, you can't divide by zero.\n```\n\nThere’s nothing\
    \ else to see here. The next section shows a more complicated example, though.\n\
    \n### Another example\n\n[Listing 9-1](#c09.xhtml_c09-fea-0001) shows a simple\
    \ example of a program that uses a method to get a valid integer from the user.\
    \ If the user enters a value that isn’t a valid integer, the `catch` block catches\
    \ the error and forces the loop to repeat.\n\n[LISTING 9-1](#c09.xhtml_rc09-fea-0001)\
    \ Getting a Valid Integer\n\n```java\nimport java.util.*;\npublic class GetInteger\n\
    {\n    static Scanner sc = new Scanner(System.in);\n    public static void main(String[]\
    \ args)\n    {\n        System.out.print(\"Enter an integer: \");\n        int\
    \ i = GetAnInteger();\n        System.out.println(\"You entered \" + i);\n   \
    \ }\n    public static int GetAnInteger()\n    {\n        while (true)\n     \
    \   {\n            try\n            {\n                return sc.nextInt();\n\
    \            }\n            catch (InputMismatchException e)\n            {\n\
    \                sc.next();\n                System.out.print(\"That's not \"\
    \ + \"an integer. Try again: \");\n            }\n        }\n    }\n}\n```\n\n\
    Here the statement that gets the input from the user and returns it to the calling\
    \ method is coded within the `try` block. If the user enters a valid integer,\
    \ this statement is the only one in this method that gets executed.\n\nIf the\
    \ user enters data that can’t be converted to an integer, however, the `nextInt`\
    \ method throws an `InputMismatchException`. Then this exception is intercepted\
    \ by the `catch` block — which disposes of the user’s incorrect input by calling\
    \ the `next` method and then displays an error message. Then the `while` loop\
    \ repeats.\n\nHere’s what the console might look like for a typical execution\
    \ of this program:\n\n```\nEnter an integer: three\nThat's not an integer. Try\
    \ again: 3.001\nThat's not an integer. Try again: 3\nYou entered 3\n```\n\nHere\
    \ are a couple other things to note about this program:\n* The `import` statement\
    \ specifies `java.util.*` to import all the classes from the `java.util` package.\
    \ That way, the `InputMismatchException` class is imported.\n* The `next` method\
    \ must be called in the `catch` block to dispose of the user’s invalid input because\
    \ the `nextInt` method leaves the input value in the `Scanner`’s input stream\
    \ if an `InputMismatchException` is thrown. If you omit the statement that calls\
    \ `next`, the `while` loop keeps reading it, throws an exception, and displays\
    \ an error message in an infinite loop. If you don’t believe us, look at [Figure\
    \ 9-1](#c09.xhtml_c09-fig-0001). We found this error out the hard way. (The only\
    \ way to make it stop is to close the console window.)\n\n![Screenshot shows the\
    \ repeated lines of text indicate that a user is encountering an error while trying\
    \ to input an integer value.](images/9781394296972-fg0901.png)\n\n[FIGURE 9-1:](#c09.xhtml_rc09-fig-0001)\
    \ Why you have to call next to discard the invalid input.\n\n## Handling Exceptions\
    \ with a Preemptive Strike\n\nThe `try` statement is a useful tool in any programmer.\
    \ The best way to handle exceptions, however, is to prevent them from happening.\
    \ For example, you can avoid `ArithmeticException` by checking the data:\n\n```java\n\
