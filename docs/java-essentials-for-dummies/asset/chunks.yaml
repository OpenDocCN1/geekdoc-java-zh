  raw: '![Tip](images/tip.png) You don’t have to place class variable declarations
    at the beginning of a class. Some programmers prefer to place them at the end
    of the class, as in this example:


    `public class HelloApp`


    `{`


    `public static void main(String[] args)`


    `{`


    `helloMessage = "Hello, World!";`


    `System.out.println(helloMessage);`


    `}`


    `static String helloMessage;`


    `}`


    Here the `helloMessage` variable is declared *after* the `main` method.


    ![Tip](images/tip.png) We think classes are easier to read if the variables are
    declared first, so that’s where you see them in this book.


    ### Declaring instance variables


    An *instance variable* is similar to a class variable but doesn’t specify the
    word `static` in its declaration. As the name suggests, instance variables are
    associated with instances of classes. As a result, you can use them only when
    you create an instance of a class. Because static methods aren’t associated with
    an instance of the class, you can’t use an instance variable in a static method
    — and that includes the `main` method.


    The following example program won’t compile:


    `public class HelloApp`


    `{`


    `String helloMessage;`


    `public static void main(String[] args)`


    `{`


    `helloMessage = "Hello, World!";`


    `System.out.println(helloMessage); // will not compile`


    `}`


    `}`


    If you try to compile this program, you get the following error messages:


    `C:\Java\HelloApp.java:7: error: non-static variable helloMessage cannot be referenced
    from a static context`


    `helloMessage = "Hello, World!";`


    `^`


    `C:\Java\HelloApp.java:8: non-static variable helloMessage cannot be referenced
    from a static context`


    `System.out.println(helloMessage);`


    `^`


    Both of these errors occur because the `main` method is static, so it can’t access
    instance variables.


    Instance variables are useful whenever you create your own classes, but because
    we don’t cover that topic until [Chapter 10](#c10.xhtml), you won’t see many examples
    of instance methods until then.


    ### Declaring local variables


    A *local variable* is a variable that’s declared within the body of a method.
    Then you can use the variable only within that method. Other methods in the class
    aren’t even aware that the variable exists.


    Here’s a version of the `HelloApp` class in which the `helloMessage` variable
    is declared as a local variable:


    `public class HelloApp`


    `{`


    `public static void main(String[] args)`


    `{`


    `String helloMessage;`


    `helloMessage = "Hello, World!";`


    `System.out.println(helloMessage);`


    `}`


    `}`


    Note that you don’t specify `static` on a declaration for a local variable. If
    you do, the compiler generates an error message and refuses to compile your program.
    Local variables always exist within the scope of a method, and they exist only
    while that method is executing. As a result, whether an instance of the class
    has been created is irrelevant. (For more information, see the section “[Understanding
    Scope](#c04.xhtml_c04-sec-0023),” later in this chapter.)


    ![Tip](images/tip.png) Unlike class and instance variables, a local variable is
    fussy about where you position the declaration for it. In particular, you must
    place the declaration before the first statement that actually uses the variable.
    Thus the following program won’t compile:


    `public class HelloApp`


    `{`


    `public static void main(String[] args)`


    `{`


    `helloMessage = "Hello, World!"; // error -- helloMessage`


    `System.out.println(helloMessage); // is not yet declared`


    `String helloMessage;`


    `}`


    `}`


    When it gets to the first line of the `main` method, the compiler generates two
    error messages complaining that it can’t find the symbol `"helloMessage"`. That’s
    because the symbol hasn’t been declared.


    Although most local variables are declared near the beginning of a method’s body,
    you can also declare local variables within smaller blocks of code marked by braces.
    This will make more sense to you when you read about statements that use blocks,
    such as `if` and `for` statements. But here’s an example:


    `if (taxRate > 0)`


    `{`


    `double taxAmount;`


    `taxAmount = subTotal * taxRate;`


    `total = subTotal + total;`


    `}`


    Here the variable `taxAmount` exists only within the set of braces that belongs
    to the `if` statement. (You can assume that the variables `taxRate`, `subtotal`,
    and `total` are defined outside of the code block defined by the braces.)


    ## Initializing Variables


    In Java, local variables are not given initial default values. The compiler checks
    to make sure that you have assigned a value before you use a local variable. The
    following example program won’t compile:


    `public class TestApp`


    `{`


    `public static void main(String[] args)`


    `{`


    `int i;`


    `System.out.println("The value of i is " + i);`


    `}`


    `}`


    If you try to compile this program, you get the following error message:


    `C:\Java\TestApp.java:6: error: variable i might not have been initialized`


    `System.out.println("The value of i is " + i);`


    `^`


    To avoid this error message, you must initialize local variables before you use
    them. You can do that by using an assignment statement or an initializer, as we
    describe in the following sections.


    ![Tip](images/tip.png) Unlike local variables, class variables and instance variables
    are given default values. Numeric types are automatically initialized to zero,
    and `String` variables are initialized to empty strings. As a result, you don’t
    have to initialize a class variable or an instance variable, although you can
    if you want them to have an initial value other than the default.


    ### Initializing variables with assignment statements


    One way to initialize a variable is to code an *assignment statement* following
    the variable declaration. Assignment statements have this general form:


    *`variable`* `=` *`expression`*`;`


    Here, the `expression` can be any Java expression that yields a value of the same
    type as the variable. Here’s a version of the `main` method from the previous
    example that correctly initializes the `i` variable before using it:


    `public static void main(String[] args)`


    `{`


    `int i;`


    `i = 0;`


    `System.out.println("i is " + i);`


    `}`


    In this example, the variable is initialized to a value of zero before the `println`
    method is called to print the variable’s value.


    You find out a lot more about expressions in [Chapter 5](#c05.xhtml). For now,
    you can just use simple literal values, such as `0` in this example.


    ### Initializing variables with initializers


    Java also allows you to initialize a variable on the same statement that declares
    the variable. To do that, you use an *initializer,* which has the following general
    form:


    *`type name`* `=` *`expression`*`;`


    In effect, the initializer lets you combine a declaration and an assignment statement
    into one concise statement. Here are some examples:


    `int x = 0;`


    `String lastName = "Lowe";`


    `double radius = 15.4;`


    In each case, the variable is both declared and initialized in a single statement.


    When you declare more than one variable in a single statement, each variable can
    have its own initializer. The following code declares variables named `x` and
    `y`, and initializes `x` to `5` and `y` to `10`:


    `int x = 5, y = 10;`


    ![Warning](images/warning.png) When you declare two class or instance variables
    in a single statement but use only one initializer, you can mistakenly think that
    the initializer applies to both variables. Consider this statement:


    `static int x, y = 5;`


    Here you might think that both `x` and `y` would initialize to `5`. But the initializer
    applies only to `y`, so `x` is initialized to its default value, `0`. (If you
    make this mistake with a local variable, the compiler displays an error message
    for the first statement that uses the `x` variable because it isn’t properly initialized.)


    ## Using Final Variables (Constants)


    A *final variable* is a variable whose value you can’t change after it’s been
    initialized. To declare a final variable, you add the `final` keyword to the variable
