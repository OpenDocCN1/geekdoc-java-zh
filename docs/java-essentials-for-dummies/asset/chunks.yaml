    Chapter 5


    # Working with Numbers and Expressions


    IN THIS CHAPTER


    ![Bullet](images/check.png) **Dealing with operators, such as `+`, `–`, `*`, and
    `/`**


    ![Bullet](images/check.png) **Creating finely crafted expressions**


    ![Bullet](images/check.png) **Using the `Math` class**


    ![Bullet](images/check.png) **Formatting your numbers**


    In [Chapter 4](#c04.xhtml), you discover the various primitive numeric types that
    are supported by Java. In this chapter, you build on that knowledge by doing basic
    operations with numbers. Much of this chapter focuses on the complex topic of
    *expressions,* which combine numbers with operators to perform calculations. This
    chapter also covers performing advanced calculations using the `Math` class and
    techniques for formatting numbers when you display them.


    ## Working with Arithmetic Operators


    An *operator* is a special symbol or keyword that’s used to designate a mathematical
    operation or some other type of operation that can be performed on one or more
    values, called *operands.* In all, Java has about 40 operators. This chapter focuses
    on the operators that do arithmetic. These *arithmetic operators* — seven of them
    in all, summarized in [Table 5-1](#c05.xhtml_c05-tbl-0001) — perform basic arithmetic
    operations, such as addition, subtraction, multiplication, and division.


    | **Operator** | **Description** |


    | --- | --- |


    | `+` | Addition; also used as a unary operator to indicate a positive number
    |


    | `-` | Subtraction; also used as a unary operator to indicate a negative number
    |


    | `*` | Multiplication |


    | `/` | Division |


    | `%` | Remainder (Modulus) |


    | `++` | Increment |


    | `--` | Decrement |


    [TABLE 5-1](#c05.xhtml_rc05-tbl-0001) Java’s Arithmetic Operators


    The following section of code can help clarify how these operators work for `int`
    types:


    `int a = 32, b = 5;`


    `int c = a + b; // c is 37`


    `int d = a - b; // d is 27`


    `int e = a * b; // e is 160`


    `int f = a / b; // f is 6 (32 / 5 is 6 remainder 2)`


    `int g = a % b; // g is 2 (32 / 5 is 6 remainder 2)`


    `a++; // a is now 33`


    `b--; // b is now 4`


    Notice that for division, the result is truncated. Thus `32 / 5` returns `6`,
    not `6.4`.


    Here’s how the operators work for `double` values:


    `double x = 5.5, y = 2.0;`


    `double m = x + y; // m is 7.5`


    `double n = x - y; // n is 3.5`


    `double o = x * y; // o is 11.0`


    `double p = x / y; // p is 2.75`


    `double q = x % y; // q is 1.5`


    `x++; // x is now 6.5`


    `y--; // y is now 1.0`


    ## Using Compound Assignment Operators


    A *compound assignment operator* is an operator that performs a calculation and
    an assignment at the same time. All of Java’s binary arithmetic operators (that
    is, the ones that work on two operands) have equivalent compound assignment operators,
    which [Table 5-2](#c05.xhtml_c05-tbl-0002) lists.


    | **Operator** | **Description** |


    | --- | --- |


    | `+=` | Addition and assignment |


    | `-=` | Subtraction and assignment |


    | `*=` | Multiplication and assignment |


    | `/=` | Division and assignment |


    | `%=` | Remainder and assignment |


    [TABLE 5-2](#c05.xhtml_rc05-tbl-0002) Compound Assignment Operators


    The statement


    `a += 10;`


    is equivalent to


    `a = a + 10;`


    Also, the statement


    `z *=2;`


    is equivalent to


    `z = z * 2;`


    ## Using the Math Class


    Java’s built-in operators are useful, but they don’t come anywhere near providing
    all the mathematical needs of most Java programmers. That’s where the `Math` class
    comes in. It includes a bevy of built-in methods that perform a wide variety of
    mathematical calculations, from basic functions such as calculating an absolute
    value or a square root to trigonometry functions such as sin and cos (sine and
    cosine), to practical functions such as rounding numbers or generating random
    numbers.


    The following sections describe the most useful methods of the `Math` class.


    ### Using constants of the Math class


    The `Math` class defines two constants that are useful for many mathematical calculations.
    [Table 5-3](#c05.xhtml_c05-tbl-0003) lists these constants.


    | **Constant** | **What It Is** | **Value** |


    | --- | --- | --- |


    | `PI` | The constant pi (π), the ratio of a circle''s radius and diameter | 3.141592653589793
    |


    | `E` | The base of natural logarithms | 2.718281828459045 |


    [TABLE 5-3](#c05.xhtml_rc05-tbl-0003) Constants of the Math Class


    Note that these constants are only approximate values, because both π and *e*
    are irrational numbers.


    The program shown in [Listing 5-1](#c05.xhtml_c05-fea-0001) illustrates a typical
    use of the constant `PI`. Here, the user is asked to enter the radius of a circle.
    Then the program calculates the area of the circle in line 11\. (The parentheses
    aren’t really required in the expression in this statement, but they help clarify
    that the expression is the Java equivalent to the formula for the area of a circle,
    πr².)


    Here’s the console output for a typical execution of this program, in which the
    user entered `5` as the radius of the circle:


    `Welcome to the circle area calculator.`


    `Enter the radius of your circle: 5`


    `The area is 78.53981633974483`


    [LISTING 5-1](#c05.xhtml_rc05-fea-0001) The Circle Area Calculator


    `import java.util.Scanner;`


    `public class CircleAreaApp`


    `{`


    `static Scanner sc = new Scanner(System.in);`


    `public static void main(String[] args)`


    `{`


    `System.out.println(`


    `"Welcome to the circle area calculator.");`


    `System.out.print("Enter the radius of your circle: ");`


    `double r = sc.nextDouble();`


    `double area = Math.PI * (r * r);``→11`


    `System.out.println("The area is " + area);`


    `}`


    `}`


    ### Working with mathematical functions


    [Table 5-4](#c05.xhtml_c05-tbl-0004) lists the basic mathematical functions that
    are provided by the `Math` class. As you can see, you can use these functions
    to calculate such things as the absolute value of a number, the minimum and maximum
    of two values, square roots, powers, and logarithms.


    | **Method** | **Explanation** |


    | --- | --- |


    | `abs(argument)` | Returns the absolute value of the argument. The argument can
    be an `int`, `long`, `float`, or `double`. The return value is the same type as
    the argument. |


    | `cbrt(argument)` | Returns the cube root of the argument. The argument and return
    value are `double`s. |


    | `exp(argument)` | Returns *e* raised to the power of the argument. The argument
    and the return value are `double`s. |


    | `hypot(arg1, arg2)` | Returns the hypotenuse of a right triangle calculated
    according to the Pythagorean theorem — √ x² + y². The argument and the return
    values are `double`s. |


    | `log(argument)` | Returns the natural logarithm (base *e*) of the argument.
    The argument and the return value are `double`s. |


    | `log10(argument)` | Returns the base 10 logarithm of the argument. The argument
    and the return value are `double`s. |


    | `max(arg1, arg2)` | Returns the larger of the two arguments. The arguments can
    be `int`, `long`, `float`, or `double`. The return type is the same type as the
    arguments. |


    | `min(arg1, arg2)` | Returns the smaller of the two arguments. The arguments
    can be `int`, `long`, `float`, or `double`. The return type is the same type as
    the arguments. |


    | `pow(arg1, arg2)` | Returns the value of the first argument raised to the power
    of the second argument. Both arguments and the return value are `double`s. |


    | `random()` | Returns a random number that''s greater than or equal to 0.0 but
    less than 1.0\. This method doesn’t accept an argument, but the return value is
    a `double`. |'
