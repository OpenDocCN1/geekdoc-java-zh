    \ + \" \");\n            number += 2;\n        }\n        System.out.println();\n\
    \    }\n}\n```\n\n如果你运行此程序，控制台窗口将显示以下输出：\n\n`2 4 6 8 10 14 16 18 20`\n\n## 使用\
    \ continue 语句\n\n有时你想跳过循环体的剩余部分回到表达式求值。为了这样做，你使用 `continue` 语句。这里是 `Dodecapobia`\
