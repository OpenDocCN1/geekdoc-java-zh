    \n[FIGURE 1-2:](#c01.xhtml_rc01-fig-0002) Creating the `JAVA_HOME` variable.\n\
    \n### 9. Peruse the list of entries in the `Path` variable. If you find one that\
    \ references a previous version of Java, delete it.\n\nSpecifically, look for\
    \ an entry that begins with `C:\\Program Files\\Java`. If you find such an entry,\
    \ select it and then click Delete.\n\n### 10. Click the New button.\n\nThis opens\
    \ a line for you to create a new path entry.\n\n![Screenshot of the “Edit environment\
    \ variable” window on a Windows operating system. The window displays a list of\
    \ system variables under the “Variable value” field. Notable entries include paths\
    \ to various system directories and installed programs, such as Oracle Java. The\
    \ highlighted entry corresponds to the Oracle Java installation path. Buttons\
    \ on the right side allow actions like “New,” “Edit,” and “Delete.”](images/9781394296972-fg0103.png)\n\
    \n[FIGURE 1-3:](#c01.xhtml_rc01-fig-0003) Editing the `Path` variable.\n\n###\
    \ 11. Type %JAVA_HOME%\\bin as the new path entry.\n\nThe percent signs insert\
    \ the value of the `JAVA_HOME` variable in your new path entry. For example, if\
    \ `JAVA_HOME` is set to `C:\\Program Files\\Java\\jdk19`, the new path entry will\
    \ be `C:\\Program Files\\Java\\jdk19\\bin`.\n\n### 12. Click OK three times to\
    \ exit.\n\nThe first OK gets you back to the Environment Variables dialog box;\
    \ the second OK gets you back to the System Properties dialog box; and the third\
    \ OK closes the System Properties dialog box.\n\nFor Linux, the procedure depends\
    \ on which shell you’re using. For more information, consult the documentation\
    \ for the shell you’re using.\n\n## Confirming Your Java Version\n\nAfter you’ve\
    \ installed Java, it’s a good idea to confirm that you’ve installed the correct\
    \ version. To do that, follow these steps:\n\n1. **Press the Windows key, type\
    \ `cmd`, and press Enter to open a command prompt.**\n\n2. **Type `java -version`\
    \ and press Enter.**\n\n   This command instructs Java to display its version\
    \ number. You’ll see output similar to this:\n\n   ```\n   openjdk version \"\
    19-ea\" 222-09-20\n   OpenJDK Runtime Environment (build 19-ea+27-2074)\n   OpenJDK\
    \ 64-Bit VM VM (build 19-ea++27-2074, mixed mode, sharing)\n   ```\n\n3. **Confirm\
    \ that the first line of the output reflects the version you installed.**\n\n\
    \   In this example, Java version 19-ea is installed. The `ea` indicates that\
    \ we’re using the early-access version of Java 19, which is the version we used\
    \ as we wrote this book. By the time you read this, you’ll see a slightly different\
    \ version of Java 19 or later. Or, you may see a Java 18 or even a Java 17 version\
    \ number. Any of these versions will work for the coding examples in this book,\
    \ unless we specifically mention that a specific Java version is required.\n\n\
