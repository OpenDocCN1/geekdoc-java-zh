    ## Protecting Your Members


    You’re already familiar with the `public` and `private` keywords, which are used
    to indicate whether class members are visible outside the class or not. When you
    inherit a class, all the public members of the superclass are available to the
    subclass, but the private members aren’t.


    Java provides a third visibility option that’s useful when you create subclasses:
    `protected`. A member with `protected` visibility is available to subclasses and
    classes in the same package, but not to classes outside of the package. Consider
    this example:


    `public class Ball`


    `{`


    `private double weight;`


    `protected double getWeight()`


    `{`


    `return this.weight;`


    `}`


    `protected void setWeight(double weight)`


    `{`


    `this.weight = weight;`


    `}`


    `}`


    `public class BaseballBall extends Ball`


    `{`


    `public BaseballBall()`


    `{`


    `setWeight(5.125);`


    `}`


    `}`


    Here, the `getWeight` and `setWeight` methods are declared with `protected` access,
    which means that they’re visible in the subclass `BaseballBall`. These methods
    aren’t visible to classes that don’t extend `Ball`, however.


    ## Using the this and super Keywords in Your Subclasses


    The `this` keyword provides a way to refer to the current object instance. It’s
    often used to distinguish between a local variable or a parameter and a class
    field with the same name. For example:


    `public class Ball`


    `{`


    `private int velocity;`


    `public void setVelocity(int velocity)`


    `{`


    `this.velocity = velocity;`


    `}`


    `}`


    Here the `this` keyword indicates that the `velocity` variable referred to on
    the left side of the assignment statement is the class field named `velocity`,
    not the parameter with the same name.


    But what if you need to refer to a field or method that belongs to a base class?
    To do that, you use the `super` keyword. It works similarly to `this` but refers
    to the instance of the base class rather than the instance of the current class.


    Consider these two classes:


    `public class Ball`


    `{`


    `public void hit()`


    `{`


    `System.out.println("You hit it a mile!");`


    `}`


    `}`


    `class BaseballBall extends Ball`


    `{`


    `public void hit()`


    `{`


    `System.out.println("You tore the cover off!");`


    `super.hit();`


    `}`


    `}`


    Here the `hit` method in the `BaseballBall` class calls the `hit` method of its
    base class object. Thus, if you call the `hit` method of a `BaseballBall` object,
    the following two lines are displayed on the console:


    `You tore the cover off!`


    `You hit it a mile!`


    You can also use the `super` keyword in the constructor of a subclass to explicitly
    call a constructor of the superclass. For more information, see the next section.


    ## Understanding Inheritance and Constructors


    When you create an instance of a subclass, Java automatically calls the default
    constructor of the base class before it executes the subclass constructor. Consider
    the following classes:


    `public class Ball`


    `{`


    `public Ball()`


    `{`


    `System.out.println(`


    `"Hello from the Ball constructor");`


    `}`


    `}`


    `public class BaseballBall extends Ball`


    `{`


    `public BaseBall()`


    `{`


    `System.out.println(`


    `"Hello from the BaseballBall constructor");`


    `}`


    `}`


    If you create an instance of the `BaseballBall` class, the following two lines
    are displayed on the console:


    `Hello from the Ball constructor`


    `Hello from the BaseballBall constructor`


    If you want, you can explicitly call a base class constructor from a subclass
    by using the `super` keyword. Because Java automatically calls the parameterless
    constructor for you, the only reason to do this is to call a constructor of the
    base class that uses a parameter. Here’s a version of the `Ball` and `BaseballBall`
    classes in which the `BaseballBall` constructor calls a `Ball` constructor that
    uses a parameter:


    `public class Ball`


    `{`


    `private double weight;`


    `public Ball(double weight)`


    `{`


    `this.weight = weight;`


    `}`


    `}`


    `public class BaseballBall extends Ball`


    `{`


    `public BaseballBall()`


    `{`


    `super(5.125);`


    `}`


    `}`


    Here the `BaseballBall` constructor calls the `Ball` constructor to supply a default
    weight for the ball.


    ![Remember](images/remember.png) You need to obey a few rules and regulations
    when working with superclass constructors:


    *   If you use `super` to call the superclass constructor, you must do so in the
    very first statement in the constructor.


    *   ![Warning](images/warning.png) If you don’t explicitly call `super`, the compiler
    inserts a call to the parameterless constructor of the base class. In that case,
    the base class must have a parameterless constructor. If the base class doesn’t
    have a parameterless constructor, the compiler refuses to compile the program.


    *   If the superclass is itself a subclass, the constructor for its superclass
    is called in the same way. This continues all the way up the inheritance hierarchy
    until you get to the `Object` class, which has no superclass.


    ## Using the final Keyword


    Java has a `final` keyword that serves three purposes. When you use `final` with
    a variable, it creates a constant whose value can’t be changed after it has been
    initialized. Constants are covered in [Chapter 4](#c04.xhtml), so we won’t describe
    this use of the `final` keyword more here. The other two uses of the `final` keyword
    are to create final methods and final classes. We describe these two uses of `final`
    in the following sections.


    ### Final methods


    A *final method* is a method that can’t be overridden by a subclass. To create
    a final method, you simply add the keyword `final` to the method declaration.
    For example:


    `public class SpaceShip`


    `{`


    `int velocity = 0;`


    `public final int getVelocity()`


    `{`


    `return this.velocity;`


    `}`


    `}`


    Here the method `getVelocity` is declared as `final`. Thus, any class that uses
    the `SpaceShip` class as a base class can’t override the `getVelocity` method.
    If it tries, the compiler issues the error message `overridden method is final`.


    ### Final classes


    A *final class* is a class that can’t be used as a base class. To declare a class
    as final, just add the `final` keyword to the class declaration:


    `public final class BaseballBall extends Ball`


    `{`


    `// members for the BaseballBall class go here`


    `}`


    Then no one can use the `BaseballBall` class as the base class for another class.


    When you declare a class to be final, all of its methods are considered to be
    final as well. That makes sense when you think about it. Because you can’t use
    a final class as the base class for another class, no class can possibly be in
    a position to override any of the methods in the final class. Thus all the methods
    of a final class are final methods.


