  trans: "\n这将弹出一个方便的对话框，允许你向 `Path` 变量添加或删除路径，或者更改路径的顺序，如图 1-3 所示。\n\n![图像显示了一个标题为“环境变量”的对话框。doug\
    \ 的用户变量：OneDrive, OneDriveCommercial, OneDriveConsumer, Path。系统变量：OnlineServices,\
    \ OS, Path, PATHEXT, PROCESSOR_ARCHITECTURE, PROCESSOR IDENTIFIER。](img/9781394296972-fg0101.png)\n\
    \n图 1-1： 环境变量对话框。\n\n![图像显示了一个用于在计算机上创建新系统变量的对话框。该对话框包含“变量名”和“变量值”字段，以及“浏览目录”、“浏览文件”、“确定”和“取消”按钮。](img/9781394296972-fg0102.png)\n\
    \n图 1-2： 创建 `JAVA_HOME` 变量。\n\n### 9. 检查 `Path` 变量中的条目列表。如果你发现引用旧版本 Java 的条目，将其删除。\n\
    \n具体来说，寻找以 `C:\\Program Files\\Java` 开头的条目。如果你找到了此类条目，选中它并点击“删除”。\n\n### 10. 点击“新建”按钮。\n\
    \n这将打开一个行，供你创建新的路径条目。\n\n![Windows 操作系统上“编辑环境变量”窗口的截图。窗口显示了“变量值”字段下的系统变量列表。显著条目包括指向各种系统目录和已安装程序的路径，例如\
    \ Oracle Java。高亮的条目对应 Oracle Java 的安装路径。右侧的按钮允许“新建”、“编辑”和“删除”等操作。](img/9781394296972-fg0103.png)\n\
    \n图 1-3： 编辑 `Path` 变量。\n\n### 11. 输入 %JAVA_HOME%\\bin 作为新路径条目。\n\n百分号会在你的新路径条目中插入\
    \ `JAVA_HOME` 变量的值。例如，如果 `JAVA_HOME` 设置为 `C:\\Program Files\\Java\\jdk19`，则新路径条目将是\
    \ `C:\\Program Files\\Java\\jdk19\\bin`。\n\n### 12. 点击三次“确定”退出。\n\n第一次点击“确定”让你回到环境变量对话框；第二次点击“确定”让你回到系统属性对话框；第三次点击“确定”关闭系统属性对话框。\n\
    \n对于 Linux，步骤取决于你正在使用的 shell。更多信息，请查阅你所用 shell 的文档。\n\n## 确认你的 Java 版本\n\n安装 Java\
    \ 后，确认你安装了正确的版本是一个好主意。按照以下步骤操作：\n\n1. **按下 Windows 键，输入 `cmd` 并按回车打开命令提示符。**\n\
    \n2. **输入 `java -version` 并按回车。**\n\n   此命令指示 Java 显示其版本号。你会看到类似下面的输出：\n\n   ```\n\
    \   openjdk version \"19-ea\" 222-09-20\n   OpenJDK Runtime Environment (build\
    \ 19-ea+27-2074)\n   OpenJDK 64-Bit Server VM (build 19-ea+27-2074, mixed mode,\
    \ sharing)\n   ```\n\n3. **确认输出的第一行反映了你安装的版本。**\n\n   在此示例中，安装了 Java 版本 19-ea。`ea`\
    \ 表示我们正在使用 Java 19 的早期访问版本，这是我们编写此书时使用的版本。当你读到这里时，你会看到一个略有不同的 Java 19 或更高版本。或者，你可能会看到\
    \ Java 18 甚至 Java 17 版本号。这些任何一个版本都适用于书中的代码示例，除非我们特别提到需要特定的 Java 版本。\n\n4. **关闭命令窗口。**\n\
    \n# 第 2 章：使用 TextPad\n\n### 本章内容\n\n- ![Bullet](img/check.png) **获取 TextPad**\n\
    - ![Bullet](img/check.png) **使用 TextPad 编辑源文件**\n- ![Bullet](img/check.png) **编译\
    \ Java 程序**\n- ![Bullet](img/check.png) **运行 Java 程序**\n\nTextPad 是一款价格便宜（27 美元）的文本编辑器，你可以将其与\
    \ Java 开发包 (JDK) 集成，以简化编码、编译和运行 Java 程序的任务。它不是真正的集成开发环境 (IDE)，因为缺少集成调试、代码生成器以及创建图形用户界面的拖放工具等功能。\n\
    \nTextPad 因其简单快速，是开发 Java 程序的流行工具。它是学习 Java 的理想选择，因为它不会为你生成任何代码。自己编写每一行代码可能看起来麻烦，但从长远来看，这种练习是有回报的，因为你会更好地理解\
    \ Java 的原理。\n\n## 下载并安装 TextPad\n\n你可以从 Helios Software Systems 的 `www.textpad.com`\
    \ 下载 TextPad 的免费评估版本。\n\n"
