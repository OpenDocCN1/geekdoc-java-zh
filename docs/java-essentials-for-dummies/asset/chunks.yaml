  trans: "\n\n索引数字写在变量名后面并括在括号中。因此，如果变量名为 `x`，你可以使用像 `x[5]` 这样的表达式来访问特定元素。\n\n![Tip](img/tip.png)\
    \ 你可能认为 `x[5]` 是数组中的第五个元素。但索引号从第一个元素开始为零，因此 `x[5]` 实际上指的是第六个元素。这个小细节是处理数组时产生问题的主要原因之一——特别是如果你在一个数组从\
    \ 1 开始而不是从 0 开始索引的语言中学习数组编程时。因此，在 Java 中，请习惯从 0 开始计数，而不是从 1 开始。\n\n数组的真正威力来自于一个简单的事实：你可以使用变量甚至一个完整的表达式作为数组索引。因此（例如），你不是编写\
    \ `x[5]` 来引用特定的数组元素，而是编写 `x[i]` 来引用索引变量 `i` 所指示的元素。在本章中，你会看到大量索引变量的示例。\n\n在进入创建和使用数组的细节之前，这里有几个关于数组的小知识供你思考：\n\
    \n*   尽管数组没有对应的类文件，但数组仍然是一个对象。你可以通过使用不带索引的数组变量名来对数组对象整体进行引用，而不是数组的特定元素。因此，如果 `x[5]`\
    \ 指的是数组的一个元素，那么 `x` 指的就是数组本身。\n\n*   数组具有固定长度，该长度在创建数组时设置。这个长度决定了数组中可以存储元素的数量。你在任何数组上可以使用的最大索引值是数组长度减\
    \ 1。因此，如果你创建一个包含十个元素的数组，你可以使用从 `0` 到 `9` 的索引值。\n\n*   在创建数组后，你无法更改数组的长度。\n\n*\
    \   你可以通过数组变量的 `length` 字段访问数组的长度。例如，`x.length` 返回数组 `x` 的长度。\n\n## 创建数组\n\n在创建数组之前，你必须声明一个引用该数组的变量。这个`变量声明`\
    \ 应该指示数组存储的元素类型，后面紧跟一组空括号，如下所示：\n\n```java\nString[] names;\n```\n\n这里声明了一个名为\
    \ `names` 的变量。它的类型是 `String` 对象的数组。\n\n![Tip](img/tip.png) 这两个语句的效果完全相同。大多数 Java\
    \ 程序员倾向于将括号放在类型上，而不是变量名上。\n\n该语句本身并没有创建数组；它只是声明了一个可以引用数组的变量。你实际上可以通过两种方式创建数组：\n\
    \n*   使用 `new` 关键字后跟数组类型，这次在括号内填充数字以指示数组可以容纳多少元素。例如：\n\n    ```java\n    String[]\
    \ names;\n    names = new String[10];\n    ```\n\n    在这里，创建了一个可以容纳十个 `String`\
    \ 对象的数组。该数组中的每个字符串都被初始化为空字符串。\n\n*   像任何其他变量一样，你可以将声明和创建合并为一条语句：\n\n    ```java\n\
    \    String[] names = new String[10];\n    ```\n\n    在一条语句中声明了数组变量并创建了数组。\n\n\
    *   使用一种特殊的快捷方式，让你一次性创建数组并为其填充值：\n\n    ```java\n    String[] names = {\"One\"\
    , \"Two\", \"Three\"};\n    ```\n\n![Tip](img/tip.png) 如果你在此编译时不知道数组需要多少个元素，可以使用变量或表达式作为数组长度。这里有一个方法的例，它将玩家名称存储在字符串数组中。它首先询问用户团队中有多少位玩家。然后创建一个正确大小的数组：\n\
    \n    ```java\n    System.out.print(\"How many players? \");\n    int count =\
    \ sc.nextInt(); // sc 是一个 Scanner\n    String[] players = new String[count];\n\
    \    ```\n\n## 初始化数组\n\n初始化数组中值的一种方法是简单地逐个赋值：\n\n```java\nString[] days = new\
    \ String[7];\ndays[0] = \"Sunday\";\ndays[1] = \"Monday\";\ndays[2] = \"Tuesday\"\
    ;\ndays[3] = \"Wednesday\";\ndays[4] = \"Thursday\";\ndays[5] = \"Friday\";\n\
    days[6] = \"Saturday\";\n```\n\nJava 有一种简便的方法创建数组并用值初始化：\n\n```java\nString[]\
    \ days = { \"Sunday\", \"Monday\", \"Tuesday\",\n\"Wednesday\", \"Thursday\",\n\
    \"Friday\", \"Saturday\" };\n```\n\n在这里，要给数组的每个元素都列在`数组初始化器`中。这里是一个 `int` 数组的初始化器示例：\n\
    \n```java\nint[] primes = { 2, 3, 5, 7, 11, 13, 17 };\n```\n\n**注意：** 使用初始化器创建的数组长度由初始化器中列出的值数量决定。\n\
    \n初始化器的另一种编码方式是：\n\n```java\nint[] primes = new int[] { 2, 3, 5, 7, 11, 13, 17\
    \ };\n```\n\n要使用这种类型的初始化器，你使用 `new` 关键字后跟数组类型和一组括号。\n\n## 使用 for 循环数组\n\n处理数组的常用方法之一是使用\
    \ `for` 循环。事实上，`for` 循环是为了处理数组而发明的。这里有一个创建一个 100 个数字数组的 `for` 循环，范围从 `1` 到 `100`：\n\
    \n```java\nint[] numbers = new int[100];\nfor (int i = 0; i < 100; i++)\n    numbers[i]\
    \ = (int)(Math.random() * 100) + 1;\n```\n\n这是一个用用户输入的字符串填充数组的循环：\n\n```java\n\
    Scanner sc = new Scanner();\nint count = 5;\nString[] players = new String[count];\n\
    for (int i = 0; i < count; i++)\n{\n    System.out.print(\"Enter player name:\
    \ \");\n    players[i] = sc.nextLine(); // sc 是一个 Scanner\n}\n```\n\n前面的示例假设长度在执行之前已存储在变量中。如果你没有数组长度，可以从数组的\
    \ `length` 获取：\n\n```java\nfor (int i = 0; i < players.length; i++)\n    System.out.println(players[i]);\n\
    ```\n\n### 使用数组解决问题\n\n偶尔，数组和 `for` 循环可以帮你解决孩子的作业。我们曾帮助一个女儿完成过一道很难的数学作业。题目陈述如下：\n\
    \nBobo（这些题目总有一个叫 Bobo 的角色）周六访问当地中学，发现学校所有的 1000 个储物柜都整齐地关着。于是从学校的一端开始打开所有的。然后回到起点关闭每隔一个储物柜（第\
    \ 2、4、6 号……）。然后回到起点，经过每第三个储物柜：如果它是开着的，就关上它；如果它是关着的，就打开它。然后他经过每第四个、每五个储物柜，以此类推。他一直这样做，走了\
    \ 100 次走廊，打开又关闭。最后他感到无聊回家了。学校的 1000 个储物柜中还有几个是开着的？是哪些？\n\n天哪！\n\n这个问题提出了一个挑战，但也是学习\
    \ `for` 循环和数组的绝佳机会。我们写了一个小程序，设置了一个包含 1000 个布尔值的数组。每个值代表一个储物柜：`true`表示开启，`false`表示关闭。该程序使用一对嵌套的\
    \ `for` 循环进行计算。\n\n然而，储物柜的编号为 1 到 1000，但数组的元素编号为`0`到`999`，所以这种差异会导致问题。\n\n我们的解决方案是创建一个包含\
    \ 1001 个元素的数组并忽略第一个。这样，索引就能与储物柜编号良好地对应起来。\n\n"
