    `public class HelloApp2``→5`


    `{`


    `public static void main(String[] args)``→7`


    `{`


    `Greeter myGreeterObject = new Greeter();``→9`


    `myGreeterObject.sayHello();``→10`


    `}`


    `}`


    The following paragraphs describe the key points:


    1.  →1 This class begins with a series of comment lines identifying the function
    of the program. For these comments, we used simple end-of-line comments rather
    than traditional comments. (For more on commenting, see the “[Crafting Comments](#c03.xhtml_c03-sec-0010)”
