    \ String 字面量）和一个冒号。然后，如果 `switch` 表达式的值等于该常量，你就可以编写想要执行的一个或多个语句。每个 case 组的最后一行是一个可选的\
    \ `break` 语句，它会导致整个 `switch` 语句结束。\n\n`default` 组是可选的，类似于一个通用的 case 组。只有当之前所有的\
