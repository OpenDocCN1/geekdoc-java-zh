    ## 作者简介


    **Doug Lowe:** 自 Java 发明者还在读高中以来，Doug 就一直在编写计算机编程书籍了。他写过关于 COBOL、FORTRAN、ASP.NET、Visual
    Basic、IBM 主机、中型系统、PC、Web 编程的书籍，可能还有几本他早已遗忘了。他是 40 多本“傻傻类”（*For Dummies*）系列书籍的作者，其中包括第
    12 版《傻傻学网络》(Networking For Dummies)、第 8 版《傻傻网络合集》(Networking All-in-One For Dummies)、Office
    2021 版《傻傻学 PowerPoint》以及第 3 版《傻傻学电子学合集》（这些书籍均由 Wiley 出版）。他住在加利福尼亚州弗雷斯诺，这是一个阳光的美国式城市，那里的格言是“请让它下雨吧！”。


    **Paul McFedries:** Paul 是一位技术作家，他每天都在编写像你手里拿着的这本书一样的书。事实上，Paul 编写了超过 100 本此类书籍，全球销量超过四百万册。Paul
    的著作包括《傻傻学 HTML 和 CSS》(HTML and CSS Essentials For Dummies) 和《傻傻学 JavaScript 要素》(JavaScript
    Essentials For Dummies)。Paul 欢迎大家访问他的个人网站[`https://paulmcfedries.com`](https://paulmcfedries.com/)，或者在
    X 上关注他（[`www.x.com/paulmcf`](http://www.x.com/paulmcf)）或在 Facebook 上关注他（[`www.facebook.com/PaulMcFedries`](https://www.facebook.com/PaulMcFedries)）。


