    ## Understanding Scope


    The *scope* of a variable refers to which parts of a class the variable exists
    in. In the simplest terms, every variable exists only within the block in which
    the variable is declared, as well as any blocks that are contained within that
    block. That’s why class variables, which are declared in the class body, can be
    accessed by any methods defined by the class, but local variables defined within
    a method can be accessed only by the method in which they are defined.


    ![Remember](images/remember.png) In Java, a *block* is marked by a matching pair
    of braces. Java has many kinds of blocks, including class bodies, method bodies,
    and block statements that belong to statements such as `if` or `for` statements.
    But in each case, a block marks the scope boundaries for the variables declared
    within it.


    The program in [Listing 4-1](#c04.xhtml_c04-fea-0001) can help clarify the scope
    of class and local variables.


    [LISTING 4-1](#c04.xhtml_rc04-fea-0001) A Program That Demonstrates Scope for
    Class and Local Variables


    `public class ScopeApp`


    `{``→2`


    `static int x;`


    `public static void main(String[] args)`


    `{`


    `x = 5;`


    `System.out.println("main: x = " + x);`


    `myMethod();`


    `}`


    `public static void myMethod()`


    `{`


    `int y;``→12`


    `y = 10;`


    `if (y == x + 5)`


    `{``→15`


    `int z;`


    `z = 15;`


    `System.out.println("myMethod: z = " + z);`


    `}``→19`


    `System.out.println("myMethod: x = " + x);`


    `System.out.println("myMethod: y = " + y);`


    `}``→22`


    `}``→23`


    The following paragraphs explain the scope of each of the variables used in this
    class:


    1.  →2: The variable `x` is a `class` variable. Its scope begins in line 2 and
    ends in line 23\. As a result, both the `main` method and the `myMethod` method
    can access it.


    2.  →12: The variable `y` is a local variable that’s declared in line 12 and initialized
    in the next line. As a result, its scope begins in line 12 and ends in line 22,
    which marks the end of the body of the `myMethod` method.'
