    \ `firstName` and `lastName`. You can create a constructor for the `Actor` class:\n\
    \n`public Actor(String first, String last)`\n\n`{`\n\n`firstName = first;`\n\n\
    `lastName = last;`\n\n`}`\n\nThen you create an instance of the `Actor` class\
    \ by calling this constructor:\n\n`Actor a = new Actor(\"Arnold\", \"Schwarzenegger\"\
    );`\n\nA new `Actor` object for Arnold Schwarzenegger is created.\n\nLike methods,\
    \ constructors can be overloaded. In other words, you can provide more than one\
    \ constructor for a class, provided that each constructor has a unique signature.\
    \ Here’s another constructor for the `Actor` class:\n\n`public Actor(String first,\
    \ String last, boolean good)`\n\n`{`\n\n`firstName = first;`\n\n`lastName = last;`\n\
    \n`goodActor = good;`\n\n`}`\n\nThis constructor lets you create an `Actor` object\
    \ with information besides the actor’s name:\n\n`Actor a = new Actor(\"Arnold\"\
    , \"Schwarzenegger\", false);`\n\n### Creating default constructors\n\nWe grew\
    \ up watching *Dragnet.* We can still hear Joe Friday reading some thug his rights:\
    \ “You have the right to an attorney during questioning. If you desire an attorney\
    \ and cannot afford one, an attorney will be appointed to you free of charge.”\n\
    \nJava constructors are like that. Every class has a right to a constructor. If\
    \ you don’t provide a constructor, Java appoints one for you, free of charge.\
    \ This free constructor is called the *default constructor.* It doesn’t accept\
    \ any parameters and doesn’t do anything, but it does allow your class to be instantiated.\n\
    \nThus, the following two classes are identical:\n\n`public class Class1`\n\n\
    `{`\n\n`public Class1() { }`\n\n`}`\n\n`public class Class1 { }`\n\nIn the first\
    \ example, the class explicitly declares a constructor that doesn’t accept any\
    \ parameters and has no statements in its body. In the second example, Java creates\
    \ a default constructor that works just like the constructor shown in the first\
    \ example."
