    | `exp(argument)` | 返回 e 的次方。参数和返回值都是 `double`。 |\n| `hypot(arg1, arg2)` | 根据勾股定理计算直三角形的斜边\
    \ — √ x² + y²。参数和返回值都是 `double`。 |\n| `log(argument)` | 返回参数的自然对数（底为 e）。参数和返回值都是\
