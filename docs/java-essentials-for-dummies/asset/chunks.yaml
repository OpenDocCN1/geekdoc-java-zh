    \ lockers are: \" + list);\n    }\n}\n```\n\n以下是程序的工作亮点：\n\n1.  **→6**: 这一行设置了一个包含\
    \ 1,001 个元素的布尔数组。我们创建的元素数量比需要的多一个，这样就可以忽略元素 `0`。\n2.  **→9**: 这个 `for` 循环关闭了所有的储物柜。这一步并不是真的必要的，因为布尔值会初始化为\
    \ `false`，但显式地初始化是一个良好的习惯。\n3.  **→11**: 该循环的每次迭代都代表穿过走廊并打开或关闭储物柜的完整过程。`skip`\
    \ 变量代表 Bobo 在每次行程中跳过多少个储物柜。他首先处理每一个柜子，然后是每第二个，然后是每三个。所以这个循环简单地从 1 计数到 1,000。\n\
    4.  **→15**: 该循环的每次迭代代表在穿过走廊途中停在一个储物柜前。`for` 语句中的第三表达式（下一行）将 `skip` 变量加到索引变量，以便\
    \ Bobo 可以在每次穿过走廊时访问每 *n* 个储物柜。\n5.  **→16**: 该语句使用非运算符 (`!`) 来反转每个储物柜的状态。因此，如果柜是打开的（`true`），它会被设置为关闭（`false`），反之亦然。\n\
    6.  **→23**: 另一个 `for` 循环遍历所有的储物柜并统计打开的。它还将每个打开的柜的编号添加到字符串的末尾，以便打印所有打开的储物柜。\n\n\
    此程序产生了超过 1,000 行输出，但只有最后几行是重要的。它们如下：\n\n```\nBobo is bored now so he's going home.\n\
    Bobo left 31 lockers open.\nThe open lockers are: 1 4 9 16 25 36 49 64 81 100\
    \ 121 144 169 196 225 256 289 324 361 400 441 484 529 576 625 676 729 784 841\
    \ 900 961\n```\n\n所以，答案是：31 个储物柜被留在打开状态。\n\n![提示](img/tip.png) 顺便问一下，你注意到留打开的柜子编号都是完全平方数吗？或者\
    \ 31 是平方小于 1,000 的最大数字？\n\n### 使用增强型 for 循环\n\n你通常可以通过使用一种称为*增强型 for 循环*的特殊循环类型来消除在\
    \ `for` 循环中处理索引的繁琐工作。增强型 `for` 循环通常被称为 `for-each` 循环，因为它们会自动检索可迭代对象中的每个元素。使用 `for-each`\
    \ 循环消除了创建和初始化索引、增加索引、测试数组中的最后一个项以及使用索引访问每个数组项的需求。\n\n当与数组配合使用时，增强型 `for` 循环具有以下格式：\n\
    \n```java\nfor (type identifier : array)\n{\n    Statements...\n}\n```\n\n`type`\
    \ 标识数组中元素的类型，`identifier` 为访问每个元素的局部变量提供名称。冒号运算符（通常读作“in”）后面紧跟着的是你想要处理的数组的名称。\n\
    \n这是一个示例：\n\n```java\nString[] days = { \"Sunday\", \"Monday\", \"Tuesday\", \"\
    Wednesday\", \"Thursday\", \"Friday\", \"Saturday\" };\nfor (String day : days)\n\
    {\n    System.out.println(day);\n}\n```\n\n### 在方法中使用数组\n\n你可以将数组作为参数传递给方法。你已经在熟悉的\
    \ `main` 方法中见过此了：\n\n```java\npublic static void main(String[] args)\n```\n\n\
    这是一个创建并返回 `String` 数组的静态方法：\n\n```java\npublic static String[] getOfWeek()\n{\n\
    \    String[] days = { \"Sunday\", \"Monday\", \"Tuesday\", \"Wednesday\", \"\
    Thursday\", \"Friday\", \"Saturday\" };\n    return days;\n}\n```\n\n这是一个打印任何\
    \ `String` 数组内容的、每行一个字符串的静态方法：\n\n```java\npublic static void printStringArray(String[]\
    \ strings)\n{\n    for (String s : strings)\n        System.out.println(s);\n\
    }\n```\n\n最后，这些是调用上述方法的代码行：\n\n`String[] days = getOfWeek();`\n\n### 使用变长参数\n\n\
    *Varargs* 提供了一种方便的方法来创建一个接受变数量参数的方法。当你使用变长参数时，方法签名中的最后一个参数使用省略号表示调用者可以提供一个或多个该类型的参数。\n\
    \n这是一个示例：\n\n```java\npublic static void PrintSomeWords(String... words)\n{\n\
    \    for (String word : words)\n        System.out.println(word);\n}\n```\n\n\
    在这里，`PrintSomeWords` 方法指定调用者可以传递任意数量的 String 参数（包括零），这些参数将被收集到一个名为 `words` 的数组中。\n\
    \n这里有一段使用不同数量参数调用 `PrintSomeWords` 方法的代码以证明这一点：\n\n`PrintSomeWords();` `PrintSomeWords(\"\
    I\");` `PrintSomeWords(\"Am\", \"Not\");` `PrintSomeWords(\"Throwing\", \"Away\"\
    , \"My\", \"Shot\");`\n\n生成的控制台输出如下：\n\n```\nI\nAm\nNot\nThrowing\nAway\nMy\n\
    Shot\n```\n\n关于使用变长参数的一个重要注意事项是，变长参数必须始终是参数列表中的最后一个参数。考虑到这一点是合理的，否则如果最后一个参数以外的任何参数具有变数量，编译器将无法跟踪参数。因此，以下代码无法编译：\n\
    \n```java\npublic static void PrintSomeWords(String head, String... words, string\
    \ tail)\n{\n}\n```\n\n你会收到一个警告，显示：“变长参数必须是最后一个参数。”\n\n### 使用二维数组\n\n数组的元素可以是你想要的任何类型的对象，包括另一个数组。在后一种情况下，你有一个*二维数组*，有时称为*数组的数组*。\n\
    \n"
- fmt: "\nTwo-dimensional arrays are often used to track data in column-and-row format,\
    \ much the way that a spreadsheet works. Suppose that you’re working on a program\
    \ that tracks five years’ worth of sales (2022 through 2026) for a company, with\
    \ the data broken down for each of four sales territories (North, South, East,\
    \ and West). You could create 20 separate variables, with names such as `sales2022North`,\
    \ `sales2022South`, `sales2022East`, and so on. But that gets a little tedious.\n\
    \nAlternatively, you could create an array with 20 elements, like this:\n\n```java\n\
    double[] sales = new sales[20];\n```\n\nBut then how would you organize the data\
    \ in this array so that you know the year and sales region for each element?\n\
    \nWith a two-dimensional array, you can create an array with an element for each\
    \ year. Each of those elements in turn is another array with an element for each\
    \ region.\n\nThinking of a two-dimensional array as a table or spreadsheet is\
    \ common, like this:\n\n| Year | North | South | East | West |\n| --- | --- |\
    \ --- | --- | --- |\n| 2022 | 23,853 | 22,838 | 36,483 | 31,352 |\n| 2023 | 25,483\
    \ | 22,943 | 38,274 | 33,294 |\n| 2024 | 24,872 | 23,049 | 39,002 | 36,888 |\n\
    | 2025 | 28,492 | 23,784 | 42,374 | 39,573 |\n| 2026 | 31,932 | 23,732 | 42,943\
    \ | 41,734 |\n\n### Creating a two-dimensional array\n\nTo declare a two-dimensional\
    \ array for this sales data, you simply list two sets of empty brackets, like\
    \ this:\n\n```java\ndouble sales[][];\n```\n\nHere `sales` is a two-dimensional\
    \ array of type `double`. To put it another way, `sales` is an array of `double`\
    \ arrays.\n\nTo create the array, you use the `new` keyword and provide lengths\
    \ for each set of brackets, as in this example:\n\n```java\nsales = new double[5][4];\n\
    ```\n\nHere the first dimension specifies that the `sales` array has five elements.\
    \ This array represents the rows in the table. The second dimension specifies\
    \ that each of those elements has an array of type `double` with four elements.\
    \ This array represents the columns in the table.\n\n![Tip](images/tip.png) A\
    \ key point to grasp here is that one instance is of the first array, but a separate\
    \ instance of the second array for each element is in the first array. So this\
    \ statement actually creates five `double` arrays with four elements each. Then\
    \ those five arrays are used as the elements for the first array.\n\nNote that\
    \ as with a one-dimensional array, you can declare and create a two-dimensional\
    \ array in one statement, like this:\n\n```java\ndouble[][] sales = new double[5][4];\n\
    ```\n\nHere the `sales` array is declared and created all in one statement.\n\n\
    ### Accessing two-dimensional array elements\n\nTo access the elements of a two-dimensional\
    \ array, you use two indexes. This statement sets the 2022 sales for the North\
    \ region:\n\n```java\nsales[0][0] = 23853.0;\n```\n\nAs you might imagine, accessing\
    \ the data in a two-dimensional array by hardcoding each index value can get tedious.\
    \ No wonder `for` loops are normally used instead. The following bit of code uses\
    \ a `for` loop to print the contents of the sales array to the console, separated\
    \ by tabs. Each year is printed on a separate line, with the year at the beginning\
    \ of the line. In addition, a line of headings for the sales regions is printed\
    \ before the sales data. Here’s the code:\n\n```java\nNumberFormat cf = NumberFormat.getCurrencyInstance();\n\
    System.out.println(\"\\tNorth\\t\\tSouth\\t\\tEast\\t\\tWest\");\nint year = 2022;\n\
    for (int y = 0; y < 5; y++)\n{\n    System.out.print(year + \"\\t\");\n    for\
    \ (int region = 0; region < 4; region++)\n    {\n        System.out.print(cf.format(sales[y][region]));\n\
    \        System.out.print(\"\\t\");\n    }\n    year++;\n    System.out.println();\n\
    }\n```\n\nAssuming that the `sales` array has already been initialized, this code\
    \ produces the following output on the console:\n\n```\nNorth South East West\n\
    2022 $23,853.00 $22,838.00 $36,483.00 $31,352.00\n2023 $25,483.00 $22,943.00 $38,274.00\
    \ $33,294.00\n2024 $24,872.00 $23,049.00 $39,002.00 $36,888.00\n2025 $28,492.00\
    \ $23,784.00 $42,374.00 $39,573.00\n2026 $31,932.00 $23,732.00 $42,943.00 $41,734.00\n\
    ```\n\n![Warning](images/warning.png) The order in which you nest the `for` loops\
    \ that access each index in a two-dimensional array is crucial! The preceding\
    \ example lists the sales for each year on a separate line, with the sales arranged\
    \ in columns. You can print a listing with the sales for each region on a separate\
    \ line, with the years arranged in columns, by reversing the order in which the\
    \ `for` loops index the arrays:\n\n```java\nfor (int region = 0; region < 4; region++)\n\
    {\n    for (int y = 0; y < 5; y++)\n    {\n        System.out.print(cf.format(sales[y][region]));\n\
    \        System.out.print(\" \");\n    }\n    System.out.println();\n}\n```\n\n\
    Here the outer loop indexes the region and the inner loop indexes the year:\n\n\
    ```\n$23,853.00 $25,483.00 $24,872.00 $28,492.00 $31,932.00\n$22,838.00 $22,943.00\
    \ $23,049.00 $23,784.00 $23,732.00\n$36,483.00 $38,274.00 $39,002.00 $42,374.00\
    \ $42,943.00\n$31,352.00 $33,294.00 $36,888.00 $39,573.00 $41,734.00\n```\n\n\
    ### Initializing a two-dimensional array\n\nThe technique for initializing arrays\
    \ by coding the array element in curly braces works for two-dimensional arrays\
    \ too. You just have to remember that each element of the main array is another\
    \ array. So you have to nest the initializers.\n\nHere’s an example that initializes\
    \ the sales array:\n\n```java\ndouble[][] sales = {\n    {23853.0, 22838.0, 36483.0,\
    \ 31352.0}, // 2022\n    {25483.0, 22943.0, 38274.0, 33294.0}, // 2023\n    {24872.0,\
    \ 23049.0, 39002.0, 36888.0}, // 2024\n    {28492.0, 23784.0, 42374.0, 39573.0},\
    \ // 2025\n    {31932.0, 23732.0, 42943.0, 41734.0}  // 2026\n};\n```\n\nHere\
    \ we added a comment to the end of each line to show the year that the line initializes.\
    \ Notice that the left brace for the entire initializer is at the beginning of\
    \ the second line, and the right brace that closes the entire initializer is at\
    \ the end of the last line. Then the initializer for each year is contained in\
    \ its own set of braces.\n\n### Using jagged arrays\n\nWhen you create an array\
    \ with an expression such as `new int[5][3]`, you’re specifying that each element\
    \ of the main array is actually an array of type `int` with three elements. Java,\
    \ however, lets you create two-dimensional arrays in which the length of each\
    \ element of the main array is different. This is sometimes called a *jagged array*\
    \ because the array doesn’t form a nice rectangle. Instead, its edges are jagged.\n\
    \nSuppose that you need to keep track of four teams, each consisting of two or\
    \ three people. The teams are as follows:\n\n| Team | Members |\n| --- | --- |\n\
    | A | Henry Blake, Johnny Mulcahy |\n| B | Benjamin Pierce, John McIntyre, Jonathan\
    \ Tuttle |\n| C | Margaret Houlihan, Frank Burns |\n| D | Max Klinger, Radar O’Reilly,\
    \ Igor Straminsky |\n\nThe following code creates a jagged array for these teams:\n\
    \n```java\nString[][] teams = {\n    {\"Henry Blake\", \"Johnny Mulcahy\"},\n\
    \    {\"Benjamin Pierce\", \"John McIntyre\", \"Jonathan Tuttle\"},\n    {\"Margaret\
    \ Houlihan\", \"Frank Burns\"},\n    {\"Max Klinger\", \"Radar O'Reilly\", \"\
    Igor Straminsky\"}\n};\n```\n\nHere each nested array initializer indicates the\
    \ number of strings for each subarray. The first subarray has two strings, the\
    \ second has three strings, and so on.\n\nYou can use nested `for` loops to access\
    \ the individual elements in a jagged array. For each element of the main array,\
    \ you can use the `length` property to determine how many entries are in that\
    \ element’s subarray. For example:\n\n```java\nfor (int i = 0; i < teams.length;\
    \ i++)\n{\n    for (int j = 0; j < teams[i].length; j++)\n    {\n        System.out.println(teams[i][j]);\n\
    \    }\n    System.out.println();\n}\n```\n\nNotice that the length of each subarray\
    \ is determined with the expression `teams[i].length`. This `for` loop prints\
    \ one name on each line, with a blank line between teams, like this:\n\n```\n\
    Margaret Houlihan\nFrank Burns\nMax Klinger\nRadar O'Reilly\nIgor Straminsky\n\
    Henry Blake\nJohnny Mulcahy\nBenjamin Pierce\nJohn McIntyre\nJonathan Tuttle\n\
    ```\n"
  raw: 'Two-dimensional arrays are often used to track data in column-and-row format,
    much the way that a spreadsheet works. Suppose that you’re working on a program
    that tracks five years’ worth of sales (2022 through 2026) for a company, with
    the data broken down for each of four sales territories (North, South, East, and
    West). You could create 20 separate variables, with names such as `sales2022North`,
    `sales2022South`, `sales2022East`, and so on. But that gets a little tedious.


    Alternatively, you could create an array with 20 elements, like this:


    `double[] sales = new sales[20];`


    But then how would you organize the data in this array so that you know the year
    and sales region for each element?


    With a two-dimensional array, you can create an array with an element for each
    year. Each of those elements in turn is another array with an element for each
    region.


    Thinking of a two-dimensional array as a table or spreadsheet is common, like
    this:


    | **Year** | **North** | **South** | **East** | **West** |


    | --- | --- | --- | --- | --- |


    | 2022 | 23,853 | 22,838 | 36,483 | 31,352 |


    | 2023 | 25,483 | 22,943 | 38,274 | 33,294 |


    | 2024 | 24,872 | 23,049 | 39,002 | 36,888 |


    | 2025 | 28,492 | 23,784 | 42,374 | 39,573 |


    | 2026 | 31,932 | 23,732 | 42,943 | 41,734 |


    ### Creating a two-dimensional array


    To declare a two-dimensional array for this sales data, you simply list two sets
    of empty brackets, like this:


    `double sales[][];`


    Here `sales` is a two-dimensional array of type `double`. To put it another way,
    `sales` is an array of `double` arrays.


    To create the array, you use the `new` keyword and provide lengths for each set
    of brackets, as in this example:


    `sales = new double[5][4];`


    Here the first dimension specifies that the `sales` array has five elements. This
    array represents the rows in the table. The second dimension specifies that each
    of those elements has an array of type `double` with four elements. This array
    represents the columns in the table.


    ![Tip](images/tip.png) A key point to grasp here is that one instance is of the
    first array, but a separate instance of the second array for each element is in
    the first array. So this statement actually creates five `double` arrays with
    four elements each. Then those five arrays are used as the elements for the first
    array.


    Note that as with a one-dimensional array, you can declare and create a two-dimensional
    array in one statement, like this:


    `double[][] sales = new double[5][4];`


    Here the `sales` array is declared and created all in one statement.


    ### Accessing two-dimensional array elements


    To access the elements of a two-dimensional array, you use two indexes. This statement
    sets the 2022 sales for the North region:


    `sales[0][0] = 23853.0;`


    As you might imagine, accessing the data in a two-dimensional array by hardcoding
    each index value can get tedious. No wonder `for` loops are normally used instead.
    The following bit of code uses a `for` loop to print the contents of the sales
    array to the console, separated by tabs. Each year is printed on a separate line,
    with the year at the beginning of the line. In addition, a line of headings for
    the sales regions is printed before the sales data. Here’s the code:


    `NumberFormat cf = NumberFormat.getCurrencyInstance();`


    `System.out.println("\tNorth\t\tSouth\t\tEast\t\tWest");`


    `int year = 2022;`


    `for (int y = 0; y < 5; y++)`


    `{`


    `System.out.print(year + "\t");`


    `for (int region = 0; region < 4; region++)`


    `{`


    `System.out.print(cf.format(sales[y][region]));`


    `System.out.print("\t");`


    `}`


    `year++;`


    `System.out.println();`


    `}`


    Assuming that the `sales` array has already been initialized, this code produces
    the following output on the console:


    `North South East West`


    `2022 $23,853.00 $22,838.00 $36,483.00 $31,352.00`


    `2023 $25,483.00 $22,943.00 $38,274.00 $33,294.00`


    `2024 $24,872.00 $23,049.00 $39,002.00 $36,888.00`


    `2025 $28,492.00 $23,784.00 $42,374.00 $39,573.00`


    `2026 $31,932.00 $23,732.00 $42,943.00 $41,734.00`


    ![Warning](images/warning.png) The order in which you nest the `for` loops that
    access each index in a two-dimensional array is crucial! The preceding example
    lists the sales for each year on a separate line, with the sales regions arranged
    in columns. You can print a listing with the sales for each region on a separate
    line, with the years arranged in columns, by reversing the order in which the
    `for` loops that index the arrays are nested:


    `for (int region = 0; region < 4; region++)`


    `{`


    `for (int y = 0; y < 5; y++)`


    `{`


    `System.out.print(cf.format(sales[y][region]));`


    `System.out.print(" ");`


    `}`


    `System.out.println();`


    `}`


    Here the outer loop indexes the region and the inner loop indexes the year:


    `$23,853.00 $25,483.00 $24,872.00 $28,492.00 $31,932.00`


    `$22,838.00 $22,943.00 $23,049.00 $23,784.00 $23,732.00`


    `$36,483.00 $38,274.00 $39,002.00 $42,374.00 $42,943.00`


    `$31,352.00 $33,294.00 $36,888.00 $39,573.00 $41,734.00`


    ### Initializing a two-dimensional array


    The technique for initializing arrays by coding the array element values in curly
    braces works for two-dimensional arrays too. You just have to remember that each
    element of the main array is actually another array. So you have to nest the array
    initializers.


    Here’s an example that initializes the sales array:


    `double[][] sales =`


    `{ {23853.0, 22838.0, 36483.0, 31352.0}, // 2022`


    `{25483.0, 22943.0, 38274.0, 33294.0}, // 2023`


    `{24872.0, 23049.0, 39002.0, 36888.0}, // 2024`


    `{28492.0, 23784.0, 42374.0, 39573.0}, // 2025`


    `{31932.0, 23732.0, 42943.0, 41734.0} }; // 2026`


    Here we added a comment to the end of each line to show the year that the line
    initializes. Notice that the left brace for the entire initializer is at the beginning
    of the second line, and the right brace that closes the entire initializer is
    at the end of the last line. Then the initializer for each year is contained in
    its own set of braces.


    ### Using jagged arrays


    When you create an array with an expression such as `new int[5][3]`, you’re specifying
    that each element of the main array is actually an array of type `int` with three
    elements. Java, however, lets you create two-dimensional arrays in which the length
    of each element of the main array is different. This is sometimes called a *jagged
    array* because the array doesn’t form a nice rectangle. Instead, its edges are
    jagged.


    Suppose that you need to keep track of four teams, each consisting of two or three
    people. The teams are as follows:


    | **Team** | **Members** |


    | --- | --- |


    | A | Henry Blake, Johnny Mulcahy |


    | B | Benjamin Pierce, John McIntyre, Jonathan Tuttle |


    | C | Margaret Houlihan, Frank Burns |


    | D | Max Klinger, Radar O’Reilly, Igor Straminsky |


    The following code creates a jagged array for these teams:


    `String[][] teams`


    `= { {"Henry Blake", "Johnny Mulcahy"},`


    `{"Benjamin Pierce", "John McIntyre", "Jonathan Tuttle"},`


    `{"Margaret Houlihan", "Frank Burns"},`


    `{"Max Klinger", "Radar O''Reilly", "Igor Straminsky"} };`


    Here each nested array initializer indicates the number of strings for each subarray.
    The first subarray has two strings, the second has three strings, and so on.


    You can use nested `for` loops to access the individual elements in a jagged array.
    For each element of the main array, you can use the `length` property to determine
    how many entries are in that element’s subarray. For example:


    `for (int i = 0; i < teams.length; i++)`


    `{`


    `for (int j = 0; j < teams[i].length; j++)`


    `System.out.println(teams[i][j]);`


    `System.out.println();`


    `}`


    Notice that the length of each subarray is determined with the expression `teams[i].length`.
    This `for` loop prints one name on each line, with a blank line between teams,
    like this:


    `Margaret Houlihan`


    `Frank Burns`


    `Max Klinger`


    `Radar O''Reilly`


    `Igor Straminsky`


    `Henry Blake`


    `Johnny Mulcahy`


    `Benjamin Pierce`


    `John McIntyre`


    `Jonathan Tuttle`'
