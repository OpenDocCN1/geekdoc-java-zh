    \ an `IOException`, and perhaps some other type of unanticipated exception. Here\
    \ the three `catch` blocks provide for each of these possibilities.\n\nIf some\
    \ of the exceptions to be caught require the same processing, you can combine\
    \ them in a single `catch` clause. Just separate the exception types with a vertical\
    \ bar, like this:\n\n```java\ntry\n{\n    // statements that might throw several\
    \ types of exceptions\n}\ncatch (InputMismatchException | IOException e)\n{\n\
    \    // statements that process InputMismatchException or IOException\n}\ncatch\
    \ (Exception e)\n{\n    // statements that process all other exception types\n\
    }\n```\n\n![Tip](images/tip.png) If you code multiple `catch` blocks for a single\
    \ `try` statement, Java catches the exceptions in the order in which you list\
    \ them. Therefore, if you use more than one `catch` block on a `try` statement,\
    \ always list the more specific exceptions first. If you include a `catch` block\
    \ to catch `Exception`, list it last.\n\n## Using a finally Block\n\nA `finally`\
    \ block is a block that appears after any of the `catch` blocks for a statement.\
    \ It’s executed whether or not any exceptions are thrown by the `try` block or\
    \ caught by any `catch` blocks, and it’s executed if your code uses a `return`\
    \ statement to exit early. Its purpose is to let you clean up any mess that might\
    \ be left behind by the exception, such as open files or database connections.\n\
    \nThe basic framework for a `try` statement with a `finally` block is this:\n\n\
    ```java\ntry\n{\n    // statements that can throw exceptions\n}\ncatch (exception-type\
    \ identifier)\n{\n    // statements executed when exception is thrown\n}\nfinally\n\
    {\n    // statements that are executed whether or not exceptions occur\n}\n```\n\
    \n[Listing 9-3](#c09.xhtml_c09-fea-0003) shows a contrived but helpful example\
    \ that demonstrates how to use the `finally` clause. In this example, a method\
    \ called `divideTheseNumbers` tries to divide the numbers twice. If the division\
    \ fails the first time (due to a divide-by-zero exception), it tries the division\
    \ again. Completely irrational, we know. But persistent, like a teenager.\n\n\
    [LISTING 9-3](#c09.xhtml_rc09-fea-0003) A Program That Uses a finally Clause\n\
    \n```java\npublic class CrazyWithZeros\n{\n    public static void main(String[]\
    \ args)\n    {\n        try\n        {\n            int answer = divideTheseNumbers(5,\
    \ 0); //→7\n        }\n        catch (Exception e) //→9\n        {\n         \
    \   System.out.println(\"Tried twice, \" + \"still didn't work!\");\n        }\n\
    \    }\n    public static int divideTheseNumbers(int a, int b) //→16\n    {\n\
    \        int c;\n        try\n        {\n            c = a / b; //→21\n      \
    \      System.out.println(\"It worked!\"); //→22\n        }\n        catch (Exception\
    \ e)\n        {\n            System.out.println(\"Didn't work the first time.\"\
    ); //→26\n            c = a / b; //→27\n            System.out.println(\"It worked\
    \ the second time!\"); //→28\n        }\n        finally\n        {\n        \
    \    System.out.println(\"Better clean up my mess.\"); //→32\n        }\n    \
    \    System.out.println(\"It worked after all.\"); //→34\n        return c; //→35\n\
    \    }\n}\n```\n\nHere’s the console output for the program:\n\n```\nDidn't work\
    \ the first time.\nBetter clean up my mess.\nTried twice, still didn't work!\n\
    ```\n\nThe following paragraphs explain what’s going on, step by step:\n\n1. →7:\
    \ The `main` method calls the `divideTheseNumbers` method, passing `5` and `0`\
    \ as the parameters. You already know that this method isn’t going to work.\n\
    2. →9: The `catch` clause catches any exceptions thrown by line 7.\n3. →16: The\
    \ `divideTheseNumbers` method divides the two numbers passed as parameters.\n\
    4. →21: This line is the first attempt to divide the numbers.\n5. →22: If the\
    \ first attempt succeeds, this line is executed, and the message `\"It worked!\"\
    ` is printed. Alas, the division throws an exception, so this line never gets\
