  trans: "\nJava 评估布尔表达式时，首先评估左侧的表达式，然后评估右侧的表达式，最后应用关系运算符来确定整个表达式求值是 `true` 还是 `false`。\n\
    \n这里是一些关系表达式的简单示例。对于每个示例，假设使用了以下语句来声明并初始化变量：\n\n```java\nint i = 5;\nint j = 10;\n\
    int k = 15;\ndouble x = 5.0;\ndouble y = 7.5;\ndouble z = 12.3;\n```\n\n以下是示例表达式及其结果（基于所提供的值）：\n\
    \n| 表达式 | 取值 | 解释 |\n| --- | --- | --- |\n| `i == 5` | `true` | `i` 的值为 `5`。 |\n\
    | `i == 10` | `false` | `i` 的值不是 `10`。 |\n| `i == j` | `false` | `i` 是 `5`，`j`\
    \ 是 `10`，所以它们不等。 |\n| `i == j - 5` | `true` | `i` 是 `5`，`j – 5` 是 `5`。 |\n| `i\
    \ > 1` | `true` | `i` 是 `5`，大于 `1`。 |\n| `j == i * 2` | `true` | `j` 是 `10`，`i`\
    \ 是 `5`，所以 `i * 2` 也是 `10`。 |\n| `x == i` | `true` | 强制转换允许比较，且 `5.0` 等于 `5`。\
    \ |\n| `k < z` | `false` | 强制转换允许比较，且 `15` 大于 `12.3`。 |\n| `i * 2 < y` | `false`\
    \ | `i * 2` 是 `10`，小于 `7.5`。 |\n\n![Warning](img/warning.png) 注意，测试相等性的关系运算符是连续两个等号\
    \ (`==`）。单个等号是赋值运算符。当你开始学习 Java 时，可能会发现自己在自己在想输入相等运算符时输入了赋值运算符，例如：\n\n```java\n\
    if (i = 5)\n```\n\n哎。但 Java 不会让你这么做的，所以你必须纠正错误并重新编译程序。起初，这样做似乎很麻烦。随着你接触 Java 越多，你就会越能体会到比较和赋值是两个不同的东西，最好不要让单个运算符\
    \ (`=`) 同时重载这两种功能。\n\n## 使用 if 语句\n\n`if` 语句是任何编程语言中最重要的语句之一，Java 也不例外。以下章节描述了使用\
    \ Java 强大的 `if` 语句的各种形式的细节。\n\n### 简单 if 语句\n\n在最基本的形式中，`if` 语句允许仅在布尔表达式求值为 `true`\
    \ 时才执行单个语句或一个语句块。`if` 语句的基本形式如下：\n\n```java\nif (boolean-expression)\n    statement\n\
    ```\n\n注意，布尔表达式必须包含在括号内。此外，如果你只使用单个语句，它必须以分号结束。但语句也可以是用大括号括起来的语句块。在这种情况下，块内的每个语句都需要分号，但块本身不需要。\n\
    \n这里是一个典型的 `if` 语句示例：\n\n```java\ndouble commissionRate = 0.0;\nif (salesTotal\
    \ > 10000.0)\n    commissionRate = 0.05;\n```\n\n在这个示例中，名为 `commissionRate` 的变量初始化为\
    \ `0.0`，如果 `salesTotal` 大于 `10000.0`，则将其设置为 `0.05`。\n\n![Tip](img/tip.png) 在 `if`\
    \ 语句下的语句进行缩进是习惯，因为这会让你的代码结构更加明显。这并不是必须的，但始终是一个好主意。\n\n这里是一个使用块而不是单个语句的示例：\n\n\
    ```java\ndouble commissionRate = 0.0;\nif (salesTotal > 10000.0)\n{\n    commissionRate\
    \ = 0.05;\n    commission = salesTotal * commissionRate;\n}\n```\n\n在这个示例中，如果\
    \ `salesTotal` 大于 $10,000，则执行大括号内的两个语句。否则，两个语句都不执行。\n\n### if-else 语句\n\n`if-else`\
    \ 语句为基础 `if` 语句增加了一个额外的元素：如果布尔表达式不是 `true`，则执行的语句或块。其基本格式为\n\n```java\nif (boolean-expression)\n\
    \    statement\nelse\n    statement\n```\n\n这里是一个示例：\n\n```java\ndouble commissionRate;\n\
    if (salesTotal > 10000.0)\n    commissionRate = 0.05;\nelse\n    commissionRate\
    \ = 0.02;\n```\n\n在这个示例中，如果销售总额大于 $10,000，则佣金率设置为 5%。如果销售总额小于或等于 $10,000，则佣金率设置为\
    \ 2%。\n\n`if-else` 语句为基础 `if` 语句增加了一个额外的元素：如果布尔表达式不是 `true`，则执行的语句或块。其基本格式为\n\n\
    ```java\nif (boolean-expression)\n    statement\nelse\n    statement\n```\n\n\
    这里有一个示例：\n\n```java\ndouble commissionRate;\nif (salesTotal > 10000.0)\n    commissionRate\
    \ = 0.05;\nelse\n    commissionRate = 0.02;\n```\n\n在这个示例中，如果销售总额大于 $10,000，则佣金率设置为\
    \ 5%。如果销售总额小于或等于 $10,000，则佣金率设置为 2%。\n\n`if-else` 语句为基础 `if` 语句增加了一个额外的元素：如果布尔表达式不是\
    \ `true`，则执行的语句或块。其基本格式为\n\n```java\nif (boolean-expression)\n    statement\n\
    else\n    statement\n```\n\n这里有一个示例：\n\n```java\ndouble commissionRate;\nif (salesTotal\
    \ > 10000.0)\n    commissionRate = 0.05;\nelse\n    commissionRate = 0.02;\n```\n\
    \n在这个示例中，如果销售总额大于 $10,000，则佣金率设置为 5%。如果销售总额小于或等于 $10,000，则佣金率设置为 2%。\n\n`if-else`\
    \ 语句为基础 `if` 语句增加了一个额外的元素：如果布尔表达式不是 `true`，则执行的语句或块。其基本格式为\n\n```java\nif (boolean-expression)\n\
    \    statement\nelse\n    statement\n```\n\n这里有一个示例：\n\n```java\ndouble commissionRate;\n\
    if (salesTotal > 10000.0)\n    commissionRate = 0.05;\nelse\n    commissionRate\
    \ = 0.02;\n```\n\n在这个示例中，如果销售总额大于 $10,000，则佣金率设置为 5%。如果销售总额小于或等于 $10,000，则佣金率设置为\
    \ 2%。\n\n`if-else` 语句为基础 `if` 语句增加了一个额外的元素：如果布尔表达式不是 `true`，则执行的语句或块。其基本格式为\n\n\
    ```java\nif (boolean-expression)\n    statement\nelse\n    statement\n```\n\n\
    这里有一个示例：\n\n```java\ndouble commissionRate;\nif (salesTotal > 10000.0)\n    commissionRate\
    \ = 0.05;\nelse\n    commissionRate = 0.02;\n```\n\n在这个示例中，如果销售总额大于 $10,000，则佣金率设置为\
    \ 5%。如果销售总额小于或等于 $10,000，则佣金率设置为 2%。\n\n`if-else` 语句为基础 `if` 语句增加了一个额外的元素：如果布尔表达式不是\
    \ `true`，则执行的语句或块。其基本格式为\n\n```java\nif (boolean-expression)\n    statement\n\
    else\n    statement\n```\n\n这里有一个示例：\n\n```java\ndouble commissionRate;\nif (salesTotal\
    \ > 10000.0)\n    commissionRate = 0.05;\nelse\n    commissionRate = 0.02;\n```\n\
    \n在这个示例中，如果销售总额大于 $10,000，则佣金率设置为 5%。如果销售总额小于或等于 $10,000，则佣金率设置为 2%。\n\n`if-else`\
    \ 语句为基础 `if` 语句增加了一个额外的元素：如果布尔表达式不是 `true`，则执行的语句或块。其基本格式为\n\n```java\nif (boolean-expression)\n\
    \    statement\nelse\n    statement\n```\n\n这里有一个示例：\n\n```java\ndouble commissionRate;\n\
    if (salesTotal > 10000.0)\n    commissionRate = 0.05;\nelse\n    commissionRate\
    \ = 0.02;\n```\n\n在这个示例中，如果销售总额大于 $10,000，则佣金率设置为 5%。如果销售总额小于或等于 $10,000，则佣金率设置为\
    \ 2%。\n\n| 销售额 | 佣金率 |\n| --- | --- |\n| $10,000 及以上 | 5% |\n| $5,000 到 $9,999\
    \ | 3.5% |\n| $1,000 到 $4,999 | 2% |\n| $1,000 以下 | 0% |\n\n假设你想根据下表为总额设置佣金率：\n\
    \n```java\ndouble commissionRate;\nif (salesTotal >= 10000.0)\n    commissionRate\
    \ = 0.05;\nelse if (salesTotal >= 5000.0)\n    commissionRate = 0.035;\nelse if\
    \ (salesTotal >= 1000.0)\n    commissionRate = 0.02;\nelse\n    commissionRate\
    \ = 0.0;\n```\n\n![Warning](img/warning.png) 你必须思考如何设置这些 `else-if` 语句。乍看，例如，这种序列可能是行的：\n\
    \n```java\nif (salesTotal > 0.0)\n    commissionRate = 0.0;\nelse if (salesTotal\
    \ >= 1000.0)\n    commissionRate = 0.02;\nelse if (salesTotal >= 5000.0)\n   \
    \ commissionRate = 0.035;\nelse if (salesTotal >= 10000.0)\n    commissionRate\
    \ = 0.05;\n```\n\n尝试不错，但这种行不通。这些 `if` 语句会将佣金率设置为 0%，因为第一个 `if` 语句中的布尔表达式始终为 `true`（假设\
    \ `salesTotal` 不为零或负）。结果是，其他的 `if` 语句都不会被评估。\n\n## 使用波克最喜欢的运算符（当然是逻辑运算符）\n\n*逻辑运算符（有时称为布尔运算符)*是一个根据一个或两个表达式的布尔结果返回布尔结果的运算符。使用逻辑运算符的表达式有时称为*复合表达式*，因为逻辑运算符的作用允许你将两个或多个条件测试合并到一个表达式中。表\
    \ 6-2 列出了逻辑运算符。\n\n以下章节将详细描述这些大多数运算符。\n\n### 使用 ! 运算符\n\n逻辑运算符中最简单的是 *非* (`!`)。技术上，它是一个*单目*前缀运算符，这意味着你对一个操作数使用它，并且将其紧放在该操作数前面。（技术上，这个运算符被称为*补码运算符*，而不是*非运算符*。但在现实生活中，大多数人称之为\
    \ *Not*。许多程序员也称之为 *bang*。）\n\n| 运算符 | 名称 | 类型 | 描述 |\n| --- | --- | --- | ---\
    \ |\n| `!` | Not | 单元 | 如果右侧的操作数求值为 `false`，则返回 `true`。如果右侧操作数为 `true`，则返回 `false`。\
    \ |\n| `&` | And | 二元 | 如果两个操作数都求值为 `true`，则返回 `true`。在应用与 运算符之前，两个操作数都会求值。 |\n\
    ```"
- fmt: "\n| `|` | Or | Binary | Returns `true` if at least one of the operands evaluates\
    \ to `true`. Both operands are evaluated before the Or operator is applied. |\n\
    | `^` | Xor | Binary | Returns `true` if one — and only one — of the operands\
    \ evaluates to `true`. Returns `false` if both operands evaluate to `true` or\
    \ if both operands evaluate to `false`. |\n| `&&` | Conditional And | Binary |\
    \ Same as `&`, but if the operand on the left returns `false`, returns `false`\
    \ without evaluating the operand on the right. |\n| `||` | Conditional Or | Binary\
    \ | Same as `|`, but if the operand on the left returns `true`, returns `true`\
    \ without evaluating the operand on the right. |\n\n## [TABLE 6-2](#c06.xhtml_rc06-tbl-0002)\
    \ Logical Operators\n\nThe Not operator reverses the value of a Boolean expression.\
    \ Thus, if the expression is `true`, `Not` changes it to `false`. If the expression\
    \ is `false`, `Not` changes it to `true`.\n\nHere’s an example:\n\n```\n!(i ==\
    \ 4)\n```\n\nThis expression evaluates to `true` if `i` is any value other than\
    \ `4`. If `i` is `4`, it evaluates to `false`. It works by first evaluating the\
    \ expression `(i == 4)`. Then it reverses the result of that evaluation.\n\n![Tip](images/tip.png)\
    \ Don’t confuse the Not logical operator (`!`) with the Not Equals relational\
    \ operator (`!=`). Although these operators are sometimes used in similar ways,\
    \ the `Not` operator is more general. We could have written the preceding example\
    \ like this:\n\n```\ni != 4\n```\n\nThe result is the same. The `Not` operator\
    \ can be applied to any expression that returns a `true-false` result, however,\
    \ not just to an equality test.\n\n![Remember](images/remember.png) You must almost\
    \ always enclose the expression that the `!` operator is applied to in parentheses.\
    \ Consider this expression:\n\n```\n! i == 4\n```\n\nAssuming that `i` is an integer\
    \ variable, the compiler doesn’t allow this expression because it looks like you’re\
    \ trying to apply the `!` operator to the variable, not to the result of the comparison.\
    \ A quick set of parentheses solves the problem:\n\n```\n!(i == 4)\n```\n\n###\
    \ Using the & and && operators\n\nThe `&` and `&&` operators combine two Boolean\
    \ expressions and return `true` only if both expressions are `true`. This type\
    \ of operation is called an `And operation`, because the first expression and\
    \ the second expression must be `true` for the `And` operator to return `true`.\n\
    \nSuppose that the sales commission rate should be 2.5% if the sales class is\
    \ 1 and the sales total is $10,000 or more. You could perform this test with two\
    \ separate `if` statements (as we did earlier in this chapter), or you could combine\
    \ the tests into one `if` statement:\n\n```\nif ((salesClass == 1) & (salesTotal\
    \ >= 10000.0))\ncommissionRate = 0.025;\n```\n\nHere the expressions `(salesClass\
    \ == 1)` and `(salesTotal >= 10000.0)` are evaluated separately. Then the `&`\
    \ operator compares the results. If they’re both `true`, the `&` operator returns\
    \ `true`. If one is `false` or both are `false`, the `&` operator returns `false`.\n\
    \n![Tip](images/tip.png) Notice that we use parentheses liberally to clarify where\
    \ one expression ends and another begins. Using parentheses isn’t always necessary,\
    \ but when you use logical operators, we suggest that you always use parentheses\
    \ to clearly identify the expressions being compared.\n\nThe `&&` operator is\
    \ similar to the `&` operator, but it leverages your knowledge of logic a bit\
    \ more. Because both expressions compared by the `&` operator must be `true` for\
    \ the entire expression to be `true`, there’s no reason to evaluate the second\
    \ expression if the first one returns `false`. The `&` operator isn’t aware of\
    \ this fact, so it blindly evaluates both expressions before determining the results.\
    \ The `&&` operator is smart enough to stop when it knows what the outcome is.\n\
    \nAs a result, almost always use `&&` instead of `&`. Here’s the preceding example,\
    \ and this time it’s coded smartly with `&&`:\n\n```\nif ((salesClass == 1) &&\
    \ (salesTotal >= 10000.0))\ncommissionRate = 0.025;\n```\n\n![Tip](images/tip.png)\
    \ Why do we say you should almost always use `&&`? Because sometimes the expressions\
    \ themselves have side effects that are important. The second expression might\
    \ involve a method call that updates a database, for example, and you want the\
    \ database to be updated whether the first expression evaluates to `true` or to\
    \ `false`. In that case, you want to use `&` instead of `&&` to ensure that both\
    \ expressions get evaluated.\n\n![Warning](images/warning.png) Relying on the\
    \ side effects of expressions can be risky — and you can almost always find a\
    \ better way to write your code to avert the side effects. In other words, placing\
    \ an important call to a database-update method inside a compound expression that’s\
    \ buried in an `if` statement probably isn’t a good idea.\n\n### Using the | and\
    \ || operators\n\nThe `|` and `||` operators are called `Or operators` because\
    \ they return `true` if the first expression is `true` or if the second expression\
    \ is `true`. They also return `true` if both expressions are `true`.\n\nSuppose\
    \ that the sales commission rate should be 2.5% if the sales class is 1 and the\
    \ sales total is $10,000 or more. You could do that with two separate `if` statements:\n\
    \n```\nif (salesClass == 1)\ncommissionRate = 0.025;\nif (salesClass == 3)\ncommissionRate\
    \ = 0.025;\n```\n\nWith an `Or` operator, however, you can do the same:\n\n```\n\
    if (salesTotal < 10000.0) | (salesClass == 3)\ncommissionRate = 0.025;\n```\n\n\
    ![Tip](images/tip.png) In most cases, you should use the Conditional Or operator\
    \ (`||`) instead of the regular Or operator (`|`), like this:\n\n```\nif (salesTotal\
    \ < 10000.0) || (salesClass == 3)\ncommissionRate = 0.025;\n```\n\nLike the Conditional\
    \ And operator (`&&`), the Conditional Or operator stops as soon as it knows what\
    \ the outcome is. Suppose that the sales total is $500. Then there’s no need to\
    \ evaluate the second expression. Because the first evaluates to `true`, the whole\
    \ expression is `true`.\n\n### Combining logical operators\n\nYou can combine\
    \ simple Boolean expressions to create complicated expressions. For example:\n\
    \n```\nif (salesTotal<1000.0)||((salesTotal<5000.0) && (salesClass==1))||((salesTotal\
    \ <10000.0) && (salesClass == 2))\ncommissionRate = 0.0;\n```\n\nCan you tell\
    \ what the expression in this `if` statement does? It sets the commission to zero\
    \ if any one of the following three conditions is `true`:\n\n*   The sales total\
    \ is less than $1,000.\n*   The sales total is less than $5,000, and the sales\
    \ class is 1.\n*   The sales total is less than $10,000, and the sales class is\
    \ 2.\n\nIn many cases, you can clarify how an expression works by indenting its\
    \ pieces differently and spacing out its subexpressions. This version of the preceding\
    \ `if` statement is a little easier to follow:\n\n```\nif (\n    (salesTotal <\
    \ 1000.0)\n    || ((salesTotal < 5000.0) && (salesClass == 1))\n    || ((salesTotal\
    \ < 10000.0) && (salesClass == 2))\n)\ncommissionRate = 0.0;\n```\n\nFiguring\
    \ out exactly what this `if` statement does, however, is still tough. In many\
    \ cases, the better thing to do is skip the complicated expression and code separate\
    \ `if` statements:\n\n```\nif (salesTotal < 1000.0)\ncommissionRate = 0.0;\n\n\
    if ((salesTotal < 5000.0) && (salesClass == 1))\ncommissionRate = 0.0;\n\nif ((salesTotal\
    \ < 10000.0) && (salesClass == 2))\ncommissionRate = 0.0;\n```\n"
  raw: '| `&#124;` | Or | Binary | Returns `true` if at least one of the operands
    evaluates to `true`. Both operands are evaluated before the Or operator is applied.
    |


    | `^` | Xor | Binary | Returns `true` if one — and only one — of the operands
    evaluates to `true`. Returns `false` if both operands evaluate to `true` or if
    both operands evaluate to `false`. |


    | `&&` | Conditional And | Binary | Same as `&`, but if the operand on the left
    returns `false`, returns `false` without evaluating the operand on the right.
    |


    | `&#124;&#124;` | Conditional Or | Binary | Same as `&#124;`, but if the operand
    on the left returns `true`, returns `true` without evaluating the operand on the
    right. |


    [TABLE 6-2](#c06.xhtml_rc06-tbl-0002) Logical Operators


    The Not operator reverses the value of a Boolean expression. Thus, if the expression
    is `true`, Not changes it to `false`. If the expression is `false`, Not changes
    it to `true`.


    Here’s an example:


    `!(i == 4)`


    This expression evaluates to `true` if `i` is any value other than `4`. If `i`
    is `4`, it evaluates to `false`. It works by first evaluating the expression `(i
    == 4)`. Then it reverses the result of that evaluation.


    ![Tip](images/tip.png) Don’t confuse the Not logical operator (`!`) with the Not
    Equals relational operator (`!=`). Although these operators are sometimes used
    in similar ways, the Not operator is more general. We could have written the preceding
    example like this:


    `i != 4`


    The result is the same. The Not operator can be applied to any expression that
    returns a `true-false` result, however, not just to an equality test.


    ![Remember](images/remember.png) You must almost always enclose the expression
    that the `!` operator is applied to in parentheses. Consider this expression:


    `! i == 4`


    Assuming that `i` is an integer variable, the compiler doesn’t allow this expression
    because it looks like you’re trying to apply the `!` operator to the variable,
    not to the result of the comparison. A quick set of parentheses solves the problem:


    `!(i == 4)`


    ### Using the & and && operators


    The `&` and `&&` operators combine two Boolean expressions and return `true` only
    if both expressions are `true`. This type of operation is called an *And operation,*
    because the first expression and the second expression must be `true` for the
    And operator to return `true`.


    Suppose that the sales commission rate should be 2.5% if the sales class is 1
    and the sales total is $10,000 or more. You could perform this test with two separate
    `if` statements (as we did earlier in this chapter), or you could combine the
    tests into one `if` statement:


    `if ((salesClass == 1) & (salesTotal >= 10000.0))`


    `commissionRate = 0.025;`


    Here the expressions `(salesClass == 1)` and `(salesTotal >= 10000.0)` are evaluated
    separately. Then the `&` operator compares the results. If they’re both `true`,
    the `&` operator returns `true`. If one is `false` or both are `false`, the `&`
    operator returns `false`.


    ![Tip](images/tip.png) Notice that we use parentheses liberally to clarify where
    one expression ends and another begins. Using parentheses isn’t always necessary,
    but when you use logical operators, we suggest that you always use parentheses
    to clearly identify the expressions being compared.


    The `&&` operator is similar to the `&` operator, but it leverages your knowledge
    of logic a bit more. Because both expressions compared by the `&` operator must
    be `true` for the entire expression to be `true`, there’s no reason to evaluate
    the second expression if the first one returns `false`. The `&` operator isn’t
    aware of this fact, so it blindly evaluates both expressions before determining
    the results. The `&&` operator is smart enough to stop when it knows what the
    outcome is.


    As a result, almost always use `&&` instead of `&`. Here’s the preceding example,
    and this time it’s coded smartly with `&&`:


    `if ((salesClass == 1) && (salesTotal >= 10000.0))`


    `commissionRate = 0.025;`


    ![Tip](images/tip.png) Why do we say you should *almost* always use `&&`? Because
    sometimes the expressions themselves have side effects that are important. The
    second expression might involve a method call that updates a database, for example,
    and you want the database to be updated whether the first expression evaluates
    to `true` or to `false`. In that case, you want to use `&` instead of `&&` to
    ensure that both expressions get evaluated.


    ![Warning](images/warning.png) Relying on the side effects of expressions can
    be risky — and you can almost always find a better way to write your code to avert
    the side effects. In other words, placing an important call to a database-update
    method inside a compound expression that’s buried in an `if` statement probably
    isn’t a good idea.


    ### Using the | and || operators


    The `|` and `||` operators are called *Or operators* because they return `true`
    if the first expression is `true` or if the second expression is `true`. They
    also return `true` if both expressions are `true`. (You find the `|` symbol on
    your keyboard just above the Enter key.)


    Suppose that sales representatives get no commission if total sales are less than
    $1,000 or if the sales class is 3\. You could do that with two separate `if` statements:


    `if (salesTotal < 1000.0)`


    `commissionRate = 0.0;`


    `if (salesClass == 3)`


    `commissionRate = 0.0;`


    With an Or operator, however, you can do the same thing with a compound condition:


    `if ((salesTotal < 1000.0) | (salesClass == 3))`


    `commissionRate = 0.0;`


    To evaluate the expression for this `if` statement, Java first evaluates the expressions
    on either side of the `|` operator. Then, if at least one of these expressions
    is `true`, the whole expression is `true`. Otherwise the expression is `false`.


    ![Tip](images/tip.png) In most cases, you should use the Conditional Or operator
    (`||`) instead of the regular Or operator (`|`), like this:


    `if ((salesTotal < 1000.0) || (salesClass == 3))`


    `commissionRate = 0.0;`


    Like the Conditional And operator (`&&`), the Conditional Or operator stops evaluating
    as soon as it knows what the outcome is. Suppose that the sales total is $500\.
    Then there’s no need to evaluate the second expression. Because the first expression
    evaluates to `true` and only one of the expressions needs to be `true`, Java can
    skip the second expression. If the sales total is $5,000, of course, the second
    expression must be evaluated.


    As with the And operators, you should use the regular Or operator only if your
    program depends on some side effect of the second expression, such as work done
    by a method call.


    ### Combining logical operators


    You can combine simple Boolean expressions to create more complicated expressions.
    For example:


    `if ( (salesTotal<1000.0)||((salesTotal<5000.0) &&`


    `(salesClass==1))||((salesTotal < 10000.0) &&`


    `(salesClass == 2)))`


    `commissionRate = 0.0;`


    Can you tell what the expression in this `if` statement does? It sets the commission
    to zero if any one of the following three conditions is `true`:


    *   The sales total is less than $1,000.


    *   The sales total is less than $5,000, and the sales class is 1.


    *   The sales total is less than $10,000, and the sales class is 2.


    In many cases, you can clarify how an expression works just by indenting its pieces
    differently and spacing out its subexpressions. This version of the preceding
    `if` statement is a little easier to follow:


    `if (`


    `(salesTotal < 1000.0)`


    `|| ( (salesTotal < 5000.0) && (salesClass == 1) )`


    `|| ( (salesTotal < 10000.0) && (salesClass == 2) )`


    `)`


    `commissionRate = 0.0;`


    Figuring out exactly what this `if` statement does, however, is still tough. In
    many cases, the better thing to do is skip the complicated expression and code
    separate `if` statements:


    `if (salesTotal < 1000.0)`


    `commissionRate = 0.0;`


    `if ((salesTotal < 5000.0) && (salesClass == 1))`


    `commissionRate = 0.0;`


    `if ((salesTotal < 10000.0) && (salesClass == 2))`


    `commissionRate = 0.0;`'
