    ![Remember](images/remember.png) You must follow a few simple rules when you create
    identifiers:


    *   Identifiers are case-sensitive. As a result, `SalesTax` and `salesTax` are
    distinct identifiers.

    *   Identifiers can be made up of upper- or lowercase letters, numerals, underscore
    characters (`_`), and dollar signs (`$`). Thus, identifier names such as `Port1`,
    `SalesTax$`, and `Total_Sales`。

    *   All identifiers must begin with a letter. Thus, `a15` is a valid identifier,
    but `13Unlucky` isn’t (because it begins with a numeral).

    *   An identifier can’t be the same as any of the Java keywords listed in bold
    type in [Table 3-1](#c03.xhtml_c03-tbl-0001). Thus, you can’t create a variable
    named `for` or a class named `public`. (To avoid confusion, we recommend you avoid
    the contextual keywords — the ones that aren’t in bold type in [Table 3-1](#c03.xhtml_c03-tbl-0001)
    — as well.)

    *   The Java language specification recommends that you avoid using dollar signs
    in names you create, because code generators use dollar signs to create identifiers.
    Thus, avoiding dollar signs helps you avoid creating names that conflict with
    generated names.


    ## Crafting Comments


    A `comment` is a bit of text that provides explanations of your code. The compiler
    ignores comments, so you can place any text you want in a comment. Using plenty
    of comments in your program is a good way to explain what your program does and
    how it works.


    Java has two basic types of comments: *end-of-line comments* and *traditional
    comments.* More about that is coming right up.


    ### End-of-line comments


    An `end-of-line comment` begins with the sequence `//` (a pair of consecutive
    slashes) and ends at the end of the line. You can place an end-of-line comment
    at the end of any line. Everything you type after the `//` is ignored by the compiler.
    For example:


    ```

    total = total * discountPercent; // calculate the discounted total

    ```


    If you want, you can also place end-of-line comments on separate lines, like this:


    ```

    // calculate the discounted total

    total = total * discountPercent;

    ```


    You can place end-of-line comments in the middle of statements that span two or
    more lines. For example:


    ```

    total = (total * discountPercent) // apply the discount first

    + salesTax; // then add the sales tax

    ```


    ### Traditional comments


    A `traditional comment` begins with the sequence `/*`, ends with the sequence
    `*/`, and can span multiple lines. Here’s an example:


    ```

    /* HelloApp sample program.

    This program demonstrates the basic structure

    that all Java programs must follow. */

    ```


    A traditional comment can begin and end anywhere on a line. If you want, you can
    even sandwich a comment between other Java programming elements, like this:


    ```

    x = (y + /* a strange place for a comment */ 5) / z;

    ```


    Usually, traditional comments appear on separate lines. One common use for traditional
    comments is to place a block of comment lines at the beginning of a class to indicate
    information about the class — such as what the class does, who wrote it, and so
    on. That type of comment, however, is usually better coded as a JavaDoc comment,
    as described in the next section.


    ## Introducing Object-Oriented Programming


    Having presented some of the most basic elements of the Java programming language,
    most Java books would next turn to the important topics of variables and data
    types. Because Java is an inherently object-oriented programming language, however,
    and because classes are the heart of object-oriented programming, we look next
    at classes to explore the important role they play in creating objects. We get
    to variables and data types first thing in the next chapter.


    ### Understanding classes and objects


    As we’ve already mentioned, a `class` is code that defines the behavior of a Java
    programming element called an object. An `object` is an entity that has both state
    and behavior. The `state` of an object consists of any data that the object might
    be keeping track of, and the `behavior` consists of `actions` that the object
    can perform. The behaviors are represented in the class by one or more methods
    that can be called on to perform actions.


    The difference between a class and an object is similar to the difference between
    a blueprint and a house. A blueprint is a plan for a house. A house is an implementation
    of a blueprint. One set of blueprints can be used to build many houses. Likewise,
    a class is a plan for an object, and an object is — in Java terms — an `instance`
    of a class. You can use a single class to create more than one object.


    When an object is created, Java sets aside an area of computer memory that’s sufficient
    to hold all the data that’s stored by the object. As a result, each instance of
    a class has its own data, independent of the data used by other instances of the
    same class.


    ### Understanding static methods


    You don’t necessarily have to create an instance of a class to use the methods
    of the class. If you declare a method with the `static` keyword, you can call
    the method without first creating an instance of the class, because `static` methods
    are called from classes, not from objects.


    The `main` method of a Java application must be declared with the `static` keyword
    because when you start a Java program by using the `java` command from a command
    prompt, Java doesn’t create an instance of the application class. Instead, it
    simply calls the program’s static `main` method.


    The difference between static and nonstatic methods will become more apparent
    when you look at object-oriented programming in more depth in [Chapters 10](#c10.xhtml)
    and [11](#c11.xhtml). But for now, consider this analogy. The blueprints for a
    house include the details about systems that actually perform work in a finished
    house, such as electrical and plumbing systems. To use those systems, you have
    to actually build a house. In other words, you can’t turn on the hot water by
    using the blueprint alone; you have to have an actual house with an actual device
    to heat the water.


    The blueprints do include detailed measurements of the dimensions of the house,
    however. As a result, you *can* use the blueprints to determine the square footage
    of the living room.


    Now imagine that the blueprints actually have a built-in calculator that displays
    the size of the living room if you push the Living Room button. That button would
    be like a `static` method in a class: You don’t actually have to build a house
    to use the button; you can activate it from the blueprints alone.


    Many Java programs are entirely made up of `static` methods. Most realistic programs,
    however, require that you create one or more objects that the program uses as
    it executes. As a result, knowing how to create simple classes and how to create
    objects from those classes are basic skills in Java programming.


    ### Creating an object from a class


    In Java, you can create an object from a class in several ways. The most straightforward
    way is to create a variable that provides a name you can use to refer to the object,
    use the `new` keyword to create an instance of the class, and then assign the
    resulting object to the variable. The general form of a statement that does that
    bit of magic looks like this:


    ```

    ClassName variableName = new ClassName();

    ```


    To create an object instance of a class named `Class1` and assign it to a variable
    named `myClass1Object`, you would write a statement like this:


    ```

    Class1 myClass1Object = new Class1();

    ```

