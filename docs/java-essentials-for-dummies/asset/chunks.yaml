    ### So what’s the difference?


    You may notice that the only line that actually does any real work in the `HelloApp2`
    program is line 7 in the `Greeter` class ([Listing 3-3](#c03.xhtml_c03-fea-0003)),
    and this line happens to be identical to line 5 in the original `HelloApp` class
