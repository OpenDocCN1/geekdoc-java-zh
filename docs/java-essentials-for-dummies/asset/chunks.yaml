    ![Tip](img/tip.png) 当你首次创建一个文件时（通过点击工具栏上的 `New` 按钮或选择 `File` ⇒ `New`），TextPad
    将该文件视为普通文本文件，而不是 Java 程序文件。当你保存文件（通过点击 `Save` 按钮或选择 `File` ⇒ `Save`）并将 `.java`
    分为文件扩展名后，TextPad 的 Java 编辑功能生效。


    以下段落描述了 TextPad 处理 Java 文件时一些最值得关注的特性：


    *   你从 图 2-2 中无法真正看出，但 TextPad 使用不同的颜色来指示程序中每个单词或符号的功能。括号是红色的，你可以快速发现它们并确保它们正确配对。关键字是蓝色的。注释和字符串字面量是绿色的。其他文本（如变量和方法名）是黑色的。


    *   当你输入左括号时，TextPad 会自动缩进，当你输入右括号时，它会恢复到上一个缩进状态。这一功能让保持代码对齐变得简单。


    *   行号显示在编辑窗口的左边缘。你可以通过选择 `View` ⇒ `Line Numbers` 来开启或关闭行号。


    *   要转到特定行，按 `Ctrl+G` 弹出“转到”对话框。确保在 `Go to What` 框中选择了 `Line`，在文本框中输入行号并点击 `OK`。


    *   如果你打开了多个文件，可以使用 `Document Selector` —— TextPad 窗口左侧的面板在文件之间切换（参见 图 2-2）。如果
    `Document Selector` 不可见，选择 `View` ⇒ `Document Selector` 来调出它。


    *   切换两个（或多个）文件之间的另一种方法是选择 `View` ⇒ `Document Tabs`。标签出现在文档窗口顶部，你可以点击这些标签来切换文档。


    *   实用的 `Match Bracket` 功能可以让你配对括号、大括号和小括号。要使用此功能，将插入点移动到括号、大括号或圆括号，然后按 `Ctrl+M`。TextPad
    会找到匹配的元素。


    *   要搜索文本，按 `F5`。在 `Find` 对话框中输入你要查找的文本，并点击 `OK`。要重复搜索，按 `Ctrl+F`。


    *   要替换文本，按 `F8`。


    ## 编译程序


    在 TextPad 中编译 Java 程序，选择 `Tools` ⇒ `Compile Java` 或使用快捷键 `Ctrl+1`。`javac` 命令用于编译程序，编译器输出显示在
    TextPad 窗口的 `Tool Results` 面板中。如果程序编译成功，`Tool Results` 面板中会出现 `Tool completed
    successfully` 消息。如果编译器发现程序有误，将显示一条或多条错误信息，如图 2-3 所示。


    ![截图显示了一个打开的集成开发环境 (IDE) 窗口，显示了一个 Java 程序。该程序定义了一个名为“HelloApp”的公共类，并包含一个向控制台输出文本“Hello!!!”的主方法。在
    IDE 窗口下方，有一个命令提示符显示运行 Java 程序的结果，即打印的文本“Hello!!!”。](img/9781394296972-fg0203.png)


    FIGURE 2-3: Java 编译器显示的错误信息。


    在此示例中，显示了两个编译器错误信息：


    ```

    C:\Users\doug\Documents\HelloApp.java:5: error: '')'' expected

    ```


    ```

    System.out.println(Hello, World!");

    ```


    ```

    ^

    ```


    ```

    C:\Users\doug\Documents\HelloApp.java:5: error: '')'' expected

    ```


    ```

    System.out.println(Hello, World!");

    ```


