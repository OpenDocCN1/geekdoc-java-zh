    \ `while` 循环。（我们将在本章后面的部分介绍其他类型的循环。）\n\n### while 语句\n\n`while` 语句的基本格式如下：\n\n\
    ```\nwhile (expression)\n    statement\n```\n\n`while` 语句首先求值 `expression`。如果表达式为\
    \ `true`，则执行 `statement`。然后再次求表达式的值，整个过程重复执行。如果表达式为 `false`，则不执行 `statement`，`while`\
    \ 循环结束。\n\n注意，`while` 循环的语句部分可以是单条语句，也可以是包含在一对括号中的语句块。仅有一个语句的循环并不好用，所以你编写的几乎所有的\
    \ `while` 循环都会使用语句块。（嗯，好吧，有时单条语句循环也是有用的。这并不罕见——只是不常见。）\n\n### 计数循环\n\n这是一个简单的程序，它使用\
