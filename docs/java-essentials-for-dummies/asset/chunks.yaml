    creating here can be used to hold objects created from the `Class1` class. The
    second time you list the class name, you’re creating an object from the class.
    The `new` keyword tells Java to create an object, and the class name provides
    the name of the class to use to create the object.


    ![Tip](images/tip.png) You may have noticed that in the variable name `myClass1Object`,
    we capitalized the words `Class1` and `Object` within the name, but did not capitalize
    the first letter of the name. This type of capitalization is called *camel case,*
    because the capitalized parts of the word look like the humps on a camel’s back.
    Camel case is commonly used for variable names in Java.


    The equal sign (`=`) is an *assignment operator.* It simply says to take the object
    created by the `new` keyword and assign it to the variable. Thus, this statement
    actually does *three* things:


    *   It creates a variable named `myClass1Object` that can be used to hold objects
    created from the `Class1` class. At this point, no object has been created — just
    a variable that can be used to store objects.


    *   It creates a new object in memory from the `Class1` class.


    *   It assigns this newly created object to the `myClass1Object` variable. That
    way, you can use the `myClassObject` variable to refer to the object that was
    created.


    ### Viewing a program that uses an object


    To give you an early look at what object-oriented programming really looks like,
    [Listing 3-2](#c03.xhtml_c03-fea-0002) and [Listing 3-3](#c03.xhtml_c03-fea-0003)
    show another version of the `HelloApp` application — this time using two classes,
    one of which is actually made into an object when the program is run. The first
    class, named `HelloApp2`, is shown in [Listing 3-2](#c03.xhtml_c03-fea-0002).
    This class is similar to the `HelloApp` class shown in [Listing 3-1](#c03.xhtml_c03-fea-0001)
    but uses an object created from the second class, named `Greeter`, to actually
    display the `"Hello, World!"` message on the console. The `Greeter` class is shown
    in [Listing 3-3](#c03.xhtml_c03-fea-0003). It defines a method named `sayHello`
    that displays the message.


    ![Remember](images/remember.png) Both the `HelloApp` and the `Greeter` classes
    are public classes. Java requires that each public class be stored in a separate
    file with the same name as the class; the filename ends with the extension `.java`.
    As a result, the `HelloApp2` class is stored in a file named `HelloApp2.java`,
    and the `Greeter` class is stored in a file named `Greeter.java`.


    #### The HelloApp2 class


    The `HelloApp2` class is shown in [Listing 3-2](#c03.xhtml_c03-fea-0002).


    [LISTING 3-2](#c03.xhtml_rc03-fea-0002) The HelloApp2 Class


    `// This application displays a hello message on``→1`


