    \n### [LISTING 12-1](#c12.xhtml_rc12-fea-0001) The Classic Locker Problem Solved\n\
    \n```java\npublic class BoboAndTheLockers\n{\n    public static void main(String[]\
    \ args)\n    {\n        // true = open; false = closed\n        boolean[] lockers\
    \ = new boolean[1001];\n        // close all the lockers\n        for (int i =\
    \ 1; i <= 1000; i++)\n            lockers[i] = false;\n        for (int skip =\
    \ 1; skip <= 1000; skip++)\n        {\n            System.out.println(\"Bobo is\
    \ changing every \" + skip + \" lockers.\");\n            for (int locker = skip;\
    \ locker <= 1000; locker += skip)\n                lockers[locker] = !lockers[locker];\n\
    \        }\n            System.out.println(\"Bobo is bored\" + \" now so he's\
    \ going home.\");\n        // count and list the open lockers\n        String\
    \ list = \"\";\n        int openCount = 0;\n        for (int i = 1; i <= 1000;\
    \ i++)\n            if (lockers[i])\n            {\n                openCount++;\n\
    \                list += i + \" \";\n            }\n            System.out.println(\"\
    Bobo left \" + openCount + \" lockers open.\");\n            System.out.println(\"\
    The open lockers are: \" + list);\n    }\n}\n```\n\nHere are the highlights of\
    \ how this program works:\n\n1.  **→6**: This line sets up an array of Booleans\
    \ with 1,001 elements. We created one more element than we needed so we could\
    \ ignore element `0`.\n2.  **→9**: This `for` loop closes all the lockers. This\
    \ step isn’t really necessary because Booleans initialize to `false`, but being\
    \ explicit about initialization is good.\n3.  **→11**: Every iteration of this\
    \ loop represents one complete trip through the hallways opening and closing lockers.\
    \ The `skip` variable represents how many lockers Bobo skips on each trip. First\
    \ he does every locker, then every second locker, and then every third locker.\
    \ So this loop simply counts from 1 to 1,000.\n4.  **→15**: Every iteration of\
    \ this loop represents one stop at a locker on a trip through the hallways. This\
    \ third expression in the `for` statement (on the next line) adds the `skip` variable\
    \ to the index variable so that Bobo can access every *n*th locker on each trip\
    \ through the hallways.\n5.  **→16**: This statement uses the not operator (`!`)\
    \ to reverse the setting of each locker. Thus, if the locker is open (`true`),\
    \ it’s set to closed (`false`), and vice versa.\n6.  **→23**: Yet another `for`\
    \ loop spins through all the lockers and counts the ones that are open. It also\
    \ adds the locker number for each open locker to the end of a string so that all\
    \ the open lockers can be printed.\n\nThis program produces more than 1,000 lines\
    \ of output, but only the last few lines are important. Here they are:\n\n```\n\
    Bobo is bored now so he's going home.\nBobo left 31 lockers open.\nThe open lockers\
    \ are: 1 4 9 16 25 36 49 64 81 100 121 144 169 196 225 256 289 324 361 400 441\
    \ 484 529 576 625 676 729 784 841 900 961\n```\n\nSo, there’s the answer: 31 lockers\
    \ are left open.\n\n![Tip](images/tip.png) By the way, did you notice that the\
    \ lockers that were left open were the ones whose numbers are perfect squares?\
    \ Or that 31 is the largest number whose square is less than 1,000?\n\n### Using\
    \ the enhanced for loop\n\nYou can often eliminate the tedium of working with\
    \ indexes in `for` loops by using a special type of `for` loop called an *enhanced\
    \ `for` loop*. Enhanced `for` loops are often called `for-each` loops because\
    \ they automatically retrieve each element in a iterable object. Using a `for-each`\
    \ loop eliminates the need to create and initialize an index, increment the index,\
    \ test for the last item in the array, and access each array item using the index.\n\
    \nWhen it’s used with an array, the enhanced `for` loop has this format:\n\n```java\n\
    for (type identifier : array)\n{\n    Statements...\n}\n```\n\nThe `type` identifies\
    \ the type of the elements in the array, and the `identifier` provides a name\
    \ for a local variable that is used to access each element. The colon operator\
    \ (often read as “in”) is then followed by the name of the array you want to process.\n\
    \nHere’s an example:\n\n```java\nString[] days = { \"Sunday\", \"Monday\", \"\
    Tuesday\", \"Wednesday\", \"Thursday\", \"Friday\", \"Saturday\" };\nfor (String\
    \ day : days)\n{\n    System.out.println(day);\n}\n```\n\n### Using Arrays with\
    \ Methods\n\nYou can pass arrays as parameters to methods. You’ve already seen\
    \ this in the familiar `main` method:\n\n```java\npublic static void main(String[]\
    \ args)\n```\n\nAnd here’s a static method that creates and returns a `String`\
    \ array:\n\n```java\npublic static String[] getOfWeek()\n{\n    String[] days\
    \ = { \"Sunday\", \"Monday\", \"Tuesday\", \"Wednesday\", \"Thursday\", \"Friday\"\
    , \"Saturday\" };\n    return days;\n}\n```\n\nHere’s a static method that prints\
    \ the contents of any `String` array, one string per line:\n\n```java\npublic\
    \ static void printStringArray(String[] strings)\n{\n    for (String s : strings)\n\
    \        System.out.println(s);\n}\n```\n\nFinally, here are two lines of code\
    \ that call these methods:\n\n`String[] days = getOfWeek();` `);`\n\n### Using\
    \ Varargs\n\n*Varargs* provides a convenient way to create a method that accepts\
    \ a variable number of arguments. When you use varargs, the last argument in the\
    \ method signature uses ellipses to indicate that the caller can provide one or\
    \ more arguments of the given type.\n\nHere’s an example:\n\n```java\npublic static\
    \ void PrintSomeWords(String... words)\n{\n    for (String word : words)\n   \
    \     System.out.println(word);\n}\n```\n\nHere, the `PrintSomeWords` method specifies\
    \ that the caller can pass any number of String arguments to the method (including\
    \ none at all) and that the arguments will be gathered up in an array named `words`.\n\
    \nHere’s a snippet of code that calls the `PrintSomeWords` methods using various\
    \ numbers of arguments to prove the point:\n\n`PrintSomeWords();` `PrintSomeWords(\"\
    I\");` `PrintSomeWords(\"Am\", \"Not\");` `PrintSomeWords(\"Throwing\", \"Away\"\
    , \"My\", \"Shot\");`\n\nThe resulting console output looks like this:\n\n```\n\
    I\nAm\nNot\nThrowing\nAway\nMy\nShot\n```\n\nAn important caveat about using varargs\
    \ is that the variable argument must always be the last argument in the argument\
    \ list. This makes sense when you consider that, otherwise, the compiler wouldn’t\
    \ be able to keep track of the arguments if any other than the last argument had\
    \ a variable number. So, the following won’t compile:\n\n```java\npublic static\
    \ void PrintSomeWords(String head, String... words, string tail)\n{\n}\n```\n\n\
    You’ll get a warning that says, “Varargs parameter must be the last parameter.”\n\
    \n### Using Two-Dimensional Arrays\n\nThe elements of an array can be any type\
    \ of object you want, including another array. In the latter case, you have a\
    \ *two-dimensional array,* sometimes called an *array of arrays.*\n"
