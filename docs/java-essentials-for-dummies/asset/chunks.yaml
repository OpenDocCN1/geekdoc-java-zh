    这不是那种你拿起并从头读到尾的书，就像读一本廉价小说那样。如果我们看到你在海滩上读这本书，我们会往你脸上踢沙子。海滩是用来读浪漫小说或谋杀悬疑的，而不是编程书。虽然你可以从头读到尾，但这本书属于你可以随手拿起、翻到任意一页并开始阅读的。你不需要记住书中的任何内容。这是一本“按需学习”的书：当你需要知道某事时就拿起它。需要提醒如何声明类吗？拿起书。忘记了
    `for` 循环那奇怪的语法吗？拿起书。在找到你需要的内容后，放下书，继续过你的生活吧。


    # 第 1 章：安装和使用 Java 工具


    **本章内容**


    - 从 Oracle 网站下载 Java

    - 安装 Java

    - 识别你的 Java 版本


    Java 开发环境有两种基本方法。一方面，你可以使用功能复杂的集成开发环境（IDE），例如 NetBeans 或 Eclipse。这些工具将功能完备的源码编辑器（让你能够编辑
    Java 程序文件）与集成开发工具结合在一起，包括可视化开发工具，让你通过将视觉组件拖放到设计表面上来创建应用程序。


    在另一端，你可以仅使用从 Oracle Java 网站免费提供的基础命令行工具（[`java.oracle.com`](https://java.oracle.com/)）。然后，你可以使用任何你喜欢的文本编辑器创建包含
    Java 程序的文本文件（称为*源文件*），并在命令行提示符中输入命令来编译和运行你的程序。


    > 提示：作为折中，你可能想要使用简单的开发环境，例如 TextPad。TextPad 是一款廉价的文本编辑器，为编辑 Java 程序提供了一些很好的功能（如自动缩进）以及编译和运行程序的快捷键。然而，它不会为你生成任何代码，也不会提供任何类型的视觉设计辅助。TextPad
    是我们开发书中所示所有示例使用的工具。有关下载和使用 TextPad 的信息，请参见第 2 章。


    > 提示：如果你有偏好，也可以在 [`https://openjdk.org`](https://openjdk.org/) 调查开源版本的 Java。


    你也可以在 JDoodle（[www.jdoodle.com/online-java-compiler](https://www.jdoodle.com/online-java-compiler/))）或
    Programiz（[www.programiz.com/java-programming/online-compiler](https://www.programiz.com/java-programming/online-compiler/)）等网站上在线编译和运行简单的
    Java 程序。在这些网站上，你可以输入简单的 Java 程序、编译并运行它们。它们是在无需安装任何东西的情况下尝试 Java 编程浅水区的绝方法。


    ## 下载并安装 Java 开发工具包 (JDK)


    在开始编写 Java 程序之前，你必须为你使用的计算机系统下载并安装正确版本的 Java 开发工具包 (JDK)。Oracle Java 网站提供了 Windows、macOS
    和 Unix 版本。以下章节将向你展示如何下载和安装 JDK。


    > 提示：如果你愿意，可以从 [`https://openjdk.org`](https://openjdk.org/) 下载并安装开源版本的 Java。


    ### 下载 JDK


    要进入下载页面，将浏览器指向 [`www.oracle.com/java/technologies`](https://www.oracle.com/java/technologies)。然后按照相应的链接下载适用于你操作系统的最新
    Java SE 版本。（在我们写这此书时，最新版本是 18.0.1.1。然而，Java 19 已经以早期发布的形式可用。等这本书上架时，从 [`www.oracle.com/java/technologies`](https://www.oracle.com/java/technologies/)
    应该可以获得 Java 19 或更高版本。）


    当你到达 Java 下载页面时，你需要选择你的操作系统；Java 适用于 Linux、macOS 和 Windows。在本章中，我们将向你展示如何将 Java
    部署到 Windows 10 或 11 计算机。部署到 Linux 或 macOS 的程序也类似。


    JDK 下载有三个版本：压缩 `.zip` 文件、可执行安装程序（`.exe`）或 Windows 安装包（`.msi`）。它们的大小都相似（2200MB
    以下）。我们发现下载并运行 `.exe` 安装程序更方便。


    ### 安装 JDK


    下载 JDK 文件后，你可以通过运行下载的可执行文件来安装它。步骤根据你操作系统的不同而略有不同，但基本上，你只需要在下载后运行 JDK 安装程序文件即可，如下所示：


    *   在 Windows 系统上，打开保存安装程序的文件夹，并双击安装程序的图标。

    *   在 Linux 或 macOS 系统上，使用控制台命令切换到下载文件的目录，然后运行该程序。


    启动安装程序后，它会提示你提供正确安装 JDK 所需的信息，例如你想要安装哪些功能以及你想要将 JDK 安装在哪个文件夹中。你可以安全地为每个选项选择默认答案。


    ### 浏览 JDK 文件夹


    当 JDK 安装自身时，它会在你的硬盘上创建几个文件夹。这些文件夹的位置取决于你的系统以及你是如何安装 Java 的。在 Windows 中寻找 Java
    主文件夹最可能的地方是 `C:` 驱动器的根目录、`C:\Program Files\Java` 文件夹或 `C:\Program Files (x86)\Java`
    文件夹。在这些位置你可以找到主文件夹，其名称以 `jdk-` 开头并以版本号结尾。


    | 文件夹 | 描述 |

    | --- | --- |

    | `bin` | 编译器和其他 Java 开发工具 |

    | `conf` | 配置文件 |

    | `include` | 此库包含与其它语言集成 Java 所需的文件 |

    | `jmods` | Java 系统的模块 |

    | `legal` | 各 Java 组件的版权和许可信息 |

    | `lib` | 库文件，包括 Java API 类库 |


    ### 设置 JAVA_HOME 和路径变量


    安装 JDK 后，你需要配置操作系统使其能够找到 JDK 命令行工具。为了实现这一点，你需要设置两个环境变量：`JAVA_HOME`（提供主文件夹的位置）和
    `Path`（列出操作系统用于查找可执行程序的文件夹）。遵循以下步骤：


    1.  打开文件资源管理器，右键点击**此电脑**并选择**属性**。这将打开属性属性。

    2.  点击**高级系统设置**。

    3.  点击**环境变量**按钮。环境变量对话框出现。

    4.  在**系统变量**列表中，点击**新建**按钮。新建系统变量对话框出现。

    5.  在**变量名**文本框中输入 `JAVA_HOME`。

    6.  点击**浏览目录**按钮，浏览到 Java 主文件夹并点击**确定**。此操作会将主文件夹路径插入**变量值**文本框中。

    7.  点击**确定**。已创建 `JAVA_HOME` 变量。

    8.  在系统变量列表中滚动找到 `Path`，选择它，然后点击**编辑**。


