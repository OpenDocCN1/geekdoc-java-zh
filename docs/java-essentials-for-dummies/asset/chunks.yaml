    ![Tip](images/tip.png) When you first create a file (by clicking the `New` button
    on the toolbar or by choosing `File`   ⇒   New`), TextPad treats the file as a
    normal text file, not as a Java program file. After you save the file (by clicking
    the `Save` button or choosing `File`   ⇒   Save`) and assign `.java` as the file
    extension, TextPad’s Java-editing features kick in.


    The following paragraphs describe some of TextPad’s most noteworthy features for
    working with Java files:


    *   You can’t really tell from [Figure 2-2](#c02.xhtml_c02-fig-0002), but TextPad
    uses different colors to indicate the function of each word or symbol in the program.
    Brackets are red so that you can spot them quickly and make sure that they’re
    paired correctly. Keywords are blue. Comments and string literals are green. Other
    text, such as variable and method names, is black.


    *   TextPad automatically indents whenever you type an opening bracket and then
    reverts to the previous indent when you type a closing bracket. This feature makes
    keeping your code lined up easy.


    *   Line numbers display down the left edge of the editing window. You can turn
    these line numbers on or off by choosing `View`   ⇒   `Line Numbers`.


    *   To go to a particular line, press `Ctrl+G` to bring up the Go To dialog box.
    Make sure that `Line` is selected in the `Go to What` box, enter the line number
    in the text box, and click `OK`.


    *   If you have more than one file open, you can switch between the files by using
    the `Document Selector` — the pane on the left side of the TextPad window (refer
    to [Figure 2-2](#c02.xhtml_c02-fig-0002)). If the `Document Selector` isn’t visible,
    choose `View`   ⇒   `Document Selector` to summon it.


    *   Another way to switch between two (or more) files is to choose `View`   ⇒   `Document
    Tabs`. Tabs appear at the top of the document window, and you can click these
    tabs to switch documents.


    *   A handy `Match Bracket` feature lets you pair brackets, braces, and parentheses.
    To use this feature, move the insertion point to a bracket, brace, or parenthesis
    and then press `Ctrl+M`. TextPad finds the matching element.


    *   To search for text, press `F5`. In the `Find` dialog box, enter the text you’re
    looking for, and click `OK`. To repeat the search, press `Ctrl+F`.


    *   To replace text, press `F8`.


    ## Compiling a Program


    To compile a Java program in TextPad, choose `Tools`   ⇒   `Compile Java` or use
    the keyboard shortcut `Ctrl+1`. The `javac` command compiles the program, and
    the compiler output is displayed in the `Tool Results` pane of the TextPad window.
    If the program compiles successfully, the message `Tool completed successfully`
    appears in the `Tool Results` pane. If the compiler finds something wrong with
    your program, one or more error messages are displayed, as shown in [Figure 2-3](#c02.xhtml_c02-fig-0003).


    ![The screenshot shows an open Integrated Development Environment (IDE) window
    displaying a Java program. The program defines a public class named “HelloApp”
    and contains a main method that outputs the text “Hello!!!” to the console. Below
    the IDE window, there’s a command prompt displaying the result of running the
    Java program, which is the printed text “Hello!!!”.](images/9781394296972-fg0203.png)


    [FIGURE 2-3:](#c02.xhtml_rc02-fig-0003) Error messages displayed by the Java compiler.


    In this example, two compiler error messages are displayed:


    ```

    C:\Users\doug\Documents\HelloApp.java:5: error: '')'' expected

    ```


    ```

    System.out.println(Hello, World!");

    ```


    ```

    ^

    ```


    ```

    C:\Users\doug\Documents\HelloApp.java:5: error: '')'' expected

    ```


    ```

    System.out.println(Hello, World!");

    ```


