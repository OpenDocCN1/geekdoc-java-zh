    \ green. Other text, such as variable and method names, is black.\n\n*   TextPad\
    \ automatically indents whenever you type an opening bracket and then reverts\
    \ to the previous indent when you type a closing bracket. This feature makes keeping\
    \ your code lined up easy.\n\n*   Line numbers display down the left edge of the\
    \ editing window. You can turn these line numbers on or off by choosing View   ⇒   Line\
    \ Numbers.\n\n*   To go to a particular line, press Ctrl+G to bring up the Go\
    \ To dialog box. Make sure that Line is selected in the Go to What box, enter\
    \ the line number in the text box, and click OK.\n\n*   If you have more than\
    \ one file open, you can switch between the files by using the Document Selector\
    \ — the pane on the left side of the TextPad window (refer to [Figure 2-2](#c02.xhtml_c02-fig-0002)).\
    \ If the Document Selector isn’t visible, choose View   ⇒   Document Selector\
    \ to summon it.\n\n*   Another way to switch between two (or more) files is to\
    \ choose View   ⇒   Document Tabs. Tabs appear at the top of the document window,\
    \ and you can click these tabs to switch documents.\n\n*   A handy Match Bracket\
    \ feature lets you pair brackets, braces, and parentheses. To use this feature,\
    \ move the insertion point to a bracket, brace, or parenthesis and then press\
    \ Ctrl+M. TextPad finds the matching element.\n\n*   To search for text, press\
    \ F5\\. In the Find dialog box, enter the text you’re looking for, and click OK.\
    \ To repeat the search, press Ctrl+F.\n\n*   To replace text, press F8.\n\n##\
    \ Compiling a Program\n\nTo compile a Java program in TextPad, choose Tools   ⇒   Compile\
    \ Java or use the keyboard shortcut Ctrl+1\\. The `javac` command compiles the\
    \ program, and the compiler output is displayed in the Tool Results pane of the\
    \ TextPad window. If the program compiles successfully, the message `Tool completed\
    \ successfully` appears in the Tool Results pane. If the compiler finds something\
    \ wrong with your program, one or more error messages are displayed, as shown\
    \ in [Figure 2-3](#c02.xhtml_c02-fig-0003).\n\n![The screenshot shows an open\
    \ Integrated Development Environment (IDE) window displaying a Java program. The\
    \ program defines a public class named “HelloApp” and contains a main method that\
    \ outputs the text “Hello!!!” to the console. Below the IDE window, there’s a\
    \ command prompt displaying the result of running the Java program, which is the\
    \ printed text “Hello!!!”.](images/9781394296972-fg0203.png)\n\n[FIGURE 2-3:](#c02.xhtml_rc02-fig-0003)\
    \ Error messages displayed by the Java compiler.\n\nIn this example, two compiler\
    \ error messages are displayed:\n\n`C:\\Users\\doug\\Documents\\HelloApp.java:5:\
    \ error: ')' expected`\n\n`System.out.println(Hello, World!\");`\n\n`^`\n\n`C:\\\
    Users\\doug\\Documents\\HelloApp.java:5: error: unclosed string literal`\n\n`System.out.println(Hello,\
    \ World!\");`\n\n`^`\n\n`2 errors`\n\n`Tool completed with exit code 1`\n\n![Tip](images/tip.png)\
    \ If you double-click the first line of each error message, TextPad takes you\
    \ to the spot where the error occurred. If you double-click the line with the\
    \ `unclosed string literal` message, for example, you’re taken to line 5, and\
    \ the insertion point is positioned at the spot where the compiler found the error.\
    \ Then you can correct the error and recompile the program.\n\n![Remember](images/remember.png)\
    \ Often, a single error can cause more than one error message to display, as is\
    \ the case in [Figure 2-3](#c02.xhtml_c02-fig-0003). Here, a single mistake caused\
    \ two errors.\n\n## Running a Java Program\n\nAfter you compile a Java program\
    \ with no errors, you can run it by choosing Tools   ⇒   Run Java Application\
    \ or pressing Ctrl+2\\. A command window opens, in which the program runs. [Figure\
    \ 2-4](#c02.xhtml_c02-fig-0004) shows the `HelloApp` program running in a separate\
    \ window atop the TextPad window.\n\n![The image shows a classic programming exercise\
    \ output. This output is a common starting point for beginners learning programming.\
    \ The “Hello, World!” message is often used as a simple test to ensure that code\
    \ execution is successful.](images/9781394296972-fg0204.png)\n\n[FIGURE 2-4:](#c02.xhtml_rc02-fig-0004)\
    \ Running a program.\n\nWhen the program finishes, the message `Press any key\
    \ to continue` appears in the command window. When you press a key, the window\
    \ closes, and TextPad comes back to life.\n\nChapter 3\n\n# Java Programming Basics\n\
    \nIN THIS CHAPTER\n\n![Bullet](images/check.png) **Introducing the venerable Hello,\
    \ World! program**\n\n![Bullet](images/check.png) **Identifying basic elements\
    \ of Java programs such as keywords, statements, and blocks**\n\n![Bullet](images/check.png)\
    \ **Finding different ways to add comments to your programs**\n\n![Bullet](images/check.png)\
    \ **Getting basic information about object-oriented programming**\n\n![Bullet](images/check.png)\
    \ **Identifying ways to import classes**\n\nIn this chapter, you find the basics\
    \ of writing simple Java programs. The programs you see in this chapter are very\
    \ simple: They just display simple information on a *console* (in Windows, that’s\
    \ a command-prompt window). You need to cover a few more chapters before you start\
    \ writing programs that do anything worthwhile. But the simple programs you see\
    \ in this chapter are sufficient to illustrate the basic structure of Java programs.\n\
    \nBe warned that in this chapter, we introduce you to several Java programming\
    \ features that are explained in greater detail in later chapters. You see, for\
    \ example, some variable declarations, a method, and even an `if` statement and\
    \ a `for` loop. The goal of this chapter isn’t to march you into instant proficiency\
    \ with these programming elements, but just to introduce you to them.\n\n## Looking\
    \ at the Venerable Hello, World! Program\n\nMany programming books begin with\
    \ a simple example program that displays the text `\"Hello, World!\"` on the console.\
    \ [Listing 3-1](#c03.xhtml_c03-fea-0001) shows a Java program that does that.\n\
    \n[LISTING 3-1](#c03.xhtml_rc03-fea-0001) The HelloApp Program\n\n`public class\
    \ HelloApp``→1`\n\n`{``→2`\n\n`public static void main(String[] args)``→3`\n\n\
    `{``→4`\n\n`System.out.println(\"Hello, World!\");``→5`\n\n`}``→6`\n\n`}``→7`\n\
    \nLater in this chapter, you discover in detail all the elements that make up\
    \ this program. But first, we want to walk you through it word by word.\n\nLines\
    \ 1 and 2 mark the declaration of a public class named `HelloApp`:\n\n1.  →1 `public`:\
    \ A *keyword* of the Java language that indicates that the element that follows\
    \ should be made available to other Java elements. In this case, what follows\
    \ is a class named `HelloApp`. As a result, this keyword indicates that the `HelloApp`\
    \ class is a *public class,* which means other classes can use it.\n\n    `class`:\
    \ Another Java keyword that indicates that the element being defined here is a\
    \ class. All Java programs are made up of one or more *classes.* A class definition\
    \ contains code that defines the behavior of the objects created and used by the\
    \ program. Although most real-world programs consist of more than one class, the\
    \ simple programs you see in this chapter have just one class."
