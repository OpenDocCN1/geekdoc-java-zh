    \ |\n\n| **`enum`** | **`new`** | **`switch`** |  |\n\n| `exports` | `non-sealed`\
    \ | **`synchronized`** |  |\n\n| **`extends`** | **`null`** | **`throw`** |  |\n\
    \n[TABLE 3-1](#c03.xhtml_rc03-tbl-0001) Java’s Keywords"
