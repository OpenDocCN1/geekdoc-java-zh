  raw: '![Warning](images/warning.png) In Java, Boolean expressions can get a little
    complicated when you use more than one logical operator, especially if you mix
    And and Or operators. Consider this expression:


    `if ( a==1 && b==2 || c==3 )`


    `System.out.println("It''s true!");`


    `else`


    `System.out.println("No it isn''t!");`


    What do you suppose this `if` statement does if `a` is `5`, `b` is `7`, and `c
    = 3`? The answer is that the expression evaluates to `true`, and `"It''s true!"`
    is printed. That’s because Java applies the operators from left to right. So the
    `&&` operator is applied to `a==1` (which is `false`) and `b==2` (which is also
    `false`, but that doesn’t matter because this evaluation is skipped). Thus, the
    `&&` operator returns `false`. Then the `||` operator is applied to that `false`
    result and the result of `c==3`, which is `true`. Thus the entire expression returns
    `true`.


    ![Tip](images/tip.png) Wouldn’t this expression have been clearer if you had used
    a set of parentheses to clarify what the expression does? Consider this example:


    `if ( ( a==1 && b==2 ) || c==3 )`


    `System.out.println("It''s true!");`


    `else`


    `System.out.println("No it isn''t!");`


    Here you can clearly see that the `&&` operator is evaluated first.


    ## Using the switch Statement


    In this section, you discover another Java tool for decision-making: the `switch`
    statement. The `switch` statement is a pretty limited beast, but it excels at
    making one particular type of decision: choosing one of several actions based
    on a value stored in an integer variable. As it turns out, the need to do just
    that comes up a lot. You want to keep the `switch` statement handy for use when
    such a need arises.


    The basic form of the `switch` statement is this:


    `switch (expression)`


    `{`


    `case` *`constant`*`:`


    *`statements`*`;`


    `break;`


    `[ case` *`constant-2`*`:`


    *`statements`*`;`


    `break; ]…`


    `[ default:`


    *`statements`*`;`


    `break; ]…`


    `}`


    The expression must evaluate to an `int`, `short`, `byte`, `char`, `String`, or
    `enum`. It can’t be a `long` or a floating-point type.


    You can code as many case groups as you want or need. Each group begins with the
    word `case`, followed by a constant (usually, a simple numeric or String literal)
    and a colon. Then you code one or more statements that you want executed if the
    value of the `switch` expression equals the constant. The last line of each case
    group is an optional `break` statement, which causes the entire `switch` statement
    to end.


    The `default` group, which is optional, is like a catch-all case group. Its statements
    are executed only if none of the previous case constants match the `switch` expression.


    ![Tip](images/tip.png) Note that the case groups are not true blocks marked with
    braces. Instead, each case group begins with the `case` keyword and ends with
    the `case` keyword that starts the next case group. All the case groups together,
    however, are defined as a block marked with a set of braces.


    ![Warning](images/warning.png) The last statement in each case group usually is
    a `break` statement. A `break` statement causes control to skip to the end of
    the `switch` statement. If you omit the `break` statement, control falls through
    to the next case group. Accidentally leaving out `break` statements is the most
    common cause of trouble with the `switch` statement.


    Suppose that you need to set a commission rate based on a sales class represented
    by an integer (1, 2, or 3) according to this table:


    | **Class** | **Commission Rate** |


    | --- | --- |


    | 1 | 2% |


    | 2 | 3.5% |


    | 3 | 5% |


    | Any other value | 0% |


    You could do this with the following `switch` statement:


    `double commissionRate;`


    `switch (salesClass)`


    `{`


    `case 1:`


    `commissionRate = 0.02;`


    `break;`


    `case 2:`


    `commissionRate = 0.035;`


    `break;`


    `case 3:`


    `commissionRate = 0.05;`


    `break;`


    `default:`


    `commissionRate = 0.0;`


    `break;`


    `}`


    ### Viewing an example else-if program


    Many applications call for a simple logical selection of things to be done depending
    on some value that controls everything. As we describe earlier in this chapter,
    such things can be handled with big chains of `else-if` statements all strung
    together.


    Unfortunately, these things can quickly get out of hand. `else if` chains can
    end up looking like DNA double-helix structures or those things that dribble down
    from the tops of the computer screens in *The Matrix,* with hundreds of lines
    of code that string `else if` after `else if`. The `switch` statement provides
    a much more concise alternative.


    [Listing 6-1](#c06.xhtml_c06-fea-0001) shows a bit of a program that might be
    used to decode error codes in a self-driving car (also known as an autonomous
    vehicle, or AV for short).


    [LISTING 6-1](#c06.xhtml_rc06-fea-0001) The else-if Version of an Autonomous Vehicle
    Error Decoder


    `import java.util.Scanner;`


    `public class AVErrorDecoder1`


    `{`


    `static Scanner sc = new Scanner(System.in);`


    `public static void main(String[] args)`


    `{`


    `System.out.println`


    `("Welcome to the Autonomous Vehicle "`


    `+ "error code decoder.\n\n"`


    `+ "If your Autonomous Vehicle generates "`


    `+ "an error code,\n"`


    `+ "you can use this program to determine "`


    `+ "the exact\ncause of the error.\n");`


    `System.out.print("Enter the error code: ");`


    `int err = sc.nextInt();`


    `String msg = "";`


    `if (err==1)`


    `msg = "General error.\n"`


    `+ "Returning control to driver.";`


    `else if (err==2)`


    `msg = "System Update Required.\n"`


    `+ "Pulling over and advising occupant "`


    `+ "to not restart vehicle.";`


    `else if (err==3)`


    `msg = "Vehicle bored with destination.\n"`


    `+ "Changing to something more exotic.";`


    `else if (err==4)`


    `msg = "Too many Drive Thru Windows.\n"`


    `+ "Taking occupant to nearest health clinic.";`


    `else if (err==5)`


    `msg = "Dodgers game detected on audio system.\n"`


    `+ "Switching to Giants.";`


    `else if (err==6)`


    `msg = "Left turn signal stuck on for more than 10 miles.\n"`


    `+ "Vehicle may be too old to drive self.";`


    `else if (err==7)`


    `msg = "Vehicle has had enough and cannot take it anymore.\n"`


    `+ "Heading for nearest bridge.";`


    `else`


    `msg = "I''m sorry, Dave. I''m afraid I can''t do that.\n";`


    `System.out.println(msg);`


    `}`


    `}`


    Wow! And this program has to decipher just 7 error codes. What if the self-driving
