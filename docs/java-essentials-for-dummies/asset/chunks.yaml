- fmt: "\nWhy do you have to list the class name twice? The first time, you’re providing\
    \ a `type` for the variable. In other words, you’re saying that the variable you’re\
    \ creating here can be used to hold objects created from the `Class1` class. The\
    \ second time you list the class name, you’re creating an object from the class.\
    \ The `new` keyword tells Java to create an object, and the class name provides\
    \ the name of the class to use to create the object.\n\n![Tip](images/tip.png)\
    \ You may have noticed that in the variable name `myClass1Object`, we capitalized\
    \ the words `Class1` and `Object` within the name, but did not capitalize the\
    \ first letter of the name. This type of capitalization is called `camel case`,\
    \ because the capitalized parts of the word look like the humps on a camel’s back.\
    \ Camel case is commonly used for variable names in Java.\n\nThe equal sign `=`\
    \ is an `assignment operator`. It simply says to take the object created by the\
    \ `new` keyword and assign it to the variable. Thus, this statement actually does\
    \ `three` things:\n\n*   It creates a variable named `myClass1Object` that can\
    \ be used to hold objects created from the `Class1` class. At this point, no object\
    \ has been created — just a variable that can be used to store objects.\n*   It\
    \ creates a new object in memory from the `Class1` class.\n*   It assigns this\
    \ newly created object to the `myClass1Object` variable. That way, you can use\
    \ the `myClassObject` variable to refer to the object that was created.\n\n###\
    \ Viewing a program that uses an object\n\nTo give you an early look at what object-oriented\
    \ programming really looks like, [Listing 3-2](#c03.xhtml_c03-fea-0002) and [Listing\
    \ 3-3](#c03.xhtml_c03-fea-0003) show another version of the `HelloApp` application\
    \ — this time using two classes, one of which is actually made into an object\
    \ when the program is run. The first class, named `HelloApp2`, is shown in [Listing\
    \ 3-2](#c03.xhtml_c03-fea-0002). This class is similar to the `HelloApp` class\
    \ shown in [Listing 3-1](#c03.xhtml_c03-fea-0001) but uses an object created from\
    \ the second class, named `Greeter`, to actually display the `\"Hello, World!\"\
    ` message on the console. The `Greeter` class is shown in [Listing 3-3](#c03.xhtml_c03-fea-0003).\
    \ It defines a method named `sayHello` that displays the message.\n\n![Remember](images/remember.png)\
    \ Both the `HelloApp` and the `Greeter` classes are public classes. Java requires\
    \ that each public class be stored in a separate file with the same name as the\
    \ class; the filename ends with the extension `.java`. As a result, the `HelloApp2`\
    \ class is stored in a file named `HelloApp2.java`, and the `Greeter` class is\
    \ stored in a file named `Greeter.java`.\n\n#### The HelloApp2 class\n\nThe `HelloApp2`\
    \ class is shown in [Listing 3-2](#c03.xhtml_c03-fea-0002).\n\n[LISTING 3-2](#c03.xhtml_rc03-fea-0002)\
    \ The HelloApp2 Class\n\n```\n// This application displays a hello message on\n\
    // the console by creating an instance of the\n// Greeter class and then calling\
    \ the Greeter\n// object's sayHello method.\npublic class HelloApp2\n{\n    public\
    \ static void main(String[] args)\n    {\n        Greeter myGreeterObject = new\
    \ Greeter();\n        myGreeterObject.sayHello();\n    }\n}\n```\n\nThe following\
    \ paragraphs describe the key points:\n\n1.  →1 This class begins with a series\
    \ of comment lines identifying the function of the program. For these comments,\
    \ we used simple end-of-line comments rather than traditional comments. (For more\
    \ on commenting, see the “[[Crafting Comments](#c03.xhtml_c03-sec-0010)” section,\
    \ earlier in this chapter.)\n2.  →5 The `HelloApp2` class begins on line 5 with\
    \ the `public` class declaration. Because the `public` keyword is used, a file\
    \ named `HelloApp2.java` must contain this class.\n3.  →7 The `main` method is\
    \ declared, using the same signature as the `main` method in the first version\
    \ of this program ([Listing 3-1](#c03.xhtml_c03-fea-0001)). Get used to this form,\
    \ because *all* Java applications must include a `main` method that’s declared\
    \ in this way.\n4.  →9 The first line in the body of the main method creates a\
    \ variable named `myGreeterObject` that can hold objects created from the `Greeter`\
    \ class. Then it creates a new object using the `Greeter` class and assigns this\
    \ object to the `myGreeterObject` variable.\n5.  →10 The second line in the body\
    \ of the main method calls the `myGreeterObject` object’s `sayHello` method. As\
    \ you’ll see in a moment, this method simply displays the message `\"Hello, World!\"\
    ` on the console.\n\n#### The Greeter class\n\nThe `Greeter` class is shown in\
    \ [Listing 3-3](#c03.xhtml_c03-fea-0003).\n\n[LISTING 3-3](#c03.xhtml_rc03-fea-0003)\
    \ The Greeter Class\n\n```\n// This class represents a Greeter object that displays\n\
    // a hello message on the console.\npublic class Greeter\n{\n    public void sayHello()\n\
    \    {\n        System.out.println(\"Hello, World!\");\n    }\n}\n```\n\nThe following\
    \ paragraphs describe the key points:\n\n1.  →1 This class also begins with a\
    \ series of comment lines identifying the function of the program.\n2.  →3 The\
    \ class declaration begins on this line. The class is declared as `public` so\
    \ other classes can use it. Strictly speaking, the public declaration here isn’t\
    \ required; HelloApp2 can access it because they’re in the same package.\n3. \
    \ →5 The `sayHello` method is declared using the `public` keyword so that it’s\
    \ available to classes. The `void` keyword indicates that this method doesn’t\
    \ provide any data back to the statement that calls it.\n4.  →7 The body of this\
    \ method consists of just one line that displays `\"Hello, World!\"`.\n\n### So\
    \ what’s the difference?\n\nYou may notice that the only line that actually does\
    \ any work in the `HelloApp2` program is line 7 in the `Greeter` class ([Listing\
    \ 3-3](#c03.xhtml_c03-fea-0003)). Other than the fact that the second version\
    \ requires twice as much code as the first version, what really is the difference\
    \ between these two applications?\n\nSimply put, the first version is procedural,\
    \ and the second is object-oriented. In the first version of the program, the\
    \ `main` method of the application does all the work by itself: It just says hello.\
    \ The second version defines a class that knows how to say hello. The application\
    \ itself doesn’t know exactly what the greeting will be, what language the greeting\
    \ will be in, or even how the greeting will be displayed.\n\nTo illustrate this\
    \ point, consider what would happen if you used the `Greeter` class shown in [Listing\
    \ 3-4](#c03.xhtml_c03-fea-0004) rather than the one shown in [Listing 3-3](#c03.xhtml_c03-fea-0003).\
    \ This version of the `Greeter` class uses a Java library class called `JOptionPane`\
    \ to display a message in a dialog box rather than in a console window. (We won’t\
    \ bother explaining in a list how this code works, but you can find out more about\
    \ it in the next chapter.) If you were to run the `HelloApp2` application using\
    \ this version of the `Greeter` class, you’d get the dialog box shown in [Figure\
    \ 3-1](#c03.xhtml_c03-fig-0001).\n\n[LISTING 3-4](#c03.xhtml_rc03-fea-0004) Another\
    \ Version of the Greeter Class\n\n```\n// This class creates a Greeter object\
    \ that displays\n// a hello message in a dialog box.\nimport javax.swing.JOptionPane;\n\
    public class Greeter\n{\n    public void sayHello()\n    {\n        JOptionPane.showMessageDialog(null,\n\
    \        \"Hello, World!\", \"Greeter\",\n        JOptionPane.INFORMATION_MESSAGE);\n\
    \    }\n}\n```\n"
