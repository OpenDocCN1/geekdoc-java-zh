    Here’s an `if-else` statement in which both statements are blocks:


    `double commissionRate;`


    `if (salesTotal > 10000.0)`


    `{`


    `commissionRate = 0.05;`


    `level2Count++;`


    `}`


    `else`


    `{`


    `commissionRate = 0.02;`


    `level1Count++;`


    `}`


    ### else-if statements


    A common pattern for nested `if` statements is to have a series of `if-else` statements
    with another `if-else` statement in each `else` part:


    `if (`*`expression-1`*`)`


    *`statement-1`*


    `else if (`*`expression-2`*`)`


    *`statement-2`*


    `else if (`*`expression-3`*`)`


    *`statement-3`*


    These statements are sometimes called *else-if statements,* although that term
    is unofficial. Officially, all that’s going on is that the statement in the `else`
    part happens to be another `if` statement — so this statement is just a type of
    a nested `if` statement. It’s an especially useful form of nesting, however.


    Suppose that you want to assign four commission rates based on the sales total,
    according to this table:


    | **Sales** | **Commission** |


    | --- | --- |


    | $10,000 and above | 5% |


    | $5,000 to $9,999 | 3.5% |


    | $1,000 to $4,999 | 2% |


    | Under $1,000 | 0% |


    You can easily implement a series of `else-if` statements:


    `if (salesTotal >= 10000.0)`


    `commissionRate = 0.05;`


    `else if (salesTotal >= 5000.0)`


    `commissionRate = 0.035;`


    `else if (salesTotal >= 1000.0)`


    `commissionRate = 0.02;`


    `else`


    `commissionRate = 0.0;`


    ![Warning](images/warning.png) You have to think through carefully how you set
    up these `else-if` statements. At first glance, for example, this sequence looks
    as though it might work:


    `if (salesTotal > 0.0)`


    `commissionRate = 0.0;`


    `else if (salesTotal >= 1000.0)`


    `commissionRate = 0.02;`


    `else if (salesTotal >= 5000.0)`


    `commissionRate = 0.035;`


    `else if (salesTotal >= 10000.0)`


    `commissionRate = 0.05;`


    Nice try, but this scenario won’t work. These `if` statements always set the commission
    rate to 0 percent because the Boolean expression in the first `if` statement always
    tests `true` (assuming that the `salesTotal` isn’t zero or negative — and if it
    is, none of the other `if` statements matter). As a result, none of the other
    `if` statements are ever evaluated.


    ## Using Mr. Spock’s Favorite Operators (Logical Ones, of Course)


    A *logical operator* (sometimes called a *Boolean operator)* is an operator that
    returns a Boolean result that’s based on the Boolean result of one or two other
    expressions. Expressions that use logical operators are sometimes called *compound
    expressions* because the effect of the logical operators is to let you combine
    two or more condition tests into a single expression. [Table 6-2](#c06.xhtml_c06-tbl-0002)
    lists the logical operators.


    The following sections describe most of these operators in excruciating detail.


    ### Using the ! operator


    The simplest of the logical operators is *Not* (`!`). Technically, it’s a *unary*
    prefix operator, which means that you use it with one operand, and you code it
    immediately in front of that operand. (Technically, this operator is called the
    *complement operator,* not the *Not operator*. But in real life, most people call
    it *Not*. And many programmers call it *bang*.)


    | **Operator** | **Name** | **Type** | **Description** |


    | --- | --- | --- | --- |


    | `!` | Not | Unary | Returns `true` if the operand to the right evaluates to
    `false`. Returns `false` if the operand to the right is `true`. |


    | `&` | And | Binary | Returns `true` if both of the operands evaluate to `true`.
    Both operands are evaluated before the And operator is applied. |'
