  trans: "\n\n汽车也是一种车辆。`Car` 类将继承 `Vehicle` 类，因此它也将拥有轮子；一个驾驶员（通常情况下）；可能还有一些乘客；以及行驶、停止、转弯和碰撞的能力。此外，它还有自己的一些特征，例如四个轮子、方向盘、安全带和安全气囊，以及可选的自动变速箱。\n\
    \n### 游戏玩法\n\n由于你不太可能去编写一个模拟汽车、摩托车和其他车辆的程序，让我们来看一个更常见的例子：游戏。假设你想开发一系列像《人生游戏》（Life）、《对不起》（Sorry!）和《大富翁》（Monopoly）这样的桌游。大多数桌游都有某些共同特征：\n\
    \n* 它们都有一个游戏板，上面有玩家占据的位置。\n* 它们都有由棋子代表的玩家。\n* 游戏由每个玩家轮流进行。当游戏开始时，它会一直持续，直到有人获胜。（如果你不信我们，可以问问那些试图在获胜前停止《忌闷》（Jumanji）游戏的孩子。）\n\
    \n每种特定类型的游戏都有这些基本特征，但增加了自己的特征。《人生游戏》增加了金钱、保险保单、配偶、孩子以及游戏板中间一个华的转盘。《对不起》有可以通过抽取来决定每次移动的卡牌，以及其他玩家无法攻击你的安全区域。《大富翁》有决定移动的骰子、机会和社区基金卡、房产、房屋、酒店和钱。\n\
    \n如果你为这些游戏设计类，你可能会创建一个通用的 `BoardGame` 类，定义所有桌游共有的基本特征，然后将其作为代表特定桌游的类的基类，例如 `LifeGame`、`SorryGame`\
    \ 和 `MonopolyGame`。\n\n### 业务示例\n\n如果车辆或游戏还不能让观点足够清楚，这里有一个来自商业世界的例子。假设你正在设计一个工资系统，并且正在编写代表员工的类。你意识到工资单包括两类员工：薪制员工和时薪员工。因此，你决定创建两个类，并合理地命名为\
    \ `SalariedEmployee`（薪制员工）和 `HourlyEmployee`（时薪员工）。\n\n你很快发现，这两个类执行的大部分工作是相同的。这两类员工都有姓名、地址、社会安全号码、年度薪资总额、预扣税额等。\n\
    \n员工的类型之间也有重要的区别。最明显的一点是薪制员工有年薪，而时薪员工有小时薪资率。此外，时薪员工有每周变化的时间表，而薪制员工可能拥有不向时薪员工提供的福利计划。\n\
    \n因此，你决定创建三个类而不是两个。一个名为 `Employee`（员工）的类处理两类员工共有的所有特征；然后该类就成为 `SalariedEmployee`\
    \ 和 `HourlyEmployee` 类的基类。这些类提供了区分薪制员工和时薪员工的额外特征。\n\n### 继承层次结构\n\n继承最重要的方面之一是，派生自基类的类反过来被用作另一个派生类的基类。因此，你可以使用继承来形成类的层次结构。\n\
    \n你已经看到 `Employee` 类如何被用作基类创建两种类型的子类：用于薪制员工的 `SalariedEmployee` 类和用于时薪员工的 `HourlyEmployee`\
    \ 类。假设薪制员工分为两类：管理人员和销售人员。那么，你可以将 `SalariedEmployee` 类作为另外两个类的基类：`Manager`（经理）和\
    \ `SalesPerson`（销售人员）。\n\n因此，`Manager` 是 `SalariedEmployee` 的一种类型。因为 `SalariedEmployee`\
    \ 是 `Employee` 的一种类型，所以 `Manager` 也是 `Employee` 的一种类型。\n\n### 创建子类\n\n创建子类的基本步骤非常简单：你只需要在子类的声明中使用\
    \ `extends` 关键字。继承基类的类的类声明的基本格式如下：\n\n```\npublic class ClassName extends BaseClass\n\
    {\n    // 类体放在这里\n}\n```\n\n假设你有一个名为 `Ball`（球）的类，它定义了一个基础球，你想创建一个名为 `BouncingBall`（跳球）的子类，增加弹跳的能力：\n\
    \n```\npublic class BouncingBall extends Ball\n{\n  // 为基础 Ball 对象添加弹跳能力的方法和字段：\n\
    \  public void bounce()\n  {\n    // bounce 方法\n  }\n}\n```\n\n在这里，我们创建一个名为 `BouncingBall`\
    \ 的类，它扩展了 `Ball` 类。（`Extends` 是 Java 中表示*继承*的单词。）\n\n子类自动拥有它继承的类的所有方法和字段。因此，如果\
    \ `Ball` 类有名为 `size`（尺寸）和 `weight`（重量）的字段，`BouncingBall` 类也有这些字段。同样，如果 `Ball`\
    \ 类有一个名为 `throw`（抛掷）的方法，`BouncingBall` 类也会获得该方法。\n\n你需要了解一些重要的细节以正确地使用继承：\n\n\
    * 子类继承其基类中的所有可见成员。然而，构造函数*不*被视为成员。结果是，子类*不*继承其基类的构造函数。而且，子类不会继承对它不可见的成员（即 `private`\
    \ 私有成员）。\n* 你可以通过在子类中声明一个具有相同签名的新成员来*重写*（override）方法。欲需更多信息，请参见下一节。\n* 一种称为 `protected`\
    \ 的特殊可见性会隐藏包外类的字段和方法，但使它们对子类以及包内的其他类可用。欲需更多信息，请参见该节。\n* 你可以为子类添加具有任何可见性的更多方法或字段。例如，本节所示的\
    \ `BouncingBall` 类增加了公共方法 `bounce`。\n\n### 方法重写\n\n如果子类声明了一个与基类公共方法签名相同的方法，则子类版本的方法就*重写*了基类版本的方法。这种技术允许你修改基类的行为以适应子类的需求。\n\
    \n假设你有一个名为 `Game` 的基类，它有一个名为 `play` 的方法。基类没有代表任何游戏，它实现了这个方法：\n\n```\npublic class\
    \ Game\n{\n    public void play()\n    {\n    }\n}\n```\n\n然后你声明一个名为 `Chess` 的类，它扩展了\
    \ `Game` 类但为 `play` 方法提供了实现：\n\n```\npublic class Chess extends Game\n{\n  public\
    \ void play()\n  {\n    System.out.println(\"我放弃了。你赢了.\");\n  }\n}\n```\n\n在这里，当你调用\
    \ `Chess` 对象的 `play` 方法时，游戏宣布放弃。（我们本打算为这个示例提供一个完整的象棋程序实现，但这会让章节变得数百页。因此我们选择了更简单的版本。）\n\
    \n注意，要重写方法必须满足几个条件：\n\n* 类必须扩展定义你要重写的方法的类。\n* 方法必须对子类可见——你不能重写 `private` 方法。\n\
    * 子类中的方法必须与基类中的方法具有相同的签名。也就是说，方法的名称、参数类型和返回类型必须相同。（实际上，返回类型可以是父类方法返回类型的更具体的变体。例如，你可以用一个返回\
    \ `Circle` 的方法来重写一个返回 `Shape` 的方法，因为 `Circle` 是 `Shape` 的子类型。这种类型的重写被称为*协变返回类型*（covariant\
    \ return type）。）\n\n"
