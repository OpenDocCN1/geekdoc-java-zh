    `public void sayHello()``→5`


    `{`


    `System.out.println("Hello, World!");``→7`


    `}`


    `}`


    The following paragraphs describe the key points:


    1.  →1 This class also begins with a series of comment lines that identify the
    function of the program.


    2.  →3 The class declaration begins on this line. The class is declared as `public`
    so other classes can use it. Strictly speaking, the public declaration here isn’t
    strictly required; the `HelloApp2` class can access the `Greeter` class without
    it because they’re in the same package.


    3.  →5 The `sayHello` method is declared using the `public` keyword so that it’s
    available to other classes that use the `Greeter` class. The `void` keyword indicates
    that this method doesn’t provide any data back to the statement that calls it,
    and `sayHello` simply provides the name of the method.


    4.  →7 The body of this method consists of just one line of code that displays
