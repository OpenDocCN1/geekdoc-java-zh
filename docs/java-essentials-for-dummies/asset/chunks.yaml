  raw: 'Considering the Java community’s disdain for Visual Basic, it’s surprising
    that the error messages generated when you capitalize keywords aren’t more insulting.
    Accidentally capitalizing a keyword in Visual Basic style can really throw the
    Java compiler for a loop. Consider this program, which contains the single error
    of capitalizing the word `For`:


    `public class CaseApp`


    `{`


    `public static void main(String[] args)`


    `{`


    `For (int i = 0; i<5; i++)`


    `System.out.println("Hi");`


    `}`


    `}`


    When you try to compile this program, the compiler generates a total of four error
    messages for this one mistake:


    `C:\Users\doug\Documents\CaseApp.java:5: error: ''.class'' expected`


    `For (int i = 0; i<5; i++)`


    `^`


    `C:\Users\doug\Documents\CaseApp.java:5: error: illegal start of type`


    `For (int i = 0; i<5; i++)`


    `^`


    `C:\Users\doug\Documents\CaseApp.java:5: error: not a statement`


    `For (int i = 0; i<5; i++)`


    `^`


    `C:\Users\doug\Documents\CaseApp.java:5: error: '';'' expected`


    `For (int i = 0; i<5; i++)`


    `^`


    `4 errors`


    Even though this single mistake generates four error messages, not one of the
    messages actually points to the problem. The little arrow beneath the source line
    indicates what part of the line is in error, and none of these error messages
    has the arrow pointing anywhere near the word `For`! The compiler isn’t smart
    enough to realize that you meant `for` instead of `For`. So it treats `For` as
    a legitimate identifier and then complains about everything else on the line that
    follows it. It would be much more helpful if the compiler generated an error message
    like this:


    `C:\Java Essentials\CaseApp.java:5: ''For'' is not a keyword`


    `For (int i = 0; i<5; i++)`


    Better yet, for those of us old enough to remember *Get Smart* on TV:


    `C:\Java Essentials\CaseApp.java:5: Theese ees Java! Vee do not capitalize keyverds
    here!`


    `For (int i = 0; i<5; i++)`


    ![Remember](images/remember.png) The moral of the story is that Java is case-sensitive,
    and if your program won’t compile and the error messages don’t make any sense,
    check for keywords that you’ve mistakenly capitalized.


    ## Working with Statements


    Like most programming languages, Java uses statements to build programs. Unlike
    most programming languages, Java doesn’t use statements as its fundamental unit
    of code. Instead, it gives that honor to the class. However, every class must
    have a body, and the body of a class is made up of one or more statements. In
    other words, you can’t have a meaningful Java program without at least one statement.
    The following sections describe the ins and outs of working with Java statements.


    ### Types of statements


    Java has many types of statements. Some statements simply create variables that
    you can use to store data. These types of statements are often called *declaration
    statements* and tend to look like this:


    `int i;`


    `String name;`


    Another common type of statement is an *assignment statement,* which assigns a
    value to a variable:


    `i = 42;`


    `name = "Jackie Robinson";`


    Declaration and assignment statements can be combined into a single statement,
    like this:


    `int i = 42;`


    `String name = "Jackie Robinson";`


    Another common type of statement is an *expression statement,* which performs
    calculations or other operations. For example:


    `System.out.println("Hello, World!");`


    Notice that this statement is the same as line 5 in [Listing 3-1](#c03.xhtml_c03-fea-0001).
    Thus the single statement in the `HelloApp` program is an expression statement.


    There are many kinds of statements besides these two. `if` statements, for example,
    execute other statements only if a particular condition has been met, and statements
    such as `for`, `while`, and `do` execute whole groups of statements repeatedly.


    ![Tip](images/tip.png) It’s often said that every Java statement must end with
    a semicolon. Actually, this isn’t quite true. *Some* types of Java statements
    must end with semicolons — but others don’t have to. The basic rule is that declaration
    and expression statements must end with a semicolon, but most other statement
    types do not. Where this rule gets tricky, however, is that most other types of
    statements include one or more declarations or expression statements that do use
    semicolons. Here’s a typical `if` statement:


    `if (total > 100)`


    `discountPercent = 10;`


    Here, the variable named `discountPercent` is given a value of `10` if the value
    of the `total` variable is greater than `100`. The assignment statement ends with
    a semicolon, but the `if` statement itself doesn’t. (The Java compiler lets you
    know if you use a semicolon when you shouldn’t.)


    ### White space


    In Java, the term *white space* refers to one or more consecutive space characters,
    tab characters, or line breaks. All white space is considered the same.


    ![Remember](images/remember.png) In other words, a single space is treated the
    same as a tab or line break or any combination of spaces, tabs, and line breaks.


    If you’ve programmed in Visual Basic, white space is different from what you’re
    used to. In Visual Basic, line breaks mark the end of statements unless special
    continuation characters are used. In Java, you don’t have to do anything special
    to continue a statement onto a second line. Thus the statement


    `x = (y + 5) / z;`


    is identical to this statement:


    `x =`


    `(y + 5) / z;`


    Be advised, however, that you can’t put white space in the middle of a keyword
    or identifier. The following example won’t work:


    `p u b l i c static v o i d main(String[] args)`


    Here the extra spaces between the letters in the words *public* and *void* will
    confuse the compiler.


    ![Tip](images/tip.png) Using white space liberally in your programs is a good
    idea. In particular, you should routinely use white space like this:


    *   **Line breaks:** Place each statement on a separate line. In addition, you
    can break a longer statement into several lines for clarity.


    *   **Tabs or spaces:** Use tabs or spaces to line up elements that belong together.


    The compiler ignores the extra white space, so it doesn’t affect the bytecode
    that’s created for your program. As a result, using extra white space in your
    program doesn’t affect your program’s performance in any way, but it does make
    the program’s source code easier to read.


    ## Working with Blocks


    A *block* is a group of one or more statements that’s enclosed in braces. A block
    begins with an opening brace (`{`) and ends with a closing brace (`}`). Between
    the opening and closing braces, you can code one or more statements. Here’s a
    block that consists of three statements:


    `{`


    `int i, j;`


    `i = 100;`


    `j = 200;`


    `}`


    ![Tip](images/tip.png) You can code the braces that mark a block in two popular
    ways. One is to place both braces on separate lines and then indent the statements
    that make up the block. For example:


    `if ( i > 0)`


    `{`


    `String s = "The value of i is " + i;`


    `System.out.print(s);`


    `}`


    The other style is to place the opening brace for the block on the same line as
    the statement the block is associated with, like this:


    `if ( i > 0) {`


    `String s = "The value of i is " + i;`


    `System.out.print(s);`


    `}`


    Which style you use is a matter of personal preference. We prefer the first style,
    and that’s the style we use throughout this book. But either style works — and
    many programmers prefer the second style because it’s more concise.


    ![Tip](images/tip.png) Note that even though a block can be treated as a single
    statement, you should *not* end a block with a semicolon. The statements within
    the block may require semicolons, but the block itself does not.


    ## Creating Identifiers


    An *identifier* is a word that you make up to refer to a Java programming element
    by name. Although you can assign identifiers to many types of Java elements, they’re
    most commonly used for the following elements:


    *   Classes, such as the `HelloApp` class in [Listing 3-1](#c03.xhtml_c03-fea-0001)


    *   Methods, such as the `main` method in [Listing 3-1](#c03.xhtml_c03-fea-0001)'
