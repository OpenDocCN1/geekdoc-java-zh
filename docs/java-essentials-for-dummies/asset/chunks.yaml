    such as `var`, `true`, `false`, or `null`.


    ### Knowing what goes in the class body


    The *class body* of a class is everything that goes within the braces at the end
    of the class declaration. The `public class ClassName` part of a class declaration
    takes just one line, but the body of the class declaration may take hundreds of
    lines (or thousands, if you get carried away).


    The class body can contain the following elements:


    *   **Fields:** Variable declarations define the public or private fields of a
    class.


    *   **Methods:** Method declarations define the methods of a class.


    *   **Constructors:** A *constructor* is a block of code that’s similar to a method
    but is run to initialize an object when an instance is created. A constructor
    must have the same name as the class itself, and although it resembles a method,
    it doesn’t have a return type.


    *   **Initializers:** These stand-alone blocks of code are run only once, when
    the class is initialized. There are actually two types, called *static initializers*
    and *instance initializers.*


    *   **Other classes and interfaces:** A class can include another class, which
    is then called an *inner class* or a *nested class*. Classes can also contain
    interfaces.


    ![Tip](images/tip.png) Unlike some programming languages, Java doesn’t care about
    the order in which items appear in the class body. Still, being consistent about
    the order in which you place things in your classes is a good idea. That way you
    know where to find them. We usually code all the fields together at the start
    of the class, followed by constructors and then methods.


    Some programmers like to place the fields at the end of the class rather than
    at the beginning. Whatever brings you happiness is fine with us.


    ![Remember](images/remember.png) The fields, methods, classes, and interfaces
    contained within a class are called the *members* of the class. Constructors and
    initializers aren’t considered to be members.


    ### Seeing where classes live


    A public class must be written in a source file that has the same name as the
    class, with the extension `java`. A public class named `Greeter`, for example,
    must be placed in a file named `Greeter.java`.


    As a result, you can’t place two public classes in the same file. The following
    source file (named `DiceGame.java`) won’t compile:


    `public class DiceGame`


    `{`


    `public static void main(String[] args)`


    `{`


    `Dice d = new Dice();`


    `d.roll();`


    `}`


    `}`


    `public class Dice`


    `{`


    `public void roll()`


    `{`


    `// code that rolls the dice goes here`


    `}`


    `}`


    The compiler coughs up a message indicating that `Dice` is a public class and
    must be declared in a file named `Dice.java`.


    This problem has two possible solutions. The first is to remove the `public` keyword
    from the `Dice` class:


    `public class DiceGame`


    `{`


    `public static void main(String[] args)`


    `{`


    `Dice d = new Dice();`


    `d.roll();`


    `}`


    `}`


    `class Dice`


    `{`


    `public void roll()`


    `{`


    `// code that rolls the dice goes here`


    `}`


    `}`


    The compiler gladly accepts this program.


    ![Remember](images/remember.png) When you code more than one class in a single
    source file, Java still creates a separate class file for each class. Thus, when
    you compile the `DiceGame.java` file, the Java compiler creates two class files:
    `DiceGame.class` and `Dice.class`.


    Removing the `public` keyword from a class is acceptable for relatively small
    programs, but its limitation is that the `Dice` class is available only to the
    classes defined within the `DiceGame.java` file. If you want the `Dice` class
    to be more widely available, opt for the second solution: Place it, with the `public`
    keyword, in a separate file named `Dice.java`.


    ![Tip](images/tip.png) If you’re going to create an application that has several
    public classes, create a separate folder for the application. Then save all the
    class files for the application to this folder. If you keep your class files together
    in the same folder, the Java compiler can find them. If you place them in separate
    folders, you may need to adjust your `ClassPath` environment variable to help
    the compiler find the classes.


    ## Working with Members


    The *members* of a class are the fields and methods defined in the class body.
    (Technically, classes and interfaces defined within a class are members too. We
    don’t discuss them in this book, though, so you can ignore them.)


    The following sections describe the basics of working with fields and methods
    in your classes.


    ### Understanding fields


    A *field* is a variable that’s defined in the body of a class, outside any of
    the class’s methods. Fields are available to all the methods of a class. In addition,
    if the field specifies the `public` keyword, the field is visible outside the
    class. If you don’t want the field to be visible outside the class, use the `private`
    keyword instead.


    A field is defined the same as any other Java variable, but it can also have a
    modifier that specifies the visibility of the field — that is, whether other classes
    can access the fields of the class you’re defining. For now, we’ll just use two
    basic forms of visibility: public and private. For a more complete discussion
    of visibility, see the section “[Understanding visibility](#c10.xhtml_c10-sec-0009),”
    later in this chapter.


    To create a public field that can be accessed by other classes, use the `public`
    modifier:


    `public int trajectory = 0;`


    `public String name;`


    `public Player player;`


    To create a private field, specify `private` instead of `public`:


    `private int x_position = 0;`


    `private int y_position = 0;`


    `private String error_message = "";`


    Fields can also be declared as `final`:


    `public final int MAX_SCORE = 1000;`


    The value of a `final` field can’t be changed after it has been initialized. ***Note:***
    Spelling `final` field names with all capital letters is customary, but not required.


    ### Understanding instance methods


    You define methods for a class by using the same techniques that we describe in
    [Chapter 8](#c08.xhtml). To declare a method that’s available to users of your
    class, add the `public` keyword to the method declaration:


    `public boolean isActive()`


    `{`


    `return this.isActive;`


    `}`


    To create a private method that can be used within the class but isn’t visible
    outside the class, use the `private` keyword:


    `private void calculateLunarTrajectory()`


    `{`


    `// code to get the calculated lunar trajectory`


    `}`


    ### Understanding visibility


    In the preceding sections, we mention that both fields and methods can use the
    `public` or `private` keyword to indicate whether the field or method can be accessed
    from outside the class. This is called the *visibility* of the field or method.


    There are actually four distinct levels of visibility you can use:


    *   `private`: For fields that shouldn’t be visible to any other classes — in
    other words, fields that are completely internal to the class.


    *   `public`: For fields that should be visible to every other Java class, including
    classes that are outside of the current package.


    *   `protected`: For fields that should be visible only to subclasses of the current
    class — that is, to subclasses or inner classes.


    *   `package-private`: Use this visibility for fields that should be visible to
    any other class within the current package. (Note that there is no `package-private`
    keyword in Java; that’s just the default visibility if you don’t specify `private`,
    `public`, or `protected`.)'
