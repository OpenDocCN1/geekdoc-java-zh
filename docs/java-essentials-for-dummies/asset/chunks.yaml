    ### Creating a better version of the example program


    Fortunately, Java has a special statement that’s designed just for the kind of
    task represented by the autonomous vehicle error decoder program: the `switch`
    statement. Specifically, the `switch` statement is useful when you need to select
    one of several alternatives based on the value of an `int`, `char`, `String`,
    or `enum` type variable.


    ![Tip](images/tip.png) An *enum* is a special kind of Java type whose value is
    one of several predefined constants. For example, you may have an enum named `TemperatureScale`
    with constant values `CELCIUS`, `FAHRENHEIT`, and `KELVIN`. A variable defined
    with the `TemperatureScale` type can have one of these three values.


    [Listing 6-2](#c06.xhtml_c06-fea-0002) shows a version of the self-driving car
