  trans: "\n\n![图像显示了一个标题为“Greeter”的简单计算机对话框。对话框顶部的标题是“Greeter”。在对话框内部，左侧有一个信息图标。对话框居中的文本显示为“Hello,\
    \ World!”。文本下方有一个“OK”按钮。](img/9781394296972-fg0301.png)\n\nFIGURE 3-1: 列表 3-4\
    \ 中的类显示了这个对话框。\n\n![记住](img/remember.png) 这里需要注意的要点是，`HelloApp2` 类不需要修改即可使用这个新版本的\
    \ `Greeter` 类。相反，你所做的是将旧的 `Greeter` 类替换为新的，重新编译 `Greeter` 类，`HelloApp2` 类就不会感知到任何差异。这是面向对象编程的主要优点之一。\n\
    \n## 导入 Java API 类\n\n你可能已经注意到列表 3-4 中的 `Greeter` 类包含了以下语句：\n\n```\nimport javax.swing.JOptionPane;\n\
    ```\n\n`import` 语句的目的是让知道程序正在使用由 Java API 定义的名为 `JOptionPane` 的类。\n\n由于 Java API\
    \ 包含了数上万个类，因此需要某种形式的组织以便访问这些类。Java 通过将类分组为便于管理的组（称为 `packages`，包）来实现这一点。在上一个示例中，包含\
    \ `JOptionPane` 类的包名为 `javax.swing`。\n\n严格来说，`import` 语句并不是必须的。但如果你不使用 `import`\
    \ 语句来导入程序使用的 API 类，那么在使用这些类时，你必须*完全限定*类名，即在类名之前列出包名。因此，如果列表 3-4 中的类没有在第 4 行包含\
    \ `import` 语句，你必须这样编写第 11 行：\n\n```\njavax.swing.JOptionPane.showMessageDialog(null,\n\
    \"Hello, World!\", \"Greeter\",\njavax.swing.JOptionPane.INFORMATION_MESSAGE);\n\
    ```\n\n换句话说，每当你引用这个类时，都必须指定 `javax.swing.JOptionPane` 而不仅仅是 `JOptionPane`。\n\n\
    ![提示](img/tip.png) 以下是使用 `import` 语句的一些额外规则：\n\n*   `import` 语句必须出现在类文件的开头，位于任何类声明之前。\n\
    *   你可以包含任意数量的 `import` 语句，以导入程序所使用的所有类。\n*   你可以通过列出包名后跟星号通配符来导入特定包中的所有类，如下：\n\
    \    ```\n    import javax.swing.*;\n    ```\n*   由于许多程序都会使用包含 `java.lang` 包中的类，你不需要导入该包。相反，这些类对所有程序都是自动可用的。`System`\
    \ 类定义在 `java.lang` 包中。因此，你不需要提供 `import` 语句即可使用该类。\n\n## 第 4 章\n\n# 使用变量和数据类型\n\
    \n## 本章内容\n\n![项目](img/check.png) **创建正确的变量声明**\n![项目](img/check.png) **发现基本类型与引用类型之间的区别**\n\
    ![项目](img/check.png) **查看 Java 的内置数据类型**\n![项目](img/check.png) **介绍字符串**\n\n在本章中，你将学习在\
    \ Java 中操作变量的基础知识。变量是使 Java 程序具有通用性的关键。变量也是创建可以执行计算的程序的关键。假设你想创建一个程序，根据给定的圆半径计算圆的面积。这样的程序使用两个变量：一个表示圆的半径，另一个表示圆的面积。程序要求用户为第一个变量输入值，然后计算第二个变量的值。\n\
    \n## 声明变量\n\n在 Java 中，你必须在使用变量之前显式地声明它们。这一规则与某些语言形成对比——特别是 Python，它允许你使用未显式声明的变量。\n\
    \n![警告](img/warning.png) 允许使用未显式声明的变量初看起来是个很主主意，但它是变量名拼写错误导致 Bug 的常见来源。Java 要求显式声明变量，这样一旦如果你拼错了变量名，编译器就能检测到你的错误并显示编译器错误。\n\
    \n变量声明的基本形式如下：\n\n`type name;`\n\n以下是一些示例：\n\n```\nint x;\nString lastName;\n\
    double radius;\n```\n\n在这些示例中，声明了名为 `x`、`lastName` 和 `radius` 的变量。`x` 变量存储整数，`lastName`\
    \ 变量存储 `String` 值，而 `radius` 变量存储 double 值。关于这些类型含义的更多信息，请参阅本章稍后的“使用基本数据类型”节。在此之前，只需知道\
    \ `int` 变量可以存储整数即可。\n\n"
- fmt: "\n![Tip](images/tip.png) You don’t have to place class variable declarations\
    \ at the beginning of a class. Some programmers prefer to place them at the end\
    \ of the class, as in this example:\n\n```java\npublic class HelloApp\n{\n   \
    \ public static void main(String[] args)\n    {\n        helloMessage = \"Hello,\
    \ World!\";\n        System.out.println(helloMessage);\n    }\n    static String\
    \ helloMessage;\n}\n```\n\nHere the `helloMessage` variable is declared *after*\
    \ the `main` method.\n\n![Tip](images/tip.png) We think classes are easier to\
    \ read if the variables are declared first, so that’s where you see them in this\
    \ book.\n\n### Declaring instance variables\n\nAn *instance variable* is similar\
    \ to a class variable but doesn’t specify the word `static` in its declaration.\
    \ As the name suggests, instance variables are associated with instances of classes.\
    \ As a result, you can use them only when you create an instance of a class. Because\
    \ static methods aren’t associated with an instance of the class, you can’t use\
    \ an instance variable in a static method — and that includes the `main` method.\n\
    \nThe following example program won’t compile:\n\n```java\npublic class HelloApp\n\
    {\n    String helloMessage;\n    public static void main(String[] args)\n    {\n\
    \        helloMessage = \"Hello, World!\";\n        System.out.println(helloMessage);\
    \ // will not compile\n    }\n}\n```\n\nIf you try to compile this program, you\
    \ get the following error messages:\n\n```\nC:\\Java\\HelloApp.java:7: error:\
    \ non-static variable helloMessage cannot be referenced from a static context\n\
    helloMessage = \"Hello, World!\";\n^\nC:\\Java\\HelloApp.java:8: non-static variable\
    \ helloMessage cannot be referenced from a static context\nSystem.out.println(helloMessage);\n\
    ^\n```\n\nBoth of these errors occur because the `main` method is `static`, so\
    \ it can’t access instance variables.\n\nInstance variables are useful whenever\
    \ you create your own classes, but because we don’t cover that topic until [Chapter\
    \ 10](#c10.xhtml), you won’t see many examples of instance methods until then.\n\
    \n### Declaring local variables\n\nA *local variable* is a variable that’s declared\
    \ within the body of a method. Then you can use the variable only within that\
    \ method. Other methods in the class aren’t even aware that the variable exists.\n\
    \nHere’s a version of the `HelloApp` class in which the `helloMessage` variable\
    \ is declared as a local variable:\n\n```java\npublic class HelloApp\n{\n    public\
    \ static void main(String[] args)\n    {\n        String helloMessage;\n     \
    \   helloMessage = \"Hello, World!\";\n        System.out.println(helloMessage);\n\
    \    }\n}\n```\n\nNote that you don’t specify `static` on a declaration for a\
    \ local variable. If you do, the compiler generates an error message and refuses\
    \ to compile your program. Local variables always exist within the scope of a\
    \ method, and they exist only while that method is executing. As a result, whether\
    \ an instance of the class has been created is irrelevant. (For more information,\
    \ see the section “[Understanding Scope](#c04.xhtml_c04-sec-0023),” later in this\
    \ chapter.)\n\n![Tip](images/tip.png) Unlike class and instance variables, a local\
    \ variable is fussy about where you position the declaration for it. In particular,\
    \ you must place the declaration before the first statement that actually uses\
    \ the variable. Thus the following program won’t compile:\n\n```java\npublic class\
    \ HelloApp\n{\n    public static void main(String[] args)\n    {\n        helloMessage\
    \ = \"Hello, World!\"; // error -- helloMessage\n        System.out.println(helloMessage);\
    \ // is not yet declared\n        String helloMessage;\n    }\n}\n```\n\nWhen\
    \ it gets to the first line of the `main` method, the compiler generates two error\
    \ messages complaining that it can’t find the symbol `\"helloMessage\"`. That’s\
    \ because the symbol hasn’t been declared.\n\nAlthough most local variables are\
    \ declared near the beginning of a method’s body, you can also declare local variables\
    \ within smaller blocks of code marked by braces. This will make more sense to\
    \ you when you read about statements that use blocks, such as `if` and `for` statements.\
    \ But here’s an example:\n\n```java\nif (taxRate > 0)\n{\n    double taxAmount;\n\
    \    taxAmount = subTotal * taxRate;\n    total = subTotal + total;\n}\n```\n\n\
    Here the variable `taxAmount` exists only within the set of braces that belongs\
    \ to the `if` statement. (You can assume that the variables `taxRate`, `subtotal`,\
    \ and `total` are defined outside of the code block defined by the braces.)\n\n\
    ## Initializing Variables\n\nIn Java, local variables are not given initial default\
    \ values. The compiler checks to make sure that you have assigned a value before\
    \ you use a local variable. The following example program won’t compile:\n\n```java\n\
    public class TestApp\n{\n    public static void main(String[] args)\n    {\n \
    \       int i;\n        System.out.println(\"The value of i is \" + i);\n    }\n\
    }\n```\n\nIf you try to compile this program, you get the following error message:\n\
    \n```\nC:\\Java\\TestApp.java:6: error: variable i might not have been initialized\n\
    System.out.println(\"The value of i is \" + i);\n^\n```\n\nTo avoid this error\
    \ message, you must initialize local variables before you use them. You can do\
    \ that by using an assignment statement or an initializer, as we describe in the\
    \ following sections.\n\n![Tip](images/tip.png) Unlike local variables, class\
    \ variables and instance variables are given default values. Numeric types are\
    \ automatically initialized to zero, and `String` variables are initialized to\
    \ empty strings.\n\n### Initializing variables with assignment statements\n\n\
    One way to initialize a variable is to code an assignment statement following\
    \ the variable declaration. Assignment statements have this general form:\n\n\
    `variable` `=` `expression``;`\n\nHere, the `expression` can be any value of the\
    \ same type as the variable. Here’s a version of the `main` method from the previous\
    \ example that correctly initializes the `i` variable:\n\n```java\npublic static\
    \ void main(String[] args)\n{\n    int i;\n    i = 0;\n    System.out.println(\"\
    i is \" + i);\n}\n```\n\nIn this example, the variable is initialized to zero\
    \ before it is called.\n\n### Initializing variables with initializers\n\nJava\
    \ also allows you to initialize a variable on the same statement that declares\
    \ the variable. To do that, you use an *initializer,* which has the following\
    \ general form:\n\n`type name` `=` `expression``;`\n\nIn effect, the initializer\
    \ lets you combine a declaration and an assignment statement into one concise\
    \ statement. Here are some examples:\n\n```java\nint x = 0;\nString lastName =\
    \ \"Lowe\";\ndouble radius = 15.4;\n```\n\nIn each case, the variable is both\
    \ declared and initialized in a single statement.\n\nWhen you declare more than\
    \ one variable in a single statement, each variable can have its own initializer.\
    \ The following code declares variables named `x` and `y`, and initializes `x`\
    \ to `5` and `y` to `10`:\n\n```java\nint x = 5, y = 10;\n```\n\n![Warning](images/warning.png)\
    \ When you declare two class or instance variables in a single statement but use\
    \ only one initializer, you can mistakenly think that the initializer applies\
    \ to both variables. Consider this statement:\n\n`static int x, y = 5;`\n\nHere\
