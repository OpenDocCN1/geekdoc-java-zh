    ## Formatting Numbers


    In many cases, you want to format your numbers before you print them — to add
    commas to large values and limit the number of decimal places printed, for example.
    Or, if a number represents a monetary amount, you may want to add a dollar sign
    (or whatever currency symbol is appropriate for your locale). To do that, you
    can use the `NumberFormat` class. [Table 5-6](#c05.xhtml_c05-tbl-0006) lists the
    `NumberFormat` class methods.


    The procedure for using the `NumberFormat` class to format numbers takes a little
    getting used to. First, you must call one of the static `get`*`Xxx`*`Instance`
    methods to create a `NumberFormat` object that can format numbers in a particular
    way. Then, if you want, you can call the `setMinimumFractionDigits` or `setMaximumFractionDigits`
    method to set the number of decimal digits to be displayed. Finally, you call
    that object’s `format` method to actually format a number.


    Note that the `NumberFormat` class is in the `java.text` package, so you must
    include the following `import` statement at the beginning of any class that uses
    `NumberFormat`:


    `import java.text.NumberFormat;`


    | **Method** | **Explanation** |


    | --- | --- |


    | `getCurrencyInstance()` | A static method that returns a `NumberFormat` object
    that formats currency values |


    | `getPercentInstance()` | A static method that returns a `NumberFormat` object
    that formats percentages |


    | `getNumberInstance()` | A static method that returns a `NumberFormat` object
    that formats basic numbers |


    | `format(number)` | Returns a string that contains the formatted number |


    | `setMinimumFractionDigits(int)` | Sets the minimum number of digits to display
    to the right of the decimal point |


    | `setMaximumFractionDigits(int)` | Sets the maximum number of digits to display
    to the right of the decimal point |


    [TABLE 5-6](#c05.xhtml_rc05-tbl-0006) Methods of the NumberFormat Class


    Here’s an example that uses the `NumberFormat` class to format a `double` value
    as currency:


    `double salesTax = 2.426;`


    `NumberFormat cf = NumberFormat.getCurrencyInstance();`


    `System.out.println(cf.format(salesTax));`


    When you run this code, the following line is printed to the console:


    `$2.43`


    Note that the currency format rounds the value from `2.426` to `2.43`.


    Here’s an example that formats a number by using the general number format, with
    exactly three decimal places:


    `double x = 19923.3288;`


    `NumberFormat nf = NumberFormat.getNumberInstance();`


    `nf.setMinimumFractionDigits(3);`


    `nf.setMaximumFractionDigits(3);`


    `System.out.println(nf.format(x));`


    When you run this code, the following line is printed:


    `19,923.329`


    Here the number is formatted with a comma and the value is rounded to three places.


    Here’s an example that uses the percentage format:


    `double grade = .92;`


    `NumberFormat pf = NumberFormat.getPercentInstance();`


    `System.out.println(pf.format(grade));`


    When you run this code, the following line is printed:


    `92%`


    Chapter 6


    # Making Choices


    IN THIS CHAPTER


    ![Bullet](images/check.png) **Boring into Boolean expressions for fun and profit**


    ![Bullet](images/check.png) **Focusing on your basic, run-of-the-mill `if` statement**


    ![Bullet](images/check.png) **Looking at `else` clauses and `else-if` statements**


    ![Bullet](images/check.png) **Considering logical operators**


    ![Bullet](images/check.png) **Using the `switch` statement**


    So far in this book, all the programs have run straight through from start to
    finish without making any decisions along the way. In this chapter, you discover
    two Java statements that let you create some variety in your programs. The `if`
    statement lets you execute a statement or a block of statements only if some conditional
    test turns out to be true. And the `switch` statement lets you execute one of
    several blocks of statements depending on the value of an integer variable.


    ## Using Simple Boolean Expressions


    All `if` statements, as well as several of the other control statements that we
    describe in [Chapter 7](#c07.xhtml) (`while`, `do`, and `for`), use Boolean expressions
    to determine whether to execute or skip a statement (or a block of statements).
    A *Boolean expression* is a Java expression that, when evaluated, returns a *Boolean
    value:*`true` or `false`.


    As you discover later in this chapter, Boolean expressions can be very complicated.
    Most of the time, however, you use simple expressions that compare the value of
    a variable with the value of some other variable, a literal, or perhaps a simple
    arithmetic expression. This comparison uses one of the *relational operators*
    listed in [Table 6-1](#c06.xhtml_c06-tbl-0001). All these operators are *binary
    operators,* which means that they work on two operands.


    | **Operator** | **Description** |


    | --- | --- |


    | `==` | Returns `true` if the expression on the left evaluates to the same value
    as the expression on the right |


    | `!=` | Returns `true` if the expression on the left does not evaluate to the
    same value as the expression on the right |


    | `<` | Returns `true` if the expression on the left evaluates to a value that
    is less than the value of the expression on the right |


    | `<=` | Returns `true` if the expression on the left evaluates to a value that
    is less than or equal to the expression on the right |


    | `>` | Returns `true` if the expression on the left evaluates to a value that
    is greater than the value of the expression on the right |


    | `>=` | Returns `true` if the expression on the left evaluates to a value that
    is greater than or equal to the expression on the right |


    [TABLE 6-1](#c06.xhtml_rc06-tbl-0001) Relational Operators


    A basic Java Boolean expression has this form:


    *`expression relational-operator expression`*'
