    A variable that is both final and static is called a `constant`. Constants are
    often used for values that are universally the same, such as the number of days
    in June or the atomic weight of iridium. To create a constant, add `static final`
    to the declaration, as follows:


    ```java

    static final int WEEKDAYS = 5;

    ```


    ![Tip](images/tip.png) Although it isn’t required, using all capital letters for
    `final` variable names is common. When you do so, you can easily spot the use
    of constants in your programs.


    In addition to values that are universally the same, constants are useful for
    values that are used in several places throughout a program and that don’t change
    during the course of the program. Suppose that you’re writing a game that features
    bouncing balls, and you want the balls always to have a radius of 6 pixels. This
    program probably needs to use the ball diameter in several places — to draw the
    ball onscreen, to determine whether the ball has hit a wall, to determine whether
    the ball has hit another ball, and so on. Rather than just specify `6` whenever
    you need the ball’s radius, you can set up a class constant named `BALL_RADIUS`,
    like this:


    ```java

    static final int BALL_RADIUS = 6;

    ```


    Using a constant has two advantages:


    *   If you decide later that the radius of the balls should be `7`, you make the
    change in just one place: the initializer for the `BALL_RADIUS` constant.

    *   The constant helps document the inner workings of your program. The operation
    of a complicated calculation that uses the ball’s radius is easier to understand
    if it specifies `BALL_RADIUS` rather than `6`, for example.


    ## Working with Primitive Data Types


    The term `data type` refers to the type of data that can be stored in a variable.
    Java is sometimes called a `strongly typed` language because when you declare
    a variable, you must specify the variable’s type. Then the compiler ensures that
    you don’t try to assign data of the wrong type to the variable. The following
    example code generates a compiler error:


    ```java

    int x;

    x = 3.1415;

    ```


    Because `x` is declared as a variable of type `int` (which holds whole numbers),
    you can’t assign the value `3.1415` to it.


    ![Remember](images/remember.png) Java makes an important distinction between primitive
    types and reference types.


    *   **Primitive types** are the data types defined by the language itself.

    *   **Reference types** are types defined by classes in the Java application programming
    interface (API) or by classes you create rather than by the language itself.


    A key difference between a primitive type and a reference type is that the memory
    location associated with a primitive-type variable contains the actual value of
    the variable. As a result, primitive types are sometimes called `value types`.
    By contrast, the memory location associated with a reference-type variable contains
    an address (called a `pointer`) that indicates the memory location of the actual
    object. We explain reference types more fully in the section “[Using reference
    types](#c04.xhtml_c04-sec-0017)`, later in this chapter, so don’t worry if this
    explanation doesn’t make sense just yet.


    Java defines a total of eight primitive types, listed in [Table 4-1](#c04.xhtml_c04-tbl-0001).
    Of the eight primitive types, six are for numbers, one is for characters, and
    one is for true/false values.


    | **Type** | **Explanation** |

    | --- | --- |

    | `int` | A 32-bit (4-byte) integer value |

    | `byte` | An 8-bit (1-byte) integer value |

    | `short` | A 16-bit (2-byte) integer value |

    | `long` | A 64-bit (8-byte) integer value |

    | `float` | A 32-bit (4-byte) floating-point value |

    | `double` | A 64-bit (8-byte) floating-point value |

    | `char` | A 16-bit character using the Unicode encoding scheme |

    | `boolean` | A `true` or `false` value |


    [TABLE 4-1](#c04.xhtml_rc04-tbl-0001) Java''s Primitive Types


    ### Integer types


    An `integer` is a whole number — that is, a number with no fractional or decimal
    portion. Java has four integer types, which you can use to store numbers of varying
    sizes. The most commonly used integer type is `int`. This type uses 4 bytes to
    store an integer value that can range from about negative 2 billion to positive
    2 billion.


    If you’re writing the application that counts how many hamburgers McDonald’s has
    sold, an `int` variable may not be big enough. In that case, you can use a `long`
    integer instead. `long` is a 64-bit integer that can hold numbers ranging from
    about negative 9,000 trillion to positive 9,000 trillion. (That’s a big number,
    even by federal deficit standards.)


    In some cases, you may not need integers as large as the standard `int` type provides.
    For those cases, Java provides two smaller integer types. The `short` type represents
    a two-byte integer, which can hold numbers from –32,768 to +32,767, and the `byte`
    type defines a single-byte integer that can range from –128 to +127.


    Although the `short` and `byte` types are smaller than `int`, they are useful
    when memory is constrained. However, in most cases, `int` is sufficient.


    ### Floating-point types


    `Floating-point` numbers are numbers that have fractional parts (usually expressed
    with a decimal point), such as 19.95 or 3.1415. Java has two primitive types for
    floating-point: `float`, which uses 4 bytes, and `double`, which uses 8 bytes.
    In almost all cases, you should use the `double` type whenever you need fractional
    values.


    The `precision` of a floating-point value indicates how many significant digits
    it can have following its decimal point. The precision of a `float` type is only
    about six or seven digits, which isn’t sufficient for many types of calculations.


    By contrast, double variables have a precision of about 15 digits, which is enough
    for most purposes. When you use a floating-point literal, we suggest you always
    include a decimal point, like this:


    ```java

    double period = 99.0;

    ```


    That avoids the confusion of assigning what looks like an integer to a floating-point
    variable. If you do use a decimal point in a numeric literal, Java assumes the
    literal is a `double`. Unfortunately, Java can’t automatically convert a double
    to a float, because a float is smaller. Thus, the following won’t compile:


    ```java

    float period = 99.0; // Does not compile

    ```


    To force a numeric literal to be a `float` rather than a `double`, add the letter
    `F` to the end of the number, like this:


    ```java

    float period = 99.0F;

    ```


    If you’re using a mix of `float` and `double` types in your program, you may also
    want to explicitly designate your double literals as such by using a `D` suffix,
    like this:


    ```java

    float value1 = 199.33F;

    double value2 = 200495.995D;

    ```


    If you omit the suffix, `D` is assumed. As a result, you can usually omit the
    `D` suffix for `double` literals.

