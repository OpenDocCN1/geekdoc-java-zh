    \n# Working with TextPad\n\nIN THIS CHAPTER\n\n![Bullet](images/check.png) **Acquiring\
    \ TextPad**\n\n![Bullet](images/check.png) **Using TextPad to edit source files**\n\
    \n![Bullet](images/check.png) **Compiling Java programs**\n\n![Bullet](images/check.png)\
    \ **Running Java programs**\n\nTextPad is an inexpensive ($27) text editor that\
    \ you can integrate with the Java Development Kit (JDK) to simplify the task of\
    \ coding, compiling, and running Java programs. It isn’t a true integrated development\
    \ environment (IDE), as it lacks features such as integrated debugging, code generators,\
    \ and drag-and-drop tools for creating graphical user interfaces.\n\nTextPad is\
    \ a popular tool for developing Java programs because of its simplicity and speed.\
    \ It’s ideal for learning Java because it doesn’t generate any code for you. Writing\
    \ every line of code yourself may seem like a bother, but the exercise pays off\
    \ in the long run because you have a better understanding of how Java works.\n\
    \n## Downloading and Installing TextPad\n\nYou can download a free evaluation\
    \ version of TextPad from Helios Software Systems at [`www.textpad.com`](https://www.textpad.com/).\
    \ You can use the evaluation version free of charge, but if you decide to keep\
    \ the program, you must pay for it. (Helios accepts credit card payment online.)\n\
    \nIf the Java JDK is already installed on your computer when you install TextPad,\
    \ TextPad automatically configures itself to compile and run Java programs. If\
    \ you install the JDK after you install TextPad, you need to configure TextPad\
    \ for Java by following these steps:\n\n1.  **Choose Configure   ⇒   Preferences\
    \ to open the Preferences dialog box.**\n\n2.  **Click Tools in the tree that\
    \ appears on the left side of the dialog box.**\n\n3.  **Click the Add button\
    \ to reveal a drop-down list of options and then click Java SDK Commands.**\n\n\
    4.  **Click OK.**\n\n    The commands you need to compile and run Java programs\
    \ are added to TextPad’s Tools menu.\n\n[Figure 2-1](#c02.xhtml_c02-fig-0001)\
    \ shows how the Preferences dialog box appears when the Java tools are installed.\
    \ As you can see, the Tools item in the tree on the left side of the dialog box\
    \ includes three Java tools: Compile Java, Run Java Application, and Run Java\
    \ Applet. (The Run Java Applet tool is obsolete, so you can safely ignore it.)\n\
    \n![Screenshot of a computer interface displaying a dialog box titled “Tools.”\
    \ The dialog box has two tabs at the top: “Preferences” and “Tools.” The active\
    \ tab is “Tools,” which shows options such as “Compile Java Application” and “Run\
    \ Java Applet,” each with a corresponding checkbox. Below these options, there\
    \ are buttons for “Add” (with an arrow pointing right) and “OK” (with a cancel\
    \ button next to it).](images/9781394296972-fg0201.png)\n\n[FIGURE 2-1:](#c02.xhtml_rc02-fig-0001)\
    \ Configuring tools in TextPad.\n\n![Tip](images/tip.png) If you plan on using\
    \ any preview features in Java, add the `--enable-preview` and `--release 19`\
    \ flags to the command line arguments for the Compile tool. The complete Compile\
    \ tool arguments should look like this:\n\n`--enable-preview --release 19 $File`\n\
    \nThen, add just the `--enable-preview` flag to the Run Java Application arguments\
    \ list; the complete arguments should look like this:\n\n`--enable-preview $BaseName`\n\
    \n![Warning](images/warning.png) Do *not* add the `--release` flag to the Run\
    \ Java Application tool. If you do, the tool won’t be able to start the JVM, because\
    \ `--release` is not a valid flag for the `java` command.\n\n## Editing Source\
    \ Files\n\n[Figure 2-2](#c02.xhtml_c02-fig-0002) shows a Java source file being\
    \ edited in TextPad. If you’ve worked with a Windows text editor before, you’ll\
    \ have no trouble mastering the basics of TextPad. We won’t go over such basic\
    \ procedures as opening and saving files because they’re standard; instead, we\
    \ describe some TextPad features that are useful for editing Java program files.\n\
    \n![Screenshot of a Java programming environment. It shows a simple “HelloJava.java”\
    \ program, which includes the main class “HelloJava” containing a main method\
    \ that outputs the text “Hello, world!” to the console.](images/9781394296972-fg0202.png)\n\
    \n[FIGURE 2-2:](#c02.xhtml_rc02-fig-0002) Editing a Java file in TextPad."
