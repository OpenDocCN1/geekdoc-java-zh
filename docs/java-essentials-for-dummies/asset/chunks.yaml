    既是 `final` 又是 `static` 的变量被称为 `constant`（常量）。常量通常用于在全局范围内保持不变的值，例如六月的天数或铱的原子量。要创建一个常量，请在声明中添加
    `static final`，如下：


    ```java

    static final int WEEKDAYS = 5;

    ```


    ![Tip](img/tip.png) 虽然不是强制要求的，但 `final` 变量名使用全大写字母是常见做法。这样做，你可以轻松地识别程序中对常量的使用。


    除了全局范围内相同的值外，常量对于那些在程序多处使用且在程序运行过程中不会改变的值也非常有用。假设你正在编写一个带有弹跳球的游戏，并且你希望球的半径始终为
    6 像素。这个程序可能需要在多个地方使用球的直径——在屏幕上画出球、判断球是否撞击墙壁、判断球是否撞击了另一个球等。与其在每次需要球的半径时都直接指定 `6`，不如设置一个名为
    `BALL_RADIUS` 的类常量，如下：


    ```java

    static final int BALL_RADIUS = 6;

    ```


    使用常量有两个优势：


    *   如果你以后决定球的半径应该是 `7`，你只需要在一个地方进行更改：即 `BALL_RADIUS` 常量的初始化器。

    *   常量有助于文档化你程序的内部工作机制。例如，一个使用球半径的复杂计算操作如果指定的是 `BALL_RADIUS` 而不是 `6`，将更容易理解。


    ## 原始数据类型操作


    `data type`（数据类型）一词指的是存储在变量中的数据类型。Java 有时被称为 `strongly typed`（强类型）语言，因为当你声明变量时，必须指定变量的类型。然后编译器会确保你不会尝试将错误类型的数据赋值给变量。下面的示例代码会导致编译器错误：


    ```java

    int x;

    x = 3.1415;

    ```


    由于 `x` 被声明为 `int` 类型变量（用于存储整数），你不能给它赋值为 `3.1415`。


    ![Remember](img/remember.png) Java 在原始类型（primitive types）和引用类型（reference types）之间做了了重要的区分。


    *   **Primitive types**（原始类型）是语言本身定义的数据类型。

    *   **Reference types**（引用类型）是由 Java 应用程序编程接口（API）中的类或你创建的类定义的类型，而不是由语言本身定义的。


    原始类型与引用类型的一个关键区别是：与原始类型变量关联的内存位置包含变量的数值。因此，原始类型有时被称为 `value types`（值类型）。相比之下，与引用类型变量关联的内存位置包含一个地址（称为
    `pointer` 指），该地址指向实际对象的内存位置。我们将在本章稍后的“Using reference types”部分更详细地解释引用类型，所以如果现在还不理解这个解释，不要担心。


    Java 定义了共八种原始类型，列在 Table 4-1 中。在这八种原始类型中，有六种用于数字，一种用于字符，一种用于真/假值。


    | **Type** | **Explanation** |

    | --- | --- |

    | `int` | 一个 32 位（4 字节）整数值 |

    | `byte` | 一个 8 位（1 字节）整数值 |

    | `short` | 一个 16 位（2 字节）整数值 |

    | `long` | 一个 64 位（8 字节）整数值 |

    | `float` | 一个 32 位（4 字节）浮点值 |

    | `double` | 一个 64 位（8 字节）浮点值 |

    | `char` | 使用 Unicode 编码方案的 16 位字符 |

    | `boolean` | 一个 `true` 或 `false` 值 |


    TABLE 4-1 Java 的原始类型


    ### 整数类型


    `integer`（整数）是一个整数字——即没有分数或小数部分的数字。Java 有四种整数类型，你可以用它们来存储不同大小的数字。最常用的整数类型是 `int`。该类型使用
    4 字节来存储整数值，范围大约可以从负 20 亿到正 20 亿。


    如果你正在编写一个统计麦当劳卖出了多少个汉堡的应用，一个 `int` 变量可能不够大。在这种情况下，你可以使用 `long` 整数。`long` 是一个 64
    位整数，可以容纳从负 9000 万亿到正 9000 万亿的数字。（即使按照联邦赤字标准，这也是一个巨大的数字。）


    在某些情况下，你不需要标准 `int` 类型那么大的整数。对于这些情况，Java 提供了两种较小的整数类型。`short` 类型表示双字节整数，可以容纳从
    –32,768 到 +32,767 的数字；而 `byte` 类型定义了单字节整数，范围从 –128 到 +127。


    尽管 `short` 和 `byte` 类型比 `int` 小，但在内存受限的情况下它们很有用。然而，在大多数情况下，`int` 是足够的。


    ### 浮点类型


    `Floating-point`（浮点）数字是带有小数部分的（通常用小数点表示）的数字，例如 19.95 或 3.1415。Java 有两种浮点原始类型：`float`
    使用 4 字节，`double` 使用 8 字节。在几乎所有情况下，你需要小数值时都应该使用 `double` 类型。


    浮点值的 `precision`（精度）表示其小数点后可以有多少位有效数字。`float` 类型的精度大约只有六位，这对于许多计算是不够的。


    相比之下，double 的精度约为 15 位，对于大多数用途都是足够的。当你使用浮点字面量时，我们建议始终包含一个小数点，如下：


    ```java

    double period = 99.0;

    ```


    这避免了将看起来像整数的值赋值给浮点变量的混乱。如果你在数字字面量中使用小数点，Java 该字面量是 `double`。遗憾的是，Java 无法自动将 `double`
    转换为 `float`，因为 `float` 更小。因此，以下代码无法编译：


    ```java

    float period = 99.0; // 编译

    ```


    要强制数字字面量为 `float` 而不是 `double`，请在数字末尾添加字母 `F`：


    ```java

    float period = 99.0F;

    ```


    如果你在程序中混合使用 `float` 和 `double` 类型，你可能也想通过使用 `D` 后缀显式指定你的 double 字面量，如下：


    ```java

    float value1 = 199.33F;

    double value2 = 200495.995D;

    ```


    如果你省略了后缀，则假设为 `D`。因此，你通常可以省略 `double` 字面量的 `D` 后缀。


