    \ `switch` 语句。\n\n`switch` 语句的基本形式如下：\n\n```\nswitch (expression)\n{\n    case\
    \ constant:\n        statements;\n        break;\n    [ case constant-2:\n   \
    \     statements;\n        break; ]…\n    [ default:\n        statements;\n  \
    \      break; ]…\n}\n```\n\n表达式必须求值为 `int`、`short`、`byte`、`char`、`String` 或 `enum`。它不能是\
