  trans: "\n\n`HelloApp`: 用于标识此处正在定义的类的 `name`（名称）。像 `public` 和 `class` 等关键字是 Java\
    \ 编程语言定义的单词，而名称是你创建的、用于标识你程序中所使用的各种元素的单词。在这种情况下，`HelloApp` 这个名称标识了此处定义的公类。（尽管\
    \ `name` 是技术上正确的术语，但有时名称也被称为 `identifiers`（标识符）。从技术上讲，名称是标识符的一种，但并不是所有的标识符都是名称。）\n\
    \n2. →2 ` {`: 第 2 行的左括号标记了类 `body`（体）的开始。类体的结束由第 7 行的右括号标记。这些大括号内的所有内容都属于该类。在学习\
    \ Java 时，你会发现它经常使用这些大括号。很快，你右手的第三和第四指就会准确地知道它们在键盘上的位置。\n\n第 3 行到第 7 行定义了 `HelloApp`\
    \ 类的一个名为 `main` 的 `method`（方法）：\n\n1. →3 `public`: 再次使用了 `public` 关键字，这次表示此处声明的方法应该具有公共访问权限。这意味着\
    \ `HelloApp` 类之外的类可以使用它。所有的 Java 程序必须包含一个声明名为 `main` 的公共方法的类。`main` 方法包含了在运行程序时执行的语句。\n\
    \n    `static`: Java 语言要求在声明 `main` 方法时指定 `static`。\n\n    `void`: 在 Java 中，`method`\
    \ 是一个可以计算并返回值的代码单元。例如，你可以创建一个计算销售总额的方法。那么销售总额就是该方法的返回值。如果一个方法不需要返回结果，你必须使用 `void`\
    \ 关键字来表示不返回任何值。由于 Java 要求 `main` 方法不返回值，因此在声明 `main` 方法时必须指定 `void`。\n\n    `main`:\
    \ 最后，这里是为该方法命名的 `identifier`（标识符）。正如我们已经提到的，Java 要求此方法必须命名为 `main`。除了 `main` 方法之外，你可以使用任何你喜欢的名称创建额外的方法。你可以在第\
    \ 8 章中了解如何创建额外的方法。在此之前，程序只包含一个名为 `main` 的方法。\n\n    `(String[] args)`: 噢，天哪。这个\
    \ Java 元素太高级了，现在还无法彻底解释。它被称为 `parameter list`（参数列表），用于向方法传递数据。Java 要求 `main` 方法必须接收单个作为\
    \ `String` 对象数组的参数。按照惯例，该参数命名为 `args`。如果你不知道什么是参数、`String` 或数组，不用担心。你可以在下一章了解\
    \ `String` 是什么，参数在第 8 章；数组在第 12 章。在此期间，请记住，在你所有程序的 `main` 方法声明中，你必须编写代码(`String[]\
    \ args`)。\n\n2. →4 另一个 `{`: 另一组大括号从第 4 行开始到第 6 行结束。这些大括号标记了 `main` 方法体。注意，第 6\
    \ 行的右括号与第 4 行的左括号配对，而第 7 行的右括号与第 2 行的左括号配对。这种配对在 Java 中非常常见。简而言之，每当你遇到右括号时，它都会与最近尚未关闭的左括号配对——即尚未与右括号配对的左括号配对。\n\
    \n3. →5 `System.out.println(\"Hello, World!\");`: 这是整个程序中唯一的语句。它调用属于 `System.out`\
    \ 对象的名为 `println` 的方法。`println` 方法在控制台上显示一行文本。要显示的文本作为 `println` 单词后面括号中的参数传递给\
    \ `println` 方法。在这种情况下，文本是封装在双引号中的字符串字面量 `Hello, World!`。因此，这条语句在控制台上显示文本 `Hello,\
    \ World!`。\n\n    注意，在 Java 中，大多数（但不是所有）语句都必须以分号结束。由于这条语句是程序中唯一的语句，所以这一行是唯一需要分号的行。\n\
    \n4. →6 `}`: 第 6 行包含右括号，标记了由第 4 行括号开始的 `main` 方法体的结束。\n\n5. →7 另一个 `}`: 第 7 行包含右括号，标记了由第\
    \ 2 行括号开始的 `HelloApp` 类体的结束。由于此程序只包含一个类，这一行也标记了程序的结束。\n\n要运行此程序，你必须首先使用记事本或 TextPad\
    \ 等文本编辑器输入它——完全按照代码 3-1 所示所示——保存在名为 `HelloApp.java` 的文本文件中。然后你可以在命令行提示符运行以下命令来编译它（参考第\
    \ 13 章）：\n\n```bash\njavac HelloApp.java\n```\n\n此命令创建一个名为 `HelloApp.class` 的类文件，其中包含为\
    \ `HelloApp` 类编译的 Java 字节码。\n\n你可以通过输入此命令来运行程序（再次检查第 13 章）：\n\n```bash\njava HelloApp\n\
    ```\n\n现在你已经看到了 Java 程序的样貌，你可以更好地理解它具体做了什么。本章的其余部分将更详细描述 Java 语言的一些基本元素。\n\n##\
    \ 处理关键字\n\n`keyword`（关键字）是 Java 编程语言定义的具有特殊含义的单词。之前的程序使用了四个关键字：`public`、`class`、`static`\
    \ 和 `void`。Java 一共有 53 个关键字。它们按字母顺序列在表 3-1 中。\n\n和 Java 中的其他内容一样，关键字对大小写敏感。因此，如果你输入\
    \ `If` 而不是 `if`，或者输入 `For` 而不是 `for`，编译器会对你的错误报错。由于 Visual Basic 关键字以大字母开头，你会经常犯这种错误。\n\
    \n"
