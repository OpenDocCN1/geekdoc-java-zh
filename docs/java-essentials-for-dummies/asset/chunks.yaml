    \n`javax.swing.JOptionPane.showMessageDialog(null,`\n\n`\"Hello, World!\", \"\
    Greeter\",`\n\n`javax.swing.JOptionPane.INFORMATION_MESSAGE);`\n\nIn other words,\
    \ you’d have to specify `javax.swing.JOptionPane` instead of just `JOptionPane`\
    \ whenever you referred to this class.\n\n![Tip](images/tip.png) Here are some\
    \ additional rules for working with `import` statements:\n\n*   `import` statements\
    \ must appear at the beginning of the class file, before any class declarations.\n\
    \n*   You can include as many `import` statements as are necessary to import all\
    \ the classes used by your program.\n\n*   You can import all the classes in a\
    \ particular package by listing the package name followed by an asterisk wildcard,\
    \ like this:\n\n    `import javax.swing.*;`\n\n*   Because many programs use the\
    \ classes that are contained in the `java.lang` package, you don’t have to import\
    \ that package. Instead, those classes are automatically available to all programs.\
    \ The `System` class is defined in the `java.lang` package. As a result, you don’t\
    \ have to provide an `import` statement to use this class.\n\nChapter 4\n\n# Working\
    \ with Variables and Data Types\n\nIN THIS CHAPTER\n\n![Bullet](images/check.png)\
    \ **Creating proper variable declarations**\n\n![Bullet](images/check.png) **Discovering\
    \ the difference between primitive and reference types**\n\n![Bullet](images/check.png)\
    \ **Looking at Java’s built-in data types**\n\n![Bullet](images/check.png) **Introducing\
    \ strings**\n\nIn this chapter, you find out the basics of working with variables\
    \ in Java. Variables are the key to making Java programs general purpose. Variables\
    \ are also the key to creating programs that can perform calculations. Suppose\
    \ that you want to create a program that calculates the area of a circle, given\
    \ the circle’s radius. Such a program uses two variables: one to represent the\
    \ radius of the circle and the other to represent the circle’s area. The program\
    \ asks the user to enter a value for the first variable. Then it calculates the\
    \ value of the second variable.\n\n## Declaring Variables\n\nIn Java, you must\
    \ explicitly declare all variables before using them. This rule is in contrast\
    \ to some languages — most notably Python, which lets you use variables that haven’t\
    \ been explicitly declared.\n\n![Warning](images/warning.png) Allowing you to\
    \ use variables that you haven’t explicitly declared might seem a pretty good\
    \ idea at first glance, but it’s a common source of bugs that result from misspelled\
    \ variable names. Java requires that you explicitly declare variables so that\
    \ if you misspell a variable name, the compiler can detect your mistake and display\
    \ a compiler error.\n\nThe basic form of a variable declaration is this:\n\n*`type\
    \ name`*`;`\n\nHere are some examples:\n\n`int x;`\n\n`String lastName;`\n\n`double\
    \ radius;`\n\nIn these examples, variables named `x`, `lastName`, and `radius`\
    \ are declared. The `x` variable holds integer values, the `lastName` variable\
    \ holds `String` values, and the `radius` variable holds double values. For more\
    \ information about what these types mean, see the section “[Working with Primitive\
    \ Data Types](#c04.xhtml_c04-sec-0011)” later in this chapter. Until then, just\
    \ realize that `int` variables can hold whole numbers (such as `5`, `1,340`, or\
    \ `-34`), `double` variables can hold numbers with fractional parts (such as `0.5`,\
    \ `99.97`, or `3.1415`), and `String` variables can hold text values (such as\
    \ `\"Hello, World!\"` or `\"Jason P. Finch\"`).\n\n![Tip](images/tip.png) Notice\
    \ that variable declarations end with semicolons. That’s because a variable declaration\
    \ is itself a type of statement.\n\n![Remember](images/remember.png) Variable\
    \ names follow the same rules as other Java identifiers, as we describe in [Chapter\
    \ 3](#c03.xhtml), so see that chapter for details. In short, a variable name can\
    \ be any combination of letters, numerals, or underscores and dollar signs but\
    \ must start with a letter, an underscore (`_`), or a dollar sign (`$`). Most\
    \ programmers prefer to start variable names with lowercase letters and capitalize\
    \ the first letter of individual words within the name. `firstName` and `salesTaxRate`,\
    \ for example, are typical variable names. (As we mention in the preceding chapter,\
    \ this is called *camel case* because the capital letters in the middle of the\
    \ names look like humps on the back of a camel.)\n\n### Declaring two or more\
    \ variables in one statement\n\nYou can declare two or more variables of the same\
    \ type in a single statement by separating the variable names with commas. For\
    \ example:\n\n`int x, y, z;`\n\nHere three variables of type `int` are declared,\
    \ using the names `x`, `y`, and `z`.\n\n![Tip](images/tip.png) As a rule, we suggest\
    \ that you avoid declaring multiple variables in a single statement. Your code\
    \ is easier to read and maintain if you give each variable a separate declaration.\n\
    \n### Declaring class variables\n\nA *class variable* is a variable that any method\
    \ in a class can access, including static methods such as `main`. When declaring\
    \ a class variable, you have two basic rules to follow:\n\n*   You must place\
    \ the declaration within the body of the class but not within any of the class\
    \ methods.\n\n*   You must include the word `static` in the declaration. The word\
    \ `static` comes before the variable type.\n\n![Tip](images/tip.png) Class variables\
    \ are often called *static variables.* The key distinction between a static variable\
    \ and an instance variable, which we cover in the next section, is that the value\
    \ of a static variable is the same for all instances of the class. In contrast,\
    \ each instance of a class has distinct values for its instance variables.\n\n\
    The following program shows the proper way to declare a class variable named `helloMessage`:\n\
    \n`public class HelloApp`\n\n`{`\n\n`static String helloMessage;`\n\n`public static\
    \ void main(String[] args)`\n\n`{`\n\n`helloMessage = \"Hello, World!\";`\n\n\
    `System.out.println(helloMessage);`\n\n`}`\n\n`}`\n\nAs you can see, the declaration\
    \ includes the word `static` and is placed within the `HelloApp` class body but\
    \ not within the body of the `main` method."
