    ### Using reference types


    In [Chapter 10](#c10.xhtml), you’re introduced to some of the basic concepts of
    object-oriented programming. In particular, you see how all Java programs are
    made up of one or more classes, and how to use classes to create objects. In this
    section, we show how you can create variables that work with objects created from
    classes.


    To start, a *reference type* is a type that’s based on a class rather than on
    one of the primitive types that are built into the Java language. A reference
    type can be based on a class that’s provided as part of the Java API class library
    or on a class that you write yourself. Either way, when you create an object from
    a class, Java allocates however much memory the object requires to store the object.
    Then, if you assign the object to a variable, the variable is actually assigned
    a *reference* to the object, not the object itself. This reference is the address
    of the memory location where the object is stored.


    Suppose that you’re writing a game program that involves balls, and you create
    a class named `Ball` that defines the behavior of a ball. To declare a variable
    that can refer to a `Ball` object, you use a statement like this:


    `Ball b;`


    Here, the variable `b` is a variable of type `Ball`.


    To create a new instance of an object from a class, use the `new` keyword along
    with the class name. This second reference to the class name is actually a call
    to a special routine of the class called a *constructor.* The constructor is responsible
    for initializing the new object. Here’s a statement that declares a variable of
    type `Ball`, calls the `Ball` class constructor to create a new `Ball` object,
    and assigns a reference to the `Ball` object to the variable:


    `Ball b = new Ball();`


    ![Remember](images/remember.png) One of the key concepts in working with reference
    types is the fact that a variable of a particular type doesn’t actually contain
    an object of that type. Instead, it contains a reference to an object of the correct
    type. An important side effect is that two variables can refer to the same object.


    Consider these statements:


    `Ball b1 = new Ball();`


    `Ball b2 = b1;`


    Here we’ve declared two `Ball` variables, named `b1` and `b2`, but we’ve created
    only one `Ball` object. In the first statement, the `Ball` object is created,
    and `b1` is assigned a reference to it. Then, in the second statement, the variable
    `b2` is assigned a reference to the same object that’s referenced by `b1`. As
    a result, both `b1` and `b2` refer to the same `Ball` object.


    If you use one of these variables to change some aspect of the ball, the change
    is visible to the ball no matter which variable you use. Suppose that the `Ball`
    class has a method called `setSpeed` that lets you set the speed of the ball to
    any `int` value and a `getSpeed` method that returns an integer value that reflects
    the ball’s current speed. Now consider these statements:


    `b1.setSpeed(50);`


    `b2.setSpeed(100);`


    `int speed = b1.getSpeed();`


    When these statements complete, is the value of the `speed` variable `50` or `100`?
    The correct answer is `100`. Because `b1` and `b2` refer to the same `Ball` object,
    changing the speed by using `b2` affects `b1` as well.


    This is one of the most confusing aspects of programming with an object-oriented
    language such as Java, so don’t feel bad if you get tripped up from time to time.


    ## Working with Strings


    A *String* is a sequence of text characters, such as the message `"Hello, World!"`
    displayed by the `HelloApp` program illustrated in this chapter and the preceding
    chapter. In Java, strings are an interesting breed. Java doesn’t define strings
    as a primitive type. Instead, strings are a *reference type* defined by the Java
    API `String` class. The Java language does have some built-in features for working
    with strings. In some cases, these features make strings appear to be primitive
    types rather than reference types.'
