    We could use a raise… .


    Oh, *arrays.* Sorry.


    Arrays are an important aspect of any programming language, and Java is no exception.
    In this chapter, you discover just about everything you need to know about using
    arrays. We cover run-of-the-mill one-dimensional arrays; multidimensional arrays;
    and two classes that are used to work with arrays, named `Array` and `Arrays`.


    ## Understanding Arrays


    An *array* is a set of variables that is referenced by using a single variable
    name combined with an index number. Each item of an array is called an *element.*
    All the elements in an array must be of the same type. Thus the array itself has
    a type that specifies what kind of elements it can contain. An `int` array can
    contain `int` values, for example, and a `String` array can contain strings.'
