    ## About the Authors


    **Doug Lowe:** Doug has been writing computer programming books since the guys
    who invented Java were in high school. He’s written books on COBOL, FORTRAN, ASP.NET,
    Visual Basic, IBM mainframe computers, midrange systems, PCs, web programming,
    and probably a few he’s long since forgotten about. He’s the author of more than
    40 *For Dummies* books, including *Networking For Dummies,* 12th Edition; *Networking
    All-in-One For Dummies,* 8th Edition; *PowerPoint For Dummies,* Office 2021 Edition;
    and *Electronics All-in-One For Dummies,* 3rd Edition (all published by Wiley).
    He lives in that sunny all-American city Fresno, California, where the motto is
    “Please, Let It Rain!”


    **Paul McFedries:** Paul is a technical writer who spends his days writing books
    just like the one you’re holding in your hands. In fact, Paul has written more
    than 100 such books that have sold over four million copies worldwide. Paul’s
    books include *HTML and CSS Essentials For Dummies* and *JavaScript Essentials
    For Dummies.* Paul invites everyone to drop by his personal website at [`https://paulmcfedries.com`](https://paulmcfedries.com/),
    or to follow him on X ([`www.x.com/paulmcf`](http://www.x.com/paulmcf)) or Facebook
    ([`www.facebook.com/PaulMcFedries`](https://www.facebook.com/PaulMcFedries)).


    ## Dedication


    **Doug:** To my beautiful wife, Kristen Gearhart.


    **Paul:** To Karen, my lobster.


    ## Authors’ Acknowledgments


    Just because our names are the only ones you see on the cover, doesn’t mean this
    book was a two-man show. Far from it. Sure, we did write this book’s text and
    take its screenshots, but those represent only a part of what constitutes a “book.”
    The rest of it is brought to you by the dedication of Wiley’s editing, graphics,
    and production teams, who toiled long and hard to turn our text and images into
    an actual book.


    We offer our heartfelt thanks to everyone at Wiley who made this book possible,
    but we’d like to extend some special-yous to the folks we worked directly: Executive
    Editor `Lindsay Berg` and Editor `Elizabeth Kuball`.


