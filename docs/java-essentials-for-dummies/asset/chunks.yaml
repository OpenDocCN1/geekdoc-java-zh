  trans: "\n\n如果你不想自己费心跟踪索引，可以使用增强型 `for` 循环，让 Java 来帮你处理索引。例如：\n\n```java\nfor (String[]\
    \ team : teams)\n{\n    for (String player : team)\n    {\n        System.out.println(player);\n\
    \        System.out.println();\n    }\n}\n```\n\n在这里，第一个增强 `for` 语句指定变量 `team`\
    \ 的类型为 `String[]`。结果是，循环的每个周期都会将 `team` 设置为主数组 `teams` 中的其中一个子数组。然后，第二个增强 `for`\
    \ 循环会访问每个子数组中的单独字符串。\n\n# 第 13 章 让 Java 编码更简单的十种技巧\n\n### 本章内容概要\n\n- 从命令行编译和运行\
    \ Java 程序\n- 从用户处获取输入\n- 学习更多 Java 运算符\n- 字符串比较、嵌套循环及更多\n\nJava 是一个庞大且繁杂的语言，我们在之前的章节中已经力求展现它的全貌。但若要对\
    \ Java 提供一个全面的介绍，那将是一本比这本书大十倍的书，而且谁有时间或耐心去读这样的一部巨著呢？这本书的目标仅仅是给你提供 Java 的核心内容，现在我们已经非常接近这个目标了。剩下的就是带你学习一些技巧，这些技巧会让你的\
    \ Java 编码过程更轻松，让你的 Java 程序更高效。\n\n## 从命令行编译 Java 程序\n\n你可以通过使用 `javac` 命令从命令提示符中编译程序。然而，在此之前，你需要一个要编译的程序。按照以下步骤操作：\n\
    \n1. 使用任何文本编辑器（记事本即可），在文件中输入以下文本，并将其保存为 `HelloApp.java`：\n\n```java\npublic class\
    \ HelloApp\n{\n    public static void main(String[] args)\n    {\n        System.out.println(\"\
    Hello, World!\");\n    }\n}\n```\n\n2. 将文件保存到你喜欢的任何目录。\n\n3. 打开命令提示符，使用 `cd` 命令切换到保存程序文件的目录，然后输入命令\
    \ `javac HelloApp.java`。\n\n该命令编译程序（`javac`）并创建一个名为 `HelloApp.class` 的类文件。\n\n\
    ## 从命令行运行 Java 程序\n\n当你成功编译一个 Java 程序后，可以通过输入 `java` 命令后跟包含 `main` 方法的类名来运行该程序。例如，运行\
    \ `HelloApp` 程序请输入此命令：\n\n```\nC:\\java\\samples>java HelloApp\n```\n\n程序通过显示消息\
    \ \"Hello, World!\" 响应。\n\n## 数值数据的类型转换\n\n你有时需要将一种类型的数值数据转换为另一种类型。你可能需要将一个 `double`\
    \ 值转换为整数，反之亦然。某些转换可以自动完成；另一些则使用一种称为“强制转换”（casting）的技术完成。\n\n要将原始值从一种类型转换为另一种类型，你使用强制转换运算符，它仅仅是将原始类型的名称放在括号中，并放在要转换的值之前。例如：\n\
    \n```java\ndouble pi = 3.1314;\nint iPi;\niPi = (int) pi;\n```\n\n## 使用 System.out\
    \ 打印数据\n\n标准输出是一个旨在屏幕上显示文本输出的流。当你在 Windows 下运行 Java 程序时，会打开一个特殊的控制台窗口，标准输出流连接到该窗口。然后发送到标准输出的任何文本都会显示在该窗口中。每个\
    \ Java 程序通过 `System` 类的 `System.out` 字段都可以使用此流。\n\n`System.out` 是 `PrintStream`\
    \ 类的实例，该类定义了用于将数据写入控制台的 `print` 和 `println` 方法。`print` 和 `println` 方法唯一的区别在于 `println`\
    \ 方法在输出末尾添加一个换行符，因此下一次调用 `print` 或 `println` 的输出将从新行开始。\n\n由于 `print` 方法不会开启新行，当你想要在同一行打印两个或多个项目时，`print`\
    \ 方法非常有用。这里有一个例子：\n\n```java\nint i = 64;\nint j = 23;\nSystem.out.print(i);\n\
    System.out.print(\" and \");\nSystem.out.println(j);\n```\n\n这些行代码产生的控制台输出为：\n\
    `64 and 23`\n\n## 使用 JOptionPane 类获取输入\n\n`JOptionPane` 类显示一个简单的对话框以获取用户的文本输入。然后，你可以使用原始类型包装类的\
    \ `parse` 方法将用户输入的文本转换为相应的原始类型。\n\n尽管 `JOptionPane` 类有很多方法，但获取简单文本输入唯一需要用的是 `showInputDialog`\
    \ 方法。该方法使用单个参数，指定显示在对话框中的提示消息。它返回一个字符串值，然后你可以将其解析为正确的类型。\n\n`JOptionPane` 类是 `javax.swing`\
    \ 包的一部分，因此你需要在任何使用该类的程序的开头添加 `import javax.swing.JOptionPane` 语句。\n\n这里是一个使用 `JOptionPane`\
    \ 获取整数的简单程序：\n\n```java\nimport javax.swing.JOptionPane;\npublic class DialogApp\n\
    {\n    public static void main(String[] args)\n    {\n        String s;\n    \
    \    s = JOptionPane.showInputDialog(\"Enter an integer:\");\n        int x =\
    \ Integer.parseInt(s);\n        System.out.println(\"You entered \" + x + \".\"\
    );\n    }\n}\n```\n\n## 使用一元加运算符和减法运算符\n\n一元加和减运算符允许你改变操作数的符号。一元减运算符并不一定让操作数变成负值。相反，它改变操作数现有的任何符号。因此，如果操作数的初始值为正值，一元运算符会将其变为负值。但如果操作数的初始值为负值，一元运算符会将其变为正值。以下示例说明了这一点：\n\
    \n```java\nint a = 5; // a 是 5\nint b = -a; // b 是 -5\nint c = -b; // c 是 +5\n\
    ```\n\n## 使用递增和递减运算符\n\n计算机编程中最常见的操作之一是给变量加 1 或减 1。给变量加 1 称为递增变量。减 1 称为递减变量。递增变量的传统方法是这样的：\n\
    \n```java\na = a + 1;\n```\n\n在这里，计算表达式 `a + 1`，并将结果赋值给变量 `a`。\n\nJava 提供了一种更简单的方法来执行这种计算：递增（`++`）和递减（`--`）运算符。因此，要递增变量\
    \ `a`，你可以写：\n\n```java\na++;\n```\n\n注意可以在赋值语句中使用递增或递减运算符。这里有一个例子：\n\n```java\n\
    int a = 5;\nint b = a--; // b 被设置为 5，a 设置为 4\n```\n\n当执行第二条语句时，先赋值，所以 b 被设置为 5。然后，a\
    \ 减了 1。\n\n## 使用条件运算符\n\nJava 有一种特殊的运算符称为条件运算符，它旨在消除某些情况下对 `if` 语句的需求。使用条件运算符的标准格式如下：\n\
    \n`boolean-expression` `?` `expression-1` `:` `expression-2`\n\n首先计算布尔表达式。如果它的结果为\
    \ `true`，则计算 `expression-1`，该表达式的结果变为整个表达式的结果。如果表达式为 `false`，则计算 `expression-2`，并使用其结果。\n\
    \n假设你想在总销售额小于 $10,000 时给整数变量 `salesTier` 赋值 `0`，在销售额为 $10,000 或更多时赋值为 `1`。你可以通过此语句实现：\n\
    \n```java\nint salesTier = salesTotal < 10000.0 ? 0 : 1;\n```\n\n## 字符串比较\n\n\
    测试字符串是否等于给定值的正确方法是使用 `String` 类的 `equals` 方法：\n\n```java\nif (answer.equals(\"\
    Yes\"))\n    System.out.println(\"The answer is Yes.\");\n```\n\n"
- fmt: "\nThis method actually compares the value of the string object referenced\
    \ by the variable with the string you pass as a parameter and returns a Boolean\
    \ result to indicate whether the strings have the same value.\n\nThe `String`\
    \ class has another method, `equalsIgnoreCase`, that’s also useful for comparing\
    \ strings. It compares strings but ignores case.\n\n## Nesting Your Loops\n\n\
    A `nested loop` is a loop that is completely contained inside another loop. The\
    \ loop that’s inside is called the `inner loop`, and the loop that’s outside is\
    \ called the `outer loop`.\n\nTo demonstrate the basics of nesting, here’s a simple\
    \ little program that uses a pair of nested `for` loops:\n\n```java\npublic class\
    \ NestedLoop\n{\n    public static void main(String[] args)\n    {\n        for(int\
    \ x = 1; x < 10; x++)\n        {\n            for (int y = 1; y < 10; y++)\n \
    \               System.out.print(x + \"-\" + y + \" \");\n            System.out.println();\n\
    \        }\n    }\n}\n```\n\nThis program consists of two `for` loops. The outer\
    \ loop uses `x` as its counter variable, and the inner loop uses `y`. For each\
    \ execution of the outer loop, the inner loop executes 10 times and prints a line\
    \ that shows the value of `x` and `y` for each pass through the inner loop. When\
    \ the inner loop finishes, a call to `System.out.println` with no parameters forces\
    \ a line break, thus starting a new line. Then the outer loop cycles so that the\
    \ next line is printed.\n\nWhen you run this program, the console displays this\
    \ text:\n\n```\n1-1 1-2 1-3 1-4 1-5 1-6 1-7 1-8 1-9\n2-1 2-2 2-3 2-4 2-5 2-6 2-7\
    \ 2-8 2-9\n3-1 3-2 3-3 3-4 3-5 3-6 3-7 3-8 3-9\n4-1 4-2 4-3 4-4 4-5 4-6 4-7 4-8\
