    Because the `public` keyword is used, a file named `HelloApp2.java` must contain
    this class.


    3.  →7 The `main` method is declared, using the same signature as the `main` method
    in the first version of this program ([Listing 3-1](#c03.xhtml_c03-fea-0001)).
    Get used to this form, because *all* Java applications must include a `main` method
    that’s declared in this way.


    4.  →9 The first line in the body of the main method creates a variable named
    `myGreeterObject` that can hold objects created from the `Greeter` class. Then
    it creates a new object using the `Greeter` class and assigns this object to the
    `myGreeterObject` variable.


    5.  →10 The second line in the body of the `main` method calls the `myGreeterObject`
    object’s `sayHello` method. As you’ll see in a moment, this method simply displays
    the message `"Hello, World!"` on the console.


    #### The Greeter class


    The `Greeter` class is shown in [Listing 3-3](#c03.xhtml_c03-fea-0003).


    [LISTING 3-3](#c03.xhtml_rc03-fea-0003) The Greeter Class


    `// This class represents a Greeter object that displays``→1`


    `// a hello message on the console.`


    `public class Greeter``→3`


