    The following sections present just the bare essentials of working with strings
    so that you can incorporate simple strings into your programs.


    ## Declaring and initializing strings


    Strings are declared and initialized much like primitive types. In fact, the only
    difference you may notice at first is that the word `String` is capitalized, unlike
    the keywords for the primitive types, such as `int` and `double`. That’s because
    `String` isn’t a keyword. Instead, it’s the name of the Java API class `String`
    that provides for string objects.


    The following statements define and initialize a string variable:


    ```java

    String s;

    s = "Hello, World!";

    ```


    Here a variable named `s` of type `String` is declared and initialized with the
    `string literal` `"Hello, World!"`. Notice that string literals are enclosed in
    quotation marks, not apostrophes. Apostrophes are used for character literals,
    which are different from string literals.


    Like any variable declaration, a string declaration can include an initializer.
    Thus you can declare and initialize a string variable in one statement, like this:


    ```java

    String s = "Hello, World!";

    ```


    ![Tip](images/tip.png) Class variables and instance variables are automatically
    initialized to empty strings, but local variables aren’t. To initialize a local
    string variable to an empty string, use a statement like this:


    ```java

    String s = "";

    ```


    ## Combining strings


    Combine two strings by using the plus sign (`+`) as a `concatenation operator`.
    (In Java-speak, combining strings is called `concatenation.`) The following statement
    combines the value of two string variables to create a third string:


    ```java

    String hello = "Hello, ";

    String world = "World!";

    String greeting = hello + world;

    ```


    The final value of the `greeting` variable is `"Hello, World!"`.


    ![Tip](images/tip.png) When Java concatenates strings, it doesn’t insert any blank
    spaces between the strings. Thus, if you want to combine two strings and have
    a space appear between them, make sure that the first string ends with a space
    or the second string begins with a space. (In the preceding example, the first
    string ends with a space.)


    Alternatively, you can concatenate a string literal along with the string variables.
    For example:


    ```java

    String hello = "Hello";

    String world = "World!";

    String greeting = hello + ", " + world;

    ```


    Here the comma and the space that appear between the words `Hello` and `World`
    are inserted as a string literal.


    Concatenation is one of the most commonly used string-handling techniques, so
    you see plenty of examples in this book. In fact, we’ve already used concatenation
    once in this chapter. Earlier, we showed you a program that included the following
    line:


    ```java

    System.out.println("The value of i is " + i);

    ```


    Here the `println` method of the `System.out` object prints the string that’s
    created when the literal `"The value of i is "` is concatenated with the value
    of the `i` variable.


    ## Converting primitives to strings


    Because string concatenation lets you combine two or more string values, and because
    primitive types such as `int` and `double` are not string types, you may be wondering
    how the last example in the preceding section can work. In other words, how can
    Java concatenate the string literal `"The value of i is "` with the integer value
    of `i` in this statement?


    ```java

    System.out.println("The value of i is " + i);

    ```


    The answer is that Java automatically converts primitive values to string values
    whenever you use a primitive value in a concatenation.


    ![Warning](images/warning.png) Be careful here: Java can confuse you about when
    the numbers are converted to strings in the course of evaluating the complete
    expression. Consider this admittedly far-fetched example:


    ```java

    int i = 2;

    System.out.println(i + i + " equals four.");

    ```


    This prints the following on the console:


    `4 equals four.`


    Here, the first plus sign indicates the addition of two `int` variables rather
    than concatenation. For the second plus sign, the resulting `int` answer is converted
    to a string and concatenated with `" equals four."`


    ![Tip](images/tip.png) You can explicitly convert a primitive value to a string
    by using the `toString` method of the primitive type’s wrapper class. To convert
    the `int` variable `x` to a string, for example, you use this statement:


    ```java

    String s = Integer.toString(x);

    ```


    In the next chapter, you discover how to use a special class called the `NumberFormat`
    class to convert primitive types to strings while applying various types of formatting
    to the value, such as adding commas, currency symbols, or percentage marks.


    ## Converting strings to primitives


    Converting a primitive value to a string value is pretty easy. Going the other
    way — converting a string value to a primitive — is a little more complex, because
    it doesn’t always work. If a string contains the value `10`, for example, you
    can easily convert it to an integer. But if the string contains `thirty-two`,
    you can’t.


    To convert a string to a primitive type, you use a `parse` method of the appropriate
    wrapper class, as listed in [Table 4-4](#c04.xhtml_c04-tbl-0004). To convert a
    string value to an integer, you use statements like this:


    ```java

    String s = "10";

    int x = Integer.parseInt(s);

    ```


    | **Wrapper** | **parse Method** | **Example** |

    | --- | --- | --- |

    | `Integer` | `parseInt(String)` | `int x = Integer.parseInt("100");` |

    | `Short` | `parseShort(String)` | `short x = Short.parseShort("100");` |

    | `Long` | `parseLong(String)` | `long x = Long.parseLong("100");` |

    | `Byte` | `parseByte(String)` | `byte x = Byte.parseByte("100");` |

    | `Float` | `parseFloat(String)` | `float x = Float.parseFloat("19.95");` |

    | `Double` | `parseDouble(String)` | `double x = Double.parseDouble("19.95");`
    |

    | `Character` | `(none)` | |

    | `Boolean` | `parseBoolean(String)` | `boolean x = Boolean.parseBoolean("true");`
    |

