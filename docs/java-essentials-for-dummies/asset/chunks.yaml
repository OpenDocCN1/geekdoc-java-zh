    The `char` type represents a single character from the Unicode character set.
    It’s important to keep in mind that a character is not the same as a `String`;
    you find out about strings later in this chapter, in the section “[Working with
    Strings](#c04.xhtml_c04-sec-0018).” For now, just realize that a `char` variable
    can store just one character, not a sequence of characters, as a `String` can.


    To assign a value to a `char` variable, you use a character literal, which is
    always enclosed in apostrophes rather than quotes. Here’s an example:


    ```java

    char code = ''X'';

    ```


    Here the character `X` is assigned to the variable named `code`.


    The following statement won’t compile:


    ```java

    char code = "X"; // error -- should use apostrophes, not quotes

    ```

    ```


    That’s because quotation marks are used to mark `Strings`, not character constants.


    You can also assign an integer value from 0 to 255 to a `char` variable, like
    this:


    ```java

    char cr = 013;

    ```


    Here, the decimal value 13, which represents a carriage return, is assigned to
    the variable named `cr`.


    Java uses a 16-bit fixed-length encoding scheme known as `UTF-16`, which is the
    most commonly used Unicode encoding scheme. The first 256 characters in the Unicode
    character set are the same as the characters of the ASCII character set, which
    is the most commonly used character set for computers with Western languages.
    (Strictly speaking, UTF-16 can encode 32-bit characters by using a pair of 16-bit
    sequences. But Java’s `char` type can only handle the 16-bit UTF-16 codes.)


    ![Tip](images/tip.png) For more information about the Unicode character set, see
    the official Unicode website at [`https://home.unicode.org`](https://home.unicode.org/).


    Character literals can also use special escape sequences to represent special
    characters. [Table 4-2](#c04.xhtml_c04-tbl-0002) lists the allowable escape sequences.
    These escape sequences let you create literals for characters that can’t otherwise
    be typed within a character constant.


    | Escape Sequence | Explanation |

    | --- | --- |

    | `\b` | Backspace |

    | `\t` | Horizontal tab |

    | `\n` | Line feed |

    | `\f` | Form feed |

    | `\r` | Carriage return |

    | `\"` | Double quote |

    | `\''` | Single quote |

    | `\\` | Backslash |


    [TABLE 4-2](#c04.xhtml_rc04-tbl-0002) Escape Sequences for Character Constants


    ### The Boolean type


    A Boolean type can have one of two values: `true` or `false`. Booleans are used
    to perform logical operations, most commonly to determine whether some condition
    is true. For example:


    ```java

    boolean enrolled = true;

    boolean credited = false;

    ```


    Here a variable named `enrolled` of type `boolean` is declared and initialized
    to a value of `true`, and another variable named `credited` of type `boolean`
    is declared and initialized to a value of `false`.


    ![Warning](images/warning.png) In some languages, such as C or C++, integer values
    can be treated as Booleans, with `0` equal to `false` and any other value equal
    to `true`. Not so in Java. In Java, you can’t convert between an `integer` type
    and a `boolean` type.


    ### Using wrapper classes


    Every primitive type has a corresponding class defined in the Java API class library.
    This class is sometimes called a wrapper class because it wraps a primitive value
    with the object-oriented equivalent of pretty wrapping paper and a bow to make
    the primitive type look and behave like an object. [Table 4-3](#c04.xhtml_c04-tbl-0003)
    lists the wrapper classes for each of the eight primitive types.


    | Primitive Type | Wrapper Class |

    | --- | --- |

    | `int` | `Integer` |

    | `short` | `Short` |

    | `long` | `Long` |

    | `byte` | `Byte` |

    | `float` | `Float` |

    | `double` | `Double` |

    | `char` | `Character` |

    | `boolean` | `Boolean` |


    [TABLE 4-3](#c04.xhtml_rc04-tbl-0003) Wrapper Classes for the Primitive Types


    As you find out later in this chapter, you can use these wrapper classes to convert
    primitive values to strings, and vice versa.


    ### Using reference types


    In [Chapter 10](#c10.xhtml), you’re introduced to some of the basic concepts of
    object-oriented programming. In particular, you see how all Java programs are
    made up of one or more classes, and how to use classes to create objects. In this
    section, we show how you can create variables that work with objects created from
    classes.


    To start, a reference type is a type that’s based on a class rather than on one
    of the primitive types that are built into the Java language. A reference type
    can be based on a class that’s provided as part of the Java API class library
    or on a class you write yourself. Either way, when you create an object from a
    class, Java allocates however much memory the object requires to store the object.
    Then, if you assign the object to a variable, the variable is actually assigned
    a reference to the object.


    One of the key concepts in working with reference types is the fact that a variable
    of a particular type doesn’t actually contain an object. Instead, it contains
    a reference to it. An important side effect is that two variables can refer to
    the same object. Consider these statements:


    ```java

    Ball b1 = new Ball();

    Ball b2 = b1;

    ```


    Here we’ve declared two `Ball` variables, named `b1` and `b2`, but we’ve created
    only one `Ball` object. In the first statement, the `Ball` object is created,
    and `b1` is assigned a reference to it. Then, in the second statement, the variable
    `b2` is assigned a reference to the same object referenced by `b1`. As a result,
    both `b1` and `b2` refer to the same object.


    If you use one of these variables to change some aspect of the ball, the change
    is visible to the ball no matter which variable you use. Suppose that the `Ball`
    class has a method called `setSpeed` that lets you set the speed of the ball to
    any `int` value and a `getSpeed` method that returns an integer value that reflects
    the ball’s current speed. Now consider these statements:


    ```java

    b1.setSpeed(50);

    b2.setSpeed(100);

    int speed = b1.getSpeed();

    ```


    When these statements complete, is the value of the `speed` variable `50` or `100`?
    The correct answer is `100`. Because `b1` and `b2` refer to the same `Ball` object,
    changing the speed by using `b2` affects `b1` as well.


    ### Working with Strings


    A *String* is a sequence of text characters, such as the message `"Hello, World!"`
    ` displayed by the `HelloApp` program illustrated in this chapter and the preceding
    chapter. In Java, strings are an interesting breed. Java doesn’t define strings
    as a primitive type. Instead, strings are a reference type defined by the Java
    API `String` class. The Java language does have some built-in features for working
    with strings. In some cases, these features make strings appear to be primitive
    types rather than reference types.

