    \ identifier`*`)`\n\n`{`\n\n*`statements executed when exception is thrown`*\n\
    \n`}`\n\n`finally`\n\n`{`\n\n*`statements that are executed whether or not`*\n\
    \n*`exceptions occur`*\n\n`}`\n\n[Listing 9-3](#c09.xhtml_c09-fea-0003) shows\
    \ a contrived but helpful example that demonstrates how to use the `finally` clause.\
    \ In this example, a method called `divideTheseNumbers` tries to divide the numbers\
    \ twice. If the division fails the first time (due to a divide-by-zero exception),\
    \ it tries the division again. Completely irrational, we know. But persistent,\
    \ like a teenager.\n\n[LISTING 9-3](#c09.xhtml_rc09-fea-0003) A Program That Uses\
    \ a finally Clause\n\n`public class CrazyWithZeros`\n\n`{`\n\n`public static void\
    \ main(String[] args)`\n\n`{`\n\n`try`\n\n`{`\n\n`int answer = divideTheseNumbers(5,\
    \ 0);``→7`\n\n`}`\n\n`catch (Exception e)``→9`\n\n`{`\n\n`System.out.println(\"\
    Tried twice, \"`\n\n`+ \"still didn't work!\");`\n\n`}`\n\n`}`\n\n`public static\
    \ int divideTheseNumbers(int a, int b)``→16`\n\n`{`\n\n`int c;`\n\n`try`\n\n`{`\n\
    \n`c = a / b;``→21`\n\n`System.out.println(\"It worked!\");``→22`\n\n`}`\n\n`catch\
    \ (Exception e)`\n\n`{`\n\n`System.out.println(\"Didn't work the first time.\"\
    );``→26`\n\n`c = a / b;``→27`\n\n`System.out.println(\"It worked the second time!\"\
    );``→28`\n\n`}`\n\n`finally`\n\n`{`\n\n`System.out.println(\"Better clean up my\
    \ mess.\");``→32`\n\n`}`\n\n`System.out.println(\"It worked after all.\");``→34`\n\
    \n`return c;``→35`\n\n`}`\n\n`}`\n\nHere’s the console output for the program:\n\
    \n`Didn't work the first time.`\n\n`Better clean up my mess.`\n\n`Tried twice,\
    \ still didn't work!`\n\nThe following paragraphs explain what’s going on, step\
    \ by step:\n\n1.  →7: The main method calls the `divideTheseNumbers` method, passing\
    \ `5` and `0` as the parameters. You already know that this method isn’t going\
    \ to work.\n\n2.  →9: The `catch` clause catches any exceptions thrown by line\
    \ 7.\n\n3.  →16: The `divideTheseNumbers` method divides the two numbers passed\
    \ as parameters.\n\n4.  →21: This line is the first attempt to divide the numbers.\n\
    \n5.  →22: If the first attempt succeeds, this line is executed, and the message\
    \ `\"It worked!\"` is printed. Alas, the division throws an exception, so this\
    \ line never gets executed.\n\n6.  →26: Instead, the `catch` clause catches the\
    \ exception, and the message `\"Didn't work the first time.\"` is displayed. That’s\
    \ the first line in the console output.\n\n7.  →27: The `divideTheseNumbers` method\
    \ stubbornly tries to divide the same two numbers again. This time, no `try` statement\
    \ is there to catch the error.\n\n8.  →28: Because another exception is thrown\
    \ for the second division, however, this line is never executed. Thus you don’t\
    \ see the message `\"It worked the second time!\"` on the console. (If you do,\
    \ you’re in an episode of *The Twilight Zone.*)\n\n9.  →32: This statement in\
    \ the `finally` clause is always executed, no matter what happens. That’s where\
    \ the second line in the console output came from. After the `finally` clause\
    \ executes, the second `ArithmeticException` (which wasn’t caught) is thrown back\
    \ up to the calling method, where it is caught by line 9\\. That’s where the last\
    \ line of the console output came from.\n\n10.  →34: If the division did work,\
    \ this line would be executed after the `try` block ends, and you’d see the message\
    \ `\"It worked after all.\"` on the console.\n\n11.  →35: Then the `return` statement\
    \ would return the result of the division.\n\nChapter 10\n\n# Making Your Own\
    \ Classes\n\nIN THIS CHAPTER\n\n![Bullet](images/check.png) **Creating your own\
    \ class**\n\n![Bullet](images/check.png) **Looking at the pieces of a class declaration**\n\
    \n![Bullet](images/check.png) **Finding out about class fields**\n\n![Bullet](images/check.png)\
    \ **Constructing constructors**\n\nOkay, class, it’s time to learn how to create\
    \ your own classes.\n\nIn this chapter, you discover the basics of creating classes\
    \ in Java. All Java programs use or consist of classes, so you’ve already seen\
    \ many examples of classes. You’ve seen class headers such as `public class GuessingGame`\
    \ and static methods such as `public static void main`. Now, in this chapter,\
    \ we show you how to create programs that have more than one class.\n\n## Declaring\
    \ a Class\n\nAll classes must be defined by a *class declaration* — lines of code\
    \ that provide the name for the class and the body of the class. Here’s the most\
    \ basic form of a class declaration:\n\n`[public] class` *`ClassName`* `{`*`class-body`*`}`\n\
    \nThe `public` keyword indicates that this class is available for use by other\
    \ classes. Although it’s optional, you usually include it in your class declarations.\
    \ After all, the main reason you write class declarations is so other classes\
    \ can create objects from the class you’re defining. (Find out more about using\
    \ the `public` keyword in the section “[Seeing where classes live](#c10.xhtml_c10-sec-0005),”\
    \ later in this chapter.)\n\n### Picking class names\n\nThe `ClassName` is a name\
    \ that provides a name for your class. You can use any legal Java name you want\
    \ to name a class, but the following three guidelines can simplify your life:\n\
    \n*   **Begin the class name with a capital letter.** If the class name consists\
    \ of more than one word, capitalize each word: for example, `Ball`, `RetailCustomer`,\
    \ and `GuessingGame`.\n\n*   **Whenever possible, use nouns for your class names.**\
    \ Classes create objects, and nouns are the words you use to identify objects.\
    \ Thus most class names should be nouns.\n\n*   **Avoid using the name of a Java\
    \ API class.** No rule says that you absolutely have to, but if you create a class\
    \ that has the same name as a Java API class, you have to use fully qualified\
    \ names (such as `java.util.Scanner` rather than just `Scanner`) to tell your\
    \ class apart from the API class with the same name.\n\n    ![Tip](images/tip.png)\
    \ There are thousands of Java API classes, so avoiding them all is pretty hard.\
    \ But at the least, you should avoid commonly used Java class names, as well as\
    \ any API classes that your application is likely to use. Creating a class named\
    \ `String` or `Math`, for example, is just asking for trouble."
