  trans: "\n\n| `|` | 或 (Or) | 二元 | 如果至少有一个操作数评估为 `true`，则返回 `true`。在应用或运算符之前，会先评估两个操作数。\
    \ |\n| `^` | 异或 (Xor) | 二元 | 如果操作数中仅有一个评估为 `true`，则返回 `true`。如果两个操作数评估均为 `true`\
    \ 或均为 `false`，则返回 `false`。 |\n| `&&` | 条件与 (Conditional And) | 二元 | 与 `&` 相同，但如果左操作数返回\
    \ `false`，则返回 `false` 且不评估右操作数。 |\n| `||` | 条件或 (Conditional Or) | 二元 | 与 `|`\
    \ 相同，但如果左操作数返回 `true`，则返回 `true` 且不评估右操作数。 |\n\n## 表 6-2 逻辑运算符\n\n非（Not）运算符反转布尔表达式的值。因此，如果表达式为\
    \ `true`，`Not` 会将其更改为 `false`。如果表达式为 `false`，`Not` 会将其更改为 `true`。\n\n这是一个示例：\n\
    \n```\n!(i == 4)\n```\n\n如果 `i` 是除 4 以外的任何值，该表达式评估为 `true`。如果 `i` 是 `4`，它评估为 `false`。它的工作原理是首先评估表达式\
    \ `(i == 4)`，然后反转该评估的结果。\n\n![Tip](img/tip.png) 不要将非逻辑运算符（`!`）与不等于关系运算符（`!=`）混淆。尽管这些运算符的用法有时相似，但\
    \ `Not` 运算符更通用。我们可以这样写前面的示例：\n\n```\ni != 4\n```\n\n结果是相同的。然而，`Not` 运算符可以应用于任何返回\
    \ `true-false` 结果表达式，而不仅仅是相等性测试。\n\n![Remember](img/remember.png) 你几乎总是必须将 `!`\
    \ 运算符应用的表达式括在括号内。考虑这个表达式：\n\n```\n! i == 4\n```\n\n假设 `i` 是一个整数变量，编译器不允许此表达式，因为看起来你正试图将\
    \ `!` 运算符应用于变量，而不是应用于比较的结果。快速加一组括号就能解决问题：\n\n```\n!(i == 4)\n```\n\n### 使用 `&`\
    \ 和 `&&` 运算符\n\n`&` 和 `&&` 运算符组合两个布尔表达式，只有当两个表达式都为 `true` 时，才返回 `true`。这种操作被称为“与运算”（And\
    \ operation），因为只有当第一个表达式和第二个表达式都为 `true` 时，“与”运算符才会返回 `true`。\n\n假设如果销售班级为 1 且销售总额达到\
    \ $10,000 或更多，销售佣金率应该是 2.5%。你可以使用两个独立的 `if` 语句进行此测试（正如在本章之前做的那样），也可以将测试合并到一个 `if`\
    \ 语句中：\n\n```\nif ((salesClass == 1) & (salesTotal >= 10000.0))\ncommissionRate\
    \ = 0.025;\n```\n\n在这里，表达式 `(salesClass == 1)` 和 `(salesTotal >= 10000.0)` 分别被评估。然后\
    \ `&` 运算符比较结果。如果它们都是 `true`，则 `&` 运算符返回 `true`。如果其中一个为 `false` 或均为 `false`，则 `&`\
    \ 运算符返回 `false`。\n\n![Tip](img/tip.png) 注意我们大量使用括号来明确一个表达式的结束和另一个的开始。使用括号并非总是，但当你使用逻辑运算符时，我们建议始终使用括号来清晰识别正在比较的表达式。\n\
    \n`&&` 运算符与 `&` 运算符类似，但它更利用了你对逻辑的知识。因为 `&` 运算符比较的两个表达式都为 `true`，整个表达式才为 `true`，所以如果第一个表达式返回\
    \ `false`，没有理由评估第二个表达式。`&` 运算符并不知道事实，因此它会在确定结果之前盲目地评估两个表达式。`&&` 运算符足够智能，在知道结果时停止。\n\
    \n因此，几乎总是使用 `&&` 代替 `&`。这里是前面的示例，这次使用 `&&` 进行了智能编码：\n\n```\nif ((salesClass ==\
    \ 1) && (salesTotal >= 10000.0))\ncommissionRate = 0.025;\n```\n\n![Tip](img/tip.png)\
    \ 为什么我们说你应该几乎总是使用 `&&`？因为有时表达式本身具有重要的 side effects。例如，第二个表达式可能涉及一个更新数据库的方法调用，而你希望无论第一个表达式评估为\
    \ `true` 还是 `false`，数据库都得到更新。在这种情况下，你想使用 `&` 代替 `&&` 以确保两个表达式都被评估。\n\n![Warning](img/warning.png)\
    \ 依赖表达式的副作用是有风险的——你几乎总是可以找到更好的代码写法来规避副作用。换句话说，在嵌套在 `if` 语句中的复合表达式中放置重要的数据库更新方法调用可能不是一个好主意。\n\
    \n### 使用 `|` 和 `||` 运算符\n\n`|` 和 `||` 运算符被称为“或运算符”（Or operators），因为如果第一个表达式为 `true`\
    \ 或第二个表达式为 `true`，它们就会返回 `true`。如果两个表达式都为 `true`，它们也会返回 `true`。\n\n假设如果销售班级为 1\
    \ 且销售总额达到 $10,000 或更多，销售佣金率应该是 2.5%。你可以通过两个单独的 `if` 语句来实现这一点：\n\n```\nif (salesClass\
    \ == 1)\ncommissionRate = 0.025;\nif (salesClass == 3)\ncommissionRate = 0.025;\n\
    ```\n\n然而，使用或运算符，你可以这样执行相同的操作：\n\n```\nif (salesTotal < 10000.0) | (salesClass\
    \ == 3)\ncommissionRate = 0.025;\n```\n\n![Tip](img/tip.png) 在大多数情况下，你应该使用条件或运算符（`||`）代替或运算符（`|`），如下：\n\
    \n```\nif (salesTotal < 10000.0) || (salesClass == 3)\ncommissionRate = 0.025;\n\
    ```\n\n与条件与运算符（`&&`）一样，条件或运算符一旦知道结果就会停止。假设销售额为 500。那么不需要评估第二个表达式。因为第一个评估为 `true`，整个表达式为\
    \ `true`。\n\n### 组合逻辑运算符\n\n你可以组合简单的布尔表达式来创建复杂的表达式。例如：\n\n```\nif (salesTotal<1000.0)||((salesTotal<5000.0)\
    \ && (salesClass==1))||((salesTotal <10000.0) && (salesClass == 2))\ncommissionRate\
    \ = 0.0;\n```\n\n你能看出这个 `if` 语句表达式的作用吗？如果以下三个条件中的任何一个为 `true`，它会将佣金设置为零：\n\n*\
    \   销售额小于 $1,000。\n*   销售额小于 $5,000 且销售班级为 1。\n*   销售额小于 $10,000 且销售班级为 2。\n\n\
    在许多情况下，你可以通过不同的缩进各个部分并调整子表达式间距来澄清表达式是如何工作的。这个前面 `if` 语句的版本稍微更容易理解：\n\n```\nif\
    \ (\n    (salesTotal < 1000.0)\n    || ((salesTotal < 5000.0) && (salesClass ==\
    \ 1))\n    || ((salesTotal < 10000.0) && (salesClass == 2))\n)\ncommissionRate\
    \ = 0.0;\n```\n\n然而，要准确判断这个 `if` 语句的作用仍然很困难。在许多情况下，更好的做法是跳过复杂的表达式并编写单独的 `if` 语句：\n\
    \n```\nif (salesTotal < 1000.0)\ncommissionRate = 0.0;\n\nif ((salesTotal < 5000.0)\
    \ && (salesClass == 1))\ncommissionRate = 0.0;\n\nif ((salesTotal < 10000.0) &&\
    \ (salesClass == 2))\ncommissionRate = 0.0;\n```\n"
- fmt: "\n![Warning](images/warning.png) In Java, Boolean expressions can get a little\
    \ complicated when you use more than one logical operator, especially if you mix\
    \ And and Or operators. Consider this expression:\n\n```\nif ( a==1 && b==2 ||\
    \ c==3 )\n```\n\n```\nSystem.out.println(\"It's true!\");\nelse\nSystem.out.println(\"\
    No it isn't!\");\n```\n\nWhat do you suppose this `if` statement does if `a` is\
    \ `5`, `b` is `7`, and `c = 3`? The answer is that the expression evaluates to\
    \ `true`, and `\"It's true!\"` is printed. That’s because Java applies the operators\
    \ from left to right. So the `&&` operator is applied to `a==1` (which is `false`)\
    \ and `b==2` (which is also `false`, but that doesn’t matter because this evaluation\
    \ is skipped). Thus, the `&&` operator returns `false`. Then the `||` operator\
    \ is applied to that `false` result and the result of `c==3`, which is `true`.\
    \ Thus the entire expression returns `true`.\n\n![Tip](images/tip.png) Wouldn’t\
    \ this expression have been clearer if you had used a set of parentheses to clarify\
    \ what the expression does? Consider this example:\n\n```\nif ( ( a==1 && b==2\
    \ ) || c==3 )\n```\n\n```\nSystem.out.println(\"It's true!\");\nelse\nSystem.out.println(\"\
    No it isn't!\");\n```\n\nHere you can clearly see that the `&&` operator is evaluated\
    \ first.\n\n## Using the switch Statement\n\nIn this section, you discover another\
    \ Java tool for decision-making: the `switch` statement. The `switch` statement\
    \ is a pretty limited beast, but it excels at making one particular type of decision:\
    \ choosing one of several actions based on a value stored in an integer variable.\
    \ As it turns out, the need to do just that comes up a lot. You want to keep the\
    \ `switch` statement handy for use when such a need arises.\n\nThe basic form\
    \ of the `switch` statement is this:\n\n```\nswitch (expression)\n{\n    case\
    \ constant:\n        statements;\n        break;\n    [ case constant-2:\n   \
    \     statements;\n        break; ]…\n    [ default:\n        statements;\n  \
    \      break; ]…\n}\n```\n\nThe expression must evaluate to an `int`, `short`,\
    \ `byte`, `char`, `String`, or `enum`. It can’t be a `long` or a floating-point\
    \ type.\n\nYou can code as many case groups as you want or need. Each group begins\
    \ with the word `case`, followed by a constant (usually, a simple numeric or String\
    \ literal) and a colon. Then you code one or more statements that you want executed\
    \ if the value of the `switch` expression equals the constant. The last line of\
    \ each case group is an optional `break` statement, which causes the entire `switch`\
    \ statement to end.\n\nThe `default` group, which is optional, is like a catch-all\
    \ case group. Its statements are executed only if none of the previous case constants\
    \ match the `switch` expression.\n\n![Tip](images/tip.png) Note that the case\
    \ groups are not true blocks marked with braces. Instead, each case group begins\
    \ with the `case` keyword and ends with the `case` keyword that starts the next\
    \ case group. All the case groups together, however, are defined as a block marked\
    \ with a set of braces.\n\n![Warning](images/warning.png) The last statement in\
    \ each case group usually is a `break` statement. A `break` statement causes control\
    \ to skip to the end of the `switch` statement. If you omit the `break` statement,\
    \ control falls through to the next case group. Accidentally leaving out `break`\
    \ statements is the most common cause of trouble with the `switch` statement.\n\
    \nSuppose that you need to set a commission rate based on a sales class represented\
    \ by an integer (1, 2, or 3) according to this table:\n\n| Class | Commission\
    \ Rate |\n| --- | --- |\n| 1 | 2% |\n| 2 | 3.5% |\n| 3 | 5% |\n| Any other value\
    \ | 0% |\n\nYou could do this with the following `switch` statement:\n\n```\n\
    double commissionRate;\nswitch (salesClass)\n{\n    case 1:\n        commissionRate\
    \ = 0.02;\n        break;\n    case 2:\n        commissionRate = 0.035;\n    \
    \    break;\n    case 3:\n        commissionRate = 0.05;\n        break;\n   \
    \ default:\n        commissionRate = 0.0;\n        break;\n}\n```\n\n### Viewing\
    \ an example else-if program\n\nMany applications call for a simple logical selection\
    \ of things to be done depending on some value that controls everything. As we\
    \ describe earlier in this chapter, such things can be handled with big chains\
    \ of `else-if` statements all strung together.\n\nUnfortunately, these things\
    \ can quickly get out of hand. `else if` chains can end up looking like DNA double-helix\
    \ structures or those things that dribble down from the tops of the computer screens\
    \ in *The Matrix,* with hundreds of lines of code that string `else if` after\
    \ `else if`. The `switch` statement provides a much more concise alternative.\n\
    \n[Listing 6-1](#c06.xhtml_c06-fea-0001) The else-if program (Wait, the original\
    \ text link is broken) with hundreds of lines of code that string `else if` after\
    \ `else if`.\n\n```java\nimport java.util.Scanner;\npublic class AVDecoder1\n\
    {\n    static Scanner sc = new Scanner(System.in);\n    public static void main(String[]\
    \ args)\n    {\n        System.out.println(\"Welcome to the Autonomous\\n\\n\"\
    \n            + \"If your vehicle generates \"\n            + \"an error code,\\\
    n\"\n            + \"you can use this program to determine \"\n            + \"\
    the exact\\ncause of the error.\\n\");\n        System.out.print(\"Enter the error\
    \ code: \");\n        int err = sc.nextInt();\n        String msg = \"\";\n  \
    \      if (err==1)\n            msg = \"General error.\\n\"\n            + \"\
    Returning control.\";\n        else if (err==2)\n            msg = \"System Update.\\\
    n\"\n            + \"Pulling over\";\n        else if (err==3)\n            msg\
    \ = \"Vehicle bored.\\n\"\n            + \"Switching to something\";\n       \
    \ else if (err==4)\n            msg = \"Turn signal detected.\\n\"\n         \
    \   + \"Heading for nearest.\";\n        else if (err==5)\n            msg = \"\
    Dodgers game on audio system.\\n\"\n            + \"Switching to Giants.\";\n\
    \        else if (err==6)\n            msg = \"Left turn stuck for more than 10\
    \ miles.\\n\"\n            + \"Vehicle may be too old to drive.\";\n        else\
    \ if (err==7)\n            msg = \"Vehicle has enough and cannot take it anymore.\\\
    n\"\n            + \"Taking for bridge.\";\n        else\n            msg = \"\
    I'm sorry, Dave. I'm afraid I can't do that.\\n\";\n        System.out.println(msg);\n\
    \    }\n}\n```\n\n[Listing 6-1](#c06.xhtml_c06-fea-0001) The else-if program (Wait,\
    \ the original text link is broken) with hundreds of lines of code that string\
    \ `else if` after `else if`.\n\n### Creating a better version of the example\n\
    \nFortunately, Java has a special statement that’s designed just for the kind\
    \ of task represented by the vehicle decoder program: the `switch` statement.\
    \ Specifically, the `switch` statement is useful when you need to select one of\
    \ several alternatives based on the value of an `int`, `char`, `String`, or `enum`\
    \ variable.\n\n![Tip](images/tip.png) An *enum* is a special kind of Java type\
    \ whose value is one of several predefined constants. For example, you may have\
    \ an enum named `TemperatureScale` with constant values `CELCIUS`, `FAHRENHEIT`,\
    \ and `KELVIN`. A variable defined with the `TemperatureScale` type can have one\
    \ of these values.\n\n[Listing 6-2](#c06.xhtml_rc06-0002) shows a version of the\
    \ self-driving car error decoder program that uses a `switch` statement instead\
    \ of a big `else-if` structure. We think you’ll agree that this version of the\
