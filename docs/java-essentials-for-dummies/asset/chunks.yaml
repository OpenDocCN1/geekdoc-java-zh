  trans: "\n在本章中，你将学习如何创建应用程序类中的额外方法。然后，你可以在 `main` 方法中调用这些方法。正如你将看到的，这种技术对于除了最短的\
    \ Java 程序以外的所有程序都非常有用。\n\n## 创建方法的基础\n\n所有方法——包括 `main` 方法——都必须以方法声明开始。这里是方法声明的基本形式，至少对于在本章中讨论的方法类型而言是：\n\
    \n```\npublic static return-type method-name (parameter-list)\n{\n    statements...\n\
    }\n```\n\n接下来的段落逐条说明方法声明的各个部分：\n\n*   `public`：此关键字表示方法的存在应该向世界公开，任何了解你的程序（或更准确地说，了解为你的\
    \ Java 程序定义的类）的 Java 程序都应该使用你的方法。对于你目前在书中正在处理的程序类型，这意义不大，但在第 10 章中它变得更有意义：在那里你将了解到更多关于\
    \ `public` 的含义，并看到一些在各种情况下都有用的 `public` 替代方案。\n\n*   `static`：此关键字声明该方法是一个静态方法，这意味着你可以在不先创建定义它的类的实例的情况下调用它。`main`\
    \ 方法必须始终是静态的。\n*   `return-type`：在 `static` 单词之后的是返回类型，它指示方法在被调用时是否返回一个值，如果是，则该值是什么类型。如果方法不返回值，请指定\
    \ `void`。（我们将在本章稍后的“有返回值的方法”部分中以后讨论更多返回值的方法。）\n\n*   `method-name`：现在是你的方法名。创建方法名的规则与创建变量名的规则相同：你可以使用字母和数字的任意组合，但名称不能以数字开头。此外，它可以包含美元符号（`$`）和下划线字符（`_`）。不允许其他特殊字符。\n\
    \n*   `parameter-list`：你可以通过在方法名后的括号中列出值向方法传递一个或多个值。方法声明中的参数列表让 Java 知道方法应该接收什么类型的参数，并提供名称，以便方法体中的语句像局部变量一样访问这些参数。你将在本章稍后的“带参数的方法”部分发现更多关于参数的知识。\n\
    \    ![Tip](img/tip.png) 如果方法不接受参数，你仍然必须编写参数列表的括号。你只需要让括号为空即可。\n\n*   方法体：方法体由一组用大括号括起来的一个或多个\
    \ Java 语句组成。与 `if`、`while` 和 `for` 等 Java 语句不同，即使方法体只包含一条语句，方法体也要求使用大括号。\n\n好了，以上内容有点抽象。现在，为了一个具体的例子，我们提供一个版本的\
    \ `Hello, World!` 程序，其中消息不是由 `main` 方法显示的，而是由 `main` 方法调用的名为 `sayHello` 的方法显示的：\n\
    \n```\npublic class HelloWorldMethod\n{\n    public static void main(String[]\
    \ args)\n    {\n        sayHello();\n    }\n    public static void sayHello()\n\
    \    {\n        System.out.println(\"Hello, World!\");\n    }\n}\n```\n\n这个程序固然简单，但它说明了\
    \ Java 中创建和使用方法的各种。在这里，`main` 方法中的语句调用了 `sayHello` 方法，而该方法反过来在控制台上显示了一条消息。\n\n\
    ## 有返回值的方法\n\n某些方法执行一些工作，完成后简单地返回。但许多方法在完成工作时需要返回一个值。例如，如果一个方法的目的是执行计算，那么该方法可能会将计算结果返回给调用方法，以便调用方法对该值进行某些操作。你将在接下来的章节中学习如何这样做。\n\
    \n### 声明方法的返回类型\n\n要创建一个返回值的方法，你只需要在方法声明中替换 `void` 关键字，指定方法返回值的类型。这里有一个返回 `int`\
    \ 类型值的方法声明：\n\n```\npublic static int getRandomNumber()\n```\n\n在这里，`getRandomNumber`\
    \ 方法计算一个随机数，并将该数返回给调用者。\n\n![Remember](img/remember.png) 方法的返回可以是 Java 的任何原始返回类型（在第\
    \ 4 章中描述）：\n\n*   `int`\n*   `long`\n*   `float`\n*   `char`\n*   `short`\n* \
    \  `byte`\n*   `double`\n*   `boolean`\n\n或者，返回类型可以是引用类型，包括由 API 定义的类（如 `String`）或你自己创建的类。\n\
    \n### 使用 return 语句返回值\n\n当你在方法声明中指定 `void`以外的返回类型时，方法体必须包含一个 `return` 语句，指定要返回的值。`return`\
    \ 语句的格式如下：\n\n```\nreturn expression;\n```\n\n该表达式求出的值必须与方法声明中列出的类型相同。换句话说，如果方法返回\
    \ `int`，则 `return` 语句中的表达式必须求值为 `int`。\n\n这里有一个确定 1 到 10 之间随机数的程序：\n\n```\npublic\
    \ class RandomNumber\n{\n    public static void main(String[] args)\n    {\n \
    \       int number = getRandomNumber();\n        System.out.println(\"The number\
    \ is \" + number);\n    }\n    public static int getRandomNumber()\n    {\n  \
    \      int num = (int)(Math.random() * 10) + 1;\n        return num;\n    }\n\
    }\n```\n\n在这个程序中，`getRandomNumber` 方法使用 `Math.random` 方法计算随机数。（有关 `Math.random`\
    \ 方法的更多信息，请参阅第 5 章。`return` 语句返回计算出的随机数。\n\n由于 `return` 语句可以指定表达式也可以指定变量，我们也可以这样编写\
    \ `getRandomNumber` 方法：\n\n```\npublic static int getRandomNumber()\n{\n    return\
    \ (int)(Math.random() * 10) + 1;\n}\n```\n\n在这里，`return` 语句包含了计算随机数的表达式。\n\n###\
    \ 使用返回类型\n\n你可以在赋值语句中使用返回类型的方法，例如：\n\n```\nint number = getRandomNumber();\n```\n\
    \n在这里，`getRandomNumber` 方法被调用，它返回的值赋值给变量 `number`。\n\n你还可以在表达式中使用返回类型的方法——例如\n\
    \n```\nint number = getRandomNumber() * 10;\n```\n\n在这里，`getRandomNumber` 方法返回的值乘以\
    \ 10，结果赋值给 `number`。\n\n### 你必须有一个正确的 return 语句\n\n如果一个方法声明了 `void` 以外的返回类型，则它*必须*使用\
    \ `return` 语句返回值。编译器不允许一个没有正确 `return` 语句的方法通过。\n\n如果你的 `return` 语句位于 `if` 语句内部，情况就会变得复杂。有时，编译器会被欺骗并拒绝编译你的程序。为了解释这种情况，我们提供了以下关于多次尝试解决一个本是简单的编程问题的案例。\n\
    \n假设你想创建一个随机数方法，该方法返回 1 到 20 之间的随机数，但从不返回 12（因为你患有“十二恐惧症”——正如《史努奇》中的 Lucy 告诉你的那样——这是对数字\
    \ 12 的恐惧）。你的第一个想法是直接忽略这些 12，如下所示：\n\n```\npublic static int getRandomNumber()\n\
    {\n    int num = (int)(Math.random() * 20) + 1;\n    if (num != 12)\n    return\
    \ num;\n}\n```\n"
- fmt: "\nThe compiler isn’t fooled by your trickery here, however. It knows that\
    \ if the number is 12, the `return` statement won’t get executed, so it issues\
    \ the message `missing return statement` and refuses to compile your program.\n\
    \nYour next thought is to simply substitute 11 whenever 12 comes up:\n\n```java\n\
    public static int getRandomNumber()\n{\n    int num = (int)(Math.random() * 20)\
    \ + 1;\n    if (num != 12)\n    return num;\n    else\n    return 11;\n}\n```\n\
    \nLater that day, you realize that this solution isn’t a good one because the\
    \ number isn’t really random anymore. One of the requirements of a good random-number\
    \ generator is that any number should be as likely as any other number to come\
    \ up next. But because you’re changing all 12s to 11s, you’ve made 11 twice as\
    \ likely to come up as any other number.\n\nTo fix this error, you decide to put\
    \ the random-number generator in a loop that ends only when the random number\
    \ is not 12:\n\n```java\npublic static int getRandomNumber()\n{\n    int num;\n\
    \    do\n    {\n        num = (int)(Math.random() * 20) + 1;\n        if (num\
    \ != 12)\n        return num;\n    } while (num == 12);\n}\n```\n\nBut the compiler\
    \ refuses to compile the method again. It turns out that the compiler is smart,\
    \ but not very smart. It doesn’t catch the fact that the condition in the `do-while`\
    \ loop is the opposite of the condition in the `if` statement, meaning that the\
    \ only way out of this loop is through the `return` statement in the `if` statement.\
    \ So the compiler whines `missing return statement` again.\n\nAfter thinking about\
    \ it for a while, you come up with this solution:\n\n```java\npublic static int\
    \ getRandomNumber()\n{\n    int num;\n    while (true)\n    {\n        num = (int)(Math.random()\
    \ * 20) + 1;\n        if (num != 12)\n        return num;\n    }\n}\n```\n\nNow\
    \ everyone’s happy. The compiler knows that the only way out of the loop is through\
    \ the `return` statement, your dodecaphobic user doesn’t have to worry about seeing\
    \ the number 12, and you know that the random number isn’t twice as likely to\
    \ be 11 as any other number. Life is good, and you can move on to the next topic.\n\
    \n## Methods That Take Parameters\n\nA `parameter` is a value that you can pass\
    \ to a method. Then the method can use the parameter as though it were a local\
    \ variable initialized with the value of the variable passed to it by the calling\
    \ method.\n\nHere’s a method named `getRandomNumber` that returns a random number\
    \ between 1 and 10:\n\n```java\npublic static int getRandomNumber()\n{\n    return\
    \ (int)(Math.random() * 10) + 1;\n}\n```\n\nThis method is useful, but it would\
    \ be even more useful if you could tell it the range of numbers you want the random\
    \ number to fall in. It would be nice to call the method like this to get a random\
    \ number between 1 and 10:\n\n```java\nint number = getRandomNumber(1, 10);\n\
    ```\n\nThen, if your program needs to roll dice, you could call the same method:\n\
    \n```java\nint number = getRandomNumber(1, 6);\n```\n\nOr, to pick a random card\
    \ from a deck of 52 cards, you could call it like this:\n\n```java\nint number\
    \ = getRandomNumber(1, 52);\n```\n\nYou wouldn’t have to start with 1, either.\
    \ To get a random number between 50 and 100, you’d call the method like this:\n\
    \n```java\nint number = getRandomNumber(50, 100);\n```\n\nA method that accepts\
    \ parameters must list the parameters in the method declaration. The parameters\
    \ are placed in a `parameter list` inside the parentheses that follow the method\
    \ name. For each parameter used by the method, you list the parameter type followed\
    \ by the parameter name. If you need more than one parameter, you separate the\
    \ parameters with commas.\n\nHere’s a version of the `getRandomNumber` method\
    \ that accepts parameters:\n\n```java\npublic static int getRandomNumber(int min,\
    \ int max)\n{\n    return (int)(Math.random() * (max - min + 1)) + min;\n}\n```\n\
    \nHere the method uses two parameters, both of type `int`, named `min` and `max`.\
    \ Then, within the body of the method, these parameters can be used as though\
    \ they were local variables.\n\n# Chapter 9\n\n# Handling Exceptions\n\nIN THIS\
    \ CHAPTER\n\n- Seeing what to do when bad things happen to good programs\n- Finding\
    \ out all about exceptions\n- Using try, catch, and finally\n\nThis chapter is\
    \ about what happens when Java encounters an error situation that it can’t deal\
    \ with. Being an object-oriented programming language, Java handles errors by\
    \ using special `exception objects` that are created when an error occurs. In\
    \ addition, Java has a special statement called the `try` statement that you must\
    \ use to deal with exception objects. In this chapter, you find all the gory details\
    \ of working with exception objects and `try` statements.\n\n## Understanding\
    \ Exceptions\n\nAn `exception` is an object that’s created when an error occurs\
    \ in a Java program and Java can’t automatically fix the error. The exception\
    \ object contains information about the type of error that occurred. The most\
    \ important information — the cause of the error — is indicated by the name of\
    \ the exception class used to create the exception. You usually don’t have to\
    \ do anything with an exception object other than figure out which one you have.\n\
    \nEach type of exception that can occur is represented by a different exception\
    \ class. Here are some typical exceptions:\n\n- `IllegalArgumentException`: You\
    \ passed an incorrect argument to a method.\n- `InputMismatchException`: The console\
    \ input doesn’t match the data type expected by a method of the `Scanner` class.\n\
    - `ArithmeticException`: You tried an illegal type of arithmetic operation, such\
    \ as dividing an integer by zero.\n- `IOException`: A method that performs I/O\
    \ encountered an unrecoverable I/O error.\n- `ClassNotFoundException`: A necessary\
    \ class couldn’t be found.\n\nThere are many other types of exceptions, and you\
    \ find out about many of them later in this book.\n\nYou need to know a few other\
    \ things about exceptions:\n\n- When an error occurs and an exception object is\
    \ created, Java is said to have `thrown an exception.* Java has a pretty throwing\
    \ arm, so the exception is always thrown right back to the statement that caused\
    \ it.\n- When an exception happens, your program can `catch` the exception it\
    \ wants, but it doesn’t have to catch the exception if it doesn’t want. Instead,\
    \ it can duck and let someone catch the exception. That someone else is the statement\
    \ that called the method that’s currently executing.\n- If everyone ducks and\
    \ the exception is never caught by the program, the program ends abruptly and\
    \ displays a nasty-looking exception message on the console.\n- Two basic types\
    \ of exceptions in Java are checked exceptions and unchecked exceptions:\n   \
    \ - A `checked exception` is an exception that the compiler requires you to provide\
    \ for one way or another. If you don’t, your program doesn’t compile.\n    - An\
    \ `unchecked exception` is an exception that you can provide for, but you don’t\
    \ have.\n\n## Catching Exceptions\n\nWhenever you use a statement that might throw\
    \ an exception, you should write special code to anticipate and catch the exception.\
    \ That way, your program won’t crash if the exception occurs.\n\nYou catch an\
    \ exception by using a `try` statement, which usually follows this general form:\n\
    \n```java\ntry\n{\n    // statements that can throw exceptions\n}\ncatch (exception-type\
    \ identifier)\n{\n    // statements executed when exception is thrown\n}\n```\n\
    \nHere, you place the statements that might throw an exception within a `try block`.\
    \ Then you catch the exception with a `catch block`.\n\nHere are a few things\
    \ to note about `try` statements:\n\n- You can code more than one `catch` block.\
    \ That way, if the statements in the `try` block might throw more than one type\
    \ of exception, you can catch each type of exception in a separate `catch` block.\n\
    - You can catch more than one exception in a single catch block.\n"
