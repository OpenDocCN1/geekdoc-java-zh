    ### Creating random numbers


    Sooner or later, you’re going to want to write programs that play simple games.
    Almost all games have some element of chance built into them, so you need a way
    to create computer programs that don’t work exactly the same every time you run
    them. The easiest way to do that is to use the `random` method of the `Math` class,
    which [Table 5-4](#c05.xhtml_c05-tbl-0004) lists earlier in this section, along
    with the other basic mathematical functions of the `Math` class.


    The `random` method generates a random `double` value between 0.0 (inclusive,
    meaning that it could be 0.0) and 1.0 (exclusive, meaning that it can’t be 1.0).
    Most computer applications that need random values, however, need random integers
    between some arbitrary low value (usually 1, but not always) and some arbitrary
    high value. A program that plays dice needs random numbers between 1 and 6, whereas
    a program that deals cards needs random numbers between 1 and 52 (53 if a joker
    is used).


    As a result, you need a Java expression that converts the `double` value returned
    by the `random` function to an `int` value within the range your program calls
    for. The following code shows how to do this, with the values set to `1` and `6`
    for a dice-playing game:


    `int low = 1; // the lowest value in the range`


    `int high = 6; // the highest value in the range`


    `int rnd = (int)(Math.random() * (high - low + 1)) + low;`


    This expression is a little complicated, so we show you how it’s evaluated step
    by step:


    1.  The `Math.Random` method is called to get a random double value. This value
    is greater than 0.0 but less than 1.0.


    2.  The random value is multiplied by the high end of the range minus the low
    end, plus 1\. In this example, the high end is 6 and the low end is 1, so you
    now have a random number that’s greater than or equal to 0.0 but less than 6.0\.
    (It could be 5.99999999999999, but it never is 6.0.)


    3.  This value is converted to an integer by the `(int)` cast. Now you have an
    integer that’s 0, 1, 2, 3, 4, or 5.


    4.  The `low` value in the range is added to the random number. Assuming that
    `low` is `1`, the random number is now 1, 2, 3, 4, 5, or 6\. That’s just what
    you want: a random number between 1 and 6.


    To give you an idea of how this random-number calculation works, [Listing 5-3](#c05.xhtml_c05-fea-0003)
    shows a program that places this calculation in a method called `randomInt` and
    then calls it to simulate 100 dice rolls. The `randomInt` method accepts two parameters
    representing the low and high ends of the range, and it returns a random integer
    within the range. In the `main` method of this program, the `randomInt` method
    is called 100 times, and each random number is printed by a call to `System.out.print`.


    The console output for this program looks like this:


    `Here are 100 random rolls of the dice:`


    `4 1 1 6 1 2 6 6 6 6 5 5 5 4 5 4 4 1 3 6 1 3 1 4 4 3 3 3 5 6 5 6 6 3 5 2 2 6 3
    3`


    `4 1 2 2 4 2 2 4 1 4 3 6 5 5 4 4 2 4 1 3 5 2 1 3 3 5 4 1 6 3 1 6 5 2 6 6 3 5 4
    5`


    `2 5 4 5 3 1 4 2 5 2 1 4 4 4 6 6 4 6 3 3`


    Every time you run this program, however, you see a different sequence of 100
    numbers.


    The program in [Listing 5-3](#c05.xhtml_c05-fea-0003) uses several Java features
    that you haven’t seen yet.


