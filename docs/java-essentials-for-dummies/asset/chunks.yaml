    \n## 语句的操作\n\n与大多数编程语言一样，Java 使用语句来构建程序。与大多数编程语言不同，Java 不使用语句作为其基本单元——类。然而，每个类都必须有一个体，而类体由一个或多个语句组成。换句话说，没有至少一个语句，你就无法拥有意义的\
    \ Java 程序。接下来的章节介绍了操作 Java 语句的细节。\n\n### 语句的类型\n\nJava 有许多类型的语句。某些语句仅仅是创建你可以用来存储数据的变量。这类语句通常被称为\
    \ `声明语句`（declaration statements），并且通常像这样：\n\n```\nint i;\nString name;\n```\n\n\
    另一种常见的语句类型是 `赋值语句`（assignment statement），它为变量分配值：\n\n```\ni = 42;\nname = \"Jackie\
    \ Robinson\";\n```\n\n声明语句和赋值语句可以合并为单个语句，如下：\n\n```\nint i = 42;\nString name\
    \ = \"Jackie Robinson\";\n```\n\n另一种常见的语句类型是 `表达式语句`（expression statement），它执行计算或其他操作。例如：\n\
    \n```\nSystem.out.println(\"Hello, World!\");\n```\n\n注意，这条语句与 Listing 3-1 中的第\
    \ 5 行相同。因此`HelloApp` 程序中的单个语句是一个表达式语句。\n\n除了这两种，还有许多种语句。例如，`if` 语句仅在满足特定条件时执行其他语句，而\
    \ `for`、`while` 和 `do` 等语句会重复执行整组语句。\n\n![Tip](img/tip.png) 人们说每个 Java 语句必须以分号结束。实际上，这并不完全正确。某些类型的\
    \ Java 语句必须以分号结束——但其他不需要。基本规则是声明语句和表达式语句必须以分号结束，但大多数其他语句类型不需要。然而，这个规则变得复杂的地方在于，大多数其他类型的语句包含了一个或多个使用分号的声明或表达式语句。这是一个典型的\
    \ `if` 语句：\n\n```java\nif (total > 100)\n    discountPercent = 10;\n```\n\n在这里，如果变量\
    \ `total` 的值大于 `100`，则名为 `discountPercent` 的变量赋值为 `10`。赋值语句以分号结束，但 `if` 语句本身没有。（Java\
    \ 编译器会在你不该使用分号时提醒你。）\n\n### 空格\n\n在 Java 中，`white space`（空白）指的是一个或多个连续的空格字符、制表符或换行符。所有的空白被认为是相同的。\n\
    \n![Remember](img/remember.png) 换句话说，单个空格与制表符、换行符或空格、制表符和换行的任何组合是相同的。\n\n如果你用过\
    \ Visual Basic，空白与你习惯的有所。在 Visual Basic 中，换行标记语句的结束，除非使用了特殊的延续字符。在 Java 中，你不需要任何特殊操作将语句延续到另一行。\n\
    \n## 块的操作\n\n*块*（block）是用花括号封装的一个或多个语句的组。块以左大括号（`{`）开始，以右大括号（`}`）结束。在左、右大括号之间，你可以编写一个或多个语句。这里有一个包含三个语句的块：\n\
    \n```\n{\n    int i, j;\n    i = 100;\n    j = 200;\n}\n```\n\n## 创建标识符\n\n*标识符*（identifier）是你创建的用于通过名称引用\
    \ Java 编程元素的单词。虽然你可以将标识符分配给许多 Java 元素，但它们最常用于以下元素：\n\n*   类，例如 `CaseApp`\n*  \
    \ 方法，例如 `main()`\n"
