    \ and the first letter of the following words in uppercase.\n\n```javascript\n\
    varsimpleAndClean\n```\n\nIf you like to reuse a variable name to store a different\
    \ value, then you can simplify everything by adding a number at the end like like\
    \ this.\n\n```javascript\nvar simpleAndClean2\n```\n\n# Changing Assigned Value\
    \ in Variables\n\nLet us go back with our example variable learnEasy. At the moment,\
