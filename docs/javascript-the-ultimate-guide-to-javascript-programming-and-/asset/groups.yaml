    else. By using this method a hacker is able to gain unauthorized access to a system
    and create an access point so that they can re-enter via that established route
    later on. A computer virus is the most widely recognized form of hacking, as it
    is the computer threat that most of the public is aware of.


    The virus work by self-replicating and implanting itself into computer codes and
    code; while some computer viruses are malicious some are merely irritating or
    harmless. A computer worm is similar in that it is self-replicating, but it is
    able to enter a computer program without a user inadvertently letting it in, and
    it does not need to insert itself into present programs.


    Finally, a keylogger is a tool that records every keystroke on a given machine,
    which can later be accessed and viewed by the hacker. This is usually to enable
