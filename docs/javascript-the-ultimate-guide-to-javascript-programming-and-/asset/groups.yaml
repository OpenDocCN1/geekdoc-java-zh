    # Chapter 1 – Hacking and the Influence of Cyberpunk


    Michael Bruce Sterling, the American science fiction author, helped establish
    the popular genre of Cyberpunk. Cyberpunk is a subcategory of science fiction
    that focuses on the role of technology in a future setting. In this literary and
    cinematic genre, lower-class citizens are depicted, who have access to, and a
    great understanding of advanced technology.


    Cyberpunk often explores the role of technology during the breakdown of social
    order, in which there is an oppressive government restricting and damaging the
    lives of the general population. Furthermore, artificial intelligence (such as
    robots or intelligent computers) also plays a significant part in Cyberpunk stories,
    and the Earth is depicted in the near future in a post-industrial dystopia (the
    opposite of utopia, and therefore a bleak world characterized by oppression and
    often social unrest).


    ![](img/7d7681224c1536e030055a556b655618_53_0.png)


    The impact of Cyberpunk in the present-day understanding of hacking is considerable.
    Science fiction is particularly effective when we can recognize our own world
    within the fictional representation, and with Cyberpunk we can recognize many
    of the concerns of the contemporary technological age. Lawrence Person (editor
    of the science fiction magazine Nova Express) describes the typical characters
    in Cyberpunk:


    “Classic cyberpunk characters were marginalized, alienated loners who lived on
    the edge of society in generally dystopic futures where daily life was impacted
    by rapid technological change, an ubiquitous data sphere of computerized information,
    and invasive modification of the human body."


    To a contemporary reader, this description of Cyberpunk characters is reminiscent
    of how hackers are thought of in the popular imagination, and depicted in films.
    Therefore, the interplay between Cyberpunk characters and how we view real-life
    hackers is considerable: in many ways our understanding of what a hacker is like
    is based on how Cyberpunk characters are depicted in fiction. One example of this
    is how in Cyberpunk characters often live in filthy conditions, work at night
    and sleep all day, and do not have any social life beyond chat rooms.


    In the present-day imagination when we think of hackers we often think of a lonely
    adolescent boy behind a darkened computer screen. In fact, Michael Bruce Sterling,
    who was one of the first science-fiction writers who dealt with Cyberpunk, has
    also shown the most interest in understanding the development of hacking.


    ![](img/7d7681224c1536e030055a556b655618_54_0.png)


    Sterling has traced the emergence of hacking, and the associated underground computer
    network, to the Yippies, a counterculture group who were active in the 1960s and
    published Technological Assistance Program, a newsletter that taught its readership
    techniques for unauthorized access to telephones, known as phreaking.


    Many of the individuals who were involved in the phreaking community are also
    an active part of the underground hacking community, suggesting that the relationship
    between the two groups.


    # Chapter 2 – The Different Types of Hackers


    The computer hacking underground contains various different subcategories of hackers.
    This is mainly due to conflicting ideologies, whereby certain groups calls themselves
    by a specific name, or call others a specific name, in order to emphasize that
    they do not agree with the ideologies of others.


    ![](img/7d7681224c1536e030055a556b655618_55_0.png)


    The generic word ‘hacker’ therefore, although referring to those who have technical
    knowledge and are able to gain unauthorized access to computer systems, is rather
    vague and not distinguish those who use different methods or believe certain things.


    Instead, separate names have emerged in order to distinguish between groups, and
    to indicate that not all hackers follow the same rules or ideologies. One way
    in which this can be seen, as discussed previously, the distinction between hackers
    and crackers, as advocated by Eric S. Raymond in The New Hacker’s Dictionary.


    In this book Raymond compiled a glossary of hackers’ computer programming jargon,
    but those from the hacking community feel that this book is too biased by Raymond''s
    own view of hacking as a malicious practice.


    Rather than following the dichotomy of hacker/cracker that Raymond suggested,
    the general hacking community feels that this is too reductive and instead advocate
    a wider list of name to reflect the spectrum of beliefs and practices of the large
    hacking community.


    One subcategory of hackers is known as ''white hat hackers'' and they break through
    computer security without a malicious motivation. Examples of why this might be
    done include so to test one''s own security effectiveness, or when doing work
    developing computer security software.


    These breaches of security occur whilst performing vulnerability assessments of
    computer software as part of a contractual agreement, and is therefore legal.
    In, the slang term ''white hat'' references an ethical hacker who does so for
    positive reasons, in order to protect rather than destroy. There are recognized
    organizations, such as The International Council of Electronic Commerce Consulants,
    who provide training and certificates for this area of ethical hacking.


    ![](img/7d7681224c1536e030055a556b655618_56_0.png)


    On the other hand, there are ''black hat hackers'' who breach computer security
    systems simply to be malicious, or to gain profit. These hackers are the ones
    who are also referred to as crackers. This subcategory them hackers are often
    depicted in films and television, and represent the elusive and little-understood
    computer criminal the public fears.


    These types of hackers violate computer security in order to destroy, change or
    steal information, or to prevent authorized users from being able to access the
    system. The way they can cause disruption, waste time, and cause distress, but
    they can also steal significant amounts of money or access confidential information.


    Generally a black hat hacker will spend time looking for and discovering faults
    in programs, or weaknesses in computer systems, rather than alert the public to
    these problems they exploit for personal gain or simply for fun. Once they have
    a computer system, they can consequently make adjustments that prevent somebody
    with authorized access from using the system and thus the black hat hackers retain
    control.


    Lying somewhere between the two, not quite a white hat hacker and not quite a
    black hacker, is the gray hat hacker. This is somebody without being asked to
    searches the Internet for systems with a weakness or security flaw, and will then
    notify the administrator and offer to rectify the problem for a fee.


    In this way they are not as good as a white hat hacker (because they are demanding
    a fee, and their services were never requested) but they are also not as bad as
    a black hacker because they do not exploit these weaknesses in order to prevent
    disruption or steal data. Another way in which gray hackers might respond to their
    discovery of a security weakness is to publish their findings online, so that
    the general public has access to the information.


    In this way they are not performing malicious hacking themselves, but they are
    publishing the information, which leaves their subject at risk of a breach. This
    type of hacking is illegal and also considered unethical, whether or not the gray
    hacker has breached security for personal gain, because they have gained unauthorized
    access to data and have left the system susceptible to hacking.


    As well as these three main classifications for hacking, which differentiate hackers
