    # 序言


    在这一代，计算机似乎不再令人令畏了。它们现在正成为我们日常工具之一——让我们变得更简单和……。尽管今天的计算机操作是用户友好的，但仍然有许多隐藏的复杂性。大多数人会发现它们难以理解。因此，这本书是为那些想要以最简单发现计算机最大潜力的人而编写的。


    为了做到，你必须记住通信是计算机过程中的至关重要的部分。这不是计算机之间的过程，而是键盘后的用户与运行机器之间的过程。基础元素当然是语言。学习像 C 这样的语言将允许你按照你想要的方式和你你想要的状态来命令机器。


    在这本书中，你将学习计算机最重要的语言之一——JavaScript。


    # 编程简述


    在继续学习 JavaScript 之前，首先理解什么是编程至关重要。


    计算机程序可以是任何东西。你用来阅读这本电子书的软件是一个程序。你使用的互联网浏览器是一个程序。播放你音乐文件的应用程序是一个程序。你正在的游戏是一个程序。换句话说，你在计算机中看到和使用的一切都是程序。所有这些都是一个被称为编程的单一过程的产物。


    ![](img/7d7681224c1536e030055a556b655618_10_0.png)


    编程是一门艺术。程序员输入一段来命令计算机执行特定操作。让我们以人体来类比。


    如果你被给你一个数学问题来解决，你的大脑必须处理它。根据等式的规模，你可能会发现自己正在数手指或在纸上解一个公式。简而言之，有几种身体功能在工作。


    从编程的角度来看，所有这些身体功能都是程序，你的整个身体就是机器。你大脑的机械对应物是机器的内存。方程式是我们要处理的数据。


