    #介绍 JavaScript


    ![](img/7d7681224c1536e030055a556b655618_12_0.png)


    在任何事情之前，你可能熟悉另一种叫做 Java 的语言。Mocha 这个名字是由 Netscape 定的。在同年的9月份，名字改为 JavaScript。在同年的12月份，在收到
    Sun 的许可后，名字再次改为 JavaScript。


    # 你在书中可以找到什么？


    这本书是 Words 系列中的 JavaScript 第一部分。该部分包含3章。第一章将为你介绍值以及如何在 JavaScript 中处理这些值。你将学习如何使用运算符、比较符以及如何创建字符串。第二章讨论变量。在本章中，你将学习如何为变量赋值。你还将学习如何通过组合多个变量来创建灵活的消息。最后一章讨论源文件的创建。在本章中，你将学习如何正确在源文件中编写
    JavaScript 代码。此外，你将学习如何在 HTML 文件中执行此文件。


    # 第一章 – 认识数字、运算符和字符串


    浏览互联网就能接触到数百万行 JavaScript 代码。当你最喜爱的互联网浏览器（例如 Google Chrome、Mozilla Firefox 和 Internet
    Explorer）开始访问某个网站时，你已经在使用 JavaScript 语言进行通信了。


    在这一章中，我们将讨论 JavaScript 语言的基础构建块。这将帮助你在之后转向像 jQuery 等高级框架时建立一个坚实的基础。


