    # 将源代码存放在哪里


    在浏览你的网站的文件管理器时，你永远不会错过看到一个名为“root”的文件夹。这就是我们找到网站内部所有内容的地方。这也是你网站 `index.html`
    的默认所在位置。


    根据上面的 `index.html` 文件，我们引导它在同一个文件夹内——即 `root/` 文件夹——寻找 JavaScript 源代码文件。因此，我们应该将
    `greetings.js` 存放在相同的位置。


    ```

    + root/

    - index.html

    - greetings.js

    ```


    然而，有些网站会将所有的 JavaScript 源代码文件放在子文件夹中。它们源代码最常见的目录是 `scripts/` 文件夹下。以下是它们在你的网站目录中的样子。


    ```

    + root/

    - index.html

    + scripts/

    - greetings.js

    ```


    如果你想以这种方式组织你的源代码，那么我们需要修改示例 `index.html` 中的 `<script>` 标签。你的 HTML 代码看起来应该是像这样的：


    ```html

    <<html>

    <head>

    <script src="scripts/greetings.js"></script>

    </head>

    <body>

    <h1>WELCOME TO JAVASCRIPT!</h1>

    ...

    </body>

    </html>

    ```


    请注意，在这段代码中，我们正在指示 `index.html` 从 `scripts/` 子文件夹加载 `greetings.js`。


    # 在源文件中编写代码


    直接在 `greetings.js` 中编写控制台风格的表达式会导致错误。让我们尝试在源文件中编写以下几行作为示例。


    ```javascript

    var hello = "Welcome to my website! "

    nvar enjoy = "Please enjoy your visit!"

    hello + enjoy

    ```


    一旦我们打开 `index.html` 并进入浏览器控制台，我们将看到错误之外一无所获。这是因为我们对你真正想要显示的内容感到困惑。错误来自我们的 JavaScript
    源代码文件。与控制台不同，我们需要在源文件中以方式断言 JavaScript 代码。我们通过在每个语句后添加分号（`;`）来实现这一点。因此，我们应该这样写
    JavaScript 代码。


    ```javascript

    var hello = "Welcome to my website! ";

    var enjoy = "Please enjoy your visit!";

    hello + enjoy;

    ```


    使用带有分号编写的代码后，当你尝试访问控制台时将不再看到错误。但是，你会在控制台中看不到任何内容。这意味着我们的代码尚未被传递到浏览器的控制台中。JavaScript
    代码的执行仅发生在源文件本身。为了修复这个问题，我们需要使用 `console.log()` 方法。


    我们想要做的是显示来自变量 `hello` 和 `enjoy` 拼接而来的字符串。以下是我们的做法：


    ```javascript

    var hello = "Welcome to my website! ";

    var enjoy = "Please enjoy your visit!";

    console.log(hello + enjoy);

    ```


    通过使用 `console.log()` 方法，你现在能够在控制台中看到该字符串了。换句话说，我们现在有了一个由 `index.html` 文件运行的正常
    JavaScript 编程语言。


    # 结论


    到此时，你已经知道如何在 JavaScript 语言中编写值。你刚刚学习了 JavaScript 如何解释数字和平直文本，以及如何将文本转换为字符串值。你还学习了如何使用运算符和比较符将这些值转换为表达式和语句。


    在第二章中，你接触了变量。你学习了如何将值存储在变量中，以及通过拼接方法，你学习了如何以变量的形式快速处理值。书中还介绍了一些方法，例如 `charAt()`
    方法和 `.length` 属性——这些工具可以帮助你高效分析值。


    在第三章中，你学习了如何创建自己的 JavaScript 源代码文件。请注意，与控制台相比，在源文件中需要以不同的方式断言 JavaScript 代码。你还了解了在源文件中与控制台的不同。


    '
