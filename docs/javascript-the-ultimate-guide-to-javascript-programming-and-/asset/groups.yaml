    # Where To Place The Source File


    When browsing your website''s file manager, you will never miss seeing a folder
    named “root”. This is where we can find everything inside our website. This is
    also the default location of your website''s index.html as well.


    Basing from the index.html file we have above, we are directing it to find the
    JavaScript source file within the same location folder – that is, the root/ folder.
    Hence, we should place our greetings.js in the same location.


    ```

    + root/

    - index.html

    - greetings.js

    ```


    There are websites, however, that place all their JavaScript source files in a
    subfolder. The most common directory for their source files is under scripts/
    folder. Here is how they look like in your website’s directory.


    ```

    + root/

    - index.html

    + scripts/

    - greetings.js

    ```


    If this is how you want to organize your source files, then we need to alter the
    <script> tag in our sample index.html. This is how your HTML codes should look
    like.


    ```html

    <html

    <head>

    <script src="scripts/greetings.js"></script>

    </head>

    <body>

    <h1>WELCOME TO JAVASCRIPT!</h1>

    ...

    </body>

    </html>

    ```


    Notice that in this code, we are instructing the index.html to load the greetings.js
    from the scripts/ subfolder.


    # Writing Codes in the Source File


    Writing console-style expressions inside the greetings.js as they are will end
    up in error. Let us try to write these following lines inside our source file
    for example.


    ```javascript

    var hello = "Welcome to my website! "

    nvar enjoy = "Please enjoy your visit!"

    hello + enjoy

    ```


    Once we open our index.html and go to our browser’s console, we will see nothing
    but error. This is because we got deconfused on what you really intend to show.
    The error comes from our JavaScript source file. Unlike the console, we need to
    assert our JavaScript codes differently in the source files. We do this by adding
    a semicolon ( ; ) every after a statement. Hence, we should write our JavaScript
    codes like this.


    ```javascript

    var hello = "Welcome to my website! ";

    var enjoy = "Please enjoy your visit!";

    hello + enjoy;

    ```


    With our codes written with semicolons, you will no longer see an error when trying
    to access the console. However, you will not see anything in the console. This
    means that our code is not yet being delivered to the browser’s console. The execution
    of the JavaScript codes only happens within the source file itself. In order to
    fix this, we need to use the console.log( ) method.


    What we want to do is to show the string coming from the concatenation of the
    variables hello and enjoy. Here is how we are going to that.


    ```javascript

    var hello = "Welcome to my website! ";

    var enjoy = "Please enjoy your visit!";

    console.log(hello + enjoy);

    ```


    By using the console.log( ) method, you will be able to see now the string inside
    the console. In other words, we now have a working JavaScript programming language
    being run by our index.html file.


    # Conclusion


    At this point, you now know how to write values in JavaScript language. You just
    just learned how JavaScript interprets numbers and flat texts, as well as how
    to transform texts into string values. You also learned how to manipulate these
    values into expressions and statements with the use of operators and comparators.


    In the second chapter, you were introduced to variables. You learned how to store
    values into variables and the concatenation method where you learned how to process
    values quickly in the form of variables. A couple of methods were also introduced
    such as the charAt() method and .length property – tools that can help you analyze
    values efficiently.


    In the third chapter, you learned how to create your own JavaScript source file.
    Take note that you need to assert JavaScript codes differently in source files
    compared to the console. You also got to know the console.log() method which allows
    you to print values in the browser''s console. However, this is not yet the most
    efficient way to deliver JavaScript codes. Imagine if you are going to deliver
    hundreds of values into the browser? That would mean repetitive programming and
    too hassle.


    In the next part of the JavaScript in Simple Words series, we will bring you to
    the loops of JavaScript where you will learn how to manage repetitive coding efficiently.
    Several topics will also be discussed on the second part of the book series including,
    but not limited to, the use of conditions and the creation of dialog boxes.


    ![](img/7d7681224c1536e030055a556b655618_48_0.png)


    # Computer Hacking


    The Essential Hacking Guide for Beginners


    MATT BENTON


    # Contents


    - Introduction – What is Hacking?

    - Chapter 1 – Hacking and the Influence of Cyberpunk

    - Chapter 2 – The Different Types of Hackers

    - Chapter 3 – Computer Security

    - Chapter 4 – Hacking Techniques

    - Conclusion


    # Introduction – What is Hacking?


    Hacking is the act of gaining unauthorized access to a computer system, and can
    include viewing or copying data, or even creating new data. Often hacking is understood
    to be a way of maliciously disrupting a computer system, copying information,
    or leaving behind a virus that destroys data.


    There are many different reasons why hacking takes place, and these reasons range
    from wanting to disrupt a system due to ideology (so hacking as a means of protesting);
    wanting to gain profit for example in order to commit credit card fraud; or simply
    hacking for the sake of enjoyment and amusement.


    There is some controversy about the definition of the word ‘hacker’ because those
    that try to prevent such breaches in security from taking place, or seek to recover
    lost files, can also be known as hackers. Thus, some people believe that the correct
    term for malicious security breaches is in fact ‘cracking’ and that ‘hacking’
    is the correct word to use for those who fight against malicious exploitation
    of computer weaknesses.


    However, in the popular imagination and in general conversation, the word ‘hacker’
    is mainly understood to refer to the ‘bad’ method of breaking through computer
    security. The two processes share many common skills, regardless of motivation
    (whether to steal or protect, in in to or save, computer data) the same understanding
    of computers is required.


    Hacking is more than simply a pastime for those who are interested in technology,
    and more than simply an illegal activity for personal gain and with malicious
    intent, although both of these motivations make up much of hacking activity. In
    fact, hacking is its own subculture, and members of the community feel very strong
    about their ideologies, techniques and social relationships in the computer world.


    There are many hacking groups and conventions, such as SummerCon, DEF CON, HoHoCon,
    ShmoCon, BlackHat, Chaos Communication and Hacker Halted, and local hacking communities
    take their entries into hacking competitions very seriously. Unsurprisingly there
    are also numerous online groups and forums dedicated to the subject of hacking,
    and there is certainly a strong community spirit felt by those with similar hacking
    ideologies.


    Furthermore, hackers are often passionate about literary depictions of the hacking
    community, and ardently read fictional Cyberpunk and factual hacker magazines.


    This book will serve as an introduction to the world of hacking, and will provide
    insight into some of the key influences, ideologies, groups, concepts, and techniques
    of hacking.


    The first chapter will consider the beginnings of hacking and the influence of
    the literary genre, Cyberpunk. The second chapter will look at the different types
    of hackers, and draw a distinction between ethical and unethical hacking. The
    third chapter will look at the issue of computer security, which is vital to an
    understanding of hacking.


    The final chapter will provide an overview of the various different techniques
    for hacking, including automated and manual approaches as well as the importance
    of the cyber confidence trick known as social engineering.

    '
