    # Introducing JavaScript


    ![](img/7d7681224c1536e030055a556b655618_12_0.png)


    Before anything, you might have familiar with another language called Java. The
    name Mocha was picked by Netscape. In September of the same year, the name was
    changed to JavaScript. In December of the same year, its name changed again to
    JavaScript after receiving license from Sun.


    # What Can You Find In This Book?


    This book is the first part of JavaScript in Words series. This part of the series
    features 3 chapters. The first chapter will introduce you to values and how to
    process these values in JavaScript. You will learn how to use operators, comparators,
    and how to create strings. The second chapter discusses variables. In this chapter,
    you will learn how to assign values inside variables. You will also learn how
    to create versatile messages by combining multiple variables. The last chapter
    discusses the creation of source files. In this chapter, you will learn how to
    write JavaScript codes inside the source file properly. In addition, you will
    learn how to execute this file inside an HTML file.


    # Chapter 1 – Getting to Know Numbers, Operators, and Strings


    Browsing the internet alone gives you access to millions of lines of JavaScript
    codes. The moment you start your favorite internet browser (e.g. Google Chrome,
    Mozilla Firefox, and Internet Explorer) began to visit a certain website, you
    are already communicating using the JavaScript language.


    In this chapter, we will be discussing the fundamental building blocks of JavaScript
    language. This will help you establish a concrete foundation once you move on
    to advanced frameworks like jQuery.

