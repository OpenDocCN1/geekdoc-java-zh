    # 控制台


    在一切之前，访问浏览器控制台对你来说至关重要。浏览器控制台是开发者工具之一。它记录了与当前网页相关的信息。这些信息包括 CSS、安全错误和 JavaScript。控制台还允许你通过断言
    JavaScript 表达式与网页进行交互。


    这就是我们将在书中执行示例 JavaScript 代码的地方。你可以通过按下键盘上的 F12 键访问它。寻找 Console（控制台）选项卡，你现在准备好开始了。


    ![](img/7d7681224c1536e030055a556b655618_16_0.png)


    # 基础数字与提示符 (Prompt)


    在开始学习 JavaScript 时，你需要熟悉两个符号：


    - > 大于符号；以及，

    - → 箭头符号


    该符号代表 JavaScript 的提示符。我们想要输入控制台的所有代码都将写在这个符号之后。→ 符号指的是我们输入的代码产生的结果。


    在 JavaScript 语言中，数字会被自动识别。在提示符后输入数字并按下键盘上的 Enter 键，将得到相同的值的结果。尝试在控制台中输入数字 13，它将返回相同的值。


    ```

    > 13

    → 13

    ```


    带有小数值的数字也是如此。


    ```

    > 13.29

    → 13.29

    ```


    # 运算符


    在 JavaScript 中，数学运算也是允许的。JavaScript 语法中常用的运算如下：


    - 加法

    - 减法

    - 乘法

    - 除法

    - 模（取余）


    加法通过 + 符号表示。


    ```

    > 1 + 3

    → 4

    ```


    减法通过 – 符号表示。


    ```

    > 10 – 5

    → 5

    ```


    乘法通过 * 符号表示。


    ```

    > 2 * 9

    → 18

    ```


    除法通过 / 符号表示。


    ```

    > 25 / 5

    → 5

    ```


    另一方面，模是 JavaScript 语言中的特殊运算。它通过 % 符号表示。你得到的结果是两个数字相除后的余数。


    ```

    > 23 % 2

    → 1

    ```


    在上面的模示例中，控制台将 23 除以 2。即使在 23 中可以除 11 次，控制台也只显示余数作为结果，即 1。


    # PEMDAS 顺序


    JavaScript 编程遵循流行的数学运算顺序：PEMDAS。这个缩写代表：


    - P 括号

    - E 幂

    - M 乘法

    - D 除法

    - A 加法

    - S 减法


    让我们以以下表达式为例。


    ```

    > (10 + 5) * 3

    ```


    按下 Enter 键后，控制台将向你返回这个答案。


    ```

    → 45

    ```


    括号内的运算将首先求解。在我们的情况下，是 10 + 5，这给了我们 15。之后，该和将与 3 相乘。因此，控制台给您 45。


    让我们尝试一个更长的表达式。


    ```

    > (7 * 2) + 5 - 10/2

    ```


    按照 PEMDAS 顺序，该表达式将如下求解：


    ```

    14 + 5 - 10/2

    14 + 5 - 5

    19 - 5

    ```


    因此，控制台将向你返回这个答案。


    ```

    → 14

    ```


    # 比较运算符 (Comparators)


    除了运算符之外，JavaScript 语言也识别逻辑运算符，我们称之为比较运算符。JavaScript 中常用的比较运算符通过以下语法表示：


    - > 大于

    - < 小于

    - == 等于

    - != 不等于

    - >= 大于等于

    - <= 小于等于


    使用这些比较运算符在 JavaScript 中发送表达式就像是在向控制台提一个逻辑问题。你从控制台得到的答案可能是“true”（真）或“false”（假）。这些答案被称为布尔值（Boolean
    values）。


    让我们尝试将以下表达式发送到控制台。


    ```

    > 10 !== 9

    ```


    这个表达式就像是在询问控制台在 JavaScript 语言中 10 是否不等于 9。因此，控制台将给你“true”作为答案，因为 10 在数值上不等于 9。


    # 字符串 (Strings)


    ```html

    <!DOCTYPE html>

    <html>

    <<body>

    <script type="text/javascript">

    var str="Split String(" ")" + <br />

    document.write(str.split(" ") + <br />);

    document.write(str.split(",") + <br />

    document.write(str.split());

    </script>

    </body>

    </html>

    ```


    JavaScript 处理字符串、存储并处理纯文本作为字符串。为了通知控制台我们要处理纯文本，我们需要将它们包含在引号内。这将允许控制台将文本识别为字符串并返回字符串。（注：原文此处包含大量由于
    OCR 错误导致的重复文本，已根据要求进行了去重并保留核心逻辑）。


    '
