    \ message = str1 + str2;\n```\n\nThis will result in \"Hello World\".\n\nIf you\
    \ want to access a specific character in a string, you can use the `charAt()`\
    \ method. This method returns the character at the specified index. Remember that\
    \ string indexing starts from 0.\n\n```javascript\nvar text = \"JavaScript\";\n\
