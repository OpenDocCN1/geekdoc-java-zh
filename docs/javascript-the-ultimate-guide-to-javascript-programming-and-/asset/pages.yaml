  md: '# Creating Source Files


    Writing JavaScript codes in the console alone will not print out what we want
    to convey to our user''s web browsers. Hence, we need to find a way to bring what
    we want to the users. In order to do that, we need to create JavaScript source
    files and run these files in an HTML file.Here is an example of the most common
    HTML file known as index.html.


    ```

    <html>

    <head>

    <script src="greetings.js"></script>

    </head>

    <body>

    <h1>WELCOME TO JAVASCRIPT!</h1>

    ...

    </body>

    </html>

    ```


    As you can see, we have the <script>tag in this file. This tag commands this HTML
    file to load a specific JavaScript source file so that the web browser of your
    visitors will let them see your website in the way you want to see it. Notice
    that we have the “src” keyword inside the <script>tag. This is a command to the
    HTML file which directs it to load the JavaScript source file.


    In this example, we are commanding the index.html file to load all variables and
    values within inside greetings.js.


    In order to create this .js file, all you need to do is open any text editor like
    Notepad or Text Edit. Write all your JavaScript codes inside and save the file
    in .js format. Inside this file, we assert all the JavaScript codes we want our
    visitor’s web browser to execute as soon as they access our website.'
  merge: -1
  pgno: 41
- img_proc: true
  md: '# Where To Place The Source File


    When browsing your website''s file manager, you will never miss seeing a folder
    named “root”. This is where we can find everything inside our website. This is
    also the default location of your website''s index.html as well.


    Basing from the index.html file we have above, we are directing it to find the
    JavaScript source file within the same location folder – that is, the root/ folder.
    Hence, we should place our greetings.js in the same location.


    ```

    + root/

    - index.html

    - greetings.js

    ```


    There are websites, however, that place all their JavaScript source files in a
    subfolder. The most common directory for their source files is under scripts/
    folder. Here is how they look like in your website’s directory.


    ```

    + root/

    - index.html

    + scripts/

    - greetings.js

    ```


    If this is how you want to organize your source files, then we need to alter the
    <script> tag in our sample index.html. This is how your HTML codes should look
    like.'
  merge: -1
  pgno: 42
