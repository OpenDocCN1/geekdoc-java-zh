    https://docs.docker.com/v17.0/compliance/cis


    These guides define a series of guidelines to be followed by all members of a
    DevOps team. In this way, the audit and internal security teams would be aware
    of these guidelines in order to perform the corresponding compliance and security
    tests. The use of these guides and best practices help to reduce the margin of
    error when starting to work with an established baseline.


    Docker bench is a shell script that looks for common best practice patterns around
    the implementation of Docker containers in production. It is a set of bash scripts,
    which must run as a root user on any machine with Docker installed, and the tool
    will provide a report with all the checks. From the point of view of the Docker
    host and Docker daemon settings, this is the best tool you can use to check these
    best practices.


    The source code can be accessed in the GitHub repository: https://github.com/docker/docker-bench-security.


    Docker bench runs in a container with high privileges and runs a set of tests
    against all the containers that are in the Docker host. The tests return the PASS,
    WARN, or INFO status, and we can see, for each test, it passes the specific functionality.


    The tool will inspect the following components:


    +   - Host configuration

