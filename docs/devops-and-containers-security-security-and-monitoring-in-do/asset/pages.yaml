    # Docker capabilities


    The containers, by default, boot with a series of limited Linux privileges. One
    of the strengths is the granularity that these systems have in order to provide
    permissions, in case it requires situation, and to carry out the functionality
    that needed to be executed, without providing root permissions.


    In the same way that different privileges can be added, by default, the ideal
    in terms of security is always to be restricted or as minimal as possible. In
    other words, do not provide permissions until it is shown that they are necessary
    to execute the different functionalities required. Therefore, by applying this
    concept, the exposure of the kernel is minimized.


    Docker capabilities allow us to manage what a process has access to the kernel
    and allow segregating root privileges to limit actions that can be accessed with
    privileges. The Docker container engine uses part of Linux''s capabilities and
    is essential for managing security contexts.


    The capabilities provide a tool to design a more advanced security strategy with
    different level privileges.


    In this URL http://man7.org/linux/man-pages/capabilities.7.html, you can check
    the man pages for Linux capabilities.


    Capabilities allow us to manage what a process has access to the kernel, regardless
    of the user who launches it. They allow segregating root privileges to limit actions
    that can be accessed with privileges. Different container engines use part of
    the capabilities of Linux and are essential for managing security contexts.


    Linux performs a granular division of capabilities so that the privileges associated
    with the superuser can be enabled and disabled independently.


    Some capabilities are:


    +   - CAP_SYLOG: For modifying the behavior of the kernel log.


    +   - CAP_NETADMIN: For modifying the network configuration.


    +   - CAP_MODULE: For managing kernel modules.


    +   - CAP_RAWIO: For modifying the kernel memory.'
