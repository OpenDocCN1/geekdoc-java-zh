- img_proc: true
  md: '# docker run -p 8080:80


    The pretty Dockerfile uses the EXPOSE keyword to define a port that will be exposed
    from the container.


    Expose ports: The link (Docker linking system) allows a container to access the
    exposed port of a container on the same machine.


    Port mapping: The mapping provides a mechanism to assign an exposed port to the
    external ports of the machine.


    Containers communication and port mapping


    When we add a container to a network, by default, all ports will be closed in
    the connection to the outside and all open for machines that are within the same
    network. For example, it would not be necessary to expose MySQL container ports,
    since on the same network as the application container, they can connect through
    the port without a problem, but we will not be able to access the mysql port from
    outside the network unless we publish it.


    Configure port forwarding between container and host


    Port forwarding is the easiest way to expose the services that are running in
    containers. There are two ways to start a container and link its ports to the
    host ports:


    +   -P [publish-all]: When starting a container with this option, all the ports
    that were exposed using the EXPOSE statement will be published in the Dockerfile.


    +   -p [publish]: This option allows you to explicitly indicate to Docker which
    port should be linked to a port in a container. There are 3 ways to use this option:


    ```

    $ docker run -p hostport:containerport

    ```


    ```

    $ docker run -p ip:hostport:containerport

    ```


    Adding an EXPOSE instruction allows a Dockerfile to specify that a specific port
    must be exposed from the image it builds. When a port is exposed in a running
    container, once you link the running container to another container, the exposed
    port will be available to the other container as if it were available on the same
    local system.


    Runtime expose: Any port identified with an EXPOSE statement when the image is
    built can easily be exposed from the same port number on the localhost. By using
    the -p option in docker run, you can assign any exposed port to it or to a different
    port on the localhost. When you use the -P option in docker run, all exposed ports
    from the container are assigned to random ports on the host system. You can then
    run the docker command in the resulting container to see how the ports are mapped.


    Here is an example of a Dockerfile that launches an exposed web server on port
    80 :


    FROM docker:latest


    MAINTAINER maintainer


    RUN yum install -y httpd


    EXPOSE 80


    # Start the service


    CMD ["-D", "FOREGROUND"]


    ENTRYPOINT ["usr/bin/httpd"]


    When you run the container with that image, we can expose port 8080 from the container
    to port 8080 on the local system.


    ```

    $ docker run -p 8080:80 -d web_server

    ```


    The -p 8080:80 parameter indicates that port 8000 is port 80 inside the container.'
