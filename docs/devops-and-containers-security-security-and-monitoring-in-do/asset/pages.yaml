    Docker security principles


    From the security point of view, Docker containers use the resources of the host
    machine, but they have their own runtime environment. They have a reduced version
    of the user space of the operating system. This means that you can secure a container
    in a very similar way to what you would use in a real machine since, in the background,
    it is almost as if it were a real machine.


    A container cannot contain other containers or the underlying operating system
    (except for the storage volumes to which you give permission) and communicate
    with other networks and containers, with the specific network configuration that
    you want to grant.


    Keep in mind that a container isolates you as a virtual machine, but it is much
    less heavy, requires less configuration, and can open wormholes to specific processes
    if we need, with total security.


    Even when processes isolated in containers run the same kernel, Docker uses a
    series of isolation techniques to protect them from each other. The most important
    is the central functions of the Linux kernel, such as Cgroups and namespaces.
    The distribution of resources (memory, CPU, bandwidth) takes place by means of
    Cgroup mechanism that guarantees that each container can only consume the quota
    reserved for it.


    With this approach, the containers do not offer the same degree of isolation that
    can be achieved with virtual machines. In the case that an attack was made with
    a virtual machine, it would hardly have any chance to attack the kernel of the
    underlying host system. Containers, on the other hand, enhanced isolation places
    of a common host kernel, provide a greater margin of freedom for any type of attack.


    Despite the isolation techniques that have been described, from the containers
    it is possible reach some important kernel systems such as Cgroups or the kernel
    interfaces in us and /proc, and these offer the attacker to disable the functions
    host Security And as all containers run on the same host system in the user namespace,
    a container that has been assigned admin (root) also allows them in with the host
    kernel.


    The Docker daemon responsible for the management of the container system, also
    enjoys root sockets, so a user to access the daemon automatically gains access
    to all the directories which has been authorized or as the possibility to communicate
    with a REST API using HTTP. This is why, in undoubtedly, Docker recommends providing
    access to the daemon only to trusted users.


    The development team behind Docker is aware of these security concerns, considering
    them an obstacle to the consolidation of this technology in production systems.
    With the fundamental isolation techniques of the Linux kernel, the latest versions
    of the engine Docker, support AppArmor, SELin and Seccomp frameworks, which would
    act as a firewall for the kernel resources:


    AppArmor allows regulating access rights of the containers to the file system.


    SELinux presents a complex system of rules which you can implement access controls
    to the kernel resources.


    Seccomp (Secure Computing Mode) monitors system calls.


    Adding to these features, Docker also uses the-some Linux capabilities which can
    limit the root rights with which the Docker Engine starts the containers.


    Some weaknesses contained in application components that are expanded through
    Docker''s registry are also a source of objections. In principle, there are no
    restrictions regarding the creation and publication of images in the Docker hub,
    but this is what carries the risk of introducing malicious code in a system by
    downloading an image. Therefore, before deploying an application, Docker users
    should make sure that the code they complete supplied by an image to run containers
    from a reliable source.


    The use of Docker brings benefits to developers, testers, and system administrators.
    In the case of developers the use of Docker makes it possible to focus on code
    generation and not worry about the characteristics of the development and production
    environment can have. On the other hand, it is very easy to manage containers
    and one of their main characteristics is that they are very light, they are very
    suitable to deploying an environment where you can deploy. Finally, it also brings
    advantages to system administrators, since the deployment of applications can
    be done more easily, without needing to use virtual machines.'
