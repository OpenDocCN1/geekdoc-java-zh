    # Continuous Integration


    Continuous integration is the way in which the software development integrates
    its partial or total work, in a certain time established by the work team. It
    requires automated tools that are unique to the entire team of developers. These
    tools help to integrate into continuous form parts of code that are validated
    by automatic tests, which makes the work of the development team more efficient
    since it detects failures in the early stages of the development cycle.


    Continuous integration originated under the extreme programming methodology and
    is a software practice that requires the periodic integration of code into a shared
    repository. This strategy involves integration as often as possible. Although
    it sounds contradictory, this approach allows small and simple integrations to
    be made constantly, reducing time and increasing speed. In order to have a continuous
    integration process, useful steps can be followed:


    +   A code repository in which the development is decentralized. Each developer
    works on small tasks, and when each task has finished the changes to the central
    line of the repository are included.


    Start a process of compilation and testing in an automated way, that proves that
    the changes and additions are made correct and not altered any part of the software.
    For this work properly, it is essential that there is a good set of tests that
    can be trusted.\Execute this process several times a day, paying attention to
    the reported errors, which becomes a priority until they disappear. With this,
    it is always possible to have the latest version of the project status on the
    mainline, a version that is updated several times a day.


    # Continuous Delivery


    Once the integration is achieved, you must continue with the cycle to perform
    the testing, and if satisfactory, allow the application to be deployed. In this
    stage, all the code are implemented in order to generate an application that can
    be tested in production.


    Continuous delivery represents a step beyond continuous integration. According
    to Martin Fowler, the continuous delivery is to build the software in such a way
    that it is always ready to go into production, taking aware of the following features:


    It is deployable throughout its life cycle.

    The teams have prioritized this drop-down feature at any time on the construction
    of new features.


    Can give fast and automated feedback.

    Can be deployed in any environment and on-demand.

    In continuous delivery (CD), the integrated CI is automatically tested through
    many environments throughout the process to reach the preproduction phase, where
    it is ready to be implemented definitively. The interaction between CI and CD
    is called CI/CD.


    # Continuous deployment


    Continuous deployment is the next step to continuous delivery. The continuous
    deployment is a practice that allows bringing the results of a development process
    to an environment similar where the functional tests can be given at full scale.
    The objective is detect problems in production as quickly as possible. It is the
    early moment in which the user interacts with the application, reviews their requirements
    and can go back in the development.'
