    Quay.io image repository


    CoreOs, in addition to using Clair to analyze images uploaded by customers, also
    uses the Quay.io image repository: https://docs.quay.io , a container registry
    with similar features to the Docker hub repository.


    Quay registry provides static image analysis with the objective of finding obsolete
    and vulnerable libraries in binaries. Among the main features we can highlight:


    Scanning the image before uploading it to


    Vulnerability mapping with CVE updates


    Links to the vulnerabilities of the CVE database


    Easy to integrate into your CI/CD workflow


    Web interface and analysis engine API


    At low level uses the CoreOs Clair open source CVE engine


