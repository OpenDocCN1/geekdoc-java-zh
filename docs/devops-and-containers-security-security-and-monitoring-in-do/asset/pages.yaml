    # Conclusion


    In this chapter, we have reviewed how networks are configured in Docker containers
    that should not be disconnected from other systems, whether physical, virtual,
    or in containers. The reader has learned the main types of Docker networks and
    how connecting containers to each other with the creation of our Docker network.
    Thanks to the use of Docker networks, we have the ability to create more complex
    applications, with the possibility that each container offers a service that works
    autonomously, and the containers can communicate with each other. That is why
    Docker provides commands for managing Docker networks.


    In the next chapter, we will review open-source tools available for Docker container
    monitoring such as cadvisor, dive, and sydfigaldo.


