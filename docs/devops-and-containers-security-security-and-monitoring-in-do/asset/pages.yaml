    # Kubernetes vulnerabilities


    One of the most critical vulnerabilities detected in 2018 has been one we can
    find in the CVE database with the code CVE-2018-1002105. The vulnerability, of
    critical severity, is in the Kubernetes API server and would allow compromising
    the pods in execution.


    http://cve.mitre.org/cgi-bin/cvename.php?name=CVE-2018-1002105


    The vulnerability has been identified in the Kubernetes API server and has been
    categorized as critical with punctuation CVSS 9.8. The vulnerability allows any
    authenticated user to obtain administrative access to the cluster using standard
    security settings and allows the escalation of privileges through a specially
    designed request.


    It is important to note that all Kubernetes-based services and products, including
    Red Hat products such as OpenShift Container Platform, are affected, so we can
    also find the reference in the RedHat database:


    https://access.redhat.com/security/cve/CVE-2018-1002105


    The vulnerability is due to vulnerable TCP connection, through which a remote
    attacker could send specially manipulated requests to one of the added APIs of
    the Kubernetes API server and escape privileges using TLS credentials of that.
    The problem is that an unauthenticated user can access the API to create new services
    that could be used to inject malicious code.


    Any user can establish a connection through the Kubernetes API to serve in the
    backend. Once the connection is established, an attacker can send arbitrary requests
    to that service, and these requests are transported with the layer security credentials
    (TLS) of the Kubernetes server.


    The bug can be used in two ways: one related to a normal user with access, attack
    privileges over a group of clusters that share storage and network resources.
    You could realize privilege escalation to the cluster-admin level and execute
    any process in a container.


    The following command would allow you to discover the APIs at the cluster:


    ```

    $ kubectl get apisvers --jsonpath=''{range.items[].spec.server}{".metadata.name}"\n"}{end}''

    ```


    The RBAC policies, by default, allow requests to be made by any user, whether
    or not they are authenticated.


    https://kubernetes.io/docs/reference/auth-rbac/#discovery-rules


    Unlike an attacker who may have privileges escalation through any of the APIs
    could allow a pod to execution in specific, list the pods in a specific node,
    and execute arbitrary commands or reveal sensitive information.


    The vulnerability has been corrected by the Kubernetes development team, and it
    is recommended to update it with patched versions. The only solution for this
    vulnerability is to update Kubernetes, specifically to the patched version of
    Kubernetes v1.10.11, v1.11.5, v1.12.3, and v1.13.0-rc.


    https://github.com/kubernetes/kubernetes/issues/74111


