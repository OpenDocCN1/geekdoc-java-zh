    Reducing the container attack surface


    Reducing the attack surface is a fundamental principle of security. By securing
    the host, the container''s underlying kernel architecture

    needs attention, while still retaining general standards and particular container
    profiles.


    For example, container security depends on the Kernel and Daemon that is accessed
    through all systems. This daemon has

    smade improvements in the ability to call Seccomp profiles, these policies only
    disable certain calls, but there are others

    that are available, leaving a large number of syscalls that can be invoked without
    any restriction.


    Another example is to link the Docker daemon with the Unix Docker access group
    or the TCP port that allows containers

    tocommunicate with each other.


    The ultimate goal in security is to obtain a balance between the isolation of
    the containers, and the communication between them. This

    imply techniques to limit the number of containers that are accessible to groups
    and control the degree to which they

    interact with each other.


    Docker bench security


    Docker bench is a useful tool to test the security of your Docker containers.
    The objective is to perform the Docker CIS checks against a

    container, and a report is generated that tells you if container is potentially
    insecure at the level of permissions and access to resources.


    The tool mainly focuses on best practices in areas such as file permissions and
    registry settings. The following links are the Docker CIS benchmark

    guides, while securing machines running Docker.'
