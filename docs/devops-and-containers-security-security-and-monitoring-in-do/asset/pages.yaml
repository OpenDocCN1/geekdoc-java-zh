    secure our Kubernetes cluster and to offer the best possible performance to our
    infrastructure.


    # Kube-hunter


    Kube-hunter is a python script developed by Aqua Security that analyzes the potential
    vulnerabilities in a Kubernetes Cluster. In example, we are using the network
    scanning mode to internally review all the nodes of the cluster, although this
    tool has many more options such as active hunting or container-pod deployment.


    https://github.com/aquasecurity/kube-hunter


    Kubernetes clusters are mounted on a set of nodes or servers in which at least
    one of them has to take the role of master, and the rest are defined as workers.
    These nodes have visibility with each other to communicate. It is important to
    know that the main ports for the management of these clusters are: 443, 8080,
    10250, and 10255.


    This tool allows you to perform a vulnerability analysis in a Kubernetes installation.
    It allows remote, internal, or CIDR scanning over a Kubernetes cluster. It also
    incorporates an active exploration through which it tries to find the findings.
    It can be run locally or through the deployment'
