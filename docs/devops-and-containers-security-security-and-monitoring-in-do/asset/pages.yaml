    # Vulnerability jack in the box (CVE-2018-8115)


    This is a remote code execution vulnerability CVE CVE 2018-8115 that affects Docker
    for Windows. This vulnerability is related to the compatibility of Windows Compute
    Service Shim published and maintained by Microsoft. This service uses a filepath.Join
    function with the unauthorized entry that allows you to create, delete, and replace
    files on the host''s file system, which lead to remote code execution.


    The vulnerability is due to the fact that the file path in function is not validated
    correctly, and the destination file can be written to an arbitrary location on
    the victim''s host.


    The good news is that Docker patched this vulnerability in the Docker CE 18.03.1
    and CE 17.05.0-rc1 versions.


    Companies like Aqua Security have also created open-source tools that allow you
    to check images to see if they contain this vulnerability. To do this, the tool
    downloads an image from the registry, obtains the images, and performs a verification
    of the .tar file for each layer. The script can be found in the repository:


    https://github.com/aquasecurity/scancve-2018-8115


    It is a python script that will connect to the Docker Hub Registry and verify
    if an image, any of its layers, has any access level path to the file system that
    may exploit the CVE-2018-8115 vulnerability.


