    Container administration with portainer.io


    Portainer is an open-source tool that runs itself as a container. This application
    will allow us to manage our Docker containers very easily and intuitively through
    a graphical interface. Through a web interface, an administrator can have a clear
    overview of the containers he is running and facilitate management.


    In the Docker hub repository, you can find the official image for deploying this
    to a Docker container: https://hub.docker.com/portainer/portainer


    The easiest way is by using the following command to start a container with the
    Portainer application on port 9000 from which we can view the containers in execution
    on our Docker host.


    ```

    $ docker run -d p 9000:9000 --name portainer --restart all -v /var/run/docker.sock:/var/run/docker.sock
    -v portainer_data:/data/portainer

    ```


    The docker command options are the usual'
  merge: -1
  pgno: 231
- img_proc: true
  md: '-d for running the container as a background process.


    --name portainer to give the container name.


    -p 9000:9000 to connect port 9000 to the host with port 9000 exposed in the container.


    -v portainer-data:/data to persist the Portainer configuration on a volume outside
    the container.


    -v /var/run/docker.sock:/var/run/docker.sock make the UNIX sock in the container.


    The previous command what it is executing the container and listen on port 9000
    . Therefore, to access it, we must simply go to http://localhost:9000 in our browser.
    portainer/portainer is the Docker hub repository where we download the Portainer
    image.


    In the following screenshot we can see the output of the previous command:


    ```

    # docker run -d -p 9000:9000 --name portainer \\

    -v /var/run/docker.sock:/var/run/docker.sock \\

