  md: 'The Portainer installation can, therefore, be done by deploying it as another
    service within our cluster with the following YML file:


    ```

    $ curl -L https://downloads.portainer.io/portainer-agent-stack.yml -o portainer-agent-stack.yml

    ```


    Taking a look at the configuration file of the stack, we see that the agent is
    deployed in the global mode for the entire cluster, and the container containing
    the administration services is deployed in replication mode.


    This is the content of the YML file:


    ```

    version: ''3.2''

    ```


    services:


    agent:


    image: portainer/agent


    volumes:


    +   - /var/run/docker.sock:/var/run/docker.sock


    +   - /var/lib/docker/volumes:/var/lib/docker/volumes


    networks:


    +   - agent_network


    deploy:


    mode: global


    placement:


    constraints: [node.platform == linux]


    portainer:


    image: portainer/portainer


    command: -Http://tasks.agent:9001 --tlskipverify


    ports:


    +   - "9000:9000"


    +   - "8000:8000"


    volumes:


    +   - portainer_data:/data


    networks:


    +   - agent_network


    deploy:


    mode: replicated


    replicas: 1


    placement:


    constraints: [node.role == manager]


    networks:


    agent_network:'
