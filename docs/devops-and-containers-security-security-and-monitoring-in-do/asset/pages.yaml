    # Advise


    +   1. containers[].securityContext.runAsNonRoot = true

    Force the running image as a non-root user to ensure least privilege

    2. containers[].securityContext.capabilities.drop

    Reducing kernel capabilities to a container limits its attack surface

    3. containers[].securityContext.readOnlyFilesystem = true

    An immutable filesystem prevents malicious binaries from being added to PATH and
    increases attack cost

    4. containers[].securityContext.runAsUser = 10000

    Run as a high-UID user to avoid conflicts with the host''s user table

    5. containers[].securityContext.capabilities.drop ALL

    Drop all capabilities and add only those required to reduce syscall attack surface


