    Verifying images with content trust


    DOCKERCONTENTTRUST environment variable allows verifying images you download from
    the Docker registry or Docker hub are trusted and signed. With this you can defend
    against poisoned or injected images. For enabling this feature, you need to export
    with export DOCKERCONTENTTRUST=1.


    In the following command, we are downloading an image from the Docker hub, additionally
    verifying the image:


    ```

    $ docker pull image@sha256:a25306f5b8501bd445541976aa7b5fd0a029be

    ```


    In the previous command, we are checking the SHA256 hash of the image file system
    manifest, where a manifest is a metadata file that describes the constituent parts
    of a Docker image. The manifest file contains a list of all the layers identified
    by the hash, so if you can verify that the manifest has not been modified, you
    can download and trust all layers in a secure way, even over untrust channels
    like HTTP.


    # Resource Limitation


    The Docker service, by default, all containers share host machine resources equally.
    This means that there is no preference between containers when it comes to consuming
    resources. One of the problems that may arise, and that is why there are applications
    or software aimed at monitoring the infrastructure and following this, cause a
    denial of service to the host machine and therefore affect the entire ecosystem,
    preventing the stability of the infrastructure and cluster of containers to be
    seen, in a granular way, which


    A possible solution to resource problems that may arise is to limit each of the
    containers using the command:


    ```

    $ docker run [OPTIONS] [IMAGE] [COMMAND] [ARG]

