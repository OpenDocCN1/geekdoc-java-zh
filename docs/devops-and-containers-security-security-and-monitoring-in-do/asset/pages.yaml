    # OpenShift container platform


    Red Hat OpenShift container platform helps easily develop, deploy, and manage
    new applications in physical, virtual, and public cloud infrastructures.


    The last version is available at https://www.redhat.com/en/openshift-4/details.
    In addition to use a newer version of Kubernetes, CRI-O, the new version will
    be released as the default runtime container. CRI-O is the new container runtime
    designed for Kubernetes, executing any container image that follows the Open Container
    Initiative (OCI) standard and is compatible with Docker.


    # OpenShift Platform as a Service


    A Platform as a Service (PaaS) is a type of cloud service which is delivered where
    services and functions of an application are executed with a minimum of operational
    load for the developer. In a PaaS model, the developer focuses mainly on its code,
    leaving the hard part work to define where the application is executed, high availability,
    or maintenance of the operating system, among others.


    Red Hat OpenShift proposes a complete platform of tasks integrating Docker, Kubernetes
    as native technologies of execution and orchestration with a series of functions
    to manage permissions, storage, application life cycle, and others of the enterprise
    base in Red Hat Enterprise Linux.


    # DevOps with OpenShift


    Another important advantage is that OpenShift offers a common platform and a group
    of tools for the development teams and operations of your company. Following a
    common and continuous work and dynamics for both teams in the development and
    maintenance of applications. This allows us to eliminate processes and slow or
    manual routes, increasing the pace of work according to the needs of your company.


    OKD at okd.io is a distribution of Kubernetes optimized for community application
    development and multi-tenant deployment. OKD serves as the upstream codebase which
    Red Hat OpenShift Online and Red Hat OpenShift container platforms are built.
    For more information check documentation https://docs.okd.io/index.html


    Using the container runtime of the Kubernetes project, OpenShift has a set of
    additional functionalities that make it the ideal platform for the integration
    of DevOps environments.


    It allows the construction of traditional applications, yet also oriented to the
    code. A set of intermediate platforms for the development and deployment of applications.


    It includes tools for converting source code into running applications thanks
    to the source-image process.'
