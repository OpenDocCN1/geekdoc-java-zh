  md: 'The previous commands option be used where the standard output (STDOUT) is
    correctly configured. In some instances, the use of the above commands not be
    adequate because the data is not available in an appropriate format. In these
    cases, the following steps need to be followed:


    In the case that process is being used within a running container to handle the
    logs, it would not be advisable to use the docker commands since the required
    information will not be displayed.


    In the case that a non-interactive process such as a web server, is executed within
    the container, it could have a service that is sending logs to a file; the conventional
    outputs will not be enabled. One solution is a redirection of conventional logs.


    Below are the options to redirect and format the logs so that they can be used
    in the best possible way. There are the different drivers Docker supports:


    For any of these driver controllers, you must use the --log-driver option when
    executing the docker command. For example, to store logs in the syslog of anylinux-based
    container, we could execute:


    ```

    $ docker --log-driver=syslog nginx

    ```


    Observing logs is the most convenient way to monitor our application on the Docker
    host. You could also see the properties of the running containers, such as the
    mapped network port or the volume being mapped. It is more effective to use the
    docker inspect command to display these resources, which provides all of this
    information in the form of metadata.


    Stats in containers


    The stats command allow you to obtain statistics for one or more containers in
    execution in real-time. This command allow you to see the use of CPU, memory,
    I/O operations at the network level. The syntax for the command is follows:


    ```

    $ stats [CONTAINER]

    ```


    In the following screenshot we can see the stats commands:


    ![](img/161bb9ac63e82c972f3d17f5d111b270_202_0.png)


    The previous command works through the Docker daemon process that obtains cgroups
    resource information and serves it through the APIs.


    By default, if no containers are specified, the command will display statistics
    for all running containers.


    ```

    $ ps

    ```


    ```

    $ stats

    ```


    For example, if we have two containers running MySQL and Ubuntu, this command
    will show us the statistics of both.


    ```

    $ stats

    ```


    In the following screenshot we can see the output of the previous command:'
