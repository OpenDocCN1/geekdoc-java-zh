    With the cluster configured, the next step is to deploy Portainer. Portainer is
    deployed as a container running on a Docker Swarm cluster or a Docker host.


    To complete this scenario, deploy Portainer as a Docker Service. By deploying
    as a Docker Service, swarm will ensure that the service is always running on a
    manager, even if it goes down.


    The service exposes the port 9000 and the internal Portainer data in the directory
    /host/data . When Portainer starts, it connects using the docker.sock file to
    the Docker Swarm Manager.


