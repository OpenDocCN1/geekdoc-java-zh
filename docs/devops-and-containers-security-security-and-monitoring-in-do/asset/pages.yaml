    Auditing files and directories


    As the Docker daemon runs with root privileges, all directories and files should
    be constantly audited to know all the activities and operations that are running.
    In order to correctly audit events that take place on the host Docker, we can
    use the Linux audit daemon framework, which includes the following features:


    +   - Audit processes and file modification


    +   - Monitor system calls


    +   - Detect intrusions


    To correctly configure the audit daemon, it will be necessary to add new rules
    in the file /etc/audit/rules.d/audit.rules . Next, we will proceed to add the
    necessary rules to be audited the directories:


    ```

    Open audit.rules /etc/audit/rules.d ## Rules -w /usr/bin/docker -k docker -w /var/lib/docker
    -k docker -w /etc/docker -k docker -w /usr/lib/systemd/system/docker.service -k
    docker -w /usr/lib/systemd/system/docker.socket -k docker -w /etc/default -k docker
    -w /etc/docker/daemon.json -k docker -w /usr/bin/docker-containerd -k docker -w
    /usr/bin/docker-runc -k docker

    ```


    Figure 5.4: Configuration audit rules


    Once the rules have been added, it will be necessary to restart the audit daemon
    using the following command:


    ```

    $ sudo service audit restart

    ```


    Finally, in order to review the logs generated during the audit, they can be found
    in the path /var/log/audit/audit.log


    # Kernel Linux security and SELinux


    At this point, we will introduce SELinux which enables an additional layer of
    isolation. Security-Enhanced Linux (SELinux) is a kernel module that provides
    different security controls, among which we can highlight access controls, integrity
    controls, and role-based access control (RBAC). In addition, it provides privacy
    policies between the Docker host and containerized applications.


