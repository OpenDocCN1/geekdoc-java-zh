  md: '![](img/161bb9ac63e82c972f3d17f5d111b270_34_0.png)


    Swarm is a native cluster solution provided by Docker. With swarm, it is possible
    to manage a group of Docker host resources and schedule the containers to run
    transparently, automatically managing the workload. To do this is constantly checking
    the requirements at the resource level of the container, examining the available
    resources, moving and optimizing the location of the workloads.


    A cluster orchestrated by Docker swarm is a group of nodes that run Docker. One
    of the nodes in the cluster acts as an administrator of the other nodes and includes
    containers for the manager and the service discovery component (service discovery).


    Swarm provides high availability and continuously monitors the status of containers
    and, if any of them suffer an interruption, automatically has the capacity to
    balance the cluster, moving and restarting the containers to keep it running.


    The native swarm clustering tool groups of Docker Hosts in a single virtual host
    and the Docker API so any Docker tool that has contact with the daemon access
    swarm and can be scaled in a certain number of hosts. Users use the CLI of the
    Docker engine to create swarm, distribute applications in the cluster, and direct
    swarm behavior. This does not require additional orchestration software.


    Those Docker engines have been joined in clusters in swarm mode. This mode is
    activated to create a new cluster or add a host that already exists in a swarm.
    Each of the hosts in a cluster becomes a node, and these nodes can be as virtual
    hosts on the same local system, the most common variant of a cloud-based structure
    in which the nodes of the swarm are distributed in various systems and infrastructures.


    At the base of this software is a master-slave architecture: when tasks need to
    be distributed in the swarm, users transfer a call-shared service to the manager
    node, which acts as a master in the cluster. The master node is responsible for
    managing the containers in the cluster and as the primary interface when accessing
    swarm resources.


    Each Docker cluster consists of at least one manager node (also called administrator
    or manager) and many slave nodes (called work or workers) as swarm. While the
    master is responsible for managing the cluster and delegating tasks, the slave
    is responsible for executing the units of work (tasks or tasks). In addition,
    container applications are distributed in the selected Docker accounts.


    Swarm in practice


    In this lab /training.play-with-docker.com/swarm-stack-intro, you can introduce
    a docker swarm creating a cluster with 2 nodes. Now we are going to resume some
    of the steps.


    For creating a cluster with swarm mode, we have to start from a node to be a manager.
    We can execute the following command for initializing the swarm mode:


    ```

    [node1] (local) root@192.168.0.37 ~

    ```


    $ docker swarm initialized: current node --advertise-addr $(hostname) [vz79c4dan00b3m9p8wpu]
    is now manager.


