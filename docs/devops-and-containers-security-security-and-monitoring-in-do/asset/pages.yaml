  md: 'The great advantage of container-based virtualization is that with different
    requirements can run from each other without having to assume the overhead of
    a separate system. For this, container technology takes advantage of two basic
    functions of the Linux kernel: control groups (Cgroups) and the kernel namespaces.


    Namespaces also provide isolation for processes and mount points. In this way,
    processes in a container cannot interact or see processes that run in another
    container. The isolation of the mounting points implies that they cannot conflict
    with the mounting points in another container.


    Control groups (Cgroups) are a feature of the Linux kernel that facilitates the
    limitation of the resources at level of CPU and memory that a container can use.
    This ensures that each container gets only the resources it needs.


    # Docker daemon attack surface


    While Docker facilitates virtualization, it is sometimes possible to forget the
    security implications of the execution of Docker containers. From a security point
    of view, it is important to keep in mind that Docker requires privileges to function
    normally.


    Docker Daemon is the main process that manages the life cycle of containers and
    needs root privileges to run. Unfortunately, as the Docker daemon runs with root
    privileges, it presents an attack vector. For more details, you can get more information
    in the official documentation https://docs.docker.com/engine/security/


    The Docker daemon is responsible for managing containers, which includes creating
    file systems, assigning IP addresses, routing packets, process management, and
    more tasks that require administrator privileges. Therefore, it is essential to
    start the daemon as an administrator.


    Among the main actions we can perform on the containers, we can have high operations
    such as starting new containers, stopping running containers as well as reconfiguring
    the running containers with new commands. It is also possible to protect confidential
    information, such as passwords and certificates.


    One of Docker''s ultimate goal is to be able to run the daemon as a non-root user,
    without affecting its functionality, and delegate operations that require root
    (such as file and network system) to a dedicated thread with elevated privileges.


    If you want to expose the Docker port to the outside (to make use of the remote
    API), it is recommended to ensure that only trusted clients have access. A simple
    way is to secure Docker with SSL and certificates using HTTPS. You can find ways
    to configure this at https://docs.docker.com/articles/https


    # Security best practices


    In the following list, we will summarize the best practices when running Docker:


    It is advisable to run the Docker daemon process to use a machine with a Unix
    operating system.


    Special care must be taken to link Docker host directories as volumes since it
    is possible for a container to gain full read and write access perform irreversible
    operations on these directories.


    From the point of view of communications, the best option is to use SSL-based
    authentication.


    Avoid running processes with root privileges inside the container.


    We could use the option of enabling specific security profiles as AppArmor and
    SELinux on the host Docker.


    Unlike virtual machines, all containers share the host Docker kernel. Therefore,
    it is important to have the kernel updated with the latest security patches.


    From the point of view of system administrators, they could follow best practice
    recommendations for Linux system administration. The best practices can help create
    services with more security and improve container security:


    Do not run the software as root.


    Disable SETUID permissions.


    Use the --cap-drop and --cap-add flags to remove and add capabilities in the container.


    Use the --cap-add flag, only for the capabilities you really need.'
