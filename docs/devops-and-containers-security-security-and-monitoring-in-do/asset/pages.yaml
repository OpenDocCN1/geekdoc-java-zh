    If you have a specific metric that you want to monitor, you can write your own
    solution using or making calls to the kernel directly. You will have to use a
    language that allows you to make low-level kernel calls, such as Go or C.


    The Runtime metrics http://docs.docker.com/config/containers/metrics/ shows how
    to do it and delves into the various kernel metrics available. Once you have exposed
    the values you need, you can search for tools like statsd to add metrics, InfluxDB
    and OpenTSDB for metric storage, and Grafana to display the results.


    Obtain metrics using docker inspect


    Another way to obtain metrics is through the docker inspect command, where the
    ps -q option allows you to get the identifiers of all the containers in execution.


    ```

    $ docker stats --no-stream $(docker ps -q) | sed -e "format \{{.ID}} {{.Names}}"
    | sed -e "s/(..)/\1/s1/2t;g;"

    ```


