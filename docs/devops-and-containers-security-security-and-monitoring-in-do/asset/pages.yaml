    # Dockerfile commands


    One of the things about containers built using the automated build approach is
    that Docker will show you how the Dockerfile used to build the container, which
    provides some level of transparency over what you''re downloading (and the syntax
    is relatively basic, so easy to see what''s going on). You still need trusting
    the Docker hub and the sources of data used to build the container.


    Images are created using a series of commands, called instructions. The instructions
    are placed in the Dockerfile, which is basically a text file that contains a collection
    of changes in the root system and the corresponding execution parameters for within
    a container. Docker will read this file until the image process begins and executes
    the instructions one by one.


    The result will be the final image. Each instruction creates a new layer in the
    image. That layer then becomes the parent of the layer created by the next instruction.


    # What is a Dockerfile?


    Dockerfiles are scripts containing declared commands that will be executed successively,
    in the order, by Docker to automatically create a new Docker image. These help
    greatly during deployments.


    The Docker allows you to build an image, and this image can be uploaded to a registry
    so that it can be deployed to the servers you use to deploy your application.
    The recommended way is not to make changes to the container and then commit them,
    but to write a Dockerfile.


    # Building images from Dockerfile


    The docker build command creates the daemon to create an image, for which the
    corresponding Dockerfile must be available. If the user has not created the image
    it takes from a repository in Docker hub, then the docker pull command is executed.


    When the daemon is instructed to start a container with the docker run command,
    the program first checks if the required image is stored locally. If yes, the
    container starts (solid line). It can also happen that the daemon does not have
    the image, from which it extracts directly from the repository.


    A Docker image contains the information needed to start a container, and basically,
    consists of a file system and other metadata such as the commands to be executed,
    the environment variables, the container volumes, and the ports used by our container.
    The build of an image ends when the Docker image is uploaded to a Docker registry,
    or when the application deployment period begins.


    The main steps to create an image from a Dockerfile are:


    Create a new directory that contains the file, with the script and other files
    that were necessary to create the image.


    Create the content.


    Build the image using the docker build command.


    The syntax for the command is:


    ```

    $ docker build [options] [Dockerfile_path]

    ```


    The most common options are:


    +   -t, name [tag]: Create an image with the name and label specified from the
    instructions indicated in the file. It is a highly recommended option.

    -no-cache: By default, Docker caches recently performed actions. If it is the
    case that we execute a docker build several times, Docker will check if the file
    contains the same instructions and, if so, will not generate a new image. To generate
    a new image by omitting the cache, we will always use this option.

    -pull: Docker will only download the image from the FROM if it does not exist.
    To force you to download the new version of the'
