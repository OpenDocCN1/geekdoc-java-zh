  md: '![](img/161bb9ac63e82c972f3d17f5d111b270_140_0.png)


    Figure 6.41: Anchore engine architecture


    The architecture of the anchor engine consists of six components that can be implemented
    in a single container or in a Kubernetes cluster:


    API service: This is a central messaging interface that can be accessed via a
    script using a REST API or using the command line directly.


    Image analyzer service: This is the service executed by the worker nodes that
    perform the process of scanning Docker images.


    Catalog service: Internal database that contains the catalog of vulnerabilities.


    Waiting service: This organizes, persists, and schedules internal engine tasks.


    Policy Engine Service: Provides vulnerability analysis in accordance with policies
    and rules.


    Kubernetes Webhook Service: Services that allows validating Docker images before
    they are generated.


    Basically, the Anchore engine is provided as a Docker image that can be with other
    orchestration platforms as Kubernetes, Docker Swarm, or Rancher.


    Anchore engine allows developers to perform a detailed analysis of images, execute
    queries, generate reports, and define policies that can be used within the CI/CD
    cycle. Anchore offers the possibility of connecting to a -Jenkins pipeline, so
    when a developer uploads code in a repository like GitHub, it activates Jenkins
    to start a compilation that creates a container image, etc.


    The open-source version is highly customizable and reusable for different tasks,
    from CD/CI tasks to forensic analysis or inspection and debugging tasks. Among
    other things, it allows:


    Extract packages and components from Docker images.


    Scan for known vulnerabilities.


