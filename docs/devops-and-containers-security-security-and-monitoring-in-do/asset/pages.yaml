    # Docker''s cache


    The construction of a Docker image from a Dockerfile can be an expensive process
    since it involves the installation of a big number of libraries, and at the same
    time, it is a repetitive process because the same Dockerfile are very similar
    to each other. That is why Docker introduces the concept of cache to optimize
    the image building process.


    Each time an image is reconstructed from a Dockerfile, Docker checks if the current
    instruction has been executed correctly, and has the results of the instruction
    cached. If the results are correct and cached, Docker, by default, uses its cached
    data and reuses it with the new instruction.


    In the first way, the command is executed in a shell, /sh -c . The second way
    is useful in when the base image does not have a cache. In this way, if the process
    fails somewhere in between, the next execution is able to rebuild the partial
    changes and continue from the point where it failed.


    The first optimization that Docker cache does is the download of the base image
    of image. Docker downloads the base image if it is not already downloaded to the
    machine that builds. This optimization saves since these images can be MB in size,
    but you have to be careful, if the remote version of the image changes, Docker
    will continue to use the local version. if we want to run our Dockerfile with
    the new version of the base image, we must manually do a Docker pull of the base
    image.


    As mentioned earlier, Docker has an internal structure, similar to a git registry.
    What we know in git we call the layers of an image in Docker. An image is a succession
    of layers in a Docker registry, where each layer stores the features of the previous
    layer. This concept is important to optimize our Docker.


    For now, it is enough to know that each instruction of our Dockerfile will create
    one and one layer of our image. The Docker cache works at the instruction level.
    In other words, if a Docker line does not change, instead of recomputing it, Docker
    assumes that the layer that generates it is the same as the previous Docker execution.
    if we have an instruction such as:


    ```

    RUN apt-get update &&apt-install -y

    ```


    When executing two successful builds, the apt-get commands will not be executed,
    but the layer that generated the first build will be reused. Therefore, even before
    executing the second build, there is a new version of the Git package, the image
    built from this Docker will have the previous version of Git, which was installed
    in the first build cache. We can deactivate the use of the cache running build
    --nocache.


    It is important to highlight the following aspects about the Docker cache:


    The Docker cache is local, that, if it is the first time you run a Dockerfile
    on a machine, all Dockerfile instructions will be executed, even if the image
    has already been built in a Docker registry.


    If an instruction has changed and you cannot use the cache, the cache is invalidated,
    and the following Dockerfile instructions will be executed using the cache.


    The behavior of ADD and COPY instructions are defined in terms of the behavior
    of cache. Although these instructions do not change, they invalidate the cache
    if the content of the files being copied has been modified.


    Finally, for some reason you want to build without using the cache, you can use
    the --nocache=true flag for that purpose.


    When creating an image from the Dockerfile, there is an interesting feature that
    we can reconstruct the image using the Docker cache, so that a certain layer associated
    with a command is only rebuilt if the command has changed. The cache will be invalidated
    in these situations:


    When the docker command is executed with the --no cache flag.


    When a command that can be cached is cached, such as executing apt-get update
    command.


    If the context has changed, the first instruction invalidates the cache for all
    the instructions in the Docker file.


    For example, to force a complete reconstruction of the image without the cache,
    we can use the --nocache flag.


    Docker cache can accelerate the creation of images. The cache is used for instruction
    if:


    The previous instruction was found in the cache.'
