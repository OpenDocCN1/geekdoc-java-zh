  md: 'image, we will use this option.


    -quiet: By default, the entire process, the executed commands, and their output
    are displayed. Using this option will only show the identifier of the created
    image.


    Dockerfiles always start with the definition of a base image using the FROM instruction.
    The recommended way to build an image is to use a Dockerfile, a set of instructions
    that indicate how to build a Docker image. The main instructions that can be used
    in a Dockerfile are:


    FROM : Establishes the base image of our container.


    RUN : Allows you to execute a command in the context of the image.


    CMD : Establishes the command that the container executes on startup.


    EXPOSE: You can define ports that the container accepts connections.


    ENV var = value: To define environment variables.


    COPY : Allows you to copy files and directories to the file system of the container


    VOLUME : To define volumes in the container.


    For a complete list of available instructions, you can check the official documentation
    https://docs.docker.com/engine/reference/builder/.


    The COPY, ADD and RUN instructions add a new layer to your image. The following
    Dockerfile example creates two layers, one for each RUN command.


    ```

    FROM ubuntu

    ```


    ```

    RUN apt-get update

    ```


    ```

    RUN apt-get install vim

    ```


    A good practice is to combine several RUN instructions in a single line, so we
    would have only one layer.


    ```

    FROM ubuntu

    ```


    ```

    RUN apt-get update && apt-get install vim

    ```


    Among the instructions found in this file, we can highlight:


    FROM: The FROM instruction sets the base image for the following instructions.
    The image can be any local or public image. If the image is not found, the Docker
    compilation command will attempt to download the image from the public record.
    The tag or tag command is optional, if it is not specified, the latest tag is
    assumed by default.


    FROM:


    RUN: The RUN instruction will execute a new command in a layer at the top of the
    current image and confirm this image. The generated image will be used for the
    next instruction in the Docker file. The RUN instruction has two forms:


    RUN


    ```

    RUN ["executable", "arg1", "arg2" ...]

    ```


    The RUN instruction is only interpreted at the time the Docker build command is
    used to create an image. The purpose of the RUN instruction is to execute commands
    that modify the image in some way. For example, you can install software packages
    or create a configuration file that becomes part of the image. In this example,
    a file is created at time and then viewed by Docker :


    ```

    FROM fedora:latest

    ```


    ```

    MAINTAIN maintainer

    ```


    ```

    RUN echo "This container was built on $(date)." > /tmp/built.txt

    ```


    ```

    ENTRYPOINT ["cat","/tmp/built.txt"]

    ```'
