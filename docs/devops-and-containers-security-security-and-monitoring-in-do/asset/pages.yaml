    # Conclusion


    Docker containers present unique security challenges. There are some Docker security
    concerns to keep in mind. First, running containers and applications with Docker
    requires running the Docker daemon, which requires root privileges. Other concerns
    include container flexibility, which makes it easy to run multiple instances of
    containers. Many of these containers can be at different levels of security patches.


    Like other technology, Docker is not exempt from possible security problems. To
    minimize them, it is best to use good practices and audit our infrastructure for
    vulnerabilities. In the next chapter, we will review tools for testing the security
    of the Docker host.


    # Questions


    Which is responsible for creating and managing containers, including creating
    file systems, assigning IP addresses, routing packets, management, and many more
    tasks that require administrator privileges?


    Which is a directory that is separate from the root file system of the container
    and is managed directly by the daemon docker process and can be shared between
    containers?


    Which bits special permissions are used to access directories and files in the
    operating system by users who do not have root permissions?


    Which environment variable verify the images you download from the Docker registry
    or Hub are trusted and signed?


    Which tool allows us to manage what permissions a process has for accessing the
    kernel functions and allow segregating root user privileges?


