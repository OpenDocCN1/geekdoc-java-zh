  md: '![](img/161bb9ac63e82c972f3d17f5d111b270_203_0.png)


    With docker stats , we also have real-time statistics of all the containers running.
    The docker stats command accepts the following options:


    --no-stream: This option disables real-time statistics and will only show the
    first result.


    -a (--all): This option shows the statistics of all containers.


    Statistics can be used to see the behavior of containers during execution. The
    information can be useful to verify if we need some restrictions on the resources
    that will be applied to containers.


    Viewing records, container metadata, and runtime statistics offer many possibilities
    when monitoring running containers. We can also see what happens in the Docker
    host when it executes a command, and will issue an event that we can observe.


    $ docker stats


    CONTAINER CPU% MEM US / LIMIT MEM% NET I / O


    0.00%7.227 MIB / 987.9 MIB 0.73% 936 B / 468 B


    Basically, it provides information about the amount of CPU it consumes a container,
    the amount of memory it has in use, and limit of what it can use. You can also
    see the percentage of memory used to make it easier for the user to check how
    much free memory the container has available.


    The endpoint provides the statistics in a more detailed way in JSON format.


    For example, we can start a container and view its stats with the following command:


    ```

    $ docker run -d ubuntu:latest sleep 1000

    ```


    ```

    91c6eb7c33f7d9a91d267177feb3aa9a5a78796e3319e1b7561dc4f244

    ```


    Now that the container is running the endpoint /stats on port 2375. To access
    this information, the container identifier after executing the preceding command
    to be passed in the URL.


    ```

