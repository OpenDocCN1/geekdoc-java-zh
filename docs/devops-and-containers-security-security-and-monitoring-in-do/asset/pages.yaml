    One of the most difficult things to do when it comes to solving problems of Linux
    systems in general and container-based infrastructure, in particular, is to observe
    the data that processes and containers exchange, both at the network level and
    at the file level.


    For example, when trying to inspect network traffic, we can use tools like tcpdump.
    We can also filter by container name. With the httop command, we can see the HTTP
    requests to each of the Wordpress servers.


    ```

    $ sysdig -pc -c httop

    ```


    The following command will show all system calls executed by the Apache and MySQL
    processes, filtering only the calls that interest us:


    ```

    $ sysdig -v -A -s 2048 "proc.name=apache2 or proc.name=mysqld and ev.type!=gettimeofday
    and ev.type!=switch and ev.type!=ioevents and ev.type!=futex and ev.type!=gettime
    and ev.type!=wait and ev.type!=getsock and ev.type!=wait4 and ev.type!=select
    and ev.type!=semop"

    ```


