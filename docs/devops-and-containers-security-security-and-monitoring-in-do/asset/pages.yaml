  md: '# Creating and managing Docker networks


    Apart from using three types of networks commented before, it is possible to create
    your own network configuration to use in your Docker containers. Docker allows
    us to create different virtual networks for our needs, either to join or segment
    different containers. In this way, we can separate containers for security in
    different networks, or join them in for convenience or by connecting their services
    to each other.


    # Docker network commands


    This is a list of commands that can be used with Docker network:


    $ docker network inspect: This command lets you know the resources used by a network
    as well as its configuration.


    $ docker network ls: It shows a list of the networks that Docker has created.


    $ docker network create: It allows you to create your own network: bridge or overlay.
    Containers can communicate within their network but through networks.


    To see all options, when creating the network, we will execute the command:


    $ docker network create --help


    ![](img/161bb9ac63e82c972f3d17f5d111b270_192_0.png)


    Figure 9.15: Network command options


    In the next section, we will go into detail to create a network with the previous
    command.


    # Bridge networks


    Docker''s most frequently network is a bridge network. We could create our own
    network for the purpose we need, for example, having a subnet in a DMZ (Demilitarized
    Zone) for a database server that provides service to a website that is in a public
    network. In the following command, we are going to create a bridge docker network.


    To do this, you will have to execute the command docker network create.


    $ docker network create --subnet 10.10.1.0/24 dmz


    We could see the container assigned to the network with the docker network inspect
    command:


    $ docker network inspect'
