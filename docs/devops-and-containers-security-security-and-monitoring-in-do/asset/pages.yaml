  md: 'The original layered organization and copy-on-write strategy promotes some
    of the best practices for creating and shaping Docker images.


    Minimalist images get huge benefits from the point of view of stability, security,
    and loading time while smaller. If you need to solve problems related to development,
    you can easily install tools in a container.


    Choosing a base image: The choice of the base image is an important decision.
