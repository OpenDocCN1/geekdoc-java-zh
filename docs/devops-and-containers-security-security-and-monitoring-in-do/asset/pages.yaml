- img_proc: true
  md: 'Figure 9.12: Active connections inside the container


    With host, we can share the namespace of the host network with the container.
    By executing the command, you should see the network details inside the container
    in the same way as they are defined in the docker host.


    In the following screenshot we can see network connections inside the container:


    ![](img/161bb9ac63e82c972f3d17f5d111b270_187_0.png)


    Figure 9.13: Network connections inside the container


    Since a container is just a process that runs on a host, the simplest option seems
    to connect it to the host''s network namespace. The container will behave from
    the network point of view, just like any other process that runs on the host.
    Therefore, it will use the host''s IP address and also use the host''s TCP port
    namespace to expose the service running inside the container.


    We can run a nginx container in host mode with the following command:


    ```

    $ docker run -d --name nginx-1 --host nginx /bin/sh

    ```


    This means that if our container is a NGINX web server that is listening on port
    80 on the host. Imagine that later try to run another standard web-based service
    on the same host. Unless indicated, our second container will probably try to
    connect on the same port. But since port 80 is now being used by our first container,
    the second container cannot connect to host and will fail.


    In the following screenshot we can see the interfaces inside the container with
    host mode:'
  merge: -1
  pgno: 187
- img_proc: true
  md: '![](img/161bb9ac63e82c972f3d17f5d111b270_188_0.png)


    By executing the container with the flag --network = host , we can capture the
    traffic received by the host with pfcount command.


    ```

    $ docker run --network=host ubuntu pfcount -i eth0

    ```


    Host mode usage.


    Easy to use.


    It does not perform any operation on incoming traffic (NAT, for example), so performance
    is affected.


    Disadvantages of host mode:


    Without an additional dynamic port assignment mechanism, services can collide
    at the port level.


    The dynamic port allocation must be managed by a container orchestration platform
    such as Kubernetes or Docker Swarm.


    Containers share the namespace of the host network, which may have security implications.
    Containers that are in running state will be exposed if our Docker host is exposed
    to vulnerability.


    Network managing in Docker


    As we seen in the previous section, Docker offers us three types of networks.
    The first bridge is where all containers would start by default. A network is
    what creates a bridge between the network interface of the container that we start
    and a virtual network interface that is created on our computer when we install
    Docker.


    The next one is host mode. What it does is copy the host network configuration,
    that is, from the server or machine where our container is booting. If we start
    a container here and run the network configuration review, we will see that it
    is the same as the machine we are running.


    And finally, we have none network, what it does removes all the network configuration
    from our container. If we create a container with this configuration, we only
    have the loopback address 127.0.0.1 , and will not be able to connect to any more
    sites.


    Docker networking


    Docker uses an ethernet bridge to allow the docker daemon to communicate with
    the host''s network device. When you build a Docker container, you can identify
    the ports as exposed. A container that connects to another container with an exposed
    port can communicate with the exposed port. To make a port accessible outside
    the container, you can assign a container port to a port on the host. You have
    to keep in mind that when you, the container may be accessed from outside, is
    not enough exposing the port of a Docker container, and you need it to publish
    explicitly.'
