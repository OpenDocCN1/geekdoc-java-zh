  md: 'Isolation and minimum privilege: the containers are executed with the minimum
    resources and privileges necessary to function effectively. For this, it is important
    to limit both the memory and the use of CPU and network functions.


    Limiting the amount of memory available to a container will prevent attackers
    from consuming all the memory on the host and killing other services. Limiting
    the use of the CPU and network can prevent attackers from executing deadly service
    attacks and heavy resource processes such as Bitcoin mining.


    Access controls: Linux security modules, such as Apparmor or SELinux, are used
    to enforce access controls and limit system calls.


    Some considerations to consider in an audit process:


    Check that the images and packages in them are updated and without vulnerabilities.


    Links and volumes between containers. Using base file systems in read-only mode
    will make it easier to find problems with the docker diff command. It is important
    that our images take up as little space as possible. The larger the images, the
    more difficult the audit will be.


    The kernel of the machine where the docker server is running should always be
    updated as it is the point shared between all the containers running on the same
    server.


