  md: 'This technique allows several containers running on the same host without the
    containers having to be aware of having to any dynamically assigned port.


    Advantages of bridge mode:


    Each container runs in its own private network namespace that is separate from
    the host, which increases security.


    It allows containers to run on the same host without port conflicts.


    Simplify the use of containers on the same host as they can all run in their ports
    without conflicts


    Disadvantages of bridge mode:


    It impacts the performance and latency of the network due to the use of NAT IP
    address resolution.


    It requires configuring port mapping.


    At this point, we have reviewed the bridge type Docker network. However, sometimes,
    we don''t want to use the Docker network and directly use our host''s network.
    This is possible using the --net = host argument when we deploy our container.
    Remember that the --net argument can be used to determine which network to use
    when we deploy our container.


    # Host mode


    In this type of network, all network interfaces defined on the host will be accessible
    to the container; that is, the container shares the host''s network namespace.
    To use this type, you must execute the container with the flag --net = host:


    ```

    $ docker run -it --net=host busybox /bin/sh

    ```


    The execution of the container used by the host network shows the same one occupied
    by the network since executing the netstat command we see there are TCP connections
    in listening state on certain ports:


    ```

    $ netstat -lnp | head

    ```


    In the following screenshot we can see the output of the previous command:


    ![](img/161bb9ac63e82c972f3d17f5d111b270_186_0.png)


    Figure 9.11: Container with network configuration with host option


    In the following screenshot we can see active connections inside the container:'
