  md: 'Other methodologies such as Extreme Programming (XP) have the great advantage
    of organized and planned programming so that there are no errors throughout process.
    They are used for execution of short-term projects. It is considered a light methodology
    and focuses on cost savings, unit tests, integration of the whole system on a
    frequent basis, pair programming, simple and frequent deliveries of software that
    works.


    Testing methodologies such as B (Behaviour Driven Development), TDD (Test Driven
    Development) and ATDD (Acceptance Test Development) have acquired great importance
    in software development to help an organization to improve the efficiency of development
    successfully. These methodologies can be complemented with other techniques like
    white box and black box tests for testing performance.


    Using a microservices architecture is one of the best ways to solve the problems
    inherent in monolithic systems. This type of architecture improves the assignment
    of responsibilities in the development teams and facilitates the encapsulation
    in Docker containers, reducing the effort and risk of managing the dependencies
    of application, improving the management of updates and providing functionalities
    such as load balancing, high availability and service discovery. Containers technology
    has the advantage of sharing operating system and isolates applications by adding
    a layer of protection between them.


    Use of good practices - these good practices includes activities at correctly
    implementing DevOps and refining the problems that may arise in adapting to the
    organization.


    Record all incidents: Each incident must be reflected in a tool for further processing.


    Guarantee repeatability: Every operation should be automated as much as possible,
    providing automatic mechanisms also for the rollback to the previous state of
    a change.


    Test everything: Every change should be tested, if possible, in an automatic way.
    To automate are the integration / deployment / continuous delivery systems that
    have already been mentioned.


    Monitor and audit what is necessary: Using tools for tracking applications behavior,
    as well as incidents in the logs, is very useful for the development team to fix
    problems. In addition, there must always be a person responsible for each change
    in the system, and generic accounts must be avoided, each user must carry out
    operations in an identifiable way.


