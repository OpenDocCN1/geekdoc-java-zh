    This classification takes into consideration several factors, including the complexity
    needed to exploit a system and vulnerability impact. Lower complexity implies
    a higher score, and greater impact implies a higher score.


    # Security vulnerability classification


    MITRE is an agency that provides and maintains a CVE (Common Vulnerabilities and
    Exposures) list of vulnerabilities contained in operating systems and servers.
    The NVD database, managed by the U.S. government, details the effects for each
    vulnerability, including its affected code and possible solutions.


    For each vulnerability, NVD gives a score of 0 to 10. The range scores 7-10 are
    rated as high vulnerability, the range scores 4-6 as medium vulnerability, and
    0-3.9 as low vulnerability.


    Some examples of vulnerabilities classified by level criticality that we can find
    in docker images are:


    High criticality vulnerabilities:


    Shellshock: https://en.wikipedia.org/wiki/Shellshock(softwarebug)


    Heartbleed (OpenSSL)


    https://poodlebleed.com


    Vulnerabilities of medium criticality:


    Poodle (OpenSSL)


    https://poodlebleed.com


    Vulnerabilities of low criticality:


    Buffer Overflow: GCC memory allocations can cause an overflow buffer due to memory
    overflow when accessing memory areas that have not been assigned.


    To obtain the latest known vulnerabilities of NVD, we have a script developed
    in Python in the following GitHub repository


    https://github.com/linuxack/nvdparser


    The classification of a vulnerability is often subjective, and companies usually
    classify them depending on specific configurations or the score given by certain
    Linux distributions. For example, we can take as a reference to the score assigned
    by a given distribution. For example, for Ubuntu, we have the following list:


    http://people.canonical.com/~ubuntu-security/cve/main.html'
