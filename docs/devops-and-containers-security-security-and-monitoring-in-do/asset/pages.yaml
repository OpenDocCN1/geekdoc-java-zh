    This chapter covers topics like AppArmor and Seccomp profiles, which provide kernel-enhancement
    features in order to limit system calls. Also, we will review tools such as Docker
    bench, Lynis, and DockScan that follow security best practices in the Docker environment
    and some of the important recommendations that can be followed during auditing
    and Docker deployment in a production environment. The Docker Bench for Security
    can help test for Docker content features and access access controls.


    Analyzing the security of the docker host is also important since most of the
    attacks that can take advantage of a kernel vulnerability or because package has
