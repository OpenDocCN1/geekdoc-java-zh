    Clair scanner and quay.io repository


    Core Clair is an open-source project for static vulnerability analysis in container-based
    applications. As layers can be shared among many containers, introspection is
    vital to create a package inventory and compare it with known CVEs. Since Clair''s
    image analysis is static, it is never necessary for the containers to actually
    running, so the analysis time is greatly reduced and does not require that potentially
    vulnerable containers be.


    At the analysis level, it performs the following checks:


    Scan an image against Clair''s server


    Compare vulnerabilities against a white list


    It tells you if there are vulnerabilities that are not whitelisted


    By extracting static information from the image file system and maintaining a
    list of differences between the different layers of which the image is composed,
    the analysis time is greatly reduced and does not require that potentially vulnerable
    containers be executed.


    Clair provides a JSON API that extracts all layers of the image and can be run
    locally to inspect container images, for example, as part of a process of continuous
    integration and delivery.


