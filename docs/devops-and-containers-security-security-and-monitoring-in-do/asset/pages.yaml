    # Docker content trust


    Docker Content Trust (DCT) is a solution offered by Docker to ensure that containers
    are not compromised from a security point of view, and their origin and traceability
    are maintained.


    This mechanism allows developers to sign their content, completing the reliable
    distribution mechanism. When a user downloads an image from a repository, this
    mechanism allows you to check the signatures of the images, verifying a certificate
    that includes the public key, which allows you to verify that the image comes
    from the one that you made the upload to the docker registry.


    If you are using Docker Hub, it is very simple to use DCT exporting the environment
    variable:


    ```

    $ DOCKERCONTENTTRUST=1

    ```


    DOCKERCONTENTTRUST restricts the docker client from using only images that have
    been signed before pulling a pull. To enable this, if disabled is disabled, we
    set the DOCKERCONTENTTRUST environment variable or run Docker engine with the
    option --disable-content-trust = false.


    All keys are stored on the client-side, and only the timestamp and signature are
    stored as metadata along with the tags and image in the Docker log. If we download
    an image from a trusted repository, we see how it also checks the signature of
    the image.


    In the following screenshot, we can see the result of pulling the Python Docker
    image with docker content trust enabled:'
