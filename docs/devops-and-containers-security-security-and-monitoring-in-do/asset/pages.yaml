    # CHAPTER 3


    # Managing Containers and Docker Images


    This chapter covers topics related to how Docker manages images and containers,
    the main commands used for generating our images by Docker, and how we can optimize
    our images minimizing the size of images and, in consequence reducing the attack
    surface.


    The images are read-only templates that we can use as a base to launch containers.
    This means that whatever we do in the container only persists in that container
    these modifications are not done in the image. If we want to have a personalized
    image, we must create it for our future containers. In this chapter, we will see
    how we can create an image from a container that we have already customized.


    # Structure


    +   Managing Docker images


    +   Dockerfile commands


    +   Managing Docker containers


    +   Inspecting Docker images


    +   Optimizing Docker images


    +   Objectives


    +   Understanding the concept of managing Docker container and images


    +   Understanding Dockerfile commands and best practices for optimizing


    +   Knowing about Inspecting containers


    +   Knowing about optimizing Docker images


    +   Managing Docker images


    A Docker image is a frozen or inheriting system, which is in a read-only mode.
    The images are formed by layers that are mounted on top of each other. All layers
    are mounted in read-only mode, except the last layer that is mounted as read/write
    and gives rise to the container.


    A container is nothing more than a running image, so when you run the image, Docker
    adds a layer on the image in a read/write mode. When the container stops or is
    deleted Docker automatically removes the read/write layer leaving the image in
    its original state. This allows you to reuse the same image in several environments.


    # Introducing Docker images


    If we download an image using the pull command and save it, we can see that an
    image is a set of directories and files with a specific structure, where each
    folder refers to one of the layers of which it is formed the picture. Within each
    layer, there are some files to reference the said layer and a compressed file
    with the system that will form the image.


    ```

    $ pull alpine

    ```


    ```

    $ save alpine -o alpine.tar

    ```'
