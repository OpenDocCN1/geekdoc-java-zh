    # CoreOS Clair


    Clair is a container vulnerability analysis service. It works through an API that
    analyzes each layer of the container for vulnerabilities in Debian, Ubuntu, and
    CentOS databases. It can also be used from the command line, as we see here. This
    tool has the capacity for reporting the list of known vulnerabilities that affect
    each container and notify users.


    The methodology for using this tool is by command line. Basically, it extracts
    all the layers of the image and notifies the vulnerabilities found and stores
    them in a database. It manages its own database that it updates from sources known
    as CVE.


    https://github.com/coreos/blog/vulnerability-analysis-for-containers/


    https://coreos.com/blog/vulnerability-analysis-for-containers/


    Clair is the security engine that uses the https://quay.io registry internally.


    # Dagda: The security tool


    Dagda is an open-source tool, developed in Python to perform static analysis of
    known vulnerabilities in Docker images/containers. It also helps you monitor running
    Docker containers for detecting anomalies.


    Dagda retrieves information about the software installed in your Docker image,
    os the packages, library dependencies, modules, and matches it against a vulnerability
    database. This database is created by colliding vulnerability data from sources
    such as NVD, SecurityFocus BID & Exploit-DB into a MongoDB database.


    The database also stores your static analysis scans performed on the Docker images
    and their result for a duration that you specify.


    The project can be found in the GitHub repository: https://github.com/eliasgruberdio/dagda.


