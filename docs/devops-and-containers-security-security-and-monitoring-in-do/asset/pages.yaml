  md: 'of known vulnerabilities. This is done by software in the Docker repositories
    that have the capacity to realize a static analysis of images.


    In this chapter, the reader will learn about analysing the security of docker
    images and discover vulnerabilities through the study of a series of static analysis
    tools of the different layers that compose an image. As a result, developers will
    have the capacity to detect vulnerabilities in container applications before uploading
    them to production.


    # Structure


    +   Docker hub repository


    +   Docker security scanning


    +   Open-source tools for vulnerability analysis


    +   Clair scanner and quay.io repository


    +   Analyzing Docker images with anchor engine and anchor ci


    # Objectives


    +   Knowing about Docker hub


    +   Understanding Docker security scanning


    +   Knowing about open source tools for vulnerability analysis


    +   Knowing about Clair scanner and quay.io repository


    +   Knowing about anchor engine and anchor ci for vulnerability analysis


    +   Docker hub repository


    Docker Hub is a repository of images created by the community, in which any user
    can create their image and upload it to the repository to share it with the community.


    Within this chapter, there are 2 types of images, depending on their origin. First
    of all, we have the official images that are the ones maintained by the main suppliers
    like Apache, Nginx, MongoDB, Ubuntu, Alpine.


    On the other hand, we can find the images that have been created by users, and
    therefore, they are images that have been customized and adapted to their needs
    for the project. Most likely, it has been customized from an official image.


    # Docker security scanning


    Docker Security Scanning is a service available in Docker Hub for private repositories
    that compares the contents of a container layer by layer, inspecting the binaries
    in container against the Common Vulnerabilities and Exposures (CVE) database.


    Alternative open-source tools are available, all of which function in the same
    way:


    Scan the image, separate the layers, and build a comprehensive manifest.


    Get the different layers that make up the manifest''s content with the CVE at
    the package level.


    Compare the images with the CVE and NVD server list of known vulnerabilities.


    This scanning tool''s effectiveness depends on:


    Static analysis depth and integrity; the scanner''s to discover the image''s inner
    layers and the nature of those layers.


    Vulnerability feeds quality; indicates coverage and how much vulnerability lists
    need to be updated.


    For reducing false positives, you can use white lists.


    In the next section, we are going to start with the Docker security scanning process
    that allows you to start a review process of images in Docker hub repositories.


    The Docker security scanning process'
