    These tools allow you to remotely locate managing containers, start them, stop
    them, how to restart them, them paused, rename them, delete them, and create containers,
    create images, lift networks, monitor logs and progress (CPU, memory, network
    use, processes, ...), run a console to access them, with volumes and other interesting
    features.


    # Conclusion


    In this chapter we have reviewed Rancher and Portainer source tools for managing
    your Docker containers, images, volumes, networks. These tooling are compatible
    with the Docker engine and with other orchestration platforms like Docker Swarm
    and Kubernetes.


    Once you enter the world of containers, there are many tools we can use in the
    Docker ecosystem, but I believe Rancher and Portainer are the fastest, easiest,
    and best-supported options in the DevOps community.


