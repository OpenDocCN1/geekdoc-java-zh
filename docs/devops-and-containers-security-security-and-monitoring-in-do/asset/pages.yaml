  md: 'For example, if you expose a port, the service in the container is only accessible
    from other Docker containers. So, this feature provides inter-container communication.
    If you publish a port, the service in the container is accessible from anywhere,
    outside Docker.


    One way in which Docker provides a container with its own machine is the fact
    that Docker provides the container process with its own IP address. Docker does
    this by configuring a virtual interface and linking it to the host''s network.


    When we install Docker, we can see that it creates an interface called docker.
    It has a private IP address, probably this one, if it does not collide with any
    other IP address that you have configured. And when we create some type of container
    that connects to the bridge network, what does it receive an IP address from DHCP?


    All your containers do NAT through this IP and the IP output of the host machine
    or on which you have Docker installed. This is your default network. In the same
    way, you can connect from here this interface and this IP address to the IP addresses
    of the containers that you are running on this network.


    Among the network configurations that can be established when we execute a container,
    we can highlight:


    +   --dns: A DNS server that resolves a URL, such as http://docker.io , to the
    IP address of the server running the instance.


    +   --dns-search: Set up DNS search servers.


    +   -h: Set the hostname. This adds as an entry in the /etc/hosts file with the
    container IP pointing to the host.


    +   --link: Allows a container to communicate with other containers without knowing
    their real IP addresses.


    +   --expose: Expose the container port without publishing it to the host.


    +   --publish: Lets you publish the port of a container in the following format:


    ```

    hostPort:containerPort|ip:containerPort|hostPort:containerPort

    ```


    +   --net: This option allows you to configure the network mode for the container,
    as we have seen in the previous section. It can contain four types:


    +   bridge: This creates a network stack for the container in bridge mode.


    +   none: The container will be totally isolated and cannot communicate with any.


    +   container: use the network stack of another container.


    +   host: use the docker network stack.


    From a point of view, you can provide an IP-based service to other containers
    or applications. For doing this, you could expose the port used by the service.
    For example, apache web server container should expose ports 80 and 443 , as illustrated
    in the following Dockerfile example:


    ```

    FROM fedora:22

    ```


    ```

    MAINTAIN maintainer

    ```


    # Update the system


    ```

    RUN yum -y update, yum clean all

    ```


    # Install httpd


    ```

    RUN yum -y install httpd

    ```


    ```

    EXPOSE 80 443 ENTRYPOINT /usr/sbin/httpd

    ```


    For any practical implementation when dealing with ports, I suggest using port
    publish rather than port expose using the -p parameter to publish these ports.
    For example, if you want the container port 80 to be available in port 8080 of
    the local machine when you run the container, you need to specify:'
