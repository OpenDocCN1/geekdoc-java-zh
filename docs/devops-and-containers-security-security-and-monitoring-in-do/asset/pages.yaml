    Introducing container network types


    Docker networking is based on the NET namespace, which allows you to generate
    a complete communications stack for each image running within the Docker host.
    In a machine where Docker is running, there are 3 network configurations. When
    we launch a container or set of containers that form a distributed service, we
    have the option to choose between these network modes.


    Types of Docker networks


    It is possible to change the network mode for a container using the --net parameter.
    With this parameter, you can use the default bridge ( docker0 ), a different bridge,
    or not provide access to the network at all. Here are examples of ways to use
    the --net option:


    Default network bridge: --net = bridge creates a new network stack for the container
    in the Docker bridge called docker0 . This is the default behavior.


    Without network connectivity: --net = none allows you to run the container without
    any network connection. The container is isolated from the network.


    Network of another container: --net = mycontainer informs the stack with the capacity
    for using the container’s network stack.


    Host network: --net = host means that the container uses the host network stack
    directly from inside the container.


    There are three different types of networks in Docker. To do this, you can execute
    the docker network command:'
