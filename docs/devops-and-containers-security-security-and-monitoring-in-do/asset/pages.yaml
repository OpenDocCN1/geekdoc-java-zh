    Among the checks carried out by Docker bench, we can highlight:


    Host configuration: This section checks the security over the host configuration.


    Daemon configuration: This section offers recommendations about the security of
    the docker daemon. Everything in this section affects the configuration of the
    Docker Daemon as well as each running container.


    Daemon configuration files: This section shows information about the configuration
    files used by the daemon docker. This ranges from permissions to properties. Sometimes,
    these areas may contain information that you do not want others to know, which
    could be in a plain text format.


    Daemon configuration: This section shows information about the Docker daemon configuration
    and has the capacity for detecting containers that are running on the same Docker
    host and checking each other''s network traffic. By default, all containers that
    run on the same Docker host have access to each other''s network traffic.


    Also, it has the capacity for detecting if the Docker container is running as
    a root user. In this case, it shows a recommendation to create a user for the
    container.


    Also, it shows a warning message if you are aware many capabilities the Docker
    container is not using (privileged).


    Below are some examples of warning messages that the report shows and recommendations
    for action for each message.


    Docker daemon settings


    [WARN] 2.2 - Restrict network traffic between containers


    By default, all containers that run on the same Docker host have access to each
    other''s network traffic. To avoid this, you must add the flag --icc = false in
    the process of starting the Docker daemon.'
