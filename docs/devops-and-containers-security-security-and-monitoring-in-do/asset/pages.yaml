    Container statistics, metrics and events


    There are several ways to control the execution of Docker containers. It is possible
    to visualize the logs, observe the events and statistics of the container at the
    level of memory usage and CPU. Let''s see what Docker offers when we want to visualize
    the logs that are recorded when we execute a container.


    # Log management


    Most applications send logs to the standard output. If the container is running
    in the foreground, you can see the logs directly in the console. However, when
    running a container in background mode, only the container identifier (ID) will
    be displayed on the console.


    Log management is one of the most important tasks in the world of security, it
    allows monitoring what is happening inside containers. Different containers will
    run simultaneously in the same Docker host, and each of them can generate their
    own logs; therefore, the centralized management of the logs is necessary.


    There are several commands for monitoring the logs:


    ```

    $ docker logs

    ```


    ```

    $ docker service logs

    ```


    In this case, the Docker engine collects in a log file all the standard output
    of a running container. We can visualize the execution log of a container with
    the following command:


    ```

    $ docker logs -f

    ```


    In the following screenshot we can see the logs options:'
  merge: -1
  pgno: 200
- img_proc: true
  md: '# Figure 10.1: Docker logs command option


    The way this works is logs sent to the standard output or error output in the
    container are captured by the Docker daemon process and transmitted to a configurable
    backend, which is by default a JSON file for each container. In this example,
    we can see the log output of an nginx container.


    ```

    $ docker logs nginx

    nginx stderr | 2019/11/09 00:34:56 [notice] 12#0: using the "epoll" ...

    nginx stderr | 2019/11/09 00:34:56 [notice] 12#0: nginx/1.0.15

    nginx stderr | 2019/11/09 00:34:56 [notice] 12#0: built by gcc 4.4.7 ...

    ```


    The files that support this log are located on the Docker host by default in the
    path /var/lib/docker/containers/ where it is replaced by the container identifier.
    The format of these files is similar to one where each line is represented by
    a JSON object.


    In the following screenshot, we can see the path logs are located for each container:


    ![](img/161bb9ac63e82c972f3d17f5d111b270_201_0.png)


    # Figure 10.2: Path logs are located for each container


    By default, logs are stored in a JSON file located in the path /var/lib/docker
    . This behavior can be changed since Docker uses the concept of registry drivers.
    By using different controllers, it is possible to choose another type of storage
    for logging. The default driver is the JSON file, which accepts the following
    configuration:


    ```

    --log-opt max-size = [0-9+] [k | m | g]

    --log-opt max-file = [0-9 +]

    ```'
