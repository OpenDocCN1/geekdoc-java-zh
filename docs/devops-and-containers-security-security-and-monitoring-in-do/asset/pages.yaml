  md: 'CAPYSNICE: For modifying the system processes.


    CAPSTIME: For modifying the clock.


    CAPYSTTY_CONFIG: For configuring TTY devices.


    CAPAUDITCONTROL: For configuring the audit subsystem.


    Thanks to this granularity the capabilities provide and the fact of not needing
    to acquire the root identity, they are a very useful method to execute privileged
    programs with the minimum necessary permissions. These facilities provide them
    a very important security element in many systems. In this way, the capabilities
    are used in virtualization environments such as Linux or Docker containers, where
    they play a fundamental role in the management of security contexts.


    ![](img/161bb9ac63e82c972f3d17f5d111b270_71_0.png)


    Figure 4.7: Linux capabilities


    The Linux kernel prefixes all capability constants with CAP_ prefix . For example,
    CAP_CHOWN makes changes in bits UIDs and GIDs to change the owner of a file.


    Listing all capabilities


    The Linux libcap packages incorporate commands and binaries for listing and managing
    capabilities, among which we can highlight:


    +   getcap: Allows listing capabilities of a file.


    +   setcap: Allows assigning deleting capabilities of a file.


    +   getcaps: Allows listing capabilities of a process.


    +   capsh: Provides a command-line interface for testing and exploring capabilities.


    We can get any of the capabilities enabled by the capsh command that provides
    a command-line interface testing and exploring capabilities:


    +   CAPAUDIT/WRWRITE allows writing access to the audit log


    +   CAPAUDIT/TCONTROL allows configuring the Linux audit subsystem'
