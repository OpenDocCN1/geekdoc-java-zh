    Preface


    In the few years, the knowledge of DevOps tools IT companies has increased due
    to the growth of specific technologies based on containers such as Docker and
    Kubernetes. Docker is an open containerization tool that makes it easier to streamline
    product delivery and Kubernetes is a portable and extensible open source platform
    for managing workloads and services. The primary goal in the development of this
    book is to create a theory and practice might that emphasizes core concepts of
    DevOps, Dockercontainers, and Kubernetes clustering from a security point of view.
    This book is helpful to learn the basic and advanced concepts of Docker containers
    from- This book is divided into 11 chapters and provides a detailed description
    of the core concepts of DevOps tools and Docker containers.


    Chapter 1 introduces DevOps methodologies and tools as a new movement that tries
    to improve the agility in the process.


    Chapter 2 introduces main Platforms such as Docker Swarm, Kubernetes, and OpenShiftthat
    a common tooling for both development and operations teams.


    Chapter 3 discusses Docker manage and containers, the main commands used for generating
    our images, and how we can reduce the attack minimizing the size of Docker images.'
  merge: -1
  pgno: 2
- img_proc: true
  md: 'Chapter 4 covers such as security best practices and other aspects like Docker
    capabilities, which containers leverage in to provide more features such as the
    privileged container.


    Chapter 5 covers topics such as AppArmor and seccomp profiles that provide kernel-enhancement
    features in order to limit system calls. Also, we will review tools as Docker
    Bench Security and Linux that follow best practices in the Docker environment.


    Chapter 6 covers oversource such as Clair with the query.io repository and Anchor
    for discovering vulnerabilities in Docker images.


    Chapter 7 discusses topics as Docker Container features and system attacks, which
    can make an impact in Docker applications like exploits that could target running
    containers. Also, we review specific CVE in Docker images and how we can get details
    about specific vulnerability with the Vulner API.


    Chapter 8 introduces Kubernetes Bench for the Security project as an application
    that checks whether Kubernetes is implemented securely by executing the controls
    documented in the CIS Benchmark guide.


    Chapter 9 introduces the essential components of Docker networking, including
    how we can communicate and link Docker containers. Also, we will review other
    concepts like port mapping that Docker uses for exposing the TCP ports that provides
    services from the container to the host.


    Chapter 10 talks about some of the open source tools available for Docker monitoring
    as advisor, dive, and sysdigflow.


    Chapter 11 introduces some of the open source tools for Docker container administration
    as rancher and portierio.


