  md: 'Linking containers within the same host with --link


    Links between containers are based on their names, so it is often useful to use
    meaningful names to name our containers. Network connections between containers
    is another system to establish connections between containers and use it for data
    exchange.


    What we are going to see here is how to establish containers using this linking
    system. In this linking system, one container acts as a data source and the other
    receiver container. This is similar to the concept of pipe in Unix.


    The link allows a container to communicate with another without knowing its IP
    address. This is achieved by inserting the IP address of the first container in
    the /etc/hosts file of the second container. In order to link, the variable -link
    will be used when creating a container with the command:


    ```

    $ docker run --link=$name -h

    ```


    Using the --link flag, Docker adds an entry to the /etc/hosts file of the container,
    with the hostname, the IP address of the container, and the identifier.


    We could create an elasticSearch container with the command:


    ```

    $ docker run -d --name elasticSearch elasticsearch:2.2

    ```


    Next, we run ubuntu container using the link tag to connect our container with
    the elasticsearch we created previously.


    ```

    $ docker run -it --name ubuntu --link elasticSearch:elasticsearch ubuntu:10.04
    bash

    ```


    After executing the previous command, we can check how we have connectivity between
    the ubuntu container and elasticSearch . Not between elasticSearch and Ubuntu,
    since the links are established in the sense of a source container and a destination
    container in a unidirectional way.


    What is happening here is that Docker creates a secure tunnel between both containers,
    preventing the ports of both are exposed outside the container and are accessible
    from our host or any other container.


    In this screenshot we can see the content of the /etc/hosts file inside the Ubuntu
    container:


    | 127.0.0.1 localhost |

    | :1 | localhost ip6-localhost ip6-loopback |

    | fe00::0 ip6-localnet |

    | ff00::0 ip6-mcastprefix |

    | ff02::1 ip6-allnodes |

    | ff02::2 ip6-allrouters |

    | 172.17.0.2 elasticSearch 3f7c7e796cd5 |

    | 172.17.0.3 a05699ed73ab |


    ![](img/161bb9ac63e82c972f3d17f5d111b270_197_0.png)


    When we create a link, Docker is responsible for updating the /etc/hosts file
    in order to access the container on which we establish the link. If we go to the
    contents of the /etc/hosts file of the Ubuntu container, we can see the reference
    to the elasticSearch container.


    Environment variables


    In addition to the /etc/hosts file, Docker creates in the container where we establish
    the link some environment variables with the information of the other container
    ( elasticSearch ). Among the information that Docker makes available using environment
    variables is the IP of the other container, in this case, the elasticSearch :


    For example, if we look at all the environment variables of the Ubuntu container,
    we will see all related elasticSearch :


    ```

    root@a05699ed73ab:/# set | grep -elasticSearch

    ```


    In the following screenshot we can see the output of the previous command:'
