    DevSecOps means thinking from the beginning about the security of applications
    and infrastructure. It also involves automating some security doors to prevent
    the DevOps workflow from slowing down. Selecting the right tools to integrate
    security continuously can help you achieve your security goals, but security DevOps
    requires more than tools; it is built by a culture of DevOps to integrate the
    security of the security teams as possible.


    In part, DevOpsSec highlights the need to invite security teams from start of
    DevOps initiatives to develop information security and establish a plan for security.
    It also underlines the need for help developers develop security in mind, is that
    involves security teams sharing visibility, comments and information about known
    threats. This may also include new security training for developers, as traditional
    application development has not emphasized security.


    The adoption of DevOps practices means more collaboration between development,
    QA, IT, and operation teams, and more in-progress adoption of continuous integration
    or continuous delivery. This provides a good foundation to work to DevOpsSec.
    The diagram below shows the security involved with development, QA, and operations
    throughout the CI/CD lifecycle.


    ![](img/161bb9ac63e82c972f3d17f5d111b270_24_0.png)


