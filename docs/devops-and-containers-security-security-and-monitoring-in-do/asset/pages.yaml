    Container monitoring with Sysdig falco


    From the perspective of monitoring docker containers with this tool, we can control
    the behavior of the containers. Sysdig Falco allows you to monitor all activity
    of containers, applications, and networks, as we would do with a combination of
    Unix tools such as Snort, tcpdump, htop, iftop, isf and strife.


    Sysdig Falco policies are a collection of rules that act directly on the flow
    of kernel system calls. These are the behaviors that Sysdig Falco can detect:


    A shell that runs inside a container.


    A process, in turn, generates another process with unexpected behavior.


    Reading a confidential file, for example, the user file and passwords /etc/shadow.


    A process is using a file that is not a device type in the /dev path, indicating
    a potential rootkit.


    Behavior monitoring


    Sysdig Falco focuses on the level of behavior, which allows gaining visibility
    within the containers through the instrumentation of system calls. The call instrumentation
    of system is completely transparent to the containers in execution, so it is not
    necessary to modify code or images. The interception of system calls is done through
    a kernel module that is compiled dynamically.


    When any abnormal activity is detected, a security event is emitted, such as an
    alert. The conditions that trigger the alert are defined by policy, a collection
    of rules whose syntax is and works similar to calls to tcpdump.


    We can combine different functions from various sources such as events, metadata,
    and process information:


    System events: evt.type= listen..., evt.type= mkdir, evt.type= sets


    Docker metadata: container.image, container.privileged, container.name


    Process tree information: proc.cname, proc.cmdline


    For example, we can create a Falco rule that detects any connection except outside
    our listening context, when:


    The image of the container is nginx.'
