    # Conclusion


    The host machine can be defined as the most important part of the Docker environment
    where the entire infrastructure is supported and where the containers will be
    executed, which is why it is advisable to follow a set of good practices when
    we are going to configure the machine where they will be hosted, and we will execute
    the different


    The ultimate goal is to minimize the attack vectors that can be produced on the
    Docker Host. If containers from different clients are running on the same host,
    the breach of one of those containers could leave them exposed to the other containers.
    Because all the containers that run on the same Docker share the same execution
    kernel, it makes sense to spend time checking the core of it.


