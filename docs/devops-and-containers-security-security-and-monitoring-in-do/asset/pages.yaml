  md: 'Docker scanning is the tool that integrates with the official docker hub repository
    and allows you to automatically review images found in public repositories and
    records in Docker Hub or Docker Cloud for known vulnerabilities.


    Docker maintains a service in charge of searching for known vulnerabilities and
    uses the CVE database (cve.mitre.org) to find in our libraries, binaries, and
    exploits that run on. This service is available for Docker hub private, in Docker
    cloud and on-premise, in all cases a paid service, there are third-party services
    that offer similar functionality for free.


    More information in documentation: https://docs.docker.com/datacenter/dtri/2/guides/configure-set-vulnerability-scans.


    Periodically, Docker analyzes all the images uploaded to the Docker hub, and once
    the analysis is finished, it provides you with a result of the different vulnerabilities,
    as well as the level of criticality of these, in addition to forming the CVE of
    each.


    In the following screenshot we show the output of analyzing layers in a Docker
