    # Docker swarm


    Swarm https://docs.docker.com/engine/swarm is the solution provided by Docker
    to the problems of developers when it comes to orchestrate and contain through
    many servers. Swarm was born with the Docker engine from version 1.12.0 and offers
    many advanced integrated features as service discovery, load balancing, and scaling.


    Docker Swarm is an open-source native clustering tool for Docker. It converts
    a pool of Docker hosts into a single, virtual Docker host. As Docker swarm serves
    the standard Docker API, any communicating with the Docker daemon can use Swarm
    to scale to multiple hosts.


    Swarm follows Docker''s philosophy of focusing on the simplicity and experience
    of the developer. You could say it''s easier to use than other solutions like
    Kubernetes, but not as powerful and not so adopted by companies, cloud providers,
    or the community.


    The main elements of the swarm architecture:


    Swarm master: Responsible for the entire cluster and manages the resources of
    several hosts Docker.


    Swarm nodes: Each node of the cluster must be accessible by the Master. Each node
    executes an agent so that it registers the Docker daemon referenced, monitored,
    and updates the backend with the state of the node.


    Swarm discovery: By default, Sw uses a discovery service, based on Docker Hub,
    using a token to discover the nodes that are part of a cluster. It also supports
    other discovery services such as etcd, Consul, and Zookeeper.


    Swarm strategy: Swarm has multiple strategies for the classification of nodes.
    When a new container is executed, the swarm decides to place it in the node with
    the highest-ranking calculated for its chosen strategy.


    Swarm networking: It is fully compatible with the new network model (overlay)
    of Docker.'
