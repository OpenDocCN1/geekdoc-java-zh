    # Continuous integration with Docker


    The scan can be easily integrated into continuous development and workflows where
    scanning can be started every time a developer develops a new container. Most
    administrators generally discover a new vulnerability that is of high criticality
    by consulting the CVE database. The lower critical vulnerabilities may not be
    discovered. The scanner operates the process of identifying vulnerabilities that
    are not critical but could be exposed by attackers.


    If a problem is discovered in the base image, and image is reconstructed. Once
    the completion, the image is sent to the container platform. The platform can
    detect that the image has changed. For constructions that depend on this image
    and have defined triggers, the platform allows you to automatically reconstruct
    the image of the application, incorporating libraries that have been changed during
    the reconstruction process


    Once the completion, the image is sent to the internal registry, and for applications
    that use it base image is automatically implemented, ensuring that the code which
    is executed in production is the most recent update. All these capabilities work
    to integrate security capabilities into a process of continuous integration and
    continuous deployment (CI/CD).


    When a developer updates the code to the source code repository, it atomically
    displays the newly constructed image to test. You may have to build the image
    and deploy (deploy) the new image automatically through the CI process.


