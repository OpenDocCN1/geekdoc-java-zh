  md: '![](img/161bb9ac63e82c972f3d17f5d111b270_205_0.png)


    Figure 10.7: Docker stats with docker event inspect


    To observe the events that arrive at the Docker engine in real-time, we use the
    docker events command. This command can be useful if we want to know what happened
    during the runtime of the container. Containers represent a large list of events.


    The list includes the following commands: attach, commit, copy, create, destroy,
    detach, die, execcrate, execdetach, exec_start -


    The event command has the -f filter parameter, which allows you to filter the
    result if you are looking for something specific. If no filter is provided, all
    events will be reported.


    Calling the events command will show what activities occur in Docker, processes
    that are running in real-time for tracking almost all actions and system calls
    captured events.


    The list of possible filters includes:


    +   - container(container=)


    +   - event(event=)


    +   - image(image=)


    +   - plugin (experimental) (plugin=)


    +   - label (label= label=)


    +   - type (type=)


    +   - volume (volume=)


    +   - network (network=)


    +   - daemon (daemon=)


    You can use the --since or --until option with Docker events to filter the results
    from a timestamp or timestamp:


    --since = "Date": Show all events created from a date


    --until = "Date" Show all events created up to a date


    For example, the following command shows events from starting the year 2020:


    ```

    $ docker events --since ''2020-01-01''

    ```


    We can also obtain the events of a specific container from its identifier ID:


    ```

    $ docker events --filter container=

    ```


    In this screenshot we can see the output of applying date and filter conditions:'
