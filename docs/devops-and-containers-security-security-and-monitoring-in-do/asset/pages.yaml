  md: '![](img/161bb9ac63e82c972f3d17f5d111b270_43_0.png)


    When an image is extracted and mounted in read/write so that it can be usable,
    what is done is to decompress the content of each layer in order from the last
    one, which corresponds to the base image, thus generating a file system whose
    content is built or modified incrementally with each layer.


    The last that is mounted in read/write mode is the one that differentiates one
    container from any other from its base image. All the structures that are made
    on a container that they do add new data or modify the existing data in the last
    layer. When a container is removed, the writing layer is also deleted, but the
    base image remains unchanged.


    An image is a permanently stored instance of a container. The Docker images show
    the images on your system. You can assign multiple aliases (including names and
    tags) to the same image whenever it is useful.


    If you can saved containers that are no longer running with the docker ps -a command.
    You can see containers running with the docker ps command.


    You can see saved containers that are no longer running with the docker ps -a
    command. You can restart a container; you can use the docker start command. You
    can stop running a container with the docker stop command.


    # Docker layers


    Layers are like Git confirmations and store the difference between the previous
    and current version of the image. And like Git commits, they are useful if you
    share them with other repositories or images. In fact, when you request an image
    of a record, download only the layers that you don''t have to your machine locally.
    This way, it is much more efficient to share images.


    The layers use space, and the more layers you have, the thicker the final image
    will be. Git repositories are similar in regard. Because Git stores all changes
    between commits, the size of your repository increases with the number of layers.


    We can see the layers of an image with the command $docker image history . In
    this example, we are obtaining layers from Python image.'
