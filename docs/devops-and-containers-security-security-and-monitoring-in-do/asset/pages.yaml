    Buffer overflow is a common vulnerability in web servers when an application places
    to more data in a buffer that was designed to retain. In the case of a buffer
    overflow, a programmer creates a buffer in the code but does not place restrictions
    on it. The data must go somewhere, in which case, means adjacent buffers. When
    overflows occur, the result may be corrupted or overwritten data.


    Access complexity: This metric analyzes the complexity of the attack required
    to exploit the vulnerability once an attacker gains access to the system. For
    example, consider a buffer overflow in Internet service, the target system is
    located, the attacker could induce an exploitation process.


    Authentication: This metric analyzes the number of times an attacker must authenticate
    to a target to exploit a vulnerability. This metric measures that an attacker
    is required to provide credentials before the vulnerability occurs. The further
    authentication instances required, the higher the vulnerability score.


    Confidentiality impact: This metric measures the impact of the confidentiality
    of a successfully exploited vulnerability. Confidentiality refers to limiting
    access and disclosure of information to authorized users only, as well as preventing
    access by unauthorized users. The greater the impact of confidentiality increases
    the vulnerability score.


    Integrity impact: This metric measures the impact on the integrity of a successfully
    exploited vulnerability. The greater the impact on integrity increases the vulnerability
    score. For, if an attacker can modify any file in the target system, at this point,
    we have a very high score.


    Another vulnerability that affects Docker contain with root permissions is discovered
    in run: the utility to run containers of the open containervis, by which it is
    possible to obtain root permissions on the host machine that is running the container.


    For the exploitation of vulnerability, only one container is necessary, which
    will winerate the binary of the host machine. The attack is not blocked by AppArmor''s
    default policy, like SELinux''s systems like Fedora. However, the enforcing mode
    with a correct configuration of the namespaces (as happens by default Red Hat),
    the attack is blocked.


    The vulnerability has been identified with CVE-2019-5736, and there is already
    a patch available that corrects the bug. If it is not possible to patch, a possible
    solution is to configure SELinux to prevent exploitation.


    More information about the vulnerability in https://seclists.org/oss-sec/2019/q1/119.


    Dirty Cow Exploit (CVE-2016-5195)


    Dirty Cow (CVE-2016-5195) is a privilege escalation vulnerability in the Linux
    kernel, and it allows any user without privileges to perform an elevation of administrator
    privileges. it creates a race condition between processes to enter the kernel
    and modify files.


    COW (on Write) is a technique used in UNIX systems to reduce duplication of objects
    in memory. When using the Race condition, the user with minimal privileges will
    modify the read-only objects, which within the ideal case should not occur. The
    main recommendation is to verify the version of your kernel and update it if it
    detects a vulnerable version.


    The vulnerability in Dirty Cow is a vulnerability that exploits the contents of
    the memory while the kernel is executing system calls (syscalls) to perform actions
    in the same memory address space.


    The vulnerability opens a file that only the root user with read-only permissions
    has access and tries to write some content to the file. Normally this is denied
    by the privilege hierarchy, but the exploit allows opening the file in a read-only
    segment in memory.


