  md: 'Among the best security practices for your Kubernetes cluster, we can highlight:


    Use the minimum privilege principle for your service accounts.


    Disable Kubernetes dashboard.


    Disable inherited authorization.


    Create a cluster network policy.


    Use the minimum privilege principle for your service accounts


    The principle of minimum privilege helps reduce the impact of a potential vulnerability
    or data that has been compromised. Thus, if a certain component is compromised,
    it will be more difficult for a potential attacker to escalate privileges.


    If you are using the Google Cloud Platform, each Kubernetes Engine node has an
    associated service account. The first thing that should be done is to analyze
    the account that has by default and see the permissions that are really necessary
    to run your Kubernetes cluster.


    At this point, it is recommended to use a service account with the minimum privileges
    to run the Kubernetes Cluster instead of the default service account.


    https://cloud.google.com/monitoring/access-control#overview


    https://cloud.google.com/logging/docs/access-control#overview


    The following commands will create a GCP service account for you the minimum permissions
    necessary to operate Kubernetes engine:


    ```

    $ gcloud service-accounts create "${SA_NAME}" \

    --display-name="${SA_NAME}" \

    $ gcloud projects add-iam-policy-binding "${PROJECT_ID}" \

    --member="serviceAccount:${SANAME}@${PROJECT_ID}.iam.gserviceaccount.com" \

    --role roles/logging.logWriter \

    $ gcloud projects add-iam-policy-binding "${PROJECT_ID}" \

    --member="serviceAccount:${SANAME}@${PROJECT_ID}.iam.gserviceaccount.com" \

    --role roles/monitoring.metricWriter \

    $ gcloud projects add-iam-policy-binding "${PROJECT_ID}" \

    --member="serviceAccount:${SANAME}@${PROJECT_ID}.iam.gserviceaccount.com" \

    --role roles/monitoring.viewer

    ```


    If you need your Kubernetes cluster to have access to other Google Cloud services,
    we recommend that you create an additional role and supply it to workloads through
    secrets. You can do this the official documentation:


    https://cloud.google.com/kubernetes-engine/docs/tutorials/authenticating-to-cloud-platform


    Disable Kubernetes dashboard


    At this point, it is important to know how to disable the Kubernetes user interface
    when it runs on Kubernetes Engine. The cloud console provides many of the features,
    so you don''t need these permissions if you are running the Kubernetes engine.


    https://kubernetes.io/docs/tasks/access-application-cluster/web-ui-dashboard/


    The following command disables the Kubernetes web interface:


    ```

    $ gcloud clusters update "${CLUSTER_NAME}" --update-addons=KubernetesDashboard=DISABLED

    ```


