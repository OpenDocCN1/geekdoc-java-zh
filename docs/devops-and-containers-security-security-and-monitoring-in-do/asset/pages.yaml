    The DirtyCow exploit demonstrates how to write files as a root user a file called
    with certain content, permission, and the property is set, and we try to write
    to the file as a normal user, but with the DirtyCow binary or exploit.


    The vulnerability occurs when opening a file that only the root user has access
    to read-only permissions and tries to write some content to the file. Normally
    this is rejected by the privilege hierarchy, but the exploit opens the file in
    a read-only memory segment.


    Prevent DirtyCow with apparmor


    If we use AppArmor, we can make the exploit have no effect by establishing restrictions
    on which applications within the container have permission to read, write, and
    execute. When using the default apparmor profile, the DirtyCowexploit was stopped.
    Another possibility is to run containers in read-only mode. The execution of the
    containers as read-only could prevent an attacker from making changes to the system.


