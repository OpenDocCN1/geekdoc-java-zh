    Best practices writing Dockerfiles


    Docker exposes in its documentation section of good practices for writing Dockerfiles.
    These practices will help us create images more efficiently, modularly, and with
    less effort.


    https://docs.docker.com/develop/images/dockerfile_best_practices/


    https://docs.docker.com/engine/runtime/


    Among the best practices to create optimized Docker Images, we can highlight:


    Run one process per container: Following the single process container allows us
    to make decoupled applications and reuse containers more easily, that are easier
    to scale, and results in more decoupled systems. This also allows us to use container
    links or other networking techniques.


    Reduce the size of images: A Docker image should only contain what is strictly
    necessary to run your application. In order to reduce complexity, dependencies,
    image size, build times of all images, you should avoid installing packages that
    could be useful for debugging a container. For example, do not include text editors
    in your images. Another very practical option is the use of small base images,
    for example, using alpine.


    Do not assume our containers are always running. Containers should be treated
    as immutable entities, which means we should not modify them while they are running.
    The recommendation at this point is to modify Dockerfile, reconstruct the image,
    and lift a container with updated image. It is recommended to handle data and
    execution configurations outside the container and, therefore, to its image. To
    use Docker volumes.


    Use official images from the Docker Hub; these images are maintained by the companies
    that provide this software. We can use ONBUILD images to simplify the process
    of creating our own images.


    Minimize the number of layers in our image using the cache: Docker uses Union
    Files to store images. This means that each image is made from a base image plus
    a collection of differences that the required changes. Each difference represents
    an additional layer in an image. This has a direct impact on how we write Dockerfile
    and the directives we use.


    Reduce the size to a minimum: A Docker image should only contain what is strictly
    necessary to run the application. In order to reduce complexity, dependencies,
    image size, and instruction count, you should avoid installing packages that could
    be useful for debugging a container. A good option is the use of smaller base
    images, for example, making use of the alpine distribution as a base image.


    Used base images: Dockerfiles start from a base image through FROM command, which
    is at the beginning of the file. The rest of the instructions depend on this image.
    If we start with a CentOS image, the package manager to be used in the RUN instruction
    will be yum instead of apt-get. This is, in base image which we started, don''t
    have apt-get available as a package manager. For example, an image based on Alpine
    Linux (https://alphinux.org is lighter than other official.'
