    Because the containers will always share the host kernel, the container can exploit
    any vulnerability in the kernel interface to compromise the Docker host, unless
    it uses seccomp or apparmor to limit calls between the containers and the host.
    Among the threats in the containers, we can highlight:


    Application-level DDoS and script attacks between sites in public containers.


    Containers that attempt to download additional malware or scan systems for vulnerabilities
    or confidential data.


    A container that is forced to use system resources in an attempt to block other
    containers.


    Use of unsecured applications, the aim of which is to deny service on the network
    and to affect other containers.


    The Dirty Cow exploits in the Linux kernel allow root privilege escalation on
    a host or container.


    Ransomware attacks on insecure server containers by MongoDB and Elasticsearchcontainers.


    Buffer overflow vulnerability in Ruby and Python libraries that allow the execution
    of malicious code.


    SQL injection attacks that allow you to take control of a database container in
    order to steal data.


    Vulnerabilities such as buffer overflow on the glibc stack, which gives control
    to hackers through man-in-the-middle attacks.


    For example, in some python images, it is common to see this type of CVE related
    vulnerability in glibc library.'
