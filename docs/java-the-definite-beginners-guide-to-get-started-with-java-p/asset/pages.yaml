  md: '# Chapter 3:

    Using the Basic Building Blocks


    You''ll notice that this chapter takes on a multilayered approach. As you read
    through it, you''ll come across the basic details of Java programming, and you''ll
    also notice the complexities of Java.


    # Speaking the Java language


    Before talking about Java, let''s take a closer look at the English language in
    your mind. By picturing the language in your mind. You''ll most probably see a
    large number of words because that''s what most languages are made up of. The
    English language has tons of different words. This idea of the language is very
    low level in that it''s the most basic interpretation. If you try thinking about
    English on a slightly higher level, you''ll start to think about the grammar of
    the language and various phrases and idioms that are used.


    The grammar of a language is essentially a set of rules that need to be followed
    in order to use the language correctly. The second category of idioms and sayings
    includes various sentences like "Honesty is the best policy" or "Pele is one of
    the greatest football players of all time


    The reason that Java is termed a programming language is that it includes the
    various aspects of other languages, such as English. Java, like English, has grammar
    (called syntax), words, stylistic idioms and commonly used names, among other
    things.'
  merge: -1
  pgno: 25
- img_proc: true
  md: '# Grammar and common names


    Java was developed by Sun Microsystems (now a part of Oracle). The developers
    at Sun Microsystems looked at Java as a language that has two parts. Similar to
    how the English language has grammar and commonly used words, Java has a specification
    (grammar) and an Application Programming Interface (commonly used words). Whenever
    you are writing Java programs, it''s advisable to keep two pieces of documentation
    (one for each aspect mentioned above) near you:


    # The Java language specification


    Ask any programmer about the most annoying errors that can show up when writing
    programs. Many of them will say syntax errors. These errors arise when the programmer
    forgets to follow the rules of Java programming such as "All statements must end
    in a semicolon." This documentation will help you avoid such errors.


    # The Application Programming Interface


    Every programming language has an application-programming interface (API). The
    API consists of numerous tools that were added by developers to Java after the
    syntax was defined. Some of these tools are common to the APIs of almost every
    programming language and some are unique. For example, the API includes a function
    called "pow," which allows the programmer to write exponents in his code, like
    raised to 2 (52). One of the more attractive tools is JFrame, which displays a
    window on the computer monitor. The API also includes tools that can listen for
    button clicks by the user and create databases for queries.


    Before you start programming, you''ll need to download the tools for Java. You
    can download the API documents, language specification and all the documentation
    for Java at Java Language and Virtual Machine Specifications (http://docs.oracle.com/javase/specs).
    You can also view the documentation online if you don''t want to download it.
    However, since updates are constantly being made, this link might be outdated
    by the time you read this book. But don''t worry. You can visit Oracle'
  merge: -1
  pgno: 26
- img_proc: true
  md: '(http://www.oracle.com/technetwork/java/index.html). From this webpage, click
    on the relevant links and download the files. documentation and Java SE (where
    SE stands for Standard Edition).


    The Java language specification is relatively small. This doesn''t mean that it
    will take 10 minutes for you to master the rules of Java. It will still take some
    time. However, other languages have around double or triple the number of rules.


    Java’s Application Programming Interface can be slightly intimidating since it''s
    huge. The API contains around 4,000 tools. Also, since developers are constantly
    working to make Java easier to use, more and more tools are added to the API.
    Even though the API is this big, the good news is that you don''t need to memorize
    any of it. This is the main idea behind the documentation. At any time, you can
    simply open the documentation and look up various details about the API. As you
    keep using the language, the parts of the API that you keep will become familiar
    to you. You''ll probably forget the parts that you don''t use often, but you can
