    ```


    Here, x is given a value of 12 and not, as you may assume, 24. Because multiplication
    is higher in the precedence order, Java will calculate this as 2*3 and then add
    the 6. Here, the operators are in order of their precedence from highest to lowest.
    In any expression, those operators with the highest precedence will be the first
    ones evaluated:


    | Category | Operator | Associativity |

