    such as dogs, humans, buildings, houses, etc. Each of these objects has its own
    behavior and state. Consider the dog, for example; it has states of name, color,
    breed, etc., and behaviors of running, barking and tail wagging. Compare this
    to a software object and you''ll see that there isn''t much of a difference because
    a software object also has states and the behaviors. The state is stored in a
    field and the behavior is indicated through a method.


    # Classes


    Classes are blueprints and we can create an object from it. Each class may contain
    one, some or all of these types of variable:


    +   - **Local**: A variable that has been defined inside a method, block or constructor
    is known as a local variable. It''s declared and then initialized inside the method
    and when the method has completed, the variable is destroyed.

    - **Instance**: This is a variable that has been defined inside a class but outside
    a method. They are initialized at the time of class instantiation, and they can
    be accessed within a method, block or constructor of the class.

    - **Class**: These are declared in a class and outside a method using the static
    keyword.

    - **Class variables**: Class variables are variables declared within a class,
    outside any method, with the static keyword.'
