  md: '# Chapter 2:


    # Setting Up Your Environment


    Before you do anything else, the most important thing is to set your environment
    up and for that, you''ll need the Java Software Development Kit (JDK). It is free
    and works on Windows and Mac OS.


    # Downloading the JDK


    To download the JDK, go to Java website (http://www.java.com/java/technologies/downloads/)
    and then click on the latest version of the JDK for that system. Choose your operating
    system and that system. Click to accept the license agreement and the download
    will begin. Follow all the prompts on your screen and make sure to choose a Save
    location you''ll remember.


    # Installing the JDK


    Once you have successfully downloaded the JDK, the next step is to install it
    on your operating system.


    # Windows


    +   - Locate the file you downloaded and double-click it.

    - Click Allow to let the app makes changes to your computer.

    - If asked for permission to install, click Yes or OK.

    - The Installer screen will appear; click on Next.

    - Follow the instructions on the screen to install Java.

    - Accept the default settings by clicking Next and then wait for the installation
    to complete.

    - Click on Close and then press the Windows key and X at the same time.'
  merge: -1
  pgno: 21
- img_proc: true
  md: '+   This will open the power menu; click on System from the menu.


    +   Click Advanced System Settings.


    +   Locate the Advanced tab and click on it.


    +   Click Environment Variables and a new box will appear.


    +   Under System Variables, click on Path variable. The next few steps must be
    followed exactly as there is no way of undoing a wrong step.


    +   For Windows 10, click on New.


    +   Enter c:\Program Files\Java\jdk1.x.x_xx\bin--input the version you installed.


    +   Click Move Up until you see that path at the top of the list, and click OK.


    +   For all other Windows versions, click on Edit System Variable and then on
    the variable value field. Do NOT delete what is in this field--just add the following
    to it, inputting the version number downloaded: C:\Program Files\Java\jdk1.x.x_xx\;


    +   The semicolon at the end is very important, so don''t forget it.


    +   Click OK until all windows are closed and your installation is finished.


    +   The next step is to make sure it installed properly. Press the Windows key
    and R to open the Run box.


    +   Type in cmd and press the Enter key.


    +   A terminal window will open. At the command prompt, type path and press Enter.
    You should now see the path you typed in earlier.


    +   Type java -version and press Enter--the Java version you installed should
    show up on your screen.


    +   Note: If either of these commands doesn''t work, shut your computer down and
    reboot it; this will load the new environment variables. Try again and you should
    be successful.


    # Mac OS


    +   Locate the file you downloaded and double-click it.


    +   Double-click on the Package icon and the installer will open.'
  merge: -1
