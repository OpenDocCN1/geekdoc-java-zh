  md: '# Chapter 14:

    Java Exceptions


    Exceptional events, or, as they are known in computer programming terms, exceptions,
    are problems that come up when a program is being executed. Whenever one of these
    exceptions arises, the normal program flow is stopped and it will terminate. Exceptions
    can happen for any number of reasons, including:


    +   * Invalid data has been entered by a user

    * A required file cannot be found

    * Network communication fails or the Java Virtual Machine runs out of memory


    Some are user errors, others are programmer error, and yet others may be failed
    physical resources. This gives three categories of exceptions and to understand
    exception handling, you must understand these categories:


    +   * Checked Exceptions: This happens at compile time and can''t be ignored—the
    programmer must handle them at the time.


    Let''s say, for example, that you use the class called FileReader for reading
    data from a specified file. If that file doesn''t exist, then you''ll see a FileNotFoundException
    and you must handle it there and then.


    +   * Unchecked exceptions: This happens at execution time (also known as runtime
    exceptions). These are ignored at compilation time.'
