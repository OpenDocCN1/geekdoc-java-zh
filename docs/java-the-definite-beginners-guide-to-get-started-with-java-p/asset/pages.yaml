  md: '# Keywords


    A keyword is a word that has a special meaning in Java; its meaning doesn''t change
    no matter how many times it''s used and where it''s used. Some examples of keywords
    are for, while, if, else and do. All the Java keywords are chosen by members of
    the Java Community Committee. Look back at the two parts of Java that were defined
    earlier in the chapter. We talked about the grammar and common names of Java.
    The keywords come under the language specification (grammar) section.


    # Identifiers


    Identifiers in Java are essentially just names for things. The meanings for these
    words can change from one program to another. Some identifiers'' meanings happen
    to change more frequently than others.


    # Identifiers created by programmers like you and me


    Every Java programmer creates his own names for classes and variables that are
    defined in his programs. Even neophytes create their own classes and variables,
    and hence have to create identifiers. Suppose you name something in your code
    number, and there is another programmer in your vicinity who names something in
    his code number. This won''t give rise to an error since there is no fixed definition
    for the word number in Java. This allows for increased readability of Java programs.
    For instance, if you are writing code for determining the sum of numbers stored
    in an array, you can name the array “numbers” so that when someone reads the code,
    they can interpret that the numbers to be added are stored in the array.


    # Identifiers from the API


    The members of the JCP committee have devised names for many elements used in
    Java and have included them in the Java API. Since the API is included in every
    version of Java, these names are available to everyone who writes a Java program.
    A few examples of these identifiers are Integer, JWindow, JTextField, String and
    File.'
