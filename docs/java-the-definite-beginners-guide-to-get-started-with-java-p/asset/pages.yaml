  md: '# Conclusion


    Thank you for taking the time to work through my guide; I hope that you found
    it useful. Now that you know the basics of Java programming and the syntax rules
    that go with it, you can move on and take your learning to the next level.


    As you can see, Java isn''t too complicated and once you get the hang of the rules,
    you''ll be programming like a pro. The rules that surround the syntax and the
    naming conventions are very important parts to learn; if you can''t grasp these,
    you won''t be able to grasp the rest of the language, so don''t be afraid to run
    through this guide as many times as needed. You must be comfortable with the basics—otherwise
    anything more complex will seem like it''s too difficult to learn.


    Good luck, and I wish you well on your journey to becoming a pro Java programmer.'
