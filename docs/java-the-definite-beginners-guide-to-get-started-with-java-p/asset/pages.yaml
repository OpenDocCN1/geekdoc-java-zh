    # Calling a method


    To use a method, you must first call it, and that can be done in two ways: with
    a returned value or without. Calling a method is actually very simple. When the
    method is invoked by the program, control is transferred to the method. This,
    in turn, will return that control back to the caller under two conditions:


    +   - the return statement has been executed

    - it gets to the closing brace of the method


    If a method returns void, it''s considered as a call to a statement. If we want
    a method to return no value, we declare it using the void keyword. A Java statement,
    ending with a semicolon, must be used to call a void method.


    # Passing a parameter by value


    When we are working under the calling process, arguments may be passed. These
    arguments should be ordered the same way as their respective parameters in the
    specification of the method. A parameter may be passed by reference or value.
    When you pass a parameter by value, you are calling a method that has a parameter,
    passing the argument value to that parameter.'
