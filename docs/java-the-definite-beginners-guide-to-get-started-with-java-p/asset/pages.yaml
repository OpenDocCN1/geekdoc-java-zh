  md: '# Chapter 13:

    Java Methods


    Java methods are collections of statements in a grouping that perform a specified
    operation. For example, calling the System.out.println() method would result in
    the system executing a number of statements to display the output on the console.


    Now we are going to look at how to create a method, be it with return values or
    without without, how to invoke methods, with parameters or without, and how to
    apply method abstraction.


    # Creating a method


    The syntax for creating a method is:


    ```

    public static int methodName(int a, int b) {


    // body

    }

    ```


    Let''s look at each part of that means:


    +   * public static: this is the modifier

    * int: this is the return type

    * methodName: this is the method name

    * a, b: these are formal parameters

    * int a, int b: this is the list of parameters


    A method has a method header and body, as per this syntax:


    ```

    modifier returnType nameOfMethod (Parameter List) {

    ```'
