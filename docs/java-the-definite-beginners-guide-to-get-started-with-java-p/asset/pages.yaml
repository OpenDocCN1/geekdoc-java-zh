  md: '# # Chapter 7:

    Java Data Types


    A variable is a reserved location in memory used for storing values. When you
    create a new variable, you are automatically reserving that space in memory. The
    amount of memory is determined by the type of the variable; the operating system
    allocates the memory and determines what may be stored in it. By assigning a different
    type to a variable, you can store decimals, integers or characters. Java has two
    main data types:


    +   * Primitive

    * Reference or object


    # Primitive


    Java contains eight primitive data types. These are predefined by the Java language
    and are named with a keyword. The eight types are:


    +   * Byte: A byte is a data type with a default value of 0 (zero). The minimum
    value is -128 and the maximum is 127. It''s usually used for saving space in the
    larger arrays, and is usually used instead of an integer because an integer is
    four times larger than a byte.

    * Short: A short is a data type with a default value of 0. The minimum value is
    -32,768 and the maximum is 32,767. To save memory, it may also be used as a byte
    data type. The integer is two times bigger than the short.

    * Int: The int has a default of 0. The minimum value is -2,147,483,647 and the
    maximum is 2,147,483,647. It''s normally used as the default type for integral
    values unless memory is short.'
