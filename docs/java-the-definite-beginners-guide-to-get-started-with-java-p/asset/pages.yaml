    * public Throwable getCause(): returns the exception cause, represented by an
    object

    * public String toString(): returns the class name concatenated with the getMessage()
    result

    * public void printStackTrace(): prints the toString() result with a stack trace
    to the error output stream

    * public StackTraceElement[] getStackTrace(): returns an array that contains each
    of the stack trace elements, with index 0 representing the top of the stack and
    the final index representing the bottom of the call stack

    * public Throwable fillInStackTrace(): fills the Throwable object stack trace
    with the current trace, adding to the previous information'
