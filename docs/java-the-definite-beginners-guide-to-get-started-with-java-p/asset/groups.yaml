  - "[PAGE 82]\n\n```\n// Catch block\n}catch(ExceptionType3 e3) {\n  // Catch block\n\
    }\n```\n\nThis shows three blocks, but you can use as many as you want long as\
    \ they follow one try block. If the exception happens in protected code, it will\
    \ be passed to the first catch block; if the exception type is matched to ExceptionType,\
    \ it will be caught; if not, it is passed to the next catch block. This will continue\
    \ until the exception is caught or all catch blocks are exhausted without success.\
    \ In this case, the method will cease to execute and the exception is thrown to\
    \ the previous method listed on the call stack.\n\n# Catching multiple exception\
    \ types\n\nJava now allows you to catch more than one exception in one catch block,\
    \ thus simplifying your code. This is the syntax to use:\n\n```\ncatch (IOException|FileNotFoundException\
    \ ex) {\n  logger.log(ex);\n  throw ex;\n}\n```\n\n# Throws/throw keywords\n\n\
    If a checked exception is not handled by a method, that method must use the throws\
    \ keyword to declare it. This shows up at the end of the method signature. Exceptions\
    \ can be thrown with the throw keyword. It's important that you understand the\
    \ throws and throw keywords:\n\n+   - **throws**: postpones checked exception\
    \ handling\n- **throw**: explicitly invokes it throws one or more exceptions;\n\
    \nMethods may declare that it throws one or more exceptions; if more are declared,\
    \ these are listed with commas as separators."
- md: "\n## The finally block\n\nThe finally block, which must always succeed a try\
    \ or catch block, will always execute regardless of whether an exception occurs\
    \ or not. The finally block lets you to run a statement for cleanup purposes that\
    \ must be executed regardless. The syntax you would use for the finally block\
    \ is:\n\n```\ntry {\n  // Protected code\n}catch(ExceptionType1 e1) {\n  // Catch\
    \ block\n}catch(ExceptionType2 e2) {\n  // Catch block\n}catch(ExceptionType3\
    \ e3) {\n  // Catch block\n}finally {\n  // The finally block always executes.\n\
    }\n```\n\nBe aware of the following rules:\n\n- Catch clauses may not be used\
    \ without try statements.\n- Finally clauses are not compulsory when you use a\
    \ try/catch block.\n- You can't have a try block without a catch or a finally\
    \ clause.\n- There may not be any code in between the try, catch and the finally\
    \ blocks.\n\n# User-defined exceptions\n\nA user may create their own Java exceptions.\
    \ Keep these pointers in mind when you create an exception class:\n\n- Every exception\
    \ must be a child of the parent class Throwable.\n- The Exception class must be\
    \ extended if you want a checked exception that's enforced automatically by the\
    \ Handle or Declare ruling.\n- The Runtime Exception class must be extended if\
    \ you want a runtime exception.\n\nTo define an exception class, use the following\
    \ syntax:\n\n```\nclass MyException extends Exception {\n}\n```\n\nJust ensure\
    \ that the Exception class already defined is extended when you create an exception.\
    \ User-defined exceptions are classed as checked exceptions and they are much\
    \ like any other class in that they contain useful methods and fields.\n\n# Common\
    \ exceptions\n\nThere are two categories of exceptions and errors that you can\
    \ define in Java:\n\n- JVM: JVM exceptions or errors are thrown logically or exclusively\
    \ by the Java Virtual Machine. Examples include ClassCastException, NullPointerException\
    \ and ArrayIndexOutOfBoundsException.\n- Programmatic: These are explicitly thrown\
    \ by the API programmer or by the application. Examples include IllegalStateException\
    \ and IllegalArgumentArgumentException.\n\n# Chapter 15:\n## Ten Ways to Avoid\
    \ Making Mistakes\n\nThe people who don't make mistakes are those who never do\
    \ anything at all. This section covers some of the most common mistakes that are\
    \ made and how you can avoid making them.\n\n## Using incorrect cases for letters\n\
    \nIf you put a capital letter where it doesn't belong when writing a code in Java,\
    \ you'll be making a blunder. You have to ensure that you keep track of every\
    \ character that you'll be using when writing a Java program. Here are a few things\
    \ to keep in mind when you're writing your code:\n\n- Every keyword in Java is\
    \ lowercase. For instance, when you are using the keyword \"public,\" you can't\
    \ write it as \"Public\" or \"PUBLIC.\"\n- If you are using names from the Java\
    \ API, you have to ensure that the names match what appears in the API.\n- You\
    \ have to ensure that the names you have used in your code are capitalized and\
    \ spelled the same way throughout the program. If you have declared a variable\
    \ called \"Myhouse,\" you can't refer to it as \"myhouse\" or \"MYHOUSE.\" If\
    \ you use the same variable in multiple ways, Java will assume that you have different\
    \ and distinct variables with the same name.\n\n## Break out of a switch statement\n\
    \nIf you forget to break out of a switch statement, your compiler won't go past\
    \ the Switch statement. For example,\n\n```\nswitch (verse)\n{\ncase 3:\n  out.print(\"\
    Please remember, \");\n  out.println(\"please remember,\");\ncase 2:\n  out.print(\"\
    I am in pain, \");\n  out.println(\"i am in pain,\");\ncase 1:\n  out.print(\"\
    I need medicine, \");\n  out.println(\"i need medicine,\");\n}\n```\n\nIf there\
    \ is no break at the end of each case, the computer will print the first sentence\
    \ from each case. The code should therefore be:\n\n```\nswitch (verse)\n{\ncase\
    \ 3:\n  out.print(\"Please remember, \");\n  out.println(\"please remember,\"\
    );\n  break\ncase 2:\n  out.print(\"I am in pain, \");\n  out.println(\"i am in\
    \ pain,\");\n  break\ncase 1:\n  out.print(\"I need medicine, \");\n  out.println(\"\
    i need medicine,\");\n  break\n}\n```\n\n## Using double equal signs\n\nYou have\
    \ to remember to use double equal signs in Java. If you were to use single equal\
    \ signs, you would find that the code you are using doesn't provide the desired\
    \ results. For example, if you were to write:\n\n```\nif (X=Y), you are saying\
    \ that the X should be given the value of Y.\n```\n\nHowever, if you were to use\
    \ the following code:\n\n```\nif (X == Y), you are asking the compiler to verify\
    \ if the values of X and Y are the same.\n```\n\n## Adding components to the interface\n\
    \nHere is an example of a constructor that can be used for a Java frame:\n\n```\n\
    public SimpleFrame()\n{\n  JButton button = new JButton(\"Thank you...\");\nsetTitle(\"\
    ...Connie Santisteban and Brian Walls\");\nsetLayout(new FlowLayout());\nadd(button);\n\
    button.addActionListener(this);\nsetSize(300, 100);\nsetVisible(true);\n}\n```\n\
    \nNo matter what you do, you have to remember to add the “add” method. The \"\
    add\" method goes to waste.\n\n## Adding listeners\n\nThe example above shows\
    \ how you can add a listener.\n\n## Defining the constructors\n\nWhen you define\
    \ something without parameter. For example, if you were to use the following code:\n\
    \n```\nif (X == Y), you are asking the compiler to verify if the values of X and\
    \ Y are the same.\n```\n\n## Fixing references\n\nConsider the following code:\n\
    \n```\nclass WillNotWork\n{\n    String greeting = \"Hello\";\n    public static\
    \ void main(String args[])\n    {\n        System.out.println(greeting);\n   \
    \ }\n}\n```\n\n## Staying within an array’s bounds\n\nWhen you declare an array\
    \ with ten components, each component will have indices between 0 and 9. If you\
    \ define the following:\n\n```\nint students[] = new int[10];\n```\n\nyou can\
    \ definitely not use students[10] since there is no component there.\n\n## Anticipating\
    \ null pointers\n\nMost of the examples used in this book do not throw the NullPointerException,\
    \ but when you're writing new code, you'll probably see this most of the time.\
    \ This exception occurs when you call on a method that is to return an object\
    \ but doesn't return anything. Consider the following example:\n\n```java\nimport\
    \ static java.lang.System.out;\nimport java.io.File;\nclass ListMyFiles\n{\n \
    \   public static void main(String args[])\n    {\n        File myFile = new File(\"\
    \\\\windows\\\\\");\n        String dir[] = myFile.list();\n        for (String\
    \ fileName : dir)\n        {\n            out.println(fileName);\n        }\n\
    \    }\n}\n```\n\nThis program will display the list of files that are present\
    \ in the windows directory. What happens when you change \\windows to something\
    \ else? What if you were to use something that did not represent a directory?\n\
    \n```\nFile myFile = new File(\"&*%$$!!\");\n```\n\nThe new File call will return\
    \ a null, meaning there will be nothing that can be returned, and implying that\
    \ there will be nothing in the \"myFile\" variable. The variable \"dir,\" later\
    \ in the code, refers to absolutely nothing and the attempt to use a loop using\
    \ the \"dir\" fails. You get a big NullPointerException, and the program comes\
    \ crashing around you.\n\nIn order to avoid this kind of error, you should go\
    \ through Java’s API Documentation. If you know you'll be using a method that\
    \ will return a null value, remember to add the exception handling code to your\
    \ program.\n\n# Helping Java find files\n\nYou are working on your Java code,\
    \ minding your own business, when your computer throws the following error at\
    \ you: \"NoClassDefFoundError.\" lot of things could be going wrong, but there\
    \ is the chance that your computer was unable to find a particular Java file.\
    \ In order to fix this, you'll need to align your code accurately:\n\n- The project\
    \ directory will need to contain the names of all Java files that are being used\
    \ in your code.\n"
