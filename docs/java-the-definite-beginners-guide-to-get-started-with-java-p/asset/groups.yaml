    ## Chapter 12: Java Arrays


    An array is a data structure that''s used to store fixed-size elements in a sequential
    collection. An easier way to think of it is that an array stores a data collection
    (a collection of variables) that are all the same type. Instead of declaring variables
    individually (like number1, number2, etc.), you can declare a single array variable
    (like numbers) and then use numbers[1], numbers[2], etc., to represent each of
    the individual variables.


    ## Declaring an array variable


    If you want to use an array in your program, first you must declare a variable
    that will reference the array; you also need to specify the array type that the
    variable may reference. To declare an array variable, use the following syntax:


    ```

    dataType[] arrayRefVar; // preferred way

    ```


    Or


    ```

    dataType arrayRefVar[]; // works but not the best way

    ```


    Note: the first example is the preferred method. The second example is one you''ll
    see sometimes, but it it has been adopted by Java from C language to accommodate
    those programmers who are used to C or C++.


    ## Creating an array


    Arrays can be created using the following syntax:


    ```

    arrayRefVar = new dataType[arraySize];

    ```


    This statement will do two things:


    - It will create an array by using "new dataType[arraySize]."

    - It will assign the reference of the new array to the variable named arrayRefVar.


    If you want to declare an array variable, create an array, and assign the array
    reference to the variable in one go, you can use this:


    ```

    dataType[] arrayRefVar = new dataType[arraySize];

    ```


    Or you can create the array like this:


    ```

    dataType[] arrayRefVar = {value0, value1, ..., valuek};

    ```


    We use the index to access array elements. Array indices are zero-based; this
    means the first index is 0, the second is 1 and so on. An array of 10 items will
    run from 0 to 9.


    ## Processing an array


    When you process the elements in the array, you would normally use the for loop
    or the foreach loop. This is because all the elements will be the same type and
    the array size is known. We talked about the foreach loop in a previous chapter
    (it is otherwise known as the enhanced for loop).


    ## Passing an array to a method


    In the same way that the values of primitive data types can be passed to methods,
    we can pass an array to a method. It''s invoked by passing the array. For example,
    this statement is invoking the printArray method to display 4, 2, 3, 7, 1 and
    5:


    ```

    printArray(new int[]{4, 2, 3, 7 1 5});

    ```


    ## The arrays class


    The arrays class has several static methods in it that can be used to sort and
    search an array, compare arrays and fill in array


    Each method has been overloaded for all of the primitive data types.


    - public static int binarySearch(Object[] a, Object key): Uses the binary search
    algorithm to search a given array of objects for a specified value. Before this
    can be done, the array must be sorted. The return will be the search index (provided
    it''s in the list). If not, the return will be (-(insertion point + 1)).

    - public static boolean equals(long[] a, long[] a2): Evaluates true if the given
    arrays of longs are equal. Two arrays will be considered equal if both have the
    same number of elements and all of the corresponding element pairs in the arrays
    are also equal. The same method may be used by all primitive data types.

    - public static void fill(int[] a, int val): Assigns the given int value to each
    of the elements in the array of ints. This may also be used by all other primitive
    data types.

    - public static void sort(Object[] a): Sorts the given object array into ascending
    order as per the natural order of the elements. This may also be used by other
    primitive data types.


    In the next chapter, we will examine Java methods.


    ## Chapter 13: Java Methods


    Java methods are collections of statements in a grouping that perform a specified
    operation. For example, calling the System.out.println() method would result in
    the system executing a number of statements to display the output on the console.


    Now we are going to look at how to create a method, be it with return values or
    without without, how to invoke methods, with parameters or without, and how to
    apply method abstraction.


    ## Creating a method


    The syntax for creating a method is:


    ```

    public static int methodName(int a, int b) {


    // body

    }

    ```


    Let''s look at each part of that means:


    - public static: this is the modifier

    - int: this is the return type

    - methodName: this is the method name

    - a, b: these are formal parameters

    - int a, int b: this is the list of parameters


    A method has a method header and body, as per this syntax:


    ```

    modifier returnType nameOfMethod (Parameter List) {

    ```


    ```

    // method body

    }

    ```


    This syntax shows:


    - **modifier**: to define the method access type

    - **returnType**: the method may return a value

    - **nameMethod**: the name of the method

    - **parameter list**: the parameter list, these are optional

    - **method body**: the body of the method


    ## Calling a method


    In the same way that the values of primitive data types can be passed to methods,
    we can pass an array to a method. It''s invoked by passing the array. For example,
    this statement is invoking the printArray method to display 4, 2, 3, 7, 1 and
    5:


    ```

    printArray(new int[]{4, 2, 3, 7 1 5});

    ```


    ## Passing a parameter by value


    When we are working under the calling process, arguments may be passed. These
    arguments should be ordered the same way as their respective parameters. A parameter
    may be passed by reference or value. When you pass a parameter by value, you are
    calling a method that has a parameter.


    ## Method overloading


    If a class contains two or more methods that have identical names but different
    parameters, we call it method overloading. This is not to be confused with method
    overriding, where two or more methods have the same name, parameters, number type,
    etc. If we wanted, for example, to find the minimum number of a double type, we
    would introduce method overloading


    ## Using command line arguments


    You may, at times, want to pass information to a program when it''s run, and we
    do this by passing main() method some command line arguments. This type of argument
    is the exact information that''s displayed after the name of the program on the
    command line at the time it''s executed. Accessing command line arguments in Java
    is easy because these arguments are stored in the string array that passes to
    main() (and they are stored as strings).


    ## Java constructors


    Constructors are used to initialize objects when they are created. They have the
    same name as their class and are similar in syntax to a method. However, the difference
    is that constructors don''t have an explicit return type.


    Generally, constructors are used to provide the initial value to instance variables
    that have been defined by the class. Or they may be used to carry out any startup
    procedure that''s required for the creation of a fully formed object.


    Every class has constructors regardless of whether you specifically define one
    or not. This is because Java will automatically provide default constructors to
    initialize all of the member variables to zero. However, should you define a constructor,
    the default one will be discarded.


