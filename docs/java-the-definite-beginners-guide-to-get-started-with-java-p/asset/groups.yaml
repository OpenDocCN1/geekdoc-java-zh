    \ RuntimeException。\n\n要定义异常类，请使用以下语法：\n\n```\nclass MyException extends Exception\
    \ {\n}\n```\n\n只需确保在创建异常时扩展了已定义的 Exception 类即可。用户自定义异常被归类为检查异常，它们与其他任何类都很相似，都包含了有用的方法和字段。\n\
    \n# 常见异常\n\n在 Java 中，你可以定义两类异常和错误：\n\n- JVM：JVM 异常或错误逻辑上或专门地由 Java 虚拟机抛出。示例包括\
    \ ClassCastException、NullPointerException 和 ArrayIndexOutOfBoundsException。\n\
    - 程序化：这些异常是由 API 程序员或应用程序显式抛出的。示例包括 IllegalStateException 和 IllegalArgumentArgumentException。\n\
    \n# 第 15 章：\n## 避免犯犯错误的十种方法\n\n不犯错的人是那些什么都不做的人。本节将涵盖一些最常见的错误以及你如何避免犯这些错误。\n\n\
    ## 在字母中使用不正确的大小\n\n如果你在编写 Java 代码时在不该使用的地方使用了大写字母，你就会犯一个错误。你必须确保在编写 Java 程序时跟踪你将使用的每一个字符。在编写代码时，请记住以下几点：\n\
    \n- Java 中的每个关键字都是小写的。例如，当你使用关键字 \"public\" 时，你不能将其写成 \"Public\" 或 \"PUBLIC\"\
    。\n- 如果你使用了来自 Java API 的名称，你必须确保这些名称与 API 中出现的内容匹配。\n- 你必须确保你在代码中使用的名称在整个程序中都是大写的，且拼写方式相同。如果你声明了一个名为\
    \ \"Myhouse\" 的变量，你不能将其引用为 \"myhouse\" 或 \"MYHOUSE\"。如果你在多种方式下使用同一个变量，Java 将认为你拥有同名但不同且独立的变量。\n\
    \n## 跳出 switch 语句\n\n如果你忘记从 switch 语句中跳出，你的编译器将不会跳过 switch 语句继续执行。例如，\n\n```\n\
    switch (verse)\n{\ncase 3:\n  out.print(\"Please remember, \");\n  out.println(\"\
    please remember,\");\ncase 2:\n  out.print(\"I am in pain, \");\n  out.println(\"\
    i am in pain,\");\ncase 1:\n  out.print(\"I need medicine, \");\n  out.println(\"\
    i need medicine,\");\n}\n```\n\n如果每个 case 的末尾没有 break，计算机将打印每个 case 的第一句话。因此，代码应该是：\n\
    \n```\nswitch (verse)\n{\ncase 3:\n  out.print(\"Please remember, \");\n  out.println(\"\
    please remember,\");\n  break\ncase 2:\n  out.print(\"I am in pain, \");\n  out.println(\"\
    i am in pain,\");\n  break\ncase 1:\n  out.print(\"I need medicine, \");\n  out.println(\"\
    i need medicine,\");\n  break\n}\n```\n\n## 使用双等号\n\n你必须记住在 Java 中使用双等号。如果你使用单等号，你会发现你所使用的代码并没有提供预期的结果。例如，如果你写：\n\
    \n```\nif (X=Y),你是在说 X 应该被赋予 Y 的值。\n```\n\n然而，如果你使用以下代码：\n\n```\nif (X == Y),你是在请求编译器验证\
    \ X 和 Y 的值是否相同。\n```\n\n## 向接口添加组件\n\n这是一个可以用于 Java 框架的构造函数示例：\n\n```\npublic\
    \ SimpleFrame()\n{\n  JButton button = new JButton(\"Thank you...\");\nsetTitle(\"\
    ...Connie Santisteban and Brian Walls\");\nsetLayout(new FlowLayout());\nadd(button);\n\
    button.addActionListener(this);\nsetSize(300, 100);\nsetVisible(true);\n}\n```\n\
    \n无论你做什么，都必须记住添加“add”方法。“add” 方法将白白浪费。\n\n## 添加监听器\n\n上面的示例展示了如何添加监听器。\n\n## 定义构造函数\n\
    \n当你在没有参数的情况下定义内容时。例如，如果你使用以下代码：\n\n```\nif (X == Y),你是在请求编译器验证 X 和 Y 的值是否相同。\n\
    ```\n\n## 修复引用\n\n考虑以下代码：\n\n```\nclass WillNotWork\n{\n    String greeting =\
    \ \"Hello\";\n    public static void main(String args[])\n    {\n        System.out.println(greeting);\n\
    \    }\n}\n```\n\n## 留在数组范围内\n\n当你声明一个拥有十个组件的数组时，每个组件的索引都在 0 到 9 之间。如果你定义了如下内容：\n\
    \n```\nint students[] = new int[10];\n```\n\n你绝对不能使用 students[10]，因为那里没有组件。\n\n\
    ## 预判空指针\n\n此书中使用的大多数示例都没有抛出 NullPointerException，但当你编写新代码时，你可能在大多数情况下遇到它。当你调用一个本应返回对象但没有返回任何内容的方法时就会发生这种异常。考虑以下示例：\n\
    \n```java\nimport static java.lang.System.out;\nimport java.io.File;\nclass ListMyFiles\n\
    {\n    public static void main(String args[])\n    {\n        File myFile = new\
    \ File(\"\\\\windows\\\\\");\n        String dir[] = myFile.list();\n        for\
    \ (String fileName : dir)\n        {\n            out.println(fileName);\n   \
    \     }\n    }\n}\n```\n\n该程序将显示 windows 目录下的文件列表。当你把 windows 改为其他时会发生什么？如果你使用一个不代表目录的内容呢？\n\
    \n```\nFile myFile = new File(\"&*%$$!!\");\n```\n\nnew File 调用返回空，这意味着没有可以返回的内容，并暗示\
    \ \"myFile\" 变量中没有任何内容。代码后部分的变量 \"dir\" 指向为空，尝试使用 \"dir\" 进行循环会失败。你得到一个巨大的 NullPointerException，程序随之崩溃。\n\
    \n为了避免此类错误，你应该查阅 Java API 文档。如果你知道你将使用一个可能返回空值的方法，请记住在程序中添加异常处理代码。\n\n# 帮助 Java\
    \ 找到文件\n\n当你正在编写 Java 代码，忙于自己的事时，你的计算机向你抛出了以下错误：“NoClassDefFoundError。”很多事情可能出了问题，但也可能是你的计算机无法找到某个特定的\
    \ Java 文件。为了修复这个问题，你需要确保项目目录包含代码中使用的所有 Java 文件。\n\n"
