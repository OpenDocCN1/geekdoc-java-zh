  - '[PAGE 79]


    # Chapter 14:

    Java Exceptions


    Exceptional events, or, as they are known in computer programming terms, exceptions,
    are problems that come up when a program is being executed. Whenever one of these
    exceptions arises, the normal program flow is stopped and it will terminate. Exceptions
    can happen for any number of reasons, including:


    +   * Invalid data has been entered by a user

    * A required file cannot be found

    * Network communication fails or the Java Virtual Machine runs out of memory


    Some are user errors, others are programmer error, and yet others may be failed
    physical resources. This gives three categories of exceptions and to understand
    exception handling, you must understand these categories:


    +   * Checked Exceptions: This happens at compile time and can''t be ignored—the
    programmer must handle them at the time.


    Let''s say, for example, that you use the class called FileReader for reading
    data from a specified file. If that file doesn''t exist, then you''ll see a FileNotFoundException
    and you must handle it there and then.


    +   * Unchecked exceptions: This happens at execution time (also known as runtime
    exceptions). These are ignored at compilation time.'
  - '[PAGE 80]


    For example, if you declared an array with a size of 6 in your program and you
    try to call element 7, you would get an ArrayIndexOutOfBoundsException exception.


    +   * Errors: These are not exceptions; they are problems out of the control of
    the programmer or user. These tend to be ignored because there is often nothing
    you can do about them.


    # Hierarchy


    Every exception class is a subtype of java.lang.Exception class and this, in turn,
    is a subclass of the Throwable class. There is one more class, called Error, which
    is also a subclass of the Throwable class.


    The Exception class has IOException and RuntimeException as two of its main subclasses.


    # Exception methods


    These are the more important methods from the Throwable class:


    +   * public String getMessage(): returns a message with details of the error,
    initialized in the constructor for Throwable

    * public Throwable getCause(): returns the exception cause, represented by an
    object

    * public String toString(): returns the class name concatenated with the getMessage()
    result

    * public void printStackTrace(): prints the toString() result with a stack trace
    to the error output stream

    * public StackTraceElement[] getStackTrace(): returns an array that contains each
    of the stack trace elements, with index 0 representing the top of the stack and
    the final index representing the bottom of the call stack

    * public Throwable fillInStackTrace(): fills the Throwable object stack trace
    with the current trace, adding to the previous information'
