    有两种主要数据类型：


    - 原型

    - 引用或对象


    # 原型


    Java 包含八种原型数据类型。这些是由 Java 语言预定义的，并用关键字命名。这八种类型是：


    - Byte：字节是一种默认值为 0（零）的数据类型。最小值为 -128，最大值为 127。它通常用于节省较大数组的空间，通常代替整数，因为整数是字节的四倍大。

    - Short：短整是一种默认值为 0 的数据类型。最小值为 -32768，最大值为 32767。为了节省内存，也可以作为字节数据类型。整数是短整的两倍大。

    - Int：int 的默认值为 0。最小值为 -2,147,483,647，最大值为 2,147,483,647。除非内存短缺，否则它通常作为整型值的默认类型。


