    \ = age;\n  }\n}\n```\n\n## 可变参数\n\n也称为 var-args，向方法传递可变数量的参数（只要它们的类型都相同）这一功能是在\
    \ JDK 1.5 中引入的。我们像这样声明方法参数：\n\n```java\ntypeName... parameterName\n```\n\n在方法声明内部，你必须指定类型并在后跟一组括号。你只能在方法中指定一个可变长度的参数，且该参数必须是最后一个参数。所有普通参数必须先声明。\n\
    \n## 使用 finalize() 方法\n\n可以定义在垃圾回收器销毁对象之前调的方法，这被称为 `finalize()` 方法。它被用于确保对象能够正确且干净地终止。例如，你可以使用\
    \ `finalize()` 方法来确保对象所拥有的打开文件被正确关闭。\n\n要向你的类中添加终结器（finalizer），你只需定义 `finalize()`\
    \ 方法，Java 运行时在准备好回收指定类的对象时就会调用该方法。\n\n在 `finalize()` 方法内部，我们指定在对象销毁之前要执行的操作。`finalize()`\
    \ 方法的一般语法为：\n\n```java\nprotected void finalize() {\n    // 在此处编写 finalize 代码\n\
    }\n```\n\n注意 `protected` 关键字的使用——这是一个访问修饰符，用于限制对 `finalize()` 方法的访问。\n\n这里，`protected`\
    \ 关键字是一个指示符，防止定义在对象类之外的代码访问 `finalize()` 方法。这意味着你永远不知道 `finalize()` 方法何时执行，或者是否会执行——例如，如果你的程序在垃圾回收发生之前就结束了，那么\
    \ `finalize()` 方法将不会被执行。\n\n在最后一章中，我们将查看异常以及它们在 Java 中是如何处理的。\n\n## 第 14 章：Java\
    \ 异常\n\n异常事件，或者用计算机编程术语所说的异常，是在程序执行时出现的问题。每当这些异常之一发生时，正常的程序流就会停止并终止。异常可能由于任何原因发生，包括：\n\
    \n- 用户输入了无效数据\n- 找不到所需的文件\n- 网络通信失败或 Java 虚拟机内存耗尽\n\n有些是用户错误，另一些是程序员错误，而另一些可能是物理资源故障。这把异常分为三类，为了理解异常处理，你必须理解这些类别：\n\
    \n- **检出异常（Checked Exceptions）**：这种情况发生在编译时，且无法忽略——程序员必须在当时处理它们。\n\n例如，假设你使用 `FileReader`\
    \ 类从指定文件读取数据。如果该文件不存在，你将看到 `FileNotFoundException`，并且你必须立即处理它。\n\n- **未检出异常（Unchecked\
    \ exceptions）**：这种情况发生在执行时（也称为运行时异常）。这些在编译时被忽略。\n\n例如，如果你在程序中声明了一个大小为 6 的数组，并尝试调用第\
    \ 7 个元素，你将得到 `ArrayIndexOutOfBoundsException` 异常。\n\n- **错误（Errors）**：这些不是异常；而是程序员或用户无法控制的问题。这些往往会被忽略，因为你通常对它们无能为力。\n\
    \n## 层次结构\n\n每个异常类都是 `java.lang.Exception` 类的子类，而这又是 `Throwable` 类的子类。还有一个还有一个名为\
    \ `Error` 的类，它也是 `Throwable` 类的子类。\n\n`Exception` 类有两个主要的子类：`IOException` 和 `RuntimeException`。\n\
    \n## 异常方法\n\n这些是 `Throwable` 类中更重要的方法：\n\n- public String getMessage():：返回包含错误详情的消息，在\
    \ `Throwable` 的构造函数中初始化\n- public Throwable getCause():：返回异常原因，由对象表示\n- public\
    \ String toString():：返回类名与 `getMessage()` 结果的拼接\n- public void printStackTrace():：将带有堆栈跟踪的\
    \ `toString()` 结果打印到错误输出流\n- public StackTraceElement[] getStackTrace():：返回包含每个堆栈跟踪元素的数组，索引\
    \ 0 表示栈顶，最后一个索引表示调用栈的底\n- public Throwable fillInStackTrace():：用当前跟踪填充 `Throwable`\
    \ 对象的堆栈跟踪，添加之前的信息\n\n## 捕获异常\n\n使用同时包含 `try` 和 `catch` 关键字的方法来捕获异常。我们在可能抛出异常的代码周围放置一个\
    \ `try/catch` 块。这就是受保护的代码。`try/catch` 的语法为：\n\n```java\ntry {\n    // 受保护的代码\n\
    }catch(ExceptionName e1) {\n    // 捕获块\n}\n```\n\n每个 `try` 块必须后续 `catch` 或 `finally`\
    \ 块。`catch` 语句用于声明你想捕获的异常类型。如果指定的异常列在捕获块中，它就像我们传递方法参数一样被传递。\n\n## 多个 catch 块\n\
    \n`try` 块可以由多个 `catch` 块后续。使用多个 `catch` 块的语法为：\n\n```java\ntry {\n    // 受保护的代码\n\
    }catch(ExceptionType1 e1) {\n    // 捕获块\n}catch(ExceptionType2 e2) {\n    // 捕获块\n\
    }catch(ExceptionType3 e3) {\n  // 捕获块\n}\n```\n\n这里显示了三个块，但只要跟在一个 `try` 块后面，可以使用任意。如果异常发生在保护代码中，它将传递给第一个\
    \ `catch` 块；如果异常类型与 `ExceptionType` 匹配，它将被捕获；否则，将传递给下一个 `catch` 块。这将一直持续，直到异常被捕获或所有\
    \ `catch` 块执行完毕。在这种情况下，方法将停止执行并将异常抛给调用栈上之前的方法。\n\n## 捕获多种异常类型\n\nJava 现在允许在一个\
    \ `catch` 块中捕获多种异常，从而简化你的代码。这是要使用的语法：\n\n```java\ncatch (IOException|FileNotFoundException\
    \ ex) {\n  logger.log(ex);\n  throw ex;\n}\n```\n\n## throws/throw 关键字\n\n如果一个检出异常没有被方法处理，该方法必须使用\
    \ `throws` 关键字来声明它。这出现在方法签的末尾。可以使用 `throw` 关键字抛出异常。理解 `throws` 和 `throw` 关键字非常重要：\n\
    \n- **throws**：推迟检出异常的处理\n- **throw**：显式地抛出一个或多个异常\n\n方法可以声明它抛出一个或多个异常；如果声明了多个，这些异常将用逗号分隔列出。\n"
