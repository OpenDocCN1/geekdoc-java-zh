    # Operator precedence


    Operator precedence is used to determine how expressions are evaluated by looking
    at the terms inside it. Some operators have a higher precedence than others, such
    as multiplication over addition. For example:


    ```

    x = 6+2*3

    ```


    Here, x is given a value of 12 and not, as you may assume, 24. Because multiplication
    is higher in the precedence order, Java will calculate this as 2*3 and then add
    the 6. Here, the operators are in order of their precedence from highest to lowest.
    In any expression, those operators with the highest precedence will be the first
    ones evaluated:


    | Category | Operator | Associativity |

    | --- | --- | --- |

    | Postfix | >() [] . (dot operator) | Left to right |

    | Unary | ++ - - ! ~ | Right to left |

    | Multiplicative | * / | Left to right |

    | Additive | += - | Left to right |

    | Shift | >>> >>> << | Left to right |

    | Relational | >> >= <= | Left to right |

    | Equality | >== !== | Left to right |'
