    On occasion, you may have a piece of code that you want to execute multiple times.
    Generally, Java executes statements in the sequence they are written—the first
    statement within a function goes first, then the second, and so on for as as many
    statements as there are in the function. Like other programming languages, Java
    gives us a certain amount of control over this, allowing us to carry out more
    complex executions.


    Loop statements are used to execute a single statement or a group of statements
    several times over, and Java gives us three of these to play with:


    | Loop | Description |

    | --- | --- |

    | while loop | Will repeat one or more statements in a group provided a specified
    condition evaluates true. The condition is tested before the loop body is executed.
    |

    | for loop | Will execute a statement sequence several times and abbreviates the
    piece of code responsible for management of the loop variable. |

    | do...while loop | Similar to the while loop with the exception that the loop
    body is executed before the condition is tested. |


