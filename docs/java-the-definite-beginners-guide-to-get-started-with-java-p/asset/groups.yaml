    # Introduction


    Java is, without a doubt, one of the most popular of all the programming languages,
    and it''s used for a wide range of applications and environments. Like all computer
    languages, Java has its own unique structure rules for syntax and paradigms, the
    latter of which is based on OOP—Object-Oriented Programming.


    Java is a derivative of C language, so if you are familiar with C, the syntax
    rules will look quite similar. In terms of structure, the language begins with
    packages, within which you''ll find classes. These, in turn, contain methods,
    constants, variables, and so on. You''ll learn the basics of these in this guide.


    First developed in 1991, Java has gone on to become one of the most important
    of all programming languages, and for those who want to learn the basics of any
    language, Java should be one of your first stops. This is only a basic guide,
    but it provides everything you need to know to get started before you can move
    on to anything more complex.'
  - '[PAGE 15]


    # Chapter 1:

    All About Java


    No matter what anybody says about computers, it''s often thought that computers
    are good for just a few reasons:


    +   * Computers are our electronic slaves. You can leave your computer to work
    on calculations for eternity (albeit the charger connected to it) and it will
    never complain or tire out.

    * When you wanted to share an idea with someone across the globe in earlier times,
    you would hire a messenger and send the message written on paper or parchment.
    This is a wasteful process in this era, however, because we are now in the electronic
    age. Computers can help you communicate with the world in a matter of seconds.

    * The best thing about computers is that they are efficient. The messages you
    want to communicate are all transmitted using just a little electrical power,
    and all of this is done with absolutely no fuss or any extra physical energy.
    It''s when you start dealing with things efficiently that good things happen.
    You realize that all the overhead is gone—you don''t have to to use paper or cut
    down trees any more, you''ll only need to push numbers and concepts through the
    system.


    # What can you do with Java?


    It would definitely be amazing if one could remove any complexity in the ideas
    and instructions that are shared. Unfortunately, that''s not the case. There would
    be one person who would need to think hard about what the computer would need
    to do. Once they had thought it through, they would need to'
- md: '

    write a set of instructions or an algorithm that would help the computer easily
    perform the task.


    You won''t be able to write these instructions in English or any other language.
    Most science fiction movies and novels portray robots as machines that can understand
    every single word that''s spoken to them. However, this is not true; a spoken
    language can''t be used to communicate with a machine for the following reasons:


    - Sentences can often be misinterpreted.

    - There is no easy way to weave a complex command using any language.

    - Most sentences in English include unnecessary words.


    You''ll need to use a different language to communicate with a computer. These
    languages are called computer programming languages. A set of instructions written
    using this language is called a program. Multiple programs constitute software
    (or code).


    You can learn to write computer programs or use someone else''s programs. If you
    prefer the latter, you''ll need to use whatever program that person has coded.
    However, when you write the program yourself, you''ll be able to tailor it to
    suit your requirements.


    Writing computer code has been popular from the beginning. Large companies have
    teams, departments and employees in different divisions writing code for them.
    But you can write code for yourself or for other people for a living or just for
    fun. It was recently estimated that the number of lines of code being written
    in the United States exceeds the number of molecules of methane on Jupiter. Now,
    this might be true, and isn''t. The truth is, however, that you can make your
    computer do just anything if you spend the right amount of time to write your
    very own code. Of course, the time spent on writing the code could be a few minutes
    or maybe even a few years, but don''t let that deter you. You can write some of
    the most interesting code in just a few minutes!


    ## Object-oriented programming


    Java is an object-oriented language. You may be wondering what that means. Some
    of the earlier machine languages (like FORTRAN) focused only on giving the computer
    instructions on what tasks needed to be done. Object-oriented languages, like
    Java, focus more on the data. Of course, these languages still instruct the computer
    on what needs to be done. However, before commands are given to the machine, the
    data is organized.


    Java is better than FORTRAN since it organizes data in a way that helps the user
    perform multiple functions on the data. If you want to change the way the data
    is organized, you won''t need to start from scratch. You''ll only have to modify
    the programs being used.


    Data is often organized using objects and classes. Let''s assume that you''re
    writing a program to keep track of the houses being constructed in a new condominium.
    These houses differ slightly from each other. Each house has different indoor
    paint, distinctive siding color, a kitchen cabinet style, a bedroom style, and
    so on. When you write an object-oriented program, each house becomes an object.


    The objects don''t constitute the entire story. Though the houses differ from
    one another slightly, each house has the same set of characteristics. For instance,
    every house has a characteristic called the siding color, the kitchen cabinet
    style, the bedroom style, and so on. Your object-oriented program will need a
    master list that consists of the characteristics that every house can possess.
    This master list is called a class. There you have it. However, object-oriented
    programming should have been named “programming with classes and objects.


    You may notice that I have used the word “classes” first, and you must be wondering
    how one could possibly do that. Let''s consider a condominium development. Right
    in the middle of the construction, there''s probably a rickety trailer that has
    a list of characteristics called the blueprint. A class in an object-oriented
    program can be compared to a blueprint. A blueprint has the list of characteristics
    that every house will have as well as a clear picture of exactly how a house should
    look. The blueprint will say siding, but the actual house may have a blue or yellow
    siding. The same goes for every other characteristic of the house.


    This analogy doesn''t always end with the list of characteristics. There is another
    parallel that exists between classes and blueprints. Once the blueprint is created,
    it''s used to build the houses in the condominium development. There may be close
    to ten or twelve houses built at the end of a year. The same can be said for classes
    and objects. The programmer first writes the code to provide a class with its
    attributes and once the program runs, the computer creates objects using that
    class.


    That''s the relationship that exists between classes and objects. The programmer
    first defines the class, and based on the definition of that class, the computer
    creates the individual objects.


    ## Why is object-oriented language good?


    Let''s take the example about the condominium development from the previous section
    and assume that you have already written a computer program to help you keep track
    of the instructions for building a house in this new development. The boss then
    decides to make a change to the plan—he decides that half the buildings will be
    duplex housing while the other half will have four bedrooms.


    If you were to use the old C or FORTRAN style of computer programming, the instructions
    you would write be as follows:


    Dig a ditch for the basement. Lay concrete around the sides of the ditch. Put
    two-by-fours along the sides for the basement’s frame, etc.


    The program above would be a long list of instructions that an architect would
    create (instead of a blueprint). In order to modify the plan, you would need to
    go through the series of instructions to identify the right places to make the
    changes. To make it worse, these instructions could be scattered across a thousand
    pages. If the builder had to go through all these instructions, the task would
    become ten times harder.


    Starting with a class is similar to starting with a blueprint. If you have decided
    to have duplex houses and four-bedroom houses, you can begin using a blueprint
    called the house blueprint, which has the ground and first floor, without any
    walls on the first floor. Then you can make two more similar blueprints—one for
    the penthouse and one for the four-bedroom house—and rename these blueprints.
    Your colleagues will be amazed at what you have done, but they''ll have concerns.
    They''ll probably ask the following question: “You have renamed all the blueprints
    differently. How can you do this if the blueprints being used are almost the same?”


    This is when you say, “The duplex house blueprint can say, ''For more information
    about the lower floors, please take a look at the original blueprint.’ The four-bedroom
    blueprint can also say the same thing. We can take advantage of the blueprint
    that we have already made and save tons of money with this setup.


    When it comes to object-oriented programming, the duplex house and the four-bedroom
    house classes inherit the features of the original house class. You can also say
