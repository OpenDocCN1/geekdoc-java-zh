    - transient

    - try

    - void

    - volatile

    - while


    # Java comments


    Java has support for single and multi-line comments. Look at the examples below
    to see how they work:


    ```

    // This would be a single line comment

    /* This would also be a single line comment. */

    /* While this is a good example

    Of a multiline comment. */

    ```


    Note the use of the slash and asterisk characters to indicate the comments that
    will be ignored by the Java compiler.


    # Blank lines


    A line may be blank or it may contain just a comment. This is called a blank line
    and will be ignored by Java.


    # Inheritance


    Java allows a class to be derived from another class. Basically, if you have a
    class and you need a new one, if the original one has some of the code you need,
    you may derive the new class from the old one. This lets you reuse methods and
    fields that may be in the existing class without the need to rewrite the code.
    The existing class is known as the superclass while the derived class is the subclass.
    This is known as an inheritance.


    In the next chapter, we are going to be looking at objects and classes.


    # Chapter 6:

    Objects and Classes


    # Objects


    Think about the world around you; there are lots of different types of objects,
    such as dogs, humans, buildings, houses, etc. Each of these objects has its own
    behavior and state. Consider the dog, for example; it has states of name, color,
    breed, etc., and behaviors of running, barking and tail wagging. Compare this
    to a software object and you''ll see that there isn''t much of a difference because
    a software object also has states and the behaviors. The state is stored in a
    field and the behavior is indicated through a method.


    # Classes


    Classes are blueprints and we can create an object from it. Each class may contain
    one, some or all of these types of variable:


    - **Local**: A variable that has been defined inside a method, block or constructor
    is known as a local variable. It''s declared and then initialized inside the method
    and when the method has completed, the variable is destroyed.

    - **Instance**: This is a variable that has been defined inside a class but outside
    a method. They are initialized at the time of class instantiation, and they can
    be accessed within a method, block or constructor of the class.

    - **Class**: These are declared in a class and outside a method using the static
    keyword.

    - **Class variables**: Class variables are variables declared within a class,
    outside any method, with the static keyword.


    Classes can have multiple methods for accessing the values of different methods.
    In the case of a dog, barking() is a method.


    # Constructors


    Constructors are very important when we talk about classes. Each class has one
    and if we don''t write one for our class, Java will provide a default constructor.
    Whenever a new object has been created, one or more constructors will be invoked.
    The primary rule for a constructor is that it must have an identical name to the
    class, and a class may have more than one constructor.


    Java also provides support for the singleton class, where you can create one instance
    of the class.


    # Creating objects


    We know that the object is created from the class and we use the new keyword to
    do this. These three steps must be followed when you create a class:


    - **Declaration**: A variable with a variable name and an object type must be
    declared.

    - **Instantiation**: We use the new keyword to create an object.

    - **Initialization**: A call to a constructor follows the new keyword, and this
    will initialize the object.


    To access an instance variable or a method, we create an object. To access an
    instance variable or a method, we create an object.


    ```

    Object reference = new Object();

    ```


    ```

    Object variable;

    ```


    ```

    Object.method();

    ```


    # Rules for declaring source files


    Source file rules are important when you are declaring a class, an import statement.


    - You may only have one public class.

    - A source file may have as many non-public classes as you want.

    - The public class must have the same name, appended with .java.

    - The package statement is the first line of the file.

    - If there are import statements, they should be written between the package statement
    and the class declaration. If there is no package statement, the import statement
    will be the first line.

    - Package and import statements apply to every class.


    A Java package is a categorization of class—this must be done when you are programming,
    just to make life easier for yourself.


    The import statement provides the right location for the compiler to find a specific
    class.


    In the next chapter, we will look at data types.


    # Chapter 7:

    Data Types


