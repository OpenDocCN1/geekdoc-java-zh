    # Chapter 13:

    Java Methods


    Java methods are collections of statements in a grouping that perform a specified
    operation. For example, calling the System.out.println() method would result in
    the system executing a number of statements to display the output on the console.


    Now we are going to look at how to create a method, be it with return values or
    without without, how to invoke methods, with parameters or without, and how to
    apply method abstraction.


    # Creating a method


    The syntax for creating a method is:


    ```

    public static int methodName(int a, int b) {


    // body

    }

    ```


    Let''s look at each part of that means:


    +   * public static: this is the modifier

    * int: this is the return type

    * methodName: this is the method name

    * a, b: these are formal parameters

    * int a, int b: this is the list of parameters


    A method has a method header and body, as per this syntax:


    ```

    modifier returnType nameOfMethod (Parameter List) {

    ```'
  - '[PAGE 74]


    ```

    // method body

    }

    ```


    This syntax shows:


    +   - **modifier**: to define the method access type (this is optional)

    - **returnType**: the method may return a value

    - **nameMethod**: the name of the method—the signature consists of the name and
    the list of parameters

    - **parameter list**: the parameter list, the order and the number of the parameters
    to the method; these are all optional as the method doesn''t need to contain any
    parameters

    - **method body**: the body of the method defines what is done with the statements
    by the method


    # Calling a method


    To use a method, you must first call it, and that can be done in two ways: with
    a returned value or without. Calling a method is actually very simple. When the
    method is invoked by the program, control is transferred to the method. This,
    in turn, will return that control back to the caller under two conditions:


    +   - the return statement has been executed

    - it gets to the closing brace of the method


    If a method returns void, it''s considered as a call to a statement. If we want
    a method to return no value, we declare it using the void keyword. A Java statement,
    ending with a semicolon, must be used to call a void method.


    # Passing a parameter by value


    When we are working under the calling process, arguments may be passed. These
    arguments should be ordered the same way as their respective parameters in the
    specification of the method. A parameter may be passed by reference or value.
    When you pass a parameter by value, you are calling a method that has a parameter,
    passing the argument value to that parameter.'
