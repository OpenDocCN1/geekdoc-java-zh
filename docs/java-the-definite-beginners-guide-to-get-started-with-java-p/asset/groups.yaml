    # 构造函数


    当我们谈论类时，构造函数非常重要。每个类都有一个构造函数，如果我们没有为类写一个，Java 将提供一个默认构造函数。每当创建一个新对象时，就会调用一个或多个构造函数。构造函数的主要规则是它的名称必须与类名相同，且一个类可以有多个构造函数。


    Java 还支持单例类，你可以创建该类的一个实例。


    # 创建对象


    我们知道对象是从类创建的，我们使用 `new` 关键字来实现这一点。当你创建一个类时，必须遵循这三个步骤：


    - **声明**：必须声明一个带有变量名和对象类型的变量。

    - **实例化**：我们使用 `new` 关键字来创建对象。

    - **初始化**：在 `new` 关键字之后调用构造函数，这将初始化对象。


