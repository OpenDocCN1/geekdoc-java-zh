    # Decision making


    Decision making is an important part of Java. The structures of decision-making
    statements include at least one condition that needs evaluating and testing by
    the program, as well as one or more statements that will be executed provided
    the condition is true. Optionally, you may also include other statements that
    will execute if the condition evaluates false. The following are the decision-making
    statements in Java:


    | Statement | Description |

    | --- | --- |

    | if statement | Contains a Boolean expression and then at least one statement.
    |

    | if...else statement | May be succeeded by an else statement that will execute
    should the Boolean expression evaluate false. |

    | nested if statement | One or if else statement may be used inside another or
    if else statement. |

    | switch statement | For use when you want to test a variable for equality against
    a list of given values. |


    # ? : Operator


    We already touched on this earlier. The ? : is a conditional operator that may
    be used instead of an if...else statement, and its format looks something like:


    ```

    Exp1 ? Exp2 : Exp3;

    ```


    Exp1, Exp 2 and Exp 3 are all expressions—be sure to note the use of the colon
    and its placement.


    To work out the value of the entire expression is, Exp 1 is evaluated first:


    +   - If Exp1 has a value of True, the value of Exp2 will then be the value of
    the entire expression.'
