    # User-defined exceptions


    A user may create their own Java exceptions. Keep these pointers in mind when
    you create an exception class:


    +   - Every exception must be a child of the parent class Throwable.

    - The Exception class must be extended if you want a checked exception that''s
    enforced automatically by the Handle or Declare ruling.

    - The Runtime Exception class must be extended if you want a runtime exception.


    To define an exception class, use the following syntax:


    ```

    class MyException extends Exception {

    \}

    ```


    Just ensure that the Exception class already defined is extended when you create
    an exception. User-defined exceptions are classed as checked exceptions and they
    are much like any other class in that they contain useful methods and fields.


    # Common exceptions


    There are two categories of exceptions and errors that you can define in Java:


    +   - JVM: JVM exceptions or errors are thrown logically or exclusively by the
    Java Virtual Machine. Examples include ClassCast Exception, NullPointerException
    and ArrayIndexOutOfBoundsException.

    - Programmatic: These are explicitly thrown by the API programmer or by the application.
    Examples include IllegalStateException and IllegalArgumentArgumentException.'
