    为了创建引用变量，我们定义了类的构造函数。引用变量用于访问对象，并被声明为特定类型，称为不可变类型——这意味着它们一旦声明就无法更改。引用对象包括类对象和各种数组变量。所有引用变量的默认值为
    null，它们可以指向所声明类型的对象，或任何兼容的类型对象。


    ## Java 字面量


    字面量是固定值的源代码表示，直接表示在代码中，不需要任何计算。它们可以被赋值给任何基本类型变量，例如：


    ```

    byte a = 67;

    ```


    ```

    char a = ''A'';

    ```


    Int, byte, short 和 long 也可以用八进制、十进制或十六进制系统表示。前缀 0 表示八进制系统，0x 前缀表示十六进制系统。例如：


    ```

    int decimal = 100;

    int octal = 0144;

    int hexa = 0x64;

    ```


    Java 字符串字面量的指定方式与其他语言几乎相同——一组包含在双引号中的字符序列。


    Java 还支持一些用于 char 和字符串字面量的转义序列。这些是：


    | 转义序列 | 表示 |

    | --- | --- |

    | \n | 换行 |

    | \r | 回车 |

    | \f | 换页 |

    | \b | 退格 |

    | \s | 空格 |

    | \t | 制表符 |

    | \" | 双引号 |

    | \'' | 单引号 |

    | \\ | 反斜符 |

    | \ddd | 八进制字符 |

    | \xxxx | 十六进制 Unicode 字符 |


    在下一章中，我们将学习不同的 Java 运算符。


    ## 第8 章：

    ### Java 运算符


    Java 包含了几个用于操作变量的运算符：


    ### 算术


    这些运算符与你在学校中使用符号的方式相同：


    | 运算符 | 描述 |

    | --- | --- |

    | + | 加法，用于相运算符左侧或右侧的值 |

    | - | 减法，从左侧减去右操作数 |

    | * | 乘法，用于相运算符左侧或右侧的值 |

    | / | 除法，左操作数除以右操作数 |

    | % | 取模，左操作数除以操作数的余数 |

    | ++ by 1 | 递增，用于增加操作数的值 |

    | -- by 1 | 递减，用于减少操作数的值 |


    ### 关系


    Java 中有几种关系运算符：


    | 运算符 | 描述 |

    | --- | --- |

    | == (等于) | 检查操作数的值是否相等；如果相等则求为真 |

    | != (不等于) | 检查操作数的值是否相等；如果不相等则求为真 |

    | > (大于) | 检查左操作数是否大于右侧；如果是则求为真 |

    | < (小于) | 检查左操作数是否小于右侧；如果是则求为真 |

    | >= (大于等于) | 检查左操作数是否大于或等于右侧；如果是则求为真 |

    | <= (小于等于) | 检查左操作数是否小于或等于右侧；如果是则求为真 |


    ### 逻辑


    | 运算符 | 描述 |

    | --- | --- |

    | && (逻辑与) 值 | 如果两个操作数都非零，则求为真 |

    | || (逻辑或) | 如果任一操作数非零，则求为真 |

    | ! (逻辑非) | 如果条件为真，则求为假，因为它反转了操作数的逻辑状态 |


    ### 赋值


    | 运算符 | 描述 |

    | --- | --- |

    | = | 将右操作数的值赋值给左侧 |

    | += | 将右操作数的值加到左侧并将结果赋值给左侧 |

    | -= | 从左操作数减去右侧并将结果赋值给左侧 |

    | *= | 右侧与左操作数相乘并将结果赋值给左侧 |

    | /= | 左操作数除以右侧并将结果赋值给左侧 |

    | %= | 取两个操作数的模并将结果赋值给左侧 |

    | <<= | 左移并赋值 |

    | >>= | 右移并赋值 |


    ### 杂


    还有几个其他运算符


