    # Chapter 4:

    Understanding a Simple Java Program


    This chapter analyzes and explains the Java program that was shown in the previous
    chapter.


    ## The Java class


    Since Java is an object-oriented programming language, you''ll need to always
    create and describe classes and objects. If you are not sure about this yet, you''ll
    need to read through Chapter 1 again.


    Java is one of the purest forms of object-oriented programming languages when
    compared to any other object-oriented programming language. This is because you
    can do absolutely anything in Java once you have created a class of some kind.
    This is like when you are on Jeopardy and hear Alex Trebek say, “Let''s go to
    commercial!” and then interrupt him and say, “I''m sorry, but you can''t issue
    any instruction that way without adding an instruction to your class.”


    It''s important to remember that the entire program that you write is a class.
    When you write a program, you can make the name for your class. It would be best
    to use a name that depicts the function of the class. The program uses the name
    Displayer (since the program displays a line on the screen). This is why the program
    in the previous chapter named the class “Example.”


    The first two words in the program are public and class, which are the Java keywords.
    No matter what program you are writing or who is writing the program, the words
    public and class are always used in the exact same way. On the other hand, the
    word Displayer is used as an identifier since it identifies a particular class
    in the program. The word public means that every other program in Java can use
    the features of the function that have been declared.


    The Java PROGRAMMING LANGUAGE IS case-sensitive. If you change a lowercase letter
    to an uppercase letter in Java, you change the meaning of the entire word. There
    are times when these words can be rendered useless. In the first line of the program,
    you can''t replace the word “class” with “Class.” IF YOU DO, THE WHOLE PROGRAM
    STOPS WORKING. The same holds true for the names of files that contain the particular
    class. For instance, the class in the program in the previous chapter uses a class
    whose name starts with an uppercase D. If you were to call this class in any other
    program, you''ll need to use the exact name—“Displayer.”


    If you define any class, its code will go into a file with the name of the class.
    For example, the code in the Displayer class will go into the following file—Displayer.java.
    The name of the class will be spelled in the exact same way as the name of the
    class in the program. This file naming convention is important to remember.


    ## Java method


    You''re working as an auto mechanic in an upscale garage. Your boss, who''s always
    in a hurry and has a habit of running words together, says, “fixTheAlternator
    on junkyOldFord.” Mentally, you run through a list of tasks. “Drive the car into
    the bay, lift the hood, get a wrench, loosen the alternator belt,” and so on.
    Three things are going on here:


    - You have a name for the thing you''re supposed to do. The name is fixTheAlternator.

    - In your mind, you have a list of tasks associated with the name fixTheAlternator.
    The list includes “Drive the car into the bay, lift the hood, get a wrench, loosen
    the alternator belt,” and so on.

