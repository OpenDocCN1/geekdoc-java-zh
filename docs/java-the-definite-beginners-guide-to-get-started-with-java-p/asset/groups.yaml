  mdcn: '

    这时你就可以很有信地告诉他们，你永远不需要动原始房屋的蓝图了。你只需要创建另一个小蓝图并重命名即可。如果有人想在底层添加一个花园，你可以为那个花园准备一份蓝图，并将其重命名为“客厅里的花园”（Garden-in-living-room）蓝图。你可以使用原始蓝图处理房屋的其他部分，并将新蓝图作为原始房屋蓝图的扩展。在面向对象编程的语言中，客厅花园计划图是原始房屋蓝图的扩展。“客厅里的花园”蓝图仍然是原始类的子类。超类、父类和子类的所有术语仍然适用于这个新蓝图。唯一的新的一点是，花园将成为原始蓝图的一个新功能。


    在面向对象编程语言开发之前，编程世界在开发软件方面经历了一场巨大的危机。程序员编写了新代码，然后发现他们需要一些不同的东西。他们不得不放弃代码并重新编写新代码。这个问题反复发生，大多数所编写的代码都无法重用。面向对象编程彻底改善了这一局面。


    ## 第 2 章：

    ## 配置你的环境


    在进行任何其他操作之前，最重要的是配置你的环境，为此你需要 Java 软件开发包（JDK）。它是免费的，并且可以在 Windows 和 Mac OS 上运行。


    ## 下载 JDK


    要下载 JDK，请访问 Java 网站（http://www.java.com/java/technologies/downloads/），然后点击该系统最新版本的
    JDK。选择你的操作系统和相应的系统。点击接受许可协议，下载将开始。按照屏幕上的所有提示操作，并确保选择一个你记得的保存位置。


    ## 安装 JDK


    一旦成功下载了 JDK，下一步是在你的操作系统上安装它。


    ### Windows


    - 找到你下载的文件并双击它。

    - 点击“允许”让应用程序对计算机进行更改。

    - 如果提示请求安装权限，点击“是”或“确定”。

    - 将出现“安装程序”界面；点击“下一步”。

    - 按照屏幕上的指令安装 Java。

    - 点击“下一步”接受默认设置，然后等待安装完成。

    - 点击“关闭”，然后同时按下 Windows 键和 X 键。

    - 将打开电源菜单；从菜单中点击“系统”。

    - 点击“高级系统设置”。

    - 找到“高级”选项卡并点击它。

    - 点击“环境变量”，将出现一个新框。

    - 在“系统变量”下，点击“Path”变量。必须完全按照接下来的步骤操作，因为没有办法撤销错误的步骤。

    - 对于 Windows 10，点击“新建”。

    - 输入 `c:\Program Files\Java\jdk1.x.x_xx\bin`——输入你安装的版本。

    - 点击“上移”，直到你看到该路径位于列表顶端，然后点击“确定”。

    - 对于所有其他 Windows 版本，点击“编辑系统变量”，然后点击变量值字段。**不要**删除此字段中的内容——只需向其中添加以下内容，输入下载的版本号：`C:\Program
    Files\Java\jdk1.x.x_xx\;`

    - 结尾处的分号非常重要，所以不要忘记。

    - 多次点击“确定”，直到所有窗口关闭且你的安装完成。

    - 下一步是确保它安装正确。按下 Windows 键和 R 打开“运行”框。

    - 输入 `cmd` 并按回车键。

    - 将打开一个终端窗口。在命令提示符处，输入 `path` 并按回车键。你现在应该看到你之前输入的路径。

    - 输入 `java -version` 并按回车键——你安装的 Java 版本应该显示在你的屏幕上。

    - 注意：如果这两个命令中的任一个不起作用，请关闭电脑并重启；这将加载新的环境变量。再次尝试，你应该会成功。


    ### Mac OS


    - 找到你下载的文件并双击它。

    - 双击“包”（Package）图标，安装程序将打开。

    - 点击第一个窗口中的“继续”。

    - 如果出现显示“选择目标”（Destination Select）的窗口，选择“为此电脑的所有用户安装”。

    - 点击“安装”并输入你的用户名和密码。

    - 点击“安装软件”并等待安装完成。

    - 打开你的 Mac 应用程序（Applications）文件夹。你将测试安装是否成功。

    - 点击“前往 > 应用程序 > 实用工具”。

    - 将出现一个实用工具列表。双击“终端”（Terminal）——命令提示符应该打开。

    - 在提示符处，输入 `javac -version` 并按返回。如果成功，JDK 版本号将显示在你的命令下方。


    下一步是安装 Eclipse：


    ### Windows


    - 访问 Eclipse (https://www.eclipse.org/downloads/eclipse-packages/)

    - 点击“开始使用”（Getting Started），然后点击“下载 Eclipse IDE”。

    - 选择适合你电脑的版本，然后点击“下载”。

    - 解压缩文件，将其保存到你记得的位置，就好了。要打开它，只需双击该文件，它将在 IDE 中打开——这就是你将进行所有工作的地方。


    ### Mac OS


    - 遵循上述步骤并下载适用于 Mac 的正确版本——你将下载一个 TAR 文件。

    - 双击此文件将其展开为一个名为 Eclipse 的文件夹。

    - 将此文件夹拖到 Mac 的应用程序（Applications）文件夹中。

    - 要打开，点击 Eclipse 文件夹，然后点击 Eclipse 图标。


    ## 如何在 Eclipse 中编写程序


    - 启动 Eclipse。

    - 为你的工作空间选择一个目录（这是保存文件的地方）。- 如果欢迎界面加载，请关闭它。

    - 点击文件 > 新建 > Java 项目

    - 在项目项目名称中输入 FirstProject

    - 点击使用默认位置

    - 在 JRE 下，选择使用默认 JRE

    - 在项目布局下，勾选源文件夹

    - 点击完成


    ## 第 3 章：

    ## 使用基础构建块


    本章将采用多层方法。在阅读过程中，你将遇到 Java 编程的基本细节。


    ### 学习 Java 语言


    在讨论 Java 之前，让我们仔细看看英语语言。你可能会看到大量的单词，因为大多数语言都是由单词构成的。这种语言的想法非常底层。如果你尝试稍微高阶一点，就会开始看到语法。


    语言的语法本质上是正确使用该语言必须遵循的规则。第二类习语包括各种句子，如“诚实是上金石”或“贝利是历史上最伟大的运动员之一”。

