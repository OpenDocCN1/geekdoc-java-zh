    Where Java programs are concerned, you need to keep a couple of points in mind:


    - Java is a case-sensitive language. The identifiers Hello and hello have separate
    meanings.

    - Class names must always begin with an uppercase letter. If there are several
    words in the name, each word must start with an uppercase letter, i.e., class
    MyJavaClass.

    - By contrast, the names of the methods must begin with a lowercase letter. If
    there are several words in the name, the first must begin with a lowercase letter
    while all subsequent words begin with an uppercase letter, i.e., for example,
    public void myMethod().

    - Class names and program or file names must match exactly. When you save your
    file, use the class name to save it and append it with .java. For example, the
    class is called MyJavaProgram, so you would save it as MyJavaProgram.java—don''t
    forget the sensitivity! If you don''t save your files like this, your program
    won''t compile.

    - Processing in every Java program begins with the main() method—this is mandatory
    and cannot be skipped (for example, public static void main(String args[])).


    # Java identifiers


    Every component of Java needs a name, and the names used for the classes, methods,
    and variables are called identifiers. There are special rules to follow with identifiers:


    - All identifiers must begin with a letter, (a to z or A to Z, underscore (_),
    or a currency character ($).

    - The rest of the identifier may be made up of any character combination.

    - You may not use key words as identifiers names.

    - All identifiers are case sensitive.


    # Java modifiers


    We will look more closely at these in the next chapter but for now, remember that
    you can modify a class, a method, etc., by using a modifier, of which there are
    two categories:


    - Access: private, default, protected, public

    - Non-access: static, transient, synchronised, abstract, final


    Don''t worry about what all this means just yet, it will become clear!


    # Java variables


    There are three variable types in Java:


    - Local variables

    - Class or static variables

    - Instance or non-static variables


    # Java arrays


    An array is an object that holds multiple variables as long as they are all the
    same type. An array is called an object “on the heap,” and we will look closer
    at this later.


    # Java keywords


    This is a list of all the reserved keywords for Java. You may not use them for
    any identifier name:


    - abstract

    - assert

    - Boolean

    - break

    - byte

    - case

    - catch

    - char

    - class

    - const

    - continue

    - default

    - do

    - double

    - else

    - enum

    - extends

    - final

    - finally

    - float

    - for

    - goto

