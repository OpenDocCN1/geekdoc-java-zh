    \ of memory\n\nSome are user errors, others are programmer error, and yet others\
    \ may be failed physical resources. This gives three categories of exceptions\
    \ and to understand exception handling, you must understand these categories:\n\
    \n- Checked Exceptions: This happens at compile time and can't be ignored—the\
    \ programmer must handle them at the time.\n\nLet's say, for example, that you\
    \ use the class called FileReader for reading data from a specified file. If that\
