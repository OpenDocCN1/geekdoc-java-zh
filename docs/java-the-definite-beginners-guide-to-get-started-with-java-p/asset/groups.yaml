    # 第 4 章：

    理解一个简单的 Java 程序


    本章分析并解释了上一章展示的 Java 程序。


    ## Java 类


    由于 Java 是一门面向对象的编程语言，你始终需要创建并描述类和对象。如果你对此还不确定，那么你需要重新阅读一遍第 1 章。


    与任何其他面向对象的编程语言相比，Java 是最纯正的面向对象编程语言之一。这是因为一旦你创建了某种类，你就可以在 Java 中做任何事情。这就像你在看《危险一答》（Jeopardy）节目，听到
    Alex Trebek 说：“让我们进入广告时间！”然后你打断他并说：“抱歉，如果你不向你的类中添加一条指令，你不能那样发布任何指令。”


    记住，你编写的整个程序都是一个类。当你编写程序时，可以为你的类命名。最好使用一个描述该类功能的名称。该程序使用了 `Displayer` 这个名字（因为该程序在屏幕上显示一行）。这就是为什么上一章的程序将类命名为“Example”。


    程序前两个单词是 `public` 和 `class`，它们是 Java 的关键字。无论你正在编写什么程序或由谁编写程序，`public` 和 `class`
    这两个词的使用方式完全相同。另一方面，`Displayer` 被用作标识符，因为它标识了程序中的特定类。`public` 意味着 Java 中的其他所有程序都可以使用声明的函数功能。


    Java 编程语言是区分大小写的。如果你在 Java 中将一个小写字母改为大写字母，你就改变了整个单词的含义。有时这些单词会变得毫无用处。在程序的第一行中，你不能将单词
    `class` 替换为 `Class`。如果你这样做，整个程序将停止工作。包含该特定类的文件名也是如此。例如，上一章程序中的类使用了一个名称以大写字母 D
    开头的类。如果你在任何其他程序中调用此类，你需要使用完全相同的名称——“Displayer”。


    如果你定义了任何类，它的代码将进入一个与类名同名的文件。例如，`Displayer` 类中的代码将进入以下文件——`Displayer.java`。类名的拼写与程序中类名完全相同。记住这个文件命名约定很重要。


    ## Java 方法


    你在一家高档修理厂担任汽车修理技师。你的老板总是风风火火，并且有单词连在一起说的习惯，他说：“fixTheAlternator on junkyOldFord（给那辆旧福特修理发电机）”。你在脑海中过了一遍任务清单：“开车进维修间，打开引擎盖，拿一把扳手，松开发电机带”，等等。这里发生了三件事：


    - 你对需要做的事情有一个名字。这个名字是 `fixTheAlternator`。

    - 在你的脑海中，你有一份与 `fixTheAlternator` 相关的任务列表。列表包括“开车进维修间，打开引擎盖，拿一把扳手，松开发电机带”等等。

    - 你有一个脾气暴怪的老板让你做所有这些工作。你的老板通过说“fixTheAlternator”让你开始工作。换句话说，你的老板通过说出你必须要做的名称让你开始工作。


    在这种情况下，使用“方法（method）”一词并不算牵强。你有一个处理发电机的方法。你的老板启动了这个方法，而你通过执行与该方法相关的指令列表中的所有事情来响应。


    如果你相信这一切（我希望你相信），那么你就准备好阅读关于 Java 方法的内容。在 Java 中，方法是一份待办事项列表。每个方法都有一个名字，你通过在程序中使用方法的名称告诉计算机执行列表中的事项。


    不要太仔细检查下面示例中的代码。程序中的所有代码都是虚构的！我编写了这些代码以便它们看起来像真实的 Java 代码，但它们并不是。更重要的是，上述示例中的代码并不是为了说明所有关于
    Java 的规则。所以，如果你手头有保留意见，请谨慎对待上述示例。


    示例：方法声明

    `void fixTheAlternator() { driveInto(car, bay); lift(hood); get(wrench); loosen(alternatorBelt);
    ... }`


    在我的 Java 代码的某处（示例 之外），我需要一条指令来调用我的 `fixTheAlternator` 方法。调用 `fixTheAlternator`
    方法的指令看起来可能像示例中的行。


    示例：方法调用

    `fixTheAlternator(junkyOldFord);`


    现在你已经对方法是什么以及它是如何工作的有了基本了解，你可以进一步深入研究一些实用的术语：


    - 如果我偷懒，我会把示例中的代码称为方法（method）。如果不偷懒，我会把这段代码称为方法声明（method declaration）。

    - 示例中的方法声明包含两个部分。第一行（包含 `fixTheAlternator` 的部分，但不包括左大括号）是方法头（method header）。示例的其余部分（被大括号包裹的部分）是方法体（method
    body）。


