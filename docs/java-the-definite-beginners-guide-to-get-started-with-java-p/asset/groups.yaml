    A Java program is like an outline, then why does a program never look like an
    outline? What is it that takes the place of the black ink and the capital letters?
    The answer that can be given here is twofold:


    +   - Curly braces used in Java always enclose units of meaningful code.

    - The programmer can use these to indent lines to help other programmers identify
    the outline of the code when they glance through it.


    In an outline, everything is subordinate to the item in Roman numeral I. In a
    Java program, everything is subordinate to the top line (the line with “class”
    in it). To indicate that everything else in the code is subordinate to this class
    line, you use curly braces. Everything else in the code goes inside these curly
    braces.


    Never lose sight of the fact that a Java program is, first and foremost, an outline.


    If you put curly braces in the wrong places where the braces should be, your program
    probably won’t work at all. If your program does work, though, it’ll probably
    work incorrectly.


    If you don’t indent lines of code in an informative manner, your program will
    still work correctly, but neither nor any other programmer will be able to figure
    out what you were thinking when you wrote the code.


    If you’re a visual thinker, you can picture outlines of Java programs in your
    head. One friend of mine visualizes an actual numbered outline morphing into a
    Java program!


