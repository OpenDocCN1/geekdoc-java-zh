    # Words in a Java program


    If you read any book about Java or ask any experienced programmer, you''ll hear
    that there are two types of words in Java: identifiers and keywords. All used
    in Java code can be segregated into either of these classes. However, for a beginner,
    these definitions may be slightly misleading. Let''s instead consider three classes:
    keywords, identifiers from the Java API, and identifiers created by the programmer
    (you).


    The differences between these three categories are very much like the differences
    between different categories of words in English. Consider the sentence, "He is
    a person." The word person can be classified as a keyword. No matter how many
    times the word "person" is used, the meaning of the word doesn''t change. This
    is basically the definition of keywords.


    Now look at the sentence, "Allison is a woman." The word "Allison" is the name
    of the person. Words in English such as Allison, Peter, Jessica and Ryan don''t
    have any meaning to them, i.e., there is no fixed definition or usage. These can
    be names for anybody—parents select a name for their kids (in most cases). These
    names can be compared to identifiers created by programmers in Java.


    Let''s take a look at one last sentence—“Lionel Messi is a man." When you say
    this sentence or hear someone saying it, you''ll immediately assume that the person
    being referred to is the world famous football player. Even though this is not
    a rule in the English language and there could be another person in the world
    named Lionel Messi, most people around the world will use it to refer to a single
    man. These types of names can be compared to identifiers created in the Java API.


    Let''s now look at the various categories of words in Java.'
