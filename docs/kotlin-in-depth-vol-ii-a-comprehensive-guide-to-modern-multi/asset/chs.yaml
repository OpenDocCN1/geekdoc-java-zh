  9\")\n            opButton(OpKind.ADD)\n        }\n        tableRow {\n        \
  \    charButton(\"4\")\n            charButton(\"5\")\n            charButton(\"\
  6\")\n            opButton(OpKind.SUBTRACT)\n        }\n        tableRow {\n   \
  \         charButton(\"1\")\n            charButton(\"2\")\n            charButton(\"\
  3\")\n            opButton(OpKind.MULTIPLY)\n        }\n        tableRow {\n   \
  \         charButton(\"0\")\n            charButton(\".\")\n            button(\"\
  +/-\").onClick {\n                val currentText = txtResult.text.toString()\n\
  \                txtResult.text = when {\n                    currentText.startsWith(\"\
  -\") ->\n                        currentText.substring(1, currentText.length)\n\
  \                    currentText != \"0\" -> \"-$currentText\"\n               \
  \     else -> return@setOnClickListener\n                }\n            }\n    \
  \        opButton(OpKind.DIVIDE)\n        }\n        tableRow {\n            button(\"\
  <-\").onClick {\n                val currentText = txtResult.text.toString()\n \
  \               val newText = currentText.substring(0, currentText.length - 1)\n\
  \                txtResult.text = if (newText.isEmpty() || newText == \"-\") \"\
  0\" else newText\n            }\n        }\n    }\n}\n```\n\n确保也添加了 Anko 特有的导入：\n\
  \n```\nimport org.jetbrains.anko.*\n```\n\n不很难看出 UI 结构基本上与布局并行的。我们还将引入两个辅助函数 `charButton()`\
  \ 和 `opButton()`，它们分别定义字符按钮和操作按钮。我们还可以布局提取到单独的文件并像外部脚本一样使用它。由于它仍然是 Kotlin 代码，可以安全地丢弃\
  \ `activity_main.xml`。\n\n关于框架特性的更多信息以及全面文档可以在 Anko 网站找到：https://github.com/Kotlin/anko\n\
  \n### 总结\n\n在本章中，你学习了如何使用 Android Studio IDE 的基本功能，并使用 Kotlin 语言创建了第一个 Android 应用。我们向你介绍了\
  \ Android activity 的概念，体验了布局描述，并演示了 Android Extensions 和 Anko 如何帮助你编写与 UI 相关的 Kotlin\
  \ 代码。\n\n在下一章中，我们将学习如何使用 Ktor 框架开发 Web 应用。我们将讨论基础 Ktor 特性、项目设置以及如何使用路由机制处理客户端请求。我们还将查看用于生成\
  \ HTML 内容的 DSL。\n\n### 问题\n\n1. 描述 Android Studio 中的项目设置。\n2. 描述使用 Gradle 进行 Android\
  \ Studio 中的项目配置。你如何添加新依赖？\n3. 如何配置用于运行应用程序的虚拟设备？\n4. 什么是 activity？如何描述 Android 应用的\
  \ UI？\n5. 解释 Kotlin Android Extensions 引入的合成属性。\n6. 当 activity 被临时销毁时如何保存/恢复其状态？\n\
  7. 什么是 Anko？描述该框架提供的 UI 布局 DSL。\n\n\n\n在本章中，我们将向你介绍这种 Kotlin 特有的框架之一，名为 `Ktor`。这是一个\
  \ Kotlin 框架，旨在简化连接系统的开发，这些系统可能包括各种客户端和服务器应用程序，如浏览器、移动客户端、Web 应用程序和服务。作为协程（Coroutines）库的扩展，`Ktor`\
  \ 为异步通信提供了强大且易用的设施。这些内容显然并不是对 `Ktor` 功能的详尽阐述，因此在本书范围内，我们将讨论限制在与 Web 应用相关的一组功能上，特别是服务器端：分发客户端请求、获取请求数据以及组合各种类型的响应。鼓励读者在其官方网站\
  \ [`ktor.io`](https://ktor.io) 以及其他资源继续熟悉 `Ktor`。\n\n### 结构\n\n* 设置 Ktor 项目\n* 服务端功能\n\
  * 客户端功能\n\n## 目标\n\n学习使用 `Ktor` 进行 Web 应用程序客户端和服务端开发的基础功能。\n\n### 介绍 Ktor\n\n`Ktor`\
  \ 是一个用于开发通过网络通信的客户端和服务器应用程序的框架。尽管它的主要应用之一是围绕 HTTP 协议进行数据交换的 Web 应用，但 `Ktor` 的最终目标是成为一个用于构建各种类型连接应用的通用多平台框架。它的设计者和主要开发者是\
  \ JetBrains，该公司也负责 Kotlin 语言本身的创建。与各种 J2EE 框架相比，`Ktor` 的关键特性如下：\n\n* 使用 Kotlin 驱动的领域特定语言（DSL），允许你通过与代码的其他部分轻松结合，对某些应用方面（如请求路由规则或\
  \ HTML 内容）使用简洁的声明式风格描述。\n* 开箱即用由 Kotlin 协程库提供的高效异步计算。\n\n在本节中，我们将快速浏览 `Ktor` 并引导你完成在\
  \ IntelliJ IDEA 中设置项目所需的步骤。可以使用特殊的 IntelliJ 插件来简化过程，该插件为项目向导添加 `Ktor` 支持。要安装该插件，请按照以下步骤操作：\n\
  \n1. 在 IDEA 菜单中选择 `File | Settings…` 命令，并点击左侧的 `Plugins` 部分。你将看到 `Plugin Manager`\
  \ 视图。\n2. 确保顶部选中了 `Marketplace` 选项，并在顶部的文本框中输入 `ktor`。你应该能在搜索结果中看到 Ktor 插件（如图 16.1\
  \ 所示）。\n3. 现在，点击 `Install` 按钮，IDE 将自动下载插件并进行安装。安装完成后，将提示你重启 IDE 以激活插件更改。确认并等待 IDE\
  \ 重启完成。\n\n![](img/Img_16_01.jpg)\n\n**图 16.1:** 为 IntelliJ IDEA 安装 Kotlin 插件\n\n\
  **IDE 提示：与大多数用于 Web/J2EE 开发的 IntelliJ 插件不同，`Ktor` 不需要 Ultimate 版本，可以在 IDEA Community\
  \ 版中使用。**\n\n现在，我们可以创建一个项目。选择 `File | New | Project…` 命令，并在 `New Project` 对话框中选择\
  \ `Ktor` 选项。除了基础的客户端服务器功能外，`Ktor` 提供了一系列可插的功能，这些功能依赖额外的构件和/或某些配置代码。向导的第一步（如图 16.2\
  \ 所示）允许你为应用程序的客户端和服务端选择必要的功能。IDE 将自动添加所有必要的依赖项，并生成一个演示功能使用的示例代码：\n\n![](img/Img_16_02.jpg)\n\
  \n**图 16.2:** Ktor 项目向导\n\n对于我们的示例，将在 `Server` 列中选择 HTML DSL 选项，这使我们拥有了使用简单的 Kotlin\
  \ DSL 生成 HTML 标记的能力。由于我们在这里不需要任何 HTTP 客户端功能（基本上我们不会向其他服务器发送请求），我们留空 `Client` 列。\n\
  \n除了特定功能外，`Ktor` 还允许你选择项目构建系统（如 Gradle 或 Maven）、HTTP 服务器引擎类型（Netty/Jetty/Tomcat/基于协程的）以及框架版本。我们的项目将基于\
  \ Gradle 并使用带有 Netty 引擎的 `Ktor` 1.2.3。确保所有选项设置正确后，点击 `Next`。\n\n在下一步中，IDE 将要求你填写构建项目构件所需的\
  \ Basic 信息（组/构件 ID 和版本）。你可以保持这些值不变并点击 `Next`。\n\n最后一个向导步骤将要求你选择项目名称和位置。点击 `Finish`\
  \ 之后，IDE 将继续生成项目源码并在完成后打开新项目。\n\n在最后一步，你将看到 `Import Module from Gradle` 对话框，你可以在其中设置\
  \ Gradle/IntelliJ 互操作性的基本选项。现在，让我们选择 `Use default gradle wrapper` 选项并保持其他设置不变。点击\
  \ `OK` 之后，IDE 将开始与 Gradle 项目模型同步。一旦完成，你将能够在 `Project View` 中看到以下文件（图 16.3）：\n\n\
  ![](img/Img_16_03.jpg)\n\n**图 16.3:** 示例 Ktor 的结构\n\n注意资源文件夹下的 `application.conf`\
  \ 文件。该文件包含了以 HOCON 格式定义的服务器配置。在我们的情况下，它指定了服务器端口号和模块列表：\n\n```hocon\nktor {\n  deployment\
  \ {\n    port = 8080\n    port = ${?PORT}\n  }\n  application {\n    modules = [\
  \ com.example.ApplicationKt ]\n  }\n}\n```\n\n关于 HOCON 和支持的配置选项的详细信息可以在 Ktor 网站上找到：[https://ktor.io/configuration.html]。\n\
  \nKtor 模块基本上是 `Application` 类的一个扩展函数，负责配置功能、处理客户端请求以及其他服务器任务。要加载的模块必须在服务器配置中通过它们的限定名称指定。我们的示例项目在\
  \ `Application.kt` 中实现了一个模块：\n\n```kotlin\npackage com.example\n\nimport io.ktor.application.*\n\
  import io.ktor.client.HttpClient\nimport io.ktor.client.engine.apache.Apache\nimport\
  \ io.ktor.html.respondHtml\nimport io.ktor.http.ContentType\nimport io.ktor.response.respondText\n\
  import io.ktor.routing.*\nimport kotlinx.html.*\n\nfun main(args: Array<String>):\
  \ Unit = io.ktor.server.netty.EngineMain.main(args)\n\n@Suppress(\"unused\") //\
  \ 在 application.conf \n@kotlin.jvm.JvmOverloads\nfun Application.module(testing:\
  \ Boolean = false) {\n    routing {\n        get(\"/\") {\n            call.respondText(\n\
  \                \"HELLO WORLD!\",\n                contentType = ContentType.Text.Plain\n\
  \            )\n        }\n        get(\"/html-dsl\") {\n            call.respondHtml\
  \ {\n                body {\n                    h1 { + \"HTML\" }\n           \
  \         ul {\n                        for (n in 1..10) {\n                   \
  \         li { +\"$n\" }\n                        }\n                    }\n   \
  \             }\n            }\n        }\n    }\n}\n```\n\n同样定义在该文件中 `main()` 函数简单地启动所选的\
  \ HTTP 服务器引擎（在我们的示例中是 Netty），然后它读取 `application.conf` 并加载由 `Application.module()`\
  \ 函数表示的服务器模块。\n\n模块体包含 `routing` 块，用于根据 URL 路径设置处理客户端请求的规则。特别是当客户端应用程序（例如 Web 浏览器）访问我们服务器的根路径时，Ktor\
  \ 会调用以下处理器：\n\n```kotlin\ncall.respondText(\n    \"HELLO WORLD!\",\n)\n```\n\n\n\
  \n\n```\ncontentType = ContentType.Text.Plain\n```\n\n此代码生成一个带有纯文本消息正体的 HTTP 响应。如果你编译并启动服务器应用程序，然后在某些浏览器中打开\
  \ `localhost:8080`，你将看到类似于图 16.4 的内容：\n\n![](img/Img_16_04.jpg)\n\n**图 16.4：** 在浏览器中访问\
  \ Hello, World 程序的根路径\n\n同样，`/html-dsl` 路径显示了使用 HTML DSL 库生成服务器响应的示例。该 DSL 允许你以对应不同\
  \ HTML 标签的嵌套块的形式呈现 HTML 标记。正如你可能猜到的那样，以下处理器：\n\n```kotlin\ncall.respondHtml {\n\
  \  body {\n    h1 { +”HTML” }\n    ul {\n      for (n in 1..10) {\n        li {\
  \ +”$n” }\n      }\n    }\n  }\n}\n```\n\n会生成一个包含一级 级标题和数字项目列表的 HTML 页面。图 16.5 显示了将\
  \ DSL 代码渲染为 HTML 页面的结果：\n\n![](img/Img_16_05.jpg)\n\n**图 16.5：** 与 /html-dsl 路径相关的\
  \ HTML 响应\n\n在接下来的章节中，我们将详细查看 HTML DSL 和路由规则，以及 Ktor 的其他服务器功能。\n\nIDE 生成的项目还包含一个示例服务器测试。让我们打开\
  \ `ApplicationTest` 类：\n\n```kotlin\npackage com.example\nimport io.ktor.http.*\n\
  import io.ktor.server.testing.*\nimport kotlin.test.*\n\nclass ApplicationTest {\n\
  \  @Test\n  fun testRoot() {\n    withTestApplication({ module(testing = true) })\
  \ {\n      handleRequest(HttpMethod.Get, “/”).apply {\n        assertEquals(HttpStatusCode.OK,\
  \ response.status())\n        assertEquals(“HELLO WORLD!\", response.content)\n\
  \      }\n    }\n  }\n}\n```\n\n此代码配置了测试应用程序以一组给定的模块运行（注意使用 `testing = true` 参数，它允许模块代码区分测试和生产环境），然后检查处理根路径的简单\
  \ HTTP 请求的结果。你可以将此类作为起点，编写涵盖各种服务器行为的自定义测试。\n\n作为 IntelliJ 插件的替代方案，你可以使用 [`start.ktor.io`](https://start.ktor.io)\
  \ 在线项目生成器。生成器 UI 允许你指定相同的基础选项，包括你想在应用程序中使用一组客户端/服务器功能。点击 `Build` 按钮后，后端将建议你下载一个包含生成项目的压缩文件。图\
  \ 16.6 显示了一个示例：\n\n![](img/Img_16_06.jpg)\n\n**图 16.6：** start.ktor.io 中的 Ktor 项目向导\n\
  \n到此，我们对基础项目设置的介绍结束。在接下来的章节中，我们将关注 Ktor 框架客户端和服务端提供的特定功能。\n\n### 服务器功能\n\n在本节中，我们将考虑有关\
  \ Web 服务器应用程序开发的几个主题。Ktor 的大部分功能组织成一组可插拔的功能，可以通过调用 `install()` 方法进行配置，该方法接收一个功能对象和一个可选的配置块。例如，要启用输出内容的压缩，你可以在模块函数中添加以下代码：\n\
  \n```kotlin\ninstall(Compression)\n```\n\n如果你想指定额外的（特定于功能的）选项，例如选择压缩方法，你可以在配置块中进行：\n\
  \n```kotlin\ninstall(Compression) {\n  gzip()\n}\n```\n\n本章中的示例使用了嵌入式 HTTP 服务器，允许它们作为独立程序运行。在许多情况下，你可能需要在某些\
  \ Web/应用程序容器（如 Apache Tomcat、Docker 或 Google App Engine）中部署 Ktor 应用程序。要安装你的应用程序，你需要汇总包含应用程序类及其所有依赖项的包，并准备特定容器的配置文件。关于容器特定细节的讨论超本书的范围，但你可以在\
  \ Ktor 官方网站 [`ktor.io/servers/deploy.html`](https://ktor.io/servers/deploy.html)\
  \ 上详细说明。\n\n### 路由\n\n路由功能允许你根据模式匹配器的分级系统对 HTTP 请求进行结构化处理。路由配置通过功能安装块内部的特殊 DSL（领域特定语言）表示：\n\
  \n```kotlin\nfun Application.module() {\n  install(Routing) {\n    // 常例描述\n   \
  \ get(“/”) { call.respondText(“This is root page”) }\n  }\n}\n```\n\n或者使用 `routing()`\
  \ 块，作为相应 `install()` 调用的简写：\n\n```kotlin\nfun Application.module() {\n  routing\
  \ {\n    get(“/”) { call.respondText(“This is root page”) }\n  }\n}\n```\n\n最简单的路由场景由\
  \ `get()` 函数提供，它告诉服务器对具有给定 URL 路径前缀的任何 HTTP `GET` 请求执行指定的处理程序。例如，前面的代码对站点根的 `GET`\
  \ 请求响应纯文本字符串，而对同一站点上任何其他路径或使用任何其他 HTTP 动词的请求将导致 404（参见图 16.7 中的示例）：\n\n![](img/Img_16_07.jpg)\n\
  \n**图 16.7：** get() 路由的结果\n\nKtor 支持所有 动词的类似路由，包括 `post()`、`put()`、`delete()`、`patch()`、`head()`\
  \ 和 `options()`。路由函数中提到的参数可能会匹配路径的特定段，并可以从应用程序检索。要引入参数，你只需将其名称括在括号中。例如，下面的路由将匹配以\
  \ `/hello/` 开头并包含两个段的 URL：\n\n```kotlin\nrouting {\n  get(\"/hello/{userName}”)\
  \ {\n    call.respondHtml {\n      body {\n        h1 { +”Hello, ${call.parameters[userName]}”\
  \ }\n      }\n    }\n  }\n}\n```\n\n参数本身匹配一个段，因此像 `/hello` 或 `/hello/Doe` 的路径将无法匹配（如图\
  \ 16.8 所示）：\n\n![](img/Img_16_08.jpg)\n\n**图 16.8：** 单段路径匹配\n\n如果不需要参数值，可以用 `*`\
  \ 字符（通配符）替换它：\n\n```kotlin\nrouting {\n  get(\"/hello/*”) {\n    call.respondHtml\
  \ {\n      body {\n        h1 { +”Hello, World” }\n      }\n    }\n  }\n}\n```\n\
  \n上面的路由接受之前相同的路径集，但不捕获任何参数。如果你想引入一个匹配空路径段的可选参数，只需在其名称后添加 `?`。以下路由将接受 `/hello/John`，如图\
  \ 16.9 所示：\n\n```kotlin\nrouting {\n  get(\"/hello/{userName?}”) {\n    val userName\
  \ = call.parameters[\"userName\"] ?: “Unknown”\n    call.respondHtml {\n      body\
  \ {\n        h1 { +”Hello, $userName” }\n      }\n    }\n  }\n}\n```\n\n![](img/Img_16_09.jpg)\n\
  \n**图 16.9：** 可选匹配\n\n放置在参数名称后的尾 `…` 将匹配路径末尾的所有 URL 段。在这种情况下，你可以利用 `Parameters`\
  \ 类的 `getAll()` 方法获取拆分为 `List` 的所有捕获段。例如，创建一个简单的服务，对整数执行基本算术运算，并接收如 `/calc+/123/456`\
  \ 等 URL 路径格式的输入数据：\n\n```kotlin\nrouting {\n  get(\"/calc/{data…}”) {\n    val data\
  \ = call.parameters.getAll(“data”) ?: emptyList()\n    call.respondHtml {\n    \
  \  body {\n        h1 {\n          if (data.size != 3) {\n            +”Invalid\
  \ data”\n            return@h1\n          }\n          val (op, argStr1, argStr2)\
  \ = data\n          val arg1 = argStr1.toBigIntegerOrNull()\n          val arg2\
  \ = argStr2.toBigIntegerOrNull()\n          if (arg1 == null || arg2 == null) {\n\
  \            +”Integer numbers expected”\n            return@h1\n          }\n \
  \         val result = when (op) {\n            “+” -> arg1 + arg2\n           \
  \ “-” -> arg1 - arg2\n            “*” -> arg1 * arg2\n            “/” -> arg1 /\
  \ arg2\n            else -> null\n          }\n          +(result?.toString() ?:\
  \ “Invalid operation”)\n        }\n      }\n    }\n  }\n}\n```\n\n\n\n\n你可以在图 16.10\
  \ 中看到它的某些响应。左上图像显示了针对 `/calc/+/12345/67890` 路径成功的响应示例，它符合包含操作符和整数对的预期格式。右上图像对应于传递了三个数字而非两个的\
  \ `Invalid data` 情况，而左下图像报告了未知操作的错误。最后，右下图像描述了为操作数传递了非整数值的情况：\n\n![](img/Img_16_10.jpg)\n\
  \n**图 16.10:** 尾部配符匹配（Tailcard matching）\n\n注意的是，尾部配符也会匹配空路径尾，因此 `get(\"/calc/{data…}”)`\
  \ 前面的处理器也会为 `/calc` 路径调用。特殊的 `{…}` 尾部配符接受所有剩余的路径尾，但不像 `*` 通配符那样捕获任何参数。例如，像 `get(\"\
  /calc/{…}”)` 这样的处理器将匹配所有以 `/calc` 开头的路径，包括 `/calc` 本身。\n\n除了匹配整个 URL 路径的 `get()`\
  \ 等函数外，Ktor 还允许你定义路由树来匹配 URL 的后续部分和/或各种请求数据。考虑以下示例：\n\n```kotlin\nrouting {\n  method(HttpMethod.Get)\
  \ {\n    route(“user/{name}”) {\n      route(“sayHello”) {\n        handle {\n \
  \         call.respondText(“Hello, ${call.parameters[“name”]}”)\n        }\n   \
  \   }\n      route(“sayBye”) {\n        handle {\n          call.respondText(“Bye,\
  \ ${call.parameters[“name”]}”)\n        }\n      }\n    }\n  }\n}\n```\n\n当服务器接收到\
  \ HTTP 请求时，它从树根开始寻找匹配的路由规则。在我们案例中，根节点是 `method(HttpMethod.Get)`，它匹配任何带有 `GET` 动词请求。如果客户端请求满足此条件，服务器将向下检查\
  \ `route(“user/{name}”)` 规则，该规则接受给定路径前缀的 URL。如果路径匹配，服务器将进一步深入并检查 `route(“sayHello”)`\
  \ 和 `route(“sayBye”)` 规则之一，它们检查 URL 路径的剩余部分。在最底层，我们有 `handle()` 块，只要相应分支上的所有规则都匹配，它就会生成响应。\n\
  \n可以在 `route()` 调用中指定 HTTP 动词，而无需显式使用 `method()` 函数。之前的 `get()` 函数基本上是带有处理器的顶层 `route()`\
  \ 块的简写。例如，以下代码：\n\n```kotlin\nrouting {\n  get(“/hello/{userName}”) {\n    call.respondText(“Hello,\
  \ ${call.parameters[“userName”]}”)\n  }\n}\n```\n\n等同于：\n\n```kotlin\nrouting {\n\
  \  route(“/hello/{userName}”, HttpMethod.Get) {\n    handle {\n      call.respondText(“Hello,\
  \ ${call.parameters[“userName”]}”)\n    }\n  }\n}\n```\n\n`route()` 和 `method()`\
  \ 并不是你可以使用的唯一匹配器。还有额外的构建器可用：\n\n*   `header(name, value):` 接受带有特定标头的请求\n*   `param(name,\
  \ value):` 接受带有特定参数值的请求\n*   `param(name):` 接受具有特定名称参数的请求并捕获其值\n*   `optionalParam(name):`\
  \ 接受给定名称可选参数\n\n在下面的示例中，我们根据 action 参数的值选择响应：\n\n```kotlin\nrouting {\n  route(“/user/{name}”,\
  \ HttpMethod.Get) {\n    param(“action”, “sayHello”) {\n      handle {\n       \
  \ call.respondHtml {\n          body { h2 { +”Hello, ${call.parameters[“name”]}”\
  \ } }\n        }\n      }\n    }\n    param(“action”, “sayBye”) {\n      handle\
  \ {\n        call.respondHtml {\n          body { h2 { +”Bye, ${call.parameters[“name”]}”\
  \ } }\n        }\n      }\n    }\n  }\n}\n```\n\n例如，路径 `/user/John?action=sayHello`\
  \ 将产生服务器响应 `Hello, John`，而 `/user/John?action=sayBye` 将给出 `Bye, John`。任何其他 action\
  \ 将保持未匹配状态，从而产生 `not found` 响应。图 16.11 展示了结果：\n\n![](img/Img_16_11.jpg)\n\n**图 16.11:**\
  \ 按请求参数匹配\n\nKtor API 允许你创建自己的匹配器，从而扩展路由 DSL。要做到这一点，你需要提供 `RouteSelector` 类的实现并添加相应的构建器函数。\n\
