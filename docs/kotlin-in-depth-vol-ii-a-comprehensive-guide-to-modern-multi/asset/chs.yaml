  **图 15.9：计算器 UI 预览**\n\n讨论布局格式不在本书的范围内，因此我们在这里不涉及细节，只需介绍基础知识。布局基本上是排列嵌套视图的容器（你可以将其与带有特定\
  \ `LayoutManager` 的 Swing 容器相比）。由于计算器 UI 假设元素是规则的，我们将使用将嵌套组件分配到行和列的表格布局。组件本身由诸标签\
  \ `Button`（带有文本的简单按钮）和 `TextView`（类似于 Swing 的只读文本组件）。\n\n注意 `android:id` 属性。它们被分配给每个展示或接收用户数据的视图元素。此属性允许你在\
  \ Java 或 Kotlin 代码中引用相应的元素。我们将在下一节讨论 Activity 类时介绍如何实现。\n\n### 实现 Activity 类\n\n\
  让我们来实现 Activity 类，为 UI 添加一些行为。我们不会深入计算器的业务逻辑细节（让读者自己去探索），而是强调一些 Android 特有的要点。\n\
  \n除此之外，我们想要访问输入计算器显示中的当前值：`txtResult` 组件。为了实现这一点，我们使用 `findViewById()` 函数传递文本视图\
  \ ID。我们不需要在布局 XML 中放置实际字符串，因为可以使用我们在“Hello World”示例中见过的 `R` 类来引用这些 ID：\n\n```kotlin\n\
  private val txtResult by lazy { findViewById<TextView>(R.id.txtResult) }\n```\n\n\
  使用视图引用后，我们可以访问它的成员；例如，`setOnClickListener()` 方法允许我们指定用户点击按钮时触发的操作：\n\n```kotlin\n\
  findViewById<Button>(R.id.btn0).setOnClickListener { appendText(\"0\") }\n```\n\n\
  在读取/写入时，`TextView` 组件的 `text` 属性提供了内容的访问：\n\n以下是计算器 `MainActivity` 类的完整源代码：\n\n\
  ```kotlin\npackage com.example.helloworld\n\nimport androidx.appcompat.app.AppCompatActivity\n\
  import android.os.Bundle\nimport android.widget.Button\nimport android.widget.TextView\n\
  import java.math.BigDecimal\nimport java.math.RoundingMode\n\nclass MainActivity\
  \ : AppCompatActivity() {\n\n    enum class OpKind {\n        ADD, SUBTRACT, MULTIPLY,\
  \ DIVIDE\n    }\n\n    companion object {\n        fun compute(a: BigDecimal, b:\
  \ BigDecimal): BigDecimal = when (this) {\n            OpKind.ADD -> a + b\n   \
  \         OpKind.SUBTRACT -> a - b\n            OpKind.MULTIPLY -> a * b\n     \
  \       OpKind.DIVIDE -> a.divide(b, RoundingMode.HALF_EVEN)\n        }\n    }\n\
  \n    private val txtResult by lazy { findViewById<TextView>(R.id.txtResult) }\n\
  \    private var lastResult: BigDecimal = BigDecimal.ZERO\n    private var lastOp:\
  \ OpKind? = null\n    private var waitingOperand: Boolean = false\n\n    override\
  \ fun onCreate(savedInstanceState: Bundle?) {\n        super.onCreate(savedInstanceState)\n\
  \        setContentView(R.layout.activity_main)\n\n        findViewById<Button>(R.id.btn0).setOnClickListener\
  \ { appendText(\"0\") }\n        findViewById<Button>(R.id.btn1).setOnClickListener\
  \ { appendText(\"1\") }\n        findViewById<Button>(R.id.btn2).setOnClickListener\
  \ { appendText(\"2\") }\n        findViewById<Button>(R.id.btn3).setOnClickListener\
  \ { appendText(\"3\") }\n        findViewById<Button>(R.id.btn4).setOnClickListener\
  \ { appendText(\"4\") }\n        findViewById<Button>(R.id.btn5).setOnClickListener\
  \ { appendText(\"5\") }\n        findViewById<Button>(R.id.btn6).setOnClickListener\
  \ { appendText(\"6\") }\n        findViewById<Button>(R.id.btn7).setOnClickListener\
  \ { appendText(\"7\") }\n        findViewById<Button>(R.id.btn8).setOnClickListener\
  \ { appendText(\"8\") }\n        findViewById<Button>(R.id.btn9).setOnClickListener\
  \ { appendText(\"9\") }\n        findViewById<Button>(R.id.btnPoint).setOnClickListener\
  \ { appendText(\".\") }\n        findViewById<Button>(R.id.btnSign).setOnClickListener\
  \ {\n            val currentText = txtResult.toString()\n            txtResult.text\
  \ = when {\n                currentText.startsWith(\"-\") -> currentText.substring(1)\n\
  \                currentText != \"0\" -> \"-$currentText\"\n                else\
  \ -> return@setOnClickListener\n            }\n        }\n        findViewById<Button>(R.id.btnBackspace).setOnClickListener\
  \ {\n            val currentText = txtResult.toString()\n            val newText\
  \ = currentText.substring(0, currentText.length - 1)\n            txtResult.text\
  \ = if (newText.isEmpty() || newText == \"-\") \"0\" else newText\n        }\n \
  \       findViewById<Button>(R.id.btnClear).setOnClickListener { clearText() }\n\
  \        findViewById<Button>(R.id.btnPlus).setOnClickListener { calc(OpKind.ADD)\
  \ }\n        findViewById<Button>(R.id.btnMinus).setOnClickListener { calc(OpKind.SUBTRACT)\
  \ }\n        findViewById<Button>(R.id.btnTimes).setOnClickListener { calc(OpKind.MULTIPLY)\
  \ }\n        findViewById<Button>(R.id.btnDivide).setOnClickListener { calc(OpKind.DIVIDE)\
  \ }\n        findViewById<Button>(R.id.btnCalc).setOnClickListener {\n         \
  \   calc(null)\n            clearText()\n        }\n    }\n\n    private fun clearText()\
  \ {\n        txtResult.text = \"0\"\n    }\n\n    private fun appendText(text: String)\
  \ {\n        if (waitingOperand) {\n            clearText()\n            waitingOperand\
  \ = false\n        }\n        val currentText = txtResult.text.toString()\n    \
  \    txtResult.text = if (currentText == \"0\") text else currentText + text\n \
  \   }\n\n    private fun calc(nextOp: OpKind?) {\n        // 计算逻辑实现\n    }\n}\n\
  ```\n\n\n\n\n\n```kotlin\nif (waitingNextOperand) {\n    lastOp = nextOp\n    return\n\
  }\nval currentValue = BigDecimal(txtResult.text.toString())\nval newValue = try\
  \ {\n    lastOp?.compute(lastResult, currentValue) ?: currentValue\n} catch (e:\
  \ ArithmeticException) {\n    lastOp = null\n    waitingNextOperand = true\n   \
  \ Toast.makeText(\n        applicationContext,\n        \"Invalid operation!\",\n\
  \        Toast.LENGTH_SHORT\n    ).show()\n    return\n}\nif (nextOp != null) {\n\
  \    lastResult = newValue\n}\nif (lastOp != null) {\n    txtResult.text = newValue.toPlainString()\n\
  }\nlastOp = nextOp\nwaitingNextOperand = nextOp != null\n}\n```\n\n现在，我们可以尝试运行计算器并查看它的运行效果。图\
  \ 15.10 显示了在 Android 模拟器中使用我们的程序的示例：\n\n![](img/Img_15_10.jpg)\n\n**图 15.10：** 运行中的计算器应用程序\n\
  \n# Kotlin Android Extensions (#toc.xhtml_s105a)\n\n频繁使用 `findViewById()` 会让代码变得杂乱，特别是如果你像我们对\
  \ `txtResult` 那样在类属性中保留视图组件的引用时。在 Java 世界中，某些库如 `Butterknife` 或 Android Data Binding\
  \ 可以通过将视图引用自动注入给定的类字段来解决这个问题，但这需要你手动对感兴趣的字段进行注解并指定相应的 ID。虽然这些库也可以在 Kotlin 中使用，但有一个更简洁的解决方案，它依赖于\
  \ Android Extensions 编译器插件。在前面的节中，我们提到过该插件在 Android Studio 生成的项目中会自动激活。现在，我们终于可以将其投入实际使用了。\n\
  \nKotlin Android Extensions 的核心特性是一组与视图组件对应的合成属性（synthetic properties）。也就是说，它们允许你使用标识符引用视图，就像它们是某些顶层属性的名字一样。你只需要添加如下形式的导入指令：\n\
  \n`import kotlinx.android.synthetic.main.activity_main.*`\n\n其中 `activity_main`\
  \ 是活动 XML 文件的文件名。此类合成包包含了一组 `Activity` 扩展属性，每个属性对应活动 XML 中的某个组件。例如，我们可以简化以下行：\n\n\
  ```kotlin\nfindViewById<Button>(R.id.btn0).setOnClickListener { appendText(\"0\"\
  ) }\n```\n\n为：\n\n```kotlin\nbtn0.setOnClickListener { appendText(\"0\") }\n```\n\
  \n结果，我们计算器活动的 `onCreate()` 方法转变为如下：\n\n```kotlin\noverride fun onCreate(savedInstanceState:\
  \ Bundle?) {\n    super.onCreate(savedInstanceState)\n    setContentView(R.layout.activity_main)\n\
  \    btn0.setOnClickListener { appendText(\"0\") }\n    btn1.setOnClickListener\
  \ { appendText(\"1\") }\n    btn2.setOnClickListener { appendText(\"2\") }\n   \
  \ btn3.setOnClickListener { appendText(\"3\") }\n    btn4.setOnClickListener { appendText(\"\
  4\") }\n    btn5.setOnClickListener { appendText(\"5\") }\n    btn6.setOnClickListener\
  \ { appendText(\"6\") }\n    btn7.setOnClickListener { appendText(\"7\") }\n   \
  \ btn8.setOnClickListener { appendText(\"8\") }\n    btn9.setOnClickListener { appendText(\"\
  9\") }\n    btnPoint.setOnClickListener{ appendText(\".\") }\n    btnSign.setOnClickListener{\
  \ … }\n    btnBackspace.setOnClickListener{ … }\n    btnClear.setOnClickListener{\
  \ clearText() }\n    btnPlus.setOnClickListener{ calc(OpKind.ADD) }\n    btnMinus.setOnClickListener{\
  \ calc(OpKind.SUBTRACT) }\n    btnTimes.setOnClickListener{ calc(OpKind.MULTIPLY)\
  \ }\n    btnDivide.setOnClickListener{ calc(OpKind.DIVIDE) }\n    btnCalc.setOnClickListener{\
  \ calc(null) }\n    clearText()\n}\n```\n\n显式的 `txtResult` 属性可以完全删除：\n\n```kotlin\n\
  private val txtResult by lazy { findViewById<TextView>(R.id.txtResult) }\n```\n\n\
  **IDE 提示：得益于 IntelliJ IDEA 和 Android Studio 提供的自动导入功能，你不需要手动添加此类导入。如果你尝试通过 ID 引用视图组件且尚未导入必要的合成属性，IDE\
  \ 将建议为你完成该操作（例如图 15.11）：**\n\n![](img/Img_15_11.jpg)\n\n**图 15.11：** 合成属性的自动导入\n\
  \n此外，Android Extensions 还提供了许多实用功能，例如通过合成属性调整可用视图的缓存策略，以及通过实现 `LayoutContainer`\
  \ 接口使用类似的注入机制增强任何容器的能力。我们在这里不会详细讨论这些功能，但你可以在 [`kotlinlang.org`](http://kotlinlang.org)\
  \ 上的 Android Extensions 教程中找到详细信息。**\n\n# 保留活动状态 (#toc.xhtml_s106a)\n\n如果你对我们在之前的几个节中创建的计算器进行一些实验，你可能会发现它的行为中有一个明显的缺陷。让我们输入一些数字，然后模拟设备旋转。结果如图\
  \ 15.12 所示：\n\n![](img/Img_15_12.jpg)\n\n**图 15.12：** 设备旋转时活动重置\n\n你可以看到原始数字变为了零。事实上，我们的活动的状态被重置了。产生这种行为的原因是配置更改（如旋转屏幕）强制系统销毁并从头创建我们的活动。但如果需要在同一个活动的不同实例之间保留某些状态呢？Android\
  \ 提供了名为 `bundle` 的解决方案。为了实现这一点，第一步是重写 `onSaveInstanceState()` 方法，并将相关值写入 `Bundle`\
  \ 对象：\n\n```kotlin\noverride fun onSaveInstanceState(outState: Bundle) {\n    super.onSaveInstanceState(outState)\n\
  \    outState.putString(\"currentText\", txtResult.text.toString())\n    outState.putSerializable(::lastResult.name,\
  \ lastResult)\n    outState.putSerializable(::lastOp.name, lastOp)\n    outState.putBoolean(::waitingNextOperand.name,\
  \ waitingNextOperand)\n}\n```\n\n现在，即使活动由于配置更改或释放设备资源而被临时销毁并在稍后的时间重建，系统也会保留 bundle\
  \ 并将其传递给 `onCreate()` 方法进行初始化。第二步是在我们的 `onCreate()` 实现中添加从 bundle 读取数据的的代码：\n\n\
  ```kotlin\noverride fun onCreate(savedInstanceState: Bundle?) {\n    …\n    clearText()\n\
  \    savedInstanceState?.let {\n        txtResult.text = it.getString(\"currentText\"\
  )\n        lastResult = it.getSerializable(::lastResult.name) as BigDecimal\n  \
  \      lastOp = it.getSerializable(::lastOp.name) as OpKind?\n        waitingNextOperand\
  \ = it.getBoolean(::waitingNextOperand.name)\n    }\n}\n```\n\n传递给 `onCreate()`\
  \ 的参数可能为 null。这发生在 bundle 缺失时，例如当首次启动活动时。\n\n\n\n\n注意，`bundle` 中只能存储可序列化的值。如果你需要保留某些不可序列化的对象，你需要实现\
  \ `Serializable` 接口，或者避免直接将其写入 `bundle` 并采用替代方法，例如将其转换为某些可序列化的数据持有者或通过部分保留原始对象。\n\
  \n另外一点值得注意的是，`bundles` 适用于保存较量的瞬态数据，因为它们的序列化会占用主线程并消耗系统进程的内存。对于其他情况，建议使用本地存储，如用户偏好或\
  \ SQLite 数据库。\n\n`onCreate()` 和 `onSaveInstanceState()` 方法是所谓的生命周期回调的特殊情况，这些回调由\
  \ Android 系统在 activity 从生命视图转换到新状态时调用。例如，`Resumed` 状态与在前台运行的 activity 关联，`Paused`\
  \ 对应移动到后台但对用户仍然可见的 activity，而 `Stopped` 状态意味着 activity 变得完全不可见。\n\n重写的生命周期回调版本必须调用继承的实现，因为它们包含了活动正常运行所需的通用代码。\n\
  \nIDE 提示：Android Studio 包含一项检查功能，如果你重写了生命周期回调但调用继承的方法，它将报告错误（如图 15.13 所示）：\n\n![](img/Img_15_13.jpg)\n\
  \n图 15.13：缺少 super 用的错误\n\n### Anko 布局\n\nAnko 是一个 Kotlin 框架，提供了各种增强功能来简化 Android\
  \ 应用开发。它的主要特性包括：\n\n*   一组用于对话框、意图（用于启动新 activity 的对象）、日志和应用程序资源的工具类——组合成 Anko Commons\
  \ 库。\n*   一种用于描述 UI 布局的领域语言（Anko Layouts）。\n*   简化访问 SQLite 数据库的 API，SQLite 经常用于\
  \ Android 的本地存储（Anko SQLite）。\n\n在本节中，我们将简单介绍一下布局 DSL，你可以用它视图组件的描述来替代 XML 文件。\n\n\
  在项目中使用 Anko 特性之前，我们必须在模块 Gradle 脚本中配置相应的依赖。让我们在 `dependencies` 块中添加以下行：\n\n```\n\
  implementation \"org.jetbrains.anko:anko:0.10.8\"\n```\n\n当你修改其中一个 Gradle 构建文件时，IDE\
  \ 会检测到这些更改并在文件编辑器顶部显示警告（如图 15.14 所示）：\n\n![](img/Img_15_14.jpg)\n\n图 15.14：Android\
  \ Studio 建议同步 Gradle\n\n点击 `Sync Now` 链接后，Android Studio 将将其内部项目模型与新的 Gradle 提供的配置进行同步，使\
  \ Anko 库适用于自动补全和代码导航等各种代码洞察功能。\n\n现在，我们可以使用 Anko DSL 重新改写我们的计算器布局。额外的代码将替换 `onCreate()`\
