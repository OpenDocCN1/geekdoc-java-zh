  \nHTTP 服务器的主要工作是为客户端请求提供适当的响应。为了简化这项任务，Ktor 为你提供了一个灵活且易用的 API，允许你轻松访问请求数据，例如 URL\
  \ 路径组件、参数、标头（通用和自定义）以及请求体的各种内容类型，并生成响应数据。你只需要实现实际的处理逻辑。\n\nHTTP 服务器的主要工作是为客户端请求提供适当的响应。为了简化这项任务，Ktor\
  \ 为你提供了一个灵活且易用的 API，允许你轻松访问请求数据，例如 URL 路径组件、参数、标头（通用和自定义）以及请求体的各种内容类型。\n\n要访问请求参数，你可以使用\
  \ `request.queryParameters` 对象，它充当从参数名称到值的映射。假设我们想根据形如 `/sum?left=2&right=3` 的 URL\
  \ 返回一对整数的和。在这种情况下，我们可以简单地对 `queryParameters` 对象使用索引运算符来获取 left 和 right 参数的值：\n\n\
  ```kotlin\nrouting {\n  // e.g. /sum?left=2&right=3 responds with 5\n  get(\"/sum\"\
  ) {\n    val left = call.request.queryParameters[“left\"]]?.toIntOrNull()\n    val\
  \ right = call.request.queryParameters[“right\"]]?.toIntOrNull()\n    if (left !=\
  \ null && right != null) {\n      call.respondText(\"${left + right}\")\n    } else\
  \ {\n      call.respondText(\"Invalid arguments\")\n    }\n  }\n}\n```\n\n当一个参数被使用多次时，`get()`\
  \ 函数只返回其第一个值。相反，`getAll()` 函数返回一个格式为 `List<String>` 的完整参数值列表：\n\n```kotlin\nrouting\
  \ {\n  // e.g. /sum?arg=1&arg=2&arg=3 responds with 6\n  get(\"/sum\") {\n```\n\n\
  \n\n\n```kotlin\nval args = call.request.queryParameters.getAll(“arg”)\n\nif (args\
  \ == null) {\n    call.respondText(“No data”)\n    return@get\n}\nvar sum = 0\n\
  for (arg in args) {\n    val num = arg.toIntOrNull()\n    if (num == null) {\n \
  \       call.respondText(“Invalid arguments”)\n        return@get\n    }\n    sum\
  \ += num\n}\ncall.respondText(“$sum”)\n}\n```\n\n同样地，你可以使用 `request.headers.get()`\
  \ 和 `reqiest.headers.getAll()` 来获取请求头数据的值。\n\n### HTML DSL\n\nHTML DSL 库配合 Ktor\
  \ HTML 构建器，允许你根据 HTML 内容生成响应。这为 JSP 等技术提供了一种替代方案，JSP 会将可执行代码嵌入到 UI 标记中。通过 HTML DSL，你既拥有了简洁的语法，又拥有\
  \ Kotlin 代码的所有优处，包括类型安全和强大的 IDE 代码洞察。在本节中，我们不会讨论 DSL 库的任何细节，而是简单关注一个演示如何使用它构建 HTML\
  \ 表单的示例。更多信息，你可以访问 HTML DSL 网站：[`github.com/Kotlin/kotlinx.html`](https://github.com/Kotlin/kotlinx.html)。\n\
  \n让我们创建一个生成随机数的简单 Web 应用程序。我们的服务器将展示一个带有表单的页面，用户可以在其中输入所需的范围和要生成的数值，如图 16.12 所示。服务器还将对输入数据进行基本验证，确保：\n\
  \n* 所有值均为有效整数\n* `From` 边界小于或等于 `To bound` 边界\n* `How many` 字段包含一个正数\n\n当在提交表单时违反了上述某些要求时，服务器将把表单返回给客户端，并在相应的文本字段旁边显示错误消息。\n\
  \n服务器模块的全文相当长，因此我们不会将其放在这里，而是专注于一些特定的段落。感兴趣的读者可以在 GitHub 上书籍补充仓库的 `ch16/random-gen`\
  \ 目录中找到它：[`github.com/asedunov/kotlin-in-depth`](https://github.com/asedunov/kotlin-in-depth)。\n\
  \n我们已经见过使用 HTML DSL 渲染列表和段落等简单元素的示例。现在，让我们来看看如何使用它来构建 HTML 表单。考虑以下取自应用模块源码的代码：\n\
  \n```kotlin\nbody {\n    h1 { +”Generate random numbers” }\n    form(action = “/”,\
  \ method = FormMethod.get) {\n        p { +”From: “ }\n        p {\n           \
  \ numberInput(name = FROM_KEY) {\n                value = from?.toString() ?: “1”\n\
  \            }\n            appendError(FROM_KEY)\n        }\n        p { +”To:\
  \ “ }\n        p {\n            numberInput(name = TO_KEY) {\n                value\
  \ = to?.toString() ?: “100”\n            }\n            appendError(TO_KEY)\n  \
  \      }\n        p { +”How many: “ }\n        p {\n            numberInput(name\
  \ = COUNT_KEY) {\n                value = count?.toString() ?: “10”\n          \
  \  }\n            appendError(COUNT_KEY)\n        }\n        p { hiddenInput(name\
  \ = GENERATE_KEY) { value = “” } }\n        p { submitInput { value = “Generate”\
  \ } }\n    }\n    …\n}\n```\n\n注意 `body()` 内部 `form()` 块：此调用定义了一个 HTML 表单，并引入了一个可以在其中添加如文本字段和按钮等输入组件的范围。`action`\
  \ 参数指定了表单数据发送的目标 URL。\n\nHTML DSL 提供了一整套函数用于创建所有基本类型的输入组件，例如：\n\n* `input()`：通用的文本字段\n\
  * `passwordInput()`：用于输入密码的文本字段\n* `numberInput()`：带有上一个/后一个按钮的数值文本字段\n* `dateInput()/timeInput()/dateTimeInput()`：用于输入日期和时间的专用文本字段\n\
  * `fileInput()`：带有浏览按钮的文本字段，用于上传本地文件等\n\n`submitInput()` 调用创建一个提交按钮，它将表单数据封装在 HTTP\
  \ 请求中并发送到服务器。\n\n如果你查看在浏览器中渲染的页面源码，你将看到类似下面代码的标记：\n\n```html\n<!DOCTYPE html>\n\
  <html>\n<head>\n    <title>Random number generator</title>\n</head>\n<body>\n  \
  \  <h1>Generate random numbers</h1>\n    <form action=”/” method=”get”>\n      \
  \  <p>From: </p>\n        <p><input type=”number” name=”from” value=”200”></p>\n\
  \        <p>To: </p>\n        <p>\n            <input type=”number” name=”to” value=”100”>\n\
  \            <strong> ‘To’ may not be less than ‘From’</strong>\n        </p>\n\
  \        <p>How many: </p>\n        <p>\n            <input type=”number” name=”count”\
  \ value=”-10”>\n            <strong> A positive integer is expected</strong>\n \
  \       </p>\n        <p><input type=”hidden” name=”generate” value=\"\"></p>\n\
  \        <p><input type=”submit” value=”Generate”></p>\n    </form>\n</body>\n</html>\n\
  ```\n\n\n\n\n\n```kotlin\nbody {\n  h2 { +”You have viewed this page ${stat.viewCount}\
  \ time(s)” }\n  a(“/clearStat”) { +”Clear statistics” }\n}\n}\n```\n\n保持 session\
  \ 实例不可变是合理的，因为服务器通常运行在多线程环境中，因此将 session 状态在可变对象中会导致易出错的代码。相反，你使用 `get()`/`set()`\
  \ 函数整体读取并替换 session。`getOrSet()` 函数允许在 session 尚不存在时对其进行初始化。\n\n最后一步是为根路径和 `/clearStat`\
  \ 路径定义路由规则。对于后者，我们简单地丢弃 session 数据并将用户重定向回根页面（此时将显示计数为零）：\n\n```kotlin\n@Suppress(“unused”)\
  \ // Referenced in application.conf\n\nfun Application.module() {\n  install(Sessions)\
  \ {\n    cookie<Stat>(STAT_KEY)\n  }\n  routing {\n    get(\"/\") {\n      call.rootPage()\n\
  \    }\n    get(\"/clearStat\") {\n      call.sessions.clear(STAT_KEY)\n      call.respondRedirect(\"\
  /\")\n    }\n  }\n}\n```\n\n如果你运行应用程序并在浏览器中打开 `localhost:8080`，你会发现每次刷新页面时访问计数都会增加。图\
  \ 16.14 显示了连续四次更新的结果：\n\n![](img/Img_16_14.jpg)\n\n**图 16.14：** 使用 session 数据跟踪页面访问计数\n\
  \n点击 `Clear statistics` 链接会强制服务器移除 session 数据并将计数重置为零。注意 `/clearStat` 处理器末尾的 `responseRedirect()`\
  \ 调用；在清除 session 后需要它重新渲染页面。\n\n作为 cookies 的替代方案，你也可以将 session 存储在 HTTP 请求和响应的标\
  \ 中：\n\n```kotlin\ninstall(Sessions) {\n  header<MyData>(“my_data”)\n}\n```\n\n\
  Ktor session 可能会存储在客户端或服务器端。默认情况下，所有 session 数据都会传输到客户端，由客户端保留并在下一次请求时将其发回。这可能会引发安全问题，因为内置序列化器会将\
  \ session 数据表示为纯文本。为了解决这个问题，Ktor 提供了一种 session 转换器机制，用于对传输的数据进行额外的编码/解码。\n\n内置转换器之一\
  \ `SessionTransportTransformerMessageAuthentication` 会随 session 数据附带根据特定算法（默认为 SHA256）计算的哈希值。在最简单的情况下，你只需要提供一个密钥密钥：\n\
  \n```kotlin\ninstall(Sessions) {\n  cookie<Stat>(STAT_KEY, SessionStorageMemory())\
  \ {\n    val key = Random.Default.nextBytes(16)\n    transform(SessionTransportTransformerMessageAuthentication(key))\n\
  \  }\n}\n```\n\n原始 session 数据保持不变，因此第三方仍然可以在客户端侧查看它们。然而，在没有服务器许可的情况下，他们无法更改 session\
  \ 数据，因为这将使摘要校验失效，而计算新的摘要依赖于对密钥密钥的掌握。\n\n`SessionTransportTransformerEncrypt` 提供了更强的安全保障，它会加密\
  \ session 数据以防止第三方读取。要配置此转换器，你需要提供加密密钥和身份验证密钥（后者用于创建 session 数据的数字签名）：\n\n```kotlin\n\
  install(Sessions) {\n  cookie<Stat>(STAT_KEY) {\n    val encryptionKey = Random.Default.nextBytes(16)\n\
  \    val signKey = Random.Default.nextBytes(16)\n    transform(\n      SessionTransportTransformerEncrypt(encryptionKey,\
  \ signKey)\n    )\n  }\n}\n```\n\n通过实现 `SessionTransportTransformer` 接口，也可以添加你自己的转换器。\n\
  \n默认情况下，`cookie()` 和 `header()` 块都配置客户端 session；在这种情况下，所有 session 数据都存储在客户端，并随着每次请求/响应在服务器之间传输。或者，你可以配置\
  \ session 存储器，告诉 Ktor 将 session 主体存储在服务器端并仅传输 session ID：\n\n```kotlin\ninstall(Sessions)\
  \ {\n  cookie<Stat>(STAT_KEY, SessionStorageMemory())\n}\n```\n\n`SessionStorageMemory`\
  \ 是一个内置实现，它将 session 数据保留在服务器内存中。注意，内存消耗会随着活动客户端数量而增加，因此服务器端 session 值得尽可能紧凑。\n\n\
  以上就是对 Ktor 服务器应用程序可用基本功能的概述。在下一节中，我们将关注通信的另一侧，并查看使用 Ktor 编写 HTTP 客户端。\n\n# 客户端功能\
  \ (#toc.xhtml_s118a)\n\nKtor 不限于编写服务器应用程序，还可以用于极大地简化与各种服务通信的异步客户端的开发。在本节中，我们将专注于围绕\
  \ `HttpClient` 类的小部分功能，该类允许你使用 HTTP 协议与网络服务器进行通信。\n\n# 请求与响应 (#toc.xhtml_s119a)\n\
  \n任何 HTTP 客户端的基本功能都围绕为某些网络服务器构建请求并读取其随后的响应。Ktor 提供了一系列丰富的开箱用原语，用于处理在 HTTP 请求和响应中可能看到的文本和二进制内容。\n\
  \n发布 HTTP 请求的最简单方法是使用 `get()` 并传递目标 URL。例如，要获取文本形式响应体，你可以使用 `get<String>()`：\n\n\
  ```kotlin\nimport io.ktor.client.HttpClient\nimport io.ktor.client.request.get\n\
  import kotlinx.coroutines.runBlocking\n\nenum class DayOfWeek {\n  SUNDAY, MONDAY,\
  \ TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY\n}\n\nfun main() {\n  runBlocking\
  \ {\n    HttpClient().use {\n      val url = “http://worldtimeapi.org/api/timezone/London”\n\
  \      val result = it.get<String>(url)\n      val prefix = “day_of_week:”\n   \
  \   val from = result.indexOf(prefix)\n      if (from < 0) return@runBlocking\n\
  \      val to = result.indexOf('\\n', from + 1)\n      if (to < 0) return@runBlocking\n\
  \      val dow = result\n        .substring(from + prefix.length, to)\n        .trim()\n\
  \        .toInt()\n      println(\"It’s ${DayOfWeek.values().getOrNull(dow)} in\
  \ London!\")\n    }\n  }\n}\n```\n\n除了字符串表示外，我们还可以通过将其转换为字节数组以二进制形式访问响应体：\n\n```kotlin\n\
  val bytes = client.get<ByteArray>(url)\n```\n\n或者获取异步 `ByteReadChannel`：\n\n```kotlin\n\
  val channel = client.get<ByteReadChannel>(```\n\nHttpClient 的请求方法是挂起函数，因此必须在某些协程上下文中调用。这就是为什么我们在示例中使用了\
  \ `runBlocking()`。\n\n注意 `HttpClient` 需要通过 `close()` 方法进行显式结束。当作用范围有限时，我们可以像处理其他\
  \ `Closeable` 类型实例一样，将其调用隐藏在 `use()` 块后面。\n\n正如你可能猜到的那样，`get()` 方法直接对应 HTTP `GET`。Ktor\
  \ 客户端为 HTTP 1.x/2.x 标准支持的方法提供了类似的快捷方法：`post()`、`put()`、`delete()`、`patch()`、`head()`、`options()`。这些方法接受一个可选的\
  \ `HttpRequestBuilder.() -> Unit` 类型 lambda，可以在其中配置额外的请求参数，例如添加头部或主体。要添加头部，可以使用\
  \ `HttpRequestBuilder` 中定义的 `header` 方法：\n\n```kotlin\nclient.get<ByteArray>(url)\
  \ {\n  header(“Cache-Control”, “no-cache”)\n}\n```\n\n也可以通过 `headers` 属性或其同名块使用\
  \ `HeadersBuilder`：\n\n```kotlin\nclient.get<ByteArray>(url) {\n  headers {\n  \
  \  clear()\n    append(“Cache-Control”, “no-cache”)\n    append(“My-Header”, “My-Value”)\n\
  \  }\n}\n```\n\n\n\n\n\n`HttpClient` 提供了一种提供 `User-Agent` 头的简化方法，这允许服务器识别客户端软件（例如网络浏览器及其特定版本）。要实现这一点，你只需要安装\
  \ `UserAgent` 特性并使用 `agent` 属性指定标头值：\n\n```kotlin\nval client = HttpClient(Apache)\
  \ {\n    install(UserAgent) {\n        agent = “Test Browser”\n    }\n}\n```\n\n\
  你也可以使用一个预定义的 User-Agent 设置：\n\n- `BrowserUserAgent()`：包含 Chrome 或 Safari 等流行浏览器\n\
  - `CurlUserAgent()`：对应于 Curl 代理\n\n上述函数替换了整个特性的安装块。例如：\n\n```kotlin\nval client\
  \ = HttpClient() {\n    BrowserUserAgent()\n}\n```\n\n要提供请求体（例如用于 `POST` 请求），你可以使用\
  \ `HttpRequestBuilder` 的 `body` 属性。简单的情况是编写一个 `String` 表示形式：\n\n```kotlin\nclient.get<String>(url)\
  \ {\n    body = “my_key1=my_value1&my_key2=my_value2”\n}\n```\n\n或者，你可以提供 `OutgoingContent`\
  \ 的任何实现，例如 `TextContent`（它类似于编写 `String`，但额外允许你指定 MIME 类型）、`ByteArrayContent`（用于传递二进制数据）、`LocalFileContent`（允许你传输文件）等。此外，通过安装\
  \ `JsonFeature`，你可以启用任意对象 JSON 格式的自动序列化。\n\n`submitForm()` 函数通过模拟 HTML 表单的行为实现了一个常见场景。例如，以下代码为我们在\
  \ `HTML DSL` 章节中演示的服务器应用程序提交表单数据：\n\n```kotlin\nval result = client.submitForm<String>(\n\
  \    url = “http://localhost:8080”,\n    encodeInQuery = true,\n    formParameters\
  \ = parametersOf(\n        “from” to listOf(“0”),\n        “to” to listOf(“100”),\n\
  \        “count” to listOf(“10”),\n        “generate” to emptyList()\n    )\n)\n\
  ```\n\n参数以键值对的形式传递，而 `encodeInQuery` 参数决定了它们作为请求数据部分的表示：\n\n- `true`：参数编码在请求 URL\
  \ 中的 HTTP `GET` 请求\n- `false`：参数在请求体中的 HTTP `POST` 请求\n\nKtor 客户端自带对 HTTP 重定向的支持。该特性默认默认安装的，因此每当服务器返回带有重定向状态的响应时，客户端会自动跟随新的位置。\n\
  \n### Cookies\n\nHTTP cookies 提供了一种常用方法，通过在 HTTP 头部中传递小数据包，在客户端请求之间保留某些状态。客户端（如网络浏览器）最初从服务器获取\
  \ cookie 并将其存储在客户端，在随后的请求中添加。Cookies 对于维护服务器会话特别有用，我们已经在之前的章节中涵盖了这一功能。现在，我们将查看如何在客户端使用\
  \ cookies。\n\n如果 HTTP 服务器使用 cookies 在客户端调用之间保留某些数据，则客户端必须安排妥善存储此类数据，并在必要时通过 HTTP\
  \ 请求提供它们。Ktor 通过提供即插用的 cookies 特性简化了这项任务。为了演示其用法，让我们为服务器部分讨论过的访问计数器应用程序编写一段简单的代码（见图\
  \ 16.14）：\n\n```kotlin\npackage com.example\nimport io.ktor.client.HttpClient\n\
  import io.ktor.client.engine.apache.Apache\nimport io.ktor.client.features.cookies.HttpCookies\n\
  import io.ktor.client.request.get\nimport kotlinx.coroutines.*\n\nfun main() {\n\
  \    HttpClient(Apache) {\n        install(HttpCookies)\n    }.use { client ->\n\
  \        runBlocking {\n            repeat (5) {\n                val htmlText =\
  \ client.get<String>(“http://localhost:8080”)\n                val from = htmlText.indexOf(“<h2>”)\n\
  \                val to = htmlText.indexOf(\"</h2>”)\n                if (from <\
  \ 0 || to < 0) return@runBlocking\n                val message = htmlText.substring(from\
  \ + “<h2>”.length, to)\n                println(message)\n                delay(500)\n\
  \            }\n        }\n    }\n}\n```\n\n如你所示，我们的客户端获取根路径 (`/`) 响应，找到在 `<h2>`\
  \ 标签内的头部，并将其打印到标准输出。注意 `install(HttpCookies)` 调用，它配置了 `HttpClient` 处理 cookies。由于请求/响应循环重复了五次（每次都有更新的\
  \ cookie），输出将如下所示：\n\n`You have viewed this page 0 time(s)`\n`You have viewed this\
  \ page 1 time(s)`\n`You have viewed this page 2 time(s)`\n`You have viewed this\
  \ page 3 time(s)`\n`You have viewed this page 4 time(s)`\n\n默认情况下，HTTP 客户端从空 cookies\
  \ 开始，并使用服务器提供的数据随下一次请求一起发送。这对应于典型的浏览器行为。有时，你可能需要发送一个带有预配置 cookie 集合的请求，而不是从服务器获取它们——例如，为了使用它们。\n\
  \n\n\n\n\n微服务架构提供了一种构建应用程序的方法，由多个相互连接的组件组成，旨在执行细粒度的特定领域任务。这种架构与传统的单体应用创建技术（即作为一个整体进行部署）形成对比。微服务通过允许你在物理上分离不同的功能部分，促进了模块化开发，并简化单个应用程序部分的开发、测试以及部署/更新。\n\
  \n在本章中，我们将解释微服务架构的基础知识及其定义原则，并结合 `Spring Boot` 和 `Ktor` 框架的示例，看看 Kotlin 如何帮助你实现微服务。`Spring`\
  \ 框架是 Java 世界中常用的工具之一，在最近的版本中它特别关注对 Kotlin 的支持；而 `Ktor`（我们在上一节中已经讨论过）则专门针对各种类型连接应用程序的开发，并大量使用了\
  \ Kotlin 的特性。在完成本章后，你将能够组合简单的服务，并为进一步学习更具体的微服务框架奠定基础。\n\n### 结构\n\n* 微服务架构\n* 介绍\
  \ Spring Boot\n* 使用 Ktor 构建微服务\n\n## 目标\n\n理解微服务架构的基本原理，并学习使用 `Spring Boot` 和 `Ktor`\
  \ 框架创建微服务的基础知识。\n\n### 微服务架构\n\n微服务架构的核心思想是将一个整体部署和交付的单体应用替换为一组轻量级、松耦合的服务；每个服务都有特定的任务，并使用定义良好的协议与其他服务通信。\n\
  \n为了给出一个更具体的例子，假设我们想要构建一个类似在线商店的应用程序，为用户提供基本功能，如浏览商品目录和下单。通过遵循单体应用方法，我们可能会得到类似于图\
  \ 17.1 所示的设计：*\n\n![](img/Img_17_01.jpg)\n\n**图 17.1：** 单体应用示例\n\n这是一个常见的三层架构，包括应用程序\
  \ UI（无论是桌面、Web 还是移动客户端）、业务逻辑以及数据存储/检索的独立层。应用程序中负责实现特定领域工作流的后端部分可以分解为更具体的模块，例如提供目录访问、维护用户购物车、订单的下达/跟踪/取消、支付，以及身份验证和用户配置管理。请注意，虽然模块本身可能是松耦合的，但它们通常不是独立分布或部署的，这使得服务器应用程序变成了单体。\n\
  \n然而，随着应用程序的增长，这种方法可能会带来某些问题。代码库中的任何更改（无论是新功能的实现还是错误修复）都需要你更新/重新部署整个应用程序，这会增加其启动时间并引入新\
  \ bug 的机会。这也阻碍了应用程序的可扩展性。在单体方法中，你必须处理整个应用程序的扩展，这比扩展特定模块或功能要复杂得多。另一个需要考虑的问题是可靠性，因为在同一个进程下运行所有后端模块会使应用程序更容易受到可能的内存泄漏和其他类型\
  \ bug 的影响。\n\n**面向服务的架构 (SOA)** 通过将单体应用分解为一组自包含的服务来缓解这些问题，这些服务可以很大程度上独立独立地进行开发、更新和部署。微服务可以被视为\
  \ SOA 演进中的一步，重点是让服务尽可能小且越简单；尽管在实践中，这两个术语通常被用作同义词。\n\n如果我们尝试拆解原始的单体应用设计，我们可能会得到类似于图\
  \ 17.2 的内容：*\n\n![](img/Img_17_02.jpg)\n\n**图 17.2：** 微服务架构\n\n你可以看到原始模块被执行相同功能的服务取代了，并使用类似\
  \ `HTTP` 的网络协议进行相互通信。现在，单个服务可以相互多程度上独立地进行开发、更新和配置。它们可能还会使用独立的数据库，甚至可能由不同的 `DBMS`\
  \ 管理。\n\n尽管微服务缺乏严格的定义，但它们所有的实际实现都基于一组共同的原则：\n\n* 每个微服务都专注于执行某些特定领域的任务，例如在我们的电子商务应用程序示例中管理商品目录或用户购物车。\n\
  * 微服务使用某些定义良好的协议进行通信，这些协议有效地建立了它们的 API。一种常见的情况是使用 `HTTP` 结合 `XML` 和 `JSON` 格式来传输复杂数据，以及基于\
  \ `RPC（远程过程调用）` 的协议。\n* 微服务可以独立地进行版本控制、部署和更新。\n* 微服务与语言和框架无关，这意味着在通常情况下，你可以使用任何认为适合该目的的编程语言来实现它们，并使用你选择的任何开发框架。唯一重要的是你的服务在与其他服务交互时使用的通信协议。\n\
  \n这应该让你对什么是微服务架构以及在什么情况下你可能想在应用程序中使用它有一个基本的了解。稍后，我们将展示在 Kotlin 语言背景下微服务编程可能是什么样的。这将为你研究更具体的技术栈和框架（如\
  \ `Spring`、`Netflix` 或 `Ktor`）提供基础。\n\n### 介绍 Spring Boot\n\n`Spring` 是最常用的 Java\
  \ 框架之一，它为构建各种应用程序提供了丰富的设施，并主要关注 J2EE 平台。在本章中，我们将讨论通过 `Spring Boot` 项目的示例，使用强大的 `Spring/Kotlin`\
  \ 组合来开发微服务。通常，`Spring Boot` 是一系列简化各种项目类型设置和框架配置的工具集。同样，我们将引导你完成创建 `Spring Boot`\
  \ 微服务所需的基本步骤。\n\n### 设置项目\n\n启动 Spring 应用程序简单的方法之一是使用名为 `Spring Initializr` 的特殊\
  \ Web 工具根据选择的应用程序类型自动生成项目骨架。要使用此工具，请在浏览器中打开 `https://start.spring.io`（参见图 17.3）：\n\
  \n![](img/Img_17_03.jpg)\n\n**图 17.3：** 使用 Spring Initializr 生成新项目\n\n此页面允许我们选择一组基本选项，这些选项决定了\
  \ Initializr 生成的项目类型：\n\n* 构建系统类型（`Maven/Gradle`），用于从源码配置和构建项目；对于我们的示例，我们将使用 `Gradle`，因为它提供了一种更灵活、更简洁的方式调整项目配置。\n\
  * 新项目的主要语言，初始化器将使用它生成示例源代码（在我们的案例中为 `Kotlin`）。这也会影响项目配置，例如，使用 `Kotlin` 在 `Maven/Gradle`\
  \ 构建文件中需要一些额外的依赖项。\n* 使用的 `Spring Boot` 版本：我们将选择编写本书时 Spring 的最新发布版本，即 `2.1.8`。\n\
  * 项目组和构件 ID，它们定义了用于制品发布的 Maven 坐标。\n\n\n\n\n此外，您可以使用 `Dependencies` 字段来指定要包含在项目中的常用包。由于我们的服务将使用\
  \ HTTP，因此我们需要 Web 支持。在字段中输入 `Web` 并在建议列表中选择 `Spring Web` 选项。\n\n选择所有必要选项后，点击 `Generate\
  \ the project` 按钮并下载包含由初始化器创建的项目的 ZIP 文件。要在 IntelliJ IDEA 中打开该项目，你需要执行以下操作：\n\n\
  1. 将压缩包解压到本地目录。\n2. 从 `File | New | Project` 调用 `Existing Source…` 菜单命令，并指定解压后的项目根路径以及构建系统类型（`Gradle`）。\n\
  3. 等待 IDE 完成与 `Gradle` 构建模型的同步，之后你将看到一个与 图 17.4 类似的项目结构：\n\n\n\n![](img/Img_17_04.jpg)\n\
  \n**图 17.4：** 示例 Spring Boot 项目结构\n\n同样，在由 Ktor 向导生成的项目中，`build.gradle.kts` 文件将包含项目依赖的定义。注意\
  \ `.kts` 扩展。这意味着构建文件是用 Kotlin 而不是 Groovy 的。因此，该脚本的语法与我们在 Ktor 和 Android 示例中看到的略有不同：\n\
  \n```\nimport org.jetbrains.kotlin.gradle.tasks.KotlinCompile\n\nplugins {\n   \
  \ id(\"org.springframework.boot\") version \"2.1.7.RELEASE\"\n    id(\"io.spring.dependency-management\"\
  ) version \"1.0.8.RELEASE\"\n    kotlin(\"jvm\") version \"1.3.41\"\n    kotlin(\"\
  plugin.spring\") version \"1.3.41\"\n}\n\ngroup = \"com.example\"\nversion = \"\
  0.0.1-SNAPSHOT\"\njava.sourceCompatibility = JavaVersion.VERSION_1_8\nrepositories\
  \ {\n    mavenCentral()\n}\ndependencies {\n    implementation(\"org.springframework.boot:spring-boot-starter-web\"\
  )\n    implementation(\"com.fasterxml.jackson.module:jackson-module-kotlin\")\n\
  \    implementation(\"org.jetbrains.kotlin:kotlin-reflect\")\n    implementation(\"\
  org.jetbrains.kotlin:kotlin-stdlib-jdk8\")\n    testImplementation(\n        \"\
  org.springframework.boot:spring-boot-starter-test\"\n    )\n}\ntasks.withType<KotlinCompile>\
  \ {\n    kotlinOptions {\n        freeCompilerArgs = listOf(\"-Xjsr305=strict\"\
  )\n        jvmTarget = \"1.8\"\n    }\n}\n```\n\n你可能想在继续之前进行一些调整，例如将 Kotlin 版本升级到较新的版本。与任何其他\
  \ Gradle 项目一样，当 `build.gradle` 文件发生任何更改时，IDEA 都会建议你重新同步项目模型（除非你开启了自动导入，在这种情况下同步将自动开始）。\n\
  \n`application.properties` 文件包含各种属性（采用简单的 `key=value` 格式），这些属性影响 Spring 的行为。默认情况下，它是空的，但稍后我们将使用它来更改服务监听的端口。\n\
  \n我们项目的入口点定义在 `DemoApplication.kt` 文件中，该文件包含了 `DemoApplication` 类的定义以及将应用程序启动委托框架的\
  \ `main()` 函数：\n\n```\npackage com.example.demo\nimport org.springframework.boot.autoconfigure.SpringBootApplication\n\
  import org.springframework.boot.runApplication\n\n@SpringBootApplication\nclass\
  \ DemoApplication\nfun main(args: Array<String>) {\n    runApplication<DemoApplication>(*args)\n\
  }\n```\n\n`runApplication()` 函数将创建 `DemoApplication` 实例，并自动实例化和连接我们应用程序所需的所有服务。对于具有我们这样默认配置的\
  \ Web 应用程序，它还会启动一个内置的 Tomcat 服务器，该服务器将处理客户端请求并分发给 Spring 提供的 servlet。`DemoApplication`\
  \ 实例将作为一个全局上下文，需要时可以注入到其他应用程序组件中。注意 `@SpringBootApplication` 注解；这是一个方便的快捷方式，允许你将指定的类配置为\
  \ Spring 应用程序上下文。\n\n应用程序启动后（你使用 IDEA 主菜单中的 `Run` 命令来执行此操作），我们可以使用浏览器等 HTTP 客户端访问它。由于我们的应用程序尚未包含实际请求处理代码，Spring\
  \ servlet 将对我们发出的每个请求返回标准的错误页面。图 17.5 显示了一个示例：\n\n![](img/Img_17_05.jpg)\n\n**图\
  \ 17.5：** Spring 框架提供的默认响应页面\n\n注意，Spring 使用 `8080` 端口监听客户端请求，除非在 `application.properties`\
  \ 文件中显式更改。\n\n**IDE 提示：有一些插件可以为 IntelliJ IDEA 添加 Spring 支持，特别允许用户像 Initializr 工具一样生成各种\
  \ Spring 驱动的项目。但请注意，这些插件在 IDEA 社区版（Community Edition）不可用。而 IDEA Ultimate 版内置了这些插件。**\n\
  \n在接下来的章节中，我们将使用此项目存根作为创建示例微服务的的基础。但在开始实际编码之前，我们必须的第一件事是定义我们的服务将做什么以及它们将如何相互通信。\n\
  \n### 确定服务\n\n在本章中，我们将以微服务为例带你深入了解。为了简单起见，我们将创建两个简单的服务：一个数字生成器和一个 使用 Ktor 进行 Web\
  \ 开发。简单起见，我们将使用 HTTP 作为基础。第一个服务是数字生成器，第二个是密码生成器。它的语法与我们在 Ktor 和 Android 示例中看到的略有不同。我们将使用：\n\
  \n`/random/int/from/X/to/Y/quantity/N`\n\n该 URL 将生成 `X` 到 `Y` 之间的数字（包含边界值）。结果将以\
  \ JSON 对象给出，包含以下字段：\n\n*   非整数 `X`\n*   `Y<X`\n*   非正整数 `n`\n\n让我们给出一些预期的服务输出示例：\n\
  \n| URL 示例 | 服务响应 |\n| :--- | :--- |\n| `/random/int/10/20/quantity/5` | `{\"status\"\
  :null, \"values\":[16,17,18,17,12]}` |\n| `/random/int/20/to/10/quantity/5` | `{\"\
  status\":\"Range may not be empty\", \"values\":[]}` |\n| `/random/int/10/to/20/quantity/-1`\
  \ | `{\"status\":\"Quantity must be positive\", \"values\":[]}` |\n| `/random/int/X/to/20/quantity/5`\
  \ | `{\"status\":\"Range start must be an integer\", \"values\":[]}` |\n\n**表 17.1：**\
  \ 数字生成器示例\n\n我们服务的另一个功能是生成浮点数。我们将使用以下 URL：\n\n该 URL 将让服务生成 0 到 1 之间的 `N` 个双精度数字（不包含\
  \ 1）。\n\n第二个服务将提供类似的 API 来生成随机密码。给定格式的 URL：\n\n`/password/length/L/quantity/N`\n\
  \n它将生成 N 个长度为 L 的字母数字字符串。密码生成器使用相同的输出格式；唯一的区别是 `values` 字段是字符串数组而不是数字。\n\n| URL\
  \ 示例 | 服务响应 |\n| :--- | :--- |\n| `/password/length/8/quantity/5` | `{\"status\"\
  :null, \"values\":[\"B0zDWtvG\",\"JrSkXl7X\",\"oDwR7cp2\",\"X8sRfzDW\",\"nUcRXzn1\"\
  ]}` |\n| `/password/length/bbb/quantity/5` | `{\"status\":\"Length must be an integer\"\
  , \"values\":[]}` |\n| `/password/length/-1/quantity/ccc` | `{\"status\":\"Length\
  \ must be positive\", \"values\":[]}` |\n| `/password/length/8/quantity/-5` | `{\"\
  status\":\"Quantity must be positive\", \"values\":[]}` |\n\n**表 17.2：** 密码生成器示例\n\
  \n\n\n\n为了演示服务之间的通信，我们将创建一个依赖于数字生成器的密码生成器。当请求新密码（多个密码）时，它将首先调用数字生成器产生一组随机索引，然后将这些索引转换为字符并组合在一起生成字符串。\n\
  \n现在我们已经清楚了服务 API 的样如何，可以开始实际的实现了。我们将从随机数生成器开始，因为它将被另一个服务使用。\n\n# 实现随机数生成器服务 (#toc.xhtml_s129a)\n\
  \n让我们按照“设置项目”章节的步骤为我们的生成器服务设置一个新的 Spring Boot 项目。服务的入口点将基本保持不变。在我们的情况下，只需重命名应用程序类和包即可：\n\
  \n```kotlin\npackage com.example.randomGen\n\nimport org.springframework.boot.autoconfigure.SpringBootApplication\n\
  import org.springframework.boot.runApplication\n\n@SpringBootApplication\nclass\
  \ RandomGenerator\n\nfun main(args: Array<String>) {\n    runApplication<RandomGenerator>(*args)\n\
  }\n```\n\n在编写服务本身的实际业务逻辑之前，我们需要定义类来持有将以 JSON 格式传递的数据。由于我们的服务输入是通过 URL 路径传递的原始类型值，因此唯一的结构化数据是它的输出。这正是\
  \ Kotlin data class 的用场：\n\n```kotlin\npackage com.example.randomGen\n\ndata class\
  \ GeneratorResult<T>(\n    val status: String?,\n    val values: List<T>\n)\n\n\
  fun <T>errorResult(status: String) =\n    GeneratorResult<T>(status, emptyList())\n\
  \nfun <T>successResult(values: List<T>) =\n    GeneratorResult<T>(null, values)\n\
  ```\n\n这两个工具函数 `errorResult()` 和 `successResult()` 将有助于简化服务代码中 `GeneratorResult`\
  \ 的构建。\n\n服务的核心逻辑实现在所谓的控制器类中，它负责处理客户端请求。要将给定的类转换为 Spring 控制器，你只需要为它加上注解 `@RestController`。Spring\
  \ 会在组件扫描期间自动加载该类并创建其实例。我们在这里不会详细讨论扫描过程，但你可以在 Spring 框架文档中找到它们（例如 `@ComponentScan`\
  \ 注解）。\n\n因此，我们的控制器类的存根如下：\n\n```kotlin\npackage com.example.randomGen\n\nimport\
  \ org.springframework.web.bind.annotation.*\n\n@RestController\nclass RandomGeneratorController\n\
  ```\n\n要定义请求处理器，我们为控制器的方法标记特殊注解，将它们与特定的请求属性关联起来。例如，`@RequestMapping` 注解允许你将方法绑定到具有特定\
  \ URL 的请求上：\n\n```kotlin\n@RequestMapping(\"/hello\")\nfun hello() = \"Hello, World\"\
  \n```\n\n同样，在 Ktor 中，你可以使用通配符如 `*` 和参数名来定义路径模板。在下面的示例中，URL 路径的最后部分会自动绑定到标记了 `@PathVariable`\
  \ 注解的方法参数：\n\n```kotlin\n@RequestMapping(\"/hello/{user}\")\nfun hello(@PathVariable\
  \ user: String) = \"Hello, $user\"\n```\n\n方法的参数名称可能与你在路径模板中使用的变量不同；在这种情况下，你需要将路径参数作为\
  \ `@PathVariable` 参数指定：\n\n```kotlin\n@RequestMapping(\"/sum/{op1}/{op2}\")\nfun\
  \ hello(\n    @PathVariable(\"op1\") op1Str: String,\n    @PathVariable(\"op2\"\
  ) op2Str: String\n): Any {\n    val op1 = op1Str.toIntOrNull() ?: return \"Invalid\
  \ input\"\n    val op2 = op2Str.toIntOrNull() ?: return \"Invalid input\"\n    return\
  \ op1 + op2\n}\n```\n\n除了 URL 路径外，`@RequestMapping` 注解还允许你根据各种请求数据关联处理器，例如 HTTP\
  \ 方法（`GET`, `POST` 等）、头部内容和请求参数。同样，还有一些 `@PathVariable` 的替代方案可以将方法参数绑定到请求参数（`@RequestParam`）、请求头（`@RequestHeader`）、会话数据（`@SessionAttributes`）等。映射选项与\
  \ Ktor 的路由机制非常相似；但在 Ktor 中，它是指定为普通的 Kotlin 代码，而不是注解形式的元数据。我们在这里不会深入细节，感兴趣的读者可以在\
  \ Spring 站点 `docs.spring.io` 找到相关文档。\n\n当控制器的多个方法共享公共路径前缀时，将 `@RequestMapping` 添加到控制器类可能会方便。在这种情况下，方法级注解中提到的路径是相对于类路径定义的。例如，与其写：\n\
  \n```kotlin\n@RestController\nclass SampleController {\n    @RequestMapping(\"/say/hello/{user}\"\
  )\n    fun hello(@PathVariable user: String) = \"Hello, $user\"\n    @RequestMapping(\"\
  /say/goodbye/{user}\")\n    fun goodbye(@PathVariable user: String) = \"Goodbye,\
  \ $user\"\n}\n```\n\n我们可以将公共 `/say` 部分提取到 `SampleController` 的注解中：\n\n```kotlin\n\
  @RestController\n@RequestMapping(\"/say\")\nclass RandomGeneratorController {\n\
  \    @RequestMapping(\"hello/{user}\")\n    fun hello(@PathVariable user: String)\
  \ = \"Hello, $user\"\n    @RequestMapping(\"goodbye/{user}\")\n    fun goodbye(@PathVariable\
  \ user: String) = \"Goodbye, $user\"\n}\n```\n\n考虑到这些，让我们来实现根据服务处理 `/random/int`\
  \ 路径的控制器方法：\n\n```kotlin\n@RequestMapping(\"/int/{from}/{to}\")\nfun genIntegers(\n\
  \    @PathVariable(\"from\") fromStr: String,\n    @PathVariable(\"to\") toStr:\
  \ String,\n    @PathVariable(\"quantity\") quantityStr: String\n): GeneratorResult<Int>\
  \ {\n    val from = fromStr.toIntOrNull() ?: return errorResult(\"Range start must\
  \ be an integer\")\n    val to = toStr.toIntOrNull() ?: return errorResult(\"Range\
  \ end must be an integer\")\n    val quantity = quantityStr.toIntOrNull() ?: return\
  \ errorResult(\"Quantity must be an integer\")\n    if (quantity <= 0) return errorResult(\"\
  Quantity must be positive\")\n    if (from > to) return errorResult(\"Range may\
  \ not be empty\")\n    val values = (1..quantity).map { Random.nextInt(from, to\
  \ + 1) }\n    return successResult(values)\n}\n```\n\n对应 /random/float 路径的浮点数处理可以通过类似的方式进行。此服务的完整源码可以在\
  \ [`github.com/asedunov/kotlin-in-depth/ch17/number-gen-service`](https://github.com/asedunov/kotlin-in-depth/ch17/number-gen-service)\
  \ 找到。并通过浏览器访问服务，我们将获得预期的响应。你可以在图 17.6 (#c17.xhtml_fig17_6) 中看到随机数列表的示例：\n\n(images/Img_17_06.jpg)\n\
  \n图 17.6：成功的示例\n\n你还可以确保我们的服务能够正确处理客户端请求中的常见错误。例如，图 17.7 (#c17.xhtml_fig17_7) 显示了当你请求范围从\
  \ 50 到 20 的数字时的结果：\n\n(images/Img_17_07.jpg)\n\n图 17.7：生成器返回错误\n\n如所期望，服务返回了一个错误，指示指定的区间为空，因为上限小于下限。\n\
  \n# 实现密码生成服务 (#toc.xhtml_s130a)\n\n现在，我们可以以第一个为起点轻松地实现第二个密码生成服务。让我们创建一个类似的 Spring\
  \ Boot 项目，并将代码放在 `com.example.passwordGen` 包中。\n\n与随机数生成器的关键区别是第二个服务将与第一个服务通信。Spring\
  \ 提供了箱用的 `RestTemplate` 类，它简化了向其他 Web 应用发送请求并获取其响应的过程。例如，代码：\n\n```kotlin\nval url\
  \ = \"http://localhost:8080/random/int/from/0/to/10/quantity/5\"\nval restTemplate\
  \ = RestTemplate()\n```\n\n\n\n\n`val result = restTemplate.getForObject(url, GeneratorResult::class.java)`\
  \ as `GeneratorResult<Int>` 将返回一个包含 0 到 10 之间五个随机整数列表的结果。\n\n现在，让我们使用这个思路将数字转换为密码字符。以下是密码生成器控制类的完整文本：\n\
  \n```kotlin\npackage com.example.passwordGen\n\nimport org.springframework.web.bind.annotation.*\n\
  import org.springframework.web.client.RestTemplate\n\nprivate val chars = ('a'..'z')\
  \ + ('A'..'Z') + ('0'..'9')\n\n@Suppress(\"unused\")\n@RestController\n@RequestMapping(\"\
  /password\")\nclass PasswordGeneratorController {\n    @RequestMapping(\"/length/{length}/quantity/{quantity}\"\
  )\n    fun genPasswords(\n        @PathVariable(\"length\") lengthStr: String,\n\
  \        @PathVariable(\"quantity\") quantityStr: String\n    ): GeneratorResult<String>\
  \ {\n        val length = lengthStr.toIntOrNull()\n        ?: return errorResult(\"\
  Length must be an integer\")\n        val quantity = quantityStr.toIntOrNull()\n\
  \        ?: return errorResult(\"Quantity must be an integer\")\n        if (quantity\
  \ <= 0) return errorResult(\"Quantity must be positive\")\n        val prefix =\
  \ \"http://localhost:8080/random/int\"\n        val url = \"$prefix/from/0/to/${chars.lastIndex}/quantity/$length\"\
  \n        val restTemplate = RestTemplate()\n        val passwords = (1..quantity).map\
  \ {\n            val result = restTemplate.getForObject(\n                url, GeneratorResult::class.java\n\
  \            ) as GeneratorResult<Int>\n            String(result.values.map { chars[it]\
  \ }.toCharArray())\n        }\n        return successResult(passwords)\n    }\n\
  }\n```\n\n请注意，密码生成器服务需要 `GeneratorResult` 类的定义，以表示其自身的响应以及数字生成器的响应。对于像这种这样的简单情况，我们只需要将此定义拷贝到我们的第二个项目中。在需要许多类来表示请求/响应数据的复杂场景中，可能值得使用一些代码共享；例如，我们可以设置一个多模块项目，其中包含两个服务，以及一个用于共享类的独立模块；或者将共享代码提取到单独的项目中，将其输出发布到某些构件仓库中，然后在两个服务中都作为依赖使用。\n\
  \n由于我们的两个服务都是作为独立应用程序运行，它们必须监听不同的端口。因此，在运行密码生成器服务之前，请确保它的端口与第一个不冲突。在本示例中，我们将通过将\
  \ `application.properties` 修改为 `8081`：\n\n```\nserver.port=8081\n```\n\n现在，我们可以启动第二个服务，并尝试查询格式为\
  \ `localhost:8081/password/length/12/quantity/10` 的 URL 来尝试使用其功能。处理此类 URL 时，我们的密码服务将向随机数生成器发送多次请求，并使用其响应来组合密码列表。图\
  \ 17.8 显示了通过浏览器访问密码服务的示例结果：\n\n![](img/Img_17_08.jpg)\n\n**图 17.8:** 密码生成器响应的示例\n\
  \n请注意，密码服务执行了一系列请求，这些请求被同步处理：\n\n```kotlin\nval passwords = (1..quantity).map {\n\
  \    val result = restTemplate.getForObject(\n        url,GeneratorResult::class.java\n\
  \    ) as GeneratorResult<Int>\n    String(result.values.map { chars[it] }.toCharArray())\n\
  }\n```\n\n换句话说，每当你调用 `getForObject()` 方法时，服务线程就会被阻塞，在获取所有预期的响应之前无法进行任何有用工作。当并发请求数量增加时，这可能会阻碍服务的扩展性，因此通常情况下我们可能需要使用一些异步编程技术，例如\
  \ Kotlin Cor 程库或如 RxJava 或 Akka 等响应式框架。\n\n通过 Ktor，正如我们在接下来的章节中看到的，由于框架本身构建在协程库之上，并提供了通过挂起函数进行异步计算的开箱支持，这个问题在很大程度上得到了缓解。让我们看看使用\
  \ Ktor 功能实现时，我们的密码生成器服务会是什么样的。\n\n# 使用 Ktor 构建微服务](#toc.xhtml_s131a)\n\n在上一章中，我们向你介绍了\
  \ Ktor 框架，它简化了连接型客户端/服务器应用的开发。在剩下的章节中，我们将扩展知识，展示如何使用 Ktor 轻松地实现微服务。\n\n该节由两部分组成。在第一部分，我们将介绍另一个\
  \ Ktor 特性，用于处理客户端和服务端基于 JSON 的对象序列化。该特性允许你在发送时自动将 Kotlin 对象转换为相应的 JSON 描述，并在接收时同样地从\
  \ JSON 恢复它们，类似于 Spring 框架在我们早期的示例中所做的那样。\n\n在第二部分，我们将使用 Ktor API 重新实现密码生成器服务。这将允许你将\
  \ Ktor 特性与其 Spring 对应物进行比较（例如，路由 DSL 与请求映射注解），并作为由不同框架驱动的微服务如何无缝地相互通信的演示。\n\n# 使用\
  \ JSON 序列化功能](#toc.xhtml_s132a)\n\n在上一章中，我们看到了使用 Ktor 的 `respondText()` 发送纯文本的示例。虽然我们可以使用它来构建\
  \ JSON，但 Ktor 提供了一个更简单的解决方案，即 `ContentNegotiation` 特性，允许你为对象配置转换器。通常，要为特定的 MIME\
  \ 类型使用它，你需要注册 `ContentConverter` 的相应实现以处理发送/接收操作。Ktor 为三种基础序列化机制提供了开箱支持：\n\n*  \
  \ Jackson (`https://github.com/FasterXML/jackson`)\n*   `google-gson` (`https://github.com/google/gson`)\n\
  *   `kotlinx.serialization` (`https://github.com/Kotlin/kotlinx.serialization`)\n\
  \n在示例中，我们将使用 Jackson 实现。由于相应的转换器属于 `io.ktor:ktor-jackson`，请确保在 `build.gradle` 文件中包含必要的依赖：\n\
  \n```\ncompile \"io.ktor:ktor-jackson:$ktor_version\"\n```\n\n之后，你可以使用 `ContentNegotiation`\
  \ 安装块配置 JSON 序列化：\n\n```kotlin\nfun Application.module() {\n    …\n    install(ContentNegotiation)\
  \ {\n        jackson()\n    }\n    …\n}\n```\n\n之前的 `jackson()` 函数将 `JacksonConverter`\
  \ 与 `application/json` 内容关联，并设置输出格式的默认行为。序列化涵盖请求和响应数据。例如，我们可以向响应发送一些对象，它们会被转换为 JSON\
  \ 文本格式：\n\n```kotlin\ncall.respond(successResult(listOf(\"12345678\")))\n```\n\n\
  同样，我们可以反序列化客户端接收到的 JSON 对象，将其转换为普通的 Kotlin 对象：\n\n```kotlin\ndata class PasswordSpec(val\
  \ length: Int, val quantity: Int)\n…\nval spec = call.receive<PasswordSpec>()\n\
  ```\n\n但在我们的情况下，我们在发送相应请求后从另一个服务接收 JSON 数据，因此我们还必须为 `HttpClient` 实例配置序列化。Ktor 客户端应用程序也支持相同的三种序列化实现。我们只需要在服务的\
  \ `build.gradle` 中添加相应的依赖：\n\n```\ncompile \"io.ktor:ktor-client-json:$ktor_version\"\
  \ncompile \"io.ktor:ktor-client-jackson:$ktor_version\"\n```\n\n为了在客户端启用序列化，我们随后安装\
  \ `JsonFeature`：\n\n```kotlin\nval client = HttpClient(Apache) {\n    …\n    install(JsonFeature)\n\
  \    …\n}\n```\n\n\n\n默认情况下，特定的序列化实现是根据包含的制品自动选择的。需要时，我们也可以通过将 `JsonSerializer`\
  \ 实例赋值给 `serializer` 属性来显式指定它：\n\n```kotlin\nval client = HttpClient(Apache) {\n\
  \  …\n  install(JsonFeature) {\n    serializer = JacksonSerializer()\n  }\n  …\n\
  }\n```\n\n配置好 `JsonFeature` 后，我们可以使用 `get()` 函数从 HTTP 响应中自动读取对象：\n\n```kotlin\n\
  val url = \"http://localhost:8080/random/int/from/0/to/10/quantity/5\"\nval result\
  \ = client.get<GeneratorResult<Int>>(url)\n```\n\n既然我们已经有了自动序列化功能，让我们看看如何将其与其他 Ktor\
  \ 特性结合，来实现真正的微服务。\n\n### 实现密码生成器服务\n\n为了演示 Ktor 和 Spring 方案之间的区别，我们将重新实现密码生成器服务。正如预期的，大部分代码将保持不变，因为两种实现都遵循相同的业务逻辑。\n\
  \n要访问我们的第一个服务，我们将使用 `HttpClient` 而替 `RestTemplate`：\n\n```kotlin\nval prefix = \"\
  http://localhost:8080/random/int\"\nval url = \"$prefix/from/0/to/${chars.lastIndex}/quantity/$length\"\
  \nval passwords = (1..quantity).map {\n  val result = client.get<GeneratorResult<Int>>(url)\n\
  \  String(result.values.map { chars[it] }.toCharArray())\n}\n```\n\n注意，与我们基于 Spring\
  \ 的示例不同，这段代码是异步的；`HttpClient.get()` 是在 Ktor 提供的协程上下文中调用的挂起函数。因此，服务线程不会被阻塞，我们的服务器可以在等待随机数生成器响应时处理进一步的请求。\n\
  \nKtor 路由 DSL 将取代基于 Spring 的 `@RestController` `@RequestMapping` 注解的请求分发：\n\n```kotlin\n\
  route(\"/password\") {\n  get(\"/length/{length}/quantity/{quantity}\") { … }\n\
  }\n```\n\n如你所示，路径语法基本上是相同的，但使用 DSL 允许人们在很大程度上消除模板代码。\n\n为了运行我们 Ktor 版本的密码生成器，这里是服务器应用程序模块的完整文本：\n\
  \n```kotlin\npackage com.example\nimport com.fasterxml.jackson.databind.SerializationFeature\n\
  import io.ktor.application.*\nimport io.ktor.client.HttpClient\nimport io.ktor.client.engine.apache.Apache\n\
  import io.ktor.client.features.json.*\nimport io.ktor.client.request.get\nimport\
  \ io.ktor.features.ContentNegotiation\nimport io.ktor.jackson.jackson\nimport io.ktor.response.respond\n\
  import io.ktor.routing.*\n\nfun main(args: Array<String>): Unit =\n  io.ktor.server.netty.EngineMain.main(args)\n\
  \nprivate val chars = ('a'..'z') + ('A'..'Z') + ('0'..'9')\n\n@Suppress(\"unused\"\
  ) // Referenced in application.conf\nfun Application.module() {\n  install(ContentNegotiation)\
  \ {\n    jackson {\n      enable(SerializationFeature.INDENT_OUTPUT)\n    }\n  }\n\
  \  val client = HttpClient(Apache) {\n    install(JsonFeature) {\n        serializer\
  \ = JacksonSerializer()\n    }\n  }\n\n  suspend fun ApplicationCall.genPasswords():\
  \ GeneratorResult<String> {\n    val length = parameters[\"length\"]?.toIntOrNull()\n\
  \    ?: return errorResult(\"Length must be an integer\")\n    val quantity = parameters[\"\
  quantity\"]?.toIntOrNull()\n    ?: return errorResult(\"Quantity must be an integer\"\
  )\n    if (quantity <= 0) return errorResult(\"Quantity must be positive\")\n  \
  \  val prefix = \"http://localhost:8080/random/int\"\n    val url = \"$prefix/from/0/to/${chars.lastIndex}/quantity/$length\"\
  \n    val passwords = (1..quantity).map {\n      val result = client.get<GeneratorResult<Int>>(url)\n\
  \      String(result.values.map { chars[it] }.toCharArray())\n    }\n    return\
  \ successResult(passwords)\n  }\n\n  routing {\n    route(\"/password\") {\n   \
  \   get(\"/length/{length}/quantity/{quantity}\") {\n        call.respond(call.genPasswords())\n\
  \      }\n    }\n  }\n}\n```\n\n由于我们原始的 Spring Boot 实现正在监听端口 `8081`，我们需要在 Ktor 版本中同样进行必要的更改，调整其\
  \ `application.conf` 文件：\n\n```kotlin\nktor {\n  deployment {\n    port = 8081\n\
  \    port = ${?PORT}\n  }\n  application {\n    modules = [ com.example.ApplicationKt.module\
  \ ]\n  }\n}\n```\n\n现在，如果你启动数字生成器和密码生成器服务，并在浏览器中打开 `localhost:8081/password/length/12/quantity/10`，你会看到与图\
  \ 17.8 显示非常相似的结果（尽管密码列表不同）。注意，尽管数字生成器是基于 Spring 的，但密码生成器现在使用 Ktor；无论它们的差异如何，两个服务都可以轻松地通信。\n\
  \n### 结论\n\n在本章中，我们初步了解了如何使用 Spring 或 Ktor 框架在 Kotlin 中实现基于微服务的应用程序。我们解释了微服务架构的核心思想，带你走了简单\
  \ Spring Boot 项目的设置步骤，并讨论了 Spring REST 控制器和模板在微服务实现中的用法。此外，我们还描述了如何在 Ktor 中配置和使用\
  \ JSON 序列化，这一特性对于提供格式化 API 的 Web 应用程序特别有用。从这些基础开始，你现在可以通过参考其他资源来完善知识。我们建议你从 spring.io\
  \ 的指南 ([`spring.io/guides`](https://spring.io/guides)) 以及以及我们在上一节中提到的 Ktor 示例 ([`ktor.io/samples`](https://ktor.io/samples))\
  \ 开始。\n\n### 问题\n\n1. 解释微服务模型的基本原理。\n2. 描述设置 Spring Boot 项目的基本步骤。\n3. 什么是 Spring\
  \ 控制器类？解释数据如何映射到控制器方法。\n4. 比较 Spring 请求映射和 Ktor 路由。\n5. 如何在 Ktor 中配置 JSON 序列化？\n\
  6. 给出一个同时使用 Spring Boot 和 Ktor 实现微服务的示例。\n"
