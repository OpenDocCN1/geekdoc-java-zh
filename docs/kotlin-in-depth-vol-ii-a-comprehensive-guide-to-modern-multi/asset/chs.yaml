- "# Kotlin 深度解析 [第二卷]：现代多范式语言全面指南\n\n\n\n![](img/cover.jpg)\n![image](img/cover.jpg)\n\
  \n\n![](img/line.jpg)\n\n\n![](img/line.jpg)\n\n# 作者\n\n\n![](img/logo.jpg)\n\n\n\
  \n\n\n\n\n\n\nPh: 23861747\n\n\n# 献给\n\n*Tatiana，我的引导之光*\n*以及源不断的灵感源泉*\n\n# 关于作者\n\
  \n**Aleksei Sedunov** 自 2008 年以来一直担任 Java 开发人员。2012 年加入 JetBrains 后，他积极参与了 Kotlin\
  \ 语言的开发，专注于 IntelliJ 平台的 IDE 工具。目前，他在 DataGrip 团队（JetBrains 的一款数据库 IDE）工作，继续使用 Kotlin\
  \ 作为主要的开发工具。\n\n# 致谢\n\n首先，我要向 JetBrains 的整个 Kotlin 团队表示谢意，他们创造了这样一种美丽的语言，并持续不断地改进它——特别是\
  \ Andrey Breslav，他从第一天起就领导了语言的设计。\n\n我非常感谢 BPB publications 的所有人，为我提供了编写这本书的绝佳机会，并在提交读者之前对文本改进提供了巨大的支持。\n\
  \n*– Aleksei Sedunov*\n\n# 前言\n\n自 2016 年首次发布以来（在此之前更早），Kotlin 作为一种强大且灵活的工具，在许多开发任务中变得越来越流行。它能够很好地处理移动、桌面和服务器端应用程序，并于\
  \ 2017 年和 2018 年最终获得 Google 的官方认可，成为 Android 开发的主要语言。这种流行是有理可的，因为语言的实用主义（即在已知解决方案中选择最佳实践的倾向）是其设计的指导原则之一。\n\
  \n通过你手里的这本书，我想邀请你进入 Kotlin 编程的美丽世界，在那里你可以亲眼见证它的优势。在完成这本书后，你将拥有所有必要的知识来独立编写 Kotlin\
  \ 代码。\n\n第二卷向你介绍了更高级的 Kotlin 特性，如反射、领域特定语言（DSL）和协程，讨论了 Java/Kotlin 互操作问题，并解释了 Kotlin\
  \ 如何应用于各种开发领域，包括测试、Android 应用程序和 Web。它分为以下 8 章：\n\n- **第 10 章** 讨论了注解的使用，注解允许你为\
  \ Kotlin 代码添加各种元数据，并解释了 `Reflection API` 的基础，该 API 访问 Kotlin 声明的运行时表示。\n- **第 11\
  \ 章** 描述了一些高级特性，帮助开发人员以领域特定语言的形式组合灵活的 API：运算符重载、委托属性和基于高阶函数的构建器风格 DSL。\n- **第 12\
  \ 章** 讨论了在同一代码库组合 Java 和 Kotlin 代码的常见问题，并解释了在 Kotlin 代码中使用 Java 声明反之的细节。\n- **第\
  \ 13 章** 向读者介绍了 Kotlin 协程库引入了一组用于编程异步计算的构建块。此外，它还描述了一些简化 Kotlin 代码中使用 Java 并发 API\
  \ 的工具。\n- **第 14 章** 致力于 KotlinTest，这是一个专门为 Kotlin 开发者设计的流行测试框架。它描述了各种规范风格，解释了断言\
  \ API 的使用，并处理了使用固件和测试配置等更高级的问题。\n- **第 15 章** 介绍了在 Android 平台上使用 Kotlin。它引导读者设置\
  \ Android Studio 项目，并通过一个简单的计算器示例阐述了使用 Kotlin 进行 Android 开发的各个方面。\n- **第 16 章**\
  \ 介绍了 Ktor 框架的一些高级特性，旨在开发基于异步计算的应用。\n- **第 17 章** 描述了如何使用 Spring Boot 和 Ktor 构建微服务应用。\n\
