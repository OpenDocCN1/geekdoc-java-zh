  \   return number;\n    }\n}\n```\n\n### GetSystemTime\n```java\npackage com.abd.tool;\n\
  import java.util.Calendar;\npublic class GetSystemTime {\n    private Calendar now\
  \ = Calendar.getInstance();\n    private int year = now.get(Calendar.YEAR);\n  \
  \  private int month = now.get(Calendar.MONTH) + 1;\n    private int day = now.get(Calendar.DAY_OF_MONTH);\n\
  \    public String getToday() {\n        String today = this.year + \"-\" + this.month\
  \ + \"-\" + this.day;\n        return today;\n    }\n    public String getYearMonth()\
  \ {\n        String today = this.year + \"-\" + this.month ;\n        return today;\n\
  \    }\n}\n```\n\n### MyPagination\n```java\npackage com.abd.tool;\nimport java.util.ArrayList;\n\
  import java.util.List;\npublic class MyPagination {\n    public List<Object> list=null;\n\
  \    private int recordCount = 0;\n    private int pagesize = 0;\n    private int\
  \ maxPage = 0;\n    // 初始化分页信息\n    public List InitPage(List list, int Page, int\
  \ pagesize) {\n        List<Object> newList=new ArrayList<>();\n        this.list\
  \ = list;\n        recordCount = list.size();\n        this.pagesize = pagesize;\n\
  \        this.maxPage = getMaxPage();\n        try {\n            for (int i = (Page-1)*pagesize;\
  \ i <= Page*pagesize-1; i++) {\n                try {\n                    if (i\
  \ >= recordCount) break;\n                } catch (Exception e) {}\n           \
  \     newList.add(list.get(i));\n            }\n        } catch (Exception e) {\n\
  \            e.printStackTrace();\n        }\n        return newList;\n    }\n \
  \   // 获取指定页的数据\n    public List AppointPage(int Page) {\n        List<Object> newList=new\
  \ ArrayList<>();\n        try {\n            for (int i = (Page-1)*pagesize; i <=\
  \ Page*pagesize-1; i++) {\n                try {\n                    if (i >= recordCount)\
  \ break;\n                } catch (Exception e) {}\n                newList.add(list.get(i));\n\
  \            }\n        } catch (Exception e) {\n            e.printStackTrace();\n\
  \        }\n        return newList;\n    }\n    // 获取最大记录数\n    public int getMaxPage()\
  \ {\n        int maxPage = (recordCount == 0) ? 0 : (recordCount + pagesize - 1)\
  \ / pagesize + 1;\n        return maxPage;\n    }\n}\n```\n*(注：由于原文中 getMaxPage\
