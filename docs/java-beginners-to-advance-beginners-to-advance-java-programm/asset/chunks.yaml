    .a1:hover {COLOR: #FF0000; font-size:15px;}\n.a2:link {COLOR: #606060; TEXT-DECORATION:\
    \ none; font-size:2px;}\n.a2:visited {COLOR: #0033ff; TEXT-DECORATION: none; font-size:2px;}\n\
    .a2:active {COLOR: #606060; TEXT-DECORATION: none; font-size:2px;}\n.a2:hover\
    \ {COLOR: #FF0000; font-size:2px;}\n```\n\n## 数据库结构\n\n### 基础信息\n| 项目 | 配置 |\n\
    | :--- | :--- |\n| SQL | `SHR.sql` |\n| WebContent | `smarthrm` |\n| Database\
    \ | `smarthrm` |\n| Host | `localhost` |\n| Port | `3306` |\n\n### 表定义\n```sql\n\
    create database smarthrm;\nuse smarthrm;\n\nCREATE TABLE tb_manager(\n    id VARCHAR(10)\
    \ PRIMARY KEY,\n    account VARCHAR(10),\n    password VARCHAR(8)\n);\n\nCREATE\
    \ TABLE tb_employee(\n    id VARCHAR(16) PRIMARY KEY,\n    em_serial VARCHAR(20),\n\
    \    em_name VARCHAR(20),\n    em_sex VARCHAR(20),\n    em_age VARCHAR(20),\n\
    \    em_IDCard VARCHAR(20),\n    em_born VARCHAR(20),\n    em_nation VARCHAR(20),\n\
    \    em_marriage VARCHAR(20),\n    em_visage VARCHAR(20),\n    em_ancestralHome\
    \ VARCHAR(20),\n    em_tel VARCHAR(20),\n    em_address VARCHAR(20),\n    em_afterschool\
    \ VARCHAR(20),\n    em_speciality VARCHAR(20),\n    em_culture VARCHAR(20),\n\
    \    em_startime VARCHAR(20),\n    em_departmentId VARCHAR(20),\n    em_typework\
    \ VARCHAR(20),\n    em_creatime VARCHAR(20),\n    em_createName VARCHAR(20),\n\
    \    em_bz VARCHAR(20)\n);\n\nCREATE TABLE tb_department(\n    id VARCHAR(16)\
    \ PRIMARY KEY,\n    dt_name VARCHAR(20),\n    dt_createTime VARCHAR(20),\n   \
    \ dt_bz VARCHAR(20)\n);\n\nCREATE TABLE tb_inviteJob(\n    id VARCHAR(16) PRIMARY\
    \ KEY,\n    name VARCHAR(20),\n    sex VARCHAR(20),\n    age VARCHAR(20),\n  \
    \  born VARCHAR(20),\n    job VARCHAR(20),\n    specialty VARCHAR(20),\n    experience\
    \ VARCHAR(20),\n    teachSchool VARCHAR(20),\n    afterSchool VARCHAR(20),\n \
    \   tel VARCHAR(20),\n    createtime VARCHAR(20),\n    content VARCHAR(20),\n\
    \    isstock VARCHAR(20),\n    address VARCHAR(20)\n);\n\nCREATE TABLE tb_cj(\n\
    \    id VARCHAR(16) PRIMARY KEY,\n    cj_title VARCHAR(20),\n    cj_type VARCHAR(20),\n\
    \    cj_content VARCHAR(20),\n    cj_money VARCHAR(20),\n    cj_time VARCHAR(20)\n\
    );\n\nCREATE TABLE tb_pay(\n    id VARCHAR(16) PRIMARY KEY,\n    pay_emNumber\
    \ VARCHAR(20),\n    pay_emName VARCHAR(20),\n    pay_month VARCHAR(20),\n    pay_baseMoney\
    \ VARCHAR(20),\n    pay_overtime VARCHAR(20),\n    pay_age VARCHAR(20),\n    pay_check\
    \ VARCHAR(20),\n    pay_absent VARCHAR(20),\n    pay_safety VARCHAR(20)\n);\n\n\
    CREATE TABLE tb_train(\n    id VARCHAR(16) PRIMARY KEY,\n    tn_man VARCHAR(20),\n\
    \    tn_title VARCHAR(20),\n    tn_content VARCHAR(20),\n    tn_time VARCHAR(20),\n\
    \    tn_address VARCHAR(20),\n    tn_join VARCHAR(20),\n    tn_bz VARCHAR(20)\n\
    );\n```\n"
