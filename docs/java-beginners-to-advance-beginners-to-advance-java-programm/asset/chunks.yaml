    />\n    </action>\n    <action path=\"/pay\" validate=\"false\" name=\"payForm\"\
    \ scope=\"request\">\n      <forward name=\"queryPay\" path=\"/pay.jsp\"/>\n \
    \   </action>\n    <action path=\"/train\" validate=\"false\" name=\"trainForm\"\
    \ scope=\"request\">\n      <forward name=\"queryTrain\" path=\"/train.jsp\"/>\n\
    \    </action>\n    <action path=\"/cj\" validate=\"false\" name=\"cjForm\" scope=\"\
    request\">\n      <forward name=\"queryCj\" path=\"/cj.jsp\"/>\n    </action>\n\
    \  </action-mappings>\n</struts-config>\n```\n\n### 部署 (web.xml)\n\n路径：`WebContent/WEB-INF/web.xml`\n\
