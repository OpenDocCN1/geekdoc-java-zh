    \  </bean>\n  <bean name=\"/manager\" class=\"com.abd.action.ManagerAction\" singleton=\"\
    false\">\n    <property name=\"objectDao\">\n      <ref bean=\"objectDao\" />\n\
    \    </property>\n  </bean>\n  <bean name=\"/department\" class=\"com.abd.action.DepartmentAction\"\
    \ singleton=\"false\">\n    <property name=\"objectDao\">\n      <ref bean=\"\
