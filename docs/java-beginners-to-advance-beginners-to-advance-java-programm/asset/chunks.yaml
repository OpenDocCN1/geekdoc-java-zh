    \    </property>\n    <property name=\"url\">\n      <value>jdbc:mysql://localhost/smarthrm</value>\n\
    \    </property>\n    <property name=\"username\">\n      <value>root</value>\n\
    \    </property>\n    <property name=\"password\">\n      <value>root</value>\n\
