    >\n    <property name=\"dataSource\">\n      <ref bean=\"dataSource\" />\n   \
    \ </property>\n    <property name=\"hibernateProperties\">\n      <props>\n  \
    \      <prop key=\"hibernate.dialect\">org.hibernate.dialect.MySQLDialect</prop>\n\
    \        <prop key=\"hibernate.hbm2ddl.auto\">update</prop>\n      </props>\n\
    \    </property>\n    <property name=\"mappingResources\">\n      <list>\n   \
