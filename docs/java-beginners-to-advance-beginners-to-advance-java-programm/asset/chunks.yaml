    \ 1px solid; border-bottom-style:none; border-left-style:none; border-top-style:none;}\n\
    .tableBorder_lb {border: #D8D8D8 1px solid; border-left-style:none; border-top-style:none;}\n\
    .tableBorder_l_dashed {border: #D8D8D8 1px dashed; border-bottom-style:none; border-left-style:none;\
