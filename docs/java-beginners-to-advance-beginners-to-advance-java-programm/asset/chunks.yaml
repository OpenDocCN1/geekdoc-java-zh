    \ left:2px; top:-2px; font-size:12px; width:125px; line-height:18px; border:0px;\
    \ color:#000000;}\nth {font-size: 13pt; color: #ffffff;}\na {font-size: 9pt; text-decoration:\
    \ none; color: #000000; noline:expression(this.onfocus=this.blur);}\na:link {font-size:\
    \ 13pt; color: #0033ff; text-decoration: none;}\n/* visited link */\na:visited\
    \ {color: #0033ff; text-decoration: none;}\na:hover {font-size: 13pt; color: #FF0000;}\n\
    img{border:0;}\n.img1{border:0;}\n.blue {font-size: 9pt; color: #034683;}\n.bgcolor\
    \ {font-size: 9pt; color: #1980DB;}\n.btn_grey {font-family: \"ËÎÌå\"; font-size:\
    \ 16pt; color: #333333; background-color: #eeeeee; cursor: hand; padding:1px;\
    \ height:19px; border-top: 1px solid #FFFFFF; border-right:1px solid #666666;\
    \ border-bottom: 1px solid #666666; border-left: 1px solid #FFFFFF;}\ninput{font-family:\
    \ \"ËÎÌå\"; font-size: 14pt; color: #333333; border: 1px solid #B38E61;}\n.word_white{color:#FFFFFF;}\n\
    .word_deepgrey{color:#999999;}\n.word_orange{color:#FF6600;}\n.word_green{color:#FEECEA;}\n\
    .noborder{border:none;}\n.word_gray{color:#dddddd;}\nbody {margin-left: 0px; margin-top:\
    \ 0px; margin-right: 0px; margin-bottom: 0px; background-color:#D9D6D1;}\n.textarea\
    \ {font-family: \"ËÎÌå\"; font-size: 13pt; color: #333333; border: 1px solid #B38E61;}\n\
    .tableBorder {border: #D8D8D8 1px solid;}\n.tableBorder_dashed {border: #D8D8D8\
