    \ = list;\n        recordCount = list.size();\n        this.pagesize = pagesize;\n\
    \        this.maxPage = getMaxPage();\n        try {\n            for (int i =\
    \ (Page-1)*pagesize; i <= Page*pagesize-1; i++) {\n                try {\n   \
    \                 if (i >= recordCount) break;\n                } catch (Exception\
    \ e) {}\n                newList.add(list.get(i));\n            }\n        } catch\
    \ (Exception e) {\n            e.printStackTrace();\n        }\n        return\
    \ newList;\n    }\n    // 获取指定页的数据\n    public List AppointPage(int Page) {\n\
    \        List<Object> newList=new ArrayList<>();\n        try {\n            for\
    \ (int i = (Page-1)*pagesize; i <= Page*pagesize-1; i++) {\n                try\
    \ {\n                    if (i >= recordCount) break;\n                } catch\
    \ (Exception e) {}\n                newList.add(list.get(i));\n            }\n\
    \        } catch (Exception e) {\n            e.printStackTrace();\n        }\n\
    \        return newList;\n    }\n    // 获取最大记录数\n    public int getMaxPage() {\n\
