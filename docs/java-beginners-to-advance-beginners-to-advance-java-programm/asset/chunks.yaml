    \ <property name=\"objectDao\">\n      <ref bean=\"objectDao\" />\n    </property>\n\
    \  </bean>\n  <bean name=\"/pay\" class=\"com.abd.action.PayAction\" singleton=\"\
    false\">\n    <property name=\"objectDao\">\n      <ref bean=\"objectDao\" />\n\
    \    </property>\n  </bean>\n  <bean name=\"/train\" class=\"com.abd.action.TrainAction\"\
    \ singleton=\"false\">\n    <property name=\"objectDao\">\n      <ref bean=\"\
    objectDao\" />\n    </property>\n  </bean>\n  <bean name=\"/cj\" class=\"com.abd.action.CjAction\"\
    \ singleton=\"false\">\n    <property name=\"objectDao\">\n      <ref bean=\"\
    objectDao\" />\n    </property>\n  </bean>\n</beans>\n```\n\n### Struts 配置 (struts-config.xml)\n\
    \n路径：`WebContent/WEB-INF/struts-config.xml`\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
    UTF-8\"?>\n<!DOCTYPE struts-config \"-//Apache Foundation//DTD Struts Configuration\
    \ 1.2//EN\" \"http://struts.apache.org/dtd/struts-config_1_2.dtd\">\n<struts-config>\n\
    \  <form-beans>\n    <form-bean name=\"managerForm\" type=\"com.abd.form.ManagerForm\"\
    />\n    <form-bean name=\"departmentForm\" type=\"com.abd.form.DepartmentForm\"\
    />\n    <form-bean name=\"inviteJobForm\" type=\"com.abd.form.InviteJobForm\"\
