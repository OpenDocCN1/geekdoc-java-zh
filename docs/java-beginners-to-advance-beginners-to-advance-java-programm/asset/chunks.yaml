- fmt: "\n# Recruitment Management\n\n## Recruitment List\n\n该页面用于展示招聘人员列表，包含招聘查询、非聘用查询以及详细的职位管理功能。\n\
    \n### 核心逻辑与脚本\n\n```jsp\n<%@ page contentType=\"text/html; charset=gb2312\" language=\"\
    java\" import=\"java.sql.*\" errorPage=\"\" %>\n<jsp:directive.page import=\"\
    java.util.List\"/>\n<%@ taglib prefix=\"html\" uri=\"/WEB-INF/struts-html.tld\"\
    />\n<%@ taglib prefix=\"logic\" uri=\"/WEB-INF/struts-logic.tld\"/>\n<%@ taglib\
    \ prefix=\"bean\" uri=\"/WEB-INF/struts-bean.tld\"/>\n```\n\n```html\n<head>\n\
    \    <meta http-equiv=\"Content-Type\" content=\"text/html; charset=gb2312\">\n\
    \    <title>Smart Human Resource Management - Recruitment Management</title>\n\
    \    <link type=\"text/css\" rel=\"stylesheet\" href=\"css/style.css\">\n    <script\
    \ language=\"JavaScript\">\n        function deleteForm(date) {\n            if(confirm(\"\
    You sure you want to delete this information do candidates？\")) {\n          \
    \      window.location.href=\"inviteJob.do?method=deleteInviteJob&id=\"+date;\n\
    \            }\n        }\n    </script>\n</head>\n```\n\n### 分页处理\n\n```jsp\n\
    <jsp:useBean id=\"pagination\" class=\"com.abd.tool.MyPagination\" scope=\"session\"\
    ></jsp:useBean>\n<%\n    String condition=\"method=queryInviteJob\";\n    Integer\
    \ isstock=null;\n    if(request.getAttribute(\"isstock\")!=null){\n        isstock=Integer.valueOf((String)request.getAttribute(\"\
    isstock\"));\n        condition=\"method=queryInviteJob&isstock=\"+isstock+\"\"\
    ;\n    }\n    // The following is the paging operation\n    String str=request.getParameter(\"\
    Page\");\n    int Page=1;\n    List list=null;\n    if(str==null){\n        list=(List)request.getAttribute(\"\
    list\");\n        int pagesize=11; // Specify the number of records displayed\
    \ per page\n        list=pagination.getInitPage(list,Page,pagesize); // Initialize\
    \ paging information\n    }else{\n        Page=pagination.getPage(str);\n    \
    \    list=pagination.getAppointPage(Page); // Get the data of the specified page\n\
    \    }\n%>\n```\n\n### 列表表格\n\n| Job Id | Name | Sex | Job Type | Education |\
    \ Work Experience | Operation |\n| :--- | :--- | :--- | :--- | :--- | :--- | :---\
    \ |\n\n```jsp\n<logic:iterate id=\"inviteJobForm\" collection=\"<%=list%>\" indexId=\"\
    number\">\n    <bean:define id=\"inviteJobid\" name=\"inviteJobForm\" property=\"\
    id\"/>\n    <bean:define id=\"isstockk\" name=\"inviteJobForm\" property=\"isstock\"\
    />\n    <!-- 行数据渲染 -->\n    <bean:write name=\"inviteJobForm\" property=\"id\"\
    />\n    <bean:write name=\"inviteJobForm\" property=\"name\"/>\n    <bean:write\
    \ name=\"inviteJobForm\" property=\"sex\"/>\n    <bean:write name=\"inviteJobForm\"\
    \ property=\"job\"/>\n    <bean:write name=\"inviteJobForm\" property=\"teachSchool\"\
    />\n    <bean:write name=\"inviteJobForm\" property=\"experience\"/>\n    <!--\
    \ 操作逻辑 -->\n    <a href=\"inviteJob.do?method=queryOneInviteJob&id=<%=inviteJobid%>\"\
    >Detail</a>\n    <%if(isstock==null){%>\n        <a href=\"javascript:deleteForm('<%=inviteJobid%>')\"\
    >Delete</a>\n        <%if(isstockk.equals(\"0\"))%>\n            <a href=\"employee.do?method=forward&id<%=inviteJobid%>\"\
    >Hire</a>\n        <%}else{\n            out.print(\"Recorded\");\n        }}\n\
    \    %>\n</logic:iterate>\n```\n\n## Candidate Recruitment Detail\n\n该页面展示特定候选人的详细信息。\n\
    \n### 详细信息字段\n\n| 字段 | 内容 |\n| :--- | :--- |\n| Name | `${requestScope.form.name}`\
    \ |\n| Sex | `${requestScope.form.sex}` |\n| Age | `${requestScope.form.age}`\
    \ |\n| Date of Birth | `${requestScope.form.born}` |\n| Job Type | `${requestScope.form.job}`\
    \ |\n| Profession | `${requestScope.form.specialty}` |\n| Work Experience | `${requestScope.form.experience}`\
    \ |\n| Education | `${requestScope.form.teachSchool}` |\n| Phone | `${requestScope.form.tel}`\
    \ |\n| After Schools | `${requestScope.form.afterSchool}` |\n| Home Address |\
    \ `${requestScope.form.address}` |\n| Registration Time | `${requestScope.form.createtime}`\
    \ |\n\n### 录取状态\n\n- **Whether to Hire**: `${requestScope.form.isstock}` (A representative\
    \ has been hired, 0 for not hiring)\n- **Offer Letter Issued**: `${requestScope.form.content}`\n"
