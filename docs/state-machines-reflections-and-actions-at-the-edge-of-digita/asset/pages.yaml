    Another research team took this approach even further and produced beautiful street
    signs with perturbations, which were identified as a person or sports ball by
    a Deep Neural Network.¹⁰ Another research group demonstrated that these perturbations—the
    beautiful patterns originally calculated by neural networks to recognize content
    in images—can be printed on a sticker and attached to objects to completely mislead
    neural networks. What makes this technique especially effective is that the attacker
    does not need to know what image they are attacking when constructing the attack.
    After generating an adversarial patch, the patch could be widely distributed across
    the internet for other attackers to produce and use.''¹¹ I call this the ''perturbation
    method''.


