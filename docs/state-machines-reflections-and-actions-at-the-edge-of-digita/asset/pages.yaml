    # MAX HAIVEN


    We can rethink the ''disruption'' of money from another perspective? Many of us
    have been educated or habituated to look upon money as we see it: either as a
    neutral tool of commerce or as a useful lever for the transformation of society.
    What if we learned to see money from a different viewpoint, for instance those
    for whom money has always felt like a thief, or a bad lover? It might prove necessary
    if we truly want to disrupt money in ways that look to the kind of common egalitarian
    horizons the world desperately needs. I share some optimism that new digital technology
    will open new methods for coordinating and sharing the fruits of human cooperation—an
    most sacred role our societies have increasingly trusted to capital forms of money,
    backed by state power. But I am concerned the common discourses surrounding blockchains,
    cryptocurrencies, smart contracts, and similar emergent technologies—which often
    posit themselves as revolutions in money, payments, and economics—all too replicate
    the perspectives of the powerful and, as such, threaten (often against their designers''
    or proponents'') intentions to either supplement or supplant the ruling state-capital
    power nexus, rather than abolish it.


    In this chapter, I look at money from ''below'' to problematize our utopian dreams
    that we might dream more dangerously together. I take the almost forgotten echoes
    of convict love tokens, hob nickels and Notgeld illustrate how proletarian subjects
    have transformed money into an experimental medium of mutual aid, class struggle
    and solidarity, representing a hidden ledger of meaningful ''disruptive innovation''
    that can inspire us today.


    # Money as a State Machine?


    New monetary and financial technologies, especially those that employ cryptographic
    and blockchain methods towards anarchist virtues such decentralization and personal
    liberty, may not only produce but also reinvent The State for the 21st century.
    By ''The State'' I mean more than clunky old bust of coercive authority, the integrated
    weapon and accelerator of financialized capitalist accumulation that has risen
    from four decades of violent neoliberal globalization.'' The State emerges from
    the crucible of capitalism and colonialism over the past five centuries as not
    only a specific political formation but also a habit of the imagination. This
    is a state built by and for the reproduction of what Gilles Deleuze named the
    ''society of control'': a society where the state rules by generating and offering
    ''freedoms'', exciting'
