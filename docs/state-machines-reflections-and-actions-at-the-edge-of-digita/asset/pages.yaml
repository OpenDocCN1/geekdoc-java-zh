  md: 'this first case, Cetus sold the PCR patent to Hoffman–La Roche for US$300 million—a
    remarkable profit for a biotechnology company at the time.⁸ Subsequently, Hoffman–La
    Roche made the most profitable biotechnology of the 20th century. Trade publications
