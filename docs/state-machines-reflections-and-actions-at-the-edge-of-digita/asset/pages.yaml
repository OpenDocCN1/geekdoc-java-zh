  md: '# ANALYSIS


    been unexplained numerous times. In 2016, auditors by Ernst & Young reported ''vast
    unexplained extraordinary expenditure'',² and in 2018 a new government promised
    to replace it with a more transparent and accountable alternative.³


    In 2006, the passport scheme accounted for around one percent of St. Kitts and
    Nevis'' GDP. By 2014, this had risen to 25 percent. The scheme''s success triggered
    a scramble for citizenship-by-investment (CBI) records around the world, many
    of them led by H&P; the only firm with a track record in the industry and already
    in possession of a global Rolodex of investors seeking more powerful passports⁴
    Other Caribbean nations—namely, Antigua and Barbuda, St. Lucia, and Grenada—were
    first to copy the scheme. They then got involved; first in Cyprus and then Malta,
    where EU passports are now offer for as little as €800,000 and a perfunctory background
    check⁵ Today, the citizenship business is worth billions of dollars⁶ and H&P is
    still the largest player.


    The development of citizenship identity is an example of financialization: the
    process by which assets—goods, services, risks—are made amenable to exchange.
    The asset in question, however, is national identity, despite a turbulent and
    relatively short history, is usually as solid and unassuming. In this context,
    there is a sharp contrast between, the one hand, the contemporary regime in national
    politics and the hardening of borders around the world (for example, the construction
    of fences and the implementation of even more draconian security regimes, and
    the revocation of citizenship as punishment) and, on the other hand, the increasing
    fluidity exchange of national identities available to the very rich. Nowhere,
    perhaps, is there a more extreme than the privatization of state assets than this
    is all made extremely visible in H&P''s annual Passport Index and Quality of Nationality
    Index. These global surveys of travel freedom and local benefits, ranking the
    world''s countries based on the freedom of movement and from accountability—they
    offer their citizens⁸⁹


    The impact of this latest round of global financialization is not limited to those
    who access the service. It also surfaces in the form of shifting property prices,
    weaponized by oppressive states against the last fortunate. Lifting towers rises
    on the


