    The Coolino et al. research group may not be too off with their concern, since
    celebrities whose faces are deepfaked (unwillingly turned into can) can be both
    individuals and as a product. In the near future, we might see celebrity faces
    for real-time 3D graphics in the apparel industry; we might receive personalized
    advertising with a celebrity’s face of our choice (or what markers think be our
    choice); we might also receive videos with our own, friends’, or families’ faces
    to explain the great value of products. Another obvious deepfake is the organized
    trolling of the political area.


    The regulation of capitalized celebrity faces is noteworthy for setting precedence,
    because individual data produced by everyone is not protected by copyright and
    is weakly protected through privacy law, a tension that leaves the unresolved
    question of data ownership poses.


    In their article, Coolino et al. show that it is possible to produce quality deepfakes,
    which only a machinic-algorithmic process can recognize as. Similar developments
    can be expected, where the degree of inquality of data in general has to be by
    using machinery. These machine-detection techniques need computational power and
    large-scale data sets that have been prepared by humans, the arms race between
    detectors becomes a question of the ownership of computational capital—that is,
    the machines to calculate and know how to do. Knowledge circulates through open-source
    and open-access approaches in the research community, but the necessary calculation
    power is less accessible. It is situated and enclosed in institutions like university
    research labs (that is, if they do not use cloud providers), government agencies
    who may or not decide to provide access, and cloud computing providers, such as
    AWS, Google Cloud, Microsoft Azure, IBM Cloud, or Oracle Cloud Infrastructure.
    The public may become spectators in this arms race—and an argument can therefore
    be made for a public and cooperative computational infrastructure. This need for
    computational capital is what I call the ‘arms race machin un/fake method’.


    The situation has not been subverted with a single method. Instead, it calls for
    a strategy that places the needed tools and capital in the hands of the public,


