    Mahama''s work is the subject of another commodity chain—the circulation of artworks
    works in a global marketplace. The artist''s ready-made jute sacks were central
    to a recent legal dispute involving the Ghanaian artist and superstar, LA-based
    dealer Stefan Simchowitz. Simchow is an art dealer for the internet, a speculative
    dealer who eschews the legacy gallery system in favor of Instagram, but nonetheless
    cultivates a large network of art collectors. Simchowitz, who argues that artworks
    will provide a relatively stable currency in the global aftermath of Brexit, is
    well known for his speculative investment practices, buying into relatively unknown
    artists, inflating their value through social media, and “flipping” their work
    for profit before moving on to the next talent. The long career of the artist
    and sustained relationships with galleries or collectors are replaced by arbitrage—quickly
    exploiting information and price differences in a global market.


    Simchowitz acquired some of Mahama''s works, allegedly either after the meeting
    at the London Frieze art or plucking from obscurity the internet, depending on
    whom you him to believe. The case of the 2015 Venice Biennale, Simchowitz''s company,
    and a Dublin-based dealer Jonathan Ellis King won a multi-million lawsuit against
    Mahama in US federal court. The case concerned the outcome of a jute sack installation
    Civil Occupation acquired by the pair and exhibited in the Ellis King Gallery
    in December 2014. Mahama signed 29 of the sacks prior to the opening of the show.
    In the aftermath, Mahama and Simchowitz proceeded to dismantle the huge installation
