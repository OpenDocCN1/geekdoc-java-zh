  md: '# ACTIONS


    people I then on to what data and databases mean for online identities when we
    are becoming increasingly familiar with the idea of having various online presences
    and persona.


    As our understanding of data shifts to encompass a breadth of online information,
    which includes the content on our social media profiles, our idea of categories
    and demographics shifts too. After outlining four main issues for databased identities,
    I keep our ongoing struggle for control when I turn to tactics people use against
    these databases. While we do not have control of the databases of information
    about people gleaned from social media platforms, we are imbricated in these processes
    by the very nature of being social media users. As media scholar Nicholas Carah
    argues, people taking photos with their smartphones that they post with filters,
    tags, hashtags, and captions become ‘the first coders of the database,’3 creating
    valuable attention and data. The more people sort and classify, the more platforms
    have to determine how best to represent them. When these representations become
    part of how platforms and services understand us as people, they can become absorbed
    into the fabric of our identity.


    # Data and Demographics


    Databases are culturally important ways of organizing information and people,
    including personal data like search engine queries, time spent on websites, Likes,
    or even someone''s heart rate, steps taken daily, and hours of sleep per night.
    From parish registers of births, deaths, and marriages in the 16th century;4 to
    the nation-wide census conducted in the US since 1790;5 to telephone books and
    card index records,6 databases have been maintained for hundreds of years.


    Social scientist Bob Kitch argues that we think of data as neutral and objective;
    the raw material produced by the world we live in is turned into categories, measurements,
    and representations.7 But new media José van Dijk and Thomas Most remind us that
    data are already prefigured by an interpretive frame and the gatherings available.8
    Paper forms and social media platforms have been designed to collect particular
    kinds of information. When I write my date of birth on a form at a doctor''s clinic,
    it might help identify the best type of care for someone me. When I select my
    date of birth from a drop-down menu on Facebook, the platform automatically assigns
    me to demographic which it can advertise. The created input mechanism and framework—and
    consequently control the databases—matters.


