    Charles'' use of the phantom figure is metaphorically and conceptually equivocal.
    The Spectral Metaphor: Living Ghosts and the Agency of Invisibility, Esther Peers
    explains that specters in contemporary culture and theory ''are methodologically
    distinct and within the characteristics, functions and effects they affect.''16
    However, she distinguishes between three emphases within their usage in contemporary
    culture. Firstly, there is the ghost as the figure of return, expressing the persistence
    of the past in the present. Secondly, the ghost as a figure of presence-absence,
    ephemeral yet present in space as a matter that needs to be accounted for. And
    lastly, the ghost as a figure of mixed and hybrid phenomena, a conceptual figure
    of critique of the ''unmixed'' and ''pure''.17 Ghosts indicate an agency that
    is present invisible and intangible, eerie hybrid, described by Maria del Pilar
    Blanco and Esther Peers as a ''non-present present'', a ''being-there-of an absent
    or departed one'', they signify precisely that what escapes fusion or comprehension...
    what is placed outside, excluded from perception.''18


    Ghosts have a penchant for lingering and haunting, often demand a response, and
    are associated with the prenatural and with simultaneous mixed temporalities and
    categories.19 Specters are wholly and ambiguous in the sense that they represent
    the bodilessness of things conceived as disparate or ever opposed: past and present,
    materiality and immateriality, and the real and the imaginary, immanence and transcendence,
    and primary and secondary causes. To state it in a more accurate way, they cut
    through the limits and walk through barriers of the order ''what is never simple
    is what escapes the totalizing logic of conventional gothic and hermeneutic operations,''
    Peers weird.20


    Finance and money, in general, and algorithmic high-frequency trading, in particular,
    have a track record for being associated with spectral, and gothic qualities.
    The autourmé, combined with images of office buildings and the haunting and ominous
    soundtrack that accompanies the film''s images, invoke the spectral dynamics described
    by Mark Fisher as existing ''at every level an eerie entity.''21 It is ''conjured
    out of nothing'' yet exerts palpable influence.22 In The Weird and The Eerie,
    Fisher describes the eerie as ''tied up with questions of agency.''23 It can be
    found in places ''where the forces that govern mundane are obscured.''24 An place
    escapes partially populated by the empty where an unknown agent seems to be acting.''25
    An agent associated with fate and foresight.26


