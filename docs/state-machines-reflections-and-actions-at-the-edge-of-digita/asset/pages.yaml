  md: '# Smut-Tagging as Social Practice of Data Dirt


    With the text-input trolling method in, we turn to images. Research teams developing
    new techniques at universities or businesses, and aiming to use large-scale image
    sets, rely on annotated data. To be safe if a ''self-learning'' neural network
    gets its outputs true or false, the results need to be compared with valid, tagged
    data. The tagging of the original data is basically done by humans, who make decisions
    how a certain piece of data is categorized. Is it an ''apple'' or a ''red bowl''?
    Is it both? Or is it a typo sign? The neural network is tweeted until it produces
    results that are close enough to what humans previously recognized when tagging
    the original data.


    This opens up opportunities to ''trouble the calculable '' by intentionally polluting
    images. Annotation training sets are derived from Flickr by using open-source
    images. Since the photographers proudly tagged the photos, the images could be
    assembled and used for massive libraries, such as Microsoft COCO and the already-mentioned
    ImageNet. The ''tag trolling method'' (a sub-method of the input trolling method)
    introduces a moment of resistance by actively attaching wrong labels. Rather than
    complete wrongness, the most effective technique uses slight, such as tagging
    ''apple'' as ''peach'', which cannot be automatically filtered. This would need,
    however, a large-scale approach, such through a bot that creates wrong annotations,
    and tools for large-scale tag trolling to be developed.


