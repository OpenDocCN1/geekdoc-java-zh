  md: '# ANALYSIS


    thus was the measured body be moved to action, in a quest to improve and compete
    with the others for a place in the sun.^42 Referencing The Limits of Neoliberalism
    by Will Davies, Beers borrows the conclusion that uncertainty and inequality are
    indeed desired outcomes of these tactics, for the more insecure we feel, the more
    feelings of entrepreneurial agency will in.^43 Within the context of neoliberal
    precarity, measuring us is, after, all, a quest for survival.


    Given this scenario, it is so far-fetched to the socio-political and economic
    consequences of contributing our sensitive information and personal feelings to
    Woebot, Pacifica, or Wysa? These tools designed to alleviate our woes may well
    be through the further enrichment between mental illness and the system accountable
    for its aggravation. This is so because such apps represent potential data sources
    feeding the profiling and coping systems that are intensifying our insecurities.


    # Tactics of Redirection


    There is no denying that these first-response apps may be of great value in alleviating
    buried psyches struggling with depression and anxiety, especially against back
    of impossibly long waiting lists and reduced access to specialized care. However,
    this type of solution can be no more than a short-term patch, extending mental
    therapy''s capacity of addressing the wider systemic context the user-surfer is
    placed in. Indeed, David Small''s account of ''retherapeutic impotence'' also
    apply here: after an initial positive response to therapy the patient repeats
    into old problems, as the realities of the outside world settle once again.^44
    By keeping us locked within our own realities and locating the root of our distress
    within ourselves, ''magical voluntism'' not only fails to provide a long-term
    solution to widespread anxiety and depression, further exacerbates the burden
    on the affected self. It does so (at least) two:


    +   1. by reproducing neoliberal narratives of self-responsibility (''The power
    is in your hands.'', ''Change your life.'', ''Success depends only on you.''),
    thus contributing an added layer of uncertainty, guilt and shame in the case of
    failure;

    2. in tech-based iteration, presenting the danger of contributing further data
    to the development of psychological profiles used to judge, govern, and exclude.


    As such, it becomes clear how mental health apps further complicate the already
    tumultuous and exploitative relationship between mental health and capital, making
    it necessary to engage in the (re)discovery of alternative communal methods of
    healing.


    The Mindful Occupation work group, with the goal to provide mental health support
    around the Occupy/Decolonize movement, frames radical mental health as an instrument
    in reducing the ''pathologizing gaze to a crazy-making world''; looking at mental
    health through a political and social justice lens, then an intersection struggle
    comparing many grassroots movements.^45


