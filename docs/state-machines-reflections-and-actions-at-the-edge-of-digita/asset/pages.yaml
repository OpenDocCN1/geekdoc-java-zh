  md: '# IMPROVISING BLOCKCHAINS


    # MAX DOVEY


    An overview and analysis of performance methods used to explore emerging, decentralized
    ledger technologies in the arts.^1$


    An unexpected response to the proliferation of blockchains is the use of performance,
    role play, and improvisation to simulate, imagine and experience different blockchain
    futures. This article sets out to catalogue various examples and applications
    of performance—namely Live Action Role Play (LARP) and improvisation—that offer
    creative and practical methods for individuals to understand, develop, and shape
    emerging blockchain applications as technologies for social governance.


    See 1, in the Gallery (p. 47).


    Distributed Ledger Technology (more commonly referred to as blockchains or DLT)
    promises to transform the structural organization of digital information by storing
    a synchronized, distributed database of time-stamped transactions on a network
    of computers. At primarily used the underlying cryptographic architecture to secure
    the cryptocurrency Bitcoin, the attributes of blockchains have received spread
    interest by multi-national and global businesses worldwide. This has led to millions
    of dollars being invested in developing and integrating blockchains into business
    organizations as many believe blockchains will play an integral role in shaping
    the future of information systems. The drive for blockchain technology to transform
    society more broadly can be observed in EU-funded initiatives such as ‘Blockchains
    for Social Good''^2$ or NGO-based research consortiums ''Blockchains and the Global
    South''^3$ Within these initiatives may seek to develop and deploy blockchain
    technology to administer and deliver technical solutions to many ‘real-world problems’
    (e.g. digital voting systems) or to refugees. Within these areas of research the
    prevailing attitude is that engineers and developers will be able to solve many
    of the world’s issues through blockchain-based applications. This attitude is
    illustrated in the dramatic video trailer for the ‘Block-


