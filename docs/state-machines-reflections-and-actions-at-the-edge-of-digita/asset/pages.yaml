  md: '# INTRODUCTION


    Two years later, we''re faced with the potential reality of having asked this
    question too late, and further ponder any of these “possible futures” are indeed
    probable within the current bio-geo-political mainstream. Much of the information
    we collected during our research indicates that the interconnected environmental,
    political, scientific, and technological events of recent years have not been
    uniformly embedded in public consciousness. Disturbingly, a unified perception
    of humanity is absent from contemporary hegemonic rights. With ethnically and
    racially charged violence on the rise, free speech is rapidly eradicated and censorship
    is no longer about suppression «but controlling your attention and your credibility»¹
    The diversionary, disruptive tactics of the derive¹² proposed by the Situation
    to help us see, question, and understand our world, and embraced by tactical media
    artists just over fifteen years ago, have now developed to hopelessly distract
    us from it. Just in case our world does not offer enough complexity to say it,
    we are augmenting it with manipulative digital visions and (mis)information through
    a plethora of news sources—many of which are either biased or just plain fake,
    interspersed with adverts for products we do not need, livestyles we can only
    dream of, and holiday packages we cannot afford.


    By inviting artists and theorists to focus on how these technologies and networks
    impact our lives, we look at what this means for our collective and individual
    identities, and our shifting notions of citizenship, digital labor, and finance.
    This publication re-examines the current techno-political mainstream and the unscrupulous
    array of technologies being developed, so as to maintain and reduce ‘users into
    potentially exploitable gifts and digital cash flows, or proprietary data sources
    on tap.


    Until recently, blissfully unaware EU citizens might have found themselves living
    in a border reality, but in actual fact many of the world’s border walls have
    been erected in the past two decades. Because the pompously propagated ‘Trump
    border wall’—which will, and have already, in anticipation of, devastating and
    very real consequences—many of so called ‘anti-illegal immigration’ are currently
    under construction across the world.¹³ But not all borders are physical, and not
    all are fixed as a concrete wall. Visible are the ideological, technological,
    and algorithmic walls and fences that immigrants ever more often face, which are
    as effective in barring physical access or denying basic permissions (Krystian
    Wojnicki). The other end of the freedom-movement spectrum is occupied by those
    who can afford citizenship-by-investment programs. And, all the seemingly unending
    endless hoops to jump through are created for those without the right documents.
    ‘For-sale’ passports simultaneously assist in the disappearance of all kinds of
    obstacles for those who are able to pay the high price (James Bridle). And not
    only is digital technology used to construct


