    # Learning from #Syllabus


    What have we learned from the #Syllabus phenomenon?


    The syllabus is the manifesto of the 21st century.


    Political struggles against structural discrimination, oppression, and violence
    in the present are continuing the legacy of critical pedagogies of earlier social
    movements that coupled the process of political subjectivation with that of collective
    education. By creating effective pedagogical tools, movements have brought educators
    and students into the fold of struggles. In the context of our new network environment,
    political struggles have produced a new media object: #Syllabus, a crowdsourced
    list of resources—historic and present—relevant to a case. By doing so, these
    struggles adapt, resist, and live in and among the networks dominated by techno-capital,
    with all of the difficulties and contradictions that this entails.


    What have we learned from the academic syllabus migrating online?


    In the contemporary university, critical pedagogy is clashing head-on with the
    digitization of higher education. Education that should empower and research that
    should emancipate are increasingly left in the cold due to the data-driven marketization
    of academia, short-cutting the goals of teaching and research to satisfy the fluctuating
    demands of labor market and financial security. Resistance against the capture
    of data, research workflows, and scholarship by means of digitization is a key
    struggle for the future of mass intellectuality beyond exclusions of class, disability,
    gender, and race.


    What have we learned from #Syllabus as a media object?


    As old formats transform into new media objects, the digital network defines the
    conditions in which these new media objects try to adjust, resist, and live. A
    right intuition can intervene and change the landscape—not necessarily for the
    good, particularly if the imperatives of capital accumulation and social control
    prevail. We need to re-appropriate the process of production and distribution
    of #Syllabus as a media object in its totality. We need to build tools to collectively
    control the workflows that are becoming the infrastructures on top of which we
    collaboratively produce knowledge that is vital for us to adjust, resist, and
    live. In order to successfully intervene in the world, every aspect of production
    and distribution of these new media objects becomes relevant. Every single aspect
    counts. The order of items in a list counts. The timestamp of every contributor
    to'
