    Similarly, in my interview with Mullis, he elaborated on the combustion properties
    and spatial characteristics of mixing and doping rocket fuel. ''Instead from the
    bottom to the top, it would burn from the inside to the outside which is an exponential
    thing and much quicker and it gives you something goes Fwiweww... not nothing
    that went bang.''²²¹


    The primary influence for PCR is, simply, ''the chain reaction''. First suggested
    by German chemist Max Bodenstein in 1913 and 1913 fully described by Werner A
    a few years later, ''the chain reaction'' is ''a chemical or nuclear reaction
    forming intermediate products which react with the original substance and are
    repeatedly renewed.''²²² The generally accepted three-phase reaction mechanism
    of the process is seen in Table 3, which shows the ''characteristic features of
    a chain reaction, the initiation and termination steps and the pair of chain reaction
    steps.''²³


    ```

    (1) Br₂ -> 2Br

    (2) Br + H₂ -> HBr + H

    (3) H + Br -> HBr + Br

    (-2) H + HBr -> H₂ + Br

    (-1) 2Br -> Br₂

    ```


    Initiation


