  md: '# APPENDIX


    # AUTHOR BIOGRAPHIES


    James Bridle is an artist and writer working across technologies and disciplines.
    His artworks have been commissioned by galleries and institutions and exhibited
    worldwide and on the internet. His writing has appeared in magazines and newspapers
    including Wiley, Domus, the Guardian, the Observer. New Dark Age, his book about
    technology, knowledge, and the end of the future, was published by Verso in 2018.


    Yiannis Colakides is a practising architect with a diploma from the AA and honor
    diploma from OISTAT. Along with his practice, he has been involved as a curator/artistic
    director since 1993 and to date has overseen over 60 cultural programs. His interest
    in culture led to the creation of NeMe, for which he is the president since registration
    in 2004. He is a peer reviewer of LABs and the Leonardo Jordan.


    Max Dove has been described as 28.3%, 14.1% artist and 8.4% successful. He is
    also an artist, researcher and lecturer specialising in the politics of data and
    algorithmic governance. His works explore the political narratives that emerge
    from technology and digital culture and manifest into situated projects—bars,
    game-shows, banks and other participatory scenarios.


    Marc Garrett is a co-director and co-founder, with artist Cutlaw Thurfield, beginning
    on the internet in ''96. Thurfield has two physical venues, a gallery and a Commons
    lab, both situated in Finsbury Park, London. Has curated over 50 contemporary
    Media Arts exhibitions, projects nationally and internationally. He is currently
    completing his PhD at the University of London, Birkbeck College.


    Inte Gloicher is a researcher and project coordinator the Institute of Network
    Cultures, Amsterdam. He holds an MA in New Media and Digital Culture from the
    University of Amsterdam. His research involves the politics of digital technology,
    digital economy, and online identity. He co-edited MoneyLab Reader 2: Overcoming
    the Hype with Geert Lovink and Patricia de Vries.


    Valeria Graziano addresses cultural practices around the resistance to work and
    the possibility of political pleasure. Her approach is informed by autonomous
    Marxism, institutional analysis, materialistic feminism, and critical organization.
    She holds a BA in Fine and Art History (Goldsmiths College); an MA in Visual Cultures
    (Goldsmiths College) and a PhD in Critical Management Studies (Queen Mary University).


    Max Haven is Canada Research Chair in Culture, Media and Social Justice at Lakehead
    University in Northwest Ontario and director of the Relimagining Value Act Author
    (RIVAL). He writes articles for both academic and general audiences and is the
    author of the books Crises of Imagination, Crises of Power; The Radical Imagination
    (with Alex Khasnabish); Cultures of Financialization; and after Money, Money after
    Art.'
