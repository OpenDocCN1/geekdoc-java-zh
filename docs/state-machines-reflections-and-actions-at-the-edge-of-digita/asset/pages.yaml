  md: '# ACTIONS


    In the groundbreaking book, Who Wrote the Book of Life?, Lily Kay describes the
    powerful influence of informatics and other Cold War imperatives on the field
    of biology. Beginning in the 1950s, varied forces began to influence and reorient
    biology, in particular the discovery of the basic structure of DNA and the development
    of Cold War sciences such as cryptography and information science. It was during
    this period that computational metaphors became fully integrated into biology.
    For instance, the metaphor of code became increasingly used when referring to
    sequences of nucleic acids in a strand of DNA. Kay describes the ascendance of
    the informatics metaphor: "Tthese discursive practices of informatics and language
    were neither external to researchers'' analysis merely exegetical. However, they
    constituted the very of the reasoning and modes of signification of researchers
    by producing predictive models, analytics and interpretive frameworks."115 As
    Key metaphors came to define the terms by which life should be investigated; they
    became neutralized. "While in the 1950s such as information and code in molecular
    biology sometimes appeared in quotation marks to acknowledge their metaphorical
    and heuristic dimensions, by the end of the code marks had disappeared."116


    In his book The Global Genome, theorist Eugene Thacker observes the deep influence
    of computation in the contemporary biotechnological sciences. Thacker says that
    "in a sense, bioinformatics takes the terminology, concepts, and metaphors of
    informatics at face value; it moves with great ease between the metaphor of DNA
    as information and its construction of online databases."117 The phrase ''DNA
    code'' is a powerful analogy convenient in an era defined by computation, and
    it is an ideal for a technology like PCR which engineers biological matter as
    easily as if it were computer data.


    While Kay and Thacker are scholars of science and technology rather than practising
    scientists, in the field, and it is easily confirmed and corroborated by biotech
    research scientists In the publication PCR Applications, edited by a team including
    Cetus head research scientist David Gelfand, a detailed chart of other computer
    and PCR analyses is provided. The chart lists several of the analytics I''ve previously
    suggested along others, as comparing a computer operating system with the buffer
    solution used in a PCR reaction to ensure proper reaction conditions.18


