    potential techno-social futures. During a workshop held by the Design Informatics
    department at Edinburgh University, itself) produced a fictional prototype for
    blockchain-based wedding contracts. A prototype of a mobile application was created
    and tested before making a video enacting the consequences or potential use cases
    of a smart contract that brought individuals'' digital currency wallets into a
    shared wallet where individuals were located in the same geographic area. The
    application was named Handfastr, thereby after the practice of handicrafting (a
    pagan ritual of enacting wedding-like commitments between individuals), commenting
    on the rise of Bitcoin marriages and of decentralized technology that operate
    outside of church or state authority. By means of deploying a prototype and enacting
    the consequences of a potential use case of an emerging technology, individuals
    gain experiential understanding of the social effect of techno-social systems,
    and based on this experience, offer potential alternatives to dominant claims
    made over the future use of such technologies.


    See Fig. 3 in the Gallery (p. 48).


    These examples are by no means, but demonstrate how performance methods are used
    in both cultural and academic sectors to disseminate blockchains and their implications
    for social governance. In the context of these emergent strategies, it is worth
    considering the reasoning for this unconventional and unlikely occurrence and
    evaluate its effectiveness. It is clear that the clarity surrounding blockchain
    has captured the minds and imaginations of cultural practitioners and, in response,
    artists have been investigating the technology. When imagining the implications
    of blockchain applications as DAOs or smart contracts, it is difficult to gauge
    how these configurations for social structures and organizations play out in ''real-world''
    contexts. This is why LARP, gameplay, and improvised mediums are effective mediums
    to simulate ''real-world'' scenarios, as Kei Kreutler phrases, it provides an
    opportunity to ''rehearse relations''¹ that could form around new blockchain-based
    models of social organization. Because blockchain development is undergoing ''a
    social turn'', it is of vital importance for the impacts of these technologies
    to be tested through what we can describe as critical ''dry runs''. It should
    be noted that the practice of simulation is also an embedded feature in the architecture
    of blockchain-based system design. The blockchain platform Ethereum, for example,
    has a ''test-net'' for developers to ensure their code is deployed correctly and
    functions properly before launching it onto the main Ethereum blockchain. Similarly,
    LARP offers a simulation test-bed for emulating the social relations potentially
    created by the wide spread of blockchains as a social governance technology.


    See Fig. 4 in the Gallery (p. 48).


