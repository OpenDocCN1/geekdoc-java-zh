  md: 'every version of the list counts. Furthermore, the workflow to keep track of
    all of these aspects is another complex media object—a software tool of its own—with
    its own order and its versions. is a recursive process of creating an autonomous
    ecology.


    #Syllabus can be conceived as a recursive process of versioning lists, pointing
    to textual, audiovisual, or other resources. With all of the linked resources
    publicly accessible to all; all of the versions editable by all; all edits attributable
    to their contributors; with all versions, linked resources, all attributions preservable
    by all, just such an autonomous ecology can be made for #Syllabus. In fact, Dean
    Roy, Benjamin Forster, and Public Office have already proposed such a methodology
    in their Hyperreadings, a forkable readme plaintext document on Github. They write:


    A text that by its nature pertains to others, the syllabus is a relational document
    acknowledging its own position within a living field of knowledge. It is decidedly
    not self-contained, although it often circulates as if it were.


    If a syllabus circulated as a HyperReadings document, then it could point directly
    to the text and other matter it aggregates. But just as it circulates, a HyperReadings
    syllabus could be forked into new versions: the syllabus is changed because there
    is a new essay, or because of a political disagreement, or because following the
    syllabus produced new suggestions. These forks become a family tree where one
    can branch and trace epistemological mutations.30


    It is in line with this vision, which we share with the HyperReadings crew, and
    in line that we operate, as amateur librarians, activists, and educators, make
    our priority beyond the limits of this.


    The workflow we are bootstrapping here will keep in mind every aspect of the object
    syllabus (order, timestamp, contributor, version changes), allowing diversity
    via forking and branching, and making sure that every reference listed in a syllabus
    will find its reference in a catalog which will lead to the actual material, in
