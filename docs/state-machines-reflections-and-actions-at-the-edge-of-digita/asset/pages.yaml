  md: '# Blog Post: ''Dogs Are Not Fungible''


    Doxe, my dog, has stopped working. I''m sad and I don''t know what to do. He was
    a tokenized third generation consumerized robot running an active neural net.
    I can''t replace his components or upgrade his firmware without the token security
    key—and I don''t have the security key. Pulling the TTP chip that enforces the
    key off my hardware will fry his system.


    I know what you''re thinking—''why didn''t you back up your key?'' Other reader
    I know, but the key was not mine to back up. I have a safety deposit full of keys.
    They are titanium, ceramic, leather-and-steel, glass, knotted fabric. I''ve spent
    hours with dreamels, ballpoint pens, needles and lasers sure that if a key is
    lost on my watch it''s not for want of trying. I''m particularly proud of the
    leather-and-steel ones, they''re the originals of the larger and more decorative
    versions you may have seen in ''Through The Key'' at MoMA.


    But to back a key you must control that key, and I did not. Yes reader, I know.
    I was young and wanted a dog but if I was afraid of losing one day, so a robot
    dog seemed like a good substitute if I could find a way of paying for it gradually,
    I wasn''t thinking about the consequences of having but not really owning Doxe.


    I kept up payments on Doxe''s until the company that sold him to folded. No other
    company picked up the service contract for the dog tokens, there were no new updates
    for their software and you couldn''t update hardware. I knew Doxe and I were on
    borrowed time. But that didn''t make the inevitable any easier to bear when it
    happened.


    I guess it could have been worse. The hacked dog attacks you may have heard about
    before were the same model as Doxe. I wasn''t worried about those because I''m
    not rich or famous so who would want to weaponize my pet? But I guess in a way
    that''s what happened, emotionally at least. Yes I''m dramatic. That''s how it
    feels.


    But that''s not the end. Hopefully. Not yet. I''ve got together with some of the
    other hodlers of tokens for Doxe and his buddies with DCTRL and we''re working
    on a new smart contract to take control of the abandoned contract (we tried to
    buy it out but that didn''t work). We''ll be ready to deploy the test contract
    soon. If you''re a code or law hacker and can help, get in touch!'
