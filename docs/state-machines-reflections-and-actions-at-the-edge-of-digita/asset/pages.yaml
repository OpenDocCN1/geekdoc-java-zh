    gene drive works by replacing a gene in one organism in a manner which makes it
    more likely to pass on to subsequent generations through simple Mendelian inheritance—thus
    to effectively alter an entire population within a few generations. While a discussion
    of sexual reproduction (for instance, by a genetic counselor) might employ a metaphor
    of the dice to explain the possibilities of inherited disease, the gene drive
    essentially loads passed on. Gene drives have been proposed to provide an effective
    means of genetically modifying entire species of animals, and most convincingly,
    but not limited to, disease-carrying insects such as mosquitoes and ticks.⁴⁰ The
    modifications proposed do not directly address the disease agent, bacteria, or
    virus carried by these insects (because they reproduce through non-sexual means),
    but they typically call for modification of the insect''s DNA so to make the organisms
    unable to produce a required trait or to reproduce at all and thus die out. The
    impact of such a drive on a targeted insect would be exponential, with the possibility
    of removing it from the environment in a few years. It would stand to reason,
    that the impact upon the food chain would be exponential.


