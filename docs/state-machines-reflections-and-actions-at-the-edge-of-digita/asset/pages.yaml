    Adam Heidenberg has demanded that the syllabus be re-conceived as a manifesto20—a
    document making these concerns explicit. And indeed, many academies have started
    to experiment with the form and purpose of the syllabus, opening it up to a process
    of co-conceptualization with students, proposing ‘the other syllabus21 to disrupt
    asymmetries.


    At the same times, universities are surprisingly moving their syllabus online.
    A migration that can be read as indicative of three structural shifts in academia.


    First, the push to make syllabus available online, in the US, reinforces the differential
    effects of reproduction economy. It is the Ivy League universities and their professorial
    system that carry the syllabus to advertise the originality of their scholarship,
    while the underfunded public universities and junior academies are burdened with
    teaching research. This is practiced in academia of the different valuation between
    what is considered to be the labor of production (research) and that of social
    reproduction (teaching). The low esteem (and corresponding lower rewards and remuneration)
    for the kinds of intellectual labors that can be considered labors of care—editing
    journals, reviewing papers or marking, for instance—fits perfectly well the neglected
    legacies of the academic institution.


