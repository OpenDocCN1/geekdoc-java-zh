    their own images of Europe; or someone who, in the course of this, is simultaneously
    destabilizing and contesting the colonial narrative.


    Additional aspects of liberation and emancipation emerge if one adopts an anarchist
    perspective. Consider this: if migrants move in a realm of rightlessness, they
    are in a realm which is outside relation and contract that the state has set up
    for its people—a relation and contract that are not satisfying and in various
    ways not acceptable. By moving in this realm, migrants are not only respecting
    the state framework, but they are also potentially destabilizing the state''s
    complicity with capitalism—that is, as philosopher Marcia Cavalcante puts it ‘a
    movement’ that keeps everything in order to keep this movement [at the macro level]
    unmoved, that unchanged.’ In that sense, their precarious and vulnerable motions
    potentially ‘move the movement’, as one put with Cavalcante.⁴


    In so doings, migrants are potentially extending the notion of political agency.
    And migration, especially in its illegalized form, can then be seen as a social
    movement. Despite—or perhaps to a certain degree because of—their extreme vulnerability
    and precariousness, migrants are capable of revitalizing politics and refining
    the space of democracy in unexpected ways.


    Should''t the most recent movements, which fly in the face of the regular function
    of state borders, be taken as the opposition to the principles of political and
    economic participation on new, revolutionary grounds? If illegalized movements
    actually expand the space of democracy? What if one were to pose today''s urgent
    social questions from the perspectives of migrants? Might their experiments, experiences,
    and expertise be the laboratory for alternative futures?


    # Expulsions and Social Sorting


    Before searching for answers, let us try to better understand the logic of state
    borders and the entanglements between politics and technology. Mediated by images
    and stories that are perpetuated by mass media, the news of artificial intelligence
    and so big data technologies are deeply situated in the collective imagination.
    But, what remain hidden too often is that those technologies are gaining momentum
    at a moment when states and orders are fostering to an intensified degree what
    social theory Saskia Sassen identifies as ‘expulsion.’⁵ the cybernetic protocols
    of big data technologies and artificial intelligence interlaced with the mechanisms
    of state borders? And, if so, how does this interplay within the logic of expulsion,
    and what are the consequences for movement in general?


    Today, crisis-plagued states like Greece show that processes of expulsion are
    part of a systematic refinement of a country''s economy. Only certain people and
    enterprises are intended to enjoy the fruits of stimulus and growth, solely coveted
    profitable. The


