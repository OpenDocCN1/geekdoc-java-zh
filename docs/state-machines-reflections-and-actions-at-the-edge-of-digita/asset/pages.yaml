    rary economics. In this process, the mechanical, boxed, linear infrastructure
    and the urban grid of algorithmic trading are imagined as mutually constituted
    by a re-pasto-ralized landscape, which includes a transformative encounter with
    a force of nature. To conceive of algorithmic trading by associating it with the
    force of the specter, with an eerie and prodigious space that is, save for a few
    maintenance work-ers, human presence, and to tie it to a flood is to consolidate
    and recombine what is usually considered categorically distinct. Algebraic trading
    is imagined here internally to and mutually constituted by financial and natural
    history, economy, and theology, and exists between the probable and the possible.
    Instead of swapping dualism for another, instead of furnishing algorithmic trading
    with all-capturing powers relation, Alaric connects the propensity, entropic,
    error-prone matter of algo-rthmic trading technologies with the constant manual
    labor and maintenance work it necessitates, and adds to this Marxist revolutionary
    trope and biblical imagery of sin, punishment, and new beginnings.


    Many phenomena come together *Fragments on Machines* to create an assemblage,
    and what is more, an open system. The constant maintenance work cannot prevent
    trading catastrophes, *Fragments on Machines* seems to, as the black box of finance
    is not a closed system. This maintenance works on all levels, from the tweaking
    of algorithms by programmers, to the work done by cables, the interventions by
    central banks and governments, none of whom are able to predict the future or
    transcendent time and space. Given constitutional significance to metaphor symbols
    charged with meaning invalidates and provides al-gorith trading with many ties
    to the world. Algorithmic trading is imagined as a synthesis of necessity and
    possibility, the infinite and the finite. Similar to water, a recurring visual
    trip in film, the algorithmic trading runs in every direction, everything it comes
    across, and is affected by what it encounters on its course, but not in equal
    measure.³32


    *Fragments on Machines* suggests that illuminating the conceived obscurity, immateri-ized,
    or integrability of the black box of finance would not give way to democracy,
    less, or manageable financial markets. Rather, it imagines the black box of finance
    as a far larger, unstable, and ambiguous connection that connects the hardware
    and software of algorithmic trading to the environment, to sensibility, to unruliness,
    and to seemingly invisible movers—from the dock palaces of yesterday to an extreme
    weather event, and clogged air strainers to a new testament. By drawing correlations
    between trading software and hardware and the divine, conventional assumptions
    about uncontrollability and the invisibility of algorithmic trading are put in
    doubt.


    Catastrophe bonds and algorithmic trading are products of a culture of risk. And,
    climate-change and financial crises have to do with bad management. Catastrophe-derivatives,
    algorithmic trading, and all risk flourish when governments, policymakers, and
