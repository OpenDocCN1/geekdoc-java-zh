    # Systemic Interest


    To understand more about the interests of the worker system in promoting ‘magical
    voluntism’, we should turn to Nicholas Rose’s Governing the Soul: The Shaping
    of the Private Self for a detailed account of the preoccupation with our inner
    psychological life for the functions of management and governance.


    Rose’s account starts with Taylor, a theory developed from the 1880s onwards Frederick
    Windsor Taylor. Also known as the ‘scientific management of labour’, Taylor consisted
    of an array of techniques for disciplining workers’ bodies into becoming productive
    machines. Motion studies, calculation, and metrics would produce the knowledge
    necessary to inform the training of workers and the rational allocation of human
    resources. Rose understands this process as the first of many attempts to provide
    management with rational legitimacy.


    But this reductive vision of the worker would not last forever. Rose maps the
    developments which allowed for these theories, if not to subside, to evolve. When
    World I struck and demands the worker-machine model had limitations and employees
