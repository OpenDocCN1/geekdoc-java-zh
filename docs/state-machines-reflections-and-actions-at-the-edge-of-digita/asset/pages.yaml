  md: '# STATE MACHINES


    models, including specifically things like gender dynamics, unfair treatment based
    on race and nationality, and patient-doctor hierarchies. This group opened a workers''
    clinic inside an occupied factory called vio.me¹⁴ as a place to offer an experimental,
    ''healed'' version of free medicine.


    When new patients come to the clinic for their initial visit, they would meet
    for 90 minutes with a team: a medical doctor, a psychotherapist, and a social
    worker. They''d ask questions like: Who is your mother? What do you eat? Where
    do you work? Can you afford your rent? Where are the financial hardships in your
    family?


    The team wouldd get a very broad and complex picture of this person, and building
    on the initial interview they would work with that person to make a one-year plan
    for how they could be supported to access and care of the things they need to
    be healthy. I imagine a conversation: ''Your job is making you really anxious.
    What can we do to help you with that? We''ll sneak you in. You are lonely. Would
    you like to be in a social movement?'' It was about making a plan that was truly
    holistic and based the relationship between health, community, and struggles to
    transform society and the economy from the bottom up. And, when I heard it, I
    was like, ''Obviously!''


    So the Hologram project is an attempt by me and my collaborators in the U.S. and
    abroad to tap inspiration from this model and create a kind of virtual network
    of nonexperts who organize into this trio/triage teams to help care for one another
    in a complex way. The name comes from a conversation I had with Frosrou Moreli,
    one of the members of the Group for a Different Medicine, who explained that they
    wanted to move away from seeing a person just a ''patient'', a body, or a number,
    and instead see them as a complex, three-dimensional social being, to create a
    kind of hologram of.


    MG: Could you explain how the virtual holographic care system works?


    CT: Based on the diagram above, we can see that there are three people attending
    to one, and each person represents a different quality of concern. In this new
    model, these three people are not experts or authorities, but people willing to
    attend and to co-research, as a scribe, or a living record for the person in the
    center, the ''Hologram''. We call these three attendees ''Patience''. Our aim
    is to translate the Workers'' clinic project to a peer-to-peer project where the
    Hologram receives attention, curiosity, and long-term commitment from the Patience
    looking after him/her, who are not professionals. Another project using this technology
    is called the Accountability Model, by the anonymous collective Power Makes Sick¹⁵.


