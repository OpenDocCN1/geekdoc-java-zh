  md: 'The streets of New York''s Financial District are almost empty, with just a
    few people in sight. The voice-over continues:


    The spread of intelligence across Europe can be mapped, like an incurable epidemic
    of knowledge. In the place of public readings, came reading in silence. The secrets
    of what never happened, in the end, cannot be burned, multiply and imprint in
    every corner... I live through the structures that have been planned by architects,
    designed by vibration, washed through information... I stood before the source,
    an empty tomb. To be closer to the source is all I need. The trucks could roll
    from their moment, even with the brakes on. Their housings are docklace palaces.
    Treasure would travel hundreds of miles over days... A new king lives here...


    A series of shifts before markers, mangrove covers, street-level signs of underground
    utility ducts, and an industrial ventilation system indicates that we are milling
    around the financial markets, located within the edges of the depicted institutions
    and corporations.


    The video''s next chapter, titled ''Servers'', takes the viewer beyond the facade
    of an edifice in the Financial District and into the building''s empty hallways
    ''the new king'' allegedly resides. The sepia-colored, dim lit architecture of
    the building''s foyer contrasts sharply with the bright white, tungsten-lit server
    room that the cameras enter. The cut between the outside and that of the server
    room hints at the film moving from the outside to the inside of the box of finance.
    Inside, beside the walls of the lavish but decaying Art Deco architecture, we
    find what looks like a data center. A door opens, and then another, and another.
    The room entered is filled to the brim with mainframe computers and server racks.


    The new king of Wall Street is personified by an acousm (first-person, disembodied-voice),
    and a semblance of embodiment through a series of shots of the infrastructure
    of algorithmic trading. Numerous Art Deco buildings in the Financial District
    now house post-industrial financial capitalism''s new king. Data centers are dotted
    around the Financial District, and their physical location is important. The closer
    a high-frequency trading company, brokerage, or bank is to the servers (that is,
    the closer it is to the source), the faster its algorithms can respond. What appears
    to exist in an ether, as an immaterial, invisible, omnipresent structure, is represented
    as connected, strap-attached to, and kept on leash


    The dialectic relation between the words of the narrator and the images in Fragments
    on Machines associates the computational infrastructure of the financial markets
    with an ''incurable epidemic of knowledge'' to ''trucks rolling with brakes on''.
    The narrator metaphorically connects the imagery of an epidemic and moving trucks
    suggests prevalence, development, spread, movement, and inevitability with regards
    to the new forms of productivity that have come—the algorithmic automatization
    of the financial markets. At the same time, the cause of this seemingly inevitable
    development could also be taken as a primary mover, or even to a force of nature,
    or the preternatural.'
