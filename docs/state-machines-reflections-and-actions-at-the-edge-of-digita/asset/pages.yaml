  md: 'Migrants are codified and tracked every step of the way, regardless of the
    outcome of their situation. Whether or not they reach their destination, have
    to wait for a short while or indefinitely, are given recognized status, allowed
    to proceed, or are sent back, their movements are documented. They are scanned,
    coded, interpreted, funneled, and constrained by opaque, data-driven technologies
    that comprise part of the state border''s infrastructure, whose very existence
    is reliant on the demand for the border in the first place.


    The nodes of this data infrastructure, which is seldom viewed in the context of
    moving state borders, are made up of smartphones, social network accounts, service
    providers, fiber-optic cables, one-stop shops, data centers, and databases. Whether
    data packets reach their destination quickly, slowly or not at all, whether they
    are ignored or inspected, whether they are collected and analyzed or unnoticed,
    whether they are stored for a short or long time, passed or prioritized by recommendation
    algorithms—all these decisions are made in the dark by unaccountable corporate
    and state powers.


    This hermetic blackbox dimension of data infrastructure crucially informs the
    nature of state borders and shapes movements, regulates communications, and transforms
    social relationships around the logics of governmental power. As and more people
    inhabit the internet, including precarious or marginalized people as smartphone-equipped
    migrants, and as this subsequently means that the internet is becoming vital for
    any social relationship to exist today, governmental power is becoming increasingly
    all-encompassing, the more it remains blackboxed and largely uncontested as such.


    # Social Motion gets AI


    Since Snowden''s whistleblowing efforts, the promise and the threat of technology
    for democracies have become clearer than ever. Yet do social actors better understand
    why the nexus of geolocation and mobility is of increasing importance? To answer
    this, let us look at the software that an increasing number of people are using,
    including illegal migrants.


    Beyond the hegemony of Google Maps, Google Chrome has become one of the most popular
    browsers in the world, pre-installed on devices with the Android operating system.
    It comes with a pre-installed function—Google Translate—that translates every
    website from its original language to that designated or assumed to be native
    to its user. I first experienced this when our website was automatically translated
    to Japanese, based on the user''s past browsing behavior.


    This automatic translation is an unwanted service. It can be deactivated, but
    many people simply accept it, thereby rendering to a service that blocks languages.
    This service is based on an artificial intelligence that extends its capacities
    to a large degree by its use: the more people use Google Translate, the ''smarter''
    the service becomes. Or at least''s the idea. In its present state, the service
    delivers a word-for-word translation, lacking any sense of the intended meaning
    and with little understanding of the specific architecture of a language, and
    so produces confusing and even comical renderings.'
