    Old Land. There, the technological stands stands in the place of colonial violence,
    refiguring the atrocity of dispossession as a story of wondrous contact between
    the colonized (Palestinians) and the modern machine with its transformative powers.
    It is precisely this proxy logic that functions within the narrative of start-up
    nation, a narrative that marks the endurance of the colonial ideology techno-modernity
    in digital age. The analytic focus on glitch, then aims to bring this enduring
    historical fantasy to crisis.


