    that, while we label some places ‘in crisis’, the same crisis exists elsewhere,
    ultimately animated and manipulated by the same financial oligarchs.¹³ The hedge
    funds profit off the bankruptcy in Puerto Rico flipping houses in Auckland and
    profiting off the debt in Greece. We are all part of the same global economic
    system. The ‘crisis’ in Greece is also the ‘crisis’ in Auckland and in London.
    For this reason, I have been interested in what we can learn from activists, organizers,
