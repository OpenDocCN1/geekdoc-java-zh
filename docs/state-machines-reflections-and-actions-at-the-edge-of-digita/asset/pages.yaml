    describe some performative methods used to collectively explore the implications
    of blockchain technology and DLT''s ''Speculative enactments'' is the term used
    to describe the act of performing the conditions and consequences caused by potential
    configurations of emerging techno-social constructions. Fictional scenarios, gameplay,
