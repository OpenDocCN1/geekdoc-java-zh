  md: '# ANALYSES


    In reality, most operations of state borders suspend people somewhere in between,
    rendering them both included and excluded simultaneously. Mass monitoring is one
    example. Another is the mass illegal of migrants who have also become an integral
    part of national economies, composing a hyper-flexible and exploitable labor force
    that contemporary markets desperately require. In this, Entrechtung becomes instrumental
    in the flourishing of corporate and political power, as well as in the management
    of movement. Meanwhile, Louise Amoore notes, that ''the state border becomes a
    condition of being that is always in the act of becoming, it is never entirely
    closed, but appears instead as a constant demand for proof of status and legitimacy.¹
    state border appears as a constant demand for proof of one''s value to the economy.


    # Can Migration Expand the Space of Democracy?


    To paraphrase William Gibson, one of the figures of the cyberpunk genre: You move
    with your body, but you leave your soul behind. That''s jetlag.³ You move, cross
    state borders, offline or online, consciously or unconsciously, you leave your
    rights behind. This is the jetlag of today''s citizens. The whereabouts of this
    ''behind'' is unclear. It could be the mythical past, for instance the birth of
    civil and human rights during the French Revolution. But, it could also be the
    speculative future, something the promise of global citizenship, redefining the
    state as a node in a global web of interdependencies and interconnections, as
    well as the development of transnational institutions for democracy on a planetary
    scale.


    Now, let us consider the migrants waiting at the LaGeSo, waiting at a state border
    in the middle of a capital to be registered, to be acknowledged. It may be difficult
    to see this as anything other than loss and deprivation. It may be to see these
    migrants as anything other than victims. It is difficult to see their circumstances
    as anything other than a prolongation of colonial history. At first glance, these
    are people who appear to have had their dreams hacked. Having come to Europe on
    the search for a place that is worth living and which is livable, they seem to
    be reproducing the colonial narrative of Europe as the desirable ideal.


    But perhaps there is also—or instead—a dimension of liberation. Perhaps they could
    be seen as reverse-engineering this colonial hack of imagination. This rather
    counterintuitive idea becomes tangible when considering the following: The migrants
    waiting at the state border that activated at LaGeSo have already entered state
    territory and are already claiming an active role in Germany—making friends, by
    picking up work that needs to be done, by learning their first words in German,
    and contributing data and profiles with every movement they make. The latter is
    not labor in the formal, classical sense, but it generates monetizable information
    nonetheless.


    In this sense, the jetlag of citizens cannot be reduced to a delirium of loss
    and deprivation. It can also be seen as a delirium of someone yet to acquire their
    desired status and continuing to move relentlessly across state borders and claim
    rights; of someone


    ² Louise Amoore, ''Biometric Borders: Governing Mobilities in the War on Terror'',
    Political Geography 25.3 (March, 2006): 336–351.


    ³ William Gibson, Pattern Recognition, New York: G. P. Putnam''s Sons, 2003, p.
    9.'
