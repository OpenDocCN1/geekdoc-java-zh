    # Table 3: Hydrogen-Bromine chain reaction.


    The analogies to PCR around, particularly in the way in the Bromine molecule (Br₂)
    is split into two separate atoms in the initiation phase of the reaction in Figure
    3. This is analogous to the way in which double-stranded DNA is likewise cleaved
    into two separate strands in PCR. Also, in both reactions, initiation must be
    a thermal process to dissociate the atoms or strands. Other examples of the principle
    of a chain reaction include avalanches, contagions, and nuclear explosions.


    Decades after the first chain reaction was described, by the time of the Cold
    War, the atomic bomb became an iconic paradigm of the exponential power of a chain
    reaction. It''s awesome, deadly blossoming, the basis of the ''atomic sublime''.²⁴
    To understand the invention of PCR it is necessary to leave behind the metaphors
    of informatics and accept those principles, influences, and metaphors of the Cold
    War more broadly, and most importantly, the bomb itself. When Mullis is inventing
    his model rockets, it is in the context of the space and the Russian launch of
    Sputnik as a symbol of Soviet capability to build nuclear reactions that budding
    young scientists to chemistry. Chemistry tests and experimentation were patriotic.
    The nuclear bomb had transformed the concept of the chain reaction from esoteric,
    advanced chemistry into a cultural trope. Nuclear fusion chain reactions involving
    uranium and plutonium were described in public high schools and a staple of the
    cultural imagination.


