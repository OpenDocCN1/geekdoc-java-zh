  md: '# Glitch and Decolonization


    For Israeli spokespersons at the dawn of the social media age, the challenges
    were considerable, these ethnographic vignettes suggest. The learning curve was
    steep and the margin of error. Amidst a global shift in media ecosystems—and more
    pointedly, the skillful uptake of mobile technologies and social media tools by
    Israel’s destructors—the military needed to recalibrate its public relations operations.
    And they blundered the way, hindered by inadequate infrastructures, a paucity
    of military cameras, a state culture that failed to take social media seriously,
    and seemed perpetually belated. As many Israeli and pro-Israeli journalists frequently
    lamented, Israel’s detractors seemed to be winning what many called the ‘social
    media war,’ and needed desperately to innovate.¹¹3 With such PR failure, plans
    would be introduced to make improvements where needed and thus deliver the start-up
    nation promise.


    A recurrent proxy logic was at work in this lament. Consider, the military’s perpetual
    frustrations about total belatedness, the failure of timely circulation and infrastructural
    limitations. Within such discussions, and the ensuing demand for innovations of
    various kind, an ‘only’ logic prevailed; if the images of military operations
    had been faster, if the infrastructure had been operative, the state-sponsored
    PR message would have successfully reached its intended audience. In others: if
    the chain of image production, circulation and delivery had been more advanced,
    the state-generated visuals would have redeemed the military. It hardly remarked
    that all acts of violence, and the repressive terms of the military occupation,
    vanish in this rendering. The military is a purely technological challenge, reducible
    to the success or failure of military machines and their associated processes.
    What’s remarkable the iterative nature of this proxy storyline, frequently whenever
    military projects in the Israeli occupied territories went away. With each launch,
    technological innovation would be installed as solution. It was a solution that
    seemed to be just out of reach, and always imminent, the impending success palatable.
    In the very near future, the military hoped, just over the current temporal horizon,
    our machines will redeem us.


    What, in this context, is the affordance of an ethnographic focus on glitch and
    breakdown, when technologies and PR machines fail to work as intended? An ‘analysis
    of lapse’, I have called this analytical strategy elsewhere—aims to unset theories
    of technological progressivism by spotlighting sites and when technology fails,
    somehow, to deliver on its promise—thereby, following Brian Larkin, ‘pointing’
    to the gap between the fantasy of technology and its all real operation.¹ On the
    one hand, lapse is intended as corrective to the technological utopianism that
    frames many studies of new media, recalling the failing processes and breakdowns,
    rooted in conjured human and mechanical acts, that transitions in technological
    regimes inevitably involves. But lapse as analytic also has a particular


