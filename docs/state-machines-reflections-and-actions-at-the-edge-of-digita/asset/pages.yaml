  md: '# ANALYSES


    This tendency goes in hand with the expansion of social and economic power, as
    well as the expulsion of people dispossessed of their social, economic, and political
    status. Illegalized migrants and asylum seekers are brutally subjected to this
    logic, which echoes local values and practices of bordering. At the same time,
    they are potentially undermining this logic, even if only showing up official
    narratives—such as nationalism—rule them out aggressively as they. It is high
    to scrutinize this dynamic, because awards are not a symptom of the state''s inability
    to cope with transnational and potentially global movements?


    Since the dawn of the ostensibly borderless period initiated by the Berlin Wall
    in 1989, it has become increasingly difficult to evaluate the power of the state,
    or to grasp the role and function of walls. In any case, one should be critical
    of the notion that ours is a borderless age—or in fact that one ever. Was there
    really free movement of people, data, capitals, and goods before the agendas of
    people like Trump and Obama upon our screens? Before the Brexit vote? Before the
    EU-Turkey ''refugee deal?'' It would be ignorant to imagine that there were no
    borders before the recent renaissance of walls. No, question on the table is rather:
    how has the state evolved and expanded in power in the post-1989 era in spite
    of romanticized—or demonized—borderless? Articulating this question also means
    asking: What kind of state borders are besides walls, fences, and like?


    To begin with, we need to expand the notion of state borders beyond the massive
    and visible installations that illustrate the state''s boundaries and generate
    ''ugly images'' when migrants run against them, sometimes fatally. Although such
    scenes are serious, let us not get too distracted, but instead look at all the
    different fields and contexts of movement, because it is here the state feels
    obliged to seek control and worries about not having enough. Let us attend to
    the spaces where people, capitals, goods, and data are moving, and where—in contemporary
    fashion—the strengthening of state borders, both material and immaterial, are
    being set in motion.


    That is, let us at the infrastructure of globalization, because this is what enables,
    catalyzes, directs, and redirects movement.


    Framed in this way, we can enhance the mechanisms of state borders being set into
    motion over the entire infrastructure of globalization, expanding around the world
    and transforming daily life. This means that, unlike with physical walls and fences,
    new articulations of state power can potentially be found wherever the state chooses
    to define itself as well as wherever the state seizes opportunities to refine
    or expand its control, e.g. wherever processes of bordering produce or reproduce
    social divisions.


    Often subtle or invisible, the mechanisms of state borders can be triggered in
    the cloud, to which smartphones are connected, or in the database of a social
    network. They can be set in motion by a satellite orbiting the earth or in the
    middle of a city, as in the makeshift security architecture of an overcrowded
    registration office for new arrivals, or at an employment office, or at an airport.
    State borders can be activated in a foreign country, e.g. in an embassy, in a
    data center, in fiber-optic cables, in a secret prison, or on a military ship
    through allied territories.'
