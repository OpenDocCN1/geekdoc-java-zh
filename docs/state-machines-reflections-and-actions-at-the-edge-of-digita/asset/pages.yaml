  md: 'Financial District caused the New York Stock Exchange to close for the first
    time in almost three decades and tellingly, algorithmic trading was closed for
    two full days. A flood seems to be an equalizer, devastating all that it comes
    to and making everything an unrecognizable pool of muddy water. Human-induced
    climate change and the volatility and vulnerability of the financial markets are
    partly the result of flawed and inert government policies, both tend to hit the
    vulnerable hardest and both impacted by short-term thinking. The excesses of algorithmic
    trading and climate change are a product of both growth and individual choices–
    from carbon emission rates, to fossil fuel laws, to the financial modelling of
    mortgage foreclosures, to our food choices, how we travel, and our use of natural
    resources– and both have incentive to take advantage of short-term benefits, while
    ignoring or downplaying the great risks further down the line.


    The flood also needs to another recent development in the financial markets. Floods,
    tsunamis, hurricanes, pandemics, and earthquakes in Japan, Mexico, Puerto Rico,
    Chile or Colombia, Florida-named and Texas-named storms, European headwinds, Californian
    wildfires, and other natural catastrophes have become a financial product, a speculative
    objective. Financial markets quantify and price natural disasters in so-called
    ‘catastrophe bonds’–that is to say, probable future natural catastrophes at a
    specific time and location have become a financial instrument. In the case of
    one of these speculative catastrophic events really occur, the catastrophe will
    not merely affect those involved, but it will also entail profits or losses for
    the investors of such catastrophe bond.


    In Turbulent Worlds, Melinda Cooper explains, ‘While weather-related risk had
    once been connected through indirect means, such as property insurance, the contingencies
    of the weather now be directly hedged and traded in the capital markets. The curious
    effect is that climate change–the critical or singular events it may engender–become
    a speculative opportunity like any other in a market hungry for critical events
    turn disruptive events where a great deal of uncertainty and risk are involved
    into financial opportunities for investors–in other words, environmental derivatives.
    The result has been financial instruments designed to price and trade both in
    the uncertainties of the weather and our own uncertainties about the future of
    climate change.³³¹’


    Ambiguous and quasi-religious metaphors recur in Fragments on Machines. In addition
    to a flood, algorithmic trading is associated with an eerie, urban landscape,
    connected to a hybrid, conscious, ghost-like, and possibly prodigious figure,
    and seems to preserve the coming of a catastrophic force. Each of these metaphors
    elude clear theorizations, and that seems to be the point. Fragments on Machines
    reveals it imagines an imaginary of algorithmic trading as a phenomenon as ambiguous
    as specters, hybrids, and floods.


    What does Fragments on Machines reveal when it imagines trading algorithms this
    way? It hints to factors of influence outside the brightly lit, squarely bounded,
    and straight-line passage of the black box of finance, that nonetheless affect
    contemporary


