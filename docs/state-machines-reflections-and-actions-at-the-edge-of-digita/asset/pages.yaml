    STATE MACHINES


    Many of these cultural articulations are explored in the book Artists:Re:Thinking
    the blockchain,¹⁰ features a collection of essays, artworks, and fictional texts
    that respond to blockchains and their potential integration and application as
    a technology of social governance. The work of cultural practitioners (artists,
    hackers, theorists, and designers) responds to the proposition of blockchain governance
    through a variety of methods, addressing concerns, critiques, and general alternative
    visions of society in response to blockchain technology as an emerging system
    for social governance. In tandem with the publication of Artists:Re:Thinking the
    Blockchain, one initiated a series of workshops in collaboration with Ben Vickers
    (chief officer at Serpentine Galleries), focusing on exploring blockathons—co-founder
    of Furtherfield Gallery—from the position of the arts. ‘Decentralized Autonomous
    Organization With Others’ (DAO) is a series of multi-event events that uses performance
    methods, such as Action Role Play (LARP), scenario-based improvisation, and workshop
    simulations, to collectively play out speculative futures inspired by blockchain.
    Each workshop explores a speculative concept surrounding blockchain. Participating
    in the workshops often felt uncannily similar to the aforementioned Blockchain
    hathons—as seen in the Blockhathon—by collaboratively producing their own ‘real-world’
    blockchain application with which they critique, satire, and play out of the emerging
    narratives surrounding blockchain governance. This critical type of game has produced
    a type of simulation frequently mentioned ‘real-world’ blockchain applications.
    Workshop participants develop narratives to imagine and improve potential social
    and political conditions that could be caused by widespread blockchain integration.


    Many of the DAO users use a form of LARP, a type of generic theatrical associated
    with board-game culture or war re-enactment. LARP has matured in recent years
    due to the growth of community in Scandinavian countries that have developed role
    methods into ‘Nordic LARP’, which explicity for more open, collaborative, immersive
    role play games. The community has nurtured and developed LARP within an applied,
    engaged praxis, through regular festivities and collaborating with local governments
    in Scandinavian countries as a form of applied social therapy.¹¹ LARP offers lists
    of possibilities for immersion and performative encounters, it seems unlikely
    to facilitate to the emergence of blockchains. While the existence of blockchains
    remains a figment of imagination without a working reality, LARPing various scenarios
    and imagined futures inspired or propelled by the prospect of blockchain governance
    offers a semantic and physical framework through which to understand, negotiate,
    and consider the potential impact of blockchain-based governance.


    Another noteworthy of us practice in the field of blockchain innovations is the
    use of speculative design methods in Human Computer Interaction (HCI). In ‘Speculative
    Approaches to Understanding DAOs’,¹² Chris Elsden and John Jones


