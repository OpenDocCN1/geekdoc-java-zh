    “we assisted him in repurposing them and now they hang on gallery walls as valuable
    artworks.”⁴


    # Art is an Asset Class


    The Mahama-Simchowitz controversy was about the conditions of the contemporary
    art market. Artworks are financial assets to be liquidated, broken into individual
    shares, and circulated in a global market. Prices reflect and respond to the broader
    dynamics of the financial system. They are often hedges against the risk of investment
    in traditional stocks and bonds. As Mark C. Taylor argues,


    > [w]hen art of finance becomes the finance of art, is no longer merely a commodity
    to be bought and sold, but becomes the currency of exchange fabricated for hedge
    funds and private equity funds, where it is traded like any other financial asset⁵


