  md: '# How State Borders Are Being Set in Motion Virtually Everywhere


    Contrary to popular assumptions, state borders, including the walls propagated
    by Trump, Orbán and company, are not closed because their primary function is
    not to stop movement. Instead, they are set in motion to scan, sort, and classify
    moving subjects and objects, to measure and quantify them. Movement is directed
    or redirected on the basis of these assessments. The imperative is rather to extract
    labor and to monetize movement.


    Looking back at the summer and fall of 2015, when a historic number of migrants
    entered the EU, I recall around four o''clock in the afternoon, my colleague and
    I had just arrived in Berlin''s State of Labor and Social Affairs (LaGeSo). It
    was very noisy and chaotic. A large group of people was chanting, aggressively
    as at a protest. The people were migrants, waiting to be registered and subsequently
    acknowledged as refugees. Some of them had already been waiting for weeks just
    to get a waiting number. They were met, with deafening symbols of state power
    with sirens, armed police, megaphones, and private security guards, inciting the
    people calm


    This could have been a scene at the border between two countries, but the setting
    was actually in the heart of Berlin. Fact, in many regions, people move through
    and beyond borders; by doing so, people are scanned, sorted, and classified by
    technological systems that are deeply opaque and operate according to racialized
    categories.. They are registered as useful or not, consequently bestowed or denied
    the privileges and rights of the state. Having developed in various historical
    settings, these mechanisms assist the organization of mobility and circulation,
    and structure political and economic participation. Shouldn''t they be administered
    transparently?


    Not knows that, in a sense, all movement in the present day entails the crossing
    of state borders. Not everyone knows that vital decisions such as about asylum
    applications are being taken in the course of this movement. Not everyone knows
    that they are waiting, decisions on their status are evaluated, or delayed. This
    type of unrivalled uncertainty is a far-reaching suspension of agency, and it
    is coupled with the potential dispossession of economic, social as well as political
    status. It leads to Entrechtung—a radical suspension of rights.


    All of this takes place within the realm of the modern, Western nation state,
    whose historical function hinges upon their claim to provide shelter. But the
    claim can only be valid when the opposite is also true at the same time; in order,
    by means of state borders inclusion can be modulated with exclusion. Of course,
    the concepts of inclusion and exclusion are not dynamic enough to describe our
    present predicament. After all, bordering processes are far too gradual and granular.
    This somehow renders absurd the notion of citizenship, doesn''t it? After all,
    the idea of citizenship is based on the concept of a clear-cut distinction between
    who belongs to us and those who don''t.'
