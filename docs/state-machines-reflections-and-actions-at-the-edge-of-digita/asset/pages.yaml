    the Pennys (sic) token, the answer is just one, but it''s a bit more complicated
    than that.


    The hot topic in blockchain security this year has been AI-proofing. AI can''t
    guess hash- but it can profile and schedule about everything else. OG holders
    may have thought ASICs were bad but had nothing on AI. Once they enter a chain,
    nothing else can compete. At least for now.


    That said, if your sidechain has a transaction backlog and need better pricing
    and scheduling on your sidechain it is an opportunity. The Al grab transaction
    fees, sure, but the fees goes and the backlog empties. Everybody wins. in theory.


    Despite the current economic uncertainty the Pennys token sidechain was just such
    a chain, but the function it used was deliberately constructed to be Al-proofing.
    This isn''t like old mass media depictions where you ask a big box with blinking
    lights that contains the computer running the AI ''why'' and smoke comes out as
    it breaks down under the weight of an answer existential question. It''s a method
    of injecting enough randomness into the function that fuzzes the results to a
    degree that the AI has difficulty training on it, making it economically impossible
    to do.


    An on-chain governance vote of Pennys holders also blocked a proposal to remove
    the Al-proofing from the chain. Three thousand blocks ago the new transition activated
    on the chain, and at first nothing happened. But by this morning had gone horribly
    wrong. What changed things?


    Firstly, an AI operation had been trying to crash the Pennys chain for months,
    and once the AI-proofing was removed all it took a few hours of training for the
    massive amount of allocated hardware to crash the Pennys chain economy. Secondly,
    the unusual activity prompted by Dodge quests on some sidechains, including Pennys,
    meant that the AI miscalibrated its fee model, setting them unbearably high.


    All of this means if you want to send a transaction and aren''t scheduling them
    and setting their fees precisely as the AI demands, you are out of luck.


    There is another on-chain governance vote scheduled for 5000 blocks time as of
    the time of this article''s hash being uploaded to the blockchain but to vote
    on the Pennys chain at the moment is almost impossible due to the activity of
    the AI. The proposals to be voted on all involve rolling back the removal of the
    AI-proofing and making more cautious modifications to the sidechain''s algorithms
    in future.


    I reached out to the AI mining pool''s operators for comment, but the pool is
    managed by another AI, which is managed by a network of anonymous Decentralized
    Autonomous Organization (DAO). One of these is the controversial ''Skynet 2XX''
    machine-worship group, widely regarded as trolls with an increasing following
    in the arts and academia. There''s a grim irony to all of this, but that isn''t
    really something that the Als involved in mining can appreciate.


    At least for now.'
