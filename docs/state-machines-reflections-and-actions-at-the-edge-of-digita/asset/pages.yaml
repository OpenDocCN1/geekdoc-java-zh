    #Syllabus indeed be analyzed as falling within a long lineage of pedagogical tools
    created by social movements to processes of political subactivation and the building
    of collective consciousness. Activists and militant organizers have time and again
    created using various textual media objects—such as handouts, pamphlets, cookbooks,
    readers, or manifestos—to facilitate a shared political analysis and foment mass
    mobilization.


    In the context of the US, anti-racist movements have historically placed great
    emphasis on pedagogy and self-education. In 1964, the Council of Federated Organizations
    (an alliance of civil rights initiatives) and the Student Nonviolent Coordinating
    Committee (SNCC), created a network of 41 alternative schools in Mississippi.
    Recently, the Freedom Library Project, a campaign born out #FergusonSyllabus to
    find under-resource pedagogical initiatives, referenced this as a source of inspiration.
    The Freedom Summer Project of 1964 brought hundreds of activists, and scholars
    (many who were white) from the north of the country to teach topics and issues
    that discriminatory state schools would not offer to black students. In the words
    of an SNCC report, Freedom Schools were established following the belief that
    ‘education—facts to use and freedom to use them—is the basis of democracy’,11
    a conviction evoked by the ethos of contemporary #Syllabus initiatives.


    Bob Moses, a civil rights movement leader who was the head of the literary skills
    initiative in Mississippi, recalls the movement''s intent, at the time, teaching
    methods that used the production of teaching materials as a pedagogical tool:


    I had gotten hold of a text and was using it with some adults [...] and noticed
    that they couldn''t handle it because the pictures weren''t suited to what they
    knew [...] That got me thinking about developing something closer to what people
    were doing. What I was interested in was the idea of training SNCC workers to
    develop material with the people we were working with,12


    It is significant that for him the actual use of the materials the group created
    was less important than the process of producing the teaching materials together.
    This focus on what could be named a ‘ped pedagogy of teaching’, or perhaps more
    accurately ‘the pedagogy of preparing teaching materials’, is also a relevant
    mechanism in play the current #Syllabus initiatives, as their crowdsourcing encourages
    different kinds of people to contribute what they feel be relevant resources for
