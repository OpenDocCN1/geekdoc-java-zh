    # #Syllabus in Historical Context: Social Movements and Self-Education


    When Professor Chatelain launched her call for #FergusonSyllabus, she was mainly
    addressing a community of educators:


    I knew Ferguson would be a challenge for teachers: When schools opened across
    the country, how they were going to talk about what happened? My idea was simple,
    but resonated across the country: Reach out to the educators who use Twitter.
    Ask them to committing about Ferguson on the first day of classes. Suggest a book,
    an article, a film, a song, a piece of artwork, or an assignment that speaks to
    some aspect of Ferguson. Use the hashtag: #FergusonSyllabus.


    Her call had a much greater resonance than she had originally anticipated as it
    reached beyond the limits of the academic community. #Syllabus had a significant
    impact in shaping the analysis and the response to the shooting of Michael Brown,
    and in inspiring the many other #Syllabus calls that soon followed.


    #Syllabus phenomenon comprises different approaches and modes of operation. In
    some cases, the material is clearly claimed as the creation of an individual,
    as in the case of #BlackLivesMatterSyllabus, which is pref on the project''s leading
    band by a warning to readers ''material claimed in this syllabus not be duplicated
    without proper citation and attribution.''¹⁰ A different position on intellectual
    property has been embraced by #Syllabus interventions that have a more choosing
    name. #StandingRockSyllabus, for instance, introduced as a crowd-sourced process
    and as a useful ''tool'' to access research usually kept behind paywalls.¹¹⁹


    The different workflows, modes of engagements, and positioning in relation to
    intellectual property make #Syllabus readable as symptomatic of the multiplicity
    that composes social movements. There is something old school—literally about
    the idea of calling a list of online resources ''syllabus''; a certain quaintness,
    evoking thoughts of teachers and homework. It is worthy of investigation especially
    if contrasted with the attention dedicated to other online cultural phenomena
