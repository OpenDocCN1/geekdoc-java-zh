    This photo messes with the neural networks'' expectations and leads to it categorizing
    the image as ''a group of flowers in a field.''6 I call this ''change the color''
    method, which seems to work best when smaller objects are repeated in a larger
    surrounding. When zooming in, just showing one orange sheep, the neural network
