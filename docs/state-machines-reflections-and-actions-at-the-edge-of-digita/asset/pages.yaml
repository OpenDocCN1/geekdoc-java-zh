  md: '# ART, DEBT, HEALTH, AND CARE


    # MARC GARRET INTERVIEWS CASSIE THORNTON


    The 2007-8 financial crash, we''ve learned that it tends to be everyday people,
    on the ground, who push up the pieces of failed economic experiments rather than
    governments.¹ Millions have been dragged into poverty while those who caused the
    ‘crisis’, after creating high levels of debt, remain unscathed.² The UK Conservative
    government''s response was a policy of austerity, driven by a political desire
    to reduce the size of the welfare state. Amadeo Kimberly says,[³Austerity measures
    tend to worsen debt...] because they reduce economic growth⁴ The effect has been
    devastating, creating all the more homeless and precarious working conditions,
    and thus pushing communities into debt. In the UK, the National Health Service
    (NHS) is being pushed for privatisation. Medical bills were the biggest cause
    of US bankruptcies, and it is estimated that 2 million people were affected each
    year due to medical costs⁵ The work of artist and activist Cassie Thornton was
    included in the Playbour: Work, Pleasure, Survival at Furtherfield, curated by
    Dani Adams. In this interview I explore the following questions as revealed in
    her current Hologram:


    +   - What do current conditions say about trust and care, and how can we trust
    the current, governments to have our best interests at?

    - How do we produce non-hierarchical trust and care that thrives outside of the
    doctor-patient relationship, which is especially important in the U.S., where
    it is a profit-making industry?

    - How do we reverse the tragic social forces of the predatory economic system,
    and redistribute a new kind of power to people who never had it before?

    - How do we begin to build solidarity?


    Thornton describes herself as a feminist economist. Drawing on social science
    methods, she develops alternative social technologies and infrastructures that
    might produce health and life in a future without producing oppression–like that
    of current money, police, or prison.


    > ¹ This was originally published by Furtherfield on 2 July 2018, of the Playbour
    exhibition curated by Dani Adams, and the touring exhibition Internationals curated
    by James Briggs, realized in the framework of State Machines, a project by Axioma
    (SI), Group more (HR), Furtherfield (UK), Institute of Network Cultures (NL),
    and NeMe (CI).

    ² David Graeber, We’re Racing Towards Another Private Debt Crisis: Why Did We
    No See It Coming?, The NewStatesman, 18 August 2017, https://www.newstatesman.com/politics/2017/08/racing-towards-another-private-debt-crisis-so-why-did-no-one-see-it.

    ³ Amadeo Kimberly, ‘Austerity Measures, Do They Work, with Examples’, The Balance,
