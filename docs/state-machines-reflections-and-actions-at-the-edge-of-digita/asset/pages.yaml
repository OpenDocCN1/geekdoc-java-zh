    # Infrared Disturbances


    Another adversarial hacking technique is ''sensor blasting'', a technique that
    overwhelms sensor by using light sources to disturb the visual wavelength spectrum.
    In a 2018 study, pattern recognition researchers Han et al. used this technique
    to show that infrared light from a 5W 850nm infrared LED can disturb facial recognition.
    It can be deployed to make a face unrecognizable or, conversely,


