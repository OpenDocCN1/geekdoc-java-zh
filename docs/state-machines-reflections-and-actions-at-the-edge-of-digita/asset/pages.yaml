    There is clearly a connection between informatics/computation and the technology
    of PCR. But, there are stronger influences than information/computing on the conception
    of PCR.


    Combustion-Inspired Computing

    In his autobiography, Mullis describes an interest in computer programs: ‘I knew
    computer programming, and from that I understood the power of a reiterative medical
    procedure.¹¹¹⁹ It would be logical to assume that informatics and computational
    paradigms of the post-World War II inspired PCR: a procedure which synthesizes
    functional duplicates that can be described by their sequences or codes, sequenced,
    and synthesized with a sort of digital precision. Yet, Mullis himself seldom refer
    to DNA as code, preferring as a chemist to describe DNA sequences in chemical
    terms, such as complex nucleotides. As further investigation will underscore,
    PCR is shaped by interests and influences other than informatics, but is also
    a product of the Cold War.


    Mullis devoting several pages in his autobiography to his beginnings with models
    rocket.


    > The first thing of any consequence that I made with my chemistry set was a substance
    similar to thermite. I mixed powdered aluminum, ammonium nitrate, a dash of something
    else, and it got red. When I pulled it away from an alcohol burner, the flames,
    reaction kept going. The mixture got hot, broke the test tube, and suddenly went
    Fffffshhoooo. [...] In 1957 the Russians launched the space rocket by putting
    Sputnik in orbit around the earth. [...] Two years later, my friends and I were
    launching our own rocket in my backyard²⁰


