    In Fragments on Machines, a 17-minute experimental piece of docunction by Emma
    Charles, something borrows beyond the predominantly cyber-utopian and cyber-dystopian
    accounts of algorithmic trading⁷ Fragments on Machines evokes the mythical figures
    of a hybrid, and the metaphor of a flood to represent algorithmic trading. Charles''
    much-accoladed video essay has been included in numerous exhibitions on information
    technology⁸ and has garnered both popular and critical attention. In the spirit
    of Marx'' ''The Fragment on Machines'', Charles focuses on human-machine relations.
    The title of the film is a reference to Karl Marx'' Outlines of the Critique of
    Political Economy, in which he discusses the evolution of the production of labor
    and capital, from the division of labor to the increasing integration of machines
    in labor, and to the ever-increasing automation of labor.


