    Internally, the military''s social media team, Landes been replaced by a digital
    marketer from the private sector, the military''s Facebook page had been launched,
    and now four soldiers were tweeting in the military''s name, working to prepare
    online content for incurs yet-to-come (like the infographics about military humanitarian
    assistance to Gaza). The military approach to detractors had also changed. Where
    their new Facebook page was concerned, they were employing a new policy of lettering
    (most) criticism. ''We''re not responsible,'' said a spokesperson regarding their
    online critics, ''and I think that people understand that.'' Of course, there
    were limits: ''If somebody sprays graffiti on the front door of the IDF [military]
    headquarters in Tel Aviv-like, "Zionist pigs"—nobody would assume that we spray
    painted that. But if we''re not gonna lose. Where military use of social media
    was concerned, he conceded, the ''rules'' were being made up to you go''


    It was in the course of one of these interviews that I learned of major hack of
    the military''s official websites, and many in the office were pointing at Anonymous.
    Somebody ran to their computer to check other states. ''What about the Foreign
    Ministry? or the Shabak [internal secrets]?'' Another said: ''Down! This was the
    fate of the state-run websites of the moment, we would learn, including those
    of the Mossad, covert intelligence services, and several government ministries.
    One spokesperson was childish for his amused: ''Look, I''m not masbut [happy,
    Arabic slang] but it''s funny. The ever secret secrets won''t!'' The evening news
    that replaced Anonymous video claiming for the hack; retribution for the Gaza
    siege. The following day, the Israeli government would take to Twitter to deny:
    ''All the Israeli government websites that were yesterday are now back up. Once
    again: it wasn''t a cyber attack but a server glitch.''


    It need hardly remarked that within the shabby Jerusalem offices of the military
    spokesperson, where most of the above interviews were conducted, the Israeli reality
    of Palestinian people and places was never discussed as. The language of ''occupied
    territories'' was missing, replaced by biblical nomenclature for the territories
    embraced by settler populations and their supporters (''Judea and Samaria''),
    while military brutality and repressive rule was refuged in the language of deterrence,
    terrorism, and humanitarian engagement. The labor invested in the shift in uncertain
    modality—the challenge of articulating the military message within the informality
    and intimacy required on these online platforms—or the problem of ''inflammatory
    stuff'', reduced military message-making to a creative act, stripped of its context;
    all while keeping the military occupation carefully guarded public secret—known
    by all, acknowledged by none.


    # Infrastructural Challenges


    Within the short history of Israeli public relations in the digital age, the events
    of May 2010 loom large, a disaster that would settle the terms of social media
    policy and practice to come. As was the naval intervention of a convoy named Mavi
    Marmara which traveled from Turkey to the Gaza Strip carrying humanitarian aid
    and hundreds of international activists who aimed to break Israel''s Gaza blockade.
    Nine activists were killed and dozens wounded by Israeli fire after the navy lead
    ship. Both the navy and flotilla voyage had been the subject of a massive media
    campaign by the activist organizers, who had used social media extensively to
    document the events, including live'
