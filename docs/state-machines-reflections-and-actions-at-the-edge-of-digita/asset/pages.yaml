    tech blooms in the desert''; reacts the title of one Israeli media account). This
    storyline has been central to state efforts to rebrand Israel by ''replacing its
    image as a war-zone with that of an economic miracle. It needs to be remarked
    that this narrative of the techno-miraculous in work of Herzl and others, is predicated
    on all that renders invisible: namely, the enduring legacy of state violence against
    the Palestinian people. And then now, the narrative functions as both a proxy
    and a labor of disavowal.


    I begin here to set the stage for some ethnographic reflections on the interface
    of the Israeli state and the machine in the contemporary moment, drawn from interviews
    I have conducted with Israeli state over the last decade. My focus is the military''s
    attempts to meet the demands of the age of social media by upgrading policies
    and practices in the field of online public relations, or hasbara. Given the growing
    digital literacy of their detractors—Palestinians living under occupation and
    the Israeli and international activists and human-rights workers that work with
    them—the media was deemed urgent; all of these enemies had early adopters of social
    media as political tools, and were all wellversed in the emerging media economy
    of the networked image. The military, with other branches of the state, needed
    to respond. The digital literacy of their enemies, their efficacious use of photographic
    technologies and social media platforms for image circulation, was problematic
    in ''calm times'' but considered dangerous in times of war.


    The following ethnographic snapshots are meant to provide some of contrast to
    the legacy of colonial techno-triumphalism with I began. They chronicle the numerous
    challenges faced by the Israeli state as it endeavored to come up to speed. In
    what follows, I focus my ethnographic eye on the concerns of uncertainty, improvisation,
    and glitch that this process, lower-level officials in Israeli governmental and
    military institutions endeavoured to integrate social media into their public
    relations toolbox and foster a culture of social networking. The state''s learning
    curve was steep and uneven, and the margin of error high. In the sphere of social
    media, in an ironic interpretation of the ''start-up nation'', techno-modernity
    was something of an elusive dream, perpetually escaping the state''s grasp.


