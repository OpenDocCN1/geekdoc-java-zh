  md: 'Mining: Validating blocks in return for rewards including mining fees.


    Mining pool: Hardware or people sharing in the work and rewards of mining blocks.


    OG: ''Original Gangster''. An appropriated honorific indicating respect for someone
    who has successfully played the longer than oneself.


    Patch: An incremental modification to a piece of software.


    Prediction market: A betting pool for or against the likelihood of future events
    that were used to measure their probability.


    Pump: To artificially inflate the price of a coin or token through nefarious means
    before dumping it.


    Scam: A scam or, alternatively, anything you disagree with or dislike.


    Shard: A smaller blockchain that is attached to a larger one and able to communicate
    with it and other shards.


    Shiba: From ''Shiba Inu'', the Dogecoin mascot. A Dogecoin holder, an excellent
    person. Like ''comrade'' or ''choombatatta''.


    Sidechain: A smaller blockchain attached to a larger one but isolated from it
    by different ferment rules.


    Smart contract: A program stored on the blockchain that executes in response to
    blockchain transactions.


    Trusted third party: An intermediary that can interfere in a social relationship
    between peers and must therefore be trusted not to.


    Tx, txes: A blockchain transaction or transactions.


    Token: A cryptographic token built on top of a cryptocurrency blockchain.


    Wallet: A piece of software, hardware, or paper used to secure cryptocurrency
    account keys.


    Whale: A hodler of very large amounts of cryptocurrency.


    Wow: What a dog says when it thinks something is amaze.


    ZK-SNARKs: ''Zero Knowledge Succinct Non-Interactive Argument of Knowledge'',
    an algorithm that allows the existence of secret knowledge to be proven without
    revealing its content.'
