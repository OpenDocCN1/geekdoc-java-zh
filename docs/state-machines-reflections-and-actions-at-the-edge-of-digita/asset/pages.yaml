  md: 'Border Surveillance System (Eurosur), which was set up specifically for this
    task, provides the ‘information exchange framework’ required for the analysis.


    Eurosur blends data received from so-called surveillance airships, drone boats,
    radar facilities, movement sensors, and offshore sensors with information gleaned
    from risk analyses, satellite images, and archives of migrant profiles. In addition
    to national agencies, the European Maritime Safety Agency and the European Union
    Satellite Centre are among the partners in the security network, which promotes
    the merger of public and corporate databases.


    This military-information complex advances the bureaucratization of migrant registration,
    which is being jointly developed and implemented by the European IT systems agency
    EU-LISA, the asylum fingerprint database Eurodac, and agencies like the Berlin
    State of Labor and Social Affairs (LaGeSo). In the slip-stream of data, the control
    of movement is turning into an increasingly mobile movement of the methods of
    control. State borders are being activated at will, real space and virtual space,
    unaccountably and democratically. As complex states of power, they are becoming
    ambiguous, hybrid and dynamic, in motion along the migrant infrastructure, from
    the frontier to the heart of the state territory, e.g. to the city center of Berlin,
    with countless migrants waiting their turn outside the initial registration process.
    This migration of state borders is the movement of state power.


    # Bordering Potential Movement


    What is crucial in this context is that the rise of artificial intelligence and
    big data technologies converges with post-9/11 politics of prevention, and is
    embraced by a number of states. Governmental bodies like intelligence services
    and military special forces cooperate with security firms and IT companies. The
    representatives of these organizations believe that every risk can be managed
    through data collection and computing power, and therefore they are reaching for
    and grabbing more data.


    Though their predictions may never become reality, their obsessive forecasting
    nevertheless leads to arm themselves against all threats (threats to their power
    and their mobility) that might appear in the future. They are also implementing
    a project of algorithmic logics, developed for the global management of goods
    and supply chains and now targeting the movement of people and of data; and, they
    are demanding sovereignty over all essential infrastructure to carry out this
    task.


    The data-driven preemption game is changing the space for what is possible. It
    designs and produces the future and it manages movements in new ways. The future
    of movement and the movement of the future are both meant to reach a state of
    control through computation and pre-emption, without ever being contested within
    society. The idea is to declare war on everything that could potentially happen.
    Also known as the War on Terror, this operates on the level of the virtual. It
    locates threats on its agenda and takes their non-existence—or ‘not-yet’ existence—as
    a stimulus. After all, even something that ends up never happening, could have
    always happened. Such a politics is, of course, ultimately incompatible of purely
    ruling out any event; yet, it cannot even understand, let alone accept, this'
