    had been open to the public on its first day, it was shut down 24 hours later
    following a torrent of what she called ''hate mail,'' the volume and tenor of
    which had taken the team by surprise.


    The problem of online was a perpetual for the military, and also concerned by
    the other Israeli state bodies employing social media in these early years–bodies,
    which at this stage in social media work, also the same approach to ''inflammatory
    stuff.'' The Israeli Foreign Ministry, responsible for managing the Brand Israeli
    campaign online, would articulate similar concerns about voluminous negative commentary–after
    initial optimism about social media''s potential as a regional bridge in the midst
    of Arab revolts. For for greater numbers of Arabs were ''liking'' their, they
    told me, inflammatory material had grown commensurately. I spent a morning with
    the Ministry''s only full-time administrator of their Arabic Twitter and Facebook
    accounts, who confessed that was perpetually overwhelmed by the work. By budgetary
    constraints, their Facebook page could only be surveyed during working hours and
    thus, she said, something was always missed; when she arrived in the morning,
    she was tasked with cleaning up it. The military had taken note of this, Landes
    told me, in discussion of their plans for Facebook: ''We are going to need specific
    shifts in relation to the wall,'' she explained, adding that the funding for these
    additional personnel had not yet been secured.


    .


    The contours of the military''s social media work would shift rapidly alongside
    the growing state understanding of the PR potential of this sphere. Much had changed
    when I returned for interviews a few months later. The Israeli initial shock following
    the 2011 Arab revolts had vanished, as had the optimism of some state officials
    about social media''s potential as a regional bridge. In the intervening period,
    Israeli state institutions had also come under increased scrutiny for intelligence
    gathering via Facebook, particularly on Palestinian activists.'
