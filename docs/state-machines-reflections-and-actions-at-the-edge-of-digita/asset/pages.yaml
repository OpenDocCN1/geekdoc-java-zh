  md: '# Some Useful Terms:


    ASIC: ASICs (Application-Specific Integrated Circuits) are custom manufactured
    hardware that implements the cryptographic hashing algorithms used in mining cryptocurrency.
    They are faster than CPUs or GPUs and are regarded as cheating or otherwise unfair
    by some people.


    +   - **Block**: A collection of transactions from a particular period of time
    validated by the network.


    +   - **Blockchain**: A series of blocks, each linked to the past by its cryptographic
    hash.


    +   - **Cryptoeconomics**: The combination of cryptographic system and the theory
    of gameoretic incentives.


    +   - **DAO**: ''Decentralized Autonomous Organization''. A blockchain corporation
    or cooperative, the technological equivalent of a charitable trust.


    +   - **Digging**: The Dogcoin equivalent of mining.


    +   - **Doge**: A dog. Probably a Shiba Inu.


    +   - **Dump**: To sell off a coin or token that has been pumped, crashing the
    market for it.


    +   - **Exchange**: Cryptocurrency exchanges allow you to swap between different
    coins/tokens.


    +   - **Exploit**: A means of hacking a piece of software.


    +   - **Fees**: Cryptocurrency transaction fees paid miners for inclusion in a
    block.


    +   - **Fork**: A split in a project, in this instance of one cryptocurrency chain
    into two ones.


    +   - **Genesis block**: The first block mined for a particular blockchain.


    +   - **Hash**: A unique, algorithmically generated, unguessable identifier for
    a piece of data. Also the cost of applying that algorithm.


    +   - **Hodling**: To hold cryptocurrency, named after a typo on a Bitcoin message
    board.


    +   - **ICO**: ''Initial Coin Offering''. A sale of cryptographic tokens to fund
    a project.


    +   - **Iota**: An early ''Internet of Things'' post-blockchain project.


    +   - **Keys**: The pair of very long numbers that make up the public and private
    part of a modern cryptographic identity.


    +   - **Layer two network**: A faster system for using an existing cryptocurrency
    using additional, more complex, software and cryptocur incentive structures.'
