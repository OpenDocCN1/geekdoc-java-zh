    two high-speed protons in the process. The link to biology also underscores that
    the nuclear bomb is not merely a technology, but a phenomenon from the depths
    of nature. The nuclear fusion reaction creates an enormous explosion of exponential
    growth and its initiation has been described as a sort of birth.


    The Manhattan project was a World War II endeavor that produced the first nuclear
    weapons, led by the US with support from Canada and the UK. By the early 40s,
    it had a budget of over US$2 billion. As funding for nuclear weapons research
    in the US 80s, the scientists most responsible for the US nuclear programs needed
    to reinvent themselves to survive new imperatives. Others, such as Los Alamos
    physicist Michel Feigenbaum, pursued ''deep'' problems like the basis for the
    emergence of the universe or life itself that confounded the traditional categories
    of science, such as biology, physics, mathematics, chemistry, and meteor. Deep
    questions like this would spawn a new science that transcended these disciplinary
    boundaries—the science of chaos, and the basis for chaos theory.


    "Chaos" is an interdisciplinary theory stating within the apparent randomness
    of chaotic complex systems, there are underlying patterns, constant feedback loops,
    repetition, self-similarity, fractals, self-organization, and [...] sensitive
    dependence on initial conditions.¹² Because of this behavior of the complex systems
    is unpredictable and small changes can have large consequences, such as the hypothetical
    case regarding the global weather system—the ''butterfly effect'' that a butterfly
    flapping its wings in Brazil can cause a hurricane in Texas. Chaos science sees
    non-linear, mathematical models of dynamic phenomena beyond Euclidean mathematics,
    which approximate using ideal forms like lines, curves, and spheres. By using,
    non-linear algorithms, chaos science is able to model complex natural phenomena
    such as the onset of turbulent flows in liquids.


    While Kay and Thacker described the influence of command and control on DNA science,
