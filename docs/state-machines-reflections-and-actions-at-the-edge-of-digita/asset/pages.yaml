    \nREBECCA L. STEIN\n\n# Zionism and the Techno-Miraculous'\n\nAs postcolonial\
    \ scholars have taught us, colonial history is closely tethered to machines and\
    \ technologies of various kinds. For colonial regimes, material evidence of technological\
    \ progress was a crucial means of demonstrating ‘modernizing ambitions’ and spectacularizing\
    \ their successes, with technology employed as a sign of the modern. The textual\
    \ archive of colonialism is littered with wondrous ‘first contact’ between colonized\
    \ populations and machines. The figure of the technological or the machine was\
    \ endowed with a powerful pedagogical function within narratives, working to retain\
    \ colonial subjects, rescuing them from the time of the pre-modern. Or was such\
    \ the recurrent colonial fantasy.\n\nThis link between the machine and the state\
    \ is dramatically on display in the history of Zionism and its associated archive.\
    \ Consider, for example, Theodor Herzl's old-cited *New Land*. Written by a founder\
    \ of political Zionism, this 1902 utopian narrates Palestine settlement and the\
    \ Jews of the Jewish diaspora and the radical transformation of Palestine (a vision\
    \ that would see us prophetic—occurring, as it did, well before the mass-settlement\
    \ of European Jews). In Herzl's accounts, visitors to this ‘new society’ stand\
    \ in before Haifa's modern network, marveling at its elevated train, its electrified\
    \ cities, its thriving economy. ‘Never in our cities built so quickly or so well,’\
    \ testifies a Jewish resident of this ‘new society’, because never there were\
    \ so many facilities available, [...] We merely had to transplant inventions to\
    \ this country.’ Herzl describes the visitors to this former Oriental backward\
    \ marvel at the technological wonder. We know Palestine as a forsaken country.\
    \ [...] How it changed all is! [...] There's been a miracle here.¹13\n\nThe trope\
    \ of technology as a miraculous reality would induce and indeed flourish in the\
    \ Israeli settler-nation context in subsequent decades, retaining its ideological\
    \ importance long after the formation of the Israeli state in 1948. This trope\
    \ has enjoyed some success of a revival in the digital age, reinvigorated by the\
    \ Israeli state-sponsored narrative of Israel as a ‘start-up nation’, shorthand\
    \ for its emergence as a high-tech locus and global center of digital innovation.\
    \ Stock images proliferate within this narrative, as with the original book by\
    \ which Israeli high-tech workers cast as pioneers and the digital infrastructure\
    \ credited for reclaiming a barren land [Israeli high-\n\n+   1 For more information\
