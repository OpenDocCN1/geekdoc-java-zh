  md: '# BEFORE, AFTER, AND BEYOND WALLS!


    # KRYSTIAN WOZNICKI


    Today, more and more people in the Global South are fleeing their homes, and countless
    people are dying along their way. Their movements challenge the borders that mark
    the nation''s spheres of influence: territorial, political, juridical, and economic.
    By doing so, they expose how these borders ultimately determine the conditions
    of life itself; in other words, who is entitled to life and human rights, or even
    fundamentally who may survive.


    In this sense, state borders are being exposed as articulations of state power—a
    power that has helped build and expand within and beyond their own territorial
    limits. Moreover, state borders are revealed not as lines on a map but as assemblages
    of movements, technologies, and institutions. They are social ordering processes
    that migrants challenge, whether they are illegalized—or to some extent temporarily-illegalized.


    Admitted, the politics of movement cannot be reduced to a matter of state borders.
    Yet, these borders must be crucial reference points for analysis, critique, and
    resistance in the field of movement-based power. While perhaps not consciously
    or intentionally, migrants are forcing an awareness of this through their actions.
    Hence, the big question is: Are those who are among the most vulnerable and precarious
    also those potentially creating movement-based counterpower? And, in the course
    of this, are they shaping the notion of political agency anew?


    For centuries, states and corporations have engaged in transnational and often
    global processes serving a range of objectives including trade, missionary work,
    and colonial conquest—or all of them at the instance. Contemporary examples are
    the global arena of foreign policy and neo-colonial land grabbing in the Global
    South. A web of interdependencies exists between states and corporations, markets
    and environments, populations and infrastructure. This challenges the state and
    its borders, and above all the capacity to regulate and control movement inside
    this complex web.


    State representatives nation states as walled gardens. In North America, Europe,
    South Asia, the Middle East, and beyond, they are propagating walls and fences.
    People like Donald Trump and Victor Orban are only the most notorious among a
    growing movement of populists who to seemingly unfamiliar degrees of complexity
    and uncertainty engender by processes of globalization by selling a simple solution:
    a more authoritarian state that demonstrates its power as massively and as visibly
    possible—with walls, for instance.


    +   1. An earlier version of this photo-essay was published in Krystian Woznicki,
    Fugitive Belonging, Berlin: Diamond Paper, 2018.'
