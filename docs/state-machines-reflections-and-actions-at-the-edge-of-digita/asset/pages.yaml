  md: '‘This reminds me an awful lot of an episode from Black Mirror''

    —Participant in ‘What it will be like when we buy an island (on the blockchain)?’¹¹⁴


    Within such methods, the use of improvisation to enact alternative blockchain
    imaginaries is another unconventional strategy that works to varying degrees of
    effect. For example, a popular improvisation method used in theater to generate
    interactions and scenarios is called ''Yes, And...''—a simple, rule-based game
    for players to support the co-creation of generative fiction where every idea
    must be responded to with ''Yes, And...'' to further elaborate an improvised scene
    together. This method is traditionally used to accelerate the flow of improvisational
    dialogue and to make the performance more entertaining. However, within blockchain
    LARPs, the ''Yes, And...'' rule quickly escalates conversations from the mundane
    to the hyper-dystopian. When being used as a method in media, it can lead to the
    LARP generating absurd emulations of popular science fiction dystopias. This counters
    the often claims made by blockchain technology. This is where the artist John
    Cage, who had his own concerns about the use of improvisation, resonates with
    the use of improvisation within this strange techno-social role. Cage argued that
    ''does not lead you into a new experience, but into something with which you''re
    already familiar''.¹⁵ While Cage was referring to improvisation in the creation
    of media and not for exploring social realities inspired by blockchain governance,
    I argue, based on my experience of improvisation and blockchain role, that similar
    an outcome is often reached. Rather than disregarding improvisation methods within
    this space, certain methods are more effective than others attempting to disseminate
    speculative fiction rounding blockchain technology.


    In MoneyLab Reader: An Intervention in Digital Economy, theorist Max Haiven argues
    that ''money is a medium of the imagination'' and that cultural strategies provide
    productive methods for rebuilding imaginations of finance, money, and social relations.¹⁶
    In general, the adoption of performance methods within communities to demystify
    a fascinating attempt to de-construct, imagine, and re-enact potential alternatives.
    Blockchain, originally designed to enable the cryptocurrency Bitcoin, is fundamentally
    a financial technology that has captured the collective imagination of how money,
    value, and society can be re-designed through networked computing. The impact
    of blockchain still lives in the speculative of its imaginaries used to generate
    interest and value, and transition into a widespread ''general purpose technology''.¹
    In other words, blockchain will only become a technology for social governance
    if individuals become convinced by the claims made by its advocates. These claims,
    while seemingly rooted in factual or scientific properties of blockchain architecture,
    remain widely embellished applications of blockchain and DAOs reside in the white
    papers of start-ups and the imagination of techno-futurists, who use of role play,
    improvisation, and imagination are powerful tools with which to reach, investigate,
    and explore spectra


