    # # The Block Times Article: ''TotalScamCoin Scam''


    As my Grandmother used to say, a lot closer to the genesis block than now, whenever
    she refused to give me coins to spend on some fancy new ICO—if it seems too good
    to be true you need to check the fundamentals. They were wise words then and are
    wise words now.


    Investors in TotalScamCoin woke up this morning to the news that funds were draining
    from the TotalScamCoin company account. Watching withdrawal transactions on the
    blockchain explorer in horror with them was TotalScamCoin CFO Ella Patterson.


    “I couldn''t believe it,” Patterson told this reporter when I contacted them for
    comment, we did everything right. It''s a multisig wallet controlled by TTP-enabled
    hardware keys with social recovery and long lock times.


    So what went wrong with this best-of-breed security, I asked Patterson. “Wallace
    used a weakened key for his in the genesis block then discussed series of increasingly
    large transactions drawing them as individual small transactions and submitted
    for approval. We checked and signed the small transaction, or at least we thought
    we did, but Wallace had boiled our frog.


    Matthew Wallace is, or TotalScamCoin''s CTO. And the frog? Patterson explains:
    “We checked the transaction history. [Wallace] had getting us all to approve longer
    chains of masked transactions over the last few months. He only caught the smallest
    one in each series, so he trained our security analytics to ignore what he was
    doing. The metaphor of boiling a frog by increasing the temperature at a time.
    By the time they realize they'' cooked it''s too late.


    And this morning it was too late. Why would anyone invest in a coin that claims
    to be a scam? “The team was stellar and the fundamentals had total solidity,”
    said pseudonym financial analyst ATHHunter when I contacted her via direct message,
    “the name indicated doubt of hodler culture and served to weed out bagholders.
    There wasn''t an iota of doubt in my mind that was a project that was going to
    be making waves.


    So what went wrong? Patterson: ‘It was Wallace''s plan all along, since before
    the genesis block attack, we all know him from his previous work but he was willing
    to burn his reputation to effect this scam. We only apologize to TotalScamCoin
    investors and assure them we are pursuing this option at this time, including
    a second fork.”


    TotalScamCoin investors, many of whom had been co-ordinating a pump in defiance
    of federal holding legislation, rushing to liquidate their holdings, offloading
    onto anyone who will take them. ATHHunter: ‘There will be a dead cat bounce, there
    always is, unless you have a trading bot close to a operation I wouldn''t take
    the risk of being left holding that coin when the music stops. Watch out for pumpers.


    Wise words. As I found out when I checked the smart contract that my Grandmother
    used to put coins in me to save for later, you can never trust wise words—especially
    when someone else controls the keys. We played, Grandma, we played.'
