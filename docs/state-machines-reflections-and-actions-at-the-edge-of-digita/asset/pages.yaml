  md: '# ART


    # 801


    Various artists and activists have engaged themselves in recreating, extending,
    or adopting personas in order to unearth or unsett a foe larger than themselves.
    One worth mentioning is the mysterious multiple identities of female artist(s)
    Karen Blissett. During the process of becoming multiple, Karen claimed to be the
    offspring of the legendary Neocist radical collective identity, Luther Blissett
    and Karen Eliot. Karen Blissett grew up with Web 2.0, exploiting the uncertainty
    surrounding her ''real girl'' status. She carries on the unconventional traditions
    of disruptive and exploratory net-based identities from earlier 90s, audio-visual
    software artists NN aka Notchka Nenezvana aka Nameless Bododies, and more recent
    human-bot combos as Angel F, a baby Artificial Intelligence by Salvatore laconi
    and Persona Oscar Art is Open Source.


    Karen''s ontology rhymes with Piratbyn''s chatbot OmniHal, programmed to welcome
    users to their Internet Relay Chat (used for years by a group of friends to devise,
    plan, and develop the philosophies, software, and parties that underpinned a particular
    flowering of free culture on the Internet). Over time the bot mimics the words
    and concerns of the IRC users, filling the channel with echoes of previous exchanges
    creating a sense of belonging and conviviality.28


    Morone''s intention to reclaim again while immersed within data-driven networks,
    protocols, and algorithms, constitutes a style of Post-Ford cyborg-activism. In
    The Cyborg: A Treatise on The Artificial Man, Antonia Caronia says that today''s
    cyborg is forced into a process of capitalistic growth that sees no difference
    between work and leisure, ''between the office and playground, and between times
    of public and private life.''29 Simon Penny puts out that one of the ''classic
    techno-utopian myths of computers is that access is a liberation, and the results
    will be, by definition, democratizing.30 His critique of networked technology
    and the dreams it points now to the dire trouble and unexpected consequences of
    these utopian dreams.31 Morone''s cyborg presence is not techno-utopian, or transhuman,
    with grand claims of how technology is and how it will save us all in the Ray
    Kurzweil well sense. Her is a activist of contrast to Kurzweil''s seemingly optimistic,
    privileged chant, which tells us more about his lack of grounded knowledge in
    the world. By interrogating the relationship with proprietary systems and re-examining
    the conditions and affairs of black boxes and the systems of techno-cultural production,
    we can disrupt the mechanisms that dominate the conversations around art, technology,
    life, and economy. In fact, Tatiana Bazzicheelli puts forward the notion of disruptive
    business and that it ''becomes a means for describing immense practices of hackers,
    artists, networkers and entrepreneurs.''32 Morone invoking copies for tracing
    is a disruption like those proposed by Bazzicelli:


