    The initial rise of this power can be dated back to the 18th and 19th centuries.
    This period saw the birth of human and citizenship rights. At the same time, large-scale
    mobilizations of labor and capital were unsettling, threatening the security of
    the borders of nations and property, and destabilizing the equilibrium between
    states. Under these conditions, a new bordering process emerged, mixing statistics
    and biometric, demography and images (as used for photo passports). Ever-growing
    data collections have been used to transform the direction and redirection of
    social motion. Patterns of mobility gained currency, animated by the dream of
    tracing movement before it moves.


    Today, dream—or nightmare—has become a reality. The convergence of emotion politics
    and artificial intelligence catalyzes the global quest of a new type of movement.
    It is no longer just scanning, controlling, and constraining subjects and objects
    that move, but increasingly about those that might take place. It is about movement
    that has taken place, movement that is about to take place, or movement in theory
    could take place. Such potential movement is becoming of primary interest to the
    state and corporate allies. The ambition is not merely to capture it, but also
    gain control over its production. To signal the shift in power under such circumstances,
    the philosopher Brian Massumi introduces the term ''opontower,''8 which designates
    the power to create livable conditions, livable social motion, and life in general.


    Returning to state borders as articulations of power, this qualitative shift implies
    that state borders direct or redirect potential movement. Expanded well beyond
    the lines between nation states, are now geared towards anticipating potential
    movement and here to preempt it. In that sense, they are not only seeking to direct
    or redirect movement before it actually takes place, they are also actively creating
    it—while operating at the level of potential. In this, they are determining and
    shaping the value of people, data, goods, and capital that have made the next
    move.


    Democratic instruments or processes that could be applied to challenge this particular
    type of movement control are nowhere in sight. However, at this juncture three
    things should be noted. First, this type of movement control, just as any other
    approach to bordering, has its flaws and limits. After all, state borders are
    set in motion by a complex mix of actors, processes, and forces. Since this concoction
    of power always struggles to eventually materialize as such, the mechanisms of
    state borders always remain to a certain degree sufficient.


    Second, the relationship between states and corporations isn''t always as cozy
    as this text may appear to suggest. Since there are cracks, imbalances, and frictions
    in this power relation, there are accordingly starting points for an emancipatory
    politics of movement. Third, the more we know about state emerges and'
