  md: '# RISING ABOVE SILOS


    YIANNIS COLAKIDES, MARC GARRETT, INTELO GLOERICH


    The world only spins forward. We will be citizens.

    The time has come. [...] The Great Work Begins.¹


    While Jeff Bezos and Elon Musk made headlines in 2018 by devising space retreats
    for the elite, the United Nations'' Intergovernmental Panel on Climate Change
    (IPCC), sup-ported by many scientists, warned of a major, looming environmental
    catastrophe that would strike by 2030². Meanwhile, governments remain preoccupied
    with spending billions of euros on protecting their geographical boundaries by
    building walls—both physical, like those in the USA, Turkey, Saudi Arabia, and
    Hungary, and ideological, such as those that have surfaced in the Brexit debate,
    and other elections elect the world. On the technological front, machines of surveillance
    and control are being developed and are proliferating exponentially, including
    iris, face, and voice recognition software, fingerprinting, DNA, accelerometers,
    IP and MAC address trackers, as microchip subdermal implants connected with external
    databases. Many of these technologies are used in combination with an already
    advanced GPS hardwired into most devices. Described by Apple CEO Tim Cook as being
    of a “data industrial complex”, the protected technologies and some government
    agencies are granted access. Similarly to how, historically, media spread the
    messages of pre-internet protest movements, it is those who control the algorithms
    have power to influence public opinion today.


    State Machines is a collaborative, EU-funded project which started in 2017. Discussions
    between the partners, Aksiora (SI)⁴ Drugo More (HR)⁵ Furtherfield (UK)⁶ Institute
    of Network Cultures (NL)⁷ and NeMe (CY)⁸ have centered around increasing inequality
    in the power of a tumultuous year and the need to create workable alternatives
    and inclusive futures. How can we learn to think beyond the limits of the neoliberal
    and extremist nationalist logics that shape the world around us? And, how do we
    respond to this new world order made up of algorithmic news feeds, high-frequency
    trading, ge, and for citizenship? We distilled our questions into an overarching
    motif: “What tools do we need to understand this, and how can contemporary forms
    of cultural production assist in envisioning and enabling other futures?”⁹


