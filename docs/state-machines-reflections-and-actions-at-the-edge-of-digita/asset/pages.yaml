    of the internet. In the network environment, being smart in creating new lists
    became the way to displace old lists of relevance, the way to dismantle canons,
    the way to learn. The way to become relevant.


    # The Academic Syllabus Migrates Online


    #Syllabus interventions are a challenge issued by political struggles to educators
    as they expose a fundamental contradiction in the operations of academia. While
    critical pedagogies of yesteryear''s social movements have become integrated into
    the education system, the radical lessons that these pedagogies teach students
    don''t easily reconcile with their experience: professional practice courses,
    the rhetoric of employability and community internships, what they learn is merely
    instrumental, tal, leaves them wondering how on earth they are to apply their
    Marxism or feminism to their everyday life?


    Cognitive dissonance is at the basis of degrees in the liberal arts. And to make
    worse, the marketization of higher education, the growing fees and the privatization
    of research has placed universities in a position where they are increasingly
    struggle to provide institutional space for critical interventions in social reality.
    As universities become more dependent on the ''customer satisfaction'' of their
    students for survival, they steer away from heated political topics or from supporting
    faculty members who decide to engage with them. Borrowing the words of Stefano
    Harney and Fred Moten,'
