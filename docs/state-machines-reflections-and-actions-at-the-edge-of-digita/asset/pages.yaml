  md: '# APPENDIX 859


    Lídia Pereira is an independent designer, artist and researcher based in Rotterdam.
    She graduated in Communication Design from the School of Fine Arts in Porto and
    Media and Communication from the Piet Zwart Institute in Rotterdam. She is the
    founding editor of the Pervasive Labour union (2015), a project offering a low-barrier
    entry level for contributors to express their views on social media.


    Erica Scott is an artist and writer. Her work explores biographical writing and
    bodily inscription in the performance and representation of subjectivity. Solo
    shows includes Chief Compliant (American, London) and Spill Sections (StudioRCA);
    group shows include The High Line, New York, Welcome Collection, Kunsthalle Wien.
    Her writing has been published in Spells: 21st Century Poetry and Fiction Method
    among others. She is guest editor of the Happy Hypocrite journal and will be resident
    at Porto, Lithuania, in summer 2019. She is currently undertaking a practice-based
    AHRC-funded PhD at Goldsmiths'' Art Department.


    Rebecca Stein is a cultural anthropologist at Duke University researching linkages
    between culture and politics in the context of the Israeli military occupation
    and legacy of the Palestinian dispossession. She is the author of Digital Militarism:
    Israel''s Occupation in the Social Media Age (with Adi Kuntsman) and Itineraries
    in Conflict: Israelis, Palestinians, and co-editor of Palestine, Israel, and the
    Politics of Popular Culture.


    Cassie Thornton works under the title of the Feminist Economics Department. She
    uses writing, visual art, hypocrisy, experimental research, tours, and radio to
    protect the unknown and reveal debt as a source of solidarity. Her work investigates
    the impact of governmental and economic systems on public affect, behavior, and
    the unconscious, with a focus on debt and security.


    Paul Vance is an artist working in Emerging Media forms and a professor at the
    University at Buffalo. His artwork addresses complex issues raised by varied techno-sciences
    as a medium. His artworks have included data collection devices that examine the
    ramifications of policing and categorization, and genetic experiments that undermine
    scientific constructions of race and identity.


    Patricia de Vries is a researcher and project coordinator at the Institute of
    Network Cultures, Amsterdam, and a PhD candidate at Erasmus University, Rotterdam.
    She is also a cat herder. Her research focuses on imaginative algorithms as a
    source of anxiety. More about her can be found at www.networkcultures.org/contesting-cap-technology.


    Krystian Wozznicki is a critic and the co-founder of Berliner Gazette (linergazette.de).
    He has recently published book Fugitive Belonging blends writing and photography.
    Other publications include A Guide to the Snowden Files (with Magdalena Taube),
    After the Planes (with Brian Massumi), Wer hat Angst vor Gemeinschaft? (with Jean-Lucy
    Nancy) and Abschalten. Paradiesproduktion, Massentismus und Globalisierung.'
