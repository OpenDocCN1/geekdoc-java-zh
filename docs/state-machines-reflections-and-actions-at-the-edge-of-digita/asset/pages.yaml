    # Conclusion


    What''s missing is an analysis of visual and auditory pattern recognition for
    the subversion of machinic agency. The identified methods for hacking pattern
    recognition mostly as artistic practices and scientific argument about adversarial
    examples that can potentially be scaled up. Imagine a point in the future where
    some of these techniques are in smartphone cameras or photo editing software.
    A fuller understanding of this can be facilitated by populating the blind spot
    in case of studies with specific labor-related examples of the subversion of machinic
    agency in visual and auditory pattern recognition. Uber and Delivero drivers,
    Amazon pickers, and others subjected to pattern recognition techniques have surely
    found their own methods of circumventing or hiding certain aspects of artificial
    intelligence, which I would be to learn about.


    # Epilog: Labor


    Artist Sebastian Schmieg has conducted research into the gig economy, where humans
    carry out micro-tasks in low-paid (Amazon Turk) or non-paid (Google Captcha solving)
    ways. He maintains: "Artificial intelligence is an approximation and that it might
    as well do (some of) our jobs. But it is first and foremost a scheme to frame
    work into tasks that can be done anywhere 24/7, and to make this labour invisible."⁴⁸
    He Further argues that the current hype around artificial intelligence is not
    rooted in better algorithms and techniques, but more so in the underpaid, or non-paid
    workforce that is tagging large, image-recognition training sets. If there was
    a workers'' union aware of the fact that this is actual labor, it would be interested
    in knowing more about and applying the adversarial methods collected above.⁹


