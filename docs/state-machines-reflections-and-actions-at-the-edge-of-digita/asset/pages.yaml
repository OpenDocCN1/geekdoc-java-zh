  md: '# HOW TO HACK ARTIFICIAL INTELLIGENCE


    # FRANCIS HUNGER


    # A Drunken Night


    At the end of a night of bass music, dancing, and talking in a rough, Leipzig
    cel club, the issue of artificial intelligence became the center of a heated,
    drunken discussion. It was beautiful: at four o''clock in the morning, the vividness
    of thought was intoxicated by fatigue, unfulfilled and fulfilled desires, and
    the state of post-transcendence through heavy dancing. The common theme of this
    discussion was how artificial intelligence would potentially answer all questions
    based on existing knowledge and finally ensl humankind.


    Techno-angelists as well as critics tend to present so-called ''artificial intelligence''
    as an all-encompassing and able technology that will fundamentally change our
    lives. However, this narrative ignores that the automation and mechanization of
    the human ability to create meaning has been a continuous process for decades,
    and that we are already in a phase where, for instance, many jobs have been automated.
    To provide a grand narrative, totalitarian visions of technological singularity
    focus on a point where mechanic recognition is misleading albeit labeled, suppressing
    human intelligence (which is, indeed, a much deeper, poorly anchored complexity).
    This happens in a situation where anti-totalitarian, leftist have decided to abstain
    from grand narratives against a backdrop of not-yet-reviewed Stalinism, and failure
    of real realism.


    While I criticized hacker communities as male dominated and techno centric in
    the early 00s, and my criticism still holds to a certain degree, questioning a
    grand narrative of all-encompassing techno-rationality is one of the important
    moments when human agency disturbs the putatively all-encompassing technosphere.
    Hackers, artists, and scientists have begun to work with adversarial patterns
    to test existing machine recognition techniques or to initiate critical discussion
    of their consequences. They create disturbances and misreadings of trained neural
    networks that are calculated using incoming data,


    +   1 In a former article, I argued that there is no intelligence in ''artificial
    intelligence'' and that it should be enhanced pattern recognition. To make it
    easier for the reader and for search engines to categorize this text, I will use
    the term ''artificial intelligence'' against better knowledge. See: Francis Hunger,
    ''Artificial Des-Intelligence or Why Machines Will Not Take over the World. At
    Least Not Now. Part I: Is No Artificial Intelligence.'' Databasecultures, http://databasecultures.imrielin.org/artificial-des/-


    +   2 Most of the scientists presented here have received government and industry
    funding, which is partly disclosed in academic papers. Artists have partly received
    funding from art foundations for particular projects, disclosed on their websites.


    +   3 Wikipedia gives a decent explanation of neural networks, and so does Machine
    Learning for Artists at mlaa.github.io/'
