    14 Rebecca L. Stein, ‘GoPro Operation: Networked Cameras, Israeli Military Rule,
    and the Digital Promise,’ Current Anthropology 58.15 (February, 2017): S56–S64.

    15 Larkin, Sarkar and Noise, p. 62.'
