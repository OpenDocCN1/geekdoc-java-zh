    AND COMPUTATIONAL METAPHORS IN BIOTECHNOLOGY


    # PAUL VANOUSE


    > If this works, for God''s sake this is incredibly important [...] it wasn''t
    really obvious if this does work it will change everything.

    —Kary Mullis¹


