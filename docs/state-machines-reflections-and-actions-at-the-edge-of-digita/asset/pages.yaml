  md: '# STATE MACHINES


    marketable goods and services.¹²³ By claiming corporate ownership over her own
    personal data she breaks down the abstraction and ambiguity of what was there
    before. Morone, the founder of her corporation, turns over her skills, capital,
    possessions, and intellectual property to it, the corporation, and becomes it
    its assets and increase its value. This includes Morone''s identity. Her name,
    appearance, and IP addresses become the brand and trademark; thus, her mental
    abilities (knowledge) are processes and strategies; her physical abilities are
    equipment; her biological functions are products; her data is the corporation''s
    property; and the shares are her. These all assets that she can capitalize on.
    Debt is turned into the corporation''s liability, which actually increases her—that
    is, the company’s—value if it were to be sold.¹⁴ It is a symbiotic relationship
    and also an appropriation on both sides. Morone, “[A] corporation is not just
    a series of legal protocols, it is a state of mind. Life as a corporation is not
    for the lazy, nor for the forgetful.¹⁵


    Morone’s video, Meeting Minutes, was made a year after she had made the decision
    to exist as a corporation. The video shows three versions of herself attending
    an annual board meeting. This is a playful critique demonstrating herself non-patriarchal
    convening. It’s a startling contrast against the male-dominated business meetings
    are typically used to. The video illustrates how Morone has taken on multiple
    identities to order the different roles and tasks to become a corporation.


    See Fig. 2 in the Gallery (p. 44).


    You might have everything that you are—mentally


    Morone has created a pharmaceutical business that produces Rejuvan, a hormone
    therapy made from dehydroandroosterone (DHEA). It is one of the most abundant
    circulating steroids in humans, and is produced in the adrenal glands, the ovaries,
    and the brain, where it functions as a metabolic intermediate in the biosynthesis
    of androgen and estrogen steroids. It also acts as a neurosteroid and neurootropin
    used as medication or dietary supplement. Morone’s satirical promotional method
    for her product Rejuvan explains, high doses may cause aggressiveness, irritability,
    trouble sleeping, and the growth of body or facial hair on women. It may also
    stop menstruation and lower levels of HDL (‘good’) cholesterol, which could increase
    the risk of heart disease. Side effects include acne, rhythm problems, liver problems,
    hair loss (from the scalp), and oily skin. It may also alter the body’s regulation
    of blood sugar.⁷


