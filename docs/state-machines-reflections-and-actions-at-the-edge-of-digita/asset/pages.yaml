    rent, exchange, or invest the data for her own profit.³37 Morone has also made
    Lure and Repel as her production line, “two scents from her pheromone molecules,
    respectively, attract and repel men.³38 Haraway proposes that the ‘proper state
    for a Western person is to have ownership of the self, to have and hold a core
    identity as it were a possession,’ and that not to have property in the self is
    not to be a subject, and so not to have agency.³⁴⁰ Morone certainly fits this
    strategy.


    Reclaiming the freedoms curtailed and diverted by powers that is a powerful and
    intelligent action. Morone has bravely entered into an exploratory zone, designing
    a new edge, a new venture for the avant-garde. Like Morone, we need to deconstruct
    and unveil this hidden world we are all hostage to. If we actively reclaim our
    digital selves and take responsibility, and these clandestine transactions occur
    every second of the day as part of the all-seeing eye, the Netoption, we may stand
    a chance of owning our social contexts, networked futures, and on our own terms.
    If this does not happen, at least we would not have fallen to our knees, submissive
    and ignorant of the meta forces working to exploit and redefine us. At least we
    would have had disruptions with the explorers with our eyes.


