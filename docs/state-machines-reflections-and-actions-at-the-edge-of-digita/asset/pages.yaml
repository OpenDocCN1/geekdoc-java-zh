  md: 'not uncontrollable. The manner of the spectre, the sounds of the alarm going
    off, suggest that algorithmic trading is not defined by its technological infrastructure
    alone but all more with how it is managed. Fragments on Machines seems to suggest
    that we are not fully left to our own devices, and neither should we render algorithmic
    technology beyond intervention and control. Specters and flood may provide a partial
    answer to present-day technological determinism and neoliberal formalism, as these
    figures offer fatalism and determinism up to those narratives and possibilities,
    to the chance of imagining and doing things another.


    On the one hand, there is finiteness, represented as the technical infrastructure
    of algorithmic trading. On the other hand, there is future possibility. Fragments
    on Machines could be considered as a form of artistic resistance against global
    financial capitalism, and the algorithmic trading on its markets as an all-encompassing
    totalling, a regime that knows no ''end'', ''no alternatives'', ''no exits'',
    and ''no outside'', against a kind of thinking that asserts everything that has
    only meaning in relation to this totalizing frame. The figure of the spectre in
    particular represents a shift in the identification with a certain way of imagining
    and life is born-like the collike you look like you''ve just seen a ghost''. Moreover,
    the spectre as an ''unstable'' frame nullifies the conformity and arrogance of
    totalizing frames and may help to imagine and mobilize different futures and endings
    of automated capitalism.³33 In the end, and to Murakami, imagination is the place
    for defeats and victories.


