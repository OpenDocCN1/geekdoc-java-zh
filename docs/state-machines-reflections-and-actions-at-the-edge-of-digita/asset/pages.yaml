  md: '# Obfuscation


    When drawing from a platform is not desirable or easy, adding misleading information
    (that will consequently be added to the platform database) can be an effective
    form of disguise. Brunton and Nissenbaum call obfuscation "the deliberate addition
    of ambiguous, confusing, or misleading information to interfere with surveillance
    and data collection.\³¹ They acknowledge the power imbalance between individuals
    living ever more closely under surveillance and the large entities that collect
    data about them. Obfuscation adds to systems, wresting back control from opaque
    data collection methods.


    Nissenbaum has co-developed a tool for obfuscation. The browser extension TrackMeNot
    corrupts a search engine''s profile of an individual by automatically entering
    random search queries. "Our search behaviors reflect who we are, what we care
    about, and how we live ours.\³² Running in the background, TrackMeNot''s search
    terms add so many false signals that an individual''s genuine search become impossible
    to distinguish from the flood of superfluous information. TrackMeNot works in
    a similar way to privacy like Virtual Private Networks (VPNs) and The Onion Router
    (Tor); that is, disguising a computer''s signals so the connections it makes appears
    to be from a different device or location,³³ and taking a longer and more complex
    path to a destination to wo off surveillance mechanisms.\⁴


    When TrackMeNot, VPNs, and Tor aim to obfuscate personal data by adding extra,
    unrelated data, interventions into facial recognition technologies. Adam Harvey
    has developed two such obfuscation projects. CV Dazzle is a line of hairstyling
    and makeup design that adds extra, signals that defeat facial recognition. The
    CV Dazzle project includes samples, with works on cheeks and foreheads, as well
    as style fringes and geometric patterns. "Partially obscure one of the ocular
    regions," Harvey advises. "The position and darkness of the eyes is a key facial
    feature." Harvey says obfuscates identity to a machine, but not another human
    being. A crucial element in this form of obfuscation is that the person is still
    recognizable to other people, without contributing to facial recognition databases.


    Harvey has expanded on CV Dazzle with another answer to invasive data collection
    called HyperFace, a camouflage print that introduces noise into computer vision
    algorithms, reducing the confidence score of facial recognition. The prototype
    is a fabric that looks heavily pixelated, jumbled faces. Wearing the print as
    a scarf, near a human face, obfuscates the actual face by adding misleading signals.
