    There is always violence inherent in financialization that emerges, under pressure,
    whenever it is deployed. Financialization expands and amplifies existing inequalities,
    and ripples across domains and disciplines. It is not possible for it to do otherwise,
    nor is it possible to have it for so-called ‘good’. This is as true of the marketing
    of national identity pioneered by&P and abetted by SCL Group as of the wholesale
    financialization of personal data and social relationships brought to its acne
    by Facebook and by Cambridge Analytics. The question that remains for artists
    and other practitioners working in this field and interested in its questions
    is whether interventions within such a system can produce meaningful change, or
    will only support and amplify existing inequalities and violence.


    I’ve spent the last few years researching citizenship-by-investment and free trade
    areas (which allow for different corporate laws and permissive practices to be
    deployed within particular areas), freports and seaseads, blockchain and what
    supposedly emancipatory inhuman and asset-based protocols for identity management,
    and new forms of algorithmic citizenship depends whose surveillance and the acquiescence
    of powers.¹² Perceiving these technologies as the logic of ‘state machines’, and
    from the perspective of a technologist and artist, I’ve sought lines of code that
    could be cut and pasted, stolen outright, or refactored to more emancipatory ends.
    I am not sure if I still believe in this approach. These technologies are tainted
    at the source by their very emergence within citizenship and the inherently racist
    logic of the nation state itself. They are too easily commanded and redeployed
    by those with access to more network nodes, greater carrying capacity, bandwidth,
    processing power and data storage—in short, by those with access to capital.


