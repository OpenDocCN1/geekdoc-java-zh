  md: '# ANALYSIS


    So why should one talk about a deficient product? The case of Google Translate
    shows how the global proliferation of such a web service caters to the facilitation
    and acceleration of movement. The imperatives to feel free: don''t think about
    you are about to enter a realm of the French, the Chinese, or the Spanish language,
    just move! This digitally enhanced movement (with embodied movement and disembodied
    movement) is facilitated by a number of other services that are complementary
    to the translation service, such as search, map, and maps.


    Google, one of the world''s dominant IT superpowers, produces an all-encompassing
    portfolio of web services that facilitate movement. The disclosures by Snowden
    show that this global player collaborates with the cyber-security projects of
    the USA and other states. The services of this company are used across the planet,
    enabling the country to accumulate massive amounts of data that, in turn, are
    used to classify, sort, channel and manage the world''s population. This is a
    population, that, in some way or other, is always in motion: cycling, shopping,
    visiting friends, going to the doctor, travelling abroad, or even having a rest,
    which can be considered a type of micro-movement.


    Meanwhile, the algorithmic analysis of information on the basis of associated
    location data is making rapid progress. Industries are being established that
    create movement profiles of people with the aid of metadata. Is metadata covered
    by protection laws? Ostensibly, it is not as it is relevant to the sphere of personal
    privacy. Snowden''s disclosures, however, demonstrate the contrary. Metadata becomespersonal
    and hyperpolitical when the question of political control shifts from ''what people
    are communicating about each other'' to ''to whom, where, and how often are people
    connected to each other?'' This shift from the content of communications to the
    metadata of communications enables the capture of movement in ever more all-encompassing
    ways. Be it online or offline, or both simultaneously, the question of political
    control becomes ''with whom, where, and how are people moving?''


    # Data-Driven State Borders


    The case of Google Translate and its shortcomings is telling for another reason.
    What is nonsense for humans is not nonsense for machines. Machines have different
    criteria for establishing sense. Understanding this is becoming more and more
    important, since ever greater tasks, even in the realm of state work (e.g. administrative
    processes), are being delegated to machines and automated processes under algorithmic
    governance. This includes policing, warfare, secret services and intelligence,
    traffic control, and so-called national security in general. In short, the power
    of the state is becoming increasingly mediated by artificial intelligence and
    big data based analytics. And this, of course, also holds true for state borders—indeed,
    that these integrations are tested and perfected.


    A case in point is the EU agency Frontex, a border management agency that trains,
    manages and coordinates the border guards of almost 30 European countries. Using
    predictive data-driven methods, this organization tries to preempt the movement
    of migrants, arriving before the migrants themselves so as to make life-or-death
    decisions that determine the movement of people. The European'
