  md: '# ANALYSES


    19


    both from within and without.² What the new technologies of the state continually
    reveal, unwittingly and often in opposition to their stated goals, is the incredible
    diversity and uncomputability of their subject at the level of the individual
    and at the level of physical geography. Through the network, we are all already
    transnational, which is revealed by social media and international finance as
    clearly as our lived experience. At the same time, the accelerating and leveling
    actions of anthropogenic climate change forcibly remind us that borders will not
    protect us from what happens beyond the horizon. People are on the move, as are
    whole ecosystems, from deserts engulfing fertile lands across the Middle East
    and spurring conflict and migration to forests breaching up and marching northwards
    in response to the transformation of atmosphere.


    The question then becomes, what might oppose capital as the growing rhizome of
    replaces the state? What preexisting forms are inherently networked, bounded but
    shifting, infinitely diverse, and resistant to capitalization? One answer to this
    is the world itself; that is, the category of things that includes us, non-human
    animals, plant life, minerals, and their attendant processes—what Jane Bennett
    calls the ‘ecology of things’ or ‘vibrant matter.’ Ecology has its own vocabulary
    of states and constituents, and participants, who are never fixed or bounded,
    and they provide a template with what to think and rethink our notions of place
    and connectivity. The challenge is to view these things anew in light of what
    we have learned and can learn still from our technologies, because ecological
    plea can be if it simply entails going backwards, rejecting the impatient possibilities
    of new systemic forms.


    In computer science, the term ‘state’ refers to the information retained by a
    system (a service, application, or device) between interactions. From the perspective
    of an ecosystem, our reliance on states of interactions seems like original, relying
    on giving and giving up ownership of data and representations to exhaust—servers,
    corporations, governments—and their subsequent retention and weaponization, whether
    in the form of access to information, surveillance, manipulation, and the granting
    and withholding of freedom of movement. ‘Stateless’, on the other hand, relies
    on trust and generosity, and on the individual’s agency within the larger systems
    it moves through and inhabits. This is the model that is inherent to the World
    Wide Web—‘small people, loosely joined’—and to the web of life.


