    structures that have become accustomed to—with empty hands and empty pockets.


    ![](img/9368612621623914fd97a718446b85a4_229_0.png)


    Fig. 5: Good care.


    And then, the last important structural aspect of the Hologram project is the
    real kicker, and touches on the mystery of what it means to be human outside of
    clientelist capitalism—that the real ''healing'' (if we want to say it) when the
    person is at the center of care, turns outward to care for someone else. This
    is the secret sauce, the goal, and the desired by-product of every holographic
    meeting: to allow people to feel that they are not broken and that their healing
    is bound up in the health and liberation of others.


    ![](img/9368612621623914fd97a718446b85a4_229_1.png)


