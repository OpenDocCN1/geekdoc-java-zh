  md: 'In my disruptive loop, artists and hackers use disruptive techniques of networking
    in the framework of social media and web-based services to generate new modalities
    for using, which, in some cases, are unpredictable and critical; business enterprises
    disruption as a form of innovation to create new markets and network values, which
    are also often unpredictable. Networked disruption is a place where the opposition
    coexist, and it is a reconfiguration of practices into a structure of mutual feedback
    instead of opposition.³³⁴


    In 2016, Brian Christian and cognitive scientist Tom Griffiths wrote a book called
    Algorithms to Live by: The Computer Science of Human Decisions. Their premise
    was that computer algorithms not only be mysterious and abstract, but can also
    untangle very questions. These range from making better decisions to ''finding
    a spouse to finding a parking spot, or questioning one''s inbox to understanding
    the workings of memory [...] into strategies for human living.³³⁵ In her ground-breaking-essay,
    Donna Haraway says,


    > [Or] bodies, ourselves; are maps of power and identity. Cyborgs are no exception.
    A body is not innocent; it was not born in a garden; it does not seek unitary
    identity and generate antagonistic dualisms without end (or the world ends); it
    seeks irony for granted. [...] Intense pleasure in machine, skill, ceases to be
    a sin, but an aspect of embodiment.³³⁶


    Morone''s actions relate to Haraway''s call in that she is taking responsibility
    for the technology she is using and facing the techno-devil head on, and not hiding
    away in the hope that things might get better. Morone''s approach is exactly what
    Haraway proposes in her latest publication which asks us to learn to live with
    the trouble of living and dying on a damaged earth or see into ecological devastation.³⁷


    See Fig. 4 in the Gallery (p. 45).


    Morone proves in the fact that the disruption she shows means others can also
    do. It would be great if there was a start of something when punk picked up their
    instruments to forge a new era of social change? Where outsiders, amateurs, and
    the working classes suddenly found a voice and a place for their artistic freedoms
    of expression? For a brief period of time DIY culture, music, and politics emerged
    from its subcultures influencing mainstream culture and the media? Perhaps the
    DIY attitude of Morone can reach individuals and groups no longer content with
    sitting on the sidelines as dissatisfied consumers, just letting the dry.


    Morone sets herself in the long tradition of subversive affirmation, translating
    into a clear, powerful narrative working the workings of extreme capitalism, the
    economic system in


