  md: '# STATE TO STATELESS MACHINES:

    À TRAJECTORY¹


    # JAMES BRIDLE


    St. Kitts and Nevis is an island nation in the Eastern Caribbean, twin fragments
    of an ancient volcano wreathed in clouds and rainforest, and rising out of the
    deep blue waters of the Antilles. At just over a hundred square miles, and fifty-five
    thousand or residents, it is the smallest sovereign state in the Western Hemisphere.
    At the turn of the millennium, the islands'' economy was in trouble: sugar production,
    the dominant industry since the 40s, had declined to such a degree that the government
    was forced to shutter the state-owned sugar company, closing down refineries and
    leaving former plantations derelict. St. Kitts and Nevis had never developed strong
    tourism nor, like some of their neighbors, had taken advantage of complex tax
    laws to lure international finance to its shores. By starting in 2006, the country
    was to find itself a pioneer in a new kind of industry, one which traded not in
    offshore, but in the very stuff of nation: the right to claim citizenship.


    In 2006, a Swiss lawyer named Christian Kalin arrived in St. Kitts with a proposal.
    He wanted to reconstruct the country''s decades-old citizenship laws to enable
    wealthy individuals from overseas to become a St. Kitts and Nevis passport. Kalin
    was a key figure in Henley and Partners (H&P), an obscure wealth management firm
    in Zürich, and while many of his clients could lucratively move their money around
    the world, moving with it was more troublesome to do. In China, Russia, and many
    other countries wanted the ability to travel freely to the places where they wanted
    to spend their money: namely, North America and Europe, which had strict entry
    requirements for visitors of many nationalities. St. Kitts passport holders, however,
    including Canada, the United States, and the European Union. Under the express
    purview of the President of St. Kitts and Nevis, a deal was made: anyone willing
    to invest a few hundred thousand dollars in the islands could acquire a precious
    St. Kitts passport. The deal specified that each investment was to include US400,000
    spent on real estate and, in consequence, land value rocked and luxury condos
    perched along the seafronts of Basseterre and Charleston. Although, as there was
    no requirement for these new citizens to actually live in the country, these properties
    were mostly empty. A neat piece of continuity, a further $250,000 were earmarked
    for the Sugar Industry Diversification Foundation, a charitable trust set up by
    Kalin and intended to generate jobs for those who had lost work in the cane fields.
    Significantly, the trust''s altruism has been called into question because it
    has never made its accounts public. It has


