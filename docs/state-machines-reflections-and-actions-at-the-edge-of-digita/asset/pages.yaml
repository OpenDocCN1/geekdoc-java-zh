    CT: The entire time I lived in the Bay Area I was precarious and indebted. I only
    survived thrived because of the networks of solidarity and mutual aid I participated
    in. As the city gentrified beyond imagination, I was forced to leave. I didn''t
    want to let those networks die. So, at first, the people who involved were me—people
    really trying to have a stake in a place that didn''t know how to value people
    over estate and capital.


    The Hologram project developed when I knew I was leaving the city for good, and
    I invited a group of previously employed, transient activists, and artists to
    get together in the Bay Area for a week of working together. We figured out ways
    to share responsibility for our mutual economic and social needs. This project
    was the Intentional Community in Exile (ICE the ICE was always there, now an even
    more intense reference) and grew out of an opportunity offered by Heavy Breathing⁹
    to chore an event at The Berkeley Art Museum. We were allowed to go above and
    beyond by invite a group of eight women from across the U.S. to choreograph methods
    of mutual aid: sharing resources, discussing common problems, and developing methods
    for cooperating to co-develop an economic and social infrastructure that would
    allow us to thrive together, interdependent. What would it mean for our as activists
    and artists to feel that we have roots within an intentional community, even if
    we didn''t have the experience of property that makes most people feel at home?


    See Fig. 1 and 2 in the Gallery (p. 46).


