  md: 'In the summer of 2011, I performed an algorithm. Harnessing the elemental powers
    of fire and water with four tiny, capped tubes containing minute quantities of
    my own DNA, chemical reagents, and extracted polymerase from the Thermus aquaticus
    bacterium (Taq), I performed the Polymerase Chain Reaction (PCR), PCR was invented
    in 1984 and quickly became one of the most influential biotechnologies of the
    20th century. PCR is an algorithm that is fundamental to DNA cloning, DNA sequencing,
    DNA fingerprinting, and a myriad of medical, forensic, and search applications.
    The algorithm comprises the following steps: heat tubes to 94°C; cool tubes to
    72°C; repeat these steps 40 times. What was peculiar about my artistic performance
    is that PCR is typically performed in a laboratory by a Thermocycler, which controls
    these precise temperature requirements to copy DNA. My artistic performance, *Deep
    Woods PCR*, was an anachronistic, manual re-enactment in which I demonstrated
    the algorithm, while tilling cafe anedotes of the history of the invention, with
    the intent of situating one of the most groundbreaking-technologies of the 20th
    century in social context.


    In this article, I explain on my original performance by describing some 20th
    century influences and imperatives between chemical, computational, and life sciences
    that provide a context for PCR, and how PCR likewise influenced and impacted other
    social entities, institutions, technologies, and power relations. A jumping-off
    point, I explain a little more about the technology of PCR and its economic metaphors
    to highlight the multitude of computational and engineering metaphors that shaped
    the field of biology in the 20th century, such as DNA as a code or a database.
    In contrast, I show how PCR was replaced by more dynamic models such as chemical
    reactions inspiring and fostering computational and engineering metaphors in contemporary
    biotechnology. Lastly, I explore how computational metaphors also make profound
    influences and corollaries, such as exponential and chaotic chemical reactions,
    and leaving comforts, such as the atomic bomb. Biotechnology is incredibly powerful,
    yet difficult to contain, and vastly misunderstood by most non-experts. However,
    as contemporary programs, like genetic engineering, synthetic biology, and genomic
    medicine, increasingly move biotechnology out of the lab and ''into the field''
    (that is our world, our lives, our ecosystems), there is a great deal in how we
    make sense of it.


    The exact process of PCR is described well in Wikipedia:


    The vast majority of PCR methods rely on repeated heating and cooling to permit
    different temperature-dependent reactions—DNA melting and enzyme-driven replication.
    PCR employs two reagents—primers (which are short single DNA fragments from oligonucleotides
    that are complementary sequence to the target DNA region) and a DNA polymerase.
    In the first step of PCR, the two strands of the double helix are physically separated
    at a high temperature in a process called DNA melting. In the second step, the
    temperature is lowered and the primers bind to the complementary sequences of
    DNA. The two DNA strands then become templates for DNA polymerase to enzymatically
    assemble a new DNA strand from free nucleotides, the building blocks of DNA. As
    PCR progresses, the DNA generated is itself used as a template for'
