  md: '# ACTIONS


    glances,allows humor, and minor acts of solidarity and kindness that allow proletarians
    to reproduce life under exploitation.¹ Virno argues that such defunction are based
    not on the logic of desperation (''you have nothing to lose but your chains'')
    but ''on the basis of a latent wealth, or an abundance of possibilities.''


    There is a large body of work that both seeks to explain and critique this notion
    of exodus, but I maintain the concept''s more poetic and ambiguous dimensions
    precisely because I think these help us expand our imagination to encompass the
    core question with which I begin: What would it mean to see money *not* as The
    State does, but to conceptualize monetary innovation, disruption, and hacking
    from a proletarian currency with another (even if the other is plural or even
    ''decentralized'')? What would it mean to reject the Oedipal dream of seeking
    to replace one authoritarian currency with another? I pose the question for the
    purpose of collective meditation: What would it mean to draw on the traces of
    the proletarian traditions noted here to rethink with what we desire from money,
    in order to question our utopian impulse to use money to ''fix'' society? What
    would the currency of exodus be?


    Scores of convict ships were left at sea on their way to the colonies, many of
    them to mutiny. Many boys, including George Washington ''Bo'' Hughes, disappeared
    without a trace. It is rumored, when the Eisbergfreiheit drifted out to sea, were
    people who had, supposedly, made the meltering chunk of their home, presumably
    preserving its topographical austerity to the unnecessary, all-to-human humanity
    of post-war Lübeck, and not all were accounted for after most were rescued. Imagine
    now a parallel universe where all these exiles from the history of capitalist-colonial
    accumulation met. What would they have invented to gather, convicts, hobobs, and
    debtors? And, what would and courage can we adopt from their former story to change
    our own seemingly foreseen present?⁸


