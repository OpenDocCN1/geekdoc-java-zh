    # Databases are Used to Profit Companies Rather than Benefit Individuals


    When it comes to how platforms use personal data, privacy scholars Finn Brunton
    and Helen Nissenbaum say that we don''t know what they know. Photos uploaded to
    Facebook one day may be cross-referenced with facial recognition software, or
    even scanned for card numbers or license plates. Therefore, the collection of
    information takes place in asymmetrical power relationships²⁴ and is not necessarily
    how the web was originally designed. Berners-Lee argues that if users generate
    data that is useful and valuable, they should be able to access it themselves.
    But, as digital media scholar Andrejevic reminds us, even if individuals could
    access their own data, they wouldn''t be able to analyze it in ways that make
    it commercially productive unless they also had access to the rest of the database.
    He calls this the ''big data divide''; that is, companies that can purchase and
    use large data sets exclude them from access to data, expertise, and processing
    power²⁵.


    # Databases Categorize People in Ways that Deep Discrimination


    As I illustrated, the collection of information about me in databases gets some
    things right, and misses or misrepresents others. The examples I raised were benign,
    though, mistaking my football search for interests in sports does not impact me
    in a way. But, placing people into predetermined categories that do not always
    fit can disadvantage vulnerable groups. When autocomplete relies on previous queries
    to search for something, these automated results can create stereotypes and biases.
    Linguistics scholars Paul Baker and Amanda Potts have investigated how harmful
    results can arise when searching on Google for ''why do day...'', receiving the
    following autocomplete answers:


