    # The Biometric Cage


    Artist Zach Blas has addressed the violence of biometric facial recognition by
    model-ing Face Cages resembling the vectors that recognition algorithms may ''draw''
    on a face. ''Face Cages is a dramatization of the abstract violence of the biometric
    dia-gram. In this installation and performance work, four queer artists, including
    Micha Cárdenas, Elle Mehrmand, Paul Mpagi Sepaya, and Zach Blas, generate biometric
    diagrams of their faces, which are then fabricated as three-dimensional metal
    objects, evoking a material resistance with handcuffs, prison bars, and torture
    devices [...].¹⁹ Although originally not advertised by the artist to disturb recognition,
    a quick test with the OpenCV Haarcascade neural network for face detection shows,
    that these metals actually obfuscate basic biometric data. However, the actual
    usefulness of these ''camouflage masks'' in daily life is something that remains
    to be researched in the future.²⁰


    See Fig. 8 (on p. 37).


