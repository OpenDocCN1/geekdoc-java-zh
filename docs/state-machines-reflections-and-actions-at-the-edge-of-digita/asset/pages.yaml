- img_proc: true
  md: 'tweets and webcasting from a million people watched its video feed on livestream
    alone, while more consumers consumed the activists'' footage on television news.
    Shortly after its forcible seizure by Israeli commanders, the flotilla had stayed
    in touch with the world outside the Israeli navy''s efforts to jam its communications.
    The Israeli state and mainstream public analyzed the event through the lens of
    its public relations impact, bemoaning the ''flotilla fiasco'' and its imprint
    on the international image of the Jewish state.¹⁰


    The problem was not categorical absence of military media production. Their social
    media team had employed popular platforms to argue their case for boarding and
    diverting the aid vessels, and the images and footage shot by the military''s
    crew at the site of the naval raid were strong, so their spokespersons believed,
    and succeeded in denying the sanctioned story of flotilla terrorists in the guise
    of humanity, thereby justifying the military actions that followed. Rather, the
    problem was the lack of an operational plan for raid media clearance and publication,
    in a manner prior to military formulation of an integrated social media strategy
    for in the field. There were also infrastructural and technological limitations:
    in 2010, the military lacked the satellite technologies necessary to live-stream
    images directly from the site of the naval raid back to headquarters. The military
    had to physically transport the footage—saved on a money stick—by air and land
    to headquarters for processing, and circulation.


    But the naval raid didn''t go as planned (''We didn''t expect a lynch,'' I was
    told by a military spokesperson), and the plan to ''chopper out video footage''
    to be revised, with helicopters needed to transport seven injured naval commandos.¹¹
    As a result, the military''s images only reached the Israeli and international
    public even hours after the operation. This time-lag was also the result of internal
    disagreement within branches of the military: while the office of the spokesperson
    pressed for rapid question with an eye to PR grants, the navy feared that their
    forces under attack would reveal military tactics and damage their international
    reputation and morale. All would agree, in the event''s aftermath, on the scale
    of the attendant media disaster. In the words of one Israeli pundit: ''For a country
    so technologically advanced and with such acute public diplomacy challenges, fail
    miserably in preparing a communications offensive over the new media is a failure
    of strategic proportions.''²


    In 2014, I spoke with former high-ranking officer in the military''s spokesperson''s
    unit about the lessons of the Mavi Marmara incident, which he and others marked
    as a turning point in the military''s understanding of the necessity of the real-time
    PR image. Sitting with him in Jerusalem, he described the protracted movement
    of the military''s footage in question and the international limitations involved:
    ''There were physical obstacles getting the material out and what was a big deal
