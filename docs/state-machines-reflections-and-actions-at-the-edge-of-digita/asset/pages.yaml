    The Mavi Marmara case. There wasn''t live broadcasting back to the military, so
    they actually had to chop out video footage.'' I asked for clarification about
    the process and the limitations involved, and he tried to reconstruct the chain
    of events:


    **Military:** Just imagine that footage comes in, and it takes a couple of hours
    to get it out to Tel Aviv headquarters...


    **RS:** And at that point the footage was helicoptered...


    **Military:** Yes, if I remember correctly there was a combination of helicopter
    and motorcycles... but [it takes a reach] the right office in the navy and a while
    to climb the ladder until it gets to the head of the navy. And the head of navy
    says ''no'' so it goes back down to the spokesperson in the navy, and goes to
    the top of the spokesperson''s unit. And that guy goes up the head of the navy...[and
    so on]. And here you can see it taking a long time... The IDF is Israel''s largest
    organization, so it''s going to take a while for things to get through.


    It was an episode of protracted circulation that the military would return to
    and over again within internal reassessment of the media operations. What followed
    was a wholesale rethinking of the importance of timeliness where media circulation
    was concerned. There had long been an awareness of the importance of the visual
    field as a PR domain—military spokesperson would stress in interviews. What changed
    in 2010 was the emphasis on time of circulation. Military spokesperson Peterner
    put this way in my interview with him in 2014:


    The images were well enough to be in the core of the IDF, but what happened in
    2010 was that we could not count the claims that were coming off the Marmara boat
    with alternate footage because of plan of action was to fly the footage of the
    boat and bring it to be edited rather than have it broadcasted. It''s not that
    the technology wasn''t harnessed within the military at the time, but that it
    just wasn''t a plan of action for the IDF spokesperson''s unit. That realization
    did initiate a shift in the spokesperson unit about the types of capabilities
    that were required, including the capability to stream live footage from the field
    to the headquarters, and the ability to actually edit it, I''d said, the golden
    hour that we can distribute it soon as possible.


    The repetitions evident in these two accounts of the ''flotta failure'' deliver
    a media crisis of 2010—with its protracted terms of footage circulation, with
    the laborious efforts required to move images from the framed and branches of
    the military for clearance, with the consequences that lay in the lack of an action
    plan—loomed large in institutional memory. This failure to act in the ''golden
    hour as a military wake-up call, and internal efforts to upgrade their PR speed
    would follow. They sought an end to this institutionalized delay—a gap in which
    the military loses the public relations battle to their enemy—a population unencumbered
    by the problem of complex bureaucracies or verification protocols. Once the problem
    of timeliness had been solved, they believe, the military''s story could be delivered
    without interruptions. The ever elusive ''victory image'' would finally be secured.'
