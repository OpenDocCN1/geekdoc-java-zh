  md: '# THERE IS NO ANONYMITY IN THE DATABASE


    # EMILY VAN DER NAGEL


    # Introduction


    Scrolling through my Facebook feed, I notice advertisements on the sidebar and
    inter- rupting my posts about travel, babies, and the beginning of spring. I know
    these ads are targeted to me. And, although I can''t remember exactly what I had
    searched for or clicked or Linked that has added me to a database of potential
    customers- everywhere, I can guess.


    A woman''s clothing company has released a new collection. And popping up makes
    sense; I''m wearing one of their jumpers right now, which I bought online, so
    clearly a connection has been made anywhere. Another ad shows a young, white woman
    in a lady dress and elaborate hat. She resembles some of the demograph- I belong
    to—I''m a young, white woman, too. But her image is part of an ad for a betting
    company with a special offer for the upcoming Spring Racing Carnival. I''m in
    Melbourne where the carnival is held, so the location matches. But, I have abs-olutely
    no interest in gambling or horse racing, so I regard the ad as an algorithmic
    inaccuracy and keep scrolling.


    By assessing the relevance of Facebook ads to me, I have been forming intuitive,
    causal explanations about how the algorithms work. I may or not be right, but
    I in various ways which I have modified, commodified, and included in various
    databases as I move through social media platforms every day. As a result, I''m
    beginning to wonder if this information excites me, and can be sold and strategically
    deployed by advertisers and social media platforms, can ever truly be anonymous?
    The idea that databases erode anonymity is a provocation; to call what we''re
    giving away when we populate the content fields of our social profiles. We (re)created
    in the form of a database when we create profiles, post content, tweet, email,
    search, browse, and make purchases online. And when such extensive information
    about us is stored in databases that are increasingly networked, this has implications
    for how we understand our identity.


    In this chapter, I first consider the concept of data and the digitizing of the
    data-base to historic represent all kinds of people. We''ve been sorted into different
    categories and demographics. My earlier self-reflection that I am a young, white,
    Australian woman reflects the way I have internalized the categories to which
    I am most assigned; that, is, the ways I am similar to and different from—other
    individuals and groups of


