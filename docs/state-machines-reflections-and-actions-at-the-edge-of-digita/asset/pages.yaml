    So, here is a guide to hacking pattern recognition and disturbing the technocratic
    dreams of engineers, managers, businesses, and government agencies. It delves
    into a number of tactics and the adversarial methods of abusing sight, changing
    color, altered or trap iconography, adding perturbation, sensor blast, camouflage
    masking, camouflage surroundings, starting an arms race by machine un/ - input
    tuning, and being obscure. I was surprised by the variety and scope of these practices
    and I will walk you through them in the hope that this overview provokes further
    inquiry and discussion.


    # Case Files


    Do Neural Networks Dream of Sheep?

    Janelle Shane looked into how neural networks miscategorize information. In her
    article “Do Neural Nets Dream of Electric Sheep?”, Shane discusses miscategorizations
    of Microsoft’s Azure Computer Vision API, used for creating image captions. Shane
    points out that the underlying training data seems to be fuzzy in many landscape
    sheep detected, where there are actually none. “Starting with no knowledge at
    all of what it seeing, the neural network had to make rules about which images
    she labeled ‘sheep’. And it looks like hasn''t realized that sheep means the actual
    animal, not just of treeless grassness.


    The author then links how this pattern recognition API can be further tricked,
    picking out that the neural network only looks for sheep where it actually expects
    them, in a landscape setting. ‘Put the sheep on leashes, and they’re labeled as
    dogs. Put them in cats, and they’re dogs or cats. If they’re in the water, they
    could end up being labeled as birds or polar bears. [B] Bring sheep indoors, and
    pick a sheep (or a goat) in your arms, and they’re labeled as dogs’, Shane says
    mockingly of the neural network. I call this ‘abuse of scope’ method. It applies
    when you can determine or reverse-engineer (aka guess) the scope and domain to
    which a neural network is directed, and insert information that is beyond the
    scope. The ‘abuse of scope’ method could be used for photo collages that trick
    a neural network, while maintaining relevant information to humans.


    See Fig. 1 in the Gallery (p. 35).


    Shane went a step further and asked Twitter followers for images depicting sheep.
    Richard Leeming came with a photo taken in the English countryside depicting sheep
    dyed orange in order to deter people from stealing the animals.


    See Fig. 2 in the Gallery (p. 35).


