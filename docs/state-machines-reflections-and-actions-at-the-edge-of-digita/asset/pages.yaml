  md: 'zone doesn''t need money: it can''t sustain an economy and it will immensely
    melt back into the ocean. And yet what has revealed in the Eisbergfriedstadt episode
    and exhibition is that, when money is detached from functionality and from the
    dreams of the economic architect, when it is allowed to become part of an economy
    of creative social improvement, money can become a medium of collective joy, and
    a kind of proletarian utopianism. The Eisbergfriedstadt Notgeld, if it really
    existed or if it exists as a fiction (and in a way) is essentially a playing theatre,
    a shared resource for a virtuosity of the commons where, amidst the darkest, most
    chaotic movements of people''s lives, a shared world emerged from the fabric of
    the cooperative human imagination.68 This is a reflection of Cornelius Castoriadis
    called the tectonic magma of the radical imagination; that substance of destructive
    and creative potential out of which all formations, institutions, and orders are
    gealed, but also periodically sweeps away those remnants.69


    # Currencies of the Undercommon


    There have, of course, been radical, political reappropriations of money. At the
    turn of the century, suffragettes famously carved ''VOT FOR WOMEN'' on British
    shillings as part of an escapist repertoire of direct actions.70 In the 70s, the
    Brazilian artist Cido Meires stamped with subversive messages and passed them
    back into circulation to avoid censors and repression by the reining military
    junta.71 More recent, artist Joseph DeLappe carved and distributed rubber stamps
    that imprint money with silhouettes of predator drones, of people with their hands
    up, and of ocean waves to draw attention to the extrajudicial assassination program,
    the movement for black lives, and climate change, respectively.72


    These are noteworthy examples, but I''d like to consider a more ambiguous note.
    The proletarian money and currency disruptions explored in this chapter are typically
    categorized by collectors and as economia: money-objects that do not function
    as money; a curiously innocent deconstructed concept that if were once. ''Eco''
    derives from the ancient Greek prefix for ''out'', often used to refer to the
    outside or the alien; ''nomia'' refers to money by a way of reference to practices,
    a root that also gives us the legal, political, and philosophical notion of ''nomos''
    or ''law'', an encrypted meaning of ''exonomi'' that is outside of customary laws.
    Similarly, we interpret the practices noted here as


