    # Autonomous Trap and Perturbation


    In his work Autonomous Trap 001, James Bridle9 used ritual magic against the backdrop
    of Mount Parnassus in Central Greece—the site of Oracle of Delphi. He created
    a magic split, circle of road marks that could trap an autonomous car by letting
    it in, but not letting out. This example is based on Bridle''s approaches to building
    an autonomous car using pattern recognition technology with a LiDAR (Light Detection
    and Ranging) sensors or video sensors. Called ''trap iconography,'' refers to
    intentionally installed, painted, or otherwise applied sign or graph, which when
    being recorded and processed devices use neural networks.


    See Fig. 3 in the Gallery (p. 36).


    Somewhat similar to trap iconography, the ''altered iconography'' method adds
    elements to existing signs—mostly roads or house numbers—to mislead neural networks.
    This has a long tradition; for instance, in times of war, street name signs or
    signs were removed or altered to misinform the enemy. Today, this method has the
    potential to disturb autonomous cars that rely on streets to evaluate a road situation,
    as deciding which car takes priority at a crossing. It can be used on a small
    scale, for instance through distributing cheap stickers near autonomous car test-drive
    ranges. A less poetic version of Autonomous Trap 001 was tested in 2018 against
    deep neural networks by a group of scientists. The results were published in an
    article called ''Robust Physical-World Attacks on Deep Learning Models.'' The
    scientists applied black and white stickers to an actual stop sign, causing a
    100% recognition failure under conditions and 85% failure recording video in a
    field test driving a car. Whether this real-world test shows that systems used
    for autonomous cars need improvement or that autonomous cars won''t exist if there
    isn''t also a complete infrastructure in place is for discussion.


    See Fig. 4 in the Gallery (p. 36).


