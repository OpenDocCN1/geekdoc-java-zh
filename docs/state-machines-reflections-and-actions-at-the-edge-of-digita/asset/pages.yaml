    There is a tension between the human desire to tell stories and the computational
    database that automates platforms. As humans, we use platforms to tell stories
    about ourselves. For some, this means using platforms to get human expression
    and connection. For others, like digital scholar John Cheney-Lippold, this means
    that people increasingly understand themselves through database logics. He argues
    that we have become temporary members of emergent categories based on our data.
    The complexities of our lives are flattened out when we are categorized in this
    way.^15 Being sorted into the category of ''woman'' is in-political: it has implications
    for the information and advertising that become visible to me I navigate these
    platforms.


    Marketing scholars Zwick and Nikhilesh Dholakia argue that these postodemographic
    categories, or measurable types, mean that individuals become constituted as consumer
    identities.^16 Although these databases are not revealed publicly, Zwick and Dholakia
    claim that we get glimpses into how these database identities are mobilized—just
    like when I notice ads Facebook displays to me. The opacity of these databases
    leads to a more systematic consideration of four main issues for why the theme
    algorithmic, measurable, postodemographic identities operate.


