  md: '# ANALYSES


    majority of the population is abandoned and rendered invisible, as drags on growth.
    This unequal atrophy leads to more and more people being displaced and denied
    political and economic participation in states and markets. Meanwhile, state borders
    are recalibrated to manage movements inside and outside this austere economic
    space.


    With historic numbers of migrants crossing state borders, the dynamics of expulsion
    are gaining dramatic urgency. These dynamics are generating an ever-growing population,
    with millions of people forced to create survival economies, wage semi-invisible
    struggles against discrimination and criminalization, and to generate equally
    unrepresented fights for the commons and wealth in general. This development is
    gaining momentum in societies where both legalized and illegalized movement constantly
    produces traces, as well as necessary material for big data technologies and for
    new forms of modernity. Oscar Gandy’s groundbreaking research on the algorithmic
    procedures of “social sorting” illustrates how companies are using big data to
    identify good customers and economically valuable demographics.6 Predicting will
    be valuable in the future also implies the possibility of designating who will
    be worth—or, even, worthless. To translate this state borders means to evaluate
    people’s potential for future markets, and to classify some as others as something
    else altogether. “Economic actors once crucial to the development of capitalism,”
    Saskia Sassen diagnose, have ceased ceased as the system is sorted out and expected
    to remain silent and irrelevant.


    While there is still a lot of uncertainty regarding the real potentials of big
    data and artificial intelligence in the mere rumor of their operational mode has
    consequences. In spite of social sorting still being in its infancy, the sociological
    and psychological processes of sorting are already well advanced. The relationship
    between imaginary and actual social sorting is reciprocal. The resonant influence
    of this multi-layered narrative makes it increasingly difficult for people to
    think of society outside the categories and processes of this narrative.


    In this context, social sorting can be seen as an ambivalent technology through
    which one can comprehend the contemporary predicament. Fear of expulsion alone
    is enough to generate compliance, apathy, and self-censorship. It sabotages the
    implementation and the democratic cocreation of futures.


    # Blackboxed Infrastructure


    The entanglements between politics and technology close scrutiny. Admittedly,
    looking more closely is hard, if not impossible, the unofficial—or least visible—borders
    of state enforce whose mechanisms are in motion by a blackboxed infrastructure.
    This is an infrastructure that consists of the networks organized by human traffickers
    and smugglers; of rubber boats, border posts, hotspots, registration offices,
    emergency accommodation, shelters for asylum seekers, deportation detention centers,
    and departure flights.


    +   6 Oscar Gandy, The Panoptic Sort: A Political Economy of Personal Information,
    Boulder: Westview Press, 1993.


    +   7 Sassen, Expulsions.'
