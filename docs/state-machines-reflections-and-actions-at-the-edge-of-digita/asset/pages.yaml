  md: 'Regardless of the political inclinations of these campaigns, targeted political
    ads are nothing new within this context. The difference lies in the fact that,
    in this case, it is Facebook, and not some third-party corrector henchman, who
    has access to the vast wealth of data of all its users contribute to its platform
    (whether explicitly or implicitly). Facebook then algorithmically processes this
    data into actionable target audiences that advertisers can select.


    Furthermore, there is not but one few actors whose business models, being similar
    to that of Facebook, necessarily require their users to cede control over which
    of their data are collected, used, and processed. Providing access to actionable
    audiences and insights achieved through massive scale of data processing and analysis
    is how these companies are able to operate free of charge and still achieve profits
    of US$40 billion (2017) in the case of Facebook and US$110 billion (2017) in the
    case of Google.38


    # Metrics of Anxiety


    Within the context of researchers at the New Economics Foundation found the ''score
    society'',39 there is an observable tendency towards the deployment of highly
    personalized psychological profiles across the public and private sectors for
    the purposes of, among others, targeting, policing, and decisionmaking. Duncan
    McCann and Miranda Hall described the ''score society'' grounded on a ''mutually
    reinforcing government-corporation surveillance'' architecture, where access to
    public and private services (e.g. housing, healthcare, insurance) is determined
    based on whether digital profile matches the required conditions for access.40


    As illustrated by the Facebook patent US950752B2, these psychological profiles
    may be inherited through the processing of different sorts of data and metadata,
    whether explicitly or implicitly contributed. In their article ''What''s Your
    Score? How Discriminatory Algorithms Control Access and Opportunity'', Hall and
    McCann offer the example of fintech as a pioneer in ''the use of "alternative
    data" to reflect individuals''''true personality''; one example is Tala, a credit
    tool that determines loan eligibility based on a score calculated on the basis
    of, for example how many times someone calls their mother.41


    The tendency seems to be that these measurements increasingly affect the way we
    perceive and control ourselves, seeing that we are all becoming the more dependent
    on an efficiency-obsessed technocratic machine for everyday access to basic human
    needs. Writing about the influence of neoliberal metrics on mental health, David
    Beer seems to arrive at similar conclusions as Curran and Hill. Regarding metrics
    that spark an emotional response in the measured body, where shame and anxiety
    are not uncommon. This emotional response is key because by reacting


