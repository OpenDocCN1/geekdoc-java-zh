  md: 'walls or facilitate financially aided undone of them, but media technology
    is also becoming a ubiquitous staple of state control in countries around the
    world, such as state-run media status in Israel (Rebecca L. Stein).


    The use of digital technology to reinforce state ideology is not restricted to
    militarized zones. Research on the effectiveness of CCTV cameras in the reduction
    of crime is from conclusive¹³ and, despite concerns over privacy, the technology
    is as popular as ever. In 2021, for example, it is estimated that there was one
    camera for every 32 citizens in the UK, operated by both the state and the private
    sector.¹⁴ Adding facial recognition and other tracking technology to mean that
    our being in the world is operationalized in ways that are increasingly hard to
    notice. Many artists, activists, and hackers are working to undermine and distort
    these technologies or to counteract their effects without impacting human interactions;
    for example, through gaps glowing with ultraviolet light or scares designed to
    show off facial-recognition artificial intelligence (AI) (Francis Hunger; Emily
    Van Nagel)


    Activist strategies against some of the unwanted effects of state-implemented
    technologies are not new. Currencies, for example are so spread that are hardly
    recognizable as technology, and alternatives largely remain locked in the ideologies
    they purport to oppose. While blockchain-based cryptocurrencies are the disruption
    jour, there is a long history of ''alt-coins'' that create new ways and means
    as they travel from one hand to the next. What can we recover from the creativity
    and insubordination was associated with ''hob nickels'' and ''convict live tokens''
    from centuries past (Max Haiven); when looking at the blockchain, how can we move
    beyond the ninth cryptocurrency in being or trying to find the one chain to rule
    all (Rob Myers)? We can then put activism and artistic exploration and imagination
    in creating technologies that are truly disruptive of the status quo (Max Dovey)?


    Meanwhile, as a financial asset is expanding into new dimensions on the blockchain.
    No longer functioning as something to be experienced, analyzed, or viewed, artworks
    now be effective in new ways while they are tucked away in impenetrable, climate-controlled
    freeways. Visible as smart contracts in the brief, continual moments, they are
    exchanged across the world without ever changing location (Rachel O''Dwyer). This
    spectral (dis)appearance is something that is associated with trading and more
    money than doesn''t do to deconstruct the perceived blackbox of finance. What
    is the language we use to describe the financial and technological systems that
    hold us in their grip is far from ideal (Paul Vanouse), and perhaps a radical,
    activist reclaiming of agency is needed. Perhaps the individual has to become
    a corporate actor in order to get


