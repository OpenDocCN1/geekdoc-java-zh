  md: '# INTRODUCTION


    sort of purchase on the algorithmic forces that are shaping society today (Marc
    Garrett). Perhaps we need to follow the flexibility and reassembling of identity
    through Lynn Hershman Leeson (interviewed by Marc Garrett) allows her audience
    to explore and build a place of human fluidity in the midst of technologies of
    precision.


    On a political level, we''re seeing the dramatic consequences of austerity politics
    in many countries all over the world. Business is never far away, always ready
    to fill the gaping holes by retreating governments. In particular, healthcare
    is a universal sector when we need to smooth the but often ethically debatable
    start-ups. When affordable professional care is not an option, it is now possible,
    for example, to treat your depression by talking to a bot with a smartphone app
    (Lidia Pereira). Acting against the need for these algorithmic systems is Cassie
    Thorne (interviewed by Marc Garrett), who is setting up feathered, bottom-up networks
    of health support in the context of the economic crisis in Greece. Beyond the
    immediate and destructive reality of people living in crisis-ridden areas, the
    influence of capitalist logics is creeping into all aspects of life and personal
    relationships (Helen Kaplanski)


    Systems of knowledge distribution are influential for the kinds of activist behavior
    that inspire and facilitate. There''s a rich history of pirate libraries, devices,
    and networks that have carved alternative forms of knowledge and strong communities
    around mutual sharing and new building. Activist groups like Black Lives Matter
    have added variety and social network effects into the mix by distributing their
    syllabi on social media, allowing information to have effects beyond its usual
    gardens (Valeria Graziano, Marcell Mars, and Tomislav Necad)


    The contents of this book light on on the ideas and activities currently resisting
    hegemony, systemic violations of often talked about but seldom cited human rights
    (this is the right of recognition (Article 6), right of privacy (Article 12),
    right to nationality (Article 15), etc.). This book stresses that, if we want
    to, claim our right to a healthier, freer, and more egalitarian future. As we
    adapt to this undulating terrain, we need to forge new forms of agency by rising
    above the silos we are used to do. Then, maybe, we will be emotionally and strategically
    equipped to face the 21st century asks of us.


