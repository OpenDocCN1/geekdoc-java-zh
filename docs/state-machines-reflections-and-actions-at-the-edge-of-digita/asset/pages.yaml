    In this climate, I''m increasingly scared to train a Hologram to share herself
    with others. Is it safe enough? Is she resilient enough? Patience may or not know
    how to provide the long-term stability, attention, and gentle curiosity that she
    may need in order to benefit from this practice. Will there be enough time given
    by the group for the Patience to learn how to be patient, and curious about someone
    else''s life? People are resilient, but people are hurting, and time is ticking.
    And when people are hurting in our culture, they turn inward, and they may not
    be participating in something that their healing is bound upon you.


    Moreover, I am worried that this project, even though it is oriented towards empowerment,
    may feed into a culture obsessed with the cruel optimism of ''healing'', the sorrows
    of the individual become a black hole where radical politics goes to shrivel and
    die. I am worried that, if perceived in this way, it might take away from grassroots
    roots what strengthens it.


    And for all these reasons I fear this project, I also believe it is the best project
    I have come across the cornucopia of deeply unjust dispossessions that we are
