  md: '# LEARNING FROM #SYLLABUS


    VALERIA GRAZIANO, MARCELL MARS, TOMISLAV MEDAK


    > The syllabus is the manifesto of the 21st century.

    Dean Dockray and Benjamin Forster


    # #Syllabus Struggles


    In 2014, Michael Brown, an 18-year-old boy living in Ferguson, Missouri, was fatally
    killed by police officer Darren Wilson. Soon after, as the civil protests policing
    brutality and institutional racism began to mount across the United States, Dr.
    Marcia Chatalain, Associate Professor of History and African American Students
    at Georgetown University, launched an online call urging other academics and teachers
    ‘to devote the first day of classes to a conversation with Ferguson’ and ‘to recommend
    texts, collaborate on conversation starters, and inspire dialogue about some aspect
    of the Ferguson crisis¹² hashtag #FergusonSyllabus.


    Also in August 2014, using the hashtag #gamergate, groups of users on 4Chan, Twitter,
    and Reddit ignited a misogynistic harassment campaign against game developers
    Zoë Quinn and Brianna Wu, media critic Anita Sarkesian, as well as a number of
    other female and feminist producers, journalists, and critics. In the following
    weeks, The New Inquiry editors and contributors compiled a reading list and issued
    a call for suggestions for their ‘TNI Syllabus: Gaming and Feminism’³


    In June 2015, Donald Trump announced his candidacy for President of the United
    States. In the weeks that he became the Republican nominee, and The Chronicle
    of Higher Education introduced the syllabus “Trump 101”¹⁴ Historians N.D.B. Connolly
    and Keisha N. Blain ‘Trump 101 inadequate, ‘a mock college syllabus’...[from numerous
    egregious omissions and inaccuracies’ failing to include ‘contributions of scholars
    of color and address the critical issues of Trump’s racism, sexism, and xenophobia.
    They assembled Trump Syllabus 2.0’⁵ Soon after, in response to a video in which
    Trump engaged ‘an extremely well worded conversation about women’ with TV host
    Billy Bash, Laura Cielkowski put together a ‘Rare Culture Syllabus’⁶


