    3 ‘TNI Syllabus: Gaming and Feminism’, The New Inquiry, 2 September 2014, https://thenewquiry.com/tni-syllabus-gaming-and-feminism-/

    4 ‘Trump 101’, The Chronicle of Higher Education, 19 June 2016, https://www.chronicle.com/article/Trump-syllabus-23684/

    5 N.D.B. Connolly and Keisha N. Blain, ‘Trump Syllabus 2.0’, Public Books, 28
