  md: '# #Syllabus as a Media Object


    Besides its contextualization within the historical legacy of previous grassroots
    mobilizations, it is also necessary to discuss #Syllabus as a new media object
    in its right, in order to fully grasp its relevance for the future politics of
    knowledge production and transmission.


    If we were describe this object, a #Syllabus would be an ordered list of links
    to scholarly texts, news reports, and audiovisual media, mostly aggregated through
    a participatory and iterative process, and created in response to political events
    indicating orders of structural opposition. Still, as we have seen, #Syllabus
    as a media object doesn''t follow a strict format. It varies based on the initial
    vision of its initiators, political causes, and social composition of the relevant
    struggle. Nor does it follow the format of traditional academic. While a list
    of learning resources is the heart of any syllabus, a boilerplate university syllabus
    typically includes objectives, a timetable, attendance, coursework, and an examination
    of the outlining system used for the given course. Relieved of these institutional
    requirements, the #Syllabus includes only a reading list and a hashtag. The reading
    list provides resources for understanding what is relevant to the here and now,
    while the hashtag provides a way to disseminate across social networks the call
    to both collectively edit and teach what is relevant to Both the list and the
    hashtag are specifics and formal features of the contemporary (internet) culture
    and merit further exploration in the social dynamics at play in #Syllabus initiatives.


    The different phases of the internet''s development approached the problem of
    the discoverability of relevant information in different ways. In the early days,
    the Gopher protocol organized information into hierarchical file tree. With the
    rise of World Wide Web (WWW), Yahoo tried to employ experts to classify and catalog
    the internet into a directory of links. That seemed to be a successful approach
    for a while, but then Google (founded in 1998) came along and started to use a
    webgraph of links to rank the importance of web pages to a given search query.


    In 2005, Clay Shirky wrote the essay ‘Ontology is Overrated: Categories, Links
    and Tags’ from his earlier talk ‘Folksonomics and Tags: The Rise of User-Developed
    Classification’. Sherky used Yahoo''s attempt to categorize the WWW against any
    attempt to classify a vast heterogeneous body of information into a single hierarchical
    categorical system. In his words: ''[Yahoo] missed [...] that, if you''ve got
    enough links, you dont need the hierarchy anymore. There is no shelf. There is
    no file system. The links are alone enough.’ Those words resonated with many.
    By following simple formatting rules, we the internet users, Time magazine named
    Person of the Year in 2006, proved that it is possible to collectively write the
    largest encyclopedia ever. But, even beyond that, and as Shirky''s argument, if
    enough of us organized our own snippets of the vast body of the internet, we could
    replace old canons, ontologies with folksonomics, social bookmarks, and (hash)tags.


    15 Clay Shirky, ‘Ontology is Overrated: Categories, Links, and Tags’, 2005, http://shirky.com/writings/hereeverybody/ontology_overrated.html.'
