  md: '# STATE MACHINES


    of the Mediterranean, but stand as empty as their doubles on the websites of Chinese
    property firms. These luxury boxes are not really living spaces. They are safety
    deposit boxes for capital flight and payments on new identities, while the populations
    living in their shadows remain untouched by the local correction which feeds upon
    any new revenue.¹¹ Far worse awaits those whom market forces are forced forcibly,
    like the undocumented residents of Gulf states to accept paid-for citizenship
    in the far-off and impoverished archipelago of the Comoros.¹² But in an act of
    autocannibalism we should be familiar by now, never seem to fully grasp, the weightiest
    victim of the virtualization of citizenship will be the state itself.


    In The Invention of the Passport, historian and sociologist John Torpey describes
    the emergence of the passport as a process by which people ‘become dependent on
    states for the possession of an “identity” from which they can escape with difficulty
    and significantly shift their place to various spaces.’ But he emphasizes the
    ways in which the increased regulation of movement actively shaped the form of
    states themselves: ‘The emergence of passport and related controls on movement
    is an essential aspect of the “state-ness” of states.¹


