  md: 'There has a shift from analogue archives to digital databases. A key feature
    of digital databases, especially those produced by social media platforms, is
    the concept of ''dataification''.⁹ Heartbeats and birthdates are easy to count,
    record, and store. Other information, such as how much you like a high school
    acquaintance, is harder to quantify and measure. Because platforms have Friendships,
    Likes, comments, and photo tags embedded in the way people use them, they have
    created an infrastructure in which these aspects of our social lives have been
    turned into valuable consumer data.¹⁰


    Collating information from all over the web means that even without a name to
    unify the data, platforms end up knowing a lot about an individual. Information
    privacy law Daniel Solove solves:


    It is more possible to create an electronic collage that covers much of a person’s
    life—life captured in records, a digital person composed in the collective networks
    of the world.¹¹


    Because databases can be recombined and added to other kinds of information, sorting
