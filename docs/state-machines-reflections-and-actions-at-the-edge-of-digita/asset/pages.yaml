    With so at stake, in 1999, a decade after the first patent battle ended a new
    one went to court. This time, it was with Promega corporation over the Taq polymerase.
    Promega protested that Cetus scientists had fraudulently claimed to be the first
    to successfully purify Taq polymerase. However, Promega asserted Cetus'' research
    publications lacked the proper rigor of academic science in order to make this
    claim. The San Francisco court sided with Promega, the issue was far from settled.
    As Kara Swann notes, “It was overturned on appeal, it was contradicted by European
    patent law decisions, and it was never accepted by Roche or the Cetus participants.
    Promega continued to sell Taq polymerase, and the parties battled on before finally
    announcing a confidential settlement of all cases worldwide in September 2005.¹⁰¹¹


    # Computation-Inspired Biology


    Nineteen-four was a memorable year. The polymerase chain reaction (PCR) was described
    for the first time at the Cetus scientific meeting in Monterey, California–the
    Alta Summit meeting in Colorado was credited as the first significant event when
    the sequencing of the entire genome was seriously contemplated; and the infamous
    commercial for the Macintosh computer appeared¹²


    Biology as a coherent field emerged near the turn of the 19th century. It is characterized
    as the study of life and organisms including their structure, function, origin,
    distribution, and taxonomy.¹³ A fundamental principle of this science is that
    a cell is the unit of life. As scholars such as Georges Gaucihem, Michel Foucault,
    and Francois Jacob wrote, the field is distinct from its progenitor fields, such
    as medicine and natural history. Jacob writes, “With the start of the nineteenth
    century, a new science was to appear. Its aim was no longer to classify organisms,
    but to study the processes of life; its investigation was no longer visible, but
    discovery.¹⁴ The basic unit of study, therefore, changes from living organisms
    to the cell, its organization, or even life itself.


