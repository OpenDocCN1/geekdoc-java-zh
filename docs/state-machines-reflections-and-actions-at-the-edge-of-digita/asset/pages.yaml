    This contradiction and the tensions it brings to can be symptomatically observed
    in the recent evolution of the traditional academic syllabus. As a consequence
    of (some) critical pedagogies incorporated into the teaching process and universities
    striving to reduce their liability, academic syllabus become increasingly complex
    and demanding. They are now understood as a “social contract” between the teachers
    and their students, and “terms of service”19 between the institution providing
