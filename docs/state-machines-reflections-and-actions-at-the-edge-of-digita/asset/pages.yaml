    a public nightmare. And, indeed, Kahn & Selesnick offer the Eisbergstadt was commemorated
    on Notgeld notes. This exhibited a rare aesthetic exuber and imaginative panache
    during a time when many were starving amidst literals of money, when money was
    being burnt for warmth and desperately sewn into clothing for insulation. Some
    of this Notgeld have been issued by the Eisbergstadt itself, conjectural, free
    meat meeting its own currency through the power of imagination alone.


    See Fig. 7 in the Gallery (p. 34).


    85 years later, amidst the financial crisis of 2008, Kahn & Selesnick created,
    assembled and organized materials to the mythical Eisbergfreiheit created in an
    immersive exhibition.66 Replicas of the ‘original’ Notgeld pour of a suitcase,
    are stacked neatly in a wheelbarrow, and are stitched together into garments during
    the exhibition. Meanwhile, the bills appear in panoramic paintings, staged and
    archival photographs, and affixed to the walls. A huge replica of one of the bills
    hangs from a pole in the gallery''s ceiling, counterbalanced on the other end
    of the rope by a gallery, suspended by a thread. A house of cards, made of the
    Notgeld flock about the gallery, sits ominously on a plinth. In one of several
    panoramic paintings a man gondola of an air whose balloon is carried in the Notgeld.
    In another, a man tries to shoot down origami Notgeld with a bow and arrow. In
    yet another, human bodies with animal heads surrounded by suitcases of Notgeld
    on the iceberg.


    Much could be said about the Eisbergfreiheit, in terms of its moment in history
    as well as Kahn & Selesnick''s exhibition. The artists operate at the fraught
    threshold of fact and fiction to conjure the radical imagination. I am less interested
    in if the events actually occurred than what the myth make imaginable. My interests
    stem from the myth, and Notgeld, in general, seem to gesture an alternative horizon
    for money if we were reject a genealogy of top-down money invention and engineering
    insist pay attention to the ways in which the poor and the exploited have reappropriated
    money as slip resistance. What does it mean to create a currency for a temporary
    autonomous zone?67 From the perspective of almost any mainstream or heterodox
    economic of thought it is futile or purely aeshetic exercise.


    64 Hakim Bey, T.A.Z.: The Autonomous Zone, Ontological Anchor, Poetic Terrorism,
    2nd ed, New York: Autonomia, 2003.


    65 LaFe, ‘Eisbergfreiheit’.


    66 See http://kahnselesnick.biz/eisbergfreiheit-installations/


    67 Bey, T.A.Z.'
