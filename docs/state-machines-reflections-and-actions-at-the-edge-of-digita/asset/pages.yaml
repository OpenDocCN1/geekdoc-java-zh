    These examples, I think, triangulate something amorphous but vital when considering
    the future potentials of money. Writing against the temptation to ''see like a
    state'', Scott argues that whatever authoritarian orders ironically ignore and
    depend on the texture, nuance, and creativity of everyday life. The complex ecosystems
    of soil or a healthy ocean, which are made up of millions of cooperating, and
    coevolving life-forms from viruses to mammals, from fungi to insects, the social
    world that states seek to dominate all with transactional and gift economies that
    are just goofy, nonsensical, and weird as anything we''d find under a microscope.¹25
    Seeing like a state is the process of brutally simplifying and categorizing this
    vibrant complexity into observable, measurable, and distinct entities; in other
    words, into code.²26 While this impulse may have noble intentions, it is a violent
    one. In turn, ''seeing like a state'' demands acting like a state and therefore
    the imposition of sovereignty, violently if needs be, to order is maintained.¹²⁷


    The following examples, drawn from the most obscured margins, help us see the
    perspective of the state, which we have been encouraged to act as if it were natural.
    Rather than from the top, they reimagine money as a means of organizing life from
    the bottom. And they offer some important images for learning, again how to dream
    about decentralization and personal liberty as always entangled with mutual aid,
    class struggle, and collective labor. I echo Mirzoeff''s demand to reclaim the
    right to look, for those who are oppressed, exploited, and colonized to reclaim
