    A number of new mechanisms have emerged for art investment. These include the
    growth of art investment funds and clubs (where interested shareholders can invest
    in a part of a work) and the development of art-backed lending or art securitization
    (where owners can use works of art in their collections as security on future
    loans). In a turn away from traditional banks and large auction houses such as
    Christie''s and Sotheby''s, new boutique lenders such as Artemis and Athena, with
    a particular focus on art lending, have also entered the fray. So too, freports—high-security
    warehouses in offshore exchanges—have emerged as veritable ''banks'' for the fine-art
    collections of wealthy individuals and art dealers to exploit the duty-free storage
    conditions. More recently, blockchain companies, such as Maenas and the aforementioned
    Codex, are partnering with freports. They are also developing strategies for recording
    the provenance and circulation of art sales for creating new tokens that can be
    associated with artworks and traded as shares; and for facilitating the securitization
    of flows of capital on the blockchain. Arguably, many of the ''issues'' that arose
    with the Mahama piece—questions of provenance, contractual obligations and the
    technicalities of breaking a non-fungible, illiquid artwork into individual shares—are
    introduced by these infrastructures.


    # Technologies in the Global Art Market


    As alluded to, two technologies are particularly significant when considering
    this phenomenon and both play a role in the new globalized art market: the freport
    and the blockchain token.


    # Freeport


    Large parts of the collections of artworks which are called High Net Worth individuals
    (HNWI) now reside in ''freports''; that is, liminal, tax-free spaces that bypass
    national sovereignty. These large, high-security, climate-controlled spaces are
    often located in the transit zones of airports, or in tax-free or tax-friendly
    zones such as Switzerland or Singapore. Freports originated in the 19th century
    for the century to have a historical legacy in traditional trade, today they function
    as free-repositories for accumulated wealth, or what Deloitte''s ''passion assets''—fine
    wines, cars, and art that, once purchased, are to be stored and in the freport
    for an infinite amount of time.¹² Here, duty associated with a purchase can be
    endlessly deferred because, due to their fiscal policy, goods housed within the
    freport are deemed to be in transit from one place to another, even when they
    are nowhere any soon. For Keller Easterling, the freport creates a space of flows
    beyond state jurisdiction.¹³ Because of the ''offshore'' nature of space, artworks
    are stored indefinitely until the sale price


