    notes payable, and notes receivable. These will be those types of transactions.


    Although, just because the transactions are not always posted to the special journals
    they may still be posted to the subsidiary ledgers. The general journal is used
    to record all types of transactions. That means that it is a history of all the
    transactions that your company will have. Usually the transactions that are not
    posted and do not fit in the special journals are ones that are left over and
    are usually nonrecurring, dissimilar, or infrequent, for example, adjustments
    entries, closing entries, and correcting entries.'
