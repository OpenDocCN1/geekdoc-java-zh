    ### Office-in-home


    - Square footage of office space

    - Total square footage of home

    - Hours of use, if operating an in-home daycare

    - Mortgage interest or rent paid

    - Homeowner’s or renters’ insurance

    - Utilities

    - Cost of home, separate improvements and first date of business use


    - Wages paid to employees


    - Form W-2 and W-3

    - Federal and state payroll tax returns (Form 940, Form 941, etc.)

    - Employee benefit expense (This is to be aligned with “Wages paid to employees")


    ### Contractors

    - Form 1099-MISC

