    The other method for reporting is the indirect method. The only difference between
    the direct and the indirect methods is the operating activities. The basic rules
    for reconciling the accrued income to cash income for the indirect method are
    as follows:


    - ADD depreciation expense

    - ADD amortization expense

    - ADD loss on sale of equipment or other investments

    - SUBTRACT gain on sale of equipment or other investments

    - ADD decrease in current assets

    - SUBTRACT increase in current assets

    - ADD increase in current liabilities

    - SUBTRACT decrease in current liabilities


    It does not matter which method you use. The direct and indirect methods will
    show the same general information.


    # Chapter 15 – Financial Ratios


    We have covered a lot about the basics of accounting. As a bonus I wanted to add
    this section as a guide and a resource to you. As you progress with accounting
    you will soon learn that you need to analyze what is in those financial statements
    that we have covered and I am including statements that may be introduced to you
    at a later time. These ratio analyses provide another way for you to learn about
    the health of a company financially. Even if you do not want to work as an accountant
    or a bookkeeper, but yet you would like to invest your money, it is useful to
    know this chapter.


    Even though there are many ratios that you could learn and cover I am going to
    focus on the five primary groups. They are:


    1. Profit Ratios

    2. Debt Ratios

    3. Efficiency Ratios

    4. Equity Ratios

    5. Liquidity Ratios


    # Profit Ratios


    A profit ratio will show how profitable a company is. This will give managers,
    investors, and creditors a clear picture of how well a business is doing. This
    is also the most frequently used group of ratios.


    The operating margin ratio is the most used profit ratio. It will compare the
    income from operations to revenue.


    The operating margin is equal to a company’s income from operations divided by
    its net sales.


    - Operating margin = Income from operations / Net sale


    Another type of profit ratio is the return on assets ratio. This will analyze
    the relationship between net income and assets used to generate the income.


    - Return on assets = Net sales / {(Assets at end of year + Assets at beginning
    of year) / 2}


    # Debt Ratios


    The debt ratios give valuable information about the money a company owes. They
    will help creditors understand what portion of the debt is current and what portion
    is long term. It also determines the business’s level of debt compared to its
    equity and the relationship between the debt and revenue of the business.


    The debt-to-equity ratio is a common debt ratio. This ratio is usually presented
    as a percentage.


    - Debt-to-equity ratio = Total liabilities / Equity


    Another ratio that helps banks decide if they will lend your business money is
    the long-term liabilities to capital ratio.


    - Long-term capital structure = Long-term debt / (Long-term debt + Equity)


    # Efficiency Ratios


    Efficiency ratios are sometimes referred to as turnover ratios. These measure
    how efficiently the business is using various types of assets. One of the most
    critical is the cash asset.


    An efficiency ratio that measures the length of time to convert a sale to cash
    is the Days Sales Outstanding (DSO) ratio.


    - DSO = (Receivables / Total credit sales) * Days in the accounting period


    Keep in mind that the lower the result, the faster the company is collecting the
    cash it needs to sustain operations or its investments.


    # Equity Ratios


    Equity ratios are very important for investors as they are the ones that supply
    equity to the corporation by purchasing stock in that company. These types of
    ratios will help investors decide whether they should not buy stock in the company.


    A good ratio for this is the return on equity ratio. This will measure the relationship
    between net income and sales to equity.


    - Return on equity = Net income / {(Equity at beginning of the year + Equity at
    the end of the year) / 2}


    The higher the return on the equity means a better performance.


    # Liquidity Ratios


    Businesses and companies maintain balances of liquid and long-term assets. These
    are to ensure their current operations and long-term financial health. Therefore,
    it is important that managers have a good understanding of this through liquidity
    ratios.


    One example of these will be the current ratio. This ratio will determine if current
    assets cover the current liabilities. This should be greater than 1.


    - Current ratio = Total current assets / Total current liabilities


    Another ratio to remember is the working capital. This ratio will show how the
    current assets compare to its current liabilities. This number should always be
    positive. However, it could vary greatly.


    - Working capital = Current assets – Current liabilities


    Even though the formulas for these ratios are provided and straightforward it
    could be interpreted differently. Sometimes you will need to use a few different
    ratios to figure out how the company is doing.


    # Conclusion


    As we took this adventure into the accounting world I hope that you were able
    to learn some of the basics of accounting. Accounting is all around us. We use
    it in our everyday lives.


    This has only a brief outlook into accounting as there is so much more can be
    covered. The following will give you an idea of some of the other areas you may
    want to venture out into:


    - Tax preparation

    - computerized accounting

    - Financial statement analysis

    - Auditing

    - Government and not-for-profit


    As you can see there are so many aspects to accounting and bookkeeping. If you
    want to start your own business, be a bookkeeper, get a loan, or even have a bank
    account you should learn about this great art of numbers.

