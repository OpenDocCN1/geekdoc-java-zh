    # Sales Journal


    The subsidiary ledgers can be posted from either the general or special journals.
    Every company has sales. Therefore, one of the most common special journals is
    the sales journal.


    This journal will show all of the credit sales. Each entry will show in the sales
    journal and represent a debit to the customer''s account in the accounts receivable.
    It will also show a credit to the revenue account. Keep in mind that cash receipts
    from those sales are recorded in a different special journal.


    # Cash Receipts Journal


    Remember that in the sales journal the data has on account. These do not include
    cash sales. Those sales are recorded in the cash receipts journal. This special
    account includes three main parts for cash receipt:


    - 1. Customers who paid on account and are now paying cash on their account. The
    cash transaction is recorded here.

    - 2. Any sales that were made and cash was paid.

    - 3. Any other sources that the company took in cash.


    Keep in mind that if there is a cash transaction, not on credit, then it will
    be recorded here. Also with this there are three columns that include:


    - 1. Cash—which shows each transaction that involves a cash receipt.

    - 2. Sales discounts—which if any discount was offered it will be recorded here.

    - 3. Other—this includes any account that is different from sales discounts.


    Much like the debits the credits also have three columns. They are:


    - 1. Accounts Receivable—this is when a credit payment was included in the accounts
    receivable. Remember to write the name of that account in the details so that
    you know which account was paid.

    - 2. Sales—this is where you will record all cash sales. It will match what was
    debited to cash.

    - 3. Other—this is when a credit was to any fund that is incoming and is not from
    either of the other two columns.


    | Date | Account | Cash Receipts Journal | | | | |

    | :--- | :--- | :--- | :--- | :--- | :--- |

    | | Post Ref. | Debits: Cash Sales | Other | Credits: Accounts receivable | Sales
    | Other |

    | 7-Jan Sales | | $750 | | | $750 |

    | 17-Jan Richard Adams Interest | | $220 | | | $20 |

    | 27-Jan Jean Webster | | $488 $12 | | | $500 |

    | Total | | $1,258 $12 | | | $500 $750 $20 |


    There are some entries that are posted in the cash receipts journal that are posted
    in both the subsidiary and general ledgers.


    When posting these transactions, you would put a check in the post ref. as it
    has been consolidated. However, in the general journal you would put a code in
    this column as CR21. This would refer to where it was posted. Such as Cash Receipt
    (CR) and page 21 (2) of the cash receipt. This would make it easier to see where
    cash is coming from. There are some transactions that are not posted in the cash
    receipts journal but are still posted in the subsidiary ledger. For example, interest,
    rents, or dividends are posted directly to the general ledger.


    # Purchases Journal


    When you post inventory on credit you will record it in the purchases journal.
    These transactions are made based on the recourse such as a purchase invoice.
    This journal is mainly used for the purchases of inventory.


    When you post in the purchases journal you would debit the purchases account and
    credit the accounts payable in the general ledger. This journal is used much like
    the sales journal. Every invoice in the purchases journal is on a single line.


    The information you will have in the purchases journal are:


    - 1. Date of transaction

    - 2. Supplier''s name

    - 3. Invoice date

    - 4. Amount


    In some cases, there will be a fifth column that will list the terms.


    See the following example of a purchase journal:


    | Date | Supplier | Invoice Date | Post Ref | Amount (debit/credit payable) |
    Terms |

    | :--- | :--- | :--- | :--- | :--- | :--- |

    | 5-Jan | Silk Shop | 5-Jan | | $300 | |

    | 15-Jan | Sunbrella, Inc. | 20-Jan | | $700 | |

    | 25-Jan | Cushion Boutique | 31-Jan | | $450 | |


    Each day you would post the purchases in the account holder''s name. You will
    check off the post ref. when you consolidate the journal and ledgers. However,
    in accounts payable ledger you will put a P1 in the post ref. This represents
    purchases Journal (P) and the page number (1).


    # Cash Disbursements Journal


    Since all purchases on credit are recorded in the purchases journal, where all
    purchases recorded when cash is used? These transactions are recorded in the cash
    disbursements journal. Although, these are not only purchases that are made with
    cash. They also include transactions when you pay cash on an account when you
    purchased with credit. The format is similar to that of the cash receipts journal.


    Here you have three columns for the credits. They are:


    - 1. Cash

    - 2. Purchase discounts

    - 3. Other accounts


    You will also have two columns for the debits. These include:


    - 1. Accounts payable

    - 2. Other accounts


    The cash disbursements journal may look like this:


    | Date | Check | Payee | Account | Post Ref | Debits | Credits |

    | :--- | :--- | :--- | :--- | :--- | :--- | :--- |

    | 11-Feb | 112 | Used Cars | | B | Cash Purchase discounts: 0 other accounts |
    Accounts payable: 0 other accounts | $75 |

    | 13-Feb | 113 | Tribune | | B | $25 | $150 |

    | 27-Feb | 114 | Real Estate | Rent to expense | B | | $2,000 |

    | 28-Feb | 115 | Petty cash | Petty cash expense | B | $50 | $30 |


    The accounts that are posted in this journal are also posted to the accounts payable
    subsidiary ledger.


    # General Journal Transactions


    Every transaction would be included in a journal. However, not all of the transactions
    will fit into a special journal. For instance, those transactions that are not
    involved with credit sales, cash receipts, purchases, or cash disbursements will
    be in the general journal and may be detailed enough from there.


    Take for example transactions that include sales and purchase returns and allowances,
    notes payable, and notes receivable. These will be those types of transactions.


    Although, just because the transactions are not always posted to the special journals
    they may still be posted to the subsidiary ledgers. The general journal is used
    to record all types of transactions. That means that it is a history of all the
    transactions that your company will have. Usually the transactions that are not
    posted and do not fit in the special journals are ones that are left over and
    are usually nonrecurring, for example, adjustments entries, closing entries, and
    correcting entries.

    '
