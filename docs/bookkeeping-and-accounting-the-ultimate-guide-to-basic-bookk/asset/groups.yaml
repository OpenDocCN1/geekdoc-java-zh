    Your small business may buy equipment that is supposed to last several years.
    However, over those years your equipment will lose some of its value.


    For example, you buy a computer with Windows 7 for $575. Three years later your
    computer starts to break and you need to find parts. Over that time your depreciation
    went from $575 to about $50. At the same time, as fast as technology is advancing
    you can no longer get parts. Now your depreciation of $50 is considered a recycling
    fee.


    As you can see, over time your equipment will lose its value, and we need to calculate
    this into the bookkeeping. The depreciation can be an annual income tax deduction.
    It will be listed as an expense on the income statement. You can take advantage
    of this deduction by filling Form 4562 with your tax return. For more information
    about the Depreciation and requirements you must have, refer to Publication 946
    (How to Depreciate Property).


    For you to be able to claim a depreciation deduction there are a few guidelines
    that your property needs to meet.


    - You must own the property. However, you can also depreciate capital improvements
    for property that you lease.

    - The property must be used for business or to produce income. If you use the
    property for both business and personal you cannot deduct the property based on
    only use of the property.

    - The property must have a determined life span of more than one year. However,
    even if you meet all the requirements of property deduction; you cannot deduct
    the following property:

    - Any property that is placed in service and disposed the same year.

    - Any equipment that is used to build capital improvements. You can add allowable
    depreciation on the equipment during the construction based on improvements.

    - Certain term interests.


    Most property can be depreciated. You can depreciate buildings, machinery, vehicles,
    furniture, and equipment. However, land cannot be depreciated.


    This is because you are expected to use the land for the lifetime of your business
    and it will never depreciate. However, the building on the land you operate your
    business from can be depreciated.


    You will need to identify many items when filing taxes and using Form 4562 for
    the depreciation deduction. This is to ensure the proper depreciation of the property.
    These items include:


    - Depreciation method for the property

    - Class life of the asset

    - Whether the property is “Listed Property"

    - Whether you elect to expense any portion of the asset

    - Whether you qualify for any “bonus” first year depreciation

    - Depreciable basis of the property


    How do we calculate depreciation? There are two different methods which we will
    discuss now: Book Depreciation and the Tax Depreciation.


    For the books, you will often hear of the the book depreciation. This type is
    mainly for accounting and bookkeeping purposes. The goal for this type of depreciation
    is to match the cost of an asset with the revenue it earns over the period of
    its lifetime. The most common method for this type of depreciation is the straight-line
    method. This can be calculated in two ways.


    - Annual Depreciation = (COST – Residual Value) / Useful Life

    - Annual Depreciation = (COST – Residual Value) * Rate of depreciation


    Let''s look at each area you will be familiar with the different terms.


    - Cost: Original cost of the property or equipment

    - Residual Value: This is also known as the scrap value. What will be the value
    of the property or equipment at the end of its life-span?

    - Useful Life: This is the amount of time you plan on keeping and using the equipment
    before you dispose of it.

    - Rate of depreciation: This is the percentage of the useful life-span that is
    used in an accounting period. This can be calculated as follows:

    Rate of depreciation = 1 / Useful Life * 100%


    There are many methods that you can use to calculate depreciation. Therefore,
    you do not need to stick to only one type. When it comes to taxes, the IRS likes
    the accelerated depreciation method the best. This method returns more of your
    money early in the asset''s life. There are a few different methods you can use
    to get an accelerated depreciation.


    - Declining Balance Depreciation = Rate * Net Book Value


    For this formula looks at what rate a book value are.


    - Rate: This is a fixed rate and can be calculated as: (salvage Value / Cost)(1
    / Years)

    - Net Book Value: Original cost – accumulated depreciation to date on the asset


    We also need to look at the double declining balance.


    - Double Declining Rate = 2 / Useful Life

    - Double Declining Balance Depreciation = Net Book Value * 2 / Useful life


    With depreciation, make sure you keep your receipts. This will help your bookkeeper,
    accountant, and auditors check to make sure there are no mistakes before tax time
    and each month.


