    # Chapter 5 – Financial Statements


    # Trial Balance


    Once you have posted all transactions and now have all your balances calculated
    you can prepare the trial balance. The trial balance is a document that lists
    all your assets, liabilities, owner’s equity, revenue, and expenses. It also allows
    us to verify that all the debits and credits equal.


    This can be prepared at any given time. However, most of the time it is prepared
    at the end of a specific period, for instance, at the end of a month, quarter,
    or year. If ever in doubt of your debits and credits equaling you prepare a trial
    balance.


    # Income Statement


    The first document is the income statement. This statement will show a company’s
    net income or net loss for a specific period; that is, it will show the company’s
    worth after all revenues and expenses are accounted for.


    The heading of the income statement will always list the company’s name, statement
    name, and accounting period. There are three columns on this statement.


    +   1. List all revenue accounts followed by all expense accounts.

    2. All expense account totals or the debit column. If you remember previously,
    expenses have a debit normal balance.

    3. List revenue account totals or the credit column. If you remember previously,
    revenue has a credit normal balance.


    Remember this equation for the income statement:


    +   * Revenue – Expenses = Net Income or Net Loss


    Income Statement

    ABC Financial Company, Inc.

    For the Month Ending July 31


    # REVENUES


    Service revenue: $13,000

    Interest revenue: $400'
  - '[PAGE 153]


    Total revenue : $13,400


    EXPENSES

    Office supplies expense: $2,000

    Salaries expense: $2,120

    Rent expense: $1,000

    Total expenses : $5,120


    Net income : $8,800


    # Statement of Retained Earnings


    Once the income statement is prepared you will want to prepare a statement of
    retained earnings. This statement will show where your company is at the end of
    the given month. As the retained earnings are carried over from the previous month
    then we will add the earnings for the current month so that we will see where
    we stand at the end of the month. In turn these earnings will be carried over
    the next month’s retained earnings statement.


    Retained Earnings Statement

    ABC Financial Company, Inc.

    For the Month Ending July 31


    Retained earnings as of July 1: $2,450

    Net income: $8,800

    Total : $11,250

    Less dividends: ($400)


    Retained earnings ending balance : $10,850


    As you can see the income statement provides some valuable information. This is
    where you will be to get a good look at what you are bringing in as a company
    after all the expenses have been paid and accounted for.


    # The Balance Sheet


    The final document to prepare from the trial is the balance sheet. This is a list
    of all your assets, liabilities, and owner’s equity accounts, as well as the balances
    of these accounts on a specific date. The easiest way to remember this is that
    it is simply a detailed version of the accounting equation.'
