    Adding employees to your business is not always the easiest to keep up with. It
    brings new responsibilities as you will need to keep track and pay their wages.
    One thing that can help with this is the bookkeeping software applications that
    we have discussed. It is worth ensuring you have payroll feature if you have employees.
    Your employees rely on this paycheck.


    Granted with payroll, you also have payroll taxes. This money belongs to the government.
    One thing that could help with this is to have a separate savings account within
    your business account for holding all the payroll taxes. That way when it comes
    time to pay the government the money is already set aside.


    Make sure you are filing the correct documents for payroll on time otherwise you
    could encounter added fines.


    # Try New Systems


    There are so many systems out that will help your business succeed. We have talked
    about a few of the software programs used for bookkeeping. However, if you add
    too many systems at once it could be overwhelming for you, your employees, and
    your customers.


    As the business owner, you need to carefully select the applications you need
    for your business. A good rule of thumb is only try the systems that are needed
    for either maintenance or growth. If your business does not need it for either
    one of these, do not add them! One thing that could help with this is having a
    website or mobile app designed that integrates everything you need for your business.
    You can add a feature that allows you, your employees, and your customers to access
    the same app, but based on their credentials they will only have access to what
    is needed for them.


    Keep in mind, if you introduce one system at a time you will be able to give everyone
    a chance to learn the system before introducing the next.


    # Be Hands-On with your Bookkeeper


    As a business owner, you need to take a hands-on approach with your bookkeeper.
    In the starting phase, you might not afford to hire a bookkeeper and therefore
    must do it yourself or have one of your staff members do it. Always make sure
    you know what is going on with your accounts if you allow your staff to do the
    bookkeeping.'
  - '[PAGE 28]


    Bookkeeping is basic transactions, but you do need to see those reports each month,
    quarter, and year. If you record an invoice or expense in the wrong account the
    books can still balance but the accounts may not.


    A bookkeeper needs to know and where all transactions will be recorded. If would
    also say the same about the business owner. If you are the business owner, you
    need to read the reports each month and know if something does not look right
    and needs to be reviewed. The same goes with the bookkeeper. If you are the bookkeeper,
    you need to go through all the transactions that were recorded that month to ensure
    that they were recorded in the correct account before the reports are generated.


    One thing you could have a professional consultant bookkeeper look at the books
    for any errors. If you are worried about upsetting your bookkeeper, then add it
    to your company policy that a routine audit will be conducted at the end of each
    month or quarter.


    # Outsource to a Bookkeeper


    If, as the business owner, is also the bookkeeper for an extended period of time,
    then you may want to outsource your bookkeeping. This can be the most cost effective
    as you are only paying for a couple hours of work. On the other hand, if you had
    an employee assigned to it, you are paying a monthly wage. You can also outsource
    to ensure that the books are being handled by a professional and will be accurate.


    In general, it could take a professional bookkeeper only two to four hours to
    process an entire month of transactions and provide your business the monthly
    reports you require.


    If you feel that you can handle some of the bookkeeping and only want the professional
    to handle specific areas you can do that as well.


    One of the benefits of outsourcing to a professional is that they can give great
    business advice that will help your business grow. Some of this advice could be,
    but not limited to:


    +   - New software and if they would be a good fit for your business

    - Attend business meetings with you and your banker

    - Help with annual budget and cashflow reports

    - Train office employees'
