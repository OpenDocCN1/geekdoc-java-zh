    # Chapter – The Accounting Equation


    The Accounting Equation is probably the most fundamental concept concept part
    of accounting as it is done in modern times. It captures the concept described
    in the Balance Sheet. That concept is for any going concern, what the concern
    comes from only two sources, funds borrowed, expressed as liabilities and owed
    to the owners, their equity.


    **Assets = Liabilities + Owner''s Equity**


    This equation is often expressed in its expanded form:


    **Assets = Liabilities+ Owner''s Capital+ Revenues- Expenses- Owner Draws**


    In this form, it describes more of the operations of the firm. The assets of the
    firm come from:


    +   **Liabilities** ; money contributed by entities outside the firm such as long
    term and short term loans from banks or investment companies, sale of stock, bonds
    sold, and so forth.


    +   **Owner''s Capital** ; the funds supplied by the owners and the profits generated
    by the operations.


    +   **Shareholder Stock** ; owners can be shareholders of common or preferred
    stocks, frequently sold on a stock exchange


    +   **Revenues** ; money generated by the operations of the firm and other sources
    of revenue or income


    +   **Expenses** ; costs incurred in the operation of the firm such as material,
    labor and all the other expenses


    +   **Owner Draws** ; money withdrawn from the company and paid to the owners,
    as profits withdrawn, dividends, bonuses or in any other form.


    One can see that the expanded version better describes the operation of the firm
    in carrying out business, whether that business is retail sales, manufacturing,
    mining, or any other activity designed to generate revenues and profits. Even
    hospitals and other service businesses follow this same expanded model.'
- md: '

    Revenues are generated, expenses incurred and paid, and profits distributed. Of
    course, this appears very much different for all of the various business models
    under which firms operate. This expanded equation describes the business models
    for large, international firms that are publicly owned by stockholders, all the
    way down to the small privately owned construction firms, farms or service business
    owned and operated by self-employed entrepreneurs. Every organization can be seen
    to operate exactly by this accounting equation.


    For example, Riverside Machine Company, illustrated in Chapter 1, The Martin Company
    illustrated in Chapters 3, 4 and 5 and all the other firms in whatever businesses
    one can imagine, all follow this universal accounting equation. It truly is universal
    in its application, for companies and organizations of all sizes, in all industries,
    in all countries in the world. This is truly the fundamental equation of accounting.


    And, all accounting and accountants, in all these businesses must follow the earlier
    discussed GAAP, generally accepted accounting principles established by authorities
    and certification bodies.


    Banks, investment firms, investment fund managers, and everyone else in all market
    sectors are subject to this universal fundamental equation. We will see this in
    the subsequent chapters as we describe the various accounting professionals, their
    functions and responsibilities in all aspects of the accounting world.


    ## Chapter 7 – The CPA and Public Accounting


    Probably the most recognized accounting professionals are the CPAs, the Certified
    Public Accountants. These professionals may work for very large accounting firms
    like PriceWaterhouseCoopers® or KPMG®, two internationally known and respected
    accounting firms with offices in most countries around the world or the small
    or two person offices in almost every city and town in every nation. CPAs perform
    many valuable services for all types of businesses and organizations. A church,
    must file and pay the required payroll taxes for all employees on a timely basis.
    CPAs can up the accounting systems for a church secretary or bookkeeper to use
    in meeting these requirements.


    Similarly, any organization must establish responsibility and authority for internal
    auditing. Auditing in general means that the organization must carry out the accounting
    function in accordance with established standards and must assure management that
    the records are kept accurately and in compliance with these standards and laws.
    This internal auditing function is normally carried out by employees of the organization
    who are educated, trained and hired for that purpose, usually within the organization''s
    financial control office. This internal auditing task may also be outsourced to
    an independent firm such as a CPA company.


    External auditing is required by law for all publicly owned companies and other
    organizations. External auditing must be carried out by a qualified external authority,
    who is not part of the accounting being audited. CPA’s can serve as these Independent
    External Auditors. They must represent an independent third party, a role most
    often carried out by an organization in business as CPAs or External Auditors.
    These can be small, individual business firms or large multinational companies,
    like the mentioned above and many more.


    For publicly owned companies, that is firms who sell stock certificates, privately
    or through a stock market, the external audit report is extremely important and
    is addressed to the stockholders. For privately held firms, the report is addressed
    to the owners and the highest level of management. Shareholders rely on the external
    audit report to assure that the firm is carrying out its accounting for the business
    activities in accordance with the GAAP or other applicable standards.


    For non-profits and charitable organizations, the report is addressed to the Board
    of Directors.


    Sharon Haas for example, is a graduate of a mid-western university with a degree
    in Business Administration where she majored in accounting and an MBA with a focus
    on Accounting and Finance. She has ten years experience in accounting for a medium
    sized manufacturing firm in Chicago, Illinois. The State of Illinois as most other
    states in the US requires 150 hours of education to qualify for the CPA certificate
    and license. The MBA is frequently used to meet this requirement. Many states
    also have a requirement for continuing education to maintain the CPA license.
    Sharon passed the required examination and was issued her license after her graduate
    studies.


    At present, she works as an external auditor for one of the multinational CPA
    firms, in her office in Cleveland, Ohio. Her client assignments are a number of
    firms in Ohio, Michigan, Wisconsin and Illinois. She is a member of AICPA, the
    American Institute of CPAs.


    As an external auditor, she maintains a relationship with her client firms, providing
    consultant services in the areas of taxes, investments, capital purchases and
    accounting. Every year, she visits each client firm to carry out her external
    audit duties. She has an assistant who travels with her, helping in the audit
    duties and in preparing the annual audit report.


    Sharon enjoys her work with both her employer and her clients. She says there
    is never a dull day; every day brings on new questions and different challenges.


    One of the most important responsibilities that Sharon and all other external
    auditors have to be careful with is maintain the position of an objective outside
    authority. Sharon, like most professionals, is friendly and outgoing but she has
    to be careful that she separates her feelings from her work. She must be objective
    and disionate while doing her work. She must maintain an ‘arm’s length’ attitude
    toward her clients. She must maintain her professional standards and report based
    on what she finds, not what her client may say. Stories abound of auditing firms,
    with some very famous names who did not maintain this objectivity and sense of
    responsibility to the stockholders and stakeholders in carrying out their functions
    as an objective external auditor. Sharon''s reputation and her license depend
    on her professional attitude.


    ## Chapter 8 – Jobs in Accounting: Financial Accounting


    Most organizations and business firms have someone in charge of the financial
    office. Frequently this is called the Comptroller''s Office (pronounced controller)
    and is staffed with people educated and trained in accounting. The head of the
    office is frequently a CPA and directs the staff in her office as well as providing
    advice and counsel to the top management. This position is usually that one reports
    directly to the owner or owners of the firm, or to the CEO (Chief Executive Officer)
    and is often referred to as the CFO or Financial Officer.


    In the private sector, these jobs are usually challenging and of course, vital
    to the health of the operation. One such member of management is George Wilson.
    He is the CFO for a medium sized firm, Catch of the Day Restaurants, a chain of
    restaurants, specializing in seafood meals.


    George is the head of controllers office and reports on the firm''s financial
    position. He uses several important indicators, in addition to the periodic income
    statements. Balance sheets are updated annually since they tend to change more
    slowly than other reports. Here are two of the important measures, expressed as
    ratios.


    Current Ratio is a comparison of how well the firm is prepared to meet its current
    obligations, and is expressed as the ratio of current assets to current liabilities.


    | Current Ratio |

    | Current Assets/Current Liabilities |


    If an organization finds itself with a current ratio of less than unity, that
    means it is at risk of being illiquid to the extent that it may become bankrupt.
    It does not have the means to pay its current obligations. These may be payable
    to suppliers, wages and salaries to employees or taxes due to the government.
    None of these can be sustained for long periods of time.

