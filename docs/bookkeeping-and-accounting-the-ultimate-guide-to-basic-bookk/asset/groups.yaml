  mdcn: '

    公司的会计师可能会建议一些策略，例如通过承担长期债务来偿还重要的应付账款，从而减少短期债务，但可能存在严重的底层问题，导致组织无法利用其资产产生收入。


    如果我们查看马丁公司（Martin Company）的利润表，可以看到其流动比率为 $31,191/$14,685，即 2.13。这表明马丁公司拥有充足的资产来满足其流动负债，即使在短期内产生收入方面遇到困难也是如此。


    公司可能陷入险境的一个例子是发生如洪水或火灾等严重的业务中断事件。负债不会因为公司无法运营而消失，但由于在一段时期内将没有收入，流动资产将迅速缩水。如果公司能够快速恢复运营，就可能避免灾难。这是会计部门提供的一项建议。


    另一个重要的比率衡量的是公司的效率，即将其资源转化为收入的良好程度，该比率通过营业支出与营业收入之比计算得出，这两者都源自利润表。这被称为运营率。


    ## 运营率


    对于马丁公司而言，运营率为 $26,915/$34,652，即 0.78。这个数字必须始终小于 1，且越小越好。分析这个数字有两个重要的方法：第一，将当前水平与之前的时期相比如何？其次，尽可能尽可能与同行业其他公司的相似比率进行比较。作为独立的比率，它们并没有太大意义。然而，例如，当运营率接近
    1.0 甚至超过 1.0 时，公司就陷入了严重麻烦，因为其营业支出超过了营业收入。流动比率应始终大于 1.0，这意味着公司可以满足其流动债务，而运营率必须显著小于
    1。


    乔治（George）确保这些数字是准确的。事实上，由于 Catch of the Day 公司为其经理维护了内部局域网，他将这些数字发布在内部系统中，由于他的软件每天都会结算，高层管理人员几乎可以实时（Real
    Time）看到这些重要的比率。


    请记住，会计的产物是信息，只有当信息可用、及时、可靠且准确时，它对管理层才有价值。


    我们将在后面的章节中讨论这些以及许多指标和比率。


    # 第 9 章 – 税务会计


    几乎所有国家都有复杂的税务体系，涵盖了从所得税、财产税、进口关税、销售税、增值税以及政府能想到的任何其他税。口号可能是“如果它在动，就收税；如果它不动，也收税。”这些系统可能非常复杂，且税收适用于政府的各个层级。会计师执行的最服务之一是跟踪客户的纳税负债，并确保按时、按正确的金额支付。


    这些专家在所有国家和所有行业都很有需求。不理解和不遵守无数的税法可能会比任何任何事情都更快让组织陷入困境，这需要专业人士来确保支付正确的税款，并确保客户支付的税款不会超过法律规定的。


    税务会计师在大型和小型公司工作，甚至可以在大型、复杂的跨国 CPA 和咨询组织任职。许多其他税务会计师是自雇的，还为各种客户提供其他会计服务。卡尔·沃斯（Carl
    Waters）就是这样的税务会计师。他在印第安纳州的一个中型城市经营着一家小型会计师。卡尔雇佣了三个人，他们都受过会计培训，卡尔本人也是一名 CPA。


    卡尔在 IRS（美国国税务局）担任税务代理工作了 12 年，然后在开设自己的办公室之前成为了注册代理人（Enrolled Agent）。注册代理人由 IRS
    认证，有资格就税务事项向客户提供建议并在 IRS 机构面前代表他们。由于在 IRS 工作的多年，卡尔非常熟悉许多行业。他决定在六年前开设自己的办公室，并拥有一份重要的客户名单。他和他的员工为这些客户执行许多会计功能，除了准备报税表和在客户内部建立维持所需记录的所需的记录系统外，他们还会在税法允许的范围内就减少客户纳税负债的方法提供建议。


    # 第 10 章 – 会计咨询师


    许多组织，特别是大型公司面临着会计师必须处理的众多问题。建立会计系统、协助公开发行、制定长期战略计划等，都是许多组织寻求专业咨询公司外部帮助的任务，而这些许多公司都包含了大量的会计师。


    在这些咨询公司工作的会计师通常会在特定领域培养专长，在这些领域提供请求的公司和机构负担不起全职聘用的技能。


