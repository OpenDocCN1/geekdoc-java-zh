    divide it by the lifespan. The lifespan is the number of years that the business
    sees the asset as useful. This gives you the depreciation cost.


    For example, you have a flow jet for your business. The estimated lifespan is
    five years. You originally purchased it for $20,000 and the estimated salvage
    value would be $5,000. Let''s put this in the equation. $20,000 - $5,000 ='
  - '[PAGE 188]


    $15,000 / 5 = $3,000. Therefore, the depreciation will be $3,000. Many times,
    you can think of the lifespan as a percentage. The rate is 1. So the lifespan
    for the flow jet will be 1/5 or 20%.


    With a depreciation schedule we see the book value. It is important to know the
    book value of an asset. To find this you will take the original asset cost and
    minus the accumulated depreciation.


    +   - Book Value = Cost – Accumulated Depreciation


    Market value and book value are not the same. Book value represents the value
    of the asset according to the business books. Each year the book value has to
    be updated. This is because the accumulated depreciation will change each year
    and the company or business needs to know when the lifespan will be up. However,
    the book value should never go below the salvage value of the asset. Keep in mind
    that when the depreciation is finished you see the salvage value and the book
    value will be equal.


    Declining-balance method—with this method the depreciation assigned for each year
    of usage is different. Suppose you feel that your asset is more productive and
    creates more revenue early in its life. This method is an accelerated method.
    You will see more depreciation expense allocated early in the asset’s life than
    it would be in the later years. For the declining-balance method we can calculate
    the depreciation expense with the following formula:


    +   - Depreciation Expense = Rate * Current Book Value


    Since the book value decreases each period so does the depreciation expense. This
    is why it is called declining-balance method.


    With all the methods you need to keep in mind that the book value will never go
    below its salvage value and it will be equal when it is at the end of its lifespan.


    Sum of the Years’ Digits (SOYD) method—is another accelerated method for depreciation.
    With this method the amount of depreciation is assigned to each year of life based
    on an inverted scale of the sum of the years of its lifespan.'
  - '[PAGE 189]


    Units of Production method—is different than the other methods. It is based on
    depreciation from a measurement of the asset''s output instead of its lifespan.
    With this method it allows for more depreciation when the asset is used more.
    The method is more used for assets such as vehicles and machinery. For calculating
    this method you would use the following formula. It is similar to the formula
    for the straight-line method.


    +   - Depreciation Rate Per Unit = (Cost – Salvage Value) / Estimated Units of
    Output


    Keep in mind that natural resources are depreciated differently than other assets.
    This is because once their lifespan is up or they are used up then they can only
    be replaced through natural processes. To figure this you will need to first find
    the cost per unit.


    +   - Cost Per Unit = Depletable Cost / Estimated Total Number of Units

    Once you have the cost per unit you can calculate the depletion expense.

    - Depletion Expense = Cost Per Unit * Yearly Number of Units Extracted


    Modified Accelerated Cost of Recovery System (MACRS) method—must be used for a
    business’s income tax returns. Businesses are allowed to use one method for their
    income tax returns and another method for their financial statements. With this
    method the Internal Revenue Service (IRS) will specify depreciation rates and
    time periods for particular categories of fixed assets, for example, furniture
    and computer equipment. Using this method will lower net income which will lower
    the taxes owed to the IRS.'
  - '[PAGE 190]


    # Chapter 12 – Owner’s Equity


    With the accounting equation we have taken a closer look at the assets and liabilities.
    Now let’s take a look at the owner’s equity. This can also be considered as stockholder’s
    equity. As we have learned if you take the liabilities and subtract them from
    assets you get the owner’s equity. Therefore, this is what is left over for the
    company’s owners. This also includes contributions of capital by the owners. These
    contributions are used to fund the operations of the company as well as any undistributed
    income or net loss. Here is where you will see the worth of your company.


    Suppose you purchase a car for 40,000 on which you put a down payment of 20%.
    This would leave 80% to the bank. Therefore, you will have 20% of $8,000 of equity.
    As you make payments your equity will go up until you fully pay it and have 100%
    equity of the car.


    There are primarily two types of owner’s equity.


    +   1. Contributed capital—for sole proprietor or partnership in cash or assets,
    for example, land, buildings, or equipment. They value a fair market value. With
    corporations the capital generally comes from proceeds of stock sales.

    2. Earner capital—is the cumulative value of net income or net loss that is not
    taken out of the business. These funds are left to generate future income and
    growth.


    # Some Differences Between Sole Proprietorship and Corporation Equity


    With a sole proprietorship there are three primary owner’s equity accounts.


    +   1. Contributed capital—money that is contributed by the individual or partnership
    to the company.

    2. Undistributed income—earnings that the owner leaves in the business to fund
    future growth.

    3. Owner’s drawing—cash that is withdrawn from the business for personal use.'
  - '[PAGE 191]


    Corporations are mainly funded from stock sales and earnings retained from the
    company. The following chart will help you better understand what types of owner''s
    equity are used for the type of company.


    | ACCOUNT NAME | SOLE PROPRIETSHIP | PARTNERSHIP | CORPORATION |

    |---|---|---|--|

    | Owner''s Equity | Yes | Yes | |

    | Owner''s Drawing | Yes | | |

    | Undistributed Income | Yes | Yes | |

    | Common Stock | | | Yes |

    | Preferred Stock | | | Yes |

    | Treasury Stock | | | Yes |

    | Additional Paid-In Capital | | | Yes |

    | Retained Earnings | | | Yes |


    # Recording for Different Company Types


    Sole Proprietorship—is not a corporation. It is owned by one person. That individual
    holds the future of the business in their hands. They will make all the decisions,
    take all the risks, and enjoy all the gains of the business. The main advantage
    for this type of business is how simple it is. However, like everything when you
    have advantages there are just as many disadvantages. One of the main disadvantages
    is the owner''s unlimited liability; that is, you are responsible for all the
    actions of the business, both good and bad. Which means this will put all the
    assets at risk. Not just the business assets but your personal assets too. Sole
    proprietorships and partnerships are handled much the same way.


    Corporations—are legal entities that are separate from their owners. A corporation,
    so to speak, has a life of its own. They exist until dissolved. The owners are
    not one individual or even a group of people that form a partnership in the business.
    The owners of a corporation are its shareholders or stockholders. However, they
    are not personally responsible for the debt of the company. Because of this limited
    liability structure, it makes a corporation desirable for most of the large and
    medium businesses to include many of the smaller ones.'
