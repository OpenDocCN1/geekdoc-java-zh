    ## Chapter 2 – The Accounting Equation


    Before we can really get into accounting, we need to first understand the accounting
    equation and why it is so important. If you own a business, no matter how big
    or small, it is the accounting equation that comes into play.


    The importance of this equation is to help a company understand their financial
    position. By knowing this information, you can make business decisions that will
    help move the company forward.


    Let''s take a look at what is measured with the financial position of a company:


    - Assets (what a company owns)—these are the resources that the company owns.
    Some examples are: cash, accounts receivable, inventory, prepaid insurance, investments,
    land, buildings, and equipment.

    - Liabilities (what a company owes to others)—these are the obligations a company
    has to others. Some examples are: notes payable, loans payable, accounts payable,
    salaries and wages payable, interest payable, payable payable, and income taxes
    payable.

    - Owner’s equity (the difference between assets and liabilities)—these are investments
    into the company. It also includes net income that has not been taken from the
    company.


    Let''s take this and put them into your equation:


    - Assets = Liabilities + Owner’s Equity (sole proprietorship)

    - Assets = Liabilities + Stockholders’ Equity (corporation)


    These equations are known as the accounting equation. Each area of the equation
    has a purpose. I will show you how as we continue through this book. Although,
    this is the only equation that you will be faced with. More will be introduced
    to you as we progress through the steps.


    As long as the company keeps accurate records the equation will always be balanced.
    For example, if you have $1,000 in assets, $300 in liabilities, and $700 in owner''s
    equity, then the equation is free from errors in the books. This is because you
    are working with double-entry accounting. We will get more into double-entry accounting
    in a later chapter. To simplify lets'' put those numbers into the equation.


    - $1,000 (assets) = $300 (liabilities) + $700 (owner''s equity)


    As you can see both sides of the equals must match. It is always a good idea to
    check the equation often. This way if the equation does not equal and there are
    errors you do not need to go very far back looking for errors. In the case that
    you find errors you would need to find out where that error is. We will cover
    more on this in a later chapter that will help with finding and fixing those errors.


    Each transaction will be recorded in a general ledger. In these transactions will
    be on the balance sheet and the income statements. Both of these show the accounting
    equation.


    The balance sheet is also known as the statement of financial position. This is
    the best report that shows the accounting equation. It will also show the company''s
    financial position at any given time. It will report the company''s assets, liabilities,
    and owner''s equity. This report will give the totals of each area. With those
    totals you could use the accounting equation to find out if it is balanced. You
    can run this report at any time. However, most companies run it at the end of
    the month or quarter.


    While the balance sheet reports only one point in time in the income statement
    can cover periods of time. The income statement focuses on a company''s revenue
    and expenses. This gives owners and stockholders an idea of where their investments
    are going in the company.


    ## Chapter 3 – Cash Method Vs Accrual Method


    I am sure you have heard of the cash and accrual methods in accounting. What would
    you use for your business? Most of the time you will only see the cash method
    in accounting used by small businesses, whereas the large corporations would use
    the accrual method. The main difference between the two is pretty simple. It is
    all in the timing of when revenue and expenses are recognized. Both methods are
    okay to use and will give you the same results.


    The accrual method is the most commonly used method with business. Also, when
    filing your taxes, you would need to select the method that was used the first
    time you filed. After that you would need to file with that method each time you
    file your taxes.


    The cash method accounts for revenue only when money is received. It also accounts
    for expenses when money is paid out. However, the accrual method accounts for
    revenue as it is earned and expenses as they occur.


    Let''s make this a little simpler. We are only going to focus on the income. If
    you record cash or a check as it is actually received then you are using the cash
    method. When you record expenses as they are actually paid then you are using
    the cash method. If you record money coming in when you invoiced your client then
    you are using the accrual method. If you record expenses when you received the
    invoice then you are using the accrual method.


    Cash Method:

    - Record income when cash or check is received

    - Record expense when the expense is paid


    Accrual Method:

    - Record income as the customer is invoiced

    - Record expenses as the business is invoiced


    With the accrual method you will have an account receivable and an account payable.
    With the cash method you will record them directly into the cash and expense accounts.


    Let''s look into Joe''s purchase and we will use both methods to show how it would
    be recorded. Joe bought a laser printer in April and paid $2,000 for it in June.
    This is two months later. Using the cash method, you would record a $2,000 payment
    for June. This is because when it was paid for. Now if you were using the accrual
    method, you would record the $2,000 payment in April. This is because when it
    was purchased.


    Let''s take another example. My friend Al runs a small shop called Sweet Tooth.
    On December 24, Al buys a new display case for $250. Under the cash method, he
    would record the $250 expense in January when he actually pays for it. Under the
    accrual method, he would record the $250 expense in December when he receives
    the invoice.


    Let''s take one more example. Al completes a job for $500 in December, but the
    customer does not pay the bill until February. Under the cash method, Al would
    record the $500 income in February. Under the accrual method, he would record
    the $500 income in December when the job was completed.

