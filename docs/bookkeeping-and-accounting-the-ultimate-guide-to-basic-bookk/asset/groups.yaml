    and credit wages payable.


    | DATE | ACCOUNT | DEBIT | CREDIT |

    |---|---|---|---|

    | December 31 | Bonus expense | $5,000 | |

    | | Wages payable | | $5,000 |


    ## Contingent Liabilities


    When I first looked at contingent liabilities my first thought was, what is that?
    Then as I did some research I realized that anytime a business faces the threat
    of a potential liability that may or may not occur in the future, it would be
    considered a contingent liability. These are only accrued when they are likely
    to occur. Many of these types of liabilities that are not accrued must be disclosed
    in notes to the financial statements. A good example of this type of liability
    is a product warranty.


    Take Al''s Ladders, Inc., for example. They had a gross sales in the month of
    June. The business estimated that 5% of its sales, or $2,500, would be allocated
