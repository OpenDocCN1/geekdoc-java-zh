    | Assets | Liabilities | Owner''s Capital |

    | --- | --- | --- |

    | Debit | Credit | Debit | Credit | Debit | Credit |

    | Increase | Decrease | Decrease | Increase | Increase | Increase |

    | NormalBal | | NormalBal | | NormalBal |

    | Owner''s drawing | Revenue | Expenses |

    | Debit | Credit | Debit | Credit | Debit | Credit |

    | Increase | Decrease | Decrease | Increase | Increase | Increase |

    | NormalBal | | NormalBal | | NormalBal |


    T accounts are only a part of the journaling process. It makes it easy to put
    in perspective if each account is to be debited or credited based on if it is
    to be increased or decreased.


    Keep in mind as you begin working with the closing entries and the reports, it
    is important to know which accounts are affected, whether you will increase or
    decrease the account, whether it will be a debit or a credit that will increase
    that account, and whether the account will have a debit normal balance or a credit
    normal balance.


    This information will help you as you start to prepare the worksheet, the income
    statements, the trial balance, the statement of retained earnings, the statement
    of owner’s equity, the cash flow statement, and many other reports that will help
    show a bigger picture of the company’s status.'
