    ## Chapter 12 - Personal Accounting


    Everyone who has income and expenses needs to carry out Personal Accounting, ranging
    from balancing a checkbook to filing personal tax returns. These people do not
    have to be trained in bookkeeping or accounting but do need to keep certain records.
    This is part of Personal Accounting.


    Other parts of personal accounting are things like keeping track of bills so they
    can be paid on time, establishing a budget and monitoring many other bits of information
    like credit card invoices, to watch for errors and unauthorized charges.


    In today''s atmosphere of Identity Theft, we all need to learn to work as a forensic
    accountant, analyzing what charges were made, by whom and working with the bank
    or credit card company to get these charges removed.


    At other times, everyone must be tax accountants, taking action to minimize tax
    liabilities, keeping track of legitimate deductions and filing the return.


    ## Chapter 13 – Measures and Ratios


    The product of accounting is information. This chapter examines the form and determination
    of the important information accountants need to produce and report to management,
    owners, stakeholders and stockholders. The Comptroller''s Office has the responsibility
    of setting up the recording, analysis and reporting structures to keep management
    informed of the condition of the organization, giving warnings and counsel to
    management in advance of issues to prevent adverse situations.


    To do so, the CFO will use two types of strategies for extracting important information;
    static and dynamic. Static analysis measures important signals at some point in
    time, for example, the current ratio as described earlier. These are measures
    taken at some point in time, to assess the current situation. Dynamic analyses
    are those that examine the organization''s performance over some period of time,
    like month-to-month or over year. These dynamic analyses provide important trend
    analysis, allowing some prediction of future performance under these same conditions.
    That means ''what will be in the future if we don''t make a change.''


    These measures are taken from both the Balance Sheet and the Income Statement,
    depending upon the model needed. These measures can be grouped into three categories;
    measures of financial strength, operating efficiency and organization profitability.
    See Appendix 1 for illustrations of many of these measures and ratios.


    ### Financial Strength


    Long Term Financial Strength:


    An organization must be able to withstand the normal and sometimes worse than
    normal vicissitudes of its life. It must be in a position of strength to maintain
    its ability to carry out its chosen mission, that mission is manufacturing, extraction,
    service or distribution. The many stakeholders and stockholders expect that management
    will be capable of guiding the firm through the perils of everyday business life
    without failing or going out business. The organization must be resilient and
    able to maintain its forward progress under any reasonably expected events.


    Here are some commonly used measures of financial strength:


    ### Equity to Liabilities Ratio:


    | Owner''s Equity |

    | Total Liabilities |


    Remember that all assets of the organization must come from either inside the
    operation or by borrowing from outside. This ratio shows the source of the assets
    as a proportion from the Owner''s Equity and from all Liabilities, including Current
    Liabilities. In modern terms, "How much do the owners have in the game?" A low
    ratio indicates that most of the assets come from outside the organization, not
    from the owners. A higher ratio, approaching unity would indicate a solidly built
    firm with good grounding by the owners. Too low a ratio might indicate borrowing
    or high levels of current liabilities. Too high a ratio might indicate the opportunity
    to leverage the assets by increasing outside funding from sources such as long-term
    loans or bonds.


    ### Times Interest Earned:


    | Net Income Before Interest and Taxes / Total Interest Payments |


    Whatever leverage strategy the organization chooses, it must pay the interest
    on outstanding loans, both short term and long term. The holders of this debt
    want assurance that the organization can earn enough to pay the interest owed
    on a timely basis. This ratio captures that ability. A low number indicates risk
    for the lenders, a higher number times interest earned is an indication of safety.


    ### Debt to Equity Ratio:


    The Debt to Equity Ratio measures the degree to which the organization is leveraged,
    between assets and debt. This is particularly informative for long-term debt,
    since short-term debt like accounts payable is usually very fluid and is not a
    useful source of operating capital.


    | Total Debt (Current and Long Term) / Total Equity |


    Together, these three ratios can show the strength of the firm in terms of its
    ability to meet its obligations and the extent to which the owners have contributed
    to that strength.


    ### Short Term Financial Strength:


    ### Current Ratio:


    As described earlier, the Current Ratio tells us how well the firm is prepared
    to meet its current obligations, and is expressed as the ratio of current assets
    to current liabilities.


    | Current Assets / Current Liabilities |


    This ratio is one with twos; a larger number indicates good assurance of meeting
    current liabilities, i.e. the organization is very capable of meeting its short-term
    obligations. However, too large a ratio might indicate that current assets, like
    cash and cash equivalents are being held in preference to being put to work earning
    profits.


    ### Quick Ratio:


    The Quick Ratio is a bit more severe than the Current Ratio because compares only
    the total of cash and accounts receivable with current liabilities. This leaves
    out the value of the inventory and prep and is regarded as a better assessment
    of strength in the immediate sense. This ratio is sometimes called the Acid Test.
    It does represent the availability of immediate action to resolve Current Liabilities
    needed.


    | (Cash + Accounts Receivable) / Current Liabilities |


    ### Operating Efficiency


    Measures of Operating Efficiency tell management how well and effectively they
    are using the assets they have. These are easy calculations but are very useful
    as a static measure and for watching trends over time as dynamic analyses.


    ### Receivables Turnover:


    The Receivables Turnover Ratio indicates how efficient the organization is at
    collecting money from customers. Like the others, this is an easy calculation
    and these results should be available at request from the accounting system. This
    ratio should be as low as possible, indicating prompt payment by customers.


    | Net Sales / Average Accounts Receivable |


    ### Inventory Turnover:


    Inventory is an asset in which the organization has chosen to invest. In practice,
    investments in inventory represent opportunities lost to invest in more productive
    assets and should be minimized with a well-planned material control system. Keeping
    track of Inventory Turnover is important for an operation trying to apply concepts
    of Lean Management.


    | Cost of Goods Sold / Average Inventory |


    ### Turnover of Assets:


    Like receivables and inventory, assets are investment choices by the organization’s
    management. This measure is not too common but is informative. It shows how well
    the management is employing the assets it holds. It reveals how many times the
    total assets are being used in the firm''s operation.


    | Total Sales / Average Total Assets |


    ### Operating Ratio:


    The operating ratio shows how much of each unit of revenue is consumed by operating
    expense, and how much is left over to contribute to the firm’s

