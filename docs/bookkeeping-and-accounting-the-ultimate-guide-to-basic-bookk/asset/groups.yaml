    The publicly held corporations need to follow regulations and reporting requirements
    from various authorities such as:


    - Securities and Exchange Commission (SEC)

    - Secretary of State

    - Internal Revenue Service (IRS)

    - State and local taxing authorities


    This is only a few and the major authorities that are involved. They may be subject
    to many others as well.


    For a corporation, they are required to submit financial statements that include
    the following:


    1. Income statement

    2. Balance sheet

    3. Statement of cash flows

    4. Retained earnings statements


    The following chart will outline how each source outlines its responsibilities
    in a corporation.


    | SOURCE | RESPONSIBILITIES |

    | --- | --- |

    | Secretary of State | Approves the articles of incorporation, which state the
    number and classes of authorized shares and the associated par value, if any,
    and any amendments to the articles |

    | Board of Directors | Authorizes issues and repurchasing of shares including
    the dollar value allocated for repurchases. Authorizes the payment of dividends,
    and specifies the amount, date of record, and date of payment |

    | Shareholders | Approves authorizing additional shares, generally at the annual
    meeting. Approves election of members of the board of directors; nonbinding vote
    on executive |

    | Controller | Records in the corporate ledger the proceeds from sale and repurchase
    of shares of stock. |

    | Corporate Treasurer or Secretary | Keeps any hard copy stock certificates in
    a secure, locked location. Retains minutes of board meetings. |

    | Third-Party Securities Dealers | Sells the stock in the market, collects proceeds
    of the sale, and remits them to the company. |


    Since a corporation relies on stocks and retained earnings then the equity is
    different than that of a sole proprietorship or a partnership. Before the shares
    are issued for a corporation, they need to be authorized by the board of directors
    and then approved by the state’s secretary of state during the time the corporation
    files their incorporation registration. Let’s look at some of the equities that
    a corporation may have:


    - Common Stock—is known as the voting stock for the corporation. For each share
    you will get one vote at the company’s annual meeting. Say you have 20 stocks.
    That would give you 20 votes at the meeting. They also elect the board of directors,
    approve the selection of the audit firm that will audit the financials, and approve
    executive compensation plans and the frequency of approving executive compensation.

    - Preferred Stock—is a nonvoting stock. Because it does not have voting rates
    it has a fixed dividend rate. This way it pay out a greater dividend in exchange
    of the voting privileges.

    - Treasury Stock—comes from when a company repurchases a stock that was previously
    used instead of retiring it.

    - Par Value—is the book value that is assigned to the stock and the minimum price
    share is originally offered for sale. Not all companies have a par value assigned
    to their stocks.

    - Additional Paid-In Capital—is simply the difference between the stock selling
    price and the par value.


    # Partnerships


    With a partnership you share the responsibilities of the business. You can have
    a general partner that has unlimited liability of the company but you may have
    a limited liability partner that is only limited to what is decided in the partnership.
    A partnership is much like a sole proprietorship.


    The following chart will help you see a better picture of the characteristics
    of the three types of businesses.


    | CHARACTERISTIC | SOLE PROPRIETORSHIP | PARTNERSHIP | CORPORATION |

    |---|---|---|--|

    | Number of Owners | One | Two or more | Based on number of shares |

    | Ease of setup | No legal agreement | Legal agreement needed | Articles of incorporation,
    authorization of shares of stock, etc. |

    | Owner’s Liability | Unlimited | At least one partner is unlimited; others may
    be limited | Limited |

    | Life | Life of the owner | Limited life based on partners | Perpetual life |

    | Net Income | Belongs to proprietor | Passed through the partners | Distributed
    as dividends |

    | Tax Reporting | Owner’s tax returns– 1040 Schedule C for business income | Partnership
    information return and individual returns; income is taxed when earned | Corporate
    tax return; individual shareholders must report and pay taxes on dividends; corporation
    is taxed when profit is earned, but shareholders are taxed only when they receive
    dividends or stock. |

    | Regulatory filings | Depends on the industry | Depends on the industry | SEC
    for publicly owned companies regardless of industry. |

    | Means of raising capital | Owner contribution | Partners’ contribution | Sale
    of stock |


    # Chapter 13 – Income Statement


    We mentioned earlier about the financial statements that are needed to be completed
    so that we can have a good outlook of where your business is. One of those statements
    is the income statement. We are going to take a closer look at the income statements
    and what is involved in them.


    These statements are essential to the business as they will show profits and losses.
    They will also give the management and stockholders information for making good
    business decisions, borrowing money, and growing your business with products and
    services.


    The income statement is also known as the statement of operations, the statement
    of income, and the profit-and-loss statement. One thing to remember is the matching
    principle. This term is referred to in accounting practices when you pair revenue
    with the cost, or expense that was incurred to generate revenue.


    # Revenue


    If you remember, a business’s revenue refers to the sum of money earned. This
    money can come from products or services rendered for a certain period of time.
    This is also known as the gross earnings. These are sales revenue before you subtract
    any discounts or sale returns that are generated from a specific business activity.
    Any revenues will increase owner’s equity and are usually recorded quarterly.
    Keep in mind that the transactions usually generate revenue are:


    - Selling goods

    - Selling assets

    - Providing services

    - Leasing or renting business assets


    # Sales and Revenue


    On an income statement generally, sales and revenue are treated as the same thing.
    This is because they both increase equity. Although there is one main difference.
    Sales or the revenue from sales is generated from normal business operations,
    while other revenue may be generated from activities that are not normal business
    operations. Some income statements label revenue as sales or sales revenue.


    Now we have sales revenue, which is labeled as sales revenue on the income statement.
    What about revenue that is not from sales? This revenue is labeled as other revenue
    and would be included in a different part of the income statement.


    Revenue is recognized and recorded as sales as soon as each sale has taken place.
    This is to include when credit is used instead of cash being received right away.
    The revenue will still be recognized at the time of sale and not when payment
    for the credit is received. I need you to remember, as it is important, that when
    revenue is being recognized in the accrual-based accounting it requires the expenses
    to match with revenue during a given accounting period.


    # Expenses


    Just like revenue, expenses also need to be recognized and recorded at the right
    time. Keep in mind that expenses are recognized and recorded at the time they
    occur. Even if the expense has not been paid yet and is only billed or invoiced
    they are recorded at the time of billing or invoicing. Expenses occur in order
    to generate revenue. There is a saying, “You need to spend money to make money.”
    That statement is very true. Anytime you start a business you will need to spend
    money for land, business equipment, buildings, and supplies. All these items make
    money. However, all these items generate revenue in their own way. Because of
    this expenses must appear on the income statement during the time it lasts to
    the sales revenue.


    For each merchandise or manufacturing types of companies you will have cost of
    goods sold. For merchandisers, the cost of goods sold will refer to the cost of
    inventory that is acquired for resale. Two good examples for this are Amazon and
    Walmart. They do not make their own products. Instead, they buy their inventory
    from other companies and then resell them to the consumers. When the product is
    purchased for resell and added to the inventory it is recorded as an expense on
    the income statement during the time the product was purchased.


    # Operating Expenses

