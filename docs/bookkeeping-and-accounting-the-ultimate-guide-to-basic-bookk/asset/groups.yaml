    been billed.


    After careful review, we learned that $3,000 of services has been earned. This
    is dated as of December 31, although it will not be billed until January 10. In
    order to have that information on the December financial statements, you need
    to make an adjusting entry.


    Remember, all entries will have at least a credit and a debit. The two accounts
    that are affected will be Accounts Receivable and Service Revenue. Accounts Receivable
    has a normal debit balance and is part of the balance sheet accounts. Service
    Revenues has a normal credit balance and is part of the income statement accounts.


    The adjusting entry will look like this:


    | Date | Account Name | Debit | Credit |

    |---|---|---|---|

    | Dec 31 2015 | Accounts Receivable | 3,000 | |

    | | Service Revenues | | 3,000 |


    When we look at the previous balance of $4,600 for accounts receivable and then
    make the adjusting entry of $3,000, the new balance for this account will be $7,600.


    ## Allowance for Doubtful Accounts - $0


    If you notice, this account is not listed on the balance sheet. That is because
    it has a $0 balance. It is common for accounts with a $0 balance to not appear
    on the balance sheet.


    At one point your business may have accounts that are not collected for various
    reasons. Instead of reducing the Accounts Receivable by issuing a credit on the
    ledgers, you will report it in the Allowance for Doubtful Accounts.


    Therefore, let''s say $600 will not be collected. That means that $600 needs to
    be reported in the Allowance for Doubtful Account. There will be two accounts
    involved for this transaction. You will have Allowance for Doubtful Accounts found
    on the balance sheet. This account has a credit normal balance. The other account
    will be Bad Debts Expense found on the income statement. This account will have
    a normal debit balance.


    The adjusting entry for this will be:


    | Date | Account Name | Debit | Credit |

    |---|---|---|---|

    | Dec 31 2015 | Bad Debts Expense | 600 | |

    | | Allowance for Doubtful Accounts | | 600 |


    This transaction will give the Allowance for Doubtful Account a balance of $600.


    As you go through the balance sheet, keep in mind which accounts will be affected
    and which accounts are affected and whether they have a normal debit or credit.


    You should take the time to see if you can figure out the remaining adjusting
    entries for the asset accounts. They are:


    - Supplies - $1,100

    - Adjusting entry - $375 (Hint: The balance for supplies will be $725 and the
    accounts involved are Supplies and Supplies Expense)

    - Prepaid Insurance - $1,500

    - Adjusting entry - $900 (Hint: The balance for Prepaid Insurance will be $600
    and the accounts involved are Prepaid Insurance and Insurance Expense)

    - Equipment - $25,000

    - No adjusting entry

    - Accumulated Depreciation-Equipment - $6,500

    - Adjusting entry - $1,500 (Hint: The balance for Accumulated Depreciation-Equipment
    will be $9,000 and the accounts involved are Accumulated Depreciation-Equipment
    and Depreciation Expense-Equipment)


    ## Adjusting Entries – Liability Accounts


    As you review the accounts on the balance sheet, do not stop at the assets. The
    liability accounts need to be reviewed also. Check these accounts much the same
    way as the assets. See if you can record these transactions for the liability
    accounts.


    - Notes Payable - $5,000

    - No adjusting entry needed

    - Interest Payable - $0

    - Adjusting entry - $25 (Hint: The balance for the Interest Payable will be $25
    and the accounts involved are Interest Payable and Interest Expense)

    - Accounts Payable - $2,500

    - Adjusting entry - $1,000 (Hint: The balance for Accounts Payable will be $3,500
    and the accounts involved are Accounts Payable and Repairs & Maintenance Expense)

    - Wages Payable - $1,200

    - Adjusting entry - $300 (Hint: the balance of Wages Payable will be $1,500 and
    the accounts involved are Wages Payable and Wages Expense)

    - Unearned Revenues - $1,300

    - Adjusting entry - $800 (Hint: The balance for Unearned Revenues will be $500
    and the accounts involved are Unearned Revenues and Service Revenues)


    Keep in mind the normal balances for each account affected. Here is a list of
    all the accounts affected with their normal balances. As you do these adjusting
    entries and you do not know the normal balance for both transactions, figure out
    which one you know. There will always be a debit and a credit for each transaction
    made. If it has a credit normal balance and the adjustment increases the account,
    then you debit the other account.


    - Accounts Receivable – Normal Debit Balance

    - Service Revenues – Normal Credit Balance

    - Allowance for Doubtful Accounts – Normal Credit Balance

    - All Expenses – Normal Debit Balance

    - Supplies – Normal Debit Balance

    - Prepaid Insurance – Normal Credit Balance

    - Accumulated Depreciation-Equipment – Normal Credit Balance

    - Interest Payable – Normal Credit Balance

    - Accounts Payable – Normal Credit Balance

    - Wages Payable – Normal Credit Balance

    - Unearned Revenues – Normal Credit Balance

    - Service Revenues – Normal Credit Balance


    Remember, all the accounts that will be affected for the adjusting entries will
    come from the balance sheet and the income statement.


