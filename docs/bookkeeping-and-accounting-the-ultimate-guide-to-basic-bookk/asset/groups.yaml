    One of the most important indicators for management and outside stakeholders are
    the measures of profitability.


    ### **Profit Margin:**


    This may be the most recognized measure of the profitability of the organization
    and is a widely used measure. It is usually expressed as a percentage. This is
    often referred to as Return on Sales or ROS.


    It is frequently used in of two forms, the second being a little more restrictive
    in that it eliminates any revenue from sources other than operations.


    | Operating Expense/Operating Revenue |

    | Net Income/Total Revenues |

    | Net Operating Income/Total Sales |


    ### **Return on Investment:**


    Return on Investment or ROI or Return on Assets (ROA) is another very commonly
    used measure of the profitability of a firm. The individual accounting analyst
    may choose whether to use Average Total Assets and Net Income Before Taxes and
    Interest or some other that may suit the needs of the firm better. For, the analyst
