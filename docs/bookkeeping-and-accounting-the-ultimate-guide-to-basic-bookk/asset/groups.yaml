    # Preparing Reports


    A pretty important step is to prepare the reports or financial statements. Although
    there are so many reports that can be created, we are going to focus on the main
    reports as they are what is needed for a small business.


    As a bookkeeper, you will need to get very familiar with the following reports:


    - The Balance Sheet

    - Income Statement

    - Statement of Retained Earnings

    - Statement of Cash Flow


    Later in this book we will look more closely at each one of these statements and
    how to read them so that you can make sense out of your business''s financial
    standings.


    # Chapter 2 – What’s New in Bookkeeping for Small Business?


    Bookkeeping is always changing and new software is always coming out. Let''s look
    at some of these techniques and software programs that are out there for you to
    use as a small business owner.


    ## Open a Business Bank Account


    You want to see your business succeed. However, how do you keep your personal
    finances separate from your business finances? The answer is simple; just open
    a business bank account.


    It is extremely hard to see how your business is doing if you combine your business
    revenue and expenses with your personal. The best way is to check with your bank
    first to see if they have a business account available.


    Using a spreadsheet is basic. Although, what if your business has inventory, employees,
    vendors, etc.? This is when an accounting or bookkeeping software could come in
    handy. My recommendation is QuickBooks or Xero as both provide for these types
    of accounts.


    ## Choose the Best Bookkeeping Software for your Business


    Choosing software can vary based on your needs. At minimum, you will need a ledger
    or cashbook. The cashbook that would include the general journal and the ledgers
    can easily be done using a spreadsheet like Microsoft Excel or Google Sheets.
    Remember, Google Sheet will allow you to save it through Google and access to
    the file anywhere you are.


    QuickBooks and Xero may not be the best for your business. Sometimes, the most
    difficult part is finding the software that works the best for your needs.


    Let’s look at a few different bookkeeping applications that may get you started.
    I will include QuickBooks and Xero.


    ### Intuit QuickBooks Online


    QuickBooks Online is by far the best accounting and bookkeeping software for small
    businesses. I like that you can link it to your bank account. This makes it easy
    to use and track money when linked to your business account. It makes it easy
    to reconcile the business account and the books. Although there is so much more
    to QuickBooks Online.


    Just a few of the features within QuickBooks Online include:


    - Invoicing

    - Expense Tracking

    - Inventory Management

    - Purchase Ordering

    - Reporting


    As your business grows, you can upgrade your account between the top three tiers.
    This will allow you to have everything you need for your small business. Another
    part that is great about QuickBooks Online is that there are apps for your phone
    through both Android and iOS devices. The software is also compatible with most
    third-party applications.


    QuickBooks Online also offers some of the best pricing. There are four tiers of
    pricing, depending on what you need for your business. It also offers a 30-day
    free trial. However, if you want to jump right into it and go for the paid versions
    you will get a 50% discount for the first six months. That means if you are just
    starting your business you will have six months to make a little extra profit
    and get established before you need to pay full price.


    The most basic is the Self-Employed plan. This plan is $10 per month. It is designed
    for independent contractors and freelancers. It allows the following:


    - Track Mileage

    - Track Income and Expenses

    - Create Invoices

    - Accept Payments

    - Run Reports


    Keep in mind the Self-Employed plan cannot be upgraded to a higher tier. It will
    require you to create and set up a new account.


    The next tier is the Simple Start plan. With this plan, a single user is supported
    and costs $15 per month. This plan includes the following:


    - Track Mileage

    - Track Income and Expenses

    - Create Invoices

    - Accept Payments

    - Run Reports

    - Send Estimates

    - Track Sales and Sales Tax


    The next tier is the Essentials plan. This plan supports multiple users and costs
    $35 per month. This plan includes:


    - Track Mileage

    - Track Income and Expenses

    - Create Invoices

    - Accept Payments

    - Run Reports

    - Send Estimates

    - Track Sales and Sales Tax

    - Bill Management

    - Time Tracking


    The last tier is the Plus plan. This plan also allows for multiple users and costs
    $50 per month. This plan includes:


    - Track Mileage

    - Track Income and Expenses

    - Create Invoices

    - Accept Payments

    - Run Reports

    - Send Estimates

    - Track Sales and Sales Tax

    - Bill Management

    - Time Tracking

    - Track Inventory

    - Create Budgets

    - Pay Independent Contractors that use the 1099 form


    Like most small business, you will eventually have employees that you need to
    pay. With QuickBooks Online, you can add this feature to any of the top three
    tiers for an additional monthly cost.


    The best part is QuickBooks Online is very user friendly and easy to use. This
    software also has a good timesaving feature that you need in any good accounting
    and bookkeeping program. It will keep track of due dates for invoices, sync your
    business bank account, track your credit card transactions, and so much more.
    This allows you to focus more time on the business while maintaining accurate
    bookkeeping throughout your business and giving you a great outlook of the financials
    of the business. Another good timesaving feature that puts QuickBooks Online on
    top is that you can send out invoices to customers, allowing them to pay online
    at a click of a button.


    With any application, things tend to go wrong. That is why QuickBooks Online offers
    both phone and chat support. QuickBooks Online account is approved. That means
    no matter what your needs are you can give your accountant access to the books.


    Like all programs there are some limitations, although with QuickBooks Online
    it seems like the sky is the limit. The limitations really lay within the mobile
    apps. Here are the things you can do with the apps:


    - Send Invoices

    - Reconcile Transactions

    - Take photos of receipts and attach to expenses

    - View customer information and add new customers

    - View dashboard data, such as account balance, profit and loss reports, and open
    and past due invoices.


    After looking through what the app can do, if you feel like that works perfect
    then QuickBooks Online is the perfect software for you. However, if you prefer
    doing most of your accounting and bookkeeping through your phone, then there is
    another bookkeeping software choice for you.


    ## Xero


    If you would rather use a PC or a Mac, Xero has a lot to offer. Xero is by far
    the best accounting and bookkeeping software for Mac users. It is easy to use
    and learn. What I like about Xero are the videos. Everything you do in Xero will
    have a video that will help you learn.


    Xero also has comparable prices and is listed into three different plans. The
    starter plan is $9 per month. It does have some limitations. The features of the
    starter plan are:


    - Unlimited Users

    - Limit to Five Invoices per month

    - Limit to Five Bills per month

    - Limit to 20 Transaction Reconciliations per month


    The standard plan is $30 per month. This includes:


    - Unlimited Users

    - Unlimited Invoices

    - Unlimited Bills

    - Unlimited Transaction Reconciliations

    - Payroll for up to Five Employees


    The premium plan is $70 per month. Which includes:


    - Unlimited Users

    - Unlimited Invoices

    - Unlimited Bills

    - Unlimited Transaction Reconciliations

    - Payroll for up to 10 Employees. Note: this can be adjusted to support more employees
    if needed.

    - Supports Multiple Currencies. Note: this is a great feature if you do international
    business.


    The best part is that there are not any long-term contracts for using Xero. That
    means you can change at any time without having additional fees.

