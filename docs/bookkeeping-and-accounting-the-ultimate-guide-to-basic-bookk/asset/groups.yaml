    We will briefly discuss how we can protect ourselves.


    ## Personal Liability:


    Even though you incorporate or form a Limited Liability Company, you may have
    personal liabilities. These are some circumstances that would be a personal liability:


    - Person guarantee a loan for the business

    - Your actions result in an injury

    - You committed a crime or operated your business illegally

    - You do not operate your business as if it''s separate from your personal accounts.


    ## Business Liability Insurance:


    To help you protect yourself, it is a very good idea to have business liability
    insurance. This will protect your small business from personal injury or property
    damage if a lawsuit arises. Here are the three types of business liability insurance:


    - General Liability Insurance: Protects from injury claims, property damages,
    and claims of negligence and advertising claims.

    - Product Liability Insurance: Protects against financial loss as a result of
    defective products that cause harm.

    - Professional Liability Insurance: Protects business owners who provide a service.
    Protects against malpractice, errors, negligence, and omissions.


    ## Owner’s Equity


    There really is not a set way to manage the owner’s equity. This is based off
    the investments from stocks, the money you put into the company, and the amount
    you withdraw from the company. For these types of transactions, you can use a
    regular business bank account and link it to your bookkeeping software.


    ## Chapter 4 – Using Ledgers and Journals to Track Business Activity


    Before we can start to understand the financial reports, we need to look at where
    the information comes from. We can start with the journal entries that are made
    by the business and when those entries are posted to the ledgers. Next, we will
    then look at how we can track those transactions. Knowing where the transactions
    come from and where they are listed in the financial reports will help you better
    understand the reports that are created.


    ## Financial Journals


    Most of the time when we talk about journaling in accounting and bookkeeping,
    we refer to the General Journal.


    How many times have you looked at the General Journal and gotten lost on how the
    business is really doing? Don’t worry! If you said a lot or all the time, you
    are not alone. That is why in bookkeeping, along with the General Journal, you
    have six additional journals. They are:


    1. Cash Receipts Journal (CRJ)

    2. Cash Payments Journal (CPJ)

    3. Sales Journal (SJ)

    4. Sales Returns Journal (SRJ)

    5. Purchase Journal (PJ)

    6. Purchase Returns Journal (PRJ)

    7. General Journal (GJ)


    Let’s look at each of the seven journals to get a better understanding. In the
    examples, you will also see the ref field. There may be references that do not
    correspond to a journal. That is because they will correspond to a specific ledger.
    We will be talking about ledgers later in this chapter.


    Remember, if you are using accounting software, then all this is done for you
    through that software. However, it is nice to know the basics so that you can
    better understand where the financial reports are coming from.


    ## Cash Receipts Journal (CRJ)


    When you receive cash, you will record it in the Cash Receipts Journal. The categories
    of the CRJ are:


    - Date

    - Details

    - Ref.

    - Bank

    - Income

    - Sundry


    When you look at the CRJ, you will see three major categories: The bank is the
    total of each line and shows how much cash was received. Income is taken from
    receipts where you brought in money, while debtors is when you have a receipt
    where you paid out money. The category "sundry" is a word that means "various,"
    miscellaneous, or "general."


    Here is an example of a CRJ:


    | DATE | DETAILS | REF | BANK | INCOME | DEBTORS | SUNDRY |

    |---|---|---|---|---|---|---|

    | 1 | Capital | S1 | 15,000 | - | - | 15,000 |

    | 7 | Loan | S2 | 5,000 | - | - | 5,000 |

    | 12 | Service rendered | L1 | 10,500 | 10,500 | - | - |

    | 30 | Smiths | L2 | 5,000 | - | 5,000 | - |

    | Total | | | 35,500 | 10,500 | 5,000 | 20,000 |


    ## Cash Payments Journal (CPJ)


    Much like the CRJ, the Cash Payments Journal shows where the cash has been paid
    out of the business. The categories of the CPJ are:


    - Date

    - Details

    - Ref.

    - Expenses

    - Creditors

    - Sundry

    - Bank


    If you notice, the categories are the same except for income is now expenses,
    the Debtors is now Creditors, and the bank category is now at the end. Here is
    an example of a CPJ.


    | DATE | DETAILS | REF | EXPENSES | CREDITORS | SUNDRY | BANK |

    |---|---|---|---|---|---|---|

    | 8 | Equipment purchased | A1 | - | - | 12,000 | 12,000 |

    | 9 | Drawings | S3 | - | - | 500 | 500 |

    | 12 | Salary | E1 | 4,000 | - | - | 4,000 |

    | 13 | Telephone company | L2 | - | 200 | - | 200 |

    | 15 | Loan repayment | S4 | - | - | 4,000 | |


