    ## Chapter 2 - Understanding the Vocabulary


    Every special area of interest has its own vocabulary, and accounting is the the
    same. Many of the words used will be familiar to the reader but may have certain
    shades of meaning that are important. We need to understand this vocabulary. Here
    are some key definitions that are important to the accounting function.


    **Asset:** an asset is anything the organization owns that helps it accomplish
    its mission. For a fast food restaurant, the grill or stove in the kitchen area
    is an asset. For a retail store, the inventory in the back room is an asset, along
    with display cases and shelves.


    **Liability:** a liability is anything the organization owes to someone else.
    Unpaid wages to employees is a liability, taxes owed to the local government is
    a liability, unpaid insurance premiums for employee healthcare policies is a liability,
    bills for inventory that have not been paid is a liability.


    **Equity:** equity is the measure of the claim of someone on the assets of the
    organization, as liabilities (claims by the person or entity to whom the liability
    is owed, as loans from a bank) and the investment by the owners of the organization.


    **Income:** money flowing into the organization from its operations in whatever
    the line of business might be, for example, sales in a fast food restaurant, or
    rent collected on the property business owns.


    **Expense:** this is the amount of money the organization needs to spend in order
    to carry out its operations. This represents payments to asset and service providers.
    For example, payments to a supplier of inventory items for a retail store.


    **Distributions:** outflows of money to owners or stockholders, or bonuses to
    employees at the end of the year, for example.


    **Cash Flow:** the term cash flow represents the money flowing through the operation,
    essentially income minus expenses. You can imagine a stream of money flowing into
    the organization with small streams going out as distributaries to pay for liabilities.
    The flow that is moving through this stream is the cash flow. How much is left
    at the end of the process is the profit for the firm.


    **Overhead**: this is a group of costs not directly associated with the major
    function of the organization but necessary in order to make the organization accomplish
    its goals. For example, in a hospital, the janitorial staff cleans and sanitizes
    the buildings, rooms and equipment are not directly associated with the hospital''s
    patients, but they are absolutely essential. The labor and other costs like cleaning
    and sanitizing supplies are part of the organization''s overhead. All the other
    myriad of costs like electricity, lighting, lawn maintenance, and even sweeping
    the parking lot are essential but not directly tied to the patients and their
    care. The accounting office is considered overhead for any organization not involved
    in the Public Accounting business.


    **GAAP**: This is the term used to describe the Generally Accepted Accounting
    Principles. This is a set of ''rules'' for the accounting profession, which must
    be followed to assure an accurate description of the financial activities of the
    organization. GAAP applies to all organizations that function in commerce, public
    service, and all other sectors of the general economy. Following these GAAP rules
    assures the public, the stockholders, the donors to non-profit organizations,
    the owners, employees and the taxing and regulatory authorities that the accounting
    for the organization is done in accordance with the proper methods and systems.


    Each country establishes its own accounting standards but there exists an International
    Accounting Standards Board responsible for establishing and accrediting accounting
    standards for all nations who subscribe. Similarly, many countries establish similar
    Boards, to promulgate and enforce standards through certification and audit systems.
    These are in the form of standards, conventions and rules. Companies are not necessarily
    required to follow them but any publicly traded company must conform to the established
    Accounting Practices.


    ## Chapter 3 – Accounting Reports: The Income Statement


    Remember that the product of accounting is information. The three most common
    forms for that information are the "Income Statement", the "Balance Sheet", and
    the "Cash Flow Statement." Every organization uses some form of these three documents
    and usually all three. We will explore the Balance Sheet in Chapter 4 and the
    Cash Flow Statement in Chapter 5.


    The Income Statement or Profit and Loss Statement (or P&L statement) can be imagined
    as a video tape of the organization over some period of time, like a month, six
    months or a year. This statement tells management how the firm is doing from the
    standpoint of "Are we making money or not?" Of course, this is a very fundamental
    question, after a number of periods of losses, the firm will no longer be viable
    and will go out of business.


    The most important use of the Income Statement is to compare it with prior periods
    and with the period budget. If management has determined that the firm must meet
    certain performance levels, they need the answer to the question above; "How are
    we comparing with our goals and budget?" Each organization has an established
    and agreed upon budget. The budget contains allocations of resources for all the
    activities of the organization, from sales, purchases of materials for sale or
    production, employee salaries and benefits and overhead items like electricity
    and water.


    These budgets are set up, usually each year, to guide the managers and supervisors
