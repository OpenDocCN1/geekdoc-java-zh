  mdcn: "\n\n## 第一部分：簿记\n## 小企业簿记终极指南\n\n![](img/bd9079d4c99ce4355246ff3fc6206714_9_0.png)\n\
    \n## 引言\n\n无论你是刚开始创业，还是已经经营多年，了解簿记都是至关重要的。\n\n簿记已经有了几个世纪的历史。然而，它随着时间的推移而不断演变，帮助你的企业追踪财务状况。\n\
    \n簿记涵盖了许多方面，可以帮助企业主对公司做出决策。为了让你更好地理解簿记，我的目标是帮助你对如何阅读财务报表、簿记基础、员工管理、理解资产负债表和损益表等内容建立良好的认知。\n\
    \n跟我一起探索簿记的世界吧，帮助你——作为企业主的你理解如何读懂簿记的含义。\n\n作为额外奖励，我还为你的业务税务包含了一个关于企业税收的部分。我还包含了准备\
    \ W-2 表格的步骤说明以及所需的信息。你会发现，这不仅仅是提供信息并将其输入 W-2 表格中那么简单。\n\n继续读下去，你将看到要与你的记账员保持一致需要什么。我常说：“经营业务的不是企业主，而是与记账员联手的企业主真正在经营业务。”\n\
    \n经营业务可以是很有趣且有回报的。然而，如果你缺乏基本的财务技能基础知识，这可能也会变得非常有压力。\n\n在本书中，你将学习簿记的基础以及如何为你寻找合适的记账员。在阅读过程中，你还将学习分类账（ledgers）和日记（journals）。随时了解你的资金所在地是非常重要的。我也花时间和你讨论雇佣员工的问题。面对事实吧，如果你的业务要增长到某个水平，你最终需要雇佣与你共的人。\n\
    \n目前有很多软件可以帮助你所有的簿记需求，尽管并不是所有的会计软件都适用于你的业务。我们将查看几款评价较高的应用程序，并为你分析每种程序的优缺点。\n\n\
    不要忘记，你还需要理解那些令人生畏的财务报表。这就是为什么我们将查看四份主要的财务报表并对它们进行拆解，以便你能够轻松地阅读和理解每一份。\n\n无论你是已经经营了几年还是刚刚起步，你都在年底需要报税。这是一项大量的工作，你的记账员可以帮助你做好准备。在奖励章节中，我包含了一份小企业清单，帮助你在这一过程中了解需要查找并保留哪些文件。\n\
    \n你知不知道，作为企业主，你可以抵扣你的很多开支？我也包含了这一点。这只是一个很小的列表，通过一点研究，你可能会发现更多。\n\n最后，我还详细列出了如何着准备、分发和提交员工的\
    \ W-2 表格。\n\n所以，跟我一起开启这段进入小企业簿记的辉煌冒险吧，赋予你理解业务财务健康状况的能力。\n\n## 第一章 – 簿记基础\n\n在我们开始拆解簿记之前，我们需要先了解一些基础知识。我希望你具备阅读和理解你的财务记录的能力。这将让你了解业务的财务状况。反之，它将使你能够做出良好的决策，从而增加业务的增长。\n\
    \n## 双式记账法\n\n簿记使用一种称为“双式簿记”的方法。这意味着对于每一笔记录，至少有一笔借有一笔贷。\n\n我希望你记住这个方程式：\n\n+ -\
    \ - 资产 = 负债 + 股东权益\n\n这是双式记账法的基本公式，并将适用于你所做的每一笔交易。\n\n## 原始凭证\n\n每一笔发生的交易都会有一个原始凭证。原始凭证可以是从合同到加油收据的任何东西。如果你花费了公司的钱，你就需要某种形式的证明你花了多少钱。这些就是原始凭证。\n\
    \n这些文件将为我们提供在账上记录所需的所有信息。这包括引用原始凭证。某些软件允许你将扫描文件附加到交易中，这样你就可以任何时候调出原始凭证。\n\n##\
    \ 结期程序\n\n结期程序不仅涉及季度。尽管所有交易在几个月或一年内都已经被记录，但它们并不会直接被读取以准备财务报表。\n\n为了确保你的账目在准备财务报表时准确无，你需要考虑至少在月末、年底以及薪资年度结束时需要执行的程序。\n\
    \n以下大纲将作为指南，显示在每个时间段应该做的工作。\n\n1. 月末程序\n    - 运行公司/业务数据审计\n    - 对你的银行账户\n   \
    \ - 审查报告\n    - 发送客户账单\n    - 记录折旧\n    - 支付工资税\n    - 锁定期间\n2. 年底程序（为新财年做准备）\n\
    \    - 完成月末任务\n    - 执行库存盘点\n    - 向你的会计师提供信息\n    - 输入年调整\n    - 备份你的公司/业务文件\n\
    \    - 开启新财年\n    - 优化并验证你的公司/业务文件\n3. 薪资年度结束（为新财年做准备） - 注意：不要更新税表\n    - 运行你的最后一次\n\
    \    - 优化你的公司/业务文件\n    - 备份你的公司/业务文件\n    - 开启新年度\n    - 恢复\n    - 打印年度报表\n \
    \   - 打印薪资报表\n\n"
