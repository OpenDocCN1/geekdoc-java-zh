    # Chapter 3 – Accounting Reports: The Income Statement


    Remember that the product of accounting is information. The three most common
    forms for that information are the "Income Statement", the "Balance Sheet", and
    the "Cash Flow Statement." Every organization uses some form of these three documents
    and usually all three. We will explore the Balance Sheet in Chapter 4 and the
    Cash Flow Statement in Chapter 5.


    The Income Statement or Profit and Loss Statement (or P&L statement) can be imagined
    as a video tape of the organization over some period of time, like a month, six
    months or a year. This statement tells management how the firm is doing from the
    standpoint of "Are we making money or not?" Of course, this is a very fundamental
    question, after a number of periods of losses, the firm will no longer be viable
    and will go out of business.


    The most important use of the Income Statement is to compare it with prior periods
    and with the period budget. If management has determined that the firm must meet
    certain performance levels, they need the answer to the question above; "How are
    we comparing with our goals and budget?" Each organization has an established
    and agreed upon budget. The budget contains allocations of resources for all the
    activities of the organization, from sales, purchases of materials for sale or
    production, employee salaries and benefits and overhead items like electricity
    and water.


    These budgets are set up, usually each year, to guide the managers and supervisors
    in what decisions can be made to commit resources like money and labour, and for
    what purposes. Based on this budget, which has been agreed upon by management,
    it acts as a steering mechanism for the firm''s role in keeping score. The periodic
    P&L reports represent the Accounting function''s role in keeping score. Here is
    an example of a P&L Statement or an Income Statement. We will look at each of
    these entries to see what they represent, based on The Martin Company.


    # THE MARTIN COMPANY, INC.

    INCOME STATEMENT


    # (FIRST HALF, 2014)'
