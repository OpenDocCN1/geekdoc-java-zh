    - 现金及现金等物

    * 现金

    * 美国国债

    - 应收账款

    * 客户欠给企业的短期债务

    - 存货

    * 原材料


    ## 非流动资产


    这些资产无法轻易转化为现金。它们预计在一年内转化为现金，或使用寿命超过一年。这些资产通常会计算折旧。这些资产的示例包括：


    - 有形资产

    * 机械

    * 计算机

    * 建筑

    * 土地


    - 无形资产

    * 商誉

    * 专利

    * 著作权


    ## 负债


    当你观察负债时，应该将其视为企业欠别人的债务。和资产一样，负债既可以是流动的，也可以是长期的。


    - 流动负债

    * 一年内支付

    * 应付账款


    - 长期负债

    * 超过一年的债务

    * 超过一年的非债务负


    ## 所有者权益


    这是投入企业的资金。利润表中的留存收益将在财政年底转入所有者权益。所有者权益显示了企业的净值。所有者权益中列出的账户类型：


    - 资本 – 企业投入或赚取的资金

    - 提取 – 从企业中提取的资金


    ## 利润表


    对于企业主来说，利润表看起来可能很吓人。然而，事实如此。利润表详细查看了企业的收入（或销售额）和支出。这通常在整个财政年度按季度和每年进行。


    在谈论利润表时，你会听到利润、收益和收入等术语。记住，它们的意思是相同的。


    你将使用两种基本格式：多步法和单步法。以下是每种格式的步骤：


    - 多步法

    - 净销售额

    - 销售成本

    - 毛利*

    - 销售、一般和管理费用 (SG&A)

    - 营业利润*

    - 其他收入与支出

    - 税前利润*

    - 税费

    - 净利润（税后）*

    - 单步法

    - 净销售额

    - 材料与生产

    * 营销与管理

    * 研发费用 (R&D)

    * 其他收入与支出

    * 税前利润

    * 税费

    * 净利润


    在多步法中，有四个盈利能力衡量指标 (*)。以下是利润表的示例：


    | | 2015 | 2016 |

    |---|---|---||

    | 净销售额 | 1,500,000 | 2,000,000 |

    | 销售成本 | (350,000) | (375,000) |

    | 毛利 | 1,150,000 | 1,625,000 |

    | 营业费用 (SG&A) | (235,000) | (260,000) |

    | 营业利润 | 915,000 | 1,365,000 |

    | 其他收入（支出） | 40,000 | 60,000 |

    | 营业外收益（亏损） | - | (15,000) |

    | 利息支出 | (50,000) | (50,000) |

    | 税前利润 (税前利润) | 905,000 | 1,360,000 |

    | 税费 | (300,000) | (475,000) |

    | 净利润 | 605,000 | 885,000 |


    一旦你了解了利润表的格式及其包含的内容，你就会发现在2015年至2016年之间，销售额增长了33%。同时，销售成本占销售额的比例从23%下降到19%。如果你进一步观察，可以看到这两年之间其他的增长和减少。


    ## 所有者权益表


    所有者权益表可以作为单独的报表，也可以包含在资产负债表和利润表中。它也被称为留存收益表。该表将显示企业收益的状况。


    很多时候你会在公司中看到这种表，因为它们有股东并支付股息。然而，对于小企业来说，它是展示留存收益和财务状况的有用工具。


    该表的主要目的是向公众发布财务信息，以便他们决定是否要投资你的企业。它也有助于分析企业的健康状况。


    Alex 打印与设计


    所有者权益表


    截至2015年12月31日的年度


    Alex 资本：$100,000

    加：额外投入：$10,000

    净利润：$57,100

    总计：$167,100

    减：Alex 提取：$20,000


    Alex 资本 – 2015年12月31日：$147,000


    ## 现金流量表


    重要的一点是现金流入出企业。现金流量表为你提供信息。然而，它分为四个部分：


    1. 经营活动

    2. 投资活动

    3. 融资活动

    4. 补充信息


    以下是现金流量表的示例。


    Frank''s Deal LLC


    现金流量表


    截至2017年7月31日的月份


    净利润：$100

    加回：折旧费用：$20

    加回：出售设备亏损：$180

    库存增加：($200)

    用品增加：($150)

    经营活动提供的（或用的）现金：($50)


    购买办公设备：($1,100)

    出售设备获得的现金：$900

    投资活动提供的（或用的）现金：($200)


    所有者投资：$2,000

    现金净增加：$1,750

    年初初现金：$0

    2017年7月31日现金：$1,750


