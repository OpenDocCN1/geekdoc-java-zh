    # Chapter 4 – Double-Entry Accounting


    Double-entry accounting is really where you learn how to record your numbers and
    where to put them. Before we get talking about this form of accounting we need
    to mention the chart of accounts. The chart of accounts is a document that lists
    the name of each account and account number in the company.


    For example, if you have cash, accounts receivable, accounts payable, capital,
    and supplies expense as your accounts your chart of accounts may look like this:


    # Assets:


    Cash: 100


    Accounts Receivable: 130


    # Liabilities:


    Accounts Payable: 200


    Supplies Expense: 230


    # Owner’s Equity:


    Joe Stern, capital: 300


    Now that we have an idea about the chart of accounts I want to look at the transactions
    that will be recorded for your company. Every transaction is recorded in a journal.
    This is the book of the original transactions. These transactions will either
    increase or decrease your company’s accounts. These entries consist of the date
    of the transaction, the names of each account that is affected, reference number,
    and the amount of each transaction. All this information will be coming from the
    various source documents. For example, invoices will be considered a source document.


    From the journal we will record each of these transactions into the general ledger.
    The general ledger is a summary of the balances of all accounts used by your company.
    It will have a separate journal for each account in the chart of accounts. This
    will have the name of the individual account and the'
  - "[PAGE 149]\n\naccount number at the top of the journal. The account number will\
    \ be the reference number in the journal. Then the journal for the general ledger\
    \ will consist of the date, description, and amounts. Then we transfer the amounts\
    \ over the general ledger; we call it posting. You would not record the reference\
    \ number on the main journal until you post it to the general ledger. This helps\
    \ keep track of the accounts that you have already posted and you are better organized\
    \ as where it was posted.\n\nA good way to look at it is when you balance your\
    \ bank account or your checkbook. The ledger that you record your transactions\
    \ on will be a journal. When you compare it to your statements you will check\
    \ that it is posted correctly. Also, this will have two columns for your amounts.\
    \ It will either be debit and credit or deposit and withdrawal. This is a form\
    \ of the double-entry accounting for recording journal entries.\n\n# Debits and\
    \ Credits\n\nWith double-entry accounting, every transaction made will have at\
    \ least two entries: a debit and a credit. Most of us think that a debit decreases\
    \ our account and a credit increases our account. When recording the entries in\
    \ your journal for your bank account this is true. Mainly because you are only\
    \ working with cash in and out of your account. In accounting the debit means\
    \ left and credit means right. This is because depending on what is being recorded\
    \ a debit could either increase or decrease the account. The same for credits.\
    \ The following will show if debits and credits will increase or decrease the\
    \ accounts.\n\n| ACCOUNT | DEBIT (Left side) | CREDIT (Right Side) |\n|---|---|---|\n\
    \ Assets | Increase | Decrease |\n Liabilities | Decrease | Increase |\n Owner's\
    \ Equity | Decrease | Increase |\n Revenue | Decrease | Increase |\n Expenses\
    \ | Increase | Decrease |"
  - '[PAGE 150]


    There are several steps that need to be taken when entering debits and credits
    into the journal. These steps will make up a journal entry and will be repeated
    for each entry made.


    +   1. We need to figure out which accounts will be affected by the transaction.

    2. Once the affected accounts are decided, then you need to find out whether this
    account will increase or decrease the account.

    3. Every time you make a transaction both the debits and credits will be equal.
    Sometimes you will have multiple transactions as the credit or debit depending
    on what accounts need to be affected.

    4. Always list the account that will be debited first and will be on the left
    side. Then you will indent the credits so that they will show on the right side.

    5. Ensure that the debits and credits are recorded on the correct side and that
    they equal.


    # T Accounts


    To simplify lets''s look at them as T accounts. Each account type will have either
    a debit normal balance or a credit normal balance. The following information will
    help you in knowing which account has a debit or a credit normal balance.


    +   - ASSETS—Debit Normal Balance

    - LIABILITIES—Credit Normal Balance

    - OWNER’S CAPITAL—Credit Normal Balance

    - OWNER’S DRAWING—Debit Normal Balance

    - REVENUE—Credit Normal Balance

    - EXPENSES—Debit Normal Balance


    These are considered the five major accounts—assets, liabilities, owner’s equity,
    revenues, and expenses.'
