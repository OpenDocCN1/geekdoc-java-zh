  mdcn: "\n如果您想添加激励措施，请确保将其加入员工手册中。这样，每个人都通清楚您的业务提供哪些福利。出于会计和记账目的考虑，您可能需要考虑福利管理软件。这使得在需要记账时变得更加容易。\n\
    \n## 联邦和州劳动法\n\n劳动法非常重要，特别是在招聘方面。在招聘退伍军人、外国劳工、家庭员工、童工和残障人士时有具体的指导方。这只是其中几个，还有许多其他规定。\n\
    \n有关这些不同劳动法的完整详细信息，请咨询劳工部的联邦和州法律资源。\n\n## 第 6 章 – 折旧\n\n您的小型企业可能会购买预计可以使用几年的设备。然而，在这些几年里，您的设备将会部分价值。\n\
    \n例如，您花 $575 购买了一台运行 Windows 7 的电脑。三年后，您的电脑开始出现故障，您需要寻找零件。在此期间，您的设备折旧额从 $575 降到了约\
    \ $50。与此同时，随着技术的发展，您再也买不到零件。现在，您这 $50 的折旧额被视为回收费。\n\n如您所见，随着时间的推移，您的设备会价值，我们需要将其计算入记账中。折旧可以作为年度所得税扣除项。它将作为费用列在损益表中。您可以通过在纳税申报时填写\
    \ 4562 表来利用此扣除。有关折旧以及您必须具备的要求的更多信息，请参阅第 946 号出版物（如何折旧财产）。\n\n为了能够申请折旧扣除，您的财产需要符合几项准则：\n\
    \n- 您必须拥有该财产。但是，您也可以对租赁财产的资本改良进行折旧。\n- 财产必须用于业务或产生收入。如果您将财产同时用于业务和个人用途，则不能仅根据财产的使用对其进行扣除。\n\
    - 财产必须具有超过一年的确定寿命。然而，即使您满足了财产扣除的所有要求，也无法扣除以下财产：\n    - 任何在同一年投入使用并处置的财产。\n   \
    \ - 用于用于建设资本改良的任何设备。您可以根据改良在施工期间为设备增加允许的折旧。\n    - 特定的期限权益。\n\n大多数财产都可以折旧。您可以对建筑、机械设备、车辆、家具和设备进行折旧。然而，土地不能折旧。\n\
    \n这是因为预计您将在整个业务生命周期内使用该土地，它永远不会折旧。但是，您经营业务的土地上的建筑是可以进行折旧的。\n\n在报税和使用 4562 表进行折旧扣除时，您需要识别许多项目。这是为了确保财产的正确折旧。这些项目包括：\n\
    \n- 财产的折旧方法\n- 资产的分类\n- 财产是否为“列报财产”\n- 您是否选择将资产的任何部分费用\n- 您是否符合任何“奖金”第一年折旧\n-\
    \ 财产的可折旧基数\n\n我们如何计算折旧？我们现在将讨论两种不同的方法：账面折旧和税务折旧。\n\n## 账面折旧\n\n在账目中，您经常听到账面折旧。这种类型主要用于会计和记账目的。这种折旧的目标是使资产的成本与其在使用寿命内赚取的收入相匹配。这种折旧最常见的方法是直线法。这可以通过两种方式进行计算：\n\
    \n- 年度折旧额 = (成本 – 残值) / 使用寿命\n- 年度折旧额 = (成本 – 残值) * 折旧率\n\n让我们看看您熟悉的不同术语的每个领域：\n\
    \n- 成本（Cost）：财产或设备的原始成本。\n- 残值（Residual Value）：这也被称为废旧值。在寿命结束时，财产或设备的价值是多少？\n\
    - 使用寿命（Useful Life）：这是您在处置设备之前计划保留和使用的时间。\n- 折旧率（Rate of depreciation）：这是会计期间内使用寿命的百分比。其计算方式如下：\n\
    \  折旧率 = 1 / 使用寿命 * 100%\n\n## 税务折旧\n\n您有许多方法可以计算折旧。因此，您不需要局限于某一种类型。在涉及税务时，美国国税务局（IRS）最喜欢加速折旧法。这种方法在资产寿命早期可以收回更多资金。您可以使用几种不同的方法来加速折旧：\n\
    \n- 余额余额法折旧 = 折率 * 净账面价值\n\n此公式查看账面价值的费率：\n\n- 折率（Rate）：这是一个固定费率，可以计算为：(残值 / 成本)\
    \ * (1 / 年限)\n- 净账面价值（Net Book Value）：原始成本 – 截至目前的资产累计折旧额。\n\n我们还需要考虑双倍余额法。\n\n\
    - 双倍折旧率 = 2 / 使用寿命\n- 双倍余额法折旧 = 净账面价值 * 2 / 使用寿命\n\n在进行折旧时，请务必保留收据。这将帮助您的记账员、会计师和审计师在纳税季节每个月检查是否有错误。\n\
    \n## 第 7 章 – 调整分录\n\n您会发现调整分录对于您的小型企业非常重要。\n\n（注：此处原文后续为大量重复内容，已按要求剔除）\n\n## 第\
    \ 7 章 – 调整分录\n\n| 资产 | | | 负债 | | |\n| :--- | :--- | :--- | :--- | :--- | :---\
    \ |\n| 现金 | $1,800 | 应付票据 | $5,000 | |\n| 应收账款 | $4,600 | 应付账款 | $2,500 | |\n\
    | 物料 | $1,100 | 应付工资 | $1,200 | |\n| 预付保险 | $1,500 | 预收收入 | $1,300 | |\n| 设备 |\
    \ $25,000 | 总负债 | $10,000 | |\n| 累计折旧 | ($7,500) | | | |\n| | | 所有者权益 | | |\n\
