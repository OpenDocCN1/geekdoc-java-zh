    Everyone who has income and expenses needs to carry out Personal Accounting, ranging
    from balancing a checkbook to filing personal tax returns. These people do not
    have to be trained in bookkeeping or accounting but do need to keep certain records.
    This is part of Personal Accounting.


    Other parts of personal accounting are things like keeping track of bills so they
    can be paid on time, establishing a budget and monitoring many other bits of information
    like credit card invoices, to watch for errors and unauthorized charges.


    In today''s atmosphere of Identity Theft, we all need to learn to work as a forensic
