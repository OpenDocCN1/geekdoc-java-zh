    法律规定所有上市公司和其他组织都必须进行外部审计。外部审计必须由合格的外部机构执行，该机构不属于被审计会计部门的一部分。CPA 可以担任这些独立外部审计师。他们必须代表独立的第三方，这一角色通常由以
    CPA 或外部审计师身份运营的商业组织承担。这些公司可以是小型个人企业，也可以是上述及其他许多大型跨国公司。


    对于上市公司（即通过私下或或股票市场出售股票凭证的公司），外部审计报告至关重要，并且是写给股东的。对于私有公司，报告提交给所有者和高层管理人员。股东依靠外部审计报告来确保公司根据
    GAAP 或其他适用标准对其业务活动进行会计处理。


    对于非营利组织和慈善机构，报告提交给董事会。


    例如，莎伦·哈斯（Sharon Haas）毕业于中西部的一所大学，拥有工商管理学学位，主修会计专业，并获得了侧重于会计和金融的 MBA 学位。她在伊利诺伊州芝加哥的一家中型制造公司拥有十年的会计工作经验。伊利诺伊州与美国大多数其他州一样，要求
    150 小时的教育才能获得 CPA 证书和执照。MBA 经常被用来满足这一要求。许多州还对维持 CPA 执照有继续教育的要求。莎伦在研究生毕业后通过了所需的考试并获发了执照。


    目前，她在俄亥俄州克利夫兰的办公室为一家跨国 CPA 事务所担任外部审计师。她的客户涵盖了俄亥俄州、密歇根州、威斯康星州和伊利诺伊州的若干公司。她是美国注册会计师协会（AICPA）的成员。


    作为外部审计师，她与客户公司保持关系，在税收、投资、资本采购和会计领域提供咨询服务。每年，她都会访问每家客户公司以履行她的外部审计职责。她有一位随她出行的助理，协助审计工作并准备年度审计报告。


    莎伦喜欢与雇主和客户一起工作。她说这里从没有无聊的日子；每一天都会带来新问题和不同的挑战。


    莎伦和所有其他外部审计师必须谨慎的最重要责任之一，是保持客观外部权威的地位。莎伦像大多数专业人士一样，友好且外向，但她必须小心地将个人情感与工作分开。她在工作时必须保持客观和冷静。她必须对客户保持一种“公平交易”（arm’s
    length）的态度。她必须坚持她的专业标准，并根据她的发现进行报告，而不是根据客户可能说的话。关于审计公司的故事层出不穷，一些非常著名的公司在履行其作为客观外部审计师的职能时，没有保持这种客观性以及对股东和利益相关者的责任感。莎伦的声誉和执照取决于她的专业态度。


    ## 第8章 – 会计工作：财务会计


    大多数组织和企业都有专人负责财务部门。这通常被称为财务总监办公室（Comptroller''s Office，读音为 controller），由受过会计教育和培训的人员组成。办公室负责人通常是
    CPA，负责指导办公室的员工，并向高层管理人员提供建议和指导。这一职位通常直接向公司所有者或所有者或 CEO（首席执行官）汇报，通常被称为 CFO 或财务官。


    在私营部门，这些工作通常具有挑战性，而且对对运营的健康至关重要。这样的管理层成员之一是乔治·威尔逊（George Wilson）。他是中型企业“每日收获餐厅”（Catch
    of the Day Restaurants）的 CFO，这是一家专门经营海鲜的连锁餐厅。


    乔治是财务总监办公室的负责人，负责报告公司的财务状况。除了定期的利润表外，他还会使用几个重要指标。资产负债表每年更新一次，因为它们的变化比其他报告慢。以下是两个重要的衡量标准，以比率形式表示。


    流动比率比较了公司准备履行当前债务的程度。如果一个组织发现其流动比率小于 1，这意味着它面临着流动性风险，以至于可能破产。它没有手段支付其当前债务。这些债务可能是付给供应商的、支付员工的工资或应交政府的税款。其中任何一种都无法长期维持。

