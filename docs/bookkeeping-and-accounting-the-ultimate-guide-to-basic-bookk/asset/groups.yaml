    At the same time, if you offer vacation pay, sick pay, or emergency leave pay,
    then you will calculate that pay based off the hours they would have normally
    worked that day.


    For the compensation plan you will withhold taxes like you normally would for
    your normal pay period.


    # Choose an in-house or external service for administering payroll


    Making the decision to have your payroll in-house or outsourced to another business
    can be one of the biggest decisions you will make for your businesses payroll.
    Here are a few questions you can ask yourself to make the decision a little easier.
    After all, the wrong decision for the payroll could cost you a lot of money.


    +   1. How much control do you want over the process of paying your employees?

    2. How frequently do your employees get paid?

    3. Do different groups of employees get paid at different times?

    4. How often do you have to give out last minute pay checks and changes?

    5. How often do you process off-cycle payments?

    6. How complicated is your payroll? Do you have employee benefits and deductions,
    allowances, etc.?

    7. Does your organization have the resources to support an in-house payroll?

    8. Do you have someone on your team that has a good understanding of payroll and
    statutory reporting?

    9. How many accounts do you need to update on the general ledger?


    +   10. Do you want a record of all payroll transactions and changes made? These
    are only a few questions you may want to consider. Keep in mind, the longer an
    outside source needs to work on it the more money you need to pay them. If you
    can limit it to only a few hours a week, then it would be good to use an outside
    source and utilize your employee in another area of the business. However, if
    you feel that it will cost you more to pay an outside'
  - '[PAGE 47]


    source due to the number of transactions that need to be done and it turns into
    a fulltime job, you may want to consider doing the payroll in-house.


    # ## Decide who will manage your payroll system


    Now that you have your payroll system up, another big decision is deciding upon
    a manager for it. For a small business, you may want to outsource this work as
    it will not be much work in the beginning. As your business grows, it would be
    a good idea for you to have an employee or yourself, as the business owner, to
    get trained on good bookkeeping practices.


    # ## Know which records must stay on file and for how long


    One problem that many small businesses face is the duration of keeping files.
    This is why I am adding it here. Some would suggest that you should keep tax information
    for the business forever. I would not advise this unless you have an iCloud service
    that meets the security requirements for safeguarding the business and employees''
    information. Besides, if you are a big company, which is a lot of storage space
    that you would need for files.


    The IRS can audit your tax records for 3 years and can extend that for 6 years.


    +   - Business Tax Returns: Should be kept until IRS can no longer audit your
    tax returns. (6 years)


    +   - Payroll Tax Records: This will include time sheets, wages, tax deposits,
    benefits and tips. (4 years of taxes are due or when you paid them. Whichever
    is the later date


    +   - Current Employee Files: (7 years after employee leaves business or 10 years
    if employee was involved in a work-related accident)


    +   - Job Application Information: (3 years even if you do not hire the employee)


    +   - Ownership Records: Includes business formation documents, annual meeting
    minutes. By-laws, stock-ledgers, and property deeds. Keep in mind, your business
    may not have all these documents. These documents will be anything you needed
    to form your business. (Retained Permanently)


    +   - Accounting Service Records: This will include financial statements, check
    registers, profit and loss statements, budgets, general ledgers,'
  - '[PAGE 48]


    cash books, and audit reports. (At minimum 7 years. I would recommend permanently
    as it will give you an outlook of how your business has grown.)


    +   - Operational Records: This includes bank account statements, credit card
    statements, canceled checks, cash receipts, and check book stubs. (7 years)


    I know it seems a long time to hold onto these records. Keep in mind, you want
    to protect your business and keeping these records can safeguard your business
    when a problem may come up.


    In today''s world, everything is digital. You may want to invest in a server that
    meets the requirements needed to protect these files.


    # Report payroll taxes as needed on a quarterly and annual basis


    Now that you have employees, you will need to report the payroll taxes. The taxes
    that must be deposited to the IRS are the federal income tax withholdings, social
    security, and Medicare taxes for both the employer and employee.


    There are two deposit schedules. They are monthly and semi-monthly. Before you
    start each calendar year, look at the Publication 15 on the IRS website to determine
    which payment schedule you are required to use.


    You have probably noticed I have referenced Publication 15 a few times. I would
    advise saving the publication as it has a lot of information you will be referring
    to while running your small business. Another one, depending on what you are using,
    will be by Publication 51.


    Publication 15 will be for forms 941, 944, and 945. For form 943 you will use
    Publication 51.


    As the employer, you will be required to report wages, tips, and other compensation
    by using the required forms. You will also report the taxes either by filing out
    the paper form and sending it into the IRS or by e-filing through the IRS website.


    Let''s look at the different forms:


    # Form 941 (Employer’s Quarterly Federal Tax Form)


    +   - Filed Quarterly'
  - '[PAGE 49]


    +   - Any employer who withholds federal income tax or social security and Medicare
    taxes


    # Form 943 (Employer’s Annual Federal Tax Return for Agricultural Employees)


    +   - Filed annually if reporting agricultural wages


    # Form 944 (Employer’s Annual Federal Tax Return)


    +   - Only if you have received a written notice about the 944 programs


    # Form 945 (Annual Return of Withheld Federal Income Tax)


    +   - Only if you are filing to backup withholdings


    # Form 940 (Employer’s Annual Federal Unemployment (FUTA) Tax Return


    +   - Only if you pay FUTA tax

    With states, they will vary from state to state. Check with your local business
    administration for small businesses for more details with the state tax reporting.


    With all this talk about filing the taxes throughout the year, we should also
    mention the taxes when filing at the end of the year and what needs to get done
    at time. Every business who has employees will need to prepare W2’s. Because there
    is so much to cover for filing taxes and getting your business ready at the end
    of the year, I added a special bonus chapter at the end. This chapter will be
    dedicated to you and your bookkeeper to prepare your business ready for tax season.


    # Setting-Up Direct Deposit


    Setting up direct deposit can be easy with the right tools. Many software programs
    have the feature to set up direct deposit. The nice thing is when you run your
    payroll and have your bank account linked to the software, it will make it easier
    to get the payroll out each period.


    You will need to get some basic information from the employee. Most banks will
    give them a form with all that information on it. Here is the basics of what you
    need:


    +   - Bank’s Routing Number or ABA. It is a nine-digit number that is associated
    with the bank. Can be found on checks and the bank website.'
  - '[PAGE 50]


    +   * Checking / Savings Accounting Number

    * Bank name and Address


    There can be some cost to direct depositing the pay check. Some banks charge a
    transaction fee and per-check fee. Be prepared to handle this out of the business
    funds so that your employee gets what they earned.


    # ## Employee Benefits


    The benefits that you can offer your employees are what will entice them to stay
    with your business. There are some benefits that you are required to offer by
    law. However, there are many that are optional.


    # ## Required Benefits


    Let''s look at the benefits you will be required to have:


    +   * Social Security Taxes: All employers must pay the same rate of SS tax as
    the employees.

    * Workers’ Compensation: These are required through a commercial carrier, self-insured
    basis, or the State Workers’ Compensation Program.

    * Disability Insurance: Disability pay is required in some states but not all.
    Check with your state if it is required.

    * Leave benefits: Most leave options are optional. However, consult the Family
    and Medical Leave Act (FMLA) for those leave options that are required.

    * Unemployment Insurance: This varies from state to state. You may need to register
    with your state workforce agency.


    # ## Optional Benefits


    There are many optional benefits that you may want to consider. A big one is a
    retirement plan. Even though medical insurance is not required, you can offer
    different types of medical plans. This will allow your employee to get better
    coverage based on their needs.


    # ## Incentive Programs


    Offering incentive programs is another great way to reward your employees. Be
    creative and come up with some ways that would benefit your employees. Some ideas
    would be wellness programs, memberships, bonuses, discounts, etc.'
