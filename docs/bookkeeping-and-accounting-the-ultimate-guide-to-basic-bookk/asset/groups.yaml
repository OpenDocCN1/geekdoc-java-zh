    运营利润；在扣除运营支出后，剩余的就是运营利润。运营利润是衡量Martin公司执行其主要目标（制造和销售产品）有效性的第一个指标。运营利润等于毛利减去运营支出。


    其他收入和支出；但Martin公司还必须考虑其他成本，例如购买设备和材料所需的贷款利息。他们可能还有来自投资、租赁物业收入和特权费等其他偶然收入。这些都包含在损益表中，但不属于制造和销售产品的主要业务。


    税前利润；当所有这些都包含在内时，我们看到了税前利润或PBT。该利润必须减去销售和其他收入所缴纳的税款，我们最终才能看到Martin公司主要业务产生的利润。这就是经理们所说的“底线（Bottom
    Line）”。


    经理和主管非常关注损益表与预算的比较情况，以及它随时间变化的情况。我们今年的利润是否比去年同期以及之前的几年更多？利润的持续增长使得Martin公司能够维持经营、生产产品、服务客户并雇用人员。这对于扩大业务、增加更多产品以及投资客户所需的先进技术也至关重要。


    ## 第4章 - 资产负债表


    资产负债表的简要描述是，它说明了“我们拥有什么以及我们欠债什么”。将资产负债表想象成业务在某一时间点的照片。就像损益表是对随时间进展的记录一样，资产负债表为我们提供了公司在某些要求的日期（例如，这里所示Martin公司的年底或年中）的状况。资产负债表也可以称为状况表。


