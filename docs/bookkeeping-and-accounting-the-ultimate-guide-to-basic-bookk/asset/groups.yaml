    ### Owner’s Equity:\n- Joe Stern, capital: 300\n\nNow that we have an idea about\
    \ the chart of accounts I want to look at the transactions that will be recorded\
    \ for your company. Every transaction is recorded in a journal. This is the book\
    \ of the original transactions. These transactions will either increase or decrease\
    \ your company’s accounts. These entries consist of the date of the transaction,\
    \ the names of each account that is affected, reference number, and the amount\
    \ of each transaction. All this information will be coming from the various source\
    \ documents. For example, invoices will be considered a source document.\n\nFrom\
    \ the journal we will record each of these transactions into the general ledger.\
    \ The general ledger is a summary of the balances of all accounts used by your\
    \ company. It will have a separate journal for each account in the chart of accounts.\
    \ This will have the name of the individual account and the account number at\
    \ the top of the journal. The account number will be the reference number in the\
    \ journal. Then the journal for the general ledger will consist of the date, description,\
    \ and amounts. Then we transfer the amounts over the general ledger; we call it\
    \ posting. You would not record the reference number on the main journal until\
    \ you post it to the general ledger. This helps keep track of the accounts that\
    \ you have already posted and you are better organized as where it was posted.\n\
    \nA good way to look at it is when you balance your bank account or your checkbook.\
    \ The ledger that you record your transactions on will be a journal. When you\
    \ compare it to your statements you will check that it is posted correctly. Also,\
    \ this will have two columns for your amounts. It will either be debit and credit\
    \ or deposit and withdrawal. This is a form of the double-entry accounting for\
    \ recording journal entries.\n\n## Debits and Credits\n\nWith double-entry accounting,\
    \ every transaction made will have at least two entries: a debit and a credit.\
    \ Most of us think that a debit decreases our account and a credit increases our\
    \ account. When recording the entries in your journal for your bank account this\
    \ is true. Mainly because you are only working with cash in and out of your account.\
    \ In accounting the debit means left and credit means right. This is because depending\
    \ on what is being recorded a debit could either increase or decrease the account.\
    \ The same for credits. The following will show if debits and credits will increase\
    \ or decrease the accounts.\n\n| ACCOUNT | DEBIT (Left side) | CREDIT (Right Side)\
    \ |\n|---||||\n| Assets | Increase | Decrease |\n| Liabilities | Decrease | Increase\
    \ |\n| Owner's Equity | Decrease | Increase |\n| Revenue | Decrease | Increase\
    \ |\n| Expenses | Increase | Decrease |\n\nThere are several steps that need to\
    \ be taken when entering debits and credits into the journal. These steps will\
    \ make up a journal entry and will be repeated for each entry made.\n\n1. We need\
    \ to figure out which accounts will be affected by the transaction.\n2. Once the\
    \ affected accounts are decided, then you need to find out whether this account\
    \ will increase or decrease the account.\n3. Every time you make a transaction\
    \ both the debits and credits will be equal. Sometimes you will have multiple\
    \ transactions as the credit or debit depending on what accounts need to be affected.\n\
    4. Always list the account that will be debited first and will be on the left\
    \ side. Then you will indent the credits so that they will show on the right side.\n\
    5. Ensure that the debits and credits are recorded on the correct side and that\
    \ they equal.\n\n## T Accounts\n\nTo simplify lets's look at them as T accounts.\
    \ Each account type will have either a debit normal balance or a credit normal\
    \ balance. The following information will help you in knowing which account has\
    \ a debit or a credit normal balance.\n\n- ASSETS—Debit Normal Balance\n- LIABILITIES—Credit\
    \ Normal Balance\n- OWNER’S CAPITAL—Credit Normal Balance\n- OWNER’S DRAWING—Debit\
    \ Normal Balance\n- REVENUE—Credit Normal Balance\n- EXPENSES—Debit Normal Balance\n\
    \nThese are considered the five major accounts—assets, liabilities, owner’s equity,\
    \ revenues, and expenses.\n\n| Assets | Liabilities | Owner's Capital |\n| ---\
    \ | --- | --- |\n| Debit | Credit | Debit | Credit | Debit | Credit |\n| Increase\
    \ | Decrease | Decrease | Increase | Increase | Increase |\n| NormalBal | | NormalBal\
    \ | | NormalBal |\n| Owner's drawing | Revenue | Expenses |\n| Debit | Credit\
    \ | Debit | Credit | Debit | Credit |\n| Increase | Decrease | Decrease | Increase\
    \ | Increase | Increase |\n| NormalBal | | NormalBal | | NormalBal |\n\nT accounts\
    \ are only a part of the journaling process. It makes it easy to put in perspective\
    \ if each account is to be debited or credited based on if it is to be increased\
    \ or decreased.\n\nKeep in mind as you begin working with the closing entries\
    \ and the reports, it is important to know which accounts are affected, whether\
    \ you will increase or decrease the account, whether it will be a debit or a credit\
    \ that will increase that account, and whether the account will have a debit normal\
    \ balance or a credit normal balance.\n\nThis information will help you as you\
    \ start...\n\n## Chapter 5 – Financial Statements\n\n## Trial Balance\n\nOnce\
    \ you have posted all transactions you can prepare the trial balance. The trial\
    \ balance is a document that lists your assets, liabilities, owner’s equity, revenue,\
    \ and expenses. It also allows us to verify that all debits and credits equal.\
    \ This can be prepared at any given time. However, most of the time it is at the\
    \ end of month, quarter, or year.\n\n## Income Statement\n\nThe first document\
    \ is the income statement. This statement will show a company’s net for a specific\
    \ period. The heading of the income statement will always list the company’s name,\
