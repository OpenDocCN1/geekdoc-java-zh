    | ACCOUNT TITLE | Trial Balance | Adjustments | Income Statement | Balance Sheet
    |

    | --- | --- | --- | --- | --- |

    | | Debit | Credit | Debit | Credit | Debit | Credit | Debit | Credit |


    The worksheet is only a tool to help simplify the closing statements. I would
    suggest that you take the time to create your own worksheet. This would save much
    time when it comes to close the book at the end of the cycle.


    As you can see from the example worksheet, once you have all your totals transferred
    over to the worksheet it will allow you to easily find the information you are
    looking for.


    If you are doing the books manually instead of using software such as QuickBooks,
    I would suggest creating a spreadsheet in Excel that will have your journal, ledgers,
    and worksheet in one file to automatically calculate the totals. This way you
    would have done it for you as go.


    # Closing Entries


    Finally, the last step of the accounting cycle is the closing entries. These are
    journal entries made to transfer a balance in revenue or expenses to the income
    summary on the income statement and the dividends account on the retained earnings
    statement. This is necessary to get ready for the new accounting cycle.


    First, we need to create a temporary account called income summary. This is important
    as many of the closing entries affect this account in order to zero out accounts.


    The accounts that are closed at the end of the cycle are temporary accounts. Examples
    of these accounts are revenue, expenses, and dividends. These temporary accounts
    will never appear on the balance sheet. This is because the balance sheet only
    contains assets, liabilities, and owner’s equity.'
- md: '

    Most temporary accounts will be found on the income statement, except for dividends,
    they will appear on the statement of retained earnings.


    You will also have permanent accounts such as assets, liabilities, and owner’s
    equity. This will not be closed out at the end of the account cycle.


    ## Types of Closing Entries


    In order to prepare the books for the next cycle there are accounts that need
    to be closed out. You must make these closing entries in the general ledger. They
    are:


    - 1. Income summary—this is a temporary account that is created when you make
    the closing entries. All revenue and expense account balances will be transferred
    here. Once this will close accounts and give them a zero balance. Once all entries
    are transferred to this account, the totals of the income summary will equal the
    company’s net income or loss for the year. Then the income statement will be closed
    out and transferred to the retained earnings statement.


    - 2. Revenues—has a credit normal balance. Therefore, to close it you need to
    debit revenue. Then it will be credited to the income statement.


    - 3. Expenses—has a debit normal balance. Therefore to close it out you must credit
    the expense accounts. This will zero out expenses and you need to debit the income
    summary.


    - 4. Dividends—these are the cash withdrawals that are given to shareholders for
    personal use. Keep in mind this account has a debit normal account. So we need
    to credit dividends so that it would have a zero balance. From there we will debit
    retained earnings. This is the only one that is not debited to the income summary
    and will go straight to the retained earnings.


    Once the closing entries have been made and you have the income summary totals
    you can calculate the net income or net loss on the income summary. You can then
    close the income summary to the retained earnings.


    Once the books are closed then all the temporary accounts will have a zero balance
    and will be ready for the next accounting cycle. All the permanent accounts will
    carry over to the next accounting cycle.


    ## Chapter 8 – Special Journals


    Now that we have introduced you to the journals let’s take a closer look at some
    of the special journals that you may come across.


    Many times, a company will have repetitive transactions. For an example, your
    company may have a depreciation expense that must be applied every month. These
    companies may use a special journal for those transactions. Most of the time these
    special transactions are within the bigger companies that have many repetitive
    transactions.


    These journals are separate from the regular general journal. Mainly because it
    has transactions that are similar and occur often. For example, these journals
    may include sales journal, purchase journal, cash receipts journal, and cash disbursements
    journal. This is to name a few.


    Like the general journal, these special journals need to be posted to the ledgers.
    However, there are also subsidiary ledgers that they need to be posted as well.
    These subsidiary ledgers have a control account in the general ledger that has
    a summary of the subsidiary ledger accounts which are more detailed. Subsidiary
    ledger accounts are where you will find a bulk of the company’s detailed data.


    Now you are probably asking yourself, “Wouldn’t posting debits and credits to
    two different ledgers put the books off and not allow them to balance?” Actually,
    the general ledger is the main ledger that is used for all the books. The subsidiary
    ledger accounts are not part of the general ledger. They are used to give more
    details about the accounts to support the numbers that are in the control account.


    When you really think about it there are several good reasons for using a subsidiary
    ledger.


    - They provide up-to-date information on specific account balances that is very
    detailed.

    - They may also make it less likely to have errors by moving large amounts of
    numbers from the general ledger.

    - When there are errors they may make it easier to find specific information,
    such as finding errors or tracking credit with customer and supplier accounts.

    - They also make it possible to divide up the posting into more than one job.
    For example, you could have one employee post to the general ledger and another
    employee post to the subsidiary ledger. This will allow you to go through the
    books and if the postings match. If they do not match it will give you an idea
    to look for the errors.


    Some of the common types of subsidiary ledgers:


    - Accounts Receivable Subsidiary Ledger

    - Accounts Payable Subsidiary Ledger

    - Some Fixed Assets Ledger

    - Property, Plant, and Equipment (PPE)


    Keep in mind that these subsidiary ledger accounts are based on the needs of the
    company. Let''s take a look at some of these accounts.


    ## Accounts Receivable


    Anytime a customer buys a product and it is on credit you will record that transaction
    in accounts receivable. This is because there is no exchange of cash. This transaction
    will increase both revenue and assets. Since there is no exchange of cash at this
    time the cash account does not increase. Instead the accounts receivable is what
    increases. For example, your company delivered $400 of merchandise to a vendor
    and that did not pay cash. Instead, the $400 was put on account as of December
    2, 2015. To record this transaction, you would debit accounts receivable $400
    to it being bought on account. Even though it was bought on account it would still
    be considered as revenue. Therefore, you would credit the revenue account for
    $400. The transaction would look like this:


    | Date | Account | Debit | Credit |

    |---|---|---|---|

    | December 2 | Accounts receivable | $400 | |

    | | Revenue | | $400 |


    Now let''s suppose the vendor pays the bill on account for $400 on January 3,
    2016. You would then record that transaction on January 3 as a debit for


    | Date | Account | Debit | Credit |

    |---|---|---|---|

    | January 3 | Cash | $400 | |

    | | Accounts receivable | | $400 |


    So what would it look like if we not pay on account? Here you use cash instead
    of revenue. For example, on December 2, 2015:


    | Date | Account | Debit | Credit |

    |---|---|---|---|

    | Beginning balance | | $0 |

    | December 2 | Supplies | $400 | |

    | | Accounts payable | | $400 |

    | Ending balance | | $0 |


    ## Accounts Payable


    Your company does not always give credit to its customers. Anytime your company
    receives goods or services on credit then it is posted to the accounts payable.
    For example, you needed supplies for your company and you purchased these on account.
    You would debit supplies for $400 as you purchased on account. You would credit
    accounts payable for $400. Your transaction would look like this:


    | Date | Account | Debit | Credit |

    |---|---|---|---|

    | December 2 | Supplies | $400 | |

    | | Accounts payable | | $400 |


    Now on January 3 you pay your account of $400 for your supplies. You will debit
    the accounts payable account for $400 as you are paying that amount off the credit
    that was issued. Since you are paying cash for that credit you will credit cash
    for $400. Your transaction would look like this:


    | Date | Account | Debit | Credit |

    |---|---|---|---|

    | January 3 | Accounts payable | $400 | |

    | | Cash | | $400 |


    ## Fixed Assets Ledger and the Property, Plant, and Equipment (PPE) Account


    Your company may maintain a subsidiary ledger that is called fixed assets. However,
    a controlled ledger of the fixed assets ledger is known as the property, plant,
    equipment, or PPE. Keep in mind that the accounts listed in the subsidiary account
    are dependent on the needs of your company. With this system all acquisitions
    of fixed asset debit will be listed under PPE.


    To give you an idea of what accounts go to each subsidiary the following reference
    will help:


    # Accounts Receivable $1,000


    - Al Forbush $300

    - Jane Doe $200

    - John Doe $500


    # Accounts Payable $1,000


    - Toys Unlimited, Inc. $400

    - Supplies Corp. $400

    - Outsmart Clothing $200


    # PPE: Property, Plant, and Equipment $8,000


    - Tables $2,000

    - Car $3,000

    - Computer $3,000

