    # Notes Receivable


    We just got through talking accounts receivable. So what is notes receivable?
    You would think they were the same. However, they are different. While accounts
    receivable is about a delay in payment, notes receivable is more like a loan.
    This is also known as an asset to the company. Normally with a notes receivable
    there will be interest that will be charged to the account over time as outlined
    in the terms of the promissory note or contract for the note.


    Notes receivable is one account that must comply with the GAAP standards in both
    the way it is recorded and the reports. When looking at the components that are
    involved you will look at the following:


    - Maturity date

    - Duration of note

    - Interest and interest rate

    - Maturity value


    These are the main components.


    # Methods for Uncollectible Accounts


    You will come across times when someone could not pay their bill or honor their
    contract that was signed. Now we need to attempt to collect it and if we cannot
    then we will need to use one of the methods for recording and handling that debt.


    Let''s first look at the direct write-off method. This is a system for dealing
    with the uncollectible accounts. With this method a company will remove the entire
    account from the books as soon as it is recognized as being uncollectible. However,
    many times a bill may be paid after it is considered uncollectible. When this
    happens, you would do a reversal entry. Basically, this is just that. You add
    the account back on the books and make the transaction of it being paid.


    There is also the allowance method. Much like the direct write-off method the
    allowance method is about recognizing the uncollectible account. However, with
    this method it is based on matching principle. When using the accrual accounting,
    all the expenses must be matched with the related revenue. This would be done
    within the same accounting period. Once these are matched then the estimated amount
    that is recorded and is expected to be written off for the bad debt would be considered
    the allowance for uncollectible accounts.


    We also have the percent of net credit sales method. This is also known as net
    sales method. For this method we need to consider how much net sales the company
    will not be collecting. For us to calculate this figure we need to look at prior
    years'' uncollectible debts. Ask yourself, how much has your company written off
    as a percentage of credit sales for those years? Once you have that answer then
    you will use that to get an estimate of the percentage of credit sales for the
    current year. Here is the formula for figuring out the answer to how much will
    be given in this method:


    - % of uncollectible debt * % total credit sales = ???


    There is also the percent of receivables method which uses percentages of the
    amounts in the accounts receivable ledger. These percentages give an estimate
    on how much money is owed to your company but will not be collectible.


    The aging of accounts receivable method is similar, although this method estimates
    the uncollectible accounts in more detail. The accounts would be grouped into
    categories based on how much time has passed since the date of the sale. Keep
    in mind the longer the account is outstanding, the more likely it will not be
    collected.


    There will be times a client will pay money towards an account that had been written
    off as bad credit. This would require two transactions.


    - 1. The reversal—it is that simple. We need to reverse the write-off. Easy way
    to remember this is that we need to put the account back on the books so that
    we can accept the payment.

    - 2. Cash transaction—we need to record the money coming in for this account.


    Let''s take a look at these two transactions. The first one is to reverse the
    write-off.


    | DATE | ACCOUNT | DEBIT | CREDIT |

    |---|---|---|--|

    | May 15 | Accounts receivable, Al''s Construction | $500 | |

    | Allowance for uncollectible accounts | Allowance for uncollectible accounts
    | | $500 |


    Now that we reversed the write-off and put the account back on the books we need
    to accept the payment from Al''s Construction.


    | DATE | ACCOUNT | DEBIT | CREDIT |

    |---|---|---|--|

    | May 15 | Cash | $500 | |

    | | Accounts receivable, Al''s Construction | | $500 |


    # Financial Statement Presentation


    So far, we have gone over a great deal of information in accounting. Even with
    bad credit it needs to be reported on the financial statements. When you look
    at the accounts receivable and bad debt you would only get a small part of the
    company''s financial condition. To really understand your financial conditions,
    you would need to look at all the financial statements.


    There are typically four financial statements that an accountant will prepare.
    They are:


    1. The income statement

    2. The statement of owner''s equity

    3. The balance sheet

    4. The statement of cash flows


    These statements will give a good understanding of how well the company is doing
    for a particular accounting period or a specific point in time such as the end
    of a given month.


    It is important that these financial statements are accurate. Investors rely on
    this information so that they can make good decisions about their investments.


    # Maturity Date


    The maturity date is when the note needs to be paid. The terms of the note can
    tell you when the maturity date will be in a few ways. Sometimes it will be listed
    as a specific date. It can also be listed as a specific month. Finally, it could
    also be listed as a number of days after the date note was signed.


    When you look at the number of days between the date note was signed and the maturity
    date it is known as the duration of the note. Another thing to look at is the
    interest that is incurred. This can be calculated based on the duration or number
    of days of the note and the interest. It is based on a daily rate. However, there
    are times you can base it on a monthly or yearly rate if it is outlined in the
    note.


    When a note is signed will outline the terms of the contract; that is, to include
    the interest rate. Just like any loan this is a fixed percentage of the amount
    that was borrowed.


    To find out what interest will be you can use this formula:


    - Interest = Principal * Rate * Time


    Let''s also look at each area so that you will know where to find the principal,
    rate, and time.


    - Principal—the amount of money borrowed. This is the original amount with no
    added interest or fees.

    - Rate—interest rate expressed as a decimal, found in the terms of the contract.

    - Time—the duration of the note divided by 360.


    For example, you have a note for 90 days. It was written for $3,000 with an 8%
    rate. The equation would look like this:


    - Interest = $3,000 * 0.08 * (90/360)

    - Interest = $3,000 * 0.08 * 0.25

    - Interest = $60 = $3,000 * 0.08 * 0.25


    Now that you know the interest you can find the maturity value. To do this simply
    add the worth of the note and the interest. So for this example the maturity value
    would be $3,060.


    # Interest Income


    Whenever a company issues a promissory note, whether it is to buyers for goods
    and services or you are dealing with investments in stocks and securities, you
    must account for the interest income. This will be earned on these assets.


    Anytime you earn interest on these notes or contracts then the interest income
    will increase. This interest must be reported as revenue on the income statement.


    Many companies are not lenders. However, they may need to borrow money for their
    company. This would be recorded as an interest expense as you would be paying
    interest on the notes that you have borrowed.


    When recording interest and keeping track of it you would need to make two transactions
    to record these. The first one will be a debit to cash and a credit to notes payable.


    | DATE | ACCOUNT | DEBIT | CREDIT |

    |---|---|---|--|

    | April 1 | Cash | $2,000 | |

    | | Notes payable | | $2,000 |


    The second transaction will be a debit to notes payable of the principal amount,
    a debit to interest expense to show that amount of interest, and a credit to the
    cash account that combines the two amounts.


    | DATE | ACCOUNT | DEBIT | CREDIT |

    |---|---|---|--|

    | May 31 | Notes payable | $2,000 | |

    | | Interest expense | $17 | |

    | | Cash | | $2,017 |


    No matter if you are tracking the interest or other payments, the accounts receivable
    will help a company track all the money coming into the company. This will give
    you a good idea as to where the company is heading.

