    # Chapter 1 – Generally Accepted Accounting Principles (GAAP)


    To really understand accounting, you need to understand the rules or regulations
    behind it. These are also known as the standards. Overall these standards are
    known as the Generally Accepted Accounting Principles or GAAP.


    The standards were established and developed by the Financial Accounting Foundation’s
    (FAF) standard-setting board. This board is divided into the Financial Accounting
    Standards Board (FASB) and the Governmental Accounting Standards Board (GASB).


    These standards regulate the language for financial reporting. In turn it communicates
    the financial conditions and operational results. This includes companies, both
    public and private, not-for-profit organizations, and state or local governments.


    Financial reporting mainly includes information on the following:


    +   * Financial position, which includes balance sheet and statement of net position

    * Results of operations, which includes statement of revenues, expenses, and changes
    in net position

    * Disclosures.


    GAAP is used for providing useful information for investors, lenders, or others
    who need to know this information about a company. It also establishes concepts,
    objectives, standards, and conventions which evolve over time to guide how the
    statements are prepared and presented.


    The principles of the GAAP include:


    +   * Recognition—this includes items that should be recognized in a financial
    statement, such as assets, liabilities, revenues, and expenses.

    * Measurement—this is the elements of the amounts that are included in the financial
    statements.

    * Presentation—on the financial statements it includes the line items, subtotals,
    and totals. This is how information will be displayed.'
  - '[PAGE 141]


    +   - Disclosure—this explains and supplements the amounts on the statements.
    It also shows specific information based on what is most important to the user.


    # Financial Accounting Foundation (FAF)


    The FAF is the independent, private-sector, not-for-profit organization based
    in Norwalk, Connecticut. They are responsible for the oversight, administration,
    financing, and appointment of the Financial Accounting Standards Board and the
    Governmental Accounting Standards Board.


    +   - Financial Accounting Standards Board (FASB)—they establish financial reporting
    and accounting standards for companies, both private and public. This also applies
    to not-for-profit organizations.


    +   - Governmental Accounting Standards Board (GASB)—they do the same as the FASB
    only on a government level with the U.S., state, and local governments.


    The GAAP has always been a high-quality organization of financial reporting. That
    way investors, lenders, capital providers, and others who need access to this
    information can get it. The FASB and GASB are responsible for the GAAP to continue
    to have those high standards.


    There are many organizations that rely on this information. Today even you, as
    a taxpayer, are following these standards. Others who are following the standards
    set by the GAAP are holders of municipal bonds, members of citizen groups, legislators,
    and oversight bodies. Everyone needs to look into the financial information to
    make good investments.


    The missions of these organizations are accomplished through a pretty comprehensive
    and independent process. This process encourages board participation. It also
    allows to objectively consider all the stakeholder views and will be subject to
    oversight by the FAF''s Board of Trustees.


    The FASB and GASB use the following steps for due process:


    +   - Identify Topic—the board identifies a financial reporting issue that needs
    to be addressed. This is based on recommendations from stakeholders, staff research,
    board members’ concerns, or other means.


    +   - Conduct Pre-agenda Research—research is conducted on those issues that need
    to be presented.'
  - '[PAGE 142]


    +   3. Make Agenda Decision—board adds projects or concerns to be discussed at
    public meeting.


    +   4. Deliberate at Public Meeting—Public meeting is held to discuss the issues
    and concerns.


    +   5. Issue Document for Public Comment—the Board drafts a proposal and makes
    it public for comments on the proposal.


    +   6. Host Public Hearing or Round Tables (Major Projects)—on major issues a
    public hearing may be called to give stakeholders a chance to comment on the issues.


    +   7. Re-deliberate Based on Comments and Research—another meeting is held to
    review the comments given by the public and stakeholders.


    +   8. Issue Final Standard—the Board issues the final paperwork with the new
    standards.


    +   9. Education—the Board ensures that everyone is educated on the new standards.


    +   10. Implementation—the new standards are now implemented.


    If the standards are significant and have been in place for two or three years
    by GASB standards it could be selected by the FAF''s Post-Implementation Review
    team. This team will evaluate it for its effectiveness.


    # What are the Qualities of the GAAP?


    All businesses, regardless if you are a company, not-for-profit, or government,
    use standards in accounting to provide information used on financial statements.
    The information they need to provide is financing, lending or donating money,
    or determining how public officials are spending our tax money.


    When a company uses financial statements that follow GAAP standards then investors
    and others trust that company.


    The efficient, robust capital market is like one big circle.


    High Quality Standards > Better Information > Greater Transparency > Better Financing
    Decisions > Increased Investor Confidence > High Quality Standards ...'
