    # Chapter 9 – Taxes for Small Businesses


    A huge part of bookkeeping is preparing the books for tax season. That is why,
    as a bonus, I am adding this chapter about taxes for small businesses.


    If you are just starting, you may feel overwhelmed at tax time. You should not
    need to feel this way. As long as you keep your records up-to-date, it should
    be a breeze when it comes time for taxes.


    I want to share this checklist with you. This is a list of items that you will
    need when it is time to file your taxes for the business.


    # Income


    +   * Gross receipts from sales or services

    * Sales records (for accrual based taxpayers)

    * Returns and Allowances

    * Business checking/savings account interest (1099-INT or statement)

    * Other Income


    # Cost of Goods Sold (if applicable)


    +   - Inventory

    - Beginning inventory total dollar amount

    - Inventory purchases

    - Ending inventory total dollar amount

    - Items removed for personal purposes

    - Materials & Supplies


    # Expenses


    +   - Advertising

    - Phones (landlines, fax or cell phones related to business)

    - Computer & internet expenses

    - Transportation and travel expenses


    +   * Local transportation

    - Business trip (mileage) log'
