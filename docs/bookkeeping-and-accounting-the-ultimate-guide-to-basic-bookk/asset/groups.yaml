  mdcn: "\n因为土地不会贬旧。折旧适用于那些只有特定年限并最终需要更换的资产。因此，我们需要确定它们随着时间的推移会折旧多少。\n\n折旧是将长期资产的成本分配到该资产产生收入的期间的费用账户中。所以，当你考虑这个问题时，折旧基本上是将一个会计期间的收入与产生该收入时所消耗的或或服务的成本进行抵消。\n\
    \n折旧费用并不是为了减少价值。相反，它是对某段时间内的成本进行分配的结果。一旦你开始使用需要折旧的资产，这通常会按季度或每年进行一次。当公司或企业处置该资产或确定其寿命结束时，折旧就会停止。\n\
    \n记录折旧的方法有多种。通用用会计原则（GAAP）规则仅要求所使用的方法在资产的整个寿命范围内是合理且系统的。让我们来看一些计算和记录折旧的方法。\n\n\
    ### 直线法——这是财务报告中最常用的方法。它比任何其他方法都能更程度地使净利润最大化。它也是最容易理解和遵循计算规则的方法。该方法为资产的寿命期间每个期间分配相等金额的费用。在理解计算方法之前，我们首先需要找到什么是残值。当一个企业使用资产的寿命并准备出售它时，你需要问自己预计能从出售资产中赚取多少钱。因此，让我们来看直线法的公式：\n\
    \n- 折旧额 = (成本 – 残值) / 寿命\n\n为了更好地解释这一点，让我们来看公式的每个方面。首先，你获取资产的成本并减去残值。成本将是你购买资产时的原始成本。然后，你将这个总和除以寿命。寿命是企业认为该资产有用的年数。这得出了折旧成本。\n\
    \n例如，你的业务拥有一台流射机。预计寿命为五年。你最初以 $20,000 的价格购买了它，预计残值为 $5,000。让我们将其放入公式：$20,000 -\
    \ $5,000 = $15,000；$15,000 / 5 = $3,000。因此，折旧将为 $3,000。很多时候，你可以将寿命看作一个百分比。速率为1。因此，流射机的寿命将是\
    \ 1/5 或 20%。\n\n通过折旧表我们可以看到账面价值。了解资产的账面价值是非常重要的。要找到这一点，你将原始资产成本减去累计折旧。\n\n- 账面价值\
    \ = 成本 – 累计折旧\n\n市场价值和账面价值是不一样的。账面价值代表根据企业账目的资产价值。账面价值每年必须更新。这是因为累计折旧每年都会变化，公司或企业需要知道寿命何时结束。然而，账面价值永远不应低于资产的残值。记住，当折旧完成后，你看到的残值和账面价值将相等的。\n\
    \n### 余额减少法——通过这种方法，每年使用期间分配的折旧额是不同的。假设你认为资产在寿命早期更有生产力并产生更多收入。这种方法是一种加速方法。你发现在资产寿命早期分配的折旧费用将比后期年份多。对于余额减少法，我们可以使用以下公式计算折旧费用：\n\
    \n- 折旧费用 = 速率 * 当前账面价值\n\n由于账面价值在每个期间都在减少，折旧费用也随之减少。这就是为什么它被称为余额减少法。在所有方法中，你都需要记住，账面价值永远不会低于残值，并在寿命结束时相等。\n\
    \n### 年数数字和法 (SYD)——是另一种加速方法。通过这种方法，折旧金额根据年数总和分配给每一年。\n\n### 生产量法——与其他方法不同。它是基于资产产量的测量，而不是寿命。通过这种方法，允许在资产使用得更频繁时产生更多折旧。该方法用于机械设备等资产。计算这种方法，你将使用与直线法类似的以下公式：\n\
