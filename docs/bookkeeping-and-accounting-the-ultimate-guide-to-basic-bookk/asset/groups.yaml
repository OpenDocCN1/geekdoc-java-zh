    I know this is a long list. It will ensure you and your bookkeeper are prepared.
    If you take the time each month to keep these documents organized and safe, when
    it comes time for taxes you will not need to look through everything to find what
    you need.


    I encourage you to keep your business organized and in good shape. Make sure you
    keep your personal finances separate from your business finances. This includes
    separate bank accounts.


    Before it is time to prepare for tax time, you should review the accounts receivable
    and inventory balances. This should be done at least quarterly. However, you should
    do it every time before closing the books and preparing them for the next fiscal
    year. Also make sure you review all equipment purchases for the year.


    Many times there are added or potential tax credits you may be eligible for. Here
    is a list of just few, but you would want to check and see what credits you could
    get each year as they could change.


    +   - Research and Development Credit

    - Energy Tax Credit

    - Disabled Access Credit

    - Work Opportunity Tax Credit

    - Healthcare Tax Credit


    Of course, as you close the books you will make your adjusting entries and prepare
    your business for the upcoming year.


    For more information on filing taxes for your small business you can check out
    the IRS website at: https://www.irs.gov/businesses/small-businesses-self-employed


    # Other Tax Deductions


    As you may or not know, when it comes to tax deductions for running your small
    business there are so many to think about. I compiled a list of some other types
    of deductions for you to consider.


    +   - Employees’ Pay – This can be deducted as long as the pay is in the form
    of cash, property, or services.'
  - '[PAGE 75]


    +   - Inventory (cost of Goods Sold) – If your business manufacture products or
    purchases products for resale you can deduct the cost of goods sold.


    +   - Employee Benefits – Such benefits like healthcare, adoption assistance,
    education assistance, and life insurance can be deducted.


    +   - Home Office – Make sure you have a dedicated room for your home office.
    You will need to calculate the square footage so that you can apply a percentage
    of your rent, mortgage, insurance, utilities, housekeeping, etc. That percentage
    can be deducted if you work out of your home.


    +   - Auto Maintenance and Mileage – There are two ways to calculate this rate.
    You can use the standard mileage rate or the actual expenses paid. Be sure to
    use whichever gives you the greatest deduction.


    +   - Advertising and Marketing – You can deduct the cost for marketing and advertising
    your business. This includes promotion costs for good publicity.


    +   - Office Supplies – This can be anything you use for your office. Make sure
    you keep your receipt of all items. These are small-day items.


    +   - Education – This includes educating people about your business through seminars
    and trade shows. Also, if you have magazines, books, CD’s and DVD’s that relate
    to your business, they are 100% deductible.


    +   - Professional Fees – This includes accountant, lawyer and consulting fees.
    They are 100% deductible.


    +   - Travel Expenses – When the travel is business related it is mostly all 100%
    deductible. This includes airfare, hotels, and other road expenses. However, eating
    out can be deducted but only at 50%.


    +   - Entertainment – This one can be tricky. If you are just going out with co-workers
    it is not deductible. However, if you bring a client or prospective client you
    can deduct 50%. Same goes if you take them out for drinks as long as it is in
    a business setting or business meeting.


    +   - Furniture – This is supposed to have a long lifespan. Therefore, you can
    either deduct the full cost of the furniture at one time or you'
  - '[PAGE 76]


    can deduct the depreciation over several years.


    +   - Office Equipment – This will be those big items such as a fax machine, copier,
    or computer. They are also 100% deductible and can be deducted the same way as
    the furniture.


    +   - Employee or Client Gifts – It is always nice to reward your employees or
    clients with a gift. These are 100% deductible up to $25 per year for each person.


    +   - Startup Expenses (Capital Expenses) – You can deduct up to $5,000. This
    includes research costs that you incurred for creating your business.


    +   - Taxes – That’s right. Taxes that incurred through running your business
    can be deductible.


    +   - Insurance Premiums – The credit, liability, malpractice, and workers’ compensation
    premiums all be deducted.


    +   - Interest – The interest that you incur from mortgage, finance charges such
    as credit cards, payment plans, and interest on loans are 100% deductible.


    +   - Software – This includes boxed, downloadable, and subscriptions. They are
    all deductible.


    +   - Charitable Contributions – If the contribution is more than $250 you will
    need a letter from the organization verifying the contribution. If the donation
    is not money, you can visit the IRS website and look up Publication 561 – Determining
    the Value of Donated Property.


    +   - Rent – If you rent and the property is used for your business can deduct
    the rent. However, if you receive any of that rent as equity you are not able
    to deduct it.


    +   - Freelancers – When you hire an independent contractor you can deduct their
    pay as a business expense.


    +   - Repairs and Maintenance – When you run a business there will always some
    repairs and maintenance that needs to be done for your business to still run smoothly.
    These are deductible.


    +   - Licenses – License fees and regulatory fees are deductible.'
