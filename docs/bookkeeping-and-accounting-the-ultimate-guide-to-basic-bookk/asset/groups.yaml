    ## Chapter 10 – Liabilities and Payroll


    All companies will have some sort of liability and most will have employees and
    need to figure in the payroll for their staff. The current liabilities are separated
    into two categories or sections: known liabilities and estimated liabilities.


    ## Known Liabilities


    Any time a company has obligations that carry a set value you have a known liability.
    The known liabilities may fall into other categories such as:


    - Accounts payable

    - Sales tax payable

    - Unearned revenue

    - Short-term notes payable

    - Payroll liabilities

    - Accrued liabilities


    If you remember, any goods or services purchased on credit are considered accounts
    payable. However, when you make a sale it may incur yet another type of known
    liability. This would be sales tax payable. This account will be used for tracking
    and recording sales tax that needs to be paid to the state and local governments.


    Also remember when a company receives money in advance it would be considered
    as unearned revenue. These unearned incomes can be considered as a known liability.


    Another form of known liability is a short-term note payable. This is a debt that
    will be paid on a promissory note within one year.


    An important known liability for a business is the payroll liability. The best
    way to think about these liabilities is the amount paid to employees and is a
    set amount paid on a predetermined date. This type of liability has three categories.


    - Employee compensation

    - Payroll withholdings

    - Payroll taxes


    For this we can look at your regular paycheck. You perform 40 hours a week for
    two weeks at $9 per hour. This earns you $720. This would be considered your employee
    compensation. From that $750 there are withholdings that are deducted to fulfill
    tax requirements. These payroll withholdings are social security, Medicare, and
    federal and state income taxes. However, social security and Medicare supports
    benefits such as retirees, disabled individuals, and other types of medical programs.
    Instead of employees needing to pay their federal and state taxes directly to
    the government, your business is required to deduct this and report it for the
    employee. The last one is the payroll taxes. There are the withholdings from the
    employees that need to be paid to the government. For an idea of how this is paid
    the example:


    | DATE | ACCOUNT | DEBIT | CREDIT |

    |---||---|---|

    | July 31 | Salary wage expense | $1,330 | |

    | | Social security tax payable | | $200 | |

    | | Medicare tax payable | | $30 | |

    | | Federal income tax payable | | $1,100 |


    There are times when an employee may request to have additional withholdings deducted
    from their wages. The most common are:


    - Insurance premium payments

    - Pension or retirement plan


    These are known liabilities because they are set amounts of payment established
    in advance.


    ## Estimated Liabilities


    Obligations with a set value are known as liabilities. So what are estimated liabilities?
    So far we have talked lot about accounts that hold a set value. Many companies
    also have obligations that are not a set amount. These amounts will be determined
    at a future date. Therefore, we need to estimate what the value will be. Some
    of the accounts that will be listed as estimated liabilities are:


    - Employee benefits

    - Income taxes

    - Warranties

    - Lawsuits


    ## Employee Benefits


    Things like vacation pay and bonuses will be considered as employee benefits.
    These types of benefits are considered as estimated liabilities because they are
    promised to be paid at a later date.


    Let''s take for instance vacation pay. For each hour or day an employee works
    they earn vacation time that they can take at a later time. When the employee
    takes the time off then the business considers this as a liability. Vacation time
    is only an estimated liability because of that time earned, the employer does
    not know how much time the employee will take off. For this time of entry you
    would debit vacation expense and credit the wages payable to accommodate the vacation
    time that was taken.


    | DATE | ACCOUNT | DEBIT | CREDIT |

    |---||---|---|

    | June 30 | Vacation pay expense | $125 | |

    | | Wages payable | | $125 |


    Many times, bonuses may be offered for performance or other types of tasks. These
    bonuses can also be considered a liability and are only estimated as the employer
    does not know how much of a bonus will be earned by the employee. Bonuses are
    handled in a similar manner to that of vacation pay. You would debit bonus expense
    and credit wages payable.


    | DATE | ACCOUNT | DEBIT | CREDIT |

    |---||---|---|

    | December 31 | Bonus expense | $5,000 | |

    | | Wages payable | | $5,000 |


    ## Contingent Liabilities


    When I first looked at contingent liabilities my first thought was, what is that?
    Then as I did some research I realized that anytime a business faces the threat
    of a potential liability that may or may not occur in the future, it would be
    considered a contingent liability. These are only accrued when they are likely
    to occur. Many of these types of liabilities that are not accrued must be disclosed
    in notes to the financial statements. A good example of this type of liability
    is a product warranty.


    Take Al''s Ladders, Inc., for example. They had a gross sales in the month of
    June. The business estimated that 5% of its sales, or $2,500, would be allocated
