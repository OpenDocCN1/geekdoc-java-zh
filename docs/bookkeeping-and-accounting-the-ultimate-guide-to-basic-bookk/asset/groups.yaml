  mdcn: "\n- 流动资产——包括现金及现金等物、应收账款和库存。\n- 固定资产——包括物业、土地、建筑物和机械。\n- 其他资产——包括上述两类未涵盖的所有内容。\n\
    \n2. 负债\n\n3. 权益\n\n## 短期投资\n\n主要类型中的第二是短期投资。顾其名，它是短期的，这意味着它们在12个月内到期，而现金等物在90天内到期。\n\
    \n为了确保资产报告准确，需要所有有效且必要的披露。对于在一年或一个报告期内发生的任何资产转移，需要在财务报表注释中进行披露。如果某项负债不再记账，或者添加了新资产，则需要在资产负债表注释中进行分类和报告。\n\
    \n这些短期投资是企业意图变现的产品。当你考虑短期时，它总是小于一年。大多数情况下，这些投资的风险较低。因此，回报也较低。\n\n短期投资的两种主要类型是债务证券和股权证券。\n\
    \n债务证券也称为债务工具或固定收益证券。它是组织债务中可以被买卖的一部分。尽管如此，当投资者购买债务证券时，他们实际上是在购买企业债务的一部分。这些证券具有明确定义的条款。这些条款通常在合同中规定，以便投资者能够充分理解。\n\
    \n另一种证券是股权证券。它们代表了公司的所有权。这些投资者对公司的命运也有发言权。同时，他们也会受到公司可能产生的任何收益或亏损的影响。这些它的另一个名称是公司股票。\n\
    \n然而，公司并非唯一可以发行股票的企业。非公司实体（如个体户或合伙企业）不出售股票；但可以向员工发行股票，赋予他们部分所有权。\n\n假设你是一个投资者，想知道你在公司的持股比例是多少。\n\
    \n- 所有权比例 = 股数 / 发行股总数\n\n发行股是公司售出的股份总数。\n\n##get应收账款\n\n应应收账款与产品销售和提供的服务直接相关。想一下，当商品通过赊账出售时，某些客户会比其他人更早付款，而有些可能永远不会付款。\n\
    \n真正的问题是，你可以持有多少应收账款？如果持有太多或不够会发生什么？\n\n让我们看看如果应收账款太少，投资者会怎么想。他们可能认为你的信用延伸过于严格，限制了潜在销售额。这也可以说明，可能政策倾向于过快地注销坏账，而你本可以有机会收回它。\n\
    \n尽管如此，请记住持有过多的应收账款可能会产生不同的问题。持有过多可能会增加企业风险并降低公司的流动性。它可能向投资者表明，公司将难以支付未付费用。这也会给那些信誉并不良好的客户带来风险，他们可能会发生账款违约。\n\
    \n正如我们之前讨论的，提供信用的企业可能会面临无法收回账户的问题。在处理这些账户时，你可以提供折扣以便他们结清账户。\n\n## 长期资产\n\n除了流动资产外，还有一些长期资产。这些资产通常是你持有时间超过一年的资产。它们也代表了企业的未来增长。\n\
    \n这些长期资产可能包括但不限于：\n\n- 土地\n- 车辆\n- 计算机\n- 机械\n- 设备\n- 证券\n  - 股票\n  - 债券\n\n企业利用这些长期资产来产生收入。资产的寿命越长越好。它将降低成本并使企业产生更多收入。这也会让企业更有价值。作为回报，它会推高股价。然而，你需要小心。拥有过多的长期资产是可能的。如果你拥有太多，公司或企业可能没有足够的资金，可能难以应对费用和负债。然而，从另一方面来看，持有过少的长期资产也会损害公司。这可能会在变化面前变得脆弱，并难以对抗竞争对手。\n\
    \n## 固定资产\n\n固定资产的主要目的是创造收入。这类资产不是为了出售。尽管固定资产无法变成现金，但它们确实增强了你公司的价值。\n\n根据通用会计准（GAAP），固定资产必须以成本价值而非市场价值记录在资产负债表中。这被视为历史成本假设。有几个原因导致它们被视为历史成本假设：\n\
    \n- 1. 成本在审计中易于验证。这是通过检查收据实现的。而市场价值具有高度主观性。\n- 2. 当公司开始运营时，假设他们不会卖掉资产并关闭。只要业务打算继续经营，固定资产的市场价值就是无关的。这是因为资产的功能是产生收入而不是出售。\n\
    - 3. 根据 GAAP，要求公司在收益赚取或费用发生的财务期间内确认这些收入和费用。\n- 4. 资产的初始成本在购买时已记录在资产负债表中。因此，折旧金额必须在该资产使用的寿命期内列为支出。\n\
    \n土地是最常见且昂贵的固定资产之一。它包括地面上的一切（例如草、围栏和树木）、地上（例如空气、空间）以及地下（如矿产）。它应该拥有最长的寿命甚至是无限。这是因为唯一可能缩短土地寿命的是自然灾害。这是一项价值资产，因为通常不会被耗尽、破坏或被盗。在资产负债表中，它将反映土地的成本。同时它还包括附属成本，如测量、保险、法律费用和房产税。\n\
    \n建筑物像土地一样，是昂贵的价值资产。它们间接产生收入。获得建筑的成本通常包括保险、成交费用、税费和购买价格。它们不会永远存在。因此，它们有有限的寿命。\n\
    \n对于所有业务，设备都是至关重要的。就像建筑间接产生收入一样设备的成本通常包括购买价格、销售税和运费。\n\n在查看长期资产时，你需要记住，任何购买并持续超过一年的资产都是资本支出。这些支出记录在资产负债表中。通常，它们包括为你的公司或企业带来大量价值的大额采购。这些将不会列在支出中，因为它们在当前会计期间内不会被耗尽。\n\
    \n我们讨论了较大的资产，但较小的资产，如咖啡机、垃圾桶或灯泡呢？这些被认为是收益支出。它们将持续多个会计期间。虽然 500 美元是此类支出最高成本的常见限制，但它可以根据公司或企业而异。这些资产不记录在资产负债表中。它们通常列为支出，以便记录。\n\
