    The simplest of these may be like QuickBooks®, SAGE 50®, XERO® or WAVE®, useful
    for small to medium size businesses. An advantage of several of these is that
    no accounting training is needed to set them up and operate them. They all tend
    to be very intuitive.


    Larger organizations needing more comprehensive accounting packages have a wide
    variety from which to select. These more complex systems usually require specialized
    training available from the software vendors.


    A few characteristics are common to all packages. First, they should be designed
    with easy to use graphical interfaces, intuitive command structures and system
    design. They should be capable of producing the common accounting reports using
    the well-known ratios, percentages and rates common to all accounting systems.
    They should also be able to generate such reports on demand and track progress
    of this information over time for trend analyses.


    Many are adaptable to integrated data management ranging from order entry, invoicing,
    shipping data, inventory recording and control, accounts payable management and
    payroll processing, to name just a few. So goes far as ERP or Enterprise Resources
    Planning, which includes a number of extra features that integrate some, most
    or all of the "back office" functions into a single platform. These functions
    can include product and production planning, scheduling, materials planning and
    purchasing, inventory control, distribution, accounting, and even many human resources
    functions like payroll. These systems are complex but are becoming essential for
    large organizations and enterprises. The emphasis is on the enterprise; the total
    operation whether it is manufacturing, retailing, finance, or not for profit operations
    and foundations.


    Some complex systems can automate the ordering, receiving, payment functions,
    payroll records and check writing, and many others that are frequently done manually.


    One important feature all systems should be to provide automatic generation of
    the various ratios and measures discussed in the previous chapter, both instantaneously
    and with trend analysis. Systems that are more sophisticated allow managers to
    examine the trends in these ratios and indicators from their own desk, as desired.


    ## Chapter 15 - Time Value of Money - Present Value Concepts


    One very fundamental concept in accounting, personal life and business in general
    is that of the Time Value of Money. We all would prefer money today rather than
    the promise of money in the future. Businesses, however, do not always have the
    cash available to make critical investments when needed. They may need to borrow
    the funds in order to make the investment, which is intended to increase the revenue
    or decrease costs.


    We all recognize that there is a relationship between time and the value of money.
    That relationship is mathematically modeled with the concept of present value.
    This is not a difficult concept to understand and compute but for complex cases,
    the manual computation is time consuming and can lead to errors. Fortunately,
    computer spreadsheet programs can do all of the computations for us. We just need
    to properly understand and describe the problem in correct terms.


    The basic notion of Present Value is that the value of something sometime in the
    future is not as great as its value today. Economists, engineers and accountants
    model this difference mathematically through the various equations to calculate
    present value. For example, an investment in a new machine may reduce manufacturing
    costs, but the firm must pay for the new machine. It will generate a series of
    annual cost savings that have some present value. In order to evaluate this project,
    we use Present Value mathematics. (See the example with Modern Manufacturing below.)


    To accomplish that, we will introduce some new definitions. For several of these,
    we will provide illustrations.


    **Present Value (P);** the value of an asset now, today or. The present value
    of a $100 bill is $100.


    **Future Value (F);** the value of an asset at some selected time, which may be
    in days, months or years. If we have some positive interest rate, this will be
    larger than the original deposit.


    **Interest Rate (i);** the rate, which is associated with the passage of time.
    This may be for example, the interest charged on a credit card or the rate paid
    by an investment.


    **Number of Time Periods (n);** the number of periods being considered, for example
    24 months, 5 years, and so forth. The time period must agree with the interest
    rate. If the period is 1 month, the interest rate must be expressed as rate per
    month.


    **Periodic Payment (A);** for a case in which the payments are made periodically,
    this represents the number of payments to be made. These may be monthly, annually
    or whatever is consistent with n and i, or the periodic savings resulting from
    an investment.


    **Net Present Value (NPV);** this is the present value of an investment made with
    periodic returns (A) at a specified interest rate and number of periods minus
    the amount of the investment to acquire the asset.


    Here are some examples of the decisions made based on the Present Value model.


    Modern Manufacturing has the opportunity to install automation that will have
