    | 存货 | $22,000 | $15,000 |

    | 房屋、厂房和设备 | $50,000 | $78,000 |

    | 累计折旧 | ($20,000) | ($24,000) |

    | **总资产** | **$120,000** | **$128,000** |


    | 负债和权益 | 2014年金额 | 2015年金额 |

    |---|---|---|

