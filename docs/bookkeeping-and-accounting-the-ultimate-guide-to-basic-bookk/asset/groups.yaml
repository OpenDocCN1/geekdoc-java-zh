    # Chapter 7 – The CPA and Public Accounting


    Probably the most recognized accounting professionals are the CPAs, the Certified
    Public Accountants. These professionals may work for very large accounting firms
    like PriceWaterhouseCoopers® or KPMG®, two internationally known and respected
    accounting firms with offices in most countries around the world or the small
    or two person offices in almost every city and town in every nation. CPAs perform
    many valuable services for all types of businesses and organizations. A church,
    must file and pay the required payroll taxes for all employees on a timely basis.
    CPAs can up the accounting systems for a church secretary or bookkeeper to use
    in meeting these requirements.


    Similarly, any organization must establish responsibility and authority for internal
    auditing. Auditing in general means that the organization must carry out the accounting
    function in accordance with established standards and must assure management that
    the records are kept accurately and in compliance with these standards and laws.
    This internal auditing function is normally carried out by employees of the organization
    who are educated, trained and hired for that purpose, usually within the organization''s
    financial control office. This internal auditing task may also be outsourced to
    an independent firm such as a CPA company.


    External auditing is required by law for all publicly owned companies and other
    organizations. External auditing must be carried out by a qualified external authority,
    who is not part of the accounting being audited. CPA’s can serve as these Independent
    External Auditors. They must represent an independent third party, a role most
    often carried out by an organization in business as CPAs or External Auditors.
    These can be small, individual business firms or large multinational companies,
    like those mentioned above and many more.


    For publicly owned companies, that is firms who sell stock certificates, privately
    or through a stock market, the external audit report is extremely important and
    is addressed to the stockholders. For privately held firms, the report is addressed
    to the owners and the highest level of management. Shareholders rely on the external
    audit report to assure that the firm is'
  - '[PAGE 110]


    carrying out its accounting for the business activities in accordance with the
    GAAP or other applicable standards.


    For non-profits and charitable organizations, the report is addressed to the Board
    of Directors.


    Sharon Haas for example, is a graduate of a mid-western university with a degree
    in Business Administration where she majored in accounting and an MBA with a focus
    on Accounting and Finance. She has ten years experience in accounting for a medium
    sized manufacturing firm in Chicago, Illinois. The State of Illinois as most other
    states in the US requires 150 hours of education to qualify for the CPA certificate
    and license. The MBA is frequently used to meet this requirement. Many states
    also have a requirement for continuing education to maintain the CPA license.
    Sharon passed the required examination and was issued her license after her graduate
    studies.


    At present, she works as an external auditor for one of the multinational CPA
    firms, in her office in Cleveland, Ohio. Her client assignments are a number of
    firms in Ohio, Michigan, Wisconsin and Illinois. She is a member of AICPA, the
    American Institute of CPAs.


    As an external auditor, she maintains a relationship with her client firms, providing
    consultant services in the areas of taxes, investments, capital purchases and
    accounting. Every year, she visits each client firm to carry out her external
    audit duties. She has an assistant who travels with her, helping in the audit
    duties and in preparing the annual audit report.


    Sharon enjoys her work with both her employer and her clients. She says there
    is never a dull day; every day brings on new questions and different challenges.


    One of the most important responsibilities that Sharon and all other external
    auditors have to be careful with is maintain the position of an objective outside
    authority. Sharon, like most professionals, is friendly and outgoing but she has
    to be careful that she separates her feelings from her work. She must be objective
    and disionate while doing her work. She must maintain an ‘arm’s length’ attitude
    toward her clients. She must maintain her professional standards and report based
    on what she finds, not what her client may say. Stories abound of auditing firms,
    with some very famous names'
