    # Chapter 11 – Bookkeeping tips for your Small Business


    I want to take a few minutes to go over a few tips that you can follow. These
    tips will not only make things easier for you, as the business owner, but your
    bookkeeper will have an easier time as well.


    Bookkeeping does not need to feel like a nightmare. With a little planning, you
    can have your records accurate and complete at times.


    # Tip 1: Keep Accurate Records


    Most of your day-to-day business activities are handled and tracked through your
    online banking. However, the most important aspect is that your financial records
    are all kept in place. This way you do not need to scramble to meet requests.


    Granted, online banking will make it simple to track debits and credits. This
    does not mean you do not need some sort of bookkeeping records. It is important
    to know how the money was spent. Therefore, the records need to track the inflow
    and outflow of cash. This includes purchases with a credit card, when reimbursements
    are made to employees, etc.


    Making a good investment in a cash basis accounting software will help help with
    this tracking system.


    # Tip 2: Sort and File Receipts


    In your business, you will have a lot of receipts on a daily or monthly basis.
    Do not throw these away. However, filing them can be stressful. Keep in mind,
    if you file them and keep them organized it will eliminate the headaches in the
    future. It is vital that you keep all receipts for your business, although receipt
    accounts go well beyond just keeping the receipts.


    Keep your receipts organized. Over the time on the receipts will fade. That''s
    why it can be good to photocopy or scan your receipts. Then organize them by date
    with your detailed financial records. Many bookkeeping software will allow for
    you to scan and attach the receipt to the transactions made. This is a great feature
    that will help you track of all the receipts. However, even if the receipt is
    attached, you should still keep the scanned copy in case something happens with
    the software or it does not upload properly.'
  - '[PAGE 83]


    When keeping all your receipts, it will help reduce the headaches of tax time.
    If any of your items are tax deductible, you will need these receipts. Therefore,
    you should highlight the date and make notes about the reason for the expense.
    If you photocopy the receipt you will have room to make all the notes on the page
    with the receipt.


    # ### Tip 3: Collect Applicable Taxes


    I cannot stress this. Taxes need to be taken out at the time of the sale or when
    payroll is generated. Just like with the receipts, the longer you go between the
    transactions, the more chances for errors. Be sure to take care of the taxes when
    they occur.


    You need to collect or apply taxes as soon as they occur, such as when a sale
    is made or payroll is generated. This will ensure:


    +   1. Your business is not liable for a lump sum of taxes at the end of the year,
    and 2. Your business will not incur penalties due to delayed tax payments. That''s
    right. If the taxes are delayed after they incur, then the IRS will charge you
    a late penalty.


    # ### Tip 4: Do Accurate Invoicing


    Even though invoices are to let your clients know when to make payments, there
    is much more to this, it is than that. An invoice is a record of a transaction.
    Because of this, it is important that the information is accurate and complete.
    There is a difference between an invoice and a receipt. An invoice is what you
    will give to your clients letting them know how much and when to make payments
    to your business. You also consider these as future inflows of cash. Receipts
    are your business expenses, or the outflows of cash.


    # ### Tip 5: Get Donation and Contribution Receipts


    There are tax benefits in donating to outside organizations, although to take
    advantage of these tax benefits you will need to get a receipt for verification
    of the donation. Each receipt should have how much the donation is worth.


    There are some donations that require more than a check to ensure their validity.
    If the donation is over a specific amount, then a receipt is required.'
- md: '

    Requesting a receipt seems like a simple request. Remember, that receipt could
    mean the difference between a tax write-off or the write-off being denied.


    When in doubt, get a receipt. In this way you will always be covered for your
    contribution.


    ## Tip 6: Schedule Profit and Loss Statements


    A great way to check the health of your company is a Profit and Loss Statement.
    This statement will provide an overview of many areas of the business. It can
    summarize the business activity for a given period. That means you can have a
    P&L scheduled monthly, quarterly, or annually. It depends on the direction of
    your business.


    Your bookkeeper or accountant may find discrepancies in the P&L as each one is
    pulled. It is important to have these printed to give an idea which period of
    time that discrepancy occurred so that it can be corrected.


    The P&L can also be to finding and deciphering other records that you keep for
    your business.


    These six helpful tips are a great way to make it easier for your business and
    bookkeeper. Some of the simplest tasks can be the most important. It will make
    it easier to perform each of these if you follow a standard schedule of tasks
    to remind you of what needs to be done and when.


    Proper and responsible time management of any task is the key ingredient for success.
    This is especially true in bookkeeping and accounting. Most of scary feeling and
    large bit of time comes from poor preparation. Keep your business records accurate
    and organized on a daily basis. This will eliminate so much frustration along
    the way.


    ## Conclusion


    This book has given you the tools to better understand not only your bookkeeper,
    but your business as well. These are all areas that you, as a business owner,
    need to know and understand.


    Each area that we have covered has a purpose. When you work hand-in-hand with
    your bookkeeper, you will see the light at the end of the tunnel.


    I mentioned in the beginning, “It is not the business owner that runs the business.
    It is the business owner teamed up with the bookkeeper that truly runs the business.”


    I want to take a minute to breakdown that statement. As the business owner, you
    have the power to make the decisions that will move your business forward. Your
    business will succeed or fail based on your decisions.


    Your bookkeeper is the gatekeeper. They hold the power over the financial health
    of your business. With their mighty power, you can have all the financial statements
    when you need them. They can also ensure that all the transactions are correct.


    As a team, you are unstoppable. Your bookkeeper can ensure you have what is needed
    to move your business in the right direction. They can also help guide you in
    making the right decisions. With the proper analysis and ratios, you can predict
    the future if the trend is steady.


    Now I have empowered you to be on the same level as your bookkeeper and accountant.


    If you have not started your business yet, but you are thinking about it and currently
    doing the research for your business, then this is a great place to start.


    With the knowledge that you have learned, you will also be better prepared to
    add your financials to your business plan and pitch deck.


    Best of luck to all your endeavors. I look forward to seeing your business up
