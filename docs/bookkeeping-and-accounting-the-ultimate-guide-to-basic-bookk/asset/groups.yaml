    # 准备报告


    一个非常重要的步骤是准备报告或财务报表。虽然可以创建许多报告，但我们将关注主要报告，因为这些是小企业所需要的。


    作为一名记账员，你将需要非常熟悉以下报告：


    - 资产负债表

    - 损益表

    - 留存收益表

    - 现金流量表


    在本书的后后部分，我们将更详细地查看这些报表中的每一个以及如何阅读它们，以便你理解你公司的财务状况。


    # 第 2 章 – 小企业记账有哪些新变化？


    记账在不断变化，新的软件也不断涌现。让我们来看看有哪些供你作为小企业主使用的的一些技术和软件程序。


    ## 开立企业银行账户


    你希望你的业务成功。然而，你如何将个人财务与业务财务分开来呢？答案很简单：只需开一个企业银行账户。


    如果你将业务收入和支出与个人财务混在一起，很难看出你的业务经营状况。最好的方法是先咨询你的银行，看看他们是否提供企业账户。


    使用电子表格是基础操作。但是，如果你的业务有库存、员工、供应商等怎么办？这时候会计或记账软件就能派上用场了。我的建议是 QuickBooks 或 Xero，因为两者都提供这类账户的支持。


    ## 为你的业务选择最佳记账软件


    选择软件可以根据你的需求而异。至少，你需要一个分类或现金记簿。包含总记和分类账的现金记簿可以使用 Microsoft Excel 或 Google Sheets
    等电子表格轻松完成。记住，Google Sheets 将允许你通过 Google 保存，并在你所在的任何地方访问该文件。


    QuickBooks 和 Xero 可能不是最适合你业务的。有时，困难的部分在于找到最符合你需求的软件。


    让我们来看看几个可以让你起手的不同记账应用程序。我会包括 QuickBooks 和 Xero。


    ### Intuit QuickBooks Online


    QuickBooks Online 是目前最适合小企业的会计和记账软件。我喜欢你可以将其与银行账户关联。这使得在与业务账户关联后，易于使用和跟踪资金。它便于对业务账户和账目进行对账。尽管
    QuickBooks Online 还有许多其他功能。


    QuickBooks Online 内部的几个功能包括：


    - 开票

    - 支出跟踪

    - 库存管理

    - 采购订单

    - 报告


    随着你业务的增长，你可以在前三个层级之间升级账户。这将使你拥有小企业所需的所有内容。QuickBooks Online 的另一个很棒的特点是它有适用于 Android
    和 iOS 设备的手机应用程序。该软件还兼容大多数第三方应用程序。


    QuickBooks Online 还提供一些非常出色的定价。共有四个层级的定价，取决于你对业务的需求。它还提供 30 天免费试用。然而，如果你想直接开始并付费版本，你将在前六个月获得获得
    50% 的折扣。这意味着如果你刚开始业务，你将有六个月的时间赚取少量额外利润并稳固基础，然后再需要支付全价。


    最基础的是自雇（Self-Employed）计划。该计划每月 10 美元。它是为独立承包商和自由职业者设计的。它允许以下操作：


    - 跟踪里程

    - 跟踪收入和支出

    - 创建发票

    - 接受付款

    - 运行报告


    请记住，自雇计划无法升级到更高级。它要求你创建并设置新账户。


    下一层级是简单启动（Simple Start）计划。该计划支持单用户，每月 15 美元。此计划包括：


    - 跟踪里程

    - 跟踪收入和支出

    - 创建发票

    - 接受付款

    - 运行报告

    - 发送估报价

    - 跟踪销售和销售税


    下一层级是基础版（Essentials）计划。该计划支持多用户，每月 35 美元。此计划包括：


    - 跟踪里程

    - 跟踪收入和支出

    - 创建发票

    - 接受付款

    - 运行报告

    - 发送估报价

    - 跟踪销售和销售税

    - 账单管理

    - 时间跟踪


    最后一个层级是增强版（Plus）计划。该计划同样允许多用户，每月 50 美元。此计划包括：


    - 跟踪里程

    - 跟踪收入和支出

    - 创建发票

    - 接受付款

    - 运行报告

    - 发送估报价

    - 跟踪销售和销售税

    - 账单管理

    - 时间跟踪

    - 跟踪库存

    - 创建预算

    - 支付使用 1099 表的独立承包商


    与大多数小企业一样，你会有需要付工资的员工。通过 QuickBooks Online，你可以支付额外的月费用为前三个层级中的任何一个层级添加此功能。


    最好的部分是 QuickBooks Online 非常用户友好且易于使用。该软件还具有任何良好的会计和记账程序都所需的省时间功能。它会跟踪发票的截止日期，同步你的业务银行账户，跟踪你的信用卡交易等等。这允许你将更多时间花在业务上，同时保持整个业务的准确记账，并为你提供业务财务状况的极佳前景。另一个让
    QuickBooks Online 脱颖而出的省时间功能是，你可以向客户发送发票，让他们点击一下按钮即可在线付款。


    对于任何应用程序，事情都可能出错。这就是为什么 QuickBooks Online 同时提供电话和聊天支持。QuickBooks Online 账户已批准。这意味着无论你的需求是什么，你都可以让会计师访问账目。


    与所有程序一样，总会有限制，尽管对于 QuickBooks Online 来说似乎没有限制。限制主要在移动应用程序上。以下是你通过 App 执行的操作：


    - 发送发票

    - 对账

    - 拍摄收据并关联到支出

    - 查看客户信息并添加新客户

    - 查看仪表板数据，如账户余额、损益报告以及未付和逾期发票


    在查看了任何应用程序后，如果你觉得它非常完美，那么 QuickBooks Online 就是你完美的软件。然而，如果你更倾向于通过手机进行大部分会计和记账，那么还有另一个软件选择。


    ## Xero


    如果你更喜欢使用 PC 或 Mac，Xero 提供了很多选择。Xero 是目前最适合 Mac 用户的会计和记账软件。它易于使用和学习。我喜欢 Xero 的一点是视频。你在
    Xero 中执行的操作都有帮助你学习的视频。


    Xero 的价格也很有竞争力，并分为三个不同的计划。启动计划每月 9 美元。它确实有一些限制。启动计划的功能是：


    - 无限制用户

    - 每月限制 5 张发票

    - 每月限制 5 账单

    - 每月限制 20 次对账


    标准计划每月 30 美元。包括：


    - 无限制用户

    - 无限制发票

    - 无限制账单

    - 无限制对账

    - 支持 5 名员工的工资发放


    高级计划每月 70 美元。包括：


    - 无限制用户

    - 无限制发票

    - 无限制账单

    - 无限制对账

    - 支持最多 10 名员工的工资发放


    最好的部分是使用 Xero 没有长期合同。这意味着你可以随时更改而不会产生额外费用。


