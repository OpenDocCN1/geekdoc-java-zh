    1. List all revenue accounts followed by expense accounts.\n2. All expense totals\
    \ or the debit column. If you remember previously, expenses have a debit normal\
    \ balance.\n3. List revenue account totals or the credit column. If you remember\
    \ previously, revenue has a credit normal balance.\n\nRemember this equation for\
    \ the income statement:\n* Revenue – Expenses = Net Income or Net Loss\n\nIncome\
    \ Statement\nABC Financial Company, Inc.\nFor the Month Ending 31\n\nREVENUES\n\
    - Service revenue: $13,000\n- Interest revenue: $400\nTotal revenue: $13,400\n\
    \nEXPENSES\n- Office supplies expense: $2,000\n- Salaries expense: $2,120\n- Rent\
    \ expense: $1,000\nTotal expenses: $5,120\n\nNet income: $8,800\n\n## Statement\
    \ of Retained Earnings\n\nOnce the income statement is prepared you will want\
    \ to prepare a statement of retained earnings. This statement will show where\
    \ your company is at the end of the month. As the retained earnings are carried\
    \ over from the previous month then we will add the earnings for the current month\
    \ so that we will see where we stand at the end of the month. In turn these earnings\
    \ will be carried over next month’s retained earnings statement.\n\nRetained Earnings\
    \ Statement\nABC Financial Company, Inc.\nFor the Month Ending 31\n\nRetained\
    \ earnings as of July 1: $2,450\nNet income: $8,800\nTotal: $11,250 \nLess dividends:\
    \ ($400)\nRetained earnings ending balance: $10,850\n\nAs you can see the income\
    \ statement provides some valuable information. This is where you will be to get\
