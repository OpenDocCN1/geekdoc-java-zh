    # Chapter 13 – Measures and Ratios


    The product of accounting is information. This chapter examines the form and determination
    of the important information accountants need to produce and report to management,
    owners, stakeholders and stockholders. The Comptroller''s Office has the responsibility
    of setting up the recording, analysis and reporting structures to keep management
    informed of the condition of the organization, giving warnings and counsel to
    management in advance of issues to prevent adverse situations.


    Do to so, the CFO will use two types of strategies for extracting important information;
    static and dynamic. Static analysis measures important signals at some point in
    time, for example, the current ratio as described earlier. These are measures
    taken at some point in time, to assess the current situation. Dynamic analyses
    are those that examine the organization''s performance over some period of time,
    like month-to-month or over year. These dynamic analyses provide important trend
    analysis, allowing some prediction of future performance under these same conditions.
    That means ''what will be in the future if we don''t make a change.''


