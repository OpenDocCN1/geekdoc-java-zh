    # Chapter 8 – Jobs in Accounting: Financial Accounting


    Most organizations and business firms have someone in charge of the financial
    office. Frequently this is called the Comptroller''s Office (pronounced controller)
    and is staffed with people educated and trained in accounting. The head of the
    office is frequently a CPA and directs the staff in her office as well as providing
    advice and counsel to the top management. This position is usually that one reports
    directly to the owner or owners of the firm, or to the CEO (Chief Executive Officer)
    and is often referred to as the CFO or Financial Officer.


    In the private sector, these jobs are usually challenging and of course, vital
    to the health of the operation. One such member of management is George Wilson.
    He is the CFO for a medium sized firm, Catch of the Day Restaurants, a chain of
    restaurants, specializing in seafood meals.


    George is the head of controllers office and reports on the firm''s financial
    position. He uses several important indicators, in addition to the periodic income
    statements. Balance sheets are updated annually since they tend to change more
    slowly than other reports. Here are two of the important measures, expressed as
    ratios.


    Current Ratio is a comparison of how well the firm is prepared to meet its current
    obligations, and is expressed as the ratio of current assets to current liabilities.


    | Current Ratio |

    | Current Assets/Current Liabilities |


    If an organization finds itself with a current ratio of less than unity, that
    means it is at risk of being illiquid to the extent that it may become bankrupt.
    It does not have the means to pay its current obligations. These may be payable
    to suppliers, wages and salaries to employees or taxes due to the government.
    None of these can be sustained for long periods of time.'
- md: '

    The firm''s accountants may suggest strategies such as taking on long term debt
    to reduce current short term debt by means of paying off important payables but
    there is likely to be a serious underlying problems that is causing the organization
    to not be able to generate revenue with its assets.


    If we look at the Income Statement for Martin Company, we can see that the Current
    Ratio is $31,191/$14,685 or 2.13. This indicates Martin Company has more than
    enough assets to meet its current liabilities, even if it encounters difficulties
    in generating revenue for a short period of time.


    An example of a situation in which a firm might find jeopardy is the event of
    a serious business interruption like a flood or fire. The liabilities will not
    go just because the firm cannot operate but the current assets will shrink rapidly
    since there will be no revenue for a period of time. If the firm is able to get
    back into operation quickly, they might avert disaster. This is an instance recommendation
    by the accounting department.


    Another important ratio measures the efficiency of the firm, that is, how well
    it is doing converting its resources into revenue and is calculated by the ratio
    between Operating Expenses and Operating Revenue, both of which come from the
    Income Statement. This is called the Operating Ratio.


    ## Operating Ratio


    For the Martin Company, the Operating Ratio is $26,915/$34,652 or 0.78. This number
    must always be less than 1 and the smaller, the better. There are two important
    ways to analyze this number. First, is the current level compared with the prior
    periods? The second is to compare, wherever possible, to similar ratios for other
    companies in the same industry. As standalone ratios, they do not mean much. However,
    for example, when the Operating Ratio gets close to 1.0 or even exceeds 1.0, the
    firm is in serious trouble because its operating expenses exceed its operating
    revenue. The Current Ratio should always be greater than 1.0, meaning that the
    firm can meet its current obligations and the Operating Ratio must be significantly
    less than 1.


    George makes certain that these numbers are accurate and in fact, since Catch
    of the Day maintains an internal local area network for its managers, he posts
    these numbers on the internal system and because his software closes out each
    day, the top management can see these important ratios almost on a Real Time basis.


    Remember that the product of accounting is information and information is valuable
    to management only when it is available, timely, dependable and accurate.


    We will discuss these and many more indicators and ratios in a later chapter.


    # Chapter 9 – Tax Accounting


    Almost all countries have complex tax systems, covering the range from income
    taxes, property taxes, tariffs on imported goods, sales taxes, value added taxes,
    and anything else that the governments can think of. The watchword might be "if
    it moves, tax it, if it doesn''t, tax it anyway." These systems can be very complex
    and taxes are applied at all levels of government. One of the most important services
    accountants perform is keeping track of the client''s tax liability and making
    certain it is paid, on time and in the right amount.


    These specialists are in demand in all countries and all industries. Not understanding
    and complying with the myriad tax laws can get an organization in trouble faster
    than almost anything else and it requires a specialist to make sure the right
    taxes are paid and that the client does not pay more tax than is required by law.


    Tax accountants work in large and small firms, and can even be on staff for large,
    complex multinational CPA and Consulting organizations. Many other tax accountants
    are self-employed and also serve other accounting tasks for a variety of clients.
    Carl Waters is such a tax accountant. He operates a small accounting firm in a
    medium sized city in Indiana. Carl employs three people, all of whom are trained
    in accounting and Carl himself is a CPA.


    Carl spent 12 years working for the IRS as a tax agent and then became an Enrolled
    Agent before he opened his own office. Enrolled Agents are certified by the IRS
    as qualified to advise clients on tax matters and to represent them before the
    IRS authorities. Because of his years with the IRS, Carl is very familiar with
    many industries. He decided to open his own office six years ago and has an important
    list of clients. He and his staff perform many accounting functions for these
    clients in addition to preparing tax returns and setting up the recording systems
    needed within the client to maintain the records required. He also advises clients
    on ways to reduce their tax liability, within the limits of the tax laws.


    # Chapter 10 – Accounting Consultants


    Many organizations, especially large firms have a myriad of issues with which
    accountants must deal. Setting up accounting systems, assisting in public stock
    offerings, developing long-term strategic plans and so forth are tasks for which
    many organizations seek outside help from specialized consulting firms and many
    of these include large numbers of accountants.


    Accountants working for these consulting firms often develop specific areas of
    expertise in which they provide skills that the requesting firms and organizations
    cannot afford to employ full time.


    Many of these consulting firms offer a wide range of services including but certainly
    not limited to management services, marketing studies, investment counseling,
    stock offerings, fraud investigation (forensic accounting), human resources management
    and personnel development, taxes, international business matters and more.


    Many of these organizations select certain industries or sectors as areas of specialization,
    such as aerospace and defense, automotive industries, medical management, chemical
    industries or public sector, to name a few.


    Accountants who work in these organizations often find themselves with a variety
    of clients and develop specialties important to the firms. Not all of them must
    be accountants but in general, a study of accountancy is a common starting point.


    Helen Crandall is just such an employee. She works for an internationally known
    consulting firm with offices in many countries. Helen''s specialty in helping
    client firms "Go Public", that is to issue and sell stock in order to expand their
    funding and ownership. They may be changing from a privately held firm to one
    that is publicly owned.


    Helen has undergraduate and graduate degrees in Law and is a member of the Bar
    Association in her state of Connecticut. After completing her law studies, she
    continued in school and earned an MBA. This qualified her to become a CPA and
    develop her specialty. Most of the dealings are with firms across the country
    but that since she is deeply involved in Wall Street, she has her office in New
    York City. In her work, she advises companies in how to make the change from private
    to public ownership.


