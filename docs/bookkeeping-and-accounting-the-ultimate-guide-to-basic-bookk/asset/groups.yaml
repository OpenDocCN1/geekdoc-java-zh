    it is time to look at the assets. The first thing we will look at are the current
    assets. These are highly important to a business as they allow accountants and
    investors to learn more about them.


    To give you an idea of how this is achieved, an investor will divide the business
    by the current liabilities to calculate the business ratio.


    +   - Current Ratio = total current assets / current liabilities


    If the business has a higher ratio then it will determine that it has a high liquidity.
    However, if the ratio is less than 1, then the business may not have enough liquidity
    to cover the short-term expenses.


    The current assets have several different categories. The main three kinds of
    current assets are:


    +   - Cash

    - Short-term investments

    - Trade accounts receivable


    # Cash


    As you know, cash refers to money. This money can be in the form of currency or
    equivalent to currency. Cash, unlike investments, can be accessed easily and quickly.
    This can be used to cover short-term debts and daily business expenses. Because
    cash is such a vital part of the daily operations it also has a vital part in
    the internal controls.


    It is important to ensure that cash is reported accurately. Investors use this
    information to make important decisions. With that said you should always have
    your balance sheet up to date and accurate at all times. It should be free of
    errors and a reliable source. Therefore, to ensure accurate information is presented
    it will show and distinguish assets, liabilities, and equity. To take it step
    further, assets should be split into three areas such as current assets, fixed
    assets, and other assets.


