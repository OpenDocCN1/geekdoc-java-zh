    products shipped, the amount in the Accounts Receivable will be decreased by that
    amount and the Cash Account will be increased by the same amount.


    Inventory; represents all the finished goods that have been produced and are awaiting
    shipment, along with all of the material that is currently being worked on and
    all of the raw materials on hand. Other items like processing materials and maintenance
    supplies, office supplies and so forth are included here.


    Prepaids; is another interesting account. When Martin Company paid the property
