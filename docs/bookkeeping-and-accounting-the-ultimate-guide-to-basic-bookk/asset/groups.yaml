    # Chapter 9 – Accounts Receivables


    Many companies have their own accounts receivable team. It is so important that
    I needed to add a chapter just for that.


    Most companies would prefer to receive payments in cash. I know I would rather
    have a payment in cash than have someone owing me money on credit. However, there
    are times that a company may choose to extend a line of credit. Now with extending
    a line of credit we start an accounts receivable account. This way we would be
    able to keep track of these transactions.


    A really good way of looking at this in our everyday lives is when you get a loan
    or a credit card. The bank extends you a line of credit and in return you pay
    for it at a later date. They may add interest to this payment so that you would
    get it paid quicker.


    # Accounts Receivable


    How often have you bought something on account? The accounts receivable is just
    that. When a company makes a sale on credit and does not immediately receive a
    cash payment it is recorded as an account receivable.


    Credit payments such as accounts receivable is a promise-to-pay-in-the-future
    type of account and will be considered an asset. This is because you extended
    a line of credit to a customer and they will pay you in cash at a future date.


    There are times when a company will give terms as to when the payment is due,
    such as net 30. This means that payment is in 30 days from the date on the invoice
    or receipt. There are other times when a company may offer a discount. This generally
    looks like this: 4/10 net 30. This means that if the client pays the amount in
    10 days they will receive a 4% discount. Otherwise it is due in 30 days in full.


    When you’re accounting for the receivable you will need to record the credit transaction
    in the sales journal. However, this is not the only transaction that needs to
    be made. You will also need to record it in the accounts receivable ledger and
    the customer’s accounts receivable account.'
