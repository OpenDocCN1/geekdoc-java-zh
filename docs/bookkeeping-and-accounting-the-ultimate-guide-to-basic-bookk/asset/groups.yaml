    This will make it easier when it comes time to keep the books.


    ## Federal and State Labor Laws


    The labor laws are very important, especially when it comes to hiring. There are
    specific guidelines when hiring veterans, foreign workers, household employees,
    child labor, and people with disabilities. This is only to name a few as there
    are many others.


    For complete details about these different labor laws, consult the Department
