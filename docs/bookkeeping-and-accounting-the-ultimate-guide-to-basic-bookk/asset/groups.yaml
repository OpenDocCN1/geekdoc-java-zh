    # Chapter 5 – Employees


    Whenever you bring on new employees there are certain things that you need to
    look at. This is the basics of your payroll structure that is created for the
    business.


    Now what is the plan? How are you going to gather what is needed for each new
    employee? Here are 10 steps that will help you establish this goal. We will talk
    about each step so you can successfully hire new employees.


    +   1. Get an Employer Identification Number (EIN).

    2. Find out whether you need state or local tax IDs.

    3. Decide if you want an independent contractor or an employee.

    4. Ensure new employees return a completed W-4 form.

    5. Schedule pay periods to coordinate withholding for IRS.

    6. Create a compensation plan for holiday, vacation and leave.

    7. Choose an in-house or external service for administration payroll

    8. Decide who will manage your payroll system.

    9. Know which records must stay on file and for how long.


    +   10. Report payroll taxes. Filing and withholding taxes may seem stressful.
    It does not need to be. In fact, the IRS maintains an Employer’s Tax Guide. This
    can be found on the IRS website at [www.irs.gov.](https://www.irs.gov). Search
    for Publication 15 (2017), (Circular E), Employer’s Tax Guide.


    # Get an Employer Identification Number (EIN)


    If your business is about to hire employees as it is expanding, then you will
    need an Employer Identification Number (EIN). This number is a nine-digit number
    and will look like this: 12-3456789. It will be used for identifying the tax account
    of the employer. There are certain types of businesses that need an EIN who do
    not have employees. For this you can research the Employer’s Tax Guide to find
    out if you need one or not.


    There are two ways to apply for an EIN. The quickest is to apply through the IRS
    website at IRS.gov/ein. It will give you instructions and allow you to fill out
    the application electronically. The second is to fill out SS-4, also'
  - '[PAGE 44]


    found on the IRS website and fax it to IRS. For both methods, be sure you have
    all the required information you need for the application. The best way is to
    find form SS-4 and fill that out before you fill out the online application. This
    way you have all the required information and can easily fill out the online application.
    Keep in mind, you will need to fill out the online application in one setting
    and it times out after 15 minutes of inactivity.


    On the occasion that you bought someone''s business, you will still need to file
    for your own EIN. This number is unique to the employer.


    When it comes to time to file your return and you do not have the EIN yet, file
    a paper return and write "Applied for 20 April 20XX" in the space shown for the
    number. Keep in mind, the date is the date you applied for the EIN.


    All states have federal taxes that will be be withheld. Your EIN is also known
    as your Federal Tax ID. A good rule of thumb is to apply for one as soon as you
    register your business.


    # Find out whether you need state or local tax IDs


    Your state may not require you to pay state taxes. There are seven states that
    do not have income taxes and an additional two who only impose tax if the income
    is from dividends.


    The best way to know if you need a state tax ID is by visiting your website.


    # Decide if you want an independent contractor or an employee


    A good question is if you are going to hire an independent contractor or an employee.
    This could determine how the taxes are withheld from the payroll.


    Contractors will be operating under a different business name and will invoice
    you for the work. Keep in mind, there are times when a contractor can qualify
    as an employee in a legal sense. If you choose to hire contractors, you should
    get familiar with the Equal Employment Opportunity Commission Guide and the Fair
    Labor Standards Act.


    # Ensure new employees return a completed W-4 form


    Every employee must have a current W-4 on file with your business. This is needed
    so you can accurately dedicate taxes for your employees. So, make that each new
    employee files the W-4 with your business as part of the'
  - '[PAGE 45]


    hiring process. The form can be found either on the IRS website or by Google searching
    for W-4.


    +   1. The lines that need to be filled out:

    2. First and Last Name, Home Address, City, State, and ZIP

    3. Social Security Number

    4. Single, Married, or Married but withhold at higher single rate

    5. Check if name is different than SS Card

    6. Total number of Allowances

    7. Additional amount to be withheld

    8. Claim exemptions


    The employee will sign and date the form. Line eight is for the employer and will
    include employee''s name and address, office code, and EIN.


    # Schedule pay periods to coordinate tax withholding for IRS


    Most of us have worked for someone and you would have noticed that they had a
    set pay period. This makes it easy for your employees to know when they will getting
    paid. Many employers have the pay period as every two weeks, while others, such
    as the military, have it on specific days. For instance, the military uses the
    1st and the 15th of the month to pay their soldiers.


    No matter what schedule you use, be consistent. Keep the same schedule for all
    employees and do not change it.


    # Create a compensation plan for holidays, vacation and leave


    There are many different plans that you need to consider now that you are going
    to have employees. Now, we are going to look at the compensation plan.


    Does your business work on holidays? If so you are going to pay your employees
    and how long will they work? When your employees work holidays, you need to pay
    those employees 1.5 per hour, also known as time and a half. Let''s say your hourly
    rate is $10 and they worked 6 hours on a holiday that qualifies for holiday pay.
    They will get $60 for their shift plus $30 for the holiday. Therefore, for 6 hours
    on a holiday at $10 per hour you will pay your employee $90.'
- md: '

    At the same time, if you offer vacation pay, sick pay, or emergency leave pay,
    then you will calculate that pay based off the hours they would have normally
    worked that day.


    For the compensation plan you will withhold taxes like you normally would for
    your normal pay period.


    ## Choose an in-house or external service for administering payroll


    Making the decision to have your payroll in-house or outsourced to another business
    can be one of the biggest decisions you will make for your businesses'' payroll.
    Here are a few questions you can ask yourself to make the decision a little easier.
    After all, the wrong decision for the payroll could cost you a lot of money.


    - 1. How much control do you want over the process of paying your employees?

    2. How frequently do your employees get paid?

    3. Do different groups of employees get paid at different times?

    4. How often do you have to give out last minute pay checks and changes?

    5. How often do you process off-cycle payments?

    6. How complicated is your payroll? Do you have employee benefits and deductions,
    allowances, etc.?

    7. Does your organization have the resources to support an in-house payroll?

    8. Do you have someone on your team that has a good understanding of payroll and
    statutory reporting?

    9. How many accounts do you need to update on the general ledger?

    - 10. Do you want a record of all payroll transactions and changes made? These
    are only a few questions you may want to consider. Keep in mind, the longer an
    outside source needs to work on it the more money you need to pay them. If you
    can limit it to only a few hours a week, then it would be good to use an outside
    source and utilize your employee in another area of the business. However, if
    you feel that it will cost you more to pay an outside source due to the number
    of transactions that need to be done and it turns into a full-time job, you may
    want to consider doing the payroll in-house.


    ## Decide who will manage your payroll system


    Now that you have your payroll system up, another big decision is deciding upon
    a manager for it. For a small business, you may want to outsource this work as
    it will not be much work in the beginning. As your business grows, it would be
    a good idea for you to have an employee or yourself, as the business owner, to
    get trained on good bookkeeping practices.


    ## Know which records must stay on file and for how long


    One problem that many small businesses face is the duration of keeping files.
    This is why I am adding it here. Some would suggest that you should keep tax information
    for the business forever. I would not advise this unless you have an iCloud service
    that meets the security requirements for safeguarding the business and employees''
    information. Besides, if you are a big company, which is a lot of storage space
    that you would need for files.


    The IRS can audit your tax records for 3 years and can extend that for 6 years.


    - Business Tax Returns: Should be kept until IRS can no longer audit your tax
    returns. (6 years)

    - Payroll Tax Records: This will include time sheets, wages, tax deposits, benefits
    and tips. (4 years after taxes are due or when you paid them. Whichever is the
    later date)

    - Current Employee Files: (7 years after employee leaves business or 10 years
    if employee was involved in a work-related accident)

    - Job Application Information: (3 years even if you do not hire the employee)

    - Ownership Records: Includes business formation documents, annual meeting minutes,
    By-laws, stock-ledgers, and property deeds. Keep in mind, your business may not
    have all these documents. These documents will be anything you needed to form
    your business. (Retained Permanently)

    - Accounting Service Records: This will include financial statements, check registers,
    profit and loss statements, budgets, general ledgers, cash books, and audit reports.
    (At minimum 7 years. I would recommend permanently as it will give you an outlook
    of how your business has grown.)

    - Operational Records: This includes bank account statements, credit card statements,
    canceled checks, cash receipts, and check book stubs. (7 years)


    I know it seems a long time to hold onto these records. Keep in mind, you want
    to protect your business and keeping these records can safeguard your business
    when a problem may come up.


    In today''s world, everything is digital. You may want to invest in a server that
    meets the requirements needed to protect these files.


    ## Report payroll taxes as needed on a quarterly and annual basis


    Now that you have employees, you will need to report the payroll taxes. The taxes
    that must be deposited to the IRS are the federal income tax withholdings, social
    security, and Medicare taxes for both the employer and employee.


    There are two deposit schedules. They are monthly and semi-monthly. Before you
    start each calendar year, look at the Publication 15 on the IRS website to determine
    which payment schedule you are required to use.


    You have probably noticed I have referenced Publication 15 a few times. I would
    advise saving the publication as it has a lot of information you will be referring
    to while running your small business. Another one, depending on what you are using,
    will be by Publication 51.


    Publication 15 will be for forms 941, 944, and 945. For form 943 you will use
    Publication 51.


    As the employer, you will be required to report wages, tips, and other compensation
    by using the required forms. You will also report the taxes either by filing out
    the paper form and sending it into the IRS or by e-filing through the IRS website.


    Let''s look at the different forms:


    ### Form 941 (Employer’s Quarterly Federal Tax)


    - Quarterly


    ### Form 944 (Employer’s Annual Federal Tax)


    - Annual


    ### Form 945 (Employer’s Annual Federal Tax)


    - Annual


    ### Form 943 (Employer’s Annual Federal Tax)


    - Annual


    ### Form 940 (Employer’s Annual Federal Tax)


    - Annual


    ## Setting-Up Direct Deposit


    Setting up direct deposit can be easy with the right tools. Many software programs
    have the feature to set up direct deposit. The nice thing is when you run payroll
    you will need to get some information from the employee. Here is the basics of
    what you need:


    - Bank’s Routing Number or ABA. It is a nine-digit number that is associated with
    the bank. Can be found on checks or the bank website.

    - Checking / Savings Number

    - Bank name and Address


    There can be some cost to depositing the pay check. Some banks charge a transaction
    fee and per-check fee. Be prepared to handle this out of the business funds so
    that your employee gets what they earned.

