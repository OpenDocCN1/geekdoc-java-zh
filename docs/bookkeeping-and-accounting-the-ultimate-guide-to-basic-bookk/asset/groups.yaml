    because land does not depreciate. Depreciation is for those assets that are good
    for only a given number of years and will eventually need to be replaced. Therefore,
    we need to figure out how much it will depreciate over time.


    Depreciation will assign a cost of a long-term asset to an expense account in
    the periods when the asset generates revenue. So when you think about it, depreciation
    basically offsets the revenue of an accounting period with the costs of the product
    or service consumed to generate the revenue.


    The depreciation expense does not come to decrease value. Instead it is a result
    from allocating cost of a period of time. Once you start using the asset that
    is to be depreciated, it is generally done quarterly or annually. The depreciation
    ends when the company or businesses disposes of the asset or determines that its
    lifespan is over.


    There are several ways to record depreciation. The GAAP rule only requires the
    method used is rational and systematic through the asset''s lifespan. Let''s look
    at some of the ways to figure and record depreciation.


    ### Straight-line method—this is the most common for financial reporting. It will
    maximize net income more than any other method. It is also the easiest to understand
    and follow the calculations. This method attributes an equal amount of expense
    to each period of lifespan for the assets. Before we can understand the calculations
    we first need to find out what salvage value is. When a business uses the lifespan
    of the asset and is ready to sale it, you need to ask yourself how much you expect
    to earn from selling the asset. This is so let''s look at the equation for the
    straight-line method:


    - Depreciation = (Cost – Salvage Value) / Lifespan


    To explain this better let us look at each aspect of the equation. First you will
    take the cost of the asset and subtract the salvage value. The cost will be the
    original cost when you purchased the asset. Then you will take this total and
    divide it by the lifespan. The lifespan is the number of years that the business
    sees the asset as useful. This gives you the depreciation cost.


    For example, you have a flow jet for your business. The estimated lifespan is
    five years. You originally purchased it for $20,000 and the estimated salvage
    value would be $5,000. Let''s put this in the equation. $20,000 - $5,000 = $15,000;
    $15,000 / 5 = $3,000. Therefore, the depreciation will be $3,000. Many times,
    you can think of the lifespan as a percentage. The rate is 1. So the lifespan
    for the flow jet will be 1/5 or 20%.


    With a depreciation schedule we see the book value. It is important to know the
    book value of an asset. To find this you will take the original asset cost and
    minus the accumulated depreciation.


    - Book Value = Cost – Accumulated Depreciation


    Market value and book value are not the same. Book value represents the value
    of the asset according to the business books. Each year the book value has to
    be updated. This is because the accumulated depreciation will change each year
    and the company or business needs to know when the lifespan will be up. However,
    the book value should never go below the salvage value of the asset. Keep in mind
    that when the depreciation is finished you see the salvage value and the book
    value will be equal.


    ### Declining-balance method—with this method the depreciation assigned for each
    year of usage is different. Suppose you feel that your asset is more productive
    and creates more revenue early in its life. This method is an accelerated method.
    You will see more depreciation expense allocated early in the asset’s life than
    it would be in later years. For declining-balance method we can calculate depreciation
    expense with the following formula:


    - Depreciation Expense = Rate * Current Book Value


    Since book value decreases each period so does the depreciation expense. This
    is why it is called declining-balance method. With all the methods you need to
    keep in mind that book value will never go below salvage value and will be equal
    at the end of lifespan.


    ### Sum of the Years Digits (SYD) method—is another accelerated method. With this
    method the amount of depreciation is assigned to each year based on the sum of
    the years.


    ### Units of Production method—is different than the other methods. It is based
    on measurement of the asset''s output instead of lifespan. With this method it
    allows for more depreciation when the asset is used more. The method is used for
    assets such as machinery. For calculating this method you would use the following
    formula similar to straight-line method:


    - Depreciation Per Unit = (Cost – Salvage Value) / Estimated Units


    Keep in mind that natural resources are depreciated differently. This is because
    once their lifespan is up or they are used up, they can only be replaced. To figure
    this you will need to first find the cost per unit.


    - Depreciation Expense = Cost Per Unit * Yearly Units


    ### Modified Cost Recovery System (MACRS) method—must be used for business’s tax
    returns. Businesses are allowed to use one method for their financial statements
    and another method for tax returns. With this method the Internal Revenue Service
    (IRS) will specify depreciation rates and periods for particular categories of
    fixed assets, for example furniture and equipment. Using this method will lower
    taxes owed to the IRS.


    ## Chapter 12 – Owner’s Equity


    With the accounting equation we have taken a closer look at the assets and liabilities.
    Now let’s look at the owner’s equity. This can also be considered as stockholder’
    equity. As we have learned if you take the liabilities and subtract them from
    assets you get the owner’s equity. Therefore, this is what is left for the owners.
    This also includes contributions to fund the operations of the company as well
    as any undistributed income or net loss. Here is where you will see the worth
    of your company.


    Suppose you purchase a car for $40,000 on which you put a down payment of 20%.
    This would leave 80% to the bank. Therefore, you will have 20% equity until you
    fully pay it and have 100% equity of the car.


    There are primarily two types of owner’s equity:


    - Contributed capital—for sole proprietor or partnership in cash or assets, for
    example land, buildings, or equipment. With corporations the capital generally
    comes from proceeds of stock sales.

    - Retained earnings—is the cumulative value of net income or net loss that is
    not taken out of the business. These funds are left to generate future income
    and growth.


    ## Some Differences Between Sole Proprietorship and Corporation


    With a sole proprietorship there are three primary owner’s equity accounts:


    - Contributed capital—money that is contributed by the individual or partnership
    to the company.

    - Undistributed income—earnings that the owner leaves in the business to fund
    future growth.

    - Owner’s drawing—cash that is withdrawn from the business for personal use.


    Corporations are mainly funded from stock sales and earnings retained from the
    company. The following chart will help you better understand what types of owner''s
    equity are used for the type of company.


    | ACCOUNT NAME | SOLE PROPRIETSHIP | PARTNERSHIP | CORPORATION |

    | :--- | :--- | :--- | :--- |

    | Owner''s Equity | Yes | Yes | |

    | Owner''s Drawing | Yes | | |

    | Undistributed Income | Yes | Yes | |

    | Common Stock | | | Yes |

    | Preferred Stock | | | Yes |

    | Treasury Stock | | | Yes |

    | Additional Paid-In Capital | | | Yes |

    | Retained Earnings | | | Yes |


    ## Recording for Different Company Types


    Sole Proprietorship—is not a corporation. It is owned by one person. That individual
    holds the future of the business in their hands. They will make all the decisions,
    take all the risks, and enjoy all the gains of the business. The main advantage
    for this type of business is how simple it is. However, like everything when you
    have advantages there are just as many disadvantages. One of the main disadvantages
    is the owner''s unlimited liability; that is, you are responsible for all the
    actions of the business, both good and bad. Which means this will put all the
    assets at risk—not just the business assets but your personal assets too. Sole
    proprietorships and partnerships are handled much the same way.


    Corporations—are legal entities that are separate from their owners. A corporation,
    so to speak, has a life of its own. They exist until dissolved. The owners are
    not one individual or even a group of people that form a partnership in the business.
    The owners of a corporation are its shareholders or stockholders. However, they
    are not personally responsible for the debt of the company. Because of this limited
    liability structure, it makes a corporation desirable for most of the large and
    medium businesses to include many of the smaller ones.

