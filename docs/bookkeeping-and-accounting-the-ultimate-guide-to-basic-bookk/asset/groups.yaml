    Retained Earnings; is not cash in the bank. It is the value of the firm built
    up during its years of existence. It represents the money not distributed to owners
    or spent to maintain operations, like buying raw material. It is the profits retained
    and used to buy assets like property and equipment, invest in long term assets
    such as production equipment, buildings and parking lots.


    The total of Invested Capital and Retained Earnings represents the owners’ share
