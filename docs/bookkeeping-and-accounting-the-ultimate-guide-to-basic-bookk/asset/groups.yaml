    # Chapter 8 – Making Sense out of the Financial Statements


    As a small business owner, you need to understand these basic statements so you
    will have a good outlook at where your business stands financially. This is where
    it is it extremely important to communicate with your bookkeeper.


    There are many financial statements that you could look at, depending on what
    you want to see. The basic statements we are going to look at are:


    +   1. The Balance Sheet

    2. The Income Statement

    3. The Statement of Owner’s Equity

    4. The Statement of Cash Flow


    These are also considered the big 4. The reason they are the big 4 is because
    they will give you a great understanding of where your business is financially.
    They are also the financial statements that investors use to make decisions and
    envision where your business could be in the future.


    # The Balance Sheet


    The balance sheet is a good example of the accounting equation.


    +   * Assets = Liabilities + Equity


    Within this financial statement you will see the three areas divided up to show
    what accounts are listed under Assets, Liabilities, and Owner’s Equity. The owner’s
    equity represents retained earnings for your business. You will see all accounts
    on the balance sheet that do not have a $0 balance. Generally, accounts with a
    $0 balance do not need to be displayed.


    There are two types of formats that will be used for a balance sheet. You will
    have the vertical or horizontal formats. You saw a horizontal format in the previous
    chapter.


    Most business prefer the vertical format. However, the horizontal format has a
    better understand of the accounting equation. Let’s look at the example from the
    last chapter.'
  - '[PAGE 63]


    | ASSETS | | LIABILITIES | |

    | --- | --- | --- | --- |

    | Cash | $ 1,800 | Notes payable | $ 5,000 |

    | Accounts receivable | 4,600 | Accounts payable | 2,500 |

    | Supplies | 1,100 | Wages payable | 1,200 |

    | Prepaid insurance | 1,500 | Unearned revenues | 1,300 |

    | Equipment | 25,000 | Total liabilities | 10,000 |

    | Accumulated derecation | (7,500) | | |


    | | OWNER''S EQUITY | |

    | --- | --- | --- |

    | | Joe John, Capital | 16,500 |

    | Total assets | Total liabilities & Owner''s Equity | $26,500 |


    From this example, I want you to keep in mind the accounting equation: Assets
    = Liabilities + Owner''s Equity. If you notice, the balance is split in two sections
    and these are put side-by-side. On one side you have the Assets of $26,500. On
    the other side you have the liabilities of $10,000 and the Owner''s Equity of
    $16,500. Let''s take the liabilities and the owner''s equity. Add those together
    and you will get $26,500.


    With that in mind, let'' put the accounting equation into the balance sheet. Left
    side: $26,500 (Assets) = Right side: $10,000 (Liabilities) + $16,500 (Owner''s
    Equity). Now to see it more clearly you will have Left Side: $26,500 (Assets)
    = Right side $26,500 (Liabilities + Owner''s Equity).


    Now what does this mean for your business? Based on your business''s assets, the
    business is balanced in its financial obligations. This is to include investments
    and retained earnings.


    You can think of this way. Assets are the means a business uses to operate. On
    the other hand, the liabilities and owner''s equity are the two ways to support
    the assets.


    Now that we have an understanding of the balance sheet, what about the accounts
    that are listed in each section? It is important to know what accounts are asset,
    liability, and owner''s equity.


    # Current Assets


    These assets will have a life span of less than one year. This means they can
    be converted into cash. They include:'
- md: '

    - Cash and Cash Equivalents

    * Cash

    * U.S. Treasuries

    - Accounts Receivable

    * Short-Term obligations owed to the business by the clients

    - Inventory

    * Raw materials


    ## Non-Current Assets


    These assets cannot be turned into cash easily. They are expected to be turned
    into cash within one year or have a life span of more than a year. Depreciation
    is usually calculated on these assets. Examples of these assets are:


    - Tangible Assets

    * Machinery

    * Computers

    * Buildings

    * Land


    - Intangible Assets

    * Goodwill

    * Patents

    * Copyright


    ## Liabilities


    When you look at the liabilities you should consider this as the obligations a
    business owes to others. Just like assets, they can be both current and long-term.


    - Current Liabilities

    * Paid within one year

    * Accounts Payable


    - Long-Term Liabilities

    * Debts that are more than one year

    - Non-Debts that are more than one year


    ## Owner’s Equity


    This is the money that is invested in the business. The retained earnings for
    the income statement will also be transferred into the owner’s equity at the end
    of the fiscal year. The owner’s equity shows the net worth of your business. Types
    of accounts listed in the owner’s equity:


    - Capital – Money invested or earned by the business

    - Drawing – Money that is withdrawn from the business


    ## The Income Statement


    To a business owner the income statement may look scary. However, it does not
    need to be. The income statement takes a closer look at the revenue or sales and
    the expenses of the business. This is usually done on a quarterly and annually
    basis throughout the fiscal year.


    You may hear terms such as profits, earnings, and income when talking about the
    income statement. Keep in mind, they all mean the same thing.


    There are two basic formats that you will use, the multi-step and the single-step
    formats. Here are the steps for each format:


    - Multi-Step Format

    - Net Sales

    - Cost of Sales

    - Gross Income*

    - Selling, General and Administrative Expenses (SG&A)

    - Operating Income*

    - Other Income & Expenses

    - Pretax Income*

    - Taxes

    - Net Income (after tax)*

    - Single-Step Format

    - Net Sales

    - Materials and Production

    * Marketing and Administrative

    * Research and Development Expenses (R&D)

    * Other Income & Expenses

    * Pretax Income

    * Taxes

    * Net Income


    In the multi-step format there are four measures of profitability (*). Here is
    an example of an income statement:


    | | 2015 | 2016 |

    |---|---|---||

    | Net Sales | 1,500,000 | 2,000,000 |

    | Cost of Sales | (350,000) | (375,000) |

    | Gross Income | 1,150,000 | 1,625,000 |

    | Operating Expenses (SG&A) | (235,000) | (260,000) |

    | Operating Income | 915,000 | 1,365,000 |

    | Other Income (Expenses) | 40,000 | 60,000 |

    | Extraordinary Gain (Loss) | - | (15,000) |

    | Interest Expense | (50,000) | (50,000) |

    | Net Profit Before Taxes (Pretax Income) | 905,000 | 1,360,000 |

    | Taxes | (300,000) | (475,000) |

    | Net Income | 605,000 | 885,000 |


    Once you know how the income statement is formatted and what is involved, you
    can see that between 2015 and 2016, there was an increase in sales by 33%. At
    the same time, the cost of sales was reduced from 23% to 19% in sales. If you
    look further you can see other increases and decreases between the two years.


    ## Statement of Owner’s Equity


    The Statement of Owner’s Equity can be used as a separate statement or it can
    be included in the balance sheet and income statements. It is also known as a
    Statement of Retained Earnings. This statement will show the status of your business''
    earnings.


    Many times will you see this more with corporations as they have shareholders
    and pay out dividends. However, it can be a useful tool for a small business to
    show your retained earnings and financial standings.


    The main purpose for this statement is to release financial information to the
    public, so they can decide if they want to invest in your business. It will also
    help analyze the health of your business.


    Alex Printing and Design


    Statement of Owner’s Equity


    For the Year Ending December 31, 2015


    Alex, Capital: $100,000

    Add: Additional Contributions: $10,000

    Net Income: $57,100

    Total: $167,100

    Less: Alex, Drawings: $20,000


    Alex, Capital – Dec. 31, 2015: $147,000


    ## Statement of Cash Flow


    One thing that is important is the flow of cash in and out of the business. The
    Statement of Cash Flow provides you with information. However, it is split into
    four parts:


    1. Operating Activities

    2. Investing Activities

    3. Financing Activities

    4. Supplemental Information


    Here is an example of a Statement of Cash Flow.


    Frank''s Deal LLC


    Statement of Cash Flow


    For Month Ended July 31, 2017


    Net Income: $100

    Add back: Depreciation expense: $20

    Add back: Loss on sale of equipment: $180

    Increase in Inventory: ($200)

    Increase in supplies: ($150)

    Cash provided (used) in operating activities: ($50)


    Purchase of office equipment: ($1,100)

    Proceeds from sale of equipment: $900

    Cash provided (used) in investing activities: ($200)


    Investment by owner: $2,000

    Net increase in cash: $1,750

    Cash at the beginning of the year: $0

    Cash at July 31, 2017: $1,750

