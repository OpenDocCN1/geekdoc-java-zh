    # Preparing W-2''s for your employees


    Many times when we start a business and have employees we do not know how to prepare
    the W-2''s. That is why I want to set you up for success in this area. When an
    employee first starts working with your business, you need to have them file a
    W4 for employee or a W9 for independent contractor. This is the basis for starting
    the W-2 preparations.


    Let''s first start by checking all the information on the W-4. This form needs
    to be on file with your business at all times. If there are any changes that need
    to be made, such as an employee moved, you will need them to file an updated form.
    To ensure that all the information is correct before preparing the W-2 it is a
    good idea to have all employees look over their W-4 to ensure it is up-to-date.
    This form changes each year. Therefore, in January you must provide this form
    to all your employees for the current year.


    # Gathering Information


    Let''s look at some of the basic information you will need from your business
    for each employee.


    +   - Business Employee ID Number

    - Name, Address, and Zip Code of the business

    - Business State Tax ID Number


    This information will be on every W-2 prepared by the business. It is a good idea
    to have it saved where you can find it easily whenever it is needed.


    Now we need to gather information about each employee.


    +   - Employee name, address, and social security number or other tax ID number

    - Amount paid to the employee. (i.e. total wages, tips, and other compensation)

    - Amount of federal income tax withheld

    - Social security wages (only up to the maximum amount for the year)'
