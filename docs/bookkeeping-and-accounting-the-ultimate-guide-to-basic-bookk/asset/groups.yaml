    | 应交税 | $13,000 | $10,000 |

    | 应票款（长期） | $10,000 | $33,000 |

    | 普通股 | $41,000 | $24,000 |

    | 留存收益 | $44,000 | $38,000 |

    | **总负债和权益** | **$120,000** | **$128,000** |


