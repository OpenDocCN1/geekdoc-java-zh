    We will describe each of these line items in the order shown on the Balance Sheet.
    Just as with the Income Statement, all these figures are shown in thousands.


    ### Assets are "What we Own"


    #### Current Items


    Current Assets; those assets which we can access quickly, such as 90 days.


    Cash; represents money in demand deposits, like a checking account, needed for
    paying current bills like utilities and wages. A company''s cash may be held in
    short term investments like Certificates of Deposit with maturity dates of one
    year or less.


    Accounts Receivable; the money we have billed to customers but have not yet received.
    If we receive a check in the mail today paying an invoice for products shipped,
