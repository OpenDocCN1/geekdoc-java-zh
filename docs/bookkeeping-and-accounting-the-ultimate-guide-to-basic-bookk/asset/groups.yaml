    we owe." Think of the Balance Sheet as a photograph of the business at a point
    in time. Just as the Income Statement is a recording of progress over time, the
    Balance Sheet gives us a picture of the company at some requested, say at the
    end of the year or mid-year as shown here for the Martin Company. The Balance
    Sheet may also be called the Position Statement.


