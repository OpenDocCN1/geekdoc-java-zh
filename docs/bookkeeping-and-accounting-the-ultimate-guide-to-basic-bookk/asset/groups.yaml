    ## 资本成本


    正如我们在三份重要文件中看到的，即：资产负债表、利润表和现金流量表，我们需要投入资金来改进和扩大我们的业务。我们可以通过贷款、抵押或债券的形式向外部贷款人借钱。我们必须以某些约定的利率为这些资金支付费用。


    或者，我们可以出售公司来筹集资金。当我们这样做时，投资者将期望通过让我们使用他们的资金获得回报，因此我们可能需要向股东支付股利。


    我们的第三种选择让所有者投入更多资金，但同样，我们的所有者将期望投资回报。钱从来不是免费的，除非我们通过利润产生它，而且我们可能需要投资资产以产生更多利润。


    资本成本是公司为了获得所使用的资本而支付的成本。这适用于股权资本和债务资本，包括利息、股利、优先股的支付以及给所有者的回报。


    确定这些替代方案的成本是非常重要的，我们将这种成本称为“资本成本”。在数学上，资本成本是我们来自所有者、贷款人或股东的所有资金来源的加权平均值。


    ## 现代制造公司的示例


    现代制造公司（Modern Manufacturing）是一家上市公司，其股票在纽约证券交易所交易。目前股票价值为 $22。在目前的股价下，现代公司每年支付
    $1.50 的股利，收益率为 3.3%。目前有 50,000 股发行在外的。


    他们有一笔利率为 8%、金额为 $4,000,000 的长期贷款，对于新投资，他们正在支付 9.5% 的利息。他们目前没有计划借更多。


    公司的创始人持有优先股，优先股支付 6% 的股利，目前有 45,000 股发行在外的，价格为 $75。


    | 来源 | 总额（千美元） | 百比 | |年度成本（千美元） |

    |---|---|---|---|

    | 普通股 | 1,100 | 3.3% | 36.3 |

    | 优先股 | 1,650 | 6% | 99.0 |

    | 贷款 | 4,000 | 8% | 320.0 |

    | 资金总额 | 6,750 | | 455.3 |

    | 加权平均资本成本 | | 6.75% | | |


    这项分析告诉我们，加权平均资本成本为 6.75%。这意味着任何自由裁量投资必须至少收回该金额。为了新的资本投资提供底线，管理层设定了 14% 的最低利率或门槛率。任何拟定的资本项目必须按门槛率进行折现。现代制造公司选择了
    14% 作为他们的最低内部收益率（IRR）。任何未达到或超过此率的项目都不会批准。


    ## 内部收益率


    查看这些决策的另一种方法是确定使 NPV 等于零的折现率。这被称为“内部收益率”或 IRR。该率必须高于资本成本，越高越好。IRR 常用于竞争稀缺资金的项目。内部收益率计算并不简单，但幸运的是，电子表格程序可以直接计算它。目前
    IRR 是评估资本项目的方法。然而，这适用于自由裁量投资。如果由于公司没有选择的情况（例如监管合规或安全问题）而必须进行投资，公司将努力设计最廉价的解决方案并接受任何确定的
    IRR。


    ## 回收期


    回收期是查看投资的另一种更简单的方法。它忽略了时间价值。它只看投资本身，并确定需要多久才能回收投资。


    使用上述现代制造公司的示例，8 年内节省的总金额为 $25,000 或 $200,000。基于 $55,000 的投资，投资将在 3.64 年后回收。我们可以看到，从现值的角度来看，回收法高估了投资现值近
    $90,000（$200,000 - $112,082 = $87,918）。这清楚地证明了在决策时考虑现值因素的重要性。


    ## 结论


    我们这本书的目标是向非会计专业的读者介绍会计世界的基本概念概念和词汇。


    我们解释了三份重要文件：资产负债表、利润表和现金流量表。我们需要投入资金来改进和扩大我们的业务。我们可以通过贷款、抵押或债券的形式向外部贷款人借钱。我们必须以某些约定的利率为这些资金支付费用。


    或者，我们可以出售公司来筹集资金。当我们这样做时，投资者将期望通过让我们使用他们的资金获得回报，因此我们可能需要向股东支付股利。


    我们的第三种选择让所有者投入更多资金，但同样，我们的所有者将期望投资回报。钱从来不是免费的，除非我们通过利润产生它，而且我们可能需要投资资产以产生更多利润。


    资本成本是公司为了获得所使用的资本而支付的成本。这适用于股权资本和债务资本，包括利息、股利、优先股的支付以及给所有者的回报。


    确定这些替代方案的成本是非常重要的，我们将这种成本称为“资本成本”。在数学上，资本成本是我们来自所有者、贷款人或股东的所有资金来源的加权平均值。


