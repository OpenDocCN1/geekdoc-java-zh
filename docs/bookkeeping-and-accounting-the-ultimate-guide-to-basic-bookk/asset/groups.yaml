    ## Chapter 14 – Accounting Software


    For all but the smallest organizations, accounting software is essential to an
    effective financial control system. Individuals selling items on the internet
    for example, may be able to keep the necessary records manually, in hard copy
    on paper or a computer spreadsheet, the image of old time accountants sitting
    at a wooden desk wearing green eyeglasses and working with an ink pen, is history
    but today''s world requires much better systems. Think of Charles Dickens'' characters
    Ebenezer Scrooge and Bob Cratch.


    When an organization, whether for profit or not-for-profit, has more than one
    individual with responsibilities, a real accounting system is needed and the larger
