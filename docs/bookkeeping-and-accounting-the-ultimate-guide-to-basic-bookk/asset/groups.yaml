    # 销售日记


    辅助分类账可以从总账或特殊日记记账。每家公司都有销售业务。因此，最常见的特殊日记之一就是销售日记。


    该日记将显示所有赊销业务。每笔分录都会出现在销售日记中，并代表应收账款中客户账户的借方。它还会显示收入账户的贷方。请记住，这些销售产生的现金收入记录在另一个特殊日记中。


    # 现金收款日记


    请记住，销售日记中的数据是赊期交易。这些不包括现金销售。那些销售记录在现金收款日记中。这个特殊账户包含现金收款的三个主要部分：


    - 1. 已经支付欠款且现在用现金支付其账款的客户。现金交易记录在此处。

    - 2. 任何已发生并支付现金的销售。

    - 3. 公司收到的任何其他现金来源。


    请记住，如果是现金交易而非信贷交易，它将记录在这里。此外，这里有三列包括：


    - 1. 现金——显示每项涉及现金收款的交易。

    - 2. 销售折扣——如果有提供任何折扣，将记录在此处。

    - 3. 其他——这包括任何与销售折扣不同的账户。


    与借方一样，贷方也有三列。它们是：


    - 1. 应收账款——当应收账款中包含一笔贷方付款时。请记住在细节中写下账户的名称，以便知道支付了哪个账户。

    - 2. 销售——这是你记录所有现金销售的地方。它将与借记现金的金额相匹配。

    - 3. 其他——当贷方指向任何入账资金且不是来自另外两列中的列时。


    | 日期 | 账户 | 现金收款日记 | | | | |

    | :--- | :--- | :--- | :--- | :--- | :--- | :--- |

    | | 记账后参考 | 借方：现金销售 | 其他 | 贷方：应收账款 | 销售 | 其他 |

    | 1月7日 销售 | | $750 | | | $750 | |

    | 1月17日 Richard Adams 利息 | | $220 | | | $20 | |

    | 1月27日 Jean Webster | | $488 $12 | | | $500 | |

    | 总计 | | $1,258 $12 | | | $500 $750 $20 |


    现金收款日记中记录的一些分录会同时记在辅助分类账和总账中。


    在过账这些交易时，你会在“记账后参考”中打一个钩，因为它已经进行了汇总。然而，在总日记中，你会在这一列中输入如 `CR21` 的代码。这将指向过账的位置，例如现金收款
    (CR) 和现金收款日记的第 21 页 (2)。这将更容易看到现金的来源。有些交易没有记在现金收款日记中，但仍记在辅助分类账中。例如，利息、租金或股利直接记在总账中。


    # 购买日记


    当你赊购存货时，你会将其记录在购买日记中。这些交易是根据凭证（如采购发票）进行的。该日记主要用于库存的购买。


    在购买日记中过账时，你会在总账中借记购买账户并贷记应付账款。该日记的使用方式与销售日记类似。购买日记中的每张发票都占一行。


    你在购买日记中拥有的信息是：


    - 1. 交易日期

    - 2. 供应商名称

    - 3. 发票日期

    - 4. 金额


    在某些情况下，会有第五列列出条款。


    见下方的购买日记示例：


    | 日期 | 供应商 | 发票日期 | 记账后参考 | 金额（借方/贷方应付） | 条款 |

    | :--- | :--- | :--- | :--- | :--- | :--- |

    | 1月5日 | Silk Shop | 1月5日 | | $300 | |

    | 1月15日 | Sunbrella, Inc. | 1月20日 | | $700 | |

    | 1月25日 | Cushion Boutique | 1月31日 | | $450 | |


    每天你都会按照账户持有人的名称过账购买项目。在汇总日记和分类账时，你会勾选记账后参考。然而，在应付账款分类账中，你会在记账后参考处写入 P1。这代表购买日记
    (P) 和页码 (1)。


    # 现金支出日记


    由于所有赊购都记录在购买日记中，那么当使用现金时，购买记录在哪里呢？这些交易记录在现金支出日记中。尽管如此，不仅是用现金进行的购买。它们还包括当你赊购购买后用现金支付欠款的交易。其格式与现金收款日记相似。


    这里有三列贷方。它们是：


    - 1. 现金

    - 2. 采购折扣

    - 3. 其他账户


    你还有两列借方。这些包括：


    - 1. 应付账款

    - 2. 其他账户


    现金支出日记可能如下：


    | 日期 | 支票 | 付款人 | 账户 | 记账后参考 | 借方 | 贷方 |

    | :--- | :--- | :--- | :--- | :--- | :--- | :--- |

    | 2月11日 | 112 | Used Cars | | B | 现金 采购折扣：0其他账户 | 应付账款：0其他账户 | $75 |

    | 2月13日 | 113 | Tribune | | B | $25 | $150 |

    | 2月27日 | 114 | Real Estate | 租金支出 | B | | $2,000 |

    | 2月28日 | 115 | Petty cash | 备用金支出 | B | $50 | $30 |


    记在本份日记中的账户也会记在应付账款辅助分类账中。


    '
