    When working with the general journal, always remember the Debits and Credits
    must equal.


    # ## The Ledgers


    For bookkeeping and double-entry accounting there are three main categories of
    ledgers we need to look at.


    +   1. General Ledger (GL)

    2. Accounts Receivable Ledger (ARL)

    3. Accounts Payable Ledger (APL)


    You may think that it is a waste of time to record the entries twice. You will
    find that just because you have journaled the transactions in one of the seven
    journals it is beneficial to organize the transactions into the ledger accounts
    as well.


    # ## General Ledger (GL)


    When you set up your business bookkeeping, a Chart of Accounts was created. Each
    account on this Chart of Accounts has a Ref number assigned to it. This reference
    comes in handy for both the Journals and the Ledgers. For each account on the
    Chart of Accounts you will have a General Ledger for the account. In each General
    Ledger, you will have either a Debit or Credit normal balance.


    In the seven journals, you would record the ledger or associated journal in the
    ref field. In the ledgers, you will record the corresponding journal in the ref
    field.


    Let''s look at the General Journal for your business’s Cash account.


    Account: Cash - Ref: 100


    | DATE | DESCRIPTION | REF | DEBIT | CREDIT |

    |---|---|---|---|--|

    | Apr 1 | Opening Balance | | 4,500 | |

    | 1 | | J1 | | 25.00 |

    | 4 | | J1 | 180.00 | |

    | 4 | | J1 | | 250.00 |

    | 8 | | J2 | | 145.00 |

    | 10 | | J2 | 25.00 | |'
  - '[PAGE 41]


    | Total | Note: End of Month totals) | | 4,285 | |


    The total is calculated at the end of each month and carried forward to the next
    month as the new opening balance. There will be a ledger for each account on the
    Chart of Accounts.


    # Accounts Receivable Ledger (ARL) and Accounts Payable Ledger (APL)


    The Accounts Receivable and Accounts Payable Ledgers are subsidiary ledger accounts.
    These are accounts that are in addition to the General Ledgers but are mainly
    for tracking the receivables and payables.


    You may have multiple accounts of vendors who owe you money or you owe too. Each
    account will have their own ledger.


    Accounts Receivable will have a Debit normal balance while Accounts Payable will
    have a Credit normal balance.


    Here is an example of each type of ledger:


    Debtor: A. Franklin - Ref: AR-F


    | DATE | REF | DEBIT | CREDIT | BALANCE |

    | July 18 | Terms 60 days | SJ1 | 150.00 | | 150.00 |

    | 27 | Terms 30 days | SJ1 | 190.00 | | 340.00 |


