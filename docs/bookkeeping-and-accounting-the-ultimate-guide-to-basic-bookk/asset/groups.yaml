    其中许多组织选择特定的行业或部门作为专业化领域，例如航空航天与国防、汽车行业、医疗管理、化学工业或公共部门等。


    在这些组织中工作的会计师经常发现自己拥有各种客户，并开发出对公司重要的专长。并不是他们人都必须是会计师，但通常情况下，学习会计学是一个常见的起点。


    海伦·克兰达尔（Helen Crandall）就是这样一名员工。她在一家国际著名的咨询公司工作，该公司在许多国家设有办事处。海伦的专长是帮助客户公司“上市”，即发行和出售股票来扩大其资金和所有权。他们可能正在从私有公司转变为上市公司。


    海伦拥有法学学士和硕士学位，并且是她康涅狄格州律师协会的成员。在完成法律学习后，她继续深造并获得了 MBA。这使她能够成为一名 CPA 并发展她的专长。大多数交易是与全各地的公司进行的，但由于她深度参与华街，她的办公室设在纽约市。在工作中，她建议公司如何完成从私有所有向公共所有的所有转变。


