    # Part 3: Accounting

    An Essential Guide to Learning Accounting Quickly


    # Introduction


    How many times have we shunned away from accounting? What many of us do not realize
    is that accounting is in our day-to-day lives and we do not even realize it.


    If you have ever balanced a checkbook or kept a ledger for your bank accounts
    then you are performing some kind of accounting operation.


    We are going to expand on these simple tasks by showing how they relate to accounting.
    Then we will build on that and introduce you to accounting.


    Accounting is not just for businesses. As you will see, it is for all of us, every
    day of our lives. Imagine if you want to buy a house. You need to figure out mortgage
    payments, interests, etc. Those estimates that both you and the bank perform is
    accounting. The same goes for a car or renting an apartment.


    Throughout this learning experience or journey into accounting you will learn
    about the guidelines for accounting that need to be followed. You will also learn
    many parts of the basics to help you get started.


    However, as a special bonus we will take a brief look into financial analysis
    by showing you the five main categories of financial ratios. These ratios will
    help you not only with accounting analysis but also with everyday investments.
    These ratios are the same ones that banks use to approve loans or businesses use
    to find out where their business is financially.


    Take the time to absorb this information as it will help you in your everyday
    life and in your business ventures.


    # Chapter 1 – Generally Accepted Accounting Principles (GAAP)


    To really understand accounting, you need to understand the rules or regulations
    behind it. These are also known as the standards. Overall these standards are
    known as the Generally Accepted Accounting Principles or GAAP.


    The standards were established and developed by the Financial Accounting Foundation’s
    (FAF) standard-setting board. This board is divided into the Financial Accounting
    Standards Board (FASB) and the Governmental Accounting Standards Board (GASB).


    These standards regulate the language for financial reporting. In turn it communicates
    the financial conditions and operational results. This includes companies, both
    public and private, not-for-profit organizations, and state or local governments.


    Financial reporting mainly includes information on the following:


    - Financial position, which includes balance sheet and statement of net position

    - Results of operations, which includes statement of revenues, expenses, and changes
    in net position

    - Disclosures.


    GAAP is used for providing useful information for investors, lenders, or others
    who need to know this information about a company. It also establishes concepts,
    objectives, standards, and conventions which evolve over time to guide how the
    statements are prepared and presented.


    The principles of the GAAP include:


    - Recognition—this includes items that should be recognized in a financial statement,
    such as assets, liabilities, revenues, and expenses.

    - Measurement—this is the elements of the amounts that are included in the financial
    statements.

    - Presentation—on the financial statements it includes the line items, subtotals,
    and totals.


    ## Financial Accounting Foundation (FAF)


    The FAF is a non-profit organization that oversees the standard-setting boards.
    Its mission is to fulfill the needs of the public interest by setting accounting
    standards.


    ## Financial Accounting Standards Board (FASB)


    The FASB is responsible for setting the accounting standards for for-profit entities
    in the United States.


    ## Governmental Accounting Standards Board (GASB)


    The GASB is responsible for setting the accounting standards for state and local
    government entities.


    The principles of the GAAP include:


    - Recognition—this includes items that should be recognized in a financial statement,
    such as assets, liabilities, revenues, and expenses.

    - Measurement—this is the elements of the amounts that are included in the financial
    statements.

    - Presentation—on the financial statements it includes the line items, subtotals,
    and totals.


    The FASB and GASB use the following steps for due process:


    1. Identify Topic: the board identifies a financial reporting issue that needs
    to be addressed. This is based on recommendations from stakeholders, staff research,
    board members’ concerns, or other means.

    2. Conduct Pre-agenda Research: research is conducted on those issues that need
    to be presented.

    3. Make Agenda Decision: board adds projects or concerns to be discussed at public
    meeting.

    4. Deliberate at Public Meeting: Public meeting is held to discuss the issues.

    5. Issue Document for Public Comment: the Board drafts a proposal and makes it
    public for comments.

    6. Host Public Hearing or Round Tables (Major Projects): on major issues a public
    hearing may be called to give stakeholders a chance to comment on the issues.

    7. Re-deliberate Based on Comments and Research: another meeting is held to review
    the comments given by the public.

    8. Issue Final Standard: the Board issues the final paperwork with the new standards.

    9. Education: the Board ensures that everyone is educated on the new standards.

    10. Implementation: the new standards are now implemented.


    If the standards are significant and have been in place for two or three years
    by GASB standards it could be selected by the FAF''s Post-Implementation Review
    team. This team will evaluate it for its effectiveness.


    ## What are the Qualities of the GAAP?


    All businesses, regardless if you are a company, not-for-profit, or government,
    use standards in accounting to provide information used on financial statements.
    The information they need to provide is financing, lending or donating money,
    or determining how public officials are spending our tax money.


    When a company uses financial statements that follow GAAP standards then investors
    and others trust that company.

