    | DATE | ACCOUNT | DEBIT | CREDIT |

    |---|---|---|---|

    | June 30 | Cash | $50,000 | |

    | | | | $50,000 |

    | June 30 | Warranty expense | $2,500 | |

    | | Warranty liability | | $2,500 |


    ## Chapter 11 – Current and Long-term Assets


    Now that we have gone over some of the liabilities that may occur, it is time
    to look at the assets. The first thing we will look at are current assets. These
    are highly important to a business as they allow accountants and investors to
    learn more about them.


    To give you an idea of how this is achieved, an investor will divide the business
    by the current liabilities to calculate the business ratio.


    - Current Ratio = total current assets / current liabilities


    If the business has a higher ratio then it will determine that it has high liquidity.
    However, if the ratio is less than 1, then the business may not have enough liquidity
    to cover the short-term expenses.


    The current assets have several different categories. The main three kinds of
    current assets are:


    - Cash

    - Short-term investments

    - Trade accounts receivable


