    method. This method is also approved by the GAAP. This is because it converts
    the income statement items into cash items. It will also include receipts and
    cash payments in the operating activities section of the cash flows. Let’s take
    a look at Tony’s Tots comparative balance sheet for 2014 and 2015.'
