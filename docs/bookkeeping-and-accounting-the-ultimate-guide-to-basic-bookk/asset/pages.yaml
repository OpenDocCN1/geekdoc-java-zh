  md: 'because land does not depreciate. Depreciation is for those assets that are
    good for only a given number of years and will eventually need to be replaced.
    Therefore, we need to figure out how much it will depreciate over time.


    Depreciation will assign a cost of a long-term asset to an expense account in
    the periods when the asset generates revenue. So when you think about it, depreciation
    basically offsets the revenue of an accounting period with the costs of the product
    or service consumed to generate the revenue.


    The depreciation expense does not come to decrease value. Instead it is a result
    from allocating cost of a period of time. Once you start using the asset that
    is to be depreciated it is generally done quarterly or annually. The depreciation
    ends when the company or businesses disposes of the asset or determines that its
    lifespan is over.


    There are several ways to record depreciation. The GAAP rule only requires the
    method used is rational and systematic through the asset''s lifespan. Let''s look
    at some of the ways to figure and record depreciation.


    Straight-line method—this is the most common for financial reporting. It will
    maximize net income than any other method. It is also the easiest to understand
    and follow the calculations. This method attributes an equal amount of expense
    to each period of lifespan for the assets. Before we can understand the calculations
    we first need to find out what salvage value is. When a business uses the lifespan
    of the asset and is ready to sale it you need to ask yourself how much you expect
    to earn from selling the asset. This is so let''s look at the equation for the
    straight-line method:


    +   - Depreciation = (Cost – Salvage Value) / Lifespan


    To explain this better let us look at each aspect of the equation. First you will
    take the cost of the asset and subtract the salvage value. The cost will be the
    original cost when you purchased the asset. Then you will take this total and
    divide it by the lifespan. The lifespan is the number of years that the business
    sees the asset as useful. This gives you the depreciation cost.


    For example, you have a flow jet for your business. The estimated lifespan is
    five years. You originally purchased it for $20,000 and the estimated salvage
    value would be $5,000. Let''s put this in the equation. $20,000 - $5,000 ='
  merge: -1
  pgno: 187
- img_proc: true
  md: '$15,000 / 5 = $3,000. Therefore, the depreciation will be $3,000. Many times,
    you can think of the lifespan as a percentage. The rate is 1. So the lifespan
    for the flow jet will be 1/5 or 20%.


    With a depreciation schedule we see the book value. It is important to know the
    book value of an asset. To find this you will take the original asset cost and
    minus the accumulated depreciation.


    +   - Book Value = Cost – Accumulated Depreciation


    Market value and book value are not the same. Book value represents the value
    of the asset according to the business books. Each year the book value has to
    be updated. This is because the accumulated depreciation will change each year
    and the company or business needs to know when the lifespan will be up. However,
    the book value should never go below the salvage value of the asset. Keep in mind
    that when the depreciation is finished you see the salvage value and the book
    value will be equal.


    Declining-balance method—with this method the depreciation assigned for each year
    of usage is different. Suppose you feel that your asset is more productive and
    creates more revenue early in its life. This method is an accelerated method.
    You will see more depreciation expense allocated early in the asset’s life than
    it would be in the later years. For the declining-balance method we can calculate
    the depreciation expense with the following formula:


    +   - Depreciation Expense = Rate * Current Book Value


    Since the book value decreases each period so does the depreciation expense. This
    is why it is called declining-balance method.


    With all the methods you need to keep in mind that the book value will never go
    below its salvage value and it will be equal when it is at the end of its lifespan.


    Sum of the Years’ Digits (SOYD) method—is another accelerated method for depreciation.
    With this method the amount of depreciation is assigned to each year of life based
    on an inverted scale of the sum of the years of its lifespan.'
