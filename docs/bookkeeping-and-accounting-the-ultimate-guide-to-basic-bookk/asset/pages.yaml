  md: '+   - Cash and Cash Equivalents

    * Cash

    * U.S. Treasuries

    - Accounts Receivable

    * Sort-Term obligations owed to the business by the clients

    * Inventory

    * Raw materials


    # Non-Current Assets


    These assets cannot be turned into cash easily. They are expected to be turned
    into cash within one year or have a life span of more than a year. Depreciation
    is usually calculated on these assets. Examples of these assets are:


    +   - Tangible Assets

    * Machinery

    * Computers

    * Buildings

    * Land


    +   - Intangible Assets

    * Goodwill

    * Patents

    * Copyright


    # Liabilities


    When you look at the liabilities you should consider this as the obligations a
    business owes to others. Just like assets, they can be both current and long-term.


    +   - Current Liabilities

    * Paid within one year

    * Accounts Payable


    +   - Long-Term Liabilities

    * Debts that are more than one year'
