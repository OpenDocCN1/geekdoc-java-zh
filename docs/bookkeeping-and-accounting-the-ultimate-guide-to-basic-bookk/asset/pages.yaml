  md: '- Etc. There is so many more. With a little research, you could find deductions
    that you never knew existed.


    # Preparing W-2''s for your employees


    Many times when we start a business and have employees we do not know how to prepare
    the W-2''s. That is why I want to set you up for success in this area. When an
    employee first starts working with your business, you need to have them file a
    W4 for employee or a W9 for independent contractor. This is the basis for starting
    the W-2 preparations.


    Let''s first start by checking all the information on the W-4. This form needs
    to be on file with your business at all times. If there are any changes that need
    to be made, such as an employee moved, you will need them to file an updated form.
    To ensure that all the information is correct before preparing the W-2 it is a
    good idea to have all employees look over their W-4 to ensure it is up-to-date.
    This form changes each year. Therefore, in January you must provide this form
    to all your employees for the current year.


    # Gathering Information


    Let''s look at some of the basic information you will need from your business
    for each employee.


    +   - Business Employee ID Number

    - Name, Address, and Zip Code of the business

    - Business State Tax ID Number


    This information will be on every W-2 prepared by the business. It is a good idea
    to have it saved where you can find it easily whenever it is needed.


    Now we need to gather information about each employee.


    +   - Employee name, address, and social security number or other tax ID number

    - Amount paid to the employee. (i.e. total wages, tips, and other compensation)

    - Amount of federal income tax withheld

    - Social security wages (only up to the maximum amount for the year)'
  merge: -1
  pgno: 77
- img_proc: true
  md: '+   - Medicare wages and tips and Medicare tax withheld

    - Allocated tips paid

    - Dependent care benefits paid and benefits taxable to the employee

    - State wages, tips, and income taxes withheld for each state the employee worked

    - Local wages and tips paid and local income tax withheld


    # Review and Creating your W-2s


    Keep in mind, every employee who worked for you during the year must get a W-2
    from the business. This includes if they only worked for one day. They will still
    receive a W-2.


    There are many ways you can get the W-2 forms needed for printing. You can buy
    them from your local office supply store, your CPA, a tax or accounting software,
    and from the IRS. However, W-2s are not downloadable from the IRS website.


    There are a few options for printing your W-2 forms.


    +   - Accounting Software – you may need to purchase an add-on for this processing
    feature

    - Tax preparation Software – check to see if it is included with the software
    you are using.

    - Purchase W2 forms


    If you are able to, it is easier to use accounting software with the payroll feature.
    Simply get the add-on and all the work is done for you. Your accounting software
    will keep track of all the information for you and at the end of the year you
    will need to review to make sure it is accurate before printing.


    Regardless of which method you use, you should also have a W-3 transmission form.
    A W-3 must be submitted to the IRS, which will show the totals of the W-2''s.


    # Distribution of the W-2''s


    Many businesses have different ways of distributing the W-2’s. Remember, all W-2’s
    must be out no later than January 31st.'
  merge: -1
  pgno: 78
- img_proc: true
  md: 'There are two ways that W-2''s can be distributed. You can choose to either
    mail them or have the employee pick them up. However, many businesses are making
    the W-2 more accessible on a secured business website. This allows employees to
    print out their own W-2 for filing taxes. It also helps to ensure employees will
    not lose their W-2 and need a copy from the employer.


    # Filing W-2 and W-3 Forms


    Now that you have gotten all of your W-2''s to the employees, it is time to decide
    how you are going to file them with the Social Security Administration. You will
    need to file form W-3 complete with copy A of each W-2 for your employees.


    There are two ways to file these forms.


    +   1. File online at the business services online section of the Social Security
    website. You will need to register first to file electronically.

    2. Mail completed forms W-2 and W-3 to the Social Security Administration.


    Also, if the employee pays state taxes, then copy 1 of the W-2 will get sent to
    the state taxing authority for every state they worked in and paid taxes to.'
