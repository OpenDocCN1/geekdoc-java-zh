  md: '# Chapter 11 – Bookkeeping tips for your Small Business


    I want to take a few minutes to go over a few tips that you can follow. These
    tips will not only make things easier for you, as the business owner, but your
    bookkeeper will have an easier time as well.


    Bookkeeping does not need to feel like a nightmare. With a little planning, you
    can have your records accurate and complete at times.


    # Tip 1: Keep Accurate Records


    Most of your day-to-day business activities are handled and tracked through your
    online banking. However, the most important aspect is that your financial records
    are all kept in place. This way you do not need to scramble to meet requests.


    Granted, online banking will make it simple to track debits and credits. This
    does not mean you do not need some sort of bookkeeping records. It is important
    to know how the money was spent. Therefore, the records need to track the inflow
    and outflow of cash. This includes purchases with a credit card, when reimbursements
    are made to employees, etc.


    Making a good investment in a cash basis accounting software will help help with
    this tracking system.


    # Tip 2: Sort and File Receipts


    In your business, you will have a lot of receipts on a daily or monthly basis.
    Do not throw these away. However, filing them can be stressful. Keep in mind,
    if you file them and keep them organized it will eliminate the headaches in the
    future. It is vital that you keep all receipts for your business, although receipt
    accounts go well beyond just keeping the receipts.


    Keep your receipts organized. Over the time on the receipts will fade. That''s
    why it can be good to photocopy or scan your receipts. Then organize them by date
    with your detailed financial records. Many bookkeeping software will allow for
    you to scan and attach the receipt to the transactions made. This is a great feature
    that will help you track of all the receipts. However, even if the receipt is
    attached, you should still keep the scanned copy in case something happens with
    the software or it does not upload properly.'
