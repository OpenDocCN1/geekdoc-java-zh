  md: '# Chapter 5 – The Cash Flow Statement


    Every organization depends on its immediate cash reserves to pay its bills. This
    is not different from a personal household, where the householder must keep money
    in a savings or checking account to pay all the bills that are due. On some occasions,
    the individual may choose to keep cash but that is not recommended because of
    the risk of loss or theft. Companies and organizations do not pay in cash for
    the same reasons.


    What is important to any organization or individual is that there is sufficient
    money flowing into the cash account to cover current liabilities. The flow of
    money into and out of the organization is called its Cash Flow, and is reported
    on the Cash Flow Statement.


    For private and public owned firms, for-profit companies, the primary source of
    revenue is the firm''s operations. Whether it is in the manufacturing, retailing,
    servicing or any other sector, its operations are the reason the flow exists.
    For non-profits and charitable organizations, the main income is from donations
    and fund raising. That is their operations equivalent.


    There are usually three streams of cash flow reported, if the organization is
    involved in all three. They are:


    +   1) Cash flow from operations


    +   2) Cash flow from investments


    +   3) Cash flow from financing activities


    # Cash Flow from Operations


    Operations cash flow is just that; cash flowing into and out of the operations
    of the organization. The cash flow statements are taken directly from the Income
    Statement and the Balance Sheet. We will use Martin Company as our example. Many
    organizations have different rules for determining cash flow.


    Martin, remember their Income Statement showed cash at $2,493,000 shown in thousands
    as $2,493. There are several other lines for which we'
  merge: -1
  pgno: 103
- img_proc: true
  md: 'must account. Accountants base the cash flow statement Operating Profit, PBT
    or Profit Before taxes. The cash shown is part of that PBT, at $5,733.


    Martin has incurred depreciation charges but these are not cash expenditures so
    they must be added back into the cash flow. Receivables are also liquid assets
    and must represent cash flow in the near future.


    Inventories represent cash already spent or committed so they do not add to cash
    flow, at least until they are used in operations and sold products. However, some
    firms may include inventory in cash flow. That is determined by the organization.


    Similarly, accounts payable and any other accrued liabilities must also be subtracted
    from net income since they are liabilities that must be paid with cash. These
    might be salaries and wages at the end of the period.


    The final amount represents the Net Cash from Operations for Martin Company for
    that period. The accountants compare that with the same cash flow from the previous
    period to see if it is increasing or decreasing. Organizations always want the
    cash flow to increase, since that represents their ability to meet their obligations,
    pay the owners and lenders and certainly, to grow the business by expansion.


    # Cash Flow from Investing


    However, this is not the only user of cash. The company must pay for any assets
    it purchases during the period or funds used to pay for assets previously purchased.
    This is the Cash From Investing, in this case, investing in plant and equipment.
    Any capital assets acquired during this period must be shown in this line item.


    In the case of The Martin Company, no new assets were acquired during this period
    so that entry is zero.


    # Cash Flow from Financing Activities


    The company must also meet its long-term liabilities which may be in the the form
    of long-term notes it has issued in the past and must be repaid. For a publicly
    owned organization, any dividends also consume cash and they'
  merge: -1
  pgno: 104
- img_proc: true
  md: 'appear under financing activities, since selling stock is a means to finance
    the company. In the same way, for privately held organizations, any payments to
    the owners are made from cash so they must be included in the cash flow statement.


