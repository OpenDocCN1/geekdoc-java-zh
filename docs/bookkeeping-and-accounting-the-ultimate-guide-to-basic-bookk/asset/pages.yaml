- img_proc: true
  md: '# Chapter 1 – Bookkeeping Basics


    Before we get started on breaking down bookkeeping, we need to look at some of
    the basics. I want you to have the ability to read your financial records and
    understand them. This will allow for you to know the financial aspect of your
    business. In turn, it will allow you to make good decisions that can increase
    the growth of your business.


    # Double-Entry Method


    Bookkeeping uses a method called the “Double-Entry Bookkeeping.” This means that
    for every entry there is at least one debit and one credit.


    I want you to remember this equation:


    +   - Assets = Liabilities + Equity

    This is the basic formula for the Double-Entry Method and will come into play
    with every transaction you make.


    # Source Documents


    Every transaction made will have a source document. Source documents could be
    anything from a contract to a gas receipt. If you spent the business’s money then
    you will need some form of proof of how much you spent. These are the source documents.


    These documents will give us all the information you will need to record it in
    the books. This includes referencing the source documents. Some software will
    allow you to attach the scanned file to the transaction so that at any time you
    can bring up the source document.


    # End-Of-Period Procedures


    End-of-Period Procedures relate to not only quarters. Even though all the transactions
    have been recorded throughout the months or year, they will not be read for preparing
    the financial reports.


    To ensure that you have your books accurate for preparing the financial reports,
    you need to consider that there are procedures that need to happen at least month-end,
    year-end, and the end of payroll year.


    The following outline will show, as a guideline, what should be done during each
    time.'
  merge: -1
  pgno: 12
