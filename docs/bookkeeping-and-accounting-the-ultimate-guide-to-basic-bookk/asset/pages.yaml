  md: '# Chapter 12 – Owner’s Equity


    With the accounting equation we have taken a closer look at the assets and liabilities.
    Now let’s take a look at the owner’s equity. This can also be considered as stockholder’s
    equity. As we have learned if you take the liabilities and subtract them from
    assets you get the owner’s equity. Therefore, this is what is left over for the
    company’s owners. This also includes contributions of capital by the owners. These
    contributions are used to fund the operations of the company as well as any undistributed
    income or net loss. Here is where you will see the worth of your company.


    Suppose you purchase a car for 40,000 on which you put a down payment of 20%.
    This would leave 80% to the bank. Therefore, you will have 20% of $8,000 of equity.
    As you make payments your equity will go up until you fully pay it and have 100%
    equity of the car.


    There are primarily two types of owner’s equity.


    +   1. Contributed capital—for sole proprietor or partnership in cash or assets,
    for example, land, buildings, or equipment. They value a fair market value. With
    corporations the capital generally comes from proceeds of stock sales.

    2. Earner capital—is the cumulative value of net income or net loss that is not
    taken out of the business. These funds are left to generate future income and
    growth.


    # Some Differences Between Sole Proprietorship and Corporation Equity


    With a sole proprietorship there are three primary owner’s equity accounts.


    +   1. Contributed capital—money that is contributed by the individual or partnership
    to the company.

    2. Undistributed income—earnings that the owner leaves in the business to fund
    future growth.

    3. Owner’s drawing—cash that is withdrawn from the business for personal use.'
