  md: '# Chapter 10 – Liabilities and Payroll


    All companies will have some sort of liability and most will have employees and
    need to figure in the payroll for their staff. The current liabilities are separated
    into two categories or sections: known liabilities and estimated liabilities.


    # Known Liabilities


    Any time a company has obligations that carry a set value you have a known liability.
    The known liabilities may fall into other categories such as:


    +   * Accounts payable

    * Sales tax payable

    * Unearned revenue

    * Short-term notes payable

    * Payroll liabilities

    * Accrued liabilities


    If you remember, any goods or services purchased on credit are considered accounts
    payable. However, when you make a sale it may incur yet another type of known
    liability. This would be sales tax payable. This account will be used for tracking
    and recording sales tax that needs to be paid to the state and local governments.


    Also remember when a company receives money in advance it would be considered
    as unearned revenue. These unearned incomes can be considered as a known liability.


    Another form of known liability is a short-term note payable. This is a debt that
    will be paid on a promissory note within one year.


    An important known liability for a business is the payroll liability. The best
    way to think about these liabilities is the amount paid to employees and is a
    set amount paid on a predetermined date. This type of liability has three categories.


    +   * Employee compensation'
