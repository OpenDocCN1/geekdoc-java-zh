    # General Journal Transactions


    Every transaction would be included in a journal. However, not all of the transactions
    will fit into a special journal. For instance, those transactions that are not
    involved with credit sales, cash receipts, purchases, or cash disbursements will
    be in the general journal and may be detailed enough from there.


