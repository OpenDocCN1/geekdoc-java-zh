  md: '# Chapter 14 – Statement of Cash Flows


    We just went over the net income statements which represents the amount of revenue
    minus the cost of goods or expenses and taxes. However, the flow of cash is recorded
    on the statement of cash flows. This statement is the actual amount of cash the
    business receives and pays out. Usually with the accrual method it may cause a
    big difference between the income statement and the statement of cash flows.


    The revenue and expense may be recognized even though the statement of cash flows
    does not change. The statement of cash flows will focus on three different types
    of activities for your business.


    +   1. Operating activities—will relate to day-to-day operations.

    2. Investing activities—will relate to long-term and some short-term assets.

    3. Financing activities—will relate to shareholders, banks, investors, and liabilities.


    Even though the statement of cash flows focuses on these three types it also includes
    two directions of cash flows.


    +   1. Inflows—which is the cash received.

    2. Outflows—which is the cash spent.


    Both the inflows and outflows will change with the company’s holdings in assets,
    liabilities, equity, and noncash assets. The statement of cash flows is a valuable
    tool for stakeholders. It will show the cash flow of the company and help investors
    make decisions for the corporation and how to use the cash that is brought in
    for the company.


    With a statement of cash flows it also includes an investing section. This will
    allow investors to see how their investments are being used to grow the company.
    For example, if the statement of cash flows shows purchases of land or equipment
    it may say to the investor that the company is growing or expanding.'
  merge: -1
  pgno: 198
- img_proc: true
  md: 'Another part of the statement of cash flows is the financing section. This
    shows how the company is borrowing money and paying off any debts.


    With the statement of cash flows it can be compared from year to year. This can
    give you a good outlook at how the business is doing each year in comparison to
    the previous years.


    # How is the Statement of Cash Flows Used?


    Now that we have some background of what a statement of cash flows is, we need
    to ask ourselves how it is used. When you think about this statement has many
    uses, for example:


    +   - Predicting a business or company’s future cash flow


    +   - Ability to pay dividends


    +   - Evaluating its management decisions


    Knowing that it has so many uses makes it a vital statement to have to show the
    growth of the company and help make good business decisions. It is important that
    it is accurate and appropriate with information. A good general rule to remember
    is that whenever there is an inflow or outflow of cash in assets, liabilities,
    or equity then it should be reported on the statement of cash flows under operating
    activities, investing activities, or financing activities.


    | BALANCE SHEET CATEGORY | STATEMENT OF CASH FLOWS |

    |---|---|n| Current assets (other than cash) | Operating activities |

    | Current liabilities | Operating activities |

    | Long-term assets | Investing activities |

    | Long-term liabilities | Financing activities |


    The above chart shows how each category in the balance sheet will transfer to
    the statement of cash flows.


    One way the statement of cash flows is used is by helping managers and investors
    effectively predict future cash flows. This statement will provide accurate information
    that is both historical and current economic. This information will show cash
    related to financing, investing, and operating'
  merge: -1
  pgno: 199
- img_proc: true
  md: 'activities. When you use this information in conjunction with budget expectations
    and expected income and expense information then it will help managers and investors
    make good and effective predictions when making decisions for the company.


    Another effective use of this statement is that it helps management outside individuals
    analyze the company’s operating, financing, and investing activities.


    If you are a public traded firm, then the statement can also help managers determine
    when to declare and pay dividends.


    # Methods of Cash Flows Reporting


    There are two ways to prepare a statement of cash flows. We will first look at
