  md: 'Operating expenses are also recorded on the income statement after revenues.
    These are expenses that occur that come from running a business. These could include:


    +   * Salaries paid

    * Research and development

    * Legal fees

    * Bank charges

    * Accounting fees

    * Rent

    * Lease payments

    * Utility bills

    * Fee for business licenses


    Keep in mind that if an expense not fall under cost of goods sold then it should
    fall under operating expenses on the income statement. Note that if it is fixed
    or variable operating expenses they need to be recorded separately on the income
    statement.


    There are three main categories of operating expenses.


    +   1. Selling expenses—are directly related to making sales or generating revenue,
    for example, wages, advertising, travel, entertainment, rent, utilities, telephone,
    commissions, warehousing, catalogues, shipping, depreciation, office supplies,
    postage, etc.

    2. General expenses—are related to the overall operation of a business, for example,
    wages for officers, office staff, accounting personnel, and legal workers. Also
    includes fringe benefits, supplies, rent, utilities, telephone, non-sale-related
    travel, depreciation, postage, entertainment, and professional fees.

    3. Administrative expenses—is also related to the overall operation of the business.'
