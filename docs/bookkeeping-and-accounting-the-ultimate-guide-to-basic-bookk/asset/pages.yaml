  md: '# Chapter – The Accounting Equation


    The Accounting Equation is probably the most fundamental concept concept part
    of accounting as it is done in modern times. It captures the concept described
    in the Balance Sheet. That concept is for any going concern, what the concern
    comes from only two sources, funds borrowed, expressed as liabilities and owed
    to the owners, their equity.


    **Assets = Liabilities + Owner''s Equity**


    This equation is often expressed in its expanded form:


    **Assets = Liabilities+ Owner''s Capital+ Revenues- Expenses- Owner Draws**


    In this form, it describes more of the operations of the firm. The assets of the
    firm come from:


    +   **Liabilities** ; money contributed by entities outside the firm such as long
    term and short term loans from banks or investment companies, sale of stock, bonds
    sold, and so forth.


    +   **Owner''s Capital** ; the funds supplied by the owners and the profits generated
    by the operations.


    +   **Shareholder Stock** ; owners can be shareholders of common or preferred
    stocks, frequently sold on a stock exchange


    +   **Revenues** ; money generated by the operations of the firm and other sources
    of revenue or income


    +   **Expenses** ; costs incurred in the operation of the firm such as material,
    labor and all the other expenses


    +   **Owner Draws** ; money withdrawn from the company and paid to the owners,
    as profits withdrawn, dividends, bonuses or in any other form.


    One can see that the expanded version better describes the operation of the firm
    in carrying out business, whether that business is retail sales, manufacturing,
    mining, or any other activity designed to generate revenues and profits. Even
    hospitals and other service businesses follow this same expanded model.'
  merge: -1
  pgno: 107
- img_proc: true
  md: 'Revenues are generated, expenses incurred and paid, and profits distributed.
    Of course, this appears very much different for all of the various business models
    under which firms operate. This expanded equation describes the business models
    for large, international firms that are publicly owned by stockholders, all the
    way down to the small privately owned construction firms, farms or service business
    owned and operated by self-employed entrepreneurs. Every organization can be seen
    to operate exactly by this accounting equation.


    For example, Riverside Machine Company, illustrated in Chapter 1, The Martin Company
    illustrated in Chapters 3, 4 and 5 and all the other firms in whatever businesses
    one can imagine, all follow this universal accounting equation. It truly is universal
    in its application, for companies and organizations of all sizes, in all industries,
    in all countries in the world. This is truly the fundamental equation of accounting.


    And, all accounting and accountants, in all these businesses must follow the earlier
    discussed GAAP, generally accepted accounting principles establish by authorities
    and certification bodies.


    Banks, investment firms, investment fund managers, and everyone else in all market
    sectors are subject to this universal fundamental equation. We will see this in
    the subsequent chapters as we describe the various accounting professionals, their
    functions and responsibilities in all aspects of the accounting world.'
  merge: -1
  pgno: 108
