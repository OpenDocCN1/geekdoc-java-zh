    5. Schedule pay periods to coordinate withholding for IRS.

    6. Create a compensation plan for holiday, vacation and leave.

    7. Choose an in-house or external service for administration payroll

    8. Decide who will manage your payroll system.

    9. Know which records must stay on file and for how long.


    +   10. Report payroll taxes. Filing and withholding taxes may seem stressful.
    It does not need to be. In fact, the IRS maintains an Employer’s Tax Guide. This
    can be found on the IRS website at [www.irs.gov.](https://www.irs.gov). Search
    for Publication 15 (2017), (Circular E), Employer’s Tax Guide.


    # Get an Employer Identification Number (EIN)


    If your business is about to hire employees as it is expanding, then you will
    need an Employer Identification Number (EIN). This number is a nine-digit number
    and will look like this: 12-3456789. It will be used for identifying the tax account
    of the employer. There are certain types of businesses that need an EIN who do
    not have employees. For this you can research the Employer’s Tax Guide to find
    out if you need one or not.


    There are two ways to apply for an EIN. The quickest is to apply through the IRS
