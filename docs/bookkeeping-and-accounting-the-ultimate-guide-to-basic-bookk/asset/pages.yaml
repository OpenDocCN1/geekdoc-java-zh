  md: 'Making these adjustments are very important. When looking at which adjustments
    need to be made first, you need to gather and compile a spreadsheet that will
    allow for your trial balance entries as well as the adjustments.


    Keep in mind that these adjustments are for correcting errors in the initial trial
    balance so that everything will come to balance. This form for the adjustments
    is an internal form but will be used for helping compile the financial statements.
    Now that automated systems like Xero and QuickBooks are used, the trial balance
    worksheet is not often practiced. However, it is still a good source document.
    This is in part due to the automated systems creating the reports for you.


    Here is an example of what the worksheet may look like:


