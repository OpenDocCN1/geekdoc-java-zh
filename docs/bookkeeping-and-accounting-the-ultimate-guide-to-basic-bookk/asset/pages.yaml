  md: 'Like most small business, you will eventually have employees that you need
    to pay. With QuickBooks Online, you can add this feature to any of the top three
    tiers for an additional monthly cost.


    The best part is QuickBooks Online is very user friendly and easy to use. This
    software also has a good timesaving feature that you need in any good accounting
    and bookkeeping program. It will keep track of due dates for invoices, sync your
    business bank account, track your credit card transactions, and so much more.
    This allows you to focus more time on the business while maintaining accurate
    bookkeeping throughout your business and giving you a great outlook of the financials
    of the business. Another good timesaving feature that puts QuickBooks Online on
    top is that you can send out invoices to customers, allowing them to pay online
    at a click of a button.


    With any application, things tend to go wrong with the program itself. That is
    why QuickBooks Online offers both phone and chat support. You can access this
    from the company website making it easier and quicker to get issues resolved and
    you up and running without missing a sale.


    QuickBooks Online account is approved. This means that no matter what your needs
    are you can give your accountant access to your books. Remember, that your account
    will not take up a spot in your users that you give access to.


    Like all programs there are some limitations, although with QuickBooks Online
    it seems like the sky is the limit. The limitations really lay within the mobile
    apps. Here are the things you can do with the mobile apps:


    +   - Send Invoices

    - Reconcile Transactions

    - Take photos of receipts and attach to expenses

    - View customer information and add new customers

    - View dashboard data, such as account balance, profit and loss reports, and open
    and past due invoices.


    After looking through what the app can do, if you feel like that works perfect
    then QuickBooks Online is the perfect software for you. However, if you'
  merge: -1
  pgno: 20
- img_proc: true
  md: 'prefer doing most of your accounting and bookkeeping through your phone, then
    there is another accounting and bookkeeping software choice for you.


    # Xero


    If you would rather use a PC or a Mac, Xero has a lot to offer. Xero is by far
    the best accounting and bookkeeping software for Mac users. It is easy to use
    and learn. What I like about Xero are the videos. Everything you do in Xero will
    have a video that will help you learn the software.


    Xero also has comparable prices and is listed into three different plans. The
    starter plan is $9 per month. It does have some limitations. The features of the
    starter plan are:


    +   - Unlimited Users

    - Limit to Five Invoices per month

    - Limit to Five Bills per month

    - Limit to 20 Transaction Reconciliations per month


    The standard plan is $30 per month. This includes:


    +   - Unlimited Users

    - Unlimited Invoices

    - Unlimited Bills

    - Unlimited Transaction Reconciliations

    - Payroll for up to Five Employees


    The premium plan is $70 per month. Which includes:


    +   - Unlimited Users

    - Unlimited Invoices

    - Unlimited Bills

    - Unlimited Transaction Reconciliations

    - Payroll for up to 10 Employees. Note: this can be adjusted to support more employees
    if needed.

    - Supports Multiple Currencies. Note: this is a great feature if you do international
    business.


    The best part is that there are not any long-term contracts for using Xero. That
    means you can change at any time without having additional fees.'
  merge: -1
  pgno: 21
- img_proc: true
  md: 'There is also a free 30-day trial to let you try and find out if it will be
    the best for your business.


    Much like QuickBooks Online, Xero also has many timesaving features. You can send
    invoices electronically, which also allows for your customers to pay online easily.
    You can also turn quotes and estimates into invoices with only a few clicks. This
    allows for to give a customer a quote and if you agree to go with your services
    you can turn that quote into an invoice and get paid.


    With your business bank account linked to Xero, the system will allow you to set
    scheduled payments and manually pay the bills. This helps save time and ensures
    that all bills are paid on time and you do not worry about past-dues and late
    fees.


