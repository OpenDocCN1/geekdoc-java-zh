  md: '# Chapter 8 – Jobs in Accounting: Financial Accounting


    Most organizations and business firms have someone in charge of the financial
    office. Frequently this is called the Comptroller''s Office (pronounced controller)
    and is staffed with people educated and trained in accounting. The head of the
    office is frequently a CPA and directs the staff in her office as well as providing
    advice and counsel to the top management. This position is usually that one reports
    directly to the owner or owners of the firm, or to the CEO (Chief Executive Officer)
    and is often referred to as the CFO or Financial Officer.


    In the private sector, these jobs are usually challenging and of course, vital
    to the health of the operation. One such member of management is George Wilson.
    He is the CFO for a medium sized firm, Catch of the Day Restaurants, a chain of
    restaurants, specializing in seafood meals.


    George is the head of controllers office and reports on the firm''s financial
    position. He uses several important indicators, in addition to the periodic income
    statements. Balance sheets are updated annually since they tend to change more
    slowly than other reports. Here are two of the important measures, expressed as
    ratios.


    Current Ratio is a comparison of how well the firm is prepared to meet its current
    obligations, and is expressed as the ratio of current assets to current liabilities.


    | Current Ratio |

    | Current Assets/Current Liabilities |


    If an organization finds itself with a current ratio of less than unity, that
    means it is at risk of being illiquid to the extent that it may become bankrupt.
    It does not have the means to pay its current obligations. These may be payable
    to suppliers, wages and salaries to employees or taxes due to the government.
    None of these can be sustained for long periods of time.'
  merge: -1
  pgno: 112
- img_proc: true
  md: 'The firm''s accountants may suggest strategies such as taking on long term
    debt to reduce current short term debt by means of paying off important payables
    but there is likely to be a serious underlying problems that is causing the organization
    to not be able to generate revenue with its assets.


    If we look at the Income Statement for Martin Company, we can see that the Current
    Ratio is $31,191/$14,685 or 2.13. This indicates Martin Company has more than
    enough assets to meet its current liabilities, even if it encounters difficulties
    in generating revenue for a short period of time.


    An example of a situation in which a firm might find jeopardy is the event of
    a serious business interruption like a flood or fire. The liabilities will not
    go just because the firm cannot operate but the current assets will shrink rapidly
    since there will be no revenue for a period of time. If the firm is able to get
    back into operation quickly, they might avert disaster. This is an instance recommendation
    by the accounting department.


    Another important ratio measures the efficiency of the firm, that is, how well
    it is doing converting its resources into revenue and is calculated by the ratio
    between Operating Expenses and Operating Revenue, both of which come from the
    Income Statement. This is called the Operating Ratio.


    Operating Ratio


    For the Martin Company, the Operating Ratio is $26,915/$34,652 or 0.78. This number
    must always be less than 1 and the smaller, the better. There are two important
    ways to analyze this number. First, is the current level compared with the prior
    periods? The second is to compare, wherever possible, to similar ratios for other
    companies in the same industry. As standalone ratios, they do not mean much. However,
    for example, when the Operating Ratio gets close to 1.0 or even exceeds 1.0, the
    firm is in serious trouble because its operating expenses exceed its operating
    revenue. The Current Ratio should always be greater than 1.0, meaning that the
    firm can meet its current obligations and the Operating Ratio must be significantly
    less than 1.'
