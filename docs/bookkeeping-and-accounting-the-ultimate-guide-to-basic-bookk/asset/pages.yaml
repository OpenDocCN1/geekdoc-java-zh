  md: '# Chapter 15 - Time Value of Money - Present Value Concepts


    One very fundamental concept in accounting, personal life and business in general
    is that of the Time Value of Money. We all would prefer money today rather than
    the promise of money in the future. Businesses, however, do not always have the
    cash available to make critical investments when needed. They may need to borrow
    the funds in order to make the investment, which is intended to increase the revenue
    or decrease costs.


    We all recognize that there is a relationship between time and the value of money.
    That relationship is mathematically modeled with the concept of present value.
    This is not a difficult concept to understand and compute but for complex cases,
    the manual computation is time consuming and can lead to errors. Fortunately,
    computer spreadsheet programs can do all of the computations for us. We just need
    to properly understand and describe the problem in correct terms.


    The basic notion of Present Value is that the value of something sometime in the
    future is not as great as its value today. Economists, engineers and accountants
    model this difference mathematically through the various equations to calculate
    present value. For example, an investment in a new machine may reduce manufacturing
    costs, but the firm must pay for the new machine. It will generate a series of
    annual cost savings that have some present value. In order to evaluate this project,
    we use Present Value mathematics. (See the example with Modern Manufacturing below.)


    To accomplish that, we will introduce some new definitions. For several of these,
    we will provide illustrations.


    **Present Value (P);** the value of an asset now, today or the amount of investment
    proposed.


    The present value of a $100 bill is $100. The present value of a new machine proposed
    to be purchased is the amount of money to acquire, deliver and install the machine.


    **Future Value (F);** the value of an asset at some selected time in the future,
    which may be expressed in days, months or even years. If we have some positive
    interest rate, this will be larger than the present value.'
  merge: -1
  pgno: 129
- img_proc: true
  md: 'An amount of money deposited in a Certificate of Deposit at 5% annual interest
    will have a future value larger than the original deposit depending upon the amount
    deposited and the number of years left on deposit. Thus, for an amount of $1000
    at 5% annual interest will be worth $1050 at the end of one year.


    **Interest Rate (i);** the rate, which is associated with the passage of time
    for a specified asset. This may be for example, the interest charged on a credit
    card by the card issuer or the rate paid by an investment like a certificate of
    deposit. **The interest rate is the relationship between time and money .


    **Number of Time Periods (n);** the number of periods being considered, for example
    24 months, 5 years, and so forth. The time period must agree with the interest
    rate. If the period is 1 month, the interest rate must be expressed as rate per
    month. This is extremely important since in the computation, if this rule is not
    followed, the output will be false.


    **Periodic Payment (A);** for a case in which the payments are made periodically,
    this represents the number of payments to be made. These may be monthly, annually
    or whatever is consistent with n and i, or the periodic savings resulting from
    an investment.


    **Net Present Value (NPV);** this is the present value of an investment made with
    periodic returns (A) at a specified interest rate and number of periods minus
    the amount of the investment to acquire the asset.


    Here are some examples of the decisions made based on the Present Value model.


    Modern Manufacturing has the opportunity to install automation that will have
    the effect of reducing labor costs by $25,000 per year. This amount was determined
    by the engineers and the CFO is confident it is accurate. The automation will
    cost $55,000 to acquire, install and launch. They expect it to last at least 8
    years. To evaluate this project, we need to determine the net present value (NPV)
    for this project. If the NPV is positive, we will save that accounts of money
    over the eight-year period. Remember that NPV accounts for the investment as well
    as the resulting savings.


    We regard the P value for the project to be $55,000, with $25,000 as the value
    for A, the periodic return and the firm uses an interest rate of 14% to'
  merge: -1
  pgno: 130
- img_proc: true
  md: 'evaluate these projects.


    We enter an Excel® spreadsheet with those values and determine the i = NPV to
    be $57,082. That is determined by accounting for the i = 0.14, 8 annual savings
    of $25,000 each and the initial investment of $55,000, using an Excel® spreadsheet.
    The Present Value of this savings stream is $112,082. By subtracting the initial
    investment of $55,000, we arrive at the Net Present Value, $57,082.


    Therefore, the decision to make the investment is a good one. However, this decision
    must be compared with any other projects that are competing for the organization''s
    capital funds, and any other considerations not included such as effects on productivity.


    This is important because very if any organizations have sufficient capital resources
    to take advantage of all their opportunities. Present value considerations are
    an important tool for organizations to decide how to deploy scarce assets.


    # Cost of Capital


    As we have seen in the three important documents; i.e. the Balance Sheet, the
    Income Statement and the Cash Flow Statement, we need to invest money to improve
    and expand our business. We may borrow money from external lenders in the form
    of loans, mortgages or bonds. We will have to pay for those funds at some agreed
    upon interest rate.


    Alternatively, we could sell off the firm to raise capital. When we do that, our
    investors will expect a return for letting us use their money, so we may have
    to pay dividends to the stockholders.


    Our third alternative is to have the owners invest more money, but again, our
    owners will expect a return on their investment. Money is never free, unless we
    generate it through profits, and we may need to invest in assets in order to generate
    more profits.


    Cost of Capital is the cost that the firm has to pay to get the capital it uses.
    This applies to equity and debt capital and includes interest, dividends and payments
    for preferred stocks as well as returns to owners.


    Determining the cost of these alternatives is important and we term that cost
    the "Cost of Capital." Mathematically, cost of capital is the weighted average'
  merge: -1
  pgno: 131
- img_proc: true
  md: 'of all our sources of funds, from owners, lenders or stockholders.


    # Example using Modern Manufacturing


    Modern Manufacturing is a publicly owned company whose stock is traded on the
    New York Stock Exchange. The stock is currently valued at $22. Modern pays an
    annual dividend of $1.50 for a rate of 3.3 percent at the current share price.
    There are currently 50,000 shares outstanding.


    They have an outstanding long-term loan of $4,000,000 at an interest rate of 8%
    and for new investments, they are paying 9.5% interest. They do not plan to borrow
    more at this time.


    The founders of the firm hold Preferred Stock shares, which pay a dividend of
    6%, and there are 45,000 shares outstanding at a current price of $75.


    | Source | Total Amount ($000''s) | Percentage | Annual Cost ($000''s) |

    |---|---|---||}{

    | Common Stock | 1,100 | 3.3% | 36.3 |

    | Preferred Stock | 1,650 | 6% | 99. |

    | Loans | 4,000 | 8% | 320. |

    | Total Funding | 6,750 | | 455.3 |

    | Weighted Average Cost of Capital | | 6.75% | |


    This analysis tells us that the weighted average cost of capital is 6.75%. That
    means that any discretionary investment must pay back at least that amount. In
    order to provide a floor for new capital investments the management has set a
    minimum rate or hurdle rate of 14%. Any proposed capital project must be discounted
    at the hurdle rate. Modern Manufacturing has chosen 14% as their minimum IRR.
    Any project which does not meet or exceed this rate will not be approved.


    # Internal Rate of Return'
  merge: -1
  pgno: 132
- img_proc: true
  md: 'Another way to look at these decisions is to determine the discount rate which
    makes the NPV equal to zero. This is called the "Internal Rate of Return" or IRR.
    This rate must be greater than the cost of capital and the higher the better.
    IRR is commonly used to compare projects that are competing for the scarce capital
    funds. Internal rate of return computations are not simple but fortunately, spreadsheet
    programs can compute it directly. IRR is presently the means to evaluate capital
    projects. However, this is true for discretionary investments. If an investment
    must be made because of some situation for which the firm has no choice, such
    as regulatory compliance or safety issues, the firm will work hard to engineer
    the least expensive solution and will accept whatever IRR is determined.


    # Payback Period


    Payback Period is another, simpler way to look at investments. It ignores the
    time value cost. It just looks at the investment, and determines how long it will
    take to pay back the investment.


    Using the example above for Modern Manufacturing, the total amount to be saved
    over the 8 years is $25,000 or $200,000. Based on an investment of $55,000, the
    investment will be paid back in 3.64 years. We can see that in terms of present
    value, the payback method overstates the present value of the investment by nearly
    $90,000. ($200,000 - 112,082 = $87918.) This clearly demonstrates the importance
    of considering present value considerations in making decisions.


    # Conclusions


    Our objective in this book was to introduce readers who are not accountants to
    the fundamental concepts and vocabulary of the world of accounting.


    We have explained that the product of accounting is information. Information is
    needed by owners, managers, supervisors, employees, investors and all the other
    stakeholders. The various regulatory and taxing authorities are important members
    of this group of stakeholders.


    A number of accounting positions are described along with the education and training
    required for them.'
