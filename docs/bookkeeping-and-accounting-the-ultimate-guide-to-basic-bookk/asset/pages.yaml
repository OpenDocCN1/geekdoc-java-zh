    # Find out whether you need state or local tax IDs


    Your state may not require you to pay state taxes. There are seven states that
    do not have income taxes and an additional two who only impose tax if the income
    is from dividends.


    The best way to know if you need a state tax ID is by visiting your website.


    # Decide if you want an independent contractor or an employee


    A good question is if you are going to hire an independent contractor or an employee.
    This could determine how the taxes are withheld from the payroll.


    Contractors will be operating under a different business name and will invoice
    you for the work. Keep in mind, there are times when a contractor can qualify
    as an employee in a legal sense. If you choose to hire contractors, you should
