    # # Operating Activities


    For us to determine the cash flows from operating activities it is necessary to
    calculate the cash receipts from sales, cash payments for inventory purchases,
    and cash payments for operating expenses.


    The following formulas can be used to calculate the cash receipts.


    +   * Cash receipts = Net sales + Decrease in accounts receivable

    * Cash receipts = Net sales – Increase in accounts receivable


    Next you will need to also determine the cash payments for inventory purchases.
    You should start calculating the amount of purchases for the year using one of
    these formulas.


    +   * Purchases = Cost of goods sold + Increase in inventory

    * Purchases = Cost of goods sold – Decrease in inventory


    After determining the cash payment for inventory, you will now need to determine
    how many of these purchases were actually paid in cash with one'
  merge: -1
  pgno: 201
- img_proc: true
  md: 'of the following formulas.


    +   - Cash payments for inventory purchases = Purchases – Increase in accounts
    payable


    +   - Cash payments for inventory purchases = Purchases + Decrease in accounts
    payable


    Finally, we need to determine how much of the operating expenses are cash related.
    We need to deduct any noncash outflow from the amount of the operating expenses.
    On the income statement you will see a tax expense. This extra step will be included
    in the last step. Use one of the following formulas to determine this amount.


    +   - Cash payment for income taxes = Income tax expense + Decrease in income
    tax payable


    +   - Cash payment for income taxes = Income tax expense – Increase in income
    tax payable


    # Investing Activities


    The primary activities in this section include cash inflows and outflows for the
    major fixed assets, for example, land and equipment. This will also include other
    types such as bonds or stock investments.


    # Financing Activities


    This is the final section and includes all cash flows that involve borrowing money.
    This also includes dividend payments and selling stock for cash.


