  md: 'Current Liabilities Current Liabilities are those which must be paid within
    a year or less. Accounts payable are the bills we have received but not yet paid,
    for anything we have purchased. Raw materials, purchased parts, shipping invoices,
    office supplies, lease payments for things like a copy machine, all fall under
    the umbrella of Current Liabilities.


    Salaries and Benefits Payable; are just that. We do not pay employees every day.
    We must show on the balance sheet the amounts that have been accrued and will
