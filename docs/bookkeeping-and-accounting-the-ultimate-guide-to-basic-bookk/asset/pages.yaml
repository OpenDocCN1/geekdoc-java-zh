    is not used up, destroyed, or stolen. On the balance sheet it will reflect the
    cost of the land. With that it will also include incidental cost such as surveys,
    insurance, legal fees, and property taxes.


    Buildings, like land, are expensive and a valuable asset. They indirectly produce
    revenue. The cost of acquiring buildings usually includes insurance, closing costs,
    taxes, and the purchase price. They do not last forever. Therefore, they have
    a finite lifespan.


    For all business your equipment is essential. Much like buildings indirectly produce
    revenue. The cost of equipment generally includes the purchase price, sales tax,
    and delivery fees.


    While looking at the long-term assets you need to remember that any asset that
    is purchased and lasts more than one year is a capital expenditure. These expenditures
    are recorded on the balance sheet. Usually they include large purchases that bring
    a lot of value to your company or business. These will not be listed in expenses
    because they will not be used up in current accounting period.


    So we talked the bigger assets but what about the smaller ones such as a coffee
    maker, trashcan, or a light bulb? These are considered revenue expenditures. These
    will last several accounting periods. Even though $500 is a common limit for the
    maximum cost of this type of expenditure it can vary based on the company or business.
    These assets are not recorded in the balance sheet. They are usually listed as
    an expense to make it easy to record them.


    # Depreciation


    With long-term assets you will have many assets that will depreciate over time.
    Land is one thing that is the exception to depreciation. Mainly'
  merge: -1
