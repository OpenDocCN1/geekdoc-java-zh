    take all the risks, and enjoy all the gains of the business. The main advantage
    for this type of business is how simple it is. However, like everything when you
    have advantages there are just as many disadvantages. One of the main disadvantages
    is the owner''s unlimited liability; that is, you are responsible for all the
    actions of the business, both good and bad. Which means this will put all the
