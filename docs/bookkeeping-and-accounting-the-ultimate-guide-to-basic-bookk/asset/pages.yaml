  md: 'Total revenue : $13,400


    EXPENSES

    Office supplies expense: $2,000

    Salaries expense: $2,120

    Rent expense: $1,000

    Total expenses : $5,120


    Net income : $8,800


    # Statement of Retained Earnings


    Once the income statement is prepared you will want to prepare a statement of
    retained earnings. This statement will show where your company is at the end of
    the given month. As the retained earnings are carried over from the previous month
    then we will add the earnings for the current month so that we will see where
    we stand at the end of the month. In turn these earnings will be carried over
    the next month’s retained earnings statement.


    Retained Earnings Statement

    ABC Financial Company, Inc.

    For the Month Ending July 31


    Retained earnings as of July 1: $2,450

    Net income: $8,800

    Total : $11,250

    Less dividends: ($400)


    Retained earnings ending balance : $10,850


    As you can see the income statement provides some valuable information. This is
    where you will be to get a good look at what you are bringing in as a company
    after all the expenses have been paid and accounted for.


    # The Balance Sheet


    The final document to prepare from the trial is the balance sheet. This is a list
    of all your assets, liabilities, and owner’s equity accounts, as well as the balances
    of these accounts on a specific date. The easiest way to remember this is that
    it is simply a detailed version of the accounting equation.'
