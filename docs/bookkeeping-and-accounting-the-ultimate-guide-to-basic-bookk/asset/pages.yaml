  md: '+   - Non-Debts that are more than one year


    # Owner’s Equity


    This is the money that is invested in the business. The retained earnings for
    the income statement will also be transferred into the owner’s equity at the end
    of the fiscal year. The owner’s equity shows the net worth of your business. Types
    of accounts listed in the owner’s equity:


    +   - Capital – Money invested or earned by the business

    - Drawing – Money that is withdrawn from the business


    # The Income Statement


    To a business owner the income statement may look scary. However, it does not
    need to be. The income statement takes a closer look at the revenue or sales and
    the expenses of the business. This is usually done on a quarterly and annually
    basis throughout the fiscal year.


    You may hear terms such as profits, earnings, and income when talking about the
    income statement. Keep in mind, they all mean the same thing.


    There are two basic formats that you will use, the multi-step and the single-step
    formats. Here are the steps for each format:


    +   - Multi-Step Format

    - Net Sales

    - Cost of Sales

    - Gross Income*

    - Selling, General and Administrative Expenses (SG&A)

    - Operating Income*

    - Other Income & Expenses

    - Pretax Income*

    - Taxes

    - Net Income (after tax)*

    - Single-Step Format

    - Net Sales

    - Materials and Production'
