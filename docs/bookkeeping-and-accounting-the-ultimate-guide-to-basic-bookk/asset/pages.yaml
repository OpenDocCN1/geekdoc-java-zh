  md: '4. The initial cost of an asset was recorded on the balance sheet when it was
    purchased. Therefore, the amount of depreciation must be listed as an expense
    over the span of life used for that asset.


    Land is one of the most common and expensive fixed assets. It will include everything
    on ground (for example grass, fences, and trees), over the ground (for example
    air, space), and under the ground (such as minerals). It is supposed to have the
    longest lifespan or even indefinite. This is because the only thing that may shorten
