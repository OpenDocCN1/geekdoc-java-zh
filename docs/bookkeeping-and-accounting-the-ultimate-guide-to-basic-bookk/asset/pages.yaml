    # # Closing the Books


    When closing your books at the end of a fiscal year, there are 4 areas that will
    need to be closed. These areas are temporary accounts and should be zeroed out
    at the end of each fiscal year.


    First, create an Income Summary account. This is considered a holding area.


    # # Closing the Revenue Accounts


    The first area that needs to be addressed are the revenue accounts. You will either
    Debit or Credit this account to close it and have a zero balance. Then you will
    Debit or Credit the Income Summary account to add that balance to the account.
    Remember if you Debit or Credit one account you must do the opposite for the other
    account to keep the books balanced.


    # # Closing the Expense Accounts


    The second set of accounts are the expense accounts. You will do the same with
    these accounts as you did with the Revenue accounts. You must close out all expense
    accounts.


    # # Balancing the Income Summary


    By name you should have an increase in the income summary for the revenue and
    a decrease for each of the expenses. Keep in mind that if the expenses are more
    than the revenue then it will be a negative number and considered a loss. However,
    if the revenue is more than the expenses then it is a gain or profit for that
    year.


    # # Closing the Income Summary


    The last step in closing the book is to Debit or Credit the income summary account
    and do the same to the Retained Earnings Account, leaving a zero balance in the
    income summary account.'
  merge: -1
  pgno: 15
