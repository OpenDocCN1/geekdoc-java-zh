  md: '# Introduction


    This book is intended for people who want to know something about the fundamentals
    of financial accounting without becoming an accountant. Many people are in this
    position; small business owners, employers, employees, business owners, stockholders,
    investors, and many, many more. Most of these folks do not need a deep understanding
    of accounting, they just need to learn what accounting is and how they should
    be using it. Just as important, they need to understand what accountants are talking
    about in their reports. They must learn the vocabulary and the most important
    terms. The product of accounting is information, important information for that
    wide range of stakeholders.


    We will examine this subject in some detail, discussing accounting fundamentals,
    the various areas where accounting professionals work and the information they
    produce. We will also examine the measures and ratios that accountants use to
    analyze an organization''s performance and the important relationship between
    time and money. The fact that information is the product of accounting will remain
    foremost in this book.'
  merge: -1
  pgno: 87
- img_proc: true
  md: '# Chapter 1 - Accounting is Different From Bookkeeping


    Accounting is not bookkeeping. Bookkeeping concentrates on recording the organization''s
    financial activities, whatever the business in which they are engaged. Maybe that
    is retail sales, home construction or manufacturing. No matter what business activity
    is taking place, someone must keep track of the transactions; selling, buying,
    repairing equipment, everything of significance. And in fact, even individuals
    must learn about accounting and must do certain bookkeeping tasks for their own
    personal finances, like balancing their checkbook and establishing personal budgets.


    If the business is engaged in retail sales, bookkeepers record every sale, every
    purchase of inventory and every employee''s pay. That is bookkeeping.


    Accountants take this information and analyze, summarize and report the results.
    Remember, the product of accounting is information. This information is vital
    to management for their operating and investment decisions. Management must know
    how much money the business has, how much inventory it holds, how many employees
    are retained and how much they are being paid.


    The viewpoint of a bookkeeper is the details. The viewpoint of an accountant is
    much broader and at a higher level. The accountant must be able to advise management
    on many decisions; how many more employees can be hired, what taxes are due and
    how to minimize them, analyzing investment decisions, and so forth.


    Let''s look at an example. Riverside Machine Company is a small manufacturer of
    components for the automobile industry. Their clients include almost all of the
    automobile manufacturers, and they are very busy when the industry is thriving.


    The owners of Riverside are concerned about reducing manufacturing costs for a
    certain type of part that requires a lot of machining on several different types
    of machines. The engineers have determined that they can increase the rate of
    production by installing robots to load and unload the machines and transfer parts
    between them. The company has several robotic systems in operation now and is
    confident of their ability to incorporate these new'
  merge: -1
  pgno: 88
- img_proc: true
  md: 'robots. Currently, there is a serious backlog of work for these machines and
    improving the workflow would allow faster delivery with less overtime and not
    needing to work weekends to maintain production.


    The engineers have determined all the necessary information related to this investment
    in terms of robot costs, tools needed by the robots, increases in production rate
    and effect on delivery time. They then sit down with the accounting experts to
    compute the improvements in cost, reductions in labor costs, shortening of delivery
    time and so forth. The accountant uses all of this information to compute the
    effects on the firm''s financial performance and profitability.


    In most companies, the accountants compute a value for "Internal Rate of Return"
    This rate of return serves as a threshold for new projects. It becomes one of
    the considerations used by management to decide whether or not to make the investment,
    in this case, the new robots. Other considerations of course include delivery
    improvements, customer satisfaction, product quality and several others. That
    is a proper role for the accountant working with the engineers.


    In addition to being a source of reliable financial information on these kinds
    of decisions, the accounting department also acts as what can be described as
    a "Scorekeeper", by monitoring costs and revenues, leading to profitability for
    the firm. This information is reported to management on a regular basis to help
    guide ongoing management decisions. The accountants cannot do much all to influence
    the profitability of the firm directly, but their role is to report findings to
    management for them to make decisions.


    The accounting function also leads the efforts at budgeting and budget reporting.
    These are mere examples of the accounting product of lformation. These reports
    are available in varying levels of detail for publicly owned companies and non-profit
    organizations. Privately owned companies are not required to publish these reports,
    except for those required by the government, regulatory and taxing authorities.


    In their role as providers of information, they are often called upon for informed
    recommendations to help management decision making.'
