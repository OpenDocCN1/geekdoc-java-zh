  md: '# Chapter 6 – Making Adjusting Entries


    As we go along with making our transactions you will find that you will need to
    make some adjustment entries. In the accrual-based accounting you will make adjusting
    entries to make sure that the correct amounts are recorded for the revenue and
    expense transactions.


    # Prepaid Expense


    The first of these entries will be prepaid expenses. This is a cost that is paid
    before it has actually happened. They provide a short-term benefit to the company
    and so can be considered as a current asset. For example, if you pay your rent
    for eight months you would have the benefit of needing to pay your rent for that
    time. An adjustment would be made each month to show that the rent has incurred
    for that time. Every time a part of the rent has incurred an adjustment will be
    made to prepaid expenses.


    # Depreciation Expense


    The second adjustment entry will be depreciation expense. This is the allocation
    of the cost of an asset as it is used over a period of time. Say you bought a
    new computer for your company. You will take the market value of that computer
    and figure out the lifespan of the computer. From there you can calculate the
    depreciation of the computer and make that adjustment under this expense.


    One of the most common and even the easiest depreciation methods is the straight-line
    method. This is a system for calculating annual depreciation by subtracting an
    asset''s salvage value from its cost and dividing by its lifespan. This method
    is calculated based off every year of use.


    +   - Depreciation = (Cost – Salvage value) / Lifespan


    # Unearned Revenue


    The third adjustment entry is called unearned revenue. This can also be called
    deferred revenue because the payment has been received for services that have
    not been provided. Unearned revenue is considered a liability. The adjustment
    is usually made when the services are provided. This can be monthly, quarterly,
    or annually.'
  merge: -1
  pgno: 156
- img_proc: true
  md: '# Accrued Expense


    The fourth type is accrued expense. This is when the cost is incurred during one
    month, quarter, or annual period but yet it is paid for in the next period.


    # Accrued Revenue


    Finally, the last adjustment type is accrued revenue. This is much like the accrued
    expense. It is when the revenue is earned during one month, quarter, or annual
    period but yet the revenue is received in the next period. This adjustment will
    affect both revenue and assets. When revenue is accrued it creates the asset of
    a receivable.


    Each of these adjustments must be figured into the company''s trial balance. With
    that information you will prepare an adjusted trial balance. This will show a
    list of all accounts after all needed adjustments have been made so it will reflect
    the revenues and expenses that were incurred for a specific date.'
  merge: -1
  pgno: 157
- img_proc: true
  md: '# Chapter 7 – Completing the Accounting Cycle


    As you go through the accounting cycle it is important to prepare and frequently
    update a company’s journal, ledger, trial balance, and adjusted trial balance.
    As long as these statements and reports are updated then the company can get a
    clear picture of where the company is at that moment and help allow you to make
    decisions to move forward. These reports are generally done at the end of each
    month, quarterly, or in the annual accounting period. However, they could be done
    at any time to meet the needs of the company.


    At the end of the annual accounting cycle, closing entries are made to reset and
    prepare the books for the next accounting period. The closing entries are the
    income summary, revenue, expenses, gains, losses, and owner’s withdrawals or dividends.


    # The Worksheet


    To help with the closing entries you can pull all your information from the journal,
    ledger, trial balance, and adjustment trial balance and put it into a worksheet.
    It is easy to make your closing entries when you have all your information consolidated
    into one worksheet. However, you may think it is too much work to consolidate
    the information. It is not necessary. The worksheet is simply a tool to help with
    resetting and preparing your closing entries.


    The worksheet is divided into four sets of debits and credits. On the left side
    is a list of your accounts from the chart of accounts. Next will be the debits
    and credits for the trial balance, adjusting entries, income statement, and balance
    sheet from left to right. At the bottom of the columns will be the totals. The
    total debits should equal the total credits.


    The total for the income statement columns represents net income. The balance
    sheet’s debit column represents assets. The equivalent of its show liabilities
    plus owner’s equity.


    After all the transactions are posted to the ledger and a trial balance prepared
    then you can start preparing the worksheet.'
  merge: -1
  pgno: 158
- img_proc: true
  md: 'Start listing each account in the left column of the worksheet. You will find
    this information in the chart of accounts.


    Next, see the general ledger to find the trial balance figures of each account.
    Transfer this information to the debit and credit columns right after the account
    names. The balance will summarize all of the transactions for the time period
    before the adjusting entries are made. Remember if the account has a debit normal
    balance or a credit normal balance.


    Next, find the adjusted amounts and enter them in the debit and credit columns
    to the right of the trial balance columns. Each adjustment should have a reference
    to the original adjustment in the ledger. This way if there were mistakes made
    in the adjustments you could find and fix them easily.


    Next, take the adjusted amounts and enter them in the correct income statement
    and balance sheet columns. Always begin from the top and work your way down. Never
    skip around because you might forget one that needed to be recorded and will have
    your worksheet incorrect. Your revenue and expense accounts will be recorded in
    the income statement columns, while your assets, liabilities, and owner’s equity
    accounts will be entered into the balance sheet columns.


    Finally, total all the debits and credits at the bottom of the worksheet. Here
    you will look at the totals of the income statement columns to see the net income
    or loss for that time period. Check the balance sheet totals to find the assets,
    liabilities, and owner’s equity.


    Below is an example of the worksheet.


    # ABC Financial Company, Inc.

    Worksheet

    For the Month Ending July 31'
