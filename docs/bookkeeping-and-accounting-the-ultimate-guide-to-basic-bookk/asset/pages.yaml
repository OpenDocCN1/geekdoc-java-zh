  md: '# Sales Journal


    The subsidiary ledgers can be posted from either the general or special journals.
    Every company has sales. Therefore, one of the most common special journals is
    the sales journal.


    This journal will show all of the credit sales. Each entry will show in the sales
    journal and represent a debit to the customer''s account in the accounts receivable.
    It will also show a credit to the revenue account. Keep in mind that cash receipts
    from those sales are recorded in a different special journal.


    # Cash Receipts Journal


    Remember that in the sales journal the data has on account. These do not include
    cash sales. Those sales are recorded in the cash receipts journal. This special
    account includes three main parts for cash receipt.


    +   1. Customers who paid on account and are now paying cash on their account.
    The cash transaction is recorded here.

    2. Any sales that were made and cash was paid.

    3. Any other sources that the company took in cash.


    Keep in mind that if there is a cash transaction, not on credit, then it will
    be recorded here. Also with this there are three columns that include:


    +   1. Cash—which shows each transaction that involves a cash receipt.

    2. Sales discounts—which if any discount was offered it will be recorded here.

    3. Other—this includes any account that is different from sales discounts.


    Much like the debits the credits also have three columns. They are:


    +   1. Accounts Receivable—this is when a credit payment was included in the accounts
    receivable. Remember to write the name of that account in the details so that
    you know which account was paid.

    2. Sales—this is where you will record all cash sales. It will match what was
    debited to cash.

    3. Other—this is when a credit was to any fund that is incoming and is not from
    either of the other two columns.'
