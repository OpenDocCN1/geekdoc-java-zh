    These are short-term notes.


    The sum of these is the total of Current Liabilities. Most companies borrow some
    amounts of money to pay for things like raw materials inventory in anticipation
    of a seasonal or cyclical increase in sales.


    Long Term Debt is for things like bonds we may have sold to raise capital, bank
    or other financing company loans beyond the next year. Long Term Debt and Current
