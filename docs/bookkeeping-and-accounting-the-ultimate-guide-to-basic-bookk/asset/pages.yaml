  md: 'When keeping all your receipts, it will help reduce the headaches of tax time.
    If any of your items are tax deductible, you will need these receipts. Therefore,
    you should highlight the date and make notes about the reason for the expense.
    If you photocopy the receipt you will have room to make all the notes on the page
    with the receipt.


    # ### Tip 3: Collect Applicable Taxes


    I cannot stress this. Taxes need to be taken out at the time of the sale or when
    payroll is generated. Just like with the receipts, the longer you go between the
    transactions, the more chances for errors. Be sure to take care of the taxes when
    they occur.


    You need to collect or apply taxes as soon as they occur, such as when a sale
    is made or payroll is generated. This will ensure:


    +   1. Your business is not liable for a lump sum of taxes at the end of the year,
    and 2. Your business will not incur penalties due to delayed tax payments. That''s
    right. If the taxes are delayed after they incur, then the IRS will charge you
    a late penalty.


    # ### Tip 4: Do Accurate Invoicing


    Even though invoices are to let your clients know when to make payments, there
    is much more to this, it is than that. An invoice is a record of a transaction.
    Because of this, it is important that the information is accurate and complete.
    There is a difference between an invoice and a receipt. An invoice is what you
    will give to your clients letting them know how much and when to make payments
    to your business. You also consider these as future inflows of cash. Receipts
    are your business expenses, or the outflows of cash.


    # ### Tip 5: Get Donation and Contribution Receipts


    There are tax benefits in donating to outside organizations, although to take
    advantage of these tax benefits you will need to get a receipt for verification
    of the donation. Each receipt should have how much the donation is worth.


    There are some donations that require more than a check to ensure their validity.
    If the donation is over a specific amount, then a receipt is required.'
