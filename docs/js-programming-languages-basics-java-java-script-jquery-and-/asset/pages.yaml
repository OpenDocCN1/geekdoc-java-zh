    \ precise moment when something happens.\n\nExamples:\n\n+   - moving a mouse\
    \ over an element\n- selecting a radio button\n- clicking on an element\n\nThe\
    \ term \"fires fired\" is often used with events. Example: \"The keypress event\
    \ is fired\n\nHere are some common DOM events:\n\n| Mouse Events | Keyboard Events\
    \ | Form Events | Document/Window Events |\n| click | Keypress | submit | load\
    \ |\n| dblclick | Keydown | change | resize |\n| mouseenter | Keyup | focus |\
    \ scroll |\n| mouseleave | | blur | unload |\n\nAs shown above,\nIn jQuery, most\
    \ DOM events have an equivalent jQuery method.\nTo assign a click event to all\
    \ paragraphs on a page, you can do this:\n$(\"p\").click();\n\nThe next step is\
    \ to define what should happen when the event fires. You must pass a function\
