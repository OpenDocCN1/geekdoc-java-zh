  md: "# jQuery Programming Language\n\n437\n\nThis is a paragraph.\n\nThis is another\
    \ paragraph.\n\nInput field: Mickey, Mouse\n\nSet Text | Set HTML | Set Value\n\
    \n* Callback function has two parameters: html() and callback().\n\nAll of the\
    \ three jQuery methods: text(), html(), and val(), also come with a callback function.\
    \ The callback function has two parameters: the index of the current element in\
    \ the list of elements selected and the original (old) value. You then return\
    \ the string you wish to use as the new value from the function.\n\nThe following\
    \ example demonstrates text() and html() with a callback function:\n\nExample\n\
    \n```\n<!DOCTYPE html>\n<html>\n<head>\n<script src=\"https://ajax.googleapis.com/ajax/jquery/3.5.1/jquery.min.js\"\
    ></script>\n<script>\n$(document).ready(function() {\n  $(\\#btn1\").click(function()\
    \ {\n    $(\\#test1\").html(function(i, origText) {\n      return \"Old text:\
    \ \" + origText + \" New text: Hello world! (index: \" + i + \");\";\n    });\n\
    \  });\n$(\\#btn2\").click(function() {\n    $(\\#test2\").html(function(i, origText)\
    \ {\n      return \"Old html: \" + origText + \" New html: Hello <b>world!</b>\
    \ (index: \" + i + \");\";\n    });\n  });\n});\n</script>\n<body>\n<p id=\"test1\"\
    >This is a <b>bold</b></p></p>\n<p id=\"test2\">This is another <b>bold</b></p></p>\n\
    \n<button id=\"btn1\">Show Old/New Text</button>\n<button id=\"btn2\">Show Old/New\
    \ HTML</button>\n</body>\n</html>\n```"
