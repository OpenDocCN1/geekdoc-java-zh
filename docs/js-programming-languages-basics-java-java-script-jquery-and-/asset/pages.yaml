    When a bitwise OR is performed on a pair of bits, it returns 1 if one of the bits
    are 1: One bit example:


    | Operation | Result | Operation | Result |

    |---|---|---|--|

    | 0|0 | 0 | 1111 | 0000 | 1111 |

    | 0|1 | 1 | 1111 | 0001 | 1111 |

    | 1|0 | 1 | 1111 | 0010 | 1111 |

    | 1|1 | 1 | 1111 | 0100 | 1111 |


    When a bitwise XOR is performed on a pair of bits, it returns 1 if the bits are
    different: One bit example:


    | Operation | Result | Operation | Result |

    |---|---|---|--|

    | 0^0 | 0 | 1111 ^ 0000 | 1111 |

    | 0^1 | 1 | 1111 ^ 0001 | 1110 |

    | 1^0 | 1 | 1111 ^ 0010 | 1101 |

    | 1^1 | 0 | 1111 ^ 0100 | 1011 |


    Bitwise AND returns 1 only if both bits are 1:


    | Decimal | Binary |

    |---|--|

    | 5 & 1 | 00000000000000000000000000000101 |

    | 1 | 00000000000000000000000000000001 |

