  md: '# Java Programming Language


    Non-primitive data types are called reference types because they refer to objects.

    The main difference between primitive and non-primitive data types are:


    +   - Primitive types are predefined (already defined) in Java. Non-primitive
    types are created by the programmer and is not defined by Java (except for String).


    +   - Non-primitive types can be used to call methods to perform certain operations,
    while primitive types cannot.


    +   - A primitive type has always a value, while non-primitive types can be null.


    +   - A primitive type starts with a lowercase letter, while non-primitive types
    starts with uppercase letter.


    +   - The size of a primitive type depends on the data type, while non-primitive
    types have all the same size.


    # Java Type Casting


    Type casting is when you assign a value of one primitive data type to another
    type.

    In Java, there are two types of casting:


    +   - Widening Casting (automatically) - converting a smaller type to a larger
    type size byte -> short -> char -> int -> long -> float -> double


    +   - Narrowing Casting (manually) - converting a larger type to a smaller size
    type double -> float -> long -> int -> char -> short -> byte


    Widening casting is done automatically when passing a smaller size type to a larger
    size type:


    Example'
