  md: '# Java Script Programming Language


    << Zero fill left shift shifts left by pushing zeros from the right and let the
    leftmost bits fall off


    >> Signed right shift shifts right by pushing copies of the leftmost bit in from
    the right, and let the rightmost bits fall off


    >>> Zero fill right shift shifts right by pushing zeros in the left, and let the
    rightmost bits fall off


    # Examples


    | Operation | Result | Same as | Result |

    | 5 & 1 | 1 | 0101 & 0001 | 0001 |

    | 5 | 1 | 5 | 0101 | 0001 | 0101 |

    | ~5 | 10 | ~0101 | 1010 |

    | 5 << 1 | 10 | 0101 << 1 | 1010 |

    | 5 ^ 1 | 4 | 0101 ^ 0001 | 0100 |

    | 5 >> 1 | 2 | 0101 >> 1 | 0010 |

    | 5 >>> 1 | 2 | 0101 >>> 1 | 0010 |


    When a bitwise AND is performed on a pair of bits, it returns 1 if both bits are
    1. One bit example:


    | Operation | Result | Operation | Result |

    | 0 & 0 | 0 | 1111 & 0000 | 0000 |

    | 0 & 1 | 0 | 1111 & 0001 | 0001 |

    | 1 & 0 | 0 | 1111 & 0010 | 0010 |

    | 1 & 1 | 1 | 1111 & 0100 | 0100 |'
