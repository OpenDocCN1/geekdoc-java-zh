    # mouseup()


    The mouse() method attaches an event handler function to an HTML element. The
    function is executed, when the left, middle or right mouse button is released,
    while the mouse is over the HTML element:


    Example:


    ```

    <!DOCTYPE html>

    <head>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>

    <script>

    $(document).ready(function() {

    $("p1").mouseup(function() {

    alert("Mouse up over p1!");

    });

    });

    </script>

    </head>

    <body>

    <p id="p1">This is a paragraph.</p>

    </body>

    </html>

    ```


