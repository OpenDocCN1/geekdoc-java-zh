  md: '# Introduction to Book


    Java is an object-oriented, cross platform, multi-purpose programming language
    produced by Sun Microsystems. First released in 1995, it was developed to be a
    machine independent web technology. It was based on C and C++ syntax to make it
    easy for programmers from those communities to learn. Since then, it has earned
    a prominent place in the world of computer programming.


    Java has many characteristics that have contributed to its popularity:


    +   * Platform independence - Many languages are compatible with only one platform.
    Java was specifically designed so that it would run on any computer, regardless
    if it was running Windows, Linux, Mac, Unix or any of the other operating systems.


    +   * Simple and easy to use - Java''s creators tried to design it code could
    be written efficiently and easily.


    +   * Multi-functional - Java can produce many applications from command-line
    programs to applets to Swing windows (basically, sophisticated graphical user
    interfaces). Java does have some drawbacks. Since it has automated garbage collection,
    it can tend to use more memory than other similar languages. There are often implementation
    differences on different platforms, which have led to Java being described as
    a "write once, test everywhere" system. Lastly, since it uses an abstract "virtual
    machine", a generic Java program doesn''t have access to the Native API''s on
    a system directly. None of these issues are fatal, but it can mean that Java isn''t
    an appropriate choice for a particular piece of software.


    JavaScript is a very powerful client-side scripting language. JavaScript is used
    mainly for enhancing the interaction of a user with the webpage. In other words,
    you can make your webpage livelier and more interactive, with the help of JavaScript.
    JavaScript is also being used widely in game development and Mobile application
    development.


    jQuery is an open source JavaScript library that simplifies the interactions between
    an HTML/CSS document, or more precisely the Document Object Model (DOM), and JavaScript.'
  merge: -1
  pgno: 8
- img_proc: true
  md: '# Introduction to Book


    Elaborating the terms, jQuery simplifies HTML document traversing and manipulation,
    browser event handling, DOM animations, Ajax interactions, and cross-browser JavaScript
    development.


    Some of the key points which supports the answer for why to use jQuery:


    +   - It is incredibly popular, which is to say it has a large community of users
    and a healthy amount of contributors who participate as developers and evangelists.

    - It normalizes the differences between web browsers so that you don''t have to.

    - It is intentionally a lightweight footprint with a simple yet clever plugin
    architecture.

    - Its repository of plugins is vast and has steady growth since jQuery''s release.

    - Its API is fully documented, including inline code examples, which in the world
    of JavaScript libraries is a luxury. Heck, any documentation at all was a luxury
    for years.

    - It is friendly, which is to say it provides helpful ways to avoid conflicts
    with other JavaScript libraries.


    JSON (JavaScript Object Notation) is a lightweight data-interchange format. It
    is easy for humans to read and write. It is easy for machines to parse and generate.
    It is based on a subset of the JavaScript Programming Language Standard ECMA-262
    3rd Edition - December 1999. JSON is a text format that is completely language
    independent but uses conventions that are familiar to programmers of the C-family
    of languages, including C, C++, Java, JavaScript, Perl, Python, and many others.
    These properties make JSON ideal data-interchange language.


    In this book, the basics for each of the three languages will be explained: java,
    JavaScript, jQuery, and JSON. This book will benefit everyone who wants to know
    and learn these languages, which can also benefit everyone who wants to enter
    the world of programming.'
