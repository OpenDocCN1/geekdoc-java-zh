  md: '# Java Programming Language


    # JAVA GET STARTED


    +   - Java Install


    Some PCs might have Java already installed.

    To check if you have Java installed on a Windows PC, search in the start bar for
    Java or type the following in Command Prompt (cmd.exe):


    ```

    C:\Users\YourName>java -version

    ```


    If Java is installed, you will see something like this (depending on version):

    java version "11.0.1" 2018-10-16 LTS

    Java(TM) SE Runtime Environment 11.0 (build 11.0.1+13-LTS)

    JavaTM HotSpot(TM) 64-Bit Server VM 11.0 (build 11.0.1+13-LTS, mixed mode)


    If you do not have Java installed on your computer, you can download it for free
    from oracle.com.


    Note: In this tutorial, we will write Java code in a text editor. However, it
    is possible to write Java in an Integrated Development Environment, such as IntelliJ
    IDEA, Eclipse or Eclipse, which are particularly useful when managing larger collections
    of Java files.


    Setup for Windows


    To install Java on Windows:

    1. Go to "System Properties" (Can be found on Control Panel > System and Security
    > System > Advanced System Settings)

    2. Click on the "Environment variables" button under the "Advanced" tab

    3. Then, select the "Path" variable in System variables and click on the "Edit"
    button

    4. Click on the "New" button and add the path where Java is installed, followed
    by \bin.

    By default, Java is installed in C:\Program Files\Java\jdk-11.0.1 (If nothing
    else was specified when you installed it. In that case, you will have to add a
    new path with:

    C:\Program Files\Java\jdk-11.0.1\bin. Then, click "OK", and save the settings'
