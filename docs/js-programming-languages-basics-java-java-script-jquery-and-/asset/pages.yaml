  md: "# jQuery Programming Language\n\nJavaScript statements are executed line by\
    \ line. However, with effects, the next line of code can be run even though the\
    \ effect is not finished. This can create errors.\n\nTo prevent this, you can\
    \ create a callback function.\n\nA callback function is executed after the current\
    \ effect is finished.\n\nTypical syntax: S(selector).hide(speed,callback);\n\n\
    Examples\n\nThe example below has a callback parameter that is a function that\
    \ will be executed after the hide effect is completed:\n\n```\n<!DOCTYPE html>\n\
    <html>\n<head>\n<script src=\"https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js\"\
    ></script>\n</head>\n<body>\n$(document).ready(function() {\n  $('button').click(function()\
    \ {\n    alert(\"The paragraph is now hidden\");\n    $(this).hide();\n  });\n\
    });\n<button id=\"hide\">Hide</button>\n<p>This is a paragraph with little content.</p>\n\
    </body>\n</html>\n```\n\nThis is a paragraph with little content.\n\nThe example\
    \ below has no callback parameter, and the alert box will be displayed before\
    \ the hide effect is completed:\n\nExample without callback"
