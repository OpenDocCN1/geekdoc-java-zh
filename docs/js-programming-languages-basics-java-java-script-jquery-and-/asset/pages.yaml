    # JavaScript String.trim()


    IE 8 does not support String.trim(). To trim a string you can use a regular expression
    instead


    You can also use the replace solution above to add a trim function to the JavaScript
    String.prototype:


    Example


    ```

    <!DOCTYPE html>

    <html>

    <body>

    <h2>JavaScript String.trim()</h2>

    <p>IE 8 does not support String.trim(). To trim a string you can use a polyfill.</p>

    <script>

    if (!String.prototype.trim) {

    String.prototype.trim = function () {

    return this.replace(/\s\uFEFF\xA0]+|[\s\uFEFF]+/g, ''''));

    }

    }

    var str = " Hello World! ";

    alert(str.trim());

    </script>

    </body>

    </html>

    ```'
