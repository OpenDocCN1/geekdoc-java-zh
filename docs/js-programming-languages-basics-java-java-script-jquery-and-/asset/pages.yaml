    * Include jQuery from a CDN, like Google


    Importing jQuery


    There are two versions of jQuery available for downloading:


    Production version - this is for your live website because it has been minified
    and compressed


    Development version - this is for testing and development (uncompressed and readable
    code)


    Both versions can be downloaded from jQuery.com.


    The jQuery library is a single JavaScript file, and you reference it with the
    HTML `<script>` tag (notice that the `<script>` tag should be inside the `<head>`
    section):


    ```

    <script src="jquery-3.5.1.min.js"></script>

    ```


    Tip: Place the downloaded file in the same directory as the pages where you wish
    to use it.


    If you don''t want to download and host jQuery yourself, you can include it from
    a CDN (Content Delivery Network).


    Google is an example of someone who host jQuery:


    Google CDN:'
