  md: '# jQuery Programming Language


    jQuery Syntax


    The jQuery syntax is tailor-made for selecting HTML elements and performing some
    action on the element(s).


    Basic syntax is: $(selector).action()


    A $ sign to define/access jQuery


    +   - A (selector) to "query (or find)" HTML elements

    - A jQuery() to be performed on the element(s)


    Examples:


    +   - S$(this).hide() - hides the current element.

    - S("p").hide() - hides all <p> elements.

    - S(".test").hide() - hides all elements with class="test".

    - S("#test").hide() - hides the element with id="test".


    You might have noticed that all jQuery methods in our examples, are inside a document
    ready event:


    ```

    $(document).ready(function() {

    ```


    This is to prevent any jQuery code from running before the document is finished
    loading (is ready).


    It is good practice to wait for the document to be fully loaded and ready before
    working with it. This also allows you to have your JavaScript code before the
    body of your document, in the head section.


    Here are some examples of actions that can fail if methods are run before the
    document fully loaded:


    +   - Trying to hide an element that is not created yet

    - Trying to get the size of an image that is not loaded yet'
