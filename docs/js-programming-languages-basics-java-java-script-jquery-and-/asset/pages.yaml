  md: 'Java is an object-oriented, cross platform, multi-purpose programming language
    produced by Sun Microsystems. It was based on C and C++ syntax to make it easy
    for programmers from those communities to learn. JavaScript is a very powerful
    client-side scripting language. JavaScript is used mainly for enhancing the interaction
    of a user with the webpage. jQuery is an open source JavaScript library that simplifies
    the interactions between an HTML/CSS document, or more precisely the Document
    Object Model (DOM), and JavaScript. JSON (JavaScript Object Notation) is a lightweight
    data-interchange format. It is easy for humans to read and write. In this book,
    the basics of each of the three languages will be explained: java, JavaScript,
    jQuery, and JSON. This book will benefit everyone who wants to get to know and
    learn these languages, which can also benefit everyone who wants to enter the
    world of programming.


    Elaf A.Saeed is a systems document, or more control engineer at the University
    of Al-Nahrain, college of information engineering, Iraq, she works in the fields
    of control, embedded systems, web design and has a talent of programming. Elaf
    was ranking as the first student of her stage for all years in B.Sc.


