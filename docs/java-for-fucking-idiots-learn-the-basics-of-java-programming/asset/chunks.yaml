  trans: "\n秘密地说（好吧，没那么秘密）它是一堆绑定在一起的字符变量。`String` 类已经为你处理了这一切。我们在书中有一整整一个章节专门介绍字符串、如何处理它们，以及书中后面会遇到的这类各种垃圾内容。但希望这能让你先应付这一关。\n\
    \n### 实验\n我建议你尝试声明变量、给它们赋值，并看看会发生什么。你甚至可以启动你那蠢的“Hello, World!”程序，并把它放在 `main`\
    \ 方法中。\n\n```java\npublic class HelloWorld {\n    public static void main(String[]\
    \ args) {\n        int myNumber = 420;\n        boolean shouldBlazeIt = true;\n\
    \        char charmander = 'C';\n        double moneyInTheBank = 500.36;\n   \
    \     long speedOfLight = 299792458L;\n        String bestAuthor = \"Steve\";\n\
    \    }\n}\n```\n\n尽管去尝试一些行不起通的事情。挑战 Java 编译器的极限。例如，你可以写这样一行代码：`int wellThisIsJustWrong\
    \ = false;`。然后编译并运行代码。它会发大雷霆，向 NASA 发送报告，并通知你的互联网服务提供商立即取消你的套餐。\n\n### 第 5 章：运算符\n\
    “你好，运算符？快给我叫海军来！[你已拨入海军的自动电话服务。] 章奇！机器人接管了海军！不是海军啊！！” —— 海绵宝宝派水粉丝\n\n好了，现在你已经知道变量的基础知识了。希望如此吧。现在，让我们看看运算符，或者说我们与变量交互的各种。\n\
    \n#### 什么是运算符？\n它们是执行特殊操作的特殊符号。也许你想把两个值相加。或者看看两个值是否相同。或者检查一个数字是否大于或等于另一个数字。或者，你想同时执行以上所有操作。运算符，出发！\n\
    \n注意，运算符不是变量。它们不是方法，不是对象，不是数据类型，而且它们对你并不感兴趣。它们就像计算器上那些不是数字的按钮。\n\n#### 算术运算符！\n\
    让我们开始吧！\n* 使用 `+` 加数\n* 使用 `–` 减数\n* 使用 `/` 除数\n* 使用 `*` 乘数\n\n对于 99% 的场景来说，这听起来一样简单。\n\
    `int x = 2 + 2;`\n…`x` 变为 4\n`int y = 4 * 9;`\n…`x` 变为 36 但当我们开始组合运算符时会发生什么？我们如何知道哪个更重要并先执行？我们是先乘法、再加法再减法吗？要是有某种气动设备能记住……\
    \ 嗯，你猜怎么着？[PEMDAS](https://www.mathsisfun.com/operation-order-pemdas.html) 回来了！！\n\
    \n#### 运算顺序\n操作就是一小块数学破事。你的服务员可能按照特定的顺序为你服务（每个桌子都是一个操作），取决于你到达的时间、他们对你的喜爱程度、他们预期你给的小费金额、你在餐厅的位置等。\n\
    \n数学有它自己的运算顺序：PEMDAS。\n* **P**arentheses 括号 `()`\n* **E** xponents 幂 `^`\n* **M**\
    \ ultplication 乘法 & **D** ivision 除法 `*/`\n* **A** ddition 加法 & **S** ubtraction\
    \ 减法 `+-`\n\n好消息是！你真美。不，但 Java 中没有幂。你只需要记住括号里的东西先发生，然后是乘法/除法，最后是加法/减法。如果这些类别之间没有组合，你只需从左到右即可。相信我，这超级简单。进入示例，走！\n\
    \n**示例一！**\n`int x = 5 + 3 - 7;`\n`x` 是 1。为什么？不需要担心 PEMDAS 规则，这只是加法/减法。`5 + 3`\
    \ 是 8。如果我们从结果减去 7，就得到 1。\n\n**示例二！**\n`int y = 5 - 7 * 6;`\n`x` 是 -37。为什么？乘法必须先发生，因为\
    \ PEMDAS 是这么说的。`7 * 6` 是 42。如果我们从 5 中减去 42，就得到 -37。\n\n**示例三！**\n`int z = 28 /\
    \ ( 3 + 4 );`\n`x` 是 4。为什么？虽然是加法，但 3 和 4 必须先处理，因为它们在括号内。`3 + 4` 是 7。然后我们可以用 28\
    \ 除以 7 得到 4。\n\n编程中的大多数数学（至少对于 90% 的开发者来说）是非常基础的；加两个值，乘两个值等。所以不要指望会经常需要担心这个“运算顺序”。\n\
    \n#### 取模\n另外……我纠结过要不要提它，但好吧，还有一个。它被称为取模运算符，它很蠢。它使用百分号（因为去你的吧，它就是这样）。\n`int remainder\
    \ = 5 % 2;`\n`remainder` 被设置为 1。为什么？因为取模执行除法，然后给你该除法操作的余数。\n\n此外，检查一个数字是否为偶数：`boolean\
    \ isEven = myNumber % 2 == 0;` 关于这个我就说这么多。\n\n#### 逻辑运算符！\n这些非常简单。它们基本上是这些英语单词的\
    \ Java 版本：\n* 与 `&&`\n* 或 `||`\n\n不，那不是艺术。它们是括号里的新运算符。让我们创建一些布尔值！记得那个数据类型吗？布尔值要么真要么假。这种数据类型与这些“逻辑”运算符紧密结合。\n\
    \n```java\nboolean imBored = true;\nboolean imHungry = false;\n// 真\nboolean imGoingToFood\
    \ = imBored || imHungry;\n```\n看到或运算符 `||` 是如何工作的了吗？“我很聊或者我很饿，我就去吃。”只要其中一个条件为真，`imGoingToFood`\
    \ 就设置为真。\n\n* 我正在制作一个文字冒险游戏。如果用户输入“exit”或“done”，我就退出程序。\n* 我正在写一个监控股市的程序（这是金钱生死之地）。如果我拥有的股票价格大幅上涨或下跌，我就发送电子邮件警报。事实上，如果\
    \ `||` 运算符的左侧已经为真，Java 甚至不会看右侧；没意义！Java 就像……如果我已经知道 `imBored` 足够让我吃饭了，为什么要检查 `imHungry`\
    \ 呢？\n\n对于与 `&&` 运算符 true 如此。两者都必须为真，表达式结果才为真\n\n```java\nboolean wellRested =\
    \ true;\nboolean motivated = false;\n// 假\nboolean goingToWorkOut = wellRested\
    \ && motivated;\n```\n即使我休息充足，如果我完全没有动力，也不会健身。而且即使我有健身的动力，如果因为睡眠不足没有精力，我也会放弃。\n\
    \n* 我正在写一个应用程序，用户必须使用账户信息登录。只有当他们输入了用户名和密码时，我才尝试让他们登录。\n* 我正在创建一个照明系统，如果灯处于开启状态且房间内\
    \ 5 分钟无人，它就会自动关灯。\n"
