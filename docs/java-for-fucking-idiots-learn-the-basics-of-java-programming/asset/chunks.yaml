    \n# Contents\n- [Introduction](#part0003.xhtml)\n- [Chapter 0: Software Cliff\
    \ Notes](#part0004.xhtml)\n- [Chapter 1: What the fuck is a Java?](#part0005.xhtml)\n\
    - [Chapter 2: Hello, World!](#part0006.xhtml)\n- [Chapter 3: Objects](#part0007.xhtml)\n\
    - [Chapter 4: Variables](#part0008.xhtml)\n- [Chapter 5: Operators](#part0009.xhtml)\n\
    - [Chapter 6: Conditionals](#part0010.xhtml)\n- [Chapter 7: Arrays](#part0011.xhtml)\n\
    - [Chapter 8: Loops](#part0012.xhtml)\n- [Chapter 9: Instantiation](#part0013.xhtml)\n\
    - [Chapter 10: Methods](#part0014.xhtml)\n- [Chapter 11: Strings](#part0015.xhtml)\n\
    - [Chapter 12: The Java Cinematic Universe](#part0016.xhtml)\n- [Chapter 13: Object-Oriented\
    \ Concepts](#part0017.xhtml)\n- [Chapter 14: Bringing it together](#part0018.xhtml)\n\
    - [Final Thoughts](#part0019.xhtml)\n\n# Introduction\nHi, I’m Steve. I’m here\
    \ to teach you the fundamentals of `Java`. Or the basics of `Java`. One of those.\
    \ Or both. I should probably start the book with a little elevator speech on why\
    \ it exists.\n\nSICK OF TRYING TO EARN MONEY BOUNCING FROM JOB TO JOB? CLICK HERE\
    \ TO LEARN HOW TO EARN $120,000 A MONTH FROM HOME!!!\n\nWait, that’s not right.\
    \ Let me start over…\n\nIn my experience, many books designed for “absolute beginners”\
    \ spend maybe a chapter talking to you like a beginner, then start talking to\
    \ you like you’re someone with average intelligence all the sudden. They forget\
    \ their audience. It becomes a normal textbook.\n\nI think it’s frustrating. I\
    \ want to be treated like the idiot I am, damn it. I assure you that in this book,\
    \ I will not forget that you’re a fucking idiot like me. The only real requirement\
    \ is you can read. And if you’re downloading an eBook and can’t read then I’m\
    \ not sure what to tell you, friend.\n\n## What this book is\nThis is a fast,\
    \ easy read that will guide you through the basics of `Java`; from variables,\
    \ methods, and operators, to classes, objects, and packages. Don’t know what those\
    \ words mean? No problem. My mastery of the English language (worthy of at least\
    \ a B- grade in high school) will suck you in to a mystical world of `Java` programming.\n\
    \nThe completely home-grown and organic code snippets will spell things out that\
    \ English otherwise can’t. The fact that I’m watching YouTube while writing this\
    \ book will have no adverse effects whatsoever. And I wrote all of it by myself,\
    \ so you know the book is completely home grown and organic. And prone to starting\
    \ a lot of sentences with “and.”\n\nThis book’s goal is for you, the air-headed\
    \ reader with an interest in `Java` programming, to be able to close this book\
    \ and say “Hey, I know quite a bit more than I did when I started reading it.\
    \ And it wasn’t too bad!”\n\n## What this book is NOT\nLike with any healthy relationship,\
    \ we should be honest with each other. I’ll be honest with you right now and say\
    \ what this book is not:\n\n1. **A detailed guide on how to download, install,\
    \ and configure `Java`.**\n   I just don’t think it fits the format or theme of\
    \ this book, and I could not be less interested in writing about it. I do have\
    \ a little blurb on this topic, but I’m focusing on the `Java` language itself.\n\
    \n2. **A workbook chalk full of exercises for you to do.**\n   There’s a lot of\
    \ these to go around considering `Java` is over 24 years old. I’ll focus on teaching\
    \ you the concepts, you start dicking around in the code and exercising your mind.\n\
    \n3. **A comprehensive guide to Java that fully explores everything it has to\
    \ offer in detail.**\n   Yeah, that’s gonna be a no from me dog. The more intricate\
    \ parts of `Java` I’m only going to lightly touch on. And others we simply won’t\
    \ get to. That’s the nature of a book for fucking idiots.\n\n4. **Written by a\
    \ Java guru that has decades of experience.**\n   I’ve been writing code in `Java`\
    \ for about 6 years but I’m just a person.\n\n5. **Emotionally stable**\n   This\
    \ book will be unfair and lash out at you, making personal attacks at times. I\
    \ apologize in advance.\n\n6. **Likely going to make me any money.**\n   But I’m\
    \ willing to accept this.\n\n## How should I read this book?\nIt’s meant to be\
    \ read like something you browse while you’re taking a poop on the toilet, but\
    \ you enjoy it so much you continue to read it after you’re done. Yeah, like that.\
    \ Just read it top to bottom, left to right. No, I don’t have any special goddamn\
    \ sections with special logos or icons, or any expert opinions… just read the\
    \ book you shitter.\n\n## Buckle up\nGet your towels ready, it’s about to go down.\
    \ We’re about to start Chapter One, and once we start, there’s no turning back.\n\
    \n# Chapter 0: Software Cliff Notes\nJust kidding, we’re starting at Chapter 0…\
    \ because programming. Here’s a quick summary of software in general to get you\
    \ up speed.\n\n- This is an operating system: `Windows`. It runs on computer and\
    \ talks to its individual parts, so we don’t have to.\n- This is a programming\
    \ language: `C++`. It is used by humans to write programs that run on operating\
    \ system.\n- This is a program: `Google Chrome`. It’s a web browser, written in\
    \ a programming language, that runs on operating system and lets you view websites.\n\
    - This is the programming language we will use in this book: `Java`.\n- This is\
    \ the powerhouse of the cell: `Mitochondria`.\n- These are parentheses: `()`\n\
    - These are curly braces: `{}`\n- These are square braces / brackets: `[]`\n-\
    \ These are angle brackets: `<>`\n\n![](rsrc3P.jpg)\n\nWonderful, now that you’re\
    \ up to speed… to the rest of the book!\n\n# Chapter 1: What the fuck is a Java?\n\
    `Java` is a programming language (the most popular one in the world, btw). A programming\
    \ language is a special kind of language that computers can understand. When you\
    \ write things down in a programming language, what you create is often referred\
    \ to as `code`. Not Morse code, or any sort of secret code you use to tell someone\
    \ you’re upset instead of saying why you’re upset. None of that; computer code.\n\
    \nA programmer therefore is someone that writes code, in a programming language,\
    \ so that computers can do things for us. However, computers are idiots, even\
    \ more so than you. If you show your `Java` code to your computer, it doesn’t\
    \ know how to read it. Hah! Stupid machine!\n\nWe do something called compilation\
    \ to turn our programming language code into a format the computer will understand.\
    \ Com – pill – ayy – shin. The act of compiling. Like compiling a list of everything\
    \ you want to order from the Chinese restaurant. Now, when I saw “we” I don’t\
    \ mean that a human actually does this “compilation” thing. Only that we rely\
    \ upon the “compilation” process to create our programs.\n\nLet me give you an\
    \ example:\n\n1. Steve writes some code for a program that can generate memes,\
    \ automagically!\n2. A compiler turns his source code (what he wrote) into machine\
    \ code.\n3. Steve’s computer runs that machine code so he can enjoy his fresh\
    \ memes.\n"
