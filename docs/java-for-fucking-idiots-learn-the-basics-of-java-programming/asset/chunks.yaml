  trans: "\n上一个例子？看看[你的特殊数据库类通过继承自动拥有多少代码](https://android.googlesource.com/platform/frameworks/support/+/refs/heads/androidx-master-dev/room/runtime/src/main/java/androidx/room/RoomDatabase.java)\
    \ ，仅仅通过继承就做到了。太棒了！继承！老实说，继承在这里还有很多东西可以挖掘。想从我这里学习更多吗？那我们需要一本更大的书才行。\n\n## 多态 (Polymorphism)\n\
    \n这可能是学习 Java 的人来说，最大且最令人生畏的词了。老实说，如果有很多全职编写 Java 程序的人甚至不知道它的意思，我并不会感到惊讶。这并不是在针对他们。它既是一个棘手的概念，也是一个令人困惑的词。好吧，也许稍微有一点点针对他们。但对你不会。你会的。我会强迫你去学习……如果你自愿阅读的话。\n\
    \n### 什么是多态？\n\nJava 有时很聪明。它最聪明的一点就是知道该调用哪个方法。这听起来可能很简单：我有一个类，它有一个方法。我创建该类的一个实例，并调用该方法。编程语言怎么会搞混呢？当涉及到继承时，就是它搞混的时候。\n\
    \n让我们回到我们的怪物示例。我们之前写了一些类似这样的代码：\n\n```\nGoblin warts = new Goblin();\n```\n\n\
    但我们可以在这里抛出一个巨大的转折。看到 `goblin` 变量的数据类型是 `Goblin` 吗？我们使用的构造函数是 `Goblin()` 吗？由于 `Goblin`\
    \ 是一个 `Monster`，我们可以这样做：\n\n```java\nMonster warts = new Goblin();\n```\n\n喔哦哦！它们不需要是一样的吗？不！左侧的数据类型不需要与你在右侧调用的构造函数相同。右侧可以是子类的构造函数。\n\
    \n### 为什么要多态？\n\n这带给了我们什么？有点像抽象；我们可以抽象掉面具背后的东西。记得 `Monster` 上的 `attack` 方法吗？\n\
    \n```java\npublic void attack(Monster monsterToAttack) {\n    monsterToAttack.health\
    \ -= damage ;\n}\n```\n\n有一个 `Monster` 被传递到这个方法中。它是 `Goblin` 吗？`Golem`？`Zombie`？还是其他类型的\
    \ `Monster`？我们根本完全不在乎。我们可以把它们都视为 `Monsters`；Java 会自动调用子类的适当方法，而不需要我们去关心。想象一下，如果有不同类型的\
    \ `Lists`、`Monsters`、`Heroes`、`Screens`、`Coffee` 等，而你必须逐个处理它们，那会有多烦人？\n\nJava\
    \ 使用多态允许我们针对类的父类数据类型进行编码，而它负责动态地运行该类子类实现的方法。\n\n```java\nclass Magikarp extends\
    \ Monster {\n    Magikarp() {\n        damage = 5000 0 ;\n    }\n    void attack(Monster\
    \ monsterToAttack) {\n        System. out.println( \"Magikarp used SPLASH! But\
    \ nothing happened!\" );\n    }\n}\n```\n\n看看。这是一种新的怪物，它在攻击时会做完全不同的事情；什么都没有！现在，如果我们运行这段代码会发生什么？\n\
    \n```java\nMonster fishy = new Magikarp();\nfishy.attack(goblin);\n```\n\n*  \
    \ 我们会编译失败吗？\n*   我们会触发水花并造成 0 伤害吗？\n*   我们会攻击并造成 50000 伤害吗？\n*   Java 调用的是父类 `Monster`\
    \ 的“attack”方法，还是子类 `Magikarp` 的“attack”方法？\n\n我的头。我那可怜的头。答案是，我们我们溅起了水花，然后什么都没有发生！注意，`fishy`\
    \ 的数据类型是 `Monster`。但我们创建了一个新的 `Magikarp()`。再次，这种当使用父类数据类型创建变量时调用子类方法的能力，被称为多态。\n\
    \n### 多态的实际示例？\n\nJava 中多态的一个极其常用的用法是 `Lists`。我在数组部分简要提到过它们……说是说我不会涵盖它们。但对于这一节，我会讲，哪怕只有一下。\n\
    \n```java\nList firstList = new ArrayList ();\nList secondList = new LinkedList\
    \ ();\nfirstList.add( new Goblin());\nsecondList.add( new Goblin());\n```\n\n\
    这两种 `List` 的“实现”——[`ArrayList`](https://docs.oracle.com/javase/8/docs/api/java/util/ArrayList.html)\
    \ 和 [`LinkedList](https://docs.oracle.com/javase/8/docs/api/java/util/LinkedList.html)——对内容的管理方式非常不同；一个底层是数组，另一个是一系列混乱的节点。但这并不重要；一旦你将这些变量声明为\
    \ `Lists`，你就可以以相同的方式与它们交互。\n\n另一个是与 Android 相关的：我在 Android 应用中创建了几个继承自 `Activity`\
    \ 类的屏幕。Android 本身可能会将这些存储为 `Activities` 数组：\n\n```java\nActivity[] currentActivities\
    \ ;\n```\n\n当应用关闭时，Android 会遍历这些活动并告诉我们屏幕正在销毁。\n\n```java\nfor (Activity activity\
    \ : currentActivities ) {\n    activity.onDestroy();\n}\n```\n\nJava 和 Android\
    \ 不在乎它是翻译文本的屏幕，还是显示当前 GPS 坐标的屏幕。它不在乎代码有一百万行，还是 3 行。它不在乎是否是子类。\n\n## 第 14 章：总结\n\
    \n我们学了什么？我能用编号列表来总结整本 Java 入门书吗？让我们发现吧。” —— 扭士糖棒上的猫头鹰\n\n1. 计算机理解“机器语言”。我们自己不写这种语言；我们使用编程语言以我们凡人能理解的格式进行编写。\n\
    2. Java 作为一种编程语言不像大多数语言那样直接编译或转换为机器语言。它编译为“字节码”，字节码在 Java 虚拟机（JVM）上运行，而虚拟机运行在实际计算机上。“一次编写，随运行。”\n\
    3. Java 开发人员使用 Java 开发工具包 (JDK) 来编译代码，并使用 Java 标准库提供的功能，如字符串、网络、数学、UI 等。对于 Java\
    \ 的底层部分，我希望你对语言的每个基本部分是什么、为什么存在以及如何开始有了大致了解。记住 Google 是你的朋友，你想知道的一切都是一系列沮丧的网络搜索。\n\
    4. Java 坚守于面向对象编程，代码被划分为逻辑块，称为类。这些类作为蓝图，我们据此创建对象。对象之间以直观的方式交互，创建出易维护、易理解且有价值的软件。希望如此。\n\
    5. 对象拥有属性；如数字、单词、列表或其他数据，这些数据与对象相关并描述它是什么。飞机可以有速度，书籍可以有价格，人可以有头部。\n"
