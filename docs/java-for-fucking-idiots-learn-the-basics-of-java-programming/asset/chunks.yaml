  trans: "\n\n```java\nString messageToUser =\"Thanks for purchasing the \" + itemName\
    \ + \" for $\" + price + \".\" ;\n``` 当我们最终将这个 `String` 显示给用户时，你可能会看到“Thanks for\
    \ purchasing Everybody Poops for $2.99.”不，对于网站来说，`System.out.println()` 并不够用……但那是另一个话题了。而且，你大可以相信，我为了在句末加个句号，特意多加了一个\
    \ `String` 拼接，即使只是为了例子也是如此。这真让我火大。总之，`String` 拼接无处不在。我的意思是，真的。将 `Strings` 与 `Strings`\
    \ 结合，或者和数字、对象，或者各种破事结合在一起。`+` 是一个非常重要的小家伙。\n\n## 格式化 (Formatting)\n\n上一个例子为了创建一个巨大的\
    \ `String` 用了很多加号。那些变量真的应该包含在那个 `String` 里面，不是吗？我们必须手动自己构建这个 `String`；将字符串切割成部分，并将变量插入到它们应该所在的位置。\n\
    \n有一种更简单的方法。它是 `String` 类中的一个静态方法，叫做 `format`。是的，它是静态的，这意味着你可以直接调用 `String.format`（注意大写的\
    \ `S`），而不需要对象即可使用该方法。\n\n以下是你如何使用这种方法实现完全相同的消息：\n\n```java\nString messageToUser\
    \ =String. format ( \"Thanks for purchasing %s for %f.\" , itemName, price);\n\
    ```\n\n看到这些字母前面有一个百分号 `%` 了吗？不，它不是你熟悉的那种百分比符号。这不是一个基于 100 的值。这也不是模运算。它们就像小小的占位符。然后当你使用\
    \ `String.format` 时，你给了 Java 真实的值！它会将它们插入到所属的位置。\n\n关于使用哪个字母，这种疯狂行为其实是有可循的（呵呵）。基本上，每种类型的变量都有它自己的字母。而且你知道吗？我没在这里贴占位符表。如果你发现自己需要创建一个包含变量的\
    \ `String`，请用你的 Google 搜索技巧来[在线查找该表格](https://dzone.com/articles/java-string-format-examples)。或者直接使用\
    \ `%s` 将所有内容视为 `String`。:)\n\n## 字符串是不可变的 (Strings are Immutable)\n\n“不可变”意味着什么？它是描述当你看电视时需要静音但却没法用的遥控器吗？不是。它的意思是\
    \ `Strings` 不能被改变。\n\n拼接？那创建了一个新的 `String`。当你使用我们看到的任何 `String` 方法时？它们都创建了新的 `Strings`。你需要确保不要期望通过使用这些方法让\
    \ `String` 发生改变。相反，你必须预期 Java 会根据你要求它操作创建一个新的 `String`。\n\n```java\nString initialString\
    \ = \"Ah, hello there.\" ;\n\ninitialString.toUpperCase();\n\nSystem. out .println(initialString);\n\
    ``` \n> “Ah, hello there.”\n\n看到了吗？字符串并没有变成全大写。你以为欧比旺（Obi-Wan）会大喊“AH, HELLO THERE.”\
    \ 吗？真遗憾。\n\n确实，我们调用了 `toUpperCase()` 方法。但这并没有修改我们创建的现有 `String`；它创建了一个带有这些修改的新字符串。我们对调用\
    \ `toUpperCase()` 时生成的 `String` 做了什么？什么都没做！它消失在虚空之中了。我们没有把它赋值给变量，也没有在条件语句内部使用。\n\
    \n另一个失败：\n\n```java\nString sillyString = \"haha dank memerinos!\" ;\n\nsillyString.substring(\
    \ 5 );\n\nSystem. out .println(sillyString);\n```\n> “haha dank memorinos!”\n\n\
    请杀了我吧。但再次，那个 `String` 方法并没有改变我们 `String` 的值，它创建了一个被忽略的新字符串。我们没有把 `sillyString`\
    \ 改为“dank memerinos!”\n\n事实上，如果你查看 `String` 类中可用的方法，没有任何一个“改变”或“修改”`String` 的方法是\
    \ `void` 类型。相反，Java 根据原始字符串创建一个新的 `String` 并将其返回供你使用。基本上，你不需要担心为什么字符串是“不可变的”；只需确保不要发现自己在尝试改变一个\
    \ `String`，而不是基于原始字符串创建新的即可。\n\n噢，这里是你正确编写这些示例的方法：\n\n```java\nString initialString\
    \ = \"Ah, hello there.\" ;\n\nString initialStringUpper = initialString.toUpperCase();\n\
    \nString sillyString = \"haha dank memerinos!\" ;\n\n// 重用同一个变量\n\nsillyString\
    \ = sillyString.substring( 5 );\n```\n\n## 第 12 章：Java 电影宇宙 (The Java Cinematic\
    \ Universe)\n\n“我明白失去是什么感觉。那种绝望地觉得你是正确的，但仍然失败了的感觉。这很恐惧。让双腿发软。我问你，为了什么？恐惧它吧。逃避它。命运终究会降临。现在，它在这里。或者我应该说，我在这里。”\
    \ – 灭霸\n\n在 Java 中，大反派不是灭霸。而是复杂性。\n\n复杂的代码是所有程序员的敌人。至少对于优秀的程序员是如此。源代码越复杂，修复问题、添加新功能、将其交给他人处理就越困难，凡你能想到的都有。而且只会更容易引入漏洞、让自己困惑，并后悔曾经开始过这个项目。\n\
    \n有很多方法可以应对复杂性。你可以有良好的方法命名。直观且有意义的注释。但我更多讨论的是规模上的复杂性。这就是为什么 Java 英雄们团结在一起非常重要。\n\
    \n*   需要在文件中存储数据？\n*   需要连接数据库\n*   需要生成随机数？\n*   需要网络调用？\n*   需要一个带有按钮、输入框之类的用户界面？\n\
    \nJava 提供了许多预制的类来帮助处理这些任务。这些都是我在开头提到的 Java 标准部分。它们可能不是最酷的，但它们确实为你提供服务。不像你半夜去买牛奶再也没回来的父亲。我想你了，爸爸。\n\
    \n"
- fmt: "\nIt’s literally just the word `package` followed by the directory the Java\
    \ file is inside of. Oh, and a semicolon. And yeah, this class doesn’t do anything\
    \ right now. It’s just a main method. Maybe if we actually developed this thing,\
    \ we’d open a new window and show the user a list of memes. I’m really just focusing\
    \ on the packages for right now, thank you.\n\n## Matryoshka dolls\nYou can keep\
    \ creating folders inside your folders. And therefore packages inside your packages.\
    \ Like those Russian dolls that have a Russian doll inside the Russian doll inside\
    \ the Russian doll.\n\nI did mention that we might show the user a list of memes,\
    \ since it’s a meme store. Let’s add a new package called `list`. And put a `MemeListScreen`\
    \ class in there.![](rsrc1W6.jpg)\n\nOK, so we created that new package (literally\
    \ a folder) and created a new java file called `MemeListScreen.java`.\n\n```java\n\
    package app.list;\n\npublic class MemeListScreen {\n\n}\n```\n\n### Understanding\
    \ the package structure\nAnd surprise, it literally is nothing. But notice the\
    \ package line. See the period there? This is saying that this class belongs to\
    \ the `app.list` package, which is the folder structure it’s inside of.\n\nFor\
    \ example, if we were to keep doing this, inside that `list` folder we could create\
    \ an `options` folder. And then inside that `options` folder we could create an\
    \ `about` folder. We could then have a Class inside the package `app.list.options.about`.\
    \ Maybe it’s called `AboutMemeStoreScreen` or some shit. I don’t know.\n\nThat\
    \ class would put this at the top of the file: `package app.list.options.about;`\n\
    \nGetting confused? The big idea is this: We organize our code to keep things\
    \ tidy and easy to understand. Just like you might put your Word documents in\
    \ one folder, and your PowerPoints in another folder, it’s a good idea to put\
    \ related Java code in the same folder (package). And you can keep breaking it\
    \ down further and further.\n\n## Naming your packages\nLike with many areas of\
    \ Java, there are conventions (or common ways to do things) when it comes to creating\
    \ packages. I’ll just show you a few example packages first, as the conventions\
    \ will probably become obvious:\n\n* `com.google.gson`\n* `com.google.dagger`\n\
    * `com.google.copybara.templatetoken`\n* `com.google.common.math`\n* `com.google.common.base.internal`\n\
    \nNotice every part of a package is lowercase. And that even if a package is multiple\
    \ words (see the example `templatetoken`?) we still combine it into one word.\n\
    \nThe most confusing part, by far, is the `com.google` part…why is there a website\
    \ name before all the packages? And why is it backwards?? The fuck is going on?\n\
    \nPeople, at least in America, have first names, middle names, and last names\
    \ to more uniquely identify us, yeah? It’s like that, except way more specific.\
    \ Maybe like a social security number. It makes it straightforward to share code\
    \ between developers without package names clashing. What if Google, Java, Facebook,\
    \ Amazon, and Steve all had a package called `math`. And we all wanted to share\
    \ it with the world, so that no one has to write code to do math ever gain? We’d\
    \ have a bad time.\n\nInstead we prefix all of our packages with our website name.\n\
    \n### “Okay, but why is it in reverse?”\nIDK. People just do that. Also, if you\
    \ don’t have a domain name, make one up. `com.stevebrown.memestore.app` Seems\
    \ good!\n\n## So… that’s kind of confusing\nIs it? It probably is. It was much\
    \ more intuitive (that means easy to understand) when we just had a folder called\
    \ `app`, with some folders inside there. Does this mean we now have a `com` folder?\
    \ Then a `stevebrown` folder? Then inside that all my actual packages with my\
    \ Java code?\n\nWell, yes. That’s correct. But since we’re sane human beings and\
    \ not psychopaths, we’re using a program like `IntelliJ` to write code in. And\
    \ it will handle creating all those folders for us, based off the package name.\
    \ For example, I can use `IntelliJ` to make a package structure like this:![](rsrc1XE.jpg)\n\
    \nSee how `com.stevenbrown.memestore.app` is displayed as one big package? Sure,\
    \ it’s actually a folder within a folder within a folder within a folder under\
    \ the hood. But `IntelliJ` (or god forbid, `Eclipse`) creates the folders on your\
    \ behalf.\n\nIn this instance, I absolutely have that entire folder hierarchy\
    \ on my computer: `C:\\Code\\MemeStore\\src\\com\\stevenbrown\\memestore\\app`\n\
    \nOh, and to be clear, your package declarations also reflect this full “reverse\
    \ domain name”:\n\n```java\npackage com.stevenbrown.memestore.app;\n\npublic class\
    \ MemeApp {\n    public static void main(String[] args) {\n\n    }\n}\n```\n\n\
    This will come to you naturally in time. I swear. Trust fall?\n\n## How should\
    \ I package my classes?\nIt’s totally up to you to decide the best way to organize\
    \ all your classes. But here’s some popular options people use:\n\n1. Package\
    \ by feature\n2. Package by layer\n3. Package by whatever the hell you feel like\n\
    \n### Package by feature\nIf you like option 3 then you can skip the rest of this\
    \ section for now. Wimp.\n\nWhat does this mean? A feature is, well, a feature\
    \ of your software. Something you provide that is valuable. For a piece of software\
    \ that the user actually sees, a feature might be a screen. Or collection of screens.\
    \ Imagine you’re creating a mobile application for Amazon. In a package by feature\
    \ approach, we might have one top-level package for each screen. Then, a package\
    \ for everything else.\n\n* `Product List`\n* `Product Detail`\n* `Shopping Cart`\n\
    * ` Settings`\n* `Shared`\n    * `Database`\n    * `Networking`\n\nThat’s the\
    \ structure in plain English (I like English). Here’s what it might look like\
    \ using those packaging conventions we just over:![](rsrc1YJ.jpg) Note that Amazon’s\
    \ app would be wayyyyyy more complex than this. Also I don’t work for them, and\
    \ I don’t know how they structure their code. But this is a simplistic example\
    \ of a “package by feature” approach. Each feature gets its own big package, and\
    \ anything that isn’t quite feature is thrown together somewhere else.\n\n###\
    \ Package by layer\nSure, package by “layer” … whatever you want to call it. By\
    \ functionality, by purpose, etc. In the last approach, “package by feature”,\
    \ we had a package for each main screen of the app…for each “feature” that we\
    \ provide to the user. In this approach, “package by layer”, we group by the kind\
    \ of class it is. For example, is the class part of the user interface? It goes\
    \ in the userinterface (ui) package.![](rsrc1YW.jpg) Do you feel me? Are you feeling\
    \ me?\n\n* `package by feature`: group things together by the section of your\
    \ app or whatever you would consider a “feature” of your program\n* `package by\
    \ layer`: group things together solely by their function, whether that be user\
    \ interface, networking, helper classes, creating files, math, that kind of stuff.\n\
    \nLet’s say there’s some networking related code I want to add that only affects\
    \ the `ProductDetailScreen`. Where would it go?\nIn Package by Feature, it goes\
    \ in the `productdetail` package.\nIn Package by Layer, it goes into the `networking`\
    \ package.\n\n### Imports\n“It is clear our nation is reliant upon big foreign\
    \ oil. More and more of our imports come from overseas.”– George W. Bush\n\nThis\
    \ quote has nothing to do with anything. But that last section took fucking forever\
    \ and I want to reset our minds here. Whew. Okay…\n\nHow do we let our classes\
    \ interact with each other? What if the `ProductListScreen` doesn’t know what\
    \ products to show without first making a network call to Amazon? Surely it needs\
    \ to ask Amazon for recommendations seeing as they know everything about every\
    \ aspect of our lives. we just do something like this inside our `ProductListScreen`?\n\
    \n```java\nNetworker networker = new Networker();\n```\n"
