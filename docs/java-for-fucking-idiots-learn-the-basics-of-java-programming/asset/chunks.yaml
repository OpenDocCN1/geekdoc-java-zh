    socks right off!Is that only for addition?Unsurprisingly to those of us with functioning
    neural passageways in our craniums, there are other fancy talk operators like
    the above addition one.A giraffe passes away, decrease by 1…


    numGiraffes--;


     Triplets are born, increase by 3…


    numGiraffes += 3 ;


     Half of the giraffe population is culled, divide by 2…


    numGiraffes /= 2 ;


     The giraffes are cloned, multiply by 2…


