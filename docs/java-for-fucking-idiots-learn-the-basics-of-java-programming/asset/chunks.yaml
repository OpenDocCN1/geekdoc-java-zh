    \ to display a user interface with buttons, input fields, and kinda jazz?\n\n\
    Java has a lot of premade classes available to help with common tasks like these.These\
    \ are all part of Java standard that I mentioned at the beginning. They might\
    \ not be the sexiest around, but they are there for you. Unlike your father that\
    \ left for milk in the middle of the night and never returned. I miss you, dad.\n\
    \nPackages\n\nOne way to reduce complexity and keep things tidy is to organize\
    \ your classes into “packages.”If you don’t specify a package at the top of your\
    \ class, you’re considered to be in the “default” package. Never do this unless\
