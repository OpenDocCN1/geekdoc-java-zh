    we’re early on in the book. There’s a lot of material to cover, and I don’t want
    to get into the weeds (blaze it) of methods. I’ll give you one example of what
    they look might like in Java.class Video {


         void resume() {…}


         void pause() {…}


         int getLikesCount() {…}


        String getTitle() {…}


        Video[] fetchRecommendations() {…}


         boolean isPaused() {…}


    }Just like with properties, you can use dot notation to touch its shit.bestVideo.resume();bestVideo.pause();I
    just resumed and paused the video really quickly. Hopefully that didn’t break
    it and cause it to buffer for an eternity…Anyways, I realize I left those methods
    empty. Maybe those methods are modifying properties (which I didn’t type out)
    of the Video object.The great thing about objects and methods is that you’re dividing
    up the code’s responsibilities into manageable chunks.The pause() method doesn’t
    need to know how to resume() .The fetchRecommendations() method takes care of
    finding “related” videos that YouTube wants to shove down your throat; getTitle()
    don’t care about that!Good programmers keep their methods small, well-named, and
    straightforward.But that’s enough on methods for now – there’s a lot of very basic
    Java concepts we need to cover before we dig much more into this. Onwards and
    upwards!Chapter 4: Variables"Not enough variables... hmm... not nearly enough
    variables." - HeimerdingerOkay, it’s time to dig into the nitty gritty of learning
    the language. Get your big boy (or girl) pants on, cause shit is about to get
    real.Let’s talk variables.Ever take algebra in middle school? Seen something like
    this?7 = 3 + xSolve for x, right?Variables are kind of like that.Here’s an exampleint
    myFavoriteNumber = 7 ;


    Later if we use the myFavoriteNumber variable it would be equal to 7.So, variables
    are human-readable things that are given values. The short-term memory of your
    computer says “OK, I’ll store that value for you. Use that variable name again
    when you want to know that value, or change it.”A person types “Please remove
    me from this distribution list” into Microsoft Outlook. The program would represent
    that data as a variable.Another person opens the Calculator on their computer
    and presses the number 3\. That’s another variable. A different kind of variable,
    but one nonetheless.Your Veterinarian’s computer system checks if you have used
    them before; this yes/no, or true/false value can be represented by a variable,
    too.Variables are eeeeeeverywhere . Create them, store them for later, change
    them, send them to your friends, get attached to them, cry over them. They’re
    wonderful.Why do we need variables?We cannot know the future, and neither can
    our programs (yet). Our code might need to respond to the user’s entered account
    name, the time of day, the amount of items that are in inventory, the information
    scanned in a barcode, the breed of dog in a cute picture, the GPS coordinates
    of your phone, you name it.Things that we do not know now , but our program can
    find out while running (“at runtime”), are good candidates for variables.OK, now
    let’s make some.Making variablesYou can declare a variable, basically telling
    the compiler “hey, this is something I’m going to use later, OK?” like this:int
    numberOfStarsToAwardThisBook;Variable declared. Hooray! However, it doesn’t have
    a value.We can fix this later with a new line of code that initializes the value:numberOfStarsToAwardThisBook
    = 5 ;Alternatively, we could have just done it from the start (declaring and initializing):int
    numberOfStarsToAwardThisBook = 5 ;Naturally, Amazon does not have code that makes
    every review 5 stars built into their software. We would likely show the user
    a screen to make a selection, then set this variable equal to the # of stars they
    selected afterwards.Data typesWhat was the “int” part for?int is short for integer.
    Integers are whole numbers. This is honestly elementary math but as I’ve said
    before… minimal assumptions.These are whole numbers: 4, 8, 15, 23, 42, -15, -214These
    are not whole numbers: ½, ¾, 0.86, -84.97, 0.01You can put the word int before
    a variable to specify that it is a whole number. That’s the type of variable it
    is.Java is absolutely paranoid about these “types” and if you don’t specify one,
    the compiler is going to be very upset with you. In fact, every variable in Java
    must have a declared type.Here are some the different kinds of variables that
    you can make.Note: All data types that have to do with numbers support positive
    or negative values.byte: A tiny number (-128 to 127) typically used for dealing
    with files.int: a whole number that can store quite large numbers. Very common.short:
    a smaller int tha- who gives a shit, don’t use these.long: an integer that can
    be hyuuuuuuuge.double: a number that can have decimal points, like 4.20, or 6.90.float:
    a stupid and useless version of double.char: a single character inside single
    quotes, like ‘g’ or ‘f’.boolean: true, or false. Nothing else. The data type of
    Siths.You can Google “Java data types” or click [this link](https://docs.oracle.com/javase/tutorial/java/nutsandbolts/datatypes.html)
    to see all of your options.What are thooooose?They’re called primitive data types;
    not because they’re illiterate and don’t bathe, but because they aren’t objects.Imagine
    the universe in Java is not composed of protons, neutrons, and electrons at its
    lowest level (hope you graduated from middle school!), but primitive variables.A
    primitive variable does not have properties. It does not have methods. It is not
    a blueprint from which we can create an object. It cannot reproduce.You cannot
    get more basic than a primitive. I mean, look at them. char is a single letter.
    double /float /int/short are numbers. boolean is true or false.Note that all the
    examples I listed start with a lowercase letter; this is the tell-tale sign of
    a primitive variable.Every class or object that stores or processes data, somewhere
    deep inside, has data represented by primitives. I think. Probably.Any piece of
    data that you see represented as an Object is using primitives under the hood.
    For example, there’s a class in Java that’s extraordinarily common called a String.
    See the capital S? Not a primitive!A note on StringsWhat’s a String , you ask?
    Literally anything inside of two double quotes.


    *   “Hello, world!” is a String.


    *   “ “ is a String with a space in it


    *   “” is an empty String


    *   “123” is a String


    *   “598.23” is a String.


    *   This entire book within some double quotes is a String.'
