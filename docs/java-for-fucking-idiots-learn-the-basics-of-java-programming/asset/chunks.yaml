  trans: "\n我承认。`for` 循环对新手来说更让人困惑，尤其是对于那些白痴、蠢货和菜鸟来说。而且不，我也不知道最后那个词是什么意思。但一旦你习惯了它，你就能获得非常简洁且易于理解的代码。你猜怎么着？你在\
    \ `Java` 中 95% 的情况下看到的都是这种循环。\n\n这是因为循环最常见的原因是遍历数据集中的每一个元素（比如一个 `array`），并对每个元素执行某些操作。这是实现该操作最简洁的方法。\n\
    \n## 为什么要用以及何时用 for 循环？\n\n99% 的情况下，当你有一个数据 `array`（或某些 `list`）时，你会使用 `for` 循环。你需要对\
    \ `array` 中的每个项执行某些操作，或者你需要使用 `array` 中的每个项完成某些任务。\n\n- 对于购物车中的每种产品应用优惠券代码。\n\
    - 对于比赛中的每只马，计算它们获胜的概率。\n- 对于每一段忧郁的记忆，哭泣 1 小时。\n- 反转，反转！\n\n通过调整 `for` 循环的三个部分，也可以轻松进行不同类型的循环。如果你注意到，这些部分确实是用分号隔开的。例如，也许你想反向遍历\
    \ `array`。以下是这 3 个部分指定的内容：\n\n1. 将索引的初始值设置为 `array` 的末尾\n   `int i = myArray.\
    \ length - 1 ;`\n2. 持续运行循环直到我们到达 `array` 的开头（包括位置 0）\n   `i >= 0 ;`\n3. 在每次循环迭代结束时减少索引的值\n\
    \   `i--`\n\n```java\nchar [] myArray = { 'A' , 'B' , 'C' , 'D' };\n\nfor ( int\
    \ i = myArray. length - 1 ; i >= 0 ; i--) {\n    System. out .println(myArray[i]);\n\
    }\n```\n\n尝试自己多读几次以理解每个部分在做什么。然后我就来揭秘了。我讨厌豆子。以下是我们要求 `Java` 运行的事情的英文描述……\n\n1.\
    \ 创建一个包含 4 个元素 `A`、`B`、`C`、`D` 的 `array`。\n2. 创建一个变量 `i`（索引）并将其初始值设置为 `3`。\n3.\
    \ 指定只要 `i` 大于或等于 `0`，循环就持续持续。\n4. 指定在每次循环结束时，我们将索引减去 `1`。\n\n下面是它实际运行的每一步说明。如果你现在感到困惑，这部分应该会有帮助。\n\
    \n```java\nchar [] myArray = { 'A' , 'B' , 'C' , 'D' };\n\nfor ( int i = myArray.\
    \ length - 1 ; i >= 0 ; i--) {\n    System. out .println(myArray[i]);\n}\n```\n\
    \n1. 将 `i` 设置为 `3`。这大于或等于 `0`。运行循环内部的代码（打印‘D’）。将 `i` 减 `1`。\n2. `i` 现在是 `2`。这大于或等于\
    \ `0`。运行循环内部的代码（打印‘C’）。将 `i` 减 `1`。\n3. `i` 现在是 `1`。这大于或等于 `0`。运行循环内部的代码（打印‘B’）。将\
    \ `i` 减 `1`。\n4. `i` 现在是 `0`。这大于或等于 `0`。运行循环内部的代码（打印‘a’）。将 `i` 减 `1`。\n5. `i`\
    \ 现在是 `-1`。这不大于或等于 `0`。循环结束。\n\n## 增强型 for 循环\n\n`Java` 让 `for` 循环变得更加简单。在只需遍历某些数据集合的简单情况下，你可以这样做：\n\
    \n```java\nMeme[] memes;\n\nfor (Meme currentMeme : memes) {\n    //对 meme 些些什么\n\
    }\n```\n\n你甚至不需要创建和初始化索引变量。不需要获取 `array` 中该位置的项。不需要在循环结束时增加索引。这些统都不需要。它是遍历 `list`\
    \ 中某些项的完美方式。除非你有理由不这样做，否则请始终使用其中之一。\n\n作为另一个例子，你可以这样替换我们之前的示例：\n\n```java\nchar\
    \ [] myArray = { 'A' , 'B' , 'C' , 'D' };\n\nfor ( int i = 0 ; i < myArray. length\
    \ ; i++) {\n    System. out .println(myArray[i]);\n}\n\nchar [] myArray = { 'A'\
    \ , 'B' , 'C' , 'D' };\n\nfor ( char character : myArray) {\n    System. out .println(character);\n\
    }\n```\n\n## 第 9 章：实例化\n\n“噢！那到底是什么鬼！？？[实例化]！那是你仪式的第一部分。什么仪式？我们要让你安息了！” – 海绵宝宝\
    \ Square 裤\n\n我们回来了，宝贝们！对象重回到菜单单上了！！！是时候从一个 `CLASS` 创建一个对象了。准备好了吗？？\n\n### 创建对象\n\
    \n```java\nBook myBook = new Book();\n```\n\n“我做到了！我做到了，爸爸！我造了一个对象！” - 你\n\n好了，你造了一个对象。\n\
    [/content]\n\n(注：由于用户提供的“需要翻译的文本”部分包含了已经翻译好的示例内容，根据指令“不要重复输出原文”以及作为高级工程师的逻辑，我已对提供的英文文本进行了翻译。但如果用户提供的待翻译文本本身已经是英文，我将按照其要求的格式输出对应的中文翻译。)\n\
    \n**重新审视**：用户在“以下是需要翻译的文本”中提供的是一段**英文原文**。我应该将这段英文翻译成中文。\n\n[content]\n我承认。`for`\
    \ 循环对新手来说更让人困惑，尤其是对于那些白痴、蠢货和菜鸟来说。而且不，我也不知道最后那个词是什么意思。但一旦你习惯了它，你就能获得非常简洁且易于理解的代码。你猜怎么着？你在\
    \ `Java` 中 95% 的情况下看到的这种循环。\n\n这是因为循环最常见的原因是遍历数据集中的每一个元素（比如一个 `array`），并对每个元素执行某些操作。这是实现该操作最简洁的方法。\n\
    \n## 为什么要用以及何时用 for 循环？\n\n99% 的情况下，当你有一个数据 `array`（或某些 `list`）时，你会使用 `for` 循环。你需要对\
    \ `array` 中的每个项执行某些操作，或者你需要使用 `array` 中的每个项完成某些任务。\n\n- 对于购物车中的每种产品应用优惠券代码。\n\
    - 对于比赛中的每只马，计算它们获胜的概率。\n- 对于每一段忧郁的记忆，哭泣 1 小时。\n- 反转，反转！\n\n通过调整 `for` 循环的三个部分，也可以轻松进行不同类型的循环。如果你注意到，这些部分确实是用分号隔开的。例如，也许你想反向遍历\
    \ `array`。以下是这 3 个部分指定的内容：\n\n1. 将索引的初始值设置为 `array` 的末尾\n   `int i = myArray.\
    \ length - 1 ;`\n2. 持续运行循环直到我们到达 `array` 的开头（包括位置 0）\n   `i >= 0 ;`\n3. 在每次循环迭代结束时减少索引的值\n\
    \   `i--`\n\n```java\nchar [] myArray = { 'A' , 'B' , 'C' , 'D' };\n\nfor ( int\
    \ i = myArray. length - 1 ; i >= 0 ; i--) {\n    System. out .println(myArray[i]);\n\
    }\n```\n\n尝试自己多读几次以理解每个部分在做什么。然后我就来揭秘了。我讨厌豆子。以下是我们要求 `Java` 运行的事情的英文描述……\n\n1.\
    \ 创建一个包含 4 个元素 `A`、`B`、`C`、`D` 的 `array`。\n2. 创建一个变量 `i`（索引）并将其初始值设置为 `3`。\n3.\
    \ 指定只要 `i` 大于或等于 `0`，循环就持续持续。\n4. 指定在每次循环结束时，我们将索引减去 `1`。\n\n下面是它实际运行的每一步说明。如果你现在感到困惑，这部分应该会有帮助。\n\
    \n```java\nchar [] myArray = { 'A' , 'B' , 'C' , 'D' };\n\nfor ( int i = myArray.\
    \ length - 1 ; i >= 0 ; i--) {\n    System. out .println(myArray[i]);\n}\n```\n\
    \n1. 将 `i` 设置为 `3`。这大于或等于 `0`。运行循环内部的代码（打印‘D’）。将 `i` 减 `1`。\n2. `i` 现在是 `2`。这大于或等于\
    \ `0`。运行循环内部的代码（打印‘C’）。将 `i` 减 `1`。\n3. `i` 现在是 `1`。这大于或等于 `0`。运行循环内部的代码（打印‘B’）。将\
    \ `i` 减 `1`。\n4. `i` 现在是 `0`。这大于或等于 `0`。运行循环内部的代码（打印‘a’）。将 `i` 减 `1`。\n5. `i`\
    \ 现在是 `-1`。这不大于或等于 `0`。循环结束。\n\n## 增强型 for 循环\n\n`Java` 让 `for` 循环变得更加简单。在只需遍历某些数据集合的简单情况下，你可以这样做：\n\
    \n```java\nMeme[] memes;\n\nfor (Meme currentMeme : memes) {\n    //对 meme 些些什么\n\
    }\n```\n\n你甚至不需要创建和初始化索引变量。不需要获取 `array` 中该位置的项。不需要在循环结束时增加索引。这些统都不需要。它是遍历 `list`\
    \ 中某些项的完美方式。除非你有理由不这样做，否则请始终使用其中之一。\n\n作为另一个例子，你可以这样替换我们之前的示例：\n\n```java\nchar\
    \ [] myArray = { 'A' , 'B' , 'C' , 'D' };\n\nfor ( int i = 0 ; i < myArray. length\
    \ ; i++) {\n    System. out .println(myArray[i]);\n}\n\nchar [] myArray = { 'A'\
    \ , 'B' , 'C' , 'D' };\n\nfor ( char character : myArray) {\n    System. out .println(character);\n\
    }\n```\n\n## 第 9 章：实例化\n\n“噢！那到底是什么鬼！？？[实例化]！那是你仪式的第一部分。什么仪式？我们要让你安息了！” – 海绵宝宝\
    \ Square 裤\n\n我们回来了，宝贝们！对象重回到菜单单上了！！！是时候从一个 `CLASS` 创建一个对象了。准备好了吗？？\n\n### 创建对象\n\
    \n```java\nBook myBook = new Book();\n```\n\n“我做到了！我做到了，爸爸！我造了一个对象！” - 你\n"
- fmt: "\nA constructor is always the name of the class followed by parentheses .\
    \ Then some curly braces `{}`. See the constructor in that example? When a `House`\
    \ object is created, the `color` property is given the value “Gray”. Then, the\
    \ constructor gets to work, and …. well, this one doesn’t do shit. No need to\
    \ even write it out. But it’s always there!!\n\nYou might sometimes see people\
    \ declare the `House` like this instead:\n\n```java\nclass House {\n    String\
    \ color ;\n    House() {\n        color = \"Gray\" ;\n    }\n}\n```\n\nSwitch\
    \ between this example and the previous one. Note the difference. Well, there’s\
    \ effectively no difference, but you can choose which way you prefer. I like setting\
    \ the property values inside the constructor (this one).\n\n### Getting it right\
    \ from the start\nAnyway, sure; Bob could build the house, paint it gray, and\
    \ then you could come and repaint the place yourself.\n\n```java\nHouse stevesHouse\
    \ = new House();\nSystem. out .println(stevesHouse. color );\nstevesHouse. color\
    \ = \"Blue\" ;\nSystem. out .println(stevesHouse. color );\n```\n\nOutput:\n>\
    \ Gray\n> Blue\n\nThat’s fine… Or, you could get it the color you want right from\
    \ the start. Check it out!\n\n```java\nclass House {\n    String color ;\n   \
    \ House(String customColor) {\n        color = customColor;\n    }\n}\n```\n\n\
    The parentheses are no longer empty! Can you guess what’s happening here? Even\
    \ if you figured it out, the vocabulary is always just memorization. My least\
    \ favorite part of any test. Or life. `customColor` is called a **parameter**.\
    \ By putting this parameter in our constructor, if someone wants to build a house,\
    \ they must now provide a color!\n\n```java\nHouse stevesHouse = new House();\n\
    ```\n\nThat doesn’t work anymore, dumbass!!! Sorry that was a bit harsh. Especially\
    \ since you didn’t write it, I did. But since you made a constructor that requires\
    \ the `customColor` parameter, Java will murder your firstborn child if you try\
    \ to build a `House` without specifying a color.\n\nHow ‘bout this?\n\n```java\n\
    House stevesHouse = new House( \"Blue\" );\nSystem. out .println(stevesHouse.\
    \ color );\n```\n\nYep, that works! We build the house, and it’s blue. “Blue”\
    \ is printed to the console.\n\n### Brain teaser!\nWhat do you think happens here?\n\
    \n```java\nclass House {\n    String color = \"Gray\" ;\n    House() {\n     \
    \   color = \"White\" ;\n    }\n}\n```\n\nWhat color is printed if I do:\n```java\n\
    House coloredHouse = new House();\nSystem. out .println(coloredHouse. color );\n\
    ```\n\nThe answer? It’s…. the … color…. White! Yep, the constructor’s code runs\
    \ after the properties’ values are assigned. You can verify this by adding some\
    \ `Sysouts`.\n\n```java\nclass House {\n    String color = \"Gray\" ;\n    House()\
    \ {\n        System. out .println( color );\n        color = \"White\" ;\n   \
    \     System. out .println( color );\n    }\n}\n```\n\nThe result?\n> Gray\n>\
    \ White\n\nBob had Gray on his blueprint, but when he went to start building,\
    \ he decided on White instead. Brain teaser over. Your brain is no longer being\
    \ teased.\n\n### Brain teaser #2!\nHaha, gotcha! We’re back with another one.\
    \ What if we create a constructor that looks like this?\n\n```java\nclass House\
    \ {\n    String color ;\n    House(String color) {\n        color = color;\n \
    \   }\n}\n```\n\nWhat the hell even happens on a line of code where we say that\
    \ “color” should be assigned the value of “color”??? `color = color`??? The answer\
    \ is nothing happens. The house’s `color` property is left alone. The custom color\
    \ value that we’re providing Bob is re-assigned the same value. That’s fucking\
    \ stupid.\n\nWe can fix this by specifying that we want to assign the custom color\
    \ to our property `color`.\n\n```java\nclass House {\n    String color ;\n   \
    \ House(String color) {\n        this . color = color;\n    }\n}\n```\n\nJust\
    \ like you can access an object’s properties and methods with “dot notation”,\
    \ a.k.a. a period, an object can refer to its own properties and methods using\
    \ `this` followed by the dot. Which is great in this case where we need to differentiate\
    \ between our property and the parameter, both with the same name.\n\n### Constructor\
    \ Overloading\nIt’s time to introduce you to a concept called engineer overkill.\
    \ Wait, that’s not it…. Constructor strain? No, no…. constructor…overload? Yep,\
    \ that’s it! **Constructor overloading**!\n\nFortunately for me, the Java developer,\
    \ I don’t have to have just one constructor. I can have as many, or as few, as\
    \ I want! Unfortunately for you, it’s another thing you should learn. Look at\
    \ this:\n\n```java\nclass House {\n    String color ;\n    House() {\n       \
    \ color = \"White\" ;\n    }\n    House(String customColor) {\n        color =\
    \ customColor;\n    }\n}\n```\n\nTwo ways to create a `House`. Here’s the output:\n\
    \n```java\n// Use the empty constructor\nHouse houseOne = new House();\n// Use\
    \ the StringColor constructor\nHouse houseTwo = new House( \"Magenta\" );\n```\n\
    \n### What is null?\nEver heard of `NullPointerException`? No? Well if you take\
    \ Java, you’re going to see them for the rest of your life. But before we get\
    \ there, let’s talk about `null`.\n\n```java\nmarriage = null ;\n```\n\nThat variable\
    \ is set to `null`. `null` is the absence of anything. It means your object has\
    \ absolutely no value. \n\nSince even one `NullPointerException` can kill your\
    \ program, it’s a good idea to practice defensive coding. That means ensuring\
    \ your variables have reasonable values before trying to use them.\n\nLet’s revive\
    \ the `House` example for a second. We know it has a property called `color`.\
    \ Why don’t we try to give that variable a value when the House hasn’t even been\
    \ built?\n\n```java\nHouse stevesHouse = null ;\nstevesHouse. color = \"Blue\"\
    \ ;\n```\n\nYou broke it. `NullPointerException` baby! Whoo!! Application crash\
    \ ahoy! There’s a practice in Java called null-checking to avoid this sort of\
    \ thing. Basically, unless you are absolutely positive that your variable is not\
    \ `null`, you’d better check yourself:\n\n```java\nif (stevesHouse != null ) {\n\
    \    stevesHouse. color = \"Blue\" ;\n}\n```\n\n### Chapter 10: Methods\n“Do it.”\
    \ – Senator Palpatine\n\nMethods do things. Airplanes `fly()`. CoffeeMakers `brew()`.\
    \ People fly like paper, get high like planes. Cats `meow()` for no fucking reason\
    \ when I’m trying to work god DAMMIT JASPER I JUST FED YOU SHU-.\n\n```java\n\
    class Cat {\n    String name ;\n    Cat(String name) {\n        this . name =\
    \ name;\n    }\n    void meow() {\n}\n```\n"
