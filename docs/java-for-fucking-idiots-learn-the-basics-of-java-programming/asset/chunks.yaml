  trans: "\n\n构造函数的名称总是类名，后面跟着圆括号 `()`。然后是一些大括号 `{}`。看到那个例子中的构造函数了吗？当一个 `House` 对象被创建时，`color`\
    \ 属性被赋予了值“Gray”（灰色）。然后，构造函数开始工作了，……额吧，这一个什么都没做。甚至不需要写出来。但它一直存在那儿！！\n\n你有时会看到人们这样声明\
    \ `House`：\n\n```java\nclass House {\n    String color ;\n    House() {\n    \
