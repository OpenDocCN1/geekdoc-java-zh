  trans: "\n结果是什么？程序输出了文本：“如何在不到 20 分钟内成为一名华丽的服务员”。那个点，或者说句号，就像通往对象灵魂的窗口。在你的对象名称后面加上这个点，就可以访问它能看到的所有内容。\n\
    \n## Methods\n\n还记得主方法吗？没错，它被称为 `main` 方法，因为它是第一个运行的、非常重要的方法。但你可以拥有多个方法。\n\n事实上，非常建议拥有多个方法。将你的代码拆分为许多较小的方法，会使其更容易阅读和理解程序在做什么。\n\
    \n我们刚刚简要地提到了属性（properties），它们是与对象相关的数据片段。属性和方法之间的区别是什么？\n\n*   属性是对象**是什么**。\n\
    *   方法是对象**能做什么**。\n\n“但是……但是，Steve。这并不能真正解释 Java 中的方法到底是什么。你算什么，我是个白痴吗？”——你\n\
    \n好吧好吧，也许不是你说的。你可能不记得我的名字了。听着，这本书才刚开始。有很多很多内容要涵盖，我不想陷入方法的细节（该死它吧）中。我会给你一个它们在 Java\
    \ 中可能样子的例子。\n\n```java\nclass Video {\n    void resume() {…}\n    void pause()\
    \ {…}\n    int getLikesCount() {…}\n    String getTitle() {…}\n    Video[] fetchRecommendations()\
    \ {…}\n    boolean isPaused() {…}\n}\n```\n\n就像属性一样，你可以使用点符号法来操作它的东西。\n`bestVideo.resume();`\n\
    `bestVideo.pause();`\n\n我刚刚快速恢复并暂停了视频。希望这没有让它坏掉并导致缓存永恒……总之，我意识到我把那些方法留空了。也许那些方法正在修改\
    \ `Video` 对象的属性（我没写出来的那些）。\n\n对象和方法的伟大之处在于，你将代码的职责划分成了易于管理的区块。`pause()` 方法不需要知道如何\
    \ `resume()`。`fetchRecommendations()` 方法负责寻找 YouTube 想塞进你嘴子里的“相关”视频；`getTitle()`\
    \ 根本不在乎这些！\n\n优秀的程序员保持其方法短小、命名良好且直截了当。但关于方法就到此为止了——在我们深入研究之前，还需要涵盖很多非常基础的 Java\
    \ 概念。继续前进，不断进步！\n\n## Chapter 4: Variables\n\n“变量不够……嗯……变量远远不够。” - Heimerdinger\n\
    \n好了，现在是时候深入学习这种语言的细枝末节了。穿上大男孩（或大女孩）裤，因为事情要变得真格了。让我们聊聊变量。初中学上过代数吗？见过这样的东西吗？\n\
    `7 = 3 + x`\n解出 `x` 对吧？变量就像那样。\n\n这是一个例子：\n```java\nint myFavoriteNumber = 7 ;\n\
    ```\n\n之后如果我们使用 `myFavoriteNumber` 变量，它将等于 7。所以，变量是被赋予了值的可读内容。你计算机的短期记忆说：“好的，我会为你存储那个值。当你想知道那个值或更改它时，再次使用那个变量名。”\n\
    \n人在 Microsoft Outlook 中输入“请将我从这个邮件列表中删除”。程序会将该数据表示为一个变量。另一个人在电脑上打开计算器并按下数字 3。那是另一个变量。虽然类型不同，但终它是变量。你的兽医电脑系统会检查你之前是否使用过他们；这个是/否或真/假的值也可以用变量表示。\n\
    \n变量无处不在。创建它们，存储它们以备后用，改变它们，发送它们给你的朋友，对它们产生感情，为它们哭泣。它们太棒了。\n\n### 为什么我们需要变量？\n\
    \n我们无法预测未来，我们的程序也是如此（目前）。我们的代码可能需要响应用户输入的用户名、时间、库存中的物品数量、条形码扫描的信息、可爱照片中狗的品种、你手机的\
    \ GPS 坐标，你想到的都有。\n\n我们现在不知道，但我们的程序在运行时（at runtime）可以发现的东西，都是变量的候选对象。\n\n好了，现在让我们创建一些。\n\
    \n### Making 变量\n\n你可以声明一个变量，基本上是告诉编译器“嘿，这是我以后要用到的东西，好吗？”，像这样：\n```java\nint numberOfStarsToAwardThisBook;\n\
    ```\n变量已声明。万岁！但是，它还没有值。我们稍后可以用新行代码初始化该值来修复它：\n```java\nnumberOfStarsToAwardThisBook\
    \ = 5 ;\n```\n或者，我们可以从一开始就完成（声明并初始化）：\n```java\nint numberOfStarsToAwardThisBook\
    \ = 5 ;\n```\n自然地，Amazon 的软件中并没有内置让每条评论都变成 5 星的代码。我们可能会向用户显示一个屏幕进行选择，然后将此变量设置为他们选择的星数。\n\
    \n### Data types\n\n“int”部分是干什么用的？\n`int` 是 integer（整数）的缩写。整数是全数。老实说这是基础数学，但正如我之前提到的……做出最少假设。\n\
    \n这些是整数：4, 8, 15, 23, 42, -15\n这些不是全数：½, ¾, 84\n\n你可以在变量前加上 `int` 来指定它是一个全数。Java\
    \ 对这些“类型”非常敏感。这里是一些你可以创建的不同类型的变量：\n\n*   `byte`: 一个很小的数字（-128 到 127），支持正负数。通常用于处理文件。\n\
    *   `int`: 一个整数。非常常见。\n*   `short`: 一个较小的 `int`（除非你有特殊需求）。\n*   `long`: 一个可以存储非常巨大的整数。\n\
    *   `double`: 可以带有小数点的数字，如 4.2。\n*   `float`: `double` 的一个没用的版本。\n*   `char`:\
    \ 单个引号内的单个字符，如 ‘g’ 或 ‘f’。\n*   `boolean`: 真或假。没有别的。这种类型。\n\n你可以搜索“Java 数据类型”或点击[此链接](https://docs.oracle.com/javase/tutorial/nutsandbolts/datatypes.html)\
    \ 查看所有的选项。\n\n### 它们是什么？\n\n它们是原始数据类型；不是因为它们底层，而是它们不是对象。想象 Java 宇宙在底层不是由质子、中子和电子组成的（希望你初中毕业了！），而是原始变量。每个存储或处理数据的类或对象，深处都有由原始类型表示的数据。我想。也许。例如，我列出的所有示例都以小写字母开头；这是原始变量的典型特征。\n"
- fmt: "\nSecretly (okay not very secretly) it’s a bunch of char variables tied together.\
    \ The `String` class takes care of all that for you. We have an entire section\
    \ of this book dedicated to Strings, how to deal with them, and all kinds of garbage\
    \ like that later in the book. But hopefully this will tide you over.\n\n### Experimenting\n\
    I recommend that you experiment with declaring variables, giving them values,\
    \ and seeing what happens. You can even boot up your stupid “Hello, World!” program\
    \ and put it inside the `main` method.\n\n```java\npublic class HelloWorld {\n\
    \    public static void main(String[] args) {\n        int myNumber = 420;\n \
    \       boolean shouldBlazeIt = true;\n        char charmander = 'C';\n      \
    \  double moneyInTheBank = 500.36;\n        long speedOfLight = 299792458L;\n\
    \        String bestAuthor = \"Steve\";\n    }\n}\n```\n\nFeel free to do something\
    \ that won’t work. Push the limits of the Java compiler. For example, you could\
    \ write this line of code: `int wellThisIsJustWrong = false;`. Then compile and\
    \ run the code. It will throw a conniption, send a report to NASA, and inform\
    \ your internet service provider to immediately cancel your plan.\n\n### Chapter\
    \ 5: Operators\n“Hello operator? Get me the navy! [You’ve reached the Navy’s automated\
    \ phone service.] Squidward! The robots have taken over the Navy! Not the Navy!!!”\
    \ – Spongebob Squarepants\n\nOK, so now you know the basics of variables. Hopefully.\
    \ Now let’s look at operators, or ways that we can interact with our variables.\n\
    \n#### What’s an operator?\nThey’re special symbols that do special things. Maybe\
    \ you want to add two values. Or see if two values are the same. Or check if a\
    \ number is greater than or equal to another. Or, you want to do all the above.\
    \ Operators ahoy!\n\nNote that operators are not variables. They’re not methods,\
    \ they’re not objects, they’re not data types, and they’re just not that into\
    \ you. They’re like the buttons on your calculator that aren’t the numbers.\n\n\
    #### The math operators!\nLet’s get it started!\n* Add numbers with `+`\n* Subtract\
    \ numbers with `–`\n* Divide numbers with `/`\n* Multiply numbers with `*`\n\n\
    This is just as easy it sounds for 99% of scenarios.\n`int x = 2 + 2;`\n…`x` becomes\
    \ 4\n`int y = 4 * 9;`\n…`x` becomes 36But what happens where we start combining\
    \ our operators? How do we know which ones are more important and go first? Do\
    \ we multiply, then add, then subtract? If only there was some sort of pneumatic\
    \ device to remember… Well, guess what? [PEMDAS](https://www.mathsisfun.com/operation-order-pemdas.html)\
    \ is back!!\n\n#### Order of operations\nAn operation is one little chunk of math\
    \ shit. Your waiter probably waits on tables (each one an operation) in a certain\
    \ order, by the time in you arrived, how much they like you, how much they expect\
    \ you to tip, where you’re located in the restaurant, etc.\n\nMath has its own\
    \ order of operations: PEMDAS.\n* **P**arentheses `()`\n* **E** xponents `^`\n\
    * **M** ultplication & **D** ivision `*/`\n* **A** ddition & **S** ubtraction\
    \ `+-`\n\nThere is good news! You’re beautiful. No, but there are no exponents\
    \ in Java. You literally just need to remember that stuff in parentheses happens\
    \ first, followed by multiplying/dividing things, followed by adding/subtracting.\
    \ And if there’s no combination between those categories you just go left to right.\
    \ Trust me, it’s super easy. Into the examples, here we go!\n\n**Example one!**\n\
    `int x = 5 + 3 - 7;`\n`x` is 1. Why? No need to worry about the PEMDAS rules,\
    \ it’s just addition/subtraction. `5 + 3` is 8. And if we subtract 7 from that,\
    \ we get 1.\n\n**Example two!**\n`int y = 5 - 7 * 6;`\n`x` is -37. Why? The multiplication\
    \ must happen first, because PEMDAS says so. `7 * 6` is 42. And if we subtract\
    \ from 42 from 5, we get -37.\n\n**Example three!**\n`int z = 28 / ( 3 + 4 );`\n\
    `x` is 4. Why? Even though it’s addition, 3 and 4 must be tackled first because\
    \ they’re inside parentheses. `3 + 4` is 7. Then we can divide 28 by 7 and get\
    \ 4.\n\nMost math in programming, at least for 90% of developers, is extremely\
    \ basic; add two values, multiply two values, etc. So don’t expect to have to\
    \ worry about this “order of operations” very often.\n\n#### Modulo\nAlso… I debated\
    \ not mentioning it, but fine, there’s another one. It’s called the modulo operator\
    \ and it’s stupid. It uses a percentage sign (because fuck you that’s why).\n\
    `int remainder = 5 % 2;`\n`remainder` is set to 1. Why? Because a modulo performs\
    \ division, then gives you the remainder of that division operation.\n\nAlso,\
    \ to check if a number is even: `boolean isEven = myNumber % 2 == 0;` That’s all\
    \ I’m going to say about it.\n\n#### The logical operators!\nThese ones are easy\
    \ peezy. They’re basically the Java version of these words in English:\n* and\
    \ `&&`\n* or `||`\n\nNo, that’s not art of buttocks. It’s the new operators inside\
    \ of parentheses. Let’s create some booleans! Remember that data type? A boolean\
    \ value is either true or false. This data type goes hand-in-hand with these “logical”\
    \ operators.\n\n```java\nboolean imBored = true;\nboolean imHungry = false;\n\
    // True\nboolean imGoingToEatFood = imBored || imHungry;\n```\nSee how the or\
    \ operator `||` works? “I am going to eat food if I’m bored or if I’m hungry.”\
    \ Either one of those conditions are true, then `imGoingToEatFood` is set to true.\n\
    \n* I’m making a text-based adventure game. If the user types in “exit” or “done”,\
    \ I exit the program.\n* I’m making a program to monitor the stock market (this\
    \ is where money lives and dies). If the price of a stock I own goes severely\
    \ up, or severely down, I send out an email alert. In fact, Java won’t even look\
    \ at the right side of the `||` operator if the left side is already true; there’s\
    \ no point! Java’s like… why check `imHungry` if I already know `imBored` is enough\
    \ to warrant eating food?\n\nThat’s not true when it comes to the and `&&` operator.\
    \ Both need to be true for the expression to evaluate to true\n\n```java\nboolean\
    \ wellRested = true;\nboolean motivated = false;\n// False\nboolean goingToWorkOut\
    \ = wellRested && motivated;\n```\nEven if I’m well rested, if I have no motivation\
    \ at all, I won’t work out. And even if I were motivated to work out, if I have\
    \ no energy due to lack of sleep, I’ll probably pass as well.\n\n* I’m writing\
    \ an app where the user must log in using their account information. I only try\
    \ to sign them in if they’re entered a username and they’re entered a password.\n\
    * I’m creating a lighting system that automatically turns off the lights if the\
    \ lights are currently on and there has been no one in the room for 5 minutes.\n"
