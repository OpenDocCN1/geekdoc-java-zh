    嗯。我们如何检查“vaccines”是否在里面，无论字母的大小写情况如何？我知道了！我们可以用 `containsIgnoreCase`！开个玩笑的——根本没这个方法！该死的
    Java。


    对于 99.9% 的场景，有一个简单的方法可以实现。这涉及到我们的下一个超能力，所以我们先过一遍。`toLowerCase` 和 `toUpperCase`。


    ```java

    String bestGame = "Old School Runescape" ;


    //"OLD SCHOOL RUNESCAPE"


    String bigBoy = bestGame.toUpperCase();


    //"old school runescape"


    String lilBoi = bestGame.toLowerCase();

    ```


    极其直观。只是将字母转换为大写或小写版本。写这些方法的人呢？[对他们来说没那么简单](http://unicode.org/reports/tr21/tr21-5.html)。


    `containsIgnoreCase`？记得吗？哈喽？啊，对了！好了，首先，你只需要统一字母的大小写。然后就可以使用 `contains` 了。


    ```java

    String testString = "BOy I HatE HoW VACccINeS" CauSe AUTisM" ;


    //"boy i hate how vaccines cause autism"


    testString = testString.toLowerCase();


    //true


    testString.contains( "vaccines" );

    ```


    如果你真的想做，你也可以把它改为 `toUpperCase` 并寻找“VACCINES”。`charAt`。还记得数组的“索引”吗？你知道 `[0]` 获取第一个元素，`[1]`
    获取第二个元素，以此类推吗？遗憾的是，对你来说，这些知识在这次练习中死而复活了。


    ```java

    "we live in a society" .charAt( 1 );

    ```


    这返回字符‘e’。


    ```java

    "I hate sand" .charAt( 7 );

    ```


    这返回字符‘s’。是的，你从空格键打出的空格“ ” 也是字符，所以当你处理 `String` 中字符的索引时，需要包含它们。


    还不赖。现在来看下一个方法。:)


    ## `substring`


    假设我们想要获取一个 `String` 的前 5 个字母。


    ```java

    String helloWorld = "Hello, world!" ;

    ```


    噢天哪，它回来了。不管如何，我们可以通过给 Java 我们想要的字符的起始索引和结束索引，从这个 `String` 中提取出一个“子字符串”。


    ```java

    String firstFive = helloWorld.substring( 0 , 5 );

    ```


    这是说“给我第 0 个字符到第 5 个字符”。结果是“Hello”。等等，0 到 5？那不是 6 个字符吗？`0, 1, 2, 3, 4, 5`……那是 6
    个！这这里到底发生了什么？！为什么我们只得到了“Hello”而没有得到逗号？


    这里是棘手的地方（你知道它要来了）：Java 不是那样工作的。你要求获取从第 0 个字符开始**但不包含**第 5 个字符。这被称为“包含（inclusive）”和“排除（exclusive）”。


    ```java

    String firstFive = helloWorld.substring( 0 , 5 );

    ```


    “获取从索引 0 开始**包含**且到索引 5 结束（不包含）**的子字符串。”`0, 1, 2, 3, 4, 5`（在这里，5 是班级里没有小组的朋友，被排挤掉了）`H,
    E, L, L, O`


    让我们再来一个。看看现在是谁在清理内容。


    ```java

    "Ah geez I don’t know Rick" .substring( 4 , 7 );

    ```


    假设这个 `String` 写在一张薄薄的纸上。想象拿着一把剪刀，在位置 4 和 7 处剪断字符串。所有我们不要的东西都扔进纸篓。


    **第一刀**：我们做的第一刀是在“geez”中的小写字母 g 处。它距离左侧第 4 个位置。因为规则规定我们在结果中包含第一个索引，所以我们从它的左侧剪切，这样我们就不会丢失它。“Ah
    ” 然后被扔进垃圾桶。


    **第二刀**：我们做的第二刀是在“I”之后的空格“ ”处。它距离左侧第 7 个位置。记住；我们不需要索引 7 处的字符；它是被排除在外的。我们也不想要它右边的任何东西。因为规则规定我们在结果中排除最后一个索引，所以我们从它的左侧剪切，这样它就被排除了。右侧包括空格“
    ”在内的所有内容随后被扔掉。


    剪切完成！剩下的纸写着“geez”。垃圾桶里有“Ah ”和“ I don’t know Rick”。想象一下 `String` 被剪开的过程，再次按照这些指令操作两次。


    ## 更多甜头


    我知道，我知道。你是个笨蛋新手，你仍然很困惑。但这是那种真正需要刻在脑里的事情之一。在这里，我会给你一些例子来帮助你，朋友。用你的手指从左到右数，理解为什么结果会是那样：


    ```java

    //"NOP"

    "LMNOPQ" .substring( 2 , 5 );


    //"B"

    "ABCDEFG" .substring( 1 , 2 );


    //"WH"

    "WHAT" .substring( 0 , 2 );


    //"" (空字符串)

    "GAWRSH" .substring( 1 , 1 );

    ```


    希望你开始理解这个了。这里还有一点要提。你知道我们是如何提供起始索引和结束索引的吗？如果你愿意，Java 允许你只提供起始索引。结果是？你只剪一刀，Java
    会给你整个 `String` 的尾部分。


    ```java

    //"Cool"

    "Lame Cool" .substring( 5 );


    //"BC"

    "ABCDEFGHIJKLMNOP" .substring( 1 );

    ```


    ## `split`


    我喜欢这个方法。它从 `String` 中创建出一系列较小的 `String`。你给 Java 一个字符来执行 `split`（分割）。你会得到一个数组。该字符每次出现的地方变成字符串。


    ```java

    String sentence = "I just think they''re neat" ;

    String[] words = sentence.split( " );

    ```


    猜怎么着？我们现在有一个数组！`{ "I" , "just" , "think" , "they''re" , "neat" }`。当 Java 看到空格时，它去掉了字符串。左侧和右侧部分最终进了数组。


    ## `trim`


    好了，最后一个。这个很容易。它移除 `String` 首尾所有的空格和换行符。


    ```java

    "This is great." .trim();

    ```


    我们留下了“This is great.”


    好的，不错！再来一个例子。假设你是互联网上的购物网站。用户购买了一个商品，你想感谢他们的购买。也许你会向他们显示这样的消息：


    ```java

    String itemName = "Everybody Poops" ;


    double price = 2.99 ;

    ```

