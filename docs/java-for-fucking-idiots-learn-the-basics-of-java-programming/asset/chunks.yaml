    \ double speed) {\n        //The actual code to fly\n    }\n}\n```\n\n## Method\
    \ to the Madness\n\nMethods help programmers turn a confusing mess of spaghetti\
    \ into reasonable chunks of code. For example:\n\n```java\nString translate(String\
    \ textToTranslate) {\n    cleanseInput(textToTranslate);\n    parseWords();\n\
    \    translateWords();\n    adjustPunctuation();\n    …\n    return translation\
    \ ;\n}\n```\n\n## Chapter 11: Strings\n\n### String theory\nA theoretical framework\
    \ where point-like particles are replaced by one-dimensional objects called strings.\
    \ In Java, `String` is a highly powerful and de de-used variable type.\n\n###\
    \ What’s a string?\nA `String` is just text, like “abc” or “23890chusoao”, identified\
    \ by double quotes or the word `String`. `Strings` are special in Java, offering\
    \ many built-in methods.\n\n### Text\nTo represent a single character, you could\
    \ use `char`, but using `String` is often better:\n\n```java\nchar firstLetter\
    \ = 'A' ;\nString firstLetter = \"A\" ;\nString myName = \"Steve\" ;\n```\n\n\
    Under the hood, a `String` in Java is actually backed by a `char[]` array:\n\n\
    ```java\npublic final class String … {\n    //The value is used for character\
    \ storage.\n    private final char value [];\n    …\n}\n```\n\n### Numbers\nJust\
    \ because a value looks numerical doesn’t mean it should be an integer. For example,\
    \ phone numbers should be strings:\n\n```java\nlong jennysNumber = 5558675309L\
    \ ; // Not for adding!\nString jennysNumber = \"5558675309\" ; // Correct\n```\n\
    \n### Making a String\n`Strings` are objects with constructors. \n\n```java\n\
    String jennysNumber = new String( \"5558675309\" );\n```\n"
  raw: 'airplane.fly( 0 , 12552.854 );Yes, that last line will crash the airplane
    at an astonishing rate. Don’t worry, the fly method should make sure the argument
    passed is reasonable.It’s typically a good idea to overload your methods if you
    want to allow more customized behavior when the method is called, but also want
    to provide an easy way to call the method without passing so many arguments.Under
    the hood, you might even do something like this to make your code very reusable:class
    Airplane {


         void fly() {


            fly(currentAltitude);


        }


         void fly( int altitude) {


            fly(altitude, currentSpeed);


        }


         void fly( int altitude, double speed) {


             //The actual code to fly


         }


    }See how they’re calling each other? This is an example of how you can reuse your
    code without copy pasting!!!! It’s like a chain or something.Just want to start
    flying? Call fly and it will use the current altitude. Want to change the altitude?
    It will fly to that altitude with the current speed. Want to change both? Call
    the full fly method.Method to the MadnessObjects in Java do shit all the time.
    That’s why we write code after all; the program needs to do something valuable
    for us humans.Methods are helpful for more than just doing things on behalf of
    the object; they also let us programmers turn a confusing mess of spaghetti into
    a reasonable chunk of code.For example, remember Eugene? Do you think Eugene has
    just one method to perform his translation?Under the hood, that translate method
    could have been doing a whole litany of things:String translate(String textToTranslate)
    {


        cleanseInput(textToTranslate);


        parseWords();


        translateWords();


        adjustPunctuation();


        …


         return translation ;


    }Much better than a 1000-line method of the noodle variety.Divide your methods
    up to prevent method madness.Chapter 11: StringsString theory.A theoretical framework
    in which the point-like particles of particle physics are replaced by one-dimensional
    objects called strings.My string theory is that Strings in Java are the best variable
    type of all time. ALL TIME!What’s a string?You’ve seen ‘em. I’ve talked about
    ‘em. You probably have a general idea of what they are by now.It’s just some text,
    right? “abc” or “23890chusoao”? Aren’t those Strings?Yep. The double quotes “
    “ are what identify Strings. That or, you know…the word String. Duh.But Strings
    are super special in Java; not only are they extremely common, they have a ton
    of built-in methods that make them super powerful. And you oughtta know why Strings
    are the best. The kind of “oughta know” that Alanis Morisette would advocate.Anything
    that does not require math (addition, multiplication, that stuff) and is not a
    boolean (true or false) value should be a string 99.9% of the time, ISO (In Steve’s
    opinion)TextWant to represent a single character? You could use a char , right?char
    firstLetter = ''A'' ;Just use a String.String firstLetter = "A" ;Why bother using
    a primitive when you can get the real deal? Needless to say, if you need a string
    of characters, you’d use a String, too.String myName = "Steve" ;Did…did you just
    say a String of characters?Yep, that’s what a String is, at least under the hood.
    Somewhere inside how a String is made in Java there exists a char[].  In fact
    I just looked up the source code for String. Lookie!public final class String
    … {


         //The value is used for character storage.


         private final char value [];


         …


    }


       Picture a bunch of characters lined up, with a piece of string tying them together.
    Not all that firmly; you could snip the string if you wanted to. But they’re a
    unit!Yay, Strings!NumbersAnd numbers? Just because a value looks numerical doesn’t
    mean it should be an integer. Don’t get me wrong, lots of times you do need numbers
    to be ints or doubles (fuck floats). But not always!For example, phone numbers…long
    jennysNumber = 5558675309L ;You ain’t gonna be adding phone numbers together!
    Make it a string!String jennysNumber = "5558675309" ;


     Making a String“You just put some stuff inside two double quotes, I get it.”Well…I
    should tell you that theoretically you could do this. Don’t.String jennysNumber
    = new String( "5558675309" );Yep, Strings are objects. They have constructors.This
    constructor is absolutely useless, though. Seriously, more useless than nipples
    on a man.Java lets us use shorthand to simply put the value inside double quotes
    and lets that be the end of it.There are other ways you might need to create a
    String, though. For example, maybe you have an int but just absolutely need it
    to be a String.int foundThisInADatabase = 34897320 ;


    String strRepresentation = String. valueOf (foundThisInADatabase);You can use
    the static String.valueOf method to convert the int to a String. Same goes for
    pretty much any other type of variable. Neato!!String ComparisonsRemember the
    comparison operator? It’s two equals signs. Here, I’ll remind you.boolean isSeven(
    int number) {


        return number == 7 ;


    }System. out .println(isSeven( 5 ));We print out false because 5 ==7 is simply
    not true.Strings, though, should not be compared like that. Bad! Bad comparison
    operator!Let me show you why. For the purposes of this example, I will be using
    the String constructor instead of just some double quotes. Please, forgive me.String
    strOne = new String( "Ayy lmao." );


    String strTwo = new String( "Ayy lmao." );


    boolean sameString = strOne == strTwo;You’re on Who Wants to be a Millionaire?
    What is the value of sameString ? Just like the show, you can phone a friend if
    you’d like.


    1.  true


    2.  false


    3.  null


    4.  The program crashes


    First of all, a primitive cannot be null , so jot that down.But the answer is
    B: false ! Yep, those strings are not the same according to the comparison operator
    (double equals sign).We know they’re the same, however. So what’s the deal, why
    is it saying they’re not the same?When it comes to objects, the comparison operator
    == is literally checking “are these the same object?”Well, these aren’t. You created
    two different objects, right? strOne and strTwo . You failed.The lesson? Don’t
    use the comparison operator for Strings, or any object for that matter, if you’re
    trying to see if they’re the same value.How do we do it, then? Like this!boolean
    sameString = strOne .equals (strTwo);Bam! sameString is now true.SuperpowersAlright,
    maybe not superpowers, per se. But Strings are objects, as I said. You just saw
    the equals method that checks if two Strings have the same value.Unlike the trite
    and overly simplified examples we’ve used so far, the String’s superpowers are
    actually useful methods that accomplish actual things! Let’s check out some of
    them!!equalsWe just covered it, but just to reiterate: when you want to compare
    two strings, never use ==. Always use the equals method that all Strings have.boolean
    sameString = strOne.equals(strTwo);


     This is something you actually do a lot in Java. Did the user type in a certain
    word or sentence? Does it match a value we expected? Now we can do that with Strings!Thanks
    Java!@! Programming is fun.equalsignorecaseFor when you want to use equals but
    don’t care if the characters in the string are uppercase (A) or lowercase (a).//true


    "MEMES" .equalsIgnoreCase( "memes" );containsFor when you want to see if there’s
    a particular String inside your String. Maybe you’re Mark Zuckerberg and want
    to see if a user’s Facebook post contains “vaccines”.//true


    "Boy am I glad that vaccines were invented" .contains( "vaccines" );Note that
    contains is case sensitive. That means it cares about if the characters are uppercase
    or lowercase. i.e.//false


    "BOy I HatE HoW VACccINeS CauSe AUTisM!" .contains( "vaccines" );'
