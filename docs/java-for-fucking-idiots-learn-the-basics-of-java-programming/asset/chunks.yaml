    ability to refer to the parent class, but create the object using the child, is
    super cool and very common. And very polymorphic.Chapter 14: Bringing it togetherWhat
    have we learned? Did we hold all this information in our noggins? Well, I did.
    I wrote it. I already knew this. I did 0 original research and cited 0 sources.Anyways,
    if this were a high school English paper with a 1-3-1 format, it would be the
    final “1” conclusion part.What’s the big idea?Java is a piece of shiJava lets
    us write programs that often feel like more of an art project than any sort of
    mathematical process.The goal is to create a piece of software that accomplish
    what it sets out to do, whether that be a mobile app, website, or piece of shit
    “Hello, World” app that is as straightforward, easy to read, and functional as
    possible.I believe that Java makes this easy with how it absolutely enforces you
    use classes, and therefore Objects that keep the code clean and maintainable…
    at least when in the hands of a good developer.Even though I flew through some
    of the low-level parts of Java, I hope you got a general idea of what each basic
    part of the language is, why it exists, and how you might get started with it.Remember
    that Google is your friend, and anything you want to know is a series of frustrating
    web searches away.Okay, with that little tidbit out of the way…let’s revisit what
    we’ve learned…From the top!Can I summarize an entire introductory Java book with
    a numbered list?“Let’s find out.” – Mr. Owl, of the Tootsie Roll Tootsie Pop


    1.  Computers understand “machine language”. We don’t write this ourselves; we
    use a programming language to write in a format us mere mortals can understand.


    2.  Java as a programming language is not directly compiled or converted to machine
    language like most languages. It compiles to “bytecode” which is run on the Java
    Virtual Machine, which itself runs on the actual computer. “Write once, run anywhere.”


    3.  Java developers use a Java Development Kit (JDK) to compile their code, and
    to use stuff provided inside the Java Standard Library, like Strings, networking,
    math, UI, etc.


    4.  Java is fiercely devoted to Object Oriented Programming, where code is divided
    into logical chunks called classes. These classes act as blueprints, from which
    we create Objects. The objects interact with each other in intuitive ways to create
    maintainable, easy-to-understand, and valuable software. Hopefully.


    5.  Objects have properties; nouns like numbers, words, lists, or other data that
    pertain to the object and describe what it is . An Airplane could have a speed,
    a Book could have a price, a Person could have a Head.


    6.  In general, variables are things that have values, like a number, piece of
    text, list, or even an entire Object.'
