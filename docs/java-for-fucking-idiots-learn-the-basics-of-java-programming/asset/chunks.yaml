    觉得太简单了？这很“逻辑化”，对吧？懂了吗？逻辑（Logical）？因为它们被称为逻辑-噢（logic-Oh），就像数学运算符一样；不，你不应该创建一个始终为
    `true` 或始终为 `false` 的变量。它们是变量。但我现在正试图把这个概念传达达，明白？等我们进入条件判断和 `if` 语句时会讨论。


    ## 赋值运算符


    “现在，男士们准备好接受你们的超……特殊的……秘密……任务了吗！？！你们两个要给我房子的内部刷漆！！耶耶耶！！” – 海绵宝宝


    是的，你已经见过这个东西了（它就是等号 `=` ），但我们将介绍它，以消除学者可能会产生的误解。


    回想一下你以前学校的代数课。你可能已经不记得了。不，不是关于三角形的那个……这个听起来眼熟吗？


    `x = 7`


    你会怎么大声读它？可能是这样的：“x 等于 7”。


    在 Java 中你可以做非常相似的操作。看这行代码


    ```java

    int x = 7 ;

    ```


    这和之前的一样的，对吧？“x 等于 7”？？错误！不对！否定！想知道为什么吗？如果我给你看这个呢？


    ```java

    int x = 1 ;

    ```


    好的，`x` 是 1……`x = x + 1` 唔……好的，现在 `x` 等于……`x + 1`？？等等……如果 `x` 是 1，那么意味着 `1 = 1
    + 1`？？这意味着 `1 = 2` ？？希望你的大脑已经从沉睡中醒来，并对着页面尖叫：“这不可能！这完全没意义！他们为什么要搞这么乱？”


    `=` 并不是“等于”。因为在 Java 中，单等号是**赋值运算符**。它的工作原理是：左侧的内容被赋予右侧内容的值。你可以这样说：


    ```java

    int x = 7 ;

    ```


    “给 `x` 赋值为 7”


    `x = x + 1`


    “将 `x` 的当前值加 1 赋值给 `x`”


    猜怎么着？现在 `x` 的值是 8 了（震惊表情）。


    这似乎是一个细微的区别，不是吗？“给某物赋值”，与说“某物等于另一个东西”。但这个概念是一个神秘的妙妙工具；一个以后会帮助我们的惊喜工具。


    ## 关系运算符


    还记得箭头符号 `<` 和 `>` 吗？也许你被教过把它们想象成鳄鱼；鳄鱼的嘴指向较大的数字？也许吧？反正……在普通数学中这里是一些真陈述：


    `2 < 3` 小于 3。

    `3.5 > 4` 大于 4。


    酷。现在，这是错的。

    `5 > 5` 大于 5。


    它们的值相同；5 并不大于 5。错误，你现在一定在尖叫了！


    现在，如果我们把它写成这样呢？


    `5 ≥ 5`


    这是正确的。5 确实大于或等于值 5。语句 `5 ≥ 4` 也是正确的。


    既然我已经总结了你六年级代数课的所有内容，让我们来看看这在 Java 中是如何运作的。关系！


    ```java

    //True

    boolean itsSmaller = 2 < 3 ;


    //False

    boolean itsBigger = 3 > 4 ;

    ```


    我知道你在想什么。我胜有稳筹。那些运算符很简单！比较值以判断其中一个比另一个大还是小？哈！真是笑话。这家哥们一定觉得我是个完全的白痴。好吧，没错，重点就在这里。


    但还有更多的变数要向你袭来了。记得我上面提到的“或等于”部分吗？在普通的数学中，那是给箭头符号加下划线，像这样：`≥`


    你可以将等号与比较运算符之一结合起来形成相同的内容；一种更疯狂的关系检查


    ```java

    //True

    boolean itsBiggerOrTheSame = 5 >= 5 ;


    //False

    boolean itsSmallerOrTheSame = 3 <= 2 ;

    ```


    当然，把等号放在箭头后面不像在代数中那样加下划线那么“酷炫”。但在 Java 中就是是这么做的。你可以继续尝试这些内容，但你可能已经掌握要窍了。是的，我想可以说这是一种赞美。继续加油，伙计。编程如此简单难道不不可思议吗！！！！你太聪明了！还是个极好的读者！另外，你给这本书打
    5 星评了吗？


    ## 比较运算符


    如果你把两个等号放在一起会发生什么呢：思考表情：答案是，妈妈等号和爸爸等号结合在一起，形成了一个新运算符；**比较运算符**！这就是我之前关于单等号 (=)
    意思是“赋值”而不是“等于”的那些插话真正发挥作用的地方。所以我希望你一直留住了那个神秘的妙妙工具！


    好的，假设我们不想给变量赋值。相反，我们想检查一个变量是否等于一个值。顺便说一下，这是超级超级常见的。


    ```java

    //True

    boolean isSameCharacter = 5 == 5 ;


    //False

    boolean isSameNumber = 5 == 4 ;

    ```

