    # Java Programming Basics


    7. You can declare a variable, like `int x;`; then assign it a value later with
    an equals sign like `x=5;`. Or you can declare and assign at the same time, like
    `int x = 5;`.


    8. All variables in Java are “strongly typed” meaning they absolutely, positively,
    must have a data type (like `int`, `char`, `String`, etc) and it can never change.


    9. Classes have methods; or things that the object does … they’re verbs that can
    calculate, compare, display, or anything else that is an action. A `MemeListScreen`
    might `refreshMemes()`, a `RemoteController` might `sendButtonPressToTV()`, a
    `Driver` might `checkBlindSpot()`.


    10. The `main` method is a special method every Java program must have, which
    is the first method run in every Java program (automatically by the Java Virtual
    Machine).


    11. `Strings` are classes built-in to Java that are used all the time, with methods
    like `toLowerCase`, `equals`, `contains`, `substring`, and `trim`.


    12. There are special characters called “operators” built into Java that perform
    basic functions, like add (`+`), subtract (`-`), OR (`||`), AND (`&&`), compare(`>`,
    `>=`, `<`, `<=`, `==`), and more. From these we can build powerful functions.


    13. When a program needs to change what it does based off some condition, like
    user input, value of a variable, etc. it uses conditionals, or `if` statements.
    Inside those conditionals, the code only runs if the condition is considered to
    be true.


    14. Conditionals can be made even more special with “else if” block which execute
    under some secondary condition, or “else” blocks which execute if none of the
    other conditions are true.


    15. `Arrays` are boxes that can contain multiple values, like an array of `Strings`,
    or an array of numbers. They must have the same size forever and ever. The first
    item in the array is at index `0`.


    16. Loops are ways to run the same code repeatedly, at long as some condition
    is true. A `while` loop just keeps running under that condition, and a `for` loop
    is a souped-up version with a built-in way to keep track of how many times you’ve
    looped, and what to do after a loop.


    17. A class becomes an object through “instantiation” or by creating an “instance”
    of that class. You use the `new` keyword to accomplish this. Note: an instance
    and an object are the same thing; a class brought to life.


    18. When a class is being “instantiated”, its constructor is used to build the
    class. A custom constructor can be made that is given instructions in the form
    of “parameters”, or variables passed into the constructor’s parentheses `()`.


    19. Classes are grouped together into packages, such as `com.example.mypackage`.
    A class in that package would say `package com.example.mypackage;` at the top
    of the file.


    20. Classes that want to use classes from other packages (very common) must import
    them first, with a line like `import java.util.ArrayList`.


    21. A class can “extend” another class to reduce code duplication and provide
    a more specific piece of functionality than the parent. This is called inheritance.
    `Dog` might extend `Animal`.


    22. We can create a variable with the data type of the parent, but the constructor
    of the child class. Java will still know to call the child’s methods when the
    parent’s methods are called. This is called polymorphism.


    23. Abstraction is the tactic of exposing only what needs to be exposed about
    what a class does and how it does it. Every class does not need to see how the
    other class’s sausage is made.


    24. Encapsulation is a way of enforcing abstraction with access modifiers, `public/protected/private/default`.
    Most things should be kept private to prevent other classes from seeing them.


    25. You are no longer a fucking idiot in Java programming. You might still be
    a beginner, but you are now prepared to get your feet deeper in the Java swimming
    pool.


    ## Final Thoughts

    Thanks for reading. I hope you had a good chuckle here and there and learned something
    along the way. If you wouldn’t mind leaving a review, I’d greatly appreciate it
    (positive or negative). You can also email me your feedback at `scbWriterGuy@gmail.com`.
    This is my first attempt at writing anything past the required page count for
    a college essay, so I’ll take all the help I can get. Papa bless, and good luck.

    '
