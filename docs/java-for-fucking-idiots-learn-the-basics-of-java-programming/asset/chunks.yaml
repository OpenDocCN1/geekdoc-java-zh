    \ I’m not pasting a bit chart here. If you find yourself needing to make a `String`\
    \ that contains variables in it, use your Google-fu to [find the table online](https://dzone.com/articles/java-string-format-examples).\
    \ Or just use `%s` to treat everything as a `String`. :)\n\n## Strings are Immutable\n\
    \nWhat does immutable mean? Does it describe your remote when you’re watching\
    \ TV and need to mute it, but it just won’t work? No. It means `Strings` cannot\
    \ be changed.\n\nConcatenation? That created a new `String`. Any time you use\
    \ one of the `String` methods we’ve seen? They created new `Strings`. You need\
    \ to make sure you’re not expecting the `String` to change by using one these\
    \ these methods. Instead, you must expect Java to create a new `String` from the\
    \ shit you’re asking it do.\n\n```java\nString initialString = \"Ah, hello there.\"\
    \ ;\n\ninitialString.toUpperCase();\n\nSystem. out .println(initialString);\n\
    ``` \n> “Ah, hello there.”\n\nSee? The string didn’t change to be in all upper-case.\
    \ Were you expecting Obi-Wan to be screaming “AH, HELLO THERE.”? Too bad.\n\n\
    Sure, we called the `toUpperCase()` method. But that does not modify the existing\
    \ `String` we made; it makes a new one with those modifications. And what did\
    \ we do with the `String` that was created when we called `toUpperCase()`? Nothing!\
    \ It vanished into the ether. We didn’t assign it to a variable or use it inside\
    \ a conditional.\n\nAnother failure:\n\n```java\nString sillyString = \"haha dank\
    \ memerinos!\" ;\n\nsillyString.substring( 5 );\n\nSystem. out .println(sillyString);\n\
    ```\n> “haha dank memorinos!”\n\nPlease kill me. But again, that `String` method\
    \ did not change the value of our `String`, it created a new one that we ignored.\
    \ We did not change `sillyString` to be “dank memerinos!”\n\nIn fact, if you look\
    \ at the methods available on the `String` class, none of the ones that “change”\
    \ or “modify” the `String` are `void`. Instead, Java creates a new `String` based\
    \ off the original one and returns that for you to use. Basically, you don’t need\
    \ to worry about why strings are “immutable”; just ensure you don’t find yourself\
    \ trying to change a `String` instead of creating new ones based off the original.\n\
    \nOh, and here’s how you’d properly write those examples:\n\n```java\nString initialString\
    \ = \"Ah, hello there.\" ;\n\nString initialStringUpper = initialString.toUpperCase();\n\
    \nString sillyString = \"haha dank memerinos!\" ;\n\n//Reusing the same variable\n\
    \nsillyString = sillyString.substring( 5 );\n```\n\n## Chapter 12: The Java Cinematic\
    \ Universe\n\n\"I know what it's like to lose. To feel so desperately that you're\
