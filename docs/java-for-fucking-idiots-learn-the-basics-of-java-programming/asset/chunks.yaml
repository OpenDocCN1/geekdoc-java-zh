  trans: "\n\n我们可以从用户界面类调用公共方法 `getOrderStatus`。而我们完全不知道底层正在发生这些复杂的网络操作。这就是封装的魅力所在；我们强制实现了抽象。如果其他类根本没有访问它的权限，它们就没法搞乱我们的事儿。\n\
    \n`private` 和 `public` 是访问修饰符。还有两种。如果你不指定，你的类、`method`（方法）或 `property`（属性）将被视为\
    \ `package private`（包私有）。这基本上是默认值。同一个包中的其他类可以看到你。`protected` 是它的特殊版本。不同之处在于子类也可以看到该方法或属性。\n\
    \n# 继承\n\n你更想要哪种形式“继承”？\n\n1. 来自你心爱的父母留下的几百万美元储蓄，他们很理财，把钱留给了孩子们。\n2. 他们的某些特征，比如发色、身高、性格……多动症抑郁……会骑单轮车、动耳朵的能力……\n\
    \n选 B 对吧？显而易见！谁需要钱，我不需要对吧？哈。哈哈哈。请给这本书打 5 星评价，并点赞、关注和订阅获取更多内容。\n\n## 什么是继承？\n\n\
    定义一个另一个类的更具体版本的类。定义一个作为“父类”“子类”的类。一种无需复制粘贴即可复用代码的方法。另一种以人类易理解的方式对我们的代码进行建模。\n\n\
    在 `Java` 中，`class`（类）并不会找到另一个类、挂钩并直接产生一个子类。对它们来说，不幸的是……子类是父类的特殊版本。子类继承父类的属性和方法。子类是父类的“子类”。\n\
    \n当你思考如何编写一个程序时，无论是网站、App、数据库工具、视频游戏还是大学作业，你经常会发现程序的许多部分将具有相似的特征。也许你的 App 会有很多不同的屏幕，它们共享相同的颜色或工具栏，或者以类似的方式显示信息。不需要在多个地方做相同的事情；声明一个名为\
    \ `Screen` 的类，然后为应用中的每个屏幕 `extend`（扩展）该类。\n\n也许你的视频游戏将有一许多不同类型的英雄和敌人，它们都可以造成伤害、受到伤害、死亡、复活、组队、使用技能等。你可以使用\
    \ `classes`（类）和 `inheritance`（继承）仔细地为代码建模，以尽量减少你的代码库变得多么巨大和混乱。\n\n## 如何继承？\n\n\
    我将从最简单的例子开始我们的第一个例子。\n\n```java\nclass Meme {\n\n}\n```\n\n继承，我们做到了！等一下……是谁继承了什么？这看起来像是一个空类。剧情反转！到为止我们创建的每一个类都继承自另一个类：`java.lang.Object`！如果你愿意，你也可以显式地继承\
    \ `Object` 类。\n\n```java\nclass Meme extends Object {\n\n}\n```\n\n但不要这样做。`Java`\
    \ 已经为我们完成了这一点。而且，是的，`Java` 说 `extends` 而不是“继承自”。不要尝试去 `extend` 你的父母，无论那是什么意思。\n\
    \n## 交配\n\n让我们创建一些属于我们自己的实际继承：\n\n```java\nclass Monster {\n    int health = 10\
    \ ;\n    int damage = 2;\n\n    void attack(Monster monsterToAttack) {\n     \
    \   monsterToAttack.health -= damage ;\n    }\n}\n```\n\n在这里，我们有一个简单的 `Monster`\
    \ 类。从这个类创建的任何 `Monster` 初始都拥有 `10 health`、`2 damage` 以及攻击另一个怪物的能力。但我们正致力于制作 21\
    \ 世纪最伟大的怪物主题视频游戏。一个能与《宝可梦》或《巫师 3》相衡的作品！并不是所有的怪物都是一样的！让我们它变得更有趣；专门的子类 `Monster`\
    \ 类！\n\n首先是一个 `Goblin`（地鬼）。它的健康值较低，伤害也较低，因为妈死的地鬼总是是一群中最弱的。\n\n```java\nclass Goblin\
    \ extends Monster {\n    Goblin() {\n        health = 5 ;\n        damage = 1;\n\
    \    }\n}\n```\n\n我们在这里所做的是创建一个名为 `Goblin` 的新类，它继承自 `Monster`。它有自己的构造函数来指定其独特的值；`5\
    \ health` 和 `1 damage`。通过继承的魔法，它也可以 `attack`，因为它是一个 `Monster`。而 `Monster` 类是定义该方法的。是的，这意味着你可以这样做：\n\
    \n```java\nGoblin warts = new Goblin();\nwarts.attack(someOtherMonster);\n```\n\
    \n就这样！地鬼可以战斗了！喔！！！再来一个！这一个更强；一个大而强石魔。\n\n```java\nclass Golem extends Monster\
    \ {\n    Golem() {\n        health = 100 ;\n        damage = 9;\n    }\n}\n```\n\
    \n和之前的 `Goblin` 一样，我们不需要重新定义那些 `health` 和 `damage` 属性；父类已经定义过了。我们只是给它们分配了我们自己的值。好，最后一个。这一个不仅仅具有特殊的健康和伤害；它在攻击时会执行不同的事情！\n\
    \n```java\nclass Zombie extends Monster {\n    Zombie() {\n        damage = 3;\n\
    \    }\n\n    void attack(Monster monsterToAttack) {\n        super.attack(monsterToAttack);\n\
    \        health += damage ;\n    }\n}\n```\n\n看它的 `attack` 方法！它不仅攻击另一个怪物，还通过 `super.attack()`\
    \ 自愈！那是什么？`Zombie` 类继承？\n\n另一方面，想要完全替换父类功能的子类可以简单地永远不要调用 `super`。如果在 `Zombie`\
    \ 情况下这样做，僵尸会自愈但不会造成伤害（因为父类方法从未运行）。\n\n## 决战\n\n```java\nGoblin goblin = new Goblin();\n\
    Golem golem = new Golem();\n\nwhile (goblin.health > 0 && golem.health > 0){\n\
    \    goblin.attack(golem);\n    golem.attack(goblin);\n}\n```\n\n公平地，这两个将一直战斗，直到其中一个的健康值达到或低于\
    \ 0。请注意，子类可以添加自己的新方法；它们不必仅仅修改父类的方法；它们可以添加全新的功能 set。\n\n## 现实世界示例\n\n作为一个 Android\
    \ 开发者，我有点偏见，但我认为这些是一些相关的例子。\n\n- Android 屏幕的一个部分是一个 [Fragment](https://developer.android.com/reference/android/app/Fragment)。我们可以\
    \ `extend` `Fragment` 来创建一个我们自己的类，也许是一个 `ListFragment`，并将该用户界面连接到我们恨自己的理由列表。\n\
    - 整个屏幕本身是一个 [Activity](https://developer.android.com/reference/android/app/Activity)。我们可以\
    \ `extend` `Activity`，也许是一个 `MainActivity`，开始向 App 中添加我们自己的 fragment，使用父类 `Activity`\
    \ 的方法！\n- 用户可以编辑的输入字段，[EditText](https://developer.android.com/reference/android/widget/EditText)，它继承自\
    \ [TextView](https://developer.android.com/reference/android/widget/TextView)，后者只显示文本。`EditText`\
    \ 可以做 `TextView` 能做的一切以及更多……主要是编辑这些文本。\n- 我们可以通过扩展 [RoomDatabase](https://developer.android.com/reference/androidx/room/RoomDatabase)\
    \ 类在我们的 Android 设备上创建数据库。不需要尝试从零编写本地数据库来让自己丢脸，我们只需要继承这个类然后遵循规则即可。\n\n"
- fmt: "\nThat last example? Look at [how much code your special database class automatically\
    \ has](https://android.googlesource.com/platform/frameworks/support/+/refs/heads/androidx-master-dev/room/runtime/src/main/java/androidx/room/RoomDatabase.java)\
    \ , just from inheriting it. Hell yeah! Inheritance! There’s a lot more to uncover\
    \ here with inheritance honestly. Want to learn more about it from me? We’re gonna\
    \ need a bigger book.\n\n## Polymorphism\n\nProbably the biggest and scariest\
    \ word for people learning Java. And honestly, I would not be surprised if a lot\
    \ of people that program in Java full time don’t even know what it means. And\
    \ that’s not a knock against them. It’s both a tricky concept and a confusing\
    \ word. Okay, maybe slightly a knock against them. But not you. You will know.\
    \ I will force you to learn... if you voluntarily read.\n\n### What is polymorphism?\n\
    \nJava is smart sometimes. One thing it’s smart at is knowing which method to\
    \ call. It probably sounds easy. I have a class, and it has a method. I create\
    \ an instance of that class, and call that method. How could a programming language\
    \ get confused? When inheritance is involved, that’s when.\n\nLet’s harken back\
    \ to our Monster example. We wrote some code that looked like this:\n\n```\nGoblin\
    \ warts = new Goblin();\n```\n\nBut we can throw a massive curveball here. See\
    \ how the data type of the goblin variable is `Goblin`? And the constructor we’re\
    \ using is `Goblin()`? Since a `Goblin` is a `Monster`, we can instead do this:\n\
    \n```java\nMonster warts = new Goblin();\n```\n\nWhooooaaaa! They don’t have to\
    \ be the same? Nope! The data type on the left does not have to be the same as\
    \ the constructor you call on the right. The one on the right can be a child’s\
    \ constructor.\n\n### Why polymorphism?\n\nWhat does this get us? It’s a bit like\
    \ abstraction; we can abstract away what is behind the mask. Remember the `attack`\
    \ method on `Monster`?\n\n```java\npublic void attack(Monster monsterToAttack)\
    \ {\n    monsterToAttack.health -= damage ;\n}\n```\n\nThere’s a `Monster` being\
    \ passed to this method. Is it a `Goblin`? `Golem`? `Zombie`? Some other kind\
    \ of `Monster`? We don’t need to give a single shit. We can treat them all like\
    \ `Monsters`; Java will call the appropriate methods on the children without us\
    \ needing to care. Can you imagine how annoying it would be if there were different\
    \ types of `Lists`, `Monsters`, `Heroes`, `Screens`, `Coffee`, etc. and you had\
    \ to be able to account for all of them individually?\n\nJava uses polymorphism\
    \ to allow us to code against the parent data type of a class, while it takes\
    \ care of dynamically running the methods of the child implementation of that\
    \ class.\n\n```java\nclass Magikarp extends Monster {\n    Magikarp() {\n    \
    \    damage = 5000 0 ;\n    }\n    void attack(Monster monsterToAttack) {\n  \
    \      System. out.println( \"Magikarp used SPLASH! But nothing happened!\" );\n\
    \    }\n}\n```\n\nCheck that out. It’s a new kind of monster that does something\
    \ totally different when it attacks; nothing! Now, what happens if we run this\
    \ code?\n\n```java\nMonster fishy = new Magikarp();\nfishy.attack(goblin);\n```\n\
    \n*   Do we fail to compile?\n*   Do we splash and do 0 damage?\n*   Do we attack\
    \ and deal 50000 damage?\n*   Does Java call the “attack” method on the parent\
    \ class `Monster`, or the “attack” method on the child class `Magikarp`?\n\nMy\
    \ head. My poor, poor head. The answer is we splash around and nothing happens,\
    \ of course! Note that the data type of `fishy` is `Monster`. But we created a\
    \ new `Magikarp()`. Again, this ability for Java to call the child class’s method,\
    \ when the variable is created using the data type of the parent, is called polymorphism.\n\
    \n### Real examples of polymorphism?\n\nOne incredibly common use of polymorphism\
    \ in Java is `Lists`. I briefly mentioned these in the array section…to say I\
    \ wouldn’t be covering them. But for this section, I will if only for a moment.\n\
    \n```java\nList firstList = new ArrayList ();\nList secondList = new LinkedList\
    \ ();\nfirstList.add( new Goblin());\nsecondList.add( new Goblin());\n```\n\n\
    These two “implementations” of a `List`, [`ArrayList`](https://docs.oracle.com/javase/8/docs/api/java/util/ArrayList.html)\
    \ and [`LinkedList](https://docs.oracle.com/javase/8/docs/api/java/util/LinkedList.html)\
    \ , manage their contents very differently; one has an array under the hood, the\
    \ other has a confusing series of nodes. But it doesn’t matter; once you’ve declared\
    \ those variables as `Lists`, you can interact with them in the same way.\n\n\
    Another one, this Android related: I create several screens in my Android app\
    \ that extend from the `Activity` class. Android itself might store these as an\
    \ array of `Activities`:\n\n```java\nActivity[] currentActivities ;\n```\n\nWhen\
    \ the app is closed, Android loops through those activities, and lets us know\
    \ the screen is being destroyed.\n\n```java\nfor (Activity activity : currentActivities\
    \ ) {\n    activity.onDestroy();\n}\n```\n\nJava and Android don’t care if it’s\
    \ a screen for translating text, or a screen that shows your current GPS coordinates.\
    \ It doesn’t care if it has a million lines of code, or 3. It doesn’t care if\
    \ your subclass.\n\n## Chapter 14: Bringing it together\n\nWhat have we learned?\
    \ Can I summarize an entire introductory Java book with a numbered list?Let’s\
    \ find out.” – Mr. Owl, of the Tootsie Roll Tootsie Pop\n\n1. Computers understand\
    \ “machine language”. We don’t write this ourselves; we use a programming language\
    \ to write in a format us mortals can understand.\n2. Java as a programming language\
    \ is not directly compiled or converted to machine language like most languages.\
    \ It compiles to “bytecode” which is run on the Java Virtual Machine, which itself\
    \ runs on the actual computer. “Write once, run anywhere.”\n3. Java developers\
    \ use a Java Development Kit (JDK) to compile their code, and to use stuff provided\
    \ inside the Java Standard Library, like Strings, networking, math, UI, etc. low-level\
    \ parts of Java, I hope you got a general idea of what each basic part of the\
    \ language is, why it exists, and how you might get started with it. Remember\
    \ that Google is your friend, and anything you want to know is a series of frustrating\
    \ web searches.\n4. Java is fiercely devoted to Object Oriented Programming, where\
    \ code is divided into logical chunks called classes. These classes act as blueprints,\
    \ from which we create Objects. The objects interact with each other in intuitive\
    \ ways to create maintainable, easy-to-understand, and valuable software. Hopefully.\n\
    5. Objects have properties; nouns like numbers, words, lists, or other data that\
    \ pertain to the object and describe what it is . An Airplane could have a speed,\
    \ a Book could have a price, a Person could have a Head.\n"
