  trans: "\n\n# Java 编程语言本身在哪里？我该如何安装它？\n\nJava 语言其实只是一堆规则。它规定了我们如何组合单词和字符，以便编译器能够理解它们。你不需要“安装”Java\
    \ 编程语言。这就像是在写论文之前先“安装”英语一样。\n\n你可以在记事本中编写 Java 程序，将其保存为名为 `Hello.java` 的文件，然后编译它并在\
    \ `JVM` 上运行，完全没问题。\n\n利用你的 Google 技能从 Oracle 官网下载 `JDK`（选一个让你满意的版本即可）。没错，就是 Google，那个搜索引擎。习惯它吧。搜索“Download\
    \ JDK”之类的内容。你需要的是 `JDK`，而不是 `JRE` 或其他任何东西。\n\n当你拿到它时，请确保你已经同意了他们的法律协议，否则他们会让你进去坐一牢。\n\
    \n你应该能看到类似这样的界面：![](img/rsrc6R.jpg)\n\n没错，Java 8 现在的已经是老古董的东西了，但它目前对我来说还够用。不管，如果你用的是\
    \ Windows，就下载 Windows x64 版；如果你用的是 Mac，就下载 Mac 版。运行下载的程序。Java 现在已经安装好了；搞定，大功告。\n\
    \n## 集成式开发环境\n\n机械师有工具箱。木工有工具箱。技师也有酷酷的胸部……我的意思是，他们也有工具箱。\n\n我们程序员也有工具箱来帮助工作。那些重磅的被称为集成式开发环境（IDE），它们试图提供我们编写软件所需的一切功能，一站式解决方案。\n\
    \nMicrosoft Word 就像是写论文、散文、小说或大多数涉及文字处理任务的 IDE。它有表格、段落、字体颜色、字体大小、缩进、列表等工具，老天，功能多到你可能永远在需要时找找不到它们。\n\
    \n你不会用 Word 来写代码。`IntelliJ` 和 `Eclipse` 是编写 Java 代码的 IDE 示例。\n\n像 `IntelliJ` 这样的\
    \ IDE 可以帮助我们编写源码、编译、运行、共享、测试、重写，凡是你想到的都可以。对于成为编程社会中一名高效成员来说，它们至关重要。\n\n### 你应该用哪一个？\n\
    \n`IntelliJ`。去搜搜它。下载社区版（Community Edition）。继续你的生活吧。它很纯粹！\n\n虽然我认为了解手动编译和运行 Java\
    \ 代码是有价值的，但我不认为它适合这本书。不过，我会指引一个正确的方向。\n\n从命令提示符开始……\n\n```bash\njavac HelloWorld.java\n\
    ```\n会创建一个名为 `HelloWorld.class` 的字节码文件。\n\n```bash\njava HelloWorld\n```\n然后将使用生成的字节码运行该程序。\n\
    \n阅读更多：\n\n- [一些人关于命令行的博客文章](https://www.lifewire.com/command-prompt-2625840)\n\
    - [Oracle 文档](https://www.oracle.com/technetwork/java/compile-136656.html)\n-\
    \ [WikiHow，反正何不呢](https://www.wikihow.com/Compile-%26-Run-Java-Program-Using-Command-Prompt)\n\
    \n或者不看。我不在乎。除非你对如何在极底层、手动的层面学习编译和运行 Java 代码有偏执症，否则你真的不需要停下来阅读关于这个话题的更多内容。\n\n\
    有些人人会认为这部分是“基础”，但我并不完全认同。诚然，它很基础，但初学者需要理解它才能开始写 Java 代码吗？要在不讨厌生活的情况下上手吗？不需要。用\
    \ IDE 就行。\n\n## 第 2 章：Hello, World!\n\n对于第一个程序，大多数人会写一个叫做“Hello, world!”的东西。以下是操作方法。\n\
    \n```java\nprint ( \"Hello, world!\" )\n```\n\n完成！哈，开玩笑的。那是 Python。我们现在处于 Java\
    \ 世界，这意味着我们需要付出双倍努力才能得到同样妈死的的结果。\n\n好了，这是你要做的。创建一个名为 `HelloWorld.java` 的文件，将以下内容放入其中：\n\
    \n```java\npublic class HelloWorld {\n    // 程序运行时调用\n    public static void main\
    \ (String[] args) {\n        System. out.println( \"Hello, world!\" );\n    }\n\
    }\n```\n\n编译它。运行它。\n\n程序输出了“Hello, world!”。哇。太棒了。这既无趣也没教你什么东西。我有点讨厌这个程序，但从某种意义上说，它是一种成年礼。\n\
    \n我有几点想要强调一下。不是用荧光笔，而是用文字。\n\n首先，在英语中，我们在句子末尾加句号。在 Java 中你不想这样做，因为句号的意思完全不同。相反，使用分号。这个就是分号：`;`\n\
    \n没错，就是那个你在英语中永远不知道该怎么用的东西；它是放在两个句子之间，在列表之前，还是在某些句子片段之间？等等，我刚刚用了一个；那正确吗？噢天天。\n\
    \n在 Java 中就简单得多。你那些执行操作的 Java“句子”被称为语句（statements），它们都以分号结尾。别担心，如果你忘了，Java 会到处吐出错误，然后你就会知道自己搞砸了。\n\
    \n噢，还有那些双斜杠 `//`？你在它们之后写的任何内容都会被 Java 编译器忽略。你可以写任何你想写的字。这被称为注释。如果你想写多行，使用单斜杠后跟着星号\
    \ `*`。\n\n## 第 3 章：对象\n\n“Ryan 使用了一个对象。” – Kelly 很多 Java 课程和教程都会谈到这个。类（class）是某个可以存在的蓝图。\n\
    - 它有属性（properties），描述它是什么\n- 它有方法（methods），描述它能做什么\n\n对象（object）是类的实例（instance）。意味着，它是被赋予了生命的类。例如，可能有一个类叫\
    \ `Douchebag`。它是 `Douchebag` 可能行为的模板。\n\n### 一 我写了一个 `Airplane` 类。\n- 它的属性有 `name`、`speed`\
    \ 和 `weight`。\n- 它的方法有 `takeoff()`、`land()`、`crash()` 和 `burn()`。\n\n我从 `Airplane`\
    \ 类创建一个实例（对象）。\n- 我给它命名为“Crash”，速度设为 420，重量设为 10000。\n- 我让飞机 `takeoff()` 和 `land()`。我不使用\
    \ `crash` 和 `burn` 方法。客气了各位。\n\n### 二 我写了一个 `Monster` 类。\n- 它的属性有 `name`、`damage`\
    \ 和 `health`。\n- 它的方法有 `fight()` 和 `die()`。\n\n我为 `Monster` 类创建了两个怪物对象。\n- 第一个叫“goblin”，有\
    \ 10 点 `health` 和 2 点 `damage`。\n- 第二一个叫“troll”，有 50 点 `health` 和 6 点 `damage`。\n\
    \n我让他们轮替互相 `fight()`战斗，这会降低对方怪物的生命值。当其中一个的生命值达到 0 时，我告诉它 `die()`。哎。\n\n### 三 我写了一个\
    \ `Book` 类。\n- `Book` 类的属性有 `title` 和 `stars`。\n- `Book` 类没有方法，因为它什么都不干。\n\n我写了一个\
    \ `Reader` 类。\n- `Reader` 类的唯一属性是 `currentBook`，它是一个 `Book`。\n- `Reader` 类的方法有\
    \ `read()` 和 `rate()`。\n\n"
- fmt: "\nWhew. Lots of buildup. What can we do with these classes?\n\nWell, maybe\
    \ I’ll create an object from the `Book` class and set its title to “Java for Fucking\
    \ Idiots”. I’ll create a `Reader` object and set the `name` property to “Chad”\
    \ and set its `currentBook` to the one I just created. I’ll run the `Reader` object’s\
    \ `read()` method, then its `rate()` method . The `rate()` method sets the book’s\
    \ `stars` property to 5, because Chad really seemed to enjoy it. Interesting.\n\
    \n# Object-Oriented Design\n\nJava, and Object-Oriented Design (which it tries\
    \ to follow like a religion), is a way to model the real world, but in code.\n\
    \nLet’s think of Amazon’s computer systems. The products that you buy every day\
    \ are objects, I guarantee it. The packages shipped to your door are objects.\
    \ Each stop the driver makes is an object. Your house is an object. The trip itself\
    \ is an object.\n\nSo what does a program look like in Java? A bunch of objects\
    \ interacting with each other in meaningful ways to make stuff happen.\n\nIn Java\
    \ land that could be a desktop computer program (each screen is an object, the\
    \ elements on the screen are objects), a web service (each network request made\
    \ over the internet is an object), data returned from a database is an object,\
    \ you name it.\n\nAnd while I can’t claim that every `Class` you write in Java\
    \ will be based off something in the real world, they will be nouns that have\
    \ properties and methods. Welcome to object-oriented programming! Enjoy your stay…bitch.\n\
    \n# Hello, world?\n\nNow, let’s back up a smidge see how this knowledge applies\
    \ to the “Hello, World!” Program. Here it is for those of you with short-term\
    \ memory loss (probably most of you).\n\n```\npublic class HelloWorld {\n    public\
    \ static void main (String[] args) {\n        System. out .println( \"Hello, world!\"\
    \ );\n    }\n}\n```\n\nLet’s see…. there’s a class called `HelloWorld`. There’s\
    \ a method called `main()`. And…well….Uhh…Um:thinking: emojiHm… what does “Hello,\
    \ World!” have to do with object-oriented programming?\n\nSpoiler: it really doesn’t…\
    \ no objects here. It’s demonstrating one of the few concepts in Java that are\
    \ not object-oriented: static methods. Ones that exist outside the realm of objects.\
    \ God dammit Java. Why can’t your “Hello, world!” program be less stupid?\n\n\
    But I should calm down. It’s bad for my health. Let’s talk about what’s really\
    \ happening in the `main` method.\n\n## Main method\n\n“Who do you think you are?\
    \ What gives…what gives you the right?” – Michael Scott\n\nThe `main` method is\
    \ the entry point to the program; when the program is run, the `main` method is\
    \ run. The line of code that has the words “Hello, World!” is inside the `main`\
    \ method. Anything you put between those curly braces {} is inside the `main`\
    \ method, actually.\n\n```\npublic class HelloWorld {\n    public static void\
    \ main (String[] args) {\n        System. out .println( \"Hello, world!\" );\n\
    \    }\n}\n```\n\nWhy is there a “main` method? What makes it so special? The\
    \ `main` method exists because something needs to run when the program starts.\
    \ Remember the whole “which came first, the chicken or the egg” dilemma?\n\n*\
    \   Some say the chicken came first, because all eggs come from chickens.\n* \
    \  Some say the egg came first, because all chickens come from eggs.\n\nThe answer\
    \ in Java is that neither of those objects came first. The `main` method did.\
    \ Nothing can exist without the `main` method running first, outside of the realm\
    \ of objects. This is what that static bullshit means. Static properties and methods\
    \ exist without objects.\n\n“No object, no problem.” – the `static` keyword\n\n\
    Alternatively…\n“Don’t make things static unless you have to because objects are\
    \ good.” – me\n\nIf you’re not 100% on this yet, don’t worry about it too much.\
    \ Only a little bit. Okay , you might be thinking. But what about that other stuff\
    \ in front of the word `main`? `public`? Or `void`? This is just confusing.\n\n\
    I will cover this more thoroughly later in the book. But I’ll briefly answer this\
    \ now as well because I hate when you want to know something, and the author is\
    \ just like “hold on we’ll get there.” Bitch I’ll tell you now.\n\n*   Putting\
    \ `public` in front of something says that all the other classes, even in different\
    \ folders, can see it. You could also describe some of your code as `private`\
    \ if it is going to the bathroom and needs privacy or something, but not the `main`\
    \ method! It’s always out in public!\n*   Putting `void` in front of some code\
    \ means that it does some cool shit but doesn’t report back. No one asks the `main`\
    \ method to say if things went well or not, or for the value of some math calculation.\
    \ `Main` method doesn’t care if anyone knows.\n\nGot it? If not, read those explanations\
    \ one more time.…Okay, fine you’re not going to. I’ll summarize even more briefly:\n\
    \n1.  The `main` method is how Java begins running your program.\n2.  The `main`\
    \ method is `static` because something needs to exist outside of the realm of\
    \ objects. And the developers of Java said so.\n3.  The `main` method is `void`\
    \ because it doesn’t need to provide a value to whoever is running it. And the\
    \ developers of Java said so.\n4.  The `main` method is `public` because it will\
    \ be called by someone outside of this folder, namely Java. And the developers\
    \ of Java said so.\n\n# Declaring a class\n\nLet’s leave “Hello, World!” in the\
    \ dust where it belongs, and I’ll explain how you declare a class:\n\n```java\n\
    class Book {\n}\n```\n\nNeat! Mission accomplished.\n\nOkay, so we have a basic\
    \ class declared.\n\nHowever, classes are pretty useless when they’re empty like\
    \ that. Let’s add a property .\n\n```java\nclass Book {\n    String title ;\n\
    }\n```\n\n# Properties\n\nWhat would properties be in the real world? No, not\
    \ the Monopoly kind of properties. Let’s ask the dictionary. Property: “an essential\
    \ or distinctive attribute or quality of a thing.”\n\nYep. That’s about right\
    \ in Java too. We call `title` a property because it pertains to a class. It’s\
    \ the book’s name. It doesn’t exist without the book. We can add some more properties:\n\
    \n```java\nclass Book {\n    String title ;\n    String content ;\n    String[]\
    \ chapterNames ;\n    int bookmarkedPage ;\n    double averageRating ;\n    boolean\
    \ hasSequel ;\n    Author author ;\n}\n```\n\nAnyway, starting to get the big\
    \ idea? A class can have information associated with it called properties. And\
    \ just to remind you – those properties will be specific to each object created\
    \ from this class. I could create 500 books, and they’d each have a different\
    \ `title` property. I’d probably write a good one, eventually.\n\n# Reading and\
    \ writing 101\n\nIn Java, you can interact with those properties using a period.\
    \ It’s called “dot notation.” Let’s say I have an instance of the `Book` class\
    \ called `bestBook`. This is an actual `Book` object , created from the `Book`\
    \ class. Here’s how I could play around with its properties.\n\n```java\nbestBook.\
    \ title = \"How to Become a Fancy Waiter in Less Than 20 Minutes\" ;\nbestBook.content\
    \ = \"Forget everything that isn’t fine dining. And breathing.\";\nbestBook. averageRating\
    \ = 5.0 ;\n\nSystem. out .println(bestBook. title );\n```\n"
  raw: 'Whew. Lots of buildup. What can we do with these classes?Well, maybe I’ll
    create an object from the Book class and set its title to “Java for Fucking Idiots”.I’ll
    create a Reader object and set the name property to “Chad” and set its currentBook
    to the one I just created.I’ll run the Reader object’s read() method, then its
    rate() method .The rate() method sets the book’s stars property to 5, because
    Chad really seemed to enjoy it. Interesting.Número we’re doneJava, and Object-Oriented
    Design (which it tries to follow like a religion), is a way to model the real
    world, but in code.Let’s think of Amazon’s computer systems. The products that
    you buy every day are objects, I guarantee it. The packages shipped to your door
    are objects. Each stop the driver makes is an object. Your house is an object.
    The trip itself is an object.So what does a program look like in Java? A bunch
    of objects interacting with each other in meaningful ways to make stuff happen.In
    Java land that could be a desktop computer program (each screen is an object,
    the elements on the screen are objects), a web service (each network request made
    over the internet is an object), data returned from a database is an object, you
    name it.And while I can’t claim that every Class you write in Java will be based
    off something in the real world, they will be nouns that have properties and methods.Welcome
    to object-oriented programming! Enjoy your stay…bitch.Hello, world?Now, let’s
    back up a smidge see how this knowledge applies to the “Hello, World!” Program.Here
    it is for those of you with short-term memory loss (probably most of you).public
    class HelloWorld {


         public static void main (String[] args) {


            System. out .println( "Hello, world!" );


        }


    }Let’s see…. there’s a class called HelloWorld . There’s a method called main()
    .  And…well….Uhh…Um.:thinking: emojiHm… what does “Hello, World!” have to do with
    object-oriented programming?Spoiler: it really doesn’t… no objects here.It’s demonstrating
    one of the few concepts in Java that are not object-oriented: static methods.
    Ones that exist outside the realm of objects. God dammit Java. Why can’t your
    “Hello, world!” program be less stupid?But I should calm down. It’s bad for my
    health. Let’s talk about what’s really happening in the main method.Main method“Who
    do you think you are? What gives…what gives you the right?” – Michael ScottThe
    main method is the entry point to the program; when the program is run, the main
    method is run.The line of code that has the words “Hello, World!” is inside the
    main method. Anything you put between those curly braces {} is inside the main
    method, actually.public class HelloWorld {


         public static void main (String[] args) {


            System. out .println( "Hello, world!" );


        }


    }Why is there a “main” method? What makes it so special? The main method exists
    because something needs to run when the program starts.Remember the whole “which
    came first, the chicken or the egg” dilemma?


    *   Some say the chicken came first, because all eggs come from chickens.


    *   Some say the egg came first, because all chickens come from eggs.


    The answer in Java is that neither of those objects came first. The main method
    did.Nothing can exist without the main method running first, outside of the realm
    of objects.This is what that static bullshit means. Static properties and methods
    exist without objects.“No object, no problem.” – the static keywordAlternatively…“Don’t
    make things static unless you have to because objects are good.” – meIf you’re
    not 100% on this yet, don’t worry about it too much. Only a little bit.Okay ,
    you might be thinking. But what about that other stuff in front of the word main
    ? public ? Or void ? This is just confusing.I will cover this more thoroughly
    later in the book. But I’ll briefly answer this now as well because I hate when
    you want to know something, and the author is just like “hold on we’ll get there.”
    Bitch I’ll tell you now.


    *   Putting public in front of something says that all the other classes, even
    in different folders, can see it. You could also describe some of your code as
    private if it is going to the bathroom and needs privacy or something, but not
    the main method! It’s always out in public!


    *   Putting void in front of some code means that it does some cool shit but doesn’t
    report back. No one asks the main method to say if things went well or not, or
    for the value of some math calculation. Main method doesn’t care if anyone knows.


    Got it? If not, read those explanations one more time.…Okay, fine you’re not going
    to. I’ll summarize even more briefly:The main method is how Java begins running
    your program.The main method is static because something needs to exist outside
    of the realm of objects. And the developers of Java said so.The main method is
    void because it doesn’t need to provide a value to whoever is running it. And
    the developers of Java said so.The main method is public because it will be called
    by someone outside of this folder, namely Java. And the developers of Java said
    so.Declaring a classLet’s leave “Hello, World!” in the dust for now where it belongs,
    and I’ll explain in detail how you declare a class:class Book {


    }


       Neat! Mission accomplished.In fact, you could even do this:class Book {}


     Java doesn’t care about you pressing the enter key (creating a new line) or pressing
    the space bar (creating whitespace).In general, though, you don’t put curly braces
    on the same line like that, though. There’s no real estate market in Java land,
    so you can take up the space you need to make your code readable.But congratulations,
    you have a class. Proud of you!Oh, one more thing: they are always capitalized
    like that. If it needs to be more than one word, you capitalize the first letter
    of those words and smush them together. For example:class FantasyNovel {}PropertiesOkay,
    so we have a basic class declared.However, classes are pretty useless when they’re
    empty like that. Let’s add a property .class Book {


        String title ;


    }What would properties be in the real world? No, not the Monopoly kind of properties.
    Let’s ask the dictionary.Property: “an essential or distinctive attribute or quality
    of a thing.”Yep. That’s about right in Java too.We call title a property because
    it pertains to a class. It’s the book’s name. It doesn’t exist without the book.
    We can add some more properties:class Book {


        String title ;


        String content ;


        String[] chapterNames ;


         int bookmarkedPage ;


         double averageRating ;


         boolean hasSequel ;


        Author author ;


    }The book has a title, its actual content, chapter names… a number representing
    the page that the reader bookmarked… a rating to show in a store…Anyway, starting
    to get the big idea? A class can have information associated with it called properties.And
    just to remind you – those properties will be specific to each object created
    from this class. I could create 500 books, and they’d each have a different title
    property. I’d also probably write a good one, eventually.Reading and writing 101In
    Java, you can interact with those properties using a period. It’s called “dot
    notation.”Let’s say I have an instance of the Book class called bestBook . This
    is an actual Book object , created from the Book class.Here’s how I could play
    around with its properties.bestBook. title = "How to Become a Fancy Waiter in
    Less Than 20 Minutes" ;


    bestBook. content = "Forget everything that isn’t fine dining. And breathing."


    bestBook. averageRating = 5.0 ;


    System. out .println(bestBook. title );'
