    \ `Networker` 类。为什么我们不能从这个类创建对象呢？为什么我们不能随心所欲地“实例化”它呢？\n\n因为 Java 需要你对其进行“导入（import）”。除非你想使用的类与你的类在完全相同的包中，否则你必须在\
    \ Java 文件的顶部添加 import 语句。还记得包声明（package declarations）吗？那是一个简单的单行语句，指定类所属的包。在它的下方（基本上仍然在文件的顶部），你只需要从该文件外部导入所有需要的类。\n\
    \n```java\npackage com.amazon.app.productlist;\n\nimport com.amazon.app.shared.networking.Networker;\n\
    ```\n\n现在，对于类的其余部分，你可以创建新的 `Networkers` 了！尽情发挥吧！去连接到存在过的每一个网站吧！喔哦呜呜呜！咳。没错，这就是你如何从项目的其他部分导入类的方法。但同样的规则也适用于使用\
    \ Java 自带的类。\n\n为了好玩，假设我想生成一个随机数。与其自己写一个类或函数来完成任务，我可以使用 Java 标准库中的 `Random` 类。但我不能像那样直接创建一个\
    \ `Random()`！我必须导入它。在我的文件顶部……\n\n```java\nimport java.util.Random;\n```\n\n然后在我的其中一个函数中，我就可以搞定了！\n\
    \n```java\nRandom randomNumberGenerator = new Random();\n\nint randomInt = randomNumberGenerator.nextInt();\n\
    ```\n\n太棒了！我的记忆力像金鱼一样，所以我需要记住每个想用到的类的完整包名吗？不需要！你只需要知道类的名称，在代码中开始输入它，然后使用你像 IntelliJ\
    \ 这样超级强大的 IDE（优惠码 Steve）来自动导入你需要的类。导入类（Import class）。它会将导入语句添加到你类的顶部。砰，搞定。\n\n\
    ### 导入导入一切\n看到上面我们是如何导入 `Random` 类的吗？我们可以使用星号 `*` 导入 `java.util` 包中的每一个类。\n\n\
    ```java\nimport java.util.*;\n```\n\n没错。现在这个类可以使用 `java.util` 包中的任何类。得益于 IntelliJ\
    \ 等其他软件提供的这种“防金鱼式”导入管理方法，几乎没有理由这样做。但这样导入是完全可能的。\n\n### 规则的例外？\n在本书中我们一直在使用一个类，但我们从未需要导入它。你能猜出它是什么吗？它和“我真该死的什么都记不住”以及“当、当、当！”听起来很押韵。没错，它就是\
    \ `String` ！！为什么我们不需要导入 `String` 呢？\n\n我刚才才说过，如果一个类不在你的包中，你需要在使用它之前对其进行导入。我们知道\
    \ `String` 是一个类，因为我们讨论过它最重要的方法。怎么回事？我是撒谎的吗？\n\nJava 对我们耍了个小花招。他们悄地在每个 Java 文件中导入了一个特殊的包。那个包的名字是什么？阿尔伯特·爱因斯坦。不，是\
    \ `java.lang`；`String` 属于 `java.lang` 包。这意味着你不需要导入它。\n\n### 趣味事实\n如果你想让你周围的人都哭，你可以这样创建一个\
    \ `String`：\n\n```java\nString oofOuchOwie = new java.lang.String( \"Why?\");\n\
    ```\n\n### 这些就是规则\n再次强调一下，对于每一个 Java 文件：\n1. 文件名应与 Java 类匹配，并以 `.java` 结尾。\n2.\
    \ 文件应该存放在与包名匹配的文件夹结构中（仅用点分隔文件夹）。\n3. 文件顶部应该说明该类所属的包。\n4. 在包语句下方，文件应该导入它将要用到的每一个类。\n\
    \n# 第 13 章：面向对象概念\n为了结束这本书，我将为你简要介绍一些让语言成为“面向对象”的软件“设计”原则，仅仅是因为我很喜欢你。\n\n## 抽象（Abstraction）\n\
    你去餐厅。你点了一份非常美味、昂贵的晚餐。服务员离开了，20-30 分钟后带着你的菜回来。服务员是从哪里拿到食物的？是他自己做的吗？他是去商店买的吗？他是跑去街对面的餐厅从那里拿的吗？\n\
    \n当你点餐时，你不需要走进厨房，告诉厨师如何准备，微观管理他们如何互动，自己把食物放入烤箱，或者顺便去沃尔玛买餐厅卖光了的面包等。你只需要向服务员要菜；并预期他们会为你提供。服务员抽象了食物是如何准备的细节。\n\
    \n优秀的程序员创建这样的类。你可能有一个非常大、强大的程序，拥有几十个或数百个类来完成超级复杂的事情。也许你有一个程序可以计算地图上 A 点和 B 点之间旅行的最快路径。但你的用户界面需要直接与所有这些不同的类来计算路线吗？或者我们可以创建一个抽象掉所有复杂性的类？也许一个类只需要简单地接收地址\
    \ 1 作为一个 `String`，地址 2 作为一个 `String`，然后返回你需要执行的步骤数组（此处原文略有逻辑断层）。这正是抽象的精髓：暴露给其他类或系统的设计简化。\n\
    \n## 封装（Encapsulation）\n我们可以强制抽象。类可以简单地拒绝将自己暴露为公共（public）。感谢天谢如此。你可能是一个拥有 500\
    \ 个属性、1500 个方法以及全世界糟糕代码的类。但你知道吗？其他类不需要看到那些。它们不需要关心。封装是将我们的代码与其他类隔离开的一种方式。\n\n\
    假设我们经营一家比萨业务，让客户跟踪订单进度。客户使用安装在手机上的 App。该 App 需要通过互联网进行一些网络调用以获取更新。不，你不需要担心这些。这就是重点。假设这个该示例中使用的每个类都在完全不同的包中。\n\
    \n```java\nclass StatusScreen {\n    private Order order;\n    private Networker\
    \ networker;\n\n    public void showOrderStatus() {\n        String currentStatus\
    \ = networker.getOrderStatus(order.getId());\n        updateProgressBar(currentStatus);\n\
    \    }\n\n    private void updateProgressBar(String status) {\n        //更新进度条\n\
    \    }\n}\n```\n\n`private` 表示没有其他类知道如何更新屏幕上的进度条。只有 `StatusScreen` 可以调用这个方法。对它们来说是不可见的。将私有属性和方法视为与交互类“抽象”掉的内容。`public`\
    \ 表示任何其他类都可以调用这个方法。我们可能用户界另一个部分想要告诉这个屏幕显示订单状态。幸运的是，看起来 `Networker` 的 `getOrderStatus`\
    \ 方法是公共的，因为我们能够使用它。而且这是正确的；这就是 `Networker` 可能的模样：\n\n```java\npublic class Networker\
    \ {\n    public String getOrderStatus(String id) {\n        establishNetworkConnection();\n\
    \        makeRequest(id);\n        processResult();\n        return getStatusFromResult();\n\
    \    }\n\n    private void establishNetworkConnection() {}\n    private void makeRequest(String\
    \ id) {}\n    private void processResult() {}\n    private String getStatusFromResult()\
    \ {}\n}\n```\n\n"
- fmt: "\nWe get to call the public method `getOrderStatus` from our user interface\
    \ class. And we have no idea that all this complicated networking shit is happening\
    \ under the hood. This is the beauty of encapsulation; we’re forcing abstraction.\
    \ Other classes can’t fuck up our shit if they aren’t even allowed access to it.\n\
    \n`private` and `public` are access modifiers. There’s two other ones. If you\
    \ don’t specify one, your class, `method`, or `property` is considered `package\
    \ private`. It’s basically the default. Other classes in the same package can\
    \ see you. `protected` is a specialized version of that. Except a child class\
    \ can see that method or property as well.\n\n# Inheritance\n\nWhich “inheritance”\
    \ would you rather have?\n\n1. Several million dollars in savings from your beloved\
    \ parents who were responsible with their money and left it to their children.\n\
    2. Some of their traits, like hair color, height, personality… hyperactive depression…ability\
    \ to ride a unicycle, wiggle their ears….\n\nOption B, right? Obviously! Who needs\
    \ money, not me right? Ha. Ha haha. Please rate the book 5 stars and like, follow,\
    \ and subscribe for more content.\n\n## What is inheritance?\n\nDefining a class\
    \ that is a more specific version of another class. Defining a class that is the\
    \ “child” of a “parent” class. A way to reuse code without copy-pasting it. Another\
    \ way to model our code in an easy-to-understand way for humans.\n\nIn `Java`,\
    \ a `class` does not find another class, hook up, and just have a child. Unfortunately\
    \ enough for them… The child is a specialized version of the parent. The child\
    \ inherits the properties and methods of the parent. The child is a “subclass”\
    \ of the parent.\n\nWhen you’re thinking through how you want to write a program,\
    \ whether that be a website, app, database utility, video game, or college assignment,\
    \ you often will find many parts of the program will share similar traits. Maybe\
    \ your app will have a bunch of different screens that share the same color, or\
    \ toolbar, or will display information in a similar fashion. No need to do the\
    \ same thing in multiple places; declare a class called `Screen`, then `extend`\
    \ that class for each screen in your app.\n\nMaybe your video game will have a\
    \ bunch of different types of heroes and enemies, all of which can deal damage,\
    \ take damage, die, revive, party up, use abilities, etc. You can model your code\
    \ carefully using `classes` and `inheritance` to minimize how huge and confusing\
    \ your codebase can become.\n\n## How do inheritance?\n\nI’ll start really simple\
    \ for our first example.\n\n```java\nclass Meme {\n\n}\n```\n\nInheritance, we\
    \ did it! Wait, what…who is inheriting what? That looks like an empty class. Plot\
    \ twist! Every single class we’ve made so far has inherited from another class:\
    \ `java.lang.Object`! You could explicitly inherit from the `Object` class for\
    \ no reason, if you wanted to.\n\n```java\nclass Meme extends Object {\n\n}\n\
    ```\n\nBut don’t do that. `Java` does that for us. Also, yes, `Java` says `extends`\
    \ rather than “inherits from.” Don’t try to `extend` your parents, whatever that\
    \ means.\n\n## Coitus\n\nLet’s create some actual inheritance of our own:\n\n\
    ```java\nclass Monster {\n    int health = 10 ;\n    int damage = 2;\n\n    void\
    \ attack(Monster monsterToAttack) {\n        monsterToAttack.health -= damage\
    \ ;\n    }\n}\n```\n\nHere, we have a simple `Monster` class. Any `Monster` created\
    \ from this class starts off with `10 health`, `2 damage`, and the ability to\
    \ attack another monster. But we’re striving to make the greatest monster-themed\
    \ video game of the 21st century. One to rival the likes of Pokemon or The Witcher!!\
    \ Not all of them will be the same! Let’s make this more interesting; specialized,\
    \ child `Monster` classes!\n\nFirst, a `Goblin`. It will have lower health, and\
    \ lower damage, because fucking Goblins are always the weakest of the bunch.\n\
    \n```java\nclass Goblin extends Monster {\n    Goblin() {\n        health = 5\
    \ ;\n        damage = 1;\n    }\n}\n```\n\nWhat we did here was create a new class\
    \ called `Goblin` that inherits from `Monster`. It has its own constructor that\
    \ specifies its unique values; `5 health`, and `1 damage`. By the magic of inheritance,\
    \ it also can `attack`, because it is a `Monster`. And the `Monster` class is\
    \ the one who defined that method. Yep, that means you could do this:\n\n```java\n\
    Goblin warts = new Goblin();\nwarts.attack(someOtherMonster);\n```\n\nJust like\
    \ that! The Goblin can fight! Woo!!! Let’s make another one! This one will be\
    \ stronger; a big tough golem.\n\n```java\nclass Golem extends Monster {\n   \
    \ Golem() {\n        health = 100 ;\n        damage = 9;\n    }\n}\n```\n\nJust\
    \ like before, with the `Goblin`, we don’t need to define those `health` and `damage`\
    \ properties again; the parent already did. We’re just assigning them values of\
    \ our own. OK, one more. This one will do more than just have special health and\
    \ damage; it will do something different when it attacks!\n\n```java\nclass Zombie\
    \ extends Monster {\n    Zombie() {\n        damage = 3;\n    }\n\n    void attack(Monster\
    \ monsterToAttack) {\n        super.attack(monsterToAttack);\n        health +=\
    \ damage ;\n    }\n}\n```\n\nLook at its `attack` method! Not only does it attack\
    \ another monster, but it heals itself `super.attack()`! What’s that? Zombie class\
    \ inheriting?\n\nOn the other hand, child classes that want to completely replace\
    \ the parent functionality can simply never call `super`. If we did that in the\
    \ `Zombie` scenario, the zombie would heal itself but deal no damage (because\
    \ the parent method never ran).\n\n## Fight to the death\n\n```java\nGoblin goblin\
    \ = new Goblin();\nGolem golem = new Golem();\n\nwhile (goblin.health > 0 && golem.health\
    \ > 0){\n    goblin.attack(golem);\n    golem.attack(goblin);\n}\n```\n\nHonorably,\
    \ these two will fight until either of their health values reaches or falls below\
    \ 0. Do note that child classes can add new methods of their own; they don’t only\
    \ have to modify the parent’s methods; they can add entirely new suites of functionality.\n\
    \n## Real world examples\n\nI’m a bit biased as an Android developer, but I think\
    \ these are some relevant examples.\n\n- One part of a screen in Android is a\
    \ [Fragment](https://developer.android.com/reference/android/app/Fragment). We\
    \ can `extend` `Fragment` to create one of our own, maybe a `ListFragment`, and\
    \ wire that user interface up to our list of reasons to hate ourselves.\n- The\
    \ entire screen itself is often an [Activity](https://developer.android.com/reference/android/app/Activity).\
    \ We can `extend` `Activity`, maybe a `MainActivity`, to start adding our own\
    \ fragments to the app, using the parent `Activity`’s methods!\n- An input field\
    \ that the user can edit, an [EditText](https://developer.android.com/reference/android/widget/EditText),\
    \ `extends` from a [TextView](https://developer.android.com/reference/android/widget/TextView),\
    \ which just displays text. An `EditText` can do everything a `TextView` can and\
    \ more …mostly editing that text.\n- We can create a database on our Android device\
    \ by extending the [RoomDatabase](https://developer.android.com/reference/androidx/room/RoomDatabase)\
    \ class. No need to embarrass ourselves trying to write a local database from\
    \ scratch, we just have to inherit from this class then follow the rules.\n"
