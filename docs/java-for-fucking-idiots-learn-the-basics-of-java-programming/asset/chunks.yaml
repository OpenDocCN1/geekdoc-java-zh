    \n问题是我们的 `translate` 方法是 `void`（空类型）。`void` 方法在执行完成后不会向我们提供任何数据。它们只是做了一些事情，然后结束了。这就像发送了短信却没有收到回音，无论你多么希望他们能赶紧他妈地回复。\n\
