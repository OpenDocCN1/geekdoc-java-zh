  trans: "\n\n它字面上就是 `package` 单词，后面跟着 Java 文件所在的目录。哦，还有一个分号。是的，这个类目前什么都没做。它只是一个 `main`\
    \ 方法。也许如果我们真的开发了这个东西，我们会打开一个新窗口并向用户显示一个表情包（memes）列表。目前我主要关注包（packages），谢谢大家。\n\
    \n## 俄罗斯套娃\n你可以在文件夹内部继续创建文件夹。因此，可以在包内部继续创建包。就像那些俄罗斯套娃，一个俄罗斯套娃里面套着俄罗斯套娃，里面再套着……\n\
    \n我确实提到过我们可能会向用户显示一个表情包列表，因为这是一个表情包商店。让我们添加一个名为 `list` 的新包，并在里面放入一个 `MemeListScreen`\
    \ 类![](img/rsrc1W6.jpg)\n\n好了，我们创建了那个新包（字面上就是一个文件夹），并创建了一个名为 `MemeListScreen.java`\
    \ 的新 Java 文件。\n\n```java\npackage app.list;\n\npublic class MemeListScreen {\n\
    \n}\n```\n\n### 理解包的结构\n惊喜吧，它实际上什么都不是。但请注意这一行包定义。看到那里的点了吗？这表示该类属于 `app.list` 包，而它是它所在的目录结构。\n\
    \n例如，如果我们继续这样操作，在 `list` 文件夹内部，我们可以创建一个 `options` 文件夹。然后在 `options` 文件夹内部，我们可以再创建一个\
    \ `about` 文件夹。然后我们就可以在 `app.list.options.about` 包中有一个类。也许它叫 `AboutMemeStoreScreen`\
    \ 之类的什么鬼名字。我不知道。\n\n该类会在文件顶部放置如下内容：`package app.list.options.about;`\n\n感到困惑了吗？核心思想是这样的：我们组织代码是为了保持内容的整洁和易于理解。就像你可能会把\
    \ Word 文档放在一个文件夹里，把 PowerPoint 放在另一个文件夹里一样，将相关的 Java 代码放在同一个文件夹（包）中也是一个好主意。你可以继续将其不断细分。\n\
    \n## 为你的包命名\n和 Java 的其他许多领域一样，在创建包时也有惯例（或常用的处理方法）。我先给你们看几个示例包，因为这些惯例可能会变得显而易见：\n\
    \n* `com.google.gson`\n* `com.google.dagger`\n* `com.google.copybara.templatetoken`\n\
    * `com.google.common.math`\n* `com.google.common.base.internal`\n\n注意包的每个部分都是小写的。而且即使一个包包含多个单词（看\
    \ `templatetoken` 的例子吗？），我们也将它们合并成一个单词。\n\n到为止，最让人困惑的部分是 `com.google` 部分……为什么在所有包的前面有一个网站名称？而且为什么是反的？？这到底在搞什么鬼？\n\
    \n人们，至少在美国，有名字、中间名和姓，以便更独特地标识我们，对吧？就像那样，只不过要具体得多。也许像社会安全号。这让开发者之间共享代码变得简单直接，而不会发生包名冲突。如果\
    \ Google、Java、Facebook、Amazon 和 Steve 都有一个名为 `math` 的包。而且我们都想把它分享给世界，这样任何人再也不需要写代码来做数学运算了？那我们就麻烦了。\n\
    \n相反，我们在所有的包之前都加上自己的网站名称作为前缀。\n\n### “好吧，但为什么是反的？”\n我不知道。人们就是这么做的。而且，如果你没有域名，就编一个。`com.stevebrown.memestore.app`\
    \ 看起来不错！\n\n## 所以……这有点让人困惑\n是吗？也许吧。当我们仅仅有一个名为 `app` 的文件夹，且里面有一些文件夹时，它要直观得多（意思是容易于理解）。这意味着我们现在有一个\
    \ `com` 文件夹吗？然后是一个 `stevebrown` 文件夹？然后在里面是我所有的带有 Java 代码的实际包？\n\n是的，没错。但由于我们是正常的人类而不是精神异常者，我们使用像\
    \ `IntelliJ` 这样的程序来编写代码。它会根据包名替我们创建所有这些文件夹。例如，我可以使用 `IntelliJ` 创建这样的包结构：![](img/rsrc1XE.jpg)\n\
    \n看到 `com.stevenbrown.memestore.app` 是如何显示为一个大包的了吗？当然，在底层，它实际上是文件夹中的文件夹中的文件夹中的文件夹中的文件夹。但\
    \ `IntelliJ`（或者愿天保佑不是 `Eclipse`）会代表你创建这些文件夹。\n\n在这种情况下，我的电脑上确实拥有整个文件夹层级结构：`C:\\\
    Code\\MemeStore\\src\\com\\stevenbrown\\memestore\\app`\n\n哦，为了明确起见，包声明也反映了这个完整的“反向域名”：\n\
    \n```java\npackage com.stevenbrown.memestore.app;\n\npublic class MemeApp {\n\
    \    public static void main(String[] args) {\n\n    }\n}\n```\n\n随着时间的推移，你会习惯的。我发誓。相信我吗？\n\
    \n## 我应该如何对类进行打包？\n完全由你决定组织所有类的最佳方式。但这里有一些人们常用的流行选项：\n\n1. 按功能划分 (Package by feature)\n\
    2. 按分层划分 (Package by layer)\n3. 按你随心情划分 (Package by whatever hell you feel like)\n\
    \n### 按功能划分\n如果你喜欢选项 3，那么现在可以跳过本节的剩余内容。胆鬼。\n\n这意味着什么？功能，嗯，就是你软件的一个功能。你提供的有价值的东西。对于一个用户真正看到的软件，一个功能可能是一个屏幕，或者是一组屏幕。想象你正在为\
    \ Amazon 创建一个移动应用程序。在按功能划分的方法中，我们可能会为每个屏幕创建一个顶级包。然后为其他所有内容创建一个包。\n\n* `Product\
    \ List` (产品列表)\n* `Product Detail` (产品详情)\n* `Shopping Cart` (购物车)\n* `Settings`\
    \ (设置)\n* `Shared` (共享)\n    * `Database` (数据库)\n    * `Networking` (网络)\n\n这是用纯英语描述的结构（我喜欢英语）。使用我们刚刚学过的打包惯例，看起来可能是这样：![](img/rsrc1YJ.jpg)\
    \ 注意，Amazon 的 App 比这复杂得多。而且我不在那里工作，不知道他们是如何组织代码的。但这是“按功能划分”方法的一个简单示例。每个功能都有自己的大包，任何不完全属于功能的东西都被丢在其他地方。\n\
    \n### 按分层划分\n当然，按“层”划分……随你如何称呼它。按功能、按目的等。在上一种方法“按功能划分”中，我们为应用程序的每个主屏幕创建一个包……为我们提供的用户的每个“功能”。在这种方法“按分层划分”中，我们根据类的类型进行分组。例如，这个类是用户界面的部分吗？放在\
    \ `userinterface` (ui) 包中。![](img/rsrc1YW.jpg) 懂我的意思吗？你感受到了吗？\n\n* `package by\
    \ feature`：根据应用程序的板块或你认为的程序的任何“功能”将内容分组。\n* `package by layer`：完全根据其功能将内容分组，无论是用户界面、网络、辅助类、创建文件、数学之类的。\n\
    \n假设我想添加一些与网络相关的代码，这些代码只影响 `ProductDetailScreen`。它们应该放在哪里？\n按功能划分，它们放在 `productdetail`\
    \ 包中。\n按分层划分，它们放在 `networking` 包中。\n\n###  (Imports)\n“很显然，我们的国家依赖于外国石油。我们越来越多的进口来自海外。”–乔治·W·布什\n\
    \n这段话和任何事情都没关系。但最后那部分花了老死的时间，我想在这里重置一下我们的思路。呼。好……\n\n我们如何让类之间相互交互呢？如果 `ProductListScreen`\
    \ 在没有先向 Amazon 发起网络调用之前，不知道该显示哪些产品怎么办？它显然需要向 Amazon 请求建议，因为它们了解我们生活的方方面面。我们在 `ProductListScreen`\
    \ 内部直接这样做这样的代码吗？\n\n```java\nNetworker networker = new Networker();\n```\n\n"
- fmt: "\nResponse networkResponse = networker.getProductsToDisplay();…It seems reasonable,\
    \ right? We know that we have a `Networker` class in our project. Why wouldn’t\
    \ we be able to create an object from that class? Why can’t we just “instantiate”\
    \ it willy nilly?\n\nBecause Java needs you to “import” it. Unless the class you\
    \ want to use is in the exact same package as yours, you must put an import statement\
    \ at the top of your Java file. Remember package declarations? It’s the simple\
    \ one-liner where you specify what package your class belongs to. Right below\
    \ that, still at essentially the top of the file, you simply import all the classes\
    \ that you’ll need from outside this file.\n\n```java\npackage com.amazon.app.productlist;\n\
    \nimport com.amazon.app.shared.networking.Networker;\n```\n\nNow, for the rest\
    \ of the class you can create new `Networkers`! Go crazy! Connect to every web\
    \ site that has ever existed! WEoooohhhhhh! Ahem. So yeah, that’s how you would\
    \ import classes from the rest of your project. But this same rule applies to\
    \ using classes from Java.\n\nJust for shits and giggles, suppose I want to generate\
    \ a random number. Rather than write my own class or function to do this, I can\
    \ use the `Random` class from the Java standard library. But I can’t just create\
    \ a new `Random()`, just like that! I have to import it. At the top of my file…\n\
    \n```java\nimport java.util.Random;\n```\n\nThen in one of my functions, I’m good\
    \ to go!\n\n```java\nRandom randomNumberGenerator = new Random();\n\nint randomInt\
    \ = randomNumberGenerator.nextInt();\n```\n\nHells yea! I have the memory of a\
    \ goldfish So I need to remember the full package name for every class I want\
    \ to use? NOPE! You literally just need to know the name of the class, start typing\
    \ it in your code, then use your super duper IDE like IntelliJ (promo code Steve)\
    \ to automatically import the class you need. Import class. Adds the import to\
    \ the top of your class. Boom, done.\n\n### Importing it all\nSee above how we\
    \ imported the `Random` class? We could import every single class inside the `java.util`\
    \ package using an astric `*`.\n\n```java\nimport java.util.*;\n```\n\nYep. Now\
    \ this class could use any class inside the `java.util` package. There’s pretty\
    \ much no reason to do this thanks to the goldfish-proof ways of managing your\
    \ imports that IntelliJ and other software provides. But it’s certainly possible\
    \ to import like this.\n\n### The exception to the rule?\nThere’s a class we’ve\
    \ been using a lot throughout this book that we’ve never had to import. Can you\
    \ think of what it is? It rhymes with “I can’t remember a goddamn thing.” and\
    \ with “Ding ding ding!” That’s right, it’s a `String` !! Why haven’t we had to\
    \ import Strings?\n\nI just said a bit ago that if a class isn’t inside your package,\
    \ you need to import it before you can use it. And we know that a `String` is\
    \ a class, because we went over its most important methods. What gives? Am I a\
    \ liar?\n\nJava pulled a little sneaky on us. They quietly import one special\
    \ package into every Java file. That package’s name? Albert Einstein. No, it’s\
    \ `java.lang` ; Strings belong to the `java.lang` package. That means you don’t\
    \ need to import it.\n\n### Fun fact\nYou could create a `String` like this if\
    \ you wanted to make everyone around you cry:\n\n```java\nString oofOuchOwie =\
    \ new java.lang.String( \"Why?\");\n```\n\n### These are the rules\nJust to reiterate,\
    \ for every Java file:\n1. The name of the file should match the Java class, with\
    \ `.java` at the end.\n2. The file should be placed in a folder structure that\
    \ matches that package name (just the folders separated by a period).\n3. The\
    \ top of the file should state the package the class belongs to.\n4. Underneath\
    \ the package statement, the file should import every class it will need to use.\n\
    \n# Chapter 13: Object-Oriented Concepts\nTo wrap up this little book, I’ll give\
    \ you a brief rundown of some of the software “design” principles that make a\
    \ language “Object Oriented,” just because I like you that much.\n\n## Abstraction\n\
    You go to a restaurant. You ask for a very nice, expensive meal. The waiter leaves\
    \ and returns 20-30 minutes later with your meal. Where did the waiter get the\
    \ food from? Did he make it himself? Did he go to the store and buy it? Did he\
    \ run to the restaurant across the street and take it from there?\n\nWhen you\
    \ ask for a meal, you don’t walk into the kitchen, tell the chefs how to prepare\
    \ it, micromanage how they interact with each other, put the food into the oven\
    \ yourself, or swing by Walmart to buy the buns the restaurant has run out of,\
    \ etc. You simply ask the waiter for the food; with the expectation they will\
    \ provide it to you. The waiter has abstracted away the details of how the food\
    \ is prepared.\n\nGood programmers create classes like this. You might have a\
    \ very large, powerful program with dozens or hundreds of classes to do something\
    \ super complicated. Maybe you have a program that calculates the quickest way\
    \ to travel between Point A and Point B on a map. But does your user interface\
    \ need to directly talk to all these different classes to calculate the route?\
    \ Or can we create a class that abstracts away all that complexity? Maybe one\
    \ class that simply takes address 1 as a `String`, address 2 as a `String`, then\
    \ returns an array of the steps you need to take.\n\nThis is what abstraction\
    \ is all about: simplicity of the design that is exposed to other classes or systems.\n\
    \n## Encapsulation\nWe can enforce abstraction. Classes can simply refuse to expose\
    \ themselves out public. And thank god for that. You could be a class with 500\
    \ properties, 1500 methods, and the worst spaghetti code in the entire world.\
    \ But you know? Other classes don’t need to see that. They don’t have to care.\
    \ Encapsulation is a way of abstracting our code from other classes.\n\nLet’s\
    \ say we run a pizza business that lets the customer track the progress of their\
    \ order. That customer uses an app installed on their phone. The app needs to\
    \ make some network calls over the internet to get updates. No, you don’t need\
    \ to worry about that. And that’s part of the point. Assume every class used in\
    \ this stupid example is in a totally different package.\n\n```java\nclass StatusScreen\
    \ {\n    private Order order;\n    private Networker networker;\n\n    public\
    \ void showOrderStatus() {\n        String currentStatus = networker.getOrderStatus(order.getId());\n\
    \        updateProgressBar(currentStatus);\n        }\n\n    private void updateProgressBar(String\
    \ status) {\n        //update progress bar\n    }\n}\n```\n\n`private` is saying\
    \ that no other class knows how to update the progress bar on the screen. Only\
    \ `StatusScreen` can call this method. It’s invisible to the rest of them. Consider\
    \ private properties and methods to be what is “abstracted away” from the classes\
    \ that would interact with it. `public` is saying that any other class can call\
    \ this method. It’s possible we’d have another part of the user interface that\
    \ wants to tell this screen to show the order status. And luckily for us, it would\
    \ appear that `Networker`’s `getOrderStatus` method is public, since we’re able\
    \ to use it. And that’s correct; this is what `Networker` might look like:\n\n\
    ```java\npublic class Networker {\n    public String getOrderStatus(String id)\
    \ {\n        establishNetworkConnection();\n        makeRequest(id);\n       \
    \ processResult();\n        return getStatusFromResult();\n    }\n\n    private\
    \ void establishNetworkConnection() {}\n    private void makeRequest(String id)\
    \ {}\n    private void processResult() {}\n    private String getStatusFromResult()\
    \ {}\n}\n```\n"
