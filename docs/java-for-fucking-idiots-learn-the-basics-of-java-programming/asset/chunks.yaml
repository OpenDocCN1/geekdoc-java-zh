    \n### 布尔之王\n还记得我讲过的感叹号（`!`）吗？它基本上就是“不”的意思。所以 `!=` 是在检查一个值是否“不等于”另一个值，对吗？\n\n如果你只是想翻转某个值从真到假（`boolean`\
    \ 值），或反之，在 `Java` 中有更简单的写法。例如，与其写成：\n`boolean isBad = isGood != true ;`\n你完全可以直接说：\n\
    `boolean isBad = !isGood ;`\n感叹号直接放在 `boolean` 前面。哇，再次惊叹！！\n\n其他的运算符……我都不打算讲了。如果你想学习位运算、移位或三元运算符，请去找更高级的材料。或者鼓励我再写一本书。眨眼。\n\
    \n### 我头疼\n所有那些深奥的理论都是可选的，所以别纠结。此外，如果你使用像 `IntelliJ` 这样的 IDE，当你用很蠢的方法做事时，它会纠正你。\n\
    \n## 第 6 章：条件语句\n“是时候玩点花了。” – DJ Casper\n\n大多数时候，你的代码不能简单地从上到下一条接一条执行并完成任何有用操作。你需要代码根据用户输入的内容、库存产品、或者运行的\
    \ `Android` 版本等执行不同的操作。\n\n看，强大的 `if` 语句：\n```java\nif (numGiraffes > 500 ) {\n\
    \    System. out .println( \"Please send help.\" );\n}\n```\n那行打印到系统的代码只在我们拥有超过\
    \ 500 只长颈鹿时才会发生。另一个例子：\n```java\nScanner userInputReader = new Scanner(System.\
    \ in );\n\nint userInputNumGiraffes = userInputReader.nextInt();\n\nif (userInputNumGiraffes\
    \ <= 0 ) {\n    System. out .println( \"它们在哪儿?\" );\n}\n```\n那行代码只有在用户输入 0 或负数时才会打印到系统。我将跳过解释[如何通过\
    \ Scanner 获取输入](https://stackoverflow.com/questions/11871520/how-can-i-read-input-from-the-console-using-the-scanner-class-in-java/31241089)，好吗？真的，非常无聊的内容。\n\
    \n不管怎样，`if` 部分好理解吗？它其实和英语很像。如果这样，就做那样。现在，如果我们还想在用户输入实际数值时做些什么呢？如果你还记得比较运算符，你可以在该条件语句下方添加类似下面的代码：\n\
    ```java\nif (userInputNumGiraffes <= 0 ) {\n    System. out .println( \"它们在哪儿?\"\
    \ );\n}\n\nif (userInputNumGiraffes > 0 ) {\n    System. out .println( \"我会立即添加它们。\"\
    \ );\n}\n```\n两个连续的 `if` 语句。这样可以运行，对吧？但太蠢了。为什么要在这两个地方检查 `userInputNumGiraffes`\
    \ 的值？不要这样做。\n\n相反，在原始的 `if` 语句中添加一个 `else` 块，如下：\n```java\nif (userInputNumGiraffes\
    \ <= 0 ) {\n    System. out .println( \"它们在哪儿?\" );\n} else {\n    System. out\
    \ .println( \"我会立即添加它们。\" );\n}\n```\n如果第一个检查（用户输入的值小于等于 0）为真，我们就进入 `if` 块。否则（`else`！）我们就进入\
    \ `else` 块。编程非常简单，哥们。\n\n噢，你不需要把 `else` 单词和那个大括号 `{` 写在同一行。你可以按回车并将 `else {` 推到下一行，如下所示：\n\
    ```java\nif (userInputNumGiraffes == 0 ) {\n    System. out .println( \"它们在哪儿?\"\
    \ );\n}\n\nelse {\n    System. out .println( \"我会立即添加它们。\" );\n}\n```\n你也可以把每个大括号单独占一行。这会是在违反\
    \ `Java` 代码风格的暴行，但如果你真的想惹恼我，你可以这么做。\n\n好了，我希望你目前为止都跟上了；你可以检查某值是真是假，然后使用 `if/else`（条件）逻辑采取相应的行动。这被称为控制流。你正在控制程序的流向。\n\
    \n然而，在某些情况下并不是简单的“如果 X 则这样做，否则做不同的”。例如，你可能想根据长颈鹿的数量来做不同的事情。我们怎么做呢？嗯，有几种方法……\n\n\
    ### 多个 if/else 检查\n这种怎么样？在 `else` 块内部添加另一个 `if/else` 检查。在那个 `else` 块内部再添加另一个 `if/else`，以此此类推。这样得通，对吧？注意，如果你在小屏幕上，这部分可能会变得很乱，但请耐心听……\n\
    ```java\nif (userInputNumGiraffes < 0 ) {\n    System.out .println(\"离我的长颈鹿远点。\"\
    \ );\n} else {\n    if (userInputNumGiraffes == 0 ) {\n        System.out .println(\"\
    抱歉，你不能添加 0 只长颈鹿。\");\n    } else {\n        if (userInputNumGiraffes < 3 ) {\n\
    \            System.out .println(\"感谢提供 1-2 只长颈鹿。\");\n        } else {\n    \
    \        if (userInputNumGiraffes < 10 ) {\n                System.out .println(\"\
    感谢提供 3-9 只长颈鹿。\");\n            } else {\n                System.out .println(\"\
    你怎么会有 10 只以上的长颈鹿？\");\n            }\n        }\n    }\n}\n```\n"
- fmt: "\n```java\nplayer.moveRight();\n\ndefault :\n    player.stopMoving();\n}\n\
    ```\n\nWhoa, crazy! We create a `switch` with the value of the user input, then\
    \ do something different for each `case`. And no, `case` has nothing to do with\
    \ uppercase or lowercase letters; it’s when the `switch` equals a particular value.\
    \ If they pressed in ‘W’, then the code under the ‘W’ `case` is run. If they pressed\
    \ ‘D’, then the code under the ‘D’ `case` is run. The `default` is what happens\
    \ if the user input isn’t any of our cases. Maybe they pressed space bar. Or some\
    \ letter we haven’t accounted for. Make sense? Compare it with the `if/else` examples\
    \ further back.\n\nHowever, there’s one fatal flaw in the `switch` example code\
    \ (IT’S ACTUALLY NOT WITHOUT MISTAKES, CURVEBALL!!!). What happens if the user\
    \ presses ‘A’? What direction does the player move? Think about it. Scroll up/flip\
    \ back/take a taxi back and look; what could be wrong with a user pressing ‘A’?\
    \ Or don’t. I’ll tell you anyway. The player starts to move `moveLeft()` but is\
    \ then immediately told to `stopMoving()`. “That’s what’s happened?! But why??\
    \ The user pressed ‘A’, so it matched the ‘A’ `case`, right? Move left?” – you,\
    \ maybe.\n\nWell, the `default` line of code will actually happen every single\
    \ time, in addition to the `case`... Because unless you specify otherwise, a `switch`\
    \ will look at every single `case`, then hit the `default` block of code. That\
    \ `switch` won’t stop! You need to give a very special word to Java here for each\
    \ `case`. It’s called a `break`.\n\n```java\nswitch (keyPressed) {\n    case 'W'\
    \ :\n        player.moveForward();\n        break ;\n    case 'A' :\n        player.moveLeft();\n\
    \        break ;\n    case 'S' :\n        player.moveBackward();\n        break\
    \ ;\n    case 'D' :\n        player.moveRight();\n        break ;\n    default\
    \ :\n        player.stopMoving();\n        break ;\n}\n```\n\nNow when one of\
    \ the cases is matched, Java will hit the kill switch (hehe) when it sees `break`\
    \ and prevent anything else in the `switch` statement from running. Java jumps\
    \ down to any code below the entire `switch` statement (outside the curly braces\
    \ `{}`).\n\nWhy do we need to do this? “Because fuck you, that’s why.” - Java.\n\
    \nNow tell me, which is easier to understand, some `if/else`’s, or a `switch/case/break/default`\
    \ cluster? It’s totally your choice. Want to do something different based upon\
    \ a certain variable’s value? Pick the one you like better. But if you choose\
    \ a `switch` you’d better hope you don’t forget your `break` statements (and it\
    \ does happen).\n\n# Chapter 7: Arrays\n\n“Isn’t there anything on TV that isn’t\
    \ about BOXES?!?! We now return to Championship boxing.” – Spongebob Squarepants\n\
    \nPop quiz: What’s the first letter of the alphabet? Answer: (doo doo, doo doo,\
    \ doo doo) The Daily Double. Okay, no. It’s actually `A`. How would we represent\
    \ that letter in Java? Which data type? Tick.Tock. Tick.Tock. Did you guess a\
    \ `char`? If so you’re right! If not… shucks! I was really rooting for you, dumbo.\
    \ Here it is!\n\n```java\nchar firstLetter = 'A' ;\n```\n\nCongratulations again.\n\
    \n## More than one value??\n\nCool. Now, what if we want to store more than one\
    \ value? We use an array. How would we represent that in Java? We use square brackets\
    \ `[]` after the type.\n\n```java\nchar firstLetter = 'A' ;\n```\n\nWait, that's\
    \ not right. To declare an array of characters, we use `char[]`.\n\n```java\n\
    char[] letters;\n```\n\nThis creates an array that can hold multiple `char` values.\
    \ How do we initialize it? We can use curly braces:\n\n```java\nchar[] letters\
    \ = {'A', 'B', 'C'};\n```\n\nThis is an array with three elements. What if we\
    \ want to define the size first? We use the size in brackets:\n\n```java\nchar[]\
    \ letters = new char[10];\n```\n\nThis creates an array of 10 `char` elements,\
    \ all initialized with the default value. How do we access elements? We use an\
    \ index:\n\n```java\nletters[0] = 'Z';\n```\n\nRemember, indices are zero-based!\
    \ So the first element is `letters[0]`.\n\nWhat if we want to loop through the\
    \ array? We use a `for` loop:\n\n```java\nfor (int i = 0; i < letters.length;\
    \ i++) {\n    System.out.println(letters[i]);\n}\n```\n\nWait, `length` is a property\
    \ of the array that tells us how many elements it can hold. This is very useful!\n\
    \nLet's look at some more examples:\n\n```java\nint[] numbers = {1, 2, 3};\ndouble[]\
    \ prices = {1.9, 2.5, 3.0};\nString[] names = {\"Alice\", \"Bob\", \"Charlie\"\
    };\n```\n\nEach of these is an array of a different type. The `[]` is the key\
    \ that tells Java this is an array.\n\nSummary:\n- Declaration: `type[] name;`\n\
    - Initialization with size: `type[] name = new type[size];` own- Initialization\
    \ with values: `type[] name = {val1, val2, ...};`\n- Accessing elements: `name[index]`\n\
    - Array length: `name.length`\n"
