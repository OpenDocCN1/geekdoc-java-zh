  trans: "\n\n![](img/MeOc5c22Q_eDtULUc5-ZLQ2.jpg)\n\n![](img/MeOc5c22Q_eDtULUc5-ZLQ2.jpg)©\
    \ 2019 Steven Brown 版权所有。未经出版者许可，除美国版权法允许外，本书任何部分不得以任何形式复制。获取许可请联系：scbWriterGuy@gmail.com\n\
    \n# 目录\n- 引言\n- 第 0 章：软件要点\n- 第 1 章：Java 到底是什么鬼？\n- 第 2 章：Hello, World!\n- 第 3\
    \ 章：对象\n- 第 4 章：变量\n- 第 5 章：运算符\n- 第 6 章：条件判断\n- 第 7 章：数组\n- 第 8 章：循环\n- 第 9 章：实例化\n\
    - 第 10 章：方法\n- 第 11 章：字符串\n- 第 12 章：Java 电影宇宙\n- 第 13 章：面向对象概念\n- 第 14 章：整合一切\n\
    - 结语\n\n# 引言\n你好，我是 Steve。我在这里是为了教你 `Java` 的基础知识。或者说是 `Java` 的入门教程。二选一，或者两者都有。也许我应该在书的开头用一段小短的电梯演讲介绍一下它为什么存在。\n\
    \n厌倦了跳来份去工作来赚钱吗？点击这里学习如何在家里每月赚取 120,000 美元！！！\n\n等一下，那写错了。让我重新开始……\n\n根据我的经验，很多专为“完全初学者”设计的书可能只花一章像对待初学者一样对你说话，然后突然开始把你当成一个智力平均水平的人来对待。它们忘记了自己的读者群体。它就变成了一本普通的教科书。\n\
    \n我觉得这很令人沮丧。我想要被像对待我这个大傻瓜一样对待我，该死的。我向你保证，在本书里，我不会忘记你是一个像我一样的妈死的傻痴。唯一的真实要求是你能读字。如果你在下载电子书时还不会读字，那朋友，我不知道该对你说什么。\n\
    \n## 这本书是什么\n这是一本快速、易读的书，它将引导你学习 `Java` 的基础知识；从变量、方法、运算符，到类、对象和包。不知道这些词是什么意思？没问题。我对英语的精通程度（在高中时至少能拿\
    \ B- 级）将带你进入一个 `Java` 编程的神秘世界。\n\n那些完全自创且有机的代码片段将解释英语原本无法表达的内容。我在写这本书时看 YouTube\
    \ 这一事实完全不会产生任何负面影响。而且这一切都是我我自己写的，所以你知道这本书是完全自创且有机的。并且倾向于用“而且”开头很多句子。\n\n这本书的目标是让你，这个对\
    \ `Java` 编程感兴趣的空头读者，能够合上书并说：“嘿，我学到的比开始读它时多得多。而且这并并不太糟糕！”\n\n## 这本书不是什么\n就像任何一段健康的关系一样，我们应该诚实相待。我现在就对你诚实，告诉你这本书不是什么：\n\
    \n1. **关于如何下载、安装和配置 `Java` 的详细指南。**\n   我不认为这符合此本书的格式或主题，而且我对写这个话题一点都不感兴趣。我确实在这个话题上写了一段简短的介绍，但我侧重于\
    \ `Java` 语言本身。\n\n2. **一本充满练习的练习册。**\n   考虑到 `Java` 已经有 24 多年的历史，这类练习多得的是。我将专注于教你概念，你只需要在代码里瞎搞腾并锻炼你的大脑。\n\
    \n3. **一份全面的 Java 指南，详细探索它所提供的所有功能。**\n   是的，哥们，我拒绝这个。`Java` 中更复杂的部分我只会略带提及。其他部分我们根本来不及。这就是一本给妈死的傻痴看的书的本质。\n\
    \n4. **由拥有几十年经验的 Java 大师编写。**\n   我写 `Java` 代码大约有 6 年了，但我只是个普通人。\n\n5. **情绪稳定**\n\
    \   这本书会非常不公平并对你发火，有时会进行人身攻击。先先歉了。\n\n6. **可能会让我赚到钱。**\n   但我愿意接受这一点。\n\n## 我应该如何读这本书？\n\
    它是被设计成像你在马桶上上厕时翻看的东西，但你会非常喜欢它以至于一直读下去。\n\n## 系好安全带\n准备好你的毛巾，好戏了。我们要开始第一章了，一旦我们开始，就无路回头。\n\
    \n# 第 0 章：软件要点\n开玩笑的，我们要从第 0 章开始……因为编程。这里有一个关于软件的简要总结，让你进入状态。\n\n- 这是一个操作系统：`Windows`。它运行并与各个部分通信，这样我们就不需要自己去。\n\
    - 这是一个编程语言：`C++`。它是人类用来编写运行在操作系统上的程序。\n- 这是一个程序：`Google Chrome`。它是一个用编程语言编写的网络浏览器，运行网站。\n\
    - 这是我们在书中使用的编程语言：`Java`。\n- 这是细胞的动力工厂：线粒体。\n- 这些是圆括号：`()`\n- 这些是大括号：`{}`\n- 这些是括号：`[]`\n\
    - 这些角括号：`<>`\n\n![](img/src3P.jpg)\n\n太好了，现在你进入状态了……进入正文！\n\n# 第 1 章：Java 到底是什么鬼？\n\
    `Java` 是一种编程语言（顺便说一下，它是最流行的）。编程语言是计算机可以理解的特殊语言。当你用编程语言写东西时，你创建的内容通常被称为 `code`。不是摩斯密码，或任何你用来告诉某人你不高兴而不是说你为什么不高兴的密码。不是那些；是计算机代码。\n\
    \n因此，程序员是指用编程语言编写代码的人，以便计算机为我们工作。然而，计算机是傻痴，甚至比你还傻。如果你把你的 `Java` 代码展示给你的计算机，它并不知道怎么读。哈！该死的机器！\n\
    \n我们通过一种被称为“编译”的过程将我们的编程语言代码转换为计算机可以理解的格式。Com – pill – ayy – shin。编译的行为。就像汇总一份你想从中餐馆点的一切东西清单。现在，当我看到“我们”时，我并不是指人类实际上在做这个“编译”事情。只是说我们依赖“编译”过程来创建我们的程序。\n\
    \n让我给你举个例子：\n\n1. Steve 写了一段可以自动生成表情包的程序代码。\n2. 编译器将他的源代码（他写的代码）转换为机器码。\n3. Steve\
    \ 的计算机运行这些机器码，这样他就可以享受他的新鲜表情包了。\n\n"
- fmt: '

    So, Steve’s source code (human readable) is compiled by a compiler to create machine
    code (machine readable). And the machine code is what runs on the computer. It’s
    like hiring a translator to speak to someone in a different language.


    `Source Code -> Compiler -> Machine Code`

    “Computer, add 2 and 2 please” -> Compiler -> “01100110101”


    Make sense? You write source code, a compiler turns it into machine code, and
    the computer runs that machine code. Get it into your thicc skull (two c’s).


    ## Compiling interest


    Now, there is a part I left out. You see, machine code is created specifically
    for the `CPU` of a computer. At this point your eyes are probably about to roll
    into the back of your head. Either because you know what this is already, or you’re
    already confused. Bear with me.


    For those of you out of the loop, the `CPU` (central processing unit) is the brain
    of the machine that does all the hard work. Some people call it the “chip” or
    the “processor”. Doesn’t matter what you call it, for all I care you could call
    it the doorknob. Anyways, so we create machine code to run on a computer’s processor/`CPU`.
    What would happen if we gave that machine code to a different computer?


    More specifically, what would happen if I write some code, compile it into a program
    to run on my computer (with processor A), then give it to my friend to run (with
    processor B)? Hmm. I write code and compile it for processor A… my friend has
    processor B… I guess it will work! Yeah, programs are smart and just work, it’ll
    be fine!


    NO, the answer is that it won’t work! Imagine writing a novel in English and hiring
    a professional to translate it into Spanish. Would you expect someone who only
    speaks Swedish to understand the translator’s product?


    Unfortunately for us, `CPUs` read specific kinds of computer instructions thanks
    to how they’re architected. Processor A needs different instructions than Processor
    B.


    How can we solve this? Death? Maybe! More realistically, I will need to compile
    my program for processor A, then compile it for processor B, then make sure the
    right version of the program is given to the right computer. “Well that sucks!”
    – Randy Marsh.


    ## The Big Idea


    Most programming languages are compiled from their human-readable source code
    to machine code to run on a specific type of computer.


    ## A reading from the book of Java


    The creators of Java grew frustrated and asked, “what if we could write a programming
    language that worked on every kind of computer?” And that they did. They came
    down to mankind and proclaimed for all to hear.


    “Behold. We shall create a programming language that will work on every `CPU`.
    Programmers will be able to compile code once and run it everywhere!”


    “But how is that possible?” the masses of programmers replied. “How can you compile
    for every machine at the same time? There has to be a version of the program for
    each type of machine!”


    “Fear not, child. The language is Java and Java is good. You shall write your
    code in Java, and it will be compiled to run on the `Java Virtual Machine`.” replied
    the voices in the sky.


    Confused, they questioned the Creators: “But what is the `Java Virtual Machine`?”


    “The `JVM`? It’s simple,” they answered. “Each machine shall have a program on
    it called the `Java Virtual Machine` that understands compiled Java code. You
    will not need to compile for the machines themselves; you will need to compile
    for the `Java Virtual Machine`!”


    “But my toaster! I compile my `BASIC` code to run on the toaster architecture,
    how will I be able to run my programs?” questioned one brave coder.


    “Hah! Haha! Silly human. We have a version of the `JVM` for toasters. And refrigerators.
    And PCs, and Macs, and Linux. Install the right `JVM` for each system, and Java
    programs will be able to run.”


    And so, it came to be.


    ## Serious time


    Do you wish you’d never laid eyes upon such a passage? Do you hate my guts now?
    I don’t blame you, but let’s really quickly touch on some terms that come up when
    this topic of programming language, uh… “portability,” is discussed. After all,
    you probably don’t want to quote a fake bible tale when trying to describe something
    technical. I still don’t trust you to even attempt to describe anything technical,
    but if you need to, this part should help more.


    *   **Machine Language**: The extremely specific instructions to a computer’s
    `CPU` that tells it how to process the 0s and 1s, perform mathematical operations,
    and that kind of confusing shit.

    *   **Assembly Language**: A type of language that’s a little bit more understandable
    than machine language. An assembly language creates the machine language, on our
    behalf, for a particular `CPU` architecture. It’s basically shorthand for the
    machine language. Stay away.

    *   **Programming Language**: The languages that humans in the modern-day use
    to write software. Like assembly language, it compiles to the right type of machine
    code based on the type of Processor you’re targeting.


    But rather than being an obtuse, impossible to understand piece of garbage like
    Assembly Language (seriously, google it), we get to use relatively easy to write
    and comprehend programming language. The programming language’s compiler takes
    care of getting us down to machine code!!


    ## Java’s selling point


    Java programmers don’t need to worry about writing for a Dell, or an HP, or a
    MacBook computer. They write for a make-believe computer called the `Java Virtual
    Machine` (`JVM`).


    The `JVM` acts as basically the ultimate translator for us; it can speak the machine
    language for pretty much any kind of processor. We just give it the compiled Java
    code, and it takes care of the rest.


    So, Java is a programming language that replaces the practice of “compiling to
    machine language” with “compiling to Java Virtual Machine language.”


    ## What is compiled Java code then, if it’s not machine code?


    I mean, what language does the Java Virtual Machine (`JVM`) understand? It’s called
    `bytecode`. Any source code you write in Java that wants to run on the Virtual
    Machine needs to be compiled to `bytecode` first. No, you don’t need to worry
    about what bytecode actually is. It’s just the result of compiling a Java program.
    C++ might compile to machine code, but Java is compiled to `bytecode`.


    So, it be like this:


    1.  You write source code in Java.

    2.  The Java Compiler “compiles” or translates the source code to `bytecode`.

    3.  The Java Virtual Machine (`JVM`) running on your computer executes that `bytecode`.

    4.  That same `bytecode` can run on a billion different computers as long as they
    have the `JVM`.


    Got it? If you do not get it, please mail me a letter: `1600 Pennsylvania Ave
    NW, Washington, DC 20500`. (Note: this is not my real address).


    ## What’s in the box?


    `Oracle` is the company that maintains Java. They provide us developers (that
    includes you now) with this majestic programming language and its related tools
    in the form of the Java Development Kit (`JDK`). What’s included?


    *   The Java Compiler, so you can compile the programs written in Java to bytecode,
    for the virtual machine to execute.

    *   The Java Virtual Machine (`JVM`), so your computer can run programs written
    in Java.

    *   The Java Standard Library, so you don’t need to reinvent the wheel to do common
    things other Java programmers do.

    *   A whole bunch of other shit.

