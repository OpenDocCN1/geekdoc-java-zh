    Seem too easy? It’s “logical”, right? Get it? Logical? Because they’re called
    the logica-Oh, and just like with the math operators; no, you shouldn’t create
    variables that are always true, or always false. They’re variables. But I’m trying
    to get the concept across right now, kay? More on this when we get into conditionals
    and if statements.


    ## The assignment operator


    “Now, are you men ready for your super…special…. secret…ASSIGNMENT!?!?The two
    of you are to paint the inside of me house!!Yayyyyy!!” – Spongebob SquarePants


    Yeah, you’ve already seen this thing (it’s the equals sign `=` ), but we’re going
    to cover it to clear up a misconception that beginners might make.


    Think back to your algebra class in school. You probably don’t remember. No, it’s
    not the one with the triangles… does this ring a bell?


    `x = 7`


    How would you say that out loud? Probably something like this:“x is equal to 7”.


    You can do something very similar in Java. Check out this line of code


    ```java

    int x = 7 ;

    ```


    It’s the same thing as before, right? “x is equal to 7”??FALSE! INCORRECT ! NEGATIVE!
    Wanna see why? What if I show you this?


    ```java

    int x = 1 ;

    ```


    Okay, `x` is 1…`x = x + 1` Hmm…Okay, now `x` is equal to…. `x + 1`?? Wait… if
    `x` is 1, then that means `1 = 1 + 1`??Does that mean that `1 = 2`???Hopefully
    your mind has awoken from its slumber and is screaming at the page: “THAT’S NOT
    POSSIBLE! THAT MAKES NO SENSE! WHY WOULD THEY MAKE BRAN KING?”


    =` is not “is equal to” That’s because a single equals sign in Java is the assignment
    operator . Here’s how it works: The thing on the left is given the value of the
    thing on the right. You can say it like this instead:


    ```java

    int x = 7 ;

    ```


    “Assign to `x` the value of 7”


    `x = x + 1`


    “Assign to `x` the current value of `x` plus 1”


    Guess what? The value of `x` is 8 now (shocked emoji).


    It seems like a subtle distinction, doesn’t it? “Assigning something a value,”
    versus saying that “something is equal to something else.” But this concept is
    a mystery mouseketool; a surprise tool that will help us later.


    ## The relational operators


    Remember the carrot symbols `<` and `>`? Maybe you were taught to think of them
    as alligators; the alligator’s mouth points to the bigger number? Maybe? Anyway…Here’s
    some true statements in regular math:


    `2 < 3` is less than 3.

    `3.5 > 4` is greater than 4.


    Cool. Now, this is wrong.

    `5 > 5` is greater than 5.


    They’re the same value; 5 is not bigger than 5\. FALSE, you must be screaming
    right now!


    Now, what if we wrote this down?


    `5 ≥ 5`


    This is true. 5 is indeed greater than or equal to the value of 5\. The statement
    `5 ≥ 4` is also true.


    Now that I’ve summarized the entirety of your 6th grade algebra class, let’s see
    how this works in Java. Relations!


    ```java

    //True

    boolean itsSmaller = 2 < 3 ;


    //False

    boolean itsBigger = 3 > 4 ;

    ```


    I know what you’re thinking. I’ve got this in the bag. Those operators are simple!
    Comparing values to see if one is bigger or smaller than another? Hah! What a
    joke. This guy must think I’m a complete fucking idiot. Well, yes, that’s the
    point.


    But there’s some more curveballs coming your way. Remember the “or equal to” bit
    I mentioned up above? In regular old math, that’s when you underline the carrot
    thing, like this: `≥`


    You can combine an equals sign with one of the comparison operators to form the
    same thing; a more craaaazy kind of relational check


    ```java

    //True

    boolean itsBiggerOrTheSame = 5 >= 5 ;


    //False

    boolean itsSmallerOrTheSame = 3 <= 2 ;

    ```


    Sure, putting the equals sign after the carrot isn’t as sexy as underlining it
    like you do in algebra. But that’s how you do it in Java. You can keep experimenting
    with these but you’re probably already getting the hang of it. Yeah, I guess you
    could say that’s a compliment. Keep up the good work buddy. Isn’t it amazing how
    easy programming is?!?! You’re so smart! And a wonderful reader! Also, did you
    award this book 5 stars yet?


    ## The comparison operator


    What happens if you put two equals signs next to each other?:thinking emoji:The
    answer is that the mommy equals sign and daddy equal sign come together and form
    a new operator; the comparison operator !This is where my tangent about how a
    single equals sign (=) means “assignment” and not “is equal to” really comes into
    play. So I hope you held on to that mystery mouseketool!


    Okay, let’s say that we don’t want to assign a value to a variable. Instead, we
    want to check if a variable is equal to a value. This is super duper, extremely
    common by the way. Enter the comparison operator; two equals signs, back to back


    ```java

    //True

    boolean isSameCharacter = ''c'' == ''c'' ;


    //False

    boolean isSameNumber = 5 == 4 ;

    ```


    The Booleans are back, baby! Are ‘c’ and ‘c’ the same character? Are 5 and 4 the
    same? The Booleans are back, baby! Are ‘c’ and ‘c’ the same character? Are 5 and
    4 the same? The Booleans are back, baby! Are ‘c’ and ‘c’ the same character? Are
    5 and 4 the same? The Booleans are back, baby! Are ‘c’ and ‘c’ the same character?
    Are 5 and 4 the same? The Booleans are back, baby!


    “Do you mean she puts on airs? If you be fancy, hold your pinky up like this.
    The higher you hold it, the fancier you are!” – Spongebob SquarepantsSometimes
    we are so lazy that we can’t be bothered to type things out in Java. That’s not
    surprising; programmers are inherently very lazy.Let’s say you run a zoo containing
    only giraffes (that’s fine in my book, by the way). Haha, my book. That’s funny
    cause we’re in my book right now. Get it? Isn’t that hilarious? Anyway, I hate
    when books have entire paragraphs inside parentheses. You forget what the original
    sentence was even saying); that could be represented with this line of code


    ```java

    int numGiraffes = 23 ;

    ```


    Now, let’s say you just received a new giraffe at your zoo. Hooray!!! Maybe this
    line of code is executed


    ```java

    numGiraffes = numGiraffes + 1 ;

    ```


    Wonderful! But wait, papa Java is knocking at the door. There’s a shorter way
    to write this for essentially no reason! How? Like this!!


    ```java

    numGiraffes++;

    ```


    Wow! That’s shorthand for the same line of code, saying “Take the current value
    of `numGiraffes`, increase it by 1, and set `numGiraffes` equal to that value.”How
    insanely useful is that?!?! Knocks your socks right off!Is that only for addition?Unsurprisingly
    to those of us with functioning neural passageways in our craniums, there are
    other fancy talk operators like the above addition one.A giraffe passes away,
    decrease by 1…


    ```java

    numGiraffes--;

    ```


    Triplets are born, increase by 3…


    ```java

    numGiraffes += 3 ;

    ```


    Half of the giraffe population is culled, divide by 2…


    ```java

    numGiraffes /= 2 ;

    ```


    The giraffes are cloned, multiply by 2…


    ```java

    numGiraffes *= 2 ;

    ```


    This is how we’d say that last one out loud:

