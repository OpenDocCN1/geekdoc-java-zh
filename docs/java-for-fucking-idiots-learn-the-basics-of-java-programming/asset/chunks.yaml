    doesn’t matter in the slightest.I then have a folder called “src” that will contain
    alllllll my Java stuff. This is just a standard thing for most Java developers
    to do, but it’s not mandatory.Then my package! I just called it “app” because
    I’m creating an application. Not very creative, I realize.Note: A package is just
    a folder! You could make the directories manually inside Windows Explorer, or
    from your command prompt. Doesn’t matter. I used IntelliJ because I’m not a sociopath.Then,
    like I mentioned, the class declares its package at the very top of the file.MemeApplication.javapackage
