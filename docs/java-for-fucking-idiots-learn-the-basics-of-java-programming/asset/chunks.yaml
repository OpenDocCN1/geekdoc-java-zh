  trans: "\n呼。铺垫了这么多。我们能用这些类做些什么呢？\n\n嗯，也许我会从 `Book` 类创建一个对象，并将其标题设置为“给白痴看的 Java”。我会创建一个\
    \ `Reader` 对象，将 `name` 属性设置为“Chad”，并将它的 `currentBook` 设置为我刚刚创建的那个书。我会运行 `Reader`\
    \ 对象的 `read()` 方法，然后是运行它的 `rate()` 方法。`rate()` 方法会将书籍的 `stars`（星级）属性设置为 5，因为 Chad\
    \ 看起来真的很喜欢。很有意思。\n\n# 面向对象的设计\n\nJava 以及面向对象的设计（Java 像信拜宗教一样遵循它）是一种对现实世界建模的方式，只不过是在代码中建模。\n\
    \n让我们想一下亚马逊的计算机系统。你每天购买的产品都是对象，我向你保证。送到你家门口的包裹是对象。司机每停一处都是一个对象。你的房子是一个对象。这段旅程本身也是一个对象。\n\
    \n那么 Java 中的程序是什么样子的呢？它是一堆对象以有意义的方式相互作用，从而让事情发生。\n\n在 Java 的世界里，这可能是一个桌面电脑程序（每个屏幕都是对象，屏幕上的元素也是对象）、一个\
    \ Web 服务（在互联网上发出的每个网络请求都是对象）、从数据库返回的数据是一个对象，你能想到的都有。\n\n虽然我不能声称你在 Java 中写的每个 `Class`（类）都基于现实世界中的某些东西，但它们将是具有属性和方法的名词。欢迎来到面向对象编程！祝你呆得愉快……混蛋。\n\
    \n# Hello, world?\n\n现在，让我们稍微后退一步，看看这些知识如何应用于“Hello, World!”程序。这里是给那些短期记忆缺失的人的（可能是你们中的大多数人）准备的。\n\
    \n```\npublic class HelloWorld {\n    public static void main (String[] args)\
    \ {\n        System. out .println( \"Hello, world!\" );\n    }\n}\n```\n\n让我们看看……有一个叫做\
    \ `HelloWorld` 的类。有一个叫做 `main()` 的方法。而且……额……呃……:thinking: emoji 表情 嗯……“Hello,\
    \ World!” 和面向对象编程有什么关系呢？\n\n剧透：它真的没关系……这里没有对象。它展示了 Java 中少数几个不是面向对象的概念之一：静态方法。这些方法存在于对象领域之外。该死的\
    \ Java。为什么你的“Hello, world!”程序不能没那么愚蠢？\n\n但我应该冷静一下。这对我的健康不好。让我们聊聊 `main` 方法中到底发生了什么。\n\
    \n## Main 方法\n\n“你觉得你自己是谁？凭什么……凭凭什么？”—— 迈克尔·斯科特\n\n`main` 方法是程序的入口；当程序运行时，就会运行\
    \ `main` 方法。包含“Hello, World!”字样的代码位于 `main` 方法内部。你放在那些大括号 {} 之间的任何内容实际上都在 `main`\
    \ 方法内部。\n\n```\npublic class HelloWorld {\n    public static void main (String[]\
    \ args) {\n        System. out .println( \"Hello, world!\" );\n    }\n}\n```\n\
    \n为什么有一个 `main` 方法？是什么让它如此特别？`main` 方法之所以存在是因为程序启动时需要某些东西运行。还记得那个“鸡生蛋还是蛋生鸡”的困境吗？\n\
    \n*   有人说鸡先生，因为所有的蛋都是鸡产的。\n*   有人说蛋先生，因为所有的鸡都是从蛋里出来的。\n\nJava 的答案是，这两个对象都不是先生的。`main`\
    \ 方法才是。如果没有 `main` 方法首先在对象领域之外运行，任何东西都不会存在。这就是那个“静态狗屁”的意思。静态属性和方法在没有对象的情况下存在。\n\
    \n“没有对象，没问题。”—— `static` 关键字\n\n或者……\n“除非必要，否则不要让事情变成静态的，因为对象是好的。”—— 我\n\n如果你还没有\
    \ 100% 理解这一点，不用太担心。就担心一点点。好吧，你可能在想。但是 `main` 单词前面的那些其他东西呢？`public`？还是 `void`？这简直太让人困惑了。\n\
    \n我会在书的后面更详细地介绍这些内容。但我现在也会简要回答一下，因为我讨厌当你想知道某事，而作者却说“等一下，我们会讲到的”。混蛋，我现在就告诉你。\n\n\
    *   在东西前面加上 `public` 表示所有其他类（即使在不同的文件夹中）都能看到它。如果你的某些代码要去上厕所并需要隐私之类的，你也可以将其描述为\
    \ `private`（私有的），但 `main` 方法不会！它总是是公开的！\n*   在某些代码前面加上 `void` 意味着它执行了一些酷炫的操作，但不汇报结果。没有人要求\
    \ `main` 方法报告事情进展是否顺利，或者返回某个数学计算的值。`Main` 方法不在乎是否有人知道。\n\n懂了吗？如果没有懂，再读一遍那些解释……好吧，我知道你不会去读。我会更简短地总结一下：\n\
    \n1.  `main` 方法是 Java 开始运行你的程序的方式。\n2.  `main` 方法是 `static`（静态的），因为需要某些东西存在于对象领域之外。Java\
    \ 的开发者是这么说的。\n3.  `main` 方法是 `void`（无返回），因为它不需要向调用它的人提供值。Java 的开发者是这么说的。\n4. \
    \ `main` 方法是 `public`（公共的），因为它会被这个文件夹之外的人调用。Java 的开发者是这么说的。\n\n# 声明一个类\n\n让“Hello,\
    \ World!”留在它该去的地方，我来解释如何声明一个类：\n\n```java\nclass Book {\n}\n```\n\n很酷！任务完成。\n\n\
    好了，我们声明了一个基础类。\n\n然而，当类像这样空空运行时几乎是没用的。让我们添加一个属性。\n\n```java\nclass Book {\n  \
    \  String title ;\n}\n```\n\n# 属性\n\n在现实世界中，属性是什么？不，不是富翁游戏里的属性。让我们问问字典。属性：“事物的本质或独特的特征或品质。”\n\
    \n是的。在 Java 中也是如此。我们称 `title` 为属性是因为它属于一个类。它是书籍的名字。没有书，它就不存在。我们可以添加更多属性：\n\n```java\n\
    class Book {\n    String title ;\n    String content ;\n    String[] chapterNames\
    \ ;\n    int bookmarkedPage ;\n    double averageRating ;\n    boolean hasSequel\
    \ ;\n    Author author ;\n}\n```\n\n总之，开始理解大意了吗？类可以与其关联的信息，称为属性。提醒你一下——这些属性对于从该类创建的每个对象都是特定的。我可以创建\
    \ 500 本书，它们会有不同的 `title` 属性。我最终可能会写出不错的书。\n\n# 读写 101\n\n在 Java 中，你可以使用句号与这些属性进行交互。这被称为“点符号法”。假设我们有一个名为\
    \ `bestBook` 的 `Book` 类实例。这是一个真正的 `Book` 对象，是从 `Book` 类创建的。以下是我如何操作它的属性。\n\n```java\n\
    bestBook. title = \"如何在不到 20 分钟内成为一名高级服务员\" ;\nbestBook.content = \"忘记所有精致餐饮以外的一切。还有呼吸。\"\
    ;\nbestBook. averageRating = 5.0 ;\n\nSystem. out .println(bestBook. title );\n\
    ```\n"
- fmt: "\nThe result? The program spits out the text:“How to become a fancy waiter\
    \ in less than 20 minutes”.The dot, or period thing, is like a window into the\
    \ object’s soul. Put the dot after the name of your object, and access as much\
    \ as you can see with it.\n\n## Methods\n\nRemember the main method? Well, it’s\
    \ called the `main` method because it’s the big important one that runs first.\
    \ But you can have more than one.\n\nIn fact, it’s highly recommended to have\
    \ more than one method. Splitting your code up into many smaller methods makes\
    \ it easier to read and understand what a program is doing.\n\nWe just briefly\
    \ touched on properties, which are pieces of data that are related to the object.\
    \ The difference between properties and methods?\n\n*   Properties are what an\
    \ object is .\n*   Methods are what an object does .\n\n“But…but Steve. That doesn’t\
    \ really explain what a method is in Java . What are you, an idiot?” – you\n\n\
    Okay okay maybe not you. You probably wouldn’t remember my name.Look, we’re early\
    \ on in the book. There’s a lot of material to cover, and I don’t want to get\
    \ into the weeds (blaze it) of methods. I’ll give you one example of what they\
    \ might look like in Java.\n\n```java\nclass Video {\n    void resume() {…}\n\
    \    void pause() {…}\n    int getLikesCount() {…}\n    String getTitle() {…}\n\
    \    Video[] fetchRecommendations() {…}\n    boolean isPaused() {…}\n}\n```\n\n\
    Just like with properties, you can use dot notation to touch its shit.\n`bestVideo.resume();`\n\
    `bestVideo.pause();`\n\nI just resumed and paused the video really quickly. Hopefully\
    \ that didn’t break it and cause it to buffer for an eternity…Anyways, I realize\
    \ I left those methods empty. Maybe those methods are modifying properties (which\
    \ I didn’t type out) of the `Video` object.\n\nThe great thing about objects and\
    \ methods is that you’re dividing up the code’s responsibilities into manageable\
    \ chunks. The `pause()` method doesn’t need to know how to `resume()`.The `fetchRecommendations()`\
    \ method takes care of finding “related” videos that YouTube wants to shove down\
    \ your throat; `getTitle()` don’t care about that!\n\nGood programmers keep their\
    \ methods small, well-named, and straightforward.But that’s enough on methods\
    \ for now – there’s a lot of very basic Java concepts we need to cover before\
    \ we dig much more into this. Onwards and upwards!\n\n## Chapter 4: Variables\n\
    \n\"Not enough variables... hmm... not nearly enough variables.\" - Heimerdinger\n\
    \nOkay, it’s time to dig into the nitty gritty of learning the language. Get your\
    \ big boy (or girl) pants on, cause shit is about to get real.Let’s talk variables.Ever\
    \ take algebra in middle school? Seen something like this?\n`7 = 3 + x`\nSolve\
    \ for `x`, right? Variables are kind of like that.\n\nHere’s an example:\n```java\n\
    int myFavoriteNumber = 7 ;\n```\n\nLater if we use the `myFavoriteNumber` variable\
    \ it would be equal to 7.So, variables are human-readable things that are given\
    \ values. The short-term memory of your computer says “OK, I’ll store that value\
    \ for you. Use that variable name again when you want to know that value, or change\
    \ it.”\n\nA person types “Please remove me from this distribution list” into Microsoft\
    \ Outlook. The program would represent that data as a variable.Another person\
    \ opens the Calculator on their computer and presses the number 3. That’s another\
    \ variable. A different kind of variable, but one nonetheless.Your Veterinarian’s\
    \ computer system checks if you have used them before; this yes/no, or true/false\
    \ value can be represented by a variable, too.\n\nVariables are eeeeeeverywhere\
    \ . Create them, store them for later, change them, send them to your friends,\
    \ get attached to them, cry over them. They’re wonderful.\n\n### Why do we need\
    \ variables?\n\nWe cannot know the future, and neither can our programs (yet).\
    \ Our code might need to respond to the user’s entered account name, the time\
    \ of day, the amount of items that are in inventory, the information scanned in\
    \ a barcode, the breed of dog in a cute picture, the GPS coordinates of your phone,\
    \ you name it.\n\nThings that we do not know now , but our program can find out\
    \ while running (“at runtime”), are good candidates for variables.\n\nOK, now\
    \ let’s make some.\n\n### Making variables\n\nYou can declare a variable, basically\
    \ telling the compiler “hey, this is something I’m going to use later, OK?” like\
    \ this:\n```java\nint numberOfStarsToAwardThisBook;\n```\nVariable declared. Hooray!\
    \ However, it doesn’t have a value.We can fix this later with a new line of code\
    \ that initializes the value:\n```java\nnumberOfStarsToAwardThisBook = 5 ;\n```\n\
    Alternatively, we could have just done it from the start (declaring and initializing):\n\
    ```java\nint numberOfStarsToAwardThisBook = 5 ;\n```\nNaturally, Amazon does not\
    \ have code that makes every review 5 stars built into their software. We would\
    \ likely show the user a screen to make a selection, then set this variable equal\
    \ to the # of stars they selected afterwards.\n\n### Data types\n\nWhat was the\
    \ “int” part for?\n`int` is short for integer. Integers are whole numbers. This\
    \ is honestly elementary math but as I’ve said before… minimal assumptions.\n\n\
    These are whole numbers: 4, 8, 15, 23, 42, -15, -214\nThese are not whole numbers:\
    \ ½, ¾, 0.86, -84.9\n\nYou can put the word `int` before a variable to specify\
    \ that it is a whole number.Java is absolutely paranoid about these “types” and\
    \ if you don’t specify one, the compiler is going to be upset.Here are some the\
    \ different kinds of variables you can make:\n\n*   `byte`: A tiny number (-128\
    \ to 127) support positive or negative. typically used for dealing with files.\n\
    *   `int`: a whole number that can store quite large numbers. Very common.\n*\
    \   `short`: a smaller `int` who gives a shit, don’t use these (unless you have\
    \ a very specific reason).\n*   `long`: an integer that can be hyuuuge.\n*   `double`:\
    \ a number that can have decimal points, like 4.2, or 6.9.\n*   `float`: a stupid\
    \ and useless version of `double`.\n*   `char`: a single character inside single\
    \ quotes, like ‘g’ or ‘f’.\n*   `boolean`: true, or false. Nothing else. The data\
    \ type of Siths.\n\nYou can Google “Java data types” or click [this link](https://docs.oracle.com/javase/tutorial/nutsandbolts/datatypes.html)\
    \ to see all of your options.\n\n### What are thooooose?\n\nThey’re primitive\
    \ data types; not because they’re illiterate and don’t bathe, but they aren’t\
    \ objects.Imagine the universe in Java is not composed of protons, neutrons, and\
    \ electrons at its lowest level (hope you graduated from middle school!), but\
    \ primitive variables.A primitive variable does not have properties. It does not\
    \ have methods. It is not a blueprint from which we can create an object. It cannot\
    \ reproduce.You cannot get more basic than a primitive. I mean, look at them.\
    \ `char` is a single letter. `double`/`float`/int`/short` are numbers. `boolean`\
    \ is true or false.Note that all the examples I listed start with a lowercase\
    \ letter; this is the tell-tale sign of a primitive variable.Every class or object\
    \ that stores or processes data, somewhere deep inside, has data represented by\
    \ primitives. I think. Probably.For example, there’s a class in Java that’s extraordinarily\
    \ common called a `String`. See the capital S? Not a primitive!\n\n### A note\
    \ on Strings\n\nWhat’s a String , you ask? Literally anything inside of two double\
    \ quotes.\n\n*   “Hello, world!” is a `String`.\n*   “ ” is a `String` with a\
    \ space in it\n*   “” is an empty `String`\n*   “123” is a `String`\n*   “598.23”\
    \ is a `String`.\n*   “This entire book within some double quotes is a `String`.\n"
