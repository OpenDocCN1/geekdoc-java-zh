- fmt: "\n“assign to `numGiraffes` the current value of `numGiraffes` times 2.”\n\n\
    In all honesty, I typically do not recommend using these, except maybe the `++`\
    \ and `--` ones. I PERSONALLY (opinion alert!! ) find writing out the actual mathematical\
    \ operation to be easier to understand. Remember that you should primarily write\
    \ your code to be understood by a human; your future self and other team members\
    \ will appreciate it.\n\n### King boolean\nRemember when I went over the exclamation\
    \ point (`!`) and how it basically is saying “not”? So `!=` is checking if a value\
    \ is “not equal to” another value? \n\nThere’s an easier way to write this in\
    \ `Java` if you’re simply trying to flip something from true to false (`boolean`\
    \ values), or vice versa. For example, instead of something like this:\n`boolean\
    \ isBad = isGood != true ;`\nYou could simply say:\n`boolean isBad = !isGood ;`\n\
    The exclamation point goes directly in front of the `boolean`. Wow again!!\n\n\
    The other operators… Not even gonna go over them. If you want to learn about bitwise,\
    \ shift, or the ternary operators, look for a more advanced piece of material.\
    \ Or encourage me to write another book. Winky face.\n\n### My brain hurts\nAll\
    \ those fancy talks are optional, so don’t fuss. Plus, if you use an IDE like\
    \ `IntelliJ`, it will correct you if you’re doing something in a stupid way.\n\
    \n## Chapter 6: Conditionals\n“It’s time to get funky.” – DJ Casper\n\nMost times\
    \ your code can’t simply run top to bottom, statement after statement, and do\
    \ anything useful. You need your code to do something different based on what\
    \ the user typed in, or what products you have in stock, or what version of `Android`\
    \ you’re running on, etc.\n\nBehold, the might `if` statement:\n```java\nif (numGiraffes\
    \ > 500 ) {\n    System. out .println( \"Please send help.\" );\n}\n```\nThat\
    \ line of code that prints to the system only happens if we have more than 500\
    \ giraffes. Another example:\n```java\nScanner userInputReader = new Scanner(System.\
    \ in );\n\nint userInputNumGiraffes = userInputReader.nextInt();\n\nif (userInputNumGiraffes\
    \ <= 0 ) {\n    System. out .println( \"Where they at?\" );\n}\n```\nThat line\
    \ of code prints to the system only if the user typed in a 0. Or a negative number.\
    \ I’m going to skip explaining how to [get input via a Scanner](https://stackoverflow.com/questions/11871520/how-can-i-read-input-from-the-console-using-the-scanner-class-in-java/31241089),\
    \ OK? Really, really dull stuff.\n\nAnyway, does the `if` part make sense? It’s\
    \ pretty similar to English, really. If this, do that. Now, what if we also want\
    \ to do something when the user types in an actual value? If you remember the\
    \ comparison operators, you could add something like this below that conditional:\n\
    ```java\nif (userInputNumGiraffes <= 0 ) {\n    System. out .println( \"Where\
    \ they at?\" );\n}\n\nif (userInputNumGiraffes > 0 ) {\n    System. out .println(\
    \ \"I shall add them at once.\" );\n}\n```\nTwo `if` statements, back-to-back.\
    \ Could work, right? But that’s stupid. Why check the value of `userInputNumGiraffes`\
    \ in two places? Don’t do that.\n\nInstead, add an `else` block to the original\
    \ `if` statement, as follows:\n```java\nif (userInputNumGiraffes <= 0 ) {\n  \
    \  System. out .println( \"Where they at?\" );\n} else {\n    System. out .println(\
    \ \"I shall add them at once.\" );\n}\n```\nIf the first check (the user inputs\
    \ a value less than or equal to 0) is true, we go inside the `if` block. Otherwise\
    \ (`else`!) we go to the `else` block. Programming is EASY dude.\n\nOh, and you\
    \ don’t need to put the word `else` on the same line as that curly brace `{`.\
    \ You could press enter and push the `else {` to the next line, like this:\n```java\n\
    if (userInputNumGiraffes == 0 ) {\n    System. out .println( \"Where they at?\"\
    \ );\n}\n\nelse {\n    System. out .println( \"I shall add them at once.\" );\n\
    }\n```\nYou could also put each curly brace on its own line. You’d be committing\
    \ a `Java` code style atrocity, but you can do it if you really want to piss me\
    \ off.\n\nOK, I hope you’re with me so far; you can check if something is true\
    \ or false, then act appropriately using `if/else` (conditional) logic. This is\
    \ called control flow. You’re controlling the flow of the program.\n\nHowever,\
    \ there are situations where it’s not simply “do this if X, else do something\
    \ different”. You might want to do different things based on how many giraffes\
    \ there are, for instance. How do we do that? Well, there’s a few ways to skin\
    \ this cat….\n\n### Multiple if/else checks\nHow about something like this? Inside\
    \ the `else` block, we add another `if/else` check. Inside that `else` block,\
    \ we add another `if/else` check, and so on. That works, right? Note that if you’re\
    \ on a small screen this bit might get messy, but bear with me…\n```java\nif (userInputNumGiraffes\
    \ < 0 ) {\n    System.out .println(\"Get your hands the fuck off my giraffes.\"\
    \ );\n} else {\n    if (userInputNumGiraffes == 0 ) {\n        System.out .println(\"\
    Sorry, you cannot add 0 giraffes.\");\n    } else {\n        if (userInputNumGiraffes\
    \ < 3 ) {\n            System.out .println(\"Thanks for 1-2 giraffes.\" );\n \
    \       } else {\n            if (userInputNumGiraffes < 10 ) {\n            \
    \    System.out .println(\"Thanks for 3-9 giraffes.\" );\n            } else {\n\
    \                System.out .println(\"How did you have 10+ giraffes?\");\n  \
    \          }\n        }\n    }\n}\n```\n"
