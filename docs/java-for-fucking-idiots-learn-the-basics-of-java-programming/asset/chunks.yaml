    …Well that’s simply too high! The while loop sees the index isn’t less than 26,
    so it doesn’t run even once! Not a single letter is printed out.That’s good though,
    right? No problem with that. The while statement is simple and does what it’s
    supposed to: runs code over and over again while a certain condition is true.Here’s
    comes the fun, doo doo doo dooHowever, at some point the Java developers thought:
    why don’t we fix this? Oh, it makes sense as-is, but why don’t we add another
    kind of loop for no reason?(Note: this actual conversation didn’t happen)That’s
    when we get the “do-while” loop, or “doo doo” while loop, as I call it. Because
    it’s stupid and no one uses it, except the one guy reading this that is infuriated
    that I’m insulting his favorite language construct.Here’s how it works:I write
    some code. It’s run once. Then, we start a while loop. It might be run again.do
    {


        System. out .println( "I hate that I exist." );


    } while ( false );What do you think would happen if we run this code? Take a guess
    inside your little noggin.“I hate that I exist” is print out to the screen once.
    Then, the condition is evaluated at the end .Since I literally wrote false (the
    opposite of true ), the loop doesn’t keep going. One could argue the loop never
    started. This is the opposite of the while loop, which looks at the condition
    at the beginning .I’ll give you some more:boolean havingFun = false ;


    do {


        //A game of League of Legends sets havingFun to true or false.


    } while (havingFun);In place of actual code, I left a comment there that describes
    how such code would work.In this code, we always play one game of League of Legends,
    even if we aren’t yet having fun today. Then, if we are having fun, we keep playing
    until it’s no longer fun.But really. I have never once encountered a scenario
    where I found I wanted to use a do while loop. Maybe I’m just an idiot.Like with
    anything there will be someone who argues otherwise; maybe using a do-while loop
    0.00001% of the time it makes the code easier to read. But I can’t be bothered
    to care.You can always write it to fit into the other 2 primary kinds of loops,
    while loops and for loops.Did someone say FOR loop??First of all, why another
    kind of loop? We already have a way to do things repeatedly with the while loop.
    And we have a stupid way to do it with the do while loop.What else could we possibly
    need to loop through data, do things over and over until something changes, etc.?Let’s
    summarize how we wrote a while loop for looping through an array.


    1.  Declare an “index” variable that is used while looping.


    2.  Write the condition that determines when the loop should keep going or stop.


    3.  Increase the index at the end of the loop.


    The for loop (promo code steve)Well, scientists have invented a type of loop that
    does all of that much easier! Check out how you’d write a loop the old way, versus
    with this new type of loop!//While loop


    char [] myArray = {''A'' , ''B'' , ''C'' , ''D'' };


    int i = 0 ;


    while (i < myArray.length ) {


        System.out .println(myArray[i]);


        i++;


    }//For loop


    char [] myArray = { ''A'' , ''B'' , ''C'' , ''D'' };


    for ( int i = 0 ; i < myArray. length ; i++) {


        System. out .println(myArray[i]);


    }“Holy shit!” – you, the readerI mean look at it! It’s majestic! In that one line
    of code (the one that starts with for ) we did the exact same 3 things that while
    loop did in 3 different locations.


    1.  Declare an “index” variable that is used while looping.


    2.  Write the condition that determines when the loop should keep going or stop.


    3.  Increase the index at the end of the loop.'
