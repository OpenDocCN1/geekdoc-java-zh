  trans: "\n```java\nairplane.fly( 0 , 12552.854 );\n```\n是的，最后那行代码会让飞机以惊人的速度坠毁。别担心，`fly`\
    \ 方法应该确保传递的参数是合理的。如果你想在调用方法时允许更多自定义的行为，同时又提供一种简单的方法在传递那么多参数的情况下调用方法，那么对方法进行重载通常是一个好主意。在底层，你甚至可以像这样操作让你的代码非常具复用性：\n\
    \n```java\nclass Airplane {\n    void fly() {\n        fly(currentAltitude);\n\
    \    }\n    void fly( int altitude) {\n        fly(altitude, currentSpeed);\n\
    \    }\n    void fly( int altitude, double speed) {\n        //真正的飞行代码\n    }\n\
    }\n```\n\n看到它们是如何互相调用的了吗？这就是如何在无需复制粘贴的情况下重用代码的示例！！！！这就像链链之类的。只想开始飞行吗？调用 `fly`，它将使用当前高度。想改变高度吗？它将以当前速度飞到那个高度。想同时改变两者吗？调用完整的\
    \ `fly` 方法。\n\n## 疯狂中的方法 (Method to the Madness)\n\nJava 中的对象一直在忙碌。这就是我们写代码的原因的原因；程序需要为我们人类做一些有价值的事。方法不仅有助于代表对象做事；它们还让我们这些程序员将混乱的意大利条面代码变成合理的代码块。例如，还记得尤金（Eugene）吗？你认为尤金只有一个方法来执行他的翻译吗？\n\
    \n在底层，那个 `translate` 方法可能在执行这一系列操作：\n\n```java\nString translate(String textToTranslate)\
    \ {\n    cleanseInput(textToTranslate);\n    parseWords();\n    translateWords();\n\
    \    adjustPunctuation();\n    …\n    return translation ;\n}\n```\n\n这比 1000\
    \ 行的面条型方法好得多。拆分你的方法以防止方法的疯狂。\n\n## 第 11 章：字符串 (Strings)\n\n### 字符串理论 (String theory)\n\
    这是一个理论框架，其中粒子物理学中的点粒子被称为“字符串”的一维对象所取代。我的字符串理论是，Java 中的 `String` 是史上最好的变量类型。有史以来最好！\n\
    \n### 什么是字符串？\n你见过它们。我聊过它们。你现在可能对它们是什么有个大概的了解。它只是一些文本，对吧？“abc”或“23890chusoao”？这些不是\
    \ `Strings` 吗？是的。双引号 “ ” 是标识 `Strings` 的标志。或者，你知道的……`String` 这个单词。呆。但 `Strings`\
    \ 在 Java 中非常特殊；它们不仅极其常见，还有大量的内置方法让它们变得超级强大。你应该知道为什么 `Strings` 是最好的。就是 Alanis Morisette\
    \ 会提倡的那种“应该知道”的东西。任何不需要数学（加法、乘法之类的）且不是布尔值（真或假）的值在 99.9% 的情况下都应该是字符串，ISO（在 Steve\
    \ 看来）。\n\n### 文本 (Text)\n想表示单个字符吗？你可以使用 `char`，对吧？\n\n```java\nchar firstLetter\
    \ = 'A' ;\n```\n直接用 `String` 吧。\n\n```java\nString firstLetter = \"A\" ;\n```\n\
    既然可以获得真货，何必去用基本类型呢？不用说，如果你需要字符字符串，你也会使用 `String`。\n\n```java\nString myName =\
    \ \"Steve\" ;\n```\n\n你……你刚才说了一个字符字符串吗？是的，这就是 `String` 的面目，至少在底层是这样。在 Java 制作\
    \ `String` 的内部某处存在一个 `char[]`。事实上，我刚刚查了 `String` 的源码。看！\n\n```java\npublic final\
    \ class String … {\n    //该值用于字符存储。\n    private final char value [];\n    …\n\
    }\n```\n\n想象一排字符排好队，用一根绳把它们系在一起。并没有那么牢固；如果你想的话，可以剪断绳。但它们是一个整体！耶，`Strings!`！\n\n\
    ### 数字 (Numbers)\n那数字呢？仅仅因为一个值看起来是数字并不意味着它应该是一个整数。别误会我，很多时候你需要数字是 `ints` 或 `doubles`（去他的浮点型）。但并不如此！例如，电话号码……\n\
    \n```java\nlong jennysNumber = 5558675309L ;\n```\n\n你不会把电话号码加在一起的！把它变成字符串！\n\n\
    ```java\nString jennysNumber = \"5558675309\" ;\n```\n\n### 创建字符串 (Making a String)\n\
    “你只是把一些东西放在两个双引号里，我懂。”好吧……我应该告诉你，理论上你可以这样做。别这样做。\n\n```java\nString jennysNumber\
    \ = new String( \"5558675309\" );\n```\n\n是的，`Strings` 是对象。它们有构造函数。不过，这个构造函数完全没用。说真的，比男人的乳头还没用。Java\
    \ 让我们使用简写简单地将值放在双引号内并就此结束。\n"
- fmt: '

    Hmm. How can we see if “vaccines” is inside there, no matter what case the letters
    are in? I know! We’ll use `containsIgnoreCase` !Just kidding – doesn’t exist!
    Dammit Java.


    There’s one easy way to do this for 99.9% of scenarios. It involves our next superpower,
    so we’ll go over it first. `toLowerCase` and `toUpperCase`


    ```java

    String bestGame = "Old School Runescape" ;


    //"OLD SCHOOL RUNESCAPE"


    String bigBoy = bestGame.toUpperCase();


    //"old school runescape"


    String lilBoi = bestGame.toLowerCase();

    ```


    Extremely straightforward. Just changes letters to either the upper- or lower-case
    versions. The people who wrote those methods? [Not as straightforward for them](http://unicode.org/reports/tr21/tr21-5.html)
    .


    `containsIgnoreCase`? Remember? Hello? Ah, right! Okay, first, you just standardize
    what case the letters are in. Then you can do `contains`.


    ```java

    String testString = "BOy I HatE HoW VACccINeS" CauSe AUTisM" ;


    //"boy i hate how vaccines cause autism"


    testString = testString.toLowerCase();


    //true


    testString.contains( "vaccines" );

    ```


    If you really wanted to, you could instead change it to `toUpperCase` and look
    for “VACCINES”. `charAt` Remember “indexes” from arrays? You know, `[0]` gets
    the first element, `[1]` gets the second element, and so on? Well that knowledge,
    unfortunately for you, is coming back from the dead for this exercise.


    ```java

    "we live in a society" .charAt( 1 );

    ```


    This returns the ‘e’ character.


    ```java

    "I hate sand" .charAt( 7 );

    ```


    This returns the ‘s’ character. Yes, spaces from your spacebar “ “ are characters,
    so you need to include them when you’re dealing with the indexes of characters
    in a `String`.


    Not too bad. Now for the next method. :)


    ## `substring`


    Let’s say we want to get the first 5 letters of a `String`.


    ```java

    String helloWorld = "Hello, world!" ;

    ```


    Oh god, it’s back. Anyway, we can pull out a “substring” inside this `String`
    by giving Java the starting index and ending index of the characters we want.


    ```java

    String firstFive = helloWorld.substring( 0 , 5 );

    ```


    This is saying “get me the 0th character up to the 5th character”. The result
    of which is “Hello”. Wait, 0 to 5? Isn’t that 6 characters? `0, 1, 2, 3, 4, 5`…that
    is 6! What the hell is happening here?! Why did we only get “Hello” and not the
    comma too?


    Here’s the tricky bit (you knew it was coming): Java don’t work like that. You
    are asking to get the 0th character UP TO, NOT INCLUDING the 5th character. This
    is known as “inclusive” and “exclusive”.


    ```java

    String firstFive = helloWorld.substring( 0 , 5 );

    ```


    “Get the substring starting at index 0 INCLUSIVE and ending at index 5 EXCLUSIVE.”
    `0, 1, 2, 3, 4, 5` (here, 5 is the friend without a group in class and is left
    out) `H, E, L, L, O`


    Let’s do another. Look who’s purging now


    ```java

    "Ah geez I don’t know Rick" .substring( 4 , 7 );

    ```


    Let’s say this `String` is written out on a thin sheet of paper. Picture taking
    some scissors and cutting the string at position 4 and 7. Everything we don’t
    want is thrown into the wastepaper bin.


    **Cut one**: The first cut we make is at the lowercase g in “geez”. It’s 4 over
    from the left. Because the rules state that we include the first index in our
    result, we we cut to its left so we don’t lose it. “Ah “ is then thrown in the
    trash.


    **Cut two**: The second cut we make is at the blank space “ “ after “I”. It’s
    7 over from the left. Remember; we don’t want the character at the 7th index;
    it’s excluded . We also don’t want anything to the right of it. Because the rules
    state that we exclude the last index in our result, we cut to its left so it’s
    excluded. Everything to the right of, and including the blank space “ ” is then
    thrown out.


    Snipping complete! The paper remaining says “geez”. In the trash, we have “Ah
    “ and “ I don’t know Rick”. Visualize the `String` being cut up and follow these
    instructions once or twice again.


    ## More sugar


    I know. I know. You’re an idiot newbie and you’re still confused. But this is
    one of those things that really just needs drilled into your head. Here, I’ll
    give you some examples to help you out, friend. Use your finger to count from
    left to right and make sense of why the results are what they are:


    ```java

    //"NOP"

    "LMNOPQ" .substring( 2 , 5 );


    //"B"

    "ABCDEFG" .substring( 1 , 2 );


    //"WH"

    "WHAT" .substring( 0 , 2 );


    //"" (empty string)

    "GAWRSH" .substring( 1 , 1 );

    ```


    Hopefully you’re beginning to comprehend this. One more thing to mention here.
    You know how we give the start index and end index? Well, Java lets you only give
    the start index, if you want. The result? You only make one cut, and Java gives
    you the entire tail end of the `String`.


    ```java

    //"Cool"

    "Lame Cool" .substring( 5 );


    //"BC"

    "ABCDEFGHIJKLMNOP" .substring( 1 );

    ```


    ## `split`


    I like this method. It creates a bunch of smaller Strings out of `String`. You
    give Java a character to `split` on. You’re left with an array. Strings each occurrence
    of that character.


    ```java

    String sentence = "I just think they''re neat" ;

    String[] words = sentence.split( " );

    ```


    Guess what? We now have an array! `{ "I" , "just" , "think" , "they''re" , "neat"
    }` When Java saw an empty space, it dropped the string up. The bits to the left
    and right ended up in the array.


    ## `trim`


    Okay, last one. This one is easy. It removes all whitespace and newlines from
    beginning and end of `String`.


    ```java

    "This is great." .trim();

    ```


    We are left with “This is great.”


    Okay, not bad! One more example. Let’s say you’re a shopping website on the interwebs.
    The user purchases an item, and you want to thank them for purchasing it. Maybe
    you’d show them a message like this:


    ```java

    String itemName = "Everybody Poops" ;


    double price = 2.99 ;

    ```

    '
