    be used for the silly examples above, OK? Yeesh. Just introducing some stuff.See
    the numbers 5, 3, and 7 in the first example?int x = 5 + 3 - 7 ;Because they’re
    directly written into our source code, those numbers are hard-coded .I mentioned
    this earlier, but no one would ever write Java code like this. If they want x
    to be 1, they’ll set it equal to 1 to begin with.We use these math operators (+
    - / *) to calculate things we don’t know the value of right now, but we will when
    our program is running!Maybe you’re making a shopping cart website. Your program
    might multiply (*) the current price of a product by the quantity the user selects
    to get the total price. Or, your program might decrease (-) the total by one if
    the user removes it from their cart.The logical operators!These ones are easy
    peezy.They’re basically the Java version of these words in English:


    *   and (&&)


    *   or (||)


    No, that’s not art of a bunch of buttocks. It’s the new operators inside of parentheses.OrLet’s
    create some booleans ! Remember that data type? A boolean value is either true
    or false. This data type goes hand-in-hand with these “logical” operators.boolean
    imBored = true ;


    boolean imHungry = false ;


    //True


    boolean imGoingToEatFood = imBored || imHungry;See how the or operator || works?
    “I am going to eat food if I’m bored or if I’m hungry.”If either one of those
    conditions are true, then imGoingToEatFood is set to true.More examples…


    *   I’m making a text-based adventure game. If the user types in “exit” or “done”,
    I exit the program.


    *   I’m making a program to monitor the stock market (this is where money lives
    and dies). If the price of a stock I own goes severely up, or severely down, I
    send out an email alert.


    In fact, Java won’t even look at the right side of the || operator if the left
    side is already true; there’s no point! Java’s like… why check imHungry if I already
    know imBored is enough to warrant eating food?AndThat’s not true when it comes
    to the and (&&) operator. Both need to be true for the expression to evaluate
    to true.boolean wellRested = true ;


    boolean motivated = false ;


    //False


    boolean goingToWorkOut = wellRested && motivated;Even if I’m well rested, if I
    have no motivation at all, I won’t work out. And even if I were motivated to work
    out, if I have no energy due to lack of sleep, I’ll probably pass as well.More
    examples…


    *   I’m writing an app where the user must log in using their account information.
    I only try to sign them in if they’re entered a username and they’re entered a
    password.


    *   I’m creating a lighting system that automatically turns off the lights if
    the lights are currently on and there has been no one in the room for 5 minutes.'
