    所以，Steve 的源代码（人类可读）通过编译器编译成机器码（机器可读）。而机器码就是要在计算机上运行的内容。这就像是请了一位翻译员来和说不同语言的人交流。


    `Source Code -> Compiler -> Machine Code`

    “计算机，请把 2 加 2” -> 编译器 -> “01100110101”


    明白了吗？你编写源代码，编译器将其转换为机器码，然后计算机运行这些机器码。把这些东西记进你那厚实的脑瓜里（两个两个 c）。


    ## 编译的兴趣（Compiling interest）


    现在，我漏掉了一个部分。你看，机器码是专门为计算机的 `CPU` 创建的。到这里，你的眼睛可能已经快要翻到脑后了。要么你已经知道这是怎么回事，要么你已经开始困惑了。请耐心听我说。


    对于那些还不了解情况的人来说，`CPU`（中央处理单元）是机器的大脑，负责所有的繁重工作。有些人称其为“芯片”或“处理器”。你怎么叫它都无所谓，对我来说，你管它叫门门手也行。总之，我们创建机器码是为了在计算机的处理器/`CPU`
    上运行。如果我们把这些机器码给另一台计算机，会发生什么呢？


    具体来说，如果我写了一些代码，将其编译成一个程序并在我的计算机上运行（使用处理器 A），然后把它给我的朋友运行（使用处理器 B），会发生什么？嗯。我写了代码并为处理器
    A 编译……我的朋友有处理器 B……我猜它可以运行！是啊，程序很智能，直接就能运行，没问题的！


    不，答案是行不通的！想象一下用英语写了一本小说，并请一位专业人士将其翻译成西班牙语。你会指一个只会说瑞典语的人能懂翻译员的作品吗？


    对我们来说的是，由于架构设计的原因，`CPUs` 读取的是特定的计算机指令。处理器 A 需要的指令与处理器 B 不同。


    我们该如何解决这个问题？等死吗？也许吧！更现实一点，我需要为处理器 A 编译我的程序，然后为处理器 B 编译，最后确保将正确版本的程序交给正确的计算机。“噢，那太糟糕了！”——
    兰迪·马什（Randy Marsh）。


    ## 核心思想（The Big Idea）


    大多数编程语言从人类可读的源代码编译成机器码，以便在特定类型的计算机上运行。


    ## Java 圣经中的读段


    Java 的创造者感到非常沮丧，并问道：“如果我们能编写一种可以在任何计算机上运行的编程语言会怎样？”而他们做到了。他们降临人间，向世人宣告。


    “看吧。我们将创造一种可以在每个 `CPU` 上运行的编程语言。程序员将能够编译一次代码，并在处处运行！”


    “但这怎么可能呢？”程序员们回答道，“你如何能同时为每台机器编译呢？每种类型的机器都必须有一个版本的程序！”


    “不要害怕，孩子。这种语言是 Java，而 Java 是好的。你们将用 Java 编写代码，它将被编译并在 `Java Virtual Machine`（Java
    虚拟机）上运行。”天空中的回答道。


    他们很困惑，质疑创造者们：“但什么是 `Java Virtual Machine` ？”


    “`JVM`？很简单，”他们回答道，“每台机器上都应该有一个名为 `Java Virtual Machine` 的程序，它能理解编译后的 Java 代码。你们不需要为机器本身进行编译；你们需要为
    `Java Virtual Machine` 进行编译！”


    “但我的烤面包机呢！我把 `BASIC` 代码编译为运行在烤面包机架构上，我要如何运行我的程序？”一位勇敢的程序员问道。


    “哈！哈哈！愚蠢的人类。我们为烤面包机准备了一个版本的 `JVM`。还有冰箱。以及 PC、Mac 和 Linux。为每个系统安装正确的 `JVM`，Java
    程序就能运行了。”


    于是，事情就成了。


    ## 严肃时刻（Serious time）


    你是否希望自己从未读过这样的段落？你现在恨我恨入骨髓了吗？我不怪你，但让我们快速触及一些在讨论编程语言，呃……“移植性”这个话题时会提到的术语。毕竟，你可能不想在描述技术性内容时引用一个虚构的圣经故事。我仍然不信任你能尝试描述任何技术性东西，但如果你需要的话，这部分应该会有帮助。


    *   **机器语言 (Machine Language)**：针对计算机 `CPU` 的极其具体的指令，告诉它如何处理 0 和 1、执行数学运算以及那些令人困惑的破事。

    *   **汇编语言 (Assembly Language)**：一种比机器语言稍微好理解一点的语言。汇编语言代表我们，为特定的 `CPU` 架构创建机器码。它基本上是机器语言的缩写。离远点。

    *   **编程语言 (Programming Language)**：现代人类用来编写软件的语言。像汇编语言一样，它根据你针对的处理器类型编译成对应类型的机器码。


    但我们并不需要使用像汇编语言那种晦涩、完全无法理解的垃圾（真的，去 Google 搜搜），而是可以使用相对容易编写和理解的编程语言。编程语言的编译器会负责将我们降级为机器码！！


    ## Java 的卖点


    Java 程序员不需要担心为戴尔电脑、惠普电脑或 MacBook 计算机编写代码。他们为一台名为 `Java Virtual Machine`（`JVM`）的虚构计算机编写代码。


    `JVM` 基本上充当我们的终极翻译员；它可以理解几乎任何类型处理器的机器语言。我们只需要提供编译后的 Java 代码，剩下的由它来处理。


    所以，Java 是一种编程语言，它将“编译为机器语言”的做法替换为“编译为虚拟机语言”。


    ## 那么，编译后的 Java 代码到底是什么呢？


    我的意思是，Java 虚拟机（`JVM`）理解的是什么语言？它被称为 `bytecode`（字节码）。任何用 Java 编写并想要在虚拟机上运行的代码都需要先编译成
    `bytecode`。不，你不需要担心字节码到底是什么。它只是编译 Java 程序的结果。C++ 可能编译成机器码，但 Java 是编译成 `bytecode`。


    所以，流程是：


    1. 你用 Java 编写源代码。

    2. Java 编译器“编译”或翻译源代码为 `bytecode`。

    3. 运行在你计算机上的 Java 虚拟机 (`JVM`) 执行该 `bytecode`。

    4. 只要有 `JVM`，同样的 `bytecode` 就可以在数十亿不同的计算机上运行。


    明白了吗？如果你不懂，请给我写信：`1600 Pennsylvania Ave NW, Washington, DC 20500`。（注意：这不是我的真实地址）。


    ## 盒里有什么？


    `Oracle` 是维护 Java 的公司。他们以 Java 开发工具包（`JDK`）的形式，向我们开发者（现在包括你了）提供这种伟大的编程语言及其相关工具。里面有什么？


    *   Java 编译器，让你将编写的 Java 程序编译成字节码，以供虚拟机执行。

    *   Java 虚拟机 (`JVM`)，让你的计算机可以运行 Java 编写的程序。

    *   Java 标准库，让你不需要为了完成其他 Java 程序员做的常见事情而重新发明轮子。

    *   一大堆其他东西。


    '
- fmt: "\n# But where’s the Java programming language itself? How do I install it?\n\
    \nThe Java language is just a bunch of rules, really. It’s how we can type words\
    \ and characters in a combination that the compiler will understand. You don’t\
    \ install Java the programming language. It’d be like installing English before\
    \ you can write your essay.\n\nYou can write a Java program in Notepad, save it\
    \ as a file with the name `Hello.java`, then compile it and run in on the `JVM`\
    \ no problem.\n\nUse your Googling skills to download the `JDK` from Oracle’s\
    \ website (choose whatever version makes you happy). Yes, Google, the search engine.\
    \ Get comfortable with it. Search “Download JDK” or something like that. You want\
    \ the `JDK`, not the `JRE`, or any other thing.\n\nWhen you get your hands on\
    \ it, make sure you acknowledge their legal agreements, or they’ll put you in\
    \ jail for life.\n\nYou should see something like this:![](rsrc6R.jpg)\n\nYeah\
    \ Java 8 is old boomer shit by now, but it suits me well enough right now. Anyways\
    \ if you’re on Windows, grab the Windows x64 one. If you’re on Mac, grab the Mac\
    \ one. Run the program that is downloaded. Java is now installed; ba-da-bing,\
    \ ba-da-boom.\n\n## Integrated development environments\n\nMechanics have toolkits.\
    \ Carpenters have toolkits. Strippers have cool tits, I mean toolkits, too.\n\n\
    We programmers also have toolkits to help us do our work. The big shebang ones\
    \ are called Integrated Development Environments (IDEs) that try to give us everything\
    \ we need, all-in-one, to write our software.\n\nMicrosoft Word is like the IDE\
    \ for writing papers, essays, novels, or mostly anything involving word processing.\
    \ It’s got tools for tables, paragraphs, text color, text size, indents, lists,\
    \ and holy shit so much that you can never find when you need it.\n\nYou do not\
    \ use Word for writing code. `IntelliJ` and `Eclipse` are examples of IDEs for\
    \ writing Java code.\n\nIDEs like `IntelliJ` help us write the source code, compile\
    \ it, run it, share it, test it, rewrite it, you name it. They’re vital to be\
    \ a productive member of the programming society.\n\n### Which one should you\
    \ use?\n\n`IntelliJ` . Google it. Download the community edition. Move on with\
    \ your life. It’s raw !\n\nWhile I do think it’s worthwhile to know how to compile\
    \ and run Java code manually, I don’t think it’s a good fit for this book. But\
    \ I’ll point you in the right direction.\n\nFrom the command prompt…\n\n```bash\n\
    javac HelloWorld.java\n```\nWould create a bytecode file called `HelloWorld.class`\n\
    \n```bash\njava HelloWorld\n```\nWould then run that program using the generated\
    \ bytecode.\n\nRead more:\n\n- [Some guys' blog post on the command line](https://www.lifewire.com/command-prompt-2625840)\n\
    - [Oracle's documentation](https://www.oracle.com/technetwork/java/compile-136656.html)\n\
    - [WikiHow because why not](https://www.wikihow.com/Compile-%26-Run-Java-Program-Using-Command-Prompt)\n\
    \nOr don’t. I don’t care. You really don’t need to stop and read more on this\
    \ topic unless you’re paranoid about learning how to compile & run Java code at\
    \ a very low, manual level.\n\nSome would consider this part to be the “basics,”\
    \ but I don’t fully agree. Sure, it’s basic, but does a beginner need to understand\
    \ it to start coding in Java? To get their feet wet without hating their life?\
    \ Nope. IDEs.\n\n## Chapter 2: Hello, World!\n\nFor their first program, most\
    \ people do something called “Hello, world!” Here’s how you’d do it.\n\n```java\n\
    print ( \"Hello, world!\" )\n```\n\nDone! Hah, just kidding. That’s Python. We’re\
    \ in Java land, which means we need to do 2x the work to get the same fucking\
    \ result.\n\nOkay, here’s what you do. Create a file called `HelloWorld.java`\
    \ Put this inside of it:\n\n```java\npublic class HelloWorld {\n    // Called\
    \ when the program is run\n    public static void main (String[] args) {\n   \
    \     System. out.println( \"Hello, world!\" );\n    }\n}\n```\n\nCompile it.\
    \ Run it.\n\nThe program spits out “Hello, world!” Wow. Great. That was both uninteresting\
    \ and didn’t teach you much. I kind of hate this program but it’s a rite of passage,\
    \ in a sense.\n\nThere are a few things I want to highlight. Not with a highlighter,\
    \ just with words.\n\nFirst, in English, we put periods at the end of our sentences.\
    \ You’re don’t want to do that in Java, as a period is very different. Instead,\
    \ use a semicolon. This is a semicolon: `;`\n\nYeah, it’s that thing you never\
    \ know how to use in English; does it go between two sentences, before a list,\
    \ between some sentence fragments? Wait I just used one; was that correct? Oh\
    \ God.\n\nIt’s easier in Java. Your Java “sentences” that do things are called\
    \ statements and they all end with a semicolon. Don’t worry, if you forget one,\
    \ Java will vomit everywhere, and you’ll know you fucked up.\n\nOh, and those\
    \ double slashes `//`? Anything you put after those is ignored by the Java compiler.\
    \ You can write anything you want at all. It’s called a comment . If it you want\
    \ to type a novel on multiple lines, you use a single slash followed by an astric\
    \ `*`.\n\n## Chapter 3: Objects\n\n“Ryan used me as an object.” – KellyA lot of\
    \ Java courses and tutorials wait a bit to talk about this. A class is a blueprint\
    \ for something that can exist.\n- It has properties, which describe what it is\n\
    - It has methods, which describe what it can do\n\nAn `object` is an instance\
    \ of a `class`. Meaning, it’s a class brought to life. For example, maybe there’s\
    \ a class called `Douchebag`. It’s a template for how a `Douchebag` might behave.\
    \ You could create 4 different objects from that `Douchebag` class, each after\
    \ your middle school bullies.\n\n### Número UnoI write a class called `Airplane`.\n\
    - Its properties are `name`, `speed`, and `weight`.\n- Its methods are `takeoff()`,\
    \ `land()`, `crash()`, and `burn()`.\n\nI create an instance (an `Object`) from\
    \ the `Airplane` class.\n- I give it a name of “Crash United”, set the speed to\
    \ 420, and weight to 10000.\n- I tell the plane to `takeoff()` and `land()`. I\
    \ don’t use the `crash` and `burn` methods. You’re welcome, passengers.\n\n###\
    \ Número dosI write a class called `Monster`.\n- Its properties are `name`, `damage`,\
    \ and `health`.\n- Its methods are `fight()` and `die()`.\n\nI create two `Monster`\
    \ objects of the `Monster` class.\n- The first is named “goblin”, with 10 `health`,\
    \ and 2 `damage`.\n- The second is named “troll”, with 50 `health`, and 6 `damage`.\n\
    \nI have them taking turns `fight()` ’ing each other, which lowers the other monster’s\
    \ health. When one of their health reaches 0, I tell it to `die()`. Oof.\n\n###\
    \ Número TresI write a class called `Book`.\n- The `Book` class’s properties are\
    \ `title` and `stars`.\n- The `Book` class has no methods, as it doesn’t do shit.\n\
    \nI write a class called `Reader`.\n- The `Reader` class’s only property is `currentBook`,\
    \ which is a `Book`.\n- The `Reader` class’s methods are `read()` and `rate()`.\n"
  raw: 'But where’s the Java programming language itself? How do I install it?The
    Java language is just a bunch of rules, really. It’s how we can type words and
    characters in a combination that the compiler will understand. You don’t install
    Java the programming language. It’d be like installing English before you can
    write your essay.You can write a Java program in Notepad, save it as a file with
    the name “Hello.java”, then compile it and run in on the JVM no problem.Use your
    Googling skills to download the JDK from Oracle’s website (choose whatever version
    makes you happy). Yes, Google, the search engine. Get comfortable with it.Search
    “Download JDK” or something like that. You want the JDK, not the JRE, or any other
    thing.When you get your hands on it, make sure you acknowledge their legal agreements,
    or they’ll put you in jail for life.You should see something like this:![](rsrc6R.jpg)Yeah
    Java 8 is old boomer shit by now, but it suits me well enough right now.Anyways
    if you’re on Windows, grab the Windows x64 one. If you’re on Mac, grab the Mac
    one. Run the program that is downloaded. Java is now installed; ba-da-bing, ba-da-boom.Integrated
    development environmentsMechanics have toolkits. Carpenters have toolkits. Strippers
    have cool tits, I mean toolkits, too.We programmers also have toolkits to help
    us do our work. The big shebang ones are called Integrated Development Environments
    (IDEs) that try to give us everything we need, all-in-one, to write our software.Microsoft
    Word is like the IDE for writing papers, essays, novels, or mostly anything involving
    word processing. It’s got tools for tables, paragraphs, text color, text size,
    indents, lists, and holy shit so much that you can never find when you need it.You
    do not use Word for writing code. IntelliJ and Eclipse are examples of IDEs for
    writing Java code.IDEs like IntelliJ help us write the source code, compile it,
    run it, share it, test it, rewrite it, you name it. They’re vital to be a productive
    member of the programming society.Which one should you use?IntelliJ . Google it.
    Download the community edition. Move on with your life.It’s raw !While I do think
    it’s worthwhile to know how to compile and run Java code manually, I don’t think
    it’s a good fit for this book. But I’ll point you in the right direction.From
    the command prompt…> javac HelloWorld.javaWould create a bytecode file called
    HelloWorld.class> java HelloWorldWould then run that program using the generated
    bytecode.Read more:


    *   [Some guys'' blog post on the command line](https://www.lifewire.com/command-prompt-2625840)


    *   [Oracle''s documentation](https://www.oracle.com/technetwork/java/compile-136656.html)


    *   [WikiHow because why not](https://www.wikihow.com/Compile-%26-Run-Java-Program-Using-Command-Prompt)


    Or don’t. I don’t care. You really don’t need to stop and read more on this topic
    unless you’re paranoid about learning how to compile & run Java code at a very
    low, manual level.Some would consider this part to be the “basics,” but I don’t
    fully agree. Sure, it’s basic, but does a beginner need to understand it to start
    coding in Java? To get their feet wet without hating their life?Nope. IDEs.Chapter
    2: Hello, World!For their first program, most people do something called “Hello,
    world!” Here’s how you’d do it.print ( "Hello, world!" )Done! Hah, just kidding.
    That’s Python. We’re in Java land, which means we need to do 2x the work to get
    the same fucking result.Okay, here’s what you do. Create a file called HelloWorld.javaPut
    this inside of it:public class HelloWorld {


         //Called when the program is run


         public static void main (String[] args) {


            System. out .println( "Hello, world!" );


        }


    }Compile it.Run it.The program spits out “Hello, world!”Wow. Great. That was both
    uninteresting and didn’t teach you much. I kind of hate this program but it’s
    a rite of passage, in a sense.There are a few things I want to highlight. Not
    with a highlighter, just with words.First, in English, we put periods at the end
    of our sentences. You’re don’t want to do that in Java, as a period is very different.
    Instead, use a semicolon.This is a semicolon:


    ;Yeah, it’s that thing you never know how to use in English; does it go between
    two sentences, before a list, between some sentence fragments? Wait I just used
    one; was that correct? Oh God.It’s easier in Java. Your Java “sentences” that
    do things are called statements and they all end with a semicolon. Don’t worry,
    if you forget one, Java will vomit everywhere, and you’ll know you fucked up.Oh,
    and those double slashes // ?Anything you put after those is ignored by the Java
    compiler. You can write anything you want at all. It’s called a comment . If it
    you want to type a novel on multiple lines, you use a single slash followed by
    an astric, like this: /* My Comment */ ./*Boy this book is going swimmingly and
    there’s no way I’ll lose interest or the author will run out of steam at any point
    in the near future.*/ .No commentBad programmers write code that’s impossible
    to understand and explain it with these “comments.” Even worse programmers write
    horrible code but don’t even have the courtesy to leave some fucking comments.Try
    to be the kind of programmer that makes your code readable without comments, but
    if you need to resort to them, go for it.Chapter 2, over! Wow, that was easy.Chapter
    3: Objects“Ryan used me as an object.” – Kelly KapoorA lot of Java courses and
    tutorials wait quite a bit to talk about this, but I’m going to do it immediately.You
    see, Java is so, so , so devoted to the idea of “classes” that you literally cannot
    have Java code unless it’s inside a class. So waiting any further will likely
    just confuse you. Here’s the skinny:A class is a blueprint for something that
    can exist in the Java universe.


    *   It has properties, which describe what it is .


    *   It has methods, which describe what it can do .


    An object is an instance of a class. Meaning, it’s a class brought to life.For
    example, maybe there’s a class called Douchebag . It’s a template for how a Douchebag
    might behave.You could create 4 different objects from that Douchebag class, each
    named after your middle school bullies.I’m going to throw examples at you until
    you get a basic idea:Número UnoI write a class called Airplane .


    *   Its properties are name , speed , and weight .


    *   Its methods are takeoff(), land(), crash(), and burn() .


    I create an instance (an Object) from the Airplane class.


    *   I give it a name of “Crash United”, set the speed to 420, and weight to 10000.


    *   I tell the plane to takeoff() and land() . I don’t use the crash and burn
    methods. You’re welcome, passengers.


    Número dosI write a class called Monster .


    *   Its properties are name, damage , and health .


    *   Its methods are fight() , and die() .


    I create two Monster objects of the Monster class.


    *   The first is named “goblin”, with 10 health , and 2 damage .


    *   The second is named “troll”, with 50 health , and 6 damage .


    I have them taking turns fight() ’ing each other, which lowers the other monster’s
    health.When one of their health reaches 0, I tell it to die() . Oof.Número TresI
    write a class called Book .


    *   The book class’s properties are title and stars .


    *   The book class has no methods, as it doesn’t do shit.


    I write a class called Reader.


    *   The reader class’s only property is currentBook , which is a Book .


    *   The reader class’s methods are read ( ) and rate() .'
