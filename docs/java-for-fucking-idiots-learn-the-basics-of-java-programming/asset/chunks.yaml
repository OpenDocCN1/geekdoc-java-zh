  trans: "\n这种在循环中执行某些操作然后将索引加 1（递增）的方法非常常见。你基本上是在逐个地遍历数组。注意：如果你愿意，可以将索引加 2，并打印每隔一个字母！那难道不令人兴奋吗？！？！哇！！\n\
    \n## 闯入与进入\n\n想象一下你的 Netflix 收藏库（让我们看看能多快让这本书“老去”吧！）\n\n你看着 Netflix 推荐列表中的第一项。你考虑了考虑，但不想看它。你移动到下一个。你重复这个过程，直到你看到一部你知道自己会喜欢的剧集或电影，因为你很讨厌尝试新事物。一旦你看到一个决定要看的项目，你就会停止（并打破循环）。\n\
    \n```java\nString[] recommendations = { \"ShowA\" , \"ShowB\" , \"The Office\"\
    \ , \"ShowC\" };\n\nint index = 0 ;\n\nwhile (index < recommendations. length\
    \ ) {\n    String recommendation = recommendations[index];\n\n    if (recommendation\
    \ == \"The Office\" ) {\n        System. out .println( \"I'll watch this one:\"\
    \ );\n        System. out .println(recommendation);\n        break ;\n    }\n\
    \    System. out .println( \"Not sure, incrementing...\" );\n    index++;\n}\n\
    ```\n\n你认为这里发生了什么？我们遍历了每一个推荐项吗？我们是在某一点停止的吗？为什么？这里是程序的输出结果：\n\n```\nNot sure, incrementing...\n\
    Not sure, incrementing...\nI'll watch this one:\nThe Office\n```\n\n看到我们甚至没有轮到\
    \ `ShowC` 吗？那是因为了神奇的 `break` 语句。它表示循环现在就结束了，无论其他任何情况！所以基本上，`break` 语句允许我们在任何时间、出于任何原因杀死循环。不需要等到回到顶部重新评估条件。这次迭代完成了，我们不会进入下一次迭代。我们在\
    \ `while` 循环之后编写的任何代码现在都可以运行了。\n\n## 继续\n\n我们已经见过了一个无限运行的 `while` 循环。接着是一个遍历字母表中每个字母的循环。然后是一个在当它想看《办公室》时停止的循环（这在意料之中）。\n\
    \n我还有一个我觉得我必须提到的 Java 关键字。它叫做 `continue`。你知道 `break` 基本上是杀死了循环吗？彻底死了，结束了？`continue`\
    \ 说“不要杀死循环，但跳过这次迭代”。进入下一次迭代。这里没什么好读的。\n\n假设你想打印字母表中的每个字母，但不是 ‘F’。你就是讨厌那个字母。\n\n\
    ```java\nwhile (index < alphabet. length ) {\n    char letter = alphabet[index];\n\
    \n    if (letter == 'F' ) {\n        continue ;\n    }\n    System. out .println(letter);\n\
    \    index = index + 1 ;\n}\n```\n\n我们打印了除 ‘F’ 外的所有内容。`continue` 语句之后的代码永远不会被执行，相反，我们返回到循环的顶部。它就像\
    \ `break` 语句的小兄弟。它“打破”了这次迭代并进入下一次，但它没有杀死整个循环。小家伙。\n\n如果你如此讨厌 ‘F’ 以至于想立即停止打印字母，你就会回到使用\
    \ `continue`。\n\n## 漏洞？我的代码里有漏洞吗？\n\n我的上一个例子有一个问题。程序员可能会说的“bug”，即发生了你意料之外的事情。你注意到了吗？可能没有。但你现在能看到吗？为什么这段写得优美的代码不会完全按照我描述的那运行？\n\
    \n**提示：** 看看 `continue;` 语句在哪里。当字母是 F 时，什么没有发生？\n\n你明白了吗？花一点时间。\n\n**答案：** 循环无限运行！看看字母是\
    \ F 时发生了什么；我们立即使用 `continue;` 跳过这次迭代并进入循环的下一次迭代。但下一次迭代我们要看哪个字母呢？F。再下一次？F。我们从来没有增加\
    \ `index` 的值！！！由于索引没有改变，我们会不断从数组中取出 F。不要犯这个错误。\n\n这里是修复后的示例。我们在从数组中取出字母后立即增加索引：\n\
    \n```java\nwhile (index < alphabet. length ) {\n    char letter = alphabet[index];\n\
    \    index = index + 1 ;\n\n    if (letter == 'F' ) {\n        continue ;\n  \
    \  }\n    System. out .println(letter);\n}\n```\n\n这可能是一个刻意的例子，但它提醒我们，在循环内部需要小心，不要让自己无限空转。\n\
    \n## 嘟嘟嘟 while 循环\n\n注意，循环并不一定得运行。如果在对字母表进行循环之前，我们将 `index` 设置为 0 以外的值？一个字母表大小之外的值？\n\
    \n```java\nint index = 87 ;\nwhile (index < alphabet. length ) {\n```\n"
- fmt: "\nI’ll admit it. A `for` loop is more confusing for beginners, especially\
    \ so for idiots, buffoons, and debutants. And no, I don’t know what that last\
    \ word means. But you get very concise and easy-to-understand code once you get\
    \ used to it. And guess what? This is the type of loop you see 95% of the time\
    \ in `Java`.\n\nThat’s because the most common reason to loop is to go through\
    \ every element in a data set, like an `array`, and do something for each one.\
    \ This is simply the most concise way to do that.\n\n## Why and when to for loop?\n\
    \n99% of the time, you use a `for` loop when you have an `array` (or some `list`)\
    \ of data. You need to do something to each of the items in the `array`, or you\
    \ need to do something using each item in the `array`.\n\n- For each product in\
    \ the cart, apply the coupon code to it.\n- For each horse in the race, calculate\
    \ the odds of it winning.\n- For each depressing memory, cry for 1 hour.\n- Reverse,\
    \ reverse!\n\nIt’s also easy to do different kinds of loops by adjusting the three\
    \ sections of the `for` loop. If you notice, those sections are indeed separated\
    \ by semicolons. For example, maybe you want to go through the `array` in reverse.\
    \ Here’s what those 3 sections would specify:\n\n1. Set the index’s initial value\
    \ to the end of the `array`\n   `int i = myArray. length - 1 ;`\n2. Run the loop\
    \ until we reach the beginning of the `array` (including position 0)\n   `i >=\
    \ 0 ;`\n3. Decrease the value of the index at the end of each loop iteration\n\
    \   `i--`\n\n```java\nchar [] myArray = { 'A' , 'B' , 'C' , 'D' };\n\nfor ( int\
    \ i = myArray. length - 1 ; i >= 0 ; i--) {\n    System. out .println(myArray[i]);\n\
    }\n```\n\nTry to read through that yourself a few times to understand what each\
    \ part is doing. Then I’ll spill the beans. I hate beans. Here’s how what we’re\
    \ asking `Java` to do in English…\n\n1. Create an `array` with 4 elements, `A`,\
    \ `B`, `C`, `D`.\n2. Create a variable `i` (the index) and set it equal to `3`\
    \ to start.\n3. Specify that the loop should keep going as long as `i` is greater\
    \ or equal to `0`.\n4. Specify that at the end of each loop, we should decrease\
    \ the index by `1`.\n\nAnd here’s how it actually runs, step by step. If you’re\
    \ confused right now, this part should help.\n\n```java\nchar [] myArray = { 'A'\
    \ , 'B' , 'C' , 'D' };\n\nfor ( int i = myArray. length - 1 ; i >= 0 ; i--) {\n\
    \    System. out .println(myArray[i]);\n}\n```\n\n1. Set `i` to `3`. This is greater\
    \ than or equal to `0`. Run code inside loop (Print ‘D’). Decrease `i` by `1`.\n\
    2. `i` is now `2`. This is greater than or equal to `0`. Run code inside loop\
    \ (Print ‘C’). Decrease `i` by `1`.\n3. `i` is now `1`. This is greater than or\
    \ equal to `0`. Run code inside loop (Print ‘B’). Decrease `i` by `1`.\n4. `i`\
    \ is now `0`. This is greater than or equal to `0`. Run code inside loop (Print\
    \ ‘a’). Decrease `i` by `1`.\n5. `i` is now `-1`. This is not greater than or\
    \ equal to `0`. Loop is donezo.\n\n## Enhanced for loop\n\n`Java` makes `for`\
    \ loops even easier. In the simple case where you’re simply going through some\
    \ sort of data collection, you can do this:\n\n```java\nMeme[] memes;\n\nfor (Meme\
    \ currentMeme : memes) {\n    //do shit with the meme\n}\n```\n\nYou don’t even\
    \ need to create and initialize an index variable. No need to get the item at\
    \ that position in the `array`. No need to increase the index at the end of the\
    \ loop. None of that shit. It’s the perfect way to loop through some items in\
    \ a `list`. Always use one of these unless you have a reason not to.\n\nAs another\
    \ example, you could replace our earlier example like so:\n\n```java\nchar []\
    \ myArray = { 'A' , 'B' , 'C' , 'D' };\n\nfor ( int i = 0 ; i < myArray. length\
    \ ; i++) {\n    System. out .println(myArray[i]);\n}\n\nchar [] myArray = { 'A'\
    \ , 'B' , 'C' , 'D' };\n\nfor ( char character : myArray) {\n    System. out .println(character);\n\
    }\n```\n\n## Chapter 9: Instantiation\n\n“Ow! What the heck was that!??[Instantiation]!\
    \ That was part one of your ceremony. Ceremony for what? We’re going to put you\
    \ to rest!” – Spongebob Squarepants\n\nWE’RE BACK BABY! OBJECTS ARE BACK ON THE\
    \ MENU!!! IT’S TIME TO MAKE AN OBJECT OUT OF A `CLASS`. READY??\n\n### Creating\
    \ an object\n\n```java\nBook myBook = new Book();\n```\n\n“I DID IT! I DID IT,\
    \ DAD! I MADE AN OBJECT!” - you\n\nAlright, you made an object. Yes, you did.\
    \ But slow down my child. There’s a ton of complexity in that simple line of code.\
    \ Let’s do it bit by bit. I’ll label each part of that line.\n\n`Book1 myBook2\
    \ = new3 Book()4 ;` \n\nFeel free to flex your brain and guess what each word\
    \ is doing before reading on. Now…\n\n1. `Book1`\nThis first part says our variable\
    \ is going to be a `Book`. Just like we’d make an `int`, or a `double`, or a `char`,\
    \ we’re saying that we’re making a variable of a specific type. In this case,\
    \ it’s a `Book`.\n\n2. `myBook`\nThis bit is saying the name of our variable is\
    \ `myBook`. We can name it whatever we want. We could have called it “foo,” or\
    \ “bar,” but I absolutely loathe variables with those stupid fucking names. “So\
    \ the name of the object we just made is `myBook`?” Ehhhhhhhhh…. for now, yes,\
    \ you can say this is the name of our object. Some sticklers would say “ackshually\
    \ that’s an object reference variable, not the object itself, let me explain why\
    \ you’re wrong-”-But for now, you’re fine to say the object is called `myBook`.\n\
    \n3. `new`\nThis is the absolute magical keyword in that line of code. You are\
    \ saying I am making a new object out of this `class`. Bitch. You didn’t need\
    \ to say `new` when you were using primitive types like `int` and `double`. This\
    \ is for the object-oriented shit, baby! Wooh!\n\n4. `Book()`\nHuh? Didn’t we\
    \ already cover `Book`? Why is it at the beginning and then at the end? Because\
    \ you can do fancy shit with those parentheses. When you make a new you could\
    \ say “hey Java, make its title this, its author, etc.”\n\nBook myBook = new Book();More\
    \ than meets the eye. Just like you, beautiful reader. There’s a big, full, beautiful\
    \ brain behind those lifeless eyes. We’ll make it through this, I promise. Let’s\
    \ get back to the two parentheses `()` there. That’s a super special part I’ll\
    \ cover with next section.\n\n## Constructors\n\n“Bob, the Builder!Can we build\
    \ it?Bob, the builder!Yes we can!”You know, when I went to write down this quote\
    \ I had to look up. It turns out they changed “Can we fix it?” to “Can we build\
    \ it?” And you know I’ve gotta be accurate with my quotations, so that’s what\
    \ I used.\n\nAnyways, what’s a constructor?\n\nA constructor is like Bob, the\
    \ Builder. You know, the carpenter with a yellow hardhat. Cool guy. Bob has a\
    \ hammer, saw, screwdriver, and all kind of tools to build houses. In `Java`,\
    \ Bob builds the object (the actual house) from your blueprint (the `class`).\
    \ Here’s a sample class:\n\n```java\nclass House {\n    String color = \"Gray\"\
    ;\n}\n```\n\nThe blueprint has a default value here. When the `House` is created,\
    \ it will have that value. Yes, the line of code that makes the color property\
    \ “Gray” will not run until you create a `House` object. Speaking of which, I\
    \ can ask Bob to actually build the `House` in a line of code like this:\n\n```java\n\
    House stevesHouse = new House();\n```\n\nThe right side is the important bit;\
    \ it says make a new `House`...and assign it to the variable on the left. See\
    \ those two parentheses `()`? With nothing inside of ‘em? That’s us telling Bob\
    \ to build a default, normal, vanilla, bland, unimportant house. The house will\
    \ be `Gray`.\n\nYep, that will say “Gray”! Also, don’t get me wrong; gray houses\
    \ are totally fine. Very adequate.\n\n### Default Constructors\n\nEvery class\
    \ has a hidden Bob the Builder by default that looks like this:\n\n```java\nclass\
    \ House {\n    String color = \"Gray\";\n    House() {}\n}\n```\n"
