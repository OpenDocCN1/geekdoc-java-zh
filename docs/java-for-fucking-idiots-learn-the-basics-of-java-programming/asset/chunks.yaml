    \ `meow` 的方法。它在屏幕上打印了“Meow!”。我们可以对刚刚做的事情有许多称呼：调用方法。调用方法。运行方法。执行方法。“办该的事”。\n\n\
    总的来说，我看到并使用 `calling`（调用）这个词。我们调用了 `meow()` 方法。当 `meow()` 方法被调用时，猫就喵叫了。\n\n###\
    \ 迷失翻译\n\n```java\nclass Translator {\n    String languageFrom;\n    String languageTo;\n\
    \n    Translator(String languageFrom, String languageTo) {\n        this.languageFrom\
    \ = languageFrom;\n        this.languageTo = languageTo;\n    }\n\n    void translate(String\
    \ textToTranslate) {}\n}\n```\n\n哦，伙计，一个新类！这个类负责在两种不同的语言之间翻译文本。我会隐藏实际执行翻译的代码。但我向你保证，它是非常棒的。\n\
    \n让我们创建一个新的翻译器。我叫他 Eugene。`Translator eugene = new Translator(\"English\", \"\
    Spanish\");`\n\n现在我们已经把它配置为从英语翻译成西班牙语。我们可以调用 `translate` 方法来学习如何用西班牙语找洗手间。`eugene.translate(\"\
