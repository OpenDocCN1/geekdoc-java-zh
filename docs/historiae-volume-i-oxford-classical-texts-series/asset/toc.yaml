  - I. 93 索留提德斯
- - '##'
  - 95 随后，在这个季节开始，色色基国王祭司奥德律斯的塞莱基斯集结军队，进攻马其顿国王亚历山大的弟弟珀尔迪卡斯，以及色雷基的色雷斯人。他们承诺提供兵马，并将交出其中的三个人。因为珀尔迪卡斯向他承诺过，而且如果雅典人占领了萨拉米城市，他们也将离开。
- - '##'
  - I. 95 随后，由于战争的爆发，他与他的兄弟菲利发动反击。菲利在某处集结了军队，根据他的领土进攻了马其顿，随后通过凯尔基亚荒野进攻，那是索特斯和派雅翁的边界。他前往了自己之前行动过的地方，在那里为派雅翁集结了军队。而奥多夫罗斯的，他拥有自己的军队，其侧翼是索特斯和派雅翁的军队。为了不被敌人包围且在没有防御的情况下，他们前往了派奥尼亚。通过那里那里，除非发生战斗，否则他们就不会进攻。随后，大量色雷斯人被召集并跟随他，导致每个部队的人数为五万人；其中步兵较多，雅腊人的骑兵较少。随后奥多夫罗斯的军队抵达了罗斯。
- - '##'
  - II. 97 随后，奥多夫罗斯的行动开始了。首先在海上，从奥多夫罗斯出发，直到伊斯特河口，那里有船只或陆地部队。经过二十天的夜晚，他们行动了。随后，一个从奥多夫罗斯出发的欧泽尼亚人抵达了伊斯特河。随后在海上，他们抵达了位于比占丁的海的伊斯特河，因为那里由于海战而形成了。如果得到援助，他将前往那里。从所有希腊城邦的贡赋中，他向欧修斯索要了，随后他支付了四千塔拉特金银。如果米加拉人再次进攻科林斯峡的边界，他们就退缩了。而此此的雅典人在占领萨拉米后，他们也撤离了，比起守卫比雷埃港，他们更倾向于做其他事情，比如开发港口并进行交替防御。
- - '##'
  - II. 97 在这种情况下，斯基亚人无法对抗所有人；他们不进行量，也不就周围达成一致。塞莱基斯并不是自己的领土内结。他已经准备绪，根据自己的领土进攻了马其顿，随后通过凯尔基亚荒野进攻，那是索特斯和派雅翁的边界。他前往了自己之前行动过的地方，在那里为派雅翁集结了军队。而奥多夫罗斯的，他拥有自己的军队，其侧翼是索特斯和派雅翁的军队。为了不被敌人包围且在没有防御的情况下，他们前往了派奥尼亚。通过那里那里，除非发生战斗，否则他们就不会进攻。随后，大量色雷斯人被召集并跟随他，导致每个部队的人数为五万人；其中步兵较多，雅腊人的骑兵较少。
