  md: '# PRAEFATIO


    Thucydideos nec mendis gravibus omnino libero nequeque admodum esse depravatos.
    Ad mendas autem tollandas nihil prodesse visum est quam natorum locorum, iniculis
    vel codicum familiae vel Vaticanus ceterike libri ita discreet, aut altera lectio
    dubio depravata sit; unde colligitur cum librariorum errore ad certa quaed genera
    referi, tum prerraro scriptura longius esse descendum.

    Quod autem quidam affirmant, codices Thucydideos maxima copia esse feodatos, id
    nullo modo factum arbitr, nec multa eorum, quae in textu legetuntur, omnis seclusi,
    nisi forte et scholiastae interpretatione appareet iista non legisse. Neque aliter
    sem habere, ni fallor, documento papyrus il nobilissimus ruderibus Oxyrhynchi
    nuper in lucem provolut singula verba, vel ὅτι, οἰ, τίς, facile excidere et intrudi
    posse, longa elementa nihil esse in textu latere credamus. Quod tamen fragmentum
    accuratius perpenditur iniis, quae ad sententiam aut non multum aut nihil omnino
    facuit, sicut pro ε βούλωτω in papyro ε βούλονται legit; nam credibile est in
    exemplaribus, quae antiquitis circumferebant, multa illius generis, ut cuque concinius
    esse debate varie exarata.

    Nos si codices recognoscendo ad recensionem a gramatico quod et diligenti et scienti
    factam perenerimus, satis habebimus.


    Restat ut pauca de orthographia dicam. In qua postquam non sine fructu operam
    naverunt Stahlius, Meisterhansius, alii viri doct, quos nominatim recensere piget,
    Thucydidis editori via optime munita est.


