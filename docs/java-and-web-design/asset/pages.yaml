  md: "# Java and Web Design\n\nto send several requests via one connection and the\
    \ second is to reuse SSL session parameters to avoid SSL handshakes for parallel\
    \ and subsequent connections. The sessions are stored in an SSL session cache\
    \ between workers and configured by the ssl_session_cache directive. One megabyte\
    \ of the cache contains about 4000 sessions. The default cache timeout is 5 minutes.\
    \ It can be increased using the ssl_session_timeout directive. Here is a sample\
    \ configuration optimized for the multi-core system with 10 megabyte shared session\
    \ cache:\n\n```\nworker_processes: auto;\nhttp {\n    ssl_session_cache shared:SSL:10m;\n\
    \    ssl_session_timeout 10m;\n}\nserver {\n    listen 443 ssl;\n    server_name\
    \ www.example.com;\n    keepalive_timeout 70;\n    ssl_certificate www.example.com.crt;\n\
    \    ssl_certificate_key www.example.com.key;\n    ssl_protocols TLSv1.1 TLSv1.2;\n\
    \    ssl_ciphers HIGH:!aNULL:!MD5;\n}\n```\n\n# SSL certificate chains\n\nSome\
    \ browsers may complain about a certificate signed by a well-known certificate\
    \ authority, while other browsers may accept the certificate without issues. This\
    \ occurs because the issuing authority has signed the certificate using an intermediate\
    \ certificate that is not present in the certificate base of well-known trusted\
    \ certificate authorities which is distributed with a particular browser. In this\
    \ case the authority provides a bundle of chained certificates which should be\
    \ concatenated with the signed server certificate. The server certificate must\
    \ appear before the chained certificates in the combined file:\n\n```\n$ cat www.example.com.crt\
    \ bundle.crt > www.example.com.chained.crt\n```\n\nThe resulting file should be\
    \ used in the ssl_certificate directive:\n\n```\nserver {\n    listen 443 ssl;\n\
    \    server_name www.example.com;\n    ssl_certificate www.example.com.chained.crt;\n\
    \    ssl_certificate_key www.example.com.key;\n}\n```"
