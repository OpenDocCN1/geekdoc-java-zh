    # SUMMARY


    +   - An exception in Java signals that an error or an unexpected situation has
    occurred during program execution. Exception handling is the mechanism for dealing
    with such situations. It is based on the “throw and catch” principle.


    +   - A checked exception is an exception that occurs at the compile time, these
    are also called as compile time exceptions. These exceptions cannot simply be
    ignored at the time of compilation, the Programmer should take care of (handle)
    these exceptions.


    +   - An unchecked exception is an exception that occurs at the time of execution,
    these are also called as Runtime exceptions, and these include programming bugs,
    as logic errors or improper use of an API. Runtime exceptions are ignored at the
    time of compilation.


    +   - finally creates a block of code that will be executed after a try/catch
    block is completed and before the try/catch block.


