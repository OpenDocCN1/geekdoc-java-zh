  md: '# Java and Web Design


    # Common Security Risks


    Recent studies indicate over 70% of all web applications contain critical security
    flaws. Given the financial and time costs, loss of reputation and potential flight
    of customers that any compromised company may incur, this is an amazingly high
    number.


    An evaluation of the web applications under study as well as conversations with
    the owners and developers of the web application provided the following insight
    as to the risk factors associated with web applications:


    +   Web application – The breakneck arms race between security professionals and
    cyber criminals often leaves a secure web application open to newfound attacks.
    One of the studied web applications was five years old; built at a time when web
    application security was not a mainstream concern.


    +   A lack of a security focus – Not only are most business owners not aware of
    potential security problems, but many are misled by their IT staff who believe
    good development practices are sufficient to produce secure web applications.
    Both business owners had little technical expertise and no awareness of the business
    and financial risks their web applications posed. The newest web application in
    the study was built in the last six months by a reputable software development
    company that incorrectly told the company’s owner the web application was secure.


    +   No security testing expertise or tools – Web applications are under tremendous
    pressure from security attack methods that can only be simulated by professional
    security testers using sophisticated manual techniques and automated vulnerability
    scanning tools. It came as no surprise that neither web application was testing
    for security vulnerabilities and very few, if, development organizations provide
    the tools or expertise required to perform these.


    In hindsight, both web applications were destined to be security nightmares –
    each contained at least two unanswered risk factors.


    The largest problem was the naivety of the business owners. At no point did the
    owners know even to be insistent on proof that the web application, at the heart
    of the business, was secure from attacks by malicious hackers. This common mistake
    could be the largest reason our industry continues to see 70% of all web applications
    containing critical security flaws.


    # Testing the Security


    It has been my experience that the majority of web applications now on the Internet
    have never been tested for security vulnerabilities. This observation is confirmed
    by the surprisingly large percentage (70%) of web applications that have been
    found to contain critical vulnerabilities.


    ![](img/5896385a9e8402477461956f4864a34e_309_0.png)'
