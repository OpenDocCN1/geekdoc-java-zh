    # World Wide Web


    In 1989, Tim Berners-Lee at CERN proposed a protocol to exchange documents with
    colleagues around the world. The idea was that users could search for and retrieve
    any document on the Internet. The form of the documents was hypertext. This meant
    any given document could have links to other documents on the Internet. In a strict
    sense, the World Wide Web was this interconnected system of documents.'
