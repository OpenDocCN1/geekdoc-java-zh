    # JAMES GOSLING


    James A. Gosling, O.C., Ph.D. (Born May 19, 1955 near Calgary, Alberta, Canada)
    is a famous software developer, best known as the father of the Java programming
    language.


    In 1977, James Gosling received a B.Sc in Computer Science from the University
    of Calgary. In 1983, he earned a Ph.D in Computer Science from Carnegie Mellon
    University, and his doctoral thesis was titled "The Algebraic Manipulation of
    Constraints". Working towards his doctorate, he wrote a version of emacs (gosmacs),
    and joining Sun Microsystems he built a multi-processor version of Unix[1] while
    at Carnegie Mellon University, as well as several compilers and mail systems.


    Since 1984, Gosling has been with Sun Microsystems, and is generally known as
    the founder of the Java programming language.


    He is generally credited as the inventor of the Java programming language in 1991.
    He did the original design of Java and implemented its original compiler and virtual
    machine. For this achievement he was elected to the United States National Academy
    of Engineering. He has also made major contributions to several other software
    systems, such as News and Gosling Emacs. He also cowwrote the "bundle" program,
    a utility thoroughly detailed in Brian Kernighan and Rob Pike''s book The Unix
    Programming Environment.


    James is a Bachelor of Science from University of Calgary 1977 Batch specializing
    in Computer Science.


    He further his Ph.D in 1983 under the guidance of Bob Sproull from Carnegie Mellon
    University by submitting thesis entitled "Algebraic Constraints",


    Even while studying James was active involved in development of Emacs and played
    with multi-processor of Unix.


    # Career of James Gosling


    Gosling served Sun Microsystems for a long period from1984 to 2010, he is known
    as Father of Java Programming Language. He designed the actual implementation
    for Java and the language''s original compiler and virtual machine along with
    his colleagues at Sun Microsystems.'
