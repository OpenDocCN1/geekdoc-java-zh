  md: '# Java and Web Design


    # 4.4.2. Swing


    Swing API is a set of extensible GUI Components to ease developer''s life to create
    JAVA built Front End/ GUI Applications. It is built upon top of AWT API and acts
    as replacement of AWT API as it has almost every control controlling AWT controls.
    Swing component follows a Model-View-Controller architecture to fulfill the following''s
    criteria.


    +   - A single API is to sufficient to support multiple look and feel.

    - API is to model driven so that highest level API is not required to have the
    data.

    - API is to use the Java Bean model so that Builder Tools and IDE can provide
    better services to the developers to use it.


    # MVC Architecture


    Swing API architecture follows loosely based MVC architecture in the following
    manner.


    +   - A Model represents component''s data.

    - View represents visual representation of the component''s data.

    - Controller takes the input from the user on the view and reflects the changes
    in Component''s data.

    - Swing component have Model as a separate element and View and Controller are
    part club in Interface elements. Using this way, Swing has pluggable look-and-feel
    architecture.


    # Swing Features


    +   - Light Weight - Swing component is independent of native Operating System''s
    API as Swing API controls are rendered mostly using pure JAVA code instead of
    underlying system calls.

    - Rich controls - Swing provides a rich set of advanced controls like Tree, Tabbed
    Pane, slider, color picker, table controls

    - Highly Customizable - Swing controls can be customized in very easy way as visual
    appearance is independent of internal representation.

    - Pluggable look-and-feel- SWING GUI Application look and feel be changed at run
    time based on available values.


    # 4.4.3. What are Servlets?


    Java Servlets are programs that run on a Web or Application server and act as'
