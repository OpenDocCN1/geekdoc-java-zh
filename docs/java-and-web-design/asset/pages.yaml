  md: 'protected void consume()


    The consume() method is called to tell an event that it has been handled. An event
    that has been marked “consumed” is still delivered to the source component''s
    peer and to all other registered listeners. However, the peer will ignore the
    event; other listeners may also choose to ignore it, but that''s up to them. It''s
    not possible for a listener to “undo” an event that has already been marked “consumed.”
    Noncomponent event types can be flagged as consumed. Marking an event “consumed”
    is useful if you are capturing keyboard input and need to reject it to the peer,
    the keystroke isn''t displayed. In Java 1.0, you would achieve the same effect
    by writing an event handler (e.g., keyDown()) that returns true. You can assume
    that an event won''t be delivered to the peer until all listeners have a chance
    to consume. However, you should not make any other assumptions about the order
    in which listeners are called.


    protected boolean isConsumed()


    The isConsumed() method returns whether the event has been consumed, either by
    default or through consume(), this method returns true; otherwise, it returns
    false.


