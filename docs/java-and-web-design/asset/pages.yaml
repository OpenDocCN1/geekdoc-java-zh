  md: '# 5.1.1. Working of Intranet eMail


    An intranet is a network based on TCP/IP protocols (internet) belonging to an
    organization, usually a corporation, accessible only by the organization''s members,
    employees, or others with authorization.


    Intranets allow people to work together better by allowing them to communicate
    better. The most time-honored and still the most popular-names of communication
    using computers is e-mail. Using e-mail, people can send messages to anyone else
    on the intranet-and, in fact, anyone connected to the Internet as well, or connected
    to a computer network that has a connection to the Internet, such as an online
    service.


    Intranet e-mail uses the TCP/IP protocol. The TCP protocol breaks your messages
    into packets, the IP protocol delivers the packets to the proper location, and
    then TCP reassembles the message on the receiving end so that it can be read.


    ![](img/5896385a9e8402477461956f4864a34e_247_0.png)


    Mail Transfer Agent (MTA) is software that transfers electronic mail messages
    from one computer to another using client-server architecture.


    ![](img/5896385a9e8402477461956f4864a34e_247_1.png)


    You can also attach binary files, such as pictures, videos, sound, and executable
    files, to your e-mail messages. The Internet cannot directly handle binary files
    in e-mail, the file must be encoded in one of a variety of encoding schemes. Popular
    schemes are Base64 and uencode. The person who receives the attached binary file
    must decode the file with the same scheme that was used to encode the file. Many
    e-mail software packages do this automatically.


    When e-mail formats differ (and often they do, having developed from proprietary
    and incompatible products), gateways are used to translate the data into the appropriate'
  merge: -1
  pgno: 247
- img_proc: true
  md: 'format for the recipient. However, several standards have been developed that
    have been adopted by most e-mail companies today that allow the various products
    to communicate with each other. The Simple Mail Transfer Protocol (SMTP) and the
    X.400 MHS (message handling service) are the two most common protocols.


    SMTP is based on a client/server model in which someone uses a mail client to
    create and read mail, while servers do the actual processing and delivery of the
    mail.


    To create email, you use a mail client, which is called a mail user agent or user
    agent (MUA or UA). There are multiple kinds and different agents for different
    types of computers. When mail is sent, the Message Transfer System (MTA) on a
    server must examine the address of the person to whom the mail is being sent.
    If the person is found on the internet, the mail is delivered to a mail delivery
    agent (MDA). The MDA then delivers the mail to the intended recipient. When you
    send email to someone on another intranet or on the Internet, the message is sent
    by the MTA through the Internet. The message often has to travel through a series
    of networks before it reaches the recipient-networks that might use e-mail formats.


    # E-Mail Is Delivered within an Intranet


    Probably the most used part of an intranet has nothing to do with corporate databases,
    flashy Web pages, or multimedia content-its the use of electronic mail. Corporate
    intranets can use a number of different e-mail programs, such as ccMail, Microsoft
    Mail, or Lotus Mail, others. But the most common architecture underlying the use
    of intranet e-mail is the protocol called Simple Mail Transfer Protocol, or SMTP.
    Illustrated here how SMTP is used to deliver mail within an intranet.


    +   - As true with many intranet and Internet applications, SMTP uses client/server
    architecture. When someone wants to create a mail message, they use a mail user
    agent or user agent (MUA or UA)-client software that runs on a computer-create
    a piece of electronic mail. This can can be one of e-mail programs, and can run
    on a variety of different computers, including PCs, Macintosh, and UNIX workstations.
    Popular MUAs include Pine for UNIX computers; Pegasus, Eudora, cc: Mail and Microsoft
    Mail for the PC; and Eudora for the Macintosh.


    +   - After the message is completed, it is sent by the MUA to a program running
    on a server called a mail transfer agent (MTA). The Mail looks at the address
    of the intended recipient of the message. If the recipient of the message is on
    the intranet, the MTA sends the message to another server program on the intranet
    called a mail delivery agent (MDA). If, the recipient is located on the Internet
    or another intranet, the file is sent over the Internet


    ![](img/5896385a9e8402477461956f4864a34e_248_0.png)'
  merge: -1
  pgno: 248
- img_proc: true
  md: '# Java and Web Design


    to the recipient. (See the next illustration on how mail is transferred among
    intranets.) The MDA looks at the address of the recipient, and sends the mail
    to the box of the proper person.


    +   - Some mail systems use another e-mail protocol called the Post Office Protocol
    (POP) in concert with SMTP. With POP, e-mail is not delivered directly to your
    computer. Instead, mail is delivered to a mailbox on a server. To get the mail,
    someone logs onto the server using a password and user name, and retrieves it
    with their mail agent.


    +   - The recipient of the mail can now use a user agent to read the mail file,
    and respond to it.


    +   - SMTP can only handle the e-mail transfer of plain ASCII text files. In order
    to send binary files as spreadsheets, pictures, and word processing documents,
    they must first be converted into an ASCII format by encoding them using a variety
    of methods, including encoding and Base64. Some email software will automatically
    encode binary files. When an encoded file is received by someone, they decode
    it and then use or view the binary file. Again, many e-mail packages automatically
    decode files.


    # How E-Mail is delivered among Intranets


    Often, e-mail created on an intranet will not be delivered to a computer on the
    intranet, to another intranet, or to an online service such as America Online,
    the Microsoft Network, or CompuServer. Here are the steps a typical message might
    take when being delivered from an intranet to another network or intranet.


    +   - An e-mail message is created using SMTP, as described on the previous page.
    As with all information across the Internet, the message is broken up by the Internet''s
    TCP protocol into IP packets. The address is examined by the intranet''s mail
    transfer agent. If the address is found on another network, the mail transfer
    agent will send the mail across the intranet via routers to the receiving network.


    +   - Before the mail can be sent out across the Internet, it might first have
    to pass through an intranet firewall-computer that shields the intranet so that
    intruders cannot break into the network. The firewall keeps track of messages
    and data into and out of the network. It keeps record of traffic so that any security
    breaches be tracked down.


    +   - The leaves the intranet and is sent to an Internet router. The router examines
    the address and determines where the message should be sent, and then sends the
    message on the way.


    ![](img/5896385a9e8402477461956f4864a34e_249_0.png)'
  merge: -1
  pgno: 249
- img_proc: true
  md: 'The receiving network gets the e-mail message. A gateway uses TCP to reconstruct
    the IP packets into a full message. The gateway then translates the message into
    the particular protocol the target network uses (such as CompuServe''s mail format),
    and sends it on its way. The message may be required to also pass through a firewall
    on the receiving network.


    The receiving network examines the e-mail address and sends the message to the
    specific mailbox where the message was intended to go, or uses the Post Office
    Protocol (POP) to deliver it to a mail server.


    Gateways can actually change data (if needed) for connectivity. For e-mail it
    may convert CompuServe protocol to SMTP. Gateways are also used to connect PC''s
    to IBM mainframes for example, ASCII to EBCDIC.


    # 5.1.2. HTML Tags


    HTML tags are the hidden keywords within a web page that define how the browser
    must format and display the content.


    Most tags must have two parts, an opening and a closing part. For example, <html>
    is the opening tag and </html> is the closing tag. Note that the closing tag has
    the same text as the opening tag, but has an additional forward-slash (/) character.
    I tend to interpret this as the <end> or <close> character.


    ![](img/5896385a9e8402477461956f4864a34e_250_0.png)


    An HTA runs as a fully trusted application and therefore has privileges, like
    creation/editing/removal of files and Windows Registry entries. Because they operate
    outside the browser''s security model, HTAs cannot be executed via HTTP, but must
    be downloaded (just like an EXE file) and executed from local file system.


