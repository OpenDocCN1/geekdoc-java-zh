    # 6.1 OBJECTIVES OF WEB APPLICATION SECURITY¹


    There are three objectives of computer application security, corresponding to
    the three direct negative effects on computerized data they seek to overcome.
    Each specific application must be analyzed to determine the appropriate level
    of each of the three objectives.


    ![](img/5896385a9e8402477461956f4864a34e_272_0.png)


    # Data Integrity


    The data is the same as the original input source and/or has been computed and
    maintained accurately. This objective protects against accidental or purposeful
    modification or destruction of data (or programs).


    Unauthorized access is the use of a computer or network without permission.


    # Data Confidentiality


    The data is held in confidence and is protected from unauthorized disclosure.
    This objective protects against either accidental or purposeful disclosure of
    data to unauthorized persons.


    # Data and System Availability


    Authorized users can obtain the required data and system services in a reasonable
    period of time. This protects against lack of access (or too slow access) to data,
    programs, and other system resources when required by authorized system users.


    # The Foundations of Security


    Security relies on the following elements:


    +   * Authentication: addresses the question: who are you?


