    would not see anything). The important thing to understand about Java is that
    you can do much more with it besides create applets. Java was written as a fullfledged
    programming language in which you can accomplish the same sorts of tasks and solve
    the same sorts of problems that you can in other programming languages, such as
    C or C++. Hotjava itself, including all the networking, display, and user interface
    elements, is written in Java.


    # 1.1 IMPORTANCE AND FEATURES OF JAVA 1,2


    Java is one of the most popular programming languages used to create Web applications
    and platforms. It was designed for flexibility, allowing developers to write code
    that would run on any machine, regardless of architecture or platform. According
    to the Java page, more than 1 billion computers and 3 billion mobile phones worldwide
    run Java.


    # Use


    Java is used to build applications and platforms for a number of devices, including
    computers, laptops, gaming consoles, Blu-ray players, car navigation systems,
    medical monitoring devices, parking terminals and smartphones. It is also a key
    language for networking, particularly for centers that store and transfer Web-based
    data.


    # Applets


    Java is also used to create miniature, dynamic programs that run alongside or
    are embedded within Web pages. These programs are called applets and can be used
    to display maps, weather, games or other interactive widgets or tools on Web page.


