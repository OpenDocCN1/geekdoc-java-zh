    # LEARNING OBJECTIVES


    After studying this chapter, you will be able to:


    +   1. Explain the importance and features of java

    2. Discuss about decision making, branching and looping

    3. Discuss about labeled loops and jump statements


    # INTRODUCTION


    Java is an object-oriented programming language developed by Sun Microsystems,
    a company best known for its high-end Unix workstations. Modeled after C++, the
    Java language was designed to be small, simple, and portable across platforms
    and operating systems, both at the source and at the binary level. Java is often
    mentioned in the same breath as HotJava, a World Wide Web browser from Sun Netscape
    or Mosaic. What makes HotJava different from most other browsers is, in addition
    to all its basic Web features, it can also download and play applets on the reader''s
    system. Applets appear in a Web page much the same way as images, but unlike images,
    applets are dynamic and interactive. Applets can be used to create animations,
    figures, or areas that can respond to input from the reader, or other interactive
    effects on the same Web pages among the text and graphics. Although HotJava was
    the first Wide Web browser to be able to play Java applets, Java support is rapidly
    becoming'
