    Other types of Web pages, such as PHP, ASP, and JSP pages are dynamic Web pages.
    These pages contain “server-side” code, which allows the server to generate unique
    content each time the page is loaded.


    For example, the server may display the current time and date on the Web page.
    It may also output a unique response based on a Web form the user filled out.
    Many dynamic pages use server-side code to access database information, which
    enables the page’s content to be generated from information stored in the database.
    Websites that generate Web pages with database information are often called database-driven
    websites.


    You can often tell if a page is static or dynamic simply by looking at the page’s
    file extension in the URL, located in the address field of the Web browser. If
    it is “.htm” or “.html”, the page is probably static. If the extension is “.php,.asp,”
    or “jsp,” the page is most likely dynamic. While not all dynamic Web pages contain
    dynamic content, must have at least some that is generated-on-the.


