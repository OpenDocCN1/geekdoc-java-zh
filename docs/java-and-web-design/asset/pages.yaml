  md: '# Java and Web Design


    handle the events. Let''s have a brief introduction to this model.

    The Delegation Event Model has the following key participants namely:


    +   - Source - The source is an object on which event occurs.

    Source is responsible for providing information of the occurred event to it is
    handler. Java provide it with classes for source object.

    - Listener - It is also known as event handler. Listener is responsible for generating
    response to an event. From Java implementation point of view the listener is also
    an object. Listener waits until it receives an event. Once the event is received,
    the listener process it a then returns.


    The benefit of this approach is that the user interface logic is completely separated
    from the logic that generates the event. The user interface element is able to
    delegate the processing of event to separate piece of code. In this model, Listener
    needs to be registered with the source object so that the listener can receive
    the event notification. It is an efficient way of handling the event because the
    event notifications are sent only to those listener that want to receive them.


    ![](img/5896385a9e8402477461956f4864a34e_165_0.png)


    # 4.1. DELEGATION EVENT MODEL¹


    Under the 1.1 delegation event model, all system events are instances of AWT Event
    or its subclasses. The model provides two sets of event types. The first set are
    raw events, such as indicating when a component gets focus, a key is pressed,
    or the mouse is moved. These events exist in Component Event and its subclasses,
    along with some new events available only by overriding event-related methods.
    In addition, higher-level event types (for example, selecting a button) are encapsulated
    in other subclasses of AWT Event that are not children of ComponentEvent.


