  md: '# Java and Web Design


    It is the process of uniquely identifying the clients of your applications and
    services. This may be end users, other services, processes, or computers. In security
    parlance, authenticated clients are referred to as principals.


    +   * Authorization: addresses the question: what can you do? It is the process
    that governs the rules and operations that the authenticated client is permitted
    to access. Resources include files, databases, tables, rows, and so on, together
    with system-level resources such as registry keys and configuration data. Operations
    include performing transactions such as purchasing a product, transferring money
    from one account to another, or increasing a customer''s credit rating.


    +   * Auditing: Effective auditing and logging is the key to non-repudiation.
    Non-repudiation guarantees that a user cannot deny performing an operation or
    initiating a transaction. For example, in an e-commerce system, non-repudiation
    mechanisms are required to make sure that a consumer cannot deny ordering 100
    copies of a particular book.


    +   * Confidentiality: It also referred to privacy, is the process of making sure
    that data remains private and confidential, and that it cannot be viewed by unauthorized
    users or eavesppers who monitor the flow of traffic across a network. Encryption
    (ACLs) is frequently used to enforce confidentiality. Access control lists (ACLs)
    are another means of enforcing confidentiality.


    +   * Integrity: It is the guarantee that data is protected from accidental or
    deliberate (malicious) modification. Like privacy, integrity is a key concern,
    particularly for data passed across networks. Integrity for data in transit is
    typically provided by using hashing techniques and message authentication codes.


    +   * Availability: From a security perspective, availability means that systems
    remain available for legitimate users. The goal for many attackers with denial
    of service attacks is to crash an application or to make sure that it is sufficiently
    overwhelmed so that other users cannot access the application.


