    # # Applying Check Boxes


    A check box is a control that is used to turn an option on or off. It consists
    of a small box that can either contain a mark or not. There is a label associated
    with each check box that describes what the option represents. You change the
    state of a check box by clicking on it. Check boxes can be used individually or
    as part of a group. Checkboxes are objects of the Checkbox class.


    Checkbox supports these constructors:


    ```

    Checkbox() throws HeadlessException

    Checkbox(str) throws HeadlessException

    Checkbox(str, boolean on) throws HeadlessException

    Checkbox(str, boolean on, CheckboxGroup group) throws HeadlessException

    Checkbox(str, CheckboxGroup cbGroup, boolean on) throws HeadlessException

    ```


    The first form creates a check box whose label is initially blank. The state of
    the check box unchecked. The second form creates a check box whose label is specified
    by str. The state of the check box is unchecked. The third form allows you to
    set the initial state of the check box. If on is true, the check box is initially
    checked; otherwise, it is cleared. The fourth and fifth forms create a check box
    whose label is specified by str and whose cbGroup is part of a group, cbGroup.
    (Check groups are described in the next section.) The value of on determines the
    initial state of the check box.


    To retrieve the current state of a check box, call getState(). To set its state,
    call setState(). You can obtain the current label associated with a check box
    by calling getLabel(). To set the label, call setLabel(). These methods are as
    follows:


    ```

    boolean getState()

    void setState(boolean on)

    String getLabel()

