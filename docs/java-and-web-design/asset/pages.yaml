    One can look upon the structure of the Internet as having an edge and a core.
    At the edge are host systems that run application or client programs or provide
    a service through server programs. At the core of the Internet is a network of
    routers.


    # Data Transfer on the Internet


    There are two ways in which data can be transferred over communication links circuit
    switching or packet switching. In circuit switching there is a dedicated circuit
    for each communication. A good example of circuit switching is the telephone network.
    In packet switching data is sent over the network in small chunks that are sent
    to routers in turn are sent to other routers (hopefully) all the chunks arrive
    at their destination.


    The advantage of circuit switching is guaranteed performance. There is a dedicated
    link between users that is not shared. The disadvantage is that this link is idle
    if not being used. In packet switching different users share the same network
    resources. Network resources are used as needed. However, if there are many packets
    in the network then there is a problem of congestion when packets are placed in
    a queue waiting for a free up. Packets get dropped which makes for lossy transmission
    of information.


    There are several sources of packet delay:


    +   * Processing Delay at a Router: the router checks error and determines output
    link. Typically a few microseconds of less.

    * Queuing delay at Router: time waiting at output link for transmission. This
    depends on the congestion'
  merge: -1
  pgno: 240
- img_proc: true
  md: '# Java and Web Design


    level of the router.


    +   * Transmission Delay along a Communication Link: If R is the link bandwidth
    (bps) and L is the packet length (bits), then the time to send the bits into the
    link is L/R. This is significant for low-speed links.

    * Propagation delay: If d is the length of the physical link and s is the propagation
    speed in the medium, and then the propagation delay is d/s. typically the delay
    is around a few microseconds to hundreds of milliseconds.


    The total nodal delay is the sum of all the delay times:


    ```

    d_{nodal} = d_{proc} + d_{queue} + d_{trans} + d_{prop}

    ```


