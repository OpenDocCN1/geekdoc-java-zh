    To linkmonth_days with an actual, physical array of integers, you must allocate
    one using new and assign it to month_days. new is a special operator that allocates
    memory.


    The general form of new as it applies to one-dimensional arrays appears as follows:


    ```

    array-var = new type[size];

    ```


    Here, type specifies the type of data being allocated, array-var specifies the
    number of elements in the array, and array-var is the variable you linked to allocate.
    That is, use new to allocate an array, you must specify the type and number of
    elements to allocate. The elements in the array allocated by new will automatically
