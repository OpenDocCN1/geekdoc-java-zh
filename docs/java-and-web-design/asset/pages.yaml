  md: '# CASE STUDY


    # ENTERPRISE JAVA BEANS - FROM OBJECTS TO COMPONENTS


    The advantage of application servers is that they provide comprehensive support
    for one style of distributed programming the three-tier approach as explained
    above and most of the complexities associated with distributed programming are
    hidden from the user.


    The disadvantages are that the approach is both prescriptive and heavyweight:
    prescriptive in the sense that the approach mandates particular style of systems
    architecture and heavyweight in those application servers are large and complex
    software systems that inevitably carry an overhead in terms of performance and
    resource requirements.


    The approach works best on high-end server machines. To counter this, a stripped-down
    and minimal style of component programming is also adopted in distributed systems.
    We refer to this style as lightweight component models to distinguish them from
    the much heavyweight application server architectures.


    # Enterprise JavaBeans


    Enterprise JavaBeans (EJB) [java.sun.com XII] is a specification of a server-side,
    managed component architecture and a major element of the Java Platform, Enterprise
    Edition (Java EE), is a set of specifications for client-server programming. Other
    specifications include RMI and JMS.


    EJB is defined as a server-side component model because it supports the development
    of the classic style of application, where potentially large numbers of clients
    interact with a number of services realized through components or configuration
    of components.


    The goal of EJB is to maintain a strong separation of concerns between the various
    roles involved in developing distributed applications. The EJB specification identifies
    the following keys:


    The bean provider, develops the application logic of the component();


    +   - The assembler, who assembles beans into application configurations;


    +   - The deployer, who takes a given application and ensures it can be correctly
    deployed in a given operational environment;


    +   - The service provider, who is a specialist in fundamental distributed system
    services such as transaction management and establishes the desired level of support
    in these areas;


    +   - The persistence provider, who is a specialist in mapping persistent data
    to


    ![](img/5896385a9e8402477461956f4864a34e_234_0.png)'
