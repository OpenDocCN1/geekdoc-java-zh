  md: '# Java and Web Design


    For example, HTTP is the protocol that web browsers and servers use to transfer
    hypertext pages and images. It is a quite simple protocol for a basic page-browsing
    web server. Here''s how it works. When a client requests a file from an HTTP server,
    an action known as a hit, it simply sends the name of the file in a special format
    to a predefined port and reads back the contents of the file. The server responds
    with a status code to tell the client whether or not the request can be fulfilled
    and why.


    A key component of the Internet is address. Every computer on the Internet has
    one. An Internet address is a number that uniquely identifies each computer on
    the Net. Originally, all Internet addresses were specified as 32-bit values, organized
    as four 8-bit values. However, a new addressing scheme, called IPv6 (Internet
    Protocol, version 6) has come into play. IPv6 uses a 128-bit value to represent
    an address, organized into sixteen-bit chunks. Although there are several reasons
    and advantages for IPv6, the main one is that it supports a much larger address
    space than IPv4. To provide backward compatibility with IPv4, the lower 32 bits
    of an IPv6 address can contain a valid IPv4 address. Thus, IPv4 is upwardly compatible
    with IPv6.


    Just as the numbers of an IP address describe a network hierarchy, the name of
    an Internet address, called its domain name, describes a machine''s location in
    a name space. For example, we.osborne.com in the COM domain (for U.S. commercial
    sites); it is called osborne (after the company name), and identifies the server
    for web requests. An Internet domain name is mapped to an IP address by the Domain
    Naming Service (DNS). This enables users to work with domain names, but the Internet
    operates on IP addresses.


