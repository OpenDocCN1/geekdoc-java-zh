  md: '# Java and Web Design


    face defines the single method that is called when an ActionEvent occurs. These
    interfaces replace the various event-handling methods of Java 1.0: action() is
    now the actionPerformed() method of the ActionListener interface, mouseUp() is
    now the mouseReleased() method of the MouseListener interface, and so on. Most
    of the listener interfaces have a corresponding adapter class, which is an abstract
    class that provides a null implementation of all the methods in the interface.
    (Although an adapter class has no abstract, it is declared abstract to remind
    you it must be subclassed.) Rather than implementing a listener interface directly,
    you have the option of extending an adapter class and overriding only the methods
    you care about. (More complex adapters are possible, but the adapters supplied
    with AWT are very simple.) The adapters are available for the listener interfaces
    with multiple methods.


    Here describes Java 1.1''s listener interfaces and adapter classes. It is worth
    noting that Java 1.1 does not allow you to modify the original event when you''re
    writing an event handler


