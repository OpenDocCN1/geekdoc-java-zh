    void setVisible(boolean booleanFlag)


    The component is visible if the argument to this method is true. Otherwise, it
    is hidden.Setting a Window’s Title


    You can change the title in a frame window using setTitle( ), which has this general
    form: void setTitle(String newTitle)

    Here, newTitle is the new title for the window.


    # Closing a Frame Window


    ![](img/5896385a9e8402477461956f4864a34e_184_0.png)


    When using a frame window, your program must remove that window from the screen
    when it is closed, by calling setVisible(false). To intercept a window-close event,
    you must implement the WindowClosing( ) method of the WindowListener interface.
    Inside WindowClosing( ), you must remove the window from the screen.


