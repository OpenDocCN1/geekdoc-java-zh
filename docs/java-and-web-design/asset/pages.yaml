    When you call the toString() method of an AWTEvent, the paramString() method is
    called in turn to build the string to display. Since you are most frequently dealing
    with children of AWTEvent, the children need only to override paramString() to
    add their specific information.


    public String toString()


    The toString() method of AWTEvent returns a string with the name of the event,
    and the source. In the method MouseAdapter.mouseReleased(), printing the parameter
