  md: '# Java and Web Design


    When a program breaks the sequential flow and jumps to another part of the code,
    it is called selection or branching.


    When the branching is based on a particular condition, it is known as conditional
    branching.


    If branching takes place without any condition, it is known as unconditional branching.


    Java language supports two types of selections statements: if and switch. In addition,
    in certain circumstances ''?'' operator can be used as an alternative to if statements.


    # 1.2.1 Decision making with if:


    An if statement tests a particular condition; if the condition evaluates to true,
    a course of action is followed that it is a statement or set of statements is
    executed. Otherwise (if the condition evaluates to false) ,course-of-action is
    ignored.


    The if statement may be implemented in different forms depending on the complexity
    of conditions to be tested.


    +   - Simple statement

    - if....else statement

    - Nested if....else statement

    - else ladder


    # Simple if statement:


    The syntax of the if statement is shown below:


    if(expression)

    statements;


    Where a statement may consist of a single statement, a compound statement, or
    nothing. The expression must be enclosed in parentheses. If the expression evaluates
    to true, the statement is executed, otherwise ignored.


    Following figure illustrates the construct of if:


    ![](img/5896385a9e8402477461956f4864a34e_35_0.png)'
