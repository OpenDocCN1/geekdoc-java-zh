    # Server Name Indication


    A more generic solution for running several HTTPS servers on a single IP address
    is TLS Server Name Indication extension (SNI, RFC 6066), which allows a browser
    to pass a requested server name during the SSL handshake and, therefore, the server
    will know which certificate it should use for the connection. However, SNI has
    limited browser support. Currently it is supported starting with the following
    browsers versions:


    +   - Opera 8.0;

    - MSIE 7.0 (but only on Windows or higher);

    - Firefox 2.0 and other browsers using Mozilla Platform rv:1.8.1;

    - Safari 3.2.1 (Windows versions support SNI on Vista or higher);

    - Chrome (Windows versions support SNI on Vista or higher, too).


    In order to use SNI in nginx, it must be supported in both the OpenSSL library
    with which the nginx binary has built as well as the library to it is dynamically
    linked at runtime. OpenSSL supports SNI since 0.9.8 version if it is built with
    config option "enable-tlsext". Since OpenSSL 0.9.8j version if this option is
    enabled by default. If nginx was built with SNI support, then nginx will show
    this when run with the "-V" -


    ```

    $ nginx -V

    TLS SNI support enabled

    ```


    However, if the SNI-enabled nginx is linked dynamically to an OpenSSL library
    without SNI support, nginx displays the warning:


    ```

    nginx was built with SNI support, however, now it is linkedndynamically to an
    OpenSSL library which has no tlsext

    therefore sni is not available

    ```


    # Apache HTTP Secure Server Configuration


    Apache HTTP Server with the mod_ssl security module enabled to use the OpenSSL
    library and toolkit. The combination of these three components are referred to
    the secure Web server or just as the secure server.


    The mod_ssl module is a security module for the Apache HTTP Server. The mod_ssl
    uses the tools provided by the OpenSSL Project to add a very important feature
    to the Apache HTTP Server — the ability to encrypt communications. In contrast,
    regular HTTP communications between a browser and a Web server are sent in plain
    text, which could be intercepted and read by someone along the route between the
    browser and the server.'
