    scripts or code within the application, as well as data theft or manipulation.


    +   - Cross-site Request Forgery (CSRF) – An attack that could result in an unsolicited
    transfer of funds, changed passwords or data theft. It is caused when a malicious
    web application perform an unwanted action in a site to which a user is logged
    on.


    In theory, thorough input/output sanitization could eliminate all vulnerabilities,
    making an application immune to unlawful manipulation.


    However, complete sanitization usually is not a practical option, since most applications
    are in a constant development state. Moreover, applications are also frequently
    integrated with each other to create an increasingly complex environment.


