    The concept of context switching is integral to threading. A hardware timer is
    used by the processor to determine the end of the timeslice for each thread. The
    timer signals at the end of the timeslice and in turn the processor saves all
    information required for the current thread onto a stack. The processor processes
    this information from the stack into a predefined data structure called a context
    structure. When the processor wants to switch back to a previously executing thread,
    it transfers all the information from the context structure associated with the
    thread to the stack. Java supports thread-based multitasking.


    Entire procedure is known as context switching. The advantages of thread-based
    multitasking as compared to process-based multitasking are given:


    +   - Threads share the address space.

    - Context-switching between threads is normally inexpensive.

    - Communication between threads is normally inexpensive.


    # 3.2.2 Threads in Java


    Applications are typically divided into processes during the design phase, and
    a master process explicitly spawns threads when it makes sense to logically separate
    significant application functionalities. Processes, in other words, are an architectural
    construct. By contrast, a thread is a coding construct that does not have to affect
    the architecture of an application. A single process might contain multiple threads
    (see Figure 3.2). All threads within a process share the same state and memory
    space, and can communicate with each other directly, because they share the same
    variables.


    Threads typically are spawned for a short-term benefit that is usually visualized
    as a serial task, which does not have to be performed in a linear manner (such
    as performing parallelism, initializing a large matrix), and then are absorbed
    when longer required. The scope of a thread is within a specific code module—which
    is why we can bolt on without affecting the broader application.'
