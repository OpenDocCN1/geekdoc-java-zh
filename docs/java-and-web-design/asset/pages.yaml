  md: "# 6.3 CONFIGURING HTTPS SERVERS⁴, ⁵\n\nTo configure an HTTPS server, the ssl\
    \ parameter must be enabled on listening sockets in the server block, and the\
    \ locations of the server certificate and private key files should be specified:\n\
    \n```\nserver {\n  listen 443 ssl;\n  server_name www.example.com;\n  ssl_certificate\
    \ www.example.com.crt;\n  ssl_certificate_key www.example.com.key;\n  ssl_protocols\
    \ TLSv1 TLSv1.1 TLSv1.2;\n  ssl_ciphers HIGH:!aNULL:!MD5;\n}\n```\n\nThe certificate\
    \ is a public entity. It is sent to every client that connects to the server.\
    \ The private key is a secure entity and should be stored in a file with restricted\
    \ access, however it be readable by nginx's master process. The private key may\
    \ be alternately stored in the same file as the certificate:\n\n```\nssl_certificate\
    \ www.example.com.cert;\nssl_certificate_key www.example.com.key;\n```\n\nin which\
    \ case the file access rights should also be restricted. Although the certificate\
    \ and the key are stored in one file, only the certificate is sent to a client.\n\
    \nThe ssl_protocols and ssl_ciphers can be used to limit connections to include\
    \ only the strong versions and ciphers of SSL/TLS. By default nginx \"ssl_protocols\
    \ TLSv1 TLSv1.1 TLSv1.2\" and \"ssl_ciphers HIGH:!aNULL:!MD5\", so configuring\
    \ them explicitly is generally not needed. Note that default values of these directives\
    \ were changed several times.\n\n# HTTPS server optimization\n\nSSL operations\
    \ consume extra CPU resources. On multi-processor systems several worker processes\
    \ should be run, no less than the number of available CPU cores. The most CPU-intensive\
    \ operation is the SSL handshake. There are two ways to minimize the number of\
    \ these operations per client: the first is by enabling keepalive connections\n\
    \n# Citation\n\n| 4 | http://nginx.org/en/docs/http/configuring_https_servers.html\
    \ |\n| 5 | https://access.redhat.com/documentation/en-US/Red_Hat_Enterprise_Linux/5/html/Deployment_Guide/s1-httpd-secure-server.html\
    \ |\n\n![](img/5896385a9e8402477461956f4864a34e_278_0.png)"
