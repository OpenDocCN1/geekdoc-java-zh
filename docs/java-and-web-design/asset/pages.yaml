    # 2.2.1 StringBuffer class


    Java StringBuffer class is used to created mutable (modifiable) string. The StringBuffer
    class in java is same as String class except it is mutable that it can be changed.


    Java StringBuffer class is thread-safe that is multiple threads cannot access
    it simultaneously. So it is safe and will result in an order.


    # Constructors of StringBuffer class


    StringBuffer class define three constructors.


    +   - StringBuffer(): creates an empty string buffer with the initial capacity
    of 16.

    - StringBuffer(String str): creates a string buffer with the specified string.

    - StringBuffer(int capacity): creates an empty string buffer with the specified
    capacity as length.'
