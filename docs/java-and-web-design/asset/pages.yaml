  md: 'Java and Web Design


    # CASE STUDY


    # SECURING WEB APPLICATIONS


    With estimated worldwide cyber-crime losses in 2011 over $388 billion, corporations,
    both large and small, are focusing considerable attention towards the security
    of their physical infrastructures as well as their outward facing web applications.
    While most physical infrastructures have been secured, there are still many critical
    vulnerabilities in the majority of web applications. In this “Case Study” column
    I will share some takeaways based on my involvement in two recent remediation
    engagements as a basis for understanding the reasons behind the continued trend
    in vulnerable web applications. I will also touch briefly on the testing of web
    applications for security vulnerabilities and remediation and development techniques
    employed to ensure security.


    # What is a Web Application?


    Web applications may be defined as computer programs that are accessed over a
    network such as the Internet or intranet. Web applications (commonly websites)
    are the human interfaces to on-line activities (i.e. on-line retail sales, webmail,
    social networks) accessed through web browsers such as Internet Explorer, Firefox
    and Chrome.


    Web applications, by their very nature and implementation, present unique and
    difficult security issues. Web applications are traditionally built to provide
    value to ‘well behaved’ users. Given this expectation, web application developer’s
    focus their efforts responding to ‘good behavior’ as well as weeding unintentional
    ‘errant behavior’ (i.e. bad zip codes, empty fields) It is the ‘deliberately malicious
    behaviour’, and the lack of development attention to the consequences of this
    behavior, that presents security issues.


    As an example, consider an on-line retail sales application where a user, browser
    interactions, exchanges data with a web application that is hosted within the
    corporation’s data center. The connection between the user and the data-center
    hosted web application has, by necessity, bypassed all physical security. To compound
    potential security problems, the web application servicing the user will often
    have direct access to the database containing retail transaction information for
    all users of on-line sales application. The only safeguard between the user and
    the transition database is the web application.


    294 3G E-LEARNING'
