    # ### 4.3.2. Working with Frame Windows


    After the applet, the type of window you will most often create is derived from
    **Frame**.nYou will

    use it to create child windows within applets, and top-level or child windows
    for stand-alone applications. As mentioned, it creates a standard-style window.


    Here are two of **Frame**''s constructors:

    Frame ()

    Frame(String title)


    The first form creates a standard window that does not contain a title. The second
    form creates a window with the title specified by *title*. Notice that you cannot
    specify the dimensions of the window. Instead, you must set the size of the window
    after it has been created.


    There are several key methods you will use when working with **Frame** windows.

    They are examined here


