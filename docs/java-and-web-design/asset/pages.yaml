    # Operator Precedence


    When more than one is used in an expression, Java has an established precedence
    to determine the order in which operators are evaluated. In many cases, this precedence
    determines the overall value of the expression.


    For example, consider the following expression:


    ```

    y = 6 + 4 / 2;

    ```


    The variable receives the value 5 or the value 8, depending on arithmetic operation
    is handled first. If the 6 + 4 expression comes first, y has the value of 5. Otherwise,
    y equals 8.


    In general, the order from first to last is the following:


    +   - Increment and decrement operations

    - Arithmetic operations

    - Comparisons

    - Logical operations

    - Assignment expressions


    If two operators have the same precedence, the one on the left in the actual expression
    is handled before the one on the right. Table 1.3 shows the specific precedence
    of the various operators in Java. Operators farther up the table are evaluated
    first.


    Table 1.3: Operator Precedence


    | Operator | Notes |

    | --- | --- |

    | [ ] 0 | Parentheses (()) are used to group expressions; period (.) is used for
    access methods and variables within objects and classes; square brackets ([])
    are used for arrays. |

    | ++ -- ! instanceof | The instanceof operator returns true or false based on
    whether the object is an instance of the named class or any of that class''s subclasses
    (). |'
