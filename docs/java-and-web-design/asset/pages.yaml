  md: "# Java and Web Design\n\n# A single HTTP/HTTPS server\n\nIt is possible to\
    \ configure a single server that handles both HTTP and HTTPS requests:\n\n```\n\
    server {\n    listen 80;\n    listen 443 ssl;\n    server_name www.example.com;\n\
    \    ssl_certificate www.example.com.crt;\n    ssl_certificate_key www.example.com.key;\n\
    ...}\n```\n\nPrior to 0.14 SSL could not be enabled for individual listening sockets,\
    \ as shown above. SSL could only be enabled for the entire server using the ssl\
    \ directive, making it impossible to set up a single HTTP/HTTPS server. The ssl\
    \ parameter of the listen directive was added to solve this issue. The use of\
    \ the ssl directive in modern versions is thus discouraged.\n\n![](img/5896385a9e8402477461956f4864a34e_281_0.png)\n\
    \nThe Java Persistence API (JPA) is a Java specification for accessing, persisting,\
    \ and managing data between Java objects / classes and a relational database.\n\
    \n# Name-based HTTPS servers\n\nA common issue arises when configuring two or\
    \ more servers listening on a single IP address:\n\n```\nserver {\n    listen\
    \ 443 ssl;\n    server_name www.example.com;\n    ssl_certificate www.example.com.crt;\n\
    ...}\nnserver {\n    listen 443 ssl;\n    server_name www.example.org;\n    ssl_certificate\
    \ www.example.org;\n...}\n```\n\nWith this configuration a browser receives the\
    \ default server’s certificate, i.e. www.example.com regardless of the requested\
    \ server name. This is caused by the SSL protocol behaviour. The SSL connection\
    \ is established before the browser sends an HTTP request and nginx does not know\
    \ the name of the requested server. Therefore, it may offer the default server’s\
    \ certificate.\n\n![](img/5896385a9e8402477461956f4864a34e_281_1.png)"
