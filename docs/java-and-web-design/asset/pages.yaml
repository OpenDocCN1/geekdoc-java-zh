    All of the numeric wrapper classes are subclasses of the abstract class java.lang.
    Number as shown in the above Wrapper Class Hierarchy diagram. There are four subclasses
    of Number that are not shown here. BigDecimal and BigInteger are used for high-precision
    calculations. AtomicInteger and AtomicLong are used for multi-threaded applications.
    The remaining two wrapper classes Character and Boolean are direct subclasses
    of java.lang.Object.


    # Examples of Java Wrapper Classes


    To describe the application of wrapper classes in java, let us create an Integer
    wrapper object with primitive int type value and get back the primitive value
    from the wrapper object.


    ```

    int i = 26; // Primitive data type ''int''

    // Wrapper class instantiation

    Integer i_Obj = new Integer(i); // Unwrapping primitive data ''int'' from wrapper
    object

    int i2 = i_Obj.intValue();

    ```


    # List of all Wrapper Classes in java


    The following table shows list of different types of wrapper classes in java:


    | Primitive data type | Wrapper class |

    |---|---|n| byte | Byte |

    | short | Short |

    | int | Integer |

    | long | Long |

    | float | Float |

    | double | Double |

    | char | Character |

    | boolean | Boolean |


