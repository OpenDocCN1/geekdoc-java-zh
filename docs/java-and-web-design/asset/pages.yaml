  md: 'By definition, all web application vulnerabilities originate in the web application
    software itself, including supporting software components and configuration of
    supporting components (i.e., database encryption). A complete web application
    security must address this full range.


    Security testing methodologies fall into three general areas:


    +   - Automated vulnerability scanning – Automated security scanning tools are
    designed to simulate security attacks on targeted web applications. Scanners run
    a simulation of every known WEB application attack (updated frequently to keep
    pace with recently discovered security attack methods) over the entirety of the
    web application.

    - Manual testing – Professional cyber criminals will often spend hours or days
    probing a web application for security flaws. A white hat equivalent (good guy)
    will use the same skills and persistence to identify the same flaws, except with
    the goal of remediating the flaws, not compromising the data.

    - Code reviews – While the majority of security testing can be done from the browser-side
    (automated scanning and manual reviews), a security review will discover issues
    that manifest themselves only after a web application has been compromised. For
    example, a security review might identify inadequate encryption or back doors
    set up by malicious developers (timing setting up of back-doors allows a developer
    to compromise the IT system when the web application is in production).


    The study of the two web applications began at the point where both web applications
    were already deployed and centric to their respective businesses. Hours of manual
    security testing revealed that both web applications were susceptible to SQL Injection
    attacks (direct database access). This information alerted both companies for
    the need to immediately address previously unknown security problems.


    Each web application was copied to a security testing environment where a full-automated
    security scan was performed. These scans revealed badly flawed web applications
    that were even at risk than previously thought.


    It is virtually impossible to secure a web application (no critical security flaws)
    without including security testing as part of the software development lifecycle
    (SDLC). As we will see in the following section, while adherence to well-established
    software development practices is essential to the creation of an operational
    and security sound web application, reaching that goal is hard, if not impossible
    without corresponding functional and security testing.


    # Securing the Application


    An analogy can be made between the intertwined disciplines of software development
    and SQA and their security counterparts. Industry accepted SDLC standards have
    here


