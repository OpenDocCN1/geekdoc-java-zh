  md: '# Java and Web Design


    # Data Link


    At OSI Model, Layer 2, data packets are encoded and decoded into bits. It furnishes
    transmission protocol knowledge and management and handles errors in the physical
    layer, flow control and frame synchronization. The data link is divided into two
    sub layers: The Media Access Control (MAC) layer and the Logical Link Control
    (LLC) layer. The MAC sub layer controls how a computer on the network gains access
    to the data and permission to transmit it. The LLC layer controls synchronization,
    flow control and error checking.


    +   - Layer 2 Data Link examples include PPP, FDDI, ATM, IEEE 802.5/802.2, IEEE
    802.3/802.2, HDLC, and Frame Relay.


    ![](img/5896385a9e8402477461956f4864a34e_243_0.png)


    Media Access Control (MAC) is a sub layer of the data link layer (DLL) in the
    seven-layer OSI network reference model.


    # Physical


    OSI Model, Layer 1 conveys the bit stream - electrical impulse, light or radio
    signal — through the electrical and mechanical level. It provides the hardware
    means of sending and receiving data on a carrier, including defining cables, cards
    and physical aspects. Fast Ethernet, RS232, and ATM are protocols with physical
    layer components.


    +   - Layer 1 Physical examples include Ethernet, FDDI, B8Z5, V.35, V.24, RJ45.


    # Basic HTTP


    Hypertext Transfer Protocol (HTTP) is a protocol for transferring files or other
    data (called resources) through TCP/IP sockets. A browser is an HTTP client for
    HTTP servers that listen on port 80.


    An HTTP client opens a socket and sends a request to the HTTP server; the server
    then sends the message and closes the connection. No connection information is
    maintained between transactions. The request line has three parts, separated by
    spaces: a method name, the path to the requested resource, and the version of
    the HTTP:


    ```

    GET /path/to/file/index.html HTTP/1.0

    ```'
