    #  3.4.7 Datagrams


    TCP/IP-style networking is appropriate for most networking needs. It provides
    a serialized, predictable, reliable stream of packet data. This is not without
    its cost, however. TCP includes many complicated algorithms for dealing with congestion
    control on crowded networks, as well as pessimistic expectations about packet
    loss. This leads to a somewhat inefficient way to transport data. Datagrams provide
    an alternative.


    Datagrams are bundles of information passed between machines. They are somewhat
    like a hard throw from a well-trained but blindfolded catcher to the third baseman.
    Once the datagram has been released to the intended target, there is no assurance
    that it will arrive or that someone will be there to catch it. Likewise, when
    the datagram is received, there is no assurance that it hasn''t been damaged in
    transit or whoever sent it is still there to receive a response.


    Java implements datagrams on top of the UDP protocol by using two classes: the
    DatagramPacket object is the data carrier, while the DatagramSocket is the mechanism
    used to send or receive the DatagramPackets.


