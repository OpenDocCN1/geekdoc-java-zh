    A program should be able to handle error situations that might occur at runtime.
    Situations can be divided into two main categories:


    +   * Programming errors. For example, using an invalid index to access an array,
    attempting to divide by zero, calling a method with illegal arguments or using
    a reference with the null value to access members of an object.

    * Runtime environment errors. For example, opening a file that does not exist,
    a read or write error when using a file, or a network connection going unexpectedly.'
