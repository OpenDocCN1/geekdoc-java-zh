  md: '# Java and Web Design


    Programming errors are error situations that occur because of logical errors in
    the program, while runtime environment errors are over which the program has little
    control.


    An exception in Java signals an error or an unexpected situation that has occurred
    during program execution. Exception handling is the mechanism for dealing with
    such situations. It is based on the “throw and catch” principle. An exception
    is thrown when an error situation occurs during program execution. It is propagated
    by the JVM and caught by an exception handler that takes an appropriate action
    to handle the situation.


    # 3.1 EXCEPTION-HANDLING FUNDAMENTALS''


    A Java exception is an object that describes an exceptional (that is, error) condition
    that has occurred in a piece of code. When an exceptional condition arises, an
    object representing that exception is created and thrown in the method that caused
    the error. That method may choose to handle the exception itself, or pass it on.
    Either, at some point, the exception is caught and processed. Exceptions can be
    generated by the Java run-time system, or they can be manually generated by your
    code. Exceptions thrown by Java relate to fundamental errors that violate the
    rules of the Java language or the constraints of the Java execution environment.
    Manually generated exceptions are used to report some error condition to the caller
    of a method.


    ![](img/5896385a9e8402477461956f4864a34e_97_0.png)


    Exception is an event, which occurs during the execution of a program that disrupts
    the normal flow of the program''s instructions.


    Java exception handling is managed via five keywords: try, catch, throw, throws,
    and finally. Program statements that you want to monitor for exceptions are contained
    within a try block. If an exception occurs within the try block, it is thrown.
    Your code can catch this exception (using catch) and handle it in some rational
    manner. System-generated exceptions are automatically thrown by the Java run-time
    system. To manually throw an exception, use the keyword throw. Any exception


