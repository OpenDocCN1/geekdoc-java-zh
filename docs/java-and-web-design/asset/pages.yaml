    # 3.2.3 Thread Life Cycle


    The life cycle of threads in Java is very similar to the life cycle of processes
    running in an operating system. During its life cycle the thread moves from one
    state to another depending on the operation performed by it or performed on it
    as illustrated in Figure (3.4). A Java thread can be one of the following states:


    +   - NEW

    nA thread that is just instantiated is in new state. When a start() method is
    invoked, the thread moves to the ready state from which it is automatically moved
    to runnable state by the thread scheduler.

    - RUNNABLE (ready → running)

    A thread executing in the JVM is in running state.

    - BLOCKED

    A thread that is blocked waiting for a monitor lock is in this state. This can
    also occur when a thread performs an I/O operation and moves to next (runnable)
    state.

    - WAITING

    A thread that is waiting indefinitely for another thread to perform a particular
    action is in this state.

    - TIMED_WAITING (sleeping)

    A thread that is waiting for another thread to perform an action up to a specified
    waiting time is in this state.

    - TERMINATED (dead)

    A thread that has exited is in this state.'
