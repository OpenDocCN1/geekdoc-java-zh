    # Web Browsers


    A browser is a special software program also known as a client that requests servers
    for a specific web document and renders it on the computer terminal for the user.
    One of the oldest browsers is Lynx. This is a text only browser. The earliest
    graphical browser was Mosaic developed at the National Center for Supercomputing
    (NCSA) at the University of Illinois. The developers of Mosaic later formed a
    company that produced Netscape. Microsoft has its own browser called the Internet
    Explorer that comes with the Windows operating system. There are other browsers
    available - Mozilla, Opera, and Safari. The browsers communicate with the servers
    using the standard Hypertext Transfer Protocol (HTTP).


    # Web Servers


    A web server is a software program that provides documents to browsers. Apache
    is the most used web server with 68% of the market share. Second is Microsoft''s
    Internet Information Server (IIS) with about 21% of the market share. And the
    remainder is spread over a large number of other servers. A web browser initiates
    a request with a server by sending it the URL of a document. The server searches,
    retrieves and sends the document.


