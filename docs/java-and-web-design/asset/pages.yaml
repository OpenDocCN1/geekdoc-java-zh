    # Frames


    In creating a Web site, frames are the use of multiple, independently controllable
    sections on a Web presentation. This effect is achieved by building each section
    as a separate HTML file and having one “master” HTML file identify all of the
    sections. When a user requests a Web page that uses frames, the address requested
    is actually that of the “master” file that defines the frames; the result of the
    request is that multiple HTML files are returned, one for each visual section.
    Links in one frame can request another file that will appear in another (or the
    same) frame. A typical use of frames is to have one frame containing a selection
    menu in one frame and another frame that contains the space where the selected
    (linked to) files will appear.


    # 5.2. STATIC AND DYNAMIC WEB PAGES²


    Web pages can be either static or dynamic. “Static” means unchanged or constant,
    while “dynamic” means changing or lively. Therefore, static Web pages contain
    the same prebuilt content each time the page is loaded, while the content of dynamic
    Web pages can be generated on-the-fly.


    Standard HTML pages are static Web pages. They contain HTML code, which defines
    the structure and content of the Web page. Each time an HTML page is loaded, it
    looks the same. The only way the content of an HTML page will change is if the
    Web developer updates and publishes the file.


