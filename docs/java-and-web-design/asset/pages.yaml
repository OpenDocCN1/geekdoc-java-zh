    # Web Application Vulnerabilities


    Phishing is another common threat to the Web application and global losses from
    this type of attack in 2012 estimated at $1.5 billion.


    Web application vulnerabilities are typically the result of a lack of input/output
    sanitization, which are often exploited to either manipulate source code or gain
    unauthorized access.


    Such vulnerabilities enable the use of different attack vectors, including:


    +   SQL Injection – Occurs when a perpetrator uses malicious code to manipulate
    a backend database so it reveals information. Consequences include the unauthorized
    viewing of lists, deletion of tables and unauthorized administrative access.


    +   Cross-site Scripting (XSS) – XSS is an injection attack targeting users in
    order to access accounts, activate Trojans or modify page content. Stored XSS
    occurs when malicious code is injected directly into an application. Reflected
    XSS takes place when malicious script is reflected off an application to a user’s
    browser.


    +   Remote File Inclusion – A hacker uses this type of attack to remotely inject
    a file onto a web application server. This can result in the execution of malicious'
