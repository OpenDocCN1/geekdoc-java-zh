  md: 'Web application security issues arise when the web application reacts poorly
    to unexpected information requests or specially crafted data from a user with
    a malicious intent. A ‘confused’ web application may become a security risk when
    that confusion allows unintended manipulation of the web application functionality.


    A classic example of such a malicious ploy is the substitution of database commands
    when benign data is expected (SQL Injection) – the login password field is often
    a target since its corresponding value is stored in the application''s database.
    If input data is not filtered by the web application, the user effectively has
    the power to run their own ‘mini’ via database commands, perhaps with full access
    to the entire database, if not the entire internal network.


    # The Web Applications under Study


    While I''m only citing two web applications in this study, I feel that they are
    representative of the massive number of web applications that are currently at
    risk. If to label the stratum where these web applications fit, I might pick ‘Middle
    America’ or ‘Professional Class’. Both applications were centric to companies
    with the following characteristics:


    +   - Revenues between $5 and $10 million


    +   - Critical dependencies on the web application in order to do business ‘protected’
    by federal and state agencies


    +   - Processing and storing data would be considered ‘protected’ by federal and
    state agencies


    +   - Tremendous financial risk (i.e. fines, flight of clients) if stored data
    is compromised


    +   - Both web applications were followed from initial security vulnerability
    discovery through security remediation and redeployment.


