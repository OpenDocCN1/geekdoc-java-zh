    # Two dimensional Array


    A two-dimensional array in Java is really an array of arrays. For example, if
    values is a 2D array with 5 rows and 7 columns, it can be thought of as a one-dimensional
    array of length 5, in which each element is a one-dimensional array of length
    7. Therefore, it could be depicted like this:


    Nested loop is a (inner) loop that appears in the loop body of another (outer)
    loop.


    ![](img/5896385a9e8402477461956f4864a34e_69_0.png)


    Because of this representation, each row in a two-dimensional array could be instantiated
    separately, and could have a different number of columns:


    ```

    int[][] raggedArray = new int[5];

    raggedArray[0] = new int [4];

    raggedArray[1] = new int [7];

    raggedArray[2] = new int [8];

    raggedArray[3] = new int [5];

    raggedArray[4] = new int [6];

    ```'
