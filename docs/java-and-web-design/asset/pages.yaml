    # Domain Names


    Every computer on the Internet has a unique IP address. An IP address is of the
    form: octet.octet.octet.octet. An octet is a sequence of 8 binary digits. In decimal
    the value of an octet would range from 0 through 255. An IP address has two parts.
    The first part identifies the network and the second part identifies the host
    computer.


    It is difficult to remember the numerical values of IP. The Domain Name System
    (DNS) maps text names to IP addresses. Top level domain names are .org,.edu,.gov,.net,.com.
    With every top level domain there are millions of second level domains. Each name
    at the second level domain must be unique. A DNS server gets requests to translate
    a domain name into an IP address. A DNS server can return the IP address if it
    is in its database, query another DNS server if it does not have knowledge of
    that domain, or return the result that that domain does not exist.


    When a browser contacts a DNS server to resolve a domain that DNS server may not
    have the IP address. May redirect that query to a root DNS server. The root DNS
    server will send the IP address of the DNS server that should be able to resolve
    that request. There are multiple DNS servers at each level. So if one fails other
    servers that can handle the requests.


