  md: '# 3.2.8 Concurrent Issues with Thread Programming


    Threading is a very powerful technique which is sometimes very hard to control,
    especially when it is accessing shared resources. The threads have to be coordinated,
    otherwise it will violate the data of the whole application. For example, a printer
    cannot be used to print two documents at the same time and if there are multiple
    printing requests, threads managing these operations needs to be coordinated.
    Another example would be simultaneously operating the same bank account: it is
    not correct to both deposit and withdraw operations a bank account at the same
    time. There are two very basic problems related to concurrent issues when dealing
    with multiple threads: read/write problem and producer consumer problem.


    # Read/Write Problem


    If one thread tries to read the data and another thread tries to update the same
    data, it is known as read/ write problem, and it leads to inconsistent state for
    the shared data. This can be prevented by synchronizing access to the data via
    Java synchronized keyword. For example


    ```

    public synchronized void update() {

    }

    ```


    It is better to explain the synchronized approach to access the shared data via
    a simple example. Consider an example of a bank offering online access to its
    customers to perform transactions on their accounts from anywhere in the world,
    as shown in Figure 3.7. It is possible that an account holder has given a check
    to some other holder. If the check recipient has to withdraw the money at the
    same time as the original account holder deposits the money, both parties are
    performing simultaneous operations on the same account. This situation can lead
    to incorrect operation on the account. This can be avoided by synchronization,
    which ensures that only one person is able to perform an operation on a shared
    data at a time (i.e., in a way operations are sequenced to avoid data inconsistency
    problems). The following class shows a typical invocation of banking operations
    via multiple threads.'
