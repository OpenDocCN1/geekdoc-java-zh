  md: '![](img/5896385a9e8402477461956f4864a34e_122_0.png)


    Figure 3.4: Life cycle of Java threads.


    At any given time, a thread can be in only one state. These states are JVM states
    as they are not linked to operating system thread states.


    When the object of a Thread class is created, the thread moves to the NEW state.
    After invocation of the start() method, the thread shifts from the NEW to the
    ready (RUNNABLE) state and is then dispatched to running state by the JVM scheduler.
    After gaining a chance to execute, the run() method will be invoked directly (explicitly
    in the program), the code in it is executed by the current thread and not by the
    new thread (as the thread object is not assigned to the virtual machine scheduler).
    Depending on program operations or invocation of methods such as wait(), sleep(),
    and suspend() or I/O operation, the thread moves to the WAITING, SLEEPING, and
    BLOCKED states respectively. It should be noted that the thread is still alive.
    After the completion of an operation that blocked (I/O or sleep) or receiving
    an external signal that wakes it up, the thread moves to ready state. The JVM
    scheduler moves it to running state to continue the execution of remaining operations.
    When the thread completes its execution, it will be moved to TERMINATED state.
    A dead thread can never enter any other state, not even if the start() method
    is invoked on it.


