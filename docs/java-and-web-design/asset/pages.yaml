    c=(a-b)*(a+b);


    If the value of a is greater than 10, then the following statement is executed
    which in turn is another if statement. This if statement tests b and if b is less
    than 15, c is calculated.


    # 1.2.2 The if...else statement:


    This form of if allows either-or condition by providing an else clause. The syntax
    of the if-else statement is the following:


    ```

    if(expression)

    statement-1;

    else

    statement-2;

    ```


    If the expression evaluates to true i.e., a non-zero value, the statement-1 is
    executed, otherwise statement-2 is executed. The statement-1 and statement-2 can
    be a single statement, or a compound statement, or a null statement.


    Following figure illustrates the if else construct of java:


    ![](img/5896385a9e8402477461956f4864a34e_36_0.png)


