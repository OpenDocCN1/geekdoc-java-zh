  md: '# Web Application Security


    If the server certificate and the bundle have been concatenated in the wrong order,
    nginx will fail to start and will display the error message:

    SSL_CTX_use_PrivateKey_file(" ... /www.example.com.key") failed

    (SSL: error:0B080074:X509 certificate routines:

    X509_check_private_key values mismatch)


    because nginx has tried to use the private key with the bundle''s certificate
    instead of the server certificate.

