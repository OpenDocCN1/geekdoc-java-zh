    # 4.3.1. Window Fundamentals


    The AWT defines windows according to a class hierarchy that adds functionality
    and specificity with each level. The two most common windows are derived from
    Panel, which is used by applets, and those derived from Frame, which creates a
    standard application window. Much of the functionality of these windows is derived
    from their parent classes. Thus, a description of the class hierarchies relating
    to these two classes is fundamental to their understanding. Figure 1 shows the
    class hierarchy for Panel and Frame. Let''s look at each of these classes now.


    # Component


    At the top of the AWT hierarchy is the Component class. Component is an abstract
    class that encapsulates all of the attributes of a visual component. All interface
    elements that are displayed on the screen and interact with the user are subclasses
    of Component. It defines over a hundred public methods that are responsible for
    managing events, such as mouse and keyboard input, positioning and sizing the
    window. A Component object is responsible for remembering the current foreground
    and background colors and the currently selected text font.


    ![](img/5896385a9e8402477461956f4864a34e_182_0.png)


    A variable in bash can contain a number, character, a string of characters.


    # Container


    The Container class is a subclass of Component. It has additional methods that
    allow other Component objects to be nested within it. Other Container objects
    can be stored inside of a Container (since they are themselves instances of Component).
    This makes for a multilevel containment system. A container is responsible for
    laying out (that is, positioning) any'
