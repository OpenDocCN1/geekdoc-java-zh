  md: "# Web Application Security\n\nThe oldest and most robust method to resolve\
    \ the issue is to assign a separate IP address for every HTTPS server:\n\n```\n\
    server {\n  listen 192.168.1.1:443 ssl;\n  server_name www.example.com;\n  ssl_certificate\
    \ www.example.com.crt;\n  ...\n}\n\nserver {\n  listen 192.168.1.2:443 ssl;\n\
    \  server_name www.example.org;\n  ssl_certificate www.example.org.crt;\n  ...\n\
    }\n```\n\n# An SSL certificate with several names\n\nThere are other ways that\
    \ allow sharing a single IP address between several HTTPS servers. However, all\
    \ of them have their drawbacks. One way is to use a certificate with several names\
    \ in the SubjectAltName field, for example, www.example.com and www.example.org.\
    \ However, the SubjectAltName field length is limited.\n\nAnother way is to use\
    \ a certificate with a wildcard name, for example, *example.org. A wildcard certificate\
    \ secures all subdomains of the specified domain, but only on one level. This\
    \ certificate matches www.example.org, but does not match example.org www.sub.example.org.\
    \ These two methods can also be combined. A certificate may contain exact and\
    \ wildcard names in the SubjectAltName field, for example, example.org and *example.org.\n\
    \nIt is better to place a certificate file with several names and its private\
    \ key file at the http level of configuration to inherit their single memory copy\
    \ in all servers:\n\n```\nssl_certificate common.crt;\nssl_certificate_key common.key;\n\
    \nserver {\n  listen 443 ssl;\n  server_name www.example.com;\n}\n\nserver {\n\
    \  listen 443 ssl;\n  server_name www.example.org;\n  ...\n}\n```"
