    #  3.2.1 Defining Threads


    To understand multithreading, the concepts process and thread must be understood.
    A process is a program in execution. A process may be divided into a number of
    independent units known as threads. A thread is a dispatchable unit of work. Threads
    are light-weight processes within a process. A process is a collection of one
    or more threads and associated system resources. The difference between a process
    and a thread is shown in Figure 3.1. A process may have a number of threads in
    it. A thread may be assumed as a subset of a process.


    If two applications are run on a computer (MS Word, MS Access), two processes
    are created. Multitasking of two or more processes is known as process-based multitasking.
    Multitasking of two or more threads is known as threadbasedmultitasking. The concept
    of multithreading in a programming language refers to thread-based multitasking.
    Process-based multitasking is totally controlled by the operating system. Thread-based
    multitasking can be controlled by the programmer to some extent in a program.'
