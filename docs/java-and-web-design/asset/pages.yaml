  md: '# 4.4.1. JavaBeans Properties:


    A JavaBean is a named attribute that can be accessed by the user of the object.
    The attribute can be of any Java data type, including classes that you define.


    A JavaBean may be read, write, read only, or write only. JavaBean properties are
    accessed through two methods in the JavaBean''s implementation:


    | Method | Description |

    | --- | --- |

    | getPropertyName() | For example, if property name is firstName, your method
    would be getFirstName() to read that property. This method is called accessor.
    |

    | setPropertyName() | For example, if property name is firstName, your method
    name would be setFirstName() to write that property. This method is called mutator.
    |


    A read-only attribute will have only a getPropertyName() method, and a write-only
    attribute will have only a setPropertyName() method.


    # Accessing JavaBeans


    The use action declares a JavaBean for use in a JSP. Once declared, the bean becomes
    a scripting variable that can be accessed by scripting elements and other custom
    tags used in the JSP.


