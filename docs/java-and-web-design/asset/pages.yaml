    +   - The Java primitive wrapper classes: Boolean, Character, Double, Float, Integer,
    and Long


    Instances of **String** and of the Java primitive wrapper classes cannot be modified
    and do not maintain their identity when they are migrated into a database.


    Under rare circumstances, you might explicitly define a class that inherits from
    the Persistent or HashPersistent class in your source code.


    Normally, after you compile code that defines a class that you want to store persistently,
    you run the Class File postprocessor to make the class capable. One of the annotations
    that the postprocessor adds to your code is that it makes your class or a superclass
    inherit from the COM.odi.Persistent or COM.odi.util.HashPersistent class. The
    postprocessor chooses the base by examining the class being updated and any derived
    classes. If any of these are nonabstract and inherit the hashCode() method from
    java.lang.Object, the postprocessor makes the COM.odi.util.HashPersistent the
    base class. Otherwise, COM.odi.Persistent becomes the base.


    Regardless of how your class comes to inherit it, the Persistent class is an abstract
    base class. The API for defining classes whose instances you can store in a database.
    Most of the time is the postprocessor that implements this API.


    If you explicitly define a class to inherit from Persistent your subclass must
    define the initializeContents(), clearContents(), and flushContents() methods.
    Also you must register a subclass of the ClassInfo. Additional information about
