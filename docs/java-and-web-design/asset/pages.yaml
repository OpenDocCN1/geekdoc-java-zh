    # 5.1. OVERVIEW OF THE INTERNET


    The Internet is a collection of computers connected by network cables or through
    satellite links. Rather than connecting every computer on the Internet with every
    other computer, individual computers in an organization are normally connected
    in a local area network (LAN). One on this local area network is physically connected
    to the Internet. Since the Internet is a network of networks. There are millions
    of computing devices that are connected to this network either permanently or
    for a short duration. These devices run network applications that communicate
    through copper or fiber optic cables, radio or satellite transmission. The communication
    is governed by protocols established by an international body Internet Engineering
    Task Force.


    The Internet connectivity is provided by Internet Service Providers (ISP). These
    corporations dedicate computers to act as servers that are make information (such
    as Web pages or e-mail) available to users of the Internet.


