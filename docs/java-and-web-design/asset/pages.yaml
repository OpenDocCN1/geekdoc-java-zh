    In process based multitasking, a program is the smallest unit of code that can
    be dispatched by the scheduler. In a threadbasedmultitasking environment, the
    thread is the smallest unit of dispatchable code. This means that a single program
    can perform two or more tasks simultaneously. For instance, a text editor can
    format text at the same time that it is printing, as long as these two actions
    are being performed by separate threads. Multitasking requires less overhead than
    multitasking processes. Processes require their own separate address spaces. Interprocess
    communication is expensive and limited. Context switching from one to another
    is also costly. Threads, on the other hand, are lightweight. They share the same
    address space and cooperatively share the same heavyweight process. Interthread
    communication is inexpensive, and context switching from one to the next is low
    cost. While Java programs use of processbased multitasking environments, processmultithreaded
    multitasking is not under the control of Java.


