    # MouseListener and MouseAdapter


    The MouseListener interface contains five methods that are called when a nonmotion
    oriented MouseEvent occurs; mouse events are generated when the user presses or
    releases a mouse button. (Separate classes, MouseListener and MouseAdapter, are
    used to handle mouse motion events; this means that you can listen for mouse clicks
    without being bothered by thousands of mouse events.) The adapter class for MouseListener
    is MouseAdapter. If you care about only one or two of the methods in MouseListener,
    you can subclass the adapter and override the methods that you are interested
    in. For an object to listen for mouse events, it is necessary to call the method
    Window.addListener() with the class that implements the interface as the parameter.


    public abstract void mouseEntered(MouseEvent) called when the mouse first enters
    the bounding area of the component. This method is the Java 1.1 equivalent of
    Component.mouseEnter in the Java 1.0 event model.


    public abstract void mouseExited(MouseEvent) called when the mouse leaves the
    bounding area of the component. This method is the Java 1.1 equivalent of Component.mouseExit
    in the Java 1.0 event model.


    public abstract void mousePressed(MouseEvent) called each time the user presses
    a mouse button within the component''s space. This method is the Java 1.1 equivalent
    of Component.mouseDown() in the Java 1.0 event model.


    public abstract void mouseReleased(MouseEvent) called when the mouse releases
    the mouse button after a mouse press. The user does not have to be over the original
    component any more; the original component (i.e., the component in which the mouse
    was pressed) is the source of the event. This method is the Java 1.1 equivalent
    of Component.mouseUp() in the Java 1.0 event model.


    public abstract void mouseClicked(MouseEvent) called once each the user clicks
    a mouse button; that is, for each mouse press/mouse release combination.


