  md: '# Arrays and String


    # String Array Declaration


    Square brackets is used to declare a String array. There are two ways of using
    it. The first one is to put square brackets after the String reserved word. For
    example:


    Another way of declaring a String Array is to put the square brackets after the
    name of the variable. For example


    String[]thisASStringArray;


    Both statements will declare the variable "thisASStringArray" to be a String Array.
    Note that this is just a declaration, the variable "thisASStringArray" will have
    the value null. And since there is only one square brackets, this means that the
    variable is only one-dimensional String Array. Examples will be shown later on
    how to declare multi-dimensional String Arrays.


    String[]thisASStringArray;


    # String Array Declaration with Initial Size


    Arrays are usually used when we know how many objects are needed. Hence, arrays
    are usually declared with an initial size. Here is example:


    ```

    String[]thisASStringArray = new String[5];

    ```


    This will declare a String Array with 5 elements. Each element can be accessed
    using index that starts with 0. The first element is "thisASStringArray[0]", the
    second element is "thisASStringArray[1]", and so on. Here is an example of declaring
    a String Array with size 5 and assigning values to each element:


    ```

    String[]thisASStringArray = new String[5];nthisASStringArray[0] = "AAA";nthisASStringArray[1]
    = "BBB"

    thisASStringArray[2] = "CCC"

    thisASStringArray[3] = "DDD"

    thisASStringArray[4] = "EEE";

    ```


    > REMEMBER

    The most obvious extension to the idea is to be able to reference several data
    elements of a particular type with a single variable name. This would enable you
    to handle applications of much broader scope.


