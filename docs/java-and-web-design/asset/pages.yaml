    # One Dimensional Array


    A one-dimensional array is, essentially, a list of like-typed variables. To create
    an array, you first must create an array variable of the desired type. The general
    form of a one-dimensional array declaration is


    ```

    type var-name[];

    ```


    Here, type declares the base type of the array. The base type determines the data
    type of each element that comprises the array. Thus, the base type for the array
    determines what type of data the array will hold.


    For example, the following declares an array named month_days with the type "array
    of int":


    ```

    int month_days[];

    ```


    Although this declaration establishes the fact that month_days is an array variable,
    no array actually exists. In fact,'
