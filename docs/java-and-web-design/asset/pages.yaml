    # 4.3.3. Creating a Frame Window in an Applet


    While it is possible to create a frame window by creating an instance of Frame,
    you will seldom do so, because you will not be able to do much with it. For example,
    you will not be able to receive or process events that occur within it or easily
    update it. To create a subclass of Frame. By doing so you override Frame’s methods
    and provide event handling.


    Creating a new window from within an applet is actually easy. First, create a
    subclass of Frame. Next, override all of the standard methods, such as init( ),
    start( ), to show or hide the frame as needed.


