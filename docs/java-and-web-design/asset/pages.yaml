  md: '# Java and Web Design


    advocated a need for a strong correlation between software development and SQA
    – with a requirement to consider both disciplines in lockstep throughout the entire
    life cycle of any development project.


    Like the development of an operationally sound web application, the processes
    behind the creation of a secure web application must include software development
    processes that include structured security methodologies and the inclusion of
    security testing.


    Security-oriented development practices are not only compatible with the creation
    of high-quality software application development, but when done correctly, the
    integration of the two is seamless. With training and awareness, software development
    professionals can incorporate security coding techniques as part of their normal
    practices.


    Add to this, it has been my observation that the addition of security-aware development
    does not significantly add time or cost to an already well structured, professionally
    done development effort.


    # Web Application #1


    The older of the two web application’s in the study, by manual and automated testing,
    was found to be vulnerable to critical security attacks by even inexperienced
    hackers. Because of the company-centric nature of this web application, a decision
    was made to secure the existing web application as quickly as possible.


    ![](img/5896385a9e8402477461956f4864a34e_311_0.png)


    The initial remediation stage of this first web application went as follows:


    +   Triage known critical security flaws – While security tests pointed out numerous
    critical security flaws, the immediate need was to identify those flaws that might
    be considered high-risk. These flaws were selected because of the relative ease
    of a successful security attack and the ‘protected’ status of the data that would
    be compromised.


    +   Repair of high-risk security flaws – Each security flaw identified in the
    triage stage above was remediated to thwart any security attack against flaw.


    +   Conduct code reviews – At least two software developers (skilled in standard'
  merge: -1
  pgno: 311
- img_proc: true
  md: 'and security development techniques) reviewed the remediated software to assure
    the quality of the repair and verify no additional security flaws had been introduced.


    +   - **Retest web application** – Automated web application scans were rerun
    and compared to pre-remediation scans. This re verified the repair of the high-risk
    flaws as well as the fact that no addition vulnerabilities were introduced.


    At the conclusion of the initial remediation stage, the web application was considered
    safe from amateur hackers, with added protection against direct access to the
    application database. This was a far better than its previous status.


    In subsequent stages, the remainders of the critical security flaws were fixed
    using the same repair, code review and retry cycles as noted above.


    # Web Application #2


    The second web application under study had only recently been deployed and was,
    therefore, less company-critical than the first. Unfortunately, the second web
    application was developed by a team that not only lacked security development
    skills, but also lacked skills that would produce operationally sound web applications.


    Given the fact that a significant portion of the web application collected and
    stored easily compromised medical information, a quick decision was made to immediately
    take down the new site and replace it with a ‘placeholder’ site that, while limited
    in functionality, was not subject to security attacks that would yield ‘protected’
    information.


    The development of the second web application followed SDLC methodologies with
    the addition of vulnerability security scans at every release point. These scans
    not only ensured the security of the application but also raised the security
    awareness and skill levels of the development team. While not a substitute for
    security development training, periodic reminders of code-based security flaws
    educated developers in the art of correct security oriented development.


    Conclusion While the sample size in this study was far too to draw any statistically
    valid conclusions, did it reinforce statistics indicating a 70% security failure
    rate of all web applications.


    Also of the fact that the owners of two very successful companies were oblivious
    of the serious risks their web applications represented. While there do not seem
    to be any studies of the percentage of companies that are security ‘clueless’,
    this anecdotal evidence indicates this percent might be very high.


    Finally, it is sobering to think of the huge number of companies that are dependent
    on otherwise very competent development teams, with security training and testing,
    could be producing secure web applications as opposed to the very vulnerable products
    that exist today.


