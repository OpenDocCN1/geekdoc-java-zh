  md: '# PREFACE


    Java is a general-purpose computer programming language that is concurrent, class-based,
    object-oriented, and specifically designed to have as few implementation dependencies
    as possible. Java applications are typically compiled to bytecode that can run
    on any Java virtual machine regardless of computer architecture. Web design encompasses
    many different skills and disciplines in the production and maintenance of websites.
    The different areas of web design include graphic design; interface design; authoring,
    including standardized code and proprietary software; user experience design;
    and search engine optimization. The term web design is normally used to describe
    the design process relating to the front-end design of a website including mark
    up. Web design partially overlaps web engineering in the broader scope of web
    development.


    # Content Coverage


    Chapter One provides and introduction to Java with importance and features of
    Java. The Labeled loops and jump statement are also highlighted. Chapter Two presents
    an emphasis on basic concept of arrays and string in Java. Chapter Three reveals
    on exception handling fundamentals with multithreaded programming, input / output
    programming, and networking. An overview of global markets and competitors, as
    well as global marketing research and geographic market choices, is also presented.
    Chapter Four and Chapter Five emphasizes on event handling and website design
    respectively. Chapter Six presents an overview and objectives of web application
    security.


    The following are the salient features of the book:


    +   - Presents web design features in a way that is both understandable and useful
    in the real world.


    +   - Topics are logically arranged according to the course outline of the subject.'
