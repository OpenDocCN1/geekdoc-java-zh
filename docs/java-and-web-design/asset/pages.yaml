  md: '# Arrays and String


    creates a string object having the string literal and assigns it to the provided
    string instances. Suppose you are doing this –


    ```

    String msg = "Hello, Friend";

    String msg1 = "Hello, Friend";

    ```


    In the above case compiler will create the object for the string literal "Hello,
    Friend" and assign the msg reference to this object. As compiler will switch to
    next line it will find the same string literal but the object already exists for
    the String compiler does not create a new Object rather it assigns the old object
    to the new instance, that means even though we have two string instances above(msg
    and msg1) compiler only created on string object having the value "Hello, Friend")
    and assigned the same to both the instances.


    If you want to create two different objects with the same string then you would
    need to create strings using the new keyword.


    But we use prefer Literals because it is more memory efficient.


    # Using new keyword


    We know String is a class in Java so we can create the object of the class. To
    overcome the problem with Java Literals we can use the new keyword to create the
    String objects.


    ```

    String msg = new String("Hello, firend");

    ```


    # How String Objects Stored in the Memory


    When you create a string object using string literal that string literal is added
    to the string pool, if it is not present already


    ```

    String msg = "Hello, Friend";

    ```


    ![](img/5896385a9e8402477461956f4864a34e_84_0.png)


    And, when we create another object with same string, then a reference of the string
    literal already present in string pool is returned.


    ```

    String msg = "Hello, Friend";

    String msg1 = "Hello, Friend";

    ```'
