    \ java is the if-else-if ladder, which is often also called the if-else-if staircase\
    \ because of it is appearance.\n\nIt takes the following form:\n\n```\nif(expression1)\
    \ statement1;\nelse\n  if(expression2) statement2;\nelse\n  if(expression3) statement3;\n\
    ```\n\nstatement n;\nThe expressions are evaluated from top downward. As soon\
    \ as expression evaluates to true, the statement associated with it is executed\
    \ and the rest of the ladder is bypassed. If none of the expression are true,\
    \ the final else gets. If the final else is missing, no action takes place if\
    \ all other conditions are false. Although it is technically correct to have indentation\
    \ in the if-else-if ladder as shown above. However, it generally leads to overly\
    \ deep indentation. For this reason, the if-else-if ladder is like this:\n\n```\n\
    if(expression1)\n  statement 1;\nelif(expression2)\n  statement 2;\nelif(expression3)\n\
    \  statement 3;\nelse\n  statement n;\n```"
