    # 3.2 MULTITHREADED PROGRAMMING²


    Unlike many other languages, Java provides built-in support for multithreaded
    programming. A multithreaded program contains two or more parts that can run concurrently.
    Each part of such a program is a thread, and each thread defines a separate path
    of execution. Thus, multithreading is a specialized form of multitasking.


    You are almost certainly acquainted with multitasking, as it is supported by virtually
    all modern operating systems. However, there are two distinct types of multitasking:
    process based and thread-based. It is important to understand the difference between
    the two. For most readers, process-based multitasking is the more familiar form.
    A process is, in essence, a program that is executing. Thus, process-based multitasking
    is the feature that allows your computer to run two or more programs concurrently.
    For example, process-based multitasking enables you to run the Java


