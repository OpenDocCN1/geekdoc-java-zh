    # 6. PASSWORD DIGESTS⁹


    If the web application server is compromised (i.e. an attacker has gained access
    to the server), it is possible for the attacker to get the usernames and passwords
    from the user table. Even if your application does not have highly confidential
    information, users may have entered passwords that they use for other applications.
    To mitigate the potential danger, it is better to store digests of user passwords
    rather than the plaintext (unencrypted) password.


    The key property of a secure digest is that it is an irreversible mapping of a
    string to another string, which means that given the password, you can compute
    the digest; but given the digest, you cannot compute the password. If we store
    a digest of the passwords in the database, an attacker who has access to the database
    cannot compute any passwords. If the passwords are simple, the attacker could
    perform what is referred to as a dictionary attack in which he or she tries every
    password from a list of common or potential passwords. This threat is mitigated
    if users choose string passwords.


    The web application also cannot determine the user passwords from what is stored
    in the database. However, the password digests are sufficient for authentication.
    When the user submits a password during authentication, the web application maps
    the password to its digest and then checks to see if the digest it has computed
    matches with the digest stored in the database.


    It should be kept in mind that storing digests in the database simply adds a layer
    of inconvenience to an attacker, and does not provide essential security. If the
    attacker has access to the database, he or she most likely has access to the system
    on which the web application is running. In this case, the attacker can put up
    an intermediate login page that captures the users'' passwords before passing
    them to the web application. Other attacks are possible as well if the underlying
    server is not secure or if the web application provides an entry point into the
    system in some way.


    | 9 | http://cse.csusub.edu/turner/java_web_programming/security/digests/ |'
