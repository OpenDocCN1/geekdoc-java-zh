  md: '# 3.4 NETWORKING⁴


    Java is practically a synonym for Internet programming. There are a number of
    reasons for this, the least of which is its ability to generate secure, cross-platform,
    portable code. However, one of the most important reasons that Java is the premier
    language for network programming is the classes defined in the java.net package.
    They provide an easy-to-use means by which programmers of all skill levels can
    access network resources.


    # 3.4.1 Networking Basics


    It will be useful to review some key networking concepts and terms. At the core
    of Java’s networking support is the concept of a socket. A socket identifies an
    endpoint in a network. The socket paradigm was for the 4.2BSD UNIX release in
    the early 1980s. Because of this, the term Berkeley socket is also used. Sockets
    are at the foundation of modern networking a socket allows one to serve many different
    clients at once, as well as to serve many different types of information. This
    is accomplished through the use of a port, which is a numbered socket on a particular
    machine. A server process is said to “listen” to a port until a client connects
    to it. A server is allowed to accept multiple clients connected to the same port
    number, although each session is unique. To manage multiple client connections,
    a server process must be multithreaded have some other means of multiplexing the
    simultaneous I/O.


    Socket communication takes place via a protocol. Internet Protocol (IP) is a low-level
    routing protocol that breaks data into small packets and sends them to an address
    across a network, which does not guarantee to deliver packets to the destination.
    Transmission Control Protocol (TCP) is a higher-level protocol that manages to
    robustly gather these packets, sequencing and retransmitting as necessary to reliably
    data. A third, User Datagram Protocol (UDP), sits next to TCP and can be used
    directly to support fast, connectionless, unreliable transport of packets.


    Once a connection has been established, a higher-level protocol ensues, which
    is dependent on which port you are using. TCP/IP reserves the 1024 ports for specific
    protocols. Many of these will seem familiar to you if you have spent any time
    surfing the Internet. Port number 21 is for FTP; 23 is for Telnet; 25 is for e-mail;
    43 is for whos; 79 is for finger; 80 is for HTTP; 119 is for networks—and the
    list goes on. It is up to each protocol to determine how a client should interact
    with the port.


