  md: "# Java and Web Design\n\n# 1.2.5 The Switch Statement:\n\nJava provides a multiple\
    \ branch selection statement known as switch. This selection statement successively\
    \ tests the value of an expression against a list of integer or character constants.\
    \ When a match is found, the statements associated with that are executed.\n\n\
    The general form of switch is:\n\n```\n{\ncase value1:\n  Codesgment 1\ncase value2:\n\
    \  Codesgment 2\n  ...\ncase valuen:\n  Codesgment n\ndefault:\n  default Codesgment\n\
    }\n```\n\nA switch statement is used for multiple way selection that will branch\
    \ to different code segments based on the value of a variable or an expression.\
    \ The optional default label is used to specify the code segment to be executed\
    \ when the value of the variable or expression does not match with any of the\
    \ case values. if there is no break statement as the last statement in the code\
    \ segment for a certain case, the execution will continue on into the code segment\
    \ for the next case clause without checking the case value.\n\n# 1.2.6 Nested\
    \ Switch:\n\nYou can use switch as part of the switch sequence of an outer switch.\
    \ This is called a nested switch. Since a switch statement defines in its own\
    \ block, no conflicts arise between the case statements in the inner switch and\
    \ those in the outer switch.\n\n```\n{\nswitch(count):\ncase 1:\n  switch(target)\n\
    {\n```\n\n![](img/5896385a9e8402477461956f4864a34e_39_0.png)"
