    <jsp:useBean id=bean''s name=bean scope=scope typeSpec//>


    Here values for the scope attribute could be page, request, session or application
    based on your requirement. The value of the id attribute may be any value as long
    as it is a unique name among other JavaBean declarations in the same JSP.


