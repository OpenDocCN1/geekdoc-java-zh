    Java defines several exception classes inside the standard package java.lang.
    The most general of these exceptions are subclasses of the standard type RuntimeException.
    Since java.lang is implicitly imported into all Java programs, most exceptions
    from RuntimeException are automatically available. Java defines several other
    types of exceptions that relate to its various class libraries. Following is the
    list of Java Unchecked RuntimeException.


    | Exception | Description |

    |---|---|n| ArithmeticException | Arithmetic error, such as divide-by-zero. |

    | ArrayIndexOutOfBoundsException | Array index is out-of-bounds. |

    | ArrayStoreException | Assignment to an array element of incompatible type. |

    | ClassCastException | Invalid cast. |

    | IllegalArgumentException | Illegal argument used to invoke a method. |

    | IllegalMonitorStateException | Illegal monitor operation, such as waiting on
    an unlocked thread. |

    | IllegalStateException | Environment or application is in incorrect state. |

    | IllegalThreadStateException | Requested operation not compatible with current
    thread state. |

    | IndexOutOfBoundsException | Some type of index is out-of-bounds. |

    | NegativeArraySizeException | Array created with a negative size. |

    | NullPointerException | Invalid use of a null reference. |

    | NumberFormatException | Invalid conversion of a string to a numeric format.
    |

    | SecurityException | Attempt to violate security. |

    | StringIndexOutOfBounds | Attempt to index outside the bounds of a string. |

    | UnsupportedOperationException | An unsupported operation was encountered. |


    Following is the list of Java Checked Exceptions In java.lang.


    | Exception | Description |

    |---|---|n| ClassNotFoundException | Class not found. |'
