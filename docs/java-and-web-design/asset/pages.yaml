    Persistent classes have their metaobject protocols modified through specializations
    on persistent-metaclass. These specializations include the creation of special
    slot metaobjects: transient-slot-definition, persistent-slot-definition and direct
    and effective versions of each. For the MOP aficionado the new class initialization
    protocols are follows:


    +   - shared-initialize:around ensures that this class inherits from persistent-object
    and persistent if it does not already and the class option :index results in class
    indexed;

    - direct-slot-initialization-class returns the appropriate slot metaobject based
    on the values of :transient and :persistent slot keywords. It also does some error
    checking for invalid combinations, for example, indexed transient slots.

    - effective-slot-definition-class performs the same role as the above for effective
    slots.

    - slot-definition-allocation returns the :database allocation for persistent slot
    definitions so the underlying lisp will not allocate instance or class storage
    under some lisps.

    - compute-effective-slot-definition-initargs performs some error checking to ensure
    a subclass does not try to make an inherited persistent slot transient.

    - finalize-inheritance called before the first instance is created in order to
    finalize the list of persistent slots to account for any forward referenced classes
    in the inheritance list. Similarly the list of indexed slots is computed. This
    function is also called by the class indexing code if any calls are made that
    depend on knowing which slots are indexed.


