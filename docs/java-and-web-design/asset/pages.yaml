  md: '# Java and Web Design


    # SUMMARY


    +   - Java application security is a security philosophy geared toward protecting
    applications hosted on websites and securing websites themselves.


    +   - Authorized users can obtain the required data and system services in a reasonable
    period of time.


    +   - Web applications allow visitors to the most critical resources of a web
    site, the web server and the database server.


    +   - Persistent classes have their metaobject protocols modified through specializations
    on persistent-metclass.


    +   - Java Pages and servlets make several mechanisms available to Web developers
    to secure applications.


    +   - SecurityFilter is intended for use by Java web application developers. It
