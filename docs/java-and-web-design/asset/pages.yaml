  md: "# 3.1.6 throw\n\nSo far, you have only been catching exceptions that are thrown\
    \ by the Java run-time system. However, it is possible for your program to throw\
    \ an exception explicitly, using the throw statement. The general form of throw\
    \ is shown here:\n\n```\nthrow ThrowableInstance;\n```\n\nHere, ThrowableInstance\
    \ must be an object of type Throwable or a subclass of Throwable. Primitive types,\
    \ such as int or char, as well as non-Throwable classes, as as String and Object,\
    \ cannot be used as exceptions. There are two ways you can obtain a Throwable\
    \ object: using a parameter in a catch clause, or creating one with the new operator.\n\
    \nThe flow of execution stops immediately after the throw statement; any subsequent\
    \ statements are not executed. The nearest enclosing try block is inspected to\
    \ see if it has a catch statement that matches the type of exception. If it finds\
    \ a match, control is transferred to that statement. If not, the next enclosing\
    \ try statement is inspected, If no match found, the default exception handler\
    \ handles the program and prints the stack trace. Here is a sample program that\
    \ creates and throws an exception. The handler that catches the exception rewrites\
    \ it to the outer handler.\n\n// Demonstrate throw.\n\n```\nclass ThrowDemo {\n\
    \  static void demoproc() {\n  try {\n    throw new NullPointerException(\"demo\"\
    );\n  } catch(NullPointerException e) {\n    System.out.println(\"Caught inside\
    \ demoproc.\");\n    throw e; // rethrow the exception\n  }\n  }\n\n  public static\
    \ void main(String args[]) {\n  try {\n    demoproc();\n  } catch(NullPointerException\
    \ e) {\n    System.out.println(\"Recaught: \" + e);\n  }\n  }\n  }\n```"
