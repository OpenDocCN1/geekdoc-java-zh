    # Creating Graphical Tables


    Graphical tables are composed of rows of cells. They require an opening <table>
    tag and the closing </table> tag. The table element attributes include summary,
    align, width (percent of page width or pixels), border (in pixels), controls frame
    width around table), frame (which parts of frame to render), rules (rulings between
    rows and cols), cellspacing (pixels, spacing between cells), and cellpadding (pixels,
    spacing within contents and margin). The summary attribute is a text that provides
    a summary of the table''s purpose and structure for user agents rendering non-visual
    media such as Speech and Braille. The align attribute, now deprecated, specifies
    the position of the table (left, center, or right) with respect to the document.
    The width attribute specifies the width of the table. When pixels are specified
    the window retains the specified width irrespective of browser window width. When
    the value is a percentage, the value is relative to the browser''s horizontal
    space. In the absence of any width specification, table width is determined by
    the browser.


    Tables incorporate other elements. A <caption> element is only permitted immediately
    after the <table> start tag. A <table> element may only contain one <caption>
    element. The <caption> requires an </caption> closing tag. The table row <tr>
    element acts as a container for a row of cells. The end </tr> tag is not required,'
