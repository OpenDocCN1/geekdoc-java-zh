    # 4.3.9. Using AWT Controls, Layout Managers, and Menus


    Abstract Window Toolkit (AWT) begins with an examination of the standard controls
    and layout managers. It then discusses menus and the menu bar. It concludes with
    another look at event handling. Controls are components that allow a user to interact
    with your application in various ways—for example, a commonly used control is
    the push button. A layout manager automatically positions components within a
    container. determined by a combination of the controls it contains and the layout
    manager used to position them. In addition to the controls, a frame window can
    also include a standard-style menu bar. Each entry in a menu bar activates a drop-down
    of menus from which the user can choose. A menu bar is always positioned at the
    top of a window. Although different in appearance, menu bars are handled in the
    same way as the other controls. While it is possible to manually position components
    within a window, doing so is quite tedious. The layout manager automates this
    displays components in a container using left-to-right, top-to-bottom organization.
    Once the controls have been covered, the layout managers will be examined. There
    you will see how better manage the positioning of your controls.


