    This statements demonstrate three catch blocks, but you can have any number of
    them after a single try. If an exception occurs in the protected code, the exception
    is thrown to the first catch block in the list. If the data type of the exception
    thrown matches ExceptionType1, it gets caught. If not, the exception passes down
    to the second catch statement. This continues until the exception is either caught
    or falls through all catches, in which case the current method stops execution
    and the exception is thrown down to the method on the call stack.


