    # Text Tables Using Fixed-Width Fonts


    Any text formatted with the <pre> tag retains the spaces, tabs and blank lines
    that are otherwise ignored by HTML. The <pre> tag displays text using fixed-width
    font, allowing easy alignment of text characters in columns. Here follows a simple
    text table and its code. Notice that they are nearly identical.


    | Table |

