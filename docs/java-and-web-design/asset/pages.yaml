  md: '# Simple


    According to Sun, Java language is simple because:


    +   - Syntax is based on C++ (so easier for programmers to learn it after C++).

    - Removed many confusing and/ rarely-used features for example, explicit pointers,
    operator overloading etc.

    - No need to remove unferenced objects because there is Automatic Garbage Collection
    in java.


    # Object-oriented


    Object-oriented means we organize our software as a combination of different types
    of objects that incorporates both data and behavior.


    Object-oriented programming (OOPs) is a methodology that simplifies software development
    and maintenance by providing some rules.


    Basic concepts of OOPs are:


    +   - Object

    - Class

    - Inheritance

    - Polymorphism

    - Abstraction

    - Encapsulation


    # Platform Independent


