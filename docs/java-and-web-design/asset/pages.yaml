  md: '# Java and Web Design


    interface that is portable across different servers (because it is proprietary
    to Security Filter rather than the server implementation). Security Filter also
    supports adapter classes to adapt a proprietary realm implementation from any
    server to the Security Filter realm interface, which will get you up and running
    quickly and makes your realm portable across different server implementations.
    A Tomcat/Catalina realm adapter is included in the package now, adapters for other
    realm implementations are planned, and it is easy to implement your own by following
    the Catalina realm adapter as an example.


    # Current Requirements and Limitations of Security Filter:


    +   * SecurityFilter requires a Servlet 2.3 compliant server environment. This
    includes Tomcat 4+, WebLogic 6.1+, and many other servers. Consult your server
    documentation to check for Servlet 2.3 support.

    * SecurityFilter only supports FORM (FORM authentication is supported in all release
    versions of SecurityFilter) and BASIC (not quite yet -- BASIC authentication will
    be supported in an upcoming 1.1 release) authentication. These are the most popular
    types of login configurations as they support an application-specific login form
    page and the pop-up window for login.

    * <user-data-constraint> elements are allowed in the SecurityFilter configuration,
    but they are not currently supported. <user-data-constraint> elements are used
    to identify what web resources are to be accessed only via HTTPS. Support for
    these constraints is expected to be available.

    * When SecurityFilter is used, a user''s Principal will not automatically be propagated
    to EJB calls. If this is a requirement for your application, you may not be able
    to use SecurityFilter.

    * Single Sign-On across several web application contexts is not currently supported.
    We are investigating possible solutions for this configuration.


    The purpose of the security filter is to enforce authorization policies for the
    web application. In other words, the security filter makes sure that users only
    access the resources for which they are authorized.


    A servlet filter is a component that is configured to pre-process and post-process
    requests that are processed by servlets. By placing security code in a servlet
    filter, we separate security-related code from code that implements application
    functionality, which adheres to the separation of concerns principle.


