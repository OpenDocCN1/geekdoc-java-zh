  md: '# 6.6 SECURITY FILTER


    Security Filter is a Java Servlet Filter that mimics container managed security.
    It looks just like container managed security to your app, and you can call request.getRemoteUser(),
    request.isInRole(), and request.getUserPrincipal() and get valid responses. The
    Security Filter configuration file follows the web.xml standard, which makes it
    easy to switch Security Filter from container managed security, or switch back
    as your requirements or deployment environment details change.


    SecurityFilter is intended for use by Java web application developers. It provides
    robust security and automatic authentication services for web applications. It
    has several important advantages over container managed security that make it
    an ideal solution for single-context, public web sites, or when it is necessary
    or simply desirable to avoid the server configuration hassles and portability
    issues associated with container managed security.


    # Advantages of Security Filter over Container Managed Security:


    +   - Security Filter is intended to be packaged within your web app, including
    your realm implementation and supporting classes. This allows you to deploy your
    app as a single, deployable unit (war file or exported directory structure) with
    no additional configuration of the server environment. In contrast to container
    managed security in which the realm must be added to the server''s classpath (including
    any supporting classes) and configured in the server.

    - Security Filter supports “unsolicited” login requests, and will send the user
    to a destination you have configured upon successful authentication. This allows
    you to have a login form on every page, or simply link directly to your login
    form to authenticate users. With container managed security, the container will
    not process login requests unless the container itself has initiated the authentication
    sequence (i.e. sent the user to the login form) in response to a request for a
    protected resource, which makes it impossible to have a login form on every page
    and complicates implementation of a link to the login form.

    - Each server has its own realm, so your realm implementation will not be portable
    across different servers. Security Filter has a small, simple realm


    > 8 http://securityfilter.sourceforge.net/'
