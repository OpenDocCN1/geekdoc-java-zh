  md: '# Java and Web Design


    # Programming


    Based on a C and C++-based syntax, Java is object-oriented and class-based. Developers
    adopt and use Java because code can run securely on nearly any other platform,
    regardless of the operating system or architecture of the device, as the device
    has a Java Runtime Environment (JRE) installed. The JRE varies depending on the
    specific type of device, that essentially it runs a "virtual" machine, or environment,
    that translates the code into an application or program.


    ![](img/5896385a9e8402477461956f4864a34e_17_0.png)


    Object-oriented programming (OOP) is a programming paradigm based on the concept
    of "objects", which may contain data, in the form of fields, as attributes; and
    code, in the form of procedures, often known as methods.


    # Java and JavaScript


    Although their names are quite similar and they are both used to create dynamic
    tools and games on a Web page, Java and JavaScript are different languages. Java
    is more robust and can be used as the sole programming language for an application,
    while JavaScript is a lightweight scripting language that adds functionality --
    like a java applet -- onto a Web page.


    # Features of Java


    There is many features of java. They are also known as java buzzwords. The Java
    Features given below are simple and easy to understand.


    +   - Simple

    - Object-Oriented

    - Platform independent

    - Secured

    - Robust

    - Architecture neutral

    - Portable

    - Dynamic

    - Interpreted

    - High Performance

    - Multithreaded

    - Distributed'
  merge: -1
