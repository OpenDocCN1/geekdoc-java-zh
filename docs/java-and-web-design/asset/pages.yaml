    # 5.1.3. Create Table


    Tables are one of the primary design tools for HTML documents. Tables serve several
    functions. Tables allow for greater control over page layout, allowing creation
    of visually interesting pages. Pages with grid or columnar layout use tables,
    often invisible, to control page layout. Tables are also used to set apart sections
    of documents, such as sidebars, navigation bars, or framing their titles and captions.
    There are some differences in table support by browsers, with HTML 4.0 enhancement
    tags, but tables are sufficiently supported to justify their position as the most
    popular design method.


    There are two ways to make a table in an HTML document. Text tables are created
    using predefined fonts. In HTML a series of spaces, or empty lines in the code
    will be condensed to one space unless the format is formatted to <pre> preformatted,
    or typewriter font. This is why there is usually one space between sentences in
    Web documents. To use spaces, or more, in a row without the <pre> format a non-breaking
    space(&nbsp;) needs to be added. Preformatted fonts are fixed-width fonts and,
    unlike proportional fonts, use the same amount of space for each character irrespective
    of its actual width, allowing control of column alignment. Text-based browsers
    can only display text tables.


    Graphical tables are created using special tags, as described below. Graphical
    tables allow use of special attributes, such as borders, colors, shading, backgrounds,
    frames, spacing and padding, attributes that control the visual aspects of the
    table. Attributes of the table, of its rows control the height and width, alignments,
    spanning of rows and/or columns. Creating tables can be a complex design problem,
    and, It is advisable to draw out the design before beginning coding.


