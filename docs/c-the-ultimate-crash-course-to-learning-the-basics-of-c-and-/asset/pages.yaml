  md: '# Chapter 1 – WRITING YOUR FIRST C++ PROGRAM


    Before we write our first program in C++, you are going to need to download the
    software called Microsoft Visual Studio, which allows you to write, compile and
    execute commands and programs written in C++ code language. It is also an excellent
    program which can be used to debug and edit your program should it need changes
    or if something goes wrong.


    ![](img/aab02e7b5f84ac435fc43037356d6c1f_11_0.png)


    As your first program, we are going to explore the basic “Hello World” program
    which is a must for everybody who is wanting to learn how to write and code C++.
    The Hello World program will demonstrate the absolute bare essentials that nearly
    every program written in C++ will share. It does not matter how simple, or complex
    a program is, it will still require the following few lines of very basic code.


    The first step you need to do, is open Microsoft Visual Studio and create a new
    project. We will call this project “Hello World” or “First Program” if you prefer.
    Don’t worry if you do not understand the following lines of text just yet, as
    we have a closer look at them in a few moments and explore them deeper in the
    chapters which are to follow.'
  merge: -1
  pgno: 11
- img_proc: true
  md: 'Firstly, you should write the following lines in Microsoft Visual Studio:


    ```

    #include <iostream>

    using namespace std;

    ```


    These first lines are basically what we call a “pre-processor directive”, or in
    other words, lettering the code to follow that we are going to start a program.
    The letters “i” and “o” in the word <iostream> stand for both input and output,
    which is required in every C++ program that is written. The final line, “using
    namespace std”, means that we are telling the compiler that we will be using the
    standard library (a library in this case meaning the type of commands we are using
    and writing). In other words, we tell the compiler (Microsoft Visual Studio),
    to basically “include” the library called “iostream”. This library is what holds
    all of our functions that we use, but more on that in a minute.


    The next lines that you should write:


    ```

    int main () {

    ```


    These two lines tell the program to start. Basically means that we are showing
    the “start” of the program to the compiler. The { is very important here, and
    is known as a “Scope Bracket”. It is important, and will become very important
    as we continue to write this program and any others that exist, because every
    single line of code you write must end in a ; { / }.


    The next lines that you should write:


    ```

    cout <<"Hello World"<<endl;

    ```


    This line is very simple. The word “cout” is a function which we are using from
    the iostream library, and simply works as a print statement. In other words, by
    using the cout function, you are telling the program that you would like to print
    (display on screen) the words “Hello World”. Feel free to change these words to
    whatever you want. The line ends in “endl”, which is where we are basically telling
    the program that we are going to be writing another line after this one. It is
    basically the same as pressing the Enter key on your computer keyboard to write
    another line.'
  merge: -1
  pgno: 12
- img_proc: true
  md: 'The second last line of code should be:


    return 0;


    This is where we are telling our compiler to “return” back to the command prompt
    (which we will discuss later in more depth) if the program ran smoothly without
    any problems.


    Finally, the last line of code should be written as:


    } //end main


    The } is basically the closing bracket. As we discussed above, all commands should
    end in a Scope Bracket which tells the compiler that the command is finished (for
    that line, or for the whole program). The last part, “end main” is a function
    that we call a “comment”. These are what we use to keep track of what we are using
    and writing in the program. In the case where we are writing a very long program,
    the final statement is basically the closing bracket to the function that we started
    with, int main(), which will keep the whole program together as one entity.


    Now, our program should look like this:


    ```

    #include <iostream>

    using namespace std;

    int main() {


    cout <<"Hello World"<<endl;


    return 0;

    } //end main

    ```


    When now we save our program and then run it, it will display the words “Hello
    World”. Try again, except this time I want you to write something else and what
    happens.


    In the next chapter we will start to look at some of the major features and functions
    of a program.'
