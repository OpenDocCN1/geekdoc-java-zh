  md: '# How to Run Programs


    Once Python is all set up and you know how to use the interpreter, how are you
    going to run programs in python? The simplest way to run a program is to type
    ‘python helloworld.py’. If your executable is set on a .py, then the file can
    be run by name without having to execute in the python first.


    Now, set the execute bit with a ‘chmod’ command, such as this:


    +   - chmod +x hello.py


    Now you’re able to run your program as ./hello.py.


    # Text Editor


    Before you’re able to write a python program in a source file, you need an editor
    to write that source file. When it comes to programming python, there are many
    editors you can choose from. Just pick one that will work with your platform.
    The editor you choose is going to depend on your experience with computers, what
    you have to do, and what platform you need in order to do it.


    If you’re a beginner, choose something like Notepad ++ or TextEdit.'
