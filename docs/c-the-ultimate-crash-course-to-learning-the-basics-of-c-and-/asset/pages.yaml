    # Chapter 4 – CONDITIONS and FUNCTIONS


    Conditionals are what gives the program choice to choose what it would like to
    use. This doesn''t mean that the program can think for itself and make decisions
    like a human being, but rather it makes a choice based only on the options of
    which you write for it to choose from. The makes programs written in C++ a huge
    amount of versatility, and stops you from designing a program which only keeps
    the same thing over and over again. Imagine if our “Hello World” program did nothing
    but saying “Hello World”? Or if our variable did nothing but give us the answer
    “4” all of the time? These choices are smaller programs within our larger program
    which we call “functions”. What means is that in order for a program to complete
    its task, it must run through a series of smaller tasks and choices (conditions)
    in order to output a result. To put simply, everything that we tell the program
    to do as a whole is a function.'
