  md: '# Chapter Thirteen - How to Use Dictionaries in Python


    You can use the curly brackets, {}, to make a dictionary in Python. You can use
    the square brackets, [], to index the dictionary. Separate the key and the value
    with some colons and with commas between the pairs. Keys have to be quoted just
    like with lists, and you can print out the dictionary by printing the reference
    to the dictionary.


    A dictionary will map a set of objects (keys) to another set of objects (values).
    A python dictionary will map unique keys to values. Dictionaries are changeable
    or mutable in python. The values keys point to are able to be any Python value.
    They are unordered, so the order the keys are added does not reflect with the
    order they might be reported back as.


    Let''s look at how to create a new dictionary in python.


    In order to make a dictionary, you first have to start with an empty one. Use:


    ```

    >>>mydict={}

    ```'
