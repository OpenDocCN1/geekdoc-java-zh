  md: '# Chapter 3 – OPERATORS


    Now that we are familiar in using variables, we can expand on our program and
    start using what are called “operators”. Operators are basically symbols which
    tell the compiler (Microsoft Visual Studio), to use mathematics or logic to solve
    the problems that we have written in code. There are 6 types of operators which
    C++ will most commonly use. These are:


    +   1. Arithmetic Operators.

    2. Relational Operators.

    3. Logical Operators.

    4. Bitwise Operators.

    5. Assignment Operators.

    6. Misc Operators.


    We will look at only the main and most important types of operators and define
    what each of the most commonly used symbol in each mean and what they do.


    # ARITHMETIC OPERATORS'
