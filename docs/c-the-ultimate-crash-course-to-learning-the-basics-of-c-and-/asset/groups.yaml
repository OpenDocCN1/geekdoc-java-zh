    # Introduction


    A C++ program is simply a text file which contains a sequence of commands using
    specific C++ text. We can call this text file the source file, and it will normally
    end in a .CPP extension (just as an audio file ends in .MP3 or a PDF document
    ends in .PDF).


    The purpose of writing a C++ program is to put together a specific sequence of
    C++ commands which will be converted by the computer into machine-language which
    will perform whatever task that we want done. This conversion process is called
    compiling which is performed by the compiler. In addition, the code that we write
    must be written to include both setup and tear down instructions in a process
    which is called linking. Together, the process of compiling and linking is called
    building, which builds our code into a machine-executable .EXE file of which the
    computer can run as a program that it understands.


    In order to write a program in C++, you will need only two things — an editor
    to write the code and the .CPP file, and a compiler which will convert the code
    (the source file) into a machine-executable file which will do the tasks that
    we have programmed it to do (such as open a file, play a video, print text on
    the screen, and so on).


    This book will use examples for you to follow along with Microsoft Visual Studio
    – the perfect companion to both the beginner and more advanced C++ programmer.'
