    # Chapter 2 – EXPANDING YOUR PROGRAM: VARIABLES


    The most important part of C++ code is a variable. You can look at these as if
    they were small storage boxes where we can store things for later use by the program
    – especially numbers. The term and use of these variables comes from mathematics.
    You should be familiar with something like this:


    ```

    x = 1

    ```


    This means that x is equal to the number 1. The statement is also saying that
    wherever this letter x appears, it will be worth the number 1. In essence, the
    letter x is holding or storing the number 1 until it needs to be used in a statement
    or algorithm. Variables work exactly the same way in C++, except for the fact
    that we will always include a scope bracket at the end to imply and tell the program
    that it is the end of a function. For example:


    ```

    x = 1;

    ```


    From this point on, wherever we use the letter x in the program, it will be recognised
    as the number 1. But how would we declare variables? Generally we are not going
    to just use one variable when it would be much easier to just write the number.
    Lets look at an example from algebra that you might see in a more advanced level
    of mathematics:'
