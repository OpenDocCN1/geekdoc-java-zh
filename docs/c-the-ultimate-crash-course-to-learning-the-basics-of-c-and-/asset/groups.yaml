    \ else who has already done it!\n\nSo the main reasons why you should learn Python\
    \ are that it's simple and it's easy for you to collaborate with others in order\
    \ to hone your skills. So let's get started!\n\n# Chapter One – Setting up Python\n\
    \nWhen it comes to programming in python, the first thing you should know is that\
