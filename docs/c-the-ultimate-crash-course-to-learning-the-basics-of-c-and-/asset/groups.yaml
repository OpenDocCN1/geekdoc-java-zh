    \ 最常用的运算符有 6 种。这些是：\n\n1. 算术运算符。\n2. 关系运算符。\n3. 逻辑运算符。\n4. 位 运算符。\n5. 赋值运算符。\n\
    6. 杂项运算符。\n\n## 算术运算符\n\n让我们假设 A 等于 10，B 等于 20。我们可以使用以下运算符来实现：\n\n| 运算符 | 作用 |\
    \ 示例使用 |\n| :--- | :--- | :--- |\n| + | 相加 | | |\n| - | 减去 | | |\n| * | 乘法 | |\
    \ |\n| / | 除法 | | |\n| % | 取模 | | |\n| ++ | 整数加1 | | |\n| -- | 整数减1 | | |\n\n\
    ## 关系运算符\n\n使用相同的变量，我们还可以使用以下：\n\n| 运算符 | 作用 | 示例使用 |\n| :--- | :--- | :--- |\n\
    | != | 不等于 | | |\n| > | 大于 | | |\n| < | 小于 | | |\n| >= | 大于等于 | | |\n| <= | 小于等于\
    \ | | |\n| == | 等于 | | |\n\n## 条件与函数\n\n条件是为程序提供选择的机制。这并不意味着程序可以像人类一样思考并做决策，而是根据你为其提供的选项进行选择。这使得\
    \ C++ 程序具有极大的灵活性，并防止程序只重复执行相同的内容。想象一下我们的“Hello World”程序除了说“Hello World”之外什么都不做？或者我们的变量只给我们答案“4”？这些选择是大程序中的小型程序，我们称之为“函数”（functions）。意思是，为了让程序完成任务，必须运行一系列小任务和选择（条件）以输出结果。简单来说，我们告诉程序做的整体就是一个函数。\n\
    \n为了研究条件，给程序提供选择，我们将使用如下语法：\n\n```cpp\nif (在此处输入条件)\n{\n    在此处插入我们的程序供程序运行\n\
    }\n```\n\n这基本上是在说，“如果发生这种情况，就执行此”。你应该熟悉 IF、THEN、AND、OR 等基础术语，这些是基础数学和解决技能。然而，如果是在我们放置条件的括号内，程序可以选择是否执行该条件。例如，如果我们有\
    \ x、y 和 z 三个变量，我们首先需要程序声明它们的值。然而，为了开始将一些运算符引入方程，假设变量“x”大于变量“y”。\n\n我们的代码看起来像这样：\n\
    \n```cpp\nint x,y,z;\n\ncin>>x;\ncin>>y;\n\nif(x>y)\n{\n    z = x+y;\n    cout<<z;\n\
    }\n```\n\n一旦我们声明了变量 x 和 y 的值，程序将确定“x”确实大于“y”。如果程序发现这是真的，那么未声明的变量“z”将被声明为 x 和 y\
    \ 之和，然后给我们给出答案。然而，如果程序发现 x 不大于我们的新变量 z，则什么都不会发生。\n\n这就是我们赋予程序在面对时它可以做什么的选择。\n\n"
