    ```\n\n# 第 9 章 – 类与对象\n\n现在既然我们已经学习了 C++ 编程的基础知识，是时候来看一些稍微高级的内容了。类是我们所谓的“面向对象编程”的一部分。这允许我们在日常生活中通过对象来使用程序。对象可以被定义为日常生活中使用的任何东西——例如汽车、电脑、手机等。正如我们应该学过的，程序是由许多非常小的部分组成的，这些部分共同工作以便汽车运行。其中一些组件是可以更改的，就像汽车是由许多非常小的部分组成的一样，例如开关汽车灯。而其他一些不能更改，这通过我们所谓的“私有”（private）和“公共”（public）变量来区分，换句话说，就是你被允许修改的内容和你不被允许修改的内容（我们稍后会看这一点）。\n\
    \n在学习 C++ 时，类处于稍微高级的水平，因为它们涉及的内容更多。然而，学习它们是非常巨大的回报，因为这将允许我们能够创建和开发可以在日常生活中使用的程序。它们还允许代码复用并将其应用于不同的场景。例如，足球队中的每位球员都有名字、年龄和收入，但这些这些对于每位球员来说都是不同的。在这种情况下，代码将创建类的属性，简单来说每个球员的名字、年龄和收入。\n\
    \n为了将其写成一个示例，我们球员信息的代码如下：\n\n## Class Player\n\n```cpp\n{\n  string name;\n  string\
    \ age;\n  double income;\n}\n```\n\n我们的玩家类现在有了结构。从现在起，每当我们为每个个体玩家的每个变量声明一个值时，我们都会创建一个新记录，或者说存在于\
    \ `Class Player` 中的一个新对象。每个对象将包含一个名字、年龄和收入。为了声明每个 `Player` 类型的变量，我们将使用声明任何其他变量相同的方法：\n\
    \n```cpp\nPlayer player1;\nPlayer player2;\nPlayer player3;\n```\n\n一旦我们像第一个示例那样创建了一个类，我们就可以像之前使用过的任何其他数据类型示例一样使用它。然而，我们还想限制程序在这些类结构中访问和操作的内容。某些对象或类必须保持不变（私有类），而某些是可以更改的（公共）。例如，只包含名字、年龄和收入的类必须保持私有，因为这是一个常数。另一方面，我们为每个个体声明的变量是公的，因为这些信息不是常数。\n\
    \n为了在代码中看到这一点，我们将写如下：\n\n```cpp\nclass Player\n{\nprivate:\n  string name;\n \
    \ string age;\n  double income;\n\npublic:\n  Player();\n}\n```\n\n执行上述代码将阻止程序对名字、年龄和收入的私有类进行更改，但允许它对个体玩家信息的公共类进行更改。我们在声明私有和公共之后使用\
    \ `:`，是因为它们告诉程序之后的所有内容都被视为该类类型。\n\n当我们实际输入和操作公共数据时，我们使用所谓的“构造函数”（constructors）和“析构函数”（destructors）。每当我们声明一个类对象时，就会执行构造函数执行它被程序好的任何操作。要启动构造函数，我们将写如下代码：\n\
    \n```cpp\nPlayer();\nPlayer(string,int,double);\n```\n\n这意味着我们已经告诉构造函数使用我们的名字、年龄和收入参数。第一个执行的构造函数没有任何要设置。然而，我们仍然需要告诉构造函数做什么，所以我们将写：\n\
    \n```cpp\nPlayer()\n{\n  name = \"\";\n  age = 0;\n  income = 0;\n}\n```\n\n```cpp\n\
    Player(string n,int a, double i)\n{\n  name = n;\n  age = a;\n  income = i;\n\
    }\n```\n\n我们还需要查看析构函数以及在程序内部的作用。析构函数与构造函数相反，它们移除而不是创建。执行析构函数的语法是 `~` 加上你的类名。例如：\n\
    \n```cpp\n~Player();\n```\n\n这就是 C++ 中类和对象的get。当然，我们还有很多可以查看的内容，但那范围超出了初学者的领域。\n\
    \n# 总结\n\n总而言之，通过阅读这本书，你现在应该拥有理解 C++ 编程语言基础所需的技能，并且现在应该能够轻易地编写你自己的简单 C++ 程序。只需记住，虽然从上看每个程序看起来复杂且充满了许多代码行，但它仅仅是一组组成整体的较小程序。只需要一个一个专注于处理这些较小的程序，你就没问题。\n\
    \n这本书还向你展示了我们在 C++ 中制作程序时可以使用的许多不同类型的代码，这些知识将让你能够用简单的编程技能给家人朋友留下印象，或者可能允许你制作一些日常生活中使用的基础程序。你现在应该掌握了在通往高级或专业\
    \ C++ 程序员的道路上进入更高级主题的基础知识。\n\n在探索奇妙且兴奋的计算机编程之旅中，尽可能将这本书作为指南或参考，并始终记住，一旦掌握了基础知识，C++\
    \ 是很容易学习的。\n\n"
