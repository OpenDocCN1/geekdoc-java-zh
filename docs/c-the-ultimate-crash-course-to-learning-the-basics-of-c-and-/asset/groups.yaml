    still a very important part of the structure of more complex programs.


    Let''s start looking at them by looking at a syntax of how we would declare a
    pointer:


    double *p;


    In this statement, we are saying that we have a pointer called “p” which can have
    an address or location of floating point values. The word “double” is our new
    datatype, and the reason that there is an * before p is because this is how we
    declare a pointer.


    In code, we would declare an address which a pointer points to by writing the
    following:


    p=&x;


    The letter “p” will now store the location of “x” (which is a variable in this
    case). In simpler terms, p is pointing to x. We use “&” before the variable in
    order to assign it an address (but not a value). P will point to x, but x will
    not have a value. To give x a value, we will need to make changes to p, and can
    write code to do so like this:


    *p=25.3;


    This now means that x equals 25.3 by making p a pointer, and by pointing p to
    x. Since p holds x, x is now valued at 25.3 (whatever value p is). If we were
    to write a complete program which uses a pointer and assigns it a value, we could
    write the following:'
