    # 介绍


    一个 C++ 程序仅仅是一个包含一系列使用特定 C++ 文本命令的文本文件。我们可以称此文本文件为源码，它通常以 .CPP 扩展名结尾（就像音频文件以 .MP3
    结尾或 PDF 文档以 .PDF 结尾一样）。


    编写 C++ 程序的目的是将一组特定的 C++ 命令组合在一起，这些命令将被计算机转换为机器语言，以执行我们想要完成的任何任务。这个转换过程被称为“编译”，由编译器完成。此外，我们编写的代码必须包含设置和拆毁指令，这个过程被称为“链接”。将编译和链接的过程合称为“构建”，它将我们的代码构建成机器可执行的
    .EXE 文件，计算机可以将其作为它理解的程序来运行。


    为了在 C++ 中编写程序，你只需要两个东西——一个用于编写代码的编辑器和 .CPP 文件，以及一个可以将代码（源码）转换为机器可执行文件的编译器，该文件将执行我们为它程序设的任务（如打开文件、播放视频、在屏幕上打印文本等）。


    此本书将使用示例供你参考 Microsoft Visual Studio —— 完美的工具。


