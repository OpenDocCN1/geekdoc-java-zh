    \n# 第 5 章 – 循环 (LOOPS)\n\n我们已经学习了基础编程、变量、运算符和条件。现在我们必须看看循环。循环是编程中非常重要的一部分，因为它们让我们的程序能够按照你指定的次数重复运行代码行。你可能认为反复执行执行相同的任务是毫无意义且没用的，但当我们查看接下来的章节时，循环背后的意义对你来说将变得非常清晰。\n\
    \n让我们来看程序中的以下几行代码。\n\n```cpp\n#include <iostream>\n\nusing namespace std;\n\n\
    int main()\n{\n  cout<<\"1\"<<endl;\n  cout<<\"2\"<<endl;\n  cout<<\"3\"<<endl;\n\
    \  cout<<\"4\"<<endl;\n  cout<<\"5\"<<endl;\n  cout<<\"6\"<<endl;\n  cout<<\"\
    7\"<<endl;\n  cout<<\"8\"<<endl;\n  cout<<\"9\"<<endl;\n  cout<<\"10\"<<endl;\n\
    \n  return 0;\n}\n```\n\n你可能发现，根据我们目前所学的，这个简单的程序将为我们显示从 1 到 10 的数字。你可能猜如果你在程序中包含很多这样的行，任务将变得非常无聊和单调。你能想象如果你必须设计一个显示\
    \ 1 到 1000 数字的程序吗？\n\n幸运的是，有一个解决方案可以让我们的工作变得简单得多。我们可以创建一个语法，将上面的例子变成一行简单的代码。这种语法是一个循环，看起来如下：\n\
    \n`for (初始化; 条件; 增//减);`\n\n这基本上是说：“对于以下，执行此操作”。初始化是程序的开始（你现在应该已经知道了），条件是我们给程序去执行的任何选择，最后，增和减代表了当程序循环继续运行时，我们想要从起始数字中增加或减少的数值。\n\
    \n下面与上面的例子相同，但这次我们包含了一个循环。\n\n```cpp\n#include <iostream>\n\nusing namespace std;\n\
    \nint main()\n{\nint x;\n  for (x=0; x<=10; x++) {\n    cout<<x;\n  }\n  return\
    \ 0;\n}\n```\n\n这个程序的执行方式与上面的例子完全相同，用于打印数字，但在这一个中，我们不需要为程序指定 1 到 10 之间的每一个数字。\n\
    \n让这组新代码更有效的是，我们可以看到我们使用了 `for(x=0; x<=10; x++)`，这就是我们在上面看到的 `(初始化); 条件; 增//减`\
