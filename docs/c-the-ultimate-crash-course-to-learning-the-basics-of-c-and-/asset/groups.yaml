    \ 16:23:35)\n[GCC 4.2.1]\n>>> \n```\n\nCongratulations! You just edited your first\
    \ program! Now that you know how edit a program let’s take a look at variables\
    \ you can use in your programs.\n\n# Chapter Two – Variables\n\nVariables the\
    \ characters you're able to use in Python. You can use any letter, every number,\
    \ and every special character, but you cannot start with a number. White spaces\
    \ and the signs with the special meanings like + and – are not allowed.\n\nEither\
    \ capital or lowercase letters are allowed, but most prefer to use lowercase letters\
