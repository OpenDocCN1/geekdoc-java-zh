  md: "# 5 Structure of an Interface\n\n```\npackage com.abd.java.it;\n\n// This is\
    \ an interface not specified access modifier.\n// Its access modifier is default.\n\
    // Only classes in the same package can implements this interface.\ninterface\
    \ NoAccessModifierInterface {\n\n}\n```\n\n# CanMove.java\n\n```\npackage com.abd.java.it;\n\
    \n// This interface defines a standard,\n// about things capable of moving.\n\
    public interface CanMove {\n\n    // The methods in Interface are always abstract\
    \ and public.\n    public abstract void run();\n\n    // Even if you do not specify\
    \ 'public abstract', java always understands.\n    void back();\n\n    // Velocity.\n\
    \    public int getVelocity();\n\n}\n```\n\n# CanDrink.java\n\n```\npackage com.abd.java.it;\n\
    \n// This interface defines a standard,\n// about things capable of drinking.\n\
    public interface CanDrink {\n\n    // Fields in Interface are always 'public static\
    \ final'.\n    // Whether you declare it or not.\n    public static final String\
    \ PEPSI = \"PEPSI\";\n    final String NUMBER_ONE = \"NUMBER ONE\";\n    String\
    \ SEVENUP = \"SEVEN UP\";\n\n    public void drink();\n\n}\n```"
