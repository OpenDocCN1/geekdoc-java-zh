    # 4 char


    Although "char" is the first four characters of the "Character" term, the char
    type in Java is used to store non-negative integers with the two-byte size. It
    is also used to represent for a Unicode character in nature, each character corresponds
    to a specific number. (This number is understood as the code of character.)


    # 5 short


    short is data type for the purpose of representing a two-byte integer (16 bits),
    including negative integer.


    The smallest value is -32,768 (-2^15) and the largest value is 32,767 (2^15-1).


    Default value is 0.


    # 6 int


    int data type is used to represent an integer with the size of 4 bytes (32 bits).


    The smallest value: -2,147,483,648 (-2^31).


    The largest value: 2,147,483,647 (2^31 -1)


    Default value: 0.


