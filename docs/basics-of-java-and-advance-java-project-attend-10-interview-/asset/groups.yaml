    \n## 第1 章：引言\n\n- 1 Java 虚拟机 ( JVM )\n\nJava 是关于如何编写一种可以在不同平台上运行的程序。**一次编写，到处运行**。\n\
    \n在 Java 诞生之前，在 Windows 操作系统上编写并编译为机器码的程序由于许多差异无法在 Linux 操作系统上运行。\n\n太阳系统公司（Sun\
    \ Microsystems）工程师创建了 JVM（Java 虚拟机），安装在 Windows、Linux、Mac 等不同平台上。\n\nJVM 编写的程序被编译成字节码（Byte\
    \ Code），一种可以在 JVM 环境中运行的特殊代码。JVM 帮助将字节码翻译成宿主机的代码。这就是为什么 Java 可以在不同平台上运行的原理。\n\n\
    # JDK 和 JRE\n\n## JRE ( Java 运行环境 )\n\n![](img/687999f111d1584abe7fc92b1c74ca2a_4_2.png)\n\
    \nJRE 是 Java Runtime Environment 的缩写，包含了 JVM（Java 虚拟机）和许多支持执行 Java 语言编写的程序的 Java\
    \ 类。\n\n# JDK ( Java 开发工具包 )\n\n![](img/687999f111d1584abe7fc92b1c74ca2a_5_1.png)\n\
    \nJDK 代表 Java Development Kit，它由两个部分组成：JRE 和 Java 开发工具。\n\nJDK 对程序员来说是必须的，因为 Java\
    \ 开发工具为 Java 应用程序开发提供了工具，例如 Javac，它可以将开发者的源代码编译成字节码等，然后在开发过程中使用 JRE 运行应用程序。\n\n\
