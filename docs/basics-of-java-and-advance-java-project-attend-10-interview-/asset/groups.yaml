    ## Hospital System (Working Flow)


    Step 1: Patient → Doctor → Appointment

    Step 2: Doctor → Appointment → Treatment

    Step 3: Patient → See Treatment

    Step 4: Doctor → update start end

    Step 5: Patient → See Status


    ## Design Document of Hospital System


    ### 1. Hospital Referral Features


    #### 1. Overall Function of the System

    - Operator Level classification when the System is to be authenticated.

    - Individual is responsible for the Patient''s Medical Records; only the Patient
    and anyone including the Doctor are authorized to access.


    #### 2. Patient''s Role

    - To Register as a User, set your Name and Password.

    - Based on the Query if you specify the day, full volume random returns to the
    Patient.

    - You can have an Appointment, view or make an Appointment, query the Medical
    Information.


    ### 3. Doctor Role

    - You can view the Reservation of the Patient.

    - You can create Patient Records.

    - The Patient''s Medical Record to be Modified.


    ### 4. Administrator Role

    - You can Add and Delete Accounts.


    ### 2. Design Process


    From the demand analysis, separation of the Major entities:

    - doctor

    - patient

    - Medical Record (history)

    - Reservation (queue)

    - administrator

    - appointment (maximum number of currently available appointments)


