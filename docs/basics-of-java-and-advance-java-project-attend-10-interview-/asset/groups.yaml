    ```\n\npublic class Util {\n    /**\n     * Doctors reservation information string\
    \ handling\n     * Parameters information\n     * - dayPattern Reservation information\
    \ (14 integers, separated by commas or spaces)\n     *\n     * Return value -\
    \ an integer array of length 14\n     */\n    public static int[] parseSpDays(String\
    \ dayPattern)\n    throws NumberFormatException{\n        int[] spDays=new int[14];\n\
    \        StringTokenizer token=new StringTokenizer(dayPattern.trim(), \", \\ \"\
    );\n        if(token.countTokens() != 14)\n            throw new AppointmentException();\n\
