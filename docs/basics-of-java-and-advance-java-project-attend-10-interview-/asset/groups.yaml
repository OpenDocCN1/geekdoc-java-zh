    - 2 Abstract Class\n- 3 Abstract class, the examples\n- 4 Overview of the interface\n\
    - 5 Structure of an Interface\n- 6 Class implements Interface\n\n# Introduction\n\
    \nLearning Java step by step.\n\n## Chapter 1 : Introduction\n\n- 1 Java Virtual\
    \ Machine ( JVM )\n\nJava is how to write a program that can run on different\
    \ platforms. **Write Once and run Anywhere**\n\nBefore Java was born, a program\
    \ that was written and compiled into a machine code running on Windows operating\
    \ systems would not be able to run on Linux operating systems because of a lot\
    \ of differences.\n\nSun Microsystems engineers had created JVM (Java Virtual\
    \ Machine) to install on different platforms such as Windows, Linux, Mac, etc.\n\
    \nJVM-written programs are compiled into Byte Code, a special code that can run\
    \ in the JVM environment. JVM helps translate Byte Codes into the host machine's\
    \ codes. This is the principle which explains why Java can run on different platforms.\n\
    \n# JDK and JRE\n\n## JRE ( Java Runtime Environment )\n\n![](img/687999f111d1584abe7fc92b1c74ca2a_4_2.png)\n\
    \nJRE is short for Java Runtime Environment, which includes JVM (Java Virtual\
    \ Machine) and a number of Java libraries that support to execute programs written\
    \ in the Java language.\n\n# JDK ( Java Development Kit )\n\n![](img/687999f111d1584abe7fc92b1c74ca2a_5_1.png)\n\
    \nJDK stands for Java Development Kit, which consists of 2 components, JRE and\
    \ Java Development Tools.\n\nJDK is necessary for programmers because Java Development\
    \ Tools provides tools for Java application development, such as Javac which compile\
    \ the developer's source codes into Byte Codes, etc. then uses JRE to run the\
    \ application during the development process.\n\n## Chapter 2 : Data Types in\
    \ java\n\n- 1 Overview of data types\n- 2 byte\n- 3 boolean\n- 4 char\n- 5 short\n\
    - 6 int\n- 7 long\n- 8 float\n- 9 double\n- 10 Reference Types\n\n# Overview of\
    \ data types\n\nAny programming language has a set of data types. Data types are\
    \ basic, and quite similar for all languages. All data types are composed from\
    \ bits.\n\nJava has two types of data types:\n\n- Primitive Types\n- Reference\
    \ Types\n\nThere are 8 primitive data types which are boolean, byte, char, short,\
    \ int, long, float, double.\n\nLogic type: boolean.\n\nInteger types: byte, short,\
    \ char, int, long.\n\nReal number type is also called floating point: float, double.\n\
    \nReference types, which are objects created by classes.\n\n# 2 byte\n\n1 byte\
    \ is composed of 8 consecutive bits in memory. Each bit is a binary number of\
    \ 0 or 1. If it is 0, Java considers it as a positive number. If it is 1, Java\
    \ considers it as a negative number.\n\n# 3 boolean\n\nboolean is the simplest\
    \ data type. It has size of 1 bit. It has 2 values of true and false. The default\
    \ value for boolean type is false.\n\n```java\n// Declare a variable named 'valid',\
    \ data type is boolean\n// The value will be false by default.\nboolean valid;\n\
    ```\n\n```java\n// Declare a variable named 'active', data type is boolean\n//\
    \ Value is true.\nboolean active = true;\n```\n\n# 4 char\n\nAlthough \"char\"\
    \ is the first term, the char type in Java is used to store non-negative integers.\
    \ It is also used to represent Unicode character in nature, each character corresponds\
    \ to a specific number (This number is understood as two bytes).\n\n# 5 short\n\
    \nshort is data type for representing two-byte integer (16 bits), including negative\
    \ integer. The smallest value is -32768 (-2^15) and the largest value is 32767\
    \ (2^15-1). Default value is 0.\n\n# 6 int\n\nint data type is used to represent\
    \ an integer with the size of 4 bytes (32 bits). The smallest value is -2,147,483,648\
    \ (-2^31). The largest value is 2,147,483,647 (2^31-1). Default value is 0.\n\n\
    ## Chapter 3 : if else statement in java\n\n- 1 if statement\n- 2 if - else statement\n\
    - 3 if - else if - else statement\n- 4 Boolean value\n- 5 Operators involved in\
    \ conditional expression\n\n# 1 if statement\n\nThe if statement is the most basic\
    \ of all the control statements. It tells your program to execute a certain section\
    \ of code only if a particular test evaluates to true. Below is the structure\
    \ of if statement:\n\n```java\nif (condition) {\n    // Do something if 'condition'\
    \ is true.\n}\n```\n\nThe above image illustrates the flow of application when\
    \ it meets a if statement.\n\n1 The program checks the condition.\n2. If the condition\
    \ is true, code in the if block will be executed. It then continues executing\
    \ the codes below.\n3. If the condition is false, the program ignores the code\
    \ in the if block and executes code snippets below it.\n\nExample:\nIfExample.java\n\
    \n```java\npackage com.abd.javabasic.controlflow;\npublic class IFExample {\n\
    \    public static void main(String[] args) {\n        // Declare a variable,\
    \ representing your age\n        int age = 30;\n\n        System.out.println(\"\
    Your age: \" + age);\n        // The condition to test is 'age> 20'\n        if\
    \ (age > 20) {\n            System.out.println(\"Okey!\");\n            System.out.println(\"\
    Age is greater than 20\");\n        }\n\n        // The code after the 'if' block.\n\
    \        System.out.println(\"Done!\");\n    }\n}\n```\n\n# Output\n| Your age:\
    \ 30 |\n| Okey! |\n| Age is greater than 20 |\n| Done! |\n\n# 2 if - else statement\n\
    \n```java\nif(condition) {\n  // Do something here\n}\nelse {\n  // Do something\
    \ here\n}\n```\n\nExample:\nIfElseExample.java\n\n```java\npackage com.abd.javabasic.controlflow;\n\
    public class IfElseExample {\n\n  public static void main(String[] args) {\n \
    \   // Declare a variable, representing your age\n    int age = 15;\n\n    System.out.println(\"\
    Your age: \" + age);\n\n    // The condition to test is 'age' > 18\n    if (age\
    \ >= 18) {\n        System.out.println(\"Okey!\");\n        System.out.println(\"\
    You are accepted!\");\n    } else {\n        System.out.println(\"Sorry!\");\n\
    \        System.out.println(\"Age is less than 18\");\n    }\n\n    // The code\
    \ after the 'if' block and 'else' block.\n    System.out.println(\"Done!\");\n\
    \  }\n}\n```\n\n# Output\n| Your age: 15 |\n| Sorry! |\n| Age is less than 18\
    \ |\n| Done! |\n\n# 3 if - else if - else statement\n\nThe structure of an if\
    \ - else if - else statement is:\n\n```java\nif(condition 1) {\n// Do something\
    \ here\n} else if(condition 2) {\n// Do something here\n} else if(condition 3)\
    \ {\n// Do something here\n}\n// Else\nelse {\n```\n"
