    \n# 第3 章：Java 中的 if else 语句\n\n- 1 if 语句\n- 2 if - else 语句\n- 3 if - else if -\
    \ else 语句\n- 4 布尔值\n- 5 条件表达式中涉及的运算符\n\n# 1 if 语句\n\nif 语句是关于控制流最基本的结构。它根据条件来决定是否执行某些代码。\n\
    \nif 语句是关于控制流最基本的结构。\n\n#  if 语句允许执行代码块，，如果条件为真。\n\n```java\nif (condition) {\n\
    \    // Do something if\n}\n```\n\n# 2 if - else 语句\n\nif - else 语句是比 if 语句稍微复杂一点的。它允许你在条件为真时执行一个块，而在条件为假时执行另一个块。\n\
    \nif - else 语句是比 if 语句稍微复杂一点的。它。\n\n```java\nif (condition) {\n    // Do something\
    \ if true\n} else {\n    // Do something if false\n}\n```\n\n# 3 if - else if\
    \ - else 语句\n\nif - else if - else 语句允许你检查多个条件。程序将按顺序检查条件，执行第一个为真的代码块，并跳过其余部分。\n\
    \nif - else if - else 语句允许你检查多个条件。\n\n```java\nif (condition1) {\n    // Executes\
    \ if condition1 is true\n} else if (condition2) {\n    // Executes if condition1\
    \ is false and condition2 is true\n} else {\n    // Executes if none of the above\
    \ conditions are true\n}\n```\n\n# 4 布尔值\n\n布尔值只有两个值：真（true）或假（false）。它是逻辑判断的基础。\n\
    \n布尔值只有两个值：真（true）或假（false）。\n\n```java\nboolean isJavaFun = true;\nboolean isPythonHard\
    \ = false;\n```\n\n# 5 条件表达式中涉及的运算符\n\n运算符用于比较值并产生布尔值。\n\n- 比较运算符：`==`, `!=`,\
    \ `<`, `<=`, `>=`, `>=\n- 逻辑运算符：`&&` (与), `||` (或), `!` (非)\n\n运算符用于比较值并产生布尔值。\n\
    \n# 第4 章：Java 中的 Switch 语句\n\n- 1 switch 语句的结构\n- 2 switch 示例\n- 3 Java 中的 break\
    \ 语句\n\n# 1 switch 语句的结构\n\nswitch 语句允许根据变量的值来执行多个代码块中的一个。\n\n```java\nswitch\
    \ (expression) {\n    case value1:\n        // 代码 for value1\n        break;\n\
    \    case value2:\n        // 代码 for value2\n        break;\n    default:\n  \
    \      // 代码 for no match\n}\n```\n\n# 2 switch 示例\n\n这里有一个如何使用 switch 语句的简单示例。\n\
    \n```java\nint day = 3;\nswitch (day) {\n    case 1:\n        System.out.println(\"\
    Monday\");\n        break;\n    case 2:\n        System.out.println(\"Tuesday\"\
    );\n        break;\n    case 3:\n        System.out.println(\"Wednesday\");\n\
    \        break;\n    default:\n        System.out.println(\"Other day\");\n}\n\
