    # # Chapter 1 :


    Introduction


    +   1 Java Virtual Machine ( JVM )


    Java is how to write a program that can run on different platforms. **Write Once
    and run Anywhere**


    Before Java was born, a program that was written and compiled into a machine code
    running on Windows operating systems would not be able to run on Linux operating
    systems because of a lot of differences.


    ![](img/687999f111d1584abe7fc92b1c74ca2a_3_0.png)'
  - '[PAGE 4]


    ![](img/687999f111d1584abe7fc92b1c74ca2a_4_0.png)


    Sun Microsystems engineers had created JVM (Java Virtual Machine) to install on
    different platforms such as Windows, Linux, Mac, etc.


    ![](img/687999f111d1584abe7fc92b1c74ca2a_4_1.png)


    JVM-written programs are compiled into Byte Code, a special code that can run
    in the JVM environment. JVM helps translate Byte Codes into the host machine''s
    codes. This is the principle which explains why Java can run on different platforms.


    # JDK and JRE


    # JRE ( Java Runtime Enviroument )


    ![](img/687999f111d1584abe7fc92b1c74ca2a_4_2.png)'
  - '[PAGE 5]


    ![](img/687999f111d1584abe7fc92b1c74ca2a_5_0.png)


    JRE is short for Java Runtime Environment, which includes JVM (Java Virtual Machine)
    and a number of Java libraries that support to execute programs written in the
    Java language.


    # JDK ( Java Development Kit )


    ![](img/687999f111d1584abe7fc92b1c74ca2a_5_1.png)


    JDK stands for Java Development Kit, which consists of 2 components, JRE and Java
    Development Tools.


    JDK is necessary for programmers because Java Development Tools provides tools
    for Java application development, such as Javac which compile the developer''s
    source codes into Byte Codes, etc. then uses JRE to run the application during
    the development process.'
