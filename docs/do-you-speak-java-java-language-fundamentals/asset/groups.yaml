  - '[PAGE 145]


    In addition to the above features, over time NIO was enhanced to work together
    with standard I/O streams and to perform file system operations (i.e. manipulation
    of files and directories).


    Here are the main NIO classes and interfaces:


    # Buffer


    The **Buffer** class is used to create buffers and manipulate the buffer’s contents.
    There are sub-classes of the Buffer class to hold different types of primitive
    data – **ByteBuffer**, **CharBuffer**, **IntBuffer**,.


    # Channel


    The **Channel** is actually an **interface** implemented by various channel classes:
    **SocketChannel**, **DatagramChannel**, **SeekableByteChannel**, **FileChannel**,
    etc. It represents a connection to an entity capable of performing I/O operations
    (file, network socket, etc.).


    # Selector


    The **Selector** class allows a single application thread to handle multiple channels.


    (The usage of the **Selector** class is beyond the scope of this book.)


    # Files


    The **Files** class provides methods to operate on files and directories. It can
    also open standard byte streams (i.e. **InputStream** and **OutputStream**) for
    reading from or writing to a file.


    The first example illustrates the usage of **Buffer**, **Channel**, and **Files**
    for passing unformatted data (bytes) between the application program and a disk
    file via a blocking channel.'
