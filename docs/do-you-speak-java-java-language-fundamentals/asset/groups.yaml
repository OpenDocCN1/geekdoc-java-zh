- md: "\n# Passing Generic Classes as Parameters\n\nObjects of generic classes can\
    \ be passed as parameters to methods, in the same way as other Java objects:\n\
    \n```java\nclass GenericClass <T> { ... }\npublic void myMethod(GenericClass g)\
    \ { ... }\nGenericClass<A> a = new GenericClass<A>();\nGenericClass<B> b = new\
    \ GenericClass<B>();\n```\n\n```java\nmyMethod(a);\nmyMethod(b);\n```\n\nAs you\
    \ see, myMethod() can accept any object of type GenericClass regardless of the\
    \ type-variable T in creating these objects. We can add some type safety checking\
    \ to the process by specifying restrictions on the input parameter of myMethod().\
    \ This is accomplished with the help of the wildcard parameter ?. The example\
    \ below demonstrates the usage of the ?> parameter in method declaration:\n\n\
    ```java\nabstract class AB { ... }\nclass A extends AB { ... }\nclass B extends\
    \ AB { ... }\n...\nclass G <T extends AB> extends AB { ... }\n```\n\n```java\n\
    public void myMethod(G<?> g) { ... }\n...\npublic void myMethod(G<? extends AB>\
    \ g) { ... }\n...\npublic void myMethod(G<? super B> g) { ... }\n```\n\nIn this\
    \ example <? extends AB> sets the upper boundary for passing object references,\
    \ and <? super B> sets the lower boundary.\n\n# Generic Interfaces\n\nGeneric\
    \ interfaces are declared in a way similar to the declaration of generic classes,\
    \ for example:\n\n```java\ninterface GenericInterface <T> {\n  public void myID(T\
    \ id);\n}\n```\n\nThe type-variable(s) in the interface declaration are passed\
    \ to the interface from the class implementing that interface:\n\n```java\nclass\
    \ myClass <T> implements myInterface <T> {...}\ninterface myInterface <T> { ...\
    \ }\n```\n\nThis is why generic interfaces can only be implemented by generic\
    \ classes.\n\nIt is possible to restrict the scope of type-variables in the class\
    \ declaration, in the interface declaration, or in both:\n\n```java\nclass myClass\
    \ <T extends AB> implements myInterface <T> {...}\ninterface myInterface <T extends\
    \ ABC> { ... }\n```\n\nThe Java compiler performs **type safety checking** by\
    \ comparing the bounds set for the type arguments in the class to the bounds set\
    \ in the interface. The class type arguments must be within bounds of the interface\
    \ class arguments.\n\nNote: Whether the type-variable **T** is used (or how it\
    \ is used) in the bodies of the class or interface, is irrelevant to the type\
    \ safety checking process – the type safety checking will be performed anyway.\n\
    \nBelow are examples of valid as well as incorrect declarations.\n\n```java\n\
    class AB {}\nclass A extends AB {}\nclass B extends AB {}\n```\n\n> myInterface\
    \ can be implemented only by the class AB or its sub-classes\n\n```java\ninterface\
    \ myInterface <T extends AB> {...}\n```\n\n> Valid declaration\n\n```java\nclass\
    \ myClass <T> implements myInterface <T> {...}\n```\n\n> Valid; class A is subclass\
    \ of AB\n\n```java\nclass myClass <T extends A> implements myInterface <T> {...}\n\
    ```\n\n```java\nclass myClass <T extends string> implements myInterface <T> {...}\n\
    ```\n\n> Error! Class String is not a subclass of AB\n\n```java\nclass myClass\
    \ implements myInterface <T> {...}\n```\n\n> Error! Class myClass must be generic\n\
    \n```java\nclass myClass <X> implements myInterface <T> {...}\n```\n\n> Error!\
    \ The generic type variables in myClass and myInterface must have same name\n\n\
    # Generic Constructors\n\nIt is important to remember that constructors are methods\
    \ whose function is to create instances (objects) of classes. As methods, they\
    \ can be declared as generic. The class itself can be either generic or non-generic.\n\
    \nWe have already seen constructors of generic classes in previous examples.\n\
    Here is another example:\n\n```java\nclass GenericClass <T> {\n    public T key;\n\
    \    GenericClass(T k) {\n        this.key = k;\n    }\n}\n```\n\n```java\nGenericClass<Integer>\
    \ g = new GenericClass<Integer>(123);\n```\n\nThe constructor itself can be generic,\
    \ even if the class is not. For example:\n\n```java\nclass Node {\n    private\
    \ Object data;\n    public <T> Node(T data) {\n        this.data = data;\n   \
    \ }\n}\n```\n\nThis allows the constructor to handle different types of data while\
    \ the class structure remains fixed.\n\n# Lambda Expressions\n\nA lambda expression\
    \ is a special construct of the Java language used for defining methods outside\
    \ of any class. In reality, the lambda expression automatically declares a “hidden”\
    \ class, creates an instance of that class, and attaches the specified method\
    \ to it.\n\nLet’s illustrate this process with an example. We will implement the\
    \ functionality using the “traditional” approach and also using the lambda expressions.\
    \ The task is to create a method converting any text to uppercase.\n\nHere is\
    \ the “traditional” way:\n\n```java\nclass myClass {\n  string transform(string\
    \ s) { return s.toUpperCase(); }\n}\n..\nmyClass c = new myClass();\nSystem.out.println(\
    \ c.transform(\"text\") ); // prints: \"TEXT\"\n```\n\nThe same transform method\
    \ using lambda expression:\n\n```java\ninterface myInterface {\n  String transform(String\
    \ s); // \"txt\" substitutes the input parameter\n}\n\nmyInterface upper = (txt)\
    \ -> {return txt.toUpperCase();};\nSystem.out.println( upper.transform(\"text\"\
    ) ); // prints: \"TEXT\"\n```\n\n> We need to create an interface that must declare\
    \ only one method. This is called a “functional interface\"\n\n> Becomes the body\
    \ of the transform method\n\n> upper is an object of a “hidden” class that implements\
    \ myInterface\n"
  mdcn: "\n\n# 将泛型类作为参数\n\n泛型类的对象可以像其他 Java 对象一样作为参数传递给方法：\n\n```java\nclass GenericClass\
    \ <T> { ... }\npublic void myMethod(GenericClass g) { ... }\nGenericClass<A> a\
    \ = new GenericClass<A>();\nGenericClass<B> b = new GenericClass<B>();\n```\n\n\
    ```java\nmyMethod(a);\nmyMethod(b);\n```\n\n如你所见，myMethod() 可以接受任何类型的 GenericClass\
    \ 对象，无论创建这些对象时使用的类型变量 T 是什么。我们可以通过对 myMethod() 的输入参数指定限制，来为该过程添加一些类型安全检查。这是通过通配符参数\
    \ `?` 实现的。下面的示例演示了在方法声明中使用 `?>` 参数：\n\n```java\nabstract class AB { ... }\nclass\
    \ A extends AB { ... }\nclass B extends AB { ... }\n...\nclass G <T extends AB>\
    \ extends AB { ... }\n```\n\n```java\npublic void myMethod(G<?> g) { ... }\n...\n\
    public void myMethod(G<? extends AB> g) { ... }\n...\npublic void myMethod(G<?\
    \ super B> g) { ... }\n```\n\n在此示例中，`<? extends AB>` 为传递对象引用设置了上限，而 `<? super\
    \ B>` 设置了下限。\n\n# 泛型接口\n\n泛型接口的声明方式与泛型类的声明类似，例如：\n\n```java\ninterface GenericInterface\
    \ <T> {\n  public void myID(T id);\n}\n```\n\n接口声明中的类型变量是从实现该接口的类传递给接口的：\n\n```java\n\
    class myClass <T> implements myInterface <T> {...}\ninterface myInterface <T>\
    \ { ... }\n```\n\n这就是为什么泛型接口只能由泛型类实现。\n\n可以在类声明、接口声明或两者中限制类型变量的范围范围：\n\n```java\n\
    class myClass <T extends AB> implements myInterface <T> {...}\ninterface myInterface\
    \ <T extends ABC> { ... }\n```\n\nJava 编译器通过比较类中为类型参数设置的边界与接口中设置的边界来执行**类型安全检查**。类的类型参数必须在接口类参数的边界之内。\n\
    \n注意：类型变量 **T** 是否在类或接口的体中使用（或如何如何使用），与类型安全检查过程无关——类型安全检查将会被执行。\n\n下面是有效和错误的声明示例。\n\
    \n```java\nclass AB {}\nclass A extends AB {}\nclass B extends AB {}\n```\n\n\
    > myInterface 只能由类 AB 或其子类实现\n\n```java\ninterface myInterface <T extends AB>\
    \ {...}\n```\n\n> 有效声明\n\n```java\nclass myClass <T> implements myInterface <T>\
    \ {...}\n```\n\n> 有效；类 A 是 AB 的子类\n\n```java\nclass myClass <T extends A> implements\
