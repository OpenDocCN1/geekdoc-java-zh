- md: "\n# Boolean Logical Operators\n\nThe Boolean logical operators are similar\
    \ to the bitwise logical operators. Both apply the logical AND, OR, XOR, and NOT\
    \ to two operands and produce Boolean results, but the bitwise logical operators\
    \ act on bits, while the Boolean logical operators act on Boolean values.\n\n\
    In addition to \"regular\" four logical operators (AND, OR, XOR, NOT), Java provides\
    \ two \"improved\" Boolean operators – short-circuit OR and short-circuit AND.\
    \ They will be explained later in this section.\n\nThe following table lists the\
    \ Boolean logical operators:\n\n| Operator | Performed Function | Type of operator\
    \ |\n|---|---|---|\n| ! | Logical unary NOT | Regular logical operator |\n| &\
    \ | Logical AND | |\n| | | Logical OR | |\n| ^ | Logical exclusive OR (XOR) |\
    \ |\n| || | Short circuit OR | Short-Circuit logical operator |\n| && | Short\
    \ circuit AND | |\n\nSame as with the bitwise operators, the Boolean logical operators\
    \ (with the exception of the unary NOT operator and the short-circuit operators)\
    \ can be combined with the assignment operator to form the shorthand as follows:\n\
    \n```\na &= b;   // This is equivalent to a = a & b;\na |= b;   // This is equivalent\
    \ to a = a | b;\na ^= b;   // This is equivalent to a = a ^ b;\n```\n\nThe Boolean\
    \ logical operators (&), (|), (^), and (!) apply the logical operators AND, OR,\
    \ XOR, and NOT to two Boolean operands of an expression. The table below shows\
    \ the results of Boolean logical operators for all possible combinations of two\
    \ Boolean operands:\n\n| Logical operators: | AND | OR | XOR | NOT |\n|---|---|---|---|---|\n\
    | Operand A | Operand B | A & B | A | B | A ^ B | !A |\n| True | True | True |\
    \ True | False | False |\n| True | False | False | True | True | False |\n| False\
    \ | True | False | True | True | True |\n| False | False | False | False | False\
    \ | True |\n\nThe short-circuit operators (&&) and (||) do not evaluate the right-hand\
    \ operand of a logical expression when the value of the left-hand operand determines\
    \ the result regardless of the value of another operand. For example, if A=true,\
    \ the result of A | B is always true, no matter of what B value is.\n\nExamples:\n\
    \n```\nboolean a, b, c;\na = true;\nb = true;\n\na = !b;      // a=false\na &=\
    \ b;      // a=false (same as: a = a & b)\na |= b;      // a=true (same as: a\
    \ = a | b)\na^= b;      // a=false (same as: a = a ^ b)\na = a ^ b; // a=false\n\
    ```\n\n// short-circuit operators\n\n```\na = false;\nb = true;\nc = a || b; \
    \  // c=true (a and b both will be evaluated)\nc = b || a;   // c=true (a will\
    \ not be evaluated)\nc = a && b;   // c=false (b will not be evaluated)\n```\n\
    \n# Conditional Operator\n\nJava provides a special ternary (three-way) conditional\
    \ operator \"? :\", that allows for compact implementation of some IF-THEN-ELSE\
    \ statements. The format of the \"? :\" operator is this:\n\n```\nvariable = logical_expression\
    \ ? expression1 : expression2\n```\n\nThe logical_expression is any expression\
    \ that evaluates to a Boolean value. If it evaluates to true, expression1 is evaluated\
    \ and assigned to variable; otherwise, expression2 is evaluated and assigned to\
    \ variable. This can be shown in pseudo-code as follows:\n\n```\nIF logical_expression\
    \ = true\nnTHEN variable = value of expression1\nELSE variable = value of expression2\n\
    ```\n\nExample 1:\n\n```\nint x = -1; int y = -1;\ny = x > 0 ? x : -x; // x =\
    \ -1; y = +1\n```\n\nExample 2:\n\n```\nint x = -1; int y = -1;\ny = x > 0 ? x\
    \ : -(x = x + y); // x = -2; y = +2\n```\n\nIn the second example, the x = x +\
    \ y expression is executed first resulting in x=-2. Then, expression -(-2) evaluates\
    \ to +2 and this value is assigned to y.\n\n# Program Flow Control\n\nMost computer\
    \ languages, including Java, support the following fundamental program flow constructs:\n\
    \n- Sequential Statement\n- Block of Statements\n- Two-Choice (IF structure)\n\
    - Multiple-Choice (CASE structure)\n- Iteration\n- Jump (GOTO statement)\n\nJava's\
    \ implementation of these constructs is presented in this paragraph.\n\n# The\
    \ Sequential Statement\n\nThe Sequential Statement does not change the program\
    \ flow.\n\nThe assignment statement like x = b; is an example of a sequential\
    \ statement. Java also has an empty statement, which is just a semicolon (;) without\
    \ any expression in front of it.\n\n# The Statement Block\n\nThe Statement Block\
    \ is a group of statements enclosed within curly brackets:\n\n# The \"if\" Statement\n\
    \nThe \"if\" statement implements Two-Choice construct:\n\nThe format of the if\
    \ statement is as follows:\n\n```\nif ( expression )\n  { statements }\nelse\n\
    \  { statements }\n```\n\nExamples:\n\n```\nint x, y;\nx = 5;\nif (x > 0) y =\
    \ 1;\nelse y = 0;\n```\n\n# The \"switch\" Statement\n\nThe switch statement implements\
    \ Multiple-Choice (CASE) construct:\n\nThe format of the switch statement is:\n\
    \n```\nswitch ( expression ) {\n  case value1:\n    statements;\n  case value2:\n\
    \    statements;\n  default:\n    statements;\n}\n```\n\n# Iteration statements\n\
    \nJava supports three iteration statements – **while**, **do...while**, and **for**.\
    \ All of them execute a block of code until some conditions are met.\n\n# The\
    \ “while” Statement\n\nThe **while** statement executes a block of code (body\
    \ of the loop) while the specified condition is true.\n\nAn important point here\
    \ is that the *condition* is evaluated first, and then the *body* is executed.\
    \ If the *condition* is false initially, the body of the loop will not be executed\
    \ at all. The format of the **while** statement is:\n\n```\nwhile ( condition\
    \ ) { body }\n```\n\nExample:\n\n```\nint n;\nn = 2;\nwhile (n > 0)\n{\n    System.out.print(\"\
    n=\" + n); // prints: \"n=2 n=1\"\n    n--;\n}\n```\n\n# The \"do...while\" Statement\n\
    \nThe **do...while** statement is similar to the above **while** statement with\
    \ one exception – it first executes the body of the loop, then evaluates the specified\
    \ condition:\n\nThe format of the **do...while** statement is this:\n\n```\ndo\
    \ { body } while ( condition ) ;\n```\n\nExample:\n\n```\nint n;\nn = 2;\ndo\n\
    {\n    System.out.print(\"n=\" + n); // print: \"n=2 n=1\"\n    n--;\n}while (n\
    \ > 0);\n```\n\nThe result, as we see, is exactly as in the previous example with\
    \ the **while** statement. However, if the initial value of **n** was 0, the body\
    \ of the loop would execute once and the above code would produce this output:\n\
    \nn=0\n"
