    \ can also be used in non-generic classes.\n\nExample:\n\n```\nclass nonGeneric\
    \ {\n  String name;\n  <T extends myInterface> nonGeneric(T o) {\n    this.name\
    \ = o.getName();\n  }\n  public static void main (String args[]) {\n    nonGeneric\
    \ g = new nonGeneric(new A());\n    System.out.println(g.getName()); // prints:\
    \ \"Class A\"\n  }\n}\n\ninterface myInterface { String getName(); }\nclass A\
    \ implements myInterface {\n  public String getName() { return \"Class A\"; }\n\
    }\n```\n\n> Only classes implementing the interface myInterface can be passed\
    \ to this constructor.\n\nNotice the usage of the interface name in the constructor\
