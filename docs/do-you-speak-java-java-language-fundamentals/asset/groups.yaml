- md: "\n# Inner Classes\n\nAn inner class is a class declared within another class\
    \ or within a method:\n\n```java\nclass classA {                   // top level\
    \ class (outer class)\n    class classB {              // inner class\n      \
    \  class classC {          // inner class\n    }\n}\n\npublic void myMethod()\
    \ {\n    class classD {              // inner class (AKA local class)\n    }\n\
    }\n```\n\n# Static Inner (Nested) Classes\n\nA static inner class is a class with\
    \ the static modifier and declared within another class:\n\n```java\nclass outerClass\
    \ {\n    static class innerClass {\n}\n```\n\nA static inner class can access\
    \ only static variables and methods of the outer class and has no association\
    \ with the instances of the outer class. In this regard it behaves exactly like\
    \ any other class declared outside of the outer class, so more appropriate name\
    \ for such classes would be static nested classes.\n\nExample of using inner (nested)\
    \ classes:\n\n```java\npublic class Outer {\n    static String myName = \"Outer\"\
    ;\n    static int N = 0;\n\n    static class Nested {\n        static String symbolName\
    \ = \"Nested\";\n        int myN;\n        Nested() { myN = ++N; }\n    }\n}\n\
    ```\n\n| N will keep track of total created instances of the nested class |\n\
    | :--- |\n| Constructor of the nested class; increments object's sequential number\
    \ |\n\n```java\npublic static void main(String args[]) {\n    System.out.println(myName);\n\
    \    System.out.println(Nested.myName);\n    System.out.println(Outer.Nested.myName);\n\
    \n    Nested nested1 = new Nested();\n    Outer.Nested nested2 = new Outer.Nested();\n\
    \n    System.out.println(nested1.myN); // Prints: 1\n    System.out.println(nested2.myN);\
    \ // Prints: 2\n}\n```\n\n```java\n\n# Non-Static Inner Classes\n\nA non-static\
    \ inner class is a class declared within another class as an instance property\
    \ (i.e. without the static modifier). An object of a non-static inner class has\
    \ access to the instance variables and methods of the outer class in which it\
    \ was created. Objects of non-static inner classes can be created either within\
    \ instance methods of the outer class, or with the new operator prefixed with\
    \ the outer class name:\n\n```java\npublic class outer {\n    int x = 0;\n\n \
    \   class Inner { \n        void innerMethod() { \n            x++; \n       \
    \ }\n    }\n\n    public static void main(String args[]) {\n        Outer outer1\
    \ = new Outer();\n        Inner inner1 = outer1.new Inner();\n        Outer.Inner\
    \ inner2 = outer1.new Inner();\n\n        outer1.instanceMethod();\n    }\n\n\
    \    void instanceMethod() {\n        Inner inner3 = new Inner();\n        Outer.Inner\
    \ inner4 = this.new Inner();\n    }\n}\n```\n\n# Local Inner Classes\n\nA class\
    \ declared within a method is called a local class.\n\n```java\npublic static\
    \ void main(String args[]) {\n    int x = 1;\n    int y = 2;\n\n    // A localClass\
    \ class declared within method main\n\n    class myLocalClass {\n        String\
    \ s = \"Local Class\";\n        int z;\n        { z = x + y; }\n        { x =\
    \ 2; }\n    }\n\n    myLocalClass loc = new myLocalClass();\n    System.out.println(\"\
    z=\" + loc.z); // prints: z=3\n}\n```\n\n# Abstract Classes\n\nAbstract class\
    \ is a class in which one or more methods are declared, but not defined (i.e.\
    \ without a body). To understand why we need abstract classes, consider this class\
    \ hierarchy.\n\nClass Shape declares the getArea method for calculating the area\
    \ of a particular shape. This method is overridden with actual implementation\
    \ in each of the subclasses – Square and Circle. If we create an object of class\
    \ Shape, its getArea() would have no meaning. Of course, we could make it to return\
    \ a false value, like zero, to indicate that this is not a true shape. A better\
    \ approach, however, would be to altogether disallow the creation of class Shape\
    \ objects. That's abstract classes and abstract methods come in hand.\n\nExample:\n\
    \n```java\nabstract class Shape {\n    String myName;\n    public abstract double\
    \ getArea(double arg);\n    public String getName() { return myName; }\n\n   \
    \ public static void main (String[] args) {\n        Shape a = new Circle();\n\
    \        Double area = a.getArea(1);\n        System.out.println(\"area=\" + area);\
    \ // prints: \"area=3.1415\"\n    }\n}\n\nclass Circle extends Shape {\n    public\
    \ double getArea(double arg) {\n        return (arg * arg * 3.1415);\n    }\n\
    }\n```\n\n# Anonymous Classes\n\nAn **anonymous class** is a class declared within\
    \ an expression.\n\n# Interfaces\n\nAn interface is a collection of constants,\
    \ abstract methods, and default methods. The main purpose of interfaces is to\
    \ define a contract that classes must implement. This allows for polymorphism,\
    \ where different classes can be treated as the same interface type.\n\nA class\
    \ can implement multiple interfaces by using the `implements` keyword. When a\
    \ class implements an interface, it must provide implementations for all the abstract\
    \ methods of the interface, unless the class is also abstract.\n\n```java\ninterface\
    \ Animal {\n    void makeSound();\n    default void sleep() {\n        System.out.println(\"\
    Sleeping...\");\n    }\n}\n\nclass Dog implements Animal {\n    public void makeSound()\
    \ {\n        System.out.println(\"Bark\");\n    }\n}\n\nclass Cat implements Animal\
    \ {\n    public void makeSound() {\n        System.out.println(\"Meow\");\n  \
    \  }\n}\n```\n\nAn anonymous class is a class without a name. It is typically\
    \ used when you need to define a class only once. Anonymous classes are defined\
    \ and instantiated simultaneously within an expression.\n\n```java\nRunnable r\
    \ = new Runnable() {\n    @Override\n    public void run() {\n        System.out.println(\"\
    Running in an anonymous class\");\n    }\n};\n```\n\nThe example below demonstrates\
    \ common techniques for working with interfaces.\n\n```java\ninterface Command\
    \ {\n    void execute();\n}\n\npublic class Test {\n    public static void main(String[]\
    \ args) {\n        Command c = new Command() {\n            @Override\n      \
    \      public void execute() {\n                System.out.println(\"Executing\
    \ command\");\n            }\n        };\n        c.execute();\n    }\n    \n\
    \    static void runCommand(Command cmd) {\n        cmd.execute();\n    }\n}\n\
    ```"
  mdcn: "\n\n# 内部类\n\n内部类是在另一个类内部或方法内部定义的类：\n\n```java\nclass classA {           \
    \        // 顶层类（外部类）\n    class classB {              // 内部类\n        class classC\
    \ {          // 内部类\n    }\n}\n\npublic void myMethod() {\n    class classD {\
    \              // 内部类（又称局部类）\n    }\n}\n```\n\n# 静态内部（嵌套）类\n\n静态内部类是带有 `static`\
    \ 修饰符且在另一个类内部定义的类：\n\n```java\nclass outerClass {\n    static class innerClass\
    \ {\n}\n```\n\n静态内部类只能访问外部类的静态变量和方法，并且与外部类的实例没有关联。在这方面，它的行为与在外部类之外定义的任何其他类完全相同，因此此类类更合适的名称是静态嵌套类。\n\
    \n使用内部（嵌套）类的示例：\n\n```java\npublic class Outer {\n    static String myName = \"\
    Outer\";\n    static int N = 0;\n\n    static class Nested {\n        static String\
    \ symbolName = \"Nested\";\n        int myN;\n        Nested() { myN = ++N; }\n\
    \    }\n}\n```\n\n| N 将跟踪嵌套类创建的实例总数 |\n| :--- |\n| 嵌套类的构造函数；增加对象的顺序号 |\n\n```java\n\
    public static void main(String args[]) {\n    System.out.println(myName);\n  \
    \  System.out.println(Nested.myName);\n    System.out.println(Outer.Nested.myName);\n\
    \n    Nested nested1 = new Nested();\n    Outer.Nested nested2 = new Outer.Nested();\n\
    \n    System.out.println(nested1.myN); // 输出: 1\n    System.out.println(nested2.myN);\
    \ // 输出: 2\n}\n```\n\n```java\n\n# 非静态内部类\n\n非静态内部类是作为实例属性在另一个类内部定义的类（即不带 `static`\
    \ 修饰符）。非静态内部类的对象可以访问其创建时所在的外部类的实例变量和方法。非静态内部类的对象可以在外部类的实例方法内部创建，也可以通过以外部类名为名前缀的\
    \ `new` 运算符创建：\n\n```java\npublic class outer {\n    int x = 0;\n\n    class Inner\
    \ { \n        void innerMethod() { \n            x++; \n        }\n    }\n\n \
    \   public static void main(String args[]) {\n        Outer outer1 = new Outer();\n\
    \        Inner inner1 = outer1.new Inner();\n        Outer.Inner inner2 = outer1.new\
    \ Inner();\n\n        outer1.instanceMethod();\n    }\n\n    void instanceMethod()\
    \ {\n        Inner inner3 = new Inner();\n        Outer.Inner inner4 = this.new\
    \ Inner();\n    }\n}\n```\n\n# 局部内部类\n\n在方法内部定义的类被称为局部类。\n\n```java\npublic static\
    \ void main(String args[]) {\n    int x = 1;\n    int y = 2;\n\n    // 在 main\
    \ 方法内定义的 myLocalClass 类\n\n    class myLocalClass {\n        String s = \"Local\
    \ Class\";\n        int z;\n        { z = x + y; }\n        { x = 2; }\n    }\n\
    \n    myLocalClass loc = new myLocalClass();\n    System.out.println(\"z=\" +\
    \ loc.z); // 输出: z=3\n}\n```\n\n# 抽象类\n\n抽象类是声明了一个或多个方法但未定义的类（即没有方法体）。为了理解为什么我们需要抽象类，请考虑这个类层次结构。\n\
    \n`Shape` 类声明了用于计算特定形状面积的 `getArea` 方法。该方法在每个子类（`Square` 和 `Circle`）中都被重写了具体的实现。如果我们创建一个\
    \ `Shape` 类的对象，它的 `getArea()` 将没有任何意义。当然，我们可以让它返回一个假值（如零）来表示这不是真实的形状。然而，更好的方法是完全禁止创建\
    \ `Shape` 类对象。这正是抽象类和抽象方法派上用场的地方。\n\n示例：\n\n```java\nabstract class Shape {\n\
    \    String myName;\n    public abstract double getArea(double arg);\n    public\
    \ String getName() { return myName; }\n\n    public static void main (String[]\
    \ args) {\n        Shape a = new Circle();\n        Double area = a.getArea(1);\n\
    \        System.out.println(\"area=\" + area); // 输出: \"area=3.1415\"\n    }\n\
    }\n\nclass Circle extends Shape {\n    public double getArea(double arg) {\n \
    \       return (arg * arg * 3.1415);\n    }\n}\n```\n\n# 匿名类\n\n**匿名类**是在表达式内部定义的类。\n\
    \n# 接口\n\n接口是常量、抽象方法和默认方法的集合。接口的主要目的是定义类必须实现的契约。这允许多态，使得不同的类可以被视为相同的接口类型。\n\n\
    类可以通过使用 `implements` 关键字实现多个接口。当一个类实现接口时，它必须为接口中的所有抽象方法提供实现，除非该类本身也是抽象类。\n\n```java\n\
    interface Animal {\n    void makeSound();\n    default void sleep() {\n      \
    \  System.out.println(\"Sleeping...\");\n    }\n}\n\nclass Dog implements Animal\
    \ {\n    public void makeSound() {\n        System.out.println(\"Bark\");\n  \
    \  }\n}\n\nclass Cat implements Animal {\n    public void makeSound() {\n    \
    \    System.out.println(\"Meow\");\n    }\n}\n```\n\n匿名类是没有名字的类。它通常用于你只需要定义一次类的情况。匿名类在表达式内部同时定义并实例化。\n\
    \n```java\nRunnable r = new Runnable() {\n    @Override\n    public void run()\
    \ {\n        System.out.println(\"Running in an anonymous class\");\n    }\n};\n\
    ```\n\n下面的示例演示了处理接口的常用技术。\n\n```java\ninterface Command {\n    void execute();\n\
    }\n\npublic class Test {\n    public static void main(String[] args) {\n     \
