    }\n```"
- md: "\nThe class variable **totalCount** will be initialized to zero when the class\
    \ is first referenced in the **main** program. The instance statement block will\
    \ run when object **obj1** and **obj2** are created, incrementing the **totalCount**\
    \ by 1 and assigning its new value to the instance variable **myNumber**. Note\
    \ that objects obj1 and obj2 will have their own copies of the **myNumber** variable.\n\
    \nThe previous example contains one thing that was not covered yet - the **new**\
    \ statement, which creates objects. Let’s take a closer look at it and the whole\
    \ process of creating new objects.\n\n## Working with Objects\n\nObjects are the\
    \ core of Java language, making it very important to have a good understanding\
    \ of how to create objects and how to use their contents.\n\n## Creating Objects\n\
    \nThe process of creating a new object is called instantiation, and is performed\
    \ using the new statement. The format of the new statement is this\n\n```\nclassName\
    \ objectReferenceVariable = new className(parameters);\n```\n\nExample:\n\n```\n\
    myClass object1 = new myClass();\n```\n\nThis is what happens during execution\
    \ of the above statement:\n\n- 1) “myClass object1” declares the variable object1\
    \ of type myClass. This variable can be used to reference any object of class\
    \ myClass, that’s why such variables are also called object references.\n- 2)\
    \ The new operator creates a new object; all instance declarations of variables,\
    \ statement blocks, and methods are processed.\n- 3) The myClass() method is invoked\
    \ to optionally initialize the instance variables of the newly created object.\n\
    - 4) The reference between the variable object1 and the new object is established.\n\
    \n## Constructors\n\nThe myClass() method mentioned above is called a constructor,\
    \ which is a method with the same name as the class name and without the return\
    \ type specified. It is invoked by the JVM when an object of the class is being\
    \ created. The purpose of a constructor is to initialize the instance variables\
    \ of the class. If you do not declare any constructors, the JVM will create one:\
    \ className() {}, which will do nothing. However, once at least one constructor\
    \ is declared by the programmer, the default constructor is gone and cannot be\
    \ used. Please remember that a constructor is invoked right after the instance\
    \ declarations and statement blocks are processed. Below is an example of a class\
    \ that keeps track of its objects:\n\n```\nclass testclass {\n    static int count;\
    \ // Total objects counter; defaults to zero\n    int myNumber; // Object's sequential\
    \ number\n\n    // Instance block executes every time an object is created\n \
    \   {\n        myNumber = ++count; // instance block increments the count\n  \
    \  } // and assigns it to object's myNumber\n    testClass() {} // constructor\
    \ without parameters\n    testClass(int n) {\n        myNumber = n; // Second\
    \ constructor; assigns specified\n        // sequence number to new object\n \
    \   }\n\n    -----Execution----\n    public static void main(String args[]) {\n\
    \        testClass obj1 = new testClass();\n        testClass obj2 = new testClass();\n\
    \        testClass obj3 = new testClass(10);\n        System.out.println(obj1.myNumber);\
    \ // prints 1\n        System.out.println(obj2.myNumber); // prints 2\n      \
    \  System.out.println(obj3.myNumber); // prints 10\n    }\n}\n```\n\nNote, that\
    \ we defined two different constructors with the same name. This is called \"\
    method overloading\".\n\n## Method Overloading\n\n**Method overloading** is a\
    \ mechanism used by Java to distinguish methods having the same names but different\
    \ parameter lists. Each method in Java is distinguished by its **signature** –\
    \ the name of the method along with the list of parameter types. The signature\
    \ of the testClass() method could be expressed as “testClass”, and the signature\
    \ of the testClass(int n) would be “testClass,int”.\n\n## The “this” Keyword\n\
    \nIn previous examples, instance variables were referenced in constructors directly\
    \ by their names. But what will happen when a variable with the same name as the\
    \ instance variable is declared in the **main** method? This situation is perfectly\
    \ legal because all variables declared within the **main** method are not “visible”\
    \ outside of that method.\n\nAnother confusing situation would be when the name\
    \ of an instance variable is also used in the constructor’s parameter list. This\
    \ problem can be solved with the use of the keyword **this**, which represents\
    \ the current object. See this example:\n\n```\nclass testClass {\n  int x;\n\
    \  testClass(int x) {\n    x = x;\n    this.x = x;\n  }\n\n  public static void\
    \ main(String args[]) {\n    int x;\n    testClass obj = new testClass(100);\n\
    \    x = obj.x;\n  }\n}\n```\n\nThe **this** keyword can be used not only to refer\
    \ instance variables, but also to invoke one constructor from another, or to pass\
    \ the current object as an argument between methods.\n\nImportant note: the **this**\
    \ keyword can be used only in constructors.\n\nAnother example of using the this\
    \ keyword:\n\n```java\nclass Position {\n    int x, y, z;\n    Position(int x,\
    \ int y, int z) {\n        this.x = x;\n        this.y = y;\n        this.z =\
    \ z;\n    }\n    Position(int x) {\n        this(x, 0, 0);\n        showPosition(this);\n\
    \    }\n    void showPosition(Position p) {\n        System.out.println(\"My position:\
    \ \"+p.x+\",\"+p.y+\",\"+p.z);\n    }\n\n    public static void main(String args[])\
    \ {\n        Position obj = new Position(5);\n    }\n}\n```\nThe above code prints:\
    \ My position: 5,0,0\n\n## The “super” Keyword\n\nIn previous examples, instance\
    \ variables were referenced in constructors directly by their names. But what\
    \ will happen when a variable with the same name as the instance variable is declared\
    \ in the **main** method? This situation is perfectly legal because all variables\
    \ declared within the **main** method are not “visible” outside of that method.\n\
    \nAnother confusing situation would be when the name of an instance variable is\
    \ also used in the constructor’s parameter list. This problem can be solved with\
    \ the use of the keyword **this**, which represents the current object. See this\
    \ example:\n\n```java\nclass testClass {\n  int x;\n  testClass(int x) {\n   \
    \ x = x;\n    this.x = x;\n  }\n\n  public static void main(String args[]) {\n\
    \    int x;\n    testClass obj = new testClass(100);\n    x = obj.x;\n  }\n}\n\
    ```\n\nThe **this** keyword can be used not only to refer instance variables,\
    \ but also to invoke one constructor from another, or to pass the current object\
    \ as an argument between methods.\n\nImportant note: the **this** keyword can\
    \ be used only in constructors.\n\nAnother example of using the this keyword:\n\
    \n```java\nclass Position {\n    int x, y, z;\n    Position(int x, int y, int\
    \ z) {\n        this.x = x;\n        this.y = y;\n        this.z = z;\n    }\n\
    \    Position(int x) {\n        this(x, 0, 0);\n        showPosition(this);\n\
    \    }\n    void showPosition(Position p) {\n        System.out.println(\"My position:\
    \ \"+p.x+\",\"+p.y+\",\"+p.z);\n    }\n\n    public static void main(String args[])\
    \ {\n        Position obj = new Position(5);\n    }\n}\n```\nThe above code prints:\
    \ My position: 5,0,0\n\n## The “super” Keyword\n\nWhen an object of a subclass\
    \ is created, a superclass object is created as well, implicitly or explicitly.\
    \ It means that any object consists of the subclass and its parent class (superclass).\n\
    \nOne of the Object-Oriented principles is inheritance. The subclass inherits\
    \ all the features of the parent class (superclass). Example of creating an object\
    \ of the superclass:\n\n```java\nclass superClass {\n  int x;\n}\nclass subclass\
    \ extends superClass {\n  int x;\n}\n```\n\nThe **super** keyword is used to access\
    \ the superclass instance. For example:\n\n```java\nclass superClass {\n  int\
    \ x;\n}\nclass subclass extends superClass {\n  int x;\n  subclass(int x) {\n\
    \    super.x = x;\n    this.x = x;\n  }\n  public static void main(String args[])\
    \ {\n    subclass obj = new subclass(10);\n    System.out.println(obj.x); // prints\
    \ 10\n    System.out.println(((super)obj).x); // logic here\n  }\n}\n```\n\nThe\
    \ **super** keyword can be used to call the superclass constructor or to access\
    \ the instance variables or methods of the superclass.\n\n## Object Casting\n\n\
    Note, the super keyword can be used only in constructors. So how do we access\
    \ the instance variables or instance methods of a superclass from a subclass object?\
    \ In the above example the variable x is defined in both the subclass and the\
    \ superclass. The subclass' x can be referenced via the subclass object name as\
    \ follows: subclassObject.x, but the superclass' x is hidden. The solution to\
    \ this problem is object casting. We can cast a subclass object to any of its\
    \ superclass objects. Consider an example with two classes Parent and Child, both\
    \ declaring an instance variable x.\n\n```java\nclass Parent { int x; }\nclass\
    \ Child extends Parent { int x; }\nclass Test {\n    public static void main(String\
    \ args[]) {\n        int y;\n\n        // A Child object referenced by a variable\
    \ of type Child:\n        Child c = new Child();\n        y = c.x;           \
    \  // reference to the x of class Child\n        y = ((Parent) c).x; // reference\
    \ to the x of class Parent\n\n        // A Child object referenced by a variable\
    \ of type Parent:\n        Parent p = new Child();\n        y = p.x;         \
    \    // reference to the x of class Parent\n        y = ((Child) p).x); // reference\
    \ to the x of class Child\n    }\n}\n```\n"
  mdcn: "\n类变量 **totalCount** 在类首次被 **main** 程序引用时将初始化为 0。当创建对象 **obj1** 和 **obj2**\
    \ 时，实例语句块将执行，将 **totalCount** 增加 1，并将新值赋给实例变量 **myNumber**。请注意，对象 obj1 和 obj2\
    \ 将拥有它们自己的 **myNumber** 变量副本。\n\n上一个示例包含一个尚未触及的内容——**new** 语句，它用于创建对象。让我们仔细查看该语句以及创建新对象的整个过程。\n\
    \n## 对象的用法\n\n对象是 Java 语言的核心，因此很好地理解如何创建对象以及如何使用它们的内容非常重要。\n\n## 创建对象\n\n创建新对象的过程称为实例化，它是使用\
    \ `new` 语句完成的。`new` 语句的格式如下：\n\n```\nclassName 对象的引用变量 = new className(参数);\n\
    ```\n\n示例：\n\n```\nmyClass object1 = new myClass();\n```\n\n```-```\n\n在执行上述语句期间，发生了以下情况：\n\
    \n- 1) “myClass object1”声明了类型为 myClass 的变量 object1。该变量可以用于引用任何 myClass 类的对象，这就是为什么此类变量被称为对象引用。\n\
    - 2) `new` 运算符创建一个新对象；所有变量的实例声明、语句块和方法都会被处理。\n- 3) 调用 `myClass()` 方法来可选地初始化新创建对象的实例变量。\n\
    - 4) 建立了变量 object1 与新对象之间的引用。\n\n## 构造方法\n\n上述的 `myClass()` 方法被称为构造方法，它是一个与类名相同且没有指定返回类型的方法。它在创建该类的对象时由\
    \ JVM 调用。构造方法的作用是初始化类的实例变量。如果你不声明任何构造方法，JVM 将创建一个：`className() {}`，它将什么都不做。然而，一旦程序员至少声明了一个构造方法，默认构造方法就会消失且无法使用。请记住，构造方法是在实例声明和语句块处理之后立即调用的。下面是一个跟踪对象的类示例：\n\
    \n```\nclass testclass {\n    static int count; // 对象总计数器；默认值为零\n    int myNumber;\
    \ // 对象的顺序号\n\n    // 实例块在每次创建对象时执行\n    {\n        myNumber = ++count; // 实例块增加计数\n\
    \    } // 并将其赋值给对象的 myNumber\n    testClass() {} // 无参数的构造方法\n    testClass(int\
    \ n) {\n        myNumber = n; // 第二个构造方法；将指定的\n        // 顺序号赋予新对象\n    }\n\n\
    \    -----执行----\n    public static void main(String args[]) {\n        testClass\
    \ obj1 = new testClass();\n        testClass obj2 = new testClass();\n       \
    \ testClass obj3 = new testClass(10);\n        System.out.println(obj1.myNumber);\
    \ // 输出 1\n        System.out.println(obj2.myNumber); // 输出 2\n        System.out.println(obj3.myNumber);\
    \ // 输出 10\n    }\n}\n```\n\n注意，我们定义了两个同名但不同的构造方法。这被称为“方法重载”。\n\n## 方法重载\n\n**方法重载**是\
    \ Java 用于区分具有相同名称但不同参数列表方法的机制。Java 中的每个方法都通过其**签名**来区分——即方法名加上参数类型列表。`testClass()`\
    \ 方法的签名可以表示为“testClass”，而 `testClass(int n)` 的签名将是“testClass,int”。\n\n## “this”关键字\n\
    \n在之前的示例中，实例变量在构造方法中直接通过它们的名称引用。但当在 **main** 方法中声明一个与实例变量同名的变量时会发生什么呢？这种情况是完全合，因为在\
    \ **main** 方法内部声明的所有变量在方法外部都是“不可见”的。\n\n另一个令人困惑的情况是实例变量的名称也被用在构造方法的参数列表中。这个问题可以通过使用\
    \ **this** 关键字来解决，它代表当前对象。看这个示例：\n\n```\nclass testClass {\n  int x;\n  testClass(int\
    \ x) {\n    x = x;\n    this.x = x;\n  }\n\n  public static void main(String args[])\
    \ {\n    int x;\n    testClass obj = new testClass(100);\n    x = obj.x;\n  }\n\
    }\n```\n\n**this** 关键字不仅可以用于引用实例变量，还可以从一个构造方法调用另一个构造方法，或者将当前对象作为参数在方法之间传递。\n\n\
    重要说明：**this** 关键字只能在构造方法中使用。\n\n另一个使用 this 关键字的示例：\n\n```java\nclass Position\
