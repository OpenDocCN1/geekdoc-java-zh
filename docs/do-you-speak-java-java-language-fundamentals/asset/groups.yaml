  - "[PAGE 90]\n\nIn previous examples we were explicitly declaring the object references\
    \ of functional interface types:\n\n```\nFunction<Integer, String> spell\nInterface\
    \ lower\n```\n\nThen, lambda expressions were assigned to these object references.\
