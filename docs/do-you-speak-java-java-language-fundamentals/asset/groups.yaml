    ### 比较字符串


    `compareTo()` 方法按字典顺序对两个字符串进行比较。比较基于字符串中每个字符的 Unicode 值，并通过从左到右逐个比较字符，直到找到不相等的字符或到达其中一个字符串的末尾。`compareTo()`
    方法返回的值计算方式为不相等字符的数值之差（''a'' - ''b'' = -1）。如果其中一个字符串到达末尾，该方法返回两个字符串长度的差。


    ```java

    String s = "ab";

    int n;

    n = s.compareTo("ab"); // n = 0 ("ab" = "ab")

    n = s.compareTo("aa"); // n = +1 ("ab" > "aa")

    n = s.compareTo("bb"); // n = -1 ("ab" < "bb")

    n = s.compareTo("abaa"); // n = -2 ("ab" < "abaa")

    ```


    ### 访问字符串字符


