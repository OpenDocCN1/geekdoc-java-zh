  - '[PAGE 55]


    # Working with Objects


    Objects are the core of Java language, making it very important to have a good
    understanding of how to create objects and how to use their contents.


    # Creating Objects


    The process of creating a new object is called instantiation, and is performed
    using the new statement. The format of the new statement is this


    ```

    className objectReferenceVariable = new className(parameters);

    ```


    Example:


    ```

    myClass object1 = new myClass();

    ```


    This is what happens during execution of the above statement:


    +   1) “myClass object1” declares the variable object1 of type myClass. This variable
    can be used to reference any object of class myClass, that’s why such variables
    are also called object references.

    2) The new operator creates a new object; all instance declarations of variables,
    statement blocks, and methods are processed.

    3) The myClass() method is invoked to optionally initialize the instance variables
    of the newly created object.

    4) The reference between the variable object1 and the new object is established.'
  - "[PAGE 56]\n\n# Constructors\n\nThe myClass() method mentioned above is called\
