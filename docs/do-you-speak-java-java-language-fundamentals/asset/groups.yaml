- md: "\n# The \"for\" Statement\n\nThe for statement is used for implementing the\
    \ so-called “controlled” loops. Controlled loops are basically while loops, but\
    \ with explicitly specified code that initializes and iterates the value of the\
    \ variable(s) used in the loop controlling condition:\n\n![](img/5cf5236b394075810b8edd6af6a34316_38_0.png)\n\
    \nLet’s look at the previous example of the while statement:\n\n```java\nint n;\n\
    n = 2;\nwhile ( n > 0 ) {\n  system.out.println(\"n=\" + n);\n  n--;\n}\n```\n\
    \nSame logic can be coded with the for statement as follows:\n\n```java\nint n;\n\
    for ( n = 2; n > 0; n--) {\n  system.out.println(\"n=\" + n);\n}\n```\n\nThis\
    \ is a “classical” form of the for statement, and its format is:\n\nfor (initialization;\
    \ condition; iteration) { body }\n\nAnother form of the for statement is dealing\
    \ with collections (arrays, for example) and is called the “for-each” loop. We\
    \ will present it in a few examples.\n\nThe n in the above example is called a\
    \ loop control variable. There can be more than one loop control variables, as\
    \ in this example:\n\n```java\nint x, y, z;\n// Find when the sum of x, y, and\
    \ z drops to zero\nfor (x=3, y=5, z=7) x+y > 0; x--, y--, z--; {}; // Empty block;\
    \ could be specified without curly brackets\nSystem.out.println(\"x/y=\" + x +\
    \ \"/\" + y + \"/\" + z);\n```\n\nThe output of this code will be:\n\nx/y/z=-2/0/2\n\
    \nNote that the initialization (x=3, y=5, z=7) and the iteration (x--, y--, z--)\
    \ statements are comma separated.\n\n# Internal Loop Control Variables\n\nAnother\
    \ important note about the for statement must be made. When loop control variable\
    \ is defined within the for statement, it is “not visible\" outside of the for\
    \ statement:\n\n```java\nfor ( int n = 2; n > 0; n-- )\n{\n  System.out.println(\"\
    n=\" + n);\n} // the value of n is known\n\n// the n variable is not “visible”\
    \ beyond the for statement\nSystem.out.println(\"final n=\" + n); // Error: the\
    \ n is unknown\n```\n\n# The “for” statement without Loop Control Variables\n\n\
    It's worth mentioning that the for statement could be coded without the initialization\
    \ or the iteration expressions, or both:\n\n```java\nint n, max;\nn = 0;\nmax\
    \ = 100;\nboolean reachedMax = true;\nfor ( ; !reachedMax; ) // while NOT reachedMax\
    \ ...\n{\n  // the value of n until it exceeds the max\n  n++;\n  if (n > max)\
    \ reachedMax = true;\n}\nSystem.out.println(\"n=\" + n); // prints: n=128\n```\n\
    \n# The “for-each” Statement\n\nConsider an example when we need to calculate\
    \ the average value for a set of numbers, stored in an array. Here is how we can\
    \ accomplish that with the “classical” for statement: \n\n```java\nint nArray[]\
    \ = {1, 2, 3, 4, 5}; // array of five numeric values\ndouble avg = 0;\n\n// loop\
    \ through nArray elements (first element is numbered 0)\n// and calculate the\
    \ sum of all elements\n\nfor ( int i = 0; i < nArray.length; i++ )\n  avg += nArray[i];\n\
    \n// divide the sum by the number of elements\navg /= nArray.length;\nSystem.out.println(\"\
    avg=\" + avg); // prints: avg=3.0\n```\n\nThe same result can be accomplished\
    \ with the “for-each” version of the statement, which has the following format:\n\
    \n```java\nfor (type iterativeVariable: collection) { body }\n```\n\nThe above\
    \ example would look like this:\n\n```java\nint nArray[] = {1, 2, 3, 4, 5}; //\
    \ array of five numeric values\ndouble avg = 0;\n\n// The val must be assigned\
    \ the value of each array element,\n// one by one, in sequential order.\n\nfor\
    \ ( int val: nArray)\n  avg += val;\n\navg /= nArray.length;\nSystem.out.println(\"\
    avg=\" + avg); // prints: avg=3.0\n```\n\nPlease note, that the iterative variable\
    \ val must be the same or compatible data type as the elements of the collection\
    \ (array). The compatible data types are those that the original data type can\
    \ be implicitly promoted to. In this example, the original data type is int, which\
    \ can be promoted to long, float, or double.\n\n# The “break” Statement\n\nJava\
    \ provide two statements – break and continue, that can break the “natural” execution\
    \ flow of a loop or any block of statements. The break statement causes the termination\
    \ of a loop or any named block of code before it reaches its end. The continue\
    \ statement immediately starts the next iteration of a loop.\n\nLet’s start with\
    \ the break statement. We have already seen it in the switch construct where it\
    \ was used in the case expressions to jump out of the switch statement.\n\n# Breaking\
    \ Out from Labeled Blocks\n\nThe break statement has the following format:\n\n\
    ```java\nbreak [label];\n```\n\nThe label parameter is optional and is used to\
    \ jump out of any named (labeled) block of code. That block of code does not have\
    \ to be a loop or switch statement. Consider this example:\n\n```java\nint var;\n\
    var = 2;\n\nblock1:\n{\n    if (var != 1) break block1;\n    System.out.println(\"\
    Block 1 executed\");\n}\n\nblock2:\n{\n    if (var != 2) break block2;\n    System.out.println(\"\
    Block 2 executed\");\n}\n```\n\nThe output of this code will be “Block 2 executed”.\
    \ Since the variable var is not equal to 1, break block1 will jump out of block1\
    \ to the next statement. Note that this technique will also work when named blocks\
    \ are nested. break can jump from inner block out of outer block:\n\n```java\n\
    int var = 2;\n\nblock1 {\n  block2 {\n    block3 {\n      if (var == 1) break\
    \ block1;\n      if (var == 2) break block2;\n      if (var == 3) break block3;\n\
    \      System.out.println(\"Last statement of block3\");\n    }\n    System.out.println(\"\
    Last statement of block2\");\n  }\n  System.out.println(\"Last statement of block1\"\
    );\n}\n```\n\nThe output of this code will be \"Last statement of block1\". The\
    \ (var==2) condition will be true, and break2 will jump out of blocks3 and block2\
    \ to the next statement of block1.\n\n# Breaking Out from Loops\n\nWhen break\
    \ statement is used without its label parameter, it interrupts execution of loop\
    \ containing break. In case of nested loops, labels can be used to identify each\
    \ loop, and the label parameter will tell which loop to terminate.\n\nExamples:\n\
    \n```java\nint i;\n// The for loop\nfor (i=9; i>0; i--) {\n  System.out.println(\"\
    i=\" + i);\n  if (i==7) break;\n}\n// The while loop\ni = 9;\nwhile (i>0) {\n\
    \  System.out.println(\"i=\" + i);\n  if (i==7) break;\n}\n// The do...while loop\n\
    i = 9;\ndo\n{\n  System.out.println(\"i=\" + i);\n  if (i==7) break;\n} while\
    \ (i>0);\n```\n\nAll three loops iterate the variable i from 9 down to 0, but\
    \ all will stop when i reaches 7, producing output:\n\n```\ni=9\ni=8\ni=7\n```\n\
    \nHere is an example of breaking out from nested loops:\n\n```java\nint x, y =\
    \ 0;\nloop1A: for (x=9; x>0; x--) {\n  loop1B: for (y=7; y>0; y--) {\n    if (x==7\
    \ && y==7) break loop1A;\n  }\n}\nSystem.out.println(\"x/y=\" + x + \"/\" + y);\
    \ // prints: x/y=7/7\n```\n\n# The \"continue\" Statement\n\nThe continue statement\
    \ can be used only within the body of a loop to stop the current iteration and\
    \ start the next iteration. In case of labeled nested loops, the continue statement\
    \ can specify which loop to resume.\n\nThe format of the continue statement is:\n\
    \n```java\ncontinue [label]\n```\n\nThe label parameter specifies the name (label)\
    \ assigned to a loop and is optional.\n\nThe continue statement works similar\
    \ to the break statement, but instead of terminating the loop, it forces the next\
    \ iteration of the specified loop.\n\nExample:\n\n```java\n// simple for loop\n\
    int i;\nfor (i=4; i>1; i--) {\n  if (i==3) continue; // go to next iteration when\
    \ i = 3\n  System.out.println(\"i=\" + i); // will print i=4 and i=2\n}\n\n//\
    \ nested loops\nint x,y = 0;\nloopA: for (x=0; x<=1; x++) {\n  loopB: for (y=0;\
    \ y<=1; y++) {\n    if (x == y ) continue loopA;\n    System.out.println(x + \"\
    /\" + y); // will print only 1/0\n  }\n}\n```\n\n# Arrays\n\nAn array is a multi-dimensional\
    \ collection of data elements of the same type and referenced by a common name\
    \ and a numeric index, e.g. - myArray[3].\n\nJava provides a special syntax for\
    \ handling arrays.\n\n# Declaring Arrays\n\nThere are two equivalent formats of\
    \ the array declaration:\n\n- type arrayName [];\n- type [] arrayName;\n\nFor\
    \ example, int myArray [] declares the myArray variable as the name of a one-dimensional\
    \ array of integer elements. While each data element of the array is of type int,\
    \ the myArray variable is said to be of type int[].\n\nNote: No physical array\
    \ is actually created at the time of declaration.\n\n# Creating Arrays\n\nAfter\
    \ the array is declared, it can be created in one of two ways. The first way is\
    \ to use an array initializer when the array is declared:\n\n```java\nint myArray\
    \ [] = { 1, 2, 3, 4, 5 }; // the array of five integers\n```\n\nAnother way of\
    \ creating arrays is using the new statement:\n\n```java\nint myArray[]; // declares\
    \ myArray as an array variable\nmyArray = new int[5]; // creates the array {0,\
    \ 0, 0, 0, 0}\nmyArray[0] = 1; // assigns 1 to the first element of the array\n\
    myArray[2] = 3; // assigns 3 to the third element of the array\n```\n\nNote, that\
    \ the new statement creates an array and assigns the default values to all of\
    \ its elements. The default value depends on the array elements’ type; for numbers\
    \ - 0, for Boolean - false, for classes - null.\n"
  mdcn: "\n\n# \"for\" 语句\n\n`for` 语句用于实现所谓的“控制”循环。控制循环基本上是 `while` 循环，但它具有显式指定的代码，用于初始化和迭代循环控制条件中使用的变量：\n\
    \n![](img/5cf5236b394075810b8edd6af6a34316_38_0.png)\n\n让我们看看上一个 `while` 语句的示例：\n\
    \n```java\nint n;\nn = 2;\nwhile ( n > 0 ) {\n  system.out.println(\"n=\" + n);\n\
    \  n--;\n}\n```\n\n相同的逻辑可以使用 `for` 语句如下所示编码：\n\n```java\nint n;\nfor ( n = 2;\
    \ n > 0; n--) {\n  system.out.println(\"n=\" + n);\n}\n```\n\n这是 `for` 语句的“经典”形式，其格式为：\n\
    \nfor (初始化; 条件; 迭代) { 主体 }\n\n`for` 语句的另一种形式是处理集合（例如数组），被称为“for-each”循环。我们将在几个示例中介绍它。\n\
    \n上面示例中的 `n` 被称为循环控制变量。可以有多个循环控制变量，如例所示：\n\n```java\nint x, y, z;\n// 寻找 x, y\
    \ 和 z 之和降为 0 的时刻\nfor (x=3, y=5, z=7) x+y > 0; x--, y--, z--; {}; // 空块；可以不带大括号指定\n\
    System.out.println(\"x/y=\" + x + \"/\" + y + \"/\" + z);\n```\n\n这段代码的输出将是：\n\
    \nx/y/z=-2/0/2\n\n注意初始化 (x=3, y=5, z=7) 和迭代 (x--, y--, z--) 语句是用逗号分隔的。\n\n# 内部循环控制变量\n\
    \n关于 `for` 语句的另一个重要说明：当循环控制变量在 `for` 语句内部定义时，它在 `for` 语句之外是“不可见的”：\n\n```java\n\
    for ( int n = 2; n > 0; n-- )\n{\n  System.out.println(\"n=\" + n);\n} // n 的值是已知的\n\
    \n// n 变量在 for 语句之外是“不可见的”\nSystem.out.println(\"final n=\" + n); // 错误：n 未定义\n\
    ```\n\n# 无循环控制变量的 “for” 语句\n\n值得提到，`for` 语句可以在没有初始化或迭代表达式（或两者都没有）的情况下编码：\n\n```java\n\
    int n, max;\nn = 0;\nmax = 100;\nboolean reachedMax = true;\nfor ( ; !reachedMax;\
    \ ) // 当未达到 max 时...\n{\n  // n 的值直到它超过 max\n  n++;\n  if (n > max) reachedMax\
    \ = true;\n}\nSystem.out.println(\"n=\" + n); // 输出：n=128\n```\n\n# “for-each”\
    \ 语句\n\n考虑这样一个示例：我们需要计算存储在数组中的一组数字的平均值。以下是我们使用“经典” `for` 语句来实现这一点：\n\n```java\n\
    int nArray[] = {1, 2, 3, 4, 5}; // 包含五个数值的数组\ndouble avg = 0;\n\n// 遍历 nArray\
    \ 元素（第一个元素索引为 0）\n// 并计算所有元素的和\n\nfor ( int i = 0; i < nArray.length; i++ )\n\
    \  avg += nArray[i];\n\n// 将和除以元素个数\navg /= nArray.length;\nSystem.out.println(\"\
    avg=\" + avg); // 输出：avg=3.0\n```\n\n使用语句的“for-each”版本也可以实现相同的结果，其格式如下：\n\n```java\n\
    for (类型 迭代变量: 集合) { 主体 }\n```\n\n上面的示例看起来如下：\n\n```java\nint nArray[] = {1, 2,\
    \ 3, 4, 5}; // 包含五个数值的数组\ndouble avg = 0;\n\n// val 必须被赋值每个数组元素的值\n// 按照顺序逐一个。\n\
    \nfor ( int val: nArray)\n  avg += val;\n\navg /= nArray.length;\nSystem.out.println(\"\
    avg=\" + avg); // 输出：avg=3.0\n```\n\n请注意，迭代变量 `val` 的数据类型必须与集合（数组）元素的数据类型相同或兼容。兼容的数据类型是原始数据类型可以隐式提升的类型。在这个示例中，原始数据类型是\
    \ `int`，它可以提升为 `long`、`float` 或 `double`。\n\n# “break” 语句\n\nJava 提供了两个语句——`break`\
    \ 和 `continue`，它们可以中断循环或任何语句块的“自然”执行流。`break` 语句会导致循环或任何命名代码块在到达末尾之前终止。`continue`\
    \ 语句立即开始循环的下一次迭代。\n\n让我们从 `break` 语句开始。我们已经在 `switch` 结构中见过它，它被用于在 `case` 表达式中跳出\
    \ `switch` 语句。\n\n# 跳出带标签块\n\n`break` 语句的格式如下：\n\n```java\nbreak [标签];\n```\n\n\
    标签 `label` 是可选的，用于跳出任何命名的（带标签的）代码块。该块不需要是循环或 `switch` 语句。考虑这个示例：\n\n```java\n\
    int var;\nvar = 2;\n\nblock1:\n{\n    if (var != 1) break block1;\n    System.out.println(\"\
    Block 1 executed\");\n}\n\nblock2:\n{\n    if (var != 2) break block2;\n    System.out.println(\"\
    Block 2 executed\");\n}\n```\n\n这段代码的输出将是“Block 2 executed”。由于变量 `var` 不等于 1，`break\
    \ block1` 将跳出 `block1` 到下一条语句。注意，这种技术在命名块块嵌套时同样有效。`break` 可以从内部块跳到外部块之外：\n\n```java\n\
    int var = 2;\n\nblock1 {\n  block2 {\n    block3 {\n      if (var == 1) break\
    \ block1;\n      if (var == 2) break block2;\n      if (var == 3) break block3;\n\
    \      System.out.println(\"Last statement of block3\");\n    }\n    System.out.println(\"\
    Last statement of block2\");\n  }\n  System.out.println(\"Last statement of block1\"\
    );\n}\n```\n\n这段代码的输出将是 \"Last statement of block1\"。条件 `(var==2)` 为真，`break2`\
    \ 将跳出 `block3` 和 `block2`，到 `block1` 的下一条语句。\n\n# 跳出循环\n\n当 `break` 语句不带标签参数使用时，它会中断包含\
    \ `break` 的循环的执行。在嵌套循环的情况下，可以使用标签来识别每个循环，标签参数将指示终止哪个循环。\n\n示例：\n\n```java\nint\
    \ i;\n// for 循环\nfor (i=9; i>0; i--) {\n  System.out.println(\"i=\" + i);\n  if\
    \ (i==7) break;\n}\n// while 循环\ni = 9;\nwhile (i>0) {\n  System.out.println(\"\
    i=\" + i);\n  if (i==7) break;\n}\n// do...while 循环\ni = 9;\ndo\n{\n  System.out.println(\"\
    i=\" + i);\n  if (i==7) break;\n} while (i>0);\n```\n\n所有的 `for` 循环在 `i` 从 9 递减到\
    \ 0，当 `i` 等于 7 时 `break`。\n\n所有的 `while` 循环在 `i` 从 9 递减到 0，当 `i` 等于 7 时 `break`。\n\
    \n所有的 `do...while` 循环在 `i` 从 9 递减到 0，当 `i` 等于 7 时 `break`。\n\n所有的 `for` 循环在 `i`\
    \ 从 9 递减到 0，当 `i` 等于 7 时 `break`。\n\n所有的 `while` 循环在 `i` 从 9 递减到 0，当 `i` 等于 7\
