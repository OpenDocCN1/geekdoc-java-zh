    Since a stand-alone string literal represent a String object, you can work with
    it as an object, without creating a reference. For example, you can invoke the
    length() instance method of the String class to get the length of a literal, as
    it

    fallows:


    ```

    int n = "text"; // n = 4

    ```


    Another important fact about the String object:


    > Once created and initialized, a String object cannot be modified. Its value
    cannot be appended, truncated, or replaced. If you need a modifiable string –
    use the StringBuffer class (not covered in this book).


    # Comparing Strings


    It is important to understand that there is a difference between comparing two
    actual string values and comparing two references to String objects:


    String s1 = "text"

    String s2 = "text"

    boolean b = (s1 == s2); // b=true


    s1 and s2 are pointing to same

    String object having value "text"


    String s3 = new String("text")

    String s4 = new String("text")

    boolean b = (s3 == s4); // b-false


    s3 and s4 are pointing to

    different String objects having

    same value "text"


    To compare the actual values of two strings (which in fact are encapsulated within
    String objects), we need to use the instance method equals() of class String:


    ```

    String s1 = new String("text")

    String s2 = new String("text")

    boolean b = ( s1.equals(s2) ); // b = true

    ```'
