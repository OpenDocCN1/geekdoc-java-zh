  - "[PAGE 149]\n\n# The Stream API\n\nStream API is a new application programming\
    \ interface added in JDK 8. It is not an extension to or a replacement of the\
    \ previously discussed I/O streams (byte and character streams). The stream API\
    \ introduced a new stream concept. It sees any stream as a sequence of objects\
    \ on which various manipulations are performed. Using the stream API classes,\
    \ we can apply different transformations to the stream (sorting, filtering, etc.)\
    \ and produce either another stream (i.e. sequence of objects) or a final result.\
    \ There are no ultimate “destination points” like files or network sockets. For\
    \ example, we might want to find the array element with the highest value. In\
    \ this case the result is not a destination, but rather some value derived from\
    \ the source data, Note that the data source remains unchanged in stream processing.\n\
    \nLet’s start with a very small and simple example.\n\n// Find the lowest value\
    \ stored in an array of integers\n\n```\nimport java.util.*;\nimport java.util.stream.*;\n\
    ```\n\n```\nclass testStreamAPI {\n    public static void main (String[] args)\
    \ {\n        int[] integers = {8, 5, 7, 2, 3, 4};\n        IntStream inputStream\
    \ = Arrays.stream(integers);\n        OptionalInt val = inputStream.min();\n \
    \       System.out.println(val.getAsInt());\n    }\n```\n\n> The static method\
    \ stream()\nof class Arrays converts the array integers into a sequential stream\
    \ of integers\n\n> The min() method of IntStream\nfinds the minimum element of\
    \ the stream and returns it as an OptionalInt\n\n> The getAsInt() method of the\
    \ OptionalInt\nretrieves the integer value.\n\nWhat should be noted about this\
    \ example is that the min() method applied to the stream produces a final result,\
    \ i.e. the result is not a stream. Methods that produce final results are known\
    \ as terminal operations, consume the stream. Other methods that return the result\
    \ as another stream are called intermediate operations. The next example presents\
    \ two-stage stream processing involving intermediate and terminal methods."
  - '[PAGE 150]


    Let’s say that we have an array of double numbers and we want to calculate the
    sum of all elements, but first round them up to the next larger integer. This
    can be accomplished with a single line of code, but we will present and explain
    each step of the process.


    The first step is to convert the array of doubles into a stream. We can use the
    static method stream of the class Arrays that returns a sequential stream of type
    DoubleStream.


    ```

    double[] doubles = {1.5, 2.6, 3.3};

    DoubleStream dblstream = Arrays.stream(doubles);

    ```


    The next step is to transform the stream of doubles into a stream of integers
    while rounding each double to the next larger integer. We can utilize the mapToInt
    method of the interface DoubleStream for this. The mapToInt method is declared
    as follows:


    ```

    IntStream mapToInt(DoubleToIntFunction mapper)

    ```


    It accepts an object of the functional interface DoubleToIntFunction, applies
    its method applyAsInt to each element of the stream, and returns the new IntStream,
    so we need to create an object of type DoubleToIntFunction, implementing the method
    applyAsInt according to our needs. The easiest way to do this is by using a lambda
    expression:


    ```

    DoubleToIntFunction mapper = n -> (n + 0.5);

    ```


    This statement will create the object mapper of type DoubleToIntFunction with
    the applyAsInt method defined as:


    ```

    int applyAsInt(double n) { return (int)(n+0.5); }

    ```


    We’re ready to transform a DoubleStream into an IntStream:


    ```

    IntStream intstream = dblstream.mapToInt(mapper);

    ```


    The final step is to calculate the sum of all elements of the integer stream using
    the sum() method of IntStream:


    ```

    int sum = intstream.sum();

    ```


    When put together, the code will look as follows:


    ```

    double[] doubles = {1.5, 2.6, 3.3};

    DoubleStream dblstream = Arrays.stream(doubles);

    DoubleToIntFunction mapper = n -> (n + 0.5);

    IntStream intstream = dblstream.mapToInt(mapper);

    int sum = intstream.sum();

    ```'
- md: "\nThe result calculated by this code is 8.\n\nNow, as mentioned before, the\
    \ whole process can be expressed in one line:\n`int sum = Arrays.stream(doubles).mapToInt(n\
    \ -> (int) (n + 0.5)).sum();`\n\n![](img/5cf5236b394075810b8edd6af6a34316_151_0.png)\n\
    \nIf, we need to put more complex logic into the mapper (i.e. into the applyAsInt\
    \ method), we can define a custom method and specify it in the lambda expression:\n\
    \n```java\npublic static int round(double n) {\n    int i = (int) (n + 0.5); //\
    \ round the double number\n    System.out.println(\"in=\" + n + \" out=\" + i);\n\
    \    return i;\n}\n```\n\n```java\nint sum = Arrays.stream(doubles).mapToInt(n\
    \ -> round(n)).sum();\n```\n\nThe mapToInt() method is an intermediate operation\
    \ - it accepts a stream and returns another stream. The sum() method is a terminal\
    \ operation - it consumes the stream and returns a final result.\n\nThe next example\
    \ demonstrates the process of iterating through all elements (objects) of a stream.\
    \ We utilize the forEach() instance method of class Stream to perform the loop.\
    \ The forEach() method is declared as follows:\n`forEach(Consumer<? super T> action)`\n\
    \nFor each object of the stream, the forEach() method invokes the accept() method\
    \ of Consumer, providing it with the object retrieved from the stream. The Consumer\
    \ is a functional interface, so an object of type Consumer can be created either\
    \ via a lambda expression or by using a method reference. Both approaches are\
    \ presented in the following example.\n\n```java\n// Using the forEach() method\
    \ of class Stream\nimport java.util.*;\nimport java.util.stream.*;\n\nclass testStream\
    \ {\n\n    public static void main(String[] args) {\n\n        String[] words\
    \ = {\"One\", \"Two\", \"Three\"};\n        Stream<String> stream = Arrays.stream(words);\n\
    \        stream.forEach(w -> System.out.print(w));\n\n        stream = Arrays.stream(words);\n\
    \        stream.forEach(System.out::print);\n    }\n}\n```\n\n> This lambda expression\
    \ will create a Consumer object with its accept() method implemented as System.out.println(w)\n\
    \n> This method will create a Consumer object and pass to it the print method\
    \ of the System.out object\n\nThe above code prints two lines:\n\n\"OneTwoThree\"\
    \n\"OneTwoThree\"\n\nBefore we conclude this overview of the Stream API, we want\
    \ to mention that one of the benefits offered by the Stream API is parallel processing.\
    \ The operations on a stream can occur in parallel, assuming the environment supports\
    \ parallelism. To switch to parallel processing, use the parallel() method:\n\n\
    ```java\nint sum = Arrays.stream(doubles)\n    .parallel()\n    .mapToInt(n ->\
    \ round(n)).sum();\n```\n\n# Observable and Observers\n\nThe Observable class,\
    \ together with the Observer interface offers a simple mechanism of establishing\
    \ communication between objects. One object (observable object) can be watched\
    \ (observed) by one or more other objects (observers). When needed, the object\
    \ being observed can notify observers, and they can perform some actions.\n\n\
    | class M extends Observable | class W1 implements Observer |\n| :--- | :--- |\n\
    | m = new M() | w1 = new W1() |\n| m.addObserver(w1) | w1.update() |\n| m.addObserver(w2)\
    \ | class W2 implements Observer |\n| | w2 = new W2() |\n| m.setChanged() | w2.update()\
    \ |\n| m.notifyObservers(observers) | |\n\nExample:\n```java\nimport java.util.*;\n\
    public class myClass extends observable implements Observer {\nString myName;\n\
    public myClass(String s) { myName = s; }\n\npublic void update(Observable m, Object\
    \ arg)\n  { System.out.println(myName + \" received a \" + arg + \" from \" +\
    \ m.myName); }\n\npublic static void main(String args[])\n  { myClass m = new\
    \ myClass(\"manager\");\n\n  m.addObserver(new myClass(\"Bob\"));\n  m.addObserver(new\
    \ myClass(\"Joe\"));\n\n  m.setChanged();\n\n  m.notifyObservers(\"message\");\n\
    }\n```\n\n![](img/5cf5236b394075810b8edd6af6a34316_153_0.png)\n\n> Create two\
    \ new objects and register them as objects of m.\n\n> The changed() must be called\
    \ before each notification\n\n> The update() method of each observer will be called;\
    \ Note: m will be passed to update() automatically.\n\nThe output of this program:\n\
    \"Bob received a message from manager\"\n\"Joe received a message from manager\"\
    \n\n# Enumerations\n\nThe idea behind enumerations is to provide an easy way of\
    \ defining sets of constants not bound to any primitive or object types, which\
    \ usually restricts the scope of their usage. Java’s solution to this problem\
    \ was a new type of classes, whose instances are treated as constants. Here is\
    \ a sample declaration of an enumeration class:\n\n```java\nenum myEnum { MIN,\
    \ MAX }\n```\n\nNotice the usage of enum instead of class. The MIN and MAX are\
    \ the instances (objects) of the class myEnum and are called enumeration constants.\
    \ They are implicitly declared as public, static, final. The enumeration constants\
    \ are created (instantiated) automatically, when the enumeration class is first\
    \ referenced in the program. Therefore, you do not need to use the new operator\
    \ (in fact, you cannot) to create an object of the enumeration class. Besides\
    \ these differences, the enumeration classes are still Java classes, and as such,\
    \ they can have static and instance variables, methods, statement blocks, and\
    \ even constructors.\n\nExample:\n\n| myEnum { MIN, MAX; } | Static statement\
    \ block; executes when class myEnum is loaded into the JVM |\n| :--- | :--- |\n\
    | static { System.out.println(\"Class myEnum loaded\"); } | Instance statement\
    \ block; executes when an instance of the class is created. |\n| { System.out.println(this\
    \ + \" created\"); } | |\n| public static void main(String args[]) { myEnum min,\
    \ max; } | First reference to class myEnum; Declares two variables of type myEnum\
    \ |\n\nThis program produces the output:\n\n```\nMIN created\nMAX created\nClass\
    \ myEnum created\n```\n\nNow, let’s see what we can do with the enumerations.\
    \ The best way to illustrate the benefits of enumerations is to go through examples.\
    \ Imagine that we have a method that monitors weather conditions at major national\
    \ airports. By employing enumeration, we can ensure at compile-time that our method\
    \ receives only a predefined set of airports, which reduces the risk of runtime\
    \ errors.\n\n```java\nenum Airport {\n    JFK(\"New York\"),\n    PHL(\"Philadelphia\"\
    ),\n    MIA(\"Miami\");\n\n    String state, city;\n\n    Airport(String s, String\
    \ c) {\n        this.state = s;\n        this.city = c;\n    }\n\n    public static\
    \ double getTemp(Airport a) { return 80.0; }\n    public static String getCity(Airport\
    \ a) { return a.city; }\n    public static String getState(Airport a) { return\
    \ a.state; }\n\n    public static void main(String args[]) {\n        Airport\
    \ a;\n        a = Airport.MIA;\n        System.out.println(getCity(a) + \", \"\
    \ + getState(a) + \" temp=\" + getTemp(a));\n    }\n}\n```\n\nThis program produces\
    \ the output: **Miami, FL temp=80.0**\n"
