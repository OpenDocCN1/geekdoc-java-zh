    \ // instance variable\n        { myNumber = ++ totalCount; } // statement block\n\
    \n    // Main program\n    public static void main(String args[]) {\n        myClass\
    \ obj1 = new myClass(); // creates the object obj1\n        myClass obj2 = new\
    \ myClass(); // creates the object obj2\n        System.out.println(obj1.myNumber);\
