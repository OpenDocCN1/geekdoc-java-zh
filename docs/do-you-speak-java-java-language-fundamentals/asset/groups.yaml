    \ indicates that this constructor can accept the type-variable X, which is not\
    \ related to any type parameters in the class declaration.\n\nVery important note:\
    \ all generic type-variables of a constructor (in this case - X) are local to\
    \ the constructor. Therefore, you should not use the names of type variables declared\
    \ by the class:\n\n```\nclass GenericClass <T> {\n    public T key;\n    <T> GenericClass(T\
