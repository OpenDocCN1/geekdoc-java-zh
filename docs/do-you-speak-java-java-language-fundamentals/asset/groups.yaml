    }\n```\n\n**this** 关键字不仅可以用于引用实例变量，还可以从一个构造方法调用另一个构造方法，或者将当前对象作为参数在方法之间传递。\n\n\
    重要说明：**this** 关键字只能在构造方法中使用。\n\n另一个使用 this 关键字的示例：\n\n```java\nclass Position\
