  - "[PAGE 118]\n\n# Daemon Threads\n\nWhen you execute the previous program, you\
    \ will notice that the main thread ends once you hit Enter, but the thread will\
    \ continue running until you hit again. Threads that continue execution after\
    \ the parent thread dies are called user threads. Another type of threads is called\
    \ daemon threads. A daemon thread dies once its parent thread dies. By default,\
    \ a newly created thread is a daemon; to make it a daemon, you need to mark it\
    \ as such by calling setDaemon(true). Make sure it is done before you start the\
    \ thread:\n\n```\nThread th = new Thread(new myClass() );\nth.setDaemon(true);\n\
    th.start();\n```\n\n# Interrupting Thread Execution\n\nA thread can be interrupted\
    \ by another thread via the instance method interrupt():\n\n```\nThread th = new\
    \ Thread(new myClass() );\nth.start();\n```\n\n```\nth.interrupt();\n```\n\nThe\
    \ interrupt method sets a flag in the thread object, which has to be checked in\
    \ the run() method to have any effect.\n\n```\npublic void run() {\n    if (Thread.interrupted())\
    \ {\n        System.out.println(\"I was interrupted\");\n    }\n}\n```\n\nNote\
    \ that interrupt() is an instance method, and interrupted() is a static method.\n\
    \nNeither of these methods stop tread execution. They merely allow to \"send a\
    \ signal\" to the thread, but how to process this \"signal\" is up to the thread\
    \ being interrupted."
- md: "\n## Waiting on a Thread to Die\n\nIf the main thread depends on the execution\
    \ of its child threads, it can use the join() method of class Thread to \"connect\"\
    \ to the child thread and wait until it finishes.\n\n```java\nThread th = new\
    \ Thread(new myClass());\nth.start();\n\ntry {\n    th.join(1000);\n    th.join();\n\
    } catch (InterruptedException e) {\n    System.out.println(\"Exception: \" + e);\n\
    }\n```\n\n## Synchronization\n\nIn multithreaded programming, it is often critical\
    \ to restrict the access to shared resources to only one thread at a time. Java\
    \ offers a resource locking mechanism that can be employed in two ways through\
    \ synchronized methods or synchronized statement blocks. Both approaches will\
    \ be discussed in a few moments.\n\nFirst, to understand Java's synchronization\
    \ and locking mechanism we need to know two key terms: the monitor and the lock.\
    \ When a thread acquires a lock, it is said to have entered the monitor. This\
    \ does not add much to the understanding of the topic itself, but is important\
    \ because these terms are used in all Java manuals.\n\n### Synchronized Methods\n\
    \nYou can declare any method of your class as synchronized:\n```java\nsynchronized\
    \ static public void method1() {}\nsynchronized public void method2() {}\n```\n\
    \nBy doing so, you activate the locking mechanism either on the class level, or\
    \ on the object level, or both.\n\nThe object-level synchronization works as follows:\n\
    \n| Description |\n| :--- |\n| All synchronized instance methods of an object\
    \ are controlled by the same lock. Only one synchronized instance method of that\
    \ object can be executed at any point in time. |\n\nThe class-level synchronization\
    \ works as follows:\n\n| Description |\n| All synchronized static methods of a\
    \ class are controlled by the same lock. Only one synchronized static method of\
    \ the class can be executed at any point in time. |\n\nNote that object-level\
    \ synchronization and class-level synchronization work independently of each other.\n\
    \n### Synchronized Statement Blocks\n\nThere might be situations when you cannot\
    \ use the synchronized methods such as when you're not allowed to modify the class.\
    \ In such circumstances you can use a synchronized statement block. Here is how\
    \ a synchronized statement block is defined:\n\n```java\nsynchronized ( object\
    \ ) { statement block }\n```\n\nThis statement can be used anywhere in the thread\
    \ execution path (i.e. in the run() methods or any other methods called by it).\
    \ The statement block will be locked on the object and will be accessible only\
    \ by one thread at a time.\n\nAn important note must be made regarding the object\
    \ used in the above construct. The object could be an object of any class, even\
    \ a dummy object created just for the purpose of being a lock. As long as all\
    \ threads have access to the same object – synchronization on the statement block\
    \ will work.\n\nThe example below demonstrates the usage of statement block synchronization.\n\
    \nExample: only one thread at a time execute the synchronized block\n```java\n\
    import java.io.IOException;\n\nclass testSyncBlock implements Runnable {\n   \
    \ Object lock;\n    public static void main(String[] args) {\n        testSyncBlock\
    \ mainThread = new testSyncBlock();\n        mainThread.lock = new Object();\n\
    \n        Thread th1 = new Thread(mainThread, \"thread1\");\n        Thread th2\
    \ = new Thread(mainThread, \"thread2\");\n        th1.start();\n        th2.start();\n\
    \n        try {\n            th1.join();\n            th2.join();\n        } catch\
    \ (InterruptedException e) { System.out.println(e); }\n    }\n\n    public void\
    \ run() {\n        String name = Thread.currentThread().getName();\n        System.out.println(name\
    \ + \" started\");\n\n        synchronized (lock) {\n            try {\n     \
    \           System.out.println(\"hit enter...\");\n                System.in.read();\n\
    \            } catch (Exception e) { System.out.println(e); }\n        }\n   \
    \ }\n}\n```\n\n## Advanced Inter-Thread Communication\n\nIn most cases synchronized\
    \ methods and synchronized statement blocks are sufficient for establishing safe\
    \ access to shared resources. However, there might be a need for more granular\
    \ control over the synchronization process. The following three methods defined\
    \ by the Object class allow two or more threads to communicate with each other:\n\
    \nwait(), notify(), notifyAll()\n\nThe wait() method releases the lock held by\
    \ the current thread and puts the thread in a waiting state.\n\nThe notify() method\
    \ wakes up one of the waiting threads. The choice of which thread to wake up is\
    \ arbitrary.\n\nThe notifyAll() method wakes up all threads waiting on the lock.\
    \ The above methods must be used within either synchronized methods or synchronized\
    \ blocks. The example below illustrates how communication between threads is established.\n\
    \n```java\nimport java.io.IOException;\n\nclass testNotify implements Runnable\
    \ {\n    Object lock;\n    String[] s = {\"one\", \"two\", \"three\", \"four\"\
    };\n    int count = 0;\n\n    public static void main(String[] args) {\n     \
    \   testNotify me = new testNotify();\n        me.lock = new Object();\n\n   \
    \     Thread th1 = new Thread(me, \"thread1\");\n        Thread th2 = new Thread(me,\
    \ \"thread2\");\n        th1.start();\n        th2.start();\n    }\n\n    public\
    \ void run() {\n        String name = Thread.currentThread().getName();\n    \
    \    synchronized (lock) {\n            try {\n                while (count <\
    \ s.length) {\n                    System.out.println(name + \" : \" + s[count++]);\n\
    \                    lock.notify();\n                    lock.wait();\n      \
    \          }\n            } catch (Exception e) { System.out.println(e); }\n \
    \       }\n    }\n}\n```\n\nNote that the wait(), notify(), and notifyAll() methods\
    \ must be invoked by the object on which the current thread is locked. Otherwise,\
    \ the IllegalMonitorStateException would be thrown.\n\nThe output of the above\
    \ program is this:\n\n- thread1: one\n- thread2: two\n- thread1: three\n- thread2:\
    \ four\n\n## Collections Framework\n\nThe Collections Framework is a set of interfaces\
    \ and classes that provide a standardized approach for managing groups of objects.\
    \ The cornerstone of the whole concept is the collection, a generic term for a\
    \ set of objects grouped together by some means. Based on the way collections\
    \ are built and accessed, all collections can be divided into three major categories:\n\
    \n- LIST - a sequence of objects; examples: arrays, sorted lists, queues, stacks.\n\
    - SET - a group of unique objects; no duplicates allowed.\n- MAP - a group of\
    \ key/value pairs of objects.\n\nEach group can be divided further into sub-groups.\
    \ For example, a list could be sorted, linked, organized as a stack, etc. However,\
    \ regardless of the differences between collections, most of the operations upon\
    \ them are performed in a similar manner, through standardized interfaces. This\
    \ chapter provides an overview of such operations.\n\n# Creating Collections\n\
    \nMost of the collections use the add() method of the corresponding class for\
    \ putting new elements into collections:\n\n```java\n// Create a LinkedList collection\n\
    LinkedList<String> list = new LinkedList<String>();\nlist.add(\"A\");\nlist.add(\"\
    B\");\nlist.add(1, \"C\");\nSystem.out.println(list); // prints: [A, C, B]\n```\n"
  mdcn: "\n\n## 等待线程结束\n\n如果主线程依赖于子线程的执行，它可以使用 `Thread` 类的 `join()` 方法来“连接”到子线程并等待其完成。\n\
    \n```java\nThread th = new Thread(new myClass());\nth.start();\n\ntry {\n    th.join(1000);\n\
    \    th.join();\n} catch (InterruptedException e) {\n    System.out.println(\"\
    Exception: \" + e);\n}\n```\n\n## 同步\n\n在多线程编程中，将对共享资源的访问限制为一次只有一个线程通常至关重要的。Java\
    \ 提供了一种资源锁定机制，可以通过 `synchronized` 方法或 `synchronized` 语句块（statement blocks）以两种方式使用。我们稍后将对这两种方法进行讨论。\n\
    \n首先，为了理解 Java 的同步和锁定机制，我们需要了解两个关键术语：监视器（monitor）和锁（lock）。当一个线程获取锁时，被称为它进入了监视器。这对于理解主题本身没有太大帮助，但非常重要，因为这些术语出现在所有的\
    \ Java 手手册中。\n\n### 同步方法\n\n你可以将类中的任何方法声明为 `synchronized`：\n```java\nsynchronized\
    \ static public void method1() {}\nsynchronized public void method2() {}\n```\n\
    \n通过这种方式，你可以在类级别、对象级别或两者级别上激活锁定机制。\n\n对象级别的同步工作原理如下：\n\n| 描述 |\n| :--- |\n| 一个对象的所有同步实例方法都由同一个锁控制。在任何时刻，该对象只能执行一个同步实例方法。\
