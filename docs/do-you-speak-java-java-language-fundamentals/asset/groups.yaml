    # Interfaces vs. Abstract Classes


    You might have noticed already that an interface and an abstract classes are similar.
    Both can declare constants and provide method templates for further implementation
    by other classes. So the question is – what can we do with interfaces that cannot
    be done with classes?


    Let''s take a look at an example:


    ```

    abstract class Fruit

    getVolume()


    class Orange extends Fruit

    getVolume() {...}


    abstract class Package

    getVolume()


    class Box extends Package

    getVolume() {...}

    ```


    The getVolume() method of the Orange and Box objects can be accessed as follows:


    ```

    Orange orange = new Orange(); orange.getVolume();

    Fruit fruit = new Orange(); fruit.getVolume();

    ```


    ```

    Box box = new Box(); box.getVolume();

    Package pack = new Box(); pack.getVolume();

    ```


    Since the Orange and Box classes belong to different hierarchies, it''s not possible
    to create an object reference that can be used for referencing both objects.


    Interfaces allow us to do that because the class hierarchy and the interface hierarchy
    are unrelated. Interfaces break the class hierarchy boundaries. Otherwise unrelated
    classes can implement the same interface, and a variable of that interface type
    can reference the objects of classes.


    ```

    class Shape

    getVolume()


    class Orange implements Shape

    getVolume() {...}


    class Box implements Shape

    getVolume() {...}

    ```


    Example: using a single interface variable to reference class objects in different
    class hierarchies.'
