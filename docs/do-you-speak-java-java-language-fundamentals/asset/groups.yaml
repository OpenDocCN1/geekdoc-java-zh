    \ 方法接收一个 `IntPredicate` 类型的对象并将其返回。这里的目标是将 lambda 表达式传递给此方法并将其作为对象返回。lambda 表达式本身并没有告诉我们它被用于哪个函数式接口，因此我们需要向\
    \ Java 编译器提供此信息，可以直接将 lambda 表达式赋值给函数式接口变量，或者将 lambda 表达式作为函数式接口类型的参数传递。因此，在这个示例中，lambda\
    \ 表达式 `n -> (n>min && n<max)` 创建了一个 `IntPredicate` 类型的对象，将其 `test` 方法替换为 `(n>min\
    \ && <max)`，并将此对象表达式传递给 `filter` 方法。`filter` 方法返回该对象，因此表达式 `filter(n->(n>min&n<max))`\
    \ 实际上是 `IntPredicate` 类型的引用。最后，我们使用此对象引用来调用实例方法 `test`（此时它反映了 lambda 表达式）：`filter(n\
    \ -> (n > min && n < max)).test(i)`\n\n上述程序的输出结果：“out of range”。\n\n## 方法引用\n\n\
    方法引用功能允许你在不执行方法的情况下创建该方法的引用。然后，该引用可以使用双冒号 `::` 运算符传递给另一个方法进行执行。下面的图表和相应的程序代码说明了这一过程：\n\
    \n```java\ninterface F {\n    void execute();\n}\nclass myClass {\n    static\
    \ void common(F obj) { obj.execute(); }\n    void myMethod() {...}\n    public\
    \ static void main(String[] args) {\n        common(myClass::myMethod);\n    }\n\
    }\n```\n\n`common()` 方法定义为接收函数式接口 `F` 的对象并运行其 `execute()` 方法。在运行时，方法引用运算符 `::`\
    \ 创建了函数式接口 `F` 的实例（因为 `common()` 方法期望一个其 `execute()` 方法指向 `method1` 的对象）。然后，将\
    \ `F` 的实例传递给 `common()` 方法，并执行 `method1()`。注意，作为引用传递的方法必须与函数式接口定义的方法具有相同的签名（返回类型和参数的类型）。\n\
    \n以下是一些将字符串 \"Test Text\" 转换为大写或小写的示例。\n\n```java\ninterface Transform {\n  String\
    \ doit (String s);\n}\n```\n\n> `doit()` 方法的签名\n> `<String>method<String>`\n>\
    \ 所有作为引用传递的方法都必须具有此签名。\n\n```java\nclass myClass {\n  static void printAS (Transform\
    \ obj) {\n    System.out.println(obj.doit(\"Test Text\"));\n  }\n}\n```\n\n等等，OCR\
    \ 文本在后几页似乎有些乱码。让我根据 OCR 片段中提供的流程重构逻辑结构。\n\n## 方法引用\n\n方法引用功能允许你在不执行方法的情况下创建该方法的引用。然后，该引用可以使用双冒号\
    \ `::` 运算符传递给另一个方法进行执行。下面的图表和相应的程序代码说明了这一过程：\n\n```java\ninterface F {\n    void\
    \ execute();\n}\nclass myClass {\n    static void common(F obj) { obj.execute();\
    \ }\n    void myMethod() {...}\n    public static void main(String[] args) {\n\
    \        common(myClass::myMethod);\n    }\n}\n```\n\n`common()` 方法定义为接收函数式接口\
    \ `F` 的对象并运行其 `execute()` 方法。在运行时，方法引用运算符 `::` 创建了函数式接口 `F` 的实例（因为 `common()`\
    \ 方法期望一个其 `execute()` 方法指向 `method1` 的对象）。然后，将 `F` 的实例传递给 `common()` 方法，并执行 `method1()`。注意，作为引用传递的方法必须与函数式接口定义的方法具有相同的签名（返回类型和参数的类型）。\n\
    \n以下是一些将字符串 \"Test Text\" 转换为大写或小写的示例。\n\n```java\ninterface Transform {\n  String\
    \ doit (String s);\n}\n```\n\n> `doit()` 方法的签名\n> `<String>method<String>`\n>\
    \ 所有作为引用传递的方法都必须具有此签名。\n\n```java\nclass myClass {\n  static void printAS (Transform\
    \ obj) {\n    System.out.println(obj.doit(\"Test Text\"));\n  }\n}\n```\n\n##\
    \ 构造方法引用\n\n构造引用与方法引用类似。假设函数式接口持有两个构造函数：\n\n```java\ninterface defaultConstructorRef\
    \ <T> {\n  T create();\n}\n```\n\n我们希望不仅可以通过传统的 `new` 关键字来构建对象，还可以通过构造方法引用。首先，我们声明一个带有参数的函数式接口：\n\
    \n```java\ninterface myConstructor {\n  Location create(int x, int y);\n}\n```\n\
    \n然后，在执行期间，`Location::new` 将函数接口类：\n\n```java\nmyConstructor mc = Location ::\
    \ new;\n```\n\n此示例演示了创建和使用构造引用的基础。然而，拥有两种调用构造函数的方式似乎收益大于。\n\n所以这里有一个更实用的示例——我们将两个不同类（A\
    \ 和 B）的构造方法引用传递给 `printName()` 方法。该方法将使用收到的构造引用来创建对象并调用它。\n\n```java\ninterface\
    \ AB {\n  String methodName();\n}\nclass A implements AB {\n  String name;\n \
    \ A () {name = \"A class\";}\n  public String methodName() {return name;}\n}\n\
    class B implements AB {\n  String name;\n  B () {name = \"B class\";}\n  public\
    \ String methodName() {return name;}\n}\n```\n\n`AB` 是 `printName()` 方法中对 A 和\
    \ B 实例强制转换的类型。`methodName()` 方法必须在此声明，以便方法重写机制起作用。\n\n```java\nclass testConstructorRef\
    \ {\n  public static void main (String args[]) {\n    printName (A :: new);\n\
    \    printName (B :: new);\n  }\n\n  public static void printName (defaultConstructorRef\
    \ obj) {\n    AB obj = (AB) obj.create(); // 注意：此处变量名为 obj\n    system.out.println(obj.methodName());\n\
    \  }\n}\n```\n\n> (AB) 强制转换是必要的，因为 `create()` 返回的对象类型为 `Object`。注意：我们可以在 `defaultConstructorRef`\
    \ 中指定 `<T extends AB>` 以避免强制转换。\n\n此程序创建输出：\n\nA class\nB class\n\n"
