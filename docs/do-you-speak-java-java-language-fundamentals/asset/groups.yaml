    \ (e.g. EventHandler<MouseEvent>, EventHandler<Event>, etc.).\n\nThe EventHandler\
    \ functional interface declares the following method:\n\n```\nvoid handle(T event);\n\
    ```\n\nNext, we need to create an object of type EventHandler<MouseEvent>, implement\
