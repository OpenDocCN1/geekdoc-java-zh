  - "[PAGE 115]\n\n# Threads\n\nWhen two or more parts of a program are running concurrently,\
    \ such program is called a multithreaded program. Each path of execution is called\
    \ a thread. Every Java program has at least one thread that starts with the main\
    \ thread.\n\n# Starting Threads\n\nAn application program can create as many threads\
    \ as needed. To be able to create a thread, a class needs either to extend the\
    \ Thread class, or implement the Runnable interface. In both cases, the class\
    \ creating a thread must implement the run() method. The below diagram illustrates\
    \ the two ways of creating threads. Note that in both cases an object of type\
    \ Thread must be present and have access to the run() method of your class:\n\n\
    | Object of type Thread | Object of type Thread |\n| :--- | :--- |\n| class Thread\
    \ | class Thread |\n| start {...} | start {...} |\n| class A extends Thread run()\
    \ {...} | class B implements Runnable run() {...} |\n\nAs the diagram shows, a\
    \ thread is started by the start() method of class that calls the run() method\
    \ defined in the class starting the thread.\n\nIn this example new thread is started\
    \ by an object of class myClass extends the Thread class:\n\n```\nclass myClass\
    \ extends thread {\n    public void run() {}{\n    public static void main(String\
    \ args[]) {\n        myClass th1 = new myClass();\n        th1.start();\n    }\n\
    }\n```\n\nWhen your class extends the Thread class, the only method that you have\
    \ to implement is the run() method. This method should define the processing"
  - "[PAGE 116]\n\nthat will be done by the new thread. Note, that the run() method\
    \ defined by the class Thread is empty and does nothing.\n\nYou can also implement\
    \ (i.e. override) other methods of class Thread, but with one exception – the\
    \ start() method. If you implement the start() method, and even if it calls the\
    \ run() method, no threads will be started, run() will be executed as a regular\
    \ method of your class, within the current thread.\n\nThis method of creating\
    \ threads is completely acceptable, but if you are not intending to override other\
    \ methods of class Thread besides the run() method, a better approach would be\
    \ to implement the Runnable interface.\n\nIn this example a new thread is created\
    \ by an object of class myClass implementing the Runnable interface:\n\n```\n\
    class myClass implements Runnable {\n    public void run() {}\n    public static\
    \ void main(String args[]) {\n        Thread th2 = new Thread(new myClass() );\n\
    \        th2.start();\n    }\n}\n```\n\nThe Runnable interface declares only one\
    \ method – run(), so your class needs to implement that method. To start a new\
    \ thread, the program has to create an object of class Thread using the following\
    \ constructor:\n\nThread (Runnable target)\n\nHere, target is an instance of your\
    \ class.\n\nIt's important to reiterate that a thread can be started only by the\
    \ start() method of a Thread object. In the first example, when a sub-class of\
    \ Thread was instantiated, an object of class Thread was created automatically\
    \ by calling the super() constructor. In the second example, we created a Thread\
    \ object explicitly, and at the same time passed an object of the class myClass\
    \ to it."
