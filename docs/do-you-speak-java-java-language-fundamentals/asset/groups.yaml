  - '[PAGE 174]


    # Event Handling


    When you interact with a GUI application, each action triggers an event.

    Mouse move, mouse click, keyboard input, scroll, screen touch, swipe, etc. –

    all are examples of events that can be captured by the JavaFX application and
    processed.


    The event handling mechanism employed by JavaFX is easier explained through an
    example. Let''s say that we clicked on a button on the screen. This action triggers
    a "mouse click" event. In JavaFX, an event is an instance of the javafx.event.Event
    class or any subclass of Event, so JavaFX creates a corresponding Event object
    for the event. The event object “travels” through the object hierarchy of the
    JavaFX application, from the Stage object to the target node that was clicked
    (a Button), and backwards. By “travel” we mean “presented for processing”. The
    first path is called “capturing phase":


    +   - Stage -> Root Node -> branch nodes (if any) -> Target Node


    The second path is called "bubbling phase":


    +   - Target Node -> branch nodes -> Root Node -> Stage


    The following diagram illustrates the event handling mechanism:


    ![](img/5cf5236b394075810b8edd6af6a34316_174_0.png)


    Any time during the capturing or bubbling phase the event can be flagged as “consumed”
    by executing the consume() instance method of class Event. This stops further
    event propagation.


    Presenting (i.e. delivering) an event to an object for processing does not imply
    that the event will be or be processed by that object. To be able to accept'
