    \n## 对象类型转换\n\n注意，super 关键字只能在构造方法中使用。那么我们如何从子类对象访问父类的实例变量或实例方法呢？在上面的示例中，变量 x\
    \ 在子类和父类中都定义。子类的 x 可以通过子类对象名称引用如下：subclassObject.x，但父类的 x 被隐藏了。解决此问题的方法是类型转换。我们可以将子类对象转换为任何父类对象。考虑一个两个类\
    \ Parent 和 Child，它们都声明了实例变量 x。\n\n```java\nclass Parent { int x; }\nclass Child\
    \ extends Parent { int x; }\nclass Test {\n    public static void main(String\
