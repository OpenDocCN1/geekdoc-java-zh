- md: "\n## Comparator\nAny ordered collection (e.g. TreeSet) needs to have some kind\
    \ of compare algorithm to determine which element of the collection is “greater”\
    \ than the other. In fact, there are default algorithms for each type of objects\
    \ that can be stored in ordered collections. These algorithms are implemented\
    \ via the Comparator functional interface that defines the compare() method. In\
    \ case we want to alter the default sequence of objects in a collection, we can\
    \ build a collection that points to a custom comparator.\n\nNote that the Comparator\
    \ can be used to provide an ordering for collections of objects that don't have\
    \ a natural ordering.\n\nThe example below shows how to create a custom comparator\
    \ to sort an array of integers descending order.\n\n```java\nimport java.util.*;\n\
    class testComparator {\n    public static int reverse(Integer n1, Integer n2)\
    \ {\n        return n2.compareTo(n1);\n    }\n    public static void main (String[]\
    \ args) {\n        Integer[] nn = { 1, 2, 3 };\n        Arrays.sort(nn, (n1, n2)\
    \ -> reverse(n1, n2));\n        System.out.println(nn[0] + \" \" + nn[1] + \"\
    \ \" + nn[2]);\n    }\n}\n```\n\nThe output of this program will be “3 2 1”.\n\
    \nNote: The Arrays class define several sort methods; we've used one:\n`static\
    \ void sort(T[] a, Comparator<? super T> c)`\n\nHere is how it executed:\n\n-\
    \ T becomes the first operator T\n- The integers array substitutes the first operand\
    \ T\n- The lambda expression (n1, n2) -> reverse (n1, n2) is transformed into\
    \ an object of the Comparator<Integer> functional interface, whose compare() method\
    \ is implemented as { reverse (n1, n2); }\n- During the sorting, reverse() is\
    \ used in determining which one of two integers is greater, as follows:\nn1>n2\
    \ : result>0; n1<n2 : result<0; n1=n2 : result=0\n\n## I/O Streams\n\nA stream\
    \ is an abstract representation of an input, where source data is retrieved from,\
    \ or an output, where destination data is sent to. Java recognizes two types of\
    \ streams – byte streams and character streams. The byte streams should be used\
    \ for sending or receiving binary objects, and the character streams should be\
    \ used when working with characters and the \"character\" representation of data\
    \ is needed.\n\n![](img/5cf5236b394075810b8edd6af6a34316_134_0.png)\n\nNote that\
    \ the transmission of data via byte or character streams is done one byte or one\
    \ character at a time. There are buffered streams that group the data into buffers,\
    \ but those streams are still based on the underlying byte or character streams.\n\
    \nThis chapter provides an overview of the concept behind streams and illustrates\
    \ the usage of some input and output streams.\n\n## Byte Output Streams\n\nImagine\
    \ that an application generates the following types of data and wants to write\
    \ them out into a file:\n\n![](img/5cf5236b394075810b8edd6af6a34316_134_1.png)\n\
    \nOne way to accomplish this would be by creating different classes for each type\
    \ of input data, but Java’s approach to this task is by building a “chain” of\
    \ streams, each performing necessary data transformation and passing the result\
    \ to the next stream:\n\n![](img/5cf5236b394075810b8edd6af6a34316_135_0.png)\n\
    \nThe **FileOutputStream** class provides several methods for writing data into\
    \ files. For example, it defines the method `write(byte[] b)` that writes the\
    \ specified array of bytes to a file. If we had a ready array, we could use this\
    \ method as follows:\n\n```java\nbyte[] b = {97, 98, 99};\nFileOutputStream fileout;\n\
    fileout = new FileOutputStream(\"myfile.txt\");\nfileout.write(b);\n```\n\nHowever,\
    \ class **FileOutputStream** does not deal with primitive data types (double,\
    \ float, int, etc.). So in order to write out a double number, we need to engage\
    \ the **DataOutputStream** class, which implements the `writeDouble` method. **DataOutputStream**\
    \ converts the received argument to an array of bytes and passes each byte, one\
    \ by one, to the underlying stream by calling the **write** method of the underlying\
    \ stream:\n\n```java\nDataOutputStream dataout;\ndataout = new DataOutputStream(fileout);\n\
    ```\n\n| dataout will be calling the fileout.write() method for each output byte.\
    \ |\n\nNow, we can call the `writeDouble` method of **DataOutputStream** that\
    \ will convert the double number to bytes and pass them to **FileOutputStream**\
    \ via the **write** method:\n\n```java\ndataout.writeDouble(123.4);\n```\n\nIn\
    \ general, the chain of streams is constructed from the bottom up:\n\n```java\n\
    C c = new C();\nB b = new B(c);\nA a = new A(b);\n// or just:\nA a = new A(new\
    \ B(c));\n```\n\nThe data is passed between output streams as follows:\n\n| Object\
    \ a: | Object b: | Object c: |\n| --- | --- | --- |\n| a.write(...) | write(...)\
    \ | write(...) |\n| conversion | conversion | conversion |\n| b.write(...) | c.write(...)\
    \ | |\n| | | } |\n\nIn order of this mechanism to work, the following requirements\
    \ must be met: Each output stream must be a subclass of OutputStream and each\
    \ output stream has the following methods:\n- write(int i) - mandatory\n- write(byte[]\
    \ b) - optional\n- write(byte[] b, int offset, int length) - optional\n\nEach\
    \ output stream must be a subclass of OutputStream and each output stream has\
    \ the following methods:\n- write(int i) - mandatory\n- write(byte[] b) - optional\n\
    - write(byte[] b, int offset, int length) - optional\n\nEach output stream must\
    \ be a subclass of OutputStream and each output stream has the following methods:\n\
    - write(int i) - mandatory\n- write(byte[] b) - optional\n- write(byte[] b, int\
    \ offset, int length) - optional\n\nEach output stream must be a subclass of OutputStream\
    \ and each output stream has the following methods:\n- write(int i) - mandatory\n\
    - write(byte[] b) - optional\n- write(byte[] b, int offset, int length) - optional\n\
    \nEach output stream must be a subclass of OutputStream and each output stream\
    \ has the following methods:\n- write(int i) - mandatory\n- write(byte[] b) -\
    \ optional\n- write(byte[] b, int offset, int length) - optional\n\nEach output\
    \ stream must be a subclass of OutputStream and each output stream has the following\
    \ methods:\n- write(int i) - mandatory\n- write(byte[] b) - optional\n- write(byte[]\
    \ b, int offset, int length) - optional\n\nEach output stream must be a subclass\
    \ of OutputStream and each output stream has the following methods:\n- write(int\
    \ i) - mandatory\n- write(byte[] b) - optional\n- write(byte[] b, int offset,\
    \ int length) - optional\n\nEach output stream must be a subclass of OutputStream\
    \ and each output stream has the following methods:\n- write(int i) - mandatory\n\
    - write(byte[] b) - optional\n- write(byte[] b, int offset, int length) - optional\n\
    \n```java\n// Example of sending a double number\n// though DataOutputStream and\
    \ BufferedOutputStream\n\nimport java.io.*;\nclass myOutputStream extends OutputStream\
    \ {\n    public void write(int i, int len) {\n        System.out.println(\"Received\
