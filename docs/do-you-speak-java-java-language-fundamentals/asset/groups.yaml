    # Strings


    In Java, a sequence of characters is represented by the class String. The String
    class is a regular class, and can be handled as such. However, due to its extensive
    usage, Java added some convenient features that make handling of strings more
    intuitive. In this chapter, we will review all the special features of the String
    class.


    # String Literals, Creating Strings


    The string literal is a sequence of characters enclosed within double quotes:
    "First line of a string literal. \n second line."


    String literals can be used to create String objects directly:


    | String s1 = new string();

    s1 = "text"; | Creates an empty String (null object)

    Assigns value to the String object s1 |

    | String s2 = new string("text"); | Creates a String object and initializes it
    |

    | String s3 = "text"; | Creates a String object and initializes it with a literal
    |


    As you can see in this example, a String object can be created without using the
    new operator – just by direct assignment of a string literal to a String variable.
    This might look strange at first, but there is a simple explanation:


    > Stand-alone string literal in Java is an object of class String.


    Each unique string literal Java creates one object that can be referenced by different
    object variables. The new operator, on the other hand, always creates a new object
    regardless of the literal value passed to the constructor:


    ```

    String s1 = new String("text"); -> String object "text"

    String s2 = new String("text"); -> String object "text"

    String s3 = "text"; -> String object "text"

    String s4 = "text";

    ```'
- md: '

    Since a stand-alone string literal represent a String object, you can work with
    it as an object, without creating a reference. For example, you can invoke the
    length() instance method of the String class to get the length of a literal, as
    it follows:


    ```

    int n = "text"; // n = 4

    ```


    Another important fact about the String object:


    > Once created and initialized, a String object cannot be modified. Its value
    cannot be appended, truncated, or replaced. If you need a modifiable string –
    use the StringBuffer class (not covered in this book).


    ## Comparing Strings


    It is important to understand that there is a difference between comparing two
    actual string values and comparing two references to String objects:


    ```java

    String s1 = "text"

    String s2 = "text"

    boolean b = (s1 == s2); // b=true


    s1 and s2 are pointing to same

    String object having value "text"


    String s3 = new String("text")

    String s4 = new String("text")

    boolean b = (s3 == s4); // b=false


    s3 and s4 are pointing to

    different String objects having

    same value "text"

    ```


    To compare the actual values of two strings (which in fact are encapsulated within
    String objects), we need to use the instance method equals() of class String:


    ```java

    String s1 = new String("text")

    String s2 = new String("text")

    boolean b = ( s1.equals(s2) ); // b = true

    ```


    ## String Concatenation Operator


    The string concatenation operator (+) combines two operands into one string. The
    primitive data type operands (boolean, int, char, double, etc.) are converted
    into their string representation, and object operands are converted into a string
    by calling the instance method toString(). This type of conversion is performed
    on an operational basis, from left to right, as shown in the following examples.


    Example 1:


    ```java

    string s = "I have " + 5 + 4 + " dollars";

    ```


    ![](img/5cf5236b394075810b8edd6af6a34316_70_0.png)


    Example 2:


    ```java

    String s = "I have " + 5 * 4 + " dollars";

    ```


    ![](img/5cf5236b394075810b8edd6af6a34316_70_1.png)


    ## String Methods


    In this paragraph we will present some commonly used methods of class String.


    ### Determining String Length


    ```java

    String s = "text";

    int lng = s.length(); // lng = 4

    lng = "my string".length(); // lng = 9

    ```


    ### Comparing Strings


    The compareTo() method compares two strings lexicographically. The comparison
    is based on the Unicode value of each character in the strings and is performed
    by comparing one character at a time, from left to right, until unequal characters
    are found or until the end of one of the strings is reached. The value returned
    by the compareTo() method is calculated as difference between the numeric values
    of unequal characters (''a'' - ''b'' = -1). If one of the strings reaches its
    end, the method returns the difference of the length of the strings.


    ```java

    String s = "ab";

    int n;

    n = s.compareTo("ab"); // n = 0 ("ab" = "ab")

    n = s.compareTo("aa"); // n = +1 ("ab" > "aa")

    n = s.compareTo("bb"); // n = -1 ("ab" < "bb")

    n = s.compareTo("abaa"); // n = -2 ("ab" < "abaa")

    ```


    ### Accessing String Characters


    ```java

    String s = "abcdef";

    char c = s.charAt(0); // c = ''a''

    char c = s.charAt(5); // c = ''f''

    ```


    ### Searching for a Character


    ```java

    String s = "abcd";

    int pos;

    pos = s.indexOf(''g''); // pos=-1 (character ''g'' not found)

    pos = s.indexOf(''b'',2); // pos=+3 (first ''b'' after position 2 is in position
    3)

    pos = s.lastIndexOf(''c''); // pos=+4 (last symbol ''b'' is in position 4)

    ```


    ### Searching for a Substring


    ```java

    String s = "abcd";

    int pos;

    pos = s.indexOf(''abd''); // pos = -1 (sub-string ''abd'' not found)

    pos = s.indexOf(''bc''); // pos = 1 (sub-string ''bc'' is in position 1)

    ```


    ### Extracting a Substring


    ```java

    String s = "abcdef";

    String s1 = s.substring(1,3); // s1 = "bc"

    String s2 = s.substring(1); // s2 = "bcdef"

    ```


    ### Creating a new String from existing String


    ```java

    String s = " abc \n";

    String s1 = s.trim(); // s1 = "abc"

    String s2 = s.replace('' '', ''+''); // s2 = "+abc"

    ```


    ### Creating a Character Array from a String


    ```java

    String s = "abcd";

    char[] c = s.toCharArray();

    s.getChars(0, 2, c, 2);

    ```


    | c[0]=''a'' |

    | :--- |

    | c[1]=''b'' |

    | c[2]=''c'' |

    | c[3]=''d'' |


    Copy characters in positions 0, 1 of string c starting from position 2.


    | c[0]=''a'' |

    | :--- |

    | c[1]=''b'' |

    | c[2]=''c'' |

    | c[3]=''d'' |


    ### Creating an Array of Bytes from a String


    This method converts each character of a string from Unicode (16-bit) into 8-bit
    encoding (usually ASCII) and creates an array of bytes.


    ```java

    String s = "abcd";

    byte[] b = s.getBytes();

    ```


    | b[0]=97 (''a'') |

    | :--- |

    | b[1]=98 (''b'') |

    | b[2]=99 (''c'') |

    | b[3]=100 (''d'') |


    ### Creating a String from Array of Characters


    The static copyValueOf method of class String create a String object from array
    of characters. It has the following formats:


    ```java

    static copyValueOf(char[] charArray);

    ```


    ```java

    static copyValueOf(char[] charArray, int startPos, int numberOfElements);

    ```


    Example:


    ```java

    char[] c = {''a'', ''b'', ''c'', ''d''};

    String s1 = String.copyValueOf(c); // s1 = "abcd"

    String s2 = String.copyValueOf(c, 1, 2); // s2 = "bc"

    ```


    ## Packages


    A package is a container for classes. All Java classes are spread across different
    packages. The fundamental classes reside in the java.lang package. Examples of
    other packages are java.io, java.util, java.net, etc.


    Packages are arranged in a tree-like structure:


    ![](img/5cf5236b394075810b8edd6af6a34316_74_0.png)


    The java.lang package is always available to the Java compiler. When your program
    needs to use a class residing in a different package, that class or the whole
    package containing class must be imported into the program:


    ```java

    import java.math.*;

    import java.io.FileReader;

    ```


    User-defined classes are also placed in packages. For example, myClass from the
    above example will be placed in default "no-name" package. To place it into a
    particular package, the first statement of the program (not counting comment)
    must be the package statement:


    ```java

    package mypack.io;

    import java.io.FileReader;

    class myClass { ... }

    ```


    Note that classes, after compiling, retain information about the package they
    belong to. So, if you copy a class from one package into another it will not work.
    However, there is one exception. When a class is compiled without the package
    statement, it can be placed in any named package and be accessible by all classes
    in that package. The implementation of the package concept varies depending on
    the environment in which Java is installed (Linux, Mac, Windows, etc.) and therefore
    is not included in the scope of this book.


    ## Modifiers


    The following entities of the Java language – classes, interfaces, variables,
    and methods – can be declared with so-called modifiers controlling their behavior
    and/or accessibility. Here, myMethod is declared with two modifiers: public and
    static.


    ```java

    public static void myMethod() { ... };

    ```


    ## Class Modifiers


    There is a limited set of modifiers that can be applied to classes:


    - public

    - abstract

    - final


    The public modifier makes the class accessible from any package. If this modifier
    is not specified, the class will be accessible from the package it was declared.


    The abstract modifier defines a class in which one or more methods are declared
    as skeletons – with the return type and the list of input parameters, but without
    the body. Abstract classes will be further explained in the “Abstract Classes”
    section.


    The final modifier prohibits the class from being extended by other classes.


    ## Access Level Modifiers


    Access level modifiers control the visibility of variables and methods of a class
    from other classes in the same or different packages. There are four access level
    modifiers (in order from less to more restrictive):


    public → protected → [no modifier] → private


    ```java

    public void myMethod() { ... };

    protected int n;

    double x;

    private String name;

    ```


    The following table shows how access variables and methods of one class from its
    sub-classes and also from other classes residing in the same or different packages.


    | | Package One | | Package Two | |

    | :--- | :--- | :--- | :--- | :--- |

    | class A | subclass of A | class B | subclass of A | class C |

    | public | visible | visible | visible | visible |

    | protected | visible | visible | visible | - |

    | no modifier | visible | visible | - | - |

    | private | visible | - | - | - |


    ## The "static" Modifier


    The static modifier indicates that the variable or method can be accessed before
    any object of the class is created. A good example is the main method that starts
    execution of an application. It must be declared static because it is called before
    any object exists.


    ## The "final" Modifier


    The final modifier can be applied to variables, methods, and classes to "finalize"
    their declaration.


    A final variable cannot be modified after it is assigned an initial value. It
    effectively makes a final variable constant:


    ```java

    final double pi = 3.1415926;

    ```


    A final method cannot be overridden. If a class declares some method as final,
    the sub-classes of that class cannot create a method with the same signature as
    the final method.


    A final class cannot have sub-classes, i.e. it cannot be inherited.

