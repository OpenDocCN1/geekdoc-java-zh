  - "[PAGE 86]\n\n# Generic Constructors\n\nIt is important to remember that constructors\
    \ are methods whose function is to create instances (objects) of classes. As methods,\
    \ they can be declared as generic. The class itself can be either generic or non-generic.\n\
    \nWe have already seen constructors of generic classes in previous examples.\n\
    Here is another example:\n\n```\nclass GenericClass <T> {\n    public T key;\n\
    \    GenericClass(T k) {\n        this.key = k;\n    }\n}\n```\n\n![](img/5cf5236b394075810b8edd6af6a34316_86_0.png)\n\
    \n```\nGenericClass<Integer> g = GenericClass<Integer>(123);\n```\n\n![](img/5cf5236b394075810b8edd6af6a34316_86_1.png)\n\
    \nThe above constructor is not generic. To be generic it should be able to accept\
    \ generic parameters different from those specified in the class declaration,\
    \ like this:\n\n```\nclass GenericClass <T> {\n    public T key;\n    public Object\
    \ value;\n    GenericClass(T k, X v) {\n        this.key = k;\n        this.value\
    \ = v;\n    }\n}\n```\n\n![](img/5cf5236b394075810b8edd6af6a34316_86_2.png)\n\n\
    ![](img/5cf5236b394075810b8edd6af6a34316_86_3.png)\n\n```\nGenericClass<string>\
