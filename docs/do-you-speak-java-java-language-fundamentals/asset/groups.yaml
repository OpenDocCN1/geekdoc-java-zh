    # Variables


    In Java, data elements of primitive types can be declared either as literals or
    variables.


    A variable is a named reference to a location in memory where the data element
    of specified type resides. The format for declaring a variable is this:


    ```

    type identifier; // declares the variable identifier

    // of type type

    type identifier = value; // declares and assigns value

    // to variable identifier of type type

    ```


    Here are some examples of declaring primitive data types.


    ```

    int k; // "k" is a reference to a 32-bit area in memory

    // that will hold an integer value

    k = 100; // The above memory is populated with a 32-bit

    // signed binary number (100)

    char c = ''A''; // "c" is a reference to the two-byte Unicode

    // character ''A''

    ```


    Note, that variables can reference not only the primitive data types, but objects
    as well.


    # Accessing the Variables


    At high level, you can view every Java program as blocks of code. Each block is
    surrounded by curly brackets: { statements }. Blocks can be separate or included
    in each other:


    ```

    { block 1 }

    { block 2 { block 3 } }

    ```


    This structure determines the accessibility, also referred to as scope, of variables.
    A variable declared in a block is accessible within that block and within all
    included blocks. Once program flow reaches the end of a block variables declared
    within that block are destroyed.'
