    # String Concatenation Operator


    The string concatenation operator (+) combines two operands into one string. The
    primitive data type operands (boolean, int, char, double, etc.) are converted
    into their string representation, and object operands are converted into a string
    by calling the instance method toString(). This type of conversion is performed
    on an operational basis, from left to right, as shown in the following examples.


    Example 1:


    string s = "I have " + 5 + 4 + " dollars";


    ![](img/5cf5236b394075810b8edd6af6a34316_70_0.png)


    Example 2:


    String s = "I have " + 5 * 4 + " dollars";


    ![](img/5cf5236b394075810b8edd6af6a34316_70_1.png)'
  - '[PAGE 71]


    # String Methods


    In this paragraph we will present some commonly used methods of class String.


    # Determining String Length


    ```

    String s = "text";

    int lng = s.length(); // lng = 4

    lng = "my string".length(); // lng = 9

    ```


    # Comparing Strings


    The compareTo() method compares two strings lexicographically. The comparison
    is based on the Unicode value of each character in the strings and is performed
    by comparing one character at a time, from left to right, until unequal characters
    are found or until the end of one of the strings is reached. The value returned
    by the compareTo() method is calculated as difference between the numeric values
    of unequal characters (''a'' - ''b'' = -1). If one of the strings reaches its
    end, the method returns the difference of the length of the strings.


    ```

    String s = "ab";

    int n;

    n = s.compareTo("ab"); // n = 0 ("ab" = "ab")

    n = s.compareTo("aa"); // n = +1 ("ab" > "aa")

    n = s.compareTo("bb"); // n = -1 ("ab" < "bb")

    n = s.compareTo("abaa"); // n = -2 ("ab" < "abaa")

    ```


    # Accessing String Characters


    ```

    String s = "abcdef";

    char c = s.charAt(0); // c = ''a''

    char c = s.charAt(5); // c = ''f''

    ```


    # Searching for a Character


    ```

    String s = "abcd";

    int pos;

    pos = s.indexOf(''g''); // pos=-1 (character ''g'' not found)

    pos = s.indexOf(''b'',2); // pos=+3 (first ''b'' after position 2

    is in position 3)

    pos = s.lastIndexOf(''c''); // pos=+4 (last symbol ''b'' is in position 4)

    ```'
