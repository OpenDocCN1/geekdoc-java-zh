    \n在之前的示例中，实例变量在构造方法中通过它们的名称直接引用。但当在 **main** 方法中声明一个与实例变量同名的变量时会发生什么？这种情况是完全合法的，因为在\
    \ **main** 方法内部声明的所有变量在方法外部都不是“可见”的。\n\n另一个令人困惑的情况是实例变量的名称也被用在构造方法的参数列表中。这个问题可以通过使用\
