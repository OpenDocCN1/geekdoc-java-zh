    \n## Channel\n\n**Channel** 实际上是一个由各种通道类实现的**接口**：**SocketChannel**、**DatagramChannel**、**SeekableByteChannel**、**FileChannel**\
    \ 等。它代表与一个能够执行 I/O 操作的实体（文件、网络套接字等）连接。\n\n## Selector\n\n**Selector** 类允许单个应用程序线程处理多个通道。\n\
    \n（**Selector** 类的用法超出了本书的范围。）\n\n## Files\n\n**Files** 类提供了操作文件和目录的方法。它还可以打开标准的字节流（即\
    \ **InputStream** 和 **OutputStream**），以便从文件读取或向文件写入。\n\n第一个示例说明了如何使用 **Buffer**、**Channel**\
    \ 和 **Files** 通过阻塞通道在应用程序和磁盘文件之间传递未格式化的数据（字节）。\n\n```java\n// Example of using\
    \ NIO writing to and from files\n\n```java\nimport java.io.*;\nimport java.nio.*;\n\
    import java.nio.file.*;\nimport java.nio.channels.*;\n```\n\n```java\nclass testNIO\
