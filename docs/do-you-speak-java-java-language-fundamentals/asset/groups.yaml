  - "[PAGE 138]\n\n# Character Output Streams\n\nAll character data in Java is represented\
    \ in the Unicode format. The character output stream classes convert Unicode characters\
    \ into their local representation (e.g. ASCII format) before sending them to output\
    \ devices or other streams. Another function of the character output streams is\
    \ to generate a character representation of any primitive type, as well as objects.\
    \ This is implemented via the print and println methods of the class PrintWriter.\
    \ These methods are overloaded (i.e. there are multiple versions of them) and\
    \ can accept primitive data types, Strings, character arrays, or objects.\n\n\
    Similar to the output stream classes that extend the OutputStream class, the character\
    \ stream classes extend the Writer abstract class and its write methods.\n\nThe\
    \ following program uses two different character output streams to write an array\
    \ of characters into a file:\n\n```\nimport java.io.*;\nclass testcharStreams\
    \ {\n    public static void main(String args[]) {\n        char[] c = {'a', 'b',\
    \ 'c'};\n\n        FileWriter filewriter =;\n        PrintWriter printout;\n\n\
    \        try {\n            fileout = new FileWriter(\"write.txt\");\n       \
    \     fileout.write(c, 0, 3);\n            fileout.flush();\n\n            printout\
    \ = new PrintWriter(\"print.txt\");\n            printout.println(123.4);\n  \
    \          printout.flush();\n        }\n        catch (IOException e) {\n   \
    \         System.out.println(\"I/o error\");\n        }\n    }\\}\n```\n\n> Push\
    \ the first three characters of array c into an internal buffer\n\n> Push data\
    \ out of the buffer\n\n> Convert the double number 123.4 into a character representation\
    \ and put it into a buffer\n\n> Push data out of the buffer"
- md: "\n# Byte Input Streams\n\nByte input streams are used to receive (read) a sequence\
    \ of bytes. All classes of this group have to extend the InputStream abstract\
    \ class and implement its read methods:\n\n```\nabstract int read();\nint read(byte[]\
    \ b); // optional\nint read(byte[] b, int offset, int len); // optional\n```\n\
    \nNote: the read methods return the integer value -1 when the end of the stream\
    \ is reached.\n\nIn addition to the read methods, the InputStream class provides\
    \ several methods for supporting the so-called markable streams. With markable\
    \ streams, you can mark a current position within the stream and later return\
    \ to that position. The markSupported method can be used to check if a stream\
    \ is markable.\n\nBelow is an example of reading integers from a file:\n\n```java\n\
    // Assumption: a set of integer values were written into the\n// \"test.txt\"\
    \ file via DataOutputStream.\nimport java.io.*;\nclass TestByteInputStream {\n\
    \    public static void main(String[] args[]) {\n        boolean EOF = false;\n\
    \        int i;\n        try {\n            File myfile = new File(\"test.txt\"\
    );\n            FileInputStream filein = new FileInputStream(myfile);\n      \
    \      DataInputStream datain = new DataInputStream(filein);\n\n            while\
    \ (!EOF) {\n                i = datain.readInt();\n                System.out.println(\"\
    i=\" + i);\n            }\n        } catch (EOFException e) {\n            EOF\
    \ = true;\n        } catch (IOException e) {\n            System.out.println(\"\
    I/O Error\");\n        }\n    }\n}\n```\n\n# Character Input Streams\n\nCharacter\
    \ input streams are represented by a group of classes extending the abstract class\
    \ Reader. Their purpose is to read characters from different sources in their\
    \ native (local) encoding format and convert them into the Unicode format. Each\
    \ input stream class has to implement the read methods:\n\n```\nint read(); //\
    \ read a single character\nint read(char[] c); // read characters into an array\n\
    // reads into a portion of an array;\nabstract int read(char[] c, int off, int\
    \ len);\n```\n\nNote: the read methods return the integer value -1 when the end\
    \ of the stream is reached.\n\nIn addition to the read methods, the Reader class\
    \ provides several other methods for supporting the so-called markable streams.\
    \ With markable streams, you can mark a current position within the stream and\
    \ later return to that position. The markSupported method can be used to check\
    \ if a stream is markable.\n\nExample:\n\n```java\n// Print every other character\
    \ of the alphabet\nimport java.io.*;\nclass testStringReader {\n    public static\
    \ void main(String[] args[]) {\n        String s = \"abcdefghijklmnopqrstuvwxyz\"\
    ;\n        int i = 0;\n        try {\n            Reader sReader = new StringReader(s);\n\
    \            do {\n                sReader.skip(1);\n                i = sReader.read();\n\
    \                if (i > 0)\n                    System.out.print((char) i);\n\
    \            } while (i != -1);\n        } catch (IOException e) {\n         \
    \   System.out.println(\"Error reading file\");\n        }\n    }\n}\n```\n\n\
    This program creates the output: \"dfhjlnprtvxz\"\n\n# Try-With-Resources\n\n\
    There is one nice enhancement added to the stream handling process in JDK7. It\
    \ allows to automatically release the resources held by a stream (e.g. close the\
    \ file) once we are done using the stream. This feature can be used with the classes\
    \ implementing the AutoClosable interface, which declares only one method — close().\
    \ The close method will be called when the try block ends.\n\nThe new format of\
    \ the try block:\n\n```\ntry ( resource declaration and initialization )\n{ usage\
    \ of the resource }\ncatch ( . . ) { . . }\n```\n\nExample:\n\n```java\nclass\
    \ mystream extends OutputStream{\n    public void writeInt(int i) { }\n    public\
    \ void write(byte[] b, int offset, int lng) {\n        System.out.println(\"Received\
    \ bytes: \" + lng);\n    }\n}\nclass teststreams {\n    public static void main(String\
    \ args[]) {\n    try (\n        DataOutputStream dataout = \n            new DataOutputStream(\n\
    \            new BufferedOutputStream(\n                new MyStream())));\n \
    \       dataout.writeInt(123);\n        // dataout.flush();\n    }\n    catch\
    \ (IOException e) {\n        System.out.println(\"I/o error\");\n    }\n}\n```\n\
    \n# Serialization\n\nSerialization is the process of converting an object's state\
    \ into a byte stream, which can then be saved to a file or transmitted over a\
    \ network. The reverse process is called deserialization, where the original object\
    \ is reconstructed from the byte stream.\n\nIn Java, a class must implement the\
    \ `java.io.Serializable` interface to be serializable. This is a marker interface,\
    \ meaning it has no methods to implement.\n\nWhen an object is serialized, its\
    \ entire object graph is also serialized. However, some fields should not be serialized.\
    \ For instance:\n\n- Transient fields: Fields marked with the `transient` keyword\
    \ will not be serialized.\n- Static fields: These belong to the class rather than\
    \ the instance, so they are not serialized.\n\nExample:\n\n```java\nimport java.io.*;\n\
    \nclass User implements Serializable {\n    private String name;\n    private\
    \ transient int age; // This field will not be serialized\n\n    public User(String\
    \ name, int age) {\n        this.name = name;\n        this.age = age;\n    }\n\
    \n    @Override\n    public String toString() {\n        return \"User{name='\"\
    \ + name + \"', age=\" + age + '}';\n    }\n}\n\npublic class SerializationDemo\
    \ {\n    public static void main(String[] args) {\n        User user = new User(\"\
    Alice\", 30);\n        String filename = \"user.ser\";\n\n        // Serialize\
    \ the object\n        try (ObjectOutputStream out = new ObjectOutputStream(new\
    \ FileOutputStream(filename))) {\n            out.writeObject(user);\n       \
    \     System.out.println(\"Object has been serialized to \" + filename);\n   \
    \     } catch (IOException e) {\n            e.printStackTrace();\n        }\n\
    \n        // Deserial the object\n        try (ObjectInputStream in = new ObjectInputStream(new\
    \ FileInputStream(filename))) {\n            User deserializedUser = (User) in.readObject();\n\
    \            System.out.println(\"Deserialized object: \" + deserializedUser);\n\
    \        } catch (IOException | ClassNotFoundException e) {\n            e.printStackTrace();\n\
    \        }\n    }\n}\n```\n\nWhen deserializing the object, the `transient` fields\
    \ will be initialized to their default values (e.g., 0 for int, null for objects).\n\
    \nTo have more control over the serialization process, you can implement the `writeObject`\
    \ and `readObject` methods in your serializable class.\n\n```java\nprivate void\
    \ writeObject(ObjectOutputStream out) throws IOException {\n    out.defaultWriteObject();\
    \ // serializes non-static and non-transient fields\n    // custom serialization\
    \ logic\n}\n\nprivate void readObject(ObjectInputStream in) throws IOException,\
    \ ClassNotFoundException {\n    in.defaultReadObject(); // deserializes non-static\
    \ and non-transient fields\n    // custom deserialization logic\n}\n```\n"
