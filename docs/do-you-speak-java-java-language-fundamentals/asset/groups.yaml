    \  // System.out.println(getTemp(\"JFK\n```\n\n![](img/5cf5236b394075810b8edd6af6a34316_155_0.png)\n\
    \n![](img/5cf5236b394075810b8edd6af6a34316_155_1.png)\n\nIt looks beneficial,\
    \ but if we want to provide some other information about the airports, like state\
