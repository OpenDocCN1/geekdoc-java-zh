    # Regular Expressions


    The validation and manipulation of the contents of text strings can be found in
    many applications. For example, we might need to check if an email address entered
    has valid format. The Regular Expressions API is a powerful tool that a Java programmer
    can utilize to perform text validation, parsing, tokenization, or other type of
    manipulations.


    The Regular Expression API consists of two utility classes: Pattern and Matcher.
    The Pattern class is used to build regular expressions, which are referred to
    as patterns. The Matcher class is used to apply the pattern to a text string.
    The usage of these two classes is quite simple but the challenge is in mastering
    regular expression skills, which, unfortunately, is beyond the scope of this book.
    Nevertheless, we will go through several examples to make you familiar with the
    operations that can be performed on text strings, and also to cover the basics
    of regular expressions.


    # Regular Expressions Basics


    A regular expression is a sequence of characters defining a pattern that can be
    matched against a text string. For example, the regular expression “abc” can be
    used to check if a text contains the “abc” sequence.


    There are several categories of regular expressions. We will present three of
    them.


    The first category of regular expressions is called “characters” and includes
    most of the characters and also the escape sequences, like \t (tab character),
    or \n (newline character). “abc” is an example of the character regular expression.


    The second category of regular expressions is called “character classes” and represents
    a range of valid characters. For example, the [a-zA-Z] pattern matches any lower-case
    or upper-case letter.


    For some of the character classes constructs Java provides a shorthand form:


    +   - matches any character

    - \s matches the white space character

    - \d matches any digit'
  - '[PAGE 158]


    \w - matches any word character


    The third category of regular expression constructs is called “quantifiers”. Quantifier
    can be appended to any character or character class construct to specify the allowed
    number of occurrences for the construct:


    +   - occurs once or not at all

    - occurs zero or more times

    - occurs one or more times

    - {n} occurs exactly n times

    - {n,} occurs at least n times

    - {n,m} occurs from n to m times


    There are other regular expression groups, but their review is beyond the scope
    of this book.


    # Regular Expressions Examples


    Before we start with examples, we need to mention that the Pattern and Matcher
    classes have no constructors. Pattern objects are created by the static method
    compile() of class Pattern, and Matcher objects are created by the instance method
    matcher() of class Pattern.


    Example: Validate if the whole text matches the pattern.


    String regex;

    Pattern p;

    Matcher m;


    | [a-z]+ matches one or more lower case letters |

    | Create Matcher object m |


    ```

    p = Pattern.compile("[a-z]+");

    m = p.matcher("test");

    System.out.println(m.matches()); // prints: true

    ```


    Example: Validate the email format.


    | Matches any number of letters or digits |

    | Matches the character ''@'' |

    | Matches any number of word characters |

    | Matches the character ''\.'' |

    | Matches the string "com" |


    ```

    regex = "[a-zA-Z0-9]+"

    + "@"

    + "\W+"

    + "\."

    + "com",

    ```


    ```

    p = Pattern.compile(regex);

    m = p.matcher("John123@site.com");

    System.out.println(m.matches()); // prints: true

    ```


    Example: Extract the user name and website address from email.


    ```

    p = Pattern.compile("@");

    String[] ss = p.split("John@site.com");

    ```'
