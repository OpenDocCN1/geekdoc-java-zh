  - "[PAGE 78]\n\n# Generics\n\n**Generics** is a feature of Java allowing the use\
    \ of generic names when specifying the class type of object parameters in the\
    \ declarations of classes, interfaces, methods, or constructors. For example,\
    \ if two methods have same functionality but one receives an integer parameter,\
    \ and another receives a double parameter, we can declare just one method and\
    \ supply that method with a '**generic**' type of the parameter, which will be\
    \ substituted with the proper type during compilation.\n\nThe best way to understand\
    \ all the advantages and restrictions of **generics** by going through examples,\
    \ which are illustrated below.\n\n# Generic Methods\n\nLet's say that we create\
    \ a method that acts on an object without knowing what its type is. One way of\
    \ accomplishing that is by using the **Object** class – the superclass of all\
    \ objects. We could accept an Object instance and then cast it to the desired\
    \ type.\n\nFor example, method **sumArea** summarizes the total area occupied\
    \ by objects of type **A** and **B** by processing one object at a time. All we\
    \ know about objects A and B is that they are **unrelated** (i.e. belong to separate\
    \ class hierarchies) and both have the **getArea** method returning their area\
    \ value. The **sumArea** method can be implemented as:\n\n```\nclass A { public\
    \ double getArea() { return 10.0; }\nclass B { public double getArea() { return\
    \ 20.0; }\n```\n\n```\nclass myClass {\ndouble totalArea;\n  public void sumArea(Object\
    \ obj) {\n  if (obj instanceof A) { totalArea += ((A)obj).getArea(); }\n  if (obj\
    \ instanceof B) { totalArea += ((B)obj).getArea(); }\n}\n\n```\n\n![](img/5cf5236b394075810b8edd6af6a34316_78_0.png)\n\
    \n![](img/5cf5236b394075810b8edd6af6a34316_78_1.png)\n\nNow, we can use **generics**\
    \ to get rid of **instanceof** and object casting? The short answer is – Yes and\
    \ No. At this point we come to a very important fact about the **generics:**"
  - "[PAGE 79]\n\nGenerics is a compiler feature, not a run-time feature. All class\
    \ type references are resolved at compile time.\n\nFor example, the sumArea method\
    \ can be re-written in generic notation as follows:\n\n```\npublic <T> void sumArea(T\
    \ obj) {\n    totalArea += obj.getArea();\n}\n```\n\n> The T parameter is not\
    \ a real class name, but a generic name. It must be placed before the return type.\n\
    \nIn the object-casting example, when the method sumArea receives an object of\
    \ class A, the reference obj is treated as if it was created by the statement\
    \ Object obj = new A(); by casting obj to the original class A we acquire access\
    \ to all its variables and methods.\n\nThe generics mechanism works somewhat differently.\
    \ At compile time, the type-variable T must be resolved to a real class name.\
    \ Since we did not provide any hints as to what it might be, the T will be substituted\
    \ with Object – the superclass for all classes – and that will be the only change\
    \ to the source. Without casting, reference obj declared as \"Object obj = new\
    \ A()\" will only have access to the instance variables and methods of class Object\
    \ and also to the methods of Object overridden by class A. This diagram shows\
    \ which properties of object A would be accessible in cases:\n\n| \"Object-casting\"\
    \ approach | A obj = new A() | \"Generic\" approach |\n|--- |--- |--- |\n| Parameter\
    \ obj is treated as being like this: Object obj = new A() | class Object | T is\
    \ substituted with Object. Parameter obj is treated as being like this: Object\
    \ obj = new A() |\n| | variable v1 | |\n| | method m1 | |\n| | variable v2 | |\n\
    | | method m2 | |\n| | (A) obj). | class A | obj. |\n| | variable v2 | |\n| |\
    \ method m2 | |\n| | variable v3 | |\n| | method m3 | | |\n\nAs we see, without\
    \ explicit casting, the \"generics\" code does not have access to the class A\
    \ instances and methods of object obj. This problem can"
  - '[PAGE 80]


    be solved by making a few changes to the class structure and also providing more
    information to the generic method.


    First, we can tell the generic method what class (or classes) can substitute the
    type-variable T:


    ```

    public < extends AB> void sumArea(T obj) { ... }

    ```


    The <T extends class> is called a bounded type, which sets the upper bound for
    classes that can be referenced by the type-variable T.


    Second, the new class (AB) should be made a superclass of classes A and B and
    should define all instance methods we can use within the generic method sumArea::


    ```

    abstract class AB { public double getActivity(); }

    class A extends AB { public double getActivity() {return 10.0; }

    class B extends AB { public double getActivity() {return 20.0; }

    ```


    > Note: class AB is not required to be abstract


    Now our obj will be viewed as being declared with “AB obj = new AB()”, and the
    getArea method of classes A and B will be reachable via the method overriding
    mechanism. Simply put, the declaration of the generic method was transformed from
    this:


    ```

    public <T> void sumArea(T obj) {

    totalArea += obj.getArea();

    }

    ```


    to this:


    ```

    public void sumArea(AB obj) {

    totalArea += obj.getArea();

    }

    ```


    That if we need access to the variables of classes A and B we can do only through
    methods declared in the superclass A and overridden in B.'
  - "[PAGE 81]\n\n# Generic Classes\n\nFirst of all, it is very important to understand\
    \ that a generic class is not much different from any regular Java class. What\
    \ makes it “generic” is a small addition to the class declaration syntax. Here\
    \ is an example of a generic class declaration:\n\n```\nclass G <T> { ... }\n\
    ```\n\n![](img/5cf5236b394075810b8edd6af6a34316_81_0.png)\n\nThe <T> notation\
    \ is a class type parameter in which T is a type-variable, i.e. parameter representing\
    \ a class name. It indicates that an (any) class name can be used in the declarations\
    \ of variables and methods of the class:\n\n```\nclass myClass <T> {\n    public\
    \ T myvalue;\n    public void setValue(T obj) {\n        myvalue = obj;\n    }\n\
    \n    public static void main(String args[]) {\n        myClass<String> c = new\
    \ myClass<String>();\n        c.setValue(\"test\");\n        System.out.println(c.myvalue);\
    \  // print: \"test\"\n\n        myClass<Integer> n = new myClass<Integer>();\n\
    \        n.setValue(123);\n        System.out.println(n.myvalue);  // print: \"\
    123\"\n    }\n}\n```\n\nNote that we have to specify the class type parameter\
    \ explicitly when creating objects of generic classes. This information is used\
    \ by Java for type safety checking, making sure, for example, that an object reference\
    \ of type myClass<String> does not point to an object of type myClass<Integer>.\n\
    \nThe class declaration shown in the previous example (class G <T>) allows substitution\
    \ of the type-variable T with any class name. In most cases, it is not desirable.\
    \ Usually, we want to restrict the range of classes for which generic class objects\
    \ can be built. We can achieve this by using another form of generic class declaration:\n\
    \n```\nclass G <T extends className> { ... }\n```"
