  - "[PAGE 57]\n\n# Method Overloading\n\n**Method overloading** is a mechanism used\
    \ by Java to distinguish methods having the same names but different parameter\
    \ lists. Each method in Java is distinguished by its **signature** – the name\
    \ of the method along with the list of parameter types. The signature of the testClass()\
    \ method could be expressed as “testClass”, and the signature of the testClass(int\
    \ n) would be “testClass,int”.\n\n# The “this” Keyword\n\nIn previous examples,\
    \ instance variables were referenced in constructors directly by their names.\
    \ But what will happen when a variable with the same name as the instance variable\
    \ is declared in the **main** method? This situation is perfectly legal because\
    \ all variables declared within the **main** method are not “visible” outside\
    \ of that method.\n\nAnother confusing situation would be when the name of an\
    \ instance variable is also used in the constructor’s parameter list. This problem\
    \ can be solved with the use of the keyword **this**, which represents the current\
    \ object. See this example:\n\n```\nclass testClass {\n  int x;\n  testClass(int\
    \ x) {\n    x = x;\n    this.x = x;\n  }\n\n  public static void main(String args[])\
    \ {\n    int x;\n    testClass obj = new testClass(100);\n    x = obj.x;\n  }\n\
    }\n```\n\nThe **this** keyword can be used not only to refer instance variables,\
    \ but also to invoke one constructor from another, or to pass the current object\
    \ as an argument between methods.\n\nImportant note: The **this** keyword can\
    \ be used only in constructors."
