    # 序言


    关于 Java 的书籍琳琅满目——从入门指南到完整参考书应有尽。第一类书籍倾向于专注于基础概念，并没有让你离开“Hello world!”程序太远。第二类书籍又太厚实了——通常超过
    1000 页。它们作为参考源非常棒，但细节过载且示例过于冗长。它们还试图涵盖尽可能多的主题，这使得学习曲线更加陡峭。


    本书的长度不到两百页，因此它绝对不是一本参考指南。它也不是一本“Java 基础”书。


    本书并不过分关注细节，而是通过小型综合性示例来说明一切，侧专注于 Java 的基本特性，这些特性对于构建现实应用至关重要。目标是让你对 Java 如何工作有一个整体的理解。细节以后可以从
    Java 原始规范和教程，或者从那些综合指南和完整参考书中查找到。


    从底层开始，本书将为你的 Java 知识打下坚实的基础。


    如果你想成为一名 Java 专家——这本书是一个很好的起点。祝你好运！


