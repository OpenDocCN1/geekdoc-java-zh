    \ offset, int length) - optional\n\n```java\nclass testMyOutputStream {\n    public\
    \ static void main(String[] args) {\n        myOutputStream myout;\n        BufferedOutputStream\
    \ bufout;\n        DataOutputStream dataout;\n\n        try {\n            myout\
    \ = new myOutputStream();\n            bufout = new BufferedOutputStream(myout);\n\
    \            dataout = new DataOutputStream(bufout);\n            dataout.writeDouble(123.4);\n\
    \            dataout.flush();\n        } catch (IOException e) {\n           \
    \ System.out.println(\"I/o error\");\n        }\n    }\n}\n```\n\nThe above program\
    \ produces this: “Received bytes: 8\"\n\n## Character Output Streams\n\nAll character\
    \ data in Java is represented in the Unicode format. The character output classes\
    \ convert Unicode characters into their local representation (e.g. ASCII format)\
    \ before sending them to output devices or other streams. Another function of\
    \ the character output streams is to generate a character representation of any\
    \ primitive type, as well as objects. This is implemented via the print and println\
    \ methods of the class PrintWriter. These methods are overloaded (i.e. there are\
    \ multiple versions of them) and can accept primitive data types, Strings, character\
    \ arrays, or objects.\n\nSimilar to the output stream classes that extend the\
    \ OutputStream class, the character stream classes extend the Writer abstract\
    \ class and its write methods.\n\nThe following program uses two different character\
    \ output streams to write an array of characters into a file:\n\n```java\nimport\
    \ java.io.*;\nclass testcharStreams {\n    public static void main(String args[])\
    \ {\n        char[] c = {'a', 'b', 'c'};\n\n        FileWriter filewriter;\n \
    \       PrintWriter printout;\n\n        try {\n            filewriter = new FileWriter(\"\
    write.txt\");\n            filewriter.write(c, 0, 3);\n            filewriter.flush();\n\
    \n            printout = new PrintWriter(\"print.txt\");\n            printout.println(123.4);\n\
    \            printout.flush();\n        }\n        catch (IOException e) {\n \
    \           System.out.println(\"I/o error\");\n        }\n    }\n}\n```\n"
  mdcn: "\n\n## 比较器 (Comparator)\n任何有序集合（例如 TreeSet）都需要某种比较算法来确定集合中的哪个元素比另一个元素更“大”。实际上，对于可以存储在有序集合中的每种类型的对象，都有默认的算法。这些算法通过\
    \ `Comparator` 函数式接口实现，该接口定义了 `compare()` 方法。如果我们想更改集合中对象的默认顺序，可以构建一个指向自定义比较器的集合。\n\
    \n请注意，`Comparator` 可以为没有自然排序的对象集合提供排序。\n\n下面的示例展示了如何创建一个自定义比较器来对整数数组进行降序排序。\n\n\
    ```java\nimport java.util.*;\nclass testComparator {\n    public static int reverse(Integer\
    \ n1, Integer n2) {\n        return n2.compareTo(n1);\n    }\n    public static\
    \ void main (String[] args) {\n        Integer[] nn = { 1, 2, 3 };\n        Arrays.sort(nn,\
    \ (n1, n2) -> reverse(n1, n2));\n        System.out.println(nn[0] + \" \" + nn[1]\
    \ + \" \" + nn[2]);\n    }\n}\n```\n\n该程序的输出将是“3 2 1”。\n\n注意：`Arrays` 类定义了多个排序方法；我们使用了其中一种：\n\
    `static void sort(T[] a, Comparator<? super T> c)`\n\n以下是执行过程：\n\n- T 变为第一个操作符\
    \ T\n- 整数数组替换第一个操作数 T\n- Lambda 表达式 `(n1, n2) -> reverse (n1, n2)` 被转换为 `Comparator<Integer>`\
    \ 函数式接口的实例，其 `compare()` 方法实现为 `{ reverse (n1, n2); }`\n- 在排序过程中，使用 `reverse()`\
    \ 来确定两个整数中哪一个更大，如下：\nn1>n2 : result>0; n1<n2 : result<0; n1=n2 : result=0\n\n\
    ## I/O 流 (I/O Streams)\n\n流是输入的抽象表示，从那里检索源数据；或者是输出，将数据发送到。Java 识别两种类型的流：字节流（byte\
    \ streams）和字符流（character streams）。字节流应用于发送或接收二进制对象，而当处理字符且需要数据的“字符”表示时，应使用字符流。\n\
    \n![](img/5cf5236b394075810b8edd6af6a34316_134_0.png)\n\n请注意，通过字节流或字符流传输数据是一次一个字节或一个字符进行的。存在缓冲流（buffered\
    \ streams）可以将数据分组到缓冲区，但这些流仍然基于底层的字节流或字符流。\n\n本章提供了流概念的概述，并说明了一些输入和输出流的使用。\n\n\
    ## 字节输出流 (Byte Output Streams)\n\n假设一个应用程序生成了以下类型的数据并想将其写入文件：\n\n![](img/5cf5236b394075810b8edd6af6a34316_134_1.png)\n\
    \n实现此目标的方法可以是为每种输入数据创建不同的类，但 Java 处理此任务的方法是构建一个流的“链”，每个流执行必要的数据转换并将结果传递给下一个流：\n\
    \n![](img/5cf5236b394075810b8edd6af6a34316_135_0.png)\n\n**FileOutputStream**\
    \ 类提供了几种向文件写入数据的方法。例如，它定义了方法 `write(byte[] b)`，将指定的字节字节数组写入文件。如果我们有一个准备好的数组，可以如下使用该方法：\n\
    \n```java\nbyte[] b = {97, 98, 99};\nFileOutputStream fileout;\nfileout = new\
    \ FileOutputStream(\"myfile.txt\");\nfileout.write(b);\n```\n\n然而，**FileOutputStream**\
    \ 类不处理原始数据类型（double, float, int 等）。因此，为了写出一个 double 类型的数字，我们需要引入 **DataOutputStream**\
    \ 类，它实现了 `writeDouble` 方法。**DataOutputStream** 将接收到的参数转换为字节数组，并通过调用底层流的 **write**\
    \ 方法将每个字节一个接一个传递给底层流：\n\n```java\nDataOutputStream dataout;\ndataout = new DataOutputStream(fileout);\n\
    ```\n\n| dataout 将为每个输出字节调用 fileout.write() 方法。 |\n\n现在，我们可以调用 **DataOutputStream**\
    \ 的 `writeDouble` 方法，它将 double 类型的数字转换为字节，并通过 **write** 方法将其传递给 **FileOutputStream**：\n\
    \n```java\ndataout.writeDouble(123.4);\n```\n\n通常情况下，流链是从底向上构建的：\n\n```java\n\
    C c = new C();\nB b = new B(c);\nA a = new A(b);\n// 或者只需：\nA a = new A(new B(c));\n\
    ```\n\n数据在输出流之间的传递方式如下：\n\n| 对象 a: | 对象 b: | 对象 c: |\n| --- | --- | --- |\n| a.write(...)\
    \ | write(...) | write(...) |\n| 转换 | 转换 | 转换 |\n| b.write(...) | c.write(...)\
    \ | |\n| | | } |\n\n为了使此机制运行，必须满足以下要求：每个输出流必须是 OutputStream 的子类，且每个输出流都具有以下方法：\n\
