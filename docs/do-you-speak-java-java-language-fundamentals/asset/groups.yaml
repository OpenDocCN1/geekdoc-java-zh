    \ Their usage is subject to the following rules:\n\nDeclaration Rule:\n\n> Instance\
    \ variables, methods, and statement blocks must be declared without the static\
    \ modifier\n\nAccessibility Rule:\n\n> Instance variables and methods can be used\
    \ only after an object (instance) of the class is created, and must be referenced\
    \ via the object name\n\nExecution Rule:\n\n> All instance declarations and statement\
    \ blocks {...} of a class are processed (i.e. executed) each time an object (i.e.\
    \ instance) of the class is created.\n\nThe following example shows how objects\
    \ could track their creation sequence.\n\nNote: The new statement (discussed in\
