    Exception in main!"
- md: "\n# Handling Checked Exceptions\n\nChecked exceptions are exceptions explicitly\
    \ declared and thrown by some Java classes or by user programs. If your program\
    \ uses a Java class or calls a method that could throw a checked exception, you\
    \ must catch that exception or explicitly propagate it up to the calling method.\n\
    \nThis diagram illustrates how the checked exceptions should be processed:\n\n\
    ![](img/5cf5236b394075810b8edd6af6a34316_110_0.png)\n\nNote that this method must\
    \ be declared with the throws someException clause if it can create and throw\
    \ its own exception or if it catches a checked exception and re-throws it with\
    \ the throw someException statement.\n\nExample:\n\n```\n// Explicit propagation\
    \ of checked exceptions\nimport java.io.*;\nclass MyClass {\n    public static\
    \ void main(String[] args) {\n        String file = \"not_existing_file\";\n \
    \       try {\n            checkFile(file);\n        } catch (IOException e) {\n\
    \            System.out.println(\"main: checkFile failed!\");\n        }\n   \
    \ }\n}\n```\n\n![](img/5cf5236b394075810b8edd6af6a34316_110_1.png)\n\n```\npublic\
    \ static void checkFile (String file) throws IOException {\n    FileReader f;\n\
    \    try {\n        f = new FileReader(file);\n    } catch (IOException e) {\n\
    \        System.out.println(\"checkFile: IOException!\");\n        throw e;\n\
    \    }\n}\n```\n\n![](img/5cf5236b394075810b8edd6af6a34316_111_0.png)\n\n![](img/5cf5236b394075810b8edd6af6a34316_111_1.png)\n\
    \n![](img/5cf5236b394075810b8edd6af6a34316_111_2.png)\n\nThe above code produces\
    \ the output:\n\ncheckfile: IOException!\nmain: checkFile failed!\n\nIn addition\
    \ to the pre-defined set of checked and unchecked exceptions provided by Java,\
    \ you can build your own exceptions, similar to checked exceptions. To understand\
    \ how it's done, we will first review the exceptions classes.\n\n# Exceptions\
    \ Class Hierarchy\n\nFor every exception, Java creates an object containing some\
    \ useful information about the exception. Each type of exception is represented\
    \ by its own class - FileNotFoundException, IndexOutOfBoundsException, etc. All\
    \ these classes are sub-classes of the top class Throwable. The diagram below\
    \ shows the hierarchy of the exceptions classes:\n\n![](img/5cf5236b394075810b8edd6af6a34316_112_0.png)\n\
    \nError and RuntimeExceptions are unchecked exceptions and are not required to\
    \ be caught and handled. The rest are checked exceptions that must be handled\
    \ by application logic if they can be thrown during execution.\n\nClass **Throwable**\
    \ provides several useful methods that can be used in the exception handling logic\
    \ of your program. Here are some of them:\n\n| String getMessage() | Returns the\
    \ detailed message string for this exception |\n| void printStackTrace() | Sends\
    \ the above message and the trace information to the standard error stream |\n\
    | String toString() | Returns a short description of this exception |\n\nNow,\
    \ that we know how the exceptions classes are organized, let's take a look at\
    \ how to create a custom one.\n\n# Creating Custom Exceptions\n\nA custom, user-defined\
    \ exception can be built as a sub-class of the **Exception** class as follows:\n\
    \n```\nclass CustomException extends Exception {\n    public CustomException(String\
    \ msg) {\n        super(msg);\n    }\n}\n\nclass runTest {\n    public static\
    \ void main(String args[]) {\n        try {\n            testMyException();\n\
    \        } catch (CustomException e) {\n            System.out.println( e.getMessage()\
    \ );\n        }\n    }\n\n    // Method that throws CustomException\n    public\
    \ static void testMyException() throws CustomException {\n        CustomException\
    \ e;\n        e = new CustomException(\"My exception\");\n        throw e;\n \
    \   }\n}\n```\n\n# Threads\n\nWhen two or more parts of a program are running\
    \ concurrently, such program is called a multithreaded program. Each path of execution\
    \ is called a thread. Every Java program has at least one thread that starts with\
    \ the main thread.\n\n# Starting Threads\n\nAn application program can create\
    \ as many threads as needed. To be able to create a thread, a class needs either\
    \ to extend the Thread class, or implement the Runnable interface. In both cases,\
    \ the class creating a thread must implement the run() method. The below diagram\
    \ illustrates the two ways of creating threads. Note that in both cases an object\
    \ of type Thread must be present and have access to the run() method of your class:\n\
    \n| Object of type Thread | Object of type Thread |\n| :--- | :--- |\n| class\
    \ Thread | class Thread |\n| start {...} | start {...} |\n| class A extends Thread\
    \ run() {...} | class B implements Runnable run() {...} |\n\nAs the diagram shows,\
    \ a thread is started by the start() method of class that calls the run() method\
    \ defined in the class starting the thread.\n\nIn this example new thread is started\
    \ by an object of class myClass extends the Thread class:\n\n```\nclass myClass\
    \ extends thread {\n    public void run() {}{\n    public static void main(String\
    \ args[]) {\n        myClass th1 = new myClass();\n        th1.start();\n    }\n\
    }\n```\n\nWhen your class extends the Thread class, the only method that you have\
    \ to implement is the run() method. This method should define the processing that\
    \ will be done by the new thread. Note, that the run() method defined by the class\
    \ Thread is empty and does nothing.\n\nYou can also implement (i.e. override)\
    \ other methods of class Thread, but with one exception – the start() method.\
    \ If you implement the start() method, and even if it calls the run() method,\
    \ no threads will be started, run() will be executed as a regular method of your\
    \ class, within the current thread.\n\nThis method of creating threads is completely\
    \ acceptable, but if you are not intending to override other methods of class\
    \ Thread besides the run() method, a better approach would be to implement the\
    \ Runnable interface.\n\nIn this example a new thread is created by an object\
    \ of class myClass implementing the Runnable interface:\n\n```\nclass myClass\
    \ implements Runnable {\n    public void run() {}\n    public static void main(String\
    \ args[]) {\n        Thread th2 = new Thread(new myClass() );\n        th2.start();\n\
    \    }\n}\n```\n\nThe Runnable interface declares only one method – run(), so\
    \ your class needs to implement that method. To start a new thread, the program\
    \ has to create an object of class Thread using the following constructor:\n\n\
    Thread (Runnable target)\n\nHere, target is an instance of your class.\n\nIt's\
    \ important to reiterate that a thread can be started only by the start() method\
    \ of a Thread object. In the first example, when a sub-class of Thread was instantiated,\
    \ an object of class Thread was created automatically by calling the super() constructor.\
    \ In the second example, we created a Thread object explicitly, and at the same\
    \ time passed an object of the class myClass to it.\n\nHere is a sample program\
    \ that starts one thread.\n\n```java\nimport java.io.IOException;\n\nclass testThread\
    \ implements Runnable {\n    public static void main(String args[]) {\n      \
    \  Thread th = new Thread(new testThread());\n        th.setName(\"Thread 1\"\
    );\n        th.start();\n\n        try {\n            System.out.println(\"main:\
    \ hit enter...\");\n            System.in.read();\n        } catch (Exception\
    \ e) {\n            System.out.println(\"main exception: \" + e);\n        }\n\
    \        System.out.println(\"main ended\");\n    }\n\n    public void run() {\n\
    \        String name = Thread.currentThread().getName();\n        try {\n    \
    \        System.out.println(\"thread: hit enter...\");\n            System.in.read();\n\
    \        } catch (Exception e) {\n            System.out.println(\"thread exception:\
    \ \" + e);\n        }\n        System.out.println(name + \" thread ended\");\n\
    \    }\n}\n```\n\nThe above program will prompt you to hit Enter twice. The first\
    \ request will come from the thread, the second – from the main method. You should\
    \ Enter twice to first stop the execution of the main method, then the thread\
    \ execution.\n\n# Daemon Threads\n\nWhen you execute the previous program, you\
    \ will notice that the main thread ends once you hit Enter, but the thread will\
    \ continue running until you hit again. Threads that continue execution after\
    \ the parent thread dies are called user threads. Another type of threads is called\
    \ daemon threads. A daemon thread dies once its parent thread dies. By default,\
    \ a newly created thread is a daemon; to make it a daemon, you need to mark it\
    \ as such by calling setDaemon(true). Make sure it is done before you start the\
    \ thread:\n\n```\nThread th = new Thread(new myClass() )\nth.setDaemon(true);\n\
    th.start();\n```\n\n# Interrupting Thread Execution\n\nA thread can be interrupted\
    \ by another thread via the instance method interrupt():\n\n```\nThread th = new\
    \ Thread(new myClass() );\nth.start();\n```\n\n```\nth.interrupt();\n```\n\nThe\
    \ interrupt method sets a flag in the thread object, which has to be checked in\
    \ the run() method to have any effect.\n\n```java\npublic void run() {\n    if\
    \ (Thread.interrupted()) {\n        System.out.println(\"I was interrupted\");\n\
    \    }\n}\n```\n\nNote that interrupt() is an instance method, and interrupted()\
    \ is a static method.\n\nNeither of these methods stop tread execution. They merely\
    \ allow to \"send a signal\" to the thread, but how to process this \"signal\"\
    \ is up to the thread being interrupted.\n"
  mdcn: "\n\n# 处理检查异常\n\n检查异常（Checked exceptions）是由某些 Java 类或用户程序显式声明并抛出的异常。如果你的程序使用了\
    \ Java 类或调用了可能抛出检查异常的方法，你必须捕获该异常，或者显式地将其传递给调用方法。\n\n此图说明了应该如何处理检查异常：\n\n![](img/5cf5236b394075810b8edd6af6a34316_110_0.png)\n\
    \n请注意，如果该方法可以创建并抛出自己的异常，或者捕获了检查异常并使用 `throw someException` 语句重新抛出，则该方法必须声明 `throws\
    \ someException` 子句。\n\n示例：\n\n```\n// 显式传递检查异常\nimport java.io.*;\nclass MyClass\
    \ {\n    public static void main(String[] args) {\n        String file = \"not_existing_file\"\
    ;\n        try {\n            checkFile(file);\n        } catch (IOException e)\
    \ {\n            System.out.println(\"main: checkFile failed!\");\n        }\n\
    \    }\n}\n```\n\n![](img/5cf5236b394075810b8edd6af6a34316_110_1.png)\n\n```\n\
    public static void checkFile (String file) throws IOException {\n    FileReader\
    \ f;\n    try {\n        f = new FileReader(file);\n    } catch (IOException e)\
    \ {\n        System.out.println(\"checkFile: IOException!\");\n        throw e;\n\
    \    }\n}\n```\n\n![](img/5cf5236b394075810b8edd6af6a34316_111_0.png)\n\n![](img/5cf5236b394075810b8edd6af6a34316_111_1.png)\n\
    \n![](img/5cf5236b394075810b8edd6af6a34316_111_2.png)\n\n上述代码产生以下输出：\n\ncheckfile:\
    \ IOException!\nmain: checkFile failed!\n\n除了 Java 提供的预定义检查和未检查异常集外，你还可以像检查异常一样构建自己的异常。为了理解如何实现，我们首先复习异常类。\n\
    \n# 异常类层次结构\n\n对于每个异常，Java 都会创建一个包含有关该异常有用信息的对象。每种类型的异常都由它自己的类表示 - FileNotFoundException、IndexOutOfBoundsException\
    \ 等。所有这些类都是顶级类 **Throwable** 的子类。下图显示了异常类的层次结构：\n\n![](img/5cf5236b394075810b8edd6af6a34316_112_0.png)\n\
    \nError 和 RuntimeExceptions 是未检查异常，不需要被捕获和处理。其余的都是检查异常，如果它们在执行期间可能抛出，则必须由应用程序逻辑处理。\n\
    \n**Throwable** 类提供了几个可以在程序异常处理逻辑中使用的有用方法。以下是其中一些：\n\n| String getMessage() |\
    \ 返回此异常的详细消息字符串 |\n| :--- | :--- |\n| void printStackTrace() | 将上述消息和轨迹追踪信息发送到标准错误流\
    \ |\n| String toString() | 返回此异常的简短描述 |\n\n现在我们已经知道了异常类是如何组织的，让我们来看看如何创建一个自定义异常。\n\
    \n# 创建自定义异常\n\n自定义的、用户定义的异常可以如下构建为 **Exception** 类的子类：\n\n```\nclass CustomException\
    \ extends Exception {\n    public CustomException(String msg) {\n        super(msg);\n\
    \    }\n}\n\nclass runTest {\n    public static void main(String args[]) {\n \
    \       try {\n            testMyException();\n        } catch (CustomException\
    \ e) {\n            System.out.println( e.getMessage() );\n        }\n    }\n\n\
    \    // 抛出 CustomException 的方法\n    public static void testMyException() throws\
    \ CustomException {\n        CustomException e;\n        e = new CustomException(\"\
    My exception\");\n        throw e;\n    }\n}\n```\n\n# 线程\n\n当程序的两个或多个部分并发运行时，该程序被称为多线程程序。每条执行路径被称为一个线程。每个\
    \ Java 程序都至少有一个从主线程（main thread）启动的线程。\n\n# 启动线程\n\n应用程序可以根据需要创建任意数量线程。为了能够创建线程，类需要扩展\
    \ Thread 类或实现 Runnable 接口。在这两种情况下，创建线程的类都必须实现 run() 方法。下图说明了创建线程的两种方式。注意，在两种情况下，必须存在一个\
    \ Thread 类型的对象，并且它可以访问你类的 run() 方法：\n\n| 类型为 Thread的对象 | 类型为 Thread 的对象 |\n| :---\
    \ | :--- |\n| class Thread | class Thread |\n| start {...} | start {...} |\n|\
    \ class A extends Thread run() {...} | class B implements Runnable run() {...}\
    \ |\n\n如图所示，线程通过调用启动线程的类中的 start() 方法来启动，该方法调用该类中定义的 run() 方法。\n\n在这个示例中，新线程是由一个扩展\
    \ Thread 类的 myClass 对象启动的：\n\n```\nclass myClass extends thread {\n    public\
    \ void run() {}{\n    public static void main(String args[]) {\n        myClass\
    \ th1 = new myClass();\n        th1.start();\n    }\n}\n```\n\n当你的类扩展 Thread 类时，你必须实现的方法只有\
    \ run() 方法。该方法应该定义由新线程将执行的操作。注意，Thread 类定义的 run() 方法是空的，什么都不做。\n\n你也可以实现（即重写）类\
    \ 的其他方法，但有一个例外——start() 方法。如果你实现了 start() 方法，即使它调用了 run() 方法，也不会启动任何线程，run() 将作为你类的一个普通方法在当前线程中执行。\n\
    \n这种创建线程的方法是完全可以的，但如果你不想重写除 run 方法之外的 Thread 类其他方法，更好的方法是实现 Runnable 接口。\n\n在这个示例中，新线程是由实现\
    \ Runnable 接口的 myClass 对象创建的：\n\n```\nclass myClass implements Runnable {\n  \
    \  public void run() {}\n    public static void main(String args[]) {\n      \
    \  Thread th2 = new Thread(new myClass() );\n        th2.start();\n    }\n}\n\
    ```\n\nRunnable 接口只声明了一个方法 – run()，因此你的类需要实现该方法。要启动新线程，程序必须使用以下构造函数创建 Thread 类对象：\n\
    \nThread (Runnable target)\n\n在这里，target 是你的类的实例。\n\n需要重申的是，线程只能通过 Thread 对象的\
    \ start() 方法启动。在第一个示例中，当 Thread 的子类被实例化时，通过调用 super() 构造函数自动创建一个 Thread 类对象。在第二个示例中，我们显式创建了一个\
    \ Thread 对象，并向它传递了 myClass 类的对象。\n\n这是一个启动线程的示例程序：\n\n```java\nimport java.io.IOException;\n\
    \nclass testThread implements Runnable {\n    public static void main(String args[])\
    \ {\n        Thread th = new Thread(new testThread());\n        th.setName(\"\
    Thread 1\");\n        th.start();\n\n        try {\n            System.out.println(\"\
    main: hit enter...\");\n            System.in.read();\n        } catch (Exception\
    \ e) {\n            System.out.println(\"main exception: \" + e);\n        }\n\
    \        System.out.println(\"main ended\");\n    }\n\n    public void run() {\n\
    \        String name = Thread.currentThread().getName();\n        try {\n    \
    \        System.out.println(\"thread: hit enter...\");\n            System.in.read();\n\
    \        } catch (Exception e) {\n            System.out.println(\"thread exception:\
    \ \" + e);\n        }\n        System.out.println(name + \" thread ended\");\n\
    \    }\n}\n```\n\n上述程序提示你回车。第一个请求来自线程，第二个来自主方法。你应该两次回车，先停止主方法的执行，然后是线程的执行。\n\n\
    # 守护线程\n\n当你执行之前的程序时，你会注意到主线程在你回车后结束了，但线程将继续运行直到你再次回车。在父线程死亡后继续执行的线程被称为用户线程。另一种类型的线程被称为守护线程（daemon\
    \ threads）。守护线程会在父线程死亡后死亡。默认情况下，新创建的线程是守护线程；要使其成为守护线程，你需要通过调用 setDaemon(true)\
    \ 进行标记。确保在启动线程之前完成操作：\n\n```\nThread th = new Thread(new myClass() )\nth.setDaemon(true);\n\
    th.start();\n```\n\n# 中断线程执行\n\n一个线程可以通过实例方法 interrupt 被另一个线程中断：\n\n```\nThread\
    \ th = new Thread(new myClass() );\nth.start();\n```\n\n```\nth.interrupt();\n\
    ```\n\ninterrupt 方法在线程对象中设置一个标志，该标志必须在 run() 方法中检查才能产生效果。\n\n```java\npublic void\
    \ run() {\n    if (Thread.interrupted()) {\n        System.out.println(\"I was\
    \ interrupted\");\n    }\n}\n```\n\n注意，interrupt() 是实例方法，而 interrupted() 是静态方法。\n\
    \n这两个方法都不会停止线程执行。它们仅仅允许向线程“发送一个 信号”，但如何处理这个“信号”取决于被中断的线程。\n\n"
