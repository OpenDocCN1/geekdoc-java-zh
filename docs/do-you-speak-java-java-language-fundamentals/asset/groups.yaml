    \ range\");\n        } else {\n            System.out.println(\"out range\");\n\
    \        }\n    }\n}\n```\n\nExplanation: the filter method accepts an object\
    \ of type IntPredicate and returns it back. The goal here is to pass a lambda\
    \ expression to this method and get it back as an object. A lambda expression\
    \ itself does not tell us what the functional interface it is used for, so we\
    \ need to provide this information to the Java compiler either by directly assigning\
    \ the lambda expression to a functional interface variable, or by passing the\
    \ lambda expression as a parameter of a functional interface type. So, in this\
    \ example, the lambda expression n -> (n>min && n<max) creates an object of the\
    \ IntPredicate type, substitutes its test method with the (n>min && <max), and\
    \ passed this object expression to the filter method. The filter method returns\
    \ this object back, so the expression filter(n->(n>min&n<max)) is in fact an reference\
    \ of type IntPredicate. Finally, we use this object reference to call the instance\
    \ method test (which, at this moment, reflects the lambda expression): filter(n\
    \ -> (n > min && n < max)).test(i)\n\nThe outcome of the above program: “out of\
    \ range”.\n\n## Method Reference\n\nThe method reference feature allows you to\
    \ create a reference to a method without executing the method. That reference\
    \ then can be passed to another method for execution using the double colon ::\
    \ operator. The following diagram and corresponding program code illustrates the\
    \ process:\n\n```java\ninterface F {\n    void execute();\n}\nclass myClass {\n\
    \    static void common(F obj) { obj.execute(); }\n    void myMethod() {...}\n\
    \    public static void main(String[] args) {\n        common(myClass::myMethod);\n\
    \    }\n}\n```\n\nThe common() method is defined to accept an object of the functional\
    \ interface F and run its execute() method. At runtime, the method reference operator\
    \ :: creates an instance of the functional interface F (because the common() method\
    \ expects it whose execute() method points to method1). Then, the instance of\
