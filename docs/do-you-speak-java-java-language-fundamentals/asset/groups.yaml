    \ an object of the corresponding functional interface. For example, we can pass\
    \ a lambda expression as a parameter to a method if that parameter is declared\
    \ as a functional interface.\n\nHere is an example; the IntPredicate is a factory-supplied\
    \ functional interface declaring the following test method:\n\nboolean test(int\
    \ value)\n\nWe are going to utilize it for selecting numbers within a specified\
    \ value range (n > min) & (n < max). Here is what to be done:\n\n+   - Create\
    \ an object of type IntPredicate\n- Substitute its test method with the desired\
    \ conditional expression\n- Use the test method to check if a number is within\
    \ the range\n\n```\nimport java.util.function.*;\n```\n\n```\nclass testLambda\
    \ {\n    static int min = 0;\n    static int max = 100;\n```\n\n```\npublic static\
    \ IntPredicate filter(IntPredicate p) {return p;}\n\npublic static void main(String\
    \ args[]) {\n    int i = 100;\n    if(filter(n -> (n > min && n < max) ).test(i))\
    \ {\n        System.out.println(\"within range\");\n    } else {\n        System.out.println(\"\
    out range\");\n    }\n}\n```\n\nExplanation: the filter method accepts an object\
    \ of type IntPredicate and returns it back. The goal here is to pass a lambda\
    \ expression to this method and get it back as an object. A lambda expression\
    \ itself does not tell us what"
