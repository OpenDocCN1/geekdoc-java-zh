    \ `parallel()` 方法：\n\n```java\nint sum = Arrays.stream(doubles)\n    .parallel()\n\
    \    .mapToInt(n -> round(n)).sum();\n```\n\n# 可观察对象与观察者\n\n`Observable` 类配合 `Observer`\
    \ 接口提供了一种建立对象间通信的简单机制。一个对象（观察对象）可以被一个或多个其他对象（观察者）观察。当需要时，被观察的对象可以通知观察者，它们可以执行某些操作。\n\
    \n| class M extends Observable | class W1 implements Observer |\n| :--- | :---\
    \ |\n| m = new M() | w1 = new W1() |\n| m.addObserver(w1) | w1.update() |\n| m.addObserver(w2)\
    \ | class W2 implements Observer |\n| | w2 = new W2() |\n| m.setChanged() | w2.update()\
    \ |\n| m.notifyObservers(observers) | |\n\n示例：\n```java\nimport java.util.*;\n\
    public class myClass extends observable implements Observer {\nString myName;\n\
    public myClass(String s) { myName = s; }\n\npublic void update(Observable m, Object\
    \ arg)\n  { System.out.println(myName + \" received a \" + arg + \" from \" +\
    \ m.myName); }\n\npublic static void main(String args[])\n  { myClass m = new\
    \ myClass(\"manager\");\n\n  m.addObserver(new myClass(\"Bob\"));\n  m.addObserver(new\
    \ myClass(\"Joe\"));\n\n  m.setChanged();\n\n  m.notifyObservers(\"message\");\n\
    }\n```\n\n![](img/5cf5236b394075810b8edd6af6a34316_153_0.png)\n\n> 创建两个新对象并将它们注册为\
    \ m 的对象。\n\n> 在每次通知之前必须调用 setChanged()\n\n> 每个观察者的 update() 方法都将被调用；注意：m 将自动传递给\
    \ update()。\n\n此程序的输出：\n\"Bob received a message from manager\"\n\"Joe received\
    \ a message from manager\"\n\n# 枚举\n\n枚举背后的思想是提供一种简单的方法来定义常量集合，这些常量不受限于任何原始类型或对象类型（通常这些类型限制会限制它们的使用范围）。Java\
    \ 对此问题的解决方案是一种新类型的类，其实例被视为常量。这里是一个枚举类的声明示例：\n\n```java\nenum myEnum { MIN, MAX\
    \ }\n```\n\n注意这里使用 `enum` 而不是 `class`。`MIN` 和 `MAX` 是 `myEnum` 类的实例（对象），被称为枚举常量。它们被隐式地声明为\
    \ `public`、`static`、`final`。当枚举类在程序中第一次被引用时，枚举常量会被创建（实例化）。因此，你不需要使用 `new` 运算符（事实上，你也无法使用）来创建枚举类的对象。除了这些差异外，枚举类仍然是\
    \ Java 类，因此它们可以拥有静态变量和实例变量、方法、语句块，甚至构造函数。\n\n示例：\n\n| myEnum { MIN, MAX; } | 静态语句块；当类\
    \ myEnum 加载到 JVM 时执行 |\n| :--- | :--- |\n| static { System.out.println(\"Class\
    \ myEnum loaded\"); } | 实例语句块；当该类的实例被创建时执行。 |\n| { System.out.println(this + \"\
    \ created\"); } | |\n| public static void main(String args[]) { myEnum min, max;\
    \ } | 第一次引用类 myEnum；声明两个 myEnum 类型的变量 |\n\n此程序的输出：\n\n```\nMIN created\nMAX created\n\
    Class myEnum created\n```\n\n现在，让我们看看可以用枚举做什么。说明枚举优势的最佳方法是通过示例。假设我们有一个监控主要国家机场天气状况的方法。通过使用枚举，我们可以在编译时确保方法只接收预定义的机场集合，从而减少运行时错误的风险。\n\
    \n```java\nenum Airport {\n    JFK(\"New York\"),\n    PHL(\"Philadelphia\"),\n\
    \    MIA(\"Miami\");\n\n    String state, city;\n\n    Airport(String s, String\
    \ c) {\n        this.state = s;\n        this.city = c;\n    }\n\n    public static\
    \ double getTemp(Airport a) { return 80.0; }\n    public static String getCity(Airport\
    \ a) { return a.city; }\n    public static String getState(Airport a) { return\
    \ a.state; }\n\n    public static void main(String args[]) {\n        Airport\
    \ a;\n        a = Airport.MIA;\n        System.out.println(getCity(a) + \", \"\
    \ + getState(a) + \" temp=\" + getTemp(a));\n    }\n}\n```\n\n此程序的输出：**Miami,\
    \ FL temp=80.0**\n\n"
