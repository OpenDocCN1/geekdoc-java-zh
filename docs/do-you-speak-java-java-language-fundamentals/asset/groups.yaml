    five\", \"six\", \"seven\", \"eight\", \"nine\"};\n  return digits[N.intValue()];\n\
    };\nInteger N = Integer.valueOf(4);\nSystem.out.println(spell.apply(N)); // prints:\
    \ \"four\"\n```\n\nIn previous examples we were explicitly declaring the object\
