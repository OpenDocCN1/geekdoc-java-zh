    The above code prints: **My position: 5,0,0**"
  - "[PAGE 59]\n\n# The \"super\" Keyword\n\nOne of the Object-Oriented Design principles\
    \ is inheritance. Inheritance represents the parent-child relationship between\
    \ classes, when a child class (subclass) inherits all the features of the parent\
    \ class (superclass). Java uses the **extends** keyword in class declaration to\
    \ establish inheritance:\n\n```\nclass superClass { body }\nclass subclass extends\
    \ superClass { body }\n```\n\nExample of creating an object of a subclass:\n\n\
    ```\nclass superClass {\n  int x;\n  superClass(int x) {\n    this.x = x;\n  }\n\
    \  // Execution logic\n  public static void main(String[] args) {\n    subClass\
    \ o = new subclass(1);\n    System.out.println(o.x); // prints: 2\n    System.out.println((super)o.x);\
    \ // prints: 1\n  }\n}\nclass subclass extends superClass {\n  int x;\n  subClass(int\
    \ x) {\n    this.x = super.x + 1;\n  }\n}\n```\n\n| 3. Initializes the instance\
    \ x of the superClass (x=1) |\n\n| 1. Creates an instance of the subclass |\n\n\
    | 5. Object is needed to access the superclass instance x |\n\n| 2. Creates an\
    \ instance of the superclass. Must be the first statement, otherwise Java will\
    \ call super() |\n\n| 4. Initializes the instance variable x of the subclass (x=1+2)\
    \ |\n\nWhen an object of a subclass is created, a superclass object is created\
    \ as well, implicitly or explicitly. It means that any object consists of the\
    \ subclass instance and its parent class (superclass) instance.\n\nIn the above\
    \ example, the user-supplied subclass constructor subClass() creates the superclass\
    \ instance by calling the superclass constructor **superClass()** via the **super(x)**\
    \ statement. The keyword **super**, when used in the subclass constructor, represents\
    \ the current object of the parent class. In the example, it is also used to access\
    \ the instance variable **x** of the superclass."
  - "[PAGE 60]\n\n# Object Casting\n\nNote, the super keyword can be used only in\
    \ constructors. So how do we access the instance variables or instance methods\
    \ of a superclass from a subclass object? In the above example the variable x\
    \ is defined in both the subclass and the superclass. The subclass' x can be referenced\
    \ via the subclass object name as follows: subclassObject.x, but the superclass'\
    \ x is hidden. The solution to this problem is object casting. We can cast a subclass\
    \ object to any of its superclass objects. Consider an example with two classes\
    \ Parent and Child, both declaring an instance variable x. Class Parent is superclass\
    \ of class Child. An instance (object) of class Child would contain instances\
    \ instances variable x. The code below shows how to access all of the different\
    \ instance variables by utilizing the object casting mechanism:\n\n```\nclass\
    \ Parent { int x; }\nclass Child extends Parent { int x; }\nclass Test {\n   \
    \ public static void main(String args[]) {\n        int y;\n\n        // A Child\
    \ object referenced by a variable of type Child:\n        Child c = new Child();\n\
    \        y = c.x;             // reference to the x of class Child\n        y\
    \ = ((Parent) c.x); // reference to the x of class Parent\n\n        // A Child\
    \ object referenced by a variable of type Parent:\n        Parent p = new Child();\n\
    \        y = p.x;             // reference to the x of class Parent\n        y\
    \ = ((Child) p.x); // reference to the x of class Child\n    }\n}\n```"
- md: "\nThis table summarizes the accessibility of instance variables of super and\
    \ sub-classes:\n\n| Object reference | class Parent Instance variables | class\
    \ Child extends Parent Instance variables |\n| --- | --- | --- | --- | --- |\n\
    | | unique | same as in Child | unique | same as in Parent |\n| | Parent p1 =\
    \ new Parent() | | | |\n| p1. | can access | can access | - | - |\n| | Parent\
    \ p2 = new Child() | | | |\n| p2. ((Child) p2). | can access | can access | can\
    \ access | can access |\n| | Child c = new Child() | | | |\n| c. | can access\
    \ | | can access | can access |\n| ((Parent) c). | can access | can access | -\
    \ | - |\n| super. | can access | can access | - | - |\n\n## Method Overriding\n\
    \nMethod overriding is a special mechanism allowing for declaring instance methods\
    \ with the same signatures (name and parameter types) in a superclass and any\
    \ of its subclasses.\n\nThis table presents different ways of accessing instance\
    \ methods of super and sub-classes. Please note that object casting does not give\
    \ you availability to access overridden methods of a superclass from a subclass.\
    \ Once a subclass object is created, only the subclass' instance per each overridden\
    \ method is accessible.\n\n| Object reference | class Parent | class Child extends\
    \ Parent |\n| --- | --- | --- |\n| | Instance methods (unique | overridden) |\
    \ Instance methods (unique | overridden) |\n| p1. | can access | can access |\
    \ - | - |\n| Parent p2 = new Child() | | | | |\n| p2. ((Child) p2). | can access\
    \ | can access | can access | can access |\n| Child c = new Child() | can access\
    \ | - | can access | can access |\n| c. super. | can access | can access | - |\
    \ - |\n| (Parent) c). | can access | - | - | can access |\n\n## Determining the\
    \ Type of an Object\n\nWhen working with objects, sometimes it might not be clear\
    \ what class an object belongs to. For example, if class A is extended by classes\
    \ B and C, an object reference of type A can reference objects of classes A, B,\
    \ and C:\n\n```\nA obj;\nobj = new A(); // obj is a reference to an object of\
    \ class A\nobj = new B(); // obj is a reference to an object of class B\nobj =\
    \ new C(); // obj is now references an object of class C\n```\n\nAn object reference\
    \ of type Object can refer any object, of any class:\n\n```\nObject obj;\nobj\
    \ = new String(\"text\");\nobj = new Integer(123);\nobj = new MyClass();\n```\n\
    \nSo, how can we determine the real type of an object referred to by a variable?\n\
    The answer is – with the help of the instanceof operator.\n\nThe format of the\
    \ instanceof operator is:\n\n```\nobjectReference instanceof classType\n```\n\n\
    Example:\n\n```\nObject obj;\nobj = new String(\"text\");\nobj = new Date();\n\
    \nif (obj instanceof String) {\n    System.out.println(\"Object of type String\"\
    );\n}\n\nif (obj instanceof Date) {\n    System.out.println(\"Object of type Date\"\
    );\n}\n```\n\n## Summary\n\nHere is the summary of what we have learned thus far\
    \ about the objects:\n\n- Objects are instantiated (i.e. created) using the **new**\
    \ statement, which has the following format: `className variable = new className();`\n\
    \n- A **constructor** is a special method with the [same name as the class name]\
    \ that is invoked automatically by the JVM when an object of the class is being\
    \ created.\n\n- The format of the constructor is: **className(parameters) {body}**\n\
    The **parameters** and **body** are optional, the return type is omitted.\n\n\
    - The constructor is invoked after all instance declarations are processed and\
    \ instance blocks (if present) are executed.\n\n- A class can have several constructors\
    \ with different **signatures** (i.e. with different sequences of argument types).\n\
    \n- An empty constructor ( **className()** ) is automatically created by Java\
    \ when no constructors are declared explicitly.\n\n- The default constructor (\
    \ **className()** ) will not be created by the JVM if at least one explicitly\
    \ declared constructor is present.\n\n- A constructor can invoke another constructor\
    \ of the same class by executing the `this(parameters);` as the first statement\
    \ of the constructor’s body.\n\n- Instance variables can be referenced in a constructor\
    \ via **“this”** keyword as follows: `this.variableName`\n\n- The keyword **“super”**\
    \ represents a superclass (parent) of a subclass (child) and can be used in the\
    \ constructor of a subclass to invoke the superclass constructors - **super(parameters)**;\
    \ to access the superclass instance variables - **super.variable**; and to call\
    \ the superclass methods **super.method()**.\n\n- A superclass and its subclass\
    \ can declare instance variables with the same names. The **object casting** mechanism\
    \ should be used if we want to access non-unique instance variables of a superclass\
    \ from a subclass:\n\n```\n((superclass) subclassObject).x\n// points to variable\
    \ x of superclass\n```\n\nA superclass and its subclasses can declare instant\
    \ methods with same signatures (names and parameter list). The method overriding\
    \ mechanism makes sure that proper method is instantiated when an object is created.\n\
    \nThe instanceof operator checks if an object belongs to specified class.\n\n\
    ## Type Wrappers\n\nThe usage of primitive data types has its limitations. Many\
    \ of the data structures operate on objects. For example, you cannot construct\
    \ a set of integers (a set is a collection of objects with distinct values which\
    \ will be discussed later in the book). That's why Java provides type wrappers\
    \ – classes that encapsulate a primitive type within an object. There is one wrapper\
    \ for each primitive type:\n\nDouble, Float, Long, Integer, Short, Byte, Character,\
    \ and Boolean.\n\nEach of the above classes offers a wide range of methods (most\
    \ of them static) allowing various manipulations over the underlying primitive\
    \ type including the conversions between different primitive types.\n\nExample:\n\
    \n```\nInteger N = Integer.valueOf(10); // N is an Integer object\nint n = N.intValue();\n\
    double d = N.doubleBinaryString(n);\nString s = Integer.toString(n);\nSystem.out.println(\"\
    n=\" + n + \" d=\" + d + \" s=\" + s);\n```\n\nThe output of this program is \"\
    n=10 d=10.0 s=1010\".\n\n## Autoboxing\n\nIn JDK5, Java introduced the autoboxing/auto-unboxing\
    \ feature. Autoboxing automatically creates a type wrapper object and encapsulates\
    \ a primitive type into it when an object of that type is needed. Auto-unboxing\
    \ is the reverse process; it retrieves a primitive type from a wrapper object.\n\
    \nExample:\n\n```\nclass testwrapper {\n    public static double test(Integer\
    \ N) {return N;}\n    public static void main(String args[]) {\n    int n = 123;\n\
    \    double d = test(n);\n    System.out.println(\"d=\" + d); // prints: d=123.0\n\
    }\n```\n\n## Strings\n\nIn Java, a sequence of characters is represented by the\
    \ class String. The String class is a regular class, and can be handled as such.\
    \ However, due to its extensive usage, Java added some convenient features that\
    \ make handling of strings more intuitive. In this chapter, we will review all\
    \ the special features of the String class.\n\n### String Literals, Creating Strings\n\
    \nThe string literal is a sequence of characters enclosed within double quotes:\
    \ \"First line of a string literal.\\n second line.\"\n\nString literals can be\
    \ used to create String objects directly:\n\n| Statement | Description |\n| ---\
    \ | --- |\n| String s1 = new String(); | Creates an empty String object |\n| s1\
    \ = \"text\"; | Assigns value to the String object s1 |\n| String s2 = new String(\"\
    text\"); | Creates a String object and initializes it |\n| String s3 = \"text\"\
    ; | Creates a String object and initializes it with a literal |\n\nAs you can\
    \ see in this example, a String object can be created without using the new operator\
    \ – just by direct assignment of a string literal to a String variable. This might\
    \ look strange at first, but there is a simple explanation:\n\n> Stand-alone string\
    \ literal in Java is an object of class String.\n\nEach unique string literal\
    \ Java creates one object that can be referenced by different object variables.\
    \ The new operator, on the other hand, always creates a new object regardless\
    \ of the literal value passed to the constructor:\n\n```\nString s1 = new String(\"\
    text\"); -> String object \"text\"\nString s2 = new String(\"text\"); -> String\
    \ object \"text\"\nString s3 = \"text\"; -> String object \"text\"\nString s4\
    \ = \"text\";\n```\n"
  mdcn: "\n\n此表总结了父类和子类实例变量的可访问性：\n\n| 对象引用 | class Parent 实例变量 | class Child extends\
    \ Parent 实例变量 |\n| --- | --- | --- | --- | --- |\n| | 特有 | 与 Child 中相同 | 特有 |\
    \ 与 Parent 中相同 |\n| | Parent p1 = new Parent() | | | |\n| p1. | 可以访问 | 可以访问 |\
    \ - | - |\n| | Parent p2 = new Child() | | | |\n| p2. ((Child) p2). | 可以访问 | 可以访问\
    \ | 可以访问 | 可以访问 |\n| | Child c = new Child() | | | |\n| c. | 可以访问 | | 可以访问 | 可以访问\
    \ |\n| ((Parent) c). | 可以访问 | 可以访问 | - | - |\n| super. | 可以访问 | 可以访问 | - | - |\n\
    \n## 方法重写 (Method Overriding)\n\n方法覆盖是一种特殊的机制，允许在父类及其任何子类中声明具有相同签名（名称和参数类型）的实例方法。\n\
    \n此表展示了访问父类和子类实例方法的不同方式。请注意，对象类型转换并不能让你从子类访问父类的被重写方法。一旦创建了子类对象，每个重写方法只有子类实例是可的。\n\
    \n| 对象引用 | class Parent | class Child extends Parent |\n| --- | --- | --- |\n\
    | | 实例方法（特有 | 重写） | 实例方法（特有 | 重写） |\n| p1. | 可以访问 | 可以访问 | - | - |\n| Parent p2\
    \ = new Child() | | | | |\n| p2. ((Child) p2). | 可以访问 | 可以访问 | 可以访问 | 可以访问 |\n\
    | Child c = new Child() | 可以访问 | - | 可以访问 | 可以访问 |\n| c. super. | 可以访问 | 可以访问\
    \ | - | - |\n| (Parent) c). | 可以访问 | - | - | 可以访问 |\n\n## 确定对象的类型\n\n在处理对象时，有时可能不清楚对象属于哪个类。例如，如果类\
    \ A 被类 B 和 C 继承，类型为 A 的对象引用可以引用 A、B 和 C 类的对象：\n\n```\nA obj;\nobj = new A(); //\
    \ obj 是指向类 A 对象的引用\nobj = new B(); // obj 是指向类 B 对象的引用\nobj = new C(); // obj\
    \ 现在引用类 C 的对象\n```\n\n类型为 Object 的对象引用可以引用任何类、任何对象：\n\n```\nObject obj;\nobj =\
    \ new String(\"text\");\nobj = new Integer(123);\nobj = new MyClass();\n```\n\n\
    那么，我们如何确定变量所引用对象的真实类型呢？\n答案是——借助 `instanceof` 运算符。\n\n`instanceof` 运算符格式为：\n\n\
    ```\nobjectReference instanceof classType\n```\n\n示例：\n\n```\nObject obj;\nobj\
    \ = new String(\"text\");\nobj = new Date();\n\nif (obj instanceof String) {\n\
    \    System.out.println(\"Object of type String\");\n}\n\nif (obj instanceof Date)\
    \ {\n    System.out.println(\"Object of type Date\");\n}\n```\n\n## 总结\n\n以下是我们目前为止关于对象的学习内容总结：\n\
    \n- 使用 **new** 语句实例化（即创建）对象，其格式为：`className variable = new className();`\n\n-\
    \ **构造函数 (constructor)** 是一个[名称与类名相同]的特殊方法，当创建该类的对象时，JVM 会自动调用它。\n\n- 构造函数的格式为：**className(parameters)\
    \ {body}**\n  **parameters** 和 **body** 是可选的，返回类型被省略。\n\n- 构造函数在处理完所有实例声明并执行实例块（如果存在）后被调用。\n\
    \n- 一个类可以有多个具有不同**签名**（即具有不同参数类型序列）的构造函数。\n\n- 当没有显式声明构造函数时，Java 会自动创建一个空构造函数（\
    \ **className()** ）。\n\n- 如果存在一个显式声明的构造函数，JVM 将不会创建默认构造函数（ **className()** ）。\n\
    \n- 构造函数可以通过在构造函数体的第一条语句中执行 `this(parameters);` 来调用同类的另一个构造函数。\n\n- 在构造函数中，可以通过\
    \ **“this”** 关键字引用实例变量，如下：`this.variableName`\n\n- 关键字 **“super”** 代表子类（子）的父类（父），可以在子类的构造函数中使用它来调用父类构造函数\
    \ - **super(parameters)**；访问父类实例变量 - **super.variable**；以及调用父类方法 **super.method()**。\n\
    \n- 父类及其子类可以声明同名的实例变量。如果我们想从子类访问父类的非特有实例变量，应该使用**对象类型转换**机制：\n\n```\n((superclass)\
    \ subclassObject).x\n// 指向父类的变量 x\n```\n\n父类及其子类可以声明具有相同签名（名称和参数列表）的实例方法。方法重写机制确保了在创建对象时实例化了正确的方法。\n\
    \n`instanceof` 运算符检查对象是否属于指定的类。\n\n## 包装类 (Type Wrappers)\n\n基本类型数据类型的使用有其局限性。许多数据结构是针对对象操作的。例如，你无法构建一个整数集（集合是具有不同值的对象的集合，这将在书中后后讨论）。这就是为什么\
    \ Java 提供了类型包装类——将原始类型封装在对象中的类。每个原始类型都有对应的一个包装类：\n\nDouble, Float, Long, Integer,\
    \ Short, Byte, Character, 和 Boolean。\n\n上述每个类都提供了系列的方法（大部分是静态的），允许对底层原始类型进行各种操作，包括不同原始类型之间的转换。\n\
    \n示例：\n\n```\nInteger N = Integer.valueOf(10); // N 是一个 Integer 对象\nint n = N.intValue();\n\
    double d = N.doubleBinaryString(n);\nString s = Integer.toString(n);\nSystem.out.println(\"\
    n=\" + n + \" d=\" + d + \" s=\" + s);\n```\n\n该程序的输出为 \"n=10 d=10.0 s=1010\"\
    。\n\n## 自动装箱 (Autoboxing)\n\n在 JDK5 中，Java 引入了自动装箱/自动拆箱功能。当需要该类型的对象时，自动装箱会自动创建一个类型包装对象并将原始类型封装其中。自动拆箱是相反的过程；它从包装对象中获取原始类型。\n\
