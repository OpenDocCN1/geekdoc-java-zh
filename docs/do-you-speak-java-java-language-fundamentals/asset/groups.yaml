    \ in this example is a static variable of EventType<MouseEvent> defined in the\
    \ MouseEvent class, representing the “mouse clicked” type. Its definition is:\n\
    \n```\npublic static final EventType<MouseEvent> MOUSE_CLICKED\n```\n\nThe registration\
    \ of event filters is similar to the registration of event handlers with the exception\
    \ that there are no convenience methods provided."
  - '[PAGE 178]


    With the next example we will conclude this brief overview of the JavaFX API features.
    The example illustrates everything we have learned so far about the JavaFX event
    handling mechanism. When executed on a Windows system, it will display the following
    window:


    ![](img/5cf5236b394075810b8edd6af6a34316_178_0.png)


    After you click anywhere within the black rectangle, the following messages will
    be printed on the console:


    +   Capturing phase: Stage clicked

    Capturing phase: Scene clicked

    Capturing phase: Group clicked

    Capturing phase: Rectangle clicked


    +   Bubbling phase: Rectangle clicked

    Bubbling phase: Group clicked

    Bubbling phase: scene clicked

    Bubbling phase: stage clicked


    To stop the JavaFX application, close the displayed window.'
  - "[PAGE 179]\n\n# The JavaFX event handling example:\n\n```\nimport javafx.application.*;\n\
    import javafx.stage.*;\nimport javafx.scene.*;\nimport javafx.scene.shape.*;\n\
    import javafx.event.*;\nimport javafx.scene.input.MouseEvent;\n```\n\n```\npublic\
    \ class testJavaFX_events extends Application {\n    public void start(Stage stage)\
    \ {\n```\n\n```\n        stage.addFilter(MouseEvent.MOUSE_CLICKED,\n         \
    \   System.out.println(\"Capturing phase: Stage clicked\"));\n```\n\n```\n   \
    \     stage.addEventHandler(MouseEvent.MOUSE_CLICKED,\n            System.out.println(\"\
    Bubbling phase: Stage clicked\"));\n```\n\n```\n        Rectangle rect = new Rectangle(80,\
    \ 30, 40, 40);\n```\n\n```\n        rect.addFilter(MouseEvent.MOUSE_CLICKED,\n\
    \            System.out.println(\"Capturing phase: Rectangle clicked\"));\n```\n\
    \n```\n        rect.setMouseClicked(\n            System.out.println(\"Bubbling\
    \ phase: Rectangle clicked\"));\n```\n\n```\n        Group rootNode = new Group();\n\
    ```\n\n```\n        rootNode.addFilter(MouseEvent.MOUSE_CLICKED,\n           \
    \ System.out.println(\"Capturing phase: Group clicked\"));\n```\n\n```\n     \
    \   rootNode.setMouseClicked(\n            System.out.println(\"Bubbling phase:\
    \ Group clicked\"));\n```\n\n```\n        rootNode.getChildren().add(rect);\n\
    ```\n\n```\n        Scene scene = new Scene(rootNode, 200, 100);\n```\n\n```\n\
    \        scene.addFilter(MouseEvent.MOUSE_CLICKED,\n            System.out.println(\"\
    Capturing phase: Scene clicked\"));\n```\n\n```\n        scene.setMouseClicked(new\
    \ EventHandler<MouseEvent>() {\n            public void handle(MouseEvent e) {\n\
    \                System.out.println(\"Bubbling phase: Scene clicked\"); } \n \
    \           }\n        });\n```\n\n```\n        stage.setTitle(\"JavaFX Events\"\
    );\n        stage.setScene(scene);\n        stage.show();\n```\n\n```\n}\n}\n\
    ```"
