    Alice\", 30);\n        String filename = \"user.ser\";\n\n        // 序列化对象\n \
    \       try (ObjectOutputStream out = new ObjectOutputStream(new FileOutputStream(filename)))\
    \ {\n            out.writeObject(user);\n            System.out.println(\"Object\
    \ has been serialized to \" + filename);\n        } catch (IOException e) {\n\
    \            e.printStackTrace();\n        }\n\n        // 反序列化对象\n        try\
    \ (ObjectInputStream in = new ObjectInputStream(new FileInputStream(filename)))\
    \ {\n            User deserializedUser = (User) in.readObject();\n           \
    \ System.out.println(\"Deserialized object: \" + deserializedUser);\n        }\
    \ catch (IOException | ClassNotFoundException e) {\n            e.printStackTrace();\n\
    \        }\n    }\n}\n```\n\n反序列化对象时，`transient` 字段将被初始化为它们的默认值（例如 int 为 0，对象为\
    \ null）。\n\n为了对序列化过程有更多控制，你可以在序列化类中实现 `writeObject` 和 `readObject` 方法。\n\n```java\n\
    private void writeObject(ObjectOutputStream out) throws IOException {\n    out.defaultWriteObject();\
    \ // 序列化非静态非 transient 字段\n    // 自定义序列化逻辑\n}\n\nprivate void readObject(ObjectInputStream\
    \ in) throws IOException, ClassNotFoundException {\n    in.defaultReadObject();\
    \ // 反序列化非静态非 transient 字段\n    // 自定义反序列化逻辑\n}\n```\n\n"
