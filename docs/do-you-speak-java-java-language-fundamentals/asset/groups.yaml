    \   try {\n                while (count < s.length) {\n                    System.out.println(name\
    \ + \" : \" + s[count++]);\n                    lock.notify();\n             \
    \       lock.wait();\n                }\n            } catch (Exception e) { System.out.println(e);\
    \ }\n        }\n    }\n}\n```\n\n注意，`wait()`, `notify()` 和 `notifyAll()` 方法必须由当前线程所锁定的对象来调用。否则，将抛出\
    \ `IllegalMonitorStateException`。\n\n上述程序的输出如下：\n\n- thread1: one\n- thread2:\
    \ two\n- thread1: three\n- thread2: four\n\n## 集合框架\n\n集合框架（Collections Framework）是一组接口和类，为管理对象组提供了标准方法。整个概念的核心是集合（collection），它是通过某种方式分组的对象的通用术语。根据集合构建和访问的方式，所有集合可以分为三大类：\n\
    \n- LIST - 对象序列；例如：数组、排序列表、队列、栈。\n- SET - 唯一对象组；不允许重复。\n- MAP - 键/值对对象组。\n\n每个组都可以可以进一步细分。例如，列表可以是排序的、链接的、组织成栈等的。然而，无论集合之间的差异如何，对它们进行的大部分操作都以相似的方式通过标准接口完成。本章提供了这些操作的概述。\n\
