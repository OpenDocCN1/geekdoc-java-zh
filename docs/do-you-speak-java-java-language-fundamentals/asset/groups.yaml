    \ to declare functional interface references. A lambda expression itself can be\
    \ viewed (and used) as an object of the corresponding functional interface. For\
    \ example, we can pass a lambda expression as a parameter to a method if that\
    \ parameter is declared as a functional interface.\n\nHere is an example; the\
    \ IntPredicate is a factory-supplied functional interface declaring the following\
