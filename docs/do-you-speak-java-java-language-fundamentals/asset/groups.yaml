    @Target(ElementType.TYPE_USE)\n```\n\nExample:\n\n```java\n// Author can only\
    \ be used to annotate constructors and methods\n\n@Target ( ElementType.CONSTRUCTOR,\
    \ ElementType.METHOD )\n\n@interface Author {\n  String name()\n}\n\n@Author (\
    \ name = \"Joe\" )\nclass myClass{...}\n\n@Author ( name = \"Bob\" )\nmyClass\
    \ () {...}\n\n@Author ( name = \"Mike\" )\npublic void myMethod () {...}\n```\n\
    \n![](img/5cf5236b394075810b8edd6af6a34316_169_0.png)\n![](img/5cf5236b394075810b8edd6af6a34316_169_1.png)\n\
    ![](img/5cf5236b394075810b8edd6af6a34316_169_2.png)\n\n## JavaFX API\n\nJavaFX\
    \ is a set of graphics and media packages that enables developers to create rich\
    \ client applications with high-performance modern graphical user interfaces featuring\
    \ audio, video, graphics, and animation.\n\nEach JavaFX application consists of\
    \ two major parts: **application** and **stage**. The **application** (represented\
    \ by the Application class) is responsible for building the **stage** and its\
    \ elements, and for defining the processing logic. The **stage** (represented\
    \ by the Stage class and other classes) is a hierarchical collection of objects\
    \ defining the visual appearance of the **application**.\n\nThis diagram presents\
    \ the structure of JavaFX applications:\n\n![](img/5cf5236b394075810b8edd6af6a34316_170_0.png)\n\
    \nThe Stage defines the environment for the JavaFX application. A default Stage\
    \ instance is provided by the Java run-time environment. However, you can create\
    \ multiple Stage instances (objects).\n\nThe Scene is a container (window) that\
    \ holds the contents (i.e. elements) of the **stage**. The contents of a **Scene**\
    \ create what is referred to as a **scene graph**.\n\nThe **Root Node** determines\
    \ the layout of the elements of the **Scene**.\n\nThe **Node** represents an element\
    \ of the **Scene**. It could be a button, a text box, a geometrical shape, an\
    \ animation, etc.\n\nThe **Application** class launches the JavaFX applications.\
    \ The **launch()** method executes the **init()** method, then **start()**, and\
    \ after the **Stage** is finished (e.g. the window is closed) – the **stop()**\
    \ method.\n\nThe following JavaFX example to create a window displaying a circle\
    \ and a rectangle:\n\n![](img/5cf5236b394075810b8edd6af6a34316_171_0.png)\n\n\
    ```java\nimport javafx.application.*;\nimport javafx.stage.*;\nimport javafx.scene.*;\n\
    import javafx.scene.shape.*;\npublic class testJavaFX extends Application {\n\
    \    Circle circle;\n    Rectangle rectan;\n    public static void main(String[]\
    \ args) {\n        System.out.println(\"JavaFX: launch\");\n        launch(new\
    \ String[1]);\n    }\n```\n\n| Description | Code |\n| :--- | :--- |\n| Creates\
    \ an instance of class testJavaFX and executes the init(), start(), and stop()\
    \ methods. The String [String] parameter must be provided but can be empty. |\
    \ ```java\\npublic void init() {\\n    System.out.println(\"JavaFX: init\");\\\
    n    System.out.println(Thread.currentThread().getName());\\n}\\``` |\n| The init()\
    \ method is optional; all declarations can be made in start(Stage) | ```java\\\
    ncircle = new Circle(100, 40, 30);\\nrectan = new Rectangle(80, 80, 40, 40);\\\
    n``` |\n| We can create the nodes in the init(Stage) method. | ```java\\npublic\
    \ void start(Stage stage) {\\n    System.out.println(\"JavaFX: start\");\\n  \
    \  System.out.println(Thread.currentThread().getName());\\n}\\``` |\n| Declare\
    \ a group of nodes | ```java\\nGroup rootNode = new Group();\\n``` |\n| Add two\
    \ nodes to the group | ```java\\nrootNode.getChildren().add(circle);\\nrootNode.getChildren().add(rectan);\\\
    n``` |\n| Place the nodes into a 200x200 pixel window | ```java\\nScene scene\
    \ = new Scene(rootNode, 200, 200);\\n``` |\n| Build the stage and start the execution\
    \ of the JavaFX application | ```java\\nstage.setTitle(\"My JavaFX Application\"\
    );\\nstage.setScene(scene);\\n``` |\n| Place the scene on the stage | ```java\\\
    nstage.show();\\n``` |\n| Open the window. Start executing JavaFX application.\
    \ | ```java\\npublic void stop() {\\n    System.out.println(\"JavaFX: stop\");\\\
    n    System.out.println(Thread.currentThread().getName());\\n}\\``` |\n| The stop()\
    \ method is optional: | JavaFX: stop<br>JavaFX: [Thread name] |\n"
