  - "[PAGE 101]\n\n# Interfaces\n\nAn interface is a collection of constants, abstract\
    \ methods, and default methods. The main purpose of interfaces is to supply useful\
    \ constants and methods to classes, and also to expand the polymorphism mechanism\
    \ beyond the class hierarchies.\n\nAn interface can extend one or more other interfaces.\
    \ Interfaces cannot be instantiated (you cannot create an object of an interface),\
    \ but they can be implemented by a class. The class implementing an interface\
    \ must override all abstract methods of the interface, otherwise the class will\
    \ be abstract.\n\nThe example below demonstrates the common technique of working\
    \ with interfaces.\n\nFirst, we declare two interfaces: Conversion1 and Conversion2.\
    \ The Conversion2 interface extends Conversion1 and adds one constant and one\
    \ method.\n\n```\ninterface Conversion1 {\n    double F2C = 5.0 / 9.0;\n    double\
    \ toCelsius(double t);\n}\n```\n\n```\ninterface Conversion2 extends Conversion1\
    \ {\n    double C2F = 9.0 / 5.0;\n    double toFahrenheit(double t);\n}\n```\n\
    \nNext, we declare two classes implementing the Conversion2 interface. Both classes\
    \ will have access to the constants declared in Conversion1 and Conversion2 interfaces,\
    \ and they must also implement all methods declared in those interfaces.\n\n```\n\
    // Approximate temperature conversions\nclass myClass1 implement Conversion2 {\n\
    \    public double toFahrenheit(double t) {return t * 2 + 32};\n    public double\
    \ toCelsius(double t) {return (t - 32) / 2;}\n}\n```"
  - "[PAGE 102]\n\n```\n// Precise temperature conversions\nclass myClass2 implements\
    \ Conversion2 {\n    public double toFahrenheit(double t) {return t * C2F + 32;}\n\
    \    public double toCelsius(double t) {return (t - 32) * F2C;}\n}\n```\n\nFinally,\
    \ we create two objects of classes myClass1 and myClass2 and execute their instance\
    \ methods toFahrenheit() and toCelsius().\n\n```\npublic static void main(String\
    \ args[]) {\n    conversion2 obj;\n\n    obj = new myClass1();\n    System.out.println(obj.toFahrenheit(25));\
    \ // prints: 82.0\n    System.out.println(obj.toCelsius(77)); // prints: 22.5\n\
    \n    obj = new myClass2();\n    System.out.println(obj.toFahrenheit(25)); //\
    \ prints: 77.0\n    System.out.println(obj.toCelsius(77)); // prints: 25.0\n}\n\
    ```\n\nNote that same variable \"obj\" of type Conversion2 can be used to reference\
    \ objects of classes myClass1 and myClass2. This technique employs the polymorphism\
    \ mechanism and instructs Java to find correct instance methods dynamically, at\
    \ run time, based on the actual type of the object referenced by \"obj\"."
- md: "\n## Interfaces vs. Abstract Classes\n\nYou might have noticed already that\
    \ an interface and an abstract class are similar. Both can declare constants and\
    \ provide method templates for further implementation by other classes. So the\
    \ question is – what can we do with interfaces that cannot be done with classes?\n\
    \nLet's take a look at an example:\n\n```\nabstract class Fruit\n  getVolume()\n\
    \nclass Orange extends Fruit\n  getVolume() {...}\n\nabstract class Package\n\
    \  getVolume()\n\nclass Box extends Package\n  getVolume() {...}\n```\n\nThe getVolume()\
    \ method of the Orange and Box objects can be accessed as follows:\n\n```\nOrange\
    \ orange = new Orange(); orange.getVolume();\nFruit fruit = new Orange(); fruit.getVolume();\n\
    ```\n\n```\nBox box = new Box(); box.getVolume();\nPackage pack = new Box(); pack.getVolume();\n\
    ```\n\nSince the Orange and Box classes belong to different hierarchies, its not\
    \ possible to create an object reference that can be used for referencing both\
    \ objects.\n\nInterfaces allow us to do that because the class hierarchy and the\
    \ interface hierarchy are unrelated. Interfaces break the class hierarchy boundaries.\
    \ Otherwise unrelated classes can implement the same interface, and a variable\
    \ of that interface type can reference the objects of classes.\n\n```\nclass Shape\n\
    \  getVolume()\n\nclass Orange implements Shape\n  getVolume() {...}\n\nclass\
    \ Box implements Shape\n  getVolume() {...}\n```\n\nExample: using a single interface\
    \ variable to reference class objects in different class hierarchies.\n\n```\n\
    interface Shape {\n  double getVolume();\n}\n\nclass Orange implements Shape {\n\
    \  double getVolume() { implementation code };\n}\nclass Box implements Shape\
    \ {\n  double getVolume() { implementation code };\n}\n..\n```\n\nShape shape;\n\
    \nshape = new Orange();\nshape.getVolume();\n\n![](img/5cf5236b394075810b8edd6af6a34316_104_0.png)\n\
    ![](img/5cf5236b394075810b8edd6af6a34316_104_1.png)\n\nshape = new Box();\nshape.getVolume();\n\
    \n![](img/5cf5236b394075810b8edd6af6a34316_104_2.png)\n\nNote: the polymorphism\
    \ mechanism is employed to find and execute the getVolume() method of the actual\
    \ object referenced by the shape variable.\n\n## Default and Static Methods in\
    \ Interfaces\n\nSometimes it might be beneficial to have interfaces with fully\
    \ implemented methods (i.e. methods with a body). This can be accomplished in\
    \ two ways: by declaring default methods or static methods.\n\nA default method\
    \ is an instance method that has a body and is prefixed with the default modifier.\
    \ Default methods can be, but are not required to be, overridden in the classes\
    \ implementing the interface.\n\n```\ninterface Shape {\n  default double getVolume()\
    \ {return 1.0;}\n}\n```\n\nA static method is a class-level method that has a\
    \ body and is prefixed with the static modifier. Static methods can be, but are\
    \ not required to be overridden in classes implementing the interface.\n\n```\n\
    interface Shape {\n  static String getShapeName(Object obj) {\n    return obj.getClass().getName();\n\
    \  }\n}\n```\n\nExample:\n\n```\nclass Orange implements Shape {\n  public static\
    \ void main(String args[]) {\n    double volume;\n    String name;\n\n    Shape\
    \ obj = new Orange();\n    name = Shape.getShapeName(obj);\n    volume = obj.getVolume();\n\
    \n    System.out.println(\"Shape=\"+ name); // prints: \"Shape=Orange\"\n    System.out.println(\"\
    Volume=\"+ volume); // prints: \"Volume=0\"\n  }\n}\n```\n\n## Exceptions\n\n\
    An **exception** is an interruption of normal program flow due to an error. Some\
    \ errors are fatal and cannot be recovered from, while others are not critical\
    \ and can be handled by the application (e.g. file not found situation). Java\
    \ recognizes two types of exceptions: **checked exceptions** and **unchecked exceptions**.\n\
    \n**Unchecked exceptions** are not anticipated. For example, a JVM failure or\
    \ division by zero are not expected situations. Usually these errors are due to\
    \ issues with the Java runtime environment or bugs in the application code. The\
    \ way to deal with unchecked exceptions is to fix the environment issues (if any)\
    \ or get rid of bugs in the application (debugging).\n\nUnchecked exceptions are\
    \ not anticipated and not required to be processed by the application.\n\n**Checked\
    \ exceptions** are explicitly declared in some Java classes or user-defined classes\
    \ and could **throw** them. For example, `FileReader` will throw `FileNotFoundException`\
    \ if the file you're trying to open cannot be found.\n\nChecked exceptions are\
    \ explicitly declared in some Java classes or user-defined classes and could **throw**\
    \ them. For example, `FileReader` will throw `FileNotFoundException` if the file\
    \ you're trying to open cannot be found.\n\n## Handling Exceptions\n\nTo handle\
    \ unchecked exceptions in your application, you can use the following constructs:\n\
    \n```\ntry {\n    code you want to monitor for possible exceptions\n} catch (exceptionType1\
    \ e) {\n    code processing the exception of type1\n}\n...\ncatch (exceptionTypeN\
    \ e) {\n    code processing the exception of typeN\n} finally {\n    code to be\
    \ executed regardless of results of try or catch blocks\n}\n```\n\nExample of\
    \ handling unchecked (not anticipated) exceptions:\n\n```\nint n = 0;\ntry {\n\
    \    n = 5 / n;\n} catch (ArithmeticException e) {\n    System.out.println(\"\
    Exception caught!\");\n} finally {\n    System.out.println(\"n=\" + n);\n}\n```\n\
    \n![](img/5cf5236b394075810b8edd6af6a34316_108_0.png)\n![](img/5cf5236b394075810b8edd6af6a34316_108_1.png)\n\
    ![](img/5cf5236b394075810b8edd6af6a34316_108_2.png)\n\nNote that once an exception\
    \ is caught, the propagation process stops and normal program execution resumes.\
    \ It is possible, however, to pass an exception to the calling method even after\
    \ the exception was caught and processed. This is done using the throw statement:\n\
    \n```\n// Explicit propagation of unchecked exceptions\n\npublic static void main(String\
    \ args[]) {\n    try {\n        myMethod();\n    } catch (ArithmeticException\
    \ e) {\n        System.out.println(\"Exception in main!\");\n    }\n}\n\npublic\
    \ static void myMethod () {\n    int n = 0;\n    try {\n        n = 5 / n;\n \
    \   } catch (ArithmeticException e) {\n        System.out.println(\"Exception\
    \ in myMethod!\");\n        throw e;\n    }\n}\n```\n"
  mdcn: "\n\n## 接口 vs 抽象类\n\n你可能已经注意到接口和抽象类是相似的。它们都可以声明常量，并提供方法模板供其他类进一步实现。那么问题是——哪些事情是用接口可以而类做不到的呢？\n\
    \n让我们来看一个例子：\n\n```\nabstract class Fruit\n  getVolume()\n\nclass Orange extends\
    \ Fruit\n  getVolume() {...}\n\nabstract class Package\n  getVolume()\n\nclass\
    \ Box extends Package\n  getVolume() {...}\n```\n\n可以通过以下方式访问 Orange 和 Box 对象的\
    \ `getVolume()` 方法：\n\n```\nOrange orange = new Orange(); orange.getVolume();\n\
    Fruit fruit = new Orange(); fruit.getVolume();\n```\n\n```\nBox box = new Box();\
    \ box.getVolume();\nPackage pack = new Box(); pack.getVolume();\n```\n\n由于 Orange\
    \ 和 Box 类属于不同的层次级，无法创建一个可以同时引用这两个对象的引用。\n\n接口允许我们这样做，因为类层次级和接口层次级是无关的。接口打破了类层次级的边界。互不相关的类可以实现同一个接口，该接口类型的变量可以引用这些类的对象。\n\
    \n```\nclass Shape\n  getVolume()\n\nclass Orange implements Shape\n  getVolume()\
    \ {...}\n\nclass Box implements Shape\n  getVolume() {...}\n```\n\n示例：使用单个接口变量引用不同类层次级中的类对象。\n\
    \n```\ninterface Shape {\n  double getVolume();\n}\n\nclass Orange implements\
    \ Shape {\n  double getVolume() { implementation code };\n}\nclass Box implements\
    \ Shape {\n  double getVolume() { implementation code };\n}\n..\n```\n\nShape\
    \ shape;\n\nshape = new Orange();\nshape.getVolume();\n\n![](img/5cf5236b394075810b8edd6af6a34316_104_0.png)\n\
    ![](img/5cf5236b394075810b8edd6af6a34316_104_1.png)\n\nshape = new Box();\nshape.getVolume();\n\
    \n![](img/5cf5236b394075810b8edd6af6a34316_104_2.png)\n\n注意：采用了多态机制来查找并执行 `shape`\
    \ 变量引用的实际对象的 `getVolume()` 方法。\n\n## 接口中的默认方法和静态方法\n\n有时，具有完整实现方法（即带有方法体的方法）的接口是有益。这可以通过两种实现：声明默认方法或静态方法。\n\
    \n默认方法是具有方法体并以 `default` 修饰符开头的实例方法。默认方法可以在实现接口的类中重写，但不是强制的。\n\n```\ninterface\
    \ Shape {\n  default double getVolume() {return 1.0;}\n}\n```\n\n静态方法是具有方法体并以\
    \ `static` 修饰符开头的类级方法。静态方法可以在实现接口的类中被重写，但不是强制的。\n\n```\ninterface Shape {\n  static\
    \ String getShapeName(Object obj) {\n    return obj.getClass().getName();\n  }\n\
    }\n```\n\n示例：\n\n```\nclass Orange implements Shape {\n  public static void main(String\
    \ args[]) {\n    double volume;\n    String name;\n\n    Shape obj = new Orange();\n\
    \    name = Shape.getShapeName(obj);\n    volume = obj.getVolume();\n\n    System.out.println(\"\
    Shape=\"+ name); // prints: \"Shape=Orange\"\n    System.out.println(\"Volume=\"\
    + volume); // prints: \"Volume=0\"\n  }\n}\n```\n\n## 异常\n\n**异常**是由于错误导致程序正常流的中断。某些错误是致命的且无法恢复，而另一些则并不关键，可以由应用程序处理（例如文件未找到）。Java\
    \ 识别两种类型的异常：**检查异常**(checked exceptions）和**未检查异常**(unchecked exceptions）。\n\n\
    **未检查异常**是不可预见的。例如，JVM 失败或除以零都不是预期的情况。通常这些错误是由 Java 运行时环境的问题或应用程序代码中的 bug 引起。处理未检查异常的方法修复环境问题（如果有）或消除应用程序中的\
    \ bug（调试）。\n\n未检查异常是不可预见的，且不需要应用程序处理。\n\n**检查异常**在某些 Java 类或用户定义类中显式声明，并可能**抛出**（throw）它们。例如，如果尝试打开的文件找不到，`FileReader`\
    \ 将抛出 `FileNotFoundException`。\n\n检查异常在某些 Java 类或用户定义类中显式声明，并可能**抛出**（throw）它们。例如，如果尝试打开的文件找不到，`FileReader`\
    \ 将抛出 `FileNotFoundException`。\n\n## 异常处理\n\n要在应用程序中处理未检查异常，可以使用以下结构：\n\n```\n\
    try {\n    你想要监控可能发生异常的代码\n} catch (exceptionType1 e) {\n    处理异常 type1 的代码\n\
    }\n...\ncatch (exceptionTypeN e) {\n    处理异常 typeN 的代码\n} finally {\n    无论 try\
    \ 或 catch 块结果如何都会执行的代码\n}\n```\n\n处理未检查（非预期）异常的示例：\n\n```\nint n = 0;\ntry {\n\
    \    n = 5 / n;\n} catch (ArithmeticException e) {\n    System.out.println(\"\
    捕获到异常!\");\n} finally {\n    System.out.println(\"n=\" + n);\n}\n```\n\n![](img/5cf5236b394075810b8edd6af6a34316_108_0.png)\n\
    ![](img/5cf5236b394075810b8edd6af6a34316_108_1.png)\n![](img/5cf5236b394075810b8edd6af6a34316_108_2.png)\n\
    \n注意，一旦异常被捕获，传播过程就会停止并恢复正常程序执行。然而，即使在异常被捕获和处理后，也可以将异常传递给调用方法。这是通过 `throw` 语句实现的：\n\
    \n```\n// 显式传播未检查异常\n\npublic static void main(String args[]) {\n    try {\n \
    \       myMethod();\n    } catch (ArithmeticException e) {\n        System.out.println(\"\
    main 中出现异常!\");\n    }\n}\n\npublic static void myMethod () {\n    int n = 0;\n\
    \    try {\n        n = 5 / n;\n    } catch (ArithmeticException e) {\n      \
    \  System.out.println(\"myMethod 中出现异常!\");\n        throw e;\n    }\n}\n```\n\
    \n"
