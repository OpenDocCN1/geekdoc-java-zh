    \ method is by using an anonymous class:\n\n```\nnode.setOnMouseClicked(\n   \
    \ new EventHandler<MouseEvent>() {\n        public void handle(MouseEvent e) {\n\
    \            ... event handling logic ...\n        }\n    }\n);\n```\n\n- Create\
    \ an object of type EventHandler<MouseEvent>\n- Implement the handle() method\
    \ of the EventHandler functional interface\n\nThe second way of using the setOnMouseClicked()\
    \ method is by using a lambda expression:\n\n```\nnode.setOnMouseClicked(\n  \
