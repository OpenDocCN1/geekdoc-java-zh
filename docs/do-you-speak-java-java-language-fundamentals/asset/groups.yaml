    \  String doit (String s);\n}\n```\n\n> The signature of method doit()\n> <String>method<String>\n\
    > All methods passing as references must have this signature.\n\n```java\nclass\
    \ myClass {\n  static void printAS (Transform obj) {\n    System.out.println(obj.doit(\"\
    Test Text\"));\n  }\n}\n```\n\n## Constructor Reference\n\nConstructor reference\
    \ is similar to method reference. Let's say, the functional interface holds two\
    \ constructors:\n\n```java\ninterface defaultConstructorRef <T> {\n  T create();\n\
    }\n```\n\nWe want to be able to build objects not only traditional way, with the\
    \ new keyword, but also by constructor reference. First, we declare a functional\
    \ interface with argument:\n\n```java\ninterface myConstructor {\n  Location create(int\
    \ x, int y);\n}\n```\n\nThen, during execution, Location :: new will be functional\
    \ interface class Location:\n\n```java\nmyConstructor mc = Location :: new;\n\
    ```\n\nThis example demonstrates the basics of creating and using constructor\
    \ references. However, having two ways of invoking the constructor seems to be\
    \ more confusing than beneficial.\n\nSo here is a more practical example - we\
    \ will be passing constructor references of two different classes (A and B) to\
