    \ the anonymous class definition can be used in various expressions:\n\n```\n\
    somevariable = (anonymous class definition).method();\nsomeMethod(anonymous class\
    \ definition);\n```\n\nConsider a situation when we have Circle calculating the\
    \ area of a circle with this formula: **area = 3.14 * radius * radius**. We want\
    \ to keep the existing class Circle, but increase the precision of this calculation\
    \ by using a new formula: **area = 3.1415926 * radius * radius**.\n\nHere is how\
    \ we can accomplish this with an anonymous class:\n\n```\nclass circle {\n   \
    \ public double getArea(double r) {return 3.14 * r * r};\n}\n```\n\n```\nclass\
    \ testClass {\n    public static void main(String args[]) {\n        Circle a\
