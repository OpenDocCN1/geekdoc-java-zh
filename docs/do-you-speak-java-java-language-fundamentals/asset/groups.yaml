    # Literals


    A literal specifies an actual value of a data element. For example, 123 will be
    treated by Java as a 32-bit signed integer number (i.e. type int), and 123.4 –
    as 64-bit floating point number (type double). In fact, any whole number value
    (i.e. without the decimal point) is treated as an integer, and any fractional
    value (i.e. with the decimal point) is treated as a double precision floating
    point number.


    There are four types of literals in Java: numeric, character, boolean, and string.
    Each of them is discussed below.


    # Numeric Literals


    Numeric literals can be specified in decimal, hexadecimal, octal, or binary notations.
    Here is the number 10 in different notations:


    +   10 - decimal notation (decimal digits 0-9)

    0xA - hexadecimal notation (0x is in front of hexadecimal digits 0-F)

    012 - octal notation (0 is in front of octal digits 0-7)

    0b010 - binary notation (0b is in front of binary digits 0-1)


    Numeric literals can contain embedded underscores, which are ignored by the compiler
    but make the values easier to read. Here are examples of valid numeric literals:


    ```

    1234567890

    1_234_567_890

    123__456__7890

    123_456_789.0

    ```


    The data type of a literal is defined either implicitly (default data type assignment)
    or explicitly. Any whole number literal is defaulted to type int, and any fractional
    number literal is defaulted to type double. There can be no literals of type byte
    or short. The long and float literals can be defined explicitly by appending the
    number with ''L'', ''l'', ''F'', or ''f''. The type double can'
  - "[PAGE 22]\n\nalso be specified explicitly by appending the number with 'D' or\
    \ 'd' but this would be redundant. The table below shows some examples of how\
    \ the data type of literals is determined.\n\n| Literal | Data Type |\n|--- |---\
    \ |\n| Not available | byte |\n| Not available | short |\n| 123 | int |\n| 123L\
    \ or 123l | long |\n| 123.0 | double |\n| 123.0D or 123.0d | double |\n| 1.23E+2\
    \ | double |\n| 123.0F or 123.0f | float |\n\n# Character Literals\n\nA character\
    \ literal is represented with a value within a pair of single quotes. The digits,\
    \ letters, and special characters that are present on the keyboard, can be specified\
    \ directly, as follows: 'a', '1', '%', etc. Other symbols should be entered using\
    \ escape sequences. The escape sequence is the backslash '\\ followed by one or\
    \ more symbols. There are several predefined escape sequences that represent new\
