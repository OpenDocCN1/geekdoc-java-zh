    \ Blocks\n\nThe break statement has the following format:\n\n```\nbreak [label];\n\
    ```\n\nThe label parameter is optional and is used to jump out of any named (labeled)\
    \ block of code. That block of code does not have to be a loop or a switch statement.\
    \ Consider this example:\n\n```\nint var;\nvar = 2;\n\nblock1:\n{\n    if (var\
    \ != 1) break block1;\n    System.out.println(\"Block 1 executed\");\n}\n\nblock2:\n\
    {\n    if (var != 2) break block2;\n    System.out.println(\"Block 2 executed\"\
    );\n}\n```\n\nThe output of this code will be “Block 2 executed”. Since the variable\
    \ var is not equal to 1, break block1 will jump out of block1 to the next statement.\n\
    \nNote that this technique will also work when the named blocks are nested within\
    \ each other. The break can jump from an inner block out of any outer block:"
