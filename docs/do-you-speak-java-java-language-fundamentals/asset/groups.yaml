    \ 静态变量，代表“鼠标点击”类型。它的定义为：\n\n```\npublic static final EventType<MouseEvent> MOUSE_CLICKED\n\
    ```\n\n事件过滤器的注册与事件处理器的注册相似，不同之处在于它没有提供便利方法。\n\n通过下一个示例，我们将结束对 JavaFX API 特性的简要概述。该示例说明了我们目前为止关于\
