    # What can we do with annotations?


    Before answering this question, we need to review the lifecycle of the Java program,
    which can be broken into four stages:


    +   - Source code

    - Compilation

    - Byte code

    - Execution (run time)


    The initial question needs to be broken down for each stage: “What can we do with
    annotations in the source code, during compilation, while in byte code, and at
    the run time?”


    As we have already seen, the source code contains the annotation declarations.
    From the programmer’s standpoint, not much can be discussed here except the specifics
    of the declaration syntax, which will be covered later.


    The next stage is compilation. The compiler interprets the annotation declarations
    and creates proper Java objects, but does the compiler do else with the annotations?
    The answer is yes - there is a set of predefined (i.e. built-in) annotations,
    which serve as instructions to the compiler. They are all defined in the java.lang.annotation
    package:


    ```

    @Retention

    @Target

    @Inherited

    @Override

    @SuppressWarnings

    @Deprecated

    @Safevarargs

    @Repeatable

    @FunctionalInterface

    ```


    As all the annotations, the pre-defined annotations should precede the annotated
    declaration (or another annotation). For example, the following code will instruct
    the compiler to check if the someMethod() is indeed an override of the same method
    of the superclass. If the superclass of the current class does not declare the
    someMethod(), a compile-time error will occur.


    ```

    @Override

    public void myMethod() {...}

    ```'
  - '[PAGE 165]


    Other, not pre-defined annotations (user-defined, or declared in other Java packages),
    are controlled by the @Retention pre-defined annotation. The @Retention annotation
    can specify three values defined by the RetentionPolicy enumeration.


    ```

    @Retention (RetentionPolicy.SOURCE)

    @Retention (RetentionPolicy.CLASS) ← default

    @Retention (RetentionPolicy.RUNTIME)

    ```


    Note: @Retention can annotate only one annotation declaration.


    Here is the effect of the constants:


    +   - SOURCE– annotation stays only in the source (.java file) and is discarded
    after compilation.

    - CLASS – annotation will be stored in the bytecode (.class file) but will be
    discarded before the execution; this is the default value.

    - RUNTIME – annotation will be available at run time.


    The SOURCE-level annotations are not processed by the Java compiler (with the
    exception of the pre-defined annotations). However, as of SE 6, you can add annotation
    processors to the Java compiler, which are stand-alone, custom tools for processing
    annotations. They are out of the scope of this book.


    The CLASS-level annotations are too specialized and therefore are also beyond
    the scope of our discussion, let''s talk about run-time processing.


    # Processing Runtime Annotations


    When the @Retention(RetentionPolicy.RUNTIME) annotation is specified for another
    annotation (custom defined, or declared in one of the Java packages), it makes
    that annotation available at the run time. Since Java does not provide any special
    run-time mechanisms of handling the annotations, it''s up to us to do with them.


    As we already mentioned, annotations are objects of Java classes implementing
    the Annotation interface. What it means is that if we can obtain a reference to
    the object of some annotation, we can invoke method(s) to retrieve the declared
    values:'
