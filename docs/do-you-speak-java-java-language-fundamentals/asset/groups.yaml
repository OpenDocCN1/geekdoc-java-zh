    # Packages


    A package is a container for classes. All Java classes are spread across more
    than 200 packages. The fundamental classes reside in the java.lang package. Examples
    of other packages are java.io, java.util, java.net, java.math, etc.


    Packages are arranged in a tree-like structure:


    ![](img/5cf5236b394075810b8edd6af6a34316_74_0.png)


    The java.lang package is always available to the Java compiler. When your program
    needs to use a class residing in a different package, that class or the whole
    package containing that class must be imported into the program:


    ```

    import java.math.*;

    import java.io.FileReader;

    class myClass { ...

    ```


    User-defined classes are also placed in packages. For example, the myClass from
    the above example will be placed in a default, "no-name" package. To place it
    into a particular package, the first statement of the program (not counting comment)
    must be the package statement:


    ```

    package mypack.io;

    import java.io.FileReader;

    class myClass { ... }

    ```


    Note that classes, after compiling, retain information about the package they
    belong to. So, if you copy a class from one package into another,'
  - '[PAGE 75]


    new copy will not work. However, there is one exception. When a class is compiled
    without the package statement, it can be placed in any named package and be accessible
    by all classes in that package.


    The implementation of the package concept varies depending on the environment
    in which Java is installed (Linux, Mac, Windows, etc.) and therefore it is not
    included in the scope of this book.'
  - '[PAGE 76]


    # Modifiers


    The following entities of the Java language – classes, interfaces, variables,
    and methods – can be declared with so-called modifiers controlling their behavior
    and/or accessibility. Here, myMethod is declared with two modifiers: public and
    static.


    ```

    public static void myMethod() { ... };

    ```


    # Class Modifiers


    There is a limited set of modifiers that can be applied to classes:


    +   - public

    - abstract

    - final


    The public modifier makes the class accessible from any package. If this modifier
    is not specified, the class will be accessible from the package it was declared.


    The abstract modifier defines a class in which one or more methods are declared
    as skeletons – with the return type and the list of input parameters, but without
    the body. Abstract classes will further be explained in the “Abstract Classes”
    section.


    The final modifier prohibits the class from being extended by other classes.


    # Access Level Modifiers


    Access level modifiers control the visibility of variables and methods of a class
    from other classes in the same or different packages. There are four access level
    modifiers (in order from less to more restrictive):


    public → protected → [no modifier] → private'
  - '[PAGE 77]


    ```

    public void myMethod() { ... };

    protected int n;

    double x;

    private string name;

    ```


    The following table shows how access variables and methods of one class from its
    sub-classes and also from other classes residing in the same or different packages.


    | | Package One | | | Package Two | |

    ||---|---|---|---||

    | class A | subclass of A | class B | subclass of A | class C |

    | public | visible | visible | visible | visible |

    | protected | visible | visible | visible | - |

    | no modifier | visible | visible | - | - |

    | private | visible | - | - | - |


    # The "static" Modifier


    The static modifier indicates that the variable or method can be accessed before
    any object of the class is created. A good example is the main method that starts
    execution of an application. It must be declared static because it is called before
    any object exists.


    # The "final" Modifier


    The final modifier can be applied to variables, methods, and classes to "finalize"
    their declaration.


    A final variable cannot be modified after it is assigned an initial value. It
    effectively makes a final variable constant:


    ```

    final double pi = 3.1415926;

    ```


    A final method cannot be overridden. If a class declares some method as final,
    the sub-classes of that class cannot create a method with the same signature as
    the final method.


    A final class cannot have sub-classes, i.e. it cannot be inherited.'
- md: "\n# Generics\n\n**Generics** is a feature of Java allowing the use of generic\
    \ names when specifying the class type of object parameters in the declarations\
    \ of classes, interfaces, methods, or constructors. For example, if two methods\
    \ have same functionality but one receives an integer parameter, and another receives\
    \ a double parameter, we can declare just one method and supply that method with\
    \ a '**generic**' type of the parameter, which will be substituted with the proper\
    \ type during compilation.\n\nThe best way to understand all the advantages and\
    \ restrictions of **generics** by going through examples, which are illustrated\
    \ below.\n\n# Generic Methods\n\nLet's say that we create a method that acts on\
    \ an object without knowing what its type is. One way of accomplishing that is\
    \ by using the **Object** class – the superclass of all objects. We could accept\
    \ an Object instance and then cast it to the desired type.\n\nFor example, method\
    \ **sumArea** summarizes the total area occupied by objects of type **A** and\
    \ **B** by processing one object at a time. All we know about objects A and B\
    \ is that they are **unrelated** (i.e. belong to separate class hierarchies) and\
    \ both have the **getArea** method returning their area value. The **sumArea**\
    \ method can be implemented as:\n\n```java\nclass A { public double getArea()\
    \ { return 10.0; }\nclass B { public double getArea() { return 20.0; } }\n```\n\
    \n```java\nclass myClass {\n  double totalArea;\n  public void sumArea(Object\
    \ obj) {\n    if (obj instanceof A) { totalArea += ((A)obj).getArea(); }\n   \
    \ if (obj instanceof B) { totalArea += ((B)obj).getArea(); }\n  }\n}\n```\n\n\
    ![](img/5cf5236b394075810b8edd6af6a34316_78_0.png)\n![](img/5cf5236b394075810b8edd6af6a34316_78_1.png)\n\
    \nNow, we we use **generics** to get rid of **instanceof** and object casting?\
    \ The short answer is – Yes and No. At this point we come to a very important\
    \ fact about the **generics:**\n\nGenerics is a compiler feature, not a run-time\
    \ feature. All class type references are resolved at compile time.\n\nFor example,\
    \ the sumArea method can be re-written in generic notation as follows:\n\n```java\n\
    public <T> void sumArea(T obj) {\n    totalArea += obj.getArea();\n}\n```\n\n\
    > The T parameter is not a real class name, but a generic name. It must be placed\
    \ before the return type.\n\nIn the object-casting example, when the method sumArea\
    \ receives an object of class A, the reference obj is treated as if it was created\
    \ by the statement Object obj = new A(); by casting obj to the original class\
    \ A we acquire access to all its variables and methods.\n\nThe generics mechanism\
    \ works somewhat differently. At compile time, the type-variable T must be resolved\
    \ to a real class name. Since we did not provide any hints as to what it might\
    \ be, the T will be substituted with Object – the superclass for all classes –\
    \ and that will be the only change to the source. Without casting, reference obj\
    \ declared as \"Object obj = new A()\" will only have access to the instance variables\
    \ and methods of class Object and also to the methods of Object overridden by\
    \ class A. This diagram shows which properties of object A would be accessible\
    \ in cases:\n\n| \"Object-casting\" approach | A obj = new A() | \"Generic\" approach\
    \ |\n| :--- | :--- | :--- |\n| Parameter obj is treated as being like this: Object\
    \ obj = new A() | class Object | T is substituted with Object. Parameter obj is\
    \ treated as being like this: Object obj = new A() |\n| | variable v1 | |\n| |\
    \ method m1 | |\n| | variable v2 | |\n| | method m2 | |\n| | (A) obj). | class\
    \ A | obj. |\n| | variable v2 | |\n| | method m2 | |\n| | variable v3 | |\n| |\
    \ method m3 | | |\n\nAs we see, without explicit casting, the \"generics\" code\
    \ does not have access to the class A instances and methods of object obj. This\
    \ problem can be solved by making a few changes to the class structure and also\
    \ providing more information to the generic method.\n\nFirst, we can tell the\
    \ generic method what class (or classes) can substitute the type-variable T:\n\
    \n```java\npublic <T extends AB> void sumArea(T obj) { ... }\n```\n\nThe `<T extends\
    \ class>` is called a bounded type, which sets the upper bound for classes that\
    \ can be referenced by the type-variable T.\n\nSecond, the new class (AB) should\
    \ be made a superclass of classes A and B and should define all instance methods\
    \ we can use within the generic method sumArea:\n\n```java\nabstract class AB\
    \ { public double getActivity(); }\nclass A extends AB { public double getActivity()\
    \ {return 10.0; } }\nclass B extends AB { public double getActivity() {return\
    \ 20.0; } }\n```\n\n> Note: class AB is not required to be abstract\n\nNow our\
    \ obj will be viewed as being declared with “AB obj = new AB()”, and the getArea\
    \ method of classes A and B will be reachable via the method overriding mechanism.\
    \ Simply put, the declaration of the generic method was transformed from this:\n\
    \n```java\npublic <T> void sumArea(T obj) {\n  totalArea += obj.getArea();\n}\n\
    ```\n\nto this:\n\n```java\npublic void sumArea(AB obj) {\n  totalArea += obj.getArea();\n\
    }\n```\n\nThat if we need access to the variables of A and B we can only do through\
    \ the method overriding mechanism of the superclass.\n\n# Generic Classes\n\n\
    First of all, it is very important to understand that a generic class is not much\
    \ different from regular classes. What makes it \"generic\" is the declaration\
    \ syntax. Here is an example of a generic class:\n\n```java\nclass G<T> { }\n\
    ```\n\nThe type parameter T is a placeholder for a type that will be specified\
    \ when an object of the class is created.\n\n```java\nclass G<T> {\n  T field;\n\
    \  public G(T obj) { field = obj; }\n  public T get() { return field; }\n}\n```\n\
    \nWe can create instances of G with any type:\n\n```java\nG<String> stringList\
    \ = new G<>(\"Hello\");\nG<Integer> intList = new G<>(123);\n```\n\nWe can also\
    \ have multiple type parameters:\n\n```java\nclass G<K, V> {\n  K key;\n  V value;\n\
    }\n```\n\n# Generic Erasure\n\nOne of the main features of generics is type erasure.\
    \ This means that the compiler removes all generic type information after checking.\
    \ This is done to ensure backward compatibility with older versions of Java.\n\
    \nFor example, the following code:\n\n```java\nclass List<T> {\n  private Object[]\
    \ elements;\n  public void add(T element) { ... }\n  public T get(int i) { return\
    \ (T) elements[i]; }\n}\n```\n\nwill be compiled to:\n\n```java\nclass List {\n\
    \  private Object[] elements;\n  public void add(Object element) { ... }\n  public\
    \ Object get(int i) { return (Object) elements[i]; }\n}\n```\n\nThe compiler inserts\
    \ necessary casts to ensure that the type is correct. This prevents ClassCastException\
    \ at runtime.\n\n# Wildcards\n\nWildcards are used to represent an unknown type.\
    \ There are three types of wild:\n\n- `<?>` (unbounded wildcard): represents any\
    \ type.\n- `<? extends T>` (upper bounded wildcard): represents any type that\
    \ is a subclass of T.\n- `<? super T>` (lower bounded wildcard): represents any\
    \ type that is a superclass of T.\n\n## Unbounded Wildcards\n\nAn unbounded wildcard\
    \ is used when you don't care about the type of the object.\n\n```java\npublic\
    \ void process(List<?> list) {\n  for (Object obj : list) {\n    System.out.println(obj);\n\
    \  }\n}\n```\n\n## Upper Bounded Wildcards\n\nAn upper bounded wildcard is used\
    \ when you want to limit the type to a specific class hierarchy.\n\n```java\n\
    public void doubleList(List<? extends Number> list) {\n  for (Number n : list)\
    \ {\n    System.out.println(n.doubleValue());\n  }\n}\n```\n\n## Lower Bounded\
    \ Wildcards\n\nA lower bounded wildcard is used when you want to limit the type\
    \ to a specific class or its parents.\n\n```java\npublic void addIntegers(List<?\
    \ super Integer> list) {\n  for (int i = 0; i < 10; i++) {\n    list.add(i);\n\
    \  }\n}\n```\n"
  mdcn: "\n\n# 泛型\n\n**泛型**（Generics）是 Java 的特性，允许在声明类、接口、方法或构造函数的对象参数类类型时使用泛型名称。例如，如果两个方法的功能相同，但一个接收整数参数，另一个接收双精度类型参数，我们可以只声明一个方法，并为该方法提供参数的“**泛型**类型”，该类型将在编译期间被替换为相应的类型。\n\
    \n理解**泛型**所有优势和限制的最佳方法是通过示例，下文演示了这些。\n\n# 泛型方法\n\n假设我们创建一个方法，在不知道对象类型的情况下对对象进行操作。实现这一点的某种方法是使用\
    \ **Object** 类——它是所有对象的父类。我们可以接受一个 Object 实例，然后将其转换为所需的类型。\n\n例如，方法 **sumArea**\
    \ 通过逐个处理对象，汇总了类型为 **A** 和 **B** 的对象占用的总面积。我们对对象 A 和 B 唯一了解的是它们是**不相关**的（即属于不同的类层次结构），并且它们都具有返回面积值的\
    \ **getArea** 方法。**sumArea** 方法可以实现为：\n\n```java\nclass A { public double getArea()\
    \ { return 10.0; }\nclass B { public double getArea() { return 20.0; } }\n```\n\
    \n```java\nclass myClass {\n  double totalArea;\n  public void sumArea(Object\
    \ obj) {\n    if (obj instanceof A) { totalArea += ((A)obj).getArea(); }\n   \
    \ if (obj instanceof B) { totalArea += ((B)obj).getArea(); }\n  }\n}\n```\n\n\
    ![](img/5cf5236b394075810b8edd6af6a34316_78_0.png)\n![](img/5cf5236b394075810b8edd6af6a34316_78_1.png)\n\
    \n现在，我们能使用**泛型**来消除 **instanceof** 和对象强制转换吗？简短的答案是——是的，也不是。在这里我们遇到了一个关于**泛型**的一个非常重要的事实：\n\
    \n泛型是一个编译期特性，而不是运行时特性。所有的类类型引用都在编译时解析。\n\n例如，sumArea 方法可以用泛型符号重写如下：\n\n```java\n\
    public <T> void sumArea(T obj) {\n    totalArea += obj.getArea();\n}\n```\n\n\
    > T 参数不是一个真实的类名，而是一个泛型名称。它必须放在返回类型之前。\n\n在对象强制转换的示例中，当方法 sumArea 接收到类 A 的对象时，引用\
    \ obj 被处理就像是由语句 `Object obj = new A();` 创建的一样；通过将 obj 强制转换为原始类 A，我们获得了对其所有变量和方法的访问权限。\n\
    \n泛型机制的工作方式有些不同。在编译时，类型变量 T 必须解析为真实的类名。由于我们没有提供任何关于它可能是什么的提示，T 将被替换为 Object——所有类的父类——这将是源代码的唯一更改。在没有强制转换的情况下，声明为\
    \ \"Object obj = new A()\" 的引用 obj 将只能访问 Object 类的实例变量和方法，以及被类 A 重写的 Object 方法。此图表显示了在不同情况下对象\
    \ A 的哪些属性是可以访问的：\n\n| “对象强制转换”方法 | A obj = new A() | “泛型”方法 |\n| :--- | :--- |\
    \ :--- |\n| 参数 obj 被处理为类似于：Object obj = new A() | class Object | T 被替换为 Object。参数\
    \ obj 被处理为类似于：Object obj = new A() |\n| | variable v1 | |\n| | method m1 | |\n\
    | | variable v2 | |\n| | method m2 | |\n| | (A) obj). | class A | obj. |\n| |\
    \ variable v2 | |\n| | method m2 | |\n| | variable v3 | |\n| | method m3 | | |\n\
    \n正如我们所见，在没有显式强制转换的情况下，“泛型”代码无法对象 obj 的类 A 实例和方法。这个问题可以通过对类结构进行一些更改，并向泛型方法提供更多信息来解决。\n\
    \n首先，我们可以告诉泛型方法哪个类（或哪些类）可以替换类型变量 T：\n\n```java\npublic <T extends AB> void sumArea(T\
    \ obj) { ... }\n```\n\n`<T extends class>` 被称为边界类型，它为可以被类型变量 T 引用的类设置了上界。\n\n\
    其次，应该将新类 (AB) 变为类 A 和 B 的父类，并定义我们在泛型方法 sumArea 中可以使用的所有实例方法：\n\n```java\nabstract\
    \ class AB { public double getActivity(); }\nclass A extends AB { public double\
    \ getActivity() {return 10.0; } }\nclass B extends AB { public double getActivity()\
    \ {return 20.0; } }\n```\n\n> 注意：类 AB并不要求是抽象的\n\n现在，我们的 obj 将视为声明为“AB obj = new\
    \ AB()”，类 A 和类 B 的 getArea 方法将通过方法重写机制访问。简单来说，泛型方法的声明从此转变为：\n\n```java\npublic\
    \ <T> void sumArea(T obj) {\n  totalArea += obj.getArea();\n}\n```\n\n变为这个：\n\n\
    ```java\npublic <T> void sumArea(T obj) {\n  totalArea += obj.getArea();\n}\n\
    ```\n\n实际上，sumArea(AB obj) 访问特定类或其父类。\n\n# 泛型类\n\n首先，我们需要理解泛型类与普通类并没有太大区别。让它变成“泛型”的是语法。这里有一个泛型类的示例：\n\
    \n```java\nclass G<T> { }\n```\n\n我们可以创建任何类型的 G：\n\n```java\nG<String> stringList\
    \ = new G<>(\"Hello\");\nG<Integer> intList = new G<>(123);\n```\n\n我们还可以有多个类型参数：\n\
    \n```java\nclass G<K, V> {\n  K key;\n  V value;\n}\n```\n\n# 泛型擦除\n\n泛型的主要特性之一是类型擦除。这意味着编译器在检查后移除所有的泛型类型信息。这样做是为了与旧版本的\
    \ Java Java。\n\n例如，以下代码：\n\n```java\nclass List<T> {\n  private Object[] elements;\n\
    \  public void add(T element) { ... }\n  public T get(int i) { return (T) elements[i];\
    \ }\n}\n```\n\n会被编译为：\n\n```java\nclass List {\n  private Object[] elements;\n\
    \  public void add(Object element) { ... }\n  public Object get(int i) { return\
    \ (Object) elements[i]; }\n}\n```\n\n编译器会插入必要的强制转换以确保类型正确。这在运行时防止了 ClassCastException。\n\
    \n# 通配符\n\n通配符用于表示未知类型。有三种类型的通配：\n\n- `<?>`（无界通配符）：表示任何类型。\n- `<? extends T>`（上界通配符）：表示\
    \ T 的任何子类。\n- `<? super T>`（下界通配符）：表示 T 的任何父类。\n\n## 无界通配符\n\n无界通配符用于在你不在对象类型时。\n\
    \n```java\npublic void process(List<?> list) {\n  for (Object obj : list) {\n\
    \    System.out.println(obj);\n  }\n}\n```\n\n## 上界通配符\n\n上界通配符用于你想将类型限制在特定的类层次结构时。\n\
    \n```java\npublic void doubleList(List<? extends Number> list) {\n  for (Number\
    \ n : list) {\n    System.out.println(n.doubleValue());\n  }\n}\n```\n\n## 下界通配符\n\
    \n下界通配符用于你想将类型限制在特定类或其父类时。\n\n```java\npublic void addIntegers(List<? super Integer>\
    \ list) {\n  for (int i = 0; i < 10; i++) {\n    list.add(i);\n  }\n}\n```\n\n"
