  mdcn: "\n为了处理事件，每个对象都必须自己注册为事件处理器，并实现某种事件处理逻辑。由于事件会传递给每个对象两次——一次是在捕获（或过滤）阶段，另是在冒泡（或处理）阶段，因此对象可以设置事件过滤器、事件处理器，或者两者兼备。\n\
    \n所有节点（即 Node 类的子类）以及 Stage 和 Scene 类都定义了用于注册和实现事件过滤器与事件处理器的方法：\n\n```\n<T extends\
    \ Event> void addEventListener(EventType<T> eventType,\nEventHandler<? super T>\
    \ handler);\n```\n\n```\n<T extends Event> void addEventHandler(EventType<T> eventType,\n\
    EventHandler<? super T> handler);\n```\n\n还有一些用于为不同类型的事件注册事件处理器的“便利方法”。它们本质上是\
    \ `addEventHandler` 方法的简写。例如，此方法为“鼠标点击”事件注册了一个事件处理器：\n\n```\nvoid setMouseClicked(EventHandler<?\
    \ super MouseEvent> value);\n```\n\n让我们使用 `addEventHandler()` 和 `setMouseClicked()`\
    \ 方法来练习并创建几个事件处理器。\n\n`setMouseClicked` 方法声明了一个参数——一个泛型函数接口 `EventHandler` 的对象，其泛型类参数可以是\
    \ `MouseEvent` 或 `MouseEvent` 的任何父类（例如 `EventHandler<MouseEvent>`、`EventHandler<Event>`\
    \ 等）。\n\n`EventHandler` 泛型接口声明了以下方法：\n\n```\nvoid handle(T event);\n```\n\n接下来，我们需要创建一个类型为\
    \ `EventHandler<MouseEvent>`的对象，实现它的 `handle()` 方法，并将此对象作为参数传递给 `setMouseClicked()`\
    \ 方法。这可以通过多种方式实现，下面展示了其中三种。\n\n使用 `setOnMouseClicked()` 方法注册事件处理器的种方法是使用匿名类：\n\
    \n```\nnode.setOnMouseClicked(\n    new EventHandler<MouseEvent>() {\n       \
    \ public void handle(MouseEvent e) {\n            ... 事件处理逻辑 ...\n        }\n\
    \    }\n);\n```\n\n- 创建一个 `EventHandler<MouseEvent>` 类型的对象\n- 实现 `EventHandler`\
    \ 泛型接口的 `handle()` 方法\n\n使用 `setOnMouseClicked()` 方法的第二方法是使用 lambda 表达式：\n\n```\n\
    node.setOnMouseClicked(\n    e -> { ... 事件处理逻辑 ... }\n);\n```\n\n- 此 lambda 表达式创建了一个\
    \ `EventHandler<MouseEvent>` 类型的对象，其 `handle()` 方法按照 `(...)` 中的指定已实现\n\n使用 `setOnMouseClicked()`\
    \ 方法的第三种方法是使用方法引用：\n\n```\nclass myClass {\n    public void myClickHandler(MouseEvent\
    \ e) {\n        ... 事件处理逻辑 ...\n    }\n    public static void main(String[] args)\
    \ {\n        ...\n        node.setOnMouseClicked(\n            myClass::clickHandler\n\
    \        );\n    }\n}\n```\n\n- 此方法引用表达式创建了一个 `EventHandler<MouseEvent>` 类型的对象，其\
    \ `handle()` 方法指向 `myClickHandler()` 方法\n\n注意，`myClickHandler` 方法的签名必须与 `EventHandler`\
    \ 接口的 `handle` 方法相同，其声明如下：\n\n```\nvoid handle (T event)\n```\n\n`T` 是我们想要处理的事件类型；在我们的用中它是\
    \ `MouseEvent`。\n\n现在让我们使用 `addEventHandler()` 方法创建一个事件处理器。`addEventHandler` 的格式如下：\n\
    \n```\n<T extends Event> void addEventHandler(EventType<T> eventType, EventHandler<?super\
    \ T> eventHandler)\n```\n\n该方法与之前审查过的 `setOnMouseClicked` 的第一个区别在于，`EventHandler`\
    \ 对象可以是任何事件类型，而不仅仅是 `MouseEvent`。事实上，`EventHandler` 可以为 `Event` 类以及 `Event` 类的任何子类创建。第二个区别是——我们需要通过传递\
    \ `EventType<T>` 类型的对象来告诉方法我们将处理哪种事件类型，其中 `T` 可以指定 `Event` 类及其任何子类。\n\n使用 lambda\
    \ 表达式，我们可以如下为“鼠标点击”事件构建事件处理器：\n\n```\nnode.addEventHandler(\n  MouseEvent.MOUSE_CLICKED,\n\
