- md: "\n## Annotations\n\nAnnotations provide a standard way of documenting Java\
    \ programming code. The following characteristics make the annotations distinct\
    \ from other documenting means:\n\n- Annotations are closely associated with the\
    \ program constructs they annotate; this reduces the possibility of misrepresentation.\n\
    - Annotations can be used as instructions to the Java compiler to perform certain\
    \ actions, e.g. to suppress some warning messages.\n- Annotations are objects\
    \ that can be accessed at run time by the application program containing annotations\
    \ or by third-party tools.\n\nImportant note: annotations have no effect at run\
    \ time.\n\n## How do we create an annotation?\n\nIn a nutshell, annotations are\
    \ regular Java classes, only declared and handled differently. All annotation\
    \ classes (referred to as annotation types) are created by implementing the Annotation\
    \ interface. However, instead of using the implements keyword in the class declaration,\
    \ we specify the annotation class as @interface:\n\n```java\n@interface myAnnotation\
    \ {\n  Type method();\n  Type method() default value;\n  ....\n}\n```\n\n| Only\
    \ methods without bodies are allowed in the annotation declarations |\n\nExample:\n\
    \n```java\n@interface Author {\n  string name();\n  string version() default \"\
    1.0\";\n}\n```\n\n| A default value returned by the method can be declared. |\n\
    \nAny declaration in the program source, should precede the declaration itself,\
    \ be annotated. Annotation should precede the declaration being annotated:\n\n\
    ```java\n@Author(name=\"John Doe\", version=\"1.2\")\nclass myClass { ... }\n\
    ..\n```\n\n| class myClass is annotated with the Author information |\n\n```java\n\
    @Author(name=\"Bob\")\npublic void myMethod(int n) { ... }\n```\n\n| Method myMethod\
    \ is annotated. it's OK to skip the version because it was defined with default\
    \ return value |\n\n## What can we do with annotations?\n\nBefore answering this\
    \ question, we need to review the lifecycle of the Java program, which can be\
    \ broken into four stages:\n\n- Source code\n- Compilation\n- Byte code\n- Execution\
    \ (run time)\n\nThe initial question needs to be broken down for each stage: “What\
    \ can we do with annotations in the source code, during compilation, while in\
    \ byte code, and at the run time?”\n\nAs we have already seen, the source code\
    \ contains the annotation declarations. From the programmer’s standpoint, not\
    \ much can be discussed here except the specifics of the declaration syntax, which\
    \ will be covered later.\n\nThe next stage is compilation. The compiler interprets\
    \ the annotation declarations and creates proper Java objects, but does the compiler\
    \ do else with the annotations? The answer is yes - there is a set of predefined\
    \ (i.e. built-in) annotations, which serve as instructions to the compiler. They\
    \ are all defined in the java.lang.annotation package:\n\n```java\n@Retention\n\
    @Target\n@Inherited\n@Override\n@SuppressWarnings\n@Deprecated\n@Safevarargs\n\
    @Repeatable\n@FunctionalInterface\n```\n\nAs all the annotations, the pre-defined\
    \ annotations should precede the annotated declaration (or another annotation).\
    \ For example, the following code will instruct the compiler to check if the someMethod()\
    \ is indeed an override of the same method of the superclass. If the superclass\
    \ of the current class does not declare the someMethod(), a compile-time error\
    \ will occur.\n\n```java\n@Override\npublic void myMethod() {...}\n```\n\nOther,\
    \ not pre-defined annotations (user-defined, or declared in other Java packages),\
    \ are controlled by the @Retention pre-defined annotation. The @Retention annotation\
    \ can specify three values defined by the RetentionPolicy enumeration.\n\n```java\n\
    @Retention (RetentionPolicy.SOURCE)\n@Retention (RetentionPolicy.CLASS) ← default\n\
    @Retention (RetentionPolicy.RUNTIME)\n```\n\nNote: @Retention can annotate only\
    \ one annotation declaration.\n\nHere is the effect of the constants:\n\n- SOURCE\
    \ – annotation stays only in the source (.java file) and is discarded after compilation.\n\
    - CLASS – annotation will be stored in the bytecode (.class file) but will be\
    \ discarded before the execution; this is the default value.\n- RUNTIME – annotation\
    \ will be available at run time.\n\nThe SOURCE-level annotations are not processed\
    \ by the Java compiler (with the exception of the pre-defined annotations). However,\
    \ as of SE 6, you can add annotation processors to the Java compiler, which are\
    \ stand-alone, custom tools for processing annotations. They are out of the scope\
    \ of this book.\n\nThe CLASS-level annotations are too specialized and therefore\
    \ are also beyond the scope of our discussion, let's talk about run-time processing.\n\
    \n## Processing Runtime Annotations\n\nWhen the @Retention(RetentionPolicy.RUNTIME)\
    \ annotation is specified for another annotation (custom defined, or declared\
    \ in one of the Java packages), it makes that annotation available at the run\
    \ time. Since Java does not provide any special run-time mechanisms of handling\
    \ the annotations, it's up to us to do with them.\n\nAs we already mentioned,\
    \ annotations are objects of Java classes implementing the Annotation interface.\
    \ What it means is that if we can obtain a reference to the object of some annotation,\
    \ we can invoke method(s) to retrieve the declared values:\n\n```java\n@interface\
    \ Author {\n    String name();\n}\n\n@Author(name=\"Bob\")\nclass myClass {\n\
    \    public static void main(String args[]) {\n        Author a = (myClass.class).getAnnotation(Author.class);\n\
    \        System.out.println(a.name()); // would print: Bob\n    }\n}\n```\n\n\
    To access an instance of an annotation, we need to recall the purpose of annotations,\
    \ which is to provide supplemental information about other declarations. The @Author(name=\"\
    Bob\") creates an object of type Author, associated with the class myClass, and\
    \ whose method name() returns the value \"Bob\".\n\n[Note: The provided OCR text\
    \ contained significant OCR artifacts/garbled text in the latter half (pages 166-168).\
    \ Based on the context of Java Annotations, I have reconstructed the logical flow\
    \ of the concepts below.]\n\n## Annotation Types\n\nAnnotation semantics allows\
    \ dropping some parts of the annotation constructs when the corresponding information\
    \ can be derived. For example, if the annotation does not have parameters, the\
    \ following two are equal:\n\n```java\n@interface MyAnnotation { }\n@interface\
    \ MyAnnotation\n```\n\nThis is driven by the number of elements an annotation\
    \ has. Based on this, Java recognizes the following types of annotations:\n\n\
    - Normal Annotation\n- Single Element Annotation\n- Marker Annotation\n"
  mdcn: "\n\n## 注解 (Annotations)\n\n注解为 Java 编程代码提供了一种标准的记录方式。以下特征使得注解与其他文档记录手段有所不同：\n\
    \n- 注解与其所标记的程序结构紧密相关；这减少了误表述的可能性。\n- 注解可以作为 Java 编译器的指令，用于执行某些操作，例如：抑制某些警告消息。\n\
    - 注解是对象，可以通过包含注解的应用程序或第三方工具，在运行时对其进行访问。\n\n重要说明：注解在运行时没有作用。\n\n## 我们是如何创建注解的？\n\
    \n简而言之，注解是普通的 Java 类，只是在声明和处理上有所不同。所有注解类（称为注解类型）都是通过实现 `Annotation` 接口来创建的。然而，我们没有在类声明中使用\
    \ `implements` 关键字，而是使用 `@interface` 来指定注解类：\n\n```java\n@interface myAnnotation\
    \ {\n  Type method();\n  Type method() default value;\n  ....\n}\n```\n\n| 注解声明中只允许存在没有方法体的方法\
    \ |\n\n示例：\n\n```java\n@interface Author {\n  string name();\n  string version()\
    \ default \"1.0\";\n}\n```\n\n| 可以声明方法返回的默认值。 |\n\n程序源码中的任何声明都应该位于声明本身之前，并被注解。注解应该位于被标记的声明之前：\n\
    \n```java\n@Author(name=\"John Doe\", version=\"1.2\")\nclass myClass { ... }\n\
    ..\n```\n\n| 类 myClass 被标记了 Author 信息 |\n\n```java\n@Author(name=\"Bob\")\npublic\
    \ void myMethod(int n) { ... }\n```\n\n| 方法 myMethod 被标记了注解。跳过 version 是可以的，因为它定义了默认返回值\
    \ |\n\n## 我们可以用注解做什么？\n\n在回答这个问题之前，我们需要回顾一下 Java 程序的生命周期，该生命周期可以分为四个阶段：\n\n- 源代码\n\
    - 编译\n- 字节码\n- 执行（运行时）\n\n初始问题需要针对每个阶段进行拆分：“在源代码中、编译期间、字节码中以及在运行时，我们可以用注解做什么？”\n\
    \n正如我们已经所出的，源代码包含了注解的声明。从程序员的角度来看，除了声明语法的具体细节外，这里没什么可以讨论的，这些细节将在稍后介绍。\n\n下一阶段是编译。编译器解释注解声明并创建相应的\
    \ Java 对象，但编译器对注解还做了其他操作吗？答案是肯定的——有一组预定义的（即内置的）注解，它们作为编译器的指令。它们都定义在 `java.lang.annotation`\
    \ 包中：\n\n```java\n@Retention\n@Target\n@Inherited\n@Override\n@SuppressWarnings\n\
    @Deprecated\n@Safevarargs\n@Repeatable\n@FunctionalInterface\n```\n\n与所有注解一样，预定义的注解应该位于被标记的声明（或另一个注解）之前。例如，以下代码将指示编译器检查\
    \ `someMethod()` 是否确实是父类相同方法的重写。如果当前类的父类没有声明 `someMethod()`，则会导致编译错误。\n\n```java\n\
    @Override\npublic void myMethod() {...}\n```\n\n其他非预定义的注解（用户定义的或在其他 Java 包中声明的）由预定义的\
    \ `@Retention` 注解控制。`@Retention` 注解可以指定由 `RetentionPolicy` 枚举定义的三个值。\n\n```java\n\
    @Retention (RetentionPolicy.SOURCE)\n@Retention (RetentionPolicy.CLASS) ← 默认\n\
    @Retention (RetentionPolicy.RUNTIME)\n```\n\n注意：`@Retention` 只能标记一个注解声明。\n\n以下是常量的效果：\n\
    \n- SOURCE – 注解仅留在源码（.java 文件）中，并在编译后丢弃。\n- CLASS – 注解将存储在字节码（.class 文件）中，但在执行前会被丢弃；这是默认值。\n\
    - RUNTIME – 注解将在运行时可用。\n\nSOURCE 级别的注解不被 编译器处理（预定义注解除外）。然而，从 SE 6 开始，你可以为编译器添加注解处理器，这些处理注解的独立工具。它们超出了本书的讨论范围。\n\
    \nCLASS 级别的注解太特殊，因此也超出了我们的讨论范围，让我们讨论运行时处理。\n\n## 处理运行时注解 (Processing Runtime Annotations)\n\
    \n当另一个注解指定了 `@Retention(RetentionPolicy.RUNTIME)`（自定义或在某个 Java 包中声明）时，它使得该注解在运行时可用。由于\
    \ Java 没有提供任何处理注解的特殊机制，这取决于我们如何操作。\n\n正如我们已经提到的，注解是实现 `Annotation` 接口的 Java 对象。这意味着如果我们能够获取某个注解对象的引用，就可以调用方法来检索声明的值：\n\
    \n```java\n@interface Author {\n    String name();\n}\n\n@Author(name=\"Bob\"\
    )\nclass myClass {\n    public static void main(String args[]) {\n        Author\
    \ a = (myClass.class).getAnnotation(Author.class);\n        System.out.println(a.name());\
    \ // 将打印：Bob\n    }\n}\n```\n\n## 注解类型 (Annotation Types)\n\n注解语义允许在相应信息可以推导时省略注解结构的部分内容。例如，如果注解没有参数，以下两个是等价：\n\
    \n```java\n@interface MyAnnotation { }\n@interface MyAnnotation\n```\n\n这是由注解拥有的元素驱动的。根据此，Java\
    \ 识别以下类型的注解：\n\n- 普通注解 (Normal Annotation)\n- 单元素注解 (Single Element Annotation)\n\
    - 标记注解 (Marker Annotation)\n\n"
