    String s2 = s.replace('' '', ''+''); // s2 = "+abc"

    ```


    ### 从字符串创建字符数组


    ```java

    String s = "abcd";

    char[] c = s.toCharArray();

    s.getChars(0, 2, c, 2);

    ```


    | c[0]=''a'' |

    | :--- |

    | c[1]=''b'' |

    | c[2]=''c'' |

    | c[3]=''d'' |


    从位置 2 开始复制字符串 `c` 中位置 0, 1 的字符。


    | c[0]=''a'' |

    | :--- |

    | c[1]=''b'' |

    | c[2]=''c'' |

    | c[3]=''d'' |


    ```


    ### 从字符串创建字节数组


    此方法将字符串的每个字符从 Unicode（16 位）转换为 8 位编码（通常为 ASCII），并创建一个字节数组。


    ```java

    String s = "abcd";

    byte[] b = s.getBytes();

    ```


    | b[0]=97 (''a'') |

    | :--- |

    | b[1]=98 (''b'') |

    | b[2]=99 (''c'') |

    | b[3]=100 (''d'') |


    ```


    ### 从字符数组创建字符串


    String 类的静态方法 `copyValueOf` 从字符数组中创建一个 String 对象。它具有以下格式：


    ```java

    static copyValueOf(char[] charArray);

    ```


    ```java

    static copyValueOf(char[] charArray, int startPos, int numberOfElements);

    ```


    示例：


    ```java

    char[] c = {''a'', ''b'', ''c'', ''d''};

    String s1 = String.copyValueOf(c); // s1 = "abcd"

    String s2 = String.copyValueOf(c, 1, 2); // s2 = "bc"

    ```


    ## 包 (Packages)


    包是类的容器。所有的 Java 类都分布在不同的包中。基本类位于 `java.lang` 包中。其他包的示例包括 `java.io`、`java.util`、`java.net`
    等。


    包按树形结构排列：


    ![](img/5cf5236b394075810b8edd6af6a34316_74_0.png)


    `java.lang` 包 Java 编译器始终可用。当你的程序需要使用不同包中的类时，该类或包含该类的整个包必须导入程序中：


    ```java

    import java.math.*;

    import java.io.FileReader;

    ```


    用户定义的类也存放在包中。例如，上述示例中的 `myClass` 将被放在默认的“无名”包中。要将其放入特定包中，程序的第一条语句（不计注释）必须是包语句：


    ```java

    package mypack.io;

    import java.io.FileReader;

    class myClass { ... }

    ```


    注意，类在编译后会保留关于其所属包的信息。因此，如果你将一个类从一个包复制到另一个包，它将无法工作。然而，有一个例外。当类在没有包语句的情况下编译时，它可以被放在任何命名的包中，并被该包中的所有类访问。包概念的实现取决于安装
    Java 的环境（Linux、Mac、Windows 等），因此不包含本书的范围内。


    ## 修饰符 (Modifiers)


    Java 语言的以下实体——类、接口、变量和方法——可以使用所谓的修饰符进行声明，以控制它们的行为和/或访问权限。这里，`myMethod` 使用两个修饰符：`public`
    和 `static`。


    ```java

    public static void myMethod() { ... };

    ```


    ## 类修饰符


    可以应用于类的修饰符集合有限：


    - public

    - abstract

    - final


    `public` 修饰符使类可以从任何包访问。如果未指定此修饰符，类将在其声明所在的包内可见。


    `abstract` 修饰符定义了一个类，其中一个或多个方法被声明为框架——具有返回类型和参数列表，但没有主体。抽象类将在“抽象类”章节中进一步解释。


    `final` 修饰符禁止类被继承。


    ## 访问权限修饰符


    访问权限修饰符控制变量和方法在相同包或不同包的类中的可见性。有四种访问权限修饰符（按从低到严格排序）：


    `public` → `protected` → [无修饰符] → `private`


    ```java

    public void myMethod() { ... };

    protected int n;

    double x;

    private String name;

    ```


    下表显示了一个类的变量和方法在其子类以及相同或不同包类中的可见性：


    | | 包一 | | 包二 | |

    | :--- | :--- | :--- | :--- | :--- |

    | 类 A | A 的子类 | 类 B | A 的子类 | 类 C |

    | public | 可见 | 可见 | 可见 | 可见 |

    | protected | 可见 | 可见 | 可见 | - |

    | 无修饰符 | 可见 | 可见 | - | - |

    | private | 可见 | - | - | - |


    '
