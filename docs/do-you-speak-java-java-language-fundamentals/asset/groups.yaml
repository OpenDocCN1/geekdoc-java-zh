- md: "\n# Regular Expressions\n\nThe validation and manipulation of the contents\
    \ of text strings can be found in many applications. For example, we might need\
    \ to check if an email address entered has valid format. The Regular Expressions\
    \ API is a powerful tool that a Java programmer can utilize to perform text validation,\
    \ parsing, tokenization, or other type of manipulations.\n\nThe Regular Expression\
    \ API consists of two utility classes: Pattern and Matcher. The Pattern class\
    \ is used to build regular expressions, which are referred to as patterns. The\
    \ Matcher class is used to apply the pattern to a text string. The usage of these\
    \ two classes is quite simple but the challenge is in mastering regular expression\
    \ skills, which, unfortunately, is beyond the scope of this book. Nevertheless,\
    \ we will go through several examples to make you familiar with the operations\
    \ that can be performed on text strings, and also to cover the basics of regular\
    \ expressions.\n\n# Regular Expressions Basics\n\nA regular expression is a sequence\
    \ of characters defining a pattern that can be matched against a text string.\
    \ For example, the regular expression “abc” can be used to check if a text contains\
    \ the “abc” sequence.\n\nThere are several categories of regular expressions.\
    \ We will present three of them.\n\nThe first category of regular expressions\
    \ is called “characters” and includes most of the characters and also the escape\
    \ sequences, like \\t (tab character), or \\n (newline character). “abc” is an\
    \ example of the character regular expression.\n\nThe second category of regular\
    \ expressions is called “character classes” and represents a range of valid characters.\
    \ For example, the [a-zA-Z] pattern matches any lower-case or upper-case letter.\n\
    \nFor some of the character classes constructs Java provides a shorthand form:\n\
    \n- . matches any character\n- \\s matches the white space character\n- \\d matches\
    \ any digit\n- \\w - matches any word character\n\nThe third category of regular\
    \ expression constructs is called “quantifiers”. Quantifier can be appended to\
    \ any character or character class construct to specify the allowed number of\
    \ occurrences for the construct:\n\n- + occurs once or not at all\n- * occurs\
    \ zero or more times\n- + occurs one or more times\n- {n} occurs exactly n times\n\
    - {n,} occurs at least n times\n- {n,m} occurs from n to m times\n\nThere are\
    \ other regular expression groups, but their review is beyond the scope of this\
    \ book.\n\n# Regular Expressions Examples\n\nBefore we start with examples, we\
    \ need to mention that the Pattern and Matcher classes have no constructors. Pattern\
    \ objects are created by the static method compile() of class Pattern, and Matcher\
    \ objects are created by the instance method matcher() of class Pattern.\n\nExample:\
    \ Validate if the whole text matches the pattern.\n\n```java\nString regex;\n\
    Pattern p;\nMatcher m;\n```\n\n| Pattern | Description |\n| :--- | :--- |\n| [a-z]+\
    \ | matches one or more lower case letters |\n| [a-zA-Z0-9]+ | matches any number\
    \ of letters or digits |\n| @ | matches the character '@' |\n| \\w+ | matches\
    \ any number of word characters |\n| \\. | matches the character '.' |\n| com\
    \ | matches the string \"com\" |\n\n```java\np = Pattern.compile(regex);\nm =\
    \ p.matcher(\"test\");\nm.matches(); // prints: true\n```\n\nExample: Extract\
    \ the user name and website address from email.\n\n```java\nimport java.io.*;\n\
    import java.util.stream.*;\nimport java.util.regex.*;\n\nclass testregex {\n \
    \   public static void main(String[] args) {\n        String text = \"a b c a\
    \ b def b g\";\n        Pattern p = Pattern.compile(\"\\\\s\");\n        Stream<String>\
    \ stream = p.splitAsStream(text);\n        Stream<String> unique = stream.distinct();\n\
    \        unique.forEach(w -> System.out.print(w + \" \"));\n\n        // same\
    \ result can be achieved in one statement:\n        Pattern.compile(\"\\\\s\"\
    )\n            .splitAsStream(text)\n            .distinct()\n            .forEach(w\
    \ -> System.out.print(w + \" \"));\n    }\n}\n```\nThe output of the above program\
    \ is: \"a b c def g \".\n\nExample: Replace all blank sequences with semicolons.\n\
    \n```java\nString text = \"One  Two  Four\";\nSystem.out.println(\n    Pattern.compile(\"\
    \\\\s+\").matcher(text).replaceAll(\";\")\n); // prints: One;Two;Four\n```\n\n\
    # Reflection API\n\nEvery Java program performs some manipulations on objects\
    \ of various types - classes, interfaces, arrays, primitive types, etc. At run\
    \ time, for each type of objects used by the program, the Java Virtual Machine\
    \ (JVM) creates an instance of Class, which provides methods to examine the properties\
    \ of the object's type. For example, when you declare a class A, the JVM builds\
    \ a corresponding Class object, providing all information about class A – its\
    \ methods, interfaces, annotations, fields, etc.\n\nThe Reflection API is a very\
    \ important component of the Java language. It is used extensively by Java Beans\
    \ (not covered by this book), by various tools, when working with annotations,\
    \ etc. You can also use it for debugging purposes.\n\n# Obtaining the Class object\n\
    \nThere are three primary methods of obtaining the Class object for a particular\
    \ class.\n\nWhen you have an instance of the class you want to explore, you can\
    \ call the instance method getClass() defined by class Object and available to\
    \ all Java objects:\n\n```java\nclass myClass { }\nmyClass obj = new myClass();\n\
    Class c = obj.getClass();\n```\n\nIn the case when no instances of a class are\
    \ available you can employ the so-called class literal to obtain the Class object.\
    \ A class literal is formed by the class name appended with .class:\n\n```java\n\
    interface myInterface {\n  void methodName();\n}\n\nclass myClass { }\n\nClass\
    \ c = myClass.class;\nClass i = myInterface.class;\n```\n\nFinally, you can use\
    \ the static method forName() of the class Class. This method accepts a fully-qualified\
    \ name of a class and returns its Class object. Note, that the forName() method\
    \ can throw the ClassNotFoundException.\n\n```java\nclass myClass { }\nClass c\
    \ = Class.forName(\"myClass\");\nClass s = Class.forName(\"java.lang.String\"\
    );\n```\n"
  mdcn: "\n\n# 正则表达式\n\n文本字符串内容的验证和处理可以在许多应用程序中找到。例如，我们可能需要检查输入的电子邮箱地址格式是否有效。正则表达式\
    \ API 是一个强大的工具，Java 程序员可以它来执行文本验证、解析、分词或其他类型的处理。\n\n正则表达式 API 由两个实用类组成：`Pattern`\
    \ 和 `Matcher`。`Pattern` 类用于构建正则表达式，这些正表达式被称为“模式（patterns）”。`Matcher` 类用于将模式应用到文本字符串上。这两个类的用法非常简单，但挑战在于掌握正则表达式技巧，遗憾的是，这超出了本书的讨论范围。尽管如此，我们仍然通过几个示例来让你熟悉可以在文本字符串上执行的操作，并涵盖正则表达式的基础知识。\n\
    \n# 正则表达式基础\n\n正则表达式是一个字符序列，定义了一个可以与文本字符串进行匹配的模式。例如，正则表达式“abc”可以用于检查文本是否包含“abc”序列。\n\
    \n正则表达式有几类。我们将介绍其中三类。\n\n正则表达式的第一类被称为“字符（characters）”，它包含了大多数字符以及转转义序列，如 `\\t`（制表符）或\
    \ `\\n`（换行符）。“abc”就是字符正则表达式的一个示例。\n\n正则表达式的第二类被称为“字符类（character classes）”，代表一组有效字符。例如，模式\
    \ `[a-zA-Z]` 匹配任何小写或大写字母。\n\n对于某些字符类结构，Java 提供了简写形式：\n\n- `.` 匹配任何字符\n- `\\s`\
    \ 匹配空白字符\n- `\\d` 匹配任何数字\n- `\\w` - 匹配任何单词字符\n\n正则表达式的第三类构造结构被称为“量词（quantifiers）”。量词可以附加到任何字符或字符类结构上，用以指定该结构允许出现的次数：\n\
    \n- `?` 出现一次或不出现\n- `*` 出现零次或多次\n- `+` 出现一次或多次\n- `{n}` 恰好出现 n 次\n- `{n,}` 至少出现\
    \ n 次\n- `{n,m}` 出现 n 到 m 次\n\n还有其他的正则表达式组，但它们的复习超出了本书的范围。\n\n# 正则表达式示例\n\n在开始示例之前，我们需要提到一下\
    \ `Pattern` 和 `Matcher` 类没有构造函数。`Pattern` 对象是通过 `Pattern` 类的静态方法 `compile()` 创建的，而\
    \ `Matcher` 对象是通过 `Pattern` 类的实例方法 `matcher()` 创建的。\n\n示例：验证整个文本是否匹配模式。\n\n```java\n\
    String regex;\nPattern p;\nMatcher m;\n```\n\n| Pattern | 描述 |\n| :--- | :---\
    \ |\n| `[a-z]+` | 匹配一个或多个小写字母 |\n| `[a-zA-Z0-9]+` | 匹配任意数量字母或数字 |\n| `@` | 匹配字符\
    \ '@' |\n| `\\w+` | 匹配任意数量单词字符 |\n| `\\.` | 匹配字符 '.' |\n| `com` | 匹配字符串 \"com\"\
    \ |\n\n```java\np = Pattern.compile(regex);\nm = p.matcher(\"test\");\nm.matches();\
    \ // 输出: true\n```\n\n示例：从邮箱中提取用户名和网站地址。\n\n```java\nimport java.io.*;\nimport\
    \ java.util.stream.*;\nimport java.util.regex.*;\n\nclass testregex {\n    public\
    \ static void main(String[] args) {\n        String text = \"a b c a b def b g\"\
