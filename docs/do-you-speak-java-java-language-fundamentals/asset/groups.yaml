    \ {\n            try {\n                System.out.println(\"hit enter...\");\n\
    \                System.in.read();\n            } catch (Exception e) { System.out.println(e);\
    \ }\n        }\n    }\n}\n```\n\n## 高级线程间通信\n\n在大多数情况下，`synchronized` 方法和 `synchronized`\
    \ 语句块对于建立共享资源的安全访问足够了。然而可能需要对同步过程进行更细粒度的控制。`Object` 类定义的以下三个方法允许两个或多个线程之间相互通信：\n\
    \n`wait()`, `notify()`, `notifyAll()`\n\n`wait()` 方法释放当前线程持有的锁，并将线程置于等待状态。\n\n\
    `notify()` 方法唤醒一个正在等待的线程。唤醒哪个线程是随机的。\n\n`notifyAll()` 方法唤醒所有正在等待锁的线程。上述方法必须在 `synchronized`\
    \ 方法或 `synchronized` 块中使用。下面的示例插明了如何建立线程之间的通信。\n\n```java\nimport java.io.IOException;\n\
    \nclass testNotify implements Runnable {\n    Object lock;\n    String[] s = {\"\
    one\", \"two\", \"three\", \"four\"};\n    int count = 0;\n\n    public static\
    \ void main(String[] args) {\n        testNotify me = new testNotify();\n    \
    \    me.lock = new Object();\n\n        Thread th1 = new Thread(me, \"thread1\"\
    );\n        Thread th2 = new Thread(me, \"thread2\");\n        th1.start();\n\
    \        th2.start();\n    }\n\n    public void run() {\n        String name =\
