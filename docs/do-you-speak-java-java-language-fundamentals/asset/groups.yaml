    \ ，请关闭显示的窗口。\n\n# JavaFX 事件处理示例：\n\n```\nimport javafx.application.*;\nimport\
    \ javafx.stage.*;\nimport javafx.scene.*;\nimport javafx.scene.shape.*;\nimport\
    \ javafx.event.*;\nimport javafx.scene.input.MouseEvent;\n\npublic class testJavaFX\
