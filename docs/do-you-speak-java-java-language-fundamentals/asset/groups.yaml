    # Abstract Classes


    Abstract class is a class in which one or more methods are declared, but not defined
    (i.e. without a body). To understand why we need abstract classes, consider this
    class hierarchy.


    ![](img/5cf5236b394075810b8edd6af6a34316_99_0.png)


    Class Shape declares the getArea method for calculating the area of a particular
    shape. This method is overridden with actual implementation in each of the subclasses
    – Square and Circle. If we create an object of class Shape, its getArea() would
    have no meaning. Of course, we could make it to return a false value, like zero,
    to indicate that this is not a true shape. A better approach, however, would be
    to altogether disallow the creation of class Shape objects. That''s abstract classes
    and abstract methods come in hand.


    Example:


    ```

    abstract class Shape {

    String myName;

    public abstract double getArea(double arg);

    public String getName() { return myName;}


    public static void main (String[] args) {

    shape a = new Circle();

    Double area = a.getArea(1);

    System.out.println("area=" + area); // prints: "area=3.1415"

    }


    class Circle extends Shape {

    public double getArea(double arg) {

    return (arg * arg * 3.1415);

