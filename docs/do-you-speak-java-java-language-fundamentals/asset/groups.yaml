    I/O Error\");\n        }\n    }\n}\n```\n\n# 字符输入流\n\n字符输入流由一组继承 `Reader` 抽象类的类表示。其目的是从不同的源以原生（本地）编码格式读取字符，并将其转换为\
    \ Unicode 格式。每个输入流类都必须实现读取方法：\n\n```\nint read(); // 读取单个字符\nint read(char[] c);\
    \ // 将字符读入数组\n// 读取到数组的一部分；\nabstract int read(char[] c, int off, int len);\n\
    ```\n\n注意：当到达流结束时，读取方法返回整数值 -1。\n\n除了读取方法外，`Reader` 类还提供了其他几种方法来支持所谓的“可标记流”。通过可标记流，你可以标记流中的当前位置，并在稍后返回该位置。可以使用\
    \ `markSupported` 方法来检查流是否是可标记的。\n\n示例：\n\n```java\n// 打印字母表中每隔一个字符\nimport java.io.*;\n\
    class testStringReader {\n    public static void main(String[] args[]) {\n   \
