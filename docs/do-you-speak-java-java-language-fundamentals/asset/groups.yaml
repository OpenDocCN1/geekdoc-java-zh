    \                sReader.skip(1);\n                i = sReader.read();\n     \
    \           if (i > 0)\n                    System.out.print((char) i);\n    \
    \        } while (i != -1);\n        } catch (IOException e) {\n            System.out.println(\"\
    Error reading file\");\n        }\n    }\n}\n```\n\n该程序产生输出：\"dfhjlnprtvxz\"\n\
    \n# Try-With-Resources\n\nJDK7 在流处理过程中增加了一个非常棒的增强。它允许在我们用完流后自动释放流所持有的资源（例如关闭文件）。此功能可以与实现了\
    \ `AutoClosable` 接口的类，该接口仅声明了一个方法 — `close()`。当 `try` 块结束时，将调用 `close` 方法。\n\n\
    新的 `try` 块格式：\n\n```\ntry ( 资源声明和初始化 )\n{ 资源的使用 }\ncatch ( . . ) { . . }\n```\n\
    \n示例：\n\n```java\nclass mystream extends OutputStream{\n    public void writeInt(int\
    \ i) { }\n    public void write(byte[] b, int offset, int lng) {\n        System.out.println(\"\
    Received bytes: \" + lng);\n    }\n}\nclass teststreams {\n    public static void\
