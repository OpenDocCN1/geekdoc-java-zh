  md: '# Updating Collections


    Every collection defines a set of methods allowing you to make changes to already
    created collections by removing or updating their elements. These methods can
    differ among the collection classes. The only method that is common to all collections
    is remove(). Below are a few examples of performing update operations on different
    collections.


    ```

    TreeMap<String, String> map = new TreeMap<>();

    map.put("key1","A");

    map.put("key2","B");

    map.put("key3","C");


    map.remove("key1","A");


    map.replace("key2","D");

    System.out.println(map); // prints: {key2=D, key3=C}

    ```


    > Removes the "key1/A" pair from the map


    > Replaces the "key2/B" with the "key2/D"


    ```

    Vector<String> v = new Vector<>();

    v.addElement("A");

    v.addElement("B");

    v.addElement("C");


    v.removeElement(1);

    System.out.println(v); // prints: [A, C]


    v.removeAllElements();

    ```


    > Removes the element at position 1 (i.e. second element)


    > Removes all elements from this vector and sets its size to zero'
