  md: "# Try-With-Resources\n\nThere is one nice enhancement added to the stream handling\
    \ process in JDK7. It allows to automatically release the resources held by a\
    \ stream (e.g. close the file) once we are done using the stream. This feature\
    \ can be used with the classes implementing the AutoClosable interface, which\
    \ declares only one method — close(). The close method will be called when the\
    \ try block ends.\",\n\nThe new format of the try block:\n\n```\ntry ( resource\
    \ declaration and initialization )\n{ usage of the resource }\ncatch ( . . ) {\
    \ . . }\n```\n\nExample:\n\n```\nclass mystream extends OutputStream{\n    public\
    \ void writeInt(int i) { }\n    public void write(byte[] b, int offset, int lng)\
    \ {\n        System.out.println(\"Received bytes: \" + lng);\n    }\n}\nclass\
    \ teststreams {\n    public static void main(String args[]) {\n    try (\n   \
    \     DataOutputStream dataout = \n            new DataOutputStream(\n       \
    \     new BufferedOutputStream(\n                new MyStream())));\n        dataout.writeInt(123);\n\
    \        // dataout.flush();\n    }\n    catch (IOException e) {\n        System.out.println(\"\
    I/o error\");\n    }\n}\n```\n\n![](img/5cf5236b394075810b8edd6af6a34316_141_0.png)\n\
