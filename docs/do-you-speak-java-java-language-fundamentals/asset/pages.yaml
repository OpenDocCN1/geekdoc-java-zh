  md: '# Synchronized Methods


    You can declare any method of your class as synchronized:

    synchronized static public void method1() {}

    synchronized public void method2() {}",


    By doing so, you activate the locking mechanism either on the class level, or
    on the object level, or both.


    The object-level synchronization works as follows:


    | All synchronized instance methods of an object are controlled by the same lock.
    Only one synchronized instance method of that object can be executed at any point
    in time.


    The class-level synchronization works as follows:


    | All synchronized static methods of a class are controlled by the same lock.
    Only one synchronized static method of the class can be executed at any point
    in time.


    Note that object-level synchronization and class-level synchronization work independently
    of each other.


    # Synchronized Statement Blocks


    There might be situations when you cannot use the synchronized methods such as
    when you''re not allowed to modify the class. In such circumstances you can use
    a synchronized statement block. Here is how a synchronized statement block is
    defined:


    ```

    synchronized ( object ) { statement block }

    ```


    This statement can be used anywhere in the thread execution path (i.e. in the
    run() methods or any other methods called by it). The statement block will be
    locked on the object and will be accessible only by one thread at a time.'
