  md: '\w - matches any word character


    The third category of regular expression constructs is called “quantifiers”. Quantifier
    can be appended to any character or character class construct to specify the allowed
    number of occurrences for the construct:


    +   - occurs once or not at all

    - occurs zero or more times

    - occurs one or more times

    - {n} occurs exactly n times

    - {n,} occurs at least n times

    - {n,m} occurs from n to m times


    There are other regular expression groups, but their review is beyond the scope
    of this book.


    # Regular Expressions Examples


    Before we start with examples, we need to mention that the Pattern and Matcher
    classes have no constructors. Pattern objects are created by the static method
    compile() of class Pattern, and Matcher objects are created by the instance method
    matcher() of class Pattern.


    Example: Validate if the whole text matches the pattern.


    String regex;

    Pattern p;

    Matcher m;


    | [a-z]+ matches one or more lower case letters |

    | Create Matcher object m |


    ```

    p = Pattern.compile("[a-z]+");

    m = p.matcher("test");

    System.out.println(m.matches()); // prints: true

    ```


    Example: Validate the email format.


    | Matches any number of letters or digits |

    | Matches the character ''@'' |

    | Matches any number of word characters |

    | Matches the character ''\.'' |

    | Matches the string "com" |


    ```

    regex = "[a-zA-Z0-9]+"

    + "@"

    + "\W+"

    + "\."

    + "com",

    ```


    ```

    p = Pattern.compile(regex);

    m = p.matcher("John123@site.com");

    System.out.println(m.matches()); // prints: true

    ```


    Example: Extract the user name and website address from email.


    ```

    p = Pattern.compile("@");

    String[] ss = p.split("John@site.com");

    ```'
