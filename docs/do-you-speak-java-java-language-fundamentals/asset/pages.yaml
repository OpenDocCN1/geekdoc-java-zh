  md: '# Operators


    In this chapter we will review operators that can be applied to primitive data
    types. These operators can be divided into the four main categories: arithmetic,
    bitwise, relational, and boolean. In addition, the assignment (=) and the question
    mark (?) will also be discussed here.


    # The Assignment Operator


    The assignment operator "=" assigns value to a variable. We''ve already used it
    many times in previous examples. The format of the assignment operator is this:


    ```

    variable = expression;

    ```


    It also can be used to assign a value to several variables in a single statement,
    like this:


    ```

    var1 = var1 = ... = varN = expression;

    ```


    Examples:


    ```

    int x, y;   // Declare the variables x and y of type integer

    x = 1;      // Assign the value 1 to variable x

    x = y = 2;  // Assign the value 2 to variables x and y

    ```'
