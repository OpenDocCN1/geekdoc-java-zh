  md: '# Reflection API


    Every Java program performs some manipulations on objects of various types - classes,
    interfaces, enumerations, arrays, primitive types, etc. At run time, for each
    type of objects used by the program, the Java Virtual Machine (JVM) creates an
    instance of class Class, which provides methods to examine the properties of the
    object''s type. For example, when you declare a class A, the JVM builds a corresponding
    Class object, providing all information about class A – its methods, interfaces,
    annotations, fields, etc.


    The Reflection API is a very important component of the Java language. It is used
    extensively by Java Beans (not covered by this book), by various test tools, when
    working with annotations, etc. You can also use it for debugging purposes.


    # Obtaining the Class object


    There are three primary methods of obtaining the Class object for a particular
    class.


    When you have an instance of the class you want to explore, you can call the instance
    method getClass() defined by class Object and available to all Java objects:


    ```

    class myClass { ... }

    .

    myClass obj = new myClass();


    class c = obj.getClass();

    ```


    ![](img/5cf5236b394075810b8edd6af6a34316_160_0.png)'
