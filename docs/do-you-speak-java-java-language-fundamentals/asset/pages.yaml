  md: '# I/O Streams


    A stream is an abstract representation of an input, where source data is retrieved
    from, or an output, where destination data is sent to. Java recognizes two types
    of streams – byte streams and character streams. The byte streams should be used
    for sending or receiving binary objects, and the character streams should be used
    when working with characters and the "character" representation of data is needed.


    ![](img/5cf5236b394075810b8edd6af6a34316_134_0.png)


    Note that the transmission of data via byte or character streams is done one byte
    or one character at a time. There are buffered streams that group the data into
    buffers, but those streams are still based on the underlying byte or character
    streams.


    This chapter provides an overview of the concept behind streams and illustrates
    the usage of some input and output streams.


    # Byte Output Streams


    Imagine that an application generates the following types of data and wants to
    write them out into a file:


    ![](img/5cf5236b394075810b8edd6af6a34316_134_1.png)'
