  md: "# Character Input Streams\n\nCharacter input streams are represented by a group\
    \ of classes extending the abstract class Reader. Their purpose is to read characters\
    \ from different sources in their native (local) encoding format and convert them\
    \ into the Unicode format. Each input stream class has to implement the read methods:\n\
    \n```\nint read(); // read a single character\nint read(char[] c); // read characters\
    \ into an array\n// reads into a portion of an array;\nabstract int read(char[]\
    \ c, int off, int len);\n```\n\nNote: the read methods return the integer value\
    \ -1 when the end of the stream is reached.\n\nIn addition to the read methods,\
    \ the Reader class provides several other methods for supporting the so-called\
    \ markable streams. With markable streams, you can mark a current position within\
    \ the stream and later return to that position. The markSupported method can be\
    \ used to check if a stream is markable.\n\nExample:\n\n```\n// Print every other\
    \ character of the alphabet\nimport java.io.*;\nclass testStringReader {\n   \
    \ public static void main(String[] args[]) {\n        String s = \"abcdefghijklmnopqrstuvwxyz\"\
    ;\n        int i = 0;\n        try {\n            Reader sReader = new StringReader(s);\n\
    \            do {\n                sReader.skip(1);\n                i = sReader.read();\n\
    \                if (i > 0)\n                    System.out.print((char) i);\n\
    \            } while (i != -1);\n        } catch (IOException e) {\n         \
    \   System.out.println(\"Error reading file\");\n        }\n    }\n}\n```\n\n\
    This program creates the output: \"dfhjlnprtvxz\""
