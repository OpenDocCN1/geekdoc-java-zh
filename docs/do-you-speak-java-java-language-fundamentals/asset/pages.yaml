  md: "# Byte Input Streams\n\nByte input streams are used to receive (read) a sequence\
    \ of bytes. All classes of this group have to extend the InputStream abstract\
    \ class and implement its read methods:\n\n```\nabstract int read();\nint read(byte[]\
    \ b); // optional\nint read(byte[] b, int offset, int len); // optional\n```\n\
    \nNote: the read methods return the integer value -1 when the end of the stream\
    \ is reached.\n\nIn addition to the read methods, the InputStream class provides\
    \ several methods for supporting the so-called markable streams. With markable\
    \ streams, you can mark a current position within the stream and later return\
    \ to that position. The markSupported method can be used to check if a stream\
    \ is markable.\n\nBelow is an example of reading integers from a file:\n\n```\n\
    // Assumption: a set of integer values were written into the\n// \"test.txt\"\
    \ file via DataOutputStream.\nimport java.io.*;\nclass TestByteInputStream {\n\
    \    public static void main(String[] args[]) {\n        boolean EOF = false;\n\
    \        int i;\n        try {\n            File myfile = new File(\"test.txt\"\
    );\n            FileInputStream filein = new FileInputStream(myfile);\n      \
    \      DataInputStream datain = new DataInputStream(filein);\n\n            while\
    \ (!EOF) {\n                i = datain.readInt();\n                System.out.println(\"\
    i=\" + i);\n            }\n        } catch (EOFException e) {\n            EOF\
    \ = true;\n        }\n        } catch (IOException e) {\n            System.out.println(\"\
    I/O Error\");\n        }\n    }\n```\n\n![](img/5cf5236b394075810b8edd6af6a34316_139_0.png)\n\
    \n![](img/5cf5236b394075810b8edd6af6a34316_139_1.png)\n\n![](img/5cf5236b394075810b8edd6af6a34316_139_2.png)"
