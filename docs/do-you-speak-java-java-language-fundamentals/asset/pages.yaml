  md: "# Arithmetic Operators\n\nArithmetic operators are used in calculations. Java\
    \ supports the following five basic algebraic operators: addition (+), subtraction\
    \ (-), multiplication (*), division (/), and modulus (%). Each of those can be\
    \ combined with the assignment operator (=) to form a so-called shorthand operator\
    \ in this:\n\n```\narithmetic_operator==\n```\n\nExamples:\n\n```\ndouble x, y;\n\
    x = 2.5;\ny = 10;\nx += y;      // x = 12.5 The result is same as in x = x + y;\n\
    x %= y;      // x = 2.5 The result is same as in x = x % y;\n             // note:\
    \ the modulus operation (%) returns the\n             // remainder of the division\
    \ 12.5 / 10\n```\n\nJava also provides two arithmetic operators: increment (++)\
    \ and decrement--) that respectively add 1 to a value or subtract 1 from a value.\
    \ These operators can be placed before or after a variable:\n\n```\nint x = 1;\
    \      // Declare x and set its value to 1\nx++;             // Add 1 to x (x=2)\n\
    ++++;             // Add 1 to x (x=3)\nx--;             // Subtract 1 from x (x=2)\n\
    ----;             // Subtract 1 from x (x=1)\n```\n\nIn the above examples the\
    \ placement of the increment and decrement operators is irrelevant. However, in\
    \ assignment expressions, their location is important. When the operator is placed\
    \ after the variable, the original value of the variable is used in the calculation\
    \ of the result; after that the increment/decrement operator is applied to the\
    \ variable. When placed in front of a variable, the increment/decrement operator\
    \ is first applied to that variable and the new value is used in the calculation.\n\
    \nExamples:\n\n```\nint x, y;\nx = 1;\ny = x++;      // x=2, y=1 (original value\
    \ of x before the increment)\ny = ++x;      // x=3, y=3 (new value of x after\
    \ the increment)\n```"
