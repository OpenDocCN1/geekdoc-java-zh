  md: "The classname parameter sets the upper boundary for class names that are allowed\
    \ to be specified by the type-variable T and enforces that only the classname\
    \ class or any class extending the classname can be specified by the T parameter.\
    \ This is a part of the type safety mechanism provided by generics.\n\nThe example\
    \ below shows the type safety mechanism in action:\n\n```\nabstract class AB {\
    \ public abstract String getName(); };\nclass A extends AB { public String getName()\
    \ { return \"A\"; }\nclass B extends AB { public String getName() { return \"\
    B\"; }\n\nclass G <T extends AB> {\n  String name;\n```\n\n```\nG (T obj) { name\
    \ = obj.getName(); } // class G constructor\n```\n\n```\npublic static void main\
    \ (String args[]) {\n  A a = new A();\n  G g;\n\n  g = new G( a );\n  g = new\
    \ G<AB> ( a );\n```\n\n> Error! You have to explicitly specify the object type\
    \ you are passing to the constructor of class G\n\n> Compiler will check if the\
