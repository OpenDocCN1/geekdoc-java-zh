  md: "# Layouts\n\nIn the previous example, the location of the nodes (the circle\
    \ and the rectangle) within the scene (i. window) was specified explicitly. The\
    \ root node Group provides a container for holding other nodes, without any attempts\
    \ to arrange them in any particular way.\n\nLayout containers or panes can be\
    \ used to allow for flexible and dynamic arrangements of the UI controls within\
    \ a scene graph of a JavaFX application.\n\nThe JavaFX API provides several container\
    \ classes that can hold components and arrange them according to pre-defined layout\
    \ models. The layout classes reside in the javafx.scene.layout.Pane package. We\
    \ will show you an example of using one of these layouts – TilePane. It places\
    \ the nodes in uniformly sized cells:\n\n```\nimport javafx.application.*;\nimport\
    \ javafx.stage.*;\nimport javafx.scene.*;\nimport javafx.scene.layout.*;\nimport\
    \ javafx.scene.shape.*;\n\npublic class testJavaFX extends Application {\n\n \
    \   public void start(Stage stage) {\n\n        Pane tile = new TilePane();\n\n\
    \        for (int i = 0; i < 10; i++) {\n            tile.getChildren().add(new\
    \ Circle(20));\n        }\n\n        Scene scene = new Scene(tile, 200, 100);\n\
    \        stage.setTitle(\"Tiles\");\n        stage.setScene(scene);\n        stage.show();\n\
    \    }\n}\n```\n\nThis program displays the following window:\n\n![](img/5cf5236b394075810b8edd6af6a34316_173_0.png)"
