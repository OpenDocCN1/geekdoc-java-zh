  md: "# Encapsulation\n\nEncapsulation principle requires that the internals (data\
    \ and code) of an object should be protected from being arbitrarily accessed by\
    \ code outside of the object. The only way to \"communicate\" with an object and\
    \ access its properties is through the public methods and public properties. Below\
    \ is an example of how the principle of encapsulation is implemented in Java.\n\
    \n```\n// Declare the class \"Apple\"\nclass Apple {\n    private String color;\n\
    \    public void setColor(String c) {\n        color = c;\n    }\n}\n```\n\n![](img/5cf5236b394075810b8edd6af6a34316_14_0.png)\n\
    \n![](img/5cf5236b394075810b8edd6af6a34316_14_1.png)\n\n```\n// Create the \"\
    apple1\" object of class Apple\nApple apple1 = new Apple();\n```\n\n```\n// Invoke\
    \ the public method \"setColor\" of object \"apple1\"\n// and set the color property\
    \ to \"red\"\n```\n\n```\napple1.setColor(\"red\");\n```\n\n![](img/5cf5236b394075810b8edd6af6a34316_14_2.png)\n\
    \n```\napple1.color = \"red\";\n```"
