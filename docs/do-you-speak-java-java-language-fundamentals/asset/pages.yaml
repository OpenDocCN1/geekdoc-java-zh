  md: "# Interfaces\n\nAn interface is a collection of constants, abstract methods,\
    \ and default methods. The main purpose of interfaces is to supply useful constants\
    \ and methods to classes, and also to expand the polymorphism mechanism beyond\
    \ the class hierarchies.\n\nAn interface can extend one or more other interfaces.\
    \ Interfaces cannot be instantiated (you cannot create an object of an interface),\
    \ but they can be implemented by a class. The class implementing an interface\
    \ must override all abstract methods of the interface, otherwise the class will\
    \ be abstract.\n\nThe example below demonstrates the common technique of working\
    \ with interfaces.\n\nFirst, we declare two interfaces: Conversion1 and Conversion2.\
    \ The Conversion2 interface extends Conversion1 and adds one constant and one\
    \ method.\n\n```\ninterface Conversion1 {\n    double F2C = 5.0 / 9.0;\n    double\
    \ toCelsius(double t);\n}\n```\n\n```\ninterface Conversion2 extends Conversion1\
    \ {\n    double C2F = 9.0 / 5.0;\n    double toFahrenheit(double t);\n}\n```\n\
    \nNext, we declare two classes implementing the Conversion2 interface. Both classes\
    \ will have access to the constants declared in Conversion1 and Conversion2 interfaces,\
    \ and they must also implement all methods declared in those interfaces.\n\n```\n\
    // Approximate temperature conversions\nclass myClass1 implement Conversion2 {\n\
    \    public double toFahrenheit(double t) {return t * 2 + 32};\n    public double\
    \ toCelsius(double t) {return (t - 32) / 2;}\n}\n```"
  merge: -1
