  md: "# Serialization\n\nByte output streams have the capability of writing Java\
    \ objects from computer memory into output devices or data streams, and byte input\
    \ streams can read them back into the computer memory. The process of writing\
    \ an object into a stream is called serialization, and the process of reading\
    \ an object from a stream is called deserialization.\n\nEvery Java object is a\
    \ complex structure that may include methods, variables, and even other objects.\
    \ That structure is referred to as an \"object graph\". Java encodes all data\
    \ into a special internal format before writing it out into a stream.\n\nThe implementation\
    \ of serialization/deserialization is done by the ObjectOutputStream and ObjectInputStream\
    \ classes. Their main methods are writeObject() and readObject(), respectively.\n\
    \nThe writeObject method can serialize any object, as long as its class implements\
    \ the Serializable interface. The Serializable interface does not declare any\
    \ constants or methods; it is an indication of objects of this class are allowed\
    \ to be serialized.\n\nExample:\n\n```\n// write one object of myClass into file\
    \ object.txt\nimport java.io.*;\nclass myClass implements Serializable {\n   \
    \ private String name;\n}\nnmyClass(String s) { this.name = s; }\npublic String\
    \ getName() { return name; }\npublic static void main(String[] args[]) {\n   \
    \ // write one object of myClass to file object.txt\n    ObjectOutputStream out\
    \ = new ObjectOutputStream(\n        new FileOutputStream(\"object.txt\"));\n\
    \    out.writeObject(new myClass(\"First object\"));\n}\n```\n\n| myClass constructor\
    \ |\n| Instance method returning the name variable |"
