  md: '# Summary


    Here is the summary of what we have learned thus far about the objects:


    | Objects are instantiated (i.e. created) using the **new** statement, which has
    the following format: |

    | classNameNew constructor; |


    | A **constructor** is a special method with the [same name as the class name](...)
    that is invoked automatically by the JVM when an object of the class is being
    created. |


    | The format of the constructor is: **className(parameters) {body}**

    The **parameters** and **body** are optional, the return type is omitted. |


    | The constructor is invoked after all instance declarations are processed and
    instance blocks (if present) are executed. |


    | A class can have several constructors with different **signatures** (i.e. with
    different sequences of argument types). |


    | An empty constructor ( **className()** ) is automatically created by Java when
    no constructors are declared explicitly. |


    | The default constructor ( **className()** ) will not be created by the JVM if
    at least one explicitly declared constructor is present. |


    | A constructor can invoke another constructor of the same class by executing
    the `this(parameters)`;; as the [first statement](...) of the constructor’s body.
    |


    | Instance variables can be referenced in a constructor via **“this”** keyword
    as follows: `this.variableName` |


    | The keyword **“super”** represents a superclass (parent) of a subclass (child)
    and can be used in the constructor of a subclass to invoke the superclass constructors
    - **super(parameters)**; to access the superclass instance variables - **super.variable**;
    and to call the superclass methods **super.method()**. |


    | A superclass and its subclass can declare instance variables with the same names.
    The **object casting** mechanism should be used if we want to access non-unique
    instance variables of a superclass from a subclass: |'
