  md: "# The \"switch\" Statement\n\nThe switch statement implements the Multiple\
    \ Choice (CASE) construct:\n\n![](img/5cf5236b394075810b8edd6af6a34316_35_0.png)\n\
    \nHere is the format of the switch statement:\n\n```\nswitch ( integer or String\
    \ type expression )\n{\n  case value1: statement; . . statement;\n    break;\n\
    \  case valueN: statement; . . statement;\n    break;\n  default: statement; .\
    \ . statement;\n}\n```\n\nThe expression must be evaluated to one of the following\
    \ numeric types - char, byte, short, int, or to the type String. The result of\
    \ the expression is compared with the values specified in the case blocks - value1\
    \ through valueN. When a match is found, all the statements following that case\
    \ statement are executed. If we want to execute statements for only one case value,\
    \ we need to use the break statement as shown above. The break statement \"jumps\"\
    \ out of the switch construct to the next following statement. The default statement\
    \ group, which is optional, is executed when no values found.\n\nExample:\n\n\
    ```\nint x, y, z;\nx = y = z = 1;\nswitch (x += y) { // evaluates to 1 + 1 = 2\n\
    \  case 1:    z = 0; break;\n  case 2:    z = 1; break;\n  default:   z = 999;\n\
