    \ are specified.\n\nA Single-Element Annotation is a shorthand designed for use\
    \ with annotations declaring a single element. If the element name is value, it\
    \ can be omitted from the annotation:\n\n```\n@interface Name {\n  String value();\n\
    }\n\n@Name ( value=\"Bob\" )\n@Name ( \"Bob\" )\n```\n\nIt is also valid to use\
    \ single-element annotations for annotations with multiple elements, so long as\
    \ one element is named value and all other elements have default values. All below\
    \ constructs are valid:\n\n```\n@interface BookName {\n  String value();\n  int\
    \ edition() default 1;\n}\n```\n\n```\n@BookName ( { name=\"My Book\",edition=2;\
    \ }\n@BookName (name=\"My Book\")\n@BookName(\"My Book\")\n```\n\n> Single-value\
