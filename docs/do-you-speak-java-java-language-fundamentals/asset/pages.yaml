  md: "# Anonymous Classes\n\nAn **anonymous class** is a class declared within an\
    \ expression. The definition of the anonymous class begins with the keyword **new**\
    \ and is enclosed within round brackets:\n\n```\n( new className() {body of the\
    \ class} )\n```\n\nThis is equivalent to creating an instance of some unnamed\
    \ class extending the **className**. Being an instance of a class, the anonymous\
    \ class definition can be used in various expressions:\n\n```\nsomevariable =\
    \ (anonymous class definition).method();\nsomeMethod(anonymous class definition);\n\
    ```\n\nConsider a situation when we have Circle calculating the area of a circle\
    \ with this formula: **area = 3.14 * radius * radius**. We want to keep the existing\
    \ class Circle, but increase the precision of this calculation by using a new\
    \ formula: **area = 3.1415926 * radius * radius**.\n\nHere is how we can accomplish\
    \ this with an anonymous class:\n\n```\nclass circle {\n    public double getArea(double\
    \ r) {return 3.14 * r * r};\n}\n```\n\n```\nclass testClass {\n    public static\
    \ void main(String args[]) {\n        Circle a = new circle();\n        System.out.println(a.getArea(2));\
    \ //prints: 12.56\n\n        a = (new circle()) {\n            public double getArea(double\
    \ r)\n            return 3.1415926 * r * r;\n        };\n        System.out.println(a.getArea(2));\
    \ // prints: 12.5663704\n    }\n}\n```"
