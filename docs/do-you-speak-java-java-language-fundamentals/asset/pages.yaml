  md: '# Collections Framework


    The Collections Framework is a set of interfaces and classes that provide a standardized
    approach for managing groups of objects. The cornerstone of the whole concept
    is the collection, a generic term for a set of objects grouped together by some
    means. Based on the way collections are built and accessed, all collections can
    be divided into three major categories:


    +   - LIST - a sequence of objects; examples: arrays, sorted lists, queues, stacks.

    - SET - a group of unique objects; no duplicates allowed.

    - MAP - a group of key/value pairs of objects.


    Each group can be divided further into sub-groups. For example, a list could be
    sorted, linked, organized as a stack, etc. However, regardless of the differences
    between collections, most of the operations upon them are performed in a similar
    manner, through standardized interfaces. This chapter provides an overview of
    such operations.


    # Creating Collections


    Most of the collections use the add() method of the corresponding class for putting
    new elements into collections:


    ```

    // Create a LinkedList collection

    LinkedList<String> list = new LinkedList<String>();

    list.add("A");

    list.add("B");

    list.add(1, "C");

    System.out.println(list); // prints: [A, C, B]

    ```


    ![](img/5cf5236b394075810b8edd6af6a34316_125_0.png)'
