  md: "# Default and Static Methods in Interfaces\n\nSometimes it might be beneficial\
    \ to have interfaces with fully implemented methods (i.e. methods with a body).\
    \ This can be accomplished in two ways: by declaring default methods or static\
    \ methods.\n\nA default method is an instance method that has a body and is prefixed\
    \ with the default modifier. Default methods can be, but are not required to be,\
    \ overridden in the classes implementing the interface.\n\n```\ninterface Shape\
    \ {\n  default double getvolume() {return 1.0;}\n}\n```\n\nA static method is\
    \ a class-level method that has a body and is prefixed with the static modifier.\
    \ Static methods can be, but are not required to be overridden in classes implementing\
    \ the interface.\n\n```\ninterface Shape {\n  static String getShapeName(Object\
    \ obj)\n  return obj.getClass().getName();\n}\n```\n\nExample:\n\n```\nclass orange\
    \ implements shape {\n  public static void main(String args[]) {\n    double volume;\n\
    \    String name;\n\n    Shape obj = new Orange();\n    name = Shape.getShapeName(obj);\n\
    \    volume = obj.getVolume();\n\n    System.out.println(\"Shape=\"+ name); //\
    \ prints: \"Shape=Orange\"\n    System.out.println(\"Volume=\"+ volume); // prints:\
    \ \"Volume=0\"\n  }\n}\n```"
