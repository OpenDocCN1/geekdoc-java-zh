  md: '# Data Types, Variables, and Literals


    The Object-Oriented Design discussion gave us an idea of how the Java language
    is different from other, “traditional” languages. Now let''s look at the features
    making Java similar to non-object-oriented languages.


    Most languages, including Java, have the following in common:


    +   - ability to manipulate primitive data types

    - variables and literals

    - a fixed set of operators

    - language constructs and statements for controlling the program flow


    In this chapter we will review the primitive data types, variables, and literals.
    The rest will be covered in later chapters.


    # Primitive Data Types


    A primitive data type (could be also referred to as simple or atomic type) is
    a data type that is not formed by combining other data types. For example, a string
    is not a primitive data type because it is defined as a set of elements of the
    character data type.


    Java defines eight primitive data types:


    | Date | Description | Length in bits | Range (approximate) |

    |---|---|---||

    | byte | Signed Integer Number | 8 | -128 to +127 |

    | short | Signed Integer Number | 16 | -32,768 to +32,767 |

    | int | Signed Integer Number | 32 | -2.1*10^9 to +2.1*10^9 |

    | long | Signed Integer Number | 64 | -9.2*10^18 to +9.2*10^18 |

    | float | Floating Point Number | 32 | ± (1.4e-45 to 3.4e+38) |

    | double | Floating Point Number | 64 | ± (4.9e-32 to 1.8e+308) |

    | char | Unicode Character | 16 | 0 to 65,536 |

    | boolean | | N/A | true or false |


    Note: Java does not reveal the length of boolean data type because its implementation
    is platform-specific.'
  merge: -1
