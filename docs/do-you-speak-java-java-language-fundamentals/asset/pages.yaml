  md: 'The short-circuit operators (&&) and (||) do not evaluate the right-hand operand
    of a logical expression when the value of the left-hand operand determines the
    result regardless of the value of another operand. For example, if A=true, the
    result of A | B is always true, no matter of what B value is.


    Examples:


    ```

    boolean a, b, c;

    a = true;

    b = true;


    a = !b;      // a=false

    a &= b;      // a=false (same as: a = a & b)

    a |= b;      // a=true (same as: a = a | b)

    a^= b;      // a=false (same as: a = a ^ b)

    a = a ^ b; // a=false

    ```


    // short-circuit operators


    ```

    a = false;

    b = true;

    c = a || b;   // c=true (a and b both will be evaluated)

    c = b || a;   // c=true (a will not be evaluated)

    c = a && b;   // c=false (b will not be evaluated)

    ```'
