    # Non-Static Inner Classes


    A non-static inner class is a class declared within another class as an instance
    property (i.e. without the static modifier). An object of a non-static inner class
    has access to the instance variables and methods of the outer class in which it
    was created. Objects of non-static inner classes can be created either within
    instance methods of the outer class, or with the new operator prefixed with the
    outer class name:


    ```

    public class outer {

    int x = 0;

    ```


    ```

    class Inner { void innerMethod() { x++; }; }

    ```


    ```

    public static void main(String args[]) {

    Outer outer1 = new Outer();

    ```


