  md: "# Exceptions\n\nAn **exception** is an interruption of normal program flow\
    \ due to an error. Some errors are fatal and cannot be recovered from, while others\
    \ are not critical and can be handled by the application (e.g. file not found\
    \ situation). Java recognizes two types of exceptions: **checked exceptions**\
    \ and **unchecked exceptions**.\n\n**Unchecked exceptions** are not anticipated.\
    \ For example, a JVM failure or division by zero are not expected situations.\
    \ Usually these errors are due to issues with the Java runtime environment or\
    \ bugs in the application code. The way to deal with unchecked exceptions is to\
    \ fix the environment issues (if any) or get rid of bugs in the application (debugging).\n\
    \nUnchecked exceptions are not anticipated and not required to be processed by\
    \ the application.\n\n**Checked exceptions** are explicitly declared in some Java\
    \ classes or user-defined classes and could **throw** (i.e. created) under some\
    \ circumstances. For example, the `FileReader` will throw the `FileNotFoundException`\
    \ if the file you're trying to open cannot be found. A checked exception must\
    \ be caught and processed in the method where the exception occurs, or it can\
    \ be passed through (propagated) to the calling method (if any), all the way to\
    \ the JVM.\n\nChecked exceptions are declared in Java or user-defined classes\
    \ and could be thrown under some circumstances.\nChecked exceptions are anticipated\
    \ and must be processed or passed through by the application. \n\nJava provides\
    \ a special mechanism for handling exceptions. When an error occurs during execution\
    \ of an application, Java interrupts the application and triggers the exception\
    \ handling mechanism. This process is referred to **throwing an exception**. After\
    \ that, the exception can be handled either by the application, or by the JVM.\
    \ The details of the whole process are described in the next section."
  merge: -1
