  md: "# Instance Variables and Methods\n\nThe variables, methods, and statement blocks\
    \ in a class declaration, that do not have the static modifier, are called instance\
    \ variables, instance methods, and instance statement blocks. Their usage is subject\
    \ to the following rules:\n\nDeclaration Rule:\n\n> Instance variables, methods,\
    \ and statement blocks must be declared without the static modifier\n\nAccessibility\
    \ Rule:\n\n> Instance variables and methods can be used only after an object (instance)\
    \ of the class is created, and must be referenced via the object name\n\nExecution\
    \ Rule:\n\n> All instance declarations and statement blocks {...} of a class are\
    \ processed (i.e. executed) each time an object (i.e. instance) of the class is\
    \ created.\n\nThe following example shows how objects could track their creation\
    \ sequence.\n\nNote: The new statement (discussed in the next section) creates\
    \ an object of specified class.\n\n```\nclass myClass {\n    static void int getTotal();\
    \ // class variable\n        int myNumber; // instance variable\n        { myNumber\
    \ = ++ totalCount; } // statement block\n\n    // Main program\n    public static\
    \ void main(String args[]) {\n        myClass obj1 = new myClass(); // creates\
    \ the object obj1\n        myClass obj2 = new myClass(); // creates the object\
    \ obj2\n        System.out.println(obj1.myNumber); // prints 1\n        system.out.println(obj2.myNumber);\
    \ // prints 2\n    }\n}\n```"
