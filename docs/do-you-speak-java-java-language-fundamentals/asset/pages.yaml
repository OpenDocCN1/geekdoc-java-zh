  md: "# Iterating through Collections\n\nThere are situations when you need to access\
    \ a collection sequentially, reading its elements one by one, in one or both directions.\
    \ There are two ways to accomplish this: by using the for-each loop, and by using\
    \ iterators - the Iterator, ListIterator, and Spliterator classes. However, a\
    \ collection must implement the Iterable interface in order to use either of these\
    \ methods. The map classes, for example, do not implement the Iterable interface,\
    \ so you have to obtain a collection-view of a map using the entrySet() method\
    \ (i.e. convert the map into a SET-type collection) in order to work with the\
    \ map as a “collection”\n\n# The “for-each” Loop\n\nThe first way of cycling through\
    \ a collection is by use of the for-each loop. This is the easiest way to access\
    \ the elements of a collection sequentially by one, in one direction.\n\nExample:\n\
    \n```\n// Iterating through list\nLinkedList<String> list = new LinkedList<String>();\n\
    list.add(\"A\");\nlist.add(\"B\");\nlist.add(\"C\");\n\nfor (String s : list)\
    \ {\n    System.out.println(s); // Prints each element of the list\n}\n\n// Iterating\
    \ through a map\nTreeMap<String, String> map = new TreeMap<>();\nmap.put(\"key1\"\
    ,\"A\");\n```\n\n> Iterates through the list.\nEach element is assigned to s,\
    \ by one one.\n\n> Puts one key/value pair into the map\n\n> Creates a set-type\
    \ collection from the map elements\n\n> Cycles through the map. Each map entry\
    \ is assigned to m.\n\n```\nSet<Map.Entry<String, String>> mapset = map.entrySet();\n\
    \nfor (Map<String, String> m : mapset) {\n    System.out.println(m); // prints:\
    \ key1=A\n    System.out.println(m.getKey()); // prints: key1\n    System.out.println(m.getValue());\
    \ // prints: A\n}\n```"
