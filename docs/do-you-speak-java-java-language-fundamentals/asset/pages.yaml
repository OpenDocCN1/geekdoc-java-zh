  md: '# Methods


    A **method** is a block of code that can be referenced and called by its name.
    It is constructed as follows:


    ```

    accessAttributes returnType methodName(parameters) { body }

    ```


    Example:


    ```

    public int myMethod(int x, int y) {

    return x + y;

    }

    ```


    This method accepts two integer numbers and returns its sum to the calling program
    (i.e. to another method).


    The **access attributes** are optional. They will be discussed in detail in a
    separate chapter.


    The **return type** can be of any primitive type, an array, a class, or **void**,
    which indicates that no data is returned by the method.


    The **method name** can be any name of your choice.


    The **parameters** are optional.


    The **body** is a set of variables declarations and executable statements.


    # The "main" Method


    The **main** method is a special method that starts execution of all Java applications.
    Java looks for this method in all classes presented for execution, and expects
    it to be defined exactly like this:


    ```

    public static void main (String args[]) { body }

    ```'
