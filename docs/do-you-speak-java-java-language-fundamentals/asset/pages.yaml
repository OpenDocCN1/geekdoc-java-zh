  md: "# Polymorphism\n\nPolymorphism principle dictates that it is allowed to have\
    \ multiple methods with the name but different implementations within one or more\
    \ classes, and the language must be able to determine which variation of the method\
    \ to execute at run time.\n\nBelow are examples of how the Java language implements\
    \ polymorphism. Let's say, we need to calculate the square footage of different\
    \ shapes – rectangle, triangle, circle, etc. Each shape is represented by its\
    \ own class, and each class is a sub-class of the superclass Shape:\n\n![](img/5cf5236b394075810b8edd6af6a34316_16_0.png)\n\
    \n```\n// Declare the class Shape\nclass Shape {\n    public double footage;\n\
    \    public void showSquareFootage() {\n        System.out.println(footage);\n\
    \    }\n}\n```\n\n```\nThis method is executed when an object of class Rectangle\
    \ is created. // Declare the class Rectangle\nclass Rectangle extends Shape {\n\
    \    double width;\n    double height;\n    Rectangle(double w, double h) {\n\
    \        width = w;\n        height = h;\n    }\n\n    public void showSquareFootage()\
    \ {\n        footage = width * height;\n        System.out.println(footage);\n\
    \    }\n}\n```"
