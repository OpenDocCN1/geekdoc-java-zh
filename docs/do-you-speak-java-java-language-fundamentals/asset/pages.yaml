    \ Runnable {\n    Object lock = new Object();\n    String[] s = {\"one\", \"two\"\
    , \"three\", \"four\"};\n    int count = 0; \n\n    public static void main(String\
    \ args[]) {\n        testNotify me = new testNotify();\n\n        Thread th1 =\
    \ new Thread(me, \"thread1\");\n        Thread th2 = new Thread(me, \"thread2\"\
    );\n        th1.start();\n        th2.start();\n```\n\n![](img/5cf5236b394075810b8edd6af6a34316_123_0.png)\n\
