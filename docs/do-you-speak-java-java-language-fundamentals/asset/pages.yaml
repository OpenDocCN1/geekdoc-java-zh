  md: "# Generic Interfaces\n\nGeneric interfaces are declared in a way similar to\
    \ the declaration of generic classes, for example:\n\n```\ninterface GenericInterface\
    \ <T> {\n  public void myID(T id);\n}\n```\n\nThe type-variable(s) in the interface\
    \ declaration are passed to the interface from the class implementing that interface:\n\
    \n```\nclass myClass <T> implements myInterface <T> {...}\ninterface myInterface\
    \ <T> { ... }\n```\n\nThis is why generic interfaces can only be implemented by\
    \ generic classes.\n\nIt is possible to restrict the scope of type-variables in\
    \ the class declaration, in the interface declaration, or in both:\n\n```\nclass\
    \ myClass <T extends AB> implements myInterface <T> {...}\ninterface myInterface\
    \ <T extends ABC> { ... }\n```\n\nThe Java compiler performs **type safety checking**\
    \ by comparing the bounds set for the type arguments in the class to the bounds\
    \ set in the interface. The class type arguments must be within bounds of the\
    \ interface class arguments.\n\nNote: Whether the type-variable **T** is used\
    \ (or how it is used) in the bodies of the class or interface, is irrelevant to\
    \ the type safety checking process – the type safety checking will be performed\
    \ anyway."
