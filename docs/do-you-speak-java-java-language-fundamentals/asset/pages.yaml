  md: '# Object-Oriented Design


    As we already mentioned, the main difference between traditional languages and
    object-oriented programming languages is the level of abstraction in viewing the
    data. Traditional languages provide means of manipulating primarily primitive
    data elements, while object-oriented languages are focused on manipulating logical
    objects. The way manipulation of objects is implemented in the language is is
    based on Object-Oriented Design (OOD) principles. The OOD consists of three main
    concepts – Encapsulation, Inheritance, and Polymorphism. In general, they set
    up rules on how objects and their contents should be built, and the valid relationships
    between objects. In order to understand these concepts, we have to get familiar
    with terminology around objects.


    Let’s look at the picture:


    ![](img/5cf5236b394075810b8edd6af6a34316_13_0.png)


    Class A is a template (definition) for building objects. It consists of definitions
    called properties and programs (executable code) called methods.


    Object 1 and Object 2 are the instances of class A. They hold concrete values
    of all properties declared in Class A.


    There can be multiple classes (templates) and multiple objects (instances) of
    those classes in a program. Now, let’s describe the three OOD concepts.'
  merge: -1
