  md: "# Constructors\n\nThe myClass() method mentioned above is called a constructor,\
    \ which is a method with the same name as the class name and without the return\
    \ type specified. It is invoked by the JVM when an object of the class is being\
    \ created. The purpose of a constructor is to initialize the instant variables\
    \ of the class. If you do not declare any constructors, the JVM will create an\
    \ one: className() {}, which will do nothing. However, once at least one constructor\
    \ is declared by the programmer, the default constructor is gone and cannot be\
    \ used. Please remember that a constructor is invoked right after the instance\
    \ declarations and statement blocks are processed. Below is an example of a class\
    \ that keeps track of its objects:\n\n```\nclass testclass {\n    static int count;\
    \ // Total objects counter; defaults to zero\n    int myNumber; // Object's sequential\
    \ number\n\n    // Instance block executes every time an object is created\n \
    \   {\n        myNumber = ++count; // instance block increments the count\n  \
    \  } // and assigns it to object's myNumbern\n    testClass() {} // constructor\
    \ without parameters\n    testClass(int n) {\n        myNumber = n; // Second\
    \ constructor; assigns specified\n        // sequence number to new object\n \
    \   }\n\n    -----Execution----\n    public static void main(String args[]) {\n\
    \        testClass obj1 = new testClass();\n        testClass obj2 = new testClass();\n\
    \        testClass obj3 = new testClass(10);\n        System.out.println(obj1.myNumber);\
    \ // prints 1\n        System.out.println(obj2.myNumber); // prints 2\n      \
    \  System.out.println(obj3.myNumber); // prints 10\n    }\n}\n```\n\nNote, that\
    \ we defined two different constructors with the same name. This is called \"\
    method overloading\"."
