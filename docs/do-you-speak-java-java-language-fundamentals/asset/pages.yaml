  md: "# The “for-each” Statement\n\nConsider an example when we need to calculate\
    \ the average value for a set of numbers, stored in an array. Here is how we can\
    \ accomplish that with the “classical” for statement: \n\n```\nint nArray[] =\
    \ {1, 2, 3, 4, 5}; // array of five numeric values\ndouble avg = 0;\n\n// loop\
    \ through nArray elements (first element is numbered 0)\n// and calculate the\
    \ sum of all elements\n\nfor ( int i = 0; i < nArray.length; i++ )\n  avg += nArray[i];\
    \ }\n\n// divide the sum by the number of elements\navg /= nArray.length;\nSystem.out.println(\"\
    avg=\" + avg); // prints: avg=3.0\n```\n\nThe same result can be accomplished\
    \ with the “for-each” version of the statement, which has the following format:\n\
    \n```\nfor (type iterativeVariable: collection) { body }\n```\n\nThe above example\
    \ would look like this:\n\n```\nint nArray[] = {1, 2, 3, 4, 5}; // array of five\
    \ numeric values\ndouble avg = 0;\n\n// The val must be assigned the value of\
    \ each array element,\n// one by one, in sequential order.\n\nfor ( int val: nArray)\n\
    \  avg += val;\n\navg /= nArray.length;\nSystem.out.println(\"avg=\" + avg); //\
    \ prints: avg=3.0\n```\n\nPlease note, that the iterative variable val must be\
    \ the same or compatible data type as the elements of the collection (array).\
    \ The compatible data types are those that the original data type can be implicitly\
    \ promoted to. In this example, the original data type is int, which can be promoted\
    \ to long, float, or double."
