  md: "# Lambda Expressions\n\nA lambda expression is a special construct of the Java\
    \ language used for defining custom methods outside of any class. In reality,\
    \ the lambda expression automatically declares a “hidden” class, creates an instance\
    \ of that class, and attaches the specified method to it.\n\nLet’s illustrate\
    \ this process with an example. We will implement the functionality using the\
    \ “traditional” approach and also using the lambda expressions. The task is to\
    \ create a method converting any text to uppercase.\n\nHere is the “traditional”\
    \ way:\n\n```\nclass myClass {\n  string transform(string s) { return s.toUpperCase();\
    \ }\n}\n..\nmyClass c = new myClass();\nSystem.out.println( c.transform(\"text\"\
    ) ); // prints: \"TEXT\"\n```\n\nThe same transform method declared using lambda\
    \ expression:\n\n```\ninterface myInterface {\n  String transform(String s); //\
    \ \"txt\" substitutes the input parameter\n}\n\nmyInterface upper = (txt) -> {return\
    \ txt.toUpperCase();};\nnSystem.out.println( upper.transform(\"text\") ); // prints:\
    \ \"TEXT\"\n```\n\n> We need to create an interface that must declare only one\
    \ method. This is called a “functional interface\"\n\n> Becomes the body of the\
    \ transform method\n\n> upper is an object of a “hidden” class that implements\
    \ myInterface\n\nIt seems that the “lambda” approach does not save us much effort\
    \ – instead of declaring a class, we declare an interface, and instead of creating\
    \ an object of the class we use the lambda expression that defines the body of\
    \ the method and also creates an object of a “hidden” class. Even worse – the\
    \ lambda expression approach looks like an “un-object-oriented” way to achieve\
    \ the same thing that could be done the “object-oriented” way."
