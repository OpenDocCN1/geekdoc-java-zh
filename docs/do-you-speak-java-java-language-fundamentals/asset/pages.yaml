  md: '# Introduction


    There is a broad range of books on Java – beginner’s guides to complete references.
    The first category tends to concentrate on basic concepts, which does not take
    you very far from the “Hello world!” program. The books of the second category
    are simply too big – usually over 1,000 pages. They are very good as reference
    sources, but a bit overloaded with details and lengthy examples. They are also
    trying to cover as many topics as possible, which makes the learning curve steeper.


    The size of this book is less than two hundred pages so it is definitely not a
    reference guide. Nor is it a “Java basics” book.


    Not concentrating too much on details, and illustrating everything with small
    comprehensive examples, this book focuses on Java’s fundamental features, essential
    for building real-life applications. The goal is to create an overall understanding
    of how Java works. The details can be picked up later either from Java original
    specifications and tutorials, or from those comprehensive guides and complete
    references.


    Starting from the ground up, the book builds a solid foundation of your Java knowledge.


    If you want to become a Java expert – this book is a good start. Good luck!'
