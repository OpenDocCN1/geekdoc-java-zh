  md: "By default, type-variables can specify any class type or interface type. To\
    \ set boundaries to the allowed values of a type-variable, use the **extends**\
    \ keyword along with this format:\n\n```\n<T extends class> constructorName (...)\
    \ {...}\n```\n\nThe **T** type-variable is restricted to the type **class** or\
    \ any of its sub-classes.\n\nExample:\n\n```\nclass GenericClass <T> {...}\n<V\
    \ extends ABC> GenericClass (T obj1, V obj2) {...}\n\nThe above type-variable\
    \ **V** can be of any type ABC or any of its sub-classes.\n```\n\n# Generic constructors\
    \ can also be used in non-generic classes.\n\nExample:\n\n```\nclass nonGeneric\
    \ {\n  String name;\n  <T extends myInterface> nonGeneric(T o) {\n    this.name\
    \ = o.getName();\n  }\n  public static void main (String args[]) {\n    nonGeneric\
    \ g = new nonGeneric(new A());\n    System.out.println(g.getName()); // prints:\
    \ \"Class A\"\n  }\n}\n\ninterface myInterface { String getName(); }\nclass A\
    \ implements myInterface {\n  public String getName() { return \"Class A\"; }\n\
    }\n```\n\n> Only classes implementing the interface myInterface can be passed\
    \ to this constructor.\n\nNotice the usage of the interface name in the constructor\
    \ declaration:\n<T extends myInterface>\n\nThis is valid, because when a class\
    \ implements an interface, objects of that class can be referenced by variables\
    \ of the interface type."
