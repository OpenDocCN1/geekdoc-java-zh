  md: "# Declaring Classes\n\nClasses are declared using the class statement:\n\n\
    ```\nclass className {\n  type variable1;\n  type variable;\n  type method1(parameters);\n\
    \  type methodN(parameters);\n}\n```\n\nExample:\n\n```\n// Class Temperature\
    \ provides functionality to convert\n// temperatures from Celsius to Fahrenheit\
    \ and vice versa\nclass Temperature {\n  // Class variables and methods:\n  static\
    \ double t; // temperature value\n  static double Ftoc() // method for converting\
    \ 'F' to 'C'\n    {return (temp - 32) / 1.8;}\n  static double Ctof() // method\
    \ for converting 'C' to 'F'\n    {return temp * 1.8 + 32;}\n\n  // Instance variables\
    \ and methods:\n  double temp; // temperature value\n  double toCelsius() // method\
    \ for converting 'F' to 'C'\n    {return (temp - 32) / 1.8;}\n  double toFahrenheit()\
    \ // method for converting 'C' to 'F'\n    {return temp * 1.8 + 32;}\n}\n```\n\
    \n# Class Variables and Methods\n\nThe code in previous example declares a new\
    \ class Temperature with two sets of variables and methods. The main difference\
    \ between those sets is in the usage of the static scope modifier. All variables\
    \ and methods declared as static are called class variables and class methods,\
    \ and can be used without creating objects. Other variables and methods are called\
    \ instance variables and instance methods, and can be used only through object\
    \ instances."
