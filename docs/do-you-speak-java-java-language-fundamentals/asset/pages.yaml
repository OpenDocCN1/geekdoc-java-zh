  md: '# JavaFX API


    JavaFX is a set of graphics and media packages that enables developers to create
    rich client applications with high-performance modern graphical user interfaces
    featuring audio, video, graphics, and animation.


    Each JavaFX application consists of two major parts: **application** and **stage**.
    The **application** (represented by the Application class) is responsible for
    building the **stage** and its elements, and for defining the processing logic.
    The **stage** (represented by the Stage class and other classes) is a hierarchical
    collection of objects defining the visual appearance of the **application**.


    This diagram presents the structure of JavaFX applications:


    ![](img/5cf5236b394075810b8edd6af6a34316_170_0.png)


    The Stage defines the environment for the JavaFX application. A default Stage
    instance is provided by the Java run-time environment. However, you can create
    multiple Stage instances (objects).


    The Scene is a container (window) that holds the contents (i.e. elements) of the
    **stage**. The contents of a **Scene** create what is referred to as a **scene
    graph**.


    The **Root Node** determines the layout of the elements of the **Scene**.


    The **Node** represents an element of the **Scene**. It could be a button, a text
    box, a geometrical shape, an animation, etc.


    The **Application** class launches the JavaFX applications. The **launch()** method
    executes the **init()** method, then **start()**, and after the **Stage** is finished
    (e.g. the window is closed) – the **stop()** method.


    The following JavaFX example to create a window displaying a circle and a rectangle:'
