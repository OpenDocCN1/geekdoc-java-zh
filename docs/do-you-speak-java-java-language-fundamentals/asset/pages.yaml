  md: '# Handling Exceptions


    Java''s exception handling mechanism includes a built-in default exception handler
    and special language constructs for catching or throwing the exceptions. The default
    exception handler is executed when your program does not process the exception;
    it prints out some diagnostic information and terminates the program. A program
    can build its own custom code for handling specific exceptions by utilizing these
    commands: try, catch, finally, throw, and throws.


    As we mentioned before, exceptions (i.e. error situations) could be anticipated
    (checked exceptions) or unanticipated (unchecked exceptions). Checked exceptions
    are explicitly declared in some Java classes (or in userdefined classes or methods).
    Unchecked exceptions are usually unexpected (e.g. division by zero) and could
    be left unhandled. Java supports a predefined set of unchecked exceptions. The
    similarities and differences in handling of checked and unchecked exceptions are
    explained below.


    # Handling Unchecked Exceptions


    When an unexpected error occurs, Java creates an object of appropriate exception
    type that contains information about the exception, and passes that object to
    the application. If the current method does not have logic for catching the exception,
    Java propagates (passes) it to the calling method if one exists, or to the JVM.


    This diagram illustrates how the JVM handles unchecked exceptions:


    ![](img/5cf5236b394075810b8edd6af6a34316_107_0.png)'
