  md: "# Inheritance\n\nInheritance principle applies to the relationship between\
    \ classes. It states that two classes can have a parent-child connection, in which\
    \ the child class (a subclass) inherits all the features of the parent class (a\
    \ superclass).\n\n![](img/5cf5236b394075810b8edd6af6a34316_15_0.png)\n\nBelow\
    \ is an example of the inheritance mechanism.\n\n```\n// Declare the class \"\
    Fruit\"\nclass Fruit {\n    private String color;\n    public void setColor(String\
    \ c) {\n        color = c;\n    }\n}\n```\n\n```\n// Declare the class \"Apple\"\
    \ as a child of class Fruit\nclass Apple extends Fruit {\n}\n```\n\n![](img/5cf5236b394075810b8edd6af6a34316_15_1.png)\n\
    \n```\n// Create the \"apple1\" object of class Apple\nApple apple1 = new Apple();\n\
    ```\n\n```\n// Execute the method \"setColor\" of object \"apple1\"\n// and set\
    \ the value of color property to \"red\"\napple1.setColor(\"red\");\n```\n\nEven\
    \ though the color property and the setColor methods are not defined in the Apple\
    \ class, they are accessible in the Apple objects due to inheritance."
