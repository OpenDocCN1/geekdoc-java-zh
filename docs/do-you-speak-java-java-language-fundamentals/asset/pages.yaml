  md: "# Advanced Inter-Thread Communication\n\nIn most cases synchronized methods\
    \ and synchronized statement blocks are sufficient for establishing safe access\
    \ to shared resources. However, there might be a need for more granular control\
    \ over the synchronization process. The following three methods defined by the\
    \ Object class allow two or more threads to communicate with each other:\n\nwait(),\
    \ notify(), notifyAll()\n\nThe wait() method releases the lock held by the current\
    \ thread and puts the thread in a waiting state.\n\nThe notify() method wakes\
    \ up one of the waiting threads (if any). The choice of which thread to wake up\
    \ is arbitrary (i.e. a random thread will be chosen for you by the JVM).\n\nThe\
    \ notifyAll() method wakes up all threads waiting on the lock held by the current\
    \ thread.\n\nThe above methods must be used within either synchronized methods\
    \ or synchronized statement blocks.\n\nThe example below illustrates how communication\
    \ between threads be established. The program creates two threads reading the\
    \ same array of strings, one element at a time. Once the next element of the array\
    \ is processed by one thread, the thread gives control to another thread and goes\
