    \ T myvalue;\n    public void setValue(T obj) {\n        myvalue = obj;\n    }\n\
    \n    public static void main(String args[]) {\n        myClass<String> c = new\
    \ myClass<String>();\n        c.setValue(\"test\");\n        System.out.println(c.myvalue);\
    \  // print: \"test\"\n\n        myClass<Integer> n = new myClass<Integer>();\n\
    \        n.setValue(123);\n        System.out.println(n.myvalue);  // print: \"\
    123\"\n    }\n}\n```\n\nNote that we have to specify the class type parameter\
    \ explicitly when creating objects of generic classes. This information is used\
    \ by Java for type safety checking, making sure, for example, that an object reference\
    \ of type myClass<String> does not point to an object of type myClass<Integer>.\n\
    \nThe class declaration shown in the previous example (class G <T>) allows substitution\
    \ of the type-variable T with any class name. In most cases, it is not desirable.\
    \ Usually, we want to restrict the range of classes for which generic class objects\
    \ can be built. We can achieve this by using another form of generic class declaration:\n\
    \n```\nclass G <T extends className> { ... }\n```"
