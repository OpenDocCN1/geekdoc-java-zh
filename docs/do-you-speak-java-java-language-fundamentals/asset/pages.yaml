    \ to their default values - zero for numbers, true/false for Boolean, and null\
    \ for objects.\n\nIn the above example, if the name variable was declared as transient,\
    \ the output of the program would be “null” because strings are objects in Java.\n\
    \nA special situation will occur if your serializable class extends a non-serializable\
    \ class. During the deserialization process, an instance of the non-serializable\
    \ class (your superclass) will be created automatically using the no-argument\
    \ constructor. You have to make sure that such a no-argument constructor of the\
    \ superclass exists."
