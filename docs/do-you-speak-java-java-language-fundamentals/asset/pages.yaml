  md: '# Strings


    In Java, a sequence of characters is represented by the class String. The String
    class is a regular class, and can be handled as such. However, due to its extensive
    usage, Java added some convenient features that make handling of strings more
    intuitive. In this chapter, we will review all the special features of the String
    class.


    # String Literals, Creating Strings


    The string literal is a sequence of characters enclosed within double quotes:
    "First line of a string literal. \n second line."


    String literals can be used to create String objects directly:


    | String s1 = new string();

    s1 = "text"; | Creates an empty String (null object)

    Assigns value to the String object s1 |

    | String s2 = new string("text"); | Creates a String object and initializes it
    |

    | String s3 = "text"; | Creates a String object and initializes it with a literal
    |


    As you can see in this example, a String object can be created without using the
    new operator – just by direct assignment of a string literal to a String variable.
    This might look strange at first, but there is a simple explanation:


    > Stand-alone string literal in Java is an object of class String.


    Each unique string literal Java creates one object that can be referenced by different
    object variables. The new operator, on the other hand, always creates a new object
    regardless of the literal value passed to the constructor:


    ```

    String s1 = new String("text"); -> String object "text"

    String s2 = new String("text"); -> String object "text"

    String s3 = "text"; -> String object "text"

    String s4 = "text";

    ```'
