  md: "# Spliterator\n\nThe newest type of iterator added in JDK 8 is the Spliterator\
    \ interface. It was designed for traversing collections or other sources of data\
    \ elements and optionally partitioning them for parallel processing. We said \"\
    collections or other sources elements of data elements\" because the Spliterator\
    \ can be created not only for collections, but also for arrays, I/O channels,\
    \ or generator functions.\n\nNote that Spliterator consumes the source. A new\
    \ Spliterator must be created once all the elements of the source are processed.\n\
    \nIn the below example we create a spliterator for an array of integers, split\
    \ it in two, and calculate the sum of all values stored in the array.\nimport\
    \ java.util.*;\n\n```\nclass testSpliterator {\n    public static void sum(Integer\
    \ i) { total += i; }\n\n    public static void main(String args[]) {\n       \
    \ Integer[] integers = {1, 2, 3, 4};\n        Spliterator<Integer> sp1 = Arrays.spliterator(integers);\n\
    \        Spliterator<Integer> sp2 = sp1.trySplit();\n        while (sp1.tryAdvance(i\
    \ -> total += i));\n        if (sp2 != null) {\n            while (sp2.tryAdvance(i\
    \ -> sum(i)));\n        }\n        System.out.println(\"Total=\" + total); //\
    \ prints: Total=10\n    }\n```\n\nPay attention to the tryAdvance() method. It\
    \ checks if the next element of the source is present, and if it returns the boolean\
    \ false. Otherwise it executes the accept() method of the functional interface\
    \ Consumer and returns the true. We substitute the accept() method via two different\
    \ lambda expressions: \"i -> total += i\" and \"i -> sum(i)\".\n\nNote that the\
    \ while statements have no body (however, they could) because all the processing\
    \ is done though the lambda expressions."
