  md: '# Enumerations


    The idea behind enumerations is to provide an easy way of defining sets of constants
    not bound to any primitive or object types, which usually restricts the scope
    of their usage. Java’s solution to this problem was a new type of classes, whose
    instances are treated as constants. Here is a sample declaration of an enumeration
    class:


    ```

    enum myEnum { MIN, MAX }

    ```


    Notice the usage of enum instead of class. The MIN and MAX are the instances (objects)
    of the class myEnum and are called enumeration constants. They are implicitly
    declared as public, static, final. The enumeration constants are created (instantiated)
    automatically, when the enumeration class is first referenced in the program.
    Therefore, you do not need to use the new operator (in fact, you cannot) to create
    an object of the enumeration class. Besides these differences, the enumeration
    classes are still Java classes, and as such, they can have static and instance
    variables, methods, statement blocks, and even constructors.


    Example:


    | myEnum { MIN, MAX; } | Static statement block; executes when class myEnum is
    loaded into the JVM |

    | static { System.out.println("Class myEnum loaded"); } | Instance statement block;
    executes when an instance of the class is created. |

    | { System.out.println(this + " created"); } | |

    | public static void main(String args[]) { myEnum min, max; } | First reference
    to class myEnum; Declares two variables of type myEnum |


    This program produces the output:


    ```

    MIN created

    MAX created

    Class myEnum created

    ```


    Now, let’s see what we can do with the enumerations. The best way to illustrate
    the benefits of enumerations is to go through examples. Imagine'
