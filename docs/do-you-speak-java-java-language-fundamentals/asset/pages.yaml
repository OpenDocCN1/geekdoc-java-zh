  md: "To handle unchecked exceptions in your application, you can use the following\
    \ constructs:\n\n```\ntry {\n    code you want to monitor for possible exceptions\n\
    } catch (exceptionType1 e) {\n    code processing the exception of type exceptionType1\n\
    }\n...\ncatch (exceptionTypeN e) {\n    code processing the exception of type\
    \ exceptionType\n} finally {\n    code to be executed regardless of the results\
    \ of try or catch blocks\n}\n```\n\nExample of handling unchecked (not anticipated)\
    \ exceptions:\n\n```\nint n = 0;\ntry {\n    n = 5 / n;\n} catch (ArithmeticException\
    \ e) {\n    System.out.println(\"Exception caught!\");\n} finally {\n    System.out.println(\"\
    n=\" + n);\n}\n```\n\n![](img/5cf5236b394075810b8edd6af6a34316_108_0.png)\n\n\
    ![](img/5cf5236b394075810b8edd6af6a34316_108_1.png)\n\n![](img/5cf5236b394075810b8edd6af6a34316_108_2.png)\n\
    \nNote that once an exception is caught, the propagation process stops and normal\
    \ program execution resumes. It is possible, however, to pass an exception to\
    \ the calling method even after the exception was caught and processed. This is\
    \ done using the throw statement:"
