  md: "# Constructor reference\n\nConstructor reference is similar to method reference.\n\
    \nLet's say, the Location class holds two coordinates, x and y:\n\n```\nclass\
    \ Location {\n    int x, y;\n    Location () { x = y = 0; }\n    Location(int\
    \ x, int y) {\n        this.x = x;\n        this.y = y;\n    }\n}\n```\n\nWe want\
    \ to be able to build the Location objects not only \"traditional way\", with\
    \ the new keyword, but also by calling a create method accepting coordinates.\n\
    \nFirst, we declare a functional interface with the create method accepting integers\
    \ and returning an object of class Location:\n\n```\ninterface myConstructor {\n\
    \    Location create (int x, int y);\n}\n```\n\nThen, during execution, we create\
    \ an instance (i.e. object) of the functional interface with the reference to\
    \ one of the Location class constructors:\n\n```\nmyConstructor mc = Location\
    \ :: new;\n```\n\n> Will try to find a constructor of class Location with same\
    \ argument list as in the create() method declared by myConstructor interface.\
    \ If found, the create() method will be referencing the found constructor.\n\n\
    Finally, we use the method create() to invoke a proper constructor of the class\
    \ Location:\n\n```\nLocation a = mc.create( 7, 8 );\n```\n\nThis example demonstrates\
    \ the basics of creating and using constructor references. However, having two\
    \ ways of invoking the same constructor seems to be more confusing than beneficial.\n\
    \nSo here is a more practical example - we will be passing default constructor\
    \ references of two different classes (A and B) to the printName() method."
