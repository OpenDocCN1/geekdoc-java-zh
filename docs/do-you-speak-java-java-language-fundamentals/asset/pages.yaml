  md: '# Event Handling


    When you interact with a GUI application, each action triggers an event.

    Mouse move, mouse click, keyboard input, scroll, screen touch, swipe, etc. –

    all are examples of events that can be captured by the JavaFX application and
    processed.


    The event handling mechanism employed by JavaFX is easier explained through an
    example. Let''s say that we clicked on a button on the screen. This action triggers
    a "mouse click" event. In JavaFX, an event is an instance of the javafx.event.Event
    class or any subclass of Event, so JavaFX creates a corresponding Event object
    for the event. The event object “travels” through the object hierarchy of the
    JavaFX application, from the Stage object to the target node that was clicked
    (a Button), and backwards. By “travel” we mean “presented for processing”. The
    first path is called “capturing phase":


    +   - Stage -> Root Node -> branch nodes (if any) -> Target Node


    The second path is called "bubbling phase":


    +   - Target Node -> branch nodes -> Root Node -> Stage


    The following diagram illustrates the event handling mechanism:


    ![](img/5cf5236b394075810b8edd6af6a34316_174_0.png)


    Any time during the capturing or bubbling phase the event can be flagged as “consumed”
    by executing the consume() instance method of class Event. This stops further
    event propagation.


    Presenting (i.e. delivering) an event to an object for processing does not imply
    that the event will be or be processed by that object. To be able to accept'
  merge: -1
  pgno: 174
- img_proc: true
  md: 'and process an event, every object must register itself as an event handler
    and implement some kind of event handling logic. Since events are delivered to
    each object twice – during the capturing (or filtering) phase, and during the
    bubbling (or handling) phase, the object can set up either an event filter, or
    event handler, or both.


    All nodes (i.e. subclasses of the Node class), as well as the Stage and Scene
    classes define methods for registering and implementing event filters and event
    handlers:


    ```

    <T extends Event> void addEventListener(EventType<T> eventType,

    EventHandler<? super T> handler);

    ```


    ```

    <T extends Event> void addEventHandler(EventType<T> eventType,

    EventHandler<? super T> handler);

    ```


    There are also so-called convenience methods for registering the event handlers
    for different types of events. They are basically shorthand for the addEventHandler
    methods. For example, this method registers an event handler for the "mouse clicked"
    event:


    ```

    void setMouseClicked(EventHandler<? super MouseEvent> value);

    ```


    Let’s practice and create a couple of event handlers using the addEventHandler()
    and setMouseClicked() methods.


    The setMouseClicked method declares one argument – an object of generic functional
    interface EventHandler, whose generic class parameter can be the MouseEvent or
    any superclass of MouseEvent (e.g. EventHandler<MouseEvent>, EventHandler<Event>,
    etc.).


    The EventHandler functional interface declares the following method:


    ```

    void handle(T event);

    ```


    Next, we need to create an object of type EventHandler<MouseEvent>, implement
    its handle() method, and pass this object as an argument to the setMouseClicked()
    method. This can be accomplished in several different ways, three of which are
    presented below.'
  merge: -1
  pgno: 175
- img_proc: true
  md: "The first way of registering an event handler with the setOnMouseClicked()\
    \ method is by using an anonymous class:\n\n```\nnode.setOnMouseClicked(\n   \
    \ new EventHandler<MouseEvent>() {\n        public void handle(MouseEvent e) {\n\
    \            ... event handling logic ...\n        }\n    }\n);\n```\n\n> Create\
    \ an object of type EventHandler<MouseEvent>\n\n> Implement the handle() method\
    \ of the EventHandler functional interface\n\nThe second way of using the setOnMouseClicked()\
    \ method is by using a lambda expression:\n\n```\nnode.setOnMouseClicked(\n  \
    \  e -> { ... event handling logic ... }\n);\n```\n\n> This lambda expression\
    \ creates an object of type EventHandler<MouseEvent> with its handle() method\
    \ implemented as specified in (...)\n\nThe third way of using the setOnMouseClicked()\
    \ method is by using a method reference:\n\n```\nclass myClass {\n    public void\
    \ myClickHandler(MouseEvent e) {\n        ... event handling logic ...\n    }\n\
    \    public static void main(String[] args) {\n        ...\n        node.setOnMouseClicked(\n\
    \            myClass::clickHandler\n        );\n    }\n}\n```\n\n> This method\
    \ reference expression creates an object of type EventHandler<MouseEvent> with\
    \ its handle() method pointing to the myClickHandler() method\n\nNote that the\
    \ myClickHandler method must have same signature as the handle method of the EventHandler\
    \ interface, which is declared as follows:\n\n```\nvoid handle (T event)\n```\n\
    \nThe T is the event type we want to handle; in our case it is the MouseEvent."
  merge: -1
  pgno: 176
- img_proc: true
  md: "Now let's create an event handler using the addEventHandler() method. The format\
    \ of the addEventHandler is this:\n\n```\n<T extends Event> void addEventHandler(EventType<T>\
    \ eventType, EventHandler<?super T> eventHandler)\n```\n\nThe first difference\
    \ of this method from the previously reviewed setOnMouseClicked is that the EventHandler\
    \ object can be of any event type, not just MouseEvent. In fact, the EventHandler\
    \ can be created for the Event class and any subclass of the Event class. The\
    \ second difference - we need to tell the method which event type we will be processing\
    \ by passing it an object of type EventType<T>, where T can specify the Event\
    \ class and any of its subclasses.\n\nUsing a lambda expression, we can build\
    \ an event handler for the “mouse click” event as follows:\n\n```\nnode.addEventHandler(\n\
    \  MouseEvent.MOUSE_CLICKED,\n  e -> {... event handling logic ...}\n);\n```\n\
    \n![](img/5cf5236b394075810b8edd6af6a34316_177_0.png)\n\nNote: The MouseEvent.MOUSE_CLICKED\
    \ in this example is a static variable of EventType<MouseEvent> defined in the\
    \ MouseEvent class, representing the “mouse clicked” type. Its definition is:\n\
    \n```\npublic static final EventType<MouseEvent> MOUSE_CLICKED\n```\n\nThe registration\
    \ of event filters is similar to the registration of event handlers with the exception\
    \ that there are no convenience methods provided."
