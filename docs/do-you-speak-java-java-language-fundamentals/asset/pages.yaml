  md: "# Object Casting\n\nNote, the super keyword can be used only in constructors.\
    \ So how do we access the instance variables or instance methods of a superclass\
    \ from a subclass object? In the above example the variable x is defined in both\
    \ the subclass and the superclass. The subclass' x can be referenced via the subclass\
    \ object name as follows: subclassObject.x, but the superclass' x is hidden. The\
    \ solution to this problem is object casting. We can cast a subclass object to\
    \ any of its superclass objects. Consider an example with two classes Parent and\
    \ Child, both declaring an instance variable x. Class Parent is superclass of\
    \ class Child. An instance (object) of class Child would contain instances instances\
