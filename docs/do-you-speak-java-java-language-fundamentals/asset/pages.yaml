  md: "# Character Output Streams\n\nAll character data in Java is represented in\
    \ the Unicode format. The character output stream classes convert Unicode characters\
    \ into their local representation (e.g. ASCII format) before sending them to output\
    \ devices or other streams. Another function of the character output streams is\
    \ to generate a character representation of any primitive type, as well as objects.\
    \ This is implemented via the print and println methods of the class PrintWriter.\
    \ These methods are overloaded (i.e. there are multiple versions of them) and\
    \ can accept primitive data types, Strings, character arrays, or objects.\n\n\
    Similar to the output stream classes that extend the OutputStream class, the character\
    \ stream classes extend the Writer abstract class and its write methods.\n\nThe\
    \ following program uses two different character output streams to write an array\
    \ of characters into a file:\n\n```\nimport java.io.*;\nclass testcharStreams\
    \ {\n    public static void main(String args[]) {\n        char[] c = {'a', 'b',\
    \ 'c'};\n\n        FileWriter filewriter =;\n        PrintWriter printout;\n\n\
    \        try {\n            fileout = new FileWriter(\"write.txt\");\n       \
    \     fileout.write(c, 0, 3);\n            fileout.flush();\n\n            printout\
    \ = new PrintWriter(\"print.txt\");\n            printout.println(123.4);\n  \
    \          printout.flush();\n        }\n        catch (IOException e) {\n   \
    \         System.out.println(\"I/o error\");\n        }\n    }\\}\n```\n\n> Push\
    \ the first three characters of array c into an internal buffer\n\n> Push data\
    \ out of the buffer\n\n> Convert the double number 123.4 into a character representation\
    \ and put it into a buffer\n\n> Push data out of the buffer"
