    \ type into it when an object of that type is needed. Auto-unboxing is the reverse\
    \ process; it retrieves a primitive type from a type wrapper object when it is\
    \ needed.\n\nExample:\n\n```\nclass testwrapper {\n    public static double test(Integer\
    \ N) {return N;}\n    public static void main(String args[]) {\n    int n = 123;\n\
