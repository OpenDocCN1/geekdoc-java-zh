  md: '# Method Reference


    The method reference feature allows you to create a reference to a method without
    executing the method. That reference then can be passed to another method for
    execution using the double colon \:" operator. The following diagram and corresponding
    program code illustrates the process:


    ![](img/5cf5236b394075810b8edd6af6a34316_92_0.png)


    ```

    interface F {

    void execute();

    }

    class myClass {

    static void common(F obj) { obj.execute(); }

    void myMethod() {...}

    public static void main(String[] args) {

    common(myClass::myMethod);

    }

    }

    ```


    The common() method is defined to accept an object of the functional interface
    F and run its execute() method. At runtime, the method reference operator (\:\:)
    creates an instance of the functional interface F (because the common() method
    expects it whose execute() method points to method1). Then, the instance of F
    is passed to the common() method, and method1() is executed. Note that method
    passing as reference must have the same signature (return type and the types of
    parameters) as the method defined by the functional interface.'
