  md: "# The Stream API\n\nStream API is a new application programming interface added\
    \ in JDK 8. It is not an extension to or a replacement of the previously discussed\
    \ I/O streams (byte and character streams). The stream API introduced a new stream\
    \ concept. It sees any stream as a sequence of objects on which various manipulations\
    \ are performed. Using the stream API classes, we can apply different transformations\
    \ to the stream (sorting, filtering, etc.) and produce either another stream (i.e.\
    \ sequence of objects) or a final result. There are no ultimate “destination points”\
    \ like files or network sockets. For example, we might want to find the array\
    \ element with the highest value. In this case the result is not a destination,\
    \ but rather some value derived from the source data, Note that the data source\
    \ remains unchanged in stream processing.\n\nLet’s start with a very small and\
    \ simple example.\n\n// Find the lowest value stored in an array of integers\n\
    \n```\nimport java.util.*;\nimport java.util.stream.*;\n```\n\n```\nclass testStreamAPI\
    \ {\n    public static void main (String[] args) {\n        int[] integers = {8,\
    \ 5, 7, 2, 3, 4};\n        IntStream inputStream = Arrays.stream(integers);\n\
    \        OptionalInt val = inputStream.min();\n        System.out.println(val.getAsInt());\n\
    \    }\n```\n\n> The static method stream()\nof class Arrays converts the array\
    \ integers into a sequential stream of integers\n\n> The min() method of IntStream\n\
    finds the minimum element of the stream and returns it as an OptionalInt\n\n>\
    \ The getAsInt() method of the OptionalInt\nretrieves the integer value.\n\nWhat\
    \ should be noted about this example is that the min() method applied to the stream\
    \ produces a final result, i.e. the result is not a stream. Methods that produce\
    \ final results are known as terminal operations, consume the stream. Other methods\
    \ that return the result as another stream are called intermediate operations.\
    \ The next example presents two-stage stream processing involving intermediate\
    \ and terminal methods."
