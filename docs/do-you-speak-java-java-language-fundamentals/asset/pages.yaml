  md: "# Daemon Threads\n\nWhen you execute the previous program, you will notice\
    \ that the main thread ends once you hit Enter, but the thread will continue running\
    \ until you hit again. Threads that continue execution after the parent thread\
    \ dies are called user threads. Another type of threads is called daemon threads.\
    \ A daemon thread dies once its parent thread dies. By default, a newly created\
    \ thread is a daemon; to make it a daemon, you need to mark it as such by calling\
    \ setDaemon(true). Make sure it is done before you start the thread:\n\n```\n\
    Thread th = new Thread(new myClass() );\nth.setDaemon(true);\nth.start();\n```\n\
    \n# Interrupting Thread Execution\n\nA thread can be interrupted by another thread\
    \ via the instance method interrupt():\n\n```\nThread th = new Thread(new myClass()\
    \ );\nth.start();\n```\n\n```\nth.interrupt();\n```\n\nThe interrupt method sets\
    \ a flag in the thread object, which has to be checked in the run() method to\
    \ have any effect.\n\n```\npublic void run() {\n    if (Thread.interrupted())\
    \ {\n        System.out.println(\"I was interrupted\");\n    }\n}\n```\n\nNote\
    \ that interrupt() is an instance method, and interrupted() is a static method.\n\
    \nNeither of these methods stop tread execution. They merely allow to \"send a\
    \ signal\" to the thread, but how to process this \"signal\" is up to the thread\
    \ being interrupted."
